    在上面提供的示例代码中，控制流有两种可能的路径。如果条件为真，CPU 将跳转并执行 A、B 和 D。但如果条件结果为假，控制流将跳转并执行 A、C 和 D
    语句。


    ## 条件语句


    条件语句允许你在代码中形成一个汇点并将其发送到不同的路径，而不是保持为线性代码。C++ 的条件语句是 `if` 语句——如果某个条件为假，程序应该执行一段代码；如果为真，则执行另一段代码：


    ![](img/00039.jpeg)


    你知道第 1 行和第 5 行的意思，但第 3 行稍有不同——这是一个 `if` 语句。它的作用是检查整数变量是否小于 `2\`。如果是，它将运行一段代码；如果不是，它将正常继续。如果你编译并运行这里写的内容，你将在屏幕上看到打印出“a
    is less than 2!”


    ## 循环


    循环用于需要重复使用代码的程序。它们将代码放入循环中，直到条件满足。想象一下，如果你编写一段代码，每行打印从 1 到 100 的数字。为此类程序编写代码将非常困难且耗时。对于这种情况，我们使用循环。循环使控制流保持在循环中，直到条件满足。


    所以，我们的代码现在读取用户输入，它可以根据这些输入执行各种不同的操作，但现在我们将观察如何让这些代码反复执行相同的操作，只是使用的参数略有不同。为了做到这一点，我们需要使用循环，循环是一段重复执行不同次数的代码，直到它完成了需要执行的任务并满足了特定的
    C++ 条件。C++ 有三种不同类型的循环：


    * `while`

    * `for`

    * `do`


    `while` 循环是最简单的，看起来与 `if` 语句非常相似：


    ![](img/00040.gif)


    这里 `while` 循环的作用是说，只要用户输入的变量不等于 `10`，代码就需要从用户那里获取某些输入。在 C++ 中，感叹号（`!`）表示“不”，所以
    `!` 意味着“不等于”。


    在这种情况下，如果用户输入的已经是 `10`，那么代码将不会被执行，循环也将被忽略。从事实上，`while` 循环被看作是一个扩展的 `if` 语句，在代码运行后会回到其内部。


    在继续之前，我想向你展示无限循环是什么样的，即一个一直运行的循环：


    ![](img/00041.gif)


    如你所见，它是如果 1 等于 1，就打印一个 a，以此此类推。


    下一个简单的循环是 `do while` 循环，因为它与 `while` 循环相似。


    ![](img/00042.gif)


    虽然它看起来与 `while` 循环有些不同，但它本质上在做相同的工作，只有一个重要的区别——`while` 循环检查条件并查看其是否为真，而 `do while`
    循环先运行代码，然后再检查条件是否为真。因为这样，所有的代码都会保证运行。


    第三种 C++ 循环是 `for`，这是最复杂的一种。但一旦你理解了它，你就会发现它是最强大的。在这里，我们只看简单的用法：


    ![](img/00043.gif)


    这段代码的意思是，首先将 `i` 的值设置为 `2\`。然后它说，只要 `i` 小于 `10`，它就将该值输出到屏幕上，然后增加 `i`。你必须记住一点——`for`
    循环第一行中使用的所有变量必须是同一个变量。同样重要的是记住，与 `while` 循环不同，第一个语句是赋值而不是条件判断。


    如果你想处理许多数据，，这种循环很有用，我将在下一节中更多地讨论这一点。现在，如你所见，它能做的最有用的事情就是抛出一系列数字。这是一个很有用的技巧，并顺带带我们进入下一个章节。


    ## If 语句


    ‘if’ 语句是 C++ 中最基本的条件判断语句。它会检查给定的条件，并根据条件的结果改变控制流。


    这里有一个包含 ‘if’ 语句的简单代码。


    ![](img/00044.gif)


    我们已经知道 `if` 语句接受一个语句作为条件。我们还知道可以使用块（Block）来代替单个语句。这意味着我们可以在 `if` 语句内部使用代码块作为条件。下面的示例展示了在
    `if` 语句中使用代码块作为条件。


    ![](img/00045.jpeg)


    你也可以将一个 `if` 语句放在另一个 `if` 语句内部。内部另一个 `if` 语句的 `if` 语句被称为嵌套 `if`。


    这里有两个示例，可以帮助你更好地理解嵌套 `if`。


    示例 1：


    ![](img/00046.jpeg)


    示例 2：


    ![](img/00047.jpeg)


    你可以将一个 `if` 语句放入块中并附加 `else` 语句。你可以看下面的示例。


    ![](img/0048.jpeg)


    ## 带有逻辑运算符的 If 语句


    可以使用带有逻辑运算符的 `if` 语句同时检查多个条件。示例代码如下：


    ![](img/0049.jpeg)


    ‘if’ 语句可以用于提前返回。提前返回无非将控制回到函数的结尾。


    ![](img/0050.jpeg)


    ## Switch 语句


    Switch 语句也是改变控制流的语句。Switch 语句使用多路分支。


    与 if else 语句相比，switch 语句由于以下原因更为优：


    * Switch 语句更容易调试

    * 这些语句易于维护

    * Switch 语句执行更快

    * 它们更易读

    * Switch 语句的深度是固定的

    * 可用于异常处理


    switch 语句的基本语法如下。


    `case constant1:`

    如果 n 等于 constant1 则执行代码；

    `break;`

    `case constant2:`

    如果 n 等于 constant2 则执行代码；

    `break;`

    `.`

    `.`

    `.`

    `default:`

    如果 n 不匹配任何情况则执行代码；


    下面的程序展示了为什么 switch 比 if-else 语句更好用。


    示例：


    ![](img/0051.jpeg)


    现在看使用 switch 语句解决相同的问题。


    ![](img/0052.jpeg)


    ## Break 语句


    我们经常使用 `break` 语句终止 case 语句而不是整个函数。这将指示编译器放弃当前的 case 并继续执行下一个语句。因此，在 `break` 语句之后，控制流进入
    switch 块之后的语句。这里有一个展示在 case 语句后附加 `break` 语句的示例。


    ![](img/0053.jpeg)


    ## Goto


    为了让 CPU 跳到代码中的不同位置，我们使用了称为 `goto` 语句的流控制语句。为此，我们需要设置一个 `goto` 语句可以识别的标记标记。下面的示例如果输入了负数，`goto`
    语句将控制流带到 `tryAgain` 标记，在那里必须选择非负数。


    示例 1：


    ![](img/0054.jpeg)


    示例 2：


    ![](img/0055.jpeg)


    ## While


    在所有循环中，`while` 是最简单的。`while` 循环与 ‘if’ 语句非常相似。在这里，条件放在 `while` 语句之后。这将控制流带到程序的开头，并将其放入循环中直到条件满足。


    每当代码在成功执行后回到开头时，被称为完成了一次迭代。


