    # Chapter 5: Functions


    Functions are nothing but statements that can be reused for doing a particular
    job, as you are already aware of using the `main()` function. Sometimes you will
    need your program to stop what it is doing and do something else in order to work
    efficiently. This is something that we always do. For example you might be working
    on something and pause it to grab some coffee. This is a similar case in case
    of C++ programming when using functions.


    It will continue to run the statements in a sequential manner until it encounters
    a function call. A function call is nothing but an expression, which instructs
    the CPU to pause the current function in order to execute a different function.
    The CPU will just interrupt the current function and will carry on with the execution
    of the function, which is mentioned in the function called. Once the function
    in the functional call is terminated, the CPU will go back to the execution of
    the previous function on which it was working.


    Here, there is an example programme, which shows you you functions are defined
    and called.


    ![](images/00004.jpeg)


    The above code will display the following output:


    ![](images/00005.jpeg)


    ## Return values


    After the `main` finishes the execution of the code, it will return the value
    back to the caller. This can be done by making use of a `return` statement. If
    the return type of function is `void`, it will not return any value. If the return
    type is `int`, it will return an integer value.


    For example:


    ![](images/00006.jpeg)


    Here is an example where these functions are used in a program.


    ![](images/00007.jpeg)


    As you can see, in the first function call, the value 5 is returned using the
    `return5()` statement. There, the value 5 will be returned to the caller and the
    same value will be passed to the `cout` statement.


    When it comes to the second function call, `return5()` is executed and 5 is returned.
    Then `5+2` is carried out and 7 is sent to the `cout` statement.


    When coming to the third statement, `returnNothing()` is called and it will simply
    not return anything.


    When it comes with fourth function call, the function returns nothing and the
    control goes back to the `main()`.


    ## Returning to Main


    When a program is executed, the OS will make the function call to the `main()`
    function. Then the execution will jump back to the top of the name and the statements
    that are present in the `main` will be executed in a sequential manner. Finally,
    an integer value will be returned back to the `main`. This is the reason why the
    `main()` is defined as `int main()`. Always be careful not to use `;` next to
    the main function as it will terminate the main function and will not I love the
    execution of the program to go any further. When you are using `void main()`,
    the compiler doesn''t care about the return function and only will return nothing.


    ## Reusing functions


    Functions in C++ not confined by the number of times that they can be used. The
    same function can be used over and over again. In fact, in most of the programs,
    the functions will have to be reused.


    Here is an example


    ![](images/00008.jpeg)


    The output of the above program is


    ![](images/00009.gif)


    You should remember that the `main()` function is not the only function that can
    call its other functions. Any function can call on a different function.


    Here is an example function showing that


