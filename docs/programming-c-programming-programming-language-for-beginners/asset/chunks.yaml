  trans: "\n\n`pthread_join()` 子程序将阻塞调用线程，直到指定线程的线程终止为止。当创建一个新线程时，该线程的一个属性将定义该线程是可汇的（joinable）还是可分离的（detached）。你只能加入那些被创建为可汇的线程，而可分离线程在任何情况下都无法加入。\n\
    \n在这个示例中，展示了如何使用 Pthread join 例程来等待线程完成。\n\n示例：\n\n```cpp\n#include <iostream>\n\
    #include <cstdlib>\n#include <pthread.h>\n#include <unistd.h>\n\nusing namespace\
    \ std;\n\n#define NUM_THREADS     5\n\nvoid *wait(void *t)\n{\n  int i;\n  long\
    \ tid;\n  tid = (long)t;\n  sleep(1);\n  cout << \"Sleeping in thread \" << endl;\n\
    \  cout << \"Thread with id : \" << tid << \"  ...exiting \" << endl;\n  pthread_exit(NULL);\n\
    }\n\nint main ()\n{\n  int rc;\n  int i;\n  pthread_t threads[NUM_THREADS];\n\
    \  pthread_attr_t attr;\n  void *status;\n  // Initialize and set thread joinable\n\
    \  pthread_attr_init(&attr);\n  pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_JOINABLE);\n\
    \  for( i=0; i < NUM_THREADS; i++ ){\n      cout << \"main() : creating thread,\
    \ \" << i << endl;\n      rc = pthread_create(&threads[i], NULL, wait, (void *)i\
    \ );\n      if (rc){\n        cout << \"Error:unable to create thread,\" << rc\
    \ << endl;\n        exit(-1);\n      }\n  }\n  // free attribute and wait for\
    \ the other threads\n  pthread_attr_destroy(&attr);\n  for( i=0; i < NUM_THREADS;\
    \ i++ ){\n      rc = pthread_join(threads[i], &status);\n      if (rc){\n    \
    \    cout << \"Error:unable to join,\" << rc << endl;\n        exit(-1);\n   \
    \   }\n      cout << \"Main: completed thread id :\" << i;\n      cout << \" \
    \ exiting with status :\" << status << endl;\n  }\n  cout << \"Main: program exiting.\"\
    \ << endl;\n  pthread_exit(NULL);\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\n```\nmain()\
    \ : creating thread, 0\nmain() : creating thread, 1\nmain() : creating thread,\
    \ 2\nmain() : creating thread, 3\nmain() : creating thread, 4\nSleeping in thread\n\
    Thread with id : 0 .... exiting\nSleeping in thread\nThread with id : 1 .... exiting\n\
    Sleeping in thread\nThread with id : 2 .... exiting\nSleeping in thread\nThread\
    \ with id : 3 .... exiting\nSleeping in thread\nThread with id : 4 .... exiting\n\
    Main: completed thread id :0  exiting with status :0\nMain: completed thread id\
    \ :1  exiting with status :0\nMain: completed thread id :2  exiting with status\
    \ :0\nMain: completed thread id :3  exiting with status :0\nMain: completed thread\
    \ id :4  exiting with status :0\nMain: program exiting.\n```\n\n# 结论\n\n到此我对 C++\
    \ 计算机语言的讲解就了。我希望能够对如何开始 C++ 计算机编程提供一些思路。一旦你掌握了基础并学会了如何应用每条规则，在编程方面世界将完全属于你。\n\n\
    重要的是你要学习每个运算符、变量、循环和条件语句是如何独立工作的，以及如何将它们组合起来生成你想要编写程序的代码。这门语言并不难学，但它需要你全神贯注才能正确，否则你的编译器将抛出各种错误，你的程序也将无法运行。\n\
    \n祝你的编程之旅愉快，并好运！\n\n## 你可能也会喜欢我的其他书籍！\n\n- [PYTHON: 初学者编程指南：一天学会！](http://hyperurl.co/python)\n\
    hyperurl.co/python\n\n- [JAVA: Java 编程、JavaScript、代码编码：编程指南：一天学会！](http://hyperurl.co/javaos)\n\
    hyperurl.co/javaos\n\n- [SQL: 编程指南：Javascript 和代码编码：一天学会！](http://smarturl.it/sql)\n\
