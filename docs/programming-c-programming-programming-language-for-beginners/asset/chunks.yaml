    ## Bitwise operators


    Within a given variable, the bit manipulation operators are used to manipulate
    the bits of data. Earlier days computers did not have much storage capacities
    and memory was very expensive. So to bitwise operators were created to solve this
    problem. In total, we have six bit manipulation operators. They explained in the
    table below.


    | Operator | Symbol | Form | Operation |

    | :--- | :--- | :--- | :--- |

    | left shift | `<<` | `x << y` | all bits in `x` shifted left `y` bits |

    | right shift | `>>` | `x >> y` | all bits in `x` shifted right `y` bits |

    | bitwise NOT | `~` | `~x` | all bits in `x` flipped |

    | bitwise AND | `&` | `x & y` | each bit in `x` AND each bit in `y` |

    | bitwise OR | `|` | `x | y` | each bit in `x` OR each bit in `y` |

    | bitwise XOR | `^` | `x ^ y` | each bit in `x` XOR each bit in `y` |


    In C++, we also have Bitwise assignment operators. These help the users with easy
    variable modifications.


    | Operator | Symbol | Form | Operation |

    | :--- | :--- | :--- | :--- |

    | Left shift assignment | `<<=` | `x <<= y` | Shift `x` left by `y` bits |

    | Right shift assignment | `>>=` | `x >>= y` | Shift `x` right by `y` bits |

    | Bitwise OR assignment | `|=` | `x |= y` | Assign `x | y` to `x` |

    | Bitwise AND assignment | `&=` | `x &= y` | Assign `x & y` to `x` |

    | Bitwise XOR assignment | `^=` | `x ^= y` | Assign `x ^ y` to `x` |


    ## Blocks


    A block is nothing but a block of statements. The block is also known by the name
    compound statement. It is nothing but a group of statements that are considered
    to be a single statement by the compilers. They begin and end with `{` and `}`
    symbols. These compound statements can be used anywhere in place of the statements.
    These do not need a `;` to terminate the statement. These blocks can be placed
    separately or they can also be placed inside another block. These kinds of blocks
    are called as nested blocks. Here are some examples of blocks in the sample code
    given below.


