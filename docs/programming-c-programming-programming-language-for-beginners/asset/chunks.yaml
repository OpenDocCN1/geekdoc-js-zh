  trans: "\n\n## extern 存储类\n\n有一些全局变量对所有程序文件都是可见的。`extern` 存储类可以用于提供这些对程序文件可见的全局变量引用。你不能使用\
    \ `extern` 初始化变量，因为它只会指向一个预定义的存储位置的争议性名称。\n\n当你有多个文件，并且定义了一个其他文件可以使用的函数或全局变量时，你可以在另一个文件中通过\
    \ `extern` 来提供该函数或变量的引用。简单来说，我们使用 `extern` 来声明存在于另一个文件中的函数或全局变量。\n\n在多个文件共享相同函数或全局变量的情况下，会使用\
    \ `extern` 修饰符。这是一个示例程序。\n\n### 示例：\n\n第一个文件：main.cpp\n\n```cpp\n#include <iostream>\n\
    \nint count ;\n\nextern void write_extern();\n\nmain()\n{\n  count = 5;\n  write_extern();\n\
    }\n```\n\n第二个文件：support.cpp\n\n```cpp\n#include <iostream>\n\nextern int count;\n\
    \nvoid write_extern(void)\n{\n  std::cout << \"Count is \" << count << std::endl;\n\
    }\n```\n\n在这里，程序中的 `count` 是在另一个文件中使用 `extern` 关键字声明的。现在，如果你像下面组合这两个文件。\n\n```bash\n\
    $g++ main.cpp support.cpp -o write\n```\n\n将产生一个正确的可执行程序。现在尝试执行它并检查如下所示的结果。\n\n\
    ```bash\n./write\n5\n```\n\n# 第 9 章：数组\n\n数组无非变量的列表，所有变量因为具有共同的用途而被聚集在一起。它更像是一种保持一切整洁有序的方法，正如从下面的代码所示：\n\
    \n```cpp\nint a[5]\n```\n\n它看起来像一个标准变量，但注意方括号的使用。这些括号包含了你在声明中需要的数组大小，或者说是变量的数量，在这种情况下是\
    \ 5 个整数变量。数组可以是任何你想要的，只要你的电脑有足够的 RAM 来支持，但它们在任何时候只能包含一种类型的变量。\n\n当访问某个变量时，只需在方括号内放入数字即可。只需记住，当\
    \ C++ 标记变量或任何内容时，它是从 0 开始而不是 1 开始。考虑到计算机是如何理解数字的，这是有意义的。如果你的数组有 8 个项目，而你从数字 1\
    \ 开始，你的计算机只能读取前 7 个位置（二进制 – 1-7）。你也可以让它使用 0，但那样 0 就是第一个变量。下面的代码显示了你如何处理访问列表中第一个之前的变量：\n\
    \n![](img/00075.jpeg)\n\n你应该记住的一点是，你不应该尝试访问不存在的变量，例如，只有 6 个位置的数组中的第 9 个变量，或者实际上没有分配变量的变量。在这种情况下，你将得到所谓的“垃圾”值，因为计算机返回的仅仅是这样——垃圾。\n\
    \n在第一种情况下，你会得到段错误（segmentation fault），之所以这样命名是因为计算机正试图进入它不被允许进入的内存段。这可能导致程序意外终止，并附带错误报告。为了避免发生任何此类情况，养成在开始之前初始化数组每个位置的习惯。就像普通变量一样，看起来像这样：\n\
    \n```cpp\nint a[5] = { 0, 0, 0, 0, 0 };\n```\n\n重要——注意大括号。这些括号内的每个项目（用逗号隔开）都被分配给数组中的特定变量。第一个设置为括号内的第一个值，第二个设置为第二个，依此类推。如果数组没有填满，每个未分配的变量将返回\
    \ 0：\n\n```cpp\nint a[5] = { 1 };\n```\n\n你声明了会有 5 个变量，但只指定了 1 个，所以其他的将显示为 0。\n\
    \n数组最用途之一是显示列表，也许是一组人的年龄，或者正如我稍后向你展示的，使用它们来协调大表格和地图中的空间。\n\n上面的数组被称为一维数组。这对于列表很有用，但地图呢？在这种情况下，你需要一个二维数组，而最简单的方法就是直接添加第二组方括号：\n\
    \n```cpp\nint array[4][5];\n```\n\n所以，第一维度显示 4 个整数，第二个维度是 5 个整数。从物理地图的角度考虑数组，我们可以说这一个是\
    \ 4 X 5，或者可以是 5 X 4。访问数组与访问一维数组相同，区别在于我们使用的方括号数量：\n\n```cpp\ncout << array[0][1];\n\
    ```\n\n就像你处理一维数组一样，你可以批量定义一个 t 维数组——你做的只是添加第二组大括号：\n\n```cpp\nint array[2][2]\
    \ = { {0, 0}, {1, 1} };\n```\n\n这看起来并没有那么复杂——它只是将第 1 行设为 0, 0，将第 2 行设为 1, 1。只要你记住配对括号，一切都会就绪。如果你想遍历二维数组，只需在每个循环内部嵌套另一个循环：\n\
    \n![](img/0076.gif)\n\n# 第 10 章：类、对象、接口\n\n## 类和对象\n\n设计 C++ 的主要目的是在 C 语言中引入面向对象编程的概念。在面向对象编程中，类是核心特性。这些类被称为自定义类型。\n\
    \n类可以被认为是一个整洁的包，结合了数据展示和对该数据的方法。对象的形状由类指定。类内部的函数和数据形成了类的成员。\n\n## 封装\n\n每个 C++\
    \ 程序都包含以下两个基本元素。\n\n*   程序语句（代码）：程序语句是程序中执行特定操作的部分。这些被称为函数。\n\n*   程序数据：数据可以被视为给定程序的程序，受该程序中函数的影响。\n\
    \n"
- fmt: "\nEncapsulation is a concept in object oriented programming which binds the\
    \ functions and the data that manipulate the data. Encapsulation protects the\
    \ data from the interference and misuse by outer elements. The data encapsulation\
    \ gave rise to an important object oriented programming concept called data hiding.\n\
    \nData encapsulation can be defined as a mechanism that bundles the data and the\
    \ functions that use the data. Data abstraction can be defined as a mechanism\
    \ that exposes the interfaces and hides the implementation details.\n\nBy creating\
    \ user defined types called `classes`, encapsulation and data hiding can be performed.\
    \ As we already know, a `class` can contain private, public or protected members.\
    \ The items that are defined in a `class` without access specifiers will by default\
    \ to be private. Here is an example.\n\n### Example:\n\n```cpp\nclass Box\n{\n\
    \  public:\n    double getVolume(void)\n    {\n        return length * breadth\
    \ * height;\n    }\n  private:\n    double length;      // Length of a box\n \
    \   double breadth;  // Breadth of a box\n    double height;      // Height of\
    \ a box\n};\n```\n\nHere, the variables `length`, `breadth`, and `height` are\
    \ private. This means that only the members of the class `Box` are allowed to\
    \ access them. Please variables cannot be accessed by any other part of the program.\
    \ This is one of the methods in which encapsulation can be performed.\n\nIf you\
    \ wish that some parts of your class be public, you should define them using the\
    \ `public` keyword. All the functions and variables that are defined after the\
    \ `public` specifiers will be defined as public and any function in the program\
    \ can access them.\n\nBy making a particular class a friend of another class will\
    \ expose the implementation details and results in the reduction of encapsulation.\
    \ It is always wise to keep the details of the class hidden from other classes.\
    \ As many classes as possible should be hidden.\n\nAny C++ program where `class`\
    \ is implemented with private and public members can be considered as an example\
    \ for data abstraction and data encapsulation. Consider this example below.\n\n\
    ### Here is an example on data encapsulation.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nclass Adder\n{\n  public:\n    // constructor\n    Adder(int\
    \ i = 0)\n    {\n        total = i;\n    }\n    // interface to outside world\n\
    \    void addNum(int number)\n    {\n        total += number;\n    }\n    // interface\
    \ to outside world\n    int getTotal()\n    {\n        return total;\n    };\n\
    \  private:\n    // hidden data from outside world\n    int total;\n};\n\nint\
    \ main( )\n{\n  Adder a;\n  a.addNum(10);\n  a.addNum(20);\n  a.addNum(30);\n\
    \  cout << \"Total \" << a.getTotal() << endl;\n  return 0;\n}\n```\n\nWhen you\
    \ compile and execute the above code, it will produce the following output.\n\n\
    Total 60\n\nThe above class will add the numbers and will return their sum. Here\
    \ the members `addNum` and `getTotal` are public and they are the interfaces which\
    \ the user should know for use the class. Though the private members in the class\
    \ are hidden, they are needed for the proper operation of the class.\n\n### Designing\
    \ Strategy\n\nIt is always wise to hide the contents of a class by making it private\
    \ unless we wish to expose them. This is good encapsulation.\n\nMostly the data\
    \ members kept hidden but this equally applies to other members also which include\
    \ virtual functions too.\n\n## C++ Class Definitions\n\nWhenever you are defining\
    \ a class, you are basically defining a blueprint for a given data type. Though\
    \ this won't define any data, defines what the name of the class means, which\
    \ is, the objects that the class consists of and the operations that can be implemented\
    \ on those objects.\n\nThe definition of a class begins with the keyword `class`,\
    \ which is then followed by the name of the class and the body of the class enclosed\
    \ inside curly braces. A list of declarations or a semicolon should be placed\
    \ after the name of the class. Consider the following example in which the `Box`\
    \ is defined by using the `class` keyword.\n\n### Example:\n\n```cpp\nclass Box\n\
    {\n  public:\n    double length;  // Length of a box\n    double breadth;  //\
    \ Breadth of a box\n    double height;  // Height of a box\n};\n```\n\nThe `public`\
    \ keyword will determine the access. The members of the class can be accessed\
    \ by anyone within the scope. The members of the class can be specified as private\
    \ or protected.\n\n## Define C++ Objects\n\nEvery class provides a blueprint for\
    \ its objects. The objects of the class can be created using the `class` keyword.\n\
    \n## Accessing the Data\n\nWith the help of the direct access operator, you can\
    \ access the members. Here is an example:\n\n### Example:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nclass Box\n{\n  public:\n    double length;\
    \  // Length of a box\n    double breadth;  // Breadth of a box\n    double height;\
    \  // Height of a box\n};\n\nint main( )\n{\n  Box Box1;\n  Box Box2;\n  double\
    \ volume = 0;\n  Box1.length = 5.0;\n  Box1.breadth = 6.0;\n  Box1.height = 7.0;\n\
    \  volume = Box1.length * Box1.breadth * Box1.height;\n  cout << \"Volume of Box1\
    \ : \" << volume << endl;\n\n  Box2.length = 10.0;\n  Box2.breadth = 12.0;\n \
    \ Box2.height = 13.0;\n  volume = Box2.length * Box2.breadth * Box2.height;\n\
    \  cout << \"Volume of Box2 : \" << volume << endl;\n\n  return 0;\n}\n```\n\n\
    When you compile and execute the above code, it will produce the following output.\n\
    \nVolume of Box1 : 210\nVolume of Box2 : 1560\n\nYou should always keep in mind\
    \ that the protected and private members of the class cannot be directly accessed\
    \ with the member access operator. Now, we will see how these are handled.\n\n\
    ## Classes & Objects in Detail\n\nTill now, we have dealt with the basic concepts\
    \ of the classes and objects in C++. We will discuss some more concerts in the\
    \ subsections given below.\n\n| Concept | Description |\n| :--- | :--- |\n| Class\
    \ member functions | A section of the class can be defined as a function which\
    \ has its prototype or its definition inside the class which is similar to any\
    \ other variable. |\n| Class access modifiers | The members of the class can be\
    \ declared as public, protected or private. The default access definition for\
    \ the members is always private. |\n| Constructor & destructor | A class constructor\
    \ can be defined as a special function within a class which is called whenever\
    \ there is a new object is created in that class. A destructor is similar to a\
    \ constructor but it is called whenever you delete created object. |\n| C++ copy\
    \ constructor | A copy constructor is a type of constructor which is used for\
    \ creating objects by using an object of that class which is already created.\
    \ |\n| C++ friend functions | A friend to function is something which can access\
    \ the private and the protected members of a given class. |\n"
  raw: 'Encapsulation is a concept in object oriented programming which binds the
    functions and the data that manipulate the data. Encapsulation protects the data
    from the interference and misuse by outer elements. The data encapsulation gave
    rise to an important object oriented programming concept called data hiding.


    Data encapsulation can be defined as a mechanism that bundles the data and the
    functions that use the data. Data abstraction can be defined as a mechanism that
    exposes the interfaces and hides the implementation details.


    By creating user defined types called classes, encapsulation and data hiding can
    be performed. As we already know, a class can contain private, public or protected
    members. The items that are defined in a class without access specifiers will
    by default to be private. Here is an example.


    Example:


    class Box


    {


      public:


         double getVolume(void)


         {


            return length * breadth * height;


         }


      private:


         double length;      // Length of a box


         double breadth;     // Breadth of a box


         double height;      // Height of a box


    };


    Here, the variables length, breadth, and height are private. This means that only
    the members of the class Box are allowed to access them. Please variables cannot
    be accessed by any other part of the program. This is one of the methods in which
    encapsulation can be performed.


    If you wish that some parts of your class be public, you should define them using
    the public keyword. All the functions and variables that are defined after the
    public specifiers will be defined as public and any function in the program can
    access them.


    By making a particular class a friend of another class will expose the implementation
    details and results in the reduction of encapsulation. It is always wise to keep
    the details of the class hidden from other classes. As many classes as possible
    should be hidden.


    Any C++ program where class is implemented with private and public members can
    be considered as an example for data abstraction and data encapsulation. Consider
    this example below.


    Here is an example on data encapsulation.


    Example:


    #include <iostream>


    using namespace std;


    class Adder{


      public:


         // constructor


         Adder(int i = 0)


         {


           total = i;


         }


         // interface to outside world


         void addNum(int number)


         {


             total += number;


         }


         // interface to outside world


         int getTotal()


         {


             return total;


         };


      private:


         // hidden data from outside world


         int total;


    };


    int main( )


    {


      Adder a;


      a.addNum(10);


      a.addNum(20);


      a.addNum(30);


      cout << "Total " << a.getTotal() <<endl;


      return 0;


    }


    When you compile and execute the above code, it will produce the following output.


    Total 60


    The above class will add the numbers and will return their sum. Here the members
    addNum and getTotal are public and they are the interfaces which the user should
    know for use the class. Though the private members in the class are hidden, they
    are needed for the proper operation of the class.


    Designing Strategy


    It is always wise to hide the contents of a class by making it private unless
    we wish to expose them. This is good encapsulation.


    Mostly the data members kept hidden but this equally applies to other members
    also which include virtual functions too.


    ## C++ Class Definitions


    Whenever you are defining a class, you are basically defining a blueprint for
    a given data type. Though this won''t define any data, defines what the name of
    the class means, which is, the objects that the class consists of and the operations
    that can be implemented on those objects.


    The definition of a class begins with the keyword class, which is then followed
    by the name of the class and the body of the class enclosed inside curly braces.
    A list of declarations or a semicolon should be placed after the name of the class.
    Consider the following example in which the Box is defined by using the class
    keyword.


    Example:


    class Box


    {


      public:


         double length;   // Length of a box


         double breadth;  // Breadth of a box


         double height;   // Height of a box


    };


    The public keyword will determine the access attributes of the class members following
    it. The public members of the class can be accessed by anyone outside the class
    within the scope of that particular class object. The class members can also be
    specified as private or protected and we will discuss it in later sections.


    ## Define C++ Objects


    Every class provides a blueprint for its objects, which implies that objects can
    be created from a class. The declaration of objects in a class is the same kind
    of declaration with which variables of the basic type are declare. For example,
    for declaring two objects of the Box class, we use the following statements.


    Box Box1;          // Declare Box1 of type Box


    Box Box2;          // Declare Box2 of type Box


    The objects Box1 and a Box2 will have their own set of data members.


    ## Accessing the Data Members


    With the help of the direct member access operator (.), you can access the data
    members of an object of a class that are public. Here is an example that will
    help you to get a better understanding on this.


    Example:


    #include <iostream>


    using namespace std;


    class Box


    {


      public:


         double length;   // Length of a box


         double breadth;  // Breadth of a box


         double height;   // Height of a box


    };


    int main( )


    {


      Box Box1;        // Declare Box1 of type Box


      Box Box2;        // Declare Box2 of type Box


      double volume = 0.0;     // Store the volume of a box here


      // box 1 specification


      Box1.height = 5.0;


      Box1.length = 6.0;


      Box1.breadth = 7.0;


      // box 2 specification


      Box2.height = 10.0;


      Box2.length = 12.0;


      Box2.breadth = 13.0;


      // volume of box 1


      volume = Box1.height * Box1.length * Box1.breadth;


      cout << "Volume of Box1 : " << volume <<endl;


      // volume of box 2


      volume = Box2.height * Box2.length * Box2.breadth;


      cout << "Volume of Box2 : " << volume <<endl;


      return 0;


    }


    When you compile and execute the above code, it will produce the following output.


    Volume of Box1 : 210


    Volume of Box2 : 1560


    You should always keep in mind that the protected and private members of the class
    cannot be directly accessed with the director member access operator (.). Now,
    we will see how the protected and private members are accessed.


    ## Classes & Objects in Detail


    Till now, we have dealt with the basic concepts of the classes and objects in
    C++. We will discuss some more concerts in the subsections given below.


    | Concept | Description |


    | [Class member functions](http://www.tutorialspoint.com/cplusplus/cpp_class_member_functions.htm)
    | A A section of the class can be defined as a function which has its prototype
    or its definition inside the class the definition which is similar to any other
    variable. |


    | [Class access modifiers](http://www.tutorialspoint.com/cplusplus/cpp_class_access_modifiers.htm)
    | The members of the class can be declared as public, protected or private. The
    default access definition for the members is always private. |


    | [Constructor & destructor](http://www.tutorialspoint.com/cplusplus/cpp_constructor_destructor.htm)
    | A class constructor can be defined as a special function within a class which
    is called whenever there is a new object is created in that class. A destructor
    is similar to a constructor but it is called whenever you delete created object.
    |


    | [C++ copy constructor](http://www.tutorialspoint.com/cplusplus/cpp_copy_constructor.htm)
    | A copy constructor is a type of constructor which is used for creating objects
    by using an object of that class which is already created. |


    | [C++ friend functions](http://www.tutorialspoint.com/cplusplus/cpp_friend_functions.htm)
    | A friend to function is something which can access the private and the protected
    members of a given class. |'
