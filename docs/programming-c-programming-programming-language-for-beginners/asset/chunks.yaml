    \ up your code. The next chapter details all that you will need to learn to become\
    \ a successful C++ programmer.\n\n# Chapter 2: Basics of C++\n\n## \n\nStructure\
    \ of C++ program\n\nAs we have already discussed, a computer program is nothing\
    \ but a set of instructions in sequence that tell the CPU what to do.\n\nStatements\
    \ and expressions:\n\nIn C++, the statement is nothing but the smallest and an\
    \ independent unit in the program. It is also the most common form of instruction\
    \ in a programming language. In C++, statements are away to convey your instructions\
    \ to the compilers to carry out a specific task. We use ' ; ' to terminate a statement.\
    \ In C++, there are many kinds of statements and some of the most common type\
    \ of statements are given below.\n\nint x;  \n\nx = 5;\n\nstd::cout << x;\n\n\
    We will discuss about the functions of the above statements in the later chapters.\n\
    \n## Functions\n\nFunctions are nothing but statements in a sequence, which are\
    \ executed in a sequential order. There is a function called the main function\
    \ and it is a must in every C++ program. When any given C++ program is run, the\
    \ execution of the program starts within the main function. Functions basically\
    \ have very specific jobs to perform. And they can perform only those jobs. For\
    \ you to become a good C++ programmer you need to know how to use functions efficiently.\
    \ In the next chapter you’ll learn more about functions.\n\n## Libraries and the\
    \ C++ standard library\n\nLibraries are nothing but a collection of code, which\
    \ is pre-compiled. They can be used within different programs. If you wish to\
    \ extend the capabilities of your program you can add libraries.\n\nThe core C++\
    \ language is a simple and minimalistic, but it also comes with the built-in library\
    \ called the C++ standard library. The C++ standard library provides the user\
    \ with additional functionalities.\n\n## Syntax and syntax errors"
