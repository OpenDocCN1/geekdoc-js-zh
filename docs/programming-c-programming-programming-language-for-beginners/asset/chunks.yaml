    | Greater than or equals | >= | x >= y | true if x is greater than or equal to
    y, false otherwise |


    | Less than or equals | <= | x <= y | true if x is less than or equal to y, false
    otherwise |


    | Equality | == | x == y | true if x equals y, false otherwise |


