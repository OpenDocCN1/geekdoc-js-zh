    \ `Charles` 的人，你可以根据他们居住的区域或任何此类信息来区分他们。\n\n现在考虑这种情况在你的应用程序中发生的情况。例如，如果定义了一个特定名称的函数，而在另一个目录下也有同名的函数。在这种情况下，编译器无法区分这两个函数，并且可能不会调用你在代码中引用的那个函数。\n\
    \n为了克服这一困难，我们使用了命名空间（namespaces），它们被专门设计用作额外信息，可以添加到函数、变量和类等，这些元素在不同的库中共享相同的名称。通过使用命名空间，可以定义名称所在的上下文。命名空间用于定义作用域。\n\
    \n## 定义命名空间\n\n你可以使用 `namespace` 关键字来定义命名空间，后面紧跟命名空间的名称。定义命名空间的语法所示。\n\n语法：\n\n\
    ```cpp\nnamespace namespace_name {\n  // 代码声明\n}\n```\n\n要调用函数或变量的命名空间版本，应该在该函数前面添加命名空间名称，如下：\n\
    \n`name::code;` // code 可能是变量或函数。\n\n现在我们将观察命名空间作用域对包含函数和变量的实体。\n\n示例：\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n\
    \  void func(){\n      cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\n\
    namespace second_space{\n  void func(){\n      cout << \"Inside second_space\"\
    \ << endl;\n  }\n}\n\nint main ()\n{\n  // 调用第一个命名空间中的函数。\n  first_space::func();\n\
    \  // 调用第二个命名空间中的函数。\n  second_space::func();\n  return 0;\n}\n```\n\n当你编译并运行这段代码时，将产生以下输出。\n\
    \nInside first_space\n\nInside second_space\n\n## using 指令 (The using directive)\n\
    \n通过 `using namespace` 指令，可以避免添加命名空间前缀。该指令将指示编译器，后续代码在使用指定命名空间中的名称。\n\n你也可以通过\
    \ `using namespace` 指令来避免添加命名空间前缀。该指令告诉编译器，后续代码正在使用指定命名空间中的名称。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n  void\
    \ func(){\n      cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\n\
    namespace second_space{\n  void func(){\n      cout << \"Inside second_space\"\
    \ << endl;\n  }\n}\n\nint main ()\n{\n  // 调用第一个命名空间中的函数。\n  first_space::func();\n\
