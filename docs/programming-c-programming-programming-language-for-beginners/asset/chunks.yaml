- fmt: "\n| [C++ inline functions](http://www.tutorialspoint.com/cplusplus/cpp_inline_functions.htm)\
    \ | In an in-line function the compiler will expand record within the function's\
    \ body in the place of a call to that function. |\n| [The this pointer in C++](http://www.tutorialspoint.com/cplusplus/cpp_this_pointer.htm)\
    \ | In C++, every object will have a special pointer which points itself. |\n\
    | [Pointer to C++ classes](http://www.tutorialspoint.com/cplusplus/cpp_pointer_to_class.htm)\
    \ | A pointer to a class is similar to a pointer to a structure. In fact, a class\
    \ can be considered as a structure which has functions in it. |\n| [Static members\
    \ of a class](http://www.tutorialspoint.com/cplusplus/cpp_static_members.htm)\
    \ | The function members and the data members of any class can be declared static.\
    \ |\n\n# Interfaces\n\nThe capabilities or behavior of a class in C++ without\
    \ committing to an implementation of its class can be described by an interface.\n\
    \nThe interfaces in C++ are implemented with the abstract classes. Do not confuse\
    \ Data abstraction with the abstract classes. The data abstraction is it different\
    \ concept where the implementation details separated from the associated data.\n\
    \nBy declaring any one function of a class as a pure virtual function, that class\
    \ can be made abstract. You can specify a pure virtual function by adding `= 0`\
    \ in its declaration. It is given in the example below.\n\n```cpp\nclass Box\n\
    {\n  public:\n    // pure virtual function\n    virtual double getVolume() = 0;\n\
    \n  private:\n    double length;      // Length of a box\n    double breadth;\
    \      // Breadth of a box\n    double height;      // Height of a box\n};\n```\n\
    \nThe main purpose of any abstract class is to provide a proper base class so\
    \ that other classes can inherit this base class. Objects cannot be instantiated\
    \ using abstract classes. Abstract classes can only serve as interfaces. A compilation\
    \ error will be raised when an object of an abstract class is tried to instantiated.\n\
    \nIf you wish to instantiate a subclass of an abstract class, each of its virtual\
    \ functions should be implemented. This implies that it will support the interface\
    \ declared by the abstract class. When the pure virtual function override fails\
    \ in a derived class and then trying to instantiate the objects that class will\
    \ give a compilation error.\n\nIn C++, the classes used for instantiating objects\
    \ are defined as concrete classes.\n\n## Abstract Class Example\n\nIn the following\
    \ example, The parent class gives an interface for the base class to implement\
    \ the function `getArea()`.\n\nExample:\n\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\n// Base class\nclass Shape\n{\npublic:\n  // pure virtual\
    \ function providing interface framework.\n  virtual int getArea() = 0;\n\n  void\
    \ setWidth(int w)\n  {\n      width = w;\n  }\n\n  void setHeight(int h)\n  {\n\
    \      height = h;\n  }\n\nprotected:\n  int width;\n  int height;\n};\n\n// Derived\
    \ classes\nclass Rectangle: public Shape\n{\npublic:\n  int getArea()\n  {\n \
    \     return (width * height);\n  }\n};\n\nclass Triangle: public Shape\n{\npublic:\n\
    \  int getArea()\n  {\n      return (width * height)/2;\n  }\n};\n\nint main(void)\n\
    {\n  Rectangle Rect;\n  Triangle Tri;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n\
    \  // Print the area of the object.\n  cout << \"Total Rectangle area: \" << Rect.getArea()\
    \ << endl;\n\n  Tri.setWidth(5);\n  Tri.setHeight(7);\n  // Print the area of\
    \ the object.\n  cout << \"Total Triangle area: \" << Tri.getArea() << endl;\n\
    \n  return 0;\n}\n```\n\nWhen you compile and execute the above code, it will\
    \ produce the following output.\n\nTotal Rectangle area: 35\nTotal Triangle area:\
    \ 17\n\nIn the above example, an interface is defined by an abstract class in\
    \ terms of `getArea()`. The same function was implemented by two other classes\
    \ but with different for calculating the area that is specific to the given shape.\n\
    \n## Designing Strategy\n\nAn abstract base class can be used by an object oriented\
    \ system for providing a standardized and a common interface that is appropriate\
    \ for all of the external applications. Then, the classes can be inherited from\
    \ the abstract base class and these classes will all operate similarly.\n\nAll\
    \ the capabilities (public functions) better offered by the external applications\
    \ will be provided as pure virtual functions from the given abstract base class.\
    \ The derive classes will provide the implementations of these pure virtual functions.\
    \ Each of these are derived classes correspond to a specific type of application.\n\
    \nWith this architecture you are allowed to add new applications to a system after\
    \ it defined.\n\n# Chapter 1: Templates\n\nTemplates can be considered as foundation\
    \ of generic programming. Generic programming involves coding in that is independent\
    \ from particular type. You can think of a template as a formula or a blueprint\
    \ with which generic classes or functions can be created. A few examples of genetic\
    \ programming are the library containers which are developed using the concept\
    \ of template. Every container such as `vector` has a single. But different kinds\
    \ can be defined. For example `vector<string>` or `vector<int>`. Using templates,\
    \ apart from classes can be defined as well. Now we will see it works.\n\n## Function\
    \ Template\n\nThe general syntax of a template definition is given below.\n\n\
    ```cpp\ntemplate <class type>\nret func-name(parameter)\n{\n    // body of function\n\
    }\n```\n\nHere, the placeholder `name` for a data type is used by the function.\
    \ Within the definition of the function, this `name` can be used. Here is an example:\n\
    \nThe function template in the following examples will return maximum of two values.\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate\
    \ <typename T>\ninline T& Max (T const& a, T const& b)\n{\n    return a < b ?\
    \ b:a;\n}\n\nint main ()\n{\n  int i = 39;\n  int j = 20;\n  cout << \"Max(i,\
    \ j): \" << Max(i, j) << endl;\n\n  double f1 = 13.5;\n  double f2 = 20.7;\n \
    \ cout << \"Max(f1, f2): \" << Max(f1, f2) << endl;\n\n  string s1 = \"Hello\"\
    ;\n  string s2 = \"World\";\n  cout << \"Max(s1, s2): \" << Max(s1, s2) << endl;\n\
    \  return 0;\n}\n```\n\nIf you compile and execute the given code, it will produce\
    \ following output.\n\nMax(i, j): 39\nMax(f1, f2): 20.7\nMax(s1, s2): World\n\n\
    ## Class Template\n\nIn C++, apart from defining function you can define class\
    \ templates as well. The generic class syntax is given below.\n\nSyntax:\n\n```cpp\n\
    template <class type>\nclass-name {\n//...\n};\n```\n\nFrom the syntax above,\
    \ `type` is the placeholder name. This `type` will be specified during the instantiation\
    \ of a class. Multiple generic types can be defined by separating them with `,`.\
    \ In the following example, a class `Stack<>` is defined. Generic method to push\
    \ and pop the stack elements will be implemented.\n\nExample:\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n#include <cstdlib>\n#include <string>\n#include\
    \ <stdexcept>\nusing namespace std;\n\ntemplate <class T>\nclass Stack {\n  private:\n\
    \    vector<T> elems; // elements\n  public:\n    void push(T const&); // push\
    \ element\n    void pop();         // pop element\n    T top() const;      //\
    \ return top element\n    bool empty() const{ // return true if empty.\n     \
    \ return elems.empty();\n    }\n};\n\ntemplate <class T>\nvoid Stack<T>::push\
    \ (T const& elem)\n{\n  // append copy of passed element\n  elems.push_back(elem);\n\
    }\n\ntemplate <class T>\nvoid Stack<T>::pop ()\n{\n  if (elems.empty()) {\n  \
    \  throw out_of_range(\"Stack<>::pop(): empty stack\");\n  }\n  // remove last\
    \ element\n  elems.pop_back();\n}\n\ntemplate <class T>\nT Stack<T>::top () const\n\
    {\n  if (elems.empty()) {\n    throw out_of_range(\"Stack<>::top(): empty stack\"\
    );\n  }\n  // return copy of last element\n  return elems.back();\n}\n\nint main()\n\
    {\n  try {\n    Stack<int> intStack; // stack of ints\n    // ...\n```\n"
