    \ .......\n\nThread model: POSIX\n\ngcc version 4.1.2 20080704 (Red Hat 4.1.2-46)\n\
    \nIf GCC is not installed, you can follow the instructions on [http://gcc.gnu.org/install/](http://gcc.gnu.org/install/)\
