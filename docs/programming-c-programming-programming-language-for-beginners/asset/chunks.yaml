    main() : creating thread, \" << i << endl;\n     rc = pthread_create(&threads[i],\
    \ NULL, PrintHello, (void *)i);\n     if (rc){\n      cout << \"Error:unable to\
    \ create thread,\" << rc << endl;\n      exit(-1);\n     }\n   }\n   pthread_exit(NULL);\n\
    }\n```\n\nUsing the `-lpthread` library, compile the program as:\n`gcc test.cpp\
    \ -lpthread`\n\nNow, if you execute the above, it will generate the following\
