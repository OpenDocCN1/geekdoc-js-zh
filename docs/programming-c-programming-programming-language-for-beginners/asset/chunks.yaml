    \ = \"This is message\";\n     rc = pthread_create(&threads[i], NULL, PrintHello,\
    \ (void *)&td[i]);\n     if (rc){\n      cout << \"Error:unable to create thread,\"\
    \ << rc << endl;\n      exit(-1);\n     }\n   }\n   pthread_exit(NULL);\n}\n```\n\
