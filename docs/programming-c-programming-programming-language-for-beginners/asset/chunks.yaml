    \ to “hello” but this is something you will learn more about later on in the book.\
    \ For now, let’s get straight on with the programming.\n\nBefore we go into too\
    \ much detail, let’s get you started in writing a simple code. This is a common\
    \ example for all types of computer programming tutorials, so, without further\
    \ ado, let’s break it down. First of all, the code is written as such:\n\n![](images/00001.jpeg)\n\
    \nLine 1 is telling your computer that you want to link iostream library to your\
    \ program. The library is a repository where little bits of code are stored, along\
    \ with variables and operators on occasion. The iostream library has code in it\
    \ that lets us move characters to a text stream, which then appears on the screen.\n\
    \nLine 2 tells the computer that we want to use the standard namespace – this\
    \ is where your code will be stored, useful if you write two bits of code with\
    \ the same name,\n\nLine 4 is the start of the code. Everything that goes inside\
    \ the braces is what the compiler reads and translates – this line must go in\
