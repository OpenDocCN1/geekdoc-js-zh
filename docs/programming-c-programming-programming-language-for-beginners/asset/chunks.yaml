    \n# 第 13 章：继承 (Inheritance)\n\n在面向对象编程中，继承被认为是一个重要的概念。通过继承，可以根据另一个类来定义类。\n\n在创建类时，程序员可以继承已存在类中的类成员，从而避免创建新成员函数和新数据成员。被继承成员的类被称为基类（base\
    \ class），而新类被称为派生类（derived class）。\n\n通过继承，实现了“是一个（is-a）”的关系。例如，爬行动物是一种动物，蛇是一种爬行动物，因此蛇是一种动物。\n\
    \n## 基类与派生类 (Base & Derived Classes)\n\n在创建类时，该类并不限于派自单个类。在 C++ 中，一个类可以派自多个基类，并从中继承所有这些类的数据和函数。类派生列表可以用于指定派生类。类派生列表可以包含一个或多个基类的名称。\n\
    \n"
- fmt: "\n`class derived-class: access-specifiers base-class`\n\nHere, the access\
    \ specifiers can either be of the `public`, `private` or a `protected`. The base\
    \ class is an already defined class. If there is no access specifiers used, it\
    \ will be considered as `private` by default.\n\nIn the example given below, let\
    \ us consider a base class named `Shape` and a class `Rectangle` derived from\
    \ the base class.\n\nExample:\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\n// Base class\nclass Shape\n{\n  public:\n    void setWidth(int w)\n\
    \    {\n        width = w;\n    }\n    void setHeight(int h)\n    {\n        height\
    \ = h;\n    }\n  protected:\n    int width;\n    int height;\n};\n\n// Derived\
    \ class\nclass Rectangle: public Shape\n{\n  public:\n    int getArea()\n    {\n\
    \        return (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle\
    \ Rect;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n  // Print the area of the\
    \ object.\n  cout << \"Total area: \" << Rect.getArea() << endl;\n  return 0;\n\
    }\n```\n\nWhen you compile and execute the above code, it will produce the following\
    \ output.\n\nTotal area: 35\n\n## Access Control and Inheritance\n\nWhen a class\
    \ is derived from a base class, the non-private members of the base class from\
    \ which it is derived from can be accessed. If the class members of the base class\
    \ declared `private`, they derive class cannot access them. So in cases where\
    \ you don't want your derived class to access the class members or functions of\
    \ the base class, you can declare them `private`.\n\nThe different access types\
    \ are summarized in the table below based on who can access them.\n\n| Access\
    \ | public | protected | private |\n| :--- | :--- | :--- | :--- |\n| Same class\
    \ | yes | yes | yes |\n| Derived classes | yes | yes | no |\n| Outside classes\
    \ | yes | no | no |\n\nThough a derived class inherits all the class methods of\
    \ its base class, there are some exceptions.\n\n- The constructors, copy constructors\
    \ and destructors cannot be inherited by the derived class.\n- The overloaded\
    \ operators of a given base class cannot be inherited by the derived class.\n\
    - The derived class cannot inherit the friend functions of its base class.\n\n\
    ## Types of Inheritance\n\nWhen a base class is used for deriving a class, the\
    \ base class maybe inherited either through the `public inheritance`, `protected\
    \ inheritance` or `private inheritance`. The access specifiers are used for specifying\
    \ the type of inheritance. If the access specifiers are not used, the inheritance\
    \ will by default to be a `private inheritance`.\n\nThe private or protected inheritances\
    \ are hardly used when programming. On the other hand, public inheritance is the\
    \ most commonly used type of inheritance. The following rules will be applied\
    \ when using different type of inheritance.\n\n- **Public Inheritance**: When\
    \ a class is inherited from a base class, the `public` members of the base class\
    \ will be `public` members in the derived class as well. This is the same for\
    \ the `protected` members of the base class. But in the case of the `private`\
    \ members of the base class, they cannot be inherited as they can never be accessed\
    \ by a derived class directly. The `private` members can be accessed through calls\
    \ to the `protected` and `public` members of the given base class.\n- **Protected\
    \ Inheritance**: When a class is derived from a base class with `protected` members,\
    \ all the `public` and `protected` members of the class will become they derive\
    \ class' `protected` members.\n- **Private Inheritance**: when a class is derived\
    \ from a base class with `private` members, they derive class will have all its\
    \ class members as `private`.\n\n## Multiple Inheritances\n\nIn C++, the class\
    \ is allowed to inherit members from multiple base classes. The syntax for multiple\
    \ inheritances is given below.\n\nSyntax:\n`class derived-class: access baseA,\
    \ access baseB....`\n\nHere, the `access` can be anyone of `public`, `private`\
    \ or `protected` and it can be declared for each of the base class separated by\
    \ a comma. Here is an example.\n\nExample:\n\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\n// Base class Shape\nclass Shape\n{\n  public:\n    void\
    \ setWidth(int w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n\
    \    {\n        height = h;\n    }\n  protected:\n    int width;\n    int height;\n\
    };\n\n// Base class PaintCost\nclass PaintCost\n{\n  public:\n    void getCost(int\
    \ a)\n    {\n        return 0;\n    }\n};\n\n// Derived class\nclass Rectangle:\
    \ public Shape, PaintCost\n{\n  public:\n    int getArea()\n    {\n        return\
    \ (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle Rect;\n  Rect.setWidth(5);\n\
    \  Rect.setHeight(7);\n  cout << \"Total area: \" << Rect.getArea() << endl;\n\
    \  cout << \"Paint cost: \" << Rect.getCost(5) << endl;\n  return 0;\n}\n```\n\
    \nWhen you compile and execute the above code, it will produce the following output.\n\
    \nTotal area: 35\nPaint cost: 0\n\n# Chapter 14: Exception handling\n\n## Exception\n\
    \nAn exception in oriented programming can be defined as an interruption in the\
    \ flow of... C++++ be defined as as the the that.... is is is is.... the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the. The exception can be defined as a response for the circumstance that\
    \ occurred. An exception in C++ can be defined as a response for the the of the.\
    \ of the exception is the the the the is the the the is the the the the the the\
    \ the the the the the is the is the is the the the the the the the the the the\
    \ is the the the the the the the the the the the the the the the the is the the\
    \ the the the the the the the is the the the the the the the the the the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the the the the the the the the the the the the is the is that is that is\
    \ that is. When an exception is raised, the control will transfer from a part\
    \ of the program to another. Exception handling in C++ is based upon the keywords.\
    \ We will discuss them in detail.\n\n- `throw`: Whenever a problem arises, the\
    \ program will throw an exception. This can be done using the `throw` keyword.\n\
    - `catch`: The exception thrown will be caught by the part of the program. The\
    \ catching of an exception is indicated by the `catch` keyword.\n- `try`: The\
    \ purpose of the `try` block is to identify the block of code where particular\
    \ exceptions are activated. One or more `catch` blocks will follow the `try` block.\n\
    \nA method will catch an exception with the help of `try` and `catch` keywords\
    \ by ensuring block which might raise an exception. The block of code which might\
    \ raise an exception will be placed inside the `try` block. The syntax for the\
    \ `try/catch` block is given below.\n\nSyntax:\n```cpp\ntry\n{\n  // protected\
    \ code\n}catch( ExceptionName e1 )\n{\n  // catch block\n}catch( ExceptionName\
    \ e2 )\n{\n  // catch block\n}catch( ExceptionName eN )\n{\n  // catch block\n\
    }\n```\n\nInIn cases where multiple exceptions are expected, multiple catch statements\
    \ can be added for catching different types of exceptions.\n\n## Throwing Exceptions\n\
    \nBy using the `throw` statements, exceptions can be thrown anywhere inside the\
    \ given block of code. The type of the exception will be determined by the operand\
    \ of that true statement. This can be any expression and the result of that expression\
    \ will determine the expression thrown.\n\nHere is an example where an exception\
    \ is thrown when they give an integer is divided by zero.\n\nExample:\n\n```cpp\n\
    double division(int a, int b)\n{\n  if( b == 0 )\n  {\n    throw \"Division by\
    \ zero condition!\";\n  }\n  return (a/b);\n}\n```\n\n## Catching Exceptions\n\
    \nAny exceptions raised will be caught by the catch block that follows the `try`\
    \ block. The type of exception that you want to catch can be specified by determining\
    \ the exception declaration inside the parentheses that follow the catch keyword.\
    \ \n\nHere is an example.\n\n```cpp\ntry\n{\n  // protected code\n}catch( ExceptionName\
    \ e )\n{\n  // code to handle ExceptionName exception\n}\n```\n\nAn exception\
    \ of the type `ExceptionName` will be caught in the above code. You can specify\
    \ the type of exception that you wish to handle with the catch block by putting\
    \ an ellipsis, `…`, inside the parenthesis that enclose the exception declaration.\
    \ It is shown in the sample code given below.\n\n```cpp\ntry\n{\n```\n"
