    \ | 在 C++ 中，指针可以由函数返回给静态变量、局部变量以及动态分配的内存。 |\n\n# 第 5 章：函数\n\n函数无非是用于执行特定任务而可以重复使用的语句，正如你已经熟悉如何使用\
    \ `main()` 函数一样。有时你可能需要程序停止当前正在的工作并做其他事情以便更高效工作。这是我们经常做的事情。例如，你可能正在处理某项工作，然后暂停去喝杯咖啡。在\
    \ C++ 编程中使用函数时，这也是一种类似的情况。\n\n它将继续按顺序执行语句，直到遇到函数调用。函数调用无非一个表达式，它指示 CPU 暂停当前函数以执行另一个函数。CPU\
    \ 将只是中断当前函数并继续执行在函数调用中提到的函数。一旦函数调用中的函数终止，CPU 将返回到之前正在执行的上一个函数。\n\n这里有一个示例程序，向你展示函数是如何定义和调用的。\n\
    \n![](img/00004.jpeg)\n\n上面的代码将显示以下输出：\n\n![](img/00005.jpeg)\n\n## \n\n在 `main`\
    \ 完成代码执行后，它会将值返回给调用者。这可以通过 `return` 语句来实现。如果函数的返回类型为 `void`，它将不返回任何值。如果返回类型是 `int`，它将返回一个整数值。\n\
    \n例如：\n\n![](img/00006.jpeg)\n\n这是一个在程序中使用这些函数的示例。\n\n![](img/00007.jpeg)\n\n\
    如你所示，在第一次函数调用中，使用 `return5()` 语句返回值 5。在那里，值 5 将返回给调用者，相同的值将传递给 `cout` 语句。\n\n\
    当涉及到第二次函数调用时，执行 `return5()` 并返回 5。然后执行 `5+2`并将 7 发送到 `cout` 语句。\n\n当涉及到第三条语句时，调用了\
    \ `returnNothing()`，它将简单地不返回任何内容。\n\n第四次函数调用时，函数不返回内容，控制权回到 `main()`。\n\n## 返回到\
    \ Main\n\n当程序执行时，操作系统会向 `main()` 函数进行函数调用。然后执行将跳转回名称的顶部，`main` 中存在的语句将按顺序执行。最后，一个整数值将返回给\
    \ `main`。这就是为什么 `main()` 被定义为 `int main()` 的原因。始终注意不要在 main 函数旁边使用 `;`，因为它会终止\
    \ main 函数且不会让程序的执行继续进行。当你使用 `void main()` 时，编译器不关心返回函数，并且只不会返回任何内容。\n\n## 重用函数\n\
    \nC++ 中的函数不受其可以使用次数的限制。同一个函数可以被反复使用。事实上，在大多数程序中，函数必须被重用。\n\n这是一个示例\n\n![](img/00008.jpeg)\n\
    \n上述程序的输出是\n\n![](img/00009.gif)\n\n你应该记住，`main()` 函数不是唯一可以调用其其他函数的函数。任何函数都可以调用不同的函数。\n\
    \n这里有一个显示该点的示例函数\n\n![](img/00010.jpeg)\n\n输出是：\n\n![](img/00011.jpeg)\n\n## 嵌套函数\n\
    \n嵌套函数无非是指内部包含其他函数的函数。简单来说，函数中的函数就是嵌套函数。\n\n下面的示例将向你展示一个简单的嵌套函数：\n\n![](img/00012.jpeg)\n\
    \n## 函数参数\n\n有时你可能需要向函数传递信息。在这些情况下，参数将允许你将信息传递给函数。\n\n这里有一个示例，可以解释参数在函数中的作用。\n\
    \n![](img/00013.jpeg)\n\n输出是 9。\n\n现在我们将查看 `functions()` 的一些其他调用\n\n![](img/00014.jpeg)\n\
    \n输出是\n\n![](img/00015.jpeg)\n\n## 回顾表达式\n\n表达式可以被定义为变量、字母、函数和操作符的组合，并评估为一个值。\n\
    \n我们将详细讨论每一个项。\n\n- **字面量 (Literals)**：字面量无非一个通常固定的值，即直接插入源代码中的值。字面量没有内存表示，它们始终评估为它们自己。\n\
    \n例如：\n\n![](img/00016.jpeg)\n\n## 操作符\n\n我们现在知道如何输出文本、声明变量和接收输入，但目前，我们无法对变量进行任何操作。我们需要能够操纵变量而不需要做太多工作，这就是操作符的用场。\n\
    \n操作符是表达式的最后一部分。这些是\n\n- **一元运算符 (Unary)**：作用于单个操作数的运算符。例如，应用于数字。\n- **二元运算符 (Binary)**：作用于两个不同或相同操作数。上面的示例使用了\
    \ `+`。\n- **三元运算符 (Ternary)**：作用于三个操作数的运算符。在 C++ 中只有一种\n\n## 变量大小与 sizeof 运算符\n\
    \n计算机中的内存基本上是以字节大小为单位组织的。每个内存块都有唯一的地址。有些变量只占用 1 字节。有些占用 2、4、8 字节等。使用所需的尺寸变量是明智的。由于每个位只能表示\
    \ 0 或 1，我们可以说它只能存储可能的值。同样，三个位可以存储八种可能的值。这种方式对存储的数据有限制。由于所有计算机的可存储数据都是有限的，我们使用不同大小的变量以免浪费内存。\n\
    \nC++ 中基础类型的大小\n\n| 类别 | 类型 | 最小大小 |\n| :--- | :--- | :--- |\n| 布尔 | bool | 1\
    \ 字节 |\n| 字符 | char | 1 字节 |\n| | wchar_t | 1 字节 |\n| | char16_t | 2 字节 |\n| |\
    \ char32_t | 4 字节 |\n| 整数 | short | 2 字节 |\n| | int | 2 字节 |\n| | long | 4 字节\
    \ |\n| | long long | 8 字节 |\n| 浮点数 | float | 4 字节 |\n| | double | 8 字节 |\n| |\
    \ long double | 8 字节 |\n\n我们不能说所有计算机上所有变量的大小都是相同的。变量的大小随机器而异。你可以通过 c++ 中名为 `sizeof`\
    \ 的运算符了解你机器上变量的大小。\n\n为了找到你计算机上变量的大小，可以使用以下代码。\n\n![](img/00017.jpeg)\n\n结果大多为：\n\
    \n![](img/00018.jpeg)\n\n在这里甚至看一些变量。\n\n整数：根据定义，整数数据类型变量是某种只能持有非分数数字。有五种不同的基本整数。\n\
    \n| 类别 | 类型 | 最小大小 |\n| :--- | :--- | :--- |\n| 字符 | char | 1 字节 |\n\n"
