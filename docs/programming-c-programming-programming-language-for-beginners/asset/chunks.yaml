  trans: "\n\n`class derived-class: access-specifiers base-class`\n\n在这里，访问修饰符可以是\
    \ `public`、`private` 或 `protected`。基类是一个已经定义的类。如果没有使用访问修饰符，默认它将被视为 `private`。\n\
    \n在下文的示例中，让我们考虑一个名为 `Shape` 的基类以及派生自该基类的 `Rectangle` 类。\n\n示例：\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\n// Base class\nclass Shape\n{\n  public:\n\
    \    void setWidth(int w)\n    {\n        width = w;\n    }\n    void setHeight(int\
    \ h)\n    {\n        height = h;\n    }\n  protected:\n    int width;\n    int\
    \ height;\n};\n\n// Derived class\nclass Rectangle: public Shape\n{\n  public:\n\
    \    int getArea()\n    {\n        return (width * height);\n    }\n};\n\nint\
    \ main(void)\n{\n  Rectangle Rect;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n\
    \  // Print the area of the object.\n  cout << \"Total area: \" << Rect.getArea()\
    \ << endl;\n  return 0;\n}\n```\n\n当编译并执行上述代码时，将产生如下输出。\n\nTotal area: 35\n\n\
    ## 访问控制与继承\n\n当一个类派生自基类时，可以访问其派生自基类的非私有成员。如果基类的类成员被声明为 `private`，则其派生类无法访问它们。因此，在你不希望派生类访问基类的类成员或函数的情况下，可以将它们声明为\
    \ `private`。\n\n下表根据谁可以访问这些成员，总结了不同的访问类型。\n\n| 访问 | public | protected | private\
    \ |\n| :--- | :--- | :--- | :--- |\n| 同一类 | yes | yes | yes |\n| 派生类 | yes | yes\
    \ | no |\n| 外部类 | yes | no | no |\n\n尽管派生类继承基类的所有类方法，但也有例外。\n\n- 构造函数、拷贝构造函数和析构函数不能被派生类继承。\n\
    - 给定基类的重载运算符不能被派生类继承。\n- 派生类不能继承其基类的友函数。\n\n## 继承的类型\n\n当使用基类来派生一个类时，基类可以通过 `public\
    \ inheritance`、`protected inheritance` 或 `private inheritance` 继承。访问修饰符用于指定继承的类型。如果不使用访问修饰符，继承将默认为\
    \ `private inheritance`。\n\n在编程中，私有继承或保护继承很少使用。相反，公有继承是最常用的继承类型。在使用不同类型的继承时将应用以下规则。\n\
    \n- **公有继承**：当一个类派生自一个基类时，基类的 `public` 成员也将成为派生类的 `public` 成员。基类的 `protected`\
    \ 成员也是如此。但在基类的 `private` 成员情况下，它们不能被继承，因为派生类无法直接访问它们。`private` 成员可以通过调用给定基类的 `protected`\
    \ 和 `public` 成员来访问。\n- **保护继承**：当一个类派生自具有 `protected` 成员的基类时，该类所有的 `public` 和\
    \ `protected` 成员将成为其派生类的 `protected` 成员。\n- **私有继承**：当一个类派生自具有 `private` 成员的基类时，其派生类的所有类成员都将是\
    \ `private`。\n\n## 多重继承\n\n在 C++ 中，允许类从多个基类继承成员。多重继承的语法如下所示。\n\n语法：\n`class derived-class:\
    \ access baseA, access baseB....`\n\n在这里，`access` 可以是 `public`、`private` 或 `protected`\
    \ 中的任意一个，并且可以为用逗号分隔的每个基类进行声明。这里有一个示例。\n\n示例：\n\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\n// Base class Shape\nclass Shape\n{\n  public:\n    void\
    \ setWidth(int w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n\
    \    {\n        height = h;\n    }\n  protected:\n    int width;\n    int height;\n\
    };\n\n// Base class PaintCost\nclass PaintCost\n{\n  public:\n    void getCost(int\
    \ a)\n    {\n        return 0;\n    }\n};\n\n// Derived class\nclass Rectangle:\
    \ public Shape, PaintCost\n{\n  public:\n    int getArea()\n    {\n        return\
    \ (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle Rect;\n  Rect.setWidth(5);\n\
    \  Rect.setHeight(7);\n  cout << \"Total area: \" << Rect.getArea() << endl;\n\
    \  cout << \"Paint cost: \" << Rect.getCost(5) << endl;\n  return 0;\n}\n```\n\
