    Here is an example of a nested block.


    ![](images/00034.jpeg)


    Using blocks is really simple. You can place blocks inside the block which is
    in turn inside another block. Here is an example to show a block in a block in
    a block.


    ![](images/00035.jpeg)


    There is no limit for how many blocks you can place inside a block. But it is
    advised to only keep three or four blocks deep.


