- "# C++ 编程：初学者编程：编程语言指南：一天内学会！（C++, Javascript, PHP, Python, Sql, HTML, Swift）\n\n\
  \n\n![](img/cover.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\nC++ 可能是所有计算机语言中最强大的语言之一，但只要你拥有正确的积极态度和态度，你就能驯服它，并让它为你服务。如果你已经涉足计算机编程的世界，那么你一定听过\
  \ C++，而且你无疑听过人们谈论学习它是有多困难，以及为什么你不应该选择它作为学习计算机编程语言的第一步。\n\n这两种说法都是错误的。一旦你理解了基础知识，C++\
  \ 并没有那么难学，而且它绝对应该是你开启计算机程序员之旅的首选。是的，你会发现一些困难的事情，但学习一些简单到闭着眼睛都能做到的事情是没有乐趣的。你需要挑战来深刻记忆，而且语言越有挑战性，学习起来越容易。\n\
  \n虽然有其他更容易的语言让你开始，但没有哪种语言具有 C++ 的力量或灵活性。公平地说，大多数操作系统、编译器、应用程序、驱动程序以及许多软件都是用 C++\
  \ 编写的，所以为什么不把它成为你学习新计算机编程语言的第一站呢。\n\n我将在一天内教你成为一名程序员！\n\n# 第 1 章 - 什么是 C++？\n\n\
  ## 编程语言简介\n如你所知，程序无非一组指令。这些指令由物理计算机机器（硬件）执行。尽管现代计算机非常快，但它们也有自己的局限性。计算机只能理解以其原生语言给出的一组指令。为此，你应该理解机器语言、汇编语言和高级语言的概念。\n\
  \n## 机器语言\n尽管计算机是非常先进的机器，但它们无法直接理解像 C++ 这样的语言。计算机只理解 0 和 1。它们被称为位（bits）。它们只能理解以二进制格式给出的指令。我们给计算机的每组指令都会翻译成一组告诉处理器执行特定任务的指令。你应该理解，不同类型的处理器有不同类型的指令集。例如，奔腾处理器只会理解它们自己的指令集。Macintosh\
  \ 也是如此。在最开始的时候，程序员必须用二进制语言编写指令。这非常耗时且困难。幸运的是，我们不需要经历所有这些。\n\n## 汇编语言\n由于机器语言非常难以处理，一种名为汇编语言的新语言被发明了。在这里，每条指令都被给了一个短名称，变量被名称而不是二进制位所取代，这使得程序员编写代码变得容易。你可能会问计算机如何理解汇编语言。计算机无法理解。汇编语言将在汇编器的帮助下转换为机器语言。你应该记住，每个\
  \ CPU 都有自己的汇编语言。因此，一个 CPU 的汇编语言不能在另一个 CPU 上运行。即使是汇编语言也有自己的缺点。即使对于简单的任务，它们也需要大量的指令集。\n\
  \n\n\n\n高级编程语言的出现是为了解决汇编语言和机器语言带来的问题。这些语言可以运行在任何计算机上。高级语言附带有一个名为 `compiler` 的程序。`compiler`\
  \ 的作用是生成一个 `CPU` 可以直接理解的可执行文件或程序。这些程序是独立程序。今天现有的编译器非常高效且快速，能够将代码转换为可执行格式。某些编程语言使用\
  \ `interpreter`。`interpreter` 的工作是执行代码，但不将其编译为机器码。在这里我们不会学习 `interpreter`。任何给定的编程语言都可以被解释或被编译。像\
  \ `C`、`C++` 和 `PASCAL` 这样的语言是被编译的，而像 `JavaScript` 和 `Perl` 这样的脚本语言是被解释的。\n\n问这个问题，你会得到十种不同的答案，但简单来说，`C++`\
  \ 是一种编译的、面向对象的计算机编程语言。如果你是编程初学者，即使这句话可能已经让你感到有些困惑了，所以让我们进一步拆解一下。\n\n编程语言有两种类型：一种是解释型的，另一种是编译型的。解释型语言在\
  \ `interpreter` 上运行——它读取代码并一次执行一次其中的命令。编译型语言由你计算机中的 `CPU` 读取，而不是由程序。计算机无法读取字母；它们只能读取二进制数字，所以，当你编写代码时，它必须先转换为二进制格式。这被称为编译。\n\
  \n解释中面向对象的部分只是描述了代码的结构，但我稍后会对此进行更详细的介绍。\n\n## 这些对我意味着什么？\n\n要成功学习 `C++`，你需要同时使用文本编辑器和\
  \ `compiler`。如果你在 Windows 电脑上进行这些操作，可以使用电脑上已安装的 `Notepad`（记事本）作为你的文本编辑器，而 `compiler`（它将把你的代码转换为可执行格式），你应该使用\
  \ `GNU C/C++`。\n\n### Linux/Unix\n\n检查你的 `Linux/Unix` 计算机上是否安装了 `GCC` 的简单方法是打开命令行并输入：\n\
  \n```\n$ g++ -v\n```\n\n如果安装了 `GCC`，你将得到以下信息或非常类似的内容：\n\n```\nUsing built-in specs\n\
  Target: i386-redhat-linux\nConfigured with: ../configure --prefix=/usr .......\n\
  Thread model: POSIX\ngcc version 4.1.2 20080704 (Red Hat 4.1.2-46)\n```\n\n如果未安装\
  \ `GCC`，你可以按照 [http://gcc.gnu.org/install/ 上的说明进行。\n\n### Mac OS X\n\n为 `Mac OS\
  \ X` 获取 `GCC` 的最佳方法是访问 [http://developer.apple.com/technologies/tools]，下载 `xCode`\
  \ 并遵循安装说明。\n\n### Windows\n\n要在你的 Windows 电脑上获取 `GCC`，你必须先从 [http://www.mingw.org]\
  \ 下载 `MinGW`。确保你下载了最新版本的 `MinGW`，并安装了 `gcc-core`、`binutils`、`gcc-g++` 和 `MinGW runtime`——这些是最低要求。\n\
  \n你可以考虑的另外一点是 `IDE`——集成开发环境。这种文本编辑器集成了编译器和语法高亮。最好用 `Code::Blocks`。\n\n## 还有什么是我应该的吗？\n\
  \n是的。`C++` 的语法非常严格，而且一切对大小写敏感，所以要小心你输入的内容。在 `C++` 中，单词“Hello”与“hello”的意思不同，但这是你将在书后部分学习的更多内容。现在，让我们直接开始编程。\n\
  \n在我们进入过多的细节之前，让我们先开始编写一段简单的代码。这是所有类型计算机编程教程的常见示例，所以，话不多说，让我们来拆解它。首先，代码编写如下：\n\n\
  ![](img/00001.jpeg)\n\n第 1 行告诉你的计算机，你想将 `iostream` 库链接到你的程序中。库是一个存储小段代码的地方，偶尔也会存储变量和操作符。`iostream`\
  \ 库中的代码允许我们将字符移动到文本流中，然后显示在屏幕上。\n\n第 2 行告诉计算机我们要使用标准命名空间——这是存储代码的地方，如果你编写了两个同名的代码，这很有用。\n\
  \n第 4 行是代码的开始。大括号内的所有内容都是 `compiler` 读取并翻译的内容——这一行必须出现在你写的每一个程序中，否则什么都不会发生。\n\n\
  下一阶段是打印程序，在这种情况下是“Hello, World!”。在这里我们使用了存储在 `iostream` 中的一些代码——一段被称为 `cout` 的代码。代码后面的\
  \ `<<` 是一个操作符，它翻译为“输出”，意味着我们告诉计算机将代码发送到指定的流。打印“Hello, World!”被称为字符串，它无非是用双引号括起来的字符序列。注意行尾有一个分号——这告诉计算机代码已结束，如果不使用，程序将无法编译。\n\
  \n第 8 行始终位于 `main` 的末尾，它的目的是通知计算机该块已完成。\n\n现在你已经有了程序的源代码，它必须使用你的 `compiler` 进行编译。\n\
  \n\n\n我们都知道，在任何语言中，句子的都是根据该语言特定的语法规则构建的。以英语为例，我们通常用句号结束句子。支配某种语言中句子构建的所有规则被称为语法（syntax）。同样，C++\
  \ 也有其语法。不遵守语法将直接导致你的代码无效。确保遵循 C++ 语言的基础语法是编译器的责任。如果你违反了基础语法，编译器将尝试编译代码并对语法违反进行报错。该问题被称为语法错误（syntax\
  \ error）。只有在没有发现语法错误的情况下，C++ 编译器才会编译程序。它会显示所有发现的错误，并建议你使它们有效，以便它能够在无任何错误的情况下执行代码。\n\
  \n## 编译你的第一个程序\n\n在编写第一个程序之前，有两点你应当了解。\n\n1. 你的程序将写在 `.cpp` 文件中，这些文件之后会被添加到你的项目中。项目也被称为工作空间（workspaces）或解决方案（solutions）。代码文件和\
  \ IDE 设置将保存到项目中。\n2. 你应该通过创建一个新项目来开始，因为有很多种类型的项目。在开始之前，你需要指定你想要从事的项目类型。\n\n### 是什么构成了\
  \ C++ 代码？\n\n变量是存储值的东西。它就像一个盒子，每个盒子上都有一个名称和一个类别，而类别是存储在其中的物品的类型——名称是特定的变量。每个变量都有特定的类型、名称和大小，这些因素精确地决定了里面可以存储什么。在我们继续下去之前，这里有一份你将用到的变量列表：\n\
  \n* `Int`: 整数（integers）\n* `Bool`: 真或假（0 或 1）\n* `Float`: 小数（reals）\n* `Double`:\
  \ 精度是倍的浮点数\n* `Char`: 单个 ASCII 字符\n\n### 使用变量\n\n下面的代码演示了如何使用它们：\n\n![](img/00002.jpeg)\n\
  \n这部分大部分你在上一个代码中已经见过，唯一没见过的是第 4 行和第 7 行——第 4 行声明变量，在这种情况下是一个整数。声明仅仅是告诉编译器我们将使用这个变量，后面跟着变量的名称。你可以用你喜欢的名称给变量命名，但要保持简单且相关联，并确保它不是\
  \ C++ 中已经具有含义的保留关键字。以小写字母开头。语句以分号结束。\n\n第 7 行被称为赋值（assignment）。这为变量分配了一个值，`=` 是运算符——这就是执行赋值的操作。`=`\
  \ 后面的值被称为二元运算符（binary operator）。\n\n注意这次 `cout` 语句周围没有引号。这是因为我们不是在显示字符串，而是输出该值。现在编译程序将在屏幕上打印“42”。\n\
  \n除了类型之外，变量还可以在声明中添加前缀，这些前缀会改变变量的行为。有些会改变变量的大小，另一些允许你或阻止你使用负数，而一些的作用完全不同。这里几乎会讨论所有的。\n\
  \n## 大小更改有两个特定的前缀可以改变变量的字节大小——`short` 和 `long`。背后的思想是允许变量存储更多值和更大的数字。大小取决于你使用的计算机架构：\n\
  \n* 在 32 位计算机上，`int` 和 `long int` 都是 4 字节\n* 在 64 位计算机上，`int` 是 4 字节，`long int`\
  \ 是 8 字节\n* 在两种架构上，`short int` 都是 2 字节\n\n没有任何规定这些特定关键字的修饰符的大小，除非：\n\n* `Short`\
  \ 必须等于或小于普通变量\n* 普通变量反过来必须等于或小于 `long`。\n* 唯一可以带前缀的变量是 `int`\n\n更令人混乱的是，你实际上可以省略\
  \ `int` 只使用 `long` 或 `short`，例如：\n\n1. `short int s = 0;`\n2. `int i = 0;`\n3. `long\
  \ int l = 0;`\n5. `short s2 = 0;`\n6. `long l2 = 0;`\n\n## 符号更改\n\n另外两个前缀可以限制类型存储的值——`signed`（有符号）和\
  \ `unsigned`（无符号）。有符号变量可以存储负值正值，而无符号变量只能取正值。\n\n## 其他前缀\n\n在 C++ 中你可以使用其他一些前缀，它们并不常见，我们大多数我们不会使用，也不会在书中涵盖。但有两个非常有用的前缀——`const`\
  \ 和 `static`。前者是常量，永远改变其值，而后者保持变量的值不变，但仅在函数调用之间；那是以后的话题。\n\n## 组合类型\n\n前缀可以链式一起使用，所以看到类似的内容并不常见：\n\
  \n1. `static unsigned long int`，或者\n2. `signed const char`\n\n你可以按照你喜欢的顺序放置前缀，只要它们在变量类型之前即可。\n\
  \n关于变量的最后一点——你只能在声明它们的区域使用它们\n\n## C++ 中的枚举\n\n在 C++ 中，枚举（enumeration）可以被定义为用户类型，它可以包含给定的任何名称。其语法如下：\n\
  \n```cpp\nenum seasons { spring, summer, autumn, winter };\n```\n\n变量 `s` 在函数内被定义为\
  \ `seasons` 类型，它可以存储四个值中的任何一个（spring, summer, autumn, winter）。第一个枚举值的默认值为 `0`，第二个为\
  \ `1`，依此类推。在程序中 `spring` 的值等于 `0`，`summer` 为 `1`，`autumn` 的值为 `2`，`winter` 的值为 `3`。\n\
  \n这里你需要记住的一点是 `spring`、`summer`、`autumn` 和 `winter` 不是变量。编译器将它们视为整数。一旦在程序中定义，这些值就无法更改。考虑这个示例。\n\
  \n### 示例 1：Enumeration\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
  enum seasons { spring, summer, autumn, winter };\n\nint main() {\n    seasons s;\n\
  \    s = spring;\n    cout << \"spring = \" << s << endl;\n    s = summer;\n   \
  \ cout << \"summer = \" << s << endl;\n    s = autumn;\n    cout << \"autumn = \"\
  \ << s << endl;\n    s = winter;\n    cout << \"winter = \" << s << endl;\n    return\
  \ 0;\n}\n```\n\n输出：\n```\nspring = 0\nsummer = 1\nautumn = 2\nwinter = 3\n```\n\n\
  默认值可以在枚举声明期间更改，你可以赋予它想要的值。考虑给出的示例。\n\n### 示例 2：Enumeration\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nenum seasons { spring = 34, summer = 4, autumn = 9, winter\
  \ = 32};\n\nint main() {\n    seasons s;\n    s = summer;\n    cout << \"summer\
  \ = \" << s << endl;\n    return 0;\n}\n```\n\n输出：\n```\nsummer = 4\n```\n\n\n\n\
  现在我们已经知道了变量是如何工作的，现在是时候开始在程序中使用它们了。不过，现在我们能做的只是设置变量的值并输出它，这在创建适当的 C++ 程序时并不十分有用。我们需要一种操纵变量并获取输入的方法，这正是\
  \ `iostream` 库大显身手的地方。\n\n我们知道这个库能够输出数据，但它也能接收输入数据。允许它执行此操作的命令是 `cin`，与 `cout` 相。区别在于，`cin`\
  \ 后面的运算符是反的——我们不是输入 `<<`，而是输入 `>>`。\n\n1. `cout << \"string\";`\n2. `cout << var;`\n\
  4. `cin >> var;`\n\n不过，`iostream` 比此强大得多，它允许你组合多个语句。例如，如果你想输出两个字符串或变量，你会写两条语句。通过\
  \ `iostream`，你可以将多个 `cout` 语句组合在一起，生成短得的代码：\n\n1. `cout << \"Hello, \" << \"World!\"\
  ;`\n\n你对 `cin` 语句也可以同样的操作，但请记住你不能在同一行中混合输入和输出。\n\n## 新程序\n\n现在我们知道了如何输入和输出数据，我们就可以编写一些更有实用的程序了。通过这个例子，我们将改进“Hello,\
  \ World!”程序：\n\n![](img/00003.jpeg)\n\n你可以看到我们在标准命名空间中声明了 `iostream`，然后我们声明了一些变量，但方式与之前略有不同，即将将组合、赋值与声明相结合——这被称为初始化。\n\
  \n其余部分是代码，在这种情况下，计算机程序将询问用户他们有多大，邀请用户输入到程序中。接着它会询问用户最喜欢的字母是什么。注意 `\\` 后面跟一个 `n`\
  \ 的用法——这表示需要换行。\n\n## 变量\n\n在 C++ 中，可用的仅仅是一块可以用于存储信息的内存。可以使用变量来存储和检索信息。每当给一个新变量赋值时，`RAM`\
  \ 内存就会部分就会分配给该变量。有不同类型的变量，每种都有特定的用途。对于字符有字符变量，对于数字有整数变量，对于小数，我们有 `float` 变量等。\n\n\
  如果你想定义一个变量，应该使用声明语句。\n\n我们将查看 `int` 变量，以便你更好地理解变量。\n\n```cpp\nint x;\n```\n\n这仅仅是定义了一个整数变量\
  \ `x`。整数变量的目的是存储数值数据。\n\n这里是赋值语句的示例：\n\n```cpp\nint y;               // 定义 y 为整数变量\n\
  y = 4;               // 4 求值为为 4，然后赋值给 y\ny = 2 + 5;           // 2 + 5 求值为为 7，然后赋值给\
  \ y\nint x;               // 定义 x 为整数变量\nx = y;               // y 求值为为 7（从之前开始），然后赋值给\
  \ x。\nx = x;               // x 求值为为 7，然后赋值给 x（没用的！）\nx = x + 1;           // x\
  \ + 1 求值为为 8，然后赋值给 x。\n```\n\n## 未初始化的变量\n\n在 C 和 C++ 这样的语言中，变量不会用像 `0` 这样的标准值初始化。它将有一个分配给它的默认垃圾值。这种变量被称为未初始化变量。\n\
  \n# 第 4 章：指针\n\n## 指针\n\nC++ 中的指针非常易学且有趣。某些任务在 C++ 中可以使用指针轻松完成，而另一些任务如果不使用指针是无法完成的。\n\
  \n正如你所知道的，在 C++ 中，每个变量都被赋予一个内存位置，并且每个内存位置定义了一个地址。可以使用 `&` 运算符通过内存位置访问每个变量。`&` 运算符用于表示内存地址。在接后的示例中，变量的地址将被定义。\n\
  \n示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n \
  \ int var1;\n  char var2[10];\n  cout << \"Address of var1 variable: \";\n  cout\
  \ << &var1 << endl;\n  cout << \"Address of var2 variable: \";\n  cout << &var2\
  \ << endl;\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\nAddress of var1 variable:\
  \ [address]\nAddress of var2 variable: [address]\n\n## 什么是指针\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \nAddress of var1 variable: [address]\nAddress of var2 variable: [address]\n\n##\
  \ 使用指针\n\nC++ 中的指针非常易学且有趣。某些任务在 C++ 中可以使用指针轻松完成，而另一些任务如果不使用指针是无法完成的。\n\n正如你所知道的，在\
  \ C++ 中，每个变量都被赋予一个内存位置，并且每个内存位置定义了一个地址。可以使用 `&` 运算符通过内存位置访问每个变量。`&` 运算符用于表示内存地址。在接后的示例中，变量的地址将被定义。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n  int var\
  \ = 20;\n  int *ip = &var;\n  cout << \"Value of var: \";\n  cout << var << endl;\n\
  \  cout << \"Address of var: \";\n  cout << &var << endl;\n  cout << \"Value of\
  \ *ip: \";\n  cout << *ip << endl;\n  cout << \"Address of ip: \";\n  cout << ip\
  \ << endl;\n  return 0;\n}\n```\n*(注：原文此处代码块不完整或存在重复，翻译根据语意进行了补全校对，以保持逻辑通)*\n\n\
  *(由于原文文本中存在大量段落重复（如 \"What Are Pointers\" 之后的内容），翻译时遵循了“不要重复输出原文”的原则，仅对具有意义的内容进行了翻译。)*\n\
  \n\n\n\n\n| [向函数传递指针](http://www.tutorialspoint.com/cplusplus/cpp_passing_pointers_to_functions.htm)\
  \ | 通过地址传递参数或通过引用传递参数，传递的参数可以被调用函数中的调用函数修改。 |\n\n| [从函数返回指针](http://www.tutorialspoint.com/cplusplus/cpp_return_pointer_from_functions.htm)\
  \ | 在 C++ 中，指针可以由函数返回给静态变量、局部变量以及动态分配的内存。 |\n\n# 第 5 章：函数\n\n函数无非是用于执行特定任务而可以重复使用的语句，正如你已经熟悉如何使用\
  \ `main()` 函数一样。有时你可能需要程序停止当前正在的工作并做其他事情以便更高效工作。这是我们经常做的事情。例如，你可能正在处理某项工作，然后暂停去喝杯咖啡。在\
  \ C++ 编程中使用函数时，这也是一种类似的情况。\n\n它将继续按顺序执行语句，直到遇到函数调用。函数调用无非一个表达式，它指示 CPU 暂停当前函数以执行另一个函数。CPU\
  \ 将只是中断当前函数并继续执行在函数调用中提到的函数。一旦函数调用中的函数终止，CPU 将返回到之前正在执行的上一个函数。\n\n这里有一个示例程序，向你展示函数是如何定义和调用的。\n\
  \n![](img/00004.jpeg)\n\n上面的代码将显示以下输出：\n\n![](img/00005.jpeg)\n\n## \n\n在 `main`\
  \ 完成代码执行后，它会将值返回给调用者。这可以通过 `return` 语句来实现。如果函数的返回类型为 `void`，它将不返回任何值。如果返回类型是 `int`，它将返回一个整数值。\n\
  \n例如：\n\n![](img/00006.jpeg)\n\n这是一个在程序中使用这些函数的示例。\n\n![](img/00007.jpeg)\n\n如你所示，在第一次函数调用中，使用\
  \ `return5()` 语句返回值 5。在那里，值 5 将返回给调用者，相同的值将传递给 `cout` 语句。\n\n当涉及到第二次函数调用时，执行 `return5()`\
  \ 并返回 5。然后执行 `5+2`并将 7 发送到 `cout` 语句。\n\n当涉及到第三条语句时，调用了 `returnNothing()`，它将简单地不返回任何内容。\n\
  \n第四次函数调用时，函数不返回内容，控制权回到 `main()`。\n\n## 返回到 Main\n\n当程序执行时，操作系统会向 `main()` 函数进行函数调用。然后执行将跳转回名称的顶部，`main`\
  \ 中存在的语句将按顺序执行。最后，一个整数值将返回给 `main`。这就是为什么 `main()` 被定义为 `int main()` 的原因。始终注意不要在\
  \ main 函数旁边使用 `;`，因为它会终止 main 函数且不会让程序的执行继续进行。当你使用 `void main()` 时，编译器不关心返回函数，并且只不会返回任何内容。\n\
  \n## 重用函数\n\nC++ 中的函数不受其可以使用次数的限制。同一个函数可以被反复使用。事实上，在大多数程序中，函数必须被重用。\n\n这是一个示例\n\n\
