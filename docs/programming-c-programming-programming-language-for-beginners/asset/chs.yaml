  \n操作符是表达式的最后一部分。这些是\n\n- **一元运算符 (Unary)**：作用于单个操作数的运算符。例如，应用于数字。\n- **二元运算符 (Binary)**：作用于两个不同或相同操作数。上面的示例使用了\
  \ `+`。\n- **三元运算符 (Ternary)**：作用于三个操作数的运算符。在 C++ 中只有一种\n\n## 变量大小与 sizeof 运算符\n\n\
  计算机中的内存基本上是以字节大小为单位组织的。每个内存块都有唯一的地址。有些变量只占用 1 字节。有些占用 2、4、8 字节等。使用所需的尺寸变量是明智的。由于每个位只能表示\
  \ 0 或 1，我们可以说它只能存储可能的值。同样，三个位可以存储八种可能的值。这种方式对存储的数据有限制。由于所有计算机的可存储数据都是有限的，我们使用不同大小的变量以免浪费内存。\n\
  \nC++ 中基础类型的大小\n\n| 类别 | 类型 | 最小大小 |\n| :--- | :--- | :--- |\n| 布尔 | bool | 1 字节\
