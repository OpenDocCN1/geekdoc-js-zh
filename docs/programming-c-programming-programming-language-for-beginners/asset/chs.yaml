  \ | 4 字节 |\n| 整数 | short | 2 字节 |\n| | int | 2 字节 |\n| | long | 4 字节 |\n| | long\
  \ long | 8 字节 |\n| 浮点数 | float | 4 字节 |\n| | double | 8 字节 |\n| | long double |\
  \ 8 字节 |\n\n我们不能说所有计算机上所有变量的大小都是相同的。变量的大小随机器而异。你可以通过 c++ 中名为 `sizeof` 的运算符了解你机器上变量的大小。\n\
