  \ expression` |\n\n## 算术运算符\n\n\n\n\n\n# 一元算术运算符：这些只需要一个操作数的算术运算符。这里是一元运算符的表。\n\n\
  | 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 一元加 | `+` | `+x` | `x`\
  \ 的值 |\n| 一元减 | `-` | `-x` | `x` 的取反 |\n\n## 二元运算符\n\n提到运算符时，基本上有五种。它们是加、减、除、乘和模。下表对它们中的每种进行了了解释。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 加法 | `+` | `x + y` |\
  \ `x` 加 `y` |\n| 减法 | `-` | `x - y` | `x` 减 `y` |\n| 乘法 | `*` | `x * y` | `x` 乘以\
  \ `y` |\n| 除法 | `/` | `x / y` | `x` 除以 `y` |\n| 模（取余） | `%` | `x % y` | `x` 除以 `y`\
  \ 的余数 |\n\n我们已经知道了加、减、除、乘等基本算术运算符。但我们中的大多数人可能对模运算没有概念。模运算符也被称为取余运算符。这个运算符将返回整数操作数的余数。我们使用这个运算符来测试一个数字是偶数还是奇数。如果余数为\
  \ `0`，则该数字为偶数；如果余数为 `1`，则该数字为奇数。\n\n这是一个示例，从 1 到 100 的数字每行打印 20 个。\n\n![](img/00029.jpeg)\n\
  \n## 结果\n\n![](img/00030.jpeg)\n\n## 关系运算符（比较）\n\n关系运算符用于变量之间的比较。C++ 中总共有六种关系运算符。它们如表所示。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 大于 | `>` | `x > y` |\
  \ 如果 `x` 大于 `y` 则为真，否则为假 |\n| 小于 | `<` | `x < y` | 如果 `x` 小于 `y` 则为真，否则为假 |\n| 大于等于\
  \ | `>=` | `x >= y` | 如果 `x` 大于或等于 `y` 则为真，否则为假 |\n| 小于等于 | `<=` | `x <= y` | 如果\
  \ `x` 小于或等于 `y` 则为真，否则为假 |\n| 等于 | `==` | `x == y` | 如果 `x` 等于 `y` 则为真，否则为假 |\n\
  | 不等于 | `!=` | `x != y` | 如果 `x` 不等于 `y` 则为真，否则为假 |\n\n这些运算符在布尔值 `true` 或 `false`\
  \ 上操作。为了让你更好地理解运算符，下面提供了一个包含整数和关系运算符的示例代码。\n\n![](img/00031.jpeg)\n\n上述代码的输出为：\n\
  \n![](img/00032.gif)\n\n## 运算符运算符\n\n在给定的变量内部，位操作运算符被用于处理数据的位。早期的计算机存储容量不大，内存非常昂贵。因此，创建了位操作运算符来解决这个问题。我们总共有六种位操作运算符。它们在下表中解释。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 左移 | `<<` | `x << y`\
  \ | `x` 的所有位左移 `y` 位 |\n| 右移 | `>>` | `x >> y` | `x` 的所有位右移 `y` 位 |\n| 位取反 | `~`\
  \ | `~x` | `x` 的所有位翻转 |\n| 位与 | `&` | `x & y` | `x` 的每个位与 `y` 的每个位进行与运算 |\n| 位或\
  \ | `|` | `x | y` | `x` 的每个位与 `y` 的每个位进行或运算 |\n| 位异或 | `^` | `x ^ y` | `x` 的每个位与\
  \ `y` 的每个位进行异或运算 |\n\n在 C++ 中，我们还有位赋值运算符。这些有助于用户轻松地修改变量。\n\n| 运算符 | 符号 | 形式 | 操作\
  \ |\n| :--- | :--- | :--- | :--- |\n| 左移赋值 | `<<=` | `x <<= y` | 将 `x` 左移 `y` 位\
  \ |\n| 右移赋值 | `>>=` | `x >>= y` | 将 `x` 右移 `y` 位 |\n| 位或赋值 | `|=` | `x |= y` | 将\
  \ `x | y` 赋值给 `x` |\n| 位与赋值 | `&=` | `x &= y` | 将 `x & y` 赋值给 `x` |\n| 位异或赋值 | `^=`\
  \ | `x ^= y` | 将 `x ^ y` 赋值给 `x` |\n\n## 块\n\n块无非就是语句块。块也被称为复合语句。它只不过是一组被编译器视为单个语句的语句。它们以\
  \ `{` 和 `}` 符号开始和结束。这些复合语句可以用于任何地方代替语句。它们不需要 `;` 来结束语句。这些块可以单独放置，也可以放在另一个块内部。\n\n\
  \n\n\n\n在上面提供的示例代码中，控制流有两种可能的路径。如果条件为真，CPU 将跳转并执行 A、B 和 D。但如果条件结果为假，控制流将跳转并执行 A、C\
  \ 和 D 语句。\n\n## 条件语句\n\n条件语句允许你在代码中形成一个汇点并将其发送到不同的路径，而不是保持为线性代码。C++ 的条件语句是 `if`\
  \ 语句——如果某个条件为假，程序应该执行一段代码；如果为真，则执行另一段代码：\n\n![](img/00039.jpeg)\n\n你知道第 1 行和第 5\
  \ 行的意思，但第 3 行稍有不同——这是一个 `if` 语句。它的作用是检查整数变量是否小于 `2\\`。如果是，它将运行一段代码；如果不是，它将正常继续。如果你编译并运行这里写的内容，你将在屏幕上看到打印出“a\
  \ is less than 2!”\n\n## 循环\n\n循环用于需要重复使用代码的程序。它们将代码放入循环中，直到条件满足。想象一下，如果你编写一段代码，每行打印从\
  \ 1 到 100 的数字。为此类程序编写代码将非常困难且耗时。对于这种情况，我们使用循环。循环使控制流保持在循环中，直到条件满足。\n\n所以，我们的代码现在读取用户输入，它可以根据这些输入执行各种不同的操作，但现在我们将观察如何让这些代码反复执行相同的操作，只是使用的参数略有不同。为了做到这一点，我们需要使用循环，循环是一段重复执行不同次数的代码，直到它完成了需要执行的任务并满足了特定的\
  \ C++ 条件。C++ 有三种不同类型的循环：\n\n* `while`\n* `for`\n* `do`\n\n`while` 循环是最简单的，看起来与 `if`\
  \ 语句非常相似：\n\n![](img/00040.gif)\n\n这里 `while` 循环的作用是说，只要用户输入的变量不等于 `10`，代码就需要从用户那里获取某些输入。在\
  \ C++ 中，感叹号（`!`）表示“不”，所以 `!` 意味着“不等于”。\n\n在这种情况下，如果用户输入的已经是 `10`，那么代码将不会被执行，循环也将被忽略。从事实上，`while`\
  \ 循环被看作是一个扩展的 `if` 语句，在代码运行后会回到其内部。\n\n在继续之前，我想向你展示无限循环是什么样的，即一个一直运行的循环：\n\n![](img/00041.gif)\n\
  \n如你所见，它是如果 1 等于 1，就打印一个 a，以此此类推。\n\n下一个简单的循环是 `do while` 循环，因为它与 `while` 循环相似。\n\
  \n![](img/00042.gif)\n\n虽然它看起来与 `while` 循环有些不同，但它本质上在做相同的工作，只有一个重要的区别——`while` 循环检查条件并查看其是否为真，而\
  \ `do while` 循环先运行代码，然后再检查条件是否为真。因为这样，所有的代码都会保证运行。\n\n第三种 C++ 循环是 `for`，这是最复杂的一种。但一旦你理解了它，你就会发现它是最强大的。在这里，我们只看简单的用法：\n\
  \n![](img/00043.gif)\n\n这段代码的意思是，首先将 `i` 的值设置为 `2\\`。然后它说，只要 `i` 小于 `10`，它就将该值输出到屏幕上，然后增加\
  \ `i`。你必须记住一点——`for` 循环第一行中使用的所有变量必须是同一个变量。同样重要的是记住，与 `while` 循环不同，第一个语句是赋值而不是条件判断。\n\
  \n如果你想处理许多数据，，这种循环很有用，我将在下一节中更多地讨论这一点。现在，如你所见，它能做的最有用的事情就是抛出一系列数字。这是一个很有用的技巧，并顺带带我们进入下一个章节。\n\
  \n## If 语句\n\n‘if’ 语句是 C++ 中最基本的条件判断语句。它会检查给定的条件，并根据条件的结果改变控制流。\n\n这里有一个包含 ‘if’\
  \ 语句的简单代码。\n\n![](img/00044.gif)\n\n我们已经知道 `if` 语句接受一个语句作为条件。我们还知道可以使用块（Block）来代替单个语句。这意味着我们可以在\
  \ `if` 语句内部使用代码块作为条件。下面的示例展示了在 `if` 语句中使用代码块作为条件。\n\n![](img/00045.jpeg)\n\n你也可以将一个\
  \ `if` 语句放在另一个 `if` 语句内部。内部另一个 `if` 语句的 `if` 语句被称为嵌套 `if`。\n\n这里有两个示例，可以帮助你更好地理解嵌套\
  \ `if`。\n\n示例 1：\n\n![](img/00046.jpeg)\n\n示例 2：\n\n![](img/00047.jpeg)\n\n你可以将一个\
  \ `if` 语句放入块中并附加 `else` 语句。你可以看下面的示例。\n\n![](img/0048.jpeg)\n\n## 带有逻辑运算符的 If 语句\n\
  \n可以使用带有逻辑运算符的 `if` 语句同时检查多个条件。示例代码如下：\n\n![](img/0049.jpeg)\n\n‘if’ 语句可以用于提前返回。提前返回无非将控制回到函数的结尾。\n\
  \n![](img/0050.jpeg)\n\n## Switch 语句\n\nSwitch 语句也是改变控制流的语句。Switch 语句使用多路分支。\n\n\
  与 if else 语句相比，switch 语句由于以下原因更为优：\n\n* Switch 语句更容易调试\n* 这些语句易于维护\n* Switch 语句执行更快\n\
  * 它们更易读\n* Switch 语句的深度是固定的\n* 可用于异常处理\n\nswitch 语句的基本语法如下。\n\n`case constant1:`\n\
  如果 n 等于 constant1 则执行代码；\n`break;`\n`case constant2:`\n如果 n 等于 constant2 则执行代码；\n\
  `break;`\n`.`\n`.`\n`.`\n`default:`\n如果 n 不匹配任何情况则执行代码；\n\n下面的程序展示了为什么 switch 比\
  \ if-else 语句更好用。\n\n示例：\n\n![](img/0051.jpeg)\n\n现在看使用 switch 语句解决相同的问题。\n\n![](img/0052.jpeg)\n\
  \n## Break 语句\n\n我们经常使用 `break` 语句终止 case 语句而不是整个函数。这将指示编译器放弃当前的 case 并继续执行下一个语句。因此，在\
  \ `break` 语句之后，控制流进入 switch 块之后的语句。这里有一个展示在 case 语句后附加 `break` 语句的示例。\n\n![](img/0053.jpeg)\n\
  \n## Goto\n\n为了让 CPU 跳到代码中的不同位置，我们使用了称为 `goto` 语句的流控制语句。为此，我们需要设置一个 `goto` 语句可以识别的标记标记。下面的示例如果输入了负数，`goto`\
  \ 语句将控制流带到 `tryAgain` 标记，在那里必须选择非负数。\n\n示例 1：\n\n![](img/0054.jpeg)\n\n示例 2：\n\n\
  ![](img/0055.jpeg)\n\n## While\n\n在所有循环中，`while` 是最简单的。`while` 循环与 ‘if’ 语句非常相似。在这里，条件放在\
  \ `while` 语句之后。这将控制流带到程序的开头，并将其放入循环中直到条件满足。\n\n每当代码在成功执行后回到开头时，被称为完成了一次迭代。\n\n示例：\n\
  \n![](img/0056.jpeg)\n\n\n\n\n\n![](img/00057.jpeg)\n\n这是另一个 `while` 循环的简单示例。\n\n\
  ![](img/00058.jpeg)\n\n输出：\n\n![](img/00059.jpeg)\n\n就像 `if` 条件一样，你可以在循环内部使用循环。如果你将一个循环放在另一个循环内部，它被称为嵌套循环。\n\
  \n嵌套循环的示例：\n\n![](img/00060.gif)\n\n上面的程序将显示：\n\n![](img/00061.jpeg)\n\n## do-while\
  \ 循环\n\n`do-while` 循环与 `while` 循环相似，仅有一处不同。如果 `while` 循环中的条件不满足，我们知道它不会执行循环。但如果我们希望代码即使条件不满足的情况下至少运行一次，我们可以利用\
  \ `C++` 中的 `do-while` 循环。使用该循环即使在条件不满足也会执行一次代码。下面的示例展示了 `do-while` 循环。\n\n![](img/00062.jpeg)\n\
  \n## for 循环\n\n`for` 循环是 `C++` 中应用广泛的循环语句。如果你知道要迭代多少次，这是一个完美的选择。它易于使用，因为它允许用户在每次迭代后更改变量。这用起来非常简单，因为你可以在同一个地方一次性声明所有内容。\n\
  \n这是一个 `for` 循环的简单示例。\n\n示例 1：\n\n![](img/00063.jpeg)\n\n上述代码的输出为：\n\n![](img/00064.jpeg)\n\
  \n示例 2：\n\n![](img/00065.gif)\n\n输出：\n\n![](img/00066.jpeg)\n\n## Break and continue\n\
  \n在之前的示例中我们已经见过 `break` 语句。在这里我们将 `break` 语句与 `continue` 语句一起使用。我们知道 `break` 语句可以终止该语句以及\
  \ `while` 循环和 `do while` 循环等循环语句。但当你函数末尾的 `switch` 语句使用它时，它表示该 case 已完成或结束。这是一个显示\
  \ `switch` 和 `break` 结合的示例。\n\n示例：\n\n![](img/00067.jpeg)\n\n当我们在循环中使用 `break` 语句时，可以提前终止循环。下面的示例将向你展示如何操作。\n\
  \n![](img/00068.jpeg)\n\n在上面的程序中，用户可以输入最多 40 个字符。如果用户按下回车键，循环就可以终止。通过按下回车键，用户可以选择提前终止循环。\n\
  \n### Continue 语句\n\n在某些情况下，你需要比通常时间更早地回到循环开头。这对于跳过该迭代循环的剩余部分非常有用。下面的示例展示了 `continue`\
  \ 语句的使用。\n\n![](img/00069.jpeg)\n\n在上面的程序中，我们在 `for` 循环中使用了 `continue` 语句，它将打印 0\
  \ 到 19 之间所有不能被 4 整除的数字。\n\n## 使用 continue 和 break\n\n通常不建议将 `continue` 与 `break`\
  \ 配对使用。因为这会导致程序代码执行流出现偏差。但如果使用得当，`continue` 和 `break` 的组合被证明是高效的。这里有一个显示的小示例。\n\n\
  ![](img/00070.jpeg)\n\n## 随机数生成\n\n某些程序需要生成随机数。除非你给计算机一段特定的代码来执行，否则计算机无法自己生成随机数。这些随机数特别用于与统计和游戏相关的程序。像在线扑克或骰子游戏等游戏使用随机数生成算法来生成随机数。\n\
  \n如果一个游戏为每个玩家不断生成相同的数字，会有多趣呢？对于像计算机这种只知道真或假值的机器，它们无法自己生成这些随机数。对于此类情况，我们使用伪随机数生成算法。在这里，计算机将获取一个实际上是非随机的数字，被称为\
  \ `seed`（种子），并执行数学运算将给定的 `seed` 转换为一个看似随机的另一个数字。\n\n高效的随机数生成器将不断执行此过程，并生成一个与 `seed`\
  \ 完全无关的数字。这些随机数也用于 ATM 机的安全目的。\n\n生成伪随机数并不困难。在这里你将通过下面的示例理解它。该程序生成了 100 个伪随机数。\n\
  \n![](img/00071.jpeg)\n\n输出\n\n![](img/00072.jpeg)\n\n你可以从上面的输出看到，所有的数字都是随机的，它们之间没有关系。如果有任何关系，那也是随机的。\n\
  \n你实际上可以使用内置的伪随机数生成器在 `C++` 中生成随机数。在这里，你将利用两个函数：`srand()` 和 `rand()`。\n\n`srand()`\
  \ 将设置初始值，换句话说是 `seed` 值。而 `rand()` 获取 `srand()` 的值并基于 `srand()` 值开始生成随机数。你可以通过下面的示例更好地理解它。\n\
  \n![](img/00073.jpeg)\n\n这将生成 100 个随机数\n\n![](img/00074.jpeg)\n\n关于生成的随机数，你可以看到没有数字小于给定的\
  \ `srand()` 值。这是因为该值被视为基准，其他数字都是从它生成的。\n\n# 第 8 章：存储类\n\n在给定的 `C++` 程序中，由以下指定符定义的函数变量的作用域和生命周期为：\n\
  \n- `auto`\n- `static`\n- `register`\n- `extern`\n\n## auto 存储类\n\n对于所有局部变量，默认存储类都是\
  \ `auto`。\n\n示例：\n\n```cpp\nint month;\nauto month;\n```\n\n## register 存储类\n\n\
  如果你希望定义局部变量并将它们存储在 RAM 而不是内存中，可以使用 `register`。\n\n语法：\n```cpp\nregister int miles;\n\
  ```\n你应该记住，当你定义一个寄存器时，并不意味着该变量存储在寄存器中。\n\n## Static 类\n\n与其每次进入和离开作用域时都创建和销毁局部变量，`static`\
  \ 存储类告诉编译器在其生命周期内存储局部变量。因此，如果你希望局部变量在函数调用期间保持其值，你应该将这些局部变量设为 `static`。\n\n`static`\
  \ 修饰符不仅限于局部变量，也可以应用于全局变量。之后，该变量的作用域将被限制在声明该变量的文件中。\n\n当你在类的成员上使用 `static` 时，该成员的唯一副本将由该类的所有对象共享。这是一个示例。\n\
  \n示例：\n\n```cpp\n#include <iostream>\n\n// 函数声明\nvoid func(void);\n\nstatic int\
  \ count = 10; /* 全局变量 */\n\nmain()\n{\n    while(count--)\n    {\n        func();\n\
  \    }\n    return 0;\n}\n\n// 函数定义\nvoid func( void )\n{\n    static int i = 5;\
  \ // 局部静态变量\n    i++;\n    std::cout << \"i is \" << i ;\n    std::cout << \" and\
  \ count is \" << count << std::endl;\n}\n```\n\n当你编译并执行上述代码时，将产生以下输出。\n\ni is 6\
  \ and count is 9\ni is 7 and count is 8\ni is 8 and count is 7\ni is 9 and count\
  \ is 6\ni is 10 and count is 5\ni is 11 and count is 4\ni is 12 and count is 3\n\
  i is 13 and count is 2\ni is 14 and count is 1\ni is 15 and count is 0\n\n\n\n\n\
  \n## extern 存储类\n\n有一些全局变量对所有程序文件都是可见的。`extern` 存储类可以用于提供这些对程序文件可见的全局变量引用。你不能使用\
  \ `extern` 初始化变量，因为它只会指向一个预定义的存储位置的争议性名称。\n\n当你有多个文件，并且定义了一个其他文件可以使用的函数或全局变量时，你可以在另一个文件中通过\
  \ `extern` 来提供该函数或变量的引用。简单来说，我们使用 `extern` 来声明存在于另一个文件中的函数或全局变量。\n\n在多个文件共享相同函数或全局变量的情况下，会使用\
  \ `extern` 修饰符。这是一个示例程序。\n\n### 示例：\n\n第一个文件：main.cpp\n\n```cpp\n#include <iostream>\n\
  \nint count ;\n\nextern void write_extern();\n\nmain()\n{\n  count = 5;\n  write_extern();\n\
  }\n```\n\n第二个文件：support.cpp\n\n```cpp\n#include <iostream>\n\nextern int count;\n\
  \nvoid write_extern(void)\n{\n  std::cout << \"Count is \" << count << std::endl;\n\
  }\n```\n\n在这里，程序中的 `count` 是在另一个文件中使用 `extern` 关键字声明的。现在，如果你像下面组合这两个文件。\n\n```bash\n\
  $g++ main.cpp support.cpp -o write\n```\n\n将产生一个正确的可执行程序。现在尝试执行它并检查如下所示的结果。\n\n\
  ```bash\n./write\n5\n```\n\n# 第 9 章：数组\n\n数组无非变量的列表，所有变量因为具有共同的用途而被聚集在一起。它更像是一种保持一切整洁有序的方法，正如从下面的代码所示：\n\
  \n```cpp\nint a[5]\n```\n\n它看起来像一个标准变量，但注意方括号的使用。这些括号包含了你在声明中需要的数组大小，或者说是变量的数量，在这种情况下是\
  \ 5 个整数变量。数组可以是任何你想要的，只要你的电脑有足够的 RAM 来支持，但它们在任何时候只能包含一种类型的变量。\n\n当访问某个变量时，只需在方括号内放入数字即可。只需记住，当\
  \ C++ 标记变量或任何内容时，它是从 0 开始而不是 1 开始。考虑到计算机是如何理解数字的，这是有意义的。如果你的数组有 8 个项目，而你从数字 1 开始，你的计算机只能读取前\
  \ 7 个位置（二进制 – 1-7）。你也可以让它使用 0，但那样 0 就是第一个变量。下面的代码显示了你如何处理访问列表中第一个之前的变量：\n\n![](img/00075.jpeg)\n\
  \n你应该记住的一点是，你不应该尝试访问不存在的变量，例如，只有 6 个位置的数组中的第 9 个变量，或者实际上没有分配变量的变量。在这种情况下，你将得到所谓的“垃圾”值，因为计算机返回的仅仅是这样——垃圾。\n\
  \n在第一种情况下，你会得到段错误（segmentation fault），之所以这样命名是因为计算机正试图进入它不被允许进入的内存段。这可能导致程序意外终止，并附带错误报告。为了避免发生任何此类情况，养成在开始之前初始化数组每个位置的习惯。就像普通变量一样，看起来像这样：\n\
  \n```cpp\nint a[5] = { 0, 0, 0, 0, 0 };\n```\n\n重要——注意大括号。这些括号内的每个项目（用逗号隔开）都被分配给数组中的特定变量。第一个设置为括号内的第一个值，第二个设置为第二个，依此类推。如果数组没有填满，每个未分配的变量将返回\
  \ 0：\n\n```cpp\nint a[5] = { 1 };\n```\n\n你声明了会有 5 个变量，但只指定了 1 个，所以其他的将显示为 0。\n\n\
  数组最用途之一是显示列表，也许是一组人的年龄，或者正如我稍后向你展示的，使用它们来协调大表格和地图中的空间。\n\n上面的数组被称为一维数组。这对于列表很有用，但地图呢？在这种情况下，你需要一个二维数组，而最简单的方法就是直接添加第二组方括号：\n\
  \n```cpp\nint array[4][5];\n```\n\n所以，第一维度显示 4 个整数，第二个维度是 5 个整数。从物理地图的角度考虑数组，我们可以说这一个是\
  \ 4 X 5，或者可以是 5 X 4。访问数组与访问一维数组相同，区别在于我们使用的方括号数量：\n\n```cpp\ncout << array[0][1];\n\
  ```\n\n就像你处理一维数组一样，你可以批量定义一个 t 维数组——你做的只是添加第二组大括号：\n\n```cpp\nint array[2][2] =\
  \ { {0, 0}, {1, 1} };\n```\n\n这看起来并没有那么复杂——它只是将第 1 行设为 0, 0，将第 2 行设为 1, 1。只要你记住配对括号，一切都会就绪。如果你想遍历二维数组，只需在每个循环内部嵌套另一个循环：\n\
  \n![](img/0076.gif)\n\n# 第 10 章：类、对象、接口\n\n## 类和对象\n\n设计 C++ 的主要目的是在 C 语言中引入面向对象编程的概念。在面向对象编程中，类是核心特性。这些类被称为自定义类型。\n\
  \n类可以被认为是一个整洁的包，结合了数据展示和对该数据的方法。对象的形状由类指定。类内部的函数和数据形成了类的成员。\n\n## 封装\n\n每个 C++ 程序都包含以下两个基本元素。\n\
  \n*   程序语句（代码）：程序语句是程序中执行特定操作的部分。这些被称为函数。\n\n*   程序数据：数据可以被视为给定程序的程序，受该程序中函数的影响。\n\
  \n\n\n\n\n封装是面向对象编程中的一个概念，它将数据和操作这些数据的函数绑定在一起。封装保护数据免受外部元素的干扰和误用。数据封装产生了一个重要的面向对象编程概念，称为数据隐藏。\n\
  \n数据封装可以定义为一种将数据和使用该数据的函数封装在一起的机制。数据抽象可以定义为一种暴露接口并隐藏实现细节的机制。\n\n通过创建名为 `classes`\
  \ 的用户定义类型，可以实现封装和数据隐藏。正如我们已经所知道的，`class` 可以包含私有、公共或受保护的成员。在 `class` 中定义的、没有访问说明符的项目默认是私有的。这里有一个示例。\n\
  \n### 示例：\n\n```cpp\nclass Box\n{\n  public:\n    double getVolume(void)\n    {\n\
  \        return length * breadth * height;\n    }\n  private:\n    double length;\
  \      // 箱箱的长度\n    double breadth;  // 箱子的宽度\n    double height;      // 箱子的高度\n\
  };\n```\n\n在这里，变量 `length`、`breadth` 和 `height` 是私有的。这意味着只有 `Box` 类的成员才允许访问它们。程序的其他部分都无法访问这些变量。这是实现封装的方法之一。\n\
  \n如果你希望类的某些部分是公共的，你应该使用 `public` 关键字来定义它们。在 `public` 说明符之后定义的所有函数和变量都将被定义为公共的，程序中的任何函数都可以访问它们。\n\
  \n通过将某个特定类设置为另一个类的友（friend），会暴露实现细节并导致封装的减少。将类的细节从其他类中隐藏起来始终是明智的。应该尽可能地隐藏类。\n\n\
  任何使用私有和公共成员实现 `class` 的 C++ 程序都可以被视为数据抽象和数据封装的示例。考虑下面这个示例。\n\n### 这是一个关于数据封装的示例。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Adder\n{\n  public:\n\
  \    // 构造函数\n    Adder(int i = 0)\n    {\n        total = i;\n    }\n    // 对外世界的接口\n\
  \    void addNum(int number)\n    {\n        total += number;\n    }\n    // 对外世界的接口\n\
  \    int getTotal()\n    {\n        return total;\n    };\n  private:\n    // 外部世界的隐藏数据\n\
  \    int total;\n};\n\nint main( )\n{\n  Adder a;\n  a.addNum(10);\n  a.addNum(20);\n\
  \  a.addNum(30);\n  cout << \"Total \" << a.getTotal() << endl;\n  return 0;\n}\n\
  ```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\nTotal 60\n\n上述类将相加数字并返回它们的和。在这里成员 `addNum` 和 `getTotal`\
  \ 是公共的，它们是用户在使用该类时应该知道的接口。虽然类中的私有成员被隐藏了，但它们对于类的正常运行是必要的。\n\n### 设计策略\n\n除非我们希望暴露它们，否则通过将类设置为私有来隐藏其内容始终是明智的。这是良好的封装。\n\
  \n大多数数据成员保持隐藏状态，但这同样适用于其他成员，包括虚函数。\n\n## C++ 类定义\n\n每当你定义类时，你基本上是在为给定的数据类型定义一个蓝图。虽然这不会定义任何数据，但定义了类名的含义，即该类所包含的对象以及可以在这些对象上实现的操作。\n\
  \n类的定义以 `class` 关键字开始，然后是类名和封装在大括号内部的类体。在类名之后应该放置一个声明列表或分号。考虑下面的示例，该示例使用 `class`\
  \ 关键字定义了 `Box`。\n\n### 示例：\n\n```cpp\nclass Box\n{\n  public:\n    double length;\
  \  // 箱子的长度\n    double breadth;  // 箱子的宽度\n    double height;  // 箱子的高度\n};\n```\n\
  \n`public` 关键字将决定访问权限。范围内的任何人都可以访问类的成员。类的成员可以指定为私有或受保护。\n\n## 定义 C++ 对象\n\n每个类都为它的对象提供了一个蓝图。可以使用\
  \ `class` 关键字创建类的对象。\n\n## 访问数据\n\n借助直接访问运算符，你可以访问成员。这里有一个示例：\n\n### 示例：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\n\nclass Box\n{\n  public:\n    double\
  \ length;  // 箱子的长度\n    double breadth;  // 箱子的宽度\n    double height;  // 箱子的高度\n\
  };\n\nint main( )\n{\n  Box Box1;\n  Box Box2;\n  double volume = 0;\n  Box1.length\
  \ = 5.0;\n  Box1.breadth = 6.0;\n  Box1.height = 7.0;\n  volume = Box1.length *\
  \ Box1.breadth * Box1.height;\n  cout << \"Volume of Box1 : \" << volume << endl;\n\
  \n  Box2.length = 10.0;\n  Box2.breadth = 12.0;\n  Box2.height = 13.0;\n  volume\
  \ = Box2.length * Box2.breadth * Box2.height;\n  cout << \"Volume of Box2 : \" <<\
  \ volume << endl;\n\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\nVolume of\
  \ Box1 : 210\nVolume of Box2 : 1560\n\n你应该始终记住类的受保护和私有成员不能通过成员运算符直接访问。现在，我们将查看如何处理这些。\n\
  \n## 详细的类与对象\n\n到为止，我们处理了 C++ 类和对象的基本概念。我们将在下面的子章节中讨论更多概念。\n\n| 概念 | 描述 |\n| :---\
  \ | :--- |\n| 类成员函数 | 类的一部分可以定义为函数，该函数在类内部有原型或定义，类似于其他变量。 |\n| 类访问修饰符 | 类的成员可以声明为公共、受保护或私有。成员的默认访问定义总是私有的。\
  \ |\n| 构造函数与析构函数 | 类构造函数可以定义为类内部的一个特殊函数，每当类中创建一个新对象时调用。析构函数与构造函数类似，但它在删除创建的对象时被调用。\
  \ |\n| C++ 拷贝构造函数 | 拷贝构造函数是一种构造函数，用于使用已经创建的类对象来创建对象。 |\n| C++ 友函数 | 友函数是可以访问给定类的私有和受保护成员的东西。\
  \ |\n\n\n\n\n\n| [C++ 内联函数](http://www.tutorialspoint.com/cplusplus/cpp_inline_functions.htm)\
  \ | 在内联函数中，编译器会在函数体内的调用该函数的地方展开该函数的记录。 |\n| [C++ 中的 this 指针](http://www.tutorialspoint.com/cplusplus/cpp_this_pointer.htm)\
  \ | 在 C++ 中，每个对象都有一个指向自身的特殊指针。 |\n| [指向 C++ 类的指针](http://www.tutorialspoint.com/cplusplus/cpp_pointer_to_class.htm)\
  \ | 指向类的指针类似于指向结构体的指针。事实上，类可以被看作是一个包含函数的结构体。 |\n| [类的静态成员](http://www.tutorialspoint.com/cplusplus/cpp_static_members.htm)\
  \ | 类的函数成员和数据成员都可以声明为静态的。 |\n\n## 接口 (Interfaces)\n\n在 C++ 中，可以通过接口在不提交其类具体实现的情况下，描述该类的能力或行为。\n\
  \nC++ 中的接口是通过抽象类实现的。不要混淆数据抽象（Data abstraction）与抽象类。数据抽象是一个不同的概念，其中实现细节与相关数据是分离的。\n\
  \n通过将类的中任意一个函数声明为纯虚函数，可以将该类制为抽象类。你可以在其声明中添加 `= 0` 来指定纯虚函数。下例所示。\n\n```cpp\nclass\
  \ Box\n{\n  public:\n    // 纯虚函数\n    virtual double getVolume() = 0;\n\n  private:\n\
  \    double length;      // 箱子的长度\n    double breadth;      // 箱子的宽度\n    double\
  \ height;      // 箱的高度\n};\n```\n\n任何抽象类的主要目的是提供一个合适的基类，以便其他类可以继承这个基类。不能使用抽象类实例化对象。抽象类只能作为接口。当尝试实例化抽象类的对象时，将产生编译错误。\n\
  \n如果你希望实例化抽象类的子类，则它的每个虚函数都应该被实现。这意味着它将支持抽象类声明的接口。当派生类中重写纯虚函数失败时，尝试实例化该类的对象将导致编译错误。\n\
  \n在 C++ 中，用于实例化对象的类被定义为具体类（concrete classes）。\n\n### 抽象类示例\n\n在以下示例中，父类为基类提供了一个实现\
  \ `getArea()` 函数的接口。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \n// 基类\nclass Shape\n{\npublic:\n  // 提供接口框架的纯虚函数\n  virtual int getArea() = 0;\n\
  \n  void setWidth(int w)\n  {\n      width = w;\n  }\n\n  void setHeight(int h)\n\
  \  {\n      height = h;\n  }\n\nprotected:\n  int width;\n  int height;\n};\n\n\
  // 派生类\nclass Rectangle: public Shape\n{\npublic:\n  int getArea()\n  {\n      return\
  \ (width * height);\n  }\n};\n\nclass Triangle: public Shape\n{\npublic:\n  int\
  \ getArea()\n  {\n      return (width * height)/2;\n  }\n};\n\nint main(void)\n\
  {\n  Rectangle Rect;\n  Triangle Tri;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n\
  \  // 打印对象的面积。\n  cout << \"Total Rectangle area: \" << Rect.getArea() << endl;\n\
  \n  Tri.setWidth(5);\n  Tri.setHeight(7);\n  // 打印对象的面积。\n  cout << \"Total Triangle\
  \ area: \" << Tri.getArea() << endl;\n\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \nTotal Rectangle area: 35\nTotal Triangle area: 17\n\n在上面的示例中，接口是由抽象类根据 `getArea()`\
  \ 定义的。另外两个类实现了相同的函数，但使用了针对给定形状的不同面积计算方法。\n\n### 设计策略 (Designing Strategy)\n\n抽象基类可以被面向对象的系统使用，用于提供适用于所有外部应用程序的标准化且通用接口。然后，类可以从该抽象基类继承，这些类都将以类似的方式运行。\n\
  \n外部应用程序提供的所有能力（公共函数）最好将作为纯虚函数从给定的抽象基类提供。派生类将提供这些纯虚函数的实现。这些派生类中的每一个都对应于一种特定类型的应用程序。\n\
  \n有了这种架构，你可以在系统定义后向其添加新的应用程序。\n\n# 第 1 章：模板 (Templates)\n\n模板可以被视为泛型编程的基础。泛型编程涉及与特定类型无关的编码。你可以将模板想象成公式或蓝图，通过它可以创建泛型类或函数。泛型编程的几个例子是使用模板概念开发的库容器。每个容器（如\
  \ `vector`）都有一个类型。但可以定义不同的种类。例如 `vector<string>` 或 `vector<int>`。使用模板，除了类之外，也可以定义其他。现在我们将看到它是如何运作的。\n\
  \n## 函数模板 (Function Template)\n\n模板定义的通用语法如下。\n\n```cpp\ntemplate <class type>\n\
  ret func-name(parameter)\n{\n    // 函数体\n}\n```\n\n在这里，用于数据类型的占位符 `name` 被函数使用。在函数定义中，这个\
  \ `name` 可以被使用。这里有一个示例：\n\n函数模板将返回两个值中的最大值。\n\n```cpp\n#include <iostream>\n#include\
  \ <string>\nusing namespace std;\n\ntemplate <typename T>\ninline T& Max (T const&\
  \ a, T const& b)\n{\n    return a > b ? a : b;\n}\n\nint main ()\n{\n  int i = 39;\n\
  \  int j = 20;\n  cout << \"Max(i, j): \" << Max(i, j) << endl;\n\n  double f1 =\
  \ 13.5;\n  double f2 = 20.7;\n  cout << \"Max(f1, f2): \" << Max(f1, f2) << endl;\n\
  \n  string s1 = \"Hello\";\n  string s2 = \"World\";\n  cout << \"Max(s1, s2): \"\
  \ << Max(s1, s2) << endl;\n  return 0;\n}\n```\n\n如果你编译并执行给定代码，将产生如下输出。\n\nMax(i,\
  \ j): 39\nMax(f1, f2): 20.7\nMax(s1, s2): World\n\n## 类模板 (Class Template)\n\n在\
  \ C++ 中，除了定义函数还可以定义类模板。泛型类的语法如下。\n\n语法：\n\n```cpp\ntemplate <class type>\nclass-name\
  \ {\n//...\n};\n```\n\n从上述语法可以看出，`type` 是占位符名称。在类的实例化期间将指定该 `type`。多个泛型类型可以用 `,`\
  \ 分隔。在下面的示例中，定义了一个类 `Stack<>`。推和弹出栈元素的泛型方法将被实现。\n\n示例：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <cstdlib>\n#include <string>\n#include <stdexcept>\n\
  using namespace std;\n\ntemplate <class T>\nclass Stack {\n  private:\n    vector<T>\
  \ elems; // 元素\n  public:\n    void push(T const&); // 推入元素\n    void pop();   \
  \      // 弹出元素\n    T top() const;      // 返回顶部元素\n    bool empty() const{ //为空返回\
  \ true。\n      return elems.empty();\n    }\n};\n\ntemplate <class T>\nvoid Stack<T>::push\
  \ (T const& elem)\n{\n  // 添加传递元素的拷贝\n  elems.push_back(elem);\n}\n\ntemplate <class\
  \ T>\nvoid Stack<T>::pop ()\n{\n  if (elems.empty()) {\n    throw out_of_range(\"\
  Stack<>::pop(): empty stack\");\n  }\n  // 删除最后一个元素\n  elems.pop_back();\n}\n\n\
  template <class T>\nT Stack<T>::top () const\n{\n  if (elems.empty()) {\n    throw\
  \ out_of_range(\"Stack<>::top(): empty stack\");\n  }\n  // 返回最后一个元素的拷贝\n  return\
  \ elems.back();\n}\n\nint main()\n{\n  try {\n    Stack<int> intStack; // 整数栈\n\
  \    // ...\n  } catch (const exception& e) {\n    cout << e.what() << endl;\n \
  \ }\n  return 0;\n}\n```\n\n\n\n\n\n```cpp\nStack<string> stringStack;    // 字符串栈\n\
  \n// 操作 int 栈\nintStack.push(7);\ncout << intStack.top() <<endl;\n\n// 操作字符串栈\n\
  stringStack.push(\"hello\");\ncout << stringStack.top() << std::endl;\nstringStack.pop();\n\
  stringStack.pop();\n}\n\ncatch (exception const& ex) {\n    cerr << \"Exception:\
  \ \" << ex.what() <<endl;\n    return -1;\n}\n}\n```\n\n在编译并运行上述代码后，将产生以下输出。\n\n\
  7\n\nhello\n\nException: `Stack<>::pop()`: empty stack\n\n# 第 12 章：命名空间 (Namespaces)\n\
  \n在实时编程中，你可能会遇到这种情况：在给定类中有两个同名的对象。为了区分同一类中具有相同名称的成员，我们需要在名称的基础上添加一些额外信息。例如，如果有两个名为\
  \ `Charles` 的人，你可以根据他们居住的区域或任何此类信息来区分他们。\n\n现在考虑这种情况在你的应用程序中发生的情况。例如，如果定义了一个特定名称的函数，而在另一个目录下也有同名的函数。在这种情况下，编译器无法区分这两个函数，并且可能不会调用你在代码中引用的那个函数。\n\
  \n为了克服这一困难，我们使用了命名空间（namespaces），它们被专门设计用作额外信息，可以添加到函数、变量和类等，这些元素在不同的库中共享相同的名称。通过使用命名空间，可以定义名称所在的上下文。命名空间用于定义作用域。\n\
  \n## 定义命名空间\n\n你可以使用 `namespace` 关键字来定义命名空间，后面紧跟命名空间的名称。定义命名空间的语法所示。\n\n语法：\n\n\
  ```cpp\nnamespace namespace_name {\n  // 代码声明\n}\n```\n\n要调用函数或变量的命名空间版本，应该在该函数前面添加命名空间名称，如下：\n\
  \n`name::code;` // code 可能是变量或函数。\n\n现在我们将观察命名空间作用域对包含函数和变量的实体。\n\n示例：\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n\
  \  void func(){\n      cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\n\
  namespace second_space{\n  void func(){\n      cout << \"Inside second_space\" <<\
  \ endl;\n  }\n}\n\nint main ()\n{\n  // 调用第一个命名空间中的函数。\n  first_space::func();\n\
  \  // 调用第二个命名空间中的函数。\n  second_space::func();\n  return 0;\n}\n```\n\n当你编译并运行这段代码时，将产生以下输出。\n\
  \nInside first_space\n\nInside second_space\n\n## using 指令 (The using directive)\n\
  \n通过 `using namespace` 指令，可以避免添加命名空间前缀。该指令将指示编译器，后续代码在使用指定命名空间中的名称。\n\n你也可以通过 `using\
  \ namespace` 指令来避免添加命名空间前缀。该指令告诉编译器，后续代码正在使用指定命名空间中的名称。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n  void func(){\n   \
  \   cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\nnamespace second_space{\n\
  \  void func(){\n      cout << \"Inside second_space\" << endl;\n  }\n}\n\nint main\
  \ ()\n{\n  // 调用第一个命名空间中的函数。\n  first_space::func();\n  // 调用第二个命名空间中的函数。\n  second_space::func();\n\
  \  return 0;\n}\n```\n\n（注：提供的文本后半部分存在大量重复和混乱句子。我已根据提供文本的核心逻辑进行了整理，在保留代码示例的同时维护了语义含义。）\n\
  \n# 第 13 章：继承 (Inheritance)\n\n在面向对象编程中，继承被认为是一个重要的概念。通过继承，可以根据另一个类来定义类。\n\n在创建类时，程序员可以继承已存在类中的类成员，从而避免创建新成员函数和新数据成员。被继承成员的类被称为基类（base\
  \ class），而新类被称为派生类（derived class）。\n\n通过继承，实现了“是一个（is-a）”的关系。例如，爬行动物是一种动物，蛇是一种爬行动物，因此蛇是一种动物。\n\
  \n## 基类与派生类 (Base & Derived Classes)\n\n在创建类时，该类并不限于派自单个类。在 C++ 中，一个类可以派自多个基类，并从中继承所有这些类的数据和函数。类派生列表可以用于指定派生类。类派生列表可以包含一个或多个基类的名称。\n\
  \n\n\n\n\n`class derived-class: access-specifiers base-class`\n\n在这里，访问修饰符可以是 `public`、`private`\
  \ 或 `protected`。基类是一个已经定义的类。如果没有使用访问修饰符，默认它将被视为 `private`。\n\n在下文的示例中，让我们考虑一个名为\
  \ `Shape` 的基类以及派生自该基类的 `Rectangle` 类。\n\n示例：\n\n```cpp\n#include <iostream>\n\n\
  using namespace std;\n\n// Base class\nclass Shape\n{\n  public:\n    void setWidth(int\
  \ w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n    {\n     \
  \   height = h;\n    }\n  protected:\n    int width;\n    int height;\n};\n\n//\
  \ Derived class\nclass Rectangle: public Shape\n{\n  public:\n    int getArea()\n\
  \    {\n        return (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle\
  \ Rect;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n  // Print the area of the object.\n\
  \  cout << \"Total area: \" << Rect.getArea() << endl;\n  return 0;\n}\n```\n\n\
  当编译并执行上述代码时，将产生如下输出。\n\nTotal area: 35\n\n## 访问控制与继承\n\n当一个类派生自基类时，可以访问其派生自基类的非私有成员。如果基类的类成员被声明为\
  \ `private`，则其派生类无法访问它们。因此，在你不希望派生类访问基类的类成员或函数的情况下，可以将它们声明为 `private`。\n\n下表根据谁可以访问这些成员，总结了不同的访问类型。\n\
  \n| 访问 | public | protected | private |\n| :--- | :--- | :--- | :--- |\n| 同一类 |\
  \ yes | yes | yes |\n| 派生类 | yes | yes | no |\n| 外部类 | yes | no | no |\n\n尽管派生类继承基类的所有类方法，但也有例外。\n\
  \n- 构造函数、拷贝构造函数和析构函数不能被派生类继承。\n- 给定基类的重载运算符不能被派生类继承。\n- 派生类不能继承其基类的友函数。\n\n## 继承的类型\n\
  \n当使用基类来派生一个类时，基类可以通过 `public inheritance`、`protected inheritance` 或 `private inheritance`\
  \ 继承。访问修饰符用于指定继承的类型。如果不使用访问修饰符，继承将默认为 `private inheritance`。\n\n在编程中，私有继承或保护继承很少使用。相反，公有继承是最常用的继承类型。在使用不同类型的继承时将应用以下规则。\n\
  \n- **公有继承**：当一个类派生自一个基类时，基类的 `public` 成员也将成为派生类的 `public` 成员。基类的 `protected` 成员也是如此。但在基类的\
  \ `private` 成员情况下，它们不能被继承，因为派生类无法直接访问它们。`private` 成员可以通过调用给定基类的 `protected` 和 `public`\
  \ 成员来访问。\n- **保护继承**：当一个类派生自具有 `protected` 成员的基类时，该类所有的 `public` 和 `protected` 成员将成为其派生类的\
  \ `protected` 成员。\n- **私有继承**：当一个类派生自具有 `private` 成员的基类时，其派生类的所有类成员都将是 `private`。\n\
  \n## 多重继承\n\n在 C++ 中，允许类从多个基类继承成员。多重继承的语法如下所示。\n\n语法：\n`class derived-class: access\
  \ baseA, access baseB....`\n\n在这里，`access` 可以是 `public`、`private` 或 `protected`\
  \ 中的任意一个，并且可以为用逗号分隔的每个基类进行声明。这里有一个示例。\n\n示例：\n\n```cpp\n#include <iostream>\n\n\
  using namespace std;\n\n// Base class Shape\nclass Shape\n{\n  public:\n    void\
  \ setWidth(int w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n\
  \    {\n        height = h;\n    }\n  protected:\n    int width;\n    int height;\n\
  };\n\n// Base class PaintCost\nclass PaintCost\n{\n  public:\n    void getCost(int\
  \ a)\n    {\n        return 0;\n    }\n};\n\n// Derived class\nclass Rectangle:\
  \ public Shape, PaintCost\n{\n  public:\n    int getArea()\n    {\n        return\
  \ (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle Rect;\n  Rect.setWidth(5);\n\
  \  Rect.setHeight(7);\n  cout << \"Total area: \" << Rect.getArea() << endl;\n \
  \ cout << \"Paint cost: \" << Rect.getCost(5) << endl;\n  return 0;\n}\n```\n\n\
  当编译并执行上述代码时，将产生如下输出。\n\nTotal area: 35\nPaint cost: 0\n\n# 第 14 章：异常处理\n\n## 异常\n\
  \n面向对象编程中的异常可以定义为流的干扰... C++++ be defined as as the the that.... is is is.... the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the. 异常可以定义为对发生情况的响应。C++ 中的异常可以定义为对 the the\
  \ of the. of the exception is the the the is the the the is the the the the the\
  \ the the the the is the is the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the the the the the the the the the the the the the the\
  \ is the is that is that is that is. 当异常被抛出时，控制将从程序的一个部分转移到另一个部分。C++ 中的异常处理基于这些关键字。我们将详细讨论它们。\n\
  \n- `throw`：每当出现问题时，程序将抛出一个异常。可以使用 `throw` 关键字来实现。\n- `catch`：异常抛出后会被程序的某部分捕获。异常的由\
  \ `catch` 关键字指示。\n- `try`：`try` 块的作用是识别可能发生异常的代码块。一个或多个 `catch` 块将跟随在 `try` 块之后。\n\
  \n方法将通过 `try` 和 `catch` 关键字来处理异常。可能引发异常的代码块将放在 `try` 块内部。`try/catch` 块的语法如下。\n\n\
  语法：\n```cpp\ntry\n{\n  // protected code\n}catch( ExceptionName e1 )\n{\n  // catch\
  \ block\n}catch( ExceptionName e2 )\n{\n  // catch block\n}catch( ExceptionName\
  \ eN )\n{\n  // catch block\n}\n```\n\n在预期多个异常的情况下，可以添加多个 `catch` 语句来捕获不同类型的异常。\n\
  \n## 抛出异常\n\n使用 `throw` 语句可以在代码块的任何地方抛出异常。异常的类型由操作数决定。可以是任何表达式，该表达式的结果将决定被抛出的表达式。\n\
  \n这里有一个当整数除以 0 时抛出异常的示例。\n\n示例：\n\n```cpp\ndouble division(int a, int b)\n{\n  if(\
  \ b == 0 )\n  {\n    throw \"Division by zero condition!\";\n  }\n  return (a/b);\n\
  }\n```\n\n## 捕获异常\n\n任何抛出的异常都将被 `try` 块之后的 `catch` 块捕获。你想捕获的异常类型可以通过确定 `catch` 关键字括号内的异常声明来指定。\n\
  \n这里有一个示例。\n\n```cpp\ntry\n{\n  // protected code\n}catch( ExceptionName e )\n{\n\
  \  // 处理 ExceptionName 异常的代码\n}\n```\n\n上述代码将捕获 `ExceptionName` 类型的异常。通过在包含异常声明的括号内省略号\
  \ `…`，你可以指定 `catch` 块想要处理的异常类型。如下所示代码所示。\n\n```cpp\ntry\n{\n```\n\n\n\n\n\n```cpp\n\
  // 受保护代码\n\n}catch(...)\n\n{\n  // 处理任何异常的代码\n}\n```\n\n下面的示例将抛出一个由于除以零引起的异常。该抛出的异常将在\
  \ `catch` 块中捕获。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\ndouble\
  \ division(int a, int b)\n{\n  if( b == 0 )\n  {\n      throw \"Division by zero\
  \ condition!\";\n  }\n  return (a/b);\n}\n\nint main ()\n{\n  int x = 50;\n  int\
  \ y = 0;\n  double z = 0;\n  try {\n    z = division(x, y);\n    cout << z << endl;\n\
  \  }catch (const char* msg) {\n    cerr << msg << endl;\n  }\n  return 0;\n}\n```\n\
  \n在这里，抛出的异常类型为 `const char*`，为了捕获此异常，应该在 `catch` 块中使用 `const char*`。如果上述代码被编译并运行，将产生以下输出。\n\
  \nDivision by zero condition!\n\n## try/catch 块中的控制流\n\n这是一个简单的示例程序，展示了 C++ 的异常处理。这有助于你更好地理解\
  \ `try/catch` 块的执行流。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nint main()\n{\n  int x = -1;\n  // 一些代码\n  cout << \"Before try block \\n\";\n\
  \  try {\n      cout << \"Inside try block \\n\";\n      if (x < 0)\n      {\n \
  \         throw x;\n          cout << \"After throw (从不会执行) \\n\";\n      }\n  }\n\
  \  catch (int x ) {\n      cout << \"Exception is caught here \\n\";\n  }\n  cout\
  \ << \"After catch block (Will be executed) \\n\";\n  return 0;\n}\n```\n\n当执行上述代码时，将产生以下输出。\n\
  \nBefore try block\nInside try block\nException caught here\nAfter catch block (Will\
  \ be executed)\n\n## C++ 标准异常\n\n在 C++ 中，所有标准异常的列表定义在 `<exception>` 中并可以在程序中使用。这些异常如下所示按父子层次列出。\n\
  \n上述异常的描述见下表。\n\n| 异常 | 描述 |\n| :--- | :--- |\n| `std::exception` | 此异常是 C++ 中所有异常的父类。\
  \ |\n| `std::bad_alloc` | 当 `new` 操作符未能分配请求的空间时，抛出此异常。 |\n| `std::bad_cast` | 当对给定引用类型的\
  \ `dynamic_cast` 失败时，会引发此异常。 |\n| `std::bad_exception` | 当发生意外异常时，抛出此异常。 |\n| `std::bad_typeid`\
  \ | 此异常可以由 `typeid` 抛出。 |\n| `std::logic_error` | 当理论上可以通过读取代码检测到异常时显示。 | |\n| `std::domain_error`\
  \ | 在使用数学上无效的域时，会抛出此异常。 |\n| `std::invalid_argument` | 当使用无效参数时，抛出此异常。 |\n| `std::length_error`\
  \ | 当创建过大的 `std::string` 时，会抛出此异常。 |\n| `std::out_of_range` | 此异常可以由 `std::vector`\
  \ 的 `at` 方法以及 `std::bitset<>::operator[]()` 抛出。 |\n| `std::runtime_error` | 当理论上无法通过读取代码检测到异常时显示。\
  \ | |\n| `std::overflow_error` | 当发生数学溢出时，会抛出此异常。 |\n| `std::range_error` | 当尝试存储的值超出范围时，会引发此异常。\
  \ |\n| `std::underflow_error` | 当发生数学下溢时，会抛出此异常。 |\n\n## 定义新异常\n\n在 C++ 中，你允许定义自己的异常。这可以通过继承并重写\
  \ `exception` 类的功能来实现。在下面给出的示例中，你可以看到如何使用 `std::exception` 类来实现你自己的异常。\n\n示例：\n\n\
  ```cpp\n#include <iostream>\n#include <exception>\n\nusing namespace std;\n\nstruct\
  \ MyException : public exception\n{\n  const char * what () const throw ()\n  {\n\
  \    return \"C++ Exception\";\n  }\n};\n\nint main()\n{\n  try\n  {\n    throw\
  \ MyException();\n  }\n  catch(MyException& e)\n  {\n    std::cout << \"MyException\
  \ caught\" << std::endl;\n    std::cout << e.what() << std::endl;\n  }\n}\n```\n\
  \n抛出的异常类型为 `const char*`，为了捕获此异常，应该在 `catch` 块中使用 `const char*`。如果上述代码被编译并运行，将产生以下输出。\n\
  \nMyException caught\nC++ Exception\n\n`what()` 是 `exception` 类提供的公共方法。\n\n## 定义新异常\n\
  \n（注：此处原文内容重复，已在上方段落翻译完整）\n\n在 C++ 中，你允许定义自己的异常。这可以通过继承并重写 `exception` 类的功能来实现。在下面给出的示例中，你可以看到如何使用\
  \ `std::exception` 类来实现你自己的异常。\n\n```cpp\n#include <iostream>\n#include <exception>\n\
  \nusing namespace std;\n\nstruct MyException : public exception\n{\n  const char\
  \ * what () const throw ()\n  {\n    return \"C++ Exception\";\n  }\n};\n\nint main()\n\
  {\n  try\n  {\n    throw MyException();\n  }\n  catch(MyException& e)\n  {\n   \
  \ std::cout << \"MyException caught\" << std::endl;\n    std::cout << e.what() <<\
  \ std::endl;\n  }\n}\n```\n\n`what()` 是 `exception` 类提供的公共方法。\n\n## 预处理器\n\n在 C++\
  \ 中，预处理器在实际编译之前指示编译器。\n\n预处理器以 `#` 开头。\n\n预处理器有很多指令：`#include`, `#define`, `#ifdef`,\
  \ `#ifndef`, `#else`, `#elif`, `#endif`, `#error`, `#pragma`。\n\n## #define 预处理器\n\
  \n`#define` 指令用于定义宏和常量。\n\n语法如下：\n\n```cpp\n#define PI 3.14159\n```\n\n在 C++ 中，`#define`\
  \ 指令用于定义宏和常量。\n\n这是一个示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
  #define PI 3.14159\n\nint main()\n{\n  cout << \"Value of PI: \" << PI << endl;\n\
  \  return 0;\n}\n```\n\n## 函数宏\n\n你可以通过使用 `#define` 预处理器定义带参数的宏。\n\n语法如下：\n\n```cpp\n\
  #define SQUARE(a,b) ((a)*(b))\n```\n\n这是一个示例：\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\n\n#define SQUARE(a,b) ((a)*(b))\n\nint main()\n{\n  int x = 5,\
  \ y = 10;\n  cout << \"Result: \" << SQUARE(x,y) << endl;\n  return 0;\n}\n```\n\
  \n## 条件编译\n\n你实际上可以编译代码的部分而不是编译整个程序。在 C++ 中，有许多指令允许你编译源代码的部分。这种编译源代码选择部分的过程被称为条件编译。\n\
  \n条件处理器的结构与选择结构相似。考虑以下示例。\n\n```cpp\n#ifndef NULL\n  #define NULL 0\n#endif\n```\n\
  \n程序可以为了调试而编译，可以通过单个宏开启或关闭调试。语法如下：\n\n```cpp\n#ifdef DEBUG\n  cerr << \"Variable\
  \ x = \" << x << endl;\n#endif\n```\n\n从上述代码可以看出，如果 `DEBUG` 符号常量在 `#ifdef` 指令之前定义，则\
  \ `cerr` 语句将被编译。\n\n你可以通过 `#if 0` 语句注释掉程序的某个。所示：\n\n```cpp\n#if 0\n  /* 这是被注释的部分\
  \ */\n  cout << MKSTR(HELLO C++) << endl;\n#endif\n```\n\n\n\n\n\n```cpp\ncout <<\"\
  The minimum is \" << MIN(i, j) << endl;\n\n#ifdef DEBUG\n  cerr <<\"Trace: Coming\
  \ out of main function\" << endl;\n#endif\n\n  return 0;\n}\n```\n\n当上述代码被编译并运行后，它将产生如下输出。\n\
  \nTrace: Inside main function\n\nThe minimum is 30\n\nTrace: Coming out of main\
  \ function\n\n## # 和 ## 运算符\n\nC++ 中的 `#` 和 `##` 是预处理器运算符。你可以使用 `#` 运算符将用于替换的文本转换为由引号括起来的字符串。\n\
  \n查看下面提供的宏定义。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n#define\
  \ MKSTR( x ) #x\n\nint main ()\n\n{\n   cout << MKSTR(HELLO C++) << endl;\n   return\
  \ 0;\n}\n```\n\n如果上述代码被编译并运行，它将产生如下输出。\n\nHELLO C++`\n\n## 预定义 C++ 宏\n\nC++ 为其用户提供了大量的预定义宏。下面描述了这些宏。\n\
  \nC++ 提供了下面提到的若干预定义宏：\n\n| 宏 |or |\n| :--- | :--- |\n| `__LINE__` | 该宏包含编译器当前所在行的行号。\
  \ |\n| `__FILE__` | 该宏包含正在编译的文件名。 |\n| `__DATE__` | 该宏包含源文件编译为目标代码的日期，格式为“月/日/年”的字符串。\
  \ |\n| `__TIME__` | 该宏包含程序编译的时间。该时间存储在“时:分:秒”格式的字符串中。 |\n\n现在，我们将查看使用上述宏的示例。\n\n\
  示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n\n{\n\
  \   cout << \"Value of __LINE__ : \" << __LINE__ << endl;\n   cout << \"Value of\
  \ __FILE__ : \" << __FILE__ << endl;\n   cout << \"Value of __DATE__ : \" << __DATE__\
  \ << endl;\n   cout << \"Value of __TIME__ : \" << __TIME__ << endl;\n   return\
  \ 0;\n}\n```\n\n当上述代码被编译并运行后，它将产生如下输出。\n\nValue of `__LINE__` : 6\n\nValue of `__FILE__`\
  \ : test.cpp\n\nValue of `__DATE__` : Feb 28 2011\n\nValue of `__TIME__` : 18:52:48\n\
  \n# 第 16 章：多线程\n\n多线程可以被视为一种特殊的多任务形式，而多任务可以定义为允许你的系统并发运行多个程序的特性。通常有两种多任务类型：基于进程的和基于线程的。\n\
  \n在基于进程的多任务中，不同程序的执行将并发进行。基于线程的多任务则将处理该程序内部各个组成部分的并发执行。\n\n在多线程程序中，两个或多个部分将并发运行。这些每个部分都被称为线程，每个线程都定义了一个与其他部分独立的执行部分。\n\
  \nC++ 中没有内置的多线程应用程序。多线程完全完全依赖于操作系统。\n\n## 创建线程\n\n要创建一个 POSIX 线程，我们将使用以下例程。\n\n\
  ```cpp\n#include <pthread.h>\n\npthread_create (thread, attr, start_routine, arg)\n\
  ```\n\n在这里，`pthread_create` 将创建一个新的可执行线程。调用此例程没有限制，可以在你的代码中多次调用，并在任何地方调用。参数的描述如下。\n\
  \n| 参数 |  |\n| :--- | :--- |\n| `thread` | 它是子程序返回的用于线程的打开句柄和唯一标识符。 |\n| `attr`\
  \ | 一个不透明的属性对象，用于设置线程属性。你可以指定一个线程属性对象，或使用 NULL 使用默认值。 |\n| `start_routine` | 这是一个\
  \ C++ 线程参数，新线程创建后将执行该参数。 |\n| `arg` | 可以传递给 `start_routine` 的单个参数。它必须以 `void` 类型指针转换的形式引用传递。如果没有传递任何参数，可以使用\
  \ NULL。 |\n\n一个进程可以创建的最大线程数取决于其实现。线程可以创建另一个线程，在创建之后，线程之间像对等节点一样工作。线程之间找不到隐含的层级关系或依赖关系。\n\
  \n进程可能创建的最大线程数取决于实现。一旦创建，线程就是平等的，并可以创建其他线程。线程之间不存在隐含的层级关系或依赖。\n\n## 终止线程\n\n你可以使用以下例程来终止\
  \ POSIX 线程。\n\n```cpp\n#include <pthread.h>\n\npthread_exit (status)\n```\n\n为了显式退出线程，这里使用了\
  \ `pthread_exit`。`pthread_exit()` 例程在线程完成工作且不再需要时通常会被调用。\n\n如果 `main()` 函数通过 `pthread_exit()`\
  \ 结束，那么在它创建的线程结束之前，其他线程不会终止并将继续执行。在其他情况下，它们将在 `main()` 函数结束时自动终止。这里有一个示例。\n\n示例：\n\
  \n在这个示例中，将通过 `pthread_create()` 例程创建五个线程。这五个线程中的每一个都将打印消息“Hello World!”并通过调用 `pthread_exit()`\
  \ 终止。\n\n```cpp\n#include <iostream>\n\n#include <cstdlib>\n\n#include <pthread.h>\n\
  \nusing namespace std;\n\n#define NUM_THREADS 5\n\nvoid *PrintHello(void *id)\n\
  {\n   long tid;\n   tid = (long)id;\n   cout << \"Hello World! Thread ID, \" <<\
  \ tid << endl;\n   pthread_exit(NULL);\n}\n\nint main ()\n\n{\n   pthread_t threads[NUM_THREADS];\n\
  \   int rc;\n   int i;\n   for( i=0; i < NUM_THREADS; i++ ){\n     cout << \"main()\
  \ : creating thread, \" << i << endl;\n     rc = pthread_create(&threads[i], NULL,\
  \ PrintHello, (void *)i);\n     if (rc){\n      cout << \"Error:unable to create\
  \ thread,\" << rc << endl;\n      exit(-1);\n     }\n   }\n   pthread_exit(NULL);\n\
  }\n```\n\n使用 `-lpthread` 库编译程序：\n`gcc test.cpp -lpthread`\n\n现在，如果你执行上述操作，它将生成如下输出。\n\
  \nmain() : creating thread, 0\nmain() : creating thread, 1\nmain() : creating thread,\
  \ 2\nmain() : creating thread, 3\nmain() : creating thread, 4\nHello World! Thread\
  \ ID, 0\nHello World! Thread ID, 1\nHello World! Thread ID, 2\nHello World! Thread\
  \ ID, 3\nHello World! Thread ID, 4\n\n## 向线程传递参数\n\n此示例将展示如何通过结构体传递参数。由于线程指向 `void`，任何数据类型都可以传递。这将在下面的示例中解释。\n\
  \n示例：\n\n```cpp\n#include <iostream>\n\n#include <cstdlib>\n#include <pthread.h>\n\
  \nusing namespace std;\n\n#define NUM_THREADS 5\n\nstruct thread_data {\n    int\
  \ thread_id;\n    char *message;\n};\n\nvoid *PrintHello(void *arg)\n{\n   struct\
  \ thread_data *my_data;\n   my_data = (struct thread_data *)arg;\n   cout << \"\
  Thread ID : \" << my_data->thread_id;\n   cout << \" Message : \" << my_data->message\
  \ << endl;\n}pthread_exit(NULL);\n\nint main ()\n\n{\n   pthread_t threads[NUM_THREADS];\n\
  \   struct thread_data td[NUM_THREADS];\n   int rc;\n   int i;\n   for( i=0; i <\
  \ NUM_THREADS; i++ ){\n     cout << \"main() : creating thread, \" << i << endl;\n\
  \     td[i].thread_id = i;\n     td[i].message = \"This is message\";\n     rc =\
  \ pthread_create(&threads[i], NULL, PrintHello, (void *)&td[i]);\n     if (rc){\n\
  \      cout << \"Error:unable to create thread,\" << rc << endl;\n      exit(-1);\n\
  \     }\n   }\n   pthread_exit(NULL);\n}\n```\n*(注：由于原文代码块存在一些排版错误，如 `pthread_exit`\
  \ 位置异常，翻译时已根据逻辑进行了对齐)*\n\n当你编译并执行上述代码时，它将产生如下输出。\n\nmain() : creating thread, 0\n\
  main() : creating thread, 1\nmain() : creating thread, 2\nmain() : creating thread,\
  \ 3\nmain() : creating thread, 4\nThread ID : 3 Message : This is message\nThread\
  \ ID : 2 Message : This is message\nThread ID : 0 Message : This is message\nThread\
  \ ID : 1 Message : This is message\nThread ID : 4 Message : This is message\n\n\
  ## 合并与分离线程\n\nC++ 为其用户提供了两个例程，用于合并或分离线程。它们如下：\n\n`pthread_join (threadid, status)`\n\
  \n`pthread_detach (threadid)`\n\n\n\n\n\n`pthread_join()` 子程序将阻塞调用线程，直到指定线程的线程终止为止。当创建一个新线程时，该线程的一个属性将定义该线程是可汇的（joinable）还是可分离的（detached）。你只能加入那些被创建为可汇的线程，而可分离线程在任何情况下都无法加入。\n\
  \n在这个示例中，展示了如何使用 Pthread join 例程来等待线程完成。\n\n示例：\n\n```cpp\n#include <iostream>\n\
  #include <cstdlib>\n#include <pthread.h>\n#include <unistd.h>\n\nusing namespace\
  \ std;\n\n#define NUM_THREADS     5\n\nvoid *wait(void *t)\n{\n  int i;\n  long\
  \ tid;\n  tid = (long)t;\n  sleep(1);\n  cout << \"Sleeping in thread \" << endl;\n\
  \  cout << \"Thread with id : \" << tid << \"  ...exiting \" << endl;\n  pthread_exit(NULL);\n\
  }\n\nint main ()\n{\n  int rc;\n  int i;\n  pthread_t threads[NUM_THREADS];\n  pthread_attr_t\
  \ attr;\n  void *status;\n  // Initialize and set thread joinable\n  pthread_attr_init(&attr);\n\
  \  pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_JOINABLE);\n  for( i=0; i <\
  \ NUM_THREADS; i++ ){\n      cout << \"main() : creating thread, \" << i << endl;\n\
  \      rc = pthread_create(&threads[i], NULL, wait, (void *)i );\n      if (rc){\n\
  \        cout << \"Error:unable to create thread,\" << rc << endl;\n        exit(-1);\n\
  \      }\n  }\n  // free attribute and wait for the other threads\n  pthread_attr_destroy(&attr);\n\
  \  for( i=0; i < NUM_THREADS; i++ ){\n      rc = pthread_join(threads[i], &status);\n\
  \      if (rc){\n        cout << \"Error:unable to join,\" << rc << endl;\n    \
  \    exit(-1);\n      }\n      cout << \"Main: completed thread id :\" << i;\n \
  \     cout << \"  exiting with status :\" << status << endl;\n  }\n  cout << \"\
  Main: program exiting.\" << endl;\n  pthread_exit(NULL);\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \n```\nmain() : creating thread, 0\nmain() : creating thread, 1\nmain() : creating\
  \ thread, 2\nmain() : creating thread, 3\nmain() : creating thread, 4\nSleeping\
  \ in thread\nThread with id : 0 .... exiting\nSleeping in thread\nThread with id\
  \ : 1 .... exiting\nSleeping in thread\nThread with id : 2 .... exiting\nSleeping\
  \ in thread\nThread with id : 3 .... exiting\nSleeping in thread\nThread with id\
  \ : 4 .... exiting\nMain: completed thread id :0  exiting with status :0\nMain:\
  \ completed thread id :1  exiting with status :0\nMain: completed thread id :2 \
  \ exiting with status :0\nMain: completed thread id :3  exiting with status :0\n\
  Main: completed thread id :4  exiting with status :0\nMain: program exiting.\n```\n\
