    - path parameters: parsing routes to extract values\n- HTTP methods: using GET,\
    \ POST, DELETE, PUT and so on\n- route handlers: grouping related handler functions\
    \ into one file\n\n# Routing Path Expressions\n\nSimple URL routes are defined\
    \ in the examples above. For example:\n\n```\n// another route\napp.get('/hello/',\
    \ (req, res) => {\n  res.send('Hello again!');\n});\n```\n\nThe route handles\
    \ HTTP GET requests to /hello/, although Express will do the following:\n\n+ \
    \  - Ignoring case. The paths /Hello/ and /HELLO/ will match the /hello/ route\
    \ unless you add app.set('case sensitive routing', true) to index.js.\n- Ignoring\
    \ slashes. The paths /hello/ and /hello match the same route unless you add app.set('strict\
    \ routing', true) to index.js.\n\nAs well as exact routes, you can define regular\
    \ expression patterns to match a range of URLs. For example:\n\n+   - ? denotes\
    \ that the preceding character is optional. A route of /ab?cd/ matches the URL\
    \ paths /abcd/ and /acd/.\n + denotes that the preceding character must appear\
    \ one or more times. A route of /ab+cd/ matches the URL paths /abcd/, /abbcd/,\
