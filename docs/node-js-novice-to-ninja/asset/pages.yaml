  md: "# Express Middleware Functions\n\nThe app.use() method used above to define\
    \ the static directory introduces the concept of Express middleware. Middleware\
    \ functions run in the sequence defined in the code, and can typically:\n\n+ \
    \  - run code on every request\n- manipulate or change the request and response\
    \ objects\n- terminate a response—perhaps if the user isn't logged in\n- call\
    \ the next middleware function\n\nIn this case, express.static('static') returns\
    \ a middleware function that handles static directory processing.\n\nAll middleware\
    \ functions receive three arguments:\n\n+   - req : the Express HTTP Request object\n\
    - res : the Express HTTP Response object\n- next : a callback that passes control\
    \ to the next middleware function. Middleware functions must always call next()\
    \ unless they complete or terminate the current request.\n\nThe following middleware\
    \ function logs every URL request to the terminal:\n\n```\n// log every request\
    \ to the terminal\napp.use((req, res, next) => {\n  console.log(req.url);\n  next();\n\
    });\n```\n\nYou should place this function before any others that could end processing.\
    \ No logging would occur if you placed it after URL routing or static asset middleware\
    \ that succeeded in returning a response."
