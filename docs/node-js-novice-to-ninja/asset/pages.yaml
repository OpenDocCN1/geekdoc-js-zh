    - ES6 modules

    - the Express framework

    - URL routing

    - HTML template engines


    #  Why use Express?


    You created a small web application in Chapter 3. It''s fast, and works well,
    but a complex web application requires features such as URL routing, query string
    parsing, posted data decoding, HTML templates, image serving, and more. You could
    write this yourself, but much of effort is already implemented in Express.


    Express is a Node.js web framework that promotes itself as "fast, unopinionated,
    and minimalist". It allows you to concentrate on your application''s business
    logic without having to worry too much about web server technologies such as URL
    routing, parsing data, setting HTTP headers, and so on.


    Various web frameworks are available in the Node.js ecosystem, including Fastify,
    Koa, Hapi. These may be more recent, more regularly maintained, faster, and a
    better fit for your application. However, Express was one of the first frameworks
    and influenced all that followed. It''s stable, easy to use, and remains popular,
    with 18 million downloads per week. You more likely to encounter Express than
    another framework.


    > Express Version

    At the time of writing, Express 4 is the active recommended release and Express
    5 is in alpha. All the examples should work in either, but switch to version 4
    if you have problems.'
