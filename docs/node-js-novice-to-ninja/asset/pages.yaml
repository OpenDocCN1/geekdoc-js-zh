    14-2. The database schema


    The database guarantees data integrity using constraints defined in the schema.
    For example:


    +   - it''s impossible to add two questions with the same `text`

    - changing the `id` of a question automatically updates the `question_id` of associated
    `answer` records

    - deleting a game record automatically deletes `player` and `pubsub` records associated
    with that game


    PostgreSQL was chosen for the project because it offers a publisher-subscriber
    (or pub-sub) service. It''s possible to trigger events when an application changes
    database data (publishes), which can notify all subscribers. This means we don''t
    require a dedicated pub-sub solution as another dependency.'
