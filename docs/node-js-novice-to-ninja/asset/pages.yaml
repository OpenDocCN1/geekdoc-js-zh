    \ integer\n\n+   - game_id: the (non-encoded) game ID (a foreign key for the game_id)\n\
    \n+   - type: the message payload in fast JSONB binary format\n\n+   - queued:\
    \ the current timestamp\n\nWhen one single WebSocket server wants to share an\
    \ event, it inserts a new record into the pubsub table using a broadcast() function\
    \ in Libshared/quizdb.js:\n\n```\n// broadcast an event\nexport async function\
    \ broadcast(game_id, type, data) {\n\n  return await dbInsert({\n    table: 'pubsub',\n\
    \    values: { game_id, type, data },\n    return: 'id'\n  });\n}\n```\n\nA database\
    \ trigger pubsub_insert_trigger calls a sub_insert_notify() function whenever\
    \ a record is inserted into the pubsub table. This executes PostgreSQL pg_notify()\
    \ command, which sends the record to all subscribers:\n\n```\nCREATE OR REPLACE\
    \ FUNCTION pubsub_insert_notify()\nRETURNS trigger AS\n$BODY$\nnBEGIN\n\n  PERFORM\
    \ pg_notify('pubsub_insert', row_to_json(NEW)::text);\n  RETURN NULL;\nEND;\n\
    $BODY$\nLANGUAGE plplpgsql VOLATILE\nCOST 100;\n```"
