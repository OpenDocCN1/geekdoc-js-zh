  md: '# Using WebSockets


    This chapter demonstrates how to use WebSockets—a technology that makes it possible
    to open a two-way, interactive communication channel between a browser and a server.
    In the past, this was difficult to achieve on most platforms, and often required
    a third-party service. Node.js makes it easy, although we''ll delve into deeper
    challenges.


    # Skip Ahead?


    It''s possible to become a respected senior developer without touching WebSockets!
    You can skip this chapter, but the technology opens a world of opportunities you
    may not have considered before.


    # What Are WebSockets?


    The web is a request-response communication platform. Your browser requests a
    web page and receives HTML as the response from a web server. The page may reference
    assets such as images, fonts, CSS, and JavaScript; the browser makes an additional
    request for each.


    ![](img/df734780c88ebde9dc5bf93f50faf4c6_239_0.png)


    The browser initiates every request. A web server can''t arbitrarily push data
    to a user. It must be requested first.


