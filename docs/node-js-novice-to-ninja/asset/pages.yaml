  md: '# Semantic Versioning


    Always use a semantic version for your project with MAJOR.MINOR.PATCH numbers
    separated by a period (. ).


    When a change occurs, you should increment the appropriate number and zero those
    you follow. Assuming a current version of 1.2.33 :


    +   - a new bug fix would update the PATCH number to version 1.2.34

    - new functionality that didnt break backward compatibility would update the MINOR
    number to version 1.3.0

    - a major update with incompatible API changes would update the MAJOR number to
    version 2.0.0


    Not all developers follow this convention, so read the documentation carefully!


    # Project Dependencies


    A package such as Express is (usually) required at runtime. It''s a dependency
    for your application; the app would fail to run without it.


    Project dependencies are listed in the dependencies section of package.json .
    When your project is deployed to another machine (such as a production server),
    running npm install installs all dependencies.


    # Development Dependencies


    Packages such as the Browsersync reload server or the ESLint JavaScript validator
    are (usually) used during development. They aren''t required by your application
    when it runs, so they aren''t required on a production server.


    Development dependencies are listed in the devDependencies section of package.json
    . They aren''t installed if you run npm install when the NODE_ENV environment
    variable is set to production . This can be set on Linux'
