  md: '# Asynchronous Programming in Node.js


    Both JavaScript and Node.js are single-threaded; the runtime can only do one thing
    at a time. It would be like a restaurant with a single chef, except JavaScript
    offloads input and output operations to the operating system kernel (other "chefs"
    who operate in parallel). A Node.js app start a file write, database read, or
    HTTP request, but it won''t wait for that operation to finish. Instead, it asks
    for a callback function to be run when it''s complete and success or error data
    is available.


    ![](img/df734780c88ebde9dc5bf93f50faf4c6_183_0.png)


