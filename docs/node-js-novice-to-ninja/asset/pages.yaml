  md: '# Define Working Directories


    A hard-coded `static` directory is used above. That''s fine for Express, but if
    another module needed to locate the same directory to read or write a file?


    We can define a fully qualified reference to all working directories in the `cfg`
    configuration object. This used to be easy in CommonJS (see Chapter 8 for more
    on this topic) because Node provided a `__dirname` constant with the full directory
    of the current module. The situation is more complex in ES6 modules, because they''re
    referenced by `__URL—by file`. The URL of the current module is available in `import.meta.url`,
    so it can be parsed to a file path using the standard Node.js library:


    ```

    import { fileURLToPath } from ''url'';

    import { dirname, sep } from ''path'';


    const __dirname = dirname(fileURLToPath(import.meta.url)) + sep;

    ```


    The `path` module provides a `fileURLToPath()` function, which converts a `file://`
    URL to a fully qualified file path.


    The `path` module provides a `dirname()` function to extract a directory from
    a path and a `sep` constant with the platform-specific separator (/ on POSIX,
    \ on Windows).


    Update the top of `index.js` accordingly:


    ```

    // Express application

    import express from ''express'';


    import { fileURLToPath } from ''url'';

    import { dirname, sep } from ''path'';


    // configuration

    ```'
