    - INET_ATON() converts a dotted-quad IPv4 network address string to an integer.


    # Never Build SQL Strings!


    Never programmatically build SQL strings. This is the biggest cause of SQL injection
    attacks:


    ```

    b.execute(''SELECT * FROM user WHERE email=''${email}'' AND password=''${password}'');

    ```


    A user could enter the email address: boss@company.com''; --. This comments out
    the password check, so anyone can log in as the boss!


    A more dangerous example would wipe the user table:


    ```

    boss@company.com''; DROP TABLE user; --

    ```


    You should validate all incoming data, but a prepared statement makes SQL injection
    attacks far more difficult.


