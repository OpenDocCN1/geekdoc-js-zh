  md: '# 3. Three WebSocket Servers


    A WebSocket server uses the ws library to handle:


    +   - the initial connection from a player joining a game

    - starting the game for all connected players

    - sending questions and answers to all players

    - responding to player choices and keeping score

    - disconnecting users when they leave or the game completes


    The system starts three isolated instances of the WebSocket server. This offers
    improved performance and some redundancy. If a server fails, a game should continue
    for those connected to a different server.


    When a player connects, they remain connected to the same WebSocket server throughout
    the duration of their session. However, two players on the same quiz could connect
    to different WebSocket servers!


    Games are kept in sync using the pub–sub functionality in PostgreSQL:


    +   1. When an event occurs on one WebSocket server, such as the user answering
    a question, that server inserts a new record into the pubsub table.


    +   2. PostgreSQL activates a trigger, which sends an event containing the new
    data to all WebSocket servers (the subscribers) running the same instance of a
    specific game.


    +   3. Each WebSocket server (including the one that originally received the request)
    runs a handler that acts on the incoming event data.


    The code is defined in the ws directory. The .env configuration file and Libshared
    directory also provide code shared across all components.'
