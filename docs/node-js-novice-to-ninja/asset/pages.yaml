  md: "# MongoDB\n\nMongoDB is a popular NoSQL database that became associated with\
    \ Node.js in the same way MySQL is often paired with PHP. MongoDB groups JSON-like\
    \ documents into one or more collections (analogous to tables) and implements\
    \ querying with JavaScript-like objects.\n\nNoSQL has a catch-all term for any\
    \ database that doesn't follow SQL conventions (see the \"MySQL\" section below).\
    \ In general, NoSQL databases implement fewer rules. Repeated (denormalized) data\
    \ is encouraged, and there's no need to define data structures, defaults, constraints,\
    \ or relationships.\n\nNoSQL software and storage mechanisms vary. Some offer\
    \ basic key-value pairs. Some use JSON documents. Others are use-case specific,\
    \ such as Redis in-memory caching, and Elasticsearch for search-engine indexing.\n\
    \nA NoSQL database can be practical when data is more organic and relationships\
    \ are looser. Consider an address book storing telephone numbers for individuals:\n\
    \n+   - You could allocate a single telephone field in an SQL database, but it's\
    \ too restrictive: contacts may have home, work, and mobile numbers. Allocating\
    \ three telephone fields would be wasteful for some contacts, but not enough for\
    \ others. A separate telephone table is the most flexible option, which increases\
    \ complexity.\n\nIn a NoSQL database, telephone numbers can be defined as an unlimited\
    \ array of objects associated with a contact. for example:\n\n```\n{\n  \"firstName\"\
    : \"Contact\",\n  \"LastName\": \"One\",\n  \"telephone\": [\n    { \"home\":\
    \ \"1-01234567890\" },\n  }\n```"
