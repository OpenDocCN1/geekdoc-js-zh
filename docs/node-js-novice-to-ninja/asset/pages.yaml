- img_proc: true
  md: 'Here''s the Publisher table:


    | id | name | country |

    | 1 | SitePoint | AU |


    You can reference those IDs in the book table:


    | id | title | author_id | publisher_id |

    | 1 | Introduction to Node.js | 2 | 1 |

    | 2 | Jump Start Web Performance | 2 | 1 |

    | 3 | DevTool Secrets | 2 | 1 |

    | 4 | Learn to Code with JavaScript | 3 | 1 |


    If a publisher changes their name or address, you can update the data in the publisher
    without affecting related book records.


    A brief overview of SQL:


    +   - Database table structures must be defined before data can be stored.

    - SQL offers simple declarative CRUD operations as INSERT, SELECT, UPDATE, and
    DELETE, but is powerful enough for complex operations.

    - Queries JOIN tables to examine related data in a single command.

    - Data integrity and relationships can be enforced. For example, it becomes impossible
    to delete an author if they have one or more books.

    - Most systems can wrap multiple updates into a single transaction. If one operation
    fails, the data rolls back to the state before the first update.

    - SQL is a fairly loose standard. Similar syntaxes are implemented across relational
    database management systems, but features and syntax can differ.

    - SQL was initially devised in the early 1970s, so software, documentation, and
    resources are plentiful.'
