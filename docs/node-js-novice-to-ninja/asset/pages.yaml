    # Web Application Considerations


    # Complexity Ahead


    > This section covers some advanced topics. Don''t worry if it doesn''t make sense
    now. We will revisit the implementation later.


    It''s astonishing that this lightweight script implements a functional web server.
    The app is permanently on, and can retain its own state regardless of the number
    of users. For example, it could establish a database connection once at start-up,
    then reuse that same connection on every request. Apache/PHP environments are
    generally stateless, so every page request must load configuration parameters
    and connect to a database before running a.


    However, Node.js applications run on a single processing thread:


    +   - If your app fails, it fails for everyone and won''t restart unless you have
    appropriate monitoring in place. Options including `PM2` and `forever` can help.

    - If a single user triggers a long-running JavaScript function that takes seconds
    to complete, every user accessing at that time will be waiting at least ten seconds
    for a response. Asynchronous code solves the problem, but it takes time to understand
    the concepts.'
