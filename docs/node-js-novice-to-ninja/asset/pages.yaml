  md: 'This chapter discusses the benefits and challenges of asynchronous programming
    in JavaScript. Asynchronous concepts are rarely evident in other languages, but
    it''s impossible to avoid them in Node.js.


    You may have written asynchronous event handling functions in client-side JavaScript.
    These should run quickly, and pages don''t remain open for long; a bug could cause
    problems for an individual user, but a browser restart or page reload would fix
    it. However, your Node.js app is the central point of access for all users and
    must remain active without a restart. A small asynchronous bug can generate memory
    leaks that eventually crash the application.


    This is one of the biggest causes of confusion when developers migrate from other
    languages, *please don''t skip this chapter!* Asynchronous programming can seem
    complex, but a few pointers will help you avoid pitfalls.


    # Single-threaded Non-blocking I/O Event-looping What?


    Imagine you''re running a pizza restaurant on your own. You take all the orders
    and prepare all the pizzas but can only manage one task at a time. You receive
    your first order, then prepare the dough (20 minutes), add the toppings (20 minutes),
    pop it in the oven, watch while it cooks (20 minutes), and serve to the customer.
    The process takes one hour; you''re then free to take another order.'
