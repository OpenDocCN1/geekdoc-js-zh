  md: '# What is Docker?


    Docker provides a way to quickly install, configure, and run applications such
    as databases. Each application launches in an isolated environment known as a
    container. It behaves a little like a Linux virtual machine, but it''s lightweight
    and requires no ongoing maintenance.


    Docker Compose can run any number of containerized applications from a single
    command. This makes it ideal for managing web application dependencies, and it
    behaves identically on all platforms—whether you''re using Windows, macOS, or
    Linux. A similar environment can also be deployed to a production server.


    The Docker for Web Developers book and a video course are available from SitePoint
    if you want to learn more.


