    Deno is a great option, but it''s new and fast, as popular, or well supported
    as Node.js. Perhaps we''ll all be using Deno in a decade''s time, and Node.js
    will be consigned to the history books. But it''s too early to tell. There''s
    no harm writing a few small utilities or example apps in Deno ... but should you
    adopt it for a long-term, mission-critical application when it''s difficult to
    find programmers with more than a couple of months'' experience?


    Deno is similar enough to Node.js that it''s easy to switch between the runtimes.
    Learn Node.js today, then consider Deno tomorrow.


