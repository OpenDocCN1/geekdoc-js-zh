  md: '# Summary


    In this chapter, you''ve learned Node.js is a popular JavaScript runtime that''s
    uniquely suited to web development. I''ve summarized it in this chapter''s video.
    Chapter 2 describes how to install Node.js on your platform of choice.


    # Quiz


    Many chapters in this course end with a quick quiz to ensure you''ve grasped the
    concepts. Beware! Some questions are designed to catch you out, make sure you''ve
    been paying attention! Answers can be found in Appendix, at the back of the book.


    +   1. What is Node.js?

    a. A JavaScript runtime.

    b. A tool for creating command-line, GUI, and web applications.

    c. A cross-platform programming framework.

    d. All of the above.


    +   2. What is JavaScript''s relationship to Java?

    a. JavaScript is a cut-down version of Java.

    b. JavaScript is a cross-platform version of Java.

