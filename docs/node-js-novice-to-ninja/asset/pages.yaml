  md: '# Static Site Hosting (Jamstack)


    If your application primarily uses client-side HTML, CSS, and JavaScript, it may
    not be necessary to deploy a Node.js application or use any server-side runtime.
    A static site generator (SSG) builds directory-based HTML files using content
    (typically in Markdown) and templates. There are numerous SSGs, but Eleventy is
    one of the more popular Node.js options.


    The resulting build files can be uploaded to any web server. The pages offer:


    +   - excellent performance: they''re just files with server-side processing

    - robust security: there''s no database or runtime to exploit

    - portability: you can host anywhere with no vendor lock-in

    - minimum-cost deployments: often for free


    This simpler approach to web development has become increasingly popular over
    the past few years. Facilities such as Amazon S3 hosting have been overtaken by
    platform-as-a-service (PaaS) hosts as GitHub Pages, CloudFlare Pages, Heroku,
    Vercel, and Netlify.


    Some servers offer a simple command-line deployment tool, while others require
    you to push a branch to a Git repository.


