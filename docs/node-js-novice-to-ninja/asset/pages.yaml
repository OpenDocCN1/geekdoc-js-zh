  md: "# Sanitize User Input\n\nThe rules of data processing club:\n\n+   - Never\
    \ trust user data.\n- See #1.\n\nUser data must be sanitized on the server. You\
    \ may have robust HTML and JavaScript validation, but there's no guarantee the\
    \ request came from a browser or worked as you expected. Always check data before\
    \ it's used elsewhere—*especially if it's output to an HTML page*. (Note that\
    \ the EJS escapes HTML.)\n\nIncoming data will be a string, so you can check for\
    \ formats using regular expressions or parse to types to check for errors. The\
    \ express-validator module provides a range of validation and sanitization functions.\n\
    \nFor brevity, the examples below don't check incoming data, so please don't use\
    \ them on a live server!\n\n# Processing HTTP GET Query Strings\n\nData can be\
    \ passed on the URL query string denoted by `?` and a series of `name=value` pairs\
    \ separated by `&` —such as `http://localhost:3000/?a=1&b=2&c=3`. Query strings\
    \ are usually added to HTTP GET requests, although they can be by any method.\n\
    \nExpress automatically parses query strings and returns a name/value object in\
    \ the `Request .query property`. The example URL above returns an object:\n\n\
    ```\n{\n  a: 1,\n  b: 2,\n```"
