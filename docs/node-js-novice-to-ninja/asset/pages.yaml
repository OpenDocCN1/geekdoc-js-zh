  md: '# Node.js: Novice to Ninja


    Of course, Node.js isn''t without its criticisms:


    +   1 Some programmers detest JavaScript.


    No language is perfect, but JavaScript was developed in ten days, and it''s unlikely
    Brendan Eich, its inventor, ever considered it might be used for full-scale enterprise
    applications. Some issues have been addressed with ES6 and types in JavaScript
    compilers like TypeScript.


    Personally, I love JavaScript—warts and all. Those who complain loudest usually
    comparing to their favorite language and have been bitten by JavaScript''s oddities,
    such as prototypical inheritance. If it''s not to your taste, ever persevere or
    consider one of the many server-side alternatives.


    +   npm is cumbersome.


    npm is partly responsible for the success of Node.js. It''s easy to install, update,
    and remove any of the 1.5 million packages. Understandably, not every package
    is good, and some have been downright dangerous-laced with malware and crypto-mining
    code. npm has addressed many issues, but others will occur.


    Your node_modules directory will grow to many megabytes, despite recent optimizations,
    npm can still download the same packages across different projects. Package maintenance
    can become increasingly laborious over the long term.


    Remember, npm is just a tool. Install only the packages you need and you''ll minimize
    the impact of third-party code.


    +   3 CommonJS vs ES6 module mess.


    Node.js is migrating toward ES6 modules, but the process has been painful and
    some legacy packages may never support it. The situation is improving, though,
    and I was pleasantly surprised by how few problems I encountered while writing
    this book.'
