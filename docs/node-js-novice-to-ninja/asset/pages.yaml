    # ### Node module: URL Imports


    Node.js 14 and above support node: imports for both ESM and CommonJS modules.
    Rather than using the API''s module name:


    ```

    import path from ''path'';",

    ```


    ... you can reference it using an absolute node: URL:


    ```

    import path from ''node:path'';",

    ```


    This might be practical if you had another module named path or want to distinguish
    built-in APIs in your code.


    # # Process


    The process object provides information about your Node.js application as well
    as control methods. process is available globally: you can use it without import,
    although the Node.js documentation recommends you explicitly reference it:


    ```

    import process from ''process'';",

    ```


    We''ve used process.argv in other scripts to fetch commmandline-line arguments:


    ```

    const firstArg = process.argv[2];

    ```


    process.argv returns an array where the first two items are the Node.js executable
    path and the script name. The item at index 2 is the first argument'
