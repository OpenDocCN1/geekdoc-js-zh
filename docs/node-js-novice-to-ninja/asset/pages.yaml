  md: '# #!/What?


    The first line in `hello.js` — `hashbang` — `#!/usr/bin/env node` —is known as
    a **shebang**. It''s entirely optional and ignored when you run `node hello.js`,
    because you''re passing the script to the Node.js runtime which executes the code.


    However, the shebang can be useful in Linux and macOS because it specifies which
    runtime to use—in this case, `node`. You can run the script using `./hello.js`
    alone but, before you can do that, you must permit direct execution by entering
    the following OS command in your terminal:


    ```

    chmod +x ./hello.js

    ```


    Then on you you can run the script from the command line this:


    ```

    ./hello.js

    ```


    The OS analyses the shebang and runs the code using Node.js. It''s not necessary
    to enter the full `node hello.js` command, although that will continue to work.


    This is beyond the scope of Node.js and we won''t use it again, because npm provides
    some cross-platform options. It''s there you should need it.


    To make the script more useful, you could pass a name on the command line. The
    `process.argv` property in the standard library returns an array containing the
    command-line arguments:


    +   - the first (element 0) is the `node` command itself

    - the second (element 1) is the script you''re running (`hello.js`)

    - the third (element 2) is the first argument passed'
