    # Pages vs Applications


    Many readers of this book will be familiar with PHP—the world''s most-used web
    programming language. WordPress alone runs almost half of all websites.

    A PHP application consists of .php files that are interpreted by the PHP runtime
    when they''re accessed via a server as Apache. HTML or data is then returned to
    the user''s browser.


    ![](img/df734780c88ebde9dc5bf93f50faf4c6_368_0.png)


    18-1. PHP rendering


    The following points are important to note:


    +   - Each page load is stateless. It knows nothing about the application''s state,
    so if a user is logged in, their state must be retrieved from a token or database
    record during every page request.


    Changing a .php file instantly updates the application, because the code is executed
    when a user requests that resource.


    +   - A .php file that causes an error is less likely to cause problems on other
    pages. Of course, that .php file may provide functions shared across multiple
    pages, but the server and other parts of the application will usually remain active.'
