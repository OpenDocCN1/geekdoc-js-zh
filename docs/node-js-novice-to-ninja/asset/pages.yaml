  md: '# Example Real-time Multiplayer Quiz: Architecture


    This chapter describes the quiz application''s architecture and dependencies.
    It does get complex, so you can skip it if you''rather concentrate on the Node.js
    and Express parts (Chapter 15) and WebSocket code (Chapter 16). That said, technical
    decisions described in these chapters are based on the architecture, so it''s
    good to understand the basics.


    # Why Develop Using Multiple Servers?


    Youcould develop and run the Node.js application on a single server running that
    launches both the HTTP and WebSocket servers. It would be easier to develop, and
    it would support dozens of concurrent users. However, problems will arise as traffic
    grows. If your application crashes, it fails for everyone, and it''s difficult
    to scale the quiz:


    +   - Node.js applications run on a single CPU core.


    Using a multi-core CPU has negligible benefit: Node.js will use one. You could
    use clustering (see Chapter 12), but it''s a considerable coding effort, and you''re
    still limited to the number of physical CPUs.


    +   - You can''t launch multiple application instances.


    A process manager such as PM2 can launch multiple isolated instances of your application
    on different domains and/or HTTP ports. Two players wanting to join the same quiz
    would have to ensure they''re connected to the same instance.


    The quiz therefore uses a multi-server architecture running at least seven individual
    stateless applications. New Node.js application instances can be started on the
    same server—or even different servers—and they''ll start to handling incoming
    traffic. A server can fail and restart without noticeable downtime.


    The only reliable way to develop this application is to use an appropriate architecture
    from the start.'
