  md: 'Each WebSocket server can only manage its own connected clients. A message
    sent from a user to `serverA` wouldn’t be broadcast to those connected to `serverB`.
    It may be necessary to implement backend, pub–pub messaging systems such as Kafka,
    Redis, or RabbitMQ.


    # What is Pub–sub?


    Publisher–subscriber services provide asynchronous communication services. An
    application can send (publish) a message to the pub–sub system. Applications can
    *subscribe* to those messages and be instantly alerted when a new one arrives.


    Therefore:


    +   WebSocket server `serverA` wants to send a message to all clients. It publishes
    the message on the pub–sub system.


    +   All WebSocket servers subscribed to the pub–sub system receive a message event
    (including `serverA`). Each can handle the message and broadcast it to their connected
    clients as necessary.'
