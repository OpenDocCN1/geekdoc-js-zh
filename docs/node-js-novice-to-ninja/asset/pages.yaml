    > ### PM2 Port Clashes


    PM2 magically manages ports. If sixteen instances of your Express application
    all listen on port 3000, PM2 ensures they won''t clash. a single request sent
    to port 3000 gets forwarded to one application instance. The next request may
    go to another.


    Note that PM2 port management can fail if you launch your application using an
    npm script.


    Running processes can be monitored with `pm2 status`.


