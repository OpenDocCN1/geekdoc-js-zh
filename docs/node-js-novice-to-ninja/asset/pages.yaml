  md: '# Node.js: Novice to Ninja


    Tutorials often describe debugging in the final chapters. This can be frustrating
    if you encounter a problem at the start of your coding journey—which you will.
    Software development is complex.


    If you''re lucky, your code will crash with an obvious error message. If you''re
    unlucky, your application will run regardless but not generate the results you
    expect. If you''re really unlucky, everything will work fine until the first user
    discovers a catastrophic, disk-wiping bug.


    > Skip Ahead?

    is is a long chapter that describes several debugging options. You can skip ahead
    to the "Exercise: Debugging webhello.js" section (near the end of the chapter)
    if you''d like to get going. That said, a little learning now could save hours
    of effort later!


    # What is Debugging?


    Debugging is the black art of fixing software defects. Fixing a bug is often easy;
    a corrected character or additional line of code solves the problem. Finding that
    bug is another matter, and developers can spend many frustrating hours locating
    the source of an issue. Fortunately, Node.js has some great tools to trace problems.


    # How to Avoid Bugs


    You can often prevent bugs before you test your application. Let''s look at some
    ways.


    # Use a Good Code Editor


    A good code editor offers features such as:


    +   - line numbering to locate where an error occurred

    - type checking—for example, to ensure a number variable can''t have a'
