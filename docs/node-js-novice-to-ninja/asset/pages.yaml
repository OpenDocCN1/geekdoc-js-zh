  md: "# Useful Node.js APIs\n\nObjects that emit events must be instances of the\
    \ Node.js EventEmitter class. They have an `emit()` method to raise new events\
    \ and an `on()` method for attaching handlers.\n\nThe event example project provides\
    \ a class that triggers a `tick` event on predefined intervals. The `./lib/ticker.js`\
    \ module exports a default class that extends EventEmitter :\n\n```\n// emits\
    \ a 'tick' event every interval\nimport EventEmitter from 'events';\nimport {\
    \ setInterval, clearInterval } from 'timers';\n\nexport default class extends\
    \ EventEmitter {\n```\n\nIts `constructor` must call the parent constructor. It\
    \ then passes the `delay` argument to a `start()` method:\n\n```\nconstructor(delay)\
    \ {\n  super();\n  this.start(delay);\n}\n```\n\nThe `start()` method checks if\
    \ delay is valid, resets the current timer if necessary, and sets the new `delay`\
    \ property:\n\n```\nstart(delay) {\n  if (!delay || delay == this.delay) return;\n\
    \n  if (this.interval) {\n    clearInterval(this.interval);\n  }\n\n  this.delay\
    \ = delay;\n}\n```\n\nIt starts a new interval timer that runs the `emit()` method\
    \ with the event name `tick`. Subscribers to this event receive an object with\
    \ the delay value and number of seconds since the Node.js application started:"
