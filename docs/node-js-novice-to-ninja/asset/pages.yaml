  md: '# Importing External URLs


    Deno and browser JavaScript can import URLs from other domains:


    ```

    import {someFunction} from ''https://example.com/lib.js'';

    ```


    This isn''t supported in Node.js but will arrive in a future release. You can
    use an HTTPS loader, although it''s slower than disk access, the module cached,
    and there are security implications.


    All ES modules and theirmodules are resolved and imported once before your script
    executes. It doesn''t matter where they''re declared in your script.


    You can import specific named items:


    ```

    import { sum, mult } from ''./lib.js'';

    console.log(sum(1,2,3,4)); // 10

    console.log(mult(1,2,3,4)); // 24

    ```


    Or imports can be aliased to resolve naming conflicts:


    ```

    import { sum as addAll, mult as multiplyAll } from ''./lib.js'';

    console.log(addAll(1,2,3,4)); // 10

    console.log(multiplyAll(1,2,3,4)); // 24

    ```


    Alternatively, all public items can be imported into a namespaced variable:


    ```

    import * as lib from ''./lib.js'';

    console.log(lib.PI); // 3.1415926

    console.log(lib.add(1,2,3,4)); // 10

    console.log(lib.mult(1,2,3,4)); // 24

    ```


