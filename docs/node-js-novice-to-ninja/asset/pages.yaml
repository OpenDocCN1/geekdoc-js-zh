    # What Is Routing?


    **Routing** determines which functions Express executes when it receives a request
    for a specific URL, such as / or /another/path/.

    Ultimately, one function will return an HTTP response and terminate further processing.
    The order of your routing functions is therefore critical: a function won''t run
    if an earlier function completes the request.


    A routing function is passed these two objects:


    +   An Express HTTP Request object (req ), which contains details about the browser''s
    request.


    +   An Express HTTP Response object (res ), which provides methods used to return
    a response to the browser. It sends "Hello, World!" text.


    Try adding another routing function below the / handler to handle HTTP GET requests
    to /hello:


    ```

    // another route

    app.get(''/hello/'', (req, res) => {

    res.send(''Hello again!'');

    });

