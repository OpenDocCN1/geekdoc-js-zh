    +   - util.format(format, [args]) : returns a string using printf-like format.


    +   - util.inspect(object, options) : returns a string representation of an object
    for debugging. This is similar to using console.dir(object, { depth: null, color:
    true });


    +   - util.stripVTControlCharacters(str) : strips ANSI escape codes from a string.


