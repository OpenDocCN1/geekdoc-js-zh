  md: '# Write Stateless Applications


    Suppose your single Node.js app kept count of the number of logged-in users in
    single global variable named `userCount`.


    What would happen if you wanted to improve performance by launching two or more
    instances of the same app—perhaps on other servers? Any instance could handle
    a user login. `userCount` value would be different—and wrong—on each running instance
    of the app.


    During development, you''ll often work on a single running instance. However,
    I recommend making it stateless to ensure it can scale and be more resilient.
    Always presume:


    +   - multiple instances could running anywhere, possibly on different ports or
    servers

    - an instance can be started or stopped at any time

    - a frontend web server direct a single user''s request to any instance—regardless
    of which instance handled a previous request


    In essence, avoid storing application or user state in variables or local files
    that could differ across instances. Use a database to retain state so every instance
    of the application can be synchronized.


    # Summary


    In this chapter, you''ve learned how to write simple console and web server applications
    using Node.js libraries alone. You''ve also seen `nodemon` can automatically restart
    your app after updating code.


    In the next chapter, you''ll discover options for debugging and fixing problems
    in your Node.js code.'
