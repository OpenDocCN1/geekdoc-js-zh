  md: '# Preface


    This course will help you get started with Node.js in the shortest possible time.

    Within a day or two you should have enough knowledge to write simple applications.


    # Prerequisites


    This course is for web developers taking their first steps with Nodes.js. Ideally,

    You should understand web development concepts and technologies:


    +   - web browsers (client-side HTML, CSS, and JavaScript)

    - web servers (code to serve web pages and APIs)


    It will help if you already know some JavaScript—perhaps from writing client-

    side scripts. This book explains some aspects of JavaScript in relation to

    Node.js, but you won''t find deep dives into variables, loops, functions, objects,

    and so on.


    A little knowledge of the command line, Git, and code editors such as VS Code

    will also be useful.


    # Code Samples


    Code in this book is displayed using a fixed-width font, like so:


    ```

