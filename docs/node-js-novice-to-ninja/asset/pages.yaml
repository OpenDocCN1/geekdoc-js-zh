  md: '# Asynchronous Programming in Node.js


    executed?

    All Node.js applications initialize an event loop. Once the last statement completes
    execution, Node.js loops back and checks for any outstanding:


    +   - timers (such as `setTimeout` )

    - pending callbacks

    - polling data connections


    These are run in the order they''re received (know as "first in, first out", FIFO).


    A seemingly idle application won''t end if it''s waiting for something to complete
    or if something could occur at a future point (such as a server *Listen* on a
    specific port).


    # Avoid Blocking the Event Loop


    > Long-running JavaScript calculations or processes block the event loop and delay
    the processing of incoming requests. Process-intensive tasks should either be:

    - split into smaller sub-tasks with timers

    - run in the background using a `worker thread` or a `child process` (options
    that are discussed in Chapter 12).


    # Callback Conundrums


    Using callbacks in asynchronous functions isn''t always easy. Your code can look
    correct and run without errors, but it eventually causes the Node.js runtime to
    crash.


    Two severe issues are:


    +   - failing to terminate an asynchronous function after a callback'
