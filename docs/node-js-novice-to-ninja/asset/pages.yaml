  md: '# Your First Node.js Application


    Scaling an application can be difficult. Throwing more RAM or CPUs onto an Apache/PHP
    server will improve response times. Node.js still runs on a single CPU core even
    when that CPU has 15 more at its disposal. Solutions such as clustering, PM2,
    and Docker containers can help by launching multiple instances of the same application.


    In addition, Node.js web servers are not efficient at serving static files as
    images, stylesheets, and client-side JavaScript. Production sites often use a
    front-end NGINX web server to serve static files or direct the request to the
    Node.js application when appropriate. This is known as a reverse proxy and it
    has benefits, such as:


    +   Static assets are served without any Node.js interaction. This avoids unnecessary
    processing and improves performance.


    +   Settings such as HTTPS certificates can be handled by NGINX rather than Node.js.
    This is especially practical when you have more than one instance of the same
    Node.js application running.


    +   A Node.js app can run on a port above 1000, so it doesn''t need elevated superuser
    permissions.'
