    requires others that have further dependencies. You can end up with multiple versions
    of the same package in the same project.

    - Every third-party package and subpackage raises security implications. npm has
    a registry of known vulnerabilities, but information won''t be available for new
    or less packages.


    Is it more practical to write the code yourself?


    A small module specific to your application is a good candidate. You''ll learn
    and be able to write fully customizable code that''s fast and lean. Over the long
    term, it may take less time and effort than maintaining a regularly updated third-party
