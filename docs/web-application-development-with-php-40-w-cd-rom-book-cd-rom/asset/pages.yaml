  md: '# Datenbankzugriff mit PHP


    Intern verwendet Auth die beiden Klassenvariablen $database_class und $database_table,
    um Session- und Authentifizierungsdaten zu speichern. haben keinen Einfluss auf
    den Authentifizierungsvorgang. Die Anmeldung wird von den Klassenfunktionen verwaltet,
    Sie definieren müssen: auth_logininfo() und auth_validlogin().


    Wenn ein Benutzer sich anfordert, aber noch nicht angemeldet ist, ruft die Klasse
    Auth Funktion auth_logininfo() auf. Diese Funktion sollte einen Authentifizierungsbildschirm
    zeigen. Sie kann auch aufgerufen werden, wenn die Authentifizierung fehlschlägt,
    sollte sie über Mechanismen verfügen, um bei fehlgeschlagenen Versuchen neue zu
    generieren. Im Beispiel wird eine entsprechende Fehlermeldung angezeigt, und im
    Benutzer des Formulars wird der übertragene Wert angezeigt.


    Die zweite Funktion auth_validlogin() bildet den Kern der Klasse. Sie führt die
    Authentifizierung durch. Diese Funktion wird aufgerufen, nachdem der Benutzer
    die Authentifizierungsdaten aus dem Formular übertragen hat. Die Variablen des
    Formulars werden als globale Variablen verwendet und sollen in der Funktion als
    definiert sein, damit sie gespeichert werden können. Wie Sie die Authentifizierung
    durchführen, bleibt Ihnen. Wir führen einen Vergleich mit der Standard-auth-user-Tabelle
    aus PHPLib-Distribution durch. Stattdessen könnten Sie auch htaccess-Stati,, ä.
    verwenden.


    Wenn die Authentifizierung erfolgreich ist, muss die Funktion eine gültige Benutzerkennennummer
    zurückgeben und das Array $this->auth einrichten. Dieses associative Array muss
    mindestens zwei Elemente enthalten: die eindeutige Benutzerkennummer uid und den
    vom Benutzer eingegeben Benutzernamen uname.


    Wenn Sie mit der Klasse Berechtigungsebenen einrichten möchten (mehr später),
    müssen Sie ein weiteres Element einrichten, $this->auth["perm"]. Dieses Element
    sollte eine Liste aller Berechtigungen enthalten, die der Benutzer hat, wobei
    mehrere Berechtigungen durch ein Komma, ohne Leerzeichen voneinander getrennt
    sind, z.B. admin oder author.editor. In der Regel wird diese Liste aus dems Speichermodul
    ausgeladen, aus dem Sie die Benutzerdaten, in unserem MySQL-Datenbank.


    Wenn die Authentifizierung fehlschlägt, muss die Funktion false zurückgeben, und
    die Funktion auth_logininfo() wird erneut aufgerufen. Haben Sie bemerkt, dass
    wir $this->auth["uname"] eingerichtet haben, ungeachtet, dass die Authentifizierung
    erfolgreich war? Das Array $this->auth ist eine Session-Variable und bleibt über
    mehrere Anmeldeversuche erhalten. In der Funktion auth_logininfo() überprüfen
    wir auch, ob der Benutzernamen bereits eingegeben wurde, und füllen das Anmeldeformular
    dementsprechend aus.'
