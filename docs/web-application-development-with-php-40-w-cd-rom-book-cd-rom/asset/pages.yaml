  md: '# Die PHP-Normal Form


    +   - Muss einen definierten Satz von Zeichen vor dem (@)-Zeichen enthalten.

    - Ein @-Zeichen

    - Ein Host mit einer Mindestliste von zwei Zeichen

    - Eine Domäne der obersten Ebene mit einer Mindestliste von zwei Zeichen


    In den meisten Fällen reicht Überprüfung aus. Aber ist auf keinen Fall eine vollständige
    Überprüfung der offiziellen Syntax, die im RFC 822 definiert ist. RFC lässt Mail-Adressen
    in der Form "Name" mail@host.com zu, die bei unserer Überprüfung abgelehnt werden.
    Unsere Überprüfung kontrolliert aber nicht, ob die E-Mail-Adresse tatsächlich
    existiert.


    Hin und wieder können Sie auch einen anderen Ansatz, der zunächst stringenter
    ist, sich aber im realen Leben häufig als nützlich erweist. Dies liegt daran,
    dass SMTP, das Simple Mail Transfer Protocol, Rückmeldung gibt, ob ein lokaler
    Benutzer ihn. Wenn wir ein SMTP-Kopf senden, antwortet der Adresse des Empfängers
    oder den Benutzernamen von dem lokalen System oder dem Statuscode 250, wenn der
    Benutzer oder der Statuscode 550, der Benutzer unbekannt ist. So geht es - theoretisch.
    Leider wird der Mailserver so, dass alle Benutzer akzeptieren. Sie beantworten
    alle Fragen mit »250 - Empfänger OK.. Wir haben es mit einem Mailserver ausprobiert,
    der wir die erwartete Antwort, dass alle Benutzer akzeptiert werden. Da SMTP ein
    Klartextprotokoll ist, kann er dieses Verhalten einfach durchführen, indem Sie
    eine SMTP-Sitzung simulieren:


    ```

    bash-2.01$ telnet smtp.dnet.it 25

    Trying 194.242.192.2...

    Connected to ns.dnet.it.

    Escape character is ''^''

    250 dnet.it ESMTP Sendmail 8.9.3/8.9.3: Tue, 26 Oct 1999 19:02:43 +0200 (MET)

    HELO www.profi.it

    250 dnet.it Hello www.profil.it [194.242.192.194], pleased to meet you

    MAIL FROM: tobias@dnet.it

    250 tobias@dnet.it... Sender ok

    RCPT TO: this.user.doesnt.exist.for.sure

    250 this.user.doesnt.exist.for.sure... Recipient ok

    QUIT

    221 ns.dnet.it closing connection

    Connection closed by foreign host.

    ```


    Eine bessere Idee wäre zu überprüfen, ob der MX(Mail Exchange)-Host existiert,
    indem Sie beispielsweise die Funktion getmxrr() benutzen. Dies kann die Überprüfung
    jedoch erheblich verlangsamen, wenn der DNS-Server des ent-'
