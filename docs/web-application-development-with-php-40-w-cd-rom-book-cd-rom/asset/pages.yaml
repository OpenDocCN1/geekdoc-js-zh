  md: '# 7 Anwendungen der Spitzentechnologie


    Die PHPLib-Klasse Template ermöglicht eine Trennung von Programmcode und Layout,
    ähnlich wie die Klasse EasyTemplate, die wir in Kapitel 5 »Grundlegende Webentwickungsstrategien»
    entwickelt haben. Diese Klasse hat eine größere Vielfalt an Funktionen, die von
    uns entwickelte. Sie kann beispielsweise Blöcke enthalten, die Abschnitte markieren,
    die mehr als einmal werden sollen (z. b. in Tabellen nötigst). Außerdem kann sie
    in einer Instanz Dateien öffnen und diese sehr einfach kombinieren. Der Nachteil
    ist, dass sie nicht so intuitiv verwenden lässt wie EasyTemplate.


    Die Klasse Template ist vollständig unabhängig von dem Rest von PHPLib, sodass
    Sie diese ohne andere PHPLib-Funktionen einsetzen können. Wenn Sie die Quelle
    für diese Klasse anschauen möchten, finden Sie diese in der Datei Template.inc
    der PHPLib-Distribution.


    Eine EasyTemplate speichert PHPLibs Schablonklasse HTML in separate Dateien und
    verwendet Platzhalter für Daten, die dynamisch von PHP ersetzt werden sollen.
    Die skalaren Platzhalter, die durch einfache Zeichenketten erstellt werden, haben
    dieselbe Format wie in EasyTemplate.


    Listing 7.1 zeigt den Programmcode, der diese einfache Schablone verarbeitet.


    ```

    // Create a template instance

    $tpl = new Template();


    // Load file, assign an identifier to it

    $tpl->set_file("page" => "basic_template.inc.html");


    // Assign contents to the placeholders

    $tpl->set_var(array("TITLE" => "This is a Template test", "CONTENTS" => "Hello
    World!\));


    // Parse into a temporary variable (identifier)

    $tpl->parse("out", "page");


    // Output the parsed template

    $tpl->p("out");

    <html>

    <title>{TITLE}</title>

    <body>

    {CONTENTS}

    </body>

    </html>

    ```


    Listing 7.1: Einfaches Beispiel der Klasse Template'
