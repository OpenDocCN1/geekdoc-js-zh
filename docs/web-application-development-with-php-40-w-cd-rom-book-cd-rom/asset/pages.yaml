    Versionsverwaltung mit CVS


    Das erste Shell-Skript login_process_php.sh wird nur für das Archiv phpbook aufgerufen.
    Das zweite Skript login_process_all.sh wird bei jeder Rückübertragung aufgerufen,
    ungeachtet des Archivs, da das Schlüsselwort ALL enthält.


    In das aufzurufende Programm können paar spezielle Variablen eingefügt werden,
    die ausführliche Informationen über die Rückübertragung enthalten. Diese Variablen
    werden durch ein vorangestelltes Prozentzeichen (%) markiert, ähnlich der Formatierung
    in printf(). Wenn mehr als eine Variable verwendet wird, müssen diese in geschweiften
    Klammern angegeben sein. Die folgende Tabelle zeigt die verfügbaren Variablen.


    | Variable | Bedeutung |

    | s | Dateiname |

    | V | Versionsnummer für der Rückübertragung |

    | v | Versionsnummer nach der Rückübertragung |


    Sobald Sie eine dieser Variablen verwendet, wird automatisch eine weitere Zeichenfolge
    mit dem Namen des CVS-Moduls für eine Variable eingefügt.


    Um eine Mail an john und jane zu schicken, könnte folgende Datei verwendet werden:


    ```

    ^f-api /bin/mail -s "CVS update: %s" -c john jane

    ```


    Was jedoch, wenn die Rückübertragungsnachricht in einer Datei protokliert werden
    soll? CVS prüft nur den ersten Eintrag in einem Verzeichnis auf Übereinstimmung,
    sodass dass das Einfügen einer weiteren Zeile für

    ^f-api nichts helfen würde. Zweifellos lässt sich dieses Problem durch ein Shell-Skript
    lösen. Aber was ist, wenn die Routine erweitert werden soll, um später die Nachricht
    in eine Datenbank zu speichern? Liste 5.2 zeigt, wie sich dieses Problem mit PHP
    lösen lässt. Datei login lautet der Aufruf folgender:


