  md: '# 4 Webanwendungskonzepte


    Der Betrag für das gesamte Budget für Entwicklungsprojekte vieler Websites. Es
    ist nicht überraschend, dass ein Projektmanager beim Lernen eines Solcher dem
    Tauglichkeitsprüfverfahren ganz und gar ablehnt.


    Jakob Nielsen’ Ansatz einer „einfachen Tauglichkeitsprüfung“ (www.use.com/papers/guerrilla_hci.html)
    zeigt darauf auf, Tauglichkeitsprüfungen einfacher, billiger und weniger zeitaufwendig
    zu gestalten. Er ist seit 1989 viele Methoden untersucht, fand er heraus, dass
    es für die meisten Projekte unnötig ist, alle herkömmlichen Tauglichkeitsprüfungen
    anzuwenden. Tatsächlich konnte er die Tauglichkeit mit einer Reihe von Basisfragen
    deutlich verbessern.


    Nach dem Prinzip der frühen Fokussierung auf den Benutzer setzte er Techniken
    ein, die wir in den folgenden Abschnitten beschreiben:


    +   * Szenarien

    * Vereinfachtes lateken

    * Heuristische Auswertung


    # Szenarien


    Ein Szenario ist eine deutlich reduzierte Reihe von Funktionen oder Funktionalitäten,
    die einem Tauglichkeitstest unterzogen werden. Traditionell werden für Tauglichkeitsprüfungen
    komplexere Testfälle verwendet, die schwierig einzurichten und zu testen sind.
    Unser Szenario ist klein, können es ohne weiteres häufig ändern und so beim Test
    verschiedener Versionen eines Prototypes verbessern.


    Dieses Szenario wurde auf der Basis einer Aufgabenanalyse von realen Benutzern
    und ihrer Arbeit erstellt, womit es in Hinsicht auf die tatsächliche Entwicklung
    des Systems so wirklich möglich ist. Typische Szenarien sind Aufgaben, wie „Dokument
    ausdrucken“ oder „einen Flug nach Honolulu für den 1. Januar 2001 buchen“. Diese
    kommen vom Benutzer mithilfe einer vereinfachten Version des latekens getestet.
    Die Verfahren beschreiben wir im nächsten Abschnitt.


    # Vereinfachtes lateken Denken


    In einer Studie über das lateken wurde ein Benutzer beobachtet, während er eine
    definierte Aufgabe in einem Szenario durchführt. Traditionell wurden diese Studien
    von Psychologen oder Tauglichkeitsexperten durchgeführt, welche die Tester auf
    Video aufnahmen und anschließend die Aufzeichnungen ausführlich analysierten.
    Auch diese anspruchsvolle Methode ist kostintensiv und wirkt möglicherweise auf
    einige Entwickler einschüchternd. Es ist jedoch möglich, ein Test ohne die anspruchsvolle
    Testumgebung'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'durchzuführen. Dazu brauchen Sie nur einige reale Benutzer, denen Sie typische
    Testaufgaben geben und die Sie bitten, während der Durchführung der Testaufgabe
    zu denken.


    Bei den vereinfachten Tests brauchen Sie ideal zwei bis fünf Benutzer, während
    herkömmliche Verfahren 10 oder mehr Benutzer erfordern, um zuverlässige Ergebnisse
    zu erhalten. Das Hauptmerkmal von statistischen Daten ist jedoch darauf ausgerichtet,
    Bezug auf die Tauglichkeit so schnell möglich zu finden. Tatsächlich zeigen Studien,
    dass die Tauglichkeitprobleme innerhalb des ersten Tests gespürt werden


    Anstatt den Testpersonen per Video aufzuzeichnen, findet die Versuchsbeobachtung
    der Benutzer auf Papier statt. Das Aufzeichnen und Analysieren von Videobändern
    ist und erfordert mindestens eine zusätzliche Person, welche die Kamera bildet.
    Die Analyse der Papiernotizen lässt sich schnell machen und ist trotzdem effizient.
    Die ganze Zeit lässt sich besser zur Durchführung weiterer Tests und zum Test
    verschiedener Schnittstellen verwenden.


    # Heistische Auswertung


    Die heuristische Auswertung ist ein Verfahren, Eignungsprobleme einer Schnittstelle
    zu finden. Eine kleine Anzahl von Bewertern testet die Schnittstellen und bewertet
    ihre Übereinstimmung mit den Designprinzipien etablierter Benutzchnittstellen
    (der Heuristik). Diese Prinzipien können die beschriebenen zehn empfohlenen heuristischen
    Methoden von Nielsen sein, die sich auf den Entwurf einer Benutzerschnittstelle
    beziehen, oder eine Reihe von benutzerspezifischen Prinzipien, die auf eine bestimmte
    Umgebung zugchnitten sind.


    Die Bewerter müssen Tauglichkeitsexperten sein. Lassen viele Tauglichkeitsmängel
    durch heuristische Auswertung entdecken, und die verbleibenden Probleme mit der
    vereinfachten Version des lauten Denkens entdecken. Das verschiedene Wege unterschiedlicher
    Tauglichkeitsprobleme finden werden, kann außerdem hilfreich sein, drei bis fünf
    Leute die heuristische Auswertung vorzunehmen lassen. Ein Projektteam sollte die
    Ergebnisse der einzelnen Benutzer sammeln und einen ausführlichen Testbericht
    erstellen, der dann auf einem fachübergreifenden Treffen vorgestellt wird.


    Bei der heuristischen Methode wird nur die Schnittstelle auf Probleme überprüft.
    Die Bewerter wiederum nicht das eigentliche System. Sie nutzen die Heuristik als
    Prüfliste und versuchen, so viele Angriffe auf diese zu finden wie möglich. Dieser
    Ansatz sollte nur als Zusatz zu den anderen Tauglichkeitsprüfverfahren eingesetzt
    werden.'
  merge: -1
