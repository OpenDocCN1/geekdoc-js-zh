    Für Windows-Rechner ist WinCVS den Sie unter www.wincvs.org erhalten, ein sehr
    hilfreiches Programm, um die Arbeit zu erledigen (siehe Abbildung 5.3). Es verbirgt
    die Komplexität von CVS nicht, sondern gibt Ihnen einen bequemen Zugriff auf die
