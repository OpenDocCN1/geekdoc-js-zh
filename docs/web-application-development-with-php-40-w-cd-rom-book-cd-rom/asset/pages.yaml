    \nAbbildung 7.5: DOM-Struktur\n\n# 7.2.8 LibXML - ein DOM-basierter XML-Parser\n\
    \nSeit der Version 4.0 ist in PHP ein neuer XML-Parser integriert: LibXML. Der\
    \ Parser war ursprünglich von Daniel Veillard für das Gnome-Projekt entwickelt,\
    \ um einen DOM-Führungs Parser für komplexere Datenaustausch zu ermöglichen. Uwehen\
    \ Steinmann hat ihn integriert in PHP.\n\nAuch wenn die interne Darstellung eines\
    \ Dokuments in LibXML einer der DOM-Schnittstelle ähnelt, ist sie irreführend,\
    \ LibXML als einen DOM-Parser zuzeichnen. Die Analyse und die Verwendung des DOM\
    \ gehören zu zwei verschiedenen Zeitpunkten. Sie könnten genauso genau eine API\
    \ oberhalb von Expat generieren, um eine DOM-Schnittstelle bereitzustellen. Zugegegeben,\
    \ die LibXML-Bibliothek erleichtert diese Aufgabe. Sie müssen die API anändern,\
    \ um sie der DOM-Spezifikation anzupassen. In Gnome gibt es sogar ein Gdome-Modul,\
    \ das eine DOM-Schnittstelle für Lib bereitstellt."
