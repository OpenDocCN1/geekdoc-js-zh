  md: '# 5 Grundlegende Webanwendungsstrategien


    Doch wozu dient der Dritte im Bunde, der Übergangsserver? Ist das nicht etwas
    übertrieben? Nicht, wenn Ihr Team groß genug ist, um für die Qualitätssicherung
    (QA) oder die Sicherheitsüberprüfung Personalzustellen. Bei einer komplexen Website
    brauchen wir häufig Zeit, um eine geänderte Version zu testen, bevor wir diese
    fregeben. Sie können die Entwickler dazu verdammen, tatenlos umzusetzen, während
    das Qualitätssicherungspersonal den Übergangsserver die Lupe nimmt. Ein weiterer
    Grund, warum wir einen Übergangsserver in dieser Konstellation integrieren sollten,
    ist dass Entwickler sich sicherer und unbefängter Änderungen vornehmen. So können
    Entwickler nicht nur Große machen, sondern auch den Code eines anderen Entwicklers
    versehentlich zerstören. Wenn ein Problem auftritt, können Sie dies lösen, bevor
    der Projektleiter die Entwicklungsversion an den Übergangsserver weiterleitet.
    Wenn jemand den Übergangsserver zum Absturz bringt, muss er natürlich nicht nach
    dem traditionellen dreißig Liegestunden bezahlen.


    Wie sieht ein typischer Entwicklebenszyklus in dieser Konstellation aus?


    +   1. Das neue Projekt wird gestartet, indem eine Verzeichnisstruktur erstellt
    und ein System zur Versionsverwaltung errichtet wird (mehr zu Versionsverwaltung
    weiter unten).

    2. Entwickler testen eine Kopie des Programmszweigs der Entwicklung.

    3. Die Entwickler leiten ihre Änderungen an den Programmzweig Entwicklung weiter.

    4. Sobald ein wichtiger Meilenstein erreicht wurde und das System bereit steht,
    transferiert der Projektleiter den Entwicklungscode zum Übergangsserver.

    5. Das Qualitätssicherungs- und Sicherheitspersonal führt auf dem Übergangserver
    Tests durch. Fehler und Probleme werden an den Entwickler weitergeleitet.

    6. Die Entwickler beheben die Fehler und leiten das Projekt an, solange keine
    Fehler gefunden werden.

    7. Für die Freigabe wird der Übergangsserver auf den Produktionsserver kopiert.
    Vergessen Sie nicht, die Freigabe gebührend zu feiern!


    Bedenken Sie, dass wir nur über den Teil des Projekts reden, der sich mit der
    Entwicklung des Programmcodes befasst. Das gesamte Projekt durchläuft natürlich
    alle Zyklen der Softwareentwicklung:


    +   1. Projektstart

    2. Analyse

    3. Entwurf'
