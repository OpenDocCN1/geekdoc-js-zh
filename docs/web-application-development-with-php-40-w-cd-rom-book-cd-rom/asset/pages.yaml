  md: '# Pearson Education

    ADDISON-WES

    Versionsverwaltung von CVS


    Das Konzept der Versionsverwaltung ist etwas komplizierter, aber Sie können es
    sich wie stärkere Tags vorstellen. Wenn Sie eine stärkere Trennung von den beiden
    Codebahnen haben möchten (die trotzdem noch auf dasselbe Projekt beziehen), müssen
    Sie genauen zwei separate Versionsverwaltungen erzeugen. Auf Beispiel Versionen
    bezogen wir einmal davon aus, dass Jane und zwei separate Versionen pflegen möchten
    – für die Entwicklung API und eine stabile Version – so wie bei der Entwicklung
    des Linux-Kernels.


    Ein neuer Versionszweig wird mittels des Befehls tag -b erzeugt. Um einen Entwicklungszweig
    mit dem aktuellen Code zu generieren, führt Jane den folgenden Befehl aus:


    ```

    jane@dev:/home/jane/f-api > tag -b dev

    ```


    Der neue Versionszweig erhält den Namen. Um eine lokale Kopie dieses Zweiges zu
    erzeugen, bringt Jane ihn nur von CVS auslesen, wie sie es bei einem Tag gekennzeichneten
    Version tun wird:


    ```

    jane@dev:/home/jane/f-api > cv checkout -r dev

    ```


    Hier wird der Unterschied zwischen normalen, mit Tag gekennzeichneten Dateien
    und Dateien deutlich. Alle Befehle, die Jane zukünftig ausführt, betreffen nur
    diesen Zweig und haben keine Auswirkungen auf den Hauptstatus. Alle Daten werden
    im Zweig aktualisiert und hier weitergegeben. Damit kann Jane im Entwicklungszweig
    arbeiten, ohne den Hauptig zu ändern. Aber Vorsicht! Die Pflege verschiedener
    Zweige kann sich zu einem verwalterischen Alptraum entwickeln. Wir empfehlen daher,
    nicht mehr als drei Zweige je Projekt zu verwenden.


    > Tipp: Wenn Sie sehen möchten, welchem Zweig eine Datei gehört, verwenden Sie
    cv status. Die Ausgabe „Sticky Tag“ gibt den Namen des Versionszweigs und die
    Versionsnummer an.


    Häufig wird ein Abgleich zwischen dem neuen Zweig und dem Hauptzweig vorgenommen.
    Von Zeit zu Zeit möchte Jane die neuen Funktionen aus dem Entwicklungszweig wieder
    in den Hauptig übertragen. Dazu muss sie zunächst den Hauptzweig auslesen, und
    dann einen Diff für den Entwicklungs erstellen:


    ```

    jane@dev:/home/jane/ > cv checkout f-api

    jane@dev:/home/jane/f-api/ > cv update -j dev

    ```


    Die Option -j (join) des Befehls update weist CVS an, die Unterschiede zwischen
    dem Entwicklungszweig mit der lokalen Kopie zu vermengen.


    241'
