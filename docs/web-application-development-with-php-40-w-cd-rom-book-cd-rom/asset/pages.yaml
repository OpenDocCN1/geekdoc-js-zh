    \ Ziel durch Verwendung von definierten Arten erreichen. Definierte Werte sollten\
    \ verwendet werden, um alle feste Werte zu ersetzen, wie z.B. Fehlercodes, Dateiformatkonstanten,\
    \ spezielle Zeichenfolgen und andere Konstrukte, die eine spezielle Bedeutung\
