  md: "# Wissensrepräsentation\n\nwir verschachtelte Kategorien. Deshalb muss diese\
    \ Struktur auch einen eindeutigen Bezeichner haben (zwei Kategorien in verschiedenen\
    \ Zweigen könnten denselben Namen haben). Eine weitere Anforderung: unbegrenzte\
    \ Struktur. Aber dies überspringen wir für den Moment, da es ein separates Problem\
    \ ist.\n\nDie dritte Datenstruktur ist bereits definiert, da wir PHPLib verwenden.\
    \ Dies entspricht der PHPLib-Klasse `Auth`.\n\nDieser Ansatz unterscheidet sich\
    \ von herkömmlichen Top-Down-Programmierung und funktionalen Zerlegung. Bei der\
    \ funktionalen Zerlegung wird der zu erstellenden Service bereits gekennzeichnet\
    \ (in unserem Beispiel «Strukturierung von Fakten in Kategorien», »Bereitstellung\
    \ von Berichten für die Einträge mit den meisten Zugriffen (usw.) und in kleinen\
    \ Unterfunktionen unterteilt, die Funktionen am besten vorliegen und sich direkt\
    \ in Programmfunktionen abbilden lassen). Zu diesem Zeitpunkt unternehmen wir\
    \ uns in dieser Richtung noch nicht, da wir noch gar nicht wissen, wie Funktionen\
    \ definiert werden. Funktionale Zerlegung hört sich großartig an - bis wir ausprobiert\
    \ haben. Sie kann in eine vollkommen falsche Richtung führen, und sobald sie einmal\
    \ angefangen haben, ist es nahezu unmöglich, Entscheidungen zu korrigieren, da\
    \ Sie die Funktionen immer wieder teilenilen können – Sie müssen also komplett\
    \ von vorn beginnen.\n\nStatt dessen versuchen wir, das Problem in Entwurfsmuster\
    \ zu unterteilen. Wir versuchen, Probleme zu erkennen, für die wir bereits eine\
