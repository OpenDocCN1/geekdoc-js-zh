    zwar eine schöne Ausgabe, aber der Code an sich ist weder elegant, noch verfügt
    über clevere Tricks. Es ist eine einfache Schleife, die Sie möglicherweise jeden
    Tag verwenden müssen, um die Aufgabe zu erledigen.


