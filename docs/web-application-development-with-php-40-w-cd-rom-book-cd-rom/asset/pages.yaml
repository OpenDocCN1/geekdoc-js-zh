  md: '# Grundlegende Webanwendungsungsstrategien


    > Tipp: Der Name des Hauptzweigs lautet immer HEAD. Jane könnte den Hauptzweig
    und den Entwicklungszweig mit dem Befehl cv update -j HEAD zusammenfassen.


    Nach Bedarf möglicher Konflikte kann Jane ihre Kopie ans Hauptverzeichnis zurückschicken,
    und die Rückübertragung ist abgeschlossen.


    # Automatische Benachrichtigung


    An diesem Punkt muss Jane wiederum ihre Kollegen über den Zusammenschluss informieren.
    Wie wir bereits erwähnt haben, kann CVS eine effektive Kommunikation im Team nicht
    ersetzen, kann sie aber unterstützen.


    Der CVS-Server kann so eingerichtet werden, dass er jeder Übertragung zum Zentralarchiv
    eine Mail an einen Anschriftenlistenserver könnte eine solche Aktion sein. Sie
    eine Anschriftenliste oder Aliasgruppe für jedes Projekt einrichten, können Sie
    Meldungen über Weiterleitungen einschließlich Protokolleinträge an mehrere Teilnehmer
    verbreiten.


    Zu diesem Zweck muss die CVS-Verzeichnisdateien, welche die Datei loginfo, bearbeitet
    werden. Diese Datei legt fest, welche Informationen über das Zurückführen der
    Daten gehandhabt werden. Sie können diese per Mail verschicken, sie in einer Datenbank
    speichern (oder ähnliches).


    Sie können die administrativen Dateien direkt im Verzeichnis CVSROOT des Systems
    ändern. trotzdem, sie per CVS zu ändern. Auf diese stehen alle regulären Funktionen
    und das Sicherheitsnetz von CVS zur Verfügung. Um eine Sitzung zu starten, lesen
    Sie das Verzeichnis CVSROOT aus:


    ```

    jane@dev:/home/jane/ > cvs checkout CVSROOT

    ```


    Anließend bearbeiten Sie die Datei loginfo. Der erste Teil der Zeile besteht aus
    einem regulären Ausdruck, der mit dem übertragenen Verzeichnis verglichen wird.
    Wenn eine Übereinstimmung gefunden wird, wird der Rest der Zeile dem Programm
    angeben das aufgerufen wird. Das Programm soll Übertragungsinformationen als Standardausgabe
    erwarten. Anstelle eines regulären Ausdrucks könnten Sie eine Eine in der Datei
    verwenden, die mit DEFAULT beginnt. Diese Anweisung wird herangezogen, wenn kein
    übereinstimmendes Verzeichnis gefunden wird. Ein weiterer spezieller Befehl ist
    ALL, der immer ausgeführt wird. Zwei Beispiele solcher Zeilen:


    ```

    ^phpBook /cvs/loginfo_process_phpbook.sh

    ALL /cvs/loginfo_process_all.sh

    ```'
