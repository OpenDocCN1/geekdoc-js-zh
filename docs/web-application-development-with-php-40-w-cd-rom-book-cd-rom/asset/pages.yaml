  md: '# 4 Webanwendungskonzepte


    Wenn der Nachrichtenaustausch nur zwei Teilnehmer betrifft, ist dies kein Problem.
    Aber stellen Sie sich ein System mit 100 Teilnehmern vor, in dem Benutzer mit
    jedem anderen auf geheime Weise kommunizieren soll. Wenn das System nur einen
    Schlüssel verwenden würde, könnte der Benutzer nicht sicherstellen, dass die Nachricht
    tatsächlich von Benutzer Jane verschickt wurde. Dazu brauchte Benutzer einen eigenen
    Schlüssel. Und Benutzer muss die Schlüssel aller anderen Benutzer kennen. 99 Schlüssel
    zu verwalten und sich möglichst auch noch zu merken – das klingt gar und nicht
    lustig


    Die Hauptproble der Verschlüsselung mit geheime Schlüssel bestehen darin, dass
    die Anzahl der Schlüssel mit der Anzahl der Benutzer im System steigen, und dass
    jeder Benutzer so viele Schlüssel kennen muss, wie er benutzt.


    # Verschlüsselung mit öffentlichem Schlüssel


    Betrachten wir noch einmal das System mit den 100 Benutzern, das wir im vorherigen
    Abschnitt angesprochen haben. Dass 99 seinen geheimen Schlüssel kennen können,
    stellt eine einen öffentlichen Schlüssel zur Verfügung und beh einen privaten
    Schlüssel für sich. Jeder der 99 anderen Benutzer kann den öffentlichen Schlüssel
    verwenden, um eine Nachricht zu verschlüsseln und diese an ihn zu schicken. Nur
    Jane kann mit seinem privaten Schlüssel sie entschlüsseln. Dieses System hat offensichtlich
    Mängel: Wagem habe keine Berechtigung mehr, wer ihm die Nachricht geschickt hat,
    da jeder Benutzer die Nachricht verschlüsselt hat. Der Absender muss damit mit
    dem privaten Schlüssel unterzeichnen, sodass der Empfänger mit dem öffentlichen
    Schlüssel des Senders abgleichen kann, ob die Authentizität und Integrität der
    Daten sicherstellt. Dieses System wird als Verschlüsselung mit öffentlichem Schlüssel
    bezeichnet. Die beiden bekannten Algorithmen Diffie-Hellman und RSA (RSA steht
    für die Erfinder des RSA-Verschlüsselungssystems Rivest, Shamir und Adleman).


    Der Hauptvorteil der Verschlüsselung mit öffentlichem Schlüssel gegenüber geheime
    Schlüsselfreundlichkeit liegt im dem höheren Niveau an Sicherheit muss kein privater
    Schlüssel an einen Teilnehmer weitergeleitet werden. Im Gegenteil – bei der Verschlüsselung
    mit geheime Schlüssel muss dieser über einen Kommunikationskanal ausgetauscht
    werden. Dies bietet für Hacker wieder die Möglichkeit, durch Abhören während der
    Übertragung des Schlüssels ihn auszubben.


    Ein weiterer Vorteil ist, dass Systeme mit öffentlichen Schlüsseln digitale Untersriften
    bereitstellen können, wenn ein Benutzer die Nachricht mit seinem privaten Schlüssel
    unterschreibt. Die Verschlüsselung mit geheimen'
