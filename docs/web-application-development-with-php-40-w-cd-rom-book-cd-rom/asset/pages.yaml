    # 9.16 Duplizierung variabler Inhalte: Der Copy-Konstruktor


    Früher oder später müssen sich der Inhalt eines zval-Containers einem anderen
    zuweisen. Dies ist leicht gerade, denn Container enthalten nicht nur Informationen
    über Typen sondern Referenzen auf Bereiche in den internen Daten von Zend. Je
    Größe können Arrays oder Objekte mit vielen Hash-Tabhelleinträgen verschachtelt
    werden. Durch Zuweisen eines zval zu einem anderen, vermeiden Duplikierungen der
    Hash-Tabelleeneinträge, in denen sie nur eine Referenz auf diese verwenden würden
    (überhaupt).


    Um komplexe Art von Daten zu kopieren, verwenden Sie den Copy-Konstruktor. Copy-Konstruktoren
    sind in der Regel in Sprachen definiert, die ein Überladen des Operators unterstützen
    und explizit dazu dienen, komplexe Typ zu kopieren. Wenn Sie in einer solchen
    Sprache ein Objekt definieren, haben Sie die Möglichkeit, den Operator = zu überladen,
    der in der Sprache verwendet wird, den Inhalt von imvalue (Ergebnis der Auswertung
    links vom Operator) rvalue (das Gleiche auf der rechten Seite) zuzuweisen.


    Überladen bedeutet, dass ein Operator eine neue Bedeutung zugewiesen wird. In
    der Regel wird er verwendet, um einen Funktionsaufruf einem Operator zuzuordnen.
    Wenn dieser Operator dann auch auf ein Objekt in einem Programm angewendet wird,
    dann wird die Funktion mit den Parametern


