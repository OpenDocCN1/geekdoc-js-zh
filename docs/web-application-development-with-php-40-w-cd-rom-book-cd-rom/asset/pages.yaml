  md: '# 9 Erweiterung von PHP 4.0: Knacken wir den PHP-Kern


    Um beispielsweise die zugewiesene Ressource auf Rückgabewert zu verwer-den, folgen
    Sie Folgend:


    ```

    RETURN_RESOURCE(resource_value);

    ```


    Oder etwas eleganter:


    ```

    return_value->type = IS_RESOURCE;

    return_value->val = resource_value;

    ```


    Wie Sie sehen, werden die Ressourcen im Feld lokal gespeichert.


    Nicht verfend alle Referenzen auf diese Ressource. Sobald keine Refe-anzen auf
    diese Ressource mehr sind, wird der Destruktor aufgerufen, der Sie zuvor für diese
    Ressource registriert haben. Der schöne Nebeneff-die Einstellung ist, dass Sie
    sich nicht um Speicherlich kümmern müssen, die Zuweisungen in Ihrem Modul entstehen.
    Sie registrieren einfach alle Zuweisungen an Ressourcen, die Ihr aufrufendes Skript
    refere-renziert. Sobald das Skript beschließt, dass dies nicht mehr benötigt,
    wird Dies fest und informiert Sie.


    Um eine Ressource explizit aus einer Liste zu entfernen, verwenden Sie die Funktion
    zend_list_delete(). Des Weiteren können Sie genau wissen, dass Sie eine weitere
    Referenz für einen bereits zugewiesenen Ressewert generieren können (z.B. wenn
    Sie einen Standarddatenbanklink wiederverwenden). Für diesen Fall verwenden Sie
    die Funktion zend_list_add(). Um bereits zugewiesene Ressourceinträge zu suchen,
    verwenden Sie zend_list_find(). Die vollständige API finden Sie in zend_list.h.


    Ein kleines Beispiel, das zeigt, wie Sie Ressourcen nutzen, finden Sie auf dem
    CD-ROM.


    # 9.15 Makros zur automatischen Erstellung von globalen Variablen


    Neben den bereits besprochenen Makros gibt es ein einige Makros, mit denen wir
    auf einfache Weise globale Variablen erstellen können. Dies kann sehr nütz-lich
    sein, wenn wir z.B. globale Flags einführen wollen. In der Praxis wird dies zwar
    nicht genau gesehen, aber Tabelle 9.12 beschreibt Makros, die genau dies tun.
    Sie benötigen keine zval-Zuordnung. Wir brauchen lediglich Variablennamenn und
    einen Wert.


    > Hinweis: Alle Makros aus Tabelle 9.12 erzeugen eine globale Variable des Namens
    name mit dem Wert value.'
