  md: '# Beispiel


    Kehren wir zu unserem Hobby-Beispiel zurück. Angenommen, der Benutzer kann zwischen
    verschiedenen Hobbys wählen: Lesen, Programmieren, Schreiben und Wandern. Zunächst
    ordnen wir jedem Hobby einen Bit zu:


    +   -Lesen: 1


    +   - Programmieren: 2


    +   - Schreiben: 4


    +   - Wandern: 8


    In der Binärschweise werden die Werte folgendermaßen dargestellt:


    | Lesen | 0000001 |

    | Programmieren | 0000010 |

    | Schreiben | 0000100 |

    | Wandern | 0010000 |


    Im Programcode können Sie die Hobbys durch eine einfache Bitverschiebung defin:


    ```

    define("HOBBY_READING", 1 << 0);

    define("HOBBY_PROGRAMMING", 1 << 1);

    define("HOBBY_WRITING", 1 << 2);

    define("HOBBY_HIKING", 1 << 3);

    ```


    Wenn der Benutzer nun die Hobbys Schreiben und Programmieren wählt, können Sie
    einen Bitmask erstellen, indem er die beiden in ODER-Schreibweise miteinander
    verknüpfen:


    ```

    $pattern = HOBBY_WRITING | HOBBY_PROGRAMMING;

    ```


    Später können wir überprüfen, ob der Benutzer als Hobby Schreiben gewählt hat,
    indem wir das dazugehörige Bit im Bitmap überprüfen:


    ```

    printf("Writing %s chosen.", (HOBBY_WRITING & $pattern) ? "is" : "is not");

    ```


    Um das Schreiben-Bit auf Null zu setzen, verwenden Sie folgende Weise:


    ```

    $pattern &= ~HOBBY_WRITING;

    ```


    Die Überprüfung der erforderlichen Berechtigungsebene erfolgt durch die Funktion
    $auth->have_perm(). Die Berechtigungsebene, die Sie überprüfen möchten, übergeben
    Sie als Argument. In unserem Beispiel verwenden wir $auth->have_perm("admin"),
    um zu kontrollieren, ob der Benutzer das Privileg admin hat. Wenn der Benutzer
    die erforderliche Berechtigungen hat, gibt die Funktion true zurück, ansonsten
    false.


    Jeden Benutzer werden Privilegien zugeordnet. Bei Verwendung der Funktion Example_Auth
    werden die Privilegien in der MySQL-Tabelle auth_user gespeichert. Sie können
    das Feld Bereich:


    ```

    perms varchar(255)

    ```'
