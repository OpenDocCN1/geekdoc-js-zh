  md: '# Erweiterungsmöglichkeiten


    Zend übernimmtnimmt den kompletten Teil 1 und einen Teil von Teil 2, PHP umfasst
    die Teile 2 und 3. Zusammen bilden sich das vollständige PHP-Paket. Zend selbst
    bildet nur den Sprachkern, der PHP mithilfe von einigen vordinierten Funktionen
    in seiner grundlegend Formiert. PHP enthält alle Module, welche die hervorragenden
    Fähigkeiten der Sprache realisiert.


    Die folgenden Abschnitte beschreiben, an welchen Stellen PHP erweitert wird und
    wie dies geschieht.


    # 9.3 Erweiterungsmöglichkeiten


    Wie in Abbildung 9.1 gezeigt, kann PHP hauptsächlich auf drei Punkten erweitert
    werden: an den externen Modulen, den eingebauten Modulen und an der Test Engine.
    Diese Option wird in den folgenden Abschnitten erläutert.


    # 9.3.1 Externe Module


    Externe Module können mithilfe der Funktion dl() zur Laufzeit des Skripts geladen
    werden. Funktion lädt ein gemeinsam genutztes Objekt (Shared Object) der Festplatte
    und stellt seine Funktionalität zur Verfügung, bis es gebunden ist. Nachdem das
    Skript beendet ist, wird das externe Mod aus dem Speicher entfernt. Diese Methode
    hat sowohl Vor- als auch Nachteile, wie die folgende Tabelle zeigt:


    | Vorteile | Nachteile |

    |---|---|n| Externe Module erfordern erneutes Kompilieren von PHP. | Die Shared
    Objects müssen jedes Mal geladen werden, wenn ein Skript wird, was die Ausführung
    verlangsamt. |

    | Durch Auslagern bestimmter Funktionen bleibt PHP relativ klein. | Zusätzliche
    Dateien füllen die Festplatte.

    Jedes Skript, das die Funktionalität einer externen Funktion nutzen möchte, einen
    Aufruf von dl() enthalten, oder das Tag extension in php.ini muss modifiziert
    werden (was nicht immer eine gute Lösung ist). |


    In allem eignen sich externe Module hervorragend für die Produkte Dritter, die
    für PHP, benötigt werden, oder für Testzwecke. Um zusätzliche Funktionen schnell
    zu entwickeln, liefern externe Module die besten Ergebnisse. Bei häufiger Nutzung,
    größeren Anwendungen oder komplexeren Codes überwiegen jedoch die Nachteile.'
  merge: -1
  pgno: 368
