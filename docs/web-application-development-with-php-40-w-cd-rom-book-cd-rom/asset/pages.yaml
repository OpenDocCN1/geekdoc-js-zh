    \ einfach implementieren. Die wichtigsten Schlüssel werden Sie aus anderen Sprachen\
    \ kennen:\n\n```\nclass shopping_cart\n{\n  var $item:\n\n  function pick($item,\
    \ $quantity)\n```"
