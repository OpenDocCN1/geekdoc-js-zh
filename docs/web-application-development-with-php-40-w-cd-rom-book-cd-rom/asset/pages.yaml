  md: '# 4.15 DNS-Tricks


    Die Notwendigkeit, Links in einem Programm mit der Sitzungskennungsnummer auszuzeichnen,
    kann wirklich lästig sein. Bei PHP 4.0 gibt es eine Möglichkeit, dies automatisch
    durchzuführen. Bei größeren Websites kann das zu erheblichen Leistungseinbußen
    führen, und diese Methode funktioniert nicht mit PHP 3.0.


    Mölicherweise haben wir eine Lösung für Sie.


    Zunächst die Voraussetzungen: Sie müssen in der Lage sein, den DNS-Daten für Ihren
    Server zu ändern, und der Server, der Sie für diese Art der Sitzungskennummer-Verbreitung
    verenden möchten, braucht eine eigene statische IP. Virtuelle serverbasierte Hostrechner
    funktionieren nicht mehr.


    Sie können diese Anforderungen erfüllen? Gar nicht! Sie sich sich mit Namenserver
    aus, wissen Sie vielleicht, dass bei der DNS-Konfiguration Wildcard-Einträge machen
    können. Einträge innerhalb der Regel willkürlichen Hostnamen auf eine bestimmte
    IP, z.B. folgen den Eintrag, der Anfragen für alles unterhalb von phpwebdev.com
    an die IP 194.242.199.228:


    +   * phpwebdev.com   IN A   194.242.199.228


    Eine Anfrage nach http://this_is_one_cool.domain.phpwebdev.com wird zu der angebenen
    IP umgeleitet. Da der Hostname willkürlich ist, muss der Apache-Server so konfiguriert
    werden, dass er mit IP arbeitet - im Gegensatz zu namens-basierten virtuellen
    Hostverfahren, bei denen der Hostname bekannt sein muss. Unser Apache-Konfiguration
    sieht folgendermaßen aus:


    ```

    <VirtualHost 194.242.199.228>

    ServerAdmin tobias@dev.phpwebdev.com

    DocumentRoot /home/www/htdocs

    ServerName phpwebdev.com

    </VirtualHost>

    ```


    Unser Trick funktioniert auch, wenn der Apache-Haupt dieser Adresse zugeordnet
    ist.


    Das Geheimnis besteht darin, die Sitzungskennnummer im Hostnamen zu verschlüsseln.
    Bei der ersten Anfrage wird das Programm die Sitzungskennnummer erstellt, und
    der Client wird auf die neue URL umgeleitet, die den gekennzeichnet Hostnamen
    enthält. Dies sieht folgendermaßen aus:


    ```

    355lce8828d4fb5c3c1e35ad02caa.phpwebdev.com

    ```


    Der Vorteil liegt klar auf der Hand: Solange Sie in Ihrem Programm relative Links
    verwenden, brauchen Sie sich nicht länger mit der manuellen Änderung von URLs
    herumumzuschlagen!'
