- img_proc: true
  md: 'Des weiteren gibt es noch DCOM, das Distributed-Component-Object-Model-Protokoll,
    das COM-Komponenten für die Welt der verteilten Netzwerkanwendungen bereitstellt.
    Im Prinzip handelt sich hier um ein Protokoll für objektorientierte Prozeduraufrufe,
    die für verteilte modulierte Systeme nötig sind. Auf Windows-Systemen funktioniert
    PHP 4.0 sowohl mit COM als auf anderen Systemen, auf denen COM verfügbar ist (wie
    etwa Apple oder Solaris), funktioniert es leider nicht.


    Der Aufruf der (D)COM-Elemente ist mit PHP 4.0 recht einfach. dafür ein reservierter
    Klassenname, von dem Sie eine Instanz erstellen können, indem Sie den Namen des
    Steuerelements den Konstruktor übergeben. Damit erhalten Sie eine vollständige
    Instanz des COM-Objekts, mit dem Sie Funktionen ausführen oder Eigenschaften setzen
    bzw. lesen können, als ob es um eine PHP-Klasse wäre. Bei Parametern, die sich
    nicht mit der PHP-Syntax ausdrücken lassen (wie beispielsweise ein Punkt oder
    ein Zeichen, in PHP ungültige Zeichen enthalten), können Sie sich mithilfe der
    folgenden Funktionen:


    +   - bool_set(class com_object, string property_name, string property_value)


    +   - Ordnet einen Parameter des COM-Objekts, das in com_object instantiert wurde,
    einen Wert zurück. Alias für diese Funktion sind com_propget() und com_proput().
    Gibt bei erfolgreicher Zuordnung true zurück, ansonsten false.


    +   - mixed_com_get(class com_object, string property_name)


    +   - Gibt den Wert eines Parameters des COM-Objs aus, das in com_object instantiert
    wurde. Alias für diese Funktion ist com_propget(). Gibt entweder den Wert des
    Parameters zurück oder bei einem Fehler false.


    Der Quellencode in Listing 5.4 zeigt die grundlegende Verwendung der COM-Funktion.
    Mithilfe der Komponente Softwing.EDConverter, wird eine Währungsumwandlungsprogramm,
    wird eine Instanz der Klasse erzeugt. Anschließend wird die Methode namens Triangulate()
    aufgerufen und das Ergebnis angezeigt. Viel einfacher geht es nicht...


    ```

    $amount = 1000;               // Amount to be converted

    $curr_from = "DEM";      // ISO currency symbol of original currency

    $curr_to = "ITL";                // Symbol of the target currency

    ```


    ```

    // Instantiate new COM object

    $conv = new COM("Softwing.EDConverter") or die("Unable to instantiate Euro-Converter");

    // Execute a component method on the COM object''s instance

    ```'
