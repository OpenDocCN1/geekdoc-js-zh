  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    Datenbank muss für die Ausgabe zwischengespeichert werden, und durch die ständigen
    Netzwerkbindungen und Datenübertragungen vom Webserver entstehen Verzögerungen.


    Eine Lösung hierfür ist »Streaming HTML«. Diese Option wird zwar nicht offiziell
    unterstützt, funktioniert aber trotzdem. Das Skript, das für die Schnittausgabe
    verantwortlich ist, läuft einfach in einer Endloschleife und sendet den Benutzer
    die HTML-Seite, die der Browser erhält. Wenn etwas an den Zwischenspeicher des
    Servers geladen wird, wird es ausgegeben und sofort als der Browser Informationen
    anzeigt und zeigt die neuesten Daten an. Ein Problem ist dieser Ansatz: HTML-Entitäten
    lassen sich nicht danach unterscheiden. Sie können beispielsweise die Zeilen in
    einer Tabelle nacheinander laden, da der Browser alle Zeilen und Spalten einer
    Tabelle kennen muss, um die endgültige Größe der Tabelle zu bestimmen. Solange
    Sie sich darauf beziehen, Zellen nacheinander auszugeben, und Tabellen nicht zu
    verwenden, wenn Sie alles Ganze trotzdem laden können, funktioniert alles recht.


    Kleine Umwege, wie Streaming-HTML, sind üliche Tricks, die Sie kennen sollten.
    Halten Sie sich über solche Sachen auf dem Laufenden.


    Streaming-HTML hat eine weitere Konsequenz, die einige als Nachteil, andere als
    Vorteil betrachten: Da die Client-Verbindung offen bleibt, muss sie immer einen
    Serverprozess belegen. Diese Verbindung wird verwaltet. Das bedeutet, dass für
    jeden Client mindestens ein Server-Prozess vorhanden besteht, Der Vorteil dieses
    Verfahrens besteht darin, dass es keine Mehrbelastung \>pro Treffer» gibt. Wenn
    der Client ein Dokument anfordert, muss für gewöhnlich ein neuer Prozess erzeugt
    werden. Das Skript, das dieses Dokument generiert, muss geladen, analysiert und
    ausgegeben werden. Abschließend werden die Daten gesendet. Der Serverprozess muss
    im Speicher bleiben, damit das Öffnen eines neuen Prozesses und Laden eines Skriptes
    somit seine Interpretation für jeden Client nur einmal durchgeführt wird. Auf
    Websites, die hunderte von Treffern pro Sekunde halten, ist dies ein klarer Vorteil.
    Jeder Prozess bleibt jedoch Resident und benötigt eigenen RAM. Auf Intel-x86-Systemen,
    die mit Linux, Apache und PHP 4.0 ausgestattet sind, können solche Prozesse bis
    zu 2 MB groß sein. Ein kleiner Server mit minimalem RAM würde vom Swap-Speicher
    ausgeführt – was seinen sicheren Tod bedeutet.


    Haben Sie schon an die Folgen von residenten Prozessen nachgedacht? Wenn nicht,
    denken Sie daran, das das nächste Mal zu tun! Werte Sie die Situation aus.'
