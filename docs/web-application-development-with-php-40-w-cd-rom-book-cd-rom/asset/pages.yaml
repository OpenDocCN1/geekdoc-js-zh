  md: '# MarketPlayer.com


    Diese ausführliche Fallstudie über eine Firma, die PHP in der Praxis in einer
    Serverfarm mit hohem Datenverkehr nutzt, stammt von Ph.D. Eric B. Schneider und
    John E. Jogan von MarketPlayer.com.


    # 8.3.1 Firmenhintergrund


    MarketPlayer.com bietet ein reales Finanztraining für einzelne Investoren, die
    erernen möchten, wie sie an der Börse Geld machen. MarketPlayer.comzeuge zur Börsenwachung
    und Diagrammerstellung, die Institutionsqualität liefern, helfen Investoren ihre
    Investitionsstrategien zu entwickeln; und die risikolosen, spaßigen und aufregenden
    Börsenwettbewerbe ermöglichen Investoren, Investmentportfolio zu handeln und zu
    testen.


    Die Produkte von MarketPlayer.com sind über firmeneigene Website unter www.marketplayer.com
    frei verfügbar, außerdem über strategische inhaltsbezogene Allianzen mit führenden
    Medien, Service Providern und Finanzdienstleistern einschließlich AOL, CNBC, E-TRADE,
    money.com, Computer-Serve, ESEC (Pan-European-Partner), internet.com und anderen.


    MarketPlayer.com beschäftigt sich Mitarbeiter in den Bereichen Marketing, Produktentwicklung,
    Kundenservice und Programmierung. Drei der Programmierer besitzen fundierte Kenntnisse
    in C und PHP, zwei weitere sind begnadete PHP-Programmier.


    # 8.3.2 Die PHP Produkte


    Die von MarketPlayer.com angebotene Produkte lassen sich in zwei grundlegende
    Kategorien unterteilen: quantitative Finanzanwendungen und Simulationsprogramme
    für den Online-Börsenhandel. Um sich bei MarketPlayer.com ständig zu behaupten,
    wie diese Anwendungen und der Inhalt verbessert werden können, um der Konkurrenz
    stets einen Schritt voraus zu sein. MarketPlayer.com ist die einzige Website,
    auf der Investoren Aktienkurse über einen Zwölft-Monatszeitraum verfolgen und
    grafisch darstellen können. Er ist eine Technik, die auch von institutionellen
    Finanzmanagern bevorzugt wird. MarketPlayer.com hat bereits mehrere Patente eingewiesen,
    um zu schützen, wie die Online-Börenspiele funktionieren. Außerdem verfügt MarketPlayer.com
    über ein Expertenteam von Produktentwicklern und nützliche webbasierte Finanzwerkzeuge
    zu entwerfen, welche die Aufgabe haben, den einzelnen Investor zu helfen, das
    notwendige Wissen und die Erfahrungen zu sammeln, in der Gemeinschaft der Investoren
    erfolgreich zu sein.'
