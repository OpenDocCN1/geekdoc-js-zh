  md: '# Versionsverwaltung mit CVS


    Nach ersten Entwicklungsdurchgang sendet John die Datei zum zentralen Datenarchiv
    zurück. Niemand außer die Datei in der Zwischenzeit bearbeitet, braucht er hierfür
    nur einen einzigen CVS-Befehl:


    ```

    john@dev:~home/john/f-api ~ cvs commit f-api.php3

    ```


    Daraus zieht sich der Standardeditor des Systems an – auf dem UNIX-System ist
    er häufig vi; auf Windows Notepad – wartet auf einen Protokolleintrag, der bei
    geänderten Versionen synchronisiert wird. Durch solche Meldungen können andere
    Entwickler exakt beschreiben, welche Arbeiten durchgeführt wurden. Nachrichten
    wie „Datei geändert“ sind nicht sehr hilfreich und sollten daher vermieden werden.
    Verwenden Sie so präzise wie möglich, eine Zusammenfassung Ihrer Arbeit zu geben,
    und denken Sie dabei an die Richtlinien, die in Kapitel 1 „Entwicklungskonzepte“
    für eingebettete Quellkommentare aufgestellt haben. Einige Entwicklungsteams verwenden
    die Protokollnachrichten, um sich den Automatischen über die aktuellen Arbeiten
    zu informieren. In einemtes Beispiel für eine aussagekräftige Protokollnachricht
    ist folgende:


    Fixed bug #42; implemented additional checks on user-data (int, date). See p225


    Im Gegensatz zu anderen Versionskontrollsystemen, wie RCS oder Microsoft Visual
    Source Space, speichert CVS die Dateien, sobald mehrere Entwickler dieselbe zeitzeitig
    bearbeiten können, was in unserem Szenario ein großer Vorteil ist. In unserem
    Szenario könnten sowohl John als Jane die Datei config.php3 gleichzeitig bearbeiten.
    Sobald John eine Datei geändert und wieder im System anmelden möchte, wenn Jane
    bereits geändert und zurückgeschickt hat, erhält er eine Warnung und muss seine
    lokale Kopie aktualisieren, bevor er sie übertragen kann. In einfachen Fällen,
    z.b. wenn John eine Funktion zu Beginn und Jane eine Funktion am Ende der Datei
    bearbeitet, wird CVS die Version automatisch vermischen und John kann die kombinierte
    Version sofort zurückschicken. In anderen Situationen ist eine automatische Vermischung
    nicht möglich. Nicht wir beispielsweise folgende Original als eine Konfigurationsdatei:


    ```

    define("FT_ZIP_ARCHIVE", "ZIP_ARC\); // GZip Archive

    ```


    John ändert die Konstante und schickt die Datei zurück:


    ```

    define("FT_ZIP", "ZIP_ARC\); // GZip Archive

    ```


    Jane verbessert den Kommentar in derselben Zeile:


    ```

    define("FT_ZIP_ARCHIVE", "ZIP_ARC\); // GZip Archive (not PZip compatible!)

    ```'
