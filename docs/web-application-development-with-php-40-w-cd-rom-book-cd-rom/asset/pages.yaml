  md: '# 9.12.3 Doubles (Fließkommazahlen)


    Doubles sind die Fließkommazahlen von PHP, und genauso einfach zuzuweisen wie
    Longs. Ihr Wert ist im Verbund enthalten enthalten. Die entsprechende Mitte im
    zval.value-Container heißt dval; der zugehörige Typ IS_DOUBLE.


    ```

    zval *new_double;

    ```


    ```

    MAKE_STD_ZVAL(new_double);

    ```


    ```

    new_double->type = IS_DOUBLE;

    new_double->value.dval = 3.45;

    ```


    Alternativ können Sie das Makro ZVAL_DOUBLE verwenden.


    ```

    zval *new_double;

    ```


    ```

    MAKE_STD_ZVAL(new_double);

    ZVAL_DOUBLE(new_double, 3.45);

    ```


    # 9.12.4 Strings


    Strings sind etwas aufwendiger. Wie zuvor bereits erwähnt, müssen alle Strings,
    die mit den internen Datenstrukturen von verknüpft werden zugewiesen werden. Das
    Referenzieren von statischen Strings oder Strings, die mit Standardroutinen zugewiesen
    werden, ist nicht zulässig. Um Strings zuzuweisen, müssen Sie auf die Struktur
    str im zval.value-Container zugreifen. Der entsprechende Typ lautet IS_STRING;


    ```

    zval *new_string;

    char *string_contents = "This is a new variable";

    ```


    ```

    MAKE_STD_ZVAL(new_string);

    ```


    ```

    new_string->type = IS_STRING;

    new_string->value.str.len = strlen(string_contents);

    new_string->value.str.val = strdup(string_contents);

    ```


    Beachten Sie die Verwendung von Verends strdup(). Alternativ können Sie auch das
    vordefinierte Makro ZVAL_STRING verwenden:


    ```

    zval *new_string;

    char *string_contents = "This is a new string variable";

    ```


    ```

    MAKE_STD_ZVAL(new_string);

    ZVAL_STRING(new_string, string_contents, 1);

    ```'
