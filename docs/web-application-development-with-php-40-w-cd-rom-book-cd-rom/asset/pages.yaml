  md: '# 4 Webanwendungskonzepte


    Viele Webanwendungen überprüfen bereits den Inhalt, der von einem Benutzer statt
    einem anderen Benutzer zur Verfügung gestellt wird. Sie werden in einem Nachrichtenbrett
    finden, in dem sich `<script`-Tags oder ähnlichen HTML-Code eingeben können. Entwickler
    machen häufig den Fehler, diese Art von Daten zu überprüfen und vernachlässigen
    dabei, die nur vom Client benötigt werden. Warum ein Benutzer böswilligen Programmcode
    eingeben, denn nicht der Benutzer sicher?


    Der Punkt ist, dass die »Infizierung« eines Programms mit einem Skript- oder HTML-Code
    eine ernsthafte Vertrauensverletzung darstellt. Der böse Code wird der Sicherheitsüberprüfung
    des Programms ausgeführt, er scheint ja vom Programm selbst zu kommen.


    Häufig beginnt Benutzer beim Eingeben von Inhalten, der ursprünglich für die Augen
    anderen waren: Nehmen wir an, Sie haben eine Suchmaschine errichtet. Ein Beispiel:
    `<script>alert(\Hello World")</script>` konstruiert. Ein Benutzer gibt einen Schlüsselbegriff
    ins Web ein, und die Suchmaschine macht ihn dabei. Derlei zeigt sich nun, dass
    nur der Benutzer, der die Suche gestartet hat, in den Schlüsselbegriffen bestimmte
    Zeichen zu kodieren gesattet. Ein Benutzer könnte `<script>alert(\Hello World")</script>`
    als Schlüsselbegriff eingeben und bekä im Browser eine JavaScript-Nachricht angezeigt
    (sofern JavaScript aktiviert ist). Solange der Benutzer die Begriffe lediglich
    eingibt, gibt es keine Probleme. Das Schlimmste, was passieren kann, ist dass
    ihr eigener Browser von Fehlern in JavaScript abstürzt.


    Dort waren Sie. Warum wollen Benutzer nicht andere auf die Ergebnisse einer bestimmten
    Suche hin, die sie für nötig halten erwachten. `phpwizard` findet beispielsweise
    ein Formular, das automatisch nach allen PHP-verwendeten Büchern durchsuch.


    Nun wird die Sache haarig. Ein Hacker kann über öffentliche Websites einen Link
    zu Suchgebnissen für den Begriff `<script>alert(\Hello World")</script>` haben.
    Alle Benutzer, die diesen Link nutzen oder das Suchformular abschicken, erhalten
    die gesamte »Hello World»-Nachricht als Popup-Alarm auf ihrem Browser. Man kann
    natürlich noch viel gefährlichere Dinge tun, wie Nachrichten auf dem Bildschirm
    zu bringen. Wenn wir wenig erwarten, können wir PHP als Suchmaschine für eine
    E-Commerce-Website verwenden, die eine eigene Sitzungsverwaltung verwendet und
    die Sitzungsnummer speichert. Wenn wir nun von einem intelligenten Hacker ausgehen,
    der erstelle eine »Hello World»-Nachricht ein anderes JavaScript verwendet, um
    die Cookie-Daten zu lesen, die er dann an seine Website schickt. Dort wartet er
    auf ankommende Sitzungsnummern, übernimmt die Sitzungen der anderen Benutzer und
    kauft ein ein paar Netzwerk für die Leute unter `phpwizard.net`.'
