  md: '# 7 Anwendungen der Spitzentechnologie


    speicher eine eigene Struktur generiert. Anstatt bestimmte Ereignisse zu reagieren,
    arbeiten Sie mit dieser Struktur, um das Dokument zu verarbeiten. Während regelbasierte
    Parser ein XML-Dokument in kleinen Teilen lesen und den Speicher für die Analyse
    zu reduzieren, welche gleichmäßig die Leistungsfähigkeit steigern, DOM-Parser
    eine Darstellung des Dokuments im Speicher erzeugen. Dafür wird mehr Speicherkazität
    benötigt. Bedenken Sie, wenn Sie mit großen Dokumenten arbeiten.


    Die DOM-Ebene 1.0 wurde im Oktober 1998 von der (zwischen wahrscheinlich) W3C-Organisation
    als Standard (W3C-Empfehlung) definiert. Mölicherweise hat sie bereits in einem
    anderen Kontext von DOM-Standard gehört. Dieser Begriff wird allgemein verwendet,
    um das Objektmodell von HTML-Seiten zu beschreiben, welches mit JavaScript zugegriffen
    werden kann. Um beispielsweise den Wert eines Formularfeldes zu finden, können
    Sie JavaScript-Programme verwenden:


    ```

    fieldvalue = document.form.myfield.value;

    ```


    Beachten Sie die hier Anweisung. Dokument ist das Stammelelement, während myform
    ein HTML-Formular kennzeichnet, in welchem myfield ein Textfeld ist. Generiert
    ist das HTML-DOM eine Erweiterung des Kern-Objekt-Modells, das mit W3C entwickelt
    wurde. Der DOM enthält die Funktionen, die für XML-Dokument verwendet werden.
    Außerdem ist er als Grundlage für das HTML-DOM. Er besteht aus einer Sammlung
    von Objekten, die für den Zugriff und die Bearbeitung von Daten und Auszeichnungen
    in einem XML-Dokument benutzen können. Er dient zur Definition folgende Punkte:


    +   - eine Reihe von Objekten zur Darstellung der kompletten Struktur dieses XML-Dokuments

    - eines Models für die Kombinationsmöglichkeiten dieser Objekte

    - eine Schnittstelle für den Zugriff und die Überarbeitung dieser Objekte


    Durch Durchstrahlung des Dokuments ist der DOM eine Baumstruktur, welche die Beziehung
    von Eltern- und Tochterknoten aufzeigt, welche Methode getAttribute() für die
    Knoten. Kurz, stellt DOM eine standardobjektorientierte und versionsstrukturähnliche
    Schnittstelle für XML-Dokumente zur Verfügung.


    Die DOM-Spezifikation ist unabhängig von einer Programmiersprache. Sie empfiehlt
    die Entwicklung einer objektorientierten Anwendung, wozu eine Sprache mit mindestens
    einfachen objektorientierten Funktionen erforderlich ist. Sie definiert eine Reihe
    von Knotentypen (NodeTypes), die zusammen das vollständige Dokument bilden. Eine
    Knotentypen haben möglicherweise Tochterknoten, andere Blatnoten, unter denen
    keine Knoten folgen. Auf diese Knotentypen werden wir im Folgenden ausführen,
    die sie in der ursprünglichen W3C-Spezifikation hervorgehob'
