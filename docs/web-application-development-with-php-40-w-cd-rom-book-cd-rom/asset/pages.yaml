  md: '# Einführung


    In der Antike versuchten die alten Meister nicht, die Menschen zu erziehen, sondern
    brachten ihnen bei, nicht zu wissen.


    Der Erfolg der Open Source-Software, wie Linux oder Apache, wurde in allen großen
    Medien ausführlich dokumentiert. Trotzdem blieb Aufstieg von PHP größenteils unbemerkt.
    Gemäß einer E-Soft-Umfrage (www.esofting.com/survey/) ist die Web-Skript PHP immer
    noch das verbreitteste Modul für den PHP-Webserver. Netcraft-Studien haben ergeben,
    dass PHP über 6% aller Web-Domänen in der Welt (siehe www.netcraft.com/survey/)
    verwendet wird. Dies ist eine unglaublicliche Marktdurchdringung für ein so spezialisiertes
    Produkt. die Beliebtheit steigt weiter an. Dies zeigt sich verstärkt in den traditionellen
    Medien. Bis zum Mai 2000 wurden über 20 Bücher in verschiedenen Sprachen veröffentlicht,
    und weitere sind in Vorbereitung.


    Immer mehr Anbieter setzen den Zug auf PHP als Webserver ein, zum Beispiel C2''
    Stronghold und Linux-Distributionen. Eine neue Firma namens Technologien wurde
    gegründet, die kommerzielle AddOns und Unterstützung für PHP benötigen. Eine lange
    Liste von großen Websites nutzen PHP ebenso wie Hunderttausende kleinerer Websites.


    Für uns Autoren begann dieses Buch im Juni 1999, als New Riders Publishing mit
    der Bitte an uns herantrat, ein Buch über das erweiterte PHP zu schreiben. Die
    Idee, ein PHP-Buch zu schreiben, geisterte bereits seit einiger Zeit uns in unseren
    Köpfen herum, und das Angebot von New Riders kam sehr wohl gelegen.


    Nach 1.500 Ideen, 500 überarbeiteten Dateien und unzähligen Stunden im IRC waren
    es schließlich fertig. Was Schwerarbeit, aber ich glaube, das Ergebnis ist mehr
    als nur ein Referenzhandbuch. Wir haben uns darauf versucht, einen bloßen Überblick
    über die PHP-Funktionen zu geben, sondern versucht, die Konzepte zur Entwicklung
    von Webanwendungen zu erklären.


    Die Entwicklung von unerfahrenen Programmierer, der keine oder nur eine gefährliche
    Ausbildung haben, bis zum Software-Entwicklungsexperten geschieht in mehreren
    Schritten. Der Programmierer beginnt Karriere als Lehrling. Zu diesem Zeitpunkt
    interessiert er sich in der Regel noch nicht für Programmierstile, Planung oder
    Testphasen – unleserlicher Code, fehlende Sicherheit und lange Hacker-Nächte sind
    in dieser Phase typisch. Möglicher kennt der Programmierer alle Tricks und versteckten
    Funktionen einer Programmiersprache, aber er hat Probleme bei der Entwicklung
    und Daten'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'pflege im Team und mit größeren Projekten. An diesem Punkt können Sie leicht
    erkennen, wer wirklich das Zeug zu einem guten Programmierer hat. Dieser stellt
    sich folgende Fragen:


    +   - Wie kann ich damit umgehen, dieselben Funktionen immer von neu einben zu
    müssen?


    +   - Welche Vorkehrungen muss ich treffen, um meine Anwendung sicher und stabil
    zu machen?


    +   - Was muss ich, damit meine Anwendung leichter zu pflegen ist?


    +   - Wie können mehrere Leute effizient im Team zusammenarbeiten?


    An dieser Stelle kommt unser Buch ins Spiel. Wir hoffen, Software-Entwicklern
    Richtlinien für eine bessere Entwicklung von PHP und Webanwendungen geben zu können.
    Heute sind viele Technologien verfügbar. Diese können Sie nur sinnvoll nutzen,
    wenn Sie die grundlegenden Prinzipien verstehen, die hinter dem Entwicklungsprozess
    stehen und wenn Sie Problemlösungsstrategien entwickeln. Typische Referenzhandbücher
    helfen bei diesen Fragen nicht weiter.


    # Zielgruppe


    Wenn Sie Programmier-Laie sind, ist dieses Buch nicht für Sie geeignet. Nutzen
    werden Sie wahrscheinlich in einem der folgenden Fälle aus diesem Buch ziehen
    können:


    +   - Sie haben bereits Anwendungen mit PHP entwickelt und möchten Ihre Fähigkeiten
    ausbauen.


    +   - Sie haben Erfahrung mit anderen Programmiersprachen und möchten Webanwendungen
    mit PHP entwickeln.


    +   - Sie sind PHP-Experte und möchten Ihre PHP-Kenntnisse erweitern.


    Sie müssen kein PHP-Guru sein, um dieses Buch zu lesen, aber Sie sollten der Syntax
    von PHP vertraut sein oder sich mit Programmierprinzipien ausk.


    # Voraussetzungen


    Dieses Buch geht davon aus, dass Sie eine funktionierende PHP-Installation haben,
    vorzugsweise PHP 4.0 oder höher. Aufgrund seiner Beliebtheit verwenden wir bei
    Bedarf das Datensystem MySQL. Da Plattformabhängigkeit eine der stärksten Vorteile
    von PHP ist, sollten unsere Beispiele sowohl unter UNIX als auch unter Windows
    laufen.'
