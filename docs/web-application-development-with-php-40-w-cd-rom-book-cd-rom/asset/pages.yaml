    \ verwenden Sie das Makro ZEND_MINIT. |\n| module_shutdown_func | Diese Funktion\
    \ wird bei der Modul-Deinitialisierung einmal aufgerufen, und kann für einmalige\
    \ Deinitialisierungsschritte verwendet werden (wie etwa die Aufhebung einer Speicherzuweisung).\
    \ Sie bildet das Gegen zu `module_startup_func()`. Bei einem Fehler während der\
