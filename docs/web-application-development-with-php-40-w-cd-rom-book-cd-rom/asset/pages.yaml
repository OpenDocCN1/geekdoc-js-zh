  md: '# Pearson Education

    4 Webanwendungskonzepte

    ADDISON-WES


    +   - Verwenden Sie für die Benennung von Schaltflächen und Verknpfungen ein konsistentes
    Namenssystem.


    +   - Verwenden Sie ein konsistentes Mittel, um den Status eines Dialogs zu ändern.
    Platzieren Sie beispielsweise die Schaltfläche beim Abschicken eines Formulars
    stets in die unterrechte Ecke.


    +   - Erfinden Sie kein neues grafisches Steuerelement, welches nicht notwendig
    ist. Eine Website, die wir überprüfen, verwendet beispielweise Bilder statt von
    HTML-Kontrollboxen. Klicken auf ein Bild würde die Seite mit einer leichten Änderung
    des Kontrollststes neu geladen (statt nach vorherigem Status aktiviert oder deaktiviert).
    Ein langfristigeres Verfahren ist wohl genug.


    Ist es benutzpezifisch?

    »Personenspezifische Inhalte“ – das ist eines Schlagworte im Internet. Wir meinen
    damit nicht, wie die Marketingabteilung, die personenspezifische Werbung, personenenspezifische
    Spamamails oder personenenspezifische Nachrichten anspricht. Für uns bezieht sich
    der Begriff „Webanwendungen“ einfach auf Programme, die auf die Bedürfnisse und
    die kulturellen Eigenschaften individueller Benutzer zugeschnitten sind.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_211_0.png)


    Abbildung 4.3: Das UPS-Versandkostenberechnungsprogramm akzeptiert vom Ursprungsland
    für ein Paket nur die USA und Puerto Rico, wenn UPS aus über 50 Ländern Pakete
    verschickt.


