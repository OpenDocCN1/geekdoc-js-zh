  md: 'Dies ist die allererste Syntaxdefinition in der XML-Spezifikation. Sie definiert
    die grundlegende Struktur eines XML-Dokuments. Die verwendete Notation wird als
    »weiterte Backus-Naur-Form oder EBNF bezeichnet. Sobald Sie die Grundlagen von
    EBNF verstanden haben, werden Sie Spezifikation viel einfacher verstehen.


    EBNF ist eine einfache Methode, um die Syntax einer Programmiersprache zu definieren,
    die halt eindeutig festlegt, was erlaubt oder zulässig ist. Sie wird in vielen
    anderen Standards verwendet, wie etwa Protokoll- oder Datenformaten, sowie in
    einigen Ausdruckssprachen, wie XML oder SGML. EBNF ermöglicht eine vollständige
    und eindeutige Grammatikdefinition. Deshalb gibt es einige Softwares, die die
    Reihe von EBNF-Regeln in einen Parser umwandeln. Programme, die dies tun, werden
    Compiler generiert. Der bekannteste von ihnen ist YACC (Yet Another Compiler),
    aber es gibt noch Reihe weitere.


    Sie können EBNF als eine Reihe von Regeln, die sogenannten Produktionen oder Produktionsregeln,
    betrachten. Jeder Regel beschreibt einen Teil der Syntax. Sie beginnen bei einem
    Startsymbol (traditionell mit S bezeichnet) und definieren anschließend Regeln
    dafür, wodurch dieses Symbol ersetzen können. Schritt für Schritt entsteht eine
    komplexe Grammatik, die sich aus den Zeichenfolgen zusammensetzt, die Sie produzieren,
    wenn Sie Regeln beben.


    Wenn Sie noch einmal das Beispiel betrachten, stellen Sie fest, dass es sich um
    eine Zuordnung handelt. Ein Symbol auf der linken Seite, ein Zuordungsoperator
    (der auch in Form von := geschrieben werden kann) und eine Liste der Werte auf
    der rechten Seite. Sie arbeiten die Zuordnungen so lange ab, bis es auf der linken
    Seite keine Symboldefinitionen mehr gbt. Danach soll auf der rechten Seite der
    Zuordnung kein Symbol mehr stehen, nur noch die endgültige Zeichenkette, die ein
    atomar Wert ist.


    EBNF definiert zwei Operatoren, die möglicherweise schon aus regulären Ausdrucken
    können:


    | Operator | Bedeutung |

    | ? | optional |

    | + | muss einmal oder mehrmals erscheinen |

    | * | muss nullmal oder mehrmals erscheinen |


    Zur Definition der Sprachgrammatik mit der Sie Fließkommazahlen ver-den können,
    sähe die EBNF-Notation folgender aus:


    ```

    S := SIGN? D+ ( D+)?nD := [0-9]

    SIGN := "+"|"-"

    ```'
