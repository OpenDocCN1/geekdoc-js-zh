  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    +   * Alle Daten können von einem zentralen Punkt des Programs transparent an
    alle Empfänger abgesetzt werden. Sie müssen sich nicht darum kümmern, Strukturen
    manuell zu kopieren und umzuwandeln. Die einzelnen Ereignissignale stellen sich
    sicher, dass sich Ihre Daten erhalten.


    +   * Neue Programcode lässt sich extrem leicht in das Programm einfügen, indem
    sich eine Prozedur schreiben, die sich selbst bei dem entsprechenden Ereignis
    registriert.


    Sobald der große Rahmen für die Ereignisabwicklung erstellt wurde, kann die gesamte
    Anwendung generiert werden, indem Sie Routinen, Routinen und noch einmal Routine
    schreiben.


    Machen Sie sich mit den Verfahren vertraut, die zur Implementierung von Finite-State-Maschinen
    erforderlich sind. Diese sind für die Programmierung und allgemeine Informationsverarbeitung
    elementar.


    Glücklicherweise enthält phpIRC bereits einen Rahmen für die Ereignisabwicklung,
    so dass diese Programmierung für unser Projekt einfach erhalten bleibt.


    # 3.5.1 Struktur der Schnittstelle


    phpIRC bildet den IRC-Client-Tier des Programs. Es ist für die gesamte Netzwerkkommunikation
    verantwortlich. Dies bedeutet, dass es stets die Netzwerknachrichten kontrollieren
    muss, um rechtzeitig auf Netzwerknachrichten reagieren zu können. Wenn die nachrichtenverenden
    Funktionen von phpIRC nur gelegentlich aktiviert würden, könnte ein sicherer,
    zuverlässiger und schneller Datenaustausch nicht mehr gewährleistet werden. Aus
    diesem Grund erzwingt phpIRC eine bestimmte Programmstruktur, wie Abbildung 3.6
    zeigt.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_141_0.png)'
