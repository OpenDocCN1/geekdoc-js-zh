    Die Arrayeinträge sind Instanzen der Klasse element, die vier Eigenschaften haben
    (Klassenvariablen).


    | Eigenschaft | Beschreibung |

    | --- | --- |

    | count | Häufigkeit, mit welcher Element im Dokument gefunden wurde |

    | chars | Anzahl der Bytes von Zeichendaten in diesem Element |

    | parents | Elternelemente |

    | childs | Tochterelemente |


    Wie Sie sehen, ist kein Problem, Klasseninstanzen in einem Array zu speichern.


    > Tipp: Eine spezifische Sprachfunktion von PHP ist, dass Sie Klassenstrukturen
    mit der Schleife while(list($element = each())), wie wir in Kapitel 1 »Entwicklungskonzepte»
    vorgestellt haben, genau so durchsuchen können, associative Arrays. Sie gibt alle
    Klassenvariablen und die Namen von Methoden als Zeichenketten aus.


    Jedes Mal, wenn ein Element gefunden wurde, wird das Element in dem entsprechenden
    elements im Array-Eintrag hochgesetzt. Im Eintrag des Elternelemente (Elterner
    bezieht sich auf das zuletzt geöffnete Element) wird der Name des aktuellen Elements
