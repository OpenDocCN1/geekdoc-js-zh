  md: '# 9.11.5 Verarbeitung von Argumenten, die durch Referenz übergeben wurden


    Wenn Ihre Funktion Argumente annimmt, die durch Referenz übergeben wurden und
    Sie diese ändern möchten, müssen Sie einige Vorkehrungen treffen.


    Bisher nicht erwähnt haben, dass wir unter bisher beschriebenen Umständen ohne
    Zugriff auf zval-Container haben, die Funktionsparameter spezifizieren, an Sie
    übergeben. Natürlich können sie jedes zval-Container ändern, den sie innerhalb
    ihrer Funktion erzeugt haben. Sie dürfen jedoch niemals zval ändern, wenn auf
    zend-Interne Daten referieren!


    Wir haben bisher sogenannte ''*ex()''-API referiert. Sie haben möglicherweiseweise
    bemerkt, dass die API-Funktion, die wir verwenden, nicht zend_get_parameters(),
    sondern zend_get_parameters(ex) bzw. nicht convert_to_long()() lautet. Die *ex()''-Funktionen
    die oben genannten sind ''erweiterte'' Zend-API. Sie bieten eine leichte Geschwindigkeitserhöhung
    gegenüber der alten API, sind aber nur für die Bereitstellung eines Nur-Level-Zugriffs
    gedacht.


    Da Zend mit Referenzen verschiedene Variablen möglicherweise auf denselben Zeiger
    referenzieren. Der Schreibzugriff auf einen zval-Container voraus, dass dieser
    Container einen separaten Wert enthält, d.h. auf einen Wert, der nicht von einem
    anderen Container referziert wird. Wenn Sie mit anderen Containern auf einen zval-Container
    referenzieren und die referenzierte zval ändern, müssen sich automatisch der Inhalt
    der anderen Container ändern, die auf diesen zval referenzieren (die Sie einfach
    auf den geänderten Wert und auch ihren eigenen Wert ändern).


    zend_get_parameters_ex() kümmert sich um diese Situation. Die Funktion gibt einfach
    einen Zeiger auf den gewünschten zval-Container aus, ob sie auf Referenzen bestehen
    oder nicht. Die entsprechende Funktion der traditionellen API zend_get_parameters()
    prüft so, ob referenzierte Werte vorliegen. Wenn sie eine Referenz injiziert,
    erzeugt sie einen neuen zval-Container, kopiert die referenzierten Daten in diesen
    neuen zugewiesenen Speicher und gibt einen Zeiger auf den neuen referierten Wert
    aus.


    Dieser Vorgang zval-Separation (oder pval-Separation). Da die ''*ex()''-API keine
    zval-Separation durchführt, ist zwar etwas einiger Schritt, verhindert einen Schreibzugriff.


    Um Ändern der Parameter benötigen Sie jedoch einen Schreibzugriff. Zend löst dieses
    Problem auf eine spezielle Weise: Sobald eine Funktion durch Referenz übergeben
    wird, wird automatisch eine zval-Separation'
  merge: -1
  pgno: 403
