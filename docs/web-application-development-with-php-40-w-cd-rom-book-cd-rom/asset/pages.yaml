  md: '# Associative Arrays


    Wie Sie hier sehen, ist hier nur ein Zeichen anderes: das Ampersand (&), das im
    vorherigen Programcode fehlte. Dieses, als Funktionsparameter vorgestellte Zeichen
    gibt an, ob er zur Referenz übergeben wurde.


    > Hinweis: Um ein Ampersand (&) einzufügen, müssen Sie die Stelle ändern, in welcher
    die Funktion aufgerufen wird. PHP wandelt Parameter automatisch in Referenzen
    um, wenn er eine Funktion findet, der Parameter auf diese Weise übergeben möchte.


    Bei der Änderung von $ calculate() wird die lokale Kopie von $, nicht verändert,
    dass dies wird durch den Zugriff auf die globale Speicher von $ die Änderung durchgeführt
    wird. Wichtiger ist, dass die Änderungen, die an $ vorgenommen wurden, bei Beendigung
    der Funktion nicht verloren gehen, was Arbeiten mit einem lokalen Speicher nicht
    funktionieren.


    Die Parameter Übergabe über Referenz ist häufig eine nützliche Methode, wenn sie
    mehr als einen Wert ausgeben möchten oder Variablen durch mehrfachen Aufruf auf
    eine Funktion einmal wieder wollen, um eine komplexe Berechnung in einem Durchgang
    durchzuführen. Sollten es jedeweisung, Strukturen aufzuspleitten und in Parameter
    zu zwingen, wenn Sie die Daten genau direkt in eine Struktur zurückzugeben könnten.
    Überstrapazieren Sie diese Art von Parameter jedoch nicht. Diese Maßnahme sollte
    wirklich eine Ausnahme bleiben, denn sie ist keine ganz saubere Programmierpraxis
    (Funktionen ändern ihre Parameter normalweise auf globaler Ebene, auch wenn es
    die Dinge häufig erleichtert und sich manchmal hässliche Fehler ein), auch wenn
    Dinge häufig clever Tricks anwenden.


    Ein mögliches Beispiel ist die »automatische« Aktualisierung sogenannter »Laufvariablen.
    Laufvariablen sind Variablen, die Werte während einer algorithmischen Schleife
    ändern. Ein konkretes Beispiel, das hier profitiert, ist der `for()`-Anweisungen.
    Der Run-Längen-Kodierungsalgorithmus (RLE), der bekannt ist, da er in Format wie
    Zost''s PCX Bitmap verwendet wird (und noch verwendet).


    Der RLE-Algorithmus ist ein Komprimierungsalgorithmus, der von der Sache profitiert,
    dass viele Farbbilder mit niedriger Auflösung dieselben Bytes wiederholt (insbesondere
    Bitmaps, die nur zwei Farben – schwarz und weiß – enthalten). Wenn wir einmal
    diese Darstellung eines einfachen Rechtecks:'
