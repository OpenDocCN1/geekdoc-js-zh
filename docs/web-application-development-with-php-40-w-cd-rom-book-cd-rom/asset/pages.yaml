  md: "# 4 Webanwendungskonzepte\n\n```\nfunction session_start_from_rewrite()\n{\n\
    \  global $HTTP_HOST, $REQUEST_URI;\n\n  ereg(\"([0-9a-z]{2})\", $REQUEST_URI,\
    \ $sgs);\n  $session_id = $sgs[1];\n\n  if(!isset($session_id) || empty($session_id))\
    \ {\n    rand((double)microtime()*10000000);\n    $session_id = md5(uniqid(rand()));\n\
    \n    $destination = \"http://$HTTP_HOST/$session_id$REQUEST_URI\";\n    header(\"\
    Location: $destination\");\n  }\n\n  session_id($session_id);\n  session_start();\n\
    }\n```\n\nBei allen Anfragen der Browser davon aus, dass die Sitzungskennennummer\
    \ in der URL enthält: er wird bei jeder Anfrage die Sitzungskennnummer automatisch\
    \ senden. Es ersart sich die Mühe, alle Verknüpfungen selbst zu ändern, jedoch,\
    \ wenn Sie Verknüpfungen in Ihrem Programm verändern. Wenn Sie absolute URL-Pfade\
    \ verwenden (z.B. /directory/script.php), müssen Sie diese trotzdem manuell ändern.\n\
    \n# Dynamische Pfade mit PHP 4.0\n\nDie automatische Änderung des URL ist eine\
    \ der wirklich phantastischen Funktionen von PHP 4.0. Um sie zu aktivieren, müssen\
    \ PHP mit --enable-trans-id neu konfigurieren und er wird die Sitzungskennnummer\
    \ in der Form session-id=>session-id automatisch in allen realen Verknüpfungen\
    \ auf Ihren PHP analysierten Seiten eingefügen.\n\nNicht für Hochleistungs-Websites\n\
    Auch wenn eine praktisch ist, sollten Sie diese mit Vorsicht bei Hochleistungs-Websites\
    \ einsetzen. PHP muss auf jeder einzelnen Seite sehen, diese analysieren, um festzustellen,\
    \ ob sie relative Links enthält, und schließlich die den Links hinzufügen. Dies\
    \ hat natürlich Auswirkungen auf die Leistung. Wir empfehlen statt mod_rewrite\
    \ oder DNS-Tricks zu verwenden.\n\nAuf die Verbreitung der Sitzungskennummer in\
    \ realen Anwendungen gehen wir später ein. Zunächstst möchten wir Ihnen eine weitere\
    \ Methode der Sitzungskennummer-Verteilung vorstellen, die wohl die spektakulärste\
    \ ist."
