- img_proc: true
  md: "# 9.10.4 Deklarationen des Zend-Funktionsblocks\n\nNachdem Sie die exportierenden\
    \ Funktionen deklärt haben, müssen Sie diese für Zend einführen. Die Einführung\
    \ der Funktionsliste geschieht über einen Array von zend_function_entry. Dieser\
    \ Array enthält alle Funktionen, die bereitgestellt werden sollen, außer denen\
    \ der Funktionsname angegeben ist, wie er in PHP erstellt soll, und der Name,\
    \ der in der C-Quelle definiert ist. In Zend wird zend_function_entry in Listing\
    \ 9.5 gezeigt.\n\n```\ntypedef struct_zend_function_entry {\nchar *fname;\n void\
    \ (*handler)(INTERNAL_FUNCTION_PARAMETERS);\n unsigned char *func_types;\n} zend_function_entry;\n\
    ```\n\nListing 9.5: Interne Deklaration von zend_function_entry\n\nDie folgende\
    \ Tabelle beschreibt die Einträge:\n\n| Eintrag | Beschreibung |\n| --- | ---\
    \ |\n| fname | Gibt den Namen an, wie er in PHP gesehen wird (z. B. fopen, mysql_connect\
    \ in unserem Beispiel first_module). |\n| handler | Zeiger auf die C-Function,\
    \ die für die Verwaltung von Aufrufen dieser zuständig ist, siehe z.B. das zuvor\
    \ besprochene Standardmarker INTERNAL_FUNCTION_PARAMETERS. |\n| func_arg_types\
    \ | Ermöglicht, bestimmte Parameter zu markieren, so dass sie per Referenz übergeben\
    \ werden müssen. In der Regel sollten diese einen Eintrag auf NULL setzen. |\n\
    \nIm Beispiel sieht die Deklaration folgendermaßen:\nzend_function_entry firstmod_module[]\
    \ =\n\n```\n{\nZEND_FE(first_module, NULL)\n{NULL, NULL, NULL}\n};\n```\n\nWie\
    \ Sie sehen, muss der letzte Eintrag in dieser Liste stets {NULL, NULL, NULL}\
    \ sein. Dieser Marker muss gesetzt werden, damit Zend weiß, wann das Ende der\
    \ Liste der exportierten Funktionen erreicht.\n\n> Hinweis: Die vordefinierten\
    \ Makros können Sie nicht für die Exportierung verwenden, da diese versuchen würden,\
    \ eine Funktion namens »NULL« zu referenzieren!"
  merge: -1
  pgno: 385
- img_proc: true
  md: 'Das Makro ZEND_FE wird zu einen Struktureintrag in zend_function_entry expandiert.
    Beachten Sie, dass dieses Makro ein spezielles Namensschema für Ihre Funktionen
    einführt. Ihre C-Funktionen haben das Präfix zend_if_. Demnach referenziert ZEND_FE(firstmodule)
    auf eine C-Function namens zend_if_first_module(). Behalten Sie dies im Hinterkopf,
    wenn Sie Makros und manuell kodierte Einträge nutzen möchten (was keine gute Praxis-xis
    zeigt).


    **Tipp:** Kompilierungsfehler, die auf Funktionen `zend_if_**` verweisen, beziehen
    sich auf Funktionen, die mit ZEND_FE definiert wurden.


    Tabelle 9.2: eine Liste aller Makros, die Sie zur Definition von Funktionen verwenden
    können.


    | Makroname | Beschreibung |

    | --- | --- |

    | ZEND_FE (Name, Arg_typen) | Definiert einen Funktionseintrag des Namens *Name*
    in *zend_function_entry*. Benötigt eine entsprechende C-Function. *Arg_typ* muss
    NULL gesetzt sein. Diese Funktion verwendet eine automatische Generierung von
    C-Funktionsnamen, durch Vorstellung des Präfixes `zend_if_` vor den PHP-Funktionsnamen.
    ZEND_FE(first_module) führt beispielsweise die Funktion `module()` in PHP ein
    und verknüpft sie mit der C-Function `zend_if_first_module()`. Verwenden Sie dieses
    Makro in Verbindung mit ZEND FUNCTION. |

    | ZEND_NAMED_FE (PHP, Name, Arg_typen) | Definiert eine Funktion, die über den
    PHP Name für PHP verfügbar ist, und verknüpft sie mit der C-Function Name. *Arg_typ*
    muss NULL gesetzt sein. Verwenden Sie diese Funktion, wenn Sie das ZEND_FE eingeführte
    Namenspräfix nicht verwenden möchten. Verwenden Sie dieses Makro in Verbindung
    mit ZEND_NAMED_FE. |

    | ZEND_FALIAS (Name, Alias, Arg_typen) | Definiert einen Alias *Alias* für *Name*.
    *Arg_typ* muss NULL gesetzt sein. Benötigt keine entsprechende C-Function, referenziert
    statt des Aliasials. |

    | PHP_FE(Name, Arg_typen) | Alte PHP-API, äquivalent zu ZEND_FE |

    | PHP_NAMED_FE (Laufzeit_name, Name, Arg_typen) | Alte PHP-API, äquivalent zu
    ZEND_NAMED_FE |'
