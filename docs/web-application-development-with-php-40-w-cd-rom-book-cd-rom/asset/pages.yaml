  md: '# 4 Webanwendungskonzepte


    Ausschluss von Argumenten

    Um ein Argument wezulassen, übergeben Sie eine leere Zeichenfolge ("") an session_set_save_handler().


    Die Funktionen sind wie folgt definiert:


    +   > bool open(String save_path, String sess_name)

    Diese Funktion wird beim Initialisieren einer Sitzung ausgeführt. Sie sollten
    sie verwenden, um Ihre Funktionen vorzubereiten, Variablen zu initialisieren o.ä.
    Die Funktion hat zwei Argumente in Form von Zeichenfolgen. Das erste gibt den
    Pfad an, in dem Sitzungen gespeichert werden. Diese Variable kann in php.ini oder
    durch die Funktion session_path() als Platzhalter verwendet werden und für eine
    modulpezifische Konfiguration eingesetzt. Das zweite Argument den Namen der Sitzung
    an, der bei erfolgreicher Initialisierung true zurückgibt, bei nicht erfolg Initialisierung
    false.


    +   > bool close()

    Diese Funktion wird beim Beenden einerung ausgeführt. Verwenden sie, um Speicher
    freizugeben oder Ihre Variablen zu löschen. Die Funktion hat keine Argumente.
    Sie gibt true zurück, wenn die Sitzung erfolgreich abgeschlossen wurde, ansonsten
    false.


    +   > mixed read(String sess_id)

    Diese Funktion wird aufgerufen, wenn eine Sitzung gestartet wird. Sie muss die
    Daten der Sitzung auslesen, die mit sess_id gekennzeichnet ist. Wenn keine Sitzung
    mit dieser Kennnummer vorhanden ist, sollte eine leere Zeichenkette (""") zurückgegeben
    werden. Bei einem Fehler liegt die Ausgabe false.


    +   > bool write(String sess_id, String value)

    Diese Funktion wird gespeichert werden, wenn diese Funktion aufgerufen wird. Das
    erste Argument ist eine Zeichenfolge, welche die Sitzungsnummer angibt. Das zweite
    Argument ist die serielle Darstellung der Sitzungsvariablen. Bei erfolgreicher
    Speicherung gibt der Wert true zurück, bei einem Fehler der Wert false.


    +   > bool destroy(String sess_id)

    Wenn der Entwickler session_destroy() aufruft, wird diese Funktion ausgeführt.
    Sie löscht alle Daten, die der Sitzung mit der Kennnummer sess_id zugeordnet sind,
    und gibt bei erfolgreicher Löschen true zurück, ansonsten false.


    +   > bool gc(Int max_lifetime)

    Diese Funktion wird beim Einrichten einer Sitzung mit der Wahrscheinlichkeit aufgerufen,
    in gc_probability angegeben. Sie wird zur Speicherreinigung verwendet. Dabei werden
    alle Sitzungen entfernt,'
