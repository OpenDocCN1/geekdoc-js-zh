  md: '# 1 Entwicklungskonzepte


    Ohne Namen bist Du ein Niemand.


    Um eine Sprache wirklich zu beherrschen, müssen Sie nicht nur die Syntax und die
    Semantik der Sprache verstehen, sondern auch ihre Philosophie, ihren Hintergrund
    und die Entwurfprinzipien kennen.


    # ## 1.1 Ist PHP etwas für mich?


    Haben Sie sich niemals gefragt, warum es so viele Programmiersprachen gibt? Neben
    »Hauptsprachen«, wie C, C++, Pascal und ähnliche gibt es andere, wie Cobol, Fortran,
    Simula und viele weitere exotische Sprachen. Viele Software-Entwickler denken
    beim Anlegen eines Projek ernsthaft über alternative Programmiersprachen nach.
    Sie haben ihre bevorzugte Sprache (vielleicht auch eine von Unternehmen vorgeschriebene
    Sprache), kennen ihre Vorteile und Nachteile und passen das Projekt an die speziellen
    Stärken und Schwächen der Sprache an. Damit b Sie sich jedoch mölicherweise unnötige
    zusätzliche Belastungen an, den Mangel der gewählten Sprache auszubauen.


    Eine Sprache zu benutzen, ohne ihre spezifischen Konzepte zu kennen, ist so, wie
    man als Lastwagenfahrer an einem Autorenrennen teilnimmt. Im Prinzip wissen Sie,
    wie Sie Wagen steuern müssen, möglicherweise erreichen Sie auch einen guten Platz,
    aber ein hervorragender Fahrer werden Sie erst, nachdem Sie sich mit den Besonderheiten
    Ihres Vehikels vertraut machen.


    Auf natürliche Weise wird der objektorientierte Programmierer, der ein Programm
    schreiben soll, das in Objekte einteilt, während er an Prozeduren spezialierter
    Programmierer dieselbe Aufgabe analysiert. Welcher Ansatz ist besser? Jeder Programmier
    wird sagen, dass Methode die beste sei, aber nur jemand, der mit diesen Konzept
    vertraut ist – objektorientierte Programmierung und prosedurale Programmierung
    – kann es wirklich erklären.


    Jede der erwähnten Sprachen verfolgt einen anderen Ansatz, um Probleme auf spezifische
    Weise zu lösen – meistens nur Probleme einer speziellen Art, mit spezifischen
    Anforderungen. Da sich diese Sprachen auf ein sehr begrenztes Anwendungsgebiet
    konzentrieren, ist auch der Erfolg auf diese Gebiete begrenzt. Sprachen wie C
    und Pascal erlangen wahrscheinlich deshalb so viel'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Beliebtheit, weil sie auf einem breitgefächterten Gebiet arbeiten. Spezielle
    Funktionen für spezifische Probleme gibt es zwar, aber allgemeine Probleme lassen
    sich lösen.


    Wie passt PHP in dieses Schema? Wird PHP zwar als Sprache bezeichnet, aber genaugenommen
    ist es keine eigenständige Sprache, sondern eine mehrsprachige Sprache. Sie verwendet
    hauptsächlich die Syntax, welche die Programmierer aus C kennen; trotzdem ist
    sie komplett anders, als sie interpretiert wird. PHP kennt verschiedene Variablypen,
    aber keine strenge Überprüfung von Typ. Das wird in PHP durch Klassen gelöst.
    Vieler Beispiele haben das Wesentliche aber wahrscheinlich erfasst: PHP vereint
    verschiedene konzeptuelle Ansätze in einem einzigartigen, neuen Ansatz.


    Um Web-Anwendungen erfolgreich mit PHP zu erstellen, sollten Sie zunächst die
    Frage beantworten: Ist PHP die ideale für mein Projekt? Gute Frage. Wie wird dann
    nun, wenn Sie «nein» sagen? (Wer schreibt ein Buch über etwas, das er für schlecht
    hält?) Lassen Sie uns die Frage formulieren: Gibt es eine andere Sprache als PHP
    für mein Projekt? Diese Frage können Sie sicher beantworten. Wenn Sie Web-Anwendungen
    entwickeln, ist PHP die geeign Sprache für Sie.


    # 1.2 Die Bedeutung der Planung


    Selbst wenn Sie bereits ein professioneller Programmierer sind, der mit PHP vertraut
    ist, empfehlen wir Ihnen, die folgenden Abschnitte zu lesen, dass die Grundlagen
    für eine erfolgreiche Entwicklung enthalten. Auch wenn Sie sich bereits mit den
    angesprochenen Themen ausk, sollten Sie sich die Zeit nehmen, den Text durchblättern;
    Sie könnten noch weitere Informationen entdecken – andere Ansichten, andere Ansätze
    oder Lösungen. Je mehr Sie sich der Herangehensweise anpassen, um besser sind
    Sie in der Lage, die kritischen Teile exakt zu bestimmen und sie gekinnt zu verarbeiten.
    Viele der folgenden Abschnitte erörtern die verschiedenen Themen, die mehr eine
    Ansichtsfrage sind als allgemein anerkannte Regeln. Vertrauen Sie uns als Ihren
    professionellen Entwicklern und verlassen Sie sich auf unsere Erfahrung, bevor
    Sie den Inhalt verwerfen – es wird sich später nicht auszahlen.


    Bevor wir in PHP-spezifische Themen eintauchen, lassen Sie uns auf einer breiteren
    Basis beginnen. Einige Themen beziehen sich auf die Programmierung von Anwendungen
    im Allgemeinen, ungeachtet der Sprache, die Sie einsetzen oder der Plattform,
    auf der Sie sich befinden.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Die Bedeutung der Planung


    Wenn Sie an einem professionellen Projekt arbeiten, ist es sehr wichtig, Sie sich
    überlegen, was Sie Ihre Feinde – und unterschätzen Sie diese niemals! Natürlich
    ist ein Projekt kein Feind, aber die Aussage trotzdem. Machen Sie sich mit allen
    Spezifikationen Ihres Projek vertraut, und unterschätzen Sie die Bedeutung der
    kleinen Probleme, die Sie nicht ständig abschätzen, bevor Sie sich anderen Themen
    widmen.


    Nach unserer Erfahrung beansrucht die Planung mindestens 50% der Entwicklungzeit.
    Je größer ein Projekt ist, um gründlicher sollten Sie sich auch vorzubereiten.
    Dieses Prinzip gilt sowohl, wenn Sie Ihren Kunden kontakt halten und mit ihnen
    den Rahmen für das Projekt aufbauen, als wenn Sie mit Ihren Kollegen sprechen,
    um den Programmcode zu verbessern. Je weniger Mühe Sie um Konsistenz und Pflege
    verwenden, desto mehr werden Sie Probleme bekommen, wenn Sie Dateien öffnen müssen,
    um sie zu entfernen oder neue Funktionen hinzuzufügen.


    Die Zeit für die Planung muss nicht proportional zur Größe des Projekts sein.
    Denken Sie zum Beispiel für einen Suchalgorithmus, den Sie entwerfen wollen. Das
    Programm muss nicht mehr tun, als sich durch einen Haufen von Informationen durchzugeben
