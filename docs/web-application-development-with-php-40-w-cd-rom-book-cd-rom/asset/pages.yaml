    # 2.7.1 Dynamischer Funktionsgenerator


    Als wir an dem Buch schreiben, fragte uns aus dem deutschen PHP Mailingailing,
    ob wir eine Möglichkeit, Benutzer eingegebene mathematische Funktionen zu verwalten.
    Er wollte wissen, wie eine vom Benutzer eingegebene Funktion mit einer Formel
    in PHP grafisch darstellen kann. Er wusste nicht, wie er mit dem Text verfahren
    sollte. lässt sich etwas wie $f(x) = m * x + b$ in einem Diagramm übertragen?


    Die Diskussion führte schnell in eine traditionelle Richtung. Jeder fing an, groß
    in großem Rahmen zu denken, anstatt die einfachen, offensichtlichen Dinge zu beziehen.
    Wir sono (aus dem Lateinischen: mit einer Stimme) lautete der allgemeine Vorschlag
    zur Lösung des Problems folgendmaßen:


    +   1. Analysiere die Eingaben.

    2. Generiere eine syntaktisch analysierte Darstellung (etwas in Bezug auf Compilertechniken).

    3. Lassen einen Prozessor die analysierte Darstellung laufen und erzeuge für Schritt
    für Schritt numerische Ausgaben.


    Für unser konkretes Beispiel $f(x) = m * x + b$ wäre dies folgendmaßen aus:


    +   1. Sie stellen fest, dass es sich um eine Funktion von x handelt, um den der
    m und der b Variablen sind.

    2. Sie erzeugen aus einfacheren Handhabung eine Struktur, um den Text der Funktion
    intern darzustellen, z.B. in einer Baumstruktur, welche die Abhängigkeiten der
    Variablen vom Multiplikationszeichen (*) bzw. Zeichenzeichen (+) angibt.

    3. Sie setzen für x (der Variablen, von der die Funktion abhängt) verschiedene
    Werte ein, ermitteln y, speichern das Ergebnis und interpolieren die Daten.


    Dies ist der in Universitäten gewählte Ansatz, den wir bereits in komplexen Quellcodes
    u.ä. gesehen haben. Niemand scheint sich von gewohnten Lösungsansätzen frei zu
    machen und eine innovative Lösung zu können. Haben Sie schon einmal darüber nachgedacht,
    was PHP tut, wenn es seine Skripte interpretiert?


    +   1. Es analysiert die eingegebenen Queldaten.

    2. Es erzeugt eine analysierte Darstellung.'
