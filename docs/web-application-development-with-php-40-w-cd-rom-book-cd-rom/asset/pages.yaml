    #  2.7.2 Selbstmodifizierender Zähler


    Ein einfaches Beispiel für selbstmodifizierende Zähler sind Trefferzähler. Normalerweise
    werden Trefferzähler von Protokokolldateien oder der Datenbank auselesen. Eine
    einfachere Methode ist jedoch die Verwendung von «eingebauten» Zählern. Eingebaut
    bedeutet, dass sich der Programmcode und die Daten für den Zähler in derselben
    Datei befinden:


    ```

    $counter = 0;

    //////////////////////////////////////

    // Do not modify above this point

    //////////////////////////////////////


    // increase counter

    $counter++;

    ```


    ```

    // write counter back to ourselves

    $file = fopen(basename($PHP_SELF), "r+");

    fputs($file, "<?\n$counter = $counter;");

    ```


    ```

    // print counter (or do something else with it)

    print("$counter hits so far\");

    ```


    In der ersten Zeile wird der Zähler auf Null zurückgesetzt. Die nächste Zeile
    setzt ihn hoch, und nun kommt der interessante Teil: Der Programmcode schreibt
    seine Datei und ersetzt die erste Zeile. Dies führt dazu, dass die Datei anders
    interpretiert wird, sie von PHP das nächste Mal verarbeitet wird. Die Quelle sieht
    folgendmaßen aus:


    ```

    $counter = 1;

    //////////////////////////////////////

    // Do not modify above this point

    //////////////////////////////////////


    // increase counter

    $counter++;

    ```


    ```

    // write counter back to ourselves

    ```'
