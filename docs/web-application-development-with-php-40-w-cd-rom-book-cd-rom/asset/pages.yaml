  md: 'Die erste Zeile definiert das Startsymbol mit den folgenden Sequenz:


    +   - ein optionales Vorzeichen, entweder oder - -

    - ein oder mehrere Elemente der D-Produktion

    - optional ein Punkt, und wieder ein oder mehrere Elemente der D-Produktion


    Beachten Sie, dass Operatoren in EBNF für Symbolgruppen verwendet werden können:
    ( D+?) bedeutet, dass dieser Ausdruck optional ist.


    Die zweite Zeile listet zuerst die Endwerte (Atome) der D-Produktion, in diesem
    Fall Null auf. Die Syntax entspricht für reguläre Ausdrücke. Ein Bereich wird
    in eckigen Klammern angegeben.


    Die dritte Zeile definiert die möglichen Zeichen. Das Zeichen A|B kennzeichnet
    Alternativen A oder B nicht beide.


    Dies ist eine einfache Erklärung von EBNF. Die XML-Spezifikation enthält Definitionen
    zur Syntax, z.b. Randbedingungen für Gültigkeit und Wohlgeformtheit. Betrachten
    Sie hierzu den Abschnitt «Notation» der grundlegenden Syntaxrichtlinien von XML-Spezifikation.
    Deshalb findet EBNF hier nicht darauf ein. Weitere Informationen finden Sie in
    jedem modernen Compilerbuch.


    # ## Gültigkeit und Wohlgeformtheit


    Es gibt zwei Arten von XML-Dokumenten, die bestimmte Bedingungen erfüllen: gültige
    Dokumente und wohlgeformte Dokumente. Ein XML-Dokument ist wohlgeformt, wenn es
    den grundlegenden Syntaxrichtlinien von XML entspricht:


    +   - Es enthält ein Stammelement und eine beliebige Anzahl von Elementen unterhalb
    dieses Elements.

    - Elemente sind korrekt verschachtet.

    - Attribute tauchen nur einmal pro Element auf und sind in einfache oder doppelte
    Anführungszeichen eingeschlossen. Sie enthalten keine direkten oder indirekten
    Entitätsverweise auf externe Entitäten. Sie enthalten auch kein öffnendes Tag
    (<Tag).


    +   - Mit Ausnahme der Standardentitäten müssen die Entitäten vor ihrer ersten
    Verwendung deklariert werden.


    +   - Entitäten verweisen nicht rekursiv auf sich selbst.


    Hier ist ein Beispiel für ein wohlgeformtes XML-Dokument:


    ```

    <greeting>Hello world.</greeting>

    ```'
