  md: '# Makro


    # Beschreibung


    | Makro | Beschreibung |

    |---|---|

    | AC_ADD_INCLUDE (Pfad) | Fügt einen Include-Pfad für einen Compiler hinzu; wird
    beispweise verwendet, wenn das Modul Suchpfad für Headerdateien benötigt. |

    | AC_ADD_LIBRARY_WITH_PATH (Bibliotheksname, Bibliothekspfad) | Gibt eine zusätzliche,
    zu verknüpfende Bibliothek an. |

    | AC_ARG(Modname, Beschreibung, nicht bedingter Test) | Ein mächtiges Makro, welches
    das Modul mit der Beschreibung in der Ausgabe --help hinzuf. PHP überprüft, ob
    die Option with-<modname> als Config-Skript übergeben wurde. Ja, wenn das Skript
    nicht den bedingten Test aus (z.B.-with-mtext=yes); in diesem Fall ist der Wert
    der Option in den Variablen $withval enthalten. Dieses Makro ist ein Muss für
    PHP, um Ihre Erweiterung zu konfigurieren.

    | PHP_EXTENSION(Modname, [shared]) | Dieses Makro definiert Ihre Erweiterung.
    Sie können ein zweites Argument hinzufügen, ob Sie eine Kompilierung als genutztes
    Modul (Shared Module) beabsichtigen. Dies führt dazu, dass Ihre Quelle während
    der Kompilierung als COMPILE_DL-<ModuleName> definiert wird.|


