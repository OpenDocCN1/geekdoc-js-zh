    Diese Einrichtung hat den Vorteil, dass alle Bezeichner an einer zentralen Stelle
    gespeichert werden können. Wenn Sie einen Bezeichner ändern müssen, brauchen Sie
    nur seine Definition ändern. Andernfalls müssten Sie den gesamten Programmcode
    durchsuchen und jede Zeichenfolge manuell ersetzen. Mithilfe definierter Werte
    lässt sich diese Arbeit auf eine einzelne Programmierdatei reduzieren.


