  md: "# Pearson Education\n\n# ADDISON-WESLEY\n\n# 6 Datenbankzugriff auf PHP\n\n\
    Eine Liste gültiger Berechtigungen wird in der Klasse definiert, die von Perm\
    \ geleitet, und zwar in der Klassenvariablen $permissions. Die Klasse Example_Perm\
    \ hat folgende Berechtigungen:\n\n```\nvar $permissions = array(\n    \"user\"\
    \       => 1,\n    \"author\"    => 2,\n    \"editor\"    => 4,\n    \"supervisor\"\
    \ => 8,\n    \"admin\"     => 16\n);\n```\n\nBerechtigungen werden intern in Bitmaps\
    \ umgewandelt und mit logischen UND oder berechnet. Die Werte in diesem assoziativen\
    \ Array für jede Berechtigung einen Bitmus. Das mag zwar ein wenig kompliziert,\
    \ aber die Verwendung von Bitmuttern bringt für Szenarien, wie Berechtigungsebenen,\
    \ einige Vorteile. Zum Beispiel werden automatisch Vorkehrungen auf Ebenen getroffen,\
    \ welche die Berechtigungen auf niedrigen Ebenen ändern. Eine admin-Ebene hat\
    \ automatisch auch die user-Privile, wenn sie den Bitmut nicht ausreichend konzipieren.\n\
    \nBei der Standardinstellungen werden diese Vorkehrungen jedoch nicht gefiltert.\
    \ Die admin-Ebene unterscheidet sich der user-Ebene, so dass ein Benutzer, der\
    \ zur admin-Gruppe gehört, nicht auf Funktionen zugreifen kann, die mit $auth->have_perm(\"\
    user gesichert sind. Um ein besseres Verständnis für die Funktionsweise von PHPLib\
    \ zu geben, zeigen wir Ihnen, wie es Bitmut berücksichtigt:\n\n+   - Der Zugriff\
    \ auf die Funktionen erfolgt nur über die user-Ebenen. Diese Ebene hat den Bitmut\
    \ 1.\n- Der Benutzer befindet sich auf der admin-Ebene, welche den Bitmut 16 hat.\n\
    - Diese werden mit einem logischen UND verknüpft, was Null ergibt (überprüfen\
    \ Sie selbst: print(1 & 1)). Das Ergebnis 0 ist nicht identisch mit der geforderten\
    \ Ebene (1), deshalb wird der Zugriff verweigert.\n\nDie Berechtung ist eigentlich\
    \ nichts anderes, als PHPLib überprüft, im Bitmut, als Argument von $perm->have_perms()\
    \ angegeben wurde, das Berechtigung des Benutzers gesetzt wurde. Diese Vorgehensweise\
    \ ermöglicht komplexe Kombinationen.\n\nBetrachten wir ein weiteres Beispiel:\
    \ Angenommen, Sie haben Berechtigungsebenen: admin, supervisor, editor und author.\
    \ Sie möchten, dass Editoren Inhalte nicht weiteriten dürfen (author-Ebene), die\
    \ anderen Gruppen sollen jedoch die Berechtigungen aus den Ebenen unter ihnen\
    \ übernehmen. Das endgültige Berechtigungssystem sieht dann folgendermaßen aus:\n\
    \n284"
