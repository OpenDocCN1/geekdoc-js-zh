  md: '# 4 Webanwendungskonzepte


    HTTP besitzt keinen Mechanismus, um den Status zu speichern. Deshalb spricht man
    von HTTP einem kontextfreien oder zustlosen Protokoll. Die einzelnen Anfragen
    werden nicht auseinander in Beziehung gesetzt. Der Webserver (und damit auch PHP)
    kann einzelne Benutzer nicht einfach unterscheiden und kennt keine Benutzer, um
    einen Benutzer zu kennzeichnen. Deshalb müssen wir einen eigenen Weg, um einen
    Benutzer Sitzungsdaten zuzuordnen; d. h. Alle Daten, die Sie für einen Benutzer
    speichern möchten. Wir benutzen die Sitzung für eine Instanz der Website und diese
    über mehrere Seiten angezeigt. Eine typische Online-Einkaufssitzung könnte beispielsweise
    bestehen, einen Artikel in den Einkaufswagen hinzulegen, sich abzumelden oder,
    die Adresse und die Kreditkartendaten einzugeben, den Auftrag abzuschließen und
    das Fenster zu schließen.


    Die gute Nachricht ist, dass mehr als eine Möglichkeit gibt, Sitzungen zu verwalten.
    Die schlechte Nachricht ist, dass keine ihnen perfekt ist. Lassen Sie uns zwei
    aussortieren, die nicht funktionieren, selbst wenn sie auf ersten Blick als Alternativen
    erscheinen.


    Der typische PHP-Programmierer wird zuerst, das Problem zu ignorieren und einen
    Weg zu finden. Die offensichtlichste Methode ist, alle Daten auf dem Server am
    Client zu speichern. Dies führt zu Formularen mit vielen versteckten Feldern oder
    sehr langen URLs. Dies wird schnell un, wenn mehr als zwei Dateien oder mehr als
    eine Variable gespeichert werden müssen. Ein etwas besserer Ansatz ist die Verwendung
    von Cookies, mit allen Daten auf der Client-Seite gespeichert werden.


    Es gibt jedoch Gründe, warum die Daten nicht auf der Client-Seite gespeichert
    werden sollten:


    +   * Sie verlieren die Kontrolle über die Daten. Solange der Benutzer nicht auf
    Ihre Website zurückkehrt, hat er keinen Zugriff auf die Daten. Dies wird schlimmer,
    dass die Daten möglicherweise manipuliert werden, wenn sie sich zurückhalten.
    Neutral Prozent aller Website-Abstürze werden durch Programme verursacht, die
    falschte Daten von der Client-Seite akzeptieren und diesen Daten vertrauen. Bewahren
    Sie keine Daten auf dem Client auf. Vertrauen Sie keine Daten vom Client.

    * Wenn GET/POST verwendet werden, bleiben die Daten nicht bis zur nächsten Sitzung
    erhalten.

    * Wenn Sie sich ausschlich auf Cookies verlassen, haben sich das Problem, dass
    nicht alle Benutzer Cookies akzeptieren. Sie deaktivieren die Cookies einfach
    auf ihrem Browser.

    * Der Datenerhalt ist sehr schwierig, weil Sie alle Daten auf jeder Seite speichern
    müssen. Jede Variable muss URL-kodiert als verstecktes Feld in einem Formular
    hinzugefügt werden, an die URL angehängt oder als Cookie'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# HTTP und Sitzungen


    gespeichert werden. Dies ist bereits bei einer einzelnen Variablen, wie etwa der
    Sitzungskennnummer, sehr schwierig, ganz zu schweigen bei Dutzenden von Variablen!


    Daher sollten Sie die Daten auf dem Server speichern. Wie ist nicht wichtig: es
    kann in einem relationalen Datenbank-Verwaltungssystem (RDBMS), einer reinen Textdatei,
    oder dBASE-Datei usw. Vorzugsweise sollten Sie eine relationale Datenbank als
    Speichermedium wählen, die Webänderungen in der Regel solche Datenbanken wie etwa
    MySQL verwenden.


    Um dem einen Benutzer zuzuordnen, brauchen Sie eine Sitzungskennummer, einen Schlüssel,
    der einen Benutzer an seine Daten bindet. Wie jedoch erwartetwart, hat HTTP keinen
    Mechanismus, um Benutzer zu kennzeichnen. Wie sollten den Benutzer denn kennzeichnen?


    Eine Idee, die sofort im Sinn kommt, ist die Verwendung von Benutzer-IP-Adresse.
    Dieser Ansatz mag zwar auf dem ersten Blick logisch erscheinen, er scheitert jedoch
    an den ihm verbundenen Problemen:


    +   * Viele Provider sogenannte einen Benutzer durch Wahl einer Proxyserver zu
    verwenden (REMOTE_ADDR zeigt hier die den Proxy). Wenn zwei AOL-Benutzer versuchen,
    die Webänderung zur Zeit zu verwenden, gibt es einen Durcheinander.


    +   * Einige Provider (z.B. Provider für den Kabelzugriff) ändern die Adressen
    ihnen ihrer Benutzer von Zeit zu Zeit, um zu verhindern, dass sie von Webservern
    ausgeführt werden.


    +   * Schließlich könnte es passieren, dass ein Benutzer seine Internetverbindung
    schließt, einen Kaffee trinken geht, um 15 Minuten später wieder im Online-Geschäft
    zu erscheinen (natürlich mit einer anderen IP).


    Nachdem die Tatsache akzeptiert haben, dass es keinen allgemeinen Ansatz gibt,
    um den Benutzer mit einer vordefinierten Nummer zu kennzeichnen, bleibt ihm nur
    noch die Möglichkeit, selbst eine Sitzungskennummer (Session-ID) zu erzeugen und
    von Seite zu weiterzuleiten. („Wie?“ werden sie fragen. Lassen Sie weiter, wir
    liefern die Einheiten den Benutzer werden herauszufinden, um Sitzungen zuzuordnen.
    Wenn die ID linear ist, z. B. eine normale Nummer (page.php3id=5), können Sie
    darauf wetten, dass ein Benutzer versucht wird `page.php3id=6` zu öffnen. Vielleicht
    ist es Ihnen einfach nur peinlich, wenn normale Benutzer die Einkaufswagens anderer
    Benutzer einsehen können. Er wird jedoch zu einem gefährlichen Sicherheitsproblem,
    wenn Hacker sich von Anderen übernehmen, um die Kreditkartennummer herauszubekommen
    oder gefälschte Aufträge zu erzeugen.'
  merge: -1
