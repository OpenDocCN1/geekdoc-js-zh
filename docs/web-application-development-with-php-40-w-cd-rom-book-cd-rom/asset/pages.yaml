  md: '# 2 Erweiterte Syntax


    Auf Grund des Wesens kompilierter Sprachen waren Sie stets auf die voraus- gangene
    Ihrer Variablen gebunden. Wenn Sie im ganzen Array plötzlich mehr als 256 Zahlen
    benötigen, hätten Sie jedochch. Natür- hätten Sie diese Variable als ein einzahlig
    Array definieren und dies 257 Elemente zuweisen. Aber was wäre, wenn Sie plötzlich-
    lich ein weiteres Element benötigen? Sie müssten einen neuen Speicher- weisen,
    den Inhalt des alten Arrays kopieren und den alten, nutzen nicht mehr den verwendeten
    Speicherbereich freigeben.


    PHP folgt einem anderen Ansatz. PHP braucht keine typischen Variablendekla- rationen
    (nur Typdefinitionen), werden neue Variablen quasi im Vorü- bezogen. Sobald Sie
    eine neue Variable generieren, ihren Namen im Namensraum einfügen, schaffen Sie
    einfach Speicher- platz, der diesen Namen gibt, ist nicht. Die Art der, die in
    diesem Speicherbereich abgelegt wird, nicht auf einen bestimmten Variablentypt.
    Die Datentypen können jederzeit interpretiert werden, ihre Größe geändert werden,
    sie können neu zugewiesen wer- den und viel mehr.


    Betrachten wir uns folgendes Beispiel:


    ```

    $my_var = 1;

    $my_var = "Used to be an integer";

    $my_var = array("Oh well, I like arrays better");

    ```


    Die erste Zeile erzeugt eine neue Variable $my_var. PHP wird feststellen, dass
    ihre eine Zahl zugeordnet wird und setzt daher den ursprünglichen Typ von $my_var
    auf Ganz Zahl. Die zweite Zeile überschreibt den Inhalt von $ mit einer Zeichenkette.
    würde dies bei der Kompilierung zu einem Fehler führen oder zumindest während
    der Laufzeit. PHP ändert den Typ von $my_var dynamisch zu "string" und ordnet
    die Variable neu zu, so dass genügend Platz für die Zeichenkette zur Verfügung
    steht. Die Zeile ändert dann den Typ von $my_var erneut, indem ein Array erzeugt.
    PHP meistert alle Fälle und problemlos. (Wir wissen, dass es draußen noch weitere
    Sprachen ohne strikte Variablypen gibt, aber wir möchten diese hier nicht als
    konventionelle Sprachen klassifizieren.)'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'Hinweis: PHP 3.0 hat keine vernünftige Speicherbereinigung. Der Neuweisung
    einer Variablen wird der zugewiesene Speicherplatz nicht immer wieder verwendet.
    Bei langfristfristigen Skripten (oder Skripten, die eine umfangreiche Verarbeitung
    haben) könnte dies zu größeren Proble wie „totten Speicher“ führen. Bei der Verwendung
    von speicherintensiven Skripten, die für einen langen Zeitraum genutzt genutzt
    werden, sollten Sie die Speicherbelegung in einer produktiven Umgebung überwachen,
    um sicherzugehen, dass Ihr Server nicht überlastet wird. PHP 4.0 ist nicht so
    anfällig für dieses Problem.


    Das PHP kann keine formalen Variablereklarationen benötigt, die Verwendung der
    Variablen vollständig dynamisch. Ein Sonderfall der dynamischen Variablenverarbeitung
    in PHP sind die Arrays. Wahrscheinlich können Sie die herkömmlichen Array-Typ,
    die indexierte Arrays. Indizierte Arrays werden durch Ganzzahlen indiziert. Diese
    Ordnungszahlen gehen in der Regel von 0 bis n, wobei der höchste Index ist. Sprachen
    wie Pascal lassen eine Indexierung mit verschiedenen Bereichen, wie etwa von 3
    bis 18 zu, wobei diese Bereiche später zur Laufzeit auf bestimmte Indizes zurückgegeben
    werden. Das Haupt ist, dass andere Ind von einem bestimmten Basisindex berechnen.
    Wenn wir beispielsweise, Sie möchten bei Index 2 nebeinander folgende Array-Elemente
    auslesen:


    ```

    $base_index = 2;


    for($i = $base_index; $i < $base_index + 3; $i++)

    print("Element $i is $my_array[$i]<br>");

    ```


    Bei jeder Iteration der for()-Anweisung berechnet diese kleine Programmteil den
    nächsten Index im Array durch Hersetzen von $i.


    Associative Arrays haben diese Funktion nicht. Die Besonderheit bei associativen
    Arrays besteht darin, dass sie Nicht-Ordnungszahlen wie Zeichenketten indiziert
    werden können. Jeder Zeichenkette, die als Index verwendet wird, ein Wert zugiesen,
    was den Namen „associatives Array“ erklärt. Sie sich vielleicht denken können,
    lässt sich auch durch Zuteilen eines Basisindexes der nächste gültige Index in
    dem Array nicht erraten. Sie müssen die Array-Schlüssel kennen, die zugehörigen
    Werte auszulesen.


    Daneben können die bereits zuvor besprochenen Funktionen list() und each() verwendet
    werden, um associative Arrays zu verarbeiten.'
