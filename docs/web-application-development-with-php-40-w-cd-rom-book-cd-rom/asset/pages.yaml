  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    vorgängen führen, die in einem Chat extrem störend wären. Außerdem würde es zu
    Datenverlusten führen, da in der Zeit zwischen Logout und Login keine Nachrichten
