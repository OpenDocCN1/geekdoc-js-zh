  md: '# Annahme von Argumenten


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_394_0.png)


    Wie wir sehen, in dieser Definition einen internen Funktion namens wrong_param_count()
    aufgerufen, die für die Ausgabe der Warnung zuständig ist. Auf Einzelheiten für
    die Erstellung benutzerspezifischer Fehlermeldungen gehen wir später im Abschnitt
    »Informationen» ein.


    # 9.11.2 Auslesen von Argumenten


    Nachdem Sie die Anzahl der Argumente überprüft, müssen wir auf diese Argumente
    zugreifen können. Hierfür steht zend_get_parameters_ex() zur Verfügung.

    zval **parameter:


    ```

    if(zend_get_parameters_ex(1, &parameter) != SUCCESS

    WRONG_PARAMETER_COUNT:

    ```


    Alle Argumente werden im Container zval gespeichert, auf dem das zweimal gezeigt
    werden muss. Das obige Beispiel zeigt den Versuch, einen Argument zu bereitzustellen,
    und dies über den Zend Parameter.

    zend_get_parameters_ex() nimmt mindestens zwei Argumente an. Das erste Argument
    ist die lesende Anzahl der Argumente. Dies sollte die Anzahl von Argumenten entsprechen,
    mit welcher die Funktion aufgerufen wurde – deshalb sollten Sie die korrekte Aufsyntax
    überprüfen. Das zweite Argument (und alle weiteren Argumente) sind Zeiger auf
    Zeiger auf zvals. (Verwirrend – nicht wahr?) Diese Zeiger sind alle erforderlich,
    da Zend intern mit **zval** arbeitet. Um einen lokalen **zval** in unserer Funktion
    auszurichten, benötigt zend_get_parameters_ex() einen Zeiger darauf.'
