  md: '# Elemente


    Jeder, der bereits mit HTML gearbeitet hat, wird mit Elementen vertraut sein.
    Sie kennzeichnen die Bedeutung eines bestimmten inhaltlichen Abschnitts. Für jedes
    Element wird in XML ein schließendes Tag benötigt (z.B. für das HTML-Tag <img>).
    Es gibt jedoch eine gesonderte Schreibweise zur Kennzeichnung von leeren Tags.


    ```

    <xref linkend="end/>

    ```


    Bedenken Sie, dass die Verschachtelung von Tags signifikant ist. Falsch verschachtelte
    Tags führen zu schlecht geformeten Dokumenten.


    # Attribute


    Jedes Element kann Attribute haben. Attribute sind Namen/Wert-Paare, die in den
    Tags hinter dem Elementnamen auftau und die Eigenschaften des Elements angeben.
    Attributewerte müssen in Einführungsstrichen angegeben werden. Attribute darf
    in einem Tag nur einmal vork.


    XML-Dokument können optional (und unbeachtet der Dokumententypdefinition) zwei
    Standardattattribute besitzen: xml:lang und xml:space. Das Attribut xml:lang wurde
    definiert, da Sprachunabhängigkeit eine der wichtigsten Ziele von XML ist.


    Ohne zu wissen, in welcher Sprache ein Text geschrieben ist, kann eine Anwendung
    einen Text nicht anzeigen, auf Rechtschreibung überprüfen oder indizieren. Die
    Unicode-Unterstützung für XML ist nicht sehr hilfreich, wenn der Autor von einem
    bestimmten Teil eines Dokumentes keine Sprache zuzuweisen kann. Aus diesem Grund
    wurde das Attribut xml:lang eingeführt.


    ```

    <worldwide declarations of love</p>

    <p xml:lang="It">Ti amo.</p>

    <p xml:lang="De">Ich liebe Dich.</p>

    <p xml:lang="Klingon">qablang</p>

    ```


    Ein Sonderzeichen kann folgendermaßen aus:


    +   * ein einbuchabiger Sprachcode nach ISO 639

    * ein Sprachcode, der bei Internet Assigned Numbers Authority (IANA) registriert
    wurde; er beginnt mit dem Präfix «x-» (oder «X-»)

    * ein benutzerdefinierter Code, der mit dem Präfix «x-» (oder «X-») beginnt


    Das Standardattribut xml:space ist nicht einfach zu verstehen und zu verwenden.
    Es wird erwähnt, dass Leerraum in XML signifikant an die verarbeitende Anwendung
    übergeben wird. Wenn unsere Kodierrichtlinien haben, wissen Sie, dass Leerraum
    wichtig ist, um den Programmcode zu strukturieren und Leerzeichen einzufügen,
    welche die Lesbarkeit verbessern. So wird das Attribut zwar für die strukturelle
    Auszeichnung'
