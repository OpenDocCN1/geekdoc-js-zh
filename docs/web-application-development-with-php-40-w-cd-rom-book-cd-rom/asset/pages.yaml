  md: '# Sicherheitsaspekte


    Beispiele für die Authentifizierung durch Eigentum (etwas, das sie haben) sind
    Schlüssel, Magnetstreifenkarten, Merkmale u.a. Im Gegensatz zur ersten Methode
    ist die Authentifizierung durch Eigentum schwieriger zu duizieren, da die Authentifizierungselemente
    physikalische Objekte sind. Für das Web ist diese Art der Berechtigung nicht als
    gültige Technik etabliert. Es gibt jedoch einige Bemühungen, Magnetstreifenkarten
    für Verschlüsselungssysteme mit öffentlichen Schlüsseln einzuführen.


    Die Art der Authentifizierung ist sehr gebräuchlich. Die Authentifizierung nach
    Merkmalen (das was sie sind) wird beispielsweise in Firewall-Systemen verwendet,
    um ein Objekt nur zu einem System mit bestimmten IP-Adresse oder in einem bestimmten
    Zugriff zu gewähren. Außerhalb des Web-Bereichs wird die Authentifizierung nach
    Merkmalen vermehrt eingesetzt, die Retina-Abastungen oder Fingerabdücke verwenden.
    Dieses Verfahren ist sicherer als der dritte (hininter stellt die Berechtigung
    darauf ab, sicherzustellen wer Sie sind, und dieser Typ kommt dem sehr nah. Seine
    Umsetzung ist aber die kostigste. Wir haben jedoch betont, dass IP-Adressen zur
    Identifizierung von Personen nicht Betracht gezogen werden. Sie brauchen noch
    ein persönliches Identifizierungssystem, das ein Peripheriegerät verwendet.


    Die unterschiedlichen Authentifizierungsverfahren lassen sich natürlich kombinieren,
    damit das Ergebnis sich verbessert. Vorläufig lassen wir uns jeden Anmeldeprozess
    mit dem Authentifizierungsverfahren nach fortsetzen.


    Der Benutzer gemeinsam mit seiner Identität ein Authentifizierungselement, das
    das häufig ein Passwort ist. Wie werden diese Daten vom Client zum Authentifizierungssystem
    weitergeleitet? Die Identifizierungsdaten sind sehr anfällig für einen Eingriff
    eines Eindringlings, der zwischen dem Benutzer und dem Authentifizierungssystem
    sitzt (Mann-in-der-Mitte-Attacke). Folgen Sie sich die Sprachauch schützen. Ein
    sicherer Pfad – ein sicherer Übertragungsweg ist notwendig, um das Passwort zu
    verschlütern. Bedenken Sie, dass eine Authentifizierungskur nicht sicher ist,
    wie sie ihr schwächstes Geld selbst. Selbst ein 128-Bit langes Passwort hilft
    nicht, wenn Sie es über eine normale HTTP-Verbindung an das Authentifizierungssystem
    schicken.


    Der Datenverkehr sollte sicher sein


    Selbst wenn die Identifizierungsdaten über einen sicheren Übertragungskanal wie
    SSL weiterleitet, bleibt noch Raum für Mann-in-der-Mitte-Attacken, wenn der Datenverkehr
    nach der Authentifizierung nicht verschlüsselt wird. Ein Angreifer erfährt möglicherweise
    die Sitzungskennnummer durch Lauschen und kann so effektiv die Sitzung des Benutzers
    übernehmen und die Identität des Benutzers übernehmen (z.B. Artikel in einem Online-Shop
    bestellen).'
