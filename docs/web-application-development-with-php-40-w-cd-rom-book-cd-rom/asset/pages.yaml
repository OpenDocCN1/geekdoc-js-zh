    # Seiten-Caching


    Mit der Sitzungsbibliothek können Sie auch kontrollieren, wie Seiten gecacht werden.
    Hierzu steht Ihnen die HTTP-Anweisung HTTP Cache-Control zur Verfügung. In der
    PHP-Konfiguration kann die Anweisung cache_lim auf nocache, private oder public
    gesetzt werden. Wir werden in Kapitel 6 zeigen, wie dies ähnlich dem Verhalten
    von PHPLib (beachten Sie jedoch, dass PHPLib anstelle von nocache verwendet).


    Das C-Caching ist standardmäßig auf nocache vollständig verhindert, – wie Sie
    vielleicht wissen – dem Standardverhalten aller PHP-Seiten. Sollten Sie diese
    Einstellung bevorzugt verwenden, da diese Seiten häufig von Anfrage zu Anfrage
    divergieren. In einigen Teilen Ihres Programms, die sich häufig ändern, möchten
    Sie sich möglicherweise von diesem Ansatz abweichen. Ihre Serverhardware wird
    Ihnen danken. Der Kopf der Ausgabe sieht folgt:


    ```

    Expires: Thu, 19 Nov 1981 08:52:00 GMT

    Cache-Control: no-cache

    Pragma: no-cache

    ```'
