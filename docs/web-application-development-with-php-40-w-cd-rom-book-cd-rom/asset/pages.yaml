  md: "# Schnittstelle zum Netzwerk\n\n```\nevent_handler incoming_data())\n{\n  \
    \  update_traffic_counter();\n    case of ping: handle_event(ping);\n}\nwhile(not_done())\n\
    {\n    wait_for_event();\n    case of network_data: handle_event(incoming_data);\n\
    }\n```\n\nListing 3.2: Ereignisbasierter Pseudocode für die Handhabung eines Pings\n\
    \nDieser Code ist länger, aber klarer. Die Hauptschleife wartet, bis ein Ereignis\
    \ passiert. Wenn sie herausgefunden hat, dass ein Ereignis stattgefunden hat und\
    \ es durch kommende Netzwerkdaten ausgelöst wird, fertigt sie dieses Ereignis\
    \ mittels der gleichen Prozedur `handle_event()` ab. Diese Funktion bestimmt eine\
    \ Routine für den Datenverkehr und ruft sie ab. Die Routine aktualisiert ihrerseits\
    \ den Datenverkehrszähler und startet ein weiteres Ereignis, wenn das erste Ereignis\
    \ ein Ping war. Nachdem dieses Ereignis wieder mit `handle_event()` abgefertigt\
    \ worden ist, wird wird ein Pong gesendet.\n\nAlternativ könnten sich sowohl `ping()`\
    \ als auch `incoming_data()` sich bei dem Ereignis „incoming_data“ anmelden. Die\
    \ Erstellung zweier verschiedlicher Ereignisse ermöglicht noch größere Vielfalt\
    \ an Ereignissen und erlaubt eine detailliertere, zielgerichttere Verarbeitungen.\n\
    \nEs ist zunächst, sich mit der Ereignisbasierten Verarbeitung von Informationen\
    \ vertraut zu machen (sie funktioniert ähnlich wie eine Finite-Machine), aber\
    \ sie hat folgende Vorteile:\n\n+   - Der Anwendung wird eine modulare Struktur\
    \ aufzuweisen. Jedes Modul unabhängig von den anderen Modulen und kann leicht\
    \ geändert, ausgetauscht oder erweitert werden.\n- Jeder Teil des Programms kann\
    \ ein beliebiges Ereignis auslösen und daher jede Art von Reaktion in der Anwendung\
    \ erzwingen (mit anderen Wort: Sie können jeden Teil Ihres Programcodes von jedem\
    \ anderen Teil Codes zu kontrollieren)."
