    Die einfachste Methode, um sie zu komprimieren und jedes Mal einen anderen Komprimierungsalgorithmus
    oder einen anderen Komprimierungsparameter auszuwählen. Nach jeder Komprimierung
    wurde der Bytecode verändert, doch nach der Dekomprimierung wurde das ursprüngliche
    Programm wiederhergestellt. (Versuchen Sie einmal die ZIP-Archive anzusehen, die
