- img_proc: true
  md: '# Webanwendungskonzepte


    Webanwendungen immer größer und komplexer werden, sind Webentwickler mehr denn
    gefordert, effektive und funktionale Websites zu erstellen. Tauglichkeit wird
    ein Schlüsselbegriff für diese Websites.


    Was ist Tauglichkeit? Die Eigenschaft, wie einfach ein Informationssystem zu erlernen
    und zu benutzen, bezeichnet als Systemtauglichkeit. Als Programmierer fällt Ihnen
    wahrscheinlich leicht, Ihr System zu benutzen. Aber Sie werden überrascht, wie
    schwierig es mit dem neuen System nicht vertraut und versucht für andere Dinge
    zu verwenden, als Sie beabsichtigten!


    Tauglichkeitsexperten haben versucht Einungsfragen im frühen Stadium der Softwareentwicklung
    einfließen zu lassen. Dies war jedoch nicht sehr erfolgreich. Die spielt mit Beginn
    jedes Projektes eine große Rolle. Diese Überlegung erst in der Beta-Testphase
    einzubringen, reicht nicht aus. Unser Meinung nach sollte die Tauglichkeit dieselbe
    Bedeutung wie die traditionellen Merkmale der Softwarequalität beimessen, etwa
    durch Korrektheit, Pflege und Zuverlässigkeit. Sobald als Softwareentwick bewusst
    wird, wie wichtig die Tauglichkeit für die Sicherung der Programmqualität ist,
    werden Sie sich bemühen, die Erfahrung des Benutzers zu fördern. Wie Sie die Tauglichkeit
    Ihres Programs verbessern können, hängt vom einzelnen Projekt ab. Einige wichtige
    Prinzipien sind jedoch für die Einbindung aller benutzerorientierten Programme
    kritisch.


    +   - Frühe Konzentration auf den Benutzer; direkter Einbezug dasselben in die
    Konzeption

    - Frühe und kontinuierliche Bewertung des Programs

    - Empirische Messung der Tauglichkeit, selbst in frühen Phasen der Entwicklung

    - Iterative Konzeption und Entwicklung


    # 4.3.1 Tauglichkeit in Webanwendungen


    Webanwendungen unterscheiden sich grundlegend von Desktop-Programmen.


    Mit HTML können Sie das Layout nicht zu 100% zuverlässig kontrollieren. Sie müssen
    bei der Anzeige von Kompromissen eingehen. Mölicherweise wird Ihre Website auf
    einer Vielzahl von Anzeigegeräten dargestellt. Dies kann von Palm-Palts bis Web-TV
    mit einem Smartphone auf einem 800 bis 600-Bildschirm variieren.


    Die Benutzerinteraktion wird aufgrund der heute noch niedrigen Bandbreite stark
    gebremst. Auf der Client-Seite können Sie sich nur die einfachsten Basiskripte
    mit JavaScript ausführen.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Die Bedeutung der Tauglichkeit


    Bei der traditionellen Softwareentwicklung können Sie die Actionen des Benutzers
    beeinflussen. Sie können Menpunkte hinterlegen oder modale Dialogboxen ausgeben,
    welche das Programm soll blockieren, der Benutzer die Fragen beantwortet hat.
    Auf der Website können Sie jedoch nicht kontrollieren, wie sich der Benutzer bewegt.
    Er kann über direkte Links, Lesezeichen oder Suchmaschinen auf Ihre Website stoßen.


    Sie können nicht auch erwarten, dass der Benutzer ein Handbuch liest, um sich
    mit Ihrer Webanwendung vertraut (wie es bei traditionellen Programmen üblich ist),
    denn Benutzer wechseln häufig sehr schnell von einer Seite zur nächsten. Die Hypertext-Struktur
    hilft den Benutzer dazu, das Web als Ganzes und nicht als separates Programm oder
    einzelne Website zu betrachten.


    Die grundlegenden Entwicklungsprinzipien wie »Usability 101« sind bezug auf die
    Tauglichkeit nach wie gültig, und sollten auf einige Regeln eingehen. Die folgenden
    Richtlinien gehen vinander ab. Sie sollten anhand ihrer spezifischen Programms
    entscheiden, welchen Sie den einzelnen Regeln geben.


    Eine benutzerfreundliche Webanwendung zeichnet sich durch folgende Merkmale aus:


    +   * Sie eignet sich für die Aufgabe, die es durchzuführen soll.

    * Sie lässt sich durch den Benutzer kontrollieren.

    * Sie entspricht der Benutzererwartung.

    * Sie ist benutzerspezifisch.

    * Sie ist selbstberklärend.


    # Ist es geeignet?


    Das Programm sollte den Benutzer auf effektive und effiziente Weise helfen, sein
    Ziel zu erreichen. Benutzer interessieren sich in der Regel nicht für ausgefallene
    Grafiken; sie wollen lediglich ihr Ziel erreichen – egal ob dies nur den Erhalt
    von Informationen ist oder etwas Spezielles, wie das Bestellen eines Produktes.
    In einem Online-Shop soll das System beisielsweise dem Benutzer helfen, den Bestellvorgang
    mühelos wie möglich abzuwickeln. Amazon.com hat hierfür einen Standard entwickelt.
    Sobald ein Benutzer im System angemeldet hat, braucht er nur noch einen einzigen
    Click, um ein Produkt zu bestellen. Eignung für eine bestimmte Aufgabe kann aber
    bereits bei einzelnen Dialogen beginnen:'
  merge: -1
