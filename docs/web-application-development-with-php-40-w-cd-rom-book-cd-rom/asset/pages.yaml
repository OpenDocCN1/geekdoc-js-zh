    # 6 Datenbankzugriff auf PHP


    vornehmen. Wir empfehlen, ein neues Objekt als Erweiterung zu DB_Sql zu erzeugen.
    Damit vermeiden Sie diese Konfigurationsvariable in jeder Anwendung setzen zu
    müssen. Statt definieren Sie diese einmal in einer Klasse.


    Sie sollten am besten local_inc an Ihre eigenen Bedürfnisse anpassen, und zumindest
    den Namen der Klasse Example_Session ändern. Dieser Name wird als Bezeichnung
    für die Sitzungs-Quelle verwendet und in der URL im GET-Mode übergeben – und es
    sieht nicht sehr professionell aus, wenn Ihre URL Example_Session steht.


    # 6.2 Datenbankabfrage


    Eine Datenbank-Abstraktionsschicht ist eine API, die Reihe von Funktionen bereitstellt,
    mit denen Sie Vielzahl von Datenbanken unabhängig von der jeweiligen Implementierung
    verwalten können. Durch Ändern des Backends der Datenbankabstraktionsschicht können
    Sie leicht von MySQL auf Oracle umschalten. Das DBI (Database Interface) ist eine
    solche Schicht, und die bekanntesten Funktionen von PHPLib sind Datenbankabstraktionsschicht,
    die in der Klasse DB_Sql class organisiert ist.


    # 6.2.1 Portierbarkeit


    Für einen professionellen Webentwicklungsprogrammierer ist Datenbankabstraktion
    nützlich und wichtig. Die Basis für alle Anwendungen ist das Datenmodell, welches
    Strukturen für allgemeine Zwecke, die in in Datenbank enthalten enthält. PHP unterstützt
    zwar eine große Anzahl von Datenbanken, aber jede Datenbank hat eine andere Anwendungsprogrammierschnittstelle
    (API). Wenn Sie diese datenbankigen APIs verwenden, ist ohne Betriebssystem und
    die Datenbank unabhängige Programmierung unmöglich. Wenn Sie eine Anwendung von
    MySQL auf Oracle portieren, müssen Sie mit einer großen Anzahl von Anpassungen
    rechnen, es sei denn, Sie verwenden eine Abstraktionsschicht, die PHPLib. Tabelle
    6.1 zeigt, welche Datenbankschnittstellen von System zu System variieren können.


    | Beschreibung | MySQL | Oracle 7 |

    |---|---|---|

    | Verbinden | mysql_connect() | ora_login() |

    | Abfragen | mysql_query() oder mysql_db_query() | ora_parse(), dann exec() |


    Tab. 6.1: APIs für den Zugriff auf MySQL und Oracle


