    # 9.14 Ressourcen


    Ressourcen sind eine spezielle Art von Datentyp in PHP. Der Begriff Resource bezieht
    sich nicht auf eine spezielle Art von Daten, sondern vielmehr auf Abstraktionsmatrix
    zur Pflege beliebiger Informationen. Ressourcen werden innerhalb von Zend in speziellen
    Ressourcen abgelegt. Jeder Eintrag in der Liste hat eine entsprechende Typdefinition,
    welche die Art der Ressource angibt. Intern verwaltet Zend alle Referenzen auf
    diese Ressource. Der Zugriff auf eine Ressource erfolgt direkt über bereitgestellte
    API. Sobald keine Referenzen auf eine bestimmte Ressource mehr gibt, wird eine
    entsprechende Deinitialisierungsfunktion aufgerufen.'
  merge: -1
  pgno: 417
- img_proc: true
  md: "# Rourcecen\n\nRourcecen werden beispielweise verwendet, um Datenbanklinks\
    \ und Datecriptors zu speichern. Die de facto -Standardimplementierung finden\
    \ Sie im MySQL-Modul. Aber auch andere Module, etwa das Oracle-Modul, verwenden\
    \ Ressourcen.\n\nUm einen Handle für eine spezielle Ressource zu erhalten, müssen\
    \ Sie den Ressourceyp vor der Verwendung registrieren:\n\n```\nint resource_handle\
    \ = register_list_destructors(destructor_handler, NULL);\n```\n\nDieser Aufruf\
    \ erzeugt einen Handle, den Sie verwenden können, wenn Sie Einträge in die Ressourcenliste\
    \ hinzufügen möchten. Die angegebene Funktion (destructor_handler) wird stets\
    \ aufgerufen, wenn es keine Referenz mehr auf eine bestimmte Ressource gibt und\
    \ Zend versucht, diese zu lösen. Diese Funktion sorgt für die richtige Resourcecenfreigabe\
    \ und Aufhebung der Zuweisungen. Sie muss vom Typ void sein, und als einziges\
    \ Argument einen Zeiger auf den Typ benutzen, den Sie in die Liste einfügen möchten.\n\
    \n```\ntypedef struct {\n    int resource_link;\n    int resource_type;\n} my_resource:\n\
    \nvoid destructor_handler(my_resource *resource)\n{\n    // do all deallocation\
    \ relating to the resource\n\n    // free container\n    efree(resource);\n}\n\
    ```\n\nUm eine Ressource zur Liste hinzuzufügen, verwenden Sie zend_list_insert():\n\
    nmy_resource *resource;\n\n```\n// allocate resource here and fill it with values\n\
    resource = (my_resource *)emalloc(sizeof(my_resource));\n\nresource_value = zend_list_insert(resource,\
    \ resource_handle);\n```\n\nDie Funktion hat zwei Argumente. Der erste ist der\
    \ Zeiger auf die Ressource, die Sie in die Liste einfügen möchten. Der zweite\
    \ ist der Typ der Ressource, für Sie zuvor einen Destruktor registriert haben.\
    \ Anschließend können Sie den Rückgabewert des zend_list_insert()-Aufrufs im value-Field\
    \ des entsprechenden zval-Containers IS_RESOURCE verwenden."
