  md: '# Sicherheitsaspekte


    ware mit einer Open-Source-Lizenz freigegeben. Möglicherweise werden dann die
    Industrieexperten selbst sich prüfen. Open-Source mit offenen Entwicklungsprozess
    erforderliche Sicherheit – nicht Sicherheit durch Verschleierung; Sicherheit gegen
    alle möglichen Attacken durch einen Hacker, der sich mit dem System und Quellcode
    auskennt.


    Selbst wenn Open-Source für Sie Möglichkeit ist, können Sie viele der Programmierentwicklungprinzipien,
    die in der Open-Source-Gemeinde verwendet werden, auch für ihr eigenes Produkt
    einsetzt. Eine kontinuierliche Kontrolle durch Experten kann beispielsweise helfen,
    die üblichen Sicherheitsfehler zu vermeiden, durch unzureichendes Testen.


    Diese Kontrolle kann in Form von regelmäß Überprüfungen des Programcodes formalisiert
    werden. Damit werden nicht Sicherheitsängel sondern allgemeine Softwarefehler
    vermieden. In wchentlichen Sitzungen zieht ein Team von fünf Personen den neuen
    Code für Zeile und überprüft auf bekannte Fehler, etwa fehlende Bereichsüberprüfungen,
    nicht verwendete Variablen oder Sicherheitsfragen. Ein Moderator zeichnet alle
    gefunden Fehler auf und stellt sicher, dass diese vom ursprünglichen Entwickler
    korrigiert werden. Ein typisches Szenario könnte folgendermaßen aufgebaut:


    +   1. Ein Team von bis fünf wird der Quellcode durchlaufen.",n2. 60 Minuten lang
    wird der Quellcode (etwa 200 bis 300 Zeilen Programcode) überprüft. Das Teammitglied
    geht den Programcode Zeile für Zeile und versucht zu verstehen, was einzelne Zeile
    tut. Alle gefundenen Fehler werden notiert.

    3. Der Moderator sammelt die Notizen ein und leitet sie an den ursprünglichen
    Programmierentwick weiter, der nicht Teil des Prüfteams sollte. Die Überarbeitung
    kann darauf, dass der Programcode geändert wird, Kommentare hinzugefügt oder gelöscht
    werden, Funktionen neu strukturiert oder umgebettet werden.


    Wir beziehen das einfache Software-Inspection (Discount Software Inspection).
    Bei der traditionellen Softwareentwicklung nimmt ein viel größeren Raum ein. Fagan
    Inspection, das von Michael Fagan im 1976 [13] entwickelt wurde, benötigt größere
    Vorbereitung, ausführlichere Prüflisten und häufigere Meetings. Die Entwicklung
    von Variablenänderungen ähnelt der raschen Entwicklung von Prototypen, von eine
    schnelle Markteinführung von wesentlicher Bedeutung ist. Prüfverfahren die zu
    zeitaufwend und ressourcenintensiv sind, haben für die Praxis keine Bedeutung.'
