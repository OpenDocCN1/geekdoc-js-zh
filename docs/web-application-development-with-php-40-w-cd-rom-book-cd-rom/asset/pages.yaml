- img_proc: true
  md: '# 7.3.1 Datenaustausch über das Web (WDDX)


    WDDX (Web Distributed Data Exchange) ist eine offene Technologie, die von Allaire
    Corporation entwickelt wurde. Es handelt sich hier um ein XML-Vokabular, das einfache
    und komplexe Datenstrukturen, Zeichenketten, Arrays und auf generische Art beschreibt,
    dass zwischen verschiedenen Webscriptplattformen durch die Verwendung von HTTP
    hin- und transferiert werden können. WDDX unterstützt WDDX, genau wie die meisten
    bekannten Webscriptsprachen, wie z: B. Perl, ASP und Cold-Fusion.


    # 7.3.2 Die Herausforderung


    Nachdem Webanwendungen zunehmend größere Rolle in der Softwarewelt spielen, ist
    dies eine der größten Herausforderungen der Datenaustausch zwischen verschiedenen
    Programierungsumgebungen. Das neue Web fordert und vernetzte Anwendungen. Es begann
    mit einfachen Websites, die statistische Informationen enthielten. Sie wurden
    zu anspruchsvollen, dynamischen Webanwendungen, und insbesondere beginnen diese
    Webanwendungen zusammenzuarbeiten, Daten auszutauschen und zusätzliche programmierbare
    Daten anzubieten. Erst kurzem tauchten offene Standards wie XML auf. Sie verbreiten
    sich so schnell, dass Hersteller gezwungen waren, diese in ihren Produkten zu
    übernehmen.


    Durch die Erweiterung von Webanwendungen um offene Programmierschnittstellen für
    den Datenaustausch und die Modifikation von Daten wurde das Web weiterhin verbessert.
    Plötzlich können Webanwendungen miteinander reden — sie haben sich von geschlossenen
    proprietären Websites zu einer neuen Generation von verdrahteten Geschäftsanwendungen
    entwickelt.


    Webanwendungen können eine API zur Verfügung stellen und Datenstrukturen verbar
    machen. Damit wird der Datenaustausch zwischen verteilten Server möglich. WDDX
    bietet eine Lösung zum Austausch von strukturierten Daten. WDDX besteht aus zwei
    Teilen: ein Teil der Abstraktion von Daten in einer XML-Darstellung, der sogenannten
    WDDX-Pakete, der andere Teil übersetzt Datenstrukturen in und aus einer Skriptsprache
    sowie WDDX-Pakete.


    WDDX dient nicht zum Fernaufruf von Prozeduren. Es gibt im reinen WDDX keine Möglichkeit,
    auf dem Server eine Funktion auszuführen, die ein WDDX-Paket zurückgibt. Wie Sie
    Pakete übertragen, bleibt Ihnen überlassen. WDDX verfügt daher auch über keine
    Sicherheitsfunktionen. Es ist Ihre Aufgabe, einen Kommunikationskanal auszuwählen,
    der die entsprechende Sicherheit verfügt und nur berechtigten Personen Zugriff
    auf den WDDX-Teil Ihres Systems gewährt.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 7.3.3 Mögliche Szenarien


    Ob zur Synchronisierung von Daten, zur Zentralisierung von Datendiensten oder
    zur Durchführung von Geschäftskommunikation – der strukturierte Datenaustausch
    eröffnet eine neue Dimension der Datenverarbeitung. Stellen Sie sich z.B. vor,
    dass Sie auf einer E-Commerce-Website arbeiten. Wäre nicht groß genug, dass sich
    Kunden während des Versands Paketprotokollfunktion zur Verfügung stellen. Dies
    lässt sich realisieren, wenn UPS oder FedEx eine Möglichkeit böten, eine Abfrage
    nach einem versenden Artikel zu starten. Durch Einführung von formularlagegestützten
    und kundenorientierten Diensten (die meist kurriere ihre Benutzer benötigen, den
    von Paketen zu verfolgen) wird die verteilte Datenverarbeitung (Paketprotokollierung)
    als programmierbare API würde eine neue Form der Anwendungsinteraktion ermöglichen.


    In einem anderen Szenario könnte WDDX für die Interaktion von Server zu Server
    eingesetzt werden. Diese Dienste arbeiten möglicherweise am besten auf einer Windows
    Plattform, z.B. die Abfrage eines SAP-Backend über einen COM-Schluss. Sie können
    ASP für diese Aufgabe verwenden und WDDX-Pakete an ihre PHP-Anwendung auf UNIX-Webserver
    übergeben. Dort werden die Pakete in Arrays, ohne dass eine weitere Bearbeitung
    nötig ist.


    # 7.3.4 Abstraktion von Daten mit WDDX


    Das Wichtigste zuerst: WDDX ist XML. Die möglichen WDDX-Strukturen werden in einer
    XML-DTD definiert, so dass gültige WDDX-Pakete wohlgeformt und möglicherweise
    XML-Dokumente sind. Laut Spezifikation müssen WDDX-Pakete nicht gültig sein, da
    sie Dokumententypierung im Dokumentenprotokoll benötigen.


    Der grundlegende Gedanke ist, dass WDDX die Umwandlung einer beliebigen Standardstruktur
    – Integer, Strings, Arrays – in eine XML-Darstellung ermöglicht, die der WDDX
    entspricht. Diese Daten können dann über einen Kommunikationskanal übertragen
    werden, der XML-fähig ist: HTTP, FTP, Email. Die Daten können zu jedem Zeitpunkt
    aus dem WDDX-Format wieder in diesel Sprache zurück übertragen werden. Während
    des gesamten Konvertierungsprozzesses bleiben die Daten erhalten. Wenn ein Array
    als WDDX-Paket serialisiert wird, wird er nach der Deserialisierung wieder ein
    Array sein.


    Wenn dies alles wäre, wäre es nicht sehr aufregend. Inumhin können Sie eine beliebige
    Datenstruktur in PHP mithilfe von serialize() in eine proprietäre Form umwandeln
    und sie mit deserialize() wieder in ihr ursprüngliches Format zurückwandeln, und
    das so häufig Sie wollen. Der interessante Aspekt von WDDX ist, dass die serialisierte
    Darstellung ein XML-Format ist und die'
