  md: '# Speichermodule


    Zum Lernen und Speichern von Sitzungsdaten verwendet PHP Speichermodule. Damit
    wird der Backend der Bibliothek abstrahiert. Derzeit gibt es drei Speichermodule:
    files, mm und user. Standardmäßig verwendet PHP das Mod, um Sitzungsdaten auf
    der Festplatte zu speichern. Es erstellt eine Textdatei, die nach der Sitzungskennummer
    benannt wird und legt sie in /tmp ab. Das vorgehende Beispiel zeigt den Inhalt
    der Datei folgenden aus (hierbei handelt es sich um eine serielle Darstellung
    der Variablen):


    ```

    counter|i:4;

    ```


    Wahrscheinlich müssen Sie auf diese Datei nicht direkt zugreifen.


    Wenn Sie eine höhere Leistung benötigen, ist das Mod mm im Shared Memory eine
    gute Alternative. Es speichert und nicht durch die Ein-/Ausgabewerate der Hardware
    begrenzt. Dieses Modul user wird intern verendet, um Rückrückfunktionen auf Benutzebene
    zu verzuführen, die Sie mit session_set_save_handler() definieren.


    Das wahre Potenzial in der Fähigkeit, Benutzerrufe zu Speicherm zu spezifizieren.
    Da Sie Sitzungen verwalten und trotzdem die standardierte PHP-API verwenden können,
    können Sie Sitzungen speichern wie Sie wollen: in einer Datenbank wie MySQL, in
    XML-Dateien oder auf einem entfernten FTP-Server (okay, letzter macht keinen Sinn,
    aber Sie verstehen, was wir meinen).


    Die Funktion session_set_save_handler() hat sechs Argumente in Form von Zeichenfolgen.
    Diese fungieren als Ihre Rückfunktionen. Die Funktion hat folgende Syntax:


    ```

    void session_set_save_handler(string open, string close, string read,

    string write, string destroy, string gc);

    ```


    # Serialierung von Daten


    Serialisierung bezeichnet die Umwandlung von Variablen in eine Byte-Code-Darstellung.
    Dies kann überall als normale Zeichenskette gespeichert werden. Ohne diese Funktion
    wäre beweise nicht möglich, PHP-Arrays in einer Datenbank zu speichern. Die Serialisierung
    von Daten ist sehr nötig, um Daten über mehrere Anfrage hinweg zu erhalten, eine
    wichtige Facette einer Sitzungsbibliothek. Sie können sowohl serialize() als auch
    deserialize() benutzen. Beachten Sie jedoch, dass diese Funktionen in PHP 3.0
    nicht richtig für Objekte (Klassen) funktionieren. Klassenfunktionen werden verworfen.'
