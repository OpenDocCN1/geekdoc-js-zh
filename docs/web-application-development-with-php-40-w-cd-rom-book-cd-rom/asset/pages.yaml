  md: '# Versionsverwaltung mit CVS


    Nun kann John wieder seine lokale Version mithilfe der vereinheitlichten Version
    aus dem Archiv aktualisieren und damit Bearbeitungsstufe beenden.


    Manuelle Abgleiche kommen nur selten vor, wir haben festgestellt, dass Sie meistens
    vermeiden können, wenn Sie eine entsprechende Kommunikations zwischen den Teammitgliedern
    pflegen und führen. Die seltenen Konflikte, die tatsächlich Kopfschmerzen bereiten,
    sind nahezu ausschließlich auf mangelnde Kommunikation zwischen den Entwicklern
    zurückzuführen. Dieses Problem kann dem Versionskontrollsystem der Welt fehlen.


    Nachdem Jane mit Konflikten zu tun hatte, ist sie vorsichtig geworden und möchte
    den Status der Datei f-api.write.php3 überprüfen. Deshalb gibt der CVS-Befehl
    status:


    ```

    jane@dev:/home/jane/f-api > cv status f-api.write.php3

    ```


    Durch diesen Befehl erfährt sie, dass ihre lokale Kopie die aktuelle ist. CVS
    hat folgende Statuscodes:


    | Code | Beschreibung |

    |---|---|

    | Up-to-date | Die lokale Kopie ist identisch mit der Kopie dem CVS-Server. |

    | Locally Modified | Die lokale Kopie wurde geändert, aber nicht zum Archiv übertragen.
    |

    | Locally Added | Diese Datei wurde nur im lokalen Verzeichnis hinzugefügt. |

    | Locally Removed | Diese Datei wurde nur im lokalen Verzeichnis gelöscht. | Needs
    Patch | Die Version im zentralen Archiv ist neu als die lokale Kopie, die aktualisiert
    werden müsste. |

    | Needs Merge | Die Version im zentralen Archiv ist neu als die lokale Kopie,
    die ebenfalls geändert wurde. Beide würden nach der Aktualisierung abgeglichen.
    |

    | File had conflicts on merge | Es gab einen manuellen Abgleich, und die daraus
    resultierenden Konflikte wurden nicht mehr gelöst. |

    | Unknown | Diese Datei gehört nicht zur CVS-Versionskontrolle. |


    Jede geänderte Version, die von einem Entwickler ans zentrale Archiv geschickt
    wird, erhält automatisch eine Versionsnummer. Wie wir bereits erwähnt haben, können
    Sie dadurch eine Version einer Datei wieder herstellen'
