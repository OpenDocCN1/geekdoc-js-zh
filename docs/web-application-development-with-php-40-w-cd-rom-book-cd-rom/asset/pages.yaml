    Listing 3.3: Die Include-Datei als Plugin


    Alle Plugins sind auf dieselbe Weise aufgebaut. Sie bestehen aus einem Hauptteil
    und einigen Ereignissen. Der Hauptteil läuft in PHP zwei Funktionen mit den folgenden
    Namen auf: chat_register_plugin_init() und chat_register_plugin_deinit(). Beide
    Funktionen akzeptieren als Parameter den Namen einer Funktion, die für die Initialisierung
    bzw. Deinitialisierung aufgerufen werden soll.


    phpChat fügt diese Funktionsnamen in eine interne Tabelle ein. Bei der Initialisierung
    des Chats durchlauf pHChat wird alles vollständig eingerichtet, die Initialisierungstabelle
    und wird die Initialisierungsfunktion Plugin auf, beim Verbindungsaufbau wird
    entsprechend der Deinitialisierungstabelle. Mit diesem Verfahren wird dem Plugin
    signalisiert, dass sich aktivieren bzw. deaktivieren sollen.


    Um das Programm nützlich zu sein, bietet phpChat eine Reihe von Ereignissen, an
    die sich Plugins anhängen können. Während der Initialisierung durchläuft jedes
    Plugin ihm seine Reihe von gewünschten Ereignissen schicken. Ein Ereignis kann
    der Leerlauf des Chats, die Weiterleitung einer neuen Nachricht des Benutzers,
    das Klicken auf einen Benutzernamen in der Liste der Benutzernamen oder von einem
    Netzwerk ankommende Nachricht sein und viel mehr.


    Zurzeit können die Plugins diese Ereignisse abfangen und bestimmte Aufgaben ausführen.
    Das Uhr-Plugin möchte beispielsweise wie »Leerlauf« in bestimmten Abständen das
    System prüfen. Nach einer vordefinierten Anzahl von Minuten meldet sich der Benutzer
    an.


    Für die meisten Ereignisse empfängt phpChat auch Parameter (wie etwa den Nachrichtentext).
    Diese können von den Plugins geändert werden. In der Liste 3.3 aufgeführten Plugins
    gehören beispielsweise die Plugins htmlspecialchars und link. Sie ändern die Ausgabe
