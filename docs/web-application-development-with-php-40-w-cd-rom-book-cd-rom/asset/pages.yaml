    register_globals (nur in PHP 4.0 verfügbar) auf false setzen, um ihre Programmierer
    zu zwingen, die $HTTP_*-Arrays zu verwenden.


    Sie können auch die Reihenfolge beeinflussen, in welcher Variablen dem globalen
    Namensraum hinzugefügt werden. Standardmäßig wird der Konfigurationsbefehl variables_order
    auf »EGPCB» gesetzt. Dies weist PHP an, die Variablen in folgender Reihenfolge
    zu integrieren:


    +   1. Umgebungsvariablen

    2. GET

    3. POST

    4. Cookies

    5. Interne Variablen (Servervariablen)


