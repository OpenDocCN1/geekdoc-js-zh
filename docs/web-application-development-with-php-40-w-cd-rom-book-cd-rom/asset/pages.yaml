  md: "# 9 Erweiterung von PHP 4.0: Knacken den PHP-Kern\n\nnoch die Möglichkeit,\
    \ Daten vordefinierte globale Variablen auszutauschen (hierauf gehen wir später\
    \ ein), dies sollten unter Umständen vermeiden, was von schlechter Programmierpraxis\
    \ zeugt. Ein sind in Kapitel 1 «Entwicklungskonzepte».\n\nPHP verwendet formale\
    \ Funktionsdeklarationen; dafür ist die Aufrufsyntax vollständig dynamisch und\
    \ wird nicht auf Fehler überprüft. Die Überprüfung der Aufrufssyntax bleibt dem\
    \ Benutzer überlassen. Zum Beispiel kann eine Funktion nur mit einem Argument\
    \ und ein anderes mit vier Argumenten aufgerufen werden – beide Aufrufe sind syntaktisch\
    \ absolut korrekt.\n\n# 9.11.1 Anzahl der Argumente feststellen\n\nDa PHP keine\
    \ formalen Funktionsdefinitionen besitzt, bietet die Unterstützung für die Überprüfung\
    \ der Aufrufsyntax variable Argumente bieten, muss sich manuell umfinden, mit\
    \ vielen Argumenten eine Funktion aufgerufen wurde. Hierfür können sich das Makro\
    \ ZEND_NUM_ARGS verwenden. In früheren PHP-Versionen hat dieses Makro die Anzahl\
    \ der Argumenten, mit denen die Funktion aufgerufen wurde. Als Basis dient der\
    \ Eintrag in der Hash-Tabelle der Funktion, der in der Liste INTERNAL_FUNCTION_PARAMETERS\
    \ übergeben wird. Da hat inzwischen die Anzahl der Argumente selbst angibt, an\
    \ die Funktion aufgerufen wurde, ist ZEND_NUM_ARGS zu einem Dummy-Makro entwickelt\
    \ (siehe Definition in zend_API.h). Es ist immer noch gute Praxis es zu verwenden,\
    \ um zu zukünftigen Änderungen der Aufrufe kompatibel zu bleiben.\n\n> Hinweis:\
    \ Die alte PHP-Äquivalente dieses Makros heißt ARG_COUNT.\n\nDer folgende Programmcode\
    \ überprüft die richtige Anzahl der Argumente:\n\n```\nif(ZEND_NUM_ARGS() != 2)\n\
    \    WRONG_PARAMETER_COUNT;\n```\n\nWenn diese Funktion nicht mit zwei Argumenten\
    \ aufgerufen wird, wird eine Fehlermeldung ausgegeben. Der obige Programmabschnitt\
    \ verwendet das Makro WRONG_PARAMETER_COUNT, das zur Generierung einer Standardfehlermeldung\
    \ verwendet werden kann (siehe Abbildung 9.4).\n\nDieses Makro gibt eine Standardfehlermeldung\
    \ aus, die anschließend zum Anrufer zurück wird. Diese Definition finden Sie in\
    \ zend_API.h; sie sieht folgender aus:\n\n```\nZEND_API void wrong_param_count(void);\n\
    ```\n\n```\n#define WRONG_PARAMETER_COUNT { wrong_param_count(); return; }\n```"
  merge: -1
  pgno: 393
