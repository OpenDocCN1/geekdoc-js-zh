    Auch wenn dieses Kapitel versucht, Wissen wie möglich über die innere Funktionsweise
    von PHP zu vermitteln, sodass sie verstehen, dass es unmöglich ist, in allen Fällen
    ideal für die Erweiterung von PHP zu funktionieren. PHP ist ein solcher großes
    und komplexes Paket, dass seine innere Funktionsweise nur dann verstanden wird,
    wenn sie sich mit ihm durch praktische Erfahrung vertraut machen. Deshalb möchten
    wir sie ermutigen, mit dem Quellecode zu arbeiten.


    # 9.2 Was ist Zend und was ist PHP?


    Der Name Zend bezieht sich auf die Sprachmaschine, den Kern von PHP. Der Begriff
    PHP bezieht sich auf das komplette System, wie es sich nach außen darstellt. Dies
    kann höchstens verwirrend erscheinen, aber es ist gar nicht so kompliziert (siehe
    Abbildung 9.1). Um einen Webskriptinterpreter zu implementieren, benötigen wir
    drei Teile:


    +   - den Interpreter-Teil, der die Eingabecode analysiert, übersetzt und ausführt,

    - den Funktionalitäts-Teil, der für die Funktionalität der Sprache (seine Funktionen
    usw.) zuständig ist und

    - den Schnittstellen-Teil, der mit dem Webserver spricht, unsw.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_367_0.png)


    Abbildung 9.1: Die interne Struktur von PHP'
