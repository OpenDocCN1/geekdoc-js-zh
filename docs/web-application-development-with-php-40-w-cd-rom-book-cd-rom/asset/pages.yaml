  md: '+   Electronic Code Book (ECB)- Modus sollten sich nur mit äußerster Vorsicht
    verwenden. Jede 64-Bit-Block des Klartextes wird nacheinander verschlüsselt mit
    den angegebenen Schlüssel unabhängig voneinander. Der Klartextmuster wird nicht
    verborgen. Er sich als Iterationen im verschlüsselten Text zu sehen, eignet sich
    nur für die Verschlüsselung von wirklichen Daten, z.B. einen MD5-Hash.


    +   Cipher Block Chaining (CBC) vermeidet dieses Problem, indem jeder Block vor
    Verschlüsselung XOR mit dem vorgeenen verknüpft wird. Die Verschlüsselung eines
    Blocks hängt vom vorhergehenden Block ab. Derblock kann je nach seiner Position
    in der Nachricht mit unterschiedlich verschlüsselten Blöcken führen. Da es bei
    wirklichen Startparametern für XOR auch einen Initialisierungsvektor braucht,
    ist er viel sicherer als.


    +   Cipher Feedback (CFB)- Modus ist genau anders: Der Klartext wird verschlüsselt
    und anschließend XOR mit dem vorhergehenden Block verknüpft. Der Vorteil von CFB
    ist, dass er mit Blöcken 64-Bit arbeitet und damit zur Verschlüsselung von Byte-Strömen
    verwendet werden kann.


    +   Output Feedback (OFB) Modus ähnelt dem ECB-Modus, hat jedoch einen Fehler:
    Wenn mögliche Fehler während der Übertragung auftreten, beeinflussen diese die
    Entschlüsselung von benachbarten Blöcken. Durch Ändern des verschlüsselten Textes
    kann der Klartext, wie bei ECB-Modus, allerdings verändert werden.


    In der Praxis bietet CBC die größte Verbreitung. TripleDES mit CBC-Modus bietet
    Ihnen Sicherheit, wie sie jemals in Ihren Webanwendungen gefunden wurde.


