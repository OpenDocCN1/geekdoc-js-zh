- img_proc: true
  md: "# 9 Erweiterung von PHP 4.0: Knacken wir den PHP-Kern\n\nAls Rückgabewert von\
    \ zend_get_parameters_ex() wird entweder SUCCESS oder FAILURE ausgegeben, eine\
    \ erfolgreiche (bzw. fehlgeschlagene) Argumentverarbeitung angegeben. Ein Fehlschlagen\
    \ führt wahrscheinlich auf eine falsche Angabe der Argumentanzahl zurück. In diesem\
    \ Falle sollten Sie die Funktion mit WRONG_PARAMETER_COUNT beenden.\n\nUm als\
    \ als Argument zu lesen, können Sie eine eineliche Konstruktion verwenden:\n\n\
    zval **param1, **param2, **param3, **param4;\n\n```\nif(zend_get_parameters_ex(4,\
    \ &param1, &param2, &param3, &param4) != \n    WRONG_PARAMETER_COUNT;\n```\n\n\
    zend_get_parameters_ex() überprüft nur, ob Sie versuchen, viele Parameter auszulesen.\
    \ Wenn Sie aber nur von ihnen mit zend_get_parameters_ex() abfragen, erhalten\
    \ Sie keine Fehlermeldung, sondern nur die zwei Parameter. Bei nachfolgenden Aufrufen\
    \ von zend_get_parameters_ex() werden nicht die verbleibenden Argumente ausgles,\
    \ sondern dieselben.\n\n# 9.1.3 Verarbeitung mit einer variablen Anzahl von Argumenten/optionalen\
    \ Parametern\n\nWenn Ihre Funktion eine variable Anzahl von Argumenten annehmen\
    \ soll, bieten die oben beschriebenen Codeabschnitte nochmal suboptimal Lösungen.\
    \ Für jede mögliche Anzahl von Argumenten müssten Sie eine eigene Sprache schreiben,\
    \ die zend_get_parameters_ex() aufruft. Dies ist häufig unzufriedigend.\n\nIn\
    \ diesem Falle können Sie die Funktion zend_get_parameters_array_ex() verwenden,\
    \ die die Anzahl der auszlesenden Parameter angibt, sowie ein Array, in dem Sie\
    \ diese speichern.\n\nzval **parameter_array[4];\n\n```\n/ get the number of arguments\
    \ */\nargument_count = ZEND_NUM_ARGS;\n\n/* see if it satisfies our minimal request\
    \ (2 arguments) */\n* and our maximal acceptance (4 arguments) */\nif(argument_count\
    \ < 2 || argument_count > 5) \n    WRONG_PARAMETER_COUNT;\n```\n\n/ argument count\
    \ is correct, now retrieve arguments */"
