    Informieren Sie sich über den Markt! Für dieses Programmierprojekt ist es immens
    wichtig, welche Teile bereits bereits von anderen entwickelt wurden und welche
    noch nicht sind. Erfinden Sie das Rad nicht! Besonders bei kommerziellen Projekten
    kann sich durchaus auszahlen, mehrere absurde Lösungen für bestimmte Aufgaben
    zu kaufen oder sie selbst nicht zu konzipieren und zu entwickeln. Letzteres ist
    manchmal teuer und zeitaufwendig. Außerdem werden externe Lösungen in der Regel
    verbessert. Dieser Vorgang ist absolut unabhängig von der Entwicklung Ihres eigenen
    Projekte. Wenn Sie ein Upgrade auf eine externe Fira erhalten, müssen Sie nur
    den entsprechenden Teil Ihrer aktualisieren. Auf diese Weise können Sie keine
    Teile Ihres Projek aktualisieren, ohne in die Änderungen Arbeit zu stecken. Sie
    werden zudem bestehende Bibliotheken verwenden, nutzen Sie Ihr Projekt automatisch
    auf allgemein Standards; dies ist von großem Vorteil.


    Auf der anderen Seite kann sich die Bindung an fremde Produkte natürlich auch
    als Nachteil erweisen, wenn der Hersteller sein Produkt nicht auf dem neuesten
    Stand hält oder einen Fehler enthält, der nicht korrigiert wird.


    Nach unserer Erfahrung haben sich Open-Source-Produkte als erfolgreiche externe
    Teile erwiesen. Sie werden in der Regel schnell verbessert und stützen sich auf
    allgemeine und hochlefähige Standards.


    > Übung: Suchen Sie nach Anwendungen/Bibliotheken, die in PHP geschrieben sind
