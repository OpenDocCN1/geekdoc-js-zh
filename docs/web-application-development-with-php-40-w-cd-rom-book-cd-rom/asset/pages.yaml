    \ und die Verarbeitung von Daten, ist aber keine exakte Wiedergabe der üblichen\
    \ Verwendung von XML-Parsers. Informationen werden hier nicht verarbeitet, Rohdaten\
    \ werden einfach eingelesen und Zeichenketten gescannt. Nichts, nicht auch mit\
    \ einem herkömmlichen regulären Ausdruck bemerkenswert werden könnte."
