  md: "# 2 Erweiterte Syntax\n\nWarnung: PHP 3.0 verfügt über keinen vernünftigen\
    \ Mechanismus zur Speicherbereinigung. Sobald Sie einen Wert in eine Variable\
    \ schreiben, wird nicht der Speicherbereich wiederverwendet, sondern ein neuer\
    \ Speicher zugewiesen. Mit unset() können Sie in begrenztem Maße umgehen - es\
    \ wird Speicher freigegeben, sofern nur als wiederwendbar markiert - auf lange\
    \ wird der Speicher Ihres Servers insbesondere durch langfristige Projekte. Wenn\
    \ Sie langfristige Skripte verwenden wollen, stellen Sie sicher, dass Ihre Datenbankergebnisse\
    \ beispielweise mit mysql_free_result() freigegeben und unset() auf alle Variablen,\
    \ die keine weiteren Informationen mehr enthalten. Der Speicher wird jedoch frei,\
    \ wenn das Skript endet!\n\nWir nehmen beispielsweise eine Baumstruktur. Die Klasse\
    \ zum Aufbau des Baumknotens folgt folgendermaßen:\n\n```\nclass tree_node\n{\n\
    \    var $left_child, $right_child;\n    var $value;\n}\n```\n\nDies ist nur ein\
    \ einfacher Baumknot, aber er enthält alles, was wir benötigen: eine Verknüpfung\
    \ zum linken Tochterknoten und eine Verknüpfung rechts zum Tochterknot sowie den\
    \ Inhalt dieses Knotes. Lassen Sie uns nun einen einfachen Baum konstruieren:\n\
    \n```\n$root_node = new tree_node;\n$left_node = new tree_node;\n$right_node =\
    \ new right_node;\n\n$root_node->value = 1;\n$left_node->value = 2;\n$right_node->value\
    \ = 3;\n\n$root_node->left_child = $left_node;\n$root_node->right_child = $right_node;\n\
    ```\n\nDieser Programmcode erzeugt einen Baum mit einem Stammknoten, bei dem jeder\
    \ Knoten ein anderer Wert zugewiesen wird. Die Bearbeitung des Baums könnte mit\
    \ einer Funktion wie erfolgen:\n\n```\nfunction traverse_tree($start_node)\n{\n\
    \    $node = $start_node;\n    print(\"Value is $node->value<br>\");\n```"
