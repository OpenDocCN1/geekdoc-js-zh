  md: '# Schnittstelle zum Netzwerk


    suchen, indem wir diesem Ereignis eine Verarbeitungsroutine zuteilen. Wir sollen
    wir jedoch etwas signalisieren? Im Prinzip ist das sehr einfach, wenn wir eine
