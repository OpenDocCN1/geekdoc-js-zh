    # Fehlerberichterstattung


    Wenn Sie PHP so eingerichtet haben, dass es ungültige Array-Indizes anzeigt, werden
    auch ein paar Warnungen ausgegeben. Es empfiehlt sich, die Entwicklung auf eine
    höchstliche Ebene für die Fehlerberichte zu wählen.


    Eine einfache for()-Schleife für Arrays dieser Art ist nicht ausreichend, denn
    diese Schleife greift auf Indices, denen keiner zugewiesen ist. Wenn PHP eine
    engere Umgebung bereitstellt, wird dies zum Programmabbruch und sofortigen Beendigung
    des Skripts führen. Wenn Sie den Inhalt und die Konsistenz Ihrer Arrays nicht
    genau kennen, sollten Sie each() unternicht nicht verwenden.


    each() ist auch ein gutes Werkzeug, um sicherzustellen, dass Sie auf Arrays außerhalb
    der Bereichgrenze zugreifen. Dies ist auch ein Grund für Programunterbrechungen.
    PHP handhabt Zugriffe außerhalb der Bereichgrenze auf recht große Arrays (meistens
    nur eine Warnung ausgegeben); trotzdem wird es wiederholt versucht, PHP durch
    ungültige Array-Zugriffe zum Absturz zu bringen. Im günstigsten Fall reagiert
    PHP PHP-Modul auf 100% der CPU-Zeit, und der Serverprozess muss abgebrochen werden
    – eine Situation, die in einer Produktionsumgebung unbedingt vermieden werden.
    In diesem Fall wäre dies durch eine fehlerhafte interne Routine zur Array-Bearbeitung
    in PHP verursacht. Sie sollten trotzdem keine ungültigen Array-Zugriffe provozieren.
    Es zeugt von schlechtem Programmierstil, und PHP bietet each(), list() und verwendete
    Funktionen, um Ihren Programcode zu sichern. Dies sollten Sie nutzen.


    Ursprünglich wurde each() nur auf „realen“ assoziative Arrays entwickelt, um zur
    Indexierung von Daten nicht-numerische Schlüssel zu verwenden. In diesem Fall
    ist es nicht möglich, auf die gespeicherten Daten zuzugreifen, die alle verfügbaren
    Schlüssel auflisten (sofern Sie nicht wissen, welche Schlüssel im Gebrauch sind).
    Diese Arrays'
