  md: '# Pearson Education


    # 2 Erweiterte Syntax


    tree_free_node() macht genau das Gegenteil. Es markiert den angegebenen Knoten
    als »nicht in Gebrauch«, indem es den Flag $free löscht. Dies wirft drei Probleme
    auf: Zunächst sind freie Knoten nicht wirklich frei, sie sind als frei markiert.
    Angenommen, sie wollten eine komplexe Baumstruktur mit vielen Knoten erstellen
    und anschließend ein Optimierungsprogramm darauf lassen, in der Regel die Anzahl
    der Knoten um die Hälfte reduziert und viele Geisterknoten im Array zurücklässt.
    Wir haben davon ausgegangen, dass wir 1.000 Knoten zugeordnet haben und während
    der Optimierung nur 500 von ihnen freisetzten, erhalten ein Array, das immer noch
    1.000 Knoten enthält, wobei nur 500 von ihnen als »in Gebrauch« markiert sind.
    Dies ist eine ziemliche Verschwendung von Speicherplatz. Eine automatische Speicherbereinigung
    wirft jedoch ein zweites Problem auf, nämlich Zombie-knoten. Zombieknoten wirft
    Knoten, die als »in Gebrauch« markiert sind, aber keine Verknüpfung zum Baum haben
    und daher nicht referenziert werden (siehe Abbildung 2.10).


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_91_0.png)


    Abbildung 2.10: Zombieknoten in einer Baumstruktur


    Da die Bibliothek Informationen über die Knoten in der Baumstruktur und ihre interne
    Verknüpfung enthält, lassen sich Zombieknoten sehr einfach ausmachen. Das fehlt
    jedoch im Programmcode.


    Das dritte Problem ähn dem Zombieknoten: unterbrochene Verknüpfungen. Unterbrochene
    Verknüpfungen von einem Knoten ausgehen und auf einen nicht verwendeten bzw. nicht
    existierenden Knoten zeigen (siehe Abbildung 2.11). Die Verknüpfungen werden »unterbrochen«,
    sobald Sie einen Knoten von dem Baum abtrennen, ihn als »frei» markieren bevor
    Sie alle anderen Knoten geändert haben, die auf diesen Knoten referieren.


    Auch dies lässt sich durch eine strenge Überprüfung der Bibliotheksfunktion und
    die Speicherberein beseitigen.


    92'
