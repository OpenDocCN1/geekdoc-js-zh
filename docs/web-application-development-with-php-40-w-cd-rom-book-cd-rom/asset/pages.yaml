    WDDX (Web Distributed Data Exchange) bietet viele Mittel, Programmiersstrukturen
    (Objekte, Klassen, Arrays usw.) über das Internet auszutauschen. Wir erläutern,
    warum dies sinnvoll ist, und zeigen, wie Sie dies in Ihrer eigenen Anwendung realisieren
    können.


    # 7.1 Wissensrepräsentation


    In Unternehmensumgebungen hat sich in den letzten Jahren ein klarer Trend abgezeichnet:
    von der produktbasierten Planung, hin zur kundenorientierten Strategie. Mit diesem
    Trend erlangte eine neue Technologie große Beliebtheit und Erfolg: die Wissensrepräsentation.


    Für eine Firma, die einen strategischen Vorteil gegenüber ihrem Mitbewerber haben
    möchte, ist es erforderlich, das Firmen auf eine Weise zu organisieren, in der
    es für jeden jederzeit leicht zugänglich ist. Mit dem Aufbau von Firmen-Intranets
    wurde dieses Thema aktueller denn je.


    In herkömmlichen Intranets sind Informationen häufig schwer zu finden, da sie
    auf vielen verschiedenen Seiten verteilt sind und von unterschiedlichen'
