  md: '# Über die Autoren


    Tobias Ratschiller ist Berater für neue Medien in einer italienischen Firma. Er
    verügt über umfassende Kenntnisse im Bereich Software-Entwicklung, Datenbank-Design
    sowie Content Management-Systeme und ist spezialisiert auf die Erstellung von
    umfangreichen dynamischen Websites. Er installierte einige der weltweit verbreiteten
    Websites und trug jedoch dazu bei. Seine Werke finden in mehreren Büchern und
    Artikeln über PHP, leit Seminars in ganz Europa und ist häufig Referent auf führenden
    Konferenzen.


    Till Gerken ist früher Entwickler und Berater für verschiedene Unternehmen, die
    sich auf die Erstellung von Webanwendungen für Internet-basierte Dienstleistungen
    spezialisiert hat. Er beherrscht sowohl C/C++, Pascal und x86-Assembler, mit denen
    er leistungsfähige Multimedia-Systeme, 3D-Prozessoren und Echtzeit-Prozess, generieren
    kann, als PHP und verwandte Werkzeuge zur Erstellung von mittleren bis großen
    dynamischen


    # Über den Technischen Berater


    Mit seinem unschätzbaren Praxiswissen begleitete Graeme Merrill den gesamten Erstellungsprozess
    des Buches «Web Application Development with PHP 4.0«. Nachdem das Buch geschrieben
    wurde, überprüfte er den gesamten Inhalt auf fachliche Korrektheit, Aufbau und
    Text. Er liefer wichtiges Feedback, um sicherzustellen, dass «Web Application
    Development with PHP 4.0» den Ansprüchen der Leser nach aktuellen technischen
    Informationen genügt.


    1993 sch Graeme seine Biochem-Studium ab. Bereits während der Studie entwickelte
    er das Internet, welches damals noch in Kinderschuhen steckte. Dadurch kam er
    von der Biochem zu einem Internet-Dbieter und später in ein führend Unternehmen
    für Web-Design in Neuseeland. Dort entwickelte er auch seine Fähigkeiten in PHP
    und ASP.


    Neben der Programmierung schrieb Graeme für eine regionale Zeitung in seiner früheren
    Heimatstadt in Neuseeland. Des Weiteren verfasste er mehrere Tutorials und Artikel
    über PHP für den Web Monkey von Wired Digital.


    Geboren und aufgewachsen in Neuseeland lebt Graeme heute in Sydney, wo er seinen
    eigenen Beratdienst leitet, der sich auf E-Commerce und Firmenintegration mittels
    Internet spezialisiert hat. In seiner Freizeit widmet er sich gerne der modernen
    Literatur. Musik und dem »Crocodile Wrestling«.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Über Zend Technologies, LTD.


    Zend Engine ist der Basis-Skripterstellungsprozessor, der PHP steuert. Der Prozessor
    ist Eigentum von Zend Technologies, LTD und mit der Q-Public-Lizenz für PHP zugelassen.
    Mit dem Zend-Prozessor wird PHP zu einer leistungsfähigen, zuverlässigen und benutzerfreundlichen
    Skriptoberberfläche.


    Die Geschichte von Zend Engine begann vor einigen Jahren, als die Firmengründer
    Zee Suraski und Andi Gutmans Kern-Entwicklerteam von PHP betraten. Sie entwickelten
    den Skripterstellungsprozessor von PHP, der inzwischen auf über einer Million
    Rechner installiert ist. Nach der Einführung von PHP 4.0 hat sich Zend Engine
    zu einem vielseitigen Skriptprozessor gemausert. Andi Gutmans und Zeev Suraski
    entwickeln eine Reihe von Produkten, um die Leistungsfähigkeit und den kommerziellen
    Nutzen von PHP zu erhöhen.'
  merge: -1
  pgno: 13
