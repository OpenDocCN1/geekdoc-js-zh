  md: '# 5.3 Versionsverwaltung mit CVS


    +   4. Technische Spezifikation und Entwurf der Datenbankbankruktur

    5. Implementierung (dies ist unser Thema)

    6. Qualitätssicherung

    7. Freigabe


    Wenn mehrere Entwickler am selben Projekt arbeiten, entstehen mögliche Versionskonflikte.
    Dies ist um wahrscheinlicher, wenn die Entwickler nicht im selben Gebäude, sondern
    über mehrere Gebiete und Ländergrenzen hinweg arbeiten. Was passiert, wenn zwei
    Entwickler gleichzeitig dieselbe Datei bearbeiten? Die Änderungen eines Entwicklers
    werden unweigerlich überschrieben. Was passiert, wenn das von Jens Skript nicht
    mehr funktioniert, nachdem es von Jane geändert wurde? Muss sich die Müche herauszufinden,
    was Jane geändert hat?


    Dieser Stelle macht sich Versionsverwaltung bezahlt. Die Software „einricht sich“
    an die vorhergehende Version einer ein und ermöglicht Ihnen, auf eine ältere Version
    zuzugreifen (eine Art von erweitertem Editor wiederherstellen). Außerdem benachrichtigt
    sich das Versionskontrollprogramm, wenn andere Entwickler Dateien bearbeitet haben,
    denen sie gerade arbeiten, und gibt ihnen die Möglichkeit, auf Konflikte zu reagieren.
    Schließlich merkt es sich, wenn bestimmte Vornommen


    CVS ist ein Programm, das all diese Fähigkeiten besitzt – und sogar kostenlos
    ist (Open Source). Nicht nur die Entwicklung von PHP selbst wird durch CVS verwaltet,
    sondern bekannte Webserver (Apache), das Mozilla-Projekt und KDE vertrauen auf
    CVS, um die Arbeit von Dutzenden Entwickler zu koordinieren. Auch der XML-Quellcode
    wurde mit CVS gepflegt. Die Autoren leben in Deutschland (Toll) bis Italien (Italien),
    der Verlag (Neu Riders) sitzt in den USA, der sogenannte Redaktor in Australien
    und alle greifen auf einen zentralen Datenbanknamen phpbook auf einen CVS-Server,
    der in Nordindien befindet. Zu dem Datenbank gehören alle Texte sowie einige PHP-Werkzeuge,
    die zu dienen, einheitliche Versionen der einzelnen Kapitel zu erstellen, einige
    Ressource-Dateien für XMetal (auf die wir in Kürze eingehen), die Codebeispiele
    und die Abbildungen. Auf unseren lokalen Systemen verwenden wir WinCVS oder einen
    Befehzeilen-CVS, um die Dateien zu verwalten, während wir den Text mit XMetal,
    SoftQuads XML-Editor, oder recht bequeme Art und Weise bearbeiten können.'
