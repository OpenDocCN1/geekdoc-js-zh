    | Array-Name | Inhalt |

    |---|---|

    | $HTTP_GET_VARS | Variablen aus einer GET-Anfrage |

    | $HTTP_POST_VARS | Variablen aus einer POST-Anfrage |

    | $HTTP_COOKIE_VARS | Variablen aus Cookies |

    | $HTTP_ENV_VARS | Umgebungsvariablen, z. B. $SHELL |

    | $HTTP_SESSION_VARS | Sitzvariablen |

    | $HTTP_SERVER_VARS | Servervariablen, in unserer Box $argc und $argv |


