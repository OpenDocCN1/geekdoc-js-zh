  md: '# Sagen Sie uns, was Sie denken


    Als Leser dieses Buches sind Sie unser wichtigster Kritiker und Kommentator. Wir
    schätzen Ihre Meinung und möchten wissen, was richtig war, was wir besser machen
    können und an welchen anderen Bereichen Sie sich interessiert sind. Wenn Sie möchten,
    geben Sie uns auch auf andere Weise Ratschläge.


