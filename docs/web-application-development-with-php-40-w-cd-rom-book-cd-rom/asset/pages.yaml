    der Benutzer dies wünscht (indem er explizit --enable-my-module oder

    --with-my-module angibt) – ändern Sie den Text für $PHP_MY_MODULE auf "yes":",


    ```

    if test "$PHP_MY_MODULE" == "yes"; then

    dnl Action..

    PHP_EXTENSION(my_module, $ext_shared)

    fi

    ```'
