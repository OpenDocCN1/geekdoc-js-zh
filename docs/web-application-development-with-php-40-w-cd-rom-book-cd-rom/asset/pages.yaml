  md: '# 5.1 Die PHP-Normal Form


    Wie überprüfen Sie Ihre Formulardaten? Mit JavaScript? Ein zweiten Skript für
    Aktionsverarbeitung? Möglicherweise gar nicht oder nur teilweise?


    Wie in Kapitel 4 erläutert, sollten Daten, die vom Benutzer in einem Formular
    oder einer Anfrage geschickt werden, solange «kontiniert» betrachtet werden, bis
    sie von Ihrem Programm überprüft werden. Deshalb sollten Sie die Eingaben überprüfen.
    Welches Verfahren ist hierfür?


    Eine übliche Methode ist JavaScript. JavaScript sollte jedoch die einzige Überprüfungsmethode
    sein, die Sie verwenden. Der Benutzer möchte das Sicherheitsrisiko zu vermeiden,
    das mit der Skriptsteuerung auf der Clientseite verbunden ist, oder der Browser
    unterstützt JavaScript. Im schlimmsten Fällen müssen Sie damit rechnen, dass Ihre
    Website-Benutzer die JavaScript-Funktionen deaktiviert haben. Da es auf Browser
    unterschiedliche Versionen von JavaScript geben kann, die komplizierteren Überprüfungsmethoden,
    z.B. die Überprüfung mit regulären Ausdrucken, erweist sich gar nicht zu realisieren
    oder einen Platz für den Programmierer. Ohne Sicherheit durch Fehlermeldungen
    nicht möchten Sie sich vielleicht nicht, dass der Benutzer die View-Source-Funktion
    Ihre Überprüfungsmelden in seinem Browser sehen kann.


    Wenn es sehr zuverlässig zu verwenden wäre, wäre JavaScript (oder allgemein eine
    Überprüfung auf der Clientseite) natürlich die erste Wahl. Der Hauptvorteil der
    Überprüfung auf der Clientseite besteht in der Geschwindigkeit. Die syntaktische
    Überprüfung könnte sofort erfolgen, so dass die Formulardaten nicht an den Webserver
    geschickt werden, dort analysiert und anschließend an den Browser zurückickt werden
    müssen – alles eine mühsame und langsame Prozedur. Bisher kann JavaScript jedoch
    als zusätzliche Methode für die Überprüfung auf der Serverseite dienen.


    Damit kommt PHP ins Spiel. Selbst mit PHP gibt es viele Möglichkeiten der Formularüberprüfung.
    Die meisten Benutzer werden sich für die direkte Methode mit zwei separaten Dateien
    entscheiden: eine mit dem HTML-Code des Formulars und eine mit dem PHP-Aktionsverarbeitungsskript.
    Dieses Verfahren ist traditionell für die Skripterstellung mit Perl/CGI vorgesehen
    In den meisten Fällen lernen wir dieses Szenario ab, was es für Nachteile hat:


    +   * Sie brauchen zwei separate Dateien. So richtig dies auch klingen, mag es
    zum Problem werden, wenn Sie größere Projekte verwalten, die Hunderte von PHP-Daten
    enthalten.'
