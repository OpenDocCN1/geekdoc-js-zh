    Listing 72: Entfernen von Kommentaren aus einem XML-Dokument\n\nDas Beispiel funktioniert\
    \ nur recht einfache Weise. Zunächst wird xml_parser_create() eine XML-Parserinstanz\
    \ erzeugt. In allen folgenden Funktionen verwenden wir nur diese erzeugte Parserbezeichner,\
    \ ähnlich wie wir es bei den Ergebniszeichen in den MySQL-Funktionen tun. Anschließend\
    \ wird die Standardarbeitroutine registriert und die Datei analysiert. xml_parse_from_file()\
    \ ist eine anwendungsspezifische Funktion, die wir in einer Bibliothek bereitstellt.\
    \ Diese Funktion öffnet die angegebene Datei und analysiert diese in Blöcken von\
    \ je 4KB. Die ursprünglichen XML-Funktionen von PHP xml_parse() und xml_parse_into_struct()\
    \ arbeiten mit Zeichenketten. Wenn Sie dagegen Funktionen und Routinen zum Öffnen,\
    \ Schließen und Lesen einer Datei verwenden und die Inhalte die entsprechende\
    \ Datei übergeben, können Sie Zeit und Programcode sparen.\n\nDie Standardroutine\
