  md: '# Pearson Grundlegende Webanwendungsstrategien


    Viele Softwareprojekte haben ein ähnliches Szenario. Die Entwickler sind über
    die ganze Welt verteilt. CVS eignet sich hervorragend für internet-basierte Softwareentwicklung.
    Sie ist eine Client/Server-Anwendung, die das Netz als Transportweg verwendet
    und den Quellcode zentral die einzelnen Module pflegt und verwaltet. Innerhalb
    des gesamten Datenbestandes arbeitet Jeder Entwickler muss sich für das Modul,
    mit dem er auf dem Datenbank arbeiten muss, anmelden, arbeiten aber mit der lokalen
    Version. Auf diese Weise wird ein Internetzugang erheblich reduziert, insbesondere
    wenn sie Änderungen bei Wahlleitung verwenden müssen. Wenn der Entwickler alle
    Änderungen vorgenommen hat, koppiert er die aktualisierte Datei wieder in das
    zentrale Datenarchiv. Der Rest erledigt das CVS-Programm:


    +   - Dieses weist jeder geänderte Version eine Versionsnummer zu,

    - macht für jede Änderung einen Eintrag ins Protokoll,

    - protokolliert, wenn eine Datei zur Bearbeitung ausgelesen hat,

    - und gibt eine Warnung, wenn eine andere Datei bearbeitet wird, die Sie abmelden
    möchten.


    Lassen uns eine typische CVS-Sitzung zu Beginn eines Projekts ansehen. Es arbeiten
    zwei Entwickler an der Implementierung einer API, John und Jane. Wir gehen davon
    aus, dass John einen vollständigen CVS-Server namens f-api erstellt und die CVS-Umvariablen
    in seinen Shell-Accounts entsprechend gesetzt hat (Weitere Informationen zur Installation
    auf einem CVS-Server oder Client finden Sie im CVS-Referenzhandbuch).


    Zunächst müssen beide Entwickler auf den CVS-Server anmelden und eine Kopie des
    Moduls auf ihr lokales System laden. Dies geschieht mit dem Befehl cvs checkout,
    der ein Verzeichnis erstellt, nach dem Modul benannt ist (in unserem Beispiel
    /f-api):


    ```

    john@dev:/mnt/daten/john > cvs login

    (Logging in to www.phpdev.com)

    cvs password: <password>

    john@dev:/home/john > cvs checkout f-api

    cvs server: Updating f-api

    f f-api/config.php3

    f f-api/f-api_read.php3

    f f-api/f-api_write.php3

    ```


    Nachdem beide Entwickler jeweils eine lokale Kopie des gesamten Projekts haben,
    können sie die Dateien bearbeiten. Sie haben vereinbart, dass John an f-api_read.php3
    und Jane an f-api_write.php3 arbeitet. Dies ist ein wichtiger Punkt: CVS kann
    die Absprache im Team nicht erset.'
  merge: -1
