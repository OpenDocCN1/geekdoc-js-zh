    Diese Klassen bieten eine objektorientierte Schnittstelle zu Formula-Quelle. Sie
    können Benutzereinheiten auf der Clientseite mit JavaScript überprüfen und auf
    Serverseite mit PHP-Ausdrücken. OOH Forms müssen Sie nicht direkt in HTML-Code
