  md: '# 7 Anwendungen der Spitzentechnologie


    Elements. Sie können sich auch als globale Funktion aufrufen. In diesem Fall müssen
    sie jedoch als erstes Argument die Instanz der Dokumentklasse übergeben und als
    zweites Element den Namen des Stamelements.


    Die Funktion dtd() gibt ein DTD-Objekt mit Methoden, den Klassenvariablen, sysid
    und extid zurück. Der DTD ist stets identisch mit dem Namen des Stamelements.
    Die Variable sysid gibt den Systembezeichner (z.B. docbox.dtd), während die Variable
    extid den externen oder zusätzlichen Bezeichner zurück. Zur Umwandlung der speziinternen
    Struktur in eine Zeichenkette können die Funktion dumpmem() verwenden. Die Klassenvariable
    version ist die XML-Version des Dokuments; in der Regel ist diese 1.0.


    Mit diesen Erläuterungen können wir zu einem ersten Beispiel übergehen. Konstruieren
    wir einmal das XML-Document Hello World mit LibXML:


    ```

    $doc = new_xmldoc("1.0");

    $root = $doc->add_root("greeting");

    $root->content = "Hello World!";

    print(htmlspecialchars($doc->dumpmem()));

    ```


    Damit erhalten wir folgendes wohlformertes XML-Dokument:


    ```

    <?xml version="1.0"?>

    <greeting>Hello World!</greeting>

    ```


    Das Beispiel zeigt auf eine Eigenschaft, die Sie noch nicht kennen, nämlich den
    Zugriff auf den Inhalt eines Knotenenobjekts.


