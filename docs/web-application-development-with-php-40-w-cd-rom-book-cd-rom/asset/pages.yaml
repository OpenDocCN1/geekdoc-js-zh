  md: "# 2.3 Array-Funktionen\n\nDie wichtigsten Array-Funktionen sind list(), each()\
    \ und count().\n\nlist() ist ein Operator, der eine Reihe Variablen einen l-Wert\
    \ bildet (ein Wert, der von linken Seite eines Ausdrucks verwendet wird-denken),\
    \ der sich ähnlich wie ein Element eines mehrdimensionalen Arrays wieder als eine\
    \ Entität dient. Als Argument kann er eine Liste von Variablen (ein Array-Element),\
    \ wird die Liste der Variablen, die als Argument eines Operators list() angegeben\
    \ wird, von links nach rechts abgearbeitet. Den Argumenten wird ein entsprender\
    \ Ausdruck aus dem r-Wert (einem Wert, der der rechten Seite eines Ausdrucks verwendet\
    \ werden) zugewiesen. Dies lässt sich anhand eines Beispiels erklären:\n\n```\n\
    $result = mysql_db_query($mysql_handle, $mysql_db);\n  SELECT car_type, car_color,\
    \ car_speed\n  FROM cars WHERE car_id=$car_id);\n```\n\n```\nlist($car_type, $car_color,\
    \ $car_speed) = mysql_fetch_row($result);\n```\n\n> **Hinweis:** Dieser Programcode\
    \ wird hier verwendet. Es empfiehlt sich, diesen Programcode in realistische Programme\
    \ zu integrieren, darauf darauf achten, dass die Felder in ihrer Reihenfolge bleiben.\
    \ Wenn Sie die Reihenfolge der Felder ändern, müssen sich auch die Reihenfolge\
    \ der Variablen in der Anweisung list() ändern. Die Verwendung von assoativen\
    \ Arrays und die manuelle Extraktion von Werten bedeutet einen zusätzlichen Programierungsaufwand,\
    \ führt aber zu einem stabileren Programcode. Programcode, der oben gezeigte,\
    \ sollte für Optimierungszwecke implementiert werden.\n\nDie SQL-Abfrage bildet\
    \ die Werte car_type, car_color und car_speed aus einer Tabelle mit Fahrdaten\
    \ aus. Das Ergebnis der Abfrage wird anschließend mithilfe von mysql_fetch_row(),\
    \ welches die drei Werte in einem Array zurückgibt. car_type wird an Indexposition\
    \ 0 geschrieben, car_color an Indexposition 1 und car_speed an Indexposition 2.\
    \ Diese Werte werden von links nach rechts verarbeitet und anschließend dem angegebenen\
    \ Argumenten für den Wert in der list()-Anweisung zugewiesen.\n\nDamit erhalten\
    \ Sie die folgenden Zuordnungen:\n\n| Listargument | SQL-Field |\n|---||\n| $car_type\
    \ | car_type (Array-Position 0) |\n| $car_color | car_color (Array-Position 1)\
    \ |\n| $car_speed | car_speed (Array-Position 2) |"
