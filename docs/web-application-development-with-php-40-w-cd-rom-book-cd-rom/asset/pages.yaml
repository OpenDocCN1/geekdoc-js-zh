    Elemente, Attribute, Text, Verarbeitungsbefehle usw. — Aus Sicht eines Programmierers
    können alle auf eine ähnliche Weise behandelt werden, da alle alle Knoten sind.


    Wie wir bereits erwähnt haben, können Knoten die einfachste atomare Struktur eines
    XML-Dokuments wiedergeben. Einem Knotenobjekt sind folgende Funktionen und Variablen
    zugeordnet:'
