  md: "Alle Seiten, welche die PHPLib-Authentifizierung verwenden, haben diese allgemeine\
    \ Struktur. Zunächst wird page_open() aufgerufen. Der Rest des Skripts wird erst\
    \ ausgeführt, wenn der Benutzer angemeldet und authentifiziert ist. Sie können\
    \ davon ausgehen, dass der Benutzer innerhalb von page_open() sich angemeldet\
    \ hat. Bei einem einzelnen Aufruf von page_open() wird die vollständige Benutzerauthentifizierung\
    \ in Ihrem Skript hinzugefügt. Nachdem Sie die Klassen definiert haben, die Sie\
    \ in Ihrer Anwendung benötigen, ist PHP tatsächlich so leicht zu verwenden. Nutzen\
    \ Sie die Beispiele haben bisher die Beispielklassen verwenden, welche die PHPLib-Distribution\
    \ bereitstellt. In Ihrer Arbeit möchten Sie möglicherweise Ihre eigenen Klassen\
    \ erzeugen, die von den Basisklassen abgeleitet wurden, um sie stärker an Ihre\
    \ eigenen Bedürfnisse anzupassen. Dafür ist es notwendig, dass Sie die interne\
    \ Funktionsweise von PHPLib besser verstehen.\n\n# 6.6.3 Auth-Interna\n\nWenn\
    \ wir davon ausgehen, dass Sie als Datenbank MySQL verwenden, wird für Ihre Benutzabelle\
    \ folgendes Schema verwendet:\n\n```\nCREATE TABLE auth_user (\n  user_id varchar(32)\
    \ NOT NULL,\n  username varchar(32) NOT NULL,\n  password varchar(32) NOT NULL,\n\
    \  perms varchar(255),\n  PRIMARY KEY (user_id),\n  UNIQUE k_username (username)\n\
    );\n```\n\nDer primäre Schlüssel ist user_id, da PHPLib intern nicht mit dem Benutzer-Password-Paare\
    \ des Benutzers arbeitet, sondern mit dieser ID. Diese ID (die bei PHPLib heißt)\
    \ ist eine eindeige Zeichenfolge, vergleichbar mit der Session-ID, die aus einer\
    \ Kombination von uniqid() und md5() erzeugt wird.\n\n```\n$id = md5(uniqid($hash_secret));\n\
    ```\n\nWarum verwendet PHPLib nicht einfach einen primären Schlüssel, der sich\
    \ aus den Feldern username und password zusammensetzt? Auf diese Weise könnte\
    \ man sich das zusätzliche Feld user_id sparen. Die Antwort ist: PHPLib soll für\
    \ jeden beliebigen Authentifizierungsprozess einsetzbar sein und den Verbindungsaufbau\
    \ so einfach wie möglich halten. Wenn Sie jeden Benutzer einen separaten eindeutigen\
    \ Besitzer fester Länge benötigen, können Sie sich zusätzliche Tabellen erstellen,\
    \ die über eine relationale Datenbank mit der auth_user-Tabelle verknüpft werden."
