    Codes. Die Funktionen der Routine werden einfach einfach ein hübsch formatierte
    Ausgabe als Sheet zu erzeugen. Der einzige bemerkwerte Teil des Codes ist der
    folgende:


    ```

    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);

    ```


    Dieser Befehl deaktiviert die Großierung, d . h der Parser wird angewiesen, die
    Groß-/Kleinschreibung von Elementen beizubehalten. Diese Option ist aktiviert,
    werden alle Elementen in Großbuchstaben umgewandelt. In der Regel werden Sie diese
    Funktion nicht wollen, da in XML die Schreibweise für Elementen von Bedeutung
    ist.


