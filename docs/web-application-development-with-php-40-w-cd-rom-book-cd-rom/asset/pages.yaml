  md: '# 8.3.7 PHP-Serverintegration


    Da die PHP-Bibliothek von MarketPlayer.com permanent verändert wird, wurde der
    Apache-Server für lathe Module kompiliert, und eine Shared-Object-Implementierung
    für PHP erzeugt. XML wird nicht für die Inhalte, sondern nur für interne Konfigurationsdateien
    verwendet. Die GNU-Mechanismen autoconf und configure wurden auf verschiedenen
    Plattformen für Entwicklungs- und Produktionsstocks eingesetzt. Nahezu der gesamte
    MarketPlayer.com-Quelle ist entweder herkömmlicher proprietärer Code oder Open-Source-Code.
    Die Datenbankinfrastruktur setzt sich aus MySQL zusammen, und Velocis für die
    Funktionen verwendet. Die Effizienz von Velocis gegenüber anderen Datenbanklösungen
    muss sich erst noch zeigen. Bisher scheint sich jedoch bei dem vorhandenen Programcode
    das Netzwerkedell relationalen Varianten zu behaupten. Dies ändert sich leicht,
    wenn die Migration auf die neue Technologie fortgeschritten ist.


    # 8.3.8 Codeverwaltung


    Die Entwickler, die bei MarketPlayer sind, arbeiten für den Inhalt des Content
    Management Systems unter Windows NT mit der Versionskontrolle Source Safe. Mit
    der neuen Technologie wird der gesamte Code unter CVS gespeichert. Sobald die
    Redaktionsarbeit die notwendigen Tools hat, unter Linux arbeiten zu können, soll
    der Code in CVS zurückgespeichert werden.


    Produktmanager stellen Entwicklungsteams zusammen, um das Design festzlegen, den
    Codestruktur und die Implementierung durch Teammitglieder überwachen. Anschließend
    wird ein Prototyp entwickelt und als Alphaversion freigegeben und in CVS eingeplant.
    Alle Komponenten werden anschließend an die anderen Entwickler verteilt und durch
    den Produktmanager auf Sicherheit, Effizienz und Design überprüft. Nachfolgende
    Versionen unterscheiden sich durch neu hinzugefügte Funktionen, Fehlerbehebungen
    und Verbesserung des Designs. Designers sind spezialisiert und auf bestimmte Aufgaben
    ausgerichtet. Damit können sie schnell auf die Bedürfnisse des Unternehmens reagieren.


    Während der Entwicklung von Prototypen sind die Schnittstellen der Elemente in
    PHP noch relativ direkt im Code enthalten. Sobald die Module hinzugefügt werden,
    muss die Parameterierung und die Funktionsnklatur festgelegt werden, ohne dass
    der Code massiv umgeschrieben werden muss. Ausstehende Funktionen können in PHP
    leicht implementiert oder in der Entwicklungsumgebung umgangen werden. Firmenexterne
    Funktionen fügen sich nahtlos in PHP ein. Dies begrenzt das Design auf den Zeitraum
    der Prototypentwicklung und verhindert, dass sich Verzögerungen auf andere Entwickler
    auswirken.'
  merge: -1
