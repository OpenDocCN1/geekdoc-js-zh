    \      break;\n    case FT_ZIP_ARCHIVE: /* handle ZIPs here */\n      break;\n\
    }\n```\n\n> Hinweis: Mit dem Begriff spezielle Werte meinen wir »magische Nummern«\
    \ oder spezielle Zeichenfolge. Wenn Sie beispielsweise aus Ihrem Programm auf\
    \ eine GIF-Datei zugreifen und Ihr Programm intern GIF durch die »magische Nummer«\
    \ 6 erkennt (weil dies der Programmierung auch 1234 sein könnte), können Sie mit\
    \ define(\"GIF_FILE\", — 6) für diesen Wert eine Definition erzeugen und zukünftig\
    \ auf Ihre »magische Nummer« mit dem Schlüsselwort GIF_FILE zugreifen."
