  md: '# Datenbankzugriff mit PHP


    Wenn Sie mit den Werkzeugen des Zimmermanns spielen, besteht die Möglichkeit,
    dass sich in die Hand zu schneiden.


    Datenbanken gehören zum täglichen Handwerkszeug eines Webentwicklers. Dieser sollte
    SQL zumindest genauso gut kennen wie PHP. Bei den meisten Datenbankmodellen von
    Webanwendungen ist eine relationale Datenbank im Spiel. Während unerahrene Benutzer
    möglicherweise versuchen, den Overhead, den SQL und ein relationales Datenbankverwaltungssystem
    (RDBMS) mitzubringen, um umzugehen, werden erfahrene Techniker einlicher Funktion
    schätzen. Such- und Sortierfunktionen oder Beziehungen zwischen verschiedenen
    Datensätzen, können schnell zum Alptraum werden, wenn Sie herkömmliche Speichermethoden,
    mit zweidimensionalen Dateien oder Arrays, verwenden. Datenbanken sind auf die
    effiziente Organisation und Abfrage von Daten spezialisiert und in den meisten
    Fällen es keine Notwendigkeit, diese in Pseudo-Datenbanken zu imitieren.


    Dieses Kapitel zeigt Ihnen, wie Sie mit PHPLib auf Datenbanken zugreifen, und
    beschreibt die zahlreichen Funktionen dieser Bibliothek: Authentifizierung von
    Benutzern und Verwaltung von Zugiffsrechten.


    # 6.1 PHPLib: Die PHP-Basisbibliothek


    Wie im Buch bereits erwähnt wird, kann PHPLib von der täglichen Programmierarbeit
    einen erheblichen Teil der Arbeit übernehmen. Einige Punkte zeigen auf die Entwicklung
    von Webanwendungen immer wieder auf: Sitzungsverwaltung. Genehmigung, und Trennung
    von Layout und Programmcode. PHPLib besteht aus einem festen Satz von Objekten,
    die Lösungen für diese unerlässlichen Aufgaben bieten.


    Für viele Programmierer wirkt PHPLib einschüchternd, wenn sie die Dokumentation
    und die Beispiele betrachten. Tatsächlich besteht die Bibliothek aus einem recht
    komplexen Satz von Klassen, und die einzelnen Objekte hängen auf ganze Weise voneinander
    ab. Sobald Sie die Installation erfolgreich gemeistert und Ihre eigenen Basisklassen
    geschrieben haben, werden Sie feststellen, dass es gar nicht so schwierig zu verwenden
    ist und die Beispiele direkt und leicht zu verstehen sind.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'PHPLib können Sie unter http://phplib.netuse.de/ herunterladen. Seine Dokumentation
    enthält ausführliche Installationsanweisungen, dass wir hier nicht weiter darauf
    eingehen. Wir gehen davon aus, dass Sie korrekt eingerete PHPLib-Umgebung haben,
    bei welcher jedes Skript automatisch prepend php3 vorausstellt. Wir geben hier
    keine Beschreibung der einzelnen Funktionen und Parameter, die in der Dokumentation
    nachzuholen sind. Statt dessen zeigen wir den großen Rahmen und erklären PHPLib
    mit eigenen Wort.


    # 6.1.1 Entstehung


    Die erste Version von PHPLib wurde 1998 von Boris Erdmann und Kristian Koelhohtt
    entwickelt. Während wir in Kiel einem Internetanbieter einem großen Projekt arbeiteten,
    stellen wir fest, dass sich immer wieder diesen Proceduren programmierten. Sie
    fanden die Art, Probleme zu lösen, sich mehr zufriedenzustellen.


    Wir brauchten beispielsweise eine Anmeldeprozedur, die nicht auf der HTTP-Authentifizierung
    basierte, da dieses Genehmigungsverfahren sich nicht benutzerfreundlich. Für eine
    korrekte Genehmigung brauchten wir eine funktionierende Sitzungsverwaltung (die
    wir in Kapitel 4 »Webanwendungskonzepte» hervorgehoben haben). Als begannen sie,
    objektorientierte Bibliothek für die Sitzungsverwaltung und -genehmigung zu entwickeln,
    die sich auf ein Konzept für die Sitzungsverwaltung kamen in der Zeit immer mehr
    Leute Hause, und das Projekt wuchs schnell. Zwischen verfügt PHPLib über Module
    für viele Aspekte der Genehmigung- und Sitzungsverwaltung, und beschied verschiedene
    Verfahren, um HTML-Eingabformulare, Tabellen und Baumstrukturen zu erstellen.


    # 6.1.2 Vorteile und Nachteile


    Wie wir in Kapitel 1 »Entwicklungskonzepte» erläutert haben, sollten Sie Werkzeuge
    sorgfält nutzen. PHPLib eignet sich für Projekte, die mehr als zwei Tage Arbeit
    benötigen. Bei der ersten Verwendung der Bibliothek müssen Sie jedoch zunächst
    mit Mehrarbeit rechnen: wir brauchten Zeit, die Dokumentation zu lesen, die Konzepte
    zu verstehen und Ihre Fehler zu beheben.


    PHPLib scheint ideal für Projekte mit mehr als einem Softwareentwickler zu sein.
    Er zwingt Programmierer, ähnliche Schnittstellen zu verwenden, und fördert objektorientierte
    Programmierung, die die Struktur verbessert. Da PHPLib zudem ein tiefes Verständnis
    von PHP und Webanwendungen im allgemeinen vorausgesetzt, befinden sich die Entwickler
    im Team auf einem vergleichbaren Wissensniveau.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'PHPLib ist in rein PHP geschrieben, wodurch es nicht ganz so schnell ist wie
    eine C-Erweiterung von PHP. Auf der anderen Seite wird es dadurch viel flexibler.
    Die Bibliotheken sind als Klassen definiert; dadurch lassen sie sich leicht an
    Ihre Bedürfnisse anpassen. Tatsächlich werden Sie einige Änderungen vornehmen
    müssen: PHPLib ist kein Produkt, das sich einfach auspacken und sofort benutzen
    kann. Sie sollten darüber im Klaren sein, dass einige Funktionen bereitstellen
    müssen.


    Die einzelnen PHPLib-Klassen sind auf komplexe Weise Sitzungsfunktionen miteinander
    verwoben; können Sie beispielsweise die Datenbank-Abstraktionsschicht der Bibliothek
    verwenden. Wenn Sie nur eine Sitzungsverwaltung benötigen, empfiehlt es sich möglicherweise,
    die Sessionfunktion von PHP 4.0 oder unseren PHP 3.0-Backport zu verwenden. PHPLib
    verfügt trotzdem über einige Funktionen, die Ihnen das Leben definitiv einfacher
    machen können.


    # 6.1.3 Wichtige Dateien


    In der PHPLib-Distribution gibt es zwei Dateien, die Sie wahrscheinlich ändern
    müssen: local.inc und prepend.php3.


    Die Datei prepend.php lädt die Datei, die auf allen Seiten verfügbar sein soll,
    wenn Sie PHPLib verwenden. Standardmäßig ist der Datenbank-Backend für MySQL verwendet
    und verwendet zur Sitzungsverwaltung des SQL-Speicherbehälters. Um beispielsweise
    von MySQL auf Postgres zu wechseln, müssten Sie folgende Werte ändern:


    ```

    require($PHPLIB["libdir"] . "db_mysql.inc"); /* Change this to match your database.
    */

    ```


    und anstelle von db_mysql.inc fügen Sie db_pgsql.inc ein.


    Wenn Sie andere klass aus PHPLib verwenden möchten (beispielsweise die Klasse
    Template), sollten Sie diese besser in prepend.php3 einfügen.


    Die Datei local.inc befindet sich im Verzeichnis, in welchem die Anpassung von
    PHPLib stattfindet.


    # 6.1.4 Anpassung von PHPLib


    In den meisten werden die Basisklassen von PHPLib nicht direkt verwendet. Statt
    dessen verwenden Sie Ihre eigenen, abgewandelten Klassen, welche auf Ihre Umgebung
    abgestimmt sind. Standardmäßig werden einige Klassen mit PHPLib mitgeliefert,
    welche wir später in unserem Beispiel verwenden werden. Wir machen einige Annahmen
    über Ihr System, z.B. dass Sie MySQL verwenden. Wenn diese Annahmen auf Ihre Anwendungen
    nicht zutreffen, sollten Sie die entsprechenden Änderungen in der Datei local.inc'
