- img_proc: true
  md: '# 5 Grundlegende Webanwendungsstrategien


    wir ein Beispiel. Angenommen, Sie haben ein serverwachchendes Programm, das in
    regelmäßigen Abständen überprüft, ob ein Server noch arbeitet, und die gesammelten
    Daten protokolliert. Daneben haben Sie einen Frontend mit schönen Statistiken
    und ein wenig Programmlog, der reagiert, wenn der Server nicht mehr erreichbar
    ist. Außerdem ist die Software nur als Backend, welche die tatsächliche Überwachung
    übernimmt. Sagen wir, ServerSpy.dll eine Funktion is_reachable() enthält, die
    das Argument vom Server akzeptiert und true zurückgeben, ist ansonsten falsch.


    Bisher haben wir nicht definiert, welche Art von Server wir überwachen wollen.
    Es könnte ein Webserver, Mailserver oder jedes andere System sein. Die Funktionsdeklaration
    selbst und das Backend müssten nicht geändert werden. Der einzige Teil, angepasst
    werden müsste, wäre die Implementierung der Funktion is_reachable().


    Mit DLLs können Sie genau einen Überwachungsdienst auf Ihrem System installieren:
    entweder einen Webserver oder einen Mailserver usw. Sobald Sie eine weitere DLL
    installieren, wird diese die vorherige überschreiben.


    Der Kunde könnte in Ihrer Anwendung nicht zwischen verschiedenen Überwachungsversionen
    eines Dienstes vom System wählen. Sie könnten auch nicht verschiedene Softwarehersteller
    eine bessere Version von ServerSpy.dll verkaufen und diese an Ihren Kunden überschreiben.
    Sofern die neue Funktion genauso wie die alte funktioniert, ist dies großartig,
    andernfalls würde Ihr Programm den Dienst einstellen.


    Ein gutes Komponentenmodell würde Probleme zu lösen. COM bietet die Möglichkeit,
    Komponenten eine globale, eindeutige ID (GUID) zu kennzeichnen, damit Sie verschiedene
    Dienste gleichzeitig verenden können. Das Betriebssystem kennt alle installierten
    Komponenten, und Ihr Programm könnte in der Kategorie ''Serverversion-Überwachungsdienste''
    abfragen. Außerdem bietet COM eine Versionskontrolle, mit der sich Versionen einer
    Kom auf dem System einsetzen können, ohne sich diese gegenseitig behindern.


    Schließlich verfügt es über eine Komponenten-Introspektion, mit der Sie Methoden
    und Eigenschaften einer Komponente sehen können.


    Möglicherweise haben Sie schon von ActiveX-Steuerelementen gehört. ActiveX-Elemente,
    die auch als OLE-Elemente oder durch Microsoft kreativer Marketingabteilung als
    OCX verbreitet werden, sind nichts anderes als eine Anwendung der COM-Komponenten.
    Sie haben einen reduzierten Satz an COM-Schnittstellen, der kleiner und besser
    für Netzwerke mit hoher Latenz geeignet sind. Sie können die ActiveX-Element nahezu
    verwenden wie die von ausgestatteten COM-Elementen.'
