  md: '# Datenbankabstraktion


    +   - In Bezug auf Funktionen ist CT_Split_Sql identisch mit CT_Sql. Verwenden
    Sie diese, wenn die zugrunde liegende Datenbank nicht genug Daten im Feld für
    die Session-Daten speichern kann, insbesondere wenn die Datenbank Probleme mit
    großen binären (BLOBs) hat. CT_Split_Sql ist nicht mit den Tabellen von CT_Sql
    kompatibel.


    +   - Mit der Variablen $split_length können Sie die Länge festlegen, an die Klasse
    Session-Daten kennt. Der Standardwert hierfür ist 4096 (KB).


    +   - CT_Shm speichert Session-Daten im gemeinsamen Speicher, sogenannten Shared
    Memory. Um diesen Container zu verwenden, müssen Sie PHP mit Unterstützung für
    den gemeinsamen Speicher kompilieren. Dieser Container ist schneller, da er Session-Daten
    direkt im Speicher verfügbar macht. Der Nachteil ist, dass alle Session-Daten
    verloren gehen, wenn Sie Ihren Server neu starten. Außerdem ist die Anzahl gleichzeitig
    offenen Sessions durch die Speicherkapazität begrenzt. Jeder Session beansprucht
    einen gewissen Speicherplatz (die Höhe hängt von der Menge und Größe der Sitzungsvariablen
    ab), sobald der verfügbare Speicher belegt ist, können keine weiteren Sitzungen
    gestartet werden.


    Folgende Klassenvariablen unterschieden sich von jenigen von CT_Sql:


    | Variable | Beschreibung |

    |---|---|

    | $max_sessions | Anzahl gleichzeitig aktiver Sessions. Der Standardwert ist 500.
    |

    | $shm_key | Eindeutiger Schlüssel für das Segment des Shared Memory, der verwendet
    werden soll. Es ist wichtig, dass dieser Schlüssel für jede Anwendung eindeutig
    ist. |

    | $shm_size | Größe des Shared Memory in Bytes. Die Größe lässt sich ungefähr
    der Form shm_size = session_size berechnen, welche die Session-Größe bis 600 Byte
    groß sein kann. Der Standardwert ist 64000 (64KB). |


    +   - CT_Dbm speichert zur Speicherung der Session-Daten die UNIX DBM. Diese Datenbank
    speichert Daten als Schlüssel/Wert-Paare in regulären Dateien auf dem System.
    Eine einzige Variable sollten Sie $dbm file setzen; diese gibt den Dateamen Ihrer
    DBM-Datei an. Die Datei muss die entsprechenden Rechte haben, und der Server braucht
    einen Schreibzugriff auf diese.


    +   - CT_Ldap speichert Session-Daten auf einem LDAP (Lightweight Directory Access
