  md: "# Basisschnittstellen\n\nAlle oben genannten Objekte sind die Schnittstellen\
    \ Node, die den primären Bastyp des DOM darstellt. Er erstellt einen einzelnen\
    \ Knoten der Dokumentverzeichnisstruktur. Die Schnittstelle Node definiert die\
    \ Attribute und Methoden, die am häufigsten verwendet werden, wenn Sie mit dem\
    \ DOM arbeiten. Um ein Dokument zu durchsuchen, würden Sie das Attribut childNodes\
    \ verwenden, das alle Tochterknot enthält, sowie das Attribut nextSibling, den\
    \ nächsten Knoten auf der gleichen Ebene enthält. Um Verzeichnisstruktur zu ändern,\
    \ können Sie Methoden wie appendChild() und removeChild() verwenden.\n\nDie eigenen,\
    \ die nicht direkt der Schnittstelle Node abgeleitet werden, sind CDATASection,\
    \ Text und Comment. Text und Comment werden von der Schnittstelle CharacterData\
    \ erweitert und um eine Reihe von Attribut- und Methoden für den Zugriff auf Zeichendaten.\
    \ Mit substringData() können Sie beispielsweise einen Teil der Zeichendaten extraieren.\n\
    \n# Beispiel: Analyse eines kurzen Dokuments mit dem DOM\n\nDen besten Eindruck\
    \ bekommen Sie die konkrete Funktionsweise des DOM, indem wir uns ansehen, wie\
    \ ein einfaches XML-kompatiblen Dokument von einem DOM-kompatiblen Prozessor verarbeitet\
    \ wird. Dazu erstellen wir ein kurzes Dokument:\n\n```\n<?xml version=\"1.0\"\
    ?>\n<!DOCTYPE book SYSTEM \"docbookx.dtd\">\n<book>\n  <title>\n    Cutting-Edge\
    \ Edges\n  </title>\n  <para language=\"en\">\n    Sample paragraph.\n  </para>\n\
    </book>\n```\n\nEine DOM-Repräsentation dieses Dokument wird in einer hierarchischen\
    \ Struktur wie in Abbildung 7.5 organisiert. In einer DOM-kompatiblen API sollte\
    \ der Code so ähnlich aus wie der folgende Pseudocode:\n\n```\n// Construct Document\
    \ class instance\n$doc = new Document(\"file.xml\");\n\n// Output the root element's\
    \ name\nprintf(\"Root element: %s<p>\", $doc->documentElement->tagName);\n\n//\
    \ Get all elements below the root node *\n```"
