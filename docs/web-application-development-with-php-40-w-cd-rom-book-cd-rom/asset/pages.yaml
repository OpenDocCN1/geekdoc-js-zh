  md: 'Denken Sie noch einmal über die Wichtigkeit dieser Forderung nach. Möchten
    Sie, dass ein Programm so konzipiert wird? Brauchen Sie dies überhaupt? Überlegen
    Sie sich, wie Sie dies realisieren können.


    # 3.5.6 Schnittstelle zum HTML-Entwickler


    Im Falle der HTML-Schnittstelle wird die Trennung von Programmcode und Layout
    über Schablonen. Dies ist nicht der einfachste Weg, ein Programm an Ihre Bedürfnisse
    anzupassen, sondern auch der leistungsfähigste. Innerhalb von Sekunden lässt sich
    die Struktur und das Aussehen verändern, ohne eine einzige Programzeile ändern
    zu müssen. Jeder, der über grundende HTML-Kennisse verfügt, kann die Art und Weise,
    wie sich ein Programm beim Benutzer präsentiert. Da wir dies Verfahren an einer
    anderen Stelle im Buch ausführlich besprechen, möchten wir hier nicht näher darauf
    eingehen. Wenn Sie Einzelheiten über die Verwendung von Schablonen erweitern wollen,
    lesen Sie Kapitel 5 „Grundlegende Webanwendungsstrategien".


    # 3.5.7 Schnittstelle zum Programcodeentwickler


    Die Bereitstellung einer Schnittstelle für andere Entwickler ist in der Regel
    mit dem Begriff „API“ (Application Programming Interface) verknüpft. Eine API,
    also eine Anwendungsprogrammierschnittstelle, wird normalerweise von Bibliotheken
    bereitgestellt, aber nicht von vollständigen Programmen. Programme, die sich durch
    einen Programmierer erweitern lassen, sind jedoch sehr erfolgrereicher, als Programme,
    die »wie vorliegend“ verwendet werden müssen. Im Fall von PHP-Anwendungen kann
    natürlich jeder schrecken jedoch zurück, ein komplexes System zu analysieren und
    Änderungen daran durchzuführen. Daher muss das Programm selbst genügend Möglichkeiten
    zur Erweiterung bieten.


    > Hinweis: Wir unterscheiden hier zwischen „Anwendung“ und „Bibliothek“. Unter
    „Bibliothek“ verstehen wir Programme, die nicht eigenständig ausgeführt werden
    können und in der Regel leichter erweitern lassen als Anwendungen. Anwendungen
    bestehen aus einem vollständig geschlossenen System.


    Finden Sie heraus, wie Sie herkömmliche Programme erweitern können. Prüfen Sie
    beispielweise bei Ihrem bevorzugten Textverarbeitungswerzeug, ob der Entwickler
    eine Möglichkeit vorgesehen hat, die Funktionalität des Programms zu erweitern.'
