    Wahrscheinlich kommt Ihnen etwas Folgendes im Sinn: Dies ist eine Schnittstelle,
    die eine »gewöhnliche« Liste von Parametern akzeptiert, nämlich-lich das Datum
    als Tag/Monat/Jahr-Variablen und die Zeit in Form von Stun-'
