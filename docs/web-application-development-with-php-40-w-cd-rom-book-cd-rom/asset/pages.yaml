  md: '# 4.1.3 Manuelle Änderung der URL


    Eine weitere Alternative, um die Sitzungskennummer zu verbreiten, ist, die URL
    manuell zu ändern. Damit lassen Sie die Sitzungskennummer entweder über GET/POST
    weiter oder "stecken" sie im URL. Dazu müssen Sie die HTML-Tags frame, form und
    a ändern, um auf Ihre ID zu referenzieren:


    ```

    // A source frame definition

    printf(''<a frame src="page.php3?session_id=%s">'', $session_id);


    // A hidden form

    printf(''<input type="hidden" name="session_id" value="%s">'', $session_id);


    // A normal link

    printf(''<a href="page.php3?session_id=%s">Link</a></a>'', $session_id);

    ```


    Wenn Ihr Programm Abbildungen, eingebettete Frames oder JavaScript-Umleitungen
    enthält, müssen Sie diese ebenfalls ändern.


    Die Änderung der URL hat folgende Nachteile:


    +   - Sie bedeutet einen beträlichen Mehrawand für Sie als Entwickler. Sie müssen
    die Sitzungskennummer für alle Verknüpfungen manuell hinzufügen. Wenn Sie nur
    eine einzige Verknüpfung vergessen haben, geht die Sitzung des Benutzers verloren.

    - Es zeigt, dass viele Seiten erstellt werden. Einige Suchmaschinen werden sich
    weigern, die Seiten überhaupt zu indizieren. Andere schneiden dann alles nach
    dem Fragezeichen von der URL ab.

    - Die Sitzungskennummer wird in den Lesezeichen und Ausdrücken des Benutzers hinzugefügt.
    Wir kennen keine Artikel in technischen Fachzeitschriften, die die Sitzungskennummer
    als Website als Referenz angeben.. Benutzerfreundlichkeit lässt sich, dass es
    für Benutzer schwieriger wird, die URL manuell zu ändern, bestimmte Ressourcen
    auf einer Website zu finden.

    - Die Sitzungskennummer wird in Proxy-Server protokolliert und ist in der CGI-HTTP_REFERER
    für andere Websites sichtbar.


    # 4.1.4 Dynamische Pfade


    Lassen Sie uns, ob wir einige der Nachteile vermeiden können, die Sie bei der
    Neuschreibung der URL erhalten. Zuerst können Sie die ID URL in der Amazon.com-Weise
    hinzufügen (siehe Abbildung 4.1). Diese sehen dann so aus: http://server.com/page.php3<?session-id=>.
    Auf diese Weise ist die Sitzungskennummer ein Teil des Pfads zum Skript, und Suchmaschinen
    und Spider wirkt die URL wie eine statische Seite. Das funktioniert, weil der
    Webserver weiß, dass page.php3 ein Skript ist und in der URL nicht'
