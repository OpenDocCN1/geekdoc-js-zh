  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    ich auch bei der datenbankgestützten Lösung. Diese allerdings nicht das Problem
    der Protokollhandhabung. Viele Datenbanken werden direkt von PHP unterstützt,
    um netzwerkliche Chat-Boxen zu erhalten, brauchen wir lediglich ein Werkzeug,
    das Chat-Boxen synchronisiert kann (sofern nicht einen zentralen Datenbank-Server
    einrichten möchten, auf den alle Boxen gleichzeitig zugreifen können).


    Für würden Sie sich entscheiden?


    Antwort: phpChat basiert auf IRC und wird aus folgenden Gründen:


    +   * Für eine Datenbank benötigen würden eine Art von »propropriären« privatem
    Protokoll, das nicht mit anderen Standardssystemen kommunizieren könnte. In Zeiten
    plattformübergreifender Systeme wäre dies nicht von Vorteil.


    +   * Eine IRC-Bibliothek, die gut funktioniert (nälich phpIRC), abstrahiert den
    Zugriff auf IRC-Netwerke durch eine Reihe von leicht zu verwendenden API-Funktionen
    und setzt damit die IRC-Verwaltung in Bezug auf die Komplexität des Programms
    auf die gleiche Stufe wie Datenbankverwaltung.


    +   * Eine bereits vorhandene IRC-Serversoftware handhabt alle kleinen und großen
    Probleme der Benutzerverwendung, der zuverlässigen Datenverkehrs, Routing usw
    zwischen Netzwerken. Die Software ist bereits seitem und hat sich bewährt. Außerdem
    ist sie für alle Systemtypen verfügbar.


    +   * IRC ist extrem skalierbar. Wenn Sie aufgrund von unvorhergesehenen Ereignissen
    auf Server A zu Spitzenzeiten eine zu hohe Belastung haben, schalten Sie einfach
    Server B hinzu und errichten dynamisch eine Serverbindung zu dem bestehenden Chat
    ( und der Vorgang vollautomatisch. Damit haben Sie einen weiteren Server mit genügend
    Kapazität für zusätzliche Benutzer.


    # 3.3 Grundlagen des IRC-Netzwerks


    Nachdem wir einen Kommunikationsstandard für den Chat ausgewählt haben, möchten
    wir den Aufbau des IRC-Netzwerks genauer ansehen.


    Idealerweise sollten Sie die IRC-Netzwerkgrundlagen, die in diesem Abschnitt besprochen
    werden, durcharbeitet haben, bevor Sie sich für IRC entscheiden. Es ist immer
    schlecht, sich herausfinden, dass IRC die Struktur komplierter macht, nachdem
    Sie sich entschieden haben. Bisher sind wir jedoch von einem »allgemeinen Verständnis«
    über IRC-Netzwerke ausgegangen und haben die Programmplanung in den Vorder gestellt.'
