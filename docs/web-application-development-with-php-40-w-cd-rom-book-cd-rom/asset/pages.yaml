    # ### 9.18.3 Ausgabe einbinden in phpinfo()


    Nachdem Sie ein reales Modul eingebunden haben, möchten Sie möglicherweise Informationen
    über das Modul in phpinfo() ausgeben (zusätzlich zu den Moduln, der standardmäßig
    in der Modulliste erscheint). Mit der Funktion ZEND_MININFO() können Sie in der
    phpinfo()-Ausgabe einen eigenen Abschnitt erzeugen. Diese Funktion sollte in den
    (bereits besprochenen) Desriptor des Moduls eingefügt werden. Sie wird abgerufen,
    wenn ein Skript phpinfo() aufruft.


    Wenn Sie die Funktion ZEND_MININFO angeben, gibt phpinfo automatisch einen Abschnitt
    phpinfo() einschließlich des Modulnam in der Überschrift. Alles Andere müssen
    Sie selbst formatieren und ausdrucken.n der Regel können Sie mithilfe von php_info_print_table_start()
    einen HTML-Tabellenanfang ausdrucken, und anschließend die Standardfunktionen
    php_info_print_table_header() und php_info_print_table_row() verwenden. Als Argumente
    geben Sie die Anzahl der Spalten (als Integer) und den Spalteninhalt (als String)
    an. Listing 9.14 zeigt ein Beispiel für eine Quellecode. Abbildung 9.9 zeigt die
    Ausgabe. Um den Tabellenfuß auszugeben, verwenden Sie php_info_print_table_end().


