    # 1.3.4 Auswahl von sprechenden Namen


    Wie bereits erwähnt ist die Auswahl für eine Variable oder Funktion ein wichtiger
    Punkt in der Programmierung. Allgemein sollten Sie zunächst berücksichtigen, ob
    es sich um eine lokale oder globale Variable handelt. Wenn die Variable nur im
    lokalen Umfeld einer Funktion aufwird, wählen Sie einen kurzen, präisen Namen,
    der den Inhalt oder die Bedeutung dieser Variablen wiedergibt. Der Variablenname
    sollte aus maximal zwei Wörtern bestehen, die durch einen Unterstrich oder Großbuchstaben
    voneinander getrennt sind. Betrachten Sie hierzu Listing 1.8.


    ```

    $counter

    $next_index

    $rOptions

    $cookieName

    ```


    Listing 1.8: Beispiele für Namen lokaler Variablen


    Achten Sie darauf, Namensschemata nicht zu vermischen! Verwenden Sie entweder
    nur Kleinbuchstaben und trennen Sie die Wörter durch einen Unterstrich, oder benutzen
    Sie Großbuchstaben zur Trennung. Natürlich können Sie nicht Großbuchstaben und
    Unterstrich verwenden. Sie verwenden nicht Großbuchstaben für eine Variable und
    Unterstrich für eine andere. Dies führt zu Fehlern und zeugt von schlechtem Stil.
    Sobald Sie einen Stil gefunden haben, behalten Sie ihn für das gesamte Projekt
    konsequent bei.


    Alle global Variablen sollten ein Präfix haben, welches das Modul bezeichnet,
    dem sie gehört. Dieses Vorgehen erleichtert die Zuordnung der globalen Variablen
    zu ihren Modulen und hilft, Konflikte zu vermeiden, wenn zwei Variablen mit demselben
    Namen aus verschiedenen Modulen im gleichen globalen Umfeld vorkommen. Das Präfix
    sollte durch Unterstrich vom Wort getrennt sein. am besten aus einem einzigen
    Wort oder Abkürzung (siehe Listing 1.9).


    ```

    $phppolls_Cookies

    $phppolls_lastIP

    $db_session_id

    $freakmod_last_known_user

    ```


    Listing 1.9: Beispiele für Namen globaler Variablen'
