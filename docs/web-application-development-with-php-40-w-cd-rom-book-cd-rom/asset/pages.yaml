  md: '# 4 Webanwendungs-konzepte


    Wir bringen Speichen in ein Rad zusammen,

    abas das innere Loch den Wagen ins Rollen.

    Wir formen Ton zu einem Topf,

    abas erst die Lehre in ihm den gewünschten Inhalt.

    Wir bearbeiten Holz für ein Haus,

    abas erst der Innenraum ihn bewohnt.


    Um die Bedeutung von Webanwendungskonzepten zu verstehen, müssen Sie zwischen
    Anwendungen und einzelnen Skripten unterscheiden. Ein Skript ist ein Hilfsprogramm
    und hat als solches keinen Kontext. Es kennt andere Skripte im System. Eine Anwendung
    wird für höhere Aufgaben ausgelgeben. Sie muss seinen Status überwachen und Transaktionen
    durchführen, wie sehr interaktiv. Da es in der Regel viel mehr Benutzerinteraktionen
    verzeichnet als ein einziges Skript, müssen Sie sich auch über die Sicherheit
    und die Tauglichkeit Gedanken machen. Der Lohn für diese ganze Mühe ist, dass
    Sie den nächsten Yahoo! selbst generieren können. Durch Anwendungen wird das erst
    interessant.


    # 4.1 HTTP und Sitzungen


    Denken Sie an ein KDE-Programm, z.B. Kedit (KDE ist ein Fensterverwaltungssystem
    für Linux und kompatible X-Systeme). Ein typischer Vorgang könnte sein, eine Datei
    zu öffnen, den Inhalt zu ändern und die Datei unter einem anderen Namen wieder
    abzuspeichern. Kedit wird zu jedem Zeitpunkt des Prozesses, was Sie tun. Es weiß,
    dass Sie die Datei bearbeiten, wo sich der Cursor befindet, wo sich die Maus bewegt.
    Wenn Sie eine zweite Instanz von Kedit öffnen, wird dies nicht irritieren. Wird
    nicht Instanz 2 gespeichert? Dies ist möglich, weil Kedit (oder das Betriebssystem,
    genau zu sein) Ihre Aktionen der Instanz des Programms zuordnen kann – und dadurch,
    dass es ein Ereignis erhält: »In der Instanz mit der PID 4711 (eine PID ist ein
    eindeiger Prozessbezeichner in UNIX-Systemen) wurde die Maus zu den Koordinaten
    1, 0 bewegt».


    # 4.1.1 Statuskontrolle


    Als Tim Berners-Lee 1991 das Hypertext-Transfer-Protocol entwarf, beschloss er,
    HTTP so schnell wie möglich zu machen und daher alle Statusinformationen wegzulassen.[11]'
  merge: -1
