    Abbildung 3.7: Upstream-Kommunikation


    Die Situation lässt sich mit einem Autoren vergleichen. Der Fahrer auf der Piste
    ist der »Haupt-Client» und das Rennteam in der Box entspricht dem Benuterebefehl.
    Der Fahrer ist an den Rennen, in dem er sich befindet. Er kann nicht einfach die
    Bahnen wechseln und anhalten, um nachzusehen, wie es ist. Wenn das Rennteam mit
    Flagge einen Halt in der Box fordert, kommunizieren sie mit ihm, indem sie ihm
    ein Signal geben, um der nächsten Runde die Fahrt zu unterbrechen.


    Die Kommunikation besteht hier nur (wenn man den Fahrer einmal loslässt) aus dem
    Signal, das gegeben ein Fahrer die Zilinie überquert. Dieses Signal funktioniert
    als »Schnittstelle» zum Fahrer. Im Prinzip ist dies genau, was wir auch tun müssen,
    um unserem Hauptprozess zu geben. Da Hauptprozess ereignisbasiert, haben wir häufig
    die Möglichkeit, die Kontrolle über das Programm zu übernehmen und die gewünschte
    Aktion durchzuführen. Wir können eine Verarbeitungs installieren, die häufig ein
    Signal von außen ausschalten halt. Das Verfahren, das darauf besteht, periodisch
    anzuhalten und zu prüfen, ob ankommende Daten vorhanden sind, nennt sich Polling.
    Es ist die bevorzugte Methode in phpChat. phpIRC unterstützt keine Rückpfeile.
    Diese werden immer dann aufgerufen, wenn phpIRC nichts zu tun hat und einfach
    darauf wartet, dass etwas auf dem Netzwerk passiert. Wir können nach einem Signal'
