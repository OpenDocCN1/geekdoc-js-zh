  md: '# Sicherheitsaspekte


    Beispiel 1: Anfang 1999 führten wir eine Website-Audit für eine führende Online-Jobdatenbank
    durch. Während der Analyse entdeckten wir einen Sicherheitsaspekt, der sprachlos
    machte. Die Website war mit einem Onlineshop verknüpft, in welchem sich Besucher
    zum Thema Jobhunting stellen konnten. Der Shop wurde von einem unabhängigen Auftragsgeber
    entwickelt, hatte bereits mehrere andere ungeschlossene Skripte bekannt. Hieron
    war uns eine Website zur Verfügung gestellt, einschließlich wichtiger Teile der
    Quellencodes. Jedes Mal, wenn ein Besucher einen Artikel bestellte, wurde eine
    Textdatei erstellt, selbst Kreditkartendaten – und alles verschlüsselt. Nicht
    genug, dass die Dateien auf einem direkt sichtbaren Verzeichnis vom Webserver
    abgelehnt wurden – um wir den Website-Audit einfach machen konnten, wie er uns
    machte. Das Verzeichnis wurde nicht «geschützt», dass es in der Apache-Konfiguration
    als Standardnamenskonvention der Form »yyyy-dd-mm-hh-mm-ss» bekannt wurde, wäre
    es für einen Hacker ein Skript zu schreiben, um Dateien zu speichern.


    Beispiel 2: Network Solutions, die im September 1999 beschlossen hatten, bevorzugten
    Kunden einen freien Web-Mail-Account zur Verfügung zu stellen. Sie schufen für
    jedes Konto einen Benutzernamen und ein Passwort und sendeten diesen an den entsprechenden
    Kunden. Der Benutzername bestand aus dem Namen des Kunden («domain»), und das
    Passwort setzte sich aus dem Benutzernamen und der Endung »ensi» zusammen (»domainensi»).
    Über 24 Stunden konnten sich Benutzer im System anmelden, indem sie die Passwörter
    eingaben. Wenn konnte das Passwort Probleme verursachen. Mails, die diesem diesem
    Kunden gesandt wurden, und Mails im Namen Kunden dieser wurden.


    Beide Sicherheitsprobleme entstanden nicht ohne Fehler, die durch die Unzulänglichkeit
    der Programmiersprache hervorgerufen wurden, sondern durch eine schlechte Programmierung.
    PHP ist als sehr sicher. Wir haben doch niemals von Löchern wie bei ASP''s :$DATA-Fehler
    gehört. Bei einem im Juni 1998 entdeckten Fehler konnte Benutzer den Quellencode
    von ASP-Skripten im Web ansehen, indem er die Datei einzeichen :$DATA an die URL
    der Datei angehängte, (z.B. www.server.com/script.asp:$DATA – ein Alptraum für
    jeden Softwareentwickler). Ein früheres Sicherheitsproblem entstand, als Benutzer
    auf einem Windows, ohne, auf die Quelle zugreifen konnten, indem sie eine URL
    wie www.server.com/script.asp:$DATA angaben (beachten Sie den Punkt am Ende).
    Nach Auftauchen eines :$DATA-Fehlers konnte man auf einem Versionen des Personal-Webservers
    für Windows die Form www.server.com/...... usw. benutzen, um nicht nur auf den
    Dokumentenstammverzeichnis des Webservers, sondern auf die gesamte Festplatte
    zugreifen.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 4 Webanwendungskonzepte


    Bei Verwendung einer Sicherheitsprache muss bereits im aller ersten Schritt, d.h.
    der Installation, auf die Sicherheit geachtet werden. Wie Sie wissen kann PHP
    als Servermodul (Apache-Modul), ISAPI/NSAPI-Plugin oder eigenständiges CGI-Programm
    installiert werden.


    Wenn es als Servermodul installieren, ist es Teil des zugrunde liegenden Webservers
    und erbt seine Sicherheit. Für diese Art Installationen sind keine PHP-spezifischen
    Attacken bekannt. Natürlich brauchen sie noch einen sicheren Server, der dies
    um ein weites Feld, als er sich behandeln könnte.


    CGI-Programme dienen als eine hervorragende Angriffsfläche für Vielzahl Einbruchs-
    als auch Dienstverweigungsattacken. Traditionell entstehen die gleichen Probleme,
    wenn ein Skriptinterpreter im Verzeichnis cgi-bin Benutzer einen Befehl den Server
    schicken. PHP versucht diese Attacken zu verhindern. Wenn der Webserver gestartet
    wird, verwirft PHP Befehlezeilenparameter, die von der CGI-Schnittstelle kommen
    - Anfragen wie etwa http://server.com/cgi-bin/php?etc=passwd schlagen fehl.


    Unglücklicherweise kann eine andere Attack, die direkt mit Mängeln in der CGI-Spezifikation
    zusammenhängt, immer durch. Auf jede Datei unterhalb des Webserver-Dokumentenverzeichnisses
    zugreifen, selbst wenn durch HTTP-AUTH geschützt ist. Dazu müssen Sie lediglich
    über den PHP-Interpreter: www.server.com/cgi-bin/php/secret-directory/file.html
    aufrufen. HTML ermöglicht sogar file_html anzuzeigen, wenn secret-directory durch
    eine .htaccessDatei geschützt ist. Auf dem Apache-Server können Sie diese Probleme
    vermeiden, indem Sie bei der Kompilierung von PHP --enable-force-cgi-redirect
    aktivieren. Informationen zu diesem Thema finden Sie im PHP-Handbuch im Installationsverzeichnis.


    Die Wahl einer sicheren Installation ist allerdings nur der erste Schritt. Ein
    guter Programmierer behält die Sicherheit während gesamten Entwicklungsprozesses
    im Auge. Es gibt viele potenzielle Risiken, das wir nicht in diesem Paket behandeln
    können. Wir können lediglich versuchen, Ihnen ein paar allgemeingültigte Tipps
    zu geben.


    # 4.2.1 Vertrauen dem Web nicht


    Alle Daten, die vom Web kommen, sollten und sollen von Ihrem PHP Programm überprüft
    werden. Es gibt beispielsweise keine Garantie, dass Ihr Skript über die passende
    Formular-Schnittstelle aufgerufen wird. Benutzer könnten das HTML-Formular einfach
    umgehen und das Skript direkt aufrufen, indem sie mölicherweise über ihren EIGEN
    oder POST Parameter spezifizieren.'
  merge: -1
