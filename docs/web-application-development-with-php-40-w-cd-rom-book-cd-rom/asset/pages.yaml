  md: 'Als europäischer Internetnutzer sehen wir häufig das Vorurteil, dass Amerikaner
    dazu tendieren, eine amerikan-bezogene Sicht der Welt einzunehmen, Benutzernamen,
    die sich an deutschen Umlauten verschlucken, und Ablaufsteuerungsprogramme, in
    denen Sie keine Zeitzonenbasis einbauen können, Informationssysteme, die auf amerikanischen
    ZIP-Codes basieren – die Liste lässt sich endlos fortsetzen (siehe Abbildung 4.3).
    Es erfordert möglicherweise einen höheren Kosten- und Zeitaufwand, um ein Programm
    zu entwickeln, das von einem internationalen Publikum genutzt wird, aber es kann
    sich nicht bezahlt, denn bereits im September 1999 kamen 50% der Webnutzer nicht
    aus den den Vereinigten Staaten.


    # Ist es selbstklärend?


    Ein Programm ist selbstklärend, wenn es der Benutzer hilft, ein System zu erlernen
    und zu verstehen. Dies ist im Web besonders wichtig, da die meisten Benutzer in
    Hinsicht Laien auf Ihrer Website sind. Sie wandern von Website zur nächsten und
    erinnern sich in der Regel nicht an die Konventionen und Regeln ihrer Website,
    welche sie das nächste Mal besuchen. Daher sollten sie ihre Zeit darauf verwenden,
    die Dialogfenster zu vereinfachen, anstatt eines Hilfsystem für alle Formular
    auszufüllen. (Bei nicht-trivialen Formularen empfiehlt sich trotzdem ein content-sensitive
    Hilfsystem.)


    Wir haben bei vielen Programmen festgestellt, dass es hilfreich ist, dem Benutzer
    eine Demonstration zur Verfügung zu stellen, in der er experimentieren kann oder
    doch durch den Schritt für Schritt geleitet wird.


    Auch Konsistenz hilft, ein Programm selbstklärend zu machen. Wenn eine Warnung
    in der gleichen Darstellung an derselben Stelle erscheint, wird der Benutzer dies
    als Systemfehlern erkennen.


    # 4.3.2 Einfache Tauglichkeitsprüfung (Discount Usability Engineering)


    In der Praxis werden die empfohlenen Tauglichkeitsprüfverfahren für Software-entwicklungsprojekte
    selten verwendet. Dies liegt zum großen Teil an den Kosten, die mit den traditionellen
    Tauglichkeitsprüfverfahren verbunden sind. In der angesehenen Zeitschrift „Communications
    of the ACM“ schätzen die Autoren Mantei und Torey⁵ 1988, dass „Kosten, die erforderlich
    sind, um das Element menschlicher Faktoren für Softwareentwicklung hinzuzufügen,
    auf über 120.000 Dollar belaufen, ungeachtet der Größe des Softwareentwicklungsprojekts.
    Diese Schätzung bezog sich hauptsächlich auf die Bewertung der Kosten, die mit
    Testen und Anwendungen, Produktanalysen usw., die sich nicht mit der Größe des
    Projekts und des Programcodes während der Entwicklung ändern. Diese Zahl überschreitet'
