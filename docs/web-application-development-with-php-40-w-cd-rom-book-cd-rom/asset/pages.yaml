    # 9.11.6 Gewährleistung der Schreibsicherheit für andere Parameter


    Möglicherweise kommen Sie in eine Situation, in der Sie Schreibzugriff auf einen
    Parameter benötigen, der mit *get_parameters_ex()* ausgelesen wurde, aber nicht
    durch Referenz übergeben wurde. Für diesen Fall können Sie das Makro *SEPARATE_ZVAL*
    verwenden, das *zval*-Separation in bereitgestellte Container durchführt. Der
    neu erzeugte *zval* wird von den internen Daten abgetrennt und hat nur einen lokalen
    Gültigkeitsbereichs. Damit kann er geändert oder entfernt werden, ohne dass dies
    Auswirkungen auf die globale Umgebung des Skripts hätte:'
