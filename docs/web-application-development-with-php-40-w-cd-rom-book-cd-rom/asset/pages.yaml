  md: '# Die Bedeutung der Tauglichkeit


    geben Sie ihm die Möglichkeit, zwischen den einzelnen Stufen hin- und her zuzulalten,
    ohne dass die Daten verloren gehen. Benutzer wählen häufig fälschlicherweise Funktionen
    und suchen nach einem Weg, uner Zustand zu verlassen. Wenn das Programm vom Benutzer
    vorübergehend verlässt, ermöglichen sich das Programm, es später zu betrachten.


    Kontrollierbar bedeutet, dass sich das Programm an die Bedürfnisse und Merkmale
    des Benutz anpasst. In einem Intranet können sich beispielsweise erfahrene Benutzerexperte,
    die sich mit dem System der täglichen Arbeit vertraut machen. Die Navigationstruktur
    und das Programm sollten daher so gestaltet sein, dass der Benutzer über Tastaturhilfe
    oder andere Mittel wesentliche Punkte schneller erreicht, z.b. über Pulldown-Menüs,
    einen direkten Sprung auf eine bestimmte Seite ermöglichen. Außerdem brauchen
    die Benutzer fortgeschrittene blaisen, die unterschiedliche Wissensniveau befriedigen.


    # Entspricht es der Benutzererwartung?


    Ein wichtiger Aspekt für die Tauglichkeit ist Konsistenz. Jakob Nielsen, der wohl
    bekannteste Tauglichkeitsexperte, erklärt dies in seinem Gesetz zur Webbenutzererfahrung
    aus: „Benutzer verbringen die Zeit auf den meisten Websites.\ Die Konventionen,
    die sich auf den meisten Websites etabliert haben, sollten auch auf Ihrer Website
    eingehalten werden. Nielsens 14 taplige Seiten mit Warnmeldungen haben so viel
    ihrer Erfahrung und seines Wissens wieder, dass sie ein Muss für jeden sind, der
    im Bereich Produktentwicklung und Informationstechnologie arbeitet. In Warbox
    vom 22. August 1999 sagt Nielsen ein Beispiel dafür, was passiert, wenn ein Programm
    die Erwartungen eines Benutzers nicht entspricht;[4]


    Eric Davis, ein Informatiker bei Resource Marketing, berichtete über eine Tauglichkeit
    bei der Einkaufswaartenterminologie. Das Konzeptdesign unterstützt den Begriff
    „Einkaufschlinien“, die sich die Website (die auf Verkauf von Wintersportprodukten
    bezogen) von anderen und die Standardterminologie vermieden haben. Ergebnis: 50%
    der Benutzer fanden das Linkonzept nicht. Die anderen 50% sagten, dass sich herausgefunden
    haben, was es bedeutet, dass sie an ihrem Standort befand, an dem auch ein Einkaufswervice
    waren. Sie wussten, dass sich etwas hinzufügen muss und das Einze, was Sinn gab,
    der Schletten. Lexikon: Versuchen Sie niemals klar zu sein und verwenden Sie keine
    neuen Begriffe, wenn schon gute Begriffe, die der Benutzer braucht.


    Konsistenz bedeutet auch, dass das Verhalten von Dialog und und die Anzeige einheitlich
    sein sollte:


    +   Zeigen sich Systemmeldungen (Statusangabe, Meldungen über fehllagene oder
    erfolgreiche Aktionen) stets an derselben Stelle der Seite und in der gleichen
    Darstellung an.'
