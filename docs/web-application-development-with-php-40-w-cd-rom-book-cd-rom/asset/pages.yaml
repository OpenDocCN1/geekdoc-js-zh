  md: '# 9.4.5 Handhabung von Strings


    Strings werden von der Zend-Engine etwas anderes als andere Werte, wie etwa Integer,
    booleansche Werte usw., die zur Speicherung ihrer Werte keine zusätzlichen Speicherzuweisungen
    benötigen. Wenn Ihre Funktion einen String Stringvariable in der Symboltabelle
    ein, um etwas Ähnliches zu tun, stellen Sie sicher, dass der Speicher, der diesen
    belegen wird, vor mit den oben genannten e*()-Funktionen zugewiesen wurde. (Dies
    ist Ihnen möglicherweise noch nicht sehr bekannt; behalten Sie sich einfach im
    Hinterkopf, wir kommen in Kürze darauf zurück)


    # 9.4.6 Komplexe Typen


    Komplexe Typen, wie etwa Arrays oder Objekte, erfordern eine andere Behandlung.
    Zend bietet eine separate API für diese Typen: sie werden über Hash-Tabellen gespeichert.


    > Hinweis: Um die Komplexität in den folgenden Programbbeispielen zu reduzieren,
    arbeiten wir zunächst mit einfachen Typen, wie Integer. Später werden wir die
    Erstellung anspruchsvollerer Typen erörtern.


    # 9.5 PHPs automatisches Erstellungssystem


    PHP 4.0 verfügt über ein automatisches Erstellungssystem, das sehr flexibel ist.
    Alle Module befinden sich in einem Unterverzeichnis des Verzeichnisses Neben seinen
    eigenen Quellen umfasst jedes Modul eine M4-Datei (siehe z.B. www://www.gnu.org/manual/m4/html_m4.html)
    zur Konfiguration, und eine Makefile-in, die für die Kompilierung zuständig ist
    (die Ergebnisse von autoconf und automake; siehe z.b. http://sourceware.cygnus.org/autoconf/autoconf.html
    http://sourceware.cygnus.org/automake/automake.html).


    Beide Dateien werden zusammen mit .cvsignore von einem kleinen Shellscript namens
    ext_skel generiert, das sich im Verzeichnis den Namen des Moduls an, das Sie erstellen
    möchten. Abschließend erstellt das Shellscript ein Verzeichnis dieses Namens,
    zusammen mit den entsprechenden config.m4- und Makefile-in-Dateien.


    Nach und läuft folgt folgender Prozess:


    ```

