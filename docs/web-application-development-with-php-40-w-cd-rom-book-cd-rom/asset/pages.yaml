  md: "# 2 Erweiterte Syntax\n\n+   * Variable Variablennamen\n* Variable Funktionsnamen\n\
    * Selbstmodifizierender Highlevel-Code\n* Polymorphisierung\n\nAuf alle diesen\
    \ Themen werden wir in den folgenden Abschnitten eingehen.\n\n# 2.2 Definition\
    \ von Konstanten\n\nIn PHP gibt es zwar keinen Ausdruck und Konstruktion, um Konstanten\
