  md: '# 9.20.1 Unterstützung für Initialisierungsdatenien


    PHP 4.0 bietet eine neu konzipierte Unterstützung für Initialisierungsdatenien.
    Damit Sie Standardinitialisierungseinträge direkt im Code angeben, diese Werte
    zur Laufzeit lesen und ändern und Nachrichtenroutinen schreiben können.


    Um einen ini-Abschnitt in Ihrem Modul zu erstellen, verwenden Sie das Makro PHP_INI_BEGIN(),
    um den Beginn solchen Abschnitts zu markieren, und PHP_INI_END(), um das Ende
    zu markieren. Dazwischen können Sie PHP_INI_ENTRY() verwenden, um Einträge zu
    erzeugen.


    ```

    PHP_INI_BEGIN()

    PHP_INI_ENTRY("first_ini_entry", "has_string_value", PHP_INI_ALL

    ➡NULL)

    PHP_INI_ENTRY("second_ini_entry", "2", PHP_INI_SYSTEM

    ➡OnChangeSecond)

    PHP_INI_ENTRY("third_ini_entry", "xyz", PHP_INI_USER

    ➡NULL)

    PHP_INI_END()

    ```


    Das Makro PHP_INI_ENTRY() hat vier Parameter: Den Namen des Eintrags, den Wert
    des Eintrags, die Änderungsbenachrichtigungsroutine und einen Zeiger auf eine
    Änderung des Eintrags. Sowohl der Name als auch der Wert als String angegeben
    werden, ungeachtet, ob sie tatsächlich String oder Integer sind.


    Die Berechtigungen sind in drei Gruppen unterteilt: PHP_INI_SYSTEM ermöglicht
    eine Änderung nur direkt in der Datei php3.ini. PHP_INI_USER lässt eine Änderung
    während der Laufzeit des Überschreiben einer Datei durch den Benutzer zu zusätzliche
    Konfigurationsdateien (wie etwa .htacces), PHP_INI_ALL ermöglicht unbeschränkt
    Änderungen. Daneben gibt es noch eine weitere Ebene, PHP_INI_PERDIR. Dieses Verhalten
    konnten wir jedoch bis heute noch nicht herausfinden.


    Der vierte Parameter besteht aus einem Zeiger auf eine Änderungsbenachrichtigungsroutine.
    Wenn eine dieser Initialisierungsänderung geändert wird, wird diese Routine aufgerufen.
    Solch eine Routine kann über das Makro PHP_INI_MH deklariert werden:


    ```

    PHP_INI_MH(OnChangeSecond): // handler for ini-entry

    ➡"second_ini_entry"


    // specify ini-entries here

    _INI_MH(OnChangeSecond)

    (

    ```'
