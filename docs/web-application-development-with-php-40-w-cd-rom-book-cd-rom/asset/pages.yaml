  md: "# Sicherheitsaspekte\n\n```\n$secret = \"Secret password\": // Secret key\n\
    for($i=0; $i<$count($algorithms); $i++) {\n  // If this algorithm is available,\
    \ $algorithms[$i] is an integer\n  constant\n  if (is_integer($algorithms[$i]))\
    \ {\n    print(\"<b>$algorithms[$i]</b>\".`mcrypt_get_cipher_name($algorithms[$i])\"\
    .</b><br>\");\n  } else {\n    print(\"<b>$algorithms[$i] is not supported</b><br>\"\
    );\n    continue;\n  }\n  // Get the block size of the current algorithm\n  $block_size\
    \ = mcrypt_get_block_size($algorithms[$i]);\n\n  // Create an initialization vector\
    \ from device /dev/random\n  $iv = mcrypt_create_iv($block_size, MCRYPT_DEV_RANDOM);\n\
    \n  // Encrypt the plaintext with $algorithms[$i]\n  $encrypted = mcrypt_cbc($algorithms[$i],\
    \ $secret, $message;\n  MCRYPT_ENCRYPT, $iv);\n\n  // Decrypt it again\n  $unencrypted\
    \ = mcrypt_cbc($algorithms[$i], $secret, $encrypted;\n  MCRYPT_DECRYPT, $iv);\n\
    \n  // Output plaintext and ciphertext\n  print(\"Ciphertext:$encrypted<br>\"\
    );\n  print(\"Plaintext:$unencrypted<p>\");n}\n```\n\nListing 4.5: Mcrypt-Routines\n\
    \nMcrypt verwendet zur Verschlüsselung und Entschlüsselung von Daten Blockverschlüsselungsalgorithmen.\
    \ Die Blockverschlüsselung ist eine Anwendung der bereits symmetrischen Verschlüsselungsmethode\
    \ (Gegenteil Verschlüsselung mit öffentlichem Schlüssel). Wenn Sie eine Nachricht\
    \ mit einer Blockverschlüsselung bearbeiten, können Sie verschiedene Betriebssysteme\
    \ verwenden, um den Klartext zu verschlüsseln. ISO92b definiert generische Modi,\
    \ die für die Verschlüsselung von Blöcken beliebiger Größe eingesetzt werden können:\
    \ Electronic Code Book, Cipher Block Chaining, Cipher Feedback und Output Feedback."
