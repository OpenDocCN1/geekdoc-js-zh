  md: '# Ereignisbasierte API


    Es gibt zwei Arten von APIs für XML-Parser: Parser, die auf Baumstrukturen basieren
    und Schnittstellen für das Document Object Model (mehr dazu später) bereitstellen,
    und jene, die XML-Dokument mit einem ereignisbasierten Ansatz verarbeiten. Expat
    stellt ereignisbasierte API zur Verfügung.


    Ereignisbasierte Parser nehmen eine datbezogene Sichtweise der XML-Dokumente ein.
    Sie analysieren das Dokument von oben nach unten und Ereignisse, wie etwa den
    Beginn eines Elements, den Beginn eines Zeichensands, an die Anwendung, der in
    der Regel eine Rückruffunktion ist. Das Beispieldokument »Hello World« wird eben
    von einem ereignisbasierten Parser als eine Reihe Ereignisse berichtet.


    +   1. Element öffnen: greeting

    2. CDATA-Abschnitt öffnen, Wert: Hello World

    3. Element schließen: greeting


    Im Gegensatz zu baumstrukturbasierten Parseern, erzeugen sie keine Strukturdarstellung
    des Dokuments. Dies macht einen low-level-Zugriff in Bezug auf Geschwindigkeit
    und Ressourcenverbrauch sehr effizient. Expat muss nicht das gesamte Dokument
    im Speicher geladen sein. Die Dokumente können sehr größer sein als ihr Systemsspeicher.
    Trotzdem haben sie immer noch die Möglichkeit, wenn nötig, eine neue Baumstruktur
    zu erstellen. Bevor ein Dokument analysiert werden kann, fordert sie ein ereignisbasierter
    Parser in der Regel, Rückruffunktionen zu registrieren, die aufgerufenen werden,
    wenn bestimmte Ereignisse eintreten. Expat bildet hierbei keine Ausnahme. Er definiert
    sich sechs mögliche Ereignisse und eine Standardroutine.


    | Ziel | Funktion | Beschreibung |

    |---|---|--|

    | Elemente | xml_set_element_handler() | Öffnen und Schließen von Elementen |

    | Zeichendaten | xml_set_character_data_handler() | Anfang von Zeichendaten |

    | Externe Entitäten | xml_set_external_entity_handler() | Auftreten einer externen
    Entität |

    | Nicht analysierte externe Entitäten | xml_set_unparsed_entity_decl_handler()
    | Auftreten einer nicht analysierten externen Entität |

    | Verarbeitungsbefehle | xml_set_processing_instruction_handler() | Auftreten
    eines Verarbeitungsbefehls |'
