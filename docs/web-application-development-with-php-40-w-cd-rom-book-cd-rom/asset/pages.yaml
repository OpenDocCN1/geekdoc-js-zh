  md: '# Pearson Education | Grundlegende Webanwendungsstrategien


    Mit Hilfe des Befehls cvs diff kann ein Entwickler sogar Unterschiede zwischen
    beliebigen Versionen ansehen, ohne die Datei auszulesen. Standardmäßig wird der
    Befehl cvs eingesetzt, um die lokale Version mit der zentralen Version zu vergleichen:


    ```

    jane@dev:/home/jane/f-api > cvs diff f-api_write.php3

    ```


    Durch Verwendung der Option -r, die in den meisten CVS-Befehlen vorgesehen werden
    kann, kann CVS jetzt in der Lage, die lokale Kopie mit der zentralen Version (der
    ursprünglichen Version) zu vergleichen:


    ```

    jane@dev:/home/jane/f-api > cvs diff -r 1.1 f-api_write.php3

    Index: config.php3

    ```


    ```

    RCS file:

    /usr/local/cvroot/config.inc.php3/config.inc.php3.v

    retrieving version 1.1

    retrieving version 1.3

    diff -r1.1 -r1.5 3c3

    < define("FT_ZIP_ARCHIVE","ZIP_ARC\ // GZip Archive

    ```


    ```

    > define("FT_ZIP","ZIP_ARC\ // GZip Archive (not PZip compatible!)

    ```


    Auch wenn CVS für den Abgleich verschiedener Versionen einer gut eignet, sollten
    Sie dies unter bestimmten Umständen besser vermeiden. Der Befehl cvs diff beispielsweise
    umfangreichende Änderungen auf dem entfernten Server anzeigt, während auf dem
    lokalen System nur wenige Änderungen vorgenommen wurden, empfiehlt sich möglichst,
    die lokale Version aufgrund der Änderung im zentralen Archiv zu verwerfen. Hier
    sollten Sie besser die lokale Version löschen und die Datei vom Server auslesen.


