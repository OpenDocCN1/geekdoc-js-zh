    * Indizierte Arrays: array

    * Associative Arrays: struct

    * Sammlungen von associativen Arrays, eine Gruppe benannter Felder mit der gleichen
    Anzahl an Datenseilen: recordset

    * Binäre Objekte, die z. B. mit Base64 kodiert sind: binary


    Alle WDDX-Pakete haben dasselbe XML-Format. Das Stammelement hat ein optionales
