  md: '# 7 Anwendungen der Spitzentechnologie


    # Attr


    Der Knoten Attr repräsentiert ein Elementattribut in einem Element-Objekt. Den
    Namen und den Wert des Attributs vermitteln sich mit den Variablen name und value
    Schnittstelle. Die Variable specified gibt an, ob der Wert des Attributs vom Benutzer
    angegeben wurde oder ein Standardwert ist, der in der DTD angegeben ist.


    # EntityReference


    Dieser Knoten repräsentiert einen Entitätenverweis, der im XML-Dokument gefunden
    wurde. Bedenken, dass Zeichenverweise (z.B. &lt;) vom XML-Parser expandiert werden
    und daher nicht als EntityReference-Knoten dargestellt werden.


    # Entity


    Dieser KnotenInstruction repräsentiert eine analysierte oder nicht analysierte
    Entität.


    # ProcessingInstruction


    Der Knoten ProcessingInstruction repräsentiert einen Verarbeitungsbefehl in einem
    Dokument. Er besitzt zwei Attribute, nämlich target (das Ziel des Verarbeitungsbefehls)
    und data (den Inhalt).


    # Comment


    Die Schnittstelle CharacterData repräsentiert den Inhalt eines Kommentars, d.h.
    alle Zeichen zwischen <!-- und -->. Er verfügt über keine weiteren Attribute oder
    Methoden.


    # Text


    Die Schnittstelle Text CharacterData repräsentiert die Zeichendaten (textlichen
    Inhalt) eines Element- oder Attr-Knotens. Die Schnittstelle Text hat keine Attribute,
    aber eine Methode splitText(). Sie teilt einen Text-Knoten in zwei Hälften, was
    beispielsweise bei der Neuordnung des Inhalts nützlich erweisen kann.


    # CDATASection


    Die Schnittstelle CDATASection erbt die Schnittstelle Text (und damit die Schnittstelle
    CharacterData) und enthält den CDATA-Abschnitt.


    # Notation


    Dieser Knoten stellt eine in der Dokumententypypdeklaration deklariierte Notation
    dar.'
