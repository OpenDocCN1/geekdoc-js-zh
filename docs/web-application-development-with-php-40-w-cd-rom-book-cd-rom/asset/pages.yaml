  md: '# 1.4 Verwenden von Dateien zur Gruppierung von Funktionen


    Wir haben gezeigt, dass es sich auszahlt, mehrere Dateien für den Quellecode zu
    verwenden. Wir empfehlen, auch für die meisten anderen Ressourcen-Dateien zu verwenden,
    wie Konfigurationsangaben, benutzerspezische Header, Footer oder andere Vorlagen.
    Das Gleiche gilt für alles Andere, das sich als Separate von Ihrem Projekt abtrennen
    kann.


    Für ein und dasselbe Projekt mehrere Dateien zu verwenden, bietet einige Vorteile:


    +   * Sie erhalten kleinere Quellecode-Dateien, die leichter zu pflegen sind.

    * Sie können mehrere Versionen für die Datei erzeugen, anstatt für kleine Änderung
    das gesamte Projekt durchsuchen zu müssen.

    * Sie können Ressourcen vom Projekt abnen und sie in anderen Projek wiederverwenden.

    * Mehrere Team-Mitglieder können gleichzeitig an demselben Projekt arbeiten, ohne
    dass sie Gefahr laufen, sich in die Quelle zu kommen, wenn Sie alle Dateien die
    Versionskontrolle überprüfen.


    Diese Punkte gelten für die meisten Ressourcen, die in einem Projekt vorhaben
    sein können.


    Die Dateien sollten aussagekräftigen Namen erhalten, der ihren Inhalt wiedergibt.
    Je mehr Dateien einer größeren Gruppe gehören, sollte dem Namen möglichst ein
    Präfix vorliegen. Legen Sie die Dateien in Unterzeichnissen an. Angenommen, Sie
    haben eine Datenbank-Abstraktion mit Modulen, die auf verschiedene Datenbanken
    zugreifen, wobei diese in einzelnen Dateien gepackt sind. Hier sollen alle Dateien
    das Präfix dba_ tragen (obei dies dba_mysql, dba_odbc, dba_oracle usw heißt).


    Stellen Sie sicher, dass Sie die Verzeichnisse später ändern können, indem Sie
    konfigurierbare Modulverzeichnisse verwenden. Ein Beispiel (beachten Sie, dass
    sich dba in diesem Beispiel nicht auf die PHP-Funktionen dba- beziehen):


    ```

    <?php

    require("config.php3");


    require("$dba_root/dba.php3");

    require("$socket_root/socket.php3");

    require("$phpPolls_root/phpUI.php3");

    ```'
