  md: '# 9.8 Erweiterungen verwenden


    Je nachdem, welchen Erstellungsprozess Sie ausgewählt haben, sollten Sie am Ende
    entweder eine PHP-Binärdatei, die mit dem Ihrem Webserver verknüpft ist (oder
    als CGI ausgeführt wird) oder eine .so (Shared Object)-Datei haben.

    Wenn Sie die Beispieldate first_module.c als Shared Object kompiliert, sollte
    die erzeugte Datei first_module.so laden. Um diese zu verwenden, müssen Sie zunächst
    an eine Stelle kopieren, auf die PHP zugreifen kann. Zu können Sie die Datei in
    das Verzeichnis htd kopieren und sie mit der Quelle aus Listing 9.4 ausprobieren.
    Wenn Sie die Datei in der PHP-Binärdatei kompiliert haben, lassen Sie den dl()-Aufruf
    weg, denn die Funktionen des Moduls sind für Ihre Skripte sofort verfügbar.


    > Warnung: Sicherheit sollten Sie Ihre dynamischen Module nicht in öffentlich
    zugänglichen Verzeichnisse speichern. Dies ist zwar möglich und vereinfacht das
    Testen, aber in Produktionsumgebungen sollten Sie diese in einem separaten Verzeichnis
    ablegen.


    ```

    <?php

    //dl("first_module.so");


    $param = 2;

    $return = first_module($param);


    print("we sent \$param\" and got \$return\"");


    ?

    ```


    Listing 9.4: Eine Testdatei für first_module.php


    Wenn Sie diese PHP-Datei in Ihrem Webbrowser aufrufen, erhalten Sie die in Abbildung
    9.3 gezeigte Ausgabe.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_381_0.png)


    Abbildung 9.3: Ausgabe von first_module.php'
