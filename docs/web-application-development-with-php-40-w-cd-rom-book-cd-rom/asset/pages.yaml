  md: '# Projektstruktur


    Wenn Sie auf die erste Verzeichnissein blicken, stellen Sie fest, dass unterschiedliche
    Verzeichnisse für eingeschlossene Dateien (Bibliotheken, Konfigurationsdateien,
    Schablonen) und Passwortdateien (zu verwenden mit .htaccess-Dateien) gibt. Passwortdateien
    sollten niemals über das Web zugänglich sein, da die darin enthaltenen Passwörter
    mit schwachen Standardalgorithmen verschlüsselt sind und leicht von entsprechenden
    Programmen entschlüsselt werden könnten. Die Dateien müssen unbedingt vor dem
    Zugriff geschützt werden; es empfiehlt sich jedoch, außerhalb des Dokumentenstamms
    zu speichern. Selbst wenn der Webserver aufgrund einer falschen Konfiguration
    nicht analysieren kann, gibt es möglicherweise Bibliotheken, die wichtige Betriebsgeheimnisse,
    Systeminformationen oder innovative Algorithmen enthalten und nicht für den Webnutzer
    sichtbar sein.


    > Tipp: Wir verwenden in allen Projek eine Datei namens configuration.inc.php3,
    die Konfigurationsdaten für den Umfang eines Projekts definiert. Sieichert außerdem
    den Basispad des Projekts. Dies vereinfacht, später zusätzliche Dateien im Skript
    einzufügen, die sich in Unterverzeichnissen befinden.


    Es gibt drei verschiedene Verzeichnisgruppen: live, dev und staging.


    +   - Das Verzeichnis live enthält die Produktionsumgebung (die tatsächliche Website).

    - dev wird für den Entwicklungserver verwendet.

    - staging dient der Übergang von dev zu live und wird für die Qualitätssicherung
    und die Endnahme vor der Freigabe verwendet.


    Die Trennung von Entwicklungs- und Anwendungserver ist bei großen Wikis nötig.
    Sie können sich einfach nicht leisten, Webanfragen wie »live« zu bearbeiten. Ein
    Skriptfehler könnte sich unmittelbar auf Hundtausende von Benutzer auswirken.
    Bedenken Sie, was passieren könnte, wenn dieser Skriptfehler zu Unvereinbarkeiten
    von Daten in einer Produktionsdatenbank führen würde.

    Die Lösung dem in der Unterschied zwischen Entwicklungserver und Produktionsserver.
    In unserem Beispiel befinden sich beide auf physikalischen Maschine. Für den Entwicklungserver
    können Sie einen Zugriff mit entsprechenden Zugriffsbeschränkungen über dev.phpwebdev.com
    ermöglichen, z.B. mit IP-basierter Filterung. Bei größeren und kritischen Systemen
    ist es in der Regel, der Entwicklungserver auf einen zweiten, zu verlagern. Damit
    können Sie Softwareaktualisierungen, Nekonfigurationen des Betriebssystems, Hardwareänderungen
    usw. leichter testen.'
