  md: "# 2.4.5 Vererbung\n\nUm Funktionen zu Objekten hinzuzufügen sollte nicht der\
    \ alte Code geschrieben werden, sondern bestehende Strukturen ausgenutzt werden.\
    \ Neue Objekte können mithilfe des Schlüsselwortes extends aus alten Objekten\
    \ übernommen werden. Wie der Name sagt, wird hierdurch eine neue Klasse als Erweiterung\
    \ einer bestehenden definiert:\n\n```\nclass extended_cart extends shopping_cart\n\
    {\n    function query($item)\n    {\n        return($this->item_list[$item]);\n\
    \    }\n}\n```\n\nDieser erweiterte Wagen extended_cart enthält nun alle Elemente\
    \ und Mitgliedsfunktionen von shopping_cart sowie zusätzliche eine weitere Funktion\
    \ query(), mit welcher wir die Menge eines bestimmten Eintrags im Wagen überprüfen\
    \ können.\n\n> Hinweis: Die Klasse extended_cart besitzt keinen eigenen Konstruktor.\
    \ Wenn die Klasse eines Tochterklasse keinen Konstruktor hat, ruft PHP (seit der\
