    # 4.2.2 Erfinden Sie die Kryptografie nicht neu


    Kryptografie ist die Wissenschaft für die Verwendung von Formeln zur Verschlüsselung
    bzw. Entschung von Daten. Dies ermöglicht Ihnen, sensible Daten zu speichern oder
    über unsichere Kommunikationskanäle zu übertragen, und zwar so, dass sie von niemand
    als dem beabsichtigten Empfänger gelesen werden können. Datenverschlüsselung ist
    eine Wissenschaft für sich selbst. Versuchen Sie gar nicht, einen eigenen Verschlüsselungsalgorithmus
    zu finden. Verwenden Sie bewährte Algorithmen, wie etwa RC5 oder Blowfish.


    # Verschlüsselung mit Mcrypt-Funktionen


    Wenn PHP mit dem Modul mcrypt kompilert wird, stehen Ihnen eine Vielzahl von mä
    Verschlüsselungs- und Entschlüsselungsalgorithmen zur Verfügung. Der Abschnitt
    „Die Mcrypt-Funktionen“ zeigt Ihnen, wie Sie dieses Modul verwenden und wie Sie
    herausfinden, welche Algorithmen auf Ihrem System unterstützt werden.


    Es gibt zwei Arten von Verschlüsselung: Symmetrische Verschlüsselung und Verschlüsselung
    über öffentliche Schlüssel.


    # Symmetrische Verschlüsselung


    Die symmetrische Verschlüsselung wird auch als Verschlüsselung für geheime Verschlüsselung
    bezeichnet. Sie verwendet denselben Schlüssel für die Verschlüsselung und die
    Entschlüsselung der Daten. Der Verschlüsselungsstandard (Data Encryption DES)
    ist ein gutes Beispiel für diese Methode. Hierbei handelt es sich um einen komplexen
    Algorithmus, der in den 70er Jahren von IBM entwickelt und 1976 von U.Bureau of
    Standards genehmigt wurde. Er ist relativ einfach, 56-Bit-Algorithmus zu knacken
    (den DES Challenge, ein Kryptausch, der von RSA Security sponsored wurde, benötigt
    22 Stunden bis die verschlüsselte Nachricht dechriert wird), aber kann trotzdem
    für die Verschlüsselung von nicht-kritischen Daten verwendet werden. Eine Daten
    einfach vor dem normalen Systembenutzern „versteckt“ und bräuchten nicht auf kryptografisch
    sichere Weise verschlüsselt zu werden – eine Abwägung von Kosten und Nutzen.


    Bei der symmetrischen Verschlüsselung müssen Sender und Empfänger einer verschlüsselselten
    Nachricht den geheimen Schlüssel (das Passwort) kennen.'
