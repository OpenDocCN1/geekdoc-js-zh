    # ### 8.2.5 PHP im Einsatz


    Die beiden oben genannten kommerziellen Produkte SixCMS und SixAIM sind Beispiele
    für Six-Anwendungen, die mit PHP 3.0 realisiert wurden. In der Version 3.0 hat
    SixCMS 283 Dateien, die 25.000 Programme enthalten und 1,2 MB Speicher belegen.
    Die Anwendung verwendet eine MySQL-Datenbank, die 40 Tabellen enthält. Im Vergleich
    dazu hat SixAIM 71.000 Programme im PHP 3.0-Code (sowie weitere 10.000 Zeilen,
    die in Oracle PL/SQL-Sprache geschrieben sind) und belegt 2 MB Speicher. Die Oracle-Datenbank
    umfasst etwa 200 Objekte: 55 Tabellen, 45 Funktionen und 30 Verfahren, die wiederum
    spezielle kundenenspezifische Funktionen bereitstellt. Sie hat die Standard- oder
    Basisversion von PHP verwendet und verwendet immer noch, insbesondere die Versionen
    3.6, 3.7 und 3.0.12 um die Version 4.0 umzusteigen, da diese keine Beta-Version
    mehr ist und stabil läuft. Sie hat zwar eine Reihe Lösungen von der PHP-Version
    2.x nach 3x migriert, da dies eine zeitaufwendige Aufgabe ist, bei der sich auch
    Programmierfehler einschlichen können, selbst wenn die Migration mit Skripten
    automatisiert wird. Für Syntax- und Sprachänderungen finale Variationen, wie etwa
    bei der Handhabung von Arrays und der Deklaration von Variablen, werden zusätzliche
    Mechanismen und Testverfahrenorde benötigt.


    PHP hat sich bei Six und seinen Kunden bewährt, ist aber, bereits erwähnt, nicht
    unbedingt ideal für Websites mit höherem Datenverkehr. Einige Caching-Konzepte
    waren hilfreich und außerdem verwendete eine


    357'
