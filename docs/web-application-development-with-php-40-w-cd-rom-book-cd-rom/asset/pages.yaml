    \ $y++)\n    $mouse_bitmap[$x][$y] = 0;\n```\n\nHiermit wird ein Maus-Bitmap gelöscht\
    \ und alle Elemente auf gesetzt. Dabei werden zwei Schleifen verwendet, für jede\
