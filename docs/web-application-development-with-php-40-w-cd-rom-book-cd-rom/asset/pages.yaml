  md: '# Verknüfte Listen


    | Funktion | Beschreibung |

    | --- | --- |

    | int tree_assign_node_contents (array tree, int handle, mixed contents) | Weist
    dem Inhaltshalter eines Knotens Daten zu. |

    | mixed tree_retrieve_node_contents (array tree, int handle) | Lest aus dem Inhaltshalter
    eines Knotens aus. |


    Wenn Sie möchten, hier weitere Funktionen hinzuzufügen. Die Bibliothek bietet
    beispielsweise weitere Funktionen an Bäumen zu, tote Knoten zu entdecken (Knoten,
    der im Array vorhaben, aber im Hauptbaum abgeschnitten sind und um damit nicht
    mehr zugriffen werden kann). Dieser Code eignet sich hervorragend zum Experimentieren
    und Lernen.


    Die Bibliothek ist einfach, `tree_create()` erzeugt ein neues Array für die Baumstruktur
    und initialisiert das erste Element als Stammelement. Alle Referenzen auf andere
    Knoten sind geradezahlige Indizes innerhalb des Arrays (siehe `$idx_up`, `$idx_left`
    und `$idx_right` in der Quelle). -1 markiert eine gerade verwendete Referenz.
    Wenn ein Knoten beispielsweise mehrere tote Knoten enthält, um zu markieren, ob
    ein selbst im Graph ist oder nicht (d. h. ob im Baum zugewiesen sind), wird ein
    anderer Flag definiert: `$free`. Diese Variable hat dann den Wert 1 (in Gebrauch)
    oder 0 (nicht Gebrauch).


    `tree_create()` erzeugt einen Dummyknoten und markiert ihn als frei, d.h. alle
    Referenzen werden nicht verwendet, und weist ihn dem Baum-Array zu. Anschließend
    wird dieses Array an den Anrufer zurückgeschickt.


    > > **Hinweis:** Der Anrufer muss nichts über dieses Array wissen, nicht einmal
    dass es ein Array ist. Das Programm lässt sich einfach als Baumstruktur zu bearbeitendes
    halten. Da PHP keine expliziten Typen hat und verlang, funktioniert dies sehr
    gut.


    `tree_allocate_node()` sucht innerhalb des Baum-Arrays nach einem freien Knoten,
    indem für jeden jedenhenden Knoten den Flag `$free` überprüft. Wenn keiner der
    Knoten als frei markiert ist, wird einfach einen neuen zu und fügt es dem Baum-Array
    hinzu. Hier macht sich die dynamische Struktur von PHP bemerkbar: Wenn wir Arrays
    fester Größe müssten, gingen uns von früher oder später auf die Knoten aus. Der
    gefundene Knoten wird dann als »in Gebrauch» markiert und als »zu bearbeiten«
    an den Anrufer zurückgeschickt.'
