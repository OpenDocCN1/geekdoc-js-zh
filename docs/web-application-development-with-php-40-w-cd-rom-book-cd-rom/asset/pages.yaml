    \ = DEBUG;\n```\n\nSobald die Fehlersuche eingeschaltet ist, gibt die Klasse DB_Sql\
    \ einige Werte aus den Funktionsaufrufen zusätzliche Informationen aus. Dies kann\
    \ sehr hilfreich sein, wenn wir Fehler suchen oder überprüfen möchten, ob die\
    \ SQL-Abfragen korrekt sind, die Ihr Skript generiert.\n\n# 6.2.3 Fehlerbehandlung\n\
    \nPHP kümmert sich um alle Fehler, die im Zusammenhang mit datenbezogenen Funktionen\
    \ auftreten. Ein positiver Nebeneffekt ist, dass der Code, den Sie mit DB_Sql\
    \ erstellen, kompakter ist, Sie sich nicht selbst um die Fehlerbehandlung kümmern\
    \ müssen.\n\nIn der Standardeinstellung wird das Skript bei jedem Fehler unterbrochen.\
    \ Dieses Verhalten können Sie steuern, indem Sie die Klassenvariable $Halt_On_Error\
    \ ändern, die standardmäßig auf yes gesetzt ist. Wenn Sie dies report setzen,\
    \ zeigt die Bibliothek die Fehlermeldung aus, ohne das Skript zu verlässt. Sobald\
    \ die Variable auf no gesetzt ist, ignoriert die Bibliothek alle Fehler. Dies\
    \ könnte zu unerwünschten Nebeneffekten führen, beispielsweise inkonsistente Daten,\
    \ wenn eine fehlerhafte Datenbankfrage ignoriert wird. seien Sie vorsichtig mit\
    \ dieser Option. In Produktionsanwendungen sollten Sie Fehlermeldungen informativ\
    \ sein und auf die üliche und website-typische Weise darstellen. Sie können Fehlermeldungen\
    \ auch selbst formatieren, indem Sie DB_Sql erweitern, indem Sie eine neue Klasse\
    \ generieren, um die Funktion haltmsg() zu überschreiben. Da diese Funktion alle\
    \ Fehlermeldungen festlegt, können Sie Meldungen leicht wie folgt verändern:\n\
    \n```\nclass test_db extends DB_Sql\n{\n  function haltmsg($msg)\n  {\n    print(\"\
    Database Error: $msg<br>\");\n    printf(\"MySQL said: %s<br>\", $this->Error);\n\
    \  }\n}\n```"
