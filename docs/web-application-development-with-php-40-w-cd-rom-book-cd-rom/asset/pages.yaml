  md: '# 9 Erweiterung von PHP 4.0: Knacken den PHP-Kern


    API-Funktionalität von Zend ein. Alternativ könnten wir versuchen, die Funktionalität,
    das Design, Tipps, Tricks uns als Ganzes zu erläutern, ihnen einen Gesamindruck
    zu verschaffen, bevor wir sie in die Praxis entlassen. Dies ist zwar das „bessere“,
    da es keine großen Herausforderungen erfordert, aber es kann auch sehr frustrierend
