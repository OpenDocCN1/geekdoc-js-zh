  md: "# 3 Programmentwicklung: ein Praxisbeispiel\n\nDie Verwendung der ereignisbasierten\
    \ Verarbeitung ist von besonderem Interesse. Dieses Verfahren ist in den konventionellen\
    \ Anwendungen implementiert, sonst z.b. alle Windows-Programme ereignisbasiert.\
    \ Ereignisbasierte Programme laufen in einer Endlosschleife, wobei man sich darauf\
    \ nennt, dass (ein Ereignis) passiert. Ein Ereignis kann u.a. eine Benutzereingabe,\
    \ eine Bewegung mit der Maus, ein Netzwerkverkehr (ankommende Pakete) sein. Sobald\
    \ ein Ereignis angekündigt wird, verlässt das Programm seine Hauptschleife und\
    \ sucht nach einer Prozedur, die dieses Ereignis verarbeitet. Alle Prozeduren,\
    \ die gerade aufgetretenene Ereignisse verarbeiten möchten, werden mit den angemessenen\
    \ Parametern des Ereignisses aufgerufen (z.B. Paketdaten des Netzwerkverkehrs).\n\
    \nBei der »konventionellen» Programmierung würde ein ankommendes Ping beispielweise\
    \ wie in Listing 3.1 verarbeitet:\n\n```\nwait_for_network_data();\n\nif(incoming_data\
    \ == ping)\n{\n    send_pong();\n    update_traffic_counter();\n}\n\ngoto again;\n\
    ```\n\nListing 3.1: Pseudocode für die Handhabung eines Pings\n\nDieser Programmcode\
    \ wartet, bis er Daten vom Netzwerk erhält. Danach ja, schickt der Code einen\
    \ Ping zurück und aktualisiert aus statistischen Gründen einen Datenverkehrszähler.\
    \ Danach springt er an die Stelle zurück, an der er begann. Stellen Sie sich ohne\
    \ einen Code mit Hunderten von Ereignissen vor, von denen einige möglicherweise\
    \ von anderen abhängen, einige andere nicht nur unter bestimmten Umständen – eine\
    \ Horrorvorstellung!\n\nEreignisbasierte Programmierung macht es deutlich einfacher,\
    \ wie Listing 3.2 zeigt:\n\n```\nevent_handler ping()\n{\n    send_pong();\n}\n\
    ```"
  merge: -1
