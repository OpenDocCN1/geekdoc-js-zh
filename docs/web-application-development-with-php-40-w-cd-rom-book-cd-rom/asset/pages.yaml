  md: '+   muss jedes öffnende Tag stets ein entsprechendes schließendes Tag oder
    selbst schließend sein (z. B. <ref/>).


    +   können Dokumente eine beliebige gültige Document Type Definition haben.


    Um zusammenzufassen: XML reduziert die Komplexität von SGML, behält aber dennoch
    alle notwendigen Funktionen für die strukturellezeichnung, einschließlich der
    Definition von nutzerspezifischen Dokumententypen.


    # Vorteile von XML


    Aber warum XML? Bei allen formalen Definitionen, Datenblättern und Kurzschriften
    erkennen Entwickler manchmal nicht auf den ersten Blick den Nutzen für ihre tägliche
    Arbeit. Warum sollen jetzt XML an Stelle von Word oder Notes verwenden? Oder einem
    eigenen proprietären Speicherformat? Oder einer relationalen Datenbank?


    Gegen proprietäre Formate spricht hauptsächlich ein Argument: Sie sind proprietär.
    Die, die auf einem heterogenen Netzwerk, wie dem Internet, verwendet werden können,
    müssen für alle Typen von Computer nutzbar sein, mit damit verbunden sein. XML
    besteht bis zum derzeitigen Format der meist proprietären Anwendungen), sondern
    es auf allen derzeitigen Computerplattformen unterstützt wird. Ügens proprietäre
    Formate (z.B. in öffentlichen Dokumenten) gar nicht in Betracht. Möchten Sie sich
    auf die Gnade eines einzelnen Herstellers verlassen, der seine Form ändern kann
    oder sogar ganzafft? XML ist lizenzfrei, herstellerneutral und plattformabhängig.


    XML bietet Mittel zur Strukturierung des Inhalts, unterscheidet sich aber von
    relational Datenbanken. Es bietet kein relationales Modell. Vielmehr ermöglicht
    es, eine unbegrenzte Anzahl von Verschachtungen, welche ein Datenbanksystem nicht
    bewältigt. Auf der anderen Seite fehlen ihm einige Funktionen, die ein RDBMS bietet,
    wie etwa Randbedingungen. Natürlich gibt es auch Ähnlichkeiten zwischen den Konzepten,
    und es gibt sogar Bemühungen, eine SQL-ähnliche Abfrage für XML-Dokumente zu generieren.
    Über den Erfolg von XML sollten Sie jedoch nicht vergessen, dass herkömmliche
    RDBMS durchaus nützlich sind. Sie bieten wichtige Verarbeitungsfunktionen, die
    in XML auch modelliert werden können, und sind von Anfang an auf Geschwindigkeit
    ausgerichtet.


    Der große und alles in dem Schatten Vorteil von XML ist die Trennung der Struktur
    vom Layout. XML-Dokumente können in beliebige Darstellungsformat umgewandelt werden:
    HTML, PostScript, PDF,'
