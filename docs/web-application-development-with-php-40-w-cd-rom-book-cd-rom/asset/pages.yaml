  md: '# Erzeugen von Variablen


    zval **parameter*;


    ```

    /* retrieve parameter */

    zend_get_parameters_ex(1,&parameter):


    /* at this stage. <parameter> still is connected */

    /* to Zend''s internal data buffers /


    /* make <parameter> write-safe */

    SEPARATE_ZVAL(parameter);


    /* now we can safely modify <parameter> */

    /* without implying global changes

    */

    ```


    SEPARATE_ZVAL verwendet emalloc() zur Zuweisung des neuen zval-Containers; dies
    bedeutet, dass er automatisch gelöscht wird, wenn das Skript endet, selbst wenn
    wir die Zuweisung des Speichers nicht selbst aufheben. Wenn Sie diese Makro häufig
    aufrufen, ohne die entfaltenen Container wieder freugeben, füllen sich langsam
    immer Ihr RAM.


    > Hinweis: Da Sie den an Schreibsicherheit der «traditionellen» API umgehen können
    (mit zend_get_parameters() usw.), scheint diese API veraltet zu sein. Deshalb
    werden in diesem Kapitel nicht mehr darauf einghen.


    # 9.12 Erzeugen von Variablen


    Wenn Sie Daten von Ihren eigenen Erweiterungen mit PHP-Skripten austauschen, betrifft
    dies eine der wichtigsten Fragen die Erzeugung von Variablen. Dieser Abschnitt
    beschreibt die von PHP unterstützten Variablentypen.


    # 9.12.1 Überblick


    Um Variablen zu generieren, die vom ausführenden Skript «von außen» gesehen werden
    können, müssen Sie einen neuen zval-Container zuordnen, diesen Container mit sinnvollen
    Daten füllen und anschließend in die interne Symboltabelle von Zend einfügen.
    Diese Vorgehensweise gilt für die Erzeugung aller Variablen:


    zval *new_variable;


    ```

    /* allocate and initialize new container */

    MAKE_STD_ZVAL(new_variable);

    ```'
