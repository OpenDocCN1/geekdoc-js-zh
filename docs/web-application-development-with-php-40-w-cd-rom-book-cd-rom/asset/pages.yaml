    falls Einzelschritte der Entwicklung von Konzeption der Datenstruktur, Flussdiagramme
    und Diagramme über die Beziehung der Einheiten bis zum Entwurf des Programcodes,
    der Dokumentation und allem dazischen. Das ist jedoch ein wichtiges Thema, wollten
    wir es nicht ganz aus diesem Buch streichen, sondern erörtern die Frage der Programmentwicklung
    gezielt an einem praktischen Beispiel, nämlich wie phpChat. In diesem Kapitel
    erhalten Sie einen ähnlichen erweiterten Programmfallstudie, einen tiefgehenden
    Einblick in Echtzeit-Chatserver-Programm, das mit PHP realisiert wird. Wir hoffen,
