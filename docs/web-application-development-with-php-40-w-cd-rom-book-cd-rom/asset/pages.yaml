    # 7.1.5 Authentisierung


    Eineforderung der Anwendung ist, dass sich registrierte Benutzer Einträge machen
    dürfen. Dank PHP lässt sich die Authentifizierung überprüfen, indem sie im Skript
    das sie schützen, den Aufruf page_open() einfügen, indem im Fall submit php, prüft.
    Auf diese Weise wird der Benutzer auf den Seiteninhalt zugreifen, nachdem er authentifiziert
    wurde.


    In der Tabelle speichern wir die eindeutige Benutzernummer, die von PHPLib geliefert
    wird. Wie wir im nächsten Kapitel gezeigt, können Sie diese Benutzennummer als
    Array $auth->["uid"] speichern, während $auth->["username"] den Benutzernamen
    angibt.


    Unsere Anwendung kümmert sich nicht um die Benutzerverwaltung.halb müssen wir
    irgendwo auf Ihrer Website Werkzeuge zur Registrierung von vergessenen Passwörtern
    einrichten. Da diese Aufgabe offen bleibt, haben wir keine Möglichkeit, den vollständigen
    Namen des Benutzers zu ermitteln. Alles, was wir haben, ist die eindeutige Benutzerennummer
    und den Benutzernamen. Es gibt dabei eine Funktion namens real_user_name(), welche
    als Parameter die Benutzernummer akzeptiert und den vollständigen Namen dieses
    Benutzers zurückgibt. Standardmäßig gibt diese Funktion nur die Benutzennummer
    zurück. Sollten diese Funktion erweitern, um in Ihrer Datenbank den vollständigen
    Namen des Benutzers zu suchen und zurückzugeben.


    # 7.1.6 Das fertige Produkt


    Die Funktion real_user_name() wird zusammen mit allen anderen API-Funktionen in
    einer zentralen Datei namens lib_inc.php gespeichert. Da es für alle Funktionen
    im Programmcode eine Dokumentation zum Syntax gibt, lässt sich sehr leicht eine
    API-Übersicht automatisch erstellen. Hierzu benötigen wir den Befehl:


    ```

    grep ''^\\\\/\*'' lib_inc.php

    ```


    Die Übersicht ist jedoch als Ersatz für eine vollständige technische Dokumentation
    und sollte als Kurzreferenz dienen. Nachdem die API definiert ist, beschränkt
    sich die restliche Anwendung hauptsächlich darauf, die API-Funktionen aufzurufen
    und die Ergebnisse auszudruck.'
