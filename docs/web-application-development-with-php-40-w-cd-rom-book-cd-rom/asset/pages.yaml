    zu ermitteln, heißt `Profiling`; sie ist extrem mächtig.


    Bei der Verwendung einer Datenbank ist der Engpass die Datenbank. Zeit, die Datenbank
    aufzurufen, eine (relativ kleine) Anfrage auszuführen, das Ergebnis einzuschließen
    und zu ermitteln, was zu tun ist (der'
