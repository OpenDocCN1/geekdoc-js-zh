    Der Kunde hat immer – auch wenn er unrecht hat


    Kunden, die eine Programmentwicklung in Auftrag geben, haben häufig nicht die
    Sachkenntnis, ein solches Programm zu entwickeln. Deshalb führen sie ihn an. Wenn
    Sie die Anforderungen mit Ihren Kunden besprechen, leiten Sie ihn ein wenig. Wenn
    der Kunde beispielsweise sagt: „Ich möchte ein Chat-Programm, das ganzeartige
    Bilder des Chatters anzeigt und mindestens einmal pro Sekunde aufgefrückt“ könnten
    Sie einen Gegenvorschlag machen: „Wäre es nicht besser, jede kleine Miniatursicht
    zu platzieren? Die meisten Chatter haben nicht genügend Bandbreite, um ganzseitige
    Bilder anzuzeigen.“


    Seien Sie aber vorsichtig. Bestehen Sie niemals auf Ihrem Standpunkt, wenn der
    Kunde nicht realisierbare Funktionen haben. Innerhalb der Zeit, damit Sie seine
    Vorstellung verwirklichen können. Im Vertrag ist es nicht zu gefährden, müssen
    Sie möglicherweise vorübergehend eine schlechte Lösung akzeptieren (wenn Sie feststellen,
    dass Sie den Kunden nicht überzeugen können, den besseren Weg zu wählen) und später
    ändern, wenn der Kunde einieht, dass seine Strategie nicht funktioniert.


    Für dieses Projekt übernehmen Sie die Rolle des Projektleiters und Autoren werden
