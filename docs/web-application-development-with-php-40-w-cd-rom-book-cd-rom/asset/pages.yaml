    Programierung und die Erweiterung einer Filiale in Berlin erforderten ein Umdenken
    in Bezug auf die Organisation von verteilten Entwicklungsprojekten. Hierfür hat
    sich eine Reihe von einfachen Werkzeugen (mit PHP) entwickelt, um die Verwaltung
    der Projekt- und Entwicklungsressourcen zu erleichtern. Lösungen mit verschiedenen
    Datenbanken realisiert, einschließlich Oracle, MySQL, PostgreSQL, Microsoft SQL
    Server und Sybase. Aufgrund ihrer Open-Source-Philosophie und Kostenüberlegungen
    bevorzugt sich für die meisten nicht transaktionsbasierten Anwendungen die Verwendung
    von MySQL und für transaktionsbasierte Anwendungen, die SixAM, Oracle.


    Sowohl für sich als für seine Kunden hat PHP eine große Rolle gespielt und spielt
    sie noch. Die Wahl und der Einsatz von PHP wurde Dezember 1996 mit der PHP-Version
    2.0 beta getroffen, die heute noch eine zentrale Komponente in SiCMS ist. Die
    Verwendung von PHP hat nicht nur die Open-Source-Philosophie der Firma vorangetrieben,
    sondern auch eine komfortable und angeneene Umgebung für die Entwicklung von Highend-Anwendungen
    bereitgestellt.


    # 8.2.6  PHP: Ein Geschäftsvorteil


    Viele der funktionalen Verbesserungen und Leistungsvorteile der Six-Anwendungen
    lassen sich direkt in PHP realisieren, genauso wie die Vorteile der Entwicklung
    und die Möglichkeit, Änderungen und die Möglichkeit eines erneuerte Projekts vorzunehmen.
    Weitere Vorteile sind das einfache Verständnis und die effektive Nutzung von PHP
    ohne vorherige Kenntnisse und Erfahrungen. Diese Vorteile erhöhen die Leistung
    und reduzieren gleichzeitig die zusätzlichen Entwicklungkosten. Diese Branche
    bietet sehr kurz die Entwicklungs- und Implementierungszeiten, und PHP bietet
    eine zuverlässige Middleware oder Anwendungsserverkomponente, die diese Laufzeitanforderungen
    erfüllen.'
