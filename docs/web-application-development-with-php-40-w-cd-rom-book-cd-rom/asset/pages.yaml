  md: '# 8.3.3 Warum PHP?


    MarketPlayer.com verwendet PHP, dieses in der Lage zu sein, eine schnelle Entwicklungsumgebung
    bereitzustellen. Mithilfe von PHP kann MarketPlayer.com innerhalb von Tagen konzeptionelle
    Entwürfe direkt bereit in einer Beta-Version umwandeln. Teile der Anwendung, die
    optimiert werden müssen (in der Geschwindigkeit), können heraus genommen, in C
    geschrieben und in Form von Funktionen in eine benutzerspezische PHP-Bibliothek
    integriert werden.


    MarketPlayer.com verwendet PHP erstmals im Oktober 1999, als Unternehmen beschloss,
    die Produktentwicklungsgruppe zu erstellen. Zu Beginn setzte MarketPlayer.com
    das SSI-Verfahren ein, um dynamische Seiten zu erstellen. Ein Großteil der Firma
    wurde also zur Webentwicklung ganz WYSIWYG-Anwendungen. PHP ermöglicht MarketPlayer.com,
    anspruchsvolle dynamische Websites zu erstellen und gleichzeitig Verbesserungen
    der existierenden Gruppe zu nutzen, den WYSIWYG-Ansatz für die Webentwicklung
    verwendete. Vor PHP hatte die bereits Lösungen mit Perl und Java realisiert, doch
    nach der Einführung von PHP diese anderen auf der Strecke.


    Die Tatsache, dass PHP ein Open-Source-Programm ist, bietet für MarketPlayer.com
    gegenüber anderen Skriptsprachen Vorteile:


    +   Anwendungen können leicht optimiert werden, indem PHP-Quellecode Module und
    Funktionen hinzugefügt werden, die MarketPlayer.


    +   Die Unterstützung für diese Technologie wächst täglich.


    +   Viele Einzelpersonen stellen der Gemeinschaft erstklassige PHP-Anwendungen
    zur Verfügung, und die GNU-Lizenzierung beschleunigt die Entwicklung von Schlüsselerprodukten.


    # 8.3.4 Vorteile von PHP für die Produktentwicklung von MarketPlayer.com


    MarketPlayer.com zieht PHP anderen Technologien nicht nur wegen des einfachen
    Designs vor, sondern auch wegen der Verfügbarkeit und Erweiterbarkeit des Quellcodes,
    der guter Integration auf Apache-Server und vor allem seiner Ähnlichkeit zu Programmiersprache
    C. Die zweite Wahl wäre möglicherweise Perl gewesen, aber mit dieser Sprache waren
    die MarketPlayer.com-Programmierern nicht vertraut, und Erweiterungen für Datenbanken
    und parallele Algorithmen wären kostspielig. Cold Fusion wurde nicht berücksichtigt,
    und durch die enge Verknüpfung zu Windows-Plattformen wurde ASP von vornherein
    ausgeschlossen. Bis vorzem stzte sich MarketPlayer.com auf serverseitige Java
    für spezifischen,'
