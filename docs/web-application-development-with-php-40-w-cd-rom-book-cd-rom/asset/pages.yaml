    \ Modifikationen, wird jedoch interessant. Der Container von parameter wird dem\
    \ (vordinierten) return_value-Container zugeordnet. Sein Inhalt auf effektive\
    \ Weise zu kopieren, wird der Copy-Konstruktor arbeitet direkt mit dem bereitgestellten\
    \ Argument, wobei standardmäßig die Rückgabewerte FAILURE (bei einer fehlgeschlagenen\
    \ Aktion) SUCCESS (bei einer erfolgreichen Aktion) ausgegeben werden.\n\nWenn\
