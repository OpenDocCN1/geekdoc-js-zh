  md: '# PHP und XML


    es um logische Auscheidung. Die Stilinformation wird direkt im Browser eingegeben.
    XML-Dokumente setzen sich aus solchen Auscheidungen zusammen. Wie HTML werden
    Tags verwendet, um die Auszeichnungsinformationen zu kennzeichnen. Bei XML gibt
    es visuelle Elemente wie HTML (denken Sie an `<font>`). Es ist auf logische Auscheidung
    beschränkt. Es gibt keine Möglichkeit, XML z. B. ein Wort kursiv zu setzen. Sie
    können es lediglich, gemäß seiner semantischen Bedeutung zu kennzeichnen, z.B.
    mit `<em>`.


    So weit zur Auscheidung. Wie ist die Struktur? XML-Tags können verschwechsel werden
    und haben einen Kontextstatus. Er ist relevant, was in einem Dokument auftreten.
    Die Tagkombination `<chapter><title>` wird anders behandelt als `title`. In der
    XML-Spezifikation gibt es keine Beschränkung in Bezug auf die Anzahl der verschachtelten
    Elemente. Die einzige Forderung ist, dass alle Elemente Ursprung im Stammelement


    # XML-Verwandte


    Der Vorlä von XML ist SGML. Seit 1986 zum ISO-Standard, wird SGML (Standard Generalized
    Markup Language) von größeren Firmen aller Industriezweige zur Erzeugung strukturierter
    Dokumente verwendet. SGML ist jedoch ein komplizierte Standard, der von Anwendungen
    unterstützt wird. Die meisten SGML-Anwendungen — Editoren, Speicherver, Konvertierungswerzeuge
    — sind daher teuer; häufig kosten Sie über $10.000.


    HTML hat dagegen industriewitite Unterstützung, und definiert einen einfachen
    Typ von Dokument für eine gewöhnliche Klasse von kurzen Artikeln mit Kopfköpfen,
    Absätzen, Listen und/oder Bildern enthält viele Funktionen zum Einbinden von Hypertext-Mark
    und Multimedia-Anwendungen. Es ist jedoch in Bezug auf die Flexibilität und Erweiterbarkeit
    sehr begrenzt. Die Tags und die Semantik sind festgelt. Sie können keine jedes
    für Tag einen Eintrag in ein Inhaltsverzeichnis definieren. Außerdem eignet es
    sich nicht für andere Medien als Computerschnittstellen. Wenn Sie versucht haben,
    Artikel auszudrücken, die viele Dateien werden, wissen Sie, was dies heißt. Die
    offene Spezifikation von HTML führt dazu, dass sie verschiedene HTML>>Dialekte
    entwickelt wurde. Was Sie nicht, ist es eine Kunst für sich, browserneutrales
    HTML zu schreiben.


    So entstand die Notwendigkeit, ein neues Format zu generieren, mit dem strukturierte
    Dokumente im gesamten Web verwendet werden können. Um die Beschränkung der einzigen
    ernsthaften Alternativen HTML und SGML zu überwinden, wurde XML entwickelt.'
