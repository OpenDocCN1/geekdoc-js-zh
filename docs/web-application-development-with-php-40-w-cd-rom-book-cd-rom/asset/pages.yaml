  md: '# ## Dreistfige Anwendungen


    Bei größeren Entwicklungsteams sind effektive Mittel zur Organisation eines Projekts
    lebenswichtig. Bisher haben wir Ihnen gezeigt, wie Sie Layout und Code trennen.
    Verzeichnisstrukturen organisieren und ein Versionskontrollsystem zur Verwaltung
    des Codes einsetzen. Wenn die Sprache für verteilte Entwicklung, verschiedene
    Entwicklungsphasen und Geschäftsprozesse kommt, erscheinen Marketingfach auf der
    Oberfläche und schrehen mehrstuhenden Anwendungen. Was soll das Ganze?


    # 5.4.1 Herkömmliches Client/Server-Modell


    In der Vergangenheit war eine Nicht-Webanwendung verantwortlich für die Abwicklung
    aller Angelegenheiten, beginnend bei der Benutzeroberfläche über die Anwendung
    zur Datensicherung. Diese drei Einheiten waren miteinander verwoben, was es schwierig,
    nicht gar möglich machte, von einer ohne Auswirkungen auf die anderen zu ändern.
    Wenn eine Anwendung bei mehreren Benutzern zur Verfügung steht, hatten Sie ein
    Problem. Was ist, wenn sich das Datenformat ändert? Was passiert, wenn Sie die
    Programmlogik ändern müssen? Sie müssten jeden Benutzer mit einer neuen lokalen
    Kopie der Anwendung versehen, was bei größeren unmöglich ist.


    Mit der Einführung der objektorientierten Entwicklung in Bezug auf Analyse, Design
    und Programmierprinzipien wurden Geschäftsanwendungen modular. Benutzerochnittstellen
    wurden üblicherweise auf Arbeitsplatzrechnern eingesetzt, während Daten und Programmlogik
    auf einem Mainframeserver untergebracht waren. Der Begriff Client/Server wurde
    verwendet, um die Trennung der Zeiten oder Stufen zu beschreiben. Eine zweistufige
    Client/Server-Architektur bietet grundsätzlich die Möglichkeit, Aufgaben zuzuführen.
    Der Client bzw. die erste Stufe ist für die Darstellung der Daten für den Benutzer
    (Benutzerochnittstelle) verantwortlich, während der Server dient, die zweite Stufe
    für die Bereitstellung von Diensten für den Client und die Verwaltung der Programmlogik
    zuständig zu sein. Was ist gut. Aber wie wir sehen, kombiniert das zweistufige
    Modell noch zwei verschiedene Konzepte in der zwei Stufen (dem Server): Datendienst
    und Programmlogik. Die Programmlogik bildet das Herz des Programs...


    Die Datendienste verwalten die Rohdaten der Anwendung. Häufig bestehen diese aus
    relationalen Datenbankverwaltungssystemen (RDBMS) oder einem vorhandenen Mainframesystem,
    in das die bereits Zeit und Geld investiert hat. Die Vermischung beider Konzepte
    in einer zweistufigen Anwendung führt zu Problemen der Skalierbarkeit, Wiederverwendung
    und Datenpflege. Nehmen wir als Beispiel den kürzlich eingefführ'
