    # 1.5 Schreiben einer Dokumentation


    Neben der Kommentierung und Strukturierung ist die Dokumentation ein wichtiger
    Teil der Entwicklungarbeit. Die Dokumentation eines Projektes ist möglicherweise
    der erste Teil des Projek, den Ihr Kunde sieht – und der erste Eindruck zählt.


    Professionell entwickelte Dokumentationen, die mehr als das obligatorische » Befolen
    Sie die Installationsanweisungen in der README-Datei« enthalten, sollten in Fleisch
    und Blut übergehen. Wie Sie für Ihr Mobiltelefon, einen neuen Monitor oder andere
    technische Geräte erwarten, selbst wenn diese im kleinsten gekauft haben, erwarten
    Ihre Kunde Dokumentation von Ihnen (nicht zu vergessen, dass sie eine Menge Geld
    dafür bezahlt haben.


    Wie bei RAD-Programmen werden ausführliche Dokumentationen übllicherweise mithilfe
    von PHP unterstützte. Leider gibt es bisher keine Werkzeuge, die speziell auf
    darauf zugeschnitten sind. Die Handbuch-Erstellung bleibt daher eine nicht unterstützte
    und undankbare Aufgabe. Trotzdem ist sie notwendig. Sie sollte jedoch nicht Ihre
    Produktivität behindern. Ein vollständiges Handbuch sollte wie ein kleines Buch
    aufgebaut sein und folgende Punkte enthalten:'
