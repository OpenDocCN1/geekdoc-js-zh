  md: 'oder einem Stylesheet-Prozessor XT von James Clark bemerkenswert.

    Xmetal von SoftQuad bietet komfortabel Bearbeitungsmöglichkeiten, die intuitiveuelle
    Bearbeitungen von Cascading Style Sheets (CSS) ermöglichen und sich zur Anzeige
    in Autorensystemen eigen (siehe hierzu Abbildung 7.3).


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_306_0.png)


    What Is XML Used For?

    As a structured information language, XML is of course used in content management
    systems, allowing flexible and corporate document structures. But there are plenty
    of other-XML applications and sub-protocols. Due to the open nature of the standards,
    XML has been adopted by many developers.


    Docbook

    The Docbook DTD is a popular set of rules for describing books, articles, and
    other types of documents like technical documentation. It was originally developed
    in 1991 by the publisher O''Reilly as an SGML DTD which was later converted to
    XML. It was further expanded by O''Reilly who led the development of the Docbook
    Group. In 1998, OASIS (Organization for the Advancement of Industrial Standards)
    adopted Docbook as an International Standard and it was converted to XML. An XML
    version (3.1) was created by Norm Walsh, which is used to transform this into
    an XML-based release.

    Docbook was chosen to be adopted by many because it was already well-tested and
    had many XML sub-elements and attributes that were useful for publishing articles.

    When we started writing this, it was clear for us that we wanted to use a version-based
    approach. The Docbook DTD was chosen because it allowed us to define each element
    as ever a MouseElement (element) for our quick-reference. The conventional name
    of mouse (element) in your word processing would be the Docbook tag.


    WML – Wireless Markup Language

    WML is another Document Type Definition which can quickly become an industry standard.
    It is used for specifying content and user interfaces for wireless devices, like
    mobile phones or Personal Digital Assistants. These devices have some common constraints
    which make HTML a bit costly for a markup language.


    +   - small and low resolution graphics

    - limited user interaction


    Abbildung 7.3: Xmetal von SoftQuad – ein XML-Autoresystem, welches mit diesem
    Buch erstellt wurde


    # 7.2.3 WML – Wireless Markup Language


    Eine weitere Document Type Definition, die schnell zum Industriestandard wurde,
    ist WML. Sie ist für die Verwendung in spezifischen Inhalten und Benutzerochnittstellen
    für drahtlose Geräte, wie Mobiltelefone oder Personal Digital Assistants, geeignet.
    Aufgrund der Beschränkungen, welche diese Geräte haben, ist seine Auszeichnungssprache:


    +   - Sie haben keine und aufgelösste Grafiken.

    - Sie benötigen weiterhin (bisher) nur einen Schmalbandzugang für Netzwerke.

    - Sie haben eine begrenzte Rechenkapazität.'
