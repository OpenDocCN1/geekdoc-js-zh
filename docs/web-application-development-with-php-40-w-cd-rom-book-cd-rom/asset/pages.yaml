  md: '# Wissensrepräsentation


    In der Regel werden die Aktionen unter den einzelnen Datenstrukturen zusammengefasst,
    die zuvor definiert wurden. Konzentrieren uns zunächst auf die Aktionen, die mit
    Einträgen in der Datenbank befassen:


    +   * Auslesen eines speziellen Eintrags. Für diese Aktion muss der Bezeichnung
    des ausschließenden Eintrags bekannt sein. Die Aktion schlägt fehl, wenn in der
    Datenbank kein Eintrag ist, der mit dem Bezeichnung übereinstimmt. Sie kann auch
    fehlgeschlagen, wenn der Systemfehler auskommt, z.B. wenn es keinen Zugriff auf
    das Datenbanksystem gibt. Wenn die Aktion erfolgreich ist, wird die Struktur für
    den Eintrag zurückzugegeben.


    +   * Auslesen von Einträgen in einer spezifischen Kategorie. Für diese Aktion
    muss der Name der Kategorie bekannt sein, für welche Einträge gelesen werden sollen.
    Wenn die Aktion erfolgreich ist, wird eine Liste der gültigen Einträge zurückzugegeben.
    Eine Liste der Einträge? Moment – solche Datenstrukturen hatten wir bisher nicht
    definiert. Es ist Zeit, zur Speifikation zurückzukehren und eine neue Struktur
    für Listen anzuzeigen.


    +   * Auslesen der hinzugefügten Einträge


    +   *lesen der Einträge, auf die am meisten zugegriffen wurden


    +   * Auslesen aller Einträge von einem bestimmten Autor


    Diese Liste lässt sich für alle genannten Aktionen und Bereiche fortsetzen. Am
    Schluss erhalten wir eine umfassende Liste aller erforderlichen Strukturen und
    Aktionen, die das gesamte Projekt dokumentiert.


    Um zusammenzufassen: Wir haben einen Anforderungskatalog erstellt, indem wir das
    Problemfeld der Anwendung haben und die Funktionen beschrieben haben. Indem wir
    den Anforderungskatalog in konkretere Begriffe gefasst haben, haben wir eine Speifikation
    erstellt. Die Speifikation beschreibt die Datenstrukturen und das Verhalten der
    Anwendung.


    Nun sollen wir uns im Einzelnen damit befassen, wie die Anwendung realisiert werden
    kann. Wir picken uns zwei interessante Aspekte heraus, nämlich die Verwendung
    von Schablonen und den Einsatz von verschachtelten Kategorien in SQL.


