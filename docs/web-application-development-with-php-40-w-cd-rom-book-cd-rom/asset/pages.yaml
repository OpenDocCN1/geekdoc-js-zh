  md: '# Erweiterung von PHP 4.0: Knacken wir den PHP-Kern


    Jene, die wissen, reden nicht.

    jene, die reden, wissen nicht.


    Manchmal ist PHP »wie vorliegende» einfach einfach nicht genug. Für den durchschnittlichen
    Benutzer wird dieser Fall wohl eher selten auftreten, aber für professionelle
    Erweiterungen bringen PHP an die Grenzen seiner Leistungsfähigkeit in Bezug auf
    Geschwindigkeit und Funktionalität. Aufgrund von Sprachbeschränkungen und Unverträglichkeiten,
    die auftreten, wenn mit einer sehr großen Bibliothek als Standardcode gearbeitet
    wird, die jedes einzelne Skript angehängt wird, können neue Funktionen nicht direkt
    implementiert werden. Deshalb muss eine andere Methode gefunden werden, um potenzielle
    Mängel in PHP zu beseitigen.


    Sobald dieser Punkt erreicht ist, ist es, das Herz von PHP unter die Lupe zu nehmen,
    und den Kern, d.h. den C-Code anzuzeigen, der PHP zum Laufen bringt.


    > Hinweis: Dieses Kapitel behandelt die Erweiterung von PHP 4.0. Ein Großteil
    der Informationen ist zwar auch für PHP 3.0 relevant, trotzdem sind die Beispiele
    nicht darauf ausgelegt, zu PHP 3.0 kompatibel zu sein. Wenn sich jemand die macht,
    PHP zu erweitern, wird er unserer Meinung nach PHP 4.0 zurückgreifen. Angesichts
    der Vorteile der neuen PHP-Version ist eine Neukompilierung von PHP 3.0-Servern
    nicht sinnvoll.


    Zum Zeitpunkt der Buchstellung waren einige Funktionen in PHP 4.0 nicht mehr fertiggestellt
    oder funktionsuntchtig (eine der Hauptpakete ist die thread-safe Version von Zend).


    # 9.1 Überblick


    »PHP erweitern« ist einfacher gesagt als getan. PHP hat sich zu einem voll ausgestatteten
    Werkzeug entwickelt, das aus ein paar Megabyte Quellecode besteht. Ein System
    wie dies zu knacken, müssen Sie einsehen und berichtigen. Bei der Strukturierung
    dieses Kapitels entschlossen wir uns schließlich für den Ansatz »Lernen durch
    praktische Anwendung.». Dies ist zwar nicht der wissenschaftlichste und professionellste
    Ansatz, aber die Methode, die am besten Resultate erzielt. In den folgenden Abschnitten
    erfahren Sie schnell, wie Sie die einfachsten Erweiterungen erzeugen und sofort
    einsetzen können. Danach gehen wir auf auf die fortgeschrittene'
  merge: -1
