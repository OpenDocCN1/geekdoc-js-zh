    # 3.6 Verwaltung und Sicherheit


    Ein System ist nur dann ein gutes, wenn es verwaltet werden kann. Die Tage, in
    denen es laut «Netiquette» eine Frage der Ehre war, sich selbst in die Gemeinschaft
    zu integrieren, sind längst vorbei. Heutzutage ist fast jeder Hacker, Schikanierungen
    und anderen Formen von Attacken ausgesetzt, und leider bleiben diese nicht nur
    auf verbalen Ebene. Es gibt etwas einzuwenden, nach Sicherheitslücken und anderen
    Löchern im Programm oder dem Netzwerksystem zu suchen. Diese auszunutzen, ist
    jedoch mehr als verwerlich. Trotzdem betrachten viele es als »Spaß«. Dieses Verhalten
    zeigt klar den Bedarf für eine externe Schnittstelle, die unabhängig'
