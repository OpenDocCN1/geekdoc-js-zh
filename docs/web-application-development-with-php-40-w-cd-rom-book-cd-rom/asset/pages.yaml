    Selbst wenn wir uns alle diese Ratschläge merken und alle von Benutzer gelieferten
    Variablen überprüfen, können wir sehr leicht die falschen Überprüfungen vornehmen.
    In allen Programmen sollten beispielsweise bestimmte HTML-Tags in Daten zulassen
    sein. Dieses Tags ist als `<p>`, das die Formatierung von Texten in Absätzen ermöglicht.
    Es kann ein Attribut namens Tag anpassen, sollten Sie in einem ersten Versuch
    den Ausdruck `</p>` verwenden. Viele Browser unterstützen auch für eine ganze
    Reihe JavaScript-Scripthalten. Benutzer können ein beliebig JavaScript, das im
    Ereignis onClick oder onMouseover das <p> eingebettet ist, und den Code erneut
    ausführen.


    Zunächst möchten wir Ihnen klarmachen, dass alle diese Bedrohungen zusammengenommen
    ein sehr hässliches Bild ergeben. Sie müssen wirklich sehr vorsichtig sein, wenn
    Sie alle Fallen vermeiden möchten. Dies ist der Hauptgrund weshalb wir empfehlen,
    einen Sicherheitsberater in derart Entwicklungsprozess aufzunehmen.


    Hier einige allgemeine Hinweise und Richtlinien um diese Risiken zu minimieren:


    +   Verwenden Sie Sitzungen, anstatt Daten vom Client von einer Seite auf die
    nächste weiterzuleiten.


    +   Überprüfen Sie alle Daten aus dem Benutzerraum inklusive Kodierung bzw. Das
    kleinere als (<) und größer als-Zeichens (>) sowie Ampersands (&). Achten Sie
    auch auf doppelte Anführungszeichen ("),), einfache Anführungszeichen (’) und
    Leererräume, zumindest in Tag-Attributen und Attributwerten.


    +   Stellen Sie sicher, dass Ihr Programm in einer zuverlässigen Umgebung arbeitet.


    +   Achten Sie besonders auf die Reihenhenfolge der PHP-Variablen (siehe nächsten
    Abschnitt).


