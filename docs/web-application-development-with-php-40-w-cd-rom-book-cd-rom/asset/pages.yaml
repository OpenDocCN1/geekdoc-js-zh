  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    web-basierten Chatsystem nicht benutzt werden, da alle Verbindungen vom Webserver
    ausgehen. Die einzige Adresse, die man verbinden könnte, wäre die Adresse des
    Webservers, wodurch die komplette Schnittstelle vom Netz abgetrennt wird. Trotzdem
    bestimmte Benutzer ausfiltern zu können, sollten die Verbindungen vom PHP-Ebene
    ausgewertet werden.


    # 3.6.3 Auf der Datenbankebene


    Auf der Datenbankbene ist alles anders. Clients können sich anmelden, aber ihre
    Nachrichten und Sitzungen werden der Datenbank gefiltert. Entweder wird ein externes
    Werkzeug von dem Chatcode selbst benutzt oder ob der Benutzer das Recht hat, etwas
    zu sagen zu tun. Basierend auf dieser Information wird seine Nachricht in der
    Datenbank eingefügt oder nicht. Diese Strategie erfordert eine sehr Integration
    in den Hauptcode. Außerdem ist sie nicht sehr flex (und etwas umständlich) und
    nicht sehr leicht zu implementieren.


    # 3.6.4 Auf der IRC-Ebene


    IRC hat eigene Wirkungsfunktionen, die im Servercode und im Netzwerkprotokoll
    integriert sind (wir lesen die RFC und mit diesen Möglichkeiten vertraut). Die
    Verwaltung kann sogar reguläre Benutzer vorgenommen. Es gibt zwei Ebenen:


    +   - Kanaloperatoren. Diese Operatoren haben administrative Kontrolle über Kanäle.
    Sie können Benutzer hineinsticken, sie zum Schweigen bringen, sie verbieten, andere
    Benutzer zu Operatoren machen u.a (diese Ebene ist für alle Benutzer verfügbar).

    - IRC-Operatoren. Diese Operatoren haben administrative Kontrolle über das Netzwerk
    (nicht über die Kanäle). Sie können Benutzer aus dem Netz werfen, welche Netzwerkverbindungen
    herstellen usw. (diese Ebene ist nur bestimmten Benutzern zugänglich).

    - Dienste. Diese Dienste haben administrative Kontrolle über Kanäle, aber nicht
    über das Netzwerk. Sie können sich wie reguläre Benutzer verhalten. Sie benötigen
    eine spezielle Anmeldeprozedur (diese Ebene ist nur für bestimmte Benutzer zugänglich
    und ist für automatisierte Clients gedacht).


    Wie sie sehen, kann die Verwaltung auf IRC-Ebene über einen Client durchgeführt
    werden, der separat vom Haupt-System arbeitet. Ein separater Client mit IRC-Operator-
    und Operator-Status die ideale Kombination aus Funktionen, die wir als Verwaltungssystem
    haben müssten. Im Prinzip brauchen wir zunächst nur den IRC-Operator-Status, der
    der Client, sobald der IRC-Operator-Status erlangt hat, überall den Kanaloperator-'
