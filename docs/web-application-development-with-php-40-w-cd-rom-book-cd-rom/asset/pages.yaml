    # 8.1.4 Schlußfolgerung


    »PHP hat neue Anforderungen erfüllt, sagt CTO CTO Musone.»Es arbeitet mit Apache,
    MySQL und Oracle zusammen, um nur einige zu nennen. Und das auf sehr zuverlässige
    und leistungsfähige Weise, was zu effizienten dynamischen Webseiten mit sehr Problemen
    und nahezu kaum Ausfällen führt. PHP ist für unser Geschäft ganz klar von Vorteil,
    und wir sind froh, dass wir es mit Besten können.«


    # 8.2 SixCMS


    Professionelle Inhaltsverwaltungssysteme waren bisher die großer Firmen und eher
    kontinental, da sie mit Standardprodukten realisiert werden, die in der Regel
    eine selbststellige Summe kosten. Wie würde ein voll ausgestelltes Inhaltsverwaltungssystem
    (CMS) gefallen, das in PHP geschrieben ist? Seit Offene Systeme GmbH (www.six-x.de)
    besitzt.


    # 8.2.1 Firmenhintergrund


    Das vor acht Jahren gegründete Unternehmen Offene Systeme GmbH (im Folgenden kurz
    als «Six» bezeichnet) entwickelte und vertrieb für verschiedene Industriezweige
    anspruchsvolle Datenanwendungen, die Open-Source-basierte Internet- und Intranet-Technologien
    verwendeten. Sie hat sich auf die Entwicklung von individuellen Lösungen spezialisiert,
    die auf Unternehmens Bedürfnisse zugeschnitten, wobei das Hauptmerk auf dem Zielmarkt,
    der Produktpakete und den technischen Anforderungen der Kunden liegt. Die Breite
    der Beratungsdienste und kundenspezifischen Lösungen von Six umfasst die Entwicklung
    von effektiven Geschäftsmodellen für die Online-Präsenz, die Definition von Meilensteinen
    mit einer differenzierten Strategie zur Implementierung, die Unterstützung für
    die Erarbeitung von mittel- und langfristigen Wirtschaftlichkeitsplänen, den Einsatz
    von Geschäftsprozessmodellierungen für die optimale Ressourcenautzung, die Formulierung
    von technischen Anforderungen sowie die Entwicklung von detaillierten Anforderungskatalogen.
    Das gesamte Wissen aus mehr als vier Jahren Programmiererfahrung hat sich nicht
    in zwei standardisierten kommer-'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'ziellen Lösungen niederschlagen, die PHP einsetzen: SixCMS (ein Content Management-System)
    und SixAIM (ein System zur Kundenbetreuung und Fakturierung), die Six jetzt herausgebracht
    hat. Derzeit sind 27 Mitarbeiter bei Six beschäftigt, außerdem bietet die Firma
    eine hervorragende Umgebung und Möglichkeiten für Studenten aus verschiedenen
    Gebieten der Informationstechnologie und der neuen Medien, die ihr Praxissemester
    absolvieren oder ihre Diplomarbeit abschneiten


    Von den 27 Six-Mitarbeitern sind 20 direkt an der Entwicklung und Programmierung
    von Anwendungen beteiligt. Eine der Vorteile von Six besteht, dass ein Entwickler
    unterschiedliche Ausbildungs- und Erfahrungkenntnisse mitbringt und an verschiedenen
    Gebieten wie Informatik, Physik, Medien, Kartografie, Landwirtschaft, Philosophie
    und Systemverwaltung arbeiten.


    # 8.2.2 Open-Source-Geschäft


    Six bleibt im Vergleich zu den mehr proprietären Technologien immer vorne in der
    Nutzung der Open Source/System. Als Marktführer und Anbieter von Weltklasseösungen
    in Deutschland und Westeuropa hat Six im Jahr 2000 eine Filiale in New York City
    eröffnet.


    Von vielen Kunden wird die SixCMS als die Nummer Eins der Content Management Systeme
    betrachtet. Ihre Unterstützung von mehreren Programmiersprachen für die Schnittstelle
    und umfassende Funktionalität macht die Anwendung zu einer optimalen Lösung für
    die Verwaltung von dynamischen inhaltsgesteuerten Websites.


    Die Firmen-Website (http://www.six.de) und der SixCMS-spezifische URL (http://www.sixcms.com)
    liefern zahlreiche Informationen über die Firma, ihre Kunden und die Lösungen.
    Diese Websites sind zwar ein hervorragendes Medium, um Informationen über die
    Firma und ihre Lösungen zu verbreiten, aber Mund-zu-Mund-Propaganda von zufriedenen
