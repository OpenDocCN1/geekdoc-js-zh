    \ Feld als nicht benutzt zu markieren, verwenden Sie das NULL. Zur Deklaration\
    \ einer Funktion verwenden Sie das Makro ZEND_SHUTDOWN. |\n| request_startup_func\
    \ | Diese Funktion wird bei jeder Seitenanfrage aufgerufen, und kann für einmalige\
    \ Initialisierungsschritte verwendet werden, die zur Verarbeitung einer Anfrage\
    \ erforderlich sind. Ein Fehlschlagen zeigt die Ausgabe FAILURE an, ansonsten\
    \ SUCCESS zurückgegeben werden. |\n| request_shutdown_func | Diese Funktion wird\
    \ einmal nach jeder Seitenanfrage aufgerufen. Sie stellt das Gegen zu `request_startup_func()`\
    \ dar. Um ein Fehlschlagen anzuzeigen, geben Sie FAILURE zurück, ansonsten SUCCESS.\n\
    \ Hinweis: Da dynamisch ladbare Module nur bei Seitenanfragen geladen werden,\
    \ folgt auf die Anfragebeitungsfunktion direkt ein Aufruf der Modulbeendigungsroutine\
    \ (beides wird gleichzeitig deinitialisiert). Um dieses Feld als nicht benutzt\
