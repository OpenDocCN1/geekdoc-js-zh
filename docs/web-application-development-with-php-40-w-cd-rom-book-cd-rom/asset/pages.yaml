    XML (Extended Markup Language) hat sich zum weitesten verbreiteten Standard für
    den Datenaustausch entwickelt. Trotz schwierigen allgemeinen Bemerkungen, »XML
    ist mit seinen eigenen Tags er«, das tatsächliche Konzept dahinter zu verstehen.
