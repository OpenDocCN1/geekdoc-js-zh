    # 3.5.4 Schnittstelle zum Benutzer


    Nachdem wir alle für den Datenaustausch problematischen Aspekte beseitigt haben,
    ist die eigentliche HTML-Schnittstelle zum Benutzer trivial. Wir wissen, wie wir
    mit Eingaben des Benutzers umgehen müssen und wie die Netzwerkkommunikation zu
    verwalten. Das letzte »Problem» besteht darin, die erzeugte Ausgabe für den Benutzer
    auf eine bequeme Art und Weise zu packen. HTML bietet nur eine Möglichkeit, mehrere
    Fenster unabhängig voneinander anzuzeigen: Frames. Die Schnittstelle besteht in
    der Regel aus Benutzereingabefeld, dem Chat-Ausgabefeld, einer Liste'
