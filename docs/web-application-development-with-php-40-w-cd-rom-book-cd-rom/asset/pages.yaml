  md: "# Erweiterung von PHP 4.0: Knacken wir den PHP-Kern\n\n| Makro | Beschreibung\
    \ |\n| ZEND_GSHUTDOWN(module) | Deklariert eine Funktion zur globalen Deinitialisierung.\
    \ Der erzeugte Name lautet zend_gshutdown_<module> (z.B. zend_gshutdown_first_module).\
    \ Zu verwenden in Verbindung mit ZEND_GSHUTDOWN_FUNCTION. |\n ZEND_INFO(module)\
    \ | Deklariert eine Funktion zur Ausgabe von Modulin, die beim Aufruf von phpinfo()\
    \ verwendet wird. Der erzeugte Name lautet zend_info_<module> (z.B. zend_info_first_module).\
    \ Zu verwenden in Verbindung mit ZEND_INFO_FUNCTION. |\n\nTab. 9.3: Makros der\
    \ Initialisierungs- und Deinitialisierungsfunktionen\n\n# 9.10.6 Einbettung von\
    \ get_module()\n\nDiese Funktion ist speziell für dynamisch ladbare Module gedacht.\
    \ Betrachten wir zunächst, wie Ihr Modul installiert wird:\n\n```\n#if COMPILE_DL\n\
    DLEXPORT zend_module_entry *get_module(void) { return(&&fmod_module\n    __entry);\
    \ }\n#endif\n```\n\nDie Funktionsdefinition ist in eine bedingte Kompilierungsanweisung\
    \ eingefasst. Dies ist erforderlich, da die Funktion get_module() nur dann benötigt\
    \ wird, wenn Ihr Modul als COMPILE_DL im Compiler (eine Erläuterung der dynamischen\
    \ Erweiterung) generiert wird. Die zur Generierung einer dynamischen Erweiterung\
    \ erforderlichen Kompilierungsbefehle finden Sie weiter oben können wissen, ob\
    \ Sie als dynamische Erweiterung oder als eingebautes Modul realisieren wollen.\
    \ Bei einem eingebauten Modul wird get_module() einfach nicht eingebunden.\n\n\
    get_module() wird von Zend aufgerufen, wenn das Modul geladen wird. Zur Verdeutlichung\
    \ stellen Sie sich vor, wie die Funktion durch den dl()-Aufruf in Ihrem Skript\
    \ gestartet. Sie dient dazu, den Modulinformationsblock an Zend zu übergeben,\
    \ der die Engine über den Modulinhalt zu informieren.\n\nWenn Sie die Funktion\
    \ get_module() nicht in Ihrem dynamisch ladbaren Modul einbinden, gibt Zend eine\
    \ Fehlermeldung aus, sobald Sie versuchen darauf zuzugreifen."
