  md: 'Nachdem sich der Benutzer in Ihrer Anwendung korrekt angemeldet hat, wissen
    Sie genau, mit dem Sie zu tun haben. Zur Verwaltung der unterschiedlichen Berechtigungsebenen,
    die den einzelnen Benutzern verknüpft sind, können Sie eine weitere PHPLib-Klasse
    verwenden.


    # 6.3.4 Verwaltung von Berechtigungsebenen


    In einer typischen Anwendung haben Sie in der Regel zwei Berechtigungsebenen:
    Benutzer und Administratoren. Bei einigen Anwendungen brauchen Sie jedoch eine
    detailliertere Zugriffskontrolle. Ein Content Management System braucht beispielsweise
    viele Berechtigungsebenen:


    +   Ein Superuser, der alles im System ändern kann, um das Benutzersystem zu verändern
    usw.


    +   Editoren, die Artikel und Inhalte bearbeiten, sowie den Inhalt genehmigen
    können, der von den Autoren kommt


    +   Autoren, die Inhalte erzeugen und sie zur Genehmigung an die Editoren weiterleiten,
    welche keine Inhalte genehmigen können


    +   Benutzer mit Nur-Lese-Zugriff


    Da die derzeit angemeldeten Benutzer kennen und den Benutzer anhand seiner eindeigen
    Kennnummer ($ identifizieren können, wäre es nicht schwer, Funktionen zu schreiben,
    mit denen Sie einem Benutzer Gruppen zuordnen und ihm entsprechende Gruppe anzeigen
    können. PHPLib bietet hierfür eingebaute Funktionen.


    Um die Klasse Perm zu verwenden, müssen Sie im page_open()-Aufruf ein weiteres
    Element hinzuzufügen. PHPLib bietet eine Standardimplementierung der Klasse Perm.
    Doch hier gilt dasselbe Prinzip: Um alle verfügbaren Benutzer nutzen zu können
    und Ihre spezifischen Anforderungen anzupassen, sollten Sie sich eine Klasse in
    local_inc definieren.


    Listing 6.6 zeigt ein Beispiel für die Verwendung von Perm. Dies enthält ein paar
    Funktionen, die notwendig sind, um sich in diesem Beispiel mit einem Benutzernamen
    wieder anzumelden. Dies ermöglicht uns, leichter, festzustellen, welche Berechtigungsebenen
    im Gebrauch sind. Der von PHPLib zur Verfügung gestellte Beispielkonto (Benutzername,
    Passwort) hat admin-Privilegien. Wenn Sie sich mit diesem Benutzernamen anmelden
    werden, werden Sie mit der Nachricht »Welcome Admin« begrüßt. Da die PHPLib-Distribution
    nur einen Benutzer hat, müssen Sie einen neuen Benutzer generieren, wenn Sie einen
    Benutzer mit Privilegien unterhalb von admin ausstellt.'
