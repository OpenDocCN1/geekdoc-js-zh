  md: '# 5 Grundlegende Webanwendungsungsstrategien


    ```

    void add(int Left, int Right);

    void add(double Left, double Right);

    ```


    Je nachdem, ob Sie einen int- oder double-Wert an add() übergeben, wird die eine
    oder andere Funktion aufgerufen. In der Regel Programmierer solche Mehrdeutigkeiten
    zu vermeiden, da sie bei der Fehlersuche zu einem Albtraum werden können.


    Die Zend-Engine ermöglicht intern eine ähnliche Funktionsüberladung, und zur Realisierung
    der Objektentaktierung. Je nach Kontext, z.B. des Klassennamens, kann ein Objekt
    unterschiedliche Bedeutungen haben: entweder eine normale, von Benutzer definierte,
    Klasse oder aber etwas sehr anspruchsvolles, etwa eine COM- oder Java-Schnittstelle.


    Wenn wir ein Java-Objekt erstellt, eine Instanz der überladenen Java-Klasse erstellt
    wird. Das Argument des Konstruktors gibt die zu verwendende Java-Klasse an:


    ```

    $system = new Java("java.lang.System");

    ```


    Im zurückgegebenen Objekt können Funktionen genauso eingesetzt werden mit COM-Objekten.


    Um Parameter zu lesen und zu schreiben müssen Sie die Hilfsfunktionen getProperty()
    und setProperty() verwenden (im Gegensatz zum COM-Modul, bei welchem direkt auf
    Parameter zugegriffen werden kann).


    ```

    $system = new Java("java.lang.System");

    printf("Java version = %s\n", $system->getProperty("java.version")););

    ```


    # 5.5 Zusammenfassung


    In diesem Kapitel haben Sie die grundlegenden Strategien kennen lernen, die in
    allen Weban üblich sind. Sie wissen, wie Sie mit Benutzereingabenrichtig umgehen,
    wie Sie Formulare entwerfen und Ihre Inhalte überprüfen können. Sie können Schablonen
    verwenden, um Programmcode und Layout zu generieren. Darüber hinaus wissen Sie,
    wie Sie die Bemühungen Ihres Teams koordinieren und was Sie tun müssen, mehr als
    eine Person an einer Datei arbeitet. Sie haben die Vorteile von Versionskontrollsystemen
    erkannt und wie Sie Projekte auf der Festplatte strukturieren können. Das flexible
    CVS-System nutzen. Zum Schluss sind wir auf mehrstufige Anwendungen eingegangen,
    die auch eine Implementierung von Schnittstellen für Fremdsystem ermöglichen.


    Ausgestattet mit diesem Wissen sind Sie nun in der Lage, Anwendungen der Spitzentechnologie
    zu konzipieren und zu implementieren, auf die wir im weiteren Verlauf eingehen
    werden.'
