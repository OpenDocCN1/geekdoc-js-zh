  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    Clients verwalten muss, steigt die Belastung der Datenbank, die mehr und mehr
    Ressourcen braucht. Bei ungefähr 40 bis 50 Anfragen pro Sekunde brauchte Testserver
