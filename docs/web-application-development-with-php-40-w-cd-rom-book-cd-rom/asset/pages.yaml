  md: '# Verknüpfte Listen


    möchten wir ein Beispiel aus der Praxis vorstellen: eine Bibliothek, die wir zur
    Verwaltung von Baumstrukturen entwickelt haben, und die mit PHP 3.0 arbeitet.
    Den vollständigen Quellencode finden Sie auf der CD-ROM.


    Die Bibliothek doppelt verknüpfte Baumstrukturen mit zwei Tochterknoten handhaben,
    wobei jeder Knoten einen Inhaltsbereich für gemischte Variablen hat. Jede Aktion,
    die sich mit der Baum durchführen lässt, wird in der Anwendungsprogrammierschnittstelle
    eingebaut. Sie erhalten zwei separate Einheiten: die Baumstruktur und den auf
    sie zugreifenden Programmcode.


    Dies ist der Grund, warum diese Baumstruktur mit PHP 3.0 funktioniert (auch wenn
    dies scheinbar im Widerspruch zu dem Gesagt steht). Die Baumstruktur basiert nicht
    auf Zeigern, sondern auf Arrays. Da PHP dynamische Arrays unterstützt, ist es
    mit einem geringen Aufwand möglich, diese Arrays zur Erstellung einer dynamischen
    Baumstruktur zu verwenden.


    Die Idee ist nicht neu. Sie existiert seit seit Jahren und ist schwer zu verstehen,
    welche Adresse eines Knotens, mit welchem ein Knoten verknüpft ist, im Array alle
    Knoten mit dem Index des Knotens verbunden, mit dem sie verknüpft sind. Dies hat
    nicht den Vorteil, dass PHP bei Verwendung von ungültigen Indices eine Warnung
    ausgibt, Sie können den gesamten Baum kopieren, wenn Sie die Variable, die das
    Array angibt, einer anderen Variablen zuweisen. Darüber hinaus können Sie die
    gesamte Struktur, wie sie ist, in eine Datei kopieren und diese an eine beliebige
    Stelle verschieben.


    Eine weitere, theoretische Erläuterung ist folgende: Stellen Sie sich den für
    Ihr verfübaren Speicher als ein großes Array vor. Die Werte im auf physischem
    RAM wären wahrscheinlich einige Bit groß, dass die Größe der einzelnen Elemente
    nicht wirklich von Bedeutung ist. Wichtiger ist, dass der Zeiger einfach eine
    Nummer ist, die das Element indiziert und den Beginn der Struktur markiert, die
    Sie im RAM einfügen. Wenn Sie nun dieses Konstrukt in eine Sprache integrieren
    ( «echtes» Array), haben Sie dieselbe Situation auf einer höheren Ebene. Das PHP-Array
    enthält nur Ihr »RAM«, und jedes Array-Element stellt einen der Baumknoten dar.
    Die Zeiger werden in diesem Array zu Indizes, und die Referenzierung erfolgt einfach
    durch Auslesen des korrekten Elements aus dem.


    Milfe von Arrays können Sie viele »RAMs» erzeugen, große Größen verringern, über
    sie als Ganzes oder ein einzeles Element verwalten; alles in allem eine sehr komfortable
    Methode zur Speicherverwaltung. Wenn Sie dies in einer soliden Bibliothek integriert
    haben, besitzen Sie ein schönes Werkzeug.'
