  md: "# Erweiterte Syntax\n\nIn der Regel greifen Funktionen auf ihre Parameter nicht\
    \ durch Referenz zu. Wenn sie Werte während der Programmausführung ändern, arbeiten\
    \ sie mit einer lokalen Kopie des urspränglichen Wertes.\n\n```\nfunction calculate($a,\
    \ $b, $c) \n{\n  $a = $b + $c;\n}\n\n$i = 1;\n$j = 2;\n$k = 3;\n\nprint(\"I, $i,\
    \ $j, K $k<br>\");\ncalculate($i, $j, $k);\nprint(\"I, $i, $j, K $k<br>\");\n\
    ```\n\nBeide Druckweisungen geben denselben Inhalt aus. Während calculate bei\
    \ der Programmausführung $a modifiziert, ändert sich der Inhalt von nicht, obwohl\
    \ es als Argument für den Parameter $a übergeben wurde. Dies liegt daran, dass\
    \ calculate() nicht mit der Variablen selbst, sondern mit einer Kopie der urspränglichen\
    \ Variablen gearbeitet wird. Sobald die Funktion beendet ist, wird die Kopie der\
    \ Variablen verworfen, mit welcher die Anweisung gearbeitet hat, und der Inhalt\
    \ geht verloren.\n\nWie im Falle von fockopen() kann es manchmal wünschswert sein,\
    \ an einem Parameter vorgenommene Änderung zu speichern und sie global zur Verfügung\
    \ zu stellen. Dies ist möglich, muss die Variable jedoch nicht als Kopie sondern\
    \ als Referenz übergeben werden. Damit erhält die Funktion einen Zeiger auf Speicherblock,\
    \ der die ursprängliche Variable abgelegt. Mithilfe dieses Zeigers kann die Funktion\
    \ auf die globale Instanz der Variablen zugreifen und diese ändern:\n\n```\nfunction\
    \ calculate(&$a, $b, $c) \n{\n  $a = $b + $c;\n}\n\n$i = 1;\n$j = 2;\n$k = 3;\n\
    \nprint(\"I, $i, $j, K $k<br>\");\ncalculate($i, $j, $k);\nprint(\"I, $i, $j,\
    \ K $k<br>\");\n```"
