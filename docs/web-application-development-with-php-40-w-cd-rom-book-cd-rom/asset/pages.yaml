  md: '# # 8 Fallstudien


    Andere zu kennen, zeugt von Intelligenz;

    Sich selbst zu kennen, von wirlicher Weisheit.


    Die folgenden Abschnitte zeigen drei Fallstudien, in denen PHP auf großen Websites
    und in kommerziellen Produkten eingesetzt wurden. Diese Fallstudien beschreiben
    Firmen, die sich nachfältiger Auswertung der konkurrierenden Technologien für
    PHP entschieden haben und die in einem großen Teil ihrer täglichen Arbeit von
    PHP abhängen. Ein Großteil der Texte wurde ohne einen konkreten Einblick in die
    Entwicklungsprozesse und technischen Daten erstellt. Die Fallstudien belegen,
    dass PHP eine zuverlässige, hochentwickelte Lösung für Entwicklungen von serverseitigen
    Webanwendungen ist. Wir hoffen, dass sie Ihnen helfen, die Geschäftsleitung und
    Kollegen von PHPs Vorteilen zuzeugen.


    # ## 8.1 BizChek.com


    Viele wussten Sie, dass HotMail, eine Microsoft-Firma, auf ihren Server FreeBSD
    setzt. Es wäre zwar schön, wenn wir eine Fallstudie hätten, gezeigt, dass Microsoft
    PHP für seine webbasierten Mail verwendet, aber wir haben etwas zumindest Gleichwertiges:
    BizChek.com (www.bizchek.com). Der führende Anbieter webbasierter Emails für Firmen
    verwendet PHP. Mit Kunden, wie der Bauweiser und Micro Warehouse, sowie über zwei
    Millionen registrierten Nutzern ist BizChek einer der wichtigsten Akteure im internationalen
    Bereich.


    Nicht genug damit Mark Musone, CTO bei Biz Chek Inc., der Mutterfirma von BizChek.com,
    ist ein aktiver PHP-Entwickler. Er hat viele nützliche Module, wie IMAP und MCAL,
    geschrieben oder mitgeschrieben, die inzwischen zur Standarddistribution von PHP
    gehören.


    # ### 8.1.1 Web Mail


    Mit mehr als 70 Angestellten, von denen alle Programmierer sind, ist BizChek ein
    wichtiger Anbieter im Bereich der webbasierten E-Commerce/Intranet-Marktes. Zusammen
    mit dem Rest von Check Netzwerk rangiert BizChek aktuell unter den ersten zwanzig
    von 100 Besten des Internets (www.100hot.com).'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'BizCheck belegt eine einzigartige Position im Bereich der Email-Geschäftslösungen.
    Obwohl die Hauptanwendung ein selbstständiges, webbasiertes Emailprogramm ist,
    bietet BizCheck auch eine Reihe von Produktitätswerkzeugen, welche das einzelne
    Geschäft kohärenter machen und gleichzeitig die Effizienz und Produktivität des
    gesamten Unternehmens erhöhen. BizCheck ist mehr als ein Produkt. Es kann eine
    Firma helfen, eine elektronische Identität aufzubauen. Die Firma kann mit ihren
    Angestellten in ihrer Email-Adresse anstatt generischer Adresse (AOL, Hotmail
    usw.) ihre Firmen verwenden. Sobald die Firma die materiellen und immateriellen
    Vorteile versteht, die sich aus einer E-Commerce-Lösung, die Umwandlung oder Initiierung
    eines Dienstes ergeben. Firmenbesitzer und Geschäftsführer werden sich zunehmend
    der Vorteile bewusst, dass ein ausgelagertes webbasiertes Werkzeug zur elektronischen
    Kommunikation bringen kann.


    BizCheck bietet eine Reihe von Funktionen, einschließlich Dokumenten/Date-Sharing
    und Revision, Taskmanager, Kalenderdaten, ein Schwarz der Firma u. v. m. Nach
    einem finanziell wird sich heraus, dass das Outsourcing die Kosten der Firma in
    fast Fällen drastisch senkt. Alle Investitionen in Hard-/Software und gewellen
    Wartungsaufwand sind der Informationstechnologie die Einsparungen real massbar.
    Outsourcing kann sich auch in verringerten Risiken aus, durch Bereitstellung einer
    professionellen und zuverlässigen Lösung, die die Virusüberwachung und die Vermeidung
    von Schadmails zentral verwaltet und kontrolliert. Dies ist ein unmittelater materieller
    Vorteil, den ein ausgelagertes webbasiertes Kommunikationsmodell bietet.


    #  8.1.2 Entscheidung für PHP


    Seit der Einführung von BizCheck im Jahr 1998 verwenden BizCheck-Entwickler PHP,
    und zwar PHP 2.0. Auch wenn BizCheck dank gar auf PHP eingerichtet ist, bedeutet
    dies nicht, dass zuvor andere Lösungen in Betracht gezogen wurden. Die Experten
    verbrauchten mehrere Monate, verschiedene Alternativen zu testen und zu bewerten:
    ASP, .Perl und Cold Fusion. Sie befanden, dass PHP die beste Wahl für BizCheck
    sei, und seit Beginnn richtete sich ihr Hauptaugenmerk auf PHP. Als junges Unternehmen
    mit begrenzten Mitteln, das sich seine Arbeitskraft angepasst hatte, waren sie
    von der Open-Source-Gemeinschaft angetet. Obwohl PHP, wie viele andere Open-Source-Produkte,
    von großen Firmen nicht kommerziell unterstützt wird, berichten Marktstudien vor
    kurzem einem enormen Anstieg der PHP-Verwendung auf Websites und in anderen Produkten.
    Laut einer Webserver-Umfrage von Netcraft wurde PHP bei über elf Millionen insgesamt
    analysierten Servern im Februar 2000 auf über 1,4 Millionen Domänen verwendet.
    [1] Die BizCheck-Entwickler sind der Mei-'
  merge: -1
  pgno: 349
- img_proc: true
  md: "nung, dass sich angesichts dieser Ergebnisse PHP und andere Open-Source-\n\
    Produkte an die Spitze der entsprechenden Bereiche setzen und sich selbst\ngegen\
    \ kommerzielle Mitbewerber als etablierte Firmen behaupten.\n\nBei ihrer Suche\
    \ nach einer Skriptsprache testeten die BizCheck-Entwickler\nbrauchbare Alternativen,\
    \ die möglicherweise ihre Anforderungen\ngenügten. Die ersten zwei Kandidaten\
    \ waren Perl und verschiedene CGI-\nSkriptsprachen. Danach wurde Microsofts treibende\
    \ Kraft ASP unter die\nLupe genommen. Schließlich waren zwei Geheimtipps dran:\
    \ Cold Fusion und\nPHP. Da eine Hauptanforderungen die serverseitige Programmierung\n\
    und die Anbindung an eine Datenbank waren, schlossen die BizCheck-Entwick-\nler\
    \ von vornhere alle clientseitigen Skriptsprachen aus. Sie möchten PHP\nzwar wegen\
    \ seiner vielseitigensetzbarkeit, aber sie sich den Eindruck,\ndass diese Sprache\
    \ für den Einsatz im Web optimiert wurde und bei\ndnder Verwaltung von Datenverkehr\
    \ CGI- und Perl-Skripte schnell den Speichern und die\nCPU belegen und zu Leistung\
    \ zusammenfügen. Das ASP, Cold Fusion und PHP\nmit dem Webserver arbeiten, ohne\
    \ zusätzliche Prozesse zu erzeugen,\ngamen, sie für die BizCheck-Entwickler in\
    \ die engere Wahl. Cold Fusion\nwäre vielleicht eine akzeptable Sprache gewesen,\
    \ als er sie zur Zeit noch\nein sehr neues Produkt. Man musste wussten wenig darüber,\
    \ und blieben sie\nde Entwickler fallen. BizCheck schützte, dass bei der Wahl\
    \ von ASP\nas Webserver Mod_ Perl, den Perl-Interpreter in den Webserver\nintegriert,\
    \ Ergebnisse erzielen würde, die von PHP und ASP nah\nkämen. Auch wenn Mod_ Perl\
    \ vielleicht eine großartige Alternative gewesen\nwäre, hätten die BizCheck-Entwickler\
    \ die Befürchtung, dass so großen Weban-\ndenungen nicht gewachsen wäre. Für sie\
    \ war es eine zu allgemein einsetz-\bare Sprache, welche sie PHP für eine sehr\
    \ einfache und trotzdem leistungs-\nfähige Varianteielten. Man musste nicht durch\
    \ irgendliche springen, um PHP dazu zu bringen,\n»mit dem Web zusammenzuarbeiten».\n\
    \nASP bot eine Vielzahl von Komponenten einer Hersteller, der die Kosten\nfür\
    \ die Einführung und die Wartung waren besorgniserregend. Die Tatsache,\ndass\
    \ ASP nur auf dem Netz Internet Server und Microsoft\nWindows-Platforms beschränkt\
    \ blieb, degradierten sie in den Augen von Biz-\nCheck noch weiter. Während sich\
    \ ASP für Datenbindung hauptsächlich\nauf ODBC nutzte, was sich als sinnvoll erkennen\
    \ kann, wenn Sie Ihre\ndatenbank jeden Monat wechseln, haben PHP und Perl eigene\
    \ Datenbank-\nverbindungen, die ihnen kleine Vorteile verschafft. Die Fehleruche,\
    \ die\nieder Programmierer weiß, Großteil der Projekts in Anspruch\nehmen und\
    \ sich zu einem wahren Alptraum ausweiten kann, wenn die Prä-\nposition nicht\
    \ hundertprozentig ist, war bei ASP ebenfalls schwieriger wird. PHP gibt\npräzise\
    \ Fehlermeldungen aus, die eine effektive Hilfe für die Lösung des\nProblems darstellen."
