  md: '# Pearson Education 6 Datenbankzugriff mit PHP ADDISON-WESLEY


    Die erste Zeile erzeugt eine neue Instanz der Klasse DB_Sql. Standardmäßig wird
    diese Klasse in der Datei db_mysql.inc definiert, in prepend.php3 geladen und
    verwendet als Datenbankprozessor MySQL.


    Als Nächst wird eine Verbindung zur Datenbank hergestellt. Natürlich müssen Sie
    die Werte auf Ihre Situation anpassen. In diesem Beispiel werden wir eine Verbindung
    zur Datenbank test auf localhost, wobei wir den Benutzernamen root und das Passwort
    verwenden.


    Sie können Parameter auch über die entsprechenden Klassenvariablen setzen:


    ```

    $db = new Example_Db;

    $db->Database = ''test'';

    $db->Host = ''localhost'';

    $db->User = ''root'';

    $db->Password = '''';

    ```


    Beim Aufruf von $db->query() fest, PHPLib fest, dass bisher keine Verbindung hergestellt
    wurde, und öffnet automatisch, wobei wir in den Klassenvariablen definierten Werte
    verwenden.


    Unser Beispiel wird mit $db->query() fortgesetzt. Dieser Aufruf behandelt die
    Aspekte, wie das Abschicken einer Anfrage die Datenbank erforderlich ist. Er stellt
    eine Verbindung zur ausgewählten Datenbank her (wenn dies nicht bereits erfolgt)
    und behandelt etwa Fehler. Wenn wir $db->Debug auf true gesetzt haben, gibt diese
    Funktion die SQL-Query zurück, bevor sie an die Datenbank schickt.


    Anschließend wird $db->next_record() in einer while-Schleife aufgerufen. Die Funktion
    erhöht die nächste Zeile einer Reihe von Ergebnissen und speichert sie im Array
    $db->Record. Wenn keine Zeile mehr im Ergebnis ist, gibt die Funktion false zurück
    und beendet die Schleife.


    Die zweite Schleife durchsuch das Array $db->Record und gibt die Feldnamen mit
    ihrem Inhalten aus. Da Arrays (auch bei Arrays, die standardmäßig mysqli_fetch_array()
    verwendet werden) als den Feldnamen als Schlüssel enthalten, stellen Sie sicher,
    dass die Array-Einträge zurückgegeben werden, bei denen der Index ein Feldname
    ist.


    Vergleichen Sie das PHPLib-Beispiel aus Listing 6 mit dem Beispiel der objektorientierten
    Programmierung in Listing 6.2. Sie sind in etwas länger, aber das PHPLib-Beispiel
    besitzt alle Vorteile, die wir zuvor erläutert haben. Durch Ändern einer Datei
    können Sie die zuglegende Datenbank ändern. Auch die Fehlerbehandlung ist sehr
    leistungsfähiger als im anderen Beispiel. Durch Ändern einer Klassenvariablen
    we sich PHPLib an, den Programm bei Fehlern zu unterbrechen, eine Fehlermeldung
    auszugeben


