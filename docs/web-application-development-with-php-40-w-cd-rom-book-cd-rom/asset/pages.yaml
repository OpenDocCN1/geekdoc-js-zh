  md: '# 9.7.2 Manuelles Kompilieren


    Um Ihre Module manuell zu kompilieren, benötigen Sie die folgenden Befehle:


    | Aktion | Befehl |

    | --- | --- |

    | Kompilieren | cc -fpic -DCOMPILE_DL=1 -I/usr/local/include -I.- -I../Zend -c
    -o <Ihre_Objektdatei> <Ihre_C_Datei> |

    | Verknüpfen | cc -shared -L/usr/local/lib -rdynamic -o <Ihre_Moduldatei> <Ihre_Objektdatei>
    |


    Der Befehl zur Kompilierung des Moduls ist deutlich einfach als, einen positionsunabhängigen
    Code zu generieren. Zusätzlich definiert er die Konstante COMPILE_DL, die dem
    Modcode mitteilt, dass als dynamisch ladbares Modul kompiliert wird sowie eine
    Reihe von Standard-Include-Pfaden, die als Mindimalausstattung zur Kompilierung
    der Quelldateien verwendet werden sollen.


    > **Hinweis:** Alle Include-Pfade im Beispiel sind relativ zum Verzeichnis ext
    angegeben. Wenn Sie die Kompilierung aus einem anderen Verzeichnis herausführen,
    ändern Sie die Pfadnamen entsprechend. Als Komponenten benötigen Sie das PHP-Verzeichnis,
    das Zend-Verzeichnis und (sofern erforderlich) das Verzeichnis, in dem sich Ihr
    Modul befindet.


    Der Kompilierungsbefehl ist ebenfalls ein grundlegender Befehl, der eine Verknüpfung
    als dynamisches Modul vorschreibt.

    Sie können Optimierungsoptionen in den Kompilierungsbefehl einbeziehen, auch wenn
    sie in diesem Beispiel weggelassen werden (einige in der Makefile-Schablone, die
    wir in einem früheren Abschnitt beschrieben haben).


    > **Hinweis:** Die manuelle Kompilierung und Verknüpfung als statisches Modul
    in die PHP-Binärdatei führt zu sehr langen Anweisungen, und wird daher hier nicht
    erörtert. (Es ist nicht sehr effizient, alle Befehle einzutippen.)'
