- img_proc: true
  md: 'kann. Bei Beschränkungen ist eine Migration auf schnellere Maschinen oder eine
    Änderung der Netzwerktopographie empfehlenswerter als der Wechsel auf eine andere
    Technologie. Durch permanentes Profiling werden Engpässe gefunden. Es erleichtert
    die Entscheidung, welcher PHP-Code in C neu erstellt und eingebunden werden muss.


    # 8.3.6 Sitzungsverwaltung


    MarketPlayer verwendet zwei Techniken zur Verwaltung von Sitzungen. Im ersten
    Fall werden die Benutzerdaten verschlüsselt und auf dem Clientrechner in Form
    Cookies gespeichert. Das hat den Nachteil, dass jeder Server, der Inhalte bereitstellt,
    die Cookie entschlüsseln muss. In der Entwicklungsumgebung wird die Entwicklung
    neuer Funktion nicht länger lange, bis die Speicherung mittels Cookies realisiert.


    Der zweite und portierbarere Fall schließt eine Datenbanktabelle ein, die beide
    einseitige Sitzungsnummer mit authentierten Benutzern ablegt. Sobald der Benutzer
    über einen gültigen Namen und ein Passwort authentifiziert ist, wird eine neue
    Sitzungsnummer generiert und zusammen mit der IP-Adresse, der Zeit und dem Benutzern
    in der Benutzerdatei gespeichert. Der Benutzer braucht nur eine gültige Sitzungsnummer
    und eine Verbindung, um die ursprünglich authentierte IP-Adresse, um eine Verbindung
    herzustellen. Vom Standpunkt der Sicherheit kann eine Sitzungsnummer für ungültig
    erklärt werden oder ablaufen, indem sie aus dem Datenbankentf entfernt wird. Die
    Verwendung der Sitzungsnummer von einer anderen IP-Adresse wird stillschweigend
    ignoriert. Benutzerdaten werden nur einmal gesendet. Hinsichtlich auf die Leistung
    muss ein Datenaufruf nur einmal genutzt werden und alle Benutzerinformationen
    können über die Sitzungsnummer durch Verknüpfen von Tabellen gesammelt werden.


    Die Sitzungsnummer wird dem Benutzer auf zwei Arten zur Verfügung gestellt. Im
    ersten Fall wird sie in URLs auf Seiten der Seite eingefügt, sodass die Information
    in allen Links auf Seiten enthalten wird mittels einer Funktion, welche überprüft,
    ob der Benutzer authentifiziert ist oder das richtige HTML ausgibt. Außerdem wird
    sie als Cookie an den Benutzer geschickt. Dies verhindert, dass defekte Links
    dazu führen, dass der Client die Nummer vergisst. Wichtiger ist, dass Browser,
    die Cookies nicht unterstützen oder gar verarbeiten, sich auf der Website anmelden
    können. Cookie-Variablen werden durch Get-Variablen beschrieben. Wenn der Benutzer
    ein Lesezeichen auf eine Seite setzt, überschreibt die aktuelle Sitzung jedoch
    Kennnummer, die dem URL im Lesezeichen angegeben ist. Wenn der Benutzer die Website
    schließlich verlässt und zurückkehrt, bleibt die Sitzungsnummer ausluft, bleibt
    er authentifiziert.'
