  md: 'sogenannte Overhead), wir im Vergleich zu dem Ergebnis, den wir erhalten,

    sehr lang. Mit anderen Werten: Wir verwenden ein riesiges Softwaresystem,

    das komplexe Datenspeicherung ausgelegt ist, ein einfaches besonderes

    Werte auszutauschen. Wenn wir eine Datenbank für irgendetwas konzipiert

    wurde, dann dank keiner also, dass sie die optimale Leistung

    brachte. Der Engpass ist der Overhead, die Zeit, die für den ständigen

    Verbindungsauf- und -abbau benötigt.


    Das Datesystem erreicht eine schlechte Leistung, weil es nicht für diese Ver-

    wendung konzipiert wurde. Darüber hinaus gab es einige Grenzen:

    PHP hat die optimalen Methoden für den Dateisystemzugriff. Wenn die Exis-

    enz eine Datei zu überprüfen muss, ständig der Cache-Speicher gelesen und

    geöscht wird – und wieder entsteht ein Overhead für eine einfache

    Aufgabe.


    Warum werden wir nicht etwas vollkommen ändern? Wir sind sich

    icht die Ersten, die eine prozessbergreifende Kommunikation verwalten

    müssen. Hierfür müssen andere gute Lösungen entwickelt werden.

    Damit kommen wir zur nächsten Möglichkeit: Semaphore..


    Semaphore machen genau das, was wir wollen: Sie funktionieren als Signale.

    Es handelt sich hierbei um Zahlen, die im gemeinsam genutzten Speicher,

    sog. Shared Memory abgelegt werden. Sie können einen Semaphore „erfassen"

    und damit seinen Zahlen höhersetzen oder ihn „freigeben“, wenn sein Zahlen

    herausgeholt wird. Außerdem können Sie darauf warten, dass ein Semaphore

    frei wird, d.h. dass seine Zahl zurück auf Null setzt. Dieses Verfahren hat

    jedoch einen Nachteil: Semaphore dienen ursprünglich dazu, Ressourcen zu

    sperren, um eine eine Art von Zeitplanung zu erhalten. Prozesse können so dar-

    auf warten, bis ein Gerät verfügbar war oder Ähnliches. In der

    Zeit, die man daraufartet, dass ein Semaphore frei wird, wird der war-

    tende Prozess schlafen. Wenn der Hauptprozess darauf wartet, dass das Benutzeregabe-

    eld eine neue Nachricht ankündigt, kann er den kommenden

    Netzwerkdatenstrom nicht verarbeiten, wenn er gerade „schläft“.


    Trotzdem ist es keinen Grund jetzt aufzugeben. Es gibt noch keine

    Lösungen.


    # Setzen von Flags im Shared Memory


    Das Shared Memory ähnelt den Semaphoren, ist aber vielseitiger. Hierbei

    handelt es sich um einen Speicher, der für jeden Prozess in einem System

    fügbar ist. Multitasking-Systeme sind in der Regel konzipiert, dass jeder

    Prozess aus Sicherheitsgründen vollständig unabhängig von den anderen

    Prozessen ausgeführt wird. Mehrere Prozesse können denselben Daten ben-

    zen, indem sie spezielle Speicherblöcke, sogenannte Shared Memory-Blöcke'
