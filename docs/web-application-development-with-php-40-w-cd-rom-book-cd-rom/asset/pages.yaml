  md: '# Grundlegende Webanwendungsstrategien


    | Funktion | Beschreibung |

    | easy_parse() | Analysiert die Schablone und gibt sie als Zeichenkette zurück.
    Wenn ein Fehler auftritt, gibt die Funktion false zurück und setzt die Variable
    $error der Klasse auf eine sinnvolle Meldung. |

    | easy_print() | Analys die Schablone und druckt sie aus. Wenn ein Fehler auftritt,
    gibt die Funktion false zurück und setzt die Variable $error der Klasse auf eine
    sinnvolle Meldung. |


    > **Tipp:** Ein Konstruktor in PHP steht vor zurück, egal was Sie mit return()
    zu tun versuchen.


    Worin besteht der Vorteil von Schablon zu verwenden? Hauptsächlich die Trennung
    von Darstellung und Kunde. Jeder Programmierdesigner kann die Schablonate in seinem
    bevorzugten HTML-Autorenprogramm öffnen, ohne sich um den Scriptcode Sorgen zu
    müssen. Der Designer muss sich gar nicht mit HTML beschäftigen.


    Die Alternative wäre, den PHP-Code direkt in HTML einzubetten. Wenn Sie Ihr Programm
    gestalten, müssten Sie sich dann schwer zu kämpfen, um den HTML-Code manuell zu
    ändern.


    Warum haben nicht FastTemplate verwendet? Erstmal wäre es für diese Situation
    leicht übertrieben, und eine solche Übertreibung von 120% bedeutet, überlegen
    wir nicht lange, als besser doch eine spezifische Lösung finden.


