  md: '4. Wenn immer noch keine Sitzungskennnummer gefunden wurde, wird der Pfad im
    Hinblick auf eine Zeichenfolge der Form <sessionname>=<session-id> analysiert.
    Eine solche Folge gefunden, dann wird die Konstante SID definiert.


    5. Wenn im Client-Agent ein externer HTTP-Referer (von einem lokalen Standort)
    und externer referer_check (beachten Sie die einzelne r=) in der PHP-Konfiguration
    aktiviert wird, wird die Sitzungskennummer ebenfalls als ungültig markiert. Mit
    dieser Maßnahme wird eine zusätzliche Sicherheit erreicht, die verhindert, dass
    Benutzer von anderen PHP-Web eine Sitzung übernimmt, der jedoch aufgrund des Algorithmus,
    der die Generierung des Sitzungskennummers verwendet wird, recht unwahrscheinlich
    ist.


    Im Allgemeinen wird die Konstante SID dann definiert, wenn die Sitzungsbibliothek
    nicht sicher weiß, ob der Client Cookies unterstützt, oder in Worten: solange
    keine Sitzungskennnummer im Array $HTTP_COOKIE_VARS gefunden.


    Wenn bei allen Überprüfungen keine Sitzungskennnummer gefunden oder diese abgelehnt
    wurde, sollten Sie eine neue Sitzung starten, in der eine Sitzungskennummer vergeben
    wird.


    Wenn eine gültige Sitzungskennummer vorhanden ist, werden die eingeführten Variablen
    der Sitzungsvariable aktiviert und den globalen Namensraum eingeführt. Sitzungsvariablen
    lassen sich genauso leicht handhaben wie GET/POST-Variablen: Wenn Sie eine Variable
    namens foo registrieren, $foo nach dem Aufruf von session_start() automatisch
    als globale Variable zur Verfügung gestellt. Außerdem werden sie dem globalen
    Array $HTTP_SESSION_VARS hinzugefügt, sobald track_vars aktiviert wird. Nachdem
    die Funktion serialize() verbessert wurde, können Sie Objekte (Klassen) als Sitzungsvariablen
    behandeln.


    # Aktivieren der Funktionalität von track_vars und register_globals


    Um die gesamte Funktionalität der Sitzungsverwaltung nutzen zu können, müssen
    Sie in Ihrer PHP-Konfiguration track_vars und register_globals aktiviert haben.


    Alle Variablen, die Sie über mehrere Anfragen hinweg erhalten möchten, müssen
    mit der Funktion session_register() in derbibliothek registriert werden. Beachten
    Sie, dass im Argument der Funktion nicht die Variable selbst, sondern der Namen
    der Variablen anzugeben ist. Die Variable $foo müssen Sie folgendermaßen eingeben:


    ```

    session_register("foo");

    ```


    Der Code


    ```

    session_register("foo");

    ```'
