  md: '# Grundlegende Web-anwendungsstrategien


    Wenn Menschen etwas als hübsch betrachten,

    andere Dinge hässlich.

    Wenn Menschen etwas als gut betrachten,

    andere Dinge schlecht.


    Kapitel 4, »Webanwendungskonzepte« und eigenständigen Skripten. Es zeigte Verfahren,
    mit denen sich das grundlegende Problem beheben lässt: die Systemverwaltung. Dieses
    Kapitel erläutert Strategien, um andere Probleme, die wir in größeren Projekten
    auftreten, in den Griff zu bekommen. Wir stellen Ihnen Lösungen vor, die unserer
    Meinung nach zeitsparend, effektiv und einfach zu installieren sind. Trotzdem
    sollten Sie prüfen, ob ihnen Anforderungen genügen. Dieses Kapitel nennt sich
    auch »Webanwendungsstrategien« und nicht etwa »Webanlösungen» für einen Zweck.
    Es zahlt sich immer aus, mehr Zeit auf die Auswertung zu verwenden, wenn man ein
    Projekt organisieren müssen. Wie in Kapitel 1 »PHP-Konzepte« erwähnt, ist Zeit
    die wertvollste Resource, der wir niemals genug haben.


    Am Anfang war das HTML-Formular. Fast jede Webanwendung erfragt Informationen
    vom Benutzer. Deshalb soll ein besonderes Augenmerk auf die Überprüfungsroutinen
    fallen. Wir brauchen eine generische Bearbeitungsroutine, wenn wir das Rad nicht
    wieder neufinden möchten. Der erste Teil dieses Kapitels beschreibt das PHP-Standardformulular
    und zeigt, wie Sie die Klasse EasyTemplate einsetzen, um Code und Layout voneinander
    zu trennen.


    Über Schablonen wird die Zusammenarbeit in fachübergreifenden Entwicklungsstrategien
    verbessert. Dies ist nur ein kleiner Aspekt der Teamarbeit. Wir zeigen ihnen auch,
    wie Sie Projekte organisieren und welche Programme zur Versionskontrolle nutzen.


    Auf dem Weg zum nächsten Kapitel machen wir einen kurzen Halt in der Marketingabteilung
    und erläörtern die tatsächlichen Vorteile eines mehrstufigen Programms.'
