  md: "Die globale Initialisierungsfunktionen beim Hochfahren von PHP aufgerufen.\
    \ Auf ähnliche Weise werden die globalen Deinitialisierungsfunktionen aufgerufen,\
    \ sobald PHP beendet wird. Beachten Sie, dass dies tatsächlich nur einmal aufgerufen\
    \ werden und nicht, wenn ein neuer Apache-Prozess generiert wird!\n\nDie Initialisierungs-\
    \ und Deinitialisierungsfunktionen des Moduls aufgerufen, wenn ein Modul geladen\
    \ und initialisiert werden muss. Anfrageinitialierungs- und Deinitialisierungsfunktionen\
    \ aufgerufen, wenn eine Anfrage verarbeitet wird, also eine Datei ausgeführt wird.\n\
    \nBei dynamischen Erweiterungen werden Module und Abfragen gleichzeitig initialisiert\
    \ und deinitialisiert.\n\nDie Deklaration und Einbindung dieser Funktionen geschieht\
    \ über Marker. Einzelheiten hier finden Sie im Abschnitt »Deklarationen des Zend-Modulblocks».\n\
    \n# 9.20 Aufruf von Benutzerfunktionen\n\nSie können Benutzerfunktionen aus eigenen\
