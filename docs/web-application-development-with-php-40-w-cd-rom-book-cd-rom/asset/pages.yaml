  md: '# 9 Erweiterung von PHP 4.0: Knacken den PHP-Kern


    ```

    printf("Message caught, our entry has been changed to %s<br>\nnew_value");


    return(SUCCESS);

    ```


    Der neue Wert der Änderungsroutine als String in PHP_INI_MH Variable new_value
    übergeben. Wenn Sie sich die Definitionen von PHP_INI_MH ansehen, stellen Sie
    fest, dass einige Parameter verwendet werden können:


    ```

    #define PHP_INI_MH(name) int name(char *entry, char *new_value, uint *new_length,
    void *mh_arg1, void *mh_arg2, void *mh_arg3)

    ```


    Diese Definitionen finden sich in php_ini.h. Ihre Nachrichtenroutine hat eine
    Struktur, die den Eintrag enthält, den neuen Wert, seine Länge und zwei optionale
    Argumente. Diese optionalen Argumente können mit den zusätzlichen Makros PHP_INI_ENTRY1,
    PHP_INI_ENTRY2 (das zwei Argumente zulässt) und PHP_INI_ENTRY3 (das drei Argumente
    zulässt) angegeben werden.


    Die Änderungsbenachrichtigungsroutinen sollten eingesetzt werden, um Initialisierungseinträge
    im Cache zu puffern, um einen schnelleren Zugriff durchzuführen, der erforderlich
    ist, wenn sich ein Wert ändert. Wenn beispielsweise ein Modul die Verbindung zu
    einem bestimmten Host benötigt und den Namen des Hosts ändert, wird automatisch
    die Verbindung geschlossen und versucht, eine neue aufzubauen.


    Der Zugriff auf den Initialisierungseintrag kann auch über die Makros erfolgen,
    wie in Tabelle 9.17.


    | Makro | Beschreibung |

    | --- | --- |

    | INI_INT(Name) | Gibt den aktuellen Wert des Eintrags name als Integer (Long)
    zurück. |

    | INI_FLT(Name) | Gibt den aktuellen Wert des Eintrags name als Fließkomzahl (Double)
    zurück. |

    | INI_STR(Name) | Gibt den aktuellen Wert des Eintrags name als String zurück.


    Hinweis:

    Dieser String wird nicht dupliziert, sondern statt dessen auf interne Daten. Bei
    weiteren Zugriffen ist eine Duplizierung im lokalen Speicher erforderlich. |


    Tab. 9.17: Makros für den Zugriff auf Initialisierungseinträge in PHP'
