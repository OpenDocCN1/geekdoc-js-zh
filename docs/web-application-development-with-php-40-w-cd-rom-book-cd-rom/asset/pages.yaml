    # 7.1.4 Rekursion mit SQL


    Unsere Anwendung ermöglicht eine unbegrenzte Verschaltung von Kategorien. Wir
    haben uns für die einfachste und am leichtesten zu realisierende Lösung von Kategorien
    entschieden. Die Tabelle categories wird wie folgt definiert:


    ```

    CREATE TABLE categories (

    cat_id bigint(21) DEFAULT ''0'' NOT NULL auto_increment,

    name varchar(32) NOT NULL,

    parent_id bigint(21) DEFAULT ''0'' NOT NULL,

    PRIMARY KEY (cat_id),

    KEY parent_id (parent_id)

    );

    ```


    Verantwortlich für die Verschaltung ist natürlich das Feld parent_id. Es enthält
    den Wert cat_id der Kategorie eine Ebene darüber. Genau ist dies die einfachste
    Form für eine Verzeichnisstruktur. Jeder Knoten hat genau eine Eigenschaft, die
    von Vorteilen von den Elternknoten referiert. Dieser Ansatz hat jedoch eine Reihe
    von Nachteilen. Der größte ist wohl, dass es unmöglich ist, für einen Knoten alle
    Vorfahren in einer SQL-Abfrage zu ermitteln. Dazu brauchen sie mehrere SQL-Abfragen.
    Genau brauchen wir n-1 Einzelabfragen bei einer Verschaltung in Ebenen..


    Wir haben uns für eine rekursive Funktion entschieden, um die Elternknoten mit
    der Funktion kb_cat_get_parents zu ermitteln. Sie lässt die Kategorien aus der
    Datenbank aus, sobald cat_id mit der Stammk übereinstimmt. Dies lässt sich am
    besten anhand eines Beispiels demonstrieren. Angenommen, wir haben drei Kategorien:


    ```

    INSERT INTO categories VALUES (1, ''Main Category'', 0),

    INSERT INTO categories VALUES (2, ''Sub Category I'', 1),

    INSERT INTO categories VALUES (3, ''Sub Category II'').

    ```


    Beim Aufruf von cat_id mit dem Anfangswert 3, lässt die Funktion kb_cat_parents()
    zunächst den Eltern-Kennnummer für diesen Knoten (die in unserem Beispiel 2 lautet).
    Anschließend ruft sie sich in einer rekursiven Funktion mit dieser Kenennummer
    selbst auf. Der Abschluss dieser rekursi-'
