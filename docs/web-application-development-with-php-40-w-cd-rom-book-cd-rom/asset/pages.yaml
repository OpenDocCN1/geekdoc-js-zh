    einfach. Gut Programmcode – wirklich guter Code – lässt sich fast wie ein Buch
    lesen. Sie können beliebige Stelle finden und wissen sofort, welche Zeilen, die
    Sie lesen, unter welchen Umständen sie ausgeführt werden und welche Einstellungen
    möglicherweise notwendig sind. Selbst wenn Sie über Hintergründe verfügen und
    anspruchsvoll mit komplizierten Algorithmen stoßen, können Sie schnell feststellen,
    welche Aufgabe er ist und wann er ausgeführt wird.


    Es wäre schön, Beispiele aufzuführen und zu sagen „Machen Sie es so“, aber wir
