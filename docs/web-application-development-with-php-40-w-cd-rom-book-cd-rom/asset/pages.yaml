  md: "# Erweiterte Syntax\n\nHier sehen die Auflistung aller Schlüssel/Wert-Paare,\
    \ die in dem Array $my_array enthalten sind:\n\n```\nlist($key, $value) = each($my_array);\n\
    ```\n\nJetzt wenden wir hierauf each() an. Beim ersten Aufruf wird das erste Element\
    \ umfassende Array zurückgegeben, welches das erste Schlüssel/Wert-Paar aus $my_array\
    \ enthält. Da wir nur zwei Argumente des Operators angegeben haben, können auch\
    \ die Werte aus dem Wert-Element-Array zugeordnet werden. Es handelt sich um «0»,\
    \ den ersten Schlüssel, und »Element «1», das erste Wertelement aus $my_array.\n\
    \nDer folgenden Programcode zeigt den Inhalt des Arrays auf:\n\n```\n$my_array\
    \ = array(\"Element 1\", \"Element 2\", \"Element 3\");\n\nwhile(list($key, $value)\
    \ = each($my_array)) {\n    print(\"Key: $key, Value: $value<br>\");\n}\n```\n\
    \nDas Skript er eine Ausgabe, die in Abbildung 2.1. zu sehen ist.\n\n![](img/a6baf4404f9d19e866e05a7e62218c4e_67_0.png)\n\
    \nSie können each() auch verwenden, um die Elemente anzuzeigen, die each() selbst\
    \ zurückzugebt:\n\n```\n$my_array = array(\"Element 1\", \"Element 2\", \"Element\
    \ 3\");\n```\n\n```\nwhile(list($key, $value) = each($four_element_array)) {\n\
    \    print(\"Key: $key, Value: $value<br>\");\n}\n```\n\nDamit erhalten Sie das\
    \ in Abbildung 2.2 dargestellte Ergebnis.\n\nSie können deutlich sehen, dass die\
    \ Einträge «1», «value», «0» und «key» zusammen nur als «key» und «value» verwendet\
    \ werden sollten. Beachten Sie, dass jedes Paar einen Eintrag des Quell-Arrays\
    \ darstellt."
