  md: '# 1 Entwicklungskonzepte


    Programm abgetrennt – sofern es gut durchdacht haben. Funktionsgruppen, die logisch
    nur eine bestimmte Aufgabe durchführen können, sollten konzipiert sein, dass sie
    vom übrigen Programm unabhängig behandelt werden können. Diese Funktionen sollten
    auch physikalisch vom restlichen Hauptprogramm getrennt sein, in Form eines Moduls.


    Bevor ein Programm startet, sollten alle Funktionen erstellen, die in einem Modul
    zusammengefasst werden und einen separaten Entwicklungsplan für jedes Modul erarbeiten.
    Erstellen Sie unbedingt detaillierte Datenflussdiagramme, die Module alle Anforderungen
    und Fehler schnell handhaben. Unterschätzen Sie nicht die Bedeutung der Vorbereitung
    auf Papier. Es würde zu weit führen, wenn wir auf diesen Aspekt ausführlich eingehen.
    Wir empfehlen Ihnen, mit diesem Thema in der hervorragenden Buch über Design-Verfahren
    vertraut


    # 1.3.7 Trennen separater Programmteile


    Ganze Blöcke aus dem zu zu entfernen, sollte während der Planung– als auch während
    der Installationsphase geschehen. Angommen, eine Funktion folgt folgende Aktionen:


    +   1. Datei öffnen

    2. Datenblock aus der Datei lesen

    3. Daten validieren

    4. Mögliche Datenfehler korrigieren

    5. Daten in die Datei zurückschreiben

    6. Datei schließen


    Jeder Schritt kann in einem separat Block programmiert werden. Guter Stil ist,
    diese Blöcke zu sepieren und in separate Funktionen umzuwandeln. Damit können
    die einzelnen Blöcke nicht nur in anderen Funktionen verwenden (vielleicht benötigen
    Sie die Unterstützung für die Dateioperationen auch an einer Stelle); der Programcode
    ist auch leichter zu lesen, und Fehler sind schneller zu finden. Wenn Sie die
    entnommenen Teile sichern, mit separaten Fehlersuchrollen ausstatten u. v. Wenn
    Sie alles direkt in das Programm eingebettet, würde dies schnell zu einer unhandlichen
    Größe aufgelhen. Wenn Sie diese Codeblöcke in anderen Funktionen verwenden, müssten
    Sie diese gegebenenfalls auch in allen anderen Funktionen manuell korrigieren,
    die diese Blöcke verwenden – ganz zu schweigen von Fehlern und Änderungen. Durch
    das Herausten fassen Sie die kritischen Stellen zusammen, durch die Korrektur
    einer einzelnen Zeile können Sie das Verhalten aller verwandten Funktionen ändern.'
