  md: "# 2 Erweiterte Syntax\n\n```\n{\n  $this->item_list[$item] += $quantity;\n\n\
    \  $this->item_list[$item] += $quantity;\n\n  function drop($item, $quantity)\n\
    \  {\n    if($this->item_list[$item] > $quantity)\n      $this->item_list[$item]\
    \ -= $quantity;\n    else\n      $this->item_list[$item] = 0;\n  }\n}\n```\n\n\
    Dieser Code definiert die Klasse *shopping_cart* mit den Mitgliedern *item_list*,\
    \ *pick()* und *drop()*. Es gibt keine Möglichkeit öffentliche und private Mitglieder\
    \ zu unterscheiden. In PHP wird standardmäßig alles auf öffentlich gesetzt – was\
    \ bedeutet, man kann uneeschränkt auf alle Elemente und Mitgliedfunktionen einer\
    \ Klasse zug zugreifen.\n\nDieses Klassenbeispiel implementiert eine Art von Einkaufswagen\
    \ mit Variablen, die den Inhalt in einem assoziativen Array `$item_list` anbietet,\
    \ zwei Funktionen *pick()* und *drop()*, mit denen diese Einträge einzufügen und\
    \ entfernt werden können. Die Mitgliedsfunktionen sind wie reguläre Funktionen\
    \ deklariert, mit der Ausnahme, dass sie in der Klassendefinition eingebettet\
    \ sind. Die Klassenelemente (Variablen innerhalb der Klasse) werden mittels des\
    \ Schlüsswortes `var` definiert.\n\n> Hinweis: In PHP können Klassendeklarationen\
    \ und Implementierungen nicht getrennt werden. Alle Funktionen müssen direkt in\
    \ der Klassendeklaration implementiert werden.\n\n# 2.4.3 Zugriff auf Objekte\n\
    \nDie Mitgliedsfunktionen können über die „alte“ Syntax `instance->member()` oder\
    \ über die „neue“ Syntax `instance::member()` aufgerufen werden. Auf die gleiche\
    \ Weise greifen sie auf die Elemente entweder mit `instance->property` oder `instance::property`\
    \ zu. Diese Form eignet sich insbesondere dazu, den Konstruktor eines Elternknotens\
    \ aufzurufen oder auf andere Mitglieder zuzugreifen, die sich nicht im aktuellen\
    \ Objekt befinden (zu diesem Thema ist im Abschnitt „Vererbung“):"
