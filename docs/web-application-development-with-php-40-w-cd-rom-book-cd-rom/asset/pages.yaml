    Unser Beispiel zeigt, dass die Elementtiefe erfasst wird, die der Parser gerade
    bearbeitet. In der Startelementroutine wird die globale variable `$depth` um ein
    erhöht. In der Stoppelementroutine wird sie auf denselben Betrag reduziert. Dies
