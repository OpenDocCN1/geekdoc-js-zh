    \ Verwechseln Sie diese nicht mit der Document Type Definition (DTD). Die Dokumententyp-Deklaration\
    \ zeigt oder enthält eine DTD; die eine „Grammatik“ für XML-Dokumente zur Verfügung\
    \ stellt. Die Dokumententyp-Deklaration kann entweder auf eine externe DTD verweisen\
    \ oder beides. Die DTD für ein Dokument besteht aus beiden Teilenilen. Hier ist\
    \ ein Beispiel einer Dokumententyp-Deklaration:\n\n```\n<!DOCTYPE SYSTEM \"docbook.dtd\"\
    >\n```\n\nDie Dokumententyp-Deklaration hat den Namen root und zeigt auf eine\
    \ externe DTD namens docbook.dtd. Es sind keine DTDs eingebettet.\n\nWenn ein\
    \ Dokument die vollständige DTD, aber keine externen Entitäten enthält, wird es\
    \ als standalone-Dokument bezeichnet und als in der XML-Deklaration markiert:\n\
    \n```\n<?xml version=\"1.0\" standalone=\"yes\"?>\n```\n\nDies kann für einige\
    \ Anwendungen nützlich sein, z.B. Dokument über das Netz zu schicken, wenn Sie\
    \ nur einen einzelnen Dokumentendatenstrom öffnen möchten. Beachten Sie, dass\
    \ Sie selbst XML-Dokumente mit externen DTDs in selbstständige Dokumente umwandeln\
    \ können, indem Sie die DTD und die externen Entitäten in Prolog des Dokuments\
    \ importieren."
