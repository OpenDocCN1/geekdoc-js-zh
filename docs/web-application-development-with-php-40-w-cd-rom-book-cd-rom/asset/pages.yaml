    # Erstellen von Sperrdateien


    Unser zweiter Gedanke war, dass ein Datesystem effizient sein könnte, wenn die
    Datenbank für die prozübergreifende Kommunikation zu vielen Ressourcen benötigt.


    Das Datesystem hatte jedoch das Rennen verloren. Auch hier war die schreibende
