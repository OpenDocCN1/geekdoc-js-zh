  md: 'Das System wurde mit PHPLib (zur Datenbankabstrahlung) und HTML-Schablonenisiert.
    Mit den folgenden Erörterungen erhalten Sie einen umfassenden Überblick über die
    Anwendungsbildschirm mit PHPLib. Abbildung 7.1 zeigt den Startbildschirm der Anwendung.


    # 7.1.1 Anforderungskatalogog


    Wie in Kapitel 3 «Anwendungsdesign: ein Praxisbeispiel» besprochen, beginnt ein
    Projekt mit dem Aufstellen eines Anforderungskatalogs. In der Regel ist dies ein
    iterativer Prozess, der in enger Zusammenarbeit mit dem Kunden durchgeführt und
    von einem Systemanalytiker, Projektleiter, Berater, häufig programmiert wird.
    Die Analyse des Problemfeldes und das Erstellen eines Anforderungskatalogs gehört
    den wichtigsten Phasen der Softwareentwicklung, die einen großen Einfluss auf
    den Erfolg des Projekts haben. Dieses Projekt wurde mit einer Anforderungsliste
    von Zend Technologien gestaltet.


    Es sollte ein Verzeichnis entwickelt werden, das so aufgebaut ist, dass PHP-Fakte,
    Tipps und Hinweise zu finden sind. Auf dieser Seite der Anwendung werden die verfügbaren
    Kategorien der Stammkategorie und eine Liste der in der Datenbank hinzugefügten
    Einträge angezeigt. Durch Klicken auf die Kategorien soll der Benutzer Einträge
    dieser Kategorie durchblättern. Durch Klicken auf einen Eintrag soll er zu der
    Seite gelangen, die Einzelheiten zu diesem Eintrag enthält: den vollständigen
    Text, den Namen des Autors, das Datum, an dem der Eintrag hinzugefügt wurde, und
    die aktuelle Bewertung. Es soll die Möglichkeit geben, auf dieser Seite Einträge
    einer Klassifikation von Eins bis fünf zu graduieren, wobei Eins den höchsten
    Grad darstellt.


    Das Programm soll eine Volltext-Suchfunktion haben, bei der als Standardverknüpfungsoperator
    UND verwendet wird. Wenn der Benutzer «imap connect» eingibt, soll das System
    alle Einträge in der Datenbank zurückgeben, die im Titel oder Text sowohl «imap»
    als auch den Eintrag «connect» enthalten. Bei der Suche soll Groß- und Kleinschreibung
    nicht unterscheiden.


    Es soll jedoch möglich sein, alle Einträge anzuzeigen, die von einem bestimmten
    Autor stammen. Zusätzlich sollen drei Bericht verfügbar sein, welche die Autoren
    mit den meisten Einträgen in der Datenbank zeigen, die Einträge mit der höchsten
    Bewertung und die am häufigsten zugegriffen wurden.


    Nur registrierte Benutzer sollen neue Einträge vorlegen. Eingereichte Einträge
    sollen nicht sichtbar sein, sondern in der Datenbank mit einem Flag eingefügt
    werden, das anzeigt, dass diese Einträge genehmigt werden müssen. Sobald ein neuer
    Eintrag eingereicht wird, soll der Administrator benachrichtigt werden.'
