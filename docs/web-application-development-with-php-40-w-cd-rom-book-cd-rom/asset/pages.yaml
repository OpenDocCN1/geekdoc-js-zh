  md: '# 8.3.9 Die Zukunft


    MarketPlayer.com entwickelt sich derzeit in Richtung auf eine 100%ige Website.
    Mit über acht Millionen Seitenansichten pro Monat auf allen seinen Websites hat
    MarketPlayer.com keine Probleme in der Handhabung des Datenverkehrs festgestellt
    ist und unter der Überzeugung, dass PHP jeden Datenfrequenz bewältigt.


    # 8.4 Zusammenfassung


    Wie wir feststellen konnten, unterscheidet sich das heutige PHP stark von seinen
    Ursprüngen. Obwohl einen enormen Einfluss auf die Open-Source-Gemeinschaft hatte,
    wurde PHP zu Beginn als Amateurlösung betrachtet und als bloßes Spielzeug angesehen.
    Natürlich waren die »Pretty Hip People« (wie die PHP-Benutzer manchmal manchmal
    selbst bezeichnen) von ihrem eigenen Tool vollkommen überzeugt, mussten aber zugeben,
    dass sich das manchmal im Wettbewerb nicht messen konnte. Im Laufe der Entwicklung
    der Version 3 wagte PHP den Angriff auf alle Giganten, wie ASP, Cold Fusion u.a
    – und gewann den Kampf immer tiefer.


    In diesem Kapitel haben wir Ihnen drei Beispiele gezeigt, in denen PHP seine Konkurrenten
    erfolgreich aus dem Ring geworfen und bewies, dass es in der Praxis durchaus als
    leistungsfähiges Werkzeug taugt. Angesichts der schnell wachsenden Anzahl von
    Servern, auf denen PHP mittlerweile läuft, und des riesigen Schritts, den PHP
    von der Version 3 zur Version 4 gemacht hat, glauben wir, dass PHP nun das erreicht,
    ein hervorragendes Werkzeug zur raschen Entwicklung von stabilen und schnellen
    Skriptungen geworden.


    # 8.5 Referenzen


    +   1 Die Umfrage finden Sie unter www.netcraft.com/survey.'
