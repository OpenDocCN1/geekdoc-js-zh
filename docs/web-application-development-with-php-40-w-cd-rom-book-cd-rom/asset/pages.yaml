  md: '+   Wenn Benutzergruppen benötigen (die wir zuvor als »Genehmigungsebenen«
    bezeichnen), brauchen sie eine eigene Programmlogik, um Einzelbenutzer zu Gruppen
    zusammenzufassen.


    +   Sie können den Anmeldeproz nicht ändern: Der Popup-Dialog bleibt derselbe,
    welche Website sie verwenden.


    +   Erfahrene Benutzer haben in der Regel Angst vor Dialogen. Sie können keine
    Hilfe finden, da Sie den Dialog nicht ver können.


    +   HTTP-Authentifizierung über PHP ist nicht mit der Modulverwaltung möglich.


    +   Die Berechtigung beschränkt sich auf Verzeichnisse. Was ist, wenn Sie nur
    eine Seite schützen möchten? Mit dem Apache-Anweisungen ist dies unmöglich. Sie
    müssten eine HTTP-Authentifizierung über PHP durchführen.


    All dies führt zur Schlussfolgerung, dass es möglicherweise klar ist, eine andere
    Lösung zu bevorzugen, wenn Sie nicht gerade mit einfachen Szenarien zu tun haben,
    denn Sie wollen Ihr Publikum diese Dialoge zeigen und keine Genehmigungsebenen
    oder Leerlauf-Timeouts.


    # PHP-Authentisierung


    Die PHP-eigene Authentifizierung ermöglicht Ihnen dagegen, beliebige Anmeldedaten
    und Berechtigungsprozeduren zu verwenden, da sie formularbasi arbeitet. Damit
    die Berechtigung funktioniert, brauchen Sie Sitzungsverwaltungsfunktionen. Sobald
    der Benutzer angemeldet ist, müssen Sie diesen Status über mehrere An hinweg merken.


    Sie können sich eine eigene Authentisierungsbibliothek schreiben, wenn Sie dafür
    die zu beschworen PHP-Sitzungsverwaltungsfunktionen verwenden. Oder Sie benutzen
    PHPLib. Mit seiner Klasse Auth können Sie die Authentifizierung durchführen und
    mit der Klasse Perm Sie alle Zugriffsrechte vergeben. Einzelheiten über die genaue
    Vorgehensweise finden Sie in Kapitel 6.


    # 4.3  Die Bedeutung der Tauglichkeit


    Sie werden sich vielleicht fragen, warum in einem Buch über Softwareentwicklung
    das Thema Tauglichkeit angeschlossen wird. Wir halten es für notwendig, da ein
    ernsthafter Entwickler die grundlegenden Prinzipien der Informationsarchitektur,
    der Entwicklung von Benutzeroerschnittstellen und der Tauglichkeit kennen.'
