  md: '# Schnittstelle zum Netzwerk


    Nach der Initialisierung und dem Setup muss das Programm die Kontrolle an phpIRC
    springt dann an den Hauptptereignissleife und wartet auf ein Ereignis. Während
    des Setups muss das Programm für jedes Ereignis, das es verarbeiten möchte (z.B.
    neue Nachrichten, ankommende Server-Nachrichten), Rückrufe registrieren. Diese
    Nachrichten sind für das Programm die einzige Möglichkeit, die Kontrolle zurückzugeben.
    phpIRC übergibt an alle Funktionen, die in der Bibliothek registriert haben. Diese
    Funktionen könnten in eine weitere Schleife eintreten, die auf ein weiteres Ereignis
    wartet, oder sie die API von phpIRC nutzen, um bestimmte Aktionen im Netz durchzuführen
    (private Nachrichten senden, Kanäle verbinden/verlassen usw.).


    Dieses grundlegende Layout ermöglicht eine Downstream-Kommunikation, so dass phpIRC
    in der Lage ist, Nachrichten von anderen Benutzern zu empfangen. Dies könnte Personen
    mit ihrem Script «reden».


    > **Hinweis:** Downstream bedeutet, vom Netzwerk zum Benutzer. Upstream ist das
    Gegenteil, d.h. vom Benutzer zum Netzwerk.


    **Übung:** Strukturieren Sie eine Downstream-Schnittstelle, die phpIRC-Funktionen
    verwendet. Realisieren Sie diese auf dem Papier und machen Sie sich mit der API
    von phpIRC vertraut. Generieren Sie dann eine einfache Downstream-Schnittstelle,
    die über IRC Protokoll führt und alle Nachrichten von einem angegebenen Kanal
    anzeigt.


    # 3.5.2 Downstream-Kommunikation


    Da Chatten eine Echtzeit-Angelegenheit ist, was bedeutet, dass die Prozesse ablaufen,
    während Sie Gespräche führen und Antworten sofort bereitstellt, möchten wir die
    Schnittstelle nicht mit einer Latenz versehen. Latenzzeit beschreibt die Reaktionzeit
    der Schnittstelle, z.B. die Zeit zwischen dem Moment, da der Benutzer die Nachricht-Taste
    drückt um eine Nachricht abzuschicken, bis zu dem Augenblick, an dem das im Chat
    erscheint. Eine Latenzzeit von weniger als einer Sekunde mag zwar objektiv extrem
    lang eine sehr Wartezeit sein, für den Benutzer ärgerlich. Ankommende Nachrichten
    sollten daher sofort angezeigt werden (oder so bald wie möglich). HTTP ist ein
    zustandsloses Protokoll, das sofortige Aktualisierung von Seiten nur ermöglicht,
    wenn ein vollständiges Dokument neu geladen wird. Natürlich gibt es mehrteilige
    Dokumente und eine automatische Auffrisischung, aber bei jeder Aktion entsteht
    ein lästiges Flimmern wenn eine Seite neu geladen wird,'
