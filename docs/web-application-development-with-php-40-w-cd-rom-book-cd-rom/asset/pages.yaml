    # Aktualisierung von Kommentaren


    Denken Sie daran, die Kommentare einzugeben, bevor oder während Sie die Module
    oder Funktionen bearbeiten, die Sie beschreiben. Es ist sehr ärgerlich, eine Datei
    im Nachhinein noch einmal öffnen zu müssen, um die Kommentar einzufügen. Achten
    Sie darauf, wenn Sie später Funktionen verändern, die Kommentare entsprechend
    zu ändern. Wenn Sie beispielsweise globale Variablen hinzuzufügen oder entfernen,
    aktualisieren Sie auch deren Verwendungszweck im Kommentarkopf. Das Gleiche gilt
    für Änderungen in der Reihenfolge von Parametern, Paramettypen.


    # Einsatz von Makros zur Beschleunigung der Kommentierung


    Erstellen Sie mit Ihrem Editor für jeden Kommentartyp Makros und weisen Sie diesen
    einem Tastaturkürzel zu (z.B. E+Alt+E für Dateikköpfe, E für Modulköpfe usw.).
    Wenn dies unterstützt, fügen Sie auch Variablen in diesen Kommentaren ein, so
    dass Sie ausgefüllte und aussagekräftige Kommentare über einen kurzen Frage-Antwort-Dialog
    erzeugen können.


