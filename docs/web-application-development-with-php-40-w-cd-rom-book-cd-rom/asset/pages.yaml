    eingeführt, die den Zugriff auf zval-Container vereinfachen Wir haben jedoch entschieden,
    sie in den Beispielqualcodes nicht zu verwenden, da sie nicht häufig Zugriff auf
    zval-Container nehmen und die Makros auf Quellcode geführt hätten, der schwieriger
    zu lesen gewesen wäre.


