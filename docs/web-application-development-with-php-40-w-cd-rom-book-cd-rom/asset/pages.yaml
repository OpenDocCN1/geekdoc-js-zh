    Sie glauben, dass Sie das gefunden haben. Unbewusst ist Ihr Gehirn noch einmal,
    wie viele Informationen aus der physikalischen Analyse fehlen. Zur Komensation
    der fehlenden Informationen aus dem ersten Schritt übernimmt dieser Schritt und
    ist damit belastet. Genau wie bei einem Computer hat unser Hir eine begrenzte
    Kapazität. Die zusätzliche Belastung des logischen Analysators entspricht dem
    Kapazitätspass des Gehirns, welches versucht, den Quelle zu verstehen und zu behalten.
    Verstehen und behalten ist auch genauso, was andere Leute beim Lesen Quellcodes
    tun sollen und was sie beim Lesen Fremder Codes beabsicht.


    Dies war eine nahezu wissenschaftliche Erklärung, warum die Formatierung von Quellecode
    sinnvoll ist. Gibt es noch einen anderen Grund? Ja! Gut formatierter Quellecode
    lässt sich einfach gut lesen.


    Im Folgenden finden Sie einige Richtlinien, die wir für die optimalen Mittel zur
    Formatierung des Quellecodes halten. Sie sind nicht bindend, aber sie werden allgemein
    als gut betrachtet. Wir industrielle und Open-Source Projekte auf diese Weise
    formatieren, hilft uns, sich zu verstehen.


    +   - Setzen Block-Tags (<, ?, <?php, <;, {, } usw.) in separate Zeilen.

    - Ziehen Blöcke stets mit Tabulatoren ein (im Idealfall selbst wenn der Tabulator
    mindestens 4).

    - Fügen zwischen Schlüsselwörtern und Schlüsselzeichen Leerzeichen ein, insbesondere
    wenn Sie Berechnungen vornehmen.

    - Fassen Sie logische Programteile in einem Block zusammen, indem Sie diese aufeinanderfolgende
    Zeilen platzieren und fügen zwischen allen anderen eine Zeile ein.

    - Trennen Sie zwei Blöcke durch eine Leerzeile.

    - Setzen Sie Funktions-Header und Footer mit einer Leerzeile vom übrigen Text
    ab (der Import von globalen Variablen wird als Teil des Functions-Header betrachtet).'
