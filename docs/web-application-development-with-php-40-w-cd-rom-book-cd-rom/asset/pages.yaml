  md: '# 9 Erweiterung von PHP 4.0: Knacken wir den PHP-Kern


    | Funktion | Beschreibung |

    | --- | --- |

    | strdup() | Ersetzt strdup(). Schneller als estrdup() und binärsicher. Die Verwendung
    dieser Funktion empfehlen, wenn Sie die Länge des Strings kennen, bevor Sie ihn
    duplizieren. |

    | ecalloc() | Ersetzt ecalloc() |

    | erealloc() | Ersetzt realloc() |


    emalloc(), strdup(), emalloc(), ecalloc() und erealloc() weisen internen Speicher
    zu; efree() setzt den zuvor zugewiesenen Blöcke vom aktuellen Prozess als lokal
    betrachtet, und von den e(*) wird gelöscht, sobald das dem Prozess ausgeführte
    Skript beendet wird.


    > > **Warnung:** Um residenten Speicher zuzuweisen, der nach der Beendigung des
    aktuellen Skripts bleibt, sollten Sie malloc() und free() verwenden. Dies sollten
    jedoch nur mit extremer Vorsicht tun und wenn die Zend-API dies erfordert. Ansonsten
    riskieren Sie Speicherleck.


    Zend bietet einen Unterstützung für thread-sicherer Ressourcenmanager, der bessere
    und direkte Unterstützung für Webserver mit mehreren Teilprozessen bietet. Dafür
    müssen Sie allen ihren globalen Variablen lokale Strukturen zuweisen, damit gleichzeitig
    mehrere Teilprozesse ausgeführt werden können. Da der thread-sicher Modus von
    Zend noch nicht fertiggestellt ist, können wir ihn in diesem Buch nicht behandeln.


    # 9.4.4 Verzeichnis- und Dateifunktionen


    Die folgenden Verzeichnis- und Dateifunktionen sollten in Zend-Modulen verwendet
    werden (sie verhalten sich genauso wie ihre C-Gegenstücke):


    | Zend-Funktion | Reguläre C-Funktion |

    | --- | --- |

    | V_GETCWD() | getcwd() |

    | V_FOPEN() | fopen() |

    | V_CHDIR() | chdir() |

    | V_GETWD() | getwd() |

    | V_CHDIR_FILE() | Hat als Argument einen Dateipfad und ändert das aktuelle Arbeitsverzeichnis
    auf das Verzeichnis der Datei.

    | V_STAT() | stat() |

    | V_LSTAT() | lstat() |'
