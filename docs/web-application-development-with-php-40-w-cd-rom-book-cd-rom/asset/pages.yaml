  md: '# Datenstruktur


    Nennen Sie alle Teile, die ein XML-Dokument ausmachen: Elemente (mit Attributen),
    Verarbeitungsbefehle, Entitäten, Kommentare und CDATA-Abschnitte. Aber wie wird
    aus diesen Einzelte ein sinnvolles XML-Dokument?


    Die XML-Spezifikation definiert eine sehr allgemeine Dokumentenstruktur. Sie besagt,
    dass jedes wohlformierte Dokument Eigenschaften hat (mehr die Bedeutung von «wohlgeformt»
    später):


    +   kann einen Prolog haben, der die XML-Version und die verwendete DTD angibt


    +   muss ein Stammelement schreiben und kann eine beliebige Anzahl von Elementen
    unterhalb des Stammes enthalten


    +   danach kann Verschiedenes folgen


    Der letzte Teil, hier etwas flaps «Verschiedenes» bezeichnet, wird von vielen
    Leuten als Konzeptbegriff von XML betrachtet. Er wird möglicherweise die Analyse
    der XML-Dokumente, die sich nicht darauf verlassen können, dass das Dokumentenende
    das schließende Stammelement ist. Wenn Sie ein Dokument über eine Netzwerkverbindung
    analysieren, können Sie die Verbindung nicht einfach schließen, nachdem Sie das
    schließende Stammelement erhalten haben. Sie müssten warten, bis der Server der
    Verbindung von selbst schließt, da ja immer noch folgt kann.


    Bis haben wir noch kein Wort für die Syntax und Struktur des Elements, das für
    den ganzen Zauber von XML verantwortlich sein soll: die Dokumententyp-Definition.
    Tatsächlich ist es die DTD, die Syntax, die Abfolge und Verschachtelung von Tags,
    mögliche Elementattributre, Entitäten - kurz, die gesamte Grammatik. Komplexe
    DTDs zu schreiben ist keine einfache Aufgabe, und darüber werden schon ganze Bücher
    geschrieben. Da Sie sich als XML-Benutzer normalerweise nicht mit dieser Aufgabe
    befgeben müssen, gehen wir über dieses Thema nicht näher ein. Stattdessen möchten
    wir uns ein weiteres XML-Konzept ansehen, das für Ihre tägliche Arbeit wichtiger
    sein könnte.


    # XML-Namensräume


    Sie haben verschiedene XML-Anwendungen (Document Type Definitions) gesehen und
    erfahren, wo sie verwendet werden. Was passiert jedoch, wenn ein einzeles XML-Dokument
    erzeugt, das Elemente aus zwei verschiedenen DTDs enthält? Das Element <part>
    könnte in einer DTD beispielweise den Teil eines Buches be, während es in einer
    anderen DTD den Herstellungsteil kennzeichnet. Ohne eine Möglichkeit, diese beiden
    Namensräume voneinander zu trennen, würden die beiden Elementnamen kollidieren.'
  merge: -1
  pgno: 312
- img_proc: true
  md: "# 7 Anwendungen der Spitzentechnologie\n\nWie können diese unterschiedlichen\
    \ Elemente identifiziert werden? Sie müssen dem Element einen Bener zuordnen,\
    \ z.B. <namespace=\"book\"> oder, wenn Sie Attribute mittels verlinken, <book:part>\
    \ und <manufacturing:part>.\n\nDas W3C früh von diesen Mängeln in XML und führte\
    \ eine neue Spezifikation: Namensraum in XML, die als Empfehlung am 14.Januar\
    \ 1999 verabschiedet wurde.\n\nXML-Namensräume bieten die Möglichkeit, in einem\
    \ XML-Dokument mehrere Namensräume zu verwenden, welche über einen URI(Uniform\
    \ Resource Identifier) gekennzeichnet werden. Dieses Verfahren wird in der RDF(Resource\
    \ Description Framework)-DTD verwendet. Betrachten Sie sich folgendes Beispiel\
    \ aus der RDF-Spezifikation:\n\n```\n<?xml version=\"1.0\"?>\n<rdf:RDF xmlns=\"\
    http://www.w3.org/1999/02/22-rdf-syntax#\"\n     xmlns:s=\"http://description.org/schema/\"\
    >\n  <rdf:Description about=\"http://www.w3.org/Home/Lassilla\">\n    <s:Creator>Ora\
    \ Lassilla</s:Creator>\n  </rdf:Description>\n</rdf:RDF>\n```\n\nHier werden zwei\
    \ Namensräume definiert, einer mit dem Namen rdf und der unter dem Namen s. Nach\
    \ der Definition wird ein Namensraum verwiesen, er als Prädiks (durch Doppelpunkt\
    \ getrennt) einem Element vorangestellt wird. Damit wird effektiv die Kollision\
    \ verschiedener logischer Bedeutungen und syntaktischer Definitionen vermieden.\n\
    \n> Hinweis: Die URI in einem Namensraum-Bezeichner ist keine DTD. Es wäre natürlich\
    \ schön, über XML-Namensräume auf verschiedene DTDs zeigen zu können, aber es\
    \ gibt derzeit viele technische Probleme bei diesem Ansatz. Hieriert beschäftigt\
    \ sich gerade der W3C in Form der XML-Schemadeinition, die sich zum Zeitpunkt\
    \ der Buchstellung noch in der Entwicklung befand.\n\nEBNF – oder «Was dies nun\
    \ schon wieder?»\n\nAls Webentwickler haben Sie die Aufgabe, Spezifikationen zu\
    \ lesen: Projekpezifikationen, formale Spracherspezifikationen oder Whitepapers\
    \ zu Standards. Beim Lesen einer Spezifikation von W3C (die bekanntesten sind\
    \ wah wahrscheinlich die HTML- und XML-Dokumente), stolpern wir über eine seltsame\
    \ Mischung von Zeichen, die vermutlich eine Grammatikdefinition bilden.\n\ndocument\
    \ ::= prolog element*"
