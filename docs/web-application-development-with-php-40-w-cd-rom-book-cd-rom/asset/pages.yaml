  md: '# 4 Webanwendungskonzepte


    PHP hat eine eingebaute uniqid()-Funktion. Diese basiert jedoch auf der Systemzeit
    und ist nicht sicher genug, als Sitzungsnummer zu dienen. Sie können jedoch mit
    einer Hash-Function und rand() kombinieren, um eine wirklich wirliche Zeichenfolge
    für 2^12 mögliche Elemente zu generieren.


    ```

    rand((double)microtime()*1000000); // Seed the random number generator

    $session_id = md5(uniqid(rand())); // Construct the session ID

    ```


    # Zugriff auf die IP-Adresse des Nutzers


    Sie können auf die IP-Adresse des Nutzers über die Umgebungsvariable REMOTE_ADDR
    zugreifen. Mit phpinfo() erhalten Sie eine Liste aller verfügbaren Umgebungsvariablen.


    Jeder, der versuchte, zu knacken, musste mittels Brechenverfahren alle möglichen
    Elemente angreifen, um eine gültige Sitzungsnummer aus 340.282.366.920.938.463.374.607.431.256
    Werten herauszufinden. Die Kryptanalytiker von Oorschot und Wiener entwickelten
    die theoretische Maschine für MD5 und schätzen 1994, dass eine solche Maschine
    (geschätzt Kosten $ 10 Millionen) im Durchschnitt 24 Tage brauche, um mit einer
    MD5 verschlüsselte Nachricht zu knacken.[23].


    Wenn Sie unruhig sind, sollten Sie darauf nachdenken, Ihren Server vom Internet
    abzuklemmen.


    md5(uniqid()) – dasselbe Gebilde wie, ohne rand() – wäre nicht sicher genug. Da
    uniqid() auf der Systemzeit basiert, lässt sich nur erraten, sobald der Hacker
    die Systemzeit des Servers kennt. Der durchsuchende Bereich ist dann deutlich
    kleiner als 2^12.


    # 4.1.2 Sitzungskennummer-Verteilung mit Cookies


    Die einzige Option, welche bleibt, ist die Sitzungsnummer für alle Seiten Ihres
    Programms verfügbar zu machen. Dies erreichen beispielsweise ein Cookie, der die
    ID enthält. Wenn Sie ein Benutzer über mehrere Sitzungen hinweg identifizieren
    wollen, ist die Verwendung eines Cookies die einzige Möglichkeit. Unglücklicherweise
    wird ein Teil der Benutzer den Cookie in ihrem Browser deaktiviert haben (Schätzungen
    zufolge sind dies bis zu 20%). Je Zielgruppe lohnt es sich möglicherweise, den
    Benutzer auf eine Hilfeseite umzuleiten, diejenige zeigt, wie Sie die Cookies
    aktivieren können.


    Die Sitzungskennummer mit Cookies zu übergeben, ist für den Entwickler die bei
    weitem einfachste Methode. Ihr Programm muss nichts anderes tun, als das Cookie
    zu setzen.'
