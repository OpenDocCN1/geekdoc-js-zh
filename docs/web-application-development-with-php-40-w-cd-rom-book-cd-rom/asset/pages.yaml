- img_proc: true
  md: 'Serialisierungs- und Deserialisierungsmodule klar von einem getrennt. Alle
    Programmiersprachen, die WDDX unterstützen, können WDDX-Pakete serialisieren und
    deserialisieren. Serialisieren Sie ein PHP-Array im WDDX-Paket, deserialisieren
    Sie das Paket in ASP, und Sie haben wieder ein Array! Wie die Serialisierungs-
    und Deserialisierungsfunktion tatsächlich realisiert wird, ist. In PHP haben Sie
    die wddx *()-Funktionen, in ColdFusion können Sie das Tag CFWX verwenden, und
    in ASP steht ein COM-Element zur Verfügung.


    Zugegeben, die könnten Sie auch ohne WDDX bewerben. Es ist jedoch recht kompliziert,
    insbesondere wenn die Datentypen in den verschiedenen Programmierumgebungen erhalten
    möchten. Der Vorteil von WDDX liegt darin, dass Sie mit Ihren Müssen frei und
    eine flexible, offene und pragmatische Alternative bietet, um strukturierte Anwendungs-
    auszutauschen.


    #  7.3.5 WDDX-Datentypen


    Die meisten Programmiersprachen verwenden die gleiche Art von Datentypen, z. B.
    Strings oder Arrays. Der Zugriff auf diese Strukturen kann von Sprache zu Sprache,
    aber allgemeine Ansatz bleibt gleich. Ein String ist eine Folge von Zeichen. Ob
    Sie nun in einer einfachen Syntax, einfache Anführungszeichen, doppelte Anführungszeichen
    oder gar nicht einschließen, macht vom Konzept her keinen Unterschied.


    WDDX unterstützt diese generischen Datentypen. In der Version 1.0 der Spezifikation
    werden folgende Typen definiert:


    +   * Null-Werte: Element null

    * Booleches Werte: bool

