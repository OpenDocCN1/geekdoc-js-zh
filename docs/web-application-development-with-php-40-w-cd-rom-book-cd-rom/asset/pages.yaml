  md: '# Entwicklung einer Anwendungsprogrammschnittstelle


    +   * Einführung

    * Inhaltsverzeichnis

    * Benutzer-Leitfaden

    * Technische Dokumentation

    * Entwickler-Leitfaden

    * Vollständige Referenz aller Funktionen


    Der Benutzer-Leitfaden sollte ausführlich alle Anwendungsprogrammmschnittstellen
    (sofern vorhanden) für den Durchschnittsbenutzer beschreiben. Gehen Sie nicht
    sehr technische Detail; sollte nur eine «Wie Sie...»-Beschreibung sein. Behandeln
    Sie jedes Aspekt. Die technische Dokumentation sollte für technisch interessierte
    Benutzer und Administratoren geschrieben werden und Auskunft über die technischen
    Spezifikationen Ihres Programs, gebräuchliche und neue Standards sowie über interne
    Datenverarbeitung (sofern dies den Leser interessiert ist) – und soweit Ihre Lizenz
    zählt. Wenn Sie den Quellcode ansehen und/oder ändern können, fügen Sie auch einen
    Entwickler-Leitfaden hinzu, wenn Sie die Projektstruktur, den Datenfluss und die
    neuen Beziehungen aufführen. Außerdem sollten Sie der vollständigen Beschreibung
    eine Referenz aller Funktionen (einschließlich interner Funktionen) beifügen.


    Wenn Sie in einem Team arbeiten, kann ein professioneller Technischer Redakteur
    Ihnen helfen. Er hat Erfahrung darin, eine umfassende technische Dokumentation
    zu erstellen, und die Zeit, dies zu tun. Wenn Sie diese Aufgabe an einen Entwickler
    auftragen, der nebenbei noch programmieren soll, führt dies zu jeder Menge zusätzlichen
    Stress. Entwickler haben in der Regel damit zu tun, ihre Endermine einzuhalten.


