    Die Datei config.m4 ist zuständig für die Analyse der Befehlsoptionen,

    während der Konfiguration an configure übergeben werden. Dies bedeutet,

    dass Sie über überprüfen müssen, ob erforderliche externe Dateien vorhanden sind,
    und\viele Konfigurations- und Installationsaufgaben übernehmen.


    Die Standarddatei generiert zwei Konfigurationsbefehle im Skript configure:

    --with-my-module und --enable-my-module. Verwenden Sie die erste Option,

    wenn Sie auf externe Dateien referenzieren (so etwa die Anweisung

