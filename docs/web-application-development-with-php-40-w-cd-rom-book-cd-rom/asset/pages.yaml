  md: '# 4.2.4 Authentifizierung


    Sie werden bald feststellen, dass Sie eine Technik immer wieder brauchen: Authentifizierung.
    Wenn Ihre Benutzer beispielsweise nur auf einige Teile Ihrer Website zugreifen
    dürfen, nachdem dem Sie sich selbst im System eingeloggt haben, brauchen Sie ein
    Authentifizierungsverfahren.


    # Anmeldevorgang


    Betrachten wir zunächst die theoretischen Konzepte der Genehmigung. Die Anmeldung
    findet in drei Stufen statt: Identifizierung, Berechtigung und Genehmigung.


    # Identifizierung


    Bevor Sie überprüfen können ob ein Benutzer berechtigt ist, müssen Sie seine Identität
    kennen. Daher forern wir ihn auf, sich zu identifizieren. Die Identifizierung
    gibt an, wer der Benutzer ist. Sie kann ein Benutzername, eine Kundummer oder
    beliebig anderes sein, solange Sie in Ihrer Benutzerbasis eindeutig ist. Der Begriff
    „Benutzer“ kann sich in diesem Kontext auf eine Person, einen Prozess oder etwas
    (beispielsweise einen Knoten im Netzwerk) beziehen.


    Identifizierung ist nicht dasselbe wie Authentifizierung! Die Tatsache, dass ein
    Benutzer eine Identität angegeben hat, bedeutet nicht, dass diese Identität garantiert
    berechtigt ist. Ohne Authentifizierung ist diese Identität suspekt.


    # Authentifizierung


    Nachdem der Benutzer eine Identifizierung angegeben hat, müssen Sie diese überprüfen.
    Dies ist die Aufgabe eines Authentifizierungssystems. Er überprüft die Identität
    des Benutzers mit einem von drei Authentifizierungsverfahren: etwa, was er weiß,
    was er hat, was er ist oder was er tut.


    Das Verfahren «was man wissen», das auch als Authentifizierung Wissen bekannt
    wird, ist die im Web am häufigsten verwendete Methode. Benutzer können ein Passwort
    wählen oder sich zuweisen. Dies müssen sie sich merken und geheim halten. Die
    Authentifizierung erfolgt nach Prüfung, ob die Identität des Benutzers durch Passwort
    bestätigt wird. Varianten sind die Personal Identification Numbers (PINs), die
    Übergabe von Phrasen oder die Anfrage nach Daten über den Benutzer, der nur Benutzer
    wissen kann. Die Hauptursache dieser Art von Authentifizierung besteht darin,
    es häufig einfach ist zu erfahren, wer jemand anderes ist. Möglicherweise können
    Sie das sogenannte „etwas, das sie wissen“, etwa Zugriff darauf zu haben. Denken
    Sie an die Rechchenlangenattacken bei Shell-Logins. Im Falle von Webanwendungen
    überwiegen die Vorteile der Authentifizierung durch Wissen normalerweise Sicherheitsmängel.
    Der Benutzer kann das Passwort überall und ständig auf dieses System zugreifen.
    Ein weiterer Vorteil ist, dass diese Methode einfach ist und sich leicht installieren
    lässt.'
  merge: -1
  pgno: 203
