  md: '# Vorwort von Zeev Suraki


    Als ich vor drei Jahren das erste Mal mit PHP konfrontiert wurde, hatte ich keine
    Ahnung, dass ich eines Tages ein Vorwort für ein PHP-Buch schreiben werden würde.
    Tatsächlich schien mir damals die Vorstellung, dass es jemals ein PHP geben würde,
    ein wenig weit her. Rückblickend ist das, dass PHP zu der am meisten verbreiteten
    Skriptsprachen für die Web-Entwicklung wurde, fast erstaunlich. Meine Mitarbeit
    am PHP-Projekt begann, wie damals. Zufällig. Ich stolperte als Endbenutzer über
    einen Fehler in PHP/FI 2.0 – das war selten genug nur, bis mein Kollege Andi Gutmans
    und ich die Sache näher betrachteten. Als wir uns in den Programmcode wagten,
    waren wir nicht sehr vorbereitet. Auf der anderen Seite gefiel uns die Vorstellung
    einer HTML-eingebetteten Skriptsprache für die Serverseite. Als zukünftige Software-Entwickler
    beschlossen wir, den Code noch einmal von Grund auf neu zu schaffen, aber dies
    richtig.


    Durch das Unmenge an «Zuarbeiten», die in Form von zahlreichen Funktionsmodulen
    und Beispielen geleistet wurde, erhielt PHP einen Auftrieb, der unsere endlsten
    Räume und Erwartungen spricht. Heute ist PHP in mehr als Millionen Domänen im
    Internet bekannt und das Werkzeug der Wahl für Skripterstellung in XML-Umgebungen
    auf der Serverseite. PHP 4.0 zeigt die kontinuierliche Fortschritt, dass PHP auf
    Jahre hinaus die führende Technologie im Bereich der Web-Skrip bleibt. Der Zend-Prozessor
    revolutioniert die Leistungsfähigkeit und Skalierbarkeit von PHP-basierten Websites.
    Durch die integrierte Unterstützung für Sitzungen, XML, Java und COM sowie eine
    Reihe weiterer Funktionen können Web-Entwickler sich wie zuvor noch einmal leistungsfähiger,
    dynamische Webseiten entwickeln.


    Durch die kontinuierliche Entwicklung und Integration führender Technologien bleibt
    PHP stets aktuell. Die neue- und DCOM-Unterstützung, die erweiterten XML-Funktionen
    und die verbesserten OOP-Funktionen erhöhen die Akzeptanz von PHP in der Geschäftswelt
    und machen es zu einem wert Werkzeug für die Datenverarbeitung in Unternehmen.
    Die kommerziellen Add-Ons zu Web Technologies sind zum Beispiel Debugger, DIE
    und Compiler – machen die Firmen einen Schritt vor. Auch das Innenleben der PHP
    4.0-Architektur wurde revolutioniert, welches jedoch den Endbenitzer nicht bemerken
    wird. Die Webserver-Schnittstelle wurde beispielsweise vollständig unterstützt,
    so dass auch andere Web-Server als Apache unterstützt werden können. Bücher wie
    dieses versorgen Sie mit den notwendigen Hintergrundinformationen, damit Sie diese
    neuen Technologien erfolgreich einsetzen können.'
  merge: -1
