  md: '# Datenbankzugriff mit PHP


    Wenn Sie eine Datenbank für DB_Sql verwenden und eine andere Datenbank für die
    Sitzungsdaten, wird dies zu Problemen führen. Leider gibt es für-es Problem bisher
    noch keine Lösung.


    # 6.2.5 Sessions


    PHPLib bietet durchaus äquivalente Funktionen zu PHPs integraler Sitzungsverwbibliothek.
    Häufig sind sich die Namen der Funktionen identisch. Sie ähneln zwar in einigen
    Aspekten der internen Sitzungsverwaltung in PHP, trotzdem ist PHPLib nicht mit
    ihrer identisch. Eine schöne zusätz-liche Funktion ist der automatische Rückmodus,
    auf den wir im nächsten Abschnitt eingehen.


    # 6.2.6 Automatischer Rückmodus


    Standardmäßig arbeitet die Sitzungsverwaltung mit Cookies. Wie wir im Kapitel
    4 im Abschnitt »HTTP und Sessions» betont haben, sollte dies die vorgenommte Methode
    sein (sofern vom Client unterstützt), da dies das einfachste Verfahren ist, um
    die Session-ID zu verbreiten. Statt dessen können sich jedoch auch die GET/POST-Methode
    einsetzen, indem sie die Variable primär zur Verteilung der Session-ID eingesetzt
    werden. Die Variable `mode` definiert, welches Verfahren genutzt werden soll.
    Kann entweder cookie oder get gesetzt sein, wobei der Standardwert cookie ist.


    PHPLib bietet zur Laufzeit einen automatischen Rückmodus. Wenn die Variable `fallback_mode`
    auf gesetzt ist, wird der GET/POST-Modus versendet, sofern der vorgenommte Methode
    vom Client nicht unterstützt wird. In der Variablen `mode` ist (in der Regel)
    vom Client nicht unterstützt. Die sinnvollste Konstellation ist, `mode` auf cookie
    zu setzen und `fallback_mode` auf. Dem-sprechend versucht PHPLib, Cookies zu verwenden;
    wenn diese nicht unterstützt werden, „Fällt er zurück“ auf den GET/POST-Modus.
    Im Detail prüft PHPLib die Cookie-Unterstützung folgendermaßen:


    +   1. Bei der Abfrage einen von PHPLib gespeisten Seite wird versucht den Namen
    des Session-Cookies zu setzen, der nach der Klassen-instanz benannt ist.


    +   2. Anschließend wird der Benutzer auf der Seite mit der Session-ID, die als
    Abfragstring angehängt wurde, und den folgenden Programcode verwendet:


    ```

    header("Location: " . $_PROTOCOL . "://" . $_HTTP_HOST . \$this->self_url()());

    ```


    +   3. PHPLib prüft, ob sich die Session-ID im Array $_COOKIE_V befindet. Wenn
    ja, bleibt die Sitzung im Modus cookie. Wird die Session-ID nicht gefunden, unterstützt
    der Client keine und die Sitzung wird im GET-Modus umgeschaltet.'
