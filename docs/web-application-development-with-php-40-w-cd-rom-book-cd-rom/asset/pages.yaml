  md: '# Pearson Education Versionsverwaltung mit CVS ADDISON-LEY


    Sie können manuell die Option -b angeben, wenn Sie mit cvs add eine Datei hinzufügen,
    dies wird bald umständlich zu verwenden und einzuhalten. Es ist einfacher, CVS
    den Binärtyp in einigen Dateierweiterungen zu. Glücklicherweise lässt sich dies
    einfach mit der Verwaltungsdatei cvswrappers bereitstellen. In dieser Datei können
    Sie Aktionen definieren, die Dateien bei Rückübertragung und jedem Auslesen verändern.
    Sie ähnelt der Datei loginfo, die bei einer Rückübertragung aufgerufen wird, aber
    im Gegensatz zu den Anweisungen in der Datei loginfo Aktionen ausführt, welche
    die betreffende Datei ändern. Um Bild und Archiv als Binärcode zu behandeln, muss
    die Datei cvswrappers etwa aussehen:


    +   * gif -kb *.jp[e] -kb *.png *.gz *.kb -kb *.zip -kb


    Hierdurch wird automatisch angepasst: das -kb an alle CVS-Dateien angehängt, die
    auf den angebotenen Filter passt. Die Option -k verhindert, dass CVS Schlüsselwortwertung
    verwendet wird. Der Schalter -b macht eine Binärdatei und deaktiviert die Möglichkeit,
    Text-Diffs für diese Datei zu erstellen.


    Manchmal müssen Sie im Web mit externen Kommandozeilenwerkzeugen kommunizieren.
    Viele UNIX-Programme verwenden die Eingabe über die Standardeingabe und die Ergebnisse
    der Berechnung über die Standardausgabe, z.B. sort. Die einfachste Möglichkeit,
    Eingaben weiterzuleiten und Ausgaben aus dem Programm zu verfangen, bieten PHP-Streams.
    popen() öffnet eine eingeseitigte Pipe zu einem Programm, über Sie Daten an eine
    Standardeingabe übertragen können. Wie Sie bereits wussten, können popen() verwenden,
    um die Standardeingabe zu lesen, in welche das Standardaus des externen Programms
    schreibt. Ein einfaches Beispiel hierfür zeigt sich folgendmaßen:


    ```

    // Open writing pipe to the sort command

    fprint = popen("sort", "w");

    ```


    ```

    // Open stdin with PHP-Streams

    fprint = popen("php://stdin", "r");

    ```


    ```

    // Output some characters to sort

    puts(fprint, "a\n");

    puts(fprint, "c\n");

    puts(fprint, "b\n");

    ```


    ```

    // Close the pipe to sort - sort will now process the input

    // and write it to stdout

    pclose($fprint);

    ```


    ```

    // Sort''s stdout is for us - so read it until feof().

    while($c = fread($fprint, 1))

    ```'
