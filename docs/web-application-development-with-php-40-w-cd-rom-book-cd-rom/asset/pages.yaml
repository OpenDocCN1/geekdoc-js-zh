    Das Prinzip basiert auf Vertrauen. Vertrauen Sie niemals Variablen, die von Benutzern
    kommen. Dies gilt natürlich für alle Skripte, nicht nur für PHP. Das gilt auch
    in ASP als das Objekt FileSystem oder in Perl bei der Ausführung von benutzerdefinierten
    Befehle.


    # Belastete Variablen


    Wenn wir uns noch einmal wiederholen: Alle Daten, die aus dem Benutzerraum kommen,
    müssen als belastet, vertrauenswürdig, kontaminiert und potenziell ebenfalls betrachtet
    werden. In diesem Fall befindet sich das Vertrauensraum außerhalb des Programbereichs.
    In Bezug auf Vertrauen ist dies eine vertrauensgrenze. Eine vertraute Umgebung,
    das Internet ist nicht. Die Übergabe der Daten von Ihrem Programm zum Client braucht
    von besonderen Aufmerksamkeit, vorausgesetzt, dass das Programm Daten von zuverlässigen
    Systemen erhält. Das Daten-banksystem sollte das gleiche Vertrauen genießen wie
    das Programm selbst. Welche Vorkehrungen sind erforderlich, wenn Sie sicher wollen,
    dass die Daten von einem speziellen Ort empfangen werden oder der Client sich
    sicher kann, die Daten von einer speziellen Instanz (Ihr Server) zu erhalten.
    In einem normalen HTTP-Transfer können dies nicht garantiert. In diesem Fall Sie
    SSL oder eine gleichwertige Ver-schlüsselungsschicht verwenden.


    Bei der Lieferung von Daten von einer niedrigeren Sicherheitsebene zu einer höheren
    (wie beim Import von Benutzervariablen) ist große Sorgfalt erforderlich. Sie können
    nicht davon ausgehen, dass die gelieferten Daten irgendwel Anforderungen entsprechen
    – nicht einmal, wenn Sie die Daten zum Client liefern. Sie können beispielsweise
    auf der Client-Seite in einem HTML-Formular mit JavaScript überprüfen. Sie können
    nicht davon ausgehen, dass die Daten auf dem Server das erwartete Format haben,
    da der Benutzer JavaScript ausgeschaltet haben könnte oder Ein weiterer unbebeterter
    Fehler besteht darin, viele Daten zum Benutzer zu schicken und sich davon gehen,
    dass sie nicht geändert werden. Zum Beispiel könnte eine Konto-daten für einen
    Benutzer anzeigen, die mit einer Abfragefolge wie script.php?user_id=1 aufgerufen
    werden, nachdem sich der Benutzer ange-meldet hat. Was hält den Benutzer davon
    ab, die Variable user id in etwas anderes als 1 umzuwandeln und die Daten eines
    anderen zu bearbeiten?'
