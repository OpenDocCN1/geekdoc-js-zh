    – auch solcher können irren. Mit einem zweiten professionellen Blick über wichtigen
    Teilen eines Programms erhalten Sie die Doppelkontrolle.


    Leider ist es sehr schwierig, qualifiziertes und zues Personal mit Kenntnissen
    in Programmsicherheit zu finden. Dieses Thema wird zunehmend an den Universitäten
    gelehrt, aber die beste Ausbildung kann fehlende Praiserfahrung nicht ersetzen.
    Dies gilt für alle Berufe im Bereich der Computer- und Sicherheit. Diese Schwierigkeiten
    lassen sich überwinden, indem Sie Ihre Soft-'
