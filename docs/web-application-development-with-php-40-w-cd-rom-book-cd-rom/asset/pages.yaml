  md: '# 8.2.4 Technologieüberlegungen


    Six empfiehlt in vielen Situationen die Verwendung von PHP, und verwendet es selbst
    für die meisten Anwendungen, einschließlich SixCMS. Besonders für layoutorientierte
    Websites mit geringem oder mittlerem Datenverkehr, in Situationen, denen eine
    Anwendung schnell von Grund auf erstellt werden muss, bietet PHP eine ex Plattform.
    Natürlich hängt alles vom Umfang des Projekts ab. Bei je jedem größeren Projekt
    oder auf großen Websites mit extrem vielen Aktivitäten, kann PHP ein Problem darstellen,
    insbesondere wenn die Laufzeit des Skripts begrenzt wird. Wenn Leistungssteigerungen
    in Bezug auf die Belastung des Systems durch PHP auftauchen, sollten Caching und
    Vorverarbeitung von Programmcode eingeführt werden, um statische Seiten zu erzeugen.
    Ganz allgemein (dies hängt von einer Reihe von Faktoren ab) empfiehlt es sich,
    statische Seiten zu erzeugen, wenn eine Website bis 500.000 dynamische Seitenseiten
    pro Monat hat, bis zu fünfhundert gleichzeitig für eine Seite.


    In bestimmten Situationen verwendete sich Mod_Perl, aber die Serverfiguration
    und der Bedarf an Kernelung rücken diese Methode immer mehr in den Vordergrund.
    PHP ist sehr durchdacht und bleibt seit seiner Einführung verwendet. Daher hat
    er ein konsistentes Sprachmodell und eine einfache Syntax. Da Mod_Perl aber auskompiliert
    und im Speicher bleibt, kann eine Website von unterschiedlichen Komponenten erzeugt
    werden, die ihre eigenen Speicher haben und unabhängig voneinander kompiliert
    werden können. Mit Mod_Perl können Sie sich sehr schöne Ergänzung für PHP und
    andere Skriptsprachen, zur Implementierung von Proxies, für spezifische Sprachregeln
    und Posttransaktionsroutinen u.a. Des Weiteren ist Java auf der Server- und Clientseite
    getestet. Obwohl es Java auf der Leistung und die Kompatibilität einige Probleme
    gibt, scheint das serverseitige Java für bestimmte Aufgaben weniger ansprechend.
    Im Vergleich zu anderen Technologien, wie Mod_Perl, Cold Fusion und ASP, ist PHP
    im Allgemeinen günstig, bietet eine hohe Leistung, integriert sich gut in andere
    Technologien und arbeitet dem Apache-Server sehr stabil. Gibt es auch Probleme?
    Im Grunde ist die PHP-Plattform recht gut. Entwickler sollten jedoch die Grenzen
    kennen und die manchmal vorkommenden leichten Änderungen in der Programmiersprache
    oder den Funktionsaufrufen verschiedener Versionen beachten. Zusätzlich entstehen
    Probleme, die die Speicherbehandlung, insbesondere bei Zeichenketten die mehrere
    Megabytes des Serverspeichers belegen (ein Problem, das sich PHP 4.0 hoffentlich
    annimmt), das schlechte Oracle-Integration, berücksichtigt weitere. Defizite,
    welche die Six-Entwickler notieren, die fehlende Konsistenz der Sprachersprache
    und das Design sowie implizite Typwandlung.'
