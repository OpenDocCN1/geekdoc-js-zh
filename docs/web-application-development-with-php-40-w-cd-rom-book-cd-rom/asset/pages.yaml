    # # 6.3 Authentisierung


    Im Abschnitt »Authentifizierung» in Kapitel 4 haben wir erwähnt, dass die HTTP-Authentifizierung
    einige Nachteile hat und Sie mit der PHP-basierten Authentisierung umgehen können.
    In den folgenden Abschnitten gehen wir hierauf ausführlich ein.


    # ## 6.3.1 Vorteile der PHP-Genehmigung


    Dieser Abschnitt zeigt an, wo wir den Abschnitt »Authentifizierung» des Kapitel
    4 verlassen haben. Dort erläutern wir, dass die HTTP-Authentifizierung einige
    Nachteile hat und wie Sie mit der PHP-basierten Authentisierung umgehen können.
    PHLib hat Klassen zur besseren Handhabung der Benutzer-Authentisierung und Verwaltung
    von Zugriffs.


    PHLib erlebt Authentisierungen für Sessions; dies hängt von der Klasse Session
    ab. Auf denjenigen Seiten, auf denen Sie eine Authentisierung benötigen, sollte
    folgende page_open() aufgerufen werden, um eine Instanz einer Session und eine
    Authentisierung zu erzeugen.


    ```

    page_open(array("ses" => "Session_Example", "auth" => "Auth_Example"));));

    ```


    Sessions als Basis für die Authentisierung heranzuziehen, bringt eine Reihe von
    Vorteilen:


    +   * Der Benutzer und das Authentisierungselement nur einmal, und zwar bei der
    Anmeldung. Sobald er authentisiert ist, speichert der Server die Authentisierungsdaten
    in der Session und überträgt den Benutzernamen oder das Authentisierungselement
    kein weiteres mal. Hier unterscheidet sich PHP von HTTP, bei der der Benutzername
    und das Passwort in den HTTP-Headern bei allen Abfragen übertragen werden.'
