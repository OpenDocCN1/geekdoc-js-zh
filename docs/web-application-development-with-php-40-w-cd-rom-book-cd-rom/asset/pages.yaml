    \ PGP 6.5.1\n\nDie Klasse ppg die PGP-Binärwerte Ihres Systems mit den entsprechenden\
    \ Argumenten aufrufen, brauchen Sie ein richtig konfiguriertes PGP-System. Insbesondere\
    \ muss Ihr Schlüssel richtig eingestellt sein, und alle öffentlichen Schlüssel,\
    \ die Sie eine Verschlüsselung vornehmen wollen, müssen in Ihrem lokalen «Schlüsselbund»\
