  md: '# 9 Erweiterung von PHP 4.0: Knacken den PHP-Kern


    Dritte ziehen möglicherweise in Betracht, das Tag extension in php.ini zu nutzen,
    um in PHP zusätzliche externe Module zu erzeugen. Diese externen Module werden
    vollständig vom Hauptpaket abgetrennt, was in kommerziellen Umgebungen praktisch
    ist. Damit kann kommerzielle Distributionen auf Disket oder Archive verschieben,
    die nur die zusätzlichen Module enthalten, und müssen sich nicht damit befassen,
    statische und sich geschlossene PHP-Binärdateien zu erzeugen, die verhindern,
    dass andere Module an sich binden.


    # 9.3.2 Eingebaute Module


    Eingebaute Module werden direkt in PHP übersetzt und mit jedem PHP-Prozess mitgeführt.
    Ihre Funktionalität ist für jedes Skript, das ausgeführt wird, sofort verfügbar.
    Genau wie externe Module haben eingebaute Vor- und Nachteile, wie die folgende
    Tabelle beschreibt:


    | Vorteile | Nachteile |

    | Das Modul muss nicht speziell geladen werden, die Funktionalität ist sofort
    verfügbar. | Bei Änderungen von eingebauten Modulen ist ein Neukompilieren von
    PHP erforderlich. |

    | Es gibt keine externen Dateien, welche die Festplatte füllen, alles wird in
    PHP-Binärdateien abgelegt. | Die PHP-Binärdateien wachsen und benötigen zunehmend
    Speicher. |


    Eingebaute Module eignen sich daher, wenn Sie eine robuste Bibliothek mit Funktionen
    verwenden, die relativ unverändert bleibt, die eine mehr als durchschnittliche
    Leistung erfordert oder häufig von vielen Skripten auf Ihrer Website verwendet
    werden. Die Notwendigkeit, PHP neu zu kompilieren, wird schnell durch den Gewinn
    an Geschwindigkeit und seinen Benutzerfreundlichkeit gewichtet. Eingebaute Module
    sind jedoch nicht ideal, wenn Sie rasch zusätzliche entwickeln möchten.


    # 9.3.3 Die Zend Engine


    Natürlich können Erweiterungen direkt in der Zend Engine realisiert werden. Diese
    Strategie ist geeignet, wenn Sie eine Änderung im Sprachverhalten benötigen, die
    direkt im Sprachkern integriert sind. Im Allgemeinen sollten Modifikationen an
    der Zend Engine jedoch vermieden werden. Änderungen führen zu Inkompatibilitäten
    mit anderen Programmen – und es wird kaum jemand Anpassungen an eine speziell
    zusammengestellte Zend Engine vornehmen. Da Modifikationen stets direkt im PHP-Quellecode
    durchgeführt werden, werden überschie'
