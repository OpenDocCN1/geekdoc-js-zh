  md: 'vom Hauptsystem arbeitet. Mit einer Schnittstelle erhalten Sie die voll-ständige
    Kontrolle über alle Daten und Benutzer des Programms. Für das Chat-Programm bedeutet
    dies, dass wir Benutzer hinauswerfen, nachrichten verschärfen und Chat-Räume schließen.


    > > **Hinweis:** Der Programmcode auf der CD-ROM enthält nicht alle hier auf-geführten
    Funktionen. Das Basisverwaltungssystem ist komplett und vollständig funktionsfähig.
    Wir möchten, dass Sie die Codebasis um die Funktionen erweitern, die für Sie passen.
    Wenn Sie keine größeren Erweiterungen für umfangreiche Programme geschrieben haben,
    empfehlen wir Ihnen, diese Erfahrung noch einmal nachzuholen.


    Die Frage für unser Chat-Programm lautet: Was können wir die Verwaltung ein? Folgende
    Möglichkeiten stehen uns zur Verfügung:


    +   - Auf der Netzwerke: Wir könnten die Benutzer filtern, die eine Verbindung
    zum Server erstellen.

    - Auf der PHP-Ebene: Wir könnten verhindern, dass sich Benutzer für den Chat anmelden.

    - Auf der Datenbankene: Wir könnten Nachrichten von Benutzern aus der Datenbank
    verwerfen.

    - Auf der IRC-Ebene: Wir könnten die IRC-eigenen Netzwerkverwaltungs-funktionen
    verwenden.


    # 3.6.1 Auf der Netzwerkebene


    Die Sicherung auf Netzwerkebene lässt uns nur zwei Möglichkeiten: Entwe-der wir
    lassen eine Verbindung oder nicht. Hierfür können wir eine Fire-wall verwenden
    oder andere Möglichkeiten der IP-Maskierung nutzen. Diese Methode ist begrenzt,
    kompliziert, unsicher und im Allgemeinen nicht das, was wir wollten.


    # 3.6.2 Auf der PHP/Webserver-Ebene


    Bei der Sicherung auf Webserver-Ebene werden Verbindungen zum Server prinzipiell
    zugelassen, aber die Anmeldung der Clients wird durch ein Passwort (oder andere
    Berechtigungsverfahren). Genaue-nommen läuft es wieder darauf hinaus, eine Verbindung
    zuzulassen oder nicht – was wirklich befriedigend ist.


    Dieses Verfahren kann jedoch durch Emulation von Benutzerverboten ver-den werden.
    Die für IRC üblichen Verbote, nämlich K-Verbindungen und G-Verbindungen (lokale
    und globale Benutzerverbote), können bei einem'
