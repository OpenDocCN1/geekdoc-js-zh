  md: '# Array-Funktionen


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_72_0.png)


    Abbildung 2.6: Verwendung von each() in Verbindung mit reset().


    Zwischen den beiden Schleifen wurde ein Aufruf von each() eingefügt. Die zweite
    Verwendung von each() beginnt mit Lesen des Schlüssels/Wert-Pairs aus dem ersten
    Element.


    Neben reset() gibt es eine Reihe Funktionen, die Aktivität von each() aufzuteilen:
    next(), prev() und current(). Mithilfe dieser Funktion können sie ein Array manuell
    in beide Richtungen bearbeiten. next() gibt das aktuelle Element zurück und setzt
    das Gleiche mit den internen Array-Zeiger auf den nächsten Wert; prev() tut das
    Gleiche, aber setzt den Array-Zeiger auf den vorhergehenden Wert. current() gibt
    nur das Array-Element zurück, auf welchem der Zeiger gerade steht. Diese Funktionen
    geben jeweils false zurück, wenn sie auf ein leeres oder nicht zugeordnetes Element
    landen. Es gibt keine Möglichkeit, diese Fälle zu unterscheiden. Daher sollten
    diese Funktionen nicht verwendet werden, wenn each() nicht verfügbar ist und die
    Möglichkeit, auf ein nicht-zugeordnetes Element zu zugreifen, ausgeschlossen wird.


    Neben den oben beschriebenen Funktionen befassen sich noch eine Reihe weiterer
    PHP-Funktionen mit Arrays. Eine ausführliche Beschreibung finden Sie im Benutzerhandbuch.
    PHP 4.0 hat eine Vielzahl Array-Funktionen. Auf alle einzelne Funktion einzugehen,
    würde wir hier zu weit vom eigentlichen Thema abbringen.'
