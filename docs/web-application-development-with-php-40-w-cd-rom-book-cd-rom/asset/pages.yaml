    Ansatz, welche Anweisungsblöcke dynamisch zu generieren und gleichzeitig die algorithmische
    Struktur beizubehalten. Dieses Verfahren erforderte manchmal sehr anspruchsvollen
    Programcode, war aber auch effektiv. Da diese Methode führte, dass der Bytecode
    geändert wurde, wurden Signaturen für die einzelnen Infektionen desselben Virus
    erstellt, so dass es für Antivirus-Programme nahezu unmöglich war, sie zu entdecken,
