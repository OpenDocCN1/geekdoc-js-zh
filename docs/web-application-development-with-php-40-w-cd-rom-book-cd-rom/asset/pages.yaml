  md: "```\n</struct>\n</data>\n</wddxPacket>\n```\n\nListing 7.6: Beispiel für ein\
    \ WDDX-Paket\n\n# 7.3.6 PHP und WDDX\n\nDa WDDX zur Darstellung der Datenstrukturen\
    \ XML verwendet, müssen PHP sowohl mit XML als mit WDDX kompilieren, um es zu\
    \ verwenden. Danach stehen Ihnen folgende Funktionen zur Verfügung:\n\n+   * wddx_serialize_value()\n\
    * wddx_serialize_vars()\n* wddx_packet_start()\n* wddx_add_var()\n* wddx_packet_end()\n\
    * wddx_deserialize()\n\nMitilfe dieser Funktionen können PHP-Variablen in WDDX-Pakete\
    \ serialisieren und die WDDX-Pakete deserialisieren.\n\n# 7.3.7 Die WDDX-Funktionen\n\
    \nDie WDDX-Funktionen bieten Ihnen drei Möglichkeiten, ein Paket zu konstruieren.\
    \ Die einfachste Methode ist die Verwendung von wddx_serialize_value(). Diese\
    \ Funktion besitzt eine Variable und einen optionalen Kommentar, und erzeugt hieraus\
    \ ein WDDX-Paket:\n\n```\n$var = \"This is a string\";\nprint(wddx_serialize_value($var,\
    \ \"This is a comment.\"));\n```\n\nDas ist alles schon. Dieser Programmabschnitt\
    \ gibt das folgende WDDX-Paket aus.\n\n```\n<wddxPacket version='1.0\">\n<header>\n\
    \  <comment>This is a comment.</comment>\n</header>\n<data>\n  <string>This is\
    \ a string.</string>\n</data>\n</wddxPacket>\n```\n\n> Hinweis: Zur Lesbarkeit\
    \ wurde dieses Paket manuell bearbeitet. Das von PHP erzeugte Paket enthält keine\
    \ Leerräume und Einzüge."
  merge: -1
  pgno: 344
