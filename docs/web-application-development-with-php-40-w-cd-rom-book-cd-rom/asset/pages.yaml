  md: '# 7 Anwendungen der Spitzentechnologie


    Auf der Zend-Website wird PHPLib bereits verwendet. Daher soll das System PHPLib
    für die Session-Verwaltung, den Datenbankzugriff und Schablon verwenden. Durch
    Trennung von Code und Layout soll die PHPLib-Klasse Template verwendet werden.
    Außerdem sollte das System eine saubere API haben, die es später Zend Technologies
    von verschiedenen Entwicklern lernt.


    Gewöhnlich liefert der Kunde keinen detaillierten Anforderungskatalog. Häufig
    wissen Kunden nicht, wie sich ihre geschäftlichen Anforderungen in der Software
    realisieren lassen. Der Kunde ist keiner der Softwareentwicklung, jedoch kennt
    das Problemfeld. Während der ersten Besprechungen mit dem Systemanalytiker kann
    aus dem Problemfeld einen Anforderungskatalog erstellen. «Wozu soll die Anwendung
    für den Nutzer?» sind typische Fragen für diese Phase. Es ist die Aufgabe des
    Analytiker, Kunden zu helfen, die Probleme so zu formulieren, dass sie sich in
    Softwarelösungen umsetzen lassen. Während der Analyse lernt der Analytiker konkret
    und dokumentierte Begriffe fassen.


    # 7.1.2 Spezifikation


    Der Anforderungskatalog vermittelt ein allgemeines Verständnis für das Problem.
    Solbald Sie dieses haben, sollten Sie Richtlinien für das zu entwickelende Programm
    auf, d.h. eine Spezifikation schreiben. Dazu müssen Sie zunächst herausfinden,
    welche Datenstrukturen Sie benötigen.


    Versuchen Sie, das komplexe Problem in kleinere Einheiten zu teilen. Wenn Sie
    Anforderungskatalog und das Problemfeld analysieren, stellen Sie fest, dass es
    drei wichtige Strukturen und der Rest der Anwendung aufbaut. Die wichtigste Struktur
    bildet der Eintrag in der Datenbank. Was ist ein Eintrag? Aus dem Anforderungskatalog
    wissen wir, dass ein Eintrag Eigenschaften zugeordnet wird: Titel, Hauptteil,
    Kategorie, Beurteilung und Protokolle. Da wir bereits viele Probleme gelöst haben,
    haben wir ein klares Muster in dieser Datenstruktur: Es handelt sich um einen
    einfachen Behälter. Wir wissen aber auch, dass wir eine Methode brauchen, um auf
    diesen Behälter zu referenzieren. Unser Erfahrung ist nicht sehr wichtig und kann
    einen wirklich gut Programmierer von einem mittelmäßigen unterscheiden. Das schwierigste
    Problem lässt sich leicht lösen, wenn Sie früher schon einmal gesehen haben.


    Eine Datenstruktur für die Kategorie zu generieren, geschieht nach denselben Prinzipien,
    wobei wir anänglich nur wissen, dass dieser Struktur die Eigenschaft »Name» zugeordnet
    wird. Soll laut Anforderungskatalog brauchen'
