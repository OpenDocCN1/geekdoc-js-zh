  md: "# 9.10.1 Modulstruktur\n\nAlle PHP-Module haben denselben Aufbau:\n\n+   -\
    \ eingebundene Headerdatei (zur Integration aller notwendigen Makros, API-Definitionen\
    \ usw)\n- C-Declaration der exportierten Funktionen (zur Deklaration des Funktionsblocks)\n\
    - Deklaration des Zend-Funktionsblock\n- Deklaration des Zend-Modulblocks\n- Einbindung\
    \ von get_module()\n- Einbindung aller exportierten Funktionen\n\n# 9.10.2 Einbindung\
    \ der Headerdatei\n\nDie einzige Headerdatei, die Sie für Ihre Module einbinden\
    \ müssen, ist php.h, die im PHP-Verzeichnis abgelegt ist. Diese Datei macht alle\
    \ Makros und API-Definitionen, die Sie zum Generieren neuer Module benötigen,\
    \ für Ihren Code verfügbar.\n\n> Tipp: Es ist empfeenswert, eine separate Headerdatei\
    \ für Ihr Mod zu erstellen, welche die modulspezifischen Funktionen enthält. Die\
    \ Headerdatei sollte alle Deklarationen für exportierte Funktionen wie php.h enthalten.\n\
    \n# 9.10.3 Deklaration exportierter Funktionen\n\nUm Funktionen zu deklieren,\
    \ die exportiert werden sollen (d.h. für PHP als neue Funktionen verfügbar machen),\
    \ bietet Zend eine Reihe von Makros. Eine Deklaration sieht z.B. folgendermaßen\
    \ aus:\n\n```\nZEND_FUNCTION(my_function);\n```\n\nZEND_FUNCTION deklärt eine\
    \ neue C-Function, die mit der internen API von PHP übereinstimmt. Das bedeutet,\
    \ dass die Funktion den Typ void hat als Parameter INTERNAL_FUNCTION_PARAMETERS\
    \ (ein weiteres Makro) akzeptiert. Zusätzlich wird dem Funktionsnamen das Präfix\
    \ zend_if vorangestellt. Die die sofort expandierte Version der bereits definierten\
    \ Funktion sieht folgendermaßen aus:\n\n```\nvoid zend_if_my_function(INTERNAL_FUNCTION_PARAMETERS);\n\
    ```\n\nDie Erweiterung von INTERNAL_FUNCTION_PARAMETERS führt zu folgend Ergebnis:\n\
    \n```\nvoid zend_if_my_function(int ht, zval *return_value,\n\tzval *this_ptr,\
    \ int return_value_used,\n\tzend_executor_globals *executor_globals);\n```"
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Pearson Education


    # ADDISON-WESLEY


    # Einblick in die Quellen


    Der Interpreter und Executor-Kern vom PHP-Hauptpaket abgetrennt wurde, hat eine
    zweite API entwickelt, welche Makros und Funktionssätze definiert: die Zend-API.
    Da die Zend-API inzwischen die Aufgaben übernommen hat, die zu PHP gehörten, viele
    PHP-Funktionen auf Makros reduziert, die einfachen Aufrufen von Funktionen der
    Zend-API bestehen. Die empfohlenen Pfade sind, die Zend-API immer möglich zu verwenden,
    da die alte API nur aus Kompatibilitätsgründen bleibt. So sind z. B. die Typen
    zval und pral identisch. was die Zend-Definition, während die alte PHP-Definition
    (genau genommen) als für zval). Da das Makro INTERNAL FUNCTION_PARAMETERS ein
    Zend-Makro ist, enthält dies die Deklaration zval. Wenn Sie PHPcode schreiben,
    sollten Sie stets zval verwenden, um der neuen Zend-API zu entsprechen.


    Die Parameterliste ist wichtig. Welche die Parameter (siehe Tabelle 9.1 für die
    Beschreibungen).


    | Parameter | Beschreibung |

    | --- | --- |

    | ht | Anzahl der Argumente, die an die Zend-Funktion übergeben werden. Sie sollten
    ihn nicht direkt benutzen, sondern dann Zend_NUM_ARGS verwenden, um den Wert zu
    erhalten. |

    | return_value | Diese Variable wird verwendet, um von der Funktion zurückgebene
    Werte an PHP zurückzugeben. Der Zugriff auf diese Variable erreichen Sie am besten
    über die definierten Makros. Eine Beschreibung der vordefinierten Makros finden
    Sie weiter unten. |

    | this_ptr | Mit dieser Variable können Sie auf das Objekt zugreifen, dem die
    Funktion dient, sofern sie in einem Objekt verwendet wird. Verwenden Sie die Funktion
    get() um den Zeiger zu erhalten. |

    | return_value_used | Dieser Flag gibt an, ob ein Ausgewicht der Funktion tatsächlich
    vom aufrufenden Skript verwendet wird. 0 gibt an, dass der Anrufer einen Rückgabewert
    erwartet. Sie können diesen Flag prüfen, um zu überprüfen, ob die Funktion korrekt
    verwendet wurde oder ob die Geschwindigkeit zu optimieren, wenn die Rückgabe eines
    Wertes erforderlich ist (als Beispiel sehen Sie sich an, array.c enthalten). |

    | executor_globals | Diese Variable zeigt auf die globale Einstellung der Zend-Engine.
    Sie ist beispielsweise zur Erzeugung neuer Variablen nützlich (mehr dazu später).
    Die globalen Variablen des Executors können über das Makro ELS_FETCH() in ihre
    Funktionen integriert werden.|


    Tab. 9.1: Zend-Parameter für Funktionen, die mit PHP aufgerufen werden


    385'
  merge: -1
