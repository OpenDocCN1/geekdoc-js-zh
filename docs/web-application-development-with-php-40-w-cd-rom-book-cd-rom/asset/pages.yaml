  md: '# Pearson Education


    # 4 Webanwendungskonzepte


    Wenn Sie cache_limiter auf private setzen, können die Seiten zwar von Browsern,
    nicht von Proxy oder anderen Gateway-Programmen geachtet werden. Betrachten Sie
    den Unterschied bei Anweisung proxy-revalidate. In letzter Fall merkt sich der
    Proxy den Inhalt der Seite und stellt diese wieder, anstatt sie vollständig aufzurufen.
    Der generierte HTTP-Kopf sieht etwa aus:


    ```

    Expires: Thu, 19 Nov 1981 08:52:00 GMT

    Cache-Control: private, max-age=10800

    Last-Modified: Thu, 03 Feb 2000 15:56:11 GMT

    ```


    Der letzte Wert ermöglicht sowohl den Client als auch Proxy die Cache-Option public
    vollständiges Caching. Wer jedoch mit Vorsicht. Mit dieser Einstellung könnten
    anderen Benutzern unzugänglich den Zugriff auf Proxys haben.


    Bei der offenslichen Variante wird der PHP-Konfigurationsbefehl cache_expire betrachtet.
    Dies gibt an, wie viele Sekunden der Cache abläuft. Die dadurch erzeugten Köpfe
    sehen etwa aus:


    ```

    Expires: Thu, 03 Feb 2000 18:56:11 GMT

    Cache-Control: public, max-age=10800

    Last-Modified: Thu, 03 Feb 2000 15:56:11 GMT

    ```


    # PHP 3.0-Sitzungen


    Da sich die Anwenderprogrammierschnittstelle für einfach und intuitiv entwickeln
    lässt, wollten wir dies für PHP 3.0 realisieren. Eine konsistente Sitzungsschnittstelle
    für beide Versionen wäre großartig, dachten wir. Für einige kleinere Projekte
    möchten man einfach PHPlib verwenden. Deshalb schauen wir uns sessions.c näher
    an und portieren einige Interna, wie der Algorithmus für die Generierung der Sitzungsnummer,
    behielten wir nicht bei, aber wir versuchen, die API zu 100% kompatibel zu PHP
    4.0 zu machen. Es gibt jedoch einigeliche Beschränkungen. Wenn Sie die dokumentierten
    Unterschiede im Headerkopf behalten, sollen Sie eigentlich mit der Bibliothek
    bis als hoc-Ersatz der PHP 4.0-Sitzungsfunktionen zurekommen. Den vollständigen
    Quellcode finden Sie auf der CD-ROM.


    Unser Experiment hilft Ihnen eventuell auch, die Funktionsweise der internen Sitzungsbibliothek
    von PHP besser zu verstehen. Die Funktion session_start() spiegelt beispielsweise
    die ursprüngliche C-Function genau wieder.'
