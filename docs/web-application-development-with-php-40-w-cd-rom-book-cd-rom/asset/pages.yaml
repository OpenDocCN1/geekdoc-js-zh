  md: '# 2 Erweiterte Syntax


    Die Welt wurde aus der Leere gebildet,

    wie Utensilien aus einem Holzblock.

    Der Herr kennt die Utensilien,

    hält sich jeden an den Block:

    damit kann er alle Dinge benutzen.


    Wie Kapitel 1 erwähnt, glauben wir, dass wir zur eigentlichen Beherrschung einer
    Programmiersprache nicht nur den Syntax und Semantik verstehen müssen, sondern
    auch ihre Philosophie, den Hintergrund und die Hauptmerkmale der Struktur. Ein
    PHP zu meistern, müssen Sie auch alle seine Eigenheiten kennen.


    # 2.1 PHP-Syntax


    PHP ist eine Mischung aus verschiedenen Sprachen. Sie können einen starken Einfluss
    von Java erkennen (einige sagen Java, aber Java ist aus C entstanden). Während
    die Syntax von PHP durch C beeinflusst ist, unterscheidet sich die PHP-Syntax
    von der C sehr stark. PHP wird interpretiert und hat keine Variablentypen. Wenn
    Sie eine Variable referenzieren, wird ihr Typ im „Vorzugeben“ ermittelt und so
    behandelt, wie es die gegenwärtige Situation erfordert. Dies ist zwar eine etwas
    vereinfachte Erklärung. Sie müssen sich während der Entwicklung im Hinterkopf
    behalten.


    PHP ist eine interpretative Sprache, in welcher der Programmcode ausgeführt und
    Schritt für Schritt ausgeführt wird. Zusammen mit der Art und Weise, wie PHP Variablen
    verwaltet, erhalten sich vielfältige Möglichkeiten für die Programmierung, jedoch
    auch eine Menge Fallen. Dieses Kapitel befasst sich mit den typischen Dingen,
