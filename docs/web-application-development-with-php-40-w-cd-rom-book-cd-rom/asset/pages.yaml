  md: '# 2 Erweiterte Syntax


    ```

    11111111111111111111

    10000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    100000000000000000001

    11111111111111111111

    ```


    Mit einem wenig Vorstellungskraft sehen wir ein Rechteck aus Nullen mit einem
    Rand außen. Wenn Sie dies in einer Datei wie »vorliegend» übertragen wollten,
    benötigen Sie Sie 20 x 10 = 200 Elemente (20 Spalten mit 10 Zeilen). Wir gehen
    an dieser Stelle einmal davon aus, bis ein Element mindestens eins ist. Dabei
    lässt sich eine einfache Komprimierung bereits durch Packen dieser Daten in diesem
    Bereich erreicht werden.


    Was hier zeigt, dass die Speicherung der Daten wie vorliegend nicht unbedingt
    sinnvoll ist. Wenn Sie das jedem zum Niederschreiben diktieren, würde es sich
    nicht als »Eins Eins Eins Eins Eins Eins Null Null Null Null [...] Eins Eins Eins
    Eins Eins Eins [......]« vorlesen, sondern würde der Schreiber »zwanzig Einsen,
    eine weitere Eins, achthn Nullen,...» diktieren.


    Das Gleiche ist der RLE-Algorithmus, der die aufeinanderfolgenden Elemente gleichen
    Werten zählt und sie anschließend als »Zähler/Wert»-Paar absichert. Nach der Komprimierung
    könnten die folgenden Daten dann folgendermaßen aussehen:


    21, 1, 18, 0, 2, 1, 18, 0, [...], 18, 0, 21


    Das erste Element stellt den Zähler an, während das zweite Element das Datenelement
    dar. Um dies zu dekomprimieren, müssen Sie lediglich den Zähler lesen und das
    folgende Datenelement so häufig angeben, wie der Zähler sagt. Mit diesem »Trick»
    reduzieren wir die Anzahl der benötigten Elemente von 200 auf 34.


    Das Problem bei diesem Algorithmus ist, dass er bei vielen verschiedenen Elementen
    in einer Zeile mehr als ursprüngliche Eingabedaten erzeugt. Da Speicher viele
    Elemente, die einen Datenzähler von haben, wird dieser Algorithmus schnell ineffektiv.


    Diese Schwäche lässt sich mit einem kleinen Trick, der sogenannten »Zählerschwelle«,
    umgehen. Jeder Datentyp hat einen spezifischen Zählerbereich: Im öblichen Fall
    überschreitet der Wert beispielsweise niemals 21. In Genauenm Fall waren die häufigsten
    Werte 18 und 2. Wenn wir den Zähler nur auf einen Bereich von 1 bis 31 beschränken,
    können wir auch »reine» Zahlen einfügen, die keine Komprimierung im Eingabebereich
    benötigen. Der Kompres'
