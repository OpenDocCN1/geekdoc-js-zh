- img_proc: true
  md: 'Dies bedeutet jedoch, dass Sie die Authentifizierung verlieren, sobald die
    Session verloren geht.


    +   - Der Authentifizierungsprozess auf dem Server kann kompliziert sein. Er kann
    über eine Datenbank oder einen beliebigen anderen Mechanismus ausgeführt werden.
    Die Authentifizierung wird über eine nicht definierte Funktion der Klasse Auth
    `auth_validate()`, und die Implementierung obliegt ihnen.


    +   - Die Authentifizierung ist nicht auf das Verzeichnis beschränkt, sondern
    für einzelne Teile der Anwendung verschieden sein. Sie können sogar in einem Skript
    verschiedene Authentifizierungsebenen realisieren. Sie können einige Teile des
    Skripts bei Benutzern verbergen, die nicht berechtigt sind.


    +   - Benutzer, der dem System nicht gehören, können sich für die Registrierung
    lassen. Ein Registrierungsformular wird eingeblendet, und PHPLib erstellt automatisch
    einen Standarddatintrag in der Benutzerbank.


    +   - Die Authentifizierung über PHPLib funktioniert mit der CGI-Version von PHP.


    +   - Sie können Benutzer abmelden. Das bedeutet, der Benutzer erhält die Möglichkeit,
    die aktuelle Session zu beenden (über die entsprechende Schaltfläche).


    +   - Benutzer können nach einer gewissen Lernlaufzeit automatisch abemeldet werden.
    Damit bekommt ihre Anwendung eine zusätzliche Sicherheit, da diese Funktion das
    Kapern von Nutzungen nach längerer Lernlaufzeit verhindert.


