    # Wofür wird XML verwendet?


    Als Auszeichnungsprache für strukturierte Informationen wird XML in Content Management-Systemen,
    Archivierungsprogrammen und Firmen-Dokumentarien eingesetzt. Es gibt jedoch eine
    Vielzahl von XML-Anwendungen und Transferprotokolle. Aufgrund der Offenheit dieses
    Standards entstanden in kurzer Zeit DTDs.


    # 7.2.2 DocBook


    Die beliebte DocBook-XDTD besteht aus einer Reihe von Tags für Beschreibung von
    Büchern, Artikeln und anderen Prosaisedokumenten, insbesondere technischen Dokumentationen.
    Sie wurde ursprünglich 1999 von O''Reilly als SGML-DTD für den eigenen Zweck entwickelt
    und erlang schnell Beliebtheit bei Autoren, da sie sich auch in anderen Verhältnissen
    einsetzen konnte. O''Reilly unterstützt dies, indem sie die DTD für weitere Entwicklung
    an die Davenport-Gruppe übergab. Mitte 1998 übernahm OASIS (Organization for the
    Advance of Structured Information Standards) offiziell die Pflege von DocBook.
    Als XML zunehmend populärer wurde, schrieb Norman Walsh die offizielle XML-Version
    (3.1). Dieser gab sich Bemühungen, dies eine offizielle Version umzuwandeln. Wahrscheinlich
    kommt DocBook 5 sowohl als SGML- als auch XML-Version heraus.


    Als wir begonnen, dieses Buch zu schreiben, stand für uns fest, dass wir ein off
    Format wie XML verwenden wollen. Wir entschieden uns für die DocBook-DTD, da sie
    alle Funktionen bietet, die wir brauchen. Hier sind alle Elemente, die typischerweise
    in technischen Dokumentationen betont werden, und selbst einige esoterische Elemente
    sind vorhanden – oder haben sich Jena im Textverarbeitungsprogramm an Element
    MouseButton gesehen (aus der Kursreferenz: die konventionelle Name einer Maustaste)?


    XML und DocBook bieten einige klare Vorteile für uns. Wir können CVS zur Versionskontrolle
    sowohl für die PHP-Beispiele als auch einfach für die Buchdatei verwenden. Die
    Umwandlung nach HTML ist einfach. Sie lässt sich mit PHP'
