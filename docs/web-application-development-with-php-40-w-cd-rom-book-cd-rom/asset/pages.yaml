  md: '# Danksagungen


    Ein großes Dankeschön gilt den Mitarbeitern von New Riders. Sie hatten es wahrscheinlich
    sehr schwer mit uns, und wir möchten uns wirklich für Ihre Freundlichkeit und
    Professionalität bedanken. An Robin Blake, Unserer Herausforderung besonderen
    Dank für ihre Geduld mit uns. Außerdem bedanken wir uns bei unserem technischen
    Berater Graeme Merral und unserer Herstellerin Ann Quinn.


    Die folgenden Leute haben uns in den verschiedenen Phasen der Buchstellerung geholfen.
    Auch bei ihnen möchten wir uns bedanken: Alan Bower, Nancy Maragilio, Jakob Nielsen,
    Kristian Koelhoptn, Zeev Suraski, Andi Guttmans, Leo Atkinson, Alexander Bauch,
    Uwe Steinmann, Za Yahab und Rafi Ton. Ebenso bei den Verfassern Fallstudien. Letztendlich
    bedanken wir uns bei SoftQuad für die Bereitstellung eines hervorragenden XML-Editors,
    mit dem wir den Text erstellen und bearbeiten konnten.


    # Danksagungen von Tobias


    Die Person, welche der größte Aufgabe gebührt, ist natürlich Till Gerken, ein
    großartiger Co-Autor. Wir haben zusammen tausende von Stunden (oder so ähnlich)
    mit Internet Relay Chat (IRC) eingebracht, in dem Programcode geschrieben oder
    korrigiert wurde – und viel Spaß hatte. Es war richtig harte Arbeit, aber auch
    eine wunderbare Zeit.


    Danke an alle Benutzer des Internets von #php – sie sind eine großartige Gemeinschaft,
    und es macht Spaß, sich unter ihnen zu tummeln. Wenn Ihr Zeit habt, kommt vorbei
    und sagt »Hallo» zu tigloo (Till) und Yapa (das bin ich). Jeder im IRC war sehr
    hilfreich, und insbesondere Zeev zeigte uns viel Geduld bei der Beantwortung unserer
    Fragen.


    Ein Dankeschön an Robert Finazer, der uns in den letzten Jahren wertvoller Wirtschaftswaterater
    war und stets Verständnis hatte, wenn wir Artikel oder Bücher schrieb, anstatt
    ihm mit einem millionenschwerten Unternehmen zu arbeiten. Danke an das große Team
    der Profi Online Service und natürlich an Joachim Marangoni.


    # Danksagungen von Till


    Ich habe nicht mehr daran geglaubt, dass ich jemals zu diesem Kapitel vordringen
    würde, aber nun ist es soweit. Damit beende ich ein Projekt, das ich im letzten
    Jahr viel Zeit und Energie aufgebracht habe. Ich muss zugeben, dass ich manchmal
    dachte, das schaffen wir nicht; aber jetzt bin ich stolz, es im Regal zu stehen
    zu.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Deswegen muss ich mich als Erstes bei Tobias Ratchiller bedanken, der mir in
    den PHP-Bereich einführte. Von Anfang hatte er ein unglaubliches Vertrauen in
    mich und zwei bei der Zusammenarbeit mit mir unendliche Geduld. Er war ein fünf-Sterne-Co-Autor,
    und ich bin froh, dass ich die Möglichkeit hatte, dieses Buch mit ihm zu schreiben.
    Selbst wenn ich manchmal mit meinem Material unzufrieden war, wartete er immer
    mit guten Vorschlägen an. Wenn er etwas sagte, verbrachten wir endlose Stunden
    im IRC mit der gegenüberseitigen Textkontrolle und Fehlerkorrektur des Programmcodes
    – ganz zu schweigen von den unzähligen E-mails. Es hat definitiv viel Spaß gemacht!


    ususätzlich zu den oben erwähnten Danksagungen möchte ich mich bei meinen Freunden
    bedanken: bei denen, die mich in meiner Arbeit unterstützen, und bei denen, die
    nicht taten. Ich habe zwar immer gesagt, wenn andere Autoren bemerkten, er seien,
    um sie alle namentlich zu erwähnen, aber ich muss zugeben, dass es mir genauso
    geht und mich mehr Schaden anrichten würde, wenn ich jemand ausließe. Ihr wisst,
    was ich meineint!


    Zu guter Letzt möchte ich meiner Familie für Ihre Aufmunterungen und tatkräftige
    Unterstützung bei meiner Arbeit danken. Sie gaben mir stets Zuhause, wenn ich
    einen Platz zum Ausruhen brauchte.'
  merge: -1
