    \ die Datenbank geschickt wurden. Um die Fehluche einzuschalten, müssen Sie eine\
    \ Instanz der Klasse erzeugen und in ihrem Programm $db->Debug = true eingeben.\
    \ In unserem Programm verwenden wir in der Regel eine Konstante DEBUG, die der\
