  md: '# Pearson Education


    # ADDISON-WESLEY


    # Projektstruktur


    auf der Website dokumentiert, und zwar unter http://phplib.netuse.de. Wir fürchten,
    dass die Automatisierung der Formularüberprüfung im realen Leben nicht funktioniert,
    wenn die Situationen häufig sehr komplex sind. Einige Formulareingaben hängen
    von zuvor eingetragenen Daten ab, oder von komplexen Zeichenketten-Überprüfungen,
    die sich nicht mit regulären Ausdrücken ausdrücken lassen, oder beziehen auf andere
    Quellen wie Datenbanken. Dies lässt sich nicht hinreiche abstrahlen, um vollständig
    generische Überprüungsroutinen zu erstellen.


    > Hinweis: Zum Zeitpunkt der Erstellung dieses Buches gab es erste Bemühungen,
    eine Schablon-API in PHP 4.0 zu integrieren. Dies ist sicher zu begrüßen, da es
    eine standardisierte und offene Handhabung von Schablon ermöglicht.


    # 5.2 Projektstruktur


    Die Zeit kommt, dass ein Zwölf-Stunden-Tag, Wochenarbeit wie Tonnen von Kaffee
    und ebensoviel Cola nicht ausreichen, dass ein einzelner Entwickler Projekt rechtzeitig
    fertig stellt. Für den Durchschnittsprogrammierer ist dies ein bedeutender Einschnitt
    im Leben – kein einzigines eigenen Codes mehr und kein cooler Programierstil,
    mehr er nur lernen kann, nicht mehr sein eigener Boss sei, der ab und zu dem Hintergrund
    auftau, um sich eine Pizza abzuholen.


    Nein – nicht. Nun muss er sich Gedanken machen: über Standards, Stil und Projektverwaltung.
    Als Dankeschön kann er vielleicht zu den normalen Arbeitsstunden zurückkehren
    und sich einige Zeit freischalten, die er für nicht-arbeitsbezogene Dinge verwendet.
    Wer weiß, vielleicht kann er sogar am sozialen Leben viel teilnehmen?


    # 5.2.1 Zusammenarbeitarbeit im Team


    Mit dem Internet entstand die Möglichkeit, über weite Entfernungen hinweg zu kommunizieren
    und zusammenzuarbeiten, egal wie sich der geografische Standort eines Teammitglied
    tatsächlich befindet. Dies eröffnet verteilten Teams Chancen. Große Firmen sind
    heute nicht mehr durch geografische Grenzen eingeschränkt. Tatsächlich entwickeln
    viele Unternehmen Softwareanwendungen, wenn sich Experten aus vielen verschiedenen
    geografischen Regionen miteinander kombinieren.


    Für die effektive Verwaltung der verteilten Softwareentwicklung ist eine gute
    Projektleitung von immenser Bedeutung. Wenn ein neues Projekt gestartet wird,
    wissen die Leute zuerst einmal nichts, was zu tun ist


    229'
