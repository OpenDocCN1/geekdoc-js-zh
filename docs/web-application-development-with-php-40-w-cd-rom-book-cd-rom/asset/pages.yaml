    # 5.4.3 PHP and COM


    Das Component-Object-Model (COM) ist eine von Microsoft entwickelte Soft-warearchitektur,
    die eine Unterteilung von Programteilen in binäre Module ermöglicht. COM definiert
    einen Standard für das Zusammenspiel der einzelnen Module und spezielle Funktionen,
    die jedes Modul von keiner Programmiersprache abhängig muss. Microsoft versucht,
    COM als offenen IETF(Internet Engineering Task Force)-Standard zu etablieren.
    Auf Objekte kann mit kompatiblen und Programmiersprachen zugegriffen werden, z.B.
    Visual Basic, Delphi oder PHP.


    COM beschäftigt sich mit folgender Frage: Wie kann ein System aufgebaut werden,
    so dass binäre Programmkomponenten von verschiedenen Herstellern zusammenarbeiten
    können? Microsofts erste Antwort auf diese Frage, nämlich das Konzept der DLL,
    scheiterte kläglich. Aufgrund der fehlenden Versionserkennungen in den DLLs können
    auf dems dieselbe Schnittstelle benutzen. Betrachten'
