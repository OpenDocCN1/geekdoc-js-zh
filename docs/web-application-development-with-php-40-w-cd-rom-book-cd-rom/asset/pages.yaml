  md: "# Array-Funktionen\n\nDie Anweisung list() ist besonders nutlich, wenn Sie\
    \ eine Sammlung von\nWerten in einzelnen Variablen unterteilen möchten. Dies passiert\
    \ häufig\nbei der Datenbankprogrammierung. Beachten Sie jedoch, dass list() nur\
    \ als\nl-Wert und als r-Wert fungieren. Sie können list() nicht verwenden,\num\
    \ eine Reihe von Variablen auszutauschen. Die folgende Anweisung\nwürde beispielsweise\
    \ nicht funktionieren:\n\n```\nlist($var1, $var2) = list($var2, $var1);\n```\n\
    \nDie Anweisung each() wird häufig mit der Anweisung list() verwendet.\neach()\
    \ erstellt ein Array und gibt die Elemente in einer Schlü-\nel/Wert-Kombination\
    \ zurück. Dies geschieht durch »Abwandern» des Ein-\ngabe-Arrays. PHP setzt jedem\
    \ Array einen internen Zeiger zu. Dieser Zeiger\nweist bis auf das erste Element\
    \ des Arrays. Bei jedem Aufruf von\nwird das Array zurückgegeben, auf welches\
    \ der interne Zeiger\nweist. Schließlich wird der Zeiger auf eine vorgegebene\
    \ Anzahl von Ele-\nmenten hochgesetzt.\n\nDas Rückgabeformat des Schlüssel/Wert-Paares\
    \ ist ein vierteses Element-\nsendes Array mit den Schlüsseln «0», «1», «key»\
    \ und «value». Dies bedeutet,\ndass dies sowohl als indiziertes Array als auch\
    \ als assoziatives Array verwendet\nwerden kann. Der indizierte Teil des Arrays\
    \ (mit den Schlüsseln «0» und «1»)\nenthält den Schlüssel des Quelzelelements\
    \ an einen Index 0; der Wert befindet\nnur der assoziative Teil des Arrays. (Genaunommen\
    \ ist eine Trennung von assozi-\nativen und indizierten Teil des Arrays theoretisch\
    \ nur eine Sonder des assoziativen Arrays sind\nganz zwar verschiedene Dinge,\
    \ aber in der Praxis sind sie in PHP identisch. Weitere\nEinzelheiten finden Sie\
    \ weiter unten). Der Schlüssel des Quelzelelements ist in\n»key»-zugegegeben,\
    \ während der Wert in »value» steht. Hier ist ein Beispiel:\n\n```\n$my_array\
    \ = array(\"Element 1\", \"Element 2\", \"Element 3\");\n```\n\nHierdurch wird\
    \ ein Array mit dem folgenden Inhalt erzeugt:\n\n+   * Element 1\n* Element 2\n\
    * Element 3\n\nUm das Prinzip von each() besser zu verstehen, ist es sinnvoll,\
    \ eine detaillierte\n Auflistung dieses Arrays zu erstellen:\n\n| Schlüssel |\
    \ Wert |\n| 0 | Element 1 |\n| 1 | Element 2 |\n| 2 | Element 3 |"
  merge: -1
