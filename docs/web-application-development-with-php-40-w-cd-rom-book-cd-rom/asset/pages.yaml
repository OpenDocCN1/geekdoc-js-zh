    # 7.2.4 RDF – Resource Description Framework


    Die RDF-Definition benötigt eine Sprache, mit Metadaten über die Webressource
    im Web zu formatieren. HTML-Seiten sind für automatische Maschinen, wie Spider
    oder Roboter, sehr schwierig zu verarbeiten. Die besten Algorithmen können jeden
    Tag ihre Grenzen finden und selbst sinnvolle Suchbegriffe garantieren, wie jeder,
    der Web für die professionelle Nutzung verwendet. Auf Webseiten kann nur eine
    Volltextsuche durchgeführt werden, was eine begrenzte Suchmethode ist.


    Die aktuellen HTML-Versionen ermöglichen eine einfache Speicherung von Metadaten
    zu einem Dokument. Wie Sie vielleicht wissen, können Sie Metatags verwenden, Schlüsselörter
    für ein Dokument, wie Kurzfassung und Informationen über den Autor zu definieren.
    Aber was ist, wenn Sie die Erstellungsdaten des Dokuments speichern wollen? Oder
    Informationen über die Editoren? Ein Bibliograph verliert die Metatags von HTML
    erstellt niemals.


    1998 bildete das W3C ein Komitee, um ein Format zur Definition von Metadaten zu
    entwickeln, und verabschiedete am 22. Februar 1999 das Resource Description Framework
    (RDF).


    RDF ist eine Erweiterung des Formats, das ursprünglich für PICS verwendet wurde.
    Es ersetzt zunehmend das Dublin Core Metadata für den Resource-Discovery-Standard,
    ein anderes Verfahren zur Klassifizierung von Metadaten. RDF hat sich als Standardmethode
    für den globalen Austausch von Metadaten im Internet durchgesetzt.


