    # 2.8 Zusammenfassung


    In diesem Kapitel haben Sie eine Menge über die erweiterte Syntax von PHP und
    gute Programmierpraktiken erfahren. Wir haben Ihnen gezeigt, wie Sie Konstanten
    mit define() erzeugen. Anschließend sind wir auf die kniffliger Aspekte von Arrays
    eingegangen und haben Ihnen erklärt, dass Sie list()/each() zur Bearbeitung von
    Hash-Codes verwenden sollten. Wir erläuterten die Funktionen der objektorientierten
    Programmierung in PHP, zeigten, wie und wann Sie diese verwenden, und sagten Ihnen,
    wann Sie bei der prozeduralen Programmierung bleiben sollten. Da PHP eine interpretierte
    Sprache ist, sind viele Funktionen, die sich in konventionell kompilierten Programmiersprachen
    nur implementieren lassen: variable Variablen, selbstmodifizierender Code und
    Laufzeitwertung. Mit diesem Wissen sind Sie gut gerüstet für die erweiterte PHP-Programmierung
    und einen großen Schritt weiter auf Ihrem Weg zum PHP-Experten.'
