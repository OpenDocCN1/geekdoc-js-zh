  md: "# 2 Erweiterte Syntax\n\nPHP. PHP unterstützt natürlich Objekte, jedoch auf\
    \ eine eine sehr spezielle Weise. Dies hängt damit zusammen, wie der Interpreter\
    \ Variablen handhabt.\n\nSobald PHP auf eine Anweisung trifft, die für einen Schreibzugriff\
    \ auf eine Variable benötigt wird, wird er die aus, die in die Variable geschrieben\
    \ werden, berechnet sie, kopiert sie und weist das Ergebnis dem Ziel-speicherbereich\
    \ zu. (Diese Beschreibung ist zwar vereinfacht, vermittelt Ihnen aber das Grundprinzip).\n\
    \n```\n$my_var = 2;\n```\n\n```\n$my_var = $my_var * 3;\n```\n\n```\n$new_var\
    \ = $my_var + $my_var;\n```\n\nLaut diesem Skript wird PHP\n\n+   einen Speicherbereich\
    \ für $my_var erzeugen und »22« hineinschreiben.\n\n+   einen Speicherbereich\
    \ für $my_var erzeugen, den Wert von $my_var auslesen, ihn mit 3 multiplizieren\
    \ und das Ergebnis dem neu angelegten Speicherbereich zuordnen.\n\n+   einen Speicherbereich\
    \ für $my_var erzeugen, die Werte von $my_var auslesen, sie zusammenzählen und\
    \ wieder in den neuen Speicherbereich zurückschreiben.\n\nDies klingt alles sehr\
    \ schön und logisch – es handelt sich jedoch um eine einfache Typen, mit denen\
    \ Sie bereits viele gearbeitet haben. Dies sagt ganz anders (und unlogisch), als\
    \ PHP mit Klassen zu tun hat:\n\n```\nclass my_class\n{\n    var $var1, $var2,\
    \ $var3;\n}\n\n$my_object = new my_class;\n\n$my_object->$var1 = 1;\n$my_object->$var2\
    \ = 2;\n$my_object->$var3 = 3;\n\n$new_object = $my_object;\n\n$new_object->$var1\
    \ = 3;\n$new_object->$var2 = 2;\n$new_object->$var3 = 1;\n\nprint(\"My object\
    \ goes $my_object->$var1, $my_object->$var2.\\n$my_object->$var3 !<br>\");\");\n\
    ```"
