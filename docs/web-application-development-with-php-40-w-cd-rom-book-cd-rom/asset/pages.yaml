    # 9.17 Rückgabe von Werten


    Die Rückgabe von Werten als Funktionen in PHP sind wir in einem angemessenen Abschnitt
    kurz eingehen. In diesem Abschnitt erfahren Sie Einzelheiten. Rückgabewerte return
    value übergeben, an Ihre Funktion als Argument übergeben werden. Das Argument
    return value besteht aus einem zval-Container (siehe dazu die erste Erörterung
    der Aufrufschnittstelle), den Sie verändern können. Der Container ist selbst bereits
    zugewiesen, sodass Sie für MAKE_STD_ZWAL nicht ausführen müssen. Stattdessen können
    Sie direkt auf seine Mitglieder zugreifen.


    Um die Rückgabe von Werten als Funktionen zu erleichtern und Probleme beim Zugriff
    auf interne Strukturen des zval-zval-Containers zu vermeiden, stehen eine Reihe
    von Makros zur Verfügung (gewiglich). Diese Makros setzen automatisch den entsprechenden
    Typ und Wert, wie die Tabellen 9.14 und 9.15 zeigen.


    > Hinweis: Das Makros aus Tabelle 9.14 werden automatisch durch Ihre Funktion
    ausgegeben.


    | Makro | Beschreibung |

    | --- | --- |

    | RETURN_RESOURCE(Rource) | Gibt eine Ressource zurück. |

    | RETURN_BOOL(bool) | Gibt einen booleanen Wert zurück. |

    | RETURN_NULL() | Gibt Nichts (einen NULL-Wert) zurück. |

    | RETURN_LONG(Long) | Gibt einen Long zurück. |

    | RETURN_DOUBLE(Double) | Gibt einen Double zurück. |

    | RETURN_STRING(String, duplicate) | Gibt einen String aus. Ob der String mit
    strdup() dupliziert werden denn soll |

    | RETURN_STRINGL(String, Länge, duplicate) | Gibt String der angegebenen Länge
    aus; ansonsten verhält sich das Makro wie RETURN_STRING. Es ist jedoch schneller
