  md: 'Chat-Räume oder Netzwerke haben meist nicht mehr als 1.000 Clients auf einmal,
    was nicht gleich zu Beginn ernsthafte Probleme zu vermeiden, empfiehlt es sich
    trotzdem, ein Konzept zu entwickeln, um dieser Art von Problemen zu begegnen,
    die möglicherweise später auftreten. Seit des Servers-Start stellt sich das Netzwerk
    wie in Abbildung 3.3 dar.


    Die hier einges Struktur ähnelt einer Mischung aus Multiplexer, Demultlexer und
    Hub. In der Richtung Client zum Netzwerk komprimiert der Server vom Client kommenden
    Daten und schickt diese zu den Netzwerkverbindungen. In Gegenrichtung ermittelt
    der Client, welche vom Netzwerk kommende Daten sind und welche den entsprechenden
    Verbindungen gehören. Alle vom Netzwerk ankommenden Daten, die zu den anderen
    Netzwerkverbindungen geschickt werden sollen, werden direkt weitergeleitet.


    Prinzipell ist dies die Einstellung, die wir für unser eigenes Chat-System brauchen.
    Lassen Sie uns nicht überlegen, wie wir unser Ziel erreichen. Eine Server-Umgebung,
    die folgende Bedingungen erfüllt:


    +   * Sie akzeptiert IRC-Netzwerkverbindungen.

    * Sie akzeptiert IRC-Client-Verbindungen.

    * Sie bietet eine web-basierte Benutzeroberstelle.

    * Sie ist möglichst einfach zu implementieren.


    # 3.4 Einpassen der Anwendung in das Netzwerk


    Wenn Sie bereits ein Konzept für die Entwicklung Ihres Servers in PHP hatten,
    überdenken Sie ihn noch einmal. Mö sind Sie fälschlicherweise ausgegangen, dass
    Sie zur Implementierung eines Chatservers einen eigenen Netzwerk-Server implementieren
    müssen. Dies ist zwar die Richtung, in der Sie tatsächlich führen wollen, aber
    Sie müssen ihn nicht selbst entwickeln. Es gibt keine geschriebene Serversoftware
    für alle Systeme. Warum verwenden Sie nicht einen der bestehenden Server und melden
    Ihren Server im Netzwerk als Client? Alles was Sie tun müssen, ist dem Netzwerk
    eine Abstraktionsebene hinzuzufügen, wie Abbildung 3.4 demonstriert.


    Der PHP-Chatserver wird vom Webserver betrieben. Für jede Client-Verbindung, die
    er akzeptiert, erzeugt er eine Client-Verbindung zum IRC-Server. Auf diese Weise
    können wir sicherstellen, dass alle Daten, die für diesen Client ankommen, auch
    für diesen Client gedacht sind und für niemanden sonst.'
