  md: '# Entwicklungskonzepte


    Das Modul, für welches wir eine API generieren wollen, soll einen einfachen Terminkalender
    steuern. Die Funktionen des Terminkalenders tatsächlich implementiert werden,
    interessiert an dieser Stelle nicht. Genauommen ist dies der, den der Benutzer
    nicht später sein soll. Der Benutzer möchte lediglich eine Reihe von Zuordnungen
    vornehmen. Die API muss sich auch als Schnittstelle, über welche Zuordnungen verwaltet
    werden können. Es ist nicht erforderlich, dem Benutzer das zugrundrunde System
    zu erklären – ob Sie den Julianischen, den Gregorianischen Kalender oder ein anderes
    Format verwenden. Vielmehr möchten sich der Benutzer irgendwann eine zusätzliche
    Funktion zur Verfügung stellen (z.B. zur Konvertierung des Datumsformats), aber
    dies ist wirklich überflüssig, wenn sich der Benutzer nicht erst in die Lage setzen
    wollen, Zuordnungen vorzunehmen.


    Andererseits bedeutet dies nicht, dass Sie die zukünftige Einbindung solcher Funktionen
    verhindern müssen. Die Kunst ist, Schnittstellen zu entwickeln, so zu konzipieren,
    dass sie ihre Anforderungen genau erfüllen und trotzdem später erweitert werden
    können. Dies erfordert sorgfältige Planung und durchdachte Definitionen, worauf
    wir in diesem Kapitel wieder angewiesen sind.


    Für den Benutzer muss die API als einziger erscheinen, die sie repräsentiert.
    Keine Funktion fühlt sich und gibt keine unnötige oder direkt zum Modul gehörende
    Funktion.


    Folgende Anforderungen können an einen einfachen Terminkalender gestellt sein:


    +   * Ein Ereignis soll hinzugefügt werden.

    * Ein Ereignis soll gelöscht werden.

    * Eine Liste nur Ereignisse wird abgefragt.


    Zunächst müssen wir Prototypen entwickeln, Funktionen hinzufügen oder entfernen.
    Betrachten Sie dazu Listing 1.10. Welche Informationen benötigen diese Funktionen
    mölicherweise und welche Werte geben sie wohl zurück?


    ```

