  md: "# Makros zur automatischen Erstellung von globalen Variablen\n\n| Makro | Beschreibung\
    \ |\n|---|---|\n| SET_VAR_STRING(name, value) | Erzeugt einen neuen String. |\n\
    | SET_VAR_STRINGL(name, length) | Erzeugt einen neuen String der angegebenen Länge.\
    \ Dieses Makro ist schneller als SET_VAR_STRING und binischer. |\n| SET_VAR_LONG(name,\
    \ value) | Erzeugt einen neuen Long. |\n| SET_VAR_DOUBLE(name, value) | Erzeugt\
    \ einen neuen Double. |\n\nTab.9.12: Makros zur Erstellung globaler Variablen\n\
    \n# 9.15.1 Erstellen von Konstanten\n\nZend unterstützt die Erstellung von echten\
    \ Konstanten (im Gegensatz zu regulären Variablen). Der Zugriff erfolgt typische\
    \ Dollarzeichen($)-Präfix. Konstanten sind sowohl lokal als auch global verfügbar.\
    \ Zwei Beispiele für Konstanten sind TRUE und FALSE.\n\nMit den Makros aus Tabelle\
    \ 9.13 können Sie eigene Konstanten erzeugen. mit dem angegebenen Namen und Wert.\n\
    \nFür jede Konstante können Sie folgende Flags:\n\n+   - CONST_CS - Bei dem Namen\
    \ dieser Konstante wird Groß- und Kleinschreibung unterschieden.\n- CONST_PERSISTENT\
    \ - Diese Konstante ist beständig und wird nicht «vergessen», wenn der Prozess,\
    \ der diese Konstante enthält, beendet wird.\n\nUm die Flags zu verwenden, kombinieren\
    \ Sie diese mit einem binären ODER:\n\n```\n// register a new constant of type\
    \ \"long\"\nREGISTER_LONG_CONSTANT(\"NEW_MEANINGFUL_CONSTANT\",324, CONST_CS |\
    \ \nREGISTER_PERSISTENT);\n```\n\nEs gibt zwei Arten von Makros – REGISTER_*CONSTANT\
    \ und REGISTER_MAIN_*CONSTANT. Der erste Typ erzeugt Konstanten, die an das Modul\
    \ gebunden sind. Diese Konstanten werden aus der Symboltabelle entfernt, sobald\
    \ das Modul, das diese Konstante registriert hat, aus dem Speicher gelöscht wird.\
    \ Der zweite Typ erzeugt Konstanten, die unabhängig vom Modul in der Symboltabelle\
    \ verbleiben."
