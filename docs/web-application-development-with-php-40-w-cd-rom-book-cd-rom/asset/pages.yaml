  md: '# Pearson Education


    # Wissensrepräsentation


    Die erste Zeile erzeugt eine Instanz der Klasse Template. Der Konstruktor der
    Klasse hat zwei Argumente. Das optionale Argument gibt ein Klassenverzeichnis,
    in dem sich mehrere Schabendateien befinden. Standardmäßig ist dies das aktuelle
    Verzeichnis. ./Das zweite Argument definiert, wie Platzhalter behandelt werden,
    die nicht im Skript verwendet werden. Die möglichen Platzhalter werden comment
    oder remove, wobei der Standardwert remove ist. Bei jedem Platzhalter erhalten.
    Wenn im einfachen Beispiel der Platzhalter {TITLE} kein Wert zugewiesen, würde
    der Platzhalter später in der analysierten Schablone unverändert erscheinen. Wenn
    die Variable auf comment gesetzt wird, sieht die Ausgabe des einfachen Beispiels
    folgendmaßen aus, falls dem Platzhalter {TITLE} kein Wert zugewiesen:


    ```

    <html>

    <title><!-- Template : Variable TITLE undefined --></title>

    <body>

    Hello World!

    </body>

    </html>

    ```


    Bei remove (der Standardeinstellung) werden nicht zugewiesene Platzhalter ohne
    Nachfrage aus der Schablone gelöscht.


    In der zweiten Zeile dieses Beispiels wird eine Schabendatei mithilfe von set_file()
    einer Klasse zugeordnet. Diese Funktion hat zwei Argumente. Im ersten Argument
    wird ein Handle angegeben, mit dessen die Schabendatei in zukünftigen Funktionen
    referenziert wird. Das zweite Argument enthält den Datennamen. Bedenken Sie, dass
    die Datei im jeweiligen Pfad vom Konstruktor aufgenommen wird (in unserem Beispiel
    das aktuelle Verzeichnis). Sie können der Funktion set_file() auch ein assoziatives
    Array übergeben, um mehrere Daten auf einmal hinzuzunehmen. In diesem Fall sind
    der Schlüssel des Array den Handle, und die Elemente den Datenamen.


    Anschließend werden die Platzhalter der Schablone mithilfe von set_var() mit Zeichenketten
    zugeordnet. Auch hier können wieder ein einzelnes Schlüssel/Var-Paar an die Funktion
    übergeben oder ein assoziatives Array zur Serververarbeitung. Die übrigen Zellen
    dieses Beispiels führen die Analysefunktion (parse()) auf und geben das Ergebnis
    als (p()).


    Dieses Beispiel zeigt eine einfache Verwendung der Klasse Template. Es arbeitet
    mit einer Schabendatei und ersetzt jeden Platzhalter durch eine Zeichenkettenvariable.
    Hier hätten Sie auch EasyTemplate verwenden können, was wahrscheinlich schneller
    und intuitiver gewesen als der PHPLib-Ansatz. Die leistungsfähige Klasse Template
    wirkt wirklich, zeigt sich, wenn Sie diese in komplexeren Szenarien einsetzen.'
