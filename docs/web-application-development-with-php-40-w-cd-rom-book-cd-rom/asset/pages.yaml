- img_proc: true
  md: '# Zehn heuristische Tauglichkeitsprüfungen nach Jakob Nielsen


    (www.useit.com/papers/heuristic/heuristic_list.html)


    # Sichtbarkeit des Systemstatus


    Das System soll Benutzer über stets durch Rückmeldungen innerhalb einer angemessenen
    Zeit informieren, was vor sich geht.


    # Abstimmung zwischen System und der realen Welt


    Das System sollte keine systembezogenen Begriffe verwenden, sondern in der Sprache
    des Benutzers „sprechen“ und dabei Wörter, Phrasen und Konzepte verwenden, der
    Benutzer kennt. Es soll praxisübliche Konventionen verwenden und Informationen
    in natürlicher und logischer Reihenfolge anzeigen.


    # Benutzerkontrolle und Freiheit


    Benutzer wählen häufig versehentlich falsche Systemfunktionen und bra-chen markierte
    »Notausgänge“, um den unerünschten Zustand zu verlassen, ohne einen langen Dialog
    durchlaufen zu müssen. Unterstüt-zen Sie die Funktionen „rückgängig“ und „wiederherstellen“.


    # Konsistenz und Standards


    Benutzer sollten nicht raten, sondern über offene Wörter, Situationen oder Aktionen
    dasselbe bedeuten. Halten Sie sich auf Plattformkonventionen.


    # Fehlermeldungen


    Besser als viele Fehlermeldungen ist ein sorgfältiges Konzept, das in erster Linie
    verinde, wenn ein Problem auftritt.


    # Erkennen statt Erinnern


    Gestalten Sie Objekte, Aktionen und Optionen erkennbar. Der Benut-zer sollte sich
    nicht Daten von einem Teil des Dialogs bis nächsten mer-ken müssen. Anweisungen
    für die Bedienung eines Systems sollten sichtbar oder zumindest leicht aufzurufen
    sein.


    # Flexible und effiziente Benutzung


    Beschleuniger, der die nicht sind, können die Interaktion für erfahren Benutzer
    häufig beschleunigen, so dass das System erfrene und uner-fahrene Benutzer bedienen
    kann. Ermöglichen Sie dem Benutzer, häufig ver-wendete Aktionen auf seine Bedürfnisse
    anzupassen.


    # Ästhetisches und minimalistisches Design


    Dialoge sollten klare Informationen enthalten, die relevant sind oder selten gebraucht
    werden. Jede zusätzliche Informationseinheit in einem Dialog lenkt die Aufmerksamkeit
    auf den relevanten Teil.


    # Hilfe für Benutzer zum Erkennen und Beheben von Fehlern


    Fehlermeldungen sollten als Klartext (nicht Programcode) ausgegeben ver-den, das
    Problem genau benennen und eine konstrukt Lösung vorsch-lagen.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Hilfe und Dokumentation


    Es ist zwar besser, wenn das System ohne Dokumentation genutzt werden kann, manchmal
    kann es notwendig sein, eine Hilfe und Dokumentation bereitzustellen. Diese Informationen
    sollten leicht zu finden sein, auf die Aufgabe des Nutzers ausgerichtet sein,
    die konkreten auszuführenden Schritte beschreiben und nicht zu lang sein.


    # 4.3.3 Tauglichkeit: Tun Sie es einfach


    Gemäß lauten zwei der wichtigsten Sprüche der reduzierten Tauglichkeitsprüfung:
    »Alle Daten sind irgendetwas ist besser als gar nichts, die Tauglichkeit betrifft«.
    Wir möchten Sie ermutigen, die einfache Tauglichkeitsprüfung einmal auszuprobieren
    und sie bei Ihrer Entwicklung so häufig und regelmäßig wie möglich anzuwenden.
    Sie kostet nicht viel und fördert die Kenntnisse des Nutzers.


    # 4.4 Zusammenfassung


    In diesem Kapitel haben Sie die Grundlagen der Sitzungsverwaltung gelernt. Sie
    haben erfahren, wie Sie Daten von einer Seite zur nächsten weiterleiten und wie
    Sie Ihre Benutzer erkennen. Sie können Sitzungen mit PHP 3.0 und 4.0 erstellen,
    wenn Sie verschiedene Speicherverfahren verwenden und wissen, unter welchen Umständen
    diese verwenden müssen. Darüber haben wir Ihnen gezeigt, wie Sie Daten speichern,
    denen Ihr Benutzer vertraut, und wie Sie Ihre Website vor Missbrauch schützen.
    Sie kennen die Grundlagen der verschiedenen Verschlüsselungsmethoden und deren
    Anwendungsgebiete.


    Tauglichkeit ist für Sie kein Fremdwort mehr und wir hoffen, dass Ihnen jetzt
    bewusst ist, wie wichtig es ist, dass Ihre Website für Ihre Aufgabe eignet. Sie
    können die meisten der üblichen Fehler und Schwächen dieses Schnittstelldesigns
    entdecken ohne dabei die Entwicklungskosten in die Höhe zu treiben.


    Letztendlich sind es Ihre Benutzer, die über den Erfolg oder Misserfolg Ihrer
    Projekte entscheiden, und dieses Kapitel hat Ihnen gezeigt, wie Sie sie zufriedenstellen.'
