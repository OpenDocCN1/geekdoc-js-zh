  md: '# Verknüpfte Listen


    Verknüpfte Listen, eine Sonderform der Baumstrukturen, gehören zu den typischen
    Datenstrukturen für die Organisation von dynamischen Datätzen. Wir gehen davon
    aus, dass Sie bereits ein Grundverständnis von Struktur, dem Konzept und der Verwendung
    verknüpfter Listen haben. Daher werden wir hier nicht detailliert auf ihre Implementierung
    eingehen, sondern konzentrieren uns auf die wichtigsten und zu beachtenden Aspekte.


    Wie bereits in den vorgehenden Abschnitten beschrieben, erzeugt PHP 3.0 von den
    Objektinstanzen Kopien, anstatt sie mithilfe eines Zeigers zu referenzieren. WORM-ähnliche
    Verwendung der verknüpften Listen: einmal schreiben, mehrfach lesen. Verknüfte
    Listen können erstellt, aber nicht verändert werden. Wenn Sie versuchen, ein Element
    in der Liste zu ändern, verändern Sie die Referenz auf alle folgenden Elemente
    in der Liste. Demselben Grund lässt sich auch die Reihenfolge der Elemente nicht
    ändern.


    Doppelt verknüfte Listen lassen sich in PHP 3.0 ebenfalls nicht realisieren (zumindest
    nicht wir es geschafft, wobei wir einige Stunden mit Fehlersuche und Behabung
    verbracht haben). Jeder Knoten müsste eine Kopie des Knotens benötigen, damit
    er verknüpft ist, müssten Sie eine Vielzahl redundanter Listen mit demselben Inhalt
    erstellen, nur um die Funktion „ein Element zurückzugehen“ zu ermöglichen.


    PHP 4.0, das auch Referenzen unterstützt, hat diese Einschränkungen nicht. Listen
    können beliebig erstellt und zusammestellt werden, selbst doppelt verknüfte Listen.
    Beachten Sie jedoch, dass es nicht ganz einfach ist, zwischen Referenzen und dem
    tatsächlichen Kopien von Listenelementen zu unterscheiden.


    Ein Motto von Programmieren konventioneller Programmiersprachen lautet: Hüte dich
    vor freien Zeigern. Wir möchten dies für PHP modifizieren: Hüte dich vor redundanten
    Kopien.


    Wenn Sie mit Listen arbeiten, erstellen Sie eine abstraktere Bibliothek, die auf
    möglichst Weise Ihre Daten nach Ihren Bedürfnissen verwaltet. Testen Sie die Bibliothek
    ausführlich und stellen Sie sicher, dass sie korrekt arbeitet. Das spart Ihnen,
    fehlerhaften Programcode zu suchen, der auf Ihre Listen falsche Weise zugre und
    diese möglicherweise zerstört.


    # Verknüpfte Listen und Baumstrukturen – ein Arbeitssatz


    Wie bereits erwähnt, empfiehlt es sich, für Ihre Bedürfnisse eine abstrakichere
    Bibliothek zu erstellen – eine, die sich einfach erweitern lässt und alle für
    die Aufgabe erforderlichen Informationen bereitstellt. Im Folgenden'
