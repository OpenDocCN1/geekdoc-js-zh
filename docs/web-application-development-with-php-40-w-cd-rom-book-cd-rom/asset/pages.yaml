  md: '# Pearson Education 4 Webanwendungskonzepte


    Dieses Beispiel zeigt die Sitzungskennnummer und einen Zähler, der jedes Mal erhöht
    wird, wenn Sie auf die Seite zugreifen. Es unterscheidet sich natürlich von einem
    normalen Seitenzähler. Die Sitzung (und damit der Zähler) ist einem speziellen
    Benutzergeordnet. Bei der Standardkonfiguration von PHP hat die Sitzcookie eine
    Lebensdauer von 0; dies bedeutet, wenn Sie den Browser schließt und wieder öffnet,
    beginnt der Zähler wieder bei Null, bis die Cookie gelöscht wurde.


    Betrachten wir die Sitzungsfunktionen von PHP 4.0 näher. PHPs Sitzungsververwaltungsbibliothek
    bietet bereits folgende Optionen:


    +   - Sie speichern Sitzungsdaten auf dem Server. Da die Bibliothek verschiedene
    Speichermedia verwendet, können Sie die Daten in Textdateien, dem Shared Memory
    oder in Datenbanken ablegen. Dies spiegelt genau das, was wir über Speichermedien
    erläutert haben. Wo die Leistung des Mediums ist nicht relevant.

    - Sie verwenden eine willkürliche Sitzungskennnummer, um einen Benutzer zu identifizieren.

    - Sie speichern die Sitzungskennnummer (und nur die Sitzungskennnummer) mittels
    Cookies, GET/POST oder dem Skriptpfad der Client-Seite. (Die PHP-Bibliothek bietet
    diese Methoden an; wie sie zu verwenden sind, siehe später).

    - Wenn der Benutzer Cookies deaktiviert, kann das Programm andere Mittel für die
    Verbreitung der Sitzungskennnummer einsetzen.


    # Ablauf einer Sitzung


    In PHP 4.0 beginnt eine Sitzung mit dem Aufruf von session_start() oder, indem
    Sie eine Sitzungsvariable mit session_register() registrieren. Beim Laden der
    Bibliothek prüft PHP, ob eine gültige Sitzungskennnummer vorhanden ist. Dies führt
    folgende Aktionen aus:


    +   1. Wenn track_vars auf false gesetzt ist, überprüft die Bibliothek global
    nach einer Sitzungskennnummer. Wird eine gefunden, schickt die Bibliothek einen
    Cookie mit der Sitzungskennnummer mehr, sondern definiert die Konstante SID.

    2. Wenn track_vars aktiviert ist, aber keine Sitzungskennnummer im globalen Namen
    gefunden wurde, wird das Array $COOKIE_VARS auf eine Sitzungskennnummer überprüft.
    Wird eine gefunden, wird ein Cookie gesendet, sonst die Konstante SID definiert.

    3. Wenn immer keine Sitzungskennnummer gefunden wurde, werden die Arrays $HTTP_GET_VARS
    und $HTTP_POST_VARS auf eine Sitzungskennnummer überprüft. Wird eine gefunden,
    wird die Konstante SID definiert.


    176'
