  md: '# 4 Webanwendungskonzepte


    Um dies zu vermeiden, müsste der gesamte Datenverkehr über einen einen sicheren
    Kanal abgewickelt werden.


    Das Authentifizierungselement wird mit einer Authentifizierungsdatenbank abgeglichen.
    Das System, das die Datenbank enthält, und die Art, in der die Authentifizierungselemente
    gespeichert werden, müssen sicher und zuverlässig sein. Die Authentifizierungsdatenbank
    benötigt Schutz für den allgemeinen Zugriff, und die Authentifizierungselemente
    sollten verschlüsselt gespeichert werden.


    Auch die Backup-System müssen sicher und zuverlässig sein. Zu einem richtigen
    Trust Management gehört auch das Einrichten von Rollen und dem Definieren, wer
    auf spezielle ein sicheres System in welcher Weise zugreifen kann. Trust Management
    ist jedoch ein sehr großes Gebiet, das wir hier abhandeln könnten.


    # Vergabe von Zugriffsrechte


    Wenn die Benutzeridentifizierung durch Authentisierung korrekt ist, beendet das
    System den Anmeldevorgang und weist die Identität und den Zugriffskontrolldaten
    des Benutzers eine Berechtigung zu. In einfachen Programmen wird die Zugriffskontrollinformation
    vielleicht nur als ein Flag, das angibt, dass der aktuelle Benutzer berechtigt
    ist. In komplexeren Situationen benötigt das möglicherweise eine Sicherheitsebene
    oder Authentisierungsebene, welche definiert, was der aktuelle Benutzer im Programm
    darf (z.B. gibt es vielleicht einen übergeordneten Benutzer oder eine Nur-Lese-Benutzergruppe).
    Je nach benötigter Sicherheitsbene muss das System erfolgreiche oder fehlgeschlagene
    Andeversuche protokollieren. So legt der C2-Sicherheitsstandard das System auf,
    alle Anmeldeereignisse aufzuzeichnen.


    # HTTP-Authentisierung


    HTTP bietet eine Methode für die Benutzer-Authentisierung: die HTTP Basic Authentication.
    Auf Seiten, die eine Authentisierung vorschreiben, antwortet der Webserver dem
    Client mit einem bestimmten Kopf.


    ```

    HTTP/1.1 401 Authorization Required

    WWW-Authenticate: Basic realm="Protected Area"

    ```


    Daraufhin erscheint im Browser ein Dialog fürnamen. Dieser Berechtigungstyp ist
    jedoch nur als »grundlegend» zu bezeichnen, denn er beinhaltet eine Reihe von
    Nachteilen:


    +   - Um Benutzer abzumelden, müssen Sie Tricks anwenden.

    - Um Benutzer nach einer definierten Lernlaufzeit abzumelden, müssen Sie noch
    mehr Tricks anwenden.'
  merge: -1
