    # Setzen eines Flags in einer Datenbank


    Das Setzen eines Flags in einer Datenbank ist wahrscheinlich de-facto-Standardmethode
    in PHP: Verbindungen mit einer Datenbank herstellen, einige Daten darin hinterlassen
    und sie von anderen Prozessen weiterverarbeiten lassen. Diese Methode ist einfach
    zu installieren und auf allen System verfügbar, hat jedoch einen Nachteil. Welche
    Sie von welchem Nachteil wir sprechen?


    Der Nachteil entsteht nicht durch die schreibende Anwendung Datenbank (dem Prozess
    einfügt), sondern kommt vom lesenden Teil der Datenbank (dem Hauptprozess, dem
    Benutzernachrichten). Ein gutes „Chat-Gefühl“, haben wir so geringe Latenzen wie
    möglich und damit gut Antworten. Die Antwortzeit ist bei web-basierten Chats von
    großer Bedeutung, darin zu sein. Die Nachrichten werden langsamer und langsamer,
    sind Benutzer schnell frustriert und geben auf. Unser Test ergibt, dass eine Latenz
    von mehr als einer Sekunde lang ist. Die Abruffrequenz, mit welcher der Hauptprozess
    Nachrichten von der Datenbank einliest, ist sehr hoch. Bei phpChat liegt der Standardwert
    bei 0,5 Sekunden (zwei Überprüfungen pro Sekunde). Sobald ein Chatsystem viele'
