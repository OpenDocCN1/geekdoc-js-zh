    # 4.5.4 PHP und Java


    Java, das in vielen Firmen für Softwareentwicklung die «Sprache des Tages» ist,
    wird zunehmend in allen Entwicklungsbereichen eingesetzt. Seit der Version 4.0
    kann PHP so kompiliert, dass er Java Funktionen unterstützt, sodass sie die Java-Komponenten
    der Firma in einer mehrstufigen Umgebung verwenden können.


    Die Realisierung der Java-Unterstützung ist nicht nichter. Folgende Punkte sollten
    Sie bedenken:


    +   - Zunächst müssen Sie eine Java-Virtual-Machine (JVM) auf Ihrem System installieren.
    Wir haben hierfür das freie verfügbare Open-Source Kaffe 1.0.5 verwendet.

    - PHP muss mit APXS als DSO kompiliert werden, was als allgemein genutztes Modul
    auf dem Apache-Server geladen wird. Die Befehle hierfür finden Sie in der Datei
    INSTALL.DSO der PHP-Distribution.


    Weitere Anweisungen können Sie in der Datei README im Verzeichnis ext/java nachlesen.


    Sobald Sie in PHP eine Java-Unterstützung haben, ist die Syntax vergleichbar mit
    einer für den Aufruf der COM-Komponenten. Tatsächlich nutzen beide eine erweiterte
    interne Zend-Funktion, die sogenannte Objektüberladung. Überladung bedeutet im
    Bereich der Softwareentwicklung, dass ein Konstrukt je nach Kontext unterschiedlich
    reagieren kann. Funktionsüberlagerung bedeutet danach, dass eine Funktion je nach
    Ordnung oder Typ der Argumente unterschiedlich sein kann.


    In C++ gibt es beispielsweise zwei Funktionen deklariert, die in etwa folgendermaßen
    aussehen:'
