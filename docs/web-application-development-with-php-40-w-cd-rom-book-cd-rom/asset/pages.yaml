- img_proc: true
  md: 'Im Laufe der Zeit haben sich hauptsächlich zwei Verfahren für Programmerweiterung
    herausgebildet. Entweder bietet das Programm die Möglichkeit, Skripte zu erstellen
    (ähnlich wie Makros), oder das Programm Plugins verwenden. PHP bedeutet die Implementierung
    Scriptsprache in einem zeitkritischen Teil Systems – wir brauchen das gar nicht
    erst zu denken. Darüber hinaus wäre die Entwicklung eines ausgereiften Parsers
    mit viel endl lang. Plugins lassen sich dagegen sehr viel leichter implementieren
    und bieten viele Vorteile. Ein Plugin ist ein kleines Programmfragment, das sich
    selbst beim Programm anmelden kann und bestimmte Ereignisse aus diesem abfangen,
    über interne Daten zugreifen kann. Es fügt sich zwar nahtlos ins Hauptsystem ein,
    bleibt dennoch eine eigenständige, die getrennt und separat verteilt werden kann.
    Es kann an das System angehängt werden, ohne dass man dafür eine Programzeile
    ändern muss. Damit kann auch ein Systemadministrator, der keine Kenntnisse in
    PHP besitzt, das Programm mithilfe eines fremden Programcodes erweitern. Dies
    genau geht, zeigt Abbildung 3.9.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_152_0.png)


