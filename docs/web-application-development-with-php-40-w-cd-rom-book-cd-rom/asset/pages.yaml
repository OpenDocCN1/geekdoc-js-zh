  md: '# Sicherheitsaspekte


    Alle Funktionen arbeiten entweder im Rahmen einer Datei oder einer Zeitkette.
    Wenn Sie eine Zeichenkette übergeben, wird diese als temporäre Datei in $tmp_path
    gespeichert, PGP nur mit Dateien arbeiten.


    > Warnung: In einem Mehrbenutzersystem muss jede Datei sorgfältig abwägen, ob
    diese Klasse in einem nichtzuverlässigen System verwendet werden (d.h. nicht zuverlässigen
    Benutzern Zugriff auf diesen System verwenden).


    Die Klasse hat sechs «öffentliche» Funktionen; zwei werden intern verwendet. Bei
    Auftreten eines Fehlers geben diese false zurück. In diesem Fall können Sie über
    $pgp->error auf eine ausführliche Fehlermeldung zugreifen.


    +   - void pgp()

    - Konstruktor dieser Klasse überprüft, ob auf die PGP-Binärdaten zugegriffen wird.
    Wenn ja, wird true zurückgegeben, ansonsten false.

    - mixed encrypt(String what, String my_user_id, String to_user_id) PGP verschlüsselt
    das Argument, das eine Datei oder eine Zeichenkette ist, mit dem privaten Schlüssel
    von my_user_id für den öffentlichen Schlüssel von to_user_id. Zurückgegeben wird
    der verschlüsselte Text oder bei einem Fehler.

    - mixed sign(String what, String my_user_id) Unterzeichnet das Argument mit dem
    privaten Schlüssel von my_user_id. Zurückgegeben wird der unterzeichnete Text
    oder bei einem Fehler false.

    - mixed encrypt_sign(String what, String my_user_id, String to_user_id) Unterzeichnet
    das mit dem privaten Schlüssel von my_user_id und verschlüsselt es dann für den
    öffentlichen Schlüssel von to_user_id. Zurückgegeben wird der unterzeichnete und
    verschlüsselte Text oder bei einem Fehler false.

    - mixed decrypt_conventional(String what, String passphrase) Verschlüsselt nur
    mit der konventionellen Verschlüsselung, wobei passphrase als geheimer Schlüssel
    verwendet wird. Zurückgegeben wird der verschlüsselte Text oder bei einem Fehler
    false.

    - mixed decrypt(String what, String my_user_id) Entlüsselt mit dem my_user_id
    als privaten Schlüssel. Zurückgegeben wird der entschlüsselte Text oder bei einem
    Fehler false.

    - mixed decrypt_conventional(String what, String passphrase) Entlüsselt mit der
    konventionellen Verschlüsselung, wobei passphrase als geheimer Schlüssel verwendet
    wird. Zurückgegeben wird der verschlüsselte Text oder bei einem Fehler false.'
