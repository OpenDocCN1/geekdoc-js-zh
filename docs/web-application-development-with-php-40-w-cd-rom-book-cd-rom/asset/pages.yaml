  md: '# 5 Grundlegende Webanwendungsstrategien


    Ein weiteresützliches Werkzeug ist CVSweb, ein in Perl geschriebenes CGI-Skript,
    das Ihnen einen Überblick über Ihre CVS-Archive gibt. Es vereinfacht die Verwaltung
    größerer Projekte, indem es jede Datei der Liste zusammen mit dem letzten Protokollinhalt,
    dem Änderungsdatum und dem Autor anzeigt (siehe Abbildung 5.4). Sie können auch
    geänderte Versionen von einer Datei anfordern. Unterschiede zwischen beliebigen
    Versionen werden farbig dargestellt.


    # 5.3.2 Erweitertes CVS


    Natürlich gibt es einen Grund, dass das CVS-Referenzhandbuch von Per Cederqvist
    so groß ist. Die grundlegenden Befehle sind selbst von Entwicklern schnell zu
    lernen, die sich mit CVS gar nicht ausk. Die erweiterten Funktionen von CVS benötigen
    jedoch eine ausführliche Beschreibung.


    # Tags und Versionsbeispiele


    CVS verendet das Konzept der Tags und Zweige. CVS-Tags sind recht einfach zu verstehen.
    Im Beispiel haben Jan und Janine gearbeitet, bis sie die Projektstufe 1.0 erreicht
    und F-API freigegeben haben. Zwei Tage später entdeckt ein Kunde einen Fehler
    in der API. Es ist im Prinzip ein leicht zu behebender Fehler, der Entwickler
    haben die Entwicklung bereits fortgesetzt und können den aktuellen Quellencode
    nicht als stabile Version freigeben. Wenn sie den Fehler gefunden haben, müssten
    sie herausfinden, welche einzelnen Dateiversion die freigegebene Version bestehen,
    diese Version aus CVS auslesen und eine neue erstellen. Mit drei Dateien, wie
    in unserem Beispiel, ist dies vielleicht noch möglich, aber bei einem Projekt,
    das eine deutlich größere Anzahl von Dateien umfasst, bedeutet dies einen hohen
    Mehraufwand.


    Die Lösung, die CVS bietet, besteht darin, bei Erreichen eines bestimmten Meilensteins
    die geänderte Version mit einem Tag zu versehen. Vor der Freigabe nennt die Dateien
    mit dem Namen der Freigabe:


    ```

    jane@dev:/home/jane/f-api > cvs tag rel-1_0

    ```


    Wenn sie diese Freigabeversion noch einmal benötigt, braucht sie den Befehl cvs
    checkout mit diesem Tag ausgeben:


    ```

    jane@dev:/home/jane/f-api > cvs checkout -r rel-1_0 f-api

    ```


    Und schon hat sie die Version 1.0 wieder. Sie wird im Verzeichnis ./f-api abgelegt.'
