  md: '# Erzeugen von Variablen


    ZVAL_STRING besitzt einen dritten Parameter, dieser gibt an, ob der bereit- gestell
    Stringinhalt werden soll (mithilfe von strdup()). Durch Set- zen dieses Parameters
    auf 1 wird der String duiziert, bei 0 lediglich der bereitgestellte Pointer für
    den Variableninhalt verwendet. Dieses Makro ist insbesondere nlich, wenn Sie eine
    neue Variable erzeugen möchten, indem Sie einen String referenzieren, der bereits
    im internen Speicher von Zend zugewiesen wurde.


    Wenn Sie den String an eine bestimmte Stelle kleben möchten oder seine Länge bereits
    voraus kennen, können Sie ZVAL_STRINGL(val, string, length, duplicate) verwenden.
    Dieses Makro lässt eine exakte Länge für den neuen String zu und ist schneller
    als ZVAL_STRING und außerdem binärischer.


    Um einen leeren String zu erzeugen, setzen Sie die Stringlänge auf 0 und ver-
    wenden Sie als Inhalt empty_string:


    ```

    new_string->type = IS_STRING;

    new_string->value.str.len = 0;

    new_string->value.str.val = empty_string;

    ```


    Natürlich gibt es hierfür ein Makro (ZVAL_EMPTY_STRING):


    ```

    MAKE_STD_ZVAL(new_string);

    ZVAL_EMPTY_STRING(new_string);

    ```


    # 9.12.5 Boolesche Werte


    Boolean Werte werden genau dann erzeugt, wenn Longs, haben, aber den Typ IS_BOOL.
    Zulässige Werte für lval sind 0 und 1:


    ```

    zval *new_bool;

    ```


    ```

    MAKE_STD_ZVAL(new_bool);


    new_bool->type = IS_BOOL;

    new_bool->value.lval = 1;

    ```


    Die entsprechenden Makros für diesen Typ heißen ZVAL_BOOL (das ein Wertan- gabe
    ermöglicht) sowie ZVAL_TRUE und ZVAL_FALSE (welche den Wert explizit auf TRUE
    bzw. FALSE setzen).


    # 9.12.6 Arrays


    Arrays werden in den internen Hash-Tabellen von Zend gespeichert, auf die Sie
    über die API zend_hash_*() zugreifen können. Für jedes Array, das Sie erzeugen
    möchten, benötigen Sie einen neuen Hash-Tabellen-Handle, der im Mitglied ht des
    zval.value-Containers gespeichert wird.'
