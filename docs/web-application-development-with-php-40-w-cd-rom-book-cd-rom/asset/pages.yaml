  md: 'dem wir Ihnen die „richtige“ Methode zur Verwendung des Programms gezeigt haben,
    gehen wir jetzt auf die Einzelheiten ein, die Sie zur Ausführung des Plans benötigen.


    IRC-Netzwerke unterscheiden zwischen Clients und Servern. Benutzer können am Netzwerk
    nur über eine spezielle Client-Software teilnehmen, die eine Verbindung vom Client
    zum Server herstellt. Alle Server sind Serververbindungen miteinander verbunden.
    Die heutigen IRC-Server unterstützen nur hierarchische Strukturen. Das bedeutet,
    dass keine redundanten Verbindungen zu einem Server geben sind. Dadurch erhält
    das Netz eine baumähnliche Struktur, die einer Aufspaltung des Netzwerks gleichkommt,
    aber das Routing nur vereinfacht. Alle Server müssen lediglich alle ankommenden
    Daten an alle anderen Verbindungen schicken, um zu beherrschen, dass sie einen
    Server redundante Informationen senden.


    Jeder Server kann eine Reihe von Clients. Die maximale Anzahl der Verbindungen,
    die ein Server akzeptiert (natürlich wird sie auch durch die Netzwerkkapazität
    und die Serverbelastung begrenzt). Wie in Abbildung 3.2 zeigt, kann jeder Server
    jeden anderen Server über mehr oder weniger Server erreichen erreichen, dass jeder
    Server einfach alle ankommenden Daten an alle ausgehenden Verbindungen weiterleitet.
    Server C und Server F haben beispielsweise Clients, die am selben Kanal teilnehmen
    (Kanäle sind Chat-Räume von IRC; Orte, an denen sich Leute treffen und „unterhalten“
    können). In unserem Beispiel würde Server C Daten über die einzige zur Verfügung
    stehende Verbindung schicken, nach zu Server B. Server B verteilt die Daten auf
    alle anderen Verbindungen, nämlich Server A und Server D. Server A hat keine weiteren
    Verbindungen, macht nichts, aber Server D leitet die Daten an Server E weiter
    und der wiederum an Server F. Dies ist recht einfach zu realisieren, hat aber
    einen Nachteil: Keine der Clients, die mit Server A verbunden sind, und am Datenverkehr
    über die Kanäle teilnehmen, werden alle Daten für Server A, die über diesen Kanal
    geschickt werden, nach Bandbreite berücksichtigt.


    RFC für IRC Ähnlich wie allen offenen Standards im Internet werden die Grundlagen
    des IRC-Protokolls in einer RFC (Request For Comments) spezifiziert. Die RFC für
    IRC ist die RFC 1459, die sie unter www.irchelp.org herunterladen können. Diese
    Website enthält viele Informationen über IRC.


