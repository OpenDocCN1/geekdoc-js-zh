  md: '# Pearson Education


    # ADDISON-WESLEY


    # 8 Fallstudien


    Weitere Vorteile von PHP sah man in seiner klaren, -ähnlichen Sprachsyntax, der
    mit er in reinem HTML hinzugefügt werden kann, seine Erweiterbarkeit, der Datenbankanbindung
    und des Preises. In Gewicht fiel auch die Unterstützung, welche die PHP-Gemeinschaft
    bietet. Diese besteht aus einem umfangreichen Online-Dokumentationszentrums, einem
    reichen Online- und Hardcopy-Tutorials sowie einem regen Wissensaustauschs zwischen
    Experten und Layern.


    Ein weiterer Aspekt, der viele Leute bei Open-Source-Produkten häufig übersehen,
    ist dass die Entwicklung vorantrieben wird, so in einigen Fällen monatlich neue
    Versionen freigegeben wird. Wenn Sie eine bestimmte Funktion brauchen, können
    Sie diese selbst hinzufügen, sofern Sie die Zeit und das notwendige Wissen besitzen.
    Dies bedeutet, dass Sie nicht mehr auf die neueste Version warten müssen, um festzustellen,
    dass Ihre Anforderungen gerecht werden. Einige Biz-Chek-Programmierer gehören
    zum PHP-Entwicklungsteam und haben Programcodes entwickelt, die den ihren Bedürfnissen
    entsprechen. Die meisten der Arbeiten zu PHP-Entwicklung werden außerhalb des
    Betriebs durchgeführt, häufig geschieht aber auch während der Arbeitszeit. BizChek
    unterstützt diese Aktivität, der die entwickelte Module direkt im System zurückführt
    und zu zahlreichen PHP-ulen beitragen, einschließlich MCAL, IMAP, FTP und Asphalt.
    Ursprünglich wurden diese Module für die Unterstützung von BizChek entwickelt,
    aber auch andere Programmierer davon profitieren konnten und die Entwickler das
    Bedürfnis haben, der Gemeinschaft etwas zurückzugeben, indem Erweiterungen zum
    Kerncode von PHP hinzugefügt. Einige BizChek-Angestellten tragen auch zu kleineren
    Entwicklungen für Apache und Linux bei.


    # 8.1.3 Begierig nach Updates


    BizChek wurde bereits von der PHP-Version 2.0 auf die Version 3.0 umgestellt und
    kann die Betatestphase abgeschlossen sein. Die Migration von 2.0 auf 3.0 sowie
    von 3.0 auf die 4.0-Betaversion ging ohne Komplikationen ein und erforderte nur
    einige Änderungen.


    Das gesamte System besteht aus ungefähr 200 Dateien und bis 35 Tausend Programzeilen
    und wechselt täglich. Für dieses Update nun etwa 20 Programzeilen geändert werden
    müssen, sind die BizChek-Entwickler mit der hervorragenden Rückwärtskompatibilität,
    die PHP bietet, sehr zufrieden.


    Dem Vorhaben von BizChek, PHP 4.0 zu verwenden, das intern bereits getestet ist,
    steht nur die Besorgnis entgegen, Betaversionen als ein Produkt einzusetzen. Die
    Firma begrüßt die Updates im Bereich der Array-


    352'
