  md: '# 2.4 PHP und objektorientierte Programmierung


    Anfang der 90er Jahre lernten die besten bekannten Compiler – wie z.B. die Familie
    der Borlandcompiler – mit objektorientierten Programmierungserweiterungen (OOP)
    von „Basissprachen“ wie Pascal und C umzugehen. Plötzlich wurden Begriffe wie
    Klassen, Objekte, Schablonen und Vererbung zu Schlagworten schlechthin, den heißsten
    Themen der Softwareentwicklung. OOP war hip und viele Firmen kamen auf den Zug,
    indem ihre Softwarepakete von prozeduralen auf objektorientierte Programmierung
    umstellten. Zwischenzeit ist die Euphorie verblasst, aber eine Sprache, die keine
    Objekte handhaben kann, wird immer noch als ausreichend betrachtet. Im folgenden
    Abschnitt werden wir die Vor- und Nachte der objektorientierten Programmierung
    mit PHP erörtern.


    Wir halten die Entwicklung zu einer objektorientierten Softwareentwicklung für
    ein wenig zweifelhaft. Große Sprachprogramme wurden ohne finanziellen Aufwand
    umwandelt – ohnehebliche Zeitaufwand für denler zur Nekonzeption, Umstrukturierung
    und Neuinstallation von Tausenden von Programzeugen. Diese beispielsweise liefen
    mit prozeduraler Programmierung hervorragend und viele von ihnen benötigen überhaupt
    Objektunterstützung. Wir haben Werbung für Softwaresysteme, die besagte »nun komplett
    neu implementiert mit objektorientierter Programmierung«. Alles was diese Systeme
    waren, war ein Dongle (ein kleines Gerät, das in den Parallelport PC eingesteckt
    wurde und als Hardwarechlüssel dient) um zu überprüfen, möglicherweise nach einem
    Passwort zu fragen sowie in einigen Fällen die ausführbaren Programme zu verschlüsseln,
    mit denen sie verknüpft waren. Die Anwendungen, die sich auf diese Pakete stützten,
    mussten häufig nicht eine besondere Prozedur starten, um Passwortprüfung einzuleiten.
    Einige wurden automatisch ausgeführt, sobald die Anwendung gestartet wurde. In
    anderen Fällen wurde die Überprüfung der Umgebung auf einen Funktion beschrieben.
    Wer braucht jedoch ein Objekt für eine einzelne Funktion? Intern war die Ausführung
    des Programcodes streng linear und der Hardwarezugriff von separaten Prozeduren
    verwaltet (und einige der Anzeigen schlichtweg verloren).


    Der fragwürdige Fall, dem wir begegnet, war ein Entwickler, der an einer Bibliothek
