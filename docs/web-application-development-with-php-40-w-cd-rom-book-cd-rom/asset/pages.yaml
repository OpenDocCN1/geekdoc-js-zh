  md: 'vom Benutzer zu konfigurierende, Anfragen. Mit der Zeit wurde der Code zu umfangreich,
    um ihn zu pflegen, und wurde durch eine Lösung ersetzt, komplett in PHP und C
    geschrieben. Die derzeit laufende Beta-Version ist fünfmal schneller als Java-Produktionssystem
    und hat noch viel Raum für Optimierungen.


    Im System wurden keine fundamentalen Mängel gefunden, die die relativen Pfade
    in der include()-Anweisung zu einiger Frustration führ, insbesondere bei verschachtelten
    `includes`. Die C-Quelle- und Headerdateien werden als Basis für die relativen
    Pfade ihr eigenes Verzeichnis, während die `include`-Anweisung von PHP das Verzeichnis
    des ursprünglichen Ordners verwendet. Ein eigenes Verzeichnis für `includes` zu
    pflegen und Dateien aus einer hierarchischen Verzeichnisstruktur heraus zu referenzieren,
    kann kompliziert. Deshalb entschloss man sich, eine Variable für `include` zu
    erzeugen, und bei die Einbindung der Headerdateien ohne absolute Pfade zu verwenden.


    In PHP 3.0 war es äußerst schwierig, nutzerspezifische Erweiterungen zu integrieren.
    MarketPlayer.com hat PHP 4.0 bereits getestet und ist die Version sehr glücklich.
    Solange der Betatestphase noch abgeschlossen ist, ist ein Einsatz auf Produktionsservern
    noch zu empfehlen. Der verwendet MarketPlayer.com die Version 3.0.12.


    Bei Betrachtung aller Aspekte konnte MarketPlayer.com keine Einschränkung durch
    folgende Komponenten in PHP feststellen. Es besteht lediglich ein Tool zur Fehlersuche,
    das PHP benötigt, wenn jemand dies entwickelt hat. In unmittelbarer Zukunft wird
    jedoch ein einfacherer Mechanismus zur Erweiterung der Funktionalität benötigt,
    der mit wenig Overhead durch einen `dl()`Aufruf entsteht oder der PHP-Quelcode
    direkt modifiziert muss.


    # 8.3.5 Bewältigung im Alltag


    Die Anwendungen von MarketPlayer.com reichen von einzelnen Skripten bis zum kompletten
    Websiteverarbeitungspaket. Insgesamt sind es mindestens 10.000 Programzeilen in
    PHP und für das nächste Quartal werden etwa 40.000 geplant. Als Teil des Entwicklungsprozzes
    wären übliche Funktionen zu eingebetteten Funktionen, die in C realisiert wurden
    und deren C-Code schließlich in Bibliotheken integriert wurden, die von niedrigen
    Integratoren generiert werden können. Diese Strategie der Top-Down-Programmierung
    garantiert, dass der Fokus nicht auf der Codeproduktion, sondern auf auf der Produktentwicklung
    liegt, was im Bereich der Entwicklung von Webinhalten unerlässlich ist.


    PHP hat sich als skalierbar und schnell erwiesen, dass es von MarketPlayer.com
    auf Websites mit hohem Datenverkehr keine Störungen verwendet'
  merge: -1
