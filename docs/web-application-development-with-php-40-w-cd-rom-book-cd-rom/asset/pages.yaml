  md: '# 7.2 PHP und XML


    > **Hinweis:** Wenn Sie mit dem grundlegenden Konzept von XML vertraut sind, können
    Sie die nächsten Abschnitte, in denen wir eine kurze Einführung in XML geben,
    überspringen und direkt im Abschnitt über PHP und Expat fortfahren.


    # 7.2.1 Was ist XML?


    XML (Extensible Markup Language) ist eine Meta-Auszeichnungssprache für Dokumente,
    die strukturierte Informationen enthalten. Gehen wir als Satz noch einmal durch:


    +   * XML ist erweiterbar (englisch: extensible). Nehmen wir HTML: Das Tag <h1>
    bezeichnet eine Überschrift erste Ebene. In HTML hat das Tag keine Bedeutung,
    bis man ihm durch eine zusätzliche Regel (der Document Type Definition (DTD)),
    eine Bedeutung bekommt.


    +   * XML dient der Auszeichnung (english: markup). Genau wie HTML (das zumindest
    theoretisch keine Layoutinformationen enthält) hat XML keine.


    +   * XML ist eine Metasprache (english: meta language). XML hat keine feste Anzahl
    von Tags, sondern besitzt eine Funktion zur Definition von Tags.


    +   * XML arbeitet mit Dokumenten. Holzmerkung: es ist begrenzt auf Daten! Dokumente
    können aus einer Datenbank, über das Netzwerk oder aus Dateien bestehen.


    +   * XML definiert strukturierte Informationen. Es fasst einzelne Teile von Daten
    in größeren Konstrukten zusammen, die eine Bedeutung in einem Kontext setzen und
    sie in eine strukturelle Beziehung.


    # Strukturierte Information


    Es gibt Schlüsselkonzept, das Sie verstehen müssen, wenn Sie XML verwenden: strukturierte
    Dokumente oder eleganter ausgedrückt – strukturierte Informationsauszeichnung.
    Die strukturierte Auszeichnung definiert explizit den Aufbau und den semantischen
    Inhalt (die kontextuelle Bedeutung) eines Dokuments. Das hat keinen Einfluss auf
    die Art und Weise, wie in der Dokument für den Leser erscheint. Die Interpretation
    der Daten (syntaktische Analyse, Layout usw.) bleibt der bearbeitenden Anwendung
    überlassen. Nehmen wir mehrere Sätze, die zusammengehören und eine logische Einheit
    bilden. Das Tag an sagt nichts darüber, wie der Ansatz im Browser wiedergegeben
    wird. Der Browser könnte davor oder danach eine Leerzeile einfügen, die erste
    Zeile einziehen oder einen Zeilenraum um den Absatz ziehen. Hier geht'
