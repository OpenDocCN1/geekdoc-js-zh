    # Ist Ihr Programcode zweisprachig? Designprach?


    Eine der häufigsten Kritiken an Programcode betrifft die «Verstalichichung«, die
    Durchsetzung der Programmiersprache (die normalerweise einen englischen Ursprung
    hat) mit einer anderen Sprache. Im Fall (Talles ist Italier, ist Deutscher) haben
    wir bei der Durchicht von Projekten lokaler Programmierer festgestellt, dass viele
    deutsche durch italienische Variablen- und Funktionsnamen englischer Namen vermischt.
    In Ihren Briefwechseln verwenden Sie vermutlich eine Mischung aus Englisch, Französisch,
    Spanisch oder Ähnlichem. Warum sind Sie das nicht auch bei der Programmierung
    konsequent und verwenden in PHP englische Namen? Dies hilft auch daran zu verstehen,
    was Sie geschrieben haben.


    # 1.3.5 Generieren von klaren und konsistenten Schnittstellen


    Es geht Ihnen vielleicht auf die Nerven, schon wieder wie das Wort »konsequent»
    zu hören, aber für die Entwicklung von Schnittstellen ist Konsequanz das A und
    O.


    Leider ist ein Negativbeispiel in PHP nicht greifbar.


    Beim Auto befindet sich das Gaspedal auf rechts und die Bremse auf der linken
    Seite. Wenn Sie ein neues Auto kaufen, erwarten Sie, dass dieselbe Anordnung ist.
    Sie erwarten, dass eine rote Amp »Stop und eine grüne Amp »Freie Fahrt» fährt.
    Genauauso ist es bei der Datenverarbeitung. Angenommen, Sie benutzen eine Bibliothek,
    um auf Dateien zuzugreifen, und verwenden für jede Funktion eine Dateibearbeitungsroutine.
    Es wäre seltsam, wenn die Funktion, die zum Einlesen der Datei dient, die Routine
    als ersten Parameter erwartet, während die Schreibfunktion sie als letzten Parameter
    erwart, und die dritte Funktion irgendwo in der Mitte der Parameterliste erwartet.'
