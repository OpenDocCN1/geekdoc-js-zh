  md: "# PHP und objektorientierte Programmierung\n\n```\nclass extended_cart extends\
    \ shopping_cart\n{\n    function extended_cart()\n    {\n        shopping_cart::shopping_cart(\"\
    Mousepad\", 1);\n    }\n\n    function query($item)\n    {\n        return($this->item_list[$item]);\n\
    \    }\n}\n```\n\nDiese erweiterte Version des Objekts extended_cart besitzt einen\
    \ Konstruktor, der Konstruktor des Elternknotens aufruft, damit dieser den Rest\
    \ des Objektbaums korrekt initialisiert. Würde der Konstruktor des Elternknotens\
    \ nicht explizit von diesem Konstruktor aufgerufen, würde der Elternknoten nicht\
    \ initialisiert werden (und damit nicht der Elternknoten dieses Nodes).\n\nAußerdem\
    \ besitzt PHP einen Alias, der auf die aktuelle Instanz eines Objects zeigt. Dieser\
    \ Alias heißt this und gewährt Zugriff auf alle Mitglieder der aktuellen Instanz.\
    \ Er wird für alle Selbstbez benötigt, PHP innerhalb von Klassendefinitionen einen\
    \ lokalen Gültigkeitsbereich festgelegt.\n\n> Hinweis: PHP kann lokalen Gültigkeitsbereichs\
    \ innerhalb der Klassendefinitionen definieren, stellen sich sicher, dass das\
    \ Schlüsselwort this immer dann verwenden, wenn Sie innerhalb Ihres Objekts referieren.\
    \ Wenn Sie this vergessen, referenziert PHP automatisch auf den globalen Gültigkeitsbereich,\
    \ was fehlerrächtig ist!\n\n# 2.4.4 Konstruktoren\n\nKonstruktoren sind wie regul\
    \ Funktionen definiert, mit der Ausnahme, dass ihre Namen mit dem Klassennamen\
    \ identisch sein müssen. Destruktoren kennt PHP nicht. Wie jede andere Funktion\
    \ können Konstruktoren Argumente besitzen, selbst optionale Argumente sind zugelassen\
    \ (weitere Informationen zu optionalen Parametern finden Sie weiter unten im Abschnitt\
    \ über variable Argumentenlisten)."
