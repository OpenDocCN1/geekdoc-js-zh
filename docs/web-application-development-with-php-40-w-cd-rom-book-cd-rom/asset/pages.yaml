  md: 'ben wurden. Eine ausführliche Beschreibung aller Methoden und Attribute der
    einzelnen Instanzen finden Sie in der Spezifikation.


    # Document


    Die Schnittstelle Document ist der Stammknoten des Strukturbaums. Diese Schnittstelle
    kann nur ein Element enthalten, und zwar das Stammelement des XML-Dokuments. Darüber
    hinaus kann sie die mit diesem Dokument verknüpfte Dokumententypypdeklaration
    enthalten (organisiert in der Schnittstelle DocumentType) und sofern verfügbar,
    Verarbeitungsbefehle und Kommentare außerhalb des Stammelements.


    Da alle anderen Knoten des Knotens Document befinden, besitzt die Schnittstelle
    Document eine Reihe von Verfahren, um Unterknot zu erzeugen. Mith Hilfe dieser
    Funktionen können Sie ein vollständiges XML-Dokument mittels eines Programs erstellen.
    In der Spezifikation ist dies eine Methode namens getElementsByTagName(tagName)
    definiert. Diese dient dazu, Elemente mit einem bestimmten Tag-Name im Dokument
    auszulesen.


    # DocumentFragment


    Der Knoten DocumentFragment stellt einen Teil eines komplexen XML-Dokuments dar.
    Er ist notwendig, Teile eines Dokuments anzuordnen oder einen Teil zu extrahieren.
    Dafür benötigen Sie ein Objekt, um das entnommene Fragment zu speichern. Stellen
    Sie sich vor, Sie wollen eine einzelne Buchdatei aus vielen verschiedenen Kapitieldateien
    erstellen. Jedes Kapitel könnte in einem DocumentFragment-Objekt abgelegt sein
    und in die Dokumentstruktur des Buches eingefügt wenn Sie die Möglichkeit haben,
    Fragmente eines Dokuments zu organisieren, müssten Sie alle Elemente nacheinander
    im Buchdokument hinuzufügen.


    Die Spezifikation macht es zwar noch einfacher, indem sie festlegt, dass das Einfügen
    von DocumentFragment in einen Knoten nicht DocumentFragment selbst, sondern nur
    die Tochterknoten von DocumentFragment in den Knoten eingefügt werden.


    # DocumentType


    Der Knoten DocumentType enthält, sofern vorhanden, die Dokumententypdeklaration
    eines Dokuments. Diese Schnittstelle hat nur Les-Status und kann nicht vom DOM
    aus geändert werden.


    # Element


    Jedes Element in einem Dokument wird durch einen Element-Knoten repräsentiert.
    Den Namen eines Elements können Sie mit dem Parameter tagName ermitteln. Außerdem
    definiert diese Schnittstelle eine Reihe von Funktionen, um Elementattribute zu
    setzen und zu erfassen und um auf Unterelemente zuzugreifen.'
