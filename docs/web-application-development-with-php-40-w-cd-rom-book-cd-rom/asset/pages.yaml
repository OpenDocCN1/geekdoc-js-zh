    Für gewöhnlich arbeiten Sie Ihre Datenbank nicht wöchentlich, sodass dies möglicherweise
    nicht von so großer Bedeutung ist. Selbst mit PHLib ist Portierbarkeit zwischen
    Datenbanken ein Gedankenspiel, sogenannte Sie nicht bei Beginn der Projektplanung
    einzubeziehen. In der Praxis zeigt es sich, dass das Problem die Portierung der
    API ist, sondern die datbanksspezifischen Funktionen. Einen wirklich portierbaren
    Datenbankcode können Sie nur erzeugen, wenn Sie akzeptieren dass Sie spezifische
    Funktionen eines RDBMS verwenden. Dies führt dazu, dass Sie die Funktion in Ihrem
    Programmcode neu erzeugen müssen, was die Anwendungen möglicherweise schwerer
    zu pflegen und langsamer machen macht.


    Wenn Ihr Ziel ist, portierbaren Code zu programmieren, müssen Sie die speziellen
    Eigenschaften der zugrunde liegenden Datenbank umgehen. PHLib kann diese Aufgabe
    etwas vereinfachen. Das ist beispielsweise eine integrierte Sequenzverarbeitung
    und einfache Tabellenmechanismen, die datenbankunabhängig arbeiten. Vor Kurzem
    haben PHLib-Entwickler die Klasse Query entwickelt, welche welche Abfragen, Aktualisierungen,
    where-Anweisungen sowie andere, etwa 80% der normalen Datenbankverwendung abstrahiert,
    um diese Abfragen datenbankunabhängig zu gestalten. Bisher funktioniert diese
    Klasse für MySQL und Oracle 7 (und höher).


    Die Datenbank-Abstraktionsschicht von PHLib hat noch zwei weitere Funktionen,
    die mindestens genauso gut sind wie Portierbarkeit, und sich in ihren täglichen
    Anwendungen wirklich zeitsparend auswirken. Diese Funktionen werden wir in den
    folgenden Abschnitten beschreiben.


