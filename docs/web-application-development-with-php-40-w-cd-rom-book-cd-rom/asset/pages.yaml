    # 3.7 Implementierung


    Die Chat-Verbindung sollte ähnlich wie das Haupt-Skript installieren lassen. Dazu
    wird ein Befehl gestartet, der sich mithilfe von phpIRC im IRC anmeldet und versucht,
    als IRC-Operator die Web-Schnittstelle zu registrieren. Danach werden er weitere
    Befehle der Web-Schnittstelle. Diese Befehle werden in einem entfakteten Datenbankbankbasierten
    Datenbankabruf ausgegeben. Der Bot frag in regelmäßigen Abständen eine Tabelle
    in der Datenbank, welche die Eingabebefehle für ihn enthält. Die Befehle werden
    von der Web-Schnittstelle in die Datenbank eingefügt und bestehen aus einer Funktion,
    einer Sitzungsnummer und einem Parameter. Sobald der Bot einen Befehl in der Datenbank
    findet, führt er diesen aus und schreibt die Ergebnisse des Befehls zusammen mit
    der Sitzungsnummer in eine Ausgababelle. Die Web-Schnittstelle muss daher nur
    einen Befehl mit einer selbstgenerierten Sitzungskennnummer schreiben und warten,
    bis ein Datensatz mit derselben Sitzungskennnummer in der Ausgababelle auftaucht
    (siehe Abbildung 3.11).


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_160_0.png)


    Abbildung 3.11: Datenbankbasierte RPC-Kontrolle über den Verwaltungs-Bot


    Diese Methode ermöglicht eine flexible Fernkontrolle über den Bot.


