    \ wir uns an, wie die Klasse Template mit dem Konzept funktioniert. Eine wichtige\
    \ Klasse der Template bilden die Handles. Handles ohne Linkbezeichen (Ressourcen-Index):\
    \ sie zeigen auf einen bestimmten Datensatz und können in verschiedenen Funktionen\
    \ als Referenz für diesen Datensatz verwendet werden. Sie sind aber einer der\
    \ folgenden Arten:\n\n+   - set_file() erzeugt einen Handle für einen Schablonendate\n\
    - set_var() erzeugt einen Handle für einen Platzhalter innerhalb einer Schablone\n\
    - set_block() erzeugt einen Handle für einen Block innerhalb einer Schablone\n\
    \nMit dieser Funktion können Sie die zu erzeugenden Handle angeben. In set_file()\
    \ und set_var() wird der zu erzeugende im ersten Argument angegeben (bzw. im Schlüssel\
    \ Array, der als assoziatives Array übergeben wird). In set_block() wird der Handle\
    \ von zwei Argumenten angegeben. In Funktionen wie parse(), subst() oder get_undefined(),\
    \ verwenden Sie den zuvor erzeugten Handle, um auf den Datensatz zu referenzieren,\
    \ den Funktionen verarbeiten. Für die Funktion ist es uner, wie der Handle erzeugt\
    \ wurde. Sie arbeiten somit mit ganzen Schablonendateien auch mit Platzhaltern\
