  md: '# 5 Grundlegende Webanwendungsstrategien


    Euro als offizielle Währung der Europäischen Gemeinschaft. Wenn hier die Programmlogik
    nicht klar von den Daten getrennt wurde, müssten beide Stufen geändert werden.
    In der Datenüberprüfung einprogrammierte Kurswerte müssten genaueuert werden wie
    das Datenspeicherbeiträge.


    Milfe eines mehrstufigen Ansatzes können sie alle Konzepte klar von einander trennen.


    # 5.4.2 PHP und mehrstufige Anwendungen


    Das Konzept des mehrstufigen Systems gewann in den frühen 90er Jahren Beliebtheit
    und etabliert sich inzwischen zunehmend als Firmenprogrammarchitektur des ausgehenden
    20. und beginnenden 21. Jahrhunderts. Eine mehrstufig (häufig als dreistufig bezeichnete)
    Architektur bietet eine größere Skalierbarkeit für Anwendungen, eine geringere
    Datenpflege und bessere Wiederverwendbarkeit von Modulen. Eine dreistfige Architektur
    bietet eine technologie unabhängige Methode in Richtung von Client/Server-Anwendungen
    für Hersteller, die Standardschnittstellen einbeziehen und für jede logische Dienst
    Dienste bereitstellen. Betrachten Sie die dreistufige Modell in Abbildung 5.5
    – kommt es Ihnen als Webanwendungsentwickler nicht bekannt? In der ersten Stufe
    ist ein Client. Übertragen auf die Welt der Webanwendungen entspricht dies offensichtlich
    PHP (und dem Webserver als Hostchner), während die dritte Stufe ein RDBMS bestellt.


    Wenn Sie PHP verwenden, arbeiten wir mit einem einfachen mehrstufigen Modell,
    und zwar so auf eine kohärente Weise, wie es sich um kohärente Weise zu beken.
    Etwas Besonders als ist die Verwendung von PHP als Anwendungsserver. Seit unserer
    Version 4.0 war PHP darauf ausgerichtet, Softwaobjekte direkt zuzugreifen, und
    daher nicht das beste Werkzeug für Geschäftsszenarien mit ähnlichen Anforderungen.
    Dies hat sich geändert und wir halten es für eine der größten Erruschungen von
    PHP. Mit der aktuellen Versionen können sich nicht mehr COM-Bedenelemente in WIN32-Systemen
    verwenden, sondern auch Java-Befehle auf beliebigen Systemen mit einer Java-Virtual-Machine
    (JVM) auszuführen.


    Es gibt Standardarchitekturen für eine firmweite Wiederverwendung von Objekten:
    (DCOM) von Microsoft, JavaBeans/RMI von Sun Microsystems und CORBA von der Object-Management-Group.
    Aufgrund der weit verbreiteten Verwendung von Windows-System wird COM am häufigsten
    eingesetzt (Einzelheiten über die Verwendung von PHP und COM finden sich im nächsten
    Abschnitt). Unternehmen mit heterogeneren Umgebungen bevorzugen Java oder CORBA,
    da sie mehr Plattformen unterstützen.'
