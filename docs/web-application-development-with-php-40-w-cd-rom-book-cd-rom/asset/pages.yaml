  md: 'Sofern erforderlich wird das dynamisch ladbare Modul durch Aufruf der Funktion
    dl() geladen. Diese Funktion sucht nach dem angegebenen Shared Object, ist dass
    und stellt PHP Funktionen zur Verfügung. Das Modul exportiert die Funktion first_module(),
    die einen Parameter besitzt, konvertiert diese in eine ganze Zahl und gibt das
    Ergebnis der Konvertierung aus.


    Wenn Sie so weit gekommen sind, herzlichen Glückwunsch! Sie haben soeben Ihre
    erste Erweiterung von PHP generiert.


    # # 9.9 Fehlersuche


    Genau genommen ist es bei der Kompilierung von statischen oder dynamischen Modulen
    eine Fehlersuche möglich. Das einzige Problem, das auftreten könnte, ist dass
    der Compiler sich fehlende Definitionen oder Ähnliches beschwert. Stellen Sie
    in diesem Fall sicher, dass alle Headerdateien verfügbar sind und Sie Ihren Pfad
    im Kompilierbefehl korrekt angeben haben. Um sicher zu gehen, dass Sie an der
    richtigen Stelle sind, extrahieren Sie ein PHP-Verzeichnis und nutzen Sie die
    automatische Erstellung im Verzeichnis mit den frischen Dateien von CD-ROM. Dies
    garantiert eine sichere Umgebunggebung. Wenn dieses Verfahren fehllschlägt, versuchen
    Sie es mit manueller Kompilierung.


    Möglicherweise beschwert sich PHP auch auch über fehlende Funktionen in Ihrem
    Modul (Sollte dies bei Beispieldateien nicht passieren, werden Sie diese nicht
    verändern müssen). Wenn die Namen der externen Funktionen, die Sie mit Ihrem Modul
    zugreifen möchten, falsch geschrieben sind, verbleiben sie als «nicht verknpfte
    Symbole» in der Symboldatei. Während des dynamischen Ladens und Verknpfens durch
    PHP werden sie aufgrund der Schreibfehler nicht aufgelöst. Es gibt keine nach
    korrekten Deklarationen in Ihrer Moddatei oder oder falsch geschriebenen externen
    Funktionen. Beachten Sie, dass dieses Problem nur für dynamisch ladbare Module
    gilt. Bei statischen Modulen tritt es nicht auf. Fehler in statischen Modulen
    zeigen sich während der Kompilierung.


    # # 9.10 Einblick in die Quellen


    Nachdem Sie eine sichere Erstellungsumgebung haben und in der Lage sind, die Module
    in die PHP-Quelldateien einzubinden, sollten wir uns ansehen, wie alles zusammen
    funktioniert.'
