  md: '# Aufbau dieses Buches


    Dieses Buch ist in drei Teile unterteilt. Teil I «Erweitertesrichtung PHP» befasst
    sich mit der erweiterten Syntax von PHP, z.B. der dynamischen Funktionen und Variablen
    und dem selbstmodifizierenden Programmiercode. Er gibt einen Überblick über Projektplanungsprinzipien,
    Programmierstile und Programdesign. Dieser Teil bietet die notwendige Grundlage
    für eine schnelle und produktive Entwicklung von industriellen Webanwendungen.


    Teil II «Webanwendungen» konzentriert sich auf die Entwicklung der Software. Er
    geht darauf ein, welche Sitzungen wichtig, welche Sicherheitsrichtlinien sie beachten
    sollten, inieweit Tauglichkeit von Bedeutung sind und wie PHPLib für die Sitzungsverwaltung
    und den Datenbankzugriff nutzen können. Hier finden sich drei Fallstudien von
    Studentenprojekten, mit denen Sie Ihren IT-Manager überzeugen können.


    Teil III «Über PHP hinaus» ist für Leute, die mehr lernen wollen, was derzeit
    mit PHP möglich ist. Er zeigt, wie PHP mit C erweitert werden kann. Dies ist die
    offizielle Dokumentation über die Erweiterung von PHP, die durch Zend Technologies
    anerkannt wurde.


    Im Detail werden folgende Themen behandelt:


    +   Kapitel 1 – Entwicklungskonzepte


    +   Wenn Sie anspruchsvolle Projekte abwickeln müssen, ist die Verwendung von
    Kodierungskonventionen, richtige Planung und eine erweiterte Syntax ein absolutes
    Muss. Dieses Kapitel behandelt die allgemeinen Kodierungkonventionen, die für
    alle industriellen Projekte unerlässlich sind (Namens- und Kommentarkonventionen),
    und erläutert, welche Code in Module verteilt werden kann.


    +   Kapitel 2 – Erweitertes Syntax


    +   Dieses Kapitel befasst sich mit den erweiterten PHP-Syntax, z.B. mehrdimensionalen
    Arrays, Klassen, variable Variablen, selbstmodifizierender Programmcode und ähnliches.


    +   Kapitel 3 – Programmdesign: Ein Praxisbeispiel


    +   In diesem Kapitel gehen wir den Prozess zur Planung einer kompletten Webanwendung
    mit phpChat, einer Web-basierten Chat-Client-Schnittstelle für IRC. Dieses Kapitel
    führt die Planungsgrundlagen an, gibt Richtlinien zur Projektorganisation und
    zeigt, wie modulare pluginfähige Anwendungen entwickelt werden.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Einführung


    # Kapitel 4 – Webanwendungskonzepte


    Sitzungsverwaltung, Sicherheitsaspekte und Genehmigung sowie Tauglichkeit sind
    die Grundlage für alle Webanwendungen. Ohne die richtige Sitzungsverwaltung lassen
    sich Webanwendungen nicht ausführen. Sie müssen einen Weg finden, einen Benutzer
    während einer mehrseitigen Anfrage zu erkennen, wenn Sie Variablen, einen Einkaufkorb,
    einen speziellen Benutzer zuordnen müssen. Diese Identifizierung muss so sehr
    wie möglich sein, wenn Sie nicht wollen, dass die Kreditkarteninformationen eines
    anderen Benutzers werden. Tatsächlich sind spezielle Erwägungen erforderlich,
    um die Sicherheit in Ihren Anwendungen zu erhöhen. Auch PHP für ist weniger anfällig
    als alte CGI-Umgebungen, da sich sehr leicht passieren kann, dass Sie vollkommen
    ungeschützte Webanwendungen schreiben, wenn Sie einige wenige Prinzipien außer
    Acht lassen, die


    Dieses Kapitel führt die grundlegenden Tauglichkeitskonzepte ein. Sobald Sie nicht
    mehr von unabhängigen Skripten, sondern von Webanwendungen reden, fällt die Rolle
    des Benutzers mehr ins Gewicht. Immerhin ist es der Benutzer, der einen Fehler
    oder Misserfolg eines Projekts anzeigt. Dieses Kapitel zeigt Ihnen, wie Sie eine
    hohe Zufriedenheit bei Benutzer erreichen.


    # Kapitel 5 – Grundlegende Webanwendungsstrategien


    Dieses Kapitel erörtert weitere Grundlagen für Webanwendungen. Alle Webanwendungen
    verarbeiten beispielsweise Formulareingaben oder trennen die effektiv zwischen
    Layout und Programmcode. Weiterhin führt dieses Kapitel in die effektive Teamarbeit
    ein, indem es einen Überblick über Versionskontrolle mit CVS gibt. Schließlich
    werden mehrstufige Anwendungen, COM und Java aus PHP-Sicht besprochen.


    # Kapitel 6 – Datenbankzugriff mit PHP


    Ohne Datenbanken gibt es keine Webanwendungen. Kapitel 6 stellt PHPLib als Werkzeug
    für einen herstellerabhängigen Datenbankzugriff vor und gibt einen Überblick über
    andere Funktionen, Sitzungsverwaltung, Benutzerberechtigung und Genehmigungsverwaltung.


    # Kapitel 7 – Anwendungen der Spitzentechnologie


    Durch Entwicklung eines vollständigen Wissensbestands mit PHPLib macht dieses
    Kapitel mit PHPLib''s Schablonklasse, Selbstbeschreibung in SQL und anderen anspruchsvollen
    Themen vertraut. Anschließend gibt dieses Kapitel einen Überblick über XML und
    zeigt, wie Anwendungen von dieser aufreifenden Technologien profitieren können.
    Außerdem beschreibt dieses Kapitel die Schnittstelle von PHP für die XML-Syntaxanalyse
    und ihre WDDX-Funktionen.'
  merge: -1
