  md: '# 9 Erweiterung von PHP 4.0: Knacken wir den PHP-Kern


    nen eine Reihe von Toolfunktionen, die Ihnen viele Routineaufgaben, wie etwa die
    Ausgabe von informativen Texten, die automatische Einführung von Variablen in
    der Symboltabelle ausnehmen.


    Auch wenn dieses Kapitel häufig einen »referenzielen» Charakter annahm, hoffen
    wir, dass Sie einen Eindruck bekommen haben, wie Sie Ihre eigenen Erweiterungen
    schreiben. Als Platzhalter haben wir viel weggelassen. Wir empfehlen Ihnen, die
    Zeit zu nehmen, die Headerdaten- und einige Module näher anzusehen, insbesondere
    je im Verzeichnis ext/standard und das MySQL-Modul, das diese allgemein bekannte
    Funktion bieten. Durch Erfahrung erhalten Sie eine Vorstellung davon, wie andere
    Leute die API-Funktionen benutzt haben oder spezielle, die keinen Eingang in dieses
    Kapitel fanden.


    # 9.22 Referenz: Einige Konfigurationsmakros


    # 9.22.1 config.m4


    Die Datei config.m4 wird von buildconf verarbeitet und muss Anweisungen enthalten,
    die während der Konfiguration ausgeführt werden sollen. Hierzu können Befehle
    zur Überprüfung von externen Dateien, wie etwa Headerdaten, Bibliotheken usw.,
    genutzt werden. PHP definiert eine Reihe von Makros, die in diesem Prozess verwendet
    werden können. Die nützlichsten hiervon sind in Tabelle 9.18 beschrieben.


    | Makro | Beschreibung |

    | AC_MSG_CHECKING(Nachricht) | Gibt während der Ausführung von configure einen
    überprüenden <Nachricht>-Text aus. |

    | AC_MSG_RESULT(Wert) | Gibt das Ergebnis von AC_MSG_CHECKING aus; als Wert entweder
    eine oder nicht angegeben sein. |

    | AC_MSG_ERROR(Nachricht) | Gibt die Nachricht während der Ausführung von configure
    als Fehlermeldung aus und bricht das Skript ab. |

    | AC_DEFINE(Name, Wert, Beschreibung) | Fügt #define in php_config.h mit dem Wert
    und einen Kommentar hinzu, der aus der Beschreibung besteht (dies ist sinnvoll
    bei bestimmter Kompilierung Ihres Moduls). |


    Tab. 9.18: M4 Makros für config.m4'
  merge: -1
