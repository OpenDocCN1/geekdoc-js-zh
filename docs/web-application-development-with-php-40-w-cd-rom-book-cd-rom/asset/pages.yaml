  md: "# 7 Anwendungen der Spitzentechnologie\n\nDie beiden Methoden serialisieren\
    \ mehrere PHP-Variablen in einem WDDX-Element des Typs `struct`, ähnlich dem,\
    \ das in Listing 7.6 gezeigt wird. Die Funktion wddx_serialize_var() besitzt eine\
    \ beliebige Anzahl von String-Argumenten, welche die Namen der PHP-Variablen enthalten.\
    \ Als Ausgabe gibt die Funktion das WDDX-Packet zurück. Der Vorteil dieses Vorgehens\
    \ besteht darin, dass mehrere PHP-Variablen in einem WDDX-Paket serialisiert werden.\
    \ Beachten Sie jedoch, dass bei der Deserialisierung ein assoziatives Array errichtet\
    \ wird. Natürlich wird die ursprüngliche PHP-Variable dazu in einen WDDX-Tag umgewandelt.\
    \ Im Programmcode folgt ein einfaches Beispiel für wddx_serialize_var():\n\n```\n\
    $string = \"This is a string\";\n$int = 42;\nprint(wddx_serialize_var(\"string\"\
    , \"int\"));\n```\n\nDie drei Funktionen wddx_packet_start(), wddx_add_var() und\
    \ wddx_packet_end() arbeiten grundsätzlich auf dieselbe Weise: Auch wenn mehrere\
    \ PHP-Variablen in ein WDDX des Typs umgewandelt werden, Der Unterschied ist,\
    \ dass die Transaktion in drei Schritten stattfindet. Dies hat den Vorteil, sich\
    \ PHP-Variablen in einem WDDX-Packet langfristig hinzuzufügen, z. B. während einer\
    \ komplexen Berechnung. Im Gegensatz dazu arbeitet die Funktion wddx_serialize_var()\
    \ auf atomare Weise. Sie beginnt mit der Zusammenstellung eines Pakets, wenn die\
    \ Funktion wddx_packet_start() aufruft, das optionale Argument, den Header-Kommentar\
    \ für das WDDX-Packet. Diese Funktion gibt einen Paketbezeichner zurück, ähnlich\
    \ dem Dateibezeichner. Dieser Bezeichner wird als erstes Argument der Funktion\
    \ add_vars() verwendet. Die übrigen Argumente sind identisch mit denen, eine beliebige\
    \ Anzahl von Strings, welche die Namen der PHP-Variablen angeben. Ein weiteres\
    \ Beispiel ist:\n\n```\n$il = $12 = $13 = \"Foo\";\n$packet_id = wddx_packet_start(\"\
    This is a comment\");\nfor($i=1; $i<=3; $i++) {\n    wddx_add_vars($packet_id,\
    \ \"$i\");\n}\nprint(wddx_packet_end($packet_id));\n```\n\nDieses Beispiel führt\
    \ in einer for-Schleife dem WDDX-Packet drei String-Variablen hinzu und erzeugt\
    \ die folgende Ausgabe (auch hier wurden zur besseren Lesbarkeit entsprechende\
    \ Einzüge hinzugefügt):"
  merge: -1
