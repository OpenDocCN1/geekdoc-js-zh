  md: '# 7 Anwendungen der Spitzentechnologie


    +   - Häufigkeit dieser Information im Dokument

    - Anzahl der Zeicendaten in diesem Element

    - Alle gefundenen Elementterne

    - Alle Tocherelemente


    Hierfür muss das Skript zumindest das Elementelement des aktuellen Elements kennen.
    Wenn wir einen normalen XML-Parser verwenden, ist dies nicht möglich. Wir erhalten
    nur Ereignisse für das aktuelle Element. Es werden aber keine Kontextinformationen
    aufgezeichnet. Deshalb müssten wir eine eigene Stapelstruktur richten. Wir hätten
    einen FIFO-Stapel (First In, First Out) mit zwei Elementen verwenden können; aber
    um Ihnen einen besseren Eindruck über die Elementwechsel zu vermitteln, haben
    wir für einen FIFO-Stapel (First In, Last Out) entschieden. Dieser Stapel, der
    ein alle offene Element enthält. In der Bearbeitungsperiode für die offenen Elemente
    wird das aktuelle Element mit array_push() oben auf den Stapel gelegt. Danach
    entfernt die Funktion der Elemententkontrolle das oberste Element mit array_pop().


    **Hinweis:** array_pop() und array_push() sowie viele weitere Funktionen, die
    sich mit Arrays befassen, wurden in PHP 4 hinzugefügt. Wir wollten nicht PHP 3
    portieren, aber es ist schwierig, sich im gelegentlichen PHP 3 zurück zu portieren.
    Dies liegt an der Art und Weise wie unset() arbeitet. Um ein Element zu stapeln,
    brauchen wir folgende:


    ```

    unset($array[count($array)-1]);

    ```


    Wenn dies funktionieren würde, wäre es einfach, array_pop() zu implementieren.
    – es funktioniert nicht. Bei PHP hinterlässt unset() Löcher im Array. Es setzt
    den »Indexzahl« nicht zurück. Dies können sich leicht überprufen:


    ```

    $array = array("a");

    unset($array[0]);

    $array[] = "a"; var_dump($array);

    ```


    Das Element hat jetzt nicht den erwarteten Schlüssel 0, sondern 1. Dies führt
    zu fragmentierten Arrays – was für einen Stapel sehr ungünstig ist. Dies Verhalten
    in den anderen Elementen im Array begründet. Wenn das Loch entstehen würde, müsste
    das Array neu organisiert werden, was in vielen Situationen unerwünscht wäre.
    Um dieses Problem zu umgehen, bräuchten wir eine array_compact(), die zum Zeitpunkt
    der Herstellung von PHP nicht gab. Daraus können wir nur folgenden Schluss ziehen:
    Verwenden Sie PHP 4.0. In der PHP-Version 3 unseres Beispiels (siehe CD-ROM) mussten
    wir die Variable $depth verwenden, um die Elementwechselschachtelung'
