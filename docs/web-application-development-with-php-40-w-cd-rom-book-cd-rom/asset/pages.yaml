  md: '# Pearson Education


    # ADDISON-WESLEY


    PHP und XML


    Es ist jedoch keine gültige Dokument. In der XML-Spezifikation ist dies folgendendarmafin
    definiert: Ein XML-Dokument ist gültig, wenn ihm eine Dokumententyp-Deklaration
    zugeordnet ist und wenn das Dokument Regelbindungen entspricht, die darin genannt
    sind. Dies bedeutet, dass jedes gültige XML-Dokument auch wohlformt ist. Ein wohlformtes
    Dokument kann ungültig sein, wenn nicht die Syntax, in der zugehörigen DTD definiert
    wird. Ein nicht wohlformtes Dokument kann niemals gültig sein. Ein häufigschwender
    Fehler, werden XML-Parser an dieser Stelle angewiesen, die Verarbeitung abzzuführen.
    Die Unterscheidung zwischen gültig und wohlformt ist für XML wichtige Bedeutungen:
    Dies führt zu zwei Klassen von Parsern, welche die Gültigkeit eines XML-Dokuments
    prüft, und eine, die dies nicht nötig ist: Parser mit Gültigkeitsüberprüfung und
    Parser ohne Gültigkeitsüberprüfung. Ein Designziel der XML-Spezifikation ist die
    einfache Anwendbarkeit für Programmierung. Für einen durchschnittlichen Programmierer
    ist es tatsächlich recht einfach, einen Parser ohne Gültigkeitsprüfung zu schreiben.
    Ein Parser mit Gültigkeitsprüfung zu schreiben, ist dagegen eine ganz andere Sache.


    Die Unterscheidung zwischen gültig und wohlformt unterteilt XML-Anwendungen in
    zwei Kategorien. Eine Gruppe von Anwendungen betrachtet XML als erweitertes Datenspeicher.
    Wohlformte Dokumente werden zur Datensicherung und Anzeige verwendet. Für diese
    Aufgabe ist eine DTD nicht notwendig, ein wohlformtes Dokument reicht aus. Mit
    diesem Ansatz können Programcodes bis zu einem gewissen Grad wiederverwendbar,
    z. B. können den Code zur Analyse der Daten und zur Erzeugung der Tags in späteren
    Anwendungen wiederwenden. Sobald jedoch Informationen als Informationen austauschen
    (und nicht mehr reine Daten), müssen Sie dem Dokument eine Bedeutung geben und
    es mit einer DTD verknüpfen. Für Anwendungen, die sich mit der Verarbeitung und
    Austausch von Informationen befassen, sind nur gültige Dokumente zulässig.


    Nachdem Sie die Grundlagen von XML und verwendete Themen kennen gelernt haben,
    wollen wir die gewonnenen Erkenntnisse in der Praxis umsetzen, wenn wir uns Expat
    ansehen, einen Parser ohne Gültigkeitsprüfung, der in PHP integriert ist.


    # 7.2.6 PHP und Expat


    Expat ist der Parser, für die XML-Verarbeitung in Mozilla, Apache, Perl und vielen
    anderen zuständig. Er ist seit der Version 3.0.6 in PHP eingebunden werden und
    ist Teil der offiziellen Apache-Distribution seit der Apache-Version 1.3.9. Da
    Expat ein Parser ohne Gültigkeitsprüfung ist, ist er schnell und klein und eignet
    sich damit für Webanwendungen.


    317'
