    zur Programmentwicklung, die Sie direkt an dem vorgeschlagenen Beispiel Projekt
    ausprobieren können (oder allgemein an phpChat) und für Ihr nächstes Projekt merken
    sollten.


    > Hinweis: eine mehr theoretische und kürzere Erörterung zum Thema Programmentwicklung
    finden Sie in Kapitel 7 »Anwendungen der Spitzentechnologie«..


