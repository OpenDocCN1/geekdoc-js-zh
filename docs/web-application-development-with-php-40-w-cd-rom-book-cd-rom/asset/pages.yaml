  md: '# 9 Erweiterung von PHP 4.0: Knacken wir den PHP-Kern


    To use your new extension, you will have to execute the following steps:


    ```

    $ cd ..

    $ ./buildconf

    $ ./configure (your extension is automatically enabled)

    $ vi ext/my_module/my_module.c

    $ make

    ```


    Repeat the last two steps as often as necessary.


    Diese Erweiterung erzeugt die zuvor erarbeiteten Dateien. Um das neue Modul in
    den automatischen Konfigurations- und Erstellungsprozess zu integrieren, müssen
    Sie buildconf benutzen. Dadurch wird das Skript configure neue Dateien generiert,
    indem das Verzeichnis einen durchsucht und alle gefundenen config.m4-Dateien eingebunden
    werden.


    Bei der Ausführung von configure werden alle Konfigurationsoptionen analysiert
    und, basierend auf diesen Optionen und den, die Sie in Makefile angeben, ein Makefile
    generiert.


    Listing 9.1 zeigt die generierte Datei Makefile.in:

    # ID: Extending_Zend.xml,v.22 2000/05/22 20:02:58 till Exp $


    ```

    LTLIBRARY_NAME = libmy_module.la

    LLIBRARY_SOURCES = my_module.c

    LIBRARY_SHARED_NAME = my_module.la


    include $(top_srcdir)/build/dynlib.mk

    ```


    Listing 9.1: Die Standard-Makefile


    Dies ist über nicht zu erzählen: Sie enthält die Namen der Eingabe- und Ausgabateien.
    Sie könnten auch Erstellungsanweisungen für andere Dateien angeben, wenn Ihr Modul
    aus mehreren Quellendaten zusammens.


    Die Standard-config.m4-Datei, die in Listing 9.2 steht, ist etwas komplexer:

    # ID: Extending_Zend.xml,v.22 2000/05/22 20:02:58 till Exp $

    dnl config.m4 for extension my_module

    dnl not forget to call PHP_EXTENSION(my_module)


    If your extension references something external, use with:


    ```

    PHP_ARG_WITH(my_module, for my_module support.

    dnl Make sure that the comment is aligned:

    [ --with-my_module Include my_module support))

    ```'
