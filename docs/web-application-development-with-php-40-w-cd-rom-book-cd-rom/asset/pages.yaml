  md: '# Kodierungskonventionen


    Bei der Entwicklung einer Schnittstelle sollten zunächst folgende Punkte überdenken:


    +   - Welche Daten sollen über die Schnittstelle ausgetauscht werden?

    - Welche Parameter brauche ich wirklich?

    - Welche Parameter werden üblicherweise von den meisten (oder) Schnittstellenfunktionen
    benutzt?

    - Welche Reihenfolge wäre für die Parameter logisch?


    Sobald Sie sich für eine bestimmte Vorgehensweise entschieden haben, halten Sie
    diese konsequent durch; machen Sie in Ihrem Modul Ausnahme von der Regel. Diese
    Strategie ermöglicht Ihnen, interne Funktionen der Schnittstelle zur Verfügung
    zu stellen. Außerdem werden es auch Ihrem Team-Mitglied, wenn sie neuen Programmcode
    in Ihr Mod integrieren müssen.


    Wenn Sie die Zeichenketten-Funktionen im PHP-Handbuch anschauen, finden Sie strpos(),
    strchr(), strr() usw. Alle diese Funktionen akzeptieren den Parameter haystack,
    welche die Zeichenkette ist, in welcher gesucht wird, und needle die Zeichenkette
    ist, nach welcher gesucht wird. Sehen Sie sich str_replace() an. Diese Funktion
    führt nicht nur einen neuen Namensschema ein, aber seine Argumente sind das genaue
    Gegenteil der übrigen Funktionen: sie akzeptiert string needle, string haystack.


    Als wir den Grund für diese Diskrepanz erfielten, erhielten wir die Antwort, dass
    str_replace() der schnelle Ersatz für ereg_replace() ist und dass die Leute ihre
    Aufrufe von ereg_replace() (bei welcher umgekehrte Argumentfolge akzeptiert wird)
    in str_replace() ändern. Natürlich ist dieses Argument berechtigt. Aber wann akzeptieren
    die regulären Ausdruck ihre Argumente in einer der Zeichenketten-Funktionen eingengesetzten
    Reihenfolge? Weil diese Funktionen in PHP in C reflektieren. Bei der Entwicklung
    eines Programms ist es ärgerlich, wenn sich str_replace() vom Rest der Funktionsgruppe
    abhebt. Wenn Sie Schnittstellen Ihrer nächsten Bibliotheken entwickeln, achten
    Sie darauf, dass diese Situation bei Ihnen nicht vorkommt.


    # 1.3.6 Unterteilung des Programms in logische Gruppen


    Programme bestehen in der Regel aus mehreren Funktionsgruppen, die sich jeweils
    einer speziellen Aufgabe undoder einem Anwendungsbereich widmen. Beim Schreiben
    eines Datenbankgestützten Programms sollte eine Funktionsgruppe für den Datenbankzugriff
    verantwortlich sein. Dieser Programmcode stellt eine eigene Einheit dar und kann
    sich sicher vom übrigen'
