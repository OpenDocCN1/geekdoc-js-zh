  md: 'Alle anderen Nachteile der manuellen URL-Änderung bleiben jedoch bei dynamischen
    Pfaden bestehen.


    # Dynamische Pfade mit mod_rewrite


    Mit einem kleinen Trick können sich zumindest die ärgerliche manuelle Codierung
    der Sitzungsnummermere sparen. Wäre es, wenn die URL folgendmaßen aussähe:


    ```

    http://server.com/<session-id>/page.php3

    ```


    Hier betrachtet der Browser die Sitzungsnummer als Teil des Verzeichisses und
    würde sie bei jeder Anfrage verschicken. Wenn Sie dieses Format unverändert würden,
    würden sich allerdings nur der Fehler »File not found« erhalten, da kein Verzeichnis
    gibt, das wie die Sitzungsnummer aussiert. Wir brauchen eine Methode, die Sitzungsnummer
    aus dem Pfad zu entfernen, bevor der Webserver die URL tatsächlich nutzt.


    Hier kommt mod_rewrite ins Spiel. mod_rewrite ist ein Apache-Modul, das komple
    Umwandlungen von regulären Ausdrücken durchführt, bevor diese an den Apache-Server
    weiterleitet. Mit mod_rewrite können wir die Sitzungsnummer einfach aus der URL
    streichen. Dies ist eine interne Änderung der URL, die nur Apache sehen wird,
    nicht aber der Client. Apache sieht eine normale Anfrage ohne Sitzungsnummer,
    die aber nur in den internen Variablen für PHP verfügbar.


    # Einlesen von mod_rewrite


    Das Mod mod_rewrite wird nicht standardmäßig in Apache kompiliert. Informieren
    Sie sich in der INSTALL-Datei von Apache über die Anweisungen, mit denen Sie Apache
    mit diesem Modul kompilieren.


    Ein URL, lässt sich mit einer Umleitungsregel ändern


    ```

    http://server.com/b6ac8ca8e453cdc43e6078abf044cdb5/script.php3

    ```


    ```

    RewriteEngine On

    RewriteRule ^[0-9a-z]{32}(/+) $1

    ```


    Die erste Zeile weist mod_rewrite an zu starten. Die zweite Zeile zeigt explit
    ein Basisverzeichnis, das wir brauchen, wenn wir mod_rewrite in einem lokalen
    Kontext verwenden, z. b. in einer .htaccess-Datei. Die dritte Datei definiert
    schließlich den regulären Ausdruck, der die URL-Neuschreibung verwendet wird.
    Unser Ausdruck wirft die Sitzungsnummer einfach aus der URL raus.


    Um die Sitzung zu starten, verwenden wir eine ähnliche Funktion, die wir bereits
    geschrieben haben. Nur die anfängliche Umleitung ist anders.'
  merge: -1
