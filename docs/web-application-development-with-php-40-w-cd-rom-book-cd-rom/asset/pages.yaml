    # 2.7 Polymorphisierung und selbstmodifizierender Code


    Die Nachtile von variablen Funktionsnamen (und teilweise von variablen Variablennamen)
    ist, dass Sie statt einen «festen» Programteil haben müssen (im Fall der variablen
    Funktionsnamen eine Liste mit zuvor deklarierten Funktionen, die Sie verwenden
    können) und einen «variablen» Teil (der Teil, der die Funktionen in eine Variable
    umwandelt und dann die Funktion aufruft, diesen Namen erstellt wurde). Dies bedeutet,
    dass Sie für jeden möglichen Namen der eine Funktion generieren müssen, damit
    das Programm korrekt funktioniert – was eine Form von Beschränkung darstellt.


    Dies können durch vollständig dynamische Programmierung umgehen, indem Sie sich
    aus den «frühen» Tagen der Programmierung und wurde z. T. von Spielprogrammierern
    und Vireschreiben erinnern.


    Es ist knapp mit sich selbstmodifizierendem Programmcode. Bei den inneren Schleifen
    von Spielen, beispielsweise die Prozeduren, die zum Kopieren des Puffersinhalts
    den Bildschspeicher dient, war ist der kritische Faktor. Da die Verarbeitungszeit
    jedoch unschöpflich Quelle war und, mussten sich die Entwickler etwas einfallen
    lassen, um das Beste aus ihrem Werk herauszunehmen.


    Häufig mussten in der inneren Schleife eine Reihe von Entscheidungen getroffen
    werden. Wenn beispielsweise die Kopierroutine des Puffers bei bestimmten Ereignissen
