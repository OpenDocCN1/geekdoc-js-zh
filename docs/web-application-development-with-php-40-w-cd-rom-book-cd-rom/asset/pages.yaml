    # 3.5.5 Schnittstelle für Entwickler


    Eine Schnittstelle für Entwickler? Was hat das mit Chat zu tun? Und wie soll funktionieren?
    Die meisten Programme sind «unflexibel». Sie lassen sich nicht gar oder nur schwer
    durch einzelne Entwickler verändern. Bei benutzer-orientierten Programmen (zum
    Beispiel Desktop-Umgebungen, wie Windows, KDE, MacOS usw.) wird kaum jemand die
    Ideallösung finden. Ähnlich wie bei einem Chat-System werden die meisten Leute,
    die das herunterladen, bemerken: «Hey super, aber fühlt sich das als cool an,
    mag ich nicht, wie es sagt tut».


    Oh einen einfachen, klar ausgesgewiesenen, wie das Programm den Benutzer verändert
    werden, werden die meisten Anwendungen im Müll landen. Wenn die meisten Leute
    nicht einmal versuchen, ein Programm herunterzubasteln, das sie nicht selbst entwickelt
    haben,


    Für das Chat-Programm bedeutet dies, dass wir einen festen Programmkern entwickeln
    müssen (den Teil der Anwendung, den niemand jemals ändern muss oder soll), die
    Schnittstelle nur eine Reihe von Plugins besitzt (den Teil der Anwendung, den
    die meisten Leute irgendwo ändern möchten). Dadurch erreichen wir eine Unabhängigkeit
    von Programmcode und Schnittstellenlayout (indem wir eine Schnittstelle für HTML-Entwickler
    bereitstellen) sowie eine Unabhängigkeit der einzelnen datenverarbeitenden Stufenoneinander.'
