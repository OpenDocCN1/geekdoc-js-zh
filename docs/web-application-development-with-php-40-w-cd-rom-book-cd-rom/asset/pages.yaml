  md: '# PHP objektektorientierte Programmierung


    ```

    print("New object gets $new_object->var1, $new_object->var2.\

    $new_object->var3 <br>");

    ```


    Was glauben Sie, was hier als Ergebnis herauskommt? Das Skript deklariert zuerst
    eine Klasse, erzeugt eine Instanz und weist seinen drei Element Werte zu. Anschließend
    erzeugt eine neue Referenz auf dieses Objekt, welches seine Elemente neu und gibt
    jedes Element aus, wobei beide Referenzen verwendet werden. Bedenken Sie, es handelt
    sich um eine Instanz.

    Abbildung 2.7 zeigt das Ergebnis.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_76_0.png)


    Abbildung 2.7: Erzeugen einer Kopie an einer Referenz mit PHP


    Wenn Sie jetzt nicht überrascht sind, können Sie PHP recht gut oder haben noch
    nicht intensiv intensiv über Objekte nachgedacht. PHP hat nicht einfach eine neue
    Referenz von my_class erzeugt eine Kopie. Dies ist nicht das gewünschte Verhalten,
    da der Operator neu eigentlich im Speicherbereich eine Instanz von my_class erzeugen
    und einen Verweis auf diesen zurückgeben sollte. Wenn Sie diese Referenz einer
    anderen Variablen zuordnen wollen, sollte nur die Referenz kopiert werden und
    die Originaldaten unverändert bleiben, vergleichbar mit einer Dateisystemverknpfung,
    die einen Zugriff auf denselben Daten von verschiedenen Speicherten im Dateisystem
    ermöglicht. Dieses Verhalten von PHP – d.h. an der Referenz Kopien referenzierter
    Daten zu erzeugen – klingt nicht bedeutend, ist aber durchaus von Bedeutung.


    > Hinweis: Zum Zeitpunkt, dass dieses Handbuch erstellt wurde, verwendeten sowohl
    PHP 3.0 als auch PHP 4.0 die Kopiersynax. Ein Gespräch mit einem Mitglied aus
    der Kernentwicklung ergab, dass dieses Standardverhalten bald geändert wird und
    künftig eine Referenzverwaltung verwendet werden soll. Diese Änderung würde jedoch
    zum Verlust der Rückwärtskompatibilität führen. Die Änderung ist für die Version
    4.1 geplant. Danach wären alle Informationen hier für zukünftige Versionen nicht
    mehr gültig.'
