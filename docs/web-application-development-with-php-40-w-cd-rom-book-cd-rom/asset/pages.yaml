  md: "# 7 Anwendungen der Spitzentechnologie\n\nDer Entwurf von XML hat einige klar\
    \ definierte Ziele:\n\n+   - Es sollte einfach zu verwenden sein – sowohl für\
    \ Benutzer als auch für Entwickler, welche die XML-Parser erstellen. Die Komplexität\
    \ von SGML bedeutete eine Einschränkung, die beseitigt werden würde.\n\n+   -\
    \ XML sollte offen sein, um eine Vielzahl von Anwendungen und Protokolle zu unterstützen.\
    \ Es sollte keine Abhängigkeit zu einem einzigen einfreien Dokumententyp entstehen\
    \ wie bei HTML.\n\n+   - XML sollte eine strikte Syntax haben. Optionale Funktionen\
    \ können zu Komibilitätsproblemen führen, mehrere Benutzer ein Dokument gemeinsam\
    \ verwenden. Es gab die Befürchtung, dasselbe passiert bei HTML: mehrere konkurrierende\
    \ und nicht kompatible Programme entstehen.\n\n+   - XML zu SGML kompatibel sein.\
    \ Die Mitglieder der Entwicklungskomites waren auch in den SGML-Bemühungen einbezogen\
    \ und integrierte Daten aus SGML-Systemen.\n\nDie Entwicklung führte zu einer\
    \ frühen Spezifikation, die am 10. Februar 1998 vom World Wide Web Consortium\
    \ (W3C) als Empfehlung der Extensible Markup Language (XML) 1.0 beschrieben wurde.\n\
    \nXML unterscheidet sich von SGML: XML verzichtet auf viele der komplexeren und\
    \ weniger verwendeten Funktionen von SGML, und erzeugt eine neue, reduzierte SGML-basierte\
    \ Anwendung. Da es eine Untermenge von SGML darstellt, können sie ein XML-Dokument\
    \ mit jedem SGML-kompatibel System lesen lesen. Jede beliebige XML-Dokument ist\
    \ ein gültiges XML-Element.\n\nXML unterscheidet sich von HTML: Es vermeidet nicht\
    \ nur die schlechten Konzepte von HTML, sondern auch eine andere Syntax als HTML.\
    \ Zudem ist XML Unicode-fähig: Tags, Attribute und Inhalte in jeder Zeichentenkodierungen\
    \ enthalten, die von Unicode definiert sind.\n\nWir schauen uns einen Ausschnitt\
    \ aus dem Quellcode dieses Buches an:\n\n```\n<title>Cutting-Edge Applications</title>\n\
    <abstract>\n  <para>\n    If you realize that all things change,\n    there is\
    \ nothing you will try to hold on to.\n  </para>\n</abstract>\n```\n\nIn diesem\
    \ Beispiel sehen Sie die Verwendung von Tags, mit denen eine Strukturierung und\
    \ logische Ausnahme vorgenommen wird. Im Gegensatz zu HTML\n\n+   - unterschieden\
    \ Tags Klein- und Großreibung,\n\n+   - sind Leerräume bedeutend,"
