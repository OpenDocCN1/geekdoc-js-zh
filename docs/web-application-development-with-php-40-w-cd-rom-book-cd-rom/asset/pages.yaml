  md: '# 6.2.7 Seiten-Caching


    Mit der Klasse `Session` können Sie auch steuern, wie Seiten im Cache gepuffert
    werden. Die Variable `$allow_cache` kann nur auf `private` oder `public` gesetzt
    werden. Der Standardwert hängt von PHPLib-Version ab; bei Version 7.2 ist die
    Variable standardmäßig auf `private` gesetzt, bei höheren Versionen auf. Der Seiten-Caching-Mechanismus
    ähnelt dem, mit der ursprünglichen Session-Funktionen von PHP 4.0 bereitgestellt
    wurde.


    # 6.2.8 Serialisierung


    In PHP 3.0 konnten Objekte nicht einfach serialisieren. Die Funktion `serialize()`
    bewahrte die Klassenmethoden nicht korrekt und es gab keine Möglichkeit dies manuell
    zu tun. Der PHP 3.0-Unterstützung für Objekte fehlt eine wichtige Funktion: Introspektion.
    Es gab keine Möglichkeit, den Namen einer Klasse oder den Namen Elternklasse zu
    erfahren. musste PHPLib einen Umweg gehen: Er benötigte `$classname` und zwei
    zusätzliche Werte hatten, namens `$persistent_slots`. Diese gaben den Namen der
    Klasse bzw. der Klassenvariablen für die Serialisierung an. Mithilfe des Klassennamens
    konnte PHPLib einen PHP-Code generieren, der die Instanz der Klasse `$class =
    new class;` erzeugt und diese im Datenarchiv speichert. Sobald die Session-Daten
    wieder aufgerufen wurden, wurde der Code mit `eval()` ausgeführt. Erinnern Sie
    sich an das selbstmodifizierende Zählbeispiel aus Kapitel 2 »Erweiterte Syntax»
    PHPLib verwendet dieselben Konzepte.


    > Hinweis: In PHP 4.0 ist dieser Umweg nicht mehr erforderlich. PHP 4.0 besitzt
    Funktionen, wie `get_class()` und `get_parent_class()`, die eine bessere Introspektion
    der Klassen ermöglichen. `serialize()` funktioniert inzwischen für Objekte transparent.


    # 6.2.9 Session-Beispiel


    Für Ihre tägliche Arbeit ist die Verwendung von PHPLib-Session-Objekten genau
    so einfach wie die Verwendung der PHP 4.0-Session-Bibliothek. Das Beispiel in
    Kapitel 6.3 zeigt dies sehr deutlich. Ist dasselbe wie das Beispiel in Kapitel
    4:


    ```

    // Create a new instance manually

    $sess = new Example_Session;

    ```


    ```

    // Start the session

    $sess->start();

    ```


    ```

    // Register our session variable

    $sess->register("counter");

    ```'
