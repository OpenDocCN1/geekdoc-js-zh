- img_proc: true
  md: '# 4 Webanwendungskonzepte


    +   Zeigen Sie nur die Informationen, die der Benutzer zum Erreichen seines Ziels
    tatsächlich braucht.


    +   Stellen Sie Standardwerte zur Verfügung. Tragen Sie beisielsweise in ein Datumsfeld
    eines Formulares bereits das aktuelle Datum ein.


    +   Zwingen Sie den Benutzer nicht auf unnötige Schritte durchzuführen. Zeigen
    Sie beisielsweise Fehlermeldungen nicht auf einer neuen Seite, an der sich der
    Benutzer merken muss, welche Felder falsch ausgefüllte und von vorherigen zurückkehren
    muss, sondern blenden Sie die Fehlermeldung direkt im Formular ein (über das PHP-Standardformular).
    Abbildung 4.2 stellt beide Ansätze gegenüber.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_209_0.png)


    Abbildung 4.2: Stufen der Formularprüfung: Gute und schlechte Beispiele


    # Ist eine Benutzerkontrolle möglich?


    Eine Webanwendung ist vom Benutzer kontrollierbar, wenn der Benutzer die Geschwindigkeit
    und Richtung des Programmierablaufs beeinflussen kann, wie er sein Ziel erreicht.


    Der Anzeigdauer einer Dialogbox sollte stets vom Benutzer kontrollierbar sein
    und nicht vom Programm diktiert werden. Dies klingt logisch. Ist aber auch ein
    Beispiel, wie Sie selbst grundlegende Regeln brechen können. Nachdem Sie ein Formular
    ausgefüllt haben, blendet das Programm eine Fehlermeldung ein und kehrt automatisch
    nach fünf Sekunden zum Formular zurück. Die korrekt eingegebenen Daten werden
    natürlich nicht gespeichert, wenn es ihnes das wert ist – wir haben diese Seite
    nicht von vorne verlassen. Benutzer, die nach dem Abschicken des Formulars zu
    einem anderen Programm oder einer Browserserin gewechselt haben, hatten die Fehlermeldung
    sogar nicht gesehen.


    Sie sollten dem Benutzer auch die Wahl lassen entscheiden, wie viele Daten angezeigt
    werden. Wenn sich ein Formular über mehrere Schritte erstreckt,'
  merge: -1
