  md: '# Struktur der Quellen


    Daneben sollten Sie sich einige der Dateien betrachten, von denen diese Dateien
    abhängen; z.B. eine, die auf den Zend-Executor, die Unterstützung für PHP-Initialisierungsdateien
    und dergleichen beziehen. Diese Dateien betrachtet, nehmen Sie sich die Zeit,
    ein wenig im Paket herumumzuwenden, um sich einen Einblick in die gegenseitige
    Abhängigkeit von allen Dateien und Modulen zu verschaffen, die sich aufeinander
    beziehen und insbesondere wie sie einander nutzen. Dies hilft Ihnen auch, sich
    an den PHP anzupassen, in dem die PHP-Quellen verfasst sind. Um PHP zu erweitern,
    sollten Sie diesen Stil nicht übernehmen.


    # 9.4.1 Erweiterungskonventionen


    Zend wird mit einiger Konventionen erstellt; um seine Standards nicht zu verletzen,
    sollten Sie diese Regeln folgen, die in den folgenden Abschnitt beschrieben werden.


    # 9.4.2 Makros


    Für fast wichtige Aufgabe liefert Zend vordefinierte Makros, die extrem praktisch
    sind. Die Tabellen und Abbildungen in den folgenden Abschnitten beschreiben die
    meisten der grundlegenden Funktionen, Strukturen und Makros. Die Makrodefinitionen
    sind hauptsächlich in zend.h und zend_API.h abgelegt. Wir sagen vor, dass Sie
    sich mit diesen Dateien näher befassen, nach dem Sie dieses Kapitel gelesen haben.
    (Diese können Sie natürlich sofort lesen, aber es wird wahrscheinlich noch nicht
    alles für Sie sinnvoll erscheinen. )


    # 9.4.3 Speicherverwaltung


    Ressourcenverwaltung ist ein wesentlicher Faktor, insbesondere bei Serversoftware.
    Die wertvollen Ressourcen sind der Speicher und die Speicherverwaltung sollte
    mit großer Sorgfalt betrieben werden. Die Speicherverwaltung wird teilweise in
    Zend eingebettet, und die eingebetteten Funktionen sind konsequent genutzt, aus
    öffentlichen Gründen: Sie ermöglichen Zend die vollständige Kontrolle über alle
    Speicherzuweisungen. Zend kann feststellen, ob ein Block in Gebrauch ist, und
    unbeutzte Blöcke mit abgehob Referenzen freigibt und damit Speicherlöcher vermeiden.
    Die folgende Tabelle zeigt die zu verwendenden Funktionen:


    | Funktion | Beschreibung |

    | --- | --- |

    | emalloc() | Ersetzt malloc() |

    | efree() | Ersetzt free() |

    | estrdup() | Ersetzt strdup() |'
