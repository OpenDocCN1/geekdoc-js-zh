  md: 'Hinweis: Als dieses Buch erstellt wurde, war die LibXML-API noch nicht hundertprozentig
    in PHP integriert. Sie war instabil und enthielt Bugs. Trotzdem konnte man bereits
    die immensen Vorteile sehen, welche die fertige LibXML-API bieten wird. Deswegen
    haben wir beschlossen, die grundlegenden Prinzipien zu erläutern und einige Beispiele
    vorzustellen. Wenn Änderungen auftraten, werden wir diese auf der Website des
    Buches dokumentieren.


    # Überblick


    Die meisten Entwickler werden zustimmen, dass ein XML-Dokument als besten dargestellt
    wird. LibXML bietet eine schöne API, um aus einer XML-Datei Bäume und DOM-ähnliche
    Datenstrukturen zu generieren. Wenn Sie ein Dokument mit LibXML analysieren, erstellt
    PHP eine Reihe von Klassen, die Sie direkt aufrufen können. Indem Sie die Funktionen
    dieser Klassen aufrufen, können Sie auf Ebene der Struktur zugreifen und das Dokument
    ver.


    Die beiden wichtigen Objekte, denen Sie bei der Arbeit mit LibXML begegnen, sind
    Dokumente und Knotenobjekte.


    # XML-Dokumente


    Das abstrakte XML-Dokument wird in einem Dokumentenobjekt dargestellt. Solch ein
    Objekt wird über die Funktionen `xmldoc()`, `xmldocfile()` und `new_xml_doc()`
    erzeugt.


    Die Funktion `xmldoc()` besitzt ein Argument, welches das XML-Dokument als Zeichenkette
    angebibt. Die Funktion `xmldocfile()` verhält sich ähnlich, aber im Argument einen
    Dateinamen an. Ein neues XML-Dokument zu erzeugen, können Sie die Funktion `new_xmldoc()`
    verwenden.


    Alle drei Funktionen geben ein Dokumentenobjekt zurück, dem vier Methoden und
    eine Klassenvariable zugeordnet sind:


    +   * root()

    * add_root()

    * dtd()

    * dumpmem()

    * version


    Die Funktion `root()` gibt ein Knotenobjekt zurück, welches das Stammelement des
    Dokuments enthält. Bei Dokumenten, die Sie mit `new_xmldoc()` erzeugt haben, können
    Sie mit `add_root()` ein Stammelement hin hinzufügen. Auch hier wird ein Knotenobjekt
    zurückgegeben. Beim Aufruf als Klassenmethode erwartet die Funktion `add_root()`
    als erstes Argument den Namen des'
