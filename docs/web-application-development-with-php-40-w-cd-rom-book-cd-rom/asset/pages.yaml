  md: '# Anwendungen der Spitzentechnologie


    Wenn Sie feststellen, dass sich alle Dinge ändern, werden Sie an nichts mehr festhalten.

    Wenn Sie keine Angst vor Sterben haben, gibt es nichts, was Sie nicht erreichen
