  md: '# Authentifizierung


    +   - admin: erbt supervisor, editor, author


    +   - supervisor: erbt editor, author


    +   - editor


    +   - author


    Um den Bitmuster der einzelnen Gruppen zu berechnen, beginnen wir bei der untersten
    Ebene mit dem Bitmuster von 1 (was bedeutet, dass das ganz rechte Bit gesetzt
    ist). Wenn wir möchten, dass der Editor die Rechte der Autoren erbt, müssten wir
    mit dem Bitmuster für Autoren fortfahren und das nächhöchste Bit setzen (1 | 2).
    In unserem Beispiel möchten wir jedoch, dass die Autoren- und Editorebene getrennt
    sind, weshalb wir die Editorebene als das nächhöchste freite Bit setzen 2 (binär
    10).


    Wenn nun ein Editor eine Seite aufschlägt, die mit der author-Berechtigung geschützt
    ist, wird der Zugriff verweigert.


    +   - erforderliche Ebene (editor): 1


    +   - aktuelle Ebene (editor): 2


    +   - logisches UND von 1 und 2 (1 & 2) ist 0, was nicht der erforderlichen Ebene
    entspricht


    Die nächste Ebene (die dritte Position von rechts) ist supervisor, welche die
    Rechte von editor und author übernimmt. Das bedeutet, dass die Bits 1 und 2 im
    Supervisor-Bitmuster gesetzt werden müssen. Außerdem setzen wir das 3. Bit (2
    hoch 2, bzw. 4): 1 | 2 | 4 – dies ergibt 7.


    Überprüfen wir die Richtigkeit:


    +   - erforderliche Ebene (editor): 2


    +   - aktuelle Ebene (supervisor): 7


    +   - logisches UND von 7 und 2 (7 & 2) ist 2, welches der erforderlichen Ebene
    entspricht.


    Nun bleibt nur noch die Administrateorebene übrig. Diese würde wieder alle Rechte
    der Ebenen ihr erben: 7 | 8 (8 zum Setzen des 4. Bits verwendet). Das Ergebnis
    ist 15. Machen wir die Gegenprobe:


    +   - erforderliche Ebene (supervisor): 7


    +   - aktuelle Ebene (admin): 15


    +   - logisches UND von 15 und 7 (15 & 7) ist 7, welches der erforderlichen Ebene
    entspricht.'
