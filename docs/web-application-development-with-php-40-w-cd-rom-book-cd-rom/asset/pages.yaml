  md: '# 7 Anwendungen der Spitzentechnologie


    eingesetzt, hat keine Auswirkung auf die Auszeichnung selbst oder die Zeichendaten.
    Es bietet dem Editor die Möglichkeit, Leerraum, wann gewünscht, zu erhalten.


    Mit der Einführung von xml:space reagierte das XML-Komitee auf die verschiedenen
    Ansichten zum Thema Leerraum. Das Attribut kann zwei Werte preserve oder default.
    Jedes Element, welches das Attribut xml:space="preserve" enthält, wird Leerraum
    als signifikant betrachten und die verarbeitende Element unverändert übergeben.
    Der Wert default teilt der Anwendung mit, dass die Standardverwaltung angewendet
    werden soll. Beide Standard Standardattribute werden auf die Unterelemente vererbt,
    solange sie nicht in einem Element zurückgesetzt werden.


    **Hinweis:** Ein XML-Prozessor ist ein Programm, das Lesen von XML-Dokumenten
    verwendet wird. Der XML-Prozessor ermöglicht eine Anwendung, auf die Struktur
    und den Inhalt eines XML-Dokuments zuzreifen. In diesem Buch verwenden wir die
    Begriffe XML-Prozessor und XML-Parser für diesel Art von Software.


    # Verarbeitungsbefehle


    Ein weiterer «Element»-Typ, den Sie in XML-Dokumenten finden, ist der Verarbeitungsbefehl.
    Dieser wird, um Teile in einem Dokument zu definieren, nicht mit regulären Parserprogramm
    interpretiert werden, sondern von einer speziellen Verarbeitungsroutine. Er setzt
    sich zusammen aus ? und einem Ziel, den die Anwendung anwendet, auf welche der
    Befehl reicht. Das lange PHP-Tag (<?php) ist ein Beispiel hierfür: es wird in
    XML-Dokumenten verwendet, um PHP-Code zu markieren.


    > Hinweis: Um XML-kompatibel zu sein, müssen Sie den Befehl short_tags in Ihrer
    PHP-Konfiguration auf off setzen, und konsequent die lange öffende Tag <?php verwenden.
    Die kurz öffende Tag würde XML verirren, da es kein gültiger Verarbeitungsbefehl
    wäre. Auf der anderen Seite würden Tags, wie <?xml, nicht mit PHP vertragen, XML
    von PHP für Programmcode halt und dementsprechend einem Analysefilter angezeigt
    werden.


    # Entitäten


    Der Teil des Textes, der eine Auszeichnung darstellt, wird innerhalb dieses Textes
    muss ein Autor Sonderzeichen, wie < oder >, einfügen können, die normalerweise
    den Beginn oder das Ende von Auszeichnungsabschnitten kennzeichnen. Genau wie
    HTML kennt XML die Schreibweise von Entitäten: Es gibt fünf vordefinierte Entitäten:'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# PHP und XML


    | Entität | Zeichen | Symbol |

    | --- | --- | --- |

    | &lt; | < | kleiner als |

    | &gt; | > | größer als |

    | &amp; | & | Ampersand |

    | &quot; | " | doppelte Anführungsriche |

    | &apos; | '' | einfache Anführungsstriche (Apostroph) |


    > > Hinweis: Wenn Sie ein Document Type Definition benutzen, müssen diese Entitäten
    deklariert werden, wenn sie verwendet werden.


    Mitilfe von Zeichenreferenzen können Sie ein beliebiges Unicode-Zeichen in Ihr
    Dokument einfügen. Sie werden andere Referenzen geschrieben, wobei der Ampersand
    (&) steht. Dank wird weder ein dezimaler noch hexdezimaler Verweis auf die Unicode-Position
    eingefügt. Ein Beispiel referieren sowohl als &#x221 als auch Unendlich-Zeichen
    (8). Entitäten sind jedoch nicht als ein einzeles Zeichen begrenzt. Sie können
    beliebig lang sein. Eine DTD könnte beispielsweise eine Entity&footer definieren,
    die den Inhalt "Copyright (c) 2000 Pearson Education" enthält.


    # Kommentare


    XML verwendet dieselbe Schreibweise für Kommentare wie HTML: -->. Sie können beliebige
    Daten außer Zeichenfolge - enthalten, und deren Auszeichnungseinträge an beliebiger
    Stelle in Ihrem Dokument einfügen. In der XML-Spezifikation ist ausdrücklich angegeben,
    dass Kommentare nicht Teil des Dokumenteninhalts sind. Es wird jeder Parser ignoriert,
    um sie an die verarbeitende Anwendung zu übergeben. Sie können Kommentare auch
    nutzen, wenn Sie möglicherweise HTML versteckte Anweisungen g. a. verwenden (denken
    Sie an die Verwendung der Kommentar-Tags, mit denen Sie Java-Script vor älteren
    Browsern verstecken).


    # CDATA-Abschnitte


    Ein spezieller Inhaltstyp ist CDATA-Abschnitte. Sobald Sie größere Abschnitte
    von Programmcode in Ihr XML-Dokument einfügen möchten, die < und & enthalten,
    werden Sie die Standardmethode, einzelne Zeichen für Entität zu referieren, sehr
    hilfreich. HTML bietet hierfür das Tag <pre>, mit welchem die Auszeichnunginterpretation
    für einen Abschnitt ausgeschaltet wird. Da XML solche integrierten Tags fehlen,
    können wir dies nicht. Um diesen Mangel zu beseitigen, können Sie Abschnitte in
    XML wie folgt als CDATA markieren:'
