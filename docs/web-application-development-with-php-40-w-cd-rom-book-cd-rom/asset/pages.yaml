  md: 'Hinweis: Der Swap-Speicher ist ein virtueller Speicher, der den RAM erweitern
    soll, der physikalischen Speicher auf einer Festplatte abgelegt, was extrem langsam
    ist. Der Swap-Speicher wird auf der physikalische Speicher vollständig bereit
    ist, beginnen moderne Betriebssysteme, neuen Speicher im langsamen Swap-Speicher
    zu belegen. Sobald viele Clients gleichzeitig auf denselben Chatserver zugreifen
    und den gesamten Speicher verbrauchen, werden Daten in dem Swap-Speicher beschrieben.
    Nun muss das Betriebssystem ständig Teile des RAM gegen den Swap-Speicher austauschen
    (da Programme nicht vom Swap-Speicher gestartet werden können). Dies setzt einen
    »Teufelskreis» in Gang: bemer, dass ein Prozess im Swap-Speicher ausgeführt werden
    muss, und lädt ihn in RAM, muss aber einen anderen Prozess aus RAM in den Swap-Speicher
    auslagern. Er führt den Prozess im RAM aus, oder stellt fest, dass der alte Prozess
    (der sich nun im Swap-Speicher befindet) ausgeführt wird. Muß transferiert er
    die Daten wieder in RAM aus. Durch diese kann ein Server leicht zum Absturz bringen,
    sodass er neu gestartet oder vom Netz genommen werden muss. Das ist übriges eine
    »Dienstverweigerungs-Attacke» ähnlich, der Yahoo! und dieses Jahr bereits über
    sich ergeben lassen.


    # 5.5.3 Upstream-Kommunikation


    Als Nächst beschäftigen wir uns mit der Upstream-Kommunikation, d.h. Weiterleitung
    von Benutzereingaben zum Netzwerk. Jetzt kommt der harte Teil. Wir können Daten
    zum IRC-Netzwerk nicht von jedem Prozess aus senden. Warum nicht? Weil IRC ein
    zustandssensitives Protokoll ist, das Kommunikation eine bestimmte Client-Verbindung
    benötigt. PHP lässt keine Übernahme fremder Socket von anderen Prozessen zu. Der
    Hauptprozess, der die Downstream-Kommunikation übernimmt (der Prozess, als IRC-Client
    agiert), wird von allen anderen Prozessen ausgeführt. Nun ist die Frage, wie wir
    einen öffnen können, um Daten an den Hauptprozess weiterzuleiten.


    Wie würden Sie eine Upstream-Kommunikation realisieren? Versuchen Sie mindestens
    einen theoretischen Ansatz zu entwickeln. Zeichnen Sie einen Datenfluss auf Papier.
    Wenn nicht, schreiben Sie mindestens drei Möglichkeiten für den Laufzeit-Datenaustausch
    aus.


    Der Downstream-Prozess muss permanent laufen und darf nicht beendet werden. Wir
    können ihn nicht einfach über ein POST oder GET für die Datenweitergabe aufrufen,
    denn dies würde bedeuten, einen weiteren Prozess zu starten, der wiederum nicht
    angemeldet ist, werden müsste. Ein solcher Ansatz würde zu ständigen Anmelde-
    und Abmelden.'
