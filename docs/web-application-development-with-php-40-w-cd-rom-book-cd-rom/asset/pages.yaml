  md: '# 4 Webanwendungskonzepte


    würde nur dann etwas Sinnvolles ausgeben, wenn $foo der Name einer anderen-Variablen
    wäre:


    ```

    $bar = "This is a string";

    $foo = "bar";

    session_register($foo);

    ```


    Mit session_unregister() können Variablen aus der Sitzungsbibliothek entfernt
    werden.


    Genau wie im wirklichen Leben lässt sich nicht immer vorhersagen, wann eine Sitzung
    endet – es sei denn, ein bestimmtsames Event, das durch session_destroy() erzwungen
    wird. Wenn die Sitzung zur Alterung eingegeben soll, müssen verschiedene Konfigurationen
    im Allgemeinen genommen werden. Wenn wir Sitzungsdauer über Cookies verbreiten,
    die Standardlebauer auf 0, d. h. wird gelöscht, sobald der Browser schließt, oder
    die Lebensdauer des Konfigurationswerte live bleiben. Der Server weiß nicht, ob
    die Cookie auf der Client-Seite existiert, PHP eine weitere Lebensdauervariable
    festlegt, welche die Daten nach dem Zugriff auf diese Sitzung speichern soll:
    $gc_max_lifetime. Wollte man jedoch so einen Cleanup-alten Sitzung (auch Speicherbereinigung
    genannt) bei jeder Seitenanfrage durchführen, würde dies einen erheblichen Overhead
    verursühren. Deshalb haben wir die Möglichkeit, mit welcher Wahrscheinlichkeit
    die Speicherbereinigungsgoutine abgerufen werden. Wenn $gc_probability auf 100
    gesetzt wird, wird der Cleanup bei jeder Anfrage durchgeführt. Dieser Wert, standardmäßig
    eingestellt auf 1, werden alle Sitzungen mit einer Wahrscheinlichkeit von 1% pro
    Anfrage geprüft.


    Wenn Sie keine Cookies verwenden, sollten Sie die Sitzungsnummer für GET oder
    POST übergeben, müssen Sie auf die Speicherbereinigungsgoutine antworten. Möglicherweise
    nutzen Benutzer Lesezeichen für URLs, welche die Sitzungsnummer ersetzen. Stellen
    Sie sicher, dass Sitzungen bereinigt werden. Wenn die Sitzdaten noch existieren,
    werden die Sitzdaten mit der Sitzungsnummer zu einem späteren Zeitpunkt überschrieben,
    damit die vorherige Sitzung einfach wieder wird, anstatt eine neue Sitzung zu
    starten. Dies ist möglicherweise nicht in Ihrem Interesse. Setzen Sie $gc_probability
    jedoch nicht auf einen hohen Wert, insbesondere wenn Sie Sitzungen in Datenbanken
    speichern. In diesem Fall werden bei der Durchführung der Speicherbereinigung
    mit stat() alle Sitzungsdaten genannt, und die letzte Änderung dieser Sitzungen
    überprüft. Dies ist eine sehr te Operation, die nicht allzu häufig gestartet sollte.
    In der Regel ist ein Wert zwischen 5 und 10 für $gc_probability angemessen, insbesondere
    dann, wenn Sie Sitzungen löschen, sobald Sie eine Transaktion beendet haben (z.B.
    wenn sich ein Benutzer im Shop abmeldet).'
