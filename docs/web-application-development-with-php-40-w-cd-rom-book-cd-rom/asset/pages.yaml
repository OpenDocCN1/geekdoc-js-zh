    # 2.4.1 Klassen: PHP 3.0 versus PHP 4.0


    PHP 4.0 hat die Unfähigkeit von PHP 3.0 zu verwalten, und bietet nur «» Referenzen.
    «Echt« ist hier in Einführungsweise gezeigt, dass diese nicht wirklich auf die
    andere Variable zeigen, die PHP interpretiert diese Variablen nur als Referenz
    und verhält sich anders. Eingebettet in das vergangene Beispiel, sähe der Programcode
    folgendermaßen:


    ```

    // create multiple references to the original object

    $new_object = &$my_object;

    $another_object = &$my_object;

    ```


    Dieser Code erzeugt zwei Referenzen auf dasselbe Objekt. Beachten Sie, dass $another_object
    als Referenz $new_object zugeordnet wird, nicht als Kopie hiervon. Wenn Sie versuchen
    die Referenzen zu kopieren, kopiert PHP nicht die Referenz, sondern erstellt statt
    eine Kopie der referenzierten Variablen. Aber wenn Sie jetzt Referenzen verwenden
    (um eine Referenz zu kopieren, müssen Sie den Referenzoperator @ verwenden), können
    sowohl $new_object als auch $another_object verwenden, um die Daten zu ändern,
    die sich innerhalb von $my_object befinden.


    Für die unterschiedlichen Versionen geben wir einige Empfehlungen, auf die wir
    nachfolgend eingehen.


    # Klassen in PHP 3.0


    Daten: Verwenden Sie Klassen nicht für komplexe Datenstrukturen, die viele Zeiger
    benötigen (wie etwa Bäume). Wenn sich nicht vermeiden lässt, versuchen Sie die
    Verwendung von Klassen auf die Erfassung von Daten zu beschränken und die Datenverwaltung
    aususparen.'
