  md: '# Entwicklungskonzepte


    nicht strukturiert übergeben. Mit Strukturen halten Sie die Schnittstelle »sau-ber.
    Dies ist manchmal wichtiger als die Bemühung, die zusätzliche Belastung zu vermeiden,
    die durch Strukturen entstehen, wenn sie initialisiert und/oder modifiziert werden.


    Bevor Sie versuchen, alle Parameter in einer Struktur zusammenzufassen, sollten
    Sie überlegen, ob Sie ein anderes Datenformat verwenden können. Zur Kodierung
    von Datum und Zeit sind sich beispielsweise der binäre Dezimalcode (BCD, Binary
    Coded Digits) oder das Timestamp-Format für UNIX geeignet. In beiden Fällen werden
    die erforderlichen Variablen in eine gepackt. BCD ist zum Teil noch nicht weit
    verbreitet, aber im Fall von PHP, das auf einer UNIX-ähnlichen Plattform entwickelt
    wurde, dominiert ganz klar die Timestamp-Methode (siehe Listing 1.13). Ohne sind
    der Timestamps die Sekunden, die seit Mitternacht des 1. Januar 1970 UTC vergangen.
    Sie werden als Dezimalzahl in 32-Bit-Schreibweise ausgedrückt. Dies führt zu Überlauf
    im Jahr 2106. Da PHP nicht auf die 32-Bit-Schreibweise für die Erfassung des Timestamps
    festgelegt ist, könnte er auf 64-Bit ändern und damit Jahr 2106-fest weichen.
    Ihr Programm wird es nicht merken.


    Ein weiterer Vorteil von Timestamps ist darin, dass Großteil der PHP-Funktionen
    wieder in für den Menschen lesbare Daten zurückverwandelt. Dank Sie mit Timestamps
    leichter Zeitdifferenz zwischen zwei Ereignissen feststellen, brauchen Sie nur
    einen Timestamp von anderen abzuziehen.


