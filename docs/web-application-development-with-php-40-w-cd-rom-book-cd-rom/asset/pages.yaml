  md: "# 9.10.7 Einbindung aller exportierten Funktionen\n\nSchließlich werden alle\
    \ exportierten Funktion implementiert. Für unsere Bei-spielfunktion sieht das\
    \ first_module wie folmaßen aus:\n\n```\nZEND_FUNCTION(firstmodule)\n{\n    zval\
    \ **parameter;\n\n    if((ZEND_NUM_ARGS() != 1) || (zend_get_parameters_ex(1,\
    \ &parameter)\n    != SUCCESS))\n    {\n        WRONG_PARAM_COUNT;\n    }\n\n\
    \    convert_to_long_ex(parameter)->value.lval;\n\n    RETURN_LONG((*parameter)->value.lval);\n\
    }\n```\n\nDie Funktionsdeklaration geschieht unter ZEND_FUNCTION, welche in der\
    \ Funktions-integrationstabelle (die wir bereits eingangen sind) ZEND_FE entspricht.\n\
    Nach den Deklarationen folgt der Programmcode zur Überprüfung und zum Auslesen\
    \ der Funktionsargumente, der Konvertierung von Argumenten und der Generierung\
    \ von Rückgabewerten (mit dauerzy).\n\n# 9.10.8 Zusammenfassung\n\nIm Prinzip\
    \ ist dies alles – mehr gibt es zur Implementierung von PHP-Modul nicht zu sagen.\
    \ Eingebaute Module sind ähnlich aufgebaut wie deine dynamische-Module. Mit den\
    \ hier präsentierten Informationen sollten sie in der Lage sein, Probleme zu bewältigen,\
    \ die in den Quelldateien der PHP-Module auftreten.\n\nIn den folgenden Abschnitten\
    \ gehen wir darauf ein, wie Sie die PHP-Interna nutzen, um leistungsfähige Erweiterungen\
    \ zu generieren.\n\n# 9.11 Annahme von Argumenten\n\nEiner der wichtigsten Aspekte\
    \ bei Spracherweiterungen betrifft die Annahme und Handhabung von Daten, die durch\
    \ Argumente übergeben werden. Die meisten Erweiterungen dienen der Verarbeitung\
    \ von spezieller Eingabedaten (oder benötigten Parameter zur durch Durchführung\
    \ ihrer spezifischen Aktionen). Funktionsargumente sind eigentlich die einzig\
    \ wahre Möglichkeit, um Daten zwischen der PHP- und der C-Ebene auszutauschen.\
    \ Natürlich gibt es auch"
