    zu entfernen.


    **Tipp: Im Gegensatz zu PHP 3.0 unterstützt PHP 4.0 weiterhin associative Arrays
    in Formularen. Damit können sich tatsächlich alle Formularvariablen, einschließlich
    multiple-Felder, in einem Array verarbeiten.**


    # 5.1.1 Verwendung von HTML-Schablonen


    Möglicherweise bemer Sie, dass das Formularbeispiel keinen HTML-Code enthält.
    Ausgenommen davon haben wir HTML in eine separate Datei namens `PHP_Normal_Form.inc`
    ausgelagert. Hierbei handelt es sich um eine Vorlagdatei, welche die gesamte HML-Struktur
    und einige Schabonen, wie etwa `HEADER` enthält.


    Vieleicht kommt Ihnen dies bekannt, wie Sie mit der Klasse FastTemplate gearbeitet
    haben. EasyTemplate lässt die fortgeschrittenen Funktionen von FastTemplate weg:
    es stellt lediglich eine schnelle Schnittstelle zur Verfügung, um skalare Tags
    in Schablonen durch einen Zeichenwert zu ersetzen. Da es sich auf diese einfache
    Aufgabe begrenzt, ist es eine Leistungssteigerung von mehr als 120% im Vergleich
    zu FastTemplate für die syntaktische Analyse Ihrer Formularschlangen.


    Die von uns entwickelte Schablonklasse hat zwei Funktionen: `assign()`, `easy_parse()`
    und `easy_print()`, die in der folgenden Tabelle beschrieben werden:


    | Funktion | Beschreibung |

    | void EasyTemplate(string Schablone_Datetime) | Der Konstruktor der Klasse ist
    im Argument den Namen der Schablone, die Sie verwenden möchten. Wenn ein Fehler
    auftritt, wird die Fehlermeldung in den Variablen $error ausgegeben. |

    | bool assign(String-Tag, Stringwert) | weist einem Schablonen-Tag einen Wert
    zu. Gibt bei erfolgreicher Zuweisung true zurück, bei einem Fehler false. |'
