  md: "# PHP und objektorientierte Programmierung\n\nCode: Verwenden Sie Klassen nur\
    \ zur Strukturierung von APIs, die nicht durch den Kopiersyntax verletzt werden\
    \ sollen. Überlegen Sie, ob Ihr Projekt durch Prozeduren realisiert werden. Wenn\
    \ ja, erfors Sie diese Möglichkeit. Prozeduren sind zuverlässig und haben sich\
    \ bewährt, wohingegen Objekte nicht einige Gefahren bergen.\n\n# Klassen in PHP\
    \ 4.0\n\nVerwenden Sie Klassen vorsichtig und stellen Sie sicher, dass sich Kopien\
    \ und Verweise von Objekten unterscheiden können. Achten Sie darauf, welche Typen\
    \ Sie übergeben und wie Sie mit ihnen umgehen. Sobald Sie ein einziges vergessen,\
    \ erzeugt PHP eine Kopie Ihres Objects, was wahrscheinlicher Weise die Konsistenz\
    \ Ihrer Daten unterbrechen.\n\nDie Klassen wurden zwar in PHP 4.0 versierbar,\
    \ aber wir bleiben skeptisch. Wir haben Meinungen dazu, die in verschiedene Richtungen\
    \ gehen. Eine Gruppe darauf, dass Objekte nicht genutzt und in einer Sprache PHP\
    \ verwendet werden sollten, während eine andere Gruppe jedes prozedural ansetzt,\
    \ sogar in PHP 3.0. Für diejenigen, die mit Prozeduren arbeiten, scheinen Objekte\
    \ ein schlafendes Ungeheuer zu sein, das man nicht wecken sollte. Die Fängende\
    \ der objektorientierten Programmierung sind aufgrund des prozeduralen Ansatzes\
    \ Idioten. Es ist fast wie ein Religionskrieg. Wann immer wir das Thema anschnitten,\
    \ führte es zu endlosen und fruchtlosen Diskussionen.\n\nNach unserer Ansicht\
    \ sind beide Extreme falsch. Es ist weder gut Funktionen komplett zu ignorieren\
    \ noch ohne Betrachtung der Materialien zu verwechseln. Dies widerspricht es auch,\
    \ es als persönliche Vorliebe Ausdruck. Technologien sollten nicht unter diesem\
    \ Gesichtpunkt betrachtet werden. Empfehlung: Befrei Sie sich von jeglichen Vorurteilen.\
    \ Die möglichenweise, insbesondere denjenigen von anderen, und entscheiden Sie\
    \ objektiv, was für Ihr Projekt am besten geeignet ist.\n\n# 2.4.2 Implementierung\
    \ von Klassen\n\nUngeachtet des Pros und Contras sind Klassen ein wichtiges Element\
    \ der Programmiersprache, und es scheint immer ein Bedarf zu geben, die Implementierung\
