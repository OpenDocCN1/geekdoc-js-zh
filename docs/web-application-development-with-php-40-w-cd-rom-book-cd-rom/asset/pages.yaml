  md: '# 3 Programmentwicklung: ein Praxisbeispiel


    Dies ist eines der Hauptprobleme des Netzwerks, das »durch das Konzept begrenzt«
    ist. Der gesamte öffentliche Datenverkehr muss an alle Server gehen. Diesesches
    Problem lässt sich tatsächlich unter allen Bedingungen auf, denen wir unser IRC-Netzwerk
    installieren wollen? Sicher nicht, wenn wir umgehen, wird er so groß sein, dass
    zu einem Problem wird – vorausgesetzt wir verwenden einen Standard-Host. In internen
    Netzwerken sollte dieses Problem überhaupt nicht auftreten.


    Um den Umstand der kritischen Verbindungen zu reduzieren, kann das Netzwerk so
    konzipiert werden, dass ein Server mit einer höheren Kapazität an den anderen
    angeschlossen wird, kann er beispielsweise wenige Knoten bekommen als andere (viele
    Knoten an einen Server mit vielen Backbone anzuziehen, nicht viel Sinn). Eine
    weitere Möglichkeit ist, das Routing des Netzwerk anzupassen. Amerikanische Server
    haben beispielsweise ihren Sitz in den Vereinigten Staaten, deutsche Server in
    Deutschland usw. Frankfurt hat eine Überseebindung nach New York. Der IRC-Server
    in Frankfurt sollte damit mit dem New Yorker Server verbunden werden (entsprechend
    dem physikalischen Aufbau des Netzes). Man könnte auch anders machen. Frankfurt
    könnte eine Verbindung nach Polen haben. Wenn Polen keine Überseebindung hat,
    müsste der Datenverkehr von Frankfurt nach Polen weitergeleitet werden, einen
    anderen Weg finden, über den Ozean zu überquer oder über ein anderes Land (oder
    zwei oder drei) geleitet wird. Durch zusätzliche Routing wird Bandbreite verschwendet.
    Daher wird versucht, die Struktur des IRC-Netzwerks so anzupassen, dass es bestmöglich
    den zugrundlegenden physikalischen Netzwerkaufbau unterstützt.


    ![](img/a6baf4404f9d19e866e05a7e62218c4e_135_0.png)


