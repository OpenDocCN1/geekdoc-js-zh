  \n\n\n\n\nThis text contains an HTML form structure primarily used for collecting\
  \ metadata for books or content. The following is the formatted core content:\n\n\
  ### General Form Information\n- **Full Name**: Enter the author's full name.\n-\
  \ **Email**: Enter a valid email address.\n- **Title**: Enter the title of the content.\n\
  - **Sub-Title**: Enter the subtitle of the content (optional).\n- **Category**:\
  \ Select a category (e.g., Art & Photography, Business & Economics, Biography &\
  \ Memoir, Children, Comics & Graphic Novels, Computer & Technology, Religion & Spirituality,\
  \ Science & Medicine, Social Science, Psychology, Sports, Travel & Adventure, Young).\n\
  - **Contributors (Optional)**: Specify names of collaborators, editors, or illustrators\
  \ separated by commas.\n\n### Project Details\n- **Project Details (Synopsis)**:\
  \ Provide all important metadata to help readers find the book.\n- **Keywords**:\
  \ Add keywords.\n- **Language**: Select a language (supported: English, German,\
  \ Spanish, Chinese, French, Persian, Hausa, Igbo, Yoruba, Aharadi, Kokani, Bengali,\
  \ Marathi, Zapotec languages, etc.).\n- **Other Language**: Specify other languages\
  \ (optional).\n- **Audience**: Select the audience (e.g., General, Adult Fiction,\
  \ Children, Young Adult, School Education).\n\n### Specifications and Goals\n- **Table\
  \ of Contents**: Provide a table of contents (optional).\n- **Select a Goal**: \n\
  \    - `Global Distribution`: Sold through over 40,000 global retailers; requires\
  \ title page, copyright page, and ISBN.\n    - `Print Your Book`: Upload files to\
  \ your account and print.\n- **Book Specification**:\n    - `5.5 x 8.25 inch`: Suitable\
  \ for fiction, poetry, and short fiction (less than 50,000 words).\n    - `6 x 9\
  \ inch`: Suitable for self-help, biography, business, and academic (less than 75,000\
  \ words).\n    - `6.625 x 10.25 inch`: 168.3 x 260.4 mm, 0.75 inch spine, suitable\
  \ for graphic novels or collections.\n    - `8.5 x 11 inch`: Academic books (more\
  \ than 75,000 words).\n    - `11 x 8.5 inch`: 280 x 216 mm, 0.75 inch spine, suitable\
  \ for albums, catalogs, or series books.\n\n### Binding, Paper, and Copyright\n\
  - **Binding Type**: Select inner page color and cover binding.\n- **Paper Type**:\n\
  \    - `80# White-Coated Paper`: Recommended for heavy ink.\n    - `60# Cream Paper`:\
  \ Economical option.\n- **Book Cover Lamination**:\n    - `Glossy Finish`: Glossy\
  \ (suitable for dark covers and detailed spatial designs).\n    - `Matte Finish`:\
  \ Matte (suitable for light covers, especially graphic designs).\n- **Copyright**:\n\
  \    - `All Rights Reserved`: Standard all rights reserved (distribution prohibited).\n\
  \    - `Creative Commons`: Creative Commons license (allows distribution, modification,\
  \ or use).\n\n### Technical Implementation\nThe form submits form data to a specified\
  \ Apps Script using the JavaScript `fetch` API:\n\n```javascript\nconst scriptURL\
  \ = 'Enter the Appscript URL where filled contents will be submitted to';\nconst\
  \ form = document.forms['google-sheet']\nform.addEventListener('submit', e => {\n\
  \  e.preventDefault()\n  fetch(scriptURL, {\n    method: 'POST',\n    body: new\
  \ FormData(form)\n  })\n  .then(response => alert(\"You have successfully submitted.\"\
  ))\n  .catch(error => console.error('Error!', error.message))\n})\n```\n\n\n\n\n\
  \n## 如何将 HTML 表单提交到 Gmail\n\n下面的示例提供了如何将 HTML 表单提交到 Gmail 或您选择任何电子邮件提供者的详细模板。\n\n\
  ### Code.gs\n\n```javascript\nfunction formatMailBody(obj,order) {\n  var result\
  \ = \"\";\n  for (var idx in order) {\n    var key = order[idx];\n    result +=\
  \ \"<h4 style='text-transform: capitalize; margin-bottom: 0'>\" + key + \"</h4><div>\"\
  \ + sanitizeInput(obj[key]) + \"</div>\";\n  }\n  return result;\n}\nfunction sanitizeInput(rawInput)\
  \ {\n  var placeholder = HtmlService.createHtmlOutput(\" \");\n  placeholder.appendUntrusted(rawInput);\n\
  \  return placeholder.getContent();\n}\nfunction doPost(e) {\n  try {\n    Logger.log(e);\n\
  \    record_data(e);\n    var mailData = e.parameters;\n    var orderParameter =\
  \ e.parameters.formDataNameOrder;\n    var dataOrder;\n    if (orderParameter) {\n\
  \      dataOrder = JSON.parse(orderParameter);\n    }\n    var sendEmailTo = (typeof\
  \ TO_ADDRESS !== \"undefined\") ? TO_ADDRESS : mailData.formGoogleSendEmail;\n \
  \   if (sendEmailTo) {\n      MailApp.sendEmail({to: String(sendEmailTo),subject:\
  \ \"Contact form submitted\",htmlBody: formatMailBody(mailData, dataOrder)});\n\
  \    }\n    return ContentService // return json success results.\n    .createTextOutput(JSON.stringify({\"\
  result\":\"success\",\"data\": JSON.stringify(e.parameters) })).setMimeType(ContentService.MimeType.JSON);\n\
  \  } catch(error) {\n    // if error return this\n    Logger.log(error);\n    return\
  \ ContentService.createTextOutput(JSON.stringify({\"result\":\"error\", \"error\"\
  : error})).setMimeType(ContentService.MimeType.JSON);\n  }\n}\nfunction record_data(e)\
  \ {\n  var lock = LockService.getDocumentLock();\n  lock.waitLock(30000); // hold\
  \ off up to 30 sec to avoid concurrent writing\n  try {\n    Logger.log(JSON.stringify(e));\
  \ // log the POST data in case we need to debug it\n    var doc = SpreadsheetApp.getActiveSpreadsheet();\n\
  \    var sheetName = e.parameters.formGoogleSheetName || \"sheetname\";\n    var\
  \ sheet = doc.getSheetByName(sheetName);\n    var oldHeader = sheet.getRange(1,\
  \ 1, 1, sheet.getLastColumn()).getValues()[0];\n    var newHeader = oldHeader.slice();\n\
  \    var fieldsFromForm = getDataColumns(e.parameters);\n    var row = [new Date()];\
  \ // first element in the row should always be a timestamp\n    for (var i = 1;\
  \ i < oldHeader.length; i++) { // start at 1 to avoid Timestamp column\n      var\
  \ field = oldHeader[i];\n      var output = getFieldFromData(field, e.parameters);\n\
  \      row.push(output);\n      var formIndex = fieldsFromForm.indexOf(field);\n\
  \      if (formIndex > -1) {\n        fieldsFromForm.splice(formIndex, 1);\n   \
  \   }\n    }\n    for (var i = 0; i < fieldsFromForm.length; i++) {\n      var field\
  \ = fieldsFromForm[i];\n      var output = getFieldFromData(field, e.parameters);\n\
  \      row.push(output);\n      newHeader.push(field);\n    }\n    var nextRow =\
  \ sheet.getLastRow() + 1; // get next row\n    sheet.getRange(nextRow, 1, 1, row.length).setValues([row]);\n\
  \    if (newHeader.length > oldHeader.length) {\n      sheet.getRange(1, 1, 1, newHeader.length).setValues([newHeader]);\n\
  \    }\n  } catch(error) {\n    Logger.log(error);\n  } finally {\n    lock.releaseLock();\n\
  \    return;\n  }\n}\nfunction getDataColumns(data) {\n  return Object.keys(data).filter(function(column)\
  \ {\n    return !(column === 'formDataNameOrder' || column === 'formGoogleSheetName'\
  \ || column === 'formGoogleSendEmail' || column === 'honeypot');\n  });\n}\nfunction\
  \ getFieldFromData(field, data) {\n  var values = data[field] || '';\n  var output\
  \ = values.join ? values.join(', ') : values;\n  return output;\n}\n```\n\n### Contactus.html\n\
