  \ 3` 在代码块执行后每次增加值（`i++`）。\n\n1. `initialExpression` 初始化/声明变量并仅执行一次。\n2. 求值 `condition`。\n\
  3. 如果 `condition` 为假，循环终止。\n4. 如果 `condition` 为真，则执行循环语句。\n5. 如果存在，则执行 `update expression`。\n\
  6. 回到第 2 步。\n\n`for` 语句通过 3 个可选表达式创建一个循环：\n\n`for` 语句通过 3 个可选表达式创建一个循环。`for` 的语法如下：\n\
  \n```javascript\nfor ( expression 1 ; expression 2 ; expression 3 ) { // 要执行的代码块\
