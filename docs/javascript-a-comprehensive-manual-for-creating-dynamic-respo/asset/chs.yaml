  - `Expression 3` 在代码块执行后执行（每次都执行）。\n\n`for` 语句通过 3 个可选表达式创建一个循环：\n\n`for` 语句通过 3\
  \ 个可选表达式创建一个循环。`for` 的语法如下：\n\n```javascript\nfor ( expression 1 ; expression 2\
  \ ; expression 3 ) { // 要执行的代码块 }\n```\n\n- `Expression 1` 在执行代码块之前执行（执行一次）。\n-\
  \ `Expression 2` 定义了执行代码块的条件。\n- `Expression 3` 在代码块执行后执行（每次都执行）。\n\n`for` 语句通过\
  \ 3 个可选表达式创建一个循环：\n\n`for` 语句通过 3 个可选表达式创建一个循环。`for` 的语法如下：\n\n```javascript\nfor\
  \ ( expression 1 ; expression 2 ; expression 3 ) { // 要执行的代码块 }\n```\n\n- `Expression\
  \ 1` 在执行代码块之前执行（执行一次）。\n- `Expression 2` 定义了执行代码块的条件。\n- `Expression 3` 在代码块执行后执行（每次都执行）。\n\
  \n`for` 语句通过 3 个可选表达式创建一个循环：\n\n`for` 语句通过 3 个可选表达式创建一个循环。`for` 的语法如下：\n\n```javascript\n\
  for ( expression 1 ; expression 2 ; expression 3 ) { // 要执行的代码块 }\n```\n\n- `Expression\
  \ 1` 在执行代码块之前执行（执行一次）。\n- `Expression 2` 定义了执行代码块的条件。\n- `Expression 3` 在代码块执行后执行（每次都执行）。\n\
  \n```javascript\n// JavaScript program to illustrate for\n// loop begins when x=2\n\
  // and runs till x <=4\nfor (x = 2; x <= 4; x++) {console.log(\"Value of x:\" +\
  \ x);}\n```\n\n输出：\nValue of x:2\nValue of x:3\nValue of x:4\n\n## 流程图\n\n下面的流程图显示了\
  \ for 循环的工作。你可以看到 for 循环中的控制流。\n\n![Lightbox](img/23.png)\n\n示例：\n\n在下面的示例中，函数包含一个\
  \ for 语句，用于计算滚动列表（允许多选的 `<select>` 元素）中已选选项的数量。\n\n```html\n<form name=\"selectForm\"\
  ><label for=\"musicTypes\">选择一些音乐类型，然后点击下面的按钮：</label><select id=\"musicTypes\"\
  \ name=\"musicTypes\" multiple><option selected>R&B</option><option>Jazz</option><option>Blues</option><option>New\
  \ Age</option><option>Classical</option><option>Opera</option></select><button id=\"\
  btn\" type=\"button\">选择了几个?</button></form>\n```\n\n#### JavaScript\n\n在这里，`for`\
  \ 语句声明变量 `i` 并将其初始化为 `0`。它检查 `i` 是否小于 `<select>` 元素中选项的数量，执行随后的 `if` 语句，并在每次循环后将\
  \ `i` 增 1。\n\n```javascript\nfunction countSelected(selectObject) {\n  let numberSelected\
  \ = 0;\n  for (let i = 0; i < selectObject.options.length; i++) {\n    if (selectObject.options[i].selected)\
  \ {\n      numberSelected++;\n    }\n  }\n  return numberSelected;\n}\nconst btn\
  \ = document.getElementById(\"btn\");\nbtn.addEventListener(\"click\", () => {\n\
  \  const musicTypes = document.selectForm.musicTypes;\n  console.log(`You have selected\
  \ ${countSelected(musicTypes)} option(s).`);\n});\n```\n\n### do...while 语句\n\n\
  do ... while 循环的工作方式与 while 循环非常相似，不同之处它在测试表达式之前执行语句。其效果是 do ... while 循环内的语句至少会执行一次。\n\
  \n示例：Listing 6-6: Using a do . . while Loop\n\n\n\n\n在 JavaScript 中，`do while` 循环是一种控制语句，允许代码根据指定的布尔条件反复运行。它类似于一个迭代的\
  \ `if` 语句。你可以使用 `do…while` 循环来确保某个代码块至少运行一次。\n\n循环主要分为两类：\n\n1. **访问受控循环**：这类循环在进入循环体之前会先检查测试条件。入口控制循环就是我们在\
  \ `while` 和 `for` 循环中看到的循环。\n2. **退出控制循环**：这类循环中，在循环体结束后会检查或测试测试条件。因此，无论测试条件是真是假，循环体都会至少运行一次。退出控制循环就是\
  \ `do-while` 循环。\n\n`do...while` 语句会重复执行，直到指定的条件评估为 `false`。\n\n`do...while` 语句的格式如下：\n\
  \n```\ndo { // Statements\n} while(conditions)\n```\n\n`statement` 在检查条件之前总是执行一次。（如果需要执行多个语句，请使用块语句（`{\
  \ }`将这些语句组合。）\n\n如果 `condition` 为 `true`，则再次执行语句。在每次执行结束时，都会检查条件。当条件为 `false` 时，执行停止，控制权传递到\
  \ `do...while` 语句之后的语句。\n\n### 示例：\n\n在以下示例中，`do` 循环至少迭代一次，直到 `i` 不再小于 `5` 为止。\n\
  \n```javascript\nlet i = 0;do {i += 1;console.log(i);} while (i < 5);\n```\n\n下面的示例将展示\
  \ `do…while` 循环的使用：\n```javascript\nlet test = 1;do {console.log(test);test++; while(test<=5)\n\
  ```\n\n`do … while` 和 `while` 循环的主要区别在于，`do … while` 循环保证至少运行一次。而如果给定的条件不满足，`while`\
  \ 循环甚至一次都不会运行。\n\n下面的示例将尝试理解两种循环之间的区别：\n```javascript\nlet test = 1;do {console.log(test)}\
  \ while(test<1)\nwhile(test<1){console.log(test)}\n```\n输出：1\n\n**解释**：我们可以看到，即使\
  \ `do…while` 循环中的条件不满足，代码仍然运行一次；但在 `while` 循环的情况下，在进入循环之前会先检查条件。由于条件不匹配，因此 `while`\
  \ 循环没有执行。\n\n## do … while 与 While 循环的区别\n\n| Do….While 循环 | While 循环 |\n| :---\
  \ | :--- |\n| 它是一个退出控制循环 | 它是一个入口控制循环。 |\n| 无论条件如何，迭代次数至少为一次 | 迭代次数取决于指定的条件 |\n\
  | 代码块在末尾控制 | 代码块在开始处控制 |\n| 注意：在为循环编写条件时，我们应该始终添加能够终止代码执行的代码，否则循环将始终为真并导致浏览器崩溃。\
  \ | 支持的浏览器：1. Chrome, 2. Edge, 3. Safari, 4. Firefox, 5. Internet Explorer |\n\n\
  ## While 语句\n\n`while` 语句创建一个只要条件评估为 `true` 就会运行的循环。列表 6-5 显示了一个包含 `while` 循环示例的网页。\n\
  \n```html\n<html><head><title>猜单词</title></head>body><script>var guessedWord = prompt(\"\
  我在想哪个单词？\");while (guessedWord != \"sandwich\") { // 只要猜的单词不是 sandwichprompt(\"\
  不对，不是这个。再试一次.\");}alert(\"恭喜你！完全正确!\"); //在退出循环后执行此操作</script></body>></html>\n\
  ```\n\n`while` 语句只要指定的条件评估为 `true`，就会执行其语句。`while` 语句的格式如下：\n\n```\nwhile (condition)\
  \ { 要执行的代码块\n}\n```\n\n如果 `condition` 变为 `false`，循环内的 `statement` 停止执行，控制权传递到循环之后的语句。\n\
  \n这是一个从 1 数到 5 的 `while` 循环示例：\n\n```javascript\nlet count = 1;while (count <= 5)\
  \ {console.log(count);count++;}\n```\n输出：12345\n**解释**： \n1. `Count` 初始化为 `1`。\n\
  2. 只要 `count` 小于或等于 `5`，循环就会运行。\n3. 在循环内部，`console.log(count)` 输出 `count` 的当前值。\n\
  4. 每次迭代后，`count` 增加 1（`count++`）。\n\n条件测试在循环内的 `statement` 执行之前发生。如果条件返回 `true`，则执行\
  \ `statement` 并再次测试 `condition`。如果条件返回 `false`，执行停止，控制权传递到循环之后的语句。\n\n*(注：由于原始文本包含大量重复和乱码的格式，此处已根据高级文档工程师的标准提取了核心内容并进行了规范翻译与排版。)*\n\
  \n\n\n\n`for...in` 循环遍历对象的属性。对于每个属性，代码块中的代码都会被执行。\n\n### 语法\n\n```javascript\nfor\
  \ (let i in obj1) {\n  // 在控制台打印 obj1 中所有的键\n  console.log(i);\n}\n```\n\n### 示例：JavaScript\
  \ For In 循环\n\n`for in` 语句循环遍历对象的属性：\n\n```javascript\nconst person = {fname:\"\
  John\", lname:\"Doe\", age:25};\nlet txt = \"\";\nfor (let x in person) {\n  txt\
  \ += person[x] + \" \";\n}\ndocument.getElementById(\"demo\").innerHTML = txt;\n\
  ```\n\n### 示例说明\n\n1. `for in` 循环遍历 `person` 对象。\n2. 每次迭代都会返回一个键 (`x`)。\n3. 使用该\
  \ `key` 来访问该 `key` 的值。\n4. `key` 的值是 `person[x]`。\n\n### for-in 循环重要点\n\n1. 使用 `for-in`\
  \ 循环遍历非数组对象。虽然我们可以对数组使用 `for-in` 循环，但通常不建议这样做。相反，请使用 `for` 循环对数组进行遍历。\n2. 使用 `for-in`\
  \ 循环遍历的属性还包括 `Prototype`（原型）链中上层对象的属性。\n3. 属性遍历的顺序可能与对象中定义的属性顺序不匹配。\n\n### for-in\
  \ 循环示例\n\n**示例：** 一个说明对数组使用 `for-in` 循环的简单示例（注：示例代码为 for of）。\n\n```javascript\n\
  const array = [1, 2, 3, 4, 5];\nfor (const element of array) {\n  console.log(element);\n\
  }\n```\n**输出：**\n`12345`\n\n**示例：** For-in 循环遍历对象的属性及其原型链的属性。如果我们想同时显示“student1”对象的属性（仅属于该对象的属性）和原型链的属性，我们可以通过\
  \ `for in` 循环来实现。\n\n```javascript\nconst courses = {\n  // 声明一个 courses 对象\n  firstCourse:\
  \ \"C++ STL\",\n  secondCourse: \"DSA Self Paced\",\n  thirdCourse: \"CS Core Subjects\"\
  \n};\n// 创建一个新的空对象，\n// 其原型被设置为 courses 对象\nconst student1 = Object.create(courses);\n\
  // 定义 student1 的属性和方法\nstudent1.id = 123;\nstudent1.firstName = \"Prakhar\";\nstudent1.showEnrolledCourses\
  \ = function () {\n  console.log(courses);\n};\n// 遍历\n// student1 对象的所有属性\nfor\
  \ (let prop in student1) {\n  console.log(prop + \" -> \" + student1[prop]);\n}\n\
  ```\n**输出：**\n`id -> 123`\n`firstName -> Prakhar`\n`showEnrolledCourses -> function\
  \ () {console.log(courses);}`\n`firstCourse -> C++ STL`\n`secondCourse -> DSA Self\
  \ Paced`\n`thirdCourse -> CS Core Subjects`\n\n**支持的浏览器：**\n下方列出了支持的浏览器：\n1. Google\
  \ Chrome\n2. Edge\n3. Firefox\n4. Opera\n5. Safari\n\n### For Of 循环\n\nJavaScript\
  \ `for of` 语句遍历可迭代对象的值，例如数组、字符串、map、set、NodeLists 等。与传统的 `for` 循环相比，它提供了更简单的语法。\n\
  \n### 语法\n\n```javascript\nfor (variable of iterableObjectName) {\n  // 要执行的代码块\n\
  }\n```\n\n#### 参数：\n\n1. **Variable (变量)**：代表可迭代对象每次迭代的当前值。对于每次迭代，下一个属性的值会被赋值给 `variable`。`Variable`\
  \ 可以用 `const`、`let` 或 `var` 声明。\n2. **Iterable (可迭代对象)**：任何可以被遍历的对象（例如数组、字符串、map）。\n\
  \n### 示例：\n\n**遍历数组：**\n```javascript\nconst arr = [ \"Fred\", \"Tom\", \"Bob\"\
  \ ];\nfor (let i of arr) {\n  console.log(i);\n}\n// 输出:\n// Fred\n// Tom\n// Bob\n\
  ```\n```javascript\nconst array = [1, 2, 3, 4, 5];\nfor (const item of array) {\n\
  \  console.log(item);\n}\n// 输出: 12345\n```\n**解释：**\n代码初始化了一个包含 1 到 5 值的数组。然后使用\
  \ `for…of` 循环遍历数组的每个元素，并将每个元素打印到控制台。\n\n**遍历 Map：**\n```javascript\nconst m = new\
  \ Map();\nm.set(1, \"black\");\nm.set(2, \"red\");\nfor (let n of m) {\n  console.log(n);\n\
  }\n// 输出:\n// [1, black]\n// [2, red]\n```\n```javascript\nconst map = new Map([['key1',\
  \ 'value1'],['key2', 'value2'],['key3', 'value3']]);\nfor (const [key, value] of\
  \ map) {\n  console.log(`Key: ${key}, Value: ${value}`);\n}\n// 输出:\n// Key: key1,\
  \ Value: value1\n// Key: key2, Value: value2\n// Key: key3, Value: value3\n```\n\
  **解释：**\n在这里，\n1. `map` 是你想要遍历的对象。\n2. `for (const [key, value] of map)` 启动了循环，`key,\
  \ value` 代表 map 中的键值对。\n3. `console.log(`Key: ${key}, Value: ${value}`)` 打印了键值对。\n\
  \n**遍历 Set：**\n```javascript\nconst s = new Set();\ns.add(1);\ns.add(\"red\");\n\
  for (let n of s) {\n  console.log(n);\n}\n// 输出:\n// 1\n// red\n```\n```javascript\n\
  const str = \"Hello\";\nfor (const char of str) {\n  console.log(char);\n}\n```\n\
  **解释：**\n在这里，\n1. `str` 是你想要遍历的字符串。\n2. `for (const char of str)` 启动了循环，`char` 代表字符串中的每个字符。\n\
  3. `console.log(char)` 打印了字符。\n\n### 第十一章：利用 DOM\n\n网页包含一个名为文档对象模型的编程接口。程序可以更改网页的结构、设计和样式。HTML\
  \ 在加载时变为 DOM 对象。`document` 是 HTML 根元素。\n\n根据 W3C 的定义：“W3C 文档对象模型（DOM）是一个与语言无关的接口，允许程序动态地访问和更新内容、结构和样式。”\n\
  \n#### 文对象的属性\n下面是可以访问的文档属性。\n\n#### 文档的方法\n我们可以通过方法访问并更改文档的内容。重要的方法如下：\n\n| 方法\
  \ | 说明 |\n| :--- | :--- |\n| `write(\"string\")` | 在文档上写入指定的字符串。 |\n| `writeln(\"\
  string\")` | 在文档上写入指定的字符串并在末尾换行符。 |\n| `getElementById()` | 返回指定 id 的元素。 |\n| `getElementsByName()`\
  \ | 返回具有指定名称的元素。 |\n| `getElementsByTagName()` | 返回具有指定标签名的元素。 |\n| `getElementsByClassName()`\
  \ | 返回具有指定类名的元素。 |\n\n### 通过文档对象访问字段值\n在下面的示例中，它通过用户获取输入框的值。在这里，我们使用 `document.form1.name.value`\
  \ 来获取 name 字段的值。\n\n```html\n<script type=\"text/javascript\" >\n  function printvalue(){\n\
  \    var name=document.form1.name.value;\n    alert(\"Welcome: \"+name);\n  }\n\
  </script>\n<form name=\"form1\" >\n  Enter Name: <input type=\"text\" name=\"name\"\
  \ />\n  <input type=\"button\" onclick=\"printvalue()\" value=\"print name\" />\n\
  </form>\n```\n`form1` 是表单的名称。`name` 是输入框的属性名称。`value` 是属性，它返回输入框的值。\n\n# JavaScript\
  \ - document.getElementById() 方法\n\n`document.getElementById()` 方法返回指定 id 的元素。\n\
  \n上面的示例使用了 `document.form1.name.value`。\n\n\n\n\n为了获取输入的值。与此不同，我们可以使用 `document.getElementById()`\
  \ 方法来获取输入文本的值。但我们需要为输入字段定义 `id`。让我们来看 `document.getElementById()` 方法的一个简单示例，该方法可以打印给定数字的立方。\n\
  \n```html\n<script type=\"text/javascript\">\n  function getcube(){\n  var number=document.getElementById(\"\
  number\").value;\n  alert(number*number*number);\n  }\n</script>\n<form>\n  输入数字:<input\
  \ type=\"text\" id=\"number\" name=\"number\"/><br/>\n  <input type=\"button\" value=\"\
  cube\" onclick=\"getcube()\"/>\n</form>\n```\n\n# JavaScript - document.getElementsByName()\
  \ 方法\n\n`document.getElementsByName()` 方法返回所有指定名称的元素。\n\n`getElementsByName()` 方法的语法如下：\n\
  \n| `document.getElementsByName(\"name\")` |\n\n## `document.getElementsByName()`\
  \ 方法示例\n\n在这个例中中，我们将统计性别的总数。在这里，我们正在使用 `getElementsByName()` 方法来获取所有的性别。\n\n```html\n\
  <script type=\"text/javascript\">\n  function totalelements() {\n  var allgenders=document.getElementsByName(\"\
  gender\");\n  alert(\"Total Genders:\"+allgenders.length);\n  }\n</script>\n<form>\n\
  \  男:<input type=\"radio\" name=\"gender\" value=\"male\">\n  女:<input type=\"radio\"\
  \ name=\"gender\" value=\"female\">\n    <input type=\"button\" onclick=\"totalelements()\"\
  \ value=\"Total Genders\">\n</form>\n```\n\n# JavaScript - document.getElementsByTagName()\
  \ 方法\n\n`document.getElementsByTagName()` 方法返回所有指定标签名称的元素。\n\n`getElementsByTagName()`\
  \ 方法的语法如下：\n\n| `document.getElementsByTagName(\"name\")` |\n\n## `document.getElementsByTagName()`\
  \ 方法示例\n\n在这个例中，我们将统计文档中使用的段落总数。为了做到这一点，我们调用了 `document.getElementsByTagName(\"\
  p\")` 方法，它返回了段落的总数。\n\n```html\n<script type=\"text/javascript\">\n  function countpara(){\n\
  \  var totalpara=document.getElementsByTagName(\"p\");\n  alert(\"total p tags are:\
  \ \"+totalpara.length);\n  }\n</script>\n<p>这是一个段落</p>\n<p>在这里，我们将通过 `getElementByTagName()`\
  \ 方法来统计段落的总数。</p>\n<p>让我们来看一个简单的示例</p>\n<button onclick=\"countpara()\">计数段落</button>\n\
  ```\n\n### `document.getElementsByTagName()` 方法的另一个示例\n\n在这个例中，我们将统计文档中使用的 `h2`\
  \ 和 `h3` 标签的总数。\n\n```html\n<script type=\"text/javascript\">\n  function counth2(){\n\
  \  var totalh2=document.getElementsByTagName(\"h2\");\n  alert(\"total h2 tags are:\
  \ \"+totalh2.length);\n  }\n  function counth3(){\n  var totalh3=document.getElementsByTagName(\"\
  h3\");\n  alert(\"total h3 tags are: \"+totalh3.length);\n  }\n</script>\n<h2>这是\
  \ h2 标签</h2>\n<h2>这是 h2 标签</h2>\n<h3>这是 h3 标签</h3>\n<h3>这是 h3 标签</h3>\n<h3>这是 h3\
  \ 标签</h3>\n<button onclick=\"counth2()\">计数 h2</button>\n<button onclick=\"counth3()\"\
  >计数 h3</button>\n```\n\n# JavaScript - innerHTML\n\n`innerHTML` 属性可以用于在 html 文档写入动态\
  \ html。\n\n它主要用于网页中生成动态 html，例如注册表单、评论表单、链接等。\n\n### `innerHTML` 属性示例\n\n在这个例中，我们将在用户点击按钮时创建\
  \ html 表单。在这个例中，我们动态地在 id 为 `mylocation` 的 div 内部写入 html 表单。我们正通过调用 `document.getElementById()`\
  \ 方法来识别此位置。\n\n```html\n<script type=\"text/javascript\" >\n  function showcommentform()\
  \ {\n  var data=\"Name:<input type='text' name='name'><br>Comment:<br><textarea\
  \ rows='5' cols='80'></textarea><br><input type='submit' value='Post Comment'>\"\
  ;\n  document.getElementById('mylocation').innerHTML=data;\n  }\n</script>\n<form\
  \ name=\"myForm\">\n  <input type=\"button\" value=\"comment\" onclick=\"showcommentform()\"\
  >\n  <div id=\"mylocation\"></</div>\n</form>\n```\n\n### 使用 innerHTML 显示/隐藏评论表单\n\
  \n```html\n<!DOCTYPE html >\n<html\n<head>\n  <title> 第一 JS </title>\n  <script>\n\
  \  var flag=true;\n  function commentform(){\n  var cform=\"<form action='Comment'\
  \ > Name: <br><input type='text' name='name' /><br/>Email: <br><input type='email'\
  \ name='email' /><br> Comment: <br/><textarea rows='5' cols='70' ></textarea><br><input\
  \ type='submit' value='Post Comment' /></form>\";\n  if(flag){\n  document.getElementById(\"\
  mylocation\").innerHTML=cform;\n  flag=false;\n  }else{\n  document.getElementById(\"\
  mylocation\").innerHTML=\"\";\n  }\n  </script>\n</head>\n<body>\n  <button onclick=\"\
  commentform()\" > 评论</button>\n  <div id=\"mylocation\"></div>\n</body>\n</html>\n\
  \n# JavaScript - innerHTML\n\n`innerHTML` 属性可以用于在 html 文档上写入动态 html。\n\n它主要用于网页中生成动态\
  \ html，例如注册表单、评论表单、链接等。\n\n## JavaScript innerHTML 示例\n\n在这个例中，我们将在用户点击按钮时创建 html\
  \ 表单。在这个例中，我们动态地在 id 为 `mylocation` 的 div 内部写入 html 表单。我们正通过调用 `document.getElementById()`\
  \ 方法来识别此位置。\n\n```html\n<script type=\"text/javascript\" >\n  function showcommentform()\
  \ {\n  var data=\"Name:<input type='text' name='name'><br>Comment:<br><textarea\
  \ rows='5' cols='80'></textarea><br><input type='submit' value='Post Comment'>\"\
  ;\n  document.getElementById('mylocation').innerHTML=data;\n  }\n</script>\n<form\
  \ name=\"myForm\">\n  <input type=\"button\" value=\"comment\" onclick=\"showcommentform()\"\
  >\n  <div id=\"mylocation\"></</div>\n</form>\n```\n\n### 使用 innerHTML 显示/隐藏评论表单\n\
  \n```html\n<!DOCTYPE html >\n<html\n<head>\n  <title> 第一 JS </title>\n  <script>\n\
  \  var flag=true;\n  function commentform(){\n  var cform=\"<form action='Comment'\
  \ > Name: <br><input type='text' name='name' /><br/>Email: <br><input type='email'\
  \ name='email' /><br> Comment: <br/><textarea rows='5' cols='70' ></textarea><br><input\
  \ type='submit' value='Post Comment' /></form>\";\n  if(flag){\n  document.getElementById(\"\
  mylocation\").innerHTML=cform;\n  flag=false;\n  }else{\n  document.getElementById(\"\
  mylocation\").innerHTML=\"\";\n  }\n  </script>\n</head>\n<body>\n  <button onclick=\"\
  commentform()\" > 评论</button>\n  <div id=\"mylocation\"></div>\n</body>\n</html>\n\
  ```\n\n---\n\n# 第十二章 JavaScript 浏览器对象模型\n\n一种与浏览器交互的 JavaScript 编程工具被称为浏览器对象模型 (BOM)。这使得\
  \ JavaScript 代码能够访问并操作浏览器。\n\nJavaScript 可以通过浏览器对象模型与浏览器功能交互。你可以使用 BOM 构建窗口、显示警报消息并更改当前显示的页面。\n\
  \n浏览器的默认对象是 `window`，这意味着你可以通过指定 `window` 或直接调用来使用窗口函数：\n\n`window.alert(\" Hey\
  \ Friend\");` // 等同于 `alert(\" Hey Friend \")`\n\n你可以使用定义在 window 下的许多属性（其他对象），如\
  \ `document`、`history`、`screen`、`navigator`、`location`、`innerHeight`、`innerWidth`。\n\
  \n## 理解浏览器环境\n\n浏览器是复杂的软件。当它们运行良好时，会将所有功能整合到流畅且简单的浏览体验中。我们都知道浏览器有时会出现小故障，有时还会崩溃。为了理解为什么发生这些情况，并更好地使用浏览器，了解浏览器的各个部分是重要的。\n\
  \n### 用户界面\n\n当你输入 URL、点击主页、创建或使用书签以及更改浏览器设置时，与浏览器交互的部分被称为用户界面，或浏览器架构（不要与 Google\
  \ 的 Chrome 浏览器混淆）。\n\n浏览器架构包括浏览菜单、窗口框架、工具栏和按钮，它们位于加载网页的主窗口之外。\n\n### 加载器\n\n加载器是浏览器中与网络服务器通信并下载网页、脚本、CSS、图形以及网页的所有组件的部分。通常，加载是显示网页时产生用户等待时间最长的部分。\n\
  \n\n\n\n它显示了网页加载过程中发生的所有事件的图形化视图，并带有一个显示每个部分加载所需的时间轴。\n\n一旦下载了 HTML 文档，浏览器将向服务器打开多个连接，以便尽可能快地下载网页的其他部分。通常，HTML\
  \ 文档中链接的网页部分（也称为资源）是按照它们在 HTML 文档中出现的顺序进行加载的。\n\n例如，在页面 `head` 元素中链接的脚本将比在页面底部链接的脚本之前加载。资源的加载顺序对于页面显示给用户的效率和速度至关重要。为了让网页能够正确显示，需要加载并解析适用于该页面的\
  \ CSS 样式。因此，CSS 应该始终加载在网页顶部的 `head` 元素中。\n\nJavaScript 有时也会影响网页的显示，但更多时候，它只影响功能。当脚本会影响网页的显示时，它应该加载在文档的\
  \ `head` 中（在 CSS 之后）。\n\n对于网页外观不是至关重要的脚本应该链接在 `body` 元素的最后末尾（即 `</body>` 之前），这样就不会产生阻塞阻塞场景，即浏览器在等待脚本加载之前不向用户显示任何内容。\n\
  \n### HTML 解析\n\n网页下载后，浏览器的 HTML 解析组件将开始解析 HTML 以创建网页的模型（称为文档对象模型或 DOM）。第 11 章将详细介绍\
  \ DOM，它好比你网页的一张地图。JavaScript 程序员使用这幅地图来操作和访问网页的所有不同部分。\n\nHTML 解析完成后，浏览器开始下载网页的其他组件。\n\
  \n### CSS 解析\n\n一旦完全下载了网页的 CSS，Web 浏览器将解析这些样式并确定哪些样式适用于该 HTML 文档。CSS 解析是一个复杂的过程，涉及对文档进行多次扫描，以便正确应用每种样式，并考虑样式之间如何相互影响。\n\
  \n### JavaScript 解析\n\n显示网页的下一步是 JavaScript 解析。JavaScript 解析器会按照脚本在文档中出现的顺序编译并运行你网页中的每个脚本。如果你的\
  \ JavaScript 代码在 HTML DOM 内部添加或删除了元素、文本或样式，浏览器将根据此更新 HTML 和 CSS 渲染结果。\n\n### 布局与渲染\n\
  \n最后，一旦网页的所有资源都已加载并解析完成，浏览器将确定如何显示页面然后进行显示。除非你指定了文档早之前包含的脚本应等待到最后再执行，否则脚本的布局和渲染将按照它们包含在文档中的顺序发生。\n\
  \n通常情况下，尽可能快地向用户显示网页更好，即使页面在首次出现时可能尚未完全功能。现代网站经常专门采用这种策略（称为延迟加载）来提高页面的感知性能。\n\n\
  如果你曾经打开过网页，并且必须等待一会儿才能使用表单或交互元素，那么你就见证了延迟加载的运行。\n\n## 启动 BOM\n\nJavaScript 程序员可以通过名为“浏览器对象模型”（Browser\
  \ Object Model）的 API 获取有关用户浏览器的信息并控制用户体验的方面。\n\n浏览器对象模型没有官方标准。不同的浏览器以不同的方式实现它。然而，关于\
  \ JavaScript 如何与 浏览器交互，有一些普遍接受的标准。\n\n## Navigator 对象\n\n`Navigator` 对象为 JavaScript\
  \ 提供了访问用户浏览器信息的权限。`Navigator` 对象的命名于第一个实现它的 浏览器 Netscape Navigator。`Navigator` 对象并不是内置于\
  \ JavaScript 的。相反，它是浏览器的一种功能，可以使用 JavaScript 访问。几乎每个 浏览器（以及每个现代 浏览器）都采用了相同的术语来指代这个最高级别的浏览器对象。\n\
  \n`Navigator` 对象访问的有用信息，如：\n\n1. 浏览器的名称\n2. 浏览器的版本\n3. 浏览器运行的计算机物理位置（如果用户允许浏览器访问地理位置数据）。\n\
  4. 浏览器的语言\n5. 浏览器运行的计算机类型。\n\n## Window 对象\n\n在 JavaScript 中，`Window` 对象代表包含文档对象模型文档的窗口。`window`\
  \ 对象代表浏览器中的一个窗口。`window` 对象由浏览器自动创建。`Window` 是浏览器的对象，它不是 JavaScript 的对象。JavaScript\
  \ 对象是字符串、数组、日期等。\n\n`Window` 对象提供了对各种属性和方法的访问，使其能够与浏览器环境进行交互，包括操作文档、处理事件、管理计时器、显示对话框等。\n\
  \n### window 对象的方法\n\n`window` 对象的重要方法如下：\n\n| 方法 |  |\n| :--- | :--- |\n| `alert()`\
  \ | 显示包含消息和 ok 按钮的警报框。 |\n| `confirm()` | 显示包含消息以及 ok 和取消按钮的确认对话框框。 |\n| `prompt()`\
  \ | 显示对话框以从用户处获取输入。 |\n| `open()` | 打开新窗口。 |\n| `close()` | 关闭当前窗口。 |\n| `setTimeout()`\
  \ | 在指定时间后执行操作，如调用函数、计算表达式等。 |\n\n### javascript 中 alert() 的示例\n\n它显示警告对话框。它有消息和\
  \ ok 按钮。\n\n```html\n<script type=\"text/javascript\">\n  function msg(){\n    alert(\"\
  Hello Alert\")\n  }\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"\
  点击\">\n```\n\n### javascript 中 confirm() 的示例\n\n它显示确认框。它带有消息、ok 和取消按钮。\n\n```html\n\
  <script type=\"text/javascript\">\n  function msg(){\n    var v=confirm(\"Are sure?\"\
  );\n    if(v==true){\n      alert(\"ok\");\n    } else{\n      alert(\"cancel\"\
  );\n    }\n  }\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"删除记录```\n\
  \n### javascript 中 prompt() 的示例\n\n它显示用于输入的提示框。它有消息和文本框。\n\n```html\n<script type=\"\
  text/javascript\">\n  function msg(){\n    var v=prompt(\"Who are you?\");\n   \
  \ alert(\"I am \"+v);\n  }\n</script>\n<input type=\"button\" onclick=\"msg()\"\
  \ value=\"点击\">\n```\n\n### javascript 中 open() 的示例\n\n它在新窗口中显示内容。\n\n```html\n\
  <script type=\"text/javascript\">\n  function msg(){\n    open(\"http://www.google.com\"\
  );\n  }\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"javatpoint\"\
  >\n```\n\n### javascript 中 setTimeout() 的示例\n\n它在指定的毫秒后执行其任务。\n\n```html\n<script\
  \ type=\"text/javascript\">\n  function msg(){\n    setTimeout(function(){\n   \
  \   alert(\"Welcome to Javatpoint after 2 seconds\")\n    },2000);\n  }\n</script>\n\
  <input type=\"button\" onclick=\"msg()\" value=\"点击\">\n```\n\n## JavaScript History\
  \ 对象\n\nJavaScript `history` 对象代表用户访问的 URL 数组。通过此对象，你可以加载之前的、之后的或特定的页面。\n\n`history`\
  \ 对象是 `window` 的属性，因此可以通过以下访问：\n\n`window.history` 或 `history`\n\n### JavaScript\
  \ history 对象的属性\n\nhistory 对象只有 1 个属性。\n\n| 序号 | 属性 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 1 | `length` | 返回历史 URL 的长度。 |\n\n### JavaScript history 对象的方法\n\nhistory\
  \ 对象有 3 个方法。\n\n| 序号 | 方法 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `forward()` | 加载下一个页面。\
  \ |\n| 2 | `back()` | 加载上一个页面。 |\n\n\n\n\n\n| 3 | `go()` | 加载指定的页码。 |\n\n### history\
  \ 对象示例\n\n让我们看看 history 对象的不同用法。\n\n1. `history.back();` 返回上一个页面。\n2. `history.forward();`\
  \ 返回下一页。\n3. `history.go(2);` 返回后第 2 个页面。\n4. `history.go(-2);` 返回上第 2 个页面。\n\n\
  ## JavaScript Navigator 对象\n\nJavaScript `navigator` 对象用于浏览器检测。它可以用于获取浏览器信息，如 `appName`、`appCodeName`、`userAgent`\
  \ 等。\n\n`navigator` 对象是 `window` 的属性，因此可以通过以下访问：\n\n| `window.navigator` 或 `navigator`\
  \ |\n\n### JavaScript navigator 对象属性\n\n`navigator` 对象有许多属性可以返回浏览器信息。\n\n| 序号 |\
  \ 属性 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `appName` | 返回名称 |\n| 2 | `appVersion`\
  \ | 返回版本 |\n| 3 | `appCodeName` | 返回代码名 |\n| 4 | `cookieEnabled` | 如果 cookie 已启用则返回\
  \ true，否则返回 false |\n| 5 | `userAgent` | 返回用户代理 |\n| 6 | `language` | 返回语言。仅在 Netscape\
  \ 和 Firefox 中支持。 |\n| 7 | `userLanguage` | 返回用户语言。仅在 IE 中支持。 |\n| 8 | `plugins`\
  \ | 返回插件。仅在 Netscape 和 Firefox 中支持。 |\n| 9 | `systemLanguage` | 返回系统语言。仅在 IE 中支持。\
  \ |\n| 10 | `mimeTypes[]` | 返回 mime 类型数组。仅在 Netscape 和 Firefox 中支持。 |\n| 11 | `platform`\
  \ | 返回平台，例如 Win32。 |\n| 12 | `online` | 如果浏览器在线则返回 true，否则返回 false。 |\n\n## JavaScript\
  \ navigator 对象方法\n\nnavigator 对象的方法下所示。\n\n| 序号 | 方法 | 描述 |\n| :--- | :--- | :---\
  \ |\n| 1 | `javaEnabled()` | 检查 java 是否启用。 |\n| 2 | `taintEnabled()` | 检查 taint\
  \ 是否启用。自 JavaScript 1.2 起已弃用。 |\n\n### navigator 对象示例\n\n让我们看看 history 对象的不同用法。\n\
  \n```\n<script>\n  document.writeln(\" <br/> navigator.appCodeName: \"+navigator.appCodeName);\n\
  \  document.writeln(\" <br/> navigator.appName: \"+navigator.appName);\n  document.writeln(\"\
  \ <br/> navigator.appVersion: \"+navigator.appVersion);\n  document.writeln(\" <br/>\
  \ navigator.cookieEnabled: \"+navigator.cookieEnabled);\n  document.writeln(\" <br/>\
  \ navigator.language: \"+navigator.language);\n  document.writeln(\" <br/> navigator.userAgent:\
  \ \"+navigator.userAgent);\n  document.writeln(\" <br/> navigator.platform: \"+navigator.platform);\n\
  \  document.writeln(\" <br/> navigator.onLine: \"+navigator.onLine);\n</script>\n\
  ```\n\n# JavaScript Screen 对象\n\nJavaScript `screen` 对象包含浏览器屏幕信息。它可以用于显示屏幕宽度、高度、`colorDepth`、`pixelDepth`\
  \ 等。\n\n`navigator` 对象是 `window` 的属性，因此可以通过以下访问：\n\n| `window.screen` 或 `screen`\
  \ |\n\n### JavaScript Screen 对象属性\n\n`screen` 对象有许多属性返回浏览器信息。\n\n| 序号 | 属性 | 描述\
  \ |\n| :--- | :--- | :--- |\n| 1 | `width` | 返回屏幕宽度 |\n| 2 | `height` | 返回屏幕高度 |\n\
  | 3 | `availWidth` | 返回可用宽度 |\n| 4 | `availHeight` | 返回可用高度 |\n| 5 | `colorDepth`\
  \ | 返回颜色深度 |\n| 6 | `pixelDepth` | 返回像素深度。 |\n\n### JavaScript Screen 对象示例\n\n让我们看看\
  \ screen 对象的不同用法。\n\n```\n<script>\n  document.writeln(\" <br/> screen.width: \"\
  +screen.width);\n  document.writeln(\" <br/> screen.height: \"+screen.height);\n\
  \  document.writeln(\" <br/> screen.availWidth: \"+screen.availWidth);\n  document.writeln(\"\
  \ <br/> screen.availHeight: \"+screen.availHeight);\n  document.writeln(\" <br/>\
  \ screen.colorDepth: \"+screen.colorDepth);\n  document.writeln(\" <br/> screen.pixelDepth:\
  \ \"+screen.pixelDepth);\n</script>\n```\n\n# 第十三章\n\n## JavaScript 表单验证\n\n`JavaScript\
  \ 表单验证` 通过在提交前验证用户输入来确保数据完整性。它会验证密码、电子邮件和选择等字段，为无效数据提供警报，并增强用户体验和数据准确性。\n\n验证用户提交的表单是非常重要的，因为它可能包含不适当的值。因此，验证是验证用户的必经之路。\n\
  \nJavaScript 提供了在客户端验证表单的功能，因此数据处理将比服务器端验证更快。大多数 Web 开发者倾向于使用 JavaScript 表单验证。\n\
  \n### JavaScript 中表单验证的方法\n\n在 JavaScript 中，我们遵循以下步骤：\n\n1. **数据获取**：使用 `forms`\
  \ 获取 `name`、`email`、`password` 等各种字段的值。\n2. **数据验证**：\n   - `Name`: 检查 `name` 是否为空。\n\
  \   - `Address`: 检查 `address` 是否为空或包含数字。\n   - `Email`: 验证 `email` 字段为空且包含 `@` 符号。\n\
  \   - `Password`: 验证 `password` 字段不为空且至少有 6 个字符。\n   - `Course Selection`: 确保从下拉菜单中选择了课程。\n\
  3. **错误处理**：如果任何验证失败，将使用 `window.alert` 显示警报消息，确保用户关注。\n4. **提交控制**：如果所有验证通过，则返回\
  \ `true`，表单可以提交；否则返回 `false` 阻止表单提交。\n5. **焦点调整**：将焦点置于失败的字段，确保用户关注。\n\n### JavaScript\
  \ 表单验证示例\n\n在此示例中，我们将验证 `name` 和 `password`。name 不能空，password 不能少于 6 个字符。在这里我们在提交表单时进行验证。在给定值正确之前，用户不会跳转到下一个页面。\n\
  \n```html\n<script>\n  function validateform(){\n    var name=document.myform.name.value;\n\
  \    var password=document.myform.password.value;\n    if(name==null || name==\"\
  \"){\n      alert(\"名称不能为空\");\n      return false;\n    }else if(password.length\
  \ <6){\n      alert(\"密码至少需要 6 个字符。\");\n      return false;\n    }\n  }\n</script>\n\
  <body\n  <form name=\"myform\" method=\"post\" action=\"abc.jsp\" onsubmit=\"return\
  \ validateform()\">\n    名称: <input type=\"text\" name=\"name\"><br/>\n    密码: <input\
  \ type=\"password\" name=\"password\"><br/>\n    <input type=\"submit\" value=\"\
  注册\">\n  </form>\n</body>\n```\n\n### JavaScript 重输密码验证\n\n```html\n<script type=\"\
  text/javascript\">\n  function matchpass(){\n    var firstpassword=document.f1.password.value;\n\
  \    var secondpassword=document.f1.password2.value;\n    if(firstpassword==secondpassword){\n\
  \      return true;\n    }\n    else{\n      alert(\"密码必须一致!\");\n      return false;\n\
  \    }\n  }\n</script>\n<form name=\"f1\" action=\"register.jsp\" onsubmit=\"return\
  \ matchpass()\">\n  密码: <input type=\"password\" name=\"password\"/><br/>\n  重新输入密码:\
  \ <input type=\"password\" name=\"password2\"/><br/>\n  <input type=\"submit\">\n\
  </form>\n```\n\n### JavaScript 数字验证\n\n让我们验证文本框仅限数值值。在这里，我们使用了 `isNaN()` 函数。\n\n\
  \n\n\n\n```html\n<script>\n  function validate(){\n  var num=document.myform.num.value;\n\
  \  if (isNaN(num)){\n    document.getElementById(\"numloc\").innerHTML=\"仅限输入数字\"\
  ;\n    return false;\n  }else{\n    return true;\n    }\n  }\n</script>\n<form name=\"\
  myform\" onsubmit=\"return validate()\" >\n  数字: <input type=\"text\" name=\"num\"\
  \ ><span id=\"numloc\" ></span<br/>\n  <input type=\"submit\" value=\"提交\" >\n</form>\n\
  ```\n\n## 带有图片的 JavaScript 验证\n\n让我们来看一个交互式的 JavaScript 表单验证示例，如果输入正确或错误，它将显示对应的错误的图片。\n\
  \n```html\n<script>\n  function validate(){\n  var name=document.f1.name.value;\n\
  \  var password=document.f1.password.value;\n  var status=false;\n  if(name.length\
  \ <1 ){\n  document.getElementById(\"nameloc\").innerHTML=\n  \"<img src='unchecked.gif'/>\
  \ 请输入您的姓名\";\n  status=false;\n  }else{\n  document.getElementById(\"nameloc\").innerHTML=\"\
  \ <img src='checked.gif'/>\";\n  status=true;\n  }\n  if(password.length <6 ){\n\
  \  document.getElementById(\"passwordloc\").innerHTML=\n  \"<img src='unchecked.gif'/>\
  \ 密码至少需要 6 个字符\";\n  status=false;\n  }else{\n  document.getElementById(\"passwordloc\"\
  ).innerHTML=\" <img src='checked.gif'/>\";\n  }\n  return status;\n  }\n</script>\n\
  <form name=\"f1\" action=\"#\" onsubmit=\"return validate()\" >\n  <table>\n   \
  \ <tr><td> 输入姓名: </td><td><input type=\"text\" name=\"name\" />\n  <span id=\"nameloc\"\
  \ ></</span></td></tr>\n    <tr><td> 输入密码: </td><td><input type=\"password\" name=\"\
  password\" />\n  <span id=\"passwordloc\" ></</span></td></tr>\n    <tr><td colspan=\"\
  2\" ><input type=\"submit\" value=\"注册\" /></</tr>>\n  </table>\n</form>\n```\n\n\
  ### JavaScript 邮箱验证\n\n我们可以借助 JavaScript 来验证电子邮件。验证邮箱 ID 需要遵循许多准则，例如：\n\n1. 邮箱 ID\
  \ 必须包含 @ 符号字符。\n2. @ 之前和之后至少要有一个字符。\n3. 点（dot）之后必须至少有两个字符。\n\n让我们来看一个简单的示例来验证邮箱字段。\n\
  \n```html\n<script>\n  function validateemail()  {\n  var x=document.myform.email.value;\n\
  \  var atposition=x.indexOf(\"@\");\n  var dotposition=x.lastIndexOf(\".\");\n \
  \ if (atposition <1 || dotposition <atposition +2 || dotposition+2 >x.length){\n\
  \    alert(\"请输入有效的邮箱地址 \\n 符号位置:\"+atposition+\"\\n 点位置:\"+dotposition);\n    return\
  \ false;\n    }\n  }\n</script>\n<body>\n  <form name=\"myform\" method=\"post\"\
  \ action=\"#\" onsubmit=\"return validateemail();\" >\n  邮箱: <input type=\"text\"\
  \ name=\"email\" ><br/>\n  <input type=\"submit\" value=\"注册\" >\n</form>\n</body>\n\
  ```\n\n# 第十四章\n\n## JavaScript 面向对象编程\n\n![装饰花卉](img/image21-4.png)\n\n面向对象编程是一种基于类和对象的编程风格。这些类将数据（属性）和方法（动作）封装在一个盒子内部。开发\
  \ OOP 的目的是让代码更具活性且更容易维护。JavaScript 是一种基于原型的过程化语言，这意味着它同时支持函数式编程和面向对象编程。\n\n# JavaScript\
  \ 类\n\n在 JavaScript 中，类是特殊的函数类型。我们可以像定义函数一样定义类。JavaScript 类体内包含包括 `constructor`\
  \ 在内的各种类成员。类在严格模式下执行。因此，包含静默错误的代码会抛出错误。\n\n类语法包含：\n\n1. 类声明\n2. 类表达式\n\n## 声明\n\n\
  可以使用 `class` 声明来定义类。使用 `class` 关键字用于声明具有任何名称的类。根据 JavaScript 约定，类名以大写字母开头。\n\n###\
  \ 声明示例\n\n让我们来看一个声明类的简单示例。\n\n```javascript\n// 声明类\nclass Employee {\n  // 初始化对象\n\
  \  constructor(id,name) {\n    this.id=id;\n    this.name=name;\n  }\n  // 声明方法\n\
  \  detail() {\n    document.writeln(this.id+\" \"+this.name+\" <br>\")\n  }\n}\n\
  // 将对象传递给变量\nvar e1=new Employee(101,\"Martin Roy\");\nvar e2=new Employee(102,\"\
  Duke William\");\ne1.detail(); // 调用方法\ne2.detail();\n```\n\n### 声明示例：提升\n\n与函数声明不同，类声明不是\
  \ JavaScript 提升的一部分。因此，在调用类之前必须声明该类。让我们来看一个示例。\n\n```javascript\n// 这里我们在声明类之前调用了类\n\
  var e1=new Employee(101,\"Martin Roy\");\nvar e2=new Employee(102,\"Duke William\"\
  );\ne1.detail(); // 调用方法\ne2.detail();\n// 声明类\nclass Employee {\n  // 初始化对象\n \
  \ constructor(id,name) {\n    this.id=id;\n    this.name=name;\n  }\n  detail()\
  \ {\n    document.writeln(this.id+\" \"+this.name+\" <br>\")\n  }\n}\n```\n\n###\
  \ 声明示例：提升\n\n类只能声明一次。如果尝试多次声明类，会抛出错误。\n\n```javascript\n// 声明类\nclass Employee {\n\
  \  // 初始化对象\n  constructor(id,name) {\n    this.id=id;\n    this.name=name;\n  }\n\
  \  detail() {\n    document.writeln(this.id+\" \"+this.name+\" <br>\")\n  }\n}\n\
  // 将对象传递给变量\nvar e1=new Employee(101,\"Martin Roy\");\nvar e2=new Employee(102,\"\
  Duke William\");\ne1.detail(); // 调用方法\ne2.detail();\n```\nOUTPUT ![图片 3](img/26.png)\n\
  \n# 类表达式\n\n使用类表达式是定义类的另一种方法。在这里，并不强制为类命名。类表达式可以是命名的也可以是未命名的。\n\n## 无名类表达式\n\n可以在不分配名称的情况下表示类。\n\
  \n```javascript\nvar emp=class {\n  constructor(id,name) {\n    this.id=id;\n  \
  \  this.name=name;\n  }\n};\n```\n\n### 类示例：重复声明\n\n与类声明不同，类表达式允许我们重新声明同一个类。因此，如果我们尝试多次声明类，会抛出错误。\n\
  \n```javascript\n// 声明类\nvar emp=class {\n  // 初始化对象\n  constructor(id,name) {\n\
  \    this.id=id;\n    this.name=name;\n  }\n  detail() {\n    document.writeln(this.id+\"\
  \ \"+this.name+\" <br>\")\n  }\n}\n```\n\n## 命名类表达式示例\n\n我们可以用特定的名称表示类。在这里，类名的范围一直延伸到类体。可以使用\
  \ `class.name` 属性获取类。\n\n```javascript\nvar emp=class Employee {\n  constructor(id,name)\
  \ {\n    this.id=id;\n    this.name=name;\n  }\n};\ndocument.writeln(emp.name);\n\
  /*document.writeln(Employee.name); 在控制台发生错误：“ReferenceError: Employee is not defined”\
  \ */\n```\n\n\n\n\n\nJavaScript 是基于模板的而不是基于类的。在这里，我们不通过创建类来获取对象，而是直接创建对象。\n\n##\
  \ 在 JavaScript 中创建对象\n\n有 3 种创建的方法。\n\n1. 通过对象字面量\n2. 直接创建 `Object` 的实例（使用 `new`\
  \ 关键字）\n3. 使用对象构造函数（使用 `new` 关键字）\n\n### 1) 通过对象字面量创建 JavaScript 对象\n\n使用对象字面量创建对象的语法如下：\n\
  \n| `object={property1:value1,property2:value2.....propertyN:valueN}` |\n| 如你所见，属性和值之间通过\
  \ `:`（冒号）隔开。让我们来看 JavaScript 中创建对象的简单示例。 |\n\n```html\n<script>\n  emp={id:102,name:\"\
  Shyam Kumar\",salary:40000}\n  document.write(emp.id+\" \"+emp.name+\" \"+emp.salay);\n\
  \  </script> \n```\n\n### 2) 通过创建 Object 实例\n\n直接创建对象的语法如下：\n\n| `var objectname=new\
  \ Object();` |\n| 这里，使用 `new` 关键字来创建对象。 |\n\n```html\n<script>\n  var emp=new Object();\n\
  \  emp.id=101;\n  emp.name=\"Ravi Malik\";\n  emp.salary=50000;\n  document.write(emp.id+\"\
  \ \"+emp.name+\" \"+emp.salary);\n  </script> \n```\n\n### 3) 使用对象构造函数\n\n在这里，你需要创建一个带有参数的函数。每个参数的值都可以通过使用\
  \ `this` 关键字赋值给当前对象。`this` 关键字指向当前对象。\n\n通过对象构造函数创建对象的示例下文。\n\n```html\n<script>\n\
  \  function emp(id,name,salary){\n  this.id=id;\n  this.name=name;\n  this.salary=salary;\n\
  \  }\n  e=new emp(103,\"Vimal Jaiswal\",30000);\n  document.write(e.id+\" \"+e.name+\"\
  \ \"+e.salary);\n  </script> \n```\n\n## 在 JavaScript 对象中定义方法\n\n我们可以在 JavaScript\
  \ 对象中定义方法。但在定义方法之前，我们需要在函数中添加一个与方法同名的属性。\n\n在对象中定义方法的示例下文。\n\n```html\n<script>\n\
  \  function emp(id,name,salary){\n  this.id=id;\n  this.name=name;\n  this.salary=salary;\n\
  \  this.changeSalary=changeSalary;\n  function changeSalary(otherSalary){\n  this.salary=otherSalary;\n\
  \  }\n  }\n  e=new emp(103,\"Sonoo Jaiswal\",30000);\n  document.write(e.id+\" \"\
  +e.name+\" \"+e.salary);\n  e.changeSalary(45000);\n  document.write(\" <br> \"\
  +e.id+\" \"+e.name+\" \"+e.salary);\n  </script> \n```\n\n## JavaScript 对象方法\n\n\
  `Object` 的各种方法如下：\n\n| 序号 | 方法 |  |\n| :--- | :--- | :--- |\n| 1 | `Object.assign()`\
  \ | 该方法用于从源对象向目标对象复制可枚举属性和自有属性 |\n| 2 | `Object.create()` | 该方法用于创建一个具有指定原型对象和属性的新对象。\
  \ |\n| 3 | `Object.defineProperty()` | 该方法用于描述属性的某些行为属性 |\n| 4 | `Object.defineProperties()`\
  \ | 该方法用于创建或配置多个对象属性 |\n| 5 | `Object.entries()` | 该方法返回一个包含键值对数组的数组 |\n| 6 | `Object.freeze()`\
  \ | 该方法防止现有属性被删除。 |\n| 7 | `Object.getOwnPropertyDescriptor()` | 该方法返回指定对象的指定属性的属性描述符。\
  \ |\n| 8 | `Object.getOwnPropertyDescriptors()` | 该方法返回给定对象的所有自有属性描述符 |\n| 9 | `Object.getOwnPropertyNames()`\
  \ | 该方法返回找到的所有属性（无论可枚举与不可枚举）的数组 |\n| 10 | `Object.getOwnPropertySymbols()` | 该方法返回所有自有的\
  \ symbol 键属性的数组 |\n| 11 | `Object.getPrototypeOf()` | 该方法返回指定对象的原型 |\n| 12 | `Object.is()`\
  \ | 该方法判断两个值是否为相同值 |\n| 13 | `Object.isExtensible()` | 该方法判断一个对象是否是扩展的 |\n| 14 |\
  \ `Object.isFrozen()` | 该方法判断一个对象是否被冻结。 |\n| 15 | `Object.isSealed()` | 该方法判断一个对象是否被密封。\
  \ |\n| 16 | `Object.keys()` | 该方法返回给定对象的自有属性名称的数组 |\n| 17 | `Object.preventExtensions()`\
  \ | 该方法用于防止对象的任何扩展。 |\n| 18 | `Object.seal()` | 该方法防止添加新属性，并将所有现有属性标记为不可配置。 |\n\
  | 19 | `Object.setPrototypeOf()` | 该方法将指定对象的原型设置为另一个对象。 |\n| 20 | `Object.values()`\
  \ | 该方法返回给定对象的自有属性值的数组 |\n\n## JavaScript 构造方法\n\nJavaScript 是基于模板的而不是基于类的。在这里，我们不通过创建类来获取对象，而是直接创建对象。\n\
  \nJavaScript 构造方法是一种特殊的方法，用于初始化并创建对象。它在对象分配内存时调用。\n\n### 需要记住的点\n\n1. 使用 `constructor`\
  \ 关键字来声明构造方法。\n2. 类只能包含一个构造方法。\n3. JavaScript 允许我们通过 `super` 关键字使用父类构造方法。\n\n##\
  \ 构造方法示例\n\n让我们来看一个构造方法的简单示例。\n\n```html\n<script>\n  class Employee {\n    constructor()\
  \ {\n      this.id=101;\n      this.name = \"Martin Roy\";\n    }\n  }\n  var emp=new\
  \ Employee();\n  document.write(emp.id+\" \"+emp.name);\n  </script>\n```\n输出 101\
  \ Martin Roy\n\n### 构造方法示例：super 关键字\n\n`super` 关键字用于调用父类构造方法。让我们来看一个示例。\n\n```html\n\
  <script>\n  class CompanyName {\n    constructor() {\n      this.company=\"Javatpoint\"\
  ;\n    }\n  }\n  class Employee extends CompanyName {\n    constructor(id,name)\
  \ {\n      super();\n      this.id=id;\n      this.name=name;\n    }\n  }\n  var\
  \ emp=new Employee(1,\"John\");\n  document.write(emp.id+\" \"+emp.name+\" \"+emp.company);\n\
  \  </script>\n```\n输出 1 John Javatpoint\n\n\n\n\n\n| Note - 如果我们没有指定任何构造方法，JavaScript\
  \ 将使用默认构造方法。 |\n\n# JavaScript 静态方法\n\nJavaScript 提供了静态方法，这些方法属于类本身而不是该类的实例。因此，调用静态方法时不需要实例化。这些方法直接在类本身上调用。\n\
  \n## 需要记忆的点\n\n1. 使用 `static` 关键字来声明静态方法。\n2. `static` 方法可以是任何名称。\n3. 一个 `class`\
  \ 可以包含多个一个静态方法。\n4. 如果我们声明了多个名称相似的静态方法，JavaScript 始终会调用最后一个。\n5. `static` 方法可以用于创建工具函数。\n\
  6. 我们可以使用 `this` 关键字在另一个静态方法内部调用静态方法。\n7. 我们不能在非静态方法中直接使用 `this` 关键字来调用静态方法。在这种情况下，我们可以使用类名或将其作为构造函数的属性来调用静态方法。\n\
  \n## JavaScript 静态方法示例\n\n让我们来看一个静态方法的简单示例。\n\n```html\n<script>\n  class Test {\n\
  \    static display() {\n      return \"static method is invoked\"\n    }\n  }\n\
  \  document.writeln(Test.display());\n</script>\n```\n\n| 输出：static method is invoked\
  \ |\n\n### 示例 2\n\n让我们来看一个调用多个静态方法的示例。\n\n```html\n<script>\n  class Test {\n  \
  \  static display1() {\n      return \"static method is invoked\"\n    }\n    static\
  \ display2() {\n      return \"static method is invoked again\"\n    }\n  }\n  document.writeln(Test.display1()+\"\
  \ <br> \");\n  document.writeln(Test.display2());\n</script>\n```\n\n| 输出：static\
  \ method is invokedstatic method is invoked again |\n\n### 示例 3\n\n让我们来看一个调用多个名称相似静态方法的示例。\n\
  \n```html\n<script>\n  class Test {\n    static display() {\n      return \"static\
  \ method is invoked\"\n    }\n    static display() {\n      return \"static method\
  \ is invoked again\"\n    }\n  }\n  document.writeln(Test.display());\n</script>\n\
  ```\n\n| 输出：static method is invoked again |\n\n### 示例 4\n\n让我们来看一个在构造函数内部调用静态方法的示例。\n\
  \n```html\n<script>\n  class Test {\n    constructor() {\n      document.writeln(Test.display()+\"\
  \ <br> \");\n      document.writeln(this.constructor.display());\n    }\n    static\
  \ display() {\n      return \"static method is invoked\"\n    }\n  }\n  var t=new\
  \ Test();\n</script>\n```\n\n| 输出：static method is invokedstatic method is invoked\
  \ |\n\n### 示例 5\n\n让我们来看一个在非静态方法内部调用静态方法的示例。\n\n```html\n<script>\n  class Test\
  \ {\n    static display() {\n      return \"static method is invoked\"\n    }\n\
  \    show() {\n      document.writeln(Test.display()+\" <br> \");\n    }\n  }\n\
  \  var t=new Test();\n  t.show();\n</script>\n```\n\n| 输出：static method is invoked\
  \ |\n\n# JavaScript 封装\n\nJavaScript 封装是一个将数据（即变量）与作用于该数据的函数绑定的过程。它允许我们控制数据并对其验证。在\
  \ JavaScript 中实现封装：\n\n1. 使用 `var` 关键字使数据成员私有化。\n2. 使用 setter 方法设置数据，使用 getter 方法获取这些数据。\n\
  \n封装允许我们通过以下属性处理对象：\n- **读/写**：在这里，我们使用 setter 方法写入数据，使用 getter 方法读取数据。\n- **只读**：在这种情况下，我们只使用\
  \ getter 方法。\n- **只写**：在这种情况下，我们只使用 setter 方法。\n\n## JavaScript 封装示例\n\n让我们来看一个简单的封装示例，包含两个数据成员及其对应的\
  \ setter 和 getter 方法。\n\n```html\n<script>\n  class Student {\n    constructor()\
  \ {\n      var name;\n      var marks;\n    }\n    getName() {\n      return this.name;\n\
  \    }\n    setName(name) {\n      this.name=name;\n    }\n    getMarks() {\n  \
  \    return this.marks;\n    }\n    setMarks(marks) {\n      if(marks<0||marks>100){\n\
  \        alert(\"Invalid Marks\");\n      }else{\n        this.marks=marks;\n  \
  \    }\n    }\n  }\n  var stud=new Student();\n  stud.setName(\"John\");\n  stud.setMarks(80);\n\
  \  document.writeln(stud.getName()+\" \"+stud.getMarks());\n</script>\n```\n\n|\
  \ 输出：John 80 |\n\n## JavaScript 封装示例：验证\n\n在这个示例中，我们验证了学生的成绩。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<<body>\n<script>\nclass Student{\n  constructor(){\n    var name;\n\
  \    var marks;\n  }\n  getName(){\n    return this.name;\n  }\n  setName(name){\n\
  \    this.name=name;\n  }\n  getMarks(){\n    return this.marks;\n  }\n  setMarks(marks){\n\
  \    if(marks<0||marks>100){\n      alert(\"Invalid Marks\");\n    }else{\n    \
  \  this.marks=marks;\n    }\n  }\n}\nvar stud=new Student();\nstud.setName(\"John\"\
  );\nstud.setMarks(110);\n//alert()\ndocument.writeln(stud.getName()+\" \"+stud.getMarks());\n\
  </script>\n</body>\n</html>\n```\n\n| 输出：John undefined |\n\n## JavaScript 封装示例：基于原型的方法\n\
  \n在这里，我们执行基于原型的封装。\n\n```html\n<!DOCTYPE html>\n<html>\n<<body>\n<script>\nfunction\
  \ Student(name,marks){\n  var s_name=name;\n  var s_marks=marks;\n  Object.defineProperty(this,\"\
  name\",{\n    get:function(){\n      return s_name;\n    },\n    set:function(s_name){\n\
  \      this.s_name=s_name;\n    }\n  });\n  Object.defineProperty(this,\"marks\"\
  ,{\n    get:function(){\n      return s_marks;\n    },\n    set:function(s_marks){\n\
  \      this.s_marks=s_marks;\n    }\n  });\n}\nvar stud=new Student(\"John\",80);\
  \ // 注意：此处原文代码逻辑有误，但保持原样翻译\ndocument.writeln(stud.name+\" \"+stud.marks);\n</script>\n\
  </body>\n</html>\n```\n\n# JavaScript 继承\n\nJavaScript 继承是一种允许我们基于现有类创建新类的机制。它允许子类继承父类的属性和方法。\n\
  \n- 需要记忆的点：\n- 它建立了 IS-A 关系。\n- `extends` 关键字用于类表达式或类声明。\n- 使用 `extends` 关键字，我们可以获取父类的属性。\n\
  - 我们也可以通过原型来实现继承。\n\n## JavaScript extends 示例：内置对象\n\n在这个示例中，我们继承 `Date` 对象来显示今天的日期。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<<body>\n<script>\nclass Moment extends Date\
  \ {\n  constructor() {\n    super();\n  }\n}\nvar m=new Moment();\ndocument.writeln(\"\
  当前日期:\");\ndocument.writeln(m.getDate()+1)+\"-\"+m.getFullYear());\n</script>\n\
  </body>\n</html>\n```\n\n让我们来看另一个从给定日期显示年份的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <<body>\n<script>\nclass Moment extends Date {\n  constructor(year) {\n    super(year);\n\
  \  }\n}\nvar m=new Moment(\"August 15, 1947 20:22:10\");\ndocument.writeln(\"年份:\"\
  );\ndocument.writeln(m.getFullYear());\n</script>\n</body>\n</html>\n```\n\n## JavaScript\
  \ extends 示例：自定义类\n\n在这个示例中，我们声明了一个继承父类属性的子类。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <<body>\n<script>\nclass Bike{\n  constructor(){\n    this.company=\"Honda\";\n\
  \  }\n}\nclass Vehicle extends Bike {\n  constructor(name,price) {\n    super();\n\
  \    this.name=name;\n    this.price=price;\n  }\n}\nvar v = new Vehicle(\"Shine\"\
  ,70000);\ndocument.writeln(v.company+\" \"+v.name+\" \"+v.price);\n</script>\n</body>\n\
  </html>\n```\n\n### JavaScript extends 示例：原型方法\n\n在这里，我们执行基于原型的继承。在这种方法中，不需要使用 `class`\
  \ 和 `extends` 关键字。\n\n```html\n<script>\n//构造函数\nfunction Bike(company) {\n  this.company=company;\n\
  }\nBike.prototype.getCompany=function() {\n  return this.company;\n}\n//另一个构造函数\n\
  function Vehicle(name,price) {\n  this.name=name;\n  this.price=price;\n}\nvar bike=new\
  \ Bike(\"Honda\");\nVehicle.prototype=bike;\n//现在 Bike 被视为 Vehicle 的父类\nvar vehicle=new\
  \ Vehicle(\"Shine\",70000);\ndocument.writeln(vehicle.getCompany()+\" \"+vehicle.name+\"\
  \ \"+vehicle.price);\n</script>\n```\n\n\n\n\n\n多态是面向对象范式的核心概念，它提供了一种以不同形式执行单一操作的方法。它允许在不同的\
  \ JavaScript 对象上调用相同的方法。由于 JavaScript 不是一种类型安全的语言，我们可以向方法传递任何类型的数据成员。\n\n## JavaScript\
  \ 多态示例\n\n### 示例 1\n让我们看一个子类类对象调用父类方法的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <script>\nclass A{\n  display() {\n    document.writeln(\"A is invoked\");\n  }\n\
  }\nclass B extends A{}\nvar b=new B();\nb.display();\n</script>\n</body>\n</html>\n\
  ```\n\n### 示例 2\n让我们看一个子类和父类包含相同方法的示例。在这里，子类对象的分别调用了两个类的方法。\n\n```html\n<script>\n\
  \  class A {\n    display() {\n      document.writeln(\"A is invoked <br> \");\n\
  \    }\n  }\n  class B extends A {\n    display() {\n      document.writeln(\"B\
  \ is invoked\");\n    }\n  }\n  var a=[new A(), new B()]\n  a.forEach(function(msg)\
  \ {\n    msg.display();\n  });\n</script>\n```\n**输出:**\nA is invoked\nB is invoked\n\
  \n### 示例 3\n让我们看一个基于原型方法的相同示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
  function A(){}\nA.prototype.display=function(){\n  return \"A is invoked\"\n}\n\
  function B(){}\nB.prototype=Object.create(A.prototype);\nvar a=[new A(), new B()]\n\
  a.forEach(function(msg){\n  document.writeln(msg.display()+\"<br>\");\n});\n</script>\n\
  </body>\n</html>\n```\n\n## JavaScript 抽象\n\n抽象是一种隐藏实现细节并仅向用户显示功能的方法。换句话说，它忽略了无关紧要的细节，只显示所需的。\n\
  \n## 注意事项\n1. 我们不能创建抽象类的实例。\n2. 它减少了代码的重复。\n\n## JavaScript 抽象示例\n\n### 示例 1\n让我们检查是否可以创建抽象类的实例。\n\
  \n```html\n<script>\n  // 创建一个构造函数\n  function Vehicle() {\n    this.vehicleName=\
  \ vehicleName;\n    throw new Error(\"You cannot create an instance of Abstract\
  \ class\");\n  }\n  Vehicle.prototype.display=function() {\n    return this.vehicleName;\n\
  \  }\n  var vehicle=new Vehicle();\n</script>\n```\n\n### 示例 2\n让我们看一个实现抽象的示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n// 创建一个构造函数\nfunction Vehicle(){\n\
  \  this.vehicleName=\"vehicleName\";\n  throw new Error(\"You cannot create an instance\
  \ of Abstract Class\");\n}\nVehicle.prototype.display=function(){\n  return \"Vehicle\
  \ is: \"+this.vehicleName;\n}\n// 创建一个构造函数\nfunction Bike(vehicleName){\n  this.vehicleName=vehicleName;\n\
  }\n// 不使用函数构造函数创建对象\nBike.prototype=Object.create(Vehicle.prototype);\nvar bike=new\
  \ Bike(\"Honda\");\ndocument.writeln(bike.display());\n</script>\n</body>\n</html>\n\
  ```\n\n### 示例 3\n在这个示例中，我们使用 `instanceof` 运算符来测试对象是否引用了相应的类。\n\n```html\n<script>\n\
  \  // 创建一个构造函数\n  function Vehicle() {\n    this.vehicleName=vehicleName;\n    throw\
  \ new Error(\"You cannot create an instance of Abstract class\");\n  }\n  // 创建一个构造函数\n\
  \  function Bike(vehicleName) {\n    this.vehicleName=vehicleName;\n  }\n  Bike.prototype=Object.create(Vehicle.prototype);\n\
  \  var bike=new Bike(\"Honda\");\n  document.writeln(bike instanceof Vehicle);\n\
  \  document.writeln(bike instanceof Bike);\n</script>\n```\n\n# 第十五章\n\n# JavaScript\
  \ Cookies\n\n![两个气泡](img/image15-1.png)\n\nCookie 是在服务器端和客户端之间持久化的信息。网络浏览器在浏览时存储这些信息。Cookie\
  \ 包含以分号分隔的键值值对形式的字符串形式的信息。它维护了用户状态，并在所有页面中记住用户的信息。\n\n## Cookie 是如何工作的？\n\n1. 当用户向服务器发送请求时，每个该请求都会被视为由不同用户发送的新请求。\n\
  2. 因此，为了识别旧用户，我们需要在客户端从服务器的响应中添加 cookie。\n3. 现在，每当用户向服务器发送请求时，该请求都会带上 cookie。由于\
  \ cookie，服务器可以识别用户。\n![图片 1](img/image8.png)\n\n## 如何在 JavaScript 中创建 Cookie？\n\n\
  在 JavaScript 中，我们可以使用 `document.cookie` 属性创建、读取和删除 cookie。使用以下语法创建 cookie：\n\n`document.cookie=\"\
  name=value\"`\n\n### JavaScript 示例\n\n#### 示例 1\n让我们看一个设置和获取 cookie 的示例。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head></head>\n<body>\n  <input type=\"button\" value=\"\
  setCookie\" onclick=\"setCookie()\">\n  <input type=\"button\" value=\"getCookie\"\
  \ onclick=\"getCookie()\">\n  <script>\n    function setCookie() {\n      document.cookie=\"\
  username=Duke Martin\";\n    }\n    function getCookie() {\n      if(document.cookie.length!=0)\
  \ {\n        alert(document.cookie);\n      } else {\n        alert(\"Cookie not\
  \ available\");\n      }\n    }\n  </script>\n</body>\n</html>\n```\n\n#### 示例 2\n\
  在这里，我们单独显示 cookie 的键值对。\n\n```html\n<!DOCTYPE html>\n<html>\n<head></head>\n<body>\n\
  \  <input type=\"button\" value=\"setCookie\" onclick=\"setCookie()\">\n  <input\
  \ type=\"button\" value=\"getCookie\" onclick=\"getCookie()\">\n  <script>\n   \
  \ function setCookie() {\n      document.cookie=\"username=Duke Martin\";\n    }\n\
  \    function getCookie() {\n      if(document.cookie.length!=0) {\n        var\
  \ array=document.cookie.split(\"=\");\n        alert(\"Name=\"+array[0]+\"Value=\"\
  +array[1]);\n      } else {\n        alert(\"Cookie not available\");\n      }\n\
  \    }\n  </script>\n</body>\n</html>\n```\n\n### 示例 3\n在这个示例中，我们提供了颜色选择并将并将选的颜色值传递给\
  \ cookie。现在，cookie 在浏览器中存储了用户的最后选择。因此，在重新加载网页时，用户的最后选择将显示在屏幕上。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head></head>\n<body>\n  <select id=\"color\" onchange=\"display()\"\
  >\n    <option value=\"Select Color\"> Select Color</option>\n    <option value=\"\
  yellow\"> Yellow </option>\n    <option value=\"green\"> Green </option>\n    <option\
  \ value=\"red\"> Red </option>\n  </select>\n  <script type=\"text/javascript\"\
  >\n    function display() {\n      var value=document.getElementById(\"color\").value;\n\
  \      if (value != \"Select Color\") {\n        document.bgColor=value;\n     \
  \   document.cookie=\"color=\"+value;\n      }\n    }\n    window.onload=function\
  \ () {\n      if (document.cookie.length != 0) {\n        var array=document.cookie.split(\"\
  =\");\n        document.getElementById(\"color\").value=array[1];\n        document.bgColor=array[1];\n\
  \      }\n    }\n  </script>\n</body>\n</html>\n```\n\n## Cookie 属性\n\nJavaScript\
  \ 了一些了一些增强 cookie 功能的可选属性。这里是一些属性及其描述。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| expires\
  \ | 它在指定的日期和时间维护 cookie 的状态。 |\n| max-age | 它在指定的时间维护 cookie 的状态。在这里，时间以秒为单位。 |\n\
  | path | 它将 cookie 的范围扩展到网站的所有页面。 |\n| domain | 用于指定 cookie 有效的域。 |\n\n### Cookie\
  \ expires 属性\n\n\n\n\n\n`expires` 属性提供了创建持久性 cookie 的方法之一。在这里，声明了一个日期和时间，代表 cookie\
  \ 的有效期限。一旦超过声明的时间，cookie 将被自动删除。\n\n让我们来看 cookie `expires` 属性的示例。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head></head>\n<body>\n  <input type=\"button\" value=\"setCookie\"\
  \ onclick=\"setCookie()\">\n  <input type=\"button\" value=\"getCookie\" onclick=\"\
  getCookie()\">\n  <script>\n    function setCookie() {\n      document.cookie=\"\
  username=Duke Martin;expires=Sun, 20 Aug 2030 12:00:00 UTC\";\n    }\n    function\
  \ getCookie() {\n      if(document.cookie.length!=0) {\n        var array=document.cookie.split(\"\
  =\");\n        alert(\"Name=\"+array[0]+\" \"+\"Value=\"+array[1]);\n      }\n \
  \     else {\n        alert(\"Cookie not available\");\n      }\n    }\n  </script>\n\
  </body>\n</html>\n```\n\n### Cookie max-age 属性\n\n`max-age` 属性提供了另一种创建持久性 cookie\
  \ 方法。在这里，时间以秒为单位声明。cookie 仅在声明的时间之前有效。\n\n让我们来看 cookie `max-age` 属性的示例。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head></head>\n<body>\n  <input type=\"button\" value=\"\
  setCookie\" onclick=\"setCookie()\">\n  <input type=\"button\" value=\"getCookie\"\
  \ onclick=\"getCookie()\">\n  <script>\n    function setCookie() {\n      document.cookie=\"\
  username=Duke Martin;max-age=\" + (60 * 60 * 24 * 365) + \";\";\n    }\n    function\
  \ getCookie() {\n      if(document.cookie.length!=0) {\n        var array=document.cookie.split(\"\
  =\");\n        alert(\"Name=\"+array[0]+\" +\"Value=\"+array[1]);\n      }\n   \
  \   else {\n        alert(\"Cookie not available\");\n      }\n    }\n  </script>\n\
  </body>\n</html>\n```\n\n### Cookie path 属性\n\n如果为网页创建 cookie，默认情况下，它只对当前目录和子目录有效。JavaScript\
  \ 提供了 `path` 属性来将 cookie 的范围扩展到网站的所有页面。\n\n### Cookie path 属性示例\n\n让我们通过一个示例来理解\
  \ `path` 属性。\n\n在这里，如果我们为 `webpage2.html` 创建一个 cookie，它仅对自身及其子目录（即 `webpage3.html`）有效。它对\
  \ `webpage1.html` 无效。\n\n在例示例中，我们使用 `path` 属性来增强 cookie 在所有页面上的可见性。在这里您需要做的是维护上述目录结构，并将下面的程序放在所有网页中。现在，cookie\
  \ 对每个网页都有效了。\n\n```html\n<!DOCTYPE html>\n<html>\n<head></head>\n<body>\n  <input\
  \ type=\"button\" value=\"setCookie\" onclick=\"setCookie()\">\n  <input type=\"\
  button\" value=\"getCookie\" onclick=\"getCookie()\">\n  <script>\n    function\
  \ setCookie() {\n      document.cookie=\"username=Duke Martin;max-age=\" + (60 *\
  \ 60 * 24 * 365) + \";path=/\";\n    }\n    function getCookie() {\n      if(document.cookie.length!=0)\
  \ {\n        var array=document.cookie.split(\"=\");\n        alert(\"Name=\"+array[0]+\"\
  Value=\"+array[1]);\n      }\n      else {\n        alert(\"Cookie not available\"\
  );\n      }\n    }\n  </script>\n</body>\n</html>\n```\n\n### Cookie domain 属性\n\
  \nJavaScript 的 `domain` 属性指定了 cookie 有效的域名。假设我们向属性提供任何域名，例如：`domain=example.com`。\n\
  \n在这里，cookie 对给定域名及其所有子域名有效。\n\n然而，如果我们向属性提供任何子域名，例如：`domain=training.example.com`。\n\
  \n在这里，cookie 仅对给定的子域名有效。因此，提供域名而不是子域名是更好的方法。\n\n### 带有多个键值对的 Cookie\n\n在 JavaScript\
  \ 中，一个 cookie 只能包含一个键值对。然而，为了存储多个一个键值对，我们可以使用以下方法：\n\n-   将自定义对象序列化为 JSON 字符串，解析它然后存储在\
  \ cookie 中。\n-   为每个键值对使用单独的 cookie。\n\n字体 在 Cookie 中存储键值对的示例\n\n#### 示例 1\n\n让我们来看一个示例，检查\
  \ cookie 是否包含多个一个键值对。\n\n```html\n<!DOCTYPE html>\n<html>\n<head></head>\n<body>\n\
  \  Name: <input type=\"text\" id=\"name\"><br>\n  Email: <input type=\"email\" id=\"\
  email\"><br>\n  Course: <input type=\"text\" id=\"course\"><br>\n  <input type=\"\
  button\" value=\"Set Cookie\" onclick=\"setCookie()\">\n  <input type=\"button\"\
  \ value=\"Get Cookie\" onclick=\"getCookie()\">\n  <script>\n    function setCookie()\
  \ {\n      // 声明 3 个键值对\n      var info=\"Name=\"+document.getElementById(\"name\"\
  ).value+\";Email=\"+document.getElementById(\"email\").value+\";Course=\"+document.getElementById(\"\
  course\").value;\n      // 将所有 3 个键值对提供给单个 cookie\n      document.cookie=info;\n\
  \    }\n    function getCookie() {\n      if(document.cookie.length!=0) {\n    \
  \    // 调用存储在 cookie 中的键值对\n        alert(document.cookie);\n      }\n      else\
  \ {\n        alert(\"Cookie not available\");\n      }\n    }\n  </script>\n</body>\n\
  </html>\n```\n\n#### 示例 2\n\n让我们来看一个使用 JSON 在 cookie 中存储不同键值对的示例。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head></head>\n<body>\n  Name: <input type=\"text\" id=\"name\"\
  ><br>\n  Email: <input type=\"email\" id=\"email\"><br>\n  Course: <input type=\"\
  text\" id=\"course\"><br>\n  <input type=\"button\" value=\"Set Cookie\" onclick=\"\
  setCookie()\">\n  <input type=\"button\" value=\"Get Cookie\" onclick=\"getCookie()\"\
  >\n  <script>\n    function setCookie() {\n      var obj={}; // 创建自定义对象\n      obj.name=document.getElementById(\"\
  name\").value;\n      obj.email=document.getElementById(\"email\").value;\n    \
  \  obj.course=document.getElementById(\"course\").value;\n      // 将 JavaScript\
  \ 对象转换为 JSON 字符串\n      var jsonString=JSON.stringify(obj);\n      document.cookie=jsonString;\n\
  \    }\n    function getCookie() {\n      if(document.cookie.length!=0) {\n    \
  \    // 解析 JSON 字符串为 JSON 对象\n        var obj=JSON.parse(document.cookie);\n   \
  \     alert(\"Name=\"+obj.name+\"Email=\"+obj.email+\"Course=\"+obj.course);\n \
  \     }\n      else {\n        alert(\"Cookie not available\");\n      }\n    }\n\
  \  </script>\n</body>\n</html>\n```\n\n### 示例 3\n\n让我们来看一个在不同的 cookie 中存储每个键值对的示例。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head></head>\n<body>\n  Name: <input type=\"\
  text\" id=\"name\"><br>\n  Email: <input type=\"email\" id=\"email\"><br>\n  Course:\
  \ <input type=\"text\" id=\"course\"><br>\n  <input type=\"button\" value=\"Set\
  \ Cookie\" onclick=\"setCookie()\">\n  <input type=\"button\" value=\"Get Cookie\"\
  \ onclick=\"getCookie()\">\n  <script>\n    function setCookie() {\n      document.cookie\
  \ = \"name=\"+document.getElementById(\"name\").value;\n      document.cookie =\
  \ \"email=\"+document.getElementById(\"email\").value;\n      document.cookie =\
  \ \"course=\"+document.getElementById(\"course\").value;\n    }\n    function getCookie()\
  \ {\n      if(document.cookie.length!=0) {\n        alert(document.cookie);\n  \
  \    }\n      else {\n        alert(\"Cookie not available\");\n      }\n    }\n\
  \  </script>\n</body>\n</html>\n```\n\n\n\n\n\n在本示例中，我们使用 `expire` 属性通过向其提供一个过期日期（即任何过去的日期）来删除\
  \ cookie。\n\n```html\n<!DOCTYPE html >\n<html>\n  <head></head>\n  <body><body>\n\
  \    <input type=\"button\" value=\"Set Cookie\" onclick=\"setCookie()\">\n    <input\
  \ type=\"button\" value=\"Get Cookie\" onclick=\"getCookie()\">\n    <script>\n\
  \      function setCookie() {\n        document.cookie=\"name=Martin Roy; expires=Sun,\
  \ 20 Aug 2000 12:00:00 UTC\";\n      }\n      function getCookie() {\n        if(document.cookie.length!=0)\
  \ {\n          alert(document.cookie);\n        }\n        else {\n          alert(\"\
  Cookie not avaliable\");\n        }\n      }\n    </script>\n  </body>\n</</html>\n\
  ```\n\n## 示例 2\n\n在本示例中，我们使用 `max-age` 属性通过向其提供零或负数（代表秒数）来删除 cookie。\n\n```html\n\
  <!DOCTYPE html >\n<html>\n  <head></head>\n  <body>\n    <input type=\"button\"\
  \ value=\"Set Cookie\" onclick=\"setCookie()\">\n    <input type=\"button\" value=\"\
  Get Cookie\" onclick=\"getCookie()\">\n    <script>\n      function setCookie()\
  \ {\n        document.cookie=\"name=Martin Roy;max-age=0\";\n      }\n      function\
  \ getCookie() {\n        if(document.cookie.length!=0) {\n          alert(document.cookie);\n\
  \        }\n        else {\n          alert(\"Cookie not avaliable\");\n       \
  \ }\n      }\n    </script>\n  </body>\n</</html>\n```\n\n### 示例 3\n\n让我们来看一个设置、获取和删除多个\
  \ cookie 的示例。\n\n```html\n<!DOCTYPE html >\n<html>\n  <head></head>\n  <body>\n\
  \    <input type=\"button\" value=\"Set Cookie1\" onclick=\"setCookie1()\">\n  \
  \  <input type=\"button\" value=\"Get Cookie1\" onclick=\"getCookie1()\">\n    <input\
  \ type=\"button\" value=\"Delete Cookie1\" onclick=\"deleteCookie1()\">\n    <br>\n\
  \    <input type=\"button\" value=\"Set Cookie2\" onclick=\"setCookie2()\">\n  \
  \  <input type=\"button\" value=\"Get Cookie2\" onclick=\"getCookie2()\">\n    <input\
  \ type=\"button\" value=\"Delete Cookie2\" onclick=\"deleteCookie2()\">\n    <br>\n\
  \    <input type=\"button\" value=\"Display all cookies\" onclick=\"displayCookie()\"\
  >\n    <script>\n      function setCookie1() {\n        document.cookie=\"name=Bernice\
  \ Johnson\";\n        cookie1= document.cookie;\n      }\n      function setCookie2()\
  \ {\n        document.cookie=\"name=Othniel Williams\";\n        cookie2= document.cookie;\n\
  \      }\n      function getCookie1() {\n        if(cookie1.length!=0) {\n     \
  \     alert(cookie1);\n        }\n        else {\n          alert(\"Cookie not available\"\
  );\n        }\n      }\n      function getCookie2() {\n        if(cookie2.length!=0)\
  \ {\n          alert(cookie2);\n        }\n        else {\n          alert(\"Cookie\
  \ not available\");\n        }\n      }\n      function deleteCookie1() {\n    \
  \    document.cookie=cookie1+\"max-age=0\";\n        cookie1=document.cookie;\n\
  \        alert(\"Cookie1 is deleted\");\n      }\n      function deleteCookie2()\
  \ {\n        document.cookie=cookie2+\"max-age=0\";\n        cookie2=document.cookie;\n\
  \        alert(\"Cookie2 is deleted\");\n      }\n      function displayCookie()\
  \ {\n        if(cookie1!=0&&cookie2!=0) {\n          alert(cookie1+\" \"+cookie2);\n\
  \        }\n        else if(cookie1!=0) {\n          alert(cookie1);\n        }\n\
  \        else if(cookie2!=0) {\n          alert(cookie2);\n        }\n        else\
  \ {\n          alert(\"Cookie not available\");\n        }\n      }\n    </script>\n\
  \  </body>\n</</html>\n```\n\n### 示例 4\n\n让我们来看一个显式删除 cookie 的示例。\n\n```html\n<!DOCTYPE\
  \ html >\n<html>\n  <head></head>\n  <body>\n    <input type=\"button\" value=\"\
  Set Cookie\" onclick=\"setCookie()\">\n    <input type=\"button\" value=\"Get Cookie\"\
  \ onclick=\"getCookie()\">\n    <script>\n      function setCookie() {\n       \
  \ document.cookie=\"name=Martin Roy\";\n      }\n      function getCookie() {\n\
  \        if(document.cookie.length!=0) {\n          alert(document.cookie);\n  \
  \      }\n        else {\n          alert(\"Cookie not avaliable\");\n        }\n\
  \      }\n    </script>\n  </body>\n</</html>\n```\n\n# 第十六章\n\n# 将 JavaScript 与\
  \ Google Apps Script 集成\n\n![作为装饰的花卉](img/image21-5.png)\n\n一种名为 Google Apps Script\
  \ 的快速应用程序框架使得构建与 Google Workspace 协作的业务应用程序变得简单快捷。开发者可以使用适用于他们喜爱的 Google Workspace\
  \ 应用（如 Gmail、日历、Drive 等）的内置库，同时使用现代 JavaScript 语言编写代码。您的脚本运行在 Google 服务器上，并直接在浏览器中为您提供代码编辑器，因此无需安装任何内容。\n\
  \n## Apps Script 可以做什么？\n\nApps Script 有许多用途。您可以，但不限于：\n\n1. 定制 Google Sheets、表单菜单、对话框和侧边栏。\n\
  2. 为 Google Sheets 创建自定义宏和函数。\n3. 发布 Web 应用程序，无论是独立的还是与 Sites 集成的。\n4. 与 AdSense、Analytics、日历、Drive、Gmail\
  \ 和 Maps 等其他 Google 服务交互。\n5. 创建插件并提交到 Google Workspace 市场。\n\n## Google Workspace\
  \ 中的自定义菜单\n\n通过包含点击后可执行操作的组件，注意在 Google 文、幻灯片和表单中的扩展![图片](img/29.png)\n\n电子表格、演示文、文档或表单只能有一个特定名称的菜单。同一脚本或其他脚本添加的相同名称菜单将替换之前的。虽然您可以在未来通过构建\
  \ `onOpen()` 代码来绕过菜单，但在文件打开时无法删除菜单。\n\n下面的示例演示了添加包含一个项目、视觉分割符和子菜单的菜单。由于 Google Sheets\
  \ 不支持子菜单，请使用 `addMenu()` 语法。\n\n```javascript\nfunction onOpen() {\n  var ui = SpreadsheetApp.getUi();\
  \ // 或 DocumentApp, SlidesApp, FormApp.\n\n  ui.createMenu('自定义菜单')\n    .addItem('第一个项目',\
  \ 'menuItem1')\n    .addSeparator()\n    .addSubMenu(ui.createMenu('子菜单')\n    \
  \  .addItem('第二个项目', 'menuItem2'))\n    .addToUi();\n}\n\nfunction menuItem1() {\n\
  \  SpreadsheetApp.getUi(); // 或 DocumentApp, SlidesApp, FormApp.\n  alert('你点击了第一个项目！');\n\
  }\n\nfunction menuItem2() {\n  SpreadsheetApp.getUi(); // 或 DocumentApp, SlidesApp,\
  \ FormApp.\n  alert('你点击了第二个项目！');\n}\n```\n\n## Google Sheets 中的可点击图像和图形\n\n如果脚本链接到电子表格，您还可以将\
  \ Apps Script 函数分配到 Google Sheets 中的图像或图形。如何设置如下例所示。\n\n1. 要构建与电子表格连接的脚本，请从 Google\
  \ Sheets 菜单中选择 `扩展 > Apps Script`。\n2. 在脚本编辑器中，删除任何现有代码并插入以下代码。\n\n```javascript\n\
  function showMessageBox() {\n  Browser.msgBox('你点击了它！');\n}\n```\n\n\n\n\n1. 重新点击图片或插图。此时，函数开始运行。\n\
  \n## Google Workspace 文档中的对话框和侧边栏。\n\n可以使用链接到 Google Docs、Sheets 或 Forms 的脚本将自定义\
  \ HTML 服务页面显示在对话框和侧边栏中，以及内置的警报和提示。这些组件通常通过菜单项访问。（注意，Google Forms 中的用户界面组件对于打开表单回答的用户是不可见的；相反，它们仅对打开表单进行修改的编辑器可见。）\n\
  \n### 警报对话框 (Alert dialogs)\n\n警报是一个出现在 Google Sheets、Docs、Slides 或 Forms 编辑器中的预制对话框。它显示一条消息和一个“确定”按钮；不需要备用按钮和标题。这类似于在网页浏览器中使用客户端\
  \ JavaScript 调用 `window.alert()`。\n\n![Picture 5](img/image30.png)\n\n当警报对话框处于激活状态时，服务器端脚本将挂起。当用户退出对话框时，脚本继续执行，但在挂起期间\
  \ `JDBC` 连接将会。\n\nGoogle Docs、Forms、Slides 和 Sheets 均采用 `Ui.alert()` 方法，该方法有三种变体，如下例所示。你可以使用\
  \ `Ui.ButtonSet` 枚举中的值作为 `buttons` 参数来覆盖默认的“确定”按钮。应将 `Ui.Button` 枚举与 `alert()` 的返回值比较以判断用户点击了哪个按钮。\n\
  \n```javascript\nfunction onOpen() { \n   SpreadsheetApp.getUi() // 或 DocumentApp\
  \ 或 SlidesApp 或 FormApp.\n      .createMenu('Custom Menu')\n      .addItem('Show\
  \ alert', 'showAlert')\n      .addToUi();\n}\n\nfunction showAlert() {\n  var ui\
  \ = SpreadsheetApp.getUi(); // 相同的变体。\n  var result = ui.alert(\n      'Please confirm',\n\
  \      'Are you sure you want to continue?',\n      ui.ButtonSet.YES_NO);\n  //\
  \ 处理用户的响应。\n  if (result == ui.Button.YES) {\n    // 用户点击了“是”。\n    ui.alert('Confirmation\
  \ received.');\n  } else {\n    // 用户点击了“否”或标题栏中的 X。\n    ui.alert('Permission denied.');\n\
  \  }\n}\n```\n\n### 提示对话框 (Prompt dialogs)\n\n一种名为提示（prompt）的预制对话框出现在 Google Documents、Sheets、Slides\
  \ 或 Forms 的编辑器内部。它显示一个文本输入区域、消息和一个“确定”按钮；其他按钮和标题是可选的。这类似于在网页浏览器中使用客户端 JavaScript\
  \ 使用 `window.prompt()`。\n\n![Picture 6](img/image31.png)\n\n请求在对话框激活期间挂起服务器端脚本。当用户退出对话框时，脚本继续执行，但在挂起期间\
  \ `JDBC` 连接将会。\n\nGoogle Docs、Forms、Slides 和 Sheets 均采用 `Ui.prompt()` 函数，该函数有三种变体，如下例所示。你可以使用\
  \ `Ui.ButtonSet` 枚举中的值作为 `buttons` 参数来覆盖默认的“确定”按钮。在获取 `prompt()` 的返回值后，调用 `PromptResponse`\
  \ 来评估用户的答案。使用 `getResponseText()` 获取用户的输入，然后使用 `getSelectedButton()` 通过 `Ui.Button`\
  \ 枚举比较 `PromptResponse` 的响应值。\n\n```javascript\nfunction onOpen() { \n   SpreadsheetApp.getUi()\
  \ // 或 DocumentApp 或 SlidesApp 或 FormApp.\n      .createMenu('Custom Menu')\n  \
  \    .addItem('Show prompt', 'showPrompt')\n      .addToUi();\n}\n\nfunction showPrompt()\
  \ {\n  var ui = SpreadsheetApp.getUi(); // 相同的变体。\n  var result = ui.prompt(\n \
  \     'Let's get to know each other!',\n      'Please enter your name:',\n     \
  \ ui.ButtonSet.OK_CANCEL);\n  // 处理用户的响应。\n  var button = result.getSelectedButton();\n\
  \  var text = result.getResponseText();\n  if (button == ui.Button.OK) {\n    //\
  \ 用户点击了“确定”。\n    ui.alert('Your name is ' + text + '.');\n  } else if (button ==\
  \ ui.Button.CANCEL) {\n    // 用户点击了“取消”。\n    ui.alert('I didn't get your name.');\n\
  \  } else if (button == ui.Button.CLOSE) {\n    // 用户点击了标题栏中的 X。\n    ui.alert('You\
  \ closed the dialog.');\n  }\n}\n```\n\n### 自定义对话框 (Custom dialogs)\n\n可以使用自定义对话框在\
  \ Google Docs、Sheets、Slides 或 Forms 编辑器内部显示 HTML 服务用户界面。\n\n当自定义对话框处于激活状态时，服务器端脚本不会挂起。用于\
  \ HTML 服务界面的 `google.script` API 允许客户端组件异步调用服务器端脚本。\n\n![Picture 7](img/image32.png)\n\
  \n通过在 HTML 服务界面的客户端上使用 `google.script.host.close()`，客户端组件可以异步调用服务器端脚本。Google Docs、Forms、Slides\
  \ 和 Sheets 均利用示例所示的 `showModalDialog()`。\n\n**Code.gs**\n```javascript\nfunction\
  \ onOpen() { \n   SpreadsheetApp.getUi() // 或 DocumentApp 或 SlidesApp 或 FormApp.\n\
  \      .createMenu('Custom Menu')\n      .addItem('Show alert', 'showAlert')\n \
  \     .addToUi();\n}\n```\n\n**Page.html**\n```html\n<!-- 使用 google.script.host.close()\
  \ 关闭对话框 -->\n```\n\n### 自定义侧边栏 (Custom sidebars)\n\n在 Google Docs、Sheets、Slides\
  \ 或 Forms 的编辑器内，侧边栏可以显示 HTML 服务界面。当对话框激活时，服务器端脚本不会挂起。用于 HTML 服务界面的 `google.script`\
  \ API 允许客户端组件异步调用服务器端脚本。\n\n在 HTML 服务界面的客户端使用 `google.script.host.close()` 允许侧边栏自关闭。Google\
  \ Docs、Forms、Slides 和 Sheets 均利用示例所示的 `showSidebar()`。\n\n**Code.gs**\n```javascript\n\
  function onOpen() { \n   SpreadsheetApp.getUi() // 或 DocumentApp 或 SlidesApp 或 FormApp.\n\
  \      .createMenu('Custom Menu')\n      .addItem('Show prompt', 'showPrompt')\n\
  \      .addToUi();\n}\n```\n\n**Page.html**\n```html\n<!-- 使用 google.script.host.close()\
  \ 关闭侧边栏 -->\n```\n\n### 文件打开对话框 (File-open dialogs)\n\n对于存储在 Google 服务器上的数据，“文件打开”对话框——Google\
  \ Picker 提供了对 Google Drive、Google 图片搜索、Google 视频以及许多服务的访问。Picker 的客户端 JavaScript\
  \ API 可用于 HTML 服务构建自定义对话框，允许用户上传新文件或选择现有文件，如下所示。选择结果将传回您的脚本供后续使用。\n\n要获取 API 密钥并启用\
  \ Picker，请遵循以下指南：\n\n1. 验证您的脚本项目正在使用标准的 GCP 项目。\n2. 在 Google Cloud 项目中启用“Google\
  \ Picker API”。\n3. 当您的 Google Cloud 项目保持打开时，选择“API 和和服务”，然后点击“凭据”。\n4. 点击“创建凭据 >\
  \ API 密钥”。此操作会创建密钥，但您应该编辑密钥以添加应用限制和 API 限制。\n5. 在 API 密钥框中，点击“关闭”。\n6. 在您创建的 API\
  \ 密钥旁边，点击“更多 > 编辑 API 密钥”。\n7. 在“应用限制”下，完成以下步骤：\n   a. 选择 HTTP 引用来源（网站）。\n   b.\
  \ 在“网站限制”下，点击“添加项”。\n   c. 点击“引用来源”并输入 `*.google.com`。\n   d. 添加另一项并将 `*.googleusercontent.com`\
  \ 作为引用来源。\n   e. 点击“完成”。\n8. 在“API 限制”下，完成以下步骤：\n   a. 选择“限制密钥”。\n\n\n\n\n\nb) 在\
  \ Select APIs 部分，选择 `Google Picker API` 并点击 OK。\n\n注意：除非你已启用该 API，否则 `Google Picker\
  \ API` 将不会出现，因为列表仅显示已为 Cloud 项目启用的 API。\n\n1. 在 `API key` 下，点击 `Copy to clipboard`。\n\
  2. 在底部，点击 `Save`。\n\n注：下例通过调用 `ScriptApp.getOAuthToken()` 来为 `Picker` 提供用户的 OAuth\
  \ 2.0 访问令牌。此方法避免了 `Picker` 显示其自身的授权对话框，但它要求 `Apps Script` 拥有 `Picker` 所需的 OAuth\
  \ 范围（scope）。如果没有，，如此“你好世界”示例所示，你的 `Picker` 代码将需要定义自己的 OAuth 范围。\n\n### Code.gs\n\
  \n```javascript\n/**\n * 当 Google Sheets 表格打开时在其中创建一个自定义菜单。\n */\nfunction onOpen()\
  \ {\n  try {\n    SpreadsheetApp.getUi().createMenu('Picker')\n        .addItem('Start',\
  \ 'showPicker')\n        .addToUi();\n  } catch (e) {\n    // TODO (Developer) -\
  \ 处理异常\n    console.log('Failed with error: %s', e.error);\n  }\n}\n\n/**\n * 在\
  \ Google Sheets 中显示一个 HTML 服务对话框，其中包含\n * 用于 Google Picker API 的客户端 JavaScript 代码。\n\
  \ */\nfunction showPicker() {\n  try {\n    const html = HtmlService.createHtmlOutputFromFile('dialog.html')\n\
  \        .setWidth(600)\n        .setHeight(425)\n        .setSandboxMode(HtmlService.SandboxMode.IFRAME);\n\
  \    SpreadsheetApp.getUi().showModalDialog(html, 'Select a file');\n  } catch (e)\
  \ {\n    // TODO (Developer) - 处理异常\n    console.log('Failed with error: %s', e.error);\n\
  \  }\n}\n\n/**\n * 获取用户的 OAuth 2.0 访问令牌以便将其传递给 Picker。\n * 这种技术避免了 Picker 需要显示其自身的授权\n\
  \ * 对话框，但只有当 Picker 所的 OAuth 范围在 Apps Script 中\n *可用时才可行。在这种情况下，函数包含一个对 DriveApp\
  \ 方法\n * 的未使用的调用，以确保 Apps Script 请求访问用户 Drive 中的所有文件。\n *\n * @return {string} 用户的\
  \ OAuth 2.0 访问令牌。\n */\nfunction getOAuthToken() {\n  try {\n    DriveApp.getRootFolder();\n\
  \    return ScriptApp.getOAuthToken();\n  } catch (e) {\n    // TODO (Developer)\
  \ - 处理异常\n    console.log('Failed with error: %s', e.error);\n  }\n}\n```\n\n###\
  \ Dialog.html\n\n```html\n<!DOCTYPE html> <html\n<head>\n  <link rel=\"stylesheet\"\
  \ href=\"https://ssl.gstatic.com/docs/script/css/add-ons.css\">\n  <script>\n  \
  \  // 重要：将 DEVELOPER_KEY 的值替换为从 Google Developers Console\n    // 获取的 API 密钥。\n\
  var DEVELOPER_KEY = 'ABC123 ... ';\n    var DIALOG_DIMENSIONS = {width: 600, height:\
  \ 425};\n    var pickerApiLoaded = false;\n    /**\n     * 加载 Google Picker API。\n\
  \     */\n    function onApiLoad() {\n      gapi.load('picker', {'callback': function()\
  \ {\n        pickerApiLoaded = true;\n      }});\n     }\n    /**\n     * 从服务器端脚本获取用户的\
  \ OAuth 2.0 访问令牌，\n     * 然后将其传递给 Picker。这种技术避免了 Picker 需要\n     * 显示其自己的对话框，但只有当\
  \ Picker 需要的 OAuth 范围\n     * 在 Apps Script 中可用时才可行。否则，你的 Picker 代码\n     * 需要声明自己的范围。\n\
  \     */\n    function getOAuthToken() {\n      google.script.run.withSuccessHandler(createPicker)\n\
  \        .withFailureHandler(showError).getOAuthToken();\n    }\n    /**\n     *\
  \ 创建一个可以访问用户电子表格 Picker。此函数\n     * 使用高级选项来隐藏 Picker 的左侧面板\n     * 和默认栏。\n     *\n\
  \     * @param {string} token 一个 OAuth 2.0 访问令牌，允许 Picker 访问\n     * addView 调用中指定的文件。\n\
  \     */\n    function createPicker(token) {\n      if (pickerApiLoaded && token)\
  \ {\n        var picker = new google.picker.Builder()\n// 指示 Picker 仅显示 Drive 中的电子表格。对于其他\n\
  // 视图请访问 https://developers.google.com/picker/docs/#views\n          .addView(google.picker.ViewId.SPREADETS)\n\
  \          // 隐藏导航以便 Picker 填充更多对话框。\n          .enableFeature(google.picker.Feature.NAV_HIDDEN)\n\
  \          // 隐藏标题栏，因为 Script 对话框已经有了标题。\n          .hideTitleBar()\n          .setOAuthToken(token)\n\
  \          .setDeveloperKey(DEVELOPER_KEY)\n          .setCallback(pickerCallback)\n\
  \          .setOrigin(google.script.host.origin)\n          // 指示 Picker 填充对话框，留出\
  \ 2 像素边框。\n          .setSize(DIALOG_DIMENSIONS.width - 2,\n              DIALOG_DIMENSIONS.height\
  \ - 2)\n          .build();\n        picker.setVisible(true);\n      } else {\n\
  \        showError('Unable to load the picker.');\n      }\n    }\n    /**\n   \
  \  * 回调函数，从响应对象中提取所选文档的元数据。\n     * 有关响应对象的详细信息，请访问\n     * https://developers.google.com/picker/docs/result\n\
  \     *\n     * @param {object} data 响应对象。\n     */\n    function pickerCallback(data)\
  \ {\n      var action = data[google.picker.Response.ACTION];\n      if (action ==\
  \ google.picker.Action.PICKED) {\n        var doc = data[google.picker.Response.DOCUMENTS][0];\n\
  \        var id = doc[google.picker.Document.ID];\n        var url = doc[google.picker.Document.URL];\n\
  \        var title = doc[google.picker.Document.NAME];\n        document.getElementById('result').innerHTML\
  \ =\n            '<b>You chose:</b><br>Name: <a href=\"' + url + '\">' + title +\n\
  \            '</a><br>ID: ' + id;\n      } else if (action == google.picker.Action.CANCEL)\
  \ {\n        document.getElementById('result').innerHTML = 'Picker canceled.';\n\
  \      }\n    }\n    /**\n     * 在 #result 元素中显示错误消息。\n     *\n     * @param {string}\
  \ message 要显示的错误消息。\n     */\n    function showError(message) {\n      document.getElementById('result').innerHTML\
  \ = 'Error: ' + message;\n    }\n  </script>\n</head>\n<body>\n  <div>\n    <button\
  \ onclick=\"getOAuthToken()\">Select a file</button>\n    <p id=\"result\"></p>\n\
  \  </div>\n  <script src=\"https://apis.google.com/js/api.js?onload=onApiLoad\"\
  ></script>\n</body>\n</html>\n```\n\n[/content]## Google Sheets 中的自定义函数\n\n`Google\
  \ Sheets` 提供了许多内置函数，如 `AVERAGE`、`SUM` 和 `VLOOKUP`。如果它们不能满足你的需求，你可以使用 `Apps Script`\
  \ 创建自定义函数，例如将米转换为英里，或从互联网获取实时材料。\n\n使用传统的 JavaScript 来构建自定义函数。本书的前面的章节已详细解释了你关于\
  \ JavaScript 所需的所有知识。\n\n下例展示了一个名为 `DOUBLE` 的简单自定义函数，它可以将输入值乘以 2：\n\n```javascript\n\
  /**\n * 将输入值乘以 2。\n * @param {number} input 要倍增的数字。\n * @return 乘以 2 的输入。\n * @customfunction\n\
  \ */\nfunction DOUBLE(input) {\n  return input * 2;\n}\n```\n\n## 开发自定义函数\n\n编写自定义函数：\n\
  \n1. 在 `Google Sheets` 中，创建或打开一个表格。\n2. 从菜单选择 `Extensions` > `Apps Script`。\n3.\
  \ 打开脚本编辑器并删除任何代码。复制并粘贴上述 `DOUBLE` 函数的代码到脚本编辑器中。\n4. 点击顶部的 `Save`。\n\n### 通过 Google\
  \ Workspace Marketplace 获取个性化功能\n\n许多自定义功能作为 `Google Sheets` 插件通过 `Google Workspace\
  \ Marketplace` 提供。要使用或探索这些扩展：\n\n1. 在 `Google Sheets` 中，创建或打开一个表格。\n2. 点击顶部的 `Add-ons`\
  \ > `Get Add-ons`。\n3. 在 `Google Workspace Marketplace` 打开后，点击右上角的搜索框。\n\n\n\n\n\
  \n1. 输入“custom function”后按回车。\n2. 点击`Install` 安装任何你认为感兴趣的自定义函数插件。\n3. 你可能会看到一个对话框，提示该插件需要权限。如果是这样，请在点击“允许”之前仔细阅读信息。\n\
  4. 电子表格将开始显示该插件。\n5. 打开另一个电子表格，并在顶部选择 `Add-ons` > `Manage Add-ons` 来使用该插件。\n6. 在选择了要使用的插件后，点击\
  \ `Options` `more_vert` > `Use in this document`。\n\n## 使用自定义函数\n\n一旦开发了自定义函数，或者从\
  \ Google Workspace Marketplace 安装了自定义函数，使用它的方法就和使用预安装的函数一样简单：\n\n1. 要使用该函数，请点击相应的单元格。\n\
  2. 在输入等号（`=`）、函数名和任何输入值（例如，`=DOUBLE(A1)`）后按 `Enter`。\n3. 单元格会短暂地显示 `Loading...`，然后返回结果。\n\
  \n## 自定义函数指南\n\n在创建自己的自定义函数之前，需要遵循几条规则。\n\n## 命名\n\n除了指定 JavaScript 函数的习惯做法外，请注意以下点：\n\
  \n1. 自定义函数的名称必须与内置函数的名称（如 `SUM()`）不重复。\n2. 自定义函数的名称不能以下划线（`_`）结尾，因为在 Apps Script\
  \ 中这表示私有函数。\n3. 声明自定义函数名称时，需要使用 `function myFunction()` 语法，而不是 `var myFunction =\
  \ new Function()`。\n4. 虽然电子表格函数的名称通常是大写的，但大小写其实并不重要。\n\n## 参数\n\n自定义函数可以像内置函数一样接受参数作为输入值：\n\
  \n1. 如果你使用单个单元格引用作为参数调用函数，则该单元格的值将是参数（例如，`=DOUBLE(A1)`）。\n2. 如果你使用单元格范围引用作为参数调用函数，则你的函数参数将是一个包含这些单元格值的二维数组（例如，`=DOUBLE(A1:B10)`）。例如，在下图中，Apps\
  \ Script 将 `=DOUBLE(A1:B2)` 中的参数解释为 `double([[1,3],[2,4]])`。请记住，为了接受数组作为输入，上述的 `DOUBLE`\
  \ 示例代码需要更新。\n\n![Picture 10](img/image33.png)\n\n3. 自定义函数的参数必须是确定性的。也就是说，你不能将 `NOW()`\
  \ 或 `RAND()` 等内置电子表格函数作为参数传递给自定义函数，因为它们每次计算时都会产生不同的答案。如果自定义函数尝试根据其中一个不稳定的内置函数返回值，它将始终显示\
  \ `Loading...`。\n\n### 返回值\n\n每个自定义函数必须以以下方式返回一个值进行显示：\n\n1. 如果函数返回了值，则调用该自定义函数的单元格将显示该值。\n\
  2. 当自定义函数生成二维值数组时，只要相邻的单元格是空的，值就会溢出到这些单元格中。如果此操作会导致数组覆盖任何现有单元格的内容，则自定义方法将产生异常。\n\
  3. 自定义函数只能影响它返回值所指向的单元格。换句话说，只有调用该函数的单元格及其相邻单元格可以被自定义函数修改。它不能修改任何其他单元格。相反，请使用自定义菜单启动函数来更改任何单元格。\n\
  4. 自定义函数的调用需要在 30 秒或更短时间内返回。如果没有返回，单元格将显示以下错误：`The custom function is executing\
  \ with an internal error.`。\n\n## 数据类型\n\n根据数据的类型，Google Sheets 以几种形式保存数据。当在自定义方法中使用时，Apps\
  \ Script 会将这些值视为相应的 JavaScript 数据类型。这些是最容易被误解的领域：\n\n1. Apps Script 中的 `Date` 对象是从\
  \ Sheets 中的时间和日期创建的。如果电子表格和脚本之间存在时差，自定义函数将需要调整，这是一个不常见的问题。\n2. 虽然在 Sheets 中处理持续时间值可能性的，但它们也会变成\
  \ `Date` 对象。\n3. 在 Apps Script 中，Sheets 中的百分比值会被转换为。例如，在 Apps Script 中，值为 `10%`\
  \ 的单元格变为 `0.1`。\n\n## 自动补全\n\n与内置函数类似，Google Sheets 中的自定义函数也可以使用自动补全。你将获得与你在单元格中输入的函数名匹配的预构建和自定义函数列表。\n\
  \n如果自定义函数的脚本具有 `JsDoc @customfunction` 标签，如下所示 `DOUBLE()` 示例：\n\n```javascript\n\
  /**  * 将输入值乘以 2。\n *\n * @param {number} input 要乘以的值。\n * @return 输入乘以 2 的结果。\n\
  \ * @customfunction\n */\nfunction DOUBLE(input) {\n  return input * 2;\n}\n```\n\
  \n### 使用 Google Apps Script 服务\n\n可以通过调用某些 Google Apps Script 服务使用自定义函数执行更复杂的操作。例如，为了将西班牙语翻译成英语，自定义函数可以调用\
  \ Language 服务。\n\n与大多数其他类型的 Apps Scripts 不同，自定义函数从不请求用户权限来访问个人数据。因此，它们限于调用以下服务，这些服务不具备访问个人数据的权限：\n\
  \n| 支持的服务 | 注意事项 |\n| :--- | :--- |\n| Cache |可用，但在自定义函数中并不特别有用 |\n| HTML | 可以生成\
  \ HTML，但无法显示它（很少用） |\n| JDBC | |\n| Language | |\n| Lock | 可用，但在自定义函数中并不特别有用 |\n\
  | Maps | 可以计算路线，但不显示地图 |\n| Properties | `getUserProperties()` 仅获取电子表格所有者的属性。电子表格编辑者无法在自定义函数中设置用户属性。\
  \ |\n| Spreadsheet | 只读（可以使用大多数 `get*()` 方法，但不能使用 `set*`）。无法打开其他电子表格（`SpreadsheetApp.openById()`\
  \ 或 `SpreadsheetApp.openByUrl()`）。 |\n| URL Fetch | |\n| Utilities | |\n| XML |\
  \ |\n\n如果你的自定义函数提供了错误信息 `The service requires user authorization and hence cannot\
  \ be utilized in a custom function; you do not have permission to use it.`。\n\n\
  与其构建新函数，不如构建一个自定义菜单来调用 Apps Script 函数以使用上述列表之外的服务。当从菜单调用函数时，它可以利用所有的 Apps Script\
  \ 服务并在需要时提示用户获取权限。\n\n### 分享\n\n最初，自定义函数被限制在开发它的电子表中。这意味着，除非采用以下技术，否则在一个电子表格中创建的自定义函数无法在另一个电子中使用：\n\
  \n1. 要访问脚本编辑器，点击 `Extensions` > `Apps Script`。打开脚本编辑器后，将第一个电子表格的脚本复制并粘贴到另一个电子表格的脚本编辑器中。\n\
  2. 点击 `File` > `Make a copy` 创建包含自定义函数的电子表格副本。连接到电子表格的脚本随之复制。任何可以访问电子表格的人都可以复制脚本。（具有只读权限的合作伙伴无法访问电子表格内的脚本编辑器。但当他们复制内容时，他们将副本的所有权并能够查看脚本。）\n\
  3. 将脚本发布为 Google Sheets 编辑器的插件。\n\n## 优化\n\n每当使用带有自定义函数的电子表格时，Google Sheets 会再次调用\
  \ Apps Script 服务器。如果你的电子表格有数千次（甚至数百次！）对自定义函数的调用，此过程可能会非常慢。\n\n\n\n\n因此，如果你想在大范围数据上再次使用自定义函数，可以考虑修改它，使其以二维数组的形式接收输入，并返回一个二维数组，这样该数组就可以溢出到正确的单元格中。\n\
  \n例如，上述的 `DOUBLE()` 函数可以修改为如下方式接收单个单元格或单元格范围：\n\n```javascript\n/**\n  * 将输入值乘以\
  \ 2。\n *     * @param {number|Array<Array<number>>} input 需要相乘的值或单元格范围\n * @return\
  \ 输入值乘以 2 的结果。\n * @customfunction\n */\nfunction DOUBLE(input) {\n  return Array.isArray(input)\
  \ ?\n      input.map(row => row.map(cell => cell * 2)) :\n      input * 2;\n}\n\
  ```\n\n上述技术通过使用 JavaScript `Array` 对象的 `map` 函数，对二维单元格数组中的每个值递归地调用 `DOUBLE`。结果将以二维数组的形式返回。如下所示，你只需使用一次\
  \ `DOUBLE`，让它一次性为大量单元格计算。（或者，你也可以使用嵌套的 `if` 语句代替 `map` 调用来获得相同的结果。）\n\n![Picture\
  \ 11](img/image34.png)\n\n与此，下面的自定义代码利用二维数组高效地从互联网检索实时素材，并仅通过一次函数调用即可显示两列结果。如果每个单元格都需要调用不同的函数，该过程将耗长得多，因为\
  \ Apps Script 服务器每次都需要下载并处理 XML 馈送。\n\n```javascript\n/**\n  * 显示开发者博客第一页文章的标题和日期。\n\
  \ *\n  * @return 代表开发者博客文章的两列数据。\n * @customfunction\n */\nfunction getBlogPosts()\
  \ {\n  var array = [];\n  var url = 'https://gsuite-developers.googleblog.com/atom.xml';\n\
  \  var xml = UrlFetchApp.fetch(url).getContentText();\n  var document = XmlService.parse(xml);\n\
  \  var root = document.getRootElement();\n  var atom = XmlService.getNamespace('http://www.w3.org/2005/Atom');\n\
  \  var entries = document.getRootElement().getChildren('entry', atom);\n  for (var\
  \ i = 0; i < entries.length; i++) {\n    var title = entries[i].getChild('title',\
  \ atom).getText();\n    var date = entries[i].getChild('published', atom).getValue();\n\
  \    array.push([title, date]);\n  }\n  return array;\n}\n```\n\n几乎每个在电子表格中常用的自定义函数都能从这些策略中获益，而具体的实现细节将取决于函数的行为。\n\
  \n## Google Sheets 宏\n\nGoogle Sheets 宏是一组录制的操作。一旦录制，你就可以可以使用菜单项或快捷键通过激活宏来重复执行这些活动。\n\
  \n你可以在 Google Sheets 中录制复制定义定义用户界面交互序列的宏。录制宏后，你可以将其与 `Ctrl+Alt+Shift+数字` 键盘快捷键关联。\n\
  \n该快捷键允许你轻松再次运行相同的宏步骤，通常是针对新数据或在不同的位置。此外，Google 的 `扩展程序 > 宏` 菜单允许你启动宏。\n\n当你录制宏时，Google\
  \ Sheets 会自动生成一个 Apps Script 函数（即宏函数），用于复制宏步骤。宏函数会被引入到名为 `macros.gs` 的文件中，并带到与表格绑定的\
  \ Apps Script 项目中。如果该项目已存在且与该名称的表格绑定，则宏函数会被插入到项目文件中。此外，Google Sheets 会立即修改脚本项目清单（manifest），记录宏的名称和键盘快捷键。\n\
  \n你可以直接在 Apps Script 编辑器中编辑录制的宏，因为它们都在 Apps Script 中被完全定义。通过 Apps Script，你甚至可以从头创建宏，或者将已编写的函数转换为宏。\n\
  \n## 在 Apps Script 中创建宏\n\nApps Script 函数可以作为宏函数使用。从 Google Sheets 编辑器导入现有函数是实现此点的最简单方法。\n\
  \n或者，你可以按照这些指令在 Apps Script 编辑器中创建宏：\n\n1. 在 Google Sheets 用户界面中选择 `扩展程序 > Apps\
  \ Script`，以访问与表格绑定的脚本。\n2. 编写宏函数。宏函数应该是空的——即它们不应返回任何内容。\n3. 要构造宏并附加到宏函数，请编辑你的脚本清单。为它指定一个特殊的名称和快捷键。\n\
  4. 应保存脚本项目。之后即可在表格中使用该宏。\n5. 为了确保其运行符合预期，请在表格中测试宏函数。\n\n## 编辑宏\n\n可以使用以下步骤编辑与表格关联的宏：\n\
  \n1. 在 Google Sheets 用户界面中，转到 `扩展程序 > 宏`。\n2. 找到需要编辑的宏，然后选择 `more_vert > 编辑宏`。将在\
  \ Apps Script 编辑器中启动包含宏函数的项目文件。\n3. 要更改宏的行为，请编辑宏函数。\n4. 应保存脚本项目。之后即可在表格中使用该宏。\n\
  5. 为了确保其运行符合预期，请在表格中测试宏函数。\n\n### 导入函数\n\n你可以通过为函数指定快捷键将其作为新宏导入到现有脚本中。或者，使用以下步骤从\
  \ Sheets UI 导入函数：\n\n1. 在 Google Sheets UI 中，选择 `扩展程序 > 宏 > 导入`。\n2. 从列表中选择一个函数，然后点击添加函数。\n\
  3. 选择 `完成` 关闭对话框。\n4. 选择 `扩展程序 > 宏 > 管理宏`。\n5. 找到你刚刚导入的函数。为该宏分配一个唯一的快捷键。\n6. 点击更新以保存宏配置。\n\
  \n### 宏的清单结构\n\n清单中定义 Google Sheets 宏的部分显示在下方的清单示例代码中。宏函数的名称及其对应的键盘快捷键在 `sheets`\
  \ 部分中定义。\n\n```json\n{\n  ...\n  \"sheets\": {\n    \"macros\": [\n      {\n   \
  \     \"menuName\": \"QuickRowSum\",\n        \"functionName\": \"calculateRowSum\"\
  ,\n        \"defaultShortcut\": \"Ctrl+Alt+Shift+1\"\n      },\n      {\n      \
  \  \"menuName\": \"Headerfy\",\n        \"functionName\": \"updateToHeaderStyle\"\
  ,\n        \"defaultShortcut\": \"Ctrl+Alt+Shift+2\"\n      }\n    ]\n  }\n}\n```\n\
  \n## 最佳实践\n\n在 Apps Script 中创建或管理宏时，应遵循以下原则：\n\n1. 宏越轻量化，运行效果越好。尽量将宏的操作数量减少到最。\n\
  2. 当需要以最小或无设置反复执行重复过程时，宏是理想选择。相反，请考虑使用自定义菜单项执行附加操作。\n3. 永远不要忘记，特定表格上同时可能只有十个带有快捷键的宏，且每个宏的快捷键必须是唯一的。`扩展程序\
  \ > 宏` 菜单是运行任何新宏的唯一方式。\n4. 如果你在执行宏之前选择了整个范围，那么你可以将更改单个单元格的宏应用到整个单元格范围。这意味着编写在预设单元格范围上执行执行相同操作的宏通常是多余的。\n\
  \n\n\n\n\n1. 在脚本范围外使用宏：附加到某些 Google Sheets 的脚本定义了宏。如果在独立脚本或 Web 应用程序中找到宏定义，则会被忽略。\n\
  \n1. 在 Sheets 扩展程序中设置宏：无法通过 Sheets 扩展程序来传播宏定义。Sheets 扩展程序项目的用户会忽略该扩展程序中的任何宏定义。\n\
  \n1. 在脚本库中提供宏：无法通过 Apps Script 库来分发宏定义。\n\n1. 在 Google Sheets 之外使用宏：Google Docs、Forms\
  \ 或 Slides 中没有宏；宏是 Google Sheets 专有的。\n\n# 第十七章\n\n## 在 Apps Script 中开发 Web 应用程序\n\
  \n![作为装饰品的花艺](img/image21-6.png) \n\n可以使用网络浏览器访问的程序被称为 Web 应用程序。当通过移动设备的浏览器访问时，Web\
  \ 应用程序类似于移动端应用（App），但它们并不是同一物。\n\n如果开发了脚本的用户界面，就可以将其转换为 Web 应用程序并发布到网上。例如，将一个允许客户与支持团队成员预约会议的脚本作为\
  \ Web 应用程序是非常理想的，这让消费者可以直接从浏览器访问它。\n\n只要脚本满足下方列出的规范，独立或与 Google Workspace 应用集成的脚本都可以开发成\
  \ Web 应用程序。\n\n### Web 应用程序的要求\n\n如果脚本满足某些标准，就可以作为 Web 应用程序发布：\n\n1. 存在 `doGet(e)`\
  \ 或 `doPost(e)` 函数。\n\n2. 该函数返回来自 `Content` 服务的 `TextOutput` 对象或来自 `HTML` 服务的 `HtmlOutput`\
  \ 对象。\n\n## 请求参数\n\n当用户访问应用或程序向应用提交 HTTP GET 请求时，Apps Script 会执行 `doGet(e)` 函数。与其向应用发送\
  \ HTTP POST 请求相比，Apps Script 会执行 `doPost(e)`。在所有情况下，`e` 参数均表示事件参数，可能包含有关任何请求参数的详情。下表显示了事件对象的结构：\n\
  \n| 字段 |\n| :--- | :--- |\n| `e.queryString` | URL 中查询字符串部分的值，如果没有指定查询字符串则返回 `null`\
  \ `name=alice&n=1&n=2` |\n| `e.parameter` | 对应于请求参数的键值对对象。对于具有多个值的参数，仅返回第一个值。`{\"\
  name\": \"alice\", \"n\": \"1\"}` |\n| `e.parameters` | 与 `e.parameter` 的对象，但每个键对应一个值数组\
  \ `{\"name\": [\"alice\"], \"n\": [\"1\", \"2\"]}` |\n| `e.pathInfo` | `/exec` 或\
  \ `/dev` 之后的 URL 路径。例如，如果 URL 路径以 `/exec/hello` 结尾，则路径信息为 `hello`。 |\n| `e.contextPath`\
  \ |未使用，始终为空字符串。 |\n| `e.contentLength` | POST 请求体的长度，或 GET 请求为 `-1`332 |\n| `e.postData.length`\
  \ | 与 `e.contentLength`332 相同 |\n| `e.postData.type` | POST 体的 MIME 类型`text/csv`\
  \ |\n| `e.postData.contents` | POST 体的文本内容`Alice,21` |\n| `e.postData.name` | 始终为值\
  \ \"postData\"``postData` |\n\n例如，你可以像下面所示将 `username` 和 `age` 等参数传递给 URL：\n\n`https://script.google.com/.../exec?username=jsmith&age=21`\n\
  \n然后，你可以像这样显示这些参数：\n\n```javascript\nfunction doGet(e) {\n  var params = JSON.stringify(e);\n\
  \  return ContentService.createTextOutput(params).setMimeType(ContentService.MimeType.JSON);\n\
  }\n```\n\n在上面的示例中，`doGet(e)` 返回以下输出：\n```json\n{\n  \"queryString\": \"username=jsmith&age=21\"\
  ,\n  \"parameter\": {\n    \"username\": \"jsmith\",\n    \"age\": \"21\"\n  }\n\
  }\n```\n\n\n\n\n\n下面的示例演示了如何使用 Google 表格数据创建登录和注册表单。你可以访问 [`youtu.be/2qRti1S9rK8`](https://youtu.be/2qRti1S9rK8)\
  \ 上的视频教程。代码显示在下方：\n\n### 示例 1\n\n#### Code.gs\n```javascript\nfunction doGet(e)\
  \ {\n  var x = HtmlService.createTemplateFromFile(\"\");\n  var y = x.evaluate();\n\
  \  var z = y.setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n  return\
  \ z;\n}\nfunction checkLogin(username, password) {\n  var url = '';\n  var ss= SpreadsheetApp.openByUrl(url);\n\
  \  var webAppSheet = ss.getSheetByName(\"DATA\");\n  var getLastRow = webAppSheet.getLastRow();\n\
  \  var found_record = '';\n  for(var i = 1; i <= getLastRow; i++){\n    if(webAppSheet.getRange(i,\
  \ 1).getValue().toUpperCase() == username.toUpperCase() &&webAppSheet.getRange(i,\
