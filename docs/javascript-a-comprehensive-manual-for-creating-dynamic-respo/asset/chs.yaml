  5. 以及更多 ...\n\n# 第十章\n\n# JavaScript 循环\n\n![作为装饰的花插艺](img/image21-2.png)\n\nJavaScript\
  \ 循环是高效执行重复任务的强大工具。JavaScript 中的循环在条件为真时会反复执行一个代码块。\n\n例如，假设我们想打印 5 次“Hello World”。这可以通过\
  \ JS 循环轻松实现。在循环中，语句只需要编写一次，循环将执行 5 次，如下所示：\n\n```\nfor (let i = 0; i < 5; i++) {console.log(\"\
  Hello World!\");}\n```\n\n输出：\nHello world!Hello world!Hello world!Hello world!Hello\
  \ world!\n\n编程语言中的循环是一种特性，它允许重复执行代码块，直到某些条件变为假。\n\n例如，如果你想显示 100 次消息，就可以可以使用循环。这只是一个简单的例子；你可以通过循环实现更多功能。\n\
  \nJavaScript 循环使用 `for`、`while`、`do while` 或 `for-in` 循环来迭代代码段。它使得代码更加紧凑。它主要用于数组。\n\
  \nJavaScript 中有四种循环：\n\n1. for 循环\n2. while 循环\n3. do-while 循环\n4. for-in 循环\n\n\
  如果你想反复运行相同的代码，且每次使用不同的值，那么循环就是非常有用的。\n\n在处理数组时，通常是这种情况：\n\n### 与其写入：\n\n```javascript\n\
  text += cars[0] + \"<br>\";\ntext += cars[1] + \"<br>\";\ntext += cars[2] + \"<br>\"\
  ;\ntext += cars[3] + \"<br>\";\ntext += cars[4] + \"<br>\";\ntext += cars[5] + \"\
  <br>\";\n```\n\n### 你可以这样写：\n\n```html\n<!DOCTYPE html><html><body><h2>JavaScript\
  \ For Loop</h2><p id=\"demo\"></p><script>\nconst cars = [\"BMW\", \"Volvo\", \"\
  Saab\", \"Ford\", \"Fiat\", \"Audi\"];\nlet text = \"\";\nfor (let i = 0; i < cars.length;\
  \ i++) {text += cars[i] + \"<br>\";}document.getElementById(\"demo\").innerHTML\
  \ = text;</script></body></html>\n```\n\n## For 循环\n\n`for` 语句通过 3 个可选表达式创建一个循环：\n\
  \n当 `for` 循环执行时，会发生以下情况：\n\n1. 执行初始化表达式 `initialization`（如果有的话）。该表达式通常初始化一个或多个循环计数器，但语法允许任何复杂程度的表达式。该表达式也可以声明变量。\n\
  2. 求值条件表达式 `condition`。如果 `condition` 的值为真，则执行循环语句。否则，`for` 循环终止。（如果完全省略了 `condition`\
  \ 表达式，则假设条件为真。）\n3. 执行语句 `statement`。要执行多条语句，使用块语句（`{ }`）来组合这些语句。\n4. 如果存在，则执行更新表达式\
  \ `afterthought`。\n5. 回到第 2 步。\n\n```javascript\nfor ( expression 1 ; expression\
  \ 2 ; expression 3 ) { // 要执行的代码块 }\n```\n\n- `Expression 1` 在执行代码块之前执行（执行一次）。\n\
  - `Expression 2` 定义了执行代码块的条件。\n- `Expression 3` 在代码块执行后执行（每次都执行）。\n\n```html\n<!DOCTYPE\
  \ html><html><body><h2>JavaScript For Loop</h2><p id=\"demo\"></p><script>\nlet\
  \ text = \"\";\nfor (let i = 0; i < 5; i++) {text += \"The number is \" + i + \"\
  <br>\";}document.getElementById(\"demo\").innerHTML = text;</script></body></html>\n\
  ```\n\n从上面的示例中，你可以看到：\n\n- `Expression 1` 在循环开始前设置变量（`let i = 0`）。\n- `Expression\
  \ 2` 定义了循环运行的条件（`i` 必须小于 5）。\n- `Expression 3` 在循环中的代码块每次执行后增加值（`i++`）。\n\n1. `initialExpression`\
  \ 初始化和/声明变量并仅执行一次。\n2. 求值 `condition`。\n3. 如果 `condition` 为假，循环终止。\n4. 如果 `condition`\
  \ 为真，则执行循环语句。\n5. 如果存在，则执行 `update expression`。\n6. 回到第 2 步。\n\n`initialExpression`\
