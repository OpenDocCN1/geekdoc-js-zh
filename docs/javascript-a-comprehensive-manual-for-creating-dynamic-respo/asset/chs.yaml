  \ 鼠标轮在元素上向上或向下滚动 | WheelEvent |\n\n### JavaScript 事件处理器\n\n事件处理程序可以用于处理和验证用户输入、用户操作以及浏览器操作：\n\
  \n1. 每次页面加载时都应该执行的操作\n2. 页面关闭时应该执行的操作\n3. 用户点击按钮时应该执行的动作\n4. 用户输入数据时应该验证的内容\n5.\
