  \ 将填充好的 HTML 表单数据详细提交到 Google 表格中。在当今数字时代，高效的数据收集和管理对于个人和企业都至关重要。HTML 表单是数据收集常用的工具，而\
  \ Google 表格是存储这些数据的绝佳之处。我们将引导你如何在你的网站上设置数据输入表单，并轻松将数据移动到 Google 表格中。在本课程结束时，你将拥有一个有效的工具来加速你的数据收集流程。\n\
  \n## 理解 HTML 表单与 Google 表格集成的价值\n\n在进入技术细节之前，让我们快速回顾 HTML 表单与 Google 表格集成的优势。这种策略具有几个优点：\n\
  \n1. **高效的数据收集**：由于 HTML 表单广泛可用且易于使用，收集数据轻而易举。\n2. **实时更新**：输入到表单的信息可能会立即反映在 Google\
  \ 表格中，让你能够获取最新的信息。\n3. **单一数据存储**：Google 表格通过提供一个组织和存储数据的单一区域，消除了分散文件和手动录入数据的需要。\n\
  \n## 示例 1\n\n### Code.gs\n```javascript\nvar sheetName = 'Sheet1'\nvar scriptProp\
  \ = PropertiesService.getScriptProperties()\nfunction intialSetup () {\n  var activeSpreadsheet\
  \ = SpreadsheetApp.getActiveSpreadsheet()\n  scriptProp.setProperty('key', activeSpreadsheet.getId())\n\
  }\nfunction doPost (e) {\n  var lock = LockService.getScriptLock()\n  lock.tryLock(10000)\n\
  \  try {\n    var doc = SpreadsheetApp.openById(scriptProp.getProperty('key'))\n\
  \    var sheet = doc.getSheetByName(sheetName)\n    var headers = sheet.getRange(1,\
  \ 1, 1, sheet.getLastColumn()).getValues()[0]\n    var nextRow = sheet.getLastRow()\
  \ + 1\n    var newRow = headers.map(function(header) {\n      return header ===\
  \ 'timestamp' ? new Date() : e.parameter[header]\n    })\n    sheet.getRange(nextRow,\
  \ 1, 1, newRow.length).setValues([newRow])\n    return ContentService\n    .createTextOutput(JSON.stringify({\
  \ 'result': 'success', 'row': nextRow }))\n    .setMimeType(ContentService.MimeType.JSON)\n\
  \  } catch (e) {\n    return ContentService\n    .createTextOutput(JSON.stringify({\
  \ 'result': 'error', 'error': e }))\n    .setMimeType(ContentService.MimeType.JSON)\n\
  \  } finally {\n    lock.releaseLock()\n  }\n}\n```\n\n### Form.html\n```html\n\
