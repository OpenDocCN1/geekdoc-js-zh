  md: "The complexity of a program is a function of several factors:\n\n+   * The\
    \ number of distinct lexical tokens\n* The number of characters\n* The number\
    \ of branches in which control can pass to a different point\n* The number of\
    \ distinct program objects in scope at any time\n\nWhenever a language allows\
    \ you to change some code to reduce any of these factors, you reduce complexity.\n\
    \n# 3.7.1 Lose the Temporary Variables\n\nThe poster child for complexity is the\
    \ temporary variable. Any language intrudes between you and the solution you visualize,\
    \ it diminishes your ability to implement the solution. All languages do this\
    \ to some degree; Perl perless most[2] In most languages, you swap variables a\
    \ and b with the following algorithm:\n\n> [2] We want to say \"less than the\
    \ rest,\" but we just know what sort of letters we'd get ...\n\n```\nDeclare temp\
    \ to be of the same type as a and b\n```\n\n```\ntemp = a;\na = b;\ntemp = temp;\n\
    ```\n\nBut most languages are not Perl:\n\n```\n($b, $a) = ($a, $b);\n```\n\n\
    Iterating over an array usually requires an index variable and a count of how\
    \ many things are stored in the array:\n\n```\nint i;\nfor (i = 0; i < count_lines;\
    \ i++) {\n  strcat(line[i], suffix);\n}\n```\n\nWhereas in Perl, you have the\
    \ foreach { $line = $suffix }\n\n```\nforeach $line (@lines) { $line .= $suffix\
    \ }\n```\n\nAnd if you feel put out by typing foreach instead of for, you're in\
