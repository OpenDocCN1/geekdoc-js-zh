  md: 'In fact, the debugger for Perl is a plugin written using hooks enabled by the
    -d flag. It''s possible to write programs that do things with hooks other than
    present an interactive command-line interface, and several people have done so.
    We''ve already seen one example, Devel::Coverage in Chapter 6, and we''ll visit
    Devel::DProf in Chapter 11.


    # 7.2 Starting


    The -d command option allows your script run under the debugger. You can either
    add it to the options in the # line at the beginning of your script, or you can
    override the options by explicitly running the script through Perl. So for example,
    if wombat.pl currently has the -w option set, you can change its first line to


    ```

    #!/usr/bin/perl -wd

    ```


    or you can type


    ```

    % perl -wd wombat.pl

    ```


    to debug it without changing the script. Unlike some debuggers, with this one
    you supply arguments to the program on the command line, not as part of a debugger
    command; for example:


    ```

    % perl -wd wombat.pl kangaroo platypus wallaby

    ```


    The debugger DB will announce itself and provide a prompt:


    ```

    Loading DB routines from perl5db.pl version 1.07

    Emacs support available.

    ```


    Enter `h` or `h''` for help.


    ```

    main::(wombat.pl): my $marsupial = shift;

    DB<1>

    ```


    From now on we will see everything before the first prompt (and the code on which
    it is

    stopped) when reproducing debugger sessions.


    To begin, let''s look at some simple commands. The first one of interest, of course,
    is h

    The output from this is several lines long, which gives us an opportunity to

    anoption we can apply to all commands: put a vertical bar (|) before any command
    and it

    will run the output through your pager (the program that prints screen at a time,

    waiting for you to tell it when to continue—more or less less).


    # 7.2.1 Watch the Code Execute: s, n, r


    Enter this simple program into debug.pl:


    ```

    #!/usr/local/bin/perl -w

    ```'
