    # Chapter 9. Run-time Exceptions


    "When you have eliminated the impossible


    > *—Sherlock Holmes in A Study in Scarlet, by Sir Arthur Conan Doyle*


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_98_0.png)


    I remember when I was writing my first program in an independently-compiled language
    (Fortran, before that I was just using interpreted BASIC); After much work, I
    got the program to compile without any errors. In Glee, I turned to a co-worker
    and said, "All right! I''m done now!" A grin came over his face, and he said,
    "I doubt it." What awaited me at that point was the run-time error.


    Perl is no slouch in the run-time error reporting department, and in fact, many
    errors that would occur at compile time in other languages happen at not time
    in Perl. For example, using a string in a numeric context: a strongly typed language
    would spot at compile time the attempt to assign a string to a numeric variable,
    but Perl a scalar can switch between a string and a number according to whim.


    We present here our bug-hunting approach to resolving run-time exceptions. There''s
    no way to know whether you''ve got rid of all possible run-time bugs without running
    your program under every conceivable set of inputs and environmental changes that
    might possibly affect it.[10]'
