    # # 13.11 Dying Young


    Perhaps the vast majority of people to deal with CGI programming is how to handle
    exceptions. If something in your program `dies`, it (normally) prints a message
    to STDERR and exits. The error message doesn''t look like an HTTP header, so it
    comes out 500 Server Error. And if it comes out, it won''t be in HTML (or GIF,
    whatever you''re outputting) and will mess up the formatting of whatever you''re
    in the middle of sending.


    This is mostly addressed by the CGI::Carp module. With the statement `use CGI::Carp;
    qw(fatalsToBrowser);` if your program dies, the message will be trapped and output
    to the browser², so as a short example, consider the following CGI program:


    > ²If you leave the fatalsToBrowser parameter, then output to STDERR gets identified
    and timestamped. This is healthy when you''re using a server that sends to the
    log—you can tell what generated message and when.


    ```

    #!/usr/bin/perl -w


    use strict;

    use CGI qw(:standard);

    use CGI::Carp qw(fatalsToBrowser);


    my ($num_angles, $pinhead_size) = (1_000_000_000, 0);


    print header, start_html, h1(''Philosophy 101'');


    print p(<<EOP


    Other Web sites wonder how many angles can dance on the head of a pin; we calculate
    it for you.

    EOP


    print p(''The answer is '', $num_angles/$pinhead_size);

    ```'
