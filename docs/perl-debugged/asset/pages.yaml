  md: '# 5.2 Making Optional


    After typing in a tracing statement, taking it out after the code is "working,"
    then putting it back in the code mysteriously stops working, you''re motivated
    to find a way to leave it in there and selectively enable it.


    The most primal way is to execute it, but there are no independently compiled
    binary executables for Perl programs.[26] this isn''t as bad as a solution as
    it would be for, C—you''ve had to rebuild the executable and have a way of knowing
    whether it was in sync with the source. Make sure that if your print statement
    exceeds one line, you comment/uncomment all the lines.


    > [26] With a few qualification-ridden exceptions.


    The next best option is to create a program-wide Boolean variable that controls
    whether tracing statements are executed: this is an acceptable use of global variable.


    ```

    use constant DEBUG => 1;

    # later that same program...

    ***DEBUG*** Tax rate = $tax_rate\n" if DEBUG;

    ```


    Note that we made DEBUG a constant so it doesn''t accidentally get overwritten.


    With such warn statements in your code the Laziness Principle will assert itself:


    ```

    use constant DEBUG => 1;

    sub dbprgt (@);


    # code ...

    dbgprt "$. lines in input file\n"


    # more code ...

    sub dbprgt (@)

    {

    warn "***DEBUG*** \ @_ if DEBUG;

    }

    ```


    Now we''ve abstracted all functionality we might want to change about our tracing
    statements (what marker text they use, to decide whether to print them, what output
    function they use) into one place where we need to change it only once. We''ve
    created a prototype for the dbprgt subroutine before its first use so that we
    can use the same way as we do warn (in this case, passing a list of arguments
    without having to put parentheses around them).


    Fully evolved, you say? Au contrario, we''ve merely advanced to the aquatic stage.
    If we really want to walk on the land, it''s time to find our feet.'
