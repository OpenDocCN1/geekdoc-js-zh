  md: 'Run-time semantics alone determine whether a routine is an object method or
    a class method, so you can easily write one that swings both ways. (A common idiom
    makes an object method out of a constructor.)


    There is nothing special about a constructor method in Perl; you can call it anything
    you want, but most programmers call it new to make you feel welcome. Not only
    is the underlying implementation of an object exposed, but you get to implement
    it yourself from a bewildering array of choices (The one you feel comfortable
    with is a hash; don''t look at the others until you''ve got that under your belt.)
    And there is no native support for creating instance data attributes or inheriting
    them, but there are optional pragmas (base, fields) that provide some syntacticaring
    for doing so.


    Regardless, your classes should not access the instance data directly but instead
    via accessor methods. You may use a module (such as Class::Struct) to create these
    methods automatically, and it seems that any class writing these demands requires
    custom logic in each accessor method away.


    It is possible to modify the object''s instance directly unless you go to lengths
    to make the instance data as private as you''re accustomed to (See "Closures as
    Objects" in the perl documentation page.) This is widely perceived as a problem
    in Perl since the philosophy is that people with instance data directly when the
    specification for the public interface the class does not permit whatever they
    want.


    Because there are no function prototypes (the kind you''re used to) in Perl, there
    is no method overloading with different prototype signatures. You get to validate
    the number and type of arguments you''re called at run time, if you want.


    You cannot enforce abstract (pure virtual) methods to be overridden at compile
    time, but you can create one that throws a runtime exception, unless it has been.


    You''ll find methodical comparisons among Perl, C++, and Java in Damian Conway''s
    excellent book, Object-Oriented Perl (Manning, 1999).


    # 12.5.1 Specific Tips for the Java Programmer


    In Perl you have the option of creating a program that is not all object-oriented
    and—errors—isn''t even a class. This is actually the best approach for solving
    problems, as hard as it is to get out of the habit of doing a class hierarchy
    decomposition every time you write a program.


    The issue of "what extent code you publish for reuse should be object-oriented"
    has engender fiery partisan arguments in the Perl community, with impassioned
    advocates at both ends of the spectrum. The uplift of this is that you can take
    whatever position you want and justify it by an appeal to authority.[4]. Our rule
    of thumb is: If you''re writing something just for your use which is not likely
    to have significant reusability, the overhead for making it object-oriented is
    unlikely to be worthwhile. If you''re writing to be used by other people, an O-O
    interface will probably be worth the effort, considering how neatly it separates
    the interface from the implementation and relieves you of the need to provide
    any more than simply ensuring that the interface lives up to its promises.


