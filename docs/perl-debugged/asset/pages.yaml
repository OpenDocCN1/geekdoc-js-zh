    # Preface


    > "It fills my head with ideas, only I don''t really know what they are."


    > —Alice in Through the Looking-Glass and What Alice Found There


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_1_0.png)


    # Perlness


    In the world of languages, the country of Perl is the great melting pot which
    welcomes all cultures, religions, and beliefs. "Give me your tired, your poorly-supported
    programmers, your huddled masses yearning to be free of artificial limitations,"
    says Perl, and those who land on its shores find an environment where they are
    no longer hampered by a language designer''s whimsical notions of elegant semantics
    and stifling syntactical purity.


    Perl''s universal availability and ease-of-use make it the most democratic programming
    language. Unlike many other languages, a relative beginner can write useful programs,
    whereas effective programmers in other languages normally need to spend a lot
    longer to learn syntax, operators, and functions. A Perl programmer may possess
    such expertise, or may be a newcomer who modified some example script to perform
    a new function.


    But the newcomer has another problem: lack of debugging skills. Experience forces
    the canny to develop an innate knack for debugging due to years of accumulated
    pain. We minimize that pain, because we have suffered it. Perl''s ease of use
    allows programmers with little knowledge to create usable, if fragile, code. The
    amount of time it takes to debug a'
