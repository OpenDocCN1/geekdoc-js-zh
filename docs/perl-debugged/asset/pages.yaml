  md: '![](img/0a24c2fae51dbf173db8a36f6c94a0bd_73_0.png)


    An interactive, command-oriented debugger fails the practical definition of an
    instrument of torture, but this distinction appears too fine for many otherwise
    fearless, capable programmers who shiver and cringe with despair when asked to
    use one. Debuggers, while not inherently evil, do rather esoteric, and their use
    more of an art form than a practical skill.


    > I''ve had people in my classes who thought debuggers were tools to fix bugs
    from their code. If only this were so. Therefore it probably bears explaining
    that, contrary to its name, a debugger is merely a device that allows you to execute
    a program incrementally while having an opportunity to examine and change its
    internal state as it does.


    This concept is not with Perl. Interactive debuggers like the one in Perl have
    been around for decades, the only thing special about Perl''s is the degree of
    access it gives you to its internals, allowing you to create a customized debugging
    interface if you wish (more on this later).


    # 7.1 Basic Operation


    Normally perl runs your program unhindered, but the debugger is a way of allowing
    both perl and you to run your program together. At any point in the execution
    of your program you can have pause and tell you what it has done so far. Think
    of the Perl run-time system as a mouse that gobbles up a trail of bread crumbs
    that are the opcodes of your program. The debugger allows you to tell the mouse
    to stop at points of your choosing and interrogate it as the contents of its digestive
    system. And if you dont like the values of some of the variables, you can change
    them (we will not attempt to extend our metaphor to include this).'
