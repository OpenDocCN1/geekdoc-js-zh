  md: "As you can tell from the chapter title, we're not above coining horrible neologisms\
    \ to save space. (When our publisher pays us by the word, we'll be happy to be\
    \ more verbose, paying us by the word would be as sensible as measuring programmers'\
    \ performance by how many lines of code you write).\n\nAntibugging describes a\
    \ set of programming techniques that minimize the probability of introducing a\
    \ bug at design time or input. You could also call it defensive programming. We're\
    \ applying the principles we developed in the previous chapter to come up with\
    \ some good Perl development behaviors.\n\n# 3.1 Beginning\n\nBefore you turn\
    \ your ideas into code, describe them in natural language.\n\n+   - If you can't\
    \ say it in natural language, you won't be able to say it in Perl.\n\n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_22_0.png)\n\
    \nThe Extreme Programming methodology (mentioned in more detail in Chapter 6)\
    \ is helpful in this respect by insisting that tests be written before the code\
    \ they test, and requiring in pairs, it encourages this kind of conversation.\n\
    \n> I've seen this too many times: someone is having horrible difficulties doing\
    \ an exercise and the code is bleeding over the screen. When I ask them to describe\
    \ how it's supposed to work, they can articulate it. This is a large cost that\
    \ the approach wasn't completely thought out to begin.\n\n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_22_1.png)\n\
    \n# 3.2 Writing Code\n\nYour code should be as pleasing to the eye as possible,\
    \ if for no other reason you should like looking at it and not recoil at the prospect\
    \ of diving into an eructation of characters on the screen. Let's face it, programs\
    \ need all the aesthetic help they can because their primary purpose is utilitarian.\
    \ Which of the following subroutines do you prefer?\n\n```\nsub iterate($) {\n\
    \  for ($[$1] = 0, my $i = 0; $i <= $_[2];\n    $_[1] = ++$i/$[2] &&(&[$[0]);\n\
    \  }\n}\n```\n\nor\n\n```\nsub iterate($) {\n  for ($[$1] = 0, my $i = 0;\n  \
    \  $i <= $_[2];\n    $_[1] = ++$i / $_[2])\n}\n```"
