    # 13.1 CGI


    A glance at comp.lang.perl.misc reveals that many people do not understand the
    difference between the CGI protocol and the Perl scripts that we use. We therefore
    consider it our civic duty to take the time to explain it here, even though we''re
    talking about something that is not Perl. (That''s the Perl connection—that has
    nothing to do with Perl. It''s all very Gödel-like.)


    The Common Gateway Interface is a specification for how a Web server can deliver
    dynamic content. It says that you can have a URL that points not to a static file
    but to a program whose output is sent to the browser. The user of the browser
    cannot tell the difference between a CGI program and a static file by looking
    at what the server returns; the only clue is that the URL usually looks different.
    (Instead of ending in .html, it probably ends in .cgi or /cgi-bin/). There''s
    nothing hard and fast about this rule. It''s easy to configure a Web server to
    return static pages whose URLs look like CGI programs, and vice-versa. The point,
    however, is that they shouldn''t care what produced the output.


    The CGI specification spells out how a program invoked in this way can have inputs
    sent by a browser (as part of the URL using an HTTP GET command or HTTP content
    with a POST command), how the program can see those inputs (in the QUERY_STRING
    environment variable or in their standard input respectively), how the inputs
    are encoded (a'
