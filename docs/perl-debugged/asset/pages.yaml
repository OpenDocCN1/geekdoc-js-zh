  md: '# 3.5 Developing


    There''s no substitute for knowledge. Coding something you don''t understand should
    set off warning bells in your brain: "What does the code I just wrote really do?”
    That''s the time to experiment.


    I have seen many people take a shotgun approach to coding; they just fire a blast
    of characters onto the screen and rearrange them until something works. Too often,
    instructors foster the mindset that the only thing that counts is the right answer:
    I keep finding people who do something in a program "because it works"—in that
    particular situation—but don''t understand what they are doing and can''t extend
    it to other situations or aren''t aware of how it might fail.


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_30_0.png)


    Nevertheless, there are times when you have to do quite beyond your current ability
    or the rate at which you can learn something new. Here are some useful ways to
    cheat:


    +   1. Tom Christians and Nathan Torkington have gone and left a pile of fact
    book^[1] at your local bookstore which you can use for anything and they''ll never
    complain. If you find the task you''re trying to solve in there, have at it. You
    can always break your overall task into smaller logical units that are generic
    and therefore more likely to be in the book.


    > [1] The Perl Cookbook (O''Reilly & Associates, 1998).


    +   2. Mutate. Start by using good code that does something similar to what you
    want, and gradually change it to your needs. Even there may be code you don''t
    understand in there, it may stay isolated from your changes, so you don''t have
    to worry about it. (Anyone who has subclassed a module is familiar with this way
    of thinking.) How do you recognize good code? Emulate the best.


    Now, whenever we''ve asked to emulate, people have been reluctant to emulate anyone
    in particular. We applaud their sense of faithfulness but the result is frustrating.
    Therefore we present our biased, incomplete, but still useful list of authors
    whose code you find on the net, the copying of which will likely lead to good
    results.[2] We hope to avoid any more outerrage than necessary.


    > [2] However if you see any code posted by these or other people with references
    to either golf or bowling, they are competing to see who can solve the problem
    in the smallest or largest number of characters. The winner in each case is unlikely
    to be highly comprehensible. See http://perlig.com/tags/id15.


    | Gisle Aas | Uri Gutman | Chip Salzenberg |

