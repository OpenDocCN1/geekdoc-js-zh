  md: '+   4. It''s not enough to how things work, you also have to say why. Any time
    you make a choice that isn''t obvious, explain it. Otherwise when you come back
    to it in six months, you''ll be staring at that spot wandering, "Why did I do
    it that way? There''s a much more obvious way..."


    +   5. Comments are not enough. Explain the how and why of the code, they don''t
    say why you were doing it in the first place. Whether or not you put it in the
    same file as the code, somewhere you need a user guide for the person using your
    code, and you need to capture the thoughts that went into the code''s design.
    Is there a method for this in your class hierarchy? If you read your data from
    a flat file, instead of an Oracle database that everyone else uses, because your
    data file contains one more attribute than the database captures, so if you come
    up with it, the thoughts need to be captured somewhere.


    Perl provides a couple of ways of documenting as you code, and in the ideal for
    documentation—right next to the code itself. The first way is the old dependable
    end-to-end, for informing a code maintainer of the operation of tricky code or
    certain nonvious choices made. The second way is POD—plain old documentation—a
    rudimentary system of embedding interface documentation in the program, which
    can be extracted into Unix pages, HTML, or other formats by programs included
    with perl.


    > Brad Apple Terms the reason that this is advantageous the locality principle
    of reference documentation and has an extensive discussion on it at http://cm2.org/wiki/localityOfReferenceDocumentation


    > Look for the reading parts podman, pod2html, or pod2anything-else-you-might-want-to.


    # Comment the hard parts. Use POD.


    Documentation is for the user of the program or module, someone who might be lucky
    enough not need to need but to look at your actual code. The advantage of putting
    this documentation in the same file as the code is twofold: it reduces the number
    of files you need to ship, and it enables you to put external documentation as
    close as you are to the actual code it refers to. (Although not of sequence—POD
    is like a gap-toothed backwards cousin of WEB, Donald Knuth''s "literary programming"
    tool which was flexible enough to do reordering and capable of producing beautifully
    annotated versions of your program. Unfortunately, the user also had to learn
    TeX and learn how to embed TeX and program code in a hieroglyphic soup that made
    TE macros read like Dr. Seuss. But enough nostalgia.)


    POD is almost certainly the best choice for your user documentation, because people
    expect to find it in Perl files.


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_29_0.png)


    To be blunt, a proper program is defined by the set consisting of the executable
    code, comments that describe the how and why of the code, and documentation describing
    the function of the program (with examples). Real men and women comment their
    code!'
