  md: '![](img/0a24c2fae51dbf173db8a36f6c94a0bd_63_0.png)


    Hands up everyone who hates testing their code. Yes, we thought so. And who can
    blame you? The hidden beliefs that make testing so painful deep:


    +   - I might find something so wrong that I have to make a radical change.

    - If I find something wrong, I''ll have to delay delivery.

    - I''m a code writer, not a code tester.

    - If I find something wrong, I''ll lose plausible deniability unless I take the
    time to fix it.

    - It''s really the way it is. I don''t want to be bothered with special cases
    that no one''s like to hit anyway.

    - Users are the best testers. They have real cases.


    It''s a rare programmer who doesn''t have at least one of those going on (our
    hands are up too). Unfortunately, as dirty as the job is, it''s yours and no one''s
    responsibility to make sure you deliver the best code you can. So let''s waded
    the discomfort and the apathy and see what we can do.


    Testing is getting more attention lately, thanks to a new method called Extreme
    Programming (XP), which states that not everything shall be tested, but also that
    the tests will be written before the code test. Here''s a breakdown of different
    types of testing:


    +   - Inspection testing, or code walkthroughs. Nothing is executed; people simply
    read the code.

    - Unit testing. Each individual component is tested for the expected response
    under the design conditions and for correct error responses under all conditions.


    Although there is no clear definition of how a component can be tested, it is
    expected that it is small enough so that you can test all or nearly all the possible
    boundary conditions and execution paths and it is relatively easy to test the
    component in isolation. In most languages, the unit is a subroutine.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   * Integration testing. This is testing whether a subroutine or group of
    subroutines functions according to design specifications with regards to API and
    linked with whatever other subroutines exist in a project. Issues to consider
    at this stage are namespace conflicts and memory leaks.


    +   * System testing. This is the entire system (or whatever you call the thing
    you are delivering) is tested against the customer''s requirements. (You did requirements
    from the customer, didn''t?)


    +   * Regression testing. This is the same as system testing, but the term implies
    that it is performed when any changes have been made to the system to ensure that
    the system still performs correctly and has not regressed to some other state.


    +   * Saturation testing, or load testing. This handles arbitrary loads (such
    as Web servers) it''s important to find out what its limits are. This type of
    testing more and more simultaneous requests at the system if it fails or you exceeded
    the requirements by a vast margin


    +   * Acceptance testing. This is for you, it''s for the customer. They need a
    way to tell what you''ve delivered to meet their requirements. In an ideal world,
    you write the tests, and warrant that it matches the requirements they gave you.
    Don''t be surprised if they ask you to write the tests for them, though. (Don''t
    be surprised if they say, "What''s acceptance testing?" either.)


    Few projects include all of these types; the distinctions among several of them
    are blurred anyway, and will usually be acceptable to leave some out. XP requires
    only testing and regression testing; code walkthroughs of a sort happen because
    programmers are required to work in pairs.


    Let''s go through each type of testing and see what it means to a Perl programmer.


    # # 6.1 Inspection Testing


    Other people are going to look at your code—they may find bugs—and they are very
    likely to comment on its readability and maintainability. If you picked a consistent
    style (see Perl of Wisdom) and consistently commented your code, they should have
    fewer nit to pick in that department.


    You are not bound to accept everything from the people reviewing your code (people
    who should be your peers; this process is not a management function), only the
    ones that make sense. The more you can keep your ego in check, the better, because
    you want to learn from the process; merely showing how brilliant your code is
    won''t anything to improve your craft.


    A mammoth booth of contention that often arises is the issue of code quality.
    A neophyte programmer codes to veterans, the latter will suggest all sorts of
    optimizations to abbreviate the code. This issue is more acute with Perl than
    with any other language invented. Even more vexingly, an expert programmer codes
    to novices will hear all kinds of standard idioms attacked as "obfuscated," too
    clever," or "incomprehensible."


    There is no universal solution to this problem. If the practice at your business
    is to code at the level of the lowest common denominator, then the presence of
    a beginner will drag the whole team down. If the practice is to code to the level
    of the majority then the value of an expert will be diminished by an average team.
    On the other hand, the expert''s code will be useless to the company if no one
    who''s left on the team can understand it after the expert'
