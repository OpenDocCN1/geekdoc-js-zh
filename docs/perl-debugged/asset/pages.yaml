    .\\d+)?[+-]?\\d+)/i) {\n        $scientific($1)++;\n    }\n    elsif (/(-?\\d+\\\
    .\\d+)/) {\n        $float($1)++;\n    }\n    elsif (/(-?\\d+)/) {\n        $integer($1)++;\n\
