  md: '"Okay," you say, licking your wounds but determined to come back fighting,
    "so why didn''t the same problem occur with printf? What''s the difference?"


    The difference is that printf wasn''t given the same internal prototype. (This
    may be changed in a later version of perl) But in the case of printf, you couldn''t
    write a prototype for yourself if your life depended on it, because printf can
    take a filehandle as a special kind of argument:


    ```

    printf STDOUT "The answer is %d\n", 42;

    ```


    Note''s no comma after it! The prototyping mechanism available to more users of
    perl does not permit this.


    Most of the built- ("core") functions in Perl have implicit prototypes. As version
    5.005, you can find out that they are with the prototype function and prefixing
    the built-in with the string "CORE::_"For example:


    > As you have guessed, prototype can be used to discover prototypes for any function,
    not just built-ins.


    ```

    $ perl -le ''print prototype CORE::substr'' \n$$

    ```


    A indicates a scalar is expected, and ; means that the following argument is optional.
    If you compare this with the perl for substr, you''ll see that it can take two,
    three, or four arguments. If a function is so special that you couldn''t write
    a prototype for it (like printf), prototype returns undef.


    It''s unlikely that you''ll try over anything besides sprintf, because the other
    prototypes for built-ins are and if you passed an array where Perl was expecting
    some scalars, you''d get a compile-time error that weren''t enough function arguments.
    And this is the reason out prototypes exist: to tell you that you have provided
    enough arguments to a routine.


    Unfortunately there is a trade-off at work here: if you want to make sure the
    user provides two scalars as function arguments (like the built-in crypt) and
    throw compile-time exception if they don''t, you should declare function with
    a prototype of $$ But then the user can''t use an array containing two arguments
    to the function and get the result they want. (Again, what are the odds someone
    want to supply the two arguments to crypt via an array?) Whether or not you subroutine
    prototypes, be aware that most of the perl built-ins do, and the Perl porters
    consider printf to be the interface in need of repair, not sprintf, regardless
    of what happened in our contrived example.


    If you wanted to make a more general rule out of this nitlicky point, the Perl
    of Wisdom would be'
