    # 9.5 Confession Is God for the Soul


    Sometimes your program dies not in your code but in some module you call—suicide
    by association if you will. A module that wants to die is supposed to call Carp::croak
    instead, because croak reports the location of death as the place the module function
    was called, not the line of code in the module function containing the croak call.


    Some modules do not do this. They either call die, or they call another module
    that croaks; either way, you''re left with an error message that doesn''t tell
    you which line of your program caused your untimely demise.


    If this happens, here''s a quick way to force it ''hess up. Near the beginning
    of your program, insert the following:


    ```

    use Carp qw(cluck verbose);

    $SIG{__DIE__} = sub { confess @_ };

    $SIG{__WARN__} = sub { cluck @_ };

    ```


    Now whenever your program calls die/croak or carp/warn it ends up calling confess
    or cluck instead, which have exactly the same effect except they print a stack
    trace of how they were called goes all the way back to your main program.


    > Perl is nothing if whimsical. Presumably in this case helps to dispel the air
    of morbidity surrounding the whole topic of death.


