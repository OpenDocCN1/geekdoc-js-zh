  md: 'information from inside a script, or if your top is restricted for root''s
    use only, use the program to get information about the process numbered pid. On
    SysVis systems, use ps -lp pid; on BSD systems, use ps up. (You can use a repeated
    -w flag on SYSV or aw flag to see more of the command line if it is truncated).


    In each case, there are two columns labeled SZ (or VS2) and RSS. Roughly speaking,
    these are, respectively, the virtual memory used by the process and the physical
    memory in use, both in kilobytes. Note that the memory allocated by a Unix process
    never decreases before it terminates; whenever it frees it makes it available
    only for the same process to reuse again later. (It is not returned to the free
    pool for other processes to use.)


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_120_0.png)


    A large and lengthy program of mine that reports its hourly growth has just displayed


    | USER PID %CPU %MEM SZ RSS TT S START |

    | COMMAND | | | | | | | |

    | peter 28679 51.9 48.5 35248 30072 ? S 08:42:00 279:33 [truncated] | | | | |
    | | |


    which shows its total memory used is 35 MB, 30 of which is in physical memory.
    (The output was dotted since the columns output by ps had actually run together.)
    Because it has problems running out of memory, this provides periodic statistics
    that tell me what it uses.


    If you want to monitor the progress of your Perl script, use $$ in place of pid:


    ```

    printf "Current virtual memory: %sk\n", unpack ''@24A5'', (ps u \$)[1];

    ```


    (The actual unpack template you have to use may be different for the ps. By using
    a subscript on the blocks in list context, we can ignore the header line output
    by ps.) You can use ps like this to see the actual amount of memory used by your
    program as it executes. (And remember that on Unix, process never decreases, no
    matter how much memory you free in your program. Your process will never get smaller
    than its largest memory allocation.)


    Under MacOS, access "About This Computer" from the Apple menu. A graphic displays
