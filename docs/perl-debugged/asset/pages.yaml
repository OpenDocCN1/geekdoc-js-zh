    # 12.3 Tips for the FORTRAN Programmer


    Perl code appears quite odd to a FORTRAN programmer. FORTRAN uses () (parentheses)
    exclusively for indices. An array element has the form ARRAY(1), a matrix element
    has the form MATEX(1,1), and a subroutine calls the form CALL ASUB (VALUE, VALUE),
    whereas Perl uses (parentheses), [] (brackets), and {} (braces) in various ways
    depending on data type and function. For instance, whereas $sa[1] refers to an
    element of an array, $sa{1} refers to a hash. Forgetting the proper uses of these
    separators is a common error for the novice experienced in FORTRAN.


