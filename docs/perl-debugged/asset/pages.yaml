    # A.2.15 Option Setting


    Several internal switches can be changed to affect different states.


    +   - option

    - [option?]

    - option=value


    An option lists all the current option settings; option? lists the setting for
    that option. The option may be set to true (1) with the first command and to value
    with the last. More than one query may be put on the line (space-separated) to
    affect multiple options at once. The list of possible options is in the next section.
    If an option value is a string containing spaces, put quotes around it.


    # A.2.16 Perl Code


    Anything that does not fit into the previous categories is executed as Perl code
    in the DB package.


