  md: '# Perl Debugged


    By Peter Scott, Ed Wright


    Publisher : Addison Wesley

    Pub Date : March 01, 2001

    ISBN: 0-201-70054-9

    Pages : 288


    +   Table of Contents


    > This book was a joy to read. It covered all sorts of techniques for debugging,
    including "defensive" paradigms that will eliminate bugs in the first place. As
    coach of the USA Programming Team, I find the most difficult thing to teach is
    debugging. This is the first time I''ve heard of that attacks the problem. It
    does a fine job. Please encourage these guys to write more."—Rob Kolstad


    Perl Debugged provides the expertise and solutions developers require for coding
    better, faster, and more reliably in Perl. Focusing on debugging, the most vexing
    aspect of programming in Perl, this example-rich reference and how-to minimize
    development, troubleshooting, and maintenance time resulting in the creation of
    elegant and error-free Perl code.


    Designed for the novice to intermediate software developer, Perl Debugged will
    save the programmer time and frustration in debugging programs. Based on the authors''
    extensive experience with the language, this book guides developers through the
    entire programming process, tackling the benefits, pitfalls, and pitfalls of Perl
    programming. Beginning with a guided tour of the Perl development, the book progresses
    to debugging, testing, and performance issues, and devotes a chapter to CGI programming
    in Perl. Throughout the book, the authors expose defensive paradigms for improving
    the accuracy and performance of Perl code. In addition, Perl Debugged includes
    Scott and Wright''s "Pearl of Wisdom" key ideas from each of the chapters, and
    an appendix containing a comprehensive listing of Perl debugger commands.


    In this exceptional reference and debugging guide, the authors cover every aspect
    of efficient Perl programming, including:


    +   - CGI programming-special tips for debugging this type of program

    - How to develop the proper mindset for developing and programming effectively
    in Perl

    - Perl "gotchas"how to understand them, work around them, and avoid them

    - "Antebugging"the authors rules of thumb on how to code defensively

    - The Perl debuggerthe authors'' guide to using this Perl built-in Common syntax
    errors and how to track their causes

    - Semantial errors-why code may appear correct but the programs do not work

    - How to improve the performance of resource-hungry programs

    - Tips and advice for programmers moving to Perl from other language'
