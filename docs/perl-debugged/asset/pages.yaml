    it probably wouldn''t.


    +   7. The parts you need to document are those that you took a long time to figure
    out. The amount of documenting accompanying any piece of code should be proportional
    to the time it took to create it.


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_28_0.png)


    I once spent about a month getting one number right in a program. It was a driver
