  md: 'Garbage collection in Perl does not happen asynchronously, but is entirely
    deterministic (except for the order in which objects are freed during global destruction
    at the end of a program). When the reference count on an object drops to zero,
    it is destroyed immediately.


    Although Java allows you to inherit from only one base class and multiple abstract
    classes, Perl makes no distinction between the two kinds of classes and says that
    you can do multiple inheritance as well. You may find that your fears about incestuous
    inheritance relationships do not come to pass, however.


    Reflection in Perl is accomplished by several methods. The `$obj` is implemented
    as a hash, with `keys %obj`. You can find out if it provides a given method `meth`
    with `$obj->cam(''meth'')`, and you can get a list of all the methods it supports
    by traversing the symbol table for the package including subroutines. Finally,
    you can construct its inheritance hierarchy by following the `@ISA` array or by
    using the CPAN module `Class::ISA`(http://cpan.org/search?dist=Class-ISA) which
    provides a friendly interface for that.


    Finalizer does not happen automatically in Perl either—the Perl term for `finalize`
    is `DESTROY`—and for the same reasons as in Java.


    In keeping with the Perl philosophy of permissiveness, there is no equivalent
    of `final` to prevent a method from being overrid in a derived class.


    # 12.5.2 Specific Tips for the C++ Programmer


    The lack of strong typing which probably seemed liberating to the C programmer
    seems offensive to you. (Perl seem irritatingly free-form until you grasp the
    ethos.)


    Perl allows overloading, although it isn''t as often as you think. `perld overload`
    tells you all about it.


    Because Perl doesn''t have strong typing, you won''t need to construct template
    classes for generic operations since they''re generic to begin with.


    We find the use of references in C++ to be annoying, because a change in a function
    prototype can change the actual value that is passed in a call to the function.
    If you actually like this, you can replicate it—a fashion—with Perl calls `subroutine
    prototypes`. They won''t look like prototypes to you—they''re more like patterns
    specifying the order and type of arguments that can be passed—one of the consequences
    is that you can construct a prototype that will allow a subroutine to be called
    with an array and receive a reference to that array where it would normally receive
    the list of all elements in the array.


    We suggest you not be too hasty to avail yourself of this feature, primarily because
    unlike C++, Perl does not require prototypes to be declared in order for a program
    to work, if yours somehow fail to get declared—or get declared too late—then the
    semantics of your program will change in wonderfully unpredictable ways.


