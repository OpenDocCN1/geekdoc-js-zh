  md: '# 1.1 Reality


    Unfortunately for the programming world (and programmers), software development
    continues after a project is declared finished (an increasingly arbitrary—and
    often inaccurate—label). Maintenance and debugging may consume more time than
    the original code, particularly because the person responsible for a program''s
    maintenance may not be one of the original programmers. This means we spend a
    lot of time trying to deduce the specifics of some algorithm we find in the code:
    how it was done, and why it does not work anymore.[23]


    > [1] A seminal work found in this respect is The Mythical Man-Month, by Fred
    Brooks (Addison-Wesley, 1995).


    The odds of creating a bug-free program are rather high. Anything larger than
    the Hello World design is fare for bugs. No recipe exists that, if followed, eliminates
    the possibility of bugs, but some practical rules have been developed:


    +   1. Reduce the places where a bug may be introduced. This means incorporating
    modular design, encapsulation, and unit testing.

    2. Identify the bug''s location. Detect: What shouldn''t happen but does, or happen
    but shouldn''t?

    3. Isolate the bug''s location—where do things go south? (This is the reason for
    the invention of debuggers).

    4. Determine the conditions that cause the bug. What activates it? Why haven''t
    you found it?

    5. Correct the bug—and always restore code.

    6. How did the bug get in the first place? If you made a typo and caught it 5
    minutes later on one thing, if the bug was caused by a logic error and survived
    to release, you have another problem. Find out how to improve your development
    process so that similar bugs are found much sooner.


    # 1.2 Why Perl?


    Chances are, if you use Perl know why you picked it and don''t need proselytizing.
    But additional ammunition never hurts—if you have to defend Perl up your management
    chain, well, Perl doesn''t have a megamutational conglomerate for billions of
    dollars into a marketing campaign[2]—so it falls to users like us to use its praises
    in practical ways.


    > [2] If you think we have a specific example in mind, you'' probably right.


    Whenever we have a problem to solve with a program, the solution first shows up
    in our mind, thought pictures and words, which most development methodologies
    then we enumerate as an English (or whatever our native language is) description
    of an algorithm before translating it into code. If the algorithm description
    were complete and unambiguous, it could be executed by a computer could understand
    our phraseology.[3] But no parser yet exists for free-form English algorithm descriptions,
    so we translate the description into some language a machine can comprehend.


    > [3] Of course, in practice, we always discover ambiguities and inefficiencies
    in the natural language description when we later it, but this can be viewed as
    just not writing the description adequately. We suspect this is so common because
    most of us are impatient to get with the coding anything.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Therein lies the rub: an ideal computer language imposes zero overhead on the
    programmer during implementation of the description. Such a thing doesn''t exist,
    so we want the language that minimizes the overhead. This can vary from task to
    task—if you''re writing a device driver, your best choice is quite likely to be
    near assembler. If you''re writing a graphical interface, at least part of the
    program is probably best attacked with a WYSIWYG editor that creates a layout
    specification.


    When writing a program, you are conscious of overhead every time you create a
    requirement on code to satisfy the demands of the language but not the problem.
    For example, in writing C and C++, a frequent example of this is how to allocate
    memory for dynamic structures and when to give it up.


    Perl imposes on the programmer smallest overhead of any language we have used
    for the vast majority of problems we have had to solve. At the expense of little
    learning, we can create very short programs in an incredibly brief time. Because
    the language overhead is small, changes in requirements don''t force changes in
    large unrelated sections of the code since a much more natural mapping from the
    English description of the solution to the Perl version exists. And because Perl
    expression of the solution is succinct, a reader can comprehend most of it at
    a glance.


    In many respects, Perl resembles English in its ability to resolve ambiguities
    favorably, its intuitive and orthogonal interfaces, and even how it sounds when
    read out loud.[6] Larry Wall, Perl''s creator, often states how his background
    in linguistics led him to consciously draw parallels.[7] Perl congenteri refers
    to this complex phenomenon as Perl''s DWIM (Do What I Mean).


    > [4] We don''t know what makes this Perl easier or harder to learn for nonnative
    English speakers. Research topic if there was one.


    > [5] You can find Larry''s exposition on his guiding principles at http://www.wall.org/~larry/natural.html


    If you''re in need of arguments of the kind that stay in favor of Perl, the Perl
    Success Stories page at http://perl.oreilly.com/news/success_stories.html. If
    you''re in need of arguments of the kind that sway scientists, the language comparison
    paper by Lutz Precht to be found at http://www.ipd.ira.uka.de/-precht/Biblio/icccpportTR.pdf.


    # 1.3 Know the Environment


    Knowledge of a language includes the practical meanings of errors in different
    environments. If a Unix program returns the segmentation fault (those of you on
    other systems may experience this variously as ABEND, %SYSTEM-F-ACCIO, or your
    machine freeing), an experienced programmer will first suspect a problem memory,
    often the result of a read or write to an array beyond the array bounds. Another
    error response, bus Error, often occurs when a subroutine or function has an improper
    argument list. Efficient error identification accompanies experience. This book
    tries to encapsulate experience with errors writing Perl programs.


    # 1.4 Know the Language'
