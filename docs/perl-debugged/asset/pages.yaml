  md: "As if that weren't enough—these people people really lazy—Perl comes with more\
    \ utilities to automate the construction of the test framework. The h2xs program\
    \ creates a skeleton directory tree for a new Perl module (which in a pinch could\
    \ be adapted to an application instead), including a file Makefile.PL and a skeleton\
    \ test script test.pl.\n\n> > Remember, that's a virtue.\n\nWhen you run this\
    \ file through perl (which you will need to modify somewhat to reflect additional\
    \ fields and dependencies that your module requires), it generates a much larger\
    \ Makefile (which is a size typical for today's projects). Makefile makes a test\
    \ that runs Test::Harness::runtests over test.pl. If you create a subdirectory\
    \ directory to create the myfile, make test includes every file in that directory\
    \ with a name ending in .t in the runtests.\n\nHere's a quick example to show\
    \ how these things play together. Let's say we're going to create a module that\
    \ exports a function to convert the names of colors to their numerical values.\
    \ On Unix systems there is a conversion table in the file rgb.txt, often stored\
    \ in /usr/lib/X11, so we'll just appropriate that for our use. Let's call this\
    \ package ColorConv, so we start with h2xs:\n\n```\n% h2xs -XA -n ColorConv\n\
    Writing ColorConv/ColorConv.pm\nWriting ColorConv/Makefile.PL\nWriting ColorConv/test.pl\n\
    Writing ColorConv/Changes\nWriting ColorConv/MANIFEST\n```\n\nThen we'll descend\
    \ into the new directory ColorConv and start editing ColorConv.pm. You'll notice\
    \ it's already populated with documentation stubs and a framework which we leave\
    \ out of the following version in which we show our code:\n\n```\npackage ColorConv;\n\
    use strict;\n\nmy %COLOR;\nif (open COLOR, '/usr/lib/X11/rgb.txt') {\n    while\
    \ (<COLOR>) {\n        next unless my ($r, $g, $b, $name) = /^\\s*(\\d+)\\s+(\\\
    d+)\\s+(\\d+)\\s+(.*)$/;\n        $name =~ tr/ \\d//;\n        $COLOR($lc $name)\
    \ = sprintf(\"%%02X%%02X%%02X\", $r, $g, $b);\n    }\n    close COLOR;\n} else\
    \ {\n    warn\n    \"\"Can't open color file ($!), translations impossible\\n\"\
    ;\n```"
