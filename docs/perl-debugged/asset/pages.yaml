    This might look familiar if you''ve been playing with the Data:Dummer module referenced
    in Chapter 5. In fact, the output of x is intently serious.


    You can see all of dynamic variables in a package (default:main:) with the V command.
    This is not as useful as it sounds, because the x or p commands, it won''t show
    you any lexical variables (which you declared with my). Yet you want to make any
    of your variables as lexical ones (per Perl of Wisdom #8). Unfortunately there
    is no (easy) way to dump out all the lexical variables in a package, so you''re
    reduced to printing the ones you know.


    A common problem is running off the end of the program and getting the Debugged
    program terminated message. At that point, all your variables have been destroyed.
    If you want to inspect the state of variables after the last line of your program
    has executed, add a dummy line (a 1 by itself work) so that you can set a breakpoint
    on it.


