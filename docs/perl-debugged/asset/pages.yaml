    \ debugger, this enables tracing when the loop encounters an input line containing\
    \ \"debug\". You can force the debugger to breakpoint by setting the variable\
    \ $DB::single to l, which also happens to provide a way you can debug code in\
    \ BEGIN blocks (which are otherwise executed before control is given to the debugger).\n\
    \n# 7.2.10 Optimization\n\nAlthough the Perl displays lines of code as it runs,\
    \ it's important to note that these are not what actually executes. Perl internally\
    \ executes its compiled opcode tree, which doesn't always have a contiguous mapping\
    \ to the lines of code typed, due to the processes of compilation and optimization.\
    \ If you have used interactive debuggers on C code in the past, you may have trouble\
    \ with this.\n\n> Debugging C programs on VAX/VMS, it was common for me to examine\
    \ an important variable only to get the message that the variable was not in memory\
    \ and had been \"optimized away.\"\n\n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_83_0.png)\n\
    \nPerl has an optimizer to do as good job as it can—in the short amount of time\
    \ people will wait for compilation—taking shortcuts in the code that you've given\
