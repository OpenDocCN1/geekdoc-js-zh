    # 7.3 Getting Graphical


    Programmers can choose from several graphical interfaces to the Perl debugger.
    We''ll describe two of the free alternatives. We will not provide much detail
    describing their use since they are graphical layers on top of Perl''s internal
    debugger; all you need to do is find the buttons to the commands just described.


    [6] There are a number of commercial (i.e., not free) products GUI debugger interfaces
    and other IDE functionality. We omitted them merely because we didn''t want to
    appear biased towards or against any vendor by inadvertently leaning one out.


    # 7.3.1 ddd


    ddd, developed by Andreas Zeller, a GNU graphical interface to manage debuggers,
    including Perl''s; obtain it from http://www.gnu.org/software/ddd/ddd.html. Windows
    port currently exists, but it builds easily on Linux when you download the requisite
    RPMs or package files. In Figure 7-1, the breakpoint, current statement pointer,
    and various displays.


