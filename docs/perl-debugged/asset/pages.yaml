  md: "```\n{\n  &($_[0]);\n}\n```\n\n# 3.2.1 Style\n\nThe only believable comment\
    \ to make about style is that you should have one. If you aren't already readily\
    \ attached to a particular style, read the perlstyle manual page and adopt the\
    \ one shown.\n\n+   - There's no excuse for not indenting property. I have seen\
