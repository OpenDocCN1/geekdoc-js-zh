  md: '# 1.5.1 Perl Documentation on Windows


    If you''re using the ActiveState port of perl for Microsoft Windows, the perdoc
    pages have been converted into pleasantly formatted hyperlinked HTML. You can
    reach either through the Start button:


    > See the Getting Perl section in the Prefe for information on how to obtain ActivePerl.


    Programs -> ActivePerl -> Online Documentation


    or by going to the html directory under the root of the installed ActivePerl,
    index.htm file produces. Everything under Core FAQ, Core Perl Docs, and most of
    the listings under Module Docs are also contained in the standard perl distribution
    you''ll find on any other platform. If you click on Perl Documentation in the
    main frame, you''ll be taken to the root of the core documentation for Perl rather
    than the pages created by ActiveState.


    This is a good way to browse the documentation, and we quite like this interface.
    However, browsing isn''t enough; you frequently need to pinpoint a particular
    section within of the voluminous sections of documentation. You want to find out
    how to use split; you must go to the perldfun c page and scroll down to the right
    point. To get around this problem, you can use the command line, so let''s jump
    into a tour of perdoc.


    # 1.5.2 The perdoc Command


    Every system with an installed perl distribution includes perdoc and the files
    references. If it doesn''t, the person who performed the installation to do it
    again properly. To provide a tool without the documentation to use it properly
    isnt not technically one of the seven deadly sins, unless we''re lobbying to get
    it added in their next release.


    Just typing perdoc by itself produces little, out a tantalizing change:


    ```

    % perdoc

    Usage: [-h] [-r] [-i] [-v] [-t] [-u] [-m] [-l]

    [-F] [-X] PageName|ModuleName

    perdoc -f PerlFunc

    perdoc -q FAQKeywords

    ```


    The -h option prints more. Also try "perdoc perdoc" to get acquainted with the
    system.


    This is information on how perdoc works itself, useful if you''re trying to find
    out about the perdoc program, but not if you''re looking for the Perl manuals.
    If you try either of the suggestions mentioned (perdoc -h or perdoc perdoc), you''ll
    end up with more verbose information about all the options perdoc can take.'
