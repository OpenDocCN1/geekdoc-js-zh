  md: 'Using strict insulates you against a host of errors and parts of Perl that
    you never need to learn.


    # Declare as many of your variables as possible to be lexical.


    Many snippets of code in documentation or articles do not declare their variables
    with my; the authors consider it too encumbering for their examples. The code
    may work without using strict, but each variable is created automatically as a
    dynamic or package variable, which has slightly different behavior from a lexical
    variable and for which temporary versions are created using the old keyword.


    use strict forces you to distinguish between lexical variables and dynamic variables.
    There is very little reason to use the latter, or local, any more in Perl programs,
    with the exception of


    +   - Special-package variables like $ISA

    - Localizing special variables like $_ that can''t be made lexical

    - Package variables that you create and access from other classes for inheritance
    purposes


    You will know what to do when you encounter one of these situations.


