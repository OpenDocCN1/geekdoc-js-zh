    \ no strict 'refs'.\n\nIn Perl, storing the name of a variable inside another\
    \ variable was the only way to carry out very common tasks (and required you also\
    \ use eval). But since the advent of hard references in Perl S, there is almost\
    \ no situation in which you will need to use a symbolic reference. However, there\
    \ may be many more occasions when you think that you need to. Let's examine some\
    \ of those.\n\nThe program that follows is a hypothetical grocer's inventory counter\
    \ that reads data consisting of a fruit or vegetable and the number of cases bought\
