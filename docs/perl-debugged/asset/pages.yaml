- img_proc: true
  md: 'Talking about resources for improving your expertise leads to us last touchy-feely
    concept: behaviors. If you have the right attitude and a good set of beliefs,
    you need to follow up with right behaviors, or if you prefer, "good habits." Check
    these out.


    # 2.3.1 Neatness


    Sloppy organization leads to a sloppy mindset, which leads to sloppy code. Never
    mind how tidy your office is; do you have a bunch of files called foo, tmp, fred,
    latest, latest2, and so lying around? Get rid of them or archive them somewhere
    with meaningful labels. Do you follow a consistent indentation style? If not,
    copy the style of a good programmer whose code you like until you feel like your
    personal taste. Just be consistent!


    # 2.3.2 Communication


    How are you with the requirements of the program you''re writing? Have you checked
    with the customer what mean by the various terms they used? Have you explained
    to them what assumptions you made in interpreting their requirements?


    # 2.3.3 Experimentation


    Time and一样 people, ask, "What would happen if I did X?" when they could actually
    try it in less time than it would to get the answer (which might be wrong). Don''t
    spend ages trying to second-guess the machine; find out. If there be fourth virtue
    in the Perl canon, it would be curiosity. If you''re not eager to find out what
    would happen in some odd situation caused by your fertile mind, then cultivate
    the attitude of curiosity, because people who move along the learning curve much
    faster than those who don''t.


    The way to feel comfortable experimenting is to know your boundaries. Many people
    are afraid of breaking the machine or destroying data. So learn which sorts of
    actions could do that, and which are safe. Find the safest playground you can.
    If you have a PC with some spare disk space, you can create extra partitions for
    a special version of your favorite operating system if you''re afraid of hurting
    something. A tool like Partition Magic will make this process easy. Then take
    something that works, and intentionally break it. Explore all that it can go wrong.
    If you''ve created a "throwaway" Linux on its own partitions, find out how hard
    it is to damage it. After enough of this kind of play, you''ll have an idea of
    what you can get with and be less anxious when you''re debugging in a real environment.


    Curiosity is an essential quality of the people who develop Perl and spend immense
    time trying the strongest pieces of code you''ve ever seen, in an attempt to explore
    the boundaries of Perl, and maybe to break it.


    # 2.3.4 Precision


    Perl works to accommodate different ways of thinking and different styles of programming.
    A laissez faire acceptance does not mean there aren''t rigorous definitions of
    the terminology of Perl itself, To communicate accurately with others and keep
    things straight in your mind, learn the proper terms for everything you use and
    be ruthless about keeping them straight. For instance, there is a huge difference
    between lists'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'and arrays in Perl; make sure you know what it is. When you say "system call,"
    do you mean a call that uses the operating system or a system() call? When you
    say "local variables," are you referring to variables declared with my or temporary
    copies of package variables declared with our or local?


    [1] See ''What is the difference between a list and an array?'' in perlqa.


    # 2.4 Improve Your Craft


    If you love what you''re doing, improving your skills comes naturally. If you
    don''t, doing it is an uphill battle. (Do you really need to do it if you don''t
    like it?) The avenues for getting better at what you do are numerous. Any time
    feel you''ve conquered the mountain, you might check out the Software Engineering
    Institute''s Capability Maturity Model for software development (SW-CMM), which
    delineates five levels that development groups may achieve in order of increasing
    effectiveness. Few groups have ever been certified at level 5. Something to aim
    for.


    http://www.sei.cmu.edu/cmm/cmm.html


    # 2.5 The Bottom Line


    If you''ve got good attitudes and beliefs, the right behaviors are easy to learn—they''re
    mostly details. So in the next chapter, we''ll get back to the left-brain mode
    of programming details and discuss useful behaviors.


