    Perl''s quoting rules will be a welcome relief—no more fighting to determine the
    combination of ''" to get what you want. The simple rule is: Interpolation (the
    Perl term for what you call parameter substitution) is determined only by the
    type of the outermost quotes. Instance, if you want to pass a variable that contain
    many spaces like the grep program, just say


    ```

    system grep -s ''$quote'' @files;

    ```


    and the double quoting around the whole command ensures that $quote and @files
    are interpolated. The former is quoted with single quotes, and the elements of
    the latter are space-separated by default, exactly what we want. If you want to
    embed$quote between double quotes instead Perl allows you to put a double quote
    in a double-quoted string by escaping it with a backslash, but there is a better
    solution using Perl''s quoting operator, which allows you to choose a different
    delimiter and thereby eliminate the need to backslash marks:


    ```

    system qq(grep - "$quote" @files);

