    # 7.2.5 Breakpointing: c, b, L


    An important feature of a debugger is the ability to allow your program to continue
    executing until some condition is met. The most common such condition is the debugger
    at a particular line in your source. You can tell the debugger to run until a
    particular number with the c (for condition) continue:


    ```

    main:(debug.pl:4) my @parole = qw(Sal Hello)

    DB<> c 16

    main::print_line(debug.pl:16): print "$_ Perl World\n"

    DB2>

    ```


    What the debugger did was a set-time breakpoint at line 16 and executed your code
    it got. If it had hit another breakpoint earlier, it would have stopped there.


    So what''s a breakpoint? It''s a marker set by you immediately before a line of
    code, invisible to anyone but the per debugger, causes it to halt when it gets
    there and return control to you with a debugger prompt. If you have a breakpoint
    at a line of code that gets printed out with one of the source examination commands
    listed earlier, you will see a b to it. It is analogous to putting a horse pill
    in the tail of bread breadcrumbs the mouse follows so the mouse gets indigestion
    and stops to take a breather (we really have to give up on this metaphor now).


    You set a breakpoint with the b command; the most useful forms are b line or b
    subroutine either at a line number or immediately upon entering a subroutine.
    To run until the next breakpoint, type c. To delete a breakpoint, use d line to
    delete the breakpoint at line number or or b to delete all breakpoints.


    In situations you won''t want to break the next time you hit a particular breakpoint,
    but only when some condition is true, like every hundredth time through a loop.
    You can add a third argument to b specifying a condition that must be true before
    the debugger will stop at the breakpoint. For example,'
