    # ## 9.3 Taking Exception to Yourself


    Having discussed how we handle exceptions generated by Perl, it''s time to talk
    about how we make exceptions of our own. You''re already used to the most basic
    exception-generating method, which is to call `die`. The arguments are printed,
    and your program exits with a nonzero return code. (Just which nonzero return
    code is documented in gray detail under `perldoc -f die`)


    You may see additional output by `die`, such as the line number of code it died.
    If it says `(eval 13)`, it''s telling you that it was executing the thirteenth
    call to `eval` and prints the line number relative to the evaluated code, not
    the program containing the eval. If it says `<FOO> chunk 42`, it means that you
    had the filehandle `FOO` open and had made 42 calls to the readline function (`<`)
    on it. If you didn''t change the S/$ variable so that readline reads more than
    one line at a time, never Perl will say `<FOO> line 42`


    Maybe you''re tired of tracking ''die...'' over every system call and just want
    it to happen automatically. As ver of 5.005_03, you can use Lionel Cons and Ilya
    Zakharevich''s `Fatal.pm` and just specify for which routines you want this magical
    behavior to occur. Just list them in the use statement:


    ```

    use Fatal qw(open mkdir chdir);

    ```


    The routines have you to do this for any function (including your own), it''s
    not useful for the ones like `chmod`, which returns the number of files modified
    (unless you''re ever going to modify one file at a time). Although you can''t
    use it on `exec` or `system` calls (for esoteric reasons), if you could, it wouldn''t
    be any good on `system` because that call returns 0 in the event of success.


    # ## 9.4 Playing Catch-Up


    Let''s say you want to go in the other direction and instead of turning errors
    into exceptions, you want to know when your program is about to die. The brute-force
    approach is to define a pseudo signal handler for `__DIE__`:


    ```

    $SIG{__DIE__} = sub { print "Igor lives!\n" };

    ```'
