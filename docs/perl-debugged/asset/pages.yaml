  md: '![](img/0a24c2fae51dbf173db8a36f6c94a0bd_118_0.png)


    Computer scientists talk knowledgeably "Turing-complete" programming languages,
    by which they mean a language that can be shown to be equivalent to a Turing machine
    and therefore provably to solve any computation that can be expressed as an algorithm.
    A Turing machine is a hypothetical device invented by Alan Turing, and consists
    of a long tape passing under a read/write head that is capable of reading and
    printing characters on the tape according to a table of rules specifying what
    to do.


    Unfortunately, no implementation of any programming language does or ever live
    up to the strict definition of "Turing-complete," since Turing specified that
    his machine was equipped with an infinitely long tape. He also specified that
    the machine was allowed an arbitrary amount of time to solve a problem, which
    is a luxury that few people outside of academia can afford.


    This chapter is about what to do when your finite resources are too finite. We''ll
    discuss how to react when you run out of time, memory, or disk space.


    # 11.1 Optimize for People, Resources Later


    Note that we didn''t say, "...to avoid running out of .... There''s a good reason
    for this: if you worry about it from the beginning, you''re optimizing for the
    wrong thing. While you''ll see a lot of coping from seasoned professionals on
    Usenet arguing that such-and-code isn''t as efficient as their latest mutation
    of it, understand that they''re coming from a place where the mind-bending code
    they''ve just written is as clear as anything else. More often than not, they''re
    coming up with these performance enhancements to make the problem more interesting
    for themselves.


    They would not disagree with what we''re about to give, however:'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Optimize your code for readability and maintainability first; make performance
    optimizations only after profiling of a working version demands it.


    We by far the most dominant resource cost in software today is not CPU speed,
    RAM, or disk space; the time spent by people developing, maintaining, inheriting,
    reading, porting, modifying, enhancing, understanding, or debugging an application
    is the most precious and scarce resource in information technology. Therefore
    our advice to this point has focused on how to develop applications to make the
    best use of that.


    Also, don''t underestimate the ability of Moore''s Law to help you. In other words,
    if you''re developing an application that will not be operational for another
    year and a half, by that time processors will be as fast as RAM, and drives will
    be twice as big. If you''re able to trade developer time for dollars (and it''s
    strange how many companies devalue their employees'' time in comparison to their
    hardware even though their bank account doesn''t know the difference) and the
    problem can be solved more cheaply by better hardware, get it.


    There will be plenty of opportunities to practice efficient programs sometimes
    you won''t have enough resources to run them, and then you will have to make them
    better. Whatever you are developing, don''t assume you know in advance what resource
    you run out of. The aforementioned seasoned professionals know that the ability
    of even the best of them to predict such things is notoriously unreliable.[19]


    > [19] This is not to say that there aren''t when resources are fairly obvious,
    if you''re archiving the entire World Wide Web, you should probably be concerned
    about disk space before you start. (If you are archiving the entire World Wide
    Web using, please drop us a line: we have a few questions to ask you.)


    We will show how you can optimize your programs for speed, memory, or disk space.
    However, these are not independent variables; frequently there are trade-offs
    (e.g., gaining memory at the expense of disk space). Equally common are parallel
    lines: For instance, as you improve your code, memory usage may go down and execution
    speed may go up due to fewer memory accesses.


    # 11.2 Benchmark It!


    Because it''s so hard to tell by looking at the code where the bottlenecks are
    (especially since they may depending on your hardware configuration), you have
    to be able to measure them objectively. You may have no recourse to use the native
    tools of your operating system to measure virtual memory usage in particular.
    (See Peer of Wilson #29.) In this respect confess we are far more experienced
    on the various Unix platforms than on the Macintosh or Windows.[20]


    > [20] We tried measuring size on Windows 98 using a free tool called procview
    and were baffled by the results. It appeared that every process out of a couple
    of dozen was at least 20 MB.


    # 11.2.1 Measuring Memory Usage


    The top program available on most Unix variants is very good for determining how
    much processor time and virtual memory are being used by current processes. To
    get the same'
