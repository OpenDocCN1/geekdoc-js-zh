  md: 'leaves (although it might motivate some of them to improve their skills). Only
    a wise manager can decide what''s right for them. If you''re managing a team that
    harbors a prima donna, try suggesting this suggestion to that person that the
    greatest of all is the one who can present an advanced idiom in a way that makes
    it understandable to novices.[1]


    > > [1] If you pooch-poch this suggestion, refer to the writings of physicist
    Richard Feynman, who is probably one of heroes, and who believed that any physical
    principle was truly understood could be explained at the high school level.


    The one you can offer is to use standard idioms and styles whenever. If you code
    something that is familiar to other people, even if they don''t work at your business
    they can, or other team members can learn the idiom as it is shared through books
    and the Internet. A reviewer you''ve coded something for a well-known idiom exists,
    find out what idiom is. The benefit in this respect of frequent Internet newsgroups
    and mailing lists is.


    If you''re creating large systems in Perl, they should almost certainly be broken
    down object-oriented lines. It will be much easier to understand each object class
    one at a time.


    You might also consider the CPAN module B::Fathom. This generates a score representing
    a measure of complexity of the code it is fed.


    # 6.2 Unit Testing


    Perl shines at unit testing. Although there''s no empirical data to prove this,
    conversational evidence suggests that most Perl programs are short enough that
    unit testing is the same as system testing. People often report that their programs
    shrink by 90% when converted from C to Perl (our experience bears out). A 1000-line
    C program requires more heavy-duty testing than a 100-line Perl program.


    # 6.2.1 The One-Liner


    Although not strictly in the category of unit testing, we must mention the utility
    of the one-liner. Several flags in Perl make it possible for you to test an idiom
    without having to write a script, just entering the code on the command line.
    The first of these is:


    +   - e Execute code as though it were in a script. Put quotes around code on
    Unix to prevent the shell from being confused by metacharacters, and use double
    quotes on DOS.


    We can combine this with the -w flag if we want to enable warnings. Let''s say
    that we want to check on way printf 0.5.


    ```

    % perl -we ''printf"%1.1f %1.f\n", $+.5, $+.5 for 1..''

    1.5 2

    2.5 2

    3.5 4

    4.5 4

    ```


    (No, that''s not a mistake; that''s the IEEE floating point standard it should
    work.)'
