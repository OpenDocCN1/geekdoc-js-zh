  md: "Just as every country has its customs, so does every computer language. We\
    \ use a language best when we adopt its customs rather than pretend we know better\
    \ and try to force this new language to fit our old prejudices.\n\n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_9_0.png)\n\
    \nFind out the common Perl idioms and practice their use. There are generally\
    \ good reasons why they're common. If nothing else, adopting them will make your\
    \ code more maintainable since more people will know what it means.\n\nThese idioms\
    \ come from the simple two-element \"open or die\":\n\n```\nopen FH, $file or\
    \ die \"Can't open $file: $!\\n\"\n```\n\nto the mind-boggling (at first sight)\
    \ Schwartzian Transform:\n\n```\n@sorted = map $_[0],\nsort { $a->[1] <=> $b->[1]\
    \ }\nmap { $_ sortable_func(_) }\n@unsorted;\n```\n\nThe first idiom becomes second\
    \ nature (our fingers type it by themselves), although on first learning the language\
    \ one might come up instead with:\n\n```\nif (open FH, $file)\n{\n  ...\n}\nelse\n\
    {\n  die \"Unable to open $file: $!\\n\"\n}\n```\n\nIt's not hard to see why the\
    \ idiom comes. Briefly, here's how it works:open returns false if it fails, and\
    \ the or operator is short-circuiting, which means it doesn't evaluate its second\
    \ argument if the first one is true, because the value of A or B is fixed as soon\
    \ as know A is true.\n\nThe second idiom provides an efficient way of sorting\
    \ items that need manipulation before they can be sorted in an \"ASCIIbetical\"\
    \ or numeric collating sequence. When you learn this,"
