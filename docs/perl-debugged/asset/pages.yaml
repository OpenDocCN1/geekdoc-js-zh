  md: 'Perl program can vary dramatically from person to person. Our goal is to help
    you minimize the development, debugging, and maintenance time you need for your
    own Perl programs.


    Do not take the title of this book to imply we are debugging Perl itself in these
    pages. What few bugs exist in the Perl interpreter are a matter of minute excite
    (or exotic minutiae), rapidly squashed by the fine crew sweeping Perl. A more
    accurate title would have been Debugging Your Perl Programs, but that loses the
    "unplugged".


    We wrote this book because we wanted you to see the development process at work.
    Most books on programming contain crafted crafted honed through sweaty practice
    to work perfectly and stand as mute testimony to the elegant style of our author.
    They don''t show you the ugly, irritating process into to get the examples into
    shape; yet those examples not in fact existence fully formed from the forehead
    of their creator. Because you will experience this same process when developing
    your programs, we want to guide you through and describe various ways around the
    embarrassment, humiliation, and surprising pitfalls that stand between you and
    Great Programming.


    Within this book, we describe the most common and annoying mistakes a new programmer
    might, and then the details to identify and correct these bugs and any others.
    You should have some knowledge of Perl; several tutorials exist to free us from
    onerous responsibility of explaining scalars and arrays and hashes and the like.
    This preface includes a few references to some of the most useful of tutorials.


    We will not attempt to define a proper programming "style". Style is unique as
    an individual—but a few rules create a common reference so that we can easily
    read each''s programs.


    Neither is this "how to program" book. Although we will probe into the mechanics
    and underpinnings of programming at times, it is not our intention to inculcate
    a complete newcomer with the mindset of the programmer''s discipline.


    # Who Are You?


    If you''ve been programming in Perl anywhere from a week to a year and want to
    speed up your development cycle, this book is for you. We''ll also address some
    issues related to developing a team. This book is intended to assist those who
    have started learning Perl by providing practical advice on development practices.


    # What This Book Covers


    Here''s what you''ll find in the rest of this book:


    +   - Chapter 1: Introduction and a guided tour of the Perl documentation

    - Chapter 2: Developing the right mindset for programming and developing effectively

    - Chapter 3: "Gotchas" in Perl: Working your way around some of the tricky things
    to understand or get right in Perl programming

    - Chapter 4: Antibugging: How to code defensively

    - Chapter 5: How to instrument your code

    - Chapter 6: How to test your Perl programs

    - Chapter 7: A tour of the perl debugger: our guide to using this built-in tool'
