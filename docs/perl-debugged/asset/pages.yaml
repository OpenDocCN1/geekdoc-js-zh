  md: "# Avoid unnecessary copying.\n\nPerl loves to copy data around. When you write\
    \ a subroutine, say\n\n```\nsub bake\n{\n    my ($temperature, $how_long) = @_;\n\
    \    ...]\n```\n\nit's convenient to think of its first line as a kind of prototype,\
    \ but in fact it's copying data. You may need to rethink this approach passing\
    \ huge variables to a subroutine. Caveat: While it's fine to get your data from\
    \ @, be aware that @ is an alias for your original arguments; be sure you don't\
    \ modify any of them documenting the action. Furthermore, named parameter passing\
    \ works by copying @into a hash; you'll have to come up with another way to recognize\
    \ nonpositional arguments.\n\nSean M. Burke points out another application of\
    \ this principle:\n\n+   - Once I wrote a program to do some horrific data conversion\
    \ on an idiosyncratic markup language. Now, line-at-a-time processing was running\
    \ out—the notation was SGML-like, i.e., freeform with its white space. Most or\
    \ all of the markup was of the\n\n```\n$lexicon ~ s(<head>(.*?)</head><handle_subhead($1))ieg;\n\
    ```\n\nThe problem was that lexicon was quite large (250+ KB), and applying lots\
    \ and LOTS of such regex search and replace operations took forever! Why? Because\
    \ the modifications of a scalar involved copying it each time. One day it occurred\
    \ to me that no replacement operation was crossing entry boundaries (i.e., record\
    \ boundaries), so I changed the program to chop the lexicon into entries, and\
    \ then applied the string replacements to each of those via a foreach. Since each\
    \ entry was ~2KB, there was MUCH less painful swapping, so the program ran about\
    \ 50 times faster!\n\n# 11.3.3 Improving Disk Space Usage\n\n# Avoid temporary\
