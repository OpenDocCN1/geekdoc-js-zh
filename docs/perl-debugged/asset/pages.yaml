    # 4.2 The Hall of the Precedence


    Perl has a complicated precedence ordering; it helps to be able to look it quickly
    (fortunately, the first thing out of perldoc perl). We reproduce that table here
    (Table 4-1) we will be referring to it.


    | Table 4-1. Perl Operator Precedence and Associativity |

    | Associativity | Terms and list operators (leftward) |

    |---|---|n| Left | |

    | Left | -> -- |

    | Nonassoc | ++ -- |

    | Right | * -- |

    | Right | ! ~ and unary + and - |

    | Left | ~= ! ~ |'
