    from the mundane + * / to the magical powers of applying postincrement (++) to
    strings. There are some entries you might not expect to find here: the use of
    commas to separate list members, the different ways of quoting strings and how
    interpolation works inside them, how the m (match) and s/// (substitute) operate
    (but the regular expressions they take as an argument are documented under perire),
    the use of backticks to capture program output, reading lines from filehandles,
    and the mysteries of floating point numbers.


    +   * perire: This is where you can find how to write regular expressions. Perl
    has easily the most powerful, ''featureful'' implementation of regular expressions
    anywhere. This section covers all the details from the most basic to the most
    advanced; read as far as you can until your head actually exploding and leave
    the rest for when you need it.


    +   * perl: When you want to know how to implement multidimensional arrays, or
    complex data structures this is the place to come. "tol" stands for "lists of
    lists", which strictly speaking is a bit nicer since it really means "arrays or
    hashes of references to arrays" but is considered more euphonic. If you''ve come
    from Pascal, Fortran, or C are wondering where records or structures are, look
    no further. If you want to know all about how to make and use the references that
    enables lists to be built, see perref.


    +   * persub: This section contains everything you want to know about how to write
    your own subroutines (or procedures) in Perl and far far, including entries you
    might not expect to find, on the local command and typelogs. Pick the parts you
    need judiciously and save the eye-glazing sections for later.


    We''ve left out many of the sections to avoid overwhelming you at this stage.
    Head back to perdoc when you feel up to see the more advanced ones wished.


    One advanced section we failed to list is perfunc. The reason is that rarely in
    your career will you need to peruse perfunc in linear order. Because it contains
