    # 10.1 A Bit Illogical


    Perl has several ways of saying and or:


    | Table 10-1. And, Or, and XOR Operators in Perl |

    | Operation | AND | OR | XOR |

    | --- | --- | --- | --- |

    | bitwise (non-short-circuiting) | & | | ^ |

    | logical (high precedence) | && | | |

    | logical (low precedence) | and | or | xor |


    (There is no high-precedence logical XOR operator.) The consequences of picking
    an operator from the wrong one are usually annoying mistakes like


    ```

    open (FH, $file) | die "Error opening file: $!\";

    ```


    which dies or not the open succeeds, because the | operator is strictly a bitwise
    arithmetic or string operator, which evaluates both of its operands so it can
    return the result of ORing its bits together. In this case, you want |, which
    is a logical operator that evaluates its left-hand side and returns it if true;
    otherwise it evaluates and returns its right-hand side.'
