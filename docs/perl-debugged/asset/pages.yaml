    # Chapter 2. The Zen of Perl Developing


    > "Wild nights are my glory."

    —Mrs. Whatsit in A Wrinkle in Time, by Madeleine L''Engle


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_16_0.png)


    We''ve come to realize there are two sides to programming: the left-brain, formal
    minutiae of creating smart code; and the right-brain, soft, touchy-feely stuff
    that goes on in your head.


    Most programmers would rather ignore the touchy-feely stuff because it''s Just
    Not Their Thing. However, we''ve found that it''s more important than the rational
    left-brain information, because it affects everything you do. So we''re going
    to cover the soft stuff first, because it''s what happens first in your head.
    This leads us to a touchy-feely Perl of Wisdom:'
  merge: -1
