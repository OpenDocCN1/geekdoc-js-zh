  md: "Don't think it faster to get your program working, go back and insert the use\
    \ strict, and clean up the resulting errors. It's much slower, for two reasons:\
    \ first, developing without strictness results in errors being harder to find\
    \ and taking longer to fix. Second, when you add strictness to a lengthy program\
    \ that has never been strict before, the number of errors printed is likely to\
    \ be enormous, and fixing them probably not be trivial.\n\nThis is not an exaggeration,\
    \ particularly if your nonstrict code has graduated to an operational environment.\
    \ You may not have the option to shut things down while you recode and reread.\n\
    \n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_32_0.png)\n\nWhat makes use strict\
    \ our friend is that most of the objections it raises prevent a program that is\
    \ not following good practices from ever running.(This is called raising a compile-time\
    \ exception. Although there is one class of errors it catches only at run-time.)\n\
    \nThe biggest favor strict does for you is to force you to declare all your variables\
    \ with a my statement, or let it complain that you referenced a variable without\
    \ an explicit package name. In other words, variables not declared with my belong\
    \ to a family of variables you need to use; so, in fact, that use strict requires\
    \ you to refer to such variables by their full names, which include the packages\
    \ they live in.\n\nWhy is this such huge favor? Because it guards against the\
    \ ravages of the common type. Consider this:\n\n```\nmy enrolled_so_far = 0;\n\
    foreach my $student (@students)\n  foreach my $class (keys %registry)\n    enrolled_so_far++,\
    \ last\n    if registry($class)($student);\n\nprint \"Number of errors so far\
    \ = $enrolled_so_far\\n\";\n```\n\nWithout use strict, this happily runs, producing\
    \ the answer \"0\" no matter what the data. Because of the tiny typo in the innermost\
    \ loop, perl increments a different variable called enrolled_so_far, which automatically\
    \ creates in this different family of variables we've been talking about. But\
    \ under use strict, perl will refuse to run this code since enrolled_so_far has\
    \ neither been introduced with a my statement nor is it qualified with a package\
    \ name.\n\n> Per Perl, there are always exceptions (except when there aren't),\
    \ and you can prevent perl from complaining about unqualified package variables\
    \ with the our or vars pragmas."
