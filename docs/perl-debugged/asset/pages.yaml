    # 4.2.2 Arithmetic on keys


    Suppose you have a %h and you want to find out how many elements are in it, so
    you type:


    ```

    print "Number of elements: " . keys %h . "\n";

    ```


    reasoning with impeccable logic that the dots will force keys into scalar context
    and return the number of keys in %h instead of the list of them. However, Perl
    responds with


    Type of arg 1 to keys must be hash (not concatenation)


    A quick glance at Table 4-1 shows us that "named operators" rank below the . operator
    in precedence; therefore Perl parses the statement as


    ```

    print "Number of elements: " . keys ("%h\n");

    ```


    unreasonably, makes no more sense to Perl than the second to do us. We can easily
    by leaving the first in out and the second one into a comma:


    ```

    print "Number of elements: " . keys %h, "\n";

    ```


    (This is evaluated as the low-precedence "list operators (rightward)" element
    from Table 4-1). We can generalize this to all the other named operators (functions
    prototyped to take a single argument), of course. Peruse the perfunc manual page
    to find out what those are.


    # 4.3 Regular Expressions


    You may be accustomed to using s// New Beginning/ to insert some text at the beginning
    of the current line in some applications. In Perl (as in sed), the empty expression
    doesn''t match a zero-length substring; it matches whatever the previous expression
    matched. If there isn''t a regular expression, Perl and sed part company: Perl
    treats it as matching the beginning of the string; sed says it''s an error.


