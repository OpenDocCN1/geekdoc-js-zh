    R


    The R command exits the debugger (so does end-of-file on the terminal). The R
    command attempts to rerun the program with the state changes you made preserved.
    Some state may be lost; breakpoints, history, actions, option settings, and the
    -w, -I and -e command-line options will be preserved.


    # A.2.3 Stepping


    ```

    n [expr]

    s [expr]

    <CR>

    r

    ```


    n and s single step (over or into subroutine calls respectively). If expr is provided,
    then execute and step through that first. A carriage return by itself repeats
    the last n or s; if there wasn''t one, it does nothing. r executes code until
    the last statement in the current subroutine.


    # A.2.4 Examining Package Data


    ```

    V [package vars]

    X [vars]

    S [[!pattern]

    m expr

    ```


    v lists variables in package (default: current package), vars can be a space-separated
    list. X is equivalent to V current_package, S lists subroutines that match (or
    with !, don''t match) the given pattern.


    Global variables %ENV do not live in a particular package and won''t be dumped
    with the V or X commands; use instead.


    m evaluates expr in list context and interprets the first element as either a
    class name or an object; it prints the methods that can be called on it (the subroutines
    in its package and ancestor packages).


    # A.2.5 Examining Package or Lexical Data


    ```

    p expr

    x expr

    ```


    p evaluates and prints expr. x evaluates (in list context) and dumps (in a Data::Dumper-style
    format) expr.


