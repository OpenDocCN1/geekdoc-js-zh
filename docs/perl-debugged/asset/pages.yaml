  md: 'Note by the way that the -e flag has the last one before code; you can''t type
    perl -ew...


    +   - -p -n: Execute code for every line from the input, and either print $_ automatically
    when done (-p) or not (-n).


    Say you want to the ASCII codes generated by certain keys on your keyboard; you
    could type


    ```

    % perl -pe /s/(./" \. $1/ge

    ```


    and then hit a key by a newline to see its ASCII value.


    +   - -l (the ''letter'', not the number): Append an automatic newline to print
    statements. When combined with -n or -p, also automatically chop the newline character
    off the input.


    Let''s say you want to find users listed in a Unix /etc/passwd file have directories
    under/home:


    ```

    % perl -nle /s:.*/; print -d "home/$_" /etc/passwd

    ```


    This could be used as a first stage in a pipeline of commands that then go on
    to do other things with its results. You might want a Perl program as the final
    stage of a pipeline that reports how many lines it has:


    ```

    $ ... | perl -nle |BEGIN($SIG{ALRM}) = \nsub{ print $.; alarm 10; }; \nalarm 10
    }

    ```


    In this case, nothing at all is being executed in the loop for each line of input!


    The -l flag is particularly useful in one-liners or test programs in which you
    have a handful of print statements and save the trouble of typing \n in all of
    them. However, don''t leave it in production code; setting a global flag like
    this the behavior of all print statements and will produce unpleasant results
    using modules that don''t expect it (such as CGI.pm and Benchmark).


    +   - -Module: Perform a use module before executing any code.


    You can use this to impose strictness on your one-liners, and also as a quick
    test to see if a module you have installed:


    ```

    % perl -MTime::HiRes -e 0

    ```


    This prints nothing if the Time::HiRes module is installed but complains if it
    isn''t.


    +   - -c: This gives you the ability to check the syntax of a Perl program without
    running it. Because so much error checking is deferred until run-time in Perl,'
