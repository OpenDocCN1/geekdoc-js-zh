    # 7.2.3 Examining Source: l, -, w, .


    Sometimes you want more of the context of your program than just the current line.

    The following commands show you parts of your source code:


    | | List successive windows of source code starting from the current line about
    to be executed. |

    | x+y | List y+1 lines of source starting from line x. |

    | x-y | List source lines x through y. |

    | - | List successive windows of source code before the current line. |

    | w | List a window of lines around the current line. |

    | | List a window of lines around line. |

    | line | Reset pointer for window listings to current line. |


    Source lines are breakable (i.e., can have a breakpoint inserted before them—see
    the

    following section) have a colon at the end of a line number.


