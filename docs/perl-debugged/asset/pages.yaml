  md: "You're not required to stick to one idiom, mind you. It's common for people\
    \ to choose different ones according to the fanatical way they think about the\
    \ operation they're expressing.\n\nYou have to be besides true/false checking\
    \ return codes if you want to write quality programs. For instance, in the first\
    \ example in the preceding list, the `copy function from `File::Copy` also returns\
    \ true or false and $! on failure. It would be a strange sort of program that\
    \ wouldn't have a reason to ensure that this had happened.\n\nSome functions return\
    \ something true/false but still set $, for example, `chmod`, `chown`, and `unlink`\
    \ each take a list of files to operate upon, return the number of files actually\
    \ modified, and if there were any errors, set $! to the last one. (Unfortunately\
    \ it's not possible to tell which file(s) had problems without checking manually.)\n\
    \n# Know your operating system.\n\nA student in one of my classes encountered\
    \ the following. The assignment was to create a temporary directory and a bunch\
    \ of files in it, perform some operations on them, and then to remove the files\
    \ and the directory. Part of his code looked like this:\n\n![](img/0a24c2fae51dbf173db8a36f6c94a0bd_105_0.png)\n\
    \n```\nforeach $file (@files)\n{\n    open OUT,\\>$file or die \"Can't open $file:\
    \ $!\\n\"\n    # write something to the file\n}\n```\n\n```\n# Open the files\
    \ in the directory and do\n# with the contents\n```\n\n```\ndie \"Unlink didn't\
    \ get everything: $!\\n\"\n    unlink @files == @files;\nchdir '..' or die \"\
    Couldn't go up a level: $!\\n\"\nrmdir $tmpdir or die \"Couldn't rmdir $tmpdir:\
    \ $!\"\n```\n\nEvery return code checked, but the `rmdir` failed, and $! said,\
    \ \"Directory not empty.\" When he looked in the directory, there were no files\
    \ there. What was going wrong?\n\nThe problem was that he had omitted the `close`\
    \ statement from the loop that created the files. Whenever Perl encounters an\
    \ `open` statement using an existing filehandle, it closes filehandle for you,\
    \ so that all the last file had already been closed. On Unix, if any process has\
    \ a file open, it is not removed by `unlink` until the file is closed, so the\
    \ last file in `@files` the program exited, which meant that at the time the `rmdir`\
    \ was executed. But then all its open filehandles were closed; at that point the\
    \ file was removed, destroying the evidence."
