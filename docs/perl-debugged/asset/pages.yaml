  md: '# Chapter 8. Syntax Errors


    "Fire bad!"


    —Frankenstein''s monster in a fit of homicidal frustration


    "Typos bad!"


    —The first programmer, same emotion


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_88_0.png)


    We realize we''re tempting scorn by devoting a chapter to a subject as prosaic
    as typos, but someone must do these dirty jobs. Why? Consider this extract from
    a shift.com article by Clive Thompson:[12]


    > [1] http://www.shift.com/shiftsd/SiteMap/frames/mag7.asp?searchfor=7.bomquad


    Still, by standard, speed kills quality. Consider the research currently conducted
    by Watts Humphrey, a 45-year veteran of the industry and a fellow of the Software
    Engineering Institute. By studying programmers as they work, we have found that
