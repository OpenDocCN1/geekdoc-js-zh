    # 4.4.4 Secret Prototypes


    Our next pitfalls concerns the "secret" function prototypes assigned to built-in
    functions. If you execute the following:


    ```

    my @arglist = ("% %s has %d %s\n");

    push @arglist, ''aunt'', 3, ''cats'';

    printf @arglist;

    print @arglist;

    ```


    (not that you would do something strange, but we''re illustrating something that
    you might come across more circuitously), the result is


    # My aunt has 3 cats


    What''s going on? The first line is right, so what happened with the second one?


    sprintf() has an implicit prototype. If you''d written sprintf yourself,[] you
    have begun it with


    > [] Always an enjoyable way to spend a rainy afternoon.


    ```

    sub sprintf($)

    ```


    which is a somewhat contentious feature of Perl that allows you to emulate the
    ability of built-in functions to dispatch with parentheses around arguments if
    you wish so.


    Well, it allows you to emulate some built-in functions, but we''ll get to that.


    This prototype says that sprintf takes a scalar (either a variable or a literal
    expression) followed by a list. The list will therefore be interpreted in scalar
    context. And the first (and only) argument we passed in our example was @arglist,
    which in a scalar context yields the number of elements in the array: 4.'
