  md: 'The pktdb debugger (see [Chapter 7](#)) has a way to debug CGI programs as
    they run on the server, which is as close as it comes to having your cake and
    eating it too. The following conditions must be met:


    +   - The server has to have Tk, PerlTk, and pktdb installed.

    - The debug client has to be running on an X Window System server. This machine
    doesn''t have to be the same as the one running the browser making the request,
    however.

    - The environment variable PTDB_DISPLAY on the server has to be set to the display
    of the debug client.

    - You have to be able to accomplish your debugging without interrupting the flow
    of output long enough for the browser to time out. After that, you may be able
    to continue the debugging program, but you won''t see what it outputs.


    Because PTDB_DISPLAY has to be set very early in the program invocation, it is
    no good setting it in `$ENV` or even in a BEGIN block. The easiest way to circumvent
    this is to wrap your program in a shell script, like so:


    ```

    #!/bin/sh

    PTDB_DISPLAY=client.perldebugged.com:0

    export PTDB_DISPLAY

    /usr/bin/perl -T~d:pktdb <<END_OF_CGI_PROGRAM

    ```


    Perl program appears here

    END_OF_CGI_PROGRAM


    Note that we had to include the -T and -d options when we ran perl. Leaving them
    to the # ! line doesn''t work.


