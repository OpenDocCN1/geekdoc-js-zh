  md: "# 5.3 Raise the Flag\n\nOur option is so far binary: either we print a tracing\
    \ statement or we don't. But suppose we want to discriminate and print some tracing\
    \ statements at some times, and others at other times. Perhaps we want to preserve\
    \ our earliest tracing statements; even though we suspect they've become redundant\
    \ that the code them is working, we want to keep them around. Fair enough. We\
    \ can create classes of tracing statement and assign a number to each one:\n\n\
    | Number | Statement Class |\n|---|---|\n| 1 | The very tracing statements we\
    \ entered |\n| 2 | The next tracing statements we entered, which we want to keep\
    \ distinct |\n| 4 | Another set of statements that are distinct from 1 and 2 |\n\
    \nAnd so on. The numbering scheme is not random: by using successive powers of\
    \ two, it allows us to specify any combination of flags in a single number. Now\
    \ the DEBUG constant is no longer Boolean:\n\n> > As long as we don't exceed the\
    \ number of bits in an integer.\n\n```\nuse constant DEBUG -> 1 ; 4; # Choose\
    \ classes 1 and 4\nsub dbgprt ($0)\n# code\n\ndbgprt 2, \"DTD schema = $dtd\\\
    n\";\n\n# more code ...\n\nsub dbgprt ($0)\n{\n my class = shift;\n warn ***DEBUG\
    \ \" @_ if DEBUG & $class;\n}\n```\n\nBy logically ORing() the numbers that represent\
    \ the classes we want printed, we can create one that represents a set. Now each\
    \ tracing statement passes the debug class number as the first parameter to dbgprt,\
    \ which locally ANDs it with the DEBUG constant; if the result is not zero, class\
    \ number was requested, and therefore the statement will print.\n\nThese aren't\
    \ terribly useful debug class identifiers, though. They might mean something to\
    \ us, but chances they won't help the person who takes over our code. And as your\
    \ code matters, rather than assign debug classes in chronological order, you should\
    \ distinguish them on the basis of some local functionality instead. So let's\
    \ use symbolic names instead, and figure out a title for each class. Let's say\
    \ we're writing a shopping cart program that interfaces with CGI scripts and a\
