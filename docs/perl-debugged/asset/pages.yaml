- img_proc: true
  md: '# First know yourself; then your programs will be easier to know.


    Go out and about among programmers, and soon you discover some are better than
    others—a lot better. It has been a source of fascination to us as to why there
    is such variation in performance—we''re talking about orders of magnitude differences
    in speed, accuracy, and maintainability between the best and the worst for any
    task—and we''ve come to learn that what of difference is to attitudes, beliefs,
    and behaviors that set them apart the rest.


    Yes, talent and intelligence count for a lot, but less than you might think. Yes,
    knowledge and experience are required for creating quality programs, but they
    can be hampered by poor attitudes and limiting beliefs.


    > This isn''t just psychable: I see it the time in my classes. It''s common to
    see people with a problem freeze at the keyboard, unable to take any action. They''re
    afraid that if they experiment, they''ll break something. They''re suffering from
    a limiting belief that the computer is more fragile than it really is.


    This is good news! Wise people know that they can change their attitudes, beliefs,
    and behaviors, and know how.


    Where does Perl fit in here? Perl is designed to put your convenience above abstract
    notions of aesthetics or elegance. Perl is designed to make it as easy as possible
    for you to go from an idea for solving a problem to creating the solution, no
    matter computing background you have from. There are so many Ways To Do It in
    Perl as Perl is a polyglot. Other computer languages are like your eighth-grade
    French teacher:


    > You: Miss, there''s a fire in the stockroom!


    > The: "Ah-ah-ah-ah! Et, maintenant en Français, s''il vous plaît!


    Whereas Perl will go out of its way to understand you:


    > You: "O, frauline mine, yok you''re saying there''s a fire over there ... I
    get help!


    > Perl: "Sounds like you''re saying there''s a fire over there ... I''ll get help!


    Let''s look at which attitudes, beliefs, and behaviors serve us.


    # 2.1 Attitudes


    You don''t have relationships with people (although some people spend so long
    at their keyboards that we might wonder whether they have even those); you have
    relationships with everything you interact with, and includes your computer and
    your programs. And if you'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'don''t think you have a relationship, or believe you have a relationship with
    them, then you have the unconscious "this-isn''t-a-relationship" relationship.


    This isn''t just New Age-pocus; this is at the core of how successful you are
    when you get behind a keyboard. What''s your first reaction when you do that?
    Somewhere on a scale between "Oh boy—I can''t believe I paid for this!" and "Rats.
    Work again. Can''t wait for the ball game on Saturday.


    This isn''t just measuring your relationship, it''s measuring your enthusiasm;
    and your enthusiasm is directly related to how you do.


    Sometimes enthusiasm is caused by fear, instead of passion—when your boss tells
    you to finish a project by tomorrow or you''re fired, you would call your emotional
    state enthusiastic. This is nearly as as effective as enthusiasm deriving from
    passion, but it''s a poor substitute—the resulting stress, anger, and resentment
    will take their toll. So here''s our first Perl of Wisdom on enthusiasm:


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_18_0.png)


    # Motivate yourself by what you want to move toward, not what you want to get
    away from.


    In this line of business you are generally in enough demand that you don''t have
    to continue working for a boss who uses threats to motivate you; but if it happens,
    don''t bring that anger and fear to the keyboard (because it''s harder to think
    clearly those emotions). Think instead what it is that your job brings you what
    makes it good for the thing: the health plan that keeps your family well, the
    money that keeps you fed and clothed, the opportunity to create beautiful things.
    Don''t you feel better when you look at it that way?


    Perl has some commentary about attitudes as well (The Perl documentation waxes
    quite philosophical, theoretical, and at times). It tells us that the three principal
    virtues of a programmer are laziness, hubris, and patience. Why?


    +   Laziness: Doing the same thing more than once is the sign of bad code design.
    If you''re naturally lazy, you''ll naturally balk at the idea of repeating yourself.

    Hubris: A fancy word for egotistical pride. Let''s face it; you need choputzba
    to be a programmer. Perl knows in fact, that you can debug someone whose nobody
    known and unknown, takes confidence bordering on recklessness. The main reason
    so that many people do it for the ego boost from creating something (This is not
    to denigrate the well thought out concept of "elegant programming" promulgated
    by Gerald Weinberg—but you''ll notice it caught everywhere. Perl programmers tend
    to be more robotic than this!

    Patience: You''re not doing this for the sake of typing at a keyboard; you want
    to create something. Perl was created to satisfy the thousands of people who had
    grown tired of spending so much of their development time satisfying the demands
    of their language rather than the requirements of their solution. So turn on patience
    fire, and start noticing when you''re doing things that you shouldn''t have to.
    If you see how a machine could be doing something you''re doing, get the machine
    to do it if it saves time in the long run. Life''s too short to waste on pointless
    typing.'
