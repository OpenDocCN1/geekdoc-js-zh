  md: '> [1] Aside from proofs-of-correctness; but again, proofs-of-correctness never
    seem to be attached to anything longer than 10 lines anyway.


    The most basic run-time error is that the program refuses to execute at all. If
    you''ve checking your program''s syntax with Perl''s -c switch, you might have
    a program that has no errors but you get the error "Permission denied" when you
    run it. This means that you''re running on Unix and have not yet set the execution
    permission for your program.

    You might also get "Command not found" even though you can see the program is!
    Relax; this just means you have a typo in the first line of your program or the
    "shebang", and it''s saying that Perl can''t find the program you put there. You
    might have prel instead of perl again (or left out the space before the -w flag,
    which this author just did).

    While we''re at it, you might also get an error like .recognized switch:- which
    can drive you crazy until you discover that it''s running from a program with
    DOS-style line terminations on Unix. The message "is with a tool like dosuznik
    or perl -bak e=''s/\CM//"


    The distinction between an error and an exception may have been hitherto overlooked
    in this book, but at this point we need to make it clear. An error means something
    went wrong; instance a system may return a value indicating that it can''t do
    what you asked. A good program institutes some error handling at this point and
    checks the return code (more or less). The program is still running.


    An exception occurs (is "thrown", in the lingo) when some code declares that something
    intolerable has happened and Perl is simply not allowing you to continue your
    program unless you know how to handle (or "catch") the exception. At this point,
    your program could be in the middle of arbitrarily deep nesting of subroutine
    calls and (). It ceases executing wherever it is, and starts to percolate up this
    stack looking at each level for anything declared that catch this exception. If
    it gets all the way to top without finding a handler, it executes a default exception
    handler, which in Perl''s cases means printing a message with die and exiting.


    Run-time exceptions from Perl may be built in, caused by strict, or generated
    by you. The -w flag can cause a run-time warning to be displayed, but your program
    will continue executing. If you''ve followed good coding practices, you should
    be worried about this possibility, since it might indicate Perl is working with
    bad data (data that should be defined but isn''t). If you want to make Perl halts
    when such a warning is generated, you can this pseudo signal handler the beginning
    of your program


    > [2] This is one of the times when the difference between warn and print_STDERR
    becomes apparent: the former is trapped by that signal handler, the latter is
    not.


    ```

    local $SIG{WARN} = sub ( die $_[0] )

    ```


    and Perl exits after printing the warning.


