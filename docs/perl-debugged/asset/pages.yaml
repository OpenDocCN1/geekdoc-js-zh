    \ Coverage Analysis\n\nAt this point we might want to determine whether we are\
    \ really testing all the code in our application or some is missing. The CPAN\
    \ module Devel::Coverage by Randy J. does this. It's a debugger that counts the\
    \ number of times each executable line of code is visited. You can look for any\
    \ that has a count of zero.\n\n> ⁶ Since it can't distinguish multiple statements\
    \ on the same line, don't put multiple statements on the same line if one might\
    \ be executed but not another.\n\nHere's an example. (In practice, this tool would\
