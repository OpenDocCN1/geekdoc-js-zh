    # # 1.5 Online Documentation


    Fortunately, the documentation included with perl covers practically everything
    you could want to know about Perl. Practically everything you could want to know
    about Perl is an awful yet. With some guidance, you can quickly learn how to navigate
    around it and save yourself goals of time compared to the alternatives. The documentation
    is in the POD (Plain Old Documentation) format, a very simple markup language
    that is of Perl.


    Knowing your way around the documentation is an essential debugging tool. Because
    this is an important point, we call attention to it with a device we use throughout
    this book for highlighting such tips, popularly called Perl of Wisdom:


    +   Know the documentation. Be able to find anything in it.


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_10_0.png)


    (We have collected all these tips into a list in Appendix B for quick reference.)
    The most blatant example of the consequences of ignoring this advice in recent
    years was the fur over the behavior of the localtime function after 1999. Many
    people looked at the returned year and incorrectly assumed it was formed from
    the last two digits of the actual year, so they wrote windowing code or tacked
    “19” in front of the real year. Unfortunately, according to the Perl documentation,


    > ... $year is the number of years since 1900, that is, $year is 123 in 2023,
    and not simply the last two digits of the year. If you assume it is, then you
    create non-Y2K compliant programs—and you wouldn’t want to do that, would you?


    As you can tell, some text was added by members who were becoming frustrated with
    the lack of attention this explanation was receiving.


    ![](img/0a24c2fae51dbf173db8a36f6c94a0bd_10_1.png)


    > In 1998 I called to fix a program I had written over 10 years earlier on a VMS
    machine that was failing Y2K testing. I was surprised to see I had writing windowing
    code the returned year in a C struct contained the last two digits, and as a result
    the program was printing dates in the year “1900”. After I fixed the program,
    I found the original VMS manual I had used when writing it, and looked up localtime.
    Lo and behold, it announced that the year field contained the last two digits!
    (Such a bug would not survive long in Perl’s documentation thanks to the open
    source process controlling it.)'
