    # 9.2 Notifiers


    Adobe Photoshop besides the notion of Event Listeners, but uses Notifiers instead
    – it''s the very same concept; you don''t need the Script Events dialog either.
    The Notifiers collection is a property of the Application, and can be used independently
    (if Photoshop JS Reference, page 138). The Script Managers dialog is nothing but
    a visual tool that helps adding, and removing, simple Notifiers – the reason why
    I call simple will be evident in a short while.


    Listening to the ''select'' event is performed with code this way:


    ```

    // First make sure that Notifiers are enabled

    app.notifiersEnabled = true;

    // Pointer to the JS callback file

    var handlerFile = File(File.fileName).path + ''/resources/alert.js'';

    // Adding a notifier

    app.notifiers.add(''select'', handlerFile);

    ```


    The notifiersEnabled property is the equivalent of the “Enable Events to Run Script/Actions”
    checkbox; the notifiers collection has the add() method, which accepts the Event
    charID/stringID (''select''), a pointer to the .js File callback, and the Event
    Class specifier (here ''document''). Run this code, then select a different tool
    and the alert(), from the alert.js handler file will pop up.


    # Caveats


    > TomRuark explained in aForum that we should preferably usecharIDs over StringIDs.
    I''ve found that on one side it''s that we can directly use either stringIDs or
    charIDs (e.g. ''select'' and ''Slct'') as parameters of the notifiers.add() function;
    on the other side, this duality doesn''t apply. say, for ''make'' and ''Mk *,
    or ''open'' and ''Opn *'': only the later works. hashed typeIDs would also sometimes
    work, e.g.


    ```

    app.notifiers.add(charIDToTypeId(''Slct''), handlerFile);

    ```


    For these reasons, contrary to my will, I will use charIDs throughout this Chapter.'
