  md: '# Climbing the DOM


    +   - You see that the Collection index starts from 0 in the topmost position
    (Layer 2) and increases top to bottom, so the Background has an index of 2. It''s
    not linked to any actual Layer: layers[0] is always the topmost, even if it''s
    substituted with a different one in C, i.e., it''s a positional attribute. Also,
    being zero-based, there are three layers, but of course none is layers[3] – something
    to keep in mind when: the Collection''s length property is available for that
    purpose, see line 22.

    - The id is a property of the layer, not the position. It is a unique identifier
    for the layer, no duplicates are created. Each time you create a new layer, it
    is consumed and assigned to it. Delete layer, that id is gone forever. Create
    a new layer, and the next available id is assigned. You might guess why, in B,
    the Background layer''s id changes: when you unlock, you''re deleting Background
    while creating a new layer, so a new id must be assigned. To the best of my knowledge,
    the only exception to rule of unambiguous ids is when a layer is turned to Background
    – then, it acquires the 1 id, which happens to be reserved.

    - The itemid is a layer''s position indicator, and in this very case, it corresponds
    to the Collection index in reverse, not zero-based.


    Please note that (line 17) the layer''s move() method expects two parameters:
    the reference element, in this case layer2, and the element placement. Among the
    available constants, I picked ElementPlacement.PLACEBEFORE, which confirms that,
    in Scripting, layers are counted from top to bottom (and not versa): a layer on
    top of the stack comes before the one below.


