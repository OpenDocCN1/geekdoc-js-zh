    # Plug-in Setup


    Since we''ll make of Clarifai API, you need to ed into the plug-in folder and
    install their Node.js

    module:


    +   1 npm install clarifai --save-dev


    If, besides what I''ll cover here, you need further information on the API, you
    can follow their

    excellent documentation.


    # Plug-in Architecture


    Decomposing the feature into smaller tasks, our plug-in will:


    +   1. Create a new item in the Generator submenu.

    2. Setup the Clarifai application (keep handy your API Key).

    3. Setup the menu click handler so that it starts the entire Face Detection and
    Blurring routine.


    When the user clicks the menu, the main function getAndBlurFaces() will:


    +   1. Retrieve the Document information, needed for the next step.

    2. Get the Document Pixmap, scaled to fit 1000px for the wider side.

    3. Save a temporary .png file.

    4. Read the temporary .png from disk, converting to a Base64 string, and send
    it to Clarifai.

    5. Parse the JSON response from Clarifai: if faces are detected, parse the Array
    of coordinates to

    the ExtendScript engine.

    6. In the JSX, create a rectangular selection using the top, bottom, right coordinates,
    and blur

    it - repeat for as many face items that have been found.


    That''s it. Let''s inspect the entire Generator plug-in code, using the following
    photo by Emma

    Goldsmith as our sample image.'
