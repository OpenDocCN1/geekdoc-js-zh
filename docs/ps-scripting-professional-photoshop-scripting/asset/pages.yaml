    # 5.13 Operator overloading, Constants and UnitValue


    To conclude the list of the ExtendScript language peculiar characteristics, there
    are three features to mention.


    Operator overloading in Classes is about extending and/or overriding the default
    behavior of mathematics or boolean operators (JS Tools guide p. 235-236). Say
    for instance that you need a Rect class: you''re allowed to define the behavior
    of the + operator so that you can actually add two Rect instances and your composite
    area as the returned value.'
