    : \"https://www.lipsum.com/\",\n        // \"creditname\": \"James Wilson\"\n\
    \      }\n    }\n    var lipsum = res.feed.lipsum\n    var csInterface = new CSInterface();\n\
    \    csInterface.addEventListener('alertLorem(' + lipsum + '')');\n  }).fail(function(res)\
    \ {\n    console.log(\"ERROR!\", res);\n});\n```\n\nEverything's wrapped in an\
    \ IFFE (Immediately Invoked Function Expression), which you've already met in\
    \ the ScriptUI example). With JQuery: the first (line 5-8) listens for the 'input'\
    \ Event^26 of the Slider (the element id is equal to 'slider0') and it is used\
    \ to bind the Slider value with the text input - so that when you draw the Slider\
    \ you can get immediate feedback on the value.\n\nThe second handler (line 10)\
    \ listens to the Generate Button's 'click', and generates a generateLorem() named\
    \ function that I've declared separately (lines 12-34). In, I use of jQuery's\
    \ .get() method^27 to send a GET request to https://lipsum.com/feed/jsonendpoint^28,\
    \ passing as parameters key-value pairs: 'what', used to specify whether you want\
    \ 'words', or 'paras' (paragraphs), 'bytes', etc, and 'amount', which I fill with\
    \ the slider value to get number of words.\n\nSince .get() is asynchronous, the\
    \ .done() and .fail() methods are called only when the transfer is completed (or\
    \ it fails) - it depends on how much the Time slider takes to answer your request.\
    \ The callback function of .done() (lines 17-30) extracts the lipsum property\
    \ from\n\n^26The change event fires only when you release the Slider; to have\
    \ a true 'changing' event, you must listen for 'input' in the HTML world.\n\n\
    ^27Please note that the $ symbol represents two different things in jQuery and\
