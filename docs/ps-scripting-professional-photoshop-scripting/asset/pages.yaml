    \ doc.artLayers.length;\nfor (var i = 0; i < len; i++) {\n  if (doc.artLayers[i].visible)\
    \ {\n    doc.artLayers[i].remove();\n  }\n}\n```\n\nIn ESTK, if you click right\
    \ a line number, a red circle appears: it's a breaking point. Next time you run\
    \ the script (the green button), it would halt waiting for your input, highlighting\
    \ the line with yellow.\n\n![](img/b87c0ab2175809458d63805e15cab800_63_0.png)\n\
    \n# ESTK Debugging\n\nWhile time is suspended, you're allowed to write statements\
    \ in the Code editor to extract information, say, look at the Layer's name. Alternatively,\
    \ look in the \"DataBrowser\" panel, where you're presented with a hierarchical\
    \ view of the status of all properties and available methods.\nIncontinue,youhaveoptions,itheramemusitembuttons(the\
    \ onesidePlay, Pause and Stop): \"Debug > Step Into\" will evaluate the current\
    \ line, and if a function is invoked, you'll be teleported inside that; \"Debug\
    \ > Step Out\" is used to completely complete the execution of said function (skipping\
    \ all line-by-line walk), and return to the end of the line called it; \"Debug\
    \ > Step Over\", similarly to Step Into, evaluates the current line but will call\
    \ the function (if there is any) and present you with its returned value jumping\
    \ inside the function. Alternatively, \"Debug > Run\" interrupts the debugging\
    \ and goes on with the codebusiness, until another breaking point, if any, is\
    \ reached."
