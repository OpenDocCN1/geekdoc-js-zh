  md: '# Content at a glance


    1. Introduction to Scripting is an overview of the different technologies available
    to Photoshop developers, and the peculiarities of scripting. I give you basic
    information on the ExtendScript language, as well as reference documentation and
    links to third-party resources.


    2. Writing Scripts deals with some practical aspects of coding, such as file types,
    default folders, code editors and plugins. I cover the Adobe ExtendScript Toolkit,
    other documentationresources, and how to run scripts.


    3. Hello World by Examples is primarily dedicated to beginners with little or
    no experience at all in programming, features of mild yet increasing difficulty,
    essential language elements are described: from variables and objects to arrays
    and collections, conditionals and loops, the dot and new operator, classes, instances,
    methods, properties, etc. The problems are approached with a great emphasis on
    the reasoning, commenting both the code and thoroughly; things can go wrong, and
    they often do! You must learn how to manage coding errors and logic flaws, understand
    the debugging process and know where to look for information.


    4. Climbing the DOM introduces the concept of the Document Object Model: how the
    Script objects are created and hierarchically ordered, and how to access them.
    I discuss the difference between Collections, Classes, and Instances, their properties
    and methods. An exercise on Algorithmic Art is the pretext to deal with the coordinate
