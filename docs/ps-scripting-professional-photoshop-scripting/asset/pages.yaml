    # Startup Scripts folders


    Since I''ve just mentioned some of them, let fully address this topic before going
    any further. Adobe provides us with places to store .jsx files that are going
    to be automatically executed when an application (PS, ID, BR, etc.) are launched.


    As third-party developers, we are advised not to use the system folders and put
    our startup scripts elsewhere. Restricting the list to just Photoshop and Bridge,
    we can identify some alternatives (first Mac, then Windows):


    +   - /Users/<user>/Library/Application Support/Adobe/Startup Scripts CC/Adobe
    Photoshop

    - /Users/<user>/Library/Application Support/Adobe/Bridge CC 2019/Startup Scripts


