    # ## 7.7 Coding Conventions


    So I''ve used a standard way of building the Dialog, but there are several different
    styles developers may want to use. Let''s take as an example this very simple
    GUI:


    Variables based style


    ```

    var d = new Window(''dialog'');

    d.text = ''Coding Conventions'';

    d.orientation = ''column'';

    d.alignChildren = [''fill'', ''fill''];

    var p = d.add(''panel'');

    p.orientation = ''row'';

    p.text = ''Radius'';

    var s = p.add(''slider'');

    s.size = [200,30];

    s.value = 10;

    var e = p.add(''edittext'', undefined, ''10'');

    var g = d.add(''group'');

    g.alignChildren = [''right'', ''fill''];

    var c = g.add(''checkbox'');

    c.alignment = [''left'', ''fill''];

    c.text = ''Preview'';

    c.value = true;

    var cb = g.add(''button'', undefined, ''Cancel'');

    var ob = g.add(''button'', undefined, ''Ok'');

    d.show();

    ```


    As a side note, I might have been influenced by an article Why I Do Not Use Meaningful
    Variable Names (Anymore) written by the InDesign developer Marc Autret, since
    I''ve started using minimal names myself too – even if I''t have such a strict
    naming convention as Marc has. However, that''s not the point of this section.'
