  md: "# Working with Metadata\n\n```\n// Load the XMP Library\nif (ExternalObject.AdobeXMPScript\
    \ == undefined) {\n    ExternalObject.AdobeXMPScript = new ExternalObject('lib:AdobeXMPScript');\n\
    }\n\nvar pic = File(File.$fileName).path + \n    '/resources/cocomeria.tif');\n\
    \n// A new XMPFile object\nvar xmpFile = new XMPFile(pic.fname,\n    XMPConst.FILE_TIFF,\n\
    \    XMPConst.OPEN_FOR_READ);\n\n// A XMPMeta object\nvar xmpMeta = xmpFile.getXMP();\n\
    \n// Serializing as an XML String\nvar metaString = xmpMeta.serialize();\n$_.writeln(metaString);\n\
    ```\n\nAfter loading the XMP Library, I stored the image in the pic variable,\
    \ and created a new XMPFile(), passing as a parameter the image's path, the file\
    \ kind (one of the available from the XMPConst—when you're not sure, use XMPConst.UNKNOWN),\
    \ and another constant related to the open options (see the entry in the list,\
    \ page 268). I'm opening a .tif in a read-only mode.\n\nWhat you're read is a\
    \ XMPFile instance, from which you extract a XMPMeta object via the getXMP() method.\
    \ Finally, this XMPMeta object can be serialized (turned into a long XML string)\
    \ via serialize(), for you to inspect:\n\n```\n<xmpmeta xmlns=\"http://ns.adobe.com/meta/\"\
    \ x:mpk=\"Adobe XMP Core 5.6-c140 79.160451,2017\\n02/05/06-01:08:21\">\n<rdf:RDF\
    \ xmlns:rdf=\"http://www.w3.org/1999/02/rdf-syntax-ns#\">\n<rdf:Description about=\"\
    \">\n    xmlns:xmp=\"http://ns.adobe.com/xap/1/0/\"\n    xmlns:aux=\"http://ns.adobe.com/exif/1/0/aux/\"\
    \n    xmlns:exif=\"http://ns.adobe.com/cipa/exif/1.0/\"\n    xmlns:adobe=\"http://ns.adobe.com/adobe/1.0/\"\
