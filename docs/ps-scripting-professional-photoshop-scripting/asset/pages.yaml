    ![](img/b87c0ab2175809458d63805e15cab800_166_0.png)


    When I have a historical perspective on AM implementation, I''ve briefly touched
    the idea that Descriptors associated with events should also contain information
    about the event''s Target. In some circumstances, it''s safe to consider it implied
    (like in the Black & White or Hue/Saturation examples), e.g., the active selection,
    of the active layer, of the active document. PS goes up until it finds something
    suitable to perform the Action: if there''s no active selection, it tries with
    the active layer.


    However, in other circumstances (like events such as ''select''), the question
    cannot be evaded. What''s the event target, what am I selecting after?


    The ActionReference purpose is precisely to define a path through the Photoshop
    hierarchy; in other words, AR is stored within a Descriptor''s key as a mean to
    keep track of the event''s Target.


    The AR is instantiated from the ActionReference Class, and the actual reference
    created using one of the available put(). methods. In our case, Listener uses
    .putName() to insert "New BG" (the name of the layer I selected myself in my file)
    as the "layer" key. which suggests that the Target of the "select" Action will
    be... a layer named "New BG". If you look at the JS Reference (page 44), you''ll
    see a variety of other methods which are usually quite self-explanatory in terms
    of what they are used for defining a Target, e.g. putInteger(), etc.


    Having the layer name as our TargetReference, we must putReference(), i.e., the
    AR within a key of the d1 Descriptor. However, why is the key that AR equal to
    "null"? Hard to understand. My educated guess is that in AM land, Targets can
    sometimes be implicit, hence the "null" key. Of weak, right? Perhaps. The excellent
    news is that both "null" and "target" lead to the same typeID:


    ```

    s2("null") === s2("target"); // true!

    ```'
