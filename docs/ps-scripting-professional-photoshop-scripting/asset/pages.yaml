  md: '# 1.1 Photoshop Extensibility overview


    I’d like to borrow an illustration that appears in the book “Power, Speed & Automation
    with Adobe Photoshop”, by Geoff Scott and Jeffrey Tranberry, that I’ve repurposed
    below:


    ![](img/b87c0ab2175809458d63805e15cab800_19_0.png)


    The idea here is that the larger your knowledge base, the more you squeeze out
    of Photoshop: Adobe engineers have access to the original source code so that
    they can create and shape native features out of nothing. On the other side of
    the spectrum, a total beginner may tweak the interface selecting the appropriate
    workspace, hiding unnecessary complexity. What interests us now is everything
    in the middle, specifically from Actions onwards.


    # Actions


    You may be more familiar with the word Macro, which describes the same concept:
    somebody records a series of manually performed steps in Photoshop, working on
    one or more documents, then saves the process into an Action (in turn is saved
    within an Action Set .atn file). Download the Action on your computer, and play
    back on a single document: it’ll be like having a lightning fast, stamina-unlimited
    version of the Action’s ready to work for you, repeating those brilliant steps
    at your will.


    Starting from Photoshop CS6+, the application has been upgraded to feature Action’s
    Conditional Statements, E.g., IF Current Layer is a Shape Layer THEN play the
    Action that says, rasterize the Layer ELSE apply distortion filter, etc. The Actions
    domain as we knew it, empowering authors to a quasi-scripting level. Quasi. Not
    really, but hey.


