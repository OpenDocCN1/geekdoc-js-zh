  md: '# compile.jsxdemo


    ```

    #target ''JsBlindLib.jsxinc''

    #include ''JsBlind.jsxinc''

    // This code refers to JsxBlind V1.x,

    // it implies that JsxBlindLib.jsxinc is available

    var currentFolder = File($fileName).path;

    /* Read the content, plain JSX */

    var originalFile = new File(currentFolder + "/main.jsx");

    originalFile.open("r");

    var originalString=originalFile.read();

    originalFile.close();

    /* Compile JSXBLIND */

    var jsxBlind = app.compile(originalString);

    /* Run JSXBLIND */

    JsxBlind.keyValueNames = 1;

    JsxBlind.muteAlerts = 1;

    var jsxBlindString = JsxBlind(originalString);

    var blindedFile = File(currentFolder + "/main.blind.jsx");

    blindedFile.open("w");

    blindedFile.write(jsxBlindString);

    lblindedFile.close();

    ```


    To run the script, make sure ESTK is closed, in the Terminal (Mac) or Command
    Prompt (Windows) make sure you''re in the same folder and:


    > "/Applications/Adobe ExtendScript Toolkit CC/ExtendScript Toolkit.app/Contents/MacOS\/ExtendScript
    Toolkit" -cmd ./compile.jsx"

    "C:\Program Files (x86)\Adobe\Adobe ExtendScript Toolkit CC\ExtendScript Toolkit.exe\
    -cmd "compile.jsx"


    The command should launch and run ESTK, run the compile.jsx script, output the
    main.blind.js file and quit ESTK.


