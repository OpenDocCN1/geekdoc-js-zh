    checkbox in the Actions palette. In my experience this is rarely wanted: usually,
    routines don''t require, nor need user''s interaction after a script is launched:
    I rely on some sort of GUI to let the user input values, but under some circumstances,
    it may be handy to let the native dialog pop up. Please note that some events
    do not have any dialog (a Selection event), in which case the action is performed
    silently.


    +   - DialogModes.ERROR doesn''t require user interaction and relies upon the
    data passed by the ActionDescriptor. In either case the AD is incomplete (some
    key/values are missing) or the values are out of range, default values are used.
    Conversely, an alert will display the error if something goes wrong - say, you''re
    trying to apply the UnSharpMask filter on a hidden layer.

    - DialogModes.NO is an entirely silent mode: no dialogs will ever show; in case
    of troubles, an error is thrown.


    # 6.6 Building AM functions


    At this point we''re ready to reach the first stage of Action Manager enlightenment
    borrowing code from the ScriptListener log, refactoring it, and create functions
    to fill DOM gaps with Action Manager.


    As an example, I''ve chosen a Photoshop command that is not covered in the DOM:
    image > Adjustments > Black & White (I checked in the Photoshop JS Reference,
    and it''s mentioned anywhere).


    I''ve left all the parameters, and I''ve ticked the Tint checkbox. Usually, when
    I tackle such tasks – wrapping code with a function that is easier to use I run
    the command with default values, and I implement the ScriptListener log. Then,
    I try to modify all the parameters, and I check against the log as a result extra
    code lines have been written or not.


    ![](img/b87c0ab2175809458d63805e15cab800_148_0.png)


    In some cases this leads to a massive AM generation: if you don''t believe it,
    try to open the Hue/Saturation adjustment, and tweak Hue Saturation and Lightness
    of all the seven colors (Master, Reds, Yellow, etc.), including changes in all
    the colors (the rainbow bar). It''s an ActionManager tsunami.


    If you want to fill DOM gaps with your functions, you either have to spend much
    time creating the most inclusive possible way, or to cover the features in that
    moment,


    > "The refactoring is theoretically optional, but you don''t want to skip it.
    If you happen to move the movie "Karate Kid" (1984), it''s the equivalent of Miyagi''s
    "Wax on, Wax off"'
