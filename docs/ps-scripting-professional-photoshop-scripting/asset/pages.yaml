    # 6.10 ActionReference


    With Scripting, can you tell whether the currently active document''s bit depth
    is 8, 16 or 32 bits? This one might catch you unaware: there''s no Action to perform
    to get a Scripting Listener log, nor is there a DOM equivalent. I''ll tell you.


    ```

    var ref = new ActionReference();

