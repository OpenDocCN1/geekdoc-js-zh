  md: '# Course presentation


    # Why I wrote this book


    Back in 2014 I started a blog post series about my daily fight with Photoshop
    Scripting with Course (book and videos), as a way to share with other developers
    my experiences, and beginners (that is: me, a few months earlier) finding their
    way through the first. In late 2015 I looked back at the twenty-something strong
    collection of posts and decided that time was ready for me to re-elaborate examples,
    types, code chunks, workarounds, and everything I discovered on my daily fight
    with with Panels, into a more proper form. I started authoring the Adobe Photoshop
    HTML Panels Development, published in March 2016, which proved to be a success
    in filling gaps of the somehow erratic Adobe''s documentation. My primary goal
    was to let those approaching the topic for the first time master the basics, give
    them an unfined minefield, and cover lots of the more advanced subjects on the
    edge between Creative Cloud apps extensibility and web development for those who
    wanted to dig deeper.


    One year later from the HTML Panels first draft, I have the same attitude. I''ve
    been part of the scripting community for some years now, and I owe to the amazingly
    talented people in more of what I know. Moreover, I''ve been a post with Adobe''s
    submitting bugs and following the scripting implementation over too many Photoshop
    versions - so I''ve possibly a good grasp of the script''s many facets, even if
    I''m far from mastering each and one of them. Knowledge is a cumulative process,
    and this course would like to go in the direction of learning the community''s
    expertise at all levels. (say) InDesign, I have the feeling that we, have a lower
    average understanding of scripting, with a smaller elite of developers really
    mastering it - whereas the InDesign community has been able to bring more people
    up to average higher level - and they have peak-talents as well, of course. This
    is a fact more reflection of the importance one Adobe team has given over the
    years of scripting, compared to the other? Is InDesign inherently apt to be scripted?
    Just a random fact? I can say!


    What I know for sure is that if you need or approach Photoshop scripting (especially
    as a total newcomer) the learning curve is steeply. You have language problems,
    debugging problems, DOM problems, ActionManager problems, backward compatibility
    problems, self-confidence, and alcohol problems, all mixed together.


    When initially got into scripting, back in two-thousand-two, I started fresh.
    I had previous Fortran and ActionScript experience, but by the time I put my hands
    on Photoshop writing to write some code, I had forgotten every of them: my problem-solving
    skills were just awful. My self-taught scripting curriculum hasn''t been linear
    at all: first, a lot of trial and error


    > It may also be that Photoshop has a larger script developers base, therefore
    the lower average level – but it''s just a supposition.'
