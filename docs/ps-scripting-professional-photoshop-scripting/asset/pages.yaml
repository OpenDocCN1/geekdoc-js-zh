    Lastly, I got rid of all the variable declarations, replacing them where they’re
    used. E.g. that vars line 5, 6, and 7 in the above snippet got to the putDouble()
    of line 8; vars 9 and 10 go in to the putDouble() of line 11, etc.


    ```

    function s2t(s) { return app.stringIDToTypeID(s) }

    var d = new ActionDescriptor();

    d.putDouble(s2t("amount"), s2t("percentUnit"), 300.000000);

    d.putDouble(s2t("radius"), s2t("pixelsUnit"), 1.000000);

    d.putInteger(s2t("threshold"), 5);

    executeAction(s2t("unsharpMask"), d, DialogModes.NO);

    ```


    Now we’re getting somewhere! From this points on, I’ll use this kind of transformation,
    and take it for granted.


    > Several tools automatically format AM code. The first one has xbyter’s “LastLogEntry”
