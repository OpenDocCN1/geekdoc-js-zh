  md: '# # 9. Events


    In Chapter 6, we''ve seen how ActionManager is based upon an underlying net of
    Events, that are fired when actions are performed and have associated Descriptors.
    There is one other technique that allows us to exploit this system, and respond
    to those Events in a preciseway.


    # ## 9.1 Script Events Manager


    Little known to the majority of users, in the "File > Scripts" menu''s an item
    called "Script Events Manager", which opens the following dialog.


    ![](img/b87c0ab2175809458d63805e15cab800_311_0.png)


    The GUI is slightly confusing, but the general idea is that we are allowed to
    define Event Listeners: if something happens in Photoshop, then something else
    (either a Script or an Action) is automatically triggered. There are subtleties
    that I''m going to discuss soon, but in general terms, it is a potent technique:
    either for automation purposes or workflow control in complex image processing
    pipelines when multiple operators are involved. For instance, you may find that:


    +   - when an image is saved, a .jpg thumbnail with a timestamp in the filename
    is also saved in a predefined folder;

    - if a CMYK image with missing ICC profile is opened, a popup alerts the user
    about few alternatives for Profile Assignation;'
