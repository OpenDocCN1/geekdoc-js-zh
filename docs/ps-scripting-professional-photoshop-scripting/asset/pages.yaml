  md: "# Cross-Application Communication\n\nBridgeTalk.onReceive = function(){/* ...\
    \ */}`\n\nBy default, onReceive() only evaluates the ExtendScript code that is\
    \ sent as a payload in the body prop. In other words, if you don't explicitly\
    \ write the callback yourself, this is what it would look like under here:\n\n\
    ```\n// To be set in the target app\nBridgeTalk.onReceive = function(obj) { return\
    \ eval(obj.body, true); };\n```\n\nIn the following snippet, I've injected an\
    \ additional alert() to onReceive() so that Bridge will pop up 'Get message' every\
    \ time he gets a BridgeTalk message.\n\n```\nif (BridgeTalk.isRunning('bridge'))\
    \ {\n    var t = new BridgeTalk();\n    bt.target = \"bridge\";\n\n    var onReceiveStr\
    \ = \"BridgeTalk.onReceive = function(obj) { \\\n        alert('Get a message');\
    \ return eval(obj.body, true ) }\\\n        bt.body = onReceiveStr + \"var t =\
    \ 'Dummy message'; t;\";\n\n    bt.onResult = function(response) {\n        $.println(\"\
    onResult\")\n    }\n    bt.onReceived = function(payload) {\n        $.println(\"\
    onReceived\")\n    }\n    bt.onError = function(err) {\n        alert(\"Error!\\\
    n\" + err.body)\n    }\n    bt.send(20);\n    alert(\"Done\")\n}}\n```\n\n> In\
    \ the example above, Photoshop sends a dummy message to Bridge (the target). Let\
    \ me stress that the BridgeTalk.onReceive() definition must belong to the target\
    \ code, not the sender's. onReceive() is, in fact, in the message body (lines\
    \ 6-8). Had I put it, say, after onError(), would have with affected Photoshop\
    \ instead – which is not what I wanted.\n\nIn onReceive() you may also deal with\
    \ unwanted messages, or filter them by their type for instance:"
