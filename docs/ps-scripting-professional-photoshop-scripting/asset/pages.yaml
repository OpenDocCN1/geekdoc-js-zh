    Wax, on off, there is a little strange to notice here before going any further.
    Line 9 and 15, there are suspect `grain` stringIDs. Shouldn''t it be, as a matter
    of sheer common sense, “green”? The original charID was a “Grm”. You wear your
    Sherlock Holmes hat and start experimenting:


    ```

    s2t(`Grn`); // 119681632

    s2t(`grain`); // 119681632

    s2t(`green`); // 119681632

    ```


    Both stringID and the charID result in the same typeID. Let’s try to convert the
    stringIDs back to charID.


    ```

    function s2c(s) (return typeIDToCharID(stringIDToTypeID(s)))

    s2c(`grain`); // “Grn"

    s2c(`green`); // “Grn"

    ```


    As a double check, if you look at the `PIStringTerminology.h` from the SDK, it
    contains the “green” stringID¹; the conclusion is that two or more stringIDs map
    to the same charID (and consequently to the same type), but the reverse is not
    allowed. A charID or a typeID are always univocally defined.


    ¹The “green”/grain” story has been explained by Tom Ruark here.'
