    # Variable Names


    This script has used names currentWidth,currentResolution or doc. It is a good
    practice to choose names that don''t inherit from Globals (aka global variables).
    These are pre-defined objects, for they don''t need to be created by you; they
    already exist in what is known as the Global Space. Have a look at this:


    ```

    var name = "Davide";

    alert(name);

    // "Adobe Photoshop"

    ```


    You''ve assigned to the variable name "Davide", how is that it gets as Adobe Photoshop?!
    It turns out the ExtendScript engine makes available by default an object called
    app (which refers to Photoshop itself). This app, in turn, has a property, that
    has precedence over the one you defined yourself. If you go Globals later, so
    you are bound to use myName, firstName, but not name.


    Funny enough, if you run the same script targeting ESTK, it gets "Davide" as you
    expect. So two lessons here: if a variable name sounds too generic to your ears,
    change it; even if you test your scripts in ESTK, always give them a hint in Photoshop.


    > *I have seen several approaches to the variable naming problem, e.g., a very
    experienced developer uses just one/two letters, another prefixes every variable
    with an underscore. I''m not dogmatic: you''ll find your preferred naming convention
    over time.'
