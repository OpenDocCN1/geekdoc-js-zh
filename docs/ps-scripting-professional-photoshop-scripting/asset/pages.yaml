  md: '# Working with Metadata


    in the JS Tools Guide, pages 257-293, with very few examples, mostly based on
    Adobe Bridge. Bear with me if I''ll simplifying to a great extent this otherwise
    utterly entangledmatter.


    # Schemas and Namespaces


    Since XMP is, to speak, *just* an XML-based metadata management system, that has
    nothing to do with the kind of data it holds: a considerable of key/value pairs.
    Several standard and nonstandard Schemas (groups of properties) are supported,
    each one identified by a unique namespace. An established Schema, for instance,
    is the Dublin Core, originally created for Libraries digital media files: it includes
    general properties as Title, Core, Subject, and Description—but their name is
    arbitrary.


    As a matter of fact, you can create your own namespace, stick there some information
    and embed it in a .psd,.tiff or .jpg as part of the XMP metadata. Find in the
    table below the most common schemas, their namespaces and URI².


    # Some Schemas and their Namespaces


    | Namespace Value | Constant Description | URI |

    | --- | --- | --- | --- |

    | xmp: | NS_XMP | Basic Schema | http://ns.adobe.com/xap/1.0/ |

    | dc: | NS_DC | Dublin Core | http://jurl.org/de/elements/1.1/ |

    | photoshop: | NS_PHOTOSHOP | Adobe PS Custom | http://ns.adobe.com/photoshop/1.0/
    |

    | xmpMM: | NS_XMP_MM | XMP DAM | http://ns.adobe.com/xap/1.0/mm/ |

    | xmpRights: | NS_XMP_RIGHTS | Copyright | http://ns.adobe.com/xap/1.0/ |

    ||pt4xmpCore: | NS_IPTC_CORE | IPTC Core | http://iptc.org/std/Ipt4xmpCore/1.0/xmlns/settings/1.0/
    |

    | crs: | NS_CAMERA_RAW | Adobe Camera Raw | http://ns.adobe.com/camera-raw- |

    | tiff: | NS_TIFF | Adobe TIFF | http://ns.adobe.com/tiff/1.0/ |

    | exif: | NS_EXIF | Adobe EXIF | http://ns.adobe.com/exif/1.0/ |


    A couple of caveats: Namespace Constants mean nothing to you, but they will be
    useful in a moment; the URI might resemble an actual URL, but it''s not³, it works
    just as a unique identifier for that Schema. All this can appear abstract, if
    you use the File Info Panel (from the File > File Info) and browse to the Raw
    Data section, you''ll find that every XML-ish structure:


    > Uniform Resource Identifier – a string of characters used to identify a resource.


    > ³The reverse is true, a URL is a URI.'
