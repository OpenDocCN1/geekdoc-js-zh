  md: "# Climbing the DOM\n\nThe [x,y] coordinate system uses the upper left corner\
    \ as the origin [0,0] and, as opposed to what we've been taught at school, the\
    \ axis values go downwards. In selection of the previous page I started with [2,2]\
    \ (top-left corner) and each other Array describes[x,y] points clockwise: so [8,2]\
    \ is top-right, [8,8] bottom-right, [2,8] bottom-left. No need to specify a closure\
    \ point, the last one automatically joins the first.\n\nYou may now wonder what\
    \ we're talking about: pixels, inches, points? It's not specified: both types\
    \ are fine, and without UnitValue.\n\n![](img/b87c0ab2175809458d63805e15cab800_80_0.png)\n\
    \n```\napp.activeDocument.selection.select[\n  new UnitValue(2, \"px\"),new UnitValue(2,\
    \ \"px\"), // top-left\n  new UnitValue(8, \"px\"),new UnitValue(2, \"px\"), //\
    \ top-right\n  new UnitValue(8, \"px\"),new UnitValue(8, \"px\"), // bottom-right\n\
    \  new UnitValue(2, \"px\"),new UnitValue(8, \"px\"), // bottom-left\n];\n```\n\
    \nIn the former case the ExtendScript engine assumes that you the Units are set\
    \ in the Photoshop Ruler. So [2,2] is whatever the Ruler happens to be set to,\
    \ the moment you launch the script. Might be 2 pixels feels like 2 inches; and\
    \ even if you're not NASA using $125 million Mars orbiter because of a conversion\
    \ mishap, you should check in advance anyway.\n\nIn you really need precision,\
    \ please note that Photoshop uses the pixel's bottom-right corner (see the image\
    \ on the right) as the reference for points. The pixel [2,2] is where the square\
    \ selection starts, but it's not actually selected! Neither [8,2] nor [2,8], whereas\
    \ [8,8] ends being included.\n\nSpeaking of position and [x,y] value, Color Samplers\
    \ work exactly the same, with which is as follows: if you pin them manually, they\
    \ snap to the center of the pixel; conversely, if you add them via Scripting,\
    \ they position themselves at the bottom-right corner of the selected pixel; but\
    \ will sample the color of one at out-east. E.g., a Color Sample at [2,2] will\
    \ show the value of pixel [3,3].\n\n![](img/b87c0ab2175809458d63805e15cab800_80_1.png)\n\
    \n> There is a bug with percents (at least until CC 2018), so it's not possible\
    \ to select, say, new UnitValue(8,\\%\") – even if the Ruler is set to Percent.\
    \ It always uses Pixels instead."
