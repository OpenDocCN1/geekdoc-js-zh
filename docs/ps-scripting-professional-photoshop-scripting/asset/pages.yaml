    Let''s pretend that your script needs to write trial information on a hidden file,
    like a counter (a number, you''re allowing 10 runs), and a user name: it''s a
    plausible scenario, even if the implementation is really simplified for demonstration
    purposes. So the text''s going to be:


    10

    Davide Barranca


    In the first script run there''s no hidden file: you need to create it.


    ```

    // First you need to create a folder, in this case a subfolder:

    var fol = new Folder(Folder.userData + ''/secret'');

    fol.exists(); // false

    fol.create();

    f.exists(); // true

    // Now you need to create a file:

    var f = new File(Folder.userData + "/secret/invisible.ini");

    f.exists(); // false

    f.open(''w'');

    // Now the file exists!

    f.exists(); // true

    f.println("10"); // in our example, the available script runs

    f.println("Davide Barranca"); // in our example, the user name

    f.close();

    // Hide it

    f.hidden = true;

