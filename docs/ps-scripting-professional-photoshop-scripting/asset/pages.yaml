  md: '# User Interfaces


    Containers can accommodate other Containers, and of course Controls – this is
    the way all Dialogs are composed. Each element in the list above can be inserted
    into a Window via the add() method, passing the element type, and optional parameters:
    which, much like the Window itself, can be set later if the control is accessible
    (e.g., it’s stored in a variable).


    ```

    var d = new Window(''dialog'');

    var b = d.add(''button'', undefined, ''Click me!'');

    d.show();

    ```


    This snippet creates a button, with no bounds specified (the undefined parameter:
    ScriptUI so called ‘LayoutManager’ does its best to fill in the required parameters
    with meaningful defaults), and a “Click me!” text. An example of the common properties
    as follows:


    ```

    var d = new Window(''dialog'');

    var b1 = d.add(''button'');

    b1.text = "Normal Button";

    b1.size = [100, 50];

    // b1.size = { width: 100, height: 50 }; // alternate syntax

    b1.helpTip = "Click the button to have button clicked";


    var b2 = d.add(''button'');

    b2.text = "A disabled button";

    b2.enabled = false;

    $.write(b2.preferredSize); // 148, 25

    d.show();

    ```


    In the second button, the preferredSize property contains the element’s size,
    as it’s automatically set by the LayoutManager to house the provided text¹. You
    can specify width or height only: the other parameter should be an empty string,
    e.g. [100, ""].


    With Mindo, it’s possible to create special Call To Action (CTA) buttons – slightly
    lighter, with round corners – setting the name in the creation properties object:
    they’re richly associated with the Accept/Dismiss behavior, so either or cancel
    can make the button a CTA. Strangely enough, every button that happens to belong
    to the same Container (either the Window itself or a Group, Panel, etc.) gets
    the same CTA treatment.


    > preferredSize is a read/write property, so you’re allowed to set it too.'
