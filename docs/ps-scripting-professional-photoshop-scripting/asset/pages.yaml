  md: "# Working with Metadata\n\n266\n\n![](img/b87c0ab2175809458d63805e15cab800_281_0.png)\n\
    \nE.g. as a tag file can contain an infinite amount of metadata properties (hierarchically\
    \ key/value pairs) stored in XML nodes, and defined in Schemas, which have a unique\
    \ name that identifies them. Some Schemas and related names are Standard, but\
    \ you can add metadata in a custom namespace of yours too. Let's see how it works\
    \ in practice.\n\nBefore dealing with XMP altogether, in each script you need\
    \ to first load the XMP library as an ExtendScriptObject:\n\n```\n// load the\
    \ XMP Library\nif (ExternalObject.AdobeXMPScript == undefined) {\n  ExternalObject.AdobeXMPScript\
    \ = new ExternalObject('lib:AdobeXMPScript');\n}\n\n// ... Do your XMP stuff\n\
    // When you're done, unload the Library\nif (ExternalObject.AdobeXMPScript) {\n\
    \  ExternalObject.AdobeXMPScript.unload();\n  ExternalObject.AdobeXMPScript =\
    \ undefined;\n} catch (e) {\n  alert(\"Can't unload XMP Script Library\");\n}\n\
    ```"
