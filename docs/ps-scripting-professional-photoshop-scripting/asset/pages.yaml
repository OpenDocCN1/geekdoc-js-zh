  md: "# 2. Writing Scripts\n\nTime to flex our fingers a bit – this Chapter covers\
    \ basic information about scripts that you need to know in order to write, save,\
    \ and execute them.\n\n#  2.1 Files, Extensions and Folders\n\nWhile JavaScript\
    \ files have the .js extension, ExtendScript default (and what you'll be 90% of\
    \ the times) is 'jsx' – bear with me if I'll referring to either the language\
    \ or a script file as “the JSX” in the following pages. Another convention is\
    \ to use jsxinc for include files: separate modules you may require into your\
    \ code using preprocessor directives – a distinctive feature of ExtendScript (see\
    \ Chapter 5). Lastly, jsxbin is for so-called binary exports.\n\nYou can store\
    \ your projects wherever you want: I generally keep them backed-up in a Dropbox\
    \ folder, but there are a couple of default locations that you must be aware of,\
    \ namely:\n\n+   - Photoshop <version>/Presets/Scripts\n    - Platform indented;\
    \ there you can find all the Adobe scripts (like ‘Load Files into Stack,jsx’,\
    \ ‘Fit Image,jsx’) bundled with Photoshop. You can save your own JSXs in a dedicated\
    \ nested subfolder there, and they will be listed by default within the Photoshop\
    \ ‘File > Scripts’ menu –provided they have the .jsx extension. In case you want\
    \ to hide them as items, prepend the filename with a ~tilde~.\n- [Win] C:\\Program\
    \ Files\\Adobe\\Startup Scripts CC\\Adobe Photoshop\n- [Mac] /Library/Application\
    \ Support/Adobe/Startup Scripts CC/Adobe Photoshop\n    - These are the paths\
    \ for scripts: these will be executed when the application loads, for instance,\
    \ to enable Photoshop / Bridge integration – see Chapter 1.\n\nScripts saved in\
    \ the Presets/Scripts folder, or its subfolders, can appear in a variety of different\
    \ Photoshop menus: not ‘File > Scripts’, but as an example ‘Filter’, or ‘File\
    \ > Export'.\n\n#  2.2 Adobe ExtendScript Toolkit\n\n> *Not to be confused with\
    \ the now popular React format, nor with this other.\n*The tilde – at the beginning\
