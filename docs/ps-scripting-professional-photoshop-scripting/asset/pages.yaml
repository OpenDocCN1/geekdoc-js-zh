  md: '# User Interfaces


    up to the point that it is safe to consider modelless dialog unavailable – if
    only because we have been told so by Adobe engineers them. If non-modal GUIs are
    a requirement, then (they say) CEP Panels are the proper solution.


    On the other side, even if HTML Panels are used as modelless 99% of the times,
    nothing prevents you from building modal panels as well; it''s a matter of tweaking
    a single parameter in a configuration file.


    As a rule of thumb, you would need a modelless dialog for a GUI that is to be
    always around, not interfering with the rest of the Photoshop interface: an Export
    panel with several "Save As" buttons, e.g., JPG, PNG, etc. In turn, something
    like a Batch dialog can be modal: you run it when needed, input all the required
    parameters, let it do its business, then close.


    ![](img/b87c0ab2175809458d63805e15cab800_208_0.png)


    Modal dialogs, by definition, won''t let you do anything with Photoshop but interact
    with the dialog itself. If you think about it, this is a crucial requirement for
    Scripts which is to apply image processing routines (like a Filter would do):
    tweaking the parameters in the GUI usually resetting the dialog to a known, unprocessed
    state, and then re-apply the algorithm from scratch. With modelless dialog this
    is piece of cake: the user cannot, say, mess with the Layers palette or switch
    to a different document in the meantime.


    Moreover dialogs explicitly enter and exit points: when the dialog is called,
    you can run an initialization routine; when the dialog quits, a similar cleaning
    routine can be triggered. With modelless panels – that are supposed always on
    – it''s not impossible, but way much more to know when something starts, ends,
    or we''re just in the middle of a processing session; and at the same time deal
    with edge cases, many of the unwanted user''s behaviors, and multiple documents.


    # Appearance


    TL;DR Scripted Dialogs are for engineers, HTML Panels better suited to designers.


    Quite a harsh and funny statement, but however nonetheless; let me explain, and
    add more needed details. Both Scripted Dialogs and HTML Panels provide you with
    several GUI elements: Text, Checkbox, Slider, DropDown List, etc. that can be
    composed to form the actual user interface. The sheer number of these basic elements
    is roughly the same; the striking difference is in the level (and need) of customization.


    CEP Panels can be dressed up as Birds of Paradise: you can tweak every element
    to your taste, from the fonts used, to size and kind of buttons borders, rainbow
    drop shadows, whatever graphic per comes to mind, it''s very likely doable. The
    downside is that you must decide the style of the GUI yourself (i.e., set the
    aspect of every element, the background, etc.) and keep it in sync with the Photoshop
    interface brightness.'
