  md: "# Hello World by Examples 56\n\nThat's it! You first write the function keyword,\
    \ followed by the function name, the one will be calling each you want to execute\
    \ it: in this case, it's logAll. After the name comes of a parenthesis () that\
    \ wrap the function parameters: these are the things the function uses/operates\
    \ upon. In the example, just message: this, is arbitrarily named: I could have\
    \ called it mess, or message, it doesn't really matter. The parameter, which can\
    \ be really anything (a String, an Object, another Function, etc.), is passed\
    \ from \"outside the function\" to the function itself each time you call it;\
    \ and is used \"internally\" in the function body: the code that is wrapped with\
    \ curly brackets {}, and where things happen.\n\nWhen you write a function call\
    \ in your program it's like replacing:\n\n```\nlogAll(\"Debugging time...\");\n\
    ```\n\nwith:\n\n```\nvar message = \"Debugging time...\";\nalert(message);\n$.println(message);\n\
    ```\n\nIn fact, \"Debugging time...\" string that you pass as the parameter of\
    \ the function is assigned to the internal message variable (aka local variable)\
    \ and used throughout the function itself when needed. A function can explicitly\
    \ return a value. E.g., the following function adds an exclamation mark to the\
    \ String that is passed as a parameter, and returns the string to... whatever\
