  md: '# Climbing the DOM


    Note that ExtendScript has the notion of const (here I''m using the full-capitals
    convention for them). You can''t modify the value of a constant, nor redeclare
    it: in the first case, the new value doesn’t stick, while the second throws a
    “Redeclared” Error.


    It''s helpful to look at this illustration (the tiny dark gray squares within
    the cyan squares define the top-left corner, that is the reference point for the
    derive the square size, i:


    ![](img/b87c0ab2175809458d63805e15cab800_84_0.png)


    If you define w as the Document''s width, m the Margin, p the Padding, s the Square
    side, and n the number of Columns, you’re able to write a simple equation and
    derive the square size from the other parameters:


    ```

    w = 2m + ns + (n - 1)p

    s = w - 2m - np + p

    s = \frac{w - 2m - np + p}{n}

    s = \frac{w - 2m - p(n - 1)}{n}

    ```


    Which in ExtendScript translates into:


    ```

    var side = (doc.width - 2 * MARGIN - PADDING * ( COLUMNS - 1 )) / COLUMNS;

    ```


    To define all the points that you’ll be using to draw the squares, you need to
    nest a couple of loops, the outer one for rows, the inner one for columns:'
