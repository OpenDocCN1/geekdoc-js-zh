  md: "# Cross-Application Communication 373\n\nAlternatively, you can avoid wrapping\
    \ the payload within a function and store it in a sidecar .jsx file; you then\
    \ read it from disk and put the content directly in the BridgeTalk body (this\
    \ method works fine when reading .jsbin files from disk).\n\n```\n/* alertDocument.jsx\
    \ */\nvar docNum = app.documents.length, popup;\nvar message = \"There\" + (docNum\
    \ == 1 ? \"is\" : \"are\") + \n  (docNum == 0 ? \"n\" : \" \" + docNum) + \n \
    \ \" document\" + (docNum != 1 ? \"s\" : \"\");\nalert(message);\n\n/* ReadExternalFile.js\
    \ */\nvar includeFile = new File($file.name) + \"/alertDocuments.jsx\";\nif (includeFile.exists)\
    \ {\n  includeFile.open(\"r\");\n  var includeContent = includeFile.read();\n\
    \  includeFile.close();\n  var bt = new BridgeTalk();\n  bt.target = \"photoshop\"\
    ;\n  bt.body = includeContent;\n  bt.send();\n}\n```\n\nThe BridgeTalk message\
    \ has two additional properties that you should know about. First, there's the\
    \ headers: it is an object that many of the times you're not very interested into,\
    \ except when either it contains a [\"ErrorCode\"] prop (see the Event Handling\
    \ section), or if you want to add custom, extra information:\n\nbt.headers.operator\
    \ = \"John Doe\";nbt.headers(\"ticket-id\") = \"BAR-2018-223901\";\n\nLastly,\
    \ there's the type property, which by default is ExtendScript (i.e., scripting\
    \ code, to be executed in the target application). If you set a different one,\
    \ make sure to implement an onReceive() callback, as explained further in this\
    \ Chapter.\n\n# Synch and Async behavior\n\nBridgeTalk can work either synchronously\
    \ or asynchronously, depending on the optional parameter passed to the send()\
    \ method: the timeout in seconds. If you don't specify the timeout or set it to\
    \ zero, the call is async; if the timeout is greater than zero, it is sync – i.e.,\
    \ the function will return until either the target has processed the message or\
    \ the timeout seconds havepassed."
