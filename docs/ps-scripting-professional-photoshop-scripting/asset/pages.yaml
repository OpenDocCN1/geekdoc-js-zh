    "target" key of the ActionDescriptor. I prefer to use that, over "null", because
    it makes the code more readable, and meaningful. If ScriptListener uses "null",
    that''s its problem.


    To up, in our example the "select" Action is performed on a Target specified through
    an ActionReference. There''s also a "makeVisible" boolean set to false, even if
    in case the layer was actually visible – I can imagine this would force the visibility
    in case it''s invisible – and apparently ActionList that contains the "LayerID"
    integer (e.g., if you comment it out, the code keeps working). I suspect¹ it''s
    information is used to univocally define the Target in case there are more layers
