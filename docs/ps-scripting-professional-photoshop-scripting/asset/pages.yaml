    # 199


    with the exception of the creation properties object; speaking of which, the only
    one works in Dialogs are the resizable boolean.


    **Bounds** are ubiquitous and deserve some extra coverage. You might wonder what
    the [100,100,300,300] array means as: it defines the x,y coordinates of the top-left
    and bottom-right corners of the window: topLeft-x, topLeft, bottom-right, bottom-right.
    As a result, the Dialog is a 200px square that starts at 100,100 location in your
    display. Yet, bounds can be defined in several ways: as follows all the alternate
    syntax.


    ```

    // Array [ x-left, y-top, x-right, y-bottom]

    [100,100,300,300]

    // Object { left, top, right, bottom }

    {left:100, top:100, right:300, bottom:300}

    // String "left, top, right, bottom"

    "left:100, top:100, right:300, bottom:300"

    // Object { x, y, width, height }

    { x:100, y:100, width:200, height:200 }

    // String "x, y, width, height"

    "x:100, y:100, width:200, height:200"

    ```


    As I''ve just mentioned, params are optional –if you want to address bounds and
    later later on (maybe you''re going to set them dynamically), the following statement
    is perfectly.


    ```

    var d = new Window(''dialog'', undefined, undefined, {resizable: true});

    ```


    The many read/write properties of the Window object, and everything else, can
    be set as usual.


    ```

    // Not resizable, because the creation property object is missing

    var d = new Window(''dialog'');

    d.bounds = [100,100,300,300];

    d.title = "A square dialog";nd.show();

    ```


    # 7.5 Containers and Controls


    ScriptUI identifies two kind of elements that a Window instance can hold:


    +   * Containers: Panel, Group, Tabbed Panel, Tab.

    * Controls: Button, IconButton, Image, StaticText, EditText, Checkbox, RadioButton,
    Progress-bar, Slider, Scrollbar, DropDownList, TreeView9, ListItem, Custom.


    >  ­

    *While bounds define the Window content size, the whole frame (title bar and borders)
    is found in the frameBounds property.

    *From CC2015 onwards, TreeView is not supported anymore.'
