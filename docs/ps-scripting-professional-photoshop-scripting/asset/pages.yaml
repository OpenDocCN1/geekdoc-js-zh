  md: '# User Interfaces


    displays, and Photoshop themes (UI brightness) support.


    ```

    1 var dlg = new Window(''dialog'');

    2 var icon = File(File.fileName).path + ''/resources/download.png'';

    3 var i = dlg.add(''image'',undefined, icon)

    4 dlg.show();

    ```


    The above code presupposes the existence of a download png file, better if 24bit
    with transparency support, in the specified path. A2X file¹¹ can be provided to
    support high retina displays, with the @2X suffix in this case download@2X.png.
    Moreover, the @Dark suffix is also available, to support dark themes. As a result,
    you''ll have:


    ![](img/b87c0ab2175809458d63805e15cab800_230_0.png)


    +   - download.png - standard size, lighttheme;

    - @2X.png - double size, light theme;

    - @Dark.png - standard size, dark theme;

    - download@2XDark.png - double size, dark theme;


    Be aware that the default size (no @2X suffix) must exist, and the light theme
    files are going to be used by default every if the @Dark version is not available¹².


    It''s worth mentioning that you can also embed images as binary strings; it''s
    a matter of reading the image file (e.g. .png) on disk, and writing it back to
    a .txt file for convenience.


    ```

    1 var imageFile=File(File.fileName).path + ''/resources/Flower.png'';

    2 imageFile.open(''r'');

    3 imageFile.encoding=''binary'';

    4 // Read it and save the result in a variable

    5 var binaryString = imageFile.read();

    6 imageFile.close();

    7 // Create the output textfile (Flower.png.txt)

    8 var textField = new File(imageFile.fullName + ".txt\n9 textField.open("w");

    10 textField.encoding="binary";

    11 // Use toSource to stringify it

    12 textField.write(binaryString.toSource());

    13 textField.close();

    ```


    The trick, so to speak, is to use .toString() while writing the binary string
    in the text file. As a result, you''re going to get Flower.png.txt, which content
    looks like:


    > ¹¹In fact, it''s four times the resolution, and two times the size: if the original
    image is, 100x100 pixels, the @2X is 200x200 (40K pixels).


    > ¹²Means that you need to come up with an image that works with both dark and
    light backgrounds.'
