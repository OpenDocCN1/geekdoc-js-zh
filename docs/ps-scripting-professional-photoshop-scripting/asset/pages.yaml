    # # 2.4 Running Scripts


    Let''s recap all the ways you have to run/test the JX code you''re working on:


    +   * ESTK: write your code in ESTK and click the play button (Command+R on Mac,
    CTRL+R on Win) - remember to target Photoshop and not ESTK itself.

    * Use Sublime Text, Atom, Visual Studio Code, or Adobe Brackets, and run/build
    with your ExtendScript plugin – usually, you have to save the file once, or it
    will work.

    * Open the file on both your text editor of choice and ESTK. Write in your text
    editor, save, switch to ESTK to run the code. ESTK should reload the file and
    update it with the latest changes. Make sure to set your ESTK preferences under
    Edit>Preferences> Documents, and check "Automatically reload of changed".

    * Write your code in your favorite editor, switch to ESTK, paste there, and run/debug.
    Do this two or three times, and the keyboard shortcuts like Command+A, Command+C,
    Command+TAB,Command+A,Command+V, Command+R will stick in your brain and fingers
    forever.

    * Write your code in your favorite editor, save it into a JX file: In Photoshop,
    create a new Action that records the ''File > Scripts > Browse...'' before mentioned.
    Switch the Action palette to show Buttons instead of a view in the top-right corner
    (Flyout menu, Button Mode). From now on, type code in your editor, switch to Photoshop
    and click the Action Button to run your code.


    > I''m not very much into code editor plugins (not at actually), but it''s funny
    to see that Sublime is OK with three files made of less ten lines each, while
    Brackets uses 100 times more code.'
