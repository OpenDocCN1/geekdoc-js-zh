    # # 6.9 Getting data


    If, as I hope, you''ve spent some time in the PS JavaScript Reference looking
    for AM stuff, you may have noticed that ActionDescriptors and ActionLists have
    both setters – put methods such as putInteger() – getters, like getInteger() and
    getDouble(). Time comes for you to use them.


