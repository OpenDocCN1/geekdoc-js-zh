  md: '# What this project demonstrates


    ![](img/b87c0ab2175809458d63805e15cab800_372_0.png)


    There are few variations on this theme that we may build. The complete picture
    involves three players: one Server, and two Clients. Among the Clients, one machine
    runs Photoshop and an Adobe Generator plugin, and one separate machine runs a
    web browser pointing to an HTML page on the Server and driving the other''s Photoshop.
    The Server accepts Socket.io connections from the two Clients – when the connection
    is made, they will be able to emit and listen for messages and respond accordingly.


    In fact, I will demonstrate a more straightforward (but technically equivalent)
    setup, where the three players still exist as separate entities but on the same
    machine: Node.js/Socket.io Server, one Photoshop/Generator Client, one web browser.
    This is going to be more practical to build and test, and still represents valid
    code that would make possible for a Remote Client to drive another''s Photoshop
    – provided that the Server code is uploaded to a remote machine.


    If you''re willing to lose the possibility to gain access to your Photoshop to
    a Remote Client, keep the browser controlling the program from within the same
    machine, matters can be simplified further: Generator itself can act as a Server,
    and hence dialog directly with the browser with Socket.io messages. I won''t build
    this latest variant, but as soon as you get to the end of this section, you won''t
    have any trouble doing it yourself.'
  merge: -1
