    A comprehensive list is found, as in the JS Tools Guide p.180-185.


    # The BridgeTalk Instance


    It''s time to send our first message — to keep it super-simple, to Photoshop.
    At the very minimum,

    you must:


    +   - instantiate the Class

    - set the target: the application message is going to be sent to

    - set the message body: the scripting code that you want the target application
    to execute

    - send it.


    The code that does this is as follows - make Photoshop is open, type and run this
    in ESTK

    an an alert will pop up.


    ```

    var target = new BridgeTalk(); // Instantiating the Class

    bt.target = "photoshop"; // Setting the message target

    bt.body = "alert(''Hello BridgeTalk!'')" // Setting the message body

    bt.send(); // Sending the message

    ```


    Let''s build from that, by gradually exploring deeper levels of complexity. First,
    it is good practice to

    check if the target application is currently running:'
