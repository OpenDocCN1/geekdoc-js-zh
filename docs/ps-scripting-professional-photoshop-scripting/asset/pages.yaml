- img_proc: true
  md: '# Network Event String


    # Event Description


    | **documentChanged** | A document becomes *dirty* |

    | **currentDocumentChanged** | A different document becomes active |

    | **closedDocument** | A document is closed |

    | **imageChanged** | Any changes to image documents |

    | **toolChanged** | A new tool is selected |

    | **generatorMenuChanged** | Selection of Generator menu items |

    | **foregroundColorChanged** | App foreground color changes |

    | **backgroundColorChanged** | App Background color changes |

    | **activeViewChanged** | A different view becomes active |

    | **newDocumentViewCreated** | A new view is created |

    | **colorSettingsChanged** | Color management preferences changes |

    | **keyboardShortcutsChanged** | Quick shortcut preferences changes |

    | **quickMaskStateChanged** | Quick mask mode is entered/exited |

    | **workspaceChanged** | A new workspace is selected |

    | **generatorDocActivated** | Any activate of documents with generator metadata
    |


    Each event may bring its owing to the callback, please refer to the documentation
    for details. In order to remove the event listener, the syntax is different:


    ```

    // Add Event Listener

    _generator.onPhotoshopEvent("toolChanged", handleToolChanged);

    // Remove Event Listener

    _generator.removePhotoshopEventListener("toolChanged", handleToolChanged);

    ```


    Please note that listening to some events (e.g. "imageChanged") can be expensive,
    so you should consider the performance implications before deciding to do so.


    # 10.3 Debugging


    To debug your Generator plugin, you can connect to it a Chrome Developer Tool
    session: you must run the node executable with a --inspect flag.


    ```

    node --inspect -f ../plugins -v

    ```


    Mind the order of the flags: --inspect comes after node, -f must be followed by
    the plugins folder path (relative to the current position), and -v stands for
    "verbose". Now open Google Chrome and point it to chrome://inspect/ (it will automatically
    add #devices in the URL).


    > *i.e., it has been edited since the last save.'
