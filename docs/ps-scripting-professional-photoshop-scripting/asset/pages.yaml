  md: '# Course presentation


    iv


    Conversely, these sections will contain guidance to better understand basic topics,
    with links to external JavaScript resources, etc.


    I must assume, instead, Photoshop likewise: scripting a program means to operate
    it with code. I can explain you with excruciating details, the reasons why you
    turn left the steering wheel, the car''s front wheel turn left, the mechanic involved,
    etc. Yet, this doesn''t automatically lead to driving knowledge – you must know
    yourself that suddenly turning left in the middle of a bridge crossing is a rib
    idea.


    That said, there are lots of people who struggle and fail to improve because of
    some topics which have proved, over the years, to be true-stoppers. For all, ActionManager:
    powerful and as undocumented as voodoo – and not any dangerous! In this Course,
    I''ve done my best to provide you unprecedented coverage of it, alongside several
    scripting black holes (ScriptUI, Generator, etc.).


    Lastly, if you come from a different Adobe application, be aware that Photoshop
    has its quirks and peculiarities, and it''s likely that you won''t be able to
    use, InDesign or After Effect in Photoshop without tweaking it.


    # What you need to get started


    This Course''s code has been written in/Photoshop-latest (CC2019) on a Mac, but
    scripting in PS goes back the pre-CC era and is theoretically platform independent².
    My interest in Photoshop coding started with CS3, yet the oldest PS version I''ve
    installed on my machine now is just CS6. With the obvious coverage of features
    that aren''t available in the past (say, Artboards in CS6) I''m confident that
    this code runs even in very early PS versions, and all the concepts covered here
    apply to every version that supports scripting. For the sake of simplicity, I
    will assume you have a licensed copy of Photoshop (CS6 to CC-latest), and the
    corresponding Adobe bridge.


    With them, you will be able to download and install the ExtendScript Toolkit (also
    known as ESTK, from it the Creative Cloud available downloads), which is the closest
    thing we''ve given to an integrated IDE for writing and debugging scripts.


    I''m editing this presentation in early 2019, few weeks after the public announcement
    that Adobe is to replace ESTK with a Microsoft Visual Studio Code plugin, which
    is currently in beta-testing. I''ve decided to keep the ESTK content I wrote in
    2018, because ESTK is not going to disappear suddenly, and also for the concepts
    still hold. In later versions, the VSCode plugin is released and proved to be
    stable, I''ll progressively edit ESTK.


    You can develop on both OSX and Windows: I strongly suggest you to test the other
    platform releasing (or selling) your product to other people, since running into
    platform-specific issues is not infrequent.


    > ²More on platform and version differences later in the book.'
