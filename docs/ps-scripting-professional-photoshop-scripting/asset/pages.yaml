  md: '# 11. Cross-Application Communication


    Scripting provides you with means to let Photoshop communicate with a selection
    of other (so-called) message enabled Adobe applications. There are two different
    ways to accomplish this goal: the Cross-DOM API and BridgeTalk. I''ll briefly
    mention the first one, and spend most of this Chapter dealing with the latter
    for reasons that will be clear to you shortly.


    # 11.1 Cross-DOM API


    As simple as it, you can directly call a minimal subset of Cross-DOM methods (i.e.,
    available in all the message enabled apps) via the dot operator. The latest available
    list of app identifiers is quite old¹, but here it is a reference.


    acrobat, aftereffects, soundbite, bridge, contribute, devicecentral, dreamweaver,
    encore, estookit, fireworks, flash, illustrator, indesign, designserver, incopy,
    photoshop, premierepro, audition, exman


    The application ID can be postfixed with an optional version ID: which is not
    the actual app.version (e.g., for Photoshop CC 2019 because the version is 20)
    but the number that ESTK uses to identify it, in our case 130. I won''t dig deeper
    because it seems this internal reference, at least for Photoshop, has not been
    updated since CC 2017 (that is, 110), so be aware that photoshop130 will fail.
    As a rule, the application identifier alone (e.g. photoshop) always refers to
    the latest version.


    The list of methods are rather short:


    +   - executeScript(): requires a String parameter, and performs a JavaScript
    eval on the specified script.

    - open(): requires as a parameter a File object or an Array of objects, and opens
    it/them.

    - openNew(): as same as "File > New", but works only for Illustrator and InDesign
    (see JS Tools Guide, p.169).

    - print(): requires as a parameter a File object or an Array of objects, equivalent
    of "File > Print".

    - reveal(): brings the application to the foreground. Accepts an optional File
    object or an Array of objects, and opens it/them

    - quit(): closes the application.


    So you are allowed to:


    > We''re talking about CS4'
