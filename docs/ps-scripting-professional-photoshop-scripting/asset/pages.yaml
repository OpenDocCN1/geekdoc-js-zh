  md: "# Cross-Application Communication\n\n# 380\n\n```\n// to be put in the bt.body\n\
    BridgeTalk.onReceive = function (msg) {\n  switch (msg) {\n    case \"Data\":\n\
    \      return doSomethingWithIt(msg);\n      break;\n    default: // It is \"\
    ExtendScript\"\n      return eval(msg.body);\n  }\n}\n```\n\nLet's jump to the\
    \ next section for an example that combines message's custom type and the onReceive()\
    \ callback.\n\n# Sending intermediate responses\n\nTo wrap this Chapter, I wanted\
    \ to show you one tricky way to deal with intermediate responses: how to dispatch\
    \ back to the sender while keeping the communication alive. This is described\
    \ in the JS Tools Guide, by no complete .js is suited for testing: and even if\
    \ they provided it, given the success rate of the BridgeTalk section a Hollywood\
    \ ending wouldn't be assured anyway.\n\nI've spent a couple of days trying to\
    \ copy a Photoshop & Bridge from the available code, but it doesn't entirely work\
    \ – I think due to an onRequest() bug, mixed with some caching. I haven't found\
    \ any help online either. I will share my state-of-the-art code here, so you can\
    \ pick up from there and try to progress on your own.\n\nIntermediate (or multiple)\
    \ responses in this context are, if you're not familiar with them, when making\
    \ an http request to Node, the BridgeTalk equivalent of Node.js: the server replies\
    \ sending back chunks, which are passed to the on('data') callback that processes,\
    \ or juist, collects them. When the server is done, the on('end') callback is\
    \ eventually able to process/return the joined response.\n\nThe concept here is\
    \ similar: a Photoshop script that sends a BridgeTalk message to Bridge, asking\
    \ it to return Thumbnails from a folder. Bridge won't respond in one shot with\
    \ an Array of Thumbs, while chunk the response into single Thumbnails one by one.\
    \ Given this plan, let's check my implementation, according to the Documentation\
    \ principles.\n\nThe idea is to exploit a custom message type (which I'll call\
    \ \"iterator\"), and modify the onReceive() callback so that a message of type\
    \ equal to \"iterator\" gets to the target, a loop is created and intermediate\
    \ responses are sent back to Photoshop via the message's sendResult() method.\
    \ Let's check the onReceive() code first."
