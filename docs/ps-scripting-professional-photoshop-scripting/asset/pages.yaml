    knowledge, and countless head-banging-on-the-walls of personal experimentation.


    # Audience and Assumptions


    The most challenging task, for me as an author, is to collect topics in a meaningful
    and helpful order so that you, reader, can exploit my work and prove it worth
    the money you''ve spent. I can''t possibly do so without assessing what this Course''s
    target actually is. Should I start from zero, and what would zero mean away? Back
    in September 2016, when beginning the first draft, I asked around to colleagues
    and friends; with few exceptions, I were suggested to skip language basics and
    assume street-level JavaScript knowledge. We live in an apparently web-driven
    world, and everybody vaguely interested in Photoshop scripting, they say, either
    already knows JS, or assume JS education of excellent quality—free or paid.


    I would embrace this approach blindly for several reasons. It leaves me with time
    and resources to focus on actual scripting topics: variables, types, closures
    and the like are pain-in-the-butt to cover, and I don''t want to risk anarchy;
    plenty of authors have already done it way better than I could ever do; and so.
    On the other side, when I started my journey long ago, I struggled to learn JS
    and apply those concepts in Photoshop at the same time. Then, strange as it might
    appear now, the JS hype wasn''t exploded. JavaScript lived in the browser, and
    so were targeted—by all the available resources. I had hard times reading about
    the global window object, node elements, etc., and trying to understand how that
    could fit in the Photoshop DOM. True, years by year, and JS is everywhere (in
    the browser, the browser, server-side)…but isn''t this confusing the newcomer?
    It is.


    So Ive decided to try a hybrid approach, as crazy it might seem. Total beginners,
    you won''t lost. The first four Chapters lay down the essential elements that
    will empower you with both the language syntax, and more importantly, a proper
    coding mindset. You''ll have to familiarize with the Scripting architecture through
    examples; if needed, you can refer to the dedicated resources I''ve listed. Anyone
    else: do not skip Chapter 5! The Course starts now, but you need to have a solid
    understanding of the basics if you want to master what follows. Anyway, I''m going
    to stop, and cover in more detail all programming concepts each time I find it
    appropriate—because scripting doesn''t end with language knowledge; it starts
    with


    +   - Dedicated sections like this one dealing with advanced topics might permeate
    the text flow

    - free to skip them if you still need to grasp the basics of the discussed subject
    and get back here to dig deeper.'
