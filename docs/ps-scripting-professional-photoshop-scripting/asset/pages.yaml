  md: '# # Action Manager


    # ## 6.1 Action Manager is not the DOM


    Sooner or later, while working on your scripts, you will inevitably step into
    DOM gaps. Say that you need to apply a Hue/Saturation adjustment, check the Move
    Tool''s Auto-Select option, or simply select the Move Tool itself – the list could
    be extensive.


    How do you do that? There''s no app.selectAll() function described anywhere in
    the document-impossible you say? Hard to believe. A fellow developer will eventually
    come with the following answer:


    ```

    var desc = new ActionDescriptor();

    var ref = new ActionReference();

    ref.putClass(app.charIDToTypeID(''moveTool''), );

    des desc.putReference(app.charIDToTypeID(''null''), ref);

    executeAction(app.charIDToTypeID(''slict''), desc, DialogModes.NO );

    ```


    Now, chances that you''re either green on Scripting and I can read your mind (it
    contains a localized version of the WTF that is! exclamation), or you''re more
    experienced than you can remember very clearly that WTF-moment back in the day
    when you first ran into Action Manager code.


    To say that Action Manager (aka AM) is an entangled topic is the understatement
    of the decade; I advocated a stage, Q&A approach, which I will adopt throughout
    this chapter.


    +   * **Is DOM only the Photoshop scripting?** According to the German philosopher
    Gottfried Leibniz, "we live in the age of all possible worlds"; such a statement
    could stand criticism in 1710, it''s easily dismissed by today''s Photoshop DOM
    coverage, global warming statistics, and my wife''s remarks on married life. No,
    you''re not restricted to DOM Scripting only, you''d be unbearably limited; there
    is more.

    * **How you did, David, learn Action Manager?** Have you ever seen one of those
    documents where paleontologists in the field dig a multitude of bone flakes, then
    they try to make sense of all them back in the lab reconstructing an entire bone,
    if not a complete skeleton? Mine has been, and still is, a very similar learning
    process. Forums, existing bits of code, old documents, chats with other developers,
    seasoned with an insane amount of time spent in trying, and mostly failing.'
