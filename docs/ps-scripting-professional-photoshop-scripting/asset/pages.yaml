    you click a button, select a checkbox, type in a EditText field, Events are fired;
    they can also be built ad hoc, programmatically. One way or the other, for listening,
    and respond to Events is a crash of any ScriptUI code.


    # Window and Controls Callbacks


    The easiest way to respond to an Event is to use the Event-handling callbacks
    that ScriptUI makes available for each type of object (Window, Panel, Button,
    etc.), and camelCase functions named on the Event you''re interested into (e.g.
    onClick, onChange, etc.). A simple example is follows:


