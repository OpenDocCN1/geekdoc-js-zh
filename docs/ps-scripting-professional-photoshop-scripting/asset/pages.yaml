  md: '# Action Manager


    Generally speaking, Creative Cloud applications expose the Scripting layer Classes
    and Collections, methods and properties, etc. hierarchically ordered in the Document
    Object Model (discussed in Chapter 4). And... that’s what Scripting is all about.
    DOM coverage can be as broad as InDesign’s – where the Scripting API is highly
    granular or quite lousy; I’ve been told that Illustrator is a good fit for the
    low end of spectrum. Typically, if the Scripting interface doesn''t expose, say,
    Tools selection... well, Tools selection isn''t available to you as a scripts
    developer, period.


    Except for Photoshop, which is different. Action Manager is often considered the
    holy grail of Photoshop Scripting, for it goes beyond the DOM, and can succeed
    in otherwise impossible


    +   * **How’s that I’ve never heard about Action Manager** is featured in the
    Photoshop Scripting Guide for a total of about six pages, general concepts and
    code samples included. The JavaScript Scripting Reference features more content,
    but in all honesty, it is useless if you haven''t know a about the picture.


    If you don’t know AM, you’ve dismissed as unimportant, or too cryptic to worth
    the effort, I don’t blame you. Learning resources are, by a matter of fact, non-existent;
    or scattered and buried in Forums’ topics which looks like being written by members
    of some secret society, rather than fellow developers.


    My goal is to shed some light on the subject and make you acquaint with it; the
    next step is to let understand, use, and tweak pre-built AM snippets for you;
    and finally, you’ll be to probe Photoshop and generate the AM code that precisely
    targets yours. Read all – and resist the temptation to jump to the section you
    need most: to digest AM properly, all the pills should be in order.


    # 6.2 Action, Events, and historical perspective


    Everything started when Actions first appeared in Photoshop 4– in 1996, some glorious
    twenty-years ago. As we all know, Actions are a fundamental building block of
    automated workflows, allowing you to record, save and replay bits of you (or others’)
    Photoshop activity. Despite our familiarity with them, you might not know or haven’t
    realized, that Actions and Action Manager are somehow linked. Quoting the Photoshop
    SDK documentation:


    Internally, Actions consist of Photoshop events, and targets of these events.
    An action can be a single event or a sequence of events. Events themselves are
    individual Photoshop commands or instructions that act on elements or objects.
    Every Photoshop event has a data structure associated with it that action plug-in
    uses to manipulate the event selection


    > ¹This reminds me a very talented photographer and friend of mine, who in the
    late nineties happened to be hired for a shooting job by a renowned publisher’s
    staff member. The company owner, reviewing the final prints, fell in love with
    his style so crazy, that he asked to meet this contractor as soon as possible;
    when they finally came to face, he screamed: “Mr. Howow, how’s that I’ve never
    heard about you?”'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Action Manager


    In other words, what you see in the Actions palette has been implemented under
    the hood as an **Event system**, based on an extensive database of Photoshop commands,
    filters, and elements.


    You select a rectangular portion of the image: that''s an event, it has an associated
    data structure which defines the selection bounds, and acts on a target – the
    active Layer. You apply the UnSharp Mask filter: that''s another event, its associated
    data structure defines the filter''s Amount, Radius, and Threshold, and its target
    is the current selection of the active Layer. Complete and so forth.


    Thus, recording an Action means keeping track of the events sequence, complete
    with descriptor blocks (i.e., related data and event targets).


    One key aspect that you might have overlooked in the Photoshop SDK is the entry
    to **Automation Plug-ins**. In case you''ve never heard about them, they''re a
    pretty neat way to wrap Photoshop operations into a basic package. For me those
    the oversimplification, they''re sort of "plugin-ized" Actions, plus extra logic,
    and a GUI, that you write in C/C++.


    Why am I bringing this to your attention? Well, the original quote comes from
    a 1999 paper called "Adobe Photoshop® 5.5 Event Guide", which is ultimately building
    Automation Plug-ins. That document represents a surprisingly interesting source
    of tangentially-related insights which describes two foundational elements of
    the Photoshop Object Model – Containment Structures and Inheritance Hierarchies
    are associated to the Event framework which is at the base of the EndScript''s
    Action Manager code.


    ![](img/b87c0ab2175809458d63805e15cab800_138_0.png)


    +   * **“Containment Structures” and “Inheritance Hierarchies”** The Object Model
    codifies the relation between Photoshop''s elements (Documents, History states,
    etc.), and their available methods/or properties. *Containment Structures* define
    the parent-child bond (when element holds another element: Document contains Layers,
    Layers contain ArtLayers, etc.), while *Inheritance Hierarchies* specify what
    methodsorproperties are available to the objects held in Containers (e.g., Curves
    or Adjustment layer inherit props and meths from the Adjustment layer).


    Now, to start C/C++ programs in building Automation Plug-ins, Adobe made (and
    still makes) the available source of a helper plug-in called “Listener”. It''s
    a neat piece of software that keeps listening for all the events as a consequence
    of you, using Photoshop; and it logs them, events and their descriptor blocks,
    in a plain text file on your Desktop. Remarkably, the log consists of full-working
    C code that programmers can borrow and use within their own Automation Plug-ins.


    > ^2Thanks to the advent of HTML Panels, they''re perhaps less common nowadays;
    as an example, Pixel Genius'' products have been built as Automation Plug-ins.'
  merge: -1
