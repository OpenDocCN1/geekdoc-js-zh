    # JSON Example: saving the GUI status


    To demonstrate how to write and save data on external files, let''s say a ScriptWindow
    with predefined elements, which can be saved when the Dialog closes and loaded
    when it opens. there''s a pre-filled ListBox: you can add elements to it typing
    something in the EditText field, and clicking the Add button below. I''ve added
    3 RadioButtons and a Slider, which you should try to change - to verify this at
    the next launch.


    The script writes and saves as JSON - the jxs includes the json2.js code to implement
    both JSON.stringify() and JSON.parse() methods. Everything boils to saving as
    a stringified object on a file, and parsing the file into an object again.


    ![](img/b87c0ab2175809458d63805e15cab800_301_0.png)


    When the Script is first launched, readJSON() looks for the .json file: if it''s
    there, it reads its content (which is a JSON string), JSON.parse() it, and returns
    an Object to the setGUIWithData() function. Which in turn fills the Listbox items,
    checks the RadioButton, the Slider''s value, etc. In the .json file doesn''t exist,
    setGUIWithData() uses a defaults object to fill the GUI with default parameters.


    When the "Save and Close" button is clicked, before closing the Dialog, the script
    uses the getDataFromGUI() function to prepare a Preferences Object, that is handed
    to saveJSON(): the object is then JSON.stringify() (converted into a String),
    which is eventually written in the .json file on Disk.'
