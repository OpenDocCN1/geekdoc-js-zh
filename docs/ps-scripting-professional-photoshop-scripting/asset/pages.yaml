    As you see, I have assigned to the Converter variable so-called Immediately-Invoked
    Expression (IIFE): a function expression that gets invoked immediately after it
    is defined. The IIFE itself has a Converter named function that acts as a constructor,
    to prototype I''ve added functions for all the steps I defined earlier, plus a
    couple of utility functions I needed. The IIFE returns the Converter itself so
    that I can instantiate a new Converter() (line 381 of the script) in the main().
    The autoRun() starts the entire process, as you''ll see.


    There indeed different design patterns for such scripts; I came up with this years
    ago when I used to write CoffeeScript. Before modern JavaScript, CoffeeScript
    had the notion of a class, and the structure you see here is the output of the
    CoffeeScript to JavaScript compiler with such input.'
