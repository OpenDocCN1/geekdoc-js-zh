  md: '# 6.11 Inspecting Descriptors: executeActionGet


    The new idea that I''d like to introduce you to, at this stage, is that the ActionManager
    system – among the rest – keeps track of a large number of Descriptors keys relative
    to the status of:


    +   * The Application (Photoshop)

    * Documents

    * Layers

    * Channels

    * Paths

    * History

    * ActionSets and Actions


    What am I talking about? Photoshop can hand you juicy Descriptors of utterly meaningful
    objects as itself (the application object) and the other objects listed above,
    thanks to the recently introduced ActionReference Class. You can cut them open
    with the skills you''ve perfected in the Getting data section, and find all kind
    of goods in them.


    # Application


    There''s a globally available method which returns an ActionDescriptor, and accepts
    as the only parameter an ActionReference: executeActionGet(). Depending on how
    you construct the Reference, the Descriptor returns to one of the above-listed
    elements (Documents, Layers, etc.); for instance, this is how you get perhaps
    the most important AD: the `application`s.


    ```

    1 var r1 = new ActionReference();

    2 var d1 = new ActionDescriptor();

    3 r1.putEnumerated(s2t("application"), s2t("ordinal"), s2t("targetEnum"));

    4 d1 = executeActionGet();

    ```


    d1 contains an amazing number of properties, such as the Brush list, the Photoshop
    serial string, Font names, recent files, display Preferences, you name it. Some
    of them are easy to grab, others are deeply nested into Descriptors. As an alternative,
    which leads to the very same AD, it''s possible to execute the "get" event.'
