    \ Event Loop. nextTick() ensures that the function passed as the parameter will\
    \ be executed on the next iteration (a tick, Node’s jargon) of the loop.\n\nThe\
    \ function that is called in the following tick in our case is initLater(), which\
    \ is defined on lines 56-69. Besides adding three event listeners (lines 65-67),\
