  md: '# Cross-Application Communication


    +   - C:\Users\<yourUser>\AppData\Roaming\Adobe\Bridge CC 2019\Startup Scripts


    Please note that Bridge contains the Startup Scripts, it''s Startup Scripts that
    contains Photoshop on Mac, and the Windows path is completely different. Also,
    there is the simpler (and multi-platform):


    +   - <AppFolder>/Scripts/Startup Scripts

    - <AppFolder>/Startup Scripts


    As a bonus, Bridge automatically creates Startup Scripts as soon as you put a
    .jsx file in the application folder, showing a path that says: “The extension
    ''whatever'' has been added to Bridge. Do you want to enable it now?” If you confirm,
    the file is actually moved there. Please note that Bridge also reacts to scripts
    that belong to Photoshop''s folders.


    # 11.2 BridgeTalk concepts


    If you look at the Cross-DOM functions (e.g. in photoshop_v2019.jsx) you''ll find
    that they are just utility methods, internally implemented with BridgeTalk: the
    API that defines the inter-application communication protocol.


    At its core, BridgeTalk is a synchronous or asynchronous system that allows applications
    to send and receive messages (which payload is usually a script that manipulates
    the target-application DOM) and deals with responses.


    > Curiously, an application is allowed to target itself: e.g., Photoshop can send
    messages to Photoshop, which is a way to make asynchronous calls.


    I''ve used this system in the past to build sticky Palette Windows (that, as you
    remember from Chapter 7, are officially unsupported). I''ve written an article
    on my blog called ScriptUI: BridgeTalk persistent Window examples that you may
    want to check out – with caveats when using jsbin and BridgeTalk together.


    # Static Methods and Properties


    The BridgeTalk Class is globally available: to build a message you need to instantiate
    it, but static methods and properties are useful to perform a variety of tasks.
    They are quite self-explanatory, so let''s check some of them out.'
