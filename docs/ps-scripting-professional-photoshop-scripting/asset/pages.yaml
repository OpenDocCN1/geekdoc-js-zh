  md: '# Bio


    # Davide Barranca – Author


    Davide has studied Applied Color Theory with Dan Margulis, and he''s a Photoshop
    retoucher by trade since the early 2000s. Teaching himself scripting to speed
    up and customize image processing routines for his job, he quickly got into the
    extensibility rabbit hole. Over the last 10 years, he regularly blogged about
    it, and published two books: Adobe Photoshop HTML Panels Development, and The
    Ultimate Guide to Native Installers and Automated Build Systems, which have been
    very well received by the developers'' community and Adobe itself. Davide is also
    collaborating with a small team of smart people worldwide on several Photoshop
    extensions, that retouchers and photographers seem to enjoy very much.


    # Sandra Voelker – Technical Editor


    Sandra started her Photoshop scripting journey in 2012 while a digital artist
    working at a large game studio. Recognizing the power of automation, she quickly
    became an evangelist for Photoshop Scripting, defining a new role at the studio
    called ''Technical Artist''. While her scripted tools were hard at work in studios
    around the world, she led training seminars exposing other creative professionals
    to the power of automation.


    In 2012 she decided to branch out on her own, forming Zetta Graphics LLC, a small
    company that creates automated workflow solutions for a variety of customers.
    Zetta''s clients started mostly with production studios, but quickly branched
    out to advertising agencies, photography studios, even unexpected places such
    as the US Department of Transportation, and human prosthetic technology! In 2016
    she answered the call of the motherhood and spent 18 months contracting with the
    Adobe Photoshop team, helping them update their own automated QA tools, and adding
    some new scripted features to Photoshop CC2015.5 and CC2017. Now you can find
    her writing more creative workflow solutions at Zetta, and partnering with professionals
    around the world.'
