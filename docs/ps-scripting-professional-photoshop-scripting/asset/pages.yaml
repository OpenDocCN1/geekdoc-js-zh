    # 7.3 Documentation


    You''ll be looking for documentation on Scripted Dialogs a lot – and that''s fine,
    there''s much more to be covered. As to other topics, I find myself here much
    more in need of a Reference kind of documentation, than more diverse Guides: hopefully,
    this Chapter is going to handle much of the theory involved, so you''ll know how
    to use functions, create elements, etc. Yet, there are always doubts about details
    such as creation parameters, and the like. For that, keep the JavaScript Tools
    Guide: it has everything you need to know about ScriptUI


    While the Guide is excellent as a Reference, you can look for a more hands-on
    approach in the remarkable, freely available, ScriptUI for Dummies, written and
    regularly updated by the InDesign developer Peter Kahrel.


    Since both resources are quite extensive (at one hundred pages the Adobe guide,
    at one hundred and thirty the other) I''ll do my best to try and a third, different
    approach. My goal is to leave you with a solid understanding of the ScriptUI architecture
    by examples, explaining both the basics and those annoying little details that
    one to overlook. By the end of this Chapter, you can navigate the otherwise intimidating
    JS Tools Guide with confidence, and enjoy Kahrel''s demo dialogs and fitnesses.


    # 7.4 The Window object


    If you look at "applicationFonts" property of the previously logged ScriptUI Class,
    you''ll see it contains speaks for three entries: "dahler", "palette", "window",
    in fact there are the three available kinds of interfaces you could theoretically
    build thanks to ScriptUI.


    The Window Class is always instantiated to build dialogs, except for creating
    the three elements you''ve already met in Chapter 5: I''m talking about the alert(),
    confirm() and prompt() dialogs, which in fact are all Window methods. You can
    shorten the ExtendScript will look up in the prototype chain of the globally objects.


    So far I''ve used "Scripted Dialogs" as a common name for ScriptUI Windows: it''s
    now time to discern what''s the difference between the three possible GUIs.'
