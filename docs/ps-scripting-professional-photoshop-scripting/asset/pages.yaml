    that is retrieved with the getObjectType(ref, "Apple"). The actual ActionDescriptor
    is returned by getObjectValue() and stored in the d2. Both methods cache the AL
    element index.


    What follows remains the work on the outer, d1: loop through the keys, find their
    DescValue, and finally access the actual values using the corresponding methods.
    The same applies to the second element of the AL.


    I admit that peering through home-grown, organic ActionDescriptors is particularly
    funny, but the purpose here is to fix your Action manager besides. Besides, every
    executeAction() returns its AD, so there might be circumstances where this kind
    of inspection is convenient. However, proving Descriptors is exceptionally useful
    when they come straight from Photoshop: you need to master the last AM object,
