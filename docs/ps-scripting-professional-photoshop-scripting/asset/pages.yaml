    #  5.3 The Reflection Interface


    Right after the dollar object, in my ranking, comes the fact that each ExtendScript
    object has a reflect property, which returns a reflection object. Which in turn
    has two important properties: properties and methods (both ReflectionInfo objects),
    eventually listing, mirror mirror on the wall, all properties and methods of the
    original object.


    Lost? Very likely, and understandably; see also JS Tools Guide p. 221-223, and
    the following example.'
