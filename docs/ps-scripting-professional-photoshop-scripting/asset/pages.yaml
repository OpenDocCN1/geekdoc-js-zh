  md: '# Cross-Application Communication


    Let me stress again the fact, when BridgeTalk is involved, you should never use
    ESTK to test your scripts. Open them in the application or the onResult() callback
    will have issues.

    Also, closing and reopening Bridge may help too, if you''re stuck with unwanted
    outputs,

    restarting the application.


    Bridge, at the second run, correctly loops and alerts all the files in the /img
    folder, but they can''t get to the onResult() callback. If you check the returned
    value of the sendResult() call in onReceive() you''ll see that it is false. Besides
    the caching issues, the main problem here is that onResult() is never trigged.
    In the scarce information I''ve been able to find online, nobody''s able to make
    it work, I guess it''s abut.


    # 11.4 Wrap-up


    BridgeTalk resources, besides the JS Tools Guide p.166-193, can be found in the
    ESTK samples and some of the internal ESTK resources: if you''re on Mac, right-click
    the ExtendScript Toolkit.app and “Show Package Contents”, you''ll find several
    interesting .jsx files in:


    +   - /ExtendScript Toolkit.app/Contents/SharedSupport/Required


    On Windows you should be able to find them directly within the “Adobe ExtendScript
    Toolkit CC” folder. If you want to dig deeper, I suggest you check out the Forums:
    don''t limit yourself to the Photoshop Scripting one, but also try in the InDesign''s,
    for this is a cross-application technology.


    I’m afraid I may have sound pessimistic here and there in this Chapter, BridgeTalk
    seems to be one of those subjects that are either neglected by Adobe, or plain
    unlucky. Combined with Bridge, which is in the record for lots of scripting bugs,
    they don''t make a glorious experience, so to speak.


    > At least on Mac / CC 2019.'
