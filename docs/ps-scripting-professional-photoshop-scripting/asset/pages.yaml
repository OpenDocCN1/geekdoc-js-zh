    If you have troubles wrapping your head around recursion, the appDocument.layers
    Collection let me track the program flow for you. and starts with layers[0] (aka
    Layer 5). When it''s time to call buildObj(), logLayers() pauses and waits for
    the buildObj() to process Layer 5. When buildObj() is done collecting the name,
    type and opacity props, it returns the object so logLayers() is able to go on
    with its business: it puts the object in the array, and it processes the next
    item in the loop.


    Which is Group 1. Before, logLayers(s) passes it to buildObj(), then pauses, and
    waits for the returned object. Now buildObj(recursion) and calls itself, passing
    Group 1''s Layers Collection as the input. This second instance of buildObj()
    doesn''t know, nor, about the first buildObj(). It does its job, collects stuff,
    and then pauses and calls a third instance of buildObj() to reach the Group 2
    content.


    When the Group 2 object is collected, buildObj() #3 returns it to buildObj() #2;
    which un-pauses, and in turn returns its object to buildObj() #1; which un-pauses,
    and in turn returns its object to logLayers(s) – which wakes up from the long
    nap and is quite happy to finally have something to feed the array. That''s recursion.


    Few things to mention. First, the function that is the subject of the recursion
    must have an exit point (in our case, the returned object – in other circumstances,
    a return statement when there''s nothing to do), otherwise it keeps running endlessly.
    Second, recursion may have performance issues if the stack you''re processing
    is awfully deep; then, ActionManager is a better choice – yet, it requires...
    ActionManager knowledge, which isn''t trivial. Check out this section of Chapter
    6, where I''ll show you how to traverse layers ActionManager style. Lastly, the
    .toString() method (line 2), is one of many ExtendScript exclusive features. It
    returns a literal version of the object: particularly useful when logging messages
    in the Console.


