  md: '# Action Manager


    +   * What’s a Hash Map? Also known as Hash Table, it is a data structure that
    associates keys with values. It does so via a Hash Function, which takes as a
    parameter the key, and computes the index of an array that contains, and finally
    returns, the desired value. See [here](https) for a more detailed explanation.


    Try to run ESTK (targeting Photoshop – annoying and frequent oversight) the following
    line.


    ```

    charIDToID("UnSM"); // 1433301837

    ```


    It returns a long, apparently meaningless 32bit integer. The charIDToID() method
    acts as the Hash Function: it takes as a parameter the unique charID assigned
    to the UnsharpMask event ("UnSM", which vaguely reminds you the UnsharpMask word,
    doesn’t it?) and returns the index – here 1433301837 – Photoshop uses to look
    up the corresponding internal element. That number is the typeID.


    Not only events as the UnsharpMask filter are referred to use this hashing mechanism,
    everything you might want, or to use. Go back to the initial Action Manager sharpening
    code; you can spot "Ammnt", "Rds " and "Tshh" Might they be Amount, Radius, and
    Threshold? Sure they are.


    By and large, you could also use charIDs as strings to use reference all of “useful
    stuff” in Action Manager: you cannot operate on them (directly since they’re just
    hashes). Hence, you must pass them to the charIDToID() function (the hash function),
    which returns an integer number (the typeID) Photoshop uses to look up the corresponding
    internal element.


    > A charID always consists of exactly four characters. (What we have assumed)
    is the Radius ‘radius’ is made with three letters plus one whitespace, like “Rds
    " is "N ” (one letter, three spaces). If you omit the space, or in general the
    charID isn’t made with exactly four chars, you’ll get an “Illegal Argument” error.


    Starting with Photoshop 5, Automation Plugins allowed developers to include in
    the list of available events also third-party, scritable filters – which to have
    their unique identifiers. In addition to, other identifiers were added to cover
    new Photoshop features and commands introduced with the version upgrade. A result,
    somehow mnemonic-friendly four strings couldn''t be to the task anymore, and stringIDs
    were introduced.


    A stringID is long and descriptive unique identifier that, very much like a charID,
    is used with a hash function this time called stringIDToTypeID() to get the same
    typeID thing (the index used to look up the corresponding internal element).


    ```

    stringIDToTypeID("unsharpMask"); // 1433301837

    ```


    You have a sharp eye, so you’ve noticed that you’re getting the same typeID from
    the "UnSM" charID and the “unsharpMask" stringID (in this case: 1433301837).'
