  md: '# Working with Metadata


    ![](img/b87c0ab2175809458d63805e15cab800_285_0.png)


    It may seem an involved procedure, but it reflects the highly structured nature
    of such metadata. I''m afraid that complication gets quickly even for apparently
    simple properties, such as the common Dublin Core “Creator” tag, which is found
    in the serialized string as:


    ```

    1 <-- stuff before... -->

    2 <dc:creator>

    3 <rdf:Seq>

    4 <rdf:li>Davide Barranca</rdf:li>

    5 </rdf:Seq>

    6 <dc:creator>

    7 <-- stuff after... -->

    ```


    It turns out that the <rdf> tag is a container of Arrays, that can be: Unordered
    (<rdf:Bag>), Ordered (<rdf:Seq>) and Alternative (<rdf:Alt>). The <rdf:li> identifies
    a list element. To get the “creator”, you need to make sure the Array exists first,
    providing the namespace, the property and its index: be aware that such Arrays
    are not zero-based, but always start with 1.


    ```

    if (xMPMeta.doesArrayExists(XMPConst.NS_DC, "creator", 1)) {

    var creatorProp = xMPMeta.getArrayItem(XMPConst.NS_DC,

    "creator",

    1);

    }

    $.writeln(creatorProp.value); // Davide Barranca

    ```


    Let’s try to get all the elements in a list, for instance, the “subject”, which
    happens to be an Unordered array (<rdf:Bag>).


    > The most common structures are Ordered and Unordered Arrays, the Alternative
    being used, e.g. for Language Alternatives (translations). They are documented
    in the XMPSpecificationPart1.pdf, found in the Adobe XMP Toolkit CC.'
