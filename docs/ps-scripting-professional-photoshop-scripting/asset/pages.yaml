    As a reference, please find below the list of the available, optional flags that
    you can request Document Info with.


    | Param [Type] | Description |

    | --- | --- |

    | documentID [integer] | Optional document ID |

    | flags [object] | Optional override of default flags for document info request.
    The flags and their default values are: True. |

    | flags.compInfo [boolean] | True. |

    | flags.imageInfo [boolean] | Specifies which info to send (image-specific, layer-specific,
    comp-specific). If none of these is specified, all three default to true, otherwise
    it just returns the true values. |

    | flags.layerInfo [boolean] | False. Get all smart object (plugin)documents. |

    | flags.expandSmartObjects [boolean] | True. Get all text style info for layers.
    Returned in the "text" property of layer info. |

    | flags.getTextStyles [boolean] | Get all text style info for layers. Returned
    in the "text" property of layer info, can be rather verbose False. If true, only
    return details on the layers that the user has selected. If false, all layers
    are returned |

    | flags.selectedLayers [boolean] | True. If true, send actual layer settings in
    comps (not just the comp ids, useVisibility, usePosition, and useAppearance) |

    | flags.getDefaultLayerFX [boolean] | False. If true, send all fx settings enabled
    even if they match the defaults. If false, layer fx settings will only be sent
    if they are different from default settings. |

    | flags.getPath [boolean] | False. If true, shape layers will include detailed
    path data (in the same format as generator.getLayerShape) |


    # 10.2 Network Events


    The Getting Started plug-in has attached some event listeners via PhotoshopEvent(),
