    In the end, everything is stored in the g variable. You can treat g as a guide
    object (Instance of the Guide Class, belonging to the Guides Collection). Look
    up the JavaScript Reference at page 119, and you''ll find out that guide (the
    class instance) has no methods, but properties: direction and coordinate. You''re
    allowed transform the existing guide through the g object:


    ```

