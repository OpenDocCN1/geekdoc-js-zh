    \ rotate and move away from their position.\n\n![](img/b87c0ab2175809458d63805e15cab800_79_0.png)\n\
    \nIn Photoshop and Scripting, there are several ways to get the same result: I've\
    \ decided to use stroked squares on a dedicated layer and not vector shapes, which\
    \ would require ActionManager code (the post-DOM world we will still have to explore).\
    \ It's possibly not the best option here, but for demonstration purposes, it'll\
    \ be good enough.\n\nBefore even thinking about the Schot grid of squares, let's\
    \ divide and conquer, copying with a single square. In our case a Photoshop selection\
    \ – and mind you, from now on I will assume that you know how to look for information\
    \ either in the JavaScript Reference and/or the EST Document Object Viewer.\n\n\
    Georg Nees' Schotter\n\nIf you look in the diagram at the beginning of this Chapter,\
    \ you'll see that Selection is missing: in fact selection is a property of the\
    \ Document Class. How do you create a new selection? Since the add() method is\
    \ a particular feature of Collections, you won't find it here: I beg you pardon\
    \ for the wordplay, but in order to select something, you will need to call the\
    \ select() method of the selection process, passing as an array of coordinates,\
    \ something like this:\n\n```\n// select a square\napp.activeDocument.selection.select([\n\
    \  [2,2], // top-left\n  [8,2], // top-right\n  [8,8], // bottom-right\n  [2,8]\
    \ // bottom-left\n]);\n```\n\nThe above is a multi-dimensional Array, i.e., an\
    \ Array of Arrays – there are four of them because we're interested in square\
    \ selections; you can use three or more for a polygonal selection, like the Polygonal\
