  md: '# Action Manager


    Amount, Radius, and Threshold are there with their values, clearly associated
    one another. How, and why... it''s still unclear. Let''s find out.


    It''s easier to grasp the meaning of that AM snippet starting from the last line
    of code: executeAction()

    is the global function that dispatches the event.


    ```

    // executeAction(eventID, descriptor, displayDialogs)

    executeAction(s2t("unsharpMask"),d, DialogModes.NO);

    ```


    The first parameter is the event''s ID (the typeID retrieved from the stringID
    or the charID).


    As I''ve mentioned earlier in this Chapter, the event system also relies upon
    a data structure that carries all the needed information for Photoshop to run
    the filter, as the Amount, Radius and Threshold (the target is the currently active
    Layer). This is the duty of the second parameter, a so-called Descriptor object
    (here d): an instance of the ActionDescriptor class, which is precisely a particular
    key/value pairs counter.


    Within an ActionDescriptor (ak AD), each key is defined with the typeID of what
    it represents, while values can be of different types: Integers, Nested Descriptors,
    etc. Also the method used to store a key/value pair in the Descriptor depends
    on the kind of data you''re going to stick in it:


    ```

    4 // ...

    5 d.putDouble(s2t("radius"), s2t("pixelsUnit"), 1.000000 )

    6 d.putInteger(s2t("threshold"), 5);

    7 // //

    ```


    "threshold" is an integer, you''re going to use the descriptor''s putInteger()
    function (line 6); conversely, a slightly more complex value such as a floating
    point coupled with its unit of measures uses the putDouble() method (line 5).


    To sum up, an ActionDescriptor is a central data structure in AM code to handle
    key/value pairs (up to complex arrangements of deeply Descriptors), needed to
    execute AM. We''ll use ADs throughout the rest of the book, so you''re going to
    have many chances to review them.


    The last parameter of the executeAction() method deals with the kind of user interaction
    allowed during the event—also in something goes wrong. There are three available
    constants for the displayParameters:


    +   * DialogModes.ALL will execute the event, and display (when available) its
    related dialog box: in our example, the Unsharp Mask filter is going to pop up,
    letting the user tweak the Amount, Radius and Threshold values. It corresponds
    to ticking "Toggle dialog on/off"


    > *For the sake of simplicity, I''m going to refer directly to the stringID (e.g.
    "threshold"), instead of writing something like "the typeID correspondent to the
    "threshold" stringID which is used by Photoshop to look up that very element.'
