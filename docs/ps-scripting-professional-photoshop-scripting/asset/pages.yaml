  md: '# 8. Working with Metadata


    According to Wikipedia, "Metadata is data [information] that provides information
    about other data". In context of Adobe Photoshop, there''s plenty of metadata
    to read and write around: either embedded by the digital camera or added in a
    later stage in the DAM (Digital Assets Management) workflow. On the other hand,
    Scripts may need to save their metadata: say, recall default preferences, or as
    a form of inter-scripts communication when shared information needs to be passed
    down the scripting pipeline.


    # 8.1 XMP


    Created Adobe itself, the Extensible Metadata Platform (XMP) is an XML-based format
    “... for the creation, processing, and interchange of standardized and custom
    metadata for digital documents and datasets", which became an ISO Standard in
    2012. There is a great deal of documentation in the Adobe XMP Toolkit SDK CC page,
    so much that it can easily become misleading. We''re interested in two things:
    the kind of metadata that appears in the Photoshop''s File Panel:


    ![](img/b87c0ab2175809458d63805e15cab800_279_0.png)


    Similar metadata is applied on a per Layer basis, a welcome addition to the Scripting
    API that dates back to Photoshop CS4, mainly driven by a Pixar feature request¹.
    XMP is documented


    > *This is what the former Photoshop Manager John Nack wrote in his blog in late
    2008.'
  merge: -1
