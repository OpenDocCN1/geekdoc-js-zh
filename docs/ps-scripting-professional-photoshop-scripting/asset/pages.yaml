  md: '# # The ExtendScript Domain


    # ## 5.1 Old but Gold


    It''s worth noting one more time the official words by Adobe on his Scripting
    language:


    > [...] an extended form of JavaScript used by several Adobe applications, including
    Photoshop, Illustrator, and InDesign. ExtendScript implements the JavaScript language
    according to the ECMA-262 specification. [It] supports the 3rd Edition of the
    ECMA-262 Standard, but a pretty old one: notational and lexical conventions, types,
    objects, expressions, and statements. ExtendScript also implements the E4X ECMA-357
    specification, which defines access to data in XML format.


    To your programmer''s ears the above means that ExtendScript complies to the same
    standard as JavaScript does, but a pretty old one: we''re still in 2009, the JS
    Precambrian era. As I''ve mentioned in previous Chapters, you can''t use ES5 features
    like Array.indexOf(), no JSON object, not to mention ES6 or newer features and
    syntax - forget about.


    ![](img/b87c0ab2175809458d63805e15cab800_102_0.png)


    The developers community has been waiting for an ExtendScript engine upgrade,
    so much that we basically gave up on the idea of a language revamp. Catching us
    by surprise, in 2018 Adobe announced a brand new platform for Adobe XD called
    UXP (Unified Extensibility Platform), based on a modern JavaScript virtual machine
    among the rest. Reading between the lines, the roadmap suggests that, in the long
    run, UXP may land in many applications as well.


    Please note that the old version ExtendScript complies to, also reflects in its
    general reluctance on being minded, compressed, or obfuscated with traditional
    JavaScript tools. A few years ago I test some JS libraries I needed, such as ES5-Shim
    and CryptoJS, and got discouraging results.


    First, some of the minified versions provided by the authors didn''t work out
    of the box. Second, the available tools (back then I tested Google Closure and
    UglifyJS) did produce mixed results depending on their settings: the code was
    parsed just fine but functionally flawed, sometimes it couldn''t be parsed all,
    and fixed obscure errors.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# The ExtendScriptDomain


    Strictly speaking, ExtendScript is not a JavaScript evolution, the way humans
    are not evolved chimpanzees: science tells us that both and the chimps share a
    common ancestor, which was probably equally different from your next-door neighbors
    and Bonobos. JavaScript and ExtendScript share the same (old, v3) ECMA-262 Standard:
    from which both have evolved, JS with recent ES6/ES7 features and JSX (incorporating
    new standards such as E4X ECMA-357 and proprietary features).


    This is precisely what makes ExtendScript remarkably versatile – and please I''m
    talking about the core language, which is shared (with different implementations)
    among the scriptable Adobe applications. This Chapter covers all the peculiar
    JSX features: I won''t list every single detail of them all, but you can look
    at the “Tools Guide” (JS Tools Guide) as a reference. Let me point out the ones
    I find worth mentioning, with practical examples ofuse.


    # 5.2 The Dollar object


    As opposed to diamonds for girls, as everyone once sung, the dollar is going to
    be your best friend. It''s globally available (puns could go endlessly, they won''t)
    and provides you with many crucial properties and methods – see also the JS Tools
    Guide p. 216-220.


    ```

    //

    // === PROPERTIES ===

    /

    // Debug level (read/write)

    // 0: No debugging

    // 1: Break at runtime errors

    // 2: Full debug mode

    $.level;

    // String. The current File Name: works only if it''s been saved once

    // Won''t work in the context of HTML Panels

    $.fileName;

    // Object. The global namespace.

    $.global;

    // String. The current locale (e.g., "en_US"). It''s Read-Write, so you can change
    the locale of your scripts on the fly to test different languages

    $.locale;

    // String. In my machine, "Macintosh OS 10.12.0/64"

    $.os;

    // The current Stack trace

    $.stack;

    // The line where the $.line itself is found

    $.line;

    ```'
