    # The Node.js server works to them!


    Look at the Console now.


    The Server has been created, and it''s actively listening for incoming connections.
    As soon as you browse to localhost:8099, the connection Client/Server is made,
    the Server fires ''news''. This ''news'' message is received by the Client, which
    has been waiting to activate exactly for that: as a response, the Client emits
    ''my other event'', that turn the Server is listening for. In course, the payloads
    are logged in the reactive Consoles. Hopefully, all makes sense.


    Given this information about Socket.io, let''s look at two actual examples of
    use in the context of Photoshop extensibility. In one case, Adobe Generator will
    act as a Server, in another as a Client.


    # Generator as a Server: CEP Panel interaction


    Implemented as a solution by many developers in commercial products, Generator
    on the Server is usually combined with CEP Panels - to get the best of both worlds,
    so to speak. For instance, you may want to make the most of Generator specific
    features, such as the completeness with which it can extract Document Information,
    or exploit the possibility to background-process bitmap data. I will demonstrate
    here a Panel that lists for Layers activation, and loads the current Layer''s
    thumbnail as an <img>.


    The plan involves Generator as a Socket.io Server, and the CEP Panel as a Client
    – their interaction follows. The Panel is instructed to listen for a *Layer Changed*
    Event: when that happens, it emits a Socket Event of type *layerChanged*. Generator,
    in turn is listening for, it responds the current layer as a Pixmap, and emitting
    a ''newimage'' message at the end of the process. This message reaches the Panel,
    which promptly loads the image. The idea is quite straightforward, but the implementations
    require some care.


    > Please be with me if I ask you to take my word for some aspects related to CEP
    Panels, particularly their Event System. A thorough discussion on this is out
    of the scope of this book, and the reason why I''ve dedicated to Panels an entire
    course. Please be pleased to know that Photoshop HTML Panels Development contains
    a similar example, but what you''re going to see in the next pages is exclusive
    to this book.


    To run the example Panel, as a reminder for CEP instruction given in Chapter 7,
    copy the entire com.example.generator folder in in:'
