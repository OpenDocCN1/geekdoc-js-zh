    # 5.5 Filesystem


    Before Node.js was given a name, ExtendScript could open, read, write and delete
    files like boss. In fact, given the right user''s permissions, nothing prevents
    a malicious developer to write JS code that does evil on somebody''s machine (like
    blowing up a Folder, as an example of something you shouldn''t). For a complete
    reference, see JS Tools guide p. 39-61.


    > Please note that all the Filesystem methods that I''ll be describing are not
    undoable. If you''ve trashed a client''s folder via scripting, it''s gone forever:
    no matter how you get it back from the Trash.


    The Writing Deals with File and Folder objects is the same no matter the platform
    (Windows or macOS). Both require a path, that you''ll use to create or reference
    them, and that can be formed using the forward slash /.'
