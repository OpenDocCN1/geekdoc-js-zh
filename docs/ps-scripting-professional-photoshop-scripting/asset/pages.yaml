  md: '# The ExtendScriptDomain


    And that''s it: please note that you can create a Folder with its create() instance
    method, but there''snothing nothing for Files, so the trick is to open it and
    write something. Always remember to

    close when you''re done.


    > In case you''re a bit confused: yes, you''re opening a file that doesn''t exist.
    In the Scripting

    context, "to open" has a different meaning compared to an actual application,
    such as

    Photoshop. What you''ve created first (the r File) is a valid instance of the
    File Class, which

    happen to point to an actual existing file. By the time you open(w), the file

    is created on disk.


    The next time you runs the script, the script itself needs to check the hidden
    .ini file and see

    whether it''s allowed run – subtract 1 from the counter.


    ```

    var f = new File(Folder.userData + "/secret/invisible.ini");

    open(''e'');

    f.length; // 19. Don''t believe it? Count it yourself:

    // (1)(0)(LF)

    // (D)(a)(v)(i)(j)(d)(e)( )(B)(a)(r)(r)(a)(n)(c)(a)(LF)

    tell0(); // 0 (the current pointer position, ready to read char 1)

    var trialRuns = f.fread(); // read the first line

    // the pointer is now at a different position

    tell0(); // 4

    var username = f.fread();

    tell0(); // 19

    // true, we''ve reached the end of file

    EOF:

    var waselse = f.fread(); // undefined, can''t read anymore

    error // Read post EOF, the last recorded I/O Error

    ```


    We''ve opened the file with the ''e'' flag (which for edit) we need to read and
    write

    it.


    > Be careful: the time you''ve created, open(w) has already overwritten the file
    content,

    wiped out everything. If you need to read a file, use the ''r'' flag; conversely,
    if you need

    append data, use ''a''.


    The file length is 19, for you need to take into account linefeeds at the file
    creation, we''ve used

    writeFile(), which always appends them. To check, move the pointer to 2 (right
    after the 0),

    and read a single character using the readch() method, in conjunction with the
    global encodeURI()

    function. The result is the corresponding to LF (linefeed). An encoding reference
    can be found here.'
