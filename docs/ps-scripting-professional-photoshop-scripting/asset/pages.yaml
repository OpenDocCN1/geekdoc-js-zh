    \ which needs only the ID.\n\nGenerators' functions make use of Promises which\
    \ are asynchronous: then() is called when the promise is resolved (it succeeds)\
    \ or rejected (it fails), and it's passed two functions in this order (for dealing\
    \ with the success result, for dealing with the error result). You're allowed\
