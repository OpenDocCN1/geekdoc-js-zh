  md: "# User Interfaces\n\nRestart Photoshop, and find \"CEP Panel Example\" in the\
    \ Windows > Extensions menu. It is a very simple Lorem Ipsum text generator with\
    \ the Slider you define how many words you want to get, clicking \"Generate\"\
    \ you are connecting with https://lipsum.com/ REST API to get the long String.\
    \ Eventually, the Panel hands it to Photoshop, in turn it alerts and connects\
    \ it to the Clipboard. Let's now overview the Panel structure.\n\nThe content\
    \ shown here is mostly optional, few items are required. index.html, which represents\
    \ the entry point, and has links to all the JavaScript files that control the\
    \ Panel's operations. A CSXS/manifest.xml file, which contains configuration data\
    \ – the Panel's name and id, Menu name, CEP version, supported hosts, linked files,\
    \ etc. Please note that the CSXS folder name is fixed and should not be changed.\n\
    \nA CSInterface.js file which is the Common Extensibility Platform API library\
    \ that we use, among the rest, to communicate with the Host Application (in an\
    \ optional item). A photoshop.jsx file (you can change the file name, if it matches\
    \ the one defined in manifest.xml), that can ExtendScript code.\n\nIn the index\
    \ file you lay down the GUI elements (buttons, sliders, text) in plain HTML/CSS\
    \ – I you are already familiar with these technologies. The code for my example\
    \ is as follows:\n\n```\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <link id=\"theme\" rel=\"stylesheet\" href=\" />\n  <link id=\"hostStyle\"\
    \ rel=\"stylesheet\" href=\"css/styles.css\" />\n  <title></title>\n</head>\n\
    <body>\n  <div id=\"content\">\n    <div class=\"row\">\n      <h3>Lorem Ipsum\
    \ Generator</h3>\n    </div>\n    <div class=\"row\" style=\"height: 50px;\">\n\
    \      <h4 class=\"relative\" style=\"top: 3px; left: 19px; opacity: 0.6;\">\n\
    \        WORDS\n      </h4>\n      <input type=\"range\" id=\"words\" min=\"0\"\
    \ max=\"150\" value=\"50\" step=\"1\"\n        class=\"topcoat-range absolute\"\
    \ style=\"top: 25px;left: 0px;width: 209px;\">\n      <input type=\"number\" id=\"\
    wordsno\" min=\"0\" max=\"150\" step=\"1\" value=\"50\"\n```\n\n![](img/b87c0ab2175809458d63805e15cab800_274_0.png)"
