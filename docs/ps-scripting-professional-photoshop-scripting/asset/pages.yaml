  md: '# Working with Metadata


    On the other hand, the Registry can be easily inspected as, say, XMP metadata
    (that by design is exposed to anyone''s eyes in the File Info panel), but I can''t
    ensure it''s 100% safe too. If you have skipped Chapter 6 (about ActionManager),
    you should visit it now, because Registry operations involve a small dose of AM
    code.


    Whatever the Registry actually is (or where it is stored) it''s not really important12;
    what matters is that we''re given a System that allows the association of key/value
    pairs, where the key is always a String, and the value is always an ActionDescriptor.
    The ActionDescriptor itself, you can store all kind of stuff.


    ```

    function s2t(s) {return stringIDToIndex(s);}

    // Create an empty ActionDescriptor

    var d = new ActionDescriptor();

    // Populate the AD with a String

    d.putString(s2t(''country''), ''Italy'');

    // Populate the AD with an Integer

    d.putInteger(s2t(''age''), 42);

    ```


    Save the ''d'' ActionDescriptor in the Registry under the "unDavide" key

    app.putCustomOptions(''unDavide'', d);


    Besides the s2t utility function, you see that (line 11) I''ve used putCustomOptions()
    method of the object to associate and store the "unDavide" key with a value that
    is the ActionDescriptor. In Photoshop jargon, the CustomOptions are synonymous
    of Registry. In turn, the ActionDescriptor is a container of key/value pairs,
    defined using the various put-something methods; they depend on the value type,
    putInteger(key) associates a key with an Integer value, putString(key) associates
    a key with a String value, etc.


    ![](img/b87c0ab2175809458d63805e15cab800_299_0.png)


    Save a Key/Value pair in the Photoshop Registry


    > 12The actual data is saved in the .psp file with the Application Preferences.'
