  md: 'Photoshop Scripting


    12


    In other words, the ExtendScript language is a JavaScript superset: it complies
    with JavaScript specs and adds extra stuff that will not affect you in the first
    stages of your learning experience. A lot more about ExtendScript specificity
    is found in Chapter 5.


    There’s one important fact you need to pay attention to, now: the version of the
    Standard ExtendScript adheres to what was named, back in 1999, ES3 or ECMAScript
    version 3. By the time of this writing (2017-2019) ES5 is the old JavaScript default
    in all major browsers, and first published in 2009; ES6 is getting momentum; and
    ES7 specs (as ES 2016) have already been announced.¹12


    In plain English: true, ExtendScript extends JavaScript with a set of exciting
    and useful “extra features”, but it hasn’t caught up all with the core JavaScript
    evolution – I mean it’s at a pre-2009 era. On one side, it’s fair to admit that
    standards’ publication and adaption there might be a sensible delay; on the other
    side, it’s a huge gap to fill¹13.


    This has a crucial effect: if you still need to learn the language basics, before
    the new ES6 syntax (e.g., the so-called arrow operator ==), it will be of no use
    and will break your scripts. There are no basic tutorials covering ES3 only because
    it’s too old – your best option is to learn ES JavaScript (plenty of resources),
    and then prune all the features that don’t apply to ES3.


    If you choose to Photoshop Scripting with some prior JavaScript knowledge, be
    aware that many of the features that you rely upon, won – stuff that you were
    granted such Array.indexOf(), or JSON object. The good news is that many of the
    ES5 features are shimmable (i.e., you can import external libraries that implement
    them).


    > For those who are more experienced, it’s possible to use either Babel or Bublé
    and then translate JS into some ExtendScript-friendly version of JS, using the
    ES5 and ES6 sh found in the Resources Chapter. I’m not sure how they would react
    with ExtendScript-specific features, like XML literals: obfuscation tools don’t
    like them, so a bit of caution is a good thing.


    # Photoshop and Core ExtendScript


    The entire Chapter 5 is devoted to the language specs: I’ve decided to postpone
    the in-depth of ExtendScript’s unique features because it makes the learning smoother,
    in my opinion. Yet, there is another bit of knowledge that you need to have clear
    in earlier: let me now briefly what you’ve learned so far:


    +   - The Photoshop Scripting language of choice is ExtendScript.

    - ExtendScript is a superset of JavaScript (i.e., JS plus extras from other standards).

    - The JS standard is based upon the old ES3¹⁴.


    ¹¹²ECMA jumped from version 3 to version 5, quoting Wikipedia “due to potential
    differences concerning language complexity”.

    ¹³With a new Adobe team committed to Developers, the hope for a modern language
    is rising once more.

    ¹⁴Mind you: ES3, ES5 or ES6 means “ECMAScript”; the Standard Specification versions,
    the ExtendScript language.'
