    # 10.8 Socket.io Server/Client communication


    Eas building an HTTP Server is one of the things that Node.js was famous for its
    early days – it is indeed simple. With Photoshop Scripting, I can think of different
    scenarios where Generator can act either as a Server or a Client too: for such
    purposes in the past I''ve successfully used Socket.io, a JavaScript library that
    "enables real-time bidirectional event-based communication". The enjoyable feature
    of Socket.io is that it provides the same syntax on both the Server and the Client
    side, so the code is easier to write.


    # Sockets 101


    The general idea – bear with if I''m over-simplifying here – is that you set up
    one instance of Socket.io on the Node.js Server and one on the Client. The Server
    has two purposes: first and unsurprisingly, it serves HTML pages upon request;
    second, it listens for Socket.io connections. The Client, in turn, sends a Socket.io
    request to the Server. When the communication channel is established, the two¹⁵
    can emit messages, and respond accordingly.


    I will give you instruction to build local (i.e., on your machine, and not remotely
    hosted) Node.js servers, but nothing prevents you from uploading the code on a
    remote machine and working from there.


    Create an empty folder (you can find the result of this in the provided source
    code, local-server-example folder), open to the Terminal, cd into it, initialize
    an empty project and install Socket.io.


    ```

    npm init -y && npm install socket.io --save

    ```


    Now create an app.js file with this content (straight from the official documentation,
    very slightly modified):


    ¹⁵Socket.io can deal with multiple Clients connected to the same Server of course.'
