  md: "# Hello World by Examples\n\n```\n// Still dealing with the layers above the\
    \ Retouching group only\n// We'll deal with LayerSets later on\nvar doc = app.activeDocument;\n\
    var len = doc.artLayers.length;\nvar layersToDelete = []; // Array that will contain\
    \ the layers to delete\nfor (var i = 0; i < len; i++) {\n  if (!doc.artLayers[i].visible)\
    \ {\n    layersToDelete.push(doc.artLayers[i]);\n  }\n}\n\n// Loop through the\
    \ layersToDelete array to delete each layer\nfor (var j = 0; j < layersToDelete.length;\
    \ j++) {\n  layersToDelete[j].remove();\n}\n```\n\nIt works! Let's recap: the\
    \ layers Array literal¹² is created (line 5), empty. The loops through all the\
    \ ArtLayers, but if this time a visible property is false is found (remember:\
    \ the != “not”) its reference is stored inside the layersToDeleteArray, and not\
    \ removed away as we've done so.\n\nWhat is a reference in this case, and how\
    \ do you store it in an Array? It's like if you were taking note of what you want\
    \ to wipe out, looking at all of them and writing down the ones which needed to\
    \ beremoved—say, a piece of paper. In fact, “writing down” becomes in our casestoring\
    \ them inside an Array. How to fill an Array with elements, you use its .push()\
    \ method, passing as a parameter what you want to put in the available slot¹³.\n\
    \n```\nvar a = []; // an empty array\na.push(1); // filling the array with 1\n\
    a.push(2);\na.push(3); // [1, 2, 3]\n```\n\nLine 13, another for is looping through\
    \ layersToDelete to remove(). However, deleting from Array doesn't break the loop\
    \ this time? Because the layersToDelete contains references, pointers to the actualLayers.\
    \ At therrestaurant, the cardboard doesn't contain food, it references the available\
    \ meals. Each loop,the reference is to turnthe.remove()method on the actual ArtLayer\
    \ object points to. After, the actual ArtLayer is gone, but not the reference\
    \ itself in thelayersToDelete array; it's still there, it only points to .. nothing.\
    \ What is not a problem at all, the loop is on to the next iteration, and won't\
    \ use it anymore.\n\n²You use the so-called literal when creating arrays with\
    \ square brackets, var a = [1,2]. This is generally preferred over its alternative,\
    \ var a = new Array(1,2).\n¹³push adds elements from the Array's tail (the end).\
    \ If you want to insert items from the Array's head, you have to use unshift()."
