    Model.


    Second: Debugging – you have a proper debugging environment, with conditional
    breakpoints, Console, Data browser, etc. It doesn''t work under all circumstances,
    but it''s there.


    > It''s strange that ESTK itself can be the target of the code you''ve written
    or run it. Usually, this is no use at all. ESTK has no clue about what a Layer,
    a Selection, or a Filter are: it only knows the Core Language, not the specific
    application (Photoshop) ExtendScript.


    Yet, under some circumstances... that you''re testing a function on Strings, Files
    and Folders – something not directly related to Photoshop – it might be faster
    to target ESTK and not PS. That''s because it takes a little extra for ESTK to
    call and dispatch to the PS ExtendScript engine for the evaluation, and we developers
    to become nervous when all little things sum up, at the end of the day.


    Per se, it''s not a harmful practice: yet remember to always, thoroughly test
    your code targeting the application (Photoshop). Similarly to InDesign or Illustrator,
    it has its peculiar ExtendScript engine: results between ESTK and PS can be different,
    and lead to persistent headaches. One area in which this difference explodes the
    ScriptUI class (used to build dialogs) – you shouldn''t trust anything related
    to dialogs.


    Finally, if the code you''ve launched halts for unclear reasons, that you''re
    really targeting PS and not ESTK (case #1 of these errors not only among beginners).
    Adding #target, a preprocessor described in Chapter 5, as the first line of code
    helps.


    Third: a remarkable highlight of the ExtendScript Toolkit is the Object Model
    Viewer, a powerful and handy documentation browser.


    *Embarrassing as it appears, I realized that I could use in the ESTK Console myself
    only in recent years.'
