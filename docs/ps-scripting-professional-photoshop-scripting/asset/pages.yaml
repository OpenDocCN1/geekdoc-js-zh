  md: '# User Interfaces


    # 194


    Conversely, Scripted Dialogs come with pre-styled elements, with a minimal set
    of available tweaks; it''s possible to bend them to your graphic designer will;
    to a smaller extent. The big deal is that you don''t have to necessarily worry
    about styling at all, and get a reasonably good user experience, consistent with
    the rest of the Photoshop GUI.


    Unless you want your GUI to pop up and hurt the user''s eyes, you''re probably
    about to look and feel that beneath Photoshop; the bottom line is that Scripted
    Dialogs provide a decent match for free, not too much customizable-


    ![](img/b87c0ab2175809458d63805e15cab800_209_0.png)


    able, production-ready out of the box. CEP Panels can be turned into native Photoshop
    (mostly part of the Photoshop''s one interface, is in fact, made of CEP Panels)
    but at a development cost.


    # Technology


    TLDR Scripted Dialogs are integrated within your scripts, while CEP Panels are
    a different piece of technology that embeds your scripts. Also, the ScriptUI class
    is evaluated by the same ExtendScript engine, while the CEP Panels operation on
    a JavaScript engine, that must communicate with the ExtendScript engine exchanging
    messages back and forth.


    I left the programming details at the end on purpose because I wanted to evaluate
    other aspects first. Scripted Dialogs are nothing but an additive, native feature
    of ExtendScript: as a consequence, they''re not necessarily functional from any
    other part of your scripting code.


    CEP Panels are an entirely separate thing. You won''t really use them as the GUI
    of your Scripts; precisely, CEP Panels are going to embed and use your Scripts,
    submitting them for evaluation of the Photoshop engine—this is a fundamental switch
    in perspective. When dealing with scripted GUIs, use ScriptUI as a subsidiary
    class, whereas CEP Panels are equally important and/or powerful to the Script
    they define


    A dedicated section will follow, but basically CEP Panels are web applications
    running within a Google Embedded Framework (a portable Google Chrome browser,
    to speak): like other web application running in a browser, it''s all about HTML,
    CSS, and JavaScript. While CEP defines the elements architecture (buttons, forms,
    you name it), CSS deals with styling. JS has two major roles.


    +   - It is in charge of the Panel''s operations – e.g., elements handlers when
    this button is clicked, send a POST request to a server, and pass the data from
    this other field, etc.'
