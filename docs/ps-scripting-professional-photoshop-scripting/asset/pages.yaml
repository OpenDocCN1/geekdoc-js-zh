  md: '# User Interfaces


    don’t use ActionScript libs for Scripting, you’re allowed to share just the JSX
    code.


    That said, it is an ongoing project supported by the InDesign developer Gabe Harbs
    called CEP Royale, which dagli goal is to port CEP to Apache Royale: a “productive,
    open-source frontend technology that lets you code in AS3 and output to different
    formats”, according to the Apache Foundation. If you already did ActionScript
    and you''re a nostalgic of the Flash days, you can give it a try.


    # Behaviour


    TL;DR Scripted Dialogs are modal, HTML Panels modelless. Sort of... Read along.


    A dialog is modal if you cannot interact with the rest of the host application’s
    GUI (panels, documents, etc.) while the dialog is running: Photoshop beeps and
    refuses to cooperate. You are only allowed to interact with the dialog itself–
    clicking buttons, dragging sliders, fitting into forms, etc.


    Conversely, a modeless (or non-modal) GUI sits in the Photoshop interface, ready
    for your input, but without steal the focus from the host application. You are
    free to switch from the dialog to the Photoshop interface and vice-versa.


    Image Adjustments are good candidates to illustrate the modal vs.ess behavior
    difference. As you know, they can be applied in two ways: directly on the layer’s
    pixels (from the ‘image > Adjustments’ menu), or as Adjustment Layers using the
    corresponding button in the Layers panel, and accessing the actual parameters
    in the Properties panel. This is true for all Adjustments, let’s check the Color
    Balance as an example:


    ![](img/b87c0ab2175809458d63805e15cab800_207_0.png)


    Color Balance Adjustment: modal (left), modeless (right)


    In theory, ScriptUI both modal and modeless windows; in Photoshop only modal dialogs
    are available. The truth is that the implementation of modeless, so-called Palettes
    in Photoshop, is inadequate: it has changed over versions and platforms, and currently
    it’s quite buggy,


    *InDesign fully supports ScriptUI modeless windows; actually, InDesign support
    of the whole ScriptUI specs is much more complete.'
