    Converter() works as a Constructor function, where I''ve defined all the variables
    that one can access as properties of the instantiated class. You must use this
    and a dot in the Constructor if you want/need to access them in the instance:


    ```

    var converter = new Converter();

    converter.brightness // 0;

    ```


    For example, I don''t need to access this exact way (you may, though); they hold
    important values that I point to many parts of the Script; think about them as
    the core parameters of the Script is based upon. A significant one is the originalStatus,
    which refers to the current History Status: where you want to be when disabling
    the Preview checkbox (to show the unaltered version of the image), or if the user
    changes dialog.


    The Private Variables (doc) are the ones for internal use, and out of the run
    when the class is instantiated. Before creating the other functions, let me start
    with the autoRun(), so that you can make sense of the entire workflow.


    ```

    363 // Starts the workflow

    364 Converter.prototype.autoRun = function() {

    365 if (this.preflight()) { return false } else {

    366 this.preProcess();

    367 this.createDlg();

    368 this.initDlg();

    369 var result = this.runDlg();

    370 // result = 1 if the user clicks OK

    371 // result = 2 if the user clicks Cancel

    372 this.postProcess(result)

    373 }

    374 };

    ```


    The idea is if preflight() fails (i.e., the current document doesn''t fulfill
    the script-requirements) there''s no point in going anywhere further. If instead,
    everything''s OK, preProcess() prepares the Dialog is built, initialized, and
    the result being stored in a variable. If the user dismisses the Dialog (clicks
    the Cancel button), the returned value is 2, conversely (OK button click) it is
    1. This bit of information is passed along to the postProcess() function, which
    performs the required steps to restore the document to its pristine state or give
    it a touch.


    Now that you know what to expect let''s focus on (almost) each function. The preflight()
    does some initial conditions check, I make sure that if the it is RGB. The returned
    value is a boolean because this way it''s easier to check if the conditions are
    met.


    > In other words, converter.doc is undefined.'
