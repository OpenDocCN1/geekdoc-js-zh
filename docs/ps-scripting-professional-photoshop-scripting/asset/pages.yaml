  md: '# Hello World by Examples


    The entire Chapter 7 is dedicated to Dialogs (i.e., graphical interfaces), for
    now think about alert() as a generic, bare popup text generator. You can try with
    different messages, and Photoshop will obligingly repeat them. The $$. is more
    exciting and will give me the chance to start exploring Script workflows.


    The $ is a Core ExtendScript exclusive (no native JavaScript equivalent) helper
    object containing utilities that you''re going to use in your scripts to access
    information, and perform tasks, that are not directly related to Photoshop operations.
    Think about the $ as a general-purpose toolbox: you open it and find a lot of
    interesting goods. Then mind, if you come from JavaScript, $ has nothing to do
    with jQuery at all.


    OK, it''s a toolbox, but how do you open a thing? Like all objects in JS, you
    can access its properties (associated values) and methods (actions) using the
    .operator — see the illustration below:


    # METHODS


    | Dollar object | Parameter |

    | :--- | :--- |

    | Utilities Toolbar | Here, string surrounded by single or double quotes |

    | about() | |

    | sleep() | writeln("Hello World!"); |

    | version | Dollar operator |

    | locale | Writes a line in the Console.

    | evalFile() | Accepts a parameter between parenthesis() |


    So, you have the $ object, accessing one among its properties and methods available:
    writeln, which stands for "write line". writeln is a method, e.g., an action that
    performs something, and like all methods it has parenthesis that wrap the parameter(s),
    so let''s write it like writeln()$^4.


    The parameter is what you want the method to act upon or use. Like "Dollar, do
    that funny thing I know in your repertoire, called ''write a line''. What would
    you write, you? "Hello World!"


    "Hello World!" is the parameter in a case String, which is to be surrounded by
    single '' or double quotes (either work). How do I know all that — i.e., writeln()
    is one of the methods of the $, and it accepts a String as a parameter? Because
    I found it in the Object Model Viewer (also known as OMV) and the Documentation:


    > > If I were orthodox, I''d write "the named method writeln" without parenthesis,
    because writeln is just its name. Conversely, writes() is what you''d write to
    execute it. However, if I''m unorthodox, and for the clarity sake, I name methods
    with throughout the whole book. I hope you don''t mind.'
