  md: "# 4.2 Collections, Classes and Instances\n\nIn these concepts are still fuzzy\
    \ in your mind, let's make the distinction clear once and for all.\nThe following\
    \ line sums up everything you need to know: guides are going to be our guinea\
    \ pig.\n\n```\nvar g = app.activeDocument.guides.add(Direction.HORIZONTAL,\n \
    \ new UnitValue(50, \"px\"));\n```\n\nThis is a surprisingly complex statement,\
    \ which purpose is to add a horizontal Guide at 50 pixels from the top to the\
    \ currently active document. How to read?\nThe starting point is app, the Photoshop\
    \ application. You could omit it, because the ExtendScript parser would look in\
    \ the prototyp chain for the activeDocument property, and would find it for the\
    \ globally available Application. I suggest you keep writing app—in my opinion,\
    \ the code is more readable and the \"less typing is better\" again never convinced\
    \ me.\\Next comes activeDocument, a special property of app accessed via the dot\
    \ operator, that returns an Instance of the Document Class, which belongs to the\
    \ Documents Collection: a handy way to group homogenous objects.\n\n+   - app.documents;\
    \ the Document Collection.\n- app.documents[0]; a Document Instance of the Document\
    \ Class: accessed by Index from the collection.\n- app.documents.ByName(\"first\"\
    ); a Document Instance of the Document Class: accessed by Name from the collection.\n\
    - activeDocument; a Document Instance of the Document Class: the active one.\n\
    \nThen you access the guides Collection. Besides getting element by Index, Name,\
    \ and the currently active one (like activeDocument, active, etc.) you are allowed\
    \ to:\n\n+   - Query the collection to get the total number of items with the\
    \ read-only length property.\n- Query the collection to get the parent property,\
    \ which refers to the object's container, the Document.\n- Add elements to the\
    \ collection via the add(item) method.\n- When possible, empty the collection\
    \ via the removeAll() method.\n\nThat's the reason why you can add(it) to the\
    \ guides. In Collections jargon, the add(add) method corresponds to it: it returns\
    \ a newly created Instance of the Class. In case of guides, it expects two parameters.\n\
    \nThe first param is a Direction constant; remember, you access a constant following\
    \ the Constantine dot CONSTANTVALUE naming convention, where Direction.HORIZONTAL.\
    \ Where do you find them listed? In the JavaScript Reference, page 202."
