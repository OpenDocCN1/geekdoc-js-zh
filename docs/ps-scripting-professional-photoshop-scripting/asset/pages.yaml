  md: "The tilde in \"~3\" locks the major version in a semantic versioning scheme\
    \ fashion, i.e., major.minor(patch), which specifies it requires Generator Core\
    \ version 3. Also, the plugin entry point must be defined in the \"main\" property,\
    \ main.js - where the actual plugin code is. The structure is:\n\n```\nfunction\
    \ () {\n  \"use strict\";\n\n  var PLUGIN_ID = require(\"/package.json\").name,\n\
    \  MENU_ID = \"tutorial\",\n  MENU_LABEL = \"$$$JavaScripts/Generator/Tutorial/Menu/Tutorial\"\
    ;\n  var _generator = null,\n  _currentDocumentId = null,\n  _config = null;\n\
    \n  // INIT\n\n  function init(generator, config) { /* ... */ }\n\n  // EVENTS\n\
    \n  function handleCurrentDocumentChanged(id) { /* ... */ }\n  function handleImageChanged(document)\
    \ { /* ... */ }\n  function handleToolChanged(document) { /* ... */ }\n  function\
    \ handleGeneratorMenuClicked(event) { /* ... */ }\n\n  // CALLS\n\n  function\
    \ requestEntireDocument(documentId) { /* ... */ }\n  function updateMenuState(enabled)\
    \ { /* ... */ }\n\n  // HELPERS\n\n  function sendJavascript(str) { /* ... */\
    \ }\n  function setCurrentDocumentId(id) { /* ... */ }\n  function stringify(object)\
