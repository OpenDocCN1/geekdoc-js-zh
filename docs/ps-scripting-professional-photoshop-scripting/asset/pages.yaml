  md: '# # 12. Appendix


    # ## 12.1 Deploying Scripts


    At this point, the last piece of the puzzle is knowing how to distribute your
    work: you’ve developed neat scripts, they run fine on your computer, it’s time
    to let others have and use them. Let me give you short checklist of recommended
    practices.


    # ## Testing


    The very first thing to do before releasing scripts into the wild either for free
    or as paid products, as obvious as it sounds, is to test them thoroughly.


    Decide what the supported backward compatibility range is (say, from CC 2015 to
    CC-latest), then install all the versions of Photoshop that page to a Virtual
    Machine software. The Creative Cloud application allows you to download old software
    as CS6: follow the instruction on this page.


    If you don’t have Mac and Windows-based computers, and make sure that your script
    is truly multi-platform – especially, but not exclusively, if it makes use of
    ScriptUI dialogues. Not give anything for granted! In Photoshop, old bugs are
    fixed when new ones are born: QA (Quality Assurance, i.e., testing) is tedious
    and time-consuming, but in the long run pays offalways.


    ![](img/b87c0ab2175809458d63805e15cab800_399_0.png)


    A considerable part of my scripts’ code is dedicated to edge-cases: decide in
    advance which ones you want to deal with, and document all the rest so that you
    can point your users to properinstruction. Don’t over-use try/catch blocks, but
    make sure that, if errors are thrown, they’re less scary as possible to the user.'
  merge: -1
