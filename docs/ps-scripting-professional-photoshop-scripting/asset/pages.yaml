  md: '![](img/b87c0ab2175809458d63805e15cab800_403_0.png)


    Your options range from:


    +   - **manual installation**: copy and paste files in the appropriate folder,
    usually Photoshop’s Presets/Scripts.

    - **ZXP installers**: suitable to be deployed via Adobe Exchange/Add-ons and/or
    installed with third-party tools.

    - **Scripted Installers**: such as my open source project PS-Installer.

    - **Native Installers**: .pkg and .dmg for Mac, .exe for Windows, with an optional
    digital signature.


    It is hard to generalize which is the best option, it really depends on you. In
    any case, I strongly suggest to spend extra time documenting the installation
    process, for it has proved to be the most frequent source of support tickets:
    it wins hands down, and by a large margin.'
