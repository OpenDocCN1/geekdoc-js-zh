    One method opens the file with the system''s default application: for instance,
    it will use Preview or Adobe Reader to open a .pdf, iTunes or your media player
    to open a .mp3, the Terminal or Command Prompt to run a shell, etc.


    ```

    f.execute(); // returns true after the application''s been launched

    ```


    And finally there are the methods that you''re going to use to read and write
    files. First thing you need to do (even, or better especially when, the file doesn''t
    exist), is to open.


    ```

    // Open the file for reading, writing, editing, appending. Mac only: it accepts

    // two optional params as 4 chars strings: type (e.g. "TEXT\ and creator.

    f.open(''r''); // reading

    f.open(''w''); // writing

    f.open(''e''); // editing

    f.open(''a''); // appending

    ```


    When the file is open (and only then), you can perform actions, such as reading
    content.


    ```

    // Reads the content of the file: if no parameter is provided, it reads it all

    // otherwise it reads only the specified number of characters. Returns the string.

    var content = f.read();

    var content = f.read(10);

    // Reads a single character. Special ones are ''CR'' carriage return), ''LF''

    // (line feed) and pairs as ''CRLF'' and ''LFCR''. If the file is encoded,

    // multiple characters must be read and combined to form Unicode characters.

    // Returns the 1 char string.

    var content = f.fetch();

    // Reads an entire line. ''CR'', ''LF'', ''CRLF'', ''LFCR'' are recognized.

    // Returns the string.

    var content = f.readline();

    ```


    Similarly, you have methods for writing content to the file.'
