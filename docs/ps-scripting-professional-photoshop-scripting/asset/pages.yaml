  md: '# Get one property at a time!


    Retrieving the entire application Descriptor is an intensive task; unless you
    need to check several of its elements, it is certainly a better idea to get only
    the property of your interest. Compare the previous "eyeDropperSample" with the
    code that follows, and when possible use the latter one:


    ```

    var r1 = new ActionReference();

    var d1 = new ActionDescriptor();

    var r1.putProperty(s2t("eyeDropperSample"));

    var r1.putEnumerated(s2t("application"),s2t("ordinal"),s2t("targetEnum\));

    d1 = executeAction(r1);

    d1.count // getEnumerValue(s2t("eyeDropperSample"));

    ```


    If you check the count, it''s just 1 - i.e. you''ve got the "eyeDropperSample"
    key² much faster, and resources-savvy. Please note that if you get the entire
    Descriptor, or a single property: I haven''t found the way to add a second one.
    If you''re interested in properties, it might be better to request them by one,
    instead of the entire descriptor. The order matters: putProperty() must be placed
    before putEnumerated() otherwise an error is thrown. As a mark, the above holds
    true not for the "application", but for all objects you can extract Descriptors.


    As a slightly more complex example, let''s find the "uiBrightnessLevel" value:
    a property linked to the Photoshop GUI brightness level, as you''d find in the
    "Photoshop CC > Preferences" menu, Interface tab, Appearance section: in other
    words, whether the Interface should be black, dark gray, mid-gray or light.


