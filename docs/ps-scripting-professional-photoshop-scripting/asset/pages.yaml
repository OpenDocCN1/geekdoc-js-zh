  md: '# Foreword


    Since its inception in 1991, Photoshop has become the most powerful tool in the
    world of image editing. Many people have pushed Photoshop to its limit for creative
    purposes, often to the point where they daydream about tasks that Photoshop could
    more easily, more automatically. Enter Photoshop''s scripting and extensibility
    capabilities, an artist or a developer could have the power in your hands to solve
    more complex problems, be more creative, and save the day.


    I still remember the day when I wrote down the Photoshop rabbit lamenting at Adobe,
    Michael Minness, one of the presenters at the conference, was attending a design
    conference. My friend John N, a former product manager for Photoshop and I, having
    recently started at Adobe, were attending the conference, lamented that the Export
    Layers To Files functionality in Photoshop could only produce PSD or JPEG files
    from the entire document width and height. John emailed me asking if we could
    Export Layers To Files to trim to the exact size of the object on each layer and
    save them as PNG files. I wasn''t sure at that moment but I agreed to try. By
    the next morning, I had a working script that I sent to John, who gave it to Michael.
    Michael demanded the script at the conference and shared it on the web. We literally
    had thousands of designers downloading the script from the web until we shipped
    the changes with the next version of Photoshop. We solved a problem overnight.
    That is the power of scripting in Photoshop!


    Anyone who has written a book can tell you that it is one of the hardest things
    they''ve done in their life. However, there are only a handful of people who have
    tackled writing a book that covers scripting and extensibility, including Chandler
    Williams, Geoff Scott, and myself. I can attest that writing a book about such
    a subject and niche as scripting Photoshop is a highly challenging task that requires
    labor of love to accomplish. Davide Barranca, undoubtedly, has carefully and lovingly
    assembled the most complete book on the subject.


    I hope you appreciate and enjoy what David has put together with this book and
    find a new labor of love scripting Photoshop yourself.


    Jeffrey Tranberry

    Sr. Product Manager, Digital Imaging at Adobe Systems'
