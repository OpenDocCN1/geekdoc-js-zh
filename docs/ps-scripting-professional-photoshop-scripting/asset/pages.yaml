  md: '# User Interfaces


    I''ve created two Panels dialog, with Checkbox on each side. Note the use of Panels
    3px as division lines. Both Checkboxes are listening for a ''Click'' Event, but
    the cb1 is usingaddEventListener(), while the other cb2onClick() as you''re going
    to see, this makes a difference. The callback is shared, just an alert. The buttons
    are used to simulate a ''Click'' Event in various ways: some works for both sides,
    some don''t(the ones I''ve created).Let''s look at them, row by row.


    ![](img/b87c0ab2175809458d63805e15cab800_251_0.png)


    The first row of Buttons doesn''t really simulate a ''click'' Event, but the Event
    itself: the callback. In a way, the result is the programmatic execution of whatever
    is attached to the Checkboxes. In fact the Button 5 calls the cb2onClick() function:


    ```

    bt5.onClick = function() { cb2.onClick() }

    ```


    It works cb2 has an onClick() function; cb2 hasn''t, it uses addEventListener(),
    hence I''ve disabled Button 1. The second row is focus on the callback: Button
    2 borrows cb2 own onClick() function and uses it for cb1. The trick is performed
    by the JavaScript call() function, which accepts a parameter that is considered
    as this value: we are passing cb1 to it.


    ```

    bt2.onClick = function() { cb2.onClick.call(cb1) }

    ```


    The above line translates as: let''s fire the cb2.onClick() function – but onClick()
    will run as if owned by cb1. The third row (Buttons 3, 7) use a peculiar function:
    notify(), which accepts a simplified handler as the parameter (e.g. onClick, onChange).
    The ones prefixed by on.


    ```

    bt3.onClick = function() { cb1.notify(''onClick'') }

    bt7.onClick = function() { cb2.notify(''onClick'') }

    ```


    Quite surprisingly, it works for both Checkboxes, even for the one (cb1) that
    has not proper onClick() handler. Also note that time, the actual Check statuses
    are toggled: if one was unchecked, it becomes checked, and vice-versa. This didn''t
    happen before. The fourth and last row of Buttons (4) creates a UIEvent object
    (page 149 of the JS Tools Guide) and dispatches it:


    ```

    bt4.onClick = function() { cb1.dispatchEvent(''click'') }

    ```'
