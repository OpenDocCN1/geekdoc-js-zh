  md: '# Obfuscation


    In case you''re concerned about your code''s privacy, that is to say, you want
    to protect it from users and developers prying eyes, some kind of obfuscation
    is required. Before going any further, let''s split hair in two for a moment.


    # Minify, Optimize, Obfuscate?


    Minification is the process of compressing your code, usually aiming to be some
    bandwidth-consuming delivery over the internet - not a big concern of ours in
    this context. Usually minified code is stripped of comments and white spaces,
    variable and function names are replaced with shorter strings, etc.


    Optimization targets faster execution


    Obfuscation is a process whose ultimate goal is to make code harder to understand.
    A funny but working example, try to see what a "Hello World" looks like in Japanese
    emoticons.


    As I mentioned earlier in this Course, ExtendScript didn''t particularly to be
    massaged by modern tools. These extended features throw errors from JavaScript
    engines; if you don''t make use of, say, XML literals, old bugs in the language
    implementation (e.g., RegExp, ternary operator) and ES5 syntactic sugar are likely
    to break the code libraries.


    Bitter surprises are around the corner: many years ago I did test as ES5 Shim
    and CryptoJS against a few minification algorithms: I''ve found that if the compressed
    code parsed without errors, you shouldn''t assume that it runs as expected. In
    fact, some functions didn''t behave properly at all. So be careful and test, test,
    test.


    Besides JavaScript obfuscation services (the one I''ve using for HTML Panels is
    the excellent JavaScript Obfuscator Tool), you can export ExtendScript in its
    unique so-called binary file. Open a jsx file in EST and choose "File > Export
    as Binary..." The result is a file with jsbin extension, which you need to rename
    to jsbin before distribution.


    The jsbin is not a real binary format, but that highly sophisticated obfuscation:


    +   1 @JSQINGES@2.0@MyBbyN0ACJAnJSQAnJFBByWZPJ[I]JjJCUZEE[O]B]JNFDCeEI[B]JWJI

    2 jfHaICjBJsFjBjO]BdBjBjHJjFEHFdlHJJdPvUJSzFeFeIIJUBjMjZjFHJJsFjFjUGGNyB

    3 AMEyByN0ABJAEExXHJXSjUIjJMOHjfzBeIRFBeFIdIjBjBjPhbB0DZAEnftJjnAXGFVfby

    4 FnbAB40IAAABAJByB


    Cryptography theory shows that, with any other ciphertext, given an infinite number
    of plaintext/cipher pairs (jsx and corresponding jsbin), you can find the key
    to decode it. Which'
