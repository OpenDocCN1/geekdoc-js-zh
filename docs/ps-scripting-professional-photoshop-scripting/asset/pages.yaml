  md: '# Adobe Generator


    # Preferences


    # 309


    ![](img/b87c0ab2175809458d63805e15cab800_324_0.png)


    Mind you: the Connection SDK implies that Photoshop acts as a server to receive
    incoming connections, and to respond accordingly; whereas Adobe Generator is mostly
    used as a source of outgoing stream of data. Being based on Node.js, though prevents
    you from setting up a socket server in Generator too, and accepting incoming connections.


    # # 10.1 Plug-In development


    Building Plug-Ins is what we do to exploit the Adobe Generator technology. To
    properly set up the environment, we''re suggested to disable the built-in Generator,
    unchecking “Enable Generator” in the above Preferences dialog. Why will we use
    an external version of Generator, instead: according to the [wiki](https://en.wikipedia.org/wiki/Node.js),
    it is “easier to run your own, separate Node.js interpreter, and to point Photoshop
    to, instead of its built-in Node.js interpreter”⁴.


    To clarify this point: Photoshop is equipped with the Generator, you can plug
    a different Generator version, and run it with Photoshop’s own Node.js, but your
    local Node.js runtime. This implies a Socket connection (i.e., the Connection
    SDK) you must check “Enable Remote Connections” in the same Preferences tab –
    leaving Photoshop Server as the Service Name, and password as password. Also,
    make sure you’ve installed a relatively recent version of [Node.js](https://nodejs.org/).


    To deploy your Generator plug-in for production, move the plug-in folder within
    Photoshop’s own Plug-ins/Generator/ folder.


    > *I admit that I didn''t entirely get the reason why it should be easier, but
    let''s assume it is really.'
