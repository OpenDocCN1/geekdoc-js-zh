    \ 7), yet you can easily launch three different modal popup dialogues to communicate\
    \ with the user and/or for user’s input (JS Tools Guide p. 227-229).\n\n+   -\
    \ They are triggered using methods of the application object; so they’re globally\
    \ available, and usually called without prefixing app. These dialogues are modal,\
    \ that is to say: they steal the application focus, and you’re not allowed to\
    \ interact with the rest of the Photoshop interface (if you try, it beeps). Conversely,\
    \ HTML Panels are usuallyless: you can keep them open while doing your business\
    \ with other panels, tools and menus.\nnThe aspect, and sometimes minor features,\
    \ of these dialogues might be different from Mac to Windows, I’ll report bot syntaxes.\
    \ Usually, developers don’t bother.\n\nThe first and simplest dialog is the Alert,\
    \ which pops up with a window with a string. The text can be multiline inserting\
    \ \\n, and the title is set differently on both platforms; the icon can be chosen\
    \ among the default Alert and default Error (which in Windows results in two different\
    \ jingles as, how nice). The return value is undefined.\n\n```\n// Mac\n// The\
    \ title should be the second param, but won’t work, insert it’s everything\n//\
    \ before the first newline. If you omit the second param, though, the\n// will\
    \ never change: default is false (Alert icon)\nalert(\"Nice title here\\nt was\
    \ a dark and stormy night...\\nWith an Alert icon\",\n false);\n\n// Windows\n\
    // Title param works here\nalert(\"It was a dark and stormy night...\\nWith an\
    \ Alert icon\",\n \"Nice title here\", false);\n\n// 99.9% of the times you’ll\
    \ just:\nalert(\"Ugh!\\nSomething wrong, either pray or drink.\");\n```"
