  md: "# Hello World by Examples\n\n```\n10 $.writeln(e.message + \"\\nLine\": + e.line);\n\
    11 }\n```\n\nWhenever an error is *thrown* (happens) between the try curly brackets,\
    \ the pointer goes straight to the catch block, and the Error object passed as\
    \ a parameter – you can inspect it and extract properties such as message, an\
    \ hopefully meaningful description of it, and line i.e., where it exactly happens.\
    \ In our case it'll output:\n\nNo such element\nLine:5\n\nBig news, the whole\
    \ script itself won't break; the code that follows the catch braces is then executed\
    \ normally. A general recommendation is not to use try/catch, because you are\
    \ supposed to take care of all the conditions that may generate errors, and directly\
    \ deal with them if you feel lost/or there's something you cannot control, a chunk\
    \ of code by try/catch. An example is Reading from disk: a log of bad things that\
    \ happen (from disk failure to server disconnection), it's a perfectly reasonable\
    \ choice there.\n\n> The string \"\\nLine:\" string found in the catch block means:\
    \ go to a new line (\\n) and then write Line. You don't add a space, like \"\\\
    n Line\": or the new line will start with a space. So-called escaped characters\
    \ that you will likely be using \\(tab) and \\r (carriage return) which as a matter\
    \ of fact in strings can be used as a newline.\nI've used, so far never explicitly\
    \ talked about, comments – they work this way:\n\n```\n// Double forward slash\
    \ comment a single line\nvar vers = app.version; // They can be appended at the\
    \ end of a line too\n/* Fork slash plus asterisk is used for block comments\n\
    that are allowed to span through more lines.\n The comment block ends with an\
    \ asterisk forward slash */\n$.writeln (vers);\n/* Comment block can be used in\
    \ code as well: ///\n$.writeln (vers) // This has no effect \"*/\n```\n\nNow you\
    \ know about the most common ways to deal with debugging, it's time to get back\
    \ to our layers loop and finally fix it. Ready?\n\nWhat if, instead of deleting\
    \ items in the layers array, you keep a reference of them somewhere, and delete\
    \ them all *afterward* when the looping is completed? Let’s try."
