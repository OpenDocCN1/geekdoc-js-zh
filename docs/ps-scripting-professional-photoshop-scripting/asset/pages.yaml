  md: "# Climbing the DOM\n\nlayers “dependencies”, i.e., the parent-child hierarchy.\
    \ The Layer Spring Cleaning example we did precisely that: back then, we were\
    \ helped by the rigid scheme of named Groups. It's time to try writing some general\
    \ purpose code that walks the Layers DOM no matter their configuration.\n\n> If\
    \ you have a sharp eye, you might have noticed that itemIndex provides you with\
    \ a flat representation of the Layers and Layer Sets stack. It would be much easier\
    \ to loop through such a Collection by itemIndex – rarest of Groups. Alas, this\
    \ is not possible strictly within the DOM, ActionManager is to rescue.\n\nThe\
    \ following script builds a JSON-like representation of the Document's Layers\
    \ stack, and it does so using recursion:\n\n```\nvar layersJSON = logLayer(app.activeDocument.layers);\n\
    $.println(layersJSON.toJSON());\n\nfunction logLayer(collection) {\n  var arr\
    \ = [];\n  len = collection.length;\n  if (len) { \n    for (var i = 0; i < len;\
    \ i++) {\n      arr.push(buildObj(collection[i]));\n    }\n  }\n  return arr;\n\
    }\n\nfunction buildObj(lay) {\n  var obj = {\n    \"name\": lay.name,\n    \"\
    type\": lay.typename,\n    // you can add whatever you want here, e.g.\n    //\
    \ \"blend mode\": lay.blendMode\n    // \"visible\": lay.visible\n    // etc.\
    \ etc.\n  };\n  if (lay.isBackgroundLayer) {\n    obj.isBackground = true;\n \
    \ } else { // No need to have opacity for Background layer\n    obj.opacity =\
    \ lay.opacity;\n  }\n  // Recursion!\n  if (lay.typename == \"LayerSet\") {\n\
    \    obj.content = logLayer(lay.layers);\n  }\n```"
