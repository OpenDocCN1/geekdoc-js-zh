    # Alert popups


    Next, there’s a Confirmation popup, which allows the user to choose between two
    options: Yes or No (which respectively true or false). The title works the same
    as Alerts (platform differences), and you’re allowed preselect the choice with
    the second param⁴.


    ```

    // Mac, second param when false preselects (default)

    ```


    ```

    var really = confirm("Think about it\nWill you marry me?", false);

    ```


    ```

    // Windows, Title works

    ```


    ```

    var really = confirm("Will you marry me?", false, "Think about it");

    ```


    > Be aware that there’s a Mac-only bug: if you select “No” (param is true), and
    the user doesn’t click any button, but escapes with the ESC key, the returned
    value is “Yes”; whereas it should always return false, as it happens on Windows.


    ![](img/b87c0ab2175809458d63805e15cab800_122_4.png)


    ![](img/b87c0ab2175809458d63805e15cab800_122_5.png)


    # Confirm popups


    Lastly, there’s the Prompt dialog, that lets the user input a string, and that
    the returned value of the dialog. The title is broken on Mac as, but you can insert
    a placeholder text.


    *One of those cases where the design is dubious: the param is called noAsDefault,
    which means that if you set true, it preselects No. Conversely, if it’s false,
    it preselects Yes. Counter-intuitive to say the.'
