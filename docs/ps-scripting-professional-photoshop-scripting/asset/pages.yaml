    # Margins and Spacing


    Lastly, two Containers-only properties help to craft your layouts:


    +   - margins are the number of pixels between the edges of a container and its
    external child elements (what in web development would be called padding).

    - spacing is the number of pixels separating one element from its adjacent sibling
    element (what in web development would be called margins, which is kind of awkward,
    isn''t it?)


    While margins can be an array of [left, top, right, bottom] numbers, an object
    with the same properties, or a single number (to set them all equal), spacing
    is always a single number. A visual illustration is as follows.'
