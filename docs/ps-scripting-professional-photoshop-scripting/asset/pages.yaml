    cheeseburger, I''m already happy.


    But anyway: in JS everything is an Object (with Methods and Properties), and there''s
    called a prototypical object "an object used as a template from which to get the
    properties for a new object". A Cheeseburger has the Sandwich object as its prototype,
    which in turn has its own prototype (an Edible Squishy Food), up to the prototypal
    chain until you reach the Object. McDonald''s example shows its limits when it
    comes to Class methods and properties as opposed to Instance ones, but that''s
    OK for a multinational corporation and Scripting.


