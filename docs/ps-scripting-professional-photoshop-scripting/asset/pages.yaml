  md: "# The ExtendScriptDomain\n\n```\n// Rect \"class\"\nfunction Rect(w,h) {\n\
    \  this.width = w;\n  this.height = h;\n}\n// Overriding \"+\" operator\nRect.prototype[\\\
    +\"] = function(r) {\n  return (this.width * this.height) + (r.width * r.height);\n\
    }\n// Instantiating two Rects\nvar r1 = new Rect(50, 100);\nvar r2 = new Rect(20,\
    \ 20);\n// Adding two Rects\nr1 + r2; // 5400\n```\n\nPlease refer to the JavaScript\
    \ Tools Guide for details on using the unary and binary operators available for\
    \ overloading. If you're interested in DOM extension, please jump to this section\
    \ of the book.\n\nConstants have been added to the ECMAScript quite recently,\
    \ but we could use const from the very beginning (an act of revenge...). As opposed\
    \ to what you'd expect, assigning a new value to a constant does not return an\
    \ error, an error is thrown when you try redeclare the constant:\n\n```\nconst\
    \ AUTHOR = \"Davide Barranca\"\nAUTHOR = \"Barranca Davide\"; // no Error here,\
    \ but the new value won't stick\n$.writeln(AUTHOR);\n// Davide Barranca\nconst\
    \ AUTHOR = \"Anonymous\"; // Error: AUTHOR redeclared\n```\n\nWe've already met\
    \ UnitValue (JS Tools Guide p. 230-253), representing measurements (a value bundled\
    \ with its unit of measurement) which can be expressed with more or less verbosity.\n\
