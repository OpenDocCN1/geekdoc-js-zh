  md: '# 7.8 Components minimal reference


    Now that we''ve got a proper understanding about layout tools and coding conventions,
    before going any further I''d like to briefly explain all GUI elements, with very
    minimal code examples on their creation processes - e.g. name, shared by all Containers
    and Controls.


    **Group**, as you know is the basic invisible Container:


    ```

    var d = new Window(''dialog'');

    var grp = d.add(''group'', [0,0,100,100]);

    ```


    **Panel** is a group with default border and a text description:


    ```

    d.add(''panel'', undefined, ''black'', { borderStyle: ''black'' });

    ```


    ![](img/b87c0ab2175809458d63805e15cab800_227_0.png)


    The border can be styled daistically in five different ways, only three of which
    kind-of work: ''black'', the default ''etched'', that to my eyes looks quite flat
    and gray, and ''gray'', that appears undeniably white.


    **Tabbed Panels** also contain **Tabs**, which in turn are regular Containers
    (below, I''ve put the ubiquitous button:


    +   1 var tp = d.add(''tabbedpanel'', [0,0,200,100]);

    2 var tab1 = tp.add(''tab'', undefined, ''First''),

    3 tab2 = tp.add(''tab'', undefined, ''Second''),

    4 tab3 = tp.add(''tab'', undefined, ''Third''),

    5 var btn1 = tab1.add(''button'', [60,20,50,30]);


    **Buttons** are everywhere, just remember that if the name is either cancel or
    ok (case insensitive), the button itself and every sibling of belonging to the
    same container gets the CTA treatment: by default bigger, and wide rounded corners
    – if you want to keep them separate, add child Groups'
