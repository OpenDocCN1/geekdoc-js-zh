  md: "# Cross-Application Communication\n\nbt.onReceived = function(){\"/* ... *\"\
    }\n\nIt is fired when the message gets to the target, and acts as a dispatching\
    \ receipt. An entire copy of the original message is passed as a parameter, but\
    \ stripped of the body, which is empty. It is rarely used, but as an example:\n\
    \n```\nif (BridgeTalk.isRunning('bridge')) {\n  // Keep ESTK open to read the\
    \ log messages\n  var bt = new BridgeTalk();\n  bt.target = 'bridge';\n  bt.body\
    \ = `$.$.('Bridge alerting...')`;\n\n  bt.onResult = function(response) {\n  \
    \  $.$.('onResult');\n    parseResponse(response);\n  }\n\n  bt.onReceived = function(response)\
    \ {\n    $.$.('onReceived');\n    parseResponse(response);\n  }\n\n  bt.onTimeout\
    \ = function(response) {\n    $.$.('onTimeout');\n    parseResponse(response);\n\
    \  }\n\n  bt.onError = function(err) {\n    $.$.('onError\\n' + err.body);\n \
    \ }\n  bt.send(20);\n  $.println(\"Process completed\");\n}\n\nfunction parseResponse(res)\
    \ {\n  var headers = \"\";\n  for (var prop in res.headers) {\n    headers +=\
    \ \"\\t\" + prop + \": \" + res.headers[prop] + \"\\n\";\n  }\n  var retVal =\
    \ \"===================\\n\"\n  \"sender: \" + res.sender.toString() + \"\n```"
