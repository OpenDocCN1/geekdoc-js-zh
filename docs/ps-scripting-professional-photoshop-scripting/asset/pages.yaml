    # Classes and Instances


    I''m not the fast food of man, but once in a while, my wife and I bring the 12yo
    to McDonald''s or any nearby available equivalent. One time, I made a joyful discovery:
    they''ve installed touch screens as tall as I am, using which you''re able to
    order your junk without interacting with a human being. Coolest ever for introverted
    food authors around the world. You, scroll, and scroll through screens of food
    until you find the one you''re liking to make.


    Those pictures, archetypal representations of sandwiches, are Classes. You can''t
    eat them; they''re standing for the actual sandwich - the one you order or pay,
    that will bring you shortly thereafter. The squishy thing that you hold in your
    hands is an instance of the Cheeseburger Class. To make it, the McDonald''s employee
    uses a constructor, which is a function that runs each time she''s cooking a Cheeseburger
    and returns it. One Class, many possible instances. Some constructor parameters
    such as bread, hamburger, and cheese may be required or implied; others are optional
    - no cucumber for me, please.


    I''m confident that any JavaScript expert reading this head of a heart-attack
    about in the middle of the last page, so she''won''t mind if I don''t do too much
