    FileSystem: the variable holds a Folder object with a valid reference to a Filesystem
    folder, that may exist or not.

    As a Folder Instance, fol has interesting properties and methods – like before,
    I''m listing here the most relevant in my opinion, have a look at the JS Reference
    for extra information.'
