    | This is a Dialog window | This is a Palette window | This is a Window window
    |

    |--- | --- | --- |

    | Modal Dialog | Modelless Palette | Modelless Window |

    | Got It | Got It | Got It |


    | This is a Dialog window | This is a Palette window | This is a Window window
    |

    |--- | --- | --- |

    | Modal Dialog | Modelless Palette | Modelless Window |

    | Got It | Got it | Got it |


    A ''dialog'' is the commonly used window for Photoshop interfaces. It''s modal,
    so as long as it''s open, the user won''t be able to interact with the rest of
    the host application. It has an optional title bar, no closing button but one
    maximize – users will have to type the ESC key or click a button that you must
    dismiss to dismiss.


    The ''palette'' is the dialog''s modelless sister. It has a close button, which
    in Photoshop is since the palette won''t stick around long; as soon as you create
    it, it fades and dies like one of those particles scientists create under the
    CERN''s Large Hadron Collider. If you absolutely need a modelless, CEP panels
    are the best choice. A couple of Palette hacks have been found on my blog here
    after years of frustration, I now advise against using – only if I''ve already
    mentioned, because engineers made clear that palettes are not meant to work in
    Photoshop; and if they do, it''s by accident.


    Finally, there''s a ''window'', with collapsing, expanding and closing buttons
    as so. I''ve never run into such a bug in my scripting career – I''ve tried here
    for I''m a curious boy: it has a behavior similar to the Palette (non modal, tends
    to die immediately, works here too), but it shows the same bugs of the modelless
    sister; life safe peaceful, and forget about it.


    Focusing on Dialogs, let''s see the optional constructor parameters: this pattern
    is going to be used with other elements too.


    ```

    // new Window (type, title, bounds, {creation_properties})

    var d = new Window(''dialog'', ''A Dialog'', [100,100,300,300], {resizable:true});

    d.show();

    ```


    Please note that instantiating a window doesn''t immediately show it: that''s
    the job of the appropriately named show() method. In every ScriptUI element you''re
    going to build, besides the type (here ''dialog''), everything is optional; such
    parameters can be defined in a later stage,


    > In the Documentation, listing parameters in square brackets are they''re optional.'
