  md: '# Action Manager


    In your exploration of the Action Manager underworld, you might find that, in
    cases, some actions don''t translate in a useful manner. There might be a slight
    difference in logged code among versions, if you happen to have a very old Photoshop
    (e.g., CS3), your hard drive doesn''t run out of space because of it, it might
    be a good idea to keep and install the ScriptListener in its tool. Just case


    Another mild, related with newer versions of Photoshop, is that the ScriptListener''s
    signal/noise ratio in the logged code is getting worse: the changes it contains
    plenty of "modalStateChanged" or "modalHTMLPending" references that are to your
    purposes pointless. They take into account things such as the status of proprietary
    HTML Panels in the Photoshop GUI (e.g., the Recent Files and New File dialogs);
    you don''t really care about that.


    # 6.4 charIDs and stringIDs


    In your guinea pig, let''s use the Action Manager equivalent of the C code you''ve
    already seen, with the UnSharp Mask event, which as follows


    ```

    1 var idUsM = charIDToType("UnSm");

    2 var desc3 = new ActionDescriptor();

    3 var idAmnt = charIDToType("Amnt");

    4 var idPrc = charIDToType("#Prc");

    5 desc3.putUnit(idAmnt, idPrc, 300.000000 );

    6 var idRds = charIDToType("Rds");

    7 var idPxl = charIDToType("#Pxl");

    8 desc3.putUnit(idRds, idPxl, 1.0000000 );

    9 var idThsh = charIDToType("Thsh");

    10 desc3.putInteger(idThsh, 5 );

    11 executeAction(idUsM, desc3, DialogModes.NO );

    ```


    In case you have doubts about how to produce it, install the ScriptListener plugin,
    restart Photoshop, open a file and apply the filter—you the above snippet logged
    among much other stuff in the ScriptingJs file on your desktop.


    The very first thing I''d like you to notice is the ubiquity of the charIDToTypeID()
    function. Each and every Action snippet contains it, or its cousin stringIDToTypeID()—
    which are both globally available since they are methods of the app object (hence
    app. can be omitted). What is that about all?


    Back in Photoshop 4, when the whole business of Actions and related underlying
    events started, every programmable event was given a unique identifier, a four
    characters string (a charID). In the context of Automation Plugins, the charID
    was used as the key in a Hash Map to retrieve the associated event;'
