  md: 'This tiny Dialog is quite simple: the Window orientation is to column, and
    the two main elements are a Panel and a Group (which is, basically, a hidden container).
    Each one of them holds rows of elements: a Slider and an EditText for first, a
    Checkbox and a couple of Buttons the second. Please note that the Checkbox uses
    the alignment prop to override the Group''s alignment, as we see in the previous
    example.


    I used to call this coding "Variable based", because each element I may need to
    refer to (either now, while building the dialog structure, or when I''m being
    event listeners) into a variable. Retrieving values is quite easy — say that you
    want to know whether the Preview checkbox is ticked: it''s just a matter of checking
    c.value.


    Besides this approach, others are using the Dialog object to keep track of the
    elements, so that the same code becomes


    # Object based style


    ```

    1 var dlg = new ''dialog'');

    2 dlg.text = ''Coding Conventions'';

    3 dlg.orientation = ''column'';

    4 dlg.alignChildren = [''fill'', ''fill''];

    5 dlg.radiusPanel = dlg.add(''panel'');

