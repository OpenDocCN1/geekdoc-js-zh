  md: "# Cross-Application Communication\n\nI've found particularly unreliable to\
    \ work in ESTK when BridgeTalk is concerned. For instance, callbacks (which will\
    \ be covered in the next session) may be bypassed, BridgeTalk always behaves asynchronously,\
    \ etc. I strongly suggest you write a file on disk and run it in Photoshop.\n\n\
    # 11.3 Event handling\n\nIn asynchronous code, callbacks are the way to go to\
    \ control and guide the Events flow. Let's set up a little scenario involving\
    \ Photoshop and Bridge: PS wants to know how many files are currently selected\
    \ in BR and open.\n\nA selected document is a Thumbnail object in Bridge link,\
    \ stored in the app.document.selections collection. Conveniently, a Thumbnail\
    \ has a property. To test this, select a couple of files in Bridge and run the\
    \ following lines in the Console:\n\n```\napp.document.selections\n//object Thumbnail;object\
    \ Thumbnail\napp.document.selections[0].path\n//Users/davidebarranca/Desktop/test.jpg\n\
    ```\n\nSo, Photoshop (the sender) is going to dispatch a BridgeTalk message to\
    \ Bridge (the target), with a Payload (the body) that consists of Bridge Scripting\
    \ code (involving the selections collection). In Bridge, the result of the evaluation\
    \ of the script is stringified and packed as the body of a response object, that\
    \ in turn is passed as the parameter of the onRequest() callback function, that\
    \ (if present) is invoked. onResult is triggered by the sender (Photoshop), and\
    \ it serves the purpose of elaborating the response for the target (Bridge); in\
    \ our case, PS will open the files Bridge has handled. Let's implement this now.\n\
    \n```\nif (BridgeTalk.isRunning('bridge')) {\n  var bt = new BridgeTalk();\n \
    \ bt.target = \"bridge\"\n  bt.body = \" + getSelectedFilesPath.toString() + \"\
    ;getSelectedFilesPath();\"\n  bt.onResult = function() {\n    var filesArray =\
    \ eval(response.body);\n    for (var i = 0; i < filesArray.length; i++) {\n  \
    \    app.open(new File(filesArray[i]))\n    }\n  }\nbt.onerror = function(err)\
    \ {\n  alert(\"Error!\\n\" + err.body)\n}\n```"
