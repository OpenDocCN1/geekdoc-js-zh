  md: "# The ExtendScriptDomain\n\nYou can extend the JavaScript DOM for an application\
    \ by writing a C or C++ shared library, compiling it for the platform you are\
    \ using, and loading it into JavaScript as an ExternalObject. A shared library\
    \ is implemented by a DLL in Windows, a bundle or framework in Mac OS, or as a\
    \ SharedObject in UNIX.\n\nI'm afraid I'm no C developer, but I cannot inform\
    \ you about this feature. If you're inclined, you can try compiling in XCode or\
    \ Visual Studio a demonstration library called \"BasicExternalObject\" that is\
    \ found in the Extend Samples/cpp folder.\n\nThe big deal of External Objects\
    \ is enabling you to call C/C++ functions in the ExtendScript context. If you\
    \ have experience with HTML Panels, you might have met External Objects when dispatching\
    \ custom ExtendScript Events in JXS (to be listened by the Panel's JS). The code\
    \ looks like this:\n\n```\ntry {\n  var xLib = new ExternalObject(\"lib:PlugExternalObject\"\
    );\n} catch (e) { alert(e); }\nif (xLib) {\n  var eventObj = new CSXvent();\n\
    \  eventObj.type = \"com.davide.customEvent\";\n  eventObj.data = \"some payload\
    \ data...\";\n  eventObj.dispatch();\n}\n\n```\n\nAnother use of ExternalObject\
    \ is to load the XMP Scripting API, which happens to be the subject of the next\
    \ section.\n\n# 5.11 XMP\n\nThis is an essential topic that deserves a section\
    \ of its own (Chapter 8), but I'm listing it here as well since it's one of the\
    \ peculiar features that make ExtendScript the remarkable language it is (JS Tools\
    \ Guide p. 256-293). XMP stands for extensible Metadata Platform: a technology\
    \ first created by Adobe, now standardized (it's under the wins of ISO since 2012)\
    \ that deals with the creation, processing and exchange of metadata information\
    \ in digital media.\n\nXMP is used, for instance, by photographers for copyright\
    \ information, or by cameras when creating the file to say, geo-tag pictures with\
    \ GPS data. In the context of more complex (and very likely: automated) workflows,\
    \ metadata is crucial to keep track of the various steps a file undergoes— thinking\
    \ about 3D pipelines, or DAM (Digital Assets Management).\n\nSince 2008, in order\
    \ to embed metadata on a file, Photoshop also supports per layer metadata, a fascinating\
    \ and perhaps little-known fact. Refer to Chapter 8 for more extensive coverage\
    \ of the topic."
