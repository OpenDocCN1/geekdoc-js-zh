  md: "# User Interfaces\n\ndlg.buttonsGroup.value. Also note that the indentation\
    \ is optional, and added for clarity's sake.\n\nThe next option makes use of a\
    \ so-called \"Resource String\": an object-based notation, embedded within a long\
    \ string, which is then fed to the Window constructor. please ExtendScript requires\
    \ a backslash \\ at the end of each line, to consider the string as multiline\
    \ – ESTK gives you instant feedback if the code is properly formatted or not,\
    \ e.g., there's an extra space after the backslash. Alternatively, you can wrap\
    \ the string with triple \"\"\" quotes³.\n\n```\nvar s1 = \"This is a string that\
    \ can be written\\n  using several \";n// This is a string that can be written\
    \ using several lines\nvar s2 = \"\"\"This is\\n  a true\\n  multiline string\"\
    \"\";n// This is.\n//  a true\n// multiline string\n```\n\nThe code from our test\
    \ dialog becomes:\n\n# Resource String based style\n\n```\nvar res = \"\"\"dialog\
    \ {\n  text: 'Coding Conventions',\n  orientation: 'column',\n  alignChildren:\
    \ ['fill','fill'],\n  radiusPanel: Panel {\n    orientation: 'row',\n    text:\
    \ 'Radius',\n    radiusSlider {\n      size: [200,30],\n      value: 10\n    },\n\
    \    radiusText: EditText {\n      text: 10\n    }\n  },\n  buttonsGroup: Group\
    \ {\n    alignChildren: ['right','fill']\n    preview: Checkbox {\n  }\n}\\}\n\
    ```\n\n> ³ The triple quotes \"\"\" used in the context of a String will keep\
    \ track of the existing carriage returns as well, transforming their content into\
    \ an actual multi-lines string, whereas the backslash is just a handy way for\
    \ you to spread the text to several lines – nevertheless the result is one-line\
    \ String."
