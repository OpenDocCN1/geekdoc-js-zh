  md: "# Hello World by Examples\n\nThere is one last, small optimization that I would\
    \ like to make before calling quit this exercise. Earlier in this Chapter, I have\
    \ mentioned functions, so it may be convenient to expose those you who are approaching\
    \ software development for the first time to this fundamental concept. A function\
    \ is to encapsulate a task in a reusable form: as a rule of thumb, each time you\
    \ run into the same code that does the kind of job in places of your program,\
    \ you may want to wrap it with a function and call it as many times as needed.\n\
    \nLet's use a dummy example first, to understand the syntax; then we'll apply\
    \ our knowledge to the Layers code. Say that you are debugging a Script, and you\
    \ want your log messages to be popped up as alerts and written to the ESTK Console\
    \ without bothering to write the same string twice each.\n\n```\nalert(\"Script\
    \ Started!\");\n$.writeln(\"Script Started!\");\n// ...\nalert(\"About to loop\
    \ the Array\");\n$.writeln(\"About to loop the Array\");\n// ...\nalert(\"Finished\
    \ with the Array\");\n$.writeln(\"Finished with the Array\");\n```\n\nYou get\
    \ the idea. Instead, you would rather prefer something shorter:\n\n```\nlogAll(\"\
    Script Started!\");\n// ...\nlogAll(\"About to loop the Array\");\n// ...\nlogAll(\"\
    Finished with the Array\");\n```\n\nThe problem is that logAll() is not provided\
    \ by Photoshop, so you have to... build your first function! This example is ideal,\
    \ because you have a repetitive function, with one single variable: the string\
    \ used for logging purposes. In other words, you need to always do the same thing\
    \ – alert() and $.writeln() – each time with a different message. The code is\
    \ as follows:\n\n```\n// function declaration\nfunction logAll(message) {\n  \
    \  alert (message);\n    $.writeln (message);\n}\n// function call\nlogAll(\"\
    Debugging time...\");\n```"
