  md: 'Photoshop Scripting


    To sum up:


    +   * Scripting is a way to programmatically drive Photoshop using code.

    * A script is allowed to access only the commands that Photoshop itself has, and
    are exposed to the Scripting interface.

    * These commands bypass, and won''t need, the User Interface.

    * Instruction should be written according to the rules of a language that Photoshop
    can understand.


    # 1.3 Languages and Documentation


    Speaking about languages, Adobe scriptable applications (Photoshop included) can
    be driven using either:


    +   1. AppleScript (Mac only).

    2. VBScript (Win only).

    3. ExtendScript.


    Only the latter option is multi-platform and can be used directly within Photoshop
    – whereas both AppleScript and VBScript need to be run from outside the application.
    If you''re already familiar with a platform-specific scripting guide, it may make
    sense to look at AppleScript or VBScript (in a different book...). Otherwise,
    a one-language-fits-all approach (ExtendScript) is wiser in my opinion.


    # ExtendScript vs. JavaScript


    ExtendScript is what this course is entirely based upon, so why does the title
    mention JavaScript? According to the After Effects Scripting Guide¹¹¹


    > “After Effects scripts use the Adobe ExtendScript language, which is an extended
    form of JavaScript used by several Adobe applications, including Photoshop, Illustrator,
    and InDesign. ExtendScript implements the JavaScript language according to the
    ECMA-262 specification. The After Effects scripting engine supports the 3rd Edition
    of the ECMA-262 Standard, including its notation and lexical conventions, types,
    objects, expressions, and statements. ExtendScript also implements the E4X ECMA-357
    specification, which defines access to data in XML format.”


    ¹¹The quote is found in this pdf – I don''t know why Photoshop documentation doesn''t
    mention it.'
  merge: -1
