  md: '# Working with Metadata


    I would suggest looking at the illustration from right to left. You have stored
    two key/value pairs into an ActionDescriptor, which in turn is stored as the value
    of the "unDavide" key in a Registry. You may be slightly suspicious about those
    s2t() functions: why are they needed, and what’s the type of the ‘country’ String
    after?


    Each key/value pair, by definition, needs a key: so if you’re storing ''Italy''
    and 42 as values, keys must be provided as well; especially to allow you to retrieve
    the values back, which you’ll see in a moment. On the other hand (if I discussed
    in Chapter 6, the stringToID() function (shortened in s2t())) returns a String,
    and anything¹—which is exactly all the ActionDescriptor put-methods does require
    keys.


    How do you query the registry for CustomOptions?


    +   // Get back the CustomOptions


    ```

    var d = app.getCustomOptions(''unDavide'');

    var country = d.getString(''country'');

    var age = d.getInt(s2t(''age''));

    ```


    ```

    alert(''Custom Options for the key: ''unDavide'' + "\nage: " + age);

    ```


    You can remove the CustomOptions using eraseCustomOptions¹⁴, passing the key String.


    +   // Delete CustomOptions


    ```

    app.eraseCustomOptions(''unDavide'');

    ```


