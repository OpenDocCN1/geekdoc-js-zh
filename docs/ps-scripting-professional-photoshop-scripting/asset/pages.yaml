  md: '# 4.1 The Tree of Scripting Life


    This Chapter’s cover image is one representation of the evolutionary relationships
    connecting Earth’s various forms: what evolutionary biologists would call a big,
    circular phylogenetic tree¹. For your information, we’re around 10:30 PM, yellow
    section, in Mus musculus (mouse mouse) and Typhloectates (rubber eel).


    Such a remarkable piece of art/science is there to remind you that stuff in this
    world is connected – and Photoshop Scripting makes no difference. I know it’s
    a bold leap, bear with me.


    You’ve already met in the previous Chapter Object properties, which in turn can
    be Object themselves. For instance, the app.documents collection, a property of
    the app object that contains several document objects. It is to say that it exists
    a “Tree of Photoshop Scriptable Things” – way much simpler than the actual tree
    of life, so each time you lost in PS code, think that it could be: you could be
    an evolutionary biologist.


    We use to refer to theofoshop internal connections as the Document Object Model,
    also known as the DOM. Each time you refer to a property, such as a Guide position,
    or a Layer’s opacity, you’re traversing the DOM. We’ve already encountered this:


    ```

    app.documents[].LayerSets.getByName("Skin").Layers[].opacity

    ```


    Here, you’re interested (read the code backward) in the opacity of the topmost
    layer that you get by Index, inside a LayerSet called “Skin”, which happens to
    belong to an open document of the Photoshop application. You’re following the
    tree, from the main trunk (the app object), up to the document branch, until you
    finally reach the opacity limb.


    An utterly simplified version of the Photoshop Application Tree is as follows:
    there, only Collections shown.


    ![](img/b87c0ab2175809458d63805e15cab800_76_0.png)


    > ¹You can print and hang it on the wall, the recommended size is at least 54”
    wide; find it here (B/W).'
