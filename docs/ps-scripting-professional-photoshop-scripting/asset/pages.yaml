  md: '# User Interfaces


    # 262


    The Object GET request has fetched (you see it contains several other properties),
    and passes to the Photoshop''s ExtendScript engine. It does so first instantiating
    a cInterface from the cInterface class; it uses its evalScript() method to call
    an ExtendScript function named alertLipsum() (declared in the photoshop.jsx file,
    passing it to the lip variable that contains the Lorem Ipsum.


    As you remember, the can run ExtendScript commands directly, so it has to hand
    them as strings to the Photoshop engine via evalScript(). At this point, the alertLipsum()
    function is in charge of copying the text in the clipboard and firing an alert.


    ```

    function s2t(s) { return app.stringIDToTypeID(s);

    function alertLipsum(lip) { // Copy the lip in the Clipboard

    var d = new ActionDescriptor();

    d.putString(s2t("textData''), lip);

    executeAction(s2t("textClipboard"), d, DialogModes.NO);

    // Fire the alert

    alert("Lorem Ipsum - Copied to the Clipboard\n" + lip);

    }

    ```


    ![](img/b87c0ab2175809458d63805e15cab800_277_0.png)


    As you see, the Copy to Clipboard function is based on ActionManager. Don''t feel
    overwhelmed by this demo panel – at first, it''s easy to get lost in the various
    steps CEP requires, but one gets to use them quickly. If you inclined, you can
    try adding a ''click'' handler for the Reset button, that should bring the Slider
    and the Text Input back to 50.


    See on the next page a selection from the Demo Panels included in my other course
    Adobe Photoshop HTML Panels Development.'
