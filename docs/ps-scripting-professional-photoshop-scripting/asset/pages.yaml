    ![](img/b87c0ab2175809458d63805e15cab800_195_0.png)


    Per ise, it visualizes a bunch of irrelevant data, unless you know how. When binary
    data is stored in a data stream, it is just a linear sequence of information;
    as an example, let''s consider the string "DB20161204". Quite unintelligible,
    unless you know (say) that the first two letters (DB) are the author signature;
    the following eight represent the date in YYYYMMDD format (20161204), and the
    last two revision of this Chapter.


    Without this information, you cannot decode the string; you need a map for the
    rawData stream — that comes to the Adobe Photoshop File Specifications32.


    | Length | Description |

    |---|---|

    | 2 | Version (2) |

    | 1 | Settings for hue-adjustment; 1 uses for coloration. |

    | 1 | Padding byte; must be present but ignored by Photoshop. |

    | 6 | Coloration.

    | The first two actual values are for the new version. Hue is -180..180, Saturation
    is 0..100. The user interface represents hue as -180..180, saturation as 0..100,
    and Lightness as -100..100. The other data interface represents hue as 0..255,
    saturation as 0..255, and lightness as 0..255. |

    | 6 | Master hue, saturation and lightness values |

    | 6 | For RGB and CMY values, each of the six bytes in the header file contains
    color: each pixel represents red, yellow, green, cyan, blue, or magenta. |


    This document describes the various Photoshop formats (e.g. pdf or tif) store
    data. It turns out (by comparison) that in this case the "legacyContentData" shares
    a lot with the Hue/Saturation settings (BBHA on Mac, AHV on Windows) that the
