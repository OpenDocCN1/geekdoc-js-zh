  md: '# 10. Adobe Asset Generator


    Real-time Image Asset Generation is a feature that Photoshop enthusiastically
    introduced with the first point update of the CC era (version 14.1, in late 2013),
    to suit the needs of web/game/UI designers; it allows users to export Layers/LayerSets
    into .jpg and .png files — automatically, and in the background.


    ![](img/b87c0ab2175809458d63805e15cab800_322_0.png)


    A lesser known to the general audience, a remarkably interesting for us developers,
    is that Assets Generation relies on a solid technology that we''re allowed to
    take advantage of for a variety of other options.


    In fact, Photoshop embodies a Node.js server — if you''ve never heard of Node,it''s
    a popular JavaScript runtime on Chrome''s V8 JavaScript engine; basically, a JS
    engine transplanted out of the Browser (and in, directly into Photoshop)¹.


    > Especially if you are familiar with HTML Panels (which, too, can use Node.js),
    you must be aware that CEP''s Node.js and the one I''ll discuss here are two separate
    teams. They''re proper Node.js environments, but their version numbers differ
    — I can only speculate about the reason why². At the time of this, the node executable
    in Photoshop 19.1.3 is v8.10.0, whereas CEP''s is v7.7.4.


    *We''ve had the ExtendScript engine built-in Photoshop for many years, I''ve not
    felt the excitement that the world would by storm when Node.js got into the limelight.

    ²I''d say they''re two separate engineering teams, following two separate development
    cycles. At all events, Photoshop CC sports not one but two Node.js runtimes.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Adobe Generator


    Even though it''s Node.js at its heart, the Asset Generation technology and the
    glue that creates an entirely new branch of scripting development is usually referred
    to as Adobe Generator. The project has been opened from the early days and can
    be found in Adobe’s official generator-core repository. This Chapter is basically
    a commented walkthrough the available documentation – that Adobe style is halfway
    for internal use, halfway for the general public, hence not very friendly – a
    series of new offline blog posts by the former Adobe Product Manager Tom Krcha,
    plus a good deal of personal experimentation.


    Developers have four different options to choose from, in the Photoshop extensibility
    layer.


    +   - ExtendScript (i.e. pure scripting).

    - CEP (HTML) Panels.

    - The Photoshop Connection SDK.

    - Adobe Generator.


    I mention the Connection SDK (included in the Photoshop SDK) because we''ll need
    it in a moment. If you''ve never heard of the Connection SDK – also known as Kevlar,
    or KVLR – it is piece of technology supported since Photoshop CS5: you can set
    up Photoshop as a Server, accepting incoming TCP/IP connections, and exchange
    ExtendScript strings, Images, Events or arbitrary data.


    ![](img/b87c0ab2175809458d63805e15cab800_323_0.png)


    # The Photoshop Connection SDK


    The idea being that developers can build multi-platform applications for any kind
    of device (please note that AIR was still trendy back then), which are then able
    to communicate with Photoshop via Socket connections³.


    The Photoshop server is enabled in the Plug-Ins tab of the Photoshop Preferences
    dialog, with a default password of password.


    > ³Adobe did release some mobile applications relying on the Connect SDK, one
    of which let you group a subset of items that belong to the Photoshop Tools Palette,
    that were displayed on the iPad for you to tap and select.'
  merge: -1
  pgno: 323
