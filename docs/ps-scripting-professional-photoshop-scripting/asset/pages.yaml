  md: "# 5.4 Preprocessor Directives\n\nIn the JavaScript world, there's much interest\
    \ in Preprocessor Directives would fit as loaders, like RequireJS or ASM. I'm\
    \ not sure whether Preprocessor Directives yet include code from separate files,\
    \ allowing a great deal of modularization and separation of concerns (JS Tools\
    \ guide. 223-235).\n\n```\nglobals.jsx\n  GUI\n    assets.jsxinc\n    dialog.jsx\n\
    \  libs\n    PSUtils.jsxinc\n  main.jsx\n```\n\nLet's assume you have a folder\
    \ structure like this one, where main.jsx might need to access code from other\
    \ sources. Please note that some files have a .jsxinc extension, which is traditionally\
    \ recognized for included files - not all mandatory, it is a convention: their\
    \ content is plain and standard ExtendScript.\n\nIn case you need just globals.jsx\
    \ you can put the preprocessor directive at the beginning of your code (please\
    \ note the number sign/hash):\n\n#include \"globals.jsx\"\n\nThe quotes are optional\
    \ but when there are spaces in the filename or path. Speaking of the path, the\
    \ syntax assumes that the file is in the same folder as main.jsx, while the following\
    \ lines deal with libs/PSUtils.jsxinc.\n\n#include \"globals.jsx\"\n#include \"\
    libs/PSUtils.jsxinc\"\n\nYou can also specify paths, to be used by subsequent\
    \ include directives to look for files.\n\n#includepath \"GUI\"\n#include \"assets.jsxinc\"\
    \n#include \"dialog.jsx\"\n\nA couple of things to notice. First, paths that start\
    \ with / (forward slash) are absolute. Developers may use include directives at\
    \ the very beginning of the file, even if they seem to work anywhere. For a Photoshop...\"\
    characteristic\", #include in the context of HTML Panels' JSX files won't work.\
    \ Last, to if you happen to run into a slightly different syntax such as this:\n\
    \n```\n//@include \"globals.jsx\"\n//@include \"libs/PSUtils.jsxinc\"\n```\n\n\
    It's there for backward compatibility (CS or CS2), and/or to escape code linting\
    \ errors.\n\nIn addition to code include"
