  md: '# User Interfaces


    The idea behind this script is to provide a B/W version based on one of the available
    R, G, B Channels (plus the Luminosity), and add a Brightness/Contrast adjust on
    top. If it looks trivial, the implementation isn’t: first, the Channels choice
    and the Adjustments are applied live. Hence you''ll need to walk back into the
    original History State before applying any routine – otherwise, you''ll end up
    running multiple adjustments on top of the other. Second, I played a bit with
    ScriptUI nested containers, styles, and I''ve used a Custom component to join
    the Channels histogram. Third, I''ve implemented a solid Object-Oriented architecture
    that you can adapt to any other routine of yours. Your script invokes:


    +   - Preflight: before launching the actual check, if it is in the appropriate
    Colorspace (my example needs RGB as the starting point); you can insert here all
    sorts of tests, etc., whether the active layer is, has a mask, any kind of file
    processing that you need the original file to undergo applying the main routine.
    Here it creates a new layer on the stack; then it merges the layers on it.

    - Dialog Creation: where the ScriptUI Window is set up using a resource string,
    but other approaches appear.

    - Dialog Initialization: applying styles, attaching Event Listeners, definingcallbacks.

    - Dialog Run: I''ll discuss the dialog.

    - Post-Processing: any cleaning routine that may be needed (Layer rendering, etc.).

    - Dialog Auto-Run: A utility that is in calling the proper sequence of functions
    the ones I’ve listed above.


    Since the Script is +400 lines of code, I won''t show it here in its entirety.
    I''ll present you with the main architecture, and I''ll discuss important parts
    that are worth mentioning: you can always check the full code in the Demo.js and
    Demo.jsxinc files (I to keep the util functions in a separate file I include in
    the main). The structure is as follows:


    ```

    #include DemoScript.jsxinc

    var Converter = (function() {

    // Constructor

    function Converter() { /* */ }


    // Preflight

    Converter.prototype.preflight = function() { /* ... */ }


    // Pre-processing

    Converter.prototype.preProcess = function() { /* ... */ }


    // Create the Dialog

    Converter.prototype.createDlg = function() { /* ... */ }

    ```'
