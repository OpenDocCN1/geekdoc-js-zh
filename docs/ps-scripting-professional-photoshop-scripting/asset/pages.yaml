  md: "# Cross-Application Communication\n\n```\nBridgeTalk.onReceive = function(message)\
    \ {\nswitch (message.type) {\n  case \"iterator\":\n    var done = false;\n  \
    \  var i = 0;\n    while (!done) {\n      message.sendResult(eval(message.body));\n\
    \      BridgeTalk.pump();\n    }\n    break;\n  default:\n    return eval(message.body);\n\
    }\n}\n```\n\nThe key is in the \"iterator\" case: a boolean is a counter is initialized\
    \ to zero: both are used in the loop. The message.sendResult() sends back the\
