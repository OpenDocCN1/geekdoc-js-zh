  md: '# Generator Getting Started


    What I''ve called "a different Generator version" in the previous paragraph, is,
    in fact, the source code from generator-core: The Node.js library that communicates
    with Photoshop over the Connect SDK (aka Kevlar), and exposes the event-based
    API to Generator plugins. Download it from GitHub, and unzipt it in the base folder
    from name; then open the Terminal, cd into the unzipped generator-core-master
    and run npm install to satisfy the required dependencies.


    ![](img/b87c0ab2175809458d63805e15cab800_325_0.png)


    Our first plugin-in is to get Tom Kracha Generator Getting Started, that I''ve
    forked here, bumping the Generator Core version in the package.json to ~3 to support
    the currently available Generator.


    In the base folder, create a new plugin/ folder and unzip the generator-getting-started-master
    (see the screenshot). There''s nothing to npm install in here this time.


    Launch Photoshop and open an image. In the Terminal, cd into the generator-core-master
    (not the plugin) and type:


    ```

    node app -f ../plugins

    ```


    You are starting the external Generator Core application with the -f flag. A list
    of flags is found in the Core''s app.js file:


    ```

    63 "p": "Photoshop server port",

    64 "h": "Photoshop server host",

    65 "P": "Photoshop server password",

    66 "i": "file descriptor of input pipe",

    67 "o": "file descriptor of output pipe",

    68 "f": "folder to search for plugins (can be used multiple times)",

    69 "v": "include verbose generator logging in stdout",

    70 "photoshopVersion": "tell Generator PS''s version so it isn''t queried \n71
    at start (optional)",

    72 "photoshopPath": "tell Photoshop PS''s path so it isn''t queried \n73 at start
    (optional)",

    74 "photoshopBinaryPath": "tell Generator PS''s binary location so \n75 it isn''t
    queried at start(optional)",

    ```'
