    # 5.9 Graphic User Interfaces


    ExtendScript can display complex GUIs using its peculiar ScriptUI Class (JS Tools
    guide p. 61-165), which is extensively used by Adobe engineers in many of the
    scripts bundled with Photoshop, as “Contact Sheet II”. ScriptUI would deserve
    a book on it, and in InDesign developer Kahrel has written ScriptUI for Dummies,
    which I strongly recommend you to read now.


    ![](img/b87c0ab2175809458d63805e15cab800_128_0.png)


    Yet, Extend GUIs are one of those areas where the difference between Adobe products
    implementations differ: InDesign does differently from Photoshop; early versions
    of Photoshop are different compared to newer versions, and sometimes the Photoshop
    version has different behaviors depending on the platform (Mac or Windows). Please
    refer to Chapter 7 to read my take on this topic.


