    \ layout¹¹, as soon as you've defined either row or column as the orientation\
    \ in a Container, you may want to set the specific way each child should align\
    \ horizontally or vertically in align - which is alignChildren is all about.\n\
    \nIf the Controls are lined in a row, alignment is vertical: either top,center,bottom;\
    \ in column arrangements you can set horizontal alignment: left, center, right.\
    \ A special fill1 constant makes the control occupy all the available space in\
    \ the specified direction (horizontal or vertical).\n\n> ¹Alignment also applies\
    \ to stacked elements, instead, I tend to arrange manually."
