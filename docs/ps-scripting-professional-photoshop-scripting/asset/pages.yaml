    d.onMove = function() { alert("Window Moved") }

    d.onClose = function() { alert("Window Closed") }

    d.onResume = function() { alert("Window Resized") } // Won work


    // Buttons Callbacks

    btn1.onclick = function() { alert("Button Clicked") }

    btn2.onclick = function() {

