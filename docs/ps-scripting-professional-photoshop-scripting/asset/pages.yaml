  md: "# User Interfaces\n\n261\n\n```\nfunction generateLorem() {\n  $.get('https://lipsum.com/feed/json',\n\
    \  {\n    'what': 'words',\n    'amount': $(('##words').val()\n  }).done(function(res)\
    \ {\n    // the response object is in the form of\n    {\n      // \"feed\": {\n\
    \        // \"lipsum\": \"Lorem ipsum sit amet, consectetur ...\",\n        //\
    \ \"generated\": \"Generated 1 paragraph, 10 words, 69 bytes...\",\n        //\
