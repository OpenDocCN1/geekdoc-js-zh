  md: '# Photoshop Scripting


    When writing your scripts, you must be aware that you''ll be using both CoreScript
    and Application-specific ExtendScript features. The ExtendScript language has
    its own specs that are shared among all the Adobe Creative Cloud applications
    that implement scripting (notably Photoshop, InDesign, Illustrator, and Bridge).
    For instance, you can use the peculiar symbol for the Core Language for debugging
    purposes, in PS as well as inID.


    Yet, there are parts of the language that are exclusive of Photoshop, and will
    not work in any other CC – ActionManager code is one of them: it doesn''t exist
    in, say, Illustrator. Furthermore, even Core elements have properties and may
    be application-specific. For instance, the app class exists in both InDesign and
    Photoshop, but only the former can doScript()–a method that passes LS.


    Lastly, there are remarkable differences in how a writing implements CoreScript
