  md: '# # 7. User Interfaces


    Scripts, as processing engines, may not need a Graphical User Interface (GUI)
    at all: parameters can be hardwired or computed on the fly, and the code directly
    modified when the requirements change. Yet, if you plan to distribute your work
    to a broader audience – say, colleagues in a company’s department, or clients
    of yours – or in case the parameters must be defined at runtime, a GUI is a primary
    feature.


    # ## 7.1 The technology dilemma


    When it comes to GUIs, you have at least two valid alternatives to choose from,
    and I’m afraid there’s no clear winner: the options should be evaluated on a case
    by case.


    As it’s briefly mentioned in Chapter 5, the ExtendScript language has a peculiar
    ScriptUI Class¹, which is used to build what I’m calling here Scripted Dialogs.
    On the other hand, you can easily embed Script engines within CEP² Panels (aka
    HTML Panels), and use Panels as powerful interfaces on top of JSX. As follows
    a checklist of their respective pros and cons.


    # ## Compatibility


    TL;DR Script Dialog can successfully run in old versions, e.g. CS3 and possibly
    even earlier too… HTML Panels, instead, are supported from CC (version 14.0) onwards.
    Yet… it’s not simple.


    W backward compatibility isn’t all rainbows and unicorns: Scripted Dialogs can
    run on CS6 – let’s use that as a milestone of the pre-Cloud era – yet dialogs
    may look and behave quite differently among versions, platforms, not to mention
    host applications. ScriptUI is known to have been implemented in a very different
    way from each team in the Adobe’s major applications. I’m talking about the cosmetic
    and functional sides.


    Things have more or less stabilized in Photoshop with the so-called Mondo rendering
    engine (the one used to draw Windows in Scripting), for instance, the TreeComponent
    has vanished, and new bugs have been introduced. In the following illustration,
    you can find the same dialog in four Photoshop versions. CS6 is missing, because
    it is


    > ¹ScriptUI is an add-on, rather than a branch of the original ExtendScript specs.
    From the user standpoint, it’s part of the language, the ScriptUI Class is globally
    available.


    > ²CEP stands for Common Extensibility Platform.


    > ³I’ve never aimed anything before CS3, also that’s the version in which we’ve
    been first allowed to obfuscate the code with JSXBIN.'
