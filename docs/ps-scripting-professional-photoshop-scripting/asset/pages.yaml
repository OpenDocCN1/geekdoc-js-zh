    Where’s the Capture Phase gone? It turns out that objects callback can be triggered
    either at Capture Phase or Bubble Phase (the default behavior), not both. To switch
    the Capture Phase on, and consequently to the Bubble Phase, you must add true
    as a third, optional parameter in the addEventListener(method) by default, when
    the parameter is missing, it is assumed false).


    ```

    // ...

    d.addEventListener(''click'', handler, true); //

    btn.addEventListener(''click'', handler);

    //...

    ```


    Having enabled the Capture phase in the Dialog, the log finally says:


    Target: [object Window]

    Phase: capture

    ====================


    Target: [object Button]

    Phase: target

    ====================


    As I’ve pointed out, there’s no mention of the Bubble Phase there, for it’s either
    Capture or Bubble. You’re free to combine nested containers with listeners targeted
    to specific Event propagation phases (also checking the Event’s eventPhase property)
    to fine-tune Event controls in your scripts.


