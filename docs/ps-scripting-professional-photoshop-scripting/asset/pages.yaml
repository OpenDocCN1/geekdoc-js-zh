    # # 10.6 Metadata


    The Generator API also includes a particular way to store metadata both at the
    Document and Layer level. As opposed to XMP, it doesn''t focus on Namespaces but
    it is bound to the Generator Plug-in ID and allows you to store JSON objects¹.


    +   - In, the API itself doesn''t refer to metadata at all, perhaps more appropriately,
    to Plug-in Settings: you are supposed to store one key/value pair, where the key
    is the plug-in ID, and the value is the JSON Object. It turns out that the plug-in
    ID is nothing but a regular string: theoretically, nothing prevents you from using
    multiple IDs to store more than one object, provided that the IDs are reasonably
    unique not to collide with used by other developers.


    Find below a table showing the four setters and getters (two on the Document level,
    two on the Layer level), and their respective parameters:


    > Nothing prevents you from storing JSON stringified objects in custom XMP Namespaces
    too, but XMP was initially meant for a different purpose.'
