  md: '# User Interfaces


    Which callback is going to be fired, if you run the script and click the Button:
    the Window''s, the Button''s, or both? In case, which order? To properly understand
    the answer, you must be aware of the three different moments when Events are captured,
    as illustrated below.


    ![](img/b87c0ab2175809458d63805e15cab800_248_0.png)


    ![](img/b87c0ab2175809458d63805e15cab800_248_1.png)


    ![](img/b87c0ab2175809458d63805e15cab800_248_2.png)


    ![](img/b87c0ab2175809458d63805e15cab800_248_3.png)


    # ### The Three Phases

    of Event Propagation


    # ### Capture Phase


    Captured by the topmost ancestor object at which a handler is registered


    # ### Target Phase


    ScriptUI calls all handlers that are registered with the actual target object


    # ### Bubble Phase


    The event bubbles back through the hierarchy


    You can find a detailed description on page 84 of the JS Tools Guide, which I''m
    going to comment below.


    +   **Capture Phase:** When an event occurs in an object hierarchy, it is captured
    by the topmost ancestor at which a handler is registered (in our case the Window).
    If no handler is registered for the topmost ancestor, ScriptUI calls a handler
    for the next ancestor (say, a Group), then down the hierarchy to reach the parent
    of the actual target. When ScriptUI finds a handler registered to any ancestor
    of the target (in our case, the Button), it executes that handler then proceeds
    to the next phase. For us here, the topmost ancestor is the Window, because there
    are no other intermediate ancestors (Groups or Panels that contain the Button).

    **Target Phase:** ScriptUI calls all handlers that are registered with the actual
    target object. In our case, the Button is the target, so the Button callback is
    executed.

    **Bubble Phase:** The event bubbles out through the hierarchy; ScriptUI looks
    for handlers registered for the event ancestor objects, starting with the immediate
    parent, and working up the hierarchy to the topmost ancestor. ScriptUI finds a
    handler, it executes it, and the event propagation is complete.


    To sum up, Trigger at Capture Phase each parent of the target, provided it listens
    for it: from the topmost ancestor (the Window), onwards. Then it triggers the
    actual Target. Eventually, it bounces back, from the *inside* to the *outside*
    (Bubble Phase). In case you need to stop the Event propagation, use the stopPropagation()
    method in your callback.


    In the handler() function of our example, I''ve logged the Event''s eventPhase
    property, which keeps track of the Phase at which the callback is fired. If you
    expect to see the three of them logged, you''re going to be disappointed.'
