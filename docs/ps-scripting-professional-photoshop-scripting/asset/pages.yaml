    g.direction = Direction.VERTICAL;

    // Move the existing guide

    g.coordinate = new UnitValue(70, "px");",

    ```


    > Readable and Writable properties. Not every property can be modified, some of
    them read-only: as an example, check out JS Reference for a detailed list. The
    idea here is that you can act upon objects in two ways (e.g., to duplicate an
    ArtLayer), and writable properties directly changing their values.

    In a sense, read-only properties have getters, which read/write has both getters
    and setters.


    Please mind that, ArtLayers), but in code you use camelCase and the plural (Guides,
    Documents, ArtLayers) with no first capital; you refer to Classes using a capital
    but no plural (a Guide, a Document, an ArtLayer). So does the JavaScript Reference.
    A Class is a theoret thing (the blueprint for a Guide), the Instance of a class
    is the actual object (this guide here). Collections are named after Classes, which
    only contain Instances – actual stuff, not blueprints.


    Also note when you look at the Documentation for Collections'' methods and props,
    they''re usually very few (depending on what use: add(), getName(), length, etc.).
    They are meaningful in limited context: what do you do to make a Collection of
    things? You want to pick, add, remove them, and that''s it – it doesn''t make
    much difference if it''s a Collection of Layers, Guides or postage stamps. Most
    of the times, you might be interested in Instance''s methods and prop. In other
    words, you might want to know how to raise, desaturate, rotate and not an ArtLayer
    instance (ArtLayer, page 54 of the JavaScript Scripting Reference), and not manage
