  md: "# 5.12 Localization\n\nPhotoshop comes into a variety of different languages:\
    \ scripts, too, can adapt to the user's *locale* – i.e. the language – using strings\
    \ that match his/her settings (JS Tools Guide p. 224-226).\n\nAs an example, let's\
    \ say you're building a script where at some point the user must be presented\
    \ with a choice.\n\n```\nif (confirm(\"Save also a backup copy?\")) {\n  // do\
    \ the backup step\n} else {\n  // go ahead with the script\n}\n```\n\nBy default,you'd\
    \ write the message in English, especially if the script has an international\
    \ audience. Localization lets you display that string, in French, and Portuguese\
    \ too – as long as you can provide the translation. Please note: it's not an automatic\
    \ translation service!\n\nThe feature is based on string objects that link two\
    \ cha code (such as \"en\", \"fr\", \"pt\") to the actual translation.\n\n```\n\
    var confirmStrings = {\nen: \"Save also a backup copy?\",\nit: \"Salvare una copia\
    \ di backup?\",\npt: \"Salvar também uma cópia de backup?\"\n}\n```\n\nActually,\
    \ besides the above language code (aka ISO 639-1, list here), you can optionally\
    \ specify Region codes as well (aka ISO 3166-1 alpha 2, list here), e.g. \"en-US\"\
    , \"en-CA\", etc.\n\nThe localized strings are displayed using the global localize()\
    \ function, which automatically fetches the user's setting and picks the right\
    \ match.\n\nconfirm(localize(confirmStrings));\n\nYou're able to get the current\
    \ locale with the locale property of the dollar object. Which happens to be read-write:\
    \ as a result, it's possible to switch to a different locale to test your translations\
    \ temporarily."
