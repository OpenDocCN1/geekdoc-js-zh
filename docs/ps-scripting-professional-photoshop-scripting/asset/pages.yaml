    all doubts about Action vs. DOM.


    +   - **Are DOM and AM scripting mutually exclusive?** No, they’re definitely
    not! Think about this: Action Manager has a well-defined purpose because it holds
    up the implementation of Actions, through its event system. Everything that can
    be recorded into Actions (and extra stuff–more on this later on) has an AM counterpart.
