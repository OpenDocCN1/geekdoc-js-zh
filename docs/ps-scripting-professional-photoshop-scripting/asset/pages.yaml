    With brushes, this long, dense Chapter ends. Throughout the book, more ActionManager
    code will be written — so you''ll have further to familiarize with it. In my own
    experience, a fair amount of frustration has to be taken into account: properties
    that you can get, but not set; some of them are out of the AM reach altogether,
    or orphans that seem to actively run away from you and hide in AM''s thick forests;
    others may be plainly impossible to code. It isn''t too far from the truth, perhaps,
    to infer that AM has not to be intended as food for third-party developers consumption:
    more likely, we''re talking about an internal-use only API that Photoshop engineers
    manipulate for, say, automated tests and QA.


    No matter how long it will take you to domesticate it, ActionManager is a fundamental
    skill in Photoshop scripting, and the results are definitely worth the effort.'
