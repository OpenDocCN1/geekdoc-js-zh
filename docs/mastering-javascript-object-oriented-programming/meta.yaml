  md: '# Asynchronous Programming and Promises


    Promises have been around for a while and used by the JavaScript community in
    the form of libraries. They are defined by a specification called Promise/A+ and
    implemented by libraries such as Q, When or RSVP.js, jQuery, and supported by
    frameworks such as AngularJS. Although the various Promise implementations follow
    the standardized behavior, their APIs have some differences.


    Various attributes have been made to define a common specification for Promises
    in JavaScript. The most known ones have been published by the CommonJS community
    with Promise/A, Promise/B, and an interoperable Promise/D. The specifications
    implemented by ECMAScript 6 specification/A+ specifications and can be found at
    https://promisesa.com.


    Fortunately, ECMAScript 6 introduced Promises in JavaScript as native objects,
    so we can rely on a uniform API layer to manage asynchronous code, as we will
    see in the following sections


    # The Promise terminology


    Before seeing how to use Promises to manage asynchronous code, we have to introduce
    some terms we will use while talking about them. Let''s start by illustrating
    the states that a Promise can have:


    +   - **Resolved or fulfilled**: A Promise is resolved or fulfilled when the value
    represents available, that is, when the asynchronous task associated with it returns
    the requested value.


    +   - **Rejected**: A Promise is rejected when the asynchronous task associated
    with it fails to return a value, maybe for an exception or because the returned
    value is not considered valid.


    +   - **Pending**: This is the state of a Promise until it is not resolved or
    rejected, that is the request to start an asynchronous task has been made but
    we have not yet a result.


    Usually, when a Promise has resolved or rejected, we say that it is **settled**.


    Remember that a Promise can only be settled once and other consumers of a Promise
    change its state; that is, a Promise is **immutable**.


    ![](bbox=[0.123, 0.243, 0.193, 0.307])'
