  md: "# Inheriting and Creating Mixins\n\nIf necessary, we can make an object immutable\
    \ using the Object.freeze() method. This is an extreme measure when we want the\
    \ structure of an object will not change and its members should be read-only\n\
    \n```\nvar person = new Person(\"John\", \"Smith\");\n\nObject.freeze(person);\n\
    \nperson.age = 32;\nconsole.log(person.age)    //result: undefined\n\nperson.name\
