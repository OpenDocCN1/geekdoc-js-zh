    Mario\");\n person.surname(\"Rossi\");\n}, 5000);\n```\n\nHere, we can see that\
    \ the Person constructor is a plain constructor without any reference to its observers.\
    \ We create two observables bound the strings \"John\" and \"Smith\" and create\
