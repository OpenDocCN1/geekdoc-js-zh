  md: "# Presenting Data to the User\n\nOnce the three components of the Model-View-Controller\
    \ pattern are defined, we have to compose them and start their cooperation. With\
    \ this goal, we attach the following function to the load event of the browser's\
    \ window:\n\n```\nwindow.onload = function() {\n  var model = new Model(\"John\"\
    , \"Smith\");\n  var controller = new Controller();\n  var view = new View(model,\
    \ controller);\n}\n\ncontroller.initialize(model, view);\n```\n\nThe function\
    \ creates a new Model and a new Controller. Then, it creates a View with the Model\
    \ and Controller, passes it to the constructor, and finally calls the initialize()\
    \ method of the Controller.\n\nThe code rewriting of example maintains the same\
    \ behavior seen earlier, but reorganizes the code so that it can be easier to\
    \ change and adapt it to new scenarios.\n\nFor example, if we decide to substitute\
    \ the div displaying the message with a textarea, the only component that needs\
    \ to be changed is the view. The other components remain unchanged and are unaware\
    \ of the change. The same happens if we completely change the user interface,\
    \ for instance, we change the web page with a command line interface. In this\
    \ case, we have to write a new View, but we do not need to change anything in\
    \ the Model and in the Controller.\n\nIf we need to change the validation criteria\
    \ of the user's input, we have to only change the Controller's code.\n\nThe code\
    \ structuring provided by the MVC pattern allows us to easily locate the component\
    \ to be modified based on the type of change.\n\n# The Model-View-Presenter pattern\n\
    \nThe Model-View-Presenter pattern gives us a better architecture for presenting\
    \ data to the user. It assigns a specific task to each component so that possible\
    \ changes might only concern one component leaving the others unchanged. However,\
    \ the three components of the MVC pattern remain someway interconnected: the View\
    \ knows its Controller and the Model, and the Controller depends on the View and\
    \ the Model. For example, a change to the Model may require changes to both the\
    \ View and the Controller."
  merge: -1
  pgno: 147
- img_proc: false
  md: "The Model-View-Presenter pattern or MVP proposes a layered architecture with\
    \ fewer dependencies. In this pattern, the View intercepts the user interactions\
    \ and asks the Presenter for changes to the Model. This means the View does not\
    \ directly interact with the Model, but acts on it through the Presenter. This\
    \ eliminates any dependency between the View and the Model. The following image\
    \ summarizes the pattern's architecture:\n\n![](bbox=[0.287, 0.273, 0.712, 0.453])\n\
    \nLet's look at how we can implement our reference example according to the MVP\
    \ pattern. The Model implementation remains the same as per the MVC pattern. Instead\
