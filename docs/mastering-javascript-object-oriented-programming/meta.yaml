  md: '# Defining Contracts with Duck Typing


    Here, we defined a Developer() constructor inheriting from Person(), a Student()
    constructor inheriting from Person(), and a DevStudent() constructor inheriting
    from Developer() and Student(). Only instances of Developer() will have the writeCode()
    method. But, since the DevStudent() constructor inherits from Developer(), its
    instances will have the writeCode() method as well.


    So, we will expect that instances of Developer() and DevStudent() constructors
    will be valid candidates to be hired by our software house. However, since the
    hire() method is based on the instanceof operator, it will fail to hire a DevStudent()
    instance.


    In a fact DevStudent() instance is not an instance of Developer():


    ```

    var johnSmith = new DevStudent("John", "Smith", "JavaScript");


    console.log(johnSmith instanceof Student); //result: false

    console.log(johnSmith instanceof Developer); //result: false

    console.log(johnSmith instanceof Person); //result: false

    ```


    We might set the prototype of the DevStudent() constructor to an instance of Developer(),
    but this leads us to make a choice—an instance of DevStudent() will be also considered
    an instance of Developer() but not an instance of Student(). This might work in
    this specific case, but break another case.


    # Contracts and interfaces


    A way to manage interactions between objects is to establish some specific rules
    so that an object declares what it needs and another object declares what it implements,
    that is a contract. In a business context, a contract is an agreement between
    two or more parties for the doing of something specified. For example, in the
    interaction between two software components, as objects, we can establish how
    one object can ask another object to perform some actions in order to achieve
    a specific goal. With reference to our example of a software house that wants
    to hire developers, the contract between it and the candidates establishes that
    the developer must be able to write code.


    So, while a contract is a general agreement between two software components in
    order to achieve a specific goal, an interface is the formal terms of the contract,
    the details of the agreement that the components must be compliant with. We can
    say that an interface is the concrete part of a contract, a description of the
    members that an object must have in order to interact with another object for
    a specific purpose so that their existence can be checked.'
