    \ //result: undefined\n```\n\nAlthough Object.preventExtensions() prevent member\
    \ addition, we can still remove members using the delete statement and change\
    \ property configuration using Object.defineProperty(). If we also need to prevent\
    \ these changes, we have to use the Object.seal() method:\n\n```\nfunction Person(name,\
    \ surname) {\n  this.name = name;\n  this.surname = surname;\n}\n\nObject.seal(this);\n\
    ```\n\nNow, any attempt to delete a member or change the configuration of a property\
    \ will fail:\n\n```\nvar person = new Person(\"John\", \"Smith\");\n\nconsole.log(delete\
    \ person.name); //result: false\nconsole.log(person.name); //result: \"John\"\
    ,\n```\n\nOf course, we will not be able to add members to the object.\n\nWe can\
    \ check if an object is sealed using the Object.isSealed() method:\n\n```\nif\
    \ (!Object.isSealed(person)) {\n  delete person.name;\n}\n```\n\nEven if we cannot\
    \ add or remove members to a sealed object nor modify their configuration, we\
    \ can still change its members value."
