    \ with different numbers of arguments, as shown in the following C# example:\n\
    \n```\npublic int Sum(int x, int y) {\n    return Sum(x, y, 0);\n}\n```\n\n```\n\
    public int Sum(int x, int y, int z) {\n    return x + y + z;\n}\n```\n\nHere,\
    \ we have the Sum() method that is able to sum two or three integers. The correct\
    \ method definition will be detected on the basis of the number of arguments passed.\n\
    \nAs JavaScript developers, we are able to replicate this behavior in our scripts.\
