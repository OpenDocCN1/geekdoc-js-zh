  md: '# Inheriting and Creating Mixins


    The second way to access an object''s prototype is using the `Object.getPrototypeOf`
    method, as shown here:


    ```

    var prototypeOfPerson = Object.getPrototypeOf(person);

    ```


    In both approaches we get the object that acts as the template of the `person`
    object.


    A popular way to access an object''s prototype uses the `__proto__` pseudo-property.
    This property was originally born as an internal property supported by some JavaScript
    engines in the browser environment to link an object to its prototype. Given its
    widespread support, ECMAScript 6 standards it, but added the `__proto__` property
    to the standard as a deprecated feature, to be used for just compatibility with
    legacy code.


    ![](bbox=[0.1336, 0.2635, 0.1936, 0.3135])


    We can check if an object is the prototype of another object using the `isPrototypeOf()`
    method owned by every object:


    ```

    var p = Object.getPrototypeOf(person);

    ```


    ```

    console.log(p.isPrototypeOf(person)); //result: true

    console.log(person.isPrototypeOf(p));   //result: false

    ```


    From this, we can see that the prototype relation between objects is not a symmetric
    relation; that is, if object A is the prototype of object B, object B cannot be
    the prototype of object A.


    # Creating objects


    The discussion concerning objects and prototypes bring us to affirm that object
    creation and inheritance are strictly connected. The two ways to create objects
    in JavaScript that we have seen, using literal notation and via a constructor
    function, generate objects with a built-in prototype. So, we have two questions:


    +   - Can we create objects without a prototype?

    - Can we create object with a specific prototype?


    The answer to both questions is affirmative and the solution is the `Object.create()`
    method. This method allows us to create JavaScript objects using a functional
    approach and giving us more flexibility.'
