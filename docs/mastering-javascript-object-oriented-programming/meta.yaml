    \n```\nvar agency = new RecruitmentAgency();\nvar newDevStaffMember = agency.getStaffMember(\"\
    dev\", \"C++\", \"C#\",\n[\"tablet\"]);\n```\n\nThe application of the factory\
    \ pattern frees our class from the responsibility of getting objects creation\
    \ process may be complex and out of its main goal.\n\n# Factory with constructor\
    \ registration\n\nThe implementation of the factory we have just shown is the\
    \ most simple and intuitive. However, it has a drawback: when we need to add a\
    \ new role we should modify the RecruitmentAgency class. It may be acceptable\
    \ in situations where these changes happen seldom, but we can do better by decoupling\
    \ the factory from the concrete object creator functions.\n\nLet's rewrite the\
    \ RecruitmentAgency class as follows:\n\n```\nclass RecruitmentAgency {\n  constructor()\
    \ {\n    this.objConstructors = {};\n  }\n\n  register(role, constructor) {\n\
    \    this.objConstructors[role] = constructor;\n  }\n\n  getStaffMember(role,\
    \ skills, benefits) {\n    var objConstructor = this.objConstructors[role];\n\
    \    var member;\n\n    if (objConstructor) member = new objConstructor(skills,\n\
    \      benefits);\n  n}\n```"
