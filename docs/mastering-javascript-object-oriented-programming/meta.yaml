  md: "```\n} function accessor(newValue) {\n  if (arguments.length && newValue !==\
    \ value) {\n    value = newValue;\n    notify(newValue);\n  }\n  return value;\n\
    }\n\naccessor.subscribe = function(subscriber) {\n  subscribers.push(subscriber);\n\
    };\n\n```\n\nThis function takes the subject as an argument, that is, the value\
    \ to observe, and returns a function that represents its observable. The returned\
    \ function acts as an accessor to the subject that manages subscriptions in order\
    \ to notify the subject's changes.\n\nWe can see that the observable() function\
    \ has a private array of subscribers, which is populated by the subscribe() method\
    \ attached to the accessor() function. The subscribers array contains a list of\
    \ functions to be executed when a change of the subject's status occurs. The accessor()\
    \ function works as the specialized getter and setter seen in a previous implementation;\
    \ when no argument is passed, it returns the current value of the subject, otherwise\
    \ it sets the current value of the subject with the passed one and notifies the\
    \ change to all subscribers.\n\nLet's rewrite our example using the observable()\
    \ function and apply the publisher/subscriber pattern. The code is as follows:\n\
    \n```\nfunction Person(name, surname) {\n  this.name = name;\n  this.surname =\
    \ surname;\n}\n\nvar john = observable(\"John\");\nvar smith = observable(\"Smith\"\
    );\nvar txtName = document.getElementById(\"txtName\");\nvar txtSurname = document.getElementById(\"\
    txtSurname\");\n\nvar person = new Person(john, smith);\ntxtName.value = person.name();\n\
    ```"
