  md: "# Asynchronous Programming and Promises\n\nIn fact, the then() method always\
    \ returns a new Promise so that we can chain calls as highlighted in the following\
    \ code:\n\n```\nfunction getUserData() {\n  return httpGet(\"/users/12345\");\n\
    }\n\nfunction getBlog(user) {\n  return httpGet(\"/blogs/\" + user.blogId);\n\
    }\n\nfunction displayBlog(blog) {\n  displayPostList(blog.posts);\n}\n```\n\n\
    ```\ngetUserData()\n  .then(getBlog)\n  .then(displayBlog);\n```\n\nIn our example,\
    \ the getUserData() and getBlog() functions return the Promises created by the\
    \ httpGet() function. The then() method creates a new Promise and resolves allowing\
    \ us to chain the calls. However, more in us, the then() method always returns\
    \ a Promise, even when a Promise handler does not explicitly create and return\
    \ it.\n\nIn fact, when a Promise handler does not return a Promise but a standard\
    \ value, such as a primitive value or an object, the then() method creates a new\
    \ Promise and resolves it with the returned value. If the Promise handler does\
    \ not return anything, the then() method creates anew new resolved Promise and\
    \ returns it.\n\n# Catching failures\n\nIn the previous examples, we used the\
    \ then() method of a Promise in order to manage its resolved value. However, a\
    \ Promise can be rejected when something goes wrong. It should be pointed out\
    \ that rejections happen when a Promise is explicitly rejected, but implicitly\
    \ if an error is thrown in the constructor callback. We can manage a Promise rejection\
    \ by passing a second handler function to the then() method.\n\nSo, our previous\
    \ code becomes as follows:\n\n```\nfunction getUserData() {\n  return httpGet(\"\
    /users/12345\");\n}\n\nfunction getBlog(user) {\n```"
