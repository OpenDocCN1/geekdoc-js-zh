  md: "# Asynchronous Programming and Promises\n\nLet's introduce an example involving\
    \ asynchronous HTTP calls submitted to a server. The following is the definition\
    \ of a function that uses the XMLHttpRequest object to make an HTTP request and\
    \ execute a callback function on data returned by the server:\n\n```\nfunction\
    \ http(url, callback) {\n  var httpReq = new XMLHttpRequest();\n\n  httpReq.onreadystatechange\
    \ = function() {\n    var data;\n\n    if (httpReq.readyState == 4 && httpReq.status\
    \ == 200) {\n      data = JSON.parse(httpReq.responseText);\n      callback(data);\n\
    \    } else {\n      throw new Error(httpReq.status);\n    }\n  };\n\n  httpReq.open(\"\
    GET\", url, true);\n  httpReq.send();\n}\n```\n\nThe function takes the URL of\
    \ the web resource to the get and the callback function to execute when data are\
    \ returned by the server. The code inside the function is the standard HTTP request\
    \ via XMLHttpRequest the asynchronous call made by the body of the send() method\
    \ is resumed when the onreadystatechange event occurs.\n\nLet's consider the usage\
    \ of this function in the following code:\n\n```\nhttpGet(\"/users/12345\",\n\
    function(user) {\n  httpGet(\"/blogs/\" + user.blogId,\n  function(blog) {\n \
    \   displayPostList(blog.posts);\n  }\n});\n\nhttpGet(\"/photos/\" + user.albumId,\n\
    \  function(album) {\n    displayPhotoList(album.photos);\n  }\n});\n```"
  merge: -1
