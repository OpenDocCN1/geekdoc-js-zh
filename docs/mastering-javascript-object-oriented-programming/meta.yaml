  md: "# Advanced Object Creation\n\nThis is a very minimal example of a factory and\
    \ might not clearly explain its usefulness, apart from the purely functional approach.\
    \ The purpose of a factory is to abstract the details of object creation from\
    \ object use and it is particularly useful when the object creation process is\
    \ relatively complex.\n\nIn the classical definition of the factory pattern, we\
    \ have three actors involved:\n\n+   - **The client**: This is the object that\
    \ needs another object of a specific category\n- **The factory**: This is the\
    \ object able to generate objects of a number of categories\n- **The product**:\
    \ This is the object created by the factory and returned to the client\n\nWe can\
    \ represent graphically the interactions between the actors of the factory patterns\
    \ in the following diagram:\n\n![](bbox=[0.242, 0.396, 0.757, 0.613])\n\nIn order\
