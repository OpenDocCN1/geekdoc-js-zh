  md: "# Inheriting and Creating Mixins\n\nIn addition to associating a prototype\
    \ during the creation of an object with the Object.create() method, we can also\
    \ assign a prototype to an object after the object is created. We can make this\
    \ by using the Object.setPrototypeOf() method defined by ECMAScript specifications.\
    \ Following is an example of how we can use this method:\n\n```\nvar person =\
    \ {name: \"John\", surname: \"Smith\" };\nvar developer = {knownLanguage: \"JavaScript\"\
    \ };\n\nObject.setPrototypeOf(developer, person);\n```\n\nIn this way, we assigned\
    \ the person object as the prototype of the developer object. This instantly causes\
    \ the developer to inherit the person's members name and surname:\n\n```\nconsole.log(developer.name);\
    \ // result: \"John\"\nconsole.log(developer.surname); // result: \"Smith\"\n\
    ```\n\nThis is a sort of object combination executed at runtime. In fact, the\
    \ Object.setPrototypeOf() method allows us to change the prototype of an object,\
    \ modifying its features. In our example, the initial prototype of both person\
    \ and developer objects was the empty object []. After applying the Object.setPrototypeOf()\
    \ method, the developer prototype has changed.\n\nAlthough the Object.setPrototypeOf()\
    \ method offers interesting possibilities, it should be pointed out that its use\
    \ can have negative performance impacts due to dynamically linking the prototype\
    \ at runtime. Using Object.create() allows JavaScript engines to statically analyze\
    \ and optimize the code, while changing prototypes at runtime can have unpredictable\
    \ effects on the performance.\n\n# Prototype chaining\n\nWhen creating an object,\
    \ we have the opportunity to specify its prototype thanks to the Object.create()\
    \ method. This allows the new object to inherit features of the prototype. Being\
    \ a regular object, a prototype in turn has its own prototype. Consider, for example,\
    \ the following code:\n\n```\nvar person = { name: \"John\", surname: \"Smith\"\
    \ };\nvar developer = Object.create(\n{\n    knownLanguage: {\n        writable:\
    \ true,\n        configurable: true\n    }\n});\n```"
