  md: "# Creating Promises\n\nOnce introduced to the Promise terminology, let's explore\
    \ how we can create and use it to better handle asynchronous code. We will analyze\
    \ the ES6 Promise syntax, since it is a standard specification and hopefully all\
    \ current libraries will disappear or comply with within near future.\n\nWe can\
    \ create a Promise using the Promise() constructor, as shown here:\n\n```\nvar\
    \ promise = new Promise(handler);\n```\n\nThe Promise() constructor takes a function\
    \ as an argument whose task is to manage the fulfillment or rejection of the Promise.\
    \ Typically, a Promise handler has the following structure:\n\n```\nvar promise\
    \ = new Promise(function(resolve, reject) {\n  if (condition) { //some condition\n\
    \    resolve(value); //successfully resolve the Promise\n  } else {\n    reject(reason);\
    \ //reject the Promise and specify the reason\n  }\n}\n```\n\nThe Promise handler\
    \ is given two functions as parameters.\n\nThe first parameter (resolve in the\
    \ example) is the function to call when the value returned by the asynchronous\
    \ task is available. The returned value is passed to resolve the function.\n\n\
    The second parameter (reject in the example) is the function to call if the Promise\
    \ can't be resolved, for instance, because an error occurred or the value is not\
    \ valid. When a Promise is rejected, a reason is passed to the reject function,\
    \ as such an exception.\n\nIn order to show how concretely create a Promise, let's\
    \ rewrite the httpGet(url) function seen earlier:\n\n```\nfunction httpGet(url)\
    \ {\n  return new Promise(function(resolve, reject) {\n    var httpReq = new XMLHttpRequest();\n\
    \n    httpReq.onreadystatechange = function() {\n      var data;\n\n      if (httpReq.readyState\
    \ == 4) {\n        if (httpReq.status == 200) {\n          data = JSON.parse(httpReq.responseText);\n\
    \\    });\n  });\n}\n```"
  merge: -1
  pgno: 191
- img_proc: false
  md: "# Asynchronous Programming and Promises\n\n```\nresolve(data);\n} else {\n\
    \  reject(new Error(httpReq.statusText));\n}\n\nhttpReq.open(\"GET\", url, true);\n\
    httpReq.send();\n```\n\nThis version of the http() function takes just one argument:\
    \ the url that should respond to our HTTP request. The function returns a Promise\
    \ whose handler is quite similar to previous version of the http() function. In\
    \ fact, it creates an XMLHttpRequest object to make the HTTP request as usual,\
    \ but it calls the resolve() function when it receives a successful response from\
    \ the server; it calls the reject() function when it receives an unsuccessful\
    \ response. In the first case, the response's content is passed to the resolve()\
    \ function; in the second case, an exception with the HTTP status message is passed\
    \ to the reject() function.\n\nSo, now the http() function returns a Promise instead\
    \ of directly submitting the HTTP request to the server.\n\n# Consuming Promises\n\
    \nSince a Promise is an object, it can be used as any other object; it can be\
    \ stored in a variable, passed as a parameter, returned by a function and so on.\
    \ We can show the promise returned by the httpGet() function in a variable, as\
    \ shown by the following code:\n\n```\nvar myPromise = httpGet(\"/users/12345\"\
    );\n```\n\nWhen we want to consume the Promise, that is we want to process the\
    \ value it represents, we need to use its then() method. We pass a function as\
    \ a parameter to the then() method and this function will receive the Promise's\
    \ value once it is resolved.\n\nLet's take a simplified version of the example\
    \ seen earlier. We use the new Promise-based httpGet() function to get the user's\
    \ data and access his blog. Our code will look like the following:\n\n```\nhttpGet(\"\
    /users/12345\")\n  .then(function(user) {\n    console.log(\"The user's blog has\
    \ the id \" + user.blogId);\n  });\n```"
  merge: -1
  pgno: 192
