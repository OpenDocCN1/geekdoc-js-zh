- img_proc: false
  md: "The is-a relationship keyword, and thus inheritance, informally says that if\
    \ an object A inherits from object B, then that A is B, that is, A is a specialized\
    \ version of B. Sometimes, A is also said to be a derived object of B, while B\
    \ is usually called the base object or parent object.\n\nBut, why do we need inheritance\
    \ in Object-Oriented Programming? Since a derived object has all the features\
    \ of the base object, inheritance can help reduce code redundancy between similar\
    \ objects by sharing common features. In other words, a base object contains the\
    \ common features and shares them with its derived objects. This also allows us\
    \ to create more maintainable code, since we can change a feature on the base\
    \ object and share it instantly with all derived objects.\n\n# Objects and prototypes\n\
    \nUntil now, we have seen two ways to create objects in JavaScript. The first\
    \ and simplest approach is based on the literal notation:\n\n```\nvar person =\
    \ {name: \"John\", surname: \"Smith\"};\n```\n\nThe second and more flexible approach\
    \ is based on a constructor function:\n\n```\nfunction Person(name, surname) {\n\
    \  this.name = name;\n  this.surname = surname;\n}\n\nvar person = new Person(\"\
    John\", \"Smith\");\n```\n\nThere is no difference between the resulting objects\
    \ of both approaches. Our feeling in both cases is that we have created two objects\
    \ from scratch. Actually, it is not true. In both cases, we created a derived\
    \ object—an object derived from an instance of the built-in Object() constructor.\
    \ It is a constructor that allows us to create a base object of all JavaScript\
    \ objects—the empty object {}. Every object created using the literal notation\
    \ or a constructor inherits all properties and methods of an empty object.\n\n\
    We can verify this by trying to call the toString() method:\n\n```\nvar person\
    \ = {name: \"John\", surname: \"Smith\"};\n\nperson.toString(); // result: \"\
    [object Object]\",\n```"
  merge: -1
