  md: "This code defines a constructor for objects that represent seats in a theatre\
    \ where a person can be placed. The intended use is as follows:\n\n```\nvar theatreSeats\
    \ = new TheatreSeats();\ntheatreSeats.placePerson({name: \"John\", surname: \"\
    Smith\"});\n```\n\nThe _seats property is the actual container and its underscore\
    \ character indicates that it should be considered an internal property. Of course,\
    \ it is just a convention—the developer should know that members of an object\
    \ whose name start with the underscore character are for internal use.\n\nHowever,\
    \ there is no technical obstacle to prevent a developer from using that member.\
    \ The internal details are not really hidden and privacy is based on the developer's\
    \ willingness. Apart from this, the convention—based approach has some other drawbacks.\
    \ For example, it pollutes the public interface with members that should not be\
    \ used, breaking the principle that using an object should be simple. Moreover,\
    \ it can lead to property clashes when using inheritance.\n\nEven if this approach\
    \ can appear simple, it has been widely used by common JavaScript libraries such\
    \ as jQuery and Backbone.js.\n\n# Privacy levels using closure\n\nA simple way\
    \ to fix the inconsistencies of the convention-based approach is not using properties\
    \ for internal members but declaring variables inside the constructor, as shown\
    \ in the following example:\n\n```\nfunction TheatreSeats() {\n  var seats = [];\n\
    \nthis.placePerson = function(person) {\n    seats.push(person);\n  }\n}\n```\n\
    \nUsing this approach, we can continue to use the constructor as usual preventing\
    \ the access to the actual internal container-the seats variable. We are exploiting\
    \ the internal environment of the TheatreSeats() function to hide the implementation\
    \ details and lay the foundations for building the private and public parts of\
    \ JavaScript objects."
