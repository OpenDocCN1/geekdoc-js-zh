  md: '# The Object() constructor


    We have seen how the use of a constructor offers us a higher level of abstraction
    in the creation of objects. In this section, we explore a particular constructor
    provided to us by JavaScript—the Object () constructor.


    This constructor allows us to create a generic object, as shown in the following
    example:


    ```

    var person = new Object();

    person.name = "John"

    person.surname = "Smith";

    ```


    Here, we use the operator to create a new instance of an empty object and then
    create properties by assigning values, as in the literal approach.


    Actually, creating an object using the literal notation or creating it by means
    of the Object() constructor is the same thing. Every object created using the
    literal notation has Object() as its implicit constructor. We can realize it by
    accessing the constructor property that every object has the following:


    ```

    var person = {};

    console.log(person.constructor == Object); //result: true

    ```


    The Object () constructor is also able to generate object instances from any JavaScript
    expression, as shown by the following code:


    ```

    var number = new Object(12);

    var anotherNumber = new Object(3*2);

    var string = new Object("test");

    var person = new Object(name: "John", surname: "Smith");

    ```


    Apart from the last statement, which is equivalent to the creation of an object
    via its literal representation, the first three statements create an object from
    a primitive data type, such as a number or string. The result is not just a numerical
    value or a string value, but built-in objects specialized in handling numeric
    values and strings.


    We will return later in the book on the Object () constructor for use in advanced
    mode.'
  merge: -1
