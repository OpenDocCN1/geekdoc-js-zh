  md: "# Advanced Object Creation\n\nSuppose our SoftwareHouse class has a createSoftware()\
    \ method that takes a software specification and returns an application. The software\
    \ development is a complex task that involves several steps. Usually, it is not\
    \ a good idea to start to develop it without a plan and a work organization. So,\
    \ it should be better to set up a developer team (the builder) and assign it to\
    \ a project manager (the director). Translating this scenario to code we would\
    \ get something like this:\n\n```\nclass SoftwareHouse {\n  constructor() {...}\n\
    \n  createSoftware(specs) {\n    var WebSwBuilderTeam = new WebSwBuilderTeam();\n\
    \    var projectManager = new ProjectManager(WebSwBuilderTeam);\n    return projectManager.buildSoftware(specs);\n\
    \  }\n}\n```\n\nInside the createSoftware() method, we create an instance of a\
    \ developer's team (WebSwBuilderTeam()) and pass it to the constructor of a project\
    \ manager (ProjectManager()). Then, we call the buildSoftware() method of the\
    \ project manager object passing to the software specification. As we, the SoftwareHouse\
    \ class, which has the role of the client in the project's scenario, does not\
    \ know the details about how to build a software. It simply provides a development\
    \ team and delegates to the project manager the task of controlling and ensuring\
    \ that the software is developed following the specifications.\n\nIt is worth\
    \ noting that in our example we used an instance of WebSwBuilderTeam() to represent\
    \ a development team specialized in building web applications, the software house\
    \ can use different development teams based on the type of development: web, mobile,\
    \ desktop, and so on. Of, all teams need to have a common interface in order to\
    \ be uniformly used by the project manager.\n\nLet's see how the ProjectManager\
    \ class may be implemented:\n\n```\nclass ProjectManager {\n  constructor(builderTeam)\
    \ {\n    IDvelopmentTeam = implementedBy(builderTeam);\n    this.builderTeam =\
    \ builderTeam;\n  }\n}\n\nbuildSoftware(specs) {\n  var detailedSpecs = this.builderTeam.analyze(specs);\n\
    \  var code = this.builderTeam.writeCode(detailedSpecs);\n  var testedCode = this.builderTeam.test(code);\n\
    }\n```"
