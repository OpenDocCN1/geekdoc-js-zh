  md: "# Asynchronous Programming and Promises\n\nAnother common example is when using\
    \ Ajax to make HTTP requests to a remote server,\nin as the following example:\n\
    \n```\nvar httpReq = new XMLHttpRequest();\n\nhttpReq.onreadystatechange = function()\
    \ {\n  if (httpReq.readyState == 4 && httpReq.status == 200) {\n    console.log(httpReq.responseText);\n\
    \  }\n}\n\nhttpReq.open(\"GET\", \"/myServerPage\", true);\nhttpReq.send();\n\
    ```\n\nHere, we attached the event handler to the onreadystatechange property\
    \ of the XMLHttpRequest object. Each time the readyState property of the XMLHttpRequest\
    \ object changes, that is on each phase of client-server communication, the handler\
    \ is executed. When a complete response is obtained from the server, we will show\
    \ it on the console.\n\nIn both cases, code is quite simple and it seems that\
    \ no particular trouble may arise. We write code to be executed asynchronously\
    \ by attaching it to specific properties that hooks for events. The only difference\
    \ in comparison to the usual coding is that the event handler is not explicitly\
    \ called by our code, but it is called by the JavaScript runtime. The execution\
    \ flow of our code is not sequential, but it can have different flows based on\
    \ the events that occur.\n\n# Using callbacks\n\nAnother more common way to write\
    \ asynchronous code is based on callback functions. A callback function or simply\
    \ callback is passed as an argument to another function so that it will be invoked\
    \ inside the caller. Usually, the callback function is executed when a specific\
    \ event occurs, as in the following example:\n\n```\nvar btn = document.getElementById(\"\
    myBtn\");\n\nbtn.addEventListener(\"click\", function() {\n  console.log(\"The\
    \ button was clicked!\");\n});\n```\n\nThis code has the same effect as the previous\
    \ one, where we attached the event handler to the onClick property of the button.\
    \ Here, we use the addEventListener() method of the button to attach a handler\
    \ for the click event. Again, the only apparent effect in writing asynchronous\
    \ code as a callback is a non-sequential execution flow, as in the previous case:"
