    \ person.surname = \"Rossi\";\n}, 5000);\n```\n\nThanks to the standard getters\
    \ and setters definition, once defined, the constructor of the Person object,\
    \ the data binding relationship is totally transparent.\n\n# Defining a binder\n\
    \nThe data binding implementations we analyzed are based on a tight coupling between\
    \ the data source and the data target object. Whether we define specialized methods\
    \ or we use the standard getter and setter, we include in the data source object\
    \ definition an explicit reference to the data target object. Usually, this is\
    \ not desirable, because a change to one object may require a change to the other\
    \ object. Moreover, what happens if we want to create a new data binding relationship\
    \ with another object? We need to add a reference to the new object by adding\
    \ a new dependency and this leads to a messy code.\n\nWhat we need is an external\
    \ mechanism that sets up a data binding relationship. Let's implement this using\
    \ an object like the following:\n\n```\nfunction Binder() {\n\nBinder.prototype.bindTo\
    \ = \nfunction(dataSourceObj, dataSourceProperty, dataTargetObject,\ndataTargetProperty)\
    \ {\n  Object.defineProperty(dataSourceObj, dataSourceProperty, {\n    get: function()\
    \ { return dataTargetObj[dataTargetProperty];\n  });\n}\n\n```"
