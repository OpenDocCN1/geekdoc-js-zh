  md: "# Defining namespaces with IIFE\n\nUsing object literals as namespaces is extremely\
    \ simple and convenient, but this approach still uses a global variable, even\
    \ if it is well identified. If having one known variable as namespace be acceptable\
    \ in an application under our control, it should be avoided in libraries or components\
    \ that should be used inside a context of our control. In this case, we should\
    \ leave to the programmer the decision concerning the name of the global variable.\
    \ A possible solution is based on the use of an Immediately Invoked Function Expression\
    \ or IIFE, as in the following example:\n\n```\nvar myApplication = {};\n\nfunction(nameSpace)\
    \ {\n  nameSpace.version = \"1.0\",\n  nameSpace.name = \"My Application\",\n\
    \  nameSpace.config = {/*...*/};\n  nameSpace.init = function() {/*...*/}\n}(myApplication);\n\
    ```\n\nHere, we define the variable myApplication that is assigned an empty object\
    \ literal and pass it to an IIFE that attaches the content of the namespace. The\
    \ user of our namespace definition can decide the name of the global variable\
    \ avoiding clashes. For example, instead of using the myApplication, they might\
    \ decide to declare a variable with a different name. They might also decide to\
    \ assign the namespace to a local variable instead of using a global one.\n\n\
    A variant of the previous approach uses the this keyword to rely on the nameSpace\
    \ parameter:\n\n```\nvar myApplication = {};\n\nfunction() {\n  this.version =\
    \ \"1.0\",\n  this.name = \"My Application\",\n  this.config: {..},\n  this.init:\
    \ function() {..}\n}.apply(myApplication);\n```\n\nAn interesting aspect of using\
    \ an IIFE to define a namespace is that we can define and private variables inside\
    \ the body of the IIFE:\n\n```\nvar myApplication = {};\n\nfunction(nameSpace)\
    \ {\n  var i = 0;\n```"
