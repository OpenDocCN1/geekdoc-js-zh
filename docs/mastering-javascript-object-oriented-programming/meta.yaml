- img_proc: false
  md: '# 7 Presenting Data to the User


    One of the most visible parts of an application is, for obvious reasons, the presentation
    of data to the user. Whether an application has a graphical interface or it provides
    a command line interface, the management of interaction between the user and the
    data managed by the application is always a critical aspect. Allowing the user
    to change data consistently and providing a feedback and/or result often involves
    complex processing that can lead to code not always clear and difficult to maintain.


    Some well-known patterns can help us design a structured code with many benefits
    in flexibility and maintainability. This chapter will focus on these patterns,
    known as presentation patterns, whose main goal is to separate presentation from
    data model. In particular, we will explore the three most known presentation patterns:


    +   * Model-View-Controller pattern

    * Model-View-Presenter pattern

    * Model-View-ViewModel pattern


    # Managing user interfaces


    One of the biggest problems in the development of any application is the interaction
    with the user. In whatever way the user interacts with the application, the code
    almost always ends up being complex and difficult to maintain. This is true for
    graphical interfaces and for command line consoles.'
  merge: -1
  pgno: 137
- img_proc: false
  md: '# The user interface problems


    The main reason for this complexity lies in the management of three aspects of
    the interaction between the user and the application: the **state**, the **logic**,
    and the **synchronization**.


    The **state** is the set of information that represents the current picture of
    the user interface. It determines what the user sees at a given time and how it
    can interact with the application.


    The **logic** is the set of operations that can be done on the elements of an
    interface in order to show or hide data or to make validation. It may be very
    complex depending on the type of processing to be performed on the data presented
    to the user.


    The **synchronization** concerns those activities that map data shown to the user
    with data represented by the business objects managed by the application.


    The combination of these elements creates most of the complexity in the presentation
    of data to the user and the interaction with the application.


    # User interfaces and JavaScript


    The user interaction problems are usually independent of the language used to
    develop the application, even for JavaScript applications we need to address these
    issues.


    As we know, usually JavaScript is paired with HTML to create user interfaces.
    While HTML allows us to describe the graphical interface, JavaScript can manipulate
    its elements by adding logic, messaging the state and managing the synchronization.
    JavaScript can access the HTML elements via the **Document Object Model (DOM)**,
    an object-based representation of the user''s markup.


    Let''s know how a small user interface is managed usually with HTML and JavaScript.
    Consider the following markup:


    ```

    <Name <input type="text" id="txtName"></label><br>

    <label>Surname<input type="text" id="txtSurname"></label><br>

    <div id="divMessage"></div>


    <button id="btnSave">Save</button>

    <button id="btnReset">Reset</button>

    ```'
  merge: -1
