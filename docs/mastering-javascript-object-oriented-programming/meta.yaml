  md: '# Diving into OOP Principles


    Meeting these requirements is what usually allows us to classify a language as
    Object Oriented.


    # Is JavaScript Object Oriented?


    Once we have established the principles commonly accepted for defining a language
    as Object Oriented, we can affirm that JavaScript is an OOP language? Many developers
    do not consider JavaScript a true object-oriented language due to its lack of
    class concept and because it does not enforce compliance with OOP principles.


    However, we can see that our informal definition makes no explicit reference to
    classes. Features and principles are required for objects. Classes are not a real
    requirement, but they are sometimes a convenient way to abstract sets with common
    properties. So, a language can be Object Oriented if it supports objects without
    classes, as in JavaScript.


    Moreover, the OOP principles required for a language are intended to be supported.
    It should not be mandatory in order to do programming in a language. The developer
    can choose to use constructs that allow him to create Object Oriented code or
    not. Many criticize JavaScript because developers can write code that breaches
    the OOP principles. But this is just a choice of the programmer, not a language
    constraint. It also happens with other programming languages, as C++.


    We conclude that a lack of abstract classes and leaving the developer free to
    use, or not features that support OOP principles are not real obstacle to consider
    JavaScript an OOP language. So, let''s analyze in the following sections how JavaScript
    supports abstraction and OOP principles.


    # Abstraction and modeling support


    The first requirement for us to consider a language as Object Oriented is its
    support to model a problem through objects. We already know that JavaScript supports
    objects, but here we should determine whether they are supported in order to build
    reality.


    In fact, Object-Oriented Programming we try to model real-world entities and processes
    and represent them in our software. We need a model because it is a simplification
    of reality, it allows us to reduce the complexity offering a vision from a particular
    perspective and helps us to reason about a relationship among entities.'
  merge: -1
  pgno: 29
- img_proc: false
  md: "# Diving into OOP Principles\n\nThis simplification feature is usually known\
    \ as abstraction, and it is sometimes considered one of the principles of OOP.\
    \ Abstraction is the concept of moving the focus from the details and create implementation\
    \ of things to the features that are relevant for a specific purpose, with a more\
    \ general and abstract approach. In other words, abstraction is the capability\
    \ to define which properties and actions of a real-entity have to be represented\
    \ by means of objects in a program in order to solve a specific problem.\n\nFor\
    \ example, thanks to abstraction, we can decide that to solve a specific problem\
    \ we can represent a person just as an object with name, surname, and age, since\
    \ once other information such as address, height, hair color, and so are not relevant\
    \ for our purpose.\n\nMore than a language feature, it seems a human capability.\
    \ For this reason, we prefer not to consider it an OOP principle but a (human)\
    \ capability to support modeling.\n\nModeling reality not only involves defining\
    \ objects with relevant features for a specific purpose. It also includes the\
    \ definition of relationships between objects, such as Association, Aggregation,\
    \ and Composition.\n\n# Association\n\nAssociation is a relationship between two\
    \ or more objects where each object is independent of each other. This means that\
    \ an object can exist without the other and no object owns the other.\n\nLet us\
    \ clarify with an example. In order to define a parent-child relationship between\
    \ persons, we can do so as follows:\n\n```\nfunction Person(name, surname) {\n\
    \  this.name = name;\n  this.surname = surname;\n  this.parent = null;\n}\n\n\
    var johnSmith = new Person(\"John\", \"Smith\");\nvar fredSmith = new Person(\"\
    Fred\", \"Smith\");\n\nfredSmith.parent = johnSmith;\n```\n\nThe assignment of\
    \ johnSmith to the parent property of the object fredSmith establishes an association\
    \ between the two objects. Of course, the object johnSmith lives independently\
    \ from the object fredSmith and vice versa. Both can be created and deleted independently\
    \ to each other."
  merge: -1
  pgno: 30
