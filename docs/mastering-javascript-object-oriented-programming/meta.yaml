  md: "```\n}\ndisplayGreeting = greets({name: \"John\", surname: \"Smith\"});\ndisplayGreeting();\n\
    ```\n\nIn this case, the greets() function does not show the greeting string,\
    \ but it returns a function that is able to show the string. We assigned the result\
    \ of the greets() function to the variable displayGreeting and called the function\
    \ it contains. We will get again the greeting string as before. Even if the greets()\
    \ function does not exist anymore, the resulting function can still access its\
    \ scope, in particular the fullName variable.\n\nThe basic principle strengthening\
    \ this mechanism establishes that every variable that was accessible when a function\
    \ was defined is enclosed in the accessible scope of the function. This mechanism\
    \ is called closure.\n\nThe closure is a powerful tool and can be creatively used\
    \ to define patterns of advanced programming, as we will see throughout the book.\
    \ We will use it in this chapter to implement information hiding. Let's recall\
    \ the previous example of constructor definition:\n\n```\nfunction TheatreSeats()\
    \ {\n  var seats = [];\n\nthis.placePerson = function(person) {\n  seats.push(person);\n\
    }\n}\n```\n\nWhen this constructor is invoked to create an object, the constructor's\
    \ instance and its internal environment are created. The constructor's environment\
    \ holds the parameters, the local variables, and functions created inside the\
    \ constructor. These functions will retain a reference to the environment in which\
    \ they were created so that they will always have access to the environment, even\
    \ after the constructor execution terminates. This combination of function and\
    \ environment, that is the closure, represents thus a data storage that is independent\
    \ of the instance and related to it only because the two are created at the same\
    \ time."
