  md: "# # Using Generators\n\nThe Promise-based approach to manage asynchronous tasks\
    \ gives us a powerful tool to write a more readable code and have better control\
    \ over their execution. However, the style we use to write code still needs to\
    \ be conscious of the asynchronous nature of the tasks. Even if we do without\
    \ nesting callbacks with the then() and catch() methods and composing Promises\
    \ using the all() and race() methods, we are essentially calling callbacks anyway.\
    \ An ideal approach should let us write asynchronous code in the same we write\
    \ synchronous code. We can make something similar using the new ECMScript 6 Generators.\n\
    \n# # Introducing Generators\n\nThe ES6 Generators are functions that can be paused.\
    \ Unlike normal functions that run until they reach the end or execute a return\
    \ statement, a Generator can be suspended and then can be resumed. Let's take\
    \ a look at a simple Generator like the following:\n\n```\nfunction *counter()\
    \ {\n  yield 1;\n  yield 2;\n  yield 3;\n}\n```\n\nFrom a syntactic point of view,\
    \ the first thing we notice is the star by the function name. This simply states\
    \ that it is a Generator. The new other thing is the yield keyword. This keyword\
    \ is a statement that pauses the execution of the Generator, that is, when the\
    \ yield statement is reached, the execution of the Generator is suspended at point.\n\
    \nUnlike a normal function, when we call a Generator, we get an object that represents\
    \ the Generator itself. This object has a next() method that allows us to start\
    \ the execution of the Generator or resume it when it has been paused. For example,\
    \ we can start our counter() generator with the following code:\n\n```\nvar myCounter\
    \ = counter();\n\nmyCounter.next();\n```"
  merge: -1
  pgno: 200
- img_proc: false
  md: "# Asynchronous Programming and Promises\n\nThe next() method makes the body\
    \ of the Generator run until a yield statement is reached. In our example, the\
    \ first yield statement is executed, and as a result of its execution, an object\
    \ is returned. The returned object has two properties: the value property containing\
    \ the value of the execution to the right of the yield statement and the done\
    \ property whose Boolean value says the execution of the Generator has terminated\
    \ (true) or is simply suspended (false). Let's consider the following code to\
    \ understand which values are returned by our Generator:\n\n```\nvar myCounter\
    \ = counter();\nmyCounter.next(); //(value: 1, done: false)\nmyCounter.next();\
    \ //(value: 2, done: false)\nmyCounter.next(); //(value: 3, done: false)\nmyCounter.next();\
    \ //(value: undefined, done: false)\n```\n\nAs we can see, each time we call the\
    \ next() method, the execution of the body of the Generator resumes from the point\
    \ it was suspended until it reaches the end of the function.\n\n# Generators for\
    \ asynchronous tasks\n\nAfter briefly seeing what Generators are, we may ask ourselves\
    \ what they have to do with asynchronous code. The ability to suspend and resume\
    \ the execution of standard JavaScript code can help us give the synchronous form\
    \ to asynchronous tasks. Let's explain with an example. Consider the httpGet()\
    \ function weft introduced when talking about callbacks:\n\n```\nfunction httpGet(url,\
    \ callback) {\n  var httpReq = new XMLHttpRequest();\n\nhttpReq.onreadystatechange\
    \ = function() {\n  var data;\n\n  if (httpReq.readyState == 4 && httpReq.status\
    \ == 200) {\n    data = JSON.parse(httpReq.responseText);\n    callback(data);\n\
    \  } else {\n    throw new Error(httpReq.statusText);\n  }\n};\n\nhttpReq.open(\"\
    GET\", url, true);\n  httpReq.send();\n}\n```"
  merge: -1
  pgno: 201
- img_proc: false
  md: "# Asynchronous Programming and Promises\n\nWe can use it in order to define\
    \ a `request()` function as in the following:\n\n```\nfunction request (url) {\n\
    \  httpGet(url, function(response) {\n    myDataGenerator.next(response);\n  });\n\
    }\n```\n\nThe `request()` function may seem a little cryptic. Actually, it calls\
    \ the `httpGet()` function to make the asynchronous call, and when a result comes\
    \ from the server, it resumes a Generator called `myDataGenerator`. Let's see\
    \ what this Generator looks like:\n\n```\nfunction *dataGenerator() {\n  var user\
    \ = yield request(\"/users/12345\");\n  var blog = yield request(\"/blog/\" +\
    \ user.blogId);\n\n  displayPostList(blog.posts);\n}\n```\n\nThe `dataGenerator()`\
    \ is the function of our control over the asynchronous tasks. While keeping a\
    \ synchronous programming style, we can coordinate the Ajax calls in a very simple\
    \ way. However, the initial step that makes all working is missing:\n\n```\nmyDataGenerator\
    \ = dataGenerator();\n```\n\n```\nmyDataGenerator.next();\n```\n\nWe get the Generator\
    \ and start its execution by invoking the `next()` method.\n\nStarting the Generator,\
    \ we submit the request of the user's data to the server and pause its execution.\
    \ When the server returns the requested data, the callback resumes the Generator's\
    \ execution by calling the `next()` method and passing the response. This response\
    \ is assigned to the `user` variable inside the Generator and then a new request\
    \ of the user's blog is submitted and again the Generator pauses. Once the blog\
    \ data is received, the Generator resumes again, assigns the response to the `blog`\
    \ variable, and finally displays its posts by calling the `displayPostList()`\
    \ function.\n\nThe final result is an asynchronous code written as if it was synchronous.\
    \ This example, however is very rudimentary since it does not consider failures.\
    \ We could combine the Generator approach with the Promise approach in order to\
    \ get the best of both."
