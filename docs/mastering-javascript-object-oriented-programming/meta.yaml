    \ exception\n```\n\nWe can check if an object is immutable using the Object.isFrozen()\
    \ method:\n\n```\nif (!Object.isFrozen(person)) {\n  person.name = \"Mario\"\n\
    }\n```\n\n# Implementing multiple inheritance\n\nThe prototypal mechanism of inheritance\
    \ leads to the conclusion that JavaScript supports single inheritance. In fact,\
    \ as an object has just one prototype link and we can assign one prototype object\
    \ to a constructor function, we can conclude that an object can inherit features\
    \ from just one other object. However, the flexibility of JavaScript allow us\
    \ to implement multiple inheritance in a simple way."
