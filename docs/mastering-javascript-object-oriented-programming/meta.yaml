  md: "It is very important to use the new operator while creating an object through\
    \ a constructor. In fact, if we forget it, what we get is not the creation of\
    \ an object, but the execution of the function, with unpredictable results. For\
    \ example, suppose that we try to create a person omitting the new operator:\n\
    \n```\nvar johnSmith = Person();\n```\n\nThe value of the variable johnSmith will\
    \ be undefined, since the function Person() returns no value. In addition, all\
    \ the properties and methods defined within the body of the function will be assigned\
    \ to the object represented by this keyword in the execution context of the function,\
    \ as can be the example global object in a browser. This assignment could redefine\
    \ the value of variables with the same name causing side effects that are difficult\
    \ to predict and debug.\n\nWe can reduce the risk of such oversights by resorting\
    \ to the use of strict mode:\n\n```\nfunction Person() {\n  \"use strict\"\n \
    \ ...\n}\n```\n\nIn strict mode, the value of the object represented by this keyword\
    \ is undefined during the execution of the function. This generates a runtime\
    \ error while trying to access the property of an object that does not exist,\
    \ thus avoiding unwanted invocations of the constructor.\n\nUnfortunately, this\
    \ approach is not sufficient when the constructor is defined inside a namespace:\n\
    \n```\nvar mindkind = {\n...\n  Person: function(name, surname) {\n    'use strict';\n\
    \    this.name = name;\n    this.surname = surname;\n    ...\n  }\n}\nvar johnSmith\
    \ = mindkind.Person(\"John\", \"Smith\");\n```\n\nIn this case, the this keyword\
    \ represents the mind object, so we will not have a runtime error that warns us\
    \ of the incorrect use of the constructor, but the properties name and surname\
    \ will be attached to the mindkind object."
