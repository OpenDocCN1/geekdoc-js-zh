  md: "# The proxy class\n\nThe proxy class allows us to create special objects that\
    \ can change the default behavior when an object is accessed. When creating a\
    \ proxy for an object, we can define a handler and configure traps in order to\
    \ intercept accesses to its property and possibly change the standard behavior.\n\
    \nLet's explain the basic behavior of proxies with an example. Suppose we want\
    \ to track the console access to the properties of an object. We can define the\
    \ following handler:\n\n```\nvar handler = {\n  get (target, propertyName) {\n\
    \    console.log(\"Getting property \" + propertyName);\n    return target[propertyName];\n\
    \  },\n  set (target, propertyName, value) {\n    console.log(\"Assigning value\
    \ \" + value + \" to property \" + propertyName);\n    target[propertyName] =\
    \ value;\n  }\n}\n```\n\nThis handler has two methods, get() and set(), that intercept\
    \ the getter and setter of the target object. These methods are called traps and\
    \ allow intercept accesses to the target object. The getter writes to the console\
    \ and returns the value of the target's property. The setter writes to the console\
    \ and sets the passed value to the target's property. In this case, we want to\
    \ keep the standard behavior of the target object, but in general, we can return\
    \ or assign to the target's properties any value changing the default behavior.\n\
    \nOnce we have the handler, we can create a proxy for an object and assign the\
    \ handler to it:\n\n```\nvar person = new Person(\"John\", \"Smith\");\nvar proxiedPerson\
    \ = new Proxy(person, handler);\n```\n\nNow, each access to the proxiedPerson\
    \ object will affect the person object and will log on the console:\n\n```\nvar\
    \ name = proxiedPerson.name;\n//console: Getting property name\n\nproxiedPerson.name\
    \ = \"Mario\";\n//console: Assigning value Mario to property name\n```\n\n```\n\
    console.log(person.name);\n//console: Mario\n```"
