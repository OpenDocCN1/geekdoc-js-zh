  md: '# Presentation patterns


    The presentation patterns are a category of design patterns specialized in presenting
    data to the user. They are widely used in the development of user interfaces and
    their basic principle is the separation of concerns. State, logic, and synchronization
    management are distributed among components that contribute to create a specific
    architecture promoting flexibility and maintainability. The idea behind separation
    of concerns in the presentation is to make a clear division between business objects,
    are objects that describe the real world, and presentation objects, that are the
    GUI elements we see on the screen. Business objects should be completely self-contained
    and work without reference to the presentation. They should also be able to support
    multiple presentations, simultaneously, like, for example, both graphical and
    command-line interface.


    # Model, View, and Controller


    Traditionally, a presentation pattern relies on three components.


    The first component is the Model, which are the business objects that contain
    the information to be presented to the user. The model can be obtained from a
    service or is persisted in a database. It does not know anything about its way
    information will be presented to the user and does not contain any logic. It is
    just data.


    The View is the component responsible for displaying the data to the user and
    for catching user''s interaction. It composes the user interface and represents
    the current state of the Model. In a Web application, the view usually corresponds
    to the HTML markup that describes it. The third component can assume different
    names and roles, depending on the specific pattern. For example, it can be a Controller,
    Presenter, or ViewModel, as in the most known presentation patterns. This component
    usually contains the logic of the presentation architecture and may coordinate
    the information flow between the Model and View. In other words, it contributes
    to the synchronization between the current state and the underlying data model.


    In the following, we will discuss the three most known presentation patterns:
    Model-View-Controller (MVC), Model-View-Presenter (MVP), and the Model-View-ViewModel
    (MVVM). These patterns and their variants are often referred to by MV*, indicating
    that the constant parts of the patterns are the Model and View, although with
    different responsibilities. We will explore how they implement separation of concerns
    and implement the same example seen above by following the design principles of
    the three patterns.'
  merge: -1
  pgno: 141
- img_proc: false
  md: 'The presentation patterns discussed in this chapter were not included in the
    GoF patterns. They are usually considered compound patterns that are patterns
    that can be built by composing other patterns. For example, View and Controller
    have strategy implementation, View itself can be a composite implementation, and
    View and Model can be synched through the observer pattern. Due to their wide
    spread, we will discuss them as if we were not compound patterns.


    # # The Model-View-Controller pattern


    The Model-View-Controller pattern or MVC is one of the first presentation patterns
    designed in the 70s for the development of graphical user interfaces. Over the
    years, there have been several variants of the pattern, also due to the evolution
    of technology, but its basic structure remained virtually the same. As its name
    suggests, in addition to the Model and the View, the distinguishing feature is
    given by the Controller.


    The Model, View, and Controller each have their own role and all together manage
    the user interaction, as depicted in the following image:


    ![](bbox=[0.273, 0.497, 0.726, 0.759])


    The View''s role is to dealing with user''s interaction. It displays the data
    provided by the Model and gets the user''s input. The Controller interacts with
    the Model as the result of responding to the user input. When the user enters
    data through the view, the Controller intercepts the user''s input and updates
    the Model. The distribution of tasks between the three components of the pattern
    promotes the creation of a more flexible and maintainable code.'
