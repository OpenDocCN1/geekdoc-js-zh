  md: "# Working with Encapsulation and Information Hiding\n\n![](bbox=[0.237, 0.118,\
    \ 0.762, 0.483])\n\nAs a general rule, when a statement refers to a variable,\
    \ it is searched in the current scope, and if it is not found, it is searched\
    \ in the outer scope and so on until it is found or the global scope is reached.\
    \ So, in our example, the reference to the greeting variable inside the displayGreeting()\
    \ function is first searched inside the function scope itself. Since it is not\
    \ defined here, it is searched in the outer scope, that is, scope of greets()\
    \ function. Again, since the greeting variable is not defined here, it is searched\
    \ and found in the outer scope that is the global scope.\n\nThe interesting side\
    \ of this mechanism is that, in JavaScript, it is possible to access the outer\
    \ scope even when the function that created it has terminated. To better explain,\
    \ rewrite the previous code as follows:\n\n```\nvar greeting = \"Good morning\"\
    ;\nvar displayGreeting;\n```\n\n```\nfunction greets(person) {\n\nvar fullName\
    \ = person.name + \" \" + person.surname;\n```\n\n```\nreturn function () {\n\
    \  console.log(greeting + \" \" + fullName);\n}\n```"
