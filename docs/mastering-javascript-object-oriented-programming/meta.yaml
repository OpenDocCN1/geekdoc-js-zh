  md: '```

    this.address = "";

    this.email = "";


    this.displayFullName = function() {...};\n}

    ```


    This function defines the properties of our object by assigning them to the this
    keyword and setting default values. Even if this constructor may seem useless
    since it assigns just empty strings to the properties, it defines a common structure
    to any object created by it. So, in order to create an object of type person,
    we will have to call the function by prefixing the new operator:


    ```

    var johnSmith = new Person();

    johnSmith.name = "John";

    johnSmith.surname = "Smith";


    var marioRossi = new Person();

    marioRossi.name = "Mario";

    marioRossi.surname = "Rossi";

    ```


    In this way, we want to create multiple objects with the same structure, we will
    limit ourselves to just set the specific values to distinguish one object from
    another.


    As you can see, the name given to the constructor is capitalized. This is not
    a requirement for JavaScript, but a common convention that helps to distinguish
    regular functions from constructors.


    In the definition of a constructor, we can expect the presence of parameters that
