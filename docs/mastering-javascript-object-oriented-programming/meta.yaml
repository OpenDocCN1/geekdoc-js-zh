  md: '# Asynchronous Programming and Promises


    Asynchronous programming is a part of the nature of the runtime environment of
    JavaScript since its birth. Regardless code, whether it is the management of user''s
    interaction with a graphical interface or the interaction with a server or a hardware
    component of the system.


    This chapter will discuss how to manage asynchronous code in JavaScript by analyzing
    the classical approach based on callback functions, pointing out its intrinsic
    drawbacks and exploring new approaches such as the ones based on Promises and
    Generators.


    The following topics will be discussed in the chapter:


    +   - Events and asynchronous calls

    - Callback functions

    - Troubles with callbacks

    - ES6 Promises

    - A Generator-based approach


    # Is JavaScript asynchronous?


    In JavaScript programming, we often deal with activities virtually executed concurrently.
    For instance, events can occur independently from the main execution flow of an
    application and many events can occur at the same time. If we attached handlers
    for many events, we expect these to run immediately upon the occurrence of the
    associated event.'
  merge: -1
  pgno: 179
- img_proc: false
  md: 'Actually, things are not exactly like that. JavaScript concurrency model is
    not really parallel or multithread. Even if events occur in parallel, their handling
    is sequential and the interactions between the involved codes is asynchronous.
    This means that an event can occur at a given time, but the execution of its handler
    occur after some time.


    # Event loop and asynchronous code


    In languages that support concurrency, the code of a thread can be interrupted
    to take the code of another thread forward. In JavaScript, everything happens
    in one single thread. The concurrency model that gives the impression that many
    threads are executing is the **event loop**-each event inserts a message into
    a queue that will be sequentially processed by the JavaScript runtime in an endless
    loop.


    Basically, the main task of a JavaScript engine is to check for messages in the
    queue and to run the code of event handlers before moving to the next message.
    It is important to understand that the code executed between a message and the
    next one is executed without any interruption. Any event that occurs during the
    execution of a cycle of the event loop cannot stop it.


    We can realize this behavior by doing some experiments with the timers. Consider,
    for example, the following code:


    ```

    console.log("First");

    setTimeout(function() { console.log("Second"); }, 300);

    console.log("Third");

    ```


    As we expect, the output of its execution is as follows:


    +   First

    Third

    Second


    What happens if we set the timeout interval to zero?


    ```

    console.log("First");

    setTimeout(function() { console.log("Second"); }, 0);

    console.log("Third");

    ```


    Maybe we would expect that the second statement is executed immediately. Instead,
    the output will be the same as before. Even if we set an empty timeout, the execution
    of `setTimeout()` puts a message in the message queue and cannot stop the execution
    of current code. So, the `Second` string will be sent to the console after the
    completion of current execution.'
  merge: -1
