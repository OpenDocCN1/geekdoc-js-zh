  md: "# Diving into OOP Principles\n\nIn strong-typed languages, overloading is sometimes\
    \ called static polymorphism, since the correct method to invoke is detected statically\
    \ by the compiler at compile time. This is opposed to dynamic polymorphism that\
    \ concerns method overriding, as we will see in a later chapter.\n\nParametric\
    \ polymorphism allows a method to work on parameters of any type. Often it is\
    \ called generics and many languages support it with built-in methods. For example,\
    \ in C#, we can define a list of items whose type is not defined using the List<T>\
    \ generic type. This allows us to create lists of integers, strings, or any other\
    \ type.\n\nWe can also create our generic class Stack<T> by showing the following\
    \ C# code:\n\n```\npublic class Stack<T> {\n    private T[] items;\n    private\
    \ int count;\n    public void Push(T item) { ... }\n    public T Pop() { }\n}\n\
    ```\n\nThis code defines a typical stack implementation where item's type is not\
    \ defined. We will be able to create, for example, a stack of strings with the\
    \ following code:\n\n```\nvar stack = new Stack<String>();\n```\n\nDue to its\
    \ dynamic data typing, JavaScript supports parametric polymorphism implicitly.\
    \ In fact, the type of function's parameters is inherently generic, since its\
    \ type is set when a value is assigned to it. The following is a possible implementation\
    \ of a stack constructor in JavaScript:\n\n```\nfunction Stack() {\n    this.stack\
    \ = [];\n    this.pop = function() {\n        return this.stack.pop();\n    };\n\
    \    this.push = function(item) {\n        this.stack.push(item);\n    };\n}\n\
    ```\n\nSubtype polymorphism allows the consideration of objects of different types,\
    \ but with an inheritance relationship, to be handled consistently. This means\
    \ that wherever I can use an object of a specific type, here I can use an object\
    \ of a type derived from it."
