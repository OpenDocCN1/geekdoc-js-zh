    orderManager.registerDiscounter(platinumDiscounter);\n```\n\nAs we can see, it\
    \ will not be necessary to modify the OrderManager constructor.\n\n# The Liskov\
    \ Substitution Principle\n\nThe SOLID principle, the Liskov Substitute Principle,\
    \ is somewhat an extension of the Open/Closed Principle. In fact, it concerns\
    \ the possibility of extending a component through inheritance and imposes a constraint\
    \ that ensures interoperability of objects within an inheritance hierarchy. The\
    \ principle says:\n\nSubtypes must be substitutable for their base types.\n\n\
    When we use inheritance, we extend a base component to be careful not to disrupt\
    \ the functionality of the parent component when we define a derived component.\
    \ Classes, objects, functions, and other software entities that have to do with\
    \ the components of an inheritance hierarchy must be able to interact in a uniform\
    \ manner. In other words, a derived component must be semantically equivalent\
    \ to its base component. Otherwise, the new components can produce undesired effects\
    \ when they interact with existing components.\n\n> The Liskov Substitution Principle\
    \ was introduced in 1987 by Barbara Liskov, an MIT professor, during the Conference\
    \ on Object-Oriented Programming Systems Languages and Applications, in a paper\
    \ called Data abstraction and hierarchy.\n\n![](bbox=[0.136, 0.773, 0.203, 0.838])"
