  md: "# Organizing Code\n\nIn this example, we export a function, but it could be\
    \ a class, setting it as the default export.\nA module can have a single default\
    \ export, so this syntax is not exactly equivalent to a single named export. Note\
    \ that there is no semicolon at the end of the default export item.\n fact, the\
    \ exported item is an anonymous declaration, not an expression.\n\nWe import a\
    \ default export by mapping it to a name, as shown here:\n\n```\nimport myFunction\
    \ from \"myModule\";\n\nmyFunction();\n```\n\nThe following code defines an ES6\
    \ version for our geoModule:\n\n```\nvar pi = 3.14;\n\nexport function circumference(radius)\
    \ {\n  return 2*pi*radius;\n}\n\nexport function circleArea(radius) {\n  return\
    \ pi*radius*radius;\n}\n```\n\nWe import only the circumference() function in\
    \ the following way:\n\n```\nimport {circumference} from \"geoModule\"\n\nconsole.log(circumference(5));\n\
    ```\n\nA few important constraints must be taken into account when dealing with\
    \ ES6 modules:\n\n+   - The import and export of modules is static, that is, we\
    \ cannot import or export module conditionally at runtime\n- Imports are hoisted,\
    \ that is, internally moved at the beginning of the current scope, so we can use\
    \ an imported item even before the import statement\n- The imported items are\
    \ read only, that is, we cannot assign a new value outside the scope of the module\
    \ that exports them"
