  md: "# Mixing classes\n\nWe can apply the mixin pattern based on prototype augmentation\
    \ to classes as well. Let's consider, for example, the Person class definition:\n\
    \n```\nclass Person {\n  constructor(name, surname) {\n    this.name = name;\n\
    \    this.surname = surname;\n  }\n}\n```\n\nSince classes are equivalent to standard\
    \ constructor functions, they can be extended with the augment() function or the\
    \ Object.assign() method, as shown by the following code:\n\n```\naugment(Person.prototype,\
    \ myMixin);\n```\n\nAs for the constructors, we can create a Person instance with\
    \ the getFullName() method:\n\n```\nvar johnSmith = new Person(\"John\", \"Smith\"\
    );\n\nconsole.log(johnSmith.getFullName()); //result: \"John Smith\"\n```\n\n\
    Although this approach is fully functional, a more consistent approach could be\
    \ integrated with class syntax. To achieve this goal, we define a function that\
    \ extends a generic class with our mixin:\n\n```\nfunction mixWithName(superclass)\
    \ {\n  return class extends subclass {\n    getFullName() {\n      return this.name\
    \ + \" \" + this.surname;\n    }\n  }\n}\n```\n\nThis function takes a class as\
    \ argument and returns a subclass extended with our getFullName() method. This\
    \ allows us to define a new class that includes methods from the mixin, as follows:\n\
    \n```\nclass ExtendedPerson extends mixWithName(Person) { }\n```\n\n```\nvar johnSmith\
    \ = new ExtendedPerson(\"John\", \"Smith\");\n\nconsole.log(johnSmith.getFullName());\
    \ //result: \"John Smith\"\n```"
