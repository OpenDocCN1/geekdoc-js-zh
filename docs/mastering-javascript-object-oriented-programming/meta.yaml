  md: "At the time of this writing, RequireJS, the most known AMD implementation,\
    \ does not support Promises. However, some extensions and plugins like the following\
    \ allow to use them:\n\n```\nhttps://github.com/jokeyrhyme/requirejs-promise <ul>\n\
    https://github.com/requirejs/alameda\n```\n\nWe can integrate AMD the require()\
    \ function with ES6 Promises as shown in the following example:\n\n```\nfunction\
    \ requireWithPromise(modules) {\n  return new Promise(function(resolve, reject)\
    \ {\n    require(modules, resolve);\n  } catch(e) {\n    reject(new Error(e.message));\n\
    \  }\n}\n\nrequireWithPromise([\"geoModule\"])\n  .then(function(geoModule) {\n\
    \    console.log(geoModule.calculateCircumference(5));\n  })\n  .catch(function(error)\
    \ {\n    console.log(error.message); \n  });\n```\n\nThe requireWithPromise()\
    \ function takes an array of module names as a parameter and returns a Promise.\
    \ In this way, we can use the standard methods to manage the Promise, such as\
    \ then() or catch(), in the example, or as all() or race() when we need to synchronize\
    \ multiple Promises.\n\nThe AMD approach to module loading works naturally on\
    \ browsers. It can load multiple modules concurrently and is very convenient when\
    \ we do not need to load a module at page load. However, the asynchronous loading\
    \ leads to potential race conditions if not properly designed. A common criticism\
    \ of AMD concerns its syntax, which tends to become hard to understand, especially\
    \ when the dependencies array grows. Although AMD cannot guarantee the order of\
    \ execution of asynchronous modules, we can mitigate this issue by combining it\
    \ with Promises."
