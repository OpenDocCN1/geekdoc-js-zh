  md: "# Asynchronous Programming and Promises\n\nThanks to the call chaining mechanism,\
    \ the rejected Promise passes from a `then()` invocation to the subsequent one.\
    \ In fact, when a Promise is rejected and a rejection handler is not specified,\
    \ a new Promise is internally created with the same rejection reason and it is\
    \ passed to the subsequent `then()` in order to be managed. This failure propagation\
    \ allows us to use just one rejection handler function, when we manage all failures\
    \ in the same way. We can rewrite the previous example as follows:\n\n```\ngetUserData()\n\
    \  then(getBlog)\n  then(displayBlog)\n  then(null, manageError);\n```\n\nHere,\
    \ the `manageError()` function will manage any rejection that occurs in any point\
    \ of the Promise chain.\nInstead of using `null` as the first parameter of the\
    \ `then()` method, we can use an equivalent syntax by the `catch()` method of\
    \ the Promise object. So, the preceding code is equivalent to the following:\n\
    \n```\ngetUserData()\n  then(getBlog)\n  then(displayBlog)\n  catch(manageError);\n\
    ```\n\nAs we see, the use of the Promises allows to create not only more readable,\
    \ but also more robust code, since now we have the ability to intercept and appropriately\
    \ handle asynchronous errors.\n\n# Composing Promises\n\nThe example that we used\
    \ to show how to consume a Promise was a simplified version of the one we used\
    \ when we introduced the callback approach. In fact, we have only focused on showing\
    \ the blog's posts of user, omitting displaying photos. Let's recall the original\
    \ code:\n\n```\nfunction getBlogPostAndPhoto(user) {\n  getBlog(user.id);\n  getPhotos(user.albumId);\n\
    }\n\nfunction getBlog(blogId) {\n  httpGet(\"/blogs/\" + blogId, displayBlog);\n\
    }\n```"
