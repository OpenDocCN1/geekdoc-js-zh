  md: "# Using anonymous closures\n\nThe classic pattern to implement a module in\
    \ JavaScript relies on the nature of an IIFE and is usually known as the module\
    \ pattern. Since the closure of a function allows us to create a private context,\
    \ we can implement functionalities inside the body of an IIFE and export only\
    \ what we want to make publicly available. The following example defines a module\
    \ that exports geometry functions:\n\n```\nvar geoModule = (function() {\n  var\
    \ pi = 3.14;\n\n  function circumference(radius) {\n    return 2*pi*radius;\n\
    \  }\n\n  function circleArea(radius) {\n    return pi*radius*radius;\n  }\n\n\
    \  return {\n    calculateCircumference: circumference,\n    calculateCircleArea:\
    \ circleArea\n  };\n})();\n```\n\nWe can see that the anonymous function is immediately\
    \ executed and its result is assigned to a variable. The body of the function\
    \ defines the circumference() and circleArea() functions and returns an object\
    \ with two methods mapped to these functions. We say that the module exports the\
    \ members of the returned object. Note that the exported members may have different\
    \ names from the one defined internally. Thanks to the closure, the code that\
    \ will use this module will not have access to the functions and variables, but\
    \ will be able to just the exported members.\n\nWe can use the members exported\
    \ by the previous code using the object assigned to the geoModule variable, as\
    \ shown in the following example:\n\n```\nconsole.log(geoModule.calculateCircumference(5));\n\
    //result: 31.40000000000002\n```\n\n```\nconsole.log(geoModule.calculateCircleArea(5));\n\
    //result: 78.5\n```"
  merge: -1
  pgno: 211
- img_proc: false
  md: "# Organizing Code\n\nOf course a module can export not only a standard function,\
    \ but also constructor functions, literal objects, or any other item. The following\
    \ example shows a module that exports a constructor function:\n\n```\nvar myModule\
    \ = (function() {\n  function Person(name, surname) {\n    this.name = name;\n\
    \    this.surname = surname;\n  }\n\n  return {\n    Person: Person\n  };\n})();();\n\
    \nvar johnSmith = new myModule.Person(\"John\", \"Smith\");\n```\n\n# Importing\
    \ modules\n\nA module can use the exported member of another module in order to\
    \ implement its own functionalities. In this case, we say that the module imports\
    \ another module. This also means that the current module depends on the other\
    \ module.\n\nWe can import existing modules in our module by passing them as a\
    \ parameter of the IIFE. The following example shows the previous module that\
    \ imports the standard Math module:\n\n```\nvar geoModule = (function(mathModule)\
    \ {\n  var pi = mathModule.PI;\n\n  function circumference(radius) {\n    return\
    \ 2*pi*radius;\n  }\n\n  function circleArea(radius) {\n    return pi*mathModule.pow(radius,\
    \ 2);\n  }\n\n  return {\n    calculateCircumference: circumference,\n    calculateCircleArea:\
    \ circleArea\n  };\n})(Math);\n```"
  merge: -1
  pgno: 212
- img_proc: false
  md: "# Organizing Code\n\nAs we can see, the Math module is passed as a parameter\
    \ of the IIFE and it is used inside its the body. We will continue to call the\
    \ module's members as before:\n\n```\nconsole.log(geoModule.calculateCircumference(5));\n\
    //result: 31.4159265358974\n```\n\n```\nconsole.log(geoModule.calculateCircleArea(5));\n\
    //result: 78.53981633974483\n```\n\nAlthough the Math object is globally available,\
    \ it is a good practice to pass a module explicitly. This helps in understanding\
    \ the existing dependencies between different modules and helps us to possibly\
    \ replace the module on which it depends with another one with the same interface.\
    \ In other, by explicitly importing a dependency we are able to decouple modules.\
    \ Moreover, using a local variable or parameter to reference a global object is\
    \ often a good idea because it shortens the lookup chain and could possibly improve\
    \ performance.\n\n# Augmenting modules\n\nUsually, a module is contained in a\
    \ single file. In general, it is a good practice since it allows us to easily\
    \ identify the functionality implemented by an application. In some situations,\
    \ however, we may need to extend the functionalities implemented in a module without\
    \ modifying the module itself. For example, suppose we have a module that implements\
    \ standard geometry functions. In a specific function, we need to add some new\
    \ geometry functions that logically belong to the geometry module, but they are\
    \ specific for the current application and we do not want to add them directly\
    \ to the geometry module's file. The idea is to create a new file that implements\
    \ the new functions augmenting the existing geometry module. We can achieve this\
    \ by augmenting the module as shown by the following:\n\n```\ngeoModule = (function(mathModule,\
    \ me) {\nme.calculateSphereVolume = function(radius) {\n  return 4*mathModule.PI*pow(radius,\
    \ 2);\n};\n\nreturn me;\n})(Math, geoModule);\n```\n\nIn this example, we pass\
    \ the module geoModule as a parameter to the IIFE that defines the new module.\
    \ The body of the function adds the calculateSphereVolume() method to the original\
    \ module and returns it. We get exactly what we wanted-a new module that adds\
    \ functions to an existing module without altering the original module definition."
