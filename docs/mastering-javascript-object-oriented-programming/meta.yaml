  md: "# SOLID Principles\n\nThe applicability of the Liskov principle is not simple.\
    \ In fact, the extension of a component is not necessarily under our control,\
    \ especially if our code is a library used by third parties. In these cases, the\
    \ user can create derived objects and redefine functionalities at his own discretion,\
    \ with the risk of infringing the principle of Liskov.\n\nA strategy for limiting\
    \ the possibility of violations of this principle is to limit the use of inheritance,\
    \ when it is possible. The well-known suggestion of the Gang of Four says to favor\
    \ object composition over class inheritance. In fact, in addition to the potential\
    \ violation of the substitution principle of Liskov, inheritance creates coupling\
    \ between the base and derived entities and the changes propagation have effects\
    \ not always so clear. In languages with static typing, it is usually suggested\
    \ the definition of interfaces instead of the use of inheritance, but in dynamic\
    \ languages like JavaScript, this suggestion is not relevant, since the interface\
    \ of an object is not determined by the type of the object, but by the capabilities\
    \ expected by the object itself.\n\nAnyway, even if the Liskov principle refers\
    \ to inheritance, its true essence is in the behavioral compatibility, that is,\
    \ to maintain a uniform behavior for objects in a given category.\n\n# The Interface\
    \ Segregation Principle\n\nWhen designing the interface of an object, we should\
    \ define what is strictly necessary, avoiding carrying around stuff that is not\
    \ used. This is, in a nutshell, the Interface Segregation Principle, whose official\
    \ version says:\n\n+   - Clients should not be forced to depend on methods they\
    \ do not use.\n\nAlthough JavaScript does not support interfaces as abstract types\
    \ through a system, as we saw in Chapter 5, Defining Contracts with Duck Typing,\
    \ it may somehow be emulated by Duck Typing. In any case, this principle does\
    \ not refer to the interfaces as a pure syntactic element, to the whole set of\
    \ public properties and methods of an object.\n\nIn the definition of our object\
    \ interfaces, therefore, we should be careful to only define what is actually\
    \ necessary. This avoids the exposure of members that could create ambiguity and\
    \ confusion.\n\nLet's consider the following code:\n\n```\nfunction Discounter(min,\
    \ max, discountPercentage, gadget) {\n  this.min = min;\n  this.max = max;\n```"
