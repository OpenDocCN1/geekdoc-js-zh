  md: "# SOLID Principles\n\nLet's try to explain this principle with an example.\
    \ Consider the Discounter objects seen in the previous section and define a constructor\
    \ like the one shown here:\n\n```\nfunction Discounter(min, max, discountPercentage)\
    \ {\n  this.min = min;\n  this.max = max;\n  this.discountPercentage = discountPercentage;\n\
    }\n\nDiscounter.prototype.isApplicable = function(order) {\n  var itemsCount =\
    \ order.items.length;\n  return (itemsCount >= this.min && itemsCount < this.max);\n\
    };\n\nDiscounter.prototype.apply = function(order) {\n  order.totalAmount = order.totalAmount\
    \ * \n  discountPercentage / 100;\n}\n```\n\nIn practice, we generalized the discounter\
    \ features creating a constructor function, so we can define an instance as in\
    \ the following example:\n\n```\nvar bronzeDiscounter = new Discounter(10, 20,\
    \ 10);\n```\n\nNow, if we want to define a new type of discounter based on the\
    \ amount of order and not on the quantity of items, we may expand the Discounter\
    \ constructor by simply changing the isApplicable() method, as shown here:\n\n\
    ```\nfunction AmountDiscounter(min, max, discountPercentage) {\n  Discounter.apply(this,\
    \ arguments);\n}\n```\n\n```\nAmountDiscounter.prototype.isApplicable = function(order)\
    \ {\n  var orderAmount = order.totalAmount;\n\n  return (orderAmount >= min &&\
    \ orderAmount < max);\n}\n```\n\nThe change is very simple, but completely changes\
    \ the semantics of the base constructor. The AmountDiscounter definition is in\
    \ contrast to the Discounter definition and violates the Liskov Substitution Principle,\
    \ since I cannot use an instance of AmountDiscounter which currently uses an instance\
    \ of Discounter. If we do that, the results would be unpredictable, since the\
    \ old client assumes that a discounter works on quantity ranges, not on amount\
    \ ranges."
