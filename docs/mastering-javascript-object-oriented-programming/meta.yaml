  md: '# Diving into OOP Principles


    So, classical Object-Oriented programming has two types of abstractions-classes
    and objects. An object is an abstraction of a real-world entity while a class
    is an abstraction of an object or another class (in other words, it is a generalization).
    Objects in classical OOP languages can only be created by instantiating classes.


    JavaScript has a different approach to object management. It has just one type
    of abstraction-the. Unlike the classical OOP approach, an object can be created
    directly as an abstraction of a real-world entity or as an abstraction of another
    object. In the latter case the abstract object is called prototype. As opposed
    to the classical OOP approach, the JavaScript approach is sometimes called Protypical
    Object-Oriented Programming.


    Of course, the lack of notion class in JavaScript affects the inheritance mechanism.
    In fact, while classical OOP inheritance is an operation over classes, in prototypical
    OOP inheritance is an operation on objects.


    That does not mean that classical OOP is better than prototypical OOP or vice
    versa. They are simply different approaches. However, we cannot ignore that these
    differences lead to some impact in the way we manage objects. At least we know
    that while classical OOP classes are immutable, that we cannot add, change, or
    remove properties or methods at runtime, in prototypical OOP objects and prototypes
    are extremely flexible. Moreover, classical OOP adds an extra level of abstraction
    with classes, leading to a more verbose code, while prototypical OOP is more immediate
    and requires a more compact code.


    # Summary


    In this chapter, we explored the basic principles of the OOP paradigm. We have
    been focusing on defining objects, association, aggregation, and composition to
    define relationships between objects, encapsulation, inheritance, and polymorphism
    to outline the basic principles required by OOP. We have seen how JavaScript supports
    all features that we use to define it as a true OOP language and have compared
    classical OOP with prototypical OOP.


    Once we established that JavaScript is a true Object-Oriented language like other
    languages such as Java, C #, and C++, we will continue in the coming chapters
    by exploring how to take advantage of OOP support for our applications. In particular,
    in the next chapter we will focus on encapsulation and information hiding, analyzing
    the advanced JavaScript support and the most common patterns.'
