  md: 'Diving into OOP Principles


    As we can see from the example, JavaScript allows us to define association between
    objects using a simple object reference through a property.


    # Aggregation


    Aggregation is a special form of association relationship where an object has
    a major role than the other one. Usually, this major role determines a sort of
    ownership of an object in relation to the other. The owner object is often called
    *aggregate* and the owned object is called *component*. However, each object has
    an independent life.


    An example of an aggregation relationship is the one between a company and its
    employees, in this following example:


    ```

    var company = {

    name: "ACME Inc.",

    employees: []

    };


    var johnSmith = new Person("John", "Smith");

    mariRossi = new Person("Mario", "Rossi");


    company.employees.push(johnSmith);

    company.employees.push(mariRossi);

    ```


    The person objects added to the **employees** collection help define the company
    object, but they are independent from it. If the company is deleted, each single
    person still lives. However, the real meaning of a company is bound to the presence
    of its employees.


    Again, the code shows us that the aggregation relationship is supported by JavaScript
    by means of object reference.


    It is important not to confuse the Association with the Aggregation. Even if the
    support of the two relationships is syntactically identical, that is, the assignment
    or attachment of an object to a property, from a conceptual point of view they
    represent different situations.


    Aggregation is the mechanism that allows you to create an object consisting of
    several objects, while the association relationates autonomous objects.


    In any case, JavaScript makes no control over the way in which we associate or
    aggregate objects between them. Association and Aggregation raise a constraint
    more conceptual than technical.


    [ 24 ]'
