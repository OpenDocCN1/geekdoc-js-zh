  md: "# Asynchronous Programming and Promises\n\n```\nvar album = getAlbum(user);\n\
    \nprom.push(blog);\nprom.push(photos);\n\nPromise.all(promises)\n.then(function(results)\
    \ {\n    displayBlog(results[0]);\n    displayAlbum(results[1]);\n})\n.catch(manageError);\n\
    ```\n\nWe defined a promises array and filled it with the Promises created by\
    \ calling the getBlog() and getAlbum() functions. This array is passed to the\
    \ Promise.all() method, which creates the new Promise we will consume. When Promises\
    \ are resolved, we will display the data returned by the server in the order we\
    \ prefer. In the example, we first display the blog's posts and then the photos.\
    \ If any rejection occurs, the catch() method will be executed as expected.\n\n\
    An alternative way to manage multiple asynchronous tasks is by the Promise.race()\
    \ method. Like the Promise.all() method, race() takes an array of Promises and\
    \ creates a new Promise as well. However, it resolves the new created Promise\
    \ when any of the Promises contained in the array is resolved.\n\nWe can use this\
    \ feature to display the first content that becomes available after submitting\
    \ the requests of posts and photos to the server. The following code shows how\
    \ to implement it:\n\n```\nPromise.race(promises)\n.then(function(result) {\n\
    \    if (result.posts) displayBlog(results);\n    if (result.photos) displayAlbum(results);\n\
    })\n.catch(manageError);\n```\n\nThe Promise associated with the promises array\
    \ is resolved when the blog's posts or the photos are received. So, in the handler\
    \ we check which content has been received and call the respective function to\
    \ display it."
