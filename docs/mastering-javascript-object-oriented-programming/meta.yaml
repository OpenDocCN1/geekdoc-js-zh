- img_proc: false
  md: "# Implementing data binding\n\nAfter clarifying what we mean by data binding,\
    \ let's see what are the most common techniques used for its implementation. We\
    \ will explore these techniques gradually going from the simplest to the most\
    \ sophisticated that use advanced features of JavaScript.\n\n# Manual data binding\n\
    \nThe simplest way to set up a data binding relationship between two objects is\
    \ manual binding. Let's consider the following code:\n\n```\n<label>Name<input\
    \ type=\"text\" id=\"txtName\"></label><br/>\n<label>Surname<input type=\"text\"\
    \ id=\"txtName\"></label><br/>\n<button id=\"btnSave\">Save</button>\n```\n\n\
    It defines an HTML view with two text boxes and a save button. In our data binding\
    \ model, the DOM elements that correspond to the two textboxes are the data target\
    \ objects. Let's consider the following code:\n\n```\nfunction Person(name, surname)\
    \ {\n  this.name = name;\n  this.surname = surname;\n}\n\nperson = new Person(\"\
    John\", \"Smith\");\n```\n\nThe person object is the data source for the data\
    \ binding relationship we are trying to set up. The initial binding between the\
    \ data source object and the data target object can be simply done by the following\
    \ code:\n\n```\nvar txtName = document.getElementById(\"txtName\");\nvar txtSurname\
    \ = document.getElementById(\"txtSurname\");\n\ntName.value = person.name;\ntxtSurname.value\
    \ = person.surname;\n```\n\nNow, we can define a reverse-one data binding relationship\
    \ using the click event on the save button, btnSave:\n\n```\nvar btnSave = document.getElementById(\"\
    btnSave\");\n\nbtnSave.onclick = function() {\n  person.name = txtName.value;\n\
    \  person.surname = txtSurname.value;\n};\n```"
  merge: -1
  pgno: 164
- img_proc: false
  md: "# Data Binding\n\nWith this approach, we defined a synchronization mechanism\
    \ that updates the data source properties when the user changes data on the web\
    \ page.\n\n# Monitoring changes\n\nEven if rudimentary, this implementation is\
    \ working and is widely used in contexts where there is no need for a more advanced\
    \ solution. However, this approach could be not appropriate in some situations.\
    \ In fact, the synchronization between the properties is not in real time, but\
    \ it happens when the user clicks on the save button. This leaves the binding\
    \ in an inconsistent state that can lead to unexpected behaviors. For example,\
    \ an asynchronous or a scheduled task can access the data source properties when\
    \ they are not updated. What we need is a sort of automatic data binding that\
    \ updates the properties as soon as a new value is detected. In other words, we\
    \ need to monitor when changes happens.\n\nIn order to apply real-time monitoring\
    \ of changes, we can use the onchange event of the textboxes instead:\n\n```\n\
    var txtName = document.getElementById(\"txtName\");\nvar txtSurname = document.getElementById(\"\
    txtSurname\");\n\ntxtName.onchange = function() {\n  person.name = txtName.value;\n\
    };\n\ntxtSurname.onchange = function() {\n  person.surname = txtSurname.value;\n\
    };\n```\n\nThis ensures that a change on any textbox is immediately reflected\
    \ on the associated property.\n\nHowever, this approach can be applied if the\
    \ target object objects supports events, as for DOM elements. How can we implement\
    \ a real-time property update without events?\n\nSuppose, for example, we want\
    \ to create a two-way data binding between the textboxes and the properties of\
    \ the person object, we need to complete the current binding by allowing the automatic\
    \ update of textboxes when the properties of the person object change. However,\
    \ we cannot rely on events, since our object does not support them.\","
  merge: -1
  pgno: 165
- img_proc: false
  md: "A way around the problem is to define specialized methods to get and set values\
    \ of the properties. Let's define a factory of the person object:\n\n```\nfunction\
    \ createPerson(name, surname) {\n  var _name = name;\n  var _surname = surname;\n\
    \  var txtName = document.getElementById(\"txtName\");\n  var txtSurname = document.getElementById(\"\
    txtSurname\");\n\n  txtName.value = _name;\n  txtSurname.value = _surname;\n\n\
    \  return {\n    name: function(value) {\n      if (value) {\n        _name =\
    \ value;\n        txtName.value = _name;\n      }\n      return _name;\n    },\n\
