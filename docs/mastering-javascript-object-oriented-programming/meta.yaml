  md: '# SOLID Principles


    According to Robert C. Martin, one of the co-authors of the Agile Manifesto, there
    are three characteristics of bad design to be avoided:


    +   - **Rigidity**: This is the difficulty of modifying an application because
    any change involves too many parts of the system

    - **Fragility**: This is the generation of bugs in a part of an application due
    to changes in other parts of it

    - **Immobility**: This is the inability to use a component in another software
    because it is too dependent on the current application


    In order to avoid these issues, Martin suggests some design principles commonly
    known as SOLID.


    SOLID is a mnemonic acronym that refers to a set of five principles at the base
    of a good software design:


    +   - Single Responsibility Principle

    - Open/Closed Principle

    - Liskov Substitution Principle

    - Interface Segregation Principle

    - Dependency Inversion Principle


    The application of these principles helps us to identify potential situations
    that put the design of our applications at risk.


    Although, in general, these principles are related to the context of classical
    Object-Oriented Programming and refer to classes, types, and interfaces, the underlying
    concepts are also applicable to a dynamically typed and prototype-based language
    such as JavaScript. Let’s start to analyze these principles and learn how to apply
    them in the development of our applications by one.


    # The Single Responsibility Principle


    The first principle of the SOLID stack is the **Single Responsibility Principle**.
    Following Martin’s definition, the principle says:


    > A class should have only one reason to change.'
