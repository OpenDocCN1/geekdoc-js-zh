  md: "# A Refresher of Objects\n\nActually, the distinction between properties and\
    \ methods is somewhat artificial in JavaScript. In fact, since the functions are\
    \ also objects, a method is nothing more than a property that has been assigned\
    \ a function.\n\nIncidently, the value assigned to a property can change at runtime,\
    \ it is possible that a property, which was initially assigned a function, can\
    \ then be assigned a different value, such as a string or a number. Unlike other\
    \ programming languages, a method is not a stable condition for a member of an\
    \ object, it is not a characteristic of a specific property. We can simply affirm\
    \ that a property is a method when it has a function assigned, but it is a dynamic\
    \ condition.\n\nIn the previous example, we defined a function that returns a\
    \ string and we assigned that name to a new property of the person object. Note\
    \ that we are not assigning the result of the function call to the property, but\
    \ the function itself by means of its name.\n\nThe `fullName` property, since\
    \ it has been assigned a function, is actually a method. To run it, we must refer\
    \ to it by specifying parentheses in a usual function call:\n\n```\nvar nameAndSurname\
    \ = person.fullName();\n```\n\nOf course, we can assign an anonymous function\
    \ to a property directly as we are in the following example:\n\n```\nperson.fullname\
    \ = function () {\n  return \"John Smith\";\n}\n```\n\nThe method that we just\
    \ defined in the example is not so useful. It always displays the same string\
    \ if we assign a different value to name and surname of the person object. It\
    \ would be useful to have a way to display the current value of the corresponding\
    \ properties.\n\nJavaScript allows us to reach this goal through this `this` keyword.\
    \ The keyword represents the object when the method is invoked. So we can rewrite\
    \ our method in the following way:\n\n```\nperson.fullName = function () {\n \
    \ return this.name + \" \" + this.surname;\n};\n```\n\nThis guarantees the correct\
    \ display of the current data at the time of the call."
  merge: -1
