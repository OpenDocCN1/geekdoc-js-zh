  md: '# Benefits and drawbacks


    Compared to the convention-based approach, the use of closure to define the three
    levels of privacy is much more effective. It actually grants private data protection
    and exposes just what the developers needs to access to the object. However, this
    solution suffers from some flaws.


    The first point is purely formal. Both privileged methods and private functions
    break the separation of concerns between the constructor and the instance prototype
    of an object. In fact, the constructor should be responsible for data initialization
    of an object instance. The prototype should be responsible for general methods
    definitions and shared functionalities. By defining methods inside the constructor,
    we are giving it a responsibility for which it has not been designed.


    Another drawback regards memory consumption. By attaching a method to the prototype
    of a constructor, the prototype mechanism grants us just one copy of the method
    definition that exists in the application. Instead, each privileged method definition
    is replicated for each object instance, unnecessarily increasing memory consumption.


    In order to mitigate memory consumption, we can choose to define a minimum set
    of privileged methods and to delegate to public those functionalities resulting
    from the composition of privileged methods. We used this approach for the isSoldOut()
    and countFreeSeats() methods definition. Although this expedient allows us to
    reduce memory consumption, we will have some loss in performance due to indirect
    access to the constructor''s closure as a counterpart.


    # A meta-closure approach


    The basic idea of the previous approach builds on the nature of closure. The constructor''s
    environment is protected by default and accessible from the inside of the constructor.
    However, since the closure is created when the constructor is called, each object
    instance needs to have private data and privileged methods defined inside the
    constructor context. An ideal solution would be one that protects private data
    letting them accessible from outside the constructor''s closure. This should be
    a sort of meta-closure that offers an extra level of protection-a closure accessible
    from outside the object constructor by prototype members still hiding private
    data of the resulting object. This meta—closure can be built using an Immediately
    Invoked Function Expression (IIFE).'
