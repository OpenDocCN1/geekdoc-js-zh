  md: "# Presenting Data to the User\n\nThe ViewModel definition exposes the name\
    \ and surname properties of the underlying Model via its read-only properties.\
    \ Moreover, it defines the save() method that allows to update the Model after\
    \ data validation. An interesting point in the save() method is the presence of\
    \ the callback argument. This argument allows the caller to pass a function that\
    \ will be called after the Model updating with information about the outcome of\
    \ the operation. In case, the ViewModel passes the message to be displayed as\
    \ a parameter of the callback function. The use of the callback function allows\
    \ to make the ViewModel independent from the View. Of course other techniques\
    \ could be used, such as making the save() method to return the message or, even\
    \ better, return code. The goal is to make the ViewModel unaware of the View using\
    \ it.\n\nWe can define the ViewModel as a class with the following code:\n\n```\n\
    class ViewModel {\n  constructor(model) {\n    this.model = model;\n  }\n\n  get\
    \ name() {\n    return this.model.name;\n  }\n\n  get surname() {\n    return\
    \ this.model.surname;\n  }\n\n  save(data, callback) {\n    if (data.name && data.surname)\
    \ {\n      this.model.name = data.name;\n      this.model.surname = data.surname;\n\
    \    }\n\n    if (callback) {\n      callback(\"Saved!\");\n    }\n\n  } else\
    \ {\n    if (callback) {\n      callback(\"Please, enter name and surname!\");\n\
    \    }\n  }\n}\n```"
