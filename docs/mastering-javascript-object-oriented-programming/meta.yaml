  md: '# From scripts to applications


    The growing role of JavaScript in application development is clear to everyone.
    Once it was a simple language to add interactivity to HTML pages, now the role
    of JavaScript has become increasingly important enough to completely overturn
    the relationship with HTML, its historical pattern. In fact, a few years ago,
    web applications were primarily HTML markup with the addition of some JavaScript
    scripts; today, the majority of complex applications are represented by JavaScript
    code that controls the HTML markup and display.


    Even outside of the web browser context, the role of JavaScript is increasing.
    Today, a JavaScript application is able to run on servers, desktop applications,
    mobile devices, and on embedded systems.


    This evolution gives JavaScript more responsibility than it had, when its role
    was mostly about interactivity management and posting data to the server. What
    used to be a collection of simple scripts has now become a complex combination
    of components that interact with each other to perform a certain job—it has become
    an application.


    # What is a large-scale application?


    Of course, an application requires a certain organization with respect to a collection
    of scripts. Indeed, while in most cases each script is limited to exercising its
    mission and possibly interacting with other scripts, an application requires a
    greater coordination among the components, a centralized management features such
    as error handling, logging, and on. This responsibility, along with others, becomes
    more evident when an application grows and becomes large.


    But what exactly is a large-scale application?


    The answer to this question is quite subjective, since in most cases it depends
    on the experience of the single developer. Some people associate the size to the
    number of lines of code, others combine the number of features or components involved.
    In any case, it is difficult to give an objective definition of what actually
    is a very large application.'
  merge: -1
  pgno: 256
- img_proc: false
  md: 'A definition with which I can agree is that provided by Addy Osmani:


    > Large-scale JavaScript applications are non-trivial applications requiring significant
    developer effort to maintain, where most heavy lifting of data manipulation and
    display falls to the browser.


    Osmani''s definition explicitly refers to web applications, I think that it can
    be considered valid for any type of application. The key point is that the size
    of an application does not depend on a specific number of technical application''s
    elements, but on the effort required for its maintenance, that is from an activity
    in the future. The size of an application essentially depends on its complexity
    and the energy required to meet requests for change. This is not a scientific
    measurement, but yet another subjective point of view. However, it emphasizes
    a fundamental aspect of programming—the software changes over time.


    With this basic assumption, we have to design our application so that it has a
    structure that can make our life easier in future developments. In other words,
    we need to define an architecture for our applications.


    # What is an application architecture?


    The architecture of an application is the definition of its structure and the
    design of the interactions between its components decided according to specific
    project goals. It is very important to note that an application''s architecture
    is determined not only by its features, but also by the project''s cross requirements,
    such as performance, extensibility, maintainability, security, reusability, and
    so on. This means that there is no universal architecture, an architecture valid
    for any application. There are specific architectures for specific requirements.
    However, we have architectural patterns used in several common scenarios from
    which we can be inspired to choose a model for our application. As an example,
    the most common architectural patterns include the client/server architecture,
    the layered architecture, the service-oriented architecture, and so on. Of course,
    these are very general architectural patterns. More specific architectural pattern
    helps us to structure our applications in a more targeted way, as we will see
    later in this chapter.'
  merge: -1
  pgno: 257
- img_proc: false
  md: '# Goals of an architecture design


    Usually architecture designs for an application are among the most difficult aspects
    to modify over time and have long-term consequences on an application''s life.
    For this reason, it is necessary to define the architecture of an application
    accurately and wisely, trying to balance the three categories of requirements
    that usually drive a software project:


    +   * **User or customer requirements**: Generally, these features and their usability
    to be implemented, but may include any other constraints explicitly declared by
    the customer or owner.

    * **Business requirements**: This category includes requirements concerning the
    project''s cost-effectiveness, both as per the first release and subsequent evolution
    and maintenance; some constraints, such as access to specific features based on
    a license, fall also into this category of requirements.

    * **System requirements**: These requirements are related to the hardware and
    software platform on which the application will run and any constraints on deployment.


    The satisfaction of these three categories of requirements must be taken into
    account when choosing a specific architecture for our application.


    # From old-style to Single Page Applications


    Web applications are the best known application types involving JavaScript. Since
    its appearance, JavaScript and web browsers have established a lasting symbiosis
    that still holds, although with slightly different roles than in the past. In
    this context, in fact, we have seen a growing responsibility of JavaScript whose
    evolution, together with the evolution of HTML, has led us to create applications
    with an interaction model and an architecture very similar to desktop applications.


    # Old-style web applications


    The traditional architecture of the early web applications consisted (and still
    consists) of a set of HTML pages, representing the user interface, with JavaScript
    scripts whose main task was managing the user interaction and rendering some graphic
    effects. As a part of this architecture, the transition from one screen to the
    next one implied a request to the server and a whole page loading, with obvious
    latency, especially if the page was very rich in content (graphics, text, and
    scripts).'
