  md: "# Working with Encapsulation and Information Hiding\n\nThis classification\
    \ defines three privacy levels, and it requires us to use different approaches\
    \ to implement them in a JavaScript object:\n\n+   - A private member must be\
    \ implemented as a local variable or function of the constructor\n- A public member\
    \ must be implemented as a member of this keyword, if it is a property, or as\
    \ a member of the constructor's prototype, if it is a method\n- A privileged member\
    \ must be implemented as a member of this keyword inside the constructor\n\nThe\
    \ following code shows a version of the TheatreSeats() constructor that implements\
    \ the three privacy levels:\n\n```\nfunction TheatreSeats() {\n  var seats = [];\n\
    \nthis.placePerson = function(person) {\n    seats.push(person);\n};\nthis.countOccupiedSeats\
    \ = function() {\n  return seats.length;\n};\nthis.maxSize = 10;\n}\n\nTheatreSeats.prototype.isSoldOut\
    \ = function() {\n  return this.countOccupiedSeats() >= this.maxSize;\n};\nTheatreSeats.prototype.countFreeSeats\
    \ = function() {\n  return this.maxSize - this.countOccupiedSeats();\n};\n```\n\
    \nAs we know, the seats variable is a private member, and it is not accessible\
    \ from outside the constructor's closure. The placePerson() and countOccupiedSeats()\
    \ methods are privileged members, since they can access the private variable seats.\
    \ The maxSize property and the isSoldOut() and countFreeSeats() methods are public\
    \ members since they do not directly access private members. However, they access\
    \ the seats variable indirectly through the privileged methods."
