  md: "# Managing isolated private members\n\nA way to bypass the problem of static\
    \ private members creation is to identify each object instance and attach to it\
    \ its private set of data. Consider the following code:\n\n```\nvar TheatreSeats\
    \ = (function() {\n  var priv = {};\n  var id = 0;\n\n  function TheatreSeatsConstructor()\
    \ {\n    this.id = id++;\n    this.maxSize = 10;\n\n    priv[this.id] = {};\n\
    \    priv[this.id].seats = [];\n  }\n\n  TheatreSeatsConstructor.prototype.placePerson\
    \ = function(person) {\n    priv[this.id].seats.push(person);\n  };\n\n  TheatreSeatsConstructor.prototype.countOccupiedSeats\
    \ = function() {\n    return priv[this.id].seats.length;\n  };\n\n  TheatreSeatsConstructor.prototype.isSoldOut\
    \ = function() {\n    return priv[this.id].seats.length >= this.maxSize;\n  };\n\
    \n  TheatreSeatsConstructor.prototype.countFreeSeats = function() {\n    return\
    \ this.maxSize - priv[this.id].seats.length;\n  };\n\n  return TheatreSeatsConstructor;\n\
    })();\n```\n\nWe highlighted the main differences with the previous version of\
    \ the code. In this case, we declared two variables in the scope of the anonymous\
    \ function: priv and id. The former is an object that will contain the private\
    \ members of each object instance, the latter will contain a numeric identifier\
    \ that will be attached to each object instance. These variables will be available\
    \ in the closure of the anonymous function so that they will be static variables\
    \ shared among all object instances."
  merge: -1
