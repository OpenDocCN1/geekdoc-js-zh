  md: "# Defining Contracts with Duck Typing\n\nIn Java, we will use the following\
    \ syntax:\n\n```\npublic class DevStudent implements IProgrammer {\n  ...\n}\n\
    ```\n\nIt is important to point out that an interface establishes the minimum\
    \ set of features required to comply with a contract, that is, to interact with\
    \ another object. An object can implement other methods or properties that are\
    \ not included in an interface. It can also implement more than one interface.\n\
    \n# Duck typing\n\nWe introduced the concepts of contract and interface and mentioned\
    \ how interfaces are defined in two well-known strongly typed languages. Contracts\
    \ enforced by the implementation of interfaces would allow us to solve the problem\
    \ of hiring just developers, that, persons allow to write code. However, we saw\
    \ that in languages such as C# and Java rely on their type checking system. How\
    \ can we benefit from contracts and interfaces in JavaScript?\n\nJavaScript neither\
    \ has a native support for interfaces nor allows us to define new types. Moreover,\
    \ it is an extremely dynamic language that not only allows to create objects with\
    \ specific members but also to change their structure at runtime that we cannot\
    \ make any assumptions based on instance type or other similar static information.\
    \ However, we can try to define contracts using the duck duck typing.\n\nDuck\
    \ typing is a programming technique where a contract is established between a\
    \ function and its caller, requiring the parameters passed in the caller to have\
    \ specific members. David Thomas gave this curious name to this technique referring\
    \ to the colloquial saying “If it walks like a duck and quacks like a duck, it\
    \ is a duck.”\n\nDuck typing is not so much a type system as it is an approach\
    \ to treating objects as if they are certain types based on their behavior rather\
    \ than their declared type. In other words, rather than checking if an object\
    \ is a duck, we check if it behaves like a duck.\n\nLet’s see how we can implement\
    \ duck typing in JavaScript."
  merge: -1
  pgno: 102
