  md: "# Object constructors\n\nThe creation of an object, as we have seen in the\
    \ examples, is quite straightforward using the literal notation. We do not have\
    \ to define a class, but we directly create the object just when we need it, and\
    \ hopefully we can change its structure during the execution of our script.\n\n\
    Supose, we need multiple objects of the same type, for example more person objects,\
    \ which share the same structure.\n\nUsing the literal notation, we will have\
    \ to repeat the definition for each object that we want to create, which is essential\
    \ to identify the single person but unnecessarily repetitive for constant members\
    \ as the methods. In other words, using the literal notation in the definition\
    \ of the objects, we get no reusable result. For example, if we want to create\
    \ person objects, we need to write the following code:\n\n```\nvar johnSmith =\
    \ {name: \"John\",\n  surname: \"Smith\",\n  address: {\n    street: \"13 Duncannon\
    \ Street\",\n    city: \"London\",\n    country: \"United Kingdom\"\n  },\n  displayName\
    \ = function() {\n    return this.name + \" \" + this.surname;\n  }\n};\nvar marioRossi\
    \ = {name: \"Mario\",\n  surname: \"Rossi\",\n  address: {\n    street: \"Piazza\
    \ Colonna 370\",\n    city: \"Roma\",\n    country: \"Italy\"\n  },\n  displayName\
    \ = function() {\n    return this.name + \" \" + this.surname;\n  }\n};\n```\n\
    \nTherefore, in order to avoid defining from scratch objects that have the same\
    \ structure, we can use a constructor–a JavaScript function invoked using the\
    \ new operator. Let's see how to a constructor for the person object with an example:\n\
    \n```\nfunction Person() {\n  this.name = \"\";\n  this.surname = \"\";\n```"
