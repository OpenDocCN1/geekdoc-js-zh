  md: "# Asynchronous Programming and Promises\n\n```\nreturn httpGet(\"/blogs/\"\
    \ + user.blogId);\n}\n\nfunction displayBlog(blog) {\n    displayPostList(blog.posts);\n\
    }\n\nfunction handleError(error) {\n    console.log(error.message);\n}\n```\n\n\
    ```\ngetUserData()\n  .then(getBlog, handleError)\n  .then(displayBlog, handleError);\n\
    ```\n\nIn, we introduced the handleError() function whose task is simply to show\
    \ the error message on the console. This function is passed as the second parameter\
    \ of the then() method, and it will be executed when the Promise is rejected.\n\
    \nIn this example, we use the same handler for managing Promise rejections, but\
    \ of course, we can use specific handlers for each Promise. It only depends on\
    \ how we want to manage rejections.\n\nWe have already seen that the second parameter\
    \ of the then() method is optional. Also, the first parameter is optional. In\
    \ fact, we can pass null as the first parameter of then() pointing out that we\
    \ want to manage Promise rejections. For example, we could write the following\
    \ code:\n\n```\ngetUserData()\n  .then(null, handleError);\n```\n\nThis code will\
    \ ignore the resolved Promise and will only manage possible errors. From a practical\
    \ point of view, this has little meaning in the specific case. However, we can\
    \ use this approach to explicitly separate the resolved Promise management from\
    \ its possible rejection, as in the following:\n\n```\ngetUserData()\n  .then(getBlog)\n\
    \  .then(null, handleError);\n```"
