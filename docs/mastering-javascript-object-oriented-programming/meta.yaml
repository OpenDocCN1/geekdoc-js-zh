  md: 'We started by exploring the Mode-View-Controller pattern, whose components
    have a clear role and cooperate to manage the interactions between the user and
    the underlying data model. Then, we illustrated the Model-View-Presenter pattern,
    a pattern derived from MVC whose main difference is the introduction of a layered
    system. In fact, this pattern prevents a View to directly access the Model. This
    access is always mediated by the Presenter. Finally, we analyzed the View-Model-ModelView
    pattern, which maintains the layered component between the View and the Model.
    This component is a specialized model for the view—the ViewModel. A comparison
    among the three patterns closed the approach of MVP and adds a new way to interpreting
    the role of the intermediary component


    In the next chapter, we will explore a topic bound in someway to the presentation
    patterns. We will discuss the approaches to data binding and synchronization completing
    and improving the way we can present data to the user.'
