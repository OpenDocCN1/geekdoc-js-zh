    # Dependency inversion, inversion of control, and dependency injection


    Often, there is confusion between dependency inversion, inversion of control,
    and dependency injection. The three concepts are somewhat connected, but they
    are not exactly the same thing. We will try to make things clearer.


    Dependency inversion is a software design principle, the last principle of the
    SOLID stack. As we said in this section, it states how two components should depend
    on each other and suggests that high-level components should not depend on low
    level components. It does not say how to do it or which technique to use.'
