  md: "# Dynamic data types\n\nWe know that a variable does not have an associated\
    \ type declaration in JavaScript. It can contain any value and its type depends\
    \ on its content. This does not mean that JavaScript does not support data types.\
    \ It just means that a variable is not constrained to support a certain type of\
    \ value.\n\nLet's consider the following function definition:\n\n```\nfunction\
    \ square(n) {\n  return n * n;\n}\n```\n\nIn the intention of the developer, it\
    \ calculates the square of a number. In fact, if we pass a number to this function\
    \ we will get the correct output value:\n\n```\nconsole.log(square(3));      //result:\
    \ 9\n```\n\nBut, what if we pass a value other than a number, say a string? JavaScript\
    \ is very tolerant and it tries to return a value by making some implicit type\
    \ conversions. For example, if we pass a string representing a number we will\
    \ get the correct output value:\n\n```\nconsole.log(square(\"3\"));      //result:\
    \ 9\n```\n\nIf we pass different string numbers or different data values, we will\
    \ get results that do not resemble square numbers, as maybe the developer wanted:\n\
    \n```\nconsole.log(square(\"three\\));  //result: NaN\nconsole.log(square(true));\
    \      //result: 1\nconsole.log(square({a: 2}));   //result: NaN\n```\n\nIf we\
    \ want that a function accepts only a specific data type, we have to check it\
    \ ourselves, as follows:\n\n```\nfunction square(n) {\n  var result;\n\n  if (typeof\
    \ n === \"number\") {\n    result = n*n;\n  } else {\n    throw new Error(\"Wrong\
    \ data type!\")\n  }\n\n  return result;\n}\n```"
