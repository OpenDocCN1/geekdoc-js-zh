  md: "# Scope and closure\n\nBefore going further, it is useful to make clear some\
    \ concepts that are used very often in JavaScript programming and on which we\
    \ will build our approach to implement the information hiding principle. Let's\
    \ start with the following example:\n\n```\nvar greeting = \"Good morning\";\n\
    \nfunction greets(person) {\n  var fullName = person.name + \" \" + person.surname;\n\
    \n  function displayGreeting() {\n    console.log(greeting + \" \" + fullName);\n\
    \  }\n\n  displayGreeting();\n}\n\ngreets({name: \"John\", surname: \"Smith\"\
    });\n```\n\nWe defined the greets() function that takes a person object as argument\
    \ and displays a string resulting from the concatenation of the greeting with\
    \ the full name of the person. The actual function displaying the greeting is\
    \ the displayGreeting() function defined inside the body of greets() function.\n\
    \nWe already know that a variable or argument has a visibility scope that is a\
    \ context inside which it is accessible. Each function creates its own scope,\
    \ variables, parameters, or functions defined inside the body of a function are\
    \ not accessible by code outside its body. The code of a function can access variables\
    \ defined in the function's scope, but it can also access variables defined in\
    \ the outer scope, that is, the external context that contains the function.\n\
    \nThis led us to think of scopes as nested containers where the inner container\
    \ can access the outer container, but not vice versa. This is usually known as\
    \ the scope chain. The following picture shows how we can graphically represent\
    \ the scope chain of our example:"
