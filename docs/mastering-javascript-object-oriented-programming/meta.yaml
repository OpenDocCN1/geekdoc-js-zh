  md: "# Asynchronous Programming and Promises\n\n```\ngetUserData()\n  .then(getBlogAndPhotos)\n\
    \  .catch(manageError);\n```\n\nAll we have done here is to integrate the previous\
    \ Promise-based code with a new HTTP to retrieve the photos associated with the\
    \ user. We introduced the\ngetBlogAndPhotos() function to handle the two asynchronous\
    \ tasks that will retrieve both posts and photos. But, how Promises will be handled\
    \ in this case? What happens if one Promise is resolved and the other one rejected?\n\
    \nIf both Promises created inside the getBlogAndPhotos() function are resolved,\
    \ we will get posts and photos displayed on the page. The order in which they\
    \ will be displayed is not determined-they will be displayed as they will be received\
    \ and the Promise is resolved. So, when\n\nHowever, unlike we would expect, if\
    \ one or both Promises are rejected, we will not get them managed as we. The manageError()\
    \ function will not be called. In fact, 예정이다 to what we said about the chaining\
    \ mechanism of the then() method, if our resolved Promise handler does not return\
    \ anything, in our case, a new Promise is created and passed to the subsequent\
    \ handler in the chain. When one or both Promises created by the getBlogAndPhotos()\
    \ function is executed, it implicitly passes a resolved Promise to the next handler.\
    \ Since we have a catch() method, the resolved Promise is ignored and the chain\
    \ of Promises is considered resolved. When one created by the getBlog() and getPhotos()\
    \ functions are rejected, they will no longer be able to pass to the catch() method,\
    \ since it is no longer waiting for their settling.\n\nWhen we need to get the\
    \ result of a multiple asynchronous task, we should use the all() method of the\
    \ Promise constructor. This method allows us to wait for all associated Promises\
    \ be resolved. So, we can synchronize the asynchronous tasks and manage their\
    \ results at once. The Promise.all() method takes an array of Promises and creates\
    \ a Promise that will be resolved when all of them are resolved. When all the\
    \ Promises in the array are resolved, an array with the corresponding resolved\
    \ values will be passed to the handler function. If any of the Promises are rejected,\
    \ the entire array of Promises are rejected and the catch() method is called.\n\
    \nSo, we can use the Promise.all() method in order to wait for a blog's posts\
    \ and photos availability before displaying their content. This allows us to decide\
    \ the content's display order and to correctly manage possible rejection. Now,\
    \ we can rewrite our code as the following:\n\n```\ngetUserData()\n  .then(function(user)\
    \ {\n    var promises = [];\n    var blog = getBlog(user);\n```"
