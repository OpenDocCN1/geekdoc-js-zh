  md: 'Diving into OOP Principles


    # OOP principles


    OOP is one of the most popular programming paradigms. Many developers use languages
    based on this programming model such as C++, Java, Smalltalk, C#, Objective-C,
    and many other. One of the keys to the success of this programming approach is
    that it promotes a modular design and code reuse-two important features when developing
    complex software.


    However, the OOP paradigm is not based on a formal specification. There is no
    technical document that defines what OOP is and what it is not. The OOP definition
    is mainly based on common sense taken from the papers published by early researchers
    like Kristen Nygaard, Alan Kays, William Cook, and others.


    An interesting discussion about various attempts to define OOP can be found online
    at the following URL:

    http://c2.com/cgi/wiki?DefinitionsForOo


    ![](bbox=[0.135, 0.37, 0.198, 0.417])


    Anyway, a widely accepted definition to classify a programming language as Object
    Oriented is based on two requirements-its capability to model a problem through
    objects and its support of a few principles that grant modularity and code reuse.


    In order to satisfy the first requirement, a language must enable a developer
    to describe the reality using objects and to define relationships among objects
    objects such as the following:


    +   - **Association**: This is the object''s capability to refer another independent
    object

    - **Aggregation**: This is the object''s capability to embed one or more independent
    objects

    - **Composition**: This is the object''s capability to embed one or more dependent
    objects


    Commonly, the second requirement is satisfied if a language supports the following
    principles:


    +   - **Encapsulation**: This is the capability to concentrate into a single entity
    data and code that manipulates it, hiding its internal details

    - **Inheritance**: This is the mechanism by which an object acquires some or all
    features from one or more other objects

    - **Polymorphism**: This is the capability to process objects differently based
    on their data type or structure'
  merge: -1
