    \ real context, the data may be updated, for example, as a result of an Ajax call\
    \ or by an asynchronous task.\n\n# Hacking properties\n\nThe previous proposed\
    \ approach to monitoring changes of the data source properties is based on the\
    \ definition of specialized getters and setters. That solution works properly\
