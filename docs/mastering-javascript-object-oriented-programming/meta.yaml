  md: "While in the observer pattern, the subject itself manages the communication\
    \ with its observers, in the publisher/subscriber pattern this task is assigned\
    \ to the observable object.\nThe following diagram shows this new scenario:\n\n\
    ![](bbox=[0.343, 0.197, 0.656, 0.555])\n\nWe will take this pattern as a reference\
    \ to implement a new approach for data binding.\n\n# Implementing observables\n\
    \nDifferent from what we made so far, we will try to implement data binding introducing\
    \ an intermediary object between the data source object and the data target object,\
    \ as suggested by the publisher/subscriber pattern. Our intermediary object will\
    \ be the observable object implemented by the following function:\n\n```\nfunction\
    \ observable(value) {\n  var subscribers = [];\n\nfunction notify(newValue) {\n\
    \  for (var i = 0; i < subscribers.length; i++) {\n    subscribers[i](newValue);\n\
    \  }\n}\n```"
