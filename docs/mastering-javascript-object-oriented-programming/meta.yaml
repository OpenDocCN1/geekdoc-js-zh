  md: "# Immediately invoked function expressions\n\nAn IIFE, also called a self-executing\
    \ anonymous function, is a JavaScript expression involving an anonymous function\
    \ definition immediately executed. The following is a minimal example of such\
    \ an expression:\n\n```\nvar value = function() { return 3 + 2; };\n```\n\nWe\
    \ can see that it consists of a standard anonymous function definition followed\
    \ by the invocation operator ((). At first glance, it may seem a weird expression;\
    \ but if we reason a moment, we find that it is less strange than it seems. In\
    \ fact, in JavaScript functions are also object, we can assign them to variables.\
    \ For example, we can write the following assignment:\n\n```\nvar aFunction =\
    \ function() { return 3 + 2; };\n```\n\nThen, we can call the function by simply\
    \ attaching the () operator at the end of the variable:\n\n```\nvar value = aFunction();\n\
    ```\n\nThe IIFE simply completes these steps into one assignment.\n\nBut, how\
    \ can an IIFE help in protecting privacy allowing privileged methods to be defined\
    \ outside the constructor? IIFE expressions involve function definitions, and\
    \ like any function definition, they build closures. If we combine the ability\
    \ of a JavaScript function to return another function, we create nested closures\
    \ that bring us closer to our solution.\n\n# Creating a meta-closure with an IIFE\n\
    \nLet's rewrite our TheatreSeats constructor using an IIFE. The following may\
