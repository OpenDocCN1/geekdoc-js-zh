  md: "# When to use singletons?\n\nWhen we introduced singletons, we provided some\
    \ examples in which they can be used. Not only did we mention the configuration\
    \ and cache managers, but also mentioned that the log manager could be a good\
    \ candidate. However, the choice to implement the singleton pattern must be made\
    \ carefully, otherwise we creating objects that pollute the global environment\
    \ and can become a bottleneck in the system. From a certain point of view, we\
    \ can consider singletons as global variables whose drawbacks we all know. In\
    \ particular, its globally availability may create tight coupling among the various\
    \ components of the application, reducing their reusability.\n\nSo, in order to\
    \ decide whether to implement an object as a singleton, we can ask ourselves it\
    \ is really necessary and possibly use it with caution\n\n# An object factory\n\
    \nIn some contexts, we need to create different types of objects, but we wish\
    \ to manage their creation in a uniform way. Consider, for example, a word processor\
    \ that need to allow the user to add elements to a document: words, paragraphs,\
    \ images, sections, and so on. Each type of object will have a class or constructor\
    \ that will create the required object and will put it on the document. This means\
    \ that the document manager needs to know how to create each type of object. Moreover,\
    \ when a new type of element is added to the processor's capability, say tables,\
    \ the document manager must be modified in order to how to create these new elements.\n\
    \nIn these cases, the **factory pattern** can help us up a more effective approach.\n\
    \n# Understanding factories\n\nIn general, a factory is an entity (a function\
    \ and an object) used to create objects, as in the following basic example:\n\n\
    ```\nfunction createPerson(name, surname) {\n  return {name: name, surname: surname};\n\
    }\n```\n\nUnlike a constructor function, this factory returns the object it creates\
    \ without using the `new` operator:\n\n```\nvar johnSmith = createPerson(\"John\"\
    , \"Smith\");\n```"
