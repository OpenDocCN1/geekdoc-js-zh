  md: '# #6 Advanced Object Creation


    The JavaScript Object-Oriented Programming model has no classes, and it is directly
    based on objects, whose creation process may happen in different ways. We already
    talked about the standard ways in which we can create objects, but in some situations,
    we may need a more sophisticated approach.


    This chapter introduces the group of design patterns known as creational patterns,
    that is, patterns concerning the creation of an object in a structural way. After
    a reminder on the standard ways to create objects, we will show you how to take
    advantage of the following patterns:


    +   * Singleton pattern

    * Factory pattern

    * Abstract factory pattern

    * Builder pattern

    * Object pool pattern


    # ## Creating objects


    We have seen in previous chapters the different ways JavaScript allows us to create
    objects. We can use the literal notation to create objects in an extremely easy
    manner or we can apply a constructor function, we can create instances of a `class`
    definition or invoke the `Object.create()` method. Each approach has its benefits
    and drawbacks, and we can use what we consider most suitable for our needs.


    The literal notation is the easiest approach. We can just create an object by
    defining its properties and methods between curly braces:


    ```

