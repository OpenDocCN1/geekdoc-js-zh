  md: '# Design patterns and object creation


    One of the most popular reusable in Object-Oriented Programming is design patterns.
    They are known as reusable solutions to commonly occurring software design problems.
    Each pattern is identified by a name and describes a situation where components
    need to interact with each other to achieve a specific goal.


    Design patterns became popular in the mid-nineties after the publishing of the
    book Design Patterns: Elements of Reusable Object-Oriented Software by the so-called
    Gang of Four (GoF): Erich Gamma, Richard Helm, Ralph Johnson, and John Vissides.


    The patterns are described so that they can be reused regardless of the language
    used to implement it. However, the original patterns and the subsequent ones added
    in the following years were mainly described for classical Object-Oriented languages.
    So Often, they are described in terms of classes, interfaces, and other traditional
    constructs. Due to lack of native support for classical OOP constructs, in JavaScript
    we have to adapt them to the dynamic nature of the language, obtaining in many
    cases a simplification.


    Patterns are generally categorized in groups of similar goals. For example, the
    original design patterns proposed by the GoF had three categories: creational,
    structural, and behavioral. In this chapter, you will learn how to implement in
    JavaScript some of the most known patterns concerning the object creation activity,
    while we will explore some other design patterns throughout the book.


    # Creating a singleton


    Sometimes, we may need to have a single occurrence of an object throughout the
    application life. Consider, for example, a configuration manager or a cache manager.
    Since they provide a global point of access to an internal or external resource,
    they need to be implemented in a way that only one instance must exist, that is,
    they need to be implemented as a singleton.


    The singleton pattern is one of the simplest design patterns—it involves only
    one entity which is responsible for making sure it creates more than one instance
    and provides a global point of access to itself. For a class-based language, this
    means that a class can be instantiated only one time and any attempt to create
    a new instance of the class returns the instance already created.


    ![](bbox=[0.128, 0.243, 0.192, 0.307])'
