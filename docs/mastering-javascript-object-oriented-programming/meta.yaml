  md: "# Inheriting and Creating Mixins\n\nLet's consider an example of a Person definition\
    \ with a fullName() method returning the concatenation of name and surname:\n\n\
    ```\nfunction Person(name, surname) {\n  this.name = name;\n  this.surname = surname;\n\
    }\n```\n\n```\nPerson.prototype.getFullName = function() {\n  return this.name\
    \ + \" \" + this.surname;\n}\n```\n\nNow, we want Developer inheriting from Person,\
    \ but the getFullName method should display the Dev prefix, as in Dev John Smith.\
    \ We could create a new method, as getDevFullName(), which would not be intuitive\
    \ and redundant. Instead, we can override the getFullName() method as shown in\
    \ the following:\n\n```\nfunction Developer(name, surname, knownLanguage) {\n\
    \  Person.apply(this, arguments);\n  this.knownLanguage = knownLanguage;\n}\n\
    ```\n\n```\nDeveloper.prototype = new Person();\nDeveloper.prototype.constructor\
    \ = Developer;\nDeveloper.prototype.getFullName = function() {\n  return \"Dev\
    \ \" + Person.prototype.getFullName.call(this);\n};\n```\n\nThe highlighted code\
    \ shows how to override the getFullName() method of the Person() constructor.\
    \ We attach to the Developer prototype property a method with the same name. In\
    \ this overriding method we must pay attention to the way we call it. Since the\
    \ overriding method internally uses the parent's method, and we want that the\
    \ method refers to the current Developer instance and not to the Person instance,\
    \ we invoke the Person's getFullName() method using the call() method and passing\
    \ this keyword. We ensure that the Person function's getFullName() method will\
    \ act on the Developer instance's name and surname properties.\n\nAny JavaScript\
    \ function has the call() and apply() methods. Both run the function in the context\
    \ of the first argument, while call() accepts a list of values as the function's\
    \ parameters, apply() accepts an array of values.\n\n![](bbox=[0.136, 0.73, 0.203,\
