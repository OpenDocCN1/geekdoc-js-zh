  md: "# Diving into OOP Principles\n\nTo understand the importance of this principle\
    \ also in software development, consider the following code:\n\n```\nvar company\
    \ = {\n  name: \"ACME Inc.\",\n  employees: [],\n  sortEmployeesByName: function()\
    \ {...}\n};\n```\n\nIt creates a company object with a name, list of employees\
    \ and a method to sort the list of employees using their name property. If we\
    \ need to get a sorted list of employees of the company, we need to know that\
    \ the sortEmployeesByName() method accomplishes this task. We do not need to know\
    \ how this method works, which algorithm it implements. It is an implementation\
    \ detail that encapsulation hides from us.\n\nHiding internal details and complexity\
    \ has two main reasons:\n\n+   - The first reason is to provide a simplified and\
    \ understandable way to use an object without the need to understand the complexity\
    \ inside. In our example, we just need to know that to sort employees, we have\
    \ to call a specific method.\n- The second reason is to simplify change management.\
    \ Changes to the internal sort algorithm do not affect our way to order employees\
    \ by name. We always continue to call the same method. Maybe we will get a more\
    \ efficient execution, but the expected result will not change.\n\nWe said that\
    \ encapsulation hides internal details in order to simplify both the use of an\
    \ object and the change of its internal implementation. However, when implementation\
    \ depends on publicly accessible properties, we risk to frustrate the effort of\
    \ hiding internal behavior. For example, what happens if you assign a string to\
    \ the property employees of the object company?\n\n```\ncompany.employees = \"\
    this is a joke!\";\ncompany.sortEmployeesByName();\n```\n\nThe assignment of a\
    \ string to a property whose value is an array is perfectly legal in JavaScript,\
    \ since it is a language with dynamic typing. But most probably, we will get an\
    \ exception when calling the language method after this assignment, since the\
    \ sort algorithm expects an array."
