  md: "Asynchronous Programming and Promises\n\n```\n}\n```\n\n```\nhttpGet(\"/users/12345\"\
    , getUserBlogAndPhoto());\n```\n\nThe code now appears less confused, but not\
    \ clear enough. To understand the code we need to figure out the execution flow\
    \ by following the callback function names passed to the httpGet() function. Anyway,\
    \ even if using named functions as callbacks can help us make code a bit more\
    \ readable, it does not solve the synchronization problem.\n\n# The issues of\
    \ asynchronous code\n\nUsing callback functions can be quite intuitive in simple\
    \ cases, but it can quickly turn into a nightmare when the code complexity increases.\n\
    \nThe major flaws of the intensive use of callbacks includes:\n\n+   - Poor readability\
    \ of the code, which soon may become affected by the so-called pyramid of doom;\
    \ the expansion to the right due to the indiscriminate callback nesting and indentation.\n\
    - Difficult composition of callbacks and synchronization of the processing flow;\
    \ to try composition and synchronization it is often necessary to invent artifices\
    \ that make the code even more unreachable and sometimes inefficient.\n- Difficult\
    \ error handling and debugging, especially in the presence of anonymous callback.\n\
    \nLet's consider the last point. What happens when an error occurs within a callback?\
    \ Suppose we try to catch error in the following example:\n\n```\ntry {\n  httpGet(\"\
    /users/12345\",\n    function(user) {\n      httpGet(\"/blogs/\" + user.blogId,\n\
    \        function(blog) {\n          displayPostList(blog.posts);\n        });\n\
    \    }\n\nhttpGet(\"/photos/\" + user.albumId,\n    function(album) {\n      displayPhotoList(album.photos);\n\
    \    }\n  }\n}\n```\n\n[ 181 ]"
