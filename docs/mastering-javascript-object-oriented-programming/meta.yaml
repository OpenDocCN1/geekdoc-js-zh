  md: "# Inheriting and Creating Mixins\n\nThis allows us to have different values\
    \ of the fullName property depending on the object's prototype:\n\n```\nvar johnSmith\
    \ = new Person(\"John\", \"Smith\");\nvar marioRossi = new Developer(\"Mario\"\
    , \"Rossi\", \"JavaScript\");\n\nconsole.log(johnSmith.fullName);    //result:\
    \ \"John Smith\"\nconsole.log(marioRossi.fullName);  //result: \"Dev Mario Rossi\"\
    \n```\n\n# Protected members\n\nIn the previous chapter, we talked about object\
    \ members, visibility and accessibility. Following Crockford, we classified them\
    \ in public, private, and privileged. Most of the classical OOP languages provide\
    \ another category of members that invokes inheritance: protected members. In\
    \ general, a protected member is a private member only visible to derived objects.\
    \ It represents a privacy level that stays between the public and the private:\
    \ sort of privacy sharing among objects within a common inheritance.\n\nOnce again,\
    \ JavaScript does not build-in support for protected members, so we need to implement\
    \ it ourselves. A common pattern to emulate the support of protected members is\
    \ to ask them to the parent object constructor. Let's explain this with an example.\n\
    \nSuppose our Person() constructor has a private utility function that capitalizes\
    \ the first letter of the name and surname properties:\n\n```\nvar Person = (function()\
    \ {\n  function capitalize(string) {\n    return string.charAt(0).toUpperCase()\
    \ + string.slice(1);\n  }\n\nfunction PersonConstructor(name, surname) {\n   \
    \ this.name = capitalize(name);\n    this.surname = capitalize(surname);\n  }\n\
    \n  return PersonConstructor;\n})());\n```\n\nThe capitalize() function is implemented\
    \ as a private member and is not publicly accessible. It allows us to pass a name\
    \ and surname to the constructor without worry about upper or lower case:\n\n\
    ```\nvar p = new Person(\"john\", \"smith\");\nconsole.log(p.name);    //result:\
    \ \"John\"\n```"
