- img_proc: false
  md: "We used an IIFE to keep private the unique instance of the object created by\
    \ the constructor and the counter variable that tracks the current value of the\
    \ generated identifier. The interesting part of this code is the constructor definition.\
    \ We check if an instance has been defined, if this is not the case, we associate\
    \ the current value of this to the instance variable, otherwise we return the\
    \ current value of the instance variable. This ensures that an instance object\
    \ will be created when it's needed, and the same object will be returned each\
    \ time an attempt to create a new generator will be:\n\n```\nvar g = new IdGenerator();\n\
    \nconsole.log(g.newId()); //result: 1\nconsole.log(g.newId()); //result: 2\n```\n\
    \n```\nvar g1 = new IdGenerator();\n\nconsole.log(g1.newId()); //result: 3\n```\n\
    \nIn the constructor definition, we attached the newId method to the constructor’s\
    \ prototype, as usual. However in this case, it is not strictly necessary since\
    \ we will just have one object instance all over the application, so we could\
    \ attach the method to this.\n\nOf course, we can define our singleton using the\
    \ ES6 class syntax as shown here:\n\n```\nvar IdGenerator = (function() {\n  var\
    \ instance;\n  var counter = 0;\n\n  return class {\n    constructor() {\n   \
    \   if (!instance) {\n        instance = this;\n      }\n      return instance;\n\
    \    }\n\n  newId() {\n    return ++counter;\n  }\n});();\n```"
