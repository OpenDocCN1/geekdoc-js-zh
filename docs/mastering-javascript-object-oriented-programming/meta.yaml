  md: "Presenting Data to the User\n\nNow, we can combine all the components of the\
    \ MVVM pattern to make them work:\n\n```\nwindow.onload = function() {\n  var\
    \ model = new Model(\"John\", \"Smith\");\n  var viewModel = new ViewModel(model);\n\
    \  var view = new View(viewModel);\n};\n```\n\nWith this code, we created each\
    \ component injecting in its constructor the only component it depends on.\n\n\
    # A MV* pattern comparison\n\nThe three presentation patterns we have seen have\
    \ many similarities. All them are based on three components, and the interactions\
    \ between them are quite similar. However, each pattern has its own features that\
    \ make it more suitable for certain situations and not for others. Let's recap\
    \ the characteristics of each pattern highlighting those that stand out from each\
    \ other.\n\nThe MVC pattern proposes cooperation among the three components Model,\
    \ View, and Controller. Each component has its own role, but each one has interactions\
    \ with the other. The View uses the Model for initial binding, while the Controller\
    \ manages the requests of changing the Model and gives feedbacks to the View.\
    \ It is a first attempt to make separation of concerns, but some changes in one\
    \ component may require arrangements in the others. After all, the MVC pattern\
    \ is historically the oldest presentation pattern. Its origins date back to the\
    \ 70s, when the first graphical user interfaces were very rudimentary.\n\nThe\
    \ MVP pattern breaks the dependency between the View and the Model, entrusting\
    \ to the Presenter to act as an intermediary. The View remains the only component\
    \ responsible for managing the interaction with the user, while the Presenter\
    \ is the only component authorized to manage the Model and to respond to the View.\
    \ This architecture grants independency among the components by introducing a\
    \ layered structure.\n\n[ 151 ]"
  merge: -1
  pgno: 158
- img_proc: false
  md: 'The MVVM pattern goes further by assigning it to the intermediary component,
    the ViewModel, the role of a specialized model for the View. It interacts with
    the user and directly maps data to what it thinks to be the Model. In reality,
    this model is a wrapper around the underlying Model and its name, ViewModel, indicates
    that it represents the Model for the View. As the MVP pattern, this architecture
    is also layered, but component depends only on the component that stays below
    it. So, the View depends on the ViewModel, but not versa. The application of the
    MVVM pattern requires that the View has some capabilities to bind data and to
    implement some logic. This is the reason it is best suited to platforms which
    support bi-directional binding and have graphic elements with built-in capabilities.


    In conclusion, the MVCC pattern assigns specific roles to each component, but
    does not care about coupling. The View and the Controller can interact with each
    other and the Model. This approach can be efficient from a performance point of
    view but may incur in security issues, since the entire Model is exposed to the
    View.


    The MVP pattern makes the Model less vulnerable since it can be accessed just
    through the Presenter, but the Presenter layer itself may raise performance issues
    in complex applications.


    The same considerations about the performance issues are valid for MVVM pattern,
    where a bit of logic is moved from the intermediary layer to the View layer.


    # Summary


    In this chapter, we discussed how we can present data to the user from an object
    model perspective. We have seen how an unstructured approach leads to some problems
    in extensibility and maintainability of the code. The presentation patterns can
    help us better organize our code in order to design a flexible and clear architecture.
    The most known presentation patterns discussed in this chapter define three components
    that work together to achieve this goal.'
