- img_proc: false
  md: '# Modern Application Architectures


    Do not confuse the concept of module in the architecture proposed by Zakas and
    Osmani with module intended as a mechanism to isolate and combine application
    code. Zakas used the term module to create an analogy with the modules that make
    up the international space station: independent elements created by different
    people in different places and assembled together to build an organic unit.


    The modules are components that know how to do their jobs well and do not know
    anything about the rest of the application. A series of rules define the context
    in which they operate:


    +   - They cannot directly interact with other modules

    - They can only interact with the sandbox

    - They can only access the DOM portion under its control

    - They cannot create global objects


    A module has its own life cycle by the application core that decides when to create
    and destroy it. A module should be self-contained and independent from other modules
    in the application. It can fail and be removed without breaking the application.
    It can be changed with another module that implements the same interface without
    breaking the application.


    It is possible to create a base module from which other modules can inherit, but
    in this case, it is recommended to keep the inheritance chain very short. A module
    should be very light and have as little dependency as possible. The lower dependency
    between modules, the greater flexibility and maintainability.


    # The Sandbox


    We discussed the fact that a module is a self-contained unit and cannot directly
    communicate with other modules. The only way to communicate with the rest of the
    application is to use the Sandbox. The Sandbox is a layer that exposes a common
    API to interact with the other components of the application. It has the role
    of keeping the modules loosely coupled. In fact, by limiting the dependency of
    each module to a single component, it is easier to remove or replace a module
    in the application architecture. In addition, Sandbox can carry out safety checks
    on the interaction requests toward the rest of the application, preventing unauthorized
    activities.'
  merge: -1
  pgno: 265
- img_proc: false
  md: '# Modern Application Architectures


    It is possible to create a specific Sandbox for each module or one Sandbox shared
    among all modules. This is an architectural choice that may depend on the degree
    of complexity of the internal API of the application. What all the Sandboxes must
    provide is a standard API for common tasks that a module can perform, as:


    +   * The communication with other modules

    * The execution of Ajax requests

    * Access to the DOM

    * The association and disassociation of event handlers


    The key to keep in mind is that a Sandbox does not implement any of the preceding
    features. It is an interface to the features implemented by the application core.
    The existence of this level in the architecture proposed by Zakas and Osmani ensures
    a decoupling between the implementation of internal services and the interface
    exposed to the modules, thus promoting an evolution of the application without
    upheavals. A typical Design Pattern to implement the Sandbox is the facade pattern.


    # The facade pattern


    The purpose of the facade pattern is to provide an interface to filter interactions
    with one or more components in a system. It is quite common and the reasons to
    prevent direct access to the components can be various:


    +   * Providing a simplified interface for access to a complex subsystem

    * Providing a consistent interface with the rest of the application

    * Reducing the coupling between the components


    In the definition of a Sandbox, the main reason to use the facade pattern is essentially
    the last one, that is, reducing the coupling between the various application modules
    and between the modules involved and basic functionality.


    The actors in the facade pattern are:


    +   * One or more clients: These are the components that need to access one or
    more application subsystems

    * The facade: It is the component providing access to the subsystems

    * One or more subsystems: These are the application components the client wants
    to access to'
  merge: -1
