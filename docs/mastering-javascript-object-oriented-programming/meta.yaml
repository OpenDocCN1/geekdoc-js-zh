  md: "# Object prototypes\n\nThe flexibility of JavaScript objects is expressed primarily\
    \ through the possibility of changing their structure after their creation. Even\
    \ while using a constructor to create an object, we continue to have this possibility.\
    \ For example, if you can write the following code:\n\n```\nvar johnSmith = new\
    \ Person(\"John\", \"Smith\");\nvar marioRossi = new Person(\"Mario\", \"Rossi\"\
    );\n```\n\n```\njohnSmith.greets = function () {\n  console.log(\"Hello \" + this.name\
    \ + \" \" + this.surname + \"!\");\n};\n```\n\nThis code will create a new greets()\
    \ for the johnSmith object without affecting the structure of marioRossi.\n\n\
    Basically, while creating objects, we can start from a common structure defined\
    \ by a constructor and then customize it to our needs.\n\nBut how do we change\
    \ the structure of all objects created using a constructor? For example, suppose\
    \ that after creating seul object using the Person() constructor, we want all\
    \ the Person instances to have the greets() method. We can do it by exploiting\
    \ one of the most interesting features of Object-Oriented Programming in JavaScript—the\
    \ prototype.\n\nIn our case, we will proceed in the following way:\n\n```\nPerson.prototype.greets\
    \ = function () {\n  console.log(\"Hello \" + this.name + \" \" + this.surname\
    \ + \"!\");\n};\n```\n\nThis assignment means that all objects created using the\
    \ Person() constructor will instantly have available also the greets() method.\n\
    \nTo be precise, the new method is not directly attached to each object, but it\
    \ is accessible as if its method. This is possible, thanks to the prototyping\
    \ mechanism that represents the basis of inheritance in Object-Oriented Programming\
    \ in JavaScript, as we will discuss later in the book.\n\nIn JavaScript, the prototype\
    \ of an object is a kind of reference to another object. The objects we create\
    \ through the literal notation implicitly refer to Object as their prototype.\n\
    \nWhen we create an object using a constructor, its prototype object is the prototype\
    \ of the constructor."
