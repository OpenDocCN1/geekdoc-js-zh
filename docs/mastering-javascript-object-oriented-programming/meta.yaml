    Or, using the more convenient ES6 syntax:\n\n```\nfunction sum(x = 0, y = 0, z\
    \ = 0) {\n    return x + y + z;\n}\n```\n\nThese examples demonstrate that JavaScript\
    \ supports overloading in a more immediate way than strong-typed languages."
