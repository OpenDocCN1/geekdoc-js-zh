  md: "# Defining Contracts with Duck Typing\n\nOf course all objects have an interface,\
    \ that is, that all of the public methods and properties belonging to that object.\
    \ But here, we are focusing on the specific methods of an object that allow it\
    \ to be compliant with a contract. So, this set can be all the object's members\
    \ or just a subset.\n\nMany OOP languages support interfaces by means of specific\
    \ syntactical constructs. For example, C# and Java have a similar syntax to define\
    \ an interface. The following code defines an interface that establishes what\
    \ is needed for an object in order to be hired by our software house:\n\n```\n\
    public interface IProgrammer\n{\n    ModularCode writeCode();\n}\n```\n\nIn this\
    \ case, the interface requires that an object has a method named writeCode() returning\
    \ an instance of the ModularCode class. The interface definition is syntactically\
    \ similar to a class definition, but it has just public methods and no implementation.\
    \ Mostly, in C#, a naming convention requires that the name of an interface starts\
    \ with a capitalized i, although it is not a syntactic requirement.\n\nMost strongly\
    \ typed languages, such as C# and Java, consider an interface like a type definition\
    \ so that we can use the interface itself wherever we can use a type. For example,\
    \ we define a method for hiring developers in the following way:\n\n```\npublic\
    \ void Hire(IProgrammer dev)\n{\n    ...\n}\n```\n\nIn this case, the type system\
    \ will check whether an object passed to the Hire() method implements the required\
    \ method or, as usually it is said, whether it implements the IProgrammer interface.\n\
    \nWhen we want to define a class that complies with the contract formalized by\
    \ an interface, we have to declare it using a specific syntactical construct.\
    \ For example, in C# we can define a class implementing the IProgrammer interface\
    \ as follows:\n\n```\npublic class DevStudent: IProgrammer {\n    ...\n}\n```"
