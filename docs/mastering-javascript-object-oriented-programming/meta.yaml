  md: 'When the constructor is called, it creates an extra property id with the next
    value of the id variable. Then, it uses this id property as the key to create
    and access the private members attached to the priv object. This means that wherever
    we made reference to the seats array, we will refer to priv[this].seats.


    This technique resolves the static variable problem, but still has a couple of
    problems.


    The first problem concerns the new id property. We need this property in order
    to identify each object instance and to access its private members. However, since
    it is a publicly accessible number, it represents a potential risk. If we change
    its value, even accidentally we incur unexpected behavior.


    The second problem regards again memory consumption. Since private members exist
    in the meta-closure, their life will coincide with the closure life. So, if we
    create an object using our constructor and destroy the object, private members
    will remain alive in the anonymous function''s closure, wasting memory. No garbage
    collector will remove these members since it is not aware that they are used.


    # A definitive solution with WeakMaps


    Both problems affecting the isolated closure approach can be finally resolved
    using a new ECMAScript feature—the WeakMap. A WeakMap is a collection of key and
    value pairs where the key must be an object. In the following example, we build
    a WeakMap with items:


    ```

    var myMap = new WeakMap();

    var johnSmith = {name: "John", surname: "Smith"};

    var marioRossi = {name: "Mario", surname: "Rossi"};

    ```


    ```

    myMap.set(johnSmith, "This is John");

    myMap.set(marioRossi, "This is Mario");

    ```


    ```

    console.log(myMap.get(marioRossi));

    ```


    We used the set() method to define an association between an object and another
    item (a string in our case). We used the get() method to retrieve the item associated
    with an object. The interesting aspect of WeakMaps is the fact that it holds a
    weak reference to the key inside the map. A weak reference means that if the object
    is destroyed, the garbage collector will remove the entire entry from the WeakMap,
    thus freeing up memory.'
