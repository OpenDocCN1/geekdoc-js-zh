  md: "# Advanced Object Creation\n\nThe positive side of this approach is its simplicity.\
    \ The negative side is that we need to specify each property and method and it\
    \ is not suitable to create many similar objects. Usually, its use is limited\
    \ to the creation of a single object.\n\nThe creation of objects based on constructor\
    \ functions or classes allows us to define an object template based object template\
    \ from which we can create many objects as we want:\n\n```\nfunction Person(name,\
    \ surname) {\n  this.name = name;\n  this.surname = surname;\n}\n```\n\n```\n\
    class Person {\n  constructor(name, surname) {\n    this.name = name;\n    this.surname\
    \ = surname;\n  }\n```\n\nRegardless of the approach used to define this template,\
    \ we can create objects using the new operator:\n\n```\nvar johnSmith = new Person(\"\
    John\", \"Smith\");\n```\n\nAs we well discussed in Chapter 4, Inheriting and\
    \ Creating Mixins, using constructor functions and classes allows us to optimize\
    \ memory usage by sharing the method's code among their instances, thanks to prototype\
    \ and inheritance. However, many have criticized the new operator because it appears\
    \ as misleading since it is the same operator usually used to create an object\
    \ from a class in classical OOP languages. They say that the new operator is neither\
    \ coherent with a classless approach of JavaScript OOP nor with the functional\
    \ nature of the language.\n\nThe alternative approach is based on the Object.create()\
    \ method. Like constructor functions and classes, it allows us to create objects\
    \ from a prototype and is easier to understand and more coherent with JavaScript's\
    \ nature:\n\n```\nvar johnSmith = Object.create();\njohnSmith.name = \"John\"\
    ;\njohnSmith.surname = \"Smith\";\n```\n\nHowever, not all approaches to create\
    \ objects are suitable in certain contexts. Sometimes the object creation process\
    \ may be complex or require a high level of flexibility. In these situations,\
    \ we can use some of the most known design patterns to achieve a solution to your\
    \ specific needs."
