  md: '# Preface


    Chapter 7, Presenting Data to the User, explores the most common View Presentation
    Patterns such as Model View Controller Pattern and Model View Pattern.


    Chapter 8, Data Binding, explains how to implement Data Binding and describes
    Patterns such as the Observer Pattern and the Publisher/Subscriber Pattern.


    Chapter 9, Asynchronous Programming and Promises, discusses the issues with asynchronous
    programming in JavaScript and shows how to overcome them with Promises and other
    innovative techniques.


    Chapter 10, Organizing Code, analyzes the various approaches to organize JavaScript
    code in modules: from the classic IIFE to the modern ECMAScript6 modules.


    Chapter 11, SOLID Principles, explores how to apply the five SOLID Design Principles
    in order to create scalable and maintainable applications.


    Chapter 12, Modern Application Architectures, describes the most common architectures
    for JavaScript applications and introduces the Facade and Mediator Patterns.


    # What you need for this book


    Most of the code provided in this book is not bound to a specific JavaScript environment,
    so it could run in any JavaScript environment. However some examples are specific
    for the Web browser environment, so the console of Web Inspector such as Chrome
    Developer tools or Firebug is needed.


