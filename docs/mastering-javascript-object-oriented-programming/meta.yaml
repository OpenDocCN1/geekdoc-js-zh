  md: "# Asynchronous Programming and Promises\n\nAs we can see, we pass a function\
    \ to the then() method whose argument user will be bound to the data received\
    \ from the server asynchronously. When the data will be available, the Promise\
    \ is resolved and the function will be called.\n\nIn order to display the list\
    \ of blog posts of the user, we will write the following code:\n\n```\nhttpGet(\"\
    /users/12345\")\n.then(function(user) {\n  httpGet(\"/blogs/\" + user.blogId)\n\
    \  .then(function(blog) {\n    displayPostList(blog.posts);\n  }\n})\n);\n```\n\
    \nAfter, the function handling the resolved Promise creates another Promise to\
    \ get the blog's posts. So, we get nested Promises that will be resolved one after\
    \ the other in sequence.\n\nAfter all, this code is quite similar to the callback-based\
    \ code seen in previous examples. However the Promise-based approach gives us\
    \ more flexibility and is more powerful, as we will see shortly.\n\nAs a first,\
    \ let's rewrite the previous code in a more readable form:\n\n```\nfunction getUser()\
    \ {\n  return httpGet(\"/users/12345\");\n}\nnfunction getBlog(user) {\n  return\
    \ httpGet(\"/blogs/\" + user.blogId);\n}\n\nfunction displayBlog(blog) {\n  displayPostList(blog.posts);\n\
    }\n\ngetUser() {\n  .then(function(user) {\n    getBlog(user)\n    .then(function(blog)\
    \ {\n      displayPostList(blog.posts);\n    })\n  })\n}\n```\n\nWe used named\
    \ functions to make the code more readable. However, we can do better."
