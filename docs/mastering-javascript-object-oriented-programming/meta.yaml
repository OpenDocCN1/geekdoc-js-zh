- img_proc: false
  md: "It uses the httpGet function to get a user's data. Once the data are received,\
    \ the callback function makes two new requests to the server to get the user's\
    \ blog and the user's photos. Again, when the server requests the requested data,\
    \ they are displayed on the screen using the displayPostList() and displayPhotoList()\
    \ functions.\n\nHere, we have a single function call with some nested callbacks\
    \ that make the code very readable. The callback functions need to be nested since\
    \ each call depends on the outcome of the previous level. The requests of the\
    \ user's blog and photos cannot be made before getting the user's data. However,\
    \ once we receive the user's data, we can request the user's blog and photos at\
    \ the same time.\n\nDisplaying user's posts and photos is asynchronous and the\
    \ photos will not necessarily be displayed after the posts. If we want to constrain\
    \ the display order or make some processing based on results before displaying\
    \ them (for example, show only photos related to the posts), we should find a\
    \ way to synchronize the callback functions, a task whose complexity we can easily\
    \ ease.\n\nUsing callbacks in this way creates some issues both code readability\
    \ and asynchronous task synchronization. This is what the callback hell is commonly\
    \ called.\n\n# Organizing callbacks\n\nA first attempt to rewrite the code is\
    \ to use named functions instead of anonymous functions. Let's rewrite the previous\
    \ code in the following example:\n\n```\nfunction getUserBlogAndPhoto(user) {\n\
    \  getBlog(user.blogId);\n  getPhotos(user.albumId);\n}\n```\n\n```\nfunction\
    \ getBlog(blogId) {\n  httpGet(\"/blogs/\" + blogId, displayBlog);\n}\n```\n\n\
    ```\nfunction displayBlog(blog) {\n  displayPostList(blog.posts);\n}\n```\n\n\
    ```\nfunction getPhotos(albumId) {\n  httpGet(\"/photos/\" + user.albumId, displayAlbum);\n\
    }\n```\n\n```\nfunction displayAlbum(album) {\n  displayPhotoList(album.photos);\n\
    }\n```"
