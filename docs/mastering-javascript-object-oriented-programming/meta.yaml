  md: "# Inheriting and Creating Mixins\n\nIf we want to make this function available\
    \ to all derived objects, that is, to make\nprotected, we can implement it as\
    \ follows:\n\n```\nvar Person = (function() {\n  var protectedMembers;\n\nfunction\
    \ capitalize(string) {\n    return string.charAt(0).toUpperCase() + string.slice(1);\n\
    }\n\nfunction PersonConstructor(name, surname, protected) {\n  protectedMembers\
    \ = protected || {};\n  protectedMembers.capitalize = capitalize;\n\n  this.name\
    \ = capitalize(name);\n  this.surname = capitalize(surname);\n}\n\nvar PersonConstructor\
    \ = \n}());\n```\n\nThe highlighted code shows that we have defined a private\
    \ variable named\nprotectedMembers. We also added a new parameter to the internal\
    \ constructor, named\nprotected. This parameter is the means that the derived\
    \ constructor asks to the\nparent constructor for the protected members. Inside\
    \ the PersonConstructor() function,\nwe ensure that the protected parameter is\
    \ not empty and add to it the capitalize()\nmethod.\n\nNow, we define the Developer\
    \ constructor so that it asks its parent constructor for\nprotected members:\n\
    \n```\nfunction Developer(name, surname, knownLanguage) {\n  var parentProtected\
    \ = {};\n  Person.call(this, name, surname, parentProtected);\n\n  this.knownLanguage\
    \ = parentProtected.capitalize(knownLanguage);\n}\n```\n\nSince the private variable\
    \ parentProtected is an object, it is by reference to the\nPerson() function.\
    \ So, the changes made by the parent constructor to the\nparentProtected variable\
    \ are available inside the Developer() constructor. This allow\nus to use the\
    \ capitalize() function attached to parentProtected object."
