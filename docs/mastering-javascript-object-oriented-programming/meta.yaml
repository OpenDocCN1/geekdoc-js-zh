    \ { return _name; },n    set: function(value) {\n      _name = value;\n      txtName.value\
    \ = _name;\n    }\n  });\n\n  Object.defineProperty(this, \"surname\", {\n   \
    \ get: function() { return _surname; },\n  });\n```"
