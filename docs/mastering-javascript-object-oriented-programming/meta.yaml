    # # Summary


    In this chapter, we introduced the basic concepts about data binding and the terminology
    used to indicate the various actors involved in the binding relationship. Then,
    we started exploring different ways to implement data binding in JavaScript. The
    simplest way was the manual implementation, which is the manual assignment of
    values from an object to another after an event generated by the user. We saw
    that a better implementation should monitor changes on the data source object
    and update in real time the data target object. We also tried to redefine the
    properties of an object in order to catch changes and synchronize the data target
    property, but found that this technique may have some issues.


    Our exploration continued with the presentation of the observer pattern and the
    publisher/subscriber pattern. We used the latter to implement a solution based
    on the observables. Finally, we introduced ECMAScript 6 proxies and described
    an approach based on them.


    In the next chapter, we will discuss how to write asynchronous code and how to
    use Promises.'
