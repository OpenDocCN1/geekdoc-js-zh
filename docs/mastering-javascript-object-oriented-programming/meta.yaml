  md: '# Advanced Object Creation


    The trainerPool object will be an object pool specializing in managing Trainer
    instances. The pool will initially be empty, and the first requests to create
    new objects will return new Trainer objects leaving the pool empty:


    ```

    var trainer1 = trainerPool.get();

    var trainer2 = trainerPool.get();

    ```


    The pool will have entries when a client releases the Trainer object using the
    recycle() method:


    ```

    trainerPool.recycle(trainer1);

    ```


    Now, a client requests a new Trainer object, the pool will not create a new one,
    but will return the one in the pool:


    ```

    var trainer3 = trainerPool.get();


    console.log(trainer1 == trainer2); //false

    console.log(trainer1 == trainer3); //true

    ```


    This avoids a possible expense cost, a frequent involvement of the garbage collector,
    and a reduction in memory fragmentation. Or, the reuse of an object in the pool
    is possible only if it has no state, its private variables and public properties
    do not change. If it is not the case, the objects to be stored in the pool require
    an initialization method that allows to reset its state to the initial value.


    In our simple example, we have not placed any constraint on the management of
    the pool. It is implemented as an array that can grow without limits. In real-life
    situations, the pool is configured so that it cannot grow a maximum size, avoiding
    running out of memory.


    Moreover, in our example we defined an object pool that can contain only one type
    of objects, Trainer. Once created, an object pool by passing a specific object
    constructor or class, we cannot store objects of another type. In practical implementation,
    we should allow one object pool to manage different type of objects or the creation
    of multiple object pools managing different type of objects.


    During the design of a real-life object pool, we must take into account various
    policies that allow to manage the memory as best as possible. For instance, we
    must remember that unused objects remain in memory forever, so we might think
    of a way to destroy them and free memory after a certain amount of lifetime.'
