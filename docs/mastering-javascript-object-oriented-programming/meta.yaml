  md: "# Advanced Object Creation\n\nIn JavaScript, we can create objects through\
    \ the literal notation, so any such object is already a singleton:\n\n```\nvar\
    \ johnSingleton = {\n  name: \"John\",\n  surname: \"Singleton\"\n};\n```\n\n\
    So, why do we need to implement this design pattern?\n\nIn the preceding example,\
    \ we created an object, if created in the global context of an application, is\
    \ accessible from everywhere in the application. However, we are not sure that\
    \ this object will actually be used during the application life. If a particular\
    \ execution flow of the application does not use our object, we unnecessarily\
    \ wasted the system's resources. Moreover, if we need some data or any preprocessing\
    \ must be performed before the creation of the object's instance, we need to delay\
    \ the object creation. Finally, if our object has to manage a private state, using\
    \ a literal object is not the best way.\n\n# The mysterious behavior of constructors\n\
    \nSo, how can we implement singletons in JavaScript? Before we go into that, let's\
    \ explore an interesting behavior of constructor functions.\n\nUsually, when we\
    \ define a constructor, we do not specify a return value. The new operator causes\
    \ the return of a new object instance from the current value of this. If we create\
    \ a constructor returning a primitive value, such as a string or a number, it\
    \ will be ignored:\n\n```\nfunction Person(name, surname) {\n  this.name = name;\n\
    \  this.surname = surname;\n\n  return \"This is a person\";n}\n\nvar johnSmith\
    \ = new Person(\"John\", \"Smith\");\n\nconsole.log(johnSmith.name); //John\n\
    console.log(johnSmith.surname); //Smith\n```\n\nIn this example, the constructor\
    \ returns a string, but we have no effect on the creation of a new object nor\
    \ get any trace of the string returned by the constructor."
