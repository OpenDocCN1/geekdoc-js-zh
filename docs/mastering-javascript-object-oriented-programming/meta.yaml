  md: "# Dependency example described how to define an Umod without dependencies.\n\
    \nThe previous (root, factory) If our module depends on another one, we can change\
    \ the code as follows:\n\n```\nfunction (root, factory) {\n  if (typeof define\
    \ === 'function' && define.amd) {\n    // AMD. Register as an anonymous module.\n\
    \    define(['module'], factory);\n  } else if (typeof exports === 'object') {\n\
    \    // Node does not work with strict CommonJS, but\n    // only CommonJS-like\
    \ environments support like Node.\n    module.exports = require('module');\n \
    \ } else {\n    // Browser globals (root is window)\n    root.exports = factory(root.module);\n\
    \  }\n}\n(this, function (module) {\n  // Module code\n  return {...};\n});\n\
    ```\n\nThe only difference compared to the previous code is the module parameter\
    \ and the string with the same name highlighted in bold.\n\nThe approach proposed\
    \ is actually ugly and not comfortable to use. Apart from the fact of being very\
    \ verbose, the presence of dependencies forces us to adjust the code with the\
    \ risk of introducing errors.\n\n# ECMAScript 6 modules\n\nBy what we have seen\
    \ so far, organizing our JavaScript code in modules is not so simple. We must\
    \ address various module definitions and different loading modes both not fully\
    \ compatible, ECMAScript specification proposes a standard solution to this problem\
    \ offering native support for modules in a compact and effective way, quite a\
    \ bit similar to the CommonJS module."
