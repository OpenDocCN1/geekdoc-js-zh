  md: "# Working with Encapsulation and Information Hiding\n\nSo, in order to correctly\
    \ protect our private members, we need again to use an IIFE in order to exploit\
    \ its closure and WeakMaps to store private members. The following is a definition\
    \ of the TheatreSeats class with private members protection:\n\n```\nvar TheatreSeats\
    \ = (function() {\n  \"use strict\";\n  var priv = new WeakMap();\n  var _ = function(instance)\
    \ {return priv.get(instance)};\n\n  class TheatreSeatsClass {\n    constructor()\
    \ {\n      var privateMembers = {seats: []};\n\n      priv.set(this, privateMembers);\n\
    \      this.maxSize = 10;\n    }\n\n    placePerson(person) {\n      _(this).seats.push(person);\n\
    \    }\n\n    countOccupiedSeats() {\n      return _(this).seats.length;\n   \
    \ }\n\n    isSoldOut() {\n      return _(this).seats.length >= this.maxSize;\n\
    \    }\n\n    countFreeSeats() {\n      return this.maxSize - _(this).seats.length;\n\
    \    }\n\n  return TheatreSeatsClass;\n}());\n```\n\nThis code is more compact\
    \ than the one created without using the class syntax. However, the data protection\
    \ approach remains the same.\n\nWe can get rid of the IIFE using the ES6 module\
    \ syntax, but this will be the topic of a later chapter."
