  md: "# Organizing Code\n\nIn a runtime environment, being able to access a filesystem,\
    \ such as in server-side environments like Node.js, loading modules from files\
    \ is not a problem. It can be a synchronous or asynchronous operation usually\
    \ with a minor impact on the overall performance.\n\nConversely, loading a module\
    \ in a web page may cause issues. Usually, we place JavaScript code inside a `<script&gt;`\
    \ element, as in the following example:\n\n```\n<script type=\"text/javascript\"\
    >\n(function(module) {\n  module.calculateTriangleArea = function area (basis,\
    \ height) {\n    return basis*height/2;\n  }\n\n  return module;\n}) (myApp);\n\
    </script>\n```\n\nOr, even better, its code can be placed in an external file,\
    \ as shown below:\n\n```\n<script type=\"text/javascript\" src=\"triangleModule.js\"\
    ></script>\n```\n\nIn both cases, the code will make the module available to the\
    \ application. However, while in the first case the code is loaded within the\
    \ entire page, in the second case the code needs to be loaded after a new request\
    \ to the server. In the latter case, the browser loads the file containing the\
    \ code and executes it, blocking in the meanwhile rendering of the page. Since\
    \ loading scripts may be slower on the Internet and a browser opens a limited\
    \ number of concurrent HTTP connections, this approach may heavily affect the\
    \ experience.\n\nTo avoid this issue, we need to load scripts in the background\
    \ with no impact on page rendering-HTML provides us with a couple of attributes\
    \ of the `<script&gt;` tag: defer and async.\n\nWe can use defer as shown here:\n\
    \n```\n<script type=\"text/javascript\" src=\"triangleModule.js\" defer</script>\n\
    ```\n\nThis ensures that the script is loaded during the page parsing and is executed\
    \ after the parsing has completed. The execution order of the scripts reflects\
    \ its appearance order in the document. These attributes may be useful when we\
    \ want to be sure that our code runs when the document has been parsed, but anyway\
    \ its loading slows down the page rendering."
