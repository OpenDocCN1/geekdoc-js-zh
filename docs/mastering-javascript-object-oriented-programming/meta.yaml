  md: "# Inheriting and Creating Mixins\n\nThis way to implement multiple inheritance\
    \ is pretty simple, but may have some issues. What happens if two parent constructors\
    \ have a member with the same name? We actually had such issues in our example,\
    \ but we do not worried about it. In fact, Developer() and Student() provide name\
    \ and surname properties. When we invoked the parent constructors in DevStudent()\
    \ function, the Student() constructor redefined name and surname from Developer().\
    \ Since they have the same name, we have no side effect. But what happens if there\
    \ is a name collision on members that have different meaning or behavior? If no\
    \ action is taken, the last parent constructor will override any previous definition.\
    \ So the order of parent constructors matters when implementing multiple inheritance.\n\
    \nWhile implementing multiple inheritance is so simple with constructor functions,\
    \ it is not the same when we use the class construct of ECMAScript 6. The extends\
    \ keyword does not allow to specify more than one class, so we cannot have a definition\
    \ like this:\n\n```\nclass DevStudent extends Developer, Student {\n  ...\n}\n\
    ```\n\nHowever, since the right-hand side of the extends clause can be any expression,\
    \ we can make classes inherit from more than one class by exploiting the mixin\
    \ pattern.\n\n# Creating and using mixins\n\nThe term mixin is usually used to\
    \ specify a collection of functions available to be shared among objects or classes.\
    \ It can be however considered similar to abstract classes in classical OOP languages.\
    \ Usually, the mixin functions are not directly used, but they are borrowed to\
    \ other objects or classes in order to extend them without creating a strict relationship\
    \ as it could be with inheritance. Let’s introduce mixins in JavaScript with a\
    \ simple example.\n\n# Mixing prototypes\n\nConsider our Person() constructor\
    \ function in its minimal implementation:\n\n```\nfunction Person(name, surname)\
    \ {\n  this.name = name;\n  this.surname = surname;\n}\n```"
