  md: '# # Inheriting and Creating Mixins


    This chapter will deepen the prototypal inheritance of JavaScript, highlighting
    the difference with classical inheritance. It will also cover most of common patterns
    to implement overriding, member protection, and extension prevention. Multiple
    inheritance and mixins are also discussed always taking into account the new ECMAScript
    6 syntax and features.


    The following topics are covered in the chapter:


    +   * Prototypal inheritance

    * Overriding methods and properties

    * Implementing protected members

    * Controlling object extension

    * Multiple inheritance and mixins


    # ## Why inheritance?


    Inheritance is one of the fundamentals principle in Object-Oriented Programming.
    It is usually defined as a is-a relationship between objects (or classes, if the
    language supports them).


    Consider, for example, a generic person and a student. We can say that the student
    is a person that a student inherits all features of a generic person, but he has
    a specialized profile—he studies. This is true for other specialized profiles
    such as a teacher, a lawyer, a singer, and so on.'
  merge: -1
