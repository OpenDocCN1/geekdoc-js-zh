  md: "# Organizing Code\n\nAnything returned by the module is exposed to the outside\
    \ world. Let's rewrite our module following the AMD standard:\n\n```\ndefine(\"\
    geoModule\", [], function () {\n  var pi = 3.14;\n\n  function circumference(radius)\
    \ {\n    return 2*pi*radius;\n  }\n\n  function circleArea(radius) {\n    return\
    \ pi*radius*radius;\n  }\n\n  return {\n    calculateCircumference: circumference,\n\
    \    calculateCircleArea: circleArea\n  };\n});\n```\n\nWe assigned the geoModule\
    \ name to the module using the define() function. Then, we passed an empty array\
    \ to declare that our module has no dependencies and finally passed the function\
    \ that contains the module's code.\n\nNow, we can load our module as shown in\
    \ the following example:\n\n```\nrequire([\"geoModule\"], function(geoModule)\
    \ {\n  console.log(geoModule.calculateCircumference(5));\n});\n```\n\nWe used\
    \ the require() function by passing an array with the name of the module we want\
    \ to load and a callback function that uses our module. The module's content is\
    \ mapped to the callback's parameter it is loaded.\n\nWhen defining a module,\
    \ we can omit the first parameter that defines an identifier for the module. In\
    \ this case, we can identify it by specifying the filename it contains. Moreover,\
    \ we can also omit the dependencies array when it is empty.\n\nHaving to do with\
    \ asynchronous calls, the require() function may potentially suffer the same issues\
    \ we analyzed in Chapter 9, Asynchronous Programming and Promises, where we talked\
    \ about asynchronous programming. Just to recall some of the issues discussed\
    \ at this time, we cannot catch errors and lose a bit of readability. A better\
    \ approach could use Promises; but unfortunately, the AMD specification does not\
    \ support them."
  merge: -1
  pgno: 223
