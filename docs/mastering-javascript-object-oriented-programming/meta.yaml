- img_proc: false
  md: "# Events, Ajax, and other asynchronous stuff\n\nWriting JavaScript applications\
    \ we have many chances to write asynchronous code. In addition to timers, we usually\
    \ write asynchronous code when we need to manage events, such as DOM events in\
    \ a browser or when we need to interact with a server through Ajax. But, we deal\
    \ with asynchronous programming when handling server-event, even when managing\
    \ communication with web workers, accessing a file system, and so on. Since JavaScript\
    \ is increasingly spreading outside the Web, the role of asynchronous programming\
    \ is gaining growing importance. So, we need to understand how it works and what\
    \ kind of problems the asynchronous code may raise.\n\n# Writing asynchronous\
    \ code\n\nMost of us have surely written asynchronous code without paying much\
    \ attention. Actually, in simple situations we do not need to make great assumptions\
    \ and our code follows the simplicity of the context. But when the complexity\
    \ grows, writing, managing, and understanding the asynchronous code may become\
    \ a messy business. Let's take a look at how we usually write asynchronous code\
    \ and which issues may come out.\n\n# Using events properties\n\nThe most common\
    \ situation where we write asynchronous code is when we need to manage events.\
    \ Consider the interaction of the user with the GUI—a click on a button activates\
    \ the execution of the handler that we attached to it.\n\nOne of the ways to attach\
    \ a handler to an event is using the event property. For example, an HTML button\
    \ has an onclick property, we can attach our handler to:\n\n```\nvar btn = document.getElementById(\"\
    myBtn\");\nbtn.onclick = function() {\n  console.log(\"The button was clicked!\"\
    );\n};\n```\n\nWhen the click event occurs, the function attached to the onclick\
    \ property is executed and the message appears on the console."
