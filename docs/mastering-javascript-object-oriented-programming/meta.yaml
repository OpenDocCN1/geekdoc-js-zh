  md: "# Privacy levels\n\nTherefore, exploiting the closure of a constructor we can\
    \ implement the information hiding principle for JavaScript objects. As we see,\
    \ however, the new definition of the TheatreSeats() constructor is slightly different\
    \ from the original one. While in the original definition we attached the placePerson()\
    \ method to the prototype of the constructor, now we follow this approach. In\
    \ fact, the prototype's methods cannot access the constructor's closure, so the\
    \ following code cannot work:\n\n```\nfunction TheatreSeats() {\n  seats = [];\n\
    }\n\nTheatreSeats.prototype.placePerson = function (person) {\n  seats.push(person);\n\
    };\n\nvar theatreSeats = new TheatreSeats();\n\ntheatreSeats.placePerson({name:\
    \ \"John\", surname: \"Smith\"}); //exception\n```\n\nThe last statement in the\
    \ previous example raises an exception because the placePerson() method tries\
    \ to access a seats variable that is not defined in its execution context. So,\
    \ in order to use the constructor's closure to hide the internal details, we need\
    \ to implement a method inside the constructor itself.\n\nThis led us to apply\
    \ a sort of classification of an object's members in order to determine how to\
    \ implement the information hiding principle:\n\n+   - Members that cannot be\
    \ publicly accessed (private members)\n- Members that do not use private members\
    \ and can be publicly accessed (public members)\n- Members that use private members\
    \ and that can be publicly accessed (privileged members)\n\n> The privacy levels\
    \ terminology has been defined by Douglas Cockford in his article at http://www.crockford.com/javascript/private.htm\
    \ 1.\n\n![](bbox=[0.135, 0.742, 0.195, 0.792])"
