    ```\n\nAfter the removal of the address property, any attempt to access it will\
    \ return the value undefined.\n\n# Methods\n\nWhile object properties represent\
    \ data, methods represent actions that an object can perform. From a syntical\
    \ point of view, the definition of an object’s method is quite similar to the\
