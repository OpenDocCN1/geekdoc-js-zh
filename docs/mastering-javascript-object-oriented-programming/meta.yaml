    As we can see, an object with its specific properties is assigned to the address
    property.


    To access the values stored in an object property, we have two approaches. The
    first approach is the so-called dot-notation, by which we indicate an object and
    the property we''re interested in, separated by a point:


    ```

    var name = person.name;

    ```


    This is usually the most used approach because it is more compact and quite familiar
    to developers who have worked with other programming languages.


    Using the second approach, we specify the properties of an object by indicating
    its name as a string in square brackets:


    ```

    var name = person["name"];

    ```


    This approach is mandatory when the property name does not follow the rules for
    JavaScript''s variable names. For example, we cannot use the dot-notation to access
    a property named first-name.


    If we try to access a non-existing property of an object, an error is not generated
    but returns the undefined value. In the following example, therefore, the age
    variable will get the undefined value:


    ```

    var age = person.age;

    ```


    If we try to assign a value to a not yet defined property, we actually create
    this property initializing it with the assigned value:


    ```

    person.age = 28;

    ```


    This example shows the dynamic nature of JavaScript objects. The object''s structure
    is very flexible and can be changed dynamically during the execution of a script.
    This feature gives us an alternative way for the creation of an object based on
    a kind of incremental definition. In practice, instead of completely defining
    a literal representation of our object, we can start from a basic representation
    and gradually enrich it with the properties we want. Following this approach,
    we can define our object person as:


    ```

    var person = {};

    person.name = "John";

    person.surname = "Smith";

    person.address = {

    street: "123 Duncannon Street",

    ```'
