  md: "# Organizing Code\n\nA module must explicitly export an object with the functionalities\
    \ to make it publicly available. This can be made with the exports property of\
    \ the module object. Let's see how we can write a CommonJS module:\n\n```\nvar\
    \ pi = 3.14;\n\nfunction circumference(radius) {\n  return 2*pi*radius;\n}\n\n\
    function circleArea(radius) {\n  return pi*radius*radius;\n}\n\nmodule.exports\
    \ = {\n  calculateCircumference: circumference,\n  calculateCircleArea: circleArea\n\
    };\n```\n\nIf we put the preceding code in a file named geoModule.js, we can load\
    \ the module as follows:\n\n```\nvar geoModule = require(\"./geoModule\");\n\n\
    console.log(geoModule.calculateCircumference(5));\n```\n\nAs we can see, the CommonJS\
    \ approach to manage modules is extremely simple and guarantees the order of execution\
    \ of modules. However, it is not suitable for browsers since module loading is\
    \ synchronous and it blocks the page rendering.\n\n# Asynchronous Module Definition\n\
    \nAn alternative approach to CommonJS specifically designed for browsers is the\
    \ Asynchronous Module Definition paradigm or AMD. As the name says, its main feature\
    \ is asynchronous loading of modules. In order to create an AMD module, we need\
    \ to use the define() function that takes three parameters:\n\n+   - A string\
    \ that represents the name of the module\n- An array of dependencies expressed\
    \ as module names or file locations\n- A function containing the module's code"
  merge: -1
