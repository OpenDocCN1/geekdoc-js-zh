  md: "# Advanced Object Creation\n\nIf our constructor returns an object, it will\
    \ be returned and the object bound to the this keyword will be lost:\n\n```\n\
    function Person(name, surname) {\n  this.name = name;\n  this.surname = surname;\n\
    \n  return { firstName: name, secondName: surname };\n}\n\nvar johnSmith = new\
    \ Person(\"John\", \"Smith\");\n\nconsole.log(johnSmith.name);      //undefined\n\
    console.log(johnSmith.surname); //undefined\nconsole.log(johnSmith.firstName);\
    \ //John\nconsole.log(johnSmith.secondName); //Smith\n```\n\nHere, our object-new\
    \ behavior will have the properties defined in the returned object, not the properties\
    \ attached to this.\n\n# Singletons\n\nWith this constructor's behavior in mind,\
    \ let's take a look at how we can implement a singleton in JavaScript. Suppose,\
    \ for example, we need an identifier generator returning unique values, we can\
    \ define it as follows:\n\n```\nvar IdGenerator = (function () {\n  var instance;\n\
    \  var counter = 0;\n\nvar Constructor = function () {\n    if (!instance) {\n\
    \      instance = this;\n    }\n\n    return instance;\n};\n\nConstructor.prototype.newId\
    \ = function () {\n  return ++counter;\n};\n\n  return Constructor;\n})();\n```"
  merge: -1
