    # When to use the builder pattern?


    We have seen that the builder pattern allows a client to ignore the steps behind
    the creation of complex objects. It assigns to another object (the director) the
    responsibility for following each step of the creation process.


    Typical scenarios in which we can apply the builder pattern include the conversion
    of documents in different formats. For each format, we implement a specific builder
    that exposes methods to convert paragraphs, format information, page layouts,
    and so on. The director will use these methods to convert a document passed as
    a parameter by following its structure.


    In classical Object-Oriented Programming contexts, such as in Java, the builder
    pattern is often used to refactor a class with many parameters, some mandatory
    and other optionals, such as the following:


    ```

    Pizza(int size) {...}

    Pizza(int size, boolean cheese) {...}

    Pizza(int size, boolean cheese, boolean tomato) {...}

    Pizza(int size, boolean cheese, boolean tomato, boolean bacon) {...}

    ```


    These kinds are difficult to read and error prone due to the presence of many
    parameters of the same type:


    ```

    Pizza pizza = new Pizza(10, true, false, true);

    ```'
