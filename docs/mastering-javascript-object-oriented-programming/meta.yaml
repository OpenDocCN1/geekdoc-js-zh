  md: "```\n} catch(e) {\n    console.log(\"An error occurred: \" + e.message);\n\
    }\n```\n\nAlthough it may seem like a possible solution to the untrained eye,\
    \ the try/catch statements are completely useless in an asynchronous context.\
    \ Since httpGet() calls involve asynchronous code, the try block is executed before\
    \ any actual request is submitted to the server. So, the possible exception in\
    \ the callbacks is out of the scope of the try statement.\n\nIn conclusion, unlike\
    \ the synchronous calls to functions whose execution returns a value or exception,\
    \ in the case of asynchronous calls, we do not have one of the two things. As\
    \ a result there is less possibility of function composition and any exception\
    \ handling. In short, with an asynchronous approach, we lose some of the typical\
    \ features of the functional programming model that inspires JavaScript.\n\n#\
    \ Introducing Promises\n\nFrom the previous considerations, we can conclude that,\
    \ despite common usage, callback functions are not suitable to manage asynchronous\
    \ programming. They allow us to execute asynchronous code, but we do not have\
    \ a strong control on synchronization, error handling, and code readability.\n\
    \nIn last years, an alternative pattern for managing asynchronous code is spreading\
    \ in the JavaScript community—the Promise pattern.\n\n# What are Promises?\n\n\
    Promises are objects that represent a value that we can handle at some point in\
    \ the future. They can be used to capture the outcome of an asynchronous activity,\
    \ such as an event, and manage it in a consistent way. In fact, unlike event handling,\
    \ using callbacks, Promises guarantees us to receive a result, even if the event\
    \ occurs before we register to handle it (in contrast to event that can incur\
    \ in race conditions) and allow us to catch and handle exceptions. Moreover, they\
    \ allow us to write code with a synchronous style gaining readability."
  merge: -1
  pgno: 189
