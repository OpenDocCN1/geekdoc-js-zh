  md: 'The builder pattern focuses on building complex objects. Unlike the factories,
    the builders of the builder pattern do not always return the same type of object.
    They may return (and it happens often) different type of objects. Consider a data
    converter—it returns different types of objects based on the requested output
    format.


    Moreover, a factory returns an object as a result of one simple call to a constructor
    function, while in the builder pattern the resulting object is constructed by
    the director in multiple steps.


    These aspects have to be taken into account when deciding which pattern to apply
    to a design problem.


    # Recycling objects with an object pool


    Sometimes, the creation of objects may be so complex that it can affect the application
    performance. Consider, for example, when the creation of an object requires a
    call across the network to a remote API or when the object''s setup need expensive
    computational resources. Also, the frequent creation and destruction of objects
    may affect the overall performance, since the garbage collector is frequently
    invoked.


    In these situations, it would be better to extend the object''s life as much as
    possible. In other words, we may maintain an object alive instead of discarding
    it when a client no longer needs it. Here, we can use the **object pool pattern**.


    The object pool pattern involves the following actors:


    +   * **A client:** This is the object that needs another object

    * **An object pool:** This is the component responsible for managing a set of
    reusable objects

    * **A reusable object:** This is the object required by the client'
  merge: -1
  pgno: 132
- img_proc: false
  md: "# Advanced Object Creation\n\nIn simple terms, the object pool pattern allows\
    \ to retain a set of unused objects of the type. When a client needs a new object,\
    \ rather than creating a new one by itself, instead recycles one of the unused\
    \ objects from the pool. When the client no longer need the object, rather than\
    \ releasing it to the main memory, it is returned to the pool. Note that the object\
    \ will not be garbage collected, since it is never deleted from the code. The\
    \ following picture shows how the actors of this pattern interact with each other:\n\
    \n![](bbox=[0.227, 0.273, 0.772, 0.49])\n\nLet's take a look how we can implement\
    \ an object pool in our software house model. Suppose that objects such as trainers\
    \ are very expensive to create, it is not convenient to create and destroy this\
    \ type of objects, however, we can manage their lifecycle inside an object pool.\n\
    \nThe following code shows a simple example of object pool implementation:\n\n\
    ```\nvar ObjectPool = (function() {\n  var instance;\n  var objConstructor;\n\
    \  var objPool = [];\n\n  return class {\n    constructor(objConstr) {\n     \
    \ if (!instance) {\n        objConstructor = objConstr;\n        instance = this;\n\
    \      }\n      return instance;\n    }\n  });\n```"
  merge: -1
  pgno: 133
- img_proc: false
  md: "```\nget() {\n  var obj;\n\n  if (objPool.length == 0) {\n    obj = new objConstructor();\n\
    \  } else {\n    obj = objPool.pop();\n  }\n\n  return obj;\n}\n\ncycle(obj) {\n\
    \  objPool.push(obj);\n}\n}();\n```\n\nWe can see that the object is a singleton.\
    \ It is necessary since we need a unique point to access shared resources.\n\n\
    In addition to the instance variable that allows us to manage the singleton, we\
    \ have two other variables: the objConstructor variable, which will store the\
    \ constructor function of the objects being created; and the objPool, an array\
    \ that will actually contain the reusable objects.\n\nThe pool's constructor takes\
    \ an object constructor as an argument. This is the constructor to be used in\
    \ create new instances of objects when the pool is empty.\n\nThe object pool has\
    \ two methods: get(), the method that returns an available object from the pool,\
    \ and recycle(), which pushes an unused object in the pool. The get() method has\
    \ also the responsibility for creating a new object when the pool is empty. Let's\
    \ consider the Trainer class objects we want to manage with the Object Pool Pattern:\n\
    \n```\nclass Trainer {\n  explain() {...}\n  show() {...}\n  exercise() {...}\n\
    }\n```\n\nThe class is very simply since it is not relevant for our purpose. Now\
    \ we can create a pool of trainer using the following code:\n\n```\nvar trainerPool\
    \ = new ObjectPool(Trainer);\n```"
