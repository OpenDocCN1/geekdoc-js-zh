  md: "# Inheriting and Creating Mixins\n\nOf course, we can add methods from different\
    \ mixins and compose the public interface of our objects as needed. For example,\
    \ assuming that we have different mixins collecting functionalities grouped by\
    \ topic, we can mix members with the following code:\n\n```\naugment(Person.prototype,\
    \ namingMixin);\naugment(Person.prototype, movingMixin);\naugment(Person.prototype,\
    \ studyingMixin);\n```\n\nHere, we to add the Person() prototype from a mixin\
    \ that provides utilities concerning name and surname management (namingMixin),\
    \ a mixin with methods describing movement (movingMixin), and a mixin that has\
    \ methods regarding study activities (studyingMixin).\n\nA more accurate mixin\
    \ function might allow us to select which members to add:\n\n```\nfunction augment(destination,\
    \ source, ...methodNames) {\n  if (methodNames) {\n    for (var methodName of\
    \ methodNames) {\n      if (source.hasOwnProperty(methodName)) {\n        destination[methodName]\
    \ = source[methodName];\n      }\n    }\n  } else {\n    for (var methodName in\
    \ source) {\n      if (source.hasOwnProperty(methodName)) {\n        destination[methodName]\
    \ = source[methodName];\n      }\n    }\n  }\n\n  return destination;\n}\n```\n\
    \nIn this case, we added the rest parameter methodNames to allow an indefinite\
    \ number of parameters after the source and destination ones. If a list of method\
    \ names is passed, the function adds them to the destination object. This allows\
    \ us to select members to add from a mixin, in the following example:\n\n```\n\
    augment(Person.prototype, namingMixin, \"getFullName\");\naugment(Person.prototype,\
    \ movingMixin, \"goLeft\", \"goRight\");\naugment(Person.prototype, studyingMixin,\
    \ \"readTopic\", \"writeTopic\", \"repeatTopic\");\n```"
