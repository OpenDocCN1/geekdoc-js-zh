  md: "# Universal Module Definition\n\nAs discussed in the previous section, each\
    \ module loading approach has its own syntax to define a module. We saw how to\
    \ made AMD and the module pattern compatible, but what about CommonJS module and\
    \ AMD compatibility?\n\n# UMD\n\nAn attempt to define JavaScript modules that\
    \ are compatible for both AMD and CommonJS paradigms is **Universal Module Definition**\
    \ or simply **UMD**. It is actually a collection of patterns published on GitHub\
    \ at the address: https://github.com/umdjs/umd. Although there are a lot of different\
    \ patterns, they are all essentially variations on the same idea-to define a module\
    \ that can be used in CommonJS and AMD environments. The following is a code template\
    \ of UMD module definition following the pattern called export:\n\n```\n(function\
    \ (root, factory) {\n  if (typeof define === 'function' && define.amd)\n    //\
    \ AMD.\n    define([], factory);\n  } else if (typeof exports === 'object') {\n\
    \    // Node. Does not work with strict CommonJS, but\n    // only CommonJS-like\
    \ environments that support\n    //module.exports, like Node.\n    module.exports\
    \ = factory();\n  } else {\n    // Browser globals (root is window)\n    root.exports\
    \ = factory();\n  }\n}\n}(this, function () {\n  // Module code\n  return (...);\n\
    });\n```\n\nBasically, it is an IFE that takes two parameters: the object to which\
    \ the module will be attached in a browser context (root) and the function that\
    \ actually defines the module (**factory**). In our example, we pass the this\
    \ keyword as the root, so the module will be attached to the global scope when\
    \ it is loaded inside a browser without AMD.\n\nThis definition makes the module\
    \ available as a CommonJS module, an AMD module, or a global variable, depending\
    \ on the environment."
  merge: -1
  pgno: 226
