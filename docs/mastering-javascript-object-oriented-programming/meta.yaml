  md: "# Inheriting and Creating Mixins\n\nWhen we call the Person constructor through\
    \ the apply() method, we are asking the parent object to replicate its properties\
    \ on the Developer instance, identified by the this keyword. So, the Developer\
    \ instance's name and surname properties are overriding the Person function's\
    \ properties.\n\nThis makes sense, since we usually do not want to share properties\
    \ with the parent. Each instance usually should have its own properties. So, the\
    \ simplest way to override a parent property is to redefine it in the child constructor.\n\
    \nHowever, there are situations where a property can be conveniently shared among\
    \ instances of an object constructor and all children. By referring to our Person\
    \ constructor, when we have to have a fullName whose value is dependent on the\
    \ name and surname properties. We are talking about implementing the getFullName\
    \ functionality as a property. We can do it as follows:\n\n```\nfunction Person(name,\
    \ surname) {\n  this.name = name;\n  this.surname = surname;\n}\n```\n\n```\n\
    Object.defineProperty(\n  \"fullName\",\n  get: function() { return this.name\
