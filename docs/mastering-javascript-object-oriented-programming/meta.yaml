  md: '# 5

    Defining Contracts with Duck Typing


    This chapter will illustrate an enhanced technique that allows us to define contracts
    between objects interacting each other. This technique, named duck typing, allows
    for implementing something similar to interfaces supported by many classical Object-Oriented
    Programming languages. The topics covered by the chapter are:


    +   * Checking dynamic data types

    * Contracts between software components

    * Using duck typing

    * Emulating interfaces with duck typing


    # Managing dynamic typing


    Data types are one of the basic features that ensure consistency throughout an
    application. Some operations can be made only on specific data types and checking
    if a value is of a valid data type is crucial to avoid runtime exceptions. Most
    compiled Object-Oriented Programming languages have a static type system that
    asks the developer to declare the allowed type of a variable and check the code
    before it runs. JavaScript is a dynamic language—it does not require you to declare
    a specific data type for a variable. Since the content of a variable can change
    during the execution, data type checking of its value is performed just just when
    the value itself is used. Let''s recall some basic notions with some examples.'
