  md: '# SOLID Principles


    If we need to pass different dependencies on every call, then we use **method
    injection**. For example, if we new to specify a different way of sending an order
    when we call the `sendOrder()` method, we can use the Method injection:


    ```

    var httpOrderSender = new HttpOrderSender();

    var orderManager = new OrderManager();

    orderManager.sendOrder(httpOrderSender);

    ```


    The **property injection** allows us to specify the dependency by assigning it
    to a property of the object. This gives the flexibility of changing dependency
    during the lifetime of the object and at the same time avoids specifying the dependency
    for each method''s call. We could apply this approach in our example as follows:


    ```

    var httpOrderSender = new HttpOrderSender();

    var orderManager = new OrderManager();

    ```


    ```

    orderManager.sender = httpOrderSender;

    orderManager.sendOrder();

    ```


    Here, we introduced the `sender` property to which we attached the `httpOrderSender`
    object. This object will be taken into account when the `sendOrder()` method is
    called.


    # Summary


    In this chapter, we analyzed the SOLID principles, a set of five OOP Design principles
    that help create more scalable and maintainable software. Although these principles
    were born for classical OOP languages, they are suitable also for a dynamic language
    such as JavaScript. In order to show this, we explored the five principles by
    providing examples of their application in JavaScript.


    We saw that the Single Responsibility Principle is about designing software architecture
    with components that have a clear and simple behavior.


    The Open/Closed Principle is about class design and feature extensions.


    The Liskov Substitution Principle is about subtyping and inheritance.


    The Interface Segregation Principle is about interface definition exposed to clients.


    The Dependency Inversion Principle concerns the management of dependency among
    the application''s components.


    In the next chapter, we will continue the design topic by exploring modern architectures
    of JavaScript applications.'
