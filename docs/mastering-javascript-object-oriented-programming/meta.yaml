  md: "# Callbacks and this\n\nAttaching code to events properties or passing callbacks\
    \ to be executed asynchronously seems to have no major impact on the overall code.\
    \ However, it may give rise to some subtle issues. Consider the following code:\n\
    \n```\nfunction myFunction(id, standardText, clickedText) {\n  this.id = id;\n\
    \  this.standardText = standardText;\n  this.clickedText = clickedText;\n\nvar\
    \ btn = document.getElementById(this.id);\n  btn.innerHTML = this.standardText;\n\
    \\  btn.addEventListener(\"click\", function() {\n    btn.innerHTML = this.clickedText;\n\
    \  });\n}\n```\n\nIt is a constructor function that transforms an HTML button\
    \ into a custom button. The button has an initial text on it, and when the user\
    \ clicks it, the text changes. The code stores the parameters and attaches a handler\
    \ for the click event. We can use the constructor in the following example:\n\n\
    ```\nvar myBtn = new myBuilder(\"btn\", \"Click me!\", \"Clicked!\");\n```\n\n\
    At first glance it seems correct, but if we run the code we do not get the expected\
    \ result. Instead of getting the Clicked! text on the button when we click it,\
    \ we will get the undefined. What happens here?\n\nThe unexpected behavior depends\
    \ on the use of the this keyword within the click event handler:\n\n```\nbtn.addEventListener(\"\
    click\", function() {\n  btn.innerHTML = this.clickedText;\n});\n```\n\nIn fact,\
    \ the value of the this keyword within a function only depends on how the function\
    \ is called, not on how it is defined.\n\nSince the handler runs asynchronously,\
    \ the execution context will be different from the one of the main execution flow.\
    \ So, the this keyword is not bound to the instance of the constructor, but to\
    \ the current context. In our example, it will be bound to the window object of\
    \ the browser, which has not a clickedText property."
  merge: -1
  pgno: 183
- img_proc: false
  md: "# Asynchronous Programming and Promises\n\nWe have a few ways to correctly\
    \ manage the use of the this keyword inside asynchronous functions.\n\nThe first\
    \ and most common approach is not using this. In most cases, we don't want to\
    \ access the current context represented by the this key, but what it refers to.\
    \ So we can catch it in a variable and use the variable instead of directly accessing\
    \ this. Usually, the variable is named self or that, but of course it can have\
    \ any name. The following code shows how to use this using the variablesself instead\
    \ of this:\n\n```\nfunction myFunction(id, standardText, clickedText) {\n  self.id\
    \ = id;\n  self.standardText = standardText;\n  self.clickedText = clickedText;\n\
    \n  var btn = document.getElementById(self.id);\n  btn.innerHTML = self.standardText;\n\
    \n  btn.addEventListener(\"click\", function() {\n    btn.innerHTML = self.clickedText;\n\
    \  });\n}\n```\n\nIn this case, the reference to this is already resolved when\
    \ the asynchronous code of the event handler is executed and has no ambiguities\
    \ raised.\n\nAn alternative approach is to explicitly set the value of this keyword\
    \ to the event handler. In fact, any function has the bind() method that allows\
    \ to specify the value to assign to the this keyword when the function will be\
    \ executed. The bind() method takes the value to assign to and returns a function\
    \ with the requested binding. If we want to apply this approach to our example,\
    \ we will define our event handler as follows:\n\n```\nvar clickHandler = (function(){\n\
    \  btn.innerHTML = this.clickedText;\n}).bind(this);\n\nbtn.addEventListener(\"\
    click\", clickHandler);\n```\n\nWhen the handler will be executed, the value of\
    \ this will refer to the value it had during the function definition, that is,\
    \ the constructor instance."
  merge: -1
  pgno: 184
- img_proc: false
  md: "# Asynchronous Programming and Promises\n\nA third way to avoid ambiguity using\
    \ the this keyword in an asynchronous context is the use of arrow functions. ECMAScript\
    \ 6 introduced arrow functions as anonymous functions with a more concise syntax\
    \ and a lexical for the this keyword. In its basic form, an arrow function is\
    \ an expression with a list of parameters in parentheses, a fat arrow symbol (=)\
    \ and a function body or an expression. For example, the arrow function sets a\
    \ value in a textbox:\n\n```\n(value) => { document.getElementById(\"txtText\"\
    ).value = value; }\n```\n\nThe following example return the sum of two numbers:\n\
    \n```\n(a, b) => {return a + b;}\n```\n\nIt is equivalent to the following expression:\n\
    \n```\n(a, b) => a + b;\n```\n\nUsing an arrow function, we can define our event\
    \ handler as in the following:\n\n```\nfunction myButton(id, standardText, clickedText)\
    \ {\n  this.id = id;\n  this.standardText = standardText;\n  this.clickedText\
    \ = clickedText;\n\n  var btn = document.getElementById(this.id);\n  btn.innerHTML\
    \ = this.standardText;\n\n  btn.addEventListener(\"click\",\n    () => { btn.innerHTML\
    \ = this.clickedText; });\n}\n```\n\nBy design, the arrow function keeps the this\
    \ keyword bound to the value it has at function definition time. So, we do not\
    \ need to use the bind() method as in the previous example.\n\n# The callback\
    \ hell\n\nWe have just seen how a simple code as an event handler may affect the\
    \ meaning of the this keyword due to its asynchronous nature. A few measures can\
    \ help us overcome the issue, but it is not the only potential problem with asynchronous\
    \ code."
  merge: -1
  pgno: 185
