  md: 'As we can see, we simply added a setter to the data source property definition
    that assigns the new value to the data target property. This simple addition makes
    the two properties tightly synchronized, since the actual value is kept by the
    data target property and the data source property act as its wrapper.


    Even if this solution is very effective, it has some issues. Since it redefines
    a existing property, we risk losing the original definition which may have a customized
    behavior. Moreover, the properties involved in the data binding relationship may
    be sealed so that we cannot change its definition. This happens, for example,
    with the DOM elements. We can''t change the DOM''s elements definition, if we
    plan to use the bindWay() method on a DOM element we will fail.


    # The publish/subscribe pattern


    We will try to overcome the limitations of previous data binding implementations
    by using a design pattern. We can choose to apply the observer pattern or publisher/subscriber
    pattern. Both are intended to manage a scenario where one or more objects are
    interested in receiving notifications when the state of another object changes.
    The solutions proposed by the patterns are similar and often the patterns are
    confused or considered as two different names for the same pattern. Actually,
    there are important differences, as we will see in the following sections.


    # The observer pattern


    The observer pattern is maybe widely known because it is included in the patterns
    proposed by the Gang of Four. In its simplified version for JavaScript, that is,
    not considering class abstractions, it invokes the following actors:


    +   - **Subject**: This is the object that may change its state; it knows its
    observer and sends them a notification when its state changes.

    - **Observers**: These are the objects that are interested in the subject''s state
    change.


    An observer that wants to know when changes of the subject''s state occur registers
    itself with the subject. The subject will notify a change of its state to all
    registered observers.'
  merge: -1
  pgno: 170
- img_proc: false
  md: 'The following diagram describes graphically the interactions between the subject
    and the observers:


    ![](bbox=[0.331, 0.173, 0.668, 0.433])


    Simply put, the observer pattern proposes that the subject directly notifies its
    observers of its state changes. If we turn back to the data binding implementation
    we made so far, we can see that they applied an approach similar to this pattern.
    For example, when we used the `onchange` event to be notified if the value of
    the textbox changed, we were applying the observer pattern. In fact, the textbox
    was the subject and the `person` object was the observer.


    Even when we used the getter and setter methods of a property, somehow, we applied
    this pattern; but in that case, we did not generate a notification, instead, directly
    updated the value of the observer''s property.


    # The publisher/subscriber pattern


    The publisher/subscriber pattern is a variant of the observer pattern, which introduces
    a third component in order to decouple the subject from the observers-**observable**.'
