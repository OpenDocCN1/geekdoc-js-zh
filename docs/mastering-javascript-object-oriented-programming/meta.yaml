    \ Using the eval() function is not necessarily a good idea. In fact, evaluating\
    \ a JavaScript piece of code may cause an unclear mix of local and global scope.\
    \ Consider, for example, the following code:\n\n```\nvar declaration = \"var x\
    \ = 123\";\n\nfunction evaluate(code) {\n  eval(code);\n  return x;\n}\n\nconsole.log(evaluate(declaration));\
    \ //result: 123\nconsole.log(x);                   //result: undefined\n```\n\n\
    It defines a string variable with a declaration of a variable x. The string is\
