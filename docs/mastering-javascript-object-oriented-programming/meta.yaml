  md: '# Summary


    In this chapter, we explored different ways of creating objects. We started recalling
    the basic ways to create objects in JavaScript and then discussed how some design
    patterns can help us to create more effective code. We have seen how to create
    singletons and warned about their abuse. We analyzed the factory pattern and its
    variant abstract factory pattern both allows us to delegate to a specialized object
    (the factory) the task of creating objects belonging to a specific category. The
    builder pattern can be useful when creating some objects is a complex process
    that consists of many steps. In this case, we use a special object (the director)
    that uses other objects (the builders) to actually create the object. Finally,
    we talked about the object pool pattern, which allows us to reuse objects avoiding
    a negative impact on the application performance when the creation of a type of
    object, is too expensive or when we have frequent creation and destruction of
    objects.


    In the next chapter, we will continue the exploration of the design patterns focusing
    on well-known approaches concerning data presentation.'
