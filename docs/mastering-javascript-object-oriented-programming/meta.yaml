    \  \"fullName\",\n  get: function() { return \"Dev \" + this.name + \" \" +\n\
    \    this.surname;\n  }\n);\n```\n\nAs we can see, we simply redefined the property\
    \ using Object.defineProperty(). Here, we attached the fullName property to the\
    \ Developerprototype and changed the output of the get descriptor."
