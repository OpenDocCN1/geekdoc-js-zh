    # The abstract factory


    An evolution of the factory pattern is the abstract factory pattern. This pattern
    builds on the factory pattern since it returns a factory instead of an object.
    In fact, sometimes it is called a factory of factories. In this pattern, we find
    the following abstractories:


    +   **The Client:** As in the factory pattern, this is the object that needs another
    object of a specific category

    **The abstract factory:** This is the object that returns a concrete factory

    **The concrete factory:** It is the factory returned by the abstract factory to
    create objects of a number of categories

    **The product:** This is the object created by the concrete factory and used by
    the client


