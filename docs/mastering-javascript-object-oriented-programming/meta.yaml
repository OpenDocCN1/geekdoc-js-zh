  md: "# Organizing Code\n\nThe detection of the environment is made by checking the\
    \ key functions of each paradigm exist. In fact, if a define() function is detected,\
    \ the function builds the AMD module; if an exports object exists, then it builds\
    \ a CommonJS module; otherwise it attaches the module at the global variable returnExports.\n\
    \nLet's apply this template to define a module:\n\n```\nfunction (root, factory)\
    \ {\n  if (typeof define === 'function' && define.amd) {\n    define([], factory);\n\
    \  } else if (typeof exports === 'object') {\n    module.exports = factory();\n\
    \  } else {\n    root.returnExports = factory();\n  }\n}(this, function () {\n\
    \  var pi = 3.14;\n});\n\nfunction circumference(radius) {\n  return 2*pi*radius;\n\
    }\n\nfunction circleArea(radius) {\n  return pi*radius*radius;\n}\n\nreturn {\n\
    \  calculateCircumference: circumference,\n  calculateCircleArea: circleArea\n\
    };\n));\n```\n\nOnce we define the module, we can use it on browsers not supporting\
    \ AMD as follows:\n\n```\nconsole.log(returnExports.calculateCircumference(5));\n\
    ```\n\nIf the browser has an AMD loader, we will load the module in the following\
    \ way:\n\n```\nrequire(\"geoModule\", function (geoModule) {\n  console.log(geoModule.calculateCircumference(5));\n\
    });\n```\n\nInstead, in a CommonJS environment we will write:\n\n```\nvar geoModule\
    \ = require(\"./geoModule\");\n```\n\n```\nconsole.log(geoModule.calculateCircumference(5));\n\
    ```"
