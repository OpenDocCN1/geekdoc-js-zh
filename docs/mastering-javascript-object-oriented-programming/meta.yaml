  md: '# SOLID Principles


    A possible approach to make high-level components independent from low-level components
    is inversion of control, that is a way to apply the Dependency Inversion Principle.
    Inversion of control is the actual mechanism using which we can use to make the
    higher level components depend on abstractions rather than concrete implementation
    of lower level components.


    > Inversion of control is sometimes called the Hollywood Principle. This name
    is borrowed from the cinema industry, where, after auditions for a role in a Hollywood
    movie, usually the director says, don''t call us, we''ll call you. This sentence
    embodies the spirit of inversion of control.


    Dependency injection is a technique to implement inversion of control. It injects
    the concrete implementation of a low-level component into a high-level component.
    So, dependency injection concretely applies the Dependency Inversion Principle
    in the software development by moving the binding of abstraction and concrete
    implementation out of the dependent component.


    # Dependency injection approaches


    Independent of the language used, dependency injection can be done using three
    approaches:


    +   - Constructor injection

    - Method injection

    - Property injection


    The most common approach is the constructor injection. It is based on passing
    the dependency as a parameter of the constructor function. This is the approach
    we use in our example:


    ```

    var httpOrderSender = new HttpOrderSender();

    var orderManager = new OrderManager(httpOrderSender);

    ```


    We created an httpOrderSender object and injected it into the orderManager object
    by passing it to the OrderManager() function.


    The constructor injection is suitable when the same dependency is valid for all
    the object''s lifetime. In other words, the orderManager object will use httpOrderSender
    during its life, the constructor injection approach is appropriate.'
  merge: -1
