  md: "# ES7 async/await\n\nThe model of code writing using Generators is similar\
    \ to the pattern proposed by the async functions in the future ECMAScript 7 specifications.\
    \ Basically, it follows the style in our example without using the Generator infrastructure.\
    \ So, in the near future, we will write the following code to get the same result:\n\
    \n```\nasync function displayUserPosts() {\n  var user = await http(\"/users/12345\"\
    );\n  var blog = await http(\"/blogs/\" + user.blogId);\n\ndisplayPostList(blog.posts);\n\
    }\n\ndisplayUserPosts();\n```\n\nNotice the use of the async keyword that marks\
    \ the displayUserPosts() function as asynchronous and the await keyword allows\
    \ us to suspend the function execution waiting to get a result.\n\n# Summary\n\
    \nThis chapter discussed how we can face asynchronous programming in JavaScript.\
    \ Starting with the asynchronous nature of the JavaScript’s runtime execution\
    \ flow, we explored how to manage events using callback functions. We saw that,\
    \ although callbacks are widely used to manage asynchronous code, they are not\
    \ so effective. A heavy use of callbacks leads to unreadable code and the so-called\
    \ callback hell-maze of code difficult to read and understand. Moreover, managing\
    \ asynchronous code with callbacks do not allows us to catch failures.\n\nPromises\
    \ can us get more control on asynchronous code. We have seen the standard Promise’s\
    \ API of ECMAScript 6 and shown how to use them in order to catch results and\
    \ synchronize multiple asynchronous tasks.\n\nThen, we approached the asynchronous\
    \ code management using a technique based on Generators, a new feature of ECMAScript\
    \ 6 as well. This approach allows us to manage asynchronous code by writing code\
    \ in a synchronous style. This technique appears to be a forerunner of the async\
    \ functions in discussion for ECMAScript 7 specifications.\n\nIn the following\
    \ chapter, we will take a look at how to organize our code in order to make it\
    \ modular and reusable."
