  md: "The **ECMAScript 2015** (also known as **ECMAScript 6** or **ES6**) specifications\
    \ introduce the class construct in JavaScript too. However, this construct has\
    \ nothing to do with the classes of the traditional Object-Oriented Programming\
    \ paradigm.\n\nWhile in other languages, such as Java or C#, a class is an abstract\
    \ description of the structure of an object, in JavaScript the class construct\
    \ is a syntactic simplification of the approaches to create objects we have already\
    \ seen. The JavaScript class construct provides a much simpler and clearer syntax\
    \ for managing constructors, prototypes, and inheritance.\n\nThe new class construct\
    \ creates order am among the different ways of object creation and aims to use\
    \ the best practice in prototype management.\n\nLet's take a look at what a class\
    \ looks like:\n\n```\nclass Person {\n  constructor(name, surname) {\n    this.name\
    \ = name;\n    this.surname = surname;\n  }\n```\n\nThis class defines a constructor\
    \ for objects of type Person. It is fully equivalent to the following old-style\
    \ JavaScript code:\n\n```\nfunction Person(name, surname) {\n  \"use strict\"\
    ;\n  this.name = name;\n  this.surname = surname;\n}\n```\n\nWe can realize that\
    \ classes are just syntactic sugar for the constructor's definition, simply getting\
    \ the type of a class by means of the typeof statement:\n\n```\nconsole.log(typeof\
    \ Person); //function\n```\n\nWe can create an object using a class just as we\
    \ do with constructors, as shown by the following example:\n\n```\nvar person\
    \ = new Person(\"John\", \"Smith\");\n```\n\nHowever, unlike a constructor, we\
    \ cannot invoke a class like a function, since the following code will raise an\
    \ exception:\n\n```\nvar person = Person(\"John\", \"Smith\");\n```"
