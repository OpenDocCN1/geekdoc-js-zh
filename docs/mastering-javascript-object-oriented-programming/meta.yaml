  md: '# # A Refresher of Objects


    Any JavaScript programmer knows that almost everything in this scripting language
    is an object—from arrays to functions, from regular expressions to dates. We can
    say that what is not a primitive data type is an object. But, even the primitive
    data types such as numbers or strings have object wrappers, that is, they are
    accessible via objects. So, we can argue that objects are vital in JavaScript,
    and we need to learn the use of objects as best as we can in order to create better
    applications. One way, for example, to better use objects is applying the Object-Oriented
    Programming (OOP) paradigm.


    However, before diving into principles and pattern of this programming approach,
    let''s start this first chapter with a quick recap about objects fundamentals.
    In particular, the chapter will discuss:


    +   - How to create and manage literal objects

    - How to define object constructors

    - What a prototype is and how to use it

    - The new ECMAScript 2015 class construct and its relation to objects, constructors,
    and prototypes


    # ## Object literals


    An object is a container of values combined to form a single data structure that
    has a particular identity. Normally, in fact, an object is used to represent a
    specific entity such as a person, an order, an invoice, a reservation, and so
    on, through an aggregation of data and functionalities.'
  merge: -1
  pgno: 13
- img_proc: false
  md: 'The data is called properties and are represented by pairs of names and values.
    The functionalities are usually called methods and are represented by functions,
    even if they are nothing more the same pairs of names and values as for properties,
    where values happen to be functions.


    The simplest way to create an object in JavaScript is the literal representation,
    as shown in the following example:


    ```

    var emptyObject = {};nvar person = {"name": "John", "surname": "Smith"};

    ```


    Through the literal notation, we represent an object by enclosing its properties
    and methods in braces. In this statement, we created an empty object, an object
    without properties methods; all in all, not very useful but important to understand
    that an object is basically a list of pairs of values and, with every list, it
    can be empty.


    In the second comma, in order to define the object person, we listed two pairs
    of strings separated by commas. Each pair consists of two strings separated by
    a colon: The first string is the name of the property while the second one represents
    its value.


    # Properties


    To assign a name to the properties of an object, we don''t have the same restrictions
    as for the JavaScript variables. We can use any string, even if there is some
    constraint when accessing properties with particular names, as we are going to
    see.


    The double or single quotes around the property name are generally optional, but
    they are required when the name does not follow the rules for variable names.
    So, we could write our definition of person as:


    ```

    var person = {"name": "John", surname: "Smith"};

    ```


    But if we want a definition like the following, we are forced to use double or
    single quotes:


    ```

    var person = {"first-name": "John", "second-name": "Smith"};

    ```


    We can assign any value to an object property and any JavaScript expression, including
    any other object. So, we can create nested objects as shown here:


    ```

    var person = {"name": "John",nsurface: "Smith",naddress: {

    street: "13 Duncannon Street",ncity: "London",

    }

    ```'
