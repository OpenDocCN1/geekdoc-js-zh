  md: '# Controlling access to public properties


    When we define public properties, we do not put any constraints on their accessibility.
    Consider the literal person definition:


    ```

    var person = { name: "John", surname: "Smith" };

    ```


    Public properties are readable and writable and they can be set to any value.
    The following assignments are perfectly legal:


    ```

    var personName = person.name;

    person.name = "Mario";nperson.surname = [1, 2, 3];

    ```


    But for the meaning we want to get the object, these assignments might not make
    sense or be desirable. Assigning an array to a person''s surname is definitely
    bizarre!


    In general, it would be desirable to have more control over the way to access
    public properties in order to determine as precisely as possible the meaning of
    an object. For example, consider the following definition of a person:


    ```

    var person = {

    name: "John",nsurname: "Smith",nfullName: "John Smith",nemail: "john.smith@packpub.com"

    };

    ```


    We would like that fullName property is read-only, and its value was calculated
    by the combination of the name and surname properties. Moreover, we would like
    to check that the email property was a syntactically valid e-mail address.


    We can obtain this behavior using methods instead of properties, as shown in the
    following example:


    ```

    var person = {

    name: "John",nsurname: "Smith",ngetFullName: function() { ... },

    getEmail: function() { ... },

    setEmail: function() { ... }

    };

    ```'
