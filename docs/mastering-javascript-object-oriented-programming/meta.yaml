  md: "# Preventing extensions\n\nWe don't always want derived constructors or classes\
    \ to customize some or all members of the parent constructor or class. In some\
    \ circumstances, we want to prevent that certain changes being allowed. In the\
    \ previous chapter, we have seen how to prevent that a property is written or\
    \ its configuration changed. But what can we do to prevent property method addition\
    \ and removal? Luckily, we have Object.preventExtensions(), Object.seal(), and\
    \ Object.freeze() methods that help us.\n\nLet's begin to see in which situations\
    \ we can use these methods.\n\nIf we want to prevent addition of new members to\
    \ an object we can use the Object.preventExtensions() method. Consider the following\
    \ example:\n\n```\nvar person = { name: \"John\", surname: \"Smith\" };\nObject.preventExtensions(person);\n\
    person.age = 32;\nconsole.log(person.age); //result: undefined\n```\n\nIf we try\
    \ to add the new property, age, to the person object, we do not get an error,\
    \ but the property will not be added to it. If we enable strict mode, the attempt\
    \ to add the new property will throw an exception. In order to raise the exception,\
    \ we should check if the object is extensible using the Object.isExtensible()\
    \ method:\n\n```\nif (Object.isExtensible(person)) {\n  person.age = 32;\n}\n\
    ```\n\nOf course, we use the Object.preventExtensions() method in a constructor\
    \ in order to avoid property addition both to the constructor instances and the\
    \ derived constructors. For example, we can define the Person() constructor as\
    \ follows:\n\n```\nfunction Person(name, surname) {\n  this.name = name;\n  this.surname\
    \ = surname;\n\nObject.preventExtensions(this);\n}\n```"
