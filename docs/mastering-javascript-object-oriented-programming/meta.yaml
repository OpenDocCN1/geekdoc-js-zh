  md: '# Preface


    JavaScript is the most widely used language in the world. Born as a simple glue
    between the user and the HTML, it has evolved over the years and has acquired
    an increasingly important role. Today, its scope is no longer just the Web browser,
    but it lives also on the server, on the desktop PC, on mobile devices up to embedded
    devices. JavaScript is no longer a simple language to write many scripts, but
    a language to create complex applications.


    Unfortunately, many believe that JavaScript cannot compete with programming languages
    such as C++, Java or C#. Many developers with a true OOP background think that
    JavaScript does not have the characteristics to be considered a true Object-Oriented
    language. JavaScript has to disprove this prejudice and to show that its characteristics
    to be considered a true OOP language, although with its peculiarities to make
    it unique. Thanks to the latest innovations introduced by the ECMAScript standard,
    we will see how we can write robust and efficient code with JavaScript and we
    can apply those typical principles of Object-Oriented Programming to create scalable
    and maintainable applications.


    # What this book covers


    +   * Chapter 1, A Refresher of Objects, recalls some basic concepts about objects
    management in JavaScript covering literal objects, constructor functions and classes.

    * Chapter 2, Diving into OOP Principles, shows that JavaScript supports all the
    basic principles that allows us to define a true OOP language.

    * Chapter 3, Working with Encapsulation and Information Hiding, describes some
    techniques to protect private members of an object, implementing Encapsulation
    and Information Hiding principles.

    * Chapter 4, Inheriting and Creating Mixins, covers the inheritance mechanism
    of JavaScript based on prototypes and the creation of mixins.

    * Chapter 5, Defining Contracts with Duck Typing, focuses on using duck typing
    instead of relying on type checking and shows some techniques to emulate classical
    OOP interfaces.

    * Chapter 6, Advanced Object Creation, discusses some different ways to create
    objects and introduces a few Design Patterns such as the Factory Pattern and the
    Builder Pattern.'
