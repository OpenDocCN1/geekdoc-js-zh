  md: "# A Refresher of Objects\n\nIf we try to access a property or method of an\
    \ object that the object itself has not, JavaScript looks for it among the properties\
    \ and methods of the prototype. So, in our previous example, if we try to access\
    \ the greets() method of the marioRossi object, JavaScript does not find it among\
    \ its methods, but it will find it among the methods of its prototype.\n\nThe\
    \ prototype of an object can in turn have another prototype. In this case, the\
    \ search for a property or method goes up the prototype chain until you get the\
    \ object-basic prototype of all objects.\n\nJavaScript built-in objects have a\
    \ prototype reference too. In most cases, the management is quite similar to the\
    \ prototypes management of objects created through our constructors. This allows\
    \ us to extend functionality not provided by the built-in objects in a rather\
    \ simple and elegant way.\n\nFor example, if we want to make a padding method\
    \ available to all strings, we can work on the prototype of the String() constructor,\
    \ as shown here:\n\n```\nString.prototype.padLeft = function(width, char) {\n\
    \  var result = this;\n  char = char || \" \";\n\nif (this.length < width) {\n\
    \    result = new Array(width - this.length + 1).join(char) + this;\n  }\n  return\
    \ result;\n}\n```\n\nWith this definition we can use padLeft() as if it were a\
    \ built-in method of all strings, shown in the following example:\n\n```\nconsole.log(\"\
    abc\".padLeft(10, \"x\")); //xxxxxxxxabc\n```\n\n# Using classes\n\nSo far, we\
    \ created objects using two mechanisms: the literal notation and the constructor.\
    \ These mechanisms let us create objects with a simple approach, without too many\
    \ formalities.\n\nHowever, most developers are used to creating objects from the\
    \ class construct. In fact, many Object-Oriented languages let the developer define\
    \ classes and create objects as an instance of those classes."
