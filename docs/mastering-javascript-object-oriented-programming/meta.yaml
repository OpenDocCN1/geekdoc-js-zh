    \ compact and readable way to get the same functionalities using the following\
    \ constructor functions:\n\n```\nfunction Person(name, surname) {\n  this.name\
    \ = name;\n  this.surname = surname;\n}\nnfunction Developer(name, surname, knownLanguage)\
    \ {\n  Person.apply(this, arguments);\n  this.knownLanguage = knownLanguage;\n\
