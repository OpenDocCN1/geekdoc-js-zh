  md: '# 12

    Modern Application Architectures


    When the complexity of an application grows, we cannot write code without a well-defined
    structure that gives solidity and robustness and guarantees long-term maintainability.
    Without such structure, our project may collapse because we lose control over
    the code, and it becomes more and more complex, unreadable, and unchangeable.
    The structure we need is an architecture that combines together the various components
    of a piece of software, in order to satisfy the explicit and implicit requirements
    of a software project.


    Architecture evolves with technology, and this is particularly true in the web
    context. So, when we search the right architecture for the goals of our project,
    we should take into account which architecture is suitable with a certain technology.


    In this chapter, we will explore the main architectures for modern JavaScript
    applications and will analyze how they work and which benefits they provide. During
    the discussion, we will analyze a couple of design patterns that allows us to
    implement a fundamental feature that any architecture should aim—loose coupling.


    We will discuss the following topics:


    +   - Goals of an application architecture

    - From traditional web applications to Single Page Applications

    - The Zakas/Osmani architecture for scalable applications

    - The facade and mediator patterns

    - The cross-cutting features implementation

    - The isomorphic applications'
