  md: '# # 10

    # Organizing Code


    We rarely worry about code organization for simple scripts, since a few lines
    of code may be immediately identified and possibly changed without any issues.
    When the codebase of our application grows, the need to organize our code becomes
    increasingly urgent. In this chapter, we will describe the most common ways to
    face this problem starting from namespaces through the ECMAScript 6 modules. In
    the middle, we will explore the different approaches to define organizational
    units of the code that fit on the server-side and on client-side the JavaScript
    programming.


    The following topics will be discussed in the chapter:


    +   - The global scope

    - The namespace pattern

    - The module pattern

    - Approaches to JavaScript modularization (AMD and CommonJS)

    - ES6 modules


    # ## The global scope


    When JavaScript was born, its role was very limited. It was mainly used for event
    handling and for some visual effects, acting as the glue between the user and
    the HTML document. Usually, this purpose did not require too much code and most
    of its organization relied on functions and files. The global scope was the natural
    living environment of publicly accessible variables and functions.'
  merge: -1
  pgno: 204
- img_proc: false
  md: "# Organizing Code\n\nWith the growth of JavaScript's capability, the evolution\
    \ of object models and the spread of the language in a context different from\
    \ the browser, the importance of JavaScript's role has grown as well, and so has\
    \ the code size. What once a simple set of scripts, now has become an application.\
    \ The global scope is no longer a suitable environment to put code without criteria.\n\
    \nThe use of global scope has always been an anti-pattern in any programming language\
    \ for various reasons:\n\n+   * **Understandability issues**: When the code of\
    \ an application is not trivial, reasoning about a snippet of code that makes\
    \ reference to a global variable may be difficult, since its value may be changed\
    \ by any part of the application and we cannot have control over it.\n* **Implicit\
    \ coupling**: References to global variables, objects, or functions create an\
    \ implicit coupling making code reuse impossible.\n* **Namespace pollution**:\
    \ The global scope is an open environment-every snippet of code may access and\
    \ add new items without control; this may lead to a confused heap of variables,\
    \ objects, functions difficult to read and with a high risk of naming clash.\n\
    * **Memory allocation issues**: Global items are alive throughout the application\
    \ life, and their memory footprint may be significant even if they are not used.\n\
    \nIn a dynamic language such as JavaScript, these issues are even more amplified.\
    \ Let's see some side effects we can have by relying on the global scope.\n\n\
    # Global definitions\n\nAs we know, JavaScript is very permissive. If we do not\
    \ declare a variable, it is created on our behalf. Of course, this is a bad practice\
    \ that should always be avoided by enabling `strict mode` using the `\"use strict\"\
    ` clause. In fact if we rely on this behavior to create global variables, we have\
    \ no control over their existence nor on their management. We define a global\
    \ variable in the following example:\n\n```\nfunction myFunction() {\n  globalVar\
    \ = \"This is a global variable\";\n\n  return globalVar;\n}\n```"
  merge: -1
  pgno: 205
- img_proc: false
  md: "# Organizing Code\n\nThe assignment to the globalVar variable implicitly creates\
    \ it in the global scope. So, in another part of the application, we have another\
    \ code that creates another variable with the same name. We are assigning a new\
    \ value to the existing variable as follows:\n\n```\nfunction anotherFunction()\
    \ {\n  globalVar = { name: \"John\", surname: \"Smith\"};\n\n  return globalVar;\n\
    }\n```\n\nSince we have no control over global scope, we cannot avoid naming clashes\
    \ of variables and consequently undesired assignments. This is particularly true\
    \ when we want to reuse a piece of code in another application. Moreover, when\
    \ we read the code, not always is obvious which value has a global variable in\
    \ a given file, and this may lead to misunderstandings.\n\nOf course, the same\
    \ problem happens with functions defined in the global scope. In fact, if we define\
    \ a new function with the name of an existing one, the last definition overrides\
    \ the previous one. So, when the amount of code of an application grows without\
    \ any organization, we might risk redefining existing functions with obvious bad\
    \ effects. Think of the creation of a library; how can we make sure that our functions\
    \ or our variables do not collide with the functions and variables existing in\
    \ the application that will use it?\n\n# Creating namespaces\n\nIn order to reduce\
    \ the negative impact of using the global scope, we should avoid creating global\
    \ objects unless they are absolutely necessary. A first approach to avoid the\
    \ global scope pollution and organizing our code is to use namespaces. A namespace\
    \ is a collection of names used to identify objects in a given context. The purpose\
    \ of namespaces is to avoid confusion and collisions with objects having the same\
    \ names in another context, providing a way to group names together.\n\nMany programming\
    \ languages support namespaces in order to organize blocks of functionality in\
    \ our application into easily manageable groups that can be uniquely identified.\
    \ JavaScript has no built-in support for namespaces, but we can use objects and\
    \ closures to create similar structures."
  merge: -1
  pgno: 206
- img_proc: false
  md: "# Namespaces as object literals\n\nA first and simple way to emulate namespace\
    \ in JavaScript is using object literal like the one we shows here:\n\n```\nvar\
    \ myApplication = {\n  version: \"1.0\",\n  name: \"My Application\",\n  config:\
    \ {..},\n  init: function() {...}\n};\n```\n\nIn this example, we can see a variable\
    \ declaration which is assigned to an object literal describing an application.\
    \ The use of object literals as namespaces has the advantage of reducing the pollution\
    \ of the global scope and helps to organize code and variables logically. We example:\n\
    \n```\nconsole.log(myApplication.name); //My Application\nmyApplication.init();\n\
    ```\n\nIt's possible to span a single namespace across multiple files. If data\
    \ is well structured, this can help the reader to easily navigate the code. In\
    \ this case, it is important to check if the variable to which the namespace is\
    \ assigned already exists before defining it, as in the following example:\n\n\
    ```\nvar myApplication = myApplication || {};nmyApplication = {\n  version: \"\
    1.0\",\n  name: \"My Application\",\n  config: {..},\n  init: function() {..}\n\
    };\n```\n\nNamespaces can have a hierarchical structure. We can define nested\
    \ namespaces very easily as follows:\n\n```\nvar myApplication = {\n  version:\
    \ \"1.0\",\n  name: \"My Application\",\n  config: {\n    ui: {\n      backgroundColor:\
    \ \"green\",\n      fontSize: 12\n    },\n    localization: {\n      language:\
    \ \"english\",\n      dateFormat: \"MM-dd-yyyy\"\n    }\n  }\n};\n```"
