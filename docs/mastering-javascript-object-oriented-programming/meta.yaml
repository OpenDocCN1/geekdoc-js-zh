    \ depend upon abstractions.\n\nThis is the Dependency Inversion Principle, and\
    \ it consists of two recommendations. The first one concerns the classic layered\
    \ architecture of an application, where in general the components of the high\
    \ level are strictly dependent on the components at the low level. A possible\
    \ modification to a low-level component may require a change to one or more high-level\
    \ components. The first recommendation suggests to reverse this dependency, changing\
    \ it toward an intermediate abstraction, such as an interface. So, a low-level\
    \ component must implement an interface used by the components of the higher level.\n\
    \nThe second recommendation says to make sure that the implementation details\
    \ do not affect an abstraction. An abstraction, such as an interface, must describe\
    \ a behavior and implementation details must follow the behavior defined by abstraction.\
    \ In other words, if implementation can change without affecting the referred\
    \ abstraction. For example, we defined an abstraction to access a persistence\
    \ system, the implementation must comply with the abstraction, but its internal\
    \ implementation can change at will.\n\nLet's try to explain this principle with\
