  md: "# Diving into OOP Principles\n\nComposition is a strong type of Aggregation,\
    \ where each component object has no\nindependent life without its owner, the\
    \ aggregate. Consider the following example:\n\n```\nvar person = {name: \"John\"\
    ,\n  surname: \"Smith\",\n  address: {\n    street: \"123 Duncannon Street\",\n\
    \    city: \"London\",\n    country: \"United Kingdom\"\n  }};\n```\n\nThis code\
    \ defines a person with his address represented as an object. The address property\n\
    is strictly bound to the person object. Its life is dependent on the life of the\
    \ person and it\ncannot have an independent life without the person. If the person\
    \ object is deleted, also the\naddress object is deleted.\n\nIn this case, the\
    \ strict relation between the person and their address is expressed in\nJavaScript\
    \ assigning directly the literal representing the address to the address property.\n\
    \n# OOP principles support\n\nThe second requirement allows us to consider JavaScript\
    \ as an Object-Oriented\nlanguage involves the support of at least three principles-encapsulation,\
    \ inheritance, and\npolymorphism. Let analyze how JavaScript supports each of\
    \ these principles.\n\n# Encapsulation\n\nObjects are central to the Object-Oriented\
    \ Programming model, and they represent the\ntypical expression of encapsulation,\
    \ that is, the ability to concentrate in one entity both data\n(properties) and\
    \ functions (methods), hiding the internal details.\n\nIn other words, the encapsulation\
    \ principle allows an object to expose just what is needed to\nit use, hiding\
    \ the complexity of its implementation. This is a very powerful, often\nfound\
    \ in the real world that allows us to use an object without knowing how it internally\n\
    works. For instance how we drive cars. We need just to know how to speed up,\n\
    rake, and change direction. We do not need to know how the car works in detail,\
    \ how its\nmotor burns fuel or transmits movement to the wheels."
