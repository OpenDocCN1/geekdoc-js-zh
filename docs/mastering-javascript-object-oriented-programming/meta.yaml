  md: "# Inheriting and Creating Mixins\n\nThe Object.create() method was proposed\
    \ by Douglas Crockford as a true functional alternative to using the new keyword\
    \ and constructors, considered by him as not coherent with the nature of JavaScript.\n\
    \nWe can create an object without a prototype in the following way:\n\n```\nvar\
    \ myObject = Object.create(null);\n```\n\nIn this case, the myObject variable\
    \ will contain an object without a prototype. It will not inherit the empty object\
    \ features, so it will not have toString() and other standard methods we have\
    \ seen earlier. If we try to check what the prototype of the object is, we will\
    \ obtain the following:\n\n```\nconsole.log(Object.getPrototypeOf(myObject));\
    \ //result: null\n```\n\nThe prototype of the object is null. The value we passed\
    \ to the Object.create() method. In order to create an object whose prototype\
    \ is another object we can specify it by the argument of Object.create(), as shown\
    \ below:\n\n```\nvar person = { name: \"John\", surname: \"Smith\" };\n```\n\n\
    ```\nvar myObject = Object.create(person);\n```\n\nNow myObject will have the\
    \ person object as its prototype.\n\nWhen creating an object with the Object.create()\
    \ method, we can specify new properties for the new object. These properties can\
    \ be specified as the optional parameter of the Object.create() method, as shown\
    \ in the following example:\n\n```\nvar person = { name: \"\", surname: \"\" };\n\
    var developer = Object.create(\n  person,\n  {\n    knownLanguage: {\n      writable:\
    \ true,\n      configurable: true\n    }\n  }\n);\n```\n\nHere, we added the knownLanguage\
    \ property to the developer object by specifying a property descriptor. As a result,\
    \ the developer object will have the properties inherited from its prototype object\
    \ and the new property defined at the creation stage."
