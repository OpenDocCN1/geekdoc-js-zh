  md: '# 8 Data Binding


    Data binding is one of the most appealing features in any programming environment.
    The capability to automatically update the property of an object bound to one
    another has a powerful charm, and many JavaScript frameworks and libraries support
    these features in different ways. In this chapter, we will discuss what data binding
    is and will describe some approaches to implement it in JavaScript applications
    without using any frameworks. The following topics will be discussed:


    +   * Introduction to data binding

    * Basic data binding implementation

    * Observer and publish/subscribe patterns

    * Using proxies for data binding implementation


    # What is data binding?


    In general terms, data binding is a way to bind data to one or more objects ensuring
    synchronization. For example, associating a model to a view or simply assigning
    the value of an object''s property to another object''s property by granting synchronization
    are forms of data binding. Usually, data binding is related to the mapping between
    a model and a user interface, but in general it may concern any synchronized mapping
    between objects.'
  merge: -1
  pgno: 161
- img_proc: false
  md: '# Data binding elements


    In order to establish a data binding relationship between two objects, we need
    to define the

    following elements:


    +   - Data source object: This is the object that represents the data to be bound,
    for

    example, the Model in an MV* context

    - Data source property: This is the property of the data source object that actually

    contains the data we want to bind

    - Data target object: This is the object we want associate the data to, typically
    the

    View in an MV* context

    - Data target property: This is the property of the data target object that actually
    is

    the recipient of the data to bind

    - Synchronization mechanism: This is the specific approach that allows us to

    assign the value of the data source property to the data target property and keeps

    the two properties updated


    The following diagram shows how the data binding elements are related each other:


    ![](bbox=[0.318, 0.467, 0.682, 0.858])'
  merge: -1
  pgno: 162
- img_proc: false
  md: 'It is important to point out that the synchronization mechanism must update
    the data target property when a change to the data source property occurs. This
    task is not a simple initial assignment of the two properties, but a constant
    alignment between the values of the two properties.


    # Data binding directions


    Besides the involved elements, an important feature in a data binding relationship
    is its direction, which is the data flow of a binding action. When we described
    the elements of the relationship, we implicitly set a direction from the data
    source property to the data target property. This means that the value of the
    data source property determines the value of the data target property, and any
    change on the data source property must be reflected on the Data Target Property,
    not conversely. This is usually called one-way data binding.


    One-way data binding can be useful, for example, when we want to display some
    data on the screen and when any changes on these data will be immediately updated
    on the screen.


    A special case of one-way data binding is when a change on the data target property
    updates the data source property. It is the opposite behavior described for one-way
    data binding. Actually, it is still one-way data binding, but the synchronization
    mechanism is reversed; a change on the data target property determines the new
    value of the data source property. We will call it reverse one-way data binding.


    A typical context where reverse one-way data binding occurs when we display the
    value of an object''s property in a text box. Usually in this context, we want
    that any changes on the textbox updates the object''s property.


    We can define a reverse relationship between the actors of a data binding relationship
    by swapping their roles. A data source object and its data source property become
    the data target object and data target property and vice versa. The two relationships
    are seen as one by calling it two-way data binding. In this context, the synchronization
    mechanism must grant that when the value of any property involved in the data
    binding relationship changes the other property must be updated consistently.'
