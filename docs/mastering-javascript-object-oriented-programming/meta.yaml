  md: "# Working with Encapsulation and Information Hiding\n\nUsing the methods exposed\
    \ by the object to manipulate the data, we take advantage of the encapsulation\
    \ principle ignoring its internal complexity and implementation details. In other\
    \ words, encapsulation hides the internal details regarding how the object manipulates\
    \ its data. This feature, called the information hiding principle, is often related\
    \ to encapsulation, although it is a more general principle. By hiding internal\
    \ details, we obtain at least two benefits:\n\n+   - We provide a simple way to\
    \ use an object, hiding the internal complexity\n- We decouple the internal implementation\
    \ from the use of the object, simplifying change management\n\nThe information\
    \ hiding principle forces the design of objects to have at least two parts: a\
    \ public part and a private one. Only the public part is accessible by clients\
    \ that want to operate with the object.\n\nMany-oriented languages, such as Java\
    \ and C#, provide specific keywords as public and private (access modifiers) to\
    \ allow developers to easily implement the Information hiding. JavaScript does\
    \ not include such keywords. All members in an object are public by default. However,\
    \ some common patterns can be used to obtain different levels of information hiding\
    \ as happens in most classical OOP languages.\n\n# Convention-based approach\n\
    \nJavaScript objects do not care about privacy. All the properties and methods\
    \ are publicly accessible if no caution is taken. So if we want to avoid access\
    \ to some properties or methods concerning internal implementation details, we\
    \ have to set up a strategy.\n\nA simple approach consists in adopting convention-based\
    \ naming for internal members of an object. For example, internal members can\
    \ have a name starting with a prefix, such as the underscore (_). Let us explain\
    \ with an example:\n\n```\nfunction TheatreSeats() {\n  this._seats = [];\n}\n\
    \nTheatreSeats.prototype.placePerson = function (person) {\n  this._seats.push(person);\n\
    };\n```"
