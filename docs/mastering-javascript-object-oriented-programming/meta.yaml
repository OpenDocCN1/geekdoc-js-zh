  md: "# A basic approach\n\nThe most simple approach to implement duck typing is\
    \ to check the presence of the required members directly in the method which needs\
    \ the contract compliance. Referring to our software house example, we can check\
    \ if the object passed as an argument to the hire() method has a named writeCode:\n\
    \n```\nclass SoftwareHouse {\n  constructor() {\n    this.employees = [];\n  }\n\
    \n  hire(dev) {\n    if (dev && dev[\"getCode\"] && dev[\"getCode\"] instanceof\
    \ Function) {\n      this.employees.push(dev);\n    } else {\n      throw new\
    \ Error(\"The argument do not implements writeCode method\");\n    }\n  }\n```\n\
    \nWe added the highlighted code checking whether a writeCode member exists and\
    \ if it is a function. If it is not true, an exception is raised. This approach\
    \ works but it tends to make the hire() method very verbose, especially if more\
    \ than one member has to be checked.\n\nIn a more readable and generic approach,\
    \ we can define a private function that checks if an object implements a specific\
    \ method:\n\n```\nvar SoftwareHouse = (function() {\n  function implement (obj,\
    \ method) {\n    return (obj && obj[method] && obj[method] instanceof Function);\n\
    \  }\n\n  return class {\n    constructor() {\n      this.employees = [];\n  \
    \  }\n\n  hire(dev) {\n    if (implement(dev, \"getCode\")) {\n      this.employees.push(dev);\n\
    \    } else {\n      throw new Error(\"The argument does not implement writeCode\
    \ method\");\n    }\n  }\n});\n```"
