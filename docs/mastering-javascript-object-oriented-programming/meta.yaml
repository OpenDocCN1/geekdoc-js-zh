    \ more simple approach is usually used to manage the situation—an option object.\
    \ Thanks to the dynamic nature of JavaScript objects, we can create a literal\
    \ with the only options we want to pass to the constructor, as shown here:\n\n\
    ```\nvar pizza = new Pizza(size: 10, cheese: true, bacon: true);\n```\n\nThe constructor\
    \ function will just apply the properties of the objects leaving the other properties\
    \ to their default value:\n\n```\nfunction Pizza(options) {\n  this.size = options.size\
    \ || 5;\n  this.cheese = options.cheese || false;\n  this.tomato = options.tomato\
    \ || false;\n  this.bacon = options.bacon || false;\n}\n```\n\n# Comparing factory\
    \ and builder patterns\n\nThe factory pattern and the builder pattern have a similar\
    \ goal and may be confused if they are not properly understood. Both patterns\
    \ allow to create objects, but each one has its own peculiarity and scope of application.\n\
    \nIn particular, the factory pattern focuses on object creation on the basis of\
    \ a category or other ways to group objects. When a client asks an object to a\
    \ factory, it specifies the category of object it needs. However, all objects\
    \ created by the factory implement the same interface or inherit from the same\
    \ object so that the client can manage them in the same way without actually knowing\
    \ its real type."
