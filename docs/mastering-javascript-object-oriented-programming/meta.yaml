  md: '# Inheriting and Creating Mixins


    We have not defined the toString() method; however, any object created using literal
    notation or a constructor function will have attached this method and others inherited
    from the empty object. Moreover, if we created an object using the literal notation,
    it also has a constructor associated. We can verify this using the inherited constructor


    ```

    person.constructor.name;           //result: "Object"

    ```


    We can also check that our object is an instance of the Object constructor using
    the instanceof operator:


    ```

    console.log(person instanceof Object); //result: true

    ```


    All these tools confirm the ways we know until now to create objects from scratch,
    but create objects derived from an empty instance of the Object() constructor.


    In JavaScript terminology, we say that the empty object is the prototype of all
    objects.


    # What is a prototype?


    A prototype is an object that acts as a template for another object. We have no
    classes in JavaScript, so features are shared between objects through other objects
    taken as reference. In other words, if we need an object that is similar to an
    existing object A we create a new object B saying that its prototype is the existing
    object A. This is the basic mechanism of JavaScript''s inheritance.


    All objects in JavaScript have a prototype, including functions. When we create
    an object using the literal notation, the prototype of the new object is the empty
    {}. When we create an object using a constructor function, the prototype of the
    new object is the prototype of the constructor function.


    We can access the prototype of an object in two ways.


    The first way is using the prototype property of its constructor. For example,
    if we have an object created using the Person() constructor, we can put the prototype
    of the object in a variable as follows:


    ```

    var prototypeOfPerson = person.constructor.prototype;

    ```


    This approach is also valid for objects created with the literal notation, since
    they have a constructor function as well, the Object() constructor.'
