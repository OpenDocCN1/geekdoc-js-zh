  md: "# Inheriting and Creating Mixins\n\nWhat is multiple inheritance? It is the\
    \ ability to inherit features from more than one object or class at the same time.\
    \ Suppose, for example, that we have two constructors or classes: Developer and\
    \ Student. We want to be able to create objects that represent developers who\
    \ study, that is, objects inherits features from both Developer and Student. Multiple\
    \ inheritance allows us to compose features deriving from more than one object\
    \ or class into a new type of object. Let's explain how to implement it in JavaScript.\n\
    \nWe start from our Developer() and Student() constructors, as shown by the following\
    \ code:\n\n```\nfunction Developer(name, surname, knownLanguage) {\n  Person.apply(this,\
    \ arguments);\n  this.knownLanguage = knownLanguage;\n\nfunction Student(name,\
    \ surname, subjectOfStudy) {\n  Person.apply(this, arguments);\n  this.subjectOfStudy\
    \ = subjectOfStudy;\n}\n```\n\nBoth constructors inherit from the Person() constructor\
    \ in previous pages, but it is not relevant to our reasoning. The following constructor\
    \ function will create objects that share features from Developer and Student\
    \ objects:\n\n```\nfunction DevStudent(name, surname, knownLanguage, subjectOfStudy)\
    \ {\n  Developer.call(this, name, surname, knownLanguage);\n  Student.call(this,\
    \ name, surname, subjectOfStudy);\n}\n```\n\nWe have newly invoked constructors\
    \ we inherit using the call() method. This allows us to get objects that have\
    \ name, surname, knownLanguage, and subjectOfStudy properties, as shown here:\n\
    \n```\nvar johnSmith = new DevStudent(\"John\", \"Smith\", \"C#\", \"JavaScript\"\
    );\nnconsole.log(johnSmith.knownLanguage); //result: C#\nconsole.log(johnSmith.subjectOfStudy);\
    \ //result: JavaScript\n```"
