  md: "# Data Binding\n\nThe Binder() constructor defines the bindTo() method that\
    \ takes the four actors of the data binding context, creates the specified property\
    \ of the data source object, and binds it to the specified data target property.\
    \ In this way, it defines a reverse one-way data binding relationship between\
    \ the data source object and the data target object.\n\nWith this approach, we\
    \ brought the code creating the data binding relationship out of the definition\
    \ of the data source object. So, we can define the relationship using the bindTo()\
    \ method:\n\n```\nvar person = new Person(\"John\", \"Smith\");\nvar txtName =\
    \ document.getElementById(\"txtName\");\nvar txtSurname = document.getElementById(\"\
    txtSurname\");\nvar btnSave = document.getElementById(\"btnSave\");\nvar binder\
    \ = new Binder();\n\nbinder.bindTo(person, \"name\", txtName, \"value\");\nbinder.bindTo(person,\
    \ \"surname\", txtSurname, \"value\");\n```\n\nWhen a change occurs in the txtName\
    \ or txtSurname textboxes, the new value will be assigned to the bound properties.\
    \ Analyzing the property definition inside the bindTo() method, we can see that\
    \ there is not an actual assignment. We defined it so that any attempt to read\
    \ its value returns the value of target property. Anyway, the effect is the same\
    \ as that of an actual assignment.\n\nWe also notice that the property has been\
    \ defined as read-only, since there is no setter. It should not be so strange,\
    \ the data binding direction we defined is reverse one-way. If we allow to change\
    \ the data source property, we risk to get inconsistent situations, where the\
    \ data source property has a value different from the data target property.\n\n\
    It is not difficult to add a method to the Binder() constructor so we can define\
    \ a two-way data binding relationship. The following is such an example:\n\n```\n\
    Binder.prototype.bindTwoWay =\nfunction(dataSource, dataSourceProperty, dataTargetObj,\n\
    dataTargetProperty) {\n  Object.defineProperty(dataTargetObj, dataSourceProperty,\n\
    \    get: function() { return dataTargetObj[dataTargetProperty]; },\n    set:\
    \ function(newValue) {dataTargetObj[dataTargetProperty] = newValue; }\n};\n```"
