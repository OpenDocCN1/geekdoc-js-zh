    \ as we can see in the following example:\n\n```\nvar declaration = \"var x =\
    \ 123\";\n\nfunction evaluate(code) {\n  window.eval(code);\n  return x;\n}\n\n\
    console.log(evaluate(declaration)); //result: 123\nconsole.log(x);           \
