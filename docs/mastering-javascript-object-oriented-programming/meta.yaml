  md: "# Diving into OOP Principles\n\nIn this case, the encapsulation principle has\
    \ not been completely implemented. A general approach to prevent direct access\
    \ to relevant properties is to replace them with methods. For example, we can\
    \ redefine our company object as the following:\n\n```\nfunction Company (name)\
    \ {\n  var employees = [];\n\n  this.name = name;\n\n  this.getEmployees = function()\
    \ {\n    return employees;\n  };\n  this.addEmployee = function(employee) {\n\
    \    employees.push(employee);\n  };\n  this.sortEmployeesByName = function()\
    \ {\n  };\n}\n\nvar company = new Company(\"ACME Inc.\");\n```\n\nWith this approach,\
    \ we cannot access directly the employees property, but we need to use the getEmployees()\
    \ to obtain the list of employees of the company and addEmployee() to add an employee\
    \ to the list. This guarantees that the internal state remains hidden and consistent.\
    \ The way we created methods for the Company() constructor is not the best one.\
    \ We will see why and how to use a better approach in Chapter 3, Working with\
    \ Encapsulation and Information Hiding.\n\nThis is just one possible approach\
    \ to enforce encapsulation by protecting the internal state of an object. This\
