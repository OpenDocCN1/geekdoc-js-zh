  md: '# The server role


    While in traditional web applications, the transition from one screen to another
    triggered the loading of a new HTML page from the server. In an SPA the server
    has no role in determining the screen transition. The client composes application
    views out of HTML templates and data, both of which it requests asynchronously
    as it needs them.


    So, in the SPA model the server has no UI logic nor maintains any UI state. The
    role of the server can be a portion in providing resources to the client, starting
    with the initial HTML for the single web page containing the entire application.
    The other resources are obtained in response to Ajax requests for data, represented
    usually by JSON data; but, they can be of different type such as HTML or even
    JavaScript code. The following picture describes the interactions between the
    client and the server:


    ![](bbox=[0.296, 0.375, 0.703, 0.603])


    # View composition


    A Single Page Application is fully loaded in the initial page load and then dynamically
    updated with new HTML fragments composed by the client upon data loaded from the
    server. These fragments, usually called Views, make up what users commonly call
    screens or pages. A View can be a portion of the HTML page, such as a div or the
    entire screen. When a View occupies the entire screen, we call that a page to
    reflect the fact that it completely draws the user''s attention, but technically
    it is just another view composed by the client.'
  merge: -1
  pgno: 261
- img_proc: false
  md: 'We typically have many views in a SPA, and the resources needed to compose
    them are incrementally loaded from the server on demand. Since updating Views
    occurs asynchronously without reloading the entire page, Single Page Applications
    are more responsive and reduce network traffic to optimize its latency.


    # Navigation and routing


    All modern SPA frameworks support the concept of routing. Routing is the ability
    to map URLs to Views so that users navigate within the application''s UI. Usually,
    it is implemented through a service called router. The main task of a router is
    to define how a URL is mapped to a View and to perform the transition between
    Views in response to a click on some menu item or any action. If the user has
    not seen the requested View before, the application may make an HTTP request to
    the server in retrieve the resources and dynamically compose the View. Instead,
    if the View has already been viewed at least once, the browser may have cached
    it and the router will be smart enough not to make the HTTP request to the server.
    This approach helps to reduce round-tripping to and from a server and improve
    perceived performance.


    # The remote data


    A Single Page Application requests data over HTTP from a server. Usually, we think
    of data as structured information such as a list of values. From a Single Page
    Application point of view, data can be different kinds of information: JSON, HTML,
    or any other resource that the application requires, even JavaScript code. In
    fact, an SPA can be designed so that its first load into the browser does not
    contain the entire application, but just the minimum code required to start properly.
    The rest of the code is dynamically loaded on demand during the user''s navigation.
    Usually, JavaScript code is organized in modules loaded asynchronously using an
    AMD loader.


    In other words, the data that a SPA requires is anything the application needs
    from the server in order to build its Views. So, maybe the term data is not so
    appropriate, and we should instead use the term resource.'
  merge: -1
  pgno: 262
- img_proc: false
  md: '# The Zakas/Osmani architecture


    Although the Single Page Application architecture is responsive and efficient
    should rely, it does not say exactly how to organize our code or how to interact
    with the components that make up a complex application. We can say that the architecture
    of a SPA mainly proposes a model of interaction between client and server and
    suggests how to update the user interface, without saying how to organize the
    application''s code.


    An interesting for large JavaScript applications is the one proposed by Nicholas
    C. Zakas and Addy Osmani. In contrast to the SPA, the main architectural goal
    of Zakas and Osmani is to organize the code so that the resulting application
    is easily maintainable and scalable. The architectural focus is mainly on the
    basis of SOLID principles we examined in Chapter 11, SOLID Principles. However,
    it is not in opposition to Single Page Applications, but it is neutral with respect
    to the navigation model and interaction with the server. Therefore, the Zakas/Osmani
    architecture can be adopted both for SPA and for traditional multipage applications.
    Indeed, we can say that this architecture can be considered valid also for languages
    other than JavaScript, and for contexts different from the web.


    > revisited by Osmani. Their work can be found at the following URLs:


    http://www.slideshare.net/nzakas/scalable-javascript-application-architecture


    https://addysmani.com/largescalejavascript/


    Let''s see in detail what''s on this architecture.'
  merge: -1
