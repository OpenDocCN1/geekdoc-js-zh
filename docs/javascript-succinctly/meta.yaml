    \ */\n</script></body></html>\n```\n\n请注意，链在 Object.prototype 处停止了。我们查找 `foo`\
    \ 的最后一个地方是 Object.prototype。\n\n# 注意事项\n\n小心！向 Object.prototype 添加的任何内容都会出现在 `for...in`\
    \ 循环中。\n\n# 原型链返回它在原型链中找到的第一个匹配属性\n\n就像作用域链一样，原型链在链查找过程中将使用它找到的第一个值。\n\n修改之前的代码示例，如果我们向\
    \ `Object.prototype` 和 `Array.prototype` 对象添加了该值，然后尝试在数组实例上访问该值，返回的值将将来自 `Array.prototype`\
    \ 对象。\n\n# 示例: sample124.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  Object.prototype.foo = 'object-foo';\n  Array.prototype.foo = 'array-foo';\n\
    \  var myArray = [];\n\n  console.log(myArray.foo); // 输出 'array-foo$，在 Array.prototype.foo\
    \ 找到\n\n  myArray.foo = 'bar';\n\n  console.log(myArray.foo) // 输出 'bar$，在 Array.prototype\
    \ 找到\n</script></body></html>\n```\n\n在这个示例中，`Array.prototype.foo` 处的 foo 值遮蔽（masking）了在\
    \ `Object.prototype.foo` 找到的 foo 值。只需记住，当链中找到属性时查找就会结束，即使在链的更上使用了相同的属性名。\n\n#\
    \ 用新对象替换原型属性会移除默认的构造函数属性\n\n可以使用新值替换默认的 `prototype` 属性。然而，这样做将消除“预制”原型对象中的默认构造函数\
    \ 属性——除非你手动指定它。\n\n在接下来的代码中，我们创建了一个 `Foo` 构造函数，用一个新空对象替换 `prototype` 属性，并验证 `constructor`\
    \ 属性已损坏（它现在引用了性较小的 Object 原型）。\n\n示例: sample125.html\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar Foo = function() { };\n\nFoo.prototype = {};\
