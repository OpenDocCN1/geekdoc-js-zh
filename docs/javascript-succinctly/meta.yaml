  md: "opposed to the function itself (exceptions include using the new keyword or\
    \ call() and apply()).\n\n# Notes\n\nThe keyword this looks and acts like any\
    \ other variable, except you can't modify it.\n\nAs opposed to arguments and any\
    \ parameters sent to the function, this is a keyword (not a property) in the call/activation\
    \ object.\n\n# How is the value of this determined?\n\nThe value of this, passed\
    \ to all functions, is based on the context in which the function is called at\
    \ run. Pay attention here, because this is one of those you just need to memorize.\n\
    \nThe myObject object in the following code is given a property sayFoo, which\
    \ points to the sayFoo function. When the sayFoo is called from the global scope,\
    \ this refers to the window object. When it is called as a method of myObject,\
    \ this refers to myObject.\n\nSince myObject has a property named foo, that property\
    \ is used.\n\nSample: sample101.html\n\n```\n<DOCTYPE html lang=\"en\"><body><script>\n\
    var foo = 'foo';\nvar myObject = { foo: 'I am myObject.foo' };\n\nvar sayFoo =\
    \ function () {\n  console.log(this['foo']);\n};\n\n// Give myObject a sayFoo\
    \ property and have it point to the sayFoo\nmyObject.sayFoo = sayFoo;\n\nmyObject.sayFoo();\
    \ // Logs 'I am myObject.foo'.\nsayFoo(); // Logs 'foo'.\n\n</script></html>\n\
    ```\n\nClearly, the value of this is based on the context in which the function\
    \ is being called. Consider both myObject.sayFoo and sayFoo point to the same\
    \ function. However, depending upon (i.e. the context) sayFoo() is called, the\
    \ value of this is different.\n\nIf it helps, the code is the same code with the\
    \ head object (i.e. window) explicitly used.\n\nSample: sample101.html\n\n```\n\
    <DOCTYPE html lang=\"en\"><body><script>\n```"
