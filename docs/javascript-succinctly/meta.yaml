    \n## 复杂对象具有动态属性\n\n指向现有复杂对象的新变量不会复制该对象。这就是为什么复杂对象有时被称为引用对象。一个复杂对象可以拥有你想要数量的引用，即使在对象被更改时，它们也始终指向同一个对象。\n\
    \n示例：sample20.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
