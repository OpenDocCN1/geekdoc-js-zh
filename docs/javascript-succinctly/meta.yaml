    # Replacing the prototype property with a new object does not update former instances


    You might think that you can replace the prototype property entirely at any time
    and all instances will be updated, but this is not correct. When you create an
    instance, that instance will be tied to the prototype that was minted at the time
    of instantiation. Providing a new object as the prototype property does not update
    the connection between instances already created and the new prototype.


    But remember, as I stated, you can update or add to the originally created object
    and those values remain connected to the first instance(s).


