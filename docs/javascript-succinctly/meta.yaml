  md: "# Sample: sample97.html\n\n```\n<DOCTYPE html><html lang=\"en\"><body><script>\n\
    var countDown = function countDownFrom(num) {\n  console.log(num);\n  num--; //\
    \ Change the parameter value.\n  if (num < 0) { return false; } // If num < 0\
    \ return function with no recursion.\n  // Could have also done arguments.callee(num)\
    \ if it was an anonymous function;\n  countDownFrom(num);\n}\ncountDownFrom(5);\
    \ // Kick off the function, which logs separately 5, 4, 3, 2, 1, 0.\n</script>\n\
    ```\n\nYou should be aware that it's natural for a function to invoke itself (aka\
    \ recursion) or to do so repetitively."
