  md: 'One tricky thing about constructor functions is the use of the this value inside
    the function. Remember, a constructor function is a cookie cutter. When used with
    the new keyword, it will create an object with properties and values defined inside
    the constructor function. When new is used, the this literally means the new object
    or instance that will be created on the statements inside the constructor. On
    the other hand, if you create a constructor and call it without the use of the
