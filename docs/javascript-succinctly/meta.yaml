    , \"orange\", \"red\"]\n\n  // Array literal notation.\n  var myArray2 = ['blue',\
    \ 'green', 'orange', 'red'];\n  console.log(myArray2); // logs [\"blue\", \"green\"\
    , \"orange\", \"red\"]\n</script></body></html>\n```\n\nIt is common to create\
    \ an array defined using the literal syntax, but it should be noted that this\
    \ shortcut is merely concealing the use of the Array() constructor.\n\n# Notes\n\
    \nIn practice, the array is typically all you will ever need.\n\nRegardless of\
    \ how an array is defined, if you do not provide any predefined values to the\
    \ array, it will still be created but will simply contain no values.\n\n# Adding\
    \ and updating values in arrays\n\nA value can be added to an array at any index,\
    \ at any time. In the sample that follows, we add a value to the numeric index\
    \ 50 of an array. What about all the indices before 50? Well, like I said, you\
    \ can add a value to any index, at any time. But if you add a value to"
