    # # Chapter 16 Math Function


    # ## Conceptual overview of the built-in Math object


    The Math object contains static properties and methods for mathematically dealing
    with numbers or providing mathematical constants (e.g., Math.PI). This object
    is built into JavaScript, as opposed to being based on a Math() constructor that
    creates math instances.


    Notes


    It might seem odd that Math starts with a capitalized letter since you do not
    instantiate an instance of a Math object. Do not be thrown off by this. Simply
    be aware that JavaScript sets this object for you.


    # ## Math properties and methods


    The Math has the following properties and methods:


    Properties (e.g., Math.PI);


    +   * E

    * LN2

    * LN10

    * LOG2E

    * LOG10E

    * PI

    * SQRT1

    * SQRT2


    Methods (e.g., Math.random());


    +   * abs()

    * acos()

    * asin()

    * atan()

    * atan2()

    * ceil()

    * cos()

    * exp()

