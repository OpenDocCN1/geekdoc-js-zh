    \ // Logs 'object', not exactly helpful.\n  console.log(myObject === null); //\
    \ Logs true, only for a real null value.\n</script></body></html>\n```\n\n## Notes\n\
    \nWhen verifying a null value, always use === == does not distinguish between\
