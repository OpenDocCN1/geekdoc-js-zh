  md: "# Chapter 14 Function Prototype Property\n\nConceptual overview of the prototype\
    \ chain\nThe prototype property is an object created by JavaScript for every Function()\
    \ instance. It links object instances created with the new keyword back to the\
    \ constructor function created them. This is done so that instances can share,\
    \ or inherit, methods and properties. Importantly, the search occurs during property\
    \ lookup. Remember from Chapter 1 every time you look up or access a property\
    \ on an object, the property will be searched for on the object as well as the\
    \ prototype chain.\n\nNotes\nA prototype object is created for every function,\
    \ regardless of whether you intend to use that function as a constructor.\n\n\
    In the following code, I will construct an array from the Array() constructor,\
    \ and then I invoke the join() method.\n\nSample: sampleprototype118.html\n\n\
    ```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  var myArray = new Array('foo',\
    \ 'bar');\n\n  console.log(myArray.join()); // Logs 'foo,bar'\n\n</script></body></html>\n\
    ```\n\nThe join() method is not defined as a property of the myArray object instance,\
    \ but somehow we have access to join() as if it were. This method is defined somewhere,\
    \ but where? Well, it is defined as a property of the Array() constructor's prototype\
    \ property. Since join() is not found within the array object instance, JavaScript\
    \ looks up the prototype chain for a method join().\n\nOk, why are things done\
    \ this way? Really, it is about efficiency and reuse. Why every array instance\
    \ created from the array constructor have a uniquely defined join() method when\
    \ join() always functions the same way? It makes more sense for all arrays to\
    \ leverage the same join() function without having to create a new instance of\
    \ the function for each array.\n\nThis efficiency we speak of is all possible\
    \ because of the prototype property, prototype linkage, and the prototype lookup\
    \ chain. In this chapter, we break down these often confusing attributes of prototypal\
    \ inheritance. But truth told, you would be better off by simply memorizing the\
    \ mechanics of how the chain hierarchy actually works. Refer back to Chapter 1\
    \ if you need a refresher on how property values are resolved."
  merge: -1
  pgno: 107
