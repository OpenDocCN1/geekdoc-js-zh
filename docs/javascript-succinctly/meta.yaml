    \ = window;\nwindowRef2 = this;\n\nconsole.log(windowRef1, windowRef2); // Logs\
    \ reference to window object.\n\nconsole.log(windowRef1.foo, windowRef2.foo);\
    \ // Logs 'bar', 'bar'.\n\n</script></body></html>\n```\n\nIn this example, we\
    \ explicitly store a reference to the head object in two variables that are then\
    \ used to gain access to the global foo variable."
- md: "\n## The head object is implied and typically not referenced explicitly\n\n\
    Typically a reference to the head object is not used because it is implied. For\
    \ example, in the browser environment window.alert and alert() are essentially\
    \ the same statement. JavaScript fills in the blanks. Because the window object\
    \ (i.e. the head object) is the last object created in the scope chain for a value,\
    \ the window object is essentially always implied. In the next example, we leverage\
    \ the alert() function which is contained in the global scope.\n\nSample: sample68.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = { // window\
    \ is implied here, window.foo\nwindow.fooMethod: function () {\n  alert('foo'\
    \ + 'bar'); // window is implied here, window.alert\n  window.alert('foo' + 'bar');\
    \ // window is explicitly used, with the same effect.\n}\nnfoo.fooMethod(); //\
    \ window is implied here, window.foo.fooMethod()\n</script></body></html>\n```\n\
    \nMake sure you understand that the head object is implied even when you don't\
    \ include it, because the head object is the last stop in the scope chain.\n\n\
    ## Notes\n\nBeing explicit (e.g., window.alert() vs. alert()) costs a little bit\
    \ more with regard to performance (how fast the code runs). It's faster if you\
    \ rely on the scope chain alone and avoid explicitly referencing the head object\
    \ even when you know the property you want is contained in the global scope.\n\
    \n## Chapter 10 Object()\n\n### Conceptual overview of Object() objects\n\nUsing\
    \ the built-in Object() constructor function can create generic empty objects\
    \ on the fly. In fact, if you remember back to the beginning of Chapter 1, this\
    \ is exactly what we did by creating the cody object. Let's recreate the cody\
    \ object.\n\nSample: sample69.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  var cody = new Object(); // Create an empty object with no properties.\n\n\
    \  for (key in cody) { // Confirm that cody is an empty generic object.\n    if\
    \ (cody.hasOwnProperty(key)) {\n      console.log(key); // Should not see any\
    \ logs, because cody itself has no properties.\n    }\n  }\n</script></body></html>\n\
    ```\n\nHere, all we are using the Object() constructor function to create a generic\
    \ called cody. You can think of the Object() constructor as a cookie cutter for\
    \ creating empty objects that have no predefined properties or methods (except,\
    \ of course, those inherited from the prototype chain).\n\n## Notes\n\nIf it's\
    \ not obvious, the Object() constructor is an object itself. That is, the constructor\
    \ function is based on an object created from the Array constructor, the Object\
    \ constructor simply spits out blank objects. And yes, you can create all the\
    \ objects you like. However, creating an empty object like cody is very different\
    \ from creating your own constructor function with predefined properties. Make\
    \ sure you understand that cody is just an empty object based on the Object()\
    \ constructor. To fully harness the power of JavaScript, you will need to learn\
    \ not only how to create empty objects from Object(), but also how to build your\
    \ own \"class\" of objects (e.g., Person()) like the Object() constructor itself.\n\
    \n## Object() parameters\n\nThe Object() constructor function takes one optional\
    \ parameter. That parameter is the value you would like to create. If you provide\
    \ no parameter, then a null or undefined value will be assumed.\n\n## Sample:\
    \ sample70.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n//\
    \ Create an empty object with no properties.\n  var cody1 = new Object();\n  var\
    \ cody2 = new Object(undefined);\n  var cody3 = new Object(null);\n\n  console.log(typeof\
    \ cody1, typeof cody2, typeof cody3); // Logs 'object object'.\n\n</script></body>\n\
    ```\n\nIf a value null or undefined is passed to the Object constructor, the value\
    \ passed will be created as an. So theoretically, we can use the Object constructor\
    \ to create any of the other objects that have a constructor. In the next example,\
    \ I do just that.\n\n## Sample: sample71.html\n\n```\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\n\n/* Use the Object() constructor to create string, number,\
    \ array,\nfunction, Boolean, and regex objects. */\n\n// The following logs confirm\
    \ object creation.\nconsole.log(new Object('foo'));\nconsole.log(new Object(1));\n\
    console.log(new Object([]));\nconsole.log(new Object(function () { }));\nconsole.log(new\
    \ Object(true));\nconsole.log(new Object(/\\[a-z]+\\/b));\n\n/* Creating string,\
    \ number, array, function, Boolean, and regex\ninstances via the Object() constructor\
    \ is really never done. I am just\ndemonstrating that it can be done. */\n\n</script></body>\n\
    ```\n\n## Object() properties and methods\n\nThe Object() object has the following\
    \ properties (not including inherited properties and methods):\n\nProperties (e.g.,\
    \ Object.prototype);\n\n- prototype\n\n## Object() object instance properties\
    \ and methods\n\nObject() object instances have the following properties and methods\
    \ (does not include inherited properties and methods):\n\nInstance Properties\
    \ (e.g., var myFunction = {}; myObject.constructor);\n\n- constructor\n\nInstance\
    \ Methods (e.g., var myObject = {}; myObject.toString());\n\n- hasOwnProperty()\n\
    - isPrototypeOf()\n- propertyIsEnumerable()\n- toLocaleString()\n- toString()\n\
    - valueOf()\n\nNotes\nThe prototype chain ends with Object.prototype, and thus\
    \ all of the properties and methods of Object() are inherited by all JavaScript\
    \ objects.\n\n## Creating Object() objects using \"object literals\"\n\nCreating\
    \ an \"object literal\" instantiating an object with or without properties using\
    \ braces (e.g., var cody = {}); Remember at the beginning of Chapter 1 when we\
    \ created the one-cody object and give the cody object properties using dot notation?\
    \ Let's do that again.\n\nSample: sample72.html\n\n```\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\n  var cody = new Object();\n  cody.living = true;\n  cody.age\
    \ = 33;\n  cody.gender = 'male';\n  cody.get = function () { return cody.gender;\
    \ };\n\n  console.log(cody); // Logs cody object and properties.\n</script></body></html>\n\
    ```\n\nNotice in the code that creating the cody object and its properties took\
    \ five statements. Using the object literal notation we can express the same cody\
    \ object in one statement.\n\n## Sample: sample73.html\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar cody = {\n  living: true,\n  age: 23,\n  gender:\
    \ 'male',\n  getGender: function () { return cody.gender; }\n};\n// Notice the\
    \ last property has no comma after it.\n\nconsole.log(cody); // Logs the cody\
    \ object and properties.\n\n</script>\n</body>\n```\n\nUsing literal notation\
    \ gives us the ability to create objects, including defined properties, with less\
    \ code and wisely encapsulate the data. Notice the use of : and , operators in\
    \ a single statement. This is the preferred syntax for creating objects in JavaScript\
    \ because of its terseness and readability.\n\nYou should be aware that property\
    \ names can be specified as strings:\n\n## Sample: sample74.html\n\n```\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\nvar cody = {\n  'living': true,\n  'age':\
    \ 23,\n  'gender': 'male',\n  getGender: function () { return cody.gender; }\n\
    };\n\nconsole.log(cody); // Logs the cody object and properties.\n\n</script>\n\
    </body>\n```\n\nIt's not necessary to specify properties as strings unless the\
    \ property name is:\n\n- Is one of the reserved keywords (e.g., class).\n- Contains\
    \ spaces or special characters (anything other than numbers, letters, the dollar\
    \ sign ($), or the underscore (_) character).\n- Starts with a number.\n\n## Notes\n\
    \nCareful! The last property of an object should not have a trailing comma. This\
    \ will cause an error in some JavaScript environments.\n\n## All objects inherit\
    \ from Object.prototype\n\nThe Object() constructor function in JavaScript is\
    \ special, as the prototype property is the last stop in the prototype chain.\n\
    \nIn the following sample, I augment the Object.prototype with a foo property\
    \ and then create a string and attempt to access the foo property as it were a\
    \ property of the string instance. Since myString instance does not have a foo\
    \ property, the prototype chain kicks in and the value is looked for String.prototype.\
    \ It is not there, the next place to look is Object.prototype, which is the final\
    \ location JavaScript will look for an object value. The foo value is found because\
    \ I added it, then it returns the value of foo.\n\nSample: sample7.html\n\n```\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n  Object.prototype.foo = 'foo';\n\
    \  var myString = 'bar';\n\n  // Logs 'foo', being found at Object.prototype.foo\
    \ via the prototype chain.\n  console.log(myString.foo);\n</script>\n</body>\n\
    ```\n\n## Notes\n\nCareful! Anything added to Object.prototype will show up in\
    \ a for in loop and the prototype chain. Because of this, it's said that changing\
    \ Object.prototype is forbidden.\n"
  mdcn: "\n\n## 头对象是隐含的，通常不被显式引用\n\n通常不使用头对象（head object）引用，因为它是隐含的。例如，在浏览器环境中 `window.alert`\
    \ 和 `alert()` 本质上是同一个语句。JavaScript 会填充空白处。因为 `window` 对象（即头对象）是作用链中查找某个值时创建的最后一个对象，所以\
    \ `window` 对象本质上总是隐含的。在下一个示例中，我们利用了全局作用域中的 `alert()` 函数。\n\n示例：sample68.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = { // window\
    \ 在这里是隐含的，window.foo\nwindow.fooMethod: function () {\n  alert('foo' + 'bar');\
    \ // window 在这里是隐含的，window.alert\n  window.alert('foo' + 'bar'); // 使用使用了 window，效果相同。\n\
    }\nnfoo.fooMethod(); // window 在这里是隐含的，window.foo.fooMethod()\n</script></body></html>\n\
    ```\n\n确保你理解即使你不包含头对象，它也是隐含的，因为头对象是作用链中的最后一个终点。\n\n## 注意\n\n显式使用（例如 `window.alert()`\
    \ 与 `alert()` 相比）在性能方面（代码运行速度）会增加一点开销。如果你仅依赖作用链并避免显式引用头对象（即使你知道你想要的属性包含在全局作用域中），速度会更快。\n\
    \n## 第 10 章 Object()\n\n### Object() 对象的概念概述\n\n使用内置的 `Object()` 构造函数可以动态创建通用的空对象。事实上，如果你回想起第\
    \ 1 章的开头，这正是我们创建 `cody` 对象时所做的事情。让我们重新创建 `cody` 对象。\n\n示例：sample69.html\n\n```\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n  var cody = new Object(); //\
    \ 创建一个没有属性的空对象。\n\n  for (key in cody) { // 确认 cody 是一个空通用对象。\n    if (cody.hasOwnProperty(key))\
    \ {\n      console.log(key); // 不应该看到任何日志，因为 cody 本身没有属性。\n    }\n  }\n</script></body></html>\n\
    ```\n\n在这里，我们只是使用 `Object()` 构造函数创建一个名为 `cody` 的通用对象。你可以将 `Object()` 构造函数想象成饼干模具，用于创建没有预定义属性或方法的空对象（当然，除了从原型链继承的那些）。\n\
    \n## 注意\n\n如果还不显而易见，`Object()` 构造函数本身一个对象。也就是说，该构造函数是基于从 `Array` 构造函数创建的对象，`Object`\
    \ 构造函数只是输出空白对象。是的，你可以创建任何你喜欢的对象。然而，创建一个像 `cody` 这样的空对象与创建一个带有预定义属性的自定义构造函数是完全不同的。确保你理解\
    \ `cody` 只是一个基于 `Object()` 构造函数的空对象。为了充分利用 JavaScript 的力量，你不仅需要学习如何从 `Object()`\
    \ 创建空对象，还需要学习如何像 `Object()` 构造函数一样构建自己的对象“类”（例如 `Person()`）。\n\n## Object() 参数\n\
    \n`Object()` 构造函数接受一个可选参数。该参数是你想要创建的值。如果你不提供任何参数，将假设为 `null` 或 `undefined` 值。\n\
    \n## 示例：sample70.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \n// 创建一个没有属性的空对象。\n  var cody1 = new Object();\n  var cody2 = new Object(undefined);\n\
    \  var cody3 = new Object(null);\n\n  console.log(typeof cody1, typeof cody2,\
    \ typeof cody3); // 记录 'object object object'。\n\n</script></body>\n```\n\n如果将\
    \ `null` 或 `undefined` 值传递给 `Object` 构造函数，将得到一个 `null` 或 `undefined` 值（注：此处原文逻辑可能有误，此处按字面翻译）。理论上，我们可以使用对象字面量来创建对象，即使是隐含的。\n\
    \n示例：sample71.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n\
    // 使用这里的 Object() 构造函数来创建 cody \n// 对象。\nvar cody = {\n  // 构造函数  传递的是一个值。\n};\n\
    \n/* 我们可以使用 \n// 对象字面量。 */\nvar cody = {\n  living: true,\n  age: 23,\n  gender:\
    \ 'male',\n  getGender: function () { return cody.gender; }\n};\n\n// 注意这里的 cody\
    \ \n// 对象。\nconsole.log(cody); // 记录 cody 对象。\n</script></body>\n```\n\n## Object()\
    \ 属性\n\n`Object()` 构造函数接受一个可选参数。该参数是你想要创建的值。如果你不提供任何参数，将假设为 `null` 或 `undefined`\
    \ 值。\n\n## Object() 属性和方法\n\n`Object()` 实例具有以下属性和方法（包括继承的属性和方法）：\n\n- `constructor`\n\
    - `prototype`\n\n## Object() 属性和方法\n\n`Object()` 实例具有以下属性和方法（不包括继承的属性和方法）：\n\n\
    - `constructor`\n- `hasOwnProperty()`\n- `isPrototypeOf()`\n- `propertyIsEnumerable()`\n\
    - `toString()`\n- `toLocaleString()`\n- `valueOf()`\n\n## 使用对象字面量创建对象\n\n通过对象字面量创建对象，即使是隐含的，也是更简洁的。\n\
    \n示例：sample72.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n \
    \ var cody = {\n    living: true,\n    age: 23,\n    gender: 'male',\n    getGender:\
    \ function () { return cody.gender; }\n  };\n  // 注意这里的 cody \n// 对象。\n  console.log(cody);\
    \ // 记录 cody 对象。\n</script></body>\n```\n\n示例：sample73.html\n\n```\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\nvar cody = {\n  living: true,\n  age:\
    \ 23,\n  gender: 'male',\n  getGender: function () { return cody.gender; }\n};\n\
    // 注意最后一个属性没有\n// 逗号。\n\nconsole.log(cody); // 记录 cody 对象。\n</script></body>\n\
    ```\n\n示例：sample74.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var cody = {\n  'living': true,\n  'age': 23,\n  'gender': 'male',\n  getGender:\
    \ function () { return cody.gender; }\n};\n// 注意最后一个属性没有\n// 逗号。\n\nconsole.log(cody);\
    \ // 记录 cody 对象。\n</script></body>\n```\n\n## 所有对象都继承自 Object.prototype\n\nJavaScript\
    \ 中的 `Object()` 构造函数是特殊的，因为 `prototype` 属性是原型链的最后一个终点。\n\n在下面的示例中，我为 `Object.prototype`\
    \ 增加了一个 `foo` 属性，然后创建了一个字符串并尝试访问该字符串的 `foo` 属性。由于 `myString` 实例没有 `foo` 属性，原型链开始工作并在\
    \ `String.prototype` 中查找。那里没有，下一个查找的地方是 `Object.prototype`，这是 JavaScript 查找对象值的最终位置。`foo`\
    \ 值找到了，因为我添加了它，然后它返回了 `foo` 的值。\n\n示例：sample.html\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n  Object.prototype.foo = 'foo';\n  var myString\
    \ = 'bar';\n\n  // 记录 'foo'，通过原型链在 Object.prototype.foo 找到。\n  console.log(myString.foo);\n\
    </script>\n</body>\n</html>\n```\n\n"
