  md: "Functions that chain functions create stacked execution scopes. These stacks,\
    \ which are chained together, are often referred to as the scope chain.\n\n# JavaScript\
    \ does not have block scope\n\nSince logic statements (e.g., if) and looping statements\
    \ (e.g., for) do not create a scope, variables can overwrite each other. Examine\
    \ the code and make sure you understand that the value of foo is being redefined\
    \ as the program executes the code.\n\nSample: sample111.html\n\n```\n<<!DOCTYPE\
    \ html><html> lang=\"en\"><body><script>\n  var foo = 1; // foo = 1.\n\nif (true)\
    \ {\n  foo = 2; // foo = 2.\n  for (var i = 3; i <= 5; i++) {\n    foo = 1; //\
    \ foo = 3, 4, 5.\n    console.log(foo); // Logs 3, 4, 5.\n  }\n}\n</script></body></html>\n\
    ```\n\nSo foo is changing as the code executes because JavaScript has no block\
    \ scope—only function, global, or ever scope.\n\n# Use var inside of functions\
    \ to declare variables and avoid scope gotchas\n\nJavaScript will declare any\
    \ variables lacking a var declaration (even those contained in a function or encapsulated\
    \ functions) in the global scope instead of the intended local scope. Have a look\
    \ at the code that follows and notice that without the use of var to declare bar,\
    \ the variable is actually defined in the global scope and not the local scope,\
    \ where it should be.\n\nSample: sample112.html\n\n```\n<<!DOCTYPE html><html>\
    \ lang=\"en\"><body><script>\n  var foo = function () {\n    var boo = function\
    \ () {\n      bar = 2; // No var used, so bar is placed in the global scope at\n\
    \      window.bar\n    }\n  }();\n```"
