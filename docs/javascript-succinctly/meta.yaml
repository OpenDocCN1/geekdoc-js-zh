    # Chapter 9 The Head/Global Object


    # Conceptual overview of the head object


    JavaScript itself must be contained within an object. For example, when crafting
    JavaScript code for a web browser environment, JavaScript is contained and executed
    within the window object. This window object is considered to be the "head object,"
    or sometimes confusingly referred to as "global object." All implementations of
    JavaScript require the use of a single head object.


    The head object is set up by JavaScript before the enables and to house the native
    code with which JavaScript comes repackaged. User-defined code is placed by JavaScript
    inside the head object for execution. Let''s verify this as it pertains to a web
    browser.


    In the following sample, I am creating JavaScript variables and verifying the
    values are placed in the head object.


    Sample: sample6.html


    ```

    <!DOCTYPE html<html lang="en"><body><script>


    var myStringVar = ''myString'';

    var myFunction = function () { };

    myString = ''myString'';

    myFunction = function () { };


    console.log(''myStringVar'' in window); // Returns true.

    console.log(''myFunctionVar'' in window); // Returns true.

    console.log(''myString'' in window); // Returns true.

    console.log(''myFunction'' in window); // Return true.


    </script></body></html>

    ```


    You should always be aware that when you write JavaScript, it will be written
    in the context of the head object. The remaining material in this chapter assumes
    you are aware that the term "head object" is synonymous with "global object."



    # Notes


    The head object is the highest scope/context available in a JavaScript environment.


    # Global functions contained within the head object


    JavaScript ships with some predefined functions. The following native functions
    are considered methods of the head object (e.g., in a web browser, window.parseInt(''500'')).
    You can think of these as ready-to-use functions and methods (of the head object)
    provided by JavaScript.


    +   - decodeURI()

