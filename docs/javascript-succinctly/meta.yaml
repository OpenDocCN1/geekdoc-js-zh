    In JavaScript, most values (excluding primitive values) involve objects being
    created, or instantiated, from a constructor function. An object returned from
    a constructor is called an instance. Make sure you are comfortable with these
    semantics, as well as the pattern of leveraging constructors to produce objects.


    # The native JavaScript object constructors


    The JavaScript language contains nine native (or built-in) object constructors.
    These objects are used by JavaScript to construct the language, and by "construct"
    I mean these objects are used to express value objects in JavaScript code, as
    well as orchestrate several features of the language. Thus, native object constructors
    are multifaceted that they produce objects, but are also leveraged in facilitating
    many of the language’s programming conventions. For example, functions are objects
    created from the Function() constructor, but are used to create other objects
    from constructor functions using the new keyword.

    The native object constructors that come prepackaged with JavaScript are:


    +   * Number()

    * String()

    * Boolean()

    * Object()

    * Array()

    * Function()

    * Date()

    * RegExp()

    * Error()


    JavaScript is mostly constructed from these nine objects as well string, number,
    and Boolean values. Understanding these objects in detail is key to taking advantage
    of JavaScript’s unique programming power and language flexibility.


    # Notes


    The Math is the oddball here. It''s a static object rather than a constructor
    function, meaning you cannot do this: var x = new Math(). But you can use it if
    it has already been instantiated (e.g., Math.PI). Truly, Math is an object namespace
    set up by JavaScript to house functions.


    The native objects are sometimes referred to as "global objects" since they are
    the objects that JavaScript has natively available for use. Do not confuse the
    term global object with the "head" global object that is the topmost level of
    the scope chain, for example, the window object in all browsers.'
