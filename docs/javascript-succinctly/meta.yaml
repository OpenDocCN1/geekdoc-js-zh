    # Creating arrays\n\nLike most the objects in JavaScript, an array object can\
    \ be created using the new operator in conjunction with the Array() constructor,\
    \ or by using the literal syntax.\n\nIn the following sample, I create the myArray1\
    \ array with predefined values using the Array() constructor, and using literal\
    \ notation.\n\nSample: datetime135.html\n\n```\n<DOCTYPE html><html lang=\"en\"\
    ><body><script>\n  // Array() constructor.\n  var myArray1 = new Array('blue',\
