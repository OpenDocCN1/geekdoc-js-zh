    \ always be a reference to the head object its host function is encapsulated inside\
    \ of another function or invoked within the context of another function (again,\
    \ this is fixed in ECMAScript 5).\n\n## Working around the nested function issue\
    \ by leveraging the scope chain\n\nSo that the this value does not get lost, you\
    \ can simply use the scope to keep a reference to this in the parent function.\
    \ The following sample demonstrates how, using a variable called that, and leveraging\
