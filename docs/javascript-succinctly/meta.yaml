    \ === undefined);\n</script>\n</</body>>\n</html>\n```\n\n这里需要掌握的概念是，所有函数都会返回一个值，即使你没有显式地提供要返回的值。如果你没有指定返回的值，返回的值就是\
    \ `undefined`。\n\n## 函数是一等公民（不仅是语法，而且是值）\n\n在 JavaScript 中，函数是对象。这意味着函数可以存储在变量、数组或对象中。此外，函数可以传递给函数并从函数返回。函数拥有属性，因为它是一个对象。这些因素使得函数成为\
    \ JavaScript 中的一等公民。\n\n示例：sample80.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body\n<script>\nvar funcA = function () {};\nvar funcE = function () {};\n\
    funcE.answer = 'yup'; // 实例属性。\nconsole.log(funcE.answer); // 'yup'\n</body></html>\n\
    ```\n\n## 向函数传递参数\n\n参数是在函数调用时将值传递到作用域的媒介。在接下来的示例中，我们预定义它接收两个参数，这两个值在它的作用域内是用的。\n\
    \n示例：sample81.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body\n<script>\n\
    var addFunction = function (number1, number2) {\nvar sum = number1 + number2;\n\
