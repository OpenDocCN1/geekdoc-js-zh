  - "[PAGE 106]\n\nThe idea you should take away here is that the scope chain is determined\
    \ during definition—literally in the way the code is written. Passing around functions\
    \ inside of your code will not change the scope chain.\n\n# Closures are caused\
    \ by the scope chain\n\nTake what you have learned about the scope chain and scope\
    \ lookup in this chapter, and a closure should not be overly complicated to understand.\
    \ In the following sample, we create a function called countUpFromZero. This function\
    \ returns a reference to the child function contained within it. This child function\
    \ (nested) is invoked, it has access to the parent's function because of the scope\
    \ chain.\n\n**Sample: sample11.html**\n\n```\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\nvar countUpFromZero = function () {\n  var count = 0;\n  return\
    \ function () // Return nested child function\n    countUpFromZero is invoked.\n\
    \      return count++; // count is defined up the scope chain, in the parent\n\
    \    function.\n  };\n})(); // Invoke immediately, return nested function.\n\n\
    console.log(countUpFromZero()); // Logs 1.\nconsole.log(countUpFromZero()); //\
    \ Logs 2.\nconsole.log(countUpFromZero()); // Logs 3.\n</script></body></html>\n\
    ```\n\nEach time the countUpFromZero function is invoked, the anonymous function\
    \ contained in (and returned from) the countUpFromZero function still has access\
    \ to the parent's scope. This technique, facilitated by the scope chain, is an\
    \ example of a closure.\n\n# Notes\n\nIf you feel I have over-simplified closures,\
    \ you are likely correct in this thought. But I did so purposely as I believe\
    \ the important parts come from a solid understanding of functions and scope,\
    \ not necessarily the complexities of execution context. If you are in need of\
    \ in-depth dive into closures, have a look at JavaScript Closures."
  - "[PAGE 107]\n\n# Chapter 14 Function Prototype Property\n\nConceptual overview\
    \ of the prototype chain\nThe prototype property is an object created by JavaScript\
    \ for every Function() instance. It links object instances created with the new\
    \ keyword back to the constructor function created them. This is done so that\
    \ instances can share, or inherit, methods and properties. Importantly, the search\
    \ occurs during property lookup. Remember from Chapter 1 every time you look up\
    \ or access a property on an object, the property will be searched for on the\
    \ object as well as the prototype chain.\n\nNotes\nA prototype object is created\
    \ for every function, regardless of whether you intend to use that function as\
    \ a constructor.\n\nIn the following code, I will construct an array from the\
    \ Array() constructor, and then I invoke the join() method.\n\nSample: sampleprototype118.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  var myArray = new Array('foo',\
    \ 'bar');\n\n  console.log(myArray.join()); // Logs 'foo,bar'\n\n</script></body></html>\n\
    ```\n\nThe join() method is not defined as a property of the myArray object instance,\
    \ but somehow we have access to join() as if it were. This method is defined somewhere,\
    \ but where? Well, it is defined as a property of the Array() constructor's prototype\
    \ property. Since join() is not found within the array object instance, JavaScript\
    \ looks up the prototype chain for a method join().\n\nOk, why are things done\
    \ this way? Really, it is about efficiency and reuse. Why every array instance\
    \ created from the array constructor have a uniquely defined join() method when\
    \ join() always functions the same way? It makes more sense for all arrays to\
    \ leverage the same join() function without having to create a new instance of\
    \ the function for each array.\n\nThis efficiency we speak of is all possible\
    \ because of the prototype property, prototype linkage, and the prototype lookup\
    \ chain. In this chapter, we break down these often confusing attributes of prototypal\
    \ inheritance. But truth told, you would be better off by simply memorizing the\
    \ mechanics of how the chain hierarchy actually works. Refer back to Chapter 1\
    \ if you need a refresher on how property values are resolved."
  - "[PAGE 108]\n\n# Why care about the prototype property?\n\nYou should care about\
    \ the prototype property for four reasons.\n\n# Reason 1\n\nThe first reason is\
    \ that the prototype is used by the native constructor functions (e.g., Object(),\
    \ Array(), Function(), etc.) to allow constructor instances to inherit properties\
    \ and methods. It is the mechanism that JavaScript itself uses to allow instances\
    \ to inherit properties and methods from the constructor function's prototype\
    \ property. If you want to understand JavaScript better, you need to understand\
    \ how JavaScript leverages the prototype object.\n\n# Reason 2\n\nWhen creating\
    \ user-defined constructor functions, you can orchestrate inheritance the way\
    \ JavaScript native objects do. But you first have to learn how it works.\n\n\
    # Reason 3\n\nYou might dislike prototype inheritance or prefer another pattern\
    \ for object inheritance, but the reality is that someday you might have to edit\
    \ or manage someone's code you thought prototypal inheritance was the bee's knees.\
    \ When this happens, you should be aware of how prototypal inheritance works,\
    \ as well as how it can be replicated by developers who use of custom constructor\
    \ functions.\n\n# Reason 4\n\nBy using prototype inheritance, you can create efficient\
    \ object instances that leverage the same methods. As already mentioned, not all\
    \ objects, which are instances of the Array() constructor, need their own join()\
    \ methods. All instances can leverage the same join() method because the method\
    \ is stored in the prototype chain.\n\n# Prototype is standard on all Function()\
    \ instances\n\nAll functions are created from a Function(), even if you do not\
    \ directly inherit the Function() (e.g., var add = new Function('x', 'y', 'return\
    \ x + z')); and instead use the literal notation (e.g., var add = function(x,y){return\
    \ x + z}).\n\nWhen an instance is created, it is always given a prototype property,\
    \ which is an empty object. In the following sample, we define a function called\
    \ myFunction and then access the prototype property which is an empty object.\n\
    \nSample sample119.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar myFunction = function () {}\n  console.log(myFunction.prototype); // Logs\
    \ object{}\n  console.log(typeof myFunction.prototype); // Logs 'object'.\n\n\
    ```"
