    \ foo.\n\n### Sample: sample41.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\nvar myObject = {foo: 'value'};\nconsole.log(myObject.hasOwnProperty('foo'))\
    \ // Logs true.\n\n// Versus a property from the prototype chain.\nconsole.log(myObject.hasOwnProperty('toString'));\
    \ // Logs false.\n</script></body>\n```\n\nThe hasOwnProperty method should be\
    \ leveraged when you need to determine whether a property is local to an object\
    \ or inherited from the prototype chain.\n\n## Checking if an object contains\
    \ a given property using the in operator\n\nThe in operator is used to verify\
    \ (true or false) if an object contains a given property. In this sample, we are\
    \ checking to see if foo is a property in myObject.\n\n### Sample: sample42.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar myObject = {foo:\
    \ 'value'};\nconsole.log('foo' in myObject); // Logs true.\n</script></body>\n\
    ```\n\nYou should be aware that the in operator not only checks for properties\
    \ contained in the object referenced, but also for any properties object inherits\
    \ via the prototype chain. Thus, the same property lookup rules apply, and if\
