    ## 第1章 JavaScript 对象


    ### 创建对象


    在 JavaScript 中，对象是这一切的核心：几乎一切都是对象，或者表现得像对象。理解了对象，你就理解了 JavaScript。所以，让我们来研究 JavaScript
    中对象的创建方式。


    对象仅仅是一个存储一组命名值（也称为属性）的容器。在查看任何 JavaScript 代码之前，让我们先进行逻辑推导。以我为例，用通俗的语言，我们可以用表格来表示一个
    "cody"：


    | 属性 | 属性值 |

    |---|---|

    | living | True |

    | age | 33 |

    | gender | Male |


    表格中的单词 "cody" 只是这组属性名和对应值的标签，这些内容恰恰构成了 "cody" 的本质。正如从表格所示，我是活着的，33岁，男性。


    然而，JavaScript 并不使用表格进行交流。它使用对象，而对象与 "cody" 表格中包含的部分相似。将 cody 表格翻译成真正的 JavaScript
    对象看起来如下：


    ```html

    <!DOCTYPE html><html><body>// 创建 cody 对象

    var cody = new Object();

    // 然后用属性填充 cody 对象（使用点表示法）

    cody.living = true;

    cody.age = 33;

    cody.gender = ''male'';

    console.log(cody); // 输出 Object {living = true, age = 33, gender = ''male''}

    </script></body></html>

    ```


    请记住：对象本质上只是属性的容器，每个属性都有一个名称和一个值。这种带有命名值的属性容器（即对象）的概念，被 JavaScript 用作在 JavaScript
    中表示值的构建块。


    cody 对象是一个值，我通过创建一个对象、给该对象命名、然后赋予该对象属性，将其表示为一个 JavaScript 对象。


    到目前为止，我们讨论的 cody 对象只有静态信息。由于我们处理的是一种编程语言，我们希望编写 cody 对象来实际执行某些操作。否则，我们拥有的只是类似于
    JSON 的数据库。为了让 cody 对象活起来，我需要添加一个属性方法。方法执行函数。具体来说，在 JavaScript 中，方法是包含 `Function()`
    对象的属性，其意图是对包含该函数的对象进行操作。


    如果我用一个 getter 方法（get 方法）更新 cody 表格，用通俗的英语描述应该是这样的：


    | 属性 | 属性值 |

    | --- | --- |

    | living | True |

    | age | 33 |

    | gender | Male |

    | Getter | 返回 gender 的值 |


    使用 JavaScript，更新后的 cody 表格中的 get 方法看起来如下：


    示例：sample02.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var cody = new Object();

    cody.living = true;

    cody.age = 33;

    cody.gender = ''male'';

    cody.getGender = function () { return cody.gender; };


    console.log(cody.getGender()); // 输出 male''

    </script></body></html>

    ```


    getter 方法是 cody 对象的一个属性，用于返回 cody 的其他属性值之一：存储在 gender 属性中的值 "male"。你必须意识到，如果没有方法，我们的对象除了静态属性外将别无所有。


    我们到为止讨论的 cody 对象就是我们所说的 `Object()` 对象。我们通过调用 `Object()` 构造函数产生的空白对象来创建 cody 对象。将构造函数想象成生产预定义对象的模板或切割器。在
    cody 案例中，我使用 `Object()` 构造函数产生了一个我命名为 cody 的对象。因为 cody 是通过 `Object()` 构造函数构建的对象，所以我们称之为
    `Object()` 对象。除了创建像 cody 这样简单的 `Object()` 对象之外，你真正需要理解的是，JavaScript 对象中表示的大多数值（原始值如
    "foo"5 和 true 是例外，但有等价的包装对象）。


    考虑到从 `Object()` 构造函数创建的 cody 对象与通过 `String` 构造函数创建的字符串对象并没有区别。为了强调这一点，请检查并对比以下代码：


    示例：sample0.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var myObject = new Object(); // 生成一个 Object() 对象。

    myObject[''0''] = ''f'';

    myObject[''1''] = ''o'';

    myObject[''2''] = ''o'';


    console.log(myObject); // 输出 Object {="f", 1="o", 2="o"}


    var myString = new String(''foo''); // 生成一个 String() 对象。

    console.log(myString); // 输出 foo {="f", 1="o", 2="o"}

    </script></body></html>

    ```


    事实证明，myObject 和 myString 都是对象...!它们可以拥有属性、继承属性，并由构造函数产生。包含 "foo" 字符串值的 `myString`
    变量看起来非常简单，但惊讶的是，它在表象之下并不是真正的对象结构。如果你检查你生成的对象，会发现它们在实质上是相同的对象，但类型不同。更重要的是，我希望你开始看到
    JavaScript 使用对象来表示值。


    ### 注意事项


    你可能会觉得以对象形式看到字符串值 ''foo'' 很奇怪，因为通常字符串被表示为原始值。


    '
