    # Replacing the prototype property with a new object removes the default constructor
    property


    It''s possible to replace the default prototype property with a new value. However,
    doing so will eliminate the default constructor property in the "pre-made" prototype
    object—unless you manually specify it.


    In the code that follows, we create a Foo constructor function, replace the prototype
    property with a new empty object, and verify that the constructor property is
    broken (it now references the less useful Object prototype).


    Sample: sample125.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var Foo = function() { };


    Foo.prototype = {}; // Replace prototype property with an empty object.


    var FooInstance = new Foo();


    console.log(FooInstance.constructor === Foo); // Logs false, we broke the reference.

    console.log(FooInstance.constructor); // Logs Object(), not Foo()


    // Compare to code in which we do not replace the prototype value.


    var Bar = function Bar() { };


    var BarInstance = new Bar();


    console.log(BarInstance.constructor === Bar); // Logs true.

    console.log(BarInstance.constructor); // Logs Bar()


    </script></body></html>

    ```


    If you intend to replace the default prototype property (common with some JS patterns)
    set up by JavaScript, you should write back a constructor property that references
    the constructor function. In the following sample, we alter our previous code
    so that the constructor property will provide a reference to the proper constructor
    function.


    Sample: sample126.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var Foo = function Foo() { };


    Foo.prototype = { constructor: Foo };


    var FooInstance = new Foo();

    ```'
