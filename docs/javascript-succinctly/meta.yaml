    \ === Bar); // 输出 true。\nconsole.log(BarInstance.constructor); // 输出 Bar()\n\n\
    </script></body></html>\n```\n\n如果你打算替换由 JavaScript 设置的默认 `prototype` 属性（这在某些\
    \ JS 模式中很常见），你应该写回一个引用该构造函数的 `constructor` 属性。在接下来的示例中，我们修改了之前的代码，使 `constructor`\
    \ 属性提供指向正确构造函数的引用。\n\n示例: sample126.html\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\nvar Foo = function Foo() { };\n\nFoo.prototype = { constructor:\
    \ Foo };\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.constructor\
    \ === Foo); // 输出 true。\nconsole.log(FooInstance.constructor); // 输出 Foo()\n\n\
    </script></body></html>\n```\n\n# 从原型继承的实例始终获取最新值\n\n`prototype` 属性是动态的，这种动态意味着无论实例何时安装，实例总是会获取最新值。在接下来的代码中，我们创建了一个\
    \ `Foo` 构造函数，添加属性 `x`，然后创建一个实例。接下来，我们记录 `x` 的值。然后我们更新原型并记录它。\n\n示例: sample127.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar Foo = function()\
    \ { };\n\nFoo.prototype = { x: 1 };\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.x);\
    \ // 输出 1。\n\nFoo.prototype.x = 2;\n\nconsole.log(FooInstance.x); // 输出 2，FooInstance\
    \ 更新了。\n\n</script></body></html>\n```\n\n考虑到查找链的工作原理，这种行为不应该意外。无论你使用的是默认原型还是覆盖它，这种工作都有效。在示例中，我替换了默认原型来演示这一点。\n\
    \n示例: sample128.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var Foo = function() { };\n\nFoo.prototype = { x: 1 }; // 后面的日志相同。\n\nvar FooInstance\
    \ = new Foo();\n\nconsole.log(FooInstance.x); // 输出 1。\n\nFoo.prototype = { x:\
    \ 2 };\n\nconsole.log(FooInstance.x); // 输出 1。什么？\n\n</script></body></html>\n\
    ```\n\n# 用新对象替换原型属性不会更新之前的实例\n\n你可能认为随时替换原型属性，所有实例随之更新，但事实并非如此。当你创建一个实例时，该实例将与实例化时的原型绑定。提供新对象作为\
    \ `prototype` 属性不会更新已创建实例之间的连接。\n\n但请记住，正如我提到的，你可以更新或向原始创建的对象添加内容，这些值仍然保持连接。\n\
    \n示例: sample129.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var Foo = function Foo() { };\n\nFoo.prototype.x = 1;\n\nvar FooInstance = new\
    \ Foo();\n\nconsole.log(FooInstance.x); // 输出 1，正如你认为的那样。\n\n// 现在让我们用新对象替换/覆盖原型对象。\n\
    Foo.prototype = { x: 2 };\n\nconsole.log(FooInstance.x); // 输出 1。什么？因为我们刚刚更新了原型它应该输出\
    \ 2 吗？\n/* FooInstance 仍然引用实例化时原型对象的相同状态。 */\n\n// 创建 Foo() 的新实例\nvar NewFooInstance\
    \ = new Foo();\n\n// 新实例现在绑定到新的原型对象值（即 {x:2}）。\nconsole.log(NewFooInstance.x);\
    \ // 输出 2。\n</script></body></html>\n```\n\n"
