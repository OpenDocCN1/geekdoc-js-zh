    # The default prototype property is an Object() object


    All this prototype talk can get a bit heavy. Truly, prototype is just an empty
    property called "prototype" created between the scenes by JavaScript and made
    available by invoking the Function() constructor. If you were to do it manually,
    it would look something like this:


    Sample: sample120.Html


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var myFunction = function () { };

    function.prototype = {}; // Add the prototype property and set it to an

    empty object.

    console.log(myFunction.prototype); // Logs an empty object.

    </script></body></html>

    ```


    In fact, this sample code actually works fine, essentially just duplicating JavaScript
    already does.


    # Notes


    The value of a prototype property can be set to any of the complex values (i.e.
    objects) available in JavaScript. JavaScript will ignore any prototype property
    set to a primitive value.


    # Instances created from a constructor function are linked to the constructor’s
    prototype property


    While it is an object, prototype is special because the prototype chain links
    every instance to its constructor''s prototype property. This means any time an
    instance is created from a constructor function using the new keyword (or when
    an object is created for a primitive value), it adds a hidden link between the
    object instance created and the prototype property of the constructor used to
    create it. This link is known the instance as proto (though it is only exposed/via
    created in Firefox 2+, Safari, Chrome, and Android). JavaScript wires this together
    in the background when a constructor function is invoked, and it is this link
    that allows the prototype chain to be built, a chain. In the following sample,
    we add a property to the native Array() constructor''s prototype, which we can
    then access from an Array() instance using the __proto__ property set on that
    instance.'
