    \n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\nvar myObject = {\n\
    \  myProperty : 'I can see the light',\n  myMethod : function() {\n    var that\
    \ = this; // Store a reference to this (i.e. myObject) in\nmyMethod scope; var\
    \ helperFunction = function() { // Child function.\n // Logs 'I can see the light'\
    \ via scope chain that\n = this.\n console.log(that.myProperty); // Logs 'I can\
    \ see the\n \"that\".\n console.log(this); // Logs window object, if we don't\
    \ use\n }\n}\nmyObject.myMethod(); // Invoke myMethod.\n<script></body></html>\n\
    ```\n\n## Controlling the value of this using call() or apply()\n\nThe value of\
    \ this is normally determined from the context in which a function is called (except\
    \ when the new keyword is used—more about that in a minute), but you can control\
    \ and override the value of this using apply() or call() to define what this points\
    \ to invoking a function. Using these methods is like: Hey, call X can tell the\
    \ function to use Z object as the value for this. By doing so, the default way\
    \ in JavaScript determines the value of this.\n\nIn the next sample, we create\
    \ an object and a function. We then invoke the function via call() so that the\
    \ value of this inside the function uses myObject as its context. The statements\
    \ inside the myFunction will then populate myObject with properties instead of\
    \ the head. We have altered the object to which this (inside of myFunction) refers.\n\
    \nSample: sample105.html\n\n```html\n<!DOCTYPE html> <html lang=\"en\"><<body><script>\n\
    var myObject = {};\nvar myFunction = function (param1, param2) {\n // Set via\
    \ call(), 'this' points to myObject when function is invoked.\n this.foo = param1;\n\
    \ this.bar = param2;\n console.log(this); // Logs Object {foo = 'foo', bar = 'bar'}\n\
    }\nmyFunction.call(myObject, 'foo', 'bar'); // Invoke function, set value to myObject.\n\
    console.log(myObject) // Logs Object {foo = 'foo', bar = 'bar'}\n```\n</body></html>\n\
    ```\n\nIn the previous example, we used call(), apply() as could be used as well.\
    \ The difference between the two is how parameters for the function are passed.\
    \ Using call(), the parameters are comma-separated values. Using apply(), the\
    \ parameter values are passed inside of an array as shown in the following sample.\n\
    \nSample: sample106.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\n\
    \nvar myObject = {};\n\nvar myFunction = function (param1, param2) {\n    // Set\
    \ apply(), to thisObject when function is invoked.\n    this.foo = param1;\n \
    \   this.bar = param2;\n    console.log(this) // Logs Object {foo = 'foo', bar\
    \ = 'bar'}\n}\n\nmyFunction.apply(myObject, ['foo', 'bar']); // Invoke function,\
    \ set this value.\n\nconsole.log(myObject) // Logs Object {foo = 'foo', bar =\
    \ 'bar'}\n</script></body></html>\n```\n\nWhat you need to learn here is that\
    \ you can override the default value in which JavaScript determines the value\
    \ of this in a function's scope.\n\n## Using the this keyword inside a user-defined\
    \ constructor function\n\nWhen a function is invoked with the new keyword, the\
    \ value of this—as it's stated in the constructor—refers to the instance itself.\
    \ Said another way: we can leverage the object via this before the object is created.\
    \ In this way, the default value of this changes in a way similar to using call()\
    \ or apply().\n\nIn the following sample, we set up a Person constructor function\
    \ that uses this to reference an object being created. When an instance of Person\
    \ is created, this.name will reference the newly created object and place a property\
    \ named name in the new object with a value from the parameter (name) passed to\
    \ the constructor function.\n\nSample: sample107.html\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><<body><script>\n\nvar Person = function (name) {\nthis.name = name\
    \ || 'john doe'; // this will refer to the instance\ncreated.\n\nvar cody = new\
    \ Person('Cody Lindley'); // Create an instance based on the\nPerson constructor.\n\
    \nconsole.log(cody.name); // Logs 'Cody Lindley'.\n\n<script></body></html>\n\
    ```\n\nAgain, this refers to the object that is to be created when the constructor\
    \ function is invoked using the\nkeyword. We had not used the new keyword, the\
    \ value of this would be the context in\nwhich Person is invoked—in this case\
    \ the global head object. Let's examine the following scenario:\n\n## Sample108.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\nvar Person = function\
    \ (name) {\n  this.name = name || 'john doe';\n}\nvar cody = Person('Cody Lindley');\
    \ // Notice we did not use 'new'.\nconsole.log(cody.name); // Undefined. The value\
    \ is actually set at\nwindow.name\nconsole.log(window.name); // Logs 'Cody Lindley'.\n\
    </script></body></html>\n```\n\n## The keyword this inside a constructor's prototype\
    \ property, refers to a instance\n\nWhen used in functions added to a prototype\
    \ property, this refers to the instance on which the method is invoked. Say we\
    \ a custom Person() constructor function. As a parameter, it requires the person's\
    \ full name. In case we need to access the full name of the person, we add a whatIsFullName\
    \ method to the Person.prototype so that all instances inherit the method.\n\n\
    Here demonstrate the creation of two Person objects (cody and lisa) and the inherited\n\
    method method.\n\n## Sample109.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><<body><script>\nvar Person = function (x) {\n  if (x) { this.fullName = x };\n\
    }\n\nPerson.prototype.whatIsFullName = function () {\n  return this.fullName;\
    \ // 'this' refers to the instance created from\nPerson()\n}\n\nvar cody = new\
    \ Person('cody lindley');\nvar lisa = new Person('lisa lindley');\n\n// Call the\
    \ whatIsFullName method, which uses this to refer\nto the instance.\nconsole.log(cody.whatIsFullName(),\
    \ lisa.whatIsFullName());\n\n/* The prototype chain is still in effect, if the\
    \ instance does not contain the fullName property, it will look for it in the\
    \ prototype chain. Next,\nwe add a fullName to both the Person prototype and the\
    \ Object\nprototype. See the notes that follow this sample. */\n\nObject.prototype.fullName\
    \ = 'John Doe';\nvar john = new Person(); // No argument is passed to fullName\n\
    added to the instance.\nconsole.log(john.whatIsFullName()); // Logs 'John Doe'.\n\
    \n</script></body></html>\n```\n\nThe concept to take away here is that the keyword\
    \ this is used to refer to instances\ninside of a method contained in the prototype\
    \ object. If the instance does not containthenprototype chain lookup begins.\n\
    \n# Notes\n\nIf the instance or the object pointed to by this does not contain\
    \ the property being referenced,\\he same rules that apply to any property lookup\
    \ are applied, and the property will be \"looked\" on the prototype chain. So\
    \ in our example, if the fullName property was not contained\nwithin our instance,\
    \ fullName would be looked for at Person.prototype.fullName, then\nObject.prototype.fullName.\n"
