    \n要真正地复制一个对象，你必须从旧对象中提取值并将它们注入到新对象中。\n\n## 复杂对象通过引用相等\n\n在比较对象时，只有当它们引用同一个对象时（即具有相同的地址时），它们才是相等的。两个包含相同对象的变量彼此是不等的，因为它们实际上并没有指向同一个对象。\n\
    \n在下面的示例中，`objectFoo` 和 `objectBar` 具有相同的属性，事实上也是相同的对象，但当询问它们是否 `===` 相等时，JavaScript\
