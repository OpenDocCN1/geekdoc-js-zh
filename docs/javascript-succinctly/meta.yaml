    var Foo = function() { };\n\nFoo.prototype = { x: 1 }; // The logs that follow\
    \ work the same.\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.x);\
    \ // Logs 1.\n\nFoo.prototype = { x: 2 };\n\nconsole.log(FooInstance.x); // Logs\
    \ 1. WHAT?\n\n</script></body></html>\n```\n\n# Replacing the prototype property\
    \ with a new object does not update former instances\n\nYou might think that you\
