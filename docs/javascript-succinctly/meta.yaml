  md: "# Chapter 7 Null\n\n# Conceptual overview of using the null value\n\nYou can\
    \ use null to explicitly indicate that an object property does not contain a value.\
    \ Typically, if a property is set up to contain a value, but the value is not\
    \ available for some reason, the value null should be used to indicate that the\
    \ reference property has an empty value.\n\nSample: sample60.html\n\n```\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\n // The property foo is waiting for a\
    \ value, so we set its initial value\nto null.\n  var myObject = { foo: null };\n\
    \  console.log(myObject.foo); // Logs 'null'\n</script></body></html>\n```\n\n\
    # Notes\n\nDon't confuse null with undefined. undefined is used by JavaScript\
    \ to tell you that something is missing. null is provided so you can determine\
    \ when a value is expected but not available yet.\n\n# typeof returns null values\
    \ as \"object\"\n\nFor a variable that has a value of null, the typeof operator\
    \ returns 'object'. If you need to verify a null value, the ideal solution is\
    \ to see if the value are equal to null. In this example, we use the === operator\
    \ to specifically verify that we are dealing with a null value.\n\nSample: sample61.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  var myObject = null;\n\
    \n  console.log(typeof myObject); // Logs 'object', not exactly helpful.\n  console.log(myObject\
    \ === null); // Logs true, only for a real null value.\n</script></body></html>\n\
    ```\n\n# Notes\n\nWhen verifying a null value, always use === == does not distinguish\
    \ between null and undefined."
