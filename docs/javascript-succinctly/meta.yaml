    \ doo is in the boo function scope, so\nan an error occurs\n<script></body></html>\n\
    ```\n\nThe concept to take away is that you should always use var when defining\
    \ variables inside a function. This will prevent you from dealing with potentially\
    \ confusing scope problems. The exception to this convention, of course, is when\
    \ you want to create or change properties in the global scope from within a function.\n\
    \n# The scope chain (aka lexical scoping)\n\nThere is a lookup chain that followed\
    \ when JavaScript looks for the follows associated with a variable. This chain\
    \ is built on the hierarchy of scope. In the code that, I am logging the value\
    \ of sayHiText from the func scope.\n\nSample: sample113.html\n\n```\n<!DOCTYPE\
    \ html lang=\"en\"><body><script>\n\nvar sayHiText = 'howdy';\n\nvar func1 = function\
    \ () {\n  var func2 = function () {\n    console.log(sayHiText); // func2 scope,\
    \ but it finds sayHiText in global scope.\n  } ();n} ();\n</script></body>\n```\n\
    \nHow is the value sayHiText found when it is not contained inside the scope of\
    \ the func2 function? JavaScript first looks inside the func2 function for a variable\
    \ named sayHiText. Not finding func2 there, it looks up func2's parent function,\
    \ func1. The sayHiText variable is not found in the func1 scope, either, so JavaScript\
    \ continues up to the global scope where sayHiText is found, at which point the\
    \ value of sayHiText is delivered. If sayHiText had not been defined in the global\
    \ scope, undefined would have been returned by JavaScript."
