    # Instances that inherit properties from prototype will always get the latest
    values


    The prototype property is dynamic in the sense that instances will always get
    the latest value from the prototype regardless of when it was installed, changed,
    or overridden. In the code that follows, we create a Foo constructor, add the
    property x to the prototype, and then create an instance of Foo() named FooInstance.
