  md: "# Array() parameters\n\nYou can pass the values of an array instance to the\
    \ constructor as comma-separated parameters (e.g., new Array('foo', 'bar')). The\
    \ Array() constructor can take up to 4,294,967 parameters.\n\nHowever, if only\
    \ one parameter is sent to the Array() constructor and that value is an integer\
    \ (e.g., '1', '123', or '1.0'), it will be used to set up the length of the array,\
    \ and will not be used as a value contained within the array.\n\nSample: sample14.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  var foo = new Array(1,\
    \ 2, 3);\n  var bar = new Array(100);\n\n  console.log(foo[0], foo[2]); // Logs\
    \ '1 3'\n  console.log(bar[0], bar.length); // Logs 'undefined 100'\n</script></body></html>\n\
    ```\n\n# Array() properties and methods\n\nThe Array() object has the following\
    \ properties (not including inherited properties and methods):\n\nProperties (e.g.,\
    \ Array.prototype):\n\n+   - prototype\n\n# Array object instance properties and\
    \ methods\n\nArray object instances have the following properties and methods\
    \ (not including inherited properties and methods):\n\nInstance Properties (e.g.,\
