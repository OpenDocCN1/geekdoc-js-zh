  md: "# Self-invoking function expression\n\nA function expression (really any function\
    \ except one created from the Function() constructor) can be immediately invoked\
    \ after definition using the parentheses operator. In the following sample, we\
    \ create a sayword() function expression and immediately invoke the function.\
    \ This is considered to be a self-invoking function.\n\nSample: sample92.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar sayWord = function\
    \ () { console.log('Word 2 yo mo!'); }; (); // Logs\n'Word 2 yo mo!'\n\n</script></body></html>\n\
    ```\n\n# Self-invoking anonymous function statements\n\nIt is possible to create\
    \ an anonymous function statement that is self-invoking. This is called a self-invoking\
    \ anonymous. In the following sample, we create several anonymous functions that\
    \ are immediately invoked.\n\nSample: sample93.html\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\n// Most commonly used/seen in the wild.\n(function\
    \ msg) {\n    console.log(msg);\n}('Hi');\n\n// Slightly different, but achieving\
    \ the same thing;\n(function msg) {\n    console.log(msg);\n} ('Hi');\n\n// The\
    \ shortest possible solution.\n!function sayHi(msg) { console.log(msg); } ('Hi');\n\
    \n// FYI, this does NOT work!\n// function sayHi() {console.log('hi');};\n\n</script></body></html>\n\
    ```\n\n# Notes\n\nAccording to the ECMAScript standard, the parentheses around\
    \ the function (or anything that transforms the function into an expression) are\
    \ required if the function is to be invoked immediately."
