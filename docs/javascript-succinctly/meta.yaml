    ```\n\n`join()` 方法并没有定义在 `myArray` 对象实例的属性上，但我们似乎可以访问 `join()`，就像它存在一样。这个方法定义在某处，但在哪里呢？嗯，它被定义为\
    \ `Array()` 构造函数的 `prototype` 属性的属性。由于在数组对象实例未找到 `join()`，JavaScript 会在原型链上查找\
    \ `join()` 方法。\n\n好了，为什么要这样做？实际上，这关乎效率和复用。既然 `join()` 的功能始终是一致的，为什么每个从数组构造函数创建的数组实例都需要定义一个唯一定义的\
    \ `join()` 方法呢？让所有数组都复用同一个 `join()` 函数要更有意义，而不是为每个数组都创建一个新的函数实例。\n\n我们所说的这种效率之所以可能，全都是由于\
    \ `prototype` 属性、原型链接和原型查找链。在本章中，我们拆解了原型继承中这些经常令人困惑的属性。说实话，你只需要记忆链层级实际上是如何运作的机制会更好。如果你需要复习属性值是如何解析的，请翻回第\
    \ 1 章。\n\n## 为什么要关注 prototype 属性？\n\n你应该出于四个原因关注 `prototype` 属性。\n\n## 原因 1\n\n\
    第一个原因是，`prototype` 属性被 `Object()`、`Array()` 等原生函数使用，以便实例继承属性和方法。为了更好地理解 JavaScript，你需要了解\
    \ `prototype` 属性是如何工作的。\n\n## 原因 2\n\n在创建自定义函数时，JavaScript 使用 `prototype` 属性来处理继承，你需要了解它的工作方式。\n\
    \n## 原因 3\n\n你可能不喜欢原型继承，但现实是，你有一天需要修改或管理原型继承。当你想要理解 JavaScript 时，开发者需要了解 `prototype`\
    \ 属性。\n\n## 原因 4\n\n使用 `prototype` 属性可以创建复用相同方法的实例。正如提到的，并不是所有实例都需要自己的 `join()`\
    \ 方法，因为它们在原型链中。\n\n## 默认的 prototype 属性是一个 Object() 对象\n\n所有关于原型的讨论可能变得很复杂。实际上，`prototype`\
    \ 只是由 JavaScript 在后台创建的名为 \"prototype\" 的属性，并通过调用 `Function()` 构造函数提供的。如果你手动这样做，看起来像这样：\n\
    \n示例：sample120.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body<script>\n\
    var myFunction = function () { };\nfunction.prototype = {}; // 添加 prototype 属性并将其为空对象。\n\
    console.log(myFunction.prototype); // 打印一个空对象。\n</script></body></html>\n```\n\
    \n事实上，这段示例代码运行良好，基本上只是复制了 JavaScript 已经做的工作。\n\n## 注意事项\n\n`prototype` 属性的值可以设置为\
    \ JavaScript 中用的任何复杂值（即对象）。JavaScript 会忽略任何设置为原始值的 `prototype` 属性。\n\n## 从构造函数创建的实例链接到构造函数的\
    \ prototype 属性\n\n虽然它是一个对象，但 `prototype` 是特殊的，因为原型链将每个实例链接到其构造函数的 `prototype`\
    \ 属性。这意味着每当使用 `new` 关键字从构造函数创建实例时（或为原始值创建对象时），它都会在创建的对象实例与创建它的构造函数的 `prototype`\
    \ 属性之间添加一个隐藏的链接。JavaScript 在调用构造函数时在后台将这些连接起来，而正是这个链接允许了原型链的构建。在接下来的示例中，我们为原生\
    \ `Array()` 构造函数的 `prototype` 增加了一个属性，然后我们可以通过设置在实例上的 `__proto__` 属性来访问它。\n\n\
