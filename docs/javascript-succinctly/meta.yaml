- md: "\n## Chapter 1 JavaScript Objects\n\n### Creating objects\n\nIn JavaScript,\
    \ objects are king: Almost everything is an object or acts like an object. Understand\
    \ objects and you will understand JavaScript. So let's examine the creation of\
    \ objects in JavaScript.\n\nAn object is just a container for a collection of\
    \ named values (aka properties). Before we look at any JavaScript code, let's\
    \ first reason this out. Take myself, for example. Using plain language, we can\
    \ express in a table, a \"cody\":\n\n| property | property value |\n|---|---|\n\
    | living | True |\n| age | 33 |\n| gender | Male |\n\nThe word \"cody\" in the\
    \ table is just a label for the group of property names and corresponding values\
    \ that make exactly what a cody is. As you can see from the table, I am living,\
    \ 33, and male.\n\nJavaScript, however, does not speak in tables. It speaks in\
    \ objects, which are similar to the parts contained in the \"cody\" table. Translating\
    \ the cody table into an actual JavaScript object would look like:\n\n```html\n\
    <!DOCTYPE html><html><body>// Create the cody object\nvar cody = new Object();\n\
    // then fill the cody object with properties (using dot notation)\ncody.living\
    \ = true;\ncody.age = 33;\ncody.gender = 'male';\nconsole.log(cody); // Logs Object\
    \ {living = true, age = 33, gender = 'male'}\n</script></body></html>\n```\n\n\
    Keep this at the forefront of your mind: objects are really just containers for\
    \ properties, each of which has a name and a value. This notion of a container\
    \ of properties with named values (i.e. an object) is used by JavaScript as the\
    \ building blocks for expressing values in JavaScript.\n\nThe cody object is a\
    \ value which I expressed as a JavaScript object by creating an object, giving\
    \ the object name, and then giving the object properties.\n\nUp to this, the cody\
    \ object we have discussed has only static information. Since we are dealing with\
    \ a programming language, we want to program our cody object to actually do something.\
    \ Otherwise, we will have a database akin to JSON. In order to bring the cody\
    \ object to life, I need to add a property method. Method perform a function.\
    \ To be precise, in JavaScript, methods are properties that contain a Function()\
    \ object, whose intent is to operate on the object the function is contained within.\n\
    \nIf I were to update the cody table with a getter method, in plain English it\
    \ would look like this:\n\n| property | property value |\n| --- | --- |\n| living\
    \ | True |\n| age | 33 |\n| gender | Male |\n| Getter | return value of the gender\
    \ |\n\nUsing JavaScript, the get method from the updated cody table would look\
    \ like so:\n\nSample: sample02.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\nvar cody = new Object();\ncody.living = true;\ncody.age = 33;\n\
    cody.gender = 'male';\ncody.getGender = function () { return cody.gender; };\n\
    \nconsole.log(cody.getGender()); // Logs male'\n</script></body></html>\n```\n\
    \nThe getter method, a property of the cody object, is used to return one of cody's\
    \ other property values: the value \"male\" stored in the gender property. What\
    \ you must realize is that without methods, our object would not much except static\
    \ properties.\n\nThe cody object we have discussed far is what we call an Object()\
    \ object. We created the cody object using a blank object that was produced by\
    \ invoking the Object() constructor function. Think of constructor functions as\
    \ a template or cutter for producing predefined objects. In the case of cody object,\
    \ I used the Object() constructor function to produce an object I named cody.\
    \ Because cody is an object constructed from the Object() constructor, we call\
    \ cody an Object() object. What you really need to understand, beyond the creation\
    \ of a simple Object() object like cody, is that the majority of values expressed\
    \ in JavaScript objects (primitive values like \"foo\", 5, and true are the exception\
    \ but have equivalent wrapper objects).\n\nConsider that the cody object created\
    \ from the Object() constructor function is not really different from a string\
    \ object created via the String constructor function. To drive this fact home,\
    \ examine and contrast the following code:\n\nSample: sample0.html\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar myObject = new Object();\
    \ // Produces an Object() object.\nmyObject['0'] = 'f';\nmyObject['1'] = 'o';\n\
    myObject['2'] = 'o';\n\nconsole.log(myObject); // Logs Object {=\"f\", 1=\"o\"\
    , 2=\"o\"}\n\nvar myString = new String('foo'); // Produces a String() object.\n\
    console.log(myString); // Logs foo {=\"f\", 1=\"o\", 2=\"o\"}\n</script></body></html>\n\
    ```\n\nAs turns out, myObject and myString are both objects...! They can have\
    \ properties, inherit properties, and are produced from a constructor function.\
    \ The myString variable containing the \"foo\" string value seems to be as simple\
    \ as it goes, amazingly it's not really object structure under its surface. If\
    \ you examine the objects you produced will see that they are identical objects\
    \ in substance but not in type. More importantly, I hope you begin to see that\
    \ JavaScript uses objects to express values.\n\n### Notes\n\nYou might find it\
