  md: "# The head object is implied and typically not referenced explicitly\n\nTypically\
    \ a reference to the head object is not used because it is implied. For example,\
    \ in the browser environment window.alert and alert() are essentially the same\
    \ statement. JavaScript fills in the blanks. Because the window object (i.e. the\
    \ head object) is the last object created in the scope chain for a value, the\
    \ window object is essentially always implied. In the next example, we leverage\
    \ the alert() function which is contained in the global scope.\n\nSample: sample68.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = { // window\
    \ is implied here, window.foo\nwindow.fooMethod: function () {\n  alert('foo'\
    \ + 'bar'); // window is implied here, window.alert\n  window.alert('foo' + 'bar');\
    \ // window is explicitly used, with the same effect.\n}\nnfoo.fooMethod(); //\
    \ window is implied here, window.foo.fooMethod()\n</script></body></html>\n```\n\
    \nMake sure you understand that the head object is implied even when you don'\
    \ explicitly include it, because the head object is the last stop in the scope\
    \ chain.\n\n# Notes\n\nBeing explicit (e.g., window.alert() vs. alert()) costs\
    \ a little bit more with regard to performance (how fast the code runs). It's\
    \ faster if you rely on the scope chain alone and avoid explicitly referencing\
    \ the head object even when you know the property you want is contained in the\
    \ global scope."
