    # Instances that inherit properties from prototype will always get the latest
    values


    The prototype property is dynamic in the sense that instances will always get
    the latest value from the prototype regardless of when it was installed, changed,
    or overridden. In the code that follows, we create a Foo constructor, add the
    property x to the prototype, and then create an instance of Foo() named FooInstance.
    Next, we log the value of x. Then we update the prototype''s value of x and log
    it to find that our instance has access to the latest value


    Sample: sample127.html


    ```

    <DOCTYPE html><html lang="en"><body><script>


    var Foo = function() { };


    Foo.prototype.x = 1;


    var FooInstance = new Foo();


    console.log(FooInstance.x); // Logs 1.


    Foo.prototype.x = 2;


    console.log(FooInstance.x); // Logs 2, the FooInstance was updated.


    </script></body></html>

    ```


    Given the lookup chain works, this behavior should not be surprising. If you are
    wondering, this works regardless of whether you use the default prototype object
    or override it with your own. In the sample, I replace the default prototype object
    to demonstrate this fact.


    Sample: sample128.html


    ```

    <DOCTYPE html><html lang="en"><body><script>


    var Foo = function() { };


    Foo.prototype = { x: 1 }; // The logs that follow still work the same.


    var FooInstance = new Foo();

    ```'
