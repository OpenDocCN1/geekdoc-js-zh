    \ 标准的一部分，存在一种通用的方法通过 `constructor` 属性来追踪对象到其继承的原型之间的链接。下面的示例演示了这一点。\n\n# 示例:sample122.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  Array.prototype.foo\
    \ = 'foo'; // 现在 Array() 的所有实例都继承了 foo 属性。\n  var myArray = new Array();\n\n \
    \ // 利用 *.constructor.prototype 追踪 foo\n  console.log(myArray.constructor.prototype.foo);\
    \ // 输出 foo。\n\n  // 或者，当然，利用原型链。\n  console.log(myArray.foo) // 输出 foo。\n\n \
    \ // 使用原型链在 Array.prototype.foo 查找属性\n</script></body></html>\n```\n\n在这个示例中，foo\
    \ 属性是在原型对象中找到的。你需要意识到，这之所以可行是因为 Array() 的实例与 Array() 构造函数原型对象（即 Array.prototype）之间的关联。简单来说，`myArray.__proto__`（或\
    \ `myArray.constructor.prototype`）引用了 Array.prototype。\n\n# 原型链的最后一步是 Object.prototype\n\
    \n由于原型链是最后一步，原型链查找是在 Object.prototype 处进行的。在接下来的代码中，我们调用了 `myArray`，它是一个空数组。然后我尝试访问\
    \ `myArray` 未定义的属性，触发了原型查找链。在 `myArray` 对象中搜索 `foo` 属性。由于不存在，于在 `Array.prototype`\
    \ 中查找，但那里也没有。JavaScript 最终查找的地方是 `Object.prototype`。在上述三个对象中都没有定义该属性，因此该属性为 `undefined`。\n\
    \n# 示例: sample123.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  var myArray = [];\n\n  console.log(myArray.foo); // 输出 undefined。\n\n  /* 在\
