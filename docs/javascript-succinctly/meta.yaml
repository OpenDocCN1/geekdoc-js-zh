    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n// Functions can be sent\
    \ to, and sent back from, functions.\nvar foo = function (f) {\n  return f;\n\
    }\nvar bar = foo(function () { console.log('Hi'); });\n\nbar(); // Logs 'Hi'.\n\
    ```"
