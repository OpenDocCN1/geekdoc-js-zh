  md: 'the numeric index 50 of an empty array, JavaScript will fill in all of the
    necessary indexes before it with undefined values.


    Sample: sample136.html


    ```

    <!DOCTYPE html lang="en"><body>

    <script>

    var myArray = [];

    myArray[50] = ''blue'';

    console.log(myArray.length); /* Logs 51 (0 is counted) because JS created

    values 0 to 50 before "blue".*/

    </script>

    </body></html>

    ```


    Additionally, considering the dynamic nature of JavaScript and the fact that JavaScript
    is not strongly typed, an array value can be updated at any time and the value
    contained in the index can be any legal value. In the following sample, I change
    the value at the numeric index 50 to an object.


    Sample: sample137.html


    ```

    <!DOCTYPE html lang="en"><body><script>

    var myArray = [];

    myArray[50] = ''blue'';

    myArray[50] = {''color'': ''blue''}; // Change object type from string to

    Object(). object.

    console.log(myArray[50]); // Logs ''Object {color="blue"}''


    // Using brackets to access the index in the array, then the property

    blue.

    console.log(myArray[50][''color'']); // Logs ''blue''


    // Using dot notation.

    console.log(myArray[50].color); // Logs ''blue''

    </script></body></html>

    ```


    # Length vs. index


    An array starts indexing values at zero. This means that the first numeric slot
    to hold a value in an array looks like myArray[]. This can be a bit confusing—if
    I create an array with a single value, the index of that value is 0 while the
    length of the array is 1. Make sure you understand the length of an array represents
    the number of values contained within the array, while the numeric index starts
    at zero.


    In the following sample, the string value blue is contained in the myArray array
    at the numeric index 0, but since the array contains one value, the length of
    the array is 1.'
  merge: -1
