    \ function (bar) {\n    bar(); // 打印 window，而不是 foo。\n    console.log(this); //\
    \ 这里的 this 关键字将是指向 foo 对象的引用。\n  }\n}\nfoo.func1(function () { console.log(this)\
    \ });\n</script></body></html>\n```\n\n现在你永远不会忘记：`this` 始终是指向宿主对象的引用，除非该宿主函数被封装在另一个函数内部，或者在另一个函数的上下文中被调用（再次，这在\
    \ ECMAScript 5 中已修复）。\n\n## 通过作用域链解决嵌套函数问题\n\n为了让 `this` 值不丢失，你可以简单地使用作用域在父函数中保留对\
    \ `this` 的引用。下面的示例演示了如何使用一个名为 `that` 的变量并利用其作用域，可以更好地跟踪函数上下文。\n\n示例：sample104.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\nvar myObject = {\n\
    \  myProperty : 'I can see the light',\n  myMethod : function() {\n    var that\
    \ = this; // 在 myMethod 作用域中存储 this（即 myObject）的引用。\n    var helperFunction =\
    \ function() { // 子函数。\n // 通过作用域链打印 'I can see the light'，\n // = this.\n console.log(that.myProperty);\
    \ // 打印 'I can see the light \"that\"。\n console.log(this); // 如果我们不使用 that，则打印\
    \ window 对象。\n }\n}\nmyObject.myMethod(); // 调用 myMethod。\n<script></body></html>\n\
    ```\n\n## 使用 `call()` 或 `apply()` 控制 `this` 的值\n\n`this` 的值通常由调用函数时的上下文决定（除非使用了\
    \ `new` 关键字——稍后会详细介绍这一点），但你可以使用 `apply()` 或 `call()` 控制并覆盖 `this` 的值，以定义调用函数时\
    \ `this` 指向。使用这些方法就像：“嘿，调用 X 可以告诉函数使用 Z 对象作为 `this` 的值。”这样做改变了 JavaScript 确定 `this`\
    \ 的默认方式。\n\n在下一个示例中，我们创建了一个对象和一个函数。然后我们通过 `call()` 调用函数，使得函数内部的 `this` 值使用 `myObject`\
    \ 作为其上下文。`myFunction` 内部的语句将为 `myObject` 填充属性而不是头部。我们更改了 `this`（`myFunction` 内部）指向的对象。\n\
    \n示例：sample105.html\n\n```html\n<!DOCTYPE html> <html lang=\"en\"><<body><script>\n\
    var myObject = {};\nvar myFunction = function (param1, param2) {\n // 通过 call()\
    \ 设置，当函数被调用时，'this' 指向 myObject。\n this.foo = param1;\n this.bar = param2;\n console.log(this);\
    \ // 打印 Object {foo = 'foo', bar = 'bar'}\n}\nmyFunction.call(myObject, 'foo',\
    \ 'bar'); // 调用函数，将值设置为 myObject。\nconsole.log(myObject) // 打印 Object {foo = 'foo',\
    \ bar = 'bar'}\n```\n</body></html>\n```\n\n在上一个示例中，我们使用了 `call()`，也可以使用 `apply()`。两者的区别在于函数参数传递的方式。使用\
    \ `call()` 时，参数是逗号分隔的值。使用 `apply()` 时，参数值在数组内部传递，如下所示。\n\n示例：sample106.html\n\n\
    ```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\n\nvar myObject = {};\n\
    \nvar myFunction = function (param1, param2) {\n    // 使用 apply()，当函数被调用时，this\
    \ 指向 thisObject。\n    this.foo = param1;\n    this.bar = param2;\n    console.log(this)\
    \ // 打印 Object {foo = 'foo', bar = 'bar'}\n}\n\nmyFunction.apply(myObject, ['foo',\
    \ 'bar']); // 调用函数，设置此值。\n\nconsole.log(myObject) // 打印 Object {foo = 'foo', bar\
    \ = 'bar'}\n</script></body></html>\n```\n\n你在这里需要的是，你可以覆盖 JavaScript 在函数作用域中确定\
    \ `this` 值的默认值。\n\n## 在用户定义的构造函数内部使用 `this` 关键字\n\n当使用 `new` 关键字调用函数时，`this` 的值——如构造函数中所述——指向实例本身。换句话说：我们可以在对象创建之前通过\
    \ `this` 利用该对象。通过这种方式，`this` 的默认值发生的变化类似于使用 `call()` 或 `apply()`。\n\n在接下来的示例中，我们设置了一个\
    \ `Person` 构造函数，它使用 `this` 来引用正在被创建的对象。当创建 `Person` 的实例时，`this.name` 将引用新创建的对象，并在新对象中放置一个名为\
    \ `name` 的属性，其值为传递给构造函数的参数 `(name)`。\n\n示例：sample107.html\n\n```html\n<!DOCTYPE\
    \ html><html lang=\"en\"><<body><script>\nvar Person = function (name) {\n  this.name\
    \ = name || 'john doe';\n}\nvar cody = new Person('Cody Ling'); // this.name 将引用新创建的对象，并在新对象中放置一个名为\
    \ name 的属性，其值为传递给构造函数的参数 (name)。\nconsole.log(cody.name); // 打印 'Cody Ling'\n\
    </script></body></html>\n```\n\n再次强调，除非该宿主函数被封装在另一个函数内部，或者在另一个函数的上下文中被调用时，`this`\
    \ 始终是指向宿主对象的引用。在调用构造函数时由于没有使用 `new` 关键字，`this` 将将是调用函数上下文的（头）对象。让我们检查以下场景：\n\n\
    sample108.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\n\
    var Person = function (name) {\n  this.name = name || 'john doe';\n}\nvar cody\
    \ = Person('Cody Ling'); // 注意我们没有使用 'new'。\nconsole.log(cody.name); // undefined\n\
    console.log(this); // 打印 window 对象。\n</script></body></html>\n```\n\n## 构造函数原型属性中的\
    \ `this` 关键字指向实例\n\n当使用 `new` 关键字调用函数时，`this` 的值——如构造函数中所述——指向实例本身。换句话说：我们可以在对象创建之前通过\
    \ `this` 利用该对象。通过这种方式，`this` 的默认值发生的变化类似于使用 `call()` 或 `apply()`。\n\n在接下来的示例中，我们设置了一个\
    \ `Person` 构造函数，它使用 `this` 来引用正在被创建的对象。当创建 `Person` 的实例时，`this.name` 将引用新创建的对象，并在新对象中放置一个名为\
    \ `name` 的属性，其值为传递给构造函数的参数 `(name)`。\n\n示例：sample109.html\n\n```html\n<!DOCTYPE\
    \ html><html lang=\"en\"><<body><script>\nvar Person = function (x) {\n  if (x)\
    \ { this.fullName = x };\n}\n\nPerson.prototype.whatIsFullName = function () {\n\
    \  return this.fullName; // 'this' 指向从 Person() 创建的实例\n}\n\nvar cody = new Person('cody\
    \ lingley');\nvar lisa = new Person('lisa lingley');\n\n// 调用 whatIsFullName 方法，该方法使用\
    \ this 指向实例。\nconsole.log(cody.whatIsFullName(), lisa.whatIsFullName()); // 输出\
    \ 'cody lingley 'lisa lingley'\n\n/* 原型链仍然有效，如果实例不包含 fullName 属性，它将在原型链中查找。接下来，\n\
    我们在 Person 原型和 Object 原型上都添加 fullName。参见此示例后的注释。 */\n\nObject.prototype.fullName\
    \ = 'John Doe';\nvar john = new Person(); // 没有向 fullName 传递参数\nconsole.log(john.whatIsFullName());\
    \ // 输出 'John Doe'.\n\n</script></body></html>\n```\n\n这里需要学习的概念是，`this` 关键字用于引用包含在原型对象方法内部的实例。如果实例不包含，则开始原型链查找。\n\
    \n# 注释\n\n如果实例或 `this` 指向的对象不包含所引用的属性，适用于任何属性查找的相同规则将适用，并在原型链上进行“查找”属性。因此在我们的示例中，如果实例不包含\
    \ `fullName` 属性，将在 `Person.prototype.fullName` 查找，然后是 `Object.prototype.fullName`。\n\
    \n"
