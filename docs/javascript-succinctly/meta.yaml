  - "[PAGE 78]\n\n# All objects inherit from Object.prototype\n\nThe Object() constructor\
    \ function in JavaScript is special, as the prototype property is the last stop\
    \ in the prototype chain.\n\nIn the following sample, I augment the Object.prototype\
    \ with a foo property and then create a string and attempt to access the foo property\
    \ as it were a property of the string instance. Since myString instance does not\
    \ have a foo property, the prototype chain kicks in and the value is looked for\
    \ String.prototype. It is not there, the next place to look is Object.prototype,\
    \ which is the final location JavaScript will look for an object value. The foo\
    \ value is found because I added it, then it returns the value of foo.\n\nSample:\
    \ sample7.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n  Object.prototype.foo\
    \ = 'foo';\nn  var myString = 'bar';\n\n  // Logs 'foo', being found at Object.prototype.foo\
    \ via the prototype chain.\n  console.log(myString.foo);\n</script>\n</body>\n\
    ```\n\n# Notes\n\nCareful! Anything added to Object.prototype will show up in\
    \ a for in loop and the prototype chain. Because of this, it's said that changing\
    \ Object.prototype is forbidden."
