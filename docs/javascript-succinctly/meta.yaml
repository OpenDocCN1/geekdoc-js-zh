    \ is actually defined at\nObject.prototype.toLowerCase\nconsole.log(myArray.toLowerCase());\
    \ // Logs foo,bar.\n\n<script></</body></html>\n```\n\nThe toLowerCase() method\
    \ is not defined within the myArray object. So, the prototype chain is invoked\
    \ and JavaScript looks for the property in the Array's constructor prototype property\
    \ (e.g., Array.prototype). It is not there, so the chain rule is invoked and we\
    \ look for the property in the Object() prototype property (Object.prototype).\
    \ And yes, it is found. Had it not been found, JavaScript would have produced\
    \ an error stating that the property is undefined.\n\nSince all prototype are\
    \ objects, the final link in the chain is Object.prototype. There is no other\
    \ constructor prototype property that can be examined.\n\nThere is an entire chapter\
    \ that breaks down the prototype chain into smaller parts, so if this was completely\
    \ lost on you, read that chapter and then come back to this explanation to solidify\
    \ your understanding. From this short read on the matter, I understand that when\
