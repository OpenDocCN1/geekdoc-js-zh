    \  console.log(typeof 'foo'); // Logs 'string'.\n  console.log(typeof 1); // Logs\
    \ 'number'.\n  console.log(typeof true); // Logs 'boolean'.\n</script></body></html>\n\
    ```\n\nIf your program depends upon the typeof operator to identify string, number,\
    \ or Boolean values in terms of those primitive types, you should avoid the String,\
    \ Number, and Boolean constructors.\n\n## Chapter 7 Null\n\n## Conceptual overview\
    \ of using the null value\n\nYou can use null to explicitly indicate that an object\
    \ property does not contain a value. Typically, if a property is set up to contain\
    \ a value, but the value is not available for some reason, the value null should\
    \ be used to indicate that the reference property has an empty value.\n\nSample:\
    \ sample60.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \ // The property foo is waiting for a value, so we set its initial value\n//to\
    \ null.\n  var myObject = { foo: null };\n  console.log(myObject.foo); // Logs\
    \ 'null'\n</script></body></html>\n```\n\n## Notes\n\nDon't confuse null with\
    \ undefined. undefined is used by JavaScript to tell you that something is missing.\
    \ null is provided so you can determine when a value is expected but not available\
