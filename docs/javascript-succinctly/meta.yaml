    # Replacing the prototype property with a new object does not update former instances


    You might think that you can replace the prototype property entirely at any time
    and all instances will be updated, but this is not correct. When you create an
    instance, that instance will be tied to the prototype that was minted at the time
    of instantiation. Providing a new object as the prototype property does not update
    the connection between instances already created and the new prototype.


    But remember, as I stated, you can update or add to the originally created object
    and those values remain connected to the first instance(s).


    Sample: sample129.html


    ```

    <!DOCTYPE html<html>html lang="en"><body><script>

    var Foo = function Foo() { };


    Foo.prototype.x = 1;


    var FooInstance = new Foo();


    console.log(FooInstance.x); // Logs 1, as you think it would.


    // Now let''s replace/override the prototype object with a new Object(

    object.

    Foo.prototype = { x: 2 };


    console.log(FooInstance.x); // Logs 1. WHAT? Shouldn''t it log 2 becausenwe just
    updated prototype?

    /* FooInstance still references the same state of the prototype object

    that was there when it was instantiated. */


    // Create a new instance of Foo()

    var NewFooInstance = new Foo();


    // The new instance is now tied to the new prototype object value (i.e.

    {x:2});

    console.log(NewFooInstance.x); // Logs 2.

    ```'
