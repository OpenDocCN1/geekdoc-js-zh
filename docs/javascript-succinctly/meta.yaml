    \n## 注意事项\n\n不建议直接利用 `Function()` 构造函数，通常也不会这样做，因为 JavaScript 将使用 `eval()` 来解析构建函数逻辑的字符串。许多人认为\
    \ `eval()` 是不必要的开销。如果使用了它，代码设计中可能存在缺陷。\n\n不带 `new` 关键字使用 `Function()` 构造函数的效果与仅使用构造函数创建对象相同（例如\
