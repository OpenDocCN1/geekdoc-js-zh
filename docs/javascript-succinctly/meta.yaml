    \ at several prototype objects to determine that a property is undefined. A lookup\
    \ always occurs, and this lookup process is how JavaScript handles inheritance\
    \ as well as simple property lookups.\n\n## Using hasOwnProperty to verify that\
    \ an object property is not from the prototype chain\n\nWhile the in operator\
    \ can for properties of an object, including properties from the prototype chain,\
    \ the hasOwnProperty method can check an object for a property that is not from\
