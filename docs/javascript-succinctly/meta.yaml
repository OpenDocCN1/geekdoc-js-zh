    The idea to take away here is that you change a complex value—because it is stored
    by reference—you change the value stored in all variables that reference the complex
    value. In our code, both myObject and copyOfObject are changed when you update
    the object stored in either variable.


    # Notes


    When the values String(), Number(), and Boolean() are created using the new keyword,
    or converted to complex objects behind the scenes, the values continue to be stored/copied
    by value. Even though primitive values can be treated like complex values, they
    do not take on the quality of being copied by reference.


    To truly make a copy of an object, you have to extract the values from the old
    object and inject them into a new object.


    # Complex objects are equal by reference


    When comparing objects, they are equal only when they reference the same object
    (i.e. have the same address). Two variables containing identical objects are not
    equal to each other since they do not actually point at the same object.


    In the following sample, objectFoo and objectBar have the same properties and,
    in fact, identical objects, but when asked they are equal if they ===, JavaScript
    tells us they are not.


    Sample: sample19.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var objectFoo = { same: ''same'' };

    var objectBar = { same: ''same'' };


    // Logs false, JS does not care that they are identical and of the same

    object type.

    console.log(objectFoo === objectBar);


    // How complex objects are measured for equality.

    var objectA = { foo: ''bar'' };

    var objectB = objectA;


    console.log(objectA === objectB); // Logs true because they reference the

    same object.

    </script></body></html>

    ```


    The concept to take away here is that variables that point to a complex object
    in memory are equal only because they are using the same "address." Conversely,
    two independently created objects are not even if they are the same type and possess
    the exact same properties.'
