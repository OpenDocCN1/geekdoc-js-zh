  md: "# Sample: sample123.html\n\n```\n<!DOCTYPE html><html> lang=\"en\"><body><script>\n\
    \  var myArray = [];\n\n  console.log(myArray.foo); // Logs undefined.\n\n  /*\
    \ foo was not found at myArray.foo or Array.prototype.foo\n  Object.prototype.foo,\
    \ so it is undefined. */\n</script></body></html>\n```\n\nTake note that the chain\
    \ stopped with Object.prototype. The last place we looked for foo was Object.prototype.\n\
    \n# Notes\n\nCareful! Anything added to Object.prototype will show up in a for\
    \ in loop.\n\n# The prototype chain returns the first property match it finds\
    \ in the\n\nLike the scope chain, the prototype chain will use the first value\
    \ it finds during the chain lookup.\n\nModifying the previous code example, if\
    \ we added the value to the Object.prototype and Array.prototype objects, and\
    \ then attempted to access a value on an array instance, the value returned would\
