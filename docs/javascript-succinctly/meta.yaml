    \ a function is a value, a function can be passed any sort of value, a function\
    \ can be passed to a function. Functions that take and/or return other functions\
    \ are called \"higher-order functions.\"\n\nIn the following code, we are passing\
    \ an anonymous function to the foo function which we then immediately return from\
    \ the foo function. It is this anonymous function that the var bar points to,\
