  - "[PAGE 101]\n\n# Chapter 13 Scope and Closures\n\n# Conceptual overview of JavaScript\
    \ scope\n\nIn JavaScript, scope is the context in which code is executed. There\
    \ are three types of scope: global scope, local scope (sometimes referred to as\
    \ \"function scope\"), and eval scope.\n\nCode defined with var inside of a function\
    \ is locally scoped, and is only \"visible\" to other expressions in that function;\
    \ which includes code inside nested/child functions. Variables defined in the\
    \ global scope can be accessed from anywhere because it is the highest level and\
    \ last stop in the scope chain.\n\nExamine the code that follows and make sure\
    \ you understand that each declaration of foo is unique of scope.\n\nsample11.html\n\
    \n```\n<DOCTYPE html>html lang=\"en\"><body><script>\nvar foo = 0; // Global scope.\n\
    console.log(foo); // Logs 0.\n\n myFunction = function() {\nvar foo = 1; // Local\
    \ scope.\nconsole.log(foo); // Logs 1.\n\nmyNestedFunction = function() {\nvar\
    \ foo = 2; // Local scope.\nconsole.log(foo); // Logs 2.\n} }();\nneval('var foo\
    \ = 3; console.log(foo)'); // eval scope.\n</script></body></html>\n```\n\nMake\
    \ sure you understand that each foo variable contains a different value because\
    \ each one is defined in a specifically delineated scope.\n\n# Notes\n\nAn unlimited\
    \ number of function and eval scopes can be created, while only one global scope\
    \ is used by a JavaScript environment.\n\nThe global scope is the last stop in\
    \ the scope chain."
  - "[PAGE 102]\n\nFunctions that chain functions create stacked execution scopes.\
    \ These stacks, which are chained together, are often referred to as the scope\
    \ chain.\n\n# JavaScript does not have block scope\n\nSince logic statements (e.g.,\
    \ if) and looping statements (e.g., for) do not create a scope, variables can\
    \ overwrite each other. Examine the code and make sure you understand that the\
    \ value of foo is being redefined as the program executes the code.\n\nSample:\
    \ sample111.html\n\n```\n<<!DOCTYPE html><html> lang=\"en\"><body><script>\n \
    \ var foo = 1; // foo = 1.\n\nif (true) {\n  foo = 2; // foo = 2.\n  for (var\
    \ i = 3; i <= 5; i++) {\n    foo = 1; // foo = 3, 4, 5.\n    console.log(foo);\
    \ // Logs 3, 4, 5.\n  }\n}\n</script></body></html>\n```\n\nSo foo is changing\
    \ as the code executes because JavaScript has no block scope—only function, global,\
    \ or ever scope.\n\n# Use var inside of functions to declare variables and avoid\
    \ scope gotchas\n\nJavaScript will declare any variables lacking a var declaration\
    \ (even those contained in a function or encapsulated functions) in the global\
    \ scope instead of the intended local scope. Have a look at the code that follows\
    \ and notice that without the use of var to declare bar, the variable is actually\
    \ defined in the global scope and not the local scope, where it should be.\n\n\
    Sample: sample112.html\n\n```\n<<!DOCTYPE html><html> lang=\"en\"><body><script>\n\
    \  var foo = function () {\n    var boo = function () {\n      bar = 2; // No\
    \ var used, so bar is placed in the global scope at\n      window.bar\n    }\n\
    \  }();\n```"
  - "[PAGE 103]\n\n```\nconsole.log(bar); // Logs 2, because bar is in the global\
    \ scope.\n\n// As opposed to to...\n\nvar foo = function () {\n  var boo = function\
    \ () {\n    var doo = 2;\n  } ();\n} ();\n```\n\n```\n// console.log(doo); undefined.\
    \ doo is in the boo function scope, so\nan an error occurs\n<script></body></html>\n\
    ```\n\nThe concept to take away is that you should always use var when defining\
    \ variables inside a function. This will prevent you from dealing with potentially\
    \ confusing scope problems. The exception to this convention, of course, is when\
    \ you want to create or change properties in the global scope from within a function.\n\
    \n# The scope chain (aka lexical scoping)\n\nThere is a lookup chain that followed\
    \ when JavaScript looks for the follows associated with a variable. This chain\
    \ is built on the hierarchy of scope. In the code that, I am logging the value\
    \ of sayHiText from the func scope.\n\nSample: sample113.html\n\n```\n<!DOCTYPE\
    \ html lang=\"en\"><body><script>\n\nvar sayHiText = 'howdy';\n\nvar func1 = function\
    \ () {\n  var func2 = function () {\n    console.log(sayHiText); // func2 scope,\
    \ but it finds sayHiText in global scope.\n  } ();n} ();\n</script></body>\n```\n\
    \nHow is the value sayHiText found when it is not contained inside the scope of\
    \ the func2 function? JavaScript first looks inside the func2 function for a variable\
    \ named sayHiText. Not finding func2 there, it looks up func2's parent function,\
    \ func1. The sayHiText variable is not found in the func1 scope, either, so JavaScript\
    \ continues up to the global scope where sayHiText is found, at which point the\
    \ value of sayHiText is delivered. If sayHiText had not been defined in the global\
    \ scope, undefined would have been returned by JavaScript."
  - "[PAGE 104]\n\nThis is a very important concept to understand. Let's examine another\
    \ code example, one in which we grab three values from three different scopes.\n\
    \n**Sample: sample114.html**\n\n```\n<!DOCTYPE><html> lang=\"en\"><body><script>\n\
    \nvar x = 10;\nvar foo = function () {\n  var y = 20;\n  var bar = function ()\
    \ {\n    var z = 30;\n    console.log(z + y + x); // z is local, y and z are found\
    \ in the\n  scope chain.\n  }()\n}\nfoo(); // Logs 60.\n\n</script></html>\n```\n\
    \nThe value for z is local to the bar function and the context in which the console.log\
    \ is invoked. The value for y is in the foo function, which is the parent of bar(),\
    \ and the value for x is in the global scope. All of these are accessible to the\
    \ bar function via the scope chain. Make sure you understand that referencing\
    \ variables in the bar function will check all the scope chain for their variables.\n\
    \n**Notes**\nThe scope chain, if you think about it, is not different from the\
    \ prototype chain. Both are simply a way for a value to be looked up by checking\
    \ a systematic and hierarchical set of locations.\n\n# The scope chain lookup\
    \ returns the first found value\n\nIn the code sample that follows, a variable\
    \ named x exists in the same scope in which it is examined with console.log. That\
    \ one might say that \"local\" value of x is used, it shadows, or masks, the identically\
    \ named variables found up in the scope chain.\n\n**Sample: sample115.html**\n\
    \n```\n<!DOCTYPE><html> lang=\"en\"><body><script>\n\nvar x = false;\nvar foo\
    \ = function () {\n  var x = false;\n  var bar = function () {\n    var x = true;\
    \ // Local x is first in the scope so it shadows the\n    rest.\n    console.log(x);\n\
    \n```"
  - "[PAGE 105]\n\n```\n} ();\n}\nfoo(); // Logs true.\n<script></body></html>\n```\n\
    \nRemember that the scope looks up when the variable is found in the nearest available\
    \ link of the chain, even if the same variable name is used further up the chain.\n\
    \n# Scope is decided during function definition, not invocation\n\nSince functions\
    \ determine scope and functions can be passed around just like any JavaScript\
    \ value, one might think that deciphering the scope chain is complicated. It is\
    \ actually very simple. The scope chain is decided by the location of a function\
    \ during definition, not during invocation. This is also called lexical scoping.\
    \ Think long and hard about this, as most people stumble over it often in JavaScript\
    \ code.\n\nThe scope is created before you invoke a function. Because of this,\
    \ we can create closures. For example, we can have a function return a nested\
    \ function to the global scope, yet our function can still access the scope chain,\
    \ its parent function's scope. In the following sample, we define a parentFunction\
    \ that returns an anonymous function, and we call the returned function from the\
    \ global scope. Because our anonymous function was defined as being inside parentFunction,\
    \ it still has access to parentFunction's scope when it is invoked. This is called\
    \ closure.\n\nSample: sample116.html\n\n```\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\nvar parentFunction = function () {\n  var foo = 'foo';\n  return\
    \ function () { // Anonymous function being returned\n    console.log(foo); //\
    \ Logs 'foo'.\n  }\n}\n// nestedFunction refers to the nested function returned\
    \ from parentFunction.\nvar nestedFunction = parentFunction();\n\nnestedFunction();\
    \ // Logs foo because the returned function accesses foo via the scope chain.\n\
    </script></body></html>\n```"
- md: "\nThe idea you should take away here is that the scope chain is determined\
    \ during definition—literally in the way the code is written. Passing around functions\
    \ inside of your code will not change the scope chain.\n\n## Closures are caused\
    \ by the scope chain\n\nTake what you have learned about the scope chain and scope\
    \ lookup in this chapter, and a closure should not be overly complicated to understand.\
    \ In the following sample, we create a function called countUpFromZero. This function\
    \ returns a reference to the child function contained within it. This child function\
    \ (nested) is invoked, it has access to the parent's function because of the scope\
    \ chain.\n\n**Sample: sample11.html**\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body<script>\nvar countUpFromZero = function () {\n  var count = 0;\n  return\
    \ function () // Return nested child function\n    return count++; // count is\
    \ defined up the scope chain, in the parent\n  };\n})(); // Invoke immediately,\
    \ return nested function.\n\nconsole.log(countUpFromZero()); // Logs 1.\nconsole.log(countUpFromZero());\
    \ // Logs 2.\nconsole.log(countUpFromZero()); // Logs 3.\n</script></body></html>\n\
    ```\n\nEach time the countUpFromZero function is invoked, the anonymous function\
    \ contained in (and returned from) the countUpFromZero function still has access\
    \ to the parent's scope. This technique, facilitated by the scope chain, is an\
    \ example of a closure.\n\n## Notes\n\nIf you feel I have over-simplified closures,\
    \ you are likely correct in this thought. But I did so purposely as I believe\
    \ the important parts come from a solid understanding of functions and scope,\
    \ not necessarily the complexities of execution context. If you are in need of\
    \ in-depth dive into closures, have a look at JavaScript Closures.\n\n## Chapter\
    \ 14 Function Prototype Property\n\n### Conceptual overview of the prototype chain\n\
    \nThe prototype property is an object created by JavaScript for every Function()\
    \ instance. It links object instances created with the new keyword back to the\
    \ constructor function that created them. This is done so that instances can share,\
    \ or inherit, methods and properties. Importantly, the search occurs during property\
    \ lookup. Remember from Chapter 1 every time you look up or access a property\
    \ on an object, the property will be searched for on the object as well as the\
    \ prototype chain.\n\n### Notes\n\nA prototype object is created for every function,\
    \ regardless of whether you intend to use that function as a constructor.\n\n\
    In the following code, I will construct an array from the Array() constructor,\
    \ and then I invoke the join() method.\n\nSample: sampleprototype118.html\n\n\
    ```html\n<!DOCTYPE html><html lang=\"en\"><body<script>\n  var myArray = new Array('foo',\
    \ 'bar');\n\n  console.log(myArray.join()); // Logs 'foo,bar'\n\n</script></body></html>\n\
    ```\n\nThe join() method is not defined as a property of the myArray object instance,\
    \ but somehow we have access to join() as if it were. This method is defined somewhere,\
    \ but where? Well, it is defined as a property of the Array() constructor's prototype\
    \ property. Since join() is not found within the array object instance, JavaScript\
    \ looks up the prototype chain for a method join().\n\nOk, why are things done\
    \ this way? Really, it is about efficiency and reuse. Why every array instance\
    \ created from the array constructor have a uniquely defined join() method when\
    \ join() always functions the same way? It makes more sense for all arrays to\
    \ leverage the same join() function without having to create a new instance of\
    \ the function for each array.\n\nThis efficiency we speak of is all possible\
    \ because of the prototype property, prototype linkage, and the prototype lookup\
    \ chain. In this chapter, we break down these often confusing attributes of prototypal\
    \ inheritance. But truth told, you would be better off by simply memorizing the\
    \ mechanics of how the chain hierarchy actually works. Refer back to Chapter 1\
    \ if you need a refresher on how property values are resolved.\n\n## Why care\
    \ about the prototype property?\n\nYou should care about the prototype property\
    \ for four reasons.\n\n## Reason 1\n\nThe first reason is that the prototype is\
    \ used by the native constructor functions (e.g., Object(), Array(), Function(),\
    \ etc.) to allow constructor instances to inherit properties and methods. It is\
    \ the mechanism that JavaScript itself uses to allow instances to inherit properties\
    \ and methods from the constructor function's prototype property. If you want\
    \ to understand JavaScript better, you need to understand how JavaScript leverages\
    \ the prototype object.\n\n## Reason 2\n\nWhen creating user-defined constructor\
    \ functions, you can orchestrate inheritance the way JavaScript native objects\
    \ do. But you first have to learn how it works.\n\n## Reason 3\n\nYou might dislike\
    \ prototype inheritance or prefer another pattern for object inheritance, but\
    \ the reality is that someday you might have to edit or manage someone's code\
    \ you thought prototypal inheritance was the bee's knees. When this happens, you\
    \ should be aware of how prototypal inheritance works, as well as how it can be\
    \ replicated by developers who use custom constructor functions.\n\n## Reason\
    \ 4\n\nBy using prototype inheritance, you can create efficient object instances\
    \ that leverage the same methods. As already mentioned, not all objects, which\
    \ are instances of the Array() constructor, need their own join() methods. All\
    \ instances can leverage the same join() method because the method is stored in\
    \ the prototype chain.\n\n## Prototype is standard on all Function() instances\n\
    \nAll functions are created from a Function(), even if you do not directly inherit\
    \ the Function() (e.g., var add = new Function('x', 'y', 'return x + z')) and\
    \ instead use the literal notation (e.g., var add = function(x,y){return x + z}).\n\
    \nWhen an instance is created, it is always given a prototype property, which\
    \ is an empty object. In the following sample, we define a function called myFunction\
    \ and then access the prototype property which is an empty object.\n\nSample sample119.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body<script>\n\nvar myFunction =\
    \ function () {}\n  console.log(myFunction.prototype); // Logs object{}\n  console.log(typeof\
    \ myFunction.prototype); // Logs 'object'.\n\n</script></body></html>\n```\n\n\
    Make sure you completely understand that the prototype property is coming from\
    \ the Function() constructor. It is only once we intend to use our function as\
    \ a user-defined constructor that the prototype property is leveraged, but this\
    \ does not change the fact that the Function() constructor gives each instance\
    \ property.\n\n## The default prototype property is an Object() object\n\nAll\
    \ this prototype talk can get a bit heavy. Truly, prototype is just an empty property\
    \ called \"prototype\" created between the scenes by JavaScript and made available\
    \ by invoking the Function() constructor. If you were to do it manually, it would\
    \ look something like this:\n\nSample: sample120.Html\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body<script>\nvar myFunction = function () { };\nfunction.prototype\
    \ = {}; // Add the prototype property and set it to an\nempty object.\nconsole.log(myFunction.prototype);\
