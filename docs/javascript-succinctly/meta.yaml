    \  console.log(sayHi()); // 打印 \"Hi\"\n</script>\n</</body>>\n</html>\n```\n\n\
    如果函数没有返回值，则返回 `undefined`。在接下来的示例中，我们调用了 `yelp` 函数，它向控制台打印了字符串 'yelp'，而没有显式返回一个值。\n\
    \n示例：sample79.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body\n<script>\n\
