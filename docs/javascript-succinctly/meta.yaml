    # Notes


    The term "complex object" has also been expressed in other writings as "composite
    objects" or

    "reference types." If it''s not obvious, all these names describe the nature of
    a JavaScript value

    excluding primitive values. Primitive values are not "referenced by value" and
    cannot represent

    a composite (i.e. a thing made up of several parts or elements) of other values,
    while complex

    objects are "referenced by value" and can contain other values.


    # How complex values are stored/copied in JavaScript


    It is extremely important to understand that complex values are stored and manipulated
    by

    reference. When creating a variable containing a complex object, the value is
    stored in memory

    at an address. When you refer to a complex object, you''re using its name (i.e.
    variable or

    object) to retrieve the value at that address. The implications are significant

    when you consider you attempt to copy a complex value. In the next

    sample, we create an object stored in the variable myObject. The value in myObject
    is then

    cop to the variable copyOfObject. Really, it is not a copy of the object—more
    like a copy

    at the address of the object.


    Sample: sample18.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    var myObject = {};n

    var copyOfObject = myObject; // Not copied by value, just the reference

    is copied.


    myObject.foo = ''bar''; // Manipulate the value stored in myObject.


    /* If we log copy and copyOfObject, they will have a foo property

    because they reference the same object. */


    console.log(myObject, copyOfObject); // Logs ''Object { foo="bar"}

    Object { foo="bar"}


    </script></html>

    ```


    What you need to realize is that, unlike primitive values that would copy a value,
    objects (aka

    complex values) are stored by reference. As such, the reference (address) is copied,
    but

    t the actual value. This means objects are not copied at all. Like I said, what
    is copied

    t address or reference to the object in the memory stack. In our code example,
    myObject

    and copyOfObject points to the same object stored in memory.'
