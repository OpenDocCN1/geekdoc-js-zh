  md: "# Chapter 10 Object()\n\n# Conceptual overview of Object() objects\n\nUsing\
    \ the built-in Object() constructor function can create generic empty objects\
    \ on the fly. In fact, if you remember back to the beginning of Chapter 1, this\
    \ is exactly what we did by creating the cody object. Let's recreate the cody\
    \ object.\n\nSample: sample69.html\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  var cody = new Object(); // Create an empty object with no properties.\n\n\
    \  for (key in cody) { // Confirm that cody is an empty generic object.\n    if\
    \ (cody.hasOwnProperty(key)) {\n      console.log(key); // Should not see any\
    \ logs, because cody itself has no properties.\n    }\n  }\n</script></body></html>\n\
    ```\n\nHere, all we are using the Object() constructor function to create a generic\
    \ called cody. You can think of the Object() constructor as a cookie cutter for\
    \ creating empty objects that have no predefined properties or methods (except,\
    \ of course, those inherited from the prototype chain).\n\n# Notes\n\nIf it's\
    \ not obvious, the Object() constructor is an object itself. That is, the constructor\
    \ function is based on an object created from the Array constructor, the Object\
    \ constructor simply spits out blank objects. And yes, you can create all the\
    \ objects you like. However, creating an empty object like cody is very different\
    \ from creating your own constructor function with predefined properties. Make\
    \ sure you understand that cody is just an empty object based on the Object()\
    \ constructor. To fully harness the power of JavaScript, you will need to learn\
    \ not only how to create empty objects from Object(), but also how to build your\
    \ own \"class\" of objects (e.g., Person()) like the Object() constructor itself.\n\
    \n# Object() parameters\n\nThe Object() constructor function takes one optional\
    \ parameter. That parameter is the value you would like to create. If you provide\
    \ no parameter, then a null or undefined value will be assumed."
