  md: "```\nvar myArrayLength = myArray.length; // Cache array length to avoid\nunnecessary\
    \ lookup.\nvar counter = 0; // Set up counter.\n\nwhile (counter < myArrayLength)\
    \ { // Run if counter is less than array\nlength.\nconsole.log(myArray[counter]);\
    \ // Logs 'blue', 'green', 'orange',\n'red'.\n  counter++; // Add 1 to the counter.\n\
    }\n\n<script></body></html>\n```\n\nAnd we now go from the end of the index to\
    \ the beginning.\n\n**Sample: sample143.html\n\n```\n<!DOCTYPE html><html> lang=\"\
    en\"><body><script>\n\nvar myArray = ['blue', 'green', 'orange', 'red'];\n\nvar\
    \ myArrayLength = myArray.length;\nwhile (myArrayLength--) { // If length is not\
    \ zero, loop and\nubtract 1.\n  console.log(myArray[myArrayLength]); // Logs 'red',\
    \ 'orange',\n'green', 'blue'.\n}\n\n</script></body></html>\n```\n\nIf you are\
    \ wondering why I am not showing for loops here, it is because while loops have\
    \ fewer moving parts and I believe they are easier to read."
