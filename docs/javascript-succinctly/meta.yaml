    ```\n"
  mdcn: "\n\n# 示例:sample121.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  // 此代码仅在支持 __proto__ 访问的浏览器有效。\n  Array.prototype.foo = 'foo';\n  var myArray\
    \ = new Array();\n\n  console.log(myArray.__proto__.foo); // 输出 foo，因为\n  myArray.__proto__\
