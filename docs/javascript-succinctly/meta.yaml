    好了，原始字符串、数字和布尔值的情况稍微复杂一些。在这些情况下，字面量具有原始值的特征，而不是复杂对象。请查看后面的注释。


    ## 注意事项


    在使用字面量用于 `String()`、`Number()` 和 `Boolean()` 时，在这些值被视为对象之前，永远不会创建实际的对象。换句话说，在你尝试使用或检索与构造函数相关的属性之前，你处理的是原始数据类型（例如
    `var charactersFoo = ''foo''.length`）。当这种情况发生时，JavaScript 会在后台为该字面量值创建一个包装对象，允许该值被视为对象。然后，在调用方法之后，JavaScript
    会丢弃包装对象，值返回字面量类型。这就是为什么字符串、数字和布尔值被认为是原始（或简单）数据类型。这澄清了“JavaScript 中的一切都是对象”的这一误解，正确的概念是“JavaScript
    中的一切都可以像对象一样工作**”。


    ## 原始（又称简单）值


    JavaScript 值 `5`、`''Foo''`、`true`、`false` 以及 `null` 和 `undefined` 被认为是原始值，因为它们是不可还原的。也就是说，数字就是数字，字符串就是字符串，布尔值是
    `true` 要么 `false`，而 `null` 和 `undefined` 仅仅如此。这些值本质上是简单的，不代表由其他值组成的值。


    检查以下代码并问自己：字符串、数字、布尔值、`null` 和 `undefined` 值。


    ## 示例：sample12.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var myString = ''string''

    var myArray = 10;

    var myBoolean = false;

    var myNull = null;

    var myUndefined = undefined;


    console.log(myString, myArray, myBoolean, myNull, myUndefined);


    var myObject = {

    myString: ''string'',

    Number: 10,

    myBoolean: false,

    myNull: null,

    myUndefined: undefined

    };


    console.log(myObject);


    var myArray = [''string'', 10, false, null, undefined];


    console.log(myArray);

    </script></body></html>

    ```


    简单来说，原始值代表 JavaScript 中可用的最低形式（即简单）的数据。


    ## 注意事项


    与使用字面量语法创建相反，当使用 `new` 关键字创建 `String()`、`Number()` 或 `Boolean()` 值时，创建的是一个复杂对象。


    至关重要的是理解：`String()`、`Number()` 和 `Boolean()` 构造函数是双用途构造函数，用于创建字面量/原始值以及复杂值。这些构造函数并不总是返回对象，相反，在不使用
    `new` 运算符时，它们可以返回实际复杂值的原始表示。


    ## 原始值 `null`、`undefined`、`"string"`、`10`、`true` 和 `false` 不是对象


    `null` 和 `undefined` 值是平凡的值，不需要构造函数，也不需要使用 `new` 运算符来建立为 JavaScript 值。要使用 `null`
    或 `undefined`，你只需要像使用运算符一样使用它们即可。


