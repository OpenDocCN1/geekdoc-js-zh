- md: "\nThe key idea to take away here is that object's prototype should not be replaced\
    \ with a new object once you start creating instances. Doing so will result in\
    \ instances that have a link to different prototypes.\n\n## User-defined constructors\
    \ can leverage the same prototype inheritance as native constructors\n\nHopefully\
    \ at this point in the chapter, it is sinking in how JavaScript leverages the\
    \ prototype for inheritance (e.g., Array.prototype). This same pattern can be\
    \ leveraged when creating non-native, user-defined constructor functions. In the\
    \ following sample, we take the classic Person object and mimic the pattern that\
    \ JavaScript uses for inheritance.\n\n**Sample: sample130.html**\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><<body><script>\nvar Person = function () {\n\
    \  // All Person inherits the legs, arms, and countLimbs properties.\n  Person.prototype.legs\
    \ = 2;\n  Person.prototype.arms = 2;\n  Person.prototype.countLimbs = function\
    \ () { return this.legs + this.arms; };\n};\n\nvar chuck = new Person();\nconsole.log(chuck.countLimbs());\
    \ // Logs 4.\n</script></body></html>\n```\n\nIn this code, a Person() constructor\
    \ function is created. We then add properties to the prototype property of Person(),\
    \ which can be inherited by all instances. Clearly, you can leverage the prototype\
    \ chain in your code the same way that JavaScript leverages it for native object\
    \ inheritance.\n\nAs an example of how much you might inherit, you can create\
    \ a constructor function whose instances inherit the Legs and arms properties\
    \ if they are not provided as parameters. In the following sample, if the Person()\
    \ constructor is sent parameters, the parameters are used as instances properties,\
    \ but if one or more properties are not provided, there is a fallback. These instance\
    \ properties then shadow or mask the inherited properties, giving you the best\
    \ of both worlds.\n\n**Sample: sample131.html**\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><<body><script>\nvar Person = function (legs, arms) {\n  // Shadow\
    \ prototype value.\n  if (legs !== undefined) { this.legs = legs; }\n  if (arms\
    \ !== undefined) { this.arms = arms; }\n}\n\nPerson.prototype.legs = 2;\nPerson.prototype.arms\
    \ = 2;\nPerson.prototype.countLimbs = function () { return this.legs + this.arms;\
    \ };\n\nvar chunk = new Person(0, 0);\nconsole.log(chunk.countLimbs()); // Logs\
    \ 0.\n</script></body></html>\n```\n\n## Creating inheritance chains (the original\
    \ intention)\n\nPrototypal inheritance allows for inheritance chains that mimic\
    \ the patterns found in traditional object programming languages. In order for\
    \ one object to inherit from another object in JavaScript, all you have to do\
    \ is create an instance of the object you want to inherit and assign it to the\
    \ prototype property of the object that is inheriting.\n\nIn the code sample below,\
    \ Chef objects (i.e. cody) inherit from Person(). This means that if a property\
    \ is not found in a Chef object, it will be looked for on the prototype of the\
    \ function that created Person() objects. To wire up the inheritance, all you\
    \ have to do is instantiate an instance of Person() as the value for Chef.prototype\
    \ (i.e. Chef.prototype = new Person()).\n\n**Sample: sample132.html**\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><<body><script>\nvar Person = function () { this.bar\
    \ = 'bar'; };\nPerson.prototype.foo = 'foo';\n\nvar Chef = function () { this.goo\
    \ = 'goo'; };\nChef.prototype = new Person();\nvar cody = new Chef();\n\nconsole.log(cody.foo);\
    \ // Logs 'foo'\nconsole.log(cody.goo); // Logs 'goo'\nconsole.log(cody.bar);\
    \ // Logs 'bar'.\n</script></body></html>\n```\n\nAll we did in this sample was\
    \ leverage a system that was already in place with the native objects. Consider\
    \ that Person() is not unlike the default Object() value for prototype properties.\
    \ In other words, this is exactly what happens when a prototype property, containing\
    \ its default empty Object() value, looks to the prototype of the constructor\
    \ function created (i.e. Object.prototype) for inherited properties.\n\n## Chapter\
    \ 15 Array()\n\n### Conceptual overview of using Array() objects\n\nAn array is\
    \ an ordered list of values typically created with the intention of looping through\
    \ numerically indexed values, beginning with the index zero. What you need to\
    \ know is that arrays are numerically ordered, as opposed to objects which have\
    \ property names associated with values in non-numeric order. Essentially, arrays\
    \ use numbers as a lookup key, while objects have user-defined property names.\
    \ JavaScript does not have true associative arrays, but objects can be used to\
    \ achieve the functionality of associative arrays.\n\nIn the following sample,\
    \ I store four strings in myArray that I can access using a numeric index. I compare\
    \ and contrast myArray to an object literal mimicking an associative array.\n\n\
    **Sample: sample133.html**\n\n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\n\
    \  var myArray = ['blue', 'green', 'orange', 'red'];\n\n  console.log(myArray[0]);\
    \ // Logs blue using the 0 index to access the string in myArray.\n\n  // Versus\n\
    \  var myObject = { // aka an associative array/hash, known as an object in JavaScript.\n\
    \    'blue': 'blue',\n    'green': 'green',\n    'orange': 'orange',\n    'red':\
    \ 'red'\n  };\n\n  console.log(myObject['blue']); // Logs blue\n</script></body></html>\n\
    ```\n\n### Notes\n\nArrays can hold any type, and these values can be updated\
    \ or deleted at any time. An array is just a collection of values. Values contained\
    \ in an array are commonly referred to as elements.\n\n### Array parameters\n\n\
    You can pass values to the array using the constructor. However, if only one parameter\
    \ is sent to the constructor, it will be used to set the length.\n\n**Sample:\
    \ sample134.html**\n\n```html\n<!DOCTYPE html><html lang=\"en\"><<body><script>\n\
    \  var foo = new Array('foo', 'bar');\n  console.log(foo[0], foo.length); // Logs\
    \ foo 2\n\n  var bar = new Array(3);\n  console.log(bar[0], bar.length); // Logs\
    \ undefined 3\n</script></body></html>\n```\n\n### Array properties and methods\n\
