- md: "\n# Functions can be nested\n\nFunctions can be nested inside of other functions\
    \ indefinitely. In the following code sample, we encapsulate the foo function\
    \ inside of the bar function which is inside of the foo function.\n\nSample: sample94.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = function\
    \ () {\n  var bar = function () {\n    var goo = function () {\n      console.log(this);\
    \ // Logs reference to head window object.\n    }\n  }\n}();\n</script></body></html>\n\
    ```\n\nThe simple concept here is that functions can be nested and there is no\
    \ limit to how deep the nesting can be.\n\n# Notes\n\nRemember, the value of this\
    \ for nested functions will be the head object (e.g., the window object in a web\
    \ browser) in JavaScript 1.5, ECMA-262, Edition 3.\n\n# Passing functions to functions\
    \ and returning functions from functions\n\nAs previously mentioned, functions\
    \ are first-class citizens in JavaScript. Since a function is a value, a function\
    \ can be passed any sort of value, a function can be passed to a function. Functions\
    \ that take and/or return other functions are called \"higher-order functions.\"\
    \n\nIn the following code, we are passing an anonymous function to the foo function\
    \ which we then immediately return from the foo function. It is this anonymous\
    \ function that the var bar points to, so foo accepts and returns the anonymous\
    \ function.\n\nSample: sample95.html\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\n// Functions can be sent to, and sent back from, functions.\n\
    var foo = function (f) {\n  return f;\n}\nvar bar = foo(function () { console.log('Hi');\
    \ });\n\nbar(); // Logs 'Hi'.\n</script></body></html>\n```\n\nSo when bar is\
    \ invoked, it invokes the anonymous function that was passed to the foo() function,\
    \ which is then passed back from the foo() function and referenced from the bar\
    \ variable. This is also to showcase the fact that functions can be passed around\
    \ just like any other value.\n\n# Invoking function statements before they are\
    \ defined (aka function hoisting)\n\nA function statement can be invoked during\
    \ execution before its actual definition. This is a bit odd, but you should be\
    \ aware of it so you leverage it, or at least know what's going on when you encounter\
    \ it. In the following sample, I invoke the sayYo() and sum() function statements\
    \ before they are defined.\n\n**sample96.html**\n\n```html\n<!DOCTYPE html lang=\"\
    en\"><body><script>\n\n// Example 1\nvar speak = function () {\n  sayYo(); //\
    \ sayYo() has not been defined yet, but it can still be\n  invoked, logs 'Yo'.\n\
    \  function sayYo(){ console.log('Yo'); }\n}; // Invoke\n\n// Example 2\nconsole.log(sum(2,\
    \ 2)); // Invoke sum(), which is not defined yet, but\ncan still be invoked.\n\
    function sum(x, y) { return x + y; }\n\n</script></body></html>\n```\n\nThis happens\
    \ before the code runs, function statements are interpreted and added to the execution\
    \ stack/context. Make sure you are aware of this as you use function statements.\n\
    \n# Notes\n\nFunctions defined as function expressions are not hoisted. Only function\
    \ statements are hoisted.\n\n# A function can call itself (aka recursion)\n\n\
    It's perfectly legitimate for a function to call itself. This is often used in\
    \ well-known coding patterns. In the code that follows, we kick off the countDownFrom\
    \ function, which then calls it via the function name countDownFrom. Essentially,\
    \ this creates a loop that counts from 5 to 0.\n\n# Sample: sample97.html\n\n\
    ```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar countDown = function\
    \ countDownFrom(num) {\n  console.log(num);\n  num--; // Change the parameter\
    \ value.\n  if (num < 0) { return false; } // If num < 0 return function with\
    \ no recursion.\n  // Could have also done arguments.callee(num) if it was an\
    \ anonymous function;\n  countDownFrom(num);\n}\ncountDownFrom(5); // Kick off\
    \ the function, which logs separately 5, 4, 3, 2, 1, 0.\n</script>\n```\n\nYou\
    \ should be aware that it's natural for a function to invoke itself (aka recursion)\
    \ or to do so repetitively.\n\n# Chapter 12 The this Keyword\n\n## Conceptual\
    \ overview of this and how it refers to\n\nWhen a function is created, a keyword\
    \ called this is created (behind the scenes), which links to the object in which\
    \ the function operates. Said another way, this is available to the scope of its\
    \ function, yet is a reference to the object of which function is a property or\
    \ method.\nLet's take a look at the cody object from Chapter 1 again:\n\nSample:\
    \ 98.html\n\n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = {\n\
    \  living: true,\n  age: 23,\n  gender: 'male',\n  getGender: function () { return\
    \ cody.gender; }\n}\nconsole.log(cody.getGender()); // Logs 'male'\n</script></body>\n\
    ```\n\nNotice how the Getter function, we are accessing the gender property using\
    \ dot notation (e.g., cody.gender) on the cody object itself. This can be rewritten\
    \ using this to access the cody object this points to the cody object.\n\nSample:\
    \ 99.html\n\n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = {\n\
    \  living: true,\n  age: 23,\n  gender: 'male',\n  getGender: function () { return\
    \ this.gender; }\n}\nconsole.log(cody.getGender()); // Logs 'male'\n</script></body>\n\
    ```\n\nNotice how the Getter function, we are accessing the gender property using\
    \ dot notation (e.g., cody.gender) on the cody object itself. This can be rewritten\
    \ using this to access the cody object this points to the cody object.\n\n# How\
    \ is the value of this determined?\n\nThe value of this is based on the context\
    \ in which the function is called. Pay attention to this, because this is one\
    \ of those topics you need to.\n\nSample: 101.html\n\n```html\n<!DOCTYPE html\
    \ lang=\"en\"><body><script>\nwindow.foo = 'foo';\nwindow.myObject = { foo: 'I\
    \ am myObject.foo' };\n\nwindow.sayFoo = function () {\n  console.log(this.foo);\n\
    };\n\nwindow.myObject.sayFoo = window.sayFoo;\n\nwindow.myObject.sayFoo(); //\
    \ Logs 'I am myObject.foo'.\nwindow.sayFoo(); // Logs 'foo'.\n</script></</body>\n\
    </html>\n```\n\nMake sure as you pass around functions, or have multiple references\
    \ to a function, you realize that the value of `this` will change depending on\
    \ the context in which you call the function.\n\n# Notes\n\nAll variables except\
    \ `this` and `arguments` follow lexical scope.\n\n# The this keyword refers to\
    \ the head object in functions\n\nYou might be wondering what happens to `this`\
    \ when it is used inside of a function that is contained inside another function.\
    \ The bad news is in ECMA 3, `this` loses its way and refers to the head object\
    \ (the `window` object in browsers), instead of the object within which the function\
    \ is defined.\n\nIn the following code, `this` inside of `func2` and `func3` loses\
    \ its way and refers not to `myObject` but instead to the head object.\n\nSample:\
    \ 102.html\n\n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar myWeb =\
    \ {\n  func1: function () {\n    console.log(this); // Logs myObject.\n    var\
    \ func2 = function () {\n      console.log(this) // Logs window, and will do so\
    \ from this point on.\n      var func3 = function () {\n        console.log(this);\
    \ // Logs window, as it’s the head object.\n      } ();\n    })();\n  }\n}\n</script></body>\n\
    </html>\n```\n"
  mdcn: "\n\n# 函数可以嵌套\n\n函数可以无限地嵌套在其他函数内部。在下面的代码示例中，我们将 `foo` 函数封装在 `bar` 函数内部，而 `bar`\
    \ 函数又在 `foo` 函数内部。\n\n示例：sample94.html\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\nvar foo = function () {\n  var bar = function () {\n    var\
    \ goo = function () {\n      console.log(this); // 记录头 对象的引用。\n    }\n  }\n}();\n\
    </script></body></html>\n```\n\n这里的简单概念是函数是可以嵌套的，且嵌套深度没有限制。\n\n# 注意\n\n请记住，在 JavaScript\
    \ 1.5、ECMA-262 第 3 版中，嵌套函数的 `this` 值将是头对象（例如 浏览器中的 `window` 对象）。\n\n# 将函数传递给函数并从函数返回函数\n\
    \n如前所述，函数是 JavaScript 中的一等公民。由于函数是一个值，因此函数可以接收任何类型的值，函数可以传递给另一个函数。接收和/或返回其他函数的被称为“高阶函数”。\n\
    \n在下面的代码中，我们向 `foo` 函数传递了一个匿名函数，然后立即将其从 `foo` 函数中返回。`var bar` 指向的就是这个匿名函数，因此 `foo`\
    \ 接收并返回了该匿名函数。\n\n示例：sample95.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\n// 函数可以发送给函数，也可以从函数返回。\nvar foo = function (f) {\n  return f;\n\
    }\nvar bar = foo(function () { console.log('Hi'); });\n\nbar(); // 记录 'Hi'.\n\
    </script></body></html>\n```\n\n所以，当 `bar` 被调用时，它调用了传递给 `foo()` 函数的匿名函数，该匿名函数随后从\
    \ `foo()` 函数返回并被 `bar` 变量引用。这也是为了展示函数可以像任何其他值一样被到处传递。\n\n# 在函数定义之前调用函数语句（又名函数提升）\n\
    \n函数语句可以在执行过程中在其实际定义之前被调用。这有点奇怪，但你应该意识到这一点，以便利用它，或者至少在遇到它时知道发生了什么。在下面的示例中，我在定义\
    \ `sayYo()` 和 `sum()` 函数语句之前调用了它们。\n\n**sample96.html**\n\n```html\n<!DOCTYPE\
    \ html lang=\"en\"><body><script>\n\n// 示例 1\nvar speak = function () {\n  sayYo();\
    \ // sayYo() 尚未被定义，但仍然可以被\n  调用，记录 'Yo'。\n  function sayYo(){ console.log('Yo');\
    \ }\n}; // 调用\n\n// 示例 2\nconsole.log(sum(2, 2)); // 调用 sum(),它尚未定义，但\n仍然可以被调用。\n\
    function sum(x, y) { return x + y; }\n\n</script></body></html>\n```\n\n这发生在代码运行之前，函数语句会被解释并添加到执行栈/上下文中。在在使用函数语句时，请确保你了解这一点。\n\
    \n# 注意\n\n定义为函数表达式的函数不会被提升。只有函数语句会被提升。\n\n# 函数可以调用自己（又名递归）\n\n函数调用它本身是完全合法的。这通常用于著名的代码模式。在接下来的代码中，我们启动了\
    \ `countDownFrom` 函数，然后它通过函数名 `countDownFrom` 调用自己。本质上讲，这创建了一个从 5 数到 0 的循环。\n\n\
    # 示例：sample97.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var countDown = function countDownFrom(num) {\n  console.log(num);\n  num--; //\
    \ 修改参数值。\n  if (num < 0) { return false; } // 如果 num < 0 则返回没有递归的函数。\n  // 如果是匿名函数，也可以使用\
    \ arguments.callee(num);\n  countDownFrom(num);\n}\ncountDownFrom(5); // 启动函数，它分别记录\
    \ 5, 4, 3, 2, 1, 0。\n</script>\n```\n\n你应该意识到，函数调用自己（又名递归）或重复地这样做是自然的。\n\n# 第\
    \ 12 章 this 关键字\n\n## this 的概念性概述以及它是如何引用的\n\n当一个函数被创建时，会创建一个名为 `this` 的关键字（在后台），它链接到函数操作时所在的对象对象。换句话说，`this`\
    \ 在其函数的作用范围内是可用的，但它是对该函数作为属性或方法的对象的引用。\n让我们看看第 1 章中的 `cody` 对象：\n\n示例：98.html\n\
    \n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = {\n  living:\
    \ true,\n  age: 23,\n  gender: 'male',\n  getGender: function () { return cody.gender;\
    \ }\n}\nconsole.log(cody.getGender()); // 记录 'male'\n</script></body>\n```\n\n\
    注意 Getter 函数，我们正在 `cody` 对象本身上使用点符号法（例如 `cody.gender`）访问 `gender` 属性。可以使用 `this`\
    \ 重写，以访问 `this` 指向的 `cody` 对象。\n\n示例：99.html\n\n```html\n<!DOCTYPE html lang=\"\
    en\"><body><script>\nvar cody = {\n  living: true,\n  age: 23,\n  gender: 'male',\n\
    \  getGender: function () { return this.gender; }\n}\nconsole.log(cody.getGender());\
    \ // 记录 'male'\n</script></body>\n```\n\n注意 Getter 函数，我们正在 `cody` 对象本身上使用点符号法（例如\
    \ `cody.gender`）访问 `gender` 属性。可以使用 `this` 重写，以访问 `this` 指向的 `cody` 对象。\n\n# this\
    \ 的值是如何确定的？\n\n`this` 的值基于函数被调用时的上下文。注意这一点，因为这是你需要掌握的主题之一。\n\n示例：101.html\n\n\
    ```html\n<!DOCTYPE html lang=\"en\"><body><script>\nwindow.foo = 'foo';\nwindow.myObject\
    \ = { foo: 'I am myObject.foo' };\n\nwindow.sayFoo = function () {\n  console.log(this.foo);\n\
    };\n\nwindow.myObject.sayFoo = window.sayFoo;\n\nwindow.myObject.sayFoo(); //\
    \ 记录 'I am myObject.foo'.\nwindow.sayFoo(); // 记录 'foo'.\n</script></</body>\n\
    </html>\n```\n\n确保在传递函数或对一个函数有多个引用时，意识到 `this` 的值会根据你调用函数的上下文而改变。\n\n# 注意\n\n\
    除了 `this` 和 `arguments` 之外的所有变量都遵循词法作用域。\n\n# this 关键字在函数中指向头对象\n\n你可能在想当 `this`\
    \ 使用在嵌套函数内部时会发生什么。坏消息是在 ECMA 3 中，`this` 会丢失方向并指向头对象（浏览器中的 `window` 对象），而不是定义函数所在的对象。\n\
    \n在下面的代码中，`func2` 和 `func3` 内部的 `this` 丢失方向，指向的不是 `myObject` 而是头对象。\n\n示例：102.html\n\
    \n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar myWeb = {\n  func1:\
    \ function () {\n    console.log(this); // 记录 myObject.\n    var func2 = function\
    \ () {\n      console.log(this) // 记录 window，并且从现在开始都是如此。\n      var func3 = function\
    \ () {\n        console.log(this); // 记录 window，因为它是头对象。\n      } ();\n    })();\n\
    \  }\n}\n</script></body>\n</html>\n```\n\n"
