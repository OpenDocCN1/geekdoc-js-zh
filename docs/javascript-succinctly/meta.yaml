    \ x != 'number' || typeof y != 'number') { return 'pass in numbers';\n  }\n  console.log(add(3,\
    \ 3)); // Logs 6.\nconsole.log(add('2', '2')); // Logs 'pass in numbers'.\n}\n\
    </script></body></html>\n```\n\n这里的概念是，你可以在函数执行的任何点使用 `return` 关键字来取消函数的执行。\n\n\
    ## 定义函数（语句、表达式或构造函数）\n\n函数可以通过三种不同的方式定义：函数构造函数、函数语句或函数表达式。在下面的示例中，我演示了每种变化。\n\n\
    示例：sample89.html\n\n```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    /* 函数构造函数：最后一个参数是函数逻辑，\n所有内容都是参数。 */\nvar addConstructor = new Function('x', 'y',\
    \ 'return x + y');\n\n// 函数语句。\nfunction addStatement(x, y) {\n  return x + y;\n\
    }\n\n// 函数表达式。\nvar addExpression = function (x, y) {\n  return x + y;\n}\n</script>\n\
    };\nconsole.log(addConstructor(2, 2), addStatement(2, 2), addExpression(2,\n2));\
    \ // Logs '4 4 4'.\n\n<script></</body></html>\n```\n\n## 注意事项\n\n有人说存在第四种函数定义类型，称为“命名函数表达式”。命名函数表达式仅仅是包含名称的函数表达式（例如\
    \ `var add = function add(x, y) {return x+y}`）。\n\n## 调用函数（函数、方法、构造函数或构造函数）\n\n\
    函数通过不同的场景进行调用：\n- 作为函数\n- 作为方法\n- 作为构造函数\n- 使用 `apply()`\n\n在接下来的示例中，我们检查了这些的每种情况。\n\
    \n示例：sample90.html\n\n```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    // 函数模式。\n// 方法模式。\n// 构造函数模式。\n// 使用 apply().\n```\n\n## 匿名函数\n\n匿名函数是没有没有标识符的函数。匿名函数主要用于传递函数。\n\
    \n示例：sample91.html\n\n```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    // 匿名函数，但没有调用方法。\n```\n\n```javascript\nvar sayHi = function (f) {\n  f(); //\
    \ 调用匿名函数。\n}\n```\n\n```javascript\nsayHi(function () { console.log('hi'); });\
    \ // Logs 'hi'.\n```\n\n## 自执行函数表达式\n\n函数表达式（实际上任何不是通过 `Function()` 构造函数创建的函数）可以在定义后使用括号运算符立即调用。在接下来的示例中，我们创建了一个\
    \ `sayword` 函数表达式并立即调用该函数。这被认为是自执行函数。\n\n示例：sample92.html\n\n```javascript\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\nvar sayWord = function () { console.log('Word\
    \ 2 mo!'); }; (); Logs\n'Word 2 mo!'\n\n</script></body></html>\n```\n\n## 自执行匿名函数语句\n\
    \n可以创建一个自执行的匿名函数语句。这被称为自执行匿名。在接下来的示例中，我们创建了多个立即执行的匿名函数。\n\n示例：sample93.html\n\n\
    ```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n// 在野外最常用/看到的。\n\
    (function msg) {\n    console.log(msg);\n}('Hi');\n\n// 略有不同，但实现了相同的结果；\n(function\
    \ msg) {\n    console.log(msg);\n} ('Hi');\n\n// 最短的解决方案。\n!function sayHi(msg)\
    \ { console.log(msg); } ('Hi');\n\n// 提示，这不起作用！\n// function sayHi() {console.log('hi');};\n\
    \n</script></body></html>\n```\n\n### 注意事项\n\n根据 ECMAScript 标准，如果要立即调用函数，则函数周围（或将函数转换为表达式的任何内容）的括号是必须的。\n\
    \n"
