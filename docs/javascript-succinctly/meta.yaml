    More detail about this topic you can find in Chapter 6.


    It''s possible to forgo the new keyword and the concept of a constructor function
    by explicitly having the function return an object. The function would have to
    be explicitly to build an `Object()` object and return it: `var myFunction = function()
    {return prop:val}};`


    # Instantiating constructors using the new operator


    A constructor function is basically a cookie-cutter template used to create pre-configured
    objects. Take `String()` for example. When used with the new operator (`new String(''foo'')`),
    it creates a string instance based on the `String()` template. Let''s look at
    an example.


    Sample09.html


    ```

    <!DOCTYPE html><html>html lang="en"><body><script>

    var myString = new String(''foo'');


    console.log(myString); // Logs foo {0 = "f", 1 = "o", 2 = "o"}

    </script></body></html>

    ```


    In this snippet, we created a new object that is an instance of the `String()`
    constructor function. Like that, we have a string value expressed in JavaScript.


