- md: "\n```javascript\nconsole.log(myArray.hasOwnProperty('join')); // Logs false.\n\
    \n<script></</body></html>\n```\n\nIt does not exist yet. Yet myArray has access\
    \ to the join() method as if it were its own property. What happened here? Well,\
    \ you just observed the prototype chain in action. We accessed a prototype that,\
