    # About the Author


    Cody Lindley is a client-side engineer (aka front-end developer) and recovering
    Flash developer. He has an extensive background working professionally (11+ years)
    with HTML, CSS, JavaScript, Flash, and client-side performance techniques as they
    pertain to web development. If he is not welding client-side code he is likely
    tying with interface/interaction design or authoring material and speaking at
    various conferences. When not sitting in front of a computer, it is a sure bet
    he is hanging out with his wife and kids in Boise, Idaho—training for triathlons,
    skiing, mountain biking, road biking, alpine climbing, reading, watching movies,
    or debating the rational evidence for a Christian worldview.


    # Introduction


    This is not about JavaScript design patterns or implementing an object-oriented
    paradigm with JavaScript code. It was not written to distinguish the good features
    of the JavaScript language from the bad. It is not meant to be a complete reference
    guide. It is not targeted at people new to programming or those completely new
    to JavaScript. Nor is this a cookbook of JavaScript recipes. Those books have
    been written.


    It was my intention to write a book that gives the reader an accurate JavaScript
    worldview through an examination of native JavaScript objects and supporting nuances:
    complex values, primitive values, scope, inheritance, the head object, etc. I
    intend this book to be a short and digestible summary of the ECMA-262, Edition
    3 specification, focused on the nature of objects in JavaScript.


    If you are a designer who has only used JavaScript of libraries (such as jQuery,
    Prototype, etc.), it is my hope that the material in this book will transform
    you from the mantle of a JavaScript library into a JavaScript developer.


    # Why did I write this book?


    First, I must admit that I wrote this book for myself. Truth be told, I crafted
    this material so I could drink my own Kool-Aid and always remember what it tastes
    like. In others, I wanted a reference in my own words used to jog my memory as
    needed:


    - Libraries facilitate a "black box" syndrome that can be beneficial in some regards
    detrimental in others. Things may be completed fast and efficiently, but you have
    no idea why or how. And the how really matter when things go wrong or performance
    becomes an issue. The fact is that anyone intends to implement a JavaScript library
    or framework when building a web application (or just a good sign-up) ought to
    look under the hood and understand the engine. This book was written for those
    who want to pop the hood and get their hands dirty in JavaScript itself.


    - Mozilla has provided the most-to-date and reference guide for JavaScript 1.5.
    I believe what is missing is a digestible document, written from a single point
    of view, to go along with their reference guide. It is my hope that this book
    will serve as a "what you need to know" manual for JavaScript values, detailing
    concepts beyond the Mozilla reference covers.


    - Version 1.5 of JavaScript is going to be around for a fair amount of time, but
    as we move toward the corners of the language found in ECMA Edition 5, I wanted
    to document the cornerstone concepts of JavaScript that will likely be perennial.


    - Advanced technical books written about program languages are full of monolithic
    code examples and pointless meanders. I prefer short explanations that get to
    the point, backed by real code that I can read instantly. I coined a term, "thin-slicing,"
    to describe what I am attempting to employ in this book. This entails reducing
    complex topics into simpler concepts taught with minimal words and backed with
    comprehensive and focused code examples.


    - Most JavaScript books are reading three inches thick. Definitive guides like
    David Flanagan''s certainly have their place, but I wanted to create a book that
    holes in the important stuff without being exhaustive.


    # Who should read this book?


    This book is targeted at two types of people. The first is an advanced beginner
    or intermediate JavaScript developer who wishes to solidify his or understanding
    of the language through an in-depth look at JavaScript objects. The second type
    is a JavaScript library veteran who is ready to look behind the curtain. This
    book is not ideal for newbies to programming, JavaScript libraries, or JavaScript
    itself.


    # Why JavaScript 1.5 and ECMA-262 Edition 3?


    In this book, I focus on version 1.5 of JavaScript (equivalent to ECMA-262 Edition
    3) because it is the most widely implemented version of JavaScript to date. The
    next version of this book will certainly be geared toward the up-coming ECMA-262
    Edition 5.


    # Why didn''t I cover the Date(), Error(), or RegExp() objects?


    Like I said, this book is not an exhaustive reference guide to JavaScript. Rather,
    it focuses on objects as a lens through which to understand JavaScript. So I have
    decided not to cover the Date(), Error(), or RegExp objects because, as useful
    as they are, grasping the details of these objects will not make or break your
    general understanding of objects in JavaScript. My hope is that you simply apply
    what you learn here to all objects available in the JavaScript environment.


    # Preface


    Before you begin, it is important to understand various styles employed in this
    book. Please do not skip this section because it contains important information
    that will aid you as you read the book.


    ## More code, less words


    Please examine the code examples in detail. The text should be viewed as secondary
    to the code itself. It is my opinion that a code example is worth a thousand words.
    Do not worry if you''re initially confused by explanations. Examine the code.
    Tinker with it. Rere the code comments. Repeat this process until the concept
    becomes clear. I hope you achieve a level of expertise such that well-documented
    code is all you need to understand a programming concept.


    ## Exhaustive code and repetition


    You will perhaps curse me for repeating myself and for being so comprehensive
    with my code examples. And while I might desire it, I prefer to err on the side
    of being exact, verbose, and repetitive, rather than make false assumptions some
    authors often make about their readers. Both approaches can be annoying depending
    upon what knowledge the author brings to the subject, but they can also serve
    a useful purpose for those who want to learn a subject in detail.


    ## Color-coding conventions


    Code will be colored using the normal JavaScript syntax highlighting in Visual
    Studio. This will help you understand the code, but you will be just fine reading
    this material on a monochrome e-reader such as the Kindle Touch.


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    // This is a comment about a specific part of the code.

    var foo = ''calling out this part of the code'';


    </script>body></html>

    ```


    In addition to syntax highlighting the code, the text in this book is colored
    so as to distinguish between JavaScript words and keywords, JavaScript code, and
    regular text. The following excerpt from the book demonstrates this semantic.


    > "Consider the code object created from the Object() constructor function is
    not really different from a string object created via the String() constructor
    function. To drive this fact home, examine and contrast text for the following
    code:"


    Notice the use of gray italicized text for code references, orange text for JavaScript
    words and keywords, and regular black text for everything in-between.


    # Code examples on code examples to express JavaScript concepts.


    This book relies heavily on [https://bitbucket.org/syncfusiontech/javascript-succinctly].
    The code samples are available at


    The code samples are provided as individual HTML files. A Visual Studio 2010 project
    is also provided for easy navigation. You can select any file, right-click, and
    select the **View Browser** option to test the code.


    ![](img/5f3d1741ae8b04141048ad2f0e57a571_14_0.png)


    The name of the sample file is always included above its code block in the format
    **Sample: $file-name.html.**


    Before reading this book, make sure you are comfortable with the usage and purpose
    of `console.log`. You can open the JavaScript console window in different browsers
    using the following keyboard shortcuts.


    | Browser | Keyboard shortcut to open JavaScript console window |

    |---|---|

    | Internet Explorer | F12 to open the developer tools, Ctrl+3 to open the console
    window |

    | Chrome | Ctrl+Shift+J |

    | Firefox | Ctrl+Shift+K |

    | Safari | Ctrl+Alt+I |


    I encourage you to download the code and follow along. I authored this book counting
    on the fact that you will need to tinker with the code while you are reading and
    learning.

