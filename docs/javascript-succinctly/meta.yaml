    # ## Math is not a constructor function


    The Math object is unlike the other built-in objects that are instantiated. Math
    is a one-off object created to house static properties and methods, ready to be
    used when dealing with numbers. Just remember, there is no way to create an instance
    of Math, as there is no constructor.


    # ## Math has constants you cannot augment or mutate


    Many of the Math properties are constants that cannot be mutated. Since this is
    a departure from the mutable nature of JavaScript, these properties are all in
    caps (e.g., Math.PI). Do not confuse these property constants for constructor
    functions due to the capitalization of their first letter. They are simply object
    properties that cannot be changed.


    # ## Notes


    User-defined constants are not possible in JavaScript 1.5, ECMA-262, Edition 3.'
  - '[PAGE 127]


    # Review


    The following points summarize what you have learned by reading this book (and
    investigating the code examples). Read each summary, and if you don''t understand
    what is being said, return to the topic in the book.


    +   - An object is made up of named properties that store values.

    - Most everything in JavaScript can act like an object. Complex values are objects,
    and primitive values can be treated like objects. This is why hear people say
    that everything in JavaScript is an object.

    - Objects are created by invoking a constructor function with the new keyword,
    or by using shorthand literal expression.

    - Constructor functions are objects (Function() objects), thus, in JavaScript,
    objects create objects.

    - JavaScript offers nine native constructor functions: Object(), Array(), String(),
    Number(), Boolean(), Function(), Date(), RegExp(), and Error(). The String(),
    Number(), and Boolean() constructors are dual-purpose in providing primitive values
    and object wrappers needed, so that primitive values can act like objects.

    - The values null, undefined, "string", 10, true, and false are all primitive
    values, without an object unless treated like an object.

    - When the Object(), Array(), String(), Number(), Boolean(), Function(), Date(),
    RegExp(), and Error() constructor functions are invoked using the new keyword,
    an object is created that is known as a "complex object" or "reference object"

    - "string", 10, true, and false, have no object qualities until used as objects;
    then JavaScript creates the scenes, temporary wrapper objects so that such can
    act like objects.

    - Primitive values are stored by value, and when copied, they are literally copied.
    Complex objects on the other hand are stored by reference, and when copied, they
    are copied by reference.

    - Primitive values are equal to other primitive values when their values are equal,
    whereas complex objects are equal only when they reference the same value. That
    is: a complex value is equal to another complex value when both refer to the same
    object.

    - Due to the nature of complex objects and references, JavaScript objects have
    dynamic properties.

    - JavaScript is mutable, which means that native objects and user-defined object
    properties can be manipulated at any time.'
- md: '

    Getting/setting/updating an object''s properties is done by using dot notation
    or bracket notation. Bracket notation is convenient when the name of the object
    property being manipulated is in the form of an expression (e.g., `Array[''prototype''][''join''].apply()`).


    When referencing objects, a lookup chain is used to first look at the object that
    was referenced for the property. If the property is not found, the property is
    looked for on the constructor function `prototype` property. If it''s not found,
    because the prototype holds an object value and the value is created from the
    `Object()` constructor, the property is looked for by the `Object()` constructor''s
    `prototype` property. If the property is not found, the property is determined
    to be `undefined`.


    The `prototype` lookup chain is how inheritance (aka prototypal inheritance) was
    designed to be accomplished in JavaScript.


    Because of the object property lookup chain (aka prototypal inheritance), all
    objects inherit from `Object()` simply because the `prototype` property is, itself,
    an `Object()` object.


    JavaScript functions are first-class citizens: functions are objects with properties
    and values.


    The `this` keyword, when used inside a function, is a generic way to reference
    the object containing the function.


    The value of `this` is determined during run time based on the context in which
    the function is called.


    Used in the global scope, the `this` keyword refers to the global object.


    JavaScript uses functions as a way to create a unique scope.


    JavaScript provides the global scope, and it''s in this scope that all JavaScript
    code exists.


    Functions (specifically, encapsulated functions) create a scope chain for resolving
    variable lookups.


    The scope is set up based on the way code is written, not necessarily by the context
    in which a function is invoked. This permits a function to have access to the
    scope in which it was originally written, even if the function is called from
    a different context. This result is known as a closure.


    Function expressions and variables declared inside a function using `var` become
    global properties. However, function statements inside a function scope remain
    defined in the scope in which they are written.


    - Functions and variables declared (without `var`) in the global scope become
    properties of the global object.

    - Functions and variables declared (with `var`) in the global scope become global
    variables.

    '
  mdcn: '

    获取/设置/更新对象的属性是通过使用点符号（dot notation）或括号符号（bracket notation）完成的。当操作的对象属性名以表达式的形式时（例如
    `Array[''prototype''][''join''].apply()`），使用括号符号会非常方便。


    在引用对象时，会使用查找链（lookup chain）首先在被引用的对象中查找该属性。如果没有找到该属性，则会在构造函数的 `prototype` 属性上查找。如果仍未找到，由于原型持有一个对象值，且该对象值是由
    `Object()` 构造函数创建的，则会通过 `Object()` 构造函数的 `prototype` 属性进行查找。如果仍未找到，则该属性将被确定为 `undefined`。


    `prototype` 查找链是 JavaScript 实现继承（亦原型继承）的设计方式。


    由于对象属性查找链（亦原型继承），所有对象都继承自 `Object()`，这仅仅是因为 `prototype` 属性本身就是一个 `Object()` 对象。


    JavaScript 函数是一等公民：函数函数是具有属性和值的对象。


    `this` 关键字在函数内部使用时，是引用包含该函数的对象的通用方式。


    `this` 的值是在运行时根据函数被调用的上下文确定的。


    在全局作用域中使用时，`this` 关键字指向全局对象。


    JavaScript 使用函数作为创建唯一作用域的方式。


    JavaScript 提供了全局作用域，所有的 JavaScript 代码都存在此作用域中。


    函数（特别是封装函数）为解析变量查找创建了作用域链（scope chain）。


    作用域的建立基于代码的编写方式，而不一定取决于函数被调用的上下文。这允许函数访问其原始编写时所在的作用域，即使该函数是从不同的上下文被调用的。这种结果被称为闭包（closure）。


    在函数内部使用 `var` 声明的函数表达式和变量将变成全局属性。然而，函数作用域内部的函数声明（function statements）仍然定义在它们被编写的作用域中。


    - 在全局作用域中声明（不使用 `var`）的函数和变量将成为全局对象的属性。

    - 在全局作用域中声明（使用 `var`）的函数和变量将成为全局变量。

    '
