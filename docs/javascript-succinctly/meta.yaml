    # Complex objects have dynamic properties


    A new variable that points to an existing complex object does not copy the object.
    This is why complex objects are sometimes called reference objects. A complex
    object can have as many references as you want, and they will always refer to
    the same object, even as the object being changed.


    Sample: sample20.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var objA = { property: ''value'' };

    var pointer1 = objA;

    var pointer2 = pointer1;


    // Update the objA.property, and all references (pointer1 and pointer2)

    are updated.

    objA.property = null;


    // Logs ''null null null'' because objA, pointer1, and pointer2 all

    reference the same object.

    console.log(objA.property, pointer1.property, pointer2.property);

    </script></body></html>

    ```


    This allows for dynamic object properties because you can define an object, create
    references, update the object, and all of the variables will refer to the "get"
    that update.


