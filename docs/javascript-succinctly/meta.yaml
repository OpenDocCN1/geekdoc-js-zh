  md: "# # Chapter 12 The this Keyword\n\n# ## Conceptual overview of this and how\
    \ it refers to\n\nWhen a function is created, a keyword called this is created\
    \ (behind the scenes), which links to the object in which the function operates.\
    \ Said another way, this is available to the scope of its function, yet is a reference\
    \ to the object of which function is a property or method.\nLet's take a look\
    \ at the cody object from Chapter 1 again:\n\nSample:98.html\n\n```\n```html\n\
    <!DOCTYPE html lang=\"en\"><body><script>\nvar cody = {\n  living: true,\n  age:\
    \ 23,\n  gender: 'male',\n  getGender: function () { return cody.gender; }\n}\n\
    console.log(cody.getGender()); // Logs 'male'\n</script></body>\n```\n```\n\n\
    Notice how the Getter function, we are accessing the gender property using dot\
    \ notation (e.g., cody.gender) on the cody object itself. This can be rewritten\
    \ using this to access the cody object this points to the cody object.\n\nSample:99.html\n\
    \n```\n```html\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = {\n  living:\
    \ true,\n  age: 23,\n  gender: 'male',\n  getGender: function () { return this.gender;\
    \ }\n}\nconsole.log(cody.getGender()); // Logs 'male'\n</script></body>\n```\n\
    ```\n\nThe this used in this.gender simply refers to the cody object on which\
    \ the function is operating.\n\nThe topic of this can be confusing, but it does\
    \ not have to be. Just remember that in general, this is used inside of functions\
    \ to refer to the object the function is contained within, as"
