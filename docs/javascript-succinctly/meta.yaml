  md: "# Chapter 13 Scope and Closures\n\n# Conceptual overview of JavaScript scope\n\
    \nIn JavaScript, scope is the context in which code is executed. There are three\
    \ types of scope: global scope, local scope (sometimes referred to as \"function\
    \ scope\"), and eval scope.\n\nCode defined with var inside of a function is locally\
    \ scoped, and is only \"visible\" to other expressions in that function; which\
    \ includes code inside nested/child functions. Variables defined in the global\
    \ scope can be accessed from anywhere because it is the highest level and last\
    \ stop in the scope chain.\n\nExamine the code that follows and make sure you\
    \ understand that each declaration of foo is unique of scope.\n\nsample11.html\n\
    \n```\n<DOCTYPE html>html lang=\"en\"><body><script>\nvar foo = 0; // Global scope.\n\
    console.log(foo); // Logs 0.\n\n myFunction = function() {\nvar foo = 1; // Local\
    \ scope.\nconsole.log(foo); // Logs 1.\n\nmyNestedFunction = function() {\nvar\
    \ foo = 2; // Local scope.\nconsole.log(foo); // Logs 2.\n} }();\nneval('var foo\
    \ = 3; console.log(foo)'); // eval scope.\n</script></body></html>\n```\n\nMake\
    \ sure you understand that each foo variable contains a different value because\
    \ each one is defined in a specifically delineated scope.\n\n# Notes\n\nAn unlimited\
    \ number of function and eval scopes can be created, while only one global scope\
    \ is used by a JavaScript environment.\n\nThe global scope is the last stop in\
    \ the scope chain."
