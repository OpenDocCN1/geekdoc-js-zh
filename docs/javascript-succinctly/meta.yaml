- md: "\n## Chapter 13 Scope and Closures\n\n## Conceptual overview of JavaScript\
    \ scope\n\nIn JavaScript, scope is the context in which code is executed. There\
    \ are three types of scope: global scope, local scope (sometimes referred to as\
    \ \"function scope\"), and eval scope.\n\nCode defined with var inside of a function\
    \ is locally scoped, and is only \"visible\" to other expressions in that function;\
    \ which includes code inside nested/child functions. Variables defined in the\
    \ global scope can be accessed from anywhere because it is the highest level and\
    \ last stop in the scope chain.\n\nExamine the code that follows and make sure\
    \ you understand that each declaration of foo is unique of scope.\n\nsample11.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\"><body><script>\nvar foo = 0; //\
    \ Global scope.\nconsole.log(foo); // Logs 0.\n\nmyFunction = function() {\n \
    \ var foo = 1; // Local scope.\n  console.log(foo); // Logs 1.\n\n  myNestedFunction\
    \ = function() {\n    var foo = 2; // Local scope.\n    console.log(foo); // Logs\
    \ 2.\n  } \n}();\nneval('var foo = 3; console.log(foo)'); // eval scope.\n</script></body></html>\n\
    ```\n\nMake sure you understand that each foo variable contains a different value\
    \ because each one is defined in a specifically delineated scope.\n\n## Notes\n\
    \n- An unlimited number of function and eval scopes can be created, while only\
    \ one global scope is used by a JavaScript environment.\n- The global scope is\
    \ the last stop in the scope chain.\n\nFunctions that chain functions create stacked\
    \ execution scopes. These stacks, which are chained together, are often referred\
    \ to as the scope chain.\n\n## JavaScript does not have block scope\n\nSince logic\
    \ statements (e.g., if) and looping statements (e.g., for) do not create a scope,\
    \ variables can overwrite each other. Examine the code and make sure you understand\
    \ that the value of foo is being redefined as the program executes the code.\n\
    \nSample: sample111.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"><body><script>\n\
    \  var foo = 1; // foo = 1.\n\n  if (true) {\n    foo = 2; // foo = 2.\n    for\
    \ (var i = 3; i <= 5; i++) {\n      foo = 1; // foo = 3, 4, 5.\n      console.log(foo);\
    \ // Logs 3, 4, 5.\n    }\n  }\n</script></body></html>\n```\n\nSo foo is changing\
    \ as the code executes because JavaScript has no block scope—only function, global,\
    \ or eval scope.\n\n## Use var inside of functions to declare variables and avoid\
    \ scope gotchas\n\nJavaScript will declare any variables lacking a var declaration\
    \ (even those contained in a function or encapsulated functions) in the global\
    \ scope instead of the intended local scope. Have a look at the code that follows\
    \ and notice that without the use of var to declare bar, the variable is actually\
    \ defined in the global scope and not the local scope, where it should be.\n\n\
    Sample: sample112.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"><body><script>\n\
    \  var foo = function () {\n    var boo = function () {\n      bar = 2; // No\
    \ var used, so bar is placed in the global scope at\n      window.bar\n    }\n\
    \  }}();\n\nconsole.log(bar); // Logs 2, because bar is in the global scope.\n\
    \n// As opposed to to...\n\nvar foo = function () {\n  var boo = function () {\n\
    \    var doo = 2;\n  } ();\n} ();\n\n// console.log(doo); undefined. doo is in\
    \ the boo function scope, so\n// an error occurs\n</script></body></html>\n```\n\
    \nThe concept to take away is that you should always use var when defining variables\
    \ inside a function. This will prevent you from dealing with potentially confusing\
    \ scope problems. The exception to this convention, of course, is when you want\
    \ to create or change properties in the global scope from within a function.\n\
    \n## The scope chain (aka lexical scoping)\n\nThere is a lookup chain that is\
    \ followed when JavaScript looks for the follows associated with a variable. This\
    \ chain is built on the hierarchy of scope. In the code that, I am logging the\
    \ value of sayHiText from the func scope.\n\nSample: sample113.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\"><body><script>\n\nvar sayHiText = 'howdy';\n\
    \nvar func1 = function () {\n  var func2 = function () {\n    console.log(sayHiText);\
    \ // func2 scope, but it finds sayHiText in global scope.\n  } (); \n} ();\n</script></body>\n\
    ```\n\nHow is the value sayHiText found when it is not contained inside the scope\
    \ of the func2 function? JavaScript first looks inside the func2 function for\
    \ a variable named sayHiText. Not finding func2 there, it looks up func2's parent\
    \ function, func1. The sayHiText variable is not found in the func1 scope, either,\
    \ so JavaScript continues up to the global scope where sayHiText is found, at\
    \ which point the value of sayHiText is delivered. If sayHiText had not been defined\
    \ in the global scope, undefined would have been returned by JavaScript.\n\nThis\
    \ is a very important concept to understand. Let's examine another code example,\
    \ one in which we grab three values from three different scopes.\n\n**Sample:\
    \ sample114.html**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"><body><script>\n\
    \nvar x = 10;\nvar foo = function () {\n  var y = 20;\n  var bar = function ()\
    \ {\n    var z = 30;\n    console.log(z + y + x); // Logs 60\n  }\n  bar();\n\
    }\nfoo(); \n\n</script></body></html>\n```\n\nThe value for z is local to the\
    \ bar function. The value for y is local to the foo function. The value for x\
    \ is global.\n\n## The scope chain returns the first found\n\nIn the following\
    \ sample, a variable named x exists in the same scope it shadows variables found\
    \ further up the chain.\n\n**Sample: sample115.html**\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\"><body><script>\n\nvar x = false;\nvar foo = function () {\n\
    \  var x = false;\n  var bar = function () {\n    var x = true; // Local x is\
    \ first in scope\n    console.log(x);\n  } ();\n}\nfoo(); // Logs true.\n</script></body></html>\n\
    ```\n\nRemember that the scope looks up when the variable is found in the nearest\
    \ available link of the chain, even if the same variable name is used further\
    \ up the chain.\n\n## Scope is decided during function definition, not invocation\n\
    \nSince functions determine scope and functions can be passed around like any\
    \ JavaScript value, one might think that deciphering the scope chain is complicated.\
    \ It is actually very simple. The scope chain is decided by the location of a\
    \ function during definition, not during invocation. This is also called lexical\
    \ scoping. Think long and hard about this, as most people stumble over it in JavaScript\
    \ code.\n\nThe scope is created before you invoke a function. Because of this,\
    \ we can create closures. For example, we can have a function return a nested\
    \ function to the global scope, yet our function can still access the scope chain,\
    \ its parent function's scope. In the following sample, we define a parentFunction\
    \ that returns an anonymous function, and we call the returned function from the\
    \ global scope. This is called closure.\n\nSample: sample116.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\"><body><script>\nvar parentFunction = function\
    \ () {\n  var foo = 'foo';\n  return function () { // Anonymous function being\
    \ returned\n    console.log(foo); // Logs 'foo'.\n  }\n}\n// nestedFunction refers\
    \ to the nested function returned from parentFunction.\nvar nestedFunction = parentFunction();\n\
    \nnestedFunction(); // Logs foo because the returned function accesses foo via\
    \ the scope chain.\n</script></body></html>\n```\n"
  mdcn: "\n\n## 第 13 章 作用域与闭包\n\n## JavaScript 作用域概述\n\n在 JavaScript 中，作用域是代码执行的上下文。作用域有三种：全局作用域、局部作用域（有时称为“函数作用域”）和\
    \ eval 作用域。\n\n在函数内部使用 `var` 定义的代码是局部的，并且对该函数内的其他表达式“可见”，这包含了嵌套/子函数内部的代码。在全局作用域中定义的变量可以在任何地方访问，因为它是作用域链的最高层也是最后的终点。\n\
    \n检查下面的代码，确保你理解每个 `foo` 声明都是独立的作用域。\n\nsample11.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\"><body><script>\nvar foo = 0; // 全局作用域。\nconsole.log(foo); //\
    \ 打印 0。\n\nmyFunction = function() {\n  var foo = 1; // 局部作用域。\n  console.log(foo);\
    \ // 打印 1。\n\n  myNestedFunction = function() {\n    var foo = 2; // 局部作用域。\n\
    \    console.log(foo); // 打印 2。\n  } \n}();\nneval('var foo = 3; console.log(foo)');\
    \ // eval 作用域。\n</script></body></html>\n```\n\n确保你理解每个 `foo` 变量包含不同的值，因为它们每一个都定义在特定的限定作用域中。\n\
    \n## 注意事项\n\n- 可以创建无限数量的函数和 eval 作用域，而 JavaScript 环境只使用一个全局作用域。\n- 全局作用域是作用域链的最后一个站点。\n\
    \n链式的函数会创建堆栈的执行作用域。这些链在一起的栈通常被称为作用域链。\n\n## JavaScript 没有块级作用域\n\n由于逻辑语句（例如 `if`）和循环语句（例如\
    \ `for`）不会创建作用域，因此变量可以相互覆盖。检查代码并确保你理解在程序执行代码时，`foo` 的值正在被重新定义。\n\n示例：sample111.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\"><body><script>\n  var foo = 1; //\
    \ foo = 1。\n\n  if (true) {\n    foo = 2; // foo = 2。\n    for (var i = 3; i <=\
    \ 5; i++) {\n      foo = 1; // foo = 3, 4, 5。\n      console.log(foo); // 打印 3,\
    \ 4, 5。\n    }\n  }\n</script></body></html>\n```\n\n所以 `foo` 随着代码执行而改变，因为 JavaScript\
    \ 没有块级作用域——只有函数、全局或 eval 作用域。\n\n## 在函数内部使用 var 声明变量以避免作用域陷阱\n\nJavaScript 将任何缺少\
    \ `var` 声明的变量（即使是包含在函数或封装函数中的）声明在全局作用域中，而不是预期的局部作用域。看看下面的代码，注意如果没有使用 `var` 来声明\
    \ `bar`，该变量实际上定义在全局作用域中，而不是它应该在的局部作用域中。\n\n示例：sample112.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\"><body><script>\n  var foo = function () {\n    var\
    \ boo = function () {\n      bar = 2; // 没有使用 var，所以 bar 被放置在全局作用域中\n      window.bar\n\
    \    }\n  }}();\n\nconsole.log(bar); // 打印 2，因为 bar 在全局作用域中。\n\n// 与此相反……\n\n\
    var foo = function () {\n  var boo = function () {\n    var doo = 2;\n  } ();\n\
    } ();\n\n// console.log(doo); undefined。doo 在 boo 函数作用域中，所以\n// 会发生错误\n</script></body></html>\n\
    ```\n\n需要记住的观点是，在函数内部定义变量时，你应该始终使用 `var`。这可以防止你处理可能引起混惑的作用域问题。当然，这一惯例的例外是你想从函数内部创建或更改全局作用域中的属性。\n\
    \n## 作用域链（又称词法作用域）\n\n当 JavaScript 查找变量关联的值时，会遵循一条查找链。这条链建立在作用域的层次结构之上。在代码中，我正在从\
    \ `func` 作用域打印 `sayHiText` 的值。\n\n示例：sample113.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\"><body><script>\n\nvar sayHiText = 'howdy';\n\nvar func1 = function\
    \ () {\n  var func2 = function () {\n    console.log(sayHiText); // func2 作用域，但在全局作用域中找到了\
    \ sayHiText。\n  } (); \n} ();\n</script></body>\n```\n\n当 `sayHiText` 不在 `func2`\
    \ 函数的作用域内时，它是如何找到的？JavaScript 首先在 `func2` 函数内部查找名为 `sayHiText` 的变量。在 `func2` 中没有找到，它就会查找\
    \ `func2` 的父函数 `func1`。在 `func1` 作用域中也没有找到 `sayHiText`，因此 JavaScript 继续向上直到全局作用域，在那里找到了\
    \ `sayHiText`，此时交付 `sayHiText` 的值。如果全局作用域中未定义 `sayHiText`，JavaScript 将返回 `undefined`。\n\
    \n这是一个非常重要的概念。让我们来看另一个代码示例，其中我们从三个不同的作用域获取了三个值。\n\n**示例：sample114.html**\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\"><body><script>\n\nvar x = 10;\nvar foo = function\
    \ () {\n  var y = 20;\n  var bar = function () {\n    var z = 30;\n    console.log(z\
    \ + y + x); // 打印 60\n  }\n  bar();\n}\nfoo(); \n\n</script></body></html>\n```\n\
    \n`z` 的值对于 `bar` 函数局部。`y` 的值对于 `foo` 函数局部。`x` 的值是全局的。\n\n## 作用域链返回找到的第一个\n\n在下面的示例中，名为\
    \ `x` 的变量存在相同的作用域中，它遮蔽了链上更处的变量。\n\n**示例：sample115.html**\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\"><body><script>\n\nvar x = false;\nvar foo = function\
    \ () {\n  var x = false;\n  var bar = function () {\n    var x = true; // 局部 x\
    \ 在作用域中优先\n    console.log(x);\n  } ();\n}\nfoo(); // 打印 true.\n</script></body></html>\n\
    ```\n\n记住，当作用域在链的最近链接中找到变量时，即使在链的高处使用了相同的变量名。\n\n## 作用域在函数定义时确定，而不是调用时\n\n由于函数决定作用域，且函数可以像任何\
    \ JavaScript 值一样传递，人们可能会认为解析作用域链很复杂。实际上它非常简单。作用域链是由函数在定义期间决定的，而不是在调用期间。这也被称为词法作用域。对此深思，因为大多数人在\
    \ JavaScript 代码中都会出错。\n\n作用域是在调用函数之前创建的。由于这一点，我们可以创建闭包。例如，我们可以让一个函数将嵌套函数返回到全局作用域，然而我们的函数仍然可以访问作用域链，其父函数的作用域。在下面的示例中，我们定义了一个返回匿名函数的\
    \ `parentFunction`，并从全局作用域调用返回的函数。这被称为闭包。\n\n示例：sample116.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\"><body><script>\nvar parentFunction = function () {\n\
    \  var foo = 'foo';\n  return function () { // 被返回的匿名函数\n    console.log(foo);\
    \ // 打印 'foo'。\n  }\n}\n// nestedFunction 指向 parentFunction 返回的嵌套函数。\nvar nestedFunction\
    \ = parentFunction();\n\nnestedFunction(); // 打印 foo，因为返回的函数通过作用域链访问 foo。\n</script></body></html>\n\
    ```"
