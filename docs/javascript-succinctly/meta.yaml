  md: "The idea you should take away here is that the scope chain is determined during\
    \ definition—literally in the way the code is written. Passing around functions\
    \ inside of your code will not change the scope chain.\n\n# Closures are caused\
    \ by the scope chain\n\nTake what you have learned about the scope chain and scope\
    \ lookup in this chapter, and a closure should not be overly complicated to understand.\
    \ In the following sample, we create a function called countUpFromZero. This function\
    \ returns a reference to the child function contained within it. This child function\
    \ (nested) is invoked, it has access to the parent's function because of the scope\
    \ chain.\n\n**Sample: sample11.html**\n\n```\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\nvar countUpFromZero = function () {\n  var count = 0;\n  return\
    \ function () // Return nested child function\n    countUpFromZero is invoked.\n\
    \      return count++; // count is defined up the scope chain, in the parent\n\
    \    function.\n  };\n})(); // Invoke immediately, return nested function.\n\n\
    console.log(countUpFromZero()); // Logs 1.\nconsole.log(countUpFromZero()); //\
    \ Logs 2.\nconsole.log(countUpFromZero()); // Logs 3.\n</script></body></html>\n\
    ```\n\nEach time the countUpFromZero function is invoked, the anonymous function\
    \ contained in (and returned from) the countUpFromZero function still has access\
    \ to the parent's scope. This technique, facilitated by the scope chain, is an\
    \ example of a closure.\n\n# Notes\n\nIf you feel I have over-simplified closures,\
    \ you are likely correct in this thought. But I did so purposely as I believe\
    \ the important parts come from a solid understanding of functions and scope,\
    \ not necessarily the complexities of execution context. If you are in need of\
    \ in-depth dive into closures, have a look at JavaScript Closures."
