  md: '# Sample: sample138.html


    ```

    <!DOCTYPE html>html lang="en"><body><script>


    var myArray = [''blue''] // The index 0 contains the string value ''blue''.

    console.log(myArray[0]); // Logs ''blue''.nconsole.log(myArray.length); // Logs
    1.


    </script></body></html>

    ```


    # Defining arrays with a predefined length


    As I mentioned earlier, by passing a single integer to the Array() constructor,
    it''s possible to redefine the array''s length, or the number of values it will
    contain. In this case, the constructor makes an exception and assumes you want
    to set the length of the array and not pre-populate the array with values.


    In the next sample, we set up the myArray with a predefined length of 3. Again,
    we are configuring the length of the array, passing a value to be stored at the
    0 index.


    # Sample:sample139.html


    ```

    <!DOCTYPE html>html lang="en"><body><script>


    var myArray = new Array(3);

    console.log(myArray.length); // Logs 3 because we are passing one numeric parameter.

    console.log(myArray[0]); // Logs undefined.


    </script></body></html>

    ```


    # Notes


    Providing a predefined length will give each numeric index, up to the length specified,
    an associated value of undefined.


    You might be wondering if it is possible to create a predefined array containing
    only one numeric value. Yes, it is—by using the literal var myArray = [4].


    # Setting array length can add or remove values


    The length property of an array object can be used to get or set the length of
    an array. As shown previously, setting the length greater than the actual number
    of values contained in the array will add undefined values to the array. What
    you might not expect is that you can actually remove values from an array by setting
    the length value to a number less than the number of values contained in the array.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Sample sample140.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    var myArray = [''blue'', ''green'', ''orange'', ''red''];

    console.log(myArray.length); // Logs 4.

    myArray.length = 99;

    console.log(myArray.length); // Logs 99, remember we set the length, an index.

    myArray.length = 1; // Remove all one value, so index [1] is gone!

    console.log(myArray[1]); // Logs undefined.


    console.log(myArray); // Logs [''blue'']


    </script></body></html>

    ```


    # Arrays containing other arrays (aka multidimensional arrays)


    Since an array can hold any valid JavaScript value, an array can contain other
    arrays. When this is done, the array containing encapsulated arrays is considered
    a *multidimensional array*. Accessing encapsulated arrays is done by *bracket
    chaining*. In the following example, we create an array literal that contains
    an array, inside which we create another array literal, inside of we create another
    string value at the 0 index.


    # Sample sample141.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    var myArray = [[[''4th dimension'']]];

    console.log(myArray[0][0][0]); // Logs ''4th dimension''


    </script></body></html>

    ```


    This example is rather silly, but you get the idea that arrays can contain other
    arrays and you can access encapsulated arrays indefinitely.


    # Looping over an array, backwards and forwards


    The simplest and arguably fastest to loop over an array is to use the *while*
    loop. In the following code, we loop from the beginning of the index to the end.


    # Sample: sample142.html


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    var myArray = [''blue'', ''green'', ''orange'', ''red''];

    ```'
