  md: "# Functions can be nested\n\nFunctions can be nested inside of other functions\
    \ indefinitely. In the following code sample, we encapsulate the foo function\
    \ inside of the bar function which is inside of the foo function.\n\nSample: sample94.html\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = function ()\
    \ {\n  var bar = function () {\n    var goo = function () {\n      console.log(this);\
    \ // Logs reference to head window object.\n    }\n  }\n}();\n</script></body></html>\n\
    ```\n\nThe simple concept here is that functions can be nested and there is no\
    \ limit to how deep the nesting can.\n\n# Notes\n\nRemember, the value of this\
    \ for nested functions will be the head object (e.g., the window object in a web\
    \ browser) in JavaScript 1.5, ECMA-262, Edition 3.\n\n# Passing functions to functions\
    \ and returning functions from functions\n\nAs previously mentioned, functions\
    \ are first-class citizens in JavaScript. Since a function is a value, a function\
    \ can be passed any sort of value, a function can be passed to a function. Functions\
    \ that take and/or return other functions are called \"higher-order functions.\"\
    \n\nIn the following code, we are passing an anonymous function to the foo function\
    \ which we then immediately return from the foo function. It is this anonymous\
    \ function that the var bar points to, so foo accepts and returns the anonymous\
    \ function.\n\nSample: sample95.html\n\n```\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\n// Functions can be sent to, and sent back from, functions.\n\
    var foo = function (f) {\n  return f;\n}\nvar bar = foo(function () { console.log('Hi');\
    \ });\n\nbar(); // Logs 'Hi'.\n```"
  merge: -1
  pgno: 90
- img_proc: true
  md: "```\n</script></body></html>\n```\n\nSo when bar is invoked, it invokes the\
    \ anonymous function that was passed to the foo() function, which is then passed\
    \ back from the foo() function and referenced from the bar variable. This is also\
    \ to showcase the fact that functions can be passed around just like any other\
    \ value.\n\n# Invoking function statements before they are defined (aka function\
    \ hoisting)\n\nA function statement can be invoked during execution before its\
    \ actual definition. This is a bit odd, but you should be aware of it so you leverage\
    \ it, or at least know what's going on when you encounter it. In the following\
    \ sample, I invoke the sayYo() and sum() function statements before they are defined.\n\
    \n**sample96.html\n\n```\n<!DOCTYPE html lang=\"en\"><body><script>\n\n// Example\
    \ 1\nvar speak = function () {\n  sayYo(); // sayYo() has not been defined yet,\
    \ but it can still be\n  invoked, logs 'Yo'.\n  function sayYo(){ console.log('Yo');\
    \ }\n};\\ // Invoke\n\n// Example 2\nconsole.log(sum(2, 2)); // Invoke sum(),\
    \ which is not defined yet, but\ncan still be invoked.\nfunction sum(x, y) { return\
    \ x + y; }\n\n</script></body></html>\n```\n\nThis happens before the code runs,\
    \ function statements are interpreted and added to the execution stack/context.\
    \ Make sure you are aware of this as you use function statements.\n\n# Notes\n\
    \nFunctions defined as function expressions are not hoisted. Only function statements\
    \ are hoisted.\n\n# A function can call itself (aka recursion)\n\nIt's perfectly\
    \ legitimate for a function to call itself. This is often used in well-known coding\
    \ patterns. In the code that follows, we kick off the countDownFrom function,\
    \ which then calls it via the function name countDownFrom. Essentially, this creates\
    \ a loop that counts from 5 to 0."
