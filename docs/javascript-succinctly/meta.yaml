  md: '# Chapter 6 Working with Primitive String, Number, and Boolean Values


    Primitive/literal values are converted to objects when properties are accessed


    Do not be misled by the fact that string, number, and Boolean literals can be
    treated like an object with properties (e.g., true.toString()). When these primitive
    values are treated like objects by attempting to access their properties, JavaScript
    will create a wrapper object from the primitive''s associated constructor, so
    the properties and methods of the wrapper object can be accessed. Once the properties
    have been accessed, the wrapper object is discarded. This conversion also allows
    us to write code that would make it appear as if a primitive value was, in fact,
    an object. Truth be told, when it is treated like an object in code, JavaScript
    will convert it to an object so property access will work, and then convert back
    to a primitive value once a value is returned. The key to notice here is what
    is occurring, and what JavaScript is doing for you behind.


    String


    Sample:sample6.html


    ```

    <DOCTYPE html><html lang="en"><body><script>


    // String treated like an object.

    var stringObject = new String(''foo'');

    console.log(stringObject.length); // Logs 3.

    console.log(stringObject[''length'']); // Logs 3.


    // String literal/primitive converted to an object when treated as an object.

    var stringLiteral = ''foo'';

    console.log(stringLiteral.length); // Logs 3.

    console.log(stringLiteral[''length'']); // Logs 3.

    console.log(''bar''.length); // Logs 3.

    console.log(''bar[''length'']); // Logs 3.


    </script></body></html>

    ```


    Number


    Sample:sample57.html


    ```

    <DOCTYPE html><html> lang="en"><body><script>


    // Number object treated like an object.

    var numberObject = new Number(1.10023);

    ```'
