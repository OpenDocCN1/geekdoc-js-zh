    </html>\n```\n\n## 注意事项\n\n与其他编程语言相比，在 JavaScript 中定义函数时省略参数是完全合法的。缺失的参数会被赋予 `undefined`\
    \ 值。当然，通过省略参数值，函数可能无法正常工作。\n\n如果你传递了意外的参数（创建函数时未定义的），不会发生错误。你可以通过 `arguments`\
    \ 访问这些参数，`arguments` 对所有函数都可用。\n\n## this 和 arguments 值对所有函数可用\n\n在所有函数的作用域体内部，`arguments`\
    \ 对象是一个类数组对象，包含了传递给函数的参数。在接下来的代码中，尽管我们在定义函数时没有指定参数，但我们可以依靠调用时传递的参数来访问它们。\n\n示例：sample8.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body\n<script>\nvar add = function\
    \ () {\nreturn arguments[0] + arguments[1];\n}\nconsole.log(add(4, 4)); // 返回\
    \ 8.\n</script>\n</</body>>\n</html>\n```\n\n`this` 关键字传递所有传递，它是包含函数的对象的引用。正如你预期的，作为对象属性的函数（即方法）可以使用\
