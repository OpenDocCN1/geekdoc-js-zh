    \ instance(s).\n\nSample: sample129.html\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\nvar Foo = function Foo() { };\n\nFoo.prototype.x = 1;\n\n\
    var FooInstance = new Foo();\n\nconsole.log(FooInstance.x); // Logs 1, as you\
    \ think it would.\n\n// Now let's replace/override the prototype object with a\
