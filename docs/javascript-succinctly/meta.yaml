    ## Creating shorthand or literal values from constructors


    JavaScript provides shorthands—called “literals”—for manufacturing most of native
    object values without having to use new Foo() or new Bar(). For most part, the
    literal syntax accomplishes the same thing as using the new operator. The exceptions
    are Number(), String(), and Boolean()—see the notes after the following sample.


    If you come from other programming backgrounds, you are likely more familiar with
    the literal way of creating objects. In the following sample, I instantiate the
    native JavaScript constructors using the new operator and then create literal
    equivalents.


    ## Sample: sample11.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>


    var myNumber = new Number(23); // An object.

    var myNumberLiteral = 23; // Primitive number value, not an object.


    var myString = String(''male''); // An object.

    var myStringLiteral = ''male''; // Primitive string value, not an object.


    var myBoolean = new Boolean(false); // An object.

    var myBooleanLiteral = false; // Primitive boolean value, not an object.


    var myObject = new Object();

    var myObjectLiteral = {};

    var myArray = new Array(''foo'', ''bar'');

    var myArrayLiteral = [''foo'', ''bar''];


    var myFunction = new Function("x", "y", "return x*y");

    var myFunctionLiteral = function (x, y) { return x * y; }


    var myRegExp = new RegExp(''[a-z]+\b'');

    var myRegExpLiteral = /[a-z]+\b/;


    // Verify that literals are created from same constructor.

    console.log(myNumber.constructor, myNumberLiteral.constructor);

    console.log(myString.constructor, myStringLiteral.constructor);

    console.log(myBoolean.constructor, myBooleanLiteral.constructor);

    console.log(myObject.constructor, myObjectLiteral.constructor);

    console.log(myArray.constructor, myArrayLiteral.constructor);

    console.log(myFunction.constructor, myFunctionLiteral.constructor);

    console.log(myRegExp.constructor, myRegExpLiteral.constructor);


    </script></body></html>

    ```


    What you need to take away here is the fact that, in general, using literals simply
    conceals the underlying process identical using the new operator. More importantly,
    it''s much more convenient!


    Okay, things are a little more complicated with the primitive string, number,
    and Boolean values. In these cases, literals take on the characteristics of primitive
    values rather than complex objects. See the notes that follow.


    ## Notes


    When using literals for String(), Number(), and Boolean(), an actual object is
    never created until the value is treated as an object. In other words, you are
    dealing with a primitive data type until you attempt to use or retrieve properties
    associated with the constructor (e.g., var charactersFoo = ''foo''.length). When
    this happens, JavaScript creates a wrapper object for the literal value behind
    the scenes, allowing the value to be treated as an object. Then, after the method
    is called, JavaScript discards the wrapper object and the value returns to a literal
    type. This is why string, number, and Boolean are considered primitive (or simple)
    data types. I this clarifies the misconception "everything in JavaScript is an
    object" from the concept "everything in JavaScript can act like an object.".


    ## Primitive (aka simple) values


    The JavaScript values 5, ''Foo'', true, false, as well as null and undefined,
    are considered primitive because they are irreducible. That is, a number is a
    number, a string is a string, Boolean is either true or false, and null and undefined
    are just that, null and undefined. These values are inherently simple and do not
    represent values that can be made of other values.


    Examine the following code and ask yourself, the string, number, Boolean, null,
    and undefined values.


    ## Sample: sample12.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var myString = ''string''

    var myArray = 10;

    var myBoolean = false;

    var myNull = null;

    var myUndefined = undefined;


    console.log(myString, myArray, myBoolean, myNull, myUndefined);


    var myObject = {

    myString: ''string'',

    Number: 10,

    myBoolean: false,

    myNull: null,

    myUndefined: undefined

    };


    console.log(myObject);


    var myArray = [''string'', 10, false, null, undefined];


    console.log(myArray);

    </script></body></html>

    ```


    Quite simply, primitive values represent the lowest form (i.e. simplest) of data
    available in JavaScript.


    ## Notes


    As opposed to creating values with literal syntax, when a String(), Number(),
    or Boolean() value is created using the new keyword, the object created is a complex
    object.


    It''s critical that you understand the fact that the String(), Number(), and Boolean()
    constructors are dual-purpose constructors used to create literal/primitive values
    as well as complex values. These constructors do not always return objects, but
    instead, when used without the "new" operator, can return a primitive representation
    of the actual complex value.


    ## The primitive values null, undefined, "string", 10, true, and false are not
    objects


    The null and undefined values are trivial values that do not require a constructor
    function, nor the use of the new operator to establish them as a JavaScript value.
    To use null or undefined, all you do is as if they were an operator. The remaining
    primitive values—string, number, and Boolean—while technically returned by a constructor
    function, are not objects.

