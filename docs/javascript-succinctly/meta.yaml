    \ and `arguments` follow lexical scope.\n\n# The this keyword refers to the head\
    \ object in functions\n\nYou might be wondering what happens to `this` when it\
    \ is used inside of a function that is contained inside another function. The\
    \ bad news is in ECMA 3, `this` loses its way and refers to the head object (the\
    \ `window` object in browsers), instead of the object within which the function\
    \ is defined.\n\nIn the following code, `this` inside of `func2` and `func3` loses\
    \ its way and refers not to `myObject` but instead to the head object.\n\n**Sample:\
    \ sample102.html**\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar\
    \ myWeb = {\n  func1: function () {\n    console.log(this); // Logs myObject.\n\
    \    var func2 = function () {\n      console.log(this) // Logs window, and will\
    \ do so from this point on.\n      var func3 = function () {\n        console.log(this);\
    \ // Logs window, as it’s the head object.\n      } ();\n    })();\n  }\n}\n```"
