    \ that does not contain it, JavaScript will search the prototype chain for the\
    \ constructor function that created the object (e.g., Array), and inspect its\
    \ prototype (e.g., Array.prototype) to see if the property can be found. If the\
    \ first prototype object does not have the property, JavaScript keeps searching\
    \ up the chain at the constructor before the initial constructor. It can do all\
    \ the way up to the end of the chain.\n\nWhere does the chain end? Let's examine\
