- md: "\n# Sample:sample121.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  // This code only works in browsers that support __proto__ access.\n  Array.prototype.foo\
    \ = 'foo';\n  var myArray = new Array();\n\n  console.log(myArray.__proto__.foo);\
    \ // Logs foo, because\n  myArray.__proto__ = Array.prototype\n\n</script></body></html>\n\
    ```\n\nSince accessing __proto__ is not part of the official ECMA standard, there\
    \ is a universal way to trace the link from an object to the prototype it inherits,\
    \ and by using the constructor property. This is demonstrated in the following\
    \ sample.\n\n# Sample:sample122.html\n\n```html\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\n  Array.prototype.foo = 'foo'; // All instances of Array()\
    \ now inherit a foo property.\n  var myArray = new Array();\n\n  // Trace foo\
    \ in a way leveraging *.constructor.prototype\n  console.log(myArray.constructor.prototype.foo);\
    \ // Logs foo.\n\n  // Or, of course, leverage the chain.\n  console.log(myArray.foo)\
    \ // Logs foo.\n\n  // Uses prototype chain to find property at Array.prototype.foo\n\
    </script></body></html>\n```\n\nIn this example, the foo property is found within\
    \ the prototype object. You need to realize this is only possible because of the\
    \ association between the instance of Array() and the Array() constructor prototype\
    \ object (i.e. Array.prototype). Simply put, myArray.__proto__ (or myArray.constructor.prototype)\
    \ references Array.prototype.\n\n# Last step in the prototype chain is Object.prototype\n\
    \nSince the prototype chain is the last step, the prototype chain or lookup is\
    \ at Object.prototype. In the code follows, we call myArray, which is an empty\
    \ array. I then attempt to access a property of myArray that has not been defined,\
    \ engaging the prototype lookup chain. The myArray object is searched for the\
    \ foo property. Being absent, the property is looked for at Array.prototype, but\
    \ it is not there either. The final place JavaScript looks is Object.prototype.\
    \ It is not defined in any of those three objects, the property is undefined.\n\
    \n# Sample: sample123.html\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \  var myArray = [];\n\n  console.log(myArray.foo); // Logs undefined.\n\n  /*\
    \ foo was not found at myArray.foo or Array.prototype.foo\n  Object.prototype.foo,\
    \ so it is undefined. */\n</script></body></html>\n```\n\nTake note that the chain\
    \ stopped with Object.prototype. The last place we looked for foo was Object.prototype.\n\
    \n# Notes\n\nCareful! Anything added to Object.prototype will show up in a for\
    \ in loop.\n\n# The prototype chain returns the first property match it finds\
    \ in the prototype\n\nLike the scope chain, the prototype chain will use the first\
    \ value it finds during the chain lookup.\n\nModifying the previous code example,\
    \ if we added the value to the Object.prototype and Array.prototype objects, and\
    \ then attempted to access a value on an array instance, the value returned would\
    \ be from the Array.prototype object.\n\n# Sample: sample124.html\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n  Object.prototype.foo = 'object-foo';\n\
    \  Array.prototype.foo = 'array-foo';\n  var myArray = [];\n\n  console.log(myArray.foo);\
    \ // Logs 'array-foo', which was found at Array.prototype.foo\n\n  myArray.foo\
    \ = 'bar';\n\n  console.log(myArray.foo) // Logs 'bar', was found at Array.prototype\n\
    </script></body></html>\n```\n\nIn this sample, the foo value at Array.prototype.foo\
    \ is shadowing, masking, the foo value found at Object.prototype.foo. Just remember\
    \ that the lookup ends when the property is found in the chain, even if the same\
    \ property name is used farther up the chain.\n\n# Replacing the prototype property\
    \ with a new object removes the default constructor property\n\nIt's possible\
    \ to replace the default prototype property with a new value. However, doing so\
    \ will eliminate the default constructor property in the \"pre-made\" prototype\
    \ object—unless you manually specify it.\n\nIn the code that follows, we create\
    \ a Foo constructor function, replace the prototype property with a new empty\
    \ object, and verify that the constructor property is broken (it now references\
    \ the less useful Object prototype).\n\nSample: sample125.html\n\n```html\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\nvar Foo = function() { };\n\nFoo.prototype\
    \ = {}; // Replace prototype property with an empty object.\n\nvar FooInstance\
    \ = new Foo();\n\nconsole.log(FooInstance.constructor === Foo); // Logs false,\
    \ we broke the reference.\nconsole.log(FooInstance.constructor); // Logs Object(),\
    \ not Foo()\n\n// Compare to code in which we do not replace the prototype value.\n\
    \nvar Bar = function Bar() { };\n\nvar BarInstance = new Bar();\n\nconsole.log(BarInstance.constructor\
    \ === Bar); // Logs true.\nconsole.log(BarInstance.constructor); // Logs Bar()\n\
    \n</script></body></html>\n```\n\nIf you intend to replace the default prototype\
    \ property (common with some JS patterns) set up by JavaScript, you should write\
    \ back a constructor property that references the constructor function. In the\
    \ following sample, we alter our previous code so that the constructor property\
    \ will provide a reference to the proper constructor function.\n\nSample: sample126.html\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar Foo = function\
    \ Foo() { };\n\nFoo.prototype = { constructor: Foo };\n\nvar FooInstance = new\
    \ Foo();\n\nconsole.log(FooInstance.constructor === Foo); // Logs true.\nconsole.log(FooInstance.constructor);\
    \ // Logs Foo()\n\n</script></body></html>\n```\n\n# Instances that inherit from\
    \ prototype will always get the latest value\n\nThe prototype property is dynamic\
    \ in the sense that instances will always get the latest value regardless of when\
    \ the instance was installed. In the code follows, we create a Foo constructor,\
    \ add the property x, and then create an instance. Next, we log the value of x.\
    \ Then we update the prototype and log it.\n\nSample: sample127.html\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar Foo = function() { };\n\n\
    Foo.prototype = { x: 1 };\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.x);\
    \ // Logs 1.\n\nFoo.prototype.x = 2;\n\nconsole.log(FooInstance.x); // Logs 2,\
    \ the FooInstance was updated.\n\n</script></body></html>\n```\n\nGiven the lookup\
    \ chain works, this behavior should not be surprising. If you are wondering, this\
