  md: "# Chapter 15 Array()\n\n# Conceptual overview of using Array() objects\n\n\
    An array is an ordered list of values typically created with the intention of\
    \ looping through numerically indexed values, beginning with the index zero. What\
    \ you need to know is that arrays are numerically ordered, as opposed to objects\
    \ which have property names associated with values in non-numeric order. Essentially,\
    \ arrays use numbers as a lookup key, while objects have user-defined property\
    \ names. JavaScript does not have true associative arrays, but objects can be\
    \ used to achieve the functionality of associative arrays.\n\nIn the following\
    \ sample, I store four strings in myArray that I can access using a numeric index.\
    \ I compare and contrast myArray to an object literal mimicking an associative\
    \ array.\n\nSample: sample133.html\n\n```\n<DOCTYPE html><html> lang=\"en\"><body><script>\n\
    \  var myArray = ['blue', 'green', 'orange', 'red'];\n\n  console.log(myArray[0]);\
    \ // Logs blue using the 0 index to access the\n  string in myArray.\n\n  // Versus\n\
    \  var myObject = { // aka an associative array/hash, known as an object in\n\
    \  JavaScript.\n    'blue': 'blue',\n    'green': 'green',\n    'orange': 'orange',\n\
    \    'red': 'red'\n  };\n\n  console.log(myObject['blue']); // Logs blue.\n</script></body></html>\n\
    ```\n\n# Notes\n\nArrays can hold any type of values, and these values can be\
    \ updated or deleted at any time.\n\nIf you need a hash (aka associative array),\
    \ an object is the closest solution.\n\nAn Array() is just a special type of Object().\
    \ That is, Array() instances are basically\nObject() instances with a couple of\
    \ extra functions (e.g., .length and a built-in numeric\nindex).\n\nValues contained\
    \ in an array are commonly referred to as elements."
  merge: -1
  pgno: 118
