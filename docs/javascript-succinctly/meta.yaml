    ## 从构造函数创建简写或字面量


    JavaScript 提供了简写形式——称为“字面量”（literals），用于制造大多数原生对象值，而无需使用 `new Foo()` 或 `new Bar()`。在大多数情况下，字面量语法实现与使用
    `new` 运算符相同。异常是 `Number()`、`String()` 和 `Boolean()`——请参考后续示例后的注释。


    如果你来自其他编程背景，你可能更熟悉使用字面量创建对象。在下面的示例中，我使用 `new` 运算符实例化原生 JavaScript 构造函数，然后创建等效的字面量。


    ## 示例：sample11.html


    ```html

    <!DOCTYPE html><html lang="en"><body><script>


