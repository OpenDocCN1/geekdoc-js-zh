  \ = function () {\n  var allMessages = this.getLog();\n  for (var i = 0; i < allMessages.length;\
  \ i++) {\n    console.log(allMessages[i]);\n  }\n};\n```\n\n# 第 9 章 解决方案\n\n## 破解代码\n\
  \n1. **HTML 文件更新并保存后，浏览器没有立即更新。为什么？**\n浏览器当前拥有旧版本的 HTML 文件。刷新页面将会更新。\n\n2. **`document`\
  \ 对象是什么？**\n`document` 对象是 JavaScript 对网页的表示。\n\n3. **`document.getElementsByClassName`\
  \ 和 `document.getElementById` 的用途是什么？**\n这些函数用于 JavaScript 操作 HTML 元素。\n\n4. **`document.getElementsByClassName`\
  \ 和 `document.getElementById` 有什么区别？**\n`document.getElementsByClassName` 搜索类的实例并返回一个类数组的数据结构；而\
  \ `document.getElementById` 只查找一个。\n\n5. **HTML 元素中包含什么属性？**\n包含文本的属性是 `innerHTML`。\n\
  \n6. **什么是事件监听器（event listener）？**\n事件监听器是一个被创建并在后台等待某种交互的 JavaScript 函数，其范围从按键到点击。一旦发生交互，JavaScript\
  \ 将运行其内部的代码。\n\n7. **在我们的示例中，点击事件监听器是应用于按钮的。为什么？**\n事件监听器应该应用于按钮，因为用户可以在页面上的任何地方点击。只要用户在页面上点击，`document`\
  \ 的事件监听器就会触发。\n\n8. **使用 HTML 脚本标签运行 JavaScript 代码的两种方法是什么？**\nHTML 脚本标签可以包含 JavaScript\
  \ 代码，也可以带有 `src` 属性。\n\n## 调试\n\n事件监听器附加到了错误的元素。添加到 `document` 的事件监听器将处理任何点击。正确的\
  \ `id` 应该是 `'text'`。\n\n```javascript\nvar button = document.getElementById('delete-all');\n\
  button.addEventListener('click', function() {\n  var div = document.getElementById('text');\n\
  \  div.innerHTML = '';\n});\n```\n\n## 术语表\n\n- **抽象 (abstraction)**: 通过隐藏实现细节使复杂操作变得容易。\n\
  - **累加器 (accumulator)**: 用于在循环中缓慢构建值的变量分类。\n- **逻辑与运算符 (AND operator)**: 符号 `&&`，要求两个值都为真才能为真。\n\
  - **算术赋值 (arithmetic assignment)**: 用于数学运算或自组合字符串的语法。\n- **数组 (array)**: 存储数据的数据结构；通过索引访问数据。\n\
  - **赋值 (assignment)**: 将数据关联到变量的过程。\n- **布尔 (boolean)**: 表示真或假的数据类型。\n- **括号表示法\
  \ (bracket notation)**: 通过键访问对象数据结构中值的语法；也用于通过索引访问数组中的值。\n- **break**: 循环中完全退出的关键字。\n\
  - **驼峰命名法 (camelCase)**: 第一个单词小写，后续单词首字母大写。\n- **注释 (comment)**: 代码中不执行的文本。\n- **编译器\
  \ (compiler)**: 一次分析并打包大组代码的程序。\n- **合并 (concat)**: 合并两个数组或字符串的过程，“concatenation”的缩写。\n\
  - **条件语句 (conditional statement)**: 结果为真或假的语句。\n- **构造函数 (constructor function)**:\
  \ 使用 `new` 关键字初始化对象实例的函数。\n- **继续 (continue)**: 循环中停止后续操作并进入循环下一次迭代的关键字。\n- **约定\
  \ (convention)**: 社区认可的编码风格。\n- **CSS**: 级联样式表，一种视觉增强 HTML 的样式语言。\n- **数据结构 (data\
  \ structure)**: 指存储任意数量数据类型的统术语。\n- **声明 (declare)**: 创建变量。\n- **递减 (decrement)**:\
  \ 将数据类型为数字的变量值减 1。\n- **document**: 浏览器内部的变量，JavaScript 对网站表示。\n- **点运算符 (dot operator)**:\
  \ 访问实例变量或方法的语法。\n- **转义字符 (escape character)**: 用于字符串；一种特殊字符，反斜线表示键符号应被忽略并视为字符串。\n\
  - **相等运算符 (equality operator)**: 比较数据片段是否相同的运算符；相等运算符使用类型转换。\n- **事件监听器 (event listener)**:\
  \ 创建并在后台等待某种类型交互的函数。\n- **for 循环 (for loop)**: 一直运行直到其终止条件为假的循环类型；在语法中它还包含初始化和后置句。\n\
  - **函数 (function)**: 可将语句组合在一起的实体；代码可以根据需要随时执行。\n- **高级语言 (high-level language)**:\
  \ 类似于人类操作和逻辑的编程语言。\n- **HTML**: 超文本标记语言，一种在 Web 浏览器中渲染内容的模板语言。\n- **HTMLCollection**:\
  \ 从 `getElementsByClassName` 返回的类数组数据结构。\n- **if...else if...else**: 允许条件执行代码的特性。\n\
  - **不可变 (immutable)**: 无法修改的数据。\n- **递增 (increment)**: 将数据类型为数字的变量值加 1。\n- **索引\
  \ (index)**: 数组中元素的位置；在 JavaScript 中，数组索引从 0 开始。\n- **实例变量 (instance variable)**:\
  \ 存储在对象实例内部作为属性的变量；使用括号或点运算符访问。\n- **解释器 (interpreter)**: 逐行分析代码的程序。\n- **调用 (invoke)**:\
  \ 使用括号运行的过程。\n- **关键字 (keyword)**: JavaScript 保留的特殊字符（字符组合）。\n- **长度 (length)**:\
  \ 数组中的条目数量。\n- **词作用域 (lexical scope)**: 变量在声明它们的函数内，以及在其内部的作用域可用。\n- **链接标签 (link\
  \ tag)**: 用于运行 CSS 文件代码的 HTML 标签。\n- **循环 (loop)**: 允许重复执行代码的语言特性。\n- **方法 (method)**:\
  \ 存储在对象中的函数；只能通过对象实例访问。\n- **数字 (number)**: JavaScript 中的数据类型；表示数字。\n- **NaN**:\
  \ 表示非逻辑数字的数字类型。\n- **逻辑非运算符 (NOT operator)**: 符号 `!`，反转布尔值。\n- **对象 (object)**:\
  \ 1) 以键值对形式存储数据的数据结构；2) 内部包含数据和函数的实体。\n\n\n\n\n\n\n- **对象实例 (object instance)**:\
  \ 内部包含数据的对象实体；这些值不会与其他对象实例之间共享。\n\n- **面向对象编程 (object-oriented programming)**:某些编程语言的特性，赋予程序员创建内部包含自身函数和数据的实体。\n\
  \n- **或运算符 (OR operator)**: 关键符号 `||`，要求至少有一个值为真，其评估结果才为真。\n\n- **参数 (parameter)**:\
  \ 为函数创建的变量，在函数被调用时可以传递其值。\n\n- **驼峰命名法 (pascal case)**: 每个单词的首字母均大写。\n\n- **属性 (property)**:\
  \ 通过键访问的数据片段（包括方法）；适用于对象数据结构和对象实例。\n\n- **伪代码 (pseudo code)**:用纯英语编写的计算机算法。\n\n\
  - **关系运算符 (relational operator)**: 比较两个数据之间数值的运算符。\n\n- **作用域 (scope)**: 代码脚本中变量和函数可用范围的规则。\n\
  \n- **标签 (tag)**: 用于从 JavaScript 文件中运行代码的 HTML 标签。\n\n- **严格相等运算符 (strict equality\
  \ operator)**: 比较相等性但绝不使用类型转换的运算符。\n\n- **字符串 (string)**: 代表字符的数据类型。\n\n- **类型转换\
  \ (type coercion)**: JavaScript 的一种过程，通过在评估期间更改数据类型来尝试协调不逻辑的操作。\n\n- **单元测试 (unit\
  \ testing)**: 为程序的各个部分编写测试的过程。\n\n- **变量 (variable)**: 可以与数据数据关联的名字。\n\n- **while\
  \ 循环 (while loop)**: 一种循环，直到终止条件评估为假为止都会持续运行。\n\n## 资源\n\n### 网站 (WEBSITES)\n\n\
  - **LeetCode** ([LeetCode.com](http://LeetCode.com)) 一个在线编程题库。他们为所有技能水平的程序员提供了练习题。\n\
  - **现代 JavaScript 教程 (The Modern JavaScript Tutorial)** ([JavaScript.info](http://JavaScript.info))\
  \ 对 JavaScript 各方面的高级概述。这是我的收藏，但它不适合胆小的人！\n- **Mozilla MDN Web Docs** ([Developer.Mozilla.org/en-US)](http://Developer.mozilla.org/en-US))\
  \ 为 JavaScript 和 Web 开发提供了全面的文档。它非常详细，主要供专业人士使用。\n- **Stack Overflow** ([StackOverflow.com](http://StackOverflow.com))\
  \ 一个为程序员提供的社区驱动帮助论坛。你对编程的大多数问题已经由该网站的人回答了！\n\n### 书籍 (BOOKS)\n\n- **《清洁代码：敏捷软件手术手册》(Clean\
  \ Code: A Handbook of Agile Software Craftsmanship)**，Robert C. Martin 等，是一本关于编码风格的高级指南。请随手备。如果你花时间学习\
  \ JavaScript 提供的一切，这将是将你的程序员能力提升到新水平的方法。\n\n## 致谢\n\n感谢 Jae Bradley，一位出色的同事。他以及他的激情激励我突破边界，努力成为更好的自己。\n\
  \n![Image 86](img/index-196_1.jpg)\n\n## 关于作者\n\nAndrew Yueh 是一位专业的软件开发人员，专攻 JavaScript\
  \ 和现代网站技术。他拥有德克萨斯农业机械州立大学的工程硕士学位，他的论文奠定了他对 Web 开发的热情。\n\nAndrew 曾在多家科技公司工作。他曾担任富国银行一个团队的技术主管，在那里指导过多名开发人员提高他们的编程能力。\n\
  \n在空余时间，他辅导高中生学习各个科目，包括 JavaScript 基础。作为一名业余程序员，他还致力于多个用 JavaScript 编写的个人编码项目。\n\
