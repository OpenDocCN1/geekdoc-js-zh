  ## 黑客提示\n\n点击事件是 JavaScript 中可用的许多事件类型之一。如果你想了解更多可用的事件，可以通过在线资源找到它们。\n\n![Image\
  \ 73](img/index-130_1.jpg)\n\n## 使用 CSS 隐藏元素\n\nCSS 与 JavaScript 的配合工作得非常好。在页面上创建元素有两种方法：一种是手动创建它们，另一种是显示隐藏的元素。\n\
  \n#### 将 CSS 应用到 HTML\n\n将 CSS 样式应用到页面有两种方法。一种是使用 `style` 标签。CSS 可以封装在其中，样式将通过属性类应用。在这里，为按钮添加了\
  \ `hide` 类名，并关联相应的 CSS 使按钮不可见。\n\n```html\n<html\n\n<head>\n\n<style>\n\n.hide {\n\
  \nopacity: 0;\n\n}\n\n</style>\n</head>\n\n<body>\n\n<button id=\"clickable-button\"\
  \ class=\"hide\"> Click me!\n\n</button>\n\n<body>\n\n<script src=\"index.js\"></script>\n\
  \n</html>\n```\n\n在浏览器中检查此内容，按钮现在消失了！但如果你检查页面，按钮仍然在那里！它只是不可见。\n\n另一种方法是导入 CSS 文件，这种方法更常用。这是通过使用\
  \ `link` 标签并为标签赋予 `rel` 和 `href` 属性来实现。`rel` 的值始终是“stylesheets”，而 `href` 是文件名。让我们修改一下，让样式位于单独的文件中，但仍然应用到页面上。\n\
  \n创建一个带有 `.css` 扩展名的新文件。我的文件名为 `styles.css`。\n\n```css\n.hide {\n\nopacity: 0;\n\
  \n}\n```\n\n然后使用 `link` 标签导入它。什么都不应该发生变化！\n\n```html\n<html\n\n<head>\n\n<link rel=\"\
  stylesheet\" href=\"styles.css\">\n\n</head>\n\n<body>\n\n<button id=\"clickable-button\"\
  \ class=\"hide\"> Click me!\n\n</button>\n\n<body>\n\n<script src=\"index.js\"></script>\n\
  \n</html>\n```\n\n## 使用 CSS 显示和隐藏元素\n\nCSS 可以用于隐藏元素，而 JavaScript 可以操作 HTML，包括类和\
  \ `ids`。这意味着你可以使用代码显示和隐藏元素！让我们就这样做。添加一个带有 `hide` 类和 `id` 的 HTML 元素，以便可以使用 `getElementById`\
  \ 获取它。\n\n```html\n<html\n\n<head>\n\n<link rel=\"stylesheet\" href=\"styles.css\"\
  >\n\n</head>\n\n<body>\n\n<button id=\"clickable-button\">\n\nClick me!\n\n</button>\n\
  \n<div class=\"hide\" id=\"content\"> Content!\n\n</div>\n\n<body>\n\n<script src=\"\
  index.js\"></script>\n\n</html>\n```\n\n然后，在 JavaScript 文件中，为按钮事件监听器添加行为，从 HTML\
  \ 元素中移除该类。\n\n```javascript\n// index.js\n\n![Image 74](img/index-132_1.jpg)\n\n\
  var button = document.getElementById('clickable-button'); button.addEventListener('click',\
  \ function () {\n\nvar hiddenElement = document.getElementById('content'); hiddenElement.classList.remove('hide');\n\
  \n});\n```\n\n点击按钮后，隐藏的内容应该显示出来。\n\n## 浏览器特定的 JavaScript 实战\n\n现在你已经通了 JavaScript\
  \ 如何与浏览器和 HTML 交互，是时候升级你的迎接更大的挑战了！\n\n### 在页面上输入\n\n在此练习中，你将让你的网站检测按键并将其放在页面上！\n\
  \n需要一个带有 `div` 的 HTML 文件。这个 `div` 将包含用户输入的按键。还需要一个指向 `index.js` 文件的 `script` 标签。\n\
  \n```html\n<html\n\n<head>\n\n</head>\n\n<body>\n\n<div id=\"text\">\n\n</div>\n\
  \n<body>\n\n<script src=\"index.js\"></script>\n\n</html>\n```\n\n在 `index.js` 中，添加用于记录按键事件监听器。在之前的事件监听器示例中，你需要将监听器附加到按钮上。但在这里，位置并不重要。所有的按键都应该被记录。事件监听器应该添加到整个\
  \ `document`。\n\n```javascript\n// index.js\n\ndocument.addEventListener('keydown',\
  \ function(event) {\n\nconsole.log(event);\n\n![Image 75](img/index-133_1.jpg)\n\
  \n});\n```\n\n刷新页面并按下“a”键后，可以在开发者控制台中看到按键事件的事件对象。\n\n事件对象包含大量信息，但 `key` 属性包含了重要信息。它包含了按键名称。\n\
  \n```javascript\n// index.js\n\ndocument.addEventListener('keydown', function(event)\
  \ {\n\nconsole.log(event.key);\n\n});\n```\n\n通过 `console.log`，可以在开发者控制台中看到按键事件的事件对象。通过\
  \ `console.log`，可以在开发者控制台中看到按键事件的事件对象。\n\n等待，刷新页面并按下“a”键后，可以在开发者控制台中看到按键事件的事件对象。\n\
  \n```javascript\n// index.js\n\ndocument.addEventListener('keydown', function(event)\
  \ {\n\nconsole.log(event.key);\n\nvar div = document.getElementById('text');\n\n\
  div.innerHTML += event.key;\n\n});\n```\n\n\n\n\n\n```javascript\nvar div = document.getElementById('delete-all');\n\
