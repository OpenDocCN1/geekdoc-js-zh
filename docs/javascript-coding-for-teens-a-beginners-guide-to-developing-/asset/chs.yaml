  电子书 ISBN：978-1-64876-112-6\nR0\n\n我将本书献给 Frank 和 May Yueh，感谢他们在向编程职业转型期间对我的支持。\n\
  \n## 函数表达式\n\n第二种语法是使用 `var` 声明将 `function` 关键字赋值给变量。建议加上分号。这种声明风格仅在进行面向对象编程时使用。\n\
  \n```javascript\nvar functionNameOfYourChoosing = function () {\n  // 在此处编写代码\n\
  };\n```\n\n## 函数调用\n\n函数名末后的括号会运行其内部的操作。正式术语是调用（invoke）。这种语法对于两种类型的函数声明都是相同的。\n\n\
  ```javascript\nfunctionNameOfYourChoosing();\n```\n\n## 返回语句\n\n在原生情况下，函数不会向外部世界暴露它计算的数据。\n\
  \n```javascript\nfunction add() {\n  var computed = 5 + 5;\n}\n\nadd(); // undefined\n\
  ```\n\n那是因为你没有告诉 JavaScript 你想要它！通过使用 `return` 关键字，函数可以暴露一段数据。\n\n```javascript\n\
  function add() {\n  var computed = 5 + 5;\n  return computed\n}\n\nadd(); // 10\n\
  ```\n\n## 函数参数\n\n在上一个示例中，`add` 函数只能将 5 和 5 相加。如果你可以接受任何两个数字并将它们加在一起，不是更好吗？这就是参数发挥作用的地方。\n\
  \n参数是预备的变量。这使得函数能够适应许多情况。\n\n```javascript\nfunction add(num1, num2) {\n  return\
  \ num1 + num2;\n}\n```\n\n你告诉 JavaScript 在调用期间可以传入两个变量，`num1` 和 `num2`。有了参数，这个 `add`\
  \ 函数就可以处理任何数字。\n\n```javascript\nadd(10, 5); // 15\nadd(20, 30); // 50\n```\n\n\
  ### 使用 Return 提前终止\n\n`return` 关键字实际上同时承担两个作用：\n\n1. 它从函数输出一个值。\n2. 它停止函数的执行。\n\n\
  你可能会发现自己不想在某个特定点之后执行代码，或者想做一个决定并停止所有后续操作。\n\n### 极客提示\n\n当你看到一个重复但值不同的算法时，考虑将该操作转换为带有参数的函数。\n\
  \n### 保护 add 免受类型转换\n\n让我们完善你的 `add` 函数并保护它免受错误输入的影响。记得类型转换和 `+` 运算符吗？\n\n```javascript\n\
  function add(num1, num2) {\n  return num1 + num2;\n}\n\nadd('10', '5'); // '105'\n\
  add(20, '30'); // '2030'\n```\n\n你的加法函数可以进行字符串拼接。但你总是想要相加，至少尝试尝试。让我们用提前返回来保护它。如果使用的数据不是数字，函数应该返回\
  \ `NaN`。\n\n```javascript\nfunction add(num1, num2) {\n  // 如果 num1 不是数字 或者 num2\
  \ 不是数字\n  if (typeof num1 !== 'number' || typeof num2 !== 'number') {\n    return\
  \ NaN;\n  }\n  return num1 + num2;\n}\n\nadd('10', 5); // 'NaN'\nadd(20, '30');\
  \ // 'NaN'\n```\n\n使用提前返回，你保护了函数免受类型转换或其他任何错误输入的影响。\n\n## 作用域\n\n现在是讨论使用函数时变量可用性的好时机。在编码术语中，变量可用性被称为作用域（scope）。此后将大量编写函数。了解你需要的特定数据在代码的特定区域是否可用很重要。\n\
  \n### VAR: 函数作用域\n\n声明的位置现在很重要了。在函数内部声明的变量仅在函数内部可用。\n\n这段代码将产生意外之外的行为：\n\n```javascript\n\
  function sampleFunc() {\n  var innerVariable = '我仅在该函数中可用';\n  console.log(innerVariable);\n\
  }\n\nfunction otherSampleFunc() {\n  console.log(innerVariable);\n}\n\nsampleFunc();\n\
  otherSampleFunc();\n```\n\n运行 `otherSampleFunc()` 时发生错误。这是 JavaScript 实现作用域的结果。\n\
  \n### 词法作用域\n\n不同的编程语言在作用域方面有自己的规则。JavaScript 使用词法作用域（lexical scope）。词法作用域是指变量在其内部及其内部作用域可用，但在外部作用域不可用。让我们来看例子。\n\
  \n#### 嵌套函数\n\n函数可以写在其他函数内部！这创建了两层作用域。一个是内部作用域，另一个是外部作用域。\n\n在外部作用域声明的变量在任何内部作用域中都可用。\n\
  \n```javascript\nfunction outerScopeFunc() {\n  var outerVar = '我是外部作用域的！我在两个作用域中存在';\n\
  \  function innerScopeFunc() {\n    console.log(outerVar);\n  }\n  innerScopeFunc();\n\
  }\n\nouterScopeFunc();\n```\n\n但内部作用域在它们上方的作用域中不可用。\n\n```javascript\nfunction outerScopeFunc()\
  \ {\n  function innerScopeFunc() {\n    var innerVar = '我是内部作用域的！我只在这里存在';\n  }\n\
  \  console.log(innerVar);\n}\n\nouterScopeFunc();\n```\n\n理解作用域是编写函数的关键。有时变量在需要的地方可用，反之亦然。始终注意作用域。\n\
  \n## 电竞选手表现\n\n使用函数让你能够以优雅的方式解决困难挑战。让我们在解决问题的能力上迈出一大步！Electro 是来自 Undersea（一款热门电脑游戏）的全球顶尖电竞队。他们在全球舞台上拥有优异的记录。凭借丰富的才华选手阵容，他们会轮换谁上场，谁坐替补席。\n\
  \n### 选手参赛了吗？\n\n你的第一个挑战是检查选手在比赛中的参赛情况。这个函数应该能够处理任何选手和任何比赛结果。它们必须是参数。我们将函数命名为 `playedInTournament`，并将参数命名为\
  \ `tournament` 和 `player`。\n\n```javascript\nfunction playedInTournament(tournament,\
  \ player) {\n\n}\n```\n\n在此练习中，`tournament` 参数将具有以下结构。它是一个只有一个键 `players` 的对象数据结构。与键关联的值是一个玩家名称数组。\n\
  \n```javascript\n{\n  players: ['smirk', 'knight', 'fly']\n};\n```\n\n\n\n现在，你需要找到某个玩家是否参加过某场比赛。对象中有一个\
  \ `players` 键。目标是检查该玩家是否存在于数组中。你立刻知道\n\n![Image 31](img/index-72_1.jpg)\n\n需要一个\
  \ for 循环。该数组嵌套在对象中，因此必须通过它的键名 `players` 来访问。还需要检查该玩家是否参加了该比赛。用编程术语来表达，这需要一个 `if`\
  \ 条件。\n\n```javascript\nfunction playedInTournament(tournament, player) {\n\n  var\
  \ players = tournament.players;\n\n  for (var i = 0; i < players.length; i++) {\n\
  \n    var currentPlayer = players[i];\n\n    if (currentPlayer === player) {\n\n\
  \    }\n  }\n\n}\n```\n\n如果 `currentPlayer` 是要检查的玩家，则返回 `true`。但在什么时候应该返回 `false`\
  \ 呢？如果检查完了数组中的所有玩家，这意味着该玩家完全没有被找到。在函数的最后，返回 `false`。\n\n```javascript\n// tournament.js\n\
  \nfunction playedInTournament(tournament, player) {\n\n  var players = tournament.players;\n\
  \n  for (var i = 0; i < players.length; i++) {\n\n    var currentPlayer = players[i];\n\
  \n    if (currentPlayer === player) {\n\n      return true;\n\n    }\n  }\n\n  return\
  \ false;\n\n}\n```\n\n是时候验证代码了。为了做到这一点，你需要一个 `console.log` 来让函数数据出现在终端。我将文件命名为 `tournament.js`。\n\
  \n```javascript\nvar sampleTournament = {\n\n  win: true,\n\n  players: ['smirk',\
  \ 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament, 'smirk'));\
  \ console.log(playedInTournament(sampleTournament, 'superb'));\n```\n\n看起来不错！在 `sampleTournament`\
  \ 对象中，`smirk` 参加了比赛，但 `superb` 没有。\n\n从文件中删除两个 `console.log` 语句和数据结构 `sampleTournament`。今后它们将不再需要了。\n\
  \n## 黑客提示\n\n为了防止混淆，写一个表格来跟踪每次迭代中发生的情况。\n\n#### 数据结构嵌套数据结构\n\n对于随后的练习，需要一个比赛结果列表。在每个比赛结果中，我们还需要一个参加该比赛的玩家列表。\n\
  \n将此数据结构添加到文件中。\n\n```javascript\nvar tournaments = [\n\n  { win: true, players:\
  \ ['smirk', 'knight', 'fly'] },\n\n  { win: true, players: ['superb', 'san', 'tired']\
  \ },\n\n  { win: true, players: ['smirk', 'knight', 'tired'] },\n\n  { win: false,\
  \ players: ['san', 'superb', 'fly'] },\n\n  { win: true, players: ['smirk', 'san',\
  \ 'fly'] },\n\n  { win: false, players: ['superb', 'knight', 'tired'] },\n];\n```\n\
  \n### 参加比赛的次数\n\n玩家参与的数据在 `tournaments` 数组中。对于一个数据数组，显然需要一个循环。\n\n```javascript\n\
  function tournamentsPlayed(tournaments, player) {\n\n  var playCount = 0;\n\n  for\
  \ (var i = 0; i < tournaments.length; i++) {\n\n    var currentTournament = tournaments[i];\n\
  \n  }\n\n  return playCount;\n\n}\n```\n\n这一次，你需要检查玩家是否参加了该比赛。不仅如此，你必须记录这种情况发生的次数。确定一个玩家是否参加了某场特定的比赛是一项大量工作。每个比赛条目都需要搜索内部数组。但这个问题已经在\
  \ `playedInTournament` 中解决了。可以重用该函数。\n\n![Image 32](img/index-74_1.jpg)\n\n```javascript\n\
  var currentTournament = tournaments[i];\n\nvar playerDidPlay = playedInTournament(currentTournament,\
  \ player);\n\nif (playerDidPlay) {\n\n  playCount += 1;\n\n}\n```\n\n通过 `console.log`\
  \ 运行并验证代码。\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments, 'smirk'));\n\
  \nconsole.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n看起来不错。`smirk` 和\
  \ `superb` 都参加了三场比赛。现在这些 `console.log` 语句可以删除了。\n\n### 赢得比赛的次数\n\n现在，更进一步。检查并查看特定玩家参加过团队获胜比赛的次数。为了清楚地做到这一点，你需要：\n\
  1. 一个循环\n2. 一个累加变量来跟踪获胜的比赛次数\n\n```javascript\nfunction tournamentsWon(tournaments,\
  \ player) {\n\n  var winCount = 0;\n\n  for (var i = 0; i < tournaments.length;\
  \ i++) {\n\n    var currentTournament = tournaments[i];\n\n  }\n\n  return winCount;\n\
  \n}\n```\n\n与 `gamesPlayed` 相比情况有点不同。需要两个条件：\n1. 玩家参加了比赛\n2. 团队获胜了\n\n幸运的是，`playedInTournament`\
  \ 可以用于第一个条件。对于第二个条件，每个条目都有比赛结果，位于键 `win` 中。只有当该特定玩家参加时，两个条件都为真，才能将该场比赛计为胜利。在这一\n\
  \n![Image 33](img/index-75_1.jpg)\n\n![Image 34](img/index-75_2.jpg)\n\n在这种情况下，使用\
  \ AND 运算符 `&&` 来同时断言这两个条件。\n\n```javascript\nfunction tournamentsWon(tournaments,\
  \ player) {\n\n  var winCount = 0;\n\n  for (var i = 0; i < tournaments.length;\
  \ i++) {\n\n    var currentTournament = tournaments[i];\n\n    var playerDidPlay\
  \ = playedInTournament(currentTournament, player);\n\n    var tournamentWon = currentTournament.win;\n\
  \n    if (playerDidPlay && tournamentWon) {\n\n      winCount += 1;\n\n    }\n \
  \ }\n\n  return winCount;\n\n}\n```\n\n用 `console.log` 验证代码。\n\n```javascript\n\
  console.log(tournamentsWon(tournaments, 'smirk'));\n\nconsole.log(tournamentsWon(tournaments,\
  \ 'superb'));\n```\n\n看起来不错！看起来 `smirk` 赢得了三场比赛，而 `superb` 赢了一场。\n\n### 玩家胜率\n\n\
  现在你对确定胜率感兴趣。要解决这个问题，将获胜次数除以比赛次数。需要编写的算法很容易，因为两者都已经解决了！为了输出更整洁，将使用 `parseInt`。它将小数转换为整数。\n\
  \n```javascript\nfunction playerWinRate(tournaments, player) {\n\n  var total =\
  \ tournamentsPlayed(tournaments, player);\n\n  var won = tournamentsWon(tournaments,\
  \ player);\n\n  var percentage = (won / total) * 100;\n\n![Image 35](img/index-76_1.jpg)\n\
  \n  return parseInt(percentage);\n}\n```\n\n让我们验证。\n\n```javascript\nconsole.log(playerWinRate(tournaments,\
  \ 'smirk'));\n\nconsole.log(playerWinRate(tournaments, 'superb'));\n```\n\n看起来 `smirk`\
  \ 有完美的胜率，而 `superb` 是 33%。\n\n### 谁应该参加？\n\n噢不！看起来两个玩家之间存在争议。看起来 `smirk` 和 `superb`\
  \ 都想参加下一场比赛，但位置只有一个。为了解决这个问题，管理层决定检查相应玩家参赛时的表现。管理层不是程序员，他们不想看到两个数字。他们想看到关于谁应该参加、谁应该替补的消息。\n\
  \n到目前为止，你解决了许多挑战。许多简单的函数被编写并组合在一起解决棘手的挑战。最后一个！\n\n已经有一个计算每个玩家胜率的函数。只需比较胜率即可发现谁参加下一场比赛。这次需要三个参数：\n\
  1. 团队的比赛表现及其活跃玩家\n2. 一个玩家\n3. 另一个用于比较的玩家\n\n```javascript\nfunction whoShouldPlay(tournaments,\
  \ player1, player2) {\n\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
  \n  var player2WinRate = playerWinRate(tournaments, player2);\n}\n```\n\n这一次，你想要打印两个漂亮的消息。跟踪谁将成为替补，谁将成为活跃玩家。如果\
  \ `player1` 的胜率更高，他们应该是活跃玩家，而 `player2` 应该是替补。\n\n```javascript\nfunction whoShouldPlay(tournaments,\
  \ player1, player2) {\n\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
  \n  var player2WinRate = playerWinRate(tournaments, player2);\n\n![Image 36](img/index-77_1.jpg)\n\
  \n  var benchedPlayer;\n\n  var activePlayer;\n\n  if (player1WinRate > player2WinRate)\
  \ {\n\n    activePlayer = player1;\n\n    benchedPlayer = player2;\n\n  }\n\n}\n\
  ```\n\n但这还不够，因为还需要处理相反的情况。在这种情况下，你不需要 `else if`。只有两个选项。一个 `else` 语句将完美工作。\n\n\n\n\
  \n为了满足管理层的要求，为每个玩家的状态添加一个带有友好消息的 `console.log`。\n\n```javascript\nfunction whoShouldPlay(tournaments,\
  \ player1, player2) {\n  var player1WinRate = playerWinRate(tournaments, player1);\
  \ \n  var player2WinRate = playerWinRate(tournaments, player2); \n  var benchedPlayer;\n\
  \  var activePlayer;\n\n  if (player1WinRate > player2WinRate) {\n    activePlayer\
  \ = player1;\n    benchedPlayer = player2;\n  } else {\n    activePlayer = player2;\n\
  \    benchedPlayer = player1;\n  }\n\n  console.log(activePlayer + ' should play\
  \ in the next tournament');\n  console.log(benchedPlayer + ' should be benched');\n\
  }\n\nwhoShouldPlay(tournaments, 'smirk', 'superb');\n```\n\n结果已经出来了，差异显而易见。看来 smirk\
  \ 是更好的玩家，而 superb 将被下场。\n\n## 回顾\n\n这次练习整合了你到目前为止学 JavaScript 的每一个技术方面。但你可能已经注意到，你解决问题的方法同样重要。你将一个大挑战拆解成了五个更容易处理的挑战：\n\
  \n1. 比较两个玩家之间的胜率。\n2. 计算玩家的胜率。\n3. 计算玩家参加的比赛总场次。\n4. 计算玩家的获胜场次。\n5. 检查玩家是否参加了比赛。\n\
  \n所有这些部分的总和创造了一个复杂问题的简单解决方案。\n\n破解代码\n\n这一章是“买一送二”的。你不仅学习了函数，还略略体验了程序员用来用简单方法解决挑战性问题的策略类型。\n\
  \n1. 哪些品质让函数在编程时时变得备受青睐？\n2. 函数需要什么关键字才能输出暴露在函数之外的值？\n3. 如果没有显式的返回，函数会输出什么？\n4.\
  \ 什么是作用域？\n5. JavaScript 使用什么种类型的作用域？用你自己的话解释。\n\n## 调试\n\n程序员有一个名为单元测试的秘密武器。拆解问题允许你以增量的方式检查代码的正确性。每个函数都很小，所以很容易测试。如果每个小函数都能正常工作，那么整个挑战应该没有任何问题地运行！\n\
  \n```javascript\n// 重要！此函数将不支持数据结构\n// 和对象。仅适用于字符串、数字、null、布尔值和 undefined \nfunction\
  \ test(description, actual, expected) {\n  console.log(description);\n  if (actual\
  \ === expected) {\n    console.log(' pass!');\n  } else {\n    console.log(' fail!');\n\
  \    console.log(' received: ', actual);\n    console.log(' expected: ', expected);\n\
  \  }\n}\n```\n\n这是一个非常基础的函数，让你：\n\n1. 为自己快速写一条关于将测试什么的消息。\n2. 比较两个值。\n3. 知道你是否得到了预期的结果。如果没有，打印出你计算的结果与你预期的结果。\n\
  \n在开始处理真正的调试问题之前，是时候让这个测试函数投入行动了。为了这样做，你将故意创建一个错误的 `add` 函数，并看看你的测试函数会给你什么输出。\n\n\
  ```javascript\nfunction add(num1, num2) {\n  return num1 - num2;\n}\n\ntest('add\
  \ test #1', add(10, 20), 30);\ntest('add test #2', add(10, 15), 25);\n```\n\n很好！你不仅让\
  \ JavaScript 检查你的代码是否正确，而且当函数出错时，还让它向你展示你的计算结果。\n\n## 猜猜我猫的名字\n\n让我们用函数在终端里玩一个快速的小游戏。这并不容易！你需要将问题拆解为许多子问题，并将算法封装在函数中。\n\
  \n将输入一个字符，然后将收到关于猜测进展的反馈。当你正确猜出所有字符后，程序将打印全名并退出。\n\n现在，你的程序运行得并不好。事实上，它根本没有运行。以下是你的错误代码：\n\
  \n```javascript\nvar prompt = require(\"readline-sync\");\n\n// 重要！此函数将不支持数据结构\n\
  // 和对象。仅适用于字符串、数字、null、布尔值和 undefined \nfunction test(description, actual, expected)\
  \ {\n  console.log(description);\n  if (actual === expected) {\n    console.log('\
  \ pass!');\n  } else {\n    console.log(' fail!');\n    console.log(' received:\
  \ ', actual);\n    console.log(' expected: ', expected);\n  }\n}\n\nfunction includes(arrOrStr,\
  \ item) {\n  for (var i = 0; i < arrOrStr.length; i++) {\n    var currItem = arrOrStr[i];\n\
  \    if (currItem !== item) {\n      return true;\n    }\n  }\n  return false;\n\
  }\n\n// ... (其余的逻辑)\n```\n\n\n\n\n\n`parseInt` 函数接收一个数字并将其转换为整数。从技术上讲，它不会四舍五入或向下取整。它移除了数字中的小数部分。然而，更重要的是，它是将字符串形式的数字转换为实际数据类型数字的方法。\n\
  \n```javascript\nparseInt(1322.23423); // 1322\nparseInt('1322.23423'); // 1322\n\
  ```\n\n### PARFLOAT\n与 `parseInt` 解析数字和字符串形式数字一样，`parseFloat` 也这样做，但它保留了原始数字中所有的小数值。\n\
  \n```javascript\nparseFloat(1322.23423); // 1322.23423\nparseFloat('1322.23423');\
  \ // 1322.23423\n```\n\n### 字符串\n在本书范围内，大多数字符串操作将予以省略。但仍有两个重要的操作需要注意。\n\n#### 通过索引访问\n\
  对于某些算法，逐个元素地检查字符串是非常重要的。这可以通过索引访问每个字符来实现。字符串和数组通过索引访问元素的方式是相同的。\n\n```javascript\n\
  var dog = 'Misu';\ndog[0]; // 'M'\ndog[2]; // 's'\n```\n\n#### 转小写和大大写\n将字符转换为全小写或全大写可以分别使用\
  \ `toLowerCase` 和 `toUpperCase` 完成。\n\n```javascript\nvar dog = 'Misu';\ndog.toLowerCase();\
  \ // 'misu'\ndog.toUpperCase(); // 'MISU'\n```\n\n等等！为什么在变量名后面使用了这个函数？嗯，从技术上讲，这是一个方法（method）。我们将深入探讨这种差异的目的和原因。目前，只需知道方法是用这种语法调用的。\n\
  \n### 数组\n修改数组是非常常见的的操作，因此 JavaScript 包含了许多内置操作来按我们所需的方式修改它们。\n\n#### 插入\n数组中的项通过索引访问。\n\
  \n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\nanimals[0]; //\
  \ 'dog'\n```\n\n访问数组项的相同语法也可用于将新值赋值给索引。\n\n```javascript\nvar animals = ['dog',\
  \ 'cat', 'horse', 'bird'];\nanimals[0] = 'pig';\nanimals[0]; // 'pig'\n```\n\n####\
  \ PUSH\n一种常见操作是在数组末尾插入。数组方法名是 `push`。\n\n```javascript\nvar sampleArray = [];\n\
  sampleArray.push(10);\nsampleArray; // [10]\n```\n\n#### POP\n另一个常见操作是使用方法 `pop`\
  \ 删除数组的最后一项。\n\n```javascript\nvar sampleArray = [2, 10];\nsampleArray.pop();\n\
  sampleArray; // [2]\n```\n\n#### SHIFT\n可以使用 `shift` 方法删除数组的第一个元素。\n\n```javascript\n\
  var sampleArray = [2, 10];\nsampleArray.shift();\nsampleArray; // [10]\n```\n\n\
  #### UNSHIFT\n最后一种数组操作是 `unshift`，它将元素插入到数组前端。\n\n```javascript\nvar sampleArray\
  \ = [2, 10];\nsampleArray.unshift(5);\nsampleArray; // [5, 2, 10]\n```\n\n### 对象\n\
  与数组相比，对象的修改程度并不相同。这是出于更高级的技术原因。但对象仍然支持插入、替换和删除。\n\n#### 插入和替换\n对象值的插入是通过等号完成的。\n\
  \n```javascript\nvar animals = {};\nanimals.dog = 'sparky';\nanimals; // { dog:\
  \ 'sparky' }\n```\n\n插入的语法与替换相同。如果键（key）已经存在，它将替换该值。\n\n```javascript\nvar animals\
  \ = {\n  dog: 'sparky'\n};\nanimals.dog = 'not sparky';\nanimals; // { dog: 'not\
  \ sparky' }\n```\n\n#### 删除\n从对象中删除元素是一个不常用的操作。`delete` 运算符删除对象中的键值对。\n\n```javascript\n\
  var animals = {\n  dog: 'sparky'\n};\ndelete animals.dog;\nanimals; // { }\n```\n\
  \n### 变异\n修改数据类型而非总是创建新版本的想法被称为“可变性”（mutability）。操作可以是变异的，这意味着它修改了现有的数据。数据也可以被称为“不可变的”（immutable），意味着它从根本上无法被修改。\n\
  \n在下面的示例中，当使用数组和对象操作时，我们没有向新变量赋值或重新赋值。这是因为 `push`、`pop`、`shift` 和 `unshift` 是修改现有数组的操作。所展示的操作是改变现有数据结构的操作。\n\
  \n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\nanimals.push('lizard');\n\
  animals; // ['dog', 'cat', 'horse', 'bird', 'lizard'];\n```\n\n事实上，重新赋值是非常糟糕的。它可以创建出非常不直观的代码。\n\
  \n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\nanimals = animals.push('lizard');\n\
  animals; // 5\n```\n\n返回值为 5 是因为在将 lizard 推入之后，新数组的长度。但这可能不是想要的输出。更有可能，想要的输出是数组本身。\n\
  \n#### 字符串是不可变的\n```javascript\nvar animal = 'd';\nanimal += 'og';\nanimal; // 'dog'\n\
  ```\n\n你有没有注意到你一直在使用重新赋值运算符？那是因为字符串是不可变的。现有的字符串无法被更新。必须通过重新赋值来创建一个全新的字符串。\n\n```javascript\n\
  var animal = 'd';\nanimal + 'dog';\nanimal; // 'd'\n```\n\n由于 JavaScript 的字符串是不可变的，字符串拼接不会修改\
  \ `animal`。\n\n### 数据操作实战\n当你看到数据操作运行时，理解它会变得容易得多。我们还将介绍你将遇到最常见的数据操作策略。让我们开始吧！\n\
  \n#### 构建新数组\n获取一个数组并以某种形式对其进行修改，是所有程序中最常见的操作之一。在许多情况下，构建一个全新的数组比修改现有数组更有优势。\n\n\
  给定以下数组，创建一个技能水平高于 5 的玩家名称数组。\n\n```javascript\nvar players = [\n  { name: 'superb',\
  \ skill: 3 },\n  { name: 'smirk', skill: 7 },\n  { name: 'tired', skill: 6 },\n\
  \  { name: 'ANS', skill: 9 }\n];\n```\n\n这是预期的输出：\n```javascript\n['smirk', 'tired',\
  \ 'ANS']\n```\n\n为了使代码更容易管理，你把算法放在函数中。\n\n```javascript\nfunction getSkilledPlayers(allPlayers)\
  \ {\n  var skilledPlayers = [];\n  for (var i = 0; i < allPlayers.length; i++) {\n\
  \    var player = allPlayers[i];\n    if (player.skill > 5) {\n      skilledPlayers.push(player.name);\n\
  \    }\n  }\n  return skilledPlayers;\n}\n```\n\n将所有内容整合，这是你的代码和预期的输出：\n\n```javascript\n\
  var players = [\n  { name: 'superb', skill: 3 },\n  { name: 'smirk', skill: 7 },\n\
  \  { name: 'tired', skill: 6 },\n  { name: 'ANS', skill: 9 }\n];\n\nfunction getSkilledPlayers(allPlayers)\
  \ {\n  var skilledPlayers = [];\n  for (var i = 0; i < allPlayers.length; i++) {\n\
  \    var player = allPlayers[i];\n    if (player.skill > 5) {\n      skilledPlayers.push(player.name);\n\
  \    }\n  }\n  return skilledPlayers;\n}\n\nconsole.log(getSkilledPlayers(players));\n\
  ```\n\n为了保险起见，可以写一个表格来查看每次迭代后值是如何变化的。\n\n\n\n\n\n`PLAYER.NAME`\n\n`PLAYER.SKILL`\n\
  \n`PLAYER.SKILL > 5`\n\n`SKILLEDPLAYERS`\n\n| 名称 | 技能 | 条件 | 结果 |\n|---|---|---|---|\n\
  | 1 | superb | 3 | false | [] |\n| 2 | smirk | 7 | true | `['smirk']` |\n| 3 | tired\
  \ | 6 | true | `['smirk', 'tired']` |\n| 4 | ANS | 9 | true | `['smirk', 'tired',\
  \ 'ANS']` |\n\n## 黑客提示 (HACK HINT)\n\n如果你发现自己需要使用 `delete` 运算符，那么你的算法可能应该使用数组来解决。\n\
  \n## 在数组中更新对象\n\n假设你有一个对象，其键是玩家名称和他们的年龄。将这些数据合并到一个单一的数据结构中是有意义。你可以使用已经学过的策略来实现。\n\
  \n```javascript\nvar players = [\n  { name: 'superb', skill: 3 },\n  { name: 'smirk',\
  \ skill: 7 },\n  { name: 'tired', skill: 6 },\n  { name: 'ANS', skill: 9 }\n];\n\
  \nvar playerAges = {\n  superb: 21,\n  smirk: 21,\n  tired: 22,\n  ANS: 21\n};\n\
  ```\n\n这是预期的输出。\n\n```javascript\n[\n  { name: 'superb', skill: 3, age: 21 },\n\
  \  { name: 'smirk', skill: 7, age: 21 },\n  { name: 'tired', skill: 6, age: 22 },\n\
  \  { name: 'ANS', skill: 9, age: 21 }\n];\n```\n\n与上一个问题一样，显然需要迭代。\n\n```javascript\n\
  function playerWithAges(players, ages) {\n  var playerData = [];\n  for (var i =\
  \ 0; i < players.length; i++) {\n    var player = players[i];\n  }\n  return playerData;\n\
  }\n```\n\n但这一次，返回值不是字符串数组。它是一个对象数组。\n\n在每次迭代中，创建一个包含数据的新对象，并将其推入数组中。\n\n将所有内容整合在一起，文件和输出应该如下。\n\
  \n```javascript\nvar players = [\n  { name: 'superb', skill: 3 },\n  { name: 'smirk',\
  \ skill: 7 },\n  { name: 'tired', skill: 6 },\n  { name: 'ANS', skill: 9 }\n];\n\
  \nvar playerAges = {\n  superb: 21,\n  smirk: 21,\n  tired: 22,\n  ANS: 21\n};\n\
  \nfunction playerWithAges(players, ages) {\n  var playerData = [];\n  for (var i\
  \ = 0; i < players.length; i++) {\n    var player = players[i];\n    var playerEntry\
  \ = {\n      name: player.name,\n      skill: player.skill,\n      age: ages[player.name]\n\
  \    };\n    playerData.push(playerEntry);\n  }\n  return playerData;\n}\n\nconsole.log(playerWithAges(players,\
  \ playerAges));\n```\n\n非常棒！如果这个问题的任何部分让你感到困惑，请写一个表格。\n\n## 破解代码 (Crack the Code)\n\
