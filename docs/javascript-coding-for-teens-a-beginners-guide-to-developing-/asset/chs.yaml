  ![Image 80](img/index-148_1.jpg)\n\n## 游戏 CSS\n\nCSS 操作是隐藏和显示常用策略。这里是一些你可能会用到的常用方法。如果你在获取\
  \ HTML 元素并更改其类时感到困惑，请返回查看此章节！\n\n### 类：\n\n1. `hidden`: 隐藏秘密字符\n2. `intact`: 隐藏身体部位\n\
  3. `no-display`: 隐藏游戏结束界面\n4. `character`: 已猜中字符的样式\n5. `secret-character`: 秘密字符的样式\n\
  \n## 游戏伪代码\n\n由于游戏代码的复杂性，我们准备了这些伪代码以帮助我们在解决每个单独挑战时保持思路。\n\n```javascript\nfunction\
  \ initialize() {\n  // 初始化吊索游戏对象\n  // 在 HTML 中插入秘密单词\n  document.addEventListener('keydown',\
  \ function (event) {\n    // 从事件参数中获取按下的键\n    if (如果按键不是字母) {\n      // 停止后续操作\n\
  \    }\n    if (如果按键已经被猜过) {\n      // 更新游戏消息并告诉玩家\n      // 停止后续操作\n    }\n   \
  \ // 跟踪已猜的字符\n    // 将字符作为 HTML 插入\n    if (如果字符在单词中) {\n      // 更新游戏消息并显示单词\n\
  \    } else {\n      // 更新剩余猜测次数\n      // 隐藏身体部位\n    }\n    if (如果剩余猜测用尽) {\n\
  \      // 更新游戏消息并告诉玩家游戏结束\n    }\n  });\n}\n```\n\n## JavaScript 实现\n\n现在开始编写 JavaScript\
  \ 来实现这些功能。我们将深入探讨吊索游戏的各个逻辑。\n\n玩家会按键，游戏需要对此做出反应。\n\n### 辅助函数\n\n在开始之前，编写一些函数会让你的工作更轻松。\n\
  \n#### includes\n\n此函数检查字符是否存在于字符串。\n\n```javascript\nfunction includes(char, string)\
  \ {\n  for (var i = 0; i < string.length; i++) {\n    var currentStr = string[i];\n\
  \    if (char === currentStr) {\n      return true;\n    }\n  }\n  return false;\n\
  }\n```\n\n#### createDivText\n\n此函数使用 JavaScript 创建 div 并插入文本。\n\n```javascript\n\
  function createDivText(text) {\n  var div = document.createElement('div');\n  div.innerHTML\
  \ = text;\n  return div;\n}\n```\n\n#### getRandomEntry\n\n此函数接受一个数组并返回其中的一个随机元素。\n\
  \n```javascript\nfunction getRandomEntry(array) {\n  var randomIdx = Math.floor(Math.random()\
  \ * array.length);\n  return array[randomIdx];\n}\n```\n\n#### 初始化游戏对象\n\n需要一个构造函数来设置实例变量。\n\
  \n```javascript\nfunction Hangman(secretWord) {\n  this.secretWord = secretWord;\n\
  \  this.charactersGuessed = '';\n  this.remainingGuesses = 6;\n}\n```\n\n#### 插入秘密单词\n\
  \n要在页面上添加秘密单词，将使用 JavaScript。\n\n```javascript\nHangman.prototype.initializeSecretWord\
  \ = function () {\n  var container = document.getElementById('secret-word');\n \
  \ for (var i = 0; i < this.secretWord.length; i++) {\n    var secretChar = this.secretWord[i];\n\
  \    var div = createDivText(secretChar);\n    div.classList.add('secret-character',\
  \ 'hidden');\n    container.append(div);\n  }\n};\n```\n\n#### Keydown 事件监听器\n\n\
  玩家会按键，游戏需要对此做出反应。需要一个 `keydown` 事件监听器。\n\n```javascript\ndocument.addEventListener('keydown',\
  \ function (event) {\n  var guessedKey = event.key.toLowerCase();\n  // 逻辑在这里\n\
  });\n```\n\n#### 检查按键是否不是字母\n\n如果玩家输入非字母键，监听器不应有任何行为。\n\n```javascript\nHangman.prototype.isInvalidGuess\
  \ = function (guessedKey) {\n  var isAlphabetic = includes(guessedKey, 'abcdefghijklmnopqrstuvwxyz');\n\
  \  return !isAlphabetic;\n};\n```\n\n#### 检查按键已经被猜过\n\n玩家不应该重复猜测受到惩罚。\n\n```javascript\n\
  Hangman.prototype.alreadyGuessed = function (guessedKey) {\n  return includes(guessedKey,\
  \ this.charactersGuessed);\n};\n```\n\n#### 打印字符被猜测的消息\n\n在 HTML 文件中，有一个 ID 为 `game-message`\
  \ 的 div。这是反馈消息将打印在页面上的地方。\n\n\n\n\n\n```javascript\nHangman.prototype.updateGameMessage\
  \ = function (msg) {\n  var messageContainer = document.getElementById('game-message');\n\
  \  messageContainer.innerHTML = msg;\n};\n```\n\n该方法的第一个用途是通知玩家某个之前按过的按键被再次按下。\n\
  \n### 跟踪已猜测的字符\n\n当用户输入一个有效的猜测猜测按键时，需要更新实例变量 `this.charactersGuessed`。\n\n```javascript\n\
  Hangman.prototype.addToCharactersGuessed = function (char) {\n  this.charactersGuessed\
  \ += char;\n};\n```\n\n### 在 HTML 中插入已猜测的按键\n\n使用 JavaScript 可以将猜测的按键插入页面。存放这些已猜测字符的\
  \ div id 为 `guessed-characters`。\n\n```javascript\nHangman.prototype.appendGuessedCharacter\
  \ = function (key) {\n  var guessedCharDiv = createDivWithText(key);\n  guessedCharDiv.classList.add('character');\n\
  \  var container = document.getElementById('guessed-characters');\n  container.append(guessedCharDiv);\n\
  };\n```\n\n### 检查猜测的按键是否在秘密单词中\n\n`includes` 函数让这个操作变得简单。检查猜测的按键在 `this.secretWord`\
  \ 中是否具有匹配的字符。\n\n```javascript\nHangman.prototype.correctGuess = function (guessedKey)\
  \ {\n  return includes(guessedKey, this.secretWord);\n};\n```\n\n这个条件判断允许你在正确猜测和错误猜测之间做出分支决策。可以根据玩家是否正确猜测打印一条消息。\n\
  \n### 揭示正确的猜测按键\n\n如果玩家猜了一个正确的按键，太棒了！从该特定字符中移除 `hidden` 类。每个秘密字符都必须检查检查是否匹配。\n\n\
  ```javascript\nHangman.prototype.updateSecretCharacter = function (char) {\n  var\
  \ allSecretChars = document.getElementsByClassName('secret-character');\n  for (var\
  \ i = 0; i < allSecretChars.length; i++) {\n    var secretChar = allSecretChars[i];\n\
  \    if (char.toLowerCase() === secretChar.innerHTML.toLowerCase()) {\n      secretChar.classList.remove('hidden');\n\
  \    }\n  }\n};\n```\n\n### 给人物添加一个身体部位\n\n如果玩家猜测错误，他们必须为自己的愚蠢受到惩罚。通过给人物添加一个身体部位来视觉化地表现这一点。实例变量\
  \ `this.remainingBadGuesses` 也需要递减。\n\n`this.remainingBadGuesses` 中的每个数字将对应一个特定的身体部位。\n\
  \n条件链在这里是完美的！揭示身体部位的过程始终是移除 `intact` 类。每次变化的唯一是 HTML 元素的 id。可以写一个供所有身体部位复用的辅助函数。这是一种更简单、更干净的方法。\n\
  \n```javascript\nHangman.prototype.revealBodyPart = function () {\n  this.remainingBadGuesses\
  \ -= 1;\n  function reveal(id) {\n    var container = document.getElementById(id);\n\
  \    container.classList.remove('intact');\n  }\n  if (this.remainingBadGuesses\
  \ === 5) {\n    reveal('head');\n  } else if (this.remainingBadGuesses === 4) {\n\
  \    reveal('body');\n  } else if (this.remainingBadGuesses === 3) {\n    reveal('arm-left');\n\
  \  } else if (this.remainingBadGuesses === 2) {\n    reveal('arm-right');\n  } else\
  \ if (this.remainingBadGuesses === 1) {\n    reveal('leg-right');\n  }\n};\n```\n\
  \n游戏开始成形了！\n\n### 检查玩家是否胜利或输了\n\n在一个循环完成后，检查游戏是否应该结束。无论输赢，游戏都应该停止，并弹出一个消息。\n\n如果\
  \ `this.secretWord` 中的每一个字符都存在于 `this.charactersGuessed` 中则玩家赢了。\n\n```javascript\n\
  Hangman.prototype.playerWon = function () {\n  for (var i = 0; i < this.secretWord.length;\
  \ i++) {\n    var secretChar = this.secretWord[i];\n    if (!includes(secretChar,\
  \ this.charactersGuessed)) {\n      return false;\n    }\n  }\n  return true;\n\
  };\n```\n\n如果玩家没有更多的错误猜测，则他们输了。\n\n```javascript\nHangman.prototype.playerLost =\
