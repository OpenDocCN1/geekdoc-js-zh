  \n这段代码有很多问题！`playerAboveSkillAndAge` 函数应该返回高于指定技能和年龄的玩家。\n\n```javascript\nvar players\
  \ = [\n  { name: 'super', skill: 1, age: 20 },\n  { name: 'smurf', skill: 8, age:\
  \ 24 },\n  { name: 'ANS', skill: 6, age: 27 },\n  { name: 'faker', skill: 10, age:\
  \ 17 },\n  { name: 'shroud', skill: 9, age: 26 }\n];\n\nfunction playersAboveSkill(players,\
  \ skill) {\n  var skilledPlayers = players;\n  for (var i = 0; i < players.length;\
  \ i++) {\n    var objectKey = 'skill';\n    if (players[i][objectKey] < skill) {\n\
  \      skilledPlayers.push(players[i]);\n    }\n  }\n  return skilledPlayers;\n\
  }\n\nfunction playersAboveAge(players, age) {\n  var agedPlayers = players;\n  for\
  \ (var i = 1; i < players.length; i++) {\n    var objectKey = 'age';\n    if (players[i][objectKey]\
  \ < age) {\n      agedPlayers.push(players[i]);\n    }\n  }\n  return agedPlayers;\n\
  }\n\nfunction playerAboveSkillAndAge(players, skill, age) {\n  var skilledPlayers\
  \ = playersAboveSkill(players, skill);\n  var skilledAgedPlayers = playersAboveAge(skilledPlayers,\
  \ age); \n  return skilledAgedPlayers;\n}\n\nconsole.log(playerAboveSkillAndAge(players,\
  \ 6, 19));\n// 预期：[\n  { name: 'smurf', skill: 8, age: 24 },\n  { name: 'shroud',\
  \ skill: 9, age: 26 }\n];\n\nconsole.log(playerAboveSkillAndAge(players, 2, 16));\n\
  // 预期：[\n  { name: 'smurf', skill: 8, age: 24 },\n  { name: 'ANS', skill: 6, age:\
  \ 27 },\n  { name: 'faker', skill: 10, age: 17 },\n  { name: 'shroud', skill: 9,\
  \ age: 26 }\n];\n```\n\n## 程序员检查清单 (CODER’S CHECKLIST)\n\n你走过了很长的路！你现在正式完成了编程基础的学习。未来，你将学习更多特定于\
  \ JavaScript 的特性。这意味着面向对象编程和网站编程。\n\n\n\n\n\n# 将狗作为 JavaScript 对象\n\n刚才介绍的理念在编程中具有相同的相似之处。一个狗对象将有很多关于它自身的属性，并有许多它可以调用的方法。\n\
  \n### 对象属性 (OBJECT PROPERTY)\n\n在 JavaScript 中，访问狗的年龄看起来如下。\n\n```javascript\nsparky.age;\
  \ // 10\n```\n\n## 对象方法 (OBJECT METHOD)\n\n如果 Sparky 想汪汪，就会调用一个名为 `bark` 的方法。\n\n\
  ```javascript\nsparky.bark(); // 'ruff ruff!'\n```\n\n注意 `bark` 看起来像函数调用？那是因为方法实际上就是函数！方法是特定于对象实例的函数。它们不能用于其他任何东西。\n\
  \n## JavaScript 对象实现\n\n为了利用对象的威力，我们必须学习完整的 JavaScript 语法来编写它们。\n\n### 构造函数 (CONSTRUCTOR\
  \ FUNCTION)\n\n在 JavaScript 中，函数是双重用途的。它们可以被当作普通函数来执行代码（你已经学过了），也可以被当作构造函数。构造函数是用来调用创建对象实例的函数。\n\
  \n在这里，大驼命名法（pascal case，每个单词的首字母大写）是通用的约定。\n\n```javascript\nfunction Dog() {\n\n\
  }\n```\n\n对于对象实例，在函数调用前面需要 `new` 关键字。\n\n```javascript\nvar sparky = new Dog();\n\
  ```\n\n### 对象属性 (OBJECT PROPERTY)\n\n添加对象属性本质上与添加键值对相同。不同在于它是在构造函数中完成的。\n\n```javascript\n\
  function Dog() {\n  this.age = 10;\n}\n\nvar sparky = new Dog();\n\nsparky.age;\
  \ // 10\n```\n\n等等！这个变量 `this` 是什么？嗯，它是由函数自动创建的秘密变量。在涉及面向对象编程时，它具有一些重要的属性。最重要的是，`this`\
  \ 可以被分配键值对。\n\n### 对象方法 (OBJECT METHODS)\n\n在 JavaScript 中，函数还有一个名为 `prototype`\
  \ 的秘密属性。它的职责是存储函数将供对象实例可用的方法。创建方法需要使用函数表达式语法。\n\n```javascript\nfunction Dog() {\n\
  \n}\n\nDog.prototype.bark = function() {\n  console.log('ruff ruff!');\n};\n\nvar\
  \ sparky = new Dog();\n\nsparky.bark(); // 'ruff ruff!'\n```\n\n### 实例变量 (INSTANCE\
  \ VARIABLE)\n\n现在你已经了解基础语法，我们应该谈谈秘密变量 `this`。它在构造函数中是可用的。键值对添加到 `this`。添加到 `this`\
  \ 中的键值对通常被称为实例变量。\n\n```javascript\nfunction Dog() {\n  this.name = 'sparky';\n\
  }\n\nDog.prototype.speak = function() {\n  console.log('ruff ruff, my name is' +\
  \ this.name);\n};\n\nvar sparky = new Dog();\n\nsparky.speak(); // 'ruff ruff, my\
  \ name is sparky'\n```\n\n现在，忽略这只狗会说英语的事实。你感兴趣的是在构造函数中创建的 `this.name` 竟然神奇地在方法中可用。\n\
  \n记住这一点至关重要：任何分配给 `Dog.prototype` 的方法都可以使用变量 `this`。\n\n### 实例变量的修改 (INSTANCE VARIABLE\
  \ MODIFICATION)\n\n由于这在每个方法中都是可用的，实例变量也可以在方法中被。\n\n```javascript\nfunction Dog()\
  \ {\n  this.name = 'sparky';\n  this.age = 0;\n}\n\nDog.prototype.growOlder = function()\
  \ {\n  this.age += 1;\n};\n\nvar sparky = new Dog();\n\nsparky.age // 0\n\nsparky.growOlder();\n\
  \nsparky.age // 1\n```\n\n### 极客提示 (HACKER HINT)\n\n实例变量也可以在方法中创建，但并不鼓励这样做。在大多数情况下，代码有更好的写法编写方式。\n\
  \n## 实战中的面向对象编程 (Object-Oriented Programming in Action)\n\n眼见为实，所以通过一个 JavaScript\
  \ 狗来建立对面向对象编程的理解，它的能力将与现实中的狗匹配。\n\n### 狗的属性 (DOG PROPERTIES)\n\n为了创建一个对象实例，需要构造函数。\n\
  \n```javascript\nfunction Dog() {\n\n}\n\nvar sparky = new Dog();\n```\n\n这非常无聊，并没有告诉你太多关于狗的知识。狗有很多方面是你可能想让你的对象了解的。可以通过将它们变为实例变量来实现。狗的名字、年龄、重量和\
  \ `legCount` 可以被存储。典型的狗有 4 条腿。但名字、年龄和重量在狗之间各不同。将它们作为参数添加到我们的构造函数中。\n\n```javascript\n\
  function Dog(name, age, weight) {\n}\n```\n\n为了跟踪每个 `Dog` 实例的数据，将这些值作为键值对添加到 `this`。\n\
  \n```javascript\nfunction Dog(name, age, weight) {\n  this.name = name;\n  this.age\
  \ = age;\n  this.weight = weight;\n  this.legCount = 4;\n}\n\nvar sparky = new Dog('sparky',\
  \ 4, 20);\nvar misu = new Dog('misu', 10, 15);\n\nsparky.name; // 'sparky'\n\nsparky.weight;\
  \ // '20'\n\nmisu.name; // 'misu'\n\nmisu.weight; // 15\n```\n\n太棒了！现在你理解了如何使用构造函数创建对象实例，你有了两只独立的狗，它们有各自的名字、年龄和重量。\n\
  \n### 狗的方法 (DOG METHODS)\n\n目前，这些狗不知道如何做什么。为了改变这一点，添加几个方法。\n\n首先，狗应该能够吃食物。添加一个 `eat`\
  \ 方法。\n\n```javascript\nDog.prototype.eat = function() {\n  console.log('nom nom\
  \ nom');\n};\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.eat(); // 'nom\
  \ nom nom'\n```\n\n当狗吃得太多时，体重会增加。可以写一个方法来表示。就像任何函数一样，方法可以接受参数。\n\n然后，添加一个代表因过食增加重量的参数。\n\
  \n```javascript\nDog.prototype.eatTooMuch = function(weightGain) {\n  console.log('ugh...\
  \ ' + this.name + ' doesn\\'t feel so good');\n  this.weight += weightGain;\n};\n\
  \nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.weight; // 20\n\nsparky.eatTooMuch(2);\
  \ // 'ugh . . . sparky doesn't feel so good'\n\nsparky.weight; // 22\n```\n\n记住这一点至关重要：`this`\
  \ 在所有分配给构造函数的方法中都是可用的。`eatTooMuch` 方法可以修改狗的体重。\n\n记住这一点至关重要：`this` 在所有分配给构造函数的方法中都是可用的。`eatTooMuch`\
  \ 方法可以修改狗的体重。\n\n```javascript\nDog.prototype.ageInYears = function(weightGain)\
  \ {\n  return this.age * 7;\n};\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.ageInYears();\
  \ // 28\n```\n\n方法可以在其他方法内部调用。为了表达犬类的顽皮本，还可以显示额外的 `console.log` 消息。\n\n```javascript\n\
  Dog.prototype.eat = function() {\n  console.log('nom nom nom');\n};\n\nDog.prototype.stealCatFood\
  \ = function() {\n  this.eat();\n  console.log('Yuck, cat food is gross!');\n};\n\
  \nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.stealCatFood();\n// 'nom nom\
  \ nom'\n// 'Yuck, cat food is gross!'\n```\n\n在另一个方法内部调用方法时，永远不要引用 `prototype`。它是\
  \ `this.eat`。而不是 `this.prototype.eat`。\n\n### 极客提示 (HACKER HINT)\n\n创建方法是拆分复杂方法的直接方法。鼓励创建新的、更小的方法，即使该方法本身没有在其他地方或被任何对象实例使用。\n\
  \n\n\n\n\n### 4. 在方法内部调用另一个方法的语法是什么？\n### 5. 创建构造函数的语法是什么？\n### 6. 什么是对象实例？\n###\
  \ 7. 初始化对象实例的语法是什么？\n\n## 调试\n\n一个基础的聊天程序在运行时出现了问题。`printLog` 方法应该打印聊天记录。这个任务有点棘手，因为有两个对象正在相互交互。你正在以高级的方式使用数据结构，所以不要害怕使用\
  \ `console.log` 来检查变量的值。\n\n```javascript\nfunction Person(name) {\n  this.name\
  \ = name;\n}\n\nfunction ChatProgram() {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message\
  \ = function (person, message) {\n  var messageEntry = {\n    person: person,\n\
  \    message: message\n  };\n  this.chatLog(messageEntry);\n};\n\nChatProgram.prototype.parseMessageEntry\
  \ = function (chatEntry) {\n  return chatEntry.person.name + ': ' + chatEntry.chat;\n\
  };\n\nChatProgram.prototype.getLog = function () {\n  var allMessages = [];\n  for\
  \ (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry = this.chatLog[i];\n\
  \    var parsedMessage =\n      this.prototype.parseMessageEntry(chatEntry);\n \
  \   allMessages.pop(parsedMessage);\n  }\n  ![Image 45](img/index-105_1.jpg)\n \
  \ return allMessages;\n};\n\nChatProgram.prototype.printLog = function () {\n  var\
  \ allMessages = this.getLog;\n  for (var i = 0; i < allMessages.length; i++) {\n\
  \    console.log(allMessages[i]);\n  }\n};\n\nvar layna = new Person('Layna');\n\
  var andrew = new Person('Andrew');\nvar chat = new ChatProgram();\nchat.message(andrew,\
  \ 'Hi Layna, how's it going?');\nchat.message(layna, 'I'm doing great');\nchat.message(layna,\
  \ 'What about you?');\nchat.message(andrew, 'I just came back from the doctor');\
  \ chat.message(layna, 'Wow, this conversation is really boring'); chat.message(andrew,\
  \ 'That was really mean, why would you say something like that?');\nchat.message(layna,\
  \ 'I have better things to do');\nchat.message(andrew, ':(');\nchat.message(layna,\
  \ 'Goodbye');\nchat.printLog();\n```\n\n这是预期的输出。\n\n## 编码检查清单\n\n编码检查清单 » 让我们回顾一下涵盖过的的话题。面向对象编程并不是\
  \ JavaScript 特有的，但它是第一个一个在所有编程语言中并不通用的主题（实现方式不同）。面向对象编程是解决编程挑战的众多策略之一。随着你在编程工具箱中积累了更多技术，你将发现解决问题有多种方法。发现最佳解决办法需要经验和直觉。如果你有一个不确定的主意，尽管去尝试一试吧！编程的核心就在于从过去的错误中学习。以下是本章中所学内容的快速回顾。\n\
  \n- 什么是对象\n- 什么是对象实例\n- 如何创建实例变量\n- 如何创建方法\n\n![Image 46](img/index-107_1.jpg)\n\
  \n# 第 9 章：JavaScript 与 Web\n\n（虽然无聊的）HTML 能做的一切，都可以使用 JavaScript 来——而且如此！为了证明这一点，在本章中，你将从网页上的\
  \ HTML 开始，展示如何用 JavaScript 实现相同的功能，然后进一步超越 HTML 的能力。这是你第一次体验现代 JavaScript 的魅力以及它大放异彩的地方。我你像我一样兴奋！\n\
  \n### Web 的抽象级别\n\n与你的标准终端相比，网站处于完全不同的抽象层级。如果说 `console.log` 的抽象级别像比骑自行车，那么 JavaScript\
  \ 及其 Web 开发功能就像是开车。\n\n对于本章，你不需要担心这些工具是如何工作的。你只需要关注利用这些工具在浏览器中执行有意义的任务的能力。\n\n###\
  \ HTML：超文本标记语言\n\n你将非常依赖 JavaScript，但仍然需要少量的超文本标记语言，即 `HTML` 来与网页进行交互。现代网站使用了大量的\
  \ JavaScript 来操作它。\n\n### HTML 文件\n\n就像 JavaScript 有自己的文件扩展名 `.js` 一样，`HTML` 也有自己的文件扩展名\
  \ `.html`。创建一个 HTML 文件。这是某个东西被视为网页的最低要求。我将我的命名为 `index.html`，这是第一个 HTML 文件的标准名称。\n\
  \n![Image 47](img/index-109_1.jpg)\n\n#### HTML 标签\n\n注意单词周围的角括号了吗？那是 `HTML` 语法。\n\
  \n```<valid-html-tag-name-here>```\n\n一个被角括号包围，另一个有一个角括号和一个斜杠。\n\n只有角括号的标签被称为起始标签，而另一个带有斜杠的被称为结束标签。一个起始标签必须有一个对应的结束标签。\n\
  \n```html\n<html>\n</html>\n```\n\n在起始标签和结束标签之间可以放置任何数量的内容。`HTML` 变得可以变得得极其复杂！\n\
  \n#### 我们将使用的 HTML 标签\n\n由于本书的重点是 JavaScript，所以只会涵盖少数几个 `HTML` 标签。\n\n```html\n\
  <html>\n<head>\n</head>\n<body>\n<div>\nHello!\n</div>\n</body>\n</html>\n```\n\n\
  `html` 标签是主标签，它包裹了文件中的所有 `HTML` 内容。`head` 标签是多用途的。它通常是插入非视觉 `HTML` 的地方。`body` 标签是放置视觉元素的地方。`div`\
  \ 是一个没有重要作用角色的标签。它仅被用于封装其内部的元素。\n\n#### HTML 属性：CLASS 和 ID\n\n有很多不同的 `HTML` 属性。应用它们的语法是属性名、等号和值（双引号）。作为一种概念，它与对象数据结构中的键值对非常相似。\n\
  \n```html\n<div class=\"container\">\nI am content in a div\n```\n\n`class` 和 `id`\
  \ 属性在 `HTML` 中非常重要。在与 JavaScript 协作时，常用的策略是通过它们的类或 `id` 查找 HTML 元素。\n\n## Web 浏览器\n\
  \n在开始之前，确保已安装 Web 浏览器 Google Chrome。并不是所有浏览器都构造相同，Google Chrome 非常擅长运行 JavaScript。\n\
  \n搜索引擎查询：“google download”\n\n当前 URL：[`google.com/chrome`](http://google.com/chrome)\n\
  \n### 浏览器开发者工具\n\n安装后，打开 Google Chrome。导航到设置（右上三个点） -> 更多工具 -> 开发者工具。开发者控制台将会。作为\
  \ JavaScript 程序员，这是魔法发生的地方。JavaScript 可以写在这里。\n\n![Image 48](img/index-111_1.jpg)\n\
  \n记得那个基础的 `index.html` 吗？在你的操作系统（PC 或 Mac）文件系统中找到它。最简单的方法是在 VS Code 中右键点击文件并选择“在文件管理器中显示”。对于\
  \ Mac，是“在访达中显示”。代码将打开文件所在的目录。\n\n![Image 49](img/index-112_1.jpg)\n\n![Image 50](img/index-112_2.jpg)\n\
  \n如果文件已经有了 Google Chrome 图标，双击文件打开。文件也可以拖放到浏览器窗口。\n\n注意位置不是互联网 URL？那是指向 HTML 文件的目录路径。在确认文件运行后，修改\
  \ HTML。\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div>\nHello!\n![Image 51](img/index-113_1.jpg)\n\
  ![Image 52](img/index-113_2.jpg)\n</div>\n<div class=\"container\">\nI am EXTREMELY\
  \ cool\n</div>\n</body>\n</html>\n```\n\n修改后，页面没有变化。为什么浏览器不承认我们非常酷这一实？那是因为浏览器加载了文件的旧版本。为了看到更新，请刷新页面。\n\
  \n刷新后，我们看到了更新。非常棒！\n\n\n\n\n在浏览器中，有一个自动创建的变量名为 `document`。将其输入开发者控制台。该变量是一个 JavaScript\
  \ 对象，引用整个页面。展开后，所有的 HTML 都会显示出来。使用你的鼠标光标悬停在 `document` 变量上。注意网页是如何变成蓝色的？\n\n![Image\
  \ 53](img/index-114_1.jpg)\n\n![Image 54](img/index-114_2.jpg)\n\n开发者控制台会高亮光标悬停过的\
  \ HTML。为了进一步证明这一点，展开 `body` 并悬停在一个被高亮的 `div` 元素上。\n\n## HTML 选择器 (#index_split_000.html_p7)\n\
  \nJavaScript 有许多与浏览器相关的函数可以使用。`document` 是一个对象，意味着它拥有方法。可用的方法可以修改 HTML。整个 Web 开发社区严重依赖于这几个方法和函数。\n\
  \n### DOCUMENT.GETELEMENTSBYCLASSNAME\n\n`document` 对象上一个被广泛使用的方法是 `document.getElementsByClassName`。如果我们让\
  \ `div` HTML 元素带有 `class` 属性，`document.getElementsByClassName` 就能施展它的魔法！\n\n```html\n\
  <html>\n<head>\n</head>\n<body\n![Image 55](img/index-115_1.jpg)\n<div class=\"\
  cool-message\">\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n\
  </div>\n</body>\n</html\n```\n\n`document.getElementsByClassName` 接受一个参数。它是类的字符串名称。类\
  \ `cool-message` 被添加到了 `div` 元素中。该属性将用于识别 HTML 元素。在开发者控制中使用以下代码。运行代码后，输入变量名以在控制台中显示其值。\n\
  \n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
  ```\n\n运行代码后，再次在控制台中输入变量名 `divElements` 以显示其值。\n\n太棒了！看起来该语句返回了包含我们两个 HTML 元素的数组！严格来说，它是一个被称为\
  \ `HTMLCollection` 的数据结构。以后，`HTMLCollections` 将被称为类数组数据结构。但别担心，因为数组和类数组数据结构之间的区别对你没有影响。\n\
  \n循环可以在 `HTMLCollections` 上运行。\n\n### DOCUMENT.GETELEMENTBYID\n\n与 `document.getElementsByClassName`\
  \ 通过 `class` 属性获取 HTML 元素一样，`document.getElementById` 通过 `id` 属性选择元素。为了让元素被 `document.getElementById`\
  \ 选中，请修改 HTML。添加一个带有 `id` 属性的 `div` 元素。\n\n```html\n<html>\n<head>\n</head>\n<body\n\
  ![Image 56](img/index-116_1.jpg)\n<div class=\"cool-message\">\nHello!\n</div>\n\
  <div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div id=\"occupation\"\
  >\nThat is because I am a programmer\n</div>\n</body>\n</html\n```\n\n刷新页面。在开发者控制台中输入以下代码。再次在控制台中输入变量后，返回值应该指向第三行文本。\n\
  \n```javascript\nvar divElement = document.getElementById('occupation');\n```\n\n\
  注意 `document.getElementById` 返回的是一个单个元素。它没有返回像 `document.getElementsByClassName`\
  \ 那样的类数组数据结构。这是因为 `document.getElementById` 每次只能选择一个元素。\n\n## HTML 操作 (#index_split_000.html_p7)\n\
  \nHTML 元素内部有许多方法和属性，就像 `document` 对象一样。这些方法和属性赋予我们修改特定 HTML 元素的能力。\n\n### 使用 INNERHTML\
  \ 获取文本\n\n在页面上编写文本将其封装在 HTML 中时，`div` 是最简单的标签。当 JavaScript 使用选择器指向 HTML 时，它被表示为一个\
  \ JavaScript 对象。该对象有一个名为 `innerHTML` 的键。它保存 HTML 元素内部的文本。回到你的示例 HTML 可以看到这一点。\n\n\
  使用 `document.getElementById` 获取 `id` 为 `occupation` 的 `div` 内部的文本\n\n![Image 57](img/index-117_1.jpg)\n\
  \n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"cool-message\">\nHello!\n\
  </div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div id=\"occupation\"\
  >\nThat is because I am a programmer\n</div>\n</body>\n</html\n```\n\n```javascript\n\
  var divElement = document.getElementById('occupation');\ndivElement.innerHTML;\n\
  ```\n\n### 使用 INNERHTML 注入新文本\n\n`innerHTML` 是对象上的一个属性。就像对象上的任何键值对一样，它可以被重新赋值。这允许修改内部的文本。\n\
  \n```javascript\nvar divElement = document.getElementById('occupation');\ndivElement.innerHTML\
  \ += ' and love building things';\n```\n\n![Image 58](img/index-118_1.jpg)\n\n使用自加运算符，额外的文本被追加到了\
  \ `div` 元素的 `innerHTML` 中。恭喜！你已经迈入了 Web 开发世界的第一步。\n\n### 更新属性 ID\n\n就像 `innerHTML`\
  \ 可以更新一样，`class` 和 `id` 属性也可以更改。更新 HTML 元素的 `id` 很容易的。关键是 `id`。\n\n```javascript\n\
  var divElement = document.getElementById('occupation');\ndivElement.id = 'new-id';\n\
  ```\n\n### 更新属性 CLASS\n\n更新 `class` 比 `id` 更复杂。这是因为通常会分配多个类。回到 HTML 文件。现在，`div`\
  \ 元素只有一个 `class`。\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"cool-message\"\
  >\nHello!\n</div>\n<div class=\"cool-message\">\nI am EXTREMELY cool\n</div>\n<div\
  \ id=\"occupation\">\nThat is because I am a programmer\n</div>\n</body>\n</html\n\
  ```\n\n向现有 HTML 元素添加类的方法是 `classList.add`。它接受一个参数，即要追加的类名。\n\n```javascript\nvar\
  \ divElements = document.getElementsByClassName('cool-message');\n```\n\n![Image\
  \ 59](img/index-119_1.jpg)\n\n![Image 60](img/index-119_1.jpg)\n\n```javascript\n\
  divElements[0].classList.add('new-class');\n```\n\n移除类的方法是 `classList.remove`，它接受一个要移除的类的参数。\n\
  \n```javascript\nvar divElements = document.getElementsByClassName('cool-message');\n\
  divElements[0].classList.remove('new-class');\n```\n\n### 修改类的目的\n\n到目前为止，你一直在学习如何更改\
  \ HTML 元素的类。当你处理 CSS 时，这变得非常重要。本书将不会涵盖 CSS，但只要更新属性是触发视觉变化的常用方法。\n\n## 创建 HTML 元素\
  \ (#index_split_000.html_p7)\n\n![Image 61](img/index-120_1.jpg)\n\n![Image 62](img/index-120_2.jpg)\n\
  \n`document` 对象也有创建 HTML 元素的方法。当你制作游戏时，这将变得特别重要！\n\n### DOCUMENT.CREATEELEMENT\n\
  \n使用 `document.createElement`，JavaScript 可以创建 HTML。它接受一个参数，即 HTML 标签的字符串名称。因为我们没有学习太多\
  \ HTML，我们将使用 `document.createElement` 创建 `div` 元素。\n\n```javascript\nvar div = document.createElement('div');\n\
  div.innerHTML = 'I am a new div!';\n```\n\n已经通过 `innerHTML` 创建了：“I am a new div!”\
  \ 但在哪里？你创建了它，但还没有把它放在任何地方！\n\n### 将 HTML 添加到页面\n\n用 JavaScript 创建的 HTML 元素需要手动添加到页面。这就是使用\
  \ `append` 方法的地方。它存在于使用任何 HTML 选择器获取的 HTML 对象上，例如 `document.getElementsByClassName`\
  \ 和 `document.getElementById`。\n\n```javascript\nvar div = document.createElement('div');\n\
  div.innerHTML = 'I am a new div!';\nvar divElements = document.getElementsByClassName('cool-message');\n\
  divElements.append(div);\n```\n\n哎呀！为什么这不起作用？那是因为 `document.getElementsByClassName`\
  \ 返回一个类数组数据结构。\n\n![Image 63](img/index-121_1.jpg)\n\n![Image 64](img/index-121_2.jpg)\n\
  \n可以通过索引访问类数组数据结构中的元素。\n\n```javascript\nvar div = document.createElement('div');\n\
  div.innerHTML = 'I am a new div!';\nvar divElements = document.getElementsByClassName('cool-message');\n\
  divElements[1].append(div);\n```\n\n你刚刚用纯 JavaScript 制作了 HTML！我觉得这很酷。\n\n### 从页面移除\
  \ HTML\n\n\n\n\nJavaScript 也可以用于移除 HTML 元素。修改 HTML 文件，添加一个新的 `div` 元素，该元素具有一个 `id`\
  \ 属性和一些 `innerHTML`。\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div class=\"\
  cool-message\">\nHello!\n</</div>\n<div class=\"cool-message\">\nI am EXTREMELY\
  \ cool\n</div>\n<div id=\"occupation\">\nThat is because I am a programmer\n</div>\n\
  <div id=\"untrue-message\">\n![Image 65](img/index-122_1.jpg)\n![Image 66](img/index-122_2.jpg)\n\
  Just kidding, programmers are losers\n</div>\n</body>\n</html>\n```\n\n程序员（Programmers）是失败者？看到这个虚假的陈述让我热血沸腾。我要求从页面移除该\
  \ `div`。包含该语句的 `div` 有一个 `id`。这意味着可以使用 `document.getElementById` 来指向该 HTML 元素。\n\
