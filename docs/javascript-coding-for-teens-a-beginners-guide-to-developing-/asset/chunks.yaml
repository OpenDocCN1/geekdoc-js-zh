    语法高亮和 VS Code 错误建议通常可以防止你不小心将关键字用作变量。但有时错误并不是显而易见的。唯一可以确定的是你的代码中某些地方是错误的。


    # 变量命名规范


    程序员喜欢保持变量结构的一致。这通常被称为约定（convention）。JavaScript 的变量命名约定是 `camelCase`（驼峰式）：第一个单词小写，后续所有单词的首字母大写——还记得中间那个“驼峰”吗？


    ```javascript

    // 认可的 camelCase 约定

    var currentYear = 2021;

    ```


    ```javascript

    // 在运行时不会报错，但如果你不这样做会更好

    var current_year = 2021;


    // 我们不再是朋友了

    var xXx_CuRrEnTyEaR_xXx = 2021;

    ```


    之后，我们将针对特定主题使用不同的约定。现在，请始终使用 `camelCase`。


    ## 数据类型 (#index_split_000.html_p5)


    既然你已经了解了变量是如何工作的，现在是时候学习赋值给它们的数据类型了。


    ### NUMBER（数字）


    数字遵循基础算术规则。运算符顺序是：括号、指数、乘法、除法、加法，然后减法。


    ```javascript

    10 + 20; // 30

    20 * 10; // 200

    (20 + 3) * 10; // 230 - 遵循运算符顺序

    ```


    ### INCREMENT OPERATOR（递增运算符）


    在编程中，将变量的值增加或减少 1 是一种常见操作，因此有一个简写形式。使用双加（++）和双减（--）运算符分别进行递增和递减。


    ```javascript

    var num = 1;

    num++; // num 现在是 2

    num--; // num 现在回到了 1

    ```


    #### 永远不要赋值自增语句


    在自增时要小心不要赋值，因为这样做变量的值不会改变。将会发生意外的行为。


    ```javascript

    var num = 1;

    num++; // 好！

    num = num++; // 不！太了！

    ```


    ### SELF-OPERATING MATH SHORTHAND（自算数学简写）


    对变量进行数学运算然后重新赋值旧值是另一种常见操作。程序员为此准备了简写。这些运算符的统称为算术赋值（arithmetic assignment）。它将数学运算符和赋值运算符合并为了一个运算符。


    ```javascript

    var num = 1;

    num += 2; // 等于 num = num + 2

    num; // 3


    var num = 1;

    num *= 3; // 乘法和除法一样

    num; // 3

    ```


    ### NAN: NOT A NUMBER（不是数字）


    数字看起来很简单，对吧？很好，是时候聊聊数字的黑暗面了。


    有一种特殊的数字类型，并不是数字。是的，你读得正确。它是一个代表非数字内容的数字。它的名字是 `NaN`，代表“Not a Number”。


    `NaN` 是数值中的一个关键字。可以对其进行数学运算。对 `NaN` 尝试的任何数学计算结果都是 `NaN`。


    ```javascript

    NaN * 10; // NaN

    ```


    如何得到 `NaN` 呢？为了这一点，你必须做一些在数学上不符合逻辑的操作。


    ```javascript

    10 / ''dog''; // NaN

    ```


    “10 除以狗”是什么意思？JavaScript 将这种荒谬视为 `NaN`。


    ## Strings（字符串） (#index_split_000.html_p5)


    字符的集合被称为字符串。把它想象成一串“字符链”。


    创建字符串非常简单。你只需要将文本括在引号中。双引号和单引号都可以用于创建字符串。


    ```javascript

    // 都是有效的字符串

    "dog";

    ''dog'';

    ```


    ### STRING CONCATENATION（字符串拼接）


    JavaScript 在修改字符串方面有很多奇妙的技巧。但目前，你只需要知道，字符串可以使用加法运算符进行组合。组合字符串的概念被称为拼接（concatenation），简称为
    `concat`。可以使用加号运算符组合任意数量的字符串。


    ```javascript

    ''one '' + ''two''; // ''one two''

    ''one '' + ''two'' + ''three'' + ''four''; // ''one two three''

    ```


    注意除了最后一个字符串外，所有字符串末尾的空格？那是因为空格也是字符。在执行拼接时，需要它们来分隔单词。


    ### SELF-OPERATING STRING CONCATENATION SHORTHAND（自算字符串拼接简写）


    与数学运算通常计算并重新赋值给同一个变量一样，字符串也会进行拼接和重新赋值。技术上，字符串也称为加赋值（addition assignment）。加赋值运算符可以用于两者。


    ```javascript

    var numWords = ''one two''; // ''one two''

    numWords += ''three four'';

    numWords; // ''one two three four''

    ```


    ### ESCAPE CHARACTERS（转义字符）


    将文本括在引号中表示字符串。但如果你想在字符串内部使用引号怎么办？


    ```javascript

    ''hello, my dog''s name is Suzy''; // 运行时错误

    ```


    JavaScript 将此读取为在 dog 处停止的字符串。“dog’s” 中的单引号偏离了它。随后的文本被解释为无意义的代码并在运行时崩溃。为了表示“dog’s”中的单引号应该是字符串的一部分，我们需要对其进行转义。这是通过使用反斜杠运算符实现的。


    ```javascript

    ''hello, my dog\''s name is Suzy''; // 好

    ```


    ### NUMBERS AND STRINGS: THE DIFFERENCE（数字与字符串：区别）


    字符串被视为文本。从这个意义上说，我们可以有一个像数字但实际上不是数字的字符串。数字十 (10) 和由“1”和“0”组成的字符串（10）的解释方式不同。数字可以对其进行数学运算。但对文本进行数学运算的概念在现实世界中没有意义，对吧？


    ```javascript

    10; // 数字十

    ''10''; // 两个字符的文本：1 和 0

    ```


    ## Boolean（布尔值） (#index_split_000.html_p5)


    简单来说，布尔值是一种关键字 `true` 或 `false` 的数据类型。它们各自的关键字含义正如你想的那样。


    ```javascript

    // 布尔关键字

    true;

    false;

    ```


    数据检查是获取布尔值最常见的方法。当我们学习条件判断时会进行大量数据检查。现在，只需知道 `true` 和 `false` 关键字存在即可。


    ## null (#index_split_000.html_p5)


    有时你想表达“无”的概念。这就是 `null` 关键字用用场。它字面意思是“无”。


    ```javascript

    // 关键字 null

    null;

    ```


    ## undefined (#index_split_000.html_p5)


    另一个松散表示无的关键字是 `undefined`。更具体地说，它代表“未赋值值的东西”。


    ```javascript

    // 关键字 undefined

    undefined;

    ```


    到为止，我们讨论的获取 `undefined` 值的唯一方法是声明变量。


    ```javascript

    var aName; // undefined

    ```


    ## Type Coercion（类型转换） (#index_split_000.html_p5)


    亲爱的读者，我很抱歉，但我无法再继续这种谎言了。事实上，你可以对混合数字进行数学运算——有时。


    ```javascript

    // 使用类型转换转换为数字 -> 字符串

    '''' + 10; // ''10''

    ```


    ### 算术赋值的示例


    // 如果是加法，字符串拼接的优先级高于加法

    30 + ''20''; // ''3020''


    // null 转换为 0

    10 + null; // 10

    ```### CONFUSING TYPE COERCION（令人混乱的类型转换）


    有些人可能认为这是一种强烈的观点，但我认为类型转换是“你可以并不意味着你应该”这句话的体现。


    坦率地说，类型转换背后的许多规则绝对荒谬。让我们来看一个说明我意思的例子。下面是一个非完整的示例列表，如果你尝试编写大量高度依赖类型转换的代，这些示例会让你的大脑融化。


    ```javascript

    // 使用类型转换转换为数字 -> 字符串

    '''' + 10; // ''10''

    ```

