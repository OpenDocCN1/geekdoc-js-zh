    [1.](#index_split_000.html_p78) What qualities make functions desirable to use
    when programming?


    Functions are a good way of abstracting out complex algorithms. This makes the
    code easier to understand. Functions are also reusable. Common operations can
    be pulled out into their own functions and used many times. Code that is reusable
    and easy to understand are qualities of well-written code.


