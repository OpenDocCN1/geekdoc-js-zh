    ## Hiding Elements Using CSS


    CSS works very well in conjunction with JavaScript. There are two different ways
    of creating elements on the page. One is to manually create them and the other
    is to reveal hidden elements.


    ### Applying CSS to HTML


    There are two different ways to apply CSS styling onto a page. One is using the
    `style` tag. CSS can be wrapped inside and styles will be applied via the attribute
    class. Here, the class name `hide` is being added to your button with correlating
    CSS to make the button invisible.


    ```html

    <html>


    <head>


    <style>


    .hide {


    opacity: 0;


    }


    </style>

    </head>


    <body>


    <button id="clickable-button" class="hide"> Click me!


    </button>


    <body>


    <script src="index.js"></script>


    </html>

    ```


    Inspecting this on the browser, the button is now gone! But if you inspect the
    page, the button is still there! It is just invisible.


    The other method is importing a CSS file, which is more commonly used. This is
    done using the `link` tag and giving the tag `rel` and `href` attributes. The
    `rel` value is always “stylesheets” and the `href` is the file name. Let’s modify
    it so the styles are in a separate file but still applied to the page.


    Make a new file with the CSS extension, `.css`. Mine will be named `styles.css`.


    ```css

    .hide {


    opacity: 0;


    }

    ```


    Then import it using the `link` tag. Nothing should change!


    ```html

    <html>


    <head>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <button id="clickable-button" class="hide"> Click me!


    </button>


    <body>


    <script src="index.js"></script>


    </html>

    ```


    ## Showing and Hiding Elements Using CSS


    CSS can be applied to hide elements and JavaScript can manipulate HTML, including
    classes and `ids`. This means you can show and hide elements using code! Let’s
    do just that. Add an HTML element with the class `hide` and an `id` so `getElementById`
    can be used.


    ```html

    <html>


    <head>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <button id="clickable-button">


    Click me!


    </button>


    <div class="hide" id="content"> Content!


    </div>


    <body>


    <script src="index.js"></script>


    </html>

    ```


    Then, in the JavaScript file, add behavior to the button event listener to remove
    the class from the HTML element.


    ```javascript

    // index.js


    ![Image 74](index-132_1.jpg)


    var button = document.getElementById(''clickable-button''); button.addEventListener(''click'',
    function () {


    var hiddenElement = document.getElementById(''content''); hiddenElement.classList.remove(''hide'');


    });

    ```


    After clicking the button, the hidden content should be revealed.


