  raw: "object instance: An object entity that holds its own data within itself; those\
    \ values are not shared among other object instances\n\nobject-oriented programming:\
    \ A feature of some programming languages that empowers a programmer with the\
    \ ability to create entities that internally hold their own functions and data\n\
    \nOR operator: The key symbol ||, which requires at least one value to be true\
    \ in order to evaluate to true\n\nparameter: Variables that are created for a\
    \ function whose values can be passed when the function is invoked\n\npascal case:\
    \ First letter of every word capitalized\n\nproperty: A piece of data (including\
    \ a method) that is accessible by key; applies to object data structures and object\
    \ instances\n\npseudo code: A computer algorithm written in plain English relational\
    \ operator: An operator that compares the value between two pieces of data scope:\
    \ The rules of where variables and functions are available for use within the\
    \ code script tag: The HTML tag that is used to run code from a JavaScript file\
    \ strict equality operator: An operator that compares equality but never uses\
    \ type coercion string: The data type that represents characters\n\ntype coercion:\
    \ JavaScript’s process that attempts to reconcile illogical operations by changing\
    \ data types for the duration of evaluation\n\nunit testing: The process of writing\
    \ tests for individual parts of a program variable: A name that can be associated\
    \ with a piece of data while loop: A type of loop that will continue running until\
    \ its terminating condition evaluates to false\n\n[Resources](#index_split_000.html_p9)\n\
    \nWEBSITES\n\nLeetCode ([LeetCode.com](http://LeetCode.com)) is an online bank\
    \ of coding questions. They have practice questions for coders of all skills levels.\n\
    \nThe Modern JavaScript Tutorial ([JavaScript.info](http://JavaScript.info)) is\
    \ a high-level overview of aspects of JavaScript. This is a personal favorite,\
    \ but it is not for the faint of heart!\n\nMozilla MDN Web Docs ([Developer.Mozilla.org/en-US)](http://Developer.mozilla.org/en-US)\
    \ provides comprehensive documentation for JavaScript and web development. It’s\
    \ very detailed and mostly used by professionals.\n\nStack Overflow ([StackOverflow.com](http://StackOverflow.com))\
    \ is a community-driven help forum for coders. An overwhelming majority of questions\
    \ you have about programming has been answered by someone on this site!\n\nBOOKS\n\
    \nClean Code: A Handbook of Agile Software Craftsmanship, by Robert C. Martin,\
    \ is an advanced guide on coding style. Keep this one handy. If you take the time\
    \ to learn about everything JavaScript has to offer, this is the way to take your\
    \ ability as a programmer to the next level.\n\n[Acknowledgments](#index_split_000.html_p9)\n\
    \nThank you to Jae Bradley, a stellar colleague. He and his passion inspired me\
    \ to push my boundaries and strive to be the best version of myself.\n\n![Image\
    \ 86](index-196_1.jpg)\n\n[About the Author](#index_split_000.html_p9)\n\nAndrew\
    \ Yueh is a professional software developer who specializes in JavaScript and\
    \ modern website technologies. He holds a master's degree in engineering from\
    \ Texas A&M University, where his thesis cemented his passion for web development.\n\
    \nAndrew has worked at multiple tech companies. He served as a technical lead\
    \ of a team at Wells Fargo, where he mentored multiple developers to improve their\
    \ programming ability.\n\nIn his off hours, he tutors high school students in\
    \ various subjects, including JavaScript fundamentals. As a hobbyist programmer,\
    \ he also works on multiple personal coding projects, all written in JavaScript.\n\
