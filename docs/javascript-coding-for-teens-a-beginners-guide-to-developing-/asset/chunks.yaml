    # [Introduction](#index_split_000.html_p5)


    Hey there, my name is Andrew Yueh. I’m a hobbyist programmer and professional
    software developer. Building products that people use and solving technical challenges
    are my favorite things about programming. My programming language of choice in
    my professional and personal life is `JavaScript`.


    We are here to get your feet wet in the world of `JavaScript` and programming
    fundamentals. [Chapters 1](#index_split_000.html_p12) and [2](#index_split_000.html_p18)
    cover what programming is and how to get your computer ready for `JavaScript`
    programming. [Chapters 3](#index_split_000.html_p28) through [9](#index_split_001.html_p108)
    are where the real learning starts. These chapters teach the basics of a variety
    of core programming concepts.


    Each chapter covers a particular coding topic and provides various extra learning
    and easy reference materials, including an overview of what was covered, an activity,
    practice problems, and the repair of some sample broken code!


    By the end of this book, you will be fully equipped to tackle two fun and challenging
    projects! Excited to get your hands dirty and wrangle some real code? How does
    a game sound? Want to get a taste of what it means to be a web developer? You’ll
    take a website and spruce it up!


    For extra guidance, we’ll be sprinkling some bonus tips, called Hacker Hints,
    along the way. A glossary at the end of this book allows for easy future reference
    of common industry terms. Looking to supplement your learning? Good, because we
    also provide a list of extra resources to check out. Let’s get started!


