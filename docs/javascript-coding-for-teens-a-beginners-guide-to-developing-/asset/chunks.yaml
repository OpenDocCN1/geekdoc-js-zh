- fmt: "\nBecause of this, it makes perfect sense for programmers to create data management\
    \ strategies. Instead of assigning individual pieces of data to a variable, one\
    \ by one, why not make something that is a collection of many pieces of data?\
    \ This is what a data structure is.\n\nJavaScript provides two basic data structures\
    \ to manage data. They are called arrays and objects.\n\n### Objects\n\nObjects\
    \ are data structures. They hold their data in key-value pairs. Keys are also\
    \ referred to as properties of the object.\n\n```javascript\nvar dogBreedAndName\
    \ = {\n  terrier: 'suzy', // key: terrier, value: 'suzy'\n  shiba: 'yin-yin',\
    \ // key: shiba, value: 'yin-yin'\n  goldenRetriever: 'sparky' // key: goldenRetriever,\
    \ value: 'sparky'\n};\n```\n\nAccessing values is done by referring to the associated\
    \ key name. This can be performed with the dot operator (a period).\n\n```javascript\n\
    // get the value 'suzy' by accessing the key 'terrier'\ndogBreedAndName.terrier;\
    \ // 'suzy'\n```\n\nBracket notation also works. It accesses the value using the\
    \ string value of the key.\n\n```javascript\n// get the value 'suzy' by accessing\
    \ the key 'terrier'\ndogBreedAndName['terrier']; // 'suzy'\n```\n\n### OBJECTS\
    \ AND UNDEFINED\n\nAny attempt to access a key that does not exist will output\
    \ `undefined`.\n\n```javascript\nvar dogs = {\n  terrier: 'suzy'\n};\n\n// No\
    \ key 'shiba' exists in the object\ndogs.shiba; // undefined.\n```\n\n### DOT\
    \ OPERATOR VS. BRACKET NOTATION\n\nThe dot operator cannot access anything except\
    \ the name that has been explicitly declared. The following will not work.\n\n\
    ```javascript\nvar dogName = 'terrier';\ndogBreedAndName.dogName; // undefined\n\
    ```\n\nThe intention of this code is to use “terrier” as a key to access the string\
    \ “suzy”. But in this case, the variable `dogName` was assigned first. The dot\
    \ operator will attempt to access the name as a string.\n\n```javascript\n// equivalent\
    \ statements\ndogBreedAndName.dogName; // undefined\ndogBreedAndName['dogName'];\
    \ // undefined\n```\n\nAccessing values from a variable name must use bracket\
    \ notation.\n\n```javascript\nvar dogName = 'terrier';\ndogBreedAndName[dogName];\
    \ // 'suzy'\n```\n\n### Arrays\n\nAn array is a data structure with a syntax of\
    \ square brackets, with commas separating each piece of data from the other.\n\
    \n```javascript\n[1, 2, 3]; // an array of numbers\n```\n\nArrays have indexes.\
    \ Indexes are “slots” that can have data inserted into them. Each item inside\
    \ an array can be accessed by index using bracket notation. Indexes in an array\
    \ start at 0.\n\n```javascript\nvar array = [30, 21, 43, 34];\narray[0]; // 30\n\
    array[1]; // 21\narray[2]; // 43\narray[3]; // 34\n```\n\n### ARRAYS AND UNDEFINED\n\
    \nAn attempt to access an index that is out of the bounds of the size of the array\
    \ will cause problems in your code. Your output will be `undefined`.\n\n```javascript\n\
    var array = [30, 21, 43, 34];\n// array is not long enough to have an index of\
    \ 4\narray[4]; // undefined\n```\n\n### ARRAY PROPERTY: LENGTH\n\nMore will be\
    \ explained later in this book, but arrays also have the concept of properties.\
    \ The most important one that will be used is the `length` property.\n\n```javascript\n\
    var array = [30, 21, 43, 34];\narray.length; // 4\n```\n\n### Data and Variables\
    \ in Action\n\nLet’s imagine you have lots of dogs and want the option to provide\
    \ the dog breed and print out the name of each of your dogs. Let’s take everything\
    \ you’ve learned so far and apply it!\n\n![Image 13](index-37_1.jpg)\n![Image\
    \ 14](index-37_2.jpg)\n\n### RECAP: CONFIRM FILE LOCATION\n\nFor your first challenge,\
    \ let’s re-review the file-creation and code-running processes.\n\nCreate a file\
    \ and name it `dogNames.js`. Here is what my VS Code explorer looks like right\
    \ now. Yours may look different. You can manage your files however you’d like.\n\
    \n### HACKER HINT\n\nIf you’ve gone into the wrong nested directory, the command\
    \ to go back up is `cd ..` (the command `cd`, a space, and two periods). If you’re\
    \ completely lost, restarting VS Code will reset the directory.\n\n### RECAP:\
    \ CONFIRM LOCATION IN TERMINAL\n\nRemember your terminal command `ls`? Use it\
    \ to confirm that the command line is currently pointed to the right folder.\n\
    \nUh-oh! You’re in the wrong directory. Your `dogNames.js` file isn’t there. After\
    \ inspecting your explorer, you see that it is nested in two subfolders: “exercises”\
    \ and “ch3.” You need to point to the right directory or you can’t run your code.\
    \ You can do it using the terminal command `cd`.\n\n![Image 15](index-38_1.jpg)\n\
    ![Image 16](index-38_2.jpg)\n![Image 17](index-38_3.jpg)\n\nDouble-check with\
    \ `ls` to confirm the correct location.\n\n### PREPPING INTERACTIVITY\n\nAdd your\
    \ first snippet of JavaScript to prepare for the exercise.\n\n```javascript\n\
    // the content of our file\nvar prompt = require('readline-sync');\nvar breed\
    \ = prompt.question;\n```\n"
  raw: 'Because of this, it makes perfect sense for programmers to create data management
    strategies. Instead of assigning individual pieces of data to a variable, one
    by one, why not make something that is a collection of many pieces of data? This
    is what a data structure is.


    JavaScript provides two basic data structures to manage data. They are called
    arrays and objects.


    [Objects](#index_split_000.html_p5)


    Objects are data structures. They hold their data in key-value pairs. Keys are
    also referred to as properties of the object.


    var dogBreedAndName = {


    terrier: ''suzy'', // key: terrier, value: ''suzy''


    shiba: ''yin-yin'', // key: shiba, value: ''yin-yin''


    goldenRetriever: ''sparky'' // key: goldenRetriever, value: ''sparky''


    };


    Accessing values is done by referring to the associated key name. This can be
    performed with the dot operator (a period).


    // get the value ''suzy'' by accessing the key ''terrier''


    dogBreedAndName.terrier; // ''suzy''


    Bracket notation also works. It accesses the value using the string value of the
    key.


    // get the value ''suzy'' by accessing the key ''terrier''


    dogBreedAndName[''terrier'']; // ''suzy''


    OBJECTS AND UNDEFINED


    Any attempt to access a key that does not exist will output undefined.


    var dogs = {


    terrier: ''suzy''


    };


    // No key ''shiba'' exists in the object


    dogs.shiba; // undefined.


    DOT OPERATOR VS. BRACKET NOTATION


    The dot operator cannot access anything except the name that has been explicitly
    declared. The following will not work.


    var dogName = ''terrier'';


    dogBreedAndName.dogName; // undefined


    The intention of this code is to use “terrier” as a key to access the string “suzy”.


    But in this case, the variable dogName was assigned first. The dot operator will
    attempt


    to access the name as a string.


    // equivalent statements


    dogBreedAndName.dogName; // undefined


    dogBreedAndName[''dogName'']; // undefined


    Accessing values from a variable name must use bracket notation.


    var dogName = ''terrier'';


    dogBreedAndName[dogName]; // ''suzy''


    [Arrays](#index_split_000.html_p6)


    An array is a data structure with a syntax of square brackets, with commas separating
    each piece of data from the other.


    [1, 2, 3]; // an array of numbers


    Arrays have indexes. Indexes are “slots” that can have data inserted into them.
    Each item inside an array can be accessed by index using bracket notation. Indexes
    in an array start at 0.


    var array = [30, 21, 43, 34];


    array[0]; // 30


    array[1]; // 21


    array[2]; // 43


    array[3]; // 34


    ARRAYS AND UNDEFINED


    An attempt to access an index that is out of the bounds of the size of the array
    will cause problems in your code. Your output will be undefined.


    var array = [30, 21, 43, 34];


    // array is not long enough to have an index of 4


    array[4]; // undefined


    ARRAY PROPERTY: LENGTH


    More will be explained later in this book, but arrays also have the concept of
    properties.


    The most important one that will be used is the length property.


    var array = [30, 21, 43, 34];


    array.length; // 4


    [Data and Variables in Action](#index_split_000.html_p6)


    Let’s imagine you have lots of dogs and want the option to provide the dog breed
    and print out the name of each of your dogs. Let’s take everything you’ve learned
    so far and apply it!


    ![Image 13](index-37_1.jpg)


    ![Image 14](index-37_2.jpg)


    RECAP: CONFIRM FILE LOCATION


    For your first challenge, let’s re-review the file-creation and code-running processes.


    Create a file and name it dogNames.js. Here is what my VS Code explorer looks
    like right now. Yours may look different. You can manage your files however you’d
    like.


    HACKER HINT


    If you’ve gone into the wrong nested directory, the command to go back up is cd
    .. (the command cd, a space, and two periods). If you’re completely lost, restarting
    VS Code will reset the directory.


    RECAP: CONFIRM LOCATION IN TERMINAL


    Remember your terminal command ls? Use it to confirm that the command line is
    currently pointed to the right folder.


    Uh-oh! You’re in the wrong directory. Your dogNames.js file isn’t there. After
    inspecting your explorer, you see that it is nested in two subfolders: “exercises”
    and “ch3.” You need to point to the right directory or you can’t run your code.
    You can do it using the terminal command cd.


    ![Image 15](index-38_1.jpg)


    ![Image 16](index-38_2.jpg)


    ![Image 17](index-38_3.jpg)


    Double-check with ls to confirm the correct location.


    PREPPING INTERACTIVITY


    Add your first snippet of JavaScript to prepare for the exercise.


    // the content of our file


    var prompt = require(''readline-sync'');


    var breed = prompt.question(''what breed is your dog? ''); Don’t sweat the details.
    Just know that these two lines make the JavaScript interactable. Running this
    code will create a text prompt. After entering text, it will be saved to the variable
    breed.


    Taking things one step at a time helps you find bugs sooner. Before trying to
    solve any challenges, print the input variable breed.


    The file should temporarily look like this. Remember to save the file before running
    it.


    // the content of our file


    var prompt = require(''readline-sync'');


    var breed = prompt.question(''what breed is your dog? ''); console.log(breed);


    RUN THE CODE


    An interactive experience has been prepared! Use the terminal command node and
    the file name to run it.


    Good! Now your JavaScript is waiting for you to type in a dog breed. Type something
    in and press Enter.


    ![Image 18](index-39_1.jpg)


    You have now confirmed that your code is accepting user inputs and printing out
    values in your command line.


    ADD DATA


    With a prompt set up, create a data structure with lovely dog information. Any
    key-value pairs can be added. As an example, I will provide excellent names that
    any dog would enjoy being called.


    var dogs = {


    terrier: ''Suzy'',


    husky: ''Sir Sniffybums III'',


    pug: ''Notorious P.U.G.''


    };


    PRINT AN INTERESTING STRING


    You now have input capability and data. Perhaps it is time for you to print an
    interesting string? To do this, you are going to use string concatenation, a string
    escape character, and data access of an object using bracket notation in one line.


    console.log(''Your dog\''s name is '' + dogs[breed] + ''? How fascinating!'');


    The file should now look like this.


    // dogNames.js


    var prompt = require(''readline-sync'');


    var breed = prompt.question(''what breed is your dog? ''); var dogs = {


    terrier: ''Suzy'',


    husky: ''Sir Sniffybums III'',


    pug: ''Notorious P.U.G.''


    };


    console.log(''Your dog\''s name is '' + dogs[breed] + ''? How fascinating!'');


    RUN THE FILE AGAIN


    Remember to save. Run the code one more time.


    With the input terrier, the object accessed the terrier key and gave the string


    ![Image 19](index-40_1.jpg)


    value “Suzy”. But what if we type a string that is not a key in our object?


    We can agree to disagree, but I find undefined to be a terrible name for a dog.


    Clearly, this is an oversight in the code. It would be nice if you could communicate
    this.


    However, at this point, you don’t have the knowledge to address this. This is
    something to look forward to in the next chapter.


    [Crack the Code](#index_split_000.html_p6)


    [1.](#index_split_001.html_p177) When are comments useful?


    [2.](#index_split_001.html_p177) What is the difference between declaration and
    assignment?


    [3.](#index_split_001.html_p177) Can the word var be used as a variable name?
    Why or why not?


    [4.](#index_split_001.html_p177) What keywords were covered in this chapter?


    [5.](#index_split_001.html_p177) What is the main difference between increment
    operators and self-assignment operators?


    [6.](#index_split_001.html_p177) How are values in an array accessed?


    [7.](#index_split_001.html_p177) How are values in an object accessed?


    [8.](#index_split_001.html_p177) What value is outputted if a nonexistent index
    is accessed in an array?


    [9.](#index_split_001.html_p177) What value is outputted if a nonexistent key
    is accessed in an object?'
