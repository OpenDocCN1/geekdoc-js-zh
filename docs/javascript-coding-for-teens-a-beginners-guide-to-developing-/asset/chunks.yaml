    \ {\n  return chatEntry.person.name + ': ' + chatEntry.message;\n};\n```\n\n###\
    \ ChatProgram.prototype.getLog\n\nThe array method `pop` is the wrong method for\
    \ adding entries to an array. It should be `push`. When calling a method inside\
    \ another method, `this.prototype.parseMessageEntry` should be `this.parseMessageEntry`.\n\
    \n```javascript\nChatProgram.prototype.getLog = function () {\n  var parsedMessages\
    \ = [];\n  for (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry\
    \ = this.chatLog[i];\n    var parsedMessage = this.parseMessageEntry(chatEntry);\
    \ parsedMessages.push(parsedMessage);\n  }\n  return parsedMessages;\n};\n```\n\
    \n### ChatProgram.prototype.printLog\n\nThe method `this.getLog` isn’t being invoked.\n\
    \n```javascript\nChatProgram.prototype.printLog = function () {\n  var allMessages\
    \ = this.getLog();\n  for (var i = 0; i < allMessages.length; i++) {\n    console.log(allMessages[i]);\n\
    \  }\n};\n```\n\n# Chapter 9 Solutions\n\n## CRACK THE CODE\n\n1. **After an HTML\
    \ file is updated and saved, the browser does not immediately update. Why?**\n\
    The browser currently has an older version of the HTML file loaded. Refreshing\
    \ the page will update it.\n\n2. **What is the document object?**\nThe `document`\
    \ object is JavaScript’s representation of the HTML page.\n\n3. **What is the\
    \ purpose of `document.getElementsByClassName` and `document.getElementById`?**\n\
    These functions are used to have JavaScript point to and manipulate HTML elements\
    \ on the page.\n\n4. **How are `document.getElementsByClassName` and `document.getElementById`\
    \ different?**\n`document.getElementsByClassName` searches for all instances of\
    \ the particular class that is being searched for and returns an array-like data\
    \ structure. `document.getElementById`, on the other hand, finds only one.\n\n\
    5. **What property contains the text inside an HTML element?**\nThe JavaScript\
    \ property that contains text is `innerHTML`.\n\n6. **What is an event listener?**\n\
    An event listener is a JavaScript function that is invoked once and then waits\
    \ for a particular interaction with the page to occur. This can range from key\
    \ presses to button clicks. Once an interaction occurs, JavaScript will run the\
    \ code inside the second argument, the function.\n\n7. **In our examples, the\
    \ click event listener was applied directly to the button. But the keystroke event\
    \ listener was applied to the entire document. Why?**\nThe event should be on\
    \ the button, because the event to be observed is a click on it. A click event\
    \ listener on the document would fire if the user clicks anywhere on the page.\
    \ Keystrokes, on the other hand, were not specific to a particular HTML element\
    \ on the page. As long as the user is on the page, we want to invoke behavior.\n\
    \n8. **What are the two ways to use the HTML script tag to run JavaScript code\
    \ when the page loads?**\nThe HTML script tag can have JavaScript code wrapped\
    \ inside it. It can also be used to import JavaScript code a `.js` file, with\
    \ the attribute `src`.\n\n## DEBUGGING\n\nThe event listener is appended to the\
    \ wrong element. Adding the event listener to the `document` will invoke the behavior\
    \ on any click. It has to be on the button. Also, the event handler is not selecting\
    \ the correct id. The text to be cleared is inside the `div` with the id that\
    \ is `'text'`.\n\n```javascript\nvar button = document.getElementById('delete-all');\n\
    button.addEventListener('click', function() {\n  var div = document.getElementById('text');\n\
    \  div.innerHTML = '';\n});\n```\n\n## Glossary\n\n- **abstraction**: The concept\
    \ of making a complex operation easy to use by hiding its implementation details\n\
    - **accumulator**: A classification of a variable that is used to slowly build\
    \ up a value in a loop\n- **AND operator**: The key symbol, `&&`, that requires\
    \ both values to be true in order to evaluate to true\n- **arithmetic assignment**:\
    \ The syntax to mathematically self-operate or self-combine strings together\n\
    - **array**: A data structure that holds data; the data is accessed by index\n\
    - **assignment**: The process of associating a piece of data to a variable\n-\
    \ **boolean**: A data type that represents true or false\n- **bracket notation**:\
    \ The syntax to access a value in an object data structure by key; also used to\
    \ access a value in an array by index\n- **break**: A keyword in a loop that exits\
    \ the loop entirely\n- **camelCase**: First word lowercased, with subsequent words\
    \ capitalized\n- **comment**: Text written in code that is not executed\n- **compiler**:\
    \ A program that analyzes and packages large groups of code at once\n- **concat**:\
    \ The process of combining two arrays or strings; short for “concatenation”\n\
    - **conditional statement**: A statement that evaluates to true or false\n- **constructor\
    \ function**: A function that is the initializer of an object instance, using\
    \ the keyword `new`\n- **continue**: A keyword in a loop that stops all subsequent\
    \ operations and moves on to the next iteration of the loop\n- **convention**:\
    \ The community’s coding style that is agreed upon\n- **CSS**: Cascading style\
    \ sheets, a styling language that visually enhances HTML\n- **data structure**:\
    \ An umbrella term that refers to data types that hold arbitrary amount of data\n\
    - **declare**: The creation of a variable\n- **decrement**: Decreasing the value\
    \ of a variable, whose data type is a number, by 1\n- **document**: The variable\
    \ inside the browser that is JavaScript’s representation of the website\n- **dot\
    \ operator**: The syntax to access an instance variable or method\n- **escape\
    \ character**: Used in strings; a special character, backslash denotes that a\
    \ key symbol should be ignored and be treated as a string\n- **equality operator**:\
    \ Operator that compares whether or not pieces of data are identical; equality\
