  trans: "\n\n\n- **对象实例 (object instance)**: 内部包含数据的对象实体；这些值不会与其他对象实例之间共享。\n\n- **面向对象编程\
    \ (object-oriented programming)**:某些编程语言的特性，赋予程序员创建内部包含自身函数和数据的实体。\n\n- **或运算符\
    \ (OR operator)**: 关键符号 `||`，要求至少有一个值为真，其评估结果才为真。\n\n- **参数 (parameter)**: 为函数创建的变量，在函数被调用时可以传递其值。\n\
    \n- **驼峰命名法 (pascal case)**: 每个单词的首字母均大写。\n\n- **属性 (property)**: 通过键访问的数据片段（包括方法）；适用于对象数据结构和对象实例。\n\
    \n- **伪代码 (pseudo code)**:用纯英语编写的计算机算法。\n\n- **关系运算符 (relational operator)**:\
    \ 比较两个数据之间数值的运算符。\n\n- **作用域 (scope)**: 代码脚本中变量和函数可用范围的规则。\n\n- **标签 (tag)**:\
    \ 用于从 JavaScript 文件中运行代码的 HTML 标签。\n\n- **严格相等运算符 (strict equality operator)**:\
    \ 比较相等性但绝不使用类型转换的运算符。\n\n- **字符串 (string)**: 代表字符的数据类型。\n\n- **类型转换 (type coercion)**:\
    \ JavaScript 的一种过程，通过在评估期间更改数据类型来尝试协调不逻辑的操作。\n\n- **单元测试 (unit testing)**: 为程序的各个部分编写测试的过程。\n\
    \n- **变量 (variable)**: 可以与数据数据关联的名字。\n\n- **while 循环 (while loop)**: 一种循环，直到终止条件评估为假为止都会持续运行。\n\
    \n## 资源\n\n### 网站 (WEBSITES)\n\n- **LeetCode** ([LeetCode.com](http://LeetCode.com))\
    \ 一个在线编程题库。他们为所有技能水平的程序员提供了练习题。\n- **现代 JavaScript 教程 (The Modern JavaScript Tutorial)**\
    \ ([JavaScript.info](http://JavaScript.info)) 对 JavaScript 各方面的高级概述。这是我的收藏，但它不适合胆小的人！\n\
    - **Mozilla MDN Web Docs** ([Developer.Mozilla.org/en-US)](http://Developer.mozilla.org/en-US))\
    \ 为 JavaScript 和 Web 开发提供了全面的文档。它非常详细，主要供专业人士使用。\n- **Stack Overflow** ([StackOverflow.com](http://StackOverflow.com))\
    \ 一个为程序员提供的社区驱动帮助论坛。你对编程的大多数问题已经由该网站的人回答了！\n\n### 书籍 (BOOKS)\n\n- **《清洁代码：敏捷软件手术手册》(Clean\
    \ Code: A Handbook of Agile Software Craftsmanship)**，Robert C. Martin 等，是一本关于编码风格的高级指南。请随手备。如果你花时间学习\
    \ JavaScript 提供的一切，这将是将你的程序员能力提升到新水平的方法。\n\n## 致谢\n\n感谢 Jae Bradley，一位出色的同事。他以及他的激情激励我突破边界，努力成为更好的自己。\n\
    \n![Image 86](img/index-196_1.jpg)\n\n## 关于作者\n\nAndrew Yueh 是一位专业的软件开发人员，专攻 JavaScript\
    \ 和现代网站技术。他拥有德克萨斯农业机械州立大学的工程硕士学位，他的论文奠定了他对 Web 开发的热情。\n\nAndrew 曾在多家科技公司工作。他曾担任富国银行一个团队的技术主管，在那里指导过多名开发人员提高他们的编程能力。\n\
    \n在空余时间，他辅导高中生学习各个科目，包括 JavaScript 基础。作为一名业余程序员，他还致力于多个用 JavaScript 编写的个人编码项目。\n\
    \n# 文档大纲 (Document Outline)\n\n- 标题页\n- 版权所有页\n- 献辞\n- 目录\n- 引言\n- 第 1 章：欢迎 JavaScript\
