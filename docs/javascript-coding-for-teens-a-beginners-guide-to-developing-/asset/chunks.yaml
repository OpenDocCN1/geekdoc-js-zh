    \ {\n  console.log('I am an array');\n} else {\n  console.log('I am not an array');\n\
    }\n```\n\n### 2. 《超级意大利兄弟 2》已经连续 10 多次获得驴博士的“年度游戏”奖。它绝对是一部杰作。但代码却并非如此。\n\n在 `if`\
    \ 条件判断中，值比较符是错误的。它应该是大于 `>`，而不是小于 `<`。\n\n```javascript\nvar game = 'superItalianBrosTwo';\n\
