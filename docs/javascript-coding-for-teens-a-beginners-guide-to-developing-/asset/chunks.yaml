    guessed.


    Reveal the Correct Guessed Key


    If the player guessed a correct key, great! Remove the class “hidden” from that
    specific character. Every secret character has to be checked to see if it is a
    match.


    Hangman.prototype.updateSecretCharacter = function (char) {


    var allSecretChars = document.getElementsByClassName (''secret-character'');


    for (var i = 0; i < allSecretChars.length; i++) {


    var secretChar = allSecretChars[i];


    if (char.toLowerCase() === secretChar.innerHTML.toLowerCase())


    {


    secretChar.classList.remove(''hidden'');


    }


    }


    };


    Add a Body Part to the Person


    If the player guessed incorrectly, they must be penalized for their foolishness.
    Express this visually by adding a body part to the person. The instance variable
    this.remainingBadGuesses also needs to be decremented.


    Each number in this.remainingBadGuesses will correlate to a particular body part.


    A conditional chain is perfect here! The process of revealing a body part is always
    the removal of the class “intact”. The only thing that changes each time is the
    id of the HTML element. A helper function that can be reused for all of the body
    parts can be written. This is a much easier and cleaner approach.


    Hangman.prototype.revealBodyPart = function () {


    this.remainingBadGuesses -= 1;


    function reveal(id) {


    var container = document.getElementById(id);


    container.classList.remove(''intact'');


    }


    if (this.remainingBadGuesses === 5) {


    reveal(''head'');


    } else if (this.remainingBadGuesses === 4) {


    reveal(''body'');


    } else if (this.remainingBadGuesses === 3) {


    reveal(''arm-left'');


    } else if (this.remainingBadGuesses === 2) {


    reveal(''arm-right'');


    } else if (this.remainingBadGuesses === 1) {


    reveal(''leg-right'');


    }


    };


    The game is starting to shape up!


    Check If a Player Has Won or Lost


    After the completion of one cycle, check to see if the game should end. Win or
    lose, the game should stop, and a pop-up message will appear.


    The player has won if every character in this.secretWord exists in the this.charactersGuessed.


    Hangman.prototype.playerWon = function () {


    for (var i = 0; i < this.secretWord.length; i++) {


    var secretChar = this.secretWord[i];


    if (!includes(secretChar, this.charactersGuessed)) {


    return false;


    }


    }


    return true;


    };


    The player has lost if they have no more wrong guesses.


    Hangman.prototype.playerLost = function () {


    return this.remainingBadGuesses === 0;


    };


    This check should occur in two separate places. If the game is already over, no
    behavior should occur. This means we should do an early return at the very top
    of the event listener if the player has already won or lost. The second place
    is at the bottom,


    ![Image 81](index-155_1.jpg)


    where we will have specific game behavior based on whether or not the game has
    ended.


    Show Game Over HTML


    If the player has won or lost, the game is over! Show them a message, as well
    as a button to reset the game.


    This process involves revealing and hiding a lot of elements, so this is tricky.
    First, grey out the main game by adding the class “game-inactive”. After that,
    remove the class “no-display” to reveal the game over pop-up. The button will
    automatically be revealed.


    The display message will differ based on whether the player won or lost. The method
    playerLost can be reused to check this. Another message will also reveal the secret
    word.


    Hangman.prototype.showGameEnd = function () {


    var gameContainer = document.getElementById(''game'');


    gameContainer.classList.add(''game-inactive'');


    var gameEndContainer = document.getElementById(''game-end''); gameEndContainer.classList.remove(''no-display'');


    var messageContainer = document.getElementById(''game-end-message'');


    if (this.playerLost()) {


    messageContainer.innerHTML = ''You Lose!'';


    } else {


    messageContainer.innerHTML = ''You Win!'';


    }


    var secretContainer = document.getElementById(''revealed-secret''); secretContainer.innerHTML
    = ''The secret was: '' + this.secretWord;


    };


