    \ = function () {\n  this.remainingBadGuesses -= 1;\n  function reveal(id) {\n\
    \    var container = document.getElementById(id);\n    container.classList.remove('intact');\n\
    \  }\n  if (this.remainingBadGuesses === 5) {\n    reveal('head');\n  } else if\
    \ (this.remainingBadGuesses === 4) {\n    reveal('body');\n  } else if (this.remainingBadGuesses\
    \ === 3) {\n    reveal('arm-left');\n  } else if (this.remainingBadGuesses ===\
    \ 2) {\n    reveal('arm-right');\n  } else if (this.remainingBadGuesses === 1)\
    \ {\n    reveal('leg-right');\n  }\n};\n```\n\nThe game is starting to shape up!\n\
    \n### Check If a Player Has Won or Lost\n\nAfter the completion of one cycle,\
    \ check to see if the game should end. Win or lose, the game should stop, and\
