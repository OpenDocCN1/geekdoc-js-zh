    The default terminal that VS Code uses is the Windows built-in command line. As
    mentioned earlier, this command line is harder to work with, so we’re going to
    use Git Bash as the default. After opening the terminal by going to Terminal (at
    the top of your screen) -> New Terminal, you will see, on the right-hand bar,
    a terminal selector. Click on “Select default shell.”


    A prompt will appear on the top. Select Git Bash.


    ![Image 6](index-22_1.jpg)


    ![Image 7](index-22_2.jpg)


    ![Image 8](index-22_3.jpg)


    Restart VS Code. Look at the bottom of your screen. Your command line should now
    default to Git Bash when VS Code is opened.


    PREPARE YOUR JAVASCRIPT FOLDER


    It makes sense to have a folder in your computer that is dedicated to all of your
    code.


    Programmers call this a “working directory.” Create a folder anywhere in your
    file system, preferably somewhere easily accessible, like your desktop folder.
    All of the files that contain your code will live in this folder.


    To open the folder, click “File” then “Open Folder” in VS Code.


    Find the folder you created and click “Select Folder.”


    ![Image 9](index-23_1.jpg)


    ![Image 10](index-23_2.jpg)


    Once you open it, VS Code should now have the name of the folder on the top bar.


    INSTALLING JAVASCRIPT PACKAGES


    Many algorithms are hard to write, so programmers all over the world share their
    code with one another so they don’t have to reinvent difficult algorithms all
    over again! They are uploaded to a hosting service called npm (short for “Node
    Package Manager”), which is available to everyone to download for free. Installing
    packages is a streamlined process for a user. In JavaScript, creating basic programs
    with user interactivity is surprisingly complicated. In many of the exercises
    within this book, you will be using a handy package someone else worked very hard
    to make, named readline-sync. The command to install it through the terminal is:


    npm i readline-sync


    But wait—where do you type this? Easy enough: In the bottom half of your screen,
    beneath the word “terminal,” is the terminal. In that area, you’ll probably see
    a small white box. This is where you’ll type your terminal commands. If you don’t
    see something similar to the image below at the bottom of your window, you haven’t
    opened the VS


    Code terminal. This can be done on the menu bar at Terminal -> New Terminal.


    PREPARE THE FILE


    Go to File -> New File and it will open up a new, empty text file for you to start
    coding in.


    To save a file, go to File -> Save. Let’s try this out. When you first save a
    file, it will ask you to name it. The default extension will be for a .txt file.
    But don’t save yet, because it’s a trap!'
