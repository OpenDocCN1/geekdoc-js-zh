  trans: "\n\n# 4. 在方法内部调用另一个方法的语法是什么？\n# 5. 创建构造函数的语法是什么？\n# 6. 什么是对象实例？\n# 7. 初始化对象实例的语法是什么？\n\
    \n## 调试\n\n一个基础的聊天程序在运行时出现了问题。`printLog` 方法应该打印聊天记录。这个任务有点棘手，因为有两个对象正在相互交互。你正在以高级的方式使用数据结构，所以不要害怕使用\
    \ `console.log` 来检查变量的值。\n\n```javascript\nfunction Person(name) {\n  this.name\
    \ = name;\n}\n\nfunction ChatProgram() {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message\
    \ = function (person, message) {\n  var messageEntry = {\n    person: person,\n\
    \    message: message\n  };\n  this.chatLog(messageEntry);\n};\n\nChatProgram.prototype.parseMessageEntry\
    \ = function (chatEntry) {\n  return chatEntry.person.name + ': ' + chatEntry.chat;\n\
    };\n\nChatProgram.prototype.getLog = function () {\n  var allMessages = [];\n\
    \  for (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry = this.chatLog[i];\n\
    \    var parsedMessage =\n      this.prototype.parseMessageEntry(chatEntry);\n\
    \    allMessages.pop(parsedMessage);\n  }\n  ![Image 45](img/index-105_1.jpg)\n\
    \  return allMessages;\n};\n\nChatProgram.prototype.printLog = function () {\n\
    \  var allMessages = this.getLog;\n  for (var i = 0; i < allMessages.length; i++)\
    \ {\n    console.log(allMessages[i]);\n  }\n};\n\nvar layna = new Person('Layna');\n\
    var andrew = new Person('Andrew');\nvar chat = new ChatProgram();\nchat.message(andrew,\
    \ 'Hi Layna, how's it going?');\nchat.message(layna, 'I'm doing great');\nchat.message(layna,\
    \ 'What about you?');\nchat.message(andrew, 'I just came back from the doctor');\
    \ chat.message(layna, 'Wow, this conversation is really boring'); chat.message(andrew,\
    \ 'That was really mean, why would you say something like that?');\nchat.message(layna,\
    \ 'I have better things to do');\nchat.message(andrew, ':(');\nchat.message(layna,\
    \ 'Goodbye');\nchat.printLog();\n```\n\n这是预期的输出。\n\n## 编码检查清单\n\n编码检查清单 » 让我们回顾一下涵盖过的的话题。面向对象编程并不是\
    \ JavaScript 特有的，但它是第一个一个在所有编程语言中并不通用的主题（实现方式不同）。面向对象编程是解决编程挑战的众多策略之一。随着你在编程工具箱中积累了更多技术，你将发现解决问题有多种方法。发现最佳解决办法需要经验和直觉。如果你有一个不确定的主意，尽管去尝试一试吧！编程的核心就在于从过去的错误中学习。以下是本章中所学内容的快速回顾。\n\
    \n- 什么是对象\n- 什么是对象实例\n- 如何创建实例变量\n- 如何创建方法\n\n![Image 46](img/index-107_1.jpg)\n\
    \n## 第 9 章：JavaScript 与 Web\n\n（虽然无聊的）HTML 能做的一切，都可以使用 JavaScript 来——而且如此！为了证明这一点，在本章中，你将从网页上的\
    \ HTML 开始，展示如何用 JavaScript 实现相同的功能，然后进一步超越 HTML 的能力。这是你第一次体验现代 JavaScript 的魅力以及它大放异彩的地方。我你像我一样兴奋！\n\
    \n### Web 的抽象级别\n\n与你的标准终端相比，网站处于完全不同的抽象层级。如果说 `console.log` 的抽象级别像比骑自行车，那么 JavaScript\
    \ 及其 Web 开发功能就像是开车。\n\n对于本章，你不需要担心这些工具是如何工作的。你只需要关注利用这些工具在浏览器中执行有意义的任务的能力。\n\n\
    ### HTML：超文本标记语言\n\n你将非常依赖 JavaScript，但仍然需要少量的超文本标记语言，即 `HTML` 来与网页进行交互。现代网站使用了大量的\
    \ JavaScript 来操作它。\n\n#### HTML 文件\n\n就像 JavaScript 有自己的文件扩展名 `.js` 一样，`HTML`\
    \ 也有自己的文件扩展名 `.html`。创建一个 HTML 文件。这是某个东西被视为网页的最低要求。我将我的命名为 `index.html`，这是第一个\
    \ HTML 文件的标准名称。\n\n![Image 47](img/index-109_1.jpg)\n\n#### HTML 标签\n\n注意单词周围的角括号了吗？那是\
    \ `HTML` 语法。\n\n```<valid-html-tag-name-here>```\n\n一个被角括号包围，另一个有一个角括号和一个斜杠。\n\
    \n只有角括号的标签被称为起始标签，而另一个带有斜杠的被称为结束标签。一个起始标签必须有一个对应的结束标签。\n\n```html\n<html>\n</html>\n\
    ```\n\n在起始标签和结束标签之间可以放置任何数量的内容。`HTML` 变得可以变得得极其复杂！\n\n#### 我们将使用的 HTML 标签\n\n\
    由于本书的重点是 JavaScript，所以只会涵盖少数几个 `HTML` 标签。\n\n```html\n<html>\n<head>\n</head>\n\
    <body>\n<div>\nHello!\n</div>\n</body>\n</html>\n```\n\n`html` 标签是主标签，它包裹了文件中的所有\
    \ `HTML` 内容。`head` 标签是多用途的。它通常是插入非视觉 `HTML` 的地方。`body` 标签是放置视觉元素的地方。`div` 是一个没有重要作用角色的标签。它仅被用于封装其内部的元素。\n\
    \n#### HTML 属性：CLASS 和 ID\n\n有很多不同的 `HTML` 属性。应用它们的语法是属性名、等号和值（双引号）。作为一种概念，它与对象数据结构中的键值对非常相似。\n\
    \n```html\n<div class=\"container\">\nI am content in a div\n```\n\n`class` 和\
    \ `id` 属性在 `HTML` 中非常重要。在与 JavaScript 协作时，常用的策略是通过它们的类或 `id` 查找 HTML 元素。\n\n##\
    \ Web 浏览器\n\n在开始之前，确保已安装 Web 浏览器 Google Chrome。并不是所有浏览器都构造相同，Google Chrome 非常擅长运行\
    \ JavaScript。\n\n搜索引擎查询：“google download”\n\n当前 URL：[`google.com/chrome`](http://google.com/chrome)\n\
    \n### 浏览器开发者工具\n\n安装后，打开 Google Chrome。导航到设置（右上三个点） -> 更多工具 -> 开发者工具。开发者控制台将会。作为\
    \ JavaScript 程序员，这是魔法发生的地方。JavaScript 可以写在这里。\n\n![Image 48](img/index-111_1.jpg)\n\
    \n记得那个基础的 `index.html` 吗？在你的操作系统（PC 或 Mac）文件系统中找到它。最简单的方法是在 VS Code 中右键点击文件并选择“在文件管理器中显示”。对于\
    \ Mac，是“在访达中显示”。代码将打开文件所在的目录。\n\n![Image 49](img/index-112_1.jpg)\n\n![Image 50](img/index-112_2.jpg)\n\
    \n如果文件已经有了 Google Chrome 图标，双击文件打开。文件也可以拖放到浏览器窗口。\n\n注意位置不是互联网 URL？那是指向 HTML 文件的目录路径。在确认文件运行后，修改\
    \ HTML。\n\n```html\n<html>\n<head>\n</head>\n<body>\n<div>\nHello!\n![Image 51](img/index-113_1.jpg)\n\
    ![Image 52](img/index-113_2.jpg)\n</div>\n<div class=\"container\">\nI am EXTREMELY\
    \ cool\n</div>\n</body>\n</html>\n```\n\n修改后，页面没有变化。为什么浏览器不承认我们非常酷这一实？那是因为浏览器加载了文件的旧版本。为了看到更新，请刷新页面。\n\
    \n刷新后，我们看到了更新。非常棒！\n\n"
- fmt: '

    In the browser, there is a variable that is automatically created called `document`.
    Type it into the developer console. The variable is a JavaScript object that refers
    to the entire page. After expansion, all the HTML is revealed. Use your mouse
    cursor and hover over the `document` variable. Notice how the web page is blue?


    ![Image 53](index-114_1.jpg)


    ![Image 54](index-114_2.jpg)


    The developer console highlights HTML that the cursor is hovering over. To further
    prove this, expand the body and hover over a highlighted `div` element.


    ## HTML Selectors (#index_split_000.html_p7)


    JavaScript has many browser-related functions to use. `document` is an object,
    which means it has methods. The available methods can modify HTML. The entire
    web development community relies heavily on this handful of methods and functions.


    ### DOCUMENT.GETELEMENTSBYCLASSNAME


    One method on the `document` object that will be used extensively is `document.getElementsByClassName`.
    If we change the `div` HTML elements to have `class` attributes, `document.getElementsByClassName`
    can work its magic!


    ```html

    <html>

    <head>

    </head>

    <body>

    ![Image 55](index-115_1.jpg)

    <div class="cool-message">

    Hello!

    </div>

    <div class="cool-message">

    I am EXTREMELY cool

    </div>

    </body>

    </html>

    ```


    `document.getElementsByClassName` accepts one parameter. It is the string name
    of the class. The class `cool-message` was added to the `div` elements. This attribute
    will be used to identify the HTML elements. Use the following code in the developer
    console. After the code is run, type the variable name to show its value in the
    console.


    ```javascript

    var divElements = document.getElementsByClassName(''cool-message'');

    ```


    After the code is run, type the variable name `divElements` into the console again
    to show its value.


    Great! Looks like the statement returned an array of our two HTML elements! Well,
    technically, it is a data structure called an `HTMLCollection`. Moving forward,
    `HTMLCollections` will be referred to as an array-like data structure. But don’t
    worry, because the distinction between arrays and array-like data structures won’t
    impact you.


    Loops work on `HTMLCollections`.


    ### DOCUMENT.GETELEMENTBYID


    In the same way `document.getElementsByClassName` gets HTML elements by their
    class attribute, `document.getElementById` selects an element by its `id` attribute.
    In order to have an element get selected by `document.getElementById`, modify
    the HTML. Add a `div` element with an `id` attribute.


    ```html

    <html>

    <head>

    </head>

    <body>

    ![Image 56](index-116_1.jpg)

    <div class="cool-message">

    Hello!

    </div>

    <div class="cool-message">

    I am EXTREMELY cool

    </div>

    <div id="occupation">

    That is because I am a programmer

    </div>

    </body>

    </html>

    ```


    Refresh the page. Type the following code into the developer console. After typing
    the variable name into the console again, the return value should be pointing
    to the third line of text.


    ```javascript

    var divElement = document.getElementById(''occupation'');

    ```


    Notice how `document.getElementById` returns a single element? It does not return
    an array-like data structure, like `document.getElementsByClassName` does. That’s
    because `document.getElementById` can only select one element at a time.


    ## HTML Manipulation (#index_split_000.html_p7)


    HTML elements have many methods and properties in them, just like the `document`
    object. These methods and properties give us the ability to modify specific HTML
    elements.


    ### ACCESS TEXT WITH INNERHTML


    When writing text on the page and wrapping it inside HTML, `div` is the most straightforward
    tag to use. When JavaScript uses a selector to point to the HTML, it is represented
    as a JavaScript object. This object has a key named `innerHTML`. It holds the
    text inside an HTML element. This can be seen by revisiting your sample HTML.


    Grab the text inside the `div` with the `id` of `occupation` using


    ![Image 57](index-117_1.jpg)


    `document.getElementById`.


    ```html

    <html>

    <head>

    </head>

    <body>

    <div class="cool-message">

    Hello!

    </div>

    <div class="cool-message">

    I am EXTREMELY cool

    </div>

    <div id="occupation">

    That is because I am a programmer

    </div>

    </body>

    </html>

    ```


    ```javascript

    var divElement = document.getElementById(''occupation'');

    divElement.innerHTML;

    ```


    ### INJECTING NEW TEXT WITH INNERHTML


    `innerHTML` is a property on the object. Just like with any key-value pair on
    an object, it can be reassigned. This allows modification of the text inside.


    ```javascript

    var divElement = document.getElementById(''occupation'');

    divElement.innerHTML += '' and love building things'';

    ```


    ![Image 58](index-118_1.jpg)


    Using the self-addition operator, extra text was appended to the `div` element’s
    `innerHTML`. Congrats! You have taken the first step into the world of web development.


    ### UPDATING ATTRIBUTE ID


    In the same way `innerHTML` can be updated, the attributes `class` and `id` can
    be changed as well. Updating the `id` of an HTML element is easy. The key is `id`.


    ```javascript

    var divElement = document.getElementById(''occupation'');

    divElement.id = ''new-id'';

    ```


    ### UPDATING ATTRIBUTE CLASS


    Updating `class` is trickier than `id`. This is because it is common to have multiple
    classes assigned. Revisit the HTML file. Right now, the `div` elements have a
    single `class`.


    ```html

    <html>

    <head>

    </head>

    <body>

    <div class="cool-message">

    Hello!

    </div>

    <div class="cool-message">

    I am EXTREMELY cool

    </div>

    <div id="occupation">

    That is because I am a programmer

    </div>

    </body>

    </html>

    ```


    The method to add a class to an existing HTML element is `classList.add`. It takes
    a single parameter, which is the name of the class, to append.


    ```javascript

    var divElements = document.getElementsByClassName(''cool-message'');

    ```


    ![Image 59](index-119_1.jpg)


    ![Image 60](index-119_2.jpg)


    ```javascript

    divElements[0].classList.add(''new-class'');

    ```


    The method to remove a class is `classList.remove`, which takes a single argument
    that is the name of the class to be removed.


    ```javascript

    var divElements = document.getElementsByClassName(''cool-message'');

    divElements[0].classList.remove(''new-class'');

    ```


    ### PURPOSE OF CHANGING HTML CLASS


    So far, you’ve been doing a lot of work to learn how to change HTML element’s
    class. This becomes important when you’re working with CSS. This book won’t be
    covering CSS, but just know that updating the class attribute is a common way
    of triggering visual changes on HTML elements.


    ## Creating HTML Elements (#index_split_000.html_p7)


    ![Image 61](index-120_1.jpg)


    ![Image 62](index-120_2.jpg)


    The `document` object also has methods to create HTML elements. This will become
    especially important when you make your game!


    ### DOCUMENT.CREATEELEMENT


    Using `document.createElement`, JavaScript can create HTML. It accepts one parameter,
    which is the string name of the HTML tag. Because we aren’t learning much HTML,
    we will always be creating a `div` element using `document.createElement`.


    ```javascript

    var div = document.createElement(''div'');

    div.innerHTML = ''I am a new div!'';

    ```


    An HTML `div` has been created with `innerHTML`: “I am a new div!” But where is
    it?


    It isn’t on the page. You’ve created it, but you haven’t put it anywhere!


    ### APPENDING HTML TO THE PAGE


    An HTML element that is created with JavaScript needs to be manually added to
    the page. This is where the method `append` is used. It exists on the HTML object
    that is retrieved using any HTML selector, such as `document.getElementsByClassName`
    and `document.getElementById`.


    ```javascript

    var div = document.createElement(''div'');

    div.innerHTML = ''I am a new div!'';

    var divElements = document.getElementsByClassName(''cool-message'');

    divElements.append(div);

    ```


    Whoops! Why did this not work? That’s because `document.getElementsByClassName`
    returns an array-like data structure.


    ![Image 63](index-121_1.jpg)


    ![Image 64](index-121_2.jpg)


    Accessing an element in the array-like data structure can be done by index.


    ```javascript

    var div = document.createElement(''div'');

    div.innerHTML = ''I am a new div!'';

    var divElements = document.getElementsByClassName(''cool-message'');

    divElements[1].append(div);

    ```


    You just used pure JavaScript to make HTML! I think that’s pretty cool.


    ### REMOVING HTML FROM THE PAGE

