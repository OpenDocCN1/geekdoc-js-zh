  trans: "\n\n正因如此，程序员创建数据管理策略是完全合逻辑的。与其一个一个地将每一个数据赋值给变量，为什么不创建一个包含许多个数据的集合呢？这就是数据结构。\n\
    \nJavaScript 提供了两种基本的数据结构来管理数据。它们被称为数组和对象。\n\n### 对象\n\n对象是数据结构。它们以键值对的形式存储数据。键（Keys）也被称为对象的属性。\n\
    \n```javascript\nvar dogBreedAndName = {\n  terrier: 'suzy', // key: terrier,\
    \ value: 'suzy'\n  shiba: 'yin-yin', // key: shiba, value: 'yin-yin'\n  goldenRetriever:\
    \ 'sparky' // key: goldenRetriever, value: 'sparky'\n};\n```\n\n通过引用关联的键来访问值。这可以使用点运算符（点）完成。\n\
    \n```javascript\n// 通过访问键 'terrier' 获取值 'suzy'\ndogBreedAndName.terrier; // 'suzy'\n\
    ```\n\n方括号表示法同样有效。它使用键的字符串值来访问值。\n\n```javascript\n// 通过访问键 'terrier' 获取值 'suzy'\n\
    dogBreedAndName['terrier']; // 'suzy'\n```\n\n### 对象与未定义 (undefined)\n\n任何访问不存在键的尝试都会输出\
    \ `undefined`。\n\n```javascript\nvar dogs = {\n  terrier: 'suzy'\n};\n\n// 对象中不存在键\
    \ 'shiba'\ndogs.shiba; // undefined.\n```\n\n### 点运算符 VS 方括号表示法\n\n点运算符无法访问显式声明之外的任何内容。以下操作将不起作用。\n\
    \n```javascript\nvar dogName = 'terrier';\ndogBreedAndName.dogName; // undefined\n\
    ```\n\n这段代码的意图是使用“terrier”作为键来访问字符串“suzy”。在这种情况下，变量 `dogName` 先被赋值了。点运算符会尝试将该名称作为字符串访问。\n\
    \n```javascript\n// 等价语句\ndogBreedAndName.dogName; // undefined\ndogBreedAndName['dogName'];\
    \ // undefined\n```\n\n从变量名访问值必须使用方括号表示法。\n\n```javascript\nvar dogName = 'terrier';\n\
    dogBreedAndName[dogName]; // 'suzy'\n```\n\n### 数组\n\n数组是一种使用方括号语法的数据结构，用逗号分隔每条数据。\n\
    \n```javascript\n[1, 2, 3]; // 一个数字数组\n```\n\n数组具有索引（Indexes）。索引是可以用来插入数据的“槽”。数组中的每个项都可以使用方括号表示法通过索引访问。数组中的索引从\
    \ 0 开始。\n\n```javascript\nvar array = [30, 21, 43, 34];\narray[0]; // 30\narray[1];\
    \ // 21\narray[2]; // 43\narray[3]; // 34\n```\n\n### 数组与未定义 (undefined)\n\n尝试访问数组长度范围的索引会导致代码出现问题。你的输出将是\
    \ `undefined`。\n\n```javascript\nvar array = [30, 21, 43, 34];\n// 数组长度不足，没有索引\
    \ 4\narray[4]; // undefined\n```\n\n### 数组属性：长度 (LENGTH)\n\n本书的后部分将进行更多解释，但数组也有属性的概念。最重要的是\
    \ `length` 属性。\n\n```javascript\nvar array = [30, 21, 43, 34];\narray.length;\
    \ // 4\n```\n\n### 数据与变量的应用\n\n让我们想象你有很多狗，并想要提供狗品种并打印出每只狗的名字。让我们把目前所学到的所有知识应用起来吧！\n\
    \n![Image 13](img/index-37_1.jpg)\n![Image 14](img/index-37_2.jpg)\n\n### 总结：确认文件位置\n\
    \n对于你的第一个挑战，让我们重新回顾创建文件和运行代码的过程。\n\n创建一个文件并命名为 `dogNames.js`。这是我现在的 VS Code 资源管理器视图。你的可能看起来不同。你可以以任何喜欢的方式管理文件。\n\
    \n### 黑客提示 (HACKER HINT)\n\n如果你进入了错误的嵌套目录，返回上一级的命令是 `cd ..`（命令 `cd`、一个空格和两个点）。如果你完全迷路了，重启\
    \ VS Code 将重置目录。\n\n### 总结：确认终端位置\n\n记得你的终端命令 `ls` 吗？用它来确认命令行当前是否指向正确的文件夹。\n\n\
    哎呀！你处于错误的目录中。你的 `dogNames.js` 文件不在那里。在检查资源管理器后，你发现它嵌套在两个子文件夹中：“exercises”和“ch3”。你需要指向正确的目录，否则你无法运行代码。你可以使用终端命令\
    \ `cd` 来做到。\n\n![Image 15](img/index-38_1.jpg)\n![Image 16](img/index-38_2.jpg)\n\
    ![Image 17](img/index-38_3.jpg)\n\n使用 `ls` 再次检查以确认正确位置。\n\n### 准备交互\n\n添加你的第一段\
    \ JavaScript 代码来准备练习。\n\n```javascript\n// 文件的内容\nvar prompt = require('readline-sync');\n\
    var breed = prompt.question;\n```\n\n"
- fmt: "\n# 10. When is bracket notation necessary for accessing a value in an object,\
    \ instead of the dot operator?\n\n## Debugging\n\nWhen debugging code, it can\
    \ be helpful to place the code in a file and run it in the command line. You will\
    \ get real-time feedback on your answer.\n\n### 1. The variable doesn’t seem to\
    \ change in value, despite the fact that it is being incremented.\n\n```javascript\n\
    var num = 0;\nnum = num++; // increment num\nconsole.log(num); // 0\n```\n\n###\
    \ 2. Adding two numbers together isn’t working properly.\n\n```javascript\nvar\
    \ num1 = 10;\nvar num2 = '2';\nconsole.log(num1 + num2); // ‘102’\n```\n\n###\
    \ 3. Trying to access your dog’s name “Max” by using the key “pug” is outputting\
    \ undefined.\n\n```javascript\nvar dogs = {\n  pug: 'Max',\n  terrier: 'Appa'\n\
    };\nvar myDog = 'pug';\nconsole.log(dogs.myDog); // undefined\n```\n\n### 4. An\
    \ attempt to access the last entry in the array is outputting undefined.\n\n```javascript\n\
    var meanPeople = ['Layna', 'Layna again', 'Layna one more time']; \nconsole.log(meanPeople[3]);\
    \ // undefined\n```\n\n### 5. A fatal runtime error is occurring when trying to\
    \ print this string.\n\n```javascript\nconsole.log('Layna's favorite hobby is\
    \ being mean to Andrew');\n// Uncaught SyntaxError: missing ) after argument list\n\
    ```\n\n## CODER’S CHECKLIST » Let’s review the topics we covered\n\nLet’s take\
    \ a quick minute to review what was covered in this chapter. An understanding\
    \ of arrays and data types are especially important.\n\n- Data types\n- Type coercion\n\
    - Data structures—arrays and objects\n- Accessing data within data structures\n\
    \n![Image 20](index-42_1.jpg)\n\n## CHAPTER 4: Conditionals\n\nComputers operate\
    \ in very logical ways. Some of a computer’s favorite answers are “yes” and “no.”\
    \ In computer terms, this is the equivalent of “true” and “false.” The ability\
    \ to discern between `true` and `false` is an incredible strength. It means a\
    \ computer can decide what code should run depending on the situation. This also\
    \ means that one program can do many things and make its own decisions! The decisions\
    \ are controlled using conditionals.\n\n### Data Checking and Validation\n\nBefore\
    \ leveraging the power of conditionals, the strategies that are used to create\
    \ proper decision-making need to be covered. The raw values `true` and `false`\
    \ are not commonly used in conditionals. Instead, they are almost always computed\
    \ through other operations.\n\n### Equality Operators\n\nThe most common comparison\
    \ operation that will be made is checking if two values are identical or not identical.\n\
    \n#### QUALITY OPERATOR\n\nThe equality operator, denoted as a double equal sign,\
    \ checks if two values are identical.\n\n```javascript\n10 == 10; // true\n'pizza'\
    \ == 'pizza'; // true\n'pizza' == 'Pizza'; // false\nfalse == false; // true\n\
    ```\n\nReady for an unfun surprise? The equality operator will use type coercion\
    \ if possible.\n\n```javascript\n'10' == 10; // true\n```\n\nIt is recommended\
    \ to not use the equality operator. A different operator does a better job for\
    \ the same purpose.\n\n#### STRICT EQUALITY OPERATOR\n\nThe strict equality operator\
    \ is the equality operator’s more logical sibling, denoted as a triple equal sign.\
    \ It checks equality and never uses type coercion.\n\n```javascript\n10 === 10;\
    \ // true\n'pizza' === 'pizza'; // true\n'pizza' === 'Pizza'; // false\nfalse\
    \ === false; // true\n// no type coercion performed\n'10' === 10; // false\n```\n\
    \n#### INEQUALITY OPERATOR\n\nThe inequality operator, denoted as an exclamation\
    \ point and equal sign, checks if two values are not identical.\n\n```javascript\n\
    10 != 10; // false\n'pizza' != 'pizza'; // false\n'pizza' != 'Pizza'; // true\n\
    false != false; // false\n```\n\nJust like with the equality operator, the inequality\
    \ operator will use type coercion.\n\n```javascript\n'10' != 10; // false\n```\n\
    \n#### STRICT INEQUALITY OPERATOR\n\nThe strict inequality operator is the better\
    \ version of the inequality operator. Just like strict equality, strict inequality\
    \ does not perform any type coercion. Compared to regular inequality, it is the\
    \ safer bet for JavaScript code. Its syntax is denoted as an exclamation point\
    \ and double equal sign. Please use this instead of the regular inequality operator.\n\
    \n```javascript\n10 !== 10; // false\n'pizza' !== 'pizza'; // false\n'pizza' !==\
    \ 'Pizza'; // true\nfalse !== false; // false\n// no type coercion performed\n\
    '10' !== 10; // true\n```\n\n### Relational Operators\n\nIn the same way two values\
    \ can be checked for equality or inequality, values can be checked for whether\
    \ they are greater than or less than.\n\n#### LESS THAN OPERATORS\n\nTwo available\
    \ comparison operators are the less than operator and the less than or equal to\
    \ operator. They do exactly what they sound like. Numbers are compared numerically,\
    \ and strings are compared alphabetically. It is important to note that capitalization\
    \ matters,\n\n```javascript\n10 < 8; // false\n'a' < 'b'; // true\n'A' > 'a';\
    \ // false\n10 <= 8; // false\n```\n\n#### GREATER THAN OPERATORS\n\nThe greater\
    \ than operator and greater than or equal to operator share the same principles\
    \ as the less than operators, and capitalization still matters.\n\n```javascript\n\
    10 > 8; // true\n'a' > 'b'; // false\n'a' >= 'b'; // true\n```\n\n### Logical\
    \ Operators\n\nAside from basic equality operators, JavaScript provides special\
    \ operators that help create boolean values in complex situations. Many logical\
    \ operators and equality operators can be mixed and matched.\n\n#### OR OPERATOR\n\
    \nThe OR operator, denoted as double pipes, checks to see if either operation\
    \ is true.\n\n```javascript\ntrue || false; // true\nfalse || false; // false\n\
    false || true || false; // true\n```\n\n#### AND OPERATOR\n\nThe AND operator,\
    \ denoted as a double ampersand, checks to see if both operations output to true.\n\
    \n```javascript\ntrue && true; // true\ntrue && false; // false\nfalse && false;\
    \ // false\nfalse && true; // false\n```\n\n#### NOT OPERATOR\n\nIn programming,\
    \ there is also the concept of a NOT operator, denoted as an exclamation point\
    \ in front of a value. This operator is commonly referred to as the bang operator.\
    \ It flips the boolean value of the value it operated on.\n\n```javascript\n!true;\
    \ // false\n!false; // true\n```\n\n### Mix and Match Logical Operators and Equalities\n\
    \nThe keywords `true` and `false` are rarely used in code. Now that you have equality\
    \ operators and logical operators in your tool kit, you will see conditions that\
    \ range from simple to complex in code.\n\n```javascript\n// 1 is greater than\
    \ 10 OR 1 is equal to 0\n1 > 10 || 1 === 0; // false\n// 1 is less than 10 OR\
    \ 1 is equal to 0\n1 < 10 || 1 === 0; // true\n```\n\n### Data Validation\n\n\
    Checking if a value is undefined or null is easy.\n\n```javascript\nvar mySocialLife\
    \ = null;\nmySocialLife === null; // true\n```\n\nThe equality operator handles\
    \ it, because those data types have one possible value. But what about numbers,\
    \ strings, booleans, and arrays? What if you aren’t interested in the value of\
    \ the number? Perhaps you simply want to know whether or not it is a number? Luckily,\
    \ there are operators for these situations.\n\n#### TYPE OPERATOR\n\nThe `typeof`\
    \ operator outputs the variable’s data type, in the form of a string. This is\
    \ especially helpful when debugging code. Incorrect data types are a common source\
    \ of errors!\n\n```javascript\ntypeof 10; // 'number'\ntypeof ''; // 'string'\n\
    typeof undefined; // 'undefined'\ntypeof true; // 'boolean'\n```\n\nSimple stuff.\
    \ But let me throw a curveball at you.\n\n```javascript\ntypeof null; // 'object'—what????\n\
    ```\n\nHuh? Why doesn’t `typeof null` output the string null? It is debatable\
    \ as to whether this is a bug. But at the end of the day, it is incredibly unintuitive.\
    \ Instead, check for null using the equality operator.\n\n```javascript\nnull\
    \ === null // true\n```\n\n#### INSTANCE OPERATOR\n\nWhen checking whether an\
    \ item is an array, the `typeof` operator is very deceptive.\n\n```javascript\n\
    typeof []; // 'object'\n```\n\nThe underlying reason why the output is “object”\
    \ technically makes sense, but it is unhelpful and unintuitive. Array validation\
    \ can be properly performed using the `instanceof` operator.\n\n```javascript\n\
    [] instanceof Array; // true\n```\n"
