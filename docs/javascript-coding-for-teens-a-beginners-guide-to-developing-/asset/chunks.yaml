    \ = msg;\n};\n```\n\nThe first place this method will be used is inform the player\
    \ that a previously guessed key was pressed.\n\n### Keep Track of Guessed Characters\n\
    \nAfter the user types in a key that is a valid guess, the instance variable `this.charactersGuessed`\
    \ needs to be updated.\n\n```javascript\nHangman.prototype.addToCharactersGuessed\
    \ = function (char) {\n  this.charactersGuessed += char;\n};\n```\n\n### Insert\
    \ the Guessed Key on HTML\n\nUsing JavaScript, the guessed key can be inserted\
    \ onto the page. The div that will hold these guessed characters has the id `guessed-characters`.\n\
    \n```javascript\nHangman.prototype.appendGuessedCharacter = function (key) {\n\
    \  var guessedCharDiv = createDivWithText(key);\n  guessedCharDiv.classList.add('character');\n\
    \  var container = document.getElementById('guessed-characters');\n  container.append(guessedCharDiv);\n\
    };\n```\n\n### Check If the Guessed Key Is in the Secret Word\n\nThe function\
    \ `includes` makes this operation easy. Check if the guessed key has a matching\
    \ character in `this.secretWord`.\n\n```javascript\nHangman.prototype.correctGuess\
    \ = function (guessedKey) {\n  return includes(guessedKey, this.secretWord);\n\
    };\n```\n\nThis conditional allows you to make a branching decision between a\
    \ correct and an incorrect guess. A message can be printed for whether or not\
    \ the player correctly guessed.\n\n### Reveal the Correct Guessed Key\n\nIf the\
    \ player guessed a correct key, great! Remove the class `hidden` from that specific\
    \ character. Every secret character has to be checked to see if it is a match.\n\
    \n```javascript\nHangman.prototype.updateSecretCharacter = function (char) {\n\
    \  var allSecretChars = document.getElementsByClassName('secret-character');\n\
    \  for (var i = 0; i < allSecretChars.length; i++) {\n    var secretChar = allSecretChars[i];\n\
    \    if (char.toLowerCase() === secretChar.innerHTML.toLowerCase()) {\n      secretChar.classList.remove('hidden');\n\
    \    }\n  }\n};\n```\n\n### Add a Body Part to the Person\n\nIf the player guessed\
    \ incorrectly, they must be penalized for their foolishness. Express this visually\
    \ by adding a body part to the person. The instance variable `this.remainingBadGuesses`\
    \ also needs to be decremented.\n\nEach number in `this.remainingBadGuesses` will\
    \ correlate to a particular body part.\n\nA conditional chain is perfect here!\
    \ The process of revealing a body part is always the removal of the class `intact`.\
    \ The only thing that changes each time is the id of the HTML element. A helper\
    \ function that can be reused for all of the body parts can be written. This is\
