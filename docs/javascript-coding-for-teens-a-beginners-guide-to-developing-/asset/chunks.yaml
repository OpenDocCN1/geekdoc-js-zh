    Visual Studio Code”。将 `VS Code` 保存到桌面以便于查找。可以通过从搜索栏将其拖动到桌面来实现。


    # 使用代码编辑器


    了解如何有效地使用编程文本编辑器是一项重要技能。这些程序具有极高的可用深度。但你不需要学习太多的功能就能从中获得丰的价值。


    ## 代码编辑器：自动格式化


    如果你以前见过计算机代码，可能会注意到行与行之间有缩进和间距。结构很漂亮，对吧？代码通过空格和缩进构建结构以提高可读性。这有助于我们遵循逻辑顺序。


    ![Image 5](img/index-21_1.jpg)


    ### 骇客提示


    如果 `VS Code` 的颜色高亮在某些地方看起来很，说明存在语法错误。如果自动格式化的行间距看起来不一致，可能意味着缺少括号或大括号。


    ## 代码编辑器：红色波浪线


    不要忽略代码下方的红色波浪线。`VS Code` 凭借其出色的 JavaScript 支持，会对你的代码进行基础分析并对语法错误提供反馈。这些红色波浪线表示你的代码存在致命错误。`JavaScript`
    将无法理解你的意思并停止运行你的代码。这并不理想！


    如果你看到错误（由红色波浪线标记），将光标悬停其上，看看 `VS Code` 对此说了什么。有时，错误信息可能没有帮助。它可能是只有经验丰富的程序员才能理解的专业术语。但至少，它会告诉你出问题了。


    # 设置你的终端


    `VS Code` 有一个功能可以将你的命令行直接嵌入到文本编辑器中。要显示它，前往视图（View，位于屏幕顶部）-> 终端（Terminal）。Mac 用户不需要任何特殊操作，但
    Windows 用户需要进行微调。操作步骤包含在接下来的几页中。


    ## 仅限 Windows 的 VS Code 终端说明


    VS Code 使用的默认终端是 Windows 内置命令行。如前所述，该命令行较难使用，因此我们将使用 Git Bash。在通过终端（Terminal，位于屏幕顶部）->
    新终端（New Terminal）打开终端后，你将在右侧栏看到一个终端选择器。点击“选择默认 shell”（Select default shell）。


    ```

    ![Image 6](img/index-22_1.jpg)

    ```

    （注意：图片引用的文本穿插在指令中；我保持了文本指令的逻辑流）。


    ## 准备你的 JavaScript 文件夹


    在电脑中专门准备一个文件夹存放所有代码是有意义的。程序员称之为“工作目录”（working directory）。在文件系统的任何位置创建一个文件夹，最好是易于访问的，如桌面。所有包含代码的文件都将存在此文件夹中。


    要打开该文件夹，在 `VS Code` 中点击`文件`(File）然后`打开文件夹`(Open Folder）。找到你创建的文件夹并点击`选择文件夹`(Select
    Folder）。


    （注意：图片引用遵循文本流）。


    ## 安装 JavaScript 包


    许多算法很难编写，因此全世界的程序员相互共享代码，这样他们就不需要重复发明困难算法！它们被上传到名为 `npm`（Node 包管理器）的托管服务上，任何人都可以免费下载。安装包对用户来说是一个流畅的过程。在
    JavaScript 中，创建具有交互性的程序异常地复杂。在书中许多练习中，你将使用一个别人辛苦制作的包，名为 `readline-sync`。通过终端安装它的命令是：


    ```

    npm i readline-sync

    ```


    但等一下——在哪里输入这个？很简单：在屏幕的下半部分，“终端”（terminal）字样下方就是终端。在该区域，你可能会看到一个小白框。这就是你输入终端命令的地方。如果你没有看到窗口底部类似的界面，说明你没有打开
    `VS` 终端。


    ## 准备文件


    前往`文件`(File)->新建文件`(New File)，这将打开一个全新的空白文本文件供你编写代码。要保存文件，前往`文件`(File)->保存`(Save)。让我们试一下。当你第一次保存文件时，它会要求你命名。默认扩展名将是
    `.txt` 文件。但先不要保存，因为这是一个陷阱！


