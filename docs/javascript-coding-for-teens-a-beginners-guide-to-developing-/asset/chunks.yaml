    \ 1 | 4 > 0 | [10, 20, 12, 30] |\n| 3 | 2 | 3 > 0 | [10, 20, 12] |\n| 4 | 3 |\
    \ 2 > 0 | [10, 20] |\n| 5 | 4 | 1 > 0 | [10] |\n\n### 7. 下列代码的输出是什么？如有必要，画一个表格。\n\
    \n| 迭代 | I | 条件 | NEWSTR |\n| :--- | :--- | :--- | :--- |\n| 1 | 0 | 0 < 6 | 'a'\
    \ |\n| 2 | 1 | 1 < 6 | 'ab' |\n| 3 | 2 | 2 < 6 | 'abc' |\n| 4 | 3 | 3 < 6 | 'abcd'\
    \ |\n| 5 | 4 | 4 < 6 | 'abcde' |\n| 6 | 5 | 5 < 6 | 'abcdef' |\n\n### 8. 用你自己的话描述这个函数的目的。这个函数正在检查\
    \ `actualName` 中的每个字符是否存在于 `allUserGuesses` 中。如果 `currChar` 不存在于所有玩家猜测的字符串中，我们立即知道游戏还没有结束，可以停止循环。\n\
    \n### 9. `count` 的值是多少？\n\n`count` 的值为 2。\n\n# 第 8 章答案\n\n### 1. 定义什么是对象数据结构。\n\
    \n对象数据结构是一种可以包含任意数量值的数据类型。它们以键值对的形式存储在内部。\n\n### 2. 在面向对象编程中，定义什么是对象。\n\n对象是一个内部包含数据和函数的实体。它是设计代码的一种方式，以便更容易理解和推理。\n\
    \n### 3. 什么变量在所有方法中都可用？\n\n实例变量作为键值对赋值给 `this` 在对象的所有方法中都是可用的。\n\n### 4. 在内部调用另一个方法的语法是什么？\n\
    \n是 `this.methodName()`。\n\n### 5. 制作构造函数的语法是什么？\n\n函数可以作为构造函数来初始化对象实例。\n\n###\
    \ 6. 什么是对象实例？\n\n对象实例是对象的唯一实体。它单独持有源于其他实例的所有数据。\n\n### 7. 初始化对象实例的语法是什么？\n\n在函数调用前使用\
    \ `new` 关键字会创建一个对象实例。\n\n### ChatProgram.prototype.parseMessageEntry\n\n消息对象中没有\
    \ `chat` 键。聊天记录中的文本在 `message` 键中。\n\n"
