- fmt: '

    The hardest programming language to learn is the first one you pick up. The high-level
    concepts don’t change across languages, and the way they interact with a computer
    is, for the most part, universal.


    Big dreams start small. It’s important to begin building your tool kit of programming
    knowledge with the fundamentals. So, let’s take a look at some fundamental programming
    language that will be discussed within this book.


    ## VARIABLES

    Keeping track of data and huge lines of logic is a major challenge for a programmer,
    but there is a strategy to help you remember: Variables! `Variables` are used
    to associate names with data, and then refer back to them as needed. In practice,
    variables can be used for much more—but for now, all you need to know is that
    a variable is the concept of naming a piece of data so that it may be referred
    to later.


    ## DATA TYPES

    Multiple data types and data structures exist. A computer needs to know many different
    things before it starts doing all the heavy lifting for you. Are you trying to
    combine text or do math? Text and numbers are examples of data types. More advanced
    data types will be covered in this book, too.


    ## DATA STRUCTURES

    Data structures are containers for data. Data structures can hold one piece of
    data or millions of pieces. They are incredibly flexible and among the most powerful
    concepts in programming. Multiple types of data structures exist (such as `arrays`),
    and you will learn how to use the most basic ones.


    ## CONDITIONAL STATEMENTS

    To accommodate many situations in one particular set of code, it can have branching
    behavior: “If this animal is a dog, then feed it chicken, but if this animal is
    a bird, feed it seeds.”


    One statement handles two situations’ possible outcomes. Using proper code can
    help make these kinds of decisions. In programming, the initial decision (that
    is, if the animal is a dog) is called a conditional statement.


    ## LOOPS

    Have you ever performed an activity that was repetitive and almost always the
    same each time? The computer version of that is called a loop. A loop is the process
    of automatically performing a set of operations repeatedly for as long as you
    tell it to.


    ## Words to Know

    As with any industry, programmers have their own lingo. Let’s look at a few key
    words that will help you along the way.


    ### ALGORITHM

    An algorithm is a sequence of logical instructions that lead to a result or output.


    Computers aren’t the only things that use algorithms. Humans think in algorithms,
    too. Anything that is considered an “instruction” based on a set of rules is an
    algorithm.


    Algorithms come in all shapes, sizes, and difficulties. Humans are pretty flexible
    when it comes to instructions and have the unique power of critical thinking.
    This ability lets you fill in any incomplete or bad instructions using your past
    experiences.


    But a computer has no critical thinking skills. It must be programmed. When computers
    receive instructions, they must be spoon-fed every detail. Even small deviations
    from your original intent could result in your algorithm stopping or doing something
    unexpected. These types of errors could have catastrophic consequences.


    ### SYNTAX

    All forms of written communication follow rules on how to structure words and
    statements. These rules are referred to as `syntax`. Some examples of syntax in
    the English language include:


    - End sentences with a period, exclamation point, or question mark.

    - Use “an” instead of “a” when the next word starts with a vowel.

    - Spell words correctly.

    - Use words according to their proper definition.


    Programming languages have these types of rules, too. All programming languages
    have rigid structures that must be adhered to. But they take this demand for proper
    syntax to an extreme. Any single syntax rule violation will cause a program to
    break and fail to continue running. Thankfully, syntaxes for programming languages
    are easy to learn. The real challenge is to not make mistakes when writing it,
    or you’ll have some debugging work ahead of you.


    ### ABSTRACTION

    Abstraction is the process of creating something that can perform a function or
    task, while hiding the details of how it does so. The concept of abstraction is
    not unique to code.


    The world revolves around abstractions. Do you need to have a degree in electrical
    engineering in order to use a computer? Do you need to know how to assemble a
    car from scratch in order to get a driver’s license? The abstraction mantra is:
    “I don’t need to know how it works. I only need to know how to use it.”


    As your code grows in size, the need to hide unnecessary details from other parts
    of your code becomes important. There are multiple ways to create abstractions,
    and this book will equip you with the basic strategies.


    ### PSEUDO CODE

    There are two components to solving a programming challenge:


    1. Have the correct way of thinking about the problem.

    2. Implement the logic with no inconsistencies and no syntax errors.


    Some problems are so challenging that a programmer does not want to solve both
    of those components at once. Instead, they figure out the correct way of thinking
    and write it down in plain English. This is referred to as `pseudo code`. After
    a programmer is confident that their line of reasoning will work, they implement
    it in real code. This book will use a lot of pseudo code. It’ll help you when
    new concepts are introduced or when you are asked to solve challenging problems.


    ![Image 4](index-17_1.jpg)


    ## CHAPTER 2: JavaScript: Setting Up

    Before starting on your exploration of JavaScript, you will need to set up your
    computer to run code. This chapter will provide step-by-step instructions for
    Windows and macOS computers. Make sure you get everything working before you continue
    to the next chapters. The rest of this book relies on it!


    ## Coding Programs

    You will use three different programs to code in JavaScript. Installation directions
    for each program will vary between PCs and Macs, so be sure to follow the directions
    for your operating system.


    ### COMMAND LINE (GIT BASH FOR WINDOWS, TERMINAL FOR MACOS)

    Programmers don’t always work with nice point-and-click visual interfaces, such
    as your web browser. Oftentimes, you will need to type in text-based commands.
    It’s nothing special. Just like running a program by pointing and clicking on
    an icon, you can type text-based instructions into a command line to perform operations.


    ### TEXT EDITOR (VS CODE)

    Programming is often very complex. Fortunately, very smart programmers have built
    incredible tools to help us be more productive, catch mistakes early, and read
    code easily. Programming text editors are programs that were designed completely
    around programming. They’re kind of like Notepad, only better in every single
    way. They have smart features like autocomplete suggestions, color-code important
    text, autosave, and powerful shortcuts. We’re going to use Visual Studio Code,
    or `VS Code`. It’s one of the most popular free editors out there and has very
    good JavaScript support tools.


    ### JAVASCRIPT RUNTIME (NODE.JS)

    A command line is just a platform for performing computer operations. It does
    not have the ability to run JavaScript in its default state. We need to install
    another program, called `Node.js`, in order to run JavaScript code on our command
    line. We call the execution process of JavaScript code `runtime`.


    ### DOWNLOADING METHODS

    The most reliable way to find a website to download these programs is through
    a search engine. The best search terms are provided here. The most recent links
    (as of this writing) are also provided if you want to access the sites directly.

