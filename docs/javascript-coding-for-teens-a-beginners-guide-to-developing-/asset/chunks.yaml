    你正在使用 JavaScript。你必须给它 JavaScript 文件扩展名，即 `.js`。只要你使用了正确的文件扩展名 `.js`，它的名字可以是任何的。但我建议使用
    `index.js`。


    ![Image 11](img/index-24_1.jpg)


    ## 双检


    确保你已经在 VS Code 中打开了文件夹。VS Code 的终端（terminal）会自动指向你文件夹的目录。在终端中查找并运行代码最简单的方法，就是让它已经指向你文件所在的目录。要进行双检，请输入命令
    `ls`（顺便说一下，那是小写的 L）。它将打印出当前目录下所有的文件和文件夹。你应该能在终端输出中看到你的文件 `index.js`。


    ## 编写你的第一行代码


    现在你已经装备准备好运行一些 JavaScript 了！但在运行任何代码之前，你必须先编写它。


    ### CONSOLE.LOG


    我们将不断使用名为 `console.log` 的东西。`console.log` 获取括号内的内容并将其打印到命令行中。在现阶段，你不需要理解 `console.log`
    背后的底层机制。我们只是在这里为了确认你的计算机已准备好编写 JavaScript！


    ### 让我们写一些 JavaScript 吧！


    我们现在保持简单，只写一个 `console.log`。将此内容输入到 VS Code 中的文件中，但先不要按回车。完成后将文件保存为 `.js` 文件。


    ```

    console.log(''salutations terra!'');

    ```


    ### 让我们运行一些 JavaScript 吧！


    在命令行上运行命令的语法始终如下：


    `[command] [parameters]`


    Node.js 是你的运行环境。命令是 `node`，参数是文件名。


    ```bash

    node index.js

    ```


    恭喜！你正式运行了你的第一段代码。


    ## Bug（错误）


    编写一个算法就像写一篇说服性文章。算法是一段文字，其逻辑流通向正确的结论。你将根据以下标准进行评分：


    1. 回答：你的文章得出了结论。

    2. 语法：没有违反任何语言规则。

    3. 充分的论证：你整篇文章的推理是合逻辑的。


    编写代码有相似的要求：


    1. 回答：你拥有预期的行为。

    2. 语法：正确的 JavaScript 语法。

    3. 充分的论证：你算法的逻辑序列无无可击的。


    老师在评分方面往往很和蔼，或者至少很灵活。计算机是无情的。以下是计算机如何为你的代码评分的：


    1. 非预期行为？部分得分，但仍然不及格分。

    2. 语法错误？运行时错误。0/100。

    3. 算法中某一个错误？运行时错误。0/100。


    编写代码时你需要满分。任何偏差都意味着你的代码中存在一个或多个缺陷。我们将这些缺陷称为 **bugs**。如果你想要那个及格分，你就需要找到它们。


    专业程序员创建的程序包含难以置信的代码。这些被称为代码库（codebases）。bugs 喜欢隐藏在成千上万（甚至百万）行代码的缝隙中。这是一项艰苦的工作，但程序员努力编写无
    bug 的代码。


    ### 黑客提示


    感到精疲力竭了吗？休息 15 分钟。你会带着更清醒的头脑回来，并比你想象的更早发现 bug。


    ### Bug 可能会令人沮丧


    当你开始编写代码时，你会写很多不完善的代码。你第一次会错，第二次会错，也许第二十十次还会错。但关于 bug 最重要的部分是不要让它们影响你的情绪。即使是专业程序员也会感到沮丧。这都是学习过程的一部分，所以不要放弃！


    ![Image 12](img/index-27_1.jpg)


    ## 第 3 章：变量与数据类型


    为了有效地编码，理解 JavaScript 为你提供的基础工具箱至关重要。在本章中，你将学习在编写代码时用于表示概念的各种数据类型。你还将学习程序员用来跟踪这些数据的策略。程序员组织代码的方式也非常重要。这让我们才能够有效地读懂彼此的代码。


    ### 代码结构


    编程语言对于应该如何编写有基准规则。在你动手之前，让我们先过一遍这些规则。这只是一个关于 JavaScript 代码如何结构的高级概述。不需要考虑每一行的内容。


    #### 语句 (STATEMENTS)


    语句是一个执行动作的表达式。语句通常写在单行。


    ```javascript

    console.log(''I am a statement'');

    var statement = ''I am another statement'';

    ```


    #### 分号 (SEMICOLONS)


    你注意到分号了吗？每个语句末尾应该有一个分号。JavaScript 有一些小巧的方法在你忘记时自动修复自己，但它很挑剔且容易出错。稳妥起见，养成自己始终添加分号的习惯。在某些情况下，语句末尾的分号是非法语法。我将在后续过程中解释这些情况。


    #### 注释 (COMMENTS)


    有时程序员想要写一些不应该执行的文本，比如给自己的备注。注释是在文件中编写信息的方式，这些信息在代码运行时会被忽略。你可以出于任何原因编写任何你想的内容。复杂的算法可能会变得棘手，注释是帮助解释代码正在做什么的方法之一。语法是在前面添加双斜杠。


    ```javascript

    // 这里的内容不会被执行

    console.log(''I am a statement'');

    ```


    #### 缩进 (INDENTATIONS)


    你会注意到某些行有缩进。这是有意的，但在技术上是可选的。程序员为了可读性进行缩进。当你编写更多代码时，就会开始理解规则。


    ### 变量 (Variables)


    机器人还没有接管世界，所以我假设你读者是人类。对于人类来说，名字的概念是一种标识。正如你我有不同的名字来互相记录一样，编程中的名称被用来识别和跟踪数据。这些名称被称为变量。


    #### 声明 (DECLARATION)


    将数据关联变量是一个两步过程。第一步是声明变量。声明的过程是告诉 JavaScript 准备一个变量。特殊单词 `var` 告诉 JavaScript 应该声明变量。


    ```javascript

    var aHumanName;

    ```


    #### 赋值 (ASSIGNMENT)


    将数据关联变量是赋值。一旦变量被声明，就不需要再次声明。赋值通过等号运算符执行。


    ```javascript

    aHumanName = ''Andrew'';

    ```


    #### 一个语句中的赋值与声明 (ASSIGNMENT AND DECLARATION IN ONE STATEMENT)


    声明和赋值是两个不同的概念，但它们通常在一个语句中完成。


    ```javascript

    var aHumanName = ''Andrew'';

    ```


    #### 数据重新赋值 (DATA REASSIGNMENT)


    变量也可以重新赋予不同的值。重新赋值对于后续的话题很重要。


    ```javascript

    var aHumanName = ''Andrew'';

    aHumanName = ''Charlie'';

    ```


    #### 使用变量评估语句 (EVALUATING STATEMENTS WITH VARIABLES)


    每当使用变量时，JavaScript 都会提取变量关联的数据并替换它的位置。


    ```javascript

    var myBirthYear = 1990;

    var currentYear = 2021;

    // 等同于 2021 - 1990

    currentYear - myBirthYear;

    ```


    #### 关键字不能作为变量 (KEYWORDS CAN’T BE VARIABLES)


    单词 `var` 是 JavaScript 中关键字的一个示例。它的用法始终意味着“变量声明”。它会忽略任何其他意图，并且不能作为变量名。


    ```javascript

    // 将产生运行时错误！期待变量声明

    var var = 2021;

    ```


    你刚刚看到的这段代码是请求声明一个无内容的声明，并为数字 2021 赋值。困惑吗？JavaScript 也是。

