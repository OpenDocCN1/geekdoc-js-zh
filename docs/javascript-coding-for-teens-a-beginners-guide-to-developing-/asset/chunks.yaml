  trans: "\n\n为了获得更好的用户体验，可以在 `textarea` 上使用 `focus` 方法，这样在点击编辑按钮后，光标会立即跳转到 `textarea`。现在就开始测试一下吧！它应该变成一个可编辑的\
    \ HTML 元素。\n\n```javascript\nfunction createEditButton() {\nvar editButton = document.createElement('span');\n\
    editButton.innerHTML = 'edit';\neditButton.classList.add('edit-button');\neditButton.addEventListener('click',\
    \ function () {\nvar parentDiv = getParentDiv(editButton);\n![Image 85](img/index-174_1.jpg)\n\
    var originalText = getTodoText(parentDiv);\nvar currentHTMLHeight = getHtmlElementHeight(parentDiv);\
    \ \nvar editingTextArea = createEditableTextAreaWithHeight (originalText, currentHTMLHeight);\n\
    destroyInnerContent(parentDiv);\nparentDiv.append(editingTextArea);\nvar updateButton\
    \ = createUpdateButton();\nvar cancelButton = createCancelButton(originalText);\n\
    parentDiv.append(updateButton);\nparentDiv.append(cancelButton);\neditingTextArea.focus();\n\
    });\nreturn editButton;\n}\n```\n\n## 在编辑后更新文本\n\n看起来你的待办事项条神奇地变成了一个可编辑元素。但如果一个\
    \ `textarea` 没有能力恢复到不可编辑状态，它又有什么用呢？让我们使用 `createUpdateButton` 函数添加一个更新按钮。目前，按钮什么都没做。添加一个事件监听器来改变这一点。在销毁\
    \ textarea HTML 元素之前，将内部文本保存到变量变量中。\n\n```javascript\nfunction createUpdateButton()\
    \ {\nvar updateButton = document.createElement('div');\nupdateButton.innerHTML\
    \ = 'update';\nupdateButton.classList.add('update-button');\nupdateButton.addEventListener('click',\
    \ function () {\nvar parentDiv = getParentDiv(updateButton);\nvar updatedText\
    \ = getTodoText(parentDiv);\n});\nreturn updateButton;\n}\n```\n\n现在你准备好操作页面上的\
    \ HTML 了。销毁 `textarea`，用内部的文本重新创建不可编辑的待办事项，并将其插入到之前 textarea 所在的精确的位置。非常酷！\n\n\
    ```javascript\nfunction createUpdateButton() {\nvar updateButton = document.createElement('div');\n\
    updateButton.innerHTML = 'update';\nupdateButton.classList.add('update-button');\n\
    updateButton.addEventListener('click', function () {\nvar parentDiv = getParentDiv(updateButton);\n\
    var updatedText = getTodoText(parentDiv);\ndestroyInnerContent(parentDiv);\nvar\
    \ textDiv = createTextDiv(updatedText);\nvar closeButton = createCloseButton();\n\
    var editButton = createEditButton();\nparentDiv.append(textDiv);\nparentDiv.append(closeButton);\n\
    parentDiv.append(editButton);\n});\nreturn updateButton;\n}\n```\n\n## 取消文本更新\n\
    \n但如果用户改变主意并想要取消更新呢？你需要一个按钮。这个网站已经有一个名为 `createCancelButton` 的函数。你需要为它添加行为。这意味着是添加另一个事件监听器了！\n\
    \n当点击取消时，文本需要恢复到原始状态。但用户开始在 `textarea` 中输入时，你会丢失文本值。如何解决这个问题呢？\n\n你需要发挥一点创意！这次给\
    \ `createCancelButton` 添加一个参数。这个参数将在函数内部存储原始文本。\n\n```javascript\nfunction createCancelButton(originalText)\
    \ {\nvar cancelButton = document.createElement('div');\ncancelButton.innerHTML\
    \ = 'cancel';\ncancelButton.classList.add('cancel-button');\nreturn cancelButton;\n\
    }\n```\n\n当取消按钮被点击时，事件监听器将销毁 `textarea`，创建不可编辑的 div，并重新插入之前保存的文本。尝试你改进后的待办事项列表。\n\
    \n```javascript\nfunction createCancelButton(originalText) {\nvar cancelButton\
    \ = document.createElement('div');\ncancelButton.innerHTML = 'cancel';\ncancelButton.classList.add('cancel-button');\n\
    cancelButton.addEventListener('click', function () {\nvar parentDiv = getParentDiv(cancelButton);\n\
    destroyInnerContent(parentDiv);\nvar textDiv = createTextDiv(originalText);\n\
    var closeButton = createCloseButton();\nvar editButton = createEditButton();\n\
    parentDiv.append(textDiv);\nparentDiv.append(closeButton);\nparentDiv.append(editButton);\n\
    });\nreturn cancelButton;\n}\n```\n\n## 恭喜！\n\n你已经成功掌握了 JavaScript 的基础！这本书从最原始的基础开始，缓慢而坚定地让你学习了足够构建\
    \ JavaScript 游戏和网站的知识。书中有些非常有挑战性的章节，我祝贺你到达了终点！\n\n话虽如此，你的旅程并没有此结束。书中涵盖的基础知识只是冰山一角。我希望你在读这本书的过程中，像我写这本书时一样开心！我热爱编程，真诚地希望你在未来几年里继续提升你的编码员技能。\n\
    \n## 答案页\n\n### 第 3 章答案\n\n### 破解密码 (CRACK THE CODE)\n\n### 1. 注释什么时候有用？\n注释可以用于很多情况。它们可以解释代码在做什么、编写算法的目的以及一般的自我备注。\n\
    \n### 2. 声明和赋值有什么区别？\n声明是准备一个变量。赋值是将部分数据与它相关联。\n\n### 3. `var` 单词可以作为变量名吗？为什么可以或为什么不行？\n\
    不可以，因为它是保留关键字。\n\n### 4. 本章涵盖了哪些关键字？\n涵盖了：`var`、`true`、`false`、`null`、`undefined`。\n\
    \n### 5. 自增运算符和赋值运算符的主要区别是什么？\n自增运算符不需要赋值。赋值是重新赋值。\n\n### 6. 如何访问数组中的值？\n通过它们在数组中的数字位置（从\
    \ 0 开始）访问。这是通过括号运算符实现的。\n\n### 7. 如何访问对象中的值？\n通过它们的键名使用点运算符或括号运算符访问。如果使用括号运算符，键名必须是字符串。\n\
    \n### 8. 访问数组不存在的索引会输出什么？\n输出 `undefined`。\n\n### 9. 访问对象不存在的键会输出什么？\n输出 `undefined`。\n\
    \n### 10. 什么时候访问对象的值时必须使用括号表示而不是点运算符？\n当使用变量作为键名时，必须使用括号表示。\n\n### 调试 (DEBUGGING)\n\
    \n### 1. 尽管变量进行了自增，但值似乎没有变化。\n自增不应该赋值。\n```javascript\nvar num = 0;\nnum++;\n\
    console.log(num); // 1\n```\n\n### 2. 两个数字相加不起正常。\n其中一个数字是字符串。两者都必须是 `number`\
    \ 类型。\n```javascript\nvar num1 = 10;\nvar num2 = 2;\nconsole.log(num1 + num2);\
    \ // 12\n```\n\n### 3. 尝试使用键 `pug` 访问你的狗的名字 `Max` 输出了 `undefined`。\n使用变量作为键时，必须使用括号表示。\n\
    ```javascript\nvar dogs = {\npug: 'Max',\nterrier: 'Appa'\n};\nvar myDog = 'pug';\n\
    console.log(dogs[myDog]); // 'Max'\n```\n\n### 4. 访问数组的最后一个元素输了 `undefined`。\n\
    索引 3 超出了数组范围。对于数组，索引从 0 开始。\n```javascript\nvar meanPeople = ['Layna', 'Layna\
    \ again', 'Layna one more time'];\nconsole.log(meanPeople[2]); // 'Layna one more\
    \ time'\n```\n"
- fmt: "\n## [5.](#index_split_000.html_p41) A fatal runtime error is occuring when\
    \ trying to print this string.\n\nThere is an apostrophe in the middle of the\
    \ intended message: `Layna’s`. JavaScript thinks that the string ends there, causing\
    \ a runtime error. The escape operator is needed to have a quote in the middle\
    \ of the string.\n\n```\nconsole.log('Layna\\'s favorite hobby is being mean to\
    \ Andrew');\n```\n\n## [Chapter 4 Solutions](#index_split_000.html_p8)\n\n###\
    \ CRACK THE CODE\n\n### [1.](#index_split_000.html_p50) What is the difference\
    \ between equality operators and strict equality operators?\n\nThe equality operators\
    \ will use type coercion if the data types are different. Strict equality never\
    \ uses type coercion.\n\n### [2.](#index_split_000.html_p50) What data types can\
    \ the `typeof` operator properly check?\n\nThe `typeof` operator can be used on\
    \ strings, numbers, `null`, `undefined`, and booleans. The `typeof` operator cannot\
    \ be used to check arrays and objects.\n\n### [3.](#index_split_000.html_p50)\
    \ What data type uses the `instanceof` operator for proper checking?\n\nThe `instanceof`\
    \ operator can be used to check if a data type is an array.\n\n### [4.](#index_split_000.html_p51)\
    \ What is the output of the following code?\n\n`false`, because `true && false`\
    \ evaluates to `false` and the right–hand side is already false.\n\n### [5.](#index_split_000.html_p51)\
    \ What is the output of the following code?\n\n`true`, because `!false` evaluates\
    \ to `true`. The right-hand side evaluates to `false`, but the OR operator (double\
    \ pipes) only requires one of the sides to be true.\n\n### [6.](#index_split_000.html_p51)\
    \ Why is `array[index] !== undefined` an effective way of checking to see if that\
    \ index exists inside an array?\n\nIf an index does not exist in an array that\
    \ is attempted to be accessed, the output will be `undefined`.\n\n## DEBUGGING\n\
    \n### [1.](#index_split_000.html_p51) The code is saying that the array is an\
    \ object.\n\nThe `typeof` operator cannot be used to check if an item is an array.\
    \ The `instanceof` operator has to be used.\n\n```javascript\nvar item = [];\n\
    \nif (item instanceof Array) {\n  console.log('I am an array');\n} else {\n  console.log('I\
    \ am not an array');\n}\n```\n\n### [2.](#index_split_000.html_p51) Super Italian\
    \ Bros Two has won Dr. Donkey’s “Game of the Year” award more than 10 times in\
    \ a row. It definitely is a masterpiece. But the code is saying otherwise.\n\n\
    In the `if` conditional, the value comparator is the wrong one. It should be greater\
    \ than, `>`, not less than, `<`.\n\n```javascript\nvar game = 'superItalianBrosTwo';\n\
    \nif (donkeysGameScores[game] > 95) {\n  console.log(game + ' is a masterpiece');\n\
    } else {\n  console.log(game + ' is not a masterpiece');\n}\n// superItalianBrosTwo\
    \ is a masterpiece\n```\n\n### [3.](#index_split_000.html_p51) I consider a game\
    \ to be a mediocre game if the score is anywhere between 30 and 80. The Last Defender\
    \ was a mediocre game. But it was not a bad one. Hint: Writing out complex conditions\
    \ in plain English helps!\n\nIn the `else if` condition, the left-hand side of\
