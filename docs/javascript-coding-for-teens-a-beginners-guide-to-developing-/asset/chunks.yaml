    a value in an object, instead of the dot operator?


    [Debugging](#index_split_000.html_p6)


    When debugging code, it can be helpful to place the code in a file and run it
    in the command line. You will get real-time feedback on your answer.


    [1.](#index_split_001.html_p178) The variable doesn’t seem to change in value,
    despite the fact that it is being incremented.


    var num = 0;


    num = num++; // increment num


    console.log(num); // 0


    [2.](#index_split_001.html_p178) Adding two numbers together isn’t working properly.


    var num1 = 10;


    var num2 = ''2'';


    console.log(num1 + num2); // ‘102’


    [3.](#index_split_001.html_p178) Trying to access your dog’s name “Max” by using
    the key “pug” is outputting undefined.


    var dogs = {


    pug: ''Max'',


    terrier: ''Appa''


    };


    var myDog = ''pug'';


    console.log(dogs.myDog); // undefined


    [4.](#index_split_001.html_p178) An attempt to access the last entry in the array
    is outputting undefined.


    var meanPeople = [''Layna'', ''Layna again'', ''Layna one more time'']; console.log(meanPeople[3]);
    // undefined


    [5.](#index_split_001.html_p178) A fatal runtime error is occurring when trying
    to print this string.


    console.log(''Layna''s favorite hobby is being mean to Andrew''); //


    Uncaught SyntaxError: missing ) after argument list


    [CODER’S CHECKLIST » Let’s review the topics we covered](#index_split_000.html_p6)


    Let’s take a quick minute to review what was covered in this chapter. An understanding
    of arrays and data types are especially important.


    ❏ Data types


    ❏ Type coercion


    ❏ Data structures—arrays and objects


    ❏ Accessing data within data structures


    ![Image 20](index-42_1.jpg)


    [CHAPTER 4](#index_split_000.html_p6)


    Conditionals


    Computers operate in very logical ways. Some of a computer’s favorite answers
    are “yes” and “no.” In computer terms, this is the equivalent of


    “true” and “false.” The ability to discern between true and false is an incredible
    strength. It means a computer can decide what code should run depending on the
    situation. This also means that one program can do many things and make its own
    decisions! The decisions are controlled using conditionals.


    [Data Checking and Validation](#index_split_000.html_p6)


    Before leveraging the power of conditionals, the strategies that are used to create
    proper decision-making need to be covered. The raw values true and false are not
    commonly used in conditionals. Instead, they are almost always computed through
    other operations.


    [Equality Operators](#index_split_000.html_p6)


    The most common comparison operation that will be made is checking if two values
    are identical or not identical.


    EQUALITY OPERATOR


    The equality operator, denoted as a double equal sign, checks if two values are
    identical.


    10 == 10; // true


    ''pizza'' == ''pizza''; // true


    ''pizza'' == ''Pizza''; // false


    false == false; // true


    Ready for an unfun surprise? The equality operator will use type coercion if possible.


    ''10'' == 10; // true


    It is recommended to not use the equality operator. A different operator does
    a better job for the same purpose.


    STRICT EQUALITY OPERATOR


    The strict equality operator is the equality operator’s more logical sibling,
    denoted as a


    triple equal sign. It checks equality and never uses type coercion.


    10 === 10; // true


    ''pizza'' === ''pizza''; // true


    ''pizza'' === ''Pizza''; // false


    false === false; // true


    // no type coercion performed


    ''10'' === 10; // false


    INEQUALITY OPERATOR


    The inequality operator, denoted as an exclamation point and equal sign, checks
    if two values are not identical.


    10 != 10; // false


    ''pizza'' != ''pizza''; // false


    ''pizza'' != ''Pizza''; // true


    false != false; // false


    Just like with the equality operator, the inequality operator will use type coercion.


    ''10'' != 10; // false


    STRICT INEQUALITY OPERATOR


    The strict inequality operator is the better version of the inequality operator.
    Just like strict equality, strict inequality does not perform any type coercion.
    Compared to regular inequality, it is the safer bet for JavaScript code. Its syntax
    is denoted as an exclamation point and double equal sign. Please use this instead
    of the regular inequality operator.


    10 !== 10; // false


    ''pizza'' !== ''pizza''; // false


    ''pizza'' !== ''Pizza''; // true


    false !== false; // false


    // no type coercion performed


    ''10'' !== 10; // true


    [Relational Operators](#index_split_000.html_p6)


    In the same way two values can be checked for equality or inequality, values can
    be checked for whether they are greater than or less than.


    LESS THAN OPERATORS


    Two available comparison operators are the less than operator and the less than
    or equal to operator. They do exactly what they sound like. Numbers are compared
    numerically, and strings are compared alphabetically. It is important to note
    that capitalization matters,


    10 < 8; // false


    ''a'' < ''b''; // true


    ''A'' > ''a''; // false


    10 <= 8; // false


    GREATER THAN OPERATORS


    The greater than operator and greater than or equal to operator share the same
    principles as the less than operators, and capitalization still matters.


    10 > 8; // true


    ''a'' > ''b''; // false


    ''a'' >= ''b''; // true


    [Logical Operators](#index_split_000.html_p6)


    Aside from basic equality operators, JavaScript provides special operators that
    help create boolean values in complex situations. Many logical operators and equality
    operators can be mixed and matched.


    OR OPERATOR


    The OR operator, denoted as double pipes, checks to see if either operation is
    true.


    true || false; // true


    false || false; // false


    false || true || false; // true


    AND OPERATOR


    The AND operator, denoted as a double ampersand, checks to see if both operations
    output to true.


    true && true; // true


    true && false; // false


    false && false; // false


    false && true && false; // false


    NOT OPERATOR


    In programming, there is also the concept of a NOT operator, denoted as an exclamation
    point in front of a value. This operator is commonly referred to as the bang operator.
    It flips the boolean value of the value it is operated on.


    !true; // false


    !false; // true


    [Mix and Match Logical Operators and Equalities](#index_split_000.html_p6)


    The keywords true and false are rarely used in code. Now that you have equality


    comparator operators and logical operators in your tool kit, you will see conditions
    that range from simple to complex in code.


    // 1 is greater than 10 OR 1 is equal to 0


    1 > 10 || 1 === 0; // false


    // 1 is less than 10 OR 1 is equal to 0


    1 < 10 || 1 === 0; // true


    [Data Validation](#index_split_000.html_p6)


    Checking if a value is undefined or null is easy.


    var mySocialLife = null;


    mySocialLife === null; // true


    The equality operator handles it, because those data types have one possible value.


    But what about numbers, strings, booleans, and arrays? What if you aren’t interested
    in the value of the number? Perhaps you simply want to know whether or not it
    is a number. Luckily, there are operators for these situations.


    TYPEOF OPERATOR


    The typeof operator outputs the variable’s data type, in the form of a string.
    This is especially helpful when debugging code. Incorrect data types are a common
    source of errors!


    typeof 10; // ''number''


    typeof ''''; // ''string''


    typeof undefined; // ''undefined''


    typeof true; // ''boolean''


    Simple stuff. But let me throw a curveball at you.


    typeof null; // ''object''—what????


    Huh? Why doesn’t typeof null output the string null? It is debatable as to whether
    this is a bug. But at the end of the day, it is incredibly unintuitive. Instead,
    check for null using the equality operator.


    null === null // true


    INSTANCEOF OPERATOR


    When checking whether an item is an array, the typeof operator is very deceptive.


    typeof []; // ''object''


    The underlying reason why the output is “object” technically makes sense, but
    it is unhelpful and unintuitive. Array validation can be properly performed using
    the instanceof operator.


    [] instanceof Array; // true'
