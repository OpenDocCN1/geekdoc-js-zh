- fmt: '

    Syntax highlighting and VS Code error recommendations will usually protect you
    from accidentally using keywords as variables. But sometimes the error is not
    straightforward. The only thing that is guaranteed is that something in your code
    is wrong.


    # VARIABLE NAME CONVENTION


    Programmers like to keep the structure of variables consistent. This is commonly
    referred to as convention. JavaScript convention for variable names is `camelCase`:
    Lowercase for the first word, with all subsequent words capitalized—get the reference
    to the hump in the middle?


    ```javascript

    // accepted camelCase convention

    var currentYear = 2021;

    ```


    ```javascript

    // will not break in runtime but it would be better if you did not

    var current_year = 2021;


    // we are no longer friends

    var xXx_CuRrEnTyEaR_xXx = 2021;

    ```


    Later on, we will use different conventions for specific topics. For now, always
    use `camelCase`.


    ## Data Types (#index_split_000.html_p5)


    Now that you know how variables work, it is time to learn about the types of data
    that can be assigned to them.


    ### NUMBER


    Numbers follow basic arithmetic rules. Order of operations is: parentheses, exponents,
    multiplication, division, addition, and then subtraction.


    ```javascript

    10 + 20; // 30

    20 * 10; // 200

    (20 + 3) * 10; // 230 - respects order of operations

    ```


    ### INCREMENT OPERATOR


    In programming, increasing or decreasing the value of a variable by 1 is a common
    operation, so there is a shorthand for it. Use double-plus and double-minus operators
    to increment and decrement, respectively.


    ```javascript

    var num = 1;

    num++; // num is now 2

    num--; // num is now back to 1

    ```


    #### Never Assign an Increment Statement


    Be careful not to assign when incrementing, because the value of the variable
    won’t change if you do. Unexpected behavior will occur.


    ```javascript

    var num = 1;

    num++; // good!

    num = num++; // no! bad!

    ```


    ### SELF-OPERATING MATH SHORTHAND


    Performing math on a variable and then reassigning the previous value is another
    common thing to do. Programmers have a shorthand for it. An umbrella term for
    these operators is arithmetic assignment. It is a math operator and assign operator
    joined into a single operator.


    ```javascript

    var num = 1;

    num += 2; // same as num = num + 2

    num; // 3


    var num = 1;

    num *= 3; // works the same way for multiplication and division

    num; // 3

    ```


    ### NAN: NOT A NUMBER


    Numbers seem easy, right? Well, it’s time to talk about the dark side of numbers.


    There is a special number type that is not a number. Yes, you read that correctly.
    It’s a number that represents something that is not a number. Its name is `NaN`,
    which stands for “Not a Number.”


    `NaN` is a keyword in a numeric value. Math can be performed on it. Any math attempted
    on `NaN` will compute to `NaN`.


    ```javascript

    NaN * 10; // NaN

    ```


    How does one get `NaN` to begin with? In order to do so, you have to do something
    mathematically illogical.


    ```javascript

    10 / ''dog''; // NaN

    ```


    What is “10 divided by dog”? JavaScript considers this nonsense to be `NaN`.


    ## Strings (#index_split_000.html_p5)


    A collection of characters is referred to as a string. Think of it as a “string
    of characters.”


    Creating a string is simple. You simply have to wrap text in quotes. Double and
    single quotes both work to develop strings.


    ```javascript

    // both valid strings

    "dog";

    ''dog'';

    ```


    ### STRING CONCATENATION


    JavaScript has a lot of clever tricks up its sleeve when it comes to modifying
    strings. But for now, the only thing you need to know is that strings can be combined
    with the addition operator. The concept of combining strings is called concatenation,
    or `concat` for short. Any number of strings can be combined using the plus operator.


    ```javascript

    ''one '' + ''two''; // ''one two''

    ''one '' + ''two'' + ''three'' + ''four''; // ''one two three''

    ```


    Notice the empty space at the end of all the strings except the last one? That’s
    because spaces are characters, too. They are needed to separate words when performing
    concatenation.


    ### SELF-OPERATING STRING CONCATENATION SHORTHAND


    In the same way that math is commonly computed and reassigned to the same variable,
    strings are concatenated and reassigned as well. Technically, a string is also
    called the addition assignment. The addition assignment operator can be used for
    both.


    ```javascript

    var numWords = ''one two''; // ''one two''

    numWords += ''three four'';

    numWords; // ''one two three four''

    ```


    ### ESCAPE CHARACTERS


    Wrapping text in quotes indicates a string. But what if you want a quote inside
    a string?


    ```javascript

    ''hello, my dog''s name is Suzy''; // runtime error

    ```


    JavaScript is reading this as a string that stops at dog. The apostrophe in “dog’s”
    throws it off. The subsequent text is interpreted as nonsense code and will break
    in runtime. In order to express that the apostrophe in “dog’s” should be part
    of the string, we need to escape it. This is accomplished using the backslash
    operator.


    ```javascript

    ''hello, my dog\''s name is Suzy''; // much better

    ```


    ### NUMBERS AND STRINGS: THE DIFFERENCE


    A string is considered text. In that sense, we can have a string that looks like
    a number, but actually is not. The number ten (10) and a string comprising a “1”
    and a “0” (“10”) are interpreted differently. Numbers can have math operated on
    them. But the concept of mathematical operations on text does not make real-world
    sense, right?


    ```javascript

    10; // the number ten

    ''10''; // text with two characters: 1 and 0

    ```


    ## Boolean (#index_split_000.html_p5)


    Simply put, a boolean is a data type that is either the keyword `true` or `false`.
    Their respective keywords mean exactly what you think.


    ```javascript

    // boolean keywords

    true;

    false;

    ```


    Data checking is the most common way to attain a boolean value. We’ll do lots
    of data checking when we learn about conditionals. For now, just know that the
    keywords `true` and `false` exist.


    ## null (#index_split_000.html_p5)


    Sometimes you want to express the idea of “nothing.” This is where the keyword
    `null` comes into play. It literally means “nothing.”


    ```javascript

    // keyword null

    null;

    ```


    ## undefined (#index_split_000.html_p5)


    Another keyword that loosely represents nothing is `undefined`. More specifically,
    it represents “something that has not been assigned a value.”


    ```javascript

    // keyword undefined

    undefined;

    ```


    So far, the only way we have discussed how to get the value `undefined` is by
    declaring a variable.


    ```javascript

    var aName; // undefined

    ```


    ## Type Coercion (#index_split_000.html_p5)


    Dear reader, I’m so sorry, but I cannot live this lie anymore. You can, in fact,
    perform math with mixes of numbers—sometimes.


    ```javascript

    // the number 30 minus the string ''20'' equals the number 10

    30 - ''20''; // 10


    // if it is addition, string concatenation takes priority over addition

    30 + ''20''; // ''3020''


    // null coerces to 0

    10 + null; // 10

    ```


    ### CONFUSING TYPE COERCION


    Some may consider this a strong opinion, but I find type coercion to be the embodiment
    of the saying “Just because you can doesn’t mean you should.”


    Many of the rules behind type coercion, to be blunt, are absolutely ridiculous.
    Let’s look at an example of what I mean. Below is a noncomprehensive list of examples
    that will melt your brain if you try and write thousands of lines of code heavily
    reliant on type coercion.


    ```javascript

    // conversion to a number -> string using type coercion

    '''' + 10; // ''10''

    ```

