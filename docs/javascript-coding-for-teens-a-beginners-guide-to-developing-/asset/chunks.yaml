  trans: "\n以下是本章你学到的内容。\n\n- 等于比较运算符\n- 逻辑运算符\n- 使用 `typeof` 和 `instanceof` 运算符进行数据验证\n\
    - `if` ... `else if` ... `else` 条件语句\n\n![Image 23](img/index-53_1.jpg)\n\n# 第\
    \ 5 章：循环\n\n循环是编程世界中最强大的概念之一。循环是你告诉计算机根据需要重复一组操作的方法。\n\n## 为什么要使用循环？\n\n当你不知道执行某项操作的次数，但知道什么时候应该停止时，就会使用循环。\n\
    \n人类的思维方式也是循环的——你只是没有意识到而已！停下来思考一下你是如何数钱的。想象打开你的钱包或钱包。现在，想象里面有现金。你会如何计算总金额？\n\n\
    与计算机打交道的核心在于理解操作背后的规则。\n\n为了方便起见，让我们写下数钱涉及的规则：\n1. 收集好你的钞票。\n2. 逐一检查每张钞票。\n3.\
    \ 在继续计数的同时，在脑中跟踪总额。一张一张累加金额。\n4. 在检查完所有钞票后停止计数。\n\n最后一条规则是最重要的理解。在你的一生中，你的钱包里出现过多少张钞票？昨天你有五张钞票。那么为什么规则不是“数五张后停止”呢？因为钞票的数量无法保证是某个特定的数字。所以你不能用一个具体的数字作为规则。为了灵活性并让规则适应任何数量的钞票，你只能规定何时停止计数。\n\
    \n一旦你学会了 `while` 和 `for` 循环，你就可以使用计算机可以理解的逻辑来编写代码。\n\n## While 循环\n\n`while` 循环是\
    \ JavaScript 中的一种循环类型。\n\n```javascript\nwhile (condition) {\n\n}\n```\n\n`while`\
    \ 循环会一直重复，直到条件求值为假。\n\n### 停止循环\n\n循环中的条件也被称为循环的终止条件。通过刻意让循环走向一个假值来停止循环。一旦值变为假，循环将结束，循环下方的代码将继续执行。\n\
    \n### 循环逻辑\n\n数钱的规则可以帮助理解逻辑。但现在你需要找出计算机实际上可以执行的操作。\n\n首先，准备一个装满钞票的钱包。但 JavaScript\
    \ 中不存在“钱包”这个概念。相反，你将有一个钞票数组。\n\n检查钱包后，你看到两张 1 元的、一张 5 元的、一张 10 元的和一张 20 元的。所以，你的钞票数组看起来如下。\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\n```\n\n这里变得有点复杂了。作为程序员，我们需要使用计算机的规则。这需要一点创造力。你可以这样修改：\n\
    1. 创建一个钞票数组。\n2. 通过索引访问数组中每个项的值。\n3. 创建一个变量来累加数组中每个项的值。\n4. 创建一个变量，用于通过索引获取数组中的每个项。每处理一张钞票后递增。\n\
    5. 只要索引变量仍在数组范围内，就继续重复。\n\n### 迭代\n\n在计数之前，写一个循环打印出每张钞票。同时验证索引。\n\n### 准备工作\n\n\
    准备钞票数组并声明从 0 开始的索引。\n\n```javascript\n// 钞票数组\nvar bills = [1, 1, 5, 10, 20];\n\
    \n// 用于访问数组值的索引\nvar index = 0;\n```\n\n### 终止条件：length 属性\n\n还记得之前关于 `length`\
    \ 属性的讨论吗？它是魔法的关键。`length` 的数值会根据数组的大小而变化，不需要你做额外工作就能告诉你数组有多大。\n\n```javascript\n\
    bills.length; // 5\n```\n\n当循环运行时，`index` 和数组的 `length` 进行比较。只要 `index` 小于数组的\
    \ `length`，意味着循环仍在数组范围内。\n\n```javascript\n// 终止条件\nindex < bills.length;\n```\n\
    \n当 `index < bills.length` 继续为真时，循环应该继续。\n\n```javascript\n// 钞票数组\nvar bills\
    \ = [1, 1, 5, 10, 20];\n\n// 访问数组值\nvar index = 0;\n\n// 终止条件\nwhile (index <\
    \ bills.length) {\n    // 递增索引直到遇到终止条件\n    index++;\n}\n```\n\n现在你有一个会终止的循环。但在解决你的原始问题之前，使用\
    \ `console.log` 语句来确认运行正常。\n\n```javascript\n\n// 钞票数组\nvar bills = [1, 1, 5,\
    \ 10, 20];\n\n// 访问数组值\nvar index = 0;\n\n// 终止条件\nwhile (index < bills.length)\
    \ {\n    var currentBill = bills[index];\n    var indexPrint = '正在处理索引' + index;\n\
    \    console.log(indexPrint);\n    var printedBill = '当前处理的是 $' + currentBill\
    \ + '!';\n    console.log(printedBill);\n}\n```\n\n将此代码放入文件并运行。\n\n![Image 24](img/index-57_1.jpg)\n\
    \n非常好！循环按预期工作。\n\n### 理解每次迭代\n\n引用循环的常用词是迭代。理解循环的最佳方法之一是在每次迭代确定变量的值。随着编程能力的成熟，在脑中进行这种“体操”会变得容易，但有一个可视化表示总是好的。当循环继续运行时，写一个表格来跟踪所有的值。\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index = 0;\n\nwhile (index\
    \ < bills.length) {\n    console.log(bills[index]);\n    index++;\n}\n```\n\n\
    | 迭代 | 索引 | 条件 | BILLS[INDEX] | BILLS |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | 0 | 0 < 5 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 | 1 < 5 | 1 | [1, 1, 5, 10,\
    \ 20] |\n| 3 | 2 | 2 < 5 | 5 | [1, 1, 5, 10, 20] |\n| 4 | 3 | 3 < 5 | 10 | [1,\
    \ 1, 5, 10, 20] |\n| 5 | 4 | 4 < 5 | 20 | [1, 1, 5, 10, 20] |\n\n在尝试第 6 次迭代之前，代码检查\
    \ `5 < 5`，结果为假。它停止运行，循环下方的代码最终执行。\n\n# For 循环\n\n`while` 循环是进入循环很好的起点，但 `for`\
    \ 循环更常用。它用简洁的语法涵盖了常见的情况。\n\n### 结构\n\n语法如下。\n\n```javascript\nfor (initialization;\
    \ condition; after) {\n}\n```\n\n1. `Initialization`：在任何迭代之前执行的操作。只执行一次。\n2. `condition`：在下一次迭代之前检查的终止条件。\n\
    3. `after`：在迭代后执行的操作。在每次迭代后执行。\n\n### WHILE 循环 VS FOR 循环语法\n\n让我们用伪代码重新回顾在 `while`\
    \ 循环遍历数组的策略。\n\n```\n初始化索引\nwhile (index 小于 array.length) {\n    递增索引\n}\n```\n\
    \n1. 初始化跟踪索引变量\n2. 终止条件\n3. 递增索引\n\n`for` 循环获取这些操作并将它们压缩到一行中。每个操作之间用分号分隔。\n\n\
    ```javascript\nfor (初始化索引; index 小于 array.length; 递增索引) {\n}\n```\n\n之前的 `while`\
    \ 循环示例可以写成 `for` 循环。\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\nvar index\
    \ = 0;\n\nwhile (index < bills.length) {\n    console.log(bills[index]);\n   \
    \ index++;\n}\n```\n\n它们是一样的，只是更短。\n\n```javascript\nvar bills = [1, 1, 5, 10,\
    \ 20];\n\nfor (var index = 0; index < bills.length; index++) {\n    console.log(bills[index]);\n\
    }\n```\n\n### 循环修改关键字\n\n在某些算法中，跳过当前迭代的后续操作并移动到下一次迭代，或者直接离开循环是有意义的。\n\n### CONTINUE\n\
    \n一旦找到 `continue` 语句，当前迭代将停止并进入下一次迭代。让我们更改提示词，以便在解决方案中使用 `continue`。\n\n"
- fmt: "\nOnly print bills that are $5 or greater. How would that be expressed in\
    \ code?\n\n```\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index <\
    \ bills.length; index++) {\n  if (bills[index] >= 5) {\n    console.log(bills[index]);\n\
    \  }\n}\n```\n\nSimple stuff. But you can use a `continue` statement to solve\
    \ the same challenge.\n\nThis is what the pseudo code would look like.\n\n```\n\
    for (loop over each bill) {\n  if the bill is less than 5 dollars, skip everything\
    \ beneath this statement\n  print the bill\n}\n```\n\nIf the iteration stops when\
    \ the bill is less than $5, it is implied that the bill won’t be printed. In real\
    \ code, it would look like this.\n\n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\
    \nfor (var index = 0; index < bills.length; index++) {\n  // if the bill is less\
    \ than 5 dollars\n  if (bills[index] < 5) {\n    // skip\n    continue;\n  }\n\
    \  console.log(bills[index]);\n}\n```\n\nThe output is as expected. The first\
    \ two values in the array are ignored because they are less than 5. The loop never\
    \ operates `console.log` because the `continue` statement inside the conditional\
    \ prematurely stops the iteration.\n\n![Image 25](index-60_1.jpg)\n\n![Image 26](index-60_2.jpg)\n\
    \n## BREAK\n\nThe keyword `continue` skips the subsequent operations inside a\
    \ loop. But what if you want to cancel the loop completely? A `break` statement\
    \ stops the current iteration in the same way `continue` does. But `break` goes\
    \ even further and stops all subsequent iterations, too!\n\nNow, change the prompt\
    \ one more time. If you see a $5 bill, stop printing. This can be done without\
    \ a `break` statement. But using one makes the algorithm easier to understand.\n\
    \n```\nfor (loop over each bill) {\n  if the bill is equal to 5 dollars, exit\
    \ loop\n  print the bill\n}\n```\n\nIn real code, it would look like this.\n\n\
    ```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index < bills.length;\
    \ index++) {\n  // if the bill is 5 dollars\n  if (bills[index] === 5) {\n   \
    \ // exit loop completely\n    break;\n  }\n  console.log(bills[index]);\n}\n\
    ```\n\nExcellent! Just what you would expect. Once the code sees a 5, the loop\
    \ stops.\n\n## Loops in Action\n\nSo far, you have spent the entire time making\
    \ sure you understand how to cycle through all the bills in the array. It’s time\
    \ to solve the original prompt: Count the total amount in your wallet!\n\n###\
    \ HACKER HINT\n\nIf your computer slows down when running a JavaScript file, force\
    \ quit. The loop is endlessly running because it is never meeting its terminating\
    \ condition. The keyboard command `ctrl + z` will force quit the operation. Worst\
    \ case scenario, close VS Code.\n\n### LOOP\n\nRevisiting your previous code,\
    \ no behavior inside. But the loop is prepared to iterate over the array of bills.\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var i = 0; i < bills.length;\
    \ i++) {\n\n}\n```\n\nThe variable `index` is shortened to `i`. This is the common\
    \ variable name when tracking index in a loop.\n\nIn order to track the amount\
    \ of money, a variable is needed. The value will start at 0, because your loop\
    \ has not counted any money yet.\n\n```javascript\nvar total = 0;\n```\n\nThis\
    \ type of variable is commonly referred to as an accumulator. It will progressively\
    \ increase in value after every iteration of our loop. It “accumulates” value\
    \ after each bill is visited.\n\nPutting it all together, the value of each bill\
    \ by index increases the value of `total`, the accumulator.\n\n```javascript\n\
    var bills = [1, 1, 5, 10, 20];\nvar total = 0;\n\nfor (var i = 0; i < bills.length;\
    \ i++) {\n  var currentValue = bills[i];\n  total += currentValue;\n}\n\nconsole.log(total);\n\
    ```\n\nTo make sure you have a full understanding of what is happening, let’s\
    \ create another table that represents each iteration.\n\n### ITERATION\n\n| I\
    \ | CONDITION | CURRENTVALUE | TOTAL | BILLS |\n| :--- | :--- | :--- | :--- |\
    \ :--- |\n| 1 | 0 < 5 | 1 | 1 | [1, 1, 5, 10, 20] |\n| 2 | 1 < 5 | 1 | 2 | [1,\
    \ 1, 5, 10, 20] |\n| 3 | 2 < 5 | 5 | 7 | [1, 1, 5, 10, 20] |\n| 4 | 3 < 5 | 10\
    \ | 17 | [1, 1, 5, 10, 20] |\n| 5 | 4 < 5 | 20 | 37 | [1, 1, 5, 10, 20] |\n\n\
    ## Crack the Code\n\nSome very important concepts have been introduced in this\
    \ chapter. Before moving on, make sure you have full confidence in your answers\
    \ to the following questions. This is important, because moving forward, loops\
    \ will be used extensively.\n\n1. Why is a terminating condition important when\
    \ working with loops?\n2. When iterating over an array, `i` is initialized to\
    \ 0. What is its purpose?\n3. When iterating over an array, `i` is initialized\
    \ to 0. What is its purpose?\n4. Write a table for the following loop.\n5. Write\
    \ a table for the following loop.\n6. Write a table for the following loop.\n"
