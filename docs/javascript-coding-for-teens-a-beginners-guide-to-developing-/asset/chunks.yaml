    \ set up by the author of this book!\n\nLet’s use your understanding of how JavaScript\
    \ can be used, in conjunction with HTML, to implement the missing features.\n\n\
    ## [Helper Functions]()\n\nA few helper functions have been prepared for convenience.\n\
    \n### DESTROYINNERCONTENT\n\nThis function removes all HTML elements that are\
    \ inside it.\n\n```javascript\nfunction destroyInnerContent(htmlElement) {\n\n\
    \  htmlElement.innerHTML = '';\n}\n```\n\n### GETPARENTDIV\n\nThis function will\
    \ get the parent element of a particular HTML element. This will be used when\
    \ you want to have HTML destroy itself.\n\n```javascript\nfunction getParentDiv(htmlElement)\
    \ {\n\n  return htmlElement.parentElement;\n}\n```\n\n### GETHTMLELEMENTHEIGHT\n\
    \nThis function will get the height of the HTML element. This will be used to\
    \ manually change the height of HTML elements.\n\n```javascript\nfunction getHtmlElementHeight(htmlElement)\
    \ {\n\n  return htmlElement.offsetHeight;\n}\n```\n\n### GETTODOTEXT\n\nThis function’s\
    \ parameter is the to-do entry div and will extract the text inside.\n\n```javascript\n\
    function getTodoText(parentDiv) {\n\nvar editableTodo = parentDiv.getElementsByClassName('editing-todo');\n\
    var nonEditableTodo = parentDiv.getElementsByClassName('todo'); if (editableTodo[0]\
    \ !== undefined) {\n\n  return editableTodo[0].value;\n\n} else {\n\n  return\
    \ nonEditableTodo[0].innerHTML;\n\n}\n\n}\n```\n\n## [Deleting a To-Do Entry]()\n\
    \nWhen the close icon is clicked, it would make perfect sense to have the entry\
    \ be deleted, right? Let’s do that. First, inspect how the close button is made.\
    \ The function is called `createCloseButton`. Right now, the only thing this function\
    \ is doing is creating a close button. But there is no behavior associated with\
    \ it! It’s time to add an event listener.\n\nIn order to remove a to-do entry,\
    \ we need a variable that points to the parent of the close button. In the process\
    \ of removing the parent from the page, this will destroy all of the content inside.\
    \ Easy peasy, right?\n\n```javascript\nfunction createCloseButton() {\n\n  var\
    \ closeButton = document.createElement('span');\n  closeButton.innerHTML = 'x';\n\
    \  closeButton.classList.add('close-button');\n  closeButton.addEventListener('click',\
    \ function () {\n\n    var parentDiv = getParentDiv(closeButton);\n    parentDiv.remove();\n\
    \n  });\n\n  return closeButton;\n}\n```\n\n## [Editing a To-Do Entry]()\n\nAre\
    \ you ready for hard mode? This time, you will add the ability to update an existing\
    \ to-do entry.\n\nIn order to accomplish this, you have to get clever about how\
    \ you manipulate the HTML.\n\n### CREATE EDITABLE TEXT\n\nCurrently, to-do entries\
    \ exist as characters on the page, which can’t be manipulated by a visitor to\
    \ the page. But there is a special type of HTML called `textarea` that creates\
    \ a textbox for users to type into.\n\nWhat if you were to destroy the HTML that\
    \ is holding the text, immediately insert the textarea in the same spot, insert\
    \ the previous text into the textarea, and then style the textarea in the exact\
    \ way? Wouldn’t it look like the div was somehow converted into a textarea?\n\n\
    Inside the `createEditButton` function, a click event listener is needed. This\
    \ is where things get very tricky!\n\nFirst, create the textarea. There already\
    \ is a function for that, called `createEditableTextAreaWithHeight`, which takes\
    \ two arguments. One is the text to pre-insert into the textarea. The other is\
    \ the height of HTML element. In order to make it look like it magically changed\
    \ to a textarea, the height of the textarea needs to be the same as the HTML element\
    \ it is replacing.\n\n```javascript\nfunction createEditButton() {\n\n  var editButton\
    \ = document.createElement('span');\n  editButton.innerHTML = 'edit';\n  editButton.classList.add('edit-button');\n\
    \  editButton.addEventListener('click', function () {\n\n    var parentDiv = getParentDiv(editButton);\n\
    \    var originalText = getTodoText(parentDiv);\n    var currentHTMLHeight = getHtmlElementHeight(parentDiv);\
    \ var editingTextArea =\n\n    createEditableTextAreaWithHeight(originalText,\n\
    \n    currentHTMLHeight);\n\n  });\n\n  return editButton;\n}\n```\n\nAfter setting\
    \ that up, the div with the uneditable text needs to be destroyed. Append the\
    \ newly created textarea. The create and update buttons now need to be recreated\
    \ and inserted into the page.\n"
