    test('createHint #1', createHint('charlie', 'chle'), 'c h _ _ l _ e ');\ntest('createHint\
    \ #2', createHint('cat', ''), '_ _ _ ');\ntest('createHint #3', createHint('cat',\
    \ 'a'), '_ a _ ');\n\n### correctlyGuessed\n\n这个函数正在检查 `actualName` 中的每个字符是否存在于\
