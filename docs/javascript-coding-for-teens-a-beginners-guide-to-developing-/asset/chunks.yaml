    to output a value that is exposed outside of the function?


    The keyword return is required.


    [3.](#index_split_000.html_p78) What does a function output if there is no explicit
    return?


    A function with no return keyword outputs undefined.


    [4.](#index_split_000.html_p78) What is scope?


    Scope is the rules of variable availability within code.


    [5.](#index_split_000.html_p78) What type of scope does JavaScript use? In your
    own words, explain what it is.


    JavaScript uses lexical scoping. Variables that are declared inside a function
    are available within that function and functions inside it. Variables are never
    available outside of the function it is declared in.


