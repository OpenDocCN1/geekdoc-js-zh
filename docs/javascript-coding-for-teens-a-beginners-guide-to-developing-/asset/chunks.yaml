    2. 文本编辑器：`VS Code`

    3. JavaScript 运行时：`Node.js`


    ## Git Bash


    PC 自带了命令行界面，但用起来可能比较困难。相反，我建议使用名为 `Git Bash` 的第三方应用程序。


    搜索引擎查询：`Git bash windows download`


    当前 URL：[gitforwindows.org](http://gitforwindows.org)


    安装过程不需要任何特殊配置。在安装设置向导运行时，继续保持所有默认配置。


    ## VS Code


    搜索引擎查询：`Visual studio code windows download`


    当前 URL：[code.visualstudio.com/download](http://code.visualstudio.com/download)


    当你下载 `VS Code` 时，点击所有提示框中的“下一步”进行安装，但在“选择附加任务”（Select Additional Tasks）提示中，点击“创建桌面图标以在桌面上创建快速访问方式”。


    ## Node.js


    搜索引擎查询：`Node js for windows download`


    当前 URL：[nodejs.org/en/download](http://nodejs.org/en/download)


    安装期间保留所有默认配置。


    注意：在完成 `Node.js` 安装后，重启 `VS Code` 以及任何已打开的 `Git Bash` 窗口。可以使用快捷键 `alt + F4` 完成。或者，在
    `VS Code` 窗口的右上角点击“x”图标关闭它。


    # Mac 环境搭建


    如果已有 `.pkg` 下载，请使用那一个。这是最简单的安装方法。只需双击，它就会自动安装。`.app` 需要拖动到“应用程序”（Applications）文件夹。双击
    `.app` 文件将出现一个窗口，要求你拖放该文件。


    ## 终端


    Mac 自带了一个强大且易于使用的命令行，被称为“终端”（terminal）。不需要安装 `Git Bash`。


    我们只需要安装两个应用程序：


    1. 文本编辑器：`VS Code`

    2. JavaScript 运行时：`Node.js`


