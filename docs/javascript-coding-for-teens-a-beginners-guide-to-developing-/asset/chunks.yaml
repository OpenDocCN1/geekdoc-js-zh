  trans: "\n函数具有多个方面，使其对程序员非常有用。它们是编程的核心部分。在解决问题时，它们将是你首要考虑的工具之一。困难的编程挑战变得变得可以应对。几乎不可能的挑战可以变成现实。\n\
    \n## 代码复用\n\n`console.log` 在使用后就会被销毁吗？绝对没有！函数可以根据你的需要使用任意的次数。通常，当程序员看到两种相同的操作时，他们会想出策略来减少需要重复编写的代码量。函数就是实现这一目标的首选策略。\n\
    \n## 抽象\n\n如果剥开 `console.log` 的外壳并让你看到它的实现方式，你会看到极其复杂的内容。`console.log` 是一个极好的抽象。它用一个简单的命令执行了复杂的运算。一些程序员付出了巨大的努力才实现了\
    \ `console.log`，让世界以简单的方式使用它。\n\n## 解决巨大挑战\n\n主流程序复杂得令人望而畏。人类的大脑无法在脑中理出复杂问题的整个解决方案。相反，你的大脑会将大挑战分解成许多较小的挑战。你一个一个地解决每个小挑战并将其封装。然后，你将所有这些小的解决方案组合起来以解决当前的问题。函数非常适合这一点。\n\
    \n## 函数创建\n\n声明函数有两种方式。这两种方式非常相似，你不需要太担心它们之间的细微差别。但作为一名 JavaScript 程序员，你将根据情况使用这两种方式。\n\
    \n### 函数声明\n\n第一种语法是使用 `function` 关键字，并在其后跟上名称。分号是可选的。这种声明风格几乎被专门使用。\n\n```javascript\n\
    function functionNameOfYourChoosing() {\n  // 在此处编写代码\n}\n```\n\n### 函数表达式\n\n\
    第二种语法是使用 `var` 声明将 `function` 关键字赋值给变量。建议加上分号。这种声明风格仅在进行面向对象编程时使用。\n\n```javascript\n\
    var functionNameOfYourChoosing = function () {\n  // 在此处编写代码\n};\n```\n\n## 函数调用\n\
    \n函数名末后的括号会运行其内部的操作。正式术语是调用（invoke）。这种语法对于两种类型的函数声明都是相同的。\n\n```javascript\nfunctionNameOfYourChoosing();\n\
    ```\n\n## 返回语句\n\n在原生情况下，函数不会向外部世界暴露它计算的数据。\n\n```javascript\nfunction add() {\n\
    \  var computed = 5 + 5;\n}\n\nadd(); // undefined\n```\n\n那是因为你没有告诉 JavaScript\
    \ 你想要它！通过使用 `return` 关键字，函数可以暴露一段数据。\n\n```javascript\nfunction add() {\n  var\
    \ computed = 5 + 5;\n  return computed\n}\n\nadd(); // 10\n```\n\n## 函数参数\n\n\
    在上一个示例中，`add` 函数只能将 5 和 5 相加。如果你可以接受任何两个数字并将它们加在一起，不是更好吗？这就是参数发挥作用的地方。\n\n参数是预备的变量。这使得函数能够适应许多情况。\n\
    \n```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n```\n\n\
    你告诉 JavaScript 在调用期间可以传入两个变量，`num1` 和 `num2`。有了参数，这个 `add` 函数就可以处理任何数字。\n\n```javascript\n\
    add(10, 5); // 15\nadd(20, 30); // 50\n```\n\n### 使用 Return 提前终止\n\n`return` 关键字实际上同时承担两个作用：\n\
    \n1. 它从函数输出一个值。\n2. 它停止函数的执行。\n\n你可能会发现自己不想在某个特定点之后执行代码，或者想做一个决定并停止所有后续操作。\n\n\
    ### 极客提示\n\n当你看到一个重复但值不同的算法时，考虑将该操作转换为带有参数的函数。\n\n### 保护 add 免受类型转换\n\n让我们完善你的\
    \ `add` 函数并保护它免受错误输入的影响。记得类型转换和 `+` 运算符吗？\n\n```javascript\nfunction add(num1,\
    \ num2) {\n  return num1 + num2;\n}\n\nadd('10', '5'); // '105'\nadd(20, '30');\
    \ // '2030'\n```\n\n你的加法函数可以进行字符串拼接。但你总是想要相加，至少尝试尝试。让我们用提前返回来保护它。如果使用的数据不是数字，函数应该返回\
    \ `NaN`。\n\n```javascript\nfunction add(num1, num2) {\n  // 如果 num1 不是数字 或者 num2\
    \ 不是数字\n  if (typeof num1 !== 'number' || typeof num2 !== 'number') {\n    return\
    \ NaN;\n  }\n  return num1 + num2;\n}\n\nadd('10', 5); // 'NaN'\nadd(20, '30');\
    \ // 'NaN'\n```\n\n使用提前返回，你保护了函数免受类型转换或其他任何错误输入的影响。\n\n## 作用域\n\n现在是讨论使用函数时变量可用性的好时机。在编码术语中，变量可用性被称为作用域（scope）。此后将大量编写函数。了解你需要的特定数据在代码的特定区域是否可用很重要。\n\
    \n### VAR: 函数作用域\n\n声明的位置现在很重要了。在函数内部声明的变量仅在函数内部可用。\n\n这段代码将产生意外之外的行为：\n\n```javascript\n\
    function sampleFunc() {\n  var innerVariable = '我仅在该函数中可用';\n  console.log(innerVariable);\n\
    }\n\nfunction otherSampleFunc() {\n  console.log(innerVariable);\n}\n\nsampleFunc();\n\
    otherSampleFunc();\n```\n\n运行 `otherSampleFunc()` 时发生错误。这是 JavaScript 实现作用域的结果。\n\
    \n### 词法作用域\n\n不同的编程语言在作用域方面有自己的规则。JavaScript 使用词法作用域（lexical scope）。词法作用域是指变量在其内部及其内部作用域可用，但在外部作用域不可用。让我们来看例子。\n\
    \n#### 嵌套函数\n\n函数可以写在其他函数内部！这创建了两层作用域。一个是内部作用域，另一个是外部作用域。\n\n在外部作用域声明的变量在任何内部作用域中都可用。\n\
    \n```javascript\nfunction outerScopeFunc() {\n  var outerVar = '我是外部作用域的！我在两个作用域中存在';\n\
    \  function innerScopeFunc() {\n    console.log(outerVar);\n  }\n  innerScopeFunc();\n\
    }\n\nouterScopeFunc();\n```\n\n但内部作用域在它们上方的作用域中不可用。\n\n```javascript\nfunction\
    \ outerScopeFunc() {\n  function innerScopeFunc() {\n    var innerVar = '我是内部作用域的！我只在这里存在';\n\
    \  }\n  console.log(innerVar);\n}\n\nouterScopeFunc();\n```\n\n理解作用域是编写函数的关键。有时变量在需要的地方可用，反之亦然。始终注意作用域。\n\
    \n## 电竞选手表现\n\n使用函数让你能够以优雅的方式解决困难挑战。让我们在解决问题的能力上迈出一大步！Electro 是来自 Undersea（一款热门电脑游戏）的全球顶尖电竞队。他们在全球舞台上拥有优异的记录。凭借丰富的才华选手阵容，他们会轮换谁上场，谁坐替补席。\n\
    \n### 选手参赛了吗？\n\n你的第一个挑战是检查选手在比赛中的参赛情况。这个函数应该能够处理任何选手和任何比赛结果。它们必须是参数。我们将函数命名为\
    \ `playedInTournament`，并将参数命名为 `tournament` 和 `player`。\n\n```javascript\nfunction\
    \ playedInTournament(tournament, player) {\n\n}\n```\n\n在此练习中，`tournament` 参数将具有以下结构。它是一个只有一个键\
    \ `players` 的对象数据结构。与键关联的值是一个玩家名称数组。\n\n```javascript\n{\n  players: ['smirk',\
    \ 'knight', 'fly']\n};\n```\n"
- fmt: "\nNow you need to find if a player has played in a tournament. There is a\
    \ `players` key in the object. The goal is to check if that player exists in the\
    \ array. Immediately, you\n\n![Image 31](index-72_1.jpg)\n\nknow a for loop is\
    \ needed. The array is nested in the object, so it must be accessed by its key\
    \ name, `players`. There also needs to be a check if the player has played in\
    \ the game. Thinking in programming terms, this needs an `if` condition.\n\n```javascript\n\
    function playedInTournament(tournament, player) {\n\n  var players = tournament.players;\n\
    \n  for (var i = 0; i < players.length; i++) {\n\n    var currentPlayer = players[i];\n\
    \n    if (currentPlayer === player) {\n\n    }\n  }\n\n}\n```\n\nIf the `currentPlayer`\
    \ is the player to check, return `true`. But when should `false` be returned?\
    \ If the check has exhausted all players in the array, that implies the player\
    \ has not been found at all. At the very end of the function, return `false`.\n\
    \n```javascript\n// tournament.js\n\nfunction playedInTournament(tournament, player)\
    \ {\n\n  var players = tournament.players;\n\n  for (var i = 0; i < players.length;\
    \ i++) {\n\n    var currentPlayer = players[i];\n\n    if (currentPlayer === player)\
    \ {\n\n      return true;\n\n    }\n  }\n\n  return false;\n\n}\n```\n\nIt’s time\
    \ to validate the code. To do so, you will need a `console.log` in order to have\
    \ the data from the function appear in the terminal. I named the file `tournament.js`.\n\
    \n```javascript\nvar sampleTournament = {\n\n  win: true,\n\n  players: ['smirk',\
    \ 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament, 'smirk'));\
    \ console.log(playedInTournament(sampleTournament, 'superb'));\n```\n\nLooks good!\
    \ In the `sampleTournament` object, `smirk` played but `superb` did not.\n\nRemove\
    \ the two `console.log` statements and the data structure `sampleTournament` from\
    \ the file. Moving forward, they will not be necessary.\n\n### HACKER HINT\n\n\
    To prevent confusion, write a table to track what is happening on each iteration.\n\
    \n### DATA STRUCTURES INSIDE DATA STRUCTURES\n\nFor subsequent exercises, a list\
    \ of tournament results is required. Inside each tournament result, we also need\
    \ a list of players who participated in the tournament.\n\nAdd this data structure\
    \ to the file.\n\n```javascript\nvar tournaments = [\n\n  { win: true, players:\
    \ ['smirk', 'knight', 'fly'] },\n\n  { win: true, players: ['superb', 'san', 'tired']\
    \ },\n\n  { win: true, players: ['smirk', 'knight', 'tired'] },\n\n  { win: false,\
    \ players: ['san', 'superb', 'fly'] },\n\n  { win: true, players: ['smirk', 'san',\
    \ 'fly'] },\n\n  { win: false, players: ['superb', 'knight', 'tired'] },\n];\n\
    ```\n\n### NUMBER OF TOURNAMENTS PLAYED\n\nThe data about player participation\
    \ is inside the array of `tournaments`. With an array of data, there is a clear\
    \ need for a loop.\n\n```javascript\nfunction tournamentsPlayed(tournaments, player)\
    \ {\n\n  var playCount = 0;\n\n  for (var i = 0; i < tournaments.length; i++)\
    \ {\n\n    var currentTournament = tournaments[i];\n\n  }\n\n  return playCount;\n\
    \n}\n```\n\nThis time, you need to check to see if the player participated in\
    \ the tournament. Not only that, but you have to keep track of the number of times\
    \ this has occurred. Figuring out if a player played in a particular tournament\
    \ is a lot of work. Each tournament entry needs to have the inner array searched.\
    \ But this has already been solved in `playedInTournament`. The function can be\
    \ reused instead.\n\n![Image 32](index-74_1.jpg)\n\n```javascript\nvar currentTournament\
    \ = tournaments[i];\n\nvar playerDidPlay = playedInTournament(currentTournament,\
    \ player);\n\nif (playerDidPlay) {\n\n  playCount += 1;\n\n}\n```\n\nValidate\
    \ the code by running it with `console.log`.\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments,\
    \ 'smirk'));\n\nconsole.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n\
    Looks good. Both `smirk` and `superb` played in three tournaments. These `console.log`\
    \ statements can be removed now.\n\n### NUMBER OF TOURNAMENTS WON\n\nNow, take\
    \ it one step further. Check and see the number of times a particular player has\
    \ participated in a tournament where the team won. To do so clearly, you will\
    \ need:\n1. A loop\n2. An accumulator variable to track the number of tournaments\
    \ won.\n\n```javascript\nfunction tournamentsWon(tournaments, player) {\n\n  var\
    \ winCount = 0;\n\n  for (var i = 0; i < tournaments.length; i++) {\n\n    var\
    \ currentTournament = tournaments[i];\n\n  }\n\n  return winCount;\n\n}\n```\n\
    \nThings are a little different compared to `gamesPlayed`. Two conditions are\
    \ necessary:\n1. The player participated in the tournament\n2. The team won\n\n\
    Luckily, `playedInTournament` can be used for the first condition. For the second,\
    \ each entry has the tournament result, in the key `win`. You need both to be\
    \ true in order to count the game as a tournament win when that particular player\
    \ participated. In this\n\n![Image 33](index-75_1.jpg)\n\n![Image 34](index-75_2.jpg)\n\
    \ncase, the AND operator, `&&`, is used to assert both at once.\n\n```javascript\n\
    function tournamentsWon(tournaments, player) {\n\n  var winCount = 0;\n\n  for\
    \ (var i = 0; i < tournaments.length; i++) {\n\n    var currentTournament = tournaments[i];\n\
    \n    var playerDidPlay = playedInTournament(currentTournament, player);\n\n \
    \   var tournamentWon = currentTournament.win;\n\n    if (playerDidPlay && tournamentWon)\
    \ {\n\n      winCount += 1;\n\n    }\n  }\n\n  return winCount;\n\n}\n```\n\n\
    Validate the code with a `console.log`.\n\n```javascript\nconsole.log(tournamentsWon(tournaments,\
    \ 'smirk'));\n\nconsole.log(tournamentsWon(tournaments, 'superb'));\n```\n\nLooks\
    \ good! It looks like `smirk` has won three tournaments and `superb` has won one.\n\
    \n### PLAYER WIN RATE\n\nNow you are interested in determining the win rates.\
    \ To solve this, divide the number of wins by the number of tournaments played.\n\
    \nThe algorithm that needs to be written is easy, because both have already been\
    \ solved! For a cleaner output, `parseInt` will be used. It turns a decimal number\
    \ into a whole number.\n\n```javascript\nfunction playerWinRate(tournaments, player)\
    \ {\n\n  var total = tournamentsPlayed(tournaments, player);\n\n  var won = tournamentsWon(tournaments,\
    \ player);\n\n  var percentage = (won / total) * 100;\n\n![Image 35](index-76_1.jpg)\n\
    \n  return parseInt(percentage);\n\n}\n```\n\nLet’s validate.\n\n```javascript\n\
    console.log(playerWinRate(tournaments, 'smirk'));\n\nconsole.log(playerWinRate(tournaments,\
    \ 'superb'));\n```\n\nIt appears `smirk` has a perfect win rate, while `superb`\
    \ is at 33 percent.\n\n### WHO SHOULD PLAY?\n\nOh no! It looks like there is a\
    \ dispute between two players. It appears `smirk` and `superb` both want to play\
    \ in the next tournament, but there is room for only one player. To resolve this,\
    \ management has decided to check the performance of the team when each respective\
    \ player was participating. Management are not programmers and they don’t want\
    \ to see two numbers. They want to see a well-structured message on who should\
    \ play and who should be benched.\n\nSo far, you’ve solved a multitude of challenges.\
    \ Many simple functions have been written and composed together to solve tough\
    \ challenges. Last one to go!\n\nThere is already a function to calculate the\
    \ win rate of each player. Just compare win rates to discover who should be in\
    \ the next tournament. This time around, three parameters are required:\n1. The\
    \ team’s tournament performances and its active players in each tournament\n2.\
    \ A player\n3. Another player to compare\n\n```javascript\nfunction whoShouldPlay(tournaments,\
    \ player1, player2) {\n\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
    \n  var player2WinRate = playerWinRate(tournaments, player2);\n\n}\n```\n\nThis\
    \ time, you will want to print out two nice messages. Keep track of who will be\
    \ the `benchedPlayer` and who will be the `activePlayer`. If `player1` has a better\
    \ win rate, they should be the `activePlayer` and `player2` should be the `benchedPlayer`.\n\
    \n```javascript\nfunction whoShouldPlay(tournaments, player1, player2) {\n\n \
    \ var player1WinRate = playerWinRate(tournaments, player1);\n\n  var player2WinRate\
    \ = playerWinRate(tournaments, player2);\n\n![Image 36](index-77_1.jpg)\n\n  var\
    \ benchedPlayer;\n\n  var activePlayer;\n\n  if (player1WinRate > player2WinRate)\
    \ {\n\n    activePlayer = player1;\n\n    benchedPlayer = player2;\n\n  }\n\n\
    }\n```\n\nBut that’s not enough, because the opposite situation needs to be handled.\
    \ In this situation, you don’t need an `else if`. There are only two options.\
    \ An `else` statement will work perfectly fine.\n"
