    最难学习的编程语言是你学会的第一个语言。高阶概念在不同语言之间并没有改变，它们与计算机交互的方式在很大程度上是通用的。


    大梦想要从小做起。从基础知识开始构建你的编程知识工具箱至关重要。那么，让我们来看一下书中将讨论的一些基础编程语言。


    ## 变量 (VARIABLES)

    追踪数据和海量的逻辑行是程序员面面临的一大主要挑战，但有一种策略可以帮助你记忆：变量！`Variables` 用于将名称与数据关联，并在需要时重新引用它们。在实践中，变量可以用于更多用途——但现在，你只需要知道，变量是给某部分数据进行命名的概念，以便日后引用。


    ## 数据类型 (DATA TYPES)

    存在多种数据类型和数据结构。计算机在开始为你承担所有繁重工作之前，需要知道许多不同的事情。你是在尝试组合文本还是进行数学计算？文本和数字都是数据类型的示例。书中也将涵盖更高级的数据类型。


    ## 数据结构 (DATA STRUCTURES)

    数据结构是数据的容器。数据结构可以存储一条数据，也可以存储数百万数据。它们极其灵活，是编程中最强大的概念之一。存在多种类型的数据结构（例如 `arrays`），你将学习如何使用最基础的那些。


    ## 条件语句 (CONDITIONAL STATEMENTS)

    为了在一组特定的代码中适应许多情况，它可以具有分支行为：“如果这只动物是狗，就给它吃鸡肉，但如果这只动物是鸟，就给它吃种子。”


    一个语句处理两种情况可能的结果。使用适当的代码可以帮助做出这类决策。在编程中，初始决策（即如果这只动物是狗）被称为条件语句。


    ## 循环 (LOOPS)

    你是否做过某种重复的且几乎每次都完全相同的活动？这种活动的计算机版本被称为循环。循环是按照你指示的时间，只要你要求就自动重复执行一组操作的过程。


    ## 需掌握词汇 (Words to Know)

    和任何行业一样，程序员有自己的术语。让我们来看几个对你路程有帮助的关键词。


    ### 算法 (ALGORITHM)

    算法是一系列导致结果或输出的逻辑指令序列。


    计算机并不是唯一使用算法的东西。人类也用算法进行思考。任何基于规则集被视为“指令”的东西都是算法。


    算法有各种形状、大小和难度。人类在指令方面非常灵活，并拥有批判性思维的独特能力。这种能力让你能够根据过去的经验填充任何不完整或糟糕的指令。


    但计算机没有批判性思维能力。它必须经过编程。当计算机接收指令时，必须被喂养每一个细节。即使是与你原意产生的微小偏差也可能导致你的算法停止或执行意料之外的事情。这类错误可能会导致灾难性的后果。


    ### 语法 (SYNTAX)

    所有形式的书面通信都遵循如何组织单词和语句的规则。这些规则被称为 `syntax`。英语中的语法示例包括：


    - 用句号、感叹号或问号结束句子。

    - 当下一个单词以元音开头时，使用“an” 而不是“a”。

    - 正确地拼写单词。

    - 根据正确的定义使用单词。


    编程语言也有这类规则。所有编程语言都有必须遵守的严格结构。但它们将对正确语法的要求推向了极端。任何语法规则都会导致程序崩溃并无法继续运行。幸运的是，编程语言的语法很容易学习。真正的挑战在于编写它时不犯错，否则你将有一堆调试工作要做。


    ### 抽象 (ABSTRACTION)

    抽象是创建一个可以执行某个功能或任务的过程，同时隐藏其如何执行的细节。抽象的概念并不是代码所独有的。


    世界围绕抽象旋转。你需要一个电气工程学位才能使用计算机吗？你需要学会从零开始组装汽车才能获得驾驶执照吗？抽象的格言是：“我不需要知道它是如何工作的。我只需要知道如何使用它。”


    随着代码规模的增长，从代码的其他部分隐藏不必要的细节变得变得越来越重要。创建抽象有多种方法，这本书将为你提供基础策略。


    ### 伪代码 (PSEUDO CODE)

    解决编程挑战有两个组成部分：


    1. 有对问题的正确思考方式。

    2. 在没有冲突且没有语法错误的情况下实现逻辑。


    有些问题非常有挑战性，以至于程序员不想同时解决这两个部分。相反，他们想出正确的思考方式并用通俗的英语写下来。这被称为 `pseudo code`。当程序员确信他们的推理行可行后，他们就会在真实代码中实现它。本书将使用大量的伪代码。当引入新概念或你被要求解决挑战性问题时，它将对你有帮助。


    ![Image 4](img/index-17_1.jpg)


    ## 第二章：JavaScript：环境搭建 (JavaScript: Setting Up)

    在开始探索 JavaScript 之前，你需要设置你的计算机来运行代码。本章将为 Windows 和 macOS 计算机提供逐步说明。在继续后续章节之前，确保一切运行正常。本书的其余部分都依赖于此！


    ## 编程程序 (Coding Programs)

    你将使用三个不同的程序来编写 JavaScript 代码。每个程序的安装说明在 PC 和 Mac 之间会有不同，请务必遵循你操作系统的说明。


    ### 命令行 (COMMAND LINE (GIT BASH FOR WINDOWS, TERMINAL FOR MACOS))

    程序员并不总是使用友好的点点击式视觉界面，例如你的网络浏览器。通常你需要输入基于文本的命令。这没什么特别的。就像点击图标运行程序一样，你可以在命令行中输入文本指令来执行操作。


    ### 编辑器 (TEXT EDITOR (VS CODE))

    编程通常非常复杂。幸运的是，非常聪明的程序员编写了许多工具来帮助我们提高效率、早发现错误并轻松阅读代码。编程编辑器是完全为编程设计的程序。它们就像记事本，但在每一个方面都更好。它们拥有诸如自动补全建议、代码高亮、自动保存和强大的快捷键等智能功能。我们将使用
    Visual Studio Code，即 `VS Code`。它是目前最流行的免费编辑器之一，具有良好的 JavaScript 支持工具。


    ### JavaScript 运行时 (JAVASCRIPT RUNTIME (NODE.JS))

    命令行只是一个执行计算机操作的平台。它在默认状态下没有运行 JavaScript 的。我们需要安装另一个名为 `Node.js` 的程序以便在命令行中运行
    JavaScript 代码。我们将 JavaScript 代码的执行过程称为 `runtime`。


