    use and usually will result in a runtime error if the coder attempts to use it
    as a variable.


    [4.](#index_split_000.html_p40) What keywords were covered in this chapter?


    The following were covered: var, true, false, null, undefined.


    [5.](#index_split_000.html_p40) What is the main difference between the increment
    operators and self-assignment operators?


    The increment operators do not need to be assigned again (with the sign equal
    operator). Self-assignment is a reassignment.


    [6.](#index_split_000.html_p40) How are values in an array accessed?


    They are accessed by their numeric position in the array, by index (starting at
    0).


    This is done using the bracket operator.


    [7.](#index_split_000.html_p40) How are values in an object accessed?


    They are accessed by their key name with the dot operator or bracket operator.
    If the bracket operator is used, the key name must be a string.


    [8.](#index_split_000.html_p40) What value is outputted if a nonexistent index
    is accessed in an array?


    It outputs undefined.


    [9.](#index_split_000.html_p40) What value is outputted if a nonexistent key is
    accessed in an object?


    It outputs undefined.


    [10.](#index_split_000.html_p40) When is bracket notation necessary for accessing
    a value in an object, instead


    of the dot operator?


    When using a variable as the key name, the bracket notation must be used.


    DEBUGGING


    [1.](#index_split_000.html_p40) The variable doesn’t seem to change in value,
    despite the fact that it is being incremented.


    Self-incrementing should not be assigned.


    var num = 0;


    num++;


    console.log(num); // 1


    [2.](#index_split_000.html_p40) Adding two numbers together isn’t working properly.


    One of the numbers is a string. Both must be the type “number.”


    var num1 = 10;


    var num2 = 2;


    console.log(num1 + num2); // 12


    [3.](#index_split_000.html_p41) Trying to access your dog’s name ‘Max’ by using
    the key ‘pug’ is outputting undefined.


    When using a variable as a key, the bracket notation has to be used.


    var dogs = {


    pug: ''Max'',


    terrier: ''Appa''


    };


    var myDog = ''pug'';


    console.log(dogs[myDog]); // ''Max''


    [4.](#index_split_000.html_p41) An attempt to access the last entry in the array
    is outputting undefined.


    The index 3 is out of bounds of the array. For arrays, the index starts at 0.


    var meanPeople = [''Layna'', ''Layna again'', ''Layna one more time'']; console.log(meanPeople[2]);
    // ''Layna one more time'''
