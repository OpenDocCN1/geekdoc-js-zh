  trans: "\n仅打印 5 美元及以上的钞票。这在代码中是如何表达的？\n\n```\nvar bills = [1, 1, 5, 10, 20];\n\n\
    for (var index = 0; index < bills.length; index++) {\n  if (bills[index] >= 5)\
    \ {\n    console.log(bills[index]);\n  }\n}\n```\n\n简单的内容。但你可以使用 `continue` 语句来解决同样的挑战。\n\
    \n这是伪代码的写法。\n\n```\nfor (循环每一张钞票) {\n  如果金额小于 5 美元，跳过此语句之后的所有内容\n  打印钞票\n}\n```\n\
    \n如果当金额小于 5 美元时停止迭代，那么意味着该钞票不会被打印。在实际代码中，它看起来像这样：\n\n```javascript\nvar bills\
    \ = [1, 1, 5, 10, 20];\n\nfor (var index = 0; index < bills.length; index++) {\n\
    \  // 如果金额小于 5 美元\n  if (bills[index] < 5) {\n    // 跳过\n    continue;\n  }\n\
    \  console.log(bills[index]);\n}\n```\n\n输出如预期。数组中的前两个值被忽略，因为它们小于 5。循环永远不会执行 `console.log`，因为条件语句内的\
    \ `continue` 语句提前停止了迭代。\n\n![Image 25](img/index-60_1.jpg)\n\n![Image 26](img/index-60_2.jpg)\n\
    \n## BREAK\n\n关键字 `continue` 会跳过循环内部的后续操作。但如果你想完全取消循环呢？`break` 语句以与 `continue`\
    \ 的方式停止当前迭代。但 `break` 更进了一，它还会停止后续所有的迭代！\n\n现在，再次修改提示词。如果你看到一张 5 美元的钞票，停止打印。这可以在不使用\
    \ `break` 语句的情况下完成。但使用它可以会让算法更容易理解。\n\n```\nfor (循环每一张钞票) {\n  如果金额等于 5 美元，退出循环\n\
    \  打印钞票\n}\n```\n\n在实际代码中，它看起来像这样：\n\n```javascript\nvar bills = [1, 1, 5, 10,\
    \ 20];\n\nfor (var index = 0; index < bills.length; index++) {\n  // 如果金额是 5 美元\n\
    \  if (bills[index] === 5) {\n    // 完全退出循环\n    break;\n  }\n  console.log(bills[index]);\n\
    }\n```\n\n太棒了！正如你所期的那样。一旦代码看到 5，循环就会停止。\n\n## 循环实战\n\n到为止，你花费了所有时间确保理解如何遍历数组中的所有钞票。现在是时候解决原始提示了：计算你钱包里的总金额！\n\
    \n### 黑客提示\n\n如果你的电脑在运行 JavaScript 文件时运行变慢，请强制退出。循环正在无止运行，因为它从未遇到它的终止条件。键盘命令 `ctrl\
    \ + z` 将强制停止该操作。最坏的情况下，关闭 VS Code。\n\n### 循环\n\n回到你之前的代码，内部没有任何行为。但循环已准备好对钞票数组进行迭代。\n\
    \n```javascript\nvar bills = [1, 1, 5, 10, 20];\n\nfor (var i = 0; i < bills.length;\
    \ i++) {\n\n}\n```\n\n变量 `index` 被缩短为 `i`。这是在循环中跟踪索引时常用的变量名。\n\n为了跟踪金额，需要一个变量。该值将从\
    \ 0 开始，因为你的循环还没有计算任何钱。\n\n```javascript\nvar total = 0;\n```\n\n这种变量通常被称为“累加器”（accumulator）。在我们的循环的每次迭代后，它的值会逐渐增加。它在访问每张钞票后“累积”值。\n\
    \n将所有内容整合在一起，按索引的每张钞票的值都会增加累加器 `total` 的值。\n\n```javascript\nvar bills = [1, 1,\
    \ 5, 10, 20];\nvar total = 0;\n\nfor (var i = 0; i < bills.length; i++) {\n  var\
    \ currentValue = bills[i];\n  total += currentValue;\n}\n\nconsole.log(total);\n\
    ```\n\n为了确保你完全理解正在发生什么，让我们创建另一个表格来表示每次迭代。\n\n### 迭代\n\n| I | CONDITION | CURRENTVALUE\
    \ | TOTAL | BILLS |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | 0 < 5 | 1 | 1\
    \ | [1, 1, 5, 10, 20] |\n| 2 | 1 < 5 | 1 | 2 | [1, 1, 5, 10, 20] |\n| 3 | 2 <\
    \ 5 | 5 | 7 | [1, 1, 5, 10, 20] |\n| 4 | 3 < 5 | 10 | 17 | [1, 1, 5, 10, 20] |\n\
    | 5 | 4 < 5 | 20 | 37 | [1, 1, 5, 10, 20] |\n\n## 破解代码\n\n本章引入了一些非常重要的概念。在继续之前，请确保你对以下问题的回答充满信心。这很重要，因为在后文中循环将被广泛使用。\n\
    \n1. 为什么在处理循环时，终止条件很重要？\n2. 在遍历数组时，`i` 初始化为 0。它的作用是什么？\n3. 在遍历数组时，`i` 初始化为 0。它的作用是什么？\n\
    4. 为以下循环编写一个表格。\n5. 为以下循环编写一个表格。\n6. 为以下循环编写一个表格。\n\n"
- fmt: "\nFunctions have multiple aspects that make them useful to programmers. They\
    \ are a core part of programming. They’ll be some of the first tools you’ll reach\
    \ for when solving problems. Programming challenges that are hard become manageable.\
    \ Challenges that are near impossible can become a reality.\n\n## REUSE CODE\n\
    \nDoes `console.log` get destroyed after it is used? Absolutely not! Functions\
    \ can be used as many or as few times as you want. Often, when a programmer sees\
    \ two of the same kinds of operations, they figure out strategies to reduce the\
    \ amount of code that would need to be repeatedly rewritten. Functions are the\
    \ go-to strategy for this.\n\n## ABSTRACTION\n\nIf the skin of `console.log` were\
    \ peeled back and you were able to look at how it’s implemented, you would see\
    \ something incredibly complex. `console.log` is a fantastic abstraction. It performs\
    \ a complex operation using a simple command. Some programmers worked very hard\
    \ to make `console.log` and let the world use it in an easy way.\n\n## SOLVE LARGE\
    \ CHALLENGES\n\nMainstream programs are dauntingly complex. Humans do not have\
    \ the mental capacity to figure out the entire solution to complex problems in\
    \ their heads. Instead, your brain breaks down large challenges into many smaller\
    \ challenges. You solve each small challenge one by one and package it up. You\
    \ then combine all of these small solutions to solve the problem at hand. Functions\
    \ are perfect for this.\n\n## Function Creation\n\nThere are two ways to declare\
    \ a function. The two are similar and you don’t have to worry too much about the\
    \ nuances between them. But as a JavaScript programmer, you will be using both,\
    \ depending on the situation.\n\n### FUNCTION DECLARATION\n\nThe first syntax\
    \ is to have the keyword `function` and the name after it. A semicolon is optional.\
    \ This declaration style will be used almost exclusively.\n\n```javascript\nfunction\
    \ functionNameOfYourChoosing() {\n  // code here\n}\n```\n\n### FUNCTION EXPRESSION\n\
    \nThe second syntax has the keyword `function` assigned to a variable, using the\
    \ declaration `var`. A semicolon is recommended. This declaration style will be\
    \ used only when working with object-oriented programming.\n\n```javascript\n\
    var functionNameOfYourChoosing = function () {\n  // code here\n};\n```\n\n##\
    \ Function Invocation\n\nParentheses on the end of the function name run the operations\
    \ inside it. The formal term is invoke. This syntax is identical for both types\
    \ of function declarations.\n\n```javascript\nfunctionNameOfYourChoosing();\n\
    ```\n\n## Return Statement\n\nNatively, a function does not expose data that it\
    \ has computed to the outside world.\n\n```javascript\nfunction add() {\n  var\
    \ computed = 5 + 5;\n}\n\nadd(); // undefined\n```\n\nThat’s because you have\
    \ not told JavaScript that you want it! Using the keyword `return`, a function\
    \ can expose a piece of data.\n\n```javascript\nfunction add() {\n  var computed\
    \ = 5 + 5;\n  return computed\n}\n\nadd(); // 10\n```\n\n## Function Parameters\n\
    \nIn the previous example, the `add` function can only add 5 and 5 together. Wouldn’t\
    \ it be nicer if you could take any two numbers and add them together? This is\
    \ where parameters come into play.\n\nParameters are pre-prepared variables. This\
    \ allows functions to fit many situations.\n\n```javascript\nfunction add(num1,\
    \ num2) {\n  return num1 + num2;\n}\n```\n\nYou have told JavaScript that two\
    \ variables, `num1` and `num2`, can be passed in during invocation. With parameters,\
    \ this `add` function handles any numbers.\n\n```javascript\nadd(10, 5); // 15\n\
    add(20, 30); // 50\n```\n\n### Early Termination with Return\n\nThe keyword `return`\
    \ actually serves two purposes at once:\n\n1. It outputs a value from a function.\n\
    2. It stops the function execution.\n\nYou may find yourself not wanting to execute\
    \ code after a certain point or to make a decision and cease all subsequent operations.\n\
    \n### HACKER HINT\n\nWhen you see an algorithm that is repeated but with different\
    \ values, consider turning the operation into a function with parameters.\n\n\
    ### PROTECT ADD FROM TYPE COERCION\n\nLet’s spruce up your `add` function and\
    \ protect it from bad inputs. Remember type coercion and the `+` operator?\n\n\
    ```javascript\nfunction add(num1, num2) {\n  return num1 + num2;\n}\n\nadd('10',\
    \ '5'); // '105'\nadd(20, '30'); // '2030'\n```\n\nYour addition function can\
    \ string concatenate. But you always want to add, or at least attempt to. Let’s\
    \ protect it with an early return. If data are used that are not numbers, the\
    \ function should return `NaN`.\n\n```javascript\nfunction add(num1, num2) {\n\
    \  // if num1 is not a number OR num2 is not a number\n  if (typeof num1 !== 'number'\
    \ || typeof num2 !== 'number') {\n    return NaN;\n  }\n  return num1 + num2;\n\
    }\n\nadd('10', 5); // 'NaN'\nadd(20, '30'); // 'NaN'\n```\n\nUsing an early return,\
    \ you have protected the function from type coercion or any other bad inputs.\n\
    \n## Scope\n\nNow would be a good time to talk about how variable availability\
    \ works when using functions. In coding terms, variable availability is referred\
    \ to as scope. Moving forward, functions will be written extensively. It is important\
    \ to understand if a particular piece of data you need is available in a particular\
    \ section of your code.\n\n### VAR: FUNCTION SCOPED\n\nThe location of declaration\
    \ now matters. A declared variable inside a function is available exclusively\
    \ within the function itself.\n\nThis code will give unexpected behavior:\n\n\
    ```javascript\nfunction sampleFunc() {\n  var innerVariable = 'I am only available\
    \ this function';\n  console.log(innerVariable);\n}\n\nfunction otherSampleFunc()\
    \ {\n  console.log(innerVariable);\n}\n\nsampleFunc();\notherSampleFunc();\n```\n\
    \nAn error occurs when running `otherSampleFunc()`. This is a consequence of how\
    \ JavaScript implements scope.\n\n### LEXICAL SCOPE\n\nDifferent programming languages\
    \ have their own rules when it comes to scope. JavaScript uses lexical scope.\
    \ Lexical scope is when variables are available within itself and its inner scopes,\
    \ but not in outer scopes. Let’s look at some examples.\n\n#### Functions Inside\
    \ Functions\n\nFunctions can be written inside other functions! This creates two\
    \ tiers of scope. One is an inner scope and the other is an outer scope.\n\nVariables\
    \ declared in the outer scope are available in any inner scopes.\n\n```javascript\n\
    function outerScopeFunc() {\n  var outerVar = 'I am outer scoped! I exist in both\
    \ scopes';\n  function innerScopeFunc() {\n    console.log(outerVar);\n  }\n \
    \ innerScopeFunc();\n}\n\nouterScopeFunc();\n```\n\nBut inner scopes are not available\
    \ in scopes above themselves.\n\n```javascript\nfunction outerScopeFunc() {\n\
    \  function innerScopeFunc() {\n    var innerVar = 'I am inner scoped! I only\
    \ exist inside here';\n  }\n  console.log(innerVar);\n}\n\nouterScopeFunc();\n\
    ```\n\nUnderstanding scope is key to writing functions. Sometimes the variable\
    \ won’t be available where it is needed and vice versa. Always be mindful of scope.\n\
    \n## Esports Player Performance\n\nWorking with functions empowers you to solve\
    \ hard challenges in elegant ways. Let’s take a big leap forward in your problem-solving\
    \ abilities! Electro is a world-class Esports team for Undersea, a popular computer\
    \ game. They have an excellent record on the global stage. With a rich roster\
    \ of talented players, they rotate who plays and who sits on the sidelines.\n\n\
    ### DID A PLAYER PARTICATE?\n\nYour first challenge will be checking player participation\
    \ in a tournament. This function should be able to handle any possible player\
    \ and for any tournament results. They have to be parameters. Let’s call the function\
    \ `playedInTournament` and the two parameters `tournament` and `player`.\n\n```javascript\n\
    function playedInTournament(tournament, player) {\n\n}\n```\n\nFor this exercise,\
    \ the `tournament` parameter will have the following structure. It is an object\
    \ data structure with one key: `players`. The value associated with the key is\
    \ an array of player names.\n\n```javascript\n{\n  players: ['smirk', 'knight',\
    \ 'fly']\n};\n```\n"
  raw: 'Functions have multiple aspects that make them useful to programmers. They
    are a core part of programming. They’ll be some of the first tools you’ll reach
    for when solving problems. Programming challenges that are hard become manageable.
    Challenges that are near impossible can become a reality.


    REUSE CODE


    Does console.log get destroyed after it is used? Absolutely not! Functions can
    be used as many or as few times as you want. Often, when a programmer sees two
    of the same kinds of operations, they figure out strategies to reduce the amount
    of code that would need to be repeatedly rewritten. Functions are the go-to strategy
    for this.


    ABSTRACTION


    If the skin of console.log were peeled back and you were able to look at how it’s
    implemented, you would see something incredibly complex. console.log is a fantastic
    abstraction. It performs a complex operation using a simple command. Some programmers
    worked very hard to make console.log and let the world use it in an easy way.


    SOLVE LARGE CHALLENGES


    Mainstream programs are dauntingly complex. Humans do not have the mental capacity
    to figure out the entire solution to complex problems in their heads. Instead,
    your brain breaks down large challenges into many smaller challenges. You solve
    each small challenge one by one and package it up. You then combine all of these
    small solutions to solve the problem at hand. Functions are perfect for this.


    [Function Creation](#index_split_000.html_p6)


    There are two ways to declare a function. The two are similar and you don’t have
    to worry too much about the nuances between them. But as a JavaScript programmer,
    you will be using both, depending on the situation.


    FUNCTION DECLARATION


    The first syntax is to have the keyword function and the name after it. A semicolon
    is optional. This declaration style will be used almost exclusively.


    function functionNameOfYourChoosing() {


    // code here


    }


    FUNCTION EXPRESSION


    The second syntax has the keyword function assigned to a variable, using the declaration
    var. A semicolon is recommended. This declaration style will be used only when
    working with object-oriented programming.


    var functionNameOfYourChoosing = function () {


    // code here


    };


    [Function Invocation](#index_split_000.html_p6)


    Parentheses on the end of the function name run the operations inside it. The
    formal term is invoke. This syntax is identical for both types of function declarations.


    functionNameOfYourChoosing();


    [Return Statement](#index_split_000.html_p6)


    Natively, a function does not expose data that it has computed to the outside
    world.


    function add() {


    var computed = 5 + 5;


    }


    add(); // undefined


    That’s because you have not told JavaScript that you want it! Using the keyword
    return, a function can expose a piece of data.


    function add() {


    var computed = 5 + 5


    return computed


    }


    add(); // 10


    [Function Parameters](#index_split_000.html_p6)


    In the previous example, the add function can only add 5 and 5 together. Wouldn’t
    it be nicer if you could take any two numbers and add them together? This is where
    parameters come into play.


    Parameters are pre-prepared variables. This allows functions to fit many situations.


    function add(num1, num2) {


    return num1 + num2;


    }


    You have told JavaScript that two variables, num1 and num2, can be passed in during
    invocation. With parameters, this add function handles any numbers.


    add(10, 5); // 15


    add(20, 30); // 50


    [Early Termination with Return](#index_split_000.html_p6)


    The keyword return actually serves two purposes at once.


    1\. It outputs a value from a function.


    2\. It stops the function execution.


    You may find yourself not wanting to execute code after a certain point or to
    make a decision and cease all subsequent operations.


    HACKER HINT


    When you see an algorithm that is repeated but with different values, consider
    turning the operation into a function with parameters.


    PROTECT ADD FROM TYPE COERCION


    Let’s spruce up your add function and protect it from bad inputs. Remember type
    coercion and the plus operator?


    function add(num1, num2) {


    return num1 + num2;


    }


    add(''10'', ''5''); // ''105''


    add(20, ''30''); // ''2030''


    Your addition function can string concatenate. But you always want to add, or
    at


    least attempt to. Let’s protect it with an early return. If data are used that
    are not numbers, the function should return NaN.


    function add(num1, num2) {


    // if num1 is not a number OR num2 is not a number


    if (typeof num1 !== ''number'' || typeof num2 !== ''number'') {


    return NaN;


    }


    return num1 + num2;


    }


    add(''10'', 5); // ''NaN''


    add(20, ''30''); // ''NaN''


    Using an early return, you have protected the function from type coercion or any
    other bad inputs.


    [Scope](#index_split_000.html_p7)


    Now would be a good time to talk about how variable availability works when using
    functions. In coding terms, variable availability is referred to as scope. Moving
    forward, functions will be written extensively. It is important to understand
    if a particular piece of data you need is available in a particular section of
    your code.


    VAR: FUNCTION SCOPED


    The location of declaration now matters. A declared variable inside a function
    is available exclusively within the function itself.


    This code will give unexpected behavior.


    function sampleFunc() {


    var innerVariable = ''I am only available inside this function''; console.log(innerVariable);


    }


    function otherSampleFunc() {


    console.log(innerVariable);


    }


    sampleFunc();


    otherSampleFunc();


    ![Image 28](index-70_1.jpg)


    ![Image 29](index-70_2.jpg)


    An error occurs when running otherSampleFunc(). This is a consequence of how JavaScript
    implements scope.


    LEXICAL SCOPE


    Different programming languages have their own rules when it comes to scope.


    JavaScript uses lexical scope. Lexical scope is when variables are available within
    itself and its inner scopes, but not in outer scopes. Let’s look at some examples.


    Functions Inside Functions


    Functions can be written inside other functions! This creates two tiers of scope.
    One is an inner scope and the other is an outer scope.


    Variables declared in the outer scope are available in any inner scopes.


    function outerScopeFunc() {


    var outerVar = ''I am outer scoped! I exist in both scopes''; function innerScopeFunc()
    {


    console.log(outerVar);


    }


    innerScopeFunc();


    }


    outerScopeFunc();


    But inner scopes are not available in scopes above themselves.


    function outerScopeFunc() {


    function innerScopeFunc() {


    ![Image 30](index-71_1.jpg)


    var innerVar = ''I am inner scoped! I only exist inside here'';


    }


    console.log(innerVar);


    innerScopeFunc();


    }


    outerScopeFunc();


    Understanding scope is key to writing functions. Sometimes the variable won’t
    be available where it is needed and vice versa. Always be mindful of scope.


    [Esports Player Performance](#index_split_000.html_p7)


    Working with functions empowers you to solve hard challenges in elegant ways.
    Let’s take a big leap forward in your problem-solving abilities! Electro is a
    world-class Esports team for Undersea, a popular computer game. They have an excellent
    record on the global stage. With a rich roster of talented players, they rotate
    who plays and who sits on the sidelines. Players who do not participate in a match
    are referred to as “benched”


    players.


    DID A PLAYER PARTICIPATE?


    Your first challenge will be checking player participation in a tournament. This
    function should be able to handle any possible player and for any tournament results.
    They have to be parameters. Let’s call the function playedInTournament and the
    two parameters tournament and player.


    function playedInTournament(tournament, player) {


    }


    For this exercise, the tournament parameter will have the following structure.
    It is an object data structure with one key: players. The value associated with
    the key is an array of player names.


    {


    players: [''smirk'', ''knight'', ''fly'']


    };'
