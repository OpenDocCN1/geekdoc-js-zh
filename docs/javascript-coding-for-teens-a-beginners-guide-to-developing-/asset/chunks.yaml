  trans: "\n\n# 将狗作为 JavaScript 对象\n\n刚才介绍的理念在编程中具有相同的相似之处。一个狗对象将有很多关于它自身的属性，并有许多它可以调用的方法。\n\
    \n## 对象属性 (OBJECT PROPERTY)\n\n在 JavaScript 中，访问狗的年龄看起来如下。\n\n```javascript\n\
    sparky.age; // 10\n```\n\n## 对象方法 (OBJECT METHOD)\n\n如果 Sparky 想汪汪，就会调用一个名为 `bark`\
    \ 的方法。\n\n```javascript\nsparky.bark(); // 'ruff ruff!'\n```\n\n注意 `bark` 看起来像函数调用？那是因为方法实际上就是函数！方法是特定于对象实例的函数。它们不能用于其他任何东西。\n\
    \n## JavaScript 对象实现\n\n为了利用对象的威力，我们必须学习完整的 JavaScript 语法来编写它们。\n\n### 构造函数 (CONSTRUCTOR\
    \ FUNCTION)\n\n在 JavaScript 中，函数是双重用途的。它们可以被当作普通函数来执行代码（你已经学过了），也可以被当作构造函数。构造函数是用来调用创建对象实例的函数。\n\
    \n在这里，大驼命名法（pascal case，每个单词的首字母大写）是通用的约定。\n\n```javascript\nfunction Dog() {\n\
    \n}\n```\n\n对于对象实例，在函数调用前面需要 `new` 关键字。\n\n```javascript\nvar sparky = new Dog();\n\
    ```\n\n### 对象属性 (OBJECT PROPERTY)\n\n添加对象属性本质上与添加键值对相同。不同在于它是在构造函数中完成的。\n\n```javascript\n\
    function Dog() {\n  this.age = 10;\n}\n\nvar sparky = new Dog();\n\nsparky.age;\
    \ // 10\n```\n\n等等！这个变量 `this` 是什么？嗯，它是由函数自动创建的秘密变量。在涉及面向对象编程时，它具有一些重要的属性。最重要的是，`this`\
    \ 可以被分配键值对。\n\n### 对象方法 (OBJECT METHODS)\n\n在 JavaScript 中，函数还有一个名为 `prototype`\
    \ 的秘密属性。它的职责是存储函数将供对象实例可用的方法。创建方法需要使用函数表达式语法。\n\n```javascript\nfunction Dog()\
    \ {\n\n}\n\nDog.prototype.bark = function() {\n  console.log('ruff ruff!');\n\
    };\n\nvar sparky = new Dog();\n\nsparky.bark(); // 'ruff ruff!'\n```\n\n### 实例变量\
    \ (INSTANCE VARIABLE)\n\n现在你已经了解基础语法，我们应该谈谈秘密变量 `this`。它在构造函数中是可用的。键值对添加到 `this`。添加到\
    \ `this` 中的键值对通常被称为实例变量。\n\n```javascript\nfunction Dog() {\n  this.name = 'sparky';\n\
    }\n\nDog.prototype.speak = function() {\n  console.log('ruff ruff, my name is'\
    \ + this.name);\n};\n\nvar sparky = new Dog();\n\nsparky.speak(); // 'ruff ruff,\
    \ my name is sparky'\n```\n\n现在，忽略这只狗会说英语的事实。你感兴趣的是在构造函数中创建的 `this.name` 竟然神奇地在方法中可用。\n\
    \n记住这一点至关重要：任何分配给 `Dog.prototype` 的方法都可以使用变量 `this`。\n\n### 实例变量的修改 (INSTANCE\
    \ VARIABLE MODIFICATION)\n\n由于这在每个方法中都是可用的，实例变量也可以在方法中被。\n\n```javascript\nfunction\
    \ Dog() {\n  this.name = 'sparky';\n  this.age = 0;\n}\n\nDog.prototype.growOlder\
    \ = function() {\n  this.age += 1;\n};\n\nvar sparky = new Dog();\n\nsparky.age\
    \ // 0\n\nsparky.growOlder();\n\nsparky.age // 1\n```\n\n### 极客提示 (HACKER HINT)\n\
    \n实例变量也可以在方法中创建，但并不鼓励这样做。在大多数情况下，代码有更好的写法编写方式。\n\n## 实战中的面向对象编程 (Object-Oriented\
    \ Programming in Action)\n\n眼见为实，所以通过一个 JavaScript 狗来建立对面向对象编程的理解，它的能力将与现实中的狗匹配。\n\
    \n### 狗的属性 (DOG PROPERTIES)\n\n为了创建一个对象实例，需要构造函数。\n\n```javascript\nfunction Dog()\
    \ {\n\n}\n\nvar sparky = new Dog();\n```\n\n这非常无聊，并没有告诉你太多关于狗的知识。狗有很多方面是你可能想让你的对象了解的。可以通过将它们变为实例变量来实现。狗的名字、年龄、重量和\
    \ `legCount` 可以被存储。典型的狗有 4 条腿。但名字、年龄和重量在狗之间各不同。将它们作为参数添加到我们的构造函数中。\n\n```javascript\n\
    function Dog(name, age, weight) {\n}\n```\n\n为了跟踪每个 `Dog` 实例的数据，将这些值作为键值对添加到 `this`。\n\
    \n```javascript\nfunction Dog(name, age, weight) {\n  this.name = name;\n  this.age\
    \ = age;\n  this.weight = weight;\n  this.legCount = 4;\n}\n\nvar sparky = new\
    \ Dog('sparky', 4, 20);\nvar misu = new Dog('misu', 10, 15);\n\nsparky.name; //\
    \ 'sparky'\n\nsparky.weight; // '20'\n\nmisu.name; // 'misu'\n\nmisu.weight; //\
    \ 15\n```\n\n太棒了！现在你理解了如何使用构造函数创建对象实例，你有了两只独立的狗，它们有各自的名字、年龄和重量。\n\n### 狗的方法 (DOG\
    \ METHODS)\n\n目前，这些狗不知道如何做什么。为了改变这一点，添加几个方法。\n\n首先，狗应该能够吃食物。添加一个 `eat` 方法。\n\n\
    ```javascript\nDog.prototype.eat = function() {\n  console.log('nom nom nom');\n\
    };\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.eat(); // 'nom nom nom'\n\
    ```\n\n当狗吃得太多时，体重会增加。可以写一个方法来表示。就像任何函数一样，方法可以接受参数。\n\n然后，添加一个代表因过食增加重量的参数。\n\n\
    ```javascript\nDog.prototype.eatTooMuch = function(weightGain) {\n  console.log('ugh...\
    \ ' + this.name + ' doesn\\'t feel so good');\n  this.weight += weightGain;\n\
    };\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.weight; // 20\n\nsparky.eatTooMuch(2);\
    \ // 'ugh . . . sparky doesn't feel so good'\n\nsparky.weight; // 22\n```\n\n\
    记住这一点至关重要：`this` 在所有分配给构造函数的方法中都是可用的。`eatTooMuch` 方法可以修改狗的体重。\n\n记住这一点至关重要：`this`\
    \ 在所有分配给构造函数的方法中都是可用的。`eatTooMuch` 方法可以修改狗的体重。\n\n```javascript\nDog.prototype.ageInYears\
    \ = function(weightGain) {\n  return this.age * 7;\n};\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.ageInYears(); // 28\n```\n\n方法可以在其他方法内部调用。为了表达犬类的顽皮本，还可以显示额外的\
    \ `console.log` 消息。\n\n```javascript\nDog.prototype.eat = function() {\n  console.log('nom\
    \ nom nom');\n};\n\nDog.prototype.stealCatFood = function() {\n  this.eat();\n\
    \  console.log('Yuck, cat food is gross!');\n};\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.stealCatFood();\n// 'nom nom nom'\n// 'Yuck, cat food is gross!'\n\
    ```\n\n在另一个方法内部调用方法时，永远不要引用 `prototype`。它是 `this.eat`。而不是 `this.prototype.eat`。\n\
    \n### 极客提示 (HACKER HINT)\n\n创建方法是拆分复杂方法的直接方法。鼓励创建新的、更小的方法，即使该方法本身没有在其他地方或被任何对象实例使用。\n\
    \n"
- fmt: "\n# 4. What is the syntax to invoke a method inside another method?\n# 5.\
    \ What is the syntax to make a constructor?\n# 6. What is an object instance?\n\
    # 7. What is the syntax to initialize an object instance?\n\n## Debugging\n\n\
    A rudimentary chat program is having problems running correctly. The method `printLog`\
    \ should print the chat history. This one is a little tricky, because two objects\
    \ are interacting with each other. You’re using data structures in an advanced\
    \ way, so don’t be shy about using `console.log` to check the values of variables.\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nfunction ChatProgram()\
    \ {\n  this.chatLog = [];\n}\n\nChatProgram.prototype.message = function (person,\
    \ message) {\n  var messageEntry = {\n    person: person,\n    message: message\n\
    \  };\n  this.chatLog(messageEntry);\n};\n\nChatProgram.prototype.parseMessageEntry\
    \ = function (chatEntry) {\n  return chatEntry.person.name + ': ' + chatEntry.chat;\n\
    };\n\nChatProgram.prototype.getLog = function () {\n  var allMessages = [];\n\
    \  for (var i = 0; i < this.chatLog.length; i++) {\n    var chatEntry = this.chatLog[i];\n\
    \    var parsedMessage =\n      this.prototype.parseMessageEntry(chatEntry);\n\
    \    allMessages.pop(parsedMessage);\n  }\n  ![Image 45](index-105_1.jpg)\n  return\
    \ allMessages;\n};\n\nChatProgram.prototype.printLog = function () {\n  var allMessages\
    \ = this.getLog;\n  for (var i = 0; i < allMessages.length; i++) {\n    console.log(allMessages[i]);\n\
    \  }\n};\n\nvar layna = new Person('Layna');\nvar andrew = new Person('Andrew');\n\
    var chat = new ChatProgram();\nchat.message(andrew, 'Hi Layna, how's it going?');\n\
    chat.message(layna, 'I'm doing great');\nchat.message(layna, 'What about you?');\n\
    chat.message(andrew, 'I just came back from the doctor'); chat.message(layna,\
    \ 'Wow, this conversation is really boring'); chat.message(andrew, 'That was really\
    \ mean, why would you say something like that?');\nchat.message(layna, 'I have\
    \ better things to do');\nchat.message(andrew, ':(');\nchat.message(layna, 'Goodbye');\n\
    chat.printLog();\n```\n\nThis is the expected output.\n\n## CODER’S CHECKLIST\n\
    \nCODER’S CHECKLIST » Let’s review the topics we covered Object-oriented programming\
    \ isn’t unique to JavaScript, but it is the first topic that is not universal\
    \ among all programming languages. Object-oriented programming is one strategy,\
    \ out of many, for solving a programming challenge. As you accumulate more techniques\
    \ in your programming tool kit, you will find multiple approaches to solving a\
    \ problem. It takes experience and intuition to discover the best way to solve\
    \ it. If you have an idea that you’re unsure of, give it a shot anyway! Programming\
    \ is all about learning from past mistakes. Here’s a quick review of what you\
    \ learned in this chapter.\n\n- What an object is\n- What an object instance is\n\
    - How to create instance variables\n- How to create methods\n\n![Image 46](index-107_1.jpg)\n\
    \n## CHAPTER 9: JavaScript and the Web\n\nEverything that (boring) HTML can do\
    \ can be done using JavaScript— and then some! To prove it, in this chapter, you’ll\
    \ start with HTML on a web page, show how the same thing can be done in JavaScript,\
    \ and then take a step beyond what HTML can do. This is your first taste of what\
    \ modern JavaScript is and where where it shines. I hope you’re as excited as\
    \ I am!\n\n### Abstraction Level of the Web\n\nWebsites are on an entirely different\
    \ level of abstraction when compared to your standard terminal. If the abstraction\
    \ level of `console.log` is like riding a bike, JavaScript and its web development\
    \ features are like driving a car.\n\nFor this chapter, you are not concerned\
    \ with how the tools work. You are only concerned with your ability to leverage\
    \ the tools to perform meaningful tasks on the web browser.\n\n### HTML: HyperText\
    \ Markup Language\n\nYou will lean very heavily on JavaScript, but a small amount\
    \ of hypertext markup language, or `HTML`, is still required to interact with\
    \ a web page. Modern websites use incredible amounts of JavaScript to manipulate\
    \ it.\n\n#### HTML FILE\n\nIn the same way JavaScript has its own file extension,\
    \ `.js`, `HTML` has its own file extension, `.html`. Make an HTML file. This is\
    \ the bare minimum for something to be considered a web page. I have named mine\
    \ `index.html`, which is the standard name for the first HTML file.\n\n![Image\
    \ 47](index-109_1.jpg)\n\n#### HTML TAG\n\nNotice the angle brackets surrounding\
    \ a word? That is `HTML` syntax.\n\n```<valid-html-tag-name-here>```\n\nOne has\
    \ angle brackets surrounding it and one has an angle bracket and a slash.\n\n\
    The angle bracket–only tag is referred to as the open tag and the other, with\
    \ the slash, is the close tag. An open tag must have a correlating close tag.\n\
    \n```html\n<html>\n</html>\n```\n\nAny amount of content can be placed between\
    \ the open and close tags. `HTML` can get incredibly complex!\n\n#### HTML TAGS\
    \ WE WILL USE\n\nBecause the emphasis of this book is on JavaScript, there will\
    \ be only a handful of `HTML` tags covered.\n\n```html\n<html>\n<head>\n</head>\n\
    <body>\n<div>\nHello!\n</div>\n</body>\n</html>\n```\n\nThe `html` tag is the\
    \ main tag that wraps around all `HTML` in a file. The `head` tag is multipurpose.\
    \ It is usually the place where nonvisual `HTML` is inserted. The `body` tag is\
    \ where visual elements are placed. `div` is a tag that doesn’t have an important\
    \ role. It is simply used to wrap elements inside it.\n\n#### HTML ATTRIBUTES:\
    \ CLASS AND ID\n\nThere are many different `HTML` attributes. The syntax to apply\
    \ them is the attribute name, an equal sign, and the value (double quotes). As\
    \ a concept, it is quite similar to a key-value pair in an object data structure.\n\
    \n```html\n<div class=\"container\">\nI am content in a div\n```\n\nThe attributes\
    \ `class` and `id` are important to have in `HTML`. The go-to strategy, when working\
    \ with JavaScript, is to find HTML elements by their class or `id`.\n\n## Web\
    \ Browser\n\nBefore starting, make sure the web browser Google Chrome is installed.\
    \ Not all browsers are built the same and Google Chrome is very good at running\
    \ JavaScript.\n\nSearch engine query: “google download”\n\nCurrent URL: [`google.com/chrome`](http://google.com/chrome)\n\
    \n### WEB BROWSER DEVELOPER TOOLS\n\nAfter installation, open Google Chrome. Navigate\
    \ to Settings (the triple dot at the top right) -> More Tools -> Developer Tools.\
    \ The developer console will appear. As a JavaScript programmer, this is where\
    \ all of the magic happens. JavaScript can be written inside.\n\n![Image 48](index-111_1.jpg)\n\
    \nRemember the barebones `index.html`?index_split_001.html_p108) Find the file\
    \ in your operating system’s (PC or Mac) file system. The easiest way to find\
    \ it is to right click the file in VS Code and select “Reveal in File Explorer.”\
    \ For Macs, it is “Reveal in Finder.” Code will open the directory where the file\
    \ exists.\n\n![Image 49](index-112_1.jpg)\n\n![Image 50](index-112_2.jpg)\n\n\
    If the file already has the Google Chrome icon, double click the file to open\
    \ it. The file can also be dragged and dropped to the browser window.\n\nNotice\
    \ how the location is not an internet URL? That’s the directory path to the HTML\
    \ file. After confirming the file is running, modify the HTML.\n\n```html\n<html>\n\
    <head>\n</head>\n<body>\n<div>\nHello!\n![Image 51](index-113_1.jpg)\n![Image\
    \ 52](index-113_2.jpg)\n</div>\n<div class=\"container\">\nI am EXTREMELY cool\n\
    </div>\n</body>\n</html>\n```\n\nAfter modification, the page has not changed.\
    \ Why isn’t the browser acknowledging the fact that we are extremely cool? That’s\
    \ because the browser has the old version of the file loaded. In order to see\
    \ updates, refresh the page.\n\nAfter a refresh, we see our update. Very nice!\n"
