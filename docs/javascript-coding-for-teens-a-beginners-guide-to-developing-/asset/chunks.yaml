    \n在开始处理真正的调试问题之前，是时候让这个测试函数投入行动了。为了这样做，你将故意创建一个错误的 `add` 函数，并看看你的测试函数会给你什么输出。\n\
    \n```javascript\nfunction add(num1, num2) {\n  return num1 - num2;\n}\n\ntest('add\
    \ test #1', add(10, 20), 30);\ntest('add test #2', add(10, 15), 25);\n```\n\n\
    很好！你不仅让 JavaScript 检查你的代码是否正确，而且当函数出错时，还让它向你展示你的计算结果。\n\n## 猜猜我猫的名字\n\n让我们用函数在终端里玩一个快速的小游戏。这并不容易！你需要将问题拆解为许多子问题，并将算法封装在函数中。\n\
    \n将输入一个字符，然后将收到关于猜测进展的反馈。当你正确猜出所有字符后，程序将打印全名并退出。\n\n现在，你的程序运行得并不好。事实上，它根本没有运行。以下是你的错误代码：\n\
    \n```javascript\nvar prompt = require(\"readline-sync\");\n\n// 重要！此函数将不支持数据结构\n\
    // 和对象。仅适用于字符串、数字、null、布尔值和 undefined \nfunction test(description, actual, expected)\
    \ {\n  console.log(description);\n  if (actual === expected) {\n    console.log('\
    \ pass!');\n  } else {\n    console.log(' fail!');\n    console.log(' received:\
    \ ', actual);\n    console.log(' expected: ', expected);\n  }\n}\n\nfunction includes(arrOrStr,\
    \ item) {\n  for (var i = 0; i < arrOrStr.length; i++) {\n    var currItem = arrOrStr[i];\n\
    \    if (currItem !== item) {\n      return true;\n    }\n  }\n  return false;\n\
    }\n\n// ... (其余的逻辑)\n```\n\n"
- fmt: "\nThe function `parseInt` takes a number and turns it into a whole number.\
    \ It does not round up or down, technically. It removes the decimal places from\
    \ the number. More importantly, however, it is a way of taking a stringified version\
    \ of a number and converting the actual data type to a number.\n\n```javascript\n\
    parseInt(1322.23423); // 1322\nparseInt('1322.23423'); // 1322\n```\n\n### PARFLOAT\n\
    In the same way `parseInt` parses a number and a string version of a number, `parseFloat`\
    \ does, too, except it keeps all decimal values from the original number.\n\n\
    ```javascript\nparseFloat(1322.23423); // 1322.23423\nparseFloat('1322.23423');\
    \ // 1322.23423\n```\n\n### Strings\nWithin the scope of this book, most string\
    \ operations will be omitted. But there are still two important manipulations\
    \ to be mindful of.\n\n#### ACCESSING BY INDEX\nFor some algorithms, it is important\
    \ to inspect a string, element by element. This can be accomplished by accessing\
    \ each character by index. The way strings and arrays access elements, by index,\
    \ is identical.\n\n```javascript\nvar dog = 'Misu';\ndog[0]; // 'M'\ndog[2]; //\
    \ 's'\n```\n\n#### TOLOWERCASE AND TOUPPERCASE\nTo change the characters to all\
    \ lower or all upper cases can be done using `toLowerCase` and `toUpperCase`,\
    \ respectively.\n\n```javascript\nvar dog = 'Misu';\ndog.toLowerCase(); // 'misu'\n\
    dog.toUpperCase(); // 'MISU'\n```\n\nWait! Why is this function being used behind\
    \ the variable name? Well, the function is technically a method. There will be\
    \ a deep dive into the purpose and reason of this difference. For the time being,\
    \ just know that methods are invoked with this syntax.\n\n### Arrays\nModifying\
    \ arrays is so common that JavaScript includes many built-in operations to modify\
    \ them in the ways we need.\n\n#### INSERTION\nEntries in an array are accessed\
    \ by index.\n\n```javascript\nvar animals = ['dog', 'cat', 'horse', 'bird'];\n\
    animals[0]; // 'dog'\n```\n\nThe same syntax to access an entry in an array can\
    \ also be used to reassign a new value into an index.\n\n```javascript\nvar animals\
    \ = ['dog', 'cat', 'horse', 'bird'];\nanimals[0] = 'pig';\nanimals[0]; // 'pig'\n\
    ```\n\n#### PUSH\nA common operation is inserting at the end of an array. The\
    \ array method name is `push`.\n\n```javascript\nvar sampleArray = [];\nsampleArray.push(10);\n\
    sampleArray; // [10]\n```\n\n#### POP\nAnother common operation is the removal\
    \ of the last entry in the array, using the method `pop`.\n\n```javascript\nvar\
    \ sampleArray = [2, 10];\nsampleArray.pop();\nsampleArray; // [2]\n```\n\n####\
    \ SHIFT\nThe first element of an array can be removed using the method `shift`.\n\
    \n```javascript\nvar sampleArray = [2, 10];\nsampleArray.shift();\nsampleArray;\
    \ // [10]\n```\n\n#### UNSHIFT\nThe last array operation is `unshift`, which inserts\
    \ an element to the front of the array.\n\n```javascript\nvar sampleArray = [2,\
    \ 10];\nsampleArray.unshift(5);\nsampleArray; // [5, 2, 10]\n```\n\n### Objects\n\
    Compared to arrays, objects are not modified to the same extent. This is for more\
    \ advanced, technical reasons. But objects still support insertion, replacement,\
    \ and deletion.\n\n#### INSERTION AND REPLACEMENT\nObject value insertion is performed\
    \ with the equal sign.\n\n```javascript\nvar animals = {};\nanimals.dog = 'sparky';\n\
    animals; // { dog: 'sparky' }\n```\n\nThe syntax for insertion is the same as\
    \ replace. If the key already exists, it will replace the value.\n\n```javascript\n\
    var animals = {\n  dog: 'sparky'\n};\nanimals.dog = 'not sparky';\nanimals; //\
    \ { dog: 'not sparky' }\n```\n\n#### DELETION\nRemoving an element from an object\
    \ is an uncommon operation. The `delete` operator removes a key-value pair in\
    \ an object.\n\n```javascript\nvar animals = {\n  dog: 'sparky'\n};\ndelete animals.dog;\n\
    animals; // { }\n```\n\n### Mutation\nThe idea of modifying a data type, as opposed\
    \ to always making a new version, is referred to as mutability. An operation can\
    \ be mutative, which means it modifies the existing data. A piece of data can\
    \ also be referred to as immutable, which means it fundamentally cannot be modified.\n\
    \nIn the below example, we did not assign or reassign to a new variable when using\
    \ the array and object operations. That is because `push`, `pop`, `shift`, and\
    \ `unshift` are operations that mutate the existing array. The operations that\
    \ were shown are ones that change the existing data structure.\n\n```javascript\n\
    var animals = ['dog', 'cat', 'horse', 'bird'];\nanimals.push('lizard');\nanimals;\
    \ // ['dog', 'cat', 'horse', 'bird', 'lizard'];\n```\n\nIn fact, reassigning is\
    \ a very bad thing. It can create very unintuitive code.\n\n```javascript\nvar\
    \ animals = ['dog', 'cat', 'horse', 'bird'];\nanimals = animals.push('lizard');\n\
    animals; // 5\n```\n\nThe return value is 5 because that is the length of the\
    \ new array, after pushing lizard into it. But that probably is not the desired\
    \ output. More likely than not, the desired output is the array itself.\n\n####\
    \ STRINGS ARE IMMUTABLE\n```javascript\nvar animal = 'd';\nanimal += 'og';\nanimal;\
    \ // 'dog'\n```\n\nHave you noticed how you have been using the reassign operator?\
    \ That’s because strings are immutable. An existing string cannot be updated.\
    \ It must be reassigned to create an entirely new string.\n\n```javascript\nvar\
    \ animal = 'd';\nanimal + 'dog';\nanimal; // 'd'\n```\n\nBecause of the fact that\
    \ JavaScript’s strings are immutable, string concatenation does not modify `animal`.\n\
    \n### Data Manipulation in Action\nIt is much easier to understand data manipulation\
    \ when you see it in action. We’ll also go over the most common data manipulation\
    \ strategies you will encounter. Let’s get started!\n\n#### BUILDING A NEW ARRAY\n\
    Taking an array and modifying it, in one form or another, is one of the most common\
    \ operations in all programs. In many situations, it is more advantageous to build\
    \ an entirely new array than to modify the existing one.\n\nGiven the following\
    \ array, create an array of the names of players with a skill level that is higher\
    \ than 5.\n\n```javascript\nvar players = [\n  { name: 'superb', skill: 3 },\n\
    \  { name: 'smirk', skill: 7 },\n  { name: 'tired', skill: 6 },\n  { name: 'ANS',\
    \ skill: 9 }\n];\n```\n\nThis is the expected output:\n```javascript\n['smirk',\
    \ 'tired', 'ANS']\n```\n\nTo make the code more manageable, you will place the\
    \ algorithm in a function.\n\n```javascript\nfunction getSkilledPlayers(allPlayers)\
    \ {\n  var skilledPlayers = [];\n  for (var i = 0; i < allPlayers.length; i++)\
    \ {\n    var player = allPlayers[i];\n    if (player.skill > 5) {\n      skilledPlayers.push(player.name);\n\
    \    }\n  }\n  return skilledPlayers;\n}\n```\n\nPutting it all together, this\
    \ is your code and your expected output:\n\n```javascript\nvar players = [\n \
    \ { name: 'superb', skill: 3 },\n  { name: 'smirk', skill: 7 },\n  { name: 'tired',\
    \ skill: 6 },\n  { name: 'ANS', skill: 9 }\n];\n\nfunction getSkilledPlayers(allPlayers)\
    \ {\n  var skilledPlayers = [];\n  for (var i = 0; i < allPlayers.length; i++)\
    \ {\n    var player = allPlayers[i];\n    if (player.skill > 5) {\n      skilledPlayers.push(player.name);\n\
    \    }\n  }\n  return skilledPlayers;\n}\n\nconsole.log(getSkilledPlayers(players));\n\
    ```\n\nFor good measure, a table can be written to see how values are changing\
    \ after each iteration.\n"
