    \n## Game CSS\n\nCSS manipulation is a common strategy for hiding and showing\
    \ elements. Here are some common ones that you’ll likely put to use. If you ever\
    \ get confused by what is happening when you are getting HTML elements and changing\
    \ classes on them, refer back to this section!\n\n### Classes:\n\n1. `hidden`:\
    \ Hides secret character\n2. `intact`: Hides body part\n3. `no-display`: Hides\
    \ game over screen\n4. `character`: Styling for guessed character\n5. `secret-character`:\
    \ Styling for secret character\n\n## Game Pseudo Code\n\nBecause of the sheer\
    \ complexity of game coding, this pseudo code is prepared to help us stay on track\
    \ as we solve each individual challenge.\n\n```javascript\nfunction initialize()\
    \ {\n  initialize hangman object\n  insert secret word on HTML\n  document.addEventListener('keydown',\
    \ function (event) {\n    get the key that was pressed from the event parameter\n\
    \    if (the key is not alphabetic) {\n      stop subsequent operations\n    }\n\
    \    if (the key was already guessed) {\n      update game message and tell the\
    \ player\n      stop subsequent operations\n    }\n    keep track of the guessed\
    \ character\n    insert the character as HTML into the page\n    if (the key exists\
    \ in the secret word) {\n      update game message and tell the player\n     \
    \ update the secret word to reveal the correctly guessed key\n    } else {\n \
    \     update game message and tell player it was the wrong key add a body part\
    \ to the person\n    }\n    if (the player has won or lost) {\n      show the\
    \ game over HTML, including a message and reset button\n    }\n  });\n\n  ResetButton.addEventListener('click',\
    \ function () {\n    clear game state\n    start over the game\n  });\n}\n```\n\
    \n## Game Implementation\n\nNow it’s time to take a deep dive into the code. Don’t\
    \ worry. Each challenge will be solved, one by one.\n\n### HELPER FUNCTIONS\n\n\
    Before starting, it is helpful to write some functions that will make your life\
    \ easier. Add these to the top of the JavaScript file.\n\n#### includes\n\nThis\
    \ function checks to see if a particular character exists inside a string.\n\n\
    ```javascript\nfunction includes(char, string) {\n  for (var i = 0; i < string.length;\
    \ i++) {\n    var currentStrChar = string[i];\n    if (char === currentStrChar)\
    \ {\n      return true;\n    }\n  }\n  return false;\n}\n```\n\n#### createDivWithText\n\
    \nThis function, using JavaScript, will create a div element and insert text.\n\
    \n```javascript\nfunction createDivWithText(text) {\n  var div = document.createElement('div');\n\
    \  div.innerHTML = text;\n  return div;\n}\n```\n\n#### getRandomEntry\n\nThis\
    \ function accepts an array and returns a random element from it.\n\n```javascript\n\
    function getRandomEntry(array) {\n  var randomIdx = Math.floor(Math.random() *\
    \ array.length);\n  return array[randomIdx];\n}\n```\n\n#### INITIALIZE HANGMAN\
    \ OBJECT\n\nA constructor function is needed to set instance variables.\n\n```javascript\n\
    function Hangman(secretWord) {\n  this.secretWord = secretWord;\n  this.charactersGuessed\
    \ = '';\n  this.remainingGuesses = 6;\n}\n```\n\n#### INSERT SECRET WORD INTO\
    \ HTML\n\nTo add the secret word on the page, JavaScript will be used.\n\n```javascript\n\
    Hangman.prototype.initializeSecretWord = function () {\n  var container = document.getElementById('secret-word');\n\
    \  for (var i = 0; i < this.secretWord.length; i++) {\n    var secretChar = this.secretWord[i];\n\
    \    var div = createDivWithText(secretChar);\n    div.classList.add('secret-character',\
    \ 'hidden');\n    container.append(div);\n  }\n};\n```\n\n#### KEYDOWN EVENT LISTENER\n\
    \nThe player will type keys and the game should react to it. A `keydown` event\
    \ listener is needed.\n\n```javascript\ndocument.addEventListener('keydown', function\
    \ (event) {\n  var guessedKey = event.key.toLowerCase();\n  // logic here\n});\n\
    ```\n\n#### Check If the Key Is Not Alphabetic\n\nThe event listener should have\
    \ no behavior if the player types a non-alphabetic key.\n\n```javascript\nHangman.prototype.isInvalidGuess\
    \ = function (guessedKey) {\n  var isAlphabetic = includes(guessedKey, 'abcdefghijklmnopqrstuvwxyz');\n\
    \  return !isAlphabetic;\n};\n```\n\n#### Check If the Key Was Already Guessed\n\
    \nThe player should not be penalized for duplicate guesses.\n\n```javascript\n\
    Hangman.prototype.alreadyGuessed = function (guessedKey) {\n  return includes(guessedKey,\
    \ this.charactersGuessed);\n};\n```\n\n#### Print Message That Key Was Guessed\n\
    \nIn the HTML file, there is a div with the id `game-message`. This is where feedback\
    \ messages will be printed on the page.\n"
