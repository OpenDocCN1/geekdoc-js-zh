    \ to explain what the code is doing, the purpose of the algorithm that was written,\
    \ and general self notes.\n\n### 2. What is the difference between declaration\
    \ and assignment?\nDeclaration is the preparation of a variable. Assignment is\
    \ associating a piece of data to it.\n\n### 3. Can the word `var` be used as a\
    \ variable name? Why or why not?\nIt cannot, because it is a keyword. All keywords\
    \ are reserved for JavaScript to use and usually will result in a runtime error\
    \ if the coder attempts to use it as a variable.\n\n### 4. What keywords were\
    \ covered in this chapter?\nThe following were covered: `var`, `true`, `false`,\
    \ `null`, `undefined`.\n\n### 5. What is the main difference between the increment\
    \ operators and self-assignment operators?\nThe increment operators do not need\
    \ to be assigned again (with the sign equal operator). Self-assignment is a reassignment.\n\
    \n### 6. How are values in an array accessed?\nThey are accessed by their numeric\
    \ position in the array, by index (starting at 0). This is done using the bracket\
    \ operator.\n\n### 7. How are values in an object accessed?\nThey are accessed\
    \ by their key name with the dot operator or bracket operator. If the bracket\
    \ operator is used, the key name must be a string.\n\n### 8. What value is outputted\
    \ if a nonexistent index is accessed in an array?\nIt outputs `undefined`.\n\n\
    ### 9. What value is outputted if a nonexistent key is accessed in an object?\n\
    It outputs `undefined`.\n\n### 10. When is bracket notation necessary for accessing\
    \ a value in an object, instead of the dot operator?\nWhen using a variable as\
    \ the key name, the bracket notation must be used.\n\n### DEBUGGING\n\n### 1.\
    \ The variable doesn’t seem to change in value, despite the fact that it is incremented.\n\
    Self-incrementing should not be assigned.\n```javascript\nvar num = 0;\nnum++;\n\
    console.log(num); // 1\n```\n\n### 2. Adding two numbers together isn’t working\
    \ properly.\nOne of the numbers is a string. Both must be the type `number`.\n\
    ```javascript\nvar num1 = 10;\nvar num2 = 2;\nconsole.log(num1 + num2); // 12\n\
    ```\n\n### 3. Trying to access your dog’s name ‘Max’ by using the key ‘pug’ is\
    \ outputting undefined.\nWhen using a variable as a key, the bracket notation\
    \ has to be used.\n```javascript\nvar dogs = {\npug: 'Max',\nterrier: 'Appa'\n\
    };\nvar myDog = 'pug';\nconsole.log(dogs[myDog]); // 'Max'\n```\n\n### 4. An attempt\
    \ to access the last entry in the array is outputting undefined.\nThe index 3\
    \ is out of bounds of the array. For arrays, the index starts at 0.\n```javascript\n\
    var meanPeople = ['Layna', 'Layna again', 'Layna one more time'];\nconsole.log(meanPeople[2]);\
    \ // 'Layna one more time'\n```\n"
