  trans: "\n\n# 10. 什么时候必须使用括号表示法访问对象的值，而不是点操作符？\n\n## 调试\n\n在调试代码时，将代码放在文件中并在命令行中运行会有所帮助。你将获得关于答案的实时反馈。\n\
    \n### 1. 变量的值似乎没有改变，尽管它正在被执行增操作。\n\n```javascript\nvar num = 0;\nnum = num++;\
    \ // increment num\nconsole.log(num); // 0\n```\n\n### 2. 两个数字相加无法正常工作。\n\n```javascript\n\
    var num1 = 10;\nvar num2 = '2';\nconsole.log(num1 + num2); // ‘102’\n```\n\n###\
    \ 3. 尝试使用键“pug”访问你的狗的名字“Max”输出了 undefined。\n\n```javascript\nvar dogs = {\n  pug:\
    \ 'Max',\n  terrier: 'Appa'\n};\nvar myDog = 'pug';\nconsole.log(dogs.myDog);\
    \ // undefined\n```\n\n### 4. 尝试访问数组的最后一个元素输出了 undefined。\n\n```javascript\nvar\
    \ meanPeople = ['Layna', 'Layna again', 'Layna one more time']; \nconsole.log(meanPeople[3]);\
    \ // undefined\n```\n\n### 5. 尝试打印此字符串时发生了致命运行时错误。\n\n```javascript\nconsole.log('Layna's\
    \ favorite hobby is being mean to Andrew');\n// Uncaught SyntaxError: missing\
    \ ) after argument list\n```\n\n## 编码员检查清单 » 让我们复习一下涵盖的话题\n\n让我们花一分钟时间回顾本章涵盖的内容。理解数组和数据类型尤为重要。\n\
    \n- 数据类型\n- 类型转换\n- 数据结构——数组和对象\n- 访问数据结构内部的数据\n\n![Image 20](img/index-42_1.jpg)\n\
    \n## 第 4 章：条件语句\n\n计算机的运行方式非常有逻辑性。计算机最喜欢的答案之一是“是”和“否”。在计算机术语中，这等同于“true”和“false”。区分\
    \ `true` 和 `false` 的能力是一项强大的力量。这意味着计算机可以根据情况决定运行哪些代码。这也这意味着一个程序可以做很多事情并做出自己的决定！这些决定是通过条件语句控制的。\n\
    \n### 数据检查与验证\n\n在利用条件语句的力量之前，需要涵盖用于创建正确决策的策略。原始值 `true` 和 `false` 并不常用作条件语句。相反，它们几乎总是通过其他操作计算出来的。\n\
    \n### 等于操作符\n\n最常见的比较操作是检查两个值是否相同或不相同。\n\n#### 等于操作符\n\n相等操作符用双等号表示，用于用于检查两个值是否相同。\n\
    \n```javascript\n10 == 10; // true\n'pizza' == 'pizza'; // true\n'pizza' == 'Pizza';\
    \ // false\nfalse == false; // true\n```\n\n准备好接受一个不妙的惊喜了吗？相等操作符会在可能的情况下使用类型转换。\n\
    \n```javascript\n'10' == 10; // true\n```\n\n建议不要使用相等操作符。另一个操作符在相同目的上表现得更好。\n\n\
    #### 严格相等操作符\n\n严格相等操作符是相等操作符更具逻辑性的兄弟，用三等号表示。它检查相等性且永远不会使用类型转换。\n\n```javascript\n\
    10 === 10; // true\n'pizza' === 'pizza'; // true\n'pizza' === 'Pizza'; // false\n\
    false === false; // true\n// 没有执行类型转换\n'10' === 10; // false\n```\n\n#### 不等于操作符\n\
    \n不等于操作符用感叹号和等号表示，用于检查两个值是否不相同。\n\n```javascript\n10 != 10; // false\n'pizza'\
    \ != 'pizza'; // false\n'pizza' != 'Pizza'; // true\nfalse != false; // false\n\
    ```\n\n与相等操作符一样，不等于操作符会使用类型转换。\n\n```javascript\n'10' != 10; // false\n```\n\n\
    #### 严格不等操作符\n\n严格不等操作符是不等于操作符的更好版本。与严格相等一样，严格不等不执行任何类型转换。与普通不等相比，它是 JavaScript\
    \ 代码更安全的选择。它的语法用感叹号和双等号表示。请使用这个来代替普通的不等操作符。\n\n```javascript\n10 !== 10; // false\n\
    'pizza' !== 'pizza'; // false\n'pizza' !== 'Pizza'; // true\nfalse !== false;\
    \ // false\n// 没有执行类型转换\n'10' !== 10; // true\n```\n\n### 关系操作符\n\n与检查两个值是否相等或不相等一样，还可以检查值是否大于或小于。\n\
    \n#### 小于操作符\n\n两个可用的比较操作符是小于操作符于等于操作符。它们的作用正如其名。数字按数值比较，字符串按字母顺序比较。需要注意的是，大小写很重要，\n\
    \n```javascript\n10 < 8; // false\n'a' < 'b'; // true\n'A' > 'a'; // false\n10\
    \ <= 8; // false\n```\n\n#### 大于操作符\n\n大于操作符和大于等于操作符与小于操作符遵循相同的原理，大小写仍然很重要。\n\n\
    ```javascript\n10 > 8; // true\n'a' > 'b'; // false\n'a' >= 'b'; // true\n```\n\
    \n### 逻辑操作符\n\n除了基本的相等操作符，JavaScript 还提供了特殊的操作符，帮助在复杂情况下创建布尔值。许多逻辑操作符和相等操作符可以混合使用。\n\
    \n#### 或操作符\n\n或操作符用双竖线表示，用于检查任一操作是否为真。\n\n```javascript\ntrue || false; // true\n\
    false || false; // false\nfalse || true || false; // true\n```\n\n#### 与操作符\n\n\
    与操作符用双安符表示，用于检查两个操作是否都输出为。\n\n```javascript\ntrue && true; // true\ntrue && false;\
    \ // false\nfalse && false; // false\nfalse && true; // false\n```\n\n#### 非操作符\n\
    \n在编程中，还有非操作符的概念，用放在值前的感叹号表示。这种操作符通常被称为 bang 操作符（bang operator）。它会反转所操作值的布尔值。\n\
    \n```javascript\n!true; // false\n!false; // true\n```\n\n### 混合使用逻辑操作符和相等操作符\n\
    \n`true` 和 `false` 关键字在代码中很少用。现在你有了相等操作符和逻辑操作符，你会看到从简单到复杂的条件。\n\n```javascript\n\
    // 1 大于 10 或者 1 等于 0\n1 > 10 || 1 === 0; // false\n// 1 小于 10 或者 1 等于 0\n1 < 10\
    \ || 1 === 0; // true\n```\n\n### 数据验证\n\n检查一个值是否为 undefined 或 null 是很容易的。\n\n\
    ```javascript\nvar mySocialLife = null;\nmySocialLife === null; // true\n```\n\
    \n操作符处理它可以，因为这些数据类型只有一种值。但数字、字符串、布尔值和数组呢？如果你对数字的值不感兴趣？也许你只想知道它是不是数字？幸运的是，这些情况都有操作符。\n\
    \n#### 类型操作符\n\n`typeof` 操作符以字符串的形式输出变量的数据类型。这在调试代码时特别有用。错误的数据类型是常见的错误源！\n\n```javascript\n\
    typeof 10; // 'number'\ntypeof ''; // 'string'\ntypeof undefined; // 'undefined'\n\
    typeof true; // 'boolean'\n```\n\n很简单。但让我给你抛出一个球。\n\n```javascript\ntypeof null;\
    \ // 'object'——什么？？\n```\n\n哈？为什么 `typeof null` 输出字符串 null？这是否是一个 bug 还有争议。但说到底，它非常不符合直觉。相反，使用相等操作符检查\
    \ null。\n\n```javascript\nnull === null // true\n```\n\n#### 实例操作符\n\n在检查一个项目是否为数组时，`typeof`\
    \ 操作符非常有欺骗性。\n\n```javascript\ntypeof []; // 'object'\n```\n\n输出为“object”的底层原因在技术上是合理的，但它没有帮助且不符合直觉。数组验证可以使用\
    \ `instanceof` 操作符正确地执行。\n\n```javascript\n[] instanceof Array; // true\n```\n"
- fmt: "\nNote that `Array` is not a string in this situation. This is contrasting\
    \ `typeof`, which outputs a string.\n\n## Don’t Use instanceof for Objects\n\n\
    Checking to see if a value is an object is extremely challenging. That’s because\
    \ `typeof` and `instanceof` don’t work. The worst part is that they appear to\
    \ work, but this is not the case.\n\n```javascript\nvar anObject = {};\n\nanObject\
    \ instanceof Object; // true\n\ntypeof anObject === 'object'; // true\n```\n\n\
    The problem lies in the fact that too many nonobject values will output the exact\
    \ same thing when `typeof` and `instanceof` are called on them.\n\n```javascript\n\
    [] instanceof Object; // true\n\ntypeof [] === 'object'; // true\n```\n\n## Conditional\
    \ Statements\n\nAfter learning about all of the ways to validate data and compare\
    \ values, you are ready to use them to solve meaningful challenges. The most common\
    \ conditional statements are `if . . . else if . . . else` statements.\n\n###\
    \ Conditional Branching Statements\n\nThe term “conditional branching statements”\
    \ is a fancy way of describing an `if . . . else if . . . else` statement. It\
    \ allows a programmer to perform actions based on certain conditions.\n\n### IF\
    \ STATEMENT\n\nAn `if` statement runs code if the condition evaluates to true.\
    \ The keyword is `if`, with parentheses around the condition and curly brackets\
    \ wrapping the operations. Any number of operations can be placed inside an `if`\
    \ statement. Notice that there are no semicolons.\n\n```javascript\nif (condition)\
    \ {\n// do something here\n}\n```\n\nLet’s conditionally modify a string, based\
    \ on its value.\n\n```javascript\nvar dogName = 'Max';\n\nif (dogName === 'Max')\
    \ {\n  dogName += ' is an awesome dog';\n}\n\ndogName; // 'Max is an awesome dog'\n\
    ```\n\nGreat! We love dogs named Max.\n\n### ELSE STATEMENT\n\nWhat if you want\
    \ to express your disdain for dogs that are not named Max? That is where the `else`\
    \ statement comes into play. After an `if` statement, an `else` statement can\
    \ be chained to it. If the `if` condition fails, the `else` statement’s code will\
    \ run.\n\n```javascript\nvar dogName = 'Layna';\n\nif (dogName === 'Max') {\n\
    \  dogName += ' is an awesome dog';\n} else {\n  dogName += ' is NOT an awesome\
    \ dog';\n}\n\ndogName; // 'Layna is NOT an awesome dog'\n```\n\nA dog that is\
    \ named Layna? Inconceivable.\n\n### ELSE IF STATEMENT\n\nWhat if you also decide\
    \ that Charlie is an acceptable name for a dog? An `else if` statement can be\
    \ added to the conditional chain. It follows the same syntax as an `if` statement.\n\
    \n```javascript\nvar dogName = 'Charlie';\n\nif (dogName === 'Max') {\n  dogName\
    \ += ' is an awesome dog';\n} else if (dogName === 'Charlie') {\n  dogName +=\
    \ ' is an okay dog';\n} else {\n  dogName += ' is NOT an awesome dog';\n}\n\n\
    dogName; // 'Charlie is an okay dog'\n```\n\n### Conditionals in Action\n\nRemember\
    \ our challenge from the previous chapter?\n\n```javascript\nvar prompt = require('readline-sync');\n\
    \nvar breed = prompt.question('what breed is your dog? '); var dogs = {\n  terrier:\
    \ 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\n\nconsole.log('Your\
    \ dog\\'s name is ' + dogs[breed] + '? How fascinating!');\n```\n\nWhen `breed`\
    \ does not exist in the object, the output was `undefined`. That’s not a good\
    \ representation of what is happening because the real issue is that the `dogs`\
    \ object does not account for every breed on the planet. The code should communicate\
    \ this. Using conditionals, let’s solve previous problem! Before implementing\
    \ this, let’s write some pseudo code.\n\n##ALS HAVE MULTIPLE APPROACHES\n\nFor\
    \ algorithms that involve conditionals, there are many ways to say the same. Here\
    \ are two different ways to say the same:\n- If we find the `breed` in the object\
    \ then print: `dog name`. Else, print: `dog found`\n- If we do not find a `breed`,\
    \ then print: `dog found`. Else, print: `dog name`\n\nWhen you think about it,\
    \ these are two sides of the same coin. They say the exact same thing except in\
    \ opposite order. Let’s express your two possible statements using JavaScript\
    \ syntax.\n\n```javascript\nif (we find a value) {\n  print dog name\n} else {\n\
    \  print dog found\n}\n\nif (we do not find a value) {\n  print dog found\n} else\
    \ {\n  print dog name\n}\n```\n\nTranslating this logic requires you to think\
    \ like a computer. You need the JavaScript equivalent of “find value.” Accessing\
    \ a key in an object that does not exist, get `undefined`. If the value is `undefined`,\
    \ that implies the key does not exist. There are two different ways of writing\
    \ this:\n\n```javascript\ntypeof value === 'undefined';\nvalue === undefined;\n\
    ```\n\nSame difference, right? Let’s use the second one. Finally, your code from\
    \ chapter 3 makes sense!\n\n```javascript\nvar prompt = require('readline-sync');\n\
    \nvar breed = prompt.question('what breed is your dog? '); var dogs = {\n  terrier:\
    \ 'Suzy',\n  husky: 'Sir Sniffybums III',\n  pug: 'Notorious P.U.G.'\n};\n\nif\
    \ (dogs[breed] === undefined) {\n  console.log('A dog was not found(');\n} else\
    \ {\n  console.log('Your dog\\'s name is ' + dogs[breed] + '? How fascinating!');\n\
    }\n```\n\nMuch better. There are no dogs named `undefined`. The output is now\
    \ properly communicating what is happening within the code.\n\n## HACKER HINT\n\
    \nPick the most straightforward way of writing your conditions. Being clever,\
    \ especially as a newcomer to programming, is not going to do you any favors!\n\
    \n## Crack the Code\n\nSome very important concepts have been introduced in this\
    \ chapter. Before continuing further make sure you have full confidence in your\
    \ answers to the following questions. This is important because moving forward,\
    \ conditionals will be used extensively.\n\n1. What is the difference between\
    \ equality operators and strict equality operators?\n2. What data types can the\
    \ `typeof` operator properly check?\n3. What data type uses the `instanceof` operator\
    \ for proper checking?\n4. What is the output of the following code? `(true &&\
    \ false) || false;`\n5. What is the output of the following code? `!false || (false\
    \ && true);`\n6. Why is `array[index] !== undefined` an effective way of checking\
    \ to see if that `index` exists inside an `array`?\n\n## Debugging\n\nReady for\
    \ a few challenges? Remember to run the code in your terminal to actively see\
    \ what is happening!\n\n1. The code is saying that `item` is not an array.\n```javascript\n\
    var item = [];\n\nif (typeof item === 'array') {\n  console.log('I am an array');\n\
    } else {\n  console.log('I am not an array');\n}\n// I am not an array\n```\n\n\
    2. Dr. Donkey is a professional game critic and has reviewed many games. Here\
    \ are a few of them, with their respective scores.\n\n```javascript\nvar donkeysGameScores\
    \ = {\n  superItalianBrosTwo: 100,\n  theLastDefender: 40,\n  leagueOfHeroes:\
    \ 30,\n  aldaAndFluteOfTime: 98\n};\n```\n\nSuper Italian Bros Two has won Dr.\
    \ Donkey’s “Game of the Year” award more than 10 times in a row. It definitely\
    \ is a masterpiece. But the code is saying otherwise.\n\n```javascript\nvar game\
    \ = 'superItalianBrosTwo';\n\nif (donkeysGameScores[game] < 95) {\n  console.log(game\
    \ + ' is a masterpiece');\n} else {\n  console.log(game + ' is not a masterpiece');\n\
    }\n// superItalianBrosTwo is not a masterpiece\n```\n\n3. I consider a game to\
    \ be a mediocre game if the score is anywhere between 30 and 80. The Last Defender\
    \ was a mediocre game. But it was not a bad one. Hint: Writing out complex conditions\
    \ in plain English helps.\n\n```javascript\nvar game = 'theLastDefender';\nvar\
    \ score = donkeysGameScores[game];\n\nif (score >= 80) {\n  console.log(game +\
    \ ' was a fun game');\n} else if (score > 80 && score > 30) {\n  console.log(game\
    \ + ' was an ok game');\n} else {\n  console.log(game + ' was a bad game');\n\
    }\n```\n\n## CODER’S CHECKLIST\n\nLet’s review the topics we covered. Pay special\
    \ attention to equality operators, logical operators, and `if ... else if ...\
    \ else` conditional statements. It will carry you through your entire programming\
    \ experience.\n"
