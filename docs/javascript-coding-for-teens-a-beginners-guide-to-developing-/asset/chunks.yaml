    \ // true\nmysteryFunc([30, 11], 30); // false\n```\n\n### 9. `count` 的值是多少？\n\
    \n```javascript\nvar count = 0;\nfunction increment() {\n  count += 1;\n}\nincrement();\n\
    increment();\n```\n\n## 调试 (Debugging)\n\n这段代码有很多问题！`playerAboveSkillAndAge` 函数应该返回高于指定技能和年龄的玩家。\n\
    \n```javascript\nvar players = [\n  { name: 'super', skill: 1, age: 20 },\n  {\
    \ name: 'smurf', skill: 8, age: 24 },\n  { name: 'ANS', skill: 6, age: 27 },\n\
    \  { name: 'faker', skill: 10, age: 17 },\n  { name: 'shroud', skill: 9, age:\
    \ 26 }\n];\n\nfunction playersAboveSkill(players, skill) {\n  var skilledPlayers\
    \ = players;\n  for (var i = 0; i < players.length; i++) {\n    var objectKey\
    \ = 'skill';\n    if (players[i][objectKey] < skill) {\n      skilledPlayers.push(players[i]);\n\
    \    }\n  }\n  return skilledPlayers;\n}\n\nfunction playersAboveAge(players,\
    \ age) {\n  var agedPlayers = players;\n  for (var i = 1; i < players.length;\
    \ i++) {\n    var objectKey = 'age';\n    if (players[i][objectKey] < age) {\n\
    \      agedPlayers.push(players[i]);\n    }\n  }\n  return agedPlayers;\n}\n\n\
    function playerAboveSkillAndAge(players, skill, age) {\n  var skilledPlayers =\
    \ playersAboveSkill(players, skill);\n  var skilledAgedPlayers = playersAboveAge(skilledPlayers,\
    \ age); \n  return skilledAgedPlayers;\n}\n\nconsole.log(playerAboveSkillAndAge(players,\
    \ 6, 19));\n// 预期：[\n  { name: 'smurf', skill: 8, age: 24 },\n  { name: 'shroud',\
    \ skill: 9, age: 26 }\n];\n\nconsole.log(playerAboveSkillAndAge(players, 2, 16));\n\
    // 预期：[\n  { name: 'smurf', skill: 8, age: 24 },\n  { name: 'ANS', skill: 6, age:\
    \ 27 },\n  { name: 'faker', skill: 10, age: 17 },\n  { name: 'shroud', skill:\
    \ 9, age: 26 }\n];\n```\n\n## 程序员检查清单 (CODER’S CHECKLIST)\n\n你走过了很长的路！你现在正式完成了编程基础的学习。未来，你将学习更多特定于\
    \ JavaScript 的特性。这意味着面向对象编程和网站编程。\n\n"
- fmt: "\n# Dogs as JavaScript Objects\n\nThe ideas that were just presented have\
    \ the same parallels in programming. A dog object would have many properties about\
    \ itself and have many methods that it could invoke.\n\n## OBJECT PROPERTY\n\n\
    In JavaScript, to access the age of the dog, it looks like this.\n\n```javascript\n\
    sparky.age; // 10\n```\n\n## OBJECT METHOD\n\nIf Sparky wants to bark, a method\
    \ called `bark` would be invoked.\n\n```javascript\nsparky.bark(); // 'ruff ruff!'\n\
    ```\n\nNotice how `bark` looks similar to a function call? That’s because methods\
    \ are actually functions! Methods are functions that are specific to an object\
    \ instance. They can’t be used on anything else.\n\n## JavaScript Object Implementation\n\
    \nIn order to leverage the power of objects, we have to learn the full JavaScript\
    \ syntax to write them.\n\n### CONSTRUCTOR FUNCTION\n\nIn JavaScript, functions\
    \ are dual-purpose. They can be used as normal functions to invoke code, which\
    \ you have already learned, and they can be used as a constructor function. A\
    \ constructor is a function that is called to create an object instance.\n\nThis\
    \ is where pascal case, with the first letter of every word capitalized, is the\
    \ accepted convention.\n\n```javascript\nfunction Dog() {\n\n}\n```\n\nFor object\
    \ instances, the keyword `new` is needed in front of the function invocation.\n\
    \n```javascript\nvar sparky = new Dog();\n```\n\n### OBJECT PROPERTY\n\nAdding\
    \ an object property is essentially the same as adding a key-value pair. Except\
    \ it is done in a constructor function.\n\n```javascript\nfunction Dog() {\n \
    \ this.age = 10;\n}\n\nvar sparky = new Dog();\n\nsparky.age; // 10\n```\n\nWait!\
    \ What is this variable, `this`? Well, it is a secret variable that is automatically\
    \ created by a function. It has some important properties when it comes to object-oriented\
    \ programming. Most important, `this` can be assigned key-value pairs.\n\n###\
    \ OBJECT METHODS\n\nIn JavaScript, functions also have a secret property named\
    \ `prototype`. Its duty is to store methods that the function will have available\
    \ to the object instance. To create methods, the function expression syntax is\
    \ required.\n\n```javascript\nfunction Dog() {\n\n}\n\nDog.prototype.bark = function()\
    \ {\n  console.log('ruff ruff!');\n};\n\nvar sparky = new Dog();\n\nsparky.bark();\
    \ // 'ruff ruff!'\n```\n\n### INSTANCE VARIABLE\n\nNow that you have knowledge\
    \ of the basic syntax, we should talk about the secret variable `this`. It is\
    \ available in a constructor function. Key-value pairs can be added to `this`.\
    \ The key-value pairs that are added to `this` are commonly referred to as instance\
    \ variables.\n\n```javascript\nfunction Dog() {\n  this.name = 'sparky';\n}\n\n\
    Dog.prototype.speak = function() {\n  console.log('ruff ruff, my name is' + this.name);\n\
    };\n\nvar sparky = new Dog();\n\nsparky.speak(); // 'ruff ruff, my name is sparky'\n\
    ```\n\nFor now, ignore the fact that this dog can speak English. You are more\
    \ interested in the fact that `this.name`, created in the constructor, is magically\
    \ available in a method.\n\nThis is extremely important to remember: Any method\
    \ that has been assigned to `Dog.prototype` has the variable `this` available\
    \ to it.\n\n### INSTANCE VARIABLE MODIFICATION\n\nSince this is available in every\
    \ method, instance variables can be modified in methods as well.\n\n```javascript\n\
    function Dog() {\n  this.name = 'sparky';\n  this.age = 0;\n}\n\nDog.prototype.growOlder\
    \ = function() {\n  this.age += 1;\n};\n\nvar sparky = new Dog();\n\nsparky.age\
    \ // 0\n\nsparky.growOlder();\n\nsparky.age // 1\n```\n\n### HACKER HINT\n\nInstance\
    \ variables can be created in methods as well, but it is not encouraged. In a\
    \ majority of situations, there are better ways the code could be written.\n\n\
    ## Object-Oriented Programming in Action\n\nSeeing is believing, so build your\
    \ understanding of object-oriented programming with a JavaScript Dog whose abilities\
    \ will match real-life dogs.\n\n### DOG PROPERTIES\n\nIn order to make an object\
    \ instance, a constructor function is required.\n\n```javascript\nfunction Dog()\
    \ {\n\n}\n\nvar sparky = new Dog();\n```\n\nThis is pretty boring and doesn’t\
    \ tell you much about dogs. There are so many aspects of dogs that you likely\
    \ want your object to know about. This can be done by making them instance variables.\
    \ A dog’s name, age, weight, and `legCount` can be stored. A typical dog has 4\
    \ legs. But name, age, and weight vary among dogs. Add them as parameters in our\
    \ constructor function.\n\n```javascript\nfunction Dog(name, age, weight) {\n\
    }\n```\n\nIn order to track data in each `Dog` instance, add these values as key-value\
    \ pairs to `this`.\n\n```javascript\nfunction Dog(name, age, weight) {\n  this.name\
    \ = name;\n  this.age = age;\n  this.weight = weight;\n  this.legCount = 4;\n\
    }\n\nvar sparky = new Dog('sparky', 4, 20);\nvar misu = new Dog('misu', 10, 15);\n\
    \nsparky.name; // 'sparky'\n\nsparky.weight; // '20'\n\nmisu.name; // 'misu'\n\
    \nmisu.weight; // 15\n```\n\nGreat! Now that you understand how to use constructor\
    \ functions to create object instances, you have two independent dogs with their\
    \ respective names, ages, and weights.\n\n### DOG METHODS\n\nCurrently, these\
    \ dogs don’t know how to do anything. To change that, add a few methods.\n\nFirst,\
    \ dogs should be able to eat food. Add an `eat` method.\n\n```javascript\nDog.prototype.eat\
    \ = function() {\n  console.log('nom nom nom');\n};\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.eat(); // 'nom nom nom'\n```\n\nWhen a dog eats too much,\
    \ it will gain weight. A method can be written to represent this. Just like with\
    \ any function, methods can accept parameters.\n\nThen, add a parameter that represents\
    \ the amount of weight gained from overeating.\n\n```javascript\nDog.prototype.eatTooMuch\
    \ = function(weightGain) {\n  console.log('ugh... ' + this.name + ' doesn\\'t\
    \ feel so good');\n  this.weight += weightGain;\n};\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.weight; // 20\n\nsparky.eatTooMuch(2); // 'ugh . . . sparky\
    \ doesn't feel so good'\n\nsparky.weight; // 22\n```\n\nIt’s important to remember\
    \ that `this` is available to us in all methods that are assigned to our constructor\
    \ function, `Dog`. The `eatTooMuch` method is able to modify the dog’s weight.\n\
    \nIt’s important to remember that this is available to us in all methods that\
    \ are assigned to our constructor function, `Dog`. The `eatTooMuch` method is\
    \ able to modify the dog’s weight.\n\n```javascript\nDog.prototype.ageInYears\
    \ = function(weightGain) {\n  return this.age * 7;\n};\n\nvar sparky = new Dog('sparky',\
    \ 4, 20);\n\nsparky.ageInYears(); // 28\n```\n\nMethods can be called inside other\
    \ methods. In order to express the mischievous nature of the canine, an extra\
    \ `console.log` message can also be shown.\n\n```javascript\nDog.prototype.eat\
    \ = function() {\n  console.log('nom nom nom');\n};\n\nDog.prototype.stealCatFood\
    \ = function() {\n  this.eat();\n  console.log('Yuck, cat food is gross!');\n\
    };\n\nvar sparky = new Dog('sparky', 4, 20);\n\nsparky.stealCatFood();\n// 'nom\
    \ nom nom'\n// 'Yuck, cat food is gross!'\n```\n\nWhen calling a method inside\
    \ another method, `prototype` is never referenced. It is `this.eat`. Not `this.prototype.eat`.\n\
    \n### HACKER HINT\n\nCreating a method is a straightforward way of breaking up\
    \ a complex method. It is encouraged to make new, smaller methods, even if the\
    \ method itself is not used anywhere else or by any object instances.\n"
  raw: '[Dogs as JavaScript Objects](#index_split_000.html_p7)


    The ideas that were just presented have the same parallels in programming. A dog
    object would have many properties about itself and have many methods that it could
    invoke.


    OBJECT PROPERTY


    In JavaScript, to access the age of the dog, it looks like this.


    sparky.age; // 10


    OBJECT METHOD


    If Sparky wants to bark, a method called bark would be invoked.


    sparky.bark(); // ''ruff ruff!''


    Notice how bark looks similar to a function call? That’s because methods are actually
    functions! Methods are functions that are specific to an object instance. They
    can’t be used on anything else.


    [JavaScript Object Implementation](#index_split_000.html_p7)


    In order to leverage the power of objects, we have to learn the full JavaScript
    syntax to write them.


    CONSTRUCTOR FUNCTION


    In JavaScript, functions are dual-purpose. They can be used as normal functions
    to invoke code, which you have already learned, and they can be used as a constructor
    function. A constructor is a function that is called to create an object instance.


    This is where pascal case, with the first letter of every word capitalized, is
    the accepted convention.


    function Dog() {


    }


    For object instances, the keyword new is needed in front of the function invocation.


    var sparky = new Dog();


    OBJECT PROPERTY


    Adding an object property is essentially the same as adding a key-value pair.
    Except it is done in a constructor function.


    function Dog() {


    this.age = 10;


    }


    var sparky = new Dog();


    sparky.age; // 10


    Wait! What is this variable, this? Well, it is a secret variable that is automatically
    created by a function. It has some important properties when it comes to object-oriented
    programming. Most important, this can be assigned key-value pairs.


    OBJECT METHODS


    In JavaScript, functions also have a secret property named prototype. Its duty
    is to store


    ![Image 44](index-100_1.jpg)


    methods that the function will have available to the object instance. To create
    methods, the function expression syntax is required.


    function Dog() {


    }


    Dog.prototype.bark = function() {


    console.log(''ruff ruff!'');


    };


    var sparky = new Dog();


    sparky.bark(); // ''ruff ruff!''


    INSTANCE VARIABLE


    Now that you have knowledge of the basic syntax, we should talk about the secret
    variable this. It is available in a constructor function. Key-value pairs can
    be added to this. The key-value pairs that are added to this are commonly referred
    to as instance variables.


    function Dog() {


    this.name = ''sparky'';


    }


    Dog.prototype.speak = function() {


    console.log(''ruff ruff, my name is'' + this.name);


    };


    var sparky = new Dog();


    sparky.speak(); // ''ruff ruff, my name is sparky''


    For now, ignore the fact that this dog can speak English. You are more interested
    in the fact that this.name, created in the constructor, is magically available
    in a method.


    This is extremely important to remember: Any method that has been assigned to
    Dog.prototype has the variable this available to it.


    INSTANCE VARIABLE MODIFICATION


    Since this is available in every method, instance variables can be modified in
    methods as well.


    function Dog() {


    this.name = ''sparky'';


    this.age = 0


    }


    Dog.prototype.growOlder = function() {


    this.age += 1


    };


    var sparky = new Dog();


    sparky.age // 0


    sparky.growOlder();


    sparky.age // 1


    HACKER HINT


    Instance variables can be created in methods as well, but it is not encouraged.
    In a majority of situations, there are better ways the code could be written.


    [Object-Oriented Programming in Action](#index_split_000.html_p7)


    Seeing is believing, so build your understanding of object-oriented programming
    with a JavaScript Dog whose abilities will match real-life dogs.


    DOG PROPERTIES


    In order to make an object instance, a constructor function is required.


    function Dog() {


    }


    var sparky = new Dog();


    This is pretty boring and doesn’t tell you much about dogs. There are so many
    aspects of dogs that you likely want your object to know about. This can be done
    by making them instance variables. A dog’s name, age, weight, and legCount can
    be stored. A typical dog has 4 legs. But name, age, and weight vary among dogs.
    Add them as parameters in our constructor function.


    function Dog(name, age, weight) {


    }


    In order to track data in each Dog instance, add these values as key-value pairs
    to this.


    function Dog(name, age, weight) {


    this.name = name;


    this.age = age;


    this.weight = weight;


    this.legCount = 4;


    }


    var sparky = new Dog(''sparky'', 4, 20);


    var misu = new Dog(''misu'', 10, 15);


    sparky.name; // ''sparky''


    sparky.weight; // ''20''


    misu.name; // ''misu''


    misu.weight; // 15


    Great! Now that you understand how to use constructor functions to create object
    instances, you have two independent dogs with their respective names, ages, and
    weights.


    DOG METHODS


    Currently, these dogs don’t know how to do anything. To change that, add a few
    methods.


    First, dogs should be able to eat food. Add an eat method.


    Dog.prototype.eat = function() {


    console.log(''nom nom nom'');


    };


    var sparky = new Dog(''sparky'', 4, 20);


    sparky.eat(); // ''nom nom nom''


    When a dog eats too much, it will gain weight. A method can be written to represent
    this. Just like with any function, methods can accept parameters.


    Then, add a parameter that represents the amount of weight gained from overeating.


    Dog.prototype.eatTooMuch = function(weightGain) {


    console.log(''ugh... '' + this.name + '' doesn\''t feel so good''); this.weight
    += weightGain;


    };


    var sparky = new Dog(''sparky'', 4, 20);


    sparky.weight; // 20


    sparky.eatTooMuch(2); // ''ugh . . . sparky doesn''t feel so good''


    sparky.weight; // 22


    It’s important to remember that this is available to us in all methods that are
    assigned to our constructor function, Dog. The eatTooMuch method is able to modify
    the dog’s weight.


    Methods are functions with modified syntax. You have used functions extensively
    for calculations. You can do the same again here. Make a method that computes
    a dog’s age in dog years, like ageInDogYears method. The rule of thumb to equate
    a human age to a dog’s is to multiply by seven.


    Dog.prototype.ageInDogYears = function(weightGain) {


    return this.age * 7;


    };


    var sparky = new Dog(''sparky'', 4, 20);


    sparky.ageInDogYears(); // 28


    But wait! Sparky has decided to be greedy and is now stealing food from a feline
    friend. In a new stealCatFood method, you can express the facts that Sparky has
    consumed food and is being mischievous in the process.


    Methods can be called inside other methods. An eat method has already been created,
    so you can reuse it. In order to express the mischievous nature of the canine,
    an extra console.log message can also be shown.


    Dog.prototype.eat = function() {


    console.log(''nom nom nom'');


    };


    Dog.prototype.stealCatFood = function() {


    this.eat();


    console.log(''Yuck, cat food is gross!'');


    };


    var sparky = new Dog(''sparky'', 4, 20);


    sparky.stealCatFood();


    // ''nom nom nom''


    // ''Yuck, cat food is gross!''


    When calling a method inside another method, prototype is never referenced. It
    is this.eat. Not this.prototype.eat.


    HACKER HINT


    Creating a method is a straightforward way of breaking up a complex method. It
    is encouraged to make new, smaller methods, even if the method itself is not used
    anywhere else or by any object instances.


    [Crack the Code](#index_split_000.html_p7)


    As the complexity of the programming tools and principles increases, it gets harder
    to mentally keep track of everything. You have reached a point where online resources
    are your best friend! Don’t be shy about going online to discover more insight
    on the topics covered in this chapter. Some suggested resources are listed in
    the back of this book.


    [1.](#index_split_001.html_p188) Define what an object data structure is.


    [2.](#index_split_001.html_p188) Define what an object is in object-oriented programming.


    [3.](#index_split_001.html_p188) What variable is available across all methods?'
