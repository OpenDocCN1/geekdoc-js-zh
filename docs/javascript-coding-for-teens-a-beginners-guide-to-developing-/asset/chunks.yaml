    # 第 1 章](#index_split_000.html_p5)


    ## 欢迎学习 JavaScript 编程


    编程是将人类创造力与计算机可以理解的原始逻辑相结合的艺术。后者才是真正的挑战。你的一生都在像人类一样思考，但编程要求你像计算机一样思考。这听起来可能很困难，但你可以做到的。我会在这里提供帮助！编程可以帮助解决其他方法无法解决的问题。它可以执行复杂的计算、自动化流程，并完成人类大脑单独无法处理的任务。


    编程语言是一种把人类指令翻译成计算机可以理解的内容的特定工具。世界上有很多语言，它们都有自己的优缺点。但归根结底，它们做的是同一件事：与计算机交谈。对于这本书来说，选择的编程语言将是
    `JavaScript`。


    ### 为什么选择 JavaScript?


    `JavaScript` 是一种最初为开发网站而设计的编程语言。网页上 90% 以上的内容由 `JavaScript` 驱动。它的应用已经从最初的使用扩展到非常广泛。`JavaScript`
    现在是最热门的学习语言之一。


    `JavaScript` 也是任何志向程序员的绝佳入门点。许多编程语言需要深入理解计算机的工作原理。而 `JavaScript` 则为你处理了许多许多细节。


    ### 什么是程序？


    代码通过解决问题来改善现代生活。程序是解决问题的代码集合。程序的概念是非常的。程序有各种形状、大小和用途。它们无处不在。


    - Windows 和 macOS 等操作系统

    - 移动应用

    - 浏览器


    世界围绕代码。程序在后台运行。我相信你已经知道了日常生活中使用的许多程序。


    - 什么是控制社区电网的？

    - 汽车用什么转向？

    - 可以通过手机表面访问有趣的猫图片吗？


    这些现代成就是通过创建和利用程序实现的。最早的网站不是程序。但现在绝大多数都是。对历史的简要回顾可以解释原因。


    ### HTML


    超文本标记语言（`HTML`）的出现标志着在浏览器中进行视觉呈现的开始。这些网站非常枯燥。它们没有特殊的字体、颜色或动画。`HTML` 只是“东西”。


    任何意义上都不是动态的。只有纯文本、图像和点击链接。从这个意义上说，它们不是程序。


    是的，`HTML` 中的“L”代表“语言”。但 `HTML` 不是编程语言。它是一种在浏览器上表示内容的良好结构的方法。


    ### CSS


    级联样式表（`CSS`）是增强 `HTML` 的补充代码。


    `CSS` 的引入确实让事情变得有趣。它让枯燥的文本、图像和布局焕然一新。它允许非垂直的内容布局，以及更丰富的色彩和优秀的字体。


    ### JAVCRIPT


    编程语言很快被引入其中，那是美好事物的开始。多种编程语言竞争成为网页浏览器的权威编程语言。`JavaScript` 摧毁了竞争对手。将编程语言嵌入网站功能中只是开始。


    `JavaScript` 首先是一个编程语言。但它包含了一套 Web 特定的功能，可以轻松操纵网站内容。在书的结尾处有一个 `JavaScript` 如何在网站上发挥魔法的概述。


    `HTML` 非常容易学习。它不像 `JavaScript` 那么复杂，但它仍在本书的范围内。本书会在需要时提供 `HTML` 代码段。`CSS` 和 `HTML`
    一样不会被涵盖，但会提供代码。在书中出现时，`HTML` 和 `CSS` 代码将被清晰标出。



