  trans: "\n现在，你需要找到某个玩家是否参加过某场比赛。对象中有一个 `players` 键。目标是检查该玩家是否存在于数组中。你立刻知道\n\n![Image\
    \ 31](img/index-72_1.jpg)\n\n需要一个 for 循环。该数组嵌套在对象中，因此必须通过它的键名 `players` 来访问。还需要检查该玩家是否参加了该比赛。用编程术语来表达，这需要一个\
    \ `if` 条件。\n\n```javascript\nfunction playedInTournament(tournament, player) {\n\
    \n  var players = tournament.players;\n\n  for (var i = 0; i < players.length;\
    \ i++) {\n\n    var currentPlayer = players[i];\n\n    if (currentPlayer === player)\
    \ {\n\n    }\n  }\n\n}\n```\n\n如果 `currentPlayer` 是要检查的玩家，则返回 `true`。但在什么时候应该返回\
    \ `false` 呢？如果检查完了数组中的所有玩家，这意味着该玩家完全没有被找到。在函数的最后，返回 `false`。\n\n```javascript\n\
    // tournament.js\n\nfunction playedInTournament(tournament, player) {\n\n  var\
    \ players = tournament.players;\n\n  for (var i = 0; i < players.length; i++)\
    \ {\n\n    var currentPlayer = players[i];\n\n    if (currentPlayer === player)\
    \ {\n\n      return true;\n\n    }\n  }\n\n  return false;\n\n}\n```\n\n是时候验证代码了。为了做到这一点，你需要一个\
    \ `console.log` 来让函数数据出现在终端。我将文件命名为 `tournament.js`。\n\n```javascript\nvar sampleTournament\
    \ = {\n\n  win: true,\n\n  players: ['smirk', 'knight', 'fly']\n};\n\nconsole.log(playedInTournament(sampleTournament,\
    \ 'smirk')); console.log(playedInTournament(sampleTournament, 'superb'));\n```\n\
    \n看起来不错！在 `sampleTournament` 对象中，`smirk` 参加了比赛，但 `superb` 没有。\n\n从文件中删除两个 `console.log`\
    \ 语句和数据结构 `sampleTournament`。今后它们将不再需要了。\n\n### 黑客提示\n\n为了防止混淆，写一个表格来跟踪每次迭代中发生的情况。\n\
    \n#### 数据结构嵌套数据结构\n\n对于随后的练习，需要一个比赛结果列表。在每个比赛结果中，我们还需要一个参加该比赛的玩家列表。\n\n将此数据结构添加到文件中。\n\
    \n```javascript\nvar tournaments = [\n\n  { win: true, players: ['smirk', 'knight',\
    \ 'fly'] },\n\n  { win: true, players: ['superb', 'san', 'tired'] },\n\n  { win:\
    \ true, players: ['smirk', 'knight', 'tired'] },\n\n  { win: false, players: ['san',\
    \ 'superb', 'fly'] },\n\n  { win: true, players: ['smirk', 'san', 'fly'] },\n\n\
    \  { win: false, players: ['superb', 'knight', 'tired'] },\n];\n```\n\n### 参加比赛的次数\n\
    \n玩家参与的数据在 `tournaments` 数组中。对于一个数据数组，显然需要一个循环。\n\n```javascript\nfunction tournamentsPlayed(tournaments,\
    \ player) {\n\n  var playCount = 0;\n\n  for (var i = 0; i < tournaments.length;\
    \ i++) {\n\n    var currentTournament = tournaments[i];\n\n  }\n\n  return playCount;\n\
    \n}\n```\n\n这一次，你需要检查玩家是否参加了该比赛。不仅如此，你必须记录这种情况发生的次数。确定一个玩家是否参加了某场特定的比赛是一项大量工作。每个比赛条目都需要搜索内部数组。但这个问题已经在\
    \ `playedInTournament` 中解决了。可以重用该函数。\n\n![Image 32](img/index-74_1.jpg)\n\n```javascript\n\
    var currentTournament = tournaments[i];\n\nvar playerDidPlay = playedInTournament(currentTournament,\
    \ player);\n\nif (playerDidPlay) {\n\n  playCount += 1;\n\n}\n```\n\n通过 `console.log`\
    \ 运行并验证代码。\n\n```javascript\nconsole.log(tournamentsPlayed(tournaments, 'smirk'));\n\
    \nconsole.log(tournamentsPlayed(tournaments, 'superb'));\n```\n\n看起来不错。`smirk`\
    \ 和 `superb` 都参加了三场比赛。现在这些 `console.log` 语句可以删除了。\n\n### 赢得比赛的次数\n\n现在，更进一步。检查并查看特定玩家参加过团队获胜比赛的次数。为了清楚地做到这一点，你需要：\n\
    1. 一个循环\n2. 一个累加变量来跟踪获胜的比赛次数\n\n```javascript\nfunction tournamentsWon(tournaments,\
    \ player) {\n\n  var winCount = 0;\n\n  for (var i = 0; i < tournaments.length;\
    \ i++) {\n\n    var currentTournament = tournaments[i];\n\n  }\n\n  return winCount;\n\
    \n}\n```\n\n与 `gamesPlayed` 相比情况有点不同。需要两个条件：\n1. 玩家参加了比赛\n2. 团队获胜了\n\n幸运的是，`playedInTournament`\
    \ 可以用于第一个条件。对于第二个条件，每个条目都有比赛结果，位于键 `win` 中。只有当该特定玩家参加时，两个条件都为真，才能将该场比赛计为胜利。在这一\n\
    \n![Image 33](img/index-75_1.jpg)\n\n![Image 34](img/index-75_2.jpg)\n\n在这种情况下，使用\
    \ AND 运算符 `&&` 来同时断言这两个条件。\n\n```javascript\nfunction tournamentsWon(tournaments,\
    \ player) {\n\n  var winCount = 0;\n\n  for (var i = 0; i < tournaments.length;\
    \ i++) {\n\n    var currentTournament = tournaments[i];\n\n    var playerDidPlay\
    \ = playedInTournament(currentTournament, player);\n\n    var tournamentWon =\
    \ currentTournament.win;\n\n    if (playerDidPlay && tournamentWon) {\n\n    \
    \  winCount += 1;\n\n    }\n  }\n\n  return winCount;\n\n}\n```\n\n用 `console.log`\
    \ 验证代码。\n\n```javascript\nconsole.log(tournamentsWon(tournaments, 'smirk'));\n\
    \nconsole.log(tournamentsWon(tournaments, 'superb'));\n```\n\n看起来不错！看起来 `smirk`\
    \ 赢得了三场比赛，而 `superb` 赢了一场。\n\n### 玩家胜率\n\n现在你对确定胜率感兴趣。要解决这个问题，将获胜次数除以比赛次数。需要编写的算法很容易，因为两者都已经解决了！为了输出更整洁，将使用\
    \ `parseInt`。它将小数转换为整数。\n\n```javascript\nfunction playerWinRate(tournaments,\
    \ player) {\n\n  var total = tournamentsPlayed(tournaments, player);\n\n  var\
    \ won = tournamentsWon(tournaments, player);\n\n  var percentage = (won / total)\
    \ * 100;\n\n![Image 35](img/index-76_1.jpg)\n\n  return parseInt(percentage);\n\
    }\n```\n\n让我们验证。\n\n```javascript\nconsole.log(playerWinRate(tournaments, 'smirk'));\n\
    \nconsole.log(playerWinRate(tournaments, 'superb'));\n```\n\n看起来 `smirk` 有完美的胜率，而\
    \ `superb` 是 33%。\n\n### 谁应该参加？\n\n噢不！看起来两个玩家之间存在争议。看起来 `smirk` 和 `superb` 都想参加下一场比赛，但位置只有一个。为了解决这个问题，管理层决定检查相应玩家参赛时的表现。管理层不是程序员，他们不想看到两个数字。他们想看到关于谁应该参加、谁应该替补的消息。\n\
    \n到目前为止，你解决了许多挑战。许多简单的函数被编写并组合在一起解决棘手的挑战。最后一个！\n\n已经有一个计算每个玩家胜率的函数。只需比较胜率即可发现谁参加下一场比赛。这次需要三个参数：\n\
    1. 团队的比赛表现及其活跃玩家\n2. 一个玩家\n3. 另一个用于比较的玩家\n\n```javascript\nfunction whoShouldPlay(tournaments,\
    \ player1, player2) {\n\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
    \n  var player2WinRate = playerWinRate(tournaments, player2);\n}\n```\n\n这一次，你想要打印两个漂亮的消息。跟踪谁将成为替补，谁将成为活跃玩家。如果\
    \ `player1` 的胜率更高，他们应该是活跃玩家，而 `player2` 应该是替补。\n\n```javascript\nfunction whoShouldPlay(tournaments,\
    \ player1, player2) {\n\n  var player1WinRate = playerWinRate(tournaments, player1);\n\
    \n  var player2WinRate = playerWinRate(tournaments, player2);\n\n![Image 36](img/index-77_1.jpg)\n\
    \n  var benchedPlayer;\n\n  var activePlayer;\n\n  if (player1WinRate > player2WinRate)\
