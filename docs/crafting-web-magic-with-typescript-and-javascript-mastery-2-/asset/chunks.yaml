    \ 魔法**\n\nWebSocket 是一种神奇的技术，能够实现客户端与服务器之间的实时通信。TypeScript 可以帮助你运用这项技术，创建沉浸式且交互性强的体验。\n\
    \n想象一下实现一个实时聊天功能：\n\n```typescript\nimport WebSocket from \"ws\";\n\nconst wss\
