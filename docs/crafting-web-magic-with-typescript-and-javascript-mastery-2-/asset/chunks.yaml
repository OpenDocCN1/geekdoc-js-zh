  raw: 'Mapped types enable you to transform the properties of an existing type to
    create a new type. They''re like casting a spell that reshapes an object''s structure.


    Suppose you have a simple object and want to make all its properties optional:


    ```typescript


    type Optional<T> = { [K in keyof T]?: T[K] };


    ```


    Here, `Optional` is a mapped type that iterates over the keys of the input type
    `T` and makes each property optional.


    ### 4\. **Keyof and Lookup Types: Unlocking Doors**


    The `keyof` operator is your key to unlocking the doors of TypeScript''s type
    system. It allows you to create types that are based on the keys of an object.


    Let''s say you have a wizard with various spells:


    ```typescript


    type Wizard = {


    name: string;


    spells: string[];


    };


    type SpellType = keyof Wizard; // "name" | "spells"


    ```


    Here, `SpellType` is a type that can only be `"name"` or `"spells"`, based on
    the keys of the `Wizard` type.


    Additionally, you can use lookup types to access the types of specific properties:


    ```typescript


    type NameType = Wizard["name"]; // string


    ```


    ### 5\. **Indexed Access Types: Delving into Properties**


    Indexed access types are like incantations that reveal the type of a specific
    property within another type.


    Consider an interface with a property `spells`:


    ```typescript


    interface Wizard {


    spells: string[];


    }


    type SpellArrayType = Wizard["spells"]; // string[]


    ```


    Here, `SpellArrayType` extracts the type of the `spells` property within the `Wizard`
    interface.


    ### 6\. **Infer: Extracting Types from Functions**


    The `infer` keyword is your ally when extracting types from functions, particularly
    when working with higher-order functions like mapping.


    Imagine a function that infers the return type of another function:


    ```typescript


    function getResult<T>(fn: () => T): T {


    return fn();


    }


    const result = getResult(() => "magic"); // result is inferred as string


    ```


    In this example, `getResult` infers the return type of the provided function and
    applies it to the variable `result`.


    ### Conclusion


    As we conclude this chapter, you''ve unveiled the magic of advanced TypeScript
    concepts. Generics, conditional types, mapped types, keyof, lookup types, indexed
    access types, and infer are the spells that allow you to shape and manipulate
    types with finesse. Armed with this knowledge, you''re ready to tackle complex
    scenarios, build highly flexible code, and cast spells of transformation.


    With these advanced concepts at your disposal, you''re on the path to becoming
    a true master of TypeScript. The magic continues in the upcoming chapters, where
    we''ll dive into the realms of frontend and backend development, wielding TypeScript''s
    power to craft captivating web applications.


    Prepare to embark on a journey filled with even more enchantment, innovation,
    and discovery. Your mastery of TypeScript is taking flight, and the web development
    world will never be the same.


