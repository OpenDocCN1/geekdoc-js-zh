    ## 对象：捆绑数据与函数


    在 JavaScript 中，对象是复合数据类型，允许我们表示具有属性（数据）和方法（函数）的实体。对象提供了一种极好的方式来组织相关的数据和行为，使代码更加结构化和可读。


    ### 对象字面量：


