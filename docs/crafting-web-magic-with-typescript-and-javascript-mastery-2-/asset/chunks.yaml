    ### 3. Dependency Injection: Magical Composition


    Dependency injection is a technique where components are provided with their dependencies
    from external sources. It''s like weaving different magical elements together
    to create a spell.


    Imagine using dependency injection:


    ```typescript


    class SpellBook {


    constructor(private spell: Spell) {}


    castSpell() {


