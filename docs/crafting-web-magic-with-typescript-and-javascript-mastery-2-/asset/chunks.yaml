    ## Handling Events:


    Events are actions that occur on a web page, such as clicking a button, hovering
    over an element, or submitting a form. JavaScript allows us to handle these events
    and execute specific code when an event occurs.


    ### Event Listeners:


    We can add event listeners to DOM elements to listen for specific events and execute
    corresponding functions.


    ```html


    <!-- Example HTML -->


    <button id="btn">Click Me</button>


    ```


    ```javascript


    // Example JavaScript


    const buttonElement = document.getElementById("btn");


    buttonElement.addEventListener("click", function() {


    console.log("Button clicked!");


    });


    ```


    In the above example, we add a click event listener to the button element, and
    when the button is clicked, the specified function is executed.


    ### Common DOM Events:


    There are many events available to handle different interactions on a web page,
    including:


    - `click`: Occurs when an element is clicked.


    - `mouseover`: Occurs when the mouse pointer is over an element.


    - `mouseout`: Occurs when the mouse pointer leaves an element.


    - `keyup`: Occurs when a key is released on the keyboard.


    - `submit`: Occurs when a form is submitted.


    - `change`: Occurs when the value of an input element is changed.


    ```javascript


    // Example JavaScript


    const inputElement = document.getElementById("input");


    inputElement.addEventListener("keyup", function() {


    console.log("Input value changed!");


    });


    ```


    In the above example, we add a `keyup` event listener to an input element, and
    when a key is released in the input, the specified function is executed.


    ### Event Propagation: Bubbling and Capturing


    Events in the DOM follow a process called event propagation, which includes two
    phases: capturing and bubbling. During the capturing phase, the event is triggered
    on the ancestor elements before reaching the target element. During the bubbling
    phase, the event is triggered on the target element and then propagated to its
    ancestor elements.


    ```html


    <!-- Example HTML -->


    <div id="outer">


    <div id="inner">


    Click Me


    </div>


    </div>


    ```


    ```javascript


    // Example JavaScript


    const outerElement = document.getElementById("outer");


    const innerElement = document.getElementById("inner");


    outerElement.addEventListener("click", function() {


    console.log("Outer clicked!");


    }, true);


    innerElement.addEventListener("click", function() {


    console.log("Inner clicked!");


    });


    ```


    In the above example, we have two nested `div` elements. We add a click event
    listener to both elements, and the outer element listens during the capturing
    phase (`useCapture` set to `true`). When we click on the inner element, the output
    will be:


    ```


    Outer clicked!


    Inner clicked!


    ```


    ### Event Delegation:


    Event delegation is a technique where we add a single event listener to a parent
    element to handle events for its child elements. It is useful when we have dynamically
    added elements or a large number of elements.


    ```html


    <!-- Example HTML -->


    <ul id="list">


    <li>Item 1</li>


    <li>Item 2</li>


    <li>Item 3</li>


    </ul>


    ```


    ```javascript


    // Example JavaScript


    const listElement = document.getElementById("list");


    listElement.addEventListener("click", function(event) {


    if (event.target.tagName === "LI") {


    console.log("Item clicked:", event.target.textContent);


    }


    });


    ```


    In the above example, we add a click event listener to the `ul` element (parent).
    When we click on any of the `li` elements (children), the output will be:


    ```


    Item clicked: Item 1


    Item clicked: Item 2


    Item clicked: Item 3


    ```


