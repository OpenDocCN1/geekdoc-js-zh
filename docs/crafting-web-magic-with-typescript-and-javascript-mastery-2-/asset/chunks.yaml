    ## The DOM: Document Object Model


    The Document Object Model (DOM) is a programming interface for HTML and XML documents,
    providing a structured representation of a web page. The DOM represents the elements
    on a web page as objects, allowing us to access, modify, and manipulate them using
    JavaScript.


    ### Accessing DOM Elements:


    We can access DOM elements using various methods provided by JavaScript, such
    as `getElementById()`, `getElementsByClassName()`, `getElementsByTagName()`, and
    `querySelector()`.


    ```html


    <!-- Example HTML -->


    <!DOCTYPE html>


    <html>


    <head>


    <title>DOM Manipulation</title>


    </head>


    <body>


    <h1 id="title">Welcome to DOM Manipulation!</h1>


    <p class="content">This is a paragraph.</p>


    <ul>


    <li>Item 1</li>


    <li>Item 2</li>


    <li>Item 3</li>


    </ul>


    </body>


    </html>


    ```


    ```javascript


    // Example JavaScript


    const titleElement = document.getElementById("title");


    const contentElements = document.getElementsByClassName("content");


    const liElements = document.getElementsByTagName("li");


    const firstLiElement = document.querySelector("li");


    ```


    In the above examples, we access DOM elements with the IDs "title," the class
    name "content," the tag name "li," and the first "li" element using different
    DOM methods.


    ### Modifying DOM Elements:


    Once we have accessed DOM elements, we can modify their properties, attributes,
    and content using JavaScript.


    ```javascript


    // Example JavaScript


    titleElement.innerHTML = "New Title";


    contentElements[0].style.color = "red";


    liElements[2].textContent = "Updated Item 3";


    firstLiElement.classList.add("active");'
