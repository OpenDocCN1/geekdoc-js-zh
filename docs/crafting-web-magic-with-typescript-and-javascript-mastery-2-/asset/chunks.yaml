    type NameType = Wizard[\"name\"]; // string\n```\n\n### 5\\. **索引访问类型：深入属性**\n\
    \n索引访问类型就像揭示另一个类型中特定属性类型的咒语。\n\n考虑一个包含 `spells` 属性的接口：\n\n```typescript\ninterface\
