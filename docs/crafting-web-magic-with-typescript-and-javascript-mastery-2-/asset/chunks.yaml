    ## Objects: Bundling Data and Functions


    In JavaScript, objects are composite data types that allow us to represent entities
    with properties (data) and methods (functions) associated with them. Objects provide
    an excellent way to organize related data and behavior together, making the code
    more structured and readable.


    ### Object Literals:


    The simplest way to create an object is by using object literals, denoted by curly
    braces `{}`.


    ```javascript


    // Example 1: Object literal


    const person = {


    name: "John Doe",


    age: 30,


    occupation: "Software Engineer",


    greet: function() {


    console.log("Hello, I am " + this.name);


    }


    };


    ```


    In Example 1, we define an object `person` with properties `name`, `age`, and
    `occupation`, along with a method `greet()` that prints a greeting.


    ### Accessing Object Properties:


    We can access object properties using dot notation or square brackets notation.


    ```javascript


    // Example 2: Accessing object properties


    console.log(person.name); // Output: "John Doe"


    console.log(person["age"]); // Output: 30


    ```


    In Example 2, we access the `name` property using dot notation and the `age` property
    using square brackets notation.


    ### Adding and Modifying Object Properties:


    We can add new properties or modify existing properties of an object at runtime.


    ```javascript


    // Example 3: Adding and modifying object properties


    person.location = "New York";


    person.age = 31;


    console.log(person); // Output: { name: ''John Doe'', age: 31, occupation: ''Software
    Engineer'', greet: [Function] }


    ```


    In Example 3, we add the `location` property and modify the `age` property of
    the `person` object.


    ### Object Methods:


    Objects can also contain methods, which are functions associated with the object.


    ```javascript


    // Example 4: Object methods


    person.sayHello = function() {


    console.log("Hello, I am " + this.name);


    };


    person.sayHello(); // Output: "Hello, I am John Doe"


    ```


