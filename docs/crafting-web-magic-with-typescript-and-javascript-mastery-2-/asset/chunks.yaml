    \ 允许客户端指定他们想要检索的确切数据，从而使其更高效、更灵活。\n\n### 3. API 请求与响应\n\n在与 API 交互时，开发者向 API 的端点发送请求，指定所需操作和任何必要的数据。API\
    \ 处理请求并返回响应，其中包含请求的数据或有关操作成功或失败的信息。\n\n#### a. HTTP 方法\n\nAPI 请求通常使用标准的 HTTP 方法：\n\
    \n- GET：用于从服务器检索数据。\n- POST：用于向服务器发送数据以创建新资源。\n- PUT：用于更新服务器上的现有资源。\n- DELETE：用于从服务器删除资源。\n\
    \n#### b. 请求头\n\n请求头提供有关请求的附加信息，例如身份验证令牌、内容类型和用户代理详细信息。\n\n#### c. 请求参数\n\n请求参数用于在\
