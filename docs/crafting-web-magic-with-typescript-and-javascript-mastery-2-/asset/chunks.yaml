    at least once because the condition is checked after the first iteration.


    ### break and continue Statements:


    The `break` statement allows you to exit a loop prematurely if a certain condition
    is met. The `continue` statement allows you to skip the rest of the current iteration
    and move to the next iteration.


    ```javascript

    // Example 18: Using the break and continue statements

    for (let i = 1; i <= 10; i++) {

    if (i === 5) {

    break; // Exit the loop when i is 5

    }

    if (i === 3) {

    continue; // Skip the rest of the current iteration when i is 3

    }

    console.log("Value of i: " + i);

    }

    ```


    In Example 18, the `break` statement is used to exit the loop when `i` is equal
    to 5, and the `continue` statement is used to skip the rest of the code for the
    current iteration when `i` is equal to 3.


