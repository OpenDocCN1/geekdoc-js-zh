    .catch((error) => console.log("Error:", error));

    ```


    在上述示例中，我们将 API 密钥作为查询参数包含在请求 URL 中。


    ### b. OAuth：


    OAuth（开放授权）是一种更安全、更复杂的认证协议，用于代表用户访问第三方 API。


    ## 6\. 处理分页和过滤


    API 通常会返回大量数据，需要分页或过滤以高效地检索特定信息。


    ### a. 分页：


    分页允许你按块或页检索数据，从而减少每次请求传输的数据量。


    ```javascript

    // 示例 5：使用 Fetch API 进行分页

    const page = 2;

    const pageSize = 10;

    fetch(`https://api.example.com/data?page=${page}&pageSize=${pageSize}`)

    .then((response) => response.json())

    .then((data) => console.log(data))

    .catch((error) => console.log("Error:", error));

    ```


    在上述示例中，我们使用分页请求第二页数据，每页大小为 10。


    ### b. 过滤：


    过滤允许你指定条件，以检索符合特定条件的数据。


    ```javascript

    // 示例 6：使用 Fetch API 进行过滤

    const category = "electronics";

    fetch(`https://api.example.com/data?category=${category}`)

    .then((response) => response.json())

    .then((data) => console.log(data))

    .catch((error) => console.log("Error:", error));

    ```


    在上述示例中，我们使用过滤请求与“electronics”类别相关的数据。


    ## 7\. CORS（跨域资源共享）


    CORS 是 Web 浏览器实现的一项安全功能，用于阻止网页向提供该网页的域以外的域发起请求。API 可能需要支持 CORS，以允许来自其他域的请求。


    ## 8\. 使用 API 进行错误处理


    在使用 API 时，优雅地处理错误并为用户提供有意义的反馈至关重要。


    ```javascript

    // 示例 7：使用 Fetch API 处理错误

    fetch("https://api.example.com/data")

    .then((response) => {

    if (!response.ok) {

    throw new Error("Network response was not ok");

    }

    return response.json();

    })

    .then((data) => console.log(data))

    .catch((error) => console.log("Error:", error));

    ```


    在上述示例中，我们使用 `Fetch API` 处理错误，如果网络响应不正常则抛出错误。


    ## 9\. API 最佳实践


    在使用 API 时，请考虑以下最佳实践：


    - 始终使用安全的 HTTPS 发起 API 请求，以确保数据隐私和安全。

    - 实现适当的错误处理，为用户提供有意义的反馈。

    - 遵守 API 提供者设置的速率限制和使用配额，以避免被屏蔽。

    - 在适当的情况下缓存 API 响应，以减少不必要的请求并提高性能。

    - 尽量减少 API 返回的数据量，以降低带宽使用并提高效率。


    ## 结论：


    在本章中，我们探索了 API 的世界，这对于 Web 开发者与外部服务交互以及从远程服务器获取数据至关重要。我们了解了不同类型的 API，例如 Web API、RESTful
    API、SOAP API 和 GraphQL API，以及它们各自的用途。


    我们探讨了使用 JavaScript 消费 API 的各种方法，包括 `Fetch API`、`XMLHttpRequest` 和 `Axios`。这些方法使我们能够高效地发起
    HTTP 请求并处理响应。


    此外，我们还讨论了使用 API 密钥和 OAuth 进行 API 认证，以及如何使用分页和过滤从 API 中检索特定数据。我们简要介绍了 CORS 以及与
    API 交互时错误处理的重要性。


    通过掌握 API 概念和集成技术，你可以构建强大且动态的 Web 应用程序，利用外部服务和数据源。随着你作为 Web 开发者的旅程继续，请练习使用 API
    以获得实践经验并提高技能。


    # 第 12 章：前端框架：React


    在快速发展的 Web 开发世界中，前端框架在简化构建现代交互式用户界面的过程中发挥着重要作用。在这些框架中，React 脱颖而出，成为构建 Web 应用程序最流行且广泛使用的库之一。React
    由 Facebook 开发和维护，因其简单性、可重用性和性能而在 Web 开发社区中获得了巨大的关注。在本章中，我们将探讨 React、其关键概念，以及如何使用这个强大的前端库构建健壮且动态的
    Web 应用程序。


    ## 1\. 什么是 React？


    React 是一个用于构建用户界面的开源 JavaScript 库。它由 Facebook 的软件工程师 Jordan Walke 创建，并于 2011 年首次部署在
    Facebook 的新闻动态中。React 允许开发者构建可重用的 UI 组件，并高效地管理 Web 应用程序的状态。它遵循基于组件的架构，使得维护和扩展复杂应用程序更加容易。


    ## 2\. React 的关键概念


    为了更好地理解 React，让我们探讨其关键概念：


    ### a. 组件


    组件是 React 应用程序的构建块。组件是一个自包含且可重用的 UI 片段，可以组合起来形成 Web 应用程序的用户界面。组件可以是函数式组件或基于类的组件。


    ```jsx

    // 示例 1：函数式组件

    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }


    // 示例 2：基于类的组件

    class Greeting extends React.Component {

    render() {

    return <h1>Hello, {this.props.name}!</h1>;

    }

    }

    ```


    在上述示例中，我们定义了一个函数式组件和一个基于类的组件，它们显示一条问候消息。


    ### b. JSX（JavaScript XML）


    JSX 是 JavaScript 的一种语法扩展，在 React 中用于描述 UI 的外观。它允许开发者在 JavaScript 中编写类似 HTML 的代码，从而更容易创建
    UI 组件。


    ```jsx

    // 示例 3：使用 JSX

    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }

    ```


    在上述示例中，我们使用 JSX 创建了一个显示问候消息的组件。


    ### c. 状态和属性


    状态和属性是 React 中的两个基本概念。


    - 状态：状态表示组件的内部数据。它可以随时间变化，并由组件自身管理。为了处理状态，我们在函数式组件中使用 `useState` 钩子，或在基于类的组件中使用
    `setState` 方法。


    ```jsx

    ```


    '
