    console.log(a + b); // Output: 15


    console.log(a - b); // Output: 5


    console.log(a * b); // Output: 50


    console.log(a / b); // Output: 2


    console.log(a % b); // Output: 0


    ```


    ### Assignment Operators:


    Assignment operators are used to assign values to variables. The most common assignment
    operator is the equals sign (=).


    ```javascript


    // Example 6: Using assignment operator


    let x = 10;


    let y = 20;


    x = y;


    console.log(x); // Output: 20


    ```


    In Example 6, we assign the value of `y` to the variable `x` using the assignment
    operator (=).


    ### Comparison Operators:


    Comparison operators are used to compare two values and return a Boolean value
    (true or false) based on the comparison''s result.


    1\. **Equal to (==):** Checks if two values are equal, irrespective of their data
    types.


    2\. **Not equal to (!=):** Checks if two values are not equal.


    3\. **Strict equal to (===):** Checks if two values are equal and have the same
    data type.


    4\. **Strict not equal to (!==):** Checks if two values are not equal or have
    different data types.


    5\. **Greater than (>):** Checks if the value on the left is greater than the
    value on the right.


    6\. **Less than (<):** Checks if the value on the left is less than the value
    on the right.


    7\. **Greater than or equal to (>=):** Checks if the value on the left is greater
    than or equal to the value on the right.


    8\. **Less than or equal to (<=):** Checks if the value on the left is less than
    or equal to the value on the right.


    Let''s explore some examples:


    ```javascript


    // Example 7: Using comparison operators


    let num1 = 10;


    let num2 = 5;


    console.log(num1 == num2); // Output: false


    console.log(num1 != num2); // Output: true


    console.log(num1 === num2); // Output: false


    console.log(num1 !== num2); // Output: true


    console.log(num1 > num2); // Output: true


    console.log(num1 < num2); // Output: false


    console.log(num1 >= num2); // Output: true


    console.log(num1 <= num2); // Output: false


    ```


    ### Logical Operators:


    Logical operators are used to combine multiple conditions and return a Boolean
    value based on the result.


    1\. **Logical AND (&&):** Returns true if both conditions are true.


    2\. **Logical OR (||):** Returns true if at least one of the conditions is true.


    3\. **Logical NOT (!):** Reverses the result, turning true to false and false
    to true.


    Let''s see some examples:


    ```javascript


    // Example 8: Using logical operators


    let age = 25;


    let isStudent = true;


    console.log(age >= 18 && isStudent); // Output: true (Both conditions are true)


    console.log(age < 18 || isStudent); // Output: true (At least one condition is
    true)


    console.log(!isStudent); // Output: false (Reversing true to false)


    ```


    ### String Concatenation:


    In JavaScript, you can concatenate (combine) strings using the `+` operator.


    ```javascript


    // Example 9: String concatenation


    let firstName = "John";


    let lastName = "Doe";


    let fullName = firstName + " " + lastName;


    console.log(fullName); // Output: John Doe


    ```


    In Example 9, we concatenate the `firstName`, a space, and the `lastName` to create
    the `fullName` variable.


    ## Control Flow and Conditional Statements


    Control flow allows us to control the order in which statements are executed in
    a program. Conditional statements help us make decisions based on certain conditions,
    executing different blocks of code accordingly.


    ### if Statement:


    The `if` statement is a fundamental conditional statement that allows us to execute
    a block of code if a given condition is true.


    ```javascript


    // Example 10: Using the if statement


    let age = 25;


    if (age >= 18) {


    console.log("You are an adult.");


    }


    ```


    In Example 10, the code checks if the `age` is greater than or equal to 18\. If
    the condition is true, it prints "You are an adult."


    ### else Statement:


    The `else` statement works in conjunction with the `if` statement. It allows us
    to specify an alternative block of code to execute when the `if` condition is
    false.


    ```javascript


    // Example 11: Using the else statement


    let age = 15;


    if (age >= 18) {


    console.log("You are an adult.");


    } else {


    console.log("You are a minor.");


    }


    ```


    In Example 11, the code checks if the `age` is greater than or equal to 18\. If
    the condition is true, it prints "You are an adult." Otherwise, it prints "You
    are a minor."


    ### else if Statement:


    The `else if` statement can be used when multiple conditions need to be checked
    sequentially. It provides


    an alternative set of conditions to test if the previous `if` and `else` conditions
    are false.


    ```javascript


    // Example 12: Using the else if statement


    let time = 14;


    if (time < 12) {


    console.log("Good morning!");


    } else if (time < 18) {


    console.log("Good afternoon!");


    } else {


    console.log("Good evening!");


    }


    ```


    In Example 12, the code checks the value of `time` and prints different greetings
    based on the time of day.


    ### Nested if Statements:


    You can nest conditional statements inside each other to create complex decision-making
    logic.


    ```javascript


    // Example 13: Using nested if statements


    let age = 25;


    let isStudent = true;


    if (age >= 18) {


    if (isStudent) {


    console.log("You are an adult student.");


    } else {


    console.log("You are an adult.");


    }


    } else {


    console.log("You are a minor.");


    }


    ```


    In Example 13, the code checks if the `age` is greater than or equal to 18 and
    then checks if the person is a student or not.


    ### The ternary Operator (?):


    The ternary operator provides a shorthand way to write simple if-else statements.


    ```javascript


    // Example 14: Using the ternary operator


    let age = 25;


    let message = age >= 18 ? "You are an adult." : "You are a minor.";


    console.log(message); // Output: You are an adult.


    ```


    In Example 14, the ternary operator checks if the `age` is greater than or equal
    to 18\. If true, it assigns "You are an adult." to the `message` variable; otherwise,
    it assigns "You are a minor."


    ## Loops: Iterating with JavaScript


    Loops provide a way to execute a block of code repeatedly until a specific condition
    is met. There are several types of loops in JavaScript, but the most commonly
    used ones are the `for` loop and the `while` loop.


    ### for Loop:


    The `for` loop is useful when you know the exact number of iterations you want
    to perform.


    ```javascript


    // Example 15: Using the for loop


    for (let i = 1; i <= 5; i++) {


    console.log("Iteration: " + i);


    }


    ```


    In Example 15, the `for` loop executes the code inside the curly braces five times,
    as `i` starts at 1 and increments by 1 in each iteration until it reaches 5.


    ### while Loop:


    The `while` loop is used when you want to repeat a block of code until a specific
    condition becomes false.


    ```javascript


    // Example 16: Using the while loop


    let count = 0;


    while (count < 5) {


    console.log("Count: " + count);


    count++;


    }


    ```'
