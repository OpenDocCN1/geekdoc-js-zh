    # JAVASCRIPT


    ## 第 1 章：JavaScript 简介


    ### 什么是 JavaScript？


    JavaScript，通常缩写为 JS，是一种高级、动态且多功能的编程语言，用于构建交互式 Web 应用。由 Brendan Eich 于 1995 年创建，它迅速成为
    Web 上最流行的编程语言之一。最初设计用于为静态网页添加交互性，经过多年发展，它已成为一种能够处理复杂任务的成熟编程语言。


