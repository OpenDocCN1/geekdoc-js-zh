    ### Assigning Values to Variables


    You can assign values to variables using the assignment operator (`=`). This assigns
    the value on the right-hand side of the operator to the variable on the left-hand
    side.


    ```javascript

    // Example 3: Assigning values to variables

    let x = 10;

    let y = 20;

    console.log(x); // Output: 10

    console.log(y); // Output: 20

    ```


    ### Reassigning Variables


    Variables declared with `let` can be reassigned new values, while variables declared
    with `const` cannot be reassigned. Attempting to reassign a `const` variable will
    result in an error.


    ```javascript

    // Example 4: Reassigning variables with let

    let count = 5;

    count = 10;

    console.log(count); // Output: 10


    // Example 5: Attempting to reassign a const variable (will throw an error)

    const PI = 3.14;

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    ### Variable Scope


    Scope refers to the visibility or accessibility of variables within different
    parts of the code. In JavaScript, there are two main types of scope: global scope
    and local scope.


    #### Global Scope


    Variables declared outside any function or block have global scope, which means
    they can be accessed from anywhere within the code, including inside functions
    and blocks.


    ```javascript

    // Example 6: Global scope

    let globalVar = ''I am a global variable'';

    function myFunction() {

    console.log(globalVar); // Output: I am a global variable

    }

    myFunction();

    ```


    In Example 6, the variable `globalVar` has global scope and can be accessed from
    within the `myFunction` function.


    #### Local Scope


    Variables declared inside a function or block have local scope, which means they
    are only accessible within that specific function or block.


    ```javascript

    // Example 7: Local scope

    function myFunction() {

    let localVar = ''I am a local variable'';

    console.log(localVar); // Output: I am a local variable

    }

    myFunction();

    // console.log(localVar); // ReferenceError: localVar is not defined

    ```


    In Example 7, the variable `localVar` has local scope and can only be accessed
    from within the `myFunction` function. Attempting to access it outside the function
    will result in a `ReferenceError`.


    ### Hoisting


    Hoisting is a behavior in JavaScript where variable declarations (not the assignments)
    are moved to the top of their scope during the code execution. This means that
    you can use a variable before it''s declared without causing an error.


    ```javascript

    // Example 8: Hoisting

    console.log(name); // Output: undefined

    var name = ''John Doe'';

    console.log(name); // Output: John Doe

    ```


    In Example 8, the first `console.log` statement outputs `undefined` because the
    variable `name` is hoisted to the top of the scope, but its assignment (`name
    = ''John Doe''`) is not hoisted. Therefore, the variable exists but has no value
    until it''s assigned.


    ### Constants


    Constants, declared using the `const` keyword, are variables whose values cannot
    be changed once assigned. They have block scope, like variables declared with
    `let`, but are immutable.


    ```javascript

    // Example 9: Using constants

    const PI = 3.14;

    console.log(PI); // Output: 3.14


    // Attempting to reassign a constant (will throw an error)

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    In Example 9, `PI` is a constant with a value of `3.14`. Any attempt to reassign
    a new value to `PI` will result in a `TypeError`.


    ### Best Practices for Using Variables


    To write clean and maintainable code, follow these best practices when using variables:


    1. **Use Descriptive Names:** Choose meaningful names for variables that convey
    their purpose and content.

    2. **Declare Variables Before Use:** Always declare variables before using them
    to avoid hoisting-related issues.

    3. **Use `const` for Constants:** Prefer using `const` for variables whose values
    won''t change.

    4. **Use `let` for Mutable Variables:** Use `let` for variables that might change
    during the program execution.

    5. **Avoid Global Variables:** Minimize the use of global variables to prevent
    unintended side effects and maintain code modularity.

    6. **Initialize Variables:** Initialize variables with default values when declaring
    them to avoid unexpected behaviors.


    ## Working with Data Types and Variables


    Now that we understand the basics of data types and variables in JavaScript, let''s
    explore how to work with them effectively.


    ### Type Conversion


    Type conversion, also known as type casting, is the process of converting one
    data type to another. JavaScript provides several methods to convert data types:


    1. **String Conversion:** You can convert any data type to a string using the
    `toString()` method or the `String()` function.


    ```javascript

    // Example 10: String conversion

    let num = 42;

    let str = num.toString();

    console.log(str); // Output: "42"

    let value = true;

    let strValue = String(value);

    console.log(strValue); // Output: "true"

    ```


    2. **Number Conversion:** You can convert a string or a boolean value to a number
    using the `parseInt()` or `parseFloat()` methods, or the `Number()` function.


    ```javascript

    // Example 11: Number conversion

    let strNum = "42";

    let parsedNum = parseInt(strNum);

    console.log(parsedNum); // Output: 42

    let floatValue = "3.14";

    let parsedFloat = parseFloat(floatValue);

    console.log(parsedFloat); // Output: 3.14

    let boolValue = true;

    let numValue = Number(boolValue);

    console.log(numValue); // Output: 1

    ```


    3. **Boolean Conversion:** You can convert any value to a boolean using the `Boolean()`
    function.


    ```javascript

    // Example 12: Boolean conversion

    let numValue = 42;

    let boolValue = Boolean(numValue);

    console.log(boolValue); // Output: true

    let emptyString = "";

    let isEmpty = Boolean(emptyString);

    console.log(isEmpty); // Output: false

    ```


    ### Type Coercion


    Type coercion is the process of automatically converting one data type to another
    when performing operations or comparisons. JavaScript performs type coercion in
    certain situations to ensure that the operation can be completed.


    ```javascript

    // Example 13: Type coercion

    let result = 10 + "5";

    console.log(result); // Output: "105"

    ```


    In Example 13, the addition operation involves a number and a string. JavaScript
    performs type coercion and converts the number `10` to a string, resulting in
    the concatenation of `"10"` and `"5"`, which gives `"105"`.


    ### Understanding NaN and Type Checking


    `NaN` (Not-a-Number) is a special value representing the result of an invalid
    or undefined mathematical operation. It is considered a numeric data type but
    behaves differently than regular numbers.


    ```javascript

    // Example 14: NaN and type checking

    let result = "hello" - 5;

    console.log(result); // Output: NaN

    console.log(typeof NaN); // Output: "number"

    console.log(isNaN(result)); // Output: true

    ```


    In Example 14, `"hello" - 5` is an invalid operation, and the result is `NaN`.
    The `typeof` operator incorrectly reports `NaN` as `"number"`, but the `isNaN()`
    function correctly identifies `NaN` as a special value.


    ### The typeof Operator


    The `typeof` operator is used to determine the data type of a value or a variable.


    ```javascript

    // Example 15: Using the typeof operator

    let age = 25;

    let name = "John Doe";

    let isStudent = true;

    let user = null;

    console.log(typeof age); // Output: "number"

    console.log(typeof name); // Output: "string"

    console.log(typeof isStudent); // Output: "boolean"

    console.log(typeof user); // Output: "object"

    ```


    In Example 15, we use the `typeof` operator to determine the data types of variables
    `age`, `name`, `isStudent`, and `user`.


    ### Working with Strings


    Strings are one of the most common data types in JavaScript, and there are several
    built-in methods that allow you to manipulate and work with strings effectively.

