    ### Working with Numbers


    Numbers are another fundamental data type in JavaScript, and there are several
    built-in methods for working with numbers effectively.


    ```javascript


    // Example 17: Number methods


    let num = 3.14159;


    console.log(num.toFixed(2)); // Output: "3.14"


    console.log(num.toPrecision(4)); // Output: "3.142"


    console.log(Math.round(num)); // Output: 3


    console.log(Math.floor(num)); // Output: 3


    console.log(Math.ceil(num)); // Output: 4


    console.log(Math.random()); // Output: A random number between 0 and 1


    console.log(Math.floor(Math.random() * 10) + 1); // Output: A random integer between
    1 and 10


    ```


    In Example 17, we use various number methods, such as `toFixed`, `toPrecision`,
    `Math.round`, `Math.floor`, `Math.ceil`, and `Math.random`, to manipulate the
    `num` variable and generate random numbers.


    ### Working with Arrays


    Arrays are used to store multiple values in a single variable. JavaScript provides
    various methods for working with arrays effectively.


    ```javascript


    // Example 18: Array methods


    let fruits = ["apple", "banana", "orange"];


    console.log(fruits.length); // Output: 3


    fruits.push("grape"); // Adds "grape" to the end of the array


    console.log(fruits); // Output: ["apple", "banana", "orange", "grape"]


    fruits.pop(); // Removes the last element from the array


    console.log(fruits); // Output: ["apple", "banana", "orange"]


    fruits.unshift("pear"); // Adds "pear" to the beginning of the array


    console.log(fruits); // Output: ["pear", "apple", "banana", "orange"]


    fruits.shift(); // Removes the first element from the array


    console.log(fruits); // Output: ["apple", "banana", "orange"]


    console.log(fruits.indexOf("banana")); // Output: 1


    console.log(fruits.includes("orange")); // Output: true


    let slicedFruits = fruits.slice(1, 3);


    console.log(slicedFruits); // Output: ["banana", "orange"]


    ```


    In Example 18, we use various array methods, such as `length`, `push`, `pop`,
    `unshift`, `shift`, `indexOf`, `includes`, and `slice`, to manipulate the `fruits`
    array.


    ### Working with Objects


    Objects are used to store key-value pairs and represent complex data structures.
    Objects play a crucial role in JavaScript, and there are various techniques to
    work with them.


    ```javascript


    // Example 19: Working with objects


    let person = {


    name: "John Doe",


    age: 30,


    isStudent: false


    };


    console.log(person.name); // Output: "John Doe"


    console.log(person.age); // Output: 30


    person.location = "New York"; // Adding a new property to the object


    console.log(person); // Output: { name: ''John Doe'', age: 30, isStudent: false,
    location: ''New York'' }


    delete person.isStudent; // Removing a property from the object


    console.log(person); // Output: { name: ''John Doe'', age: 30, location: ''New
    York'' }


    console.log(Object.keys(person)); // Output: [ ''name'', ''age'', ''location''
    ]


    console.log(Object.values(person)); // Output: [ ''John Doe'', 30, ''New York''
    ]


    ```


    In Example 19, we work with an object named `person`, access its properties using
    dot notation, add a new property, remove a property, and obtain arrays of its
    keys and values using `Object.keys` and `Object.values`.


