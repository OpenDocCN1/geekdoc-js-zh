    # 第 3 章：控制流与循环


    在第 2 章中，我们牢固掌握了 JavaScript 中的数据类型和变量。现在，是时候探索如何使用条件语句和循环来控制代码的流程了。控制流允许我们根据特定条件做出决策并执行特定的代码块，而循环则提供了一种重复执行任务直到满足条件的机制。通过掌握控制流和循环，你将释放
    JavaScript 的全部潜力，并能够构建更动态、更交互的应用程序。让我们开始吧！


    ## 条件语句：在代码中做出决策


    条件语句使我们能够在代码中创建决策逻辑。根据条件的真假，执行特定的代码块。JavaScript 提供了三种类型的条件语句：`if`、`if...else`
    和 `switch`。


    ### `if` 语句：


    `if` 语句是最基本的条件语句形式。如果指定的条件求值为 `true`，则执行一个代码块。


    ```javascript


    // 示例 1：使用 if 语句


    let age = 25;


    if (age >= 18) {


    console.log("你是成年人。");


    }


    ```


    在示例 1 中，代码检查 `age` 是否大于或等于 18。如果为真，则打印 "你是成年人。"


    ### `if...else` 语句：


    `if...else` 语句允许我们在条件为 `true` 时执行一个代码块，在条件为 `false` 时执行另一个代码块。


    ```javascript


    // 示例 2：使用 if...else 语句


    let isRaining = true;


    if (isRaining) {


    console.log("下雨了。别忘了带伞！");


    } else {


    console.log("没有雨。祝您愉快！");


    }


    ```


    在示例 2 中，代码检查 `isRaining` 是否为 `true`。如果为真，则打印 "下雨了。别忘了带伞！"；否则打印 "没有雨。祝您愉快！"


    ### `else if` 语句：


    `else if` 语句允许我们在决策过程中添加多个条件。


    ```javascript


    // 示例 3：使用 else if 语句


    let time = 14;


    if (time < 12) {


    console.log("早上好！");


    } else if (time < 18) {


    console.log("下午好！");


    } else {


    console.log("晚上好！");


    }


    ```


    在示例 3 中，代码检查 `time` 的值，并根据一天中的时间打印不同的问候语。


    ### `switch` 语句：


    `switch` 语句提供了处理多个条件的另一种方式。


    ```javascript


    // 示例 4：使用 switch 语句


    let day = "Monday";


    switch (day) {


    case "Monday":


    console.log("这是一周的开始。");


    break;


    case "Friday":


    console.log("快到周末了！");


    break;


    default:


    console.log("这是普通的一天。");


    }


    ```


    在示例 4 中，代码检查 `day` 的值，并根据星期几打印不同的消息。


    ## 循环：重复执行代码


    循环在编程中至关重要，因为它们允许我们重复执行一段代码，直到满足特定条件。JavaScript 提供了几种类型的循环，包括 `for` 循环、`while`
    循环、`do...while` 循环和 `for...of` 循环。


    ### `for` 循环：


    当你确切知道要执行的迭代次数时，`for` 循环是理想的选择。


    ```javascript


    // 示例 5：使用 for 循环


    for (let i = 1; i <= 5; i++) {


    console.log("迭代：" + i);


    }


    ```


    在示例 5 中，`for` 循环执行花括号内的代码五次，因为 `i` 从 1 开始，每次迭代递增 1，直到达到 5。


    ### `while` 循环：


    当你想要重复执行一段代码直到特定条件变为 `false` 时，使用 `while` 循环。


