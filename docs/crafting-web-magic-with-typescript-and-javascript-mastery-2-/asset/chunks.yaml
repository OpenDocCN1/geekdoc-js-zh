    # Chapter 3: Control Flow and Loops


    In Chapter 2, we gained a solid understanding of data types and variables in JavaScript.
    Now, it''s time to explore how to control the flow of our code using conditional
    statements and loops. Control flow allows us to make decisions and execute specific
    code blocks based on certain conditions, while loops provide a mechanism for repeating
    tasks until a condition is met. By mastering control flow and loops, you''ll unlock
    the full potential of JavaScript and be able to build more dynamic and interactive
    applications. Let''s dive in!


    ## Conditional Statements: Making Decisions in Code


    Conditional statements enable us to create decision-making logic in our code.
    Depending on the truthiness of a condition, specific code blocks are executed.
    JavaScript provides three types of conditional statements: `if`, `if...else`,
    and `switch`.


    ### The `if` Statement:


    The `if` statement is the most basic form of conditional statement. It executes
    a block of code if the specified condition evaluates to `true`.


    ```javascript


    // Example 1: Using the if statement


    let age = 25;


    if (age >= 18) {


    console.log("You are an adult.");


    }


    ```


    In Example 1, the code checks if `age` is greater than or equal to 18\. If true,
    it prints "You are an adult."


    ### The `if...else` Statement:


    The `if...else` statement allows us to execute one block of code if the condition
    is `true`, and another block if the condition is `false`.


    ```javascript


    // Example 2: Using the if...else statement


    let isRaining = true;


    if (isRaining) {


    console.log("It''s raining. Don''t forget your umbrella!");


    } else {


    console.log("No rain. Have a great day!");


    }


    ```


    In Example 2, the code checks if `isRaining` is `true`. If true, it prints "It''s
    raining. Don''t forget your umbrella!"; otherwise, it prints "No rain. Have a
    great day!"


    ### The `else if` Statement:


    The `else if` statement allows us to add multiple conditions to the decision-making
    process.


    ```javascript


    // Example 3: Using the else if statement


    let time = 14;


    if (time < 12) {


    console.log("Good morning!");


    } else if (time < 18) {


    console.log("Good afternoon!");


    } else {


    console.log("Good evening!");


    }


    ```


    In Example 3, the code checks the value of `time` and prints different greetings
    based on the time of day.


    ### The `switch` Statement:


    The `switch` statement provides an alternative way to handle multiple conditions.


    ```javascript


    // Example 4: Using the switch statement


    let day = "Monday";


    switch (day) {


    case "Monday":


    console.log("It''s the beginning of the week.");


    break;


    case "Friday":


    console.log("It''s almost the weekend!");


    break;


    default:


    console.log("It''s a regular day.");


    }


    ```


    In Example 4, the code checks the value of `day` and prints different messages
    based on the day of the week.


    ## Loops: Repeating Code Execution


    Loops are essential in programming as they allow us to execute a block of code
    repeatedly until a specific condition is met. JavaScript provides several types
    of loops, including the `for` loop, `while` loop, `do...while` loop, and `for...of`
    loop.


    ### The `for` Loop:


    The `for` loop is ideal when you know the exact number of iterations you want
    to perform.


    ```javascript


    // Example 5: Using the for loop


    for (let i = 1; i <= 5; i++) {


    console.log("Iteration: " + i);


    }


    ```


    In Example 5, the `for` loop executes the code inside the curly braces five times,
    as `i` starts at 1 and increments by 1 in each iteration until it reaches 5.


    ### The `while` Loop:


    The `while` loop is used when you want to repeat a block of code until a specific
    condition becomes `false`.

