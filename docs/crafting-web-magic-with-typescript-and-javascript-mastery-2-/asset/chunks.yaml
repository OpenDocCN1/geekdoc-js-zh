    \ } from \"./math.js\";\n\nconst result1 = add(5, 10);\nconsole.log(result1);\
    \ // 输出: 15\n\nconst result2 = subtract(20, 5);\nconsole.log(result2); // 输出:\
    \ 15\n```\n\n在上面的示例中，我们使用模块从一个文件导出函数，并将其导入到另一个文件中。\n\n## 9. 增强的对象字面量\n\nES6 引入了对对象字面量的增强，提供了一种更简洁、更具表现力的方式来创建和定义对象。\n\
    \n```javascript\n// 示例 9：使用增强的对象字面量\n\nconst name = \"John\";\nconst age = 30;\n\
    \n// 不使用增强的对象字面量\nconst person = {\n  name: name,\n  age: age,\n};\n\n// 使用增强的对象字面量\n\
    const person = {\n  name,\n  age,\n};\n```\n\n在上面的示例中，我们使用增强的对象字面量来创建更简洁的对象。\n\
    \n## 10. 默认参数\n\nES6 引入了函数的默认参数，允许我们为函数参数指定默认值。\n\n```javascript\n// 示例 10：使用默认参数\n\
    \nfunction greet(name = \"Guest\") {\n  console.log(`Hello, ${name}!`);\n}\n\n\
