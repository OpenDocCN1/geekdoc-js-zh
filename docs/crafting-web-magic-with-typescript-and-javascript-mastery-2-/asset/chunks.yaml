    the `Array` constructor.


    ```javascript


    // Example 1: Creating arrays


    const fruits = ["apple", "banana", "orange"];


    const numbers = new Array(1, 2, 3, 4, 5);


    ```


    In Example 1, we create arrays `fruits` and `numbers` using both array literals
    and the `Array` constructor.


    ### Accessing Array Elements:


    Array elements can be accessed using their index, with the index starting from
    0 for the first element.


    ```javascript


    // Example 2: Accessing array elements


    const fruits = ["apple", "banana", "orange"];


    console.log(fruits[0]); // Output: "apple"


    console.log(fruits[1]); // Output: "banana"


    ```


    In Example 2, we access the elements of the `fruits` array using their respective
    indices.


    ### Modifying Array Elements:


    Array elements can be modified using their index.


    ```javascript


    // Example 3: Modifying array elements


    const fruits = ["apple", "banana", "orange"];


    fruits[1] = "grape";


    console.log(fruits); // Output: ["apple", "grape", "orange"]


    ```


    In Example 3, we modify the second element of the `fruits` array from "banana"
    to "grape".


    ### Array Length:


    The `length` property of an array gives the number of elements in the array.


    ```javascript


    // Example 4: Array length


    const fruits = ["apple", "banana", "orange"];


    console.log(fruits.length); // Output: 3


    ```


    In Example 4, we get the length of the `fruits` array, which is 3.


    ### Iterating through Arrays:


    Arrays can be iterated using loops, such as `for` loop or `for...of` loop.


    ```javascript


    // Example 5: Iterating through arrays (for loop)


    const fruits = ["apple", "banana", "orange"];


    for (let i = 0; i < fruits.length; i++) {


    console.log(fruits[i]);


    }


    // Output:


    // "apple"


    // "banana"


    // "orange"


    ```


    ```javascript


    // Example 6: Iterating through arrays (for...of loop)


    const fruits = ["apple", "banana", "orange"];


    for (let fruit of fruits) {


    console.log(fruit);


    }


    // Output:


    // "apple"


    // "banana"


    // "orange"


    ```


    In Example 5, we use a `for` loop to iterate through the `fruits` array, while
    in Example 6, we use a `for...of` loop.


