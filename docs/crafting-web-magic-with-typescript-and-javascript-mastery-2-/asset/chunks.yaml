    ## 第 2 章：理解数据类型和变量


    在第 1 章中，我们初步了解了 JavaScript 的语法以及如何编写简单的程序。现在，让我们更深入地探讨 JavaScript 中的数据类型和变量。理解数据类型至关重要，因为它构成了程序中信息存储、操作和处理的基础。此外，变量使我们能够将值分配给内存位置，并在整个代码中使用这些值。到本章结束时，你将牢固掌握
    JavaScript 的数据类型以及如何有效地使用变量。


    ## JavaScript 中的数据类型


    在 JavaScript 中，数据类型定义了变量可以持有的值的性质。JavaScript 是一种动态类型语言，这意味着变量可以在程序执行过程中改变其数据类型。JavaScript
    中的数据类型主要分为两类：原始数据类型和引用数据类型。


    ### 原始数据类型


    原始数据类型是简单、不可变的值，代表了 JavaScript 中的基本构建块。共有六种原始数据类型：


    1. `Number`：表示数值，包括整数和浮点数。例如：


    ```javascript

    let age = 25;

    let price = 9.99;

    ```


    2. `String`：表示文本数据，用单引号（''''）或双引号（""）括起来。例如：


    ```javascript

    let name = "John Doe";

    let message = ''欢迎使用 JavaScript！'';

    ```


    3. `Boolean`：表示逻辑值，可以是 `true` 或 `false`。例如：


    ```javascript

    let isStudent = true;

    let hasAccount = false;

    ```


    4. `Null`：表示有意缺失任何值。例如：


    ```javascript

    let user = null;

    ```


    5. `Undefined`：表示已声明但未赋值的变量。例如：


    ```javascript

    let city;

    console.log(city); // 输出：undefined

    ```


    6. `Symbol`：在 ECMAScript 6（ES6）中引入，符号是唯一且不可变的数据类型，通常用作对象中的属性键。例如：


    ```javascript

    const id = Symbol(''唯一标识符'');

    ```


    原始数据类型是按值传递的，这意味着当你将原始值赋给变量或将其作为参数传递给函数时，会创建该值的一个副本。对变量或参数所做的任何更改都不会影响原始值。


    ### 引用数据类型


    引用数据类型是更复杂且可变的数据类型，它们持有指向存储值的内存位置的引用。JavaScript 中有三种主要的引用数据类型：


    1. `Object`：表示键值对或属性的集合。对象可以存储各种数据类型，甚至其他对象。例如：


    ```javascript

    let person = {

    name: ''Alice'',

    age: 30,

    isStudent: false

    };

    ```


    2. `Array`：表示类似列表的元素集合。数组可以存储多个值，每个值可以通过从 0 开始的索引访问。例如：


    ```javascript

    let fruits = [''苹果'', ''香蕉'', ''橙子''];

    ```


    3. `Function`：表示可重复使用的代码块，用于执行特定任务。函数在 JavaScript 中至关重要，因为它们实现了代码的模块化和可重用性。例如：


    ```javascript

    function add(a, b) {

    return a + b;

    }

    ```


    引用数据类型是按引用传递的，这意味着当你将引用值（如对象或数组）赋给变量或将其作为参数传递给函数时，实际上是在分配一个指向存储该值的内存位置的指针。因此，对变量或参数所做的更改可能会影响原始值，因为它们都指向同一个内存位置。


    ## JavaScript 中的变量


    变量在任何编程语言中都至关重要，因为它们允许我们存储和操作数据。在 JavaScript 中，变量作为占位符来保存不同类型的值。要声明变量，我们使用 `var`、`let`
    或 `const` 关键字，后跟变量名。以下是每个关键字的简要说明：


    ### var 关键字（传统方式）


    在旧版本的 JavaScript 中，`var` 关键字通常用于声明变量。然而，它存在一些限制，例如变量提升和作用域相关问题。变量提升是指在代码执行过程中，变量声明被移动到其作用域的顶部，这可能导致意外结果。


    ```javascript

    // 示例 1：使用 var 声明变量

    var age = 25;

    console.log(age); // 输出：25

    ```


    ### let 和 const 关键字（现代方式）


    随着 2015 年 ECMAScript 6（ES6）的引入，新增了两个关键字 `let` 和 `const` 来声明变量。这些关键字提供了块级作用域，解决了
    `var` 的作用域相关问题。


    ```javascript

    // 示例 2：使用 let 和 const 声明变量

    let name = ''John Doe'';

    const PI = 3.14;

    console.log(name); // 输出：John Doe

    console.log(PI); // 输出：3.14

    ```


    在示例 2 中，我们使用 `let` 声明变量 `name`，使用 `const` 声明常量 `PI`。使用 `let` 声明的变量的值可以更改，而使用 `const`
    声明的常量的值在整个程序执行过程中保持不变。


    ### 变量命名规则


    在 JavaScript 中命名变量时，请遵循以下规则：


    - 变量名不能以数字开头。

    - 变量名只能包含字母、数字、下划线（_）或美元符号（$）。

    - 变量名区分大小写，因此 `age`、`Age` 和 `AGE` 被视为不同的变量。

    - 避免使用保留关键字（例如 `let`、`if`、`else`、`function` 等）作为变量名。


