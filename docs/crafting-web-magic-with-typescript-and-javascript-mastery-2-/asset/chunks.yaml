    ### Removing Elements:


    - `pop()`: Removes the last element from the array and returns it.


    ```javascript

    // Example 9: Removing elements (pop)


    const fruits = ["apple", "banana", "orange"];


    const removedFruit = fruits.pop();


    console.log(removedFruit); // Output: "orange"


    console.log(fruits); // Output: ["apple", "banana"]

    ```


    - `shift()`: Removes the first element from the array and returns it.


    ```javascript

    // Example 10: Removing elements (shift)


    const fruits = ["apple", "banana", "orange"];


    const removedFruit = fruits.shift();


    console.log(removedFruit); // Output: "apple"


    console.log(fruits); // Output: ["banana", "orange"]

    ```


    In Examples 9 and 10, we use `pop()` and `shift()` to remove elements from the
    `fruits` array.


    ### Modifying Elements:


    - `splice()`: Adds or removes elements from the array at a specific index.


    ```javascript

    // Example 11: Modifying elements (splice)


    const fruits = ["apple", "banana", "orange"];


    fruits.splice(1, 1, "grape", "kiwi");


    console.log(fruits); // Output: ["apple", "grape", "kiwi", "orange"]

    ```


    In Example 11, we use `splice()` to remove one element at index 1 and add "grape"
    and "kiwi" at that index.


    ### Searching for Elements:


    - `indexOf()`: Returns the index of the first occurrence of a specified element
    in the array.


    ```javascript

    // Example 12: Searching for elements (indexOf)


    const fruits = ["apple", "banana", "orange"];


    const index = fruits.indexOf("banana");


    console.log(index); // Output: 1

    ```


    - `lastIndexOf()`: Returns the index of the last occurrence of a specified element
    in the array.


    ```javascript

    // Example 13: Searching for elements (lastIndexOf)


    const fruits = ["apple", "banana", "orange", "banana"];


    const index = fruits.lastIndexOf("banana");


    console.log(index); // Output: 3

    ```


    In Examples 12 and 13, we use `indexOf()` and `lastIndexOf()` to search for elements
    in the `fruits` array.


    ### Slicing Arrays:


    - `slice()`: Returns a new array containing elements from the original array,
    specified by a start and end index (end index not included).


    ```javascript

    // Example 14: Slicing arrays


    const fruits = ["apple", "banana", "orange", "grape"];


    const slicedFruits = fruits.slice(1, 3);


    console.log(slicedFruits); // Output: ["banana", "orange"]

    ```


    In Example 14, we use `slice()` to create a new array containing elements from
    index 1 to index 3 (end index not included).


    ### Concatenating Arrays:


    - `concat()`: Concatenates two or more arrays, returning a new array.


    ```javascript

    // Example 15: Concatenating arrays


    const fruits = ["apple", "banana"];


    const vegetables = ["carrot", "tomato"];


    const combined = fruits.concat(vegetables);


    console.log(combined); // Output: ["apple", "banana", "carrot", "tomato"]

    ```


    In Example 15, we use `concat()` to combine the `fruits` and `vegetables` arrays
    into a new array.


    ### Mapping Array Elements:


    - `map()`: Creates a new array with the results of calling a provided function
    on every element in the array.


    ```javascript

    // Example 16: Mapping array elements


    const numbers = [1, 2, 3, 4, 5];


    const squaredNumbers = numbers.map((num) => num * num);


    console.log(squaredNumbers); // Output: [1, 4, 9, 16, 25]

    ```


    In Example 16, we use `map()` to create a new array containing the square of each
    element in the `numbers` array.


    ### Filtering Array Elements:


    - `filter()`: Creates a new array with all elements that pass the test implemented
    by the provided function.


    ```javascript

    // Example 17: Filtering array elements


    const numbers = [1, 2, 3, 4, 5];


    const evenNumbers = numbers.filter((num) => num % 2 === 0);


    console.log(evenNumbers); // Output: [2, 4]

    ```


    In Example 17, we use `filter()` to create a new array containing only the even
    numbers from the `numbers` array.


    ### Reducing Array Elements:


    - `reduce()`: Executes a reducer function on each element of the array, resulting
    in a single output value.


    ```javascript

    // Example 18: Reducing array elements


    const numbers = [1, 2, 3, 4, 5];


    const sum = numbers.reduce((acc, num) => acc + num, 0);


    console.log(sum); // Output: 15

    ```


    In Example 18, we use `reduce()` to calculate the sum of all elements in the `numbers`
    array.


