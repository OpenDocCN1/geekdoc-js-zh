  \n#### 唯一字段的重要性\n\n使用唯一 ID 不仅有助于你跟踪数据，而且以后有助于你尝试建立多个表之间的关系。在 `my_music` 表中将有一个 `id`\
  \ 字段（见表 12.2）。将此字段作为唯一字段，而不是 `title` 字段，将允许你的表中存在两个同名的条目。例如，如果你拥有 Indigo Girls 的专辑\
  \ *Strange Fire*，你可以在表中创建两个条目：一个是 1987 年发行的版本，另一个是 1989 年重新发行的版本。\n\n\n\n\n\n在不使用唯一标识符的情况下，你必须在多个版本中仅选择一个放入表格，这样你的表格将不准确。我希望这个简单的例子能传达出在表格每条记录中拥有唯一标识符的重要性。随着你创建更多数据库驱动的元素，唯一标识符用法将在本书剩下的部分变得明显。\n\
