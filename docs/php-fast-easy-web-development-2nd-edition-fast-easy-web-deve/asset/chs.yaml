  \n# 第 15 章：数据库驱动的用户验证\n\n每个人都有自己不想向全世界分享的秘密。但某些秘密*可以*分享——与特定的人分享。在本章中，你将学习如何执行以下操作：\n\
  \n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif) 为授权用户创建数据库表\n\n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif)\
  \ 创建登录表单和脚本序列，在显示任何秘密之前对用户进行验证\n\n第 224 页\n\n## 为什么要对用户验证？\n\n在最初开发网站时，你可能希望限制开发团队中某些成员的访问。如果你的公司网站包含敏感的财务数据，你可能希望将财务报表限制给特定的投资者列表。或者，你只是不想让别人窥探你的隐私。\n\
  \n用户验证的一种常见类型是*数据库驱动*的，其中用户名和密码保存在数据库表中，并通过登录表单和脚本进行访问。在下一节中，你将创建此数据库表并向其中添加一些用户。\n\
  \n## 创建用户表\n\n在第 12 章“创建数据库表”中，你遵循了一个两个步骤的表创建过程。你将可以使用相同的过程来创建授权用户表。\n\n1. 打开你的\
  \ Web 浏览器访问 `http://127.0.0.1/show_createtable.html`\n\n2. 在“表名”（Table Name）字段中，输入\
  \ `auth_users`。\n\n3. 在“字段数量”（Number of Fields）字段中，输入 `4`。\n\n4. 点击“转到步骤 2”（Go to\
  \ Step 2）按钮。你应该看到一个有四行的表单，对应于 `auth_users` 表中的四个字段。\n\n5. 在第一行，在“字段名”（Field Name）中输入\
  \ `f_name`，从“字段类型”（Field Type）下拉列表中选择 `varchar`，并指定“字段长度”（Field Length）为 `50`。此字段将存储用户的名字。\n\
  \n6. 在第二行，在“字段名”（Field Name）中输入 `l_name`，从“字段类型”（Field Type）下拉列表中选择 `varchar`，并指定“字段长度”（Field\
  \ Length）为 `50`。此字段将存储用户的姓。\n\n7. 在第三行，在“字段名”（Field Name）中输入 `username`，从“字段类型”（Field\
  \ Type）下拉列表中选择 `varchar`，并指定“字段长度”（Field Length）为 `25`。此字段将存储用户的用户名。\n\n8. 在第四行，在“字段名”（Field\
  \ Name）中输入 `password`，从“字段类型”（Field Type）下拉列表中选择 `varchar`，并指定“字段长度”（Field Length）为\
  \ `100`。此字段将存储密码的哈希值。\n\n第 225 页\n\n![Image](img/392d5200e881c3d4396100aa98c573f.jpg)\n\
  ![Image](img/98a6ae45e9ca9f3530fc3923674c5.jpg)\n\n在下一节中，你将创建一个记录添加表单和脚本，并向 `auth_users`\
  \ 表添加用户。\n\n#### 向你的表添加用户\n\n一个空的 `auth_users` 表没有任何用。在这一节中，你将创建一个简单的记录添加表单和脚本，类似于第\
  \ 13 章“向表中插入数据”中创建的那些。\n\n#### 创建用户添加表单和脚本\n\nHTML 表单将包含 `auth_users` 表中每一列的输入字段。\n\
  \n1. 在文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML> <HEAD>\n<TITLE>Add a User</TITLE>\
  \ </HEAD> <BODY> <h1>Adding Record to auth_users</h>\n```\n\n2. 开始你的表单。假设方法为 `POST`，动名为\
  \ `do_adduser.php` 的脚本：\n\n```html\n<FORM METHOD=\"POST\" ACTION=\"do_adduser.php\"\
  >\n```\n\n3. 为用户的名字创建一个带有文本标签的输入字段：\n```html\n<P>First Name:</BR> <INPUT TYPE=\"\
  text\" NAME=\"f_name\" SIZE=25 MAXLENGTH=50>\n```\n\n4. 为用户的姓创建一个带有文本标签的输入字段：\n\
  ```html\n<P>Last Name:</BR> <INPUT TYPE=\"text\" NAME=\"l_name\" SIZE=25 MAXLENGTH=50>\n\
  ```\n\n5. 为用户名创建一个带有文本标签的输入字段：\n```html\n<P>Username:</BR> <INPUT TYPE=\"text\"\
  \ NAME=\"username\" SIZE=25 MAXLENGTH=25>\n```\n\n6. 为密码创建一个带有文本标签的输入字段：\n```html\n\
  <P>Password:</BR> <INPUT TYPE=\"text\" NAME=\"password\" SIZE=25 MAXLENGTH=100>\n\
  ```\n\n| NOTE |\n| :--- |\n| 密码字段的 `MAXLENGTH` 为 100，此字段将存储密码的哈希值。 |\n\n7. 添加一个提交按钮，然后关闭你的表单并添加更多\
  \ HTML 以使文档有效：\n\n```html\n<P><INPUT TYPE=\"SUBMIT\" VALUE=\"Add User\"></P> </FORM>\
  \ </HTML>\n```\n\n第 227 页\n\n8. 将文件另存为 `show_adduser.html`，并将此文件放置在 Web 服务器的根目录下。\n\
