  \ 第一版出版以来的两年里，我收到了大量关于本书教学风格的正面反馈。在我的第一本书 *PHP Essentials* 出版一个月后，编辑们决定有必要出一个“快速且易用（Fast\
  \ & Easy）”的版本，我最初还持怀疑态度。“快速易用”风格是一种循序渐进、通过示例来学习新编程语言的路径——而且还包含了图片！与大多数编程书籍冗长大论、充斥文字的章节不同，“快速易用”风格确实吸引了\
  \ PHP 初学者，尤其是那些对编程初初感兴趣的用户。\n\n第二版考虑了第一版的某些反馈，但保持了原始的结构和学习路径。前三章专门用于在你的 Windows\
  \ 或 Linux 上运行 `Apache`、`MySQL` 和 `PHP`。你可能会对它是多么简单，以及你运行起来有多快感到惊讶。\n\n书中额外增加了几个章节，以提供额外的项目来练习你的新技能；另一些关于额外数据库和编程信息的附录也完善了这个新版本。对于最擅长通过示例学习的初学者来说，这本书仍然是一份坚实的入门指南。在完成本书后，你将在接触高级应用设计之前打下坚实的基础。\n\
  \n在进入这一切之前，请花些时间熟悉 `PHP` 及其历史。\n\n第 xx 页\n\n### 什么是 PHP？\n\n它的正式名称是 `PHP`：超文本处理器（Hypertext\
  \ Preprocessor），是一种服务端脚本语言。当你的 Web 浏览器访问 `URL` 时，它正在向 Web 服务器发送请求。当你请求一个 `PHP` 页面（例如\
  \ `http://www.yourcompany.com/home.php）， Web 服务器会唤醒 `PHP` 解析引擎并说：“嘿！在我向这个人的 Web\
  \ 浏览器返回结果之前，你必须做些什么。”\n\n然后，`PHP` 解析引擎运行位于 `home.php` 中的 `PHP` 代码，并返回生成的输出。该输出作为文档中\
  \ `HTML` 代码的一部分传回 Web 服务器，然后传递给你的浏览器，由浏览器显示给你看。\n\n### PHP 简史\n\n1994 年，一位非常有前瞻性的名为\
  \ Rasmus Lerdorf 的人开发了一套工具，使用解析引擎来解释此处的几个宏。这些工具并不奢华：一个访客簿、一个计数器以及其他在互联网婴儿期很酷的“主页”元素。他最终将这些工具与他编写的表单解释\
  \ (`FI`) 软件包相结合，添加了一些数据库支持，并发布了所谓的 `PHP/FI`。\n\n随后，本着开源软件开发的精神，全球开发者开始向 `PHP/FI`\
  \ 贡献力量。到 1997 年，已有超过 50,000 个网站使用 `PHP/FI` 完成不同的任务——连接数据库、显示动态内容等。\n\n那时起，开发过程真正开始变成团队协作。在开发者\
  \ Zeev Suraski 和 Andi Gutmans 的主要协助下，创建了 `3.0` 版本解析器。`PHP 3.0` 的最终发布出现在 1998 年 6\
  \ 月，当时它升级并包含了对多个平台（不再仅仅是 `Linux`！）以及 Web 服务器的支持、许多数据库的支持，以及 `SNMP`（简单网络管理协议）和 `IMAP`（互联网消息访问协议）。\n\
  \n接着，`PHP 4.0` 诞生了。这不是一个小小的版本变化，`PHP 4.0` 标志着对 `PHP` 核心的彻底思考以及对脚本语言本身内部的重写。`PHP`\
  \ 开发团队和 `Zend Technologies` 产出了一个卓越的产品，性能比版本 `3.0` 提升了近 50 倍，并带有一系列新且实用的功能。\n\n\
  那么我们现在在哪里呢？\n\n第 xxi 页\n\n* 全球有超过 700 万台 Web 服务器运行 `4.x` 版本的 PHP。\n* `PHP 4.x` 已使用多年，当前版本为\
  \ `4.2.1`。\n* `PHP 4.x` 可以与你想到的几乎任何 Web 服务器、操作系统和数据库组合工作。\n* `Zend Technologies`\
  \ 等公司已发布了优化和加速 `PHP` 的产品，以及用于开发和测试 `PHP` 代码的“工作室”环境。\n* PHP 作为企业级应用开发解决方案的使用呈爆炸式增长——它不再仅仅用于主页和小项目了！\n\
  \n### PHP 是做什么的？\n\n`PHP` 可以做你想做的任何事，除了倒立转圈。实际上，通过一点即时的图像处理和 `Dynamic HTML`，它可能也能做到这一点。\n\
  \n根据 `PHP` 手册，“该语言的目标是允许 Web 开发者快速编写动态生成的页面。”\n\n以下是 `PHP` 的一些用途：\n\n* 执行系统功能：在你的系统上创建、打开、读取、写入和关闭文件；执行系统命令；创建目录；修改权限。\n\
  * 从表单收集数据：将数据保存到文件，通过电子邮件发送数据，向用户返回处理后的数据。\n* 访问数据库并动态生成内容，或为数据库内添加、删除和修改元素创建 Web\
  \ 界面。\n* 设置 cookie 并访问 cookie 变量。\n* 启动会并使用会话变量和对象。\n* 使用 `PHP` 用户身份验证来限制对网站部分的访问。\n\
  * 动态创建图像。\n* 加密数据。\n\n这些只是日常用途。`PHP` 还支持 `Java`、`Java Servlets`、`XML` 以及许多其他高级功能。可能性是无限的。\n\
  \n第 xx 页\n\n### PHP 适合我吗？\n\n只有你才能决定 `PHP` 是否应该是你的选择，无论你是为了个人还是商业用途，无论规模大大小。我只能告诉你，在商业领域，我使用过所有流行的服务端语言——Active\
  \ Server Pages (`ASP`)、`ColdFusion`、Java Server Pages (`JSP`)、`Perl` 和 `PHP`，在许多平台和\
  \ Web 服务器上，效果各异。`PHP` 对我来说是正确的选择：它灵活、快速、要求简单，但输出强大。\n\n在大规模或商业环境中使用 `PHP` 之前，请考虑你对以下问题的回答：\n\
  \n* 你能否绝对确定你将始终使用相同的 Web 服务器硬件和软件？如果不能，请寻找适用于所有类型 Web 服务器的跨平台工具：`PHP`。\n* 你能否确定你的开发团队将完全由\
  \ `ASP`（或 `ColdFusion`）开发者组成？还是你会使用任何可用的人，因此需要一种易学习且语法与 `C` 和 `Perl` 相似的语言？如果你认为你的\
  \ `ASP` 或 `ColdFusion` 开发者可能会消失，就不要使用那些工具——使用 `PHP`。\n* 内存和服务器负载是问题吗？如果是，不要使用会浪费宝内存的臃肿第三方软件——使用\
  \ `PHP`。\n\n\n\n\n*本页特意留白。*\n\n第 3 页\n\n# 1 安装和配置 MySQL\n\n由于 MySQL 高效且易于使用，绝大多数使用\
