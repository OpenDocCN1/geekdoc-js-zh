  expire\", \"path\", \"domain\", \"secure\");\n```\n\n例如，你使用以下代码发送一个名为 `username`\
  \ 的 Cookie，其值为 `joe`，在 `testcompany.com` 域下的所有目录内有效一小时：\n\n```php\nsetcookie(\"\
