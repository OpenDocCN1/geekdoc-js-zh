  \ HTTP 环境变量\n\n当 Web 浏览器向 Web 服务器发送请求时，它会随请求发送一系列额外变量。这些被称为 `environment variables`（环境变量），它们对于显示动态内容或授权用户非常有用。\n\
  \n`phpinfo()` 函数除了基础的 HTTP 环境外，还会显示关于你的 Web 服务器软件以及运行的 PHP 版本的丰富信息。让我们看看你拥有什么。\n\
  \n**1.** 在你的文本编辑器中打开一个新文件。\n\n**2.** 输入以下 PHP 代码：\n\n```php\n<? phpinfo(); ?>\n\
  ```\n\n**3.** 将文件保存为 `phpinfo.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n**4.** 打开你的 Web\
  \ 浏览器并输入 `http://127.0.0.1/phpinfo.php`\n\n![Image](img/9290e4a34a428da5a3fbda6534f2e466.jpg)\n\
  \n| **注意** |\n| 你的信息将会不同，不仅在不同机器之间，在不同平台之间。这些截图是在 Windows 开发机器上拍摄的。 |\n\n第 81 页\n\
  \n![Image](img/cf668f156ec36e0788c4161a0a72ffa3.jpg)\n\n### 获取并使用 REMOTE_ADDR\n\n\
  默认情况下，环境变量以 `$VAR_NAME` 的形式供 PHP 脚本可用。例如，环境变量 `REMOTE_ADDR` 已经包含在 `$REMOTE_ADDR`\
  \ 中。然而，为了绝对确保读取的是正确的值，请使用 `getenv()` 函数将值赋值给你选择变量。\n\n`REMOTE_ADDR` 环境变量包含发送请求机器的\
  \ IP 地址。让我们获取你的 `REMOTE_ADDR` 值。\n\n**1.** 在你的文本编辑器中打开一个新文件。\n\n**2.** 打开一个 PHP\
  \ 块，然后使用 `getenv()` 将 `REMOTE_ADDR` 的值放入名为 `$address` 的变量中：\n\n```php\n<? $address\
  \ = getenv(\"REMOTE_ADDR\");\n```\n\n**3.** 将 `$address` 的值打印到屏幕上，并关闭 PHP 块：\n\n\
  ```php\necho \"Your IP address is $address.\"; ?>\n```\n\n**4.** 将文件保存为 `remoteaddress.php`，并将此文件放在你的\
  \ Web 服务器的文档根目录下。\n\n第 82 页\n\n**5.** 打开你的 Web 浏览器并输入 `http://127.0.0.1/remoteaddress.php`\n\
  \n![Image](img/1fe747c84675bea8a4662ab61fd794ce.jpg)\n\n| **注意** |\n| 你的 IP 地址将与上面显示的不同。\
  \ |\n\n在下一节中，你将获取另一个实用的环境变量 `HTTP_USER_AGENT`（Web 浏览器）。\n\n### 获取并使用 HTTP_USER_AGENT\n\
  \n`HTTP_USER_AGENT` 变量包含浏览器类型、浏览器版本、语言编码和平台。例如，以下值字符串指的是 Windows 98 平台上的英文版 Netscape\
  \ (Mozilla) 浏览器，版本 4.61：\n\n`Mozilla/4.61 – (Win98; I)` `\n\n这里是一些其他的 `HTTP_USER_AGENT`\
  \ 值，供我自己的浏览器库使用：\n\n`Mozilla/4.0 (compatible; MSIE 5.5; Windows 98)`\n\n此值指的是 Windows\
  \ 98 上的 Microsoft Internet Explorer (MSIE) 5.0 版本。有时你会看到 MSIE 返回一个看起来像 Netscape\
  \ 值的 `HTTP_USER_AGENT` 值，直到你注意到该值显示它是 'compatible'（兼容的）。\n\n\n\n\n\n## 2. 启动一个 if...else\
  \ 语句来查找 `preg_match()` 函数中哪一个成立，从搜索 MSIE 开始：\n\n```php\nif (preg_match(\"/MSIE/i\"\
