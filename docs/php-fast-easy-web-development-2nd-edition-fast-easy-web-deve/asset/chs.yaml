  \n第 391 页\n\n虽然许多日志软件包可以购买或下载，但全的 Apache 日志对于简单任务可能大材小用。\n\n### 使用 MySQL 进行简单的访问计数\n\
  \n如果你想捕获网站特定部分的访问，或者只是主页，你可以创建一个表和相应的 PHP 代码段来实现。\n\n#### 创建表\n\n在本例中，你将记录四个元素：页面名称、页面描述、用户代理和访问日期。首先，创建表。\n\
