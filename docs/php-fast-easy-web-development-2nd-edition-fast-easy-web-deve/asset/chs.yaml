  \n### HTTP 函数\n\n用于发送特定 HTTP 标头和 Cookie 数据的内置函数是开发 PHP 大型基于 Web 应用的关键方面。幸运的是，这些函数的语法非常容易理解和实现。\n\
  \n### header()\n\n`header()` 函数输出 HTTP 标头字符串，例如位置重定向。此输出必须在向浏览器发送任何其他数据（包括 HTML\
  \ 标签）之前发生。\n\n| 注意 |\n| :--- |\n| 这一点需要反复强调：在发送 `header()` 之前，不要尝试向浏览器发送任何类型的信息。你可以在\
  \ `header()` 之前执行任何数据库操作或其他计算，但你不能向屏幕打印任何内容——即使是一个换行符也不行。 |\n\n例如，使用 `header()`\
  \ 函数将用户重定向到新位置，可以使用以下代码：\n\n```php\nheader(\"Location: http://www.newlocation.com\"\
  ); exit;\n```\n\n| 提示 |\n| :--- |\n| 在 `header()` 语句后紧跟 `exit` 命令。这确保了代码不会继续执行。\
  \ |\n\n第 435 页\n\n### setcookie()\n\n`setcookie()` 函数向用户发送 Cookie。Cookie 必须在任何其他标头信息发送到\
