  \ 表写入跟踪信息代码段。\n\n#### 创建代码段\n\n''代码片段”是一个高度技术化的术语，意思是“一点点代码”。我在“高度技术化”这部分是在开玩笑，但代码片段通常不被认为是长脚本。相反，它只是为了一个简单的目的。在这种情况下，你的代码段将向\
  \ page_track 表写入一些基本信息，然后愉快地结束显示相当无聊的 HTML。\n\n1. 在你的文本编辑器中打开一个文件并开始 PHP 块：\n\n\
  ```php\n<?\n```\n\n2. 创建四个变量，对应于 page_track 表中的四个字段，并给它们赋予一些值：\n\n\n\n\n$page_name\
  \ = \"sample 1\"; $page_desc = \"This is a sample page of no use.\"; $user_agent\
  \ = getenv(\"HTTP_USER_AGENT\"); $date_added = date(\"Y-m-d\");`\n\n### 3. 创建一个变量来存储表所在的数据库名称：\n\
  \n`$db_name = \"testDB\";`\n\n### 4. 创建一个变量来存储你要用此脚本填充的表名：\n\n`$table_name = \"\
  page_track\";`\n\n第 393 页\n\n### 5. 按照之前的做法添加连接信息：\n\n`$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\") or die(mysql_error());`\n\n### 6. 按照你学过的方法选择数据库：\n\
  \n`$db = @mysql_select_db($db_name, $connection) or die(mysql_error());`\n\n###\
  \ 7. 创建一个 SQL 语句，将四个值插入到 page_track 表的四个字段中：\n\n`$sql = \"insert into $table_name\
  \ values ('$page_name', '$page_desc', '$user_agent', '$date_added')\";`\n\n### 8.\
