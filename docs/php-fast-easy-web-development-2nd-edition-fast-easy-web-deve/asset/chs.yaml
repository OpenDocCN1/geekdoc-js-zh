  \ 页\n\n## 2 安装 Apache\n\n由于它是最流行的 Web 服务器，你可能认为 Apache 是一个复杂的软件，但它一点也不难。在本章中，你将学习执行以下操作：\n\
  \n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif) 在 Windows 或 Linux 上安装 Apache\n\
  \n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif)连接到你的新 Web 服务器\n\n第 20 页\n\n\
  ### 为 Windows 安装 Apache\n\n在 Windows 上安装 Apache 是一项简单的任务，很大程度上归功于 Apache 组分发的安装向导。无论你使用的是\
  \ Windows 95、98、ME、2000、XP 还是 NT，预编译文件的安装过程绝对是最佳选择，而且所有的 Windows 版本都使用同一个安装文件。\n\
  \n能够在 Windows 95/98/ME/XP 等面向消费者的操作系统上使用 Apache 并不意味着你应该这样做，至少在生产环境中不是。简单来说，在 Windows\
  \ 操作系统上运行任何 Web 服务器都不像在 Linux/UNIX 机器上运行 Web 服务器那样快速、稳定或安全。然而，在基于 Windows 的操作系统上安装和配置开发用\
  \ Web 服务器是完全可以的，这也是大多数用户的起起点。\n\n| **注意** |\n| Apache 组还分发 Windows 版 Apache 的源代码，以备你需要自行编译代码。然而，该过程远超本书的范围！\
  \ |\n\n要下载 Windows 版 Apache 发行版，请从 Apache Server 网站 (http://httpd.apache.org/) 开始，并点击“Download”链接。进入下载区域后，点击链接“binaries”（二进制文件）然后“win32”。这将你进入\
  \ Windows 分发文件和公告的正确位置。该下载区域的直接 URL 是 http://www.apache.org/dist/httpd/binaries/win32/。\n\
