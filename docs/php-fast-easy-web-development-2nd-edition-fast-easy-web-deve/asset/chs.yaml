  \n**2.** 输入 `chown -R root /usr/local/mysql` 更改 `mysql` 目录的所有者。\n\n**3.** 输入 `chown\
  \ -R mysql /usr/local/mysql/data` 更改 `mysql/data` 目录的所有者。\n\n**4.** 输入 `chgrp -R\
  \ mysql /usr/local/mysql` 更改 `mysql` 目录的组。\n\n**5.** 输入 `chown -R root /usr/local/mysql/bin`\
  \ 更改 `mysql/bin` 目录的所有者。\n\n如果你在安装 MySQL 过程中遇到任何问题，你应该首先查看 MySQL 手册中的“问题和常见错误”章节，位于\
