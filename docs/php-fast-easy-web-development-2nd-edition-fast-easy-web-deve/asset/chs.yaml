  \n### 使用 Sessions 管理用户偏好\n\n除了简单的计数器，你可以使用 sessions 在用户访问网站时管理他们的偏好。在这个三步示例中，你将启动一个\
  \ session，询问用户的字体族和基本字体大小偏好，在后续页面上显示这些偏好，并允许用户更改主意并重置值。\n\n在此脚本中，你将启动一个 session\
  \ 并注册 `font_family` 和 `font_size` 变量。显示的 HTML 将是一个允许你更改偏好的表单。\n\n1.  在你的文本编辑器中打开一个新文件，启动一个\
  \ PHP 块并调用 `session_start()` 函数：\n\n```php\n<? session_start();\n```\n\n2.  启动一个\
  \ `if...else` 块来检查 `font_family` 和 `font_size` 是否有之前的值。如果当前 session 中不存在值，则分配默认值并将其添加：\n\
  \n```php\nif ((!$_SESSION[font_family]) || (!$_SESSION[font_size])) { $font_family\
  \ = \"sans-serif\"; $font_size = \"10\"; $_SESSION[font_family] = $font_family;\
  \ $_SESSION[font_size] = $font_size;\n```\n\n3.  如果确实之前的值，从 `$_SESSION` 全局变量中提取值：\n\
  \n```php\n} else { $font_family = $_SESSION[font_family]; $font_size = $_SESSION[font_size];\n\
  ```\n\n| **注意** |\n| 现在，只要这个 session 存在，一个名为 `$_SESSION[count]` 的变量就是可用的。 |\n| 如果用户返回到这个脚本，以更改他的显示偏好。\
  \ |\n| 如果你只是将变量添加到 session 而不检查之前的值，每次加载页面时这些变量都会被覆盖。 |\n| 你必须从 session 本身提取变量的值。\
  \ |\n\n4.  关闭 PHP 块并输入以下 HTML：\n\n```php\n?> <HTML> <HEAD> <TITLE>My Preferences</TITLE>\
