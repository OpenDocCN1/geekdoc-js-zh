  \n如果你输入了正确的用户名和密码，你应该会得到成功的结果。\n\n### 破坏你的连接脚本\n\n任何当你处理数据库工作时，都会遇到错误。这是不可避免的。这就是为什么我想向你展示一些错误以及如何优雅地处理它们。\n\
  \n你只需更改用户名，就可以对 `db_connect.php` 脚本进行修改，使其连接失败。\n\n**1.** 将用户名更改为 `buffy`（除非 `buffy`\
