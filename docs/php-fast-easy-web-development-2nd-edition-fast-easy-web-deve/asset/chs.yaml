  \ 3. 输入以下 PHP 代码：\n\n```php\n<? // This is a simple PHP comment. /* This is a C-style,\
  \ multiline comment. You can make this as long as you'd like. */ # Used to shells?\
  \ Use this kind of comment. ?>\n```\n\n### 4. 添加一些额外的 HTML 以使文档有效：\n\n```html\n\
  </BODY> </HTML>\n```\n\n### 5. 将文件保存为 `comments.php`。\n\n### 6. 将此文件放置在你 Web 服务器的文档根目录下。\n\
  \n![Image](img/03d05713482fd3fe06d941fa59a91f42.jpg)\n\n### 7. 打开你的 Web 浏览器并输入 `http://127.0.0.1/comments.php`\n\
