  \ 在你的脚本中转义特殊字符以产生有效输出\n\n第 46 页\n\n### PHP 是如何解析的\n\n现在你有一个文件，在该文件中有一些 `HTML` 和一些\
  \ `PHP` 代码。假设一个扩展名为 `.php` 的 `PHP` 文档，其工作原理如下：\n\n1. Web 浏览器请求一个扩展名为 `.php` 的文档。\n\
  2. Web 服务器说嘿！有人想要一个 `PHP` 文件。需要其他东西来处理它，”并将请求发送给 `PHP` 解析器。\n3. `PHP` 解析器找到所请求的文件并扫描其中的\
  \ `PHP` 代码。\n4. 当 `PHP` 解析器找到 `PHP` 代码时，它会执行该代码并将产生的输出（如果有）放置在文件中原先代码占据的位置。\n5.\
  \ 这个新的输出文件被发送回 Web 服务器。\n6. Web 服务器将其发送给 Web 浏览器。\n7. Web 浏览器显示输出。\n\n由于 `PHP` 代码是由服务器解析的，这种代码执行方式被称为*服务端*（server-side）。当代码由浏览器执行时（例如\
  \ `JavaScript`），被称为*客户端*（client-side）。\n\n要将 `PHP` 代码与 `HTML` 结合，必须将 `PHP` 代码与 `HTML`\
  \ 隔离开。在下一节中，你将学习如何使用 `PHP` 开始和结束标签来实现这一点。\n\n### PHP 开始和结束标签\n\n`PHP` 解析器可以识别几种不同类型的\
