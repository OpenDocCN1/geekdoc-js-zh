  \ `999d8971461bedfc7caadcab33e65866` 的 ID。\n\n#### 程序执行函数\n\n\n\n\n\n你可以使用 `PHP`\
  \ 的内置程序执行函数来运行位于系统上的程序，例如加密程序、第三方图像处理程序等。对于所有程序执行函数，`PHP` 用户必须拥有执行所给程序的权限。\n\n###\
  \ exec()\n\n`exec()` 函数执行一个外部程序。其语法为\n\n`exec(command, [array], [return_var]);`\n\
  \n\n\n如果指定了数组，`exec()` 函数的输出将附加到 `array` 中。如果指定了 `return_var`，它将被赋值为程序返回状态的值。\n\n\
  例如，你可以使用以下代码对服务器进行 5 次“ping”操作并打印输出：\n\n```php\n$command = \"ping -c5 www.thickbook.com\"\
  ; exec($command, $result, $rval); for ($i = 0; $i < sizeof($result); $i++) { echo\
  \ \"$result[$i]<br>\"; }\n```\n\n第 440 页\n\n### passthru()\n\n与 `exec()` 函数一样，`passthru()`\
  \ 函数执行一个外部程序。两者的区别在于 `passthru()` 返回操作的原始输出。`passthru()` 的语法为\n\n`passthru(command,\
  \ return_var);`\n\n如果指定了 `return_var`，它将被赋值为程序返回状态的值。\n\n### system()\n\n`system()`\
  \ 函数执行一个外部程序并在执行命令时显示输出。其语法为\n\n`system(command, [return_var]);`\n\n如果指定了 `return_var`，它将被赋值为程序返回状态的值。\n\
  \n例如，你可以使用以下代码对服务器进行 5 次“ping”操作并打印原始输出：\n\n```php\n$command = \"ping -c5 www.thickbook.com\"\
  ; system($command);\n```\n\n#### 正则表达式函数\n\n#### ereg_replace() 和 eregi_replace()\n\
  \n`ereg_replace()` 和 `eregi_replace()` 函数替换字符串中的模式实例并返回新字符串。`ereg_replace()` 函数执行区分大小写的匹配，而\
  \ `eregi_replace()` 执行不区分大小写的匹配。以下是这两个这两个函数的语法：\n\n`ereg_replace(pattern, replacement,\
  \ string); eregi_replace(pattern, replacement, string);`\n\n例如，你可以使用以下代码将字符串 \"\
  I really love programming in ASP!\" 中的 \"ASP\" 替换为 \"PHP\"\n\n```php\n$old_string\
  \ = \"I really love programming in ASP!\"; $new_string = ereg_replace(\"ASP\", \"\
  PHP\", $old_string); echo \"$new_string\";\n```\n\n第 441 页\n\n如果 \"ASP\" 是混合大小写的（例如\
  \ \"aSp\"），请使用 `eregi_replace()` 函数：\n\n```php\n$old_string = \"I really love programming\
  \ in aSp!\"; $new_string = eregi_replace(\"ASP\", \"PHP\", $old_string); echo \"\
  $new_string\";\n```\n\n### split()\n\n`split()` 函数使用特定的分隔符（逗号、冒号、分号等）将字符串拆为数组。其语法为\n\
  \n`split(pattern, string, [limit]);`\n\n如果指定了 `limit`，`split()` 函数将在指定位置停止——例如在逗号分隔列表的第十个值。\n\
  \n#### 会话处理函数\n\n会话处理是在用户浏览你的 Web 网站时保留数据的方法。数据可以是变量或整个对象。这些简单的函数只是 `PHP` 中与会话相关的几个几个；更多信息请参阅\
  \ `http://www.php.net/manual/`get `PHP` 手册。\n\n### session_start()\n\n如果会话尚未启动，`session_start()`\
  \ 函数将启动会话；如果用户存在会话 ID，则恢复会话。该函数不接受任何参数，只需将以下内容放在代码的开头即可调用：\n\n```php\nsession_start();\n\
  ```\n\n### session_destroy()\n\n`session_destroy()` 函数实际上销毁为当前会话注册的所有变量和值。该函数不接受任何参数，只需将以下内容放在代码中即可调用：\n\
  \n```php\nsession_destroy();\n```\n\n第 442 页\n\n#### 字符串函数\n\n本节仅触及 `PHP` 内置字符串处理函数的冰角，但如果你理解这些常用函数，你的编程生活将会变得简单得多！\n\
  \n### addslashes() 和 stripslashes()\n\n`addslashes()` 和 `stripslashes()` 函数在从数据库插入和检索数据时非常重要。插入数据库的文本通常会包含特殊字符（单引号、双引号、反斜杠、NULL），这些字符在插入之前必须经过“转义”。`addslashes()`\
  \ 函数正是此作用，语法如下：\n\n`addslashes(string);`\n\n同样，`stripslashes()` 函数返回一个去掉斜杠的字符串，语法如下：\n\
  \n`stripslashes(string);`\n\n### chop(), ltrim(), 和 trim()\n\n这三个函数都会移除字符串中的错误空格。`chop()`\
  \ 函数移除字符串末尾的空格，`ltrim()` 移除字符串开头的空格。`trim()` 函数移除字符串开头结尾的空格。以下是这些函数的语法：\n\n`chop(string);\
  \ ltrim(string); trim(string);`\n\n### echo()\n\n`echo()` 函数返回输出。`echo()` 的语法为\n\
  \n`echo ...`\n\n例如：\n\n```php\necho \"I'm using\"; // 输出: I'm using\n```\n\n第 443\
  \ 页\n\n### explode() 和 implode()\n\n`explode()` 函数使用指定的分隔符将字符串拆分为数组。其语法为\n\n`explode(separator,\
  \ string);`\n\n例如，以下代码将一个名为 `$color_list` 的逗号分隔字符串拆分为一个颜色数组 `$colors`：\n\n```php\n\
  $color_list = \"blue,black,red,green,yellow,orange\"; $colors = explode(\",\", $color_list);\n\
  ```\n\n反之，`implode()` 函数将数组转换为字符串，使用指定的分隔符。其语法为\n\n`implode(separator, array);`\n\
  \n例如，以下代码将颜色数组 `$colors` 转换为逗号分隔的字符串 `$color_list`：\n\n```php\n$colors = array(\"\
  blue\", \"black\", \"red\", \"green\", \"yellow\", \"orange\"); $color_list = implode(\"\
  ,\", $colors);\n```\n\n### htmlspecialchars() 和 htmlentities()\n\n`htmlspecialchars()`\
  \ 和 `htmlentities()` 函数将字符串中的特殊字符转换为可接受的实体。`htmlspecialchars()` 函数转换小于号（`<` 变为 `&lt;`）、大于号（`>`\
  \ 变为 `&gt;`）、双引号（`\"` 变为 `&quot;`）和和号（`&` 变为 `&amp;`）。\n\n`htmlentities()` 函数将字符集中的字符转换为正确的\
  \ HTML 实体。以下是这些函数的语法：\n\n`htmlspecialchars(string); htmlentities(string);`\n\n###\
  \ nl2br()\n\n`nl2br()` 函数将所有 ASCII 换行符替换为 HTML 换行符（<br>）。`nl2br()` 的语法为\n\n`nl2br(string);`\n\
  \n第 444 页\n\n### sprintf()\n\n`sprintf()` 函数根据表 B.9 中的一组指令返回格式化字符串。`sprintf()` 的语法为\n\
  \n`sprintf(format, ...);`\n\n| **表 B.9 sprintf() 函数格式化指令** |\n| **指令** | **结果**\
  \ |\n| :--- | :--- |\n| % | 添加百分号 |\n| b | 将字符串视为整数并格式化为二进制数 |\n| c | 将字符串视为整数并按\
  \ ASCII 值格式化 |\n| d | 将字符串视为整数并格式化为十进制 |\n| f | 将字符串视为双精度浮并格式化为浮点数 |\n| o | 将字符串视为整数并格式化为八进制\
  \ |\n| s | 视为并格式字符串 |\n| x | 将字符串视为整数并格式化为十六进制（小写字母） |\n| X | 将字符串视为整数并格式化为十六进制（大写字母）\
  \ |\n\n例如，将数字 5 转换为 $5.00（五美元），请使用：\n\n```php\n$newnumber = sprintf(\"%0.02f\",\
  \ 5);\n```\n\n### strlen()\n\n`strlen()` 函数返回给定字符串的长度。其语法为\n\n`strlen(string);`\n\
  \n### strtolower()\n\n`strtolower()` 函数返回一个所有字母均为小写的给定字符串。其语法为\n\n\n\n\n\n```php\n\
  strtolower(str);\n```\n\n### strtoupper()\n\n`strtoupper()` 函数返回给定的字符串，并将所有字母字符转换为大写。其语法如下：\n\
  \n```php\nstrtoupper (str);\n```\n\n### substr()\n\n`substr()` 函数根据给定的起始位置和可选的最终长度，返回字符串的某个。其语法如下：\n\
  \n```php\nsubstr(string, start, [length]);\n```\n\n如果 `start` 位置是一个正数，则起始位置从字符串开头开始计数。如果\
  \ `start` 位置是负数，则起始位置从字符串末尾开始计数。\n\n同样，如果使用了可选的 `length` 参数且其为正数，则长度从字符串开头开始计数。如果使用了\
  \ `length` 参数且为负数，则长度从字符串末尾开始计数。\n\n例如：\n\n```php\n$new_string = substr(\"PHP is\
  \ great!\", 1); // 返回 \"HP is great!\"\n$new_string = substr(\"PHP is great!\",\
  \ 0, 7); // 返回 \"PHP is \"\n$new_string = substr(\"PHP is great!\", -1); // 返回 \"\
  !\"\n$new_string = substr(\"PHP is great!\", -6, 5); // 返回 \"great\"\n```\n\n###\
  \ ucfirst()\n\n`ucfirst()` 函数将字符串中的第一个字母字符转换为大写字符。其语法如下：\n\n```php\nucfirst(string);\n\
  ```\n\n### ucwords()\n\n`ucwords()` 函数将字符串中每个单词的首字母转换为大写。其语法如下：\n\n```php\nucwords(string);\n\
  ```\n\n### 变量函数\n\n两个基本的变量函数 `isset()` 和 `unset()` 帮助你在应用程序的作用域内管理变量。\n\n`isset()`\
  \ 函数确定变量是否存在。`unset()` 函数显式地销毁指定的变量。以下是它们的语法：\n\n```php\nisset(var); unset(var);\n\
  ```\n\n如果变量存在，`isset()` 函数返回 `true`；否则，返回 `false`。\n\n# 编写你自己的函数\n\n随着你编写代码变得越来越熟练，你可能会发现很多时候你会一遍又一遍地编写相同的代码段。一个典型的例子就是本书书中使用的数据库连接代码。你曾多少次在心里想：“这真的太重复了！”我敢确定，这种情况经常发生。这就是编写自己的函数派上用场的地方。\n\
  \n在 PHP 中编程时，你会使用预定义函数来实现某些结果。例如，`mail()` 函数是一个用于发送邮件的预定义函数。`mysql_connect()` 函数是一个连接到\
  \ MySQL 数据库的预定义函数。构成这些函数的代码是内置在 PHP 脚本引擎中的，因此你永远看不到它们。但是，你可以编写自己的函数并在脚本中使用它们，甚至可以将自己的函数存储在外部文件中，仅在需要时使用。\n\
  \n## 函数的结构\n\n函数具有非常特定的结构，如下面的代码所示，其中 `[function_name]` 和 `[arguments]` 应该替换为你自己的函数名和任何你想要使用的参数。\n\
  \n```php\nfunction [function_name] ([arguments]) { // code }\n```\n\n当你创建一个函数时，在函数名前之前加上字面量单词\
  \ `function`。在它和你的函数名之后，是一组圆括号内的参数列表。参数是可选的，因为如果你不想向函数传递任何参数，就不需要传递——参数用逗号分隔，并持有你的函数完成某项或多项任务所需的值。\n\
  \n在参数之后，你打开一组大括号，输入你所有的代码，最后关闭大括号。例如，下面的函数（命名为 `multiplier`）接受一个名为 `$num` 的参数，并将该值乘以\
  \ 5。\n\n```php\nfunction multiplier ($num) { $answer = $num * 5; }\n```\n\n假设你已经确定\
  \ `$num` 等于 8，并且你正将其传递给 `multiplier` 函数。利用你自己的数学能力，你知道 `$answer` 将等于 40。要将该数字返回到函数之外的脚本中，你必须返回该值。\n\
  \n### 从函数返回值\n\n从函数中返回值的基本方法是使用 `return` 语句。通常，该语句位于函数的末尾，如下：\n\n```php\nfunction\
  \ multiplier ($num) { $answer = $num * 5; return $answer; }\n```\n\n| **注意** |\n\
  | `return` 语句可以出现在函数的任何位置，但当使用时，它将结束函数的执行。这意味着执行的代码是你脚本中调用 `return` 语句的那一行。 |\n\n\
  当你使用 `return` 语句时，你就可以像下面这样在代码中调用该函数：\n\n```php\necho multiplier(5);\n```\n\n这种用法将在你的屏幕上产生以下结果：\n\
  \n40\n\n由于你将 8 作为 `$num` 参数传递给 `multiplier()` 函数，`$answer` 变为 40。由于 `$answer` 是作为函数操作的结果返回的，并且你在调用函数后紧跟了\
  \ `echo`，你是在告诉 PHP 打印函数内部代码的结果。在这种情况下，该结果是数字 40。 |\n\n| **注意** |\n| 你也可以使用 `return`\
  \ 语句来获取多个值，但仅当这些值是数组或对象的一部分时才。 |\n\n使用 `return` 语句将函数结果传递给主脚本是一种简单且安全的方法，也是最常用的方法之一。如果不使用\
  \ `return` 语句，则必须将想要传回主脚本的变量声明为全局变量。例如：\n\n```php\nfunction multiplier($num) { $answer\
  \ = $num * 5; }\n```\n\n### 在你的代码中使用函数\n\n到为止，你已经学习了用户定义函数的基本结构，但还没有学习它是如何融入你自己的脚本的。对于\
  \ `multiplier()` 函数来说，创建一个像这样的脚本仅仅在屏幕上打印一个数字似乎非常耗时：\n\n```php\n<? function multiplier($num)\
  \ { $answer = $num * 5; return $answer; } echo multiplier(5); ?>\n```\n\n相反，想象有一个名为\
  \ `db_connect()` 的函数，它包含了你的数据库连接和选择代码：\n\n```php\nfunction db_connect(); \n    $connection\
  \ = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\") or die(mysql_error());\
  \ \n    $db = @mysql_select_db($db_name, $connection) or die(mysql_error()); \n\
  }\n```\n\n在每个脚本中重复输入这两行代码，不如只需输入：\n\n```php\ndb_connect();\n```\n\n如果你的主机名、用户名、密码或数据库名称发生变化，你只需要在一个地方更改这些信息——`db_connect()`\
  \ 函数代码。现在的唯一技巧是将这个函数放在哪里。显然，如果你是为了重用内部代码而创建函数，你不希望函数成为脚本的一部分。相反，你将函数放在单独的文件中（或包含其他函数的文件中），并根据需要使用\
  \ `include()` 或 `require()` 将信息引入到你的脚本中。\n\n\n\n\n\n`include()` 和 `require()` 函数的作用本质上是相同的：当它们被调用时，被包含文件中的代码会成为调用它的脚本的一部分。从该点起，被包含文件中的任何内容都可以在调用它的脚本中使用。\n\
  \n`include()` 和 `require()` 之间的区别在无法打开要包含的文件时显现出来。这可能是因为权限不正确，或者文件不在指定的位置。当使用 `include()`\
  \ 失败时，你会得到一个警告，但代码会尽可能继续执行——也就是说，如果它需要某个其他文件中的函数，那么执行效果可能就不如人意！当 `require()` 无法找到或打开文件时，你将得到一个致命错误（fatal\
  \ error），PHP 将完全停止处理代码。\n\n被包含的文件看起来与其他任何 PHP 文件一样，以打开 PHP 标签开始，以关闭 PHP 标签结束。例如，假设你有一个名为\
  \ `myfunctions.php` 的文件，包含以下代码：\n\n```php\n<? /* multiplier() 函数将数字乘以 5 并返回结果 */\
  \ function multiplier($num) { $answer = $num * 5; return $answer; } /* db_connect()\
  \ 函数连接到我的数据库。 */ function db_connect() { $connection = @mysql_connect(\"localhost\"\
  , \"spike\", \"9sj7En4\") or die(mysql_error());\n\n$db = @mysql_select_db($db_name,\
  \ $connection) or die(mysql_error()); } ?>\n```\n\n那么，在你需要连接数据库的实际 PHP 脚本中，会有如下内容：\n\
  \n```php\n<? //包含你所需的函数的文件 include('/'/path/to/myfunctions.php'); //调用函数 db_connect();\
  \ //现在你可以执行执行查询和获取结果等操作 ?>\n```\n\n显然，这是一个将包含文件作为函数库的非常简单的示例，但你可能已经看到了它的用处！在任何有重复代码的地方，都要考虑使用你自己的函数来替换它。你可以拥有多个根据任务恰当命名的、充满函数库的文件。在确定函数可以使用哪些地方的过程中，你可以轻松地优化你的代码。亲自尝试一下吧——书中使用了大量的重复代码，你可以快速将它们转换为你自己的紧凑应用程序！\n\
  \n# D\n\n## MySQL 基础参考\n\n本附录是对结构化查询语言（SQL）的简要概述，以及你可以配合 MySQL 使用的一些基本函数，这些函数可以极大地简化开发工作。请访问\
  \ http://www.mysql.com/ 查看 MySQL 函数和语言元素的完整列表，或者如果你想获得使用 MySQL 的良好介绍，可以翻阅我的书 *Teach\
  \ Yourself MySQL in 24 Hours*。\n\n| 注意 |\n| :--- |\n| 在本附录中，括号内的任何内容都应视为占位符文本。例如，你需要将命令中的\
  \ `[yourDBName]` 替换为实际数据库名称。 |\n\n### 创建或删除数据库\n\n从简单的操作开始，你可以使用 `CREATE` 命令创建一个新数据库。语法如下：\n\
  \n```sql\nCREATE DATABASE IF NOT EXISTS [yourDBName];\n```\n\n当你使用此命令创建数据库时，你实际上只是创建了一个目录，用于存放构成数据库中表的文件。\n\
  \n要从系统中删除整个数据库，请使用 `DROP` 命令：\n\n```sql\nDROP DATABASE IF EXISTS [yourDBName];\n\
  ```\n\n在使用使用 `DROP` 命令时务必极其小心，因为一旦删除了数据库，所有的表也会被删除！\n\n### 创建或删除表\n\n你也可以使用 `CREATE`\
  \ 命令在当前数据库中创建表。语法如下：\n\n```sql\nCREATE TABLE [yourTableName] ([fieldName1] [type],\
  \ [fieldName2] [type], ...) [options]\n```\n\n要从当前数据库中删除表，请使用 `DROP` 命令：\n\n```sql\n\
  DROP TABLE [yourTableName];\n```\n\n在使用 `DROP` 命令时务必极其小心，因为一旦删除了表，它们就彻底消失了！\n\n\
  ### 修改表\n\n`ALTER` 命令让你有机会修改特定表的元素，例如重命名列、更改列的类型、添加列、删除列等。以下是一些常见用法：\n\n- 向表中添加列，使用此命令：\n\
  \  ```sql\n  ALTER TABLE [yourTableName] ADD [newColumn] [fieldDefinition];\n  ```\n\
  - 从表中删除列，使用此命令：\n  ```sql\n  ALTER TABLE [yourTableName] DROP [columnName];\n  ```\n\
  - 将列从一种类型更改另一种类型：\n  ```sql\n  ALTER TABLE [yourTableName] CHANGE [columnName] [newfieldDefinition];\n\
  \  ```\n- 在你的表中创建一个唯一列（unique）：\n  ```sql\n  ALTER TABLE [yourTableName] ADD UNIQUE\
  \ [columnName] ([columnName]);\n  ```\n- 为表中的列创建索引：\n  ```sql\n  ALTER TABLE [yourTableName]\
  \ ADD INDEX [columnName] ([columnName]);\n  ```\n\n使用 `ALTER` 命令避免了仅仅因为拼写错误的字段名或犯了其他微小错误就删除整个表并重新创建它。\n\
  \n### 在表内插入、更新或替换\n\n`INSERT` 和 `REPLACE` 命令逐条记录填充你的表。`INSERT` 的语法为：\n\n```sql\n\
  INSERT INTO [yourTableName] ([fieldName1], [fieldName2], ...) VALUES ('[value of\
  \ fieldName1]', '[value of fieldName2]'...);\n```\n\n在插入记录时，请确保用单引号或双引号分隔你的字符串。如果你在字符串周围使用单引号且你正在添加的数据包含省号，请避免错误。通过在\
  \ `INSERT` 语句中使用转义省号 (`\\'`) 来避免错误。`REPLACE` 命令与 `INSERT` 具有相同的语法要求，唯一的区别在于你使用 `REPLACE`\
  \ 来覆盖记录：\n\n```sql\n...VALUES ('[value of fieldName1]', '[value of fieldName2]'...);\n\
  ```\n\n`UPDATE` 命令修改记录的一部分，而不是替换整个记录。要使用新值更新整个列，使用此命令：\n\n```sql\nUPDATE [yourTableName]\
  \ SET [fieldName] = '[new value]'\n```\n\n如果你只想更新特定的行，请使用 `WHERE` 子句：\n\n```sql\n\
  UPDATE [yourTableName] SET [fieldName] = '[new value]' WHERE [some expression];\n\
  ```\n\n`UPDATE` 可以是一个非常强大的 SQL 命令。你可以对现有记录执行字符串函数和数学函数。\n\n### 从表中删除\n\n与 `DROP`\
  \ 命令一样，如果不注意操作使用 `DELETE` 可能会导致严重的后果。一旦你删除了表或记录，它就永远消失了。不要害怕，只需小心。要删除表的所有内容，使用：\n\
  \n```sql\nDELETE FROM [yourTableName];\n```\n\n如果你只想删除特定的行，请使用 `WHERE` 子句：\n\n```sql\n\
  DELETE FROM [yourTableName] WHERE [some expression];\n```\n\n### 从表中查询\n\n在创建数据库驱动的网站时，`SELECT`\
  \ 命令可能是你工具箱中最常用的命令。`SELECT` 命令根据你定义的标准从表中选择某些记录。以下是 `SELECT` 的基本语法：\n\n```sql\n\
  SELECT [field names] FROM [table name] WHERE [some expression] ORDER BY [field names];\n\
  ```\n\n要选择表中的所有记录，使用：\n\n```sql\nSELECT * FROM [yourTableName];\n```\n\n要选择表中给定列的各个条目，使用：\n\
  \n```sql\nSELECT [columnName] FROM [yourTableName];\n```\n\n要选择表中的记录并按特定顺序返回，请为\
  \ `ORDER BY` 使用表达式。例如，如果你有一个用于记录的日期字段，并按按从新到旧排列所有记录，请使用：\n\n```sql\nSELECT * FROM\
  \ [yourTableName] ORDER BY [dateField] DESC;\n```\n\n`DESC` 代表“降序”。要从旧到新查看，使用 `ASC`\
  \ 表示“升序”。`ASC` 是默认排序。\n\n\n\n\n你还可以在 SQL 语句中执行数学和字符串函数，从而使 `SELECT` 不仅仅用于回显现有数据。以下是一些示例。\n\
  \n### 一些字符串函数\n\n列表仅包含了 MySQL 手册中列出的许多字符串相关函数中的几个。请访问 http://www.mysql.com/ 并查看完整手册以获取更多信息。\n\
  \n• 你可以使用 `CONCAT()` 函数拼接值。其语法如下：\n\n```\nSELECT CONCAT([field1],[field2],...) AS\
  \ [newName] FROM [yourTableName];\n```\n\n• 使用 `LOWER()` 函数将结果转换为小写。其语法如下：\n\n```\n\
  SELECT LOWER([field1],[field2],...) FROM [yourTableName];\n```\n\n• 使用 `UPPER()`\
  \ 函数将结果转换为大写。其语法如下：\n\n```\nSELECT UPPER([field1],[field2],...) FROM [yourTableName];\n\
  ```\n\n### 一些日期和时间函数\n\n列表仅包含了 MySQL 手册中列出的许多日期和时间相关函数中的几个。请访问 http://www.mysql.com/\
  \ 并查看完整手册以获取更多信息。\n\n• 使用 `DAYOFWEEK()` 函数从日期字段获取星期（1 = 周日，2 = 周一，...）。其语法如下：\n\n\
  ```\nSELECT DAYOFWEEK([date]) FROM [yourTableName];\n```\n\n• 使用 `WEEKDAY()` 函数从日期字段获取工作日几（0\
  \ = 周一，1 = 周二，...）。其语法如下：\n\n```\nSELECT WEEKDAY([date]) FROM [yourTableName];\n\
  ```\n\n| NOTE |\n| `DAYOFWEEK()` 函数和 `WEEKDAY()` 函数之间的区别在于周的起始点。在获取星期时，周从第 1 天（周日）开始。在获取工作日（或工作周）时，周从第\
  \ 0 天（周一）开始。 |\n\n• 使用 `DAYOFMONTH()` 函数从日期字段获取每月（1 到 31）。其语法如下：\n\n```\nSELECT\
  \ DAYOFMONTH([date]) FROM [yourTableName];\n```\n\n• 使用 `DAYOFYEAR()` 函数从日期字段获取年中的（1\
  \ 到 366）。其语法如下：\n\n```\nSELECT DAYOFYEAR([date]) FROM [yourTableName];\n```\n\n\
  • 使用 `MONTH()` 函数从日期字段获取月份（1 到 12）。其语法如下：\n\n```\nSELECT MONTH([date]) FROM [yourTableName];\n\
  ```\n\n• 使用 `MONTHNAME()` 函数从日期字段获取月份名称（一月、二月、...）。其语法如下：\n\n```\nSELECT MONTHNAME([date])\
  \ FROM [yourTableName];\n```\n\n• 使用 `DAYNAME()` 函数从日期字段获取日期名称（周一、周二、...）。其语法如下：\n\
  \n```\nSELECT DAYNAME([date]) FROM [yourTableName];\n```\n\n• 使用 `WEEK()` 函数从日期字段获取周（0\
  \ 到 53）。可以周日（0）或周一（1）开始周。其语法如下：\n\n```\nSELECT WEEK([date], [0 or 1]) FROM [yourTableName];\n\
  ```\n\n• 使用 `YEAR()` 函数从日期字段获取年份（1000 到 9999）。其语法如下：\n\n```\nSELECT YEAR([date])\
  \ FROM [yourTableName];\n```\n\n### 使用 SHOW 命令\n\n有几种类型的 `SHOW` 命令，它们产生的输出可以帮助你管理\
  \ MySQL 数据库。执行这些命令的标准方法是通过 MySQL 监控器（MySQL 的命令行界面），这是你在第一章“安装和配置 MySQL”中用过的。\n\n\
  基本的 `SHOW` 命令是 `SHOW DATABASES` 和 `SHOW TABLES`，它们简单地显示服务器上数据库和表的名称。如果你使用 `SHOW\
  \ CREATE TABLE` 命令，它会向你显示创建指定表的精确 SQL 语句。\n\n如果你需要知道表的结构，但不一定需要创建它的 SQL 命令，可以使用\
  \ `SHOW COLUMNS` 命令：\n\n```\nSHOW COLUMNS FROM [testTable];\n```\n\n![Image](img/8ce963fb9b48357b630599d11557091a.jpg)\n\
  \n出于管理目的，`SHOW STATUS` 和 `SHOW VARIABLES` 命令可以快速提供有关数据库服务器的重要信息。有关这些命令产生的许多行输出的更多信息，请阅读\
  \ MySQL 手册的相关部分，地址为 http://www.mysql.com/doc/。\n\n## 数据库规范化\n\n本书中使用的数据库表设计为了简单，帮助你理解\
  \ PHP 和 MySQL 之间的基本交互。这些不是“规范化”的数据库。当你开始创建详细的数据库驱动应用程序时，你会听到很多“规范化”这个词，它需要不同的思维方式——在看到眼前的关系之前先用关系术进行思考。在本附录中，你将学习数据库规范化的基础。\n\
  \n### 理解数据库规范化\n\n数据库规范化本质上是一组规则，允许你组织数据库，使得你的表在适当的地方相互关联，并且对于未来的增长和关系具有灵活性。规范化中使用的规则集称为\
  \ `范式`（normal forms）。如果你的数据库设计遵循第一组规则，则被视为第一范式。如果遵循了规范化的前三组规则，则称你的数据库处于第三范式。我们将通过学生和课程的概念来讲解这些范式。\n\
  \n### 应用范式\n\n在解释第一范式之前，让我们从一些需要规范化的内容开始。在数据库的情况下，它就像一个具有许多列的电子表格。假设你有一个存储学生课程信息的表，可能有表\
  \ E.1 所示的字段。\n\n#### 表 E.1 学生与课程\n\n| Field Name | Description |\n| :--- | :---\
  \ |\n| StudentName | 学生姓名 |\n| CourseID1 | 第一门课程的 ID |\n| CourseDescription1 | 第一门课程的描述\
  \ |\n| CourseInstructor1 | 第一门课程的教师 |\n| CourseID2 | 第二门课程的 ID |\n| CourseDescription2\
  \ | 第二门课程的描述 |\n| CourseInstructor2 | 第二门课程的教师 |\n\n你可能为了考虑到学生职业期间所有的课程而多次重复 `CourseID`、`CourseDescription`\
  \ 和 `CourseInstructor` 列。虽然是冗余，但这是创建单个扁表的方法。消除这种冗余是规范化的第一步，接下来我们将把这个扁表转换为第一范式。如果你的表保持扁平格式，将有很多未使用的空间和大量的浪费空间——这不是高效的表设计！\n\
  \n#### 将表转换为第一范式\n\n第一范式的主要规则是\n\n• 消除重复信息\n\n• 为相关数据创建单独的表\n\n观察扁表设计，它有许多重复的学生和课程字段，你可以识别出学生和课程是两个不同的主题。将你的学生课程扁表转换为第一范式意味着你要创建两个表：一个学生表（命名为\
  \ `students`），另一个学生课程表（命名为 `students_courses`）。你可以在表 E.2 和 E.3 中看到新的表设计。\n\n####\
  \ 表 E.2 students 表\n\n| Field Name | Description |\n| :--- | :--- |\n| StudentID\
  \ | 学生的唯一 ID。这个新字段现在是主键。 |\n| StudentName | 学生姓名 |\n\n#### 表 E.3 students_courses\
  \ 表\n\n| Field Name | Description |\n| :--- | :--- |\n| StudentID | 学生的唯一 ID，匹配\
  \ `students` 表中的条目 |\n| CourseID | 学生所修课程的 ID |\n\n\n\n\n\n| CourseDescription |\
  \ 学生所修课程的描述 |\n| CourseIntructor | 学生所修课程的讲师 |\n\n现在，你的两个表表示了一个学生到多门课程的一对多关系。学生可以根据意愿修读任意数量课程，而不限于平坦表中存在的\
  \ `CourseID`/`CourseDescription`/`CourseInstructor` 分组数量。\n\n你还有一些工作要做，因为下一步是将这些表转换为第二范式（Second\
  \ Normal Form）。\n\n### 将表转换为第二范式\n\n第二范式的基本规则是：\n\n- • 任何非键属性都不依赖于主键的一部分\n\n用通俗的话的话来说，这意味着如果你的表中的字段没有完全与主键相关，那么你还有更多工作要做的。在我们正在使用的学生和课程示例中，这意味着将课程拆分到它们自己的表中，使得原始的平坦表现在变成一个全是学生的表。\n\
  \n`CourseID`、`CourseDesc` 和 `CourseInstructor` 可以变成一个名为 `courses` 的表，主键为 `CourseID`。那么\
  \ `students_courses` 表就应该只包含两个字段：`StudentID` 和 `CourseID`。你可以在表 E.4 和表 E.5 中看到新的表设计。\n\
  \n| 表 E.4 的 courses 表 |\n| Field Name | Description |\n| CourseID | 课程的唯一 ID |\n\
  | CourseDescription | 课程描述 |\n| CourseIntructor | 课程的讲师 |\n\n| 表 E.5 新的 students_courses\
  \ 表 |\n| Field Name | Description |\n| StudentID | 学生的唯一 ID，匹配 students 表中的条目 |\n\
  | CourseID | 正在修读的课程唯一 ID，匹配 courses 表中的条目 |\n\n信不信由，你可以通过这个示例进一步推进到第三范式（Third Normal\
  \ Form）。\n\n### 将表转换为第三范式\n\n第三范式的规则是：\n\n- • 任何属性都不依赖于其他非键属性\n\n这条规则简单来说意味着你需要查看你的表，看看是否存在可以进一步拆分且不依赖于键的字段。考虑移除重复数据，你就会找到答案——讲师。不可避免的是，一个讲师会教授多门课程。然而，`courses`\
  \ 表中的 `CourseInstructor` 字段并不是任何类型的键。因此，如果你为了效率和维护而拆分出这些信息并创建一个单独的表，那就是第三范式。请看表\
  \ E.6 和表 E.7 中新的 courses 表和讲师表。\n\n| 表 E.6 的 courses 表 |\n| Field Name | Description\
  \ |\n| CourseID | 课程的唯一 ID |\n| CourseDescription | 课程描述 |\n| CourseInstructorID\
  \ | 讲师的 ID，匹配 instructors 表中的条目 |\n\n| 表 E.7 的 instructors 表 |\n| Field Name | Description\
  \ |\n| InstructorID | 讲师的唯一 ID |\n| InstructorName | 讲师姓名 |\n| InstructorNotes |\
  \ 关于讲师的任何备注 |\n\n第三范式通常足以消除冗余并允许灵活性和增长。接下来，你对之前书中用过的 `my_contacts` 表进行规范化。\n\n###\
  \ 规范化 my_contacts 表\n\n在原始的 `my_contacts` 表中，没有多少重复信息，但如果你将其扩展为真正的地址通讯录，就非常容易产生重复。在通讯录中，人们通常有家庭和工作地的联系信息，或者多种电话方式（座机、手机等），甚至有多个电子邮箱地址。将所有这些元素拆分到单独的表并通过主键将信息关联到人身上会意义得多。表\
  \ E.8 显示了原始的 `my_contacts` 表作为参考。\n\n| 表 E.8 原始 my_contacts 表 |\n| Field Name |\
  \ Description |\n| id | 为条目创建一个唯一 ID 号 |\n| f_name | 人的名 |\n| l_name | 人的姓 |\n|\
  \ address1 | 地址的第一行 |\n| address2 | 地址的第二行 |\n| address3 | 地址的第三行 |\n| postcode\
  \ | 邮政编码 |\n| country | 人居住的国家 |\n| prim_tel | 主电话号码 |\n| sec_tel | 次要电话号码 |\n|\
  \ email | 邮箱地址 |\n| birthday | 人的生日 |\n\n现在识别不同表将存在的不同区域：地址、电话和邮箱对于这个示例来说足够了。表 E.9、E.10\
  \ 和 E.11 显示了这些新表的字段。\n\n| 表 E.9 address 表的字段 |\n| Field Name | Description |\n|\
  \ id | 为地址条目创建一个唯一 ID 号 |\n| contact_id | 对应主联系表中的某人的 ID |\n| address1 | 地址的第一行\
  \ |\n| address2 | 地址的第二行 |\n| address3 | 地址的第三行 |\n| postcode | 邮政编码 |\n| address_type\
  \ | 地址类型，如家庭、工作或其他 |\n\n| 表 E.10 phone 表的字段 |\n| Field Name | Description |\n| id\
  \ | 为电话条目创建一个唯一 ID 号 |\n| contact_id | 对应主联系表中的某人的 ID |\n| phone_number | 电话号码 |\n\
  | phone_type | 电话号码类型，如家庭、工作或传真 |\n| 表 E.11 email 表的字段 | \n| Field Name | Description\
  \ |\n| id | 为邮箱条目创建一个唯一 ID 号 |\n| contact_id | 对应主联系表中的某人的 ID |\n| country | 人居住的国家\
  \ |\n| email | 邮箱地址 |\n| email_type | 邮箱类型，如家庭或工作 |\n\n这些新表都包含 `contact_id` 键，它匹配主联系表中的条目。作为主联系表的\
  \ `my_contacts` 表现在应该像 E.12 那样。\n\n| 表 E.12 新的 my_contacts 表 |\n| Field Name | Description\
  \ |\n| id | 为条目创建一个唯一 ID 号 |\n| f_name | 人的名 |\n| l_name | 人的姓 |\n| birthday | 人的生日\
  \ |\n\n有了这些新表，你将拥有一组更灵活（且规范化的！）表来维护联系信息。\n\n## 获取帮助\n\n开源社区最大的优点之一是人们乐于帮助你尽可能学习，以便你也能成为倡导者。然而，在向整个社区提问之前，你可能应该尝试寻找答案。这包括阅读可用手册和\
  \ FAQ、搜索邮件列表存档以及访问网站。很可能其他人遇到过和你一样的问题。\n\n这本书以及我写的其他书籍网站是 `http://www.premierpressbooks.com/downloads.asp`。你可以在那里找到书籍错误说明、下载的代码、书籍和其他物品的建议，以及我在空闲想到的任何其他内容。如果你对书中内容感到困惑，我也乐意解答。\n\
  \n### PHP 资源\n\n与 PHP 相关的网站、新闻组和邮件列表随处可见。这里列出的只是冰山一角。\n\n#### 网站\n\n大多数网站是由普通人利用自己的时间维护的，所以如果你使用了他们的任何资源，请尝试在能够帮助他人解决问题时回馈社区，例如向代码库提交代码段等。\n\
  \n##### www.php.net\n\nPHP 的主页是 `http://www.php.net`。这里有带注释的在线手册，还有 PHP FAQ、错误报告、提供\
  \ PHP 的 ISP 链接、新闻文章以及更多！\n\n##### www.zend.com\n\n\n\n\n\nZend Technologies 是 PHP\
  \ Zend 引擎背后的团队，他们为 PHP 开发者创建一个门户网站。这个个性化的网站不仅展示了你如何使用 PHP 构建高流量的动态网站，还提供了指南、资源以及关于如何在所有在线应用程序中最大化\
  \ PHP 潜力的课程。\n\n### Webmonkey (hotwired.lycos.com/webmonkey/)\n\n带给我们 *Wired* 杂志的公司也带来了\
  \ HotWired，它催生了 `Webmonkey`——这是一个开发者资源网站，其中有一个专门针对 PHP 的板块。不要把自己局限于 `Webmonkey`\
  \ 的 PHP 板块，因为其他板块也有很多信息。这是我最喜欢的网站之一，不仅是因为我为他们写过文章，还因为他们是一群聪明的人。\n\n### WeberDev\
  \ (www.weberdev.com)\n\n作为 PHP 开发者长期以来喜爱的网站，这个网站包含了许多编程语言的开发技巧和提示（公平起见），以及一个让每个人都能添加自己的代码片段、教程等的内容的管理系统！它有一个非常棒的周刊，而且流量很高。去贡献你的吧！\n\
  \n### PHPBuilder (www.phpbuilder.com)\n\n这是一个非常适合中级和高级 PHP 开发者的教程网站。它包含了针对实际应用的每周\
  \ `How To` 专栏，例如“考虑到搜索引擎构建动态页面”、“生成可读的密码”等许多内容。推荐！\n\n### DevShed (www.devshed.com)\n\
  \n该网站包含许多用户提交的教程、新闻文章、访谈以及对服务器端编程语言的竞争分析。它涵盖了 PHP 以及许多其他开发者感兴趣的话题，如服务器和数据库。\n\n\
  ### px.sklar.com\n\n这是一个极其基础的代码库，但如果你需要的只是代码片段，谁需要图形呢？借用“随拿一个硬币，留下一个硬币”的精神，你可以取一个代码片段开始，当你觉得有分享时再添加你自己的代码。\n\
  \n### PHP KnowledgeBase (php.faqts.com)\n\nPHP 知识库包含了 PHP 邮件列表中的问题和解答。任何人都可以在网站上回答问题或提问新问题。\n\
  \n#### 邮件列表\n\n有多个高流量的邮件列表可用于英语和其他语言的 PHP 讨论。在提问时请记住网络礼仪：保持礼貌，尽可能提供多的示例（如果你在描述问题），提供你的系统信息（如果你在寻找解决方案），我提到过要说请和谢谢吗？\n\
  \n你可以在 `http://www.php.net/` 的支持部分找到邮件列表订阅信息。英语 PHP 邮件列表已存档并可以在 `http://marc.theaimsgroup.com/`\
  \ 进行搜索。只需查找 WWW 标题下的 PHP 相关列表即可。\n\n#### 用户组\n\n有时，在现实生活中认识其他开发者会被很有帮助。你可以在 `http://www.phpusergroups.org/`\
  \ 找到 PHP 用户组列表。\n\n### MySQL 资源\n\n之前列出的许多 PHP 相关网站也包含了关于使用 MySQL 开发的信息，但位于 `http://www.mysql.com/`\
  \ 的 MySQL 网站是获取全面 MySQL 信息的起点。\n\n在线 MySQL 手册非常庞大，但它写得非常出色且实用，所以它的体量不应该吓到你。你可以在\
  \ `http://www.mysql.com/doc/` 找到手册。如果你想对 MySQL 有一个快速了解，我写了一本名为《24 小时自学 MySQL》的书，在全球各书店有售。\n\
  \n和 PHP 一样，有多个高流量的邮件列表可用于英语和其他语言的 MySQL 讨论。你可以在 `http://www.mysql.com/documentation/lists.html`\
  \ 找到邮件列表订阅信息，MySQL 邮件列表也可以在 `http://marc.theaimsgroup.com/` 进行搜索。\n\n### Apache\
  \ 资源\n\n从 Apache Foundation 网站 `http://www.apache.org/` 开始，获取服务器文档和常见问题（FAQs）列表。许多面向开发者的网站都提供特定的\
  \ Apache 教程——你只需要寻找它们即可。\n\n## 索引\n\n### A\n\n- **访问记录, MySQL 报告和,** 391–406\n-\
