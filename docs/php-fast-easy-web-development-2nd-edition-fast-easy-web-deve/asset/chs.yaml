  \n第 416 页\n\n| 注意 |\n| 在所有这些示例中，当函数中出现类似 \"string\" 或 \"int\" 的内容时，它是你自己的字符串或整数的占位符。\
  \ |\n\n## PHP 开始和结束标签\n\n若要将 PHP 代码与 HTML 结合，必须对 PHP 代码进行转义或将其与 HTML 隔离开。PHP 引擎会将表\
  \ B.1 所示标签对之间的任何内容都视为 PHP 代码。\n\n| 表 B.1 基础 PHP 开始和结束标签 |\n| 开始标签 | 结束标签 |\n| `<?php`\
  \ | `?>` |\n| `<?` | `?>` |\n| `<script language=\"php\">` | `</script>` |\n\n##\
  \ 变量\n\n你创建变量来表示数据。例如，以下变量持有一个销售税值：\n\n```php\n$sales_tax = 0.0875;\n```\n\n此变量持有一个\
  \ SQL 语句：\n\n```php\n$sql = \"SELECT * FROM MY_TABLE\";\n```\n\n在确定新变量的值时，你可以引用其他变量的值：\n\
  \n```php\n$tax_total = $sales_tax * $sub_total;\n```\n\n第 417 页\n\n关于变量名的以下是正确的：\n\
  \n- 它们以美元符号 (`$`)开头。\n- 它们不能以数字开头。\n- 它们可以包含数字和下划字符 (`_`)。\n- 它们是区分大小写的。\n\n以下是一些常见的变量类型：\n\
  \n- 浮点数 (floats)\n- 整数 (integers)\n- 字符串 (strings)\n\n这些类型由 PHP 根据它们出现的上下文决定。\n\n\
  ### 浮点数 (Floats)\n\n以下每个变量都是浮点数（float）。浮点数也被称为“带小数点的数字”。\n\n```php\n$a = 1.552;\
  \ $b = 0.964; $sales_tax = 0.875;\n```\n\n### 整数 (Integers)\n\n整数是正整数、负整数、零或“不带小数点的数字”。以下每个变量都是整数：\n\
  \n```php\n$a = 15; $b = -521;\n```\n\n### 字符串 (Strings)\n\n分组在双引号内的一系列字符被视为字符串：\n\
  \n```php\n$a = \"I am a string.\"; $b = \"<P>This book is <strong>cool</strong>!\"\
  ;\n```\n\n第 418 页\n\n你也可以在字符串中引用其他变量，这些变量会在你的脚本执行时被替换。例如：\n\n```php\n$num = 57;\
  \ // 一个整数\n$my_string = \"I read this book $num times!\"; // 一个字符串\n```\n\n当你运行脚本时，`$my_string`\
  \ 将变成 \"I read this book 57 times!\"\n\n### 来自 HTML 表单的变量\n\n取决于你的 HTML 表单方法（GET\
  \ 或 POST），变量将成为 `$_POST` 或 `$_GET` 超全局关联数组的一部分。输入字段名称将成为变量名。例如，当使用 POST 方法发送表单时，以下输入字段将产生变量\
  \ `$_POST[first_name]`：\n\n```html\n<input type=\"text\" name=\"first_name\" size=\"\
  20\">\n```\n\n如果方法是 GET，变量将是 `$_GET[first_name]`。\n\n### 来自 Cookie 的变量\n\n与表单变量一样，Cookie\
  \ 变量存储在 `$_COOKIE` 超全局中。例如，设置名为 `user` 的 Cookie：\n\n```php\nsetcookie(\"user\",\
  \ \"John Doe\", time() + 3600);\n```\n\n获取 Cookie：\n\n```php\necho $_COOKIE['user'];\n\
  ```\n\n### 环境变量\n\n环境变量用于提供有关服务器的信息。可以使用 `$_SERVER` 访问它们。例如，获取远程 IP 地址：\n\n```php\n\
  echo $_SERVER['REMOTE_ADDR'];\n```\n\n### 数组 (Arrays)\n\n简单来说，数组是变量的集合。在以下，$fave_colors`\
  \ 是包含字符串的数组：\n\n```php\n$fave_colors[0] = \"red\";\n$fave_colors[1] = \"blue\";\n\
  $fave_colors[2] = \"black\";\n$fave_colors[3] = \"white\";\n```\n\n数组元素从 0 开始计数。\n\
  \n## 运算符 (Operators)\n\n运算符是表示特定操作的符号。例如，`+` 算术运算符相两个值，而 `=` 赋值运算符将值赋予变量。\n\n###\
  \ 算术运算符 (Arithmetic Operators)\n\n算术运算符与数学非常相似，如表 B.2 所示。\n\n第 420 页\n\n| 表 B.2\
  \ 算术运算符 |\n| 运算符 | 示例 | 操作 |\n| `+` | `$b = $a + 3;` | 相加值 |\n| `-` | `$b = $a -\
  \ 3;` | 相减值 |\n| `*` | `$b = $a * 3;` | 相乘值 |\n| `/` | `$b = $a / 3;` | 相除 |\n|\
  \ `%` | `$b = $a % 3;` | 返回模，或余数 |\n\n### 赋值运算符 (Assignment Operators)\n\n`=` 是基础赋值运算符：\n\
  \n```php\n$a = 124; // $a 的值为 124\n```\n\n其他赋值运算符见表 B.3。\n\n| 表 B.3 赋值运算符 |\n| 运算符\
  \ | 示例 | 操作 |\n| `+=` | `$a += 3;` | 将变量的值更改为当前值加上右侧的值 |\n| `-=` | `$a -= 3;` |\
  \ 将变量的值更改为当前值减去右侧的值 |\n| `.=` | `$a .= \"string\";` | 将右侧的值连接到当前值上 |\n\n### 比较运算符\
  \ (Comparison Operators)\n\n意不意外的是，比较运算符比较两个值。比较返回真（true）或假（false）值。比较运算符见 B.4。\n\
  \n第 421 页\n\n| 表 B.4 比较运算符 |\n\n\n\n\n\n| 运算符 | 定义 |\n| :--- | :--- |\n| = | 等于\
  \ |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于或等于 |\n| <= | 小于或等于 |\n\n###\
  \ 增/减运算符\n\n增/递减运算符的作用正如其名称所示：对变量进行加或减操作（见表 B.5）。\n\n**表 B.5 增/减运算符**\n\n| 运算符 |\
  \ 用法 | 定义 |\n| :--- | :--- | :--- |\n| `++$a` | 前增 | 增加 1 并返回 `$a` |\n| `$a++` |\
  \ 后增 | 返回 `$a` 然后将 `$a` 增加 1 |\n| `--$a` | 前减 | 减少 1 并返回 `$a` |\n| `$a--` | 后减 |\
  \ 返回 `$a` 然后将 `$a` 减 1 |\n\n### 逻辑运算符\n\n逻辑运算符允许你的脚本判断条件的状态，并在 `if...else` 或 `while`\
  \ 语句的语境下，根据哪些条件为真、哪些为假来执行某些代码（见表 B.6）。\n\n**表 B.6 逻辑运算符**\n\n| 运算符 | 示例 | 结果 |\n\
  | :--- | :--- | :--- |\n| `!` | `!$a` | 如果 `$a` 为假则为真 |\n| `&&` | `$a && $b` | 如果\
  \ `$a` 和 `$b` 都为真则为真 |\n| `||` | `$a || $b` | 如果 `$a` 或 `$b` 为真则为真 |\n\n### 控制结构\n\
  \n程序本质上是一系列语句。控制结构正如其名，控制这些语句的执行方式。控制结构通常围绕一系列条件构建，例如，“如果天空是蓝色的，就出去玩”。在这个例子中，条件是“如果天空是蓝色的”，语句是“出去玩”。\n\
  \n控制结构利用大括号 `{}` 将语句组与程序的其余部分隔离开来。以下是常见控制结构的示例；记住这些会让你的生活变得简单得多。\n\n#### if...else\
  \ if...else\n\n`if...else if...else` 结构根据所测试表达式的值执行语句。在下面的示例 `if` 语句中，测试的表达式是 `$a\
  \ 等于 10`。\n\n```php\nif ($a == \"10\") { // 执行某些代码 }\n```\n\n在评估 `$a` 之后，如果发现它的值为\
  \ 10（即如果条件为真），将执行大括号内的代码。如果发现 `$a` 是 10 的其他值（如果条件为假），将忽略该代码，程序继续运行。\n\n为了在 `$a`\
  \ 不为 10 时提供另一种语句序列，可以在结构中添加一个 `else` 语句，以便在条件为假时执行一段代码：\n\n```php\nif ($a == \"\
  10\") { echo \"a equals 10\"; } else { echo \"a does not equal 10\"; }\n```\n\n\
  `else if`（或一个单词：`elseif`）语句可以添加到结构中，在进入最后的 `else` 语句之前评估另一个备用表达式。例如，以下结构首先评估 `$a\
  \ 是否等于 10`。如果该条件为假，则评估 `else if` 语句。如果发现为真，则执行其大括号内的代码。否则，程序将继续到最后的 `else` 语句：\n\
  \n```php\nif ($a == \"10\") { echo \"a equals 10\"; } else if ($b == \"8\") { echo\
  \ \"b equals 8\"; } else { echo \"a does not equal 10 and b does not equal 8.\"\
  ; }\n```\n\n你可以单独使用 `if` 语句，也可以作为 `if...else` 或 `if...else if...else` 语句的一部分。无论你选择哪种，都会发现这个结构是你程序中极具价值的元素！\n\
  \n#### while\n\n与 `if...else if...else` 结构不同（后者每个表达式只评估一次并根据其真假值执行操作），`while` 语句会持续循环，直到表达式为假。换句话说，`while`\
  \ 循环在表达式为真时持续进行。\n\n例如，在下面的 `while` 循环中，只要 `$a` 的值小于或等于 3，就会在屏幕上打印 `$a` 的值并加 1：\n\
  \n```php\n$a = 0 // 设置起点 while ($a <= \"3\") { echo \"a equals $a<br>\"; $a++; }\n\
  ```\n\n#### for\n\n与 `while` 循环一样，`for` 循环在每次循环开始时评估一组条件表达式。这是 `for` 循环的语法：\n\n\
  ```php\nfor (expr1; expr2; expr3) { // 要执行的代码 }\n```\n\n在每次循环开始时，评估第一个表达式，然后评估第二个表达式。如果第二个表达式为真，循环通过执行代码并评估第三个表达式来继续。如果第二个表达式为假，循环不再继续，第三个表达式永远不会被评估。\n\
  \n取 `while` 循环中的计数示例，使用 `for` 循环重写它：\n\n```php\nfor ($a = 0; $a <= \"3\"; $a++)\
  \ { echo \"a equals $a<br>\"; }\n```\n\n### 内置函数\n\n所有内置函数都是可用的。这些内置函数在 PHP 中非常常用。\n\
  \n#### 数组函数\n\n这些函数用于处理数组。以下是常用的数组处理函数：\n\n##### array()\n\n`array()` 函数允许你创建一个数组。以下是\
  \ `array()` 的用法示例：\n\n```php\n$arrayname = array(\"val1\", \"val2\");\n```\n\n#####\
  \ array_push()\n\n`array_push()` 函数允许向数组末尾添加元素。以下是 `array_push()` 的用法示例：\n\n```php\n\
  array_push($arrayname, \"val3\", \"val4\");\n```\n\n##### array_pop()\n\n`array_pop()`\
  \ 函数从数组末尾移除最后一个元素。以下是 `array_pop()` 的用法示例：\n\n```php\n$last_element = array_pop($arrayname);\n\
  ```\n\n##### array_unshift()\n\n`array_unshift()` 函数允许向数组开头添加元素。以下是 `array_unshift()`\
  \ 的用法示例：\n\n```php\narray_unshift($arrayname, \"new_val1\", \"new_val2\");\n```\n\
  \n##### array_shift()\n\n`array_shift()` 函数从数组开头移除第一个并返回第一个元素。以下是 `array_shift()`\
  \ 的用法示例：\n\n```php\n$first_element = array_shift($arrayname);\n```\n\n##### array_merge()\n\
  \n`array_merge()` 函数允许合并两个多个数组。以下是 `array_merge()` 的用法示例：\n\n```php\n$result = array_merge($array1,\
  \ $array2);\n```\n\n##### array_keys()\n\n`array_keys()` 函数返回现有数组中所有的键名。以下是 `array_keys()`\
  \ 的用法示例：\n\n```php\n$keys = array_keys($arrayname);\n```\n\n##### array_values()\n\
  \n`array_values()` 函数返回现有数组中所有的值。以下是 `array_values()` 的用法示例：\n\n```php\n$values\
  \ = array_values($arrayname);\n```\n\n##### count()\n\n`count()` 函数计算变量中元素的个数。它通常用于计算数组中元素的个数，因为任何非数组变量只有一个元素——其本身。在下面的示例中，`$a`\
  \ 被赋值为 `$colors` 元素的数量：\n\n```php\n$a = count($colors);\n```\n\n##### each() and\
  \ list()\n\n`each()` 和 `list()` 函数通常一起使用，用于遍历数组并返回其键和值。以下是这些函数的语法：\n\n```php\neach(arrayname);\
  \ list(val1, val2, ...);\n```\n\n例如当你通过 GET 方法提交 HTML 表单时，每个键/值对都会被放在全局变量 `$_GET`\
  \ 中。如果你的表单输入字段命名为 `first_name` 和 `last_name`，且用户输入了值 `Joe` 和 `Smith`，那么键/值对就是 `first_name/Joe`\
  \ 和 `last_name/Smith`。在 `$_GET` 数组中，这些变量表示如下：\n\n```php\n$_GET[\"first_name\"] //\
  \ \"Joe\"\n$_GET[\"last_name\"] // \"Smith\"\n```\n\n你可以使用 `each()` 和 `list()` 函数以这种方式遍历数组，打印数组中每个元素的键和值：\n\
  \n```php\nwhile (list($key, $val) = each($_GET)) { echo \"$key has a value of $val<br>\"\
  ; }\n```\n\n##### reset()\n\n\n\n\n\n`reset()` 函数将指针重置到数组的开头。它的语法为\n\n```php\nreset($array_name);\n\
  ```\n\n### shuffle()\n\n`shuffle()` 函数随机打乱给定数组的元素顺序。它的语法为\n\n```php\nshuffle($array_name);\n\
  ```\n\n### sizeof()\n\n`sizeof()` 函数计算数组中的元素个数。在以下示例中，`$a` 被赋值为等于 `$colors` 数组元素个数的值：\n\
  \n```php\n$a = sizeof($colors);\n```\n\n如果 `$colors` 包含值 `blue`、`black`、`red` 和\
  \ `green`，则 `$a` 被赋值为 4\n\n## 用于 MySQL 的数据库连接函数\n\n存在许多 PHP 函数用于连接和查询 MySQL 服务器。以下是一些基础函数及其语法。请参阅\
  \ `http://www.php.net/manual/`get PHP 手册获取完整的 MySQL 函数列表——这些函数非常多！\n\n#### mysql_connect()\n\
  \n此函数打开与 MySQL 的连接。它需要服务器名称、用户名和密码。\n\n```php\n$connection = mysql_connect(\"servername\"\
  ,\"username\",\"password\");\n```\n\n#### mysql_create_db()\n\n此函数在 MySQL 服务器上创建一个数据库。它需要一个有效的已连接。\n\
  \n```php\nmysql_create_db(\"myDB\");\n```\n\n#### mysql_drop_db()\n\n此函数在 MySQL\
  \ 服务器上删除一个数据库。它需要一个有效的已连接。\n\n```php\nmysql_drop_db(''myDB\");\n```\n\n#### mysql_select_db()\n\
  \n此函数选择 MySQL 服务器上的一个数据库供后续查询使用。它需要一个有效的已连接。\n\n```php\n$db = mysql_select_db(\"\
  myDB\", $connection);\n```\n\n#### mysql_query()\n\n此函数执行 SQL 语句。它需要一个打开的数据库连接。\n\
  \n```php\n$sql_result = mysql_query(\"SELECT * FROM SOMETABLE\",$connection);\n\
  ```\n\n#### mysql_error()\n\n当连接或查询出现问题时，此函数返回一个有意义的错误信息。它通常与 `die()` 函数一起使用，如下：\n\
  \n```php\n$sql_result = mysql_query(\"SELECT * FROM SOMETABLE\",$connection) or\
  \ die(mysql_error());\n```\n\n#### mysql_fetch_array()\n\n此函数自动将 SQL 语句的结果行放入数组中。\n\
  \n```php\n$row = mysql_fetch_array($sql_result);\n```\n\n#### mysql_num_rows()\n\
  \n此函数返回结果集中的行数。\n\n```php\n$num = mysql_num_rows($sql_result);\n```\n\n## 日期和时间函数\n\
  \n基础 PHP 日期时间函数让你轻松地格式化时间戳，用于数据库查询和日历函数，也可以简单地在订单收据上打印日期。\n\n#### date()\n\n`date()`\
  \ 函数返回当前的服务器时间戳，根据给定的参数集进行格式化。它的语法为\n\n```php\ndate(format, [timestamp]);\n```\n\
  \n如果未提供 `timestamp` 参数，则假设当前时间戳。表 B.7 显示了可用格式。\n\n#### checkdate()\n\n`checkdate()`\
  \ 函数验证给定的日期。验证成功意味着年份在 0 到 32767 之间，月份在 1 到 12 之间，且每个月的天数正确（已考虑闰年）。它的语法为\n\n```php\n\
  checkdate(month, day, year);\n```\n\n#### mktime()\n\n`mktime()` 函数根据给定日期返回长整型的\
  \ UNIX 时间戳（格式为自 Epoch，即 1970 年 1 月 1 日起的秒数）。因此，`mktime()` 的主要用途是格式化日期以便准备数学函数和日期验证。它的语法为\n\
  \n```php\nmktime(hour, minute, second, month, day, year);\n```\n\n#### time() and\
  \ microtime()\n\n`time()` 函数返回当前的系统时间，以自 Epoch 以来的秒数。`time()` 的语法简单为\n\n```php\n\
  time();\n```\n\n你可以得到类似 `958950466` 的结果。\n\n使用 `microtime()` 会增加微秒计数，因此你不再只是接收类似\
  \ `958950466` 的结果，而是得到类似 `0.93121600 958950466` 的结果，即在你请求自 Epoch 以来的时间的精确时刻（这包含了秒和微秒）。\n\
  \n| 表 B.7 date() 函数格式 | |\n| 字符 | 含义 |\n| :--- | :--- |\n| a | 打印 \"am\" 或 \"pm\"\
  \ |\n| A | 打印 \"AM\" 或 \"PM\" |\n| h | 12 小制格式的小时 (01 到 12) |\n| H | 24 小制格式的小时\
  \ (00 到 23) |\n| g | 不带导零的 12 小制格式的小时 (1 到 12) |\n| G | 不带导零的 24 小制格式的小时 (0 到 23)\
  \ |\n| i | 分 (00 到 59) |\n| s | 秒 (00 到 59) |\n| Z | 秒单位的时区偏移 (-43200 到 43200) |\n\
  | U | 自 Epoch 以来的秒 (1970 年 1 月 1 日 00:00:00 GMT) |\n| d | 两位数的日期 (01 到 31) |\n|\
  \ j | 不带导零的日期 (1 到 31) |\n| D | 英文缩写的星期几（周三个字母） |\n| l | 英文全称的星期几（周全字母） |\n| m |\
  \ 两位数的月份 (01 到 12) |\n| n | 不带导零的月份 (1 到 12) |\n| Y | 四位数的年份 |\n| y | 两位数的年份 |\n\
  \n## 文件系统函数\n\n内置的文件系统函数非常强大，特别是正确使用时。\n\n#### chmod(), chgrp(), 和 chown()\n\n就像\
  \ shell 命令一样，`chmod()`、`chgrp()` 和 `chown()` 修改文件的权限、组和所有者。用法：\n\n```php\nchmod(\"\
  filename\", mode);\nchgrp(\"filename\", newgroup);\nchown(\"filename\", newowner);\n\
  ```\n\n#### copy()\n\n`copy()` 函数的工作原理类似于 `cp`。它需要一个源文件和一个目标文件。\n\n```php\ncopy(\"\
  source filename\", \"destination\");\n```\n\nPHP 用户必须对目标写入权限，否则 `copy()` 将失败。\n\n\
  #### fopen()\n\n`fopen()` 函数打开指定的文件或 URL 进行读写。它的语法为\n\n```php\nfopen(\"filename\"\
  , \"mode\")\n```\n\n要打开 URL，请在文件名开头使用 `http://` 或 `ftp://`。你只能打开 URL 进行读取。如果文件名以其他任何字符开头，则从文件系统打开文件并返回打开的文件指针。否则，假设文件位于本地文件系统。\n\
  \n指定的模式决定是以读、写还是读写打开文件。表 B.8 列出了有效模式。\n\n| 表 B.8 fopen() 模式 | 描述 |\n| :--- | :---\
  \ |\n| r | 只读。指针在文件开头。 |\n| r+ | 读写。指针在文件开头。 |\n| w | 只写。指针在文件开头，且文件被截断为零长度。如果文件不存在，则尝试创建。\
  \ |\n| w+ | 读写。指针在文件开头，且文件被截断为零长度。如果文件不存在，则尝试创建。 |\n| a | 只写。指针在文件末尾（向后追加）。如果文件不存在，则尝试创建。\
  \ |\n| a+ | 读写。指针在文件末尾（向后追加）。如果文件不存在，则尝试创建。 |\n\n#### fread()\n\n使用 `fread()` 函数从打开的文件句指针中读取指定数量的字节。它的语法为\n\
  \n```php\nfread(filepointer, length);\n```\n\n#### fputs()\n\n`fputs()` 函数向打开的文件句指针写入。它的语法为\n\
