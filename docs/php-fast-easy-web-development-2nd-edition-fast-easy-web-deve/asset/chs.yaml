  \n真是某种糟糕的响应！至少它准确地告诉你是错了，而且说了好几次：用户 buffy 无法连接到 MySQL。你可以通过在 `mysql_connect` 之前放置\
  \ `@` 来抑制其中一个丑陋的警告，并直接使用 `die()` 函数的消息。尝试一下。\n\n第 164 页\n\n**1.** 在 `mysql_connect()`\
