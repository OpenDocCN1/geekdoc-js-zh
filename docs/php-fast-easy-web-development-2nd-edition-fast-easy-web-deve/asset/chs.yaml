  \ 页\n\n### 什么是变量？\n\n变量是用于存储数据的标识符。变量是存储值的内存位置，其值在程序运行期间可以改变。\n\n### 1. 创建一个变量：\n\
  \n```php\n$name = \"John\";\n```\n\n### 2. 给变量赋值：\n\n```php\n$age = 25;\n```\n\n\
  ```php\n$age = 26;\n```\n\n### 3. 使用变量：\n\n```php\necho $age;\n```\n\n### 4. 多个变量：\n\
  \n```php\n$firstName = \"John\";\n$lastName = \"Doe\";\necho $firstName . $lastName;\n\
  ```\n\n### 变量命名\n\n变量名以美元符号 `$` 开头，后面跟一个字母 (a-z, A-Z)、数字 (0-9) 或下划线 `_`。变量名不能以数字开头。变量名是区分大小大小的。\n\
  \n```php\n$var = 1;\n$Var = 2;\n```\n\n第 59 页\n\n### PHP 变量值类型\n\n在 PHP 中有两种主要类型的变量：标量和数组。标量变量只包含一个值，而数组包含值的列表，甚至是另一个数组。\n\
  \n在本章开头创建了一个标量变量，书中代码主要处理标量变量。\n\n当你给变量赋值时，通常赋值以下类型之一：\n\n- **整数 (integer)**：没有小数部分的数字。例如\
  \ `1345` 和 `9922786`。你也可以使用八进制和十六进制表示法：八进制 `0123` 是十进制 `83`，十六进制 `0x12` 是十进制 `18`。\n\
  - **浮点数 (float/double)**：带有小数的数字。例如 `1.5`、`87.3446` 和 `0.88889992`。\n- **字符串 (string)**：位于双引号\
  \ `\" \"` 或单引号 `' '` 内的文本和/或数字信息。\n\n开始编写 PHP 脚本时，仔细规划变量和变量名，并在代码中使用注释来提醒自己所做的赋值。\n\
  \n创建一个简单的脚本，为不同的变量赋值，并将这些值简单地打印到屏幕上。\n\n### 1. 在你的文本编辑器中打开新文件并输入以下 HTML：\n\n```html\n\
  <HTML> <HEAD> <TITLE>Printing Variables</TITLE> </HEAD> <BODY>\n```\n\n### 2. 添加\
  \ PHP 块并创建一个整数变量：\n\n```php\n<? $intVar = \"9554215464\";\n```\n\n### 3. 创建一个浮点数变量：\n\
  \n```php\n$floatVar = \"1542.2232235\";\n```\n\n第 60 页\n\n### 4. 创建字符串变量：\n\n```php\n\
  $stringVar = \"This is a string.\";\n```\n\n### 5. 为每个变量添加一个 echo 语句：\n\n\n\n\n\n\
  ```\necho \"<P>integer: $intVar</P>\"; echo \"<P>float: $floatVar</P>\"; echo \"\
  <P>string: $stringVar</P>\";\n```\n\n**6.** 关闭你的 PHP 块并添加更多 HTML 以确保文档是有效的：\n\n\
  ```php\n?> </BODY> </HTML>\n```\n\n**7.** 将文件保存为 `printvarscript.php`，并将此文件放在 Web\
  \ 服务器的文档根目录下。\n\n![Image](img/6aa0c85b155452dea7c4804e8aaa48b.jpg)\n\n你可以通过此输出看到，赋值给变量\
  \ `$intVar`、`$floatVar` 和 `$stringVar` 的就是打印到屏幕上的值。在下一节中，你将学习如何使用运算符来更改变量的值。\n\n\
  ### 局部变量与全局变量\n\n变量可以是`local`（局部）或`global`（全局），其区别在于程序员对它们的定义和使用方式，以及它们在你创建的脚本上下文中出现的位置。上一节描述的变量以及本书的大部分内容的变量都是局部变量。\n\
  \n当你编写使用变量的 PHP 脚本时（而且它们通常总是会使用），这些变量只能由它们所在的脚本使用。脚本无法魔法地进入其他脚本并使用在其中创建和定义的变量——除非你说明它们可以这样做，并有意识地将它们链接在一起。当你这样做时，例如在你创建自己的函数（执行特定任务的可重用代码块）时，你会将共享变量定义为\
  \ `global`。也就是说，它们可以被需要它的其他脚本和函数访问。\n\n你可以在附录 C“编写你自己的函数”中学习创建你自己的函数，以及使用 `global`\
  \ 和 `local` 变量。现在，只需理解有两种不同的变量作用域——局部和全局——它们会在编写更高级的脚本时发挥作用。\n\n### 预定义变量\n\n在所有的\
  \ PHP 脚本中，都会使用一组预定义变量。如果你滚动并阅读了整个结果页面，可能已经在 `phpinfo()` 函数的输出中见过这些变量中的某些。其中一些预定义变量也被称为`superglobals`（超全局变量），本质意味着它们在你的脚本中始终存在且可用的。\n\
  \n请学习以下超全局变量列表，因为它们将在书中被专门使用。这些超全局变量实际上都是其他变量的数组。现在不要担心完全理解这个概念；随着你阅读这本书，将会进行解释。\n\
  \n- `$_GET` 任何通过 `GET` 方法提供脚本的变量。\n- `$_POST` 任何通过 `POST` 方法提供脚本的变量。\n- `$_COOKIE`\
  \ 任何通过 cookie 提供的脚本的变量。\n- `$_FILES` 任何通过文件上传提供脚本的变量。\n- `$_ENV` 任何作为服务器环境一部分提供脚本的变量。\n\
  - `$_SESSION` 当前注册在会中的任何变量。\n\n| NOTE |\n| :--- |\n| 如果你使用的是比 4.1.x 更老的 PHP 版本，且无法按照第\
  \ 3 章“安装 PHP”所述升级到更高版本，那么在遵循本书中的脚本时，你必须调整这些变量的名称。旧名称如下：`$HTTP_GET_VARS`、`$HTTP_POST_VARS`、`$HTTP_COOKIE_VARS`、`$HTTP_SESSION`。\
  \ |\n\n### 常量\n\n`constant`（常量）是一个在整个生命周期内不能改变的值的标识符。与变量不同，常量前面没有美元符号。一旦定义，它在整个执行过程中都会保持不变。可以使用\
  \ `define()` 函数定义常量。\n\n1. 打开一个新脚本：\n```php\ndefine(\"CONSTANT\", \"This is a constant\"\
  );\n```\n\n2. 使用 `define()` 函数定义一个常量：\n```php\ndefine(\"CONSTANT\", \"This is a\
  \ constant\");\n```\n\n3. 在你的代码中使用常量：\n```php\necho CONSTANT;\n```\n\n4. 将文件保存为\
  \ `constants.php`。\n\n\n\n\n## 1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\
