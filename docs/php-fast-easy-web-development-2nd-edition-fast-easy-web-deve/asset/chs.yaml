  \ `fclose()` 函数来打开和关闭特定文件。\n\n第 129 页\n\n### 使用 `fopen()` 和 `fclose()`\n\n在全头投入处理文件之前，你需要了解一下\
  \ `fopen()` 函数，它被用于打开文件。该函数需要一个文件名和模式，并返回一个文件指针。文件指针提供有关文件的信息，并用作引用。\n\n文件名是你想要创建或打开的文件的完整路径，而模式可以是表\
  \ 9.1 中列出的任何模式之一。\n\n| 表 9.1 `fopen()` 使用的模式 |\n|---|---|\n| 模式 | 用法 |\n| r | 打开一个已存在的文件并从中读取数据。文件指针置于文件开头。\
  \ |\n| r+ | 打开一个已存在的文件进行读取或写入。文件指针置于文件开头。 |\n| w | 打开一个文件进行写入。如果不存在同名文件，函数将创建一个新文件。如果文件存在，函数将删除所有现有内容并将文件指针置于文件开头。\
  \ |\n| w+ | 打开一个文件进行读写。如果不存在同名文件，函数将创建一个新文件。如果文件存在，函数将删除所有现有内容并将文件指针置于文件开头。 |\n\
