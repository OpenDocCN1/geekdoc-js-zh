  \ 页\n\nHTML 和 PHP 注释在书中广泛用于解释代码块。习惯阅读注释，并尝试养成使用注释的习惯。编写带有注释和空白的整洁、无 bug 代码，将使你在开发者同行中广受欢迎，因为他们不需要花额外的精力去弄清楚你的代码想要做什么。在下一章中，你将学习关于变量的所有知识，或者用我喜欢的方式称呼它们：“那些带有美元符号的东西”。\n\
