  \n### 创建上传脚本\n\n花一点时间记住以下列表——它包含了在文件成功上传后自动放置在 `$_FILES` 超全局变量中的变量。`img1` 的基础来自原始表单中输入字段的名称。\n\
  \n* `$_FILES[$img1][tmp_name]`。该值指向 Web 服务器上的临时文件。\n* `$_FILES[img1][name]`。该值是上传的文件的实际名称。例如，如果文件名是\
  \ me.jpg， `$_FILES[img1][name]` 的值就是 me.jpg。\n* `$_FILES[img1][size]`。上传的文件以字节为单位的大小。\n\
  * `$_FILES[img1][type]`。上传文件的 mime 类型，例如 image/jpg\n\n第 154 页\n\n该脚本的目标是获取上传的文件并复制到\
  \ Web 服务器的文档根目录，并向用户返回一个确认，其中包含上述列表中所有变量的值。\n\n1. 在你的文本编辑器中打开一个新文件并开始一个 PHP 块：\n\
  \n```php\n<?\n```\n\n2. 创建一个 `if...else` 语句检查 `$_FILES[img1]` 中的值。\n\n```php\nif\
  \ ($_FILES[img1] != \"\") {\n```\n\n3. 如果 `$_FILES[img1]` 不空，执行 `copy` 函数。在函数名前使用\
  \ `@` 来抑制警告，并在 `copy()` 函数失败时使用 `die()` 函数导致脚本结束并显示消息。\n\n```php\n@copy($_FILES[img1][tmp_name],\
  \ \"/usr/local/bin/apache_1.3.26/ htdocs/\".$_FILES[img1][name]) or die(\"Couldn't\
  \ copy the file.\");\n```\n\n| **注意** |\n| :--- |\n| 如果你的 Web 服务器的文档根目录不是步骤 3 所示的\
  \ `/usr/local/bin/apache_1.3.26/htdocs/`，请更改路径以匹配自己的系统。例如，Windows 用户可能会使用 `/Apache/htdocs/`。\
