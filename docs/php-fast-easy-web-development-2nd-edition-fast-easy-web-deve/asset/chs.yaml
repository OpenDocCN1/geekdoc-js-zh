  ### 规划你的表\n\n创建表很容易——规划才需要费脑力。要创建一个简单的表，你只需要给它一个名字。但那将是一个无聊的表，因为它不包含任何列（字段），也无法存储任何数据。所以，除了名字之外，你应该知道你想在表中拥有的字段数量以及字段类型。\n\
  \n#### 基础 MySQL 数据类型\n\n表中的所有字段都赋予了特定的数据类型定义。数据类型定义了字段中允许的数据类型。对于某些数据类型定义，你还必须定义在字段中允许的最大长度，而其他类型则被假设其特定类型有一个特定的长度。\n\
  \n恰当定义字段是非常重要的。例如，如果你有一个存储录音名称的字段，这是一个 50 字符的 `varchar` 字段，但你试图向字段中塞入一个 100 字符的字符串，你的字符串将被截断在\
  \ 50 个字符。\n\n正确定义字段以使数据能够放入字段中不仅然重要，而且如果你使用错误的 SQL 语法定义字段，表将根本无法创建。例如，如果你想对字段使用\
  \ `text` 数据类型，你不能指定长度：它被自动假设具有某个特定长度。\n\n表 12.1 显示了你将用到的一些常用类型。要查看完整列表，请阅读 MySQL\
  \ 手手册。\n\n#### 定义你的字段\n\n本章的总目标是创建一个表来存储来自你个人音乐收藏中的数据。花点时间思考一下你想知道的内容：显然是标题和艺术家，可能还有唱片公司、获取日期以及你对该录音的个人备注。我想了想为我自己的表想要什么，我决定将其命名为\
  \ `my_music`。\n\n在接下来的部分中，你将创建一系列表单，获取你的表信息并将其发送到 MySQL 数据库。在第一步中，你将提交表名和你想包含的字段数量。第二步将显示额外的表单字段，以便你定义表列的属性。第三步将向请求到\
  \ MySQL，验证表已创建，并显示“成功！”消息。\n\n第 179 页\n\n| **表 12.1 一些 MySQL 数据类型** |\n| **数据类型**\
