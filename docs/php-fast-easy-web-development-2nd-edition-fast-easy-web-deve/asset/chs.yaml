  \n### 在 Linux 上安装 MySQL\n\n本节将带你完成使用 MySQL AB 发行版在 Linux 上安装 MySQL 4.0。如果你使用的是其他版本的\
  \ Linux，请下载适当的文件并遵循发行版附带的说明。\n\n第 12 页\n\nMySQL 推荐的安装方法是使用 RPM。有多个 RPM 包组成了一个完整的发行版，但对于极简安装，你需要：\n\
  \n* `MySQL-VERSION.i386.rpm`——MySQL 服务器。\n* `MySQL-client-VERSION.i386.rpm`——标准的\
  \ MySQL 客户端程序。\n\n要下载这些文件，请访问 http://www.mysql.com/downloads/mysql-4.0.html 页面上的“Linux\
  \ downloads”部分。RPM 列在“RedHat packages (rpm)”下方。当你点击其中一个包的 Download 链接时，你将进入一个镜像站点页面。选择离你最近的镜像站点并下载文件。\n\
  \n当文件下载到你的系统后，通过在提示符处输入以下命令进行极简安装，请将 `VERSION` 替换为你下载的文件的相应版本号：\n\n```\n#prompt>\
  \ rpm -i MySQL-VERSION.i386.rpm MySQL-client-VERSION.i386.rpm\n```\n\n如果 RPM 方法对你不起，你也可以从二进制发行版安装\
  \ MySQL，这需要 `gunzip` 和 `tar` 来解压缩和提取发行版，并且还需要在系统上创建组和用户的权限。\n\n在第一系列命令中，你将添加一个组和一个用户，然后解压发行版，如下：\n\
  \n**1.** 在提示符处，输入 `groupadd mysql`\n\n**2.** 在提示符处，输入 `useradd -g mysql mysql`\n\
  \n**3.** 在提示符处，输入 `cd /usr/local`\n\n| **注意** |\n| :--- |\n| 你可以在任何目录下安装 MySQL。如果你没有像上面示例那样使用\
  \ `/usr/local/`，请务必适当修改后续命令。 |\n\n**4.** 在提示符处，输入 `gunzip < /path/to/mysql-VERSION-OS.tar.gz\
  \ | tar xvf -`\n\n**5.** 要创建一个更短名称的链接，输入 `ln -s mysql-VERSION-OS mysql`\n\n**6.**\
  \ 输入 `cd mysql` 切换目录。\n\n第 13 页\n\n一旦解压发行版，`README` 和 `INSTALL` 文件将引导你完成你所选择的 MySQL\
