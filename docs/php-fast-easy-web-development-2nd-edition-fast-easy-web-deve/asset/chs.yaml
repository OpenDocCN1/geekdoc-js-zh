  \ 437 页\n\n### 杂项函数\n\n`die()` 和 `exit` 函数为脚本执行提供了实用的控制，为错误提供了退出路径。其他函数进入了这一“类别”。\n\
  \n### die()\n\n`die()` 输出指定的并在并在返回假时终止脚本。其语法如下：\n\n```php\ndie(\"message\");\n```\n\
