  Cookies 是非常棒的小工具，但当坏心的人滥用它们时，媒体会对它们大加诟点。如果你使用得当，这些小小的文本片段会让你的开发工作变得轻松得多。在本章中，你将学习如何进行以下操作\n\
  \n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif) 设置 cookie\n\n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif)\
  \ 从 cookie 中提取数据\n\n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif) 修改你的用户身份验证程序以使用\
  \ cookie\n\n第 238 页\n\n### 什么是 Cookie？\n\nCookies 是发送到用户 Web 浏览器的文本片段。Cookies 可以帮助你创建购物车、用户社区和个性化网站。不建议在\
  \ cookie 中存储敏感数据，但你可以存储一个唯一标识字符串，该字符串将与用户与数据库中安全存储的数据相匹配。\n\n以购物为例。假设你给一个用户分配了一个标识变量，以便跟踪他在访问你的网站时所的操作。首先，用户登录，你发送一个带有变量的\
  \ cookie，这些变量的设计意图是：“这是 Joe，Joe 被允许在这里”。当 Joe 在你的网站上闲逛时，你可以在每一个页面都显示：“你好，Joe！”。如果\
  \ Joe 点击了你的目录并选择了 14 不同的物品进行购买，你可以跟踪这些物品，并在 Joe 进入结算区域时将它们一次性全部显示。\n\n### 设置 Cookies\n\
  \n![Image](img/b0ecb1e743db81b087212b9f714b0395.jpg)\n\n如果你听从了这个警告，你就不必花几个小时去琢磨为什么会收到“Cannot\
  \ add header information”（无法添加头部信息）的错误了。这段示例代码正是为了解决这个问题。\n\n![Image](img/3629c341c4c72857d7c9408c16aa9a79.jpg)\n\
  \n当你看到这个错误时，请假设你向 Web 浏览器发送了*某些东西*。这可能包括空格、换行符或你实际上看到的文本。\n\n第 239 页\n\n`setcookie()`\
  \ 函数用于一次设置一个 cookie，它期望六个参数：\n\n* **Name**（名称）。存储将保留在全局 `$_COOKIE` 中的变量名，并在随后的脚本中可以访问的。\n\
  * **Value**（值）。传递给 `name` 参数的变量值。\n* **Expiration**（过期时间）。设置一个特定的时间，在该时间之后，cookie\
  \ 的值将不再可访问。没有设置特定过期时间的 cookie 将在 Web 浏览器关闭时过期。\n* **Path**（路径）。决定 cookie 在哪些目录下有效。如果\
  \ `path` 参数中是单斜杠 `/`，则 cookie 对 Web 服务器上的所有文件和目录都有效。如果指定了特定目录，该 cookie 仅对该目录内的页面有效。\n\
  * **Domain**（域名）。Cookies 仅对设置它的主机和域名有效。如果没有指定域名，默认值是生成 cookie 的服务器的主机名。`domain`\
  \ 参数的字符串中必须至少包含两个点才能有效。\n* **Security**（安全）。如果安全参数为 1，则 cookie 将仅通过 HTTPS 传输，也就是说通过安全的\
  \ Web 服务器传输。\n\n接下来的这一行是一个名为 `id` 的 cookie 示例，值为 `55sds809892jjsj2`。这个特定的 cookie\
  \ 将四后过期（当前时间加上 14,400 秒），并且对于域名 `yourdomain.com` 上文档根目录下的任何页面都有效。\n\n```\nsetcookie(\"\
  id\", \";55sds809892jjsj2\", time()+14400, \"/\"\".yourdomain.com\",0);\n```\n\n\
  在下一节中，我将为你提供一份 `time` 常用值的对照表。然后你将进入 cookie 变量的使用。\n\n#### 计数时间\n\n如果你想指定过期日期或时间，最简单的方法是让\
  \ PHP 为你计数，然后在 `setcookie()` 函数的过期槽位中放置一个值。这个值应该是一个 UNIX 时间整数（自 1970 年 1 月 1 日以来的秒数），你可以使用\
  \ `time()` 函数并加上额外的秒数来获取它。\n\n在 cookie 上设置过期日期可以为用户的有效性提供一些额外的保障。如果你在设置 cookie 时没有时间限制，它将在用户关闭浏览器时自动过期。这在用户共享电脑时很有帮助；你不希望下一个用户获得上一个用户\
  \ cookie 所赋予的所有权限。同样，如果你正在构建一个在线商店，允许用户在访问网站的前 15 分钟内购买的所有商品获得折扣，你可能只想将 cookie 设置为\
  \ 15 分钟有效。\n\n表 16.1 显示了 `setcookie()` 函数中 `time()+*n` 的一些常见用法。\n\n| 表 16.1 常用时间\
  \ |\n| 值 | 定义 |\n| :--- | :--- |\n| `time()+60` | 从当前时间起一后 |\n| `time()+900` | 从当前时间起\
  \ 15 分钟后 |\n| `time()+1800` | 从当前时间起 30 分钟后 |\n| `time()+3600` | 从当前时间起 1 小时后 |\n\
  | `time()+14400` | 从当前时间起 4 小时后 |\n| `time()+43200` | 从当前时间起 12 小时后 |\n| `time()+86400`\
  \ | 从当前时间起 24 小时后 |\n| `time()+259200` | 从当前时间起 3 天后 |\n| `time()+604800` | 从当前时间起\
  \ 1 周后 |\n| `time()+2592000` | 从当前时间起 30 天后 |\n\n#### 设置 Cookie\n\n此脚本的目的是设置一个测试\
  \ cookie。在开始之前，请确保你没有任何阻止 cookie 的设置。\n\n1. 在文本编辑器中打开一个新文件，启动 PHP 块，创建 `cookie_name`、`cookie_value`、`cookie_expire`\
  \ 和 `cookie_domain` 并给它们赋值以下值：\n\n```php\n<?\n$cookie_name = \"test_cookie\";\n\
  $cookie_value = \"test!\";\n$cookie_expire = 86400;\n$cookie_domain = \"127.0.0.1\"\
  ;\n```\n\n2. 使用 `setcookie()` 函数设置这个 cookie：\n\n```php\nsetcookie($cookie_name,\
  \ $cookie_value, $cookie_expire, \"/\", $cookie_domain, 0);\n?>\n```\n\n3. 输入以下\
  \ HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Set Cookie</TITLE>\n</HEAD>\n<BODY>\n\
  <h1>cookie!</h1>\n</BODY>\n</HTML>\n```\n\n4. 将文件保存为 `setcookie.php` 并将其放在 Web 服务器的文档根目录下。\n\
  \n5. 打开你的 Web 浏览器并输入 `http://127.0.0.1/setcookie.php`\n\n6. 点击确定以接受 cookie。\n\n\
  ### 使用 Cookie 变量\n\n使用 cookie 有一个元素大多数人们在花费几个小时调试完全没有错误的问题才会忘记。当 Web 浏览器接受一个 cookie\
  \ 时，在下一次 HTTP 请求之前你无法提取它的值。\n\n也就是说，如果你在页面 1 上设置了一个名为 `name` 值为 `Julie` 的 cookie，在用户到达页面\
  \ 2（或页面 5、28——任何不是初始设置 cookie 的页面）之前你无法提取该值。\n\n#### 结合验证使用 Cookie\n\n在上一章的验证脚本中，你有一个登录表和一个结果页面。然而，验证仅对结果页面有效，因为它是动态显示内容（在本例中是“恭喜！”消息）。如果你想对一组静态页面进行身份验证，你需要进行一些微调。\n\
  \n1. 在文本编辑器中打开 `do_authuser.php`。\n2. 滚动到处理验证结果的 `if...else` 块。添加一个设置 cookie 的块：\n\
  \n```php\nif ($num != 0) {\n    $cookie_name = \"auth\";\n    $cookie_value = \"\
  ok\";\n    $cookie_expire = \"0\";\n    $cookie_domain = \"127.0.0.1\";\n    setcookie($cookie_name,\
  \ $cookie_value, $cookie_expire, \"/\", $cookie_domain, 0);\n}\n```\n\n\n\n\n\n\
  `setcookie()` 函数将发送一个名为 `auth` 的 cookie，其值为 `ok`。它将在浏览器会话结束时过期，并且对 `127.0.0.1` 所有目录有效。如果适用，请使用你自己的域名。\n\
  \n### 3. 删除此行：\n\n```php\n$msg = \"<P>Congratulations, you're authorized!</p>\"\
  ;\n```\n\n### 4. 添加此字符串：\n\n```php\n$display_block = \" <p><strong>Secret Menu:</strong></p>\
  \ <ul> <li><a href=\\\"secretA.php\\\">secret page A</a> <li><a href=\\\"secretB.php\\\
  \">secret page B</a>> </ul>\";\n```\n\n| 注意 |\n| :--- |\n| 别担心；你很快就会创建这些页面。 |\n\n\
  ### 5. 滚动直到看到以下内容：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n### 6. 将其替换为此内容：\n\n\
  ```php\n<? echo \"$display_block\"; ?>\n```\n\n### 7. 保存文件。\n\n你的新代码看起来应该是这样的：\n\
  \n```php\n<? //check for required fields if ((!$_POST[username]) || (!$_POST[password]))\
  \ { header(\"Location: http://127.0.0.1/show_login.html\"); exit; } //setup names\
  \ of database and table to use\n\n$db_name = \"testDB\"; $table_name = \"auth_users\"\
  ; //connect to server and select database $connection = @mysql_connect(\"127.0.0.1\"\
  , \"spike\", \"9sj7En4\") or die(mysql_error()); $db = @mysql_select_db($db_name,\
  \ $connection) or die(mysql_error()); //build and issue query $sql = \"SELECT *\
  \ FROM $table_name WHERE username = '$_POST[username]' AND password = password('$_POST[password]')\"\
  ; $result = @mysql_query($sql) or die (mysql_error()); //get the number of rows\
  \ in the result set $num = mysql_numrows($result); //print a message and set a cookie\
  \ if authorized, //or redirect elsewhere if unauthorized if ($num != 0) { $cookie_name\
  \ = \"auth\"; $cookie_value = \"ok\"; $cookie_expire = \"0\"; $cookie_domain = \"\
  127.0.0.1\"; setcookie($cookie_name, $cookie_value, $cookie_expire, \"/\", $cookie_domain,\
  \ 0); $display_block = \" <p><strong>Secret Menu:</strong></p> <ul> <li><a href=\\\
  \"secretA.php\\\">secret page A</a> <li><a href=\\\"secretB.php\\\">secret page\
  \ B</a> </ul>\"; } else { header(\"Location: http://127.0.0.1/show_login.html\"\
  ); exit; } ?> <HTML> <HEAD>\n\n<TITLE>Secret Area</TITLE> </HEAD> <BODY> <? echo\
  \ \"$display_block\"; ?> </BODY> </HTML>\n```\n\n![Image](img/41eaedccfa2b9437133afc8419d8bd17.jpg)\n\
  \n![Image](img/eb00166eebd506696b227571c2a8a699.jpg)\n\n### 检查身份验证 Cookie\n\n秘密菜单包含指向两个文件的链接：`secretA.php`\
  \ 和 `secretB.php`。通过在这些页面开头添加一段代码，你将能够检查授权用户。\n\n### 1. 在你的文本编辑器中打开新文件并开始 PHP 块：\n\
  \n```php\n<?\n```\n\n### 2. 一个 if...else 块来检查 `$_COOKIE[auth]` 的值。该值必须为 `ok`，用户才能被授权用户：\n\
  \n```php\nif ($_COOKIE[auth] == \"ok\") {\n```\n\n### 3. 创建一个用于存储成功消息的变量：\n\n```php\n\
  $msg = \"<P>Welcome to secret page A, authorized user!</p>\";\n```\n\n### 4. 继续\
  \ if...else 语句以处理未授权的访问者。未授权的用户将被重定向到登录表单：\n\n```php\n} else { header( \"Location:\
  \ http://127.0.0.1/show_login.html\"); exit; }\n```\n\n| 注意 |\n| :--- |\n| 未授权的访问者是指尝试在不通过身份验证过程直接访问\
  \ `secretA.php` 的人。 |\n\n### 5. 关闭 PHP 块并输入以下 HTML：\n\n```html\n?> <HTML> <HEAD>\
  \ <TITLE>Secret Page A</TITLE> </HEAD> <BODY>\n```\n\n### 6. 显示消息：\n\n```php\n<?\
