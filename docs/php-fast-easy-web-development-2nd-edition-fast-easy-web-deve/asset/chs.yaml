  \n\n\n\n\n接下来，你将使用 session 开始编写你自己的每个用户计数脚本。\n\n### 启动 Session\n\n启动 session 轻而易举。你只需要调用\
  \ `session_start()` 函数，PHP 就会处理剩下的工作——发送 cookie 并创建临时文件。\n\n1.  在你的文本编辑器中打开一个新文件并开始一个\
  \ PHP 块：\n\n```php\n<?\n```\n\n2.  调用 `session_start()` 函数：\n\n```php\nsession_start();\n\
  ```\n\n| **注意** |\n| `session_start()` 函数实际上执行了多项重要任务。首先，它会检查当前用户是否已经启动了 session，如果有必要，它将启动一个。它还会通知\
  \ PHP 引擎在特定脚本内将使用 session 变量和其他与 session 相关的函数。 |\n| 由于 `session_start()` 的双重用途，请在所有与\
  \ session 相关脚本的开头使用它。 |\n\n3.  创建一个字符串来存储消息：\n\n```php\n$msg = \"started a session....\"\
  ;\n```\n\n4.  关闭 PHP 块：\n\n```php\n?>\n```\n\n5.  输入以下 HTML：\n\n```html\n<HTML>\
  \ <HEAD> <TITLE>Start a Session</TITLE> </HEAD> <BODY>\n```\n\n6.  显示消息字符串：\n\n\
  ```php\n<? echo \"$msg\"; ?>\n```\n\n7.  添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY>\
  \ </HTML>\n```\n\n8.  将文件保存为 `session.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n9.  打开你的\
  \ 浏览器并输入 `http://127.0.0.1/session.php`\n\n![Image](img/008b43e388e10d64afa3d411064b4251.jpg)\n\
  ![Image](img/c9a314ae468523235967b4aec840d501.jpg)\n\n这多么具有启发性啊？在下一节中，你将注册一个实际的值，并在会会话期间观察它的变化。\n\
  \n### 注册和修改 session 变量\n\n此脚本的目标是注册一个变量并在用户会话期间更改其值。\n\n1.  在你的文本编辑器中打开一个新文件，启动一个\
  \ PHP 块并调用 `session_start()` 函数：\n\n```php\n<? session_start();\n```\n\n2.  注册一个名为\
  \ `count` 的变量：\n\n```php\nsession_register('count');\n```\n\n| **注意** |\n| 现在，只要这个\
  \ session 存在，一个名为 `$_SESSION[count]` 的变量就是可用的。目前，该变量没有值。 |\n\n3.  增加 `$_SESSION[count]`\
  \ 的值以计算当前的访问：\n\n```php\n$_SESSION[count]++;\n```\n\n4.  创建一个字符串来存储消息，包括 `$_SESSION[count]`\
  \ 的值：\n\n```php\n$msg = \"<P>You've been here $_SESSION[count] times. Thanks!</p>\"\
  ;\n```\n\n5.  关闭 PHP 块并输入以下 HTML：\n\n```php\n?> <HTML> <HEAD> <TITLE>Count Me!</TITLE>\
  \ </HEAD> <BODY>\n```\n\n6.  显示消息字符串：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n7.\
  \  添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY> </HTML>\n```\n\n![Image](img/1d22bdc7ed32147643a0237a3f3b3813.jpg)\n\
  \n8.  将文件保存为 `countme.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n9.  打开你的 浏览器并输入 `http://127.0.0.1/countme.php`\n\
