  \n### 为代码编写注释\n\n编写代码注释是一个良好的习惯。在 HTML 文档中输入注释可以帮助你（以及以后可能需要编辑你文档的人）跟踪大型文档的区域。注释还允许你在开发过程中为自己写笔记，或者在测试脚本时注释掉部分代码。\n\
  \nHTML 注释会被浏览器忽略，并包含在 `<!--` 和 `-->` 标签中。例如，下面的注释提醒你，紧随其后的代码包含了你的 Logo 图形：\n\n```html\n\
  <!-- logo graphic goes here -->\n```\n\nPHP 也使用注释，这些注释会被 PHP 解析器忽略。PHP 注释通常以双斜杠开头，如下：\n\
  \n```php\n// this is a comment in PHP code\n```\n\n### 你也可以使用其他类型的注释，例如\n\n```php\n\
  # This is shell-style style comment\n```\n\n以及\n\n```php\n/* This begins a C-style\
  \ comment that runs onto two lines */\n```\n\n第 54 页\n\n创建一个充满注释的脚本，这样你就可以看到它们是如何被忽略的。是的，我是在让你写一个什么都不执行的脚本！\n\
  \n### 1. 在你的文本编辑器中打开一个新文件。\n\n### 2. 输入以下 HTML：\n\n```html\n<HTML> <HEAD> <TITLE>Code\
