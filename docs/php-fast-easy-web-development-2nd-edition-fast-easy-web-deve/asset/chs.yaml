  \ 变量创建一个带有自定义错误信息的反馈表单\n\n第 106 页\n\n### 使用 SMTP 服务器\n\nSMTP（简单邮件传输协议）服务器是传输邮件的机器，就像\
  \ Web 服务器是在请求时显示 Web 页面的机器一样。SMTP 服务器有时被称为发邮件服务器，这引出了我的观点——你需要它来完成本章的练习。在 Linux/UNIX\
  \ 上，`Sendmail` 和 `Qmail` 是流行的软件包。在 Windows 上，通常使用 Windows NT Service Pack 中的 SMTP\
  \ 服务，或内置在 Windows 2000 操作系统中的服务。\n\n如果你已经在个人机器上作为开发环境的一部分安装了 Apache、PHP 和 MySQL，那么你可能在本地没有运行\
  \ SMTP。如果是这样，你可以访问一个可能已经为你提供的发邮件服务器。\n\n| 注意 | |\n\n| 如果你跳过了本书的前三章，并将 PHP 作为互联网服务提供商的虚拟主机包的一部分使用，那么\
  \ SMTP 服务器应该已经安装在该某台机器上，并且 PHP 应该已经正确配置，以便访问它。 |\n\n如果你的机器通过拨号连接、DSL、电缆或其他类型的访问连接到互联网，你可以使用你的互联网服务提供商的发邮件服务器。例如，如果你的开发机是一台通过\
  \ EarthLink 连接到互联网的带有 56Kbps 调制器的 Windows 98 ，那么可以使用 `mail.earthlink.net` 作为你的 SMTP\
  \ 服务器。无论你在电子邮件客户端（Eudora、Outlook、Netscape Mail 等）中配置了什么作为发邮件服务器，它在你的 PHP 代码中也会作为\
  \ SMTP 服务器正常工作。诀窍在于让 PHP 知晓这个小小的事实，你将在下文中学习到。\n\n#### php.ini 中与 SMTP 相关的更改\n\n\
  在 `php.ini` 主配置文件中有几个指令需要设置，以便 `mail()` 函数能够正常工作。用文本编辑器打开 `php.ini` 并查找这些行：\n\n\
  ```\n[mail function] ; 仅限 Win32. SMTP = localhost\n\n; 仅限 Win32. sendmail_from =\
  \ me@localhost.com ; 仅限 Unix。你也可以提供参数（默认：'sendmail -t -i'）。sendmail_path =\n```\n\
  \n如果你使用的是 Windows，你需要修改前两个指令 `SMTP` 和 `sendmail_from`。如果你计划使用 ISP 的发邮件服务器（在本例中为\
  \ EarthLink），`php.ini` 中的条目看起来如下：\n\n`SMTP = mail.earthlink.net`\n\n第二个配置指令是 `sendmail_from`，这是发件邮件中\
  \ From 头部所使用的电子邮件地址。它可以在邮件脚本本身中被覆盖，但通常作为默认值运行。例如\n\n`sendmail_from = youraddress@yourdomain.com`\n\
  \n当然，将 `youraddress@yourdomain.com` 替换为你自己的地址。\n\n如果你在 Linux 或 Unix 变体上，`sendmail_path`\
  \ 是你唯一需要担心的，它看起来类似于：\n\n`sendmail_path = /usr/sbin/sendmail`\n\n或者，如果你在使用 `Qmail`\n\
  \n`sendmail_path = /var/qmail/bin/sendmail`\n\n在 `sendmail_path` 指令中，你也可以设置配置标志以指定队列选项或显式地设置\
  \ `Return_Path` 头部，例如\n\n`sendmail_path = /usr/sbin/sendmail -t -fyou@yourdomain.com`\n\
  \n在修改 `php.ini` 文件后，重启 Web 服务器以使更改生效。\n\n### 简单的反馈表单\n\n一个简单的反馈表单包含用户的姓名、电子邮件字段以及用于消息的文本区域。在本节中，我们将创建两个文件：一个反馈表单，另一个用于发送邮件的\
