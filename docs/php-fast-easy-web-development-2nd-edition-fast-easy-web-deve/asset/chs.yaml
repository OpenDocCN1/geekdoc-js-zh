  \n第 387 页\n\n### 故障排除：你的邮件列表机制\n\n如果你收到如 ''Warning: Can't connect”（警告：无法连接）之类的错误，你必须确保已修改了\
  \ `php.ini` 文件中的 `SMTP` 值。此主题在第 8 章“发送电子邮件”中有介绍，这是一个简单的修复方法。\n\n使用这种类型的邮件列表机制时的另一个常见问题是，如果你的列表足够长，脚本最终会超时。这就是为什么不要使用这种机制向大型接收者列表发送邮件通讯的原因之一。因为该脚本所做的只是多次执行\
  \ `mail()` 函数，它没有考虑到真实邮件列表软件中的队列因素，而这些软件的设计是为了减轻你出站邮件服务器的负担。\n\n为了解决脚本超时问题，你可以在脚本执行过程中重置计时器。本质上，通过在\
  \ `while` 循环中插入以下行代码，你可以在每次调用 `mail()` 函数之前将计时器器重置为 0：\n\n```php\nset_time_limit(0);\n\
  ```\n\n你的 `while` 循环现在看起来像这样：\n\n```php\nwhile ($row = mysql_fetch_array($result))\
  \ { set_time_limit(0); $email_addr = $row['email_addr']; mail(\"$email_addr\", stripslashes($_POST[$subject]),\
  \ stripslashes($_POST[newsletter]), $headers); echo \"newsletter sent to: $email_addr<br>\"\
  ; }\n```\n\n记住，这并不能减轻出站邮件服务器的负担，它只是允许脚本在原本可能会超时的情况下继续运行。\n\n第 388 页\n\n*本页特意留白。*\n\
