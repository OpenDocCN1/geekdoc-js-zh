  \n第 104 页\n\n*本页特意留白。*\n\n第 105 页\n\n## 8 发送电子邮件\n\n使用 PHP 将表单内容发送到指定的电子邮件地址是如此简单，你你会怀疑为什么没有更多人每天这样做。在本章中，你将学习如何执行以下操作：\n\
  \n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif) 修改 PHP 配置文件以便你可以发送邮件\n\n![Image](img/7d7a2e0ba0a073b56dbf1e974a0a8bd2.gif)\
