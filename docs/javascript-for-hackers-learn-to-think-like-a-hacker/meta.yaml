    # Modification of native methods


    When a site is vulnerable to prototype pollution you are not limited to just manipulating
    the Object prototype, you can change one of the built native methods of the global
    Object or others. For example, imagine a site uses the Object.keys method, it''s
    possible to overwrite this method using a prototype pollution source. An attack
    might look like this:


    ```

    __proto__[keys]=//Object.keys === ""

