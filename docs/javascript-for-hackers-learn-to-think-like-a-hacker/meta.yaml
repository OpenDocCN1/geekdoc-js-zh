    1 <xml>

    2 <text>hello<img src="i" onerror="alert(i)" xmlns="http://www.w3.org/1999/xhtml"
    \

    3 />></text>

    4 </xml>

    ```


    This can be useful for file uploads or when you have control over a REST API response
    with an XML content type.


    # SVG uploads


    It''s common to allow image uploads on a web application but many forget you can
    use script inside the SVG documents. Unlike inside HTML the parsing is stricter
    when using an SVG with the correct mime type. You need to ensure the correct namespace
    attribute has been added and it should conform to XML parsing rules e.g. all attributes
    should be quoted.


    ```

    1 <svg id=''x'' xmlns="http://www.w3.org/2000/svg" xmlns:link="http://www.w3.org/1999/x"

    2 link width=''100'' height=''100">

    3 <image href="#" onerror="alert(1)" />

    4 </svg>

    ```


    You can prevent exploitation of this issue by obviously filtering the SVG but
    if you can''t do that you can always serve the file with a content position header
    and value attachment:


    Content-Disposition: attachment


    This should prevent the SVG from being rendered in a modern browser. There is
    a caveat though: if it is embedded via the <use> element it will still render.


    # SVG use elements


    As mentioned above you can get JavaScript execution by embedding an SVG document
    using the <use> element inside SVG. This works that that the document is on the
    same domain. You can also use data URLs and I''ll demonstrate this below:'
