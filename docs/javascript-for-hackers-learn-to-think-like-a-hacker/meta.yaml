    \n```javascript\nObject.prototype.body='foo=bar'\nconst request = new Request('/myEndpoint',\
    \ {\n  method: 'POST',\n});\nfetch(request);\n```\n\n上面的代码使用 `Request` 对象构建发送到\
    \ `fetch()` 函数的请求，因为 `Request` 对象没有定义 `body` 属性；可以通过原型污染通过继承的属性来控制该属性。当发送 POST\
    \ 请求时，它将包含一个 POST 请求。\n\n```javascript\nObject.prototype.body='foo=bar'\nconst\
    \ request = new Request('/myEndpoint', {\n  method: 'POST',\n});\nfetch(request);\n\
    ```\n\n（注：原文中存在多处重复的段落，翻译时已去重并保持逻辑一致）\n"
