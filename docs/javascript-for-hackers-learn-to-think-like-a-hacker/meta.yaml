    ```


    Another way to round the character restriction is to use JavaScript''s ASI (automatic
    semicolon insertion), you can use new lines instead of semicolons and JavaScript
    will insert them for you automatically:


    ```

    onerror=alert

    ```


    ```

    throw 1337

    ```


    JavaScript supports paragraph and line separators for new lines too which are
    super useful for bypassing a WAF since "onerror" is likely going to be blocked
    by the regexes often overlooked alternative characters. I''ll use eval to illustrate
    this since the characters won''t print well:


    ```

    eval("onerror=     alert\u2029throw 1337");

    ```


    The Unicode escape \u2029 represents the paragraph separator and \u2028 represents
    the line separator. Both act as new lines and wherever you can put a new line
    you can use these characters.


