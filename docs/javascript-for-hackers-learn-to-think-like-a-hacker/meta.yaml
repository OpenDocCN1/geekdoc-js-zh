  md: 'Chapter six - Prototype pollution


    # Gadget


    A gadget means that the property you''ve polluted is used somewhere interesting
    like an eval function or other method or assignment that can result in a vulnerability.
    The property becomes a gadget when it reaches a vulnerable sink.


    # Potential gadget


    If you''ve found a property that is controllable via prototype pollution but you
    have yet to identify if it hits a sink then you can refer to this as a potential
    prototype pollution gadget.


    # Client-side prototype pollution


    There are two forms of prototype pollution: client and server side. This section
    deals with the client-side form. The goal of exploiting client-side prototype
    pollution is generally DOM XSS. You find if the site allows to add properties
    to the Object prototype and then see if the property hits a sink that results
    in controlling JavaScript or HTML.


    # Finding prototype pollution


    Now we''ve defined the terms we can start to look for prototype pollution. You
    can do this by simply injecting a vector and then use the browser console to confirm
    that it. For example imagine a site allows you to use names & values in the query
    string and has a vulnerable merge operation in a library they use. You could inject
    a probe into the query string that attempted to set a property on the Object prototype:


    ```

    __proto__[foo]=bar

    ```


    After the page has loaded you could use the browser console to inspect the Object
    prototype:


    +   1. console.log(Object.prototype)

    2. //foo: ''bar'', constructor: f, __defineGetter__: f, __defineSetter__: f, hasOwnProp_

    3. rty, f -


    If the Object prototype contains properties you''ve successfully found client-side
    prototype pollution. Using the __proto__ property isn''t the only one of finding
    prototype pollution, you can use the constructor[prototype] properties which is
    essentially the same thing, it''s less common than the __proto__ property because
    it requires three property keys and often sites will generally use two. To test
    for this you can follow the same process just replace __proto__ with constructor[prototype]:


    ```

    ?constructor[prototype][foo]=bar

    ```


    Which results in manipulation of the object prototype provided the site is vulnerable
    to this technique:'
