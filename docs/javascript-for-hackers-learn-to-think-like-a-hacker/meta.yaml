  md: "# Chapter three - Fuzzing\n\nYou can apply the logic above to fuzz single line\
    \ comments, instead of placing the placeholders at the either end of the random\
    \ string you can place them before to detect them. Next let's find single line\
    \ comments:\n\n```\nlog=[];\nfor(let i=0;i<0xffff;{\n  try {\n    eval(`${String.fromCodePoint(i,i)}%$l234$`)\n\
    \    log.push(i);\n  } catch(e){n}\nconsole.log(log));//47\n```\n\nWe detected\
    \ a forward slash as expected. You can see there is a real skill in crafting fuzz\
    \ vectors to finding interesting behaviour. We need to consider how the fuzz vector\
    \ will be executed and in what context to avoid false positives.\n\nFinally in\
    \ this chapter we're going to cover nested fuzzing to find an interesting JavaScript\
    \ comment behaviour that you might not be aware. Nested fuzzing is tricky because\
    \ it involves more characters and currently modern browsers are not powerful enough\
    \ to execute multiple for loops with codepoints greater than 0xff. However if\
    \ we reduce the amount of codepoints being tested we can find some interesting\
    \ stuff.\n\n```\nlog=[];\nfor(let i=0;i<=0xff;i++){\n  for(let j=0;j<=0xff;j++){\n\
    \    try {\n      eval(`${${String.fromCodePoint(i,j)}%$l234$`)\n      log.push([i,j]);\n\
    \    } catch(e){n  }\n}\nconsole.log(log)//[35, 47]\n```\n\nWe used nested loops\
    \ for this time, we had to limit the amount of characters as discussed for performance\
    \ reasons. Then I used the fromCodePoint method to add two characters from one\
    \ code points in each loop and added some junk after the comment to prove a comment\
    \ was happening. We got an array of both characters since both are required to\
    \ produce a comment. We got an expected double forward slash but what's this?\
    \ 35 and 33 are “#!” they act as a single line comment provided they are at the\
    \ beginning of the executed JavaScript. You can verify your results by trying\
    \ to execute an alert with comment in place."
