    ```


    Another feature in JavaScript is optional exception variables inside a catch clause.
    This allows us to try catch blocks without parentheses and simply throw the exception
    again to call the exception handler:


    ```

    try{throw onerror=alert}catch(throw 1337)

    ```


    # Tagged templates


    Tagged template strings offer many ways to call functions without parentheses.
    As mentioned in the strings section in chapter one, you can use template strings
