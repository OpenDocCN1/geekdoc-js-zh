  md: "# Chapter three - Fuzzing\n\nNot only can you fuzz for characters you could\
    \ also fuzz hex by changing the placeholder. Each number literal has a toString\
    \ method that allows you to specify the radix which will convert the integer into\
    \ the base specified from 2-36. Hexadecimal uses base 16 so we have to pass a\
    \ radix of 16 to convert it hex:\n\n```\nlet a = 123;\nlog([]);\nfor(let i=0;i<=0x1ffff;i++){\n\
    \  try {\n    eval(`\\${i.toString(16)}\\`);\n    log.push(i);\n  } catch(e) {\n\
    }\nconsole.log(log)//97,105\n```\n\nThe code above loops through all code points\
    \ and converts the value to hex to see the unicode escape results in a reference\
    \ to variable. We have two results: charcodes 97 and 105 which are the \"a\" and\
    \ the \"i\" characters declared by us. You can mix and match fuzz strings with\
    \ characters and hex to see if the JavaScript engine allows characters before,\
    \ inside or after the hex value. Let's try now and see if the JavaScript engine\
    \ allows any character inside the hex value:\n\n```\nlet a = 123;\nlog([]);\n\
    for(let i=0;i<=0x1ffff;i++){\n  try {\n    eval(`\\${String.fromCodePoint(i),61)}\\\
    `;\n    log.push(i);\n  } catch(e) {\n}\nconsole.log(log)//48\n```\n\nThe code\
    \ above uses a placeholder to add a character before the hex value of the unicode\
    \ escape. We get a single result in Chrome which is character code 48 is the number\
    \ zero that is expected but it's worth trying on other browsers to see if you\
    \ get the same results.\n\n# Summary\n\nIn this chapter I've taught you a new\
    \ skill of crafting fuzz vectors! We talked about not trusting specifications\
    \ and seeking your own ways of finding how JavaScript works. I showed you how\
    \ to use DOM properties to fuzz JavaScript and HTTP URLs. We looked at how you\
    \ can use innerHTML to discover how HTML is parsed. We finished off with fuzzing\
    \ known behaviours"
