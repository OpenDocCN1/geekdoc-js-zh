    \n```\n__proto__[keys]=//Object.keys === \"\"\n```\n\n这通过将方法赋值为字符串来移除该方法的功能。在实践中，这种攻击很难利用，因为你无法直接提供你的函数，而是受限于字符串或\
    \ JSON 支持的类型。然而，你可以将这种技术作为漏洞链的一部分，引导你进入不同的代码路径。\n\n### 原生浏览器 API\n\n非常令人惊讶，浏览器\
    \ API 本身也容易受到原型污染。只要 API 允许你将对象字面量作为参数传递（通常在配置中），你就可以使用原型污染来影响值。一个例子是 `fetch()`\
