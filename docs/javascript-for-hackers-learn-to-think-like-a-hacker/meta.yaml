  pgno: 6
- img_proc: true
  md: 'Chapter one - Introduction


    # Social media


    I use Twitter a lot when I hack JS hacking. It''s useful because you can get instant
    feedback on your technique both positive and negative. As you build followers
    you''ll find other people who enjoy the same thing and you''ll find they point
    out a variant or something you''ve overlooked. It is great because not only are
    you learning everyone who does the conversion is learning too. Imagine if everyone
    took this approach, everyone would learn at a rapid pace and we''d find some really
    JavaScript behaviour. When I went it into all I store in my head and if I forget
    I can always search Twitter or download my tweets to find the particular technique.
    Important thing though is that Twitter is not good for long term storage of data,
    if you''ve found something you''re particularly proud of you are better off writing
    a blog post and tweeting a link to.


    # The basics


    In this section I''ll go over the basics of JavaScript hacking to give you the
    foundation to handle the other chapters. If you''re an experienced developer or
    JS hacker feel free to skip this section. If you want to learn more about JavaScript
    please stick with me. JavaScript supports various types of encoding, you have
    hexadecimal, octal and two flavours of unicode encoding.


    # Hexadecimal


    First up we''ll tackle hexadecimal encoding, this works only within strings, if
    you try and use them as identifiers then they will fail. Hex uses a base of 16
    and the escape is prefixed with an "x". Here are some examples:


    ```

    ```

    \x61''//a

    \x61"//a

    \x61"//a


    function a(){

    \x61()//fails

    ```

    ```


    In the examples above you can see the first three correctly inside strings but
    the last example fails to call the function because hex escapes aren''t allowed
    there. Another interesting aspect is that hex escapes have to use a lowercase
    "x", if you use an uppercase "X" then it won''t be treated as a hex escape and
    the JavaScript engine will simply process the string as a literal X followed by
    the characters you specify.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Unicode


    Unicode escapes also work in strings but are also allowed in identifiers. There
    are two forms of unicode escapes “u” and \[u]. The former allows you to produce
    a character within the range 0x00-FFFF the latter allows you to specify the entire
    range of unicode code points. There are some examples of unicode escapes:


    ```

    \u0061"//a

    \u0061"//a

    \u0061"//a


    function a(){

    \u0061()//correct calls the function

    ```


    The code above will execute perfectly fine, each string about this form of unicode
    escapes and the function will be called correctly. Some important points about
    this of unicode escapes you must specify four hexadecimal characters for example
    \u61 is not allowed, most browsers will throw an exception: There were some browsers
    that allow invalid unicode escapes such as \u61 but this was a bug. You cannot
    parentheses or other characters only outside of strings. Next is another type
    of unicode escape that allows you to specify code points for the entire range,
    they have similar characteristics as standard unicode escapes that you can use
    in strings and unlike standard unicode escapes they are not restricted to four
    hexadecimal characters. To use these escapes you use \[u] inside the curly braces
    you specify a hex unicode code point. The following examples will work fine with
    this type of unicode escape:


    ```

    \u61"//a

    \u000000000061"//a

    \u0061"//a


    function a(){

    uu{61}()//correct calls the function


    uu{313a}=123;//unicode character "313a" is allowed as a variable

    ```


    As the code demonstrates an unlimited amount of zero padding and the exclusion
    of zeros will be allowed. You can specify higher unicode characters as the last
    example shows. Those are the main differences between the two unicode escapes:


    # Octal


    Octal escapes use base 8 and can only be used strings. There is no prefix with
    octal escapes; simply use a backslash followed by a base 8 number. If you try
    to use a number outside the octal range the JavaScript engine will return the
    number:'
