    \ be a good idea to verify your results instead of manually doing it each time.\n\
    \n# Fuzzing HTTP URLs\n\nIt's possible to fuzz HTTP URLs too but instead of the\
    \ protocol you can use the hostname to know if it was successful. You can create\
