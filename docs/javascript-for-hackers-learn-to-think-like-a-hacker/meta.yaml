  - '[PAGE 32]


    # Chapter four - DOM for hackers


    # Where''s my window?


    In this chapter we are going to hack the DOM in order to understand it and hopefully
    teach you new techniques that you weren''t aware of. First, the goal of this section
    is to get the window object via the DOM. Why do we want a window? The window or
    global object in node are really important for sandbox escape because they allow
    you to reach the globally defined functions such as eval which allows you to execute
    arbitrary JavaScript that can bypass sandboxes. There are many aliases for the
    window object: frames, globalThis, parent, self, top. If your site isn''t framed
    and top will point to the window object, if it is framed then top will point to
    the top window regardless if it''s cross origin or not. "parent" as you expect
    points to the parent of the current framed page. There is also a way to access
    the window object from a DOM node, document.defaultView stores a reference to
    the current window object. Try it in your browser console:


    ```

    document.defaultView.alert(1337)

    ```


    The code above calls the alert function using the defaultView property of the
    document object to get a reference to the window object. The defaultView property
    is only available on the document object however there''s a trick to get the document
    object from a DOM node and then access the defaultView property from the document.
    You can use a property called ownerDocument and as the name you suggests can get
    the document object using the DOM node:


    ```

    let node = document.createElement(''div'');

    ownerDocument.defaultView.alert(1337)

    ```


    Many sandboxes have been broken using this knowledge since access to the "window"
    object is normally blocked; these workarounds allow you to access it again.


    Events are another way of obtaining a window object, when you use an event on
    a DOM node the handler is defined with an event argument, this is to get the fact
    back in the day when Internet Explorer was widely popular using a global called
    "event". Modern browsers define the event as an argument to the handler that way
    when the event is accessed it is a local variable. Interestingly the global event
    exists today but it is deprecated. In Chrome there is a path property on error
    event and this is an array of objects that led to the creation of the event. The
    last element in the array is the window object, you can obtain a window by simply
    reading it. The pop() function comes in handy for this:'
- md: "## Chapter four - DOM for hackers\n\n```html\n<img src onerror=event.path.pop().alert(1337)>\n\
    ```\n\nIn browsers we use the standardised composedPath() method which returns\
    \ an array equivalent to the path property in Chrome. That you can call the composedPath\
    \ to get the last element of the array and it will contain the window object in\
    \ every browser:\n\n```html\n<img src onerror=composedPath().pop().alert(1337)>\n\
    ```\n\nRemember when I said each handler handles an argument with the event object?\
    \ There is a special case for SVG elements. The browser doesn't add \"event\"\
    \ but rather \"evt\" which means you can access the window object using this argument\
    \ just like the composedPath() method:\n\n```html\n<svg><image ref=1 onerror=evt.composedPath().pop().alert(1337)></svg>\n\
    ```\n\nTo find this I didn't read the Chrome source, instead I looked at the event\
    \ handler's code and the definition in there. If you run this in Chrome you can\
    \ see how the handler function is defined:\n\n```html\n<svg><image ref=1 onerror=alert(onerror)></svg>\n\
    ```\n\nWhich results in the following code:\n\n```javascript\nfunction error(evt)\
    \ { //event is referenced with evt\n  alert(onerror)\n}\n```\n\nSo evt points\
    \ to the event. This seems to be the case for SVG elements but I wonder if there\
    \ are any others? It's worth spending some time to see if they are useful when\
    \ a JavaScript sandbox protects you from accessing the event object.\n\nTo finish\
    \ off this I'm going to cover the error object and how you can prepareStackTrace\
    \ to get access to the window object in Chrome. Using the prepareStackTrace callback\
    \ you can customise stack traces which is handy for developers. The idea is to\
    \ provide a function that has two arguments one for the error message and the\
    \ other for an array of CallSite objects. A CallSite object consists of properties\
    \ and methods related to the stack trace. For example you've got isEqual to determine\
    \ if the current CallSite is within an event function but what you're really interested\
    \ in is how to get a window object. Frankly Chrome provides us with a useful method\
    \ getThis() on a CallSite object and this will return a window object if there's\
    \ no \"this\" defined by the executing code. Let's see it in action:\n\n```javascript\n\
    Error.prepareStackTrace=function(error, callSites) {\n  callSites.shift().getThis().alert(1337);\n\
    };\nError().stack\n```\n\nWe define our callback method, the function simply gets\
    \ the first CallSite object from the array of CallSites, calls the getThis() function\
    \ which returns the window object that we then use to access and call the alert()\
    \ function. The prepareStackTrace callback is only executed when the stack property\
    \ of Error is accessed.\n\n## Scope of an HTML event\n\nWhen a JavaScript event\
    \ is executed on an HTML element the browser executes the executed function with\
    \ the element and the document object. This means you can use shortcuts by just\
