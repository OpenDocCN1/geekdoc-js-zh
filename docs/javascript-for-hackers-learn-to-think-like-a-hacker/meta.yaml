    \  } catch(e) {\n}\n```\n\n```\nconsole.log(log)//34,39,47,96\n```\n\nWere you\
    \ expecting three characters? Can you think what other character will cause string-like\
    \ behaviour? Regex of course you can use a pair of forward slashes to encapsulate\
    \ the characters and it won't cause an exception because the characters will be\
    \ treated as a regex. Chrome is pretty fast with this operation but at the rate\
    \ of testing Firefox is dead slow."
