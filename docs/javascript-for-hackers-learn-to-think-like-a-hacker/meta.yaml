    \ to clobber three levels deep you have to use a different element such as form.\n\
    \n```\n1 <form id=x name=y><input id=z></form>\n2 <form id=x></form>\n3 <script>\n\
    4 alert(x.y.z)\n5 </script>\n```\n\nHowever, there's a problem: As mentioned earlier\
    \ you cannot control the toString of elements other than anchors, so in this case\
    \ \"z\" will be equal to \"object HTMLElement\". In order to clobber properties\
    \ more than three levels deep you have to use valid HTML attributes that are also\
    \ valid DOM properties:\n\n```\n1 <form id=x name=y><input id=z value=1337></form>\n\
    2 <form id=x></form>\n3 <script>\n4 alert(x.y.value)//1337\n5 </script>\n```\n\
    \nThere is one exception to this rule using iframes. With iframes you can use\
