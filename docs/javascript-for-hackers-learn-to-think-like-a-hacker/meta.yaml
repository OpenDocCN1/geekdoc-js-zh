    \ probably added as a comment sequence because of JavaScript being used as shell\
    \ scripts with NodeJS and so a common case was to ignore it.\n\n# Fuzzing escapes\n\
    \nIn my effort to break JavaScript sandboxes I ventured into fuzzing different\
    \ escapes such as unicode escapes discovered in the introduction chapter. This\
    \ led me to find interesting behaviour in various browsers. I found in Safari\
    \ it wouldn't throw an exception when encountering unfinished unicode escapes\
    \ in strings. Old Opera (pre-Chrome) would also incorrectly parse unicode escapes\
    \ when sent to eval. Old behaviours can be used for sandbox escapes if you're\
    \ lucky how do we find them? Fuzzing of course! You have to be aware of the context\
    \ you're fuzzing in and if they require double encoding. Let's fuzz a simple unicode\
    \ escape:\n\n```\nlet a = 123;\nlog=[];\nfor(let i=0;i<0x10ffff;i++){\n  try{\n\
    \    eval(`\\${String.fromCodePoint(i)}\\u0061`\\);\n    log.push(i);\n  } catch(e)\
