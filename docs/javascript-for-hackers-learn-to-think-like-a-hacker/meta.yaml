  md: '# Clobbering document.getElementById()


    This is a technique I found recently where you can actually clobber the results
    of a document.getElementById() call. If you have an element with the id "x" and
    another element with the same id in most circumstances the first element is returned
    by getElementById(). However, I discovered if you use an <html> or <body> element
    you can change the order of the DOM and elements will merge the duplicate tags
    which causes getElementById() to return the <html> or <body> tag depending on
    which one you use:


    ```

    <div id="x"></div>

    <body id="x">

    <script>

    alert(document.getElementById(''x''))

    </script>

    ```


    This can be exploited when a site is protected by CSP and you have a HTML injection
    that occurs after all the elements you wish to exploit. Using this technique you
    can clobber existing nodes and change the results of getElementById() to use your
    element and possibly gain XSS depending on what the site does. This finest whilst
    a well known site where we learned using a div that was invisible at the start
    of the DOM tree near the body tag and they were using this to control a CDN domain
    that was used in a service worker script then they use an importScript() call
    inside the service worker.


    # Clobbering document.querySelector()


    The same technique can be used to clobber the results of document.querySelector(),
    if a site uses it to find the first element with a certain class name the DOM
    will be reordered and the injected <html> or <body> element will be return instead:


    ```

    <div class="x"></div>

    <body class="x">

    <script>

    alert(document.querySelector(''.x''))

    </script>

    ```


    # Summary


    We covered all sorts of interesting things in this chapter. We found different
    ways of getting the window object from a DOM node. Then we looked at the scoping
    of DOM events and how each event has access to not only the element scope but
    also document scope. We finished off with a section on DOM clobbering and explained
    the possible attacks and we learned how difficult it is to write a filter that
    traverses the DOM safely.'
