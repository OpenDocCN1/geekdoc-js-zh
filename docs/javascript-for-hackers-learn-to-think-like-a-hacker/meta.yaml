    when you use a form element to clobber a variable you will get the toString of
    the element itself e.g. [object HTMLFormElement] but with the anchor the toString
    will be the "href":


    ```

    <a href="clobbered:1337" id=x</a>

    <script>

    alert(x);

    alert(typeof x);.object

    </script>

    ```


    As you can see the global "x" contains the string "clobbered:1337" when accessed
    as a string. I said when as a string, "x" is still an object it''s the toString
    of the anchor object that returns the "href" of the element. Something to be aware
    of when attempting DOM clobbering is that you can only get the value of HTML attributes.
    For instance you can''t "x.notAttribute" whereas "x.title" is. I myself myself
    goal many years ago and it''s possible to use collections to get other. DOM Collections
    are array-like objects that hold HTML elements. I found could use multiple elements
    with the same id or name and it would form a collection. You could use another
    id or name (depending on what you originally used) to clobber a second property.
    This is probably best illustrated by an example:


    ```

    <a id=x>

    <a id=x name=y href=clobbered:1337>

    <script>

    alert(x.y);//1337

    </script>

    ```


    In the example above two anchors share an id with the same value "x", this forms
    a DOM collection, the second anchor has a name attribute and it''s a DOM collection
    you can refer to the collection by name or index, in this case we''re referring
    to the second anchor name by "y". It''s quite possible to use an index to:


    ```

    <a id=x>

