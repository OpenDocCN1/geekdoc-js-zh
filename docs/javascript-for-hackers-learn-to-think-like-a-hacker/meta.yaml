    # Eval and escapes


    Now you know the different escapes that are available you can use them with eval
    or other forms of eval like setTimeout. When using them with these functions you
    have to double escape them or even if they are nested: Because eval works with
    strings it will attempt to decode the input passed to it, when the JavaScript
    actually executed the engine decode the string, this allows us to break some of
    the rules defined earlier. For example, remember that hex can only be used with
    strings? Well, if you use eval the hex will decoded first and then executed which
    means the following is perfectly valid:


    ```

    1 eval(''\x61=123'')// = 123

    ```


    You can do the same with unicode escapes because they are allowed in identifiers
    you can double escape them:


