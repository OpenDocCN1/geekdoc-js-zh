    \ (Potential gadget)\n\n如果你发现了一个可以通过原型污染控制的属性，但你尚未确定它是否触及了汇点，那么你可以将其称为一个潜在的原型污染\
    \ gadget。\n\n### 客户端原型污染\n\n原型污染有两种形式：客户端和服务器端。本节将讨论客户端的形式。利用客户端原型污染的目标通常是 DOM\
