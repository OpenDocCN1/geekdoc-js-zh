    # The six character wall


    After lots of hacking the slackers forum trying to discover what was possible
    with non-alpha code we all came to the conclusion that the minimum limit you could
    have for arbitrary JavaScript execution was six characters. This became known
    the great character wall. The limit is because without ! you cannot create booleans
    without + you can''t convert into integers and concatenate strings without more
    characters. The most likely way of breaking this wall is to use the following
    charset +- and discover a way of generating a boolean. They are important because
    false contains "s" and true contains "r". Without these you cannot construct the
    constructor property and therefore are unable to generate the required string
    to get access to it


    # Infinity and the beyond


    If we are going attempt to break the wall you''d need to generate characters because
    you''d be stuck with "NaN" and "undefined". Well with [] it''s possible to generate
    Infinity! Let''s see how it''s done. First we are going to generate the number
    one before, then you need to generate an undefined string and need the "e" from
    that. After that you simply concatenate one''s onto the end the form "1e1111"
    which produces Infinity.


    ```

    1 [] [![][]{}]+[+]{{}}[][+]{{}[[+]]+[![][]{}]+[+]{{}}[+][+][+}[+]

    2 //function at() { [native code] } as a string

    3 +++[+]{++[+]{{}[+][+][+][+][+][+][+][+][+][+]]//6

    ```


    First generate


    ```

    1 +{+[]}[+]]//1

    ```


    Then generate an undefined string:


    ```

    1 []{+}[+]//undefined string

    ```


    We need to access the "e" from undefined:


    ```

    1 []{+}[+]{{}[+]{{}[+]{{}[[+]{{}[+]{{}[+]{{]{}]]//e

    ```


    Combine them all to form 1e1111:


    ![](img/6bbf3a43d1b15fb8b174471d7af55ddc_65_0.png)'
