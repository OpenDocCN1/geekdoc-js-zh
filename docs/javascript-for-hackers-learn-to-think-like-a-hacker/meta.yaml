    # # Chapter seven - Non-alphanumeric JavaScript


    # ## Writing non-alphanumeric JavaScript


    It all started when the users of the slackers noticed a surprising new post from
    Yosuke Hasegawa, an outstanding Japanese security researcher. In the post he detailed
    how you can execute JavaScript without using alphanumeric characters. This was
    a revelation to all of us and we started to dissect how it works. The basic idea
    was to square brackets and JavaScript expressions to create strings and use numeric
    indexes also based on expressions to concatenate strings to create valid property
    names and eventually writing arbitrary JavaScript all without alphanumeric characters.
    From this also became JSF''ck I obscured the "u" so this book doesn''t display
    swear words. From now I''ll refer to it by its family name "non-alphanumeric"
    JavaScript or non-alpha JS. You just need a way of generating a number and because
    JavaScript is loosely typed you can do using the infix operator "+", this operator
    will attempt to convert the expression that follows into a number or NaN (Not
    a number) if it can''t be converted. The first step is getting a zero:


    ```

    +[]//

    ```


    Great, so we have zero but this will only allow us to get the first character
    of a string:


    ```

    ''abc''[+]//a

    ```


    But how do we get "b" Well, you can combine the square bracket accessor with an
    array and get a reference to it in the array and JavaScript allows you to increment/decrement
    this value just like it was an identifier:


    ```

    1 []//creates an array with 0 in it

    2

    3 [][][+]//gets the first element in the array

    4

    5 ++[][+]//increments the first element in the array to create 1

    6

    7 ''abc''[[+][+]][+]//combines all the above to access b

    ```'
