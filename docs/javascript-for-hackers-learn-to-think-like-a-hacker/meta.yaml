  md: '# # Chapter five - Browser exploits


    # ## Introduction


    We can''t have a book on JavaScript hacking without a chapter on browser exploits
    right? In this chapter I''ll discuss the various browser exploits I''ve found
    over the years. I''ve been hacking browsers (mostly in my spare time) for over
    15 years. In that time I''ve managed to find a SOP (same origin policy) bypass
    or infiltrate in every major browser engine.


    Browser hacking is a very niche area of research but it is super fun and you will
    learn a tremendous amount that you can use in other areas. This section won''t
    be in chronological order when I found the bug instead I''ll start with the simple
    bugs and lead up to the more complicated SOP bypass.


    # ## Firefox incorrect handling of cross origin URLs


    This bug was super simple and I was surprised that Mozilla''s automated tests
    didn''t catch it. I found this one when I was testing cross origin windows. I
    was creating new windows and inspecting cross origin objects by looking at the
    browser console or the Hackvertor inspector. The idea was to get a reference to
    a new window after calling "window.open" and inspecting that object and see if
    any data was leaking that shouldn''t.


    When you call window.open it''s return value is the new window object, this is
    different from the normal window object that you used to. A lot of properties
    are unavailable and throw exceptions you try to read them. The reasons for this
    are clear: if you opened a window to a different origin and the window object
    allowed you to read all the properties you could steal data from any website that
    could result in every account you now compromised.


    The exploit was embarrassingly simple, you opened a new window, waited five seconds
    and attempted to read the location object. Normally an exception would be thrown
    on Firefox they allowed you to read it. When I first found the bug I thought it
    was one of the RegExp methods that the problem but it turned out that you could
    just read the toString() method of the location object:'
