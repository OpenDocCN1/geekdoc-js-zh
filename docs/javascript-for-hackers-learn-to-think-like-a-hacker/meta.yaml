    prototype and value is actually defined in the Object prototype, this means we
    don''t need to use a custom object; can we use an existing object since pretty
    every object has valueOf functionality! Can you see where this is going? The window
    object itself has a valueOf method and we can overwrite:


    ```

    window.valueOf=alert;window//calls alert()

    ```


    This time the alert call is successful and this is because we changed the windows
    valueOf method and when valueOf is called the "this" object will be window and
    the illegal invocation error will'
