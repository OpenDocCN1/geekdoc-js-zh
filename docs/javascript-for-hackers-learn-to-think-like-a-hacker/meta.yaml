  md: '# Chapter four - DOM for hackers


    # Where''s my window?


    In this chapter we are going to hack the DOM in order to understand it and hopefully
    teach you new techniques that you weren''t aware of. First, the goal of this section
    is to get the window object via the DOM. Why do we want a window? The window or
    global object in node are really important for sandbox escape because they allow
    you to reach the globally defined functions such as eval which allows you to execute
    arbitrary JavaScript that can bypass sandboxes. There are many aliases for the
    window object: frames, globalThis, parent, self, top. If your site isn''t framed
    and top will point to the window object, if it is framed then top will point to
    the top window regardless if it''s cross origin or not. "parent" as you expect
    points to the parent of the current framed page. There is also a way to access
    the window object from a DOM node, document.defaultView stores a reference to
    the current window object. Try it in your browser console:


    ```

    document.defaultView.alert(1337)

    ```


    The code above calls the alert function using the defaultView property of the
    document object to get a reference to the window object. The defaultView property
    is only available on the document object however there''s a trick to get the document
    object from a DOM node and then access the defaultView property from the document.
    You can use a property called ownerDocument and as the name you suggests can get
    the document object using the DOM node:


    ```

    let node = document.createElement(''div'');

    ownerDocument.defaultView.alert(1337)

    ```


    Many sandboxes have been broken using this knowledge since access to the "window"
    object is normally blocked; these workarounds allow you to access it again.


    Events are another way of obtaining a window object, when you use an event on
    a DOM node the handler is defined with an event argument, this is to get the fact
    back in the day when Internet Explorer was widely popular using a global called
    "event". Modern browsers define the event as an argument to the handler that way
    when the event is accessed it is a local variable. Interestingly the global event
    exists today but it is deprecated. In Chrome there is a path property on error
    event and this is an array of objects that led to the creation of the event. The
    last element in the array is the window object, you can obtain a window by simply
    reading it. The pop() function comes in handy for this:'
  merge: -1
  pgno: 32
