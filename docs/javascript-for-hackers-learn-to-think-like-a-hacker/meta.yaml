    \ inside the iframe:"
  - '[PAGE 38]


    # Chapter four - DOM for hackers


    ```

    <iframe name=foo srcdoc="<a id=bar href=clobbered:1337></a>"></iframe>

    <script>

    alert(foo)/[object Window]

    alert(foo.bar)/undefined

    </script>

    ```


    The above example shows that "foo" has been clobbered but it''s clobbered by the
    window object of the iframe and it''s the same origin allows us to further clobbering
    using the inside of the iframe. But why "foo.bar" undefined? Because the iframe
    srcdoc takes some time to render and there''s not enough time to render the contents
    of the frame and the property with another element. Fortunately, I discovered
    a workaround, if you introduce a cross-origin style import creates clobbered delay
    for the element to be rendered inside the iframe:


    ```

    <iframe name=foo srcdoc="<a id=bar href=clobbered:1337></a>"></iframe>

    <style>

    @import ''https://garetheyes.co.uk'';

    </style>

    <script>

    alert(foo)//[object Window]

    alert(foo.bar)//clobbered:1337

    </script>

    ```


    Using this technique you can clobber many properties as you like provided there
    is enough time for them to render. A problem though, in order to specify nested
    iframe attributes you have the limitation of using single and double quotes and
    once a specific quote you have used the solution is to use HTML encoding, you
    can then encode the contents of the "srcdoc" as many times as needed. You heard
    it right you can use HTML entities inside the "srcdoc" to render HTML!


    Let''s try clobber five properties. We need an iframe with a name attribute with
    the first property name and a double quoted "srcdoc". Then another iframe for
    the second property "srcdoc" in single quotes to create another nested which creates
    the third property. After that we create "srcdocs" without quotes to create our
    clobbered anchors. Because we are using nested "srcdocs" we have to HTML encode
    the amount of iframes we needed. We use the style block to give the times to render
    and after all that we can clobber a.b.c.d.e.


    ```

    <iframe name=a srcdoc="

    <iframe srcdoc="<iframe srcdoc=a/id=d&amp;amp;#x20;name=e&amp;amp;#href=\\clobbered:1337&amp;amp;&gt;
    &a&amp;#x20;id=d&amp;amp;gt;name=d&gt; name=b"></iframe></iframe>

    >

    <style>@import ''//garetheyes.co.uk'';</style>

    <script>

    alert(a.b.c.d.e)//clobbered:1337

    </script>

    ```'
  - "[PAGE 39]\n\n# Filter exploitation\n\nThere are other ways of exploiting DOM\
    \ clobbering. controlling the value is just one way of exploitation. You can clobber\
    \ the attributes of a DOM node to fool a filter into removing no attributes at\
    \ all. Consider the following example which shows a form element with three attributes,\
    \ the script loops through the attributes to the first and check if it begins\
    \ with \"on\" if it removes the attributes\n\n```\n<form id=x onclick=alert(i)\
    \ onmouseover=alert(2)>\n<input>\n</form>\n<script>\nfor(let i=document.getElementById('x').attributes.length-1;i>=0;i--)\
    \ {\n  let attribute = document.getElementById('x').attributes[i];\n  if(/\\on/i.test(attribute.name))\
    \ {\n    continue;\n  }\n  document.getElementById('x').removeAttribute(attribute.name);\n\
    }\n</script>\n```\n\nThe script removes attributes by looping through all the\
    \ attributes using the attributes property, unfortunately this property can be\
    \ clobbered by providing a child node with a name of \"attributes\". What happens\
    \ when the script uses the clobbered input as the attribute property and the length\
    \ of element is undefined and therefore the loop will not iterate anything. an\
    \ attacker to sneak their malicious events in and break the filtering.\n\nYou\
    \ are not limited to attributes, other DOM properties like tagName|nodeName are\
    \ clobberable, imagine you have a block list that contains tags such as form.\
    \ You can inject a form with an input element that has a name with tagName or\
    \ nodeName. When a filter accesses the tagName or nodeName it will instead access\
    \ the clobbered input and therefore return the wrong value:\n\n```\n<form id=x>\n\
    <input name=nodeName>\n</form>\n<script>\nalert(document.getElementById('x').nodeName)//object\
    \ HTMLInputElement\n</script>\n```\n\nEven properties like parentNode are not\
    \ safe. You can clobber the last it which just like the others will return the\
    \ incorrect parentNode for a form element. If you had a DOM based filter that\
    \ traversed elements using DOM properties such as parentNode, nextSibling, previousSibling\
    \ etc. Your filter would traverse the wrong elements and filter the incorrect\
    \ DOM nodes."
