    ```

    <x id=x style="transition:outline 1s" onontransitionend=alert(1) tabindex=1></x>

    ```


    somepage.html#x


    如果你在植入该事件时遇到困难，始终可以使用 `we` 变体：


    ```

    <x id=x style="transition:outline 1s" onwebkittransitionend=alert(1) tabindex=1>

    x>

    ```


    somepage.html#x


    ## 总结


    我们在这一章涵盖了大量内容。我基本上尝试将我能想到的冷门技巧进行脑脑倾倒，或者回答我在 Twitter 上被问到的问题。首先涵盖了如何在没有结束标签的情况下关闭脚本。然后涵盖了如何滥用脚本内部的
    HTML 内容、包括 SVG 在内的 HTML 实体，以及如何滥用负载和 Cookie。我们学习了如何使用来源向攻击者控制的服务器发送回声（pingback）。之后，我们演示了一个在
    Chrome 中运行的新型 JavaScript 函数 `navigate`。我们涵盖了 JavaScript 中的所有注释以及随后的空白符。稍后，我们展示了如何使用
    data URL 进行动态导入。此后，我们涵盖了如何在 XML 文档中获取 HTML。然后我们展示了如何使用 SVG 对象和 `use` 元素。最后，我们涵盖了
    HTML 实体，并以一些较为人知的 JavaScript 事件结束了全。


    ## 致谢


    虽然我写了这本书，但我并不是独立完成的，感谢那些在网络上分享知识的优秀黑客。书中的许多技术都是黑客们在分享知识和共同学习时发现的。


