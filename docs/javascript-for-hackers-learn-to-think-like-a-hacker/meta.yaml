  md: '# DOM clobbering


    DOM clobbering is a technique that takes advantage of a coding pattern that checks
    for a global variable and allows a different code path if it doesn''t exist. The
    idea is you clobber that global variable doesn''t exist with a DOM element most
    commonly the anchor element. Imagine you have some code like this:


    ```

    let url = window.currentUrl || ''http://example.com'';

    ```


    This code looks innocuous at first glance but actually window.currentUrl is controllable
    not only a global variable but a DOM element too. Back in the days of web design
    it was common for sites to use id attributes of form to refer to the elements
    to a feature in Internet Explorer and Netscape that allowed the id or name attribute
    of the form to become a global variable as a shortcut for developers. This enables
    DOM clobbering. You have probably seen some code that like this:


    ```

    <form id=searchForm>

    </form>

    <script>

    searchForm.submit();

    </script>

    ```


    The browser creates a global called "searchForm" and lets you to refer to the
    form without using the getElementById method. In addition you can use the "name"
    attribute to do the same thing with one important difference, when using the "name"
    attribute you also define a property on the document object:


    ```

    <form id=x></form><form name=y></form>

    <script>

    alert(x)//[object HTMLElement]

    alert(typeof document.x)

    alert(y)//[object HTMLElement]

    alert(document.y)//[object HTMLElement]

    </script>

    ```


    The two forms above create global variables as you can see that the "x" and "y"
    globals have been clobbered with form elements. The second line of the JavaScript
    code checks if there is an "x" property on the document but it is undefined because
    clobbered elements do not add properties to the document. The last line shows
    that document.y has clobbered with the form element. Only certain elements can
    use the name attribute to clobber globals, are: embed, form, iframe, img and object.'
  merge: -1
  pgno: 35
