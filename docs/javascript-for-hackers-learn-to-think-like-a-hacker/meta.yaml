  mdcn: "\n## 第四章 - 黑客的 DOM\n\n```html\n<img src onerror=event.path.pop().alert(1337)>\n\
    ```\n\n在浏览器中，我们使用标准化的 `composedPath()` 方法，它返回一个等同于 Chrome 中 `path` 属性的数组。调用 `composedPath`\
    \ 来获取数组的最后一个元素，在每个浏览器中它都会包含 `window` 对象：\n\n```html\n<img src onerror=composedPath().pop().alert(1337)>\n\
    ```\n\n记得我之前说过每个处理器都处理一个带有事件对象的参数吗？对于 SVG 元素，有一个特殊情况。浏览器添加的不是 \"event\"而是 \"evt\"\
    ，这意味着你可以像使用 `composedPath()` 方法一样，通过这个参数访问 `window` 对象：\n\n```html\n<svg><image\
    \ ref=1 onerror=evt.composedPath().pop().alert(1337)></svg>\n```\n\n为了发现这一点，我没有阅读\
    \ Chrome 的源码，而是查看了事件处理程序的代码及其定义。如果你在 Chrome 中运行这段代码，你可以看到处理函数是如何定义的：\n\n```html\n\
    <svg><image ref=1 onerror=alert(onerror)></svg>\n```\n\n结果产生如下代码：\n\n```javascript\n\
    function error(evt) { // event 被用 evt 引用\n  alert(onerror)\n}\n```\n\n所以 `evt`\
    \ 指向事件。这在 SVG 元素上似乎是如此，但我好奇是否还有其他元素？值得花些时间看看当 JavaScript 沙箱保护你免于访问事件对象时，这些元素是否还有用。\n\
    \n为了完成这部分，我将介绍错误对象（error object）以及如何准备 `prepareStackTrace` 来在 Chrome 中获取 `window`\
    \ 对象。使用 `prepareStackTrace` 回调，你可以自定义堆栈跟踪（stack traces），这对于开发者来说非常方便。其思路是提供一个有两个参数的函数：一个用于错误消息，另一个用于\
    \ `CallSite` 对象数组。`CallSite` 对象由与堆栈跟踪相关的属性和方法组成。例如，你有 `isEqual` 来判断当前 `CallSite`\
    \ 是否在事件函数内部，但你真正感兴趣的是如何获取 `window` 对象。坦率地说，Chrome 在 `CallSite` 对象上为我们提供了一个非常有用的方法\
