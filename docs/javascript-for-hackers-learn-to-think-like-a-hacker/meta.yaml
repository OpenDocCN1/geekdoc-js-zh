    console.log(Object.prototype) \n//{foo: 'bar', constructor: f, __defineGetter__:\
    \ f, __defineSetter__: f, hasOwnProperty\n__defineGetter__: f, __defineSetter__:\
    \ f, hasOwnProperty\n```\n\n不同的库解析查询字符串的方式不同，我遇到过在查询字符串中使用点的网站，测试这种情况只需移除方括号并添加点来访问不同的属性键：\n\
