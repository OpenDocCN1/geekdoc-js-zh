    \ instance this can be polluted."
- md: "## Chapter six - Prototype pollution\n\n### Finding gadgets\n\nSo you've found\
    \ a potential gadget and have prototype pollution, how can you identify actual\
    \ gadgets? First of all you need to execute some JavaScript before the page executes\
    \ theirs. You can do this by using a proxy as Burp and adding a debugger statement\
    \ before anything else executes. The debugger statement is a special JavaScript\
    \ command that will invoke a JavaScript debugger (usually DevTools) when the debugger\
    \ statement is reached the JavaScript execution will be paused at the point where\
    \ the statement is encountered and you are free to enter your own JavaScript using\
    \ the debugger. If you find that prototype is an actual gadget you can use the\
    \ Object.defineProperty() to discover which property is used. You can call this\
    \ method and do a stack trace every time the getter for the property is accessed:\n\
    \n```javascript\nObject.defineProperty(Object.prototype,'potentialGadget', {__proto__:null,\
    \ get(){\n  console.trace();\n  return 'test';\n}}\n```\n\nUsing the stack trace\
    \ you can identify the part of the source code that uses this property and if\
    \ the value ends up in a vulnerable sink. There are tools out that automate this\
    \ process. I've written a tool called DOM Invader that can detect prototype pollution\
    \ sources and gadgets. It's a browser extension as part of the embedded browser\
    \ in Burp Suite.\n\n### Server-side prototype pollution\n\nClient-side prototype\
    \ pollution is quite easy to detect since you have the source code whereas server-side\
    \ is much more difficult because the pollution happens on the server and usually\
    \ you won't have access to the source code. The problem is escalated further when\
    \ it comes to DoS, with client-side you can refresh the browser and things will\
    \ work again whereas if the DoS occurs at the server level, the application can\
    \ be broken and inaccessible to you or other users and then the only solution\
    \ is to restart the node process.\n\nIf you have source code things are even easier.\
    \ The same principles apply to server side prototype pollution, you have a technique,\
    \ source and gadget. You can even apply the same way of detecting prototype pollution\
    \ was successful by using the browser console, provided you have control over\
    \ the node process and are hosting the application yourself. There are two important\
    \ command line flags to node that are super important:\n\n- `--inspect`\n- `--inspect-brk`\n\
    \nThe first option allows you to use devtools to debug the node application, you\
    \ simply add the command line flag when running the application:\n\n```bash\n\
    node --inspect your-app.js\n```\n\nThen you can use Chrome to debug node by visiting:\
    \ chrome://inspect/\n\nIf you've started the process correctly you should see\
    \ a remote target appear. You can then inspect that target and have access to\
    \ the console. As with client-side you can then use the console to inspect the\
    \ Object.prototype. Stack traces work even and you can get the exact line where\
    \ a property is accessed using Object.defineProperty() technique described earlier\
    \ in the chapter.\n\nThere are occasions when you want to debug part of an application\
    \ that has already run and therefore the debugger will have gone past the part\
    \ you want to debug. This is where the second command line flag is useful -- --inspect-brk\
    \ this will instruct the node process to pause before the application is executed\
    \ which is handy when looking for gadgets in node applications. You can then use\
    \ Chrome again at the same URL as mentioned earlier you can use the debugger to\
    \ step or resume execution, even add your own breakpoints.\n\nUsing devtools sitewide\
    \ search is also handy for testing, once you have the remote console open as instructed\
    \ earlier you can perform a search on all the node apps running. Click on the\
    \ three dots at the right hand side of the devtools window and click the search\
    \ option. You can use this to look for potential gadgets. Combine this with the\
    \ defineProperty() technique mentioned earlier should help identify them.\n\n\
    ### Summary\n\nIn this chapter we've introduced prototype pollution, defined what\
    \ a technique, source and gadget is. We've shown you how to find prototype pollution\
    \ and how you can modify native functions using a prototype pollution vulnerability.\
    \ We then talked about how even JavaScript native APIs themselves are vulnerable\
    \ to prototype pollution when using objects in their parameters. We showed how\
    \ you can manually find potential gadgets and then we finished off with server-side\
    \ prototype pollution and how you can debug node applications and the same techniques\
    \ as client-side.\n\n## Chapter seven - Non-alphanumeric JavaScript\n\n### Writing\
    \ non-alphanumeric JavaScript\n\nIt all started when the users of the slackers\
    \ noticed a surprising new post from Yosuke Hasegawa, an outstanding Japanese\
    \ security researcher. In the post he detailed how you can execute JavaScript\
    \ without using alphanumeric characters. This was a revelation to all of us and\
    \ we started to dissect how it works. The basic idea was to use square brackets\
    \ and JavaScript expressions to create strings and use numeric indexes also based\
    \ on expressions to concatenate strings to create valid property names and eventually\
    \ writing arbitrary JavaScript all without alphanumeric characters. From this\
    \ also became JSF'ck I obscured the \"u\" so this book doesn't display swear words.\
    \ From now I'll refer to it by its family name \"non-alphanumeric\" JavaScript\
    \ or non-alpha JS. You just need a way of generating a number and because JavaScript\
    \ is loosely typed you can do it using the infix operator \"+\", this operator\
    \ will attempt to convert the expression that follows into a number or NaN (Not\
    \ a number) if it can't be converted. The first step is getting a zero:\n\n```javascript\n\
    +[]\n```\n\nGreat, so we have zero but this will only allow us to get the first\
    \ character of a string:\n\n```javascript\n'abc'[+] // a\n```\n\nBut how do we\
    \ get \"b\"? Well, you can combine the square bracket accessor with an array and\
    \ get a reference to it in the array and JavaScript allows you to increment/decrement\
    \ this value just like it was an identifier:\n\n```javascript\n[] // creates an\
    \ array with 0 in it\n[]\n[][][+] // gets the first element in the array\n++[][+]\
    \ // increments the first element in the array\n```\n\n### Chapter seven - Non-alphanumeric\
    \ JavaScript\n\nHope you're following along, it might be worth trying each snippet\
    \ to understand what's going on. Once you've grasped this concept you can begin\
    \ generating strings and numbers. You simply need to nest the arrays and keep\
    \ incrementing them. I'll use spaces to help distinguish each. So as you can see\
    \ with the above code, you create an array with [] in which is a zero, then you\
    \ access the first element in the array using [+] and then the increment operator\
    \ to increase the number. \n\nWe can now use \"c\" in our text:\n\n```javascript\n\
    'abc'[[+]]\n```"
  mdcn: "\n## 第六章 - 原型污染\n\n### 寻找 gadget（利用get）\n\n既然你发现了一个潜在的 gadget 并存在原型污染，如何识别真正的\
    \ gadget 呢？首先你需要在页面执行代码之前执行一些 JavaScript。你可以通过使用像 Burp 这样的代理并在任何代码执行之前添加 `debugger`\
    \ 语句来实现。`debugger` 是一个特殊的 JavaScript 命令，它会调用 JavaScript 调试器（通常是 DevTools），当执行到\
    \ `debugger` 语句时，JavaScript 的执行将在遇到语句的地方暂停，你可以自由使用调试器输入你自己的 JavaScript。如果你发现某个原型是一个真正的\
    \ gadget，可以使用 `Object.defineProperty()` 来发现哪个属性被使用了。你可以调用此方法，并在每次访问属性的 getter\
    \ 时都进行一次堆栈跟踪（stack trace）：\n\n```javascript\nObject.defineProperty(Object.prototype,'potentialGadget',\
    \ {__proto__:null, get(){\n  console.trace();\n  return 'test';\n}}\n```\n\n通过堆栈跟踪，你可以识别出源代码中使用该属性的部分，以及该值最终是否进入了漏洞点（sink）。目前有一些工具可以自动化此过程。我写了一个名为\
    \ DOM Invader 的工具，它可以检测原型污染的源和 gadget。它是 Burp Suite 内置浏览器的一个扩展程序。\n\n### 服务端原型污染\n\
    \n客户端原型污染非常容易检测，因为你拥有源代码；而服务端原型污染要困难得多，因为污染发生在服务器上，你通常无法访问源代码。当涉及到 DoS（拒绝服务攻击）时，问题会进一步升级：在客户端，你可以刷新浏览器让一切恢复正常；但如果由于\
    \ DoS 发生在服务器端，应用程序可能会崩溃并导致你或其他用户无法访问，唯一的解决方案是重启 node 进程。\n\n如果你有源代码，情况会更加简单。同样的原理也适用于服务端原型污染：你拥有技术（technique）、源（source）和\
    \ gadget（gadget）。只要你控制 node 进程并自己托管应用程序，你甚至可以像使用浏览器控制台成功检测原型污染那样的方法进行检测。node 有两个至关重要的命令行标记：\n\
    \n- `--inspect`\n- `--inspect-brk`\n\n第一个选项允许你使用 devtools 调试 node 应用程序，你只需在运行程序时添加该命令行标记即可：\n\
    \n```bash\nnode --inspect your-app.js\n```\n\n然后你可以通过访问 `chrome://inspect/` 来使用\
    \ Chrome 调试 node。\n\n如果你正确启动了进程，应该能看到一个远程目标（remote target）。你可以检查该目标并访问控制台。与客户端一样，你可以使用控制台检查\
    \ `Object.prototype`。堆栈跟踪依然有效，你可以使用章节前面提到的 `Object.defineProperty()` 技术获取访问属性的准确行号。\n\
    \n在某些情况下，你想调试已经运行的应用程序的一部分，因此调试器已经跳过了你想调试的部分。这就是第二个命令行标记的用武之地——`--inspect-brk`，它会指示\
    \ node 进程在应用程序执行之前暂停，这在 node 应用程序中寻找 gadget 时非常有用。然后你可以再次使用 Chrome 访问之前提到的 URL，可以使用调试器单步执行或恢复执行，甚至添加你自己的断点。\n\
    \n使用 devtools 的全局搜索（sitewide search）对于测试也非常方便。一旦你按照前面的说明打开了远程控制台，就可以对所有正在运行的 node\
    \ 应用进行搜索。点击 devtools 窗口右侧的三个点并点击 search 选项。可以用它来寻找潜在的 gadget。结合前面提到的 `defineProperty()`\
    \ 技术，应该有助于识别出它们。\n\n### 总结\n\n在本章中，我们介绍了原型污染，定义了什么是技术、源和 gadget。我们向你展示了如何寻找原型污染，以及如何利用原型污染漏洞修改原生函数。我们还讨论了即使是\
    \ JavaScript 原生 API，当在参数中使用对象时也会受到原型污染的影响。我们展示了如何手动寻找潜在的 gadget，并最后介绍了服务端原型污染，以及如何使用与客户端相同的技术调试\
    \ node 应用程序。\n\n## 第七章 - 非字母数字 JavaScript\n\n### 编写非字母数字 JavaScript\n\n这一切始于 \"\
    slackers\" 的用户注意到来自长泽佑介（Yosuke Hasegawa）的一篇令他们惊讶的新帖，他是一位出色的日本安全研究人员。在博文中，他详细介绍了如何在不使用字母数字字符的情况下执行\
    \ JavaScript。这对我们所有人来说都是一次启示，我们开始剖析它的工作原理。基本思想是使用方括号和 JavaScript 表达式来创建字符串，并使用基于表达式的数字索引来拼接字符串，从而创建有效的属性名，最终在不使用任何字母数字字符的情况下编写任意\
    \ JavaScript。这也因此变成了 JSF'ck（我遮盖了 \"u\"，所以这本书不会显示脏话）。从现在起，我将通过它的姓称称其“非字母数字”JavaScript\
    \ 或 non-alpha JS。你只需要一种生成数字的方法，因为 JavaScript 是弱类型语言，你可以使用中缀运算符 `\"+\"` 来实现，该运算符会尝试将后面的表达式转换为数字，如果无法转换，则转换为\
    \ NaN（非数字）。第一步是获取一个零：\n\n```javascript\n+[]\n```\n\n太棒了，我们得到了 0，但这只允许我们获取字符串的第一个字符：\n\
    \n```javascript\n'abc'[+] // a\n```\n\n但我们如何获取 \"b\" 呢？嗯，你可以将方括号访问器与数组结合，并在数组中获取它的引用，JavaScript\
    \ 允许你像处理标识符一样增加/减小这个值：\n\n```javascript\n[] // 创建一个包含 0 的数组\n[]\n[][][+] // 获取数组中的第一个元素\n\
