    \n## 环境\n\n为了遵循这一过程，你需要一个快速的环境来进行测试。这意味着你需要一个可以执行代码并立即获得结果的东西。这可以是很多：浏览器控制台、本地\
    \ Web 服务器或像 JS Fiddle 这样的 Web 应用程序。我个人决定编写自己的名为“Hackvector”的 Web 应用，赋予它评估代码、检查对象、编写\
    \ HTML 的功能，但其他选项也可以。我只是想要更多功能并确保你的输入不会被记录在某处。\n\n## 设定目标\n\n一旦你准备好了环境，下一步是设定目标。如果你没有目标，可能会面对空白页面发呆而毫无进展。\n"
