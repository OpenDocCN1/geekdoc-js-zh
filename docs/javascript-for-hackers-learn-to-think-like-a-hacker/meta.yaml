    again shock horror. Are you sensing a theme here? What happened when IE was leaking
    a origin constructor. What means that the Function constructor was also to be
    called from a different domain.


    A good question to ask here how do you know? It''s very difficult to find for
    sure you''re injecting in a different context because the browser doesn''t provide
    an API for that the best you can do is accessing a property of an object that
    will tell you what is executing from a different domain. One such property is
    document.domain.


