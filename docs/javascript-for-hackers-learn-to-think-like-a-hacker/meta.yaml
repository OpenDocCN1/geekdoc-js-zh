  md: '# Chapter four - DOM for hackers


    Anchor elements make DOM clobbering even more interesting because they allow you
    to use the "href" attribute to change the value of the clobbered object. Normally
    when you use a form element to clobber a variable you will get the toString of
    the element itself e.g. [object HTMLFormElement] but with the anchor the toString
    will be the "href":


    ```

    <a href="clobbered:1337" id=x</a>

    <script>

    alert(x);

    alert(typeof x);.object

    </script>

