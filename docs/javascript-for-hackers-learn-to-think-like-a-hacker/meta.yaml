    \ 不仅可以全局变量，也可以是一个 DOM 元素。在网页设计的早期，网站常用表单的 `id` 属性来引用功能元素，这是 Internet Explorer\
    \ 和 Netscape 的一项特性，允许表单的 `id` 或 `name` 属性成为开发者快捷使用的全局变量。这使得 DOM 覆盖成为可能。你可能见过像这样的代码：\n\
    \n```html\n<form id=\"searchForm\"></form>\n<script>\n  searchForm.submit();\n\
    </script>\n```\n\n浏览器会创建一个名为 \"searchForm\" 的全局变量并允许你在无需使用 `getElementById` 方法的情况下引用该表单。此外，你可以使用\
    \ \"name\" 属性来实现相同的功能，有一个重要的区别是在使用 \"name\" 属性时。\n\n锚点元素让 DOM 覆盖变得更有趣，因为它们允许你使用元素的\
    \ \"href\" 属性。在尝试 DOM 覆盖需要需要的一点是，你只能获取 HTML 属性的值。例如，你不能获取 \"x.notAttribute\"，但\
    \ \"x.title\" 是可以的。\n"
