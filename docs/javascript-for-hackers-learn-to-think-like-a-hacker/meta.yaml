    # Chapter six - Prototype pollution


    # Introduction


    Prototype pollution is a vulnerability that occurs when you do a vulnerable recursive
    merge one or more objects is controllable. When a recursive merge happens the
    code often uses property keys in an unsafe way that can cause unintended property
    assignments. For example JavaScript has a magic property called __proto__ this
    is actually a getter/setter which allows you to obtain and set the object''s prototype.
    If your controllable object can use this recursive merge function will actually
    manipulate the global prototypes most commonly Object.prototype. This then allows
    you to have control over unexpected properties that the developer assumes are
    safe and therefore can lead to DOM XSS in the client or even RCE at the server
    level.


    Normally you can set an ordinary property called __proto__ as mentioned it''s
    really a getter/setter. However, when using JSON.parse a regular property is created
    if you use the __proto__ property this is one of the components that can lead
    to prototype pollution. This be demonstrated with the following code:


    ```

    1 ((__proto__["foo"]).hasOwnProperty(''_proto__''))//false

    2 (JSON.parse(''{"__proto__":"foo"}'')).hasOwnProperty(''_proto_''))/true

    ```


    When a vulnerable merge function the object, because __proto__ is a regular property
    this will allow it to be used but importantly when it is attempted to be assigned
    it becomes a setter again on the target object and this is what causes prototype
    pollution. It''s worth noting that __proto__ isn''t the only attack it''s the
    most common but there is an alternative __proto__ is essentially a shortcut to
    constructor.prototype and if a recursive merge allows you to use a lot of properties
    then you can use the constructor.prototype properties to also cause prototype
    pollution. Now we''ve got the basics of how it occurs out of the way let''s look
    at how you can exploit it.


    # Technique


    The technique refers to the way it polutes the prototype. For example you are
    using __proto__ or constructor.prototype or another technique.


    # Source


    A prototype pollution source is the injection required to cause prototype pollution.
    This is made up of a technique, the property name and the place it comes from
    example JSON, query string or hash.


    __proto__[property]=value'
