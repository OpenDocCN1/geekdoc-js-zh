    \ 回调仅在访问 `Error` 的 `stack` 属性时才会执行。\n\n## HTML 事件的作用域\n\n当 JavaScript 事件在 HTML\
    \ 元素上执行时，浏览器会带有该元素和 `document` 对象执行该函数。这意味着你可以通过指定当前对象或文档的属性来使用快捷方式，而不需要完整的属性路径。实际上，浏览器执行了以下操作：\n\
    \n```javascript\nwith(document) {\n  with(element) {\n    // 执行的事件\n  }\n}\n```\n\
    \n记得 `document` 属性 `defaultValue` 吗，我们实际上可以在我们的元素事件中使用它。所以你只需要使用该属性就可以访问 `window`\
    \ 对象：\n\n```html\n<img src onerror=default.alert(1337)>\n```\n\n这之所以有效是因为上述的 `with`\
    \ 语句。浏览器执行事件并在图像上查找 `defaultValue` 属性，没找到，于是它会检查 `document` 对象，如果存在，则会访问并返回 `document.defaultValue`\
    \ 属性。如果你枚举 `document` 对象，就可以看到哪些属性是可选。你可以使用自定义枚举器，或者简单地在浏览器控制中使用 `console.dir(document)`。\n\
    \n由于事件的作用域，你也可以使用其他 DOM 函数，在这里我们可以创建一个脚本，并使用完整路径将其添加到文档中：\n\n```html\n<img src\
