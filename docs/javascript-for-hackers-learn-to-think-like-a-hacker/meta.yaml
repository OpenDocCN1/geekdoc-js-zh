    console.log(Object.prototype) __defineGetter__: f, __defineSetter__: f, hasOwnProperty

    //{foo: ''bar'', constructor: f, __defineGetter__: f, __defineSetter__: f,

    ```


    Different libraries parse the query string in different ways, I have encountered
    sites that use dots in the query string, test for that simply remove the square
    brackets and add to access different property keys:


    ```

    ?__proto__.foo=bar

    ```


    It''s worth checking the hash, I''ve seen sites parsing the hash as query parameters.
    If you try any combination with both query string and hash then that should get
    99% of client-side prototype vulnerabilities.


    # Modification of native methods


    When a site is vulnerable to prototype pollution you are not limited to just manipulating
    the Object prototype, you can change one of the built native methods of the global
    Object or others. For example, imagine a site uses the Object.keys method, it''s
    possible to overwrite this method using a prototype pollution source. An attack
    might look like this:


    ```

    __proto__[keys]=//Object.keys === ""

    ```


    This removes the functionality of the method by assigning it to a string. In practice
    this sort of attack is difficult to exploit since you can''t provide your function
    as is limited to strings or JSON supported types. However, you can use this technique
    as part of a bug chain that can take you down a different code path.


    # Native browser APIs


    Quite surprisingly browser APIs themselves are vulnerable to prototype pollution
    wherever the API allows you to use an object literal passed as an argument (common
    with configuration) you can use prototype pollution to influence values. One example
    is the fetch() function, where the first parameter accepts a string or request
    object and the second parameter accepts an object. If a site doesn''t include
    one of the properties on the request object or object then you can use prototype
    pollution to influence them. As it''s best illustrated with example:


    ```

    Object.prototype.body=''foo=bar''

    const request = new Request(''/myEndpoint'',

    method: ''POST'',

    });

    fetch(request);

    ```'
  - "[PAGE 51]\n\nThe code above uses the Request object to build a request to send\
    \ to the fetch() function because the Request object does not define a body property;\
    \ it's possible to control the property using an inherited property via prototype\
    \ pollution. When the POST request is sent it will have a POST body with foo=bar.\
    \ Exactly the same technique can be used with the second parameter of the fetch\
    \ function:\n\n```\nObject.prototype.body='bar';nconst init = {\n  method: 'POST'\n\
    };\nfetch('/end-point', init);\n```\n\nAny API that uses custom objects is vulnerable\
    \ to this provided it inherits the properties. You can even custom headers:\n\n\
    ```\nObject.prototype.headers={foo:'bar'};nconst init = {\n  method: 'POST'\n\
    };\nfetch('/end-point', init);\n```\n\nThe example above sends a header \"foo\"\
    \ with the value \"bar\". These techniques are useful in build chains where prototype\
    \ pollution does not have DOM XSS, you could use this technique to chain the prototype\
    \ pollution with CSRF via fetch() or other vulnerabilities.\n\nOther places vulnerable\
    \ to prototype pollution are ES5 methods like defineProperty(). When calling this\
    \ function you specify the target object in the first parameter, the second parameter\
    \ accepts a property name and the third allows you to use a descriptor (which\
    \ is just an object literal). Object literal can be polluted and some properties\
    \ are optional and default to false if not defined, it's the perfect storm for\
    \ prototype pollution.\n\nLet's look at some example here's how to use the function:\n\
    \n```\nlet obj = {};\nObject.defineProperty(obj, 'foo', {configurable:false, writable:\
    \ false, value:123});\n```\n\nIn the example we define a property \"foo\" and\
    \ make it unconfigurable you can't redefine the property using defineProperty().\
    \ Writable indicates its value can be overwritten. As mentioned though these properties\
    \ are optional, which means they default to false. Let's look at the code example\
    \ again with omitted properties on the descriptor:"
  - "[PAGE 52]\n\n# Chapter six - Prototype pollution\n\n```\nlet obj = {};\nObject.defineProperty(obj,\
    \ 'foo', {value:123});\nobj.foo//123\nobj.foo=;\nobj.foo//123\n```\n\nBecause\
    \ we have omitted the configurable and writable property above the JavaScript\
    \ engine assumes they are intended to be false as we have seen with fetch() these\
    \ properties can be inherited. We can actually change the behaviour of the defineProperty()\
    \ through prototype pollution:\n\n```\nObject.prototype.configurable=true;\nObject.prototype.writable=true;\n\
    let obj = {};\nObject.defineProperty(obj, 'foo', {value:123});\nobj.foo//123\n\
    obj.foo='overwritten'\nobj.foo//overwritten\n```\n\nAs we can see above the behaviour\
    \ of the defined property has changed, it's now possible to overwrite the value\
    \ despite the omitted properties on the descriptor. This really seems like a problem\
    \ with the specification as inherited properties should not be used when using\
    \ native APIs as it can lead to prototype pollution. I doubt this will be fixed\
    \ though since inheritance is at the core of JavaScript.\n\nThere are other places\
