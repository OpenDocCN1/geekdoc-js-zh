    \ the third anchor is indexed using 2 because remember collections are indexed\
    \ from zero. If I changed the third anchor to have a name of \"z\" this would\
    \ not work because the name attribute doesn't create a collection. If you need\
    \ to clobber three levels deep you have to use a different element such as form.\n\
    \n```html\n1 <form id=x name=y><input id=z></form>\n2 <form id=x></form>\n3 <script>\n\
