  md: '# Chapter four - DOM for hackers


    ```

    <img src onerror=event.path.pop().alert(1337)>

    ```


    In browsers we use the standardised composedPath() method which returns an array
    equivalent to the path property in Chrome. That you can call the composedPath
    get the last element of the array and it will contain the window object in every
    browser:


    ```

    <img src onerror=composedPath().pop().alert(1337)>

    ```


    Remember when I said each handler handles an argument with the event object? There
    is a special case for SVG elements. The browser doesn''t add "event" but rather
    "evt" which means you can access the window object using this argument just like
    the composedPath() method:


    ```

    <svg><image ref=1 onerror=evt.composedPath().pop().alert(1337)></svg>

    ```


    To find this I didn''t read the Chrome source, instead I looked at the event handler''s
    code and the definition in there. If you run this in Chrome you can see how the
    handler function is defined:


    ```

    <svg><image ref=1 onerror=alert(onerror)</svg>

    ```


    Which results in the following code:


    ```

    function error(evt) (//event is referenced with evt

    alert(onerror)

    }

    ```


    So evt points to the event. This seems to be the case for SVG elements but I wonder
    if there are any others? It''s worth spending some time to see if they are useful
    when a JavaScript sandbox protects you from accessing the event object.


    To finish off this I''m going to cover the error object and how you can prepareStackTrace
    to get access to the window object in Chrome. Using the prepareStackTrace callback
    you can customise stack traces which is handy for developers. The idea is to provide
    a function that has two arguments one for the error message and the other for
    an array of CallSite objects. A CallSite object consists of properties and methods
    related to the stack trace. For example you''ve got isEqual to determine if the
    current CallSite is within an event function but what you''re really interested
    in is how to get a window object. Frankly Chrome provides us with a useful method
    getThis() on a CallSite object and this will return a window object if there''s
    no "this" defined by the executing code. Let''s see it in action:'
