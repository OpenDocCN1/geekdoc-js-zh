    ## 基于导航的事件


    有几个事件需要某种形式的导航才能触发。其中一个事件是 `onpoststate`，它在历史记录发生变化时触发。为了触发此事件，你必须以某种方式更改目标的 URL。这最可能涉及
    `iframe`；值得注意的是，当使用跨源 `iframe` 时 `alert(1)` 是不起作用的，你必须使用 `print()` 函数。以下是一些示例：


    ```

    <body>onpoststate=alert(1)<script>location.hash=1</script>

    ```


    ```

    <iframe src="//target?x=<body>/onpoststate=print()" onload=this.src%2b=''%23''>

    ```


    你可以使用 `iframe` 来对 URL 的 hash 部分进行修改，从而触发 `hashchange` 事件：


    ```

    <iframe src="//target?x=<body/onhashchange=print()" onload=this.src%2b=''%23''>

    ```


    ## onmessage


    再次使用 `iframe`，你可以加载一个外部 URL 并在其中注入你的 `onmessage` 处理器，然后使用 `postMessage` 触发该事件：


    ```

    <iframe src="//target?x=<body/onmessage=print()" onload=this.contentWindow.postMessage(age('''',
    ''*'')''>

    ```


    ## onfocus


    通常，此事件可以通过 `textarea` 或 `input` 的 `autofocus` 属性触发。通过 `tabindex` 和 `id` 属性，可以让该事件在其他元素上生效。`tabindex`
    是一个无辅助属性，允许你选择按下 tab 键时页面上哪些元素被选中。通过将其与 `id` 属性结合并 URL 中的 hash，它会自动聚焦该元素：


    ```

    <x focus=alert(1) id=x tabindex=1>

    ```


    homepage.html 还有一个技巧，你实际上可以在任何元素上（至少在 Chrome 中）使用 `autofocus` 属性，只要你配合它使用 `tabindex`。这意味着你不需要
    `id` 属性或 hash：


    ```

    <x autofocus=alert(1) autofocus tabindex=1>

    ```


    同样，还有一个名为 `autofocus` 的相关事件，你可以用它绕过 WAF 并实现上述行为。


    ## 基于动画的事件


    众所周知，你可以使用 CSS 过渡/动画在任何标签上触发事件。如果你不知道如何操作，请看这里：


    ```

    <style>:target{color: red;}</style>

    ```


    ```

    <x id=x style="transition:color 10s" onontransitioncancel=print()></x>

    ```


    somepage.html#x


    这种方法的原理是使用 `:target` 选择器，当发现 URL hash 部分指定的 id 时更改样式。随后，这会触发事件。这种特定方法的缺点是它会创建一个样式块，这可能会被
    WAF 或过滤器拦截。还有另一种方法，你可以使用之前描述的技巧来聚焦元素，因为 Chrome 会为聚焦的元素添加 CSS outline（轮廓），你可以使用过渡效果，因为
