    href=''1'' onerror=''alert(1)''&lt;/svg&gt;*x'' />

    ```


    Notice because the data URL is using a valid SVG mime type the stricter rules
    apply. It''s also worth noting that even through this data URL it won''t be executed
    from a null origin, it will inherit the origin from the page.


    # HTML entities


    HTML has a wide range of encoding options. In this section I''m going to go through
    the various ways you can encode characters with entities and finish off each section
    with a few examples.


    # Decimal entities


    You can use character codes to represent different characters, they are prefixed
    with &# and ends with an optional semicolon. For the character "j" is represented
    as the character 106. To produce this character we simply have to combine the
    prefix with the code, followed by an optional semicolon. You can also use many
    zeros as you like before the character code:


    ```

    1 <a href="&#106;javascript:alert(1337)">test1</a>

    2 <a href="&#106;javascript:alert(1337)">test2</a>

    3 <a href="&#x00000106;javascript:alert(1337)">test3</a>

    ```


    Converting to this format is easy just you need to loop through the characters
    and convert the character to a character code using codePointAt():


    ```

    ''j''.codePointAt(0)

    ```


    # Hex entities


    There are a lot of similarities with hex entities as decimal but there''s a slightly
    different prefix. Use &#x as the prefix and convert the character code to hex.
    The semicolon is optional again however there is an existing character that validates
    hex it is going to produce a different character so you need to ensure the character
    is not valid


    ```

    1 <a href="&#x6a;javascript:alert(1337)">test1</a>

    2 <a href="&#x6aa;javascript:alert(1337)">test2</a>

    3 <a href="&#x00000106;javascript:alert(1337)">test3</a>

    4 <a href="&#x6a*javascript:alert(1337)">test4</a>

    ```


    In the preceding code the second example will fail because "a" is valid hex and
    therefore produces a different character than the required "j". The last example
    works because "s" is not valid hex so produces the entity produces the correct
    character. To produce this encoding you just need to get the code point again
    but convert it like this:'
