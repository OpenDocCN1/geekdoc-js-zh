  md: "# Chapter three - Fuzzing\n\norder find client-side redirects that can be useful\
    \ in bug chains, you might want to fuzz protocol relative URLs. In case you know\
    \ no protocol relative URLs allow you to reference an external URL by using a\
    \ double forward slash. They inherit the protocol of the page for example if it\
    \ is using HTTPS:// the protocol relative URL will use that protocol. Let's fuzz\
    \ the inside of the forward slashes to see what characters are supported:\n\n\
    ```\na=Document.createElement('a');\nlog([]);\nfor(let i=0;i<=0xffffffff;i++)\
    \ {\n  a.href = `${String.fromCodePoint(i)}garethheyes.co.uk`;\n  if(a.hostname\
    \ === 'garethheyes.co.uk') {\n    log.push(i);\n  }\n}\ninput.value=log//9,10,13,47,92\n\
    ```\n\nAs you can see you can place whitespace characters between the slashes\
    \ and in addition the backslash character can be used just like a forward slash.\n\
    \n# # Fuzzing HTML\n\nWe've seen how to fuzz JavaScript URLs we can also take\
    \ the same approach when fuzzing HTML. By using the innerHTML API we can discover\
    \ quirks extremely fast just like we did with the DOM properties. Before you start\
    \ it's a good idea to ask yourself a question in your head as a target for fuzzing.\
    \ For example I asked myself \"What characters are allowed in closing HTML comments?”.\
    \ To answer this question let's think how to achieve it, if an HTML comment is\
    \ closed the following tag after the comment we can simply check if that HTML\
    \ element is rendered using the querySelector API. Here's how it's done:\n\n```\n\
    let log=[];\ndet div = document.createElement('div');\nfor(let i=0;i<=0xffffffff;i++)\
    \ {\ndiv.innerHTML=`<!--${String.fromCodePoint(i)}<span></span>-->`;\nif(div.querySelector('span'))\
    \ {\n  log.push(i);\n}\n}\nconsole.log(log)//33,45,62\n```\n\nIt's very similar\
    \ to the DOM properties fuzzing and you might notice it takes a little longer\
    \ because the browser has to do more work. We create a div element, loop through\
    \ all the unicode codepoints"
