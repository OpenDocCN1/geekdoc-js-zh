  md: "Chapter six - Prototype pollution\n\n# Finding gadgets\n\nSo you've found a\
    \ potential gadget and have prototype pollution, how can you identify actual gadgets?\
    \ First of all you need to execute some JavaScript before the page executes theirs.\
    \ You can do this by using a proxy as Bur and adding a debugger statement before\
    \ anything else executes. The debugger statement is a special JavaScript command\
    \ that will invoke a JavaScript debugger (usually DevTools) when the debugger\
    \ statement is reached the JavaScript execution will be paused at the point where\
    \ the statement is encountered and you are free to enter your own JavaScript using\
    \ the debugger. If you find that prototype is an actual gadget you can use the\
    \ Object.defineProperty() to discover which the property is used. You can call\
    \ this method and do a stack trace every time the getter for the property is accessed:\n\
    \n```\nObject.defineProperty(Object.prototype,'potentialGadget', {__proto__:null,\
    \ get(){\n  console.trace();\n  return 'test';\n}}\n```\n\nUsing the stack trace\
    \ you can identify the part of the source code that uses this property and if\
    \ the value ends up in a vulnerable sink. There are tools out that automate this\
    \ process. I've written a tool called DOM Invader that can detect prototype pollution\
    \ sources and gadgets. It's a browser extension as part of the embedded browser\
    \ in Burp Suite.\n\n# Server-side prototype pollution\n\nClient-side prototype\
    \ pollution is quite easy to detect since you have the source code whereas服务端\
    \ is much more difficult because the pollution happens on the server and usually\
    \ you won't have access to the source code. The problem is escalated further when\
    \ it comes to DoS, with client-side Do you can refresh the browser and things\
    \ will work again whereas if the DoS occurs at the server level, the application\
    \ can be broken and inaccessible to you or other users and then the only solution\
    \ is to restart the node process.\n\nIf you have source code things are even easier.\
    \ The same principles apply to server side prototype pollution, you have a technique,\
    \ source and gadget. You can even apply the same way of detecting prototype pollution\
    \ was successful by using the browser console, provided you have control over\
    \ the node process and are hosting the application yourself. There are two important\
    \ command line flags to node that are super important:\n\n+   - --inspect\n- --inspect-br\n\
    \nThe first option allows you to use devtools to debug the node application, you\
    \ simply add the command line flag when running the application:"
