    This is where the second command line flag is useful --inspect-brk this will instruct
    the node process to pause before the application is executed which is handy when
    looking for gadgets in node applications. You can then use Chrome again at the
    same URL as mentioned earlier you can use the debugger to step or resume execution,
    even add your own breakpoints.


    Using devtools sitewide search is also handy for testing, once you have the remote
    console open as instructed earlier you can perform a search on all the node apps
    running. Click on the three dots at the right hand side of the devtools window
    and click the search option. You can use this to look for potential gadgets. Combine
    this with the defineProperty() technique mentioned earlier should help identify
    them.


    # Summary


    In this chapter we''ve introduced prototype pollution, defined what a technique,
    source and gadget is. We''ve shown you how to find prototype pollution and how
    you you can modify native functions using a prototype pollution vulnerability.
    We then talked about how even JavaScript native APIs themselves are vulnerable
    to prototype pollution when using objects in their parameters. We showed how you
    can manually find potential gadgets and then we finished off with server-side
    prototype pollution and how you can debug node applications and the same techniques
    as client-side.'
