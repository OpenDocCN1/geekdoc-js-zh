    # # Chapter one - Introduction


    JavaScript has been my passion, I''m fascinated by ways to help me understand
    JS further. You can often see me tweeting about ways to call functions without
    parentheses, insane XSS vectors and general ways to find deeper ways of understanding
    a particular feature. I''m often asked how a tweet can be used to apply to a WAF
    bypass or browser exploit. For this isn''t important, sure you use ways to call
    JavaScript functions without parentheses to bypass WAFs at the point of my tweets
    is posted to rapidly gain knowledge that could be applied.


    One such example is [] .sort, accepts a function and I found that you could abuse
    to call the goal of what I will talk about. What I''m trying to hack my brain
    to make these vectors important for me to remember, you''ll see me posting variants
    of a particular technique and it certainly helps that I find enjoy out of these
    techniques. How often have you found yourself reading a book or particular article
    it not to sink in? By looking for ways to hack JavaScript you are learning about
    a feature and then applying that knowledge to achieve a goal, it doesn''t matter
    what that goal is as long as you''ve got a target it will help you remember.


    These sort of techniques can apply to anything really and it''s pretty much common
    sense, if you look at sport as an example you''ll get better at just reading about
    it, you have apply knowledge and practice and train by actually doing the sport.
    JS hacking is a lot like this, there is no way in your day to do job you''ll use
    every feature JS has if you try and hack it you can choose the feature to learn
    about. This is really my philosophy and is exactly what this book is about. I''m
    going to try and teach you how to follow it and learn at a rapid pace but enjoy
    what you are doing.


    # ## Environment


    In order to follow this process you need a rapid environment to conduct your tests.
    What it means is you need something that you can execute your code and instantly
    get the results. This can be a multitude of things, a browser console, local web
    server or a web app as JS Fiddle. Personally I decided to write my own web app
    called "Hackvector", giving it the ability to evaluate code, inspect objects,
    write HTML but other options are fine too. I just wanted more power and make sure
    that your input isn''t being logged somewhere. Your environment needs to be able
    to evaluate JavaScript and return the results at the bare minimum.


    # ## Set a goal


    Once you''ve got your chosen environment set the next step is to set a goal. If
    you have no goal can be staring at a blank page not getting anywhere. A goal enables
    to make sure you''re always'
- md: '# Chapter one - Introduction


    trying something and it can be flexible too. For instance of my goals was "execute
    JavaScript without parentheses". If you set a good goal it will almost never end
    and good ones also mutate into another goal for the goal I mentioned earlier mutated
    into "execute JavaScript functions without parentheses and pass arguments". Now
    you can see how these two goals are useful because you now have a clear idea what
    to do and you use JavaScript features to achieve that goal. In the above second
    goal is more challenging than the first but the second goal enables you to gain
    knowledge to achieve the more difficult goal.


    # Fuzzing


    Fuzzing is one of the most important tools in a JavaScript hackers toolbox, it
    enables you to answer questions really fast and discover new things by getting
    the computer to report the results. Fuzzing is simply writing code that enumerates
    characters, code or data in order to finding behaviour. In binary exploitation
    you''ll use a fuzzer to find DoS or an exploitable crash when hacking is to achieve
    your goal by answering questions. For example I myself set a goal to understand
    what characters are allowed as whitespace, you might be wondering why simply not
    look at the specification? You should not use the specification as your only source
    of information when trying to discover browser behaviour because browsers sometimes
    do not follow the specification, they can be because they make a mistake or simply
    choose not to various reasons like backward compatibility.


    Using fuzzing is an important tool to find these interesting edge cases. You might
    wonder why these edge cases are important, in the whitespaces I gave I was writing
    a JavaScript parser and sandbox turns out to be pretty significant when trying
    to parse JavaScript and could lead to a sandbox bypass. By ensuring I handled
    whitespace correctly according to what the browser does could ensure my sandbox
    was secure. Later in the book I''ll show you how to use fuzzing to answer questions
    and discover interesting behaviour.


    # Persistence and luck


    JavaScript hacking is very much like security research in the fact that it takes
    a lot of persistence and lots of luck to find interesting behaviour. Sure knowledge
    is important but persistence enables you to expand your knowledge and get luck.
    If you are just starting JavaScript and don''t have much knowledge, following
    the principles of this book can help you gain knowledge rapidly if you have a
    lot of persistence. If you find yourself starting at a blank screen with any ideas
    what to do, try a new goal or simplify your goal so you can keep moving. Don''t
    be afraid to try things that you think might not work and if you''re persistent
    your time won''t be wasted because you learn little things on the way to finding
