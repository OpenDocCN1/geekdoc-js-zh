  md: '# Has instance symbol


    The last method I want to discuss is using the has instance symbol. Symbols allow
    you to define a unique token in property keys. There are built in symbols that
    you can use for various operations. JavaScript uses symbols in this way to avoid
    using special properties that clash with existing code on the web. The "has instance"
    symbol allows you to customise the behaviour of the instanceof operator, if you
    set this symbol it will pass the left operand to the function defined by the symbol.
    This offers a neat way of executing JavaScript without parentheses:


    ```

    ''alert\x28137\x29''instanceof([Symbol[''hasInstance'']])://calls alert(1337)

    ```


    In the example below we define our payload in the string before the instanceof
    operator and we use a new object literal with the "hasInstance" symbol and assign
    the value, then when the instanceof operator runs with the string and object,
    the string gets passed to eval and the alert function will be called. You can
    use the symbol in this way without the square brackets:


    ```

    ''alert\x28137\x29''instanceof([Symbol.hasInstance]:eval)//calls alert(1337)

    ```


