    \ that the following span wasn't rendered. I used this verify technique to find\
    \ another flaw in Firefox that allowed to create NULLs the hyphens of an opening\
    \ comment tag\n\n```\nlet log=[];\nlet div = document.createElement('div');\n\
    for(let i=0;i<=0xffff;i++){\n  div.innerHTML=`!-${String.fromCodePoint(i)}-<span></span>--\\\
    `;\n  if(div.querySelector('span')){\n    log.push(div);\n  }\n}\nconsole.log(log)//45\n\
    ```\n\nIt's the same as code before the placeholder is inside the starting comment\
    \ tag and the querySelector checks if the span doesn't exist. You should get one\
