  md: '# # Chapter three - Fuzzing


    # ## The truth


    When it comes to fuzzing it''s often thought that you use it to discover exploitable
    vulnerabilities or crashes. Certainly you can use fuzzing for that and I have
    found vulnerabilities in the past but you can also use fuzzing to find browser
    behaviour and this is what this chapter is about. Fuzzing will save you a lot
    of time and help you build your JavaScript knowledge quickly. It''s often tempting
    to look at a specification for your source of truth on a particular JavaScript
    behaviour, this is an incorrect mindset because different browsers might have
    their quirks that didn''t follow the specification or they could be implemented
    incorrectly. I''m not saying don''t use the specification, I''m just saying don''t
    believe it and use fuzzing to discover the truth.


    My first foray into behavioral fuzzing was to find characters that were allowed
    in a JavaScript protocol. I started creating a JavaScript URL inside an anchor
    href attribute and manually injecting HTML entities and hovering over the link
    to see if it was still the JavaScript protocol. I thought to myself there has
    to be a better way. At the time the best way to do this would be in a side programming
    language like PHP. So I constructed a fuzzing tool that looped through characters
    in chunks and returned the results. This was back in 2008 and it found loads of
    interesting results:


    +   - jav&#56325script.al&#56325ert(1)// used to work in Firefox!


    This is a great example of why you need fuzzing, you would have to manually edit
    over 56,000 entities to find this bug. That''s also pressing you to test entities
    and not the raw characters! You need fuzzing in your life to make things much
    easier. Back in 2008 computers were much slower than they are now and I had a
    crappy slow laptop too so I had to do it in chunks, nowadays computers and browsers
    are much faster, you can literally fuzz millions of characters in a few seconds.


    # ## Fuzz JavaScript URLs


    My approach to fuzzing has changed with a modern browser, I use innerHTML and
    DOM properties now. You have to use both because there are different results as
    they follow different code paths. Let''s say we want to fuzz JavaScript URLs in
    a modern browser, the first way is to use the DOM:'
