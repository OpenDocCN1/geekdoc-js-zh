  md: "# Chapter four - DOM for hackers\n\n```\nError.prepareStackTrace=function(error,\
    \ callSites)\ncallSites.shift().getThis().alert(1337);\n};\nError().stack\n```\n\
    \nWe define our callback method, the function simply gets the first CallSite object\
    \ from the array of CallSites, calls the getThis() function which returns the\
    \ window object that we then use to access and call the alert() function. The\
    \ prepareStackTrace callback is only executed when the stack property of Error\
    \ is accessed.\n\n# Scope of an HTML event\n\nWhen a JavaScript event is executed\
    \ on an HTML element the browser executes the executed function with the element\
    \ and the document object. This means you can use shortcuts by just specifying\
    \ properties of the current object or document without the whole path to the property.\
    \ In effect the browser does the following:\n\n```\nwith(document) {\n  with(element)\
    \ {\n    //executed event\n  }\n}\n```\n\nRemember that document property defaultValue\
    \ we can actually use that within an event on ours. So you can access the window\
    \ object just using just that property:\n\n```\n<img/src/onerror=default.alert(1337)>\n\
    ```\n\nThis works because the \"with\" statement above. The browser executes the\
    \ event and looks for the defaultValue property on the image, it can't find it\
    \ so now it checks the document object and if it does exist so the document.defaultValue\
    \ property is accessed and returned. If you enumerate the document object you\
    \ can see which properties are available. You can do this using a custom enumerator\
    \ or simply use console.dir(document) in the browser console.\n\nBecause the scoping\
    \ of the event you can use other DOM functions too, here we can create a script,\
    \ append add it to the document using the full path:\n\n```\n<img/src/onerror=s=createElement('script');s.append('alert(1337)');appendappendChild(s)>\n\
    ```\n\nNotice that appendChild() is used in this instance append will throw an\
    \ exception if you don't specify the full path at least on Chrome. The append()\
    \ function accepts a string or node. The append() function will actually be executed\
    \ on the image object, document has a precedence so the script will be appended\
    \ to the image not the document."
