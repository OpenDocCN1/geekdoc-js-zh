    \n## DOM 覆盖 (DOM clobbering)\n\nDOM 覆盖是一种利用编码模式的技巧，该模式会检查全局变量，如果不存在则允许不同的代码路径。其思路是你用一个\
    \ DOM 元素（最常见的是锚点元素 `<a>`）覆盖掉那个不存在的全局变量。假设你有像这样的代码：\n\n```javascript\nlet url =\
