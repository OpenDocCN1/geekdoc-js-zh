  md: "# Chapter three - Fuzzing\n\nagain but this time use innerHTML to create an\
    \ HTML comment, just before the closing greater than we inject our unicode character,\
    \ if the comment is closed the following span won't be rendered and therefore\
    \ the querySelector for the span will be null. We want to know if the comment\
