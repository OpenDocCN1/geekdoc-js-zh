    \ following characters close a comment after a double hyphen: !->\n\nYou can try\
    \ this on other browsers and experiment by moving the placeholder to different\
    \ parts of the closing comment tag. I ran very similar to moving it on Firefox\
    \ a few years ago and you can use new lines beyond the greater! I tried to use\
    \ the querySelector the other way too, you can check if a starting comment actually\
    \ worked by checking that the following span wasn't rendered. I used this verify\
    \ technique to find another flaw in Firefox that allowed to create NULLs the hyphens\
    \ of an opening comment tag\n\n```\nlet log=[];\nlet div = document.createElement('div');\n\
    for(let i=0;i<=0xffff;i++){\n  div.innerHTML=`!-${String.fromCodePoint(i)}-<span></span>--\\\
    `;\n  if(div.querySelector('span')){\n    log.push(div);\n  }\n}\nconsole.log(log)//45\n\
    ```\n\nIt's the same as code before the placeholder is inside the starting comment\
    \ tag and the querySelector checks if the span doesn't exist. You should get one\
    \ 45 for the hyphen character, if you see more than that then you have a browser\
    \ bug. One thing to remember when fuzzing this is to ensure your generated markup\
    \ doesn't create false positives, for instance you can see there's a very deliberate\
    \ greater than the space and hyphen. This is to prevent the span being consumed\
    \ as a different tag by the various fuzzing characters. It's good to defensively\
    \ code like this as it will save you time.\n\n# Fuzzing known behaviours\n\nIf\
    \ you don't know where to start when fuzzing for new browser behaviour, you can\
    \ always fuzz existing behaviour and see if there are any deviations. One good\
    \ place to start is whitespace, you just need to construct a fuzz string which\
    \ will only occur if the character is whitespace. The best way I found for this\
    \ is to use a function call. You can have whitespace between the function identifier\
    \ and the parentheses, you can define a function within a try block and attempt\
    \ to call it with the identifier and the added character with eval."
  - "[PAGE 27]\n\n# Chapter three - Fuzzing\n\n```\nfunction x(){\n  log=[];\n  for(let\
    \ i=0;i<=0x1ffff;i++){\n    try {\n      eval(`\\${String.CodePoint(i)}\\`)\n\
    \      log.push(i)\n    } catch(e) {\n  }}\n  console.log(log)\n}\n```\n\n```\n\
    //9,10,11,12,13,32,160,5760,8192,8193,8194,8195,8196,8197,8198,8199,8200,8201,8202,8\\\
    n232,8233,8239,8287,12288\n```\n\nThat's a surprising amount of characters although\
    \ this only proves whitespace can be used between identifier and parentheses to\
    \ some comprehensive fuzzing you'd have to various positions for the character\
    \ and more contexts. I'll leave to do that and test various browsers. If you find\
    \ an unexpected behaviour you would report it. Could you use these deviations\
    \ for tests? Well, in the past I used them for JavaScript sandbox escapes since\
    \ if you can fool into incorrectly lexing a character as whitespace when it is\
    \ in fact you can cause your JavaScript to be parsed one way by the sandbox and\
    \ other by the browser or NodeJS.\n\nYou can also use pairs of characters to fuzz\
    \ things like, it will usually be the same speed to fuzz duplicate characters,\
    \ things get slow when you nested fuzzing. Maybe we have to wait a few years before\
    \ that is practical. Fuzzing for strings is tricky; you just need to use a pair\
    \ of characters and verify that string-like behaviour has happened. One way to\
    \ do that is to use a try block and even see if a bunch of random characters don't\
    \ cause an exception when using the pair of characters. This would indicate that\
    \ is string-like behaviour.\n\n```\nlog=[];\nfor(let i=0;i<=0x1ffff;i++){\n  try\
