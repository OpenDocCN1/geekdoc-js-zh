    \n# # Chapter one - Introduction\n\nJavaScript has been my passion, I'm fascinated\
    \ by ways to help me understand further. You can often see me tweeting about ways\
    \ to call functions without parentheses, insane ways to apply. What I'm trying\
    \ to hack my brain to make these vectors important, how often have you found yourself\
    \ reading a book or particular article not to sink in? By looking for ways to\
    \ hack you are learning about a feature and then applying that knowledge to achieve\
    \ a goal, it doesn't matter what that goal is as long as you've got a target it\
    \ will help you remember.\n\nThese sort of techniques can apply to anything really\
    \ and it's pretty much common sense, if you look at sport as an example you'll\
    \ get better at just reading about it, you have apply knowledge and practice and\
    \ train by actually doing the sport. JS hacking is a lot like this, there is no\
    \ way in your day to do job you'll use every feature JS if you try and hack it\
    \ you can choose the feature to learn about. This is really my philosophy and\
    \ is exactly what this book is about. I'm going to try and teach you how to follow\
    \ it and learn at a rapid pace but enjoy what you are doing.\n\n## Environment\n\
    \nIn order to follow this process you need a rapid environment to conduct your\
    \ tests. What it means is you need something that you can execute your code and\
    \ instantly get the results. This can be a multitude of things, a browser console,\
    \ local web server or a web app as JS Fiddle. Personally I decided to write my\
    \ own web app called \"Hackvector\", giving it the ability to evaluate code, inspect\
    \ objects, write HTML but other options are fine too. I just wanted more power\
    \ and make sure that your input isn't being logged somewhere.\n\n## Set a goal\n\
    \nOnce you've got your chosen environment set the next step is to set a goal.\
    \ If you have no goal can be staring at a blank page not getting anywhere."
