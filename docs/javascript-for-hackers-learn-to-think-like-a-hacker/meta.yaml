    ## 第八章 - XS


    这一章完全关于跨站脚本攻击（Cross Site Scripting），亲切地称为 XS，尽管这个名字听起来并不合理。既然你存储了同源（same-site）的
    XS，而你可以拥有跨源但非同源的脚本，名字就重叠了，而且无论好坏大家现在都知道它指的是什么了。在本章中，我将介绍一些你可能不知道的 XS 技巧，并结合其他章节中学到的技术来产生一些有趣的负载。让我们开始吧……


    ## 结束脚本


    第一种技术是在 JavaScript 字符串中使用结束脚本块。这在 XS 社区中是广为人知的，但如果你是一个开发者，之前可能还没有遇到过。基本思想是你在 JavaScript
    字符串内部有一些反射，而注入的引号经过了转义，但仍有小于和大于符号。为了利用这种场景，你可以在 JS 字符串中注入一个结束脚本的标签，这会关闭脚本块并由于字符串未闭合而抛出
    JavaScript 异常，你可以继续注入自己的 HTML 并在目标应用上获取 XS：


    ```

    <script></script><img/src/onerror=alert(1337)">";</script>

    ```


    要修补此漏洞，你可以使用反斜杠转义正斜杠字符，以防止结束脚本生效，但这不是最好的修复方法，我们稍后会发现。更好的修复方法是对小于和大于符号进行 Unicode
    转义，这确保了 HTML 不会在字符串内部被渲染。当然，你还必须对反斜杠和引号进行转义。


    ## 脚本内部的注释


    你可能认为通过转义正斜杠修复之前的漏洞就解决了问题，但事实并非如此。如果你有两个注入点，一个在 JavaScript 变量内部，另一个在 HTML 属性内部。你可以注入一个开启
    HTML 注释标签和脚本，这会阻止脚本关闭，脚本块将持续到遇到另一个结束脚本标签。以下代码演示了这一点：


    ```html

    <script>

    let foo = "<!--<script>

    </script>

    ```


    <img title="</script>><img src/onerror="alert(1)">

    ```


    实际渲染的是：


    ```html

    <script>

    let foo = "<!--<script>

    </script>

    ```


    <img title="</script>><img src="" onerror="alert(1)">&gt;

    ```


    如你输出所示，HTML 注释和开启脚本的组合抵消了现有的结束脚本，第二个结束脚本随后用于关闭脚本块，从而跳出 title 属性导致图像元素被渲染。


    ### SVG 脚本内部的 HTML 实体


    你可能认为如果正确转义，就可以防止脚本块内的 XSS。然而，在 SVG 内部情况完全不同。HTML 实体会被渲染，因为 SVG 是 XML 格式，这意味着当实体被
    SVG 解码时，JavaScript 将获得正确的未编码字符。


    ```xml

    <svg>

    <script>let foo = "&quot;-alert(1)//";</script>

    </svg>

    ```


