    be embedded JavaScript expressions. Placeholders can be defined with $[] and even
    support nested template strings:


    ```

    `${alert(1337)}`

    `${${alert(1337)}}``

    ```


    When using tagged template strings an array of strings is passed as the first
    argument to the function, if there are no placeholders this will be one string
    if there are placeholders the strings will be separated:'
