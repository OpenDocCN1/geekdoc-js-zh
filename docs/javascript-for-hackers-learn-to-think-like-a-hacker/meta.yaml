    # # Chapter eight - XS


    This chapter is all about Cross Site Scripting affectionately known as XS even
    though the name doesn''t make sense. Since you have stored XS that is same-site
    and you can have cross origin scripting that''s not same-site but the name stack
    and everyone knows what it is now for better or worse. In this chapter I''m going
    to cover some XS tricks that you might not know and combine techniques learnt
    in the other chapters to produce some interesting payloads. Let''s get right to
    it...


    # ## Closing scripts


    The first technique is using a closing script block inside a JavaScript string.
    This is pretty well known in the XS community but if you''re a dev you might not
    have encountered before. The basic idea is you have some reflection inside a JavaScript
    string and the injected quote is quite escaped but less and greater than not.
    In order to exploit this scenario you can inject a closing script tag the JS string
    and this will close the script block and throw a JavaScript exception because
    of the unclosed string, you can proceed to inject your own HTML and get XS on
    the target application:


    ```

    ```<script></script><img/src/onerror=alert(1337)">";</script>```

    ```


    To patch this vulnerability you can escape the forward slash character using backslash
    prevents the closing script from working but this isn''t the best fix as we''ll
    find later. The better fix is to unicode escape less and greater than this ensures
    the HTML won''t be rendered inside the string. You have to of course or encode
    backslashes and quotes too.


    # ## Comments inside scripts


    You might think fixing the previous vulnerability by escaping the forward slash
    solves the problem however this isn''t the case. If you have two injection points
    one inside a JavaScript variable and another inside a HTML attribute. You can
    inject an opening HTML comment tag and script which prevents the script from closing
    and the script block will continue until it encounters another closing script
    tag. The following code demonstrates this:'
