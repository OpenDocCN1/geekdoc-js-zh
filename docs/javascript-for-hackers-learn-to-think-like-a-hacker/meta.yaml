  mdcn: "\n## 第三章 - 模糊测试 (Fuzzing)\n\n你可以将上述逻辑应用于单行注释的模糊测试，与其将占位符放在随机字符串的两端，可以将它们放在前面进行检测。接下来，让我们寻找单行注释：\n\
    \n```javascript\nlog=[];\nfor(let i=0;i<0xffff;i++){\n  try {\n    eval(`${String.fromCodePoint(i,i)}%$l234$`)\n\
    \    log.push(i);\n  } catch(e){}}\n}\nconsole.log(log);//47\n```\n\n我们如预期地检测到了正斜杠。你可以看到，构造模糊向量来发现有趣的行为确实是一项真正的技能。我们需要考虑模糊向量如何执行以及在什么上下文中执行，以避免误报。\n\
    \n最后，在本章中，我们将介绍嵌套模糊测试，以发现一种你可能不知道的 JavaScript 注释行为。嵌套模糊测试很复杂，因为它涉及到更多字符，而且目前现代浏览器还没有强大到可以执行多个码点大于\
    \ 0xff 的 `for` 循环。然而，如果我们减少测试的码点数量，就能发现一些有趣的东西。\n\n```javascript\nlog=[];\nfor(let\
    \ i=0;i<=0xff;i++){\n  for(let j=0;j<=0xff;j++){\n    try {\n      eval(`${String.fromCodePoint(i,j)}%$l234$`)\n\
    \      log.push([i,j]);\n    } catch(e){}\n  }\n}\nconsole.log(log);//[35, 47]\n\
    ```\n\n这次我们使用了嵌套循环，出于性能考虑，我们必须限制字符的数量。然后，我使用 `fromCodePoint` 方法在每个循环中从一个码点添加两个字符，并在注释后添加了一些垃圾字符以证明注释发生了。我们得到了包含两个字符的数组，因为产生注释需要这两个字符。我们得到了预期的双正斜杠，但这是什么？35\
    \ 和 33 是“#!”，只要它们位于执行的 JavaScript 的开头，就会充当单行注释。你可以通过尝试执行带有注释的 `alert` 来验证你的结果。\n\
    \n第三章 - 模糊测试\n\n25\n\n```javascript\n! \nalert(1337)//执行带有 1337 的 alert\n```\n\
    \n如果你在哈希符号之前添加任何字符，它将失败：\n\n```javascript\n123 \n! \nalert(@)//alert 不会被调用。\n\
    ```\n\n在示例中，如果哈希符号之前有任何字符，注释将不起作用。shebang 可能被添加为一种注释序列，是因为 JavaScript 被用 NodeJS\
    \ 用作 shell 脚本，因此忽略它是一个常见情况。\n\n## 模糊测试逃逸 (Fuzzing escapes)\n\n在破解 JavaScript 沙箱的过程中，我尝试模糊测试不同的转义字符，例如在引言章节发现的\
    \ Unicode 转义。这导致我在各种浏览器中发现了有趣的行为。我发现 Safari 在遇到字符串中未完成的 Unicode 转义时不会抛出异常。旧版本的\
    \ Opera（Chrome 之前）在发送到 `eval` 时也会错误地解析 Unicode 转义。如果你足够，旧的行为可以用于沙箱逃逸——我们如何找到它们呢？当然是通过模糊测试！你必须意识到你正在测试的上下文，以及它们是否需要双编码。让我们模糊一个简单的\
    \ Unicode 转义：\n\n```javascript\nlet a = 123;\nlog=[];\nfor(let i=0;i<0x10ffff;i++){\n\
    \  try{\n    eval(`\\${String.fromCodePoint(i)}\\u0061`);\n    log.push(i);\n\
    \  } catch(e) {}\n}\nconsole.log(log)/48\n```\n\n在代码中，我像在本章前面的那样对所有 Unicode 字符进行模糊。这次我定义了一个变量\
    \ \"a\" 来查看它是否抛出异常。如果代码尝试访问未定义的变量，`eval` 将抛出异常。我们想知道 \"a\" 是否被成功访问。我们使用 `\\u`\
    \ 的 Unicode 转义格式，你必须转义反斜杠，因为我们希望 `eval` 解析该 Unicode 转义。在代表零的占位符中，我们得到了 \"48\"\
    \ 的结果，这是零的字符码。当模糊所有字符时，我们确定这种 Unicode 格式允许通过纯模糊测试进行零填充。\n\n## 第三章 - 模糊测试\n\n你不仅可以模糊字符，还可以通过更改占位符来模糊十六进制。每个数字字面量都有一个\
    \ `toString` 方法，允许你指定基数（radix），可以将整数转换为 2-36 之间的指定基。十六进制使用基 16，所以我们必须传递基数 16 将其转换为十六进制：\n\
    \n```javascript\nlet a = 123;\nlog=[];\nfor(let i=0;i<=0xff;i++){\n  try {\n \
    \   eval(`${String.fromCodePoint(i,j)}\n```\n*(注：原文此处包含大量重复无效字符，翻译已根据要求忽略或保持逻辑结构)*\n"
