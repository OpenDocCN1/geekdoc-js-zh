    As you can see with the output, the combination of the HTML comment and the opening
    script negates the existing closing script and the second closing script then
    used to close the script block which then breaks out of the title attribute causing
    the image element to be rendered.


    # HTML entities inside SVG script


    You might think that if you escape correctly you can prevent XSS inside script
    blocks. However, inside SVG it''s a different story. HTML entities are rendered
    inside because SVG is an XML format and this means when the entities are decoded
    by SVG, JavaScript will then get the correct unencoded characters


    ```

    ```xml

    <svg>

    <script>let foo = "&quot;-alert(1)//";</script>

    </svg>

    ```

    ```


    # Script without closing script


    You might have thought about needing a closing script when using a script block.
    You''d be wrong at least on Firefox. If you use SVG you can have a self closing
    script on Firefox:


    ```

    ```xml

    <svg><script href=data:,alert(1) />

    ```

    ```


    You have to use the href attribute because you are inside SVG and not HTML and
    src attribute isn’t supported there.'
