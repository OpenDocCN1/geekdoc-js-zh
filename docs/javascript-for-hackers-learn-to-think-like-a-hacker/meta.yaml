    ### 寻找原型污染\n\n现在我们已经定义了术语，可以开始寻找原型污染了。你可以简单地注入一个攻击向量，然后使用浏览器控制台来确认。例如，假设一个网站允许你在查询字符串中使用名称和值，并且它们使用的库中有一个存在漏洞的合并操作。你可以在查询字符串中注入一个探测载荷，尝试在\
    \ `Object` 原型上设置属性：\n\n```\n__proto__[foo]=bar\n```\n\n页面加载后，你可以使用浏览器控制台检查 `Object`\
    \ 原型：\n\n1. console.log(Object.prototype)\n2. //foo: 'bar', constructor: f, __defineGetter__:\
    \ f, __defineSetter__: f, hasOwnProperty\n3. r, f -\n\n如果 `Object` 原型包含你找到的属性，说明你成功发现了客户端原型污染。使用\
    \ `__proto__` 属性并不是寻找原型污染的唯一方法，你可以使用 `constructor[prototype]` 属性，这本质上是一样的，它比 `__proto__`\
    \ 属性不常见，因为因为它需要三个属性键，而网站通常只使用两个。要测试这一点，你可以遵循相同的流程，只需将 `__proto__` 替换为 `constructor[prototype]`：\n\
