    ## JavaScript comments


    JavaScript supports a whole range of comment syntax. There are a few different
    types of single line comments:


    ```

    !

    //

    <-

    -->

    ```


    The first example will only work if it''s the first JavaScript statement, if it
    appears elsewhere a syntax error will be raised. The second example is the standard
    way of creating a string comment and can appear anywhere (provided it''s not asterix).
    Next, the third example behaves just like the previous comment and was added in
    the early days of the web when scripts weren''t supported by all browsers but
    it is still supported today.


    Finally the closing HTML comment is allowed in JavaScript and it acts like a single
    line comment if used at the start, however because it can potentially be used
    as decrement and greater operation isn''t supported anywhere inside an expression.
    Each single line comment is active until a new line character is encountered;
    this means a carriage return, a new line feed, paragraph separator or separator.


    As far as I''m aware JavaScript only supports one type of multiline comment with
    forward slash and asterix:


    ```

    /*

    I''m a multiline comment

    */

    ```


    ## New lines


    JavaScript supports multiple characters for separating statements. This includes
    carriage return, new line feed, and paragraph separator. This can be demonstrated
    as follows:


    ```javascript

    eval(''//alert(1337)'');//carriage return

    eval(''//alert(1337)'');//line feed

    eval(''/\u2028alert(1337)'');//line separator

    eval(''/\u2029alert(1337)'');//paragraph separator

    ```


    If you have injection inside a single line comment and the WAF is blocking a new
    line then it''s worth trying the alternative characters mentioned above.'
