    3 //a = 123

    ```


    As the above example shows you can escape the backslash inside the string which
    produces a unicode escape which is then used as an identifier. The unicode escape
    effectively translates to a=123. You are not limited to escaping the backslash;
    you can escape any part of the escape when using eval and of course mix and match
    the encodings. This is quite difficult to illustrate without being overly complex
    and confusing. I''ll demonstrate in parts:


    ```

    1 eval(''\\u0061=123'')//unicode escape using "a" assignment

    2 eval(''\\x30061=123'')//hex encode the first zero

    3 eval(''\\u30066=123'')//octal encode the 6

    ```


