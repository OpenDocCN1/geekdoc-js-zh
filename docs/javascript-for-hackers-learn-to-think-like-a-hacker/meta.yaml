    \ prototype pollution gadget.\n\n### Client-side prototype pollution\n\nThere\
    \ are two forms of prototype pollution: client and server side. This section deals\
    \ with the client-side form. The goal of exploiting client-side prototype pollution\
    \ is generally DOM XSS. You find if the site allows to add properties to the Object\
    \ prototype and then see if the property hits a sink that results in controlling\
    \ JavaScript or HTML.\n\n### Finding prototype pollution\n\nNow we've defined\
    \ the terms we can start to look for prototype pollution. You can do this by simply\
    \ injecting a vector and then use the browser console to confirm that. For example\
    \ imagine a site allows you to use names & values in the query string and has\
    \ a vulnerable merge operation in a library they use. You could inject a probe\
    \ into the query string that attempted to set a property on the Object prototype:\n\
    \n```\n__proto__[foo]=bar\n```\n\nAfter the page has loaded you could use the\
    \ browser console to inspect the Object prototype:\n\n1. console.log(Object.prototype)\n\
    2. //foo: 'bar', constructor: f, __defineGetter__: f, __defineSetter__: f, hasOwnProperty\n\
    3. r, f -\n\nIf the Object prototype contains properties you've successfully found\
    \ client-side prototype pollution. Using the __proto__ property isn't the only\
    \ one of finding prototype pollution, you can use the constructor[prototype] properties\
    \ which is essentially the same thing, it's less common than the __proto__ property\
    \ because it requires three property keys and often sites will generally use two.\
    \ To test for this you can follow the same process just replace __proto__ with\
