- img_proc: true
  md: 'What You''ll Learn: In-depth understanding of routing in Next.js and how to
    navigate between pages.


    # Chapter 7: State Management in Next.js


    What You''ll Learn: Implementing state management solutions in Next.js applications
    for data handling.


    # Chapter 8: Restful and GraphQL API Implementation


    What You''ll Learn: Implementing RESTful and GraphQL APIs in Next.js applications
    for data retrieval and manipulation.


    # Chapter 9: Using Different Types of Databases


    What You''ll Learn: Working with various types of databases and integrating them
    into Next.js applications.


    # Chapter 10: Client-Side and Server-Side Rendering in Next.js


    What You''ll Learn: Understanding client-side and server-side rendering and their
    applications in Next.js.


    # Chapter 11: Securing App with Next Auth


    What You''ll Learn: Implementing authentication and authorization mechanisms in
    Next.js applications using Next Auth.


    # Chapter 12: Developing a CRUD Application with Next.js


    What You''ll Learn: Building a CRUD (Create, Read, Update, Delete) application
    from scratch using Next.js.


    # Chapter 13: Deployment Architecture


    What You''ll Learn: Exploring deployment architectures and strategies for deploying
    Next.js applications to production environments.


    We are excited to embark on this learning journey with you. Each chapter is carefully
    crafted to provide you with a deep understanding of Next.js and its practical
    applications. By the end of this book, you will have the knowledge and confidence
    to build modern web applications that meet the demands of today''s digital landscape.
    Let''s get started!'
