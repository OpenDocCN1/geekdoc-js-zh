  md: '# Next.js Fundamentals


    Open your browser and go to http://localhost:3000. You should see your new Next.js
    application up and running!


    # Understanding the initial setup


    The ‘create-next-app’ command sets up a standard Next.js file structure as follows:


    +   - **pages**: This directory contains your application’s pages. Each file corresponds
    to a route based on its name.

    - **public**: This directory stores static files like images, which are served
    at the root (/) path.

    - **styles**: This directory contains global CSS files. The **globals.css** file
    is included by default and can be used for global styles.

    - **package.json**: This file contains metadata about your project and its dependencies.


    Here’s the directory structure of a Next.js project:


    ```

    bash

    my-next-app

    ├── pages

    |   ├── _app.js

    |   ├── api

    |   │   └── index.js

    ├── public

    ├── styles

    |   ├── globals.css

    |   └── Home.module.css

    └── package.json

    ```


    The ‘pages’ directory includes an **index.js** file, which corresponds to the
    ‘/’ route, and **_app.js**, which is a custom App component used to initialize
    pages. You can override it to control page initialization or add global styles.


    The **api** directory under **pages** is special – it’s where you can create backend
    functions directly in your Next.js.


    This initial setup provides a solid foundation for your Next.js projects, and
    you’ll learn more about each of these components as you progress in your Next.js
    journey.'
