  md: 'Using Different Types of Databases


    # Key Components of a DBMS:


    +   - Data: DBMS manages different types of data, such as text, numbers, images,
    videos, and so on, which are stored in various formats and structures.


    +   - Database: A database is a collection of related data that is organized and
    stored in a structured manner. It consists of tables, views, indexes, and other
    objects that define the structure and relationships of the data.


    +   - Database Schema: The database schema defines the logical and physical structure
    of the database. It describes the tables, their attributes (columns), data types,
    constraints, and relationships with other tables.


    +   - Data Manipulation Language (DML): DML is a language that allows users to
    retrieve, insert, update, and delete data in the database. Common DML statements
    include SELECT, INSERT, UPDATE, and DELETE.


    +   - Data Definition Language (DDL): DDL is a language used to define and manage
    the database structure. It includes statements such as CREATE, ALTER, and DROP,
    which are used to create tables, modify their structure, or delete them.


    +   - Query Optimization: DBMS optimizes the execution of queries to improve performance
    and efficiency. It analyses the query, evaluates different execution plans, and
    chooses the most efficient approach to retrieve the data.


    +   - Transaction Management: DBMS ensures the ACID properties of transactions.
    Atomicity (transactions are treated as a single unit of work), Consistency (ensures
    data integrity), Isolation (transactions are executed in isolation from each other),
    and Durability (once a transaction is committed, its changes are permanent).


    +   - Concurrency Control: DBMS handles concurrent access to the database by multiple
    users or processes. It ensures that data integrity is maintained when multiple
    transactions are executed simultaneously. Techniques like locking, timestamping,
    and multiversion control are used to manage concurrency.


    +   - Security and Authorization: DBMS provides mechanisms to control access to
    the database and ensure data security. It includes user authentication, authorization,
    and privilege management to protect sensitive data from unauthorized access.


    +   - Backup and Recovery: DBMS facilitates backup and recovery of data in case
    of system failures, data corruption, or human errors. It allows users to create
    backups, restore data to a previous state, and perform recovery operations to
    minimize data loss.'
