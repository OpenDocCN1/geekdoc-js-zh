  md: 'Exploring Deployment Architecture in Next.js Applications


    +   - Windows Environment

    In Windows, you can set environment variables inline before executing the script
    using the `set` command. Here''s an example:

    ```

    set API_KEY=12345 && npm run dev

    ```nIn the preceding example, `API_KEY` is set to `12345` before running the npm
    dev script. You can replace `API_KEY` and its value with your specific environment
    variable.


    +   - Linux Environment

    In Linux, you can set environment variables inline before executing the script
    using the `export` command. Here''s an example:

    ```

    export API_KEY=12345 && npm run dev

    ```nSimilar to the Windows example, `API_KEY` is set to `12345` before running
    the `npm run dev` script. Again, you can replace `API_KEY` and its value with
    your specific environment variable.

    Alternatively, you can store the environment variables in a separate file and
    load them before running the script.


    +   - Separate file method in Windows Environment

    In Windows, you can create a separate file, for example, `env.bat`, and use the
    `set` command to define your environment variables. Here''s an example:

    ```

    @echo off

    set API_KEY=12345

    set DATABASE_URL=mongodb://localhost:27017/mydatabase

    ```nSave the file, and then run the script by executing it before running the
    `npm run dev` script:


    +   - Separate file method in Linux Environment

    In Linux, you can create a separate file, for example, `env.sh`, and use the `export`
    command to define your environment variables. Here''s an example:

    ```

    #!/bin/bash

    export API_KEY=12345

    ```'
