  md: '# Rendering


    A route can be statically or dynamically rendered in Next.js. In a static route,
    components are rendered on the server at build time. This work is cached and reused
    on subsequent requests, whereas, in a dynamic route, components are rendered on
    the server at request time.


    # Static Rendering


    Static rendering, which is the default rendering pattern for a Next.js app, improves
    performance because all the rendering work is done ahead of time and can be served
    from a Content Delivery Network (CDN) geographically closer to the user.


    We can also opt into dynamic rendering using a dynamic function or dynamic data
    fetching in a layout or page, which will cause Next.js to render the whole route
    dynamically at the time of the request.


    # Dynamic rendering


    Next.js will switch to dynamically rendering the whole route at request time if
    a dynamic function or fetch() request in no-caching mode is detected during static
    rendering. Any cached data requests can still be reused during dynamic rendering.
    Dynamic data fetches are fetch requests with their cache option set to ''no-store''
    or revalidate to 0. We will explore more data fetching patterns in the next section.


    # Data fetching


    React and Next.js 13 introduced a new way to fetch and manage data in your application.
    The new data fetching system works in the app directory and is built on top of
    the fetch() Web API.


    fetch() is a Web API used to fetch remote resources that returns a promise. React
    extends fetch to provide automatic request deduping, and Next.js extends the fetch
    options object to allow each request to set its own caching and revalidating.


    # async and await in Server Components


    The following code is an example of using async and await to fetch data in Server
    Components:'
