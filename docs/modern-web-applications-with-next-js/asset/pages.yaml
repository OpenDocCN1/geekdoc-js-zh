  md: "To use the Context API, you need to create a context using React.createContext()\
    \ and wrap your component tree with a context provider. The context provider takes\
    \ a value prop, which can be any data you want to share across the component tree:\n\
    \n```\nimport React, { useState, useContext } from 'react';\n\nconst ThemeContext\
    \ = React.createContext();\n\nfunction App() {\n  const [theme, setTheme] = useState('light');\n\
    \n  return (\n    <ThemeContext.Provider value={{ theme, setTheme }}>\n      <Toolbar\
    \ />\n    </ThemeContext.Provider>\n  );\n}\n\nfunction Toolbar() {\n  return\
    \ <ThemeSwitch />;\n}\n\nfunction ThemeSwitch() {\n  const { theme, setTheme }\
    \ = useContext(ThemeContext);\n}\n\nfunction toggleTheme() {\n  setTheme((prevTheme)\
    \ => prevTheme === 'light' ? 'dark' : 'light');\n}\n\nreturn ( <button onClick={toggleTheme}>);\n\
    ```"
