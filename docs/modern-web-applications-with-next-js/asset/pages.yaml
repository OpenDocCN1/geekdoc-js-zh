  md: '# Next.js Fundamentals


    +   - Understanding the rendering process


    When you request a page in a Next.js application, here''s what happens under the
    hood:


    +   1. The server receives the request: When you navigate to a route in your Next.js
    application, the server receives a request for that route.

    2. The server fetches the component: Next.js then fetches the React Component
    for that route from the ''pages'' directory.

    3. The server renders the page: The component is rendered to HTML on the server.
    If your component fetches data in a getServerSideProps function (which we will
    discuss in later chapters), this data fetching happens during this step.

    4. The server sends the HTML response: The HTML result is sent to the client,
    with minimal JavaScript code for hydration.

    5. The page is interactive: The JavaScript code runs on the client, hydrating
    the HTML into a fully interactive React application.


    This process allows Next.js to provide fast initial load times and powerful features
    like server-side rendering and static generation.


