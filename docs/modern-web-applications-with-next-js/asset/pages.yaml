    using the mechanisms provided by the hosting service. This might include a management
    console, dashboard, or command-line interface specific to the hosting platform.


    +   Avoid storing production environment variables directly in the codebase or
    configuration files. Instead, securely set the environment variables on the production
    server or configure them through the hosting platform’s deployment settings.


    +   On the production server, ensure that the environment variables are correctly
    loaded and accessible by your Next.js application during runtime.


