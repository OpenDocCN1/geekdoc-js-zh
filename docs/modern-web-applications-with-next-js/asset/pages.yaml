    +   - Static site generation (SSG)

    Static Site Generation (SSG) is a website rendering technique where web pages
    are pre-rendered at build time and served as static HTML files to clients. With
    SSG, the content is generated once during the build process and does not require
    any server-side processing during runtime. This approach offers several advantages,
    such as improved performance, lower server load, and enhanced security. It also
    enables better search engine optimization (SEO), as search engines can easily
    crawl and index the static pages. SSG is commonly used for websites with content
    that doesn''t frequently change, such as blogs, documentation sites, and marketing
    pages.


    Key differences between CSR and SSR:


    +   - Page load: SSR provides a fully rendered HTML page from the server, enabling
    faster initial rendering, whereas CSR requires additional requests and processing
    on the client-side.

    - SEO: SSR is more SEO-friendly as search engines can easily crawl and index the
    pre-rendered HTML, whereas CSR requires additional efforts to make content discoverable
    by search engines.

    - Performance: CSR can provide a faster and more interactive experience once the
    initial page is loaded, as subsequent updates can be handled on the client-side
    without a full page reload. SSR may have a longer initial load time but provides
    a better user experience for slower devices or poor network conditions.

    - Complexity: CSR requires more client-side JavaScript code for data fetching
    and rendering, while SSR shifts this responsibility to the server-side, reducing
    the complexity on the client.


