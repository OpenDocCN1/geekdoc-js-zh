  md: "# Routing\n\nNext.js uses a file system-based router in which each folder defines\
    \ a route. Each folder represents a route segment that maps to a URL segment,\
    \ and nested route can be created by nesting folders inside each other.\n\n# Dynamic\
    \ routes\n\nWhile developing a web application, there are cases where the developer\
    \ or user may not know the exact segment names ahead of time and want to create\
    \ routes from dynamic data. In such cases, we can use Dynamic Segments that are\
    \ resolved at request or pre-rendered at build time.\n\nA dynamic segment in Next.js\
    \ 13 can be created by wrapping a folder's name in square brackets.\n\nFor example,\
    \ if you want to retrieve dynamic data that should be retrieved from the URL segment,\
    \ as `app/blog/[slug]/page.js`, where `[slug]` is the Dynamic Segment for the\
    \ blog posts, then you can write the page.js as follows:\n\n```\nexport default\
    \ function Page({ params }) {\n  return <MyPost ID={params.slug} />;\n}\n\n```\n\
    \nIf we use the URL app/blog/1234, we will get the value 1234 inside the params\
    \ prop, as demonstrated in the preceding example.\n\n# Error handling\n\nThe error.js\
    \ file convention allows a developer to handle runtime errors in nested routes.\
    \ It can be used to automatically wrap a route and its nested children in a React\
    \ Boundary. This enables developers to create an UI tailored to that specific\
    \ segment. A major advantage of the error.js file convention is that it allows\
    \ error isolation without affecting the remaining parts of the app. An error UI\
    \ can be easily added by creating an error.js file inside a route segment and\
    \ exporting a React component.\n\n# Middleware\n\nWe can execute code using middleware\
    \ before a request has finished. The response may be modified based on the incoming\
    \ request by rewriting, redirecting, changing the request or response headers,\
    \ or simply responding."
