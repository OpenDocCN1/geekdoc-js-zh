    \ can be grouped into three main phases: mounting, updating, and unmounting.\n\
    \nNote: With the introduction of Hooks, functional components can now perform\
    \ similar tasks using useEffect. This section focuses on lifecycle methods for\
    \ class components, but it's important to be aware of this alternative approach\
    \ in functional components.\n\n+   - Mounting phase methods\n\nThe mounting phase\
    \ occurs when a component is being created and inserted into the DOM. There are\
    \ two lifecycle methods associated with this phase:\n\n+   - constructor: The\
    \ constructor method is used to initialize the component's state and bind event\
    \ handlers. It's called before the component is mounted.\n\nHere's an example:\n\
    \n```\nclass MyComponent extends React.Component {\n  constructor(props) {\n \
    \   super(props);\n    this.state = { message: \"Hello, World!\" };\n    this.handleClick\
    \ = this.handleClick.bind(this);\n  }\n}\n```\n\n+   - componentDidMount: This\
    \ method is called immediately after the component is inserted into the DOM. It's\
    \ the ideal place to fetch data, set up subscriptions, or perform other side effects."
