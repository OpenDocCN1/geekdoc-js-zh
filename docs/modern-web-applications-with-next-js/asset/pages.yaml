- img_proc: true
  md: '+   Replication and High Availability:


    MongoDB supports replica sets, which are clusters of database nodes that maintain
    copies of the same data. Replica sets offer data redundancy and high availability,
    ensuring that the system remains operational in the event of node failures. MongoDB
    uses automatic failover mechanisms to elect a primary node and maintain continuous
    service.


    +   Querying and Indexing:


    MongoDB provides a flexible and powerful query language for retrieving data, known
    as the MongoDB Query Language MQL. MQL supports a wide range of querying capabilities,
    including filtering, sorting, aggregation, and geospatial queries. MongoDB also
    supports indexing, allowing you to optimize performance by creating indexes on
    specific fields.


    +   Use Cases and Context:


    MongoDB is particularly well-suited for use cases where flexibility, scalability,
    and real-time data processing are crucial. It is commonly used in scenarios such
    as content management systems, real-time analytics, logging and monitoring systems,
    and user profile management. Additionally, MongoDB''s document model makes it
    easier to integrate with modern web development frameworks and languages.


    # Difference between SQL and NoSQL DBMS:


    | Aspect | SQL (Relational Database) | NoSQL (Non-relational Database) |

    |---|---|---|

    | Data Structure | Structured, tabular data with fixed schema. | Flexible, semi-structured
    or unstructured data with dynamic schema. |

    | Schema | Requires predefined schema with strict structure. | Schema-less or
    flexible schema that can evolve over time. |

    | Query Language | SQL (Structured Query Language) is used for defining and manipulating
    data. | Query languages specific to each NoSQL database (for example, MongoDB
    uses a query language similar to JavaScript). |'
