- img_proc: true
  md: '# Types of DBMS:


    +   - Relational DBMS (RDBMS): The most widely used type, where data is organized
    in tables with predefined relationships between them. Examples include MySQL,
    Oracle Database, and Microsoft SQL Server.

    - Object-Oriented DBMS (ODBMS): These systems store data in the form of objects,
    allowing inheritance, encapsulation, and polymorphism. They are suited for complex
    data structures. Examples include MongoDB and Apache Cassandra.

    - Hierarchical DBMS: Data is organized in a tree-like structure, where each record
    has a parent-child relationship. It was popular in the early days but has been
    largely replaced by other models.

    - Network DBMS: Similar to hierarchical DBMS, but with a more flexible structure.
    It allows records to have multiple parents and child records, creating complex
    relationships.

    - NoSQL DBMS: NoSQL (Not Only SQL) databases are designed to handle large-scale,
    unstructured, and diverse data. They provide high scalability, performance, and
    flexibility. Examples include MongoDB, Cassandra, and Redis.

    - NewSQL DBMS: NewSQL databases combine the scalability and performance of NoSQL
    with the ACID properties of traditional relational databases. They aim to address
    the limitations of RDBMS in handling high volumes of data and concurrent users.
    NewSQL systems provide distributed architectures and efficient parallel processing
    while maintaining transactional consistency. Examples include Google Spanner,
    Cockroach DB, and TiDB.


    # Benefits of using a DBMS:


    +   - Data Centralization: A DBMS allows users to store data in a centralized
    location, providing a unified view of the data for different applications and
    users. This eliminates data redundancy and inconsistency.

    - Data Sharing: DBMS enables multiple users to access and share data simultaneously.
    It provides controlled access and ensures data integrity through concurrency control
    mechanisms.

    - Data Security: DBMS includes features such as user authentication, access control,
    and encryption to protect sensitive data from unauthorized access, ensuring data
    security and compliance with regulations.

    - Data Integrity: DBMS enforces data integrity constraints, such as primary key
    constraints and referential integrity, to maintain the accuracy and consistency
    of data.'
