  md: "# Next.js 13\n\nHere is the folder structure for **my-app:**\n\n```\nmy-app\n\
    \  app\n    dashboard\n      page.tsx\n```\n\n# File Conventions\n\nNext.js provides\
    \ a set of special files for creating UI with specific behavior in nested routes.\
    \ Let's have a look at the main ones that we need:\n\n+   - **page.js**: It is\
    \ used to render the UI of a route and make the path publicly accessible to a\
    \ user.\n- **layout.js**: It is used to create shared UI for a segment and its\
    \ children. Layout wraps a page or child segment and can be used to render UI\
    \ that is shared across multiple routes, such as a navigation menu or a header\
    \ component.\n- **loading.js**: It is used to create loading UI for a segment\
    \ and its children. loading.js shows a loading UI while they load and works by\
    \ wrapping a page or child segment in a React Suspense Boundary.\n- **error.js**:\
    \ It is used to create an error UI for a segment and its children. error.js shows\
    \ the error UI if an error is caught and works by wrapping a page or child segment\
    \ in a React Boundary.\n\n# Client and server components\n\nWith the release of\
    \ Next.js 13, a hybrid method for creating apps that uses both Server and Client\
    \ Components was introduced. A React principle called \"Server Components\" seeks\
    \ to design applications with zero JavaScript bundles and a server-driven mental\
    \ model for modern user interfaces.\n\nA Client Component is fetched from rendered\
    \ on the client (the browser), whereas a Server Component is fetched and rendered\
    \ on the server.\n\nNow, let's examine a program without a Server Component. In\
    \ this scenario, a server replies to a user's request for a web page by sending\
    \ information to the browser. JavaScript is downloaded by the browser when it\
    \ creates the web page. This implies that the browser, similar to npm packages,\
    \ must install every piece of JavaScript required to create the web page. Due\
    \ to all the request-response waterfalls, this may take a long time to load and\
    \ provide a bad user experience."
