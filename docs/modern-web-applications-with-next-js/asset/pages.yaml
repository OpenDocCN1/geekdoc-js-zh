  md: "96 Modern Web Applications with Next.JS\n\nA Server Component is useful in\
    \ this situation. The browser only needs to download JavaScript for Client Components,\
    \ while a component is defined as a Server Component since the server builds the\
    \ component and returns the rendered HTML for the Server Component. This can speed\
    \ up browser rendering and enhance the user experience.\n\nNext.js 13 provides\
    \ us with a system where we can specify whether a component should be a Server\
    \ or a Client Component at the component level.\n\nIn the newly introduced app\
    \ directory in Next.js 13, all components are Server Components by default. This\
    \ means that all the components and pages are rendered on the server, as long\
