    <input type="number" id="amountInput" placeholder="Enter amount">

    <select id="currencySelect">

    <option value="USD">USD</option>

    <option value="EUR">EUR</option>

    <option value="GBP">GBP</option>

    </select>

    <button onclick="convertCurrency()">Convert</button>

    <p id="result"></p>

    <script>

    function convertCurrency() {

    var amount = document.getElementById("amountInput").value;

    var currency = document.getElementById("currencySelect").value;

    fetch("https://api.exchangerate-api.com/v4/latest/USD")

    .then(response => response.json())

    .then(data => {

    var rate = data.rates[currency];

    var convertedAmount = amount * rate;

    document.getElementById("result").innerHTML = amount + " units of your currency
    is equal to " + convertedAmount + " units of " + currency;

    });

    }

    </script>

    </body>

    </html>

