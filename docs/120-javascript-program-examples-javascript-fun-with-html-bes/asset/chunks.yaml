    ## Simple Currency Conversion using API

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <input type="number" id="amountInput" placeholder="Enter amount">

    <select id="currencySelect">

    <option value="USD">USD</option>

    <option value="EUR">EUR</option>

    <option value="GBP">GBP</option>

    </select>

    <button onclick="convertCurrency()">Convert</button>

    <p id="result"></p>

    <script>

    function convertCurrency() {

    var amount = document.getElementById("amountInput").value;

    var currency = document.getElementById("currencySelect").value;

    fetch("https://api.exchangerate-api.com/v4/latest/USD")

    .then(response => response.json())

    .then(data => {

    var rate = data.rates[currency];

    var convertedAmount = amount * rate;

    document.getElementById("result").innerHTML = amount + " units of your currency
    is equal to " + convertedAmount + " units of " + currency;

    });

    }

    </script>

    </body>

    </html>

    ```


    ## Simple Login Form with Local Storage

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form>

    <label for="username">Username:</label><br>

    <input type="text" id="username" name="username"><br>

    <label for="password">Password:</label><br>

    <input type="password" id="password" name="password"><br><br>

    <input type="button" value="Submit" onclick="login()">

    </form>

    <p id="result"></p>

    <script>

    function login() {

    var username = document.getElementById("username").value;

    var password = document.getElementById("password").value;

    if (username === localStorage.getItem("username") && password === localStorage.getItem("password"))
    {

    document.getElementById("result").innerHTML = "Login successful!";

    } else {

    document.getElementById("result").innerHTML = "Invalid username or password!";

    }

    }

    localStorage.setItem("username", "user");

    localStorage.setItem("password", "pass");

    </script>

    </body>

    </html>

    ```


