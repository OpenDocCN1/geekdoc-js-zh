    ## SET-1


    ### 1. Hello World Output

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h1>My First JavaScript</h1>

    <script>

    document.write("Hello World!");

    </script>

    </body>

    </html>

    ```


    ### 2. Button Click Alert

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <button onclick="alert(''Hello'')">Click me</button>

    </body>

    </html>

    ```


    ### 3. Simple Calculator

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <input id="num1" type="text"> +

    <input id="num2" type="text">

    <button onclick="addNumbers()">Add</button>

    <p>Result: <span id="result"></span></p>

    <script>

    function addNumbers() {

    var num1 = parseInt(document.getElementById("num1").value);

    var num2 = parseInt(document.getElementById("num2").value);

    var result = num1 + num2;

    document.getElementById("result").innerText = result;

    }

    </script>

    </body>

    </html>

    ```


    ### 4. Simple Form Validation

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <form onsubmit="return validateForm()">

    Name: <input type="text" id="name">

    <input type="submit" value="Submit">

    </form>

    <script>

    function validateForm() {

    var name = document.getElementById("name").value;

    if (name == "") {

    alert("Name must be filled out");

    return false;

    }

    return true;

    }

    </script>

    </body>

    </html>

    ```


    ### 5. Display Current Date

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo"></p>

    <script>

    document.getElementById("demo").innerHTML = Date();

    </script>

    </body>

    </html>

    ```


    ### 6. Changing HTML Content

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo">JavaScript can change HTML content.</p>

    <button type="button" onclick=''document.getElementById("demo").innerHTML = "Hello
    JavaScript!"''>Click Me!</button>

    </body>

    </html>

    ```


    ### 7. Array Manipulation

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo"></p>

    <script>

    var fruits = ["Apple", "Banana", "Orange"];

    document.getElementById("demo").innerHTML = fruits;

    fruits.push("Lemon");

    document.getElementById("demo").innerHTML = fruits;

    fruits.pop();

    document.getElementById("demo").innerHTML = fruits;

    </script>

    </body>

    </html>

    ```


    ### 8. Simple Image Slideshow

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <img id="slide" width="300" height="200">

    <script>

    var images = ["image1.jpg", "image2.jpg", "image3.jpg"];

    var currentIndex = 0;

    function nextImage() {

    if (currentIndex === images.length) {

    currentIndex = 0;

    }

    document.getElementById("slide").src = images[currentIndex];

    currentIndex++;

    }

    setInterval(nextImage, 2000);

    </script>

    </body>

    </html>

    ```


    ### 9. Changing CSS Styles

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo">JavaScript can change the style of an HTML element.</p>

    <button type="button" onclick=''document.getElementById("demo").style.fontSize="25px"''>Click
    Me!</button>

    </body>

    </html>

    ```


    ### 10. Handling Mouse Events

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <button onmouseover="mouseOver()" onmouseout="mouseOut()">Hover over me</button>

    <script>

    function mouseOver() {

    document.body.style.backgroundColor = "lightgray";

    }

    function mouseOut() {

    document.body.style.backgroundColor = "white";

    }

    </script>

    </body>

    </html>

    ```


    ## SET-2


    ### 1. Simple To-Do List

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h2>My To Do List</h2>

    <input type="text" id="taskInput">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

    <script>

    function addTask() {

    var task = document.getElementById("taskInput").value;

    var list = document.getElementById("taskList");

    var item = document.createElement("li");

    item.appendChild(document.createTextNode(task));

    list.appendChild(item);

    }

    </script>

    </body>

    </html>

    ```


    ### 2. Basic Clock

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo"></p>

    <script>

    function displayTime() {

    var date = new Date();

    var time = date.toLocaleTimeString();

    document.getElementById("demo").innerHTML = time;

    }

    setInterval(displayTime, 1000);

    </script>

    </body>

    </html>

    ```


