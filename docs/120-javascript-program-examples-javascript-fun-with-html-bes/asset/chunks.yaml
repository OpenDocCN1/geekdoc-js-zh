    <p>Drag the image into the rectangle:</p>\n<div id=\"div1\" ondrop=\"drop(event)\"\
    \ ondragover=\"allowDrop(event)\"></div>\n<img id=\"drag1\" src=\"img_logo.gif\"\
    \ draggable=\"true\" ondragstart=\"drag(event)\" width=\"336\" height=\"69\">\n\
    <script>\nfunction allowDrop(ev) {\n  ev.preventDefault();\n}\nfunction drag(ev)\
    \ {\n  ev.dataTransfer.setData(\"text\", ev.target.id);\n}\nfunction drop(ev)\
    \ {\n  ev.preventDefault();\n  var data = ev.dataTransfer.getData(\"text\");\n\
    \  ev.target.appendChild(document.getElementById(data));\n}\n</script>\n</body>\n\
    </html>\n```\n\n### 5. 简单弹出窗口\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<button\
    \ onclick=\"openPopup()\">Open Popup</button>\n<script>\nfunction openPopup()\
    \ {\n  window.open(\"\", \"Popup\", \"width=400,height=400\");\n}\n</script>\n\
    </body>\n</html>\n```\n\n### 6. 显示用户输入\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <input type=\"text\" id=\"inputField\" oninput=\"displayInput()\">\n<p id=\"display\"\
    ></p>\n<script>\nfunction displayInput() {\n  var input = document.getElementById(\"\
    inputField\").value;\n  document.getElementById(\"display\").innerHTML = input;\n\
    }\n</script>\n</body>\n</html>\n```\n\n### 7. 交互式下拉菜单\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<select id=\"mySelect\" onchange=\"showSelected()\">\n  <option\
    \ value=\"1\">Apple</option>\n  <option value=\"2\">Banana</option>\n  <option\
    \ value=\"3\">Cherry</option>\n  <option value=\"4\">Date</option>\n</select>\n\
    <p id=\"demo\"></p>\n<script>\nfunction showSelected() {\n  var select = document.getElementById(\"\
    mySelect\");\n  var selectedValue = select.options[select.selectedIndex].text;\n\
