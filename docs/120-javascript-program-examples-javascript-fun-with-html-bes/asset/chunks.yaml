    \ onclick=\"getLocation()\">Get Location</button>\n</body>\n</html>\n```\n\n##\
    \ 第 3 组\n\n### 1. 简单倒计时器\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"demo\"\
    ></p>\n<script>\nvar seconds = 60;\nfunction countdown() {\n  seconds--;\n  document.getElementById(\"\
    demo\").innerHTML = seconds + \" seconds remaining.\";\n  if (seconds <= 0) {\n\
    \    clearInterval(countdownInterval);\n    document.getElementById(\"demo\").innerHTML\
    \ = \"Time's up!\";\n  }\n}\nvar countdownInterval = setInterval(countdown, 1000);\n\
    </script>\n</body>\n</html>\n```\n\n### 2. 简单响应式网页设计\n```html\n<!DOCTYPE html>\n\
