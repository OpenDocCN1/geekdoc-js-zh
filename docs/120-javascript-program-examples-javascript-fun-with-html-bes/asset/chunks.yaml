    600\" height=\"400\">\n</body>\n</html>\n```\n\n### 3. 简单表单提交\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<form onsubmit=\"submitForm()\">\n  <input type=\"text\"\
    \ id=\"fname\" name=\"fname\" placeholder=\"First name\">\n  <input type=\"text\"\
    \ id=\"lname\" name=\"lname\" placeholder=\"Last name\">\n  <input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n<p id=\"result\"></p>\n<script>\nfunction submitForm()\
    \ {\n  var firstName = document.getElementById(\"fname\").value;\n  var lastName\
    \ = document.getElementById(\"lname\").value;\n  document.getElementById(\"result\"\
    ).innerHTML = \"Submitted: \" + firstName + \" \" + lastName;\n}\n</script>\n\
    </body>\n</html>\n```\n\n### 4. 简单拖放文件上传\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <div id=\"drop_zone\" ondrop=\"dropHandler(event);\" ondragover=\"dragOverHandler(event);\"\
    >\n  Drop files here\n</div>\n<script>\nfunction dropHandler(ev) {\n  ev.preventDefault();\n\
    \  if (ev.dataTransfer.items) {\n    for (var i = 0; i < ev.dataTransfer.items.length;\
    \ i++) {\n      if (ev.dataTransfer.items[i].kind === 'file') {\n        var file\
    \ = ev.dataTransfer.items[i].getAsFile();\n        console.log('File: ' + file.name);\n\
    \      }\n    }\n  } else {\n    for (var i = 0; i < ev.dataTransfer.files.length;\
    \ i++) {\n      console.log('File: ' + ev.dataTransfer.files[i].name);\n    }\n\
    \  }\n}\nfunction dragOverHandler(ev) {\n  ev.preventDefault();\n}\n</script>\n\
    </body>\n</html>\n```\n\n### 5. 动态内容更新\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
