    myAudio\");\nfunction playSound() {\n  sound.play();\n}\n</script>\n</body>\n\
    </html>\n```\n\n### 9. 简单拖放与调整大小\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
