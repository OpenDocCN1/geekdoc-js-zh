    true\"></div>\n</body>\n</html>\n```\n\n### 10. 显示地理位置\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p id=\"demo\"></p>\n<script>\nfunction getLocation() {\n  if\
    \ (navigator.geolocation) {\n    navigator.geolocation.getCurrentPosition(showPosition);\n\
