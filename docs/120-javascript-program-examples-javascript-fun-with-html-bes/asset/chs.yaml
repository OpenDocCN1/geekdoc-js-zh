  100\" style=\"border:1px solid #000000;\"></canvas>\n<script>\nvar canvas = document.getElementById(\"\
  myCanvas\");\nvar ctx = canvas.getContext(\"2d\");\nvar painting = false;\ncanvas.addEventListener('mousedown',\
  \ startPosition);\ncanvas.addEventListener('mouseup', finishedPosition);\ncanvas.addEventListener('mousemove',\
  \ draw);\nfunction startPosition(e) {\n  painting = true;\n  draw(e);\n}\nfunction\
  \ finishedPosition() {\n  painting = false;\n  ctx.beginPath();\n}\nfunction draw(e)\
  \ {\n  if (!painting) return;\n  ctx.lineWidth = 5;\n  ctx.lineCap = 'round';\n\
  \  ctx.strokeStyle = 'black';\n  ctx.lineTo(e.clientX - canvas.offsetLeft, e.clientY\
  \ - canvas.offsetTop);\n  ctx.stroke();\n  ctx.beginPath();\n  ctx.moveTo(e.clientX\
  \ - canvas.offsetLeft, e.clientY - canvas.offsetTop);\n}\n</script>\n</body>\n</html>\n\
  ```\n\n### 9. 简单的页面刷新\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Click the\
