  \n# 引言\n\n恭喜下载了 PowerShell，感谢你的支持。\n\n接下来的章节将讨论如何在你的计算机上安装和使用 PowerShell。更重要的是，它将准确告诉你\
  \ PowerShell 是什么，以及使用它的多种方法。\n\n市场上有许多关于这个主题的书，再次感谢你选择这一本！我们尽了努力确保它包含尽可能多的有用信息，请尽情享受！\n\
  \n# 第 1 章\n## 什么是 PowerShell？\n\n到目前，你已经购买了这本书并想要深入研究其内容，开始使用功能强大的 PowerShell。然而，在考虑深入研究内容最核心的部分之前，我们必须先讨论一些基本问题。\n\
  \n例如，我不完全确定你拿起这本书的原因是什么。也许你只是真的对 PowerShell 是什么以及你用它能做到的所有事情感到好奇。也许你通过工作或学校听过它，并需要充足的机会在操作此应用程序方面脱颖而出。此外，你可能只是一个在教程或论坛上读到\
  \ PowerShell 的爱好者，正在寻找一个合适的机会开始使用这个极具活力的工具。那么，这本书将教你恰恰做到这一点。但是，在我们开始学习“怎么做”之前，我们真的需要花一些时间来看看“是什么”。\n\
  \n那么，什么是 PowerShell 呢？本质上，PowerShell 是微软开发的一个工具，旨在让人们通过命令行和一些编程知识来处理配置并自动化任务。最近，PowerShell\
  \ 也已适用于其他操作系统。\n\nPowerShell 还包含一种内置的脚本语言。这种脚本语言允许你构建小型程序，以自动化计算机上不同的任务。这种脚本能力赋予了\
  \ PowerShell 许多著名功能，并使其成为你需要执行的所有自动化任务的完美选择。\n\n我想，到目前为止，我还没有完全清楚 PowerShell 是什么。我现在就解决这个问题。你看，在发布的每一个\
  \ Windows 版本中，用户都有一种方法通过命令行与工具直接交互。这些界面方法被专门称为 shell（壳）。通过使用 shell，你可以直接向计算机输入命令，这将让你能够轻松地完成某些事情，或者以以前所未过的控制水平来操作。传统的\
  \ shell 有一种名为 `batch` 的脚本语言，在 Windows、Linux 或 Mac 等大多数命令行界面中通用的。`batch` 文件是基础脚本，可以运行以自动执行预先写好的命令行中的某些任务。\n\
  \n但从任何角度来看，`batch` 都极其简单。甚至是愚蠢地简单。因此，`Batch` 不允许生成超出执行命令和遵循非常非常基础逻辑之外的脚本。\n\n微软改善脚本和命令行壳状况的首次尝试出现在\
  \ 1998 年，当时他们在推出操作系统 `Windows 98` 的同时提出了 `Windows Script Host`。这通过对 `Active Script`\
  \ 的兼容性，允许使用 `VBScript` 等语言编写脚本。这意味着在命令行编程和任务自动化方面迈出了巨大的一步。尽管迈出了这一大步，该系统仍然远未完善；例如，它没有被内置到命令行\
  \ shell 中。出于同样的目的，关于它的文档非常难以找到，这意味着想要使用它的人处处困难，而且几乎没有人能成为“大师”。\n\n最糟糕的是，它存在安全漏洞。利用\
  \ `Windows Script Host` 在它们本不应该出现的地方构建并执行计算机病毒是轻而易举的。这导致 `Windows Script Host` 迅速被视为系统的一个重大损失。\n\
  \n在 `Windows Script Host` 相对失败后，微软决定他们需要转变方向，开始为用户提供一种管理命令行的新方法；一种能让 shell 真正具有价值的统一方式。大约是在那时，被称为\
  \ `Monad` 或 `Microsoft Shell`（微软壳）的 shell 开始问世。这些想法最早在 2002 年夏天就开始发表了。\n\n`Monad`\
  \ 是非常棒的，因为它完全是不同的东西。`Monad` 带来了一个极具扩展性的命令行——也就是说，你可以轻松地为其添加内容并使其执行你需要的任何任务——也就是说，在某种意义上，它是全功能的。我所指的“全功能”是指\
  \ `Monad` 承诺能够执行大量不同的行政职责。\n\n\n\n\n`Monad` 首次公开发于 2005 年夏天，并在随后的那年里进行了多次更新。2006\
  \ 年，微软推出并宣布 `Monad` 将更名为 `Windows PowerShell`。这在该项目的信誉度方面是一个巨大的推动，因为它使其成为了系统管理和通用信息技术工作的主要工具。`PowerShell`\
  \ 暗示了比 `Monad` 大得多的东西——`PowerShell` 暗示了力量。\n\n`PowerShell` 的第一个版本于 2007 年第一季度正式发布。在开发\
  \ `PowerShell` 第一版本的同时，`PowerShell` 2.0 版本的工作也开始了。`PowerShell` 2.0 版本于 2009 年夏天与\
  \ `Windows 7` 同时正式发布，并成为了其主要组成部分。在初始发布后不久，又发布了兼容早期版本 Windows 的版本。\n\n自 2009 年以来，`PowerShell`\
  \ 迈出的最大一步是成为开源并移植到多个不同的平台。2016 年夏天，`PowerShell` 的代码向世界发布供所有人查看，`Linux`、`CentOS`\
  \ 和 `macOS` 等其他操作系统的用户终于能够充分利用这个聪明的 shell 程序。\n\n所以到这里，你可能会问是什么让 `PowerShell` 与众不同。嗯，基本上有很多不同点。\n\
  \n第一也是最重要的一点是它与 `.NET Framework` 深度集成。如果你不知道 `Microsoft .NET` 是什么，它为语言之间的相互协作提供了一个基础设施，本质上是微软目前最重要的产品之一。那么它是如何与\
  \ `PowerShell` 集成的呢？嗯，你可以编写 `cmdlets`——使用 `.NET Framework` 语言编写的程序——这些程序实际上是为与 `PowerShell`\
  \ 工作而设计的。然而，`cmdlets` 的工作方式也不同。它们也可以从 `PowerShell` 中运行。因此，你不仅可以用 `.NET` 语言编写 `Cmdlets`，而且每当你使用\
  \ `PowerShell` 并在其中执行某些命令以完成不同任务的命令时，你实际上也在调用运行时设置的 `Cmdlets`。此外，`PowerShell` 中创建的每一个对象都是\
  \ `.NET` 对象，这意味着它将像 `.NET` 对象一样工作，具有其每一个方法和类属性。\n\n另一个不同之处是 `PowerShell` 实现了管道（pipeline）的概念。如果你曾经接触过\
  \ `Unix` 管道，那么你对它的工作原理可能有一个相当的了解。基本上，发生的情况是一个 `cmdlet` 的结果作为参数（或输入数据）传递给另一个 `cmdlet`。\n\
  \n也许让 `PowerShell` 脱颖而出并成为极佳工具的最后一点是其极其丰富的脚本语言。使用这种脚本语言，你可以自动化大量的不同的事情。这种脚本语言与 `Batch`\
  \ 等语言编写的脚本相比，实际上也非常强大。例如，它支持通用控制流，如循环和条件判断（稍后会介绍），允许人们捕获和抛出异常，并与 `.NET` 框架完全集成。\n\
  \n随着 `Windows Server 10` 越来越多地利用和集成它，对于从事信息技术工作的人来说，拥有 `PowerShell` 的知识正变得越来越重要。`PowerShell`\
  \ 的优点在于它是随 `Windows` 自动自带的，所以你不需要过多设置。但是，如果你有另一个操作系统，正如我所说的，`PowerShell` 是开源的，并且很可能适用于你正在使用的操作系统。\n\
  \n# 第 2 章\n\n## PowerShell 命令\n\n正如我之前提到的，`PowerShell` 最迷人的特征之一是它的 `cmdlets` 系统。确实，这个系统是它最重要且不可或的一部分之一。使用命令行\
  \ shell 的全部目的是让你直接与计算机、服务器、路由器或其他任何设备对话，并可能执行原本无法的操作。命令行仅仅作为你与计算机或硬件之间最直接的通信线路，而没有桌面层提供的抽象层。然而，这种高程度的控制也意味着高得的学习曲线。幸运的是，`PowerShell`\
  \ 让这并没有变得太困难。在我们深入之前，我认为有必要简要解释一下命令行是如何运作的。\n\n`PowerShell` 中的命令有两种形式：`cmdlets`\
  \ 和 `aliases`（别名）。`Aliases` 会执行其所属的 `cmdlet` 的操作，所以不用太担心它们之间的区别。`aliases` 存在是为了让习惯了如\
  \ `Unix Shell` 或旧版 Windows 命令行等其他 shell 的人们在使用。`cmdlets` 的方便之处在于，虽然其他 shell 命令倾向于使用非常古老或难以理解的名字，但\
  \ `cmdlet` 的名称遵循非常严格的顺序，这使得它们非常易读。\n\n总之，现在我将逐一介绍主要的 `cmdlets` 及其 `aliases`，并解释每一个。然而，请注意，由于\
  \ `cmdlets` 可以被创建的，而且 `PowerShell` 是一个与 `.NET` 深度集成的巨大程序，存在数百种不同的 `cmdlets`。在书中介绍每一个都是不实际的，因为你根本不需要它们中的每一个。我将做的只是为你提供那些最相关且你最可能需要的命令。\n\
  \n-   `Get-ChildItem` - 这个命令也可以通过 `gci`、`dir` 或 `ls` 输入。这个名字听起来可能有点奇怪，但如果你用过其他 shell，你就完全清楚这个命令的作用了。它的作用是查看你在硬盘中的所在位置，并列出该文件夹内的每一个文件和目录。\n\
  \n-   `Test-Connection` - 这个在其他系统中被称为 `ping`，但奇怪的是它在 `PowerShell` 中没有别名。它的作用是联系另一台机器并尝试获取响应。这可以帮助你判断两者是否通过互联网或其他方式建立了连接。这是一个非常实用的需要使用的\
  \ `cmdlet`。\n\n-   `Get-Content` - 这个在其他系统中被称为 `gc`、`type` 和 `cat`，你可以毫无问题的为它输入这些相同的别名。它的作用仅仅是获取文件的内容以便进行处理。\n\
  \n-   `Get-Command` - 如果你想查看所有可用的命令，只需使用此 `cmdlet`（或别名 `gcm`）。在 `PowerShell` 中输入此\
  \ cmdlet 后，你将看到一个极其长的命令列表，每条命令都执行一个独特且强大的功能来帮助你完成工作。如果你有时间和耐心，我敦促你使用 `Get-Command`\
  \ 并探索用它能做什么。\n\n-   `Get-Help` - 这是一个非常有用的命令。在旧的 Windows 命令行中，它被称为 `help`，在 `Unix`\
  \ shell 中被称为 `apropos` 和 `man`；`help` 和 `man` 是在 `PowerShell` 中可以使用的两个别名（如果你不想输入\
  \ `Get-Help` 的话）。这个命令的作用正正如其名——为指定的命令提供帮助。你只需要在名称后面说明你想获取帮助和详情的 `cmdlet`，例如：\n\n\
  ```\nGet-Help Get-Command\n```\n\n然而，如果你想了解使用该命令的其他方法，也可以直接输入 `Get-Help`。它实际上非常多功能，所以我鼓励你了解可以使用它的不同方式。\n\
  \n-   `Clear-Host` - 这个命令在 Windows 上被称为 `cls`，在 `Linux` 和 `Mac` 等 `Unix` 系统上被称为\
  \ `clear`，如果你不想完整输入 `Clear-Host`，可以输入其中任何一个。这个命令只是清除控制台并给你一个空白的画布。\n\n\n\n\n\n###\
  \ `Copy-Item`\n- 此命令正如其名称一样，直观易懂。在 Windows 命令行中，此命令被称为 `copy`，而在 Unix Shell 中，它被称为\
  \ `cp`。这两个术语都可以作为别名，`cpi` 一词也是如此。此命令允许你指定一个文件或目录，以及一个目标位置。使用该命令后，文件或目录将被复制到目标位置。这对于某些操作非常有用，例如为重要文件制作备份。\n\
  \n### `Move-Item`\n此命令在 Windows 命令行中被称为 `move`，在 Unix Shell 中被称为 `mv`。该命令在功能上与 `copy`\
  \ 命令相似。然而，它不是留下当前的文件和目录并创建它们的副本，而是将它们完全移动，它们将不再存在于当前位置。\n\n### `Remove-Item`\n此命令有许多名称，所以让我逐一列举一下可以使用的名称吧。在旧的\
  \ Windows 命令行中，此命令被称为 `del`、`erase`、`rmdir` 和 `rd`。在 Unix Shell 中，该命令被称为 `rmdir`\
  \ 和 `rm`。此命令的别名包含了上述所有名称，此外还有一个名称：`ri`。因此，你可以通过 `del`、`erase`、`rmdir`、`rd`、`rm`\
  \ 和 `ri` 来调用此命令。如果你以前从未被告知过，你需要对这个命令极其小心，因为它非常、非常强大。如果你不小心，可能会意外执行类似系统性删除整个硬盘的操作，那可不好好玩。使用此命令时要谨慎，诚实地说，随着你对它的了解，我建议你在运行\
  \ Linux 发行版的虚拟机中使用 Unix Shell 进行练习，这样就不会造成任何实际损坏。这个命令非常臭名昭著，所以我现在给你警告：如果你不小心，可能会用它出大错。\n\
  \n### `Rename-Item`\n此命令非常直观。它允许你重命名文件或目录。它也被别名 `mi`、`ren` 和 `mv` 所知。\n\n### `Get-Location`\n\
  此命令是另一个完全如其描述的命令——发现规律了吗？在旧的 Windows 命令行中，这被称为 `cd`，而在 Unix Shell 中被称为 `pwd`。这两者都可以作为别名使用，`gl`\
  \ 一词也是如此。此命令的作用仅仅是列出当前的工作目录。\n\n### `Push-Location`\n这个稍微复杂一点。它允许你在栈上保留一个运行中的目录列表。如果你不知道计算机科学中什么是栈（stack），栈本质上是一个可以用新值更新的数据列表。当你添加一个新值时，该值也必须是第一个被取的。如果你有值\
  \ `3`、`1` 和 `6`，并且你想添加值 `8`，那么你的栈看起来像这样：`3, 1, 6, 8`。这几秒后会更有意义，但它本质上是在存储位置而不是某个任意数值。无论在\
  \ Unix 还是 Windows 上，此命令一直被称为 `pushd`，而 PowerShell 使用的就是这个别名。\n\n### `Pop-Location`\n\
  这是 `push-location` 命令的对应项。它会将你的工作目录更改为最近添加到栈中的目录——可以说是从栈中“弹出”那个值。所以记住：你推入（push），然后弹出（pop）。这会将目录从栈中移除，所以如果你想让它留在那里，就必须再次添加到栈中。在\
  \ Windows 和 Unix 上，该命令一直是 `popd`，这也是 PowerShell 使用的命令。\n\n### `Set-Location`\n这绝对是通过命令行及任何类型的命令行\
  \ Shell 导航计算机最重要的命令之一。我真的无法强调这个命令的重要性有多大——它本质上是命令行导航的终极手段，知道如何正确使用它至关重要。它允许你更改硬盘上的位置。你可以输入硬盘上的某个特定位置（例如目录地址），或者直接命名你当前所在目录内的某个目录。（如果你不确定你所在的文件夹里具体有哪些目录，请确保你使用\
  \ `Get-ChildItem` 命令来列出这些目录。）在 Windows 和 Unix 命令行中，此命令一直被称为 `cd`。在 Windows 中也可以通过\
  \ `chdir` 一词进行引用。这两个术语都可以作为 `Get-ChildItem` 命令的别名。不过，如果你愿意，也可以使用 `sl` 一词。\n\n###\
  \ `Tee-Object`\n这与高尔夫球（golf）没有任何关系，如果你认为有，那你就太笨了。相反，此命令将给定的输入发送到文件或值，然后将其发送到管道（pipeline）。有时——但并非总是——这仅仅意味着输出流，即它将在你的命令行窗口中打印。然而，如果管道中还有下一个命令，它也可以传递给该命令。它的别名简单就是\
  \ `tee`，它对 Windows 来说是相对新的（在旧版本的命令行 Shell 中不存在）。\n\n### `Write-Output`\n此命令的作用正如它听起来的一样。它将给定的输出写入输出流（通常是控制台窗口）。该术语的别名有来自\
  \ Windows 和 Unix 命令行 Shell 的 `echo` 以及 `write`。\n\n### `Get-Process`\n此命令的作用几乎正如它描述的一样。它列出当前运行的所有进程（并在需要时杀死它们）？这也非常有用。在\
  \ Unix Shell 中，此命令被称为 `ps`，而在 Windows 中它被称为 `tasklist`。这两者都可以工作，`gps` 也是如此。\n\n\
  ### `Stop-Process`\n这就是我在上一段落中提到的命令。面对现实，有时程序会完全停止或不符合预期，或者你正在尝试连接一个被阻塞的端口，这时 `Stop-Process`\
  \ 就派上用场了。此命令一直被称为 `kill`，这个名称也作为别名存在。你也可以使用 `spps` 作为别名。\n\n### `Select-String`\n\
  这将给定文件或输入流中的字符串（如果你不知道字符串是什么，将在下一节介绍）返回到管道，通常是到输出流。它将返回字符串所在的整行，因此如果我在一个包含大量随机单词的文件上对\
  \ `pack` 进行字符串搜索，它不仅会返回 `pack`，还会返回 `backpack`、`unpack`、`repack` 等。此命令的唯一别名是 `sls`。\n\
  \n### `Set-Variable`\n此命令允许你创建变量或更改其值。（更多内容见下一节。）别名简单为 `sv` 和 `set`。\n\n### `Get-Member`\n\
  这是一个非常重要的命令，它允许你查看给定对象中的方法（methods）和值（values）。这现在可能没意义，但之后你会明白的。记住这个，你需要它的。\n\n\
  ### `Invoke-WebRequest`\n这一个将从互联网抓取数据并发送到管道。在 Unix Shell 中，此命令历史上被称为 `wget` 和 `curl`。在旧的\
  \ Windows 命令行中，该命令从未存在过。此命令的别名有 `curl`、`wget` 和 `iwr`。\n\n当然，这远不是所有的命令。这些只是你刚开始最可能用到的最相关、最重要的命令。\n\
  \n正如我之前所说，如果你想要一个更完整的列表，你还可以使用 `get-command` 命令来获取列表，并对任何你不完全理解的命令使用 `get-help`。\n\
  \n\n\n\n然而，这些只是基础。我们甚至还没有开始谈论函数。\n\n简单来说，函数就是被执行的任务和执行的操作。通常情况下，在 PowerShell 中，函数会返回一个值\
  \ - 但情况并非总是如此，有时它们只是向 shell 打印一个值，或者仅仅执行一些如文件系统操作的操作。\n\n虽然 `cmdlets`（命令）是 PowerShell\
  \ 的核心，但理解函数同样重要，它们将构成你 PowerShell 体验的很大一部分。\n\n现在，让我们进一步讨论一下编程和计算机科学的通用逻辑是如何进入 PowerShell\
  \ 的，从下一章开始。\n\n# 第 3 章：PowerShell 背后的编程逻辑\n\n正如我之前提到的，PowerShell 的一大吸引力之一是它带有一门功能完备的脚本语言。当我说功能完备时，我的意思是在很多方面，这种语言与\
  \ `Python` 和 `Lua` 等其他主流脚本语言一样强大。\n\n它之所以能如此功能完备且强大，是因为与 `.NET` 等内容紧密集成。当然，我确定你可能已经告诉我这一点。但这留下了另一个问题\
  \ - 这到底意味着什么？\n\nPowerShell 中的一切都是一个对象，确切地说，是一个 `.NET` 对象。一个对象的意义它是 `class`（类）或有时是\
  \ `namespace`（命名空间）的派生。那么这在实践中意味着什么？\n\n从编程的角度来看，`class` 是将不同属性组合在一起的方法（这现在可能还没意义），这样你就可以始终生成具有相同属性的东西。例如，每辆汽车都有特定数量的门、特定类型的发动机和特定的最高速度。`class`\
  \ 允许你将这些内在属性分组，并让汽车对象的每个实例都带有这些属性，尽管是以它们各自独特的方式。\n\n所有的汽车都可以行驶。“行驶”这一动作等同于 `function`（函数）。`function`\
  \ 是执行动作的东西，并且可能返回也不返回值。PowerShell 对函数的依赖程度不亚于对 `cmdlets`，每个 `cmdlet` 都只是一个附加了函数的对象。\n\
  \n你还可以创建带有自己的值和 `methods`（方法）的自定义对象。\n\n那么为什么这很重要呢？因为这些 `methods` 允许你在 PowerShell\
  \ 中实现比你意识到的多得多的高级操作。它们允许你操作数据，学习关于你正在处理的不同 `cmdlets` 和对象的各种知识。这非常重要。\n\n你在这里最需要理解的是，任何对象都是由定义它的东西。为对象定义的每一个属性和\
  \ `function` 都是使该对象成为该对象的内在部分。例如，正如我们讨论的，汽车有许多内在属性。为了让它是某辆车而不是另一辆，这些属性必须处于某种特定状态。这可能听起来没什么意义，但让我这样说：假设你有一辆银色的\
  \ 2004 年庞蒂亚 Grand Am（Pontiac Grand Am），行驶了 15 万英里。如果你改变了这些属性之一，突然你指的就不再是同一辆车了。这是因为每一辆汽车都具有这样的内在属性。每辆汽车都有颜色；每辆汽车都有生产年份；每辆汽车都有品牌和型号；每辆汽车都有特定的里程数。（即使里程数是\
  \ 0。）\n\n所以，如果我们在谈论这辆车，但指的是一辆红色的、行驶了 15 万英里的 2004 年庞蒂亚 Grand Am，那么我们谈论的完全是另一辆车 -\
  \ 红色的，而不是银色的。尽管字面上其他一切都相同，但该对象的这一个内在属性就定义了它作为一个独立的对象。\n\n因此，准确理解这些属性的含义以及如何获取它们非常重要。我们稍后会讨论这一点。现在，我们需要转向\
  \ PowerShell 的脚本方面，在那里事情将是自动化的。\n\n# 第 4 章：脚本\n\n所以，我们已经讨论了如何为 PowerShell 编写脚本以及它们可以执行的各种事情。在这里我们将进入许多编程类型背后的逻辑。\n\
  \n现在，由于 PowerShell 是构建在 `.NET Framework` 之上的，它在很多方面本质上是一门编程语言。这意味着我们与编程语言关联的某些事情\
  \ - 数据类型、值、变量、甚至程序逻辑 - 都可以以与其它编程语言相似的方式来理解。\n\n对你来说，作为一个（可能是）新程序员以及一个（可能是）PowerShell\
  \ 新手，这可能可能没有太大意义。实际上，它可能完全无法理解。但没关系 - 稍后你就明白了。我们只需要继续讨论这个话题，并从最基础的开始。\n\n我们需要讨论的第一件事是为什么创建脚本文件是必要的。通过创建脚本文件，你允许自己自动化许多原本无法实现的事情。你还允许某些事情的执行方式与简单打开\
  \ PowerShell 然后输入命令不同。\n\n这使得与批处理文件（batch files）略有不同。例如，在典型的命令行外壳的批处理文件中，你只需输入你平时会输入的命令即可。当然，有某些如\
  \ `GOTO` 之类的关键字可以使批处理文件多做一点，但它们在任何想象力范围内都不一定算复杂，特别是与像 PowerShell 脚本语言如此庞大的语言相比。\n\
  \n现在，不要会会我，PowerShell 脚本语言本身并不特别复杂 - 额，它是复杂的，并且对于你大多数需要执行的操作来说绰有余。然而，它远没有某些语言大。例如，`VBScript`\
  \ 有几百个不同的关键字可以使用。与之相比，PowerShell 大约有 24 个。这是一个非常明显的差异。\n\n然而，不要困惑。关键词的减少完全没有让它变得不强大，这门语言对于你关于命令行和任何形式自动化的每一项任务都绰绰有余。\n\
  \n无论如何，这里的重点是 PowerShell 极其强大，尽管它很精小。学会利用 PowerShell 的力量是完成你想要通过命令行完成的一切事情的关键。\n\
  \n那么，到底如何创建和运行这些 PowerShell 脚本呢？嗯，实际上相对简单。你只需要在任何给文本编辑器中启动一个文件，把代码放进去，然后将其命名为你想要的名称。唯一的陷阱是文件名扩展名必须是\
  \ ps1。所以如果你有一个名为 `cabbages` 的文件并想让它成为一个脚本，你就将其命名为 `cabbages.ps1`。易如反掌。\n\n你可以使用你喜欢的任何文本编辑器，真的。即使是记事本也可以。我个人觉得我必须推荐\
  \ `Atom.io`，因为它是一个非常强大的文本编辑器。它的理由有很多。第一个是它是完全免费的。第二个是它是扩展的 - 你可以获取很多插件让你的生活和编程变得更容易。第三是考虑到它是免费的，它看起来真的很漂亮，而且运行得非常出色。我无法对\
  \ Atom 给出更热烈的评价语了。然而，如果你愿意，你甚至可以使用 `Emacs`、`Vim`、`Notepad++` 或 `Sublime Text`。只要它能生成纯文本文件即可。\n\
  \n现在我们需要讨论实际的程序逻辑。我想进入这一切最简单的方法就是从制作我们的第一个程序开始。打开你的文本编辑器。接下来，在其中编写以下内容：\n\n\n\n\n\
  ## PowerShell 基础\n\n```powershell\nWrite-Output “Hello world”\n```\n\n然后将其保存为 `hello.ps1`，可以放在你任何想要的地方。接下来，你可以进入该位置，右键点击并选择`用\
  \ PowerShell 运行`，或者你可以尝试更复杂的操作（这种方法更好而且结果也更好）。\n\n打开开始菜单，在搜索栏中输入 `PowerShell`。右键点击显示\
  \ `PowerShell ISE (x86)` 的版本。然后点击`以管理员身份运行`。在那里，你将看到一个更大版本的 PowerShell，它有更多的选项以及一个充满满信息的侧边栏。你需要输入以下内容：\n\
  \n```powershell\nSet-ExecutionPolicy RemoteSigned\n```\n\n然后按回车键。这将使得你的用户账户获得执行脚本的权限。接着，导航到你保存文件的地方。正如我所说，`cd`\
  \ 和 `ls` 是你的朋友。如果你需要返回上一级目录，输入 `..`，这会带你向上移动一层。如果你需要知道当前目录下有哪些文件夹，使用 `ls`，它会列出所有文件夹。继续寻找，直到找到\
  \ `hello.ps1`。\n\n一旦找到了它，你需要输入以下命令来执行：\n\n```powershell\n.\\hello.ps1\n```\n\n然后按回车键。你应该会看到框里弹出一个小的\
  \ `hello world`。这不令人兴奋吗？你的第一个脚本！\n\n### 值与变量\n\n现在我们需要处理一些稍微复杂的概念，例如值和变量。什么是值（values）？我们已经讨论过很多关于值，但它们到底意味着什么？嗯，我们根据上下文通过它们的实际名称来指代值。我们稍后会讨论这些，但在编写代码方面，我们首先真正需要讨论的是什么是值。\n\
  \n我确定你知道，一个值是以某种形式存在的数据片段。例如，当我们询问房子或汽车的价值时，我们经常在谈论价值。在计算机编程中，值简单地指的是自立存在的数据。根据其内容的不同，值可以是多种类型和种类。\n\
  \n作为参考，这里是 PowerShell 脚本中主要的数值类型：\n\n| 名称 | 描述 |\n| :--- | :--- |\n| Array (数组)\
  \ | 组合在一起的不同值的集合 |\n| Bool (布尔) | 一种非真即假的数据类型 |\n| DateTime (日期/时间) | 存储有关日期和时间信息的数据类型\
  \ |\n| Float (浮点数) | 存储小数的数据类型，在计算机科学中称为浮点数 |\n| Guid (全局唯一标识符) | 存储全局唯一 ID 的类型\
  \ |\n| HashTable (哈希表) | 类似于字典（如果你用过任何 Python 或 Java 的话）。它是一个连接到值的键表。它们以某种内在的方式连接——每个键都链接到一个特定的值\
  \ |\n| Int (整数) | 整数——本质上是全数字 |\n| PsObject (PowerShell 对象) | 自定义的 PowerShell 对象\
  \ |\n| Regex (正则表达式) | 存储正则表达式 |\n| ScriptBlock (脚本块) | 这种类型的数据内部包含一个脚本 |\n| String\
  \ (字符串) | 一种由多个连接在一起的文本组成的数据类型，如“Hello”或“你好？” |\n\n在编程中，每一个持有值的实体都有其特定的数据类型。值存储在被称为变量（variables）的实体中。变量是允许你随意保留和更改值而不会丢失它们的东西。这样，你就不需要重复输入相同的内容，也不需要手动在程序中完成所有的数学计算。\n\
  \n在过去，你通常必须显式地说明每个值的数据类型。例如，在 C 编程语言中，你每创建一个变量都必须输入变量的类型，而且还必须给函数指定类型。（关于函数或`方法`，稍后会详细介绍）\n\
  \n然而，当你使用像 PowerShell 等现代语言编写脚本时，这不再是必要的。某些语言故意保留了这种功能，但大多数现代语言并没有。这两者之间的区别被称为隐式类型与显式类型类型。\n\
  \n无论如何，当你决定要存储一个值时，你需要执行所谓的声明变量。\n\n在 PowerShell 中，这与在 Perl 中声明变量有些相似，但处理起来要少痛苦得多。要在\
  \ PowerShell 中声明任何类型的变量，你只需要放一个美元符号（`$`），然后是变量的名称——从技术上讲可以是任何内容，只要周围有括号甚至可以包含空格，但最佳实践建议不要这样做——最后是变量的值，如下所示：\n\
  \n```powershell\n$name = 'Joseph'\n```\n\n通过这种方式，我们创建了一个数据类型为 `string` 的变量，这意味着它是字符序列。在这个变量内部，我们存储了读取为“Joseph”的字符字符串值。我们现在可以将其整合到其他代码中。创建一个新文件，随你喜欢命名，并输入以下内容：\n\
  \n```powershell\n$name = 'Joseph'\nWrite-Output “Your name is $name?”\n```\n\n然后保存并尝试运行它。它应该显示“Your\
  \ name is Joseph?”。这是我们在 PowerShell 脚本中使用和操作变量的第一个例子。还会有很多，但这是第一个重大的例子。\n\n### 数学运算符\n\
  \n现在让我们来处理其他类型。去创建两个变量：\n\n```powershell\n$varOne = 3\n$varTwo = 5\n$varThree =\
  \ $varOne + $varTwo\nWrite-Output “The sum is $varThree”\n```\n\n理想情况下，它应该打印 3 +\
  \ 5 = 8。现在我们尝试减法：\n\n```powershell\n$varThree = $varOne - $varTwo\nWrite-Output\
  \ “The difference is $varThree”\n```\n\n它应该打印 3 - 5 = -2。现在我们尝试乘法：\n\n```powershell\n\
  $varThree = $varOne * $varTwo\nWrite-Output “The product is $varThree”\n```\n\n\
  它应该打印 3 * 5 = 15。现在我们尝试除法。注意 PowerShell 除法默认返回 `float`：\n\n```powershell\n$varThree\
  \ = $varOne / $varTwo\nWrite-Output “The result is $varThree”\n```\n\n它应该打印 3 /\
  \ 5 = 0.6。最后，我们尝试取模运算符：\n\n```powershell\n$varThree = $varOne % $varTwo\nWrite-Output\
  \ “The remainder is $varThree”\n```\n\n它应该打印 3 % 5 = 3。\n\n这些是核心的 PowerShell 数学运算符。理解这些内容至关重要，因为数学是你编写的大多数脚本的重要组成部分。即使它们只是执行像筛选结果之类的简单操作，你仍然需要数学，因为你需要遍历序列。\n\
  \n### 控制流\n\n现在是时候进入一些有趣的内容了：控制流。控制流是任何程序的极其部分，对你的脚本来说尤其如此。控制流有两个主要部分：条件和循环。它们都依赖于你可以对数据集进行比较并判断某事是否真实，因此在深入这些内容之前，我们将先讨论一下布尔值。\n\
  \n布尔值的概念非常简单。布尔简单地指代给定事物的真或假。这意味着一个布尔值可以为真或假，取决于各种条件，但它永远只可能是真或假之一。\n\n\n\n\nPowerShell\
  \ 的布尔值设置非常、非常简单。在很多方面，它让人想起 C 时代的旧式布尔处理方式，当时布尔值字面上量就是 1 或 0，1 表示真（true），0 表示假（false）。在某些情况下，这仍然是事实。例如，如果你检查字符串“false”在布尔意义上是否真的为假，它将是为真，因为其拥有一个非\
  \ 0 的值（因为它是一个非空字符串）。如你所见，它有点反复无常。然而，其底层的逻辑非常简单。此外，PowerShell 为 `$true` 和 `$false`\
  \ 预定义了变量，当你尝试判断某个值是否为真时，它会自动定义这些值。\n\n现在，我们要开始讨论布尔比较，或者布尔表达式。通过这些表达式，你可以比较一个值和另一个值，并对该陈述是否真实做出合理的判断。在\
  \ PowerShell 中，这实际上像许多事情一样非常简单。\n\n这些背后的逻辑实际上相对简单。回想一下高中或大学解决代数不等式的时光。还记得那些孤立的方程是如何试图让你解决图上哪些部分可以、哪些不能存在，然后指出它们的吗？布尔表达式的逻辑比较在设置方式上实际上相当简单。\n\
  \nPowerShell 中有许多不同的比较运算符。它们都有自己独特的用途，并且在某些情况下是比较的最佳选择。以下是比较运算符及其含义。\n\n| 运算符 |\
  \  |\n| :--- | :--- |\n| `-eq` | 检查两个值是否相等。 |\n| `-ne` | 检查两个值是否不等。 |\n| `-gt` |\
  \ 检查左侧值是否大于右侧。 |\n| `-lt` | 检查左侧值是否小于右侧。 |\n| `-ge` | 检查左侧大于或等于右侧。 |\n| `-le` |\
  \ 检查左侧小于或等于右侧。 |\n| `-like` | 检查是否存在文本匹配。 |\n| | “Meep”-like “*ep”）将为真。 |\n| `-notlike`\
  \ | 检查是否存在文本通配符匹配。 |\n| `-match` | 检查一个字符串是否匹配另一个字符串的部分。 |\n| `-notmatch` | match\
  \ 的反反。 |\n| `-contains` | 检查某个值集合是否包含特定的值。 |\n| `-notcontains` | contains 的反反。 |\n\
  | `-in` | 检查一个值是否在另一个值集合中。 |\n| `-notin` | 检查一个值是否不在给定的值集合中。 |\n\n如你所见，这里的想法相对简单。你所做的只是比较两个（或多个）值，并评估某事是否为真。\n\
  \n继续下去，当你开始布尔比较时，会返回一个固有的真或假。这种真实性可以被用来做出更大的决策。\n\n那么，在这里可以做出什么样的决策呢？嗯，这就是我们进入所有这些内容的第一个主要部分。我们可以使用这些真或假的陈述来做出决策。这被称为使用条件语句。\n\
  \n想一想。我们一直都在外面比较事物——无论是有形的物体还是不可改变的事件——然后根据此做出决策。例如，“如果今晚下雨，我就不去公园散步了。”如果我们这样说，那么我们要做的就是等到那个晚上，检查是否在下雨，如果没下雨就去公园，如果下雨就呆在家里。决策无处不在，我们一直在这样做。\n\
  \n那么，我们如何将这种决策机制纳入我们的编程和脚本编写中呢？嗯，实际上它相当简单！\n\n假设我们有一个名为 `$apples` 的变量，它的值为 1。嗯，假设我们想要脚本查看\
  \ `$apples` 的值，如果它是 1，就打印“我有一个苹果。”这非常简单！\n\n`if` 语句的语法如下：\n\n```powershell\nif (condition)\
  \ {\n    ... 在此处编写代码\n}\n```\n\n条件是 `$apples` 是否等于 1，所以我们只需检查该项。\n\n```powershell\n\
  $apples = 1\nif ($apples -eq 1) {\n    Write-Output “I have one apple.”\n}\n```\n\
  \n然而，你可能会发现这缺乏细微的差别。毕竟，如果我们没有苹果呢？如果我们有两个苹果，或者一个苹果也没有？显然，我们不能对所有这些情况说同样的话，因为语法将是不正确的！那是完全不可想象的。所以显然，我们必须考虑到这些情况。这就是\
  \ `elseif` 和 `else` 语句派上用场的地方。它们附加到你的 `if` 语句上。注意，对于逻辑控制流，这两者都不是必需，但它们确实可以帮助你在程序中做出决策。它们允许当事情不满足第一个条件时，更紧密地控制发生的情况。\n\
  \n如果你只有一个 `if` 和 `else` 语句，那么 `if` 语句中的条件将被测试；如果它是真的，将执行 `if` 语句中的内容。如果它不是真的，将执行\
  \ `else` 语句中的内容。`else if` 语句仅允许你在已经在测试的任何基础上额外测试另一个条件；如果第一个条件失败，它将移动到 `else if`\
  \ 语句提到的第二个条件。\n\n所以，如果我们想测试我们是否有 1 个苹果、多于 1 个苹果或 0 个苹果，那么我们希望 1 个苹果作为我们的 `if` 条件，0\
  \ 个苹果作为 `else if` 条件（因为这是一个特定条件），然后多于 1 个苹果作为我们的 `else` 条件（因为任何不是 1 或 0 的情况都会满足它）。这里大约是这样工作的：\n\
  \n```powershell\nif ($apples -eq 1) {\n    Write-Output “I have one apple.”\n} elseif\
  \ ($apples -eq 0) {\n    Write-Output “I don’t have an apple.”\n} else {\n    Write-Output\
  \ “I have more than one apple!”\n}\n```\n\n到此为止，你已经知道了条件语句的基础知识。现在我们需要讨论控制流的另一个主要方面：循环。\n\
  \n我们将讨论的第一个循环是 `for` 循环。`for` 循环旨在让用户迭代一个集合直到满足某个条件。条件在定义 `for` 循环时定义。`for` 循环有三个部分：初始化、结束条件和增量步。\n\
  \n假设我们想从 1 计数到 10。（请记住 `++` 和 `--` 分别表示“增加一”或“减少一”。）这大致是 `for` 循环的样子：\n\n```powershell\n\
  For ($i=1; $i -le 10; $i++) {\n    Write-Output “$i”\n}\n```\n\n如果你将此放入脚本并运行，它将从\
  \ 1 计数到 10。\n\n还有 `while` 和 `do while` 循环。两者唯一的区别是，`do while` 循环至少执行一次，然后在之后检查条件并在条件满足时执行。`while`\
  \ 循环在条件满足时一直执行，但前提是该条件开始时必须为真。\n\n`do while` 循环的设置如下：\n\n```powershell\nDo {\n}\n\
  While (condition)\n```\n\n而 `while` 循环的设置如下：\n\n```powershell\nWhile (condition)\
  \ {\n}\n```\n\n现在，假设我们想用 `while` 循环从 1 计数到 10。这种设置会有点不同。由于我们不是在循环的初始化内部迭代，我们必须在循环内部进行迭代。\n\
  \n让我们谈谈循环的逻辑。我们希望只要我们的迭代变量（再次说是 `$i`）小于或等于 10，就执行循环。所以只要它小于或等于 10，循环就会继续。如果它达到 11，循环就会终止。\n\
  \n我们必须做的第一件事是在循环之前创建变量，否则值将在每次循环迭代时重置，且循环永远不会终止。\n\n```powershell\n$i = 1\nWhile\
  \ ($i -le 10) {\n    $i++\n}\n```\n\n\n\n\n现在，在循环内部，我们必须打印 `i` 的当前值，当然，我们还需要每次循环都增加\
  \ `i` 的值。否则，`i` 将保持不变，循环也就无法终止。\n\n```powershell\n$i = 1\n\nWhile ($i -le 10) {\n\
  \    Write-Output “$i”\n    $i++\n}\n```\n\n现在，如果你将这些代码保存为脚本并运行，它将从 1 计数到 10。通过此，你已经理解了\
  \ PowerShell 脚本中控制流最基础的知识。这是一项极具价值的技能，了解它的工作原理将极大帮助你实现自动化任务并提升你的 Windows 体验。\n\n\
  在涵盖了脚本基础和编程逻辑之后，我们书中真正需要涵盖的最后一个内容是关于格式化和过滤的高级概念，这能够让你的脚本提升一个层阶。\n\n# 第 5 章：进阶 -\
  \ 过滤与格式化\n\n你将做的很多工作都是解析数据。出于这个原因，我决定用本书的一小部分来介绍解析数据的过程。\n\n## 过滤集合\n\n我们要讨论的第一点是过滤集合。这对于从各种来源解析信息至关重要。通常，当你接收系统信息时，它们会以对象集合的形式存在。了解如何拆解输入给你的信息极其重要，因为只有这样你才能获取你所寻找的核心内容。\n\
  \n例如，如果你查询任何特定进程的数据，你会得到很多毫无意义的废话，并没有什么用。在大多数情况下，你无法利用这些数据整理出任何真正实用的东西。然而，如果你花时间学习如何从给定集合中过滤信息，你就可以轻松地拆解所有内容。\n\
  \n不过，PowerShell 非常方便的一点在于，它让这个过程变得极其简单。或者至少在相对意义上是简单的。例如，有很多内置的 `cmdlets` 可以帮助你完成任何所需的操作。\n\
  \n其中最著名的是 `where-object`。事实上，如果你发现自己正在与其他 PowerShell 脚本编写者或开发者交流，你可能会经常听到他们谈论它。\n\
  \n我们之前讨论过 PowerShell 中的一切都是一个对象，因为 PowerShell 是基于 `.NET Framework` 的。因此，每个对象都有一组内在值和数据，称为\
  \ `properties`（属性）。我们还讨论过这些 `properties` 是可变形的，可以根据对象以及对其执行的操作而改变，以及这些 `properties`\
  \ 是对象本身固有的内在属性。考虑到这一切，既然这些内在且本质定义的属性存在，那么一定有一种方法可以通过某些标准来过滤对象，对吧？\n\n嗯，是的。这正是 `Where-Object`\
  \ cmdlet 所实现的功能。`Where-Object` cmdlet 会查看另一个 cmdlet 返回的特定集合，然后允许你根据不同的指定标准对该集合进行筛选。\n\
  \n## 管道 (Pipeline)\n\n在继续之前，我们需要简要介绍一下管道（pipeline）的概念。我们在书的开头稍微提到过它，但范围远不及现在要讨论的广。当我们之前简要触及它时，只讨论了管道在技术上能够做什么——将信息从一个地方传递到另一个地方，直到它最终到达终点（通常是输出流）。当然，这些很好，但并没有真正解释这里发生了什么。\n\
  \n在上一章中，我们讨论了函数如何返回一个特定值，以及 `cmdlets` 如何总是返回一个特定的对象。因此，我们可以理解为这种设计字面意义就像一个管道。你放入一个对象，它穿过整个管道，直到从另一端出来。\n\
  \n然而，在 PowerShell 管道中，你实际上可以让你放入管道的东西在沿途中进行一些必要的停靠。这些停靠可以改变你放入的东西的值、输出关于它的信息、报告诊断，基本上可以做各种不同的事情。最后，你的对象将带上你所寻找的所有相关信息出来。\n\
  \n为了在管道中指定一个“停靠”，并在对象从另一端出来之前将其传输到新处理过程中，你只需要输入一个竖线字符：`|`\n\n一旦解释清楚并且你开始理解，这一切都非常简单，但如果你发现完全理解管道概念是如何运作的需要费费一点精力，请不要感到沮丧。起初可能会有点复杂。基本上，只需记住，在\
  \ PowerShell 指令中执行的第一条命令（或脚本中的一行）中，你正在生成一个对象（或对象集合），你可以实际上将其传递并对其执行过程。\n\n## 实际过滤\n\
  \n这在过滤方面意味着什么？嗯，这意味着我们首先得有一个想要传递给过滤器的东西。为了解释这一点，假设我们想要过滤 `Get-Process` cmdlet 的结果，正如我们之前讨论过的，它返回当前计算机上运行的所有进程。现在，我们的语句看起来像这样：\n\
  \n```powershell\nGet-Process\n```\n\n现在，在我们过滤之前，让我们看看我们实际上可以根据什么来过滤它。这种方法很简单。使用\
  \ `Get-Member` cmdlet 来返回对象的成员，即包含在对象中的方法和属性。现在，我们不能只运行 `Get-Member`。我们在这里需要的是运行\
  \ `Get-Process`，将其通过管道传递给 `Get-Member`。在这种情况下，你会在 PowerShell 中输入：\n\n```powershell\n\
  Get-Process | Get-Member\n```\n\n然后按回车。结果将类似于：\n\n| Name | MemberType | Definition\
  \ |\n| :--- | :--- | :--- |\n| Handles | AliasProperty | Handles = Handlecount |\n\
  | Name | AliasProperty | Name = ProcessName |\n| NPM | AliasProperty | NPM = NonpagedSystemMemory64\
  \ |\n| PM | AliasProperty | PM = PagedMemorySize64 |\n| SI | AliasProperty | SI\
  \ = SessionId |\n| VM | AliasProperty | VM = VirtualMemorySize64 |\n| WS | AliasProperty\
  \ | WS = WorkingSet64 |\n| Disposed | Event | System.EventHandler Disposed(System.Object,\
  \ Sy... |\n| ErrorDataReceived | Event | System.Diagnostics.DataReceivedEventHandler\
  \ Er... |\n| Exited | Event | System.EventHandler Exited(System.Object, Syst...\
  \ |\n| OutputDataReceived | Event | System.Diagnostics.DataReceivedEventHandler\
  \ Ou... |\n| BeginErrorReadLine | Method | void BeginErrorReadLine() |\n| BeginOutputReadLine\
  \ | Method | void BeginOutputReadLine() |\n| CancelErrorRead | Method | void CancelErrorRead()\
  \ |\n| CancelOutputRead | Method | void CancelOutputRead() |\n| Close | Method |\
  \ void Close() |\n| CloseMainWindow | Method | bool CloseMainWindow() |\n| CreateObjRef\
  \ | Method | System.Runtime.Remoting.ObjRef CreateObjRef(ty... |\n| Dispose | Method\
  \ | void Dispose(), void IDisposable.Dispose() |\n| Equals | Method | bool Equals(System.Object\
  \ obj) |\n| GetHashCode | Method | int GetHashCode() |\n| GetLifetimeService | Method\
  \ | System.Object GetLifetimeService() |\n| GetType | Method | type GetType() |\n\
  | InitializeLifetimeService | Method | System.Object InitializeLifetimeService()\
  \ |\n| Kill | Method | void Kill() |\n| Refresh | Method | void Refresh() |\n| Start\
  \ | Method | bool Start() |\n| ToString | Method | string ToString() |\n\n\n\n\n\
  \n| WaitForExit | Method | `bool WaitForExit(int milliseconds), void WaitF...` |\n\
  | :--- | :--- | :--- |\n| WaitForInputIdle | Method | `bool WaitForInputIdle(int\
  \ milliseconds), bool ...` |\n| __NounName | NoteProperty | `string __NounName=Process`\
  \ |\n| BasePriority | Property | `int BasePriority {get;}` |\n| Container | Property\
  \ | `System.ComponentModel.IContainer Container {get;}` |\n| EnableRaisingEvents\
  \ | Property | `bool EnableRaisingEvents {get;set;}` |\n| ExitCode | Property |\
  \ `int ExitCode {get;}` |\n| ExitTime | Property | `datetime ExitTime {get;}` |\n\
  | Handle | Property | `System.IntPtr Handle {get;}` |\n| [...] | | |\n\n正如你所看到的，这些信息非常多——但这仍然远低于我们使用\
  \ `Get-Member` 方法时返回的值的一半。因此，我们可以推断，技术上我们有很多可以进行排序的项目。但让我们通过运行“Get-Process”来查看实际相关的信息。\n\
  \n在我的情况下，返回的列表大致如下：\n\n| Handles | NPM(K) | PM(K) | WS(K) | CPU(s) | Id | SI | ProcessName\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 260 | 24 | 10016\
  \ | 16964 | 280.23 | 4868 | 1 | A6100 |\n| 331 | 27 | 6028 | 16352 | 3.22 | 3128\
  \ | 0 | AgentSvc |\n| 195 | 20 | 3448 | 10636 | 30.19 | 2896 | 0 | AppleMobileDeviceService\
  \ |\n| 287 | 17 | 10192 | 19108 | 1.38 | 10712 | 1 | ApplicationFrameHost |\n| 790\
  \ | 14 | 15924 | 16992 | 189.20 | 13564 | 0 | audiodg |\n| 257 | 19 | 4840 | 15764\
  \ | 5.59 | 7336 | 1 | BrccMCtl |\n| 183 | 14 | 2128 | 11012 | 0.16 | 9208 | 1 |\
  \ BrMfcWnd |\n| 195 | 14 | 2504 | 9320 | 0.17 | 7688 | 1 | BrMfimon |\n| 329 | 15\
  \ | 3960 | 15248 | 0.30 | 6740 | 1 | browser_broker |\n| 3444 | 116 | 344248 | 214400\
  \ | 2,025.42 | 2712 | 1 | chrome |\n| 92 | 8 | 1432 | 524 | 0.94 | 7216 | 0 | conhost\
  \ |\n| 718 | 25 | 2748 | 9148 | 104.48 | 340 | 1 | csrss |\n| 145 | 11 | 1876 |\
  \ 6472 | 0.11 | 2932 | 0 | dirmngr |\n| 416 | 64 | 112724 | 92668 | 101.88 | 11528\
  \ | 1 | Discord |\n| 163 | 9 | 2716 | 9600 | 0.66 | 14880 | 1 | dllhost |\n| 602\
  \ | 43 | 77564 | 42544 | 2,435.56 | 1304 | 1 | dwm |\n| 142 | 12 | 3028 | 9448 |\
  \ 0.78 | 8852 | 1 | E_YATINBE |\n| 233 | 21 | 2936 | 11200 | 0.36 | 8752 | 1 | EEventManager\
  \ |\n| [...] | | | | | | | |\n\n显然，这个列表已经大幅简化了，但你可以获取其中包含的基本信息。基本上，列表中的进程是根据程序使用的句柄数、非分页内存、分页内存、工作集大小、CPU\
  \ 使用率、虚拟 ID 和会话 ID（SI）等项目进行过滤的。\n\n假设我们想查看当前运行的进程中哪些进程的会话 ID（session ID）为 1。这相对简单。首先，你需要理解\
  \ `Where-Object` 命令的语法。（哦，顺便说一下，PowerShell 程序员几乎从不调用或输入 `Where-Object`，绝大多数情况下选择使用它的别名。）\n\
  \n无论如何，回到语法，`Where-Object` 的语法如下：\n\n```\nWhere-Object { condition }\n```\n\n它将根据指定条件不满足的情况输出相关数据。所以让我们花点时间看这个。我们知道\
  \ `Get-Process` 返回的结果包含很多成员。让我们找找哪一个代表会话 ID（Session ID）。由于它是组织过的，这应该非常简单。\n\n```powershell\n\
  Get-Process | Where-Object {$_.SessionId -eq 1}\n```\n\n\n\n\n然后将其传递到管道中的 `Format-List`\
  \ 词小句：\n\n```powershell\nGet-Process | Where-Object {$_.SessionId -eq 1} | Format-List\n\
  ```\n\n但我们还没有结束，我们必须对列表进行排序，并根据之前指定的属性创建它。为此，我们需要初始化 `-Property` 参数，然后按照之前指定的属性进行排序，如下所示：\n\
  \n```powershell\nGet-Process | Where-Object {$_.SessionId -eq 1} | Format-List -Property\
  \ name,ID,StartTime\n```\n\n这将产生以下结果：\n\n| Name | : A6100 |\n| Id | : 4868 |\n|\
  \ StartTime | : 5/31/2017 7:51:44 PM |\n| Name | : ApplicationFrameHost |\n| Id\
  \ | : 10712 |\n| StartTime | : 5/31/2017 8:34:03 PM |\n| Name | : BrccMCtl |\n|\
  \ Id | : 7336 |\n| StartTime | : 5/31/2017 7:52:31 PM |\n| Name | : BrMfcWnd |\n\
  | Id | : 9208 |\n| StartTime | : 5/31/2017 7:52:30 PM |\n\n表格的格式化方法完全相同，但使用的是 `Format-Table`\
  \ 词小句。如果我们输入 `Format-Table` 而不是 `Format-List`，将产生如下结果：\n\n| Name | Id | StartTime\
  \ |\n| ---- | -- | --------- |\n| A6100 | 4868 | 5/31/2017 7:51:44 PM |\n| ApplicationFrameHost\
  \ | 10712 | 5/31/2017 8:34:03 PM |\n| BrccMCtl | 7336 | 5/31/2017 7:52:31 PM |\n\
  | BrMfcWnd | 9208 | 5/31/2017 7:52:30 PM |\n| BrMfimon | 688 | 5/31/2017 7:52:31\
  \ PM |\n| browser_broker | 6740 | 5/31/2017 8:34:04 PM |\n| chrome | 2712 | 5/31/2017\
  \ 7:54:16 PM |\n| conhost | 5220 | 5/31/2017 7:51:41 PM |\n| csrss | 340 | 5/31/2017\
  \ 7:48:48 PM |\n| Discord | 11528 | 5/31/2017 9:17:38 PM |\n| dllhost | 14880 |\
  \ 5/31/2017 8:27:16 PM |\n| dwm | 1304 | 5/31/2017 7:48:50 PM |\n\n到此为止，你已经知道了如何在\
  \ PowerShell 中对信息集进行排序、过滤和格式化，这是一个非常实用的功能，我确定你会乐意学到它的。\n\n# 第 6 章\n\n## PowerShell\
  \ 术语\n\n涉及 PowerShell 的术语可能会让人有点困惑。事实上，你可能就像迷失在由不同计算机术语组成的“字母汤”中一样。别担心！在这里，我尝试汇总了书中书中重要重要术语，这样你就能准确理解你所看到的内容，以防你需要回去重新阅读某些内容。\n\
  \n| 术语 | 含义 |\n| :--- | :--- |\n| Cmdlet (词小句) | 在 PowerShell 中执行的各种命令的名称。始终返回一个对象。\
  \ |\n| Directory (目录) | “文件夹”的另一种术语。 |\n| Method (方法或函数) | 以相同方式执行操作的代码，可能接受参数也可能不接受。\
  \ |\n| .NET Framework | PowerShell 以及 VB.Net 和 C# 均构建的框架。 |\n| Object (对象) | 类的实例；具有方法和属性等内在性质的东西。\
  \ |\n| Property (属性) | 存储有值的东西——想想汽车的颜色、汽车的轮胎数量等。这些都是汽车的属性。 |\n| Working Directory\
  \ (工作目录) | 你当前驱动器所在的文件夹。 |\n\n# 结语\n\n感谢你读到 PowerShell 的最后，希望它对你有所益处，并能为你提供实现目标（无论目标是什么）所需的所有工具。\n\
  \n下一步是开始使用你在书中学到的技能并将其投入善用，自动化你的计算机，并从命令行执行各种你以前不知道可以做到的事情。\n\n诚实地说，书中的信息只能带你入门——这就是一本初级书籍能做的全部了。我的朋友，需要你自己去实验和研究，让你从一个了解\
  \ PowerShell 和脚本基础知识的人变成一个牢牢掌握所需一切技能的人。我无法变得过于具体的原因是因为我正试图涵盖得宽泛一些，以便你理解背后的概念。\n"
