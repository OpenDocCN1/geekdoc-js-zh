- "# Powerhell：精通 PowerShell (Windows Powershell 5, PowerShell 脚本编写、命令行、Javascript、C++,\
  \ SQL)\n\n\n\n![](img/cover.jpeg)\n\n\n\n## 目录\n- 引言\n- 第 1 章：什么是 PowerShell？\n\
