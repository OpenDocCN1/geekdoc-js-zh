    假设我们想查看当前运行的进程中哪些进程的会话 ID（session ID）为 1。这相对简单。首先，你需要理解 `Where-Object` 命令的语法。（哦，顺便说一下，PowerShell
    程序员几乎从不调用或输入 `Where-Object`，绝大多数情况下选择使用它的别名。）


    无论如何，回到语法，`Where-Object` 的语法如下：


    ```

    Where-Object { condition }

    ```


    它将根据指定条件不满足的情况输出相关数据。所以让我们花点时间看这个。我们知道 `Get-Process` 返回的结果包含很多成员。让我们找找哪一个代表会话
    ID（Session ID）。由于它是组织过的，这应该非常简单。


    ```powershell

    Get-Process | Where-Object {$_.SessionId -eq 1}

    ```


