    \ that with the first command you execute in a PowerShell directive (or a line\
    \ in a script), you are generating an object (or a collection of objects) that\
    \ you can actually pass along and perform procedures upon.\n\n## Practical Filtering\n\
    \nWhat does this mean in terms of filtering? Well, it means that first we have\
