    \ exactly what the `Where-Object` cmdlet does. The `Where-Object` cmdlet will\
    \ look at a certain collection as given back by another cmdlet and then allow\
    \ you to sift through the collection according to certain different specified\
    \ criteria.\n\n## The Pipeline\n\nBefore we go on with this, we need to talk briefly\
    \ about the idea of the pipeline. We talked about it a little bit earlier in the\
    \ book, but not nearly in the same scope as we’re about to. When we touched on\
    \ it briefly earlier, we only talked about what the pipeline is technically capable\
    \ of - the passing of information from one thing to another until it eventually\
    \ lands at its end location, generally the output stream. That’s all well and\
    \ good, of course, but that doesn’t really explain what’s going on here.\n\nIn\
    \ the last chapter, we talked about how functions are able to return a given value,\
    \ and how `cmdlets` always return a given object as well. So with that being said,\
    \ we can understand that this is designed to be quite literally like a pipeline.\
    \ You put an object in, it goes through and through the pipeline until it comes\
    \ out the other end.\n\nHowever, in the PowerShell pipeline, you can actually\
    \ have the thing that you put in the pipe make some necessary stops along the\
    \ way. These stops can change the value of the thing that you put in it, output\
    \ information about it, report diagnostics, do all sorts of different things basically.\
    \ Then, in the end, your object would come out with all of the relevant information\
    \ that you were looking for.\n\nIn order to designate a “stop” in the pipeline\
    \ and the transferring of an object to a new process before it comes out the other\
    \ end, you simply need to type a vertical line character: `|`\n\nThis is all very\
    \ simple once it’s been explained and you start to understand, but don’t feel\
