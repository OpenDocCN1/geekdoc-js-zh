    | Name | : BrMfcWnd |

    | Id | : 9208 |

    | StartTime | : 5/31/2017 7:52:30 PM |


    表格的格式化方法完全相同，但使用的是 `Format-Table` 词小句。如果我们输入 `Format-Table` 而不是 `Format-List`，将产生如下结果：


    | Name | Id | StartTime |

    | ---- | -- | --------- |

    | A6100 | 4868 | 5/31/2017 7:51:44 PM |

