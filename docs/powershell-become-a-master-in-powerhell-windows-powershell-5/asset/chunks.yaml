    # Introduction


    Congratulations on downloading PowerShell and thank you for doing so.


    The following chapters will discuss the setup and use of PowerShell on your computer.
    More than that, it will tell you exactly what PowerShell is and the multitude
    of ways that it can be used.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # Chapter 1

    ## What is PowerShell?


    So at this point, you’ve bought the book and you’re wanting to dig into its contents
    and start working with the super powerful PowerShell. However, there are some
    essential questions that we have to topic first before we even think about digging
    into the meatiest parts of the content like that.


    For example, I’m not exactly certain what your reasoning for picking up this book
    was. Maybe you’re just genuinely curious about what PowerShell is and about all
    of the things that you can do it with it. Maybe you’ve heard about it through
    work or school and are needing ample opportunity to get ahead working with this
    application. Moreover, maybe you’re just a hobbyist who read about PowerShell
    in a tutorial or on a forum and you’re looking for a proper opportunity to start
    working with this incredibly dynamic tool. Well, this book is going to teach you
    to do exactly that. However, before we get started on the hows, we really need
    to spend some time looking at the whats.


    So what is the PowerShell? In essence, the PowerShell is a tool built by Microsoft
    intended to allow people to handle their configurations and automate tasks through
    a command line and some programming knowledge. Recently, the PowerShell was also
    made available for other operating systems.


    PowerShell also contains a built-in scripting language. This scripting language
    is what allows you to build small programs in order to automate different things
    on your computer. This ability to script is what gives PowerShell a lot of its
    famous functionality and makes it a perfect choice for all of the automatic tasks
    that you’ll need to perform.


    I suppose that, to this point, I haven’t quite made clear what PowerShell is.
    I’ll jump on that now. See, in every single version of Windows that’s been released,
    there has been a way for the user to interface directly with the tool by way of
    a command line. These methods of interface are referred to specifically as shells.
    By use of the shell, you can feed commands directly into the computer, which will
    allow you to do certain things rather easily or with an unprecedented level of
    control that you hadn’t had before. Traditional shells have a scripting language
    known as `batch`, common across most command line interfaces, whether it be Windows,
    Linux, or Mac. `batch` files are rudimentary scripts that can be run in order
    to automatically do certain tasks from the command line that are written out ahead
    of time.


    For all intents and purposes, though, `batch` is incredibly simple. Stupidly simple,
    even. Because of this, `Batch` doesn’t allow the generation of scripts that can
    do much beyond execute commands and follow very, very basic logic.


    Microsoft’s first attempt to ameliorate the situation regarding scripting and
    command line shells came in 1998 when they put forward the `Windows Script Host`
    alongside the operating system `Windows 98`. This allowed, through its compatibility
    with `Active Script`, for scripts to be written in languages such as `VBScript`.
    This meant a huge step forward in terms of programming the command line and automating
    tasks. Regardless of the major step, though, the system still was far from apt;
    for example, it was not built into the command line shell. To the same end, documentation
    regarding it was very difficult to find, meaning that people who wanted to use
    it had a hard time and that hardly anybody could become “masters


    Worst of all, however, were the security holes that were present in it. It was
    incredibly easy to take advantage of the `Windows Script Host` in order to build
    and execute computer viruses wherever they really should not be. This caused the
    `Windows Script Host` to rapidly be seen as a major net loss for the system.


    After the relative failure of `Windows Script Host`, Microsoft decided that they
    needed to shift gears and start working on a new way for users to manage their
    command line; a uniform way that would make the shell truly worthwhile. It was
    around this time that a shell known as `Monad`, or `Microsoft Shell`, began to
    take place. The ideas started to be published as early as the summer of 2002.


    `Monad` was fantastic, because it was something completely different. What `Monad`
    brought to the table was a command line that was extremely extensible - that is,
    you can add on to it with ease and make it perform whatever tasks you need to
    - that was, well, full-featured in a certain sense. What I mean by full-featured
    was that `Monad` promised the ability to perform a huge number of different administrative
    duties.

