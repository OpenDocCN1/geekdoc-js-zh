    \ to do with this, most of the time. However, if you take the time to learn how\
    \ to filter the information from a given collection, then you can quite easily\
    \ break apart everything.\n\nWhat is extremely handy about PowerShell, though,\
    \ is that it makes the process incredibly simple for you. Or, simple in relative\
