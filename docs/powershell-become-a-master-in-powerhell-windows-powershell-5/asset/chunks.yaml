    然而，这些只是基础。我们甚至还没有开始谈论函数。


    简单来说，函数就是被执行的任务和执行的操作。通常情况下，在 PowerShell 中，函数会返回一个值 - 但情况并非总是如此，有时它们只是向 shell
    打印一个值，或者仅仅执行一些如文件系统操作的操作。


    虽然 `cmdlets`（命令）是 PowerShell 的核心，但理解函数同样重要，它们将构成你 PowerShell 体验的很大一部分。


    现在，让我们进一步讨论一下编程和计算机科学的通用逻辑是如何进入 PowerShell 的，从下一章开始。


    # 第 3 章：PowerShell 背后的编程逻辑


    正如我之前提到的，PowerShell 的一大吸引力之一是它带有一门功能完备的脚本语言。当我说功能完备时，我的意思是在很多方面，这种语言与 `Python`
    和 `Lua` 等其他主流脚本语言一样强大。


    它之所以能如此功能完备且强大，是因为与 `.NET` 等内容紧密集成。当然，我确定你可能已经告诉我这一点。但这留下了另一个问题 - 这到底意味着什么？


    PowerShell 中的一切都是一个对象，确切地说，是一个 `.NET` 对象。一个对象的意义它是 `class`（类）或有时是 `namespace`（命名空间）的派生。那么这在实践中意味着什么？


    从编程的角度来看，`class` 是将不同属性组合在一起的方法（这现在可能还没意义），这样你就可以始终生成具有相同属性的东西。例如，每辆汽车都有特定数量的门、特定类型的发动机和特定的最高速度。`class`
    允许你将这些内在属性分组，并让汽车对象的每个实例都带有这些属性，尽管是以它们各自独特的方式。


    所有的汽车都可以行驶。“行驶”这一动作等同于 `function`（函数）。`function` 是执行动作的东西，并且可能返回也不返回值。PowerShell
    对函数的依赖程度不亚于对 `cmdlets`，每个 `cmdlet` 都只是一个附加了函数的对象。


    你还可以创建带有自己的值和 `methods`（方法）的自定义对象。


    那么为什么这很重要呢？因为这些 `methods` 允许你在 PowerShell 中实现比你意识到的多得多的高级操作。它们允许你操作数据，学习关于你正在处理的不同
    `cmdlets` 和对象的各种知识。这非常重要。


    你在这里最需要理解的是，任何对象都是由定义它的东西。为对象定义的每一个属性和 `function` 都是使该对象成为该对象的内在部分。例如，正如我们讨论的，汽车有许多内在属性。为了让它是某辆车而不是另一辆，这些属性必须处于某种特定状态。这可能听起来没什么意义，但让我这样说：假设你有一辆银色的
    2004 年庞蒂亚 Grand Am（Pontiac Grand Am），行驶了 15 万英里。如果你改变了这些属性之一，突然你指的就不再是同一辆车了。这是因为每一辆汽车都具有这样的内在属性。每辆汽车都有颜色；每辆汽车都有生产年份；每辆汽车都有品牌和型号；每辆汽车都有特定的里程数。（即使里程数是
    0。）


    所以，如果我们在谈论这辆车，但指的是一辆红色的、行驶了 15 万英里的 2004 年庞蒂亚 Grand Am，那么我们谈论的完全是另一辆车 - 红色的，而不是银色的。尽管字面上其他一切都相同，但该对象的这一个内在属性就定义了它作为一个独立的对象。


    因此，准确理解这些属性的含义以及如何获取它们非常重要。我们稍后会讨论这一点。现在，我们需要转向 PowerShell 的脚本方面，在那里事情将是自动化的。


    # 第 4 章：脚本


    所以，我们已经讨论了如何为 PowerShell 编写脚本以及它们可以执行的各种事情。在这里我们将进入许多编程类型背后的逻辑。


    现在，由于 PowerShell 是构建在 `.NET Framework` 之上的，它在很多方面本质上是一门编程语言。这意味着我们与编程语言关联的某些事情
    - 数据类型、值、变量、甚至程序逻辑 - 都可以以与其它编程语言相似的方式来理解。


    对你来说，作为一个（可能是）新程序员以及一个（可能是）PowerShell 新手，这可能可能没有太大意义。实际上，它可能完全无法理解。但没关系 - 稍后你就明白了。我们只需要继续讨论这个话题，并从最基础的开始。


    我们需要讨论的第一件事是为什么创建脚本文件是必要的。通过创建脚本文件，你允许自己自动化许多原本无法实现的事情。你还允许某些事情的执行方式与简单打开 PowerShell
    然后输入命令不同。


    这使得与批处理文件（batch files）略有不同。例如，在典型的命令行外壳的批处理文件中，你只需输入你平时会输入的命令即可。当然，有某些如 `GOTO`
    之类的关键字可以使批处理文件多做一点，但它们在任何想象力范围内都不一定算复杂，特别是与像 PowerShell 脚本语言如此庞大的语言相比。


    现在，不要会会我，PowerShell 脚本语言本身并不特别复杂 - 额，它是复杂的，并且对于你大多数需要执行的操作来说绰有余。然而，它远没有某些语言大。例如，`VBScript`
    有几百个不同的关键字可以使用。与之相比，PowerShell 大约有 24 个。这是一个非常明显的差异。


    然而，不要困惑。关键词的减少完全没有让它变得不强大，这门语言对于你关于命令行和任何形式自动化的每一项任务都绰绰有余。


    无论如何，这里的重点是 PowerShell 极其强大，尽管它很精小。学会利用 PowerShell 的力量是完成你想要通过命令行完成的一切事情的关键。


    那么，到底如何创建和运行这些 PowerShell 脚本呢？嗯，实际上相对简单。你只需要在任何给文本编辑器中启动一个文件，把代码放进去，然后将其命名为你想要的名称。唯一的陷阱是文件名扩展名必须是
    ps1。所以如果你有一个名为 `cabbages` 的文件并想让它成为一个脚本，你就将其命名为 `cabbages.ps1`。易如反掌。


    你可以使用你喜欢的任何文本编辑器，真的。即使是记事本也可以。我个人觉得我必须推荐 `Atom.io`，因为它是一个非常强大的文本编辑器。它的理由有很多。第一个是它是完全免费的。第二个是它是扩展的
    - 你可以获取很多插件让你的生活和编程变得更容易。第三是考虑到它是免费的，它看起来真的很漂亮，而且运行得非常出色。我无法对 Atom 给出更热烈的评价语了。然而，如果你愿意，你甚至可以使用
    `Emacs`、`Vim`、`Notepad++` 或 `Sublime Text`。只要它能生成纯文本文件即可。


    现在我们需要讨论实际的程序逻辑。我想进入这一切最简单的方法就是从制作我们的第一个程序开始。打开你的文本编辑器。接下来，在其中编写以下内容：

