    and then pass it along the pipeline to the `Format-List` cmdlet:


    ```powershell

    Get-Process | Where-Object {$_.SessionId -eq 1} | Format-List

    ```


    But we’re not done yet, we have to sort the list and create it by the properties
    we specified earlier. For this, we have to initiate the `-Property` parameter
    and then sort by the properties that we specified earlier, like so:


    ```powershell

    Get-Process | Where-Object {$_.SessionId -eq 1} | Format-List -Property name,ID,StartTime

    ```


