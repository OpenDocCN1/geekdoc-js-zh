    in PowerShell, a super useful feature that I’m sure you’ll be glad you learned.


    # Chapter 6


    ## PowerShell Terminology


    The terms involved with PowerShell can get a little bit confusing. In fact, it
    can seem like you’re somewhat lost in an alphabet soup of different computer terms.
    Well, don’t worry! Here, I’ve tried to compile some of the most important terms
    from throughout the book so that you can understand exactly what you’re looking
    at, just in case you need to go back and reread something.


    | Term | Meaning |

    | :--- | :--- |

    | Cmdlet | A name for the various commands that you can issue within PowerShell.
    Always return an object. |

    | Directory | Another term for “folder”. |

    | Method (or function) | Code which performs an action in the same way, which
    may or may not take arguments. |

    | .NET Framework | The framework which PowerShell, as well as VB.Net and C#, are
    all built on. |

    | Object | An instance of a class; something which has intrinsic qualities such
    as methods and properties. |

    | Property | Something that has a value stored to it - think the color of a car,
    the number of tires the car has, and forth. These are all properties of the car.
    |

    | Working Directory | The folder that you’re currently in on your drive. |


    # Conclusion


    Thank you for making it through to the end of PowerShell, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    it may be.


    The next step is to start using the skills that you’ve learned in this book and
    putting them to good use, automating your computer and doing all sorts of things
    from the command line that you didn’t know you could do.


    The information in this book can only, honestly, get you started - that’s all
    a beginner book can do. It is on you, my friend, to do the experimentation and
    the research to carry you from somebody who knows the basics about PowerShell
    and scripting to somebody who has a solid grasp on everything that they need to
    do. The reason that I can’t get overly specific is because I’m trying to be rather
    broad so that you understand the concepts at play. This is important, because
    I can teach you specific situations all day long, but if you don’t run into those
    specific situations, that knowledge is absolutely useless.


    No, it’s far better as a beginner that you learn the concepts at work so that
    you can apply those broader concepts to more specific and finite ideas. So spend
    some time poking around with PowerShell, get a list of the different cmdlets and
    start playing around. Maybe spend some time learning about things like curl for
    web scraping. Look up PowerShell tutorials online and follow them.


    What this book has given you is something valuable: it’s given you the broad knowledge
    of the huge amount of different concepts that are at play within PowerShell; it’s
    a lot to take on at once to try to understand bigger concepts such as objects
    or frameworks, as well as trying to remember all of these different esoteric commands
    that PowerShell and command line programming in general entails. However, I genuinely
    hope that I’ve done a good job of breaking it down into the individual parts and
    making something worth reading that will give a beginner, like yourself, a great
    opportunity to learn a lot not just about scripting or PowerShell but computing
    in general.


    Just one last time, I’d like to wish you the best of luck on your PowerShell journey.
    Thank you again for reading.

