  raw: 'The first public release of Monad happened in the summer of 2005 and was updated
    quite a bit throughout the year following. In 2006, Microsoft came out and said
    that Monad would instead be called Windows PowerShell. This was a huge boost for
    the project in terms of credibility as it positioned it to be a major tool for
    systems management and information tech jobs in general. PowerShell intimated
    something much bigger than Monad did - PowerShell intimated strength.


    The first version of PowerShell was formally released in the first quarter of
    2007\. While work on the first version of PowerShell was ongoing, work on PowerShell
    version 2.0 started to take place as well. PowerShell version 2.0 was released
    formally in the summer of 2009 alongside Windows 7, which it became a major part
    of. A little bit after its initial release, versions compatible with earlier forms
    of Windows were released.


    Since 2009, the biggest step forward for PowerShell was when it became open source
    and ported to multiple different platforms. In the summer of 2016, PowerShell’s
    code was released to the world for all to see and users of other operating systems
    like Linux, CentOS, and macOS were finally able to take full advantage of the
    clever shell program.


    So at this point, you may be asking what makes PowerShell different. Well, there
    are a whole lot of things, basically.


    The first and foremost is that it is heavily integrated with the .NET Framework.
    In case you don’t know what Microsoft .NET is, it offers an infrastructure for
    languages to work with one another and is essentially one of Microsoft’s most
    important offerings right now. So how does this integrate with PowerShell? Well,
    one can write cmdlets - programs written using .NET Framework languages - that
    are actually made to work with PowerShell. However, cmdlets also work in a different
    way. They can also be run from PowerShell. Therefore, not only can you write Cmdlets
    in .NET languages, but whenever you use the PowerShell and execute certain commands
    in PowerShell in order to do different things, you are actually invoking Cmdlets
    that are set up at runtime, as well. Beyond this, every single object created
    in PowerShell is a .NET object, which means it will work as .NET objects do, with
    every method and class attribute thereof.


    Another way that it’s different is that the PowerShell implements the notion of
    a pipeline. If you’ve ever worked with Unix pipelines then you probably have a
    moderate idea of how this works. Essentially, what happens is that the result
    of one cmdlet is given as an argument (or input data) to another cmdlet.


    Perhaps the final thing that sets PowerShell apart and makes it a fantastic tool
    is the extremely verbose scripting language. Using the scripting language, you
    can automate a huge number of different things. The scripting language, too, is
    actually relatively full-featured compared to scripts written in languages such
    as Batch. For example, it supports general control flow like looping and conditionals
    (more on this later), allows one to catch and throw exceptions, and is entirely
    integrated with the .NET framework.


    Having a proper knowledge of PowerShell is becoming more and more important for
    people working in information technology now that Windows Server 10 increasingly
    utilizes and integrates it. The good thing about PowerShell is that PowerShell
    comes automatically with Windows, so you don’t need to set it up too much. However,
    if you do have another operating system then, as I’ve already said, PowerShell
    is open source and will more than likely be available for the operating system
    that you’re using.


    Chapter 2


    h


    PowerShell Commands


    As I’ve said before, one of the most charming things about PowerShell is its system
    of cmdlets. Indeed, this system is one of the most important and integral things
    about it. The entire reason for using a command line shell is so that you can
    speak directly to the computer, server, router, or whatever and potentially do
    things that you couldn’t do otherwise. The command line simply serves as the most
    direct line of communication between you and your computer or hardware without
    the layer of abstraction provided by the desktop. With this higher degree of control,
    however, also comes a far higher learning curve. Fortunately, though, PowerShell
    keeps this from being all too difficult. Before we jump into this, I feel that
    it’s necessary that I explain briefly how command lines even work.


    Commands in PowerShell have two forms. There are cmdlets and there are aliases.
    Aliases will perform the action of the cmdlet for which they are an alias, so
    don’t worry about the difference too much. The reason the aliases exist is in
    order to make the shell easier to use for people who are used to other sorts of
    shells like the Unix Shell or like the old Windows command line. The handy thing
    about cmdlets is that while other shell commands tend to have rather archaic or
    hard to understand names, cmdlet names follow a very strict order that serves
    to make them very readable.


    Anyhow, now I’m going to go through the major cmdlets and their aliases one by
    one, explaining each. However, note that since cmdlets can be created and since
    the PowerShell is a huge program with a huge integration with .NET, there are
    hundreds of different cmdlets. It simply wouldn’t be practical to go through each
    and every one of them in this book when you quite simply aren’t going to need
    all of them. What I’m going to do instead is simply give you those which are most
    pertinent and which you’ll most likely need.


    Get-ChildItem - This one can also be entered as gci, dir, or ls. The name might
    sound a little weird, but if you’ve ever used other shells, you know exactly what
    this command does. What it does is look to see where you are in the hard drive
    and lists every single file and directory within that folder.


    Test-Connection - This one is known on other systems as ping, but doesn’t have
    an alias in PowerShell curiously. What it does is contact another machine and
    tries to get a response back. This will help you to determine whether there is
    a connection established between the two, either by the internet or otherwise.
    This is a very useful cmdlet to know how to use.


    Get-Content - This one is known on other systems as gc, type, and cat, and these
    same aliases may be entered for it with no problem. What this does is simply get
    the content of a file for something to be done with it.


    Get-Command - If you want to see all of the commands that are available for you
    to use, you simply use this cmdlet (or its alias, gcm). Upon entering this cmdlet
    into PowerShell, you’ll be greeted with an incredibly long list of different commands,
    each of which performs a different, unique, and powerful function that will help
    you get your work done. If you have the time and the patience, I urge you to use
    Get-Command and poke around and see what all you can do with it.


    Get-Help - This is an extremely useful command. On the old Windows command line,
    it is known as help, and on the Unix shell it is known as apropos and man; help
    and man are the two aliases that may be used for it within PowerShell if yodu
    do not wish to type Get-Help. What this command does is, well, exactly what it
    says - it gives you help with a specified command. All that you have to do is
    state which cmdlet you’re wanting help and details on after the name, like so:


                                    Get-Help Get-Command


    However, you can also simply type Get-Help if you want some help understanding
    the other ways in which you can use the command. It’s actually rather versatile
    and so I encourage you to get to know the different ways that it can be used.


    Clear-Host - This command is known also as cls on Windows and clear on Unix systems
    like Linux and Mac, and may be entered as either if you do not wish to type out
    Clear-Host completely. This command just clears the console and gives you a blank
    canvas.'
