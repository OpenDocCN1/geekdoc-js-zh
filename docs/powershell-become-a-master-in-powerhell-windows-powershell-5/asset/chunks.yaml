    However, those are just the basics. We haven’t even started talking about functions
    yet.


    Functions are very simply things which are carried out and actions which are performed.
    Generally, within PowerShell, functions will give a value back - however, this
    isn’t always the case, sometimes they will simply print a value to the shell or
    they will just do something like file system operations.


    While `cmdlets` are the core of PowerShell, functions are equally important to
    understand and will make up a big part of your PowerShell experience.


    Let’s talk a bit more, now, about how the general logic of programming and computer
    science works its way into PowerShell, starting in the next chapter.


    # Chapter 3: The Programming Logic behind PowerShell


    As I’ve said before, one of the bigger draws of PowerShell is that it has a very
    full-featured scripting language accompanying it. When I say full-featured, I
    mean that in many ways this language is as powerful as other major scripting languages
    like `Python` and `Lua`.


    The reason that it can be so full-featured and powerful is because it’s tightly
    integrated with things like `.NET`, sure. I’m sure you could have told me that.
    But that does leave another question open - what exactly does that mean?


    Everything in PowerShell is an object, a `.NET` object to be exact. What an object
    means is that it’s a derivative of a `class` or, sometimes, a `namespace`. So
    what does this mean in practical terms?


    A `class`, in terms of programming, is a way of grouping different attributes
    together (this may not make sense yet) so that you can always generate something
    with the same attributes. For example, every car has a certain number of doors,
    a certain kind of motor, and a certain top speed. A `class` allows you to group
    these intrinsic qualities and have every instance of the car object bear them,
    albeit in their own unique way.


    All cars can also go. The act of going would be the equivalent of a `function`.
    A `function` is something which performs an action and may or may not return a
    value, too. PowerShell is as dependent upon functions as it is upon `cmdlets`,
    and every `cmdlet` is just an object that has functions affixed to it.


    You can also make custom objects with their own values and `methods`.


    So why is this important? Because these `methods` are what will allow you to do
    a lot more advanced things in PowerShell than you’d realized. They’ll allow you
    to manipulate data, to learn all sorts of things about the different `cmdlets`
    and objects you’re working on. This is really important.


    The thing you need to understand most here is that any object is the things that
    define it. Every single property and `function` defined for an object is an intrinsic
    part of what makes that object that object. For example, a car has a lot of intrinsic
    properties, as we discussed. In order for it to be one car and not another, these
    properties must be a certain way. This may not make much sense, but let me say
    it this way: let’s say that you had a silver 2004 Pontiac Grand Am with 150,000
    miles. If you change one of these properties, suddenly you’re not referring to
    the same car. This is because every single car has intrinsic properties as such.
    Every car has a color; every car has a production year; every car has a make and
    model; and every car has a certain amount of miles on it. (Even if that amount
    of miles is 0.)


    So if we were talking about this car but instead referred to a red 2004 Pontiac
    Grand Am with 150,000 miles, then we’d be talking about a different car entirely
    - the red one and not the silver one. Despite the fact that literally everything
    else is the same, that one intrinsic property of the object defines it as its
    own object.


    As such, it’s important that you understand exactly what these properties mean
    and how to get to them. We’ll talk about that in just a little bit. For now, we
    need to move on to the scripting aspect of PowerShell, where things get automated.


    # Chapter 4: Scripting


    So we’ve talked about how one can write scripts for PowerShell and the various
    things that they can do. This is where we’re going to get into a lot of the logic
    behind programming types.


    Now, since the PowerShell is built on the `.NET Framework`, it is essentially
    a programming language in many ways. This means that certain things that we associate
    with programming languages - data types, values, variables, even program logic
    - can be understood in much the same way that they can with other programming
    languages.


    To you, as a (presumably) new programmer and person who is (presumably) new to
    PowerShell, this may not mean too much. It may not make any sense at all, actually.
    But that’s okay - it will in just a moment. We just have to carry on with this
    topic a bit and start at the very basics.


    The first thing that we need to talk about is why creating script files is necessary.
    By creating script files, you allow yourself to automate a number of things that
    you wouldn’t be able to otherwise. You also allow things to execute differently
    than they would by simply opening PowerShell and then typing in the commands.


    This makes it slightly different from batch files. For example, in batch files
    on typical command line shells, you would simply type the commands that you would
    otherwise. Sure, there were certain keywords like `GOTO` or things of that nature
    that could make a batch file do a bit more, but they weren’t necessarily sophisticated
    by any particular stretch of the imagination, especially not compared to something
    as large as the PowerShell scripting language.


    Now, don’t get me wrong, the PowerShell scripting language isn’t particularly
    sophisticated itself - well, it is, and it’s more than sufficient for most of
    what you’ll need to do. However, it is not nearly as large as some languages.
    `VBScript`, for example, has a couple hundred different keywords that you can
    use. Compare this to PowerShell, which has about 24. That’s a pretty marked difference.


    However, don’t be confused. That reduction in keywords doesn’t make it less powerful
    at all, and the language will be more than enough for every single thing you need
    to do regarding the command line and any sort of automation.


    Anyway, the key point here is that PowerShell is extremely powerful, though it’s
    small. Learning to harness the power of PowerShell is key to doing everything
    that you’re wanting to do the command line.


    So how exactly does one create and run these PowerShell scripts? Well, it’s relatively
    simple, actually. All that you do is start a file in any given text editor, put
    your code inside of it, and then name it what you want. The only catch is that
    the filename extension has to be ps1. So if you had a file called `cabbages` and
    you wanted it to be a script, you would called it `cabbages.ps1`. Easy peasy.


    You can use any text editor that you’d like, really. Even Notepad would work just
    fine. Personally, I feel I must recommend `Atom.io`, because it’s just a really
    strong text editor. There are a lot of reasons to use it. The first is that it’s
    completely free. The second is that it’s extensible - there are a lot of addons
    for it that you can get, very easily, to make your life and your programming easier.
    The third is that it just looks really nice given that it’s free, and it works
    tremendously well. I couldn’t leave a more glowing review of Atom if I tried.
    However, if you are so inclined, you can even use something like `Emacs`, `Vim`,
    `Notepad++`, or `Sublime Text`. Whatever tickles your fancy, so long as it can
    generate plaintext files.


    Now we need to talk about actual program logic. I guess that the easiest way to
    get into this whole thing is to start by making our first program. Get your text
    editor. Next, write the following within it:

