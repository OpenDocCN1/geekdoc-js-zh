    a lot of code into - retrieving content from a webpage, for example, is as simple
    as using the curl command in PowerShell.


    Anyway, the key point here is that PowerShell is extremely powerful, though it’s
    small. Learning to harness the power of PowerShell is key to doing everything
    that you’re wanting to do from the command line.


    So how exactly does one create and run these PowerShell scripts? Well, it’s relatively
    simple, actually. All that you do is start a file in any given text editor, put
    your code inside of it, and then name it what you want. The only catch is that
    the filename extension has to be ps1. So if you had a file called “cabbages” and
    you wanted it to be a script, you would called it cabbages.ps1. Easy peasy.


    You can use any text editor that you’d like, really. Even Notepad would work just
    fine. Personally, I feel I must recommend Atom.io, because it’s just a really
    strong text editor. There are a lot of reasons to use it. The first is that it’s
    completely free. The second is that it’s extensible - there are a lot of addons
    for it that you can get, very easily, to make your life and your programming easier.
    The third is that it just looks really nice given that it’s free, and it works
    tremendously well. I couldn’t leave a more glowing review of Atom if I tried.
    However, if you are so inclined, you can even use something like Emacs, Vim, Notepad++,
    or Sublime Text. Whatever tickles your fancy, so long as it can generate plaintext
    files.


    Now we need to talk about actual program logic. I guess that the easiest way to
    get into this whole thing is to start by making our first program. Get your text
    editor. Next, write the following within it:'
