    \ of formatting and filtering that will allow you to take your scripts to the\
    \ next level.\n\n# Chapter 5: More Advanced - Filtering and Formatting\n\nA lot\
    \ of what you’re going to be doing is parsing data. For that reason, I’ve decided\
    \ to devote a little bit of this book to covering the processes that will go into\
    \ parsing data.\n\n## Filtering Collections\n\nThe first thing that we’re going\
    \ to talk about is filtering collections. This is important for parsing information\
