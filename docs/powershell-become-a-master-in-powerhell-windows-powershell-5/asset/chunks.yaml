    So let’s say that we wanted to see what processes currently running had a session
    ID of 1\. This is relatively simple. First, you have to understand the syntax
    of the Where-Object cmdlet. (Oh, and for the record, PowerShell programmers almost
    never call it - or type it - as Where-Object, opting instead for where the vast
    majority of the time.)


    Anyhow, going back to the whole syntax thing, the Where-Object syntax is as such:


    Where-Object { condition }


    It will print out the relevant data according to the specified condition as it
    is or isn’t met. So let’s take a second and look at this. We know that the object
    that Get-Process returns will have a bunch of innate members. Let’s look for one
    which designates the Session ID. Looking back at the Get-Member data (it should
    still be in your PowerShell window), look for a member that has a data type of
    integer (since the session ID represents an integer) and references the session
    ID. Since it’s organized alphabetically, this should be pretty simple.


    When you look at the member list, you’ll see this tucked somewhere in the middle:


    SessionId                     Property         int SessionId {get;}


    And that, pretty much, is our golden ticket. So now we can sort according to that.
    So let’s think about how we can do this.


    First off, we have to access the SessionId property of everything on the list.
    In order to do that, we need to reference whatever object is currently being put
    through the pipeline. The way that you do that is by the $_ operator. Then we
    need to access that object’s properties, which we’ll do with a period:


    $_.


    The period indicates that you’re trying to access a specific member, method, or
    property of that object. Anyhow, let’s keep moving forward with this. So the thing
    that we’re going to do next is indicate that for every object passed through the
    pipeline, the SessionId property must be equal to 1. Here’s how we would do that:


    $_.SessionID -eq 1


    Now all that we have to do is throw that into our Where-Object cmdlet, like so:


    Where-Object { $_.SessionID -eq 1 }


    Pay special attention to the curly braces! They’re absolutely necessary and delineate
    exactly where the condition of the method begins, which is important information.


    But wait, if we try to just run this, it’s not going to go all too well… it doesn’t
    have any information to filter through! So we have to send it the results of Get-Process
    through the pipeline. The end command should be like so:


    Get-Process | Where-Object {$_.SessionID -eq 1}


