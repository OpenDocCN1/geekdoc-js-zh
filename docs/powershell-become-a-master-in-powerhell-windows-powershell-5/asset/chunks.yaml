    Set-ExecutionPolicy RemoteSigned


    And then press Enter. What this will do is make it so that your user account on
    your computer is authorized to execute PowerShell scripts. Then what you’re going
    to do is navigate to wherever you saved the script. As I said earlier, “cd” and
    “ls” are your friends here. If you need to go up in directories, you’ll type “cd
    ..”, which will take you up one level. If you need to know which folders are in
    the current directory, you use “ls”, which will list them all. Keep poking around
    until you find your file “hello.ps1”.


    Once you’ve found it, what you need to type to execute it is this:


    .\hello.ps1


    And then press Enter. You should see a little white-on-blue hello world pop up
    in the box. How exciting is that? Your first PowerShell script!


    So now we need to get to talking about slightly more complicated concepts, such
    as values and variables.


    So what are values? We’ve talked a lot about values but what exactly do they mean?
    Well, I haven’t quite referred to values by their actual names. When I’ve referred
    to values before in this book, I’ve been referring to variables or properties,
    depending upon context. We’ll talk about those in a second but the first thing
    that we really need to talk about in terms of writing a script is what a value
    is.


    A value, I’m sure you know, is a piece of data in one way or another. For example,
    we talk about value all the time when we ask for the value of a house or a car.
    In terms of computer programming, a value refers simply to a piece of data that
    stands on its own. Values can be of multiple different types and sorts depending
    upon what they are.


    For reference, here are the primary different types of values in PowerShell scripting:


    | Name | Description |


    | Array | A set of different values put together |


    | Bool | A type of data which is either true or false |


    | DateTime | A type of data which stores information regarding the date and the
    time. |


    | Float | A type of data which stores a decimal number, known in computer science
    as a floating point number. |


    | Guid | A type of data which stores a globally unique ID. |


    | HashTable | Much like a dictionary, if you’ve done any sort of Python or Java
    programming. It’s a table of keys which connect to values. They connect in a somewhat
    intrinsic way - every key links to one specific value. |


    | Int | Integers - essentially, whole numbers. |


    | PsObject | A custom PowerShell object. |


    | Regex | This stores a regular expression. |


    | ScriptBlock | This type of data holds a script within it. |


    | String | A type of data which consists of several text characters joined together,
    like “Hello” or “How are you today?” |


    Every single thing that holds a value in programming has a certain data type,
    as such.


    Values are stored within things called variables. Variables are things that allow
    you to keep and change values as you wish, without losing them. This way, you
    don’t have to type the same thing over and over, or you don’t have to do all of
    the math within your program by hand.


    In the olden days, you used to have to explicitly say what type of data every
    value was. For example, in the programming language C, you’d have to type the
    type of the variable every single time that you created one, and you’d also have
    to give types to the functions. (More on functions, or “methods”, in a second)


    However, when you’re scripting with modern languages like PowerShell, that’s no
    longer necessary. Some languages intentionally keep the functionality, but most
    modern ones do not. The separation between the two is known as implicit vs. explicit
    typing.


    Anyway, when you decide you want to store a value, you need to do what’s called
    declaring a variable.


    In PowerShell, this is somewhat similar to declaring variables in Perl, but it’s
    a lot less of a pain, too. In order to declare a variable of any type in PowerShell,
    all that you do is put a dollar sign ($), then the name of the variable - which
    can technically be anything and even have spaces so long as it has brackets around
    it, but best practice dictates not to do that - and then finally the value of
    the variable, like so.


    $name = ‘Joseph’


    By doing this, we just created a variable of the data type string, which means
    that it’s a sequence of characters. Inside of this variable, we are storing the
    value of the string of characters which reads “Joseph”. We can now incorporate
    this into our other code. Create a new file, name it whatever you like, and type
    the following:


    $name = ‘Joseph’


    Write-Output “Your name is $name?”


    Then save it and try to run it. It should say “Your name is Joseph?”. That’s the
    first example of us using and manipulating a variable within a PowerShell script.
    There will be many more, but this is the first major and noteworthy one, and you
    should be proud.


    Right now, it’s important that we draw a distinction. If you’re printing out strings,
    it’s best that you use single quotes around it, unless you’re printing out a variable
    within it, in which case you should use double quotes. Again, this is just convention
    and best practice.


    Anyhow, what we’re going to do now is work with some other data types. Go ahead
    and create two variables called $varOne and $varTwo. Assign the values of 3 and
    5 to these respectively.


    $varOne = 3


    $varTwo = 5


    Now create another variable called varThree, which is going to take the value
    of $varOne and $varTwo.


    $varThree = $varOne + $varTwo


    Now type the following:


    Write-Output “$varOne + $varTwo = $varThree”.


    Ideally, it should print out 3 + 5 = 8, which is not only charming but mathematically
    correct. How cool is that?


    Math in PowerShell scripting is much like math in other programming languages.
    Here are the signs and their individual meanings:


    | + | Addition | 4 + 2 (=6) |


    | - | Subtraction | 4 - 2 (=2) |


    | * | Multiplication | 4 * 2 (=8) |


    | / | Division | 4 / 2 (=2) |


    | - (before) | Negative number | -4 + 2 (= -2) |


    | % | Modulo (gives remainder) | 4 % 2 (= 0, no remainder) |


    Those are the essential PowerShell math operators. It’s absolutely imperative
    that you understand these because math is going to be a huge component of the
    vast majority of the scripts that you write. Even if they’re just doing something
    simple like culling results or something along those lines, you’re still going
    to need math because you’ll have to, for example, loop through a sequence.


    Now it’s time that we move onto something a tad bit more fun: control flow. Control
    flow is a super important part of any given program, but it’ll be especially important
    to your scripts. There are two major parts to control flow: conditionals, and
    loops. Both of them rely upon the idea that you can compare data sets against
    one another and determine if something is true or not, so before we jump into
    all of that, we’re going to talk about booleans for just a moment.


    The idea of boolean values is rather simple. Booleans simply refer to the truth
    or falsehood of a given thing. This means that a boolean value can be either true
    or false, depending upon various conditions, but it will only ever be true or
    false. A boolean value, for example, can’t be a number, nor can it be a sequence
    of text.'
