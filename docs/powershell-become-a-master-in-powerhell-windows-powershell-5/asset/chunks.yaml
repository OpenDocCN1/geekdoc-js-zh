    # PowerShell 基础


    ```powershell

    Write-Output “Hello world”

    ```


    然后将其保存为 `hello.ps1`，可以放在你任何想要的地方。接下来，你可以进入该位置，右键点击并选择`用 PowerShell 运行`，或者你可以尝试更复杂的操作（这种方法更好而且结果也更好）。


    打开开始菜单，在搜索栏中输入 `PowerShell`。右键点击显示 `PowerShell ISE (x86)` 的版本。然后点击`以管理员身份运行`。在那里，你将看到一个更大版本的
    PowerShell，它有更多的选项以及一个充满满信息的侧边栏。你需要输入以下内容：


    ```powershell

    Set-ExecutionPolicy RemoteSigned

    ```


    然后按回车键。这将使得你的用户账户获得执行脚本的权限。接着，导航到你保存文件的地方。正如我所说，`cd` 和 `ls` 是你的朋友。如果你需要返回上一级目录，输入
    `..`，这会带你向上移动一层。如果你需要知道当前目录下有哪些文件夹，使用 `ls`，它会列出所有文件夹。继续寻找，直到找到 `hello.ps1`。


    一旦找到了它，你需要输入以下命令来执行：


    ```powershell

    .\hello.ps1

    ```


    然后按回车键。你应该会看到框里弹出一个小的 `hello world`。这不令人兴奋吗？你的第一个脚本！


    ## 值与变量


    现在我们需要处理一些稍微复杂的概念，例如值和变量。什么是值（values）？我们已经讨论过很多关于值，但它们到底意味着什么？嗯，我们根据上下文通过它们的实际名称来指代值。我们稍后会讨论这些，但在编写代码方面，我们首先真正需要讨论的是什么是值。


    我确定你知道，一个值是以某种形式存在的数据片段。例如，当我们询问房子或汽车的价值时，我们经常在谈论价值。在计算机编程中，值简单地指的是自立存在的数据。根据其内容的不同，值可以是多种类型和种类。


    作为参考，这里是 PowerShell 脚本中主要的数值类型：


    | 名称 | 描述 |

    | :--- | :--- |

    | Array (数组) | 组合在一起的不同值的集合 |

    | Bool (布尔) | 一种非真即假的数据类型 |

    | DateTime (日期/时间) | 存储有关日期和时间信息的数据类型 |

    | Float (浮点数) | 存储小数的数据类型，在计算机科学中称为浮点数 |

    | Guid (全局唯一标识符) | 存储全局唯一 ID 的类型 |

    | HashTable (哈希表) | 类似于字典（如果你用过任何 Python 或 Java 的话）。它是一个连接到值的键表。它们以某种内在的方式连接——每个键都链接到一个特定的值
    |

    | Int (整数) | 整数——本质上是全数字 |

    | PsObject (PowerShell 对象) | 自定义的 PowerShell 对象 |

    | Regex (正则表达式) | 存储正则表达式 |

    | ScriptBlock (脚本块) | 这种类型的数据内部包含一个脚本 |

    | String (字符串) | 一种由多个连接在一起的文本组成的数据类型，如“Hello”或“你好？” |


    在编程中，每一个持有值的实体都有其特定的数据类型。值存储在被称为变量（variables）的实体中。变量是允许你随意保留和更改值而不会丢失它们的东西。这样，你就不需要重复输入相同的内容，也不需要手动在程序中完成所有的数学计算。


    在过去，你通常必须显式地说明每个值的数据类型。例如，在 C 编程语言中，你每创建一个变量都必须输入变量的类型，而且还必须给函数指定类型。（关于函数或`方法`，稍后会详细介绍）


    然而，当你使用像 PowerShell 等现代语言编写脚本时，这不再是必要的。某些语言故意保留了这种功能，但大多数现代语言并没有。这两者之间的区别被称为隐式类型与显式类型类型。


    无论如何，当你决定要存储一个值时，你需要执行所谓的声明变量。


    在 PowerShell 中，这与在 Perl 中声明变量有些相似，但处理起来要少痛苦得多。要在 PowerShell 中声明任何类型的变量，你只需要放一个美元符号（`$`），然后是变量的名称——从技术上讲可以是任何内容，只要周围有括号甚至可以包含空格，但最佳实践建议不要这样做——最后是变量的值，如下所示：


    ```powershell

    $name = ''Joseph''

    ```


    通过这种方式，我们创建了一个数据类型为 `string` 的变量，这意味着它是字符序列。在这个变量内部，我们存储了读取为“Joseph”的字符字符串值。我们现在可以将其整合到其他代码中。创建一个新文件，随你喜欢命名，并输入以下内容：


    ```powershell

    $name = ''Joseph''

    Write-Output “Your name is $name?”

    ```


    然后保存并尝试运行它。它应该显示“Your name is Joseph?”。这是我们在 PowerShell 脚本中使用和操作变量的第一个例子。还会有很多，但这是第一个重大的例子。


    ## 数学运算符


    现在让我们来处理其他类型。去创建两个变量：


    ```powershell

    $varOne = 3

    $varTwo = 5

    $varThree = $varOne + $varTwo

    Write-Output “The sum is $varThree”

    ```


    理想情况下，它应该打印 3 + 5 = 8。现在我们尝试减法：


    ```powershell

    $varThree = $varOne - $varTwo

    Write-Output “The difference is $varThree”

    ```


    它应该打印 3 - 5 = -2。现在我们尝试乘法：


    ```powershell

    $varThree = $varOne * $varTwo

    Write-Output “The product is $varThree”

    ```


    它应该打印 3 * 5 = 15。现在我们尝试除法。注意 PowerShell 除法默认返回 `float`：


    ```powershell

    $varThree = $varOne / $varTwo

    Write-Output “The result is $varThree”

    ```


    它应该打印 3 / 5 = 0.6。最后，我们尝试取模运算符：


    ```powershell

    $varThree = $varOne % $varTwo

    Write-Output “The remainder is $varThree”

    ```


    它应该打印 3 % 5 = 3。


    这些是核心的 PowerShell 数学运算符。理解这些内容至关重要，因为数学是你编写的大多数脚本的重要组成部分。即使它们只是执行像筛选结果之类的简单操作，你仍然需要数学，因为你需要遍历序列。


    ## 控制流


    现在是时候进入一些有趣的内容了：控制流。控制流是任何程序的极其部分，对你的脚本来说尤其如此。控制流有两个主要部分：条件和循环。它们都依赖于你可以对数据集进行比较并判断某事是否真实，因此在深入这些内容之前，我们将先讨论一下布尔值。


    布尔值的概念非常简单。布尔简单地指代给定事物的真或假。这意味着一个布尔值可以为真或假，取决于各种条件，但它永远只可能是真或假之一。


