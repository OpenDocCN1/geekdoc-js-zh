- fmt: "\nPowerShell’s boolean setup is very, very simple. In a lot of ways, it’s\
    \ reminiscent of the old style of doing booleans from the C era, where booleans\
    \ were literally a 1 or a 0, a 1 meaning true or a 0 meaning false. And in some\
    \ ways, this still is true. For example, if you check to see if the string “false”\
    \ is actually false in the boolean sense, it’ll be true because of the fact that\
    \ it has a value that isn’t 0 (since it is a populated string). As you can see,\
    \ it’s a little fickle. However, the logic underlying is very simple. What’s more\
    \ is that PowerShell has predefined variables for `$true` and `$false` which it\
    \ will automatically define things as when you try to see if something is true\
    \ or not.\n\nSo now it’s important that we start to talk about boolean comparisons,\
    \ or boolean expressions. These are how you can compare one value to another and\
    \ make a rational decision about whether or not that statement is true. This is\
    \ actually extremely easy in PowerShell, like many other things.\n\nThe logic\
    \ underlying these is actually relatively simple. Simply think back to high school\
    \ or college when you were solving algebraic inequalities. Remember how those\
    \ disjointed equations would try to make you solve what could and couldn’t be\
    \ on a graph, and then point them out? The logical comparisons of boolean expressions\
    \ are actually rather simple in the way that they are set up.\n\nThere are a lot\
    \ of different comparison operators in PowerShell. These all have their own unique\
    \ uses and places where they’d be the best option for comparison. Here are the\
    \ comparison operators and their meanings.\n\n| Operator | Description |\n| :---\
    \ | :--- |\n| `-eq` | Checks to see if the values are equal to one another. |\n\
    | `-ne` | Checks to see if values are not equal to one another. |\n| `-gt` | Checks\
    \ to see if left value is greater than right value. |\n| `-lt` | Checks to see\
    \ if left value is less than right value. |\n| `-ge` | Checks to see if left is\
    \ greater than or equal to right. |\n| `-le` | Checks to see if left is less than\
    \ or equal to right. |\n| `-like` | Checks to see if there’s a textual match.\
    \ |\n| | “Meep” -like “*ep”) would be true. |\n| `-notlike` | Checks to see if\
    \ there isn’t a textual wildcard match. |\n| `-match` | Checks to see if a string\
    \ matches a part of another. |\n| `-notmatch` | Opposite of match. |\n| `-contains`\
    \ | Checks to see if any set of values contains a specific one. |\n| `-notcontains`\
    \ | Opposite of contains. |\n| `-in` | Checks to see if one value is in a set\
    \ of other values. |\n| `-notin` | Checks to see if a value is not in a given\
    \ set of values. |\n\nAs you can see, the idea here is relatively simple. All\
    \ that you’re doing is comparing two (or more) values and evaluating whether something\
    \ is true or not.\n\nSo moving on, when you start a boolean comparison, an innate\
    \ truth or falsehood is returned. This veracity can be used in order to make bigger\
    \ decisions.\n\nWhat kind of decisions can be made here, then? Well, this is where\
    \ we get to the first major part of all of this. We can use these statements of\
    \ truth or falsehood in order to make decisions. This is called using conditional\
    \ statements.\n\nThink about it. All the time, we go out and compare things -\
    \ whether they’re tangible objects or whether they’re immalleable events - and\
    \ then make a decision based off of that. For example, “if it rains this evening,\
    \ I won’t take a walk in the park.” If we were to say that, then what we would\
    \ do is to wait around until it was that evening, check to see whether or not\
    \ it’s raining, and then go to the park if it isn’t or stay home if it’s not.\
    \ Decision making is everywhere, and we do it all the time.\n\nSo how can we incorporate\
    \ this sort of decision making into our programming and our script writing? Well,\
    \ actually, it’s rather simple!\n\nLet’s say we had a variable called `$apples`\
    \ and it had the value of 1. Well, let’s say that we wanted our script to look\
    \ at the value of `$apples` and, if it’s 1, print out “I have one apple.” This\
    \ would be really easy!\n\nThe syntax of an `if` statement is like this:\n\n```powershell\n\
    if (condition) {\n    ... code here\n}\n```\n\nThe condition would be whether\
    \ or not `$apples` was equal to 1, so we just check for that.\n\n```powershell\n\
    $apples = 1\nif ($apples -eq 1) {\n    Write-Output “I have one apple.”\n}\n```\n\
    \nHowever, you might find that this lacks a little nuance. After all, what if\
    \ we didn’t have one apple? What if we had two apples, or no apples? Obviously\
    \ we couldn’t say the same thing for all of these because the grammar would be\
    \ improper! That’s entirely unthinkable. So obviously we have to allot for these\
    \ as well. This is where `elseif` and `else` statements come in handy. These are\
    \ attached to your `if` statement. Note that for logical control flow, neither\
    \ of these is needed, but they can definitely help you with decision making in\
    \ your program. They allow you to more tightly control what happens when things\
    \ don’t meet the first condition.\n\nIf you have only an `if` and an `else` statement,\
    \ then the condition in the `if` statement will be tested; if it’s true, what\
    \ is in the `if` statement will be executed. If it’s not true, what’s in the `else`\
    \ statement will be executed. The `else if` statement just allows you to test\
    \ for another condition on top of whatever you’re already testing in the first;\
    \ if the first condition fails, it’ll move to the second condition mentioned by\
    \ the `else if` statement.\n\nSo if we wanted to test to see if we had 1 apple,\
    \ more than 1 apple, or 0 apples, then we would want 1 apple to be our `if` condition,\
    \ 0 apples to be our `else if` condition (since it’s a specific condition), and\
    \ then more than 1 apple to be our `else` condition (since anything that isn’t\
    \ 1 or 0 will meet it). Here’s about how that would work out:\n\n```powershell\n\
    if ($apples -eq 1) {\n    Write-Output “I have one apple.”\n} elseif ($apples\
    \ -eq 0) {\n    Write-Output “I don’t have an apple.”\n} else {\n    Write-Output\
    \ “I have more than one apple!”\n}\n```\n\nAnd with that, you know the basics\
    \ of conditionals. Now we need to talk about the other major aspect of control\
    \ flow: loops.\n\nThe first loop we’re going to talk about is the `for` loop.\
    \ The `for` loop is intended for the user to iterate through a set until a certain\
    \ condition is met. The condition is defined when the `for` loop is defined. The\
    \ `for` loop has three parts: initialization, end condition, and incremental step.\n\
    \nLet’s say we wanted to count from 1 to 10. (Bear in mind that `++` and `--`\
    \ mean “increase by one” or “decrease by one”, respectively.) This is right about\
    \ how the `for` loop would look:\n\n```powershell\nFor ($i=1; $i -le 10; $i++)\
    \ {\n    Write-Output “$i”\n}\n```\n\nIf you were to put this in a script and\
    \ run it, it would count from 1 to 10.\n\nThere are also `while` and `do while`\
    \ loops. The only difference between the two is that `do while` loops execute\
    \ at least once, then check a condition after and execute while that condition\
    \ is met. `while` loops execute for as long as a condition is met, only if that\
    \ condition is true to start with.\n\n`do while` loops are set up like this:\n\
    \n```powershell\nDo {\n}\nWhile (condition)\n```\n\nAnd `while` loops are set\
    \ up like this:\n\n```powershell\nWhile (condition) {\n}\n```\n\nNow, let’s say\
    \ that we wanted to count from 1 to 10 using a `while` loop instead. This is going\
    \ to be a bit different of a setup. Since we aren’t iterating within the loop’s\
    \ initialization, we have to iterate within the loop itself.\n\nLet’s talk about\
    \ the logic of the loop. We’re going to want to carry out the loop for as long\
    \ as our iterator variable, let’s say `$i` again, is less than or equal to 10.\
    \ So as long as it’s less than or equal to 10, the loop will carry on. If it hits\
    \ 11, the loop terminates.\n\nThe first thing we have to do is create the variable\
    \ before the loop, otherwise the value will reset with every iteration of the\
    \ loop and it will never terminate.\n\n```powershell\n$i = 1\nWhile ($i -le 10)\
    \ {\n    $i++\n}\n```\n"
  raw: 'PowerShell’s boolean setup is very, very simple. In a lot of ways, it’s reminiscent
    of the old style of doing booleans from the C era, where booleans were literally
    a 1 or a 0, a 1 meaning true or a 0 meaning false. And in some ways, this still
    is true. For example, if you check to see if the string “false” is actually false
    in the boolean sense, it’ll be true because of the fact that it has a value that
    isn’t 0 (since it is a populated string). As you can see, it’s a little fickle.
    However, the logic underlying is very simple. What’s more is that PowerShell has
    predefined variables for $true and $false which it will automatically define things
    as when you try to see if something is true or not.


    So now it’s important that we start to talk about boolean comparisons, or boolean
    expressions. These are how you can compare one value to another and make a rational
    decision about whether or not that statement is true. This is actually extremely
    easy in PowerShell, like many other things.


    The logic underlying these is actually relatively simple. Simply think back to
    high school or college when you were solving algebraic inequalities. Remember
    how those disjointed equations would try to make you solve what could and couldn’t
    be on a graph, and then point them out? The logical comparisons of boolean expressions
    are actually rather simple in the way that they are set up.


    There are a lot of different comparison operators in PowerShell. These all have
    their own unique uses and places where they’d be the best option for comparison.
    Here are the comparison operators and their meanings.


    | -eq | Checks to see if the values are equal to one another. |


    | -ne | Checks to see if values are not equal to one another. |


    | -gt | Checks to see if left value is greater than right value. |


    | -lt | Checks to see if left value is less than right value. |


    | -ge | Checks to see if left is greater than or equal to right. |


    | -le | Checks to see if left is less than or equal to right. |


    | -like | Checks to see if there’s a textual match. |


    |  | “Meep” -like “*ep”) would be true. |


    | -notlike | Checks to see if there isn’t a textual wildcard match. |


    | -match | Checks to see if a string matches a part of another. |


    | -notmatch | Opposite of match. |


    | -contains | Checks to see if any set of values contains a specific one. |


    | -notcontains | Opposite of contains. |


    | -in | Checks to see if one value is in a set of other values. |


    | -notin | Checks to see if a value is not in a given set of values. |


    As you can see, the idea here is relatively simple. All that you’re doing is comparing
    two (or more) values and evaluating whether something is true or not.


    So moving on, when you start a boolean comparison, an innate truth or falsehood
    is returned. This veracity can be used in order to make bigger decisions.


    What kind of decisions can be made here, then? Well, this is where we get to the
    first major part of all of this. We can use these statements of truth or falsehood
    in order to make decisions. This is called using conditional statements.


    Think about it. All the time, we go out and we compare things - whether they’re
    tangible objects or whether they’re immalleable events - and then make a decision
    based off of that. For example, “if it rains this evening, I won’t take a walk
    in the park.” If we were to say that, then what we would do is wait around until
    it was that evening, check to see whether or not it’s raining, and then go to
    the park if it isn’t or stay home if it’s not. Decision making is everywhere,
    and we do it all of the time.


    So how can we incorporate this sort of decision making into our programming and
    our script writing? Well, actually, it’s rather simple!


    Let’s say we had a variable called $apples and it had the value of 1. Well, let’s
    say that we wanted our script to look at the value of $apples and, if it’s 1,
    print out “I have one apple.” This would be really easy!


    The syntax of an if statement is like this:


    if (condition) {


    ... code here


    }


    The condition would be whether or not $apples was equal to 1, so we just check
    for that.


    $apples = 1


    if ($apples -eq 1) {


    Write-Output “I have one apple.”


    }


    However, you might find that this lacks a little nuance. After all, what if we
    didn’t have one apple? What if we had two apples, or no apples? Obviously we couldn’t
    say the same thing for all of these because the grammar would be improper! That’s
    entirely unthinkable. So obviously we have to allot for these as well. This is
    where elseif and else statements come in handy. These are attached to your if
    statement. Note that for logical control flow, neither of these is needed, but
    they can definitely help you with decision making in your program. They allow
    you to more tightly control what happens when things don’t meet the first condition.


    If you have only an if and an else statement, then the condition in the if statement
    will be tested; if it’s true, what is in the if statement will be executed. If
    it’s not true, what’s in the else statement will be executed. The else if statement
    just allows you to test for another condition on top of whatever you’re already
    testing in the first; if the first condition fails, it’ll move to the second condition
    mentioned by the else if statement.


    So if we wanted to test to see if we had 1 apple, more than 1 apple, or 0 apples,
    then we would want 1 apple to be our if condition, 0 apples to be our else if
    condition (since it’s a specific condition), and then more than 1 apple to be
    our else condition (since anything that isn’t 1 or 0 will meet it). Here’s about
    how that would work out:


    if ($apples -eq 1) {


    Write-Output “I have one apple.”


    } elseif ($apples -eq 0) {


    Write-Output “I don’t have an apple.”


    } else {


    Write-Output “I have more than one apple!”


    }


    And with that, you know the basics of conditionals. Now we need to talk about
    the other major aspect of control flow: loops.


    The first loop we’re going to talk about is the for loop. The for loop is intended
    for the user to iterate through a set until a certain condition is met. The condition
    is defined when the for loop is defined. The for loop has three parts of its definition:
    the initialization of the iterator variable, where the variable that the loop
    is going to increment or decrement is created; the end condition - when this condition
    isn’t met; and the incremental step, by which the iterator variable increases
    every time the loop is iterated through.


    Let’s say we wanted to count from 1 to 10\. (Bear in mind that ++ and -- mean
    “increase by one” or “decrease by one”, respectively.) This is right about how
    the for loop would look:


    For ($i=1; $i -le 10; $i++) {


    Write-Output “$i”


    }


    If you were to put this in a script and run it, it would count from 1 to 10 in
    the console.


    There are also while and do while loops. The only difference between the two is
    that do while loops execute at least once, then check a condition after and execute
    while that condition is met. While loops execute for as long as a condition is
    met, only if that condition is true to start out with.


    Do while loops are set up like this:


    Do {


    }


    While (condition)


    And while loops are set up like this:


    While (condition) {


    }


    Now, let’s say that we wanted to count from 1 to 10 using a while loop instead.
    This is going to be a bit different of a setup. Since we aren’t iterating within
    the loop’s initialization, we have to iterate within the loop itself.


    Let’s talk about the logic of the loop. We’re going to want to carry out the loop
    for as long as our iterator variable, let’s say i again, is less than or equal
    to 10\. So for as long as it’s less than or equal to 10, the loop will carry on.
    If it hits 11, the loop terminates.


    The first thing we have to do is create the variable before the loop, otherwise
    the value will reset with every iteration of the loop and it will never terminate.


    $i = 1


    Now we need to create the beginning of the loop:


    $i = 1


    While ($i -le 10) {


    }'
