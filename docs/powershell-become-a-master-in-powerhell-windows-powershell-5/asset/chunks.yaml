    \ Windows 体验。\n\n在涵盖了脚本基础和编程逻辑之后，我们书中真正需要涵盖的最后一个内容是关于格式化和过滤的高级概念，这能够让你的脚本提升一个层阶。\n\
    \n# 第 5 章：进阶 - 过滤与格式化\n\n你将做的很多工作都是解析数据。出于这个原因，我决定用本书的一小部分来介绍解析数据的过程。\n\n## 过滤集合\n\
    \n我们要讨论的第一点是过滤集合。这对于从各种来源解析信息至关重要。通常，当你接收系统信息时，它们会以对象集合的形式存在。了解如何拆解输入给你的信息极其重要，因为只有这样你才能获取你所寻找的核心内容。\n\
    \n例如，如果你查询任何特定进程的数据，你会得到很多毫无意义的废话，并没有什么用。在大多数情况下，你无法利用这些数据整理出任何真正实用的东西。然而，如果你花时间学习如何从给定集合中过滤信息，你就可以轻松地拆解所有内容。\n\
    \n不过，PowerShell 非常方便的一点在于，它让这个过程变得极其简单。或者至少在相对意义上是简单的。例如，有很多内置的 `cmdlets` 可以帮助你完成任何所需的操作。\n\
    \n其中最著名的是 `where-object`。事实上，如果你发现自己正在与其他 PowerShell 脚本编写者或开发者交流，你可能会经常听到他们谈论它。\n\
    \n我们之前讨论过 PowerShell 中的一切都是一个对象，因为 PowerShell 是基于 `.NET Framework` 的。因此，每个对象都有一组内在值和数据，称为\
    \ `properties`（属性）。我们还讨论过这些 `properties` 是可变形的，可以根据对象以及对其执行的操作而改变，以及这些 `properties`\
    \ 是对象本身固有的内在属性。考虑到这一切，既然这些内在且本质定义的属性存在，那么一定有一种方法可以通过某些标准来过滤对象，对吧？\n\n嗯，是的。这正是\
    \ `Where-Object` cmdlet 所实现的功能。`Where-Object` cmdlet 会查看另一个 cmdlet 返回的特定集合，然后允许你根据不同的指定标准对该集合进行筛选。\n\
    \n## 管道 (Pipeline)\n\n在继续之前，我们需要简要介绍一下管道（pipeline）的概念。我们在书的开头稍微提到过它，但范围远不及现在要讨论的广。当我们之前简要触及它时，只讨论了管道在技术上能够做什么——将信息从一个地方传递到另一个地方，直到它最终到达终点（通常是输出流）。当然，这些很好，但并没有真正解释这里发生了什么。\n\
    \n在上一章中，我们讨论了函数如何返回一个特定值，以及 `cmdlets` 如何总是返回一个特定的对象。因此，我们可以理解为这种设计字面意义就像一个管道。你放入一个对象，它穿过整个管道，直到从另一端出来。\n\
    \n然而，在 PowerShell 管道中，你实际上可以让你放入管道的东西在沿途中进行一些必要的停靠。这些停靠可以改变你放入的东西的值、输出关于它的信息、报告诊断，基本上可以做各种不同的事情。最后，你的对象将带上你所寻找的所有相关信息出来。\n\
    \n为了在管道中指定一个“停靠”，并在对象从另一端出来之前将其传输到新处理过程中，你只需要输入一个竖线字符：`|`\n\n一旦解释清楚并且你开始理解，这一切都非常简单，但如果你发现完全理解管道概念是如何运作的需要费费一点精力，请不要感到沮丧。起初可能会有点复杂。基本上，只需记住，在\
    \ PowerShell 指令中执行的第一条命令（或脚本中的一行）中，你正在生成一个对象（或对象集合），你可以实际上将其传递并对其执行过程。\n\n## 实际过滤\n\
    \n这在过滤方面意味着什么？嗯，这意味着我们首先得有一个想要传递给过滤器的东西。为了解释这一点，假设我们想要过滤 `Get-Process` cmdlet\
    \ 的结果，正如我们之前讨论过的，它返回当前计算机上运行的所有进程。现在，我们的语句看起来像这样：\n\n```powershell\nGet-Process\n\
    ```\n\n现在，在我们过滤之前，让我们看看我们实际上可以根据什么来过滤它。这种方法很简单。使用 `Get-Member` cmdlet 来返回对象的成员，即包含在对象中的方法和属性。现在，我们不能只运行\
    \ `Get-Member`。我们在这里需要的是运行 `Get-Process`，将其通过管道传递给 `Get-Member`。在这种情况下，你会在 PowerShell\
    \ 中输入：\n\n```powershell\nGet-Process | Get-Member\n```\n\n然后按回车。结果将类似于：\n\n| Name\
    \ | MemberType | Definition |\n| :--- | :--- | :--- |\n| Handles | AliasProperty\
