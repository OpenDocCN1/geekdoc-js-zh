    `Monad` 首次公开发于 2005 年夏天，并在随后的那年里进行了多次更新。2006 年，微软推出并宣布 `Monad` 将更名为 `Windows PowerShell`。这在该项目的信誉度方面是一个巨大的推动，因为它使其成为了系统管理和通用信息技术工作的主要工具。`PowerShell`
    暗示了比 `Monad` 大得多的东西——`PowerShell` 暗示了力量。


    `PowerShell` 的第一个版本于 2007 年第一季度正式发布。在开发 `PowerShell` 第一版本的同时，`PowerShell` 2.0
    版本的工作也开始了。`PowerShell` 2.0 版本于 2009 年夏天与 `Windows 7` 同时正式发布，并成为了其主要组成部分。在初始发布后不久，又发布了兼容早期版本
    Windows 的版本。


    自 2009 年以来，`PowerShell` 迈出的最大一步是成为开源并移植到多个不同的平台。2016 年夏天，`PowerShell` 的代码向世界发布供所有人查看，`Linux`、`CentOS`
    和 `macOS` 等其他操作系统的用户终于能够充分利用这个聪明的 shell 程序。


    所以到这里，你可能会问是什么让 `PowerShell` 与众不同。嗯，基本上有很多不同点。


    第一也是最重要的一点是它与 `.NET Framework` 深度集成。如果你不知道 `Microsoft .NET` 是什么，它为语言之间的相互协作提供了一个基础设施，本质上是微软目前最重要的产品之一。那么它是如何与
    `PowerShell` 集成的呢？嗯，你可以编写 `cmdlets`——使用 `.NET Framework` 语言编写的程序——这些程序实际上是为与 `PowerShell`
    工作而设计的。然而，`cmdlets` 的工作方式也不同。它们也可以从 `PowerShell` 中运行。因此，你不仅可以用 `.NET` 语言编写 `Cmdlets`，而且每当你使用
    `PowerShell` 并在其中执行某些命令以完成不同任务的命令时，你实际上也在调用运行时设置的 `Cmdlets`。此外，`PowerShell` 中创建的每一个对象都是
    `.NET` 对象，这意味着它将像 `.NET` 对象一样工作，具有其每一个方法和类属性。


    另一个不同之处是 `PowerShell` 实现了管道（pipeline）的概念。如果你曾经接触过 `Unix` 管道，那么你对它的工作原理可能有一个相当的了解。基本上，发生的情况是一个
    `cmdlet` 的结果作为参数（或输入数据）传递给另一个 `cmdlet`。


    也许让 `PowerShell` 脱颖而出并成为极佳工具的最后一点是其极其丰富的脚本语言。使用这种脚本语言，你可以自动化大量的不同的事情。这种脚本语言与 `Batch`
    等语言编写的脚本相比，实际上也非常强大。例如，它支持通用控制流，如循环和条件判断（稍后会介绍），允许人们捕获和抛出异常，并与 `.NET` 框架完全集成。


    随着 `Windows Server 10` 越来越多地利用和集成它，对于从事信息技术工作的人来说，拥有 `PowerShell` 的知识正变得越来越重要。`PowerShell`
    的优点在于它是随 `Windows` 自动自带的，所以你不需要过多设置。但是，如果你有另一个操作系统，正如我所说的，`PowerShell` 是开源的，并且很可能适用于你正在使用的操作系统。


    # 第 2 章


    ## PowerShell 命令


    正如我之前提到的，`PowerShell` 最迷人的特征之一是它的 `cmdlets` 系统。确实，这个系统是它最重要且不可或的一部分之一。使用命令行 shell
    的全部目的是让你直接与计算机、服务器、路由器或其他任何设备对话，并可能执行原本无法的操作。命令行仅仅作为你与计算机或硬件之间最直接的通信线路，而没有桌面层提供的抽象层。然而，这种高程度的控制也意味着高得的学习曲线。幸运的是，`PowerShell`
    让这并没有变得太困难。在我们深入之前，我认为有必要简要解释一下命令行是如何运作的。


    `PowerShell` 中的命令有两种形式：`cmdlets` 和 `aliases`（别名）。`Aliases` 会执行其所属的 `cmdlet` 的操作，所以不用太担心它们之间的区别。`aliases`
    存在是为了让习惯了如 `Unix Shell` 或旧版 Windows 命令行等其他 shell 的人们在使用。`cmdlets` 的方便之处在于，虽然其他
    shell 命令倾向于使用非常古老或难以理解的名字，但 `cmdlet` 的名称遵循非常严格的顺序，这使得它们非常易读。


    总之，现在我将逐一介绍主要的 `cmdlets` 及其 `aliases`，并解释每一个。然而，请注意，由于 `cmdlets` 可以被创建的，而且 `PowerShell`
    是一个与 `.NET` 深度集成的巨大程序，存在数百种不同的 `cmdlets`。在书中介绍每一个都是不实际的，因为你根本不需要它们中的每一个。我将做的只是为你提供那些最相关且你最可能需要的命令。


    -   `Get-ChildItem` - 这个命令也可以通过 `gci`、`dir` 或 `ls` 输入。这个名字听起来可能有点奇怪，但如果你用过其他 shell，你就完全清楚这个命令的作用了。它的作用是查看你在硬盘中的所在位置，并列出该文件夹内的每一个文件和目录。


    -   `Test-Connection` - 这个在其他系统中被称为 `ping`，但奇怪的是它在 `PowerShell` 中没有别名。它的作用是联系另一台机器并尝试获取响应。这可以帮助你判断两者是否通过互联网或其他方式建立了连接。这是一个非常实用的需要使用的
    `cmdlet`。


    -   `Get-Content` - 这个在其他系统中被称为 `gc`、`type` 和 `cat`，你可以毫无问题的为它输入这些相同的别名。它的作用仅仅是获取文件的内容以便进行处理。


    -   `Get-Command` - 如果你想查看所有可用的命令，只需使用此 `cmdlet`（或别名 `gcm`）。在 `PowerShell` 中输入此
    cmdlet 后，你将看到一个极其长的命令列表，每条命令都执行一个独特且强大的功能来帮助你完成工作。如果你有时间和耐心，我敦促你使用 `Get-Command`
    并探索用它能做什么。


    -   `Get-Help` - 这是一个非常有用的命令。在旧的 Windows 命令行中，它被称为 `help`，在 `Unix` shell 中被称为
    `apropos` 和 `man`；`help` 和 `man` 是在 `PowerShell` 中可以使用的两个别名（如果你不想输入 `Get-Help`
    的话）。这个命令的作用正正如其名——为指定的命令提供帮助。你只需要在名称后面说明你想获取帮助和详情的 `cmdlet`，例如：


    ```

    Get-Help Get-Command

    ```


    然而，如果你想了解使用该命令的其他方法，也可以直接输入 `Get-Help`。它实际上非常多功能，所以我鼓励你了解可以使用它的不同方式。


    -   `Clear-Host` - 这个命令在 Windows 上被称为 `cls`，在 `Linux` 和 `Mac` 等 `Unix` 系统上被称为
    `clear`，如果你不想完整输入 `Clear-Host`，可以输入其中任何一个。这个命令只是清除控制台并给你一个空白的画布。


    '
- fmt: '

    # `Copy-Item`

    - This command is as straightforward as the name implies. On the Windows command
    line, this command was known as `copy`, and on Unix shells it was known as `cp`.
    Both of these terms may be used as an alias, and so may the term `cpi`. This command
    allows you to designate a file or directory, as well as a target location. Upon
    using the command, the file or directory will be copied over to the target location.
    This can be extremely useful for, for example, making backups of important files.


    # `Move-Item`

    This command is known on Windows command lines as `move` and on Unix shells as
    `mv`. The command is functionally similar to the copy command. However, instead
    of leaving the current files and directory behind and making a carbon copy of
    it, it instead will move them entirely and they will no longer be at the current
    location.


    # `Remove-Item`

    This command has a huge number of names, so let me delegate through those which
    can be used. On the old Windows command line, this command was known as `del`,
    `erase`, `rmdir`, and `rd`. On Unix shells, the command is known as `rmdir` and
    `rm`. The aliases for this command are all of the aforementioned, as well as one
    more: `ri`. So, you can invoke this command was `del`, `erase`, `rmdir`, `rd`,
    `rm`, and `ri`. In case you’ve never been told before, you need to be incredibly
    careful with this command, as it is very, very powerful. If you aren’t careful
    with it, you could accidentally do something like systematically delete your entire
    hard drive, and doing that isn’t fun. Play it safe with this command and, honestly,
    as you get to know it, I would practice with a Unix shell in a virtual machine
    running a Linux distribution that way no real damage can be done. This command
    is very infamous, so I’m simply giving you fair warning now that if you aren’t
    careful, you can mess up big time with it.


    # `Rename-Item`

    This command is extremely straightforward. It allows you to rename files or directories.
    It is also known by the aliases `mi`, `ren`, and `mv`.


    # `Get-Location`

    This command is another which does pretty much exactly what it says - noticing
    a pattern? On the old Windows command line, this was known as `cd`, and on Unix
    shells it was known as `pwd`. Both of these will work as aliases, as will the
    term `gl`. All this does is list the current working directory.


    # `Push-Location`

    This is a little bit more complicated. This lets you keep a running list of directories
    on the stack. In case you don’t know what a stack is in computer science, a stack
    is essentially a list of data that can be updated with new values. When you add
    a new value, that same value must also be the first to be taken off. So if you
    have the values `3`, `1`, and `6`, and you want to add the value `8`, your stack
    will look like this: `3, 1, 6, 8`. This will make more sense in a second, but
    this essentially does that while storing the location instead of some arbitrary
    numeric value. On Unix and Windows alike, this command has been known as `pushd`,
    and this alias is the one which PowerShell uses.


    # `Pop-Location`

    This is the counterpart to the `push-location` cmdlet. This will change your working
    directory to that which was most recently added to the stack - popping that value
    off of the stack, if you will. So remember that: you push values on, you pop values
    off. This removes the directory from the stack, so if you want it to stay there,
    you’ll have to add it to the stack again. The command for this on Windows and
    Unix alike has been `popd`, and this is the command which PowerShell uses as well.


    # `Set-Location`

    This is altogether one of the most important commands for navigating your computer
    by way of the command line and any sort of command line shells. I really cannot
    stress the importance of this command enough - it is essentially the end-all be-all
    of command line navigation and knowing how to properly use it is essential. What
    this lets you do is change location on your hard drive. You can either enter a
    specific location on the hard drive, like a directory address, or you can just
    name a directory within the directory that you’re in. (If you don’t know exactly
    what directories are in whatever folder you’re in, make sure that you use the
    `Get-ChildItem` cmdlet in order to to list the directories.) In Windows and Unix
    command lines, this command has always been known as `cd`. It’s also referenceable
    in Windows by the term `chdir`. Both of these terms will work as an alias for
    the `Get-ChildItem` cmdlet. However, you may also use the term `sl` if you so
    desire.


    # `Tee-Object`

    This has nothing to do with golf and if you think it does then you are dumb. Rather,
    this command will send the given input to a file or a value, then send it along
    the pipeline. Sometimes - but not always - this will just mean the output stream,
    meaning it will be printed in your command line window. However, it may also be
    passed onto the next command in the pipeline, if there is another. The alias for
    this is simply `tee`, and it’s relatively new to Windows (it didn’t exist in older
    versions of the command line shell).


    # `Write-Output`

    This command does pretty much exactly what it sounds like it would do. It writes
    the given output to the output stream, generally the console window. The aliases
    for this term are `echo`, from the Windows and Unix command line shells, and `write`.


    # `Get-Process`

    This can be relatively useful, too. You know how you can launch the Task Manager
    with Ctrl+Alt+Delete and see all of the processes that are currently running on
    your computer (and kill them if necessary)? This lists all of the processes from
    within PowerShell, which makes it really easy to use. On Unix shells, this command
    was known as `ps`, and on Windows shells, it has been known as `tasklist`. Either
    of these will work. So will `gps`.


    # `Stop-Process`

    This is the command I was referring to in the last paragraph. Let’s face it, sometimes
    programs completely quits or stops working as expected, or maybe you’re trying
    to launch one that connects through the internet and another is blocking the necessary
    port but you can’t quit it. This is where `Stop-Process` comes in handy. This
    command has has been known as `kill`, and this name carries over as an alias.
    You can also use `spps` as an alias.


    # `Select-String`

    This will return the strings in a given file or input stream (if you don’t know
    what strings are, you’ll find out next chapter) to the pipeline, normally to the
    output stream. It will return the entire line that a string is on, so if I did
    a `Select-String` for `pack` over a file with a bunch of random words in it, it
    would return not only `pack` but also `backpack`, `unpack`, `repack`, and so forth.
    The only alias for this cmdlet is `sls`.


    # `Set-Variable`

    This command will allow you to create variables or change their value. (More on
    this in the next chapter.) The aliases are simply `sv` and `set`.


    # `Get-Member`

    This is a super important command that will allow you to see the methods and values
    within a given object. This may not make sense right now but it will. Remember
    this one, you will need it.


    # `Invoke-WebRequest`

    This one will pull data from the internet and send it to the pipeline. On Unix
    shells, this command has historically been known as `wget` and `curl`. On older
    Windows command line shells, the command never actually existed. The aliases for
    this one are `curl`, `wget`, and `iwr`.


    Of course, this is nowhere near all of the cmdlets. These are just the most pertinent
    and important ones for what you’ll most likely be doing starting out.


    As I said before, if you want a far more complete list, you can also use the `get-command`
    cmdlet in order to get a full list and `get-help` for any that you don’t entirely
    understand.

    '
