    # 引言


    恭喜下载了 PowerShell，感谢你的支持。


    接下来的章节将讨论如何在你的计算机上安装和使用 PowerShell。更重要的是，它将准确告诉你 PowerShell 是什么，以及使用它的多种方法。


    市场上有许多关于这个主题的书，再次感谢你选择这一本！我们尽了努力确保它包含尽可能多的有用信息，请尽情享受！


    # 第 1 章

    ## 什么是 PowerShell？


    到目前，你已经购买了这本书并想要深入研究其内容，开始使用功能强大的 PowerShell。然而，在考虑深入研究内容最核心的部分之前，我们必须先讨论一些基本问题。


    例如，我不完全确定你拿起这本书的原因是什么。也许你只是真的对 PowerShell 是什么以及你用它能做到的所有事情感到好奇。也许你通过工作或学校听过它，并需要充足的机会在操作此应用程序方面脱颖而出。此外，你可能只是一个在教程或论坛上读到
    PowerShell 的爱好者，正在寻找一个合适的机会开始使用这个极具活力的工具。那么，这本书将教你恰恰做到这一点。但是，在我们开始学习“怎么做”之前，我们真的需要花一些时间来看看“是什么”。


    那么，什么是 PowerShell 呢？本质上，PowerShell 是微软开发的一个工具，旨在让人们通过命令行和一些编程知识来处理配置并自动化任务。最近，PowerShell
    也已适用于其他操作系统。


    PowerShell 还包含一种内置的脚本语言。这种脚本语言允许你构建小型程序，以自动化计算机上不同的任务。这种脚本能力赋予了 PowerShell 许多著名功能，并使其成为你需要执行的所有自动化任务的完美选择。


    我想，到目前为止，我还没有完全清楚 PowerShell 是什么。我现在就解决这个问题。你看，在发布的每一个 Windows 版本中，用户都有一种方法通过命令行与工具直接交互。这些界面方法被专门称为
    shell（壳）。通过使用 shell，你可以直接向计算机输入命令，这将让你能够轻松地完成某些事情，或者以以前所未过的控制水平来操作。传统的 shell 有一种名为
    `batch` 的脚本语言，在 Windows、Linux 或 Mac 等大多数命令行界面中通用的。`batch` 文件是基础脚本，可以运行以自动执行预先写好的命令行中的某些任务。


    但从任何角度来看，`batch` 都极其简单。甚至是愚蠢地简单。因此，`Batch` 不允许生成超出执行命令和遵循非常非常基础逻辑之外的脚本。


    微软改善脚本和命令行壳状况的首次尝试出现在 1998 年，当时他们在推出操作系统 `Windows 98` 的同时提出了 `Windows Script Host`。这通过对
    `Active Script` 的兼容性，允许使用 `VBScript` 等语言编写脚本。这意味着在命令行编程和任务自动化方面迈出了巨大的一步。尽管迈出了这一大步，该系统仍然远未完善；例如，它没有被内置到命令行
    shell 中。出于同样的目的，关于它的文档非常难以找到，这意味着想要使用它的人处处困难，而且几乎没有人能成为“大师”。


    最糟糕的是，它存在安全漏洞。利用 `Windows Script Host` 在它们本不应该出现的地方构建并执行计算机病毒是轻而易举的。这导致 `Windows
    Script Host` 迅速被视为系统的一个重大损失。


    在 `Windows Script Host` 相对失败后，微软决定他们需要转变方向，开始为用户提供一种管理命令行的新方法；一种能让 shell 真正具有价值的统一方式。大约是在那时，被称为
    `Monad` 或 `Microsoft Shell`（微软壳）的 shell 开始问世。这些想法最早在 2002 年夏天就开始发表了。


    `Monad` 是非常棒的，因为它完全是不同的东西。`Monad` 带来了一个极具扩展性的命令行——也就是说，你可以轻松地为其添加内容并使其执行你需要的任何任务——也就是说，在某种意义上，它是全功能的。我所指的“全功能”是指
    `Monad` 承诺能够执行大量不同的行政职责。

    '
- fmt: '

    The first public release of `Monad` happened in the summer of 2005 and was updated
    quite a bit throughout the year following. In 2006, Microsoft came out and said
    that `Monad` would instead be called `Windows PowerShell`. This was a huge boost
    for the project in terms of credibility as it positioned it to be a major tool
    for systems management and information tech jobs in general. `PowerShell` intimated
    something much bigger than `Monad` did - `PowerShell` intimated strength.


    The first version of `PowerShell` was formally released in the first quarter of
    2007. While work on the first version of `PowerShell` was ongoing, work on `PowerShell`
    version 2.0 started to take place as well. `PowerShell` version 2.0 was released
    formally in the summer of 2009 alongside `Windows 7`, which it became a major
    part of. A little bit after its initial release, versions compatible with earlier
    forms of Windows were released.


    Since 2009, the biggest step forward for `PowerShell` was when it became open
    source and ported to multiple different platforms. In the summer of 2016, `PowerShell`’s
    code was released to the world for all to see and users of other operating systems
    like `Linux`, `CentOS`, and `macOS` were finally able to take full advantage of
    the clever shell program.


    So at this point, you may be asking what makes `PowerShell` different. Well, there
    are a whole lot of things, basically.


    The first and foremost is that it is heavily integrated with the `.NET Framework`.
    In case you don’t know what `Microsoft .NET` is, it offers an infrastructure for
    languages to work with one another and is essentially one of Microsoft’s most
    important offerings right now. So how does this integrate with `PowerShell`? Well,
    one can write `cmdlets` - programs written using `.NET Framework` languages -
    that are actually made to work with `PowerShell`. However, `cmdlets` also work
    in a different way. They can also be run from `PowerShell`. Therefore, not only
    can you write `Cmdlets` in `.NET` languages, but whenever you use the `PowerShell`
    and execute certain commands in `PowerShell` in order to do different things,
    you are actually invoking `Cmdlets` that are set up at runtime, as well. Beyond
    this, every single object created in `PowerShell` is a `.NET` object, which means
    it will work as `.NET` objects do, with every method and class attribute thereof.


    Another way that it’s different is that the `PowerShell` implements the notion
    of a pipeline. If you’ve ever worked with `Unix` pipelines then you probably have
    a moderate idea of how this works. Essentially, what happens is that the result
    of one `cmdlet` is given as an argument (or input data) to another `cmdlet`.


    Perhaps the final thing that sets `PowerShell` apart and makes it a fantastic
    tool is the extremely verbose scripting language. Using the scripting language,
    you can automate a huge number of different things. The scripting language, too,
    is actually relatively full-featured compared to scripts written in languages
    such as `Batch`. For example, it supports general control flow like looping and
    conditionals (more on this later), allows one to catch and throw exceptions, and
    is entirely integrated with the `.NET` framework.


    Having a proper knowledge of `PowerShell` is becoming more and more important
    for people working in information technology now that `Windows Server 10` increasingly
    utilizes and integrates it. The good thing about `PowerShell` is that `PowerShell`
    comes automatically with `Windows`, so you don’t need to set it up too much. However,
    if you do have another operating system then, as I’ve already said, `PowerShell`
    is open source and will more than likely be available for the operating system
    that you’re using.


    # Chapter 2


    ## PowerShell Commands


    As I’ve said before, one of the most charming things about `PowerShell` is its
    system of `cmdlets`. Indeed, this system is one of the most important and integral
    things about it. The entire reason for using a command line shell is so that you
    can speak directly to the computer, server, router, or whatever and potentially
    do things that you couldn’t do otherwise. The command line simply serves as the
    most direct line of communication between you and your computer or hardware without
    the layer of abstraction provided by the desktop. With this higher degree of control,
    however, also comes a far higher learning curve. Fortunately, though, `PowerShell`
    keeps this from being all too difficult. Before we jump into this, I feel that
    it’s necessary that I explain briefly how command lines even work.


    Commands in `PowerShell` have two forms. There are `cmdlets` and there are `aliases`.
    `Aliases` will perform the action of the `cmdlet` for which they are an alias,
    so don’t worry about the difference too much. The reason the `aliases` exist is
    in order to make the shell easier to use for people who are used to other sorts
    of shells like the `Unix Shell` or like the old Windows command line. The handy
    thing about `cmdlets` is that while other shell commands tend to have rather archaic
    or hard to understand names, `cmdlet` names follow a very strict order that serves
    to make them very readable.


    Anyhow, now I’m going to go through the major `cmdlets` and their `aliases` one
    by one, explaining each. However, note that since `cmdlets` can be created and
    since the `PowerShell` is a huge program with a huge integration with `.NET`,
    there are hundreds of different `cmdlets`. It simply wouldn’t be practical to
    go through each and every one of them in this book when you quite simply aren’t
    going to need all of them. What I’m going to do instead is simply give you those
    which are most pertinent and which you’ll most likely need.


    - `Get-ChildItem` - This one can also be entered as `gci`, `dir`, or `ls`. The
    name might sound a little weird, but if you’ve ever used other shells, you know
    exactly what this command does. What it does is look to see where you are in the
    hard drive and lists every single file and directory within that folder.


    - `Test-Connection` - This one is known on other systems as `ping`, but doesn’t
    have an alias in `PowerShell` curiously. What it does is contact another machine
    and tries to get a response back. This will help you to determine whether there
    is a connection established between the two, either by the internet or otherwise.
    This is a very useful `cmdlet` to know how to use.


    - `Get-Content` - This one is known on other systems as `gc`, `type`, and `cat`,
    and these same aliases may be entered for it with no problem. What this does is
    simply get the content of a file for something to be done with it.


