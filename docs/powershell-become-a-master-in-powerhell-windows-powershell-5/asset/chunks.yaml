    # `Copy-Item`

    - 此命令正如其名称一样，直观易懂。在 Windows 命令行中，此命令被称为 `copy`，而在 Unix Shell 中，它被称为 `cp`。这两个术语都可以作为别名，`cpi`
    一词也是如此。此命令允许你指定一个文件或目录，以及一个目标位置。使用该命令后，文件或目录将被复制到目标位置。这对于某些操作非常有用，例如为重要文件制作备份。


    # `Move-Item`

    此命令在 Windows 命令行中被称为 `move`，在 Unix Shell 中被称为 `mv`。该命令在功能上与 `copy` 命令相似。然而，它不是留下当前的文件和目录并创建它们的副本，而是将它们完全移动，它们将不再存在于当前位置。


    # `Remove-Item`

    此命令有许多名称，所以让我逐一列举一下可以使用的名称吧。在旧的 Windows 命令行中，此命令被称为 `del`、`erase`、`rmdir` 和 `rd`。在
    Unix Shell 中，该命令被称为 `rmdir` 和 `rm`。此命令的别名包含了上述所有名称，此外还有一个名称：`ri`。因此，你可以通过 `del`、`erase`、`rmdir`、`rd`、`rm`
    和 `ri` 来调用此命令。如果你以前从未被告知过，你需要对这个命令极其小心，因为它非常、非常强大。如果你不小心，可能会意外执行类似系统性删除整个硬盘的操作，那可不好好玩。使用此命令时要谨慎，诚实地说，随着你对它的了解，我建议你在运行
    Linux 发行版的虚拟机中使用 Unix Shell 进行练习，这样就不会造成任何实际损坏。这个命令非常臭名昭著，所以我现在给你警告：如果你不小心，可能会用它出大错。


    # `Rename-Item`

    此命令非常直观。它允许你重命名文件或目录。它也被别名 `mi`、`ren` 和 `mv` 所知。


    # `Get-Location`

    此命令是另一个完全如其描述的命令——发现规律了吗？在旧的 Windows 命令行中，这被称为 `cd`，而在 Unix Shell 中被称为 `pwd`。这两者都可以作为别名使用，`gl`
    一词也是如此。此命令的作用仅仅是列出当前的工作目录。


    # `Push-Location`

    这个稍微复杂一点。它允许你在栈上保留一个运行中的目录列表。如果你不知道计算机科学中什么是栈（stack），栈本质上是一个可以用新值更新的数据列表。当你添加一个新值时，该值也必须是第一个被取的。如果你有值
    `3`、`1` 和 `6`，并且你想添加值 `8`，那么你的栈看起来像这样：`3, 1, 6, 8`。这几秒后会更有意义，但它本质上是在存储位置而不是某个任意数值。无论在
    Unix 还是 Windows 上，此命令一直被称为 `pushd`，而 PowerShell 使用的就是这个别名。


    # `Pop-Location`

    这是 `push-location` 命令的对应项。它会将你的工作目录更改为最近添加到栈中的目录——可以说是从栈中“弹出”那个值。所以记住：你推入（push），然后弹出（pop）。这会将目录从栈中移除，所以如果你想让它留在那里，就必须再次添加到栈中。在
    Windows 和 Unix 上，该命令一直是 `popd`，这也是 PowerShell 使用的命令。


    # `Set-Location`

    这绝对是通过命令行及任何类型的命令行 Shell 导航计算机最重要的命令之一。我真的无法强调这个命令的重要性有多大——它本质上是命令行导航的终极手段，知道如何正确使用它至关重要。它允许你更改硬盘上的位置。你可以输入硬盘上的某个特定位置（例如目录地址），或者直接命名你当前所在目录内的某个目录。（如果你不确定你所在的文件夹里具体有哪些目录，请确保你使用
    `Get-ChildItem` 命令来列出这些目录。）在 Windows 和 Unix 命令行中，此命令一直被称为 `cd`。在 Windows 中也可以通过
    `chdir` 一词进行引用。这两个术语都可以作为 `Get-ChildItem` 命令的别名。不过，如果你愿意，也可以使用 `sl` 一词。


    # `Tee-Object`

    这与高尔夫球（golf）没有任何关系，如果你认为有，那你就太笨了。相反，此命令将给定的输入发送到文件或值，然后将其发送到管道（pipeline）。有时——但并非总是——这仅仅意味着输出流，即它将在你的命令行窗口中打印。然而，如果管道中还有下一个命令，它也可以传递给该命令。它的别名简单就是
    `tee`，它对 Windows 来说是相对新的（在旧版本的命令行 Shell 中不存在）。


    # `Write-Output`

    此命令的作用正如它听起来的一样。它将给定的输出写入输出流（通常是控制台窗口）。该术语的别名有来自 Windows 和 Unix 命令行 Shell 的 `echo`
    以及 `write`。


    # `Get-Process`

    此命令的作用几乎正如它描述的一样。它列出当前运行的所有进程（并在需要时杀死它们）？这也非常有用。在 Unix Shell 中，此命令被称为 `ps`，而在
    Windows 中它被称为 `tasklist`。这两者都可以工作，`gps` 也是如此。


    # `Stop-Process`

    这就是我在上一段落中提到的命令。面对现实，有时程序会完全停止或不符合预期，或者你正在尝试连接一个被阻塞的端口，这时 `Stop-Process` 就派上用场了。此命令一直被称为
    `kill`，这个名称也作为别名存在。你也可以使用 `spps` 作为别名。


    # `Select-String`

    这将给定文件或输入流中的字符串（如果你不知道字符串是什么，将在下一节介绍）返回到管道，通常是到输出流。它将返回字符串所在的整行，因此如果我在一个包含大量随机单词的文件上对
    `pack` 进行字符串搜索，它不仅会返回 `pack`，还会返回 `backpack`、`unpack`、`repack` 等。此命令的唯一别名是 `sls`。


    # `Set-Variable`

    此命令允许你创建变量或更改其值。（更多内容见下一节。）别名简单为 `sv` 和 `set`。


    # `Get-Member`

    这是一个非常重要的命令，它允许你查看给定对象中的方法（methods）和值（values）。这现在可能没意义，但之后你会明白的。记住这个，你需要它的。


    # `Invoke-WebRequest`

    这一个将从互联网抓取数据并发送到管道。在 Unix Shell 中，此命令历史上被称为 `wget` 和 `curl`。在旧的 Windows 命令行中，该命令从未存在过。此命令的别名有
    `curl`、`wget` 和 `iwr`。


    当然，这远不是所有的命令。这些只是你刚开始最可能用到的最相关、最重要的命令。


    正如我之前所说，如果你想要一个更完整的列表，你还可以使用 `get-command` 命令来获取列表，并对任何你不完全理解的命令使用 `get-help`。


