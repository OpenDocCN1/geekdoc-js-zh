    files or directories. It is also known by the aliases mi, ren, and mv.


    Get-Location - This command is another which does pretty much exactly what it
    says - noticing a pattern? On the old Windows command line, this was known as
    cd, and on Unix shells it was known as pwd. Both of these will work as aliases,
    as will the term gl. All this does is list the current working directory.


    Push-Location - This is a little bit more complicated. This lets you keep a running
    list of directories on the stack. In case you don’t know what a stack is in computer
    science, a stack is essentially a list of data that can be updated with new values.
    When you add a new value, that same value must also be the first to be taken off.
    So if you have the values 3, 1, and 6, and you want to add the value 8, your stack
    will look like this: 3, 1, 6, 8\. This will make more sense in a second, but this
    essentially does that while storing the location instead of some arbitrary numeric
    value. On Unix and Windows alike, this command has been known as pushd, and this
    alias is the one which PowerShell uses.


    Pop-Location - This is the counterpart to the push-location cmdlet. This will
    change your working directory to that which was most recently added to the stack
    - popping that value off of the stack, if you will. So remember that: you push
    values on, you pop values off. This removes the directory from the stack, so if
    you want it to stay there, you’ll have to add it to the stack again. The command
    for this on Windows and Unix alike has been popd, and this is the command which
    PowerShell uses as well.


    Set-Location - This is altogether one of the most important commands for navigating
    your computer by way of the command line and any sort of command line shells.
    I really cannot stress the importance of this command enough - it is essentially
    the end-all be-all of command line navigation and knowing how to properly use
    it is essential. What this lets you do is change location on your hard drive.
    You can either enter a specific location on the hard drive, like a directory address,
    or you can just name a directory within the directory that you’re in. (If you
    don’t know exactly what directories are in whatever folder you’re in, make sure
    that you use the Get-ChildItem cmdlet in order to to list the directories.) In
    Windows and Unix command lines, this command has always been known as cd. It’s
    also referenceable in Windows by the term chdir. Both of these terms will work
    as an alias for the Get-ChildItem cmdlet. However, you may also use the term sl
    if you so desire.


    Tee-Object - This has nothing to do with golf and if you think it does then you
    are dumb. Rather, this command will send the given input to a file or a value,
    then send it along the pipeline. Sometimes - but not always - this will just mean
    the output stream, meaning it will be printed in your command line window. However,
    it may also be passed onto the next command in the pipeline, if there is another.
    The alias for this is simply tee, and it’s relatively new to Windows (it didn’t
    exist in older versions of the command line shell.)


    Write-Output - This command does pretty much exactly what it sounds like it would
    do. It writes the given output to the output stream, generally the console window.
    The aliases for this term are echo, from the Windows and Unix command line shells,
    and write.


    Get-Process - This can be relatively useful, too. You know how you can launch
    the Task Manager with Ctrl+Alt+Delete and see all of the processes that are currently
    running on your computer (and kill them if necessary)? This lists all of the processes
    from within PowerShell, which makes it really easy to use the command which follows
    this one when you need to. On Unix shells, this command was known as ps, and on
    Windows shells, it has been known as tasklist. Either of these will work. So will
    the command gps.


    Stop-Process - This is the command I was referring to in the last paragraph. Let’s
    face it, sometimes computers are terrible. Sometimes a program completely quits
    working or stops working as expected, or maybe you’re trying to launch one program
    that connects through the internet and another is blocking the necessary port
    but you can’t quit it. This is where the Stop-Process command comes in handy.
    You will use the process name as listed in the list given by the Get-Process cmdlet.
    After that, the process will have been suspended and killed. In Windows and Unix
    command line shells alike, this has been known as kill, and this name carries
    over as an alias. You can also use spps as an alias.


    Select-String - This will return the strings in a given file or input stream (if
    you don’t know what strings are, you’ll find out next chapter) to the pipeline,
    normally to the output stream. It will return the entire line that a string is
    on, so if I did a Select-String for pack over a file with a bunch of random words
    in it, it would return not only pack but also backpack, unpack, repack, and so
    forth. The only alias for this cmdlet is sls.


    Set-Variable - This command will allow you to create variables or change their
    value. (More on this in the next chapter.) The aliases are simply sv and set.


    Get-Member - This is a super important command that will allow you to see the
    methods and values within a given object. This may not make sense right now but
    it will. Remember this one, you will need it.


    Invoke-WebRequest - This one will pull data from the internet and send it to the
    pipeline. On Unix shells, this command has historically been known as wget and
    curl. On older Windows command line shells, the command never actually existed.
    The aliases for this one are curl, wget, and iwr.


    Of course, this is nowhere near all of the cmdlets. These are just the most pertinent
    and important ones for what you’ll most likely be doing starting out.


    As I said before, if you want a far more complete list, you can also use the get-command
    cmdlet in order to get a full list and get-help for any that you don’t entirely
    understand.'
