  trans: "\nPowerShell 的布尔值设置非常、非常简单。在很多方面，它让人想起 C 时代的旧式布尔处理方式，当时布尔值字面上量就是 1 或 0，1\
    \ 表示真（true），0 表示假（false）。在某些情况下，这仍然是事实。例如，如果你检查字符串“false”在布尔意义上是否真的为假，它将是为真，因为其拥有一个非\
    \ 0 的值（因为它是一个非空字符串）。如你所见，它有点反复无常。然而，其底层的逻辑非常简单。此外，PowerShell 为 `$true` 和 `$false`\
    \ 预定义了变量，当你尝试判断某个值是否为真时，它会自动定义这些值。\n\n现在，我们要开始讨论布尔比较，或者布尔表达式。通过这些表达式，你可以比较一个值和另一个值，并对该陈述是否真实做出合理的判断。在\
    \ PowerShell 中，这实际上像许多事情一样非常简单。\n\n这些背后的逻辑实际上相对简单。回想一下高中或大学解决代数不等式的时光。还记得那些孤立的方程是如何试图让你解决图上哪些部分可以、哪些不能存在，然后指出它们的吗？布尔表达式的逻辑比较在设置方式上实际上相当简单。\n\
    \nPowerShell 中有许多不同的比较运算符。它们都有自己独特的用途，并且在某些情况下是比较的最佳选择。以下是比较运算符及其含义。\n\n| 运算符\
    \ |  |\n| :--- | :--- |\n| `-eq` | 检查两个值是否相等。 |\n| `-ne` | 检查两个值是否不等。 |\n| `-gt`\
    \ | 检查左侧值是否大于右侧。 |\n| `-lt` | 检查左侧值是否小于右侧。 |\n| `-ge` | 检查左侧大于或等于右侧。 |\n| `-le`\
    \ | 检查左侧小于或等于右侧。 |\n| `-like` | 检查是否存在文本匹配。 |\n| | “Meep”-like “*ep”）将为真。 |\n\
    | `-notlike` | 检查是否存在文本通配符匹配。 |\n| `-match` | 检查一个字符串是否匹配另一个字符串的部分。 |\n| `-notmatch`\
    \ | match 的反反。 |\n| `-contains` | 检查某个值集合是否包含特定的值。 |\n| `-notcontains` | contains\
    \ 的反反。 |\n| `-in` | 检查一个值是否在另一个值集合中。 |\n| `-notin` | 检查一个值是否不在给定的值集合中。 |\n\n如你所见，这里的想法相对简单。你所做的只是比较两个（或多个）值，并评估某事是否为真。\n\
    \n继续下去，当你开始布尔比较时，会返回一个固有的真或假。这种真实性可以被用来做出更大的决策。\n\n那么，在这里可以做出什么样的决策呢？嗯，这就是我们进入所有这些内容的第一个主要部分。我们可以使用这些真或假的陈述来做出决策。这被称为使用条件语句。\n\
    \n想一想。我们一直都在外面比较事物——无论是有形的物体还是不可改变的事件——然后根据此做出决策。例如，“如果今晚下雨，我就不去公园散步了。”如果我们这样说，那么我们要做的就是等到那个晚上，检查是否在下雨，如果没下雨就去公园，如果下雨就呆在家里。决策无处不在，我们一直在这样做。\n\
    \n那么，我们如何将这种决策机制纳入我们的编程和脚本编写中呢？嗯，实际上它相当简单！\n\n假设我们有一个名为 `$apples` 的变量，它的值为 1。嗯，假设我们想要脚本查看\
    \ `$apples` 的值，如果它是 1，就打印“我有一个苹果。”这非常简单！\n\n`if` 语句的语法如下：\n\n```powershell\nif\
    \ (condition) {\n    ... 在此处编写代码\n}\n```\n\n条件是 `$apples` 是否等于 1，所以我们只需检查该项。\n\
    \n```powershell\n$apples = 1\nif ($apples -eq 1) {\n    Write-Output “I have one\
    \ apple.”\n}\n```\n\n然而，你可能会发现这缺乏细微的差别。毕竟，如果我们没有苹果呢？如果我们有两个苹果，或者一个苹果也没有？显然，我们不能对所有这些情况说同样的话，因为语法将是不正确的！那是完全不可想象的。所以显然，我们必须考虑到这些情况。这就是\
    \ `elseif` 和 `else` 语句派上用场的地方。它们附加到你的 `if` 语句上。注意，对于逻辑控制流，这两者都不是必需，但它们确实可以帮助你在程序中做出决策。它们允许当事情不满足第一个条件时，更紧密地控制发生的情况。\n\
    \n如果你只有一个 `if` 和 `else` 语句，那么 `if` 语句中的条件将被测试；如果它是真的，将执行 `if` 语句中的内容。如果它不是真的，将执行\
    \ `else` 语句中的内容。`else if` 语句仅允许你在已经在测试的任何基础上额外测试另一个条件；如果第一个条件失败，它将移动到 `else if`\
    \ 语句提到的第二个条件。\n\n所以，如果我们想测试我们是否有 1 个苹果、多于 1 个苹果或 0 个苹果，那么我们希望 1 个苹果作为我们的 `if`\
    \ 条件，0 个苹果作为 `else if` 条件（因为这是一个特定条件），然后多于 1 个苹果作为我们的 `else` 条件（因为任何不是 1 或 0 的情况都会满足它）。这里大约是这样工作的：\n\
    \n```powershell\nif ($apples -eq 1) {\n    Write-Output “I have one apple.”\n\
    } elseif ($apples -eq 0) {\n    Write-Output “I don’t have an apple.”\n} else\
    \ {\n    Write-Output “I have more than one apple!”\n}\n```\n\n到此为止，你已经知道了条件语句的基础知识。现在我们需要讨论控制流的另一个主要方面：循环。\n\
    \n我们将讨论的第一个循环是 `for` 循环。`for` 循环旨在让用户迭代一个集合直到满足某个条件。条件在定义 `for` 循环时定义。`for` 循环有三个部分：初始化、结束条件和增量步。\n\
    \n假设我们想从 1 计数到 10。（请记住 `++` 和 `--` 分别表示“增加一”或“减少一”。）这大致是 `for` 循环的样子：\n\n```powershell\n\
    For ($i=1; $i -le 10; $i++) {\n    Write-Output “$i”\n}\n```\n\n如果你将此放入脚本并运行，它将从\
    \ 1 计数到 10。\n\n还有 `while` 和 `do while` 循环。两者唯一的区别是，`do while` 循环至少执行一次，然后在之后检查条件并在条件满足时执行。`while`\
    \ 循环在条件满足时一直执行，但前提是该条件开始时必须为真。\n\n`do while` 循环的设置如下：\n\n```powershell\nDo {\n\
    }\nWhile (condition)\n```\n\n而 `while` 循环的设置如下：\n\n```powershell\nWhile (condition)\
    \ {\n}\n```\n\n现在，假设我们想用 `while` 循环从 1 计数到 10。这种设置会有点不同。由于我们不是在循环的初始化内部迭代，我们必须在循环内部进行迭代。\n\
    \n让我们谈谈循环的逻辑。我们希望只要我们的迭代变量（再次说是 `$i`）小于或等于 10，就执行循环。所以只要它小于或等于 10，循环就会继续。如果它达到\
    \ 11，循环就会终止。\n\n我们必须做的第一件事是在循环之前创建变量，否则值将在每次循环迭代时重置，且循环永远不会终止。\n\n```powershell\n\
    $i = 1\nWhile ($i -le 10) {\n    $i++\n}\n```\n"
