    char grade = 'A';\n```\n\n### 2.3 引用类型\n\n除了基本数据类型外，Java 还支持引用数据类型，这些类型更为复杂，表示的是对象而非简单值。引用类型包括类、数组和接口。\n\
    \n- `String`: 用于存储字符序列（文本）。虽然 `String` 是一种引用类型，但由于其广泛的使用，它通常被视为基本数据类型。\n\n示例：\n\
    \n```java\nString name = \"John\";\n```\n\n### 2.4 类型推断 (var)\n\n从 Java 10 开始，`var`\
    \ 关键字允许类型推断。你不需要显式地声明数据类型，而是可以使用 `var` 并让编译器根据赋值的值进行推断。\n\n示例：\n\n```java\nvar\
    \ age = 25; // 编译器推断数据类型为 int\nvar price = 9.99; // 编译器推断数据类型为 double\n```\n\n\
    ### 2.5 变量命名\n\n在命名变量时，遵循某些命名规范对于提高代码可读性非常重要。变量名应该是意义明确且描述性的，并以小写字母开头。对于多个单词的名称，使用驼峰命名法（camel\
    \ case）。\n\n示例：\n\n```java\nint studentAge;\ndouble averageGrade;\n```\n\n###\
    \ 2.6 总结\n\n在本章中，我们探索了 Java 中的变量和数据类型。我们学习了变量是命名的存储位置，用于保存值并在程序中处理数据。我们讨论了基本数据类型，如\
    \ `int`、`double`、`boolean` 和 `char`，它们代表基础数据类型。我们还引入了 `String` 类作为一种存储文本信息的引用数据类型。\n\
    \n此外，我们讨论了 Java 10 中通过 `var` 关键字引入的类型推断概念。我们通过强调变量命名的重要性结束了本章。\n\n# 第 3 章：流程语句\n\
    \n在之前的章节中，我们探索了 Java 编程的基础知识，包括变量和数据类型。现在，在第 3 章中，我们将深入研究流程语句，它允许我们控制程序的执行流。这些语句使我们能够决策、重复操作并创建更具动态性和交互性的程序。\n\
    \n## 3.1 条件语句：if-else\n\n条件语句允许我们根据某些条件执行特定的代码块。条件语句的最基本形式是 if-else 语句。\n\nif-else\
    \ 语句的语法如下：\n\n```java\nif (condition) {\n    // 如果条件为真则执行的代码\n} else {\n    //\
    \ 如果条件为假则执行的代码\n}\n```\n\n示例：\n\n```java\nint age = 18;\nif (age >= 18) {\n  \
    \  System.out.println(\"你有投票资格.\");\n} else {\n    System.out.println(\"您尚还没有投票资格.\"\
    );\n}\n```\n\n在上面的示例中，如果条件 `age >= 18` 求值为真，将显示消息“您拥有投票资格”。否则，如果条件为假，将显示消息“您尚还没有投票资格”。\n\
    \n## 3.2 switch 语句\n\nswitch 语句提供了一种根据表达式的值执行多次条件检查的替代方法。它允许你为表达式的不同可能值指定不同的操作。\n\
    \nswitch 语句的语法如下：\n\n```java\nswitch (expression) {\n    case value1:\n      \
    \  // 如果表达式等于 value1 则执行的代码\n        break;\n    case value2:\n        // 如果表达式等于\
    \ value2 则执行的代码\n        break;\n    // 更多 case 语句...\n    default:\n        //\
    \ 如果没有任何 case 匹配表达式则执行的代码\n}\n```\n\n示例：\n\n```java\nint dayOfWeek = 3;\nswitch\
    \ (dayOfWeek) {\n    case 1:\n        System.out.println(\"今天是星期一.\");\n     \
    \   break;\n    case 2:\n        System.out.println(\"今天是星期二.\");\n        break;\n\
    \    case 3:\n        System.out.println(\"今天是星期三.\");\n        break;\n    //\
    \ 更多 cases...\n    default:\n        System.out.println(\"无效的星期几.\");\n}\n```\n\
    \n在上面的示例中，如果 `dayOfWeek` 的值为 3，将显示消息“今天是星期三”。如果没有任何 case 匹配表达式，将执行默认 case，并显示消息“无效的星期几”。\n\
    \n## 3.3 循环语句：for, while, and do-while\n\n循环语句允许我们多次执行某个代码块。Java 提供了三种类型的循环语句：`for`、`while`\
    \ 和 `do-while`。\n\n### 3.3.1 for 循环\n\n`for` 循环用于提前知道迭代次数的情况。它由三部分组成：初始化、条件和递增/递减。\n\
    \nfor 循环的语法如下：\n\n```java\nfor (initialization; condition; increment/decrement)\
    \ {\n    // 需要重复的代码\n}\n```\n\n示例：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n\
    \    System.out.println(\"计数: \" + i);\n}\n```\n\n在上面的示例中，循环将执行五次，打印从 1 到 5 的计数。\n\
    \n### 3.3.2 while 循环\n\n`while` 循环用于无法提前知道迭代次数的情况。只要指定的条件为真，它就会继续执行代码块。\n\nwhile\
    \ 循环的语法如下：\n\n```java\nwhile (condition) {\n    // 需要重复的代码\n}\n```\n\n示例：\n\n\
    ```java\nint i = 1;\nwhile (i <= 5) {\n    System.out.println(\"计数: \" + i);\n\
    \    i++;\n}\n```\n\n在上面的示例中，循环将执行五次，打印从 1 到 5 的计数。\n\n### 3.3.3 do-while 循环\n\
    \n`do-while` 循环类似于 `while` 循环，但它在检查条件之前至少执行一次代码块。\n\ndo-while 循环的语法如下：\n\n```java\n\
    do {\n    // 需要重复的代码\n} while (condition);\n```\n\n示例：\n\n```java\nint i = 1;\n\
    do {\n    System.out.println(\"计数: \" + i);\n    i++;\n} while (i <= 5);\n```\n\
    \n在上面的示例中，循环至少执行一次，打印从 1 到 5 的计数。\n\n### 3.4 总结\n\n在本章中，我们探索了 Java 中的流程语句，它们允许我们控制程序的执行流。我们讨论了两种条件语句：`if-else`\
    \ 和 `switch`。`if-else` 语句允许根据条件执行代码，而 `switch` 语句提供了一种根据表达式的值进行多次检查的方法。\n\n我们还涵盖了三种循环语句：`for`、`while`\
    \ 和 `do-while`。`for` 循环用于提前知道迭代次数的情况，`while` 循环用于迭代次数未知的情况，而 `do-while` 循环则确保代码块至少执行一次。\n\
    \n"
