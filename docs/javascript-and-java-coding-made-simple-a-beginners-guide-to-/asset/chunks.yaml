    \n### 5.2 创建数组\n\n在 JavaScript 中创建数组有两种常用方法：使用数组字面量和 `Array` 构造函数。\n\n### 5.2.1\
    \ 数组字面量\n\n数组字面量是创建数组最简单且常用的方法。它们涉及在方括号 `[]` 内部包含用逗号分隔的值列表。这是一个示例：\n\n```javascript\n\
    var fruits = ['apple', 'banana', 'orange'];\n```\n\n在这个示例中，我们创建了一个名为 `fruits`\
    \ 的数组，包含三个元素：`'apple'`、`'banana'` 和 `'orange'`。\n\n### 5.2.2 使用 Array 构造函数\n\n\
    JavaScript 还提供了 `Array` 构造函数来创建数组。我们可以使用 `new` 关键字后跟 `Array()` 来创建一个空数组，或者在括号内传递值以特定元素初始化数组。以下是几个示例：\n\
    \n```javascript\nvar emptyArray = new Array();\nvar numbers = new Array(1, 2,\
    \ 3, 4, 5);\n```\n\n在第一个示例中，我们创建了一个名为 `emptyArray` 的空数组。在第二个示例中，我们创建了一个名为 `numbers`\
    \ 的数组，包含五个元素：`1`、`2`、`3`、`4` 和 `5`。\n\n### 5.3 访问数组元素\n\n我们可以通过索引访问数组中的单个元素。索引从第一个元素的\
    \ `0` 开始，每个随后的元素递增 `1`。我们使用方括号 `[]` 并在其中指定索引。这是一个示例：\n\n```javascript\nvar fruits\
    \ = ['apple', 'banana', 'orange'];\nconsole.log(fruits[0]);   // 输出: 'apple'\n\
    console.log(fruits[1]);   // 输出: 'banana'\nconsole.log(fruits[2]);   // 输出: 'orange'\n\
    ```\n\n在这个示例中，我们通过各自的索引访问并打印 `fruits` 数组的元素。\n\n### 5.4 修改数组元素\n\nJavaScript 中的数组是可变的，这意味着我们可以在创建后修改它们的元素。我们可以使用赋值运算符\
    \ `=` 为特定索引分配新值。这是一个示例：\n\n```javascript\nvar fruits = ['apple', 'banana', 'orange'];\n\
    fruits[1] = 'grape';\nconsole.log(fruits);  // 输出: ['apple', 'grape', 'orange']\n\
    ```\n\n在这个示例中，我们修改了 `fruits` 数组索引为 `1` 的元素，将其从 `'banana'` 改为 `'grape'`。\n\n###\
    \ 5.5 数组长度\n\n数组的 `length` 属性允许我们确定它包含的元素数量。我们可以使用点符号（`array.length`）访问此属性。这是一个示例：\n\
    \n```javascript\nvar fruits = ['apple', 'banana', 'orange'];\nconsole.log(fruits.length);\
    \ // 输出: 3\n```\n\n在这个示例中，我们获取了 `fruits` 数组的长度，为 `3`。\n\n### 5.6 数组方法\n\nJavaScript\
    \ 提供了大量的数组方法，允许对数组执行各种操作。让我们探索一些常用的方法：\n\n### 5.6.1 push() 和 pop()\n\n`push()`\
    \ 方法向数组末尾添加一个或多个元素，而 `pop()` 方法从数组删除最后一个元素并返回它。示例：\n\n```javascript\nvar fruits\
    \ = ['apple', 'banana', 'orange'];\nfruits.push('grape');\nconsole.log(fruits);\
    \      // 输出: ['apple', 'banana', 'orange', 'grape']\nvar removedFruit = fruits.pop();\n\
    console.log(fruits);      // 输出: ['apple', 'banana', 'orange']\nconsole.log(removedFruit);\
    \ // 输出: 'grape'\n```\n\n在这个示例中，我们使用 `push()` 将 `'grape'` 添加到 `fruits` 数组的末尾。然后，我们使用\
    \ `pop()` 移除最后一个元素并存储在 `removedFruit` 中。\n\n### 5.6.2 shift() 和 unshift()\n\n\
    `shift()` 方法从数组删除第一个元素并返回它，而 `unshift()` 方法向数组开头添加一个或多个元素。示例：\n\n```javascript\n\
    var fruits = ['apple', 'banana', 'orange'];\nfruits.shift();\nconsole.log(fruits);\
    \               // 输出: ['banana', 'orange']\nfruits.unshift('grape', 'kiwi');\n\
    console.log(fruits);               // 输出: ['grape', 'kiwi', 'banana', 'orange']\n\
    ```\n\n在这个示例中，我们使用 `shift()` 移除了 `fruits` 数组的第一个元素 `'apple'`。然后，我们使用 `unshift()`\
    \ 在开头添加了 `'grape'` 和 `'kiwi'`。\n\n### 5.6.3 slice()\n\n`slice()` 方法提取数组的一部分并返回包含选取元素的新数组。它接收两个参数：起始索引（包含）和结束索引（不包含）。示例：\n\
    \n```javascript\nvar fruits = ['apple', 'banana', 'orange', 'grape', 'kiwi'];\n\
    var slicedFruits = fruits.slice(1, 4);\nconsole.log(slicedFruits);  // 输出: ['banana',\
    \ 'orange', 'grape']\n```\n\n在这个示例中，我们使用 `slice(1, 4)` 从 `fruits` 数组中提取从索引 `1`（包含）到索引\
    \ `4`（不包含）的元素。\n\n### 5.6.4 concat()\n\n`concat()` 方法合并两个或多个数组并返回一个新的数组。它不会修改原始数组。示例：\n\
    \n```javascript\nvar array1 = ['apple', 'banana'];\nvar array2 = ['orange', 'grape'];\n\
    var combined = array1.concat(array2);\nconsole.log(combined); // 输出: ['apple',\
    \ 'banana', 'orange', 'grape']\n```\n\n"
