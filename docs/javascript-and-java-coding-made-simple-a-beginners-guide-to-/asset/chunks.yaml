    \ GUI 会导致同步问题和不可预测的行为。\n\n为了确保 GUI 应用的线程安全，Java 提供了事件分发线程（EDT），负责处理 UI 事件。所有的\
    \ UI 更新都应该在 EDT 上执行，以避免并发问题并保持应用程序的响应性。\n\n## 9.11 Java 并发工具类\n\nJava 在 `java.util.concurrent`\
    \ 包中提供了一套全面的并发类，简化了并发和多线程应用的开发。这些工具包括线程池、并发集合、锁、屏障、信号量和原子变量。\n\n通过利用 Java 并发工具类，我们可以编写高效、可扩展且线程安全的代码，减少与多线程编程相关的复杂性。\n\
    \n在本章中，我们探索了 Java 多线程的基础知识。我们学习了如何创建线程、同步对共享资源的访问、进行线程间通信、确保线程安全以及管理线程执行。理解并有效利用多线程概念对于开发健壮且高性能的\
