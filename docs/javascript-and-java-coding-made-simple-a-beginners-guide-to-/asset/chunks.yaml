    \ method. We then create a `Student` class that extends the `Person` class using\
    \ the `extends` keyword. The `Student` class has its own constructor that invokes\
    \ the `super()` method to call the constructor of the parent class. It also has\
    \ a `study()` method specific to students.\n\nBy utilizing inheritance, we can\
    \ create a hierarchy of objects that share common properties and behaviors, while\
    \ also extending and customizing them for specific purposes.\n\n### 11.4 Polymorphism\
    \ in JavaScript\n\nPolymorphism allows objects of different classes to be treated\
    \ as objects of a common superclass. In JavaScript, polymorphism can be achieved\
    \ by defining methods with the same name in different classes.\n\nHere's an example:\n\
    \n```javascript\nclass Shape {\n  constructor() {\n    this.name = 'Shape';\n\
    \  }\n  draw() {\n    console.log('Drawing a shape.');\n  }\n}\n\nclass Circle\
    \ extends Shape {\n  constructor() {\n    super();\n    this.name = 'Circle';\n\
    \  }\n  draw() {\n    console.log('Drawing a circle.');\n  }\n}\n\nclass Square\
    \ extends Shape {\n  constructor() {\n    super();\n    this.name = 'Square';\n\
    \  }\n  draw() {\n    console.log('Drawing a square.');\n  }\n}\n\nconst shape\
    \ = new Shape();\nconst circle = new Circle();\nconst square = new Square();\n\
    \nshape.draw(); // Output: Drawing a shape.\ncircle.draw(); // Output: Drawing\
    \ a circle.\nsquare.draw(); // Output: Drawing a square.\n```\n\nIn this example,\
    \ we define a `Shape` class with a `draw()` method. We then create `Circle` and\
    \ `Square` classes that extend the `Shape` class and override the `draw()` method\
    \ with their own implementations. Despite calling the same method name, each object\
    \ behaves differently based on its specific class.\n\nPolymorphism allows us to\
    \ write code that can work with objects of different classes interchangeably,\
    \ promoting flexibility and extensibility.\n\n### 11.5 Conclusion\n\nObject-oriented\
    \ programming in JavaScript provides a powerful way to structure and organize\
    \ our code by utilizing objects, encapsulation, inheritance, and polymorphism.\
    \ By understanding the principles and techniques of `OOP`, we can create more\
    \ modular, reusable, and maintainable JavaScript applications.\n\nIn this chapter,\
    \ we explored the basics of object-oriented programming in JavaScript, including\
    \ creating objects, inheritance, and polymorphism. We also discussed how to use\
    \ constructor functions and the `class` syntax introduced in ES6.\n\nIn the next\
    \ chapter, we will dive into another essential aspect of JavaScript programming:\
    \ error handling and debugging techniques. Understanding how to handle errors\
    \ and effectively debug our code will greatly enhance our development process\
    \ and help us build robust JavaScript applications.\n\n# Chapter 12: Error Handling\
    \ and Debugging in JavaScript\n\nIn this chapter, we will explore error handling\
    \ and debugging techniques in JavaScript. As developers, encountering errors and\
    \ bugs is a common part of the development process. Being able to effectively\
    \ handle errors and debug our code is crucial for building robust and reliable\
    \ JavaScript applications.\n\n### 12.1 Understanding Errors in JavaScript\n\n\
    Errors in JavaScript can occur due to various reasons, such as syntax errors,\
    \ logical errors, or runtime exceptions. When an error occurs during the execution\
    \ of our code, it can disrupt the normal flow and potentially cause the application\
    \ to crash.\n\nJavaScript provides built-in error objects, such as `SyntaxError`,\
    \ `TypeError`, and `ReferenceError`, to represent different types of errors. These\
    \ error objects contain useful information, including an error message and a stack\
    \ trace that helps identify the source of the error.\n\n### 12.2 Handling Errors\
    \ with try...catch\n\nThe `try...catch` statement is used to handle errors in\
    \ JavaScript. It allows us to wrap a section of code in a `try` block and specify\
    \ a `catch` block that will execute if an error occurs within the `try` block.\n\
    \nHere's an example:\n\n```javascript\ntry {\n  // Code that might throw an error\n\
    \  const result = someFunction();\n  console.log(result);\n} catch (error) {\n\
    \  // Code to handle the error\n  console.log('An error occurred:', error.message);\n\
    }\n```\n\nIn this example, the `try` block contains the code that might throw\
    \ an error. If an error occurs, it will be caught by the `catch` block, and we\
    \ can handle it accordingly. The `error` parameter in the `catch` block represents\
    \ the error object.\n\nBy using `try...catch`, we can gracefully handle errors\
    \ and prevent them from crashing our application. We can also provide fallback\
    \ behavior or display meaningful error messages to the user.\n\n### 12.3 Throwing\
    \ Custom Errors\n\nIn addition to built-in error objects, JavaScript allows us\
    \ to create custom error objects using the `throw` statement. Custom errors can\
    \ provide more specific information about the nature of the error and help with\
    \ debugging.\n\nHere's an example of throwing a custom error:\n\n```javascript\n\
    function divide(a, b) {\n  if (b === 0) {\n    throw new Error('Division by zero\
    \ is not allowed.');\n  }\n  return a / b;\n}\n\ntry {\n  const result = divide(10,\
    \ 0);\n  console.log(result);\n} catch (error) {\n  console.log('An error occurred:',\
    \ error.message);\n}\n```\n\nIn this example, the `divide` function checks if\
    \ the divisor (`b`) is zero. If it is, a custom `Error` object is thrown with\
    \ a descriptive error message. The error is then caught and handled in the `catch`\
    \ block.\n\nBy throwing custom errors, we can provide more meaningful information\
    \ about exceptional situations and guide the debugging process.\n\n### 12.4 Debugging\
    \ Techniques\n\nDebugging is the process of identifying and fixing bugs in our\
    \ code. JavaScript provides several tools and techniques to aid in the debugging\
    \ process. Some commonly used techniques include:\n\n- `console.log`: Placing\
    \ `console.log` statements at strategic points in our code allows us to output\
    \ values or messages to the console for inspection during runtime.\n- Breakpoints:\
    \ Modern web browsers provide developer tools with a built-in debugger. By setting\
    \ breakpoints at specific lines of code, we can pause the execution and inspect\
    \ the state of variables, step through the code, and analyze the flow of execution.\n\
    - `Debugging Tools`: Developer tools also offer a range of debugging features,\
    \ such as inspecting the call stack, monitoring network requests, analyzing memory\
    \ usage, and profiling performance.\n- `Error Messages`: Paying attention to error\
    \ messages displayed in the console can provide valuable insights into the cause\
    \ of the error. Error messages often include information about the type of error,\
    \ the specific line of code where the error occurred, and additional details that\
    \ can help in pinpointing the issue.\n- `Code Review`: Asking a colleague or peer\
    \ to review our code can provide fresh perspectives and identify potential issues\
    \ that we might have overlooked.\n- `Rubber Duck Debugging`: Explaining our code\
    \ and the problem we're trying to solve to an inanimate object (like a rubber\
    \ duck) can help us uncover logical errors or find alternative solutions. The\
    \ act of verbalizing the problem often leads to new insights and discoveries.\n\
    \nBy utilizing these debugging techniques, we can effectively identify and resolve\
    \ bugs in our JavaScript code, resulting in more reliable and stable applications.\n\
    \n### 12.5 Handling Asynchronous Errors\n\nJavaScript often involves asynchronous\
    \ operations, such as making network requests or accessing data from a database.\
    \ Handling errors in asynchronous code requires a different approach.\n\nOne common\
    \ approach is to use promises and the `catch` method to handle errors:\n\n```javascript\n\
    async function fetchData() {\n  try {\n    const response = await fetch('https://api.example.com/data');\n\
    \    const data = await response.json();\n    // Process the data\n  } catch (error)\
    \ {\n    console.log('An error occurred:', error.message);\n  }\n}\n\nfetchData();\n\
    ```\n"
