  raw: 'The method signature includes the following elements:


    - Return Type: Specifies the type of value returned by the method. Use the keyword
    `void` if the method does not return a value.


    - Method Name: The unique identifier for the method.


    - Parameters: Inputs to the method. They are optional and enclosed within parentheses.
    Multiple parameters are separated by commas.


    - Access Modifier: Determines the visibility of the method (e.g., `public`, `private`,
    `protected`).


    The syntax of a method declaration is as follows:


    ```java


    accessModifier returnType methodName(parameters) {


    // method body


    }


    ```


    Example:


    ```java


    public void greetUser(String name) {


    System.out.println("Hello, " + name + "!");


    }


    ```


    In the example above, we have a method named `greetUser` with a return type of
    `void` (no return value). It takes a single parameter `name` of type `String`.
    The method body consists of a statement that prints a greeting message.


    ### 4.3 Calling a Method


    To execute the code inside a method, we need to call or invoke the method. Method
    invocation allows us to use the functionality provided by the method at a specific
    point in our program.


    To call a method, we use the following syntax:


    ```java


    methodName(arguments);


    ```


    Example:


    ```java


    greetUser("John");


    ```


    In the example above, the `greetUser` method is called with the argument `"John"`.
    This will execute the method code and print the message "Hello, John!" to the
    console.


    ### 4.4 Method Overloading


    Method overloading allows us to define multiple methods with the same name but
    different parameter lists. It enables us to create methods that perform similar
    tasks but accept different types or numbers of arguments.


    Java determines which method to execute based on the arguments passed during method
    invocation. The decision is made at compile-time, considering the number, types,
    and order of the arguments.


    Example:


    ```java


    public int sum(int a, int b) {


    return a + b;


    }


    public double sum(double a, double b) {


    return a + b;


    }


    ```


    In the example above, we have two `sum` methods—one accepting two `int` arguments
    and the other accepting two `double` arguments. Java will invoke the appropriate
    method based on the argument types provided during the method call.


    ### 4.5 Returning Values from Methods


    Methods can return values using the `return` statement. The return type specified
    in the method signature indicates the type of value the method should return.


    To return a value from a method, use the following syntax:


    ```java


    return expression;


    ```


    Example:


    ```java


    public int square(int num) {


    return num * num;


    }


    ```


    In the example above, the `square` method takes an `int` argument and returns
    the square of that number by multiplying it with itself.


    4.6 Summary


    In this chapter, we explored the concept of methods in Java. We learned that methods
    are reusable blocks of code that perform specific tasks and provide code modularity
    and reusability. A method consists of a method signature, which includes the return
    type, method name, parameters, and access modifier, and a method body, which contains
    the statements that define the functionality of the method.


    We discussed how to call or invoke a method by using its name followed by parentheses
    and passing any required arguments. We also explored method overloading, which
    allows us to define multiple methods with the same name but different parameter
    lists, enabling flexibility in method usage.


    Additionally, we learned about returning values from methods using the `return`
    statement. The return type specified in the method signature determines the type
    of value that the method should return. By returning values, methods can provide
    useful output and results to other parts of the program.


    Methods play a crucial role in structuring programs and promoting code reuse.
    They help in breaking down complex problems into smaller, manageable tasks and
    enhance the readability, maintainability, and organization of code.


    In the next chapter, we will delve into arrays, which are fundamental data structures
    that allow us to store and manipulate collections of elements. Get ready to explore
    the versatility and power of arrays in Java programming.


    # Chapter 5: Arrays


    In Chapter 4, we explored the concept of methods and how they allow us to organize
    and reuse code. Now, in Chapter 5, we will dive into the world of arrays. Arrays
    are fundamental data structures in Java that allow us to store and manipulate
    collections of elements. They provide a powerful way to work with multiple values
    of the same type.


    ## 5.1 Introduction to Arrays


    An array is a container object that holds a fixed number of values of the same
    type. Each value in the array is called an element, and each element is accessed
    by its index. Arrays provide a convenient way to store and access multiple related
    values in a single variable.


    ## 5.2 Declaring and Initializing Arrays


    To use an array, we need to declare and initialize it. The declaration specifies
    the type of elements the array will hold, and the initialization assigns actual
    values to the array elements.


    The syntax for declaring an array is as follows:


    ```java


    type[] arrayName;


    ```


    Example:


    ```java


    int[] numbers;


    ```


    In the example above, we declare an array named `numbers` that will hold elements
    of type `int`. However, at this point, the array is uninitialized and doesn''t
    hold any values.


    To initialize an array, we can use one of the following methods:


    ### 5.2.1 Inline Initialization


    We can initialize an array with values directly at the time of declaration using
    curly braces `{}`.


    ```java


    type[] arrayName = {value1, value2, value3, ...};


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    ```


    In the example above, we declare and initialize an array named `numbers` with
    the values 1, 2, 3, 4, and 5.


    ### 5.2.2 Initializing with the new Operator


    We can also initialize an array using the `new` operator. This method allows us
    to specify the size of the array.


    ```java


    type[] arrayName = new type[size];


    ```


    Example:


    ```java


    int[] numbers = new int[5];


    ```


    In the example above, we declare and initialize an array named `numbers` with
    a size of 5\. The array is initially filled with default values (`0` for `int`).


    ### 5.3 Accessing Array Elements


    Array elements can be accessed using their index, which starts from 0 and goes
    up to `length - 1`, where `length` represents the number of elements in the array.


    The syntax to access an array element is as follows:


    ```java


    arrayName[index]


    ```


    Example:


    ```java


    int[] numbers = {10, 20, 30};


    int firstElement = numbers[0]; // Accessing the first element (10)


    int secondElement = numbers[1]; // Accessing the second element (20)


    ```


    In the example above, we access the first and second elements of the `numbers`
    array using the respective indices.


    ### 5.4 Array Length


    The `length` property of an array returns the number of elements it can hold.
    It is a final variable, so it cannot be modified.


    The syntax to get the length of an array is as follows:


    ```java


    arrayName.length


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    int arrayLength = numbers.length; // Length of the array (5)


    ```


    In the example above, we get the length of the `numbers` array and store it in
    the variable `arrayLength`.


    ### 5.5 Modifying Array Elements


    Array elements can be modified by assigning new values to them using their indices
    and the assignment operator (`=`).


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    numbers[2] = 10; // Modifying the third element to 10


    ```


    In the example above, we modify the third element of the `numbers` array by assigning
    it a new value of 10.


    ### 5.6 Iterating Over Arrays


    To access and process all the elements of an array, we can use loops, such as
    the `for` loop.


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    for (int i = 0; i < numbers.length; i++) {


    System.out.println(numbers[i]);


    }


