    # Chapter 10: JavaScript Modules and Modular Development


    In this chapter, we will explore JavaScript modules and modular development. Modules
    allow us to organize our code into reusable and encapsulated units, making our
    codebase more maintainable and scalable. We''ll cover the basics of modules, module
    syntax, exporting and importing, as well as some best practices for modular development.


    ### 10.1 Introduction to JavaScript Modules


    JavaScript modules are self-contained units of code that can be exported and imported
    to be used in other parts of our application. They provide a way to encapsulate
    related functionality, variables, and classes, preventing them from polluting
    the global namespace and promoting code reusability.


    Prior to the introduction of native modules in JavaScript, developers used various
    module systems, such as CommonJS and AMD, to achieve modular development. However,
    with the release of ECMAScript 2015 (ES6), native support for modules was introduced,
    making it easier to work with modules without the need for third-party libraries
    or frameworks.


    ### 10.2 Module Syntax: Exporting and Importing


    In ES6 modules, we use the `export` and `import` keywords to define what parts
    of a module should be accessible outside the module and to import those exported
    entities into other modules.


    To export entities from a module, we use the `export` keyword. We can export variables,
    functions, classes, or even a default export. Here''s an example:


    ```javascript


    // module.js


    export const PI = 3.14;


    export function double(number) {


    return number * 2;


    }


    export default function greet(name) {


    return `Hello, ${name}!`;


    }


    ```


    In this example, we export a constant `PI`, a function `double()`, and a default
    export function `greet()`. The default export is denoted by using the `export
    default` syntax.


    To import entities from a module, we use the `import` keyword. We can import specific
    entities, all entities as a namespace, or the default export. Here''s how we can
    import entities from the `module.js` module:


    ```javascript


    // main.js


    import { PI, double } from ''./module.js'';


    console.log(PI); // Output: 3.14


    console.log(double(5)); // Output: 10


    ```


    In this example, we import the `PI` constant and the `double()` function from
    the `module.js` module. We can then use these imported entities in our `main.js`
    module.


