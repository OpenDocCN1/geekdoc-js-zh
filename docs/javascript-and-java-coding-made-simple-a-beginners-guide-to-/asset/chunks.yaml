    ### 2.3 Reference Data Types


    In addition to primitive data types, Java also supports reference data types,
    which are more complex and represent objects rather than simple values. Reference
    data types include classes, arrays, and interfaces.


    - `String`: Used to store sequences of characters (text). Although `String` is
    a reference type, it is commonly treated as a primitive type due to its widespread
    use.


    Example:


    ```java


    String name = "John";


    ```


    ### 2.4 Type Inference (var)


    Starting from Java 10, the `var` keyword allows for type inference. Instead of
    explicitly declaring the data type, you can use `var` and let the compiler infer
    it based on the assigned value.


    Example:


    ```java


    var age = 25; // The compiler infers the data type as int


    var price = 9.99; // The compiler infers the data type as double


    ```


    ### 2.5 Naming Variables


    When naming variables, it is important to follow certain naming conventions to
    improve code readability. Variable names should be meaningful and descriptive,
    starting with a lowercase letter. For multiple-word names, use camel case notation.


    Example:


    ```java


    int studentAge;


    double averageGrade;


    ```


    2.6 Summary


    In this chapter, we explored variables and data types in Java. We learned that
    variables are named storage locations that hold values and allow us to work with
    data in our programs. We discussed primitive data types, such as `int`, `double`,
    `boolean`, and `char`, which represent basic types of data. We also introduced
    the `String` class as a reference data type for storing textual information.


    Furthermore, we discussed the concept of type inference introduced in Java 10
    using the `var` keyword. We concluded the chapter by emphasizing the importance
    of naming variables.


    # Chapter 3: Control Flow Statements


    In the previous chapters, we explored the fundamentals of Java programming, including
    variables and data types. Now, in Chapter 3, we will delve into control flow statements,
    which allow us to control the flow of execution in our programs. These statements
    enable us to make decisions, repeat actions, and create more dynamic and interactive
    programs.


    ## 3.1 Conditional Statements: if-else


    Conditional statements allow us to execute specific blocks of code based on certain
    conditions. The most basic form of a conditional statement is the if-else statement.


    The syntax of the if-else statement is as follows:


    ```java


    if (condition) {


    // code to execute if the condition is true


    } else {


    // code to execute if the condition is false


    }


    ```


    Example:


    ```java


    int age = 18;


    if (age >= 18) {


    System.out.println("You are eligible to vote.");


    } else {


    System.out.println("You are not eligible to vote yet.");


    }


    ```


    In the example above, if the condition `age >= 18` evaluates to true, the message
    "You are eligible to vote." will be displayed. Otherwise, if the condition is
    false, the message "You are not eligible to vote yet." will be displayed.


    ## 3.2 Switch Statement


    The switch statement provides an alternative way to perform multiple conditional
    checks based on the value of an expression. It allows you to specify different
    actions to be taken for different possible values of the expression.


    The syntax of the switch statement is as follows:


    ```java


    switch (expression) {


    case value1:


    // code to execute if expression equals value1


    break;


    case value2:


    // code to execute if expression equals value2


    break;


    // more case statements...


    default:


    // code to execute if none of the cases match the expression


    }


    ```


    Example:


    ```java


    int dayOfWeek = 3;


    switch (dayOfWeek) {


    case 1:


    System.out.println("Today is Monday.");


    break;


    case 2:


    System.out.println("Today is Tuesday.");


    break;


    case 3:


    System.out.println("Today is Wednesday.");


    break;


    // more cases...


    default:


    System.out.println("Invalid day of the week.");


    }


    ```


    In the example above, if the value of `dayOfWeek` is 3, the message "Today is
    Wednesday." will be displayed. If none of the cases match the expression, the
    default case will be executed, and the message "Invalid day of the week." will
    be displayed.


    ## 3.3 Looping Statements: for, while, and do-while


    Looping statements allow us to repeat a block of code multiple times. Java provides
    three types of looping statements: `for`, `while`, and `do-while`.


    ### 3.3.1 for Loop


    The `for` loop is used when you know the number of iterations in advance. It consists
    of three parts: initialization, condition, and increment/decrement.


    The syntax of the for loop is as follows:


    ```java


    for (initialization; condition; increment/decrement) {


    // code to be repeated


    }


    ```


    Example:


    ```java


    for (int i = 1; i <= 5; i++) {


    System.out.println("Count: " + i);


    }


    ```


    In the example above, the loop will execute five times, printing the count from
    1 to 5.


    ### 3.3.2 while Loop


    The `while` loop is used when the number of iterations is not known in advance.
    It continues executing the code block as long as the specified condition is true.


    The syntax of the while loop is as follows:


    ```java


    while (condition) {


    // code to be repeated


    }


    ```


    Example:


    ```java


    int i = 1;


    while (i <= 5) {


    System.out.println("Count: " + i);


    i++;


    }


    ```


    In the example above, the loop will execute as long as the condition `i <= 5`
    is true. It will print the count from 1 to 5.


    ### 3.3.3 do-while Loop


    The `do-while` loop is similar to the `while` loop, but it guarantees that the
    code block is executed at least once before checking the condition.


    The syntax of the do-while loop is as follows:


    ```java


    do {


    // code to be repeated


    } while (condition);


    ```


    Example:


    ```java


    int i = 1;


    do {


    System.out.println("Count: " + i);


    i++;


    } while (i <= 5);


    ```


    In the example above, the loop will execute at least once, printing the count
    from 1 to 5.


    ### 3.4 Control Flow Statements: Summary


    In this chapter, we explored control flow statements in Java, which enable us
    to control the flow of execution in our programs. We discussed two conditional
    statements: `if-else` and `switch`. The `if-else` statement allows us to execute
    code based on a condition, while the `switch` statement provides a way to perform
    multiple checks based on the value of an expression.


    We also covered three types of looping statements: `for`, `while`, and `do-while`.
    The `for` loop is used when the number of iterations is known in advance, the
    `while` loop is used when the number of iterations is not known, and the `do-while`
    loop ensures that the code block is executed at least once.


    By mastering control flow statements, you can create more dynamic and interactive
    programs that can make decisions, repeat actions, and respond to different scenarios.
    These statements are essential tools in your programming toolkit, allowing you
    to write more flexible and efficient code.


    In the next chapter, we will explore the concept of methods, which are reusable
    blocks of code that perform specific tasks. Get ready to learn how to encapsulate
    functionality and create modular and organized programs.


    # Chapter 4: Methods


    In the previous chapters, we learned about variables, data types, and control
    flow statements. Now, in Chapter 4, we will dive into the concept of methods.
    Methods are reusable blocks of code that perform specific tasks and allow us to
    encapsulate functionality within our programs. They enable code modularity, reusability,
    and organization.


    ### 4.1 Introduction to Methods


    A method is a collection of statements that are grouped together to perform a
    specific task. It is defined within a class and can be called from other parts
    of the program to execute its functionality. Methods help in breaking down complex
    problems into smaller, manageable tasks, making code more readable and maintainable.


    ### 4.2 Method Signature and Syntax


    A method consists of two main components: the method signature and the method
    body.'
