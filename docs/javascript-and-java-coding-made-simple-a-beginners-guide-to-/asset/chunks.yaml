    ## 6.8 抽象


    抽象是通过仅表示基本细节并隐藏不必要的复杂性来简化系统的过程。在 Java 中，抽象通过抽象类和接口实现。


    抽象类是一种无法实例化的类，旨在供子类扩展。它可以包含抽象方法（没有实现的方法）和具体方法（带有实现的方法）。


    示例：


    ```java

    public abstract class Vehicle {

    // 抽象方法

    public abstract void start();

    // 抽象方法

    public void stop() {

    System.out.println("Vehicle stopped.");

    }

    }

    ```


    在上面的示例中，`Vehicle` 类被声明为抽象类，并包含一个抽象方法 `start()`，该方法必须由子类实现。它 true 一个具有默认实现的具体方法
    `stop()`。


    另一方面，接口定义了实现类必须遵守的方法合约。接口可以拥有常量字段和抽象方法，但不能拥有实例字段或具体方法。


    示例：


    ```java

    public interface Driveable {

    // 常量字段

    public static final int MAX_SPEED = 100;

    // 抽象方法

    public void drive();

    }

    ```


    在上面的示例中，`Driveable` 接口定义了一个常量字段 `MAX_SPEED` 和一个抽象方法 `drive()`。


    类可以实现多个接口，但只能继承一个类。通过使用抽象，我们可以定义共同的行为并在代码中强制执行一致的结构。


    ## 6.9 总结


    在本章中，我们探索了面向对象编程（OOP）的概念。我们学习了类和对象、封装、访问修饰符、构造函数、继承、多态和抽象。OOP 允许我们通过将现实实体建模为具有属性和行为的对象，创建模块化、可重用且易于维护的代码。


    通过使用 OOP 原则，我们可以设计出更容易理解、扩展和维护的程序。类和对象提供了组织和结构化代码的方法，而封装和访问修饰符确保了数据保护和控制。继承和多态促进了代码重用并提供了灵活性，而抽象有助于简化复杂系统。


    在下一章中，我们将探索 Java 中更高级的主，包括异常处理、文件 I/O 和泛型。这些概念将进一步增强你对 Java 编程语言的理解并扩展你的编程能力。


    # 第 7 章：异常处理与文件 I/O


    在之前的章节中，我们涵盖了 Java 编程的基础，包括变量、控制流、方法、数组、面向对象编程（OOP）等。现在，在第 7 章中，我们将探索两个重要主题：异常处理和文件输入/输出（I/O）。


    ## 7.1 异常处理简介


    异常处理是 Java 中的一种机制，允许我们处理错误或异常情况。这些异常由无效输入、除零错误、未找到文件引起。


    通过处理异常，我们可以优雅地从错误中恢复，向用户提供意义的信息，并防止程序崩溃。


    ## 7.2 try-catch-finally 块


    `try-catch-finally` 块用于处理 Java 中的异常。`try` 块包含可能抛出异常的代码。`catch` 块用于捕获并处理异常。`finally`
    块用于执行应该始终运行的代码，无论是否发生异常。


    语法：


    ```

    try {

    // 可能抛出异常的代码

    } catch (ExceptionType1 exception1) {

    // 对 ExceptionType1 的异常处理

    } catch (ExceptionType2 exception2) {

    // 对 ExceptionType2 的异常处理

    } finally {

    // 始终运行的代码

    }

    ```


    示例：


    ```java

    try {

    // 可能抛出异常的代码

    int result = divide(10, 0); // 除零错误示例

    } catch (ArithmeticException ex) {

    // 对 ArithmeticException 的异常处理

    System.out.println("An arithmetic exception occurred: " + ex.getMessage());

    } finally {

    // 始终运行的代码

    System.out.println("Inside the finally block.");

    }

    ```


    在上面的示例中，`try` 块尝试将 10 除以 0，这将抛出 `ArithmeticException`。`catch` 块捕获并处理该异常。`finally`
    块无论是否发生异常都会执行。


    ## 7.3 检查异常与未检查异常


    在 Java 中，异常分为两类：检查异常和未检查异常。


    检查异常是必须在方法签名中使用 `throws` 关键字声明或使用 `try-catch` 块处理的异常。检查异常的包括 `IOException`、`SQLException`
    和 `ClassNotFoundException`。


    未检查异常（称为运行时异常）不需要显式声明或捕获。它们是 `RuntimeException` 类的子类。未检查异常的包括 `ArithmeticException`、`NullPointerException`
    和 `ArrayIndexOutOfBoundsException`。


    处理或声明检查异常对于确保错误处理和维护代码健壮性非常重要。另一方面，未检查异常可以选择处理。


    ## 7.4 文件输入/输出 (I/O)


    文件输入/输出（I/O）是从文件中数据的过程。Java 提供了多个类和方法来执行文件 I/O 操作，允许我们创建、读取、写入和操作文件。


    涉及文件 I/O 操作的关键类包括 `File`、`FileReader`、`FileWriter`、`BufferedReader`、`BufferedWriter`、`InputStream`、`OutputStream`
    等。


    要从文件中读取数据，我们通常遵循以下步骤：


    1. 创建一个表示文件的 `File` 对象。

    2. 创建一个 `FileReader` 对象，并将 `File` 对象作为参数传递。

    3. 将 `FileReader` 对象封装在 `BufferedReader` 对象中以便高效读取。


