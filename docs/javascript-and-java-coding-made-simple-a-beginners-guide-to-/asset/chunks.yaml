    ## Chapter 8: Generics


    In the previous chapters, we covered various aspects of Java programming, including
    variables, control flow, methods, Object-Oriented Programming (OOP), exception
    handling, and file I/O. Now, in Chapter 8, we will explore the concept of Generics
    in Java.


    ## 8.1 Introduction to Generics


    Generics provide a way to create reusable code that can work with different data
    types. It allows us to parameterize types, classes, and methods, providing type
    safety and eliminating the need for explicit type casting.


    The main benefits of using generics in Java are:


    1\. Type Safety: Generics ensure that the correct types are used at compile-time,
    preventing type-related errors at runtime.


    2\. Code Reusability: With generics, we can write code that can be used with multiple
    data types, promoting code reusability and reducing redundancy.


    3\. Compile-Time Type Checking: The compiler performs type checking on generic
    code, detecting type-related errors before the code is executed.


    ## 8.2 The Generic Class Syntax


    To define a generic class, we use angle brackets (`<>`) after the class name to
    specify the type parameter. The type parameter can be any valid identifier and
    is typically represented by a single uppercase letter.


    Syntax:


    ```java


    public class ClassName<T> {


    // Class members and methods


    }


    ```


    Example:


    ```java


    public class Box<T> {


    private T item;


    public void setItem(T item) {


    this.item = item;


    }


    public T getItem() {


    return item;


    }


    }


    ```


    In the example above, we define a generic class `Box` with a type parameter `T`.
    The `Box` class has a private member variable `item` of type `T`. We provide getter
    and setter methods to manipulate the `item` variable.


    ## 8.3 Using Generics in Methods


    We can also use generics in methods to create parameterized methods that work
    with different data types.


    Syntax:


    ```java


    public <T> void methodName(T parameter) {


    // Method body


    }


    ```


    Example:


    ```java


    public <T> void printArray(T[] array) {


    for (T element : array) {


    System.out.println(element);


    }


    }


    ```


    In the example above, we define a generic method `printArray` that takes an array
    of type `T` as a parameter. The method iterates over the elements of the array
    and prints each element to the console.


    ## 8.4 Bounded Type Parameters


    We can further restrict the types that can be used as type parameters by using
    bounded type parameters. Bounded type parameters allow us to specify that the
    type parameter must be a subtype of a particular class or implement a specific
    interface.


    Syntax:


    ```java


    public class ClassName<T extends BoundType> {


    // Class members and methods


    }


    ```


    Example:


    ```java


    public class Box<T extends Number> {


    private T item;


    public void setItem(T item) {


    this.item = item;


    }


    public T getItem() {


    return item;


    }


    }


    ```


    In the example above, we define a generic class `Box` with a bounded type parameter
    `T` that must be a subtype of `Number`. This restricts the type of objects that
    can be used with the `Box` class to numeric types.


    ## 8.5 Wildcards in Generics


    Wildcards in generics allow us to represent an unknown type or a range of types.
    The two wildcard types in Java generics are the `?` wildcard (unbounded wildcard)
    and the `? extends Type` wildcard (bounded wildcard).


    Syntax:


    ```java


    public void methodName(List<?> list) {


    // Method body


    }


    ```


    Example:


    ```


    ```java


    import java.util.List;


    public void processList(List<?> list) {


    for (Object element : list) {


    System.out.println(element);


    }


    }


    ```


    In the example above, we define a method `processList` that takes a `List` with
    an unbounded wildcard `?` as a parameter. This method can accept a list of any
    type. It iterates over the elements of the list and prints each element to the
    console.


    ## 8.6 Type Inference with Generics


    In Java 7 and later versions, the compiler can infer the type arguments of a generic
    method invocation based on the method arguments. This feature is known as type
    inference.


    Example:


    ```java


    List<String> stringList = new ArrayList<>();


    stringList.add("Hello");


    stringList.add("World");


    printList(stringList); // Type inference in action


    public static void printList(List<?> list) {


    for (Object element : list) {


    System.out.println(element);


    }


    }


    ```


    In the example above, we create a `List` of `String` objects. When we invoke the
    `printList` method with the `stringList` as an argument, the compiler automatically
    infers the type argument `String` based on the argument''s type. Therefore, we
    don''t need to specify the type argument explicitly.


    ## 8.7 Erasure and Type Bounds


    Java implements generics using type erasure, which means that the type parameters
    are erased at runtime. The compiler replaces the type parameters with their bound
    types or the `Object` type if no bound is specified.


    Example:


    ```java


    public class Box<T extends Number> {


    private T item;


    public void setItem(T item) {


    this.item = item;


    }


    public T getItem() {


    return item;


    }


