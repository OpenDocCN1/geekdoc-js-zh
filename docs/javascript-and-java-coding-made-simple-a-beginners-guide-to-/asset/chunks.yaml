    ## 6.7 Polymorphism


    Polymorphism is another important concept in OOP that allows objects of different
    classes to be treated as objects of a common superclass. It enables methods to
    be overridden in subclasses, providing different implementations while retaining
    a common interface.


    Example:


    ```java

    public class Car {

    // ...

    public void drive() {

    System.out.println("Driving a car.");

    }

    }


    public class SportsCar extends Car {

    // ...

    @Override

    public void drive() {

    System.out.println("Driving a sports car at high speed!");

    }

    }


    public class SedanCar extends Car {

    // ...

    @Override

    public void drive() {

    System.out.println("Driving a sedan car smoothly.");

    }

    }

    ```


    In the example above, the `SportsCar` and `SedanCar` classes both extend the `Car`
    class and override the `drive()` method with their specific implementations. When
    we call the `drive()` method on objects of these classes, the appropriate implementation
    based on the actual object type will be executed.


    ```java

    Car car1 = new Car();

    car1.drive();              // Output: "Driving a car."


    Car car2 = new SportsCar();

    car2.drive();              // Output: "Driving a sports car at high speed!"


    Car car3 = new SedanCar();

    car3.drive();              // Output: "Driving a sedan car smoothly."

    ```


    In the example above, the `drive()` method behaves differently based on the actual
    object type, demonstrating polymorphism.


    ## 6.8 Abstraction


    Abstraction is the process of simplifying complex systems by representing only
    essential details and hiding unnecessary complexities. In Java, abstraction is
    achieved through abstract classes and interfaces.


    An abstract class is a class that cannot be instantiated and is meant to be extended
    by subclasses. It can have abstract methods (methods without an implementation)
    and concrete methods (methods with an implementation).


    Example:


    ```java

    public abstract class Vehicle {

    // Abstract method

    public abstract void start();

    // Concrete method

    public void stop() {

    System.out.println("Vehicle stopped.");

    }

    }

    ```


    In the example above, the `Vehicle` class is declared as abstract and contains
    an abstract method `start()` that must be implemented by its subclasses. It also
    has a concrete method `stop()` with a default implementation.


    Interfaces, on the other hand, define a contract of methods that implementing
    classes must adhere to. An interface can have constant fields and abstract methods
    but cannot have instance fields or concrete methods.


    Example:


    ```java

    public interface Driveable {

    // Constant field

    public static final int MAX_SPEED = 100;

    // Abstract method

    public void drive();

    }

    ```


    In the example above, the `Driveable` interface defines a constant field `MAX_SPEED`
    and an abstract method `drive()`.


    Classes can implement multiple interfaces but can only extend one class. By using
    abstraction, we can define common behaviors and enforce a consistent structure
    in our code.


    ## 6.9 Summary


    In this chapter, we explored the concept of Object-Oriented Programming (OOP).
    We learned about classes and objects, encapsulation, access modifiers, constructors,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by modeling real-world entities as objects with properties
    and behaviors.


    By using OOP principles, we can design programs that are easier to understand,
    extend, and maintain. Classes and objects provide a way to organize and structure
    our code, while encapsulation and access modifiers ensure data protection and
    control. Inheritance and polymorphism promote code reuse and enable flexibility,
    and abstraction helps in simplifying complex systems.


    In the next chapter, we will explore more advanced topics in Java, including exception
    handling, file I/O, and generics. These concepts will further enhance your understanding
    of the Java programming language and expand your programming capabilities.


    # Chapter 7: Exception Handling and File I/O


