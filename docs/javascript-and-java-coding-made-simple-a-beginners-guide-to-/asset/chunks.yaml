    # 简单上手 JavaScript 代码：编程入门指南

    ## MARK STOKES


    # 第 1 章：JavaScript 简介

    欢迎来到有趣的 JavaScript 世界！在本章中，我们将开启探索 JavaScript 编程基础的之旅。我们将涵盖 JavaScript 的基本概念、它在
    Web 开发中的作用，以及它是如何与 HTML 和 CSS 交互的。


    ### 1.1 什么是 JavaScript?

    JavaScript 是一种高级解释型编程语言，主要用于为网站添加交互性。与关注网页结构和呈现的 HTML 和 CSS 不同，JavaScript 实现了动态和响应式的行为。它允许你创建交互元素、处理用户输入、操纵页面内容以及更多功能。


    JavaScript 是一门多功能的语言，多年来不断演进，获得了广泛采用，并成为现代 Web 开发不可或缺的一部分。它受所有主流浏览器的支持，可以用于从简单的网站增强到复杂的
    Web 应用的各种用途。


    ### 1.2 JavaScript 简史

    为了更好地理解 JavaScript，让我们简单回顾一下它的历史。JavaScript 由 Brendan Eich 在 1995 年于他在 Netscape
    Communications 工作期间创建。它最初被命名为 "LiveScript"，后来被重命名为 JavaScript，以利用当时 Java 的流行。该语言的设计目的是提供一种为网页添加交互的方法，并为浏览器引入编程能力。


    多年来，JavaScript 经历了重大的进展。定义语言规范的 `ECMAScript` 标准已经经历了几个版本，每个版本都引入了新功能和改进。现代 JavaScript（也称为
    `ECMAScript 6` (`ES6`) 及更高版本）提供了强大的功能，使开发变得更加高效和愉快。


    ### 1.3 JavaScript 与 Web 开发

    JavaScript 在现代 Web 开发中起着至关重要的作用。它主要用于客户端，这意味着它直接运行在 浏览器中。这允许 JavaScript 与`文档对象模型`
    (`DOM`) 交互，DOM 是网页结构的表示，并借此实时操纵其元素。通过利用 JavaScript，Web 开发人员可以创建响应用户操作的动态交互式网站。


    除了客户端脚本外，JavaScript 的范围已扩展到 Web 开发的其他领域。随着 `Node.js` 的引入，JavaScript 现在也可以用于服务器端。这使得开发者可以使用单种编程语言构建全栈应用程序，简化了开发过程并提高了了代码的可重用性。


    ### 1.4 配置你的开发环境

    在深入学习 JavaScript 代码之前，设置一个合适的开发环境至关重要。拥有正确的工具和舒适的设置可以极大提高你作为开发者的效率。让我们来看看设置 JavaScript
    开发环境的步骤。


    首先，你需要一个文本编辑器来编写代码。有很多选择，从轻量级编辑器到功能丰富的集成开发环境 (`IDEs`) 都有。流行的选择包括 `Visual Studio
    Code`、`Sublime Text`、`Atom` 和 `WebStorm`。根据你对功能、易用性和自定义的偏好进行选择。


    一旦你有了文本编辑器，你需要一个浏览器来运行和测试你的代码。所有现代浏览器如 `Chrome`、`Firefox`、`Safari` 和 `Edge` 都内置了可以执行代码的
    JavaScript 引擎。在多个浏览器上测试代码是一种良好的习惯。


    除了编辑器和浏览器，你可能会发现浏览器提供的工具非常有帮助。这些工具提供了调试、检查元素和监控请求的一系列功能。大多数浏览器都通过快捷键或菜单访问这些工具。


    最后，你可能希望考虑使用版本控制软件 `Git` 来管理代码并与他人协作。`Git` 允许你跟踪代码库的变化、为功能开发创建分支并方便地进行协作。`GitHub`、`GitLab`
    和 `Bitbucket` 等平台提供了 Git 仓库托管服务，方便共享代码。


    ### 1.5 运行 JavaScript 代码

    现在你的开发环境已经就绪，让我们探索如何运行 JavaScript 代码。JavaScript 代码有两种执行方式：在 HTML 文件内内联或外部文件中。虽然内联
    JavaScript 有其用场景，但通常建议将 JavaScript 代码放在外部文件中并链接到 HTML 文件。这种关注点的分离有助于保持代码结构的整洁有序。


    要引入外部 JavaScript 文件，你可以在 HTML 文件中使用以下语法：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>我的 JavaScript 页面</title>

    <script src="path/to/your/script.js"></script>

    </head>

    <body>

    <!-- 你的 HTML 内容 -->

    </body>

    </html>

    ```


    在这个示例中，我们通过使用 `<script>` 标签并指定 `src` 属性指向 JavaScript 文件路径来引入外部文件。浏览器在遇到此标签时会加载并执行
    JavaScript 代码，从而让你将 HTML 和 JavaScript 代码分离以获得更好的组织性和可维护性。


    ### 1.6 你的第一个 JavaScript 程序

    让我们直接开始编写代码吧！在 JavaScript 中，传统的 "Hello, World!" 程序可以这样写：


    ```javascript

    console.log("Hello, World!");

    ```


