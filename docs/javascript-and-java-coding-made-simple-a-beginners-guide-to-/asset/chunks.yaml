    numbers from 0 to `n`. Inside the function, we use the `yield` keyword to pause
    the execution and return the current value of `i`.


    We create an instance of the generator using `countUpTo(5)`. By calling the `next()`
    method on the generator, we can resume the execution and retrieve the next value
    in the sequence.


    Generators offer a powerful mechanism for controlling the flow of execution and
    can be used in various scenarios to simplify complex logic.


