    \ 和 `profession`。属性名被指定为键，后面跟着冒号 `:`，以及它们对应的值。\n\n另一种创建对象的方法是使用 `new` 关键字和 `Object()`\
    \ 构造函数。这里有一个示例：\n\n```javascript\nvar car = new Object();\ncar.make = \"Toyota\"\
    ;\ncar.model = \"Camry\";\ncar.year = 2022;\n```\n\n在这个示例中，我们使用 `Object()` 构造函数创建了一个名为\
    \ `car` 的对象，并使用点表示法为其分配属性。\n\n### 6.3 访问对象属性\n\n我们可以使用点符号或括号符号来访问对象的属性。点符号涉及使用对象名后跟一个点\
    \ `.` 和属性名。这里有一个示例：\n\n```javascript\nconsole.log(person.name);     // Output:\
    \ \"John Doe\"\nconsole.log(car.make);          // Output: \"Toyota\"\n```\n\n\
    在这个示例中，我们使用点符号访问了 `person` 对象的 `name` 属性和 `car` 对象的 `make` 属性。\n\n括号符号涉及使用方括号\
    \ `[]` 并将属性名指定为字符串。这里有一个示例：\n\n```javascript\nconsole.log(person['age']);    //\
    \ Output: 30\nconsole.log(car['year']);       // Output: 2022\n```\n\n在这个示例中，我们使用括号符号访问了\
