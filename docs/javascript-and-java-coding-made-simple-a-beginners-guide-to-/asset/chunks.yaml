    # 第二章：JavaScript 语法、运算符和表达式


    在第一章中，我们了解了 JavaScript 的基础，包括它的历史、在 Web 开发中的角色以及如何设置开发环境。现在，让我们深入研究 JavaScript
    语法、运算符和表达式。这些基础概念将为编写更复杂、交互性的 JavaScript 代码铺道路。


    ### 2.1 JavaScript 语法


    语法指的是规定编程语言中应如何编写代码的规则集。正确的语法确保代码结构正确，并且可以被人类和机器理解。让我们探索 JavaScript 语法的一些基本方面。


    ### 2.1.1 语句和分号


    在 JavaScript 中，语句是代码的构建模块。语句是执行特定操作的指令。JavaScript 中的每条语句都以分号（`;`）结束，表示语句的完成。虽然分号在
    JavaScript 中不是强制性的，但一致地使用它们被认为是一种良好的做法，可以避免潜在的问题。


    例如，以下语句为变量赋值：


    ```javascript

    var name = "John";

    var age = 25;

    ```


    ### 2.1.2 注释


    注释用于在代码中添加说明性笔记。它们会被 JavaScript 引擎忽略，旨在为开发者提供上下文和代码的可读性。JavaScript 有两种注释：


    - 单行注释：用双斜杠（`//`）表示。`//` 之后的任何内容都被视为注释且不会执行。


    ```javascript

    // 这是一个单行注释

    ```


    - 多行注释：在 `/*` 和 `*/` 之间。多行注释可以跨多行，适用于提供较长的解释或注释掉代码段。


    ```javascript

    /*

    这是一个多行注释。

    它可以跨多行。

    */

    ```


    ### 2.2 JavaScript 运算符


    运算符是对操作数（值或变量）执行操作的符号。它们允许我们执行数学计算、比较值、赋值等。让我们探索 JavaScript 中常用的运算符。


    ### 2.2.1 算术运算符


    算术运算符用于进行数学计算。JavaScript 包括以下算术运算符：


    - 加法（`+`）：两个两个数字或拼接两个字符串。

    - 减法（`-`）：从一个数字减去另一个。

    - 乘法（`*`）：两个两个数字。

    - 除法（`/`）：用一个数字除以另一个。

    - 取模（`%`）：返回除法的余数。

    - 递增（`++`）：将值加 1。

    - 递减（`--`）：将值减 1。


    这是一个演示使用算术运算符的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var sum = x + y;        7

    var difference = x - y; // 3

    var product = x * y;    // 10

    var quotient = x / y;    // 2.5

    var remainder = x % y;  // 1

    x++; // x 现在是 6

    y--; // y 现在是 1

    ```

