    Assignment operators are used to assign values to variables. They combine the
    assignment (`=`) operator with other arithmetic or logical operators. The most
    common assignment operators are:


    - `=`: Assigns a value to a variable.

    - `+=`: Adds a value to the current value of a variable and assigns the result.

    - `-=`: Subtracts a value from the current value of a variable and assigns the
    result.

    - `*=`: Multiplies the current value of a variable by a value and assigns the
    result.

    - `/=`: Divides the current value of a variable by a value and assigns the result.


    Here''s an example illustrating the use of assignment operators:


    ```javascript

    var x = 5;

    var y = 2;

    x += y; // Equivalent to x = x + y; (x is now 7)

    y -= 1; // Equivalent to y = y - 1; (y is now 1)

    ```


    ## 2.2.3 Comparison Operators


    Comparison operators are used to compare values and return a Boolean result (true
    or false). They are commonly used in conditional statements and loops. Here are
    some of the comparison operators in JavaScript:


    - `==`: Checks if two values are equal.

    - `!=`: Checks if two values are not equal.

    - `>`: Checks if the value on the left is greater than the value on the right.

    - `<`: Checks if the value on the left is less than the value on the right.

    - `>=`: Checks if the value on the left is greater than or equal to the value
    on the right.

    - `<=`: Checks if the value on the left is less than or equal to the value on
    the right.

    - `===`: Checks if two values are strictly equal (both value and type).


    Here''s an example demonstrating the use of comparison operators:


    ```javascript

    var x = 5;

    var y = 2;

    console.log(x == y);    // false

    console.log(x > y);      // true

    console.log(x <= 5);      // true

    console.log(x === "5"); // false

    ```


    ## 2.3 JavaScript Expressions


    Expressions are combinations of values, variables, and operators that produce
    a result. They can be as simple as a single value or as complex as a combination
    of multiple operators and variables. Understanding expressions is essential for
    writing dynamic and interactive JavaScript code.


    ### 2.3.1 Arithmetic Expressions


    Arithmetic expressions involve mathematical calculations using arithmetic operators.
    Here''s an example of an arithmetic expression:


    ```javascript

    var x = 5;

    var y = 2;

    var result = (x + y) * 3;

    console.log(result); // 21

    ```


    In this example, the expression `(x + y) * 3` performs addition and multiplication
    to produce the result 21.


    ### 2.3.2 String Concatenation


    In JavaScript, the `+` operator is also used for string concatenation. It allows
    you to combine two or more strings into a single string. Here''s an example:


    ```javascript

    var firstName = "John";

    var lastName = "Doe";

    var fullName = firstName + " " + lastName;

    console.log(fullName); // "John Doe"

    ```


    In this case, the `+` operator concatenates the values of the `firstName`, a space
    character, and the `lastName` to form the full name.


    ### 2.3.3 Logical Expressions


    Logical expressions involve logical operators (`&&`, `||`, `!`) to perform logical
    operations. They are often used in conditional statements to evaluate multiple
    conditions. Here''s an example:


    ```javascript

    var x = 5;

    var y = 10;

    var result = (x > 3) && (y < 15);

    console.log(result); // true

    ```


    In this example, the logical expression `(x > 3) && (y < 15)` evaluates whether
    both conditions are true and returns `true`.


    ## 2.4 Conclusion


    In this chapter, we delved deeper into JavaScript syntax, operators, and expressions.
    We learned about statements, semicolons, and comments, which help structure and
    document our code. We explored various types of operators, including arithmetic,
    assignment, and comparison operators, and how they can be used in JavaScript code.
    Finally, we examined expressions and how they can be used to perform mathematical
    calculations, concatenate strings, and evaluate logical conditions.


    Understanding JavaScript syntax, operators, and expressions is crucial for writing
    effective code. In the next chapter, we will explore control flow, such as conditional
    statements and loops.

