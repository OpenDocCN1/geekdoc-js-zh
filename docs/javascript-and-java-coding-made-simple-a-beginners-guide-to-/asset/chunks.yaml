    \n# 第 6 章：面向对象编程 (OOP)\n\n在之前的章节中，我们涵盖了 Java 编程的基础知识，包括变量、控制流、方法和数组。现在，在第 6 章中，我们将深入探索面向对象编程\
    \ (OOP) 的世界。面向对象编程是一种编程范式，侧重于对真实对象及其在程序中的交互进行建模。\n\n## 6.1 面向对象编程简介\n\n面向对象编程\
    \ (OOP) 是一种将代码组织成对象的编程范式，对象是类的实例。它强调封装、继承、多态和抽象的概念。OOP 允许我们通过将真实世界的实体表示为具有属性（字段）和行为（方法）的对象，从而创建模块化、可重用且易维护的代码。\n\
    \n## 6.2 类和对象\n\n在 OOP 中，类是蓝图或模板，定义了对象的结构和行为。它描述了该类的对象将拥有的属性和方法。而对象是类的实例。它们代表特定的实体并可以相互作用。\n\
    \n要创建一个类，我们使用以下语法：\n\n```java\npublic class ClassName {\n  // 类成员（字段、构造函数、方法）\n\
    }\n```\n\n示例：\n\n```java\npublic class Car {\n  // 类成员\n}\n```\n\n在上面的示例中，我们定义了一个名为\
    \ `Car` 的类。它作为创建汽车对象的蓝图。\n\n要创建一个类的对象（实例），我们使用 `new` 关键字：\n\n```java\nClassName\
    \ objectName = new ClassName();\n```\n\n示例：\n\n```java\nCar myCar = new Car();\n\
    ```\n\n在上面的示例中，我们创建了一个 `Car` 类的对象 `myCar`。\n\n## 6.3 类成员：字段和方法\n\n类由两种成员组成：字段（变量）和方法。\n\
    \n字段代表对象的属性或特性。它们存储与对象相关的状态或数据。字段可以是不同的类型，例如 `int`、`double`、`String` 甚至是其他对象。\n\
    \n而方法定义了对象可以执行的行为或动作。它们封装了与对象相关的的操作或功能。方法可以有参数并可能返回值。\n\n示例：\n\n```java\npublic\
    \ class Car {\n  // 字段\n  String brand;\n  String color;\n  int year;\n  // 方法\n\
    \  public void startEngine() {\n    System.out.println(\"Engine started!\");\n\
    \  }\n  public void drive(int distance) {\n    System.out.println(\"Driving \"\
    \ + distance + \" kilometers.\");\n  }\n}\n```\n\n在上面的示例中，`Car` 类拥有字段 `brand`、`color`\
    \ 和 `year`，代表汽车的属性。它还有方法 `startEngine()` 和 `drive(int distance)`，定义了汽车的行为。\n\n\
    ## 6.4 封装和访问修饰符\n\n封装是 OOP 中的一个重要概念，涉及将数据（字段）和方法封装类类并控制它们的访问。它有助于隐藏类的内部实现细节，并提供数据保护和安全性。\n\
    \nJava 提供了访问修饰符来控制类成员的可性和访问权限。四个访问修饰符是：\n\n- `public`：可以从任何地方访问。\n- `private`：成员只能在同一个类内被访问。\n\
    - `protected`：成员可以在同一个类、子类和同一个包内被访问。\n- 默认（无修饰符）：成员可以在同一个包内被访问。\n\n默认情况下，字段应该声明为\
    \ `private`，并且对它们的访问应该通过方法（getter 和 setter）来实现以保持封装并确保数据完整性。\n\n示例：\n\n```java\n\
    public class Car {\n  // 字段\n  private String brand;\n  private String color;\n\
    \  private int year;\n  // getter 和 setter\n  public String getBrand() {\n   \
    \ return brand;\n  }\n  public void setBrand(String brand) {\n    this.brand =\
    \ brand;\n  }\n  public String getColor() {\n    return color;\n  }\n  public\
    \ void setColor(String color) {\n    this.color = color;\n  }\n  public int getYear()\
    \ {\n    return year;\n  }\n  public void setYear(int year) {\n    this.year =\
    \ year;\n  }\n  // 方法\n  public void startEngine() {\n    System.out.println(\"\
    Engine started!\");\n  }\n  public void drive(int distance) {\n    System.out.println(\"\
    Driving \" + distance + \" kilometers.\");\n  }\n}\n```\n\n在上面的示例中，我们修改了 `Car`\
    \ 类，通过将字段设为 `private` 来实现封装。我们提供了公共的 getter 和 setter 方法来访问和修改私有字段。这样我们就可以控制 Car\
    \ 对象的内部状态。\n\n### 6.5 构造函数\n\n构造函数是一种用于初始化对象的特殊方法。它在使用 `new` 关键字创建对象时被调用。构造函数的名称与类相同，且没有返回类型。\n\
    \n示例：\n\n```java\npublic class Car {\n  private String brand;\n  private String\
    \ color;\n  private int year;\n  // 默认构造函数\n  public Car() {\n    brand = \"Unknown\"\
    ;\n    color = \"Unknown\";\n    year = 0;\n  }\n  // 参数化构造函数\n  public Car(String\
    \ brand, String color, int year) {\n    this.brand = brand;\n    this.color =\
    \ color;\n    this.year = year;\n  }\n  // ...\n}\n```\n\n在上面的示例中，为 `Car` 类添加了两个构造函数。默认构造函数将字段初始值设置为默认值。参数化构造函数接受参数以特定值初始化字段。\n\
    \n## 6.6 继承\n\n继承是 OOP 中的一种机制，允许类（子类）继承另一个类（父类）的属性和行为。子类扩展父类，继承它的字段、方法和构造函数。它促进了代码重用，并支持类之间层次关系的概念。\n\
    \n要创建一个子类，我们使用 `extends` 关键字：\n\n```java\npublic class SubclassName extends SuperclassName\
    \ {\n  // 子类成员\n}\n```\n\n示例：\n\n```java\npublic class SportsCar extends Car {\n\
    \  // 针对 SportsCar 的特定成员和方法\n  // ...\n}\n```\n\n"
