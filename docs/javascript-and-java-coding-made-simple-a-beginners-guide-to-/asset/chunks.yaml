    \ 和 `TERMINATED`。理解这些线程状态对于管理和控制线程执行至关重要。\n\n## 9.9 线程死锁与避免死锁\n\n当两个或多个线程无限阻塞并等待对方释放持有的资源时，就会发生死锁。死锁会导致程序挂起或无响应。避免死锁需要对线程进行仔细的设计和同步，以防止循环依赖和资源冲突。\n\
