    - `=`: 给变量赋值。

    - `+=`: 将一个值加到变量的当前值上并赋值。

    - `-=`: 从变量的当前值中减去一个值并赋值。

    - `*=`: 将变量的当前值乘以一个值并赋值。

    - `/=`: 将变量的当前值除以一个值并赋值。


    这里是一个说明赋值运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    x += y; // 等于 x = x + y; (x 现在是 7)

    y -= 1; // 等于 y = y - 1; (y 现在是 1)

    ```


    ## 2.2.3 比较运算符


    比较运算符用于比较值并返回布尔结果（true 或 false）。它们通常用于条件语句和循环中。以下是 JavaScript 中的一些比较运算符：


    - `==`: 检查两个值是否相等。

    - `!=`: 检查两个值是否不相等。

    - `>`: 检查左侧的值是否大于右侧的值。

    - `<`: 检查左侧的值是否小于右侧的值。

    - `>=`: 检查左侧的值是否大于等于右侧的值。

    - `<=`: 检查左侧的值是否小于等于右侧的值。

    - `===`: 检查两个值是否严格相等（值和类型）。


    这里演示比较运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    console.log(x == y);    // false

    console.log(x > y);      // true

    console.log(x <= 5);      // true

    console.log(x === "5"); // false

    ```


    ## 2.3 JavaScript 表达式


    表达式是值、变量和运算符的组合，产生结果。它们可以是简单的单个值，也可以是多个运算符和变量的组合。理解表达式对于编写动态且交互的 JavaScript 代码至关重要。


    ### 2.3.1 算术表达式


    算术表达式涉及使用算术运算符进行数学计算。这里有一个算术表达式的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var result = (x + y) * 3;

    console.log(result); // 21

    ```


    在这个示例中，表达式 `(x + y) * 3` 执行加法和乘法以产生结果 21。


    ### 2.3.2 字符串拼接


    在 JavaScript 中，`+` 运算符也用于字符串拼接。它允许将两个或多个字符串合并成一个字符串。这里有一个示例：


    ```javascript

    var firstName = "John";

    var lastName = "Doe";

    var fullName = firstName + " " + lastName;

    console.log(fullName); // "John Doe"

    ```


    在这种情况下，`+` 运算符将 `firstName`、空格字符和 `lastName` 的值拼接形成全名。


    ### 2.3.3 逻辑表达式


    逻辑表达式涉及使用逻辑运算符 (`&&`, `||`, `!`）执行逻辑操作。它们通常用于条件语句来评估多个条件。这里有一个示例：


    ```javascript

    var x = 5;

    var y = 10;

    var result = (x > 3) && (y < 15);

    console.log(result); // true

    ```


    在这个示例中，逻辑表达式 `(x > 3) && (y < 15)` 评估两个条件是否都真并返回 `true`。


