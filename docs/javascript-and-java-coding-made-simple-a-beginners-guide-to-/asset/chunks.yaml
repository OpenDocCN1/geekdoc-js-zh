    from Node.js version 12, support for ECMAScript modules (ESM) has been added,
    allowing you to use native module syntax in your Node.js applications.


    When working with modules, there are also various tools and frameworks available
    that provide additional features and optimizations. Some popular ones include
    TypeScript, Babel, and Parcel. These tools can enhance your development workflow
    and enable you to leverage advanced module capabilities.


    10.5 Conclusion


    JavaScript modules play a vital role in modern JavaScript development. They allow
    us to write modular, reusable code and prevent global namespace pollution. By
    leveraging the `export` and `import` keywords, we can define the parts of our
    modules that should be accessible to other modules and easily import them as needed.


    In this chapter, we covered the basics of JavaScript modules, including module
    syntax, exporting and importing entities, and best practices for modular development.
    We also discussed module environments and the tools available to support module
    development in different contexts.


    By adopting modular development practices and utilizing the power of JavaScript
    modules, you can create more maintainable, scalable, and organized codebases.
    In the next chapter, we will delve into the world of classes and object-oriented
    programming in JavaScript, taking our code organization and reusability to the
    next level.


    # Chapter 11: Object-Oriented Programming in JavaScript


    In this chapter, we will explore object-oriented programming (OOP) in JavaScript.
    Object-oriented programming is a powerful paradigm that allows us to model real-world
    entities as objects, encapsulate data and behavior within those objects, and interact
    between them. JavaScript supports OOP principles through its prototype-based inheritance
    system.


    ### 11.1 Introduction to Object-Oriented Programming


    Object-oriented programming is a programming paradigm centered around the concept
    of objects. An object is an instance of a class, which serves as a blueprint defining
    the properties and behaviors of objects belonging to that class.


    The key principles of object-oriented programming are:


    - Encapsulation: Encapsulation allows us to encapsulate related data (properties)
    and functionality (methods) within an object, preventing direct access from outside
    and providing controlled access through defined interfaces.


    - Inheritance: Inheritance enables objects to inherit properties and methods from
    other objects. It promotes code reuse and hierarchical relationships between classes.


    - Polymorphism: Polymorphism allows objects of different classes to be treated
    as objects of a common superclass. It enables flexible and interchangeable usage
    of objects based on their shared behaviors.


    ### 11.2 Creating Objects in JavaScript


    In JavaScript, objects can be created using object literals or constructor functions.


    Object literals are a convenient way to create objects by defining their properties
    and methods directly. Here''s an example:


    ```javascript


    const person = {


    name: ''John'',


    age: 30,


    greet() {


    console.log(`Hello, my name is ${this.name} and I''m ${this.age} years old.`);


    }


    };


    person.greet(); // Output: Hello, my name is John and I''m 30 years old.


    ```


    Constructor functions provide a way to create objects based on a blueprint (class)
    using the `new` keyword. Here''s an example:


    ```javascript


    function Person(name, age) {


    this.name = name;


    this.age = age;


    }


    Person.prototype.greet = function() {


    console.log(`Hello, my name is ${this.name} and I''m ${this.age} years old.`);


    };


    const person = new Person(''John'', 30);


    person.greet(); // Output: Hello, my name is John and I''m 30 years old.


    ```


    In this example, we define a `Person` constructor function that takes `name` and
    `age` as parameters. We assign these values to the object using the `this` keyword.
    The `greet()` method is added to the prototype of the `Person` constructor function
    for shared functionality among all instances.


    ### 11.3 Inheritance and Prototypes in JavaScript


    JavaScript uses prototypal inheritance to implement inheritance between objects.
    Each object has an internal property called `[[Prototype]]` that points to its
    prototype object. Prototypes are used to inherit properties and methods from other
    objects.


    We can create an inheritance relationship between objects using the `Object.create()`
    method or the `class` syntax introduced in ECMAScript 2015 (ES6).


    Here''s an example using `Object.create()`:


    ```javascript


    const personPrototype = {


    greet() {


    console.log(`Hello, my name is ${this.name} and I''m ${this.age} years old.`);


    }


    };


    const person = Object.create(personPrototype);


    person.name = ''John'';


    person.age = 30;


    person.greet(); // Output: Hello, my name is John and I''m 30 years old.


    ```


    In this example, we create a `personPrototype` object that serves as the prototype
    for our `person` object. The `person` object inherits the `greet()` method from
    the `personPrototype` object.


    Alternatively, we can use the `class` syntax to define classes and create inheritance
    relationships. Here''s an example:


    ```javascript


    class Person {


    constructor(name, age) {


    this.name = name;


    this.age = age;


    }


    greet() {


    console.log(`Hello, my name is ${this.name} and I''m ${this.age} years old.`);


    }


    }


    class Student extends Person {


    constructor(name, age, grade) {


    super(name, age);


    this.grade = grade;


    }


    study() {


    console.log(`${this.name} is studying hard for the ${this.grade} grade.`);


    }


    }


    const student = new Student(''John'', 15, 9);


    student.greet(); // Output: Hello, my name is John and I''m 15 years old.


    student.study(); // Output: John is studying hard for the 9th grade.


    ```'
