    \n## 函数声明 vs 函数表达式\n\n在 JavaScript 中，函数不仅是代码块，它们还是值。这意味着你可以将函数赋值给变量，将它们作为参数传递，并从其他函数返回。这种灵活性导致了定义函数的两种方式：函数声明和函数表达式。\n\
