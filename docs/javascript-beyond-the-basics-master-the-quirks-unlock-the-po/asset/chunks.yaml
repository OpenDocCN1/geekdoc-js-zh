  trans: "\n\n运算符是 JavaScript 中对数据执行操作的符号和关键字。它们是语言中的“动词”，允许你操作值、比较这些值并根据结果做出决策。\n\
    \n### 算术运算符：执行计算\n\n这些运算符对数值执行基础的数学运算：\n\n* `+` (加法)：将两个数字相加。\n* `-` (减法)：从一个数字中减去另一个数字。\n\
    * `*` (乘法)：将两个数字相乘。\n* `/` (除法)：将一个数字除以另一个数字。\n* `%` (取模)：返回除法的余数。\n* `**` (幂)：将一个数字的另一个数字次方。\n\
    \n```javascript\nlet x = 10, y = 3;\nconsole.log(x + y);    // Output: 13\nconsole.log(x\
    \ - y);    // Output: 7\nconsole.log(x * y);    // Output: 30\nconsole.log(x /\
    \ y);    // Output: 3.3333333333333335\nconsole.log(x % y);    // Output: 1\n\
    console.log(2 ** 3);   // Output: 8 (2 to the power of 3)\n```\n\n### 赋值运算符：分配值\n\
    \n这些运算符用于给变量赋值：\n\n* `=` (赋值)：给变量分配一个值。\n* `+=` (加法赋值)：给变量原有值加上一个值并将结果赋值。\n* `-=`\
    \ (减法赋值)：与 `+=` 类似，但执行的是减法。\n* `*=`, `/=`, `%=`, `**=`：与 `+=` 和 `-=` 类似，但分别用于乘法、除、取模和幂。\n\
    \n```javascript\nlet count = 5;\ncount += 3;  // Equivalent to count = count +\
    \ 3; count is now 8\ncount *= 2;  // Equivalent to count = count * 2; count is\
    \ now 16\n```\n\n### 比较运算符：进行比较\n\n这些运算符比较两个值并返回布尔（true 或 false）结果：\n\n* `==`\
    \ (相等)：检查两个值是否相等（带有类型转换）。\n* `!=` (不相等)：检查两个值是否不等（带有类型转换）。\n* `>` (大于)：检查第一个值是否大于第二个值。\n\
    * `<` (小于)：检查第一个值是否小于第二个值。\n* `>=` (大于等于)：检查第一个值是否大于或等于第二个值。\n* `<=` (小于等于)：检查第一个值是否小于或等于第二个值。\n\
    \n```javascript\nconsole.log(5 == 5);      // Output: true\nconsole.log(5 != '5');\
    \     // Output: false (type coercion happens)\nconsole.log(10 > 3);      // Output:\
    \ true\n```\n\n### 逻辑运算符：组合条件\n\n这些运算符组合了布尔表达式：\n\n* `&&` (逻辑与)：当两个表达式都为真时，返回\
    \ true。\n* `||` (逻辑或)：当至少有一个表达式为真时，返回 true。\n* `!` (逻辑非)：反转表达式的真假值。\n\n```javascript\n\
    let isSunny = true;\nlet isWarm = false;\nconsole.log(isSunny && isWarm); // Output:\
    \ false\nconsole.log(isSunny || isWarm); // Output: true\nconsole.log(!isSunny);\
    \           // Output: false\n```\n\n### 字符串运算符：处理文本\n\n* `+` (连接)：将两个字符串连接在一起。\n\
    * `+=` (连接赋值)：拼接字符串并将结果赋值。\n\n```javascript\nlet firstName = \"John\";\nlet lastName\
    \ = \"Doe\";\nlet fullName = firstName + \" \" + lastName; // \"John Doe\"\nfullName\
    \ += \", the JavaScript enthusiast\"; // \"John Doe, the JavaScript enthusiast\"\
    \n```\n\n### 其他运算符：概览\n\nJavaScript 还有许多其他运算符，包括：\n\n* 三元运算符 (`? :`)：条件表达式的简写形式。\n\
    * `typeof` 运算符：以字符串形式返回值的数据类型（例如：\"number\", \"string\", \"boolean\"）。\n* `delete`\
    \ 运算符：从对象中删除一个属性。\n\n通过掌握这些运算符，你将获得有效地操作数据、做出决策并控制 JavaScript 程序执行流的能力。\n\n##\
    \ 表达式：整合一切\n\n表达式是 JavaScript 计算的核心。它们是值、变量和运算符的组合，在求值时产生一个结果。可以将它们想象成 JavaScript\
    \ 代码中的句子，每个句子都表达一个特定的操作或计算。\n\n### 表达式的类型：\n\n1. 算术表达式：涉及加法、减法、乘法和除法等数学运算。它们处理数字并产生数值结果。\n\
    ```javascript\nlet sum = 5 + 8; // 13\nlet product = price * quantity;\n```\n\
    2. 字符串表达式：处理文本。\n```javascript\nlet message = \"Hello, \" + name;\nlet description\
    \ = `${item} costs.`;\n```\n3. 布尔表达式：求值为真或为假。\n```javascript\nlet isEligible =\
    \ age >= 18 && hasLicense;\n```\n\n### 表达式是如何被求值的\n\nJavaScript 按照特定规则求值表达式：\n\
    \n* 运算符优先级：决定了运算符应用的顺序。例如，`*` 和 `/` 的优先级高于 `+` 和 `-`。\n* 结合性：决定了如何对相同优先级的运算符分组。JavaScript\
    \ 中的大多数运算符是左结合的。\n\n### 在代码中使用表达式\n\n表达式用于 JavaScript 的许多部分：\n\n* 赋值：`=` 的右侧是一个表达式。\n\
    * 函数参数：表达式传递给函数。\n* 返回语句：函数通常返回表达式的结果。\n* 控制结构：布尔表达式用于 `if` 语句、循环和其他控制结构。\n\n\
    ### 示例：\n\n```javascript\nfunction calculateArea(length, width) {\n  return length\
    \ * width; // 算术表达式\n}\n\nconst area = calculateArea(10, 5); // 使用表达式作为参数调用函数\n\
    \nif (area > 50) { // 布尔表达式\n  console.log(\"The area is large.\");\n} else {\n\
    \  console.log(\"The area is small.\");\n}\n```\n在此示例中，`calculateArea` 函数接收两个参数（都是表达式并返回它们的乘积（另一个表达式）。`if`\
    \ 语句使用布尔表达式来决定打印什么消息。\n\n### 核心要点\n\n掌握表达式对于有效使用 JavaScript 至关重要。它们是计算、决策和数据操作的基础。理解优先级和结合性有助于你编写出符合预期的代码。\n\
    \n"
- fmt: "\n# Conditional Statements: Making Decisions in Your Code\n\nConditional statements\
    \ are the backbone of logic in programming. They allow your code to make decisions\
    \ based on specific conditions, choosing different actions to take based on whether\
    \ a condition is true or false. This ability to branch and adapt based on data\
    \ is what makes software truly “smart.”\n\n### if Statements: The Fundamental\
    \ Choice\n\nThe `if` statement is the most basic conditional statement. It checks\
    \ a condition (a boolean expression), and if that condition is true, it executes\
    \ the code block within its curly braces `{}`.\n\n```javascript\nlet temperature\
    \ = 20;\n\nif (temperature > 15) {\n  console.log(\"It's a warm day!\");\n}\n\
    ```\n\nIn this example, the code inside the `if` block will only execute if `temperature`\
    \ is greater than 15.\n\n### else Statements: The Alternative Path\n\nThe `else`\
    \ statement provides an alternative code block to execute if the `if` condition\
    \ is false.\n\n```javascript\nif (temperature > 15) {\n  console.log(\"It's a\
    \ warm day!\");\n} else {\n  console.log(\"It's a bit chilly.\");\n}\n```\n\n\
    ### else if Statements: Handling Multiple Conditions\n\nWhen you need to check\
    \ multiple conditions in sequence, you can use `else if` statements. Each `else\
    \ if` block is evaluated only if the preceding `if` and any previous `else if`\
    \ conditions are false.\n\n```javascript\nif (temperature > 25) {\n  console.log(\"\
    It's hot!\");\n} else if (temperature > 15) {\n  console.log(\"It's warm.\");\n\
    } else {\n  console.log(\"It's cool.\");\n}\n```\n\n### Real-World Applications\n\
    \nConditional statements are used extensively in real-world JavaScript applications:\n\
    \n- ● User Input Validation: Checking if user-entered data is valid (e.g., email\
    \ format, password strength).\n- ● Form Submission: Determining if a form should\
    \ be submitted based on field values.\n- ● Game Logic: Controlling game flow based\
    \ on player actions and game state.\n- ● Interactive Web Pages: Modifying page\
    \ content based on user preferences or device capabilities.\n\n### Proper Indentation\
    \ and Code Organization\n\nClear and consistent indentation is crucial for making\
    \ your conditional statements easy to read and understand. Nested `if...else`\
    \ structures can become complex, so proper indentation helps visualize the logic.\n\
    \n```javascript\n// Good indentation\nif (condition1) {\n  // Code to execute\
    \ if condition1 is true\n} else if (condition2) {\n  // Code to execute if condition1\
    \ is false and condition2 is true\n} else {\n  // Code to execute if both condition1\
    \ and condition2 are false\n}\n```\n\nIn summary, conditional statements empower\
    \ your JavaScript code with the ability to make decisions based on various conditions.\
    \ By mastering `if`, `else if`, and `else`, you’ll be able to create more dynamic,\
    \ interactive, and intelligent applications.\n\n# Loops: Repeating Actions Efficiently\n\
    \nLoops are powerful constructs in programming that allow you to automate repetitive\
    \ tasks. Instead of writing the same code multiple times, you can use a loop to\
    \ execute a block of code repeatedly as long as a certain condition is met. This\
    \ saves you time and effort, and it makes your code cleaner and more maintainable.\n\
    \n### for Loops: The Workhorses of Iteration\n\nThe `for` loop is the most common\
    \ and versatile loop in JavaScript. It consists of three parts:\n\n1. Initialization:\
    \ A variable is initialized to a starting value (e.g., `let i = 0`).\n2. Condition:\
    \ A boolean expression is checked before each iteration. The loop continues as\
    \ long as this condition is true.\n3. Update Expression: This expression modifies\
    \ the initialized variable after each iteration (e.g., `i++`).\n\n```javascript\n\
    for (let i = 0; i < 5; i++) {\n  console.log(i); // Output: 0 1 2 3 4\n}\n```\n\
    \nIn this example, the loop iterates five times, printing the numbers 0 through\
    \ 4 to the console.\n\nYou can use `for` loops to iterate over arrays and strings:\n\
    \n```javascript\nconst numbers = [1, 2, 3, 4, 5];\nfor (let i = 0; i < numbers.length;\
    \ i++) {\n  console.log(numbers[i]);\n}\n\nconst message = \"Hello\";\nfor (let\
    \ i = 0; i < message.length; i++) {\n  console.log(message[i]);\n}\n```\n\n###\
    \ while Loops: Iterate Until a Condition Fails\n\nThe `while` loop is simpler\
    \ than a `for` loop. It executes a block of code repeatedly as long as its condition\
    \ is true.\n\n```javascript\nlet count = 0;\nwhile (count < 5) {\n  console.log(count);\n\
    \  count++;\n}\n```\n\nThis loop does the same thing as the `for` loop example\
    \ above. `while` loops are often used when the number of iterations is not known\
    \ in advance, like when waiting for user input or processing data from a stream.\n\
    \n### do...while Loops: At Least Once, Guaranteed\n\nThe `do...while` loop is\
    \ similar to a `while` loop, but it guarantees that the loop body executes at\
    \ least once, even if the condition is initially false.\n\n```javascript\nlet\
    \ input;\ndo {\n  input = prompt(\"Enter a number greater than 0:\");\n} while\
    \ (input <= 0);\n```\n\nThis loop will repeatedly prompt the user for input until\
    \ they enter a number greater than 0.\n\n### for...in Loops: Iterate Over Object\
    \ Properties\n\nThe `for...in` loop iterates over the enumerable properties of\
    \ an object. Note that it iterates over property names (keys), not values.\n\n\
    ```javascript\nconst person = { name: \"Alice\", age: 30, city: \"New York\" };\n\
    for (let key in person) {\n  console.log(key + \": \" + person[key]);\n}\n```\n\
    \nThis loop will print:\nname: Alice\nage: 30\ncity: New York\n\n### for...of\
    \ Loops: Iterate Over Iterable Objects\n\nThe `for...of` loop is used to iterate\
    \ over iterable objects like arrays, strings, Maps, Sets, and more. It provides\
    \ a clean syntax for accessing the values directly.\n\n```javascript\nconst numbers\
    \ = [1, 2, 3];\nfor (let num of numbers) {\n  console.log(num);\n}\n```\n\n###\
    \ Best Practices for Looping\n\n- ● Clear Termination Condition: Ensure your loops\
    \ have a well-defined condition that will eventually become false to avoid infinite\
    \ loops.\n- ● Keep Loop Bodies Concise: Avoid putting too much logic within the\
    \ loop body for readability.\n- ● Choose the Right Loop: Use the appropriate loop\
    \ type for the task at hand. `for` loops are generally best for known iteration\
    \ counts, while `while` and `do...while` loops are better for conditions that\
    \ may change during iteration.\n\nLoops are an essential tool in your JavaScript\
    \ arsenal. By understanding the different types of loops and applying best practices,\
    \ you can write more efficient, maintainable, and expressive code.\n\n# Functions:\
    \ Organizing and Reusing Code\n\nFunctions are the backbone of well-structured\
    \ JavaScript code. They encapsulate blocks of code designed to perform specific\
    \ tasks, making your programs more organized, efficient, and easier to maintain.\
    \ Think of functions as self-contained mini-programs that you can call upon whenever\
    \ you need their specific functionality.\n\n### Defining Functions: Two Flavors\n\
    \nThere are two primary ways to define functions in JavaScript:\n\n1. Function\
    \ Declarations: The traditional way, using the `function` keyword followed by\
    \ the function name, parameters in parentheses, and the code block within curly\
    \ braces.\n\n```javascript\nfunction greet(name) {\n  console.log(\"Hello, \"\
    \ + name + \"!\");\n}\n```\n\n2. Function Expressions (including Arrow Functions):\
    \ Assigning a function to a variable. Arrow functions, introduced in ES6, provide\
    \ a more concise syntax.\n\n```javascript\nconst greet = function(name) {\n  console.log(\"\
    Hello, \" + name + \"!\");\n};\n\n// Arrow function syntax (ES6+)\nconst greet\
    \ = (name) => {\n  console.log(\"Hello, \" + name + \"!\");\n};\n```\n\n### Function\
    \ Parameters and Arguments: Passing Data In\n\nFunctions can accept input values\
    \ called parameters. When you call a function, you provide the actual values known\
    \ as arguments.\n\n```javascript\nfunction add(a, b) {\n  return a + b;\n}\n\n\
    let sum = add(5, 3); // 5 and 3 are arguments\nconsole.log(sum); // Output: 8\n\
    ```\n\n### Return Values: Getting Data Out\n\nFunctions can return a value using\
    \ the `return` statement. This allows you to use the result of a function’s computation\
    \ elsewhere in your code.\n\n```javascript\nfunction square(x) {\n  return x *\
    \ x;\n}\n\nlet result = square(4);\nconsole.log(result); // Output: 16\n```\n\n\
    ### Calling Functions: Putting Them to Work\n"
