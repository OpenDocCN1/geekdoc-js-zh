    \n- **Global Scope**: This is the outermost container, like the entire house.\
    \ Variables declared here are accessible from any room.\n- **Local Scope (Function\
    \ Scope)**: Each function creates its own room. Variables declared inside a function\
    \ are only visible within that room.\n- **Block Scope**: Introduced in ES6 (ECMAScript\
    \ 2015), blocks of code (like those in `if` statements, loops, or standalone `{}`)\
    \ also create their own tiny rooms within a function.\n\n### Scope’s Role in Your\
    \ Code\n\nScope acts as a gatekeeper, controlling which variables are accessible\
