  trans: "\n局部作用域这一概念对于封装至关重要。封装意味着将数据以及操作这些数据的结合在一起。局部变量通过保持数据私有化并防止来自代码其他部分的意外访问，帮助实现这一目标。这减少了由意外修改引起的错误风险，并使你的代码更具模块化且易于维护。\n\
    \n### 示例：函数的内部圣域\n\n```javascript\nfunction calculateArea(width, height) {\n \
    \ let area = width * height; // 局部变量\n  console.log(`The area is: ${area}`);\n\
    }\n\ncalculateArea(5, 10); // 输出: \"The area is: 50\"\nconsole.log(area);  //\
    \ 错误！'area' 未定义（在函数外部）\n```\n\n在此示例中：\n\n1. `calculateArea` 函数在其作用域内定义了一个局部变量\
    \ `area`。\n2. 该函数计算面积并将其打印到控制台。\n3. 在函数外部尝试访问 `area` 会导致错误，因为它是一个局部变量，全局作用域中不存在。\n\
    \n### 访问和修改局部变量\n\n你可以在函数体内部自由地访问和修改局部变量：\n\n```javascript\nfunction countToTen()\
    \ {\n  let count = 1;\n  while (count <= 10) {\n    console.log(count);\n    count++;\n\
    \  }\n}\n\ncountToTen();\n```\n\n在这个循环中，`count` 变量是 `countToTen` 函数局部的，仅在循环内部可访问。\n\
    \n### 为什么局部作用域很重要\n\n- **数据保护**：局部变量免受外部干扰，防止了因意外修改导致的 Bug。\n- **代码复用性**：带有局部变量的函数可以在不同的上下文中使用，而必担心变量名冲突。\n\
    - **内存管理**：局部变量在函数执行完毕后会自动销毁，释放内存资源。\n\n通过有效理解和使用局部作用域，你将能够编写更有组织、更健壮且易于维护的 JavaScript\
    \ 代码。\n\n## 块作用域：使用 `let` 和 `const` 进行精粒度控制\n\n在现代 JavaScript (ES6 及更高版本) 中，块作用域对变量的可访问性提供了更精细的控制。与函数作用域或全局作用域的\
    \ `var` 不同，用 `let` 和 `const` 声明的变量具有块作用域。这意味着它们的可见性被限于定义它们的特定代码块（由大括号 `{}` 隔开）。\n\
    \n### 块：不仅仅是函数\n\n代码块在 JavaScript 中无处不在。它们不仅限于函数。你会在以下地方遇到它们：\n\n- 条件语句 (`if`,\
    \ `else if`, `else`）\n- 循环 (`for`, `while`, `do...while`）\n- 独立块：你可以使用大括号显式地创建块。\n\
    \n```javascript\nif (true) {\n  let blockVar = \"我是块作用域的\";\n  console.log(blockVar);\
    \ // 在此块内可访问\n}\n\nconsole.log(blockVar);   // 错误！此处无法 blockVar\n```\n\n在此示例中，`blockVar`\
    \ 定义在 `if` 语句的块内部，且仅在该块内可访问。\n\n### 块作用域的优势\n\n- **增强封装性**：块作用域提供了一种更精确的方式来控制变量可见性，进一步促进了封装并防止了意外的副作用。\n\
    - **避免变量提升问题**：用 `let` 和 `const` 声明的变量不会像 `var` 变量那样被提升。这意味着你不能在块内的声明之前访问它们，使得你的代码更具可预测性。\n\
    - **最小化变量寿命**：具有块作用域的变量仅存在于各自的块中，减少了内存泄漏的概率并提高了代码的清晰度。\n\n### 示例：循环中的块作用域\n\n\
    ```javascript\nfor (let i = 0; i < 5; i++) {\n  let message = `迭代 ${i}`;\n  console.log(message);\
    \ // 在此循环迭代内可访问\n}\n\nconsole.log(message);  // 错误！循环外部无法访问 message\nconsole.log(i);\
    \         // 错误！循环外部无法访问 i\n```\n\n在这里，`i` 和 `message` 都是每次迭代的块作用域。它们在循环外部是不可见的。\n\
    \n### 拥抱块作用域\n\n通过使用 `let` 和 `const` 并理解块作用域，你可以编写更整洁、易于维护且不易出错的 JavaScript 代码。将块作用域视为一种强大的工具，用于管理变量并确保你的代码行为符合预期。\n\
    \n## 作用域链：层级查找\n\n想象你正在图书馆里找一本书。你从搜索当前书架开始。如果那里没有，移动到下一个书架，然后是下一个走廊，最后是整个图书馆。JavaScript\
    \ 的作用域链在搜索变量时的工作原理类似。\n\n### 嵌套作用域：访问的层级结构\n\nJavaScript 域可以相互嵌套，形成一种被称为作用域链的层级结构。每个作用域都可以访问在其内部声明的变量以及任何外部（父级）作用域中声明的变量。\n\
    \n全局作用域\n└── 函数 A\n  └── 函数 B\n    └── 块 C\n\n在此示例中，`块 C` 可以访问来自 `函数 B`、`函数 A`\
    \ 和全局作用域的变量。`函数 B` 可以访问来自 `函数 A` 和全局作用域的变量。`函数 A` 只能访问全局作用域的变量。\n\n### 查找过程：爬梯\n\
    \n当你在 JavaScript 中访问变量时，引擎遵循特定的搜索模式：\n\n1. **当前作用域**：它首先在当前作用域（例如块或函数）中查找变量。\n\
    2. **父级作用域**：如果未找到，它移动到父级作用域（闭包函数）。\n3. **祖父作用域**：它沿着作用域链向上继续。\n4. **全局作用域**：最后，它检查全局作用域。如果仍然未找到，\
    \ JavaScript 将抛出错误。\n\n### 可视化作用域链\n\n```javascript\nlet outerVar = \"我在外部！\"\
    ;\n\nfunction outerFunction() {\n  let innerVar = \"我在内部！\";\n\n  function innerFunction()\
    \ {\n    console.log(outerVar); // 输出: \"我在外部！\"\n    console.log(innerVar); //\
    \ 输出: \"我在内部！\"\n  }\n\n  innerFunction();\n}\n\nouterFunction();\n```\n\n作用域图\n\
    全局作用域 (outerVar)\n└── outerFunction (innerVar)\n  └── innerFunction\n\n图中，`innerFunction`\
    \ 可以访问全局作用域的 `outerVar` 和来自函数作用域的 `innerVar`。\n\n### 为什么作用域链很重要\n\n- **变量解析**：作用域链决定了\
    \ JavaScript 如何解析变量引用，确保使用正确的值。\n- **封装**：它通过防止访问预期作用域之外的变量来强制封装。\n- **可预测性**：理解作用域链可以帮助你预测代码的行为并避免意外错误。\n\
    \n## 词法作用域：变量所在地\n\n词法作用域（也称为静态作用域）是 JavaScript 中的一个基本概念，决定了代码中变量的可见性和可访问性。它就像变量的家庭地址，是在编写代码时确定的，在执行期间不会改变。\n\
    \n### 位置决定：词法环境\n\n在 JavaScript 中，变量的作用域是由它们在源代码中的位置决定的。每个代码块（由大括号 `{}` 限定）都会创建一个词法环境。该环境跟踪内部声明的变量。\n\
    \n当 JavaScript 遇到变量引用时，它首先在当前词法环境中查找。如果在那里未找到，它会移动到父级词法环境，然后是父级，以此类推，直到全局作用域。这个词法环境的链就是我们所的作用域链。\n\
    \n### 编写时，而非执行时\n\n"
- fmt: "\nLexical scope is statically determined, meaning it’s established when you\
    \ write your code, not when you run it. This makes your code more predictable\
    \ because you can easily trace where a variable is defined and where it can be\
    \ accessed based on its position in the code structure.\n\n### Nested Functions\
    \ and Lexical Scope\n\nNested functions are a key feature in JavaScript. They\
    \ demonstrate the power of lexical scope. A nested function has access to the\
    \ variables declared in its own scope, as well as the variables declared in its\
    \ outer (parent) scopes.\n\n```javascript\nfunction outerFunction() {\n  let outerVar\
    \ = 10;\n  function innerFunction() {\n    let innerVar = 20;\n    console.log(outerVar);\
    \ // Accessing outerVar from the outer scope\n    console.log(innerVar); // Accessing\
    \ innerVar from the inner scope\n  }\n  innerFunction();\n}\n\nouterFunction();\n\
    ```\n\nIn this example:\n- The `innerFunction` can access both `outerVar` (from\
    \ its parent function’s scope) and `innerVar` (from its own scope).\n- The `outerFunction`\
    \ can access `outerVar`, but not `innerVar` (because it’s declared in a nested\
    \ scope).\n- Outside of both functions, neither variable is accessible.\n\n###\
    \ Why Lexical Scope Matters\n\nLexical scope provides several benefits:\n\n- **Readability**:\
    \ You can easily determine the scope of a variable by looking at its declaration\
    \ in the code.\n- **Maintainability**: Code is more organized and easier to reason\
    \ about when variables are scoped appropriately.\n- **Encapsulation**: Lexical\
    \ scope helps to encapsulate data, preventing accidental modification from other\
    \ parts of the code.\n- **Closure Formation**: Lexical scope plays a crucial role\
    \ in the creation of closures, which we’ll explore in the next chapter.\n\nBy\
    \ understanding lexical scope, you’ll gain a deeper understanding of how JavaScript\
    \ manages variables and how to write code that is more predictable, modular, and\
    \ easier to maintain.\n\n## Common Scope-Related Mistakes\n\nEven with a solid\
    \ understanding of scope, it’s easy to fall into traps that lead to unexpected\
    \ behavior or errors. Let’s explore some common mistakes and how to avoid them:\n\
    \n### 1. Accidental Global Variables: The Undeclared Menace\n\nForgetting to declare\
    \ a variable using `var`, `let`, or `const` doesn’t mean your code won’t run.\
    \ Instead, JavaScript implicitly creates a global variable for you. This can lead\
    \ to namespace pollution and unexpected interactions between different parts of\
    \ your code.\n\n```javascript\nfunction myFunction() {\n  undeclaredVar = 10;\
    \ // Oops! Forgot 'let' or 'const'\n}\n\nmyFunction();\nconsole.log(undeclaredVar);\
    \ // Output: 10 (global variable)\n```\n\n**How to Avoid**: Always declare your\
    \ variables explicitly using `let` or `const` (and avoid `var` in modern JavaScript).\
    \ This ensures they have the correct scope and prevents accidental globals.\n\n\
    ### 2. Shadowing: The Variable Imposter\n\nWhen you declare a variable with the\
    \ same name in a nested scope as a variable in an outer scope, you’re essentially\
    \ creating a “shadow” variable. The outer variable becomes hidden within the inner\
    \ scope, leading to potential confusion.\n\n```javascript\nlet message = \"Hello\
    \ from the outside!\";\nfunction sayHello() {\n  let message = \"Hello from inside!\"\
    ;\n  console.log(message); // Output: \"Hello from inside!\"\n}\n\nsayHello();\n\
    console.log(message); // Output: \"Hello from the outside!\"\n```\n\n**How to\
    \ Avoid**: Be mindful of variable names, especially when dealing with nested functions\
    \ or blocks. Consider using different names to avoid shadowing or explicitly referencing\
    \ the outer variable using a different identifier.\n\n### 3. Modified Closures:\
    \ The Changing Landscape\n\nClosures, a powerful feature we’ll explore in depth\
    \ later, can also lead to unexpected behavior when combined with variable modification.\
    \ A closure captures variables from its surrounding scope, but it captures them\
    \ by reference, not by value.\n\n```javascript\nlet counter = 0;\nfunction createCounter()\
    \ {\n  return function() {\n    counter++;\n    console.log(counter);\n  };\n\
    }\n\nconst increment = createCounter();\nincrement(); // Output: 1\nincrement();\
    \ // Output: 2\n```\n\n**How to Avoid**: Be aware that closures capture variables\
    \ by reference. If you need to preserve a value, consider creating a copy of the\
    \ variable inside the closure or using techniques like immediately invoked function.\n\
    \n### Best Practices: Keep Your Scope\n\n- **Use Strict Mode**: Use `\"use strict\"\
    ;` to catch common coding misconfigurations.\n- **Declare Variables Explicitly**:\
    \ Use `let` or `const` to avoid accidental global variables.\n- **Mind Your Naming**:\
    \ Be mindful of variable names to avoid shadowing.\n- **Closures with Care**:\
    \ Understand how closures capture variables by reference.\n\n## Chapter Summary\n\
    \nIn this chapter, we’ve embarked on a journey through scope. We started by defining\
    \ global scope, the all-encompassing space. We then introduced local (function)\
    \ scope, providing privacy. Building on that, we discussed block scope, enhancing\
    \ encapsulation.\n\nWe also explored the scope chain, the hierarchical structure\
    \ JavaScript uses to search for variables. Additionally, we highlighted how lexical\
    \ scope is determined at the time you write code. Finally, we addressed common\
    \ mistakes, such as accidental variables, shadowing, and unexpected closure behavior.\
    \ By following best practices like using strict mode, declaring variables explicitly,\
    \ and being mindful of variable names, you can write cleaner code.\n\nMastering\
    \ scope is a fundamental step toward becoming a proficient developer. By understanding\
    \ the rules that govern visibility and accessibility, you’ll be well-equipped\
    \ to write code that is organized, maintainable, and free from surprises.\n\n\
    # The Power of Closures: Functions That “Remember” Their Surroundings\n\n####\
    \ Outline\n\n- What is a Closure?\n- How Closures Work: Lexical Scoping and Inner\
    \ Functions\n- The Closure’s Backpack: Remembering Variables\n- Practical Applications\
    \ of Closures\n- Chapter Summary\n\n* *\n\n## What is a Closure?\n\nIn the intricate\
    \ world of JavaScript, closures are a fascinating phenomenon. At its core, a closure\
    \ is simply a function’s ability to “remember” the variables and functions that\
    \ existed in the environment where it was created, even after the outer function\
    \ has completed its execution.\n\nThink of a closure as a function with a backpack.\
    \ When it’s created, it packs all the variables and functions from its surrounding\
    \ scope into its backpack. Even if the outer function goes away (finishes executing),\
    \ the inner function still has access to everything it packed away.\n\n### Not\
    \ Just a Snapshot\n\nIt’s important to note that this “memory” is not a snapshot\
    \ of the values at the time the closure is formed. It’s a live connection. If\
    \ the values of those outer variables change, the closure will see those changes\
    \ when it accesses them later.\n\n### A Simple Example\n"
  raw: 'Lexical scope is statically determined, meaning it’s established when you
    write your code, not when you run it. This makes your code more predictable because
    you can easily trace where a variable is defined and where it can be accessed
    based on its position in the code structure.


    ### Nested Functions and Lexical Scope


    Nested functions are a key feature in JavaScript. They demonstrate the power of
    lexical scope. A nested function has access to the variables declared in its own
    scope, as well as the variables declared in its outer (parent) scopes.


    function outerFunction() {


      let outerVar = 10;


      function innerFunction() {


        let innerVar = 20;


        console.log(outerVar); // Accessing outerVar from the outer scope


        console.log(innerVar); // Accessing innerVar from the inner scope


      }


      innerFunction();


    }


    outerFunction();


    In this example:


    ● The  innerFunction can access both  outerVar (from its parent function’s scope)
    and  innerVar (from its own scope).


    ● The  outerFunction can access  outerVar, but not  innerVar (because it’s declared
    in a nested scope).


    ●     Outside of both functions, neither variable is accessible.


    ### Why Lexical Scope Matters


    Lexical scope provides several benefits:


    ● Readability: You can easily determine the scope of a variable by looking at
    its declaration in the code.


    ● Maintainability: Code is more organized and easier to reason about when variables
    are scoped appropriately.


    ● Encapsulation: Lexical scope helps to encapsulate data, preventing accidental
    modification from other parts of the code.


    ● Closure Formation: Lexical scope plays a crucial role in the creation of closures,
    which we’ll explore in the next chapter.


    By understanding lexical scope, you’ll gain a deeper understanding of how JavaScript
    manages variables and how to write code that is more predictable, modular, and
    easier to maintain.


    ## Common Scope-Related Mistakes


    Even with a solid understanding of scope, it’s easy to fall into traps that lead
    to unexpected behavior or errors. Let’s explore some common mistakes and how to
    avoid them:


    ### 1\. Accidental Global Variables: The Undeclared Menace


    Forgetting to declare a variable using  var,  let, or  const doesn’t mean your
    code won’t run. Instead, JavaScript implicitly creates a global variable for you.
    This can lead to namespace pollution and unexpected interactions between different
    parts of your code.


    function myFunction() {


      undeclaredVar = 10; // Oops! Forgot ''let'' or ''const''


    }


    myFunction();


    console.log(undeclaredVar); // Output: 10 (global variable)


    How to Avoid: Always declare your variables explicitly using  let or  const (and
    avoid  var in modern JavaScript). This ensures they have the correct scope and
    prevents accidental globals.


    ### 2\. Shadowing: The Variable Imposter


    When you declare a variable with the same name in a nested scope as a variable
    in an outer scope, you’re essentially creating a “shadow” variable. The outer
    variable becomes hidden within the inner scope, leading to potential confusion.


    let message = "Hello from the outside!";


    function sayHello() {


      let message = "Hello from inside!";


      console.log(message); // Output: "Hello from inside!"


    }


    sayHello();


    console.log(message); // Output: "Hello from the outside!"


    How to Avoid: Be mindful of variable names, especially when dealing with nested
    functions or blocks. Consider using different names to avoid shadowing or explicitly
    referencing the outer variable using a different identifier.


    ### 3\. Modified Closures: The Changing Landscape


    Closures, a powerful feature we’ll explore in depth later, can also lead to unexpected
    behavior when combined with variable modification. A closure captures variables
    from its surrounding scope, but it captures them by reference, not by value.


    let counter = 0;


    function createCounter() {


      return function() {


        counter++;


        console.log(counter);


      };


    }


    const increment = createCounter();


    increment(); // Output: 1


    increment(); // Output: 2


    How to Avoid: Be aware that closures capture variables by reference. If you need
    to preserve a value, consider creating a copy of the variable inside the closure
    or using techniques like immediately invoked function expressions (IIFEs) to create
    new scopes.


    ### Best Practices: Keep Your Scope Clean


    ● Use Strict Mode: Enable strict mode using  "use strict"; at the beginning of
    your scripts. Strict mode helps catch accidental global variables and other common
    mistakes.


    ● Declare Variables Explicitly: Always use  let or  const (and avoid  var) to
    declare variables. This ensures they have the correct scope and prevents accidental
    globals.


    ● Mind Your Naming: Be mindful of variable names, especially in nested scopes,
    to avoid shadowing.


    ● Closures with Care: Understand how closures capture variables and be cautious
    when modifying variables from outer scopes within a closure.


    By following these best practices and understanding the common pitfalls, you can
    navigate the world of JavaScript scope with confidence, writing cleaner, more
    reliable, and more predictable code.


    ## Chapter Summary


    In this chapter, we’ve embarked on a journey to demystify the concept of scope
    in JavaScript. We explored how scope acts as a set of rules that govern the accessibility
    of variables within your code, acting like rooms in a house with varying levels
    of privacy.


    We started by defining global scope as the all-encompassing space where variables
    are accessible from anywhere in your code, while highlighting the potential drawbacks
    of overuse. We then delved into local (function) scope, a more private space where
    variables are confined to their respective functions. Building on that, we introduced
    block scope, a more fine-grained control mechanism enabled by  let and  const,
    further enhancing encapsulation.


    We also explored the concept of scope chain, the hierarchical structure that JavaScript
    uses to search for variables. Understanding how the scope chain works is crucial
    for predicting how your code will behave. Additionally, we discussed lexical scope,
    emphasizing that scope is determined at the time you write your code, not when
    it runs.


    Finally, we addressed common scope-related mistakes that even seasoned developers
    can encounter, such as accidental global variables, shadowing, and unexpected
    closure behavior. By following best practices like using strict mode, declaring
    variables explicitly, and being mindful of variable names, you can avoid these
    pitfalls and write cleaner, more reliable code.


    Mastering scope is a fundamental step toward becoming a proficient JavaScript
    developer. By understanding the rules that govern variable visibility and accessibility,
    you’ll be well-equipped to write code that is organized, maintainable, and free
    from unexpected surprises.


    # The Power of Closures: Functions That “Remember” Their Surroundings


    #### Outline


    ●     What is a Closure?


    ●     How Closures Work: Lexical Scoping and Inner Functions


    ●     The Closure’s Backpack: Remembering Variables


    ●     Practical Applications of Closures


    ●     Chapter Summary


    * * *


    ## What is a Closure?


    In the intricate world of JavaScript, closures are a fascinating phenomenon. At
    its core, a closure is simply a function’s ability to “remember” the variables
    and functions that existed in the environment where it was created, even after
    the outer function has completed its execution.


    Think of a closure as a function with a backpack. When it’s created, it packs
    all the variables and functions from its surrounding scope into its backpack.
    Even if the outer function goes away (finishes executing), the inner function
    still has access to everything it packed away.


    ### Not Just a Snapshot


    It’s important to note that this “memory” is not a snapshot of the values at the
    time the closure is formed. It’s a live connection. If the values of those outer
    variables change, the closure will see those changes when it accesses them later.


