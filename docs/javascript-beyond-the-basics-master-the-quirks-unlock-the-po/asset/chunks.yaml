    \ 值的新函数。\n\n### 3. 使用箭头函数处理回调\n\n箭头函数为回调提供了一种简化方式，因为它们会自动从周围作用域继承 `this` 值。\n\n\
    ### 4. 使用 `new` 调用构造函数：创建对象\n\n使用 `new` 关键字创建对象时，函数（构造函数）会自动将 `this` 设置为新创建的对象。\n\
    \n### 实践出真\n\n掌握 `this` 的最佳方法是进行动手实践。尝试不同的绑定场景，使用我们讨论过的技巧，并观察 `this` 在不同上下文中的行为。通过将这些概念付诸实践，你将获得在\
    \ JavaScript 代码中充分利用 `this` 所需的和专业知识。\n\n## 章节总结\n\n"
