    ## Common Object Methods


    JavaScript provides several built-in methods that make working with objects easier
    and more efficient. Let’s explore some of the most essential ones:


    ### Object.keys(obj): Get All the Keys


    This method returns an array containing the names (keys) of all the enumerable
    properties of the given object.


    const person = {


      name: "Alice",


      age: 30,


      city: "New York"


    };


    const keys = Object.keys(person);


    console.log(keys); // Output: ["name", "age", "city"]


    ### Object.values(obj): Get All the Values


    This method returns an array containing the values of all the enumerable properties
    of the given object.


    const values = Object.values(person);


    console.log(values); // Output: ["Alice", 30, "New York"]


    ### Object.entries(obj): Get Key-Value Pairs


    This method returns an array of arrays, where each inner array represents a key-value
    pair of the object.


    const entries = Object.entries(person);


    console.log(entries);


    // Output: [["name", "Alice"], ["age", 30], ["city", "New York"]]


    ### Object.assign(target, ...sources): Copy Properties


    This method is used to copy the values of all enumerable own properties from one
    or more source objects to a target object. It returns the target object.


    const target = { a: 1 };


    const source1 = { b: 2 };


    const source2 = { c: 3 };


    Object.assign(target, source1, source2);


    console.log(target); // Output: { a: 1, b: 2, c: 3 }


    ### Object.freeze(obj): Make Objects Immutable


    This method freezes an object, preventing new properties from being added to it,
    existing properties from being removed, and preventing the values of existing
    properties from being changed. In essence, it makes the object immutable.


    const person = {


      name: "Alice",


      age: 30


    };


    Object.freeze(person);


    person.age = 31; // This will have no effect


    delete person.name; // This will have no effect


    ### Why These Methods Are Essential


    ● Iteration: Object.keys(),  Object.values(), and  Object.entries() are essential
    for iterating over object properties.


    ● Data Manipulation: Object.assign() provides a convenient way to copy or merge
    objects.


    ● State Management: Object.freeze() can be used to enforce immutability in state
    management libraries (like Redux).


    By mastering these common object methods, you’ll be equipped with a powerful toolkit
    to handle objects effectively in your JavaScript applications.


