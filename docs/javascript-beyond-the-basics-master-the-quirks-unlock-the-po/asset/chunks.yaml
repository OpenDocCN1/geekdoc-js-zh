    }


    const myDog = new Dog("Buddy", "Golden Retriever");


    myDog.speak(); // Output: "Buddy barks!"


    In this classic example, we have an  Animal class with a generic  speak method.
    The  Dog class inherits from  Animal using  extends.  Dog overrides the  speak
    method to provide a specific behavior: barking. Notice how  super(name) calls
    the parent constructor to ensure  name is properly initialized.


    Example 2: Vehicles and Cars


    class Vehicle { // Parent Class


      constructor(brand, model) {


        this.brand = brand;


        this.model = model;


      }


      start() {


        console.log(`${this.brand} ${this.model} started!`);


      }


    }


    class Car extends Vehicle { // Child Class


      constructor(brand, model, year) {


        super(brand, model);


        this.year = year;


      }


      drive() {


        console.log(`Driving the ${this.year} ${this.brand} ${this.model}`);


      }


    }


    const myCar = new Car("Toyota", "Camry", 2023);


    myCar.start(); // Output: "Toyota Camry started!" (inherited from Vehicle)


    myCar.drive();  // Output: "Driving the 2023 Toyota Camry" (specific to Car)


    The  Car class inherits common properties (brand,  model) and the  start method
    from the  Vehicle class. It adds its own  year property and a  drive method, demonstrating
    how child classes can extend functionality.


    Example 3: Shapes and Rectangles


    class Shape {


      constructor(color) {


        this.color = color;


      }


      describe() {


        console.log(`This is a ${this.color} shape.`);


      }


    }


    class Rectangle extends Shape {


      constructor(color, width, height) {


        super(color);


        this.width = width;


        this.height = height;


      }


      calculateArea() {


        return this.width * this.height;


      }


    }


    const myRectangle = new Rectangle("blue", 5, 10);


    myRectangle.describe(); // Output: "This is a blue shape." (inherited)


    console.log(myRectangle.calculateArea()); // Output: 50 (specific to Rectangle)


    Here, the  Rectangle class inherits the  color property and the  describe method
    from  Shape, showcasing how inheritance creates a hierarchy of related objects.


    These examples demonstrate the essence of inheritance: the ability to create specialized
    classes that build upon existing ones, inheriting and extending properties and
    behaviors. This powerful feature promotes code reusability, modularity, and a
    logical structure for your JavaScript applications.


    ## Polymorphism: Many Forms, One Interface


    Polymorphism, a core principle of object-oriented programming (OOP), is the ability
    to treat objects of different classes interchangeably through a common interface.
    It’s like a chameleon adapting to its environment, changing its appearance to
    fit in seamlessly. In JavaScript, this translates to objects having different
    internal structures but sharing the same external behavior.


    ### The Power of Flexibility


    Polymorphism empowers you to write code that is more generic and adaptable. Instead
    of writing separate functions for each specific type of object, you can create
    a single function that works with a variety of objects, as long as they share
    a common interface (a set of methods or properties with the same names).


    ### Example: A Shape-Shifting Function


    function printArea(shape) {


      console.log(`The area of this shape is: ${shape.calculateArea()}`);


    }


    const circle = new Circle(5);


    const rectangle = new Rectangle(4, 6);


    printArea(circle);    // Output: The area of this shape is: 78.53981633974483


    printArea(rectangle); // Output: The area of this shape is: 24


    In this example, the  printArea function doesn’t care if it receives a  Circle
    or a  Rectangle. As long as the object has a  calculateArea method, the function
    can use it to get the area and print it. This demonstrates the power of polymorphism
    – you can write a single function that works with multiple object types, making
    your code more flexible and reusable.


    ### Polymorphism and Inheritance


    Polymorphism often goes hand in hand with inheritance. A child class can inherit
    a method from its parent class and provide its own unique implementation. This
    allows you to treat instances of the child class as if they were instances of
    the parent class, but with specialized behavior.


    const animal = new Animal("Generic Animal");


    const dog = new Dog("Buddy", "Golden Retriever");


    animal.makeSound(); // Output: "Generic animal sound!"


    dog.makeSound();    // Output: "Woof!"


    Here, both  animal and  dog have a  makeSound method, but they produce different
    results. This is polymorphism in action – the same method name, but different
    behavior depending on the object’s type.


    ### The Key to Generic Code


    Polymorphism allows you to write more generic code by focusing on the common interface
    rather than the specific implementation. This makes your code more adaptable and
    easier to extend. For example, you could add a  Triangle class with its own  calculateArea
    method, and the  printArea function would work seamlessly with it without any
    modifications.


    By embracing polymorphism, you’ll be able to write cleaner, more flexible, and
    more maintainable JavaScript code that can easily adapt to changing requirements
    and evolving object hierarchies.


    ### Examples of Polymorphism in JavaScript


    Let’s dive into examples that showcase polymorphism in action within JavaScript,
    emphasizing how different classes can implement the same method with their own
    unique behavior:


    Example 1: Shapes with  calculateArea()


    class Shape {


      constructor(name) {


        this.name = name;


      }


      calculateArea() {


        throw new Error("This method must be implemented by subclasses.");


      }


    }


    class Circle extends Shape {


      constructor(name, radius) {


        super(name);


        this.radius = radius;


      }


      calculateArea() {


        return Math.PI * this.radius ** 2;


      }


    }


    class Rectangle extends Shape {


      constructor(name, width, height) {


        super(name);


        this.width = width;


        this.height = height;


      }


      calculateArea() {


        return this.width * this.height;


      }


    }


    const circle = new Circle("Circle", 5);


    const rectangle = new Rectangle("Rectangle", 4, 6);


    console.log(circle.calculateArea());  // Output: 78.5398...


    console.log(rectangle.calculateArea()); // Output: 24


    In this example, the  Shape class acts as the base class with a generic  calculateArea
    method that throws an error if called directly. The  Circle and  Rectangle classes
    inherit from  Shape and provide their own implementations of  calculateArea to
    calculate the area specific to their shapes. This demonstrates polymorphism, as
    the same method name is used across different classes but behaves differently
    for each.


    Example 2: Animals and their Sounds


    class Animal {


      constructor(name) {


        this.name = name;


      }


      speak() {


        console.log("Generic animal sound!");


      }


