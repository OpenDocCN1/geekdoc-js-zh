  trans: "\n在 JavaScript 的上下文中，模块是一个自包含的代码单元，它封装了相关的功能。它有自己的私有数据和函数，这些内容对外部世界隐藏，并暴露出一个允许代码其他部分与之交互的公共\
    \ API。\n\n### 闭包的作用\n\n闭包在模块模式中起着至关重要的作用。它们允许你在模块内部定义私有变量和函数，这些内容只能在模块内部被访问和修改。另一方面，公共\
    \ API 以函数或对象的形式返回，它可以通过闭包访问并操作私有数据。\n\n### 示例：购物车模块\n\n让我们来看看如何使用模块模式创建一个可重用的购物车模块：\n\
    \n```javascript\nconst shoppingCartModule = (function() {\n  let items = [];\n\
    \n  function addItem(item) {\n    items.push(item);\n  }\n  function removeItem(item)\
    \ {\n    const index = items.indexOf(item);\n    if (index > -1) {\n      items.splice(index,\
    \ 1);\n    }\n  }\n  function getTotal() {\n    return items.reduce((total, item)\
    \ => total + item.price, 0);\n  }\n  return {\n    addItem: addItem,\n    removeItem:\
    \ removeItem,\n    getTotal: getTotal\n  };\n})();\n\nshoppingCartModule.addItem({\
    \ name: \"Laptop\", price: 999.99 });\nshoppingCartModule.addItem({ name: \"Smartphone\"\
    , price: 599.99 });\nconsole.log(shoppingCartModule.getTotal()); // Output: 1599.98\n\
    ```\n\n在此模块中：\n- `items` 是一个存储购物车物品的私有数组。\n- `addItem`、`removeItem` 和 `getTotal`\
    \ 是操作购物车的私有函数。\n- 返回的对象提供了公共 API，由对这些私有函数的引用组成。\n\n### 模块模式的优势\n\n- 封装：保护私有数据和函数免受外部干扰。\n\
    - 可重用性：模块可以在应用程序的多个部分甚至在不同的项目中使用。\n- 组织结构：代码被结构化为逻辑单元，提高了可维护性。\n- 全局命名空间保护：防止全局命名空间被意外污染。\n\
    \n### 现代替代方案：ES 模块\n\n虽然模块模式长期以来一直是 JavaScript 的主流手段，但 ES6 (ECMAScript 2015) 引入了标准的模块系统。ES\
    \ 模块提供了一种更简洁、结构化的定义和消费模块的方法，但它们依赖于支持它们的现代 JavaScript 环境。\n\n通过理解模块模式，你将更深入地理解\
    \ JavaScript 的模块化以及如何利用闭包创建封装的、可重用且可维护的代码。即使在引入 ES 模块之后，这种模式仍然有效，因为它可以在尚未完全支持新模块系统的环境中使用。\n\
    \n## 总结\n\n在本章中，我们探索了 JavaScript 中闭包强大的力量。我们学习了闭包如何允许函数在外部函数执行完成后，仍保留访问其周围作用域中变量的能力。这种由词法作用域实现的独特能力为广泛的实际应用开启了大门。\n\
    \n我们深入了闭包如何实现数据封装和隐私，允许你创建带有隐藏变量和函数的模块，这些内容只能通过受控的公共接口进行访问。我们还看到闭包对于在事件处理程序中保持状态至关重要，确保了即使变量随时间变化，回调函数也能访问正确的值。\n\
    \n此外，我们发现了闭包如何支持如部分应用和柯里等函数式编程技术，能够创建更具专业性且可重用的函数。最后，我们研究了经典的模块模式，这是一种强大的设计模式，它利用闭包创建封装的、可重用的模块。\n\
    \n通过掌握闭包，你为自己的 JavaScript 技能增加了一项宝贵的工具。你现在可以编写更具表现、模块化且可维护的代码，在异步操作中有效管理状态，并自信地构建更复杂的应用程序。\n\
    \n# 闭包的实践：模块、私有变量与事件处理\n\n### 大纲\n- 模块：使用闭包构建构建块\n- 私有变量：使用闭包保持秘密\n- 事件处理：闭包与持久状态\n\
    - 常见的闭包陷阱：内存泄漏与 `this`\n- 总结\n\n***\n\n### 模块：使用闭包构建构建块\n\n在软件开发领域，模块化是创建结构良好、可维护且可扩展应用程序的关键。JavaScript\
    \ 传统上是一种没有内置模块的语言，它通过闭包找到了一种巧妙的变通方法：模块模式。\n\n### 什么是模块？\n\n一个模块是一个封装了特定功能的自包含代码单元。将其想象为一个具有良好定义接口的黑盒。它隐藏了内部机制（私有成员），并只暴露外部世界交互所需的内容（公共\
    \ API）。\n\n### 闭包作为封装引擎\n\n闭包是让 JavaScript 模块成为可能的秘诀。通过利用闭包，你可以在模块内部创建私有变量和函数，将它们与外部访问隔离开。只有公共\
    \ API（通常由模块返回的函数或对象组成）可以与这些私有成员交互。\n\n### 模块模式：经典解决方案\n\n模块模式是 JavaScript 中创建模块的一种广泛使用的方法。它将模块代码封装在一个立即执行函数表达式（IIFE）中，创建一个封装了成员的闭包。\n\
    \n```javascript\nconst counterModule = (function() {\n  let count = 0; // 私有变量\n\
    \n  function increment() {\n    count++;\n  }\n  function decrement() {\n    count--;\n\
    \  }\n  function getValue() {\n    return count;\n  }\n  return {\n    increment:\
    \ increment,\n    decrement: decrement,\n    getValue: getValue\n  };\n})();\n\
    ```\n\n在此示例中：\n1. IIFE `(function() { ... })()` 创建了一个新的作用域，形成了一个闭包。\n2. 在闭包内部，`count`\
    \ 是一个私有变量，从外部无法访问。\n3. `increment`、`decrement` 和 `getValue` 是操作 `count` 的私有函数。\n\
    4. IIFE 返回一个包含 `increment`、`decrement` 和 `getValue` 函数的对象。这个对象就成了模块的公共 API。\n\n\
    现在，你可以通过它的公共 API 与计数模块交互：\n\n```javascript\ncounterModule.increment();\ncounterModule.increment();\n\
    console.log(counterModule.getValue()); // 输出: 2\n\ncounterModule.decrement();\n\
    console.log(counterModule.getValue()); // 输出: 1\n```\n\n你无法直接访问 `count`：\n\n```javascript\n\
    console.log(counterModule.count); // 输出: undefined\n```\n"
- fmt: "\nData hiding, also known as encapsulation, is a fundamental principle of\
    \ software engineering. It involves restricting access to certain parts of your\
    \ code, specifically data (variables) and the functions that operate on that data\
    \ (methods). The goal is to:\n\n- **Prevent Accidental Modification**: Protect\
    \ your data from being unintentionally changed by external code, leading to unpredictable\
    \ behavior and bugs.\n- **Maintain Code Integrity**: Ensure that data is accessed\
    \ and modified only through a well-defined interface, making your code more reliable\
    \ and easier to reason about.\n- **Promote Modularity**: Break down your code\
    \ into smaller, self-contained units (modules or objects) that are easier to understand,\
    \ test, and maintain.\n\n### Closures as Guardians of Privacy\n\nClosures play\
    \ a crucial role in achieving data hiding in JavaScript. When you define a function\
    \ inside another function, the inner function forms a closure. This closure encapsulates\
    \ the variables declared in its outer function’s scope, making them inaccessible\
    \ to the outside world.\n\n### The Module Pattern Revisited: A Classic Example\n\
    \nThe Module Pattern, discussed in the previous section, is a prime example of\
    \ using closures to create private variables. Let’s revisit our counter module:\n\
    \n```javascript\nconst counterModule = (function() {\n  let count = 0; // Private\
    \ variable\n  // ... (public API functions) ...\n})();\n```\n\nThe `count` variable\
    \ is private because it’s declared within the closure created by the IIFE. The\
    \ only way to access or modify `count` is through the module’s public API functions,\
    \ ensuring controlled and predictable interactions.\n\n### The Revealing Module\
    \ Pattern: A Variation\n\nThe Revealing Module Pattern is a slight variation of\
    \ the Module Pattern that offers a more explicit way to define the public API.\n\
    \n```javascript\nconst counterModule = (function() {\n  let count = 0;\n  function\
    \ increment() { count++; }\n  function decrement() { count--; }\n  function getValue()\
    \ { return count; }\n  return {\n    increment: increment,\n    getValue: getValue\n\
    \  }; // Only expose some functions\n})();\n\ncounterModule.increment();\nconsole.log(counterModule.getValue());\
    \ // Output: 1\n```\n\nHere, we explicitly list the functions we want to expose\
    \ in the returned object, making the public API more apparent.\n\n### Other Closure-Based\
    \ Patterns\n\nClosures can be used in various patterns to achieve data hiding:\n\
    \n- **Private Methods**: You can create private methods within objects using closures.\n\
    - **Factory Functions**: These functions can create multiple objects, each with\
    \ its own private data, using closures.\n- **Singleton Pattern**: Closures can\
    \ be used to implement the Singleton pattern, ensuring that only one instance\
    \ of a class or object exists.\n\n### Key Takeaways\n\nClosures are a powerful\
    \ tool for data hiding and encapsulation in JavaScript. By creating private variables,\
    \ you can protect your data from unintended modification, improve code maintainability,\
    \ and promote modularity. The Module Pattern and the Revealing Module Pattern\
    \ are two common ways to leverage closures for creating modules with private and\
    \ public interfaces.\n\n## Event Handling: Closures and Persistent State\n\nIn\
    \ the realm of interactive web applications, event handlers are your code’s way\
    \ of responding to user actions like clicks, hovers, or form submissions. But\
    \ handling events isn’t just about reacting in the moment; it’s also about remembering\
    \ the context in which those events occurred. This is where closures step in,\
    \ acting as time capsules to preserve the state of variables.\n\n### The Challenge:\
    \ Dynamically Changing Values\n\nImagine you’re creating a series of buttons dynamically\
    \ using JavaScript, each with a unique identifier. You want each button to display\
    \ its ID when clicked. However, a straightforward approach can lead to unexpected\
    \ results:\n\n```javascript\nfor (let i = 0; i < 3; i++) {\n  let btn = document.createElement('button');\n\
    \  btn.textContent = `Button ${i}`;\n  btn.addEventListener('click', function()\
    \ {\n    console.log(`You clicked Button ${i}`);\n  });\n  document.body.appendChild(btn);\n\
    }\n```\n\nIf you click any of the buttons, you might expect the console to log\
    \ something like “You clicked Button 0,” “You clicked Button 1,” etc. However,\
    \ it will always log “You clicked Button 3” for each button. This happens because\
    \ the `i` variable is shared across all event handlers and its value changes with\
    \ each iteration of the loop. By the time any button is clicked, `i` has already\
    \ reached its final value of 3.\n\n### Closures to the Rescue: Preserving the\
    \ Snapshot\n\nTo solve this issue, we need to capture the value of `i` at the\
    \ time each event listener is created. This is where closures come into play.\n\
    \n```javascript\nfor (let i = 0; i < 3; i++) {\n  let btn = document.createElement('button');\n\
    \  btn.textContent = `Button ${i}`;\n  btn.addEventListener('click', (function(index)\
    \ {\n    return function() {\n      console.log(`You clicked Button ${index}`);\n\
    \    };\n  })(i));\n  document.body.appendChild(btn);\n}\n```\n\nLet’s break down\
    \ how closures fix this:\n\n1. **IIFE for Closure**: We wrap the event handler\
    \ in an Immediately Invoked Function Expression (IIFE). This creates a new scope\
    \ for each button, preventing variable `i` from being shared.\n2. **Passing the\
    \ State**: We pass the current value of `i` (renamed `index` for clarity) as an\
    \ argument to the IIFE.\n3. **Returning the Handler**: The IIFE returns a new\
    \ function (the actual event handler) that has access to the `index` variable\
    \ due to closure.\n\n### Beyond Buttons: Remembering State\n\nThis pattern is\
    \ not limited to buttons. You can use closures in event handlers to capture any\
    \ relevant data at the time the event is attached. This allows your callbacks\
    \ to operate with the correct context, even if the original data has changed.\n\
    \nFor instance, closures are essential for:\n\n- **AJAX Requests**: Callbacks\
    \ for handling responses can use closures to access data related to the request.\n\
    - **Form Handling**: Submit event handlers can use closures to capture form field\
    \ values before the form is reset.\n- **Timers**: Closures can help you keep track\
    \ of time or state between intervals.\n\nClosures are a powerful tool in your\
    \ JavaScript arsenal. By understanding how they preserve state, you can create\
    \ more reliable and dynamic event handlers and unlock the full potential of asynchronous\
    \ programming in JavaScript.\n\n## Common Closure Pitfalls: Memory Leaks\n\nWhile\
    \ closures are incredibly useful, they can also lead to subtle problems if not\
    \ used with caution. Let’s explore two common pitfalls and how to avoid them:\n\
    \n### 1. Memory Leaks: The Clingy Closure\n\nClosures can inadvertently cause\
    \ memory leaks in JavaScript. This happens when a closure holds a reference to\
    \ an object that’s no longer needed, preventing the garbage collector from reclaiming\
    \ its memory.\n\n```javascript\nfunction outerFunction() {\n  let largeArray =\
    \ new Array(1000000); // Large object\n  return function() {\n    console.log(largeArray[0]);\
    \ // Closure references largeArray\n  };\n}\n\nconst myClosure = outerFunction();\n\
    // ... (largeArray is not used elsewhere but cannot be garbage collected)\n```\n\
    \nIn this example, the `myClosure` function holds a reference to `largeArray`.\
    \ Even if `largeArray` is not used anywhere else, it cannot be garbage collected\
    \ because the closure still needs it. This can lead to a significant memory leak\
    \ over time.\n\n#### Prevention:\n\n- **Nulling Out References**: When you’re\
    \ done with the outer function, explicitly set any references to large objects\
    \ within the closure to `null`.\n- **Avoiding Circular References**: Be cautious\
    \ of circular references, where an object references itself through a closure,\
    \ as this can also prevent garbage collection.\n"
  raw: 'Data hiding, also known as encapsulation, is a fundamental principle of software
    engineering. It involves restricting access to certain parts of your code, specifically
    data (variables) and the functions that operate on that data (methods). The goal
    is to:


    ● Prevent Accidental Modification: Protect your data from being unintentionally
    changed by external code, leading to unpredictable behavior and bugs.


    ● Maintain Code Integrity: Ensure that data is accessed and modified only through
    a well-defined interface, making your code more reliable and easier to reason
    about.


    ● Promote Modularity: Break down your code into smaller, self-contained units
    (modules or objects) that are easier to understand, test, and maintain.


    ### Closures as Guardians of Privacy


    Closures play a crucial role in achieving data hiding in JavaScript. When you
    define a function inside another function, the inner function forms a closure.
    This closure encapsulates the variables declared in its outer function’s scope,
    making them inaccessible to the outside world.


    ### The Module Pattern Revisited: A Classic Example


    The Module Pattern, discussed in the previous section, is a prime example of using
    closures to create private variables. Let’s revisit our counter module:


    const counterModule = (function() {


      let count = 0; // Private variable


      // ... (public API functions) ...


    })();


    The  count variable is private because it’s declared within the closure created
    by the IIFE. The only way to access or modify  count is through the module’s public
    API functions, ensuring controlled and predictable interactions.


    ### The Revealing Module Pattern: A Variation


    The Revealing Module Pattern is a slight variation of the Module Pattern that
    offers a more explicit way to define the public API.


    const counterModule = (function() {


      let count = 0;


      function increment() { count++; }


      function decrement() { count--; }


      function getValue() { return count; }


      return {


        increment: increment,


        getValue: getValue


      }; // Only expose some functions


    })();


    counterModule.increment();


    console.log(counterModule.getValue()); // Output: 1


    Here, we explicitly list the functions we want to expose in the returned object,
    making the public API more apparent.


    ### Other Closure-Based Patterns


    Closures can be used in various patterns to achieve data hiding:


    ● Private Methods: You can create private methods within objects using closures.


    ● Factory Functions: These functions can create multiple objects, each with its
    own private data, using closures.


    ● Singleton Pattern: Closures can be used to implement the Singleton pattern,
    ensuring that only one instance of a class or object exists.


    ### Key Takeaways


    Closures are a powerful tool for data hiding and encapsulation in JavaScript.
    By creating private variables, you can protect your data from unintended modification,
    improve code maintainability, and promote modularity. The Module Pattern and the
    Revealing Module Pattern are two common ways to leverage closures for creating
    modules with private and public interfaces.


    ## Event Handling: Closures and Persistent State


    In the realm of interactive web applications, event handlers are your code’s way
    of responding to user actions like clicks, hovers, or form submissions. But handling
    events isn’t just about reacting in the moment; it’s also about remembering the
    context in which those events occurred. This is where closures step in, acting
    as time capsules to preserve the state of variables.


    ### The Challenge: Dynamically Changing Values


    Imagine you’re creating a series of buttons dynamically using JavaScript, each
    with a unique identifier. You want each button to display its ID when clicked.
    However, a straightforward approach can lead to unexpected results:


    for (let i = 0; i < 3; i++) {


      let btn = document.createElement(''button'');


      btn.textContent = `Button ${i}`;


      btn.addEventListener(''click'', function() {


        console.log(`You clicked Button ${i}`);


      });


      document.body.appendChild(btn);


    }


    If you click any of the buttons, you might expect the console to log something
    like “You clicked Button 0,” “You clicked Button 1,” etc. However, it will always
    log “You clicked Button 3” for each button. This happens because the i variable
    is shared across all event handlers and its value changes with each iteration
    of the loop. By the time any button is clicked, i has already reached its final
    value of 3.


    ### Closures to the Rescue: Preserving the Snapshot


    To solve this issue, we need to capture the value of i at the time each event
    listener is created. This is where closures come into play.


    for (let i = 0; i < 3; i++) {


      let btn = document.createElement(''button'');


      btn.textContent = `Button ${i}`;


      btn.addEventListener(''click'', (function(index) {


        return function() {


          console.log(`You clicked Button ${index}`);


        };


      })(i));


      document.body.appendChild(btn);


    }


    Let’s break down how closures fix this:


    1.  IIFE for Closure: We wrap the event handler in an Immediately Invoked Function
    Expression (IIFE). This creates a new scope for each button, preventing variable
    i from being shared.


    2.  Passing the State: We pass the current value of i (renamed  index for clarity)
    as an argument to the IIFE.


    3.  Returning the Handler: The IIFE returns a new function (the actual event handler)
    that has access to the  index variable due to closure. This function is what’s
    ultimately attached as the event listener.


    Now, each event handler holds onto the value of  index that was passed to it when
    it was created. When you click a button, the correct  index value is logged.


    ### Beyond Buttons: Remembering State


    This pattern is not limited to buttons. You can use closures in event handlers
    to capture any relevant data at the time the event is attached. This allows your
    callbacks to operate with the correct context, even if the original data has changed
    later.


    For instance, closures are essential for:


    ● AJAX Requests: Callbacks for handling responses can use closures to access data
    related to the original request.


    ● Form Handling: Submit event handlers can use closures to capture form field
    values before the form is reset.


    ● Timers: Closures can help you keep track of time or state between timer intervals.


    Closures are a powerful tool in your JavaScript arsenal. By understanding how
    they preserve state, you can create more reliable and dynamic event handlers and
    unlock the full potential of asynchronous programming in JavaScript.


    ## Common Closure Pitfalls: Memory Leaks and  this


    While closures are incredibly useful, they can also lead to subtle problems if
    not used with caution. Let’s explore two common pitfalls and how to avoid them:


    ### 1\. Memory Leaks: The Clingy Closure


    Closures can inadvertently cause memory leaks in JavaScript. This happens when
    a closure holds a reference to an object that’s no longer needed, preventing the
    garbage collector from reclaiming its memory.


    function outerFunction() {


      let largeArray = new Array(1000000); // Large object


      return function() {


        console.log(largeArray[0]); // Closure references largeArray


      };


    }


    const myClosure = outerFunction();


    // ... (largeArray is not used elsewhere but cannot be garbage collected)


    In this example, the  myClosure function holds a reference to  largeArray. Even
    if  largeArray is not used anywhere else, it cannot be garbage collected because
    the closure still needs it. This can lead to a significant memory leak over time.


    #### Prevention:


    ● Nulling Out References: When you’re done with the outer function, explicitly
    set any references to large objects within the closure to  null.


    ● Avoiding Circular References: Be cautious of circular references, where an object
    references itself through a closure, as this can also prevent garbage collection.'
