  trans: "\n\n异步编程是一种范式，允许你的 JavaScript 代码执行需要耗时的任务（如网络请求、用户交互或定时器），而不会阻塞执行的主线程。简单来说，这意味着你的代码在等待这些耗时任务完成时，可以继续执行其他事情。\n\
    \n## 为什么异步性至关重要\n\nJavaScript 的核心是单线程的。这意味着它按行执行代码，一次只执行一条指令。然而，某些操作可能会花费大量时间：\n\
    \n- 网络请求：从服务器或 API 获取数据。\n- 用户交互：等待用户点击按钮、填写表单或执行某些其他操作。\n- 定时器：在设置的延迟后执行代码（例如，使用\
    \ `setTimeout`）。\n\n如果 JavaScript 在移动到下一行代码之前必须暂停并等待这些操作完成，你的应用程序将会冻结，用户体验也会受到影响。想象一下，点击一个按钮后整个网页都冻结了直到服务器响应！这就是异步编程大显身场的地方。\n\
    \n## 非阻塞范式\n\n异步代码允许你启动一个耗时操作，然后在等待该操作完成的同时继续执行其他代码。当操作完成时，JavaScript 会提供一种方式通知你，通常通过回调函数或\
    \ `Promise`。\n\n## 真实世界示例\n\n1. 从 API 获取数据：当你从服务器获取数据时，请求需要时间通过网络传输并返回响应。异步代码允许你发起请求，继续处理其他任务，然后在响应到达时处理它。\n\
    2. 处理按钮点击：当用户点击按钮时，你可能想要执行某些响应，例如验证表单或将数据发送到服务器。异步代码确保在你的代码忙于处理请求时，按钮点击不会冻结 UI。\n\
    3. 定时器：你可以使用 `setTimeout` 在指定的延迟后调度函数运行。这对于创建动画、视觉效果或简单地延迟某些代码块的执行而不阻塞脚本的其他部分至关重要。\n\
    \n## 回调、Promises 和 Async/Await 的角色\n\nJavaScript 提供了几种处理异步操作的机制：\n\n- 回调（Callbacks）：处理异步的传统方式，你传递一个函数（回调）以便在操作完成时执行它。\n\
    - Promises：一种表示异步操作最终结果的更现代、更有结构化的方式。\n- Async/Await：一种语法糖，让异步代码看起来更像同步代码，提高了可读性和可维护性。\n\
    \n在本章中，我们将深入探讨这些机制中的每一种，并学习如何有效使用它们来编写响应迅速、高效且避免了可怕的“回调地狱”的异步 JavaScript 代码。\n\
    \n## 回调：异步性的基础\n\n回调函数是异步 JavaScript 的无名英雄。它们是你作为参数传递给其他函数的函数，并期望接收的函数会在稍后异步操作完成时“回调”它们（执行它们）。从本质上说，回调为你的代码提供了一种方式，让它说：“嘿，当你完成那个任务时，请通过调用这个函数来告诉我。”\n\
    \n### 回调如何工作原理\n\n让我们通过一个使用 `setTimeout` 的简单示例来来说明回调机制：\n\n```javascript\nfunction\
    \ greet(name) {\n  console.log(`Hello, ${name}!`);\n}\n\nsetTimeout(greet, 2000,\
    \ 'Alice'); // 2 秒后调用 greet\n\nconsole.log(\"This message is executed first.\"\
    );\n```\n\n以下是详细说明：\n\n1. `greet`：这是我们的回调函数。它只是向控制台打印一条问候消息。\n2. `setTimeout`：这个内置函数接受三个参数：\n\
    \   - 回调函数（`greet`）\n   - 毫秒延迟（`2000`，意味着 2 秒）\n   - 传递给回调函数的参数（`'Alice'`）\n3.\
    \ 异步执行：`setTimeout` 调度 `greet` 函数在 2 秒后执行，但它不会阻塞主线程。代码继续执行，并立即打印“This message\
    \ is executed first.”\n4. 回调执行：2 秒后，定时器过期，`setTimeout` 函数“回调” `greet` 函数，并为其传递参数\
    \ `'Alice'`。这导致控制台打印出“Hello, Alice!”。\n\n### 回调：异步 JavaScript 的基础\n\n回调函数深植于 JavaScript\
    \ 的异步特性中。它们被广泛用于各种场景：\n\n- 事件处理：事件监听器（例如，`click`、`mouseover`）是在特定事件发生时触发的回调函数。\n\
    - AJAX 请求：像 `fetch` 或来自 `axios` 等库的函数使用回调来处理网络请求的结果。\n- Node.js：回调在 Node.js 中无处不在，用于处理异步文件操作、网络\
    \ I/O 其他任务。\n- 自定义 API 和库：许多 JavaScript 库和框架依赖回调来提供灵活性和自定义。\n\n### 回调挑战：回调地狱\n\
    \n虽然回调是必不可少的，但过度使用会导致代码难以阅读和维护。这被称为“回调地狱”——回调中的嵌套回调，创建了“死亡金字塔”。\n\n```javascript\n\
    asyncOperation1(function(result1) {\n  asyncOperation2(result1, function(result2)\
    \ {\n    asyncOperation3(result2, function(result3) {\n      // ... 依此类推\n   \
    \ });\n  });\n});\n```\n\n幸运的是，现代 JavaScript 提供了此类问题的解决方案，例如 Promises 和 async/await，我们将探索它们。\n\
    \n### 实践中的回调：`setTimeout`、`setInterval` 和 `fetch`\n\n让我们看看回调如何配合常用函数：\n\n1. `setTimeout`：在指定的延迟后执行一次函数。\n\
    ```javascript\nfunction sayHello(name) {\n  console.log(`Hello, ${name}! (after\
    \ 3 seconds)`);\n}\n\nsetTimeout(sayHello, 3000, 'Alice');\n// 输出（3 秒后）：\"Hello,\
    \ Alice! (after 3 seconds)\"\n```\n\n2. `setInterval`：固定的时间间隔重复调用函数。\n```javascript\n\
    function showTime() {\n  console.log(`Current time: ${new Date().toLocaleTimeString()}`);\n\
    }\n\nsetInterval(showTime, 1000); // 每秒调用一次 showTime\n```\n\n3. `fetch`（Web API）：从服务器检索数据。\n\
    ```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1')\n  .then(response\
    \ => response.json())\n  .then(data => console.log(data))\n  .catch(error => console.error('Error:',\
    \ error));\n```\n在这里，`.then()` 方法接收在 promise（代表 fetch 操作）解析或拒绝时的回调函数。\n\n### 回调地狱问题：死亡金字塔\n\
    \n虽然回调是必不可少的，但在处理相互依赖结果的多个异步操作时，它们可能会变得混乱。这导致深度嵌套的回调，使得代码难以阅读、理解和调试。\n\n```javascript\n\
    doSomething(function(result1) {\n  doSomethingElse(result1, function(result2)\
    \ {\n    doAnotherThing(result2, function(result3) {\n      // ... 更多嵌套的回调\n \
    \   });\n  });\n});\n```\n\n这种金字塔结构被称为“回调地狱”，使得代码流难以追踪，增加了错误风险并阻碍了维护性。\n\n###\
    \ 缓解回调地狱：引入 Promises 和 Async/Await\n\n为了对抗回调地狱，现代 JavaScript 引入了 Promises 和 async/await：\n\
    \n- Promises：提供了一种更有结构化的处理异步操作的方法，允许通过 `.then()` 和 `.catch()` 进行链式调用以实现更好的错误处理。\n\
    - Async/Await：建立 Promises 之上，提供了一种更简洁的语法，让异步代码看起来更像同步代码。\n\n"
- fmt: "\nIn the following sections, we’ll delve into these modern techniques, showing\
    \ you how to escape the perils of callback hell and write more elegant and manageable\
    \ asynchronous JavaScript code.\n\n# Promises: A Better Way to Handle Asynchronous\
    \ Operations\n\nPromises, introduced in ES6 (ECMAScript 2015), revolutionized\
    \ how we handle asynchronous operations in JavaScript. They offer a more structured\
    \ and intuitive approach compared to the traditional callback-based style, making\
    \ asynchronous code more readable, maintainable, and less error-prone.\n\n###\
    \ What is a Promise?\n\nA Promise is an object that represents the eventual result\
    \ of an asynchronous operation. It acts as a placeholder for a value that may\
    \ not be available immediately. Promises can be in one of three states:\n\n1.\
    \ Pending: The initial state, indicating that the asynchronous operation is still\
    \ in progress.\n2. Fulfilled (Resolved): The operation has completed successfully,\
    \ and the Promise now holds the resulting value.\n3. Rejected: The operation has\
    \ failed, and the Promise holds a reason (an error) for the failure.\n\n### Chaining\
    \ Promises with `.then()\n\nOne of the most powerful features of Promises is the\
    \ ability to chain them together using the `.then()` method. This allows you to\
    \ create a sequence of asynchronous operations that depend on each other.\n\n\
    ```\nfetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => console.log(data))\n  .catch(error => console.error('Error:',\
    \ error));\n```\n\nIn this example, the first `.then()` block handles the response\
    \ from the `fetch` request. It parses the JSON data and passes it to the next\
    \ `.then()` block, which logs the data to the console. If any error occurs during\
    \ the process, the `.catch()` block handles it.\n\n### Handling Success and Errors\n\
    \n* `.then(onFulfilled, onRejected)`: The `.then()` method takes two optional\
    \ callback functions:\n    * `onFulfilled`: Called when the Promise is fulfilled,\
    \ receiving the result value as an argument.\n    * `onRejected`: Called when\
    \ the Promise is rejected, receiving the error reason as an argument.\n* `.catch(onRejected)`:\
    \ A shorthand for `.then(null, onRejected)`, used to handle errors that occur\
    \ at any point in the Promise chain.\n\n```javascript\nmyPromise\n  .then(result\
    \ => {\n    // Handle success here\n    console.log(result);\n  })\n  .catch(error\
    \ => {\n    // Handle errors here\n    console.error(error);\n  });\n```\n\n###\
    \ Promises vs. Callbacks: A Clear Advantage\n\nPromises offer several advantages\
    \ over traditional callbacks:\n\n* **Improved Readability**: Promise chains are\
    \ more linear and easier to follow than nested callbacks.\n* **Better Error Handling**:\
    \ The `.catch()` method simplifies error handling and ensures that errors are\
    \ caught throughout the chain.\n* **Avoiding Callback Hell**: Promises help avoid\
    \ the deeply nested callback structures that can make code difficult to maintain.\n\
    * **Cleaner Code**: The Promise syntax is generally more concise and expressive\
    \ than callbacks.\n\nBy embracing Promises, you can write cleaner, more reliable,\
    \ and more enjoyable asynchronous JavaScript code. They are the foundation for\
    \ more advanced asynchronous patterns like async/await, which we’ll explore in\
    \ the next section.\n\n### Promises in Practice: Fetching Data and Beyond\n\n\
    Let’s solidify our understanding of Promises with practical examples using the\
    \ `fetch` API and other asynchronous functions.\n\n#### Example 1: Fetching Data\
    \ from an API\n\n```javascript\nfetch('https://api.example.com/data')\n  .then(response\
    \ => {\n    if (!response.ok) {\n      throw new Error(`HTTP error! status: ${response.status}`);\n\
    \    }\n    return response.json();\n  })\n  .then(data => {\n    // Process the\
    \ fetched data here\n    console.log(data);\n  })\n  .catch(error => {\n    console.error('Error\
    \ fetching data:', error);\n  });\n```\n\nIn this example:\n1. We use the `fetch`\
    \ function to request data from an API. This returns a Promise that resolves with\
    \ a `Response` object.\n2. The first `.then()` block checks if the response is\
    \ successful (status code 200-299). If not, it throws an error. Otherwise, it\
    \ parses the response as JSON and returns another Promise.\n3. The second `.then()`\
    \ block receives the parsed JSON data and logs it to the console.\n4. If any error\
    \ occurs during the fetch process, the `.catch()` block is executed, logging the\
    \ error message.\n\n#### Example 2: Custom Promise with `setTimeout`\n\n```javascript\n\
    function delay(ms) {\n  return new Promise(resolve => setTimeout(resolve, ms));\n\
    }\n\ndelay(2000)\n  .then(() => console.log('Delayed message after 2 seconds'))\n\
    \  .catch(error => console.error('Error:', error));\n```\n\nHere, we create a\
    \ custom `delay` function that returns a Promise. The Promise is resolved after\
    \ the specified delay (2000 milliseconds). We then use `.then()` to log a message\
    \ when the Promise is fulfilled.\n\n#### Example 3: Chaining Promises\n\n```javascript\n\
    function getUser(userId) {\n  return fetch(`https://api.example.com/users/${userId}`)\n\
    \    .then(response => response.json());\n}\n\nfunction getPosts(userId) {\n \
    \ return fetch(`https://api.example.com/posts?userId=${userId}`)\n    .then(response\
    \ => response.json());\n}\n\ngetUser(1)\n  .then(user => {\n    console.log('User:',\
    \ user);\n    return getPosts(user.id);\n  })\n  .then(posts => console.log('Posts:',\
    \ posts))\n  .catch(error => console.error('Error:', error));\n```\n\nThis example\
    \ demonstrates how you can chain Promises to perform dependent asynchronous operations.\
    \ First, we fetch user data, then we fetch posts for that user, handling errors\
    \ gracefully at each step.\n\n### Key Points\n\n* Promises provide a cleaner and\
    \ more structured way to handle asynchronous operations than callbacks.\n* You\
    \ can chain Promises using `.then()` to create sequences of dependent operations.\n\
    * The `.catch()` method simplifies error handling for both synchronous and asynchronous\
    \ errors in a Promise chain.\n\nPromises are a powerful tool in your JavaScript\
    \ arsenal. By mastering them, you can write better asynchronous code.\n\n# Async/Await:\
    \ Making Asynchronous Code Look Synchronous\n\nWhile Promises offer a significant\
    \ improvement over callbacks, they can still be a bit cumbersome to work with,\
    \ especially when dealing with multiple asynchronous operations. Async/await,\
    \ introduced in ES2017 (ES8), builds upon Promises and provides a cleaner more\
    \ intuitive syntax for writing asynchronous code.\n\n### What is Async/Await?\n\
    \n* `async`: A keyword used to declare a function as asynchronous. An async function\
    \ always returns a Promise, even if you don’t explicitly return one.\n* `await`:\
    \ A keyword used inside an `async` function to pause the execution until a Promise\
    \ resolves. The resolved value of the Promise is then returned.\n\n### The Magic\
    \ of Async/Await: Synchronous-Like Code\n\nWith async/await, you can write asynchronous\
    \ code that looks and feels almost like synchronous code. Let’s see an example:\n\
    \n```javascript\nasync function fetchData() {\n  try {\n    const response = await\
    \ fetch('https://api.example.com/data');\n    const data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('Error fetching\
    \ data:', error);\n  }\n}\n\nfetchData();\n```\n\nThis code looks remarkably similar\
    \ to synchronous code. You call `fetchData()`, and it seems like the code waits\
    \ for the `fetch` operation to complete before moving on to parse the JSON data.\
    \ However, under the hood, `await` pauses the execution of `fetchData()` until\
    \ the Promise returned by `fetch` resolves.\n\n### How It Works Under the Hood\n\
    \nThe `await` keyword essentially “unwraps” the Promise, giving you direct access\
    \ to the resolved value. It also elegantly handles errors using `try...catch`\
    \ blocks, making error management much more straightforward.\n\n### Benefits of\
    \ Async/Await\n\n* **Readability**: Async/await code is cleaner, more concise,\
    \ and easier to follow than Promise chains.\n* **Error Handling**: `try...catch`\
    \ blocks provide a familiar way to handle errors in asynchronous code.\n"
  raw: 'In the following sections, we’ll delve into these modern techniques, showing
    you how to escape the perils of callback hell and write more elegant and manageable
    asynchronous JavaScript code.


    Promises: A Better Way to Handle Asynchronous Operations


    Promises, introduced in ES6 (ECMAScript 2015), revolutionized how we handle asynchronous
    operations in JavaScript. They offer a more structured and intuitive approach
    compared to the traditional callback-based style, making asynchronous code more
    readable, maintainable, and less error-prone.


    ### What is a Promise?


    A Promise is an object that represents the eventual result of an asynchronous
    operation. It acts as a placeholder for a value that may not be available immediately.
    Promises can be in one of three states:


    1.  Pending: The initial state, indicating that the asynchronous operation is
    still in progress.


    2.  Fulfilled (Resolved): The operation has completed successfully, and the Promise
    now holds the resulting value.


    3.  Rejected: The operation has failed, and the Promise holds a reason (an error)
    for the failure.


    ### Chaining Promises with  .then()


    One of the most powerful features of Promises is the ability to chain them together
    using the  .then() method. This allows you to create a sequence of asynchronous
    operations that depend on each other.


    fetch(''https://api.example.com/data'')


      .then(response => response.json())


      .then(data => console.log(data))


      .catch(error => console.error(''Error:'', error));


    In this example, the first  .then() block handles the response from the  fetch
    request. It parses the JSON data and passes it to the next  .then() block, which
    logs the data to the console. If any error occurs during the process, the  .catch()
    block handles it.


    ### Handling Success and Errors


    ● .then(onFulfilled, onRejected): The  .then() method takes two optional callback
    functions:


    ○ onFulfilled: Called when the Promise is fulfilled, receiving the result value
    as an argument.


    ○ onRejected: Called when the Promise is rejected, receiving the error reason
    as an argument.


    ● .catch(onRejected): A shorthand for  .then(null, onRejected), used to handle
    errors that occur at any point in the Promise chain.


    myPromise


      .then(result => {


        // Handle success here


        console.log(result);


      })


      .catch(error => {


        // Handle errors here


        console.error(error);


      });


    ### Promises vs. Callbacks: A Clear Advantage


    Promises offer several advantages over traditional callbacks:


    ● Improved Readability: Promise chains are more linear and easier to follow than
    nested callbacks.


    ● Better Error Handling: The  .catch() method simplifies error handling and ensures
    that errors are caught throughout the chain.


    ● Avoiding Callback Hell: Promises help avoid the deeply nested callback structures
    that can make code difficult to maintain.


    ● Cleaner Code: The Promise syntax is generally more concise and expressive than
    callbacks.


    By embracing Promises, you can write cleaner, more reliable, and more enjoyable
    asynchronous JavaScript code. They are the foundation for more advanced asynchronous
    patterns like async/await, which we’ll explore in the next section.


    ### Promises in Practice: Fetching Data and Beyond


    Let’s solidify our understanding of Promises with practical examples using the  fetch
    API and other asynchronous functions.


    Example 1: Fetching Data from an API


    fetch(''https://api.example.com/data'')


      .then(response => {


        if (!response.ok) {


          throw new Error(`HTTP error! status: ${response.status}`);


        }


        return response.json();


      })


      .then(data => {


        // Process the fetched data here


        console.log(data);


      })


      .catch(error => {


        console.error(''Error fetching data:'', error);


      });


    In this example:


    1.  We use the  fetch function to request data from an API. This returns a Promise
    that resolves with a  Response object.


    2.  The first  .then() block checks if the response is successful (status code
    200-299). If not, it throws an error. Otherwise, it parses the response as JSON
    and returns another Promise.


    3.  The second  .then() block receives the parsed JSON data and logs it to the
    console.


    4.  If any error occurs during the fetch process, the  .catch() block is executed,
    logging the error message.


    Example 2: Custom Promise with  setTimeout


    function delay(ms) {


      return new Promise(resolve => setTimeout(resolve, ms));


    }


    delay(2000)


      .then(() => console.log(''Delayed message after 2 seconds''))


      .catch(error => console.error(''Error:'', error));


    Here, we create a custom  delay function that returns a Promise. The Promise is
    resolved after the specified delay (2000 milliseconds). We then use  .then() to
    log a message when the Promise is fulfilled.


    Example 3: Chaining Promises


    function getUser(userId) {


      return fetch(`https://api.example.com/users/${userId}`)


        .then(response => response.json());


    }


    function getPosts(userId) {


      return fetch(`https://api.example.com/posts?userId=${userId}`)


        .then(response => response.json());


    }


    getUser(1)


      .then(user => {


        console.log(''User:'', user);


        return getPosts(user.id);


      })


      .then(posts => console.log(''Posts:'', posts))


      .catch(error => console.error(''Error:'', error));


    This example demonstrates how you can chain Promises to perform dependent asynchronous
    operations. First, we fetch user data, then we fetch posts for that user, handling
    errors gracefully at each step.


    Key Points


    ● Promises provide a cleaner and more structured way to handle asynchronous operations
    than callbacks.


    ● You can chain Promises using  .then() to create sequences of dependent operations.


    ● The  .catch() method simplifies error handling for both synchronous and asynchronous
    errors in a Promise chain.


    Promises are a powerful tool in your JavaScript arsenal. By mastering them, you
    can write asynchronous code that is more readable, maintainable, and less prone
    to errors.


    ## Async/Await: Making Asynchronous Code Look Synchronous


    While Promises offer a significant improvement over callbacks, they can still
    be a bit cumbersome to work with, especially when dealing with multiple asynchronous
    operations. Async/await, introduced in ES2017 (ES8), builds upon Promises and
    provides a cleaner and more intuitive syntax for writing asynchronous code.


    ### What is Async/Await?


    ● async: A keyword used to declare a function as asynchronous. An async function
    always returns a Promise, even if you don’t explicitly return one.


    ● await: A keyword used inside an  async function to pause the execution of the
    function until a Promise resolves. The resolved value of the Promise is then returned.


    ### The Magic of Async/Await: Synchronous-Like Code


    With async/await, you can write asynchronous code that looks and feels almost
    like synchronous code. Let’s see an example:


    async function fetchData() {


      try {


        const response = await fetch(''https://api.example.com/data'');


        const data = await response.json();


        console.log(data);


      } catch (error) {


        console.error(''Error fetching data:'', error);


      }


    }


    fetchData();


    This code looks remarkably similar to synchronous code. You call  fetchData(),
    and it seems like the code waits for the  fetch operation to complete before moving
    on to parse the JSON data. However, under the hood,  await pauses the execution
    of  fetchData() until the Promise returned by  fetch resolves.


    ### How It Works Under the Hood


    The  await keyword essentially “unwraps” the Promise, giving you direct access
    to the resolved value. It also elegantly handles errors using  try...catch blocks,
    making error management much more straightforward.


    ### Benefits of Async/Await


    ● Readability: Async/await code is cleaner, more concise, and easier to follow
    than Promise chains.


    ● Error Handling: try...catch blocks provide a familiar way to handle errors in
    asynchronous code.'
