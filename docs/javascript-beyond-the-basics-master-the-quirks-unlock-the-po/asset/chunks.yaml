    \ // 输出: \"MyObject\"\n    ```\n    通过创建闭包，你可以将 `this` 的值捕存在变量（`self`）中并在回调中使用。\n\
    \n### 2. 嵌套函数与 `this`\n\n当函数嵌套在另一个函数内部时，内部函数有它自己的 `this` 上下文。这可能会在期望内部函数从外部作用域继承\
