    Clear and consistent indentation is crucial for making your conditional statements
    easy to read and understand. Nested  if...else structures can become complex,
    so proper indentation helps visualize the logic.


    // Good indentation


    if (condition1) {


      // Code to execute if condition1 is true


    } else if (condition2) {


      // Code to execute if condition1 is false and condition2 is true


    } else {


      // Code to execute if both condition1 and condition2 are false


    }


    In summary, conditional statements empower your JavaScript code with the ability
    to make decisions based on various conditions. By mastering  if,  else if, and  else,
    you’ll be able to create more dynamic, interactive, and intelligent applications.


    ## Loops: Repeating Actions Efficiently


    Loops are powerful constructs in programming that allow you to automate repetitive
    tasks. Instead of writing the same code multiple times, you can use a loop to
    execute a block of code repeatedly as long as a certain condition is met. This
    saves you time and effort, and it makes your code cleaner and more maintainable.


    ### for Loops: The Workhorses of Iteration


    The  for loop is the most common and versatile loop in JavaScript. It consists
    of three parts:


    1.  Initialization: A variable is initialized to a starting value (e.g.,  let
    i = 0).


    2.  Condition: A boolean expression is checked before each iteration. The loop
    continues as long as this condition is true.


    3.  Update Expression: This expression modifies the initialized variable after
    each iteration (e.g.,  i++).


    for (let i = 0; i < 5; i++) {


      console.log(i); // Output: 0 1 2 3 4


    }


    In this example, the loop iterates five times, printing the numbers 0 through
    4 to the console.


    You can use  for loops to iterate over arrays and strings:


    const numbers = [1, 2, 3, 4, 5];


    for (let i = 0; i < numbers.length; i++) {


      console.log(numbers[i]);


    }


    const message = "Hello";


    for (let i = 0; i < message.length; i++) {


      console.log(message[i]);


    }


    ### while Loops: Iterate Until a Condition Fails


    The  while loop is simpler than a  for loop. It executes a block of code repeatedly
    as long as its condition is true.


    let count = 0;


    while (count < 5) {


      console.log(count);


      count++;


    }


    This loop does the same thing as the  for loop example above.


    while loops are often used when the number of iterations is not known in advance,
    like when waiting for user input or processing data from a stream.


    ### do...while Loops: At Least Once, Guaranteed


    The  do...while loop is similar to a  while loop, but it guarantees that the loop
    body executes at least once, even if the condition is initially false.


    let input;


    do {


      input = prompt("Enter a number greater than 0:");


    } while (input <= 0);


    This loop will repeatedly prompt the user for input until they enter a number
    greater than 0.


    ### for...in Loops: Iterate Over Object Properties


    The  for...in loop iterates over the enumerable properties of an object. Note
    that it iterates over property names (keys), not values.


    const person = { name: "Alice", age: 30, city: "New York" };


    for (let key in person) {


      console.log(key + ": " + person[key]);


    }


    This loop will print:


    name: Alice


    age: 30


    city: New York


    ### for...of Loops: Iterate Over Iterable Objects


    The  for...of loop is used to iterate over iterable objects like arrays, strings,
    Maps, Sets, and more. It provides a clean syntax for accessing the values directly.


    const numbers = [1, 2, 3];


    for (let num of numbers) {


      console.log(num);


    }


    ### Best Practices for Looping


    ● Clear Termination Condition: Ensure your loops have a well-defined condition
    that will eventually become false to avoid infinite loops.


    ● Keep Loop Bodies Concise: Avoid putting too much logic within the loop body
    for readability.


    ● Choose the Right Loop: Use the appropriate loop type for the task at hand.  for
    loops are generally best for known iteration counts, while  while and  do...while
    loops are better for conditions that may change during iteration.


    Loops are an essential tool in your JavaScript arsenal. By understanding the different
    types of loops and applying best practices, you can write more efficient, maintainable,
    and expressive code.


    ## Functions: Organizing and Reusing Code


    Functions are the backbone of well-structured JavaScript code. They encapsulate
    blocks of code designed to perform specific tasks, making your programs more organized,
    efficient, and easier to maintain. Think of functions as self-contained mini-programs
    that you can call upon whenever you need their specific functionality.


    ### Defining Functions: Two Flavors


    There are two primary ways to define functions in JavaScript:


    1.  Function Declarations: The traditional way, using the  function keyword followed
    by the function name, parameters in parentheses, and the code block within curly
    braces.


    function greet(name) {


      console.log("Hello, " + name + "!");


    }


    2.  Function Expressions (including Arrow Functions): Assigning a function to
    a variable. Arrow functions, introduced in ES6, provide a more concise syntax.


    const greet = function(name) {


      console.log("Hello, " + name + "!");


    };


    // Arrow function syntax (ES6+)


    const greet = (name) => {


      console.log("Hello, " + name + "!");


    };


    ### Function Parameters and Arguments: Passing Data In


    Functions can accept input values called parameters. When you call a function,
    you provide the actual values known as arguments.


    function add(a, b) {


      return a + b;


    }


    let sum = add(5, 3); // 5 and 3 are arguments


    console.log(sum);    // Output: 8


    ### Return Values: Getting Data Out


    Functions can return a value using the  return statement. This allows you to use
    the result of a function’s computation elsewhere in your code.


    function square(x) {


      return x * x;


    }


    let result = square(4);


    console.log(result); // Output: 16


