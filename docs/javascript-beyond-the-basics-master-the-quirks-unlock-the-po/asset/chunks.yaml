    }


    In this case, the  Car class has a  startEngine method that logs a message to
    the console when called.


    ### Class Properties (ES6+): A Modern Touch


    While not strictly related to OOP principles, ES6 introduced a feature called
    class properties, allowing you to declare properties directly within the class
    definition.


    class Car {


      numberOfWheels = 4; // Class property


      constructor(brand, model, year) {


        // ...


      }


    }


    ### Static Methods: Belonging to the Class


    Static methods are methods that belong to the class itself, not to instances of
    the class. They are typically used for utility functions or operations that don’t
    depend on the state of a specific object.


    class MathUtils {


      static add(x, y) {


        return x + y;


      }


    }


    console.log(MathUtils.add(5, 3)); // Output: 8


    In this example,  MathUtils.add() is a static method that can be called directly
    on the  MathUtils class.


    By understanding the syntax and features of classes, you can leverage the power
    of OOP in JavaScript to create well-structured, maintainable, and reusable code.


    ### Code Examples of Defining Classes with Constructors, Methods, and Class Properties


    Let’s illustrate how to define classes in JavaScript with constructors, methods,
    and class properties, along with code examples:


    Basic Class with Constructor:


    class Person {


      constructor(name, age) {


        this.name = name;


        this.age = age;


      }


    }


    const alice = new Person("Alice", 30);


    console.log(alice.name); // Output: "Alice"


    console.log(alice.age);  // Output: 30


    In this basic example, the  Person class has a  constructor that initializes the  name
    and  age properties. We create an instance (alice) using the  new keyword.


    Class with Methods:


    class Rectangle {


      constructor(width, height) {


        this.width = width;


        this.height = height;


      }


      calculateArea() {


        return this.width * this.height;


      }


    }


    const myRectangle = new Rectangle(5, 10);


    console.log(myRectangle.calculateArea()); // Output: 50


    Here, the  Rectangle class has a  calculateArea method that performs a calculation
    based on the object’s properties.


    Class with Properties (ES6+):


    class Circle {


      PI = 3.14159; // Class property


      constructor(radius) {


        this.radius = radius;


      }


      calculateArea() {


        return this.PI * this.radius * this.radius;


      }


    }


    const myCircle = new Circle(5);


    console.log(myCircle.calculateArea()); // Output: 78.53975


    The  Circle class has a  PI property directly defined within the class body (this
    syntax is supported in ES6 and later).


    Class with Static Method:


    class StringUtils {


      static reverseString(str) {


        return str.split('''').reverse().join('''');


      }


    }


    console.log(StringUtils.reverseString("hello")); // Output: "olleh"


    The  StringUtils class has a static method  reverseString that can be called directly
    on the class, without needing to create an object instance.


    Putting It All Together:


    class Book {


      genre = "Fiction"; // Class property


      constructor(title, author, pages) {


        this.title = title;


        this.author = author;


        this.pages = pages;


      }


      getDescription() {


        return `${this.title} by ${this.author} (${this.pages} pages)`;


      }


      static compareByPages(book1, book2) {


        return book1.pages - book2.pages;


      }


    }


    In this comprehensive example, the  Book class has a constructor, methods, a class
    property, and a static method, showcasing various aspects of class definitions
    in JavaScript.


    ## Inheritance: Extending Functionality


    Inheritance is a cornerstone of object-oriented programming (OOP) that allows
    you to create new classes (child classes or derived classes) based on existing
    classes (parent classes or base classes). This concept promotes code reusability
    and establishes hierarchical relationships between classes, making your code more
    organized and maintainable.


    ### The  extends Keyword: Establishing the Relationship


    The  extends keyword is the key to creating inheritance relationships in JavaScript
    classes. It links a child class to its parent class, enabling the child to inherit
    the parent’s properties and methods.


    class Animal { // Parent Class


      constructor(name) {


        this.name = name;


      }


      makeSound() {


        console.log("Generic animal sound!");


      }


    }


    class Dog extends Animal { // Child Class (inherits from Animal)


      constructor(name, breed) {


        super(name); // Call the parent''s constructor


        this.breed = breed;


      }


      makeSound() {


        console.log("Woof!"); // Overriding the parent''s makeSound method


      }


    }


    const myDog = new Dog("Buddy", "Golden Retriever");


    myDog.makeSound(); // Output: "Woof!" (calls the overridden method)


    In this example, the  Dog class inherits from the  Animal class using the  extends
    keyword. This means that  Dog automatically has access to the properties and methods
    defined in  Animal.


    ### The  super Keyword: Connecting to the Parent


    The  super keyword plays a crucial role in inheritance. It has two main purposes:


    1.  Calling Parent Constructor: Inside a child class constructor, you must call  super()
    before using  this. This ensures that the parent class constructor is executed,
    initializing the inherited properties.


    2.  Accessing Parent Methods: Within a child class method, you can use  super.method_name()
    to access and call methods defined on the parent class.


    ### Method Overriding: Customization for the Child


    Inheritance doesn’t mean blind replication. A child class can override methods
    inherited from its parent class. This allows you to customize the behavior of
    the child object while still retaining the overall structure and functionality
    of the parent class.


    In our example, the  Dog class overrides the  makeSound method to produce a more
    specific sound (“Woof!”) instead of the generic animal sound.


    ### Why Inheritance Matters'
