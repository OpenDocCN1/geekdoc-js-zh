    \ `ECMAScript` (`ES`) 标准，这是一组由 `TC39` 委员会维护的规范集。\n\n## ESNext 前沿\n\nESNext 是指代尚未并入官方标准的未来\
    \ JavaScript 特性的术语。这些特性处于不同的开发阶段，从早期的提案到接近定型应有。通过关注 `ESNext`，你可以洞察 JavaScript\
    \ 的未来，并在这些特性被广泛采用之前开始尝试前沿功能。\n\n### 保持跟进的意义\n\n你为什么要关注 `ESNext`？这里是一些引人信服的理由：\n\
