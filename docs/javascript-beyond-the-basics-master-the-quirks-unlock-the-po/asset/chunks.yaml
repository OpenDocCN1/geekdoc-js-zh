  trans: "\n路由是根据当前 URL 决定显示哪个视图或组件的机制。它就像地图一样引导用户浏览你的应用程序。\n\n你框架的路由系统可能使用正则表达式或模式匹配将\
    \ URL 映射到特定的视图或组件。当 URL 变化时，路由器会更新视图层以显示适当的内容。\n\n### 简化示例\n\n让我们考虑一个用你的框架构建的简单博客应用：\n\
    \n```javascript\n// 数据层 (简化)\nconst posts = [\n  { id: 1, title: \"Post 1\", content:\
    \ \"...\" },\n  { id: 2, title: \"Post 2\", content: \"...\" }\n];\n\n// 视图层 (简化)\n\
    function renderPost(post) {\n  // ... (渲染帖子标题和内容的代码) ...\n}\n\n// 控制器/逻辑层 (简化)\n\
    function showPost(postId) {\n  const post = posts.find(post => post.id === postId);\n\
    \  renderPost(post);\n}\n\n// 路由 (简化)\nconst routes = {\n  \"/posts/:id\": showPost\
    \ // 单个文章的路由\n};\n\n// ... (匹配当前 URL 到路由并调用相应函数的代码) …\n```\n\n### 框架构建的迭代过程\n\n\
    构建一个 JavaScript 框架不是一次性的任务；它是一个不断完善和改进的过程。你将从一个基础结构开始，实现核心功能，然后迭代地添加更多功能、优化性能，并在各种场景下测试你的框架。\n\
    \n本章通过引入框架设计的底层组件和原则，奠定了基础。在接下来的章节中，我们将深入探讨这些每个组件，提供更详细的指导和示例，帮助你构建自己的自定义 JavaScript\
    \ 框架。\n\n## 章节总结\n\n在本章中，我们为构建自己的 JavaScript 框架奠定了基础。我们探索了框架作为预构建结构和工具集的概念，它可以简化\
    \ Web 应用的应用。我们讨论了构建自定义框架的动机，包括深入理解框架的工作原理、个人学习以及创建定制化解决方案的能力。\n\n我们深入研究了指导框架设计的核心原则，强调了模块化、关注点分离、扩展性、可测试性和性能。这些原则是创建健壮、可维护且可扩展框架的指明灯。\n\
    \n最后，我们概述了 JavaScript 框架的基本结构，引入了关键组件：数据层、视图层、控制器/逻辑层和路由。我们提供了一个简化示例来说明这些组件在基础应用中是如何交互的。\n\
    \n本章为你的框架开发之旅铺平了道路。在接下来的章节中，我们将深入探讨这些每个组件，提供更详细的指导和示例。记住，构建框架是一个迭代的过程。从基础开始，不断实验并在学习成过程中不断完善你的代码。\n\
    \n# 构建框架（第 2 部分）：路由、组件与模板\n\n### 提纲\n\n- 路由：导航你的应用程序\n- 组件：UI 的构建块\n- 模板：动态内容生成\n\
    - 字符串模板：简单但局限\n- 模板字字符串：JavaScript 的内置模板\n- 模板库：高级功能\n- 章节总结\n\n***\n\n## 路由：导航你的应用程序\n\
    \n在 Web 应用的世界中，路由是引导用户到达预期目的地的 GPS。它是根据当前 URL 决定显示应用程序哪个部分的机制。就像路线图帮助你穿过城市一样，路由通过将特定\
    \ URL 与相应的视图或组件关联，帮助用户探索你的 Web 应用。\n\n### 路由如何工作\n\n路由涉及几个几个关键元素：\n\n1. `URLs`：用户在浏览器中输入的、用于访问应用程序不同部分的地址。\n\
    2. `Routes`：将特定 URL 映射到相应视图或组件的定义。\n3. `Router`：负责匹配当前 URL 到定义路由并渲染相关内容的组件或模块。\n\
    \n当用户点击链接或在浏览器中输入 URL 时，路由器会拦截请求，检查 URL 并决定显示哪个视图或组件。这个过程允许用户在应用程序的不同部分之间无缝导航。\n\
    \n### 路由类型\n\n有两种主要的路由类型：\n\n1. `哈希路由 (Hash-Based Routing)`：这种旧方法使用 URL 中的哈希片段\
    \ (`#`) 来管理路由。例如，`website.com/#about` 可能会显示关于页面。\n2. `History API 路由 (History\
    \ API Routing)`：这种较新的方法利用 HTML5 History API，提供更整洁的 URL，如 `website.com/about`。\n\
    \n### 构建简单的路由器\n\n你可以使用条件语句和事件监听器在你的框架中创建一个基础路由器：\n\n```javascript\nconst routes\
    \ = {\n  \"/\": homeComponent,\n  \"/about\": aboutComponent,\n  \"/contact\"\
    : contactComponent\n};\n\nfunction navigate(path) {\n  if (routes[path]) {\n \
    \   const component = routes[path];\n    // ... (渲染组件的代码) ...\n  } else {\n  \
    \  // ... (处理 404 Not Found) ...\n  }\n}\n\nwindow.addEventListener(\"popstate\"\
    , () => {\n  navigate(window.location.pathname);\n});\n```\n\n在这个示例中：\n1. `routes`\
    \ 是一个将 URL 映射到组件的对象。\n2. `navigate` 是一个根据 `path` 渲染适当组件的函数。\n3. 为 `popstate` 事件添加了事件监听器，当用户使用浏览后退或前进按钮时会触发。这将调用\
    \ `navigate` 来更新视图。\n\n### 演进你的路由器\n\n这是一个非常简单的示例。随着你的框架的增长，你可能需要为路由器添加更多功能，例如：\n\
    \n- 路由参数：捕获 URL 中的动态值（例如 `/users/123`）。\n- 嵌套路由：支持层级导航结构。\n- 守卫 (Guards)：根据用户身份或权限控制对某些路由的访问。\n\
    - 过渡与动画：在视图之间创建平滑的视觉过渡。\n\n然而，即使只有这些基础构建块，你也可以开始在你的自定义框架中创建一个功能性的路由系统。\n\n## 组件：UI\
    \ 的构建块\n\n组件是现代 Web 应用的基础构建块。它们封装了界面特定部分的结构、逻辑和样式，使其易于复用且更容易维护。通过促进模块化，组件允许开发者将复杂的\
    \ UI 拆分为可管理的、自包含的单元。这种方法允许独立开发、测试和调试单个组件，从而增强了开发过程。\n\n在 React 等 JavaScript 框架中，组件可以大致分为两类：\n\
    \n1. `函数组件 (Functional Components)`：这些组件更简单，主要关注渲染 UI。它们以 JavaScript 函数的形式编写，并接受\
    \ `props`（属性）来自定义输出。随着 Hooks 的引入，函数组件还可以管理状态和副作用，使其变得更加强大。\n2. `类组件 (Class Components)`：这些组件是继承自\
    \ `React.Component` 的 ES6 类。它们可以持有并管理自己的状态以及生命周期方法，为组件的行为和渲染提供更多控制。\n"
- fmt: "\nFunctional components are typically used when the component’s primary responsibility\
    \ is to render some UI based on the props it receives. Here’s an example of a\
    \ simple functional component:\n\n```javascript\nimport React from 'react';\n\n\
    function Greeting(props) {\n  return <h1>Hello, {props.name}!</h1>;\n}\n\nexport\
    \ default Greeting;\n```\n\nIn this example, the `Greeting` component takes a\
    \ `name` prop and renders a greeting message. It’s a stateless component since\
    \ it doesn’t manage any internal state.\n\n### Class Components\n\nClass components\
    \ are used when more functionality is needed, such as managing internal state\
    \ or utilizing lifecycle methods. Here’s an example of a class component:\n\n\
    ```javascript\nimport React, { Component } from 'react';\n\nclass Counter extends\
    \ Component {\n  constructor(props) {\n    super(props);\n    this.state = { count:\
    \ 0 };\n  }\n  increment = () => {\n    this.setState({ count: this.state.count\
    \ + 1 });\n  }\n  render() {\n    return (\n      <div>\n        <p>Count: {this.state.count}</p>\n\
    \        <button onClick={this.increment}>Increment</button>\n      </div>\n \
    \   );\n  }\n}\n\nexport default Counter;\n```\n\nIn this example, the `Counter`\
    \ component manages its own state (`count`) and provides a method (`increment`)\
    \ to update that state. The component re-renders whenever the state changes, reflecting\
    \ the updated count.\n\n### Promoting Modularity and Reusability\n\nBy using components,\
    \ developers can achieve a high degree of modularity and reusability in their\
    \ code. Components can be composed together to build more complex UIs. They can\
    \ also be shared across different parts of an application or even across different\
    \ projects, making development faster and more efficient.\n\nIn summary, components\
    \ are the building blocks of modern web UIs, providing a structured way to build,\
    \ maintain, and reuse UI elements. Whether using functional components for simplicity\
    \ or class components for more control, understanding how to create and manage\
    \ components is essential for any web developer.\n\n## Templating: Dynamic Content\
    \ Generation\n\nTemplating is a powerful technique in web development that allows\
    \ you to generate dynamic HTML content based on data. Instead of manually constructing\
    \ HTML strings with variables and concatenation, templates provide a structured\
    \ and more maintainable way to define the layout and structure of your UI elements.\n\
    \n### Why Use Templates?\n\n- **Separation of Concerns**: Templates help separate\
    \ presentation logic (how data is displayed) from application logic (how data\
    \ is fetched and manipulated). This makes your code cleaner, easier to understand,\
    \ and more testable.\n- **Reusability**: Templates can be reused to render different\
    \ sets of data, reducing code duplication.\n- **Maintainability**: Changes to\
    \ the UI structure or styling can be made in one place (the template), rather\
    \ than scattered throughout your code.\n- **Dynamic Content**: Templates allow\
    \ you to easily inject dynamic data into your HTML, creating interactive and personalized\
    \ experiences.\n\n### Templating Approaches: From Simple to Sophisticated\n\n\
    JavaScript offers various templating approaches, each with its own trade-offs:\n\
    \n#### 1. String-Based Templates\n\nString-based templates involve combining strings\
    \ directly. While simple to use, they can become unwieldy for complex templates.\n\
    \n```javascript\nconst name = \"Alice\";\nconst greeting = \"Hello, \" + name\
    \ + \"!\";\n```\n\n#### 2. Template Literals (ES6+)\n\nTemplate literals introduced\
    \ in ES6, offer a more elegant way to embed variables within strings using backticks\
    \ (`` ` ``).\n\n```javascript\nconst product = { name: \"Laptop\", price: 99.99\
    \ };\nconst template = `\n<div class=\"product\">\n  <h2>${product.name}</h2>\n\
    \  <p>Price: $${product.price}</p>\n</div>`;\n```\n\nIn this example, the `${product.name}`\
    \ and `${product.price}` expressions are evaluated and inserted into the string,\
    \ resulting in a dynamic HTML.\n\n#### 3. Templating Libraries\n\nFor more complex\
    \ applications, dedicated libraries like Handlebars or Mustache provide additional\
    \ features:\n\n- **Loops**: iterate over arrays.\n- **Conditionals**: conditionally\
    \ render content.\n- **Helpers**: custom functions for formatting.\n\nUsing Handlebars:\n\
    \n```javascript\nconst template = Handlebars.compile(\"<h1>{{title}}</h1><p>{{content}}</p>\"\
    );\nconst data = { title: \"My Blog\", content: \"This is blog post.\" };\nconst\
    \ html = template(data);\n```\n\n### Rendering Templates: Bringing Them to Life\n\
    \nTo render a template, you typically combine it with data and insert the resulting\
    \ HTML into the DOM. This process can be done manually or with the help of frameworks.\n\
    \n### Key Takeaways\n\nTemplating is a powerful tool that enables dynamic content\
    \ generation and improves the maintainability of your code. By choosing the right\
    \ approach (string-based, template literals, or libraries) and carefully managing\
    \ your data, you can create engaging user interfaces.\n\n## String-Based Templates:\
    \ Simple but Limited\n\nString-based templates represent the simplest form of\
    \ templating. They involve combining strings with variables.\n\n### Concatenation:\
    \ The Old-School Way\n\nIn the earlier days of JavaScript, developers used concatenation:\n\
    \n```javascript\nconst name = \"Alice\";\nconst greeting = \"<h1>Hello, \" + name\
    \ + \"</h1>\";\n```\n\nHere, the `+` operator is used to concatenate string literals\
    \ (`<h1>Hello, \"`, `\"</h1>\"`) with the variable `name`. While this approach\
    \ works, it can become messy and difficult to read.\n\n### String Interpolation:\
    \ A Modern Twist\n\nModern JavaScript (ES6+) introduced template literals, which\
    \ offer a more convenient way to inject variables:\n\n```javascript\nconst product\
    \ = { name: \"Laptop\", price: 99.99 };\nconst template = `\n<div class=\"product\"\
    >\n  <h2>${product.name}</h2>\n  <p>Price: $${product.price}</p>\n</div>`;\n```\n\
    \nIn this example, the `${product.name}` and `${product.price}` expressions are\
    \ evaluated and inserted into the string.\n\n### Limitations of String-Based Templates\n\
    \nWhile string-based templates are easy to understand and use, they have some\
    \ drawbacks:\n\n1. **Readability**: Complex templates can become hard to read\
    \ and maintain due to the mix of HTML, variables, and expressions.\n2. **Security\
    \ Risks**: Directly inserting user-generated content into templates can lead to\
    \ vulnerabilities like cross-site scripting (XSS) attacks. It’s crucial to sanitize\
    \ or escape user input to mitigate these risks.\n3. **Limited Features**: String-based\
    \ templates lack the advanced features provided by dedicated templating libraries,\
    \ such as loops, conditionals, and inheritance.\n4. **No Separation of Logic**:\
    \ The mixing of HTML and JavaScript code can make it harder to separate presentation\
    \ logic from application logic, hindering maintainability.\n"
  raw: 'Functional components are typically used when the component’s primary responsibility
    is to render some UI based on the props it receives. Here’s an example of a simple
    functional component:


    import React from ''react'';


    function Greeting(props) {


      return <h1>Hello, {props.name}!</h1>;


    }


    export default Greeting;


    In this example, the  Greeting component takes a  name prop and renders a greeting
    message. It’s a stateless component since it doesn’t manage any internal state.


    ### Class Components


    Class components are used when more functionality is needed, such as managing
    internal state or utilizing lifecycle methods. Here’s an example of a class component:


    import React, { Component } from ''react'';


    class Counter extends Component {


      constructor(props) {


        super(props);


        this.state = { count: 0 };


      }


      increment = () => {


        this.setState({ count: this.state.count + 1 });


      }


      render() {


        return (


          <div>


            <p>Count: {this.state.count}</p>


            <button onClick={this.increment}>Increment</button>


          </div>


        );


      }


    }


    export default Counter;


    In this example, the  Counter component manages its own state (count) and provides
    a method (increment) to update that state. The component re-renders whenever the
    state changes, reflecting the updated count.


    ### Promoting Modularity and Reusability


    By using components, developers can achieve a high degree of modularity and reusability
    in their code. Components can be composed together to build more complex UIs.
    They can also be shared across different parts of an application or even across
    different projects, making development faster and more efficient.


    In summary, components are the building blocks of modern web UIs, providing a
    structured way to build, maintain, and reuse UI elements. Whether using functional
    components for simplicity or class components for more control, understanding
    how to create and manage components is essential for any web developer.


    ## Templating: Dynamic Content Generation


    Templating is a powerful technique in web development that allows you to generate
    dynamic HTML content based on data. Instead of manually constructing HTML strings
    with variables and concatenation, templates provide a structured and more maintainable
    way to define the layout and structure of your UI elements.


    ### Why Use Templates?


    ● Separation of Concerns: Templates help separate presentation logic (how data
    is displayed) from application logic (how data is fetched and manipulated). This
    makes your code cleaner, easier to understand, and more testable.


    ● Reusability: Templates can be reused to render different sets of data, reducing
    code duplication.


    ● Maintainability: Changes to the UI structure or styling can be made in one place
    (the template), rather than scattered throughout your code.


    ● Dynamic Content: Templates allow you to easily inject dynamic data into your
    HTML, creating interactive and personalized experiences.


    ### Templating Approaches: From Simple to Sophisticated


    JavaScript offers various templating approaches, each with its own advantages
    and trade-offs:


    #### 1\. String-Based Templates:


    String-based templates involve embedding variables and expressions directly within
    HTML strings using concatenation or string interpolation.


    const name = "Alice";


    const greeting = `<h1>Hello, ${name}!</h1>`;


    While simple to use, this approach can become unwieldy for complex templates and
    might introduce security vulnerabilities (e.g., cross-site scripting) if not handled
    carefully.


    #### 2\. Template Literals (ES6+):


    Template literals, introduced in ES6, offer a more elegant way to embed expressions
    within strings using the backtick (`) syntax.


    const product = { name: "Laptop", price: 999.99 };


    const template = `


      <div class="product">


        <h2>${product.name}</h2>


        <p>Price: $${product.price}</p>


      </div>


    `;


    Template literals support multi-line strings, variable interpolation, and even
    expressions, making them a convenient choice for simple templating needs.


    #### 3\. Templating Libraries:


    For more complex applications, dedicated templating libraries like Handlebars
    or Mustache offer additional features:


    ● Loops and Conditionals: Easily iterate over arrays or conditionally render content.


    ●     Partial Templates: Reuse smaller templates within larger ones.


    ● Helpers: Custom functions for formatting data or performing calculations within
    templates.


    // Using Handlebars (example)


    const template = Handlebars.compile("<h1>{{title}}</h1><p>{{content}}</p>");


    const data = { title: "My Blog Post", content: "This is my blog post content."
    };


    const html = template(data);


    ### Rendering Templates: Bringing Them to Life


    To render a template, you typically combine the template string with your data
    and insert the resulting HTML into the DOM. This process can be done manually
    or with the help of libraries or frameworks that provide more sophisticated rendering
    mechanisms.


    ### Key Takeaways


    Templating is a powerful tool that enables dynamic content generation and improves
    the organization and maintainability of your web applications. By choosing the
    right templating approach (string-based, template literals, or libraries) and
    carefully managing your data, you can create engaging and interactive user interfaces
    with ease.


    ## String-Based Templates: Simple but Limited


    String-based templates represent the simplest form of templating in JavaScript.
    They involve combining plain strings with variables and expressions to dynamically
    generate HTML content.


    ### Concatenation: The Old-School Way


    In the earlier days of JavaScript, developers used string concatenation to create
    templates:


    const name = "Alice";


    const greeting = "<h1>Hello, " + name + "!</h1>";


    Here, the + operator is used to concatenate the string literals ("<h1>Hello, ",  "!",
    and  "</h1>") with the variable  name. While this approach works, it can quickly
    become messy and difficult to read, especially with more complex templates.


    ### String Interpolation: A Modern Twist


    Modern JavaScript (ES6+) introduced template literals (backticks `), which offer
    a more convenient way to embed variables and expressions within strings:


    const product = { name: "Laptop", price: 999.99 };


    const template = `


      <div class="product">


        <h2>${product.name}</h2>


        <p>Price: $${product.price}</p>


      </div>


    `;


    In this example, the  ${product.name} and  ${product.price} expressions are evaluated
    and inserted into the string, resulting in a dynamic HTML template.


    ### Limitations of String-Based Templates


    While string-based templates are easy to understand and use, they have some drawbacks:


    1.  Readability: Complex templates can become hard to read and maintain due to
    the mix of HTML, variables, and expressions.


    2.  Security Risks: Directly inserting user-generated content into templates can
    lead to vulnerabilities like cross-site scripting (XSS) attacks. It’s crucial
    to sanitize or escape user input to mitigate these risks.


    3.  Limited Features: String-based templates lack the advanced features provided
    by dedicated templating libraries, such as loops, conditionals, and inheritance.


    4.  No Separation of Logic: The mixing of HTML and JavaScript code can make it
    harder to separate presentation logic from application logic, hindering maintainability.


    ### When to Use String-Based Templates


    String-based templates can still be useful in scenarios where you need to quickly
    generate simple dynamic content and the potential limitations are not a major
    concern. For example, they might be suitable for:


    ●     Small, self-contained components.


    ●     Prototyping or simple applications.


    ● Situations where you have full control over the input data and security is not
    a major concern.'
