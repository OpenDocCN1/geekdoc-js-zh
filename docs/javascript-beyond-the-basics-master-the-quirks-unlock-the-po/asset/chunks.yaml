    class MathUtils {\n  static add(x, y) {\n    return x + y;\n  }\n}\n```\n\n实际上，输入文本包含许多重复片段。我将按照提供的文本处理。\n\
    \n---\n\n## 继承：扩展功能\n\n继承是面向对象编程（OOP）的基石，允许你基于现有类（父类或基类）创建新类（子类或派生类）。这促进了代码复用并建立了类之间的层次关系。\n\
    \n### extends 关键字：建立关系\n\n`extends` 关键字是 JavaScript 类中创建继承的关键。它将子类连接到父类，使子类继承属性和方法。\n\
    \n```javascript\nclass Animal { // 父类\n  constructor(name) {\n    this.name =\
    \ name;\n  }\n  makeSound() {\n    console.log(\"Generic animal sound!\");\n \
    \ }\n}\n\nclass Dog extends Animal { // 子类（自 Animal）\n  constructor(name, breed)\
    \ {\n    super(name); // 调用父类构造函数\n    this.breed = breed;\n  }\n  makeSound()\
    \ {\n    console.log(\"Woof!\"); // 重写父类的 makeSound 方法\n  }\n}\n\nconst myDog\
    \ = new Dog(\"Buddy\", \"Golden Retriever\");\nmyDog.makeSound(); // 输出: \"Woof!\"\
    \n```\n\n### super 关键字：连接父类\n\n`super` 关键字在继承中起着关键作用。它主要有两个目的：\n\n1. 调用父类构造函数：在子类构造函数内部，在使用\
    \ `this` 之前必须调用 `super()`。这确保执行父类构造函数，以初始化继承的属性。\n2. 访问父类方法：在子类方法内部，可以使用 `super.method_name()`\
    \ 来访问并调用在父类上定义的方法。\n\n### 方法重写：子类的定制\n\n继承并不意味着盲目复制。子类可以重写从父类继承的方法。这允许你自定义子对象的行为，同时保留父类的整体结构和功能。\n"
- fmt: "\n# Inheritance in JavaScript\n\n- **Code Reusability**: You don’t have to\
    \ rewrite the same code for each class. Child classes automatically get the properties\
    \ and methods of their parents.\n- **Extensibility**: You can easily create new\
    \ classes that build upon existing ones, adding specialized features or behaviors.\n\
    - **Organization**: Inheritance creates a clear hierarchy of classes, making your\
    \ codebase more structured and easier to understand.\n\nBy mastering the concepts\
    \ of `extends`, `super`, and method overriding, you can leverage the power of\
    \ inheritance to create more organized, efficient, and flexible JavaScript code.\
    \ Inheritance is a cornerstone of object-oriented programming and a powerful tool\
    \ for modeling real-world relationships within your applications.\n\n## Code Examples\
    \ of Inheritance in Action\n\nLet’s dive into practical examples that showcase\
    \ the power of inheritance in JavaScript:\n\n### Example 1: Animals and Dogs\n\
    \n```javascript\nclass Animal { // Parent Class\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  speak() {\n    console.log(this.name + \" makes a sound.\");\n\
    \  }\n}\n\nclass Dog extends Animal { // Child Class\n  constructor(name, breed)\
    \ {\n    super(name);\n    this.breed = breed;\n  }\n  speak() {\n    console.log(this.name\
    \ + \" barks!\"); // Overriding parent method\n  }\n}\n\nconst myDog = new Dog(\"\
    Buddy\", \"Golden Retriever\");\nmyDog.speak(); // Output: \"Buddy barks!\"\n\
    ```\n\nIn this classic example, we have an `Animal` class with a generic `speak`\
    \ method. The `Dog` class inherits from `Animal` using `extends`. `Dog` overrides\
    \ the `speak` method to provide a specific behavior: barking. Notice how `super(name)`\
    \ calls the parent constructor to ensure `name` is properly initialized.\n\n###\
    \ Example 2: Vehicles and Cars\n\n```javascript\nclass Vehicle { // Parent Class\n\
    \  constructor(brand, model) {\n    this.brand = brand;\n    this.model = model;\n\
    \  }\n  start() {\n    console.log(`${this.brand} ${this.model} started!`);\n\
    \  }\n}\n\nclass Car extends Vehicle { // Child Class\n  constructor(brand, model,\
    \ year) {\n    super(brand, model);\n    this.year = year;\n  }\n  drive() {\n\
    \    console.log(`Driving the ${this.year} ${this.brand} ${this.model}`);\n  }\n\
    }\n\nconst myCar = new Car(\"Toyota\", \"Camry\", 2023);\nmyCar.start(); // Output:\
    \ \"Toyota Camry started!\" (inherited from Vehicle)\nmyCar.drive();  // Output:\
    \ \"Driving the 2023 Toyota Camry\" (specific to Car)\n```\n\nThe `Car` class\
    \ inherits common properties (`brand`, `model`) and the `start` method from the\
    \ `Vehicle` class. It adds its own `year` property and a `drive` method, demonstrating\
    \ how child classes can extend functionality.\n\n### Example 3: Shapes and Rectangles\n\
    \n```javascript\nclass Shape {\n  constructor(color) {\n    this.color = color;\n\
    \  }\n  describe() {\n    console.log(`This is a ${this.color} shape.`);\n  }\n\
    }\n\nclass Rectangle extends Shape {\n  constructor(color, width, height) {\n\
    \    super(color);\n    this.width = width;\n    this.height = height;\n  }\n\
    \  calculateArea() {\n    return this.width * this.height;\n  }\n}\n\nconst myRectangle\
    \ = new Rectangle(\"blue\", 5, 10);\nmyRectangle.describe(); // Output: \"This\
    \ is a blue shape.\" (inherited)\nconsole.log(myRectangle.calculateArea()); //\
    \ Output: 50 (specific to Rectangle)\n```\n\nHere, the `Rectangle` class inherits\
    \ the `color` property and the `describe` method from `Shape`, showcasing how\
    \ inheritance creates a hierarchy of related objects.\n\nThese examples demonstrate\
    \ the essence of inheritance: the ability to create specialized classes that build\
    \ upon existing ones, inheriting and extending properties and behaviors. This\
    \ powerful feature promotes code reusability, modularity, and a logical structure\
    \ for your JavaScript applications.\n\n## Polymorphism: Many Forms, One Interface\n\
    \nPolymorphism, a core principle of object-oriented programming (OOP), is the\
    \ ability to treat objects of different classes interchangeably through a common\
    \ interface. It’s like a chameleon adapting to its environment, changing its appearance\
    \ to fit in seamlessly. In JavaScript, this translates to objects having different\
    \ internal structures but sharing the same external behavior.\n\n### The Power\
    \ of Flexibility\n\nPolymorphism empowers you to write code that is more generic\
    \ and adaptable. Instead of writing separate functions for each specific type\
    \ of object, you can create a single function that works with a variety of objects,\
    \ as long as they share a common interface (a set of methods or properties with\
    \ the same names).\n\n### Example: A Shape-Shifting Function\n\n```javascript\n\
    function printArea(shape) {\n  console.log(`The area of this shape is: ${shape.calculateArea()}`);\n\
    }\n\nconst circle = new Circle(5);\nconst rectangle = new Rectangle(4, 6);\n\n\
    printArea(circle);    // Output: The area of this shape is: 78.53981633974483\n\
    printArea(rectangle); // Output: The area of this shape is: 24\n```\n\nIn this\
    \ example, the `printArea` function doesn’t care if it receives a `Circle` or\
    \ a `Rectangle`. As long as the object has a `calculateArea` method, the function\
    \ can use it to get the area and print it. This demonstrates the power of polymorphism\
    \ – you can write a single function that works with multiple object types, making\
    \ your code more flexible and reusable.\n\n### Polymorphism and Inheritance\n\n\
    Polymorphism often goes hand in hand with inheritance. A child class can inherit\
    \ a method from its parent class and provide its own unique implementation. This\
    \ allows you to treat instances of the child class as if they were instances of\
    \ the parent class, but with specialized behavior.\n\n```javascript\nconst animal\
    \ = new Animal(\"Generic Animal\");\nconst dog = new Dog(\"Buddy\", \"Golden Retriever\"\
    );\n\nanimal.makeSound(); // Output: \"Generic animal sound!\"\ndog.makeSound();\
    \    // Output: \"Buddy barks!\"\n```\n\nHere, `animal` and `dog` have `makeSound`,\
    \ but they produce different results.\n\n### The Key to Generic Code\n\nPolymorphism\
    \ allows you to write more generic code by focusing on the interface rather than\
    \ the specific implementation. This makes your code more adaptable and easier\
    \ to extend.\n\n### Examples of Polymorphism in JavaScript\n\nLet’s dive into\
    \ examples that showcase polymorphism in action, emphasizing how different classes\
    \ can implement the same method:\n\n#### Example 1: Shapes with calculateArea()\n\
    \n```javascript\nclass Shape {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n  calculateArea() {\n    throw new Error(\"This method must be implemented.\"\
    );\n  }\n}\n\nclass Circle extends Shape {\n  constructor(name, radius) {\n  \
    \  super(name);\n    this.radius = radius;\n  }\n  calculateArea() {\n    return\
    \ Math.PI * this.radius ** 2;\n  }\n}\n\nclass Rectangle extends Shape {\n  constructor(name,\
    \ width, height) {\n    super(name);\n    this.width = width;\n    this.height\
    \ = height;\n  }\n  calculateArea() {\n    return this.width * this.height;\n\
    \  }\n}\n\nconst circle = new Circle(\"Circle\", 5);\nconst rectangle = new Rectangle(\"\
    Rectangle\", 4, 6);\n\nconsole.log(circle.calculateArea()); // Output: 78.5398...\n\
    console.log(rectangle.calculateArea()); // Output: 24\n```\n\n#### Example 2:\
    \ Animals and their Sounds\n\n```javascript\nclass Animal {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n  speak() {\n    console.log(\"Generic animal\
    \ sound!\");\n  }\n}\n\nclass Dog extends Animal {\n  constructor(name, breed)\
    \ {\n    super(name);\n    this.breed = breed;\n  }\n  speak() {\n    console.log(this.name\
    \ + \" barks!\");\n  }\n}\n\nconst animal = new Animal(\"Generic Animal\");\n\
    const dog = new Dog(\"Buddy\", \"Golden Retriever\");\n\nanimal.speak(); // Output:\
    \ \"Generic animal sound!\"\ndog.speak();    // Output: \"Buddy barks!\"\n```\n"
