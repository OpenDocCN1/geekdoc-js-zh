    \n// Output: { name: \"Alice\", age: 30, city: \"New York\", occupation: \"Engineer\"\
    \ }\n```\n\n### 2. 修改属性值：更新数据\n\n要更改现有属性的值，只需使用点符号（dot notation）或括号符号（bracket\
    \ notation）为其赋值一个新值。\n\n```javascript\nperson.age = 31;       // 使用点符号更新 age\n\
    person[\"city\"] = \"San Francisco\"; // 使用括号符号更新 city\n```\n\n### 3. 删除属性：移除不再需要的内容\n\
    \n`delete` 操作符用于从对象中删除一个属性。\n\n```javascript\ndelete person.occupation;\n\nconsole.log(person);\n\
    \n// Output: { name: \"Alice\", age: 31, city: \"San Francisco\" }\n```\n\n####\
    \ 何时修改对象\n\n你可能在各种场景下需要修改对象：\n\n- 用户交互：更新用户个人信息或偏好。\n- 数据更新：从 API 或数据库整合新数据。\n\
    - 状态管理：响应事件更改应用程序的状态。\n- 动态配置：根据用户输入或其他条件调整设置或选项。\n\n#### 注意事项与考虑\n\n- **不可变性**：在某些情况下，保持对象是不可变的（不可更改的）。你可以使用如\
    \ `Object.freeze()` 等技术来防止修改。\n- **属性存在性**：在修改或删除属性之前，检查其是否存在是一个良好习惯，可以避免错误。\n\
    \n修改对象是 JavaScript 开发的一个基础方面。通过掌握这些技术，你将能够创建更具动态性和适应性的应用程序，响应变化的数据和用户交互。\n\n##\
    \ 常用对象方法\n\nJavaScript 提供了许多内置方法，让操作对象变得更加简单高效。让我们来探索一些最核心的方法：\n\n### Object.keys(obj):\
    \ 获取所有键\n\n该方法返回一个数组，包含给定对象所有可枚举属性的名称（键）。\n\n```javascript\nconst person = {\n\
    \  name: \"Alice\",\n  age: 30,\n  city: \"New York\"\n};\n\nconst keys = Object.keys(person);\n\
    console.log(keys); // 输出: [\"name\", \"age\", \"city\"]\n```\n\n### Object.values(obj):\
    \ 获取所有值\n\n该方法返回一个数组，包含给定对象所有可枚举属性的值。\n\n```javascript\nconst values = Object.values(person);\n\
    console.log(values); // 输出: [\"Alice\", 30, \"New York\"]\n```\n\n### Object.entries(obj):\
    \ 获取键值对\n\n该方法返回一个嵌套数组，其中每个内部数组代表该对象的一个键值对。\n\n```javascript\nconst entries =\
    \ Object.entries(person);\nconsole.log(entries);\n// 输出: [[\"name\", \"Alice\"\
    ], [\"age\", 30], [\"city\", \"New York\"]]\n```\n\n### Object.assign(target,\
    \ ...sources): 复制属性\n\n该方法用于从一个或多个源对象将所有枚举自有属性的值复制到目标对象。它返回目标对象。\n\n```javascript\n\
    const target = { a: 1 };\nconst source1 = { b: 2 };\nconst source2 = { c: 3 };\n\
    \nObject.assign(target, source1, source2);\nconsole.log(target); // 输出: { a: 1,\
    \ b: 2, c: 3 }\n```\n\n### Object.freeze(obj): 使对象不可变\n\n该方法冻结一个对象，防止向其添加新属性、删除现有属性，并防止现有属性的值被更改。本质上，它让对象变得不可变。\n\
    \n```javascript\nconst person = {\n  name: \"Alice\",\n  age: 30\n};\n\nObject.freeze(person);\n\
    \nperson.age = 31; // 这将没有任何作用\ndelete person.name; // 这将没有任何作用\n```\n\n#### 为什么这些方法至关重要\n\
    \n- **迭代**：`Object.keys()`、`Object.values()` 和 `Object.entries()` 对于遍历对象属性至关重要。\n\
    - **数据处理**：`Object.assign()` 提供了一种复制或合并对象的方便方法。\n- **状态管理**：`Object.freeze()`\
    \ 可用于状态管理库（如 Redux）中强制执行不可变。\n\n通过掌握这些常用对象方法，你将拥有一个强大的工具箱，在 JavaScript 应用程序中有效地处理对象。\n\
    \n## 章节总结\n\n在本章中，我们探索了 JavaScript 中操作对象的核心概念。我们学到对象是键值对的集合，它是代码中表示结构化数据和复杂实体的基础。\n\
    \n我们涵盖了创建对象的各种技术，包括对象字面量符号、构造函数和 `Object.create()` 方法。每种方法都有自己的优势和用例，为你在构建对象时提供了灵活性。我们还学习了如何使用点符号和括号符号来访问和修改对象属性，从而提供了与对象数据动态交互的能力。\n\
    \n最后，我们探索了一些常用的对象方法，如 `Object.keys()`、`Object.values()`、`Object.entries()`、`Object.assign()`\
    \ 和 `Object.freeze()`。这些方法让你能够遍历属性、复制或合并对象，甚至在需要时强制执行不可变。\n\n掌握了这些知识，你已经在通往精通操作操作道路上（JavaScript\
    \ 编程的一个基础方面）。随着旅程继续，你将发现对象是如何成为许多 JavaScript 库、框架和应用程序的骨干的。\n\n# 原型与继承：原型链与对象关系\n\
    \n### 大纲\n\n- 原型：底层蓝图\n- 原型链：继承的路径\n- 原型继承的实践\n- __proto__ 与 prototype：消除混淆\n\
    - 原型继承的力量与灵活性\n- 章节总结\n\n### 原型：底层蓝图\n\n在 JavaScript 对象模型的核心是原型的概念。将原型想象成对象的蓝图，一个定义其继承特征的模板。除了\
    \ `null` 之外，每个对象都指向另一个对象——它的原型。\n\n### 原型链：继承的路径\n\n这个隐藏链接通常被称为 `[[Prototype]]`\
    \ 属性或由于历史原因的 `__proto__` 属性，建立了继承链。当你尝试访问对象的属性或方法时，JavaScript 首先检查对象本身是否拥有该属性或方法。如果没有，它会沿着\
    \ `[[Prototype]]` 链接到对象的原型。\n\n### 原型继承的实践：继承的力量\n\n原型链是 JavaScript 对象继承属性和方法的机制。如果对象本身没有直接定义某个属性或方法，JavaScript\
    \ 将自动在其原型中查找。如果找到，对象就可以使用该继承的属性或方法，就像它是自己的一样。这使得强大的代码复用和动态对象行为成为可能。\n\n```javascript\n\
    const animal = {\n  breathe: function() {\n    console.log(\"吸呼呼气...\");\n  }\n\
    };\n\nconst dog = Object.create(animal); // 创建以 animal 为原型的 dog\n\ndog.breathe();\
    \ // 输出: 吸呼呼气...\n```\n\n在这个示例中，`dog` 对象本身没有直接定义 `breathe` 方法。然而，因为它的原型是 `animal`\
    \ 对象，它可以访问并调用 `breathe` 方法，就好像它是自己的一样。\n\n### __proto__ 与 prototype：消除混淆\n\n原型链并不是无止尽的。链的顶端是\
    \ `Object.prototype` 对象。它是祖原型，JavaScript 中的所有其他对象都继承自它的基础属性和方法，如 `toString()`\
    \ 和 `hasOwnProperty()`。这意味着即使你创建一个空对象字面量（`{}`），它仍然隐式地继承自 `Object.prototype`。\n\
    \n### 超越继承：动态行为\n\n"
- fmt: "\nPrototypes aren’t just about inheritance; they also enable dynamic behavior.\
    \ You can modify a prototype object at runtime, and those changes will be reflected\
    \ in all objects inheriting from it. This flexibility allows you to create dynamic\
    \ object relationships and change an object’s behavior on the fly.\n\nUnderstanding\
    \ prototypes is crucial for grasping how JavaScript objects work. They are the\
    \ backbone of JavaScript’s object model, enabling inheritance, code reuse, and\
    \ dynamic behavior. By mastering this concept, you’ll be well on your way to unlocking\
    \ the full potential of objects in your JavaScript programs.\n\n## The Prototype\
    \ Chain: The Inheritance Trail\n\nThink of the prototype chain as a family tree\
    \ of objects, where each object inherits traits (properties and methods) from\
    \ its ancestors. When you try to access something on an object, JavaScript starts\
    \ by looking directly at that object. If it can’t find what you’re looking for,\
    \ it doesn’t give up; it follows a path up the family tree, checking each ancestor\
    \ in turn.\n\n### Visualizing the Chain\n\n```\nObject.prototype\n↑\nAnimal.prototype\n\
    ↑\nDog.prototype\n↑\nmyDog\n```\n\nIn this diagram:\n● `myDog`: Your specific\
    \ dog object (e.g., a Golden Retriever named Max).\n● `Dog.prototype`: The prototype\
    \ for all dogs, containing shared dog-like characteristics (e.g., a `bark` method).\n\
    ● `Animal.prototype`: The prototype for all animals, containing even more general\
    \ traits (e.g., an `eat` method).\n● `Object.prototype`: The root of all objects,\
    \ providing basic methods like `toString()`.\n\n### The Search Process\n\nLet’s\
    \ say you try to call `myDog.bark()`. Here’s how JavaScript finds the method:\n\
    \n1. Check `myDog`: Does `myDog` have a `bark` method directly defined? If yes,\
    \ call it and stop.\n2. Check `Dog.prototype`: Does the prototype for dogs have\
    \ a `bark` method? If yes, call it and stop.\n3. Check `Animal.prototype`: Does\
    \ the prototype for animals have a `bark` method? If yes, call it and stop.\n\
    4. Check `Object.prototype`: Does the base prototype have a `bark` method? If\
    \ yes, call it.\n5. Not Found: If the method isn’t found anywhere in the chain,\
    \ JavaScript throws an error.\n\n### Code Example\n\n```javascript\nconst animal\
    \ = {\n  eat() { console.log(\"Yum!\"); }\n};\n\nconst dog = Object.create(animal);\n\
    dog.bark = function() { console.log(\"Woof!\"); };\n\ndog.eat();    // Output:\
    \ \"Yum!\" (inherited from animal)\ndog.bark();  // Output: \"Woof!\" (directly\
    \ on the dog object)\ndog.sleep(); // Error: dog.sleep is not a function (not\
    \ found in prototype chain)\n```\n\n### Key Points\n● **Efficiency**: The prototype\
    \ chain allows for efficient memory use. Objects only store properties unique\
    \ to them, not the ones they inherit.\n● **Flexibility**: You can modify prototypes\
    \ at runtime, dynamically altering the behavior of objects.\n● **The Object.prototype**:\
    \ Every object ultimately inherits from `Object.prototype`, granting access to\
    \ universal methods.\n● **Order Matters**: JavaScript searches the prototype chain\
    \ from the bottom up, starting with the object itself.\n\n## Prototypal Inheritance\
    \ in Action\n\nPrototypal inheritance is the mechanism that makes JavaScript’s\
    \ object model tick. It allows you to create objects that inherit characteristics\
    \ from other objects, forming a hierarchical structure.\n\n### Object.create():\
    \ The Inheritance Tool\n\nThe `Object.create()` method is the key to creating\
    \ objects with explicit prototypes. Let’s see it in action:\n\n```javascript\n\
    // Parent Prototype\nconst vehicle = {\n  startEngine() {\n    console.log(\"\
    Engine starting...\");\n  }\n};\n\n// Child Object\nconst car = Object.create(vehicle);\n\
    car.brand = \"Toyota\";\ncar.model = \"Camry\";\ncar.drive = function() {\n  \
    \  console.log(\"Driving...\");\n}\ncar.startEngine(); // Output: \"Engine starting...\"\
    \ (Inherited from vehicle)\nconsole.log(car.brand); // Output: \"Toyota\" (Direct\
    \ property on car)\ncar.drive(); // Output: \"Driving...\" (Direct method on car)\n\
    ```\n\nIn this example:\n1. We create a `vehicle` object with the `startEngine`\
    \ method.\n2. We use `Object.create(vehicle)` to create a `car` object that inherits\
    \ from `vehicle`.\n3. The `car` object has its own properties (`brand` and `model`)\
    \ and a method (`drive`).\n4. When we call `car.startEngine()`, it’s not found\
    \ on the `car` object itself, so JavaScript looks up the prototype chain to `vehicle`,\
    \ where it finds and executes the method.\n\n### Dynamic Prototypes: Changing\
    \ the Inheritance\n\nOne of the most powerful aspects of prototypal inheritance\
    \ is that you can modify prototypes at runtime. This change affects all objects\
    \ inheriting from that prototype.\n\n```javascript\nvehicle.startEngine = function()\
    \ {\n  console.log(\"Engine starting with a roar!\"); // Modified method\n};\n\
    \ncar.startEngine(); // Output: \"Engine starting with a roar!\"\n```\n\nEven\
    \ though we didn’t change the `car` object directly, it now inherits the modified\
    \ `startEngine` method from its prototype.\n\n### The Flexibility of Object.create()\n\
    \nUnlike constructor functions, where the prototype is fixed at the time of function\
    \ definition, `Object.create()` allows you to choose the prototype dynamically.\
    \ This gives you finer control over inheritance relationships and lets you create\
    \ complex object hierarchies.\n\n### Key Takeaways\n● Prototypal inheritance allows\
    \ objects to share properties and methods through a prototype chain.\n● `Object.create()`\
    \ is a powerful tool for establishing explicit inheritance relationships.\n● Modifying\
    \ a prototype affects all objects inheriting from it.\n\nBy understanding prototypal\
    \ inheritance, you gain a deeper understanding of JavaScript’s object model and\
    \ can create more flexible, reusable, and efficient code.\n\n## __proto__ vs.\
    \ prototype: Clearing the Confusion\n\nThe terms `__proto__` and `prototype` are\
    \ often used interchangeably, leading to confusion about their roles in JavaScript’s\
    \ prototypal inheritance. Let’s clarify their distinct purposes and how they work\
    \ together.\n\n### __proto__: The Hidden Link\n\n● **Nature**: The `__proto__`\
    \ property (or its modern equivalent, `Object.getPrototypeOf()`) is an accessor\
    \ property present on almost all objects in JavaScript.\n● **Role**: It serves\
    \ as a hidden link that points to the object’s prototype. This link forms the\
    \ foundation of the prototype chain, enabling inheritance.\n● **Usage**: You can\
    \ use `__proto__` (or `Object.getPrototypeOf()`) to inspect or even modify an\
    \ object’s prototype. However, direct manipulation of `__proto__` is generally\
    \ discouraged due to potential performance issues and compatibility concerns.\n\
    \n```javascript\nconst animal = { eats: true };\nconst rabbit = Object.create(animal);\n\
    \nconsole.log(rabbit.__proto__ === animal); // Output: true\nconsole.log(Object.getPrototypeOf(rabbit)\
    \ === animal); // Output: true\n```\n\n### prototype: The Blueprint for Objects\
    \ Created with new\n\n● **Nature**: The `prototype` property is found only on\
    \ constructor functions (functions intended to be used with the `new` keyword).\n\
    ● **Role**: It serves as a blueprint for objects created using the `new` keyword.\
    \ The `prototype` property of a constructor function becomes the prototype of\
    \ the newly created object.\n● **Usage**: You define properties and methods on\
    \ a constructor function’s `prototype` property, and those properties and methods\
    \ become available to all objects created from that constructor.\n\n```javascript\n\
    function Animal(name) {\n  this.name = name;\n}\n\nAnimal.prototype.eat = function()\
    \ {\n  console.log(this.name + \" is eating.\");\n};\n\nconst dog = new Animal(\"\
    Buddy\");\ndog.eat(); // Output: \"Buddy is eating.\"\n```\n\n### Key Differences\n\
    \n| Feature | __proto__ or Object.getPrototypeOf() | prototype |\n| :--- | :---\
    \ | :--- |\n| **Location** | Property on objects | Property on constructor functions\
    \ |\n| **Purpose** | Access/modify an object’s prototype | Defines the prototype\
    \ for objects created with `new` |\n| **Modification** | Can be modified (but\
    \ discouraged) | Can be modified to affect all instances |\n\n### Summary\n\n\
    In essence:\n● `__proto__` (or `Object.getPrototypeOf()`) is the link between\
    \ an object and its prototype, allowing for property and method lookup.\n● `prototype`\
    \ is the blueprint used to create objects with `new`, defining their shared characteristics.\n"
  raw: 'Prototypes aren’t just about inheritance; they also enable dynamic behavior.
    You can modify a prototype object at runtime, and those changes will be reflected
    in all objects inheriting from it. This flexibility allows you to create dynamic
    object relationships and change an object’s behavior on the fly.


    Understanding prototypes is crucial for grasping how JavaScript objects work.
    They are the backbone of JavaScript’s object model, enabling inheritance, code
    reuse, and dynamic behavior. By mastering this concept, you’ll be well on your
    way to unlocking the full potential of objects in your JavaScript programs.


    The Prototype Chain: The Inheritance Trail


    Think of the prototype chain as a family tree of objects, where each object inherits
    traits (properties and methods) from its ancestors. When you try to access something
    on an object, JavaScript starts by looking directly at that object. If it can’t
    find what you’re looking for, it doesn’t give up; it follows a path up the family
    tree, checking each ancestor in turn.


    Visualizing the Chain


    Object.prototype


    ↑


    Animal.prototype


    ↑


    Dog.prototype


    ↑


    myDog


    In this diagram:


    ● myDog: Your specific dog object (e.g., a Golden Retriever named Max).


    ● Dog.prototype: The prototype for all dogs, containing shared dog-like characteristics
    (e.g., a  bark method).


    ● Animal.prototype: The prototype for all animals, containing even more general
    traits (e.g., an  eat method).


    ● Object.prototype: The root of all objects, providing basic methods like  toString().


    The Search Process


    Let’s say you try to call  myDog.bark(). Here’s how JavaScript finds the method:


    1.  Check  myDog: Does  myDog have a  bark method directly defined? If yes, call
    it and stop.


    2.  Check  Dog.prototype: Does the prototype for dogs have a  bark method? If
    yes, call it and stop.


    3.  Check  Animal.prototype: Does the prototype for animals have a  bark method?
    If yes, call it and stop.


    4.  Check  Object.prototype: Does the base prototype have a  bark method? If yes,
    call it.


    5.  Not Found: If the method isn’t found anywhere in the chain, JavaScript throws
    an error.


    Code Example


    const animal = {


      eat() { console.log("Yum!"); }


    };


    const dog = Object.create(animal);


    dog.bark = function() { console.log("Woof!"); };


    dog.eat();    // Output: "Yum!" (inherited from animal)


    dog.bark();   // Output: "Woof!" (directly on the dog object)


    dog.sleep(); // Error: dog.sleep is not a function (not found in prototype chain)


    Key Points


    ● Efficiency: The prototype chain allows for efficient memory use. Objects only
    store properties unique to them, not the ones they inherit.


    ● Flexibility: You can modify prototypes at runtime, dynamically altering the
    behavior of objects.


    ● The  Object.prototype: Every object ultimately inherits from  Object.prototype,
    granting access to universal methods.


    ● Order Matters: JavaScript searches the prototype chain from the bottom up, starting
    with the object itself.


    ## Prototypal Inheritance in Action


    Prototypal inheritance is the mechanism that makes JavaScript’s object model tick.
    It allows you to create objects that inherit characteristics from other objects,
    forming a hierarchical structure.


    ### Object.create(): The Inheritance Tool


    The  Object.create() method is the key to creating objects with explicit prototypes.
    Let’s see it in action:


    // Parent Prototype


    const vehicle = {


      startEngine() {


        console.log("Engine starting...");


      }


    };


    // Child Object


    const car = Object.create(vehicle);


    car.brand = "Toyota";


    car.model = "Camry";


    car.drive = function() {


        console.log("Driving...");


    }


    car.startEngine(); // Output: "Engine starting..." (Inherited from vehicle)


    console.log(car.brand); // Output: "Toyota" (Direct property on car)


    car.drive(); // Output: "Driving..." (Direct method on car)


    In this example:


    1.  We create a  vehicle object with the  startEngine method.


    2.  We use  Object.create(vehicle) to create a  car object that inherits from  vehicle.


    3.  The  car object has its own properties (brand and  model) and a method (drive).


    4.  When we call  car.startEngine(), it’s not found on the  car object itself,
    so JavaScript looks up the prototype chain to  vehicle, where it finds and executes
    the method.


    ### Dynamic Prototypes: Changing the Inheritance


    One of the most powerful aspects of prototypal inheritance is that you can modify
    prototypes at runtime. This change affects all objects inheriting from that prototype.


    vehicle.startEngine = function() {


      console.log("Engine starting with a roar!"); // Modified method


    };


    car.startEngine(); // Output: "Engine starting with a roar!"


    Even though we didn’t change the  car object directly, it now inherits the modified  startEngine
    method from its prototype.


    ### The Flexibility of  Object.create()


    Unlike constructor functions, where the prototype is fixed at the time of function
    definition,  Object.create() allows you to choose the prototype dynamically. This
    gives you finer control over inheritance relationships and lets you create complex
    object hierarchies.


    ### Key Takeaways


    ● Prototypal inheritance allows objects to share properties and methods through
    a prototype chain.


    ● Object.create() is a powerful tool for establishing explicit inheritance relationships.


    ●     Modifying a prototype affects all objects inheriting from it.


    By understanding prototypal inheritance, you gain a deeper understanding of JavaScript’s
    object model and can create more flexible, reusable, and efficient code.


    ## __proto__ vs.  prototype: Clearing the Confusion


    The terms  __proto__ and  prototype are often used interchangeably, leading to
    confusion about their roles in JavaScript’s prototypal inheritance. Let’s clarify
    their distinct purposes and how they work together.


    ### __proto__: The Hidden Link


    ● Nature: The  __proto__ property (or its modern equivalent,  Object.getPrototypeOf())
    is an accessor property present on almost all objects in JavaScript.


    ● Role: It serves as a hidden link that points to the object’s prototype. This
    link forms the foundation of the prototype chain, enabling inheritance.


    ● Usage: You can use  __proto__ (or  Object.getPrototypeOf()) to inspect or even
    modify an object’s prototype. However, direct manipulation of  __proto__ is generally
    discouraged due to potential performance issues and compatibility concerns.


    const animal = { eats: true };


    const rabbit = Object.create(animal);


    console.log(rabbit.__proto__ === animal);  // Output: true


    console.log(Object.getPrototypeOf(rabbit) === animal); // Output: true


    ### prototype: The Blueprint for Objects Created with  new


    ● Nature: The  prototype property is found only on constructor functions (functions
    intended to be used with the  new keyword).


    ● Role: It serves as a blueprint for objects created using the  new keyword. The  prototype
    property of a constructor function becomes the  [[Prototype]] of the newly created
    object.


    ● Usage: You define properties and methods on a constructor function’s  prototype
    property, and those properties and methods become available to all objects created
    from that constructor.


    function Animal(name) {


      this.name = name;


    }


    Animal.prototype.eat = function() {


      console.log(this.name + " is eating.");


    };


    const dog = new Animal("Buddy");


    dog.eat(); // Output: "Buddy is eating."


    ### Key Differences


    | Feature | __proto__ or  Object.getPrototypeOf() | prototype |


    | Location | Property on objects | Property on constructor functions |


    | Purpose | Access/modify an object’s prototype | Defines the prototype for objects
    created with  new |


    | Modification | Can be modified (but discouraged) | Can be modified to affect
    all instances |


    ### Summary


    In essence:


    ● __proto__ (or  Object.getPrototypeOf()) is the link between an object and its
    prototype, allowing for property and method lookup.


    ● prototype is the blueprint used to create objects with  new, defining their
    shared characteristics.'
