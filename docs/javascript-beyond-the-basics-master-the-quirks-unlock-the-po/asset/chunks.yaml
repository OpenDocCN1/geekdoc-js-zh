    on data. They are the “verbs” of the language, allowing you to manipulate values,
    compare them, and make decisions based on the results.


    ### Arithmetic Operators: Performing Calculations


    These operators perform basic mathematical operations on numeric values:


    ●     + (Addition): Adds two numbers.


    ●     - (Subtraction): Subtracts one number from another.


    ●     * (Multiplication): Multiplies two numbers.


    ●     / (Division): Divides one number by another.


    ●     % (Modulo): Returns the remainder of a division.


    ● ** (Exponentiation): Raises a number to the power of another.


    let x = 10, y = 3;


    console.log(x + y);    // Output: 13


    console.log(x - y);    // Output: 7


    console.log(x * y);    // Output: 30


    console.log(x / y);    // Output: 3.3333333333333335


    console.log(x % y);    // Output: 1


    console.log(2 ** 3);   // Output: 8 (2 to the power of 3)


    ### Assignment Operators: Assigning Values


    These operators are used to assign values to variables:


    ●     = (Assignment): Assigns a value to a variable.


    ● += (Add and Assign): Adds a value to the existing value of a variable and assigns
    the result.


    ● -= (Subtract and Assign): Similar to  +=, but subtracts instead.


    ● *=,  /=,  %=,  **=: Similar to  += and  -=, but for multiplication, division,
    modulo, and exponentiation.


    let count = 5;


    count += 3;   // Equivalent to count = count + 3;  count is now 8


    count *= 2;   // Equivalent to count = count * 2;  count is now 16


    ### Comparison Operators: Making Comparisons


    These operators compare two values and return a boolean (true or  false) result:


    ● == (Equality): Checks if two values are equal(with type coercion).


    ● != (Inequality): Checks if two values are not equal (with type coercion).


    ● > (Greater Than): Checks if the first value is greater than the second.


    ● < (Less Than): Checks if the first value is less than the second.


    ● >= (Greater Than or Equal To): Checks if the first value is greater than or
    equal to the second.


    ● <= (Less Than or Equal To): Checks if the first value is less than or equal
    to the second.


    console.log(5 == 5);      // Output: true


    console.log(5 != ''5'');    // Output: false (type coercion happens)


    console.log(10 > 3);      // Output: true


    ### Logical Operators: Combining Conditions


    These operators combine boolean expressions:


    ● && (Logical AND): Returns  true if both expressions are true.


    ● || (Logical OR): Returns  true if at least one expression is true.


    ●     ! (Logical NOT): Reverses the truthiness of an expression.


    let isSunny = true;


    let isWarm = false;


    console.log(isSunny && isWarm); // Output: false


    console.log(isSunny || isWarm); // Output: true


    console.log(!isSunny);          // Output: false


    ### String Operators: Working with Text


    ●     + (Concatenation): Joins two strings together.


    ● += (Concatenation Assignment): Concatenates a string and assigns the result.


    let firstName = "John";


    let lastName = "Doe";


    let fullName = firstName + " " + lastName; // "John Doe"


    fullName += ", the JavaScript enthusiast"; // "John Doe, the JavaScript enthusiast"


    ### Other Operators: A Brief Overview


    JavaScript has many other operators, including:


    ●     Ternary Operator (? :): A shorthand for conditional expressions.


    ● typeof Operator: Returns the data type of a value as a string (e.g., “number,”
    “string,” “boolean”).


    ●     delete Operator: Deletes a property from an object.


    By mastering these operators, you gain the ability to manipulate data, make decisions,
    and control the flow of your JavaScript programs effectively.


    ## Expressions: Putting It All Together


    Expressions are the heart of computation in JavaScript. They are combinations
    of values, variables, and operators that, when evaluated, produce a result. Think
    of them as the sentences of your JavaScript code, each expressing a specific action
    or calculation.


    ### Types of Expressions:


    1.  Arithmetic Expressions: These involve mathematical operations like addition,
    subtraction, multiplication, and division. They work with numbers and produce
    numeric results.


    let sum = 5 + 8; // 13


    let product = price * quantity;


    2.  String Expressions: These manipulate text (strings). The most common operation
    is concatenation, which joins strings together.


    let message = "Hello, " + name + "!";


    let description = `${item.name} costs $${item.price}.`; // Using template literals


    3.  Boolean Expressions: These evaluate to either  true or  false. They often
    use comparison operators (==,  !=, >, <, etc.) or logical operators (&&,  ||,
    !).


    let isEligible = age >= 18 && hasLicense;


    let isValidPassword = password.length >= 8;


    ### How Expressions are Evaluated


    JavaScript evaluates expressions from left to right, following a set of rules
    called operator precedence and associativity.


    ● Operator Precedence: This determines the order in which operators are applied.
    For example, multiplication (*) and division (/) have higher precedence than addition
    (+) and subtraction (-).


    ● Associativity: This determines how operators of the same precedence are grouped.
    Most operators in JavaScript are left-associative, meaning they are evaluated
    from left to right.


    Understanding these rules is crucial for ensuring your expressions are evaluated
    as you intend.


    ### Using Expressions in JavaScript Code


    Expressions are used in many parts of JavaScript code:


    ● Assignments: The right-hand side of an assignment (=) is an expression.


    ●     Function Arguments: Expressions are passed as arguments to functions.


    ● Return Statements: Functions often return the result of an expression.


    ● Control Structures: Boolean expressions are used in  if statements, loops, and
    other control structures to determine program flow.


    ### Example:


    function calculateArea(length, width) {


      return length * width; // Arithmetic expression


    }


    const area = calculateArea(10, 5); // Function call with expressions as arguments


    if (area > 50) { // Boolean expression


      console.log("The area is large.");


    } else {


      console.log("The area is small.");


    }


    In this example, the  calculateArea function takes two arguments (both expressions)
    and returns the result of multiplying them (another expression). The  if statement
    uses a boolean expression to decide which message to print.


    ### Key Takeaway


    Mastering expressions is essential for effectively using JavaScript. They form
    the basis of calculations, decision-making, and data manipulation in your programs.
    Understanding operator precedence and associativity will help you write code that
    behaves as you expect, leading to fewer errors and more reliable applications.


    ## Chapter Summary


    In this chapter, we delved into the fundamental building blocks of JavaScript.
    We explored how variables act as containers for storing and manipulating data,
    emphasizing the importance of choosing appropriate data types like numbers, strings,
    and booleans to represent different kinds of information. We also discussed how
    operators function as the “verbs” of the language, allowing us to perform calculations,
    comparisons, and logical operations. Finally, we learned how expressions combine
    values, variables, and operators to form the core of computation in JavaScript.


    By mastering these concepts, you have laid the groundwork for understanding more
    complex JavaScript structures and algorithms. You are now equipped to write code
    that performs calculations, makes decisions, and interacts with data in meaningful
    ways. As you progress in your JavaScript journey, these building blocks will serve
    as the foundation upon which you construct more sophisticated applications and
    programs.


    Controlling Flow and Logic: Conditional Statements, Loops, and Functions


    #### Outline


    ●     Conditional Statements: Making Decisions in Your Code


    ●     Loops: Repeating Actions Efficiently


    ●     Functions: Organizing and Reusing Code


    ●     Function Declaration vs. Function Expression


    ●     Chapter Summary


