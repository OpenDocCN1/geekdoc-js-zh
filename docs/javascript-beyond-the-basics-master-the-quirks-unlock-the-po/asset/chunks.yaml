    \n### 类属性 (ES6+)：现代感触\n\n虽然与 OOP 原则并非严格相关，ES6 引入了一项名为类属性的功能，允许你直接在类定义中声明属性。\n\n\
    ```javascript\nclass Car {\n  numberOfWheels = 4; // 类属性\n  constructor(brand,\
