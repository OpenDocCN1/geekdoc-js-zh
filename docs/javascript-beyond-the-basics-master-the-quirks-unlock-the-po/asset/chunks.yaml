    \n### 选择正确的方法\n\n函数声明和函数表达式在 JavaScript 中都有其用武之地。这里有一份快速指南：\n\n● **函数声明**：当你想要一种简单、直接的方式来定义命名函数，且该函数可以在定义之前被调用时，请使用它们。\n\
