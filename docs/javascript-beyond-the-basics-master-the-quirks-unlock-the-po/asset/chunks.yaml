    let total = 0;\nfunction addToTotal(value) {\n  total += value; // 修改了外部 total\n\
    \  console.log(total); // 副作用：打印日志\n}\n```\n\n在这个示例中，`add` 是纯的。它始终返回参数之和，没有任何副作用。相比之下，`addToTotal`是非纯的。它修改了外部\
    \ `total` 并打印了日志，这两者都是副作用。\n\n### 为什么纯函数很重要\n\n纯函数为你的代码带来了许多优势：\n\n* **可预测性**：你可以始终依赖函数对于相同的输入给出相同的结果，使得代码更容易推理。\n\
    * **可测试性**：纯函数是测试的梦想。你只需提供输入，就能准确预知输出。\n* **可组合性**：你可以轻松地将纯函数组合在一起创建更复杂的行为。一个函数的输出变成另一个函数的输入，就像积木一样。\n\
    * **并行性**：纯函数天然支持并行执行，因为它们不依赖或修改共享状态。\n\n### 使用纯函数进行推理\n\n假设你有一个函数 `calculatePrice(item,\
    \ quantity)`，用于计算一组物品的总价。如果它是一个纯函数，你就可以放心地用相同的参数调用它，并知道结果总是相同的。这使得调试和推理代码变得更容易，因为你可以隔离函数并验证其行为，而无需担心外部影响。\n\
    \n### 拥抱纯函数\n\n虽然并不是每个函数都能或应该是纯的（例如与用户交互或获取数据的函数），但尽可能追求纯函数可以显著提高你 JavaScript\
    \ 代码的质量。通过保持函数的自包含性并专注于核心职责，你将创建出更可靠、易于测试且易于理解的代码。\n\n"
- fmt: "\nImmutability, in the context of functional programming and JavaScript, means\
    \ treating data as unchangeable. Once you create an object or array, its state\
    \ remains fixed. You can’t modify it directly; instead, you create new objects\
    \ or arrays with the desired modifications.\n\n## Why Immutability Matters\n\n\
    Immutability offers several compelling benefits:\n\n1. **Predictability**: Immutable\
    \ data structures behave consistently throughout your program. You never have\
    \ to worry about a function unexpectedly modifying your data, leading to hidden\
    \ bugs.\n\n2. **Easier Debugging**: Tracking changes in immutable data is straightforward.\
    \ You can compare the old and new versions of an object or array to pinpoint exactly\
    \ what changed.\n\n3. **Simplified State Management**: In applications with complex\
    \ state, immutability simplifies reasoning about how state changes over time.\
    \ It makes it easier to track state transitions and understand how different parts\
    \ of your application interact with the state.\n\n4. **Concurrency Safety**: Immutable\
    \ data is inherently safe for concurrent operations. Multiple parts of your code\
    \ can access and use the same immutable data without the risk of race conditions\
    \ or data corruption.\n\n## Working with Immutability in JavaScript\n\nJavaScript\
    \ doesn’t enforce immutability by default, but you can adopt practices and tools\
    \ to make your data immutable:\n\n1. **The Spread Operator (...) and `Object.assign()`**:\n\
    \n```javascript\nconst originalArray = [1, 2, 3];\n\nconst newArray = [...originalArray,\
    \ 4]; // Add an element without modifying originalArray\n\nconsole.log(originalArray);\
    \ // [1, 2, 3]\n\nconst originalObject = { name: \"Alice\", age: 30 };\n\nconst\
    \ updatedObject = { ...originalObject, age: 31 };\n\nconsole.log(originalObject);\
    \ // { name: \"Alice\", age: 30 }\n```\n\n2. **Array Methods that Return New Arrays**:\n\
    \nMethods like `map`, `filter`, `concat`, and `slice` return new arrays instead\
    \ of modifying the original array.\n\n```javascript\nconst numbers = [1, 2, 3];\n\
    \nconst doubled = numbers.map(x => x * 2); // [2, 4, 6]\n```\n\n3. **Immutable.js\
    \ Library**:\n\nFor more complex scenarios, you can use the `Immutable.js` library,\
    \ which provides a rich set of immutable data structures and functions for working\
    \ with them efficiently.\n\n```javascript\nconst { Map } = require('immutable');\n\
    \nconst map1 = Map({ a: 1, b: 2, c: 3 });\n\nconst map2 = map1.set('b', 50); //\
    \ Returns a new map with the update\n\nconsole.log(map1.get('b')); // 2\n\nconsole.log(map2.get('b'));\
    \ // 50\n```\n\n## A Note of Caution\n\nImmutability can sometimes lead to increased\
    \ memory usage because you’re creating new objects or arrays instead of modifying\
    \ existing ones. However, in most cases, the benefits of immutability outweigh\
    \ this minor drawback.\n\nBy embracing immutability in your JavaScript code, you’ll\
    \ be taking a significant step towards writing cleaner, more reliable, and easier-to-reason-about\
    \ code.\n\n## Currying: Transforming Functions\n\nCurrying is a functional programming\
    \ technique that involves transforming a function that takes multiple arguments\
    \ into a sequence of nested functions, each taking a single argument. It’s like\
    \ slicing a pizza into individual slices instead of eating it whole.\n\n## How\
    \ Currying Works\n\nConsider a function `add(x, y)` that adds two numbers. A curried\
    \ version of this function would look like this:\n\n```javascript\nfunction add(x)\
    \ {\n  return function(y) {\n    return x + y;\n  };\n}\n\nconst add5 = add(5);\
    \ // Returns a new function that adds 5 to its argument\nconsole.log(add5(3));\
    \ // Output: 8\n```\n\nIn this example:\n\n1. `add(x)` is called with the argument\
    \ `5`.\n2. It returns a new function `(y) => x + y` with `x` (the value `5`) captured\
    \ in its closure.\n3. We assign this new function to `add5`.\n4. When we call\
    \ `add5(3)`, it effectively executes `5 + 3` and returns `8`.\n\n## Currying vs.\
    \ Partial Application\n\nCurrying and partial application are related but distinct\
    \ concepts:\n\n- **Currying**: Always transforms a multi-argument function into\
    \ a chain of single-argument functions.\n- **Partial Application**: Can fix some\
    \ arguments of a function, but doesn’t necessarily create a chain of single-argument\
    \ functions.\n\n```javascript\n// Partial Application\nconst add10 = add.bind(null,\
    \ 10); // Fixes the first argument as 10\nconsole.log(add10(7)); // Output: 17\n\
    \n// Currying\nconst addCurried = x => y => x + y;\nconst add3 = addCurried(3);\n\
    console.log(add3(4)); // Output: 7\n```\n\n## Benefits of Currying\n\n- **Flexibility**:\
    \ You can create specialized functions by partially applying arguments.\n- **Composability**:\
    \ Curried functions are easier to compose using higher-order functions.\n- **Readability**:\
    \ The code can be more concise and easier to understand in some cases.\n\n## Practical\
    \ Examples\n\n1. **Logging with Context**:\n\n```javascript\nfunction log(level,\
    \ message) {\n  console.log(`[${level}]: ${message}`);\n}\n\nconst logError =\
    \ log.bind(null, \"ERROR\"); // Partial application\nlogError(\"Something went\
    \ wrong!\");\n```\n\n2. **Function Composition**:\n\n```javascript\nconst compose\
    \ = (f, g) => x => f(g(x));\nconst double = x => x * 2;\nconst square = x => x\
    \ * x;\n\nconst doubleAndSquare = compose(square, double);\nconsole.log(doubleAndSquare(3));\
    \ // (3*2)^2 = 36\n```\n"
  raw: 'Immutability, in the context of functional programming and JavaScript, means
    treating data as unchangeable. Once you create an object or array, its state remains
    fixed. You can’t modify it directly; instead, you create new objects or arrays
    with the desired modifications.


    ### Why Immutability Matters


    Immutability offers several compelling benefits:


    1.  Predictability: Immutable data structures behave consistently throughout your
    program. You never have to worry about a function unexpectedly modifying your
    data, leading to hidden bugs.


    2.  Easier Debugging: Tracking changes in immutable data is straightforward. You
    can compare the old and new versions of an object or array to pinpoint exactly
    what changed.


    3.  Simplified State Management: In applications with complex state, immutability
    simplifies reasoning about how state changes over time. It makes it easier to
    track state transitions and understand how different parts of your application
    interact with the state.


    4.  Concurrency Safety: Immutable data is inherently safe for concurrent operations.
    Multiple parts of your code can access and use the same immutable data without
    the risk of race conditions or data corruption.


    ### Working with Immutability in JavaScript


    JavaScript doesn’t enforce immutability by default, but you can adopt practices
    and tools to make your data immutable:


    1.  The Spread Operator (...) and  Object.assign():


    const originalArray = [1, 2, 3];


    const newArray = [...originalArray, 4]; // Add an element without modifying originalArray


    console.log(originalArray); // [1, 2, 3]


    const originalObject = { name: "Alice", age: 30 };


    const updatedObject = { ...originalObject, age: 31 };


    console.log(originalObject); // { name: "Alice", age: 30 }


    2.  Array Methods that Return New Arrays:


    Methods like  map,  filter,  concat, and  slice return new arrays instead of modifying
    the original array.


    const numbers = [1, 2, 3];


    const doubled = numbers.map(x => x * 2); // [2, 4, 6]


    3.  Immutable.js Library:


    For more complex scenarios, you can use the Immutable.js library, which provides
    a rich set of immutable data structures and functions for working with them efficiently.


    const { Map } = require(''immutable'');


    const map1 = Map({ a: 1, b: 2, c: 3 });


    const map2 = map1.set(''b'', 50); // Returns a new map with the update


    console.log(map1.get(''b'')); // 2


    console.log(map2.get(''b'')); // 50


    ### A Note of Caution


    Immutability can sometimes lead to increased memory usage because you’re creating
    new objects or arrays instead of modifying existing ones. However, in most cases,
    the benefits of immutability outweigh this minor drawback.


    By embracing immutability in your JavaScript code, you’ll be taking a significant
    step towards writing cleaner, more reliable, and easier-to-reason-about code.


    ## Currying: Transforming Functions


    Currying is a functional programming technique that involves transforming a function
    that takes multiple arguments into a sequence of nested functions, each taking
    a single argument. It’s like slicing a pizza into individual slices instead of
    eating it whole.


    ### How Currying Works


    Consider a function  add(x, y) that adds two numbers. A curried version of this
    function would look like this:


    function add(x) {


      return function(y) {


        return x + y;


      };


    }


    const add5 = add(5); // Returns a new function that adds 5 to its argument


    console.log(add5(3)); // Output: 8


    In this example:


    1.  add(x) is called with the argument 5.


    2.  It returns a new function  (y) => x + y with x (the value 5) captured in its
    closure.


    3.  We assign this new function to  add5.


    4.  When we call  add5(3), it effectively executes  5 + 3 and returns 8.


    ### Currying vs. Partial Application


    Currying and partial application are related but distinct concepts:


    ● Currying: Always transforms a multi-argument function into a chain of single-argument
    functions.


    ● Partial Application: Can fix some arguments of a function, but doesn’t necessarily
    create a chain of single-argument functions.


    // Partial Application


    const add10 = add.bind(null, 10); // Fixes the first argument as 10


    console.log(add10(7)); // Output: 17


    // Currying


    const addCurried = x => y => x + y;


    const add3 = addCurried(3);


    console.log(add3(4)); // Output: 7


    ### Benefits of Currying


    ● Flexibility: You can create specialized functions by partially applying arguments.


    ● Composability: Curried functions are easier to compose using higher-order functions.


    ● Readability: The code can be more concise and easier to understand in some cases.


    ### Practical Examples


    1.  Logging with Context:


    function log(level, message) {


      console.log(`[${level}]: ${message}`);


    }


    const logError = log.bind(null, "ERROR"); // Partial application


    logError("Something went wrong!");


    2.  Function Composition:


    const compose = (f, g) => x => f(g(x));


    const double = x => x * 2;


    const square = x => x * x;


    const doubleAndSquare = compose(square, double);


    console.log(doubleAndSquare(3)); // Output: 36 (double(3) = 6, square(6) = 36)


    By understanding currying, you can write more flexible and composable JavaScript
    code. It’s a technique that can be applied in various scenarios to create specialized
    functions and improve the structure of your code.


    ## Composing Functions: Building Blocks for Flexibility


    Function composition is a powerful technique in functional programming that allows
    you to create complex functions by combining simpler functions. It’s like building
    with Lego blocks – you take smaller, reusable functions and snap them together
    to create a larger structure.


    ### The Essence of Function Composition


    The core idea of function composition is to take the output of one function and
    use it as the input to another function. This creates a chain of functions where
    the result of each function flows into the next.


    ### Benefits of Function Composition


    1.  Modularity: Break down complex logic into smaller, manageable functions that
    are easier to understand, test, and maintain.


    2.  Reusability: Each function in the composition can be reused independently
    in other parts of your code.


    3.  Readability: Function composition expresses the flow of data clearly, making
    your code more declarative and self-documenting.


    4.  Testability: Smaller, independent functions are easier to test in isolation.


    ### Composing with Higher-Order Functions


    JavaScript’s built-in higher-order functions like  map,  filter, and  reduce are
    excellent tools for function composition.


    const numbers = [1, 2, 3, 4];


    const doubledAndFiltered = numbers


      .map(x => x * 2)        // [2, 4, 6, 8]


      .filter(x => x > 5);    // [6, 8]


    const sumOfDoubledAndFiltered = doubledAndFiltered.reduce((acc, x) => acc + x,
    0); // 14


    In this example, we compose three functions:  map to double each number,  filter
    to keep only numbers greater than 5, and  reduce to calculate the sum.


    ### The Pipe Operator (Optional)


    In modern JavaScript, you can use the pipe operator (|>) to make function composition
    more visually appealing:


    const result = numbers


      |> double


      |> filter(x => x > 5)


      |> reduce((acc, x) => acc + x, 0);


    This reads as “numbers, then double, then filter, then reduce.” (Note: Pipe operator
    support depends on your JavaScript environment. It’s available in Node.js 16+
    and some browsers.)


    ### Composing with Libraries: Ramda (Example)


    Libraries like Ramda provide utilities like  compose and  pipe to make function
    composition even easier and more powerful.


    const R = require(''ramda'');


    const double = x => x * 2;


    const addOne = x => x + 1;


    const square = x => x * x;


    const transform = R.pipe(double, addOne, square); // Composition with pipe


    console.log(transform(3)); // Output: 49


    ### Key Takeaway'
