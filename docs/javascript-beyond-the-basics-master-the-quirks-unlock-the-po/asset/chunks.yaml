    ## Routing: Navigating Your Application


    In the world of web applications, routing is the GPS that guides users to their
    desired destinations. It’s the mechanism that determines which part of your application
    to display based on the current URL. Just like a road map helps you navigate a
    city, routing helps users explore your web app by associating specific URLs with
    corresponding views or components.


    ### How Routing Works


    Routing involves several key elements:


    1.  URLs: The addresses that users type into their browser to access different
    parts of your application.


    2.  Routes: The definitions that map specific URLs to corresponding views or components.


    3.  Router: The component or module responsible for matching the current URL to
    a defined route and rendering the associated content.


    When a user clicks a link or types a URL into the browser, the router intercepts
    the request, checks the URL, and determines which view or component to display.
    This process allows users to navigate seamlessly between different sections of
    your application.


    ### Types of Routing


    There are two main types of routing in JavaScript:


    1.  Hash-Based Routing: This older method uses the hash fragment (#) in the URL
    to manage routing. For example,  http://mywebsite.com/#/about might display the
    “About” page. Hash-based routing is simple to implement but has some limitations,
    such as less clean URLs and potential issues with browser history.


    2.  History API Routing: This newer method leverages the HTML5 History API, which
    provides a cleaner and more robust way to manage routing. URLs look more natural
    (e.g.,  http://mywebsite.com/about), and you can use the browser’s back and forward
    buttons seamlessly. However, it requires server-side configuration to handle initial
    page loads correctly.


    ### Building a Simple Router


    You can create a basic router in your framework using conditional statements and
    event listeners:


    const routes = {


      "/": homeComponent,


      "/about": aboutComponent,


      "/contact": contactComponent


    };


    function navigate(path) {


      if (routes[path]) {


        const component = routes[path];


        // ... (code to render the component) ...


      } else {


        // ... (handle 404 Not Found errors) ...


      }


    }


    window.addEventListener("popstate", () => {


      navigate(window.location.pathname);


    });


    In this example:


    1.  routes is an object that maps URLs to components.


    2.  navigate is a function that renders the appropriate component based on the  path.


    3.  An event listener is added to the  popstate event, which is triggered when
    the user navigates using the browser’s back or forward buttons. This calls  navigate
    to update the view accordingly.


    ### Evolving Your Router


    This is a very simplified example. As your framework grows, you’ll likely need
    to add more features to your router, such as:


    ● Route Parameters: To capture dynamic values within URLs (e.g.,  /users/123).


    ●     Nested Routes: To support hierarchical navigation structures.


    ● Guards: To control access to certain routes based on user authentication or
    permissions.


    ● Transitions and Animations: To create smooth visual transitions between views.


    However, even with these basic building blocks, you can start creating a functional
    routing system within your custom framework.


    ## Components: Building Blocks of the UI


    Components are the fundamental building blocks of modern web applications. They
    encapsulate the structure, logic, and styling of specific parts of the user interface,
    making them reusable and easier to maintain. By promoting modularity, components
    enable developers to break down complex UIs into manageable, self-contained pieces.
    This approach enhances the development process by allowing individual components
    to be developed, tested, and debugged independently.


    ### Types of Components


    In JavaScript frameworks like React, components can be broadly classified into
    two types:


    1.  Functional Components: These are simpler and primarily concerned with rendering
    the UI. They are written as JavaScript functions and can accept props (properties)
    to customize their output. With the introduction of React Hooks, functional components
    can also manage state and side effects, making them even more powerful.


    2.  Class Components: These components are ES6 classes that extend from  React.Component.
    They can hold and manage their state and lifecycle methods, providing more control
    over the component’s behavior and rendering.


