  trans: "\n闭包（Closures）是 JavaScript 中封装的关键机制。它们允许你在函数内部创建私有变量和方法，有效地将它们与外部世界隔离开。内部函数成为访问和操作这些私有值的唯一途径。\n\
    \n### 示例：私有计数器\n\n```javascript\nfunction createCounter() {\n  let count = 0;\
    \ // 私有变量\n  return {\n    increment: function() {\n      count++;\n    },\n \
    \   get: function() {\n      return count;\n    }\n  };\n}\n\nconst counter =\
    \ createCounter();\ncounter.increment();\ncounter.increment();\nconsole.log(counter.get());\
    \ // 输出: 2\nconsole.log(count);        // 错误！'count' 未定义（它是私私的）\n```\n\n在此示例中：\n\
    1. `createCounter` 函数定义了一个私有变量 `count`。\n2. 它返回一个包含两个方法的对象：`increment`（增加计数）和\
    \ `get`（获取当前计数）。\n3. 返回的对象作为计数器的公共接口。\n4. `count` 变量无法从闭包外部访问，确保了它的私有性并防止了意外更改。\n\
    \n这种模式常用于创建带有私有数据和方法的模块、库或对象。有助于维护数据的完整性，防止意外修改，并为你的代码创建一个更受控、可预测的环境。\n\n### 2.\
    \ 事件处理器中的状态保留\n\n在 Web 应用的动态世界中，事件处理器对于响应点击、悬停和表提交等用户交互至关重要。通常，这些事件处理器需要记住事件绑定时的变量状态，而不仅仅是执行时的当前状态。这就是闭包变得不可或缺的地方。\n\
    \n#### 挑战：变化的变量\n\n考虑以下场景：你有一组由 JavaScript 动态生成的按钮。每个按钮在被点击时应该显示其唯一标识符。一种简单的方法可能如下：\n\
    \n```javascript\nfor (let i = 0; i < 5; i++) {\n  let button = document.createElement(\"\
    button\");\n  button.textContent = \"Button \" + i;\n  button.addEventListener(\"\
    click\", function() {\n    console.log(\"Button \" + i + \" clicked!\"); // 问题：'i'\
    \ 将始终为 5\n  });\n  document.body.appendChild(button);\n}\n```\n\n然而，这段代码并不会按预期工作。当按钮被点击时，它总是记录“Button\
    \ 5 clicked!”。为什么？因为事件处理器函数在循环完成后运行，而此时所有按钮的 `i` 值都是 5。\n\n#### 闭包：保留状态\n\n解决方案是使用闭包。闭包允许事件处理器函数“记住”绑定监听器时\
    \ `i` 的值。\n\n```javascript\nfor (let i = 0; i < 5; i++) {\n  let button = document.createElement(\"\
    button\");\n  button.textContent = \"Button \" + i;\n  button.addEventListener(\"\
    click\", (function(index) { // 使用 IIFE 创建闭包\n    return function() {\n      console.log(\"\
    Button \" + index + \" clicked!\"); // 'index' 被保留\n    };\n  })(i)); // 立即将 'i'\
    \ 传递给 IIFE\n  document.body.appendChild(button);\n}\n```\n\n在这个改进的版本中：\n1. 我们使用立即调用函数表达式（IIFE）为每个按钮创建一个新的作用域。\n\
    2. IIFE 将 `i` 作为参数（现在称为 `index`）。\n3. 它返回一个新函数（事件处理器），该函数可以访问 IIFE 作用域中的 `index`\
    \ 变量。\n4. 当按钮被点击时，感谢闭包，事件处理器使用了正确的 `index` 值。\n\n#### 闭包作为时间胶囊\n\n将闭包想象成时间胶囊。它捕捉了特定时刻变量的状态，确保即使周围的环境发生，这些值也会被保留。这使得闭包在事件处理中非常有价值，因为你需要维护触发回调的事件上下文。\n\
    \n#### 不止按钮：更多应用\n\n闭包不仅用于按钮。每当你需要函数记住周围的状态时，它们都是必不可少的，例如：\n- 定时器（`setTimeout`,\
    \ `setInterval`）：定时器中的回调可以使用闭包跟踪时间或在节答之间维护状态。\n- 异步操作：AJAX 请求或 Promise 解析的回调可以使用闭包访问来自原始请求上下文的数据。\n\
    - 偏函数应用与柯里化：闭包实现了这些函数式编程技术，函数可以返回预填充了某些参数的特化版本。\n\n通过理解闭包的工作原理以及它们如何保留状态，你可以编写出更健壮、可靠的事件处理器，并充分利用\
    \ JavaScript 异步编程的威力。\n\n### 3. 偏函数应用与柯里化\n\n闭包不仅关于私有性和状态；它们还实现了强大的函数式编程技术：偏函数应用（Partial\
    \ Application）和柯里化（Currying）。这些技术允许你创建函数的特化版本，增强代码的可重用性和灵活性。\n\n#### 偏函数应用：固定参数\n\
    \n偏函数应用通过固定现有函数的某些参数来创建一个新函数。返回的函数接收剩余参数，并组合所有参数调用原始函数。\n\n```javascript\nfunction\
    \ greet(greeting, name) {\n  console.log(greeting + \", \" + name + \"!\");\n\
    }\n\nconst sayHelloTo = greet.bind(null, \"Hello\"); // 固定参数 'Hello' 的偏函数应用\n\
    sayHelloTo(\"Alice\"); // 输出: \"Hello, Alice!\"\nsayHelloTo(\"Bob\");    // 输出:\
    \ \"Hello, Bob!\"\n```\n\n在这里，`greet.bind(null, \"Hello\")` 创建了一个新函数 `sayHelloTo`，其\
    \ `greeting` 参数固定为“Hello”。该新函数接收一个参数（name），并结合两个参数调用原始 `greet` 函数。\n\n#### 柯里化：函数链式调用\n\
    \n柯里化比偏函数应用更进一步。它将一个具有多个参数的函数转换为一系列嵌套函数，每个函数只接收一个参数。当所有参数都到位时，链中的最后一个函数将被执行。\n\
    \n```javascript\nfunction curryGreet(greeting) {\n  return function(name) {\n\
    \    console.log(greeting + \", \" + name + \"!\");\n  };\n}\n\nconst sayHello\
    \ = curryGreet(\"Hello\");\nsayHello(\"Alice\"); // 输出: \"Hello, Alice!\"\n\n\
    const sayHi = curryGreet(\"Hi\");\nsayHi(\"Bob\"); // 输出: \"Hi, Bob!\"\n```\n\n\
    在这里，`curryGreet` 接收 `greeting` 参数并返回一个接收 `name` 参数的。通过调用 `curryGreet(\"Hello\"\
    )`，我们得到了特化函数 `sayHello`，它始终使用“Hello”作为问候。\n\n#### 闭包的作用\n\n偏函数应用和柯里化都依赖于闭包。这些技术返回的函数形成了闭包，捕捉了传递给原始函数的参数值。这让你无需重复传递相同的参数即可创建特化函数。\n\
    \n#### 偏函数应用与柯里化的优势\n\n- 灵活性：你可以随时创建函数的变体，以适应特定需求。\n- 可重用性：通过对参数进行偏应用或柯里化，可以将同一个函数用于不同的任务。\n\
    - 组合：你可以通过这些技术组合简单的函数来创建复杂的函数。\n\n通过理解偏函数应用和柯里化，你将能够编写出更简洁、丰富且适应性强的代码，充分利用 JavaScript\
    \ 函数式编程的威力。\n\n### 4. 模块模式\n\n模块模式是 JavaScript 中一种经久的设计模式，允许你创建模块化和封装的代码。它利用闭包为变量和函数提供私有性，只暴露精心控制的公共接口。这种模式对于构建可维护和可扩展的应用至关重要。\n\
    \n#### 什么是模块？\n\n"
- fmt: "\nIn the context of JavaScript, a module is a self-contained unit of code\
    \ that encapsulates related functionality. It has its own private data and functions,\
    \ which are hidden from the outside world, and it exposes a public API that other\
    \ parts of your code can interact with.\n\n### The Role of Closures\n\nClosures\
    \ play a crucial role in the module pattern. They allow you to define private\
    \ variables and functions within a module, which can only be accessed and modified\
    \ from within the module itself. The public API, on the other hand, is returned\
    \ as a function or an object, and it can access and manipulate the private data\
    \ through closures.\n\n### Example: A Shopping Cart Module\n\nLet’s see how to\
    \ create a reusable shopping cart module using the module pattern:\n\n```javascript\n\
    const shoppingCartModule = (function() {\n  let items = [];\n\n  function addItem(item)\
    \ {\n    items.push(item);\n  }\n  function removeItem(item) {\n    const index\
    \ = items.indexOf(item);\n    if (index > -1) {\n      items.splice(index, 1);\n\
    \    }\n  }\n  function getTotal() {\n    return items.reduce((total, item) =>\
    \ total + item.price, 0);\n  }\n  return {\n    addItem: addItem,\n    removeItem:\
    \ removeItem,\n    getTotal: getTotal\n  };\n})();\n\nshoppingCartModule.addItem({\
    \ name: \"Laptop\", price: 999.99 });\nshoppingCartModule.addItem({ name: \"Smartphone\"\
    , price: 599.99 });\nconsole.log(shoppingCartModule.getTotal()); // Output: 1599.98\n\
    ```\n\nIn this module:\n- `items` is a private array that stores the cart items.\n\
    - `addItem`, `removeItem`, and `getTotal` are private functions for manipulating\
    \ the cart.\n- The returned object provides the public API, consisting of references\
    \ to these private functions.\n\n### Advantages of the Module Pattern\n\n- Encapsulation:\
    \ Protects private data and functions from external interference.\n- Reusability:\
    \ Modules can be used in multiple parts of your application or even in different\
    \ projects.\n- Organization: Code is structured into logical units, improving\
    \ maintainability.\n- Global Namespace Protection: Prevents accidental pollution\
    \ of the global namespace.\n\n### Modern Alternatives: ES Modules\n\nWhile the\
    \ module pattern has been a staple in JavaScript for a long time, ES6 (ECMAScript\
    \ 2015) introduced a standardized module system. ES modules offer a more concise\
    \ and structured way to define and consume modules, but they rely on modern JavaScript\
    \ environments that support them.\n\nBy understanding the module pattern, you’ll\
    \ gain a deeper understanding of JavaScript’s modularity and how closures can\
    \ be leveraged to create encapsulated, reusable, and maintainable code. This pattern\
    \ remains relevant even with the introduction of ES modules, as it can be used\
    \ in environments that don’t yet fully support the new module system.\n\n## Chapter\
    \ Summary\n\nIn this chapter, we explored the remarkable power of closures in\
    \ JavaScript. We learned how closures allow functions to retain access to variables\
    \ from their surrounding scope, even after the outer functions have completed.\
    \ This unique ability, made possible by lexical scoping, opens doors to a wide\
    \ range of practical applications.\n\nWe delved into how closures enable data\
    \ encapsulation and privacy, allowing you to create modules with hidden variables\
    \ and functions, accessible only through a controlled public interface. We also\
    \ saw how closures are essential for preserving state in event handlers, ensuring\
    \ that callback functions have access to the correct values even when variables\
    \ change over time.\n\nMoreover, we discovered how closures underpin functional\
    \ programming techniques like partial application and currying, enabling the creation\
    \ of more specialized and reusable functions. Finally, we examined the classic\
    \ module pattern, a powerful design pattern that leverages closures to create\
    \ encapsulated, reusable modules.\n\nBy mastering closures, you’ve added a valuable\
    \ tool to your JavaScript skillset. You can now write more expressive, modular,\
    \ and maintainable code, effectively manage state in asynchronous operations,\
    \ and build more complex applications with confidence.\n\n# Closures in Practice:\
    \ Modules, Private Variables, and Event Handling\n\n### Outline\n- Modules: Building\
    \ Blocks with Closures\n- Private Variables: Keeping Secrets with Closures\n-\
    \ Event Handling: Closures and Persistent State\n- Common Closure Pitfalls: Memory\
    \ Leaks and `this`\n- Chapter Summary\n\n***\n\n### Modules: Building Blocks with\
    \ Closures\n\nIn the world of software development, modularity is key to creating\
    \ well-structured, maintainable, and scalable applications. JavaScript, traditionally\
    \ a language without built-in modules, found a clever workaround using closures:\
    \ the Module Pattern.\n\n### What Makes a Module?\n\nA module is a self-contained\
    \ unit of code that encapsulates specific functionality. Think of it as a black\
    \ box with a well-defined interface. It hides its inner workings (private members)\
    \ and exposes only what’s necessary for the outside world to interact with (public\
    \ API).\n\n### Closures as Encapsulation Engines\n\nClosures are the secret sauce\
    \ that makes modules possible in JavaScript. By leveraging closures, you can create\
    \ private variables and functions within a module, shielding them from external\
    \ access. Only the public API, which typically consists of functions or objects\
    \ returned by the module, can interact with these private members.\n\n### The\
    \ Module Pattern: A Classic Solution\n\nThe Module Pattern is a widely used approach\
    \ to create modules in JavaScript. It involves wrapping the module’s code in an\
    \ Immediately Invoked Function Expression (IIFE), creating a closure that encapsulates\
    \ the members.\n\n```javascript\nconst counterModule = (function() {\n  let count\
    \ = 0; // Private variable\n\n  function increment() {\n    count++;\n  }\n  function\
    \ decrement() {\n    count--;\n  }\n  function getValue() {\n    return count;\n\
    \  }\n  return {\n    increment: increment,\n    decrement: decrement,\n    getValue:\
    \ getValue\n  };\n})();\n```\n\nIn this example:\n1. The IIFE `(function() { ...\
    \ })()` creates a new scope, forming a closure.\n2. Inside the closure, `count`\
    \ is a private variable, inaccessible from the outside.\n3. `increment`, `decrement`,\
    \ and `getValue` are private functions that operate on `count`.\n4. The IIFE returns\
    \ an object containing the `increment`, `decrement`, and `getValue` functions.\
    \ This object becomes the module’s public API.\n\nNow, you can interact with the\
    \ counter module through its public API:\n\n```javascript\ncounterModule.increment();\n\
    counterModule.increment();\nconsole.log(counterModule.getValue()); // Output:\
    \ 2\n\ncounterModule.decrement();\nconsole.log(counterModule.getValue()); // Output:\
    \ 1\n```\n\nYou cannot access `count` directly:\n\n```javascript\nconsole.log(counterModule.count);\
    \ // Output: undefined\n```\n"
  raw: 'In the context of JavaScript, a module is a self-contained unit of code that
    encapsulates related functionality. It has its own private data and functions,
    which are hidden from the outside world, and it exposes a public API that other
    parts of your code can interact with.


    #### The Role of Closures


    Closures play a crucial role in the module pattern. They allow you to define private
    variables and functions within a module, which can only be accessed and modified
    from within the module itself. The public API, on the other hand, is returned
    as a function or an object, and it can access and manipulate the private data
    through closures.


    #### Example: A Shopping Cart Module


    Let’s see how to create a reusable shopping cart module using the module pattern:


    const shoppingCartModule = (function() {


      let items = [];


      function addItem(item) {


        items.push(item);


      }


      function removeItem(item) {


        const index = items.indexOf(item);


        if (index > -1) {


          items.splice(index, 1);


        }


      }


      function getTotal() {


        return items.reduce((total, item) => total + item.price, 0);


      }


      return {


        addItem: addItem,


        removeItem: removeItem,


        getTotal: getTotal


      };


    })();


    shoppingCartModule.addItem({ name: "Laptop", price: 999.99 });


    shoppingCartModule.addItem({ name: "Smartphone", price: 599.99 });


    console.log(shoppingCartModule.getTotal()); // Output: 1599.98


    In this module:


    ● items is a private array that stores the cart items.


    ● addItem,  removeItem, and  getTotal are private functions for manipulating the
    cart.


    ● The returned object provides the public API, consisting of references to these
    private functions.


    #### Advantages of the Module Pattern


    ●     Encapsulation: Protects private data and functions from external interference.


    ● Reusability: Modules can be used in multiple parts of your application or even
    in different projects.


    ●     Organization: Code is structured into logical units, improving maintainability.


    ● Global Namespace Protection: Prevents accidental pollution of the global namespace.


    #### Modern Alternatives: ES Modules


    While the module pattern has been a staple in JavaScript for a long time, ES6
    (ECMAScript 2015) introduced a standardized module system. ES modules offer a
    more concise and structured way to define and consume modules, but they rely on
    modern JavaScript environments that support them.


    By understanding the module pattern, you’ll gain a deeper understanding of JavaScript’s
    modularity and how closures can be leveraged to create encapsulated, reusable,
    and maintainable code. This pattern remains relevant even with the introduction
    of ES modules, as it can be used in environments that don’t yet fully support
    the new module system.


    ## Chapter Summary


    In this chapter, we explored the remarkable power of closures in JavaScript. We
    learned how closures allow functions to retain access to variables from their
    surrounding scope, even after the outer functions have completed. This unique
    ability, made possible by lexical scoping, opens doors to a wide range of practical
    applications.


    We delved into how closures enable data encapsulation and privacy, allowing you
    to create modules with hidden variables and functions, accessible only through
    a controlled public interface. We also saw how closures are essential for preserving
    state in event handlers, ensuring that callback functions have access to the correct
    values even when variables change over time.


    Moreover, we discovered how closures underpin functional programming techniques
    like partial application and currying, enabling the creation of more specialized
    and reusable functions. Finally, we examined the classic module pattern, a powerful
    design pattern that leverages closures to create encapsulated, reusable modules.


    By mastering closures, you’ve added a valuable tool to your JavaScript skillset.
    You can now write more expressive, modular, and maintainable code, effectively
    manage state in asynchronous operations, and build more complex applications with
    confidence.


    # Closures in Practice: Modules, Private Variables, and Event Handling


    #### Outline


    ●     Modules: Building Blocks with Closures


    ●     Private Variables: Keeping Secrets with Closures


    ●     Event Handling: Closures and Persistent State


    ●     Common Closure Pitfalls: Memory Leaks and  this


    ●     Chapter Summary


    * * *


    Modules: Building Blocks with Closures


    In the world of software development, modularity is key to creating well-structured,
    maintainable, and scalable applications. JavaScript, traditionally a language
    without built-in modules, found a clever workaround using closures: the Module
    Pattern.


    ### What Makes a Module?


    A module is a self-contained unit of code that encapsulates specific functionality.
    Think of it as a black box with a well-defined interface. It hides its inner workings
    (private members) and exposes only what’s necessary for the outside world to interact
    with (public API).


    ### Closures as Encapsulation Engines


    Closures are the secret sauce that makes modules possible in JavaScript. By leveraging
    closures, you can create private variables and functions within a module, shielding
    them from external access. Only the public API, which typically consists of functions
    or objects returned by the module, can interact with these private members.


    ### The Module Pattern: A Classic Solution


    The Module Pattern is a widely used approach to create modules in JavaScript.
    It involves wrapping the module’s code in an Immediately Invoked Function Expression
    (IIFE), creating a closure that encapsulates the private members.


    const counterModule = (function() {


      let count = 0; // Private variable


      function increment() {


        count++;


      }


      function decrement() {


        count--;


      }


      function getValue() {


        return count;


      }


      return {


        increment: increment,


        decrement: decrement,


        getValue: getValue


      };


    })();


    In this example:


    1.  The IIFE ((function() { ... })()) creates a new scope, forming a closure.


    2.  Inside the closure,  count is a private variable, inaccessible from the outside.


    3.  increment,  decrement, and  getValue are private functions that operate on  count.


    4.  The IIFE returns an object containing references to the  increment,  decrement,
    and  getValue functions. This object becomes the module’s public API.


    Now, you can interact with the counter module through its public API:


    counterModule.increment();


    counterModule.increment();


    console.log(counterModule.getValue()); // Output: 2


    counterModule.decrement();


    console.log(counterModule.getValue()); // Output: 1


    You cannot access  count directly:


    console.log(counterModule.count); // Output: undefined


    ### Advantages of the Module Pattern


    ● Encapsulation: Private data and functions are protected, preventing accidental
    modification and promoting maintainability.


    ● Reusability: Modules can be used in multiple parts of your application or even
    shared across projects.


    ● Namespace Management: Modules help avoid naming collisions with other global
    variables or functions.


    ● Clear Separation of Concerns: Modules focus on specific tasks, leading to cleaner
    and more organized code.


    The Module Pattern is a powerful tool in your JavaScript arsenal. By harnessing
    the power of closures, it empowers you to build modular, reusable, and well-structured
    code that scales gracefully as your projects grow. While modern JavaScript offers
    native modules (ES modules), understanding the Module Pattern deepens your grasp
    of closures and their practical applications.


    ## Private Variables: Keeping Secrets with Closures


    In JavaScript, the concept of truly private variables doesn’t exist in the same
    way it does in languages like Java or C++. However, closures provide a clever
    workaround, allowing you to create variables that are effectively hidden from
    the outside world. This technique is essential for building robust and maintainable
    code.


    ### The Power of Data Hiding'
