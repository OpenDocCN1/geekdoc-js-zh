  trans: "\n\n在本章中，我们开启了一段驯服 JavaScript 中难以捉摸 `this` 关键字的旅程。我们首先理解了它的动态性质，以及它的值是如何由函数调用的上下文决定的。接着，我们探索了管理\
    \ `this` 的四个绑定规则：默认绑定、隐式绑定、显式绑定和 new 绑定。在途中，我们发现了一些可能导致错误的常见陷阱，例如在回调和嵌套函数中丢失 `this`。\n\
    \n到目前，你应该已经牢牢掌握了 `this` 在不同场景下的工作原理以及你可以用来控制其行为的策略。记住，掌握 `this` 需要理解函数调用的上下文，并选择合适的绑定方法。通过实践和对上下文的敏锐观察，你将能够从容地运用\
    \ JavaScript 这一强大又奇诡的特性，编写出更清晰、更可靠、更灵活的代码。\n\n# 第二部分：对象：JavaScript 的核心\n\n## 对象基础：创建、访问和操作对象\n\
    \n### 纲\n- 理解 JavaScript 中的对象\n- 创建对象\n- 访问对象属性\n- 修改对象\n- 常见对象方法\n- 章节总结\n\n\
    ***\n\n## 理解 JavaScript 中的对象\n\n对象是 JavaScript 的核心。它们是表示结构化数据的主要方式，也是构建复杂应用的基础。本质上，对象是键值对（key-value\
    \ pairs）的集合。每个键都是字符串（或者较少见的 symbol），而每个值可以是任何内容：数字、字符串、布尔值、另一个对象，甚至是函数。\n\n将对象想象成一个带有标签隔间的容器。每个隔间都有一个标签（键）和存储在内部的内容（值）。你可以使用这些标签来访问和操作每个隔间的内容。\n\
    \n### 作为真实世界模型的对象\n对象之所以特别强大，是因为它们允许你在代码中模拟现实世界的实体和概念。例如，考虑一个 `person` 对象：\n\n\
    ```javascript\nconst person = {\n  firstName: \"John\",\n  lastName: \"Doe\",\n\
    \  age: 30,\n  occupation: \"Engineer\",\n  hobbies: [\"reading\", \"coding\"\
    , \"hiking\"]\n};\n```\n\n这个对象代表了一个具有各种属性的人，如姓名、年龄、职业和爱好。每个属性都是一个键值对。键是如 `firstName`、`lastName`\
    \ 等字符串，值是与每个属性相关的对应数据。\n\n### 超越简单数据：对象与功能\n对象也可以包含函数，在对象的上下文中这些函数被称为方法（methods）。方法允许对象执行操作或表现行为。\n\
    \n```javascript\nconst car = {\n  brand: \"Toyota\",\n  model: \"Camry\",\n  startEngine()\
    \ {\n    console.log(\"Engine started!\");\n  },\n  accelerate() {\n    console.log(\"\
    Vroom!\");\n  }\n};\n```\n\n在这个示例中，`car` 对象拥有 `startEngine()` 和 `accelerate()`\
    \ 等方法，代表了汽车可以执行的操作。\n\n### 对象与复杂数据结构\n对象不仅限于表示简单的实体。你可以通过在对象中嵌套对象来创建复杂的数据结构。例如，你可以有一个代表\
    \ `library` 的对象，它包含一个 `book` 对象数组，每个对象都有自己的属性，如 `title`、`author` 和 `genre`。\n\n\
    ```javascript\nconst library = {\n  name: \"City Library\",\n  address: \"123\
    \ Main Street\",\n  books: [\n    { title: \"The Hitchhiker's Guide to the Galaxy\"\
    , author: \"Douglas Adams\" },\n    { title: \"Pride and Prejudice\", author:\
    \ \"Jane Austen\" }\n    // ...more books\n  ]\n};\n```\n\n通过这种方式，对象为 JavaScript\
    \ 中组织和结构化数据提供了一种灵活且直观的方法。它们是语言的基石，用于从简单的数据存储到创建复杂应用和框架的一切。通过掌握对象，你将为构建复杂的 JavaScript\
    \ 程序开启一个可能的世界。\n\n## 创建对象\n\nJavaScript 中创建对象的不同方式：\n\n### 1. 对象字面量符号 (Object\
    \ Literal Notation)\n对象字面量符号是 JavaScript 中创建对象最简单、最常用的方法。它是一种简洁且直观的方式，可以直接在代码中定义对象的结构。\n\
    \n#### 语法：大括号和键值对\n对象字面量的语法非常直观：\n\n```javascript\nconst myObject = {\n  key1:\
    \ value1,\n  key2: value2,\n  // ...more key-value pairs\n};\n```\n\n对象被包裹在大括号\
    \ `{}` 之中。在大括号内部，你定义了键值对，并用逗号隔开。每个键值对代表对象的一个属性：\n- 键（Key）：作为属性名的字符串（或 symbol）。\n\
    - 值（Value）：与属性相关的数据。值可以是任何数据类型，包括数字、字符串、布尔值、数组、函数，甚至是其他对象。\n\n#### 示例：赋予对象生命\n\
    让我们使用对象字面量符号创建一些对象：\n\n```javascript\n// 具有属性的简单对象\nconst person = {\n  firstName:\
    \ \"Alice\",\n  lastName: \"Johnson\",\n  age: 30\n};\n\n// 具有属性和方法的对象\nconst\
    \ dog = {\n  name: \"Max\",\n  breed: \"Golden Retriever\",\n  bark: function()\
    \ {\n    console.log(\"Woof!\");\n  }\n};\n\n// 具有嵌套对象的对象\nconst student = {\n\
    \  name: \"Emily\",\n  grades: {\n    math: 90,\n    science: 85,\n    english:\
    \ 92\n  }\n};\n```\n\n在 `person` 对象中，我们拥有代表人的名、姓和年龄的属性。`dog` 对象拥有 `name` 和 `breed`\
    \ 属性，还有一个 `bark` 方法输出 \"Woof!\"。最后，`student` 对象展示了如何嵌套对象。\n\n#### 访问和使用对象属性\n\
    一旦你创建了对象，就可以使用点符号或中括号符号来访问它的属性：\n\n```javascript\nconsole.log(person.firstName);\
    \ // Output: \"Alice\"\nconsole.log(dog[\"breed\"]); // Output: \"Golden Retriever\"\
    \nconsole.log(student.grades.math); // Output: 90\ndog.bark(); // Output: \"Woof!\"\
    \n```\n\n对象字面量符号是 JavaScript 创建对象的根本工具。它的简单性和活性使其适用于表示各种数据结构。\n\n### 2. 构造函数 (Constructor\
    \ Functions)\n构造函数提供了一种类似于蓝图的对象创建方法。它们定义了对象的模板，允许你创建多个具有相同结构的对象实例。\n\n#### 定义构造函数\n\
    构造函数是一个普通的 JavaScript 函数，遵循一些约定：\n1. **命名**：构造函数的名称习惯用大字母开头（例如 `Person`、`Car`、`Book`）。这有助于将其区别于普通函数。\n\
    2. **this 关键字**：在构造函数内部，`this` 关键字指向新创建的对象实例。你使用 `this` 为对象分配属性和方法。\n\n```javascript\n\
    function Person(firstName, lastName, age) {\n  this.firstName = firstName;\n \
    \ this.lastName = lastName;\n  this.age = age;\n  this.greet = function() {\n\
    \    console.log(`Hello, my name is ${this.firstName} ${this.lastName}.`);\n \
    \ };\n}\n```\n\n在这个示例中，`Person` 是一个接受三个参数（`firstName`、`lastName` 和 `age`）的构造函数。它使用\
    \ `this` 将这些值赋值为新对象的属性。它还定义了一个打印信息的 `greet` 方法。\n\n#### 使用 new 创建对象实例\n要从构造函数创建对象实例，可以使用\
    \ `new` 关键字：\n\n```javascript\nconst john = new Person(\"John\", \"Doe\", 30);\n\
    const jane = new Person(\"Jane\", \"Smith\", 25);\n\nconsole.log(john.firstName);\
    \ // Output: \"John\"\njohn.greet(); // Output: \"Hello, my name is John Doe.\"\
    \n```\n\n在这里，`john` 和 `jane` 是 `Person` 对象的两个独立实例，每个实例都有自己的属性集和 `greet` 方法。\n\n"
- fmt: "\n```javascript\nconsole.log(jane.lastName); // Output: \"Smith\"\njane.greet();\
    \ // Output: \"Hello, my name is Jane Smith.\"\n```\n\n## Advantages of Constructor\
    \ Functions\n\nConstructor functions are a powerful tool for creating objects\
    \ in JavaScript. They offer a structured way to define object templates and instantiate\
    \ multiple objects with similar properties and behaviors.\n\n- **Code Reusability**:\
    \ Constructor functions avoid repetitive code for creating similar objects.\n\
    - **Customizable Initialization**: You can pass arguments to the constructor function\
    \ to customize the initial state of each object instance.\n- **Methods**: You\
    \ can define methods within the constructor function, giving each object instance\
    \ its own behavior.\n\n## 3. Object.create() Method:\n\nWhile constructor functions\
    \ are a common way to create objects, JavaScript offers a more direct way to control\
    \ inheritance through the `Object.create()` method. This method allows you to\
    \ explicitly specify the prototype of a new object, giving you greater control\
    \ over the inheritance chain.\n\n### Understanding Object.create()\n\nThe `Object.create()`\
    \ method takes two arguments:\n\n1. `prototype` (Required): The object that should\
    \ serve as the prototype for the newly created object.\n2. `propertiesObject`\
    \ (Optional): An object that defines additional properties to add to the new object.\n\
    \n```javascript\nconst animal = {\n  eat() {\n    console.log(\"Yum!\");\n  }\n\
    };\n\nconst dog = Object.create(animal);\n```\n\nIn this example, `dog` is created\
    \ with `animal` as its prototype. This means `dog` will inherit the `eat()` method\
    \ from `animal`.\n\n### Prototypal Inheritance with Object.create()\n\n`Object.create()`\
    \ provides a clear way to establish inheritance relationships between objects.\
    \ The new object inherits properties and methods from its specified prototype,\
    \ forming a prototype chain.\n\n```javascript\nconsole.log(dog.eat); // Output:\
    \ ƒ eat() { console.log(\"Yum!\"); }\ndog.eat(); // Output: \"Yum!\"\n```\n\n\
    You can also add properties to the newly created object using the second argument:\n\
    \n```javascript\nconst myDog = Object.create(animal, {\n  name: { value: \"Fido\"\
    \ },\n  breed: { value: \"Golden Retriever\" }\n});\n```\n\n### Advantages of\
    \ Object.create()\n\n- **Explicit Prototypal Inheritance**: `Object.create()`\
    \ makes the inheritance relationship explicit, leading to more readable code.\n\
    - **Flexible Prototypes**: You can use any object as the prototype, not just constructor\
    \ functions. This allows for greater flexibility in designing object hierarchies.\n\
    - **No Automatic Properties**: Unlike constructor functions, `Object.create()`\
    \ doesn’t add any extra properties to the new object (like `constructor`).\n\n\
    ### Use Cases for Object.create()\n\n- **Pure Inheritance**: When you want to\
    \ create objects without the need for constructor functions.\n- **Custom Object\
    \ Creation**: When you need fine-grained control over the prototype of a new object.\n\
    - **Performance Optimization**: In some cases, `Object.create()` can be more efficient\
    \ than using constructor functions, especially when dealing with large object\
    \ hierarchies.\n\n## 4. Class Syntax (ES6+)\n\nIn modern JavaScript (ES6 and later),\
    \ you can use class syntax to define objects. While classes provide a more familiar\
    \ structure for developers coming from object-oriented languages, it’s important\
    \ to understand that they are essentially “syntactic sugar” over prototypal inheritance\
    \ model we’ve discussed.\n\n### Introducing Classes\n\nClasses offer a cleaner\
    \ and more organized way to define objects and their behaviors. They use the `class`\
    \ keyword, followed by the class name, curly braces `{}`, and the class body.\n\
    \n```javascript\nclass Person {\n  constructor(firstName, lastName, age) {\n \
    \   this.firstName = firstName;\n    this.lastName = lastName;\n    this.age =\
    \ age;\n  }\n\n  greet() {\n    console.log(`Hello, my name is ${this.firstName}\
    \ ${this.lastName}.`);\n  }\n}\n```\n\nIn this example, `Person` is a class. The\
    \ `constructor` method initializes the object’s properties when a new instance\
    \ is created. The `greet` method is a function attached to the prototype, which\
    \ all instances of `Person` will inherit.\n\n### Creating Instances with the new\
    \ Keyword\n\nTo create objects from a class, you use the `new` keyword, just like\
    \ constructor functions:\n\n```javascript\nconst alice = new Person(\"Alice\"\
    , \"Johnson\", 30);\nalice.greet(); // Output: \"Hello, my name is Alice Johnson.\"\
    \n```\n\n### Syntactic Sugar, Not New Paradigm\n\nIt’s important to remember that\
    \ classes in JavaScript don’t fundamentally change how objects work under the\
    \ hood. They are a more convenient syntax for working with prototypes and constructor\
    \ functions. Underneath, the same prototypal inheritance mechanism is at play.\n\
    \n### Deeper Dive in Later Chapters\n\nIn later chapters, we’ll explore classes\
    \ in more depth, covering topics like inheritance, static methods, and advanced\
    \ class patterns. For now, consider class syntax as a cleaner and more structured\
    \ way to define objects, but keep in mind that it’s built upon the fundamental\
    \ principles of prototypes and inheritance.\n\n## Accessing Object Properties\n\
    \nOnce you’ve created an object, you need to know how to retrieve the data stored\
    \ within its properties. JavaScript offers two primary ways to access object properties:\
    \ dot notation and bracket notation.\n\n### 1. Dot Notation: The Straightforward\
    \ Approach\n\nDot notation is the most common and intuitive way to access object\
    \ properties. It uses a dot (`.`) followed by the property name.\n\n```javascript\n\
    const person = {\n  name: \"Alice\",\n  age: 30\n};\n\nconsole.log(person.name);\
    \ // Output: \"Alice\"\nconsole.log(person.age); // Output: 30\n```\n\nDot notation\
    \ is concise and easy to read, making it ideal for accessing properties with simple,\
    \ predictable names.\n\n### 2. Bracket Notation: The Flexible Powerhouse\n\nBracket\
    \ notation provides a more dynamic way to access properties. Instead of directly\
    \ writing the property name after the dot, you enclose the property name in square\
    \ brackets (`[]`).\n\n```javascript\nconsole.log(person[\"name\"]); // Output:\
    \ \"Alice\"\n```\n\nThe real power of bracket notation comes when you use variables\
    \ to access properties dynamically:\n\n```javascript\nconst propertyName = \"\
    age\";\nconsole.log(person[propertyName]); // Output: 30\n```\n\n### Accessing\
    \ Nested Properties\n\nBracket notation is also essential for accessing properties\
    \ of nested objects.\n\n```javascript\nconst student = {\n  name: \"Bob\",\n \
    \ grades: {\n    math: 90,\n    science: 85\n  }\n};\n\nconsole.log(student[\"\
    grades\"][\"math\"]); // Output: 90\n```\n\n### When to Use Which Notation\n\n\
    - **Dot Notation**: Prefer dot notation when you know the property name in advance\
    \ and it’s a valid JavaScript identifier (doesn’t contain spaces or special characters).\n\
    - **Bracket Notation**: Use bracket notation when:\n    - You need to use variables\
    \ to access property names dynamically.\n    - The property name is not a valid\
    \ JavaScript identifier (e.g., contains spaces).\n    - You’re accessing nested\
    \ properties.\n\n### Choosing the Right Tool\n\nBoth dot notation and bracket\
    \ notation are valuable tools in your JavaScript arsenal. By understanding their\
    \ strengths and weaknesses, you can choose the most appropriate method for accessing\
    \ object properties in different situations.\n\n## Modifying Objects\n\nObjects\
    \ in JavaScript are not static entities. You can dynamically add new properties,\
    \ change existing values, or even remove properties as needed. This flexibility\
    \ allows your code to adapt and evolve as your application runs.\n\n### 1. Adding\
    \ Properties: Expanding the Object\n\nYou can easily add new properties to an\
    \ object after it’s been created. Both dot notation and bracket notation work\
    \ for this purpose.\n\n```javascript\nconst person = {\n  name: \"Alice\",\n \
    \ age: 30\n};\n\n// Adding a property using dot notation\nperson.city = \"New\
    \ York\";\n\n// Adding a property using bracket notation\nperson[\"job\"] = \"\
    Engineer\";\n```\n"
