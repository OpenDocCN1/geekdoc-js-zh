    Key Characteristics:


    ● No Hoisting: Function expressions are not hoisted, so you cannot call them before
    they are defined in your code.


    ● Flexibility: Function expressions can be passed as arguments to other functions
    (callbacks) and returned from functions (higher-order functions). This enables
    powerful functional programming patterns.


    ● Anonymous Functions: Anonymous function expressions are often used when you
    don’t need to refer to the function by name.


    ### Choosing the Right Approach


    Both function declarations and function expressions have their place in JavaScript.
    Here’s a quick guideline:


    ● Function Declarations: Use them when you want a simple, straightforward way
    to define a named function that can be called before it’s defined.


    ● Function Expressions: Use them when you need the flexibility to pass functions
    around as values or when you don’t need a named function.


    ### Example: Callbacks and Higher-Order Functions


    function greet(name, callback) {


      console.log("Greeting:");


      callback(name);


    }


    greet("Alice", sayHello); // Using a function declaration as a callback


    greet("Bob", (name) => { // Using an anonymous function expression as a callback


      console.log("Hi, " + name + "!");


    });


    In this example, the  greet function takes a callback function as an argument.
    This demonstrates the flexibility of function expressions and their role in enabling
    powerful programming techniques like callbacks and higher-order functions.


    ## Chapter Summary


    In this chapter, we explored the essential tools for controlling flow and logic
    in JavaScript. We learned how to use conditional statements (if,  else if, and  else)
    to make decisions based on varying conditions, enabling our code to branch and
    adapt. We then delved into the power of loops (for,  while,  do...while,  for...in,
