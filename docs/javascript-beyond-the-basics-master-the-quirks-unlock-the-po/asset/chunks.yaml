  trans: "\n词法作用域是静态确定的，这意味着是在你编写代码时建立的，而不是运行时。这使得你的代码更具可预测性，因为你可以根据变量在代码结构中的位置，轻松地追踪它在哪里定义以及在哪里访问。\n\
    \n### 嵌套函数与词法作用域\n\n嵌套函数是 JavaScript 的一项特性。它们展示了词法作用域的力量。嵌套函数可以访问在其作用域内定义的变量，也可以访问在其外部（父级）作用域内定义的变量。\n\
    \n```javascript\nfunction outerFunction() {\n  let outerVar = 10;\n  function\
    \ innerFunction() {\n    let innerVar = 20;\n    console.log(outerVar); // 从外部作用域访问\
    \ outerVar\n    console.log(innerVar); // 从内部作用域访问 innerVar\n  }\n  innerFunction();\n\
    }\n\nouterFunction();\n```\n\n在此示例中：\n- `innerFunction` 可以访问 `outerVar`（来自父函数的作用域）和\
    \ `innerVar`（来自自身的作用域）。\n- `outerFunction` 可以访问 `outerVar`，但无法访问 `innerVar`（因为它在嵌套作用域中定义）。\n\
    - 在两个函数之外，这两个变量都无法被访问。\n\n### 为什么词法作用域很重要\n\n词法作用域提供了多处益处：\n\n- **可读性**：你可以通过查看代码中的声明轻松地确定变量的作用域。\n\
    - **可维护性**：当变量的作用域处理得当时，代码会更有组织且更容易推理。\n- **封装性**：词法作用域有助于封装数据，防止来自代码其他部分的意外修改。\n\
    - **闭包的形成**：词法作用域在闭包的创建中起着至关重要的作用，我们将在下一章探讨。\n\n通过理解词法作用域，你更深入地理解 JavaScript 如何管理变量，以及如何编写更具可预测性、模块化且易于维护的代码。\n\
    \n## 常见的作用域错误\n\n即使对作用域有深入理解，也很容易掉入导致意外行为或错误的陷阱。让我们来探索一些常见错误以及避免它们的方法：\n\n###\
    \ 1. 意外的全局变量：未声明的威胁\n\n忘记使用 `var`、`let` 或 `const` 变量并不意味着你的代码不会运行。相反，JavaScript\
    \ 会为你隐式地创建一个全局变量。这可能导致命名空间污染以及代码不同部分之间产生意外交互。\n\n```javascript\nfunction myFunction()\
    \ {\n  undeclaredVar = 10; // 哎！忘记写 'let' 或 'const'\n}\n\nmyFunction();\nconsole.log(undeclaredVar);\
    \ // 输出: 10 (全局变量)\n```\n\n**如何避免**：始终使用 `let` 或 `const` 显式声明变量（在现代 JavaScript\
    \ 中避免使用 `var`）。这确保它们具有正确的作用域并防止意外的全局。\n\n### 2. 遮蔽：变量冒充者\n\n当你在嵌套作用域中声明与外部作用域变量同名的变量时，你实际上是创建了一个“影子”变量。外部变量在内部作用域中被隐藏，导致潜在的混淆。\n\
    \n```javascript\nlet message = \"Hello from the outside!\";\nfunction sayHello()\
    \ {\n  let message = \"Hello from inside!\";\n  console.log(message); // 输出: \"\
    Hello from inside!\"\n}\n\nsayHello();\nconsole.log(message); // 输出: \"Hello from\
    \ the outside!\"\n```\n\n**如何避免**：留意变量名称，特别是在处理嵌套函数或块时。考虑使用不同的名称以避免遮蔽，或使用不同的标识符显式引用外部变量。\n\
    \n### 3. 修改后的闭包：变化的格局\n\n闭包是一项我们稍后将深入探讨的强大特性，当与变量修改结合时，会导致意外行为。闭包捕获其周围作用域的变量，但它是通过引用捕获的，而不是值。\n\
    \n```javascript\nlet counter = 0;\nfunction createCounter() {\n  return function()\
    \ {\n    counter++;\n    console.log(counter);\n  };\n}\n\nconst increment = createCounter();\n\
    increment(); // 输出: 1\nincrement(); // 输出: 2\n```\n\n**如何避免**：意识到闭包是通过引用捕获变量的。如果你需要保留一个值，考虑在闭包内部创建变量的副本或使用立即调用函数等技术。\n\
    \n### 最佳实践：保持你的作用域\n\n- **使用严格模式**：使用 `\"use strict\";` 来捕获常见的编码配置错误。\n- **显式声明变量**：使用\
    \ `let` 或 `const` 避免意外的全局变量。\n- **注意命名**：留意变量名称以避免遮蔽。\n- **谨慎使用闭包**：理解闭包如何通过引用捕获变量。\n\
    \n## 本章总结\n\n在本章中，我们开启了一场穿越作用域的之旅。我们首先定义了全局作用域——这个无所不在的空间。然后我们引入了局部（函数）作用域，提供了私有性。在此基础上，我们讨论了块作用域，增强了封装性。\n\
    \n我们还探索了作用域链，这是 JavaScript 用于搜索变量的层次结构。此外，我们强调了词法作用域是在编写代码时定的。最后，我们解决了常见错误，例如意外变量、遮蔽和意外的闭包行为。通过遵循使用严格模式、显式声明变量和留意命名等最佳实践，你可以编写更简洁的代码。\n\
    \n掌握作用域是成为熟练开发者的基础一步。通过理解控制可见性和访问的规则，你将完全有能力编写组织良好、易于维护且没有惊喜的代码。\n\n# 闭包的力量：“记得”其周围环境的函数\n\
    \n#### 大纲\n\n- 什么是闭包？\n- 闭包如何工作：词法作用域与内部函数\n- 闭包的背包：记忆变量\n- 闭包的实际应用\n- 本章总结\n\n\
    * *\n\n## 什么是闭包？\n\n在 JavaScript 复杂的世界中，闭包是一种迷人的现象。从核心上说，闭包只是函数“记住”其创建时环境中的变量和函数的能力，即使外部函数已经执行完毕。\n\
    \n将闭包想象成一个背着背包的函数。当它被创建时，它将其周围作用域的所有变量和函数都打包进背包里。即使外部函数消失了（执行完毕），内部函数仍然可以访问它打包好的所有内容。\n\
    \n### 不仅仅是快照\n\n重要的是，这种“记忆”并不是闭包形成时值的快照。它是一个活跃的连接。如果那些外部变量的值发生变化，闭包稍后访问它们时将看到这些变化。\n\
    \n### 一个简单的示例\n\n"
- fmt: "\n```javascript\nfunction outerFunction(name) {\n  let message = \"Hello,\
    \ \" + name + \"!\";\n\n  function innerFunction() {\n    console.log(message);\
    \ // Accessing 'message' from outerFunction\n  }\n  return innerFunction; // Returning\
    \ the inner function\n}\n\nlet greetAlice = outerFunction(\"Alice\");\n\ngreetAlice();\
    \ // Output: \"Hello, Alice!\"\n```\n\nHere’s what’s happening:\n\n1. `outerFunction`\
    \ is called with the argument “Alice.” It creates a local variable `message`.\n\
    2. The `innerFunction` is defined within `outerFunction`. It forms a closure,\
    \ capturing the `message` variable in its backpack.\n3. `outerFunction` returns\
    \ `innerFunction`.\n4. The returned `innerFunction` is assigned to `greetAlice`.\n\
    5. When `greetAlice()` is called, it remembers the `message` variable from its\
    \ creation environment and logs “Hello, Alice!”\n\n## The Magic of Closures\n\n\
    Closures might seem like magic, but they’re a fundamental mechanism that underpins\
    \ many powerful features of JavaScript:\n\n- **Data Encapsulation**: Closures\
    \ can be used to create private variables, hiding data from the outside world.\n\
    - **State Preservation**: Callbacks in event handlers or asynchronous operations\
    \ can use closures to maintain their state.\n- **Partial Application and Currying**:\
    \ These functional programming techniques rely on closures to create more specialized\
    \ functions.\n\nUnderstanding closures is essential for writing more advanced\
    \ JavaScript code. They enable you to create functions that are more flexible,\
    \ modular, and expressive.\n\n## How Closures Work: Lexical Scoping and Inner\
    \ Functions\n\nClosures come to life through the interplay of nested functions\
    \ and lexical scoping. Let’s break down how this works.\n\n### Nested Functions:\
    \ Functions within Functions\n\nA nested function is simply a function defined\
    \ inside another function. It’s like a smaller room within a larger house. The\
    \ inner function has access to the variables and functions declared within its\
    \ own scope, but it also has a special ability: it can reach out and access the\
    \ variables of its outer (parent) function.\n\n### Lexical Scoping: The Rules\
    \ of the Game\n\nThis ability to access outer variables is due to a concept called\
    \ lexical scoping. Lexical scope means that the scope of a variable is determined\
    \ by its location in the source code, specifically where it’s declared. When a\
    \ nested function is created, it essentially takes a snapshot of the surrounding\
    \ lexical environment at the time of its creation. This snapshot includes all\
    \ the variables and functions that are accessible within its outer function.\n\
    \n### Code Example: Closure in Practice\n\n```javascript\nfunction outerFunction(name)\
    \ {\n  let greeting = \"Hello\";\n\n  function innerFunction() {\n    console.log(greeting\
    \ + \", \" + name + \"!\");\n  }\n  return innerFunction;\n}\n\nconst greetBob\
    \ = outerFunction(\"Bob\"); // Creates a closure\n\ngreetBob(); // Output: \"\
    Hello, Bob!\"\n```\n\n1. **Outer Function**: `outerFunction` is called with the\
    \ argument “Bob.” It defines a variable `greeting` and a nested function `innerFunction`.\n\
    2. **Inner Function**: `innerFunction` is defined within the scope of `outerFunction`.\
    \ Due to lexical scoping, it has access to the `greeting` variable from its outer\
    \ scope.\n3. **Closure Creation**: `outerFunction` returns `innerFunction`. At\
    \ this point, a closure is created. `innerFunction` is packaged together with\
    \ its lexical environment (including the `greeting` variable).\n4. **Calling the\
    \ Closure**: The returned function is assigned to `greetBob`. When you call `greetBob()`,\
    \ it remembers the value of `greeting` from its closure and uses it to log the\
    \ message.\n\n### Key Points:\n\n- **Lexical Environment**: A closure “remembers”\
    \ its lexical environment, which is the collection of variables and functions\
    \ that were in scope when the closure was created.\n- **Lifetime of Variables**:\
    \ Even after the outer function finishes executing, the variables within the closure\
    \ remain in memory as long as the closure exists.\n- **Data Encapsulation**: Closures\
    \ provide a way to encapsulate data. The variables within a closure are only accessible\
    \ to the inner function, protecting them from being modified by external code.\n\
    \nBy understanding how closures work and how they leverage lexical scoping, you\
    \ can harness their power to create more expressive, modular, and reusable JavaScript\
    \ code.\n\n## The Closure’s Backpack: Remembering Variables\n\nImagine a function\
    \ as a traveler embarking on a journey. When a function is defined within another\
    \ function (nested), it packs a special backpack—the closure—before setting off.\
    \ Inside this backpack, it carefully stores all the variables and functions from\
    \ its surrounding environment.\n\n### Packing the Essentials\n\nAs the inner function\
    \ travels through your code, it carries its backpack with it. Even if the outer\
    \ function (the original starting point) disappears, the inner function still\
    \ has access to the contents of its backpack. It can reach in and use those variables\
    \ or functions whenever it needs them, just like a traveler relying on the supplies\
    \ they packed for the journey.\n\n### Live References, Not Just Copies\n\nThe\
    \ crucial point here is that the closure doesn’t just make copies of the variables;\
    \ it holds live references to them. This means that if the original variables\
    \ change, the closure will see those updated values.\n\n### Code Example: The\
    \ Counting Backpack\n\n```javascript\nfunction createCounter() {\n  let count\
    \ = 0; // The variable in the backpack\n\n  return function() {\n    count++;\n\
    \    console.log(count);\n  };\n}\n\nconst counter1 = createCounter();\nconst\
    \ counter2 = createCounter();\n\ncounter1(); // Output: 1\ncounter1(); // Output:\
    \ 2\ncounter2(); // Output: 1 (Each closure has its own independent 'count')\n\
    ```\n\nIn this example:\n1. `createCounter` creates a new closure each time it’s\
    \ called. Each closure gets its own independent count.\n2. The inner function\
    \ increments `count` and logs it to the console.\n3. Even though `createCounter`\
    \ has finished executing, the count continues to exist within each closure.\n\
    4. Each closure maintains its separate count, illustrating how closures create\
    \ independent environments.\n\n### Changing the Contents of the Backpack\n\nThe\
    \ variables within a closure can be modified from the inner function. This demonstrates\
    \ the live nature of the references.\n\n```javascript\nfunction createMultiplier(factor)\
    \ {\n  let result = 1;\n\n  return function(number) {\n    result *= number; //\
    \ Modifying the variable in the backpack\n    console.log(result * factor);\n\
    \  };\n}\n\nconst multiplyByFive = createMultiplier(5);\n\nmultiplyByFive(2);\
    \ // Output: 10\nmultiplyByFive(3); // Output: 150 (result is retained)\n```\n\
    \nIn this case, the inner function multiplies the `result` variable by the input\
    \ number and the constant factor, showcasing the persistent memory of the closure.\n\
    \n### Key Takeaways\n\n- Closures create a “backpack” of variables from their\
    \ lexical environment.\n- These variables are live references, not copies.\n-\
    \ You can modify the variables within the backpack from the inner function.\n\
    - Each closure has its own backpack, maintaining separate state.\n\nBy understanding\
    \ how closures work as backpacks, you can leverage them effectively for data encapsulation,\
    \ state preservation, and creating more complex function behaviors in JavaScript.\n\
    \n## Practical Applications of Closures\n\nClosures are not merely a theoretical\
    \ concept; they are a powerful tool with practical applications that can elevate\
    \ your JavaScript code to the next level. Let’s explore some real-world scenarios\
    \ where closures shine:\n\n### 1. Data Encapsulation and Privacy\n\nIn object-oriented\
    \ programming, encapsulation is the practice of bundling data (properties) and\
    \ the operations that work on that data (methods) together within an object. This\
    \ helps protect data from accidental modification and provides a clear interface\
    \ for interacting with it.\n"
  raw: 'function outerFunction(name) {


      let message = "Hello, " + name + "!";


      function innerFunction() {


        console.log(message); // Accessing ''message'' from outerFunction


      }


      return innerFunction; // Returning the inner function


    }


    let greetAlice = outerFunction("Alice");


    greetAlice(); // Output: "Hello, Alice!"


    Here’s what’s happening:


    1.  outerFunction is called with the argument “Alice.” It creates a local variable  message.


    2.  The  innerFunction is defined within  outerFunction. It forms a closure, capturing
    the  message variable in its backpack.


    3.  outerFunction returns  innerFunction.


    4.  The returned  innerFunction is assigned to  greetAlice.


    5.  When  greetAlice() is called, it remembers the  message variable from its
    creation environment and logs “Hello, Alice!”


    ### The Magic of Closures


    Closures might seem like magic, but they’re a fundamental mechanism that underpins
    many powerful features of JavaScript:


    ● Data Encapsulation: Closures can be used to create private variables, hiding
    data from the outside world.


    ● State Preservation: Callbacks in event handlers or asynchronous operations can
    use closures to maintain their state.


    ● Partial Application and Currying: These functional programming techniques rely
    on closures to create more specialized functions.


    Understanding closures is essential for writing more advanced JavaScript code.
    They enable you to create functions that are more flexible, modular, and expressive.


    How Closures Work: Lexical Scoping and Inner Functions


    Closures come to life through the interplay of nested functions and lexical scoping.
    Let’s break down how this works.


    Nested Functions: Functions within Functions


    A nested function is simply a function defined inside another function. It’s like
    a smaller room within a larger house. The inner function has access to the variables
    and functions declared within its own scope, but it also has a special ability:
    it can reach out and access the variables of its outer (parent) function.


    Lexical Scoping: The Rules of the Game


    This ability to access outer variables is due to a concept called lexical scoping.
    Lexical scope means that the scope of a variable is determined by its location
    in the source code, specifically where it’s declared. When a nested function is
    created, it essentially takes a snapshot of the surrounding lexical environment
    at the time of its creation. This snapshot includes all the variables and functions
    that are accessible within its outer function.


    Code Example: Closure in Practice


    function outerFunction(name) {


      let greeting = "Hello";


      function innerFunction() {


        console.log(greeting + ", " + name + "!");


      }


      return innerFunction;


    }


    const greetBob = outerFunction("Bob"); // Creates a closure


    greetBob(); // Output: "Hello, Bob!"


    1.  Outer Function: outerFunction is called with the argument “Bob.” It defines
    a variable  greeting and a nested function  innerFunction.


    2.  Inner Function: innerFunction is defined within the scope of  outerFunction.
    Due to lexical scoping, it has access to the  greeting variable from its outer
    scope.


    3.  Closure Creation: outerFunction returns  innerFunction. At this point, a closure
    is created.  innerFunction is packaged together with its lexical environment (including
    the  greeting variable).


    4.  Calling the Closure: The returned function is assigned to  greetBob. When
    you call  greetBob(), it remembers the value of  greeting from its closure and
    uses it to log the message.


    Key Points:


    ● Lexical Environment: A closure “remembers” its lexical environment, which is
    the collection of variables and functions that were in scope when the closure
    was created.


    ● Lifetime of Variables: Even after the outer function finishes executing, the
    variables within the closure remain in memory as long as the closure exists.


    ● Data Encapsulation: Closures provide a way to encapsulate data. The variables
    within a closure are only accessible to the inner function, protecting them from
    being modified by external code.


    By understanding how closures work and how they leverage lexical scoping, you
    can harness their power to create more expressive, modular, and reusable JavaScript
    code.


    The Closure’s Backpack: Remembering Variables


    Imagine a function as a traveler embarking on a journey. When a function is defined
    within another function (nested), it packs a special backpack—the closure—before
    setting off. Inside this backpack, it carefully stores all the variables and functions
    from its surrounding environment.


    ### Packing the Essentials


    As the inner function travels through your code, it carries its backpack with
    it. Even if the outer function (the original starting point) disappears, the inner
    function still has access to the contents of its backpack. It can reach in and
    use those variables or functions whenever it needs them, just like a traveler
    relying on the supplies they packed for the journey.


    ### Live References, Not Just Copies


    The crucial point here is that the closure doesn’t just make copies of the variables;
    it holds live references to them. This means that if the original variables change,
    the closure will see those updated values.


    ### Code Example: The Counting Backpack


    function createCounter() {


      let count = 0; // The variable in the backpack


      return function() {


        count++;


        console.log(count);


      };


    }


    const counter1 = createCounter();


    const counter2 = createCounter();


    counter1(); // Output: 1


    counter1(); // Output: 2


    counter2(); // Output: 1 (Each closure has its own independent ''count'')


    In this example:


    1.  createCounter creates a new closure each time it’s called. Each closure gets
    its own independent “backpack” containing the  count variable.


    2.  The inner function increments  count and logs it to the console.


    3.  Even though  createCounter has finished executing, the  count variables continue
    to exist within each closure’s backpack.


    4.  Each closure maintains its own separate count, illustrating how closures create
    independent environments.


    ### Changing the Contents of the Backpack


    The variables within a closure can be modified from within the inner function.
    This demonstrates the live nature of the references.


    function createMultiplier(factor) {


      let result = 1;


      return function(number) {


        result *= number; // Modifying the variable in the backpack


        console.log(result * factor);


      };


    }


    const multiplyByFive = createMultiplier(5);


    multiplyByFive(2); // Output: 10


    multiplyByFive(3); // Output: 150 (result is retained)


    In this case, the inner function multiplies the  result variable by the input
    number and the constant factor, showcasing the persistent memory of the closure.


    ### Key Takeaways


    ● Closures create a “backpack” of variables from their lexical environment.


    ●     These variables are live references, not copies.


    ● You can modify the variables within the backpack from the inner function.


    ● Each closure has its own independent backpack, maintaining separate state.


    By understanding how closures work as backpacks, you can leverage them effectively
    for data encapsulation, state preservation, and creating more complex function
    behaviors in JavaScript.


    ## Practical Applications of Closures


    Closures are not merely a theoretical concept; they are a powerful tool with practical
    applications that can elevate your JavaScript code to the next level. Let’s explore
    some real-world scenarios where closures shine:


    ### 1\. Data Encapsulation and Privacy


    In object-oriented programming, encapsulation is the practice of bundling data
    (properties) and the operations that work on that data (methods) together within
    an object. This helps protect data from accidental modification and provides a
    clear interface for interacting with it.'
