  trans: "\n通过理解这种区别，你能够更加清晰、更有自信地处理 JavaScript 的原型继承系统。\n\n## 原型继承的力量与灵活性\n\n原型继承为\
    \ JavaScript 的面向对象编程风格带来了一系列独特的优势和灵活性，使其与传统的基于类的继承区分开来。\n\n### 动态性：对象随需演进\n\n\
    原型继承最强大的特性之一是它的动态性。与基于类的继承不同（类对象的结构在创建时就已经固定了），JavaScript 的原型可以在运行时进行修改。这意味着你可以添加、删除或更改原型的属性和方法，而这些更改将立即反映在所有自该原型的对象中。\n\
    \n```javascript\nfunction Animal(name) {\n  this.name = name;\n}\n\nconst dog\
    \ = new Animal(\"Max\");\nAnimal.prototype.makeSound = function() { // 在原型上添加新方法\n\
    \  console.log(\"Generic animal sound!\");\n};\n\ndog.makeSound(); // 输出: \"Generic\
    \ animal sound!\"\n```\n\n这种动态性为你的代码提供了惊人的灵活性和适应性。你可以创建随时间演化的对象，以响应不断变化的需求或用户交互。\n\
    \n### 对象组合：混合组合特质\n\n原型继承实现了一种名为“对象组合”的强大模式。你不需要创建深层的继承结构，而是可以通过组合不同原型的特征来构建对象。这使得代码具有更高的灵活性和重用性。\n\
    \n```javascript\nconst barker = {\n  bark() {\n    console.log(\"Woof!\");\n \
    \ }\n};\n\nconst swimmer = {\n  swim() {\n    console.log(\"Swimming...\");\n\
    \  }\n};\n\nconst dog = Object.create(animal);\nObject.assign(dog, barker, swimmer);\
    \ // 组合不同原型的特质\ndog.eat();    // 输出: \"Max is eating.\" (继承自 Animal)\ndog.bark();\
    \   // 输出: \"Woof!\" (来自 barker)\ndog.swim();   // 输出: \"Swimming...\" (来自 swimmer)\n\
    ```\n\n### 避免基于类继承的陷阱\n\nJavaScript 的原型继承模型规避了基于类继承的一些潜在陷阱：\n\n- **脆弱的基类问题**：对基类的修改可能会对派生类产生意外的后果。在原型继承中，你可以修改原型而不破坏破坏现有对象。\n\
    - **僵化的层次结构**：基于类的继承可能导致深度且僵化的层次结构，难以更改。原型继承鼓励使用更灵活、更模块化的方法。\n\n### 总之，原型和原型继承是\
    \ JavaScript 对象模型的核心。它们为代码重用、动态对象行为和对象组合提供了一种强大且灵活的机制。通过理解这些概念，你可以充分利用 JavaScript\
    \ 独特的面向对象能力，并编写出更整洁、易于维护且更表现力的代码。\n\n## 章节总结\n\n在本章中，我们深入研究了 JavaScript 对象模型的内部机制，重点关注了原型和继承这两个强大概念。我们探索了\
    \ JavaScript 中的每个对象如何拥有原型，该原型充当其属性和方法的蓝图。这种原型链允许对象从其祖先那里继承特征，促进了代码重用和动态行为。\n\n\
    我们还理清了 `__proto__` 属性（或 `Object.getPrototypeOf()`）与 `prototype` 属性之间的区别，理解了它们在继承机制中各自承担的角色。\n\
    \n此外，我们还探索了原型继承的优势，包括它的动态性（允许对象在运行时演进）以及它在实现对象组合方面的灵活性。我们还强调了原型继承与基于类继承的区别，以及它如何避免某些潜在的陷阱。\n\
    \n通过理解本章涵盖的概念，你对 JavaScript 的面向对象能力有了更深层次的理解。当你继续掌握 JavaScript 并构建更复杂的应用程序时，这些知识将是无价的。\n\
    \n## 函数作为一等公民：高阶函数和回调\n\n### 提纲\n\n- 函数作为值\n- 高阶函数：操作函数的函数\n- 回调：作为参数的\n- 高阶函数和回调的实际应用\n\
    - 章节总结\n\n***\n\n## 函数作为值\n\n在 JavaScript 中，函数不仅仅是待执行的代码块；它们是一等公民。这意味着你可以在代码中像对待任何其他值（如数字、字符串或对象）一样对待函数。你可以：\n\
    \n- **将它们赋值给变量**：\n```javascript\nconst greet = function(name) {\n  console.log(`Hello,\
    \ ${name}!`);\n};\n```\n在这里，`greet` 是一个持有函数的变量。\n\n- **将其作为参数传递给其他函数**：\n```javascript\n\
    function saySomething(messageFunction) {\n  messageFunction(\"JavaScript is awesome!\"\
    );\n}\nsaySomething(greet); // 输出: \"Hello, JavaScript is awesome!\"\n```\n`saySomething`\
    \ 函数接受另一个函数 `messageFunction` 作为参数并调用它。\n\n- **从函数中返回它们**：\n```javascript\nfunction\
    \ createMultiplier(factor) {\n  return function(number) {\n    return number *\
    \ factor;\n  };\n}\n\nconst double = createMultiplier(2);\nconst triple = createMultiplier(3);\n\
    console.log(double(5)); // 输出: 10\nconsole.log(triple(5)); // 输出: 15\n```\n`createMultiplier`\
    \ 函数返回一个函数，该函数将数字乘以指定的因子。\n\n- **将它们存储在数据结构中（例如数组、对象）**：\n```javascript\nconst\
    \ operations = [\n  function(a, b) { return a + b; },\n  function(a, b) { return\
    \ a - b; },\n  function(a, b) { return a * b; },\n];\nconsole.log(operations0);\
    \ // 输出: 5\n```\n\n### 为什么一等函数很重要\n\n这种将函数视为值的能力开启了无限可能：\n\n- **高阶函数**：你可以创建接受其他函数作为参数或返回函数结果的函数。\n\
    - **回调**：你可以将函数作为回调传递以便以后执行，实现异步编程和事件驱动行为。\n- **函数式编程**：一等函数是函数式编程的基础，通过简单函数组合复杂行为。\n\
    \n通过理解函数作为值的概念，你解锁了 JavaScript 能力的深层次，能够编写出更优雅、模块化且强大的代码。\n\n## 高阶函数：操作函数的函数\n\
    \n高阶函数通过将函数视为数据来提升 JavaScript 的能力。这些特殊的函数要么接受其他函数作为参数（回调），要么返回新函数。这个看似简单的概念开启了丰富的优势，促进了抽象、代码重用和更声明式的编程风格。\n\
    \n### 抽象：简化操作\n\n高阶函数允许你抽象数据结构常见操作细节。你不需要编写重复的循环来执行过滤、映射或减少数组等任务，可以使用简洁的高阶函数来清晰地表达你的意图。\n\
    \n### 重用：编写一次，处处使用\n\n通过用函数参数化代码的行为，高阶函数鼓励代码重用。你可以编写一个单一函数，通过不同的回调函数在同一份数据上执行各种任务。\n\
    \n### 模块化：拆解复杂逻辑\n\n高阶函数通过将复杂逻辑拆分为更小的可重用的函数来促进模块化。这使得你的代码更容易理解、测试和维护。\n\n### JavaScript\
    \ 中的内置高阶函数\n\nJavaScript 提供了许多强大的内置高阶函数，用于处理数组和其他数据结构：\n\n"
- fmt: "\n- `map(callback)`: Creates a new array by applying the `callback` function\
    \ to each element of the original array.\n- `filter(callback)`: Creates a new\
    \ array containing only the elements for which the `callback` function returns\
    \ `true`.\n- `reduce(callback, initialValue)`: Reduces an array to a single value\
    \ by applying the `callback` function cumulatively to each element, starting with\
    \ the `initialValue`.\n- `forEach(callback)`: Executes the `callback` function\
    \ for each element of the array.\n- `sort(callback)`: Sorts an array in place\
    \ based on the comparison function provided as the `callback`.\n\n### Examples\
    \ in Action\n\n```javascript\nconst numbers = [1, 2, 3, 4, 5];\n\nconst doubled\
    \ = numbers.map(x => x * 2);  // [2, 4, 6, 8, 10]\n\nconst evenNumbers = numbers.filter(x\
    \ => x % 2 === 0); // [2, 4]\nconst sum = numbers.reduce((acc, current) => acc\
    \ + current, 0); // 15\nnumbers.forEach(x => console.log(x)); // Output: 1 2 3\
    \ 4 5\nnumbers.sort((a, b) => a - b);       // Sorts in ascending order\n```\n\
    \n### Declarative vs. Imperative Style\n\nHigher-order functions encourage a more\
    \ declarative programming style, where you focus on expressing what you want to\
    \ do rather than how to do it. This contrasts with an imperative style, where\
    \ you explicitly specify the steps of an algorithm using loops and conditionals.\n\
    \n#### Imperative style\n```javascript\nlet doubled = [];\n\nfor (let i = 0; i\
    \ < numbers.length; i++) {\n  doubled.push(numbers[i] * 2);\n}\n```\n\n#### Declarative\
    \ style (using map)\n```javascript\nconst doubled = numbers.map(x => x * 2);\n\
    ```\n\nThe declarative style is often more concise, readable, and less error-prone.\
    \ \n\nBy understanding and utilizing higher-order functions, you can write cleaner,\
    \ more maintainable, and more functional JavaScript code. These functions empower\
    \ you to express your intentions more clearly, abstract away complex operations,\
    \ and create reusable components for building robust applications.\n\n## Callbacks:\
    \ Functions as Arguments\n\nIn JavaScript, a callback is a function that you pass\
    \ as an argument to another function, with the expectation that the other function\
    \ will call it back (execute it) at some point in the future. Callbacks are a\
    \ fundamental mechanism for handling asynchronous operations and events in JavaScript.\n\
    \n### Why Callbacks?\n\nJavaScript is single-threaded, meaning it can only do\
    \ one thing at a time. However, many operations, like fetching data from a server\
    \ or waiting for a timer to expire, take time to complete. If JavaScript waited\
    \ for these operations to finish before moving on, your application would freeze\
    \ and become unresponsive.\n\nCallbacks provide a solution to this problem. By\
    \ passing a callback function, you tell JavaScript, “When you’re done with this\
    \ task, please execute this function.” This allows your code to continue running\
    \ while the asynchronous operation completes in the background.\n\n### Callbacks\
    \ in Action\n\nLet’s explore some common scenarios where callbacks are used:\n\
    \n1. **Event Handling**:\n```javascript\ndocument.getElementById(\"myButton\"\
    ).addEventListener(\"click\", function() {\n  console.log(\"Button clicked!\"\
    );\n});\n```\nIn this example, the `addEventListener` method registers a callback\
    \ function that will be executed when the button with the ID “myButton” is clicked.\n\
    \n2. **Asynchronous Operations**:\n```javascript\nsetTimeout(function() {\n  console.log(\"\
    This message appears after 2 seconds.\");\n}, 2000);\n```\nHere, `setTimeout`\
    \ takes a callback function as its first argument. This function will be executed\
    \ after the specified delay (2000 milliseconds or 2 seconds).\n\n3. **Custom Libraries\
    \ and Frameworks**:\n```javascript\nfunction fetchData(url, callback) {\n  //\
    \ ... (code to fetch data from the url) ...\n  callback(data);\n}\n\nfetchData(\"\
    /api/users\", function(data) {\n  // ... (code to process the fetched data) ...\n\
    });\n```\nMany libraries and frameworks provide functions that accept callbacks\
    \ to customize their behavior. In this example, the `fetchData` function takes\
    \ a callback that is executed when the data fetching is complete.\n\n### Advantages\
    \ of Callbacks\n\n- **Non-Blocking Code**: Callbacks enable your code to continue\
    \ executing while asynchronous operations are in progress, preventing your application\
    \ from becoming unresponsive.\n- **Event-Driven Programming**: Callbacks are a\
    \ key mechanism for responding to events like button clicks, mouse movements,\
    \ or network responses.\n- **Customization**: Libraries and frameworks often use\
    \ callbacks to allow developers to customize their behavior according to specific\
    \ needs.\n\n### Callback Hell: A Potential Challenge\n\nIn complex scenarios,\
    \ callbacks can lead to a phenomenon known as “callback hell,” where you end up\
    \ with deeply nested callback functions, making code difficult to read and maintain.\
    \ However, modern JavaScript provides alternatives like `Promises` and `async/await`\
    \ to address this issue.\n\n### Key Takeaway\n\nCallbacks are a fundamental concept\
    \ in JavaScript. They enable asynchronous programming, event handling, and customization,\
    \ making your code more responsive and adaptable to real-world scenarios. By understanding\
    \ how callbacks work, you can leverage the full power of JavaScript’s event-driven\
    \ and non-blocking nature.\n\n## Practical Applications of Higher-Order Functions\
    \ and Callbacks\n\nLet’s dive into practical scenarios where higher-order functions\
    \ and callbacks shine, showcasing their ability to simplify complex tasks, enhance\
    \ code reusability, and improve the structure of your JavaScript projects.\n\n\
    ### 1. Custom Filtering, Sorting, and Mapping on Arrays\n\nImagine you have an\
    \ array of products, and you need to:\n- Filter products by price range.\n- Sort\
    \ products by name alphabetically.\n- Calculate the discounted prices for all\
    \ products.\n\nHigher-order functions make this a breeze:\n```javascript\nconst\
    \ products = [\n  { name: \"Laptop\", price: 999.99, discount: 0.1 },\n  { name:\
    \ \"Smartphone\", price: 599.99, discount: 0.15 },\n  { name: \"Headphones\",\
    \ price: 129.99, discount: 0.05 }\n];\n\nconst filtered = products.filter(product\
    \ => product.price > 500 && product.price < 1000);\nconst sorted = products.sort((a,\
    \ b) => a.name.localeCompare(b.name));\nconst discounted = products.map(product\
    \ => ({\n  ...product,\n  discountedPrice: product.price * (1 - product.discount)\n\
    }));\n```\n\n### 2. Reusable Functions for Different Data Types\n\nHigher-order\
    \ functions allow you to create versatile functions that work with various data\
    \ types by accepting callback functions that handle the specific logic.\n\n```javascript\n\
    function processData(data, operation) {\n  return data.map(operation);\n}\n\n\
    const numbers = [1, 2, 3];\nconst doubledNumbers = processData(numbers, x => x\
    \ * 2);\n\nconst words = [\"apple\", \"banana\", \"orange\"];\nconst capitalizedWords\
    \ = processData(words, word => word.toUpperCase());\n```\nHere, `processData`\
    \ can handle both numbers and strings, thanks to the `operation` callback.\n\n\
    ### 3. Organized Asynchronous Operations\n\nCallbacks play a crucial role in managing\
    \ asynchronous operations, such as fetching data from an API.\n\n```javascript\n\
    function fetchData(url, callback) {\n  fetch(url)\n    .then(response => response.json())\n\
    \    .then(data => callback(null, data))\n    .catch(error => callback(error));\n\
    }\n\nfetchData(\"/api/posts\", function(error, posts) {\n  if (error) {\n    console.error(\"\
    Error fetching data:\", error);\n  } else {\n    // Process the fetched posts\n\
    \  }\n});\n```\nThe callback pattern provides a structured way to handle success\
    \ and error scenarios when dealing with asynchronous tasks.\n\n### 4. Flexible\
    \ APIs and Libraries\n\nMany JavaScript libraries and frameworks heavily rely\
    \ on callbacks and higher-order functions to enable customization and extensibility.\n\
    \n```javascript\nconst express = require('express');\nconst app = express();\n\
    \napp.get('/', function(req, res) {\n  res.send('Hello World!');\n});\n```\nIn\
    \ Express.js, a popular web framework, route handlers are callback functions executed\
    \ when specific URLs are requested.\n\nBy incorporating higher-order functions\
    \ and callbacks into your code, you’ll benefit from:\n- Improved Readability:\
    \ Code becomes more concise and focused on the desired outcome.\n"
  raw: '● map(callback): Creates a new array by applying the  callback function to
    each element of the original array.


    ● filter(callback): Creates a new array containing only the elements for which
    the  callback function returns  true.


    ● reduce(callback, initialValue): Reduces an array to a single value by applying
    the  callback function cumulatively to each element, starting with the  initialValue.


    ● forEach(callback): Executes the  callback function for each element of the array.


    ● sort(callback): Sorts an array in place based on the comparison function provided
    as the  callback.


    ### Examples in Action


    const numbers = [1, 2, 3, 4, 5];


    const doubled = numbers.map(x => x * 2);   // [2, 4, 6, 8, 10]


    const evenNumbers = numbers.filter(x => x % 2 === 0); // [2, 4]


    const sum = numbers.reduce((acc, current) => acc + current, 0); // 15


    numbers.forEach(x => console.log(x)); // Output: 1 2 3 4 5


    numbers.sort((a, b) => a - b);       // Sorts in ascending order


    ### Declarative vs. Imperative Style


    Higher-order functions encourage a more declarative programming style, where you
    focus on expressing what you want to do rather than how to do it. This contrasts
    with an imperative style, where you explicitly specify the steps of an algorithm
    using loops and conditionals.


    // Imperative style


    let doubled = [];


    for (let i = 0; i < numbers.length; i++) {


      doubled.push(numbers[i] * 2);


    }


    // Declarative style (using map)


    const doubled = numbers.map(x => x * 2);


    The declarative style is often more concise, readable, and less error-prone.


    By understanding and utilizing higher-order functions, you can write cleaner,
    more maintainable, and more functional JavaScript code. These functions empower
    you to express your intentions more clearly, abstract away complex operations,
    and create reusable components for building robust applications.


    ## Callbacks: Functions as Arguments


    In JavaScript, a callback is a function that you pass as an argument to another
    function, with the expectation that the other function will call it back (execute
    it) at some point in the future. Callbacks are a fundamental mechanism for handling
    asynchronous operations and events in JavaScript.


    ### Why Callbacks?


    JavaScript is single-threaded, meaning it can only do one thing at a time. However,
    many operations, like fetching data from a server or waiting for a timer to expire,
    take time to complete. If JavaScript waited for these operations to finish before
    moving on, your application would freeze and become unresponsive.


    Callbacks provide a solution to this problem. By passing a callback function,
    you tell JavaScript, “When you’re done with this task, please execute this function.”
    This allows your code to continue running while the asynchronous operation completes
    in the background.


    ### Callbacks in Action


    Let’s explore some common scenarios where callbacks are used:


    1\. Event Handling:


    document.getElementById("myButton").addEventListener("click", function() {


      console.log("Button clicked!");


    });


    In this example, the  addEventListener method registers a callback function that
    will be executed when the button with the ID “myButton” is clicked.


    2\. Asynchronous Operations:


    setTimeout(function() {


      console.log("This message appears after 2 seconds.");


    }, 2000);


    Here,  setTimeout takes a callback function as its first argument. This function
    will be executed after the specified delay (2000 milliseconds or 2 seconds).


    3\. Custom Libraries and Frameworks:


    function fetchData(url, callback) {


      // ... (code to fetch data from the url) ...


      callback(data);


    }


    fetchData("/api/users", function(data) {


      // ... (code to process the fetched data) ...


    });


    Many libraries and frameworks provide functions that accept callbacks to customize
    their behavior. In this example, the  fetchData function takes a callback that
    is executed when the data fetching is complete.


    ### Advantages of Callbacks


    ● Non-Blocking Code: Callbacks enable your code to continue executing while asynchronous
    operations are in progress, preventing your application from becoming unresponsive.


    ● Event-Driven Programming: Callbacks are a key mechanism for responding to events
    like button clicks, mouse movements, or network responses.


    ● Customization: Libraries and frameworks often use callbacks to allow developers
    to customize their behavior according to specific needs.


    ### Callback Hell: A Potential Challenge


    In complex scenarios, callbacks can lead to a phenomenon known as “callback hell,”
    where you end up with deeply nested callback functions, making code difficult
    to read and maintain. However, modern JavaScript provides alternatives like Promises
    and async/await to address this issue.


    ### Key Takeaway


    Callbacks are a fundamental concept in JavaScript. They enable asynchronous programming,
    event handling, and customization, making your code more responsive and adaptable
    to real-world scenarios. By understanding how callbacks work, you can leverage
    the full power of JavaScript’s event-driven and non-blocking nature.


    ## Practical Applications of Higher-Order Functions and Callbacks


    Let’s dive into practical scenarios where higher-order functions and callbacks
    shine, showcasing their ability to simplify complex tasks, enhance code reusability,
    and improve the structure of your JavaScript projects.


    ### 1\. Custom Filtering, Sorting, and Mapping on Arrays


    Imagine you have an array of products, and you need to:


    ●     Filter products by price range.


    ●     Sort products by name alphabetically.


    ●     Calculate the discounted prices for all products.


    Higher-order functions make this a breeze:


    const products = [


      { name: "Laptop", price: 999.99, discount: 0.1 },


      { name: "Smartphone", price: 599.99, discount: 0.15 },


      { name: "Headphones", price: 129.99, discount: 0.05 }


    ];


    const filtered = products.filter(product => product.price > 500 && product.price
    < 1000);


    const sorted = products.sort((a, b) => a.name.localeCompare(b.name));


    const discounted = products.map(product => ({


      ...product,


      discountedPrice: product.price * (1 - product.discount)


    }));


    ### 2\. Reusable Functions for Different Data Types


    Higher-order functions allow you to create versatile functions that work with
    various data types by accepting callback functions that handle the specific logic.


    function processData(data, operation) {


      return data.map(operation);


    }


    const numbers = [1, 2, 3];


    const doubledNumbers = processData(numbers, x => x * 2);


    const words = ["apple", "banana", "orange"];


    const capitalizedWords = processData(words, word => word.toUpperCase());


    Here,  processData can handle both numbers and strings, thanks to the  operation
    callback.


    ### 3\. Organized Asynchronous Operations


    Callbacks play a crucial role in managing asynchronous operations, such as fetching
    data from an API.


    function fetchData(url, callback) {


      fetch(url)


        .then(response => response.json())


        .then(data => callback(null, data))


        .catch(error => callback(error));


    }


    fetchData("/api/posts", function(error, posts) {


      if (error) {


        console.error("Error fetching data:", error);


      } else {


        // Process the fetched posts


      }


    });


    The callback pattern provides a structured way to handle success and error scenarios
    when dealing with asynchronous tasks.


    ### 4\. Flexible APIs and Libraries


    Many JavaScript libraries and frameworks heavily rely on callbacks and higher-order
    functions to enable customization and extensibility.


    const express = require(''express'');


    const app = express();


    app.get(''/'', function(req, res) {


      res.send(''Hello World!'');


    });


    In Express.js, a popular web framework, route handlers are callback functions
    executed when specific URLs are requested.


    By incorporating higher-order functions and callbacks into your code, you’ll benefit
    from:


    ● Improved Readability: Code becomes more concise and focused on the desired outcome.'
