  trans: "\n原型不仅涉及继承，它们还允许动态行为。你可以在运行时修改原型对象，这些更改将反映在所有继承自该原型的对象中。这种灵活性允许你创建动态的对象关系，并随时更改对象的行为。\n\
    \n理解原型对于掌握 JavaScript 对象的运行机制至关重要。它们是 JavaScript 对象模型的骨干，实现了继承、代码复用和动态行为。通过掌握这一概念，你将顺畅地通向释放\
    \ JavaScript 程序中对象全部潜力的道路。\n\n## 原型链：继承的足迹\n\n将原型链想象成一个对象的家族族谱，其中每个对象都从它的祖先那里继承特质（属性和方法）。当你尝试访问对象上的某个东西时，\
    \ JavaScript 会首先从该对象本身开始查找。如果它没有找到你寻找的内容，它不会放弃，而是沿着家族族谱向上沿路径查找，逐一检查每个祖先。\n\n###\
    \ 链式的可视化\n\n```\nObject.prototype\n↑\nAnimal.prototype\n↑\nDog.prototype\n↑\n\
    myDog\n```\n\n在图中：\n● `myDog`：你特定的狗对象（例如，一只名叫 Max 的金毛猎犬）。\n● `Dog.prototype`：所有狗的原型，包含共享的类狗特征（例如，一个\
    \ `bark` 方法）。\n● `Animal.prototype`：所有动物的原型，包含更通用的特质（例如，一个 `eat` 方法）。\n● `Object.prototype`：所有对象的根，提供了如\
    \ `toString()` 等基础方法。\n\n### 查找过程\n\n假设你尝试调用 `myDog.bark()`。以下是 JavaScript 找到该方法的流程：\n\
    \n1. 检查 `myDog`：`myDog` 是否直接定义了 `bark` 方法？如果是，调用它并停止。\n2. 检查 `Dog.prototype`：狗的原型是否有\
    \ `bark` 方法？如果是，调用它并停止。\n3. 检查 `Animal.prototype`：动物的原型是否有 `bark` 方法？如果是，调用它并停止。\n\
    4. 检查 `Object.prototype`：基础原型是否有 `bark` 方法？如果是，调用它。\n5. 未找到：如果在链的任何地方都未找到方法，JavaScript\
    \ 将抛出错误。\n\n### 代码示例\n\n```javascript\nconst animal = {\n  eat() { console.log(\"\
    Yum!\"); }\n};\n\nconst dog = Object.create(animal);\ndog.bark = function() {\
    \ console.log(\"Woof!\"); };\n\ndog.eat();    // 输出: \"Yum!\" (继承自 animal)\ndog.bark();\
    \  // 输出: \"Woof!\" (直接在 dog 对象上)\ndog.sleep(); // Error: dog.sleep is not a function\
    \ (在原型链中未找到)\n```\n\n### 关键点\n● **效率**：原型链允许高效的内存使用。对象只存储它们特有的属性，而不是它们继承的属性。\n\
    ● **灵活性**：你可以在运行时修改原型，动态地改变对象的行为。\n● **Object.prototype**：每个对象最终都继承自 `Object.prototype`，从而访问通用方法。\n\
    ● **顺序很重要**：JavaScript 从下到上搜索原型链，从对象本身开始。\n\n## 原型继承的实践\n\n原型继承是让 JavaScript 对象模型运行的机制。它允许你创建从其他对象继承特征的对象，形成一个层次结构。\n\
    \n### Object.create()：继承工具\n\n`Object.create()` 方法是创建具有显式原型对象的关键。让我们来看看它的实际效果：\n\
    \n```javascript\n// 父级原型\nconst vehicle = {\n  startEngine() {\n    console.log(\"\
    Engine starting...\");\n  }\n};\n\n// 子对象\nconst car = Object.create(vehicle);\n\
    car.brand = \"Toyota\";\ncar.model = \"Camry\";\ncar.drive = function() {\n  \
    \  console.log(\"Driving...\");\n}\ncar.startEngine(); // 输出: \"Engine starting...\"\
    \ (继承自 vehicle)\nconsole.log(car.brand); // 输出: \"Toyota\" (car 上的直接属性)\ncar.drive();\
    \ // 输出: \"Driving...\" (car 上的直接方法)\n```\n\n在此示例中：\n1. 我们创建了一个带有 `startEngine`\
    \ 方法的 `vehicle` 对象。\n2. 我们使用 `Object.create(vehicle)` 创建了一个继承自 `vehicle` 的 `car`\
    \ 对象。\n3. `car` 对象拥有自己的属性（`brand` 和 `model`）和一个方法（`drive`）。\n4. 当我们调用 `car.startEngine()`\
    \ 时，在 `car` 对象本身上没有找到它，因此 JavaScript 在原型链中查找 `vehicle`，并在那里找到了并执行了该方法。\n\n###\
    \ 动态原型：更改继承\n\n原型继承最强大的方面之一是你可以在运行时修改原型。这种更改会影响所有继承自该原型的对象。\n\n```javascript\n\
    vehicle.startEngine = function() {\n  console.log(\"Engine starting with a roar!\"\
    ); // 修改后的方法\n};\n\ncar.startEngine(); // 输出: \"Engine starting with a roar!\"\
    \n```\n\n尽管我们没有直接修改 `car` 对象，但它现在从它的原型继承了修改后的 `startEngine` 方法。\n\n### Object.create()\
    \ 的灵活性\n\n与构造函数不同（构造函数的原型在函数定义时就是固定的），`Object.create()` 允许你动态选择原型。这让你对继承关系有了更精细的控制，并允许你创建复杂的对象层次结构。\n\
    \n### 核心收获\n● 原型继承允许对象通过原型链共享属性和方法。\n● `Object.create()` 是一个强大的工具。\n● 修改原型会影响所有继承自该原型的对象。\n\
    \n通过理解原型继承，你将深入理解 JavaScript 的对象模型并创建更灵活、复用的代码。\n"
- fmt: "\nBy understanding this distinction, you’ll be able to navigate JavaScript’s\
    \ prototypal inheritance system with greater clarity and confidence.\n\n## The\
    \ Power and Flexibility of Prototypal Inheritance\n\nPrototypal inheritance brings\
    \ a distinct set of advantages and flexibility to JavaScript’s object-oriented\
    \ programming style, setting it apart from traditional class-based inheritance.\n\
    \n### Dynamic Nature: Objects Evolve on the Fly\n\nOne of the most powerful features\
    \ of prototypal inheritance is its dynamic nature. Unlike class-based inheritance,\
    \ where an object’s structure is fixed at creation time, JavaScript prototypes\
    \ can be modified at runtime. This means you can add, remove, or change properties\
    \ and methods of a prototype, and these changes will instantly be reflected in\
    \ all objects that inherit from that prototype.\n\n```javascript\nfunction Animal(name)\
    \ {\n  this.name = name;\n}\n\nconst dog = new Animal(\"Max\");\nAnimal.prototype.makeSound\
    \ = function() { // Adding a new method to the prototype\n  console.log(\"Generic\
    \ animal sound!\");\n};\n\ndog.makeSound(); // Output: \"Generic animal sound!\"\
    \n```\n\nThis dynamism allows for incredible flexibility and adaptability in your\
    \ code. You can create objects that evolve over time, responding to changing requirements\
    \ or user interactions.\n\n### Object Composition: Mix and Match Traits\n\nPrototypal\
    \ inheritance enables a powerful pattern called object composition. Instead of\
    \ creating deep inheritance hierarchies, you can compose objects by combining\
    \ features from different prototypes. This allows for greater flexibility and\
    \ reusability of code.\n\n```javascript\nconst barker = {\n  bark() {\n    console.log(\"\
    Woof!\");\n  }\n};\n\nconst swimmer = {\n  swim() {\n    console.log(\"Swimming...\"\
    );\n  }\n};\n\nconst dog = Object.create(animal);\nObject.assign(dog, barker,\
    \ swimmer); // Combining traits from different prototypes\ndog.eat();    // Output:\
    \ \"Max is eating.\" (Inherited from Animal)\ndog.bark();   // Output: \"Woof!\"\
    \ (From barker)\ndog.swim();   // Output: \"Swimming...\" (From swimmer)\n```\n\
    \n### Avoiding Class-Based Inheritance Pitfalls\n\nJavaScript’s prototypal inheritance\
    \ model sidesteps some of the potential pitfalls of class-based inheritance:\n\
    \n- **Fragile Base Class Problem**: Changes to a base class can have unintended\
    \ consequences on derived classes. In prototypal inheritance, you can modify prototypes\
    \ without breaking existing objects.\n- **Rigid Hierarchy**: Class-based inheritance\
    \ can lead to deep and rigid hierarchies that are difficult to change. Prototypal\
    \ inheritance encourages a more flexible and modular approach.\n\n### In Summary,\
    \ prototypes and prototypal inheritance are at the heart of JavaScript’s object\
    \ model. They provide a powerful and flexible mechanism for code reuse, dynamic\
    \ object behavior, and object composition. By understanding these concepts, you\
    \ can harness the full power of JavaScript’s unique object-oriented capabilities\
    \ and write cleaner, maintainable, and more expressive code.\n\n## Chapter Summary\n\
