  md: "# Style Multiple Elements\n\nOften designers need to apply an identical set\
    \ of style properties to more than one. For example, you may want all of your\
    \ headings to use the same font family, share the same color, and have the same\
    \ border applied. Using a single combined CSS selector, you can set all of these\
    \ properties together, saving you initial development time as well as maintenance\
    \ time in the future because you can alter the appearance of all the elements\
    \ by changing a single rule. Combined selectors are created by simply having a\
    \ comma-separated list of elements as the selector.\n\n# Style Multiple Elements\n\
    \n+   1 In your editor, open a page that contains an embedded style sheet.\n\n\
    ```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML401 Transitional//EN\"\n\"http://www.w3.org/TR/html4/transitional.dtd\"\
    >\n<html>\n<head>\n<title>Information</title>\n<style type=\"text/css\">\nbody\
    \ {\n  font-family: Arial, Helvetica, sans-serif;\n  font-size: 90px;\n  color:\
    \ #FFC5C5;\n  background-image:url(\"images/flowers.gif\");\n  background-repeat:\
    \ no-repeat;\n  background-position: 550px 0;\n  margin:0;\n}\nh1 {\n  text-transform:\
    \ uppercase;\n  padding-left: 20px;\n}\n```\n\n+   2 Within the style sheet, type\
    \ a list of elements you want to apply a style. Separate the elements commas,\n\
    \n+   3 Press Enter.\n\n+   4 Type {.\n\n```\nbody {\n  font-family: Arial, Helvetica,\
    \ sans-serif;\n  font-size: 90px;\n  color: #FFC5C5;\n  background-image:url(\"\
    images/flowers.gif\");\n  background-repeat: no-repeat;\n  background-position:\
    \ 550px 0;\n  margin:0;\nnh1 {\n  text-transform: uppercase;\n  padding-left:\
    \ 20px;\n  margin-top: 0;\n  margin-bottom: 10px;\n  width: 520px;\n  border:\
    \ 1px dashed #540907;\n```"
