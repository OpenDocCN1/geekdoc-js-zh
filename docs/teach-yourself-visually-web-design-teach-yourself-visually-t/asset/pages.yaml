  md: '# # Create an Embedded Style Sheet


    Embedded style sheets place the style rules directly within an HTML page. They
    are a useful starting point in learning CSS because you only have to refer to
    one document. Embedded styles are placed in the head of the document with a `<style>`
    tag. The tag has a required attribute, `type`, which is always set to a value
    of text/css. Be sure to add the closing `</style>` tag, because without it the
    browser does not display anything on the page.


    # ## Create an Embedded Style Sheet


    +   1. In your editor, open the page into which you want to add the styles.


    ![](img/786eec77afb1e5789b8be7c26fd20881_111_0.png)


    +   2. Within the head section, type `<style>`.'
