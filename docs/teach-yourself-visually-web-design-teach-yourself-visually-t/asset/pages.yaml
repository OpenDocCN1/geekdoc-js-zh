  md: '# Control Background Image Tiling


    By default, background images tile both horizontally and vertically. The background-repeat
    property allows you to control this behavior. A value of repeat-x causes the image
    to only tile horizontally; repeat-y creates a vertical tile, and no-repeat prevents
    tiling altogether. If you use an image with a transparent background, the background
    color of the page shows the transparent areas of the image. You may want to use
    a background color on the page even if the image is not transparent as a fallback
    in the case image fails to load.


    # Control Background Image Tiling


    +   1. In your editor, open a document that contains an embedded style sheet and
    an existing body declaration with a background-image rule.


    +   2. With the declaration, background-repeat: repeat?, with either repeat-x,
    repeat-y, or no-repeat.


    ![](img/786eec77afb1e5789b8be7c26fd20881_125_0.png)


    +   When viewed in a browser, the image either repeats horizontally, vertically,
    or not at all.


    ![](img/786eec77afb1e5789b8be7c26fd20881_125_1.png)'
