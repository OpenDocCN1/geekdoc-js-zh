  md: '# Use Pseudo-Elements


    pseudo-element is a special selector type that allows to target an element in
    special situations. For example, you can use the :first-line pseudo-element to
    apply a style only to the first line of an element, whereas the first-letter pseudo-element
    applies to the first character within the specified element. The pseudo-element
    is separated from the element by a colon: to style the first line of a paragraph,
    you use p:first-line. CSS also recognizes before-and-after pseudo-element, but
    some browsers do not properly support them.


    # Use Pseudo-Elements


    +   1 In your editor, open a page that contains an embedded style sheet.


    ```

