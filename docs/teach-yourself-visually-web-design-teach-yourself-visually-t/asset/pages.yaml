  md: '# Understanding Search Engine Optimization


    Search engines are a primary way that many users will find your site, ensuring
    that your pages appear as high as possible in the results is a key factor in increasing
    the number of site visitors. In the early days of the Web, the first search engines
    were created to help users find information in the exponentially increasing number
    of sites. These early search engines relied on Webmasters to self-describe their
    pages in HTML by adding keywords and descriptions of the page content. Today,
    search engines use a much more complex system to index sites.


    # PageRank and Google


    While Larry Page and Sergey Brin were graduate students at Stanford University,
    they developed a new algorithm that relied primarily on linking to a page. Their
    basic theory was that although a Webmaster might use misleading keywords on a
    page, other Webmasters would fail to penetrate the false connection because the
    other Webmaster would not provide links to it. This, dubbed PageRank, became the
    basis for the company Google, a company Page and Brin founded in 1998.


    ![](img/786eec77afb1e5789b8be7c26fd20881_341_0.png)


    # Content Is King


    By far the most important key to getting good search engine rankings is to have
    good, meaningful content and to be use the proper HTML elements to code that content.
    Search engines read the code to your page, and give more weight to text enclosed
    in heading tags than those in, say, paragraphs, the logic being that the text
    in headings is what the page is “about.”


    ```

    <h1>Welcome to my page!</h1>

    <h1>Search ends here!</h1>

    <h2>Visually</h2>

    <h2>Reviews</h1>

    ```


    # Consider Accessibility for Search Optimization


    Because search engines read the code of the page, they approach your page in many
    of the same ways as screen readers for blind users do. So, in general, pages accessible
    to disabled users will get higher search engine rankings than those that are not.


    ![](img/786eec77afb1e5789b8be7c26fd20881_341_1.png)'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# CHAPTER 14

    Publishing Your Site and Getting Noticed


    # Avoid All-Image Image Pages


    Pages made up of nothing but images rank much lower due to their lack of meaningful
    text for the search engines to read. A mockup created in a program such as Fireworks
    can be a useful starting point in design, but converting this mockup directly
    into a Web page as a large image will rate very low on search engine results.
    It will also load very slowly and be difficult to edit later. Instead, take the
    mock-up as a guide for the layout, and re-create it in HTML.


    ![](img/786eec77afb1e5789b8be7c26fd20881_342_0.png)


    # Do Not Rely on Search Engine Optimization Alone


    Not every site is necessarily going to benefit from high search engine rankings.
    Sites that are part of a larger marketing strategy may not rely heavily on search
    engine results at all. Placing the site''s address on billboards or television
    advertisements may be, if not more, effective than worrying about one''s Google
    PageRank. Word of mouth can be an effective strategy, as can the use of social
    networking sites such as MySpace or Facebook, particularly for blogs or small,
    more local sites. Search engine optimization should fit within the site''s overall
    marketing strategy.


    ![](img/786eec77afb1e5789b8be7c26fd20881_342_1.png)


    # Follow Search Engine Guidelines


    Every of the major search engines makes a set of guidelines available to assist
    Webmasters in building pages that get higher rankings. These rules are not set
    in stone, and in fact, search engines change them frequently, but they should
    be observed as much as possible.


    ![](img/786eec77afb1e5789b8be7c26fd20881_342_2.png)'
  merge: -1
  pgno: 342
