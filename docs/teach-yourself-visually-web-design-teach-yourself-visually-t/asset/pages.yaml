  md: '# Add Paragraphs


    Any logical block of text not already defined as a heading is likely to be a paragraph.
    XHTML designates paragraphs using the <p> tag. You should wrap each logical block
    of text within this tag. When displayed within the browser, paragraphs appear
    with a blank line both above and below, rather than indenting the first line.
    Keep in mind that XHTML ignores whitespace in your code, so simply adding line
    breaks between blocks of text does not create space in the browser; you need to
    use the <p> tag.


    # Add Paragraphs


    +   1 Open the page to which you want to add text.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html1/DTD/html1-transitional.dtd">

    <html>

    <head>

    <title>My First Page</title>

    </head>

    <body>

    <h1>welcome to my page!</h1>

    </body>

    </html>",

    ```


    +   2 Type <p>.

    3 Type text.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html1/DTD/html1-transitional.dtd">

    <html>

    <head>

    <title>My First Page</title>

    </head>

    <body>

    <h2>welcome to my page!</h2>

    <p>Please take a few minutes to look around the site.</p>

    </body>

    </html>

    ```'
