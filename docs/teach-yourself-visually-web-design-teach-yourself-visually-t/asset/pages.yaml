  md: '# Replace the Logo Placeholder


    Sometimes, you need to design the layout of the page before you receive the content,
    including the images. Dreamweaver includes a feature called an image placeholder
    that allows you to place the HTML <img> tag on your page and easily replace it
    later with the actual image. When you receive the final image, you can use the
    Properties panel at the bottom of the screen to point to the correct image. The
    starter pages by Dreamweaver include a placeholder image in the header designed
    to allow you to quickly add your own.


    # Replace the Logo Placeholder


    +   - Double-click the logo placeholder.

    - Select The Image Source dialog boxes.

    - Navigate to your images directory.

    - Select your logo.

    - Click OK.


    ![](img/786eec77afb1e5789b8be7c26fd20881_197_0.png)


    The logo appears on the page.


    ![](img/786eec77afb1e5789b8be7c26fd20881_197_1.png)


    184'
