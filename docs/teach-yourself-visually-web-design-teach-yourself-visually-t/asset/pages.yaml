  md: '# Insert New data into a Table with PHP (continued)


    Once you have created your form, you must create the PHP page to process the form.
    In this case, the page must contain a SQL INSERT INTO statement to add the record
    to the database. INSERT INTO statement takes the name of the table, followed by
    a list of the fields into you will be adding data. Then you use the VALUES keyword
    followed by a list of the fields that contain the new data. Once complete, use
    the PHP header() function to redirect your user to a page that displays the results
    in the table.


    # Insert New data into a Table with PHP


    +   Create the PHP Script

    1 In your editor, open a new PHP page.

    2 Delete any existing code your editor might add so the page is completely blank.

    3 Type <?php.

    4 Type include("??"); replacing with the path to your database connection script.

    5 Type $formfield1 = $_POST[''formfield1'']; replacing formfield1 with the name
    of the first field from the form.

    6 Repeat Step 5 to create shorter names for the remaining fields.

    7 Type $query = "INSERT INTO table (field1, field2) VALUES (''$formfield1'', ''$formfield2'')"
    replacing table with the name of the table, field1 and field2 with the names of
    the database fields, and $formfield2 with the variables created in Steps 5 and
    6.


    ![](img/786eec77afb1e5789b8be7c26fd20881_327_0.png)


    ```

    <?php

    include("../database.php");

    $firstname = $_POST[''firstname''];

    $lastname = $_POST[''lastname''];

    $email = $_POST[''email''];


    $query = "INSERT INTO customers (firstname, lastname, email) VALUES (''$firstname'',
    ''$lastname'', ''$email'')";

    $data = mysql_query($query);

    header("location: customers.php");

    ?>

    ```


    Note: See the "Display the Contents of a Table on a Web Page" earlier in this
    chapter for creating this page.'
