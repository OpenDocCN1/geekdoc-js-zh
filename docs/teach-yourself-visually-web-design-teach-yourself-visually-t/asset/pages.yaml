  md: '# Understanding the Importance of Planning Your Site


    Although you may be tempted to sit down at your computer and start coding your
    site, good Web sites do not come together by chance. Rather, careful planning
    is needed to ensure that your site''s content is organized logically, that site
    fits your users'' needs, and that your navigation works and is intuitive. Planning
    a site may not be the most exciting task in the overall process, but it is perhaps
    the most important. In general, well-planned sites come together much quickly
    and are more likely to end up something you are proud of.


    # Brainstorm Design Concepts


    Most successful finished designs are the result of taking parts from several ideas
    and combining them into a whole. In your brainstorming session, whether you are
    working alone or in a team, always remember that no idea should be rejected out-of-hand.


    ![](img/786eec77afb1e5789b8be7c26fd20881_24_0.png)


    # Wireframe of the Design


    A wireframe is simply a representation of the site''s structure and layout. It
    does not need to be fancy — many wireframes are simply boxes with labels — but
    you should try to get proportions correct to make sure the design works. You can
    draw the wireframes by hand or use a graphics program such as Adobe Fireworks.


    ![](img/786eec77afb1e5789b8be7c26fd20881_24_1.png)


    # Storyboard Pages


    Storyboards provide more detailed representations of your design. You can use
    storyboards to see how the color scheme from your project will work and begin
    to get an idea of what graphics you might use. You can create a storyboard for
    each page in your site, although sites with animated elements may require multiple
    storyboards.


    ![](img/786eec77afb1e5789b8be7c26fd20881_24_2.png)


    # Develop a Timeline for Completion


    If you are working for a client or developing a Web site for your company, you
    need to discuss with your client or boss a realistic timeline that includes deadlines
    along the way in which you can complete the project. If you are creating a personal
    site, the timeline can be just as important to keep you on your track.


    ![](img/786eec77afb1e5789b8be7c26fd20881_24_3.png)'
  merge: -1
