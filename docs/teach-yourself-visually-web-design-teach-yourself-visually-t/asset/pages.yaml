  md: '# # Introduction to JavaScript and Ajax


    In the early days of the Web, a need arose to allow designers to provide some
    of interactivity for their users. Netscape, at the time the developer of the most
    popular browser, created a lightweight scripting language for that purpose. Named
    JavaScript, it was first introduced by the Netscape 2 browser in 1996. Although
    attempts were made to creating competing languages, eventually every browser adopted
    JavaScript in its browsers. The European Computer Manufacturers Association maintained
    a standardized version, known more formally as ECMAScript.


    # ## JavaScript


    JavaScript is text-based, and can be written in any text editor. Almost all editors
    designed for writing Web pages, whether they are code-based or visual editors,
    likely provide help in the form of code hints and syntax highlighting for JavaScript.


    ![](img/786eec77afb1e5789b8be7c26fd20881_221_0.png)


    # ## Running JavaScript


    In order to run, your JavaScript code must be interpreted by an application. In
    most cases, the application being used to run it will be a browser. However, many
    other applications support JavaScript in some form today, so you might encounter
    it being used elsewhere.


