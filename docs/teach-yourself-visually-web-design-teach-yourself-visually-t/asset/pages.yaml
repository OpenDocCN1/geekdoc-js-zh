  md: '# Use the Cascade


    You can have CSS declarations in both an external style sheet and an embedded
    css. In this case, the order of the cascade specifies that the embedded styles
    override conflicts with the external styles. This can be used to your advantage
    because it allows you to have page-specific formatting for select elements while
    still maintaining the overall look and feel of the site. You should understand
    that only those styles in direct conflict are overridden. As much as possible,
    the browser attempts to use both the external and embedded styles together.


