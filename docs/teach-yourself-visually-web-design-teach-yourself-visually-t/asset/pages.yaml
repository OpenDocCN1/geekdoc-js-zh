  md: '# Create Animation Using Flash Professional (continued)


    Flash animates objects in much the same way animation is achieved in traditional
    film: by moving an object slightly in a series of frames, and then playing those
    frames back quickly enough to fool the eye into believing the object is moving.
    Flash has a process called tweening where you, the designer, need only specify
    the starting and ending points of the animation. Flash handles positioning the
    shape in each frame. By default, tween lasts for 24 frames, the equivalent of
    one second, but you can adjust its length using the Timeline panel.


    # Create Animation Using Flash Professional (continued)


    +   13 Right-click (Control +click) the symbol on the stage.


    +   14 Select Create Motion Tween.


    ![](img/786eec77afb1e5789b8be7c26fd20881_241_0.png)


    +   The tween is created. The Timeline panel displays the tween over 24 frames.


    +   15 On the stage, move the shape to the point at which you want the animation
    to end.


    ![](img/786eec77afb1e5789b8be7c26fd20881_241_1.png)'
  merge: -1
