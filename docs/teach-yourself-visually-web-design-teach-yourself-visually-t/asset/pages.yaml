  md: '# CHAPTER 1


    # The Tools of Web Design and Planning Your Site


    Before you can dive into creating Web sites, you need to understand the tools
    that you need. This chapter shows you the software you need to create Web pages,
    add images to them, and preview the finished products. However, software alone
    cannot make a good Web site. You need to carefully plan your site’s content, design
    and overall structure in order to create a site. Therefore, this chapter also
    details those steps you should undertake to plan your site before you begin building
    it.'
