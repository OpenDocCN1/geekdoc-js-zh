  md: '# Preview the Page Using Live View


    Dreamweaver''s Live view uses a real browser rendering engine to display your
    page exactly as it would appear in a browser, without requiring you to leave the
    page. The rendering engine used in Live view is the same as that used by Apple''s
    Safari and Google''s Chrome browser, among others. You can follow hyperlinks and
    navigate through your site in Live view, but you cannot edit your page in Live
    view. However, you can use Dreamweaver''s Split view to look at your page in Live
    view while you view — edit — the source code.


    # Preview the Page Using Live View


    +   On the toolbar, click Live View.


    The page appears in Live view.


    ![](img/786eec77afb1e5789b8be7c26fd20881_213_0.png)


    +   Click Design.


    The page returns to Design view.


    ![](img/786eec77afb1e5789b8be7c26fd20881_213_1.png)


