  md: '# Add Data Tables


    Tables allow you to present large blocks of data to your users in an organized
    fashion, such as phone lists, product specification grids, and calendars. HTML
    uses a set of three tags to define basic tables. The <table> tag defines the table
    itself. Each row of the table is defined by the table row, tr. Then each cell
    is created using the <td> element, which is short for table data. Each of these
    tags wraps around the other, so a <td> can appear only between the opening and
    closing tr, which in turn appear within a <table> tag.


    # Add Data Tables


    +   In your editor, open a new HTML document that contains the basic HTML tags.


    ![](img/786eec77afb1e5789b8be7c26fd20881_175_0.png)


    +   Within the body, type <table>.


    +   Press Enter.


    +   Type <tr>.


    +   Press Enter.


    +   Type <td>.


    +   The contents of the first cell of the table.


    +   Type </td>.


    Note: The code shown has been indented using Tab. This is not required, but highly
    recommended.'
  merge: -1
  pgno: 175
