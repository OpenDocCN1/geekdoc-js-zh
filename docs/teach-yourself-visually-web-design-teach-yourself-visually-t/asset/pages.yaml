  md: '# Connect PHP to the Database


    In order for your PHP pages to display database information, you need to connect
    PHP to the MySQL server. To do this, you can call the PHP mysql_connect function,
    which takes three arguments: the address to the server, the username, and the
    password. Once you have connected, you can call the mysql_select_db function,
    which takes a single argument: the name of the database on the server you will
    be using. Although these can be placed in each file, it is much easier to put
    these functions in their own file, which can be included into other PHP documents
    as needed.


    +   1. In your editor, open a new, blank document.


    +   2. Type <?php.


    ![](img/786eec77afb1e5789b8be7c26fd20881_315_0.png)


    +   3. Type mysql_connect (''localhost'', ''root'');


    Note: A default installation of MAMP and WAMP does not set up passwords, so you
    do not need to provide one in this example.


    ![](img/786eec77afb1e5789b8be7c26fd20881_315_1.png)'
