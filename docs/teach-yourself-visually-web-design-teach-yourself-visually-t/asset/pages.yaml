  md: "# Add an Image to Your Web Page\n\nYou can use the HTML `<img>` tag to add\
    \ images to your page. The tag has a required attribute src, which takes a relative\
    \ or absolute file path to the image you are adding. Unlike other tags you have\
    \ worked with, `<img>` is an empty tag, meaning it does not wrap around text,\
    \ but instead stands alone as an instruction to the browser to place an image\
    \ at that point. If you are using an XHTML document type, you must end the tag\
    \ with a closing slash to designate it as empty.\n\n# Add an Image to Your Web\
    \ Page\n\n+   - Open the page that you want to add the image in your Web editor.\n\
    \n```\n```html\n<!DOCTYPE html PUBLIC-//W3C//DTD HTML 1.0 Transitional//EN\"\n\
    \ \"http://www.w3.org/TR/html1/DTD/html1-transitional.dtd\">\n<html>\n<head>\n\
    <title>Magazines Now Home Page</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
    ```\n\n+   - Within the body, type `<img src=\"\">`, replacing ? with the path\
    \ to your image.\n\n```\n```html\n<!DOCTYPE html PUBLIC-//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n \"http://www.w3.org/TR/html1/DTD/html1-transitional.dtd\">\n<html>\n<head>\n\
    <title>Magazines Now Home Page</title>\n</head>\n<body>\n<img src=\"images/logo.gif\"\
    >\n</body>\n</html>\n```\n```"
