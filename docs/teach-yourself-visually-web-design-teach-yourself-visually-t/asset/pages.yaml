  md: '# Create an External Style Sheet


    You can ensure that you maintain a consistent look and feel to your entire site
    as we make it quite simple to modify your design site-wide by relying on one of
    the most powerful features of CSS: the ability to define styles independent of
    a particular document. By separating your content and presentation into distinct
    documents, you can apply the styles to as many HTML documents as you want. The
    external styles document can be reflected throughout all your site''s HTML pages.
    The external style sheet is saved as an independent document, most commonly using
    the .css file extension.


    # Create an External Style Sheet


    +   1 In your editor, open a page that contains an embedded style sheet.


    ![](img/786eec77afb1e5789b8be7c26fd20881_157_0.png)


    +   2 Select everything inside the <style> tag.


    +   3 Click Edit.


    +   4 Cut.


