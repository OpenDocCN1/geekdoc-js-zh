- img_proc: true
  md: '# # Understanding Web Accessibility


    Businesses, generally speaking, do not like to turn away potential customers.
    However, just that on their Web sites when they fail to recognize significant
    numbers of users may have disabilities that limit their ability to navigate the
    Web in the ways nondisabled users can. Navigation that can be accessed only with
    a mouse, video or audio content without captioning, needlessly complex layouts,
    and nonsemantic markup also pose challenges to disabled users. Ignoring accessibility
    on your Web site can drive away customers, and may subject you to legal penalties.


    ## Visual Impairment

    Because the Web is a primarily visual medium, visual impairment is perhaps the
    most important disability to consider when building your site. From total blindness
    to very eyesight, those with visual impairments use applications called screen
    readers to navigate on their computers. Visually impaired users rely almost exclusively
    on their keyboards to navigate within their machine because they obviously cannot
    use a mouse or other pointer device.


    ## Hearing Impairment

    Hearing disabilities, of course, become an issue if your site contains audio content,
    usually in videos. You need to ensure that any content delivered through audio
    channels is also available in a nonaudio format, either through closed captioning
    or similar technologies or through a text transcript of the audio.


    ## Color Blindness

    A very significant percentage of people, mostly men, suffer from some degree of
    color blindness. Although extreme cases involve the complete inability to see
    color, most people suffer from lesser degree of color blindness whereby they are
    simply unable to distinguish between certain shades of color, or even differences
    between colors if they lack sufficient contrast.


    ## Cognitive Disabilities

    Those with cognitive disabilities, such as learning disorders or dyslexia, will
    have a difficult time understanding your site''s content unless you take these
    disabilities into consideration and create content that can be easily understood.


    ## Mobility Impairment

    Aloft of Web professionals now understand, and take into consideration, visual
    impairment, many still ignore mobility impairments. They mistakenly believe that
    as long as a person can see, they can use any Web site. However, many people with
    mobility impairments lack the full use of their hands, which in turn means that
    they cannot use a mouse.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# CHAPTER

    10

    Making Sites Accessible


    # Accessibility Is Not Hard or Expensive


    A common myth is that creating accessible Web pages is difficult and expensive.
    If you plan for accessibility from the beginning of your development process and
    adhere to Web standards, you will discover that your pages end up being mostly
    accessible without any additional work, and thus you incur little additional development
    cost.


    # Accessibility and the Law


    Many jurisdictions have laws requiring Web sites to be accessible. In the United
    States, for example, an amendment to the Rehabilitation Act, commonly referred
    to as Section 508, requires government sites to be accessible, and a growing body
    of legal precedent is forcing private industry to follow suit. Be sure to check
    your local and federal regulations to see what requirements might apply in your
    area.


    # Benefits to Nondisabled Users


    Almost everything you do to make your site accessible also benefits users who
    do not have disabilities. Videos with closed captions can be viewed by users in
    office environments who cannot turn on sensors. Pages with logical layouts and
    well-written content are easy for everyone to follow and understand. Menus that
    do not require mousing over small targets are easier to follow.


    ![](img/786eec77afb1e5789b8be7c26fd20881_256_0.png)


    # Accessibility and Search Engines


    Google has sometimes been the largest blind user on the Web. The search engine
    and its competitors do not care what your pages looks like. Accessible sites are
    those that provide clear, well-written, logically organized content, which are
    precisely the same things search engines look for in cataloging sites. Therefore,
    accessible pages are more likely to get good search engine rankings than nonaccessible
    sites.


    ![](img/786eec77afb1e5789b8be7c26fd20881_256_1.png)'
