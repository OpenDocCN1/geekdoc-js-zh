  md: "# Add Captions and Summaries to Tables\n\nTo ensure accessibility for your\
    \ site, you should never use tables to lay out your page. However, you can and\
    \ should use tables for tabular data. You can also use the <caption> tag to display\
    \ a caption or title immediately above the table. Screen readers for the blind\
    \ linearize the table, meaning they read top to bottom. A summary, inserted into\
    \ the opening <table> provides users with an overview of the table's structure\
    \ and its contents to help them make sense of what they hear.\n\n# Add Captions\
    \ and Summaries to Tables\n\n+   In your editor, open an HTML page that includes\
    \ a <table>\n\n```\n<table>\n  <tr>\n```\n\n```\n  <tr>\n    <td>Name</td>\n \
