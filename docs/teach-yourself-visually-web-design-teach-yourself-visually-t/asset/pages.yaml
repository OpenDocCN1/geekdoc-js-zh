    How can I force user to select one of the radio buttons?

    Like check boxes, radio buttons take an optional checked value to preselect one.
    However, a user can deselect the check box without selecting another, submitting
    the form with no check boxes selected. If you preselect a radio button, you can
    deselect it only by choosing another button in the group. Thus, preselecting a
    radio button with the checked attribute in essence forces your user to select
    at least one of the buttons.'
