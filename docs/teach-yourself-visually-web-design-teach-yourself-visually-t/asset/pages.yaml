    Can I allow my user to select more than one option at a time?


    Yes You can add the multiple attribute to the <select> tag. In HTML, you simply
    type multiple; in XHTML, you need to write multiple="multiple". You can also add
    a size attribute, with a value set to the number of options you want to have the
    list show without scrolling.


    How can I choose more than one option when I have the multiple attribute set?


    You can press and hold Shift to select contiguous options. For noncontiguous selection,
    you can press and hold Ctrl on Windows or Cmd on a Mac. You should provide these
    instructions on your page for your users.'
