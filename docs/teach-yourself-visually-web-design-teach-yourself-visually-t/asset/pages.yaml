  md: '# Introduction to CSS


    HTML is a language designed to define the structure of a document. As it evolved,
    tags were added to HTML to handle formatting, but these were difficult to work
    with, difficult to edit, and added considerably to the page''s size. Cascading
    Style Sheets (CSS) was introduced to solve all of these issues as well add additional
    formatting controls. With CSS, you can change your text properties, controlling
    the spacing between elements on your page, draw borders, add images, and more.
    You can use CSS to format any Web page, regardless of the version of HTML or XHTML
    you are using.


    Writing CSS

    Like HTML, CSS documents are plain text and can be written in any text editor.
    Modern HTML editors include support for CSS as well, so the editor in which you
    are writing your HTML should also work for your CSS.


    ![](img/786eec77afb1e5789b8be7c26fd20881_109_0.png)


    CSS Syntax

    The syntax of CSS is quite a bit different from HTML. documents are made up of
    a series of rules. Each rule includes a selector and a declaration. Selectors
    are case-sensitive, whereas the values and properties that make up declarations
    are not. Like HTML, CSS is whitespace-insensitive.


    ![](img/786eec77afb1e5789b8be7c26fd20881_109_1.png)


    Selectors

    Selectors define the parts of the HTML document to which the rules will apply.
    Selectors can be HTML elements, or they can correspond to the values of ID or
    class attributes within HTML. More complex selectors allow you to apply rules
    based on their position relative to other elements.


    ```

    <h1> <item> <style>

    SELECTORS

    h1 item style

    ```


    Declarations

    CSS declarations are made up of properties and values. The properties define the
    category of formatting to be applied. The property is set to a value. Properties
    and their values are separated by a colon, and each pair ends in a semicolon.
    All of the declarations to be applied to a particular selector are enclosed within
    curly braces. You can find a list of properties and values available in CSS in
    HTML, XHTML, and CSS: Your visual blueprint for designing effective Web pages
    (Wiley, 2008).


    ![](img/786eec77afb1e5789b8be7c26fd20881_109_2.png)'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Embedded Style Sheets


    Styles that you want to apply to one particular Web page can be embedded directly
    within the page by placing a <style> tag block in the head of the document and
    then putting your style rules within the tag block.


    ![](img/786eec77afb1e5789b8be7c26fd20881_110_0.png)


    # External Style Sheets


    Groups of styles can be combined in a single document, with a .css extension,
    to create an external style sheet. External style sheets can be linked to any
    number of HTML documents, so you can create a single style sheet that defines
    and controls the formatting of your entire Web site.


    ![](img/786eec77afb1e5789b8be7c26fd20881_110_1.png)


    # Inline Styles


    Style properties and values can be placed directly within HTML tags using the
    style attribute. This is the least flexible method of applying CSS and should
    be avoided if at all possible because it makes it much more difficult to maintain
    a consistent look and feel for your site.


    ![](img/786eec77afb1e5789b8be7c26fd20881_110_2.png)


    # Browser Support


    Today, most modern browsers support CSS in the same way. You will still find issues
    with older browsers, such as Microsoft Internet Explorer 6, so you should carefully
    test your pages to be sure that they display the way you want them to.


    ![](img/786eec77afb1e5789b8be7c26fd20881_110_3.png)'
