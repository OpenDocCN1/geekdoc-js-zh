  md: '# Understanding Relational Databases


    A database, in the simplest terms, is a structured collection of information,
    or records. Computer databases can be used to store massive amounts of information
    in a format that makes it easy to sort and find specific data points. Early databases
    were first developed in the years following World War II. In the 1970s, a new
    model was proposed that more efficient data storage would be possible if databases
    were created as a series of related tables. Today, almost every major database
    system on the market follows this relational database model.


    # Database Management Systems


    A computer program that stores data is technically called a Database Management
    System, or DBMS. Many hundreds of DBMS systems are available today, and Web developers
    mostly rely on one of three for their work: Microsoft SQL Server, MySQL, and Oracle.
    Each has advantages and disadvantages. Due to its close relationship to PHP and
    its inclusion in the WAMP and MAMP installers, this book looks at MySQL.


    ![](img/786eec77afb1e5789b8be7c26fd20881_307_0.png)


    # Relational Databases


    A relational database is one that stores its information in a collection of tables.
    Each table stores data about one specific topic. For example, in a database with
    product ordering information, the details about the products would be in a table,
    and the details about the customers would be kept separate in a different table.
    The database can store information about the relationships between the data, so
    it would know which ordered which product.


    # PHP and MySQL


    Although PHP can use a technology called ODBC, or Open Database Connectivity,
    to connect to Microsoft SQL Server, Microsoft Access, or Oracle, it includes the
    ability to directly connect to a MySQL database. This has the advantage of removing
    much of the abstraction and additional overhead required when using ODBC, but
    it means that PHP applications must be written with a specific database in mind.


    ![](img/786eec77afb1e5789b8be7c26fd20881_307_1.png)'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# CHAPTER 13 Adding Information from a Database


    # Structured Query Language


    Also in the 1970s, a group of developers at IBM developed the Structured Query
    Language (SQL). SQL allows developers to write code to execute commands against
    a database. It allows developers to work with relational databases through a powerful
    language that nonetheless relies on a clear syntax.


    ![](img/786eec77afb1e5789b8be7c26fd20881_308_0.png)


    # SQL Syntax


    SQL is designed to be fairly easy to learn and use. It is comprised of a series
    of command words or phrases, all in simple English. For example, if you want to
    add data to a table, you use the `INSERT INTO` command.


    | TABLE |

    | DATA INSERT INTO |

    | DATA INSERT INTO |


    # SQL Language Subsets


    SQL is divided into three sublanguages: the Data Definition Language (DDL), the
    Data Manipulation Language (DML), and the Data Control Language (DCL). The DDL
    is the subset of SQL that allows you to create, alter, and delete the actual tables
    themselves. By far the most commonly used subset of SQL is the DML. These commands
    allow you to interact with your data. The DCL is the subset of SQL that allows
    you to create and manage user accounts.


    ![](img/786eec77afb1e5789b8be7c26fd20881_308_1.png)


