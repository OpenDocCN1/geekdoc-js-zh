  md: '# Use Images as Links


    Images can stand for text in hyperlinks. A common practice is to link the site''s
    logo to its home page. Many sites use graphical buttons for navigational elements.
    You can combine what you already know about creating links with what you know
    about adding images, because an image as a link is nothing more than an <img>
    tag wrapped in an <a> tag. The img src attribute, as normal, points to the image,
    and the href attribute of the anchor, as usual, points to the page to which you
    are linking.


    # Use Images as Links


    +   1 In your editor, open the page on which you want to add a hyperlink around
    an image.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>Magazines Now Home Page</title>

    </head>

    <body>

    <img src="images/logo.gif" alt="/" />

    </body>

    </html>

    ```


    +   2 Before the <img> tag, type a <a href="?"> replacing with the path to the
    page to which you want to link.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>Magazines Now Home Page</title>

    </head>

    <body>

    <a href="index.html"><img src="images/logo.gif" alt="" /></a>

    </body>

    </html>

    ```'
  merge: -1
  pgno: 105
- img_proc: true
