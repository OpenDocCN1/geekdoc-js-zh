  md: '# Create a Drop-Down List


    You can create a drop-down list in HTML with a combination of the <select> tag
    and its child <option> tags. The <select> tag contains the name and, necessary,
    the ID. Each choice within the drop-down is provided with an <option> tag. The
    text that appears in the list is simply the text within the <option> tag. If you
    want to have a slightly different value submitted to the server than that the
    user sees, you can optionally add a value attribute to the tag. A select list
    can contain as many options as you need.


    +   1. In your editor, open an HTML page that contains a form.


    +   2. Within the form, <label for="">, replacing with the ID you plan to use
    for the list.


    +   3. Type list text and </label>.


    ```

    <input type="checkbox" name="widgets" value="greenwidget" id="greenwidget" /><label
    for="greenwidget">Green Widget</label>

