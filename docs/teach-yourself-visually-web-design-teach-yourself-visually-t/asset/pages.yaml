    \ property allows you to control this. The property takes two values, separated\
    \ by commas: the first distance from the top edge, the second distance from the\
    \ left. These distances can be set using any valid unit of measurement. If you\
    \ set the position using pixels, the image remains in place even if the browser\
    \ is resized, but using percentages as the values allows the image to move as\
    \ the browsers.\n\n# Position Background Images\n\n+   - In your editor, open\
    \ a document that contains an embedded style sheet and an existing body declaration\
