    | Simon Tam | Medical | 555-5555 |

    | Harper Fry | Mechanic | 555-4242 |


    TIPS

    Do the header cells have to be in the first row of the table?

    No. For some tables, header cells in the left column make more sense. Others might
    have headers in the first row and the left column, and others might have multiple
    headers. You can use the <th> tag anywhere that logically makes sense to have
    the header.


    Can I have headers that are not bold or centered?

    Yes. Simply use a CSS declaration for the <th> tag, and set font-weight:normal
    to override the bold and text-align:left to override the alignment. You could,
    of course, add other properties as well, perhaps setting the background color
    of the headers or making the font larger.'
