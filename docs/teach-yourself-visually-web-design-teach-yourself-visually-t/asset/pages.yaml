  md: '# Add Background Image


    You can use an image as the background on your page with the CSS background-image
    property. A background image can be placed within any element on the page, although
    putting it in the body so it comprises the entire page is common. Although you
    can in use any JPEG, GIF, or PNG for your background, you should be careful to
    ensure that the image does not distract from the page, so you should pick an image
    that does not contain a lot of contrast and is overall fairly subtle.


