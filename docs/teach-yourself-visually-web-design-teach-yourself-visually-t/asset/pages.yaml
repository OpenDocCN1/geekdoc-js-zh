  md: '# Set Up Your Page for CSS Layouts


    laying out your page using CSS involves applying styles to elements grouped together
    with <div> Tags, so before you can begin learning the properties needed, you must
    create these groups and give them appropriate ID attributes. Before you begin
    coding the page, you should have planned the design of your site. Now you will
    be referring to that design. The site will have several sections — most pages
    will have at least a header, a body, and a footer, and many will also have one
    or more sidebars or additional columns. Each of these sections is represented
    by one of the groups you are creating with the <div> tags.


