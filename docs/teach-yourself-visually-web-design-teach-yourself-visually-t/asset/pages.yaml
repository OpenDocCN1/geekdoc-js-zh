  md: '# Add a Button to Your Form


    In order to submit the data to a server, your user must click a button. HTML offers
    two methods by which a button can be added to the form. The first uses the <input>
    tag with a type attribute set to submit. The second uses the <button> tag, again
    with type set to submit. Both work the same, the one you use is up to you. The
    text that appears on the button varies between browsers, but you can add a value
    attribute to set it to text of your choosing.


    # Add a Button to Your Form


    +   1 In your editor, open an HTML page that contains a form.


    ```

    <input type=''widget'' id=''greenidget'' /><label for=''greenidget''>green widget</label><br>

