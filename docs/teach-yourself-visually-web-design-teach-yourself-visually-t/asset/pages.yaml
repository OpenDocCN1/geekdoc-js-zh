    # What does javascript:void; do in the href attribute?


    In order to have a valid anchor tag, you need an href attribute. However, in this
    example you do not want the user to leave the page when they click the link, but
    instead merely to trigger the script. javascript:void essentially tells the browser
    to ignore the href attribute when the user clicks the link. Many tutorials suggest
    adding a pound sign (#) instead, but some browsers reload the page when you click
    that link, so javascript:void is safer.


