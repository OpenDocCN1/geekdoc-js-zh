  md: "# Apply Logical Formatting\n\nThe formatting of your page can be done through\
    \ either HTML tags or CSS. You should use the HTML tags only when the formatting\
    \ affects the underlying meaning of the page and is not being used purely for\
    \ visual effect. For example, if you want to make the name of your company visually\
    \ stand out by making it bold, you are formatting for visual effect, and should\
    \ use CSS. On the other hand, if you want to emphasize the text, you should use\
    \ HTML.\n\n# Apply Logical Formatting\n\n+   Open the page to which you want to\
    \ add formatting.\n\n```\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.0//EN\"\
    \ \"http://www.w3.org/TR/html4/transitional.dtd\">\n<html>\n<head>\n  <title>My\
    \ First Page</title>\n</head>\n<body>\n  <h1>welcome to my page!</h1>\n  <p>please\
    \ take a few minutes to look around the site.</p>\n  <p>feel free to contact us\
    \ for more information.</p>\n</body>\n</html>\n```\n```\n\n+   Before a word you\
    \ want to make bold, type <strong>.\n\n+   Type <strong><strong></strong> after\
    \ the word.\n\n```\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.0//EN\"\
    \ \"http://www.w3.org/TR/html4/transitional.dtd\">\n<html>\n<head>\n  <title>My\
    \ First Page</title>\n</head>\n<body>\n  <h1>welcome to my page!</h1>\n  <p><strong>please</strong>\
    \ take a few minutes to look around the site.</p>\n  <p><strong>feel</strong>\
    \ free to contact us for more information.</p>\n</body>\n</html>\n```\n```\n\n\
