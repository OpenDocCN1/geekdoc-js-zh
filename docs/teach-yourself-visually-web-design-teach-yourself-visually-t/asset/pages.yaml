  md: "# Include External Files\n\nManaging shared assets such as common header and\
    \ navigation is a problem web designers have faced since the earliest days. Dynamic\
    \ processing of pages offers a very useful solution via includes. An include is\
    \ a directive for PHP to include the contents of a file into another file when\
    \ it is processing. This way, you can have a common element such as your navigation\
    \ in an independent file that included each of your other pages. When you need\
    \ to update the navigation, you simply modify that one.\n\n# Include External\
    \ Files\n\n+   1. In your editor, open a new, blank file.\n\n+   2. Add the HTML\
    \ you want to have in the include file.\n\nNote: This should not be a complete\
    \ file, so the basic HTML structure tags should be omitted.\n\n+   3. Save the\
    \ include into your Web server's root directory.\n\n+   4. In your editor, open\
    \ the file into which you want to include the file created in Steps 1 to 3.\n\n\
    +   5. In the file at the point at which you want the include to appear, type\
    \ ?php.\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n\"http://www.w3.org/TR/html/html-transitional.dtd\">\n<html>\n<head>\n  <meta\
    \ http=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n  <title>Home</title>\n\
    \  <link rel=\"stylesheet\" href=\"styles.css\" type=\"text/css\" />\n</head>\n\
    <body>\n<div class=\"main\" id=\"skipnav\">\n  <div class=\"header\"><a href=\"\
    \"><img src=\"images/logo.png\" alt=\"Insert_logo\" width=\"180\" height=\"90\"\
    \ id=\"Insert_logo\" style=\"display:block\"></a></div>\n  <!-- header -->\n</div>\n\
    <div class=\"sidebar\">\n  <?php\n  <p>Use the links below to explore our site.</p>\n\
    \  <!-- sidebar -->\n?>\n</div>\n</body>\n</html>\n```"
