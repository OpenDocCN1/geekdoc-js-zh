  md: '# Insert a Photoshop Image


    As a part of Adobe''s Creative Suite, Dreamweaver includes features specifically
    designed to work with other Creative Suite tools. Normally, images created in
    Photoshop and saved using their native PSD format cannot be inserted into Web
    pages, but Dreamweaver actually allows you to select a PSD file when you use the
    Insert Image feature. When you select a PSD, Dreamweaver automatically prompts
    you for optimization settings, and saves a copy of the image in your site''s folder
    as a JPEG, GIF or PNG.


    # Insert a Photoshop Image


    +   1 Click the spot on your page where you want to insert the image.

    2 Click Images:Image.


    ![](img/786eec77afb1e5789b8be7c26fd20881_203_0.png)


    +   The Select Image Source dialog box appears.

    3 Navigate to the folder that contains your Photoshop PSD image.

    4 Select the image.

    5 Click OK.'
