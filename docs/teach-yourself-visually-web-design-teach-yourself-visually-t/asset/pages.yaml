  md: "# Group Related Form Elements\n\nThe HTML <fieldset> tag allows you to organize\
    \ your form into logical groups of elements. Grouping elements allows you to provide\
    \ a better layout for your users and may cause longer forms to look less overwhelming.\
    \ Within a fieldset, you can nest a <legend> tag to add descriptive text about\
    \ the set. The fieldset will appear as a border around its fields, and the legend\
    \ will display in the top-left corner of the set. Fieldsets can be nested within\
    \ other sets, so you can also use it to organize subgroups, such as sets of checkbox\
    \ and radio buttons.\n\n# Group Related Form Elements\n\n+   1. In your editor,\
    \ open an HTML page that contains a form and form fields.\n2. Within the type\
    \ form, <fieldset>.\n3. Press Enter.\n\n![](img/786eec77afb1e5789b8be7c26fd20881_281_0.png)\n\
    \n```\n<div class=\"sidebar\">\n  <div class=\"nav\">\n    <li><a href=\"products.html\"\
    >Products</a></li>\n    <li><a href=\"services.html\">Services</a></li>\n    <li><a\
    \ href=\"about.html\">About</a></li>\n    <li><a href=\"locations.html\">Locations</a></li>\n\
    \  </ul>\n  <p>Use the links above to explore our site.</p>\n  <!-- _sidebar_\
    \ -->\n</div>\n<div class=\"content\" id=\"mainSection\">\n  <h1>Contact Us!</h1>\n\
