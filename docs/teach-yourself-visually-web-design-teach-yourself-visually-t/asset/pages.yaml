  md: '# Prevent Pages from Being Listed on Search Engines


    Occasionally, you may have pages within your site that you do not want to be indexed
    as search engines. For example, you may have test pages on your site that show
    developmental stages of upcoming futures, or possibly pages you have set up for
    your own personal use to which you do not want to grant others access. A robots.txt
    file can prevent engines from indexing certain pages by including one or more
    Disallow statements. An asterisk disallows indexing of the entire site; a specific
    folder disallows indexing that folder, and a particular page blocks indexing of
    the page.


    # Prevent Pages from Being Listed on Search Engines


    +   1. Create a new blank document in your editor.

    2. Type User-agent: *.

    3. Type Disallow:.

    4. Enter either an asterisk, a path to a directory or the site, or a specific
    filename.


    ![](img/786eec77afb1e5789b8be7c26fd20881_349_0.png)'
  merge: -1
  pgno: 349
- img_proc: true
  md: '+   Repeat Step 4 to add additional Disallow statements as needed.


    +   Save the file in your root folder with a name of robots.txt.


    ```

    robots.txt

    # for example

    User-agent: *

    Disallow: /files/

    Disallow: /media/

    Disallow: /images/

    ```


    The page or pages specified in the text file should now be ignored by search engines.


    ![](img/786eec77afb1e5789b8be7c26fd20881_350_0.png)


    # TIP


    Will this absolutely guarantee that those pages will not show up in search?


    Unfortunately, there is no way to guarantee that search engines will pay attention
    to instructions in robots files. Some search engines will still display a page
    not indexed in the results, but not provide details such as descriptions, whereas
    others may not display it at all. If you have content that you want to be absolutely
    certain is not going to appear in search results, you should not place it on the
    Web.'
  merge: -1
