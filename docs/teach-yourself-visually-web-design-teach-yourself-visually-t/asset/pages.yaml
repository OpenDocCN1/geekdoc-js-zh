  md: '# Understanding Dynamic Web Applications


    Any Web sites need to be able to respond to changes such as new members joining
    a site or customers adding items to shopping carts. Dynamic sites typically retrieve
    information from write data to databases, although they may also be used to send
    or receive email, gather information from other sites, or perform any number of
    other tasks. HTML does not provide the capabilities to offer dynamic content.
    Other programming languages, however offer the ability to generate HTML documents
    at the moment a user requests them.


    # Static versus Dynamic Sites


    Static sites contain HTML pages that appear to the user exactly as the designer
    or developer wrote them. In order for the content on your site to change, you
    must open the code in your editor, make the changes, and then upload a new copy
    to your server. Dynamic pages, on the other hand, contain scripts executed on
    the server. dynamic page looks and behaves differently for each user who encounters
    it.


    ![](img/786eec77afb1e5789b8be7c26fd20881_285_0.png)


    # Dynamic Languages


    Dynamic sites are primarily written in a server-side scripting language. Although
    many dozens of languages exist, some of the more popular are PHP, ColdFusion,
    ASP, and ASP.NET. Each language has distinct advantages and disadvantages. The
    examples in this chapter demonstrate how to create a simple dynamic site using
    PHP.


    ![](img/786eec77afb1e5789b8be7c26fd20881_285_1.png)


    # Dynamic Page Capabilities


    Dynamic sites can accept and process information submitted by the user via a Web
    form, such as search engines, e-commerce site order forms, blog comment forms,
    and social networking status forms. Dynamic pages may also change based on the
    time of the day the page is displayed or the region or locale of the user. They
    may also be updated by the Web site owner, such as the posting of a new blog entry.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CHAPTER 12


    # Creating Dynamic Pages


    # Dynamic Language Editors


    Scripting languages are composed of plain text, so they can be written in any
    editor. Most editors designed for creating Web pages offer at least some support
    for writing scripting languages. For example, Microsoft Expression Web has many
    tools designed to make creating pages in ASP NET easier, and Dreamweaver CS5 offers
    a variety of features built for PHP developers.


    ![](img/786eec77afb1e5789b8be7c26fd20881_286_0.png)


    # Testing Dynamic Pages


    You cannot simply open a dynamic page in your browser to test it. Instead, the
    page must be processed by a Web server before the page displays correctly. The
    easiest method of testing pages is to install a Web server on your local computer,
    a process outlined later in this chapter.


    ![](img/786eec77afb1e5789b8be7c26fd20881_286_1.png)


    # Dynamic Pages and Static Content


    Most dynamic pages contain some static content. Headings and navigation, for example,
    are often composed as static HTML. The presentational slide of your site will
    likewise be mostly, if not entirely, static CSS. Mixing dynamic and static elements
    on the page is perfectly acceptable and, in fact, extremely common.


    | static HTML HEADER Nav Nav Nav Nav Presentation CSS |


    273'
