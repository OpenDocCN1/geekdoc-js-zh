  md: '# Declare Your Document Type


    Before a browser can correctly render your HTML, it needs to know version of the
    language you are using. Both HTML and XHTML support three subsets or flavors:
    Strict, Transitional, and Frameless. You can set this version in your document
    by adding a document type declaration, or DOCTYPE. This special code, which is
    not an HTML tag, goes at the very top of your document; in fact, some browsers
    may render page incorrectly if you use a blank line, appears before the DOCTYPE.
    Most modern sites use the Transitional version of XHTML.


    # Declare Your Document Type


    +   1 Open an HTML document.


    +   2 Click at the top of your document.


    ![](img/786eec77afb1e5789b8be7c26fd20881_39_0.png)


    +   3 If necessary, press Enter to create a new line above the `<html>` tag.


    +   4 Type the appropriate document type declaration.


    +   * For XHTML Transitional, type `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0
    Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml-transitional.dtd">`.


    ![](img/786eec77afb1e5789b8be7c26fd20881_39_1.png)'
