  md: '# Graphics Programs


    The Web is a visual medium. As such, images and graphics play an important role
    in your site''s development. Today, powerful graphics tools are available that
    enable you to create professional-quality images. The photographs you plan to
    use on your site may need colors corrected, they may need to be cropped or resized,
    or you may want to apply special visual effects. You may also need to create images
    from scratch, such as a site logo, buttons, or other icons. You will therefore
    need to understand the tools available to you.


    # Adoshop Photoshop


    Photoshop has been the industry-standard tool for manipulating images for so long
    that its name is almost synonymous with editing. Today, Photoshop combines the
    same powerful tools for editing with an ever-growing array of features targeted
    at Web designers. The latest version, CS5, was released in April 2010.


    # Adobe Illustrator


    Illustrator is to vector-based drawing programs what Photoshop is to photo editing.
    Artists and graphic designers have relied on it for decades to create everything
    from full print campaigns. Photoshop, many of its newer features are targeted
    at Web designers. Illustrator CS5 was released in April 2010.


    # Adob Fireworks


    Originally created by Macromedia as a competitor to both Photoshop and Illustrator,
    Fireworks today is the graphics tool of choice for many Web designers due to its
    ease of use, wide set of tools, and extremely efficient optimization features.
    Fireworks CS5 was released in April 2010.


    # Core Draw


    Core Draw is, like Adobe Illustrator, a vector-based drawing tool. Today, it contains
    many features similar to Illustrator, making it an ideal tool for working on Web
    graphics. A new version, known as XS, was released in February 2010. Its only
    main disadvantage to designers today is that it is available only for Windows-based
    systems.


    # GIMP


    An open-source graphics toolset designed to mimic many of the features of Photoshop
    and other commercial products, GIMP, whose name is short for GNU Image Manipulation
    Program, is a viable option for budget-minded designers. It can be downloaded
    for free from www.gimp.org.


    # Adobe Photoshop Elements


    The full version of Photoshop is designed with professionals in mind. Adobe created
    Photoshop for hobbyists and home users. However, even though its price is roughly
    1/5 of that of Photoshop, Elements actually contains a very large number of Photoshop''s
    features.


    # Aperture


    Aperture is manufactured by Apple and is the preferred image-editing tool for
    Macintosh users. It has many features in Photoshop, including a set of tools designed
    specifically for use on the Web. Its main disadvantage is that it is available
    only for Macintosh computers.'
