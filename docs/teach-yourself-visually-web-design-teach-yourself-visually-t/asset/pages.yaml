  md: '# Find a Web Host


    For most individuals and even small businesses, the cost of setting up, securing,
    and maintaining their own server is both technically and cost prohibitive. You
    can easily avoid these issues using a third-party Web host. Web hosts provide
    the server space, security, and maintenance expertise to allow you to focus on
    the design and content of your site. You must find a host, sign up for their service,
    and transfer your site''s files to their servers in order to get online.


    # Shopping for a Host


    There are literally millions of Web hosts available — a Google search for “Web
    hosting” in June 2010 returned 89 million results. Therefore, you should spend
    some time comparison shopping. Hosts have widely varying fees for their services,
    from free to thousands of dollars per month. They also offer a wide range of services
    for these fees, so you must investigate which ones offers the services you want
    for the price you can afford.


    ![](img/786eec77afb1e5789b8be7c26fd20881_331_0.png)


    # Shared versus Dedicated Hosting


    Many Web hosts offer two basic services: shared hosting and dedicated hosting.
    With shared hosts, your site is on a server with many other sites. If one or more
    of those sites begins to use too much bandwidth or server resources, the performance
    of your site might suffer. Dedicated hosting allows you to rent an entire server
    for your site, yours is the only one running on the machine. This is, for obvious
    reasons, a much more expensive alternative, but generally offers better performance.


    ![](img/786eec77afb1e5789b8be7c26fd20881_331_1.png)


    # Domain Hosting


    Web hosts generally require that you use their domain name, but most other hosts
    offer domain hosting, where you can purchase a domain name and use it for your
    site. Some hosts offer multiple domain hosting, allowing you to purchase several
    domains and host them all, either as a single site that has many domains pointing
    to it, or as separate sites.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Hard Drive Space and Bandwidth


    All hosts should offer a certain amount of disk space, a maximum allowed amount
    of monthly bandwidth, and some sort of control panel interface to allow you to
    administer your site. The hard drive space and bandwidth is more than usually
    sufficient for most sites, although hosts generally offer a la carte options for
    additional space and bandwidth should you need them.


    ![](img/786eec77afb1e5789b8be7c26fd20881_332_0.png)


    # Extra Services


    Hosts generally offer e-mail services as well, allowing you to use e-mail accounts
    attached to your domain name. They may also offer server-side scripting features,
    such as support for PHP, ASP, ASP.NET, and ColdFusion, as well as space on database
    servers. All hosts should offer some sort of backup system to protect against
    data loss on their side, and may make the Web server logs for your site available,
    either as a raw data file that you need to analyze yourself or through a graphical
    interface on the control panel.


    ![](img/786eec77afb1e5789b8be7c26fd20881_332_1.png)


    # Signing Up with a Host


    When you have found the host you want to use, you can sign up through their Web
    site. Most ask for basic contact and billing information. Many offer monthly or
    yearly billing, with a discount for longer terms. Once you receive your information,
    you should receive an e-mail from them with details as how to log into the control
    panel and set up other details of your site, as well as the login information
    you need to upload your files to them.


    ![](img/786eec77afb1e5789b8be7c26fd20881_332_2.png)'
  merge: -1
  pgno: 332
