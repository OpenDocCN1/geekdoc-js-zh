  md: '# Understanding Web Standards


    Although HTML was invented by a single person, Tim Berners-Lee, its development
    was fairly quickly turned over to a relatively informal, ad-hoc community. Many
    in the community had different ideas as to where the language should go. Thus,
    by the late 1990s, the language was an at-times-confusing mixture of structural
    and presentational code, with a dose of browser-specific tags mixed in. Hoping
    to solve this issue, a group of prominent designers and developers banded together
    begin a push for Web standards, hoping to return to the original ideal of being
    able to write a page once and have it appear consistently everywhere.


    # Semantics


    HTML was originally envisioned as a language that would describe the logical structure
    of a page; that is, it would provide developers with the ability to define headings,
    paragraphs, lists, and the like. An important aspect of the Web standards movement
    is to get designers back to this ideal. Semantic design focuses on using the HTML
    tag that makes the most sense logically for the text in question, rather than
    the older common practice of using the tag that displayed the text the way the
    designer wanted.


    ![](img/786eec77afb1e5789b8be7c26fd20881_253_0.png)


    # Separating Content, Presentation, and Behavior


    Instead of attempting to mix the content of the page, its presentation, and its
    behavior in a single document, designers who adhere to Web standards can separate
    each into logical documents: HTML pages for the content, CSS for the presentation,
    and JavaScript for behavior. Doing so makes each document easier to write, easier
    to maintain, and easier to reuse later.


    ![](img/786eec77afb1e5789b8be7c26fd20881_253_1.png)'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Progressive Enhancement


    Someday, we may reach the long-sought goal of having browsers that all display
    pages the same. Today, however, we have a mixture of browsers with different capabilities.
    Progressive enhancement allows you to have a basic page that appears on all browsers,
    and then added features such as JavaScript menus that appear on browsers that
    support it. This way, with browsers with richer features get a better experience,
    but everyone can access the content.


    | Products | Products |

    |---|---|n| Red Widgets | Services |

    | Blue Widgets | About Us |

    | Green Widgets | East |

    | Services | Locations |

    | About Us | West |

    | Locations | Central West |


    # Validation


    From the beginning, browsers have been designed to ignore bad code. When they
    encounter an HTML tag they do not recognize, they simply ignore it. Thus, you
    do not get errors when you have mistakes on your page. Validation offers a solution:
    By using a free online service such as http://validator.w3.org, we can check your
    page to be sure that you are using proper code.


    ![](img/786eec77afb1e5789b8be7c26fd20881_254_0.png)


    # Good Code Solves Display Issues


    Many beginners labor under the misconception that because browsers do not display
    errors for bad or invalid HTML, writing good code does not matter. Unfortunately,
    not displaying errors does not mean that the browsers do not have problems with
    bad code. More often than not, browser display issues, even those seemingly caused
    by CSS, can be solved by simply ensuring that your HTML is correct.


    ![](img/786eec77afb1e5789b8be7c26fd20881_254_1.png)'
