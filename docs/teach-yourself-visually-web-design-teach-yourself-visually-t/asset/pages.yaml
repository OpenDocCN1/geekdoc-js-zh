  md: '# CHAPTER 13 Adding Information from a Database


    +   - Type a name for your database.

    - Click Create.


    ![](img/786eec77afb1e5789b8be7c26fd20881_310_0.png)


    +   - The confirmation page opens, showing that the database has been created.


    ![](img/786eec77afb1e5789b8be7c26fd20881_310_1.png)


    ### How many databases can I create on my server?

    MySQL supports an unlimited number of databases, so the limit depends on the amount
    of space you have on your hard drive. Third-party Web hosting companies often
    impose a limit of their own on databases on their system.


    ### What are the two databases that already exist?

    A default MySQL installation includes two databases: information_schema and mysql.
    The first, information_schema, is a database in the server stores information
    about all of the other databases on the server. The other, mysql, stores information
    about the server itself.


