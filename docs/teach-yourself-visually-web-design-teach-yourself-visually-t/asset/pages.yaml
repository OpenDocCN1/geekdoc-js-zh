    When you view your page in a browser, the items appear in a bulleted list.


    ![](img/786eec77afb1e5789b8be7c26fd20881_186_0.png)


    # Can I change the bullet?


    Yes. CSS contains a set of properties for styling lists that includes the ability
    to change the bullet into any number of symbols, including your own images. Styling
    lists is covered later in this chapter.


    # Can I nest lists inside other lists?


    Yes. Simply put a new <ul> and set of <li> tags as children of an <li> tag in
    the outer list. The nested list will be indented further and appear with a different
    bullet character.


