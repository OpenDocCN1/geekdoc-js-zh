  md: '# Understanding Image Formats


    Depending on how the image was created, images you want to use on your Web site
    can potentially come in any one of hundreds of formats, but the Web supports only
    three: GIF, JPEG, and PNG. Before you begin working with images on your pages,
    you need to understand these formats so that you can choose the one that works
    best. Each format has specific advantages and disadvantages, and you will need
    to evaluate each image to determine the format that works best for it.


    # The Formats for the Web


    Browsers can natively display images saved in the JPEG, GIF, and PNG formats.
    Any other format requires that the browser use a plug-in, so these three are commonly
    thought of as the formats the Web supports. If you have an image in any other
    format, you will need to convert it to one of these.


    ![](img/786eec77afb1e5789b8be7c26fd20881_63_0.png)


    # JPEG


    JPEG is short for Joint Photographic Expert''s Group, the organization that originally
    developed the format. The JPEG format supports millions of colors and is thus
    best for photographic images. Most of today''s digital cameras save images as
    JPEGs by default.


    ![](img/786eec77afb1e5789b8be7c26fd20881_63_1.png)


    # GIF


    Originally developed in the 1980s by CompuServe, the Graphics Interchange Format
    has been a long stand on the Internet, even before the Web. GIFs support a maximum
    of 256 colors, and today are primarily used for logos, line art, and buttons.
    Unlike JPEG, GIFs support transparency and animation.


    ![](img/786eec77afb1e5789b8be7c26fd20881_63_2.png)


    # PNG


    Developed as an alternative to GIF, the Portable Network Graphics format combines
    the best features of the JPEG and GIF formats. JPEG, a PNG can have millions of
    colors, and like GIF, PNGs support transparency.


    ![](img/786eec77afb1e5789b8be7c26fd20881_63_3.png)'
