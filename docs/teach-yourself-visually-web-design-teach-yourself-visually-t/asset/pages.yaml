  md: "# Use Meta Tags\n\nThe HTML `<meta>` tag in the head of the document allows\
    \ you to describe your page to search engines. The word *meta* is from the Greek\
    \ meaning “with,” and is used to refer to something that refers to itself. The\
    \ tag allows you to add information about the page. The `<meta>` tag should be\
    \ given a `name` attribute, set to either `keywords` or `description`. Either\
    \ is paired with a `content` attribute. Keywords contain a comma-separated list\
    \ of the words you are likely to type search for your site. The description is\
    \ a brief paragraph describing the site.\n\n# Use Meta Tags\n\n+   1 Open a Web\
    \ page in your editor.\n\n+   2 In the head of the page, type `<meta>`.\n\n+ \
    \  3 Type name=\"keywords\".\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//HTML 1.0\
    \ Transitional//EN\"\n   \"http://www.w3.org/TR/html1-transitional.dtd\">\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=utf-8\" />\n  <meta name=\"keywords\" content=\"\
    tv industries\">\n  <title>TV Industries Home</title>\n  <link href=\"mainstyles.css\"\
    \ rel=\"stylesheet\" type=\"text/css\" />\n  <script type=\"text/javascript\"\
    ></script>\n</head>\nfunction hideDiv() {\n  document.getElementById(\"specials\"\
    ).style.visibility = \"hidden\";\n}\nfunction showDiv() {\n  document.getElementById(\"\
    specials\").style.visibility = \"visible\";\n}\n```\n\n+   4 Type content=\"?\"\
    , replacing ? with a comma-separated list of words.\n\n+   5 Type />.\n\n```\n\
    <!DOCTYPE html PUBLIC \"-//W3C//HTML 1.0 Transitional//EN\"\n   \"http://www.w3.org/TR/html1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=utf-8\" />\n  <meta name=\"keywords\"\
    \ content=\"tv industries, widgets\">\n  <title>TV Industries Home</title>\n \
    \ <link href=\"mainstyles.css\" rel=\"stylesheet\" type=\"text/css\" />\n  <script\
    \ type=\"text/javascript\"></script>\n</head>\nfunction hideDiv() {\n  document.getElementById(\"\
    specials\").style.visibility = \"hidden\";\n}\nfunction showDiv() {\n  document.getElementById(\"\
    specials\").style.visibility = \"visible\";\n}\n```"
  merge: -1
  pgno: 343
- img_proc: true
  md: "# Publishing Your Site and Getting Noticed\n\n# 6 Type <meta>.\n\n```\n<!DOCTYPE\
    \ html>\n<!DOCTYPE HTML PUBLIC \"-//W3C//HTML 1.0 Transitional//EN\"\n// \"http://www.w3.org/TR/html1/html-transitional.dtd\"\
    >\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
    >\n  <meta name=\"keywords\" content=\" industries, widgets\">\n  <meta name=\"\
    description\" content=\"NRY Industries\">\n  <title>NRY Industries</title>\n \
    \ <link rel=\"stylesheet\" href=\"style.css\" type=\"text/css\">\n  <script src=\"\
    text.js\"></script>\n\nfunction hideDiv() {\n  document.getElementById(\"special\"\
    ).style.visibility = 'hidden';\n}\n\nfunction showDiv() {\n  document.getElementById(\"\
    special\").style.visibility = \"visible\";\n}\n```\n\n# 7 Type name=\n\n\"description\"\
    .\n\n# 8 Type content=\"?\",\n\nreplacing ? with a brief\nparagraph describing\
    \ the site.\n\n# 9 Type />.\n\nThe <meta> tags have been\nadded to the page.\n\
    \n![](img/786eec77afb1e5789b8be7c26fd20881_344_0.png)\n\nDo search engines still\
    \ use <meta> tags? Google has stated publicly that they do not, but\nother search\
    \ engines might. Even though <meta>\ntags might be ignored, it does not hurt your\
    \ site to\nadd them for those engines that read them.\n\nWhat can the <meta> tag\
    \ be used for? The <meta> tag can be used for a variety of other\npurposes, such\
    \ as embedding your name as the\nauthor or adding the revision date. In fact,\
    \ you can\nset the name and content attributes to any value\nyou want.\n\n331"
