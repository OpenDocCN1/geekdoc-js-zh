    # Can I have nested groups?


    Yes. Many sites have nested sections or groups on the page. For example, you might
    want to place your main navigation within the header section. In this case, you
    would group the elements of the header''s <div> tag, and then include that group
    inside the other <div> tag. You may also have logical groups in any of the other
    sections. You can nest groups as deep as you want to.'
