  md: '# Use Photoshop to Fix Colors


    Most digital cameras today are fairly good at adjusting settings to capture good
    images, but almost all get colors wrong. When you move from one lighting situation
    to another, the camera must reinterpret what it sees. For example, fluorescent
    lights cast a distinctly yellowish hue on everything. Therefore, a picture taken
    outside generally looks right, whereas pictures taken in offices are yellowish.
    Photoshop makes it easy to correct this with color adjustment tools. You can simply
    drag sliders back and forth and see the corrections directly on your image.


    # Use Photoshop to Fix Colors


    +   1 Click File.

    2 Click Open.


    ![](img/786eec77afb1e5789b8be7c26fd20881_73_0.png)


    The Open dialog box appears.


    +   3 Navigate to the folder containing your image.

    4 Double-click the image.


    ![](img/786eec77afb1e5789b8be7c26fd20881_73_1.png)


