  md: "# # Add Headings\n\nMany studies have been conducted that most people scan\
    \ Web pages rather than read them closely. Thus, headings are important to let\
    \ your user know what topics are on the page that they might want to stop and\
    \ read. The headings on your Web page serve the same purpose as headings in printed\
    \ materials. For example, this book contains a main heading above this paragraph\
    \ that allows you a reader to quickly determine that these pages cover the topic\
    \ of adding headings to your page. Just as that heading helps you find information\
    \ in this book, headings on your Web page help your user.\n\n# Add Headings\n\n\
    +   1 Open a Web page in your editor.\n2 Place the cursor between the opening\
    \ and closing `<body>` tags.\n3 Type `<h1>`.\n4 Type text for the heading.\n\n\
    ```\n<!-- heading: Heading\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\
    \n \"http://www.w3.org/TR/html11/DTD/html1-transitional.dtd\">\n<head>\n<title>My\
    \ First Page</title>\n</head>\n<body>\n<h1>icon to my page</h1>\n</body>\n</html>\n\
    ```"
