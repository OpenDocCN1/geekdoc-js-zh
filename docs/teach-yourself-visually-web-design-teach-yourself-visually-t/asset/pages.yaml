  md: '# Make Your Images Accessible


    Ensuring that users with different physical needs can access your page is important
    so that you do not turn away potential customers or users. In order for blind
    users to make sense of your page, you should provide a text description of your
    image. You can add this description with the alt attribute to the <img> tag. Every
    image that you add to your page with HTML needs descriptive alternate text. The
    attribute is actually a requirement of HTML and XHTML; in many jurisdictions,
    it may be a legal requirement as well.


    # Make Your Images Accessible


    +   1 Open the editor that contains an <img> tag in your editor.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>Magazines Now Home Page</title>

    </head>

    <body>

    <img src="images/logo.gif" alt="/>

    </body>

    </html>

    ```


    +   2 Within the tag, before the closing />, type alt.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>Magazines Now Home Page</title>

    </head>

    <body>

    <img src="images/logo.gif" alt="/>

    </body>

    </html>

    ```


    90'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Type = "?", replacing with a description of the image.


    ![](img/786eec77afb1e5789b8be7c26fd20881_104_0.png)


    When viewed in a browser, the page should not appear any differently than that
    it did before. Alternate text is provided for people with disabilities, and does
    not affect the way the page displays.


    ![](img/786eec77afb1e5789b8be7c26fd20881_104_1.png)


    # TIPS


    A client using Internet Explorer 6 says that he can see the alternate text when
    he mouses over the image. Why is this?

    Older versions of Microsoft''s Internet Explorer displayed image alternate text
    as a tool tip. This was never part of the official specification for browsers,
    so no other browser did it. Microsoft discontinued the practice in the newer versions
    of IE.


    How do blind users surf the Web?

    Blind users rely on software called screen readers, which read aloud everything
    on the screen. Screen readers read the alternate text descriptions of images on
    your page as your blind navigates around the document.'
