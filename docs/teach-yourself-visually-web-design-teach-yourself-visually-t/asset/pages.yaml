    # TIPS


    Do I need to provide data for every field?

    It depends on how the table was set up. When you create fields, you can choose
    to make them required, meaning that data must be provided for every time, or optional
    so that they can be left blank. Which one you choose depends on the requirements
    of the database.


    Does it matter whether or not I capitalize data?

    The database will not be affected either way, but you should keep in mind that
    the data you put into a table is exactly the data you get out. In general, you
    should input data in the way in which you want to eventually display it.


