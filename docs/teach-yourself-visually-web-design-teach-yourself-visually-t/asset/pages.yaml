  md: '# Create a Form


    form in HTML consists of a group of controls wrapped in a <form> tag. The tag
    takes two common attributes: action and method. The value of action is a URL to
    a page that contains the code necessary to process the form''s data. The method
    attribute accepts one of two values. Setting the value to get instructs the browser
    to send the form''s data by appending it to the action''s URL, where the value
    post has the browser send the data as part of the background information it normally
    sends to the server.


    # Create a Form


    +   1. In your editor, a new or existing HTML document into which you want to
    add a form.


    +   2. Within the body, type

    <form.


    +   3. Type action="?", replacing ? with the path to the file that will process
    your form.


    +   Note: See Chapter 12 for more information on writing scripts to process forms.


    ```

    <body>

    <div class="container" id="skipnavigation" class="skip navigation"></a>

    <div class="header">

    <a id="mainSection" href="#main"><img src="images/logo.png" alt="Insert_logo"
    width="180" height="90" id="Insert_logo" style="display:block;"/></a>

    </header>

    <!-- sidebar -->

    <div class="sidebar">

    <ul>

    <li><a href="products.html">Products</a></li>

    <li><a href="services.html">Services</a></li>

