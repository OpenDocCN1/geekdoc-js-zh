  md: '# Preview a Page in a Browser


    Throughout the design process, you will want to regularly check your page in a
    web browser to ensure that it looks the way you expect it to. Ideally, you should
    check your page in more than one browser because browsers may not display the
    page in the same way. Many visual design tools have you to automatically send
    the page to a browser for previewing, but the steps demonstrate how to open the
    page manually in case you are not using a tool that opens it for you.


    # Preview a Page in a Browser


    +   1 Open a Web browser.

    2 Click File.

    3 Click Open.


    Note: Depending on the browser, the name of menu item may vary slightly.


    Note: If you are using Internet Explorer on Windows, you may need to press Alt
    on your keyboard to make the menus appear.


    ![](img/786eec77afb1e5789b8be7c26fd20881_37_0.png)


    The Open dialog appears.


    +   4 Click Browse.


    ![](img/786eec77afb1e5789b8be7c26fd20881_37_1.png)'
  merge: -1
