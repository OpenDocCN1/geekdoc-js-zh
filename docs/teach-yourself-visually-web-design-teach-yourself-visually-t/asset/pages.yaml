  md: '# # Get to Know the Illustrator Interface


    Almost all computer graphics are either bitmaps, meaning that they are composed
    of small pixels, or vectors, which are constructed by defining points and using
    mathematical algorithms to draw lines between the points. Illustrator is an extremely
    powerful vector-based design tool. Many of the logos that represent major corporations
    were designed in Illustrator. Like its Creative counterparts, Illustrator’s interface
    contains a series of panels, from which most of the program’s features can be
    accessed, and a set of drawing tools.


    # Menu Bar


    You can access the commands in the program from these menus.


    ![](img/786eec77afb1e5789b8be7c26fd20881_88_0.png)


    # Bridge and Window Tools


    Launch Bridge or arrange open documents.


    # Workspace Switch


    Change the layout of the panels by selecting a different workspace.


    # Panels


    Most of your work in Illustrator will be done these panels. Click a panel’s icon
    to expand.


    # Document Tabs


    You can switch between open documents by selecting its tab.


    # Toolbox


    The drawing and other tools in the program can be accessed from the Toolbox.


    # Canvas


    The drawing area for your document.


    # Control Bar


    The items available on the Control Bar differ depending on the currently selected
    tool.


    # Artboard


    The area surrounding the canvas can be used as a virtual desktop to place items
    you plan to use later.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Create a Button in Fireworks


    You can make your Web site more visually interesting by using graphical buttons
    for your navigation. You can use the drawing tools in Fireworks to quickly create
    these graphics. Before you begin, you need to create a new document. You should
    size the document based on how big you need the button to be. You can use the
    color tools in Fireworks to set the background of the button to match the visual
    design you have in mind.


    # Create a Button in Fireworks


    +   1 From the Fireworks Welcome screen, click Fireworks Document.


    ![](img/786eec77afb1e5789b8be7c26fd20881_89_0.png)


    The New Document dialog box appears.


    +   2 Enter the dimensions you want for your button.


    +   3 Click OK.'
  merge: -1
