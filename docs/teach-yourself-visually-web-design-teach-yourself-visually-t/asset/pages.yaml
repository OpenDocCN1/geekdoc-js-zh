  md: "# Apply Styles with IDs\n\nJust as with a class, an ID selector allows you\
    \ to create a generic set of styles and rules then apply them to your page by\
    \ the matching HTML attribute, ID. An important distinction, however, is that\
    \ an ID selector can be applied only to a single tag on an HTML page, whereas\
    \ a class selector can in theory be applied to as many elements on the page as\
    \ you want. In your CSS, the ID selector must begin with a pound sign (#), but\
    \ the sign is not repeated in the matching HTML attribute.\n\n# Apply Styles with\
    \ IDs\n\n+   1. In your editor, open a page that contains an embedded style sheet.\n\
