    Why does the <tfoot> come before the <body> in the code?

    The browser needs to know what the footer information is before it can properly
    lay out the table. Defining these sections out of order can be a bit confusing,
    and it may help to initially create the table in the more logical order, with
    the footer at the bottom, and then cut and paste those rows into the correct place
    when you are finished creating the table.


