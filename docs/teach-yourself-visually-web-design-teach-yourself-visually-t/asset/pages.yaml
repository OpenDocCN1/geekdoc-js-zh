  md: '# # Create a Logo in Illustrator


    Illustrator contains a set of powerful drawing tools that allow artists to draw
    images limited only by their creativity and imagination. As a vector-based program,
    its tools are designed around drawing new images, rather than editing existing
    ones. With other tools, you begin creating a new document, and setting Illustrator’s''
    — its drawing area — to the size you need for your image. Illustrator’s Text tool
    allows you to create images that use any font you have installed.


    # ## Create a Logo in Illustrator


    +   - From the Illustrator Welcome screen, click Web Document.


    ![](img/786eec77afb1e5789b8be7c26fd20881_95_0.png)


    The New Document dialog box appears.


    +   - Set the width and height to your desired values.


    +   - Click OK.


