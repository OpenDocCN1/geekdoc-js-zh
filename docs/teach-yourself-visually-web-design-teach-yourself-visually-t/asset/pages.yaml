  md: '# A Brief History of the Web


    Only twenty years after its invention, the World Wide Web has become commonplace
    and has fundamentally changed the way we work, live, and interact with others.
    However, the medium is in many ways still in its infancy, and as you progress
    in learning about designing Web pages, you will encounter many significant limitations
    primarily because the Web was not created as a place to sell books or keep in
    touch with friends from high school. Understanding why the Web was invented and
    what its original goals will help you better understand these issues.


    # The Invention of the Web


    The Web was invented in 1990 by Tim Berners-Lee. Berners-Lee was a physicist at
    CERN, the European laboratory for particle physics, located in Geneva, Switzerland.
    Berners-Lee noted that visiting scientists, working on experiments that could
    have come from Star Trek, to exchange information with one another on paper because
    their computer systems were incompatible. He therefore created the Web as a way
    to allow these scientists to share their findings, regardless of what kind of
    computer system they used.


    ![](img/786eec77afb1e5789b8be7c26fd20881_17_0.png)


    # The Invention of the Internet


    Jokes about politicians aside, no one person invented the Internet. Rather, it
    evolved over decades from a variety of other sources. Much of the early work on
    what became the Internet was done in the 1960s. Although the United States Department
    of Defense funded the early research, the Internet was not, contrary to popular
    belief, designed by or for the military.


    ![](img/786eec77afb1e5789b8be7c26fd20881_17_1.png)


    # The Web versus the Internet


    Many people confuse the Web with the Internet, but it is important to understand
    that they are not the same thing. The Web is best thought of as an application
    that runs on the Internet. E-mail is another application running on the Internet,
    entirely separate from the Web.


    ![](img/786eec77afb1e5789b8be7c26fd20881_17_2.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Protocols


    Computer networking relies on protocols, which are essentially standards by which
    two computers can talk to one another using a common language. The Internet relies
    on a suite of two protocols: TCP, or Transmission Control Protocol, and IP, or
    Internet Protocol. TCP/IP was developed in the 1970s by Robert Kahn and Vint Cerf.
    The Web primarily uses the Hypertext Transfer Protocol, or HTTP, developed in
    1990 by Tim Berners-Lee.


    ![](img/786eec77afb1e5789b8be7c26fd20881_18_0.png)


    # The Expansion of the Web


    CERN did not show much interest in Berners-Lee''s invention, and so allowed him
    to make publicly available with no licensing restrictions. Soon, scientists at
    Stanford University and the National Center for Supercomputing Applications took
    his ideas and began building servers and browsers to work with. Companies followed,
    and by the mid-1990s, the Web took off.


    ![](img/786eec77afb1e5789b8be7c26fd20881_18_1.png)


    # The World Wide Web Consortium


    In October 1994, Berners-Lee left CERN and founded the World Wide Web Consortium
    (W3C) as a sort of governing body for the development of the Web. Today, the W3C
    is still responsible for maintaining and adopting standards for languages such
    as HTML, or Hypertext Markup Language. They also promote standards for other aspects
    of the Web, such as graphics formats and cascading style sheets, or CSS.


    ![](img/786eec77afb1e5789b8be7c26fd20881_18_2.png)


    # The Web Today


    Exact numbers are hard to find, but most estimates show that many billions of
    Web pages are in existence. Search engine Google announced in 2008 that it indexed
    trillion unique Web addresses. Hundreds of millions of Web sites are likely currently
    in operation. Considering that 2010 marks only the 20th anniversary of the Web,
    its expansion is truly amazing.


    ![](img/786eec77afb1e5789b8be7c26fd20881_18_3.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Understanding Browsers


    The primary means by which most people access the Web is via a browser. Browsers
    are simply software applications that read and interpret HTML pages. In a way,
    you can look at browsers as the canvas for which you design your page. Unfortunately,
    browsers are inconsistent in the ways which they display pages, and remain the
    primary source of Web designers'' headaches. Although you can minimize these differences
    on your pages, understanding browsers is an important first step to learning how
    to create sites that avoid these issues.


    # WWW: The First Browser


    Tim Berners-Lee developed the first browser when he invented the Web. Although
    he considered many names for it, he finally settled on WorldWideWeb. His idea
    was to have browsers/editors, whereby users would rely on a single tool to view
    and create pages.


    ![](img/786eec77afb1e5789b8be7c26fd20881_19_0.png)


    # NCSA Mosaic and Other Early Browsers


    One of the first graphical browsers, capable of displaying images alongside text,
    was developed by the National Center for Supercomputing Archives. The leader of
    the Mosaic browser, Marc Andreessen, left soon after to find Netscape Communications
    and create Navigator, the first commercial, widely adopted browser.


    ![](img/786eec77afb1e5789b8be7c26fd20881_19_1.png)


    # Internet Explorer


    As the Web began to gain in popularity, Microsoft developed their own browser,
    which they called Internet Explorer, but which is often referred to as IE. Of
    the early browsers, IE is the only one still existence in a recognizable form.


    ![](img/786eec77afb1e5789b8be7c26fd20881_19_2.png)


    # Mozilla Firefox


    When AOL purchased Netscape, they decided that rather compete with Microsoft,
    they would release the code upon which the Netscape browser was based as open
    source. The nonprofit Mozilla corporation used it as the basis for Firefox, which
    is today the second-most-popular desktop browser after IE.


    ![](img/786eec77afb1e5789b8be7c26fd20881_19_3.png)


    6'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# The Tools of Web Design and Planning Your Site


    # Safari and Chrome


    After years of relying on Netscape and Microsoft, Apple decided to build their
    own browser. Using the open-source WebKit browser code base, they released the
    Safari browser. Chrome, entering the browser market later, also used WebKit as
    the underpinning of their browser. On Macintosh systems, it is also available
    on Windows and Apple''s mobile devices such as the iPhone and iPad. Chrome is
    increasingly popular on both Windows and Mac, along with mobile devices running
    the Android operating system such as the Nexus and Droid phones.


    ![](img/786eec77afb1e5789b8be7c26fd20881_20_0.png)


    # Opera


    Although Nestle briefly flirted with the idea of charging for their browser, Norway''s
    Opera browser was available in paid and free versions for many years, finally
    becoming completely free-only in 2000. It offers many features that make it popular
    to technically inclined users, but the general public remains mostly unaware of
    it.


    ![](img/786eec77afb1e5789b8be7c26fd20881_20_1.png)


    # Browser Differences


    Though the original idea of the Web was to be able to create pages that would
    look the same on all computers, browsers have rendered pages differently. Today,
    most browsers are to some extent standards-based, meaning that they display most
    pages the same most of the time. However, differences still exist, requiring that
    you test your pages in multiple browsers.


    ![](img/786eec77afb1e5789b8be7c26fd20881_20_2.png)


    # The Mobile Web


    More and more people are using cell phones and the newest generation of so-called
    smart phones to surf the Web, posing a new set of challenges for Web designers.
    Fortunately, most smart phones today rely on standard browsers: the popular iPhone,
    for example, uses Apple''s Safari browser.


    ![](img/786eec77afb1e5789b8be7c26fd20881_20_3.png)


    # Upgrading Browsers


    New versions of browsers are constantly released. Unfortunately for us designer,
    each browser company releases their software on different schedules, making keeping
    up with the latest browsers challenging. Even though browsers are free, many users
    do not upgrade their browsers, forcing designers to worry not only about new versions,
    but several iterations of old ones as well.


    ![](img/786eec77afb1e5789b8be7c26fd20881_20_4.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Visual Design Tools


    All Web pages are, in the end, simple text files that contain the code needs in
    to display the page. Although HTML and CSS are not complicated programming languages,
    many designers would prefer to use little code as possible. Many visual design
    tools over the years have attempted to come up with a way to allow designers to
    create pages using no code at all. Unfortunately, none succeeded, so you need
    to gain an understanding of the code. That said, visual design tools allow you
    to minimize the amount of code you need to.


    # Adobe Dreamweaver


    Dreamweaver has been the industry-standard design tool for many years. Originally
    created by Macromedia, Dreamweaver has existed as an integral part of Adobe''s
    Creative Suite since 2005. Dreamweaver provides both a design that approximates
    a browser with a Live feature that relies on an actual browser-rendering engine.
    Dreamweaver CS was released in April 2010.


    ![](img/786eec77afb1e5789b8be7c26fd20881_21_0.png)


    # Microsoft Expression Web


    Microsoft''s primary Web design tool, a direct competitor to Dreamweaver, shares
    many of the same features. It contains a interface that allows you to create pages
    without writing code, and with tools to help manage your site''s features. Expression
    Web 3 was released in 2008, and a new version is expected in mid- to-2010.


    ![](img/786eec77afb1e5789b8be7c26fd20881_21_1.png)


    # Legacy Programs


    For many years, the go-to product for individuals and businesses who wanted to
    create Web sites was Microsoft''s FrontPage. FrontPage was discontinued in 2003,
    but some designers continue to use it.


    Before their acquisition of Macromedia, Adobe manufactured a competitor, GoLive.
    GoLive focused more heavily on design features than most other tools. It was discontinued
    in 2008.


    ![](img/786eec77afb1e5789b8be7c26fd20881_21_2.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Code-based Tools


    Because learning how to write HTML and CSS remains important for successful Web
    designers, many have decided that if they must write code anyway, they would prefer
    to use a pure code editor rather than visual tools to for them. The biggest advantage
    to code editors over visual design tools is that hundreds of code editors exist
    as free downloads, whereas all of the best visual editors are commercial products
    that must be purchased. Using a coding tool also gives you control over your code.


    # TextEdit and Notepad


    Because HTML can be created in any text tool, some designers who do not want to
    purchase or download other tools use the free text editors that ship with operating
    systems, including TextEdit on Macintosh and Notepad on Windows.


    ![](img/786eec77afb1e5789b8be7c26fd20881_22_0.png)


    # Dreamweaver and Expression


    Although primarily visual tools, both Dreamweaver and Expression contain powerful
    code-editing capabilities. In fact, many day-to-day users of each program never
    use the visual tools at all, preferring to rely on them as code editors.


    ![](img/786eec77afb1e5789b8be7c26fd20881_22_1.png)


    # Eclipse


    Eclipse is an open-source development toolset. Although it has no specific HTML-editing
    capabilities by itself, free plug-ins are available for it that add functionality.
    Eclipse is available for free from www.eclipse.org; HTML and other plug-ins can
    be downloaded at www.eclipse.org/downloads.


    ![](img/786eec77afb1e5789b8be7c26fd20881_22_2.png)


    # HomeSite


    For many years, HomeSite was packaged with Dreamweaver. No new version of HomeSite
    has been released since 2003, and Adobe officially discontinued its development
    in 2009. However, many developers enjoyed its powerful code-editing features and
    have continued to use their old copies of it.


    ![](img/786eec77afb1e5789b8be7c26fd20881_22_3.png)'
