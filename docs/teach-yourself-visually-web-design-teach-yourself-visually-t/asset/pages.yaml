    > TIPS


    In Chapter 2, IDs were used as targets for links. Is this a different ID?


    No. IDs can be used for several purposes, including targeting lists and applying
    styles. They can also be used for JavaScript. A single element''s ID can be used
    for any of these purposes on a single page.


    What is the difference between an ID and a class? The main difference between
    IDs and classes is that an ID must be unique on a page, whereas a class can be
    repeated. IDs are more specific than classes, so if an element has both an ID
    and a class applied with conflicting styles, the ID''s take precedence over those
    of the class.


