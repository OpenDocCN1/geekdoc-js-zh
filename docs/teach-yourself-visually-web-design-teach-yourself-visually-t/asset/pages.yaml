  md: '# Populate the Table with Data


    Once you have your table created, the final step before you can begin your database
    with PHP is to populate your table with data. You can add data to your table with
    phpMyAdmin''s insert tool. Accessible from the database''s page, the insert tool
    provides a simple form that allows you to add records, or rows, to your table.
    You are given a list of fields in the table and can simply type the data into
    a text box. Although you can add only one record at a time, you can call the form
    repeatedly to add more data.


