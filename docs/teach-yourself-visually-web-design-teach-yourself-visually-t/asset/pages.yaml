  md: '# # Add a Flash Movie to Your Page


    Once you have published an SWF file, you can embed it into your HTML page. A popular
    means by which Flash movies can be added to a page via the JavaScript SWFOject
    library. SWFOject allows you to embed your movie, but also allows Player detection
    to ensure that users who do not have the correct version of Player are prompted
    to download it. It further allows you to add alternate content to display on your
    page when user does not or cannot install Flash. Dreamweaver''s Insert panel includes
    an option to insert a Flash movie into your page that uses SWFOject.


    # Add a Flash Movie to Your Page in Dreamweaver


    +   - In Dreamweaver, open an existing page or create a new one.

    - On the Insert panel, click Media.

    - Click SWF.

    - Select the SWF file you want to insert.

    - Click OK.


    +   - The movie is inserted into the page.

    - You can click the Play button on the Properties panel to preview your movie.


    ![](img/786eec77afb1e5789b8be7c26fd20881_244_0.png)'
