  md: '# Add Table Sections


    Most data tables are likely to be made of two or three sections: a header at the
    top, a footer at the bottom, and the main body in between. HTML provides tags
    to denote these three sections: <thead>, <tbody>, and <footer>. These tags wrap
    around the rows that make up each section of the table. Each section can contain
    one or more rows, although the header and footer rarely contain more than one.
    The three table sections elements do not alter the default appearance of the table
    in the browser.


    # Add Table Sections


    +   In your editor, open a page that contains a table.

    Below the table element''s opening tag, type `<thead>`.

    Immediately following the final `</tr>` in the header, type `</head>`.


    ![](img/786eec77afb1e5789b8be7c26fd20881_183_0.png)


    +   On the next line, type `<footer>`.

    Type `<td colspan="?>`, replacing ? with a value equal to the number of columns
    in the table.

    Add data for the footer.'
  merge: -1
