    |---||

    | Browsers will display your page without it, but some browsers are more likely
    to make mistakes in the rendering if you do not have a proper document type, so
    adding the declaration is strongly recommended. Most dedicated HTML editors add
    the declaration for you, so you may not have to actually type it. | HTML and XHTML
    Transitional are the least restrictive types and the most appropriate for documents.
    Strict forces you to exactly follow the syntax of the languages and Web standards,
    so it is more difficult to use in frames. Frameset provides default tags for frames,
    but few Web sites use frames anymore. |'
