  md: '# Crop and Resize an Image in Photoshop


    Once you have corrected the colors on the image, you must resize the image to
    something appropriate to what your Web site needs. Most modern digital cameras
    take very large images, but for most Web sites, you will want much smaller pictures,
    if for no other reason than you need your image to fit within the page. You can
    reduce the entire image by resizing it, or you can cut unwanted portions of the
    image out through a process known as *cropping*. Photoshop makes both very easy.


    # Crop and Resize an Image in Photoshop


    # Crop the Image


    +   On the Toolbox, click the **Crop** tool.


    +   Click and drag on the image to define an area to keep.


    **Note:** You can adjust the crop box after you draw it by dragging the handles.


    ![](img/786eec77afb1e5789b8be7c26fd20881_75_0.png)


    +   Double-click within the crop box.


    +   The image is cropped.


    ![](img/786eec77afb1e5789b8be7c26fd20881_75_1.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Resize the Image


    +   1 Click Image.


    +   2 Click Image Size.


    The Image Size dialog box appears.


    +   3 Enter a desired width.


    Note: The height adjusts automatically as you enter a value for width.


    +   4 Click OK.


    The image is resized.


    ![](img/786eec77afb1e5789b8be7c26fd20881_76_0.png)


    ![](img/786eec77afb1e5789b8be7c26fd20881_76_1.png)


    # TIPS


    How do I know how big to make the image? The image needs to fit in your design.
    Hopefully, you had carefully planned out your design before going into Photoshop
    and know how big to make the image. As long as you preserve the original image,
    saving the cropped and resized image as a copy, you could always return to it
    and resize if needed.


    What is the grid that appears when I crop my image? Photographers have followed
    a “rule of thirds” in composing images. Basically, the idea is that if you divide
    the image into nine equal parts and the focal point of the image at the intersection
    of two of the grid lines, you will have a more visually interesting image. Photoshop’s
    Crop tool provides the grid to help you achieve this.'
