  md: '# Modify CSS


    Dreamweaver uses CSS by default for all formatting you do on the page. Its CSS
    panel provides a single location for you to manage your site''s styles. From the
    panel, you can view the CSS currently in use on your page, either by seeing all
    of the selectors in a list or by viewing the rules that currently apply to the
    element or object you have selected. Either way, you can modify existing properties
    or add new ones. Throughout the process, Dreamweaver presents you with lists of
    options, minimizing the amount of typing you need to do.


    # Modify CSS


    +   In design view, click the element you want to style.

    - You can use the Tag Chooser at the bottom of the Design window to make a more
    precise selection.


    ![](img/786eec77afb1e5789b8be7c26fd20881_209_0.png)


