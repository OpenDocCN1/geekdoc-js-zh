    WAMP installs.


    ![](img/786eec77afb1e5789b8be7c26fd20881_288_1.png)


    > I have heard that using a single installer like WAMP has problems, and that
    I should install everything instead. Is this correct?


    If you are setting up a live Web server that will be publicly accessible, manually
    installing the Apache server, PHP, and MySQL is generally better. That way, you
    can control exactly what is installed and where it installs, and customize the
    security settings as needed. However, if you are instead setting up a local testing
    machine that only you will have access to, as is the case in these examples, WAMP
    provides a much quicker and easier installation process.


