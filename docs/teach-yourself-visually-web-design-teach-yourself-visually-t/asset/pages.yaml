    text with the <textarea> tag. Like every other form control, the tag has a name
    attribute. The default display size of the field varies between browsers, but
    the tag also accepts rows and cols attributes to set the size, where the former
    sets the field''s height and the latter its width. The <textarea> is a container
    and has a required closing tag. If you want to prepopulate the field with some
    default text, the text will appear between the opening and closing tags.


