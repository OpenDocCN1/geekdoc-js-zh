    # TIPS


    Has Dreamweaver modified my original Photoshop image?


    No. Dreamweaver has created a new version of your image, saved as a JPEG, GIF,
    or PNG, depending on what format you selected. Your original PSD file is not moved
    or changed in any way.


    Can any Photoshop image be imported into this way?


    Yes. All Photoshop images, no matter how complex, can be imported directly into
    Dreamweaver using this technique.'
