  md: '# Getting Started with HTML


    Type <p>.


    Repeat Steps 2 to 4 to add additional paragraphs.


    ```

    <h1>Heading</h1>

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    //"http://www.w3.org/TR/html1-transitional.dtd">

    <html>

    <head>

    <title>My First Page</title>

    </head>

    <body>

    <h1>welcome to my page</h1>

    <p>Please take a few minutes to look around the site.</p>

    <p>Feel free to contact us for more information.</p>

