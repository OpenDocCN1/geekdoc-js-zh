  md: '# Apply Additional Text Formatting


    In addition to setting the font and color, you can control additional text properties
    including line height and capitalization. The CSS line-height property is the
    distance from the bottom or baseline of one line of text to the baseline of the
    next line. Adjusting the line-height can improve readability by spacing out the
    text, but be careful not to add so much that you begin to have the opposite effect.
    The transform property, which accepts values of uppercase, lowercase, and capitalize,
    allows you to control the capitalization of text, which is particularly helpful
    with headings.


    # Apply Additional Text Formatting


    +   1 In your editor, open a document that contains an embedded style sheet.


    +   2 Within the style sheet, h1.


    +   3 Press Enter.


    +   4 Type (.


    +   5 Type text-transform: ?;, replacing with uppercase, lowercase, or capitalize.


    +   6 Press Enter.


    +   7 Type ).


