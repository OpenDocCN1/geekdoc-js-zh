  md: '# Set Text Color


    The CSS color property technically applies a color to the foreground of any element.
    In practice, however, only text is in the foreground; thus, the property is most
    often to change the color of text. Be sure that the color you choose fits within
    your site''s design, but also provides sufficient contrast with the background
    of your page to ensure that the text remains readable. You can apply color to
    entire blocks of text, or as shown in later sections, to individual words or even
    characters.


    # Set Text Color


