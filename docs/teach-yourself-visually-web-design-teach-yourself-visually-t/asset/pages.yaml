    id=''contact''>

    <option>Email</option>

    <option>Phone</option>

    <option>Mail</option>

    </select>

    <label for=''comments''>Additional comments:</label><br><textarea name=''comments''
    id=''comments'' rows=''5'' cols=''40\></textarea>

    ```


    +   2 Type <input>.


    +   3 Type type="submit".


    ```

    <input type=''radio'' name=''status'' value=''current'' id=''current'' /><label
    for=''current''>current customer</label>

    <input type=''radio'' name=''plan'' value=''future'' id=''future'' /><label for=''future''>future</label>

    <label for=''contact''>Please contact me via:</label><select name=''contact''
    id=''contact''>

    <option>Email</option>

