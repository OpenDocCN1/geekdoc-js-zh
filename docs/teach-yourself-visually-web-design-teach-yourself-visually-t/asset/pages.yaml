  md: '# Publish Your Web Site Using FTP


    In order for your Web site to be visible to other people, you must transfer the
    files from your local machine to your Web host''s servers. Although several different
    technologies are available to transfer files, by far the most common is FTP (file
    transfer protocol). FTP has been used for many years to allow for the transfer
    of files between computers and, in fact, predates the Web. You will also need
    an FTP client — software on your computer that you can use to create and maintain
    your FTP connection. Both Windows and Macintosh include a built-in command-line
    FTP.


    # Publish Your Web Site Using FTP


    +   1 From the Start menu, select Run.

    On a Mac, open the terminal from Applications Utilities Terminal.

    2 In the Run dialog box, type **ftp**.

    On a Mac, type **ftp** followed by the address of the server, and skip to step
    **6**.

    3 Click **OK**.


    ![](img/786eec77afb1e5789b8be7c26fd20881_335_0.png)


    The Windows FTP window opens.


    +   4 Type **open** ?, replacing **?** with the address of your host''s FTP server.

    5 Press **Enter**.

    6 Type your username.

    7 Press **Enter**.

    8 Type your password.

    9 Press **Enter**.


    ![](img/786eec77afb1e5789b8be7c26fd20881_335_1.png)


    The FTP server logs you in.


    322'
