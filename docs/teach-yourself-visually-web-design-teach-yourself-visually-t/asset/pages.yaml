    > TIP

    Because this file contains my username and password, how can I keep it safe?

    Once you have opened it in your Web browser to ensure that it works correctly,
    you should move outside of your Web server''s root folder. Many developers store
    it in the directory above the Web root. The Web server does not have access to
    files outside of its root, so a potential hacker cannot access it via a Web browser.
    PHP, on the other hand, can still access files outside of the root with its include
    function, so placing the file there limits access to to your PHP application.


