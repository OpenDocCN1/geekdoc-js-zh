  md: '# Replace the Main Content


    The main content in the starter pages includes instructions on how to use it.
    Although you can read over these instructions, you will want to remove them and
    replace it with your own. This content can consist of anything you would normally
    place on Web pages, with paragraphs, lists, or additional images. The starter
    pages contain several headings that you can replace, or can be deleted if you
    do not need them. You can select the text and type over it to keep the existing
    tags in place, or delete the selected text to remove the headings.


    # Replace the Main Content


    +   1 Select the Instructions header.


    +   2 Type your own main header.


    ![](img/786eec77afb1e5789b8be7c26fd20881_198_0.png)


    +   3 Select the remaining content in the main section.


    +   4 Type your own content, or paste it from another source.


    The sample content is replaced with your content.


