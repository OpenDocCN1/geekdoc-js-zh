  md: "# Use Margins and Padding to Fix Float Problems\n\nChapter 4 discussed how\
    \ you can add white space to your page by using the margin properties. When you\
    \ float a section of your page, you often need to set margins and padding on other\
    \ sections in order to fix layout problems that the floats create. For example,\
    \ if you float a sidebar to the left of a long main column, the main column will\
    \ wrap back to the left after the end of the sidebar. Applying a left margin to\
    \ the column that equals or exceeds the width of the sidebar fixes the problem.\n\
    \n# Use Margins and Padding to Fix Float Problems\n\n+   In your editor, open\
    \ a style sheet document linked to an HTML document.\n\nNote: The following steps\
    \ can also be done using an embedded style sheet.\n\n```\nspan {\n  text-align:\
    \ justify;\n  padding-left: 20px;\n  margin-top: 0;\n  margin-bottom: 10px;\n\
    }\n\n.contentssubhead {\n  font-weight: bold;\n  font-style: italic;\n}\n\n.content-1\
    \ {\n  font-family: Georgia, \"Times New Roman\", Times, serif;\n  margin-left:\
    \ 20px;\n}\n\n#hover {\n  margin-left: 20px;\n  border: 3px solid #540907;\n \
    \ background-color: #FFFFFF;\n  width: 560px;\n}\n\na:hover {\n  text-decoration:\
    \ none;\n  color: #37f2f2;\n}\n\na:active {\n  text-decoration: none;\n  color:\
    \ #37f2f2;\n}\n\na:focus {\n  text-decoration: none;\n  color: #37f2f2;\n}\n\n\
    #sidebar {\n  width: 150px;\n  padding-right: 20px;\n}\n```\n\n+   In the declaration\
    \ that contains the float, type padding-right: \"?\" if you used float:left, padding-left:\
