  md: "# Format Tables with CSS\n\nBecause CSS styling relies on applying rules to\
    \ elements on the page, designers are given a rich set of possibilities when styling\
    \ tables thanks to the number of tags involved. With some creativity, tables can\
    \ become one of the most visually exciting elements on a page. CSS properties\
    \ that format text, such as font and color, can be applied to the text cells.\
    \ In addition, background-color and background-image properties will work for\
    \ tables, rows, or cells. You can also use CSS to add and format the border of\
    \ the table.\n\n# Format Tables with CSS\n\n+   In your editor, open a document\
    \ that contains a table.\n\n+   If necessary, add an opening and closing <style>\
    \ tag to the head of the document.\n\nNote: The steps below can be done in an\
    \ external style sheet.\n\n+   Within the style sheet, type table.\n\n+   Press\
    \ Enter.\n\n+   Type {.\n\n+   Type background-color: ?, replacing ? with a valid\
    \ color value.\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 2.0 Transitional//EN\"\
    \n\"http://www.w3.org/TR/html2/html2-transitional.dtd\">\n<head>\n<title>Directory</title>\n\
