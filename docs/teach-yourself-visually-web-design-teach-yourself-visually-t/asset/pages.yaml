  md: '# Getting Started with HTML


    The browse file dialog box appears.


    +   5 Navigate to the folder into which you saved your Web page.


    +   6 Click the page.


    +   7 Click Open.


    The dialog box closes.


    ![](img/786eec77afb1e5789b8be7c26fd20881_38_0.png)


    +   The page opens in the browser.


    ![](img/786eec77afb1e5789b8be7c26fd20881_38_1.png)


    # TIPS


    Can I use any browser to test my pages?


    Although browsers have become consistently better over the last few years about
    displaying pages the same, differences still exist. Technically the answer is
    yes, you can use any browser, but you should ideally use several browsers instead
    of any one. At a minimum, Windows users should test their pages in Internet Explorer,
    Firefox, Safari, and Macintosh users should test on Safari and Firefox.


    Can I leave my page open in my editor when I test it in the browser?


    Yes. Most designers keep their editor and their browser open, and simply switch
    back and forth between them as needed to test their pages. Be sure to save the
    page in the editor before switching to the browser, and be to refresh the browser''s
    view each time you go back to it ensure that you are seeing the latest version
    of the page.'
