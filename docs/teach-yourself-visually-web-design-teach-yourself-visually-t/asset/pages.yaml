  md: "# Use Pseudo-Classes\n\npseudo-class can apply a style to an element based\
    \ on its current state. The most commonly used pseudo-classes are used to style\
    \ links in their five common states: normal, visited, hover, active, and focus.\
    \ The a:link pseudo-class applies a style to a link in its normal state. The a:visited\
    \ applies when you hover the target of the link. The a:hover applies when the\
    \ user mouses over the link, and a:active should apply when the link is selected\
    \ — for example, when are pressing your mouse down on it. Finally, a:focus defines\
    \ a style to be shown when Tab is used to navigate the page.\n\n# Use Pseudo-Classes\n\
    \n+   In your editor, open a page that contains an embedded style sheet.\n\n```\n\
