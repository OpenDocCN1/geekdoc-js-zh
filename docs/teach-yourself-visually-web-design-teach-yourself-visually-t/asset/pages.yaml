    Can I change the size of the field?


    Yes. You can use the HTML size attribute to set the field''s width. The attribute
    takes as its value a number, theoretically set to the number of characters that
    will display in the field. You can also use the CSS width property. See Chapter
    4 for more CSS.


    Can I restrict how much text a user can add to the field?


    Yes. Adding the maxlength attribute of the <input> tag restricts the user to entering
    only the specified number of characters into the field. You can also specify a
    value attribute to prepopulate the field with text.


