    | solid | A single line. |

    | double | A double line. The browser determines the space between lines. |

    | dotted | A series of dots makes up the border. The exact shape and position
    of the dots is up to the browser. |

    | dashed | A series of dashes, with the exact position determined by the browser.
    |

    | groove | A line with shading to create a slightly indented 3D effect. The shading
    is determined by the browser. |

    | ridge | The opposite of groove, ridge uses shading to create a raised appearance.
    |

    | inset | The browser uses two sides of the border to create the effect of the
