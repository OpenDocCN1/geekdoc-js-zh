  md: '# Publish a Flash Movie


    When you complete your Flash movie, you must publish it from the editing format,
    FLA, to the published format, SWF. The SWF is the file you add to your HTML document.
    Note, however, that SWF is not an editable format, so you should be sure to save
    the FLA file because you will have to return to it later if you want to make changes.
    The changed file must then be republished as an SWF.


    # Publish a Flash Movie


    +   1. In Flash Professional, open an existing Flash movie.

    2. Click File.

    3. Click Publish Settings.


    The Publish Settings dialog box opens.


    ![](img/786eec77afb1e5789b8be7c26fd20881_243_0.png)


    +   4. If necessary, enter a filename for the SWF.

    Note: Because this file will be linked to your Web page, be sure that the filename
    follows Web naming rules, as outlined in Chapter 1.


    +   5. Remove the check mark next to HTML changes.

    6. Click Publish.


    The file is published.'
  merge: -1
