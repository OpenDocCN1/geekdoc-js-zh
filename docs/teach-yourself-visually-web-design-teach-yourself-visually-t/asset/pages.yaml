  md: '# CHAPTER Adding Interactivity and Multimedia 9


    # JavaScript Is Not Java


    Java is a very powerful object-oriented programming language from Sun Microsystems,
    whereas JavaScript is a scripting language. Except for the name, they in fact
    have absolutely nothing in common. Although beginning Web designers commonly confuse
    the two, care should be taken not because no help is available for Java that would
    be useful for JavaScript programming, and vice versa.


    # JavaScript and HTML


    JavaScript allows developers to achieve many effects not offered by HTML. For
    example, HTML forms are extremely limited, and offer little in the way of validation
    mechanisms to ensure that the data entered is what is expected. JavaScript allows
    developers to write as complicated a validation scheme as they need on top of
    the form. JavaScript can also work in conjunction with CSS to achieve advanced
    visual effects such as drop-down menus, accordions, and more.


    ![](img/786eec77afb1e5789b8be7c26fd20881_222_0.png)


    # Ajax


    Ajax was developed as a way to allow designers and developers to extend the capabilities
    offered by HTML and CSS. Most Ajax development is done through prebuilt JavaScript
    libraries, saving you time in rewrite code. The better, more widely adopted libraries
    focus on good usability and accessibility, and also provide many features such
    as the ability for JavaScript to refresh only a portion of a Web page. The extremely
    popular Google Maps application is an example of Ajax.


    ![](img/786eec77afb1e5789b8be7c26fd20881_222_1.png)


    # JavaScript Libraries


    Today, many libraries of JavaScript functions exist that enable developers to
    implement complex scripting effects requiring that they write little or no script
    themselves. These libraries free developers from having to spend time coding and
    debugging applications, and allow them instead to focus on the end-user experience.


    ![](img/786eec77afb1e5789b8be7c26fd20881_222_2.png)


