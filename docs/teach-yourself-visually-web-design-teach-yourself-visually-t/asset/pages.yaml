  md: '# Create a Table


    Once you have created your database, tables are where your data is actually stored.
    Tables make up the core fields. Each field represents a distinct piece of your
    data. The data type is the kind of information that can be stored in a field.
    The most common are the variable-length character field, the fixed-length character
    field, floating-point or decimal numbers, dates and times, and Boolean or true-false.
    You need to specify the name and data type for each field you create.


    # Create a Table


    +   1 Open the phpMyAdmin page.

    Note: See the previous section for instructions on opening phpMyAdmin.

    2 Click the name of your database.

    3 Type a name for the table you want to create.

    4 Type the number of fields you want to add to your table.

    5 Click Go.


    ![](img/786eec77afb1e5789b8be7c26fd20881_311_0.png)'
