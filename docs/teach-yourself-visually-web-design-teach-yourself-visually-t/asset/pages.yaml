    To put the image on the Web, you need it saved as a JPEG, PNG, or GIF, although
    most photographs need to be JPEGs. You also need to optimize the image to maximize
    its quality while simultaneously minimizing its file size. The Save for Web feature
    in Photoshop Elements allows you to accomplish all of these goals.


    # Save an Image for the Web in Photoshop Elements


    +   1. Click File.


    +   2. Click Save for Web.


    ![](img/786eec77afb1e5789b8be7c26fd20881_85_0.png)


