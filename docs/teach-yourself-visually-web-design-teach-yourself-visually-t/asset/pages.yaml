    <option>Mail</option>

    </select>

    <label for="comments">Additional comments:</label>

    <textarea name="comments" id="comments" rows="5" cols="40"></textarea>

    <input type="submit" value="Contact us />

    </form>

    ```


    When you view the page in a browser, the button appears. If you click the button,
    the form''s data is submitted to the page specified in the <form> tag''s action.


    ![](img/786eec77afb1e5789b8be7c26fd20881_280_0.png)


    Can I also include a button to clear the form?


    Yes. HTML includes a type="reset" for both the <input> and <button> tags. However,
    you should carefully consider before you add the button if it will actually help.
    Users rarely fill out a form and then decide to clear it; rather, most of the
    time reset button is clicked by mistake, which is why most designers do not include
    it.'
  merge: -1
