  md: '# Rotate an Image in Photoshop Elements


    You may have pictures that you took by rotating your camera. You need to rotate
    these images so that they are oriented the correct way when you insert them into
    your page. Fortunately, Photoshop Elements automates this process. All you need
    to do to rotate an image is open the image in Photoshop Elements and then save
    it. When you open the image, Photoshop Elements analyzes it to see if it needs
    to be rotated. Once you save the image, the rotation is saved with it.


    # Rotate an Image in Photoshop Elements


    +   1. Click File.

    2. Click Open.

    3. Select an image that is rotated incorrectly.

    4. Click Open.


    The Open dialog box appears.

    Photoshop Elements automatically rotates the image to the correct orientation.


