  md: '# Download and Install WAMP on Windows


    In order to develop and test PHP pages, you need a Web server and PHP installed
    on your computer. Most of the time, you need a database. Although you can download
    and install them separately, a product known as WAMP greatly simplifies the process.
    WAMP, short for Windows, MySQL, PHP, provides a single installer for Apache, a
    popular open-source Web server, open-source database MySQL and PHP itself. Installing
    them together with WAMP, in addition to saving time, also frees you from worrying
    about configuring them to work.


    # Download and Install WAMP


    +   Go to http://www.wampserver.com/en/


    +   Click Downloads.


    +   Click Download WampServer 2.oi.


    Note: The version number might be slightly different.


    The Download dialog box appears.


    +   Click Run.


    The file downloads and the installer opens.


    Note: If you get any security warnings from Windows while installing, click Yes.


    The installation wizards appears.


    +   On the first step of the installer, click Next.


    The license agreement appears.


    +   Accept the license agreement and click Next.


    274


    ![](img/786eec77afb1e5789b8be7c26fd20881_287_0.png)'
