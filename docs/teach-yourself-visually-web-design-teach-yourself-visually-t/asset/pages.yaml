  md: '# Understanding URLs and File Paths


    Our Web site is a collection of linked pages. You can have links on your pages
    that take you to other pages in your site, other sites on the Web, other places
    within the same document, or e-mail addresses. The details of creating each of
    these links are covered in the following sections, but before you can start understanding
    the HTML syntax for links, you need to understand how to reference other pages
    in your document and other sites on the Web.


    # Relative Paths


    Pages within your site can be referenced from one another via a relative path,
    where the browser to the page to which you are linking is in relation to the current
    page. Think of this giving directions to someone on the street, where you tell
    them how to go based on your current location.


    ![](img/786eec77afb1e5789b8be7c26fd20881_47_0.png)


    # Pages in Folders


    When providing a relative path, you may have files for which you are linking that
    are in folders other than the one that contains the file with the link. If the
    page to which you are linking is in a folder, and that folder is the same folder
    as the page with the link, you simply provide the folder name, a slash, and the
    filename, as in products/widget.html.


    ![](img/786eec77afb1e5789b8be7c26fd20881_47_1.png)


    # Absolute Paths


    Hyperlinks to other sites on the Web need to use absolute paths for reference.
    Absolute paths contain the complete address to the site, including http://. Using
    an absolute path is similar to how you address a letter in the mail: You provide
    the complete address, regardless of where the letter originates.


    ![](img/786eec77afb1e5789b8be7c26fd20881_47_2.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# HTTP Prefix


    Absolute paths require that you use the complete address to the page in question.
    For most sites, this begins with http://, which is a way of telling the browser
    that you are using the HTTP protocol for this connection. Another common prefix
    is https://, the secure version of HTTP. You need to use whatever prefix is required
    by the site you are connecting to.


    ![](img/786eec77afb1e5789b8be7c26fd20881_48_0.png)


    # Host, Domain, and Top-Level Domain Name


    The part of the address that follows the prefix is made up of the host, the domain
    name, and the top-level TLD. In the example www.wiley.com, the host is www, the
    domain name is wiley, and the TLD is .com. Some sites, such as twitter.com, do
    not use a host. Other familiar TLDs include .net and .org.


    ![](img/786eec77afb1e5789b8be7c26fd20881_48_1.png)


    # Folder Path


    When you link to any page other than the home page in a site, the host, domain,
    and TLD are followed by the folder path to the page being requested. For example,
    a link to the address www.robhuddleston.com/books/tyvwebdesign.html is asking
    for a document, tyvwebdesign.html, in a folder called books at that site.


    ![](img/786eec77afb1e5789b8be7c26fd20881_48_2.png)


    # Requesting the Default Document


    Anytime you link to a site without requesting a specific page, as when you provide
    only the prefix, host, domain, and TLD, or anytime you link to a folder within
    a site, you are requesting that site''s or folder''s default document, more commonly
    the home page. For example, a link to http://www.yoursite.com/products actually
    returns the home page within the products folder.


    ![](img/786eec77afb1e5789b8be7c26fd20881_48_3.png)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Link to Other Pages in Your Site


    Hyperlinking is a core concept behind the Web, which was originally conceived
    as a set of hyperlinked documents. Web site''s navigation will consist of a set
    of hyperlinks to other pages in your site. Hyperlinks in HTML are created using
    the anchor tag, the language abbreviates to simply <a>. The tag has a required
    attribute, href, the value of which is set to the path to the page to which you
    are linking. Most of the time, you should do this using relative paths for links
    within your site.


    # Link to Other Pages in Your Site


    +   Open a page on which you want to add a hyperlink.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 transitional//EN"

    "http://www.w3.org/TR/html1/html1-transitional.dtd">

    <html>

    <head>

    <title>My first page</title>

    </head>

    <body>

    <a href="page1.html">come to my page!</a>

    <p><strong>please:</strong> take a few minutes to look around the site.</p>

    <p><em>feel</em> free to contact us for &amp;more information&amp;.</p>

    <p><a href="secondpage.html">second page</a></p>

    </body>

    </html>

    ```


    +   Before the text that will be linked, type <a href="?"> replacing ? with the
    path to which you are linking.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 transitional//EN"

