  md: '# # Insert a Photoshop Image (continued)


    Once you have selected a Photoshop image and its optimization settings, you can
    determine where on your site you wish to save it, set its alternate text, and
    insert it into the page. At this point, inserting the image works the same as
    inserting any other image on your page. In fact, that is what you are doing: the
    original PSD is not being added to your image, rather, you are inserting the optimized
    JPG, GIF or PNG.


    # ## Insert a Photoshop Image (continued)


    The Save Web Image dialog appears.


    +   1. Navigate to the folder within your site into which you want to save the
    image.


    ![](img/786eec77afb1e5789b8be7c26fd20881_205_0.png)


    +   2. Enter a filename for the image.


    +   3. Click Save.


