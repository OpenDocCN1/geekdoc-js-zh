- img_proc: true
  md: '# Creating a Page Visually in Dreamweaver


    The Image Preview dialog box appears.


    +   Select a desired format.


    +   Select desired optimization settings.


    +   Click File.


    ![](img/786eec77afb1e5789b8be7c26fd20881_204_0.png)


    The File tab appears.


    +   Set a desired scale, or enter width and height settings.


    +   Click OK.


    Dreamweaver prompts you to save the image.


    ![](img/786eec77afb1e5789b8be7c26fd20881_204_1.png)


    # TIPS


    Can I insert images created in other image-editing tools?

    You can use any editor to create the images for your Web site. However, you must
    use that editor to save the image as a GIF, JPEG, or PNG before inserting it into
    Dreamweaver. Only Photoshop images may be inserted directly.


    When I set the size in the Image Preview dialog box, am I actually resizing the
    image?

    Yes. Unlike setting an size in Dreamweaver''s Properties panel, the Image Preview
    dialog box actually resizes the image based on the values you specify.


    continued


