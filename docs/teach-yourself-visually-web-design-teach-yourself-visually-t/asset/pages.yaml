  md: "# Create Accessible Table Headings\n\nComplex tables may contain multiple heading\
    \ rows or columns, in both rows and columns. As a sighted user, you can constantly\
    \ reference the headings by looking back at them. A visually impaired user with\
    \ a screen reader, however, cannot do this and may become confused as the table\
    \ is linearized and read back. Fortunately, HTML provides a solution with its\
    \ headers and ID attributes. You can add IDs to each header, and reference that\
    \ ID in the scope of the cells. When the screen reader reads the page, it references\
    \ the relevant headers before reading the content of each cell.\n\n# Create Accessible\
    \ Table Headings\n\n+   1 In your editor, open a page that contains a table.\n\
    \n+   2 If necessary, convert <td> tags to <th> tags for any cells that serve\
    \ as headings.\n\n```\n```html\n&lt;table summary=\"This table displays contact\
    \ information. It contains columns: the first lists the employee name; the second,\
    \ the employee's department; the third, the employee's phone number.\"\\&gt;\n\
    \  &lt;caption&gt;Company Phone Directory&lt;/caption&gt;\n  &lt;th name=\"name\"\
    &gt;Name&lt;/th&gt;\n  &lt;th name=\"department\"&gt;Department&lt;/th&gt;\n \
    \ &lt;th name=\"phone\"&gt;Phone&lt;/th&gt;\n  &lt;tr&gt;\n    &lt;td&gt;Malcolm\
    \ Reynolds&lt;/td&gt;\n    &lt;td&gt;Administration&lt;/td&gt;\n    &lt;td&gt;555-1212&lt;/td&gt;\n\
    \  &lt;/tr&gt;\n  &lt;tr&gt;\n    &lt;td&gt;Inara Serra&lt;/td&gt;\n    &lt;td&gt;Public\
    \ Relations&lt;/td&gt;\n    &lt;td&gt;555-1234&lt;/td&gt;\n  &lt;/tr&gt;\n  &lt;tr&gt;\n\
    \    &lt;td&gt;Jayayne Cobb&lt;/td&gt;\n    &lt;td&gt;Security&lt;/td&gt;\n  \
    \  &lt;td&gt;555-4321&lt;/td&gt;\n  &lt;/tr&gt;\n&lt;/table&gt;\n```\n```\n\n\
    +   3 Add an ID attribute with an appropriate, logical value to each <th> tag.\n\
    \n+   4 In the code, convert headers=\"?\", replacing ? with the ID of the header\
    \ for that cell.\n\n```\n```html\n&lt;table summary=\"This table displays contact\
    \ information. It contains columns: the first lists the employee name; the second,\
    \ the employee's department; the third, the employee's phone number.\"\\&gt;\n\
    \  &lt;caption&gt;Company Phone Directory&lt;/caption&gt;\n  &lt;th id=\"name\"\
    \ name=\"name\"&gt;Name&lt;/th&gt;\n  &lt;th id=\"department\" name=\"department\"\
    &gt;Department&lt;/th&gt;\n  &lt;th id=\"phone\" name=\"phone\"&gt;Phone&lt;/th&gt;\n\
    \  &lt;tr&gt;\n    &lt;td&gt;Malcolm Reynolds&lt;/td&gt;\n    &lt;td&gt;Administration&lt;/td&gt;\n\
    \    &lt;td&gt;555-1212&lt;/td&gt;\n  &lt;/tr&gt;\n  &lt;tr&gt;\n    &lt;td&gt;Inara\
    \ Serra&lt;/td&gt;\n    &lt;td&gt;Public Relations&lt;/td&gt;\n    &lt;td&gt;555-1234&lt;/td&gt;\n\
    \  &lt;/tr&gt;\n  &lt;tr&gt;\n    &lt;td&gt;Jayayne Cobb&lt;/td&gt;\n    &lt;td&gt;Security&lt;/td&gt;\n\
    \    &lt;td&gt;555-4321&lt;/td&gt;\n  &lt;/tr&gt;\n&lt;/table&gt;\n```\n```\n\n\
