    # TIPS


    Linking to an e-mail address seems very easy, but I do not see this much on the
    Web. Why?

    Even though linking to an e-mail address is in fact easy, it simplifies designs.
    First, users must be using their own computer and must have a properly set-up
    email program as Microsoft Outlook in order for the link to work. Second, it is
    unfortunately easy for spammers to find your address when you use this technique,
    you will see a dramatic increase in the junk mail in your inbox.


    What other methods exist for allowing users to contact me?


    You can use an HTML form and server-side scripting, both of which are covered
    in later chapters (Chapters 11 and 12, respectively), and yet allow users to contact
    you. This is a far more common method on the Web today.


