  md: "# Create a Basic PHP Page\n\nPHP is a relatively easy-to-learn yet extremely\
    \ powerful scripting language. As a free and open-source language, it is also\
    \ extremely popular and used on many thousands of Web sites, including some of\
    \ the most-visited sites on the Web such as Facebook. PHP pages contain a mixture\
    \ of HTML for static elements and PHP for dynamic functionality. PHP code needs\
    \ to be written within a PHP delimiter, which simply surrounds the PHP block to\
    \ separate it from the HTML on the page. You can output code to the browser using\
    \ the PHP echo echo statement.\n\n# Create a Basic PHP Page\n\n+   1 Open an HTML\
    \ document in your editor.\n\n```\n<?php // Header Start\n<!DOCTYPE html PUBLIC\
    \ \"-////W3C//DTD HTML 1.0 Transitional//EN\"\n \"http://www.w3.org/TR/html11/DTD/html11-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=utf-8\" />\n  <title>Simple PHP</title>\n\
    </head>\n<body>\n|\n</body>\n</html>\n```\n\n+   2 Within the body of the document,\
    \ type the opening PHP delimiter <?php.\n\n+   3 Press Enter.\n\n```\n<?php //\
    \ Header Start\n<!DOCTYPE html PUBLIC \"-////W3C//DTD HTML 1.0 Transitional//EN\"\
    \n \"http://www.w3.org/TR/html11/DTD/html11-transitional.dtd\">\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\">\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=utf-8\" />\n  <title>Simple PHP</title>\n</head>\n<body>\n\
    \  <?php\n</body>\n</html>\n```\n\n280"
