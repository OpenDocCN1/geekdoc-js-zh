  md: '# Save an Image for the Web in Photoshop


    Photoshop uses a native format, PSD, to save its images. Most of the adjustments
    and edits you make to images in the program consist of saving it to this format,
    regardless of the format in which you began. You therefore need to save it for
    the Web as a GIF, JPEG, or PNG once you have completed editing. Photoshop''s Save
    for Web & Devices box provides an easy way to optimize the image and then save
    it to the appropriate format. Most images that you create or modify in Photoshop
    work best as JPEGs.


    # Save an Image for the Web in Photoshop


    +   1 Click File.

    2 Click Save for Web & Devices.

    3 Select a format from the pop-up menu.


