  md: '# About the Author


    Rob Huddleston has been developing Web pages and applications since 1994, and
    has been an instructor since 1999, teaching Web and graphic design to thousands
    of students. His clients have included the United States Bureau of Land Management,
    the United States Patent and Trademark Office, the States of California and Nevada
    and many other federal, city, and county agencies; the United Army and Air Force;
    Fortune 500 companies such as AT&T; Bank of America, Wells Fargo, Safeway, and
    Coca-Cola; software companies including Adobe, Oracle, Intel, and Autodesk; the
    University of California, San Francisco State University, and the University of
    Southern California; and hundreds of small businesses and nonprofit organizations,
    both in the United States and abroad. Rob is an Adjunct Professor at the Art Institute
    of California, Sacramento. He is also Adobe Certified Instructor, Certified Expert,
    and Certified Developer, serves as an Adobe User Group Manager, and has been named
    as Adobe Community Professional for answering user questions in online forums.
    He also helps users as an expert moderator on Adobe''s Community Help system.
    Rob lives in Northern California with his wife and two children.


    Rob is the author of XML: Your visual blueprint for building expert sites with
    XML, CSS, HTML, and XSLT; HTML, CSS: Your visual blueprint for designing effective
    Web pages; Master VISUALLY: Dreamweaver CS4 and Flash CS Professional; ActionScript:
    Your visual blueprint for creating interactive projects in Flash Professional;
    and the Flash Catalyst CS5 Bible. You can visit Rob''s blog at www.robhuddleston.com,
    or follow him on Twitter at twitter.com/robhuddleston.


    # Author''s Acknowledgments


    Writing is mostly a solitary pursuit, but I wouldn''t be able to continue doing
    without the unwavering love and support from my wife and best friend, Kelley,
    and our two beautiful children, Jessica and Xander. I hope you kids enjoy seeing
    your pictures in the book.


    The people at Wiley are a wonderful group with whom to work. Acquisitions editor
    Aaron Black, first approached me about this project, provided invaluable insight
    in getting started and then through some of the project''s tiring moments. I was
    pleased and thankful to work with project editor Sarah Hellert. Many thanks to
    tech editor Denis Cohen and copy editor Scott Tullis for adding their expertise.
    Bill Mead introduced me to an exciting opportunity teaching at the Art Institute,
    and helped with this book by pointing the example used in the section in jQuery.
    Ted Fitzpatrick and Nolan Erick helped explain some the intricacies of the Mac
    to me. Thank you to each of you for your help and your friendship.'
