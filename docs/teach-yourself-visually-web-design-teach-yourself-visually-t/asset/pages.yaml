    ![](img/786eec77afb1e5789b8be7c26fd20881_96_1.png)


    How can I add more colors to the Fill Color drop-down menu?


    Illustrator displays the current document’s swatches in the Fill Color drop-down
    menu. You can add new colors by clicking Window and Color and dragging the sliders
    to create a color. Then, click the pull-down menu in the top right corner of the
    panel and select Create New Swatch.


    Do I need to select the text with the Type tool to change font properties?


    No. You can change the font, color, size, alignment, and other font properties
    from the Control bar if you have the text box selected with the Selection tool,
    or if you select the text directly with the Type tool.'
