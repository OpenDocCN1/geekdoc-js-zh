  md: '# Save an Illustrator Image for the Web


    All images you create in Illustrator are saved in Illustrator''s native AI format.
    Similar to the Photoshop PSD format, images in the AI format cannot be placed
    directly on your Web site, but instead need to be using the Save for Web & Devices
    command. This command opens a dialog box almost identical to the one found in
    Photoshop that allows you to choose what Web-appropriate format you want to use
    and select the optimization settings that work best for your image.


    # Save an Illustrator Image for the Web


    +   1 Click File.

    2 Click Save for Web & Devices.


    ![](img/786eec77afb1e5789b8be7c26fd20881_99_0.png)


    The Save for Web & Devices dialog box appears.


    +   3 Select a preset.

    You can also modify the settings manually.

