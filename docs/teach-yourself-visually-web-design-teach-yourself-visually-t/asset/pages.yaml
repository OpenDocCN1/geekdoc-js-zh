  md: "# Use Contextual Selectors\n\nAny style can be applied anywhere on your page\
    \ with the appropriate class or ID selectors, but at times this can become cumbersome.\
    \ For example, if you wanted to apply a particular style to each item of a long\
    \ list, you might need to add a class attribute to every one of the items. A simpler,\
    \ cleaner solution is to use a contextual selector, which allows you to target\
    \ an element on its position within another element. With a contextual selector,\
    \ you could apply the desired style to the list items by referencing their position\
    \ within another element, such as a div with an ID.\n\n# Use Contextual Selectors\n\
    \n+   In your editor, open a page that contains an embedded style sheet.\n\n```\n\
