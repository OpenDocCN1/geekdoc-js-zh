    Debugging any complicated script can be difficult. You should first carefully
    review your code to ensure that you do not have any typographic errors. Pay particular
    attention to your use of capital and lowercase letters, single and double quotation
    marks, and semicolons. You can add echo statements at key locations in your script
    to output variables and values so that you can see those as the script executes.
    You can also turn on more robust error messages; for details on doing this, consult
    the PHP documentation at http://php.net/manual/en/.'
