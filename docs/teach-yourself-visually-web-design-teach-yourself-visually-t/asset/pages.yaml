  md: '# # Getting Started with HTML


    +   - Before a word you want to italicize, type `<em>`.


    +   - After the word, type `</em>`.


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html12/html12-transitional.dtd">

    <head>

    <title>My First Page</title>

    </head>

    <body>

    <h1>Welcome to my page!</h1>

    <p>Please <strong>take a few minutes to look around the site.</strong><p>Feel
    free to contact us for <em>more information</em>.</p>

    </body>

    </html>

    ```


    When viewed in a browser, the formatted text is both bold or italic.


    ![](img/786eec77afb1e5789b8be7c26fd20881_46_0.png)


    # TIPS


    I have seen pages that use `<b>` for bold. What is the difference?


    The `<strong>` tag is used to add strong emphasis to a word, whereas the `<b>`
    tag means "bold." Visually they are identical, but `<strong>` provides more semantic
    meaning — you are saying that the word is bold because you are emphasizing it,
    rather than merely providing a formatting instruction. The same is true with `<em>`,
    for emphasis, and `<i>`, for italic.


    Are there other tags besides `<i>` to italicize text? Yes. In fact, there are
    quite a few, but all have semantic meanings. For example, `<cite>` renders its
    text in italic, but logically marks the text as a citation. The `<address>` tag,
    used for denoting an address on a page, also renders in italic.'
