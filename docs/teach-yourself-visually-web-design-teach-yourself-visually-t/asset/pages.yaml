  md: '# Preview the Page in Other Browsers Using BrowserLab


    One of the biggest challenges facing designers is the need to test on multiple
    browsers across operating systems. This may well be cost-prohibitive, because
    it at a minimum requires that you have computers that run both Windows and the
    Macintosh OS. Even then you can have problems, because you can run only one version
    of Internet Explorer on a machine. BrowserLab is an online service Adobe provides
    allows you to view your page in a large set of browsers, including ones you do
    not have on your system.


    # Preview the Page in Other Browsers Using BrowserLab


    +   Double-click BrowserLab to open the panel.


    +   Click Preview.


    BrowserLab launches.


    +   Click Try BrowserLab.


