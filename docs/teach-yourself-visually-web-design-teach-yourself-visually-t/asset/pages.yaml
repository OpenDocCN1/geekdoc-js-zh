- img_proc: true
  md: '# Gather Your Materials


    Building a Web Site requires that you manage a host of assets, from the pages
    themselves to the style sheets that control their appearance to the images, ads,
    and videos you use. Keeping yourself organized makes the whole process much simpler.
    Whether you are working with a large site with many hundreds, or possibly thousands
    of files, or a smaller site with only a few dozen, disorganization can quickly
    eat up large amounts of time and the site''s budget. There is not one correct
    way to organize your site; use whatever method works best for you.


    # Root Folder


    All of your Web site''s files and assets eventually need to reside within a single
    folder on your hard drive. Thus, you should begin by creating this folder and
    moving any assets into it. The folder can be anywhere on your computer, and can
    be named however you want, but in Web terms the folder is known as the root.


    ![](img/786eec77afb1e5789b8be7c26fd20881_26_0.png)


    # Images


    Most sites require a lot of images. At this opening stage, you should be thinking
    about the images you need and begin collecting them, whether from your own collection,
    your company''s media department, or online stock-image resources.


    ![](img/786eec77afb1e5789b8be7c26fd20881_26_1.png)


    # Multimedia Assets


    If you plan to use audio and video files, you should begin to prepare for them
    early on because production of that media can require a lot of additional time
    and effort. If you have existing multimedia that you plan to use, copy it to your
    root now. Otherwise, begin the preproduction process as soon as possible to ensure
    that it does not delay the project.


    ![](img/786eec77afb1e5789b8be7c26fd20881_26_2.png)


    # Source Documents


    Many companies have marketing and other materials already ready in various electronic
    formats. You should try to collect those documents that contain information you
    need and place them in your root folder for easy access later.


    ![](img/786eec77afb1e5789b8be7c26fd20881_26_3.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# # Plan Your Navigation Structure


    Carefully laid-out navigation makes your site easy and intuitive to use, which
    in turn ensures that users have a more successful experience in your site. You
    should plan your navigation early in the design process, make sure that all important
    pages are navigable and to ensure that the navigation works with your design.
    Sites with poorly designed navigational structures quickly confuse and frustrate
    users, which is likely to cause them to give up and find another site. Good navigation
    should be intuitive that the user has to consciously think about it.


    # ## Main Navigation


    Your''s main navigation is the area that contains links to the primary sections
    of your site, such as your home page and departmental pages. The main navigation
    will likely appear on every page in the site, and is traditionally displayed either
    horizontally near the top of the site or vertically along the left side.


    ![](img/786eec77afb1e5789b8be7c26fd20881_27_0.png)


    # ## Section Subnavigation


    Each section of your site will likely require its own navigation to the pages
    within the section. Section navigation can be presented directly below or next
    to the main navigation, or as an independent unit. It should be visually obvious
    to users that these areas represent links within the section.


    ![](img/786eec77afb1e5789b8be7c26fd20881_27_1.png)


    # ## Think Like Users


    Do not organize your site''s navigation based on the internal organization of
    your company. Rather, approach the site from an outsider''s view, and organize
    your navigation based on the needs of your prospective users.


    ![](img/786eec77afb1e5789b8be7c26fd20881_27_2.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Plan Your File Structure


    Your site''s file structure is mostly for your benefit. You want to be sure that
    your site is organized in such a way as to allow you to easily find files as you
    need them. With organizing the site''s files, there is not any one "correct" way
    to lay out your site structure; you simply need to make sure that it makes sense
    to you. Most designers rely on nested folders to keep files organized. As important
    as the folder structure is the naming of folders: be sure that you use logical
    names.


    # Organizing Below the Root


    Some designers prefer to place only the home page directly in the root folder,
    and then place all other pages in the site in subfolders of the root. Others prefer
    to have all top-level pages directly in the root, with subfolders for each section.
    Use whatever plan makes sense to you, but be consistent.


    ![](img/786eec77afb1e5789b8be7c26fd20881_28_0.png)


    # Naming Folders


    The names of the folders in your site are visible to your site''s users on their
    browser''s navigation bar, so be sure to give your folders names make sense to
    you but also assist your users in navigating the site. Folder names must begin
    with a letter and cannot contain spaces.


    ```

    http://www.mysite.com/startup/

    ```


    # Images Directory


    Most designers place an images folder in the root, and put all of the site''s
    graphics in it. Bigger sites might require the image folder contain subfolders,
    or you might prefer each section of the site has its own images directory. As
    long as the organization is logical, you can use whichever method works best for
    you.


    ![](img/786eec77afb1e5789b8be7c26fd20881_28_1.png)


    # Other Assets


    Multimedia should most likely be placed in a single directory, although media-heavy
    sites may need further organization. Every site will contain one or more style
    sheets, which can be either placed directly in the root, in their own directory,
    or in each section''s directory. See Chapter 5 for more details on style sheets.


    ![](img/786eec77afb1e5789b8be7c26fd20881_28_2.png)'
