  md: '# CHAPTER 3

    Legally Acquiring Stock Images


    any creative work is protected by copyright. This applies to written works such
    as this book and as artistic works as photographs. You are of course free to use
    any image that you create if work for a large company, they will likely have sets
    of images that they have already acquired that are again safe to use on the company''s
    Web sites. Before you can use an image that you or your company did not create,
    you need to be sure that you have the legal right to use it.


    # Royalty-Free Images


    If you want to use someone else''s work, you must pay them for that work through
    royalties every time you use it. However, you may be able to pay for an image
    once and then freely that image from on. Such images are known as royalty-free
    images. Note that you may have to pay a fee upfront, so royalty-free does not
    necessarily mean free.


    ![](img/786eec77afb1e5789b8be7c26fd20881_64_0.png)


    # Stock Images


    Stock images are generally royalty-free images made available for use by companies
    and organizations. Stock images tend to be somewhat general in their subject matter:
    groups of people, animals, and scenery for common subjects for stock images.


    ![](img/786eec77afb1e5789b8be7c26fd20881_64_1.png)


    # When in Doubt, Do Not Use It


    The penalties for using someone else''s copyrighted material can be severe. The
    simplest way to protect yourself from getting sued for illegally using images
    is never use something unless you are absolutely certain doing so is okay. Do
    not use an image off a site unless you can find text on the page from which you
    are getting the image that clearly states that it is okay.


    ![](img/786eec77afb1e5789b8be7c26fd20881_64_2.png)'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# # Understanding Image Optimization


    Every image you add to a page increases the time the page takes to load in a browser.
    Optimizing your image is the process of reducing its file size while minimizing
    the impact of that reduction on the quality of the image. Every major graphics
    program offers tools to optimize images, but these generally provide an array
    of options that can be highly confusing, so you should gain a basic understanding
    of the various ways in which graphics can be optimized in order to better understand
    the process.


    # ## JPEG Optimization


    JPEGs are optimized by compressing the image. Unfortunately, this uses a technique
    known as loss compression, where data is removed from the image. Therefore, the
    more you optimize an image, the worse it will look. The compression is often expressed
    as a percentage, with 100% indicating that all of the original data has been retained
    and no compression.


    ![](img/786eec77afb1e5789b8be7c26fd20881_65_0.png)


    # ## GIF Optimization


    You can optimize a GIF by removing unnecessary colors from it. GIFs can contain
    up to 256 colors, but they do not need to use all of those. A simple logo may
    be made up of only one or two colors, so saving additional color information is
    nothing more than a waste of space. However, more complex images may start to
    lose quality if you remove needed colors.


    ![](img/786eec77afb1e5789b8be7c26fd20881_65_1.png)


    # ## PNG Optimization


    PNG files can be compressed via lossy compression, just like JPEGs, or via removing
    colors, like GIFs. PNGs can also contain additional embedded data that describes
    the image to editing software but is unnecessary when used on Web pages, removing
    this data can be seen as a form of optimizing for the format.


    ![](img/786eec77afb1e5789b8be7c26fd20881_65_2.png)'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# CHAPTER

    Creating Images 3


    # GIF and PNG Features


    GIF supports optional features such as animation and transparency. PNG products
    make your image look better, but also adds to the file size. Therefore, choosing
    to not use these features reduces the size of the images.


    ![](img/786eec77afb1e5789b8be7c26fd20881_66_0.png)


    # Choosing the Right Format


    Because the JPEG and GIF formats were specifically designed for a particular image
    type, each is inherently more efficient when used on the correct type of image.
    An image that should be saved as a JPEG will be larger if you attempt to save
    it as a GIF, and vice versa.


    ![](img/786eec77afb1e5789b8be7c26fd20881_66_1.png)


    # Scale and Crop Images


    Images with needlessly large pixel dimensions will also be needlessly large files.
    Using a good image-editing tool to reduce the dimensions of the image dramatically
    reduces its file size. You can crop unneeded portions out of the image to reduce
    its size.


    ![](img/786eec77afb1e5789b8be7c26fd20881_66_2.png)


    # Resolution


    Image resolution describes the number of pixels per inch in an image. Whereas
    images for print need to have a high resolution, images for the Web should never
    be more the 72 dots or pixels per inch. Many computer screens are simply incapable
    of displaying higher-resolution images, so keeping the image at a higher resolution
    simply wastes file size.


    ![](img/786eec77afb1e5789b8be7c26fd20881_66_3.png)'
  merge: -1
