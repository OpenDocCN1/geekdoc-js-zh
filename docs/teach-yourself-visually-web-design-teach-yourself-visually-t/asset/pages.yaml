  md: '# Group Elements with Divs


    There may be times when you have a group of elements you need to style. For example,
    the banner area at the top of your page may be made up of one or more images,
    a heading, and a set of links for your primary navigation. You can apply styles
    to these tags by grouping them with the <div> tag. Like the <span> tag, <div>
    does not have any default formatting properties, and allows you to logically group
    other elements into sections and apply styles accordingly.


    # Group Elements with Divs


    +   1 In your editor, open a page that contains an embedded style sheet.

    2 Within the body of your document, type <div> before the first element you want
    to include in the group.

