  md: '# Set Up Remote Server Information in Dreamweaver


    If you use Dreamweaver to create your site, you can also use it to upload your
    files to your server. The Panels can be expanded to make file transfer easier.
    The first time you expand the panel, you are prompted to define a remote server.
    This process allows you to define the necessary remote server information so that
    Dreamweaver can connect to your host''s Web servers and upload your files. Your
    hosting company will provide the information you must enter, most likely in the
    initial e-mail they sent after you signed up for their service.


    # Set Up Remote Server Information in Dreamweaver


