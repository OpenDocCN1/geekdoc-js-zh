  md: "# # Send E-mail with PHP\n\nA very common request from bosses and clients is\
    \ the ability to give the data entered into a form to a given address. Fortunately,\
    \ PHP makes this very easy through the use of mail() function. The function takes\
    \ three arguments: the first is the address to which the e-mail should be sent;\
    \ the second, the subject of the e-mail; and the third, the message itself. Any\
    \ or all of these can be variables from an HTML form. Pages that send e-mail should\
    \ also have additional code to display some confirmation message to the user.\n\
    \n# ## Send E-mail with PHP\n\n+   1. In your editor, open or create an HTML form\
    \ that contains fields for a user to enter a subject and message.\n\n![](img/786eec77afb1e5789b8be7c26fd20881_299_0.png)\n\
    \n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/html1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=utf-8\"\">\n<title>Send Email</title>\n\
    </head>\n<body>\n<form method=\"post\" action=\"sendmail.php\">\n<fieldset>\n\
    <legend>Send Email</legend>\n<label for=\"subject\">Subject:</label><input type=\"\
    text\" name=\"subject\" id=\"subject\br>\n<label for=\"message\">Message:</label><br>\n\
    <textarea name=\"message\" id=\"message\" rows=\"5\" cols=\"40\"></textarea>\n\
    <input type=\"submit\" value=\"Send Message\" />\n</form>\n```\n\n+   2. In your\
    \ editor, open a new PHP document.\n\n+   3. Type <?php.\n\n+   4. Type mail(\"\
    ?\", $_POST['subject'], $_POST['message']\\); replacing the first with your email\
    \ address, with the name of the subject field from the HTML form, and the third\
    \ with the name of the message field from the form.\n\n![](img/786eec77afb1e5789b8be7c26fd20881_299_1.png)\n\
    \n```\n<?php\nmail(\"you@example.com\", $_POST['subject'], $_POST['message']);\n\
    ?>\n```\n\n+   5. Type ?>.\n\n+   6. Type <p>Your email message has been sent.</p>.\n\
    \nThe e-mail capability is added to the form."
  merge: -1
  pgno: 299
