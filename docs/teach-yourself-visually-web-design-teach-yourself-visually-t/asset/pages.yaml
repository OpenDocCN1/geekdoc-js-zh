  md: '# Add Navigation


    Dreamweaver''s starter pages include a set of sample navigation links that can
    be quickly converted into your site''s primary navigation in the sidebars. These
    sidebars have a listed to look like navigation buttons. You can simply replace
    the placeholder text and hyperlinks to create your navigation. Hyperlinks can
    be added in Dreamweaver by entering the address to which you want to link to in
    the Properties panel. Part of the style sheet''s specification for lists that
    are not underlined.


    # Add Navigation


    +   1. Select Link.


    +   2. Type the text you want to use your first link.


    +   3. On The Properties panel, replace the # in the Link text with the address
    to your page.


    ![](img/786eec77afb1e5789b8be7c26fd20881_200_0.png)


    +   4. Repeat Steps 1 to 3 for each remaining link on the page.


    +   5. If you need more than four links, press Enter.


    +   6. Type the new link text.


    +   7. On the Properties panel, add an address in the Link text box.


    +   8. Press Enter. The navigation is created.


    ![](img/786eec77afb1e5789b8be7c26fd20881_200_1.png)'
