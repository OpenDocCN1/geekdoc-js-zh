  md: '# Display the Contents of a Table on a Web Page


    You can use PHP and SQL statement to return the records from the table and display
    them on a Web page. In PHP, you can create a variable that stores the SQL statement.
    SQL can return the records in a table with a SELECT statement. Following the SELECT
    keyword, you put the names of the fields you want to return, followed by the FROM
    keyword and the name of the table. Once you have created the SQL statement, you
    can call the PHP mysql_query() function, passing the variable with the query as
    your function''s argument.


