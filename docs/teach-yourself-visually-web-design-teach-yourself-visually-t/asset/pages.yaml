  md: '# Create Complex Tables


    Sometimes, you may need tables that do not follow a simple row or column. You
    can use the HTML rowspan and colspan attributes, both of which can be added to
    table cells, to accomplish this. Both as their value integer representing the
    number of cells to be spanned. A row that contains a colspan in one of its cells
    has a correspondingly lower number of overall cells, whereas a rowspan results
    in missing cells from an equal number of rows.


    # Create Complex Tables


    +   1. In your editor, open a document that contains a table.


    ![](img/786eec77afb1e5789b8be7c26fd20881_179_0.png)


    +   2. Within the table, <tr>.


    +   3. Press <Enter>.


    +   4. <td colspan="*">, replacing ? with the number of columns you want the cell
    to span.


    +   5. Type the contents of the cell.


    +   6. Type </td>.'
