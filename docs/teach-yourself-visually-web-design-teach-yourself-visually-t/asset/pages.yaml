    | | 25 26 27 28 29 30 31 |


    # ## Browser Support


    Every modern browser offers full support of JavaScript. Microsoft''s Internet
    Explorer officially supports ECMAScript, but this in effect means support of JavaScript.
    You can safely assume that unless your user has specifically disabled it, browsers
    will run your scripts.


    ![](img/786eec77afb1e5789b8be7c26fd20881_221_1.png)


