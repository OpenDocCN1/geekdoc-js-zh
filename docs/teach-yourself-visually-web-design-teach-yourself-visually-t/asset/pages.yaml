  md: '# Add an Ordered List


    Ordered or numbered lists are less common than unordered or bulleted lists, but
    are nonetheless quite useful on many sites. The ordered list uses an <ol> tag
    to define the overall list, but then relies on <li> tags to define the items,
    just as the unordered list. Browsers automatically control the numbering of items
    of the list, so you can freely add, remove, and rearrange the items without needing
    to worry about the numbers themselves. Nested, ordered lists use numbering schemes
    to differentiate them.


    # Add an Ordered List


    +   1. Open a new or existing HTML document in your editor.


    ![](img/786eec77afb1e5789b8be7c26fd20881_187_0.png)


    +   2. In the body of the document, type <ol>.


    +   3. Press Enter.


    +   4. Type <li>.


    +   5. Type an item for the list.


    +   6. Type </li>.


    +   7. Press Enter.


    ![](img/786eec77afb1e5789b8be7c26fd20881_187_1.png)'
