    > TIP I have seen pages that use tables to create multicolumn layouts. Is this
    a good idea?


    Not really. For years, before the adoption of CSS, tables provided the only feasible
    means by which multicolumn layouts could be approximated. However, using tables
    limits the editability of your page, adds considerably to the size of the page,
    and restricts the ability of search engines to effectively index your page and
    of disabled users to effectively use it. Therefore, tables should be limited to
    presenting tabular data only.'
