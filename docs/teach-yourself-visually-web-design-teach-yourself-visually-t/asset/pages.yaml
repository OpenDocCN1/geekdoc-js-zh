    ![](img/786eec77afb1e5789b8be7c26fd20881_90_1.png)


    # TIPS


    Can I modifying existing images as well as create new ones in Fireworks?


    Yes. Fireworks provides tools not only for creating new images, but also for manipulating
    existing images. In fact, most of the things you can do in Photoshop can be done
    in Fireworks.


    When I click the Color Picker, do I not see many colors to choose from. Are there
    more available?


    Yes. Fireworks displays a limited color palette at first, but you can click the
    small color wheel in the top right corner of the Color Picker to open a dialog
    box from which you can select almost any color.


