  md: '# Create a Menu Using Spry


    Spry is an Ajax framework from Adobe. Unlike many other frameworks, Spry focuses
    on visual components and effects, although it does have the ability to read and
    interpret XML and HTML data files. You can use Spry with almost no code if you
    use Dreamweaver, because Spry functionality is included directly in the program.
    However, Adobe does make the Spry framework available for anyone to download and
    if desired. One of the commonly used Spry widgets is its Menu Bar, which creates
    an interactive menu with flyout menus.


    # Create a Menu Using Spry


    +   1 In Dreamweaver, open an existing or new document.


    +   2 On the Insert panel, click Common.


    +   3 Click Spry.


    The Insert panel opens to show the Spry widgets.


    +   4 If necessary, scroll down on the panel and click Spry Menu Bar.


    Note: If you are prompted to save your document at this point, click Yes.


    +   5 Select which you want a vertical or a horizontal menu (changes to).


    +   6 Click OK.


