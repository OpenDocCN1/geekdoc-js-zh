  md: '# Use Google Webmaster Tools


    Google is far and away the most popular search engine, so any discussion on search
    optimization by necessity begin with pages listed on Google. Although the company
    guards their specific search algorithms to attempt to impede the efforts of those
    who abuse the service, they provide a series of tools for Webmasters to help them
    ensure that their pages follow the company''s guidelines, as well as to track
    statistics as to what keywords result in the page appearing and how the page ranks.


    # Use Google browser tools


    +   1 In your browser, go to. google.com/webmasters/.


    +   2 Either log in with an existing Google account, or create one.


    Note: If you do not have an account, click **Create an account** now and follow
    the instructions to create the account.


    +   3 Add a site.


    +   4 Type the address of the site you want to track under Sites in the text box.


    +   5 Follow the instructions to verify the site.


    +   The verified sites appear here.


