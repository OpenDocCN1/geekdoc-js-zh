  md: '# # Adding Interactivity and Multimedia


    16 Click and drag the right edge of the tween on the Timeline to extend or shorten
    its duration.


    17 Press Ctrl + Enter (Control + Enter).


    ![](img/786eec77afb1e5789b8be7c26fd20881_242_0.png)


    The test window opens and shows the animation.


    ![](img/786eec77afb1e5789b8be7c26fd20881_242_1.png)


    # TIPS


    Can I prevent the animation from looping?

    Yes. Flash contains a powerful scripting language known as ActionScript allows
    you to plenty control over your movie. ActionScript allows you to add code to
    everything from stopping the movie to looping to much more complex functions such
    as loading external, server-based content. ActionScript: Your visual blueprint
    for creating interactive projects in Flash CS4 Professional (Wiley, 2009) guides
    you through the language.


    What does the line with the dots on the stage represent?

    When you create a tween, Flash draws the line on the stage to show you the path
    the shape will take. The dots represent each frame. You can drag this line to
    bend if you want your shape to follow a curved path.


