  md: '# Convert a Video to Flash Video


    Many sites today include video. Although shooting and producing video is a skill
    in and of itself, placing the video on the Web is not difficult, thanks to Flash.
    Flash video is the most popular video format found on the Web today, and is used
    on sites including YouTube and Facebook. The video format your camera uses will
    not be compatible with Flash Player, so the first step in getting your video onto
    the Web is to convert it to the Flash Video format. The Adobe Media Encoder, included
    free with any of the Creative Suite editions, performs this task for you.


    # Convert a Video to Flash Video


    +   1 Open the Adobe Media Encoder.

    \ In Windows, click Start, All Programs, the folder in which your Adobe programs
    reside, and then Adobe Media Encoder.

    \ On a Mac, use Finder to find your Applications folder and then select Adobe
    Media Encoder.

    2 Click Add.

    3 Navigate to the folder that contains your video file.

    4 Select the video you want to convert.

