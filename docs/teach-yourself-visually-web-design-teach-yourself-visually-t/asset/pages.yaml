  md: '# Process Form Data


    With PHP, you can accept data from an online form and have your site respond according
    to the data you use. Data may be accessed in a PHP page by referencing a super-global,
    which is a special type of built-in variable in the language. The $_POST super-global
    contains a reference to any form field submitted to the page. For example, a field
    in HTML with a name attribute can be accessed using $_POST[''firstName'']. Note
    that the field names are case-sensitive, they must match your HTML exactly.


    # Process Form Data


    +   1. In your editor, open an HTML document that contains an existing form.

    Note: Be sure that the form is saved in the Web server''s root folder.

    2. Note the names of each of the fields in the form.

    3. Note the filename specified in the form''s action attribute.

    4. In your editor, open a new or existing document.

    5. Within the body of the document, use <php.

    6. Type echo ""; replacing with the label from the first form field.

    7. Type $_POST[''...''], replacing with the first field name.

    8. Type echo <br />

    9. Repeat Steps 6 to 8 for each additional form field you want to display.


    ![](img/786eec77afb1e5789b8be7c26fd20881_297_0.png)


    284'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# CHAPTER 12 Creating Dynamic Pages


    10 Save the page in the Web server''s root folder, using the filename you noted
    in Step 3.


    11 In your Web browser, open the HTML document from Step 1.


    12 Fill in the form fields and then click the button.


    ![](img/786eec77afb1e5789b8be7c26fd20881_298_0.png)


    The resulting PHP page appears, showing the values from the form.


    ![](img/786eec77afb1e5789b8be7c26fd20881_298_1.png)


    Does it matter what method I use on the form?


    Yes. The $_POST super-global reads form variables only if the method is set to
    post. You can use the $_GET super-global to read variables from a form that uses
    get. A third super-global, $_REQUEST, exists that can read values from either
    method, but using it is not recommended.


    What does the dollar sign represent?


    PHP uses the dollar sign as the first character of any variable name. Because
    the super-globals are variables, they begin with the dollar sign. Variables you
    create yourself, as shown in upcoming tasks, also begin with the symbol.


    285'
