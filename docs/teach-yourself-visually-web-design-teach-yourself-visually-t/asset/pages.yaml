  md: '# Replace the Content in the Sidebar and Footer


    The starter pages consist of three basic layouts for the main content. There are
    one-column, two-column, and three-column layouts. The two- and three-column layouts
    contain one or two sidebars for you to add additional content. Many layouts also
    contain a footer area, often used for copyright notices. Rather than type the
    new content, however, if you copy and paste it from a word processor or other
    program that formats text, some or all of that formatting can be copied with the
    text.


    # Replace the Content in the Sidebar and Footer


    +   - Select the text in the sidebar.

    - Type your own content, or paste it from another source.


    ![](img/786eec77afb1e5789b8be7c26fd20881_199_0.png)


    +   - Select the content in the footer.

    - Replace it with your content.


    Note: To insert the copyright symbol, Insert, HTML, Special Characters, and Copyright.


    The content in the sidebar and footer is replaced.


    ![](img/786eec77afb1e5789b8be7c26fd20881_199_1.png)


