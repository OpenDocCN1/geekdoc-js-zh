  md: "# Create a Sitemap\n\nOne of the easiest ways to get Google and other search\
    \ engines to catalog the pages in your site is This special file allows you to\
    \ tell the engine what pages on your site should be added to their index. Sitemaps\
    \ for search engines should follow the structure developed at the Sitemap.org\
    \ Web site. The document is written in XML, a tag-based language very similar\
    \ to HTML. You may always use absolute paths for your pages. Other options allow\
    \ you to define how often your page is updated to get engines to see the latest\
    \ revisions.\n\n# Create a Sitemap\n\n+   1 Create a new blank document in your\
    \ editor.\n\n+   2 Type <?xml version=\"1.0\" encoding=\"utf-8\"?\n\n+   3 <urlset>\n\
    \n+   4 Type xmlns=\"www.sitemap.org/schemas/sitemap.0.9\">\n\n+   5 <url>\n\n\
    +   6 <loc>\n\n+   7 Type the path to your homepage.\n\n+   8 </loc>.\n\n```\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<urlset xmlns=\"http://www.sitemap.org/schemas/sitemap.0.9\"\
    >\n  <url>\n    <loc>http://www.tyindustries.com/</loc>\n  </url>\n</urlset>\n\
    ```"
  merge: -1
  pgno: 347
- img_proc: true
  md: "# Publishing Your Site and Getting Noticed 14\n\n+   9 Type </url>.\n\n+  \
    \ 10 Repeat Steps 5 to 9 to add additional pages to the sitemap.\n\n+   11 Type\
    \ </urlset>.\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\" ?>\n<urlset xmlns=\"\
    http://www.sitemap.org/schemas/sitemap/0.9\">\n  <url>\n    <loc>http://www.tyvindustries.com/</loc>\n\
    \  </url>\n  <url>\n    <loc>http://www.tyvindustries.com/contact.html</loc>\n\
    \  </url>\n</urlset>\n```\n\nWhen viewed in a Web browser, the XML structure will\
    \ appear, showing that the document is written correctly.\n\n![](img/786eec77afb1e5789b8be7c26fd20881_348_0.png)\n\
    \n# TIP\n\nDo I need a sitemap for every site?\nSitemaps are most useful on sites\
    \ with frequent changes, such as blogs. Most blog software includes a tool to\
    \ generate a sitemap and keep it up to date as you add content to the blog. Many\
    \ blog packages do this automatically, so you never even have to think about it.\
    \ Check the documentation for your blog to see if it includes sitemap-generation\
    \ features.\n\n335"
