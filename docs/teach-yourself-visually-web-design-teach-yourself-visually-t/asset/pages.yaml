  md: '# Save Your Web Page


    Before you can preview your page or allow others to see it, you need to save your
    document. Saving a Web page does not involve any special steps — simply use your
    editing program’s Save feature. You need to be sure that you save the file into
    your Web site''s root folder, or a subfolder of the root. Your file''s name must
    start with a letter, and can contain only letters, numbers, and underscore characters.
    Your page can end with .html or .htm. Your homepage will likely need to be saved
    as either index.htm or index.html.


    # Save Your File.


    +   - Click File.

    - Click Save As.


    ![](img/786eec77afb1e5789b8be7c26fd20881_35_0.png)


    The Save As dialog box appears.


    +   - Type a name for your Web page.


    ![](img/786eec77afb1e5789b8be7c26fd20881_35_1.png)'
