  md: '# Create Animation Using Flash Professional


    Flash has for years been the de facto standard for Web animation. Advertising,
    games, and video are just a few of its many uses. Although Adobe currently has
    several tools that can create Flash-based content, Flash Professional CS5 is the
    one familiar and easiest to learn for designers. Its interface closely matches
    that of other tools in Adobe''s Creative Suite. To create simple animation, you
    begin drawing shapes on the stage, using tools similar to those found in Illustrator.
    Then, you convert these shapes to symbols reusable objects that can be animated.


    # Create Animation Using Flash Professional


    +   1 From the Flash Welcome screen, ActionScript 3.0.


    ![](img/786eec77afb1e5789b8be7c26fd20881_239_0.png)


    A new document opens.


    +   2 Click the Rectangle tool ( ).


    Note: You can press and hold your mouse button on the tool to see a menu of other
    shape tools.


    +   3 On the Properties panel, click Fill Color.


    +   4 Select a color.


    +   5 Click and drag on the stage to create the shape.


    ![](img/786eec77afb1e5789b8be7c26fd20881_239_1.png)


    226'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# CHAPTER 9


    +   6 Click the Selection tool (selection).


    +   7 Double-click the shape to select its fill and stroke.


    +   8 Click Modify.


    +   9 Click Convert to Symbol.


    The Convert to Symbol dialog box opens.


    +   10 Enter a name for the symbol.


    +   11 Select Movie Clip.


    +   12 Click OK.


    The shape is converted to a symbol and ready to be animated.


    ![](img/786eec77afb1e5789b8be7c26fd20881_240_0.png)


    > TIP


    What is a Movie Clip?

    Flash supports three types of symbols: Movie Clips, Buttons, and Graphics. Movie
    Clips are the most commonly used because they are the most versatile. Buttons
    provide for user interaction by allowing you to change their appearance when the
    user mice over and clicks the button. Graphics are the most basic type of symbol,
    but are rarely used because they have significant limitations not shared by Movie
    Clips.


    continued


    227'
