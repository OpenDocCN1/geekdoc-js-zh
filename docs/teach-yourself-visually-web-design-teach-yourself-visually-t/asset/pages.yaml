  md: "# Create Accessible Navigation\n\nUnder normal circumstances, a visually impaired\
    \ user's screen reader reads through the page chronologically. Because most sites\
    \ have the navigation at or near the top of the document, users must ensure having\
    \ all of the links to read them for each and every page, which can quickly become\
    \ annoying. The solution, a skip navigation link, is simple to implement. Provide\
    \ a descriptive ID attribute to the main content, and provide a link just before\
    \ the navigation to that spot on.\n\n# Create Accessible Navigation\n\n+   1.\
    \ Open a page in your editor.\n2. In the element that wraps the main content,\
    \ or the main content's first element, add a descriptive ID attribute if one does\
    \ not already exist.\n3. Near the top of the page, type <a href=\"#?\\>, replacing\
    \ the link you added in Step 2.\n\n```\nindex: Homepage\n<body>\n  <div class=\"\
    container\">\n    <div class=\"header\"><a href=\"\n```\n\n248"
