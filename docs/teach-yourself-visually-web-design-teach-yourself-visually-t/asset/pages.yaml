  md: '# Link to an E-mail Address


    You will likely want your users to be able to contact you from your site, where
    to order products, get more information, or simply communicate. The easiest way
    to facilitate this contact is by providing a link to your e-mail address. Once
    again, you use the anchor tag with an href attribute, but this time, the attribute''s
    value begins with mailto:, followed by the address to which you want the e-mail
    to be sent. When your user clicks the link, a new e-mail message is created in
    your user''s email program, with the address you specified filled into the Field:


    # Link to an E-mail Address


