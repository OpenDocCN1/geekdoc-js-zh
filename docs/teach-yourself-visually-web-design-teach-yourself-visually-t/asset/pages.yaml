  md: '# Get to Know the Photoshop Interface


    For over 20 years, graphic designers and photographers have relied on image manipulation
    and correction. Today, Photoshop is a staple for Web designers who need to make
    their images ready for their sites. Unlike software created by many other companies,
    Adobe''s Creative Suite products, including Photoshop, place the tools and most
    features in panels, which are docked on the left and right sides of the screen.
    This gives you much faster access to these features than what you find in other
    programs, but can make the interface appear overwhelmingly complex at.


    # Menu Bar


    Menus for working with files, changing views, and accessing other commands.


    # View Buttons


    These buttons allow you to change your view, zoom in and out, and and access Bridge.


    # Workspace Menus


    You can change the layout of the program by selecting one of these workspaces.


    # Toolbox


    All of the basic tools for working in Photoshop are accessible here.


    # Document Tabs


    Switch between open documents by clicking these tabs. If you use a Mac, you may
    not see these tabs.


    ![](img/786eec77afb1e5789b8be7c26fd20881_71_0.png)


    # Panels


    Most of Photoshop''s controls are available via these panels.


    # Document Information


    The size and current magnification of the document are shown here.'
