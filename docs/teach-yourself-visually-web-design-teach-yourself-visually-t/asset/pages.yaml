    When viewed in a Web browser, the text appears separated into distinct paragraphs.


    ![](img/786eec77afb1e5789b8be7c26fd20881_44_0.png)


    # TIPS


    Can I control how much space appears between paragraphs?


    Yes. Cascading Style Sheets (CSS) allows you to precisely control the spacing
    between paragraphs, along with the font and color of the text and almost everything
    else with the paragraph’s appearance. CSS is covered in detail in later chapters.


    Why can I not just press the Enter key in my code to create paragraphs? Why do
    I need the <p> tag?


    HTML is whitespace-insensitive, so pressing Enter in your code does not create
    paragraph breaks on the page in the browser. You can separate the text only by
    using the HTML tags.


