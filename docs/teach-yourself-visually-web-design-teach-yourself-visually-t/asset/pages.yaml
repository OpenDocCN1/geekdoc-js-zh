- img_proc: true
  md: '# Add Images


    You can add images to your page using Dreamweaver''s Insert panel, which allows
    you to simply navigate to the PNG, GIF, or JPEG image on your hard drive. Images
    should already be located somewhere within your site''s folder, in a directory
    devoted solely to images. If you navigate to an image outside of your root, Dreamweaver
    asks if you want to move it into your site. It copies the image into the directory
    that you specify. When you insert the image, Dreamweaver prompts you for alternate
    text. Provide a text description of the image for people with disabilities.


    # Add Images


    +   1 Click the spot on the page where you want to place an image.


    +   2 Double-click Insert.

    The Insert panel opens.


    +   3 Click Images:Image.


    +   4 Click Image.


    The Select Source dialog box appears.


    +   5 Navigate to the folder that contains your image.


    +   6 Select the image.


    +   7 Click OK.


    ![](img/786eec77afb1e5789b8be7c26fd20881_201_0.png)'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# CHAPTER 8


    The Image Tag Accessibility Attributes dialog box appears.


    +   Type a description of the image in the Alternate Text box.


    +   Click OK.


    +   The image is inserted into the page.


    # Creating a Page Visually in Dreamweaver


    ![](img/786eec77afb1e5789b8be7c26fd20881_202_0.png)


    ![](img/786eec77afb1e5789b8be7c26fd20881_202_1.png)


    # TIPS


    Do I need to provide alternate text for every image?


    Screen readers — devices used by blind users read the alternate text when they
    encounter images on Web pages, so you should always provide descriptive text for
    every image you insert.


    Can I resize an image in Dreamweaver? Yes, you can enter a new width and height
    in the Properties panel. Be aware, however, that this merely adds HTML code to
    change the size, and is not as effective as using an image-editing tool for resizing.


    189'
