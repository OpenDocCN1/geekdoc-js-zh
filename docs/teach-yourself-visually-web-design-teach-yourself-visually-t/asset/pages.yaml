  md: '# Add Video with HTML5


    Although the next version of HTML is not due to be released as a full standard
    for at least a decade, some browsers are already adopting parts of it. In particular,
    support for HTML5''s ability to play video directly in the browser, without the
    need for a plug-in such as Flash, is becoming more popular. Unfortunately, browsers
    currently support a few different implementations of video, so you must encode
    your video in at least two different formats for it to work. Once the video is
    encoded, you can simply use the `<video>` tag and its child `<source>` tag in
    your page.


