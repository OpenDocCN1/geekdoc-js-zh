  md: "# Link to Pages on the Web\n\nYou can link to other sites on the Web by using\
    \ the exact HTML code used in linking to pages your site: an anchor tag with an\
    \ href attribute. However, these links require you to use an absolute path. Depending\
    \ on the operating system on which the site is hosted, the path may or not be\
    \ case-sensitive, so you may need to pay attention to capitals. A simple way of\
    \ ensuring that your link work is to use your Web browser to navigate to the page,\
    \ copy the address, and paste it into your code.\n\n# Link to Pages on the Web\n\
    \n+   1 Open the page onto which you want to add the link.\n\n```\n```html\n<!--\
