    # TIPS


    Why is it necessary to delete additional cells from the row?


    You need to be sure that your HTML tables always follow a grid. If a table had
    a row spans three columns, then that row should contain only one additional cell,
    because the other cell represents all three remaining cells.


    How do I use rowspan?


    The rowspan attribute works in essentially the same way as colspan. However, because
    you are having a cell that stretches vertically across multiple rows, you need
    to delete one cell from each affected row to maintain the overall grid.


