  md: '+   Open a new, blank file in your editor.


    +   Click Edit.


    +   Click Paste.


    +   Save the document, using a .css extension.


    +   Return to the original page.


    +   Delete the opening and closing style sheets.


    The style sheet is removed from the HTML document and saved as an external document.


    # Where should I save the CSS file?


    External style sheets can be saved anywhere within your Web''s root folder. Some
    designers like to create a special folder that contains all of their style sheets,
    whereas others simply place them in the root.


    # Can I put some of my styles in an external sheet and leave others as embedded
    styles?


    Yes. In general, those styles that apply to all or most of your pages are placed
    in the external sheet, whereas styles that apply only to a single document might
    be kept in an embedded style sheet. Use "The Cascade" later in this chapter, for
    example of combining external and embedded styles.'
