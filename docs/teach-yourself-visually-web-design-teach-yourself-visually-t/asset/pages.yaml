  md: '# # Add an Unordered List


    You will likely find many reasons to have lists on your pages. You may need to
    list the ingredients in a recipe or the materials required for a project or tutorial.
    The most common list, however, might be your navigation; after all, navigation
    could be said to simply be a list of links to the pages in your site. Perhaps
    the most common type of list on Web sites is an *unordered*, or bulleted, list.
    The list is defined via the `<ul>` tag, and each item is denoted by a list item,
    `<li>`.


    # Add an Unordered List


    +   1. Open a new HTML document in your editor that contains the basic HTML structure
    tags.


    Note: You can complete the following steps on an existing page if you want.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html1/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>List</title>

    </head>

    <body>


    </body>

    </html>

    ```


    +   2. In the body of the document, type `<ul>`.


    +   3. Press `Enter`.


    +   4. Type `<li>`.


    +   5. Type an item for the list.


    +   6. Type `</li>`.


    +   7. Press `Enter`.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/html1/xhtml1-transitional.dtd">

    <html>

    <head>

    <title>List</title>

    </head>

    <body>

    <ul>

    <li>Jump, Van Halen</li>

    </ul>

    </body>

    </html>

    ```


    Note: The code shown has been indented using `Tab`. This is not required, but
    highly recommended.


    172'
