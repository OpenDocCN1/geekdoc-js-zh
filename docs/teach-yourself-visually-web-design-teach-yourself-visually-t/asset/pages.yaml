  md: '# CHAPTER 3


    The image opens in Photoshop.


    +   Click Window.


    +   Click Adjustments to open the Adjustments panel.


    +   Click the Color Balance button (⌘).


    ![](img/786eec77afb1e5789b8be7c26fd20881_74_0.png)


    The Color adjustment sliders appear.


    +   Drag the color sliders to achieve the desired color balance.


    +   The image''s colors are corrected.


    ![](img/786eec77afb1e5789b8be7c26fd20881_74_1.png)


    # TIPS


    What are the other adjustments?

    Almost all images from your digital camera will require color adjustment. The
    other adjustment types allow you to change the color balance through various other
    techniques. You can also apply a few effects in the panel, such as converting
    the image to black and white.


    Why did adjusting the color add a new layer?

    Photoshop relies on nondestructive editing to apply changes. By adding the color
    balance as a new layer, Photoshop applies the effect without changing the original
    image, so if you want to remove the change, you can at any point simply delete
    the color balance layer.


