  md: "# Control Whitespace with Margins\n\nThe outermost element of the box model,\
    \ represents the space between elements on the page. CSS contains five properties\
    \ for setting margins: margin-top, margin-bottom, margin-left let you set each\
    \ side individually, whereas the margin property is a shortcut for setting all\
    \ four margins together. This shortcut can take a single value to set all four\
    \ margins, where the first applies to the top and bottom and the second to the\
    \ left and right, or four values, where the first sets the top, the second right,\
    \ the third bottom, and the fourth the left.\n\n# Control Whitespace with Margins\n\
    \n+   In your editor, open a document that contains an embedded style sheet and\
