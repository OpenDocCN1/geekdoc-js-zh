  md: '# Introduction to Dreamweaver’s Interface


    As a part of Adobe''s Creative Suite, Dreamweaver''s interface is similar to Photoshop,
    Illustrator, and Fireworks. The Dreamweaver interface is made up of three basic
    elements: the menu bar, the panels, and the main workspace. The panels allow you
    to add elements to the page, control your site''s file structure, and modify items
    you have inserted. When you launch Dreamweaver, the main workspace displays the
    Welcome screen. Once you open a document, most of the panels become activated
    to allow you to use them.


    ![](img/786eec77afb1e5789b8be7c26fd20881_193_0.png)


    # Menu Bar


    The menus provide access to Dreamweaver''s commands.


    # Workspace Menu


    You can switch between a variety of workspaces, or panel layouts, using the options
    presented here.


    # Panels


    The primary functionality of the program can be accessed from these panels. Double-click
    the title of a panel to open or collapse it.


    # Properties Panel


    This panel displays the properties of the currently selected objects, and changes
    depending on the type of object selected.


    # Tag Chooser


    Quickly select HTML elements in your document by clicking them.


    # Toolbar


    Switch between Dreamweaver’s views or add a title to your document using these
    tools.


    # Browser Navigation Bar


    While using Dreamweaver’s Live view, you can navigate to pages or sites as you
    would in a normal browser.


    # Document Tabs


    Switch between open documents using these tabs.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Define a Site in Dreamweaver


    You will primarily use Dreamweaver to create and edit Web sites — collections
    of related pages. Although you can work with individual pages, you will find that
    many advanced features become available only when you define a site. Earlier,
    in your site planning, you will have created a single root folder to hold all
    of your site''s files. It is simplest, defining a site in Dreamweaver allows you
    to tell the program where these files are. Later, you can configure additional
    settings to upload files to your Web host.


    # Define a Site in Dreamweaver


    +   1 Click Site.

    2 Click New Site.


    The Site Setup dialog box appears.


    +   3 Type a name for your site.

    4 Either type the path or browse to the folder on your hard drive that contains
    your site''s files.

    5 Click Save.


    The site is created.


    ![](img/786eec77afb1e5789b8be7c26fd20881_194_0.png)'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Create a New Document


    As with other programs, you can create a new document by selecting New from the
    File menu. If you have no documents open, you can also create a new document from
    the Welcome screen. Dreamweaver contains a set of starter pages that you can use
    to jumpstart your designs. The starter pages use CSS for layout, freeing you from
    having to implement the CSS code yourself. You can also select the DOCTYPE you
    want to use for your document, and link it to an external style sheet.


    # Create a New Document


    +   1 Click File.

    2 Click New.

    3 Select Blank Page.

    4 Select HTML.

    5 Select a layout.

    6 Click Create.


    The New Document dialog box appears.


    ![](img/786eec77afb1e5789b8be7c26fd20881_195_0.png)


    182'
