  md: '# Determine a Color Scheme Using Kuler


    Adobe Kuler is a free online resource that allows designers to access and use
    color schemes created by others in the community. As an online service, it is
    available anytime you are connected to the Internet. You can use Kuler to select
    from one of thousands of color schemes. Once you have found a set of colors that
    you like, you can get the specific values of those colors so that you can use
    them in your site''s design. You can also individual colors within each set if
    you want.


    # Determine a Color Scheme Using Kuler


