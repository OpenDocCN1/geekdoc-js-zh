  md: '# Create Your Own PHP Function


    You can encapsulate PHP code that you need to reuse into functions. The syntax
    for creating PHP functions is nearly identical to that for creating functions
    in JavaScript. You begin by using the function keyword, followed by the name of
    the function and a pair of parentheses. The code for the function is enclosed
    in curly braces. You can pass arguments to the function by creating variables
    within the parentheses, and send a value out of the function using the return
    keyword. Functions are called in PHP by simply referencing their name.


