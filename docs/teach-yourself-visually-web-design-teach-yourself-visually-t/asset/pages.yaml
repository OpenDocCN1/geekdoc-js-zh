  md: '# Create Your First Web Page


    You can begin building simple Web pages in your editor of choice. Web pages use
    sets of HTML tags to define their content. Although the content of each page will
    vary greatly, all pages contain the same base set of starting tags. These tags
    begin by telling the browser that the document does in fact contain HTML tags,
    then divide the page into two sections: a head, with information for the browser,
    and a body, which contains everything the user actually sees on the page. The
    head section also contains the title, which appears on the browser’s title and
    tab bars.


    # Create Your First Web Page


    +   1 Open your editor to a new blank page.


    Note: The examples in this chapter use Windows Notepad, but you can use any editor
    to complete these sections. See Chapter 1 for more information on editors.

    2 Type <html>.

    3 Press Enter.

    4 Type <head>.


    ![](img/786eec77afb1e5789b8be7c26fd20881_33_0.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# CHAPTER Getting Started with HTML


    +   5 Press Enter.


    +   6 Type <title>My First Page</title>.


    ```

    <html>

    <head>

    <title>My First Page</title>

    </head>

    ```


    +   7 Press Enter.


    +   8 Type </head>.


    +   9 Press Enter.


    +   10 Type <body>.


    +   11 Press Enter.


    +   12 Type </body>.


    ```

    <html>

    <head>

    <title>My First Page</title>

    </head>

    <body>

    </body>

    </html>

    ```


    +   13 Press Enter.


    +   14 Type </html>.


    The document now contains the basic tags needed for a Web page.


    | Do capitalization and spacing matter? XML requires that all tags and attributes
    be written in lowercase letters. Whitespace, does not matter; the examples above
    and throughout the book separate code into distinct lines to make it more readable,
    but a page where all of the code is written on a single line is also valid. |
    Do I need all of these tags in every document? Browsers will display your page
    if you do not have these basic tags, but they may not do so correctly, so you
    should always include them. Most dedicated HTML editors add them automatically
    when you create a new document. |'
