  md: '# Preview the Page in a Browser


    ive view is helpful for testing pages, but you should remember that it only mirrors
    the display of the page in Safari and Chrome. Although most of the time, if your
    page looks correct in Live, you should still view your page in other browsers,
    such as Microsoft''s Internet Explorer and Mozilla Firefox, because you may still
    find issues with the display that needs to be fixed. Remember, however, that pixel-perfect
    rendering consistency across browsers is virtually impossible, so you only need
    to be sure that the page looks good in all browsers, not that it precisely pleases
    the same.


    # Preview the Page in a Browser


    +   - From the toolbar, click the Preview/Debug in Browser button ({}).


    +   - Select the browser you want to use your page.


    The page appears in the selected browser.


