  md: '# # Link a Style Sheet to a Page


    Once you move styles to an external sheet, you must link the HTML page to the
    CSS document in order to reapply the styles. You can use the <link> tag to accomplish
    this. The link element takes three attributes: rel, type, and href. The rel attribute
    specifies the relationship between this page and the style sheet, and most often
    is set to a value of stylesheet. The type attribute informs the browser as what
    type of file to expect when it requests the style sheet from the server, and is
    always text/css. Finally, the href attribute sets the path to the style sheet
    document.


