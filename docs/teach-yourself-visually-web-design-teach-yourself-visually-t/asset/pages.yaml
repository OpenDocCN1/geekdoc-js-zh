  md: '# # Getting Started HTML


    +   4 Scroll to the point to which you want the link to go when clicked.


    +   5 In the existing at point, type id="?", replacing with the same identifier
    you used in Step 2.


    Note: The id is case-sensitive, so sure it matches exactly.


    Note: If no tag exists at the point to which you want to link, you can use <span
    id="?">, replacing with the identifier from Step 2 by adding a <<span>> tag.


    When viewed in a browser, the link is blue and underlined. Click it to scroll
    to the other point in the document.


    ![](img/786eec77afb1e5789b8be7c26fd20881_54_0.png)


    # What is the ID attribute?


    The ID attribute can be used to identify a particular element. In addition to
    becoming the target of links, IDs can be used in CSS and JavaScript. You can add
    an id attribute to any tag in your HTML document.


    # Are there restrictions on what I can use for an ID?


    The value of the ID attribute cannot contain spaces, but most important is that
    it must be unique on a page. You cannot have two elements with the same ID on
    the page; if you do, you will get unpredictable results in various browsers. The
    value is case-sensitive, so be sure to stay consistent in how you use it.'
