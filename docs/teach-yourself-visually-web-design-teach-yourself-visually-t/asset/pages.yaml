  md: '# Save an Image for the Web in Fireworks


    Fireworks'' native file format is PNG. However, the Fireworks version of the format
    contains additional data to store information about features of the program such
    as layers. Fireworks also contains a set of tools for optimizing images for the
    Web so that you end up with files smaller than those saved from other graphics
    programs while still maintaining the visual quality. Optimization is done directly
    in the program with a panel devoted to the task, and saving the image to JPEG,
    GIF, or PNG by exporting it.


    Save an Image for the Web in Fireworks


    +   1. Click Window.


    +   2. Click Optimize.

    - The Optimize panel opens.


    ![](img/786eec77afb1e5789b8be7c26fd20881_93_0.png)


    +   3. Select the file format you want to save the image as.


    ![](img/786eec77afb1e5789b8be7c26fd20881_93_1.png)'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# CHAPTER 3 Creating Images


    +   4 Click File.


    +   5 Click Export.


    ![](img/786eec77afb1e5789b8be7c26fd20881_94_0.png)


    The Export dialog box appears.


    +   6 Navigate to your Web site''s images folder.


    +   7 Type a name for the image.


    +   8 Ensure that the Export setting is Images Only.


    +   9 Click Save.


    The image is exported in the correct format.


    ![](img/786eec77afb1e5789b8be7c26fd20881_94_1.png)


    TIPS

    How can I compare different optimization settings?


    You can click the 2-Up and 4-Up buttons to view several versions of your image
    at once. Then, you can click each version and choose different optimization settings
    so that you can compare the results and select the one that looks best resulting
    in the smallest file.


    What are the other export options in the Export dialog box?


    Fireworks can export images in a wide variety of formats. Most of the time, you
    will likely select Images Only, but you can export more complex designs as HTML
    and Images, or to other programs such as Dreamweaver or Lotus Domino Designer.'
