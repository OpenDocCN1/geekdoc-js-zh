  md: '# Add a Header Row


    Most tables require a row or column of headers to define the that row or column
    represents. Often, the data in the table is meaningless without headers. In HTML,
    you can represent this header information by using the `<th>` tag for those cells
    instead of `<td>`. You are therefore defining individual cells as headers, not
    entire rows or columns. Text within these header cells is formatted in bold and
    centered in the cell.


    # Add a Header Row


    +   1 In your editor, open a document that contains an existing table.


    ![](img/786eec77afb1e5789b8be7c26fd20881_181_0.png)


    +   2 Change the opening tag of a cell within the first row of the table from
    `<td>` to `<th>`.


    +   3 Change the closing tag from `</td>` to `</th>`.


    ![](img/786eec77afb1e5789b8be7c26fd20881_181_1.png)'
  merge: -1
