  md: "# Apply Spacing with Padding\n\nThe space around elements on your page is defined\
    \ by something known as the box model. The innermost section of the model is the\
    \ element's content. It is surrounded on all sides by padding, which in turn is\
    \ surrounded by a border. Outside the border is a margin. The padding property\
    \ allows you to control the space between the content and the border; in essence,\
    \ it allows you to move the element within the box. You can easily remember this\
    \ by thinking of a physical package: you add padding between the fragile contents\
    \ and the edge of the package.\n\n# Apply Spacing with Padding\n\n+   1. In your\
    \ editor, open a document that contains an embedded style sheet.\n\n```\n<!DOCTYPE\
    \ html PUBLIC \"//W3C//HTML 4.0 Transitional//EN\"\n   \"http://www.w3.org/TR/html4/DTD/html4-transitional.dtd\"\
    >\n<html>\n<head>\n<title>Example</title>\n<style type=\"text/css\">\nbody {\n\
    \  font-family: Arial, Helvetica, sans-serif;\n  font-size: 90%;\n  color: #ffc555;\n\
    \  background-image:url('images/flowers.gif');\n  background-repeat: no-repeat;\n\
    \  background-position:550px 0;\n}\nh1 {\n  text-transform: uppercase;\n}\n</style>\n\
    ```\n\n+   2. Within an existing h1 declaration, type padding-left: ?, replacing\
    \ with the amount of padding you want to apply.\n\n```\nbody {\n  font-family:\
    \ Arial, Helvetica, sans-serif;\n  font-size: 90%;\n  color: #ffc555;\n  background-image:url('images/flowers.gif');\n\
    \  background-repeat: no-repeat;\n  background-position:550px 0;\n}\nh1 {\n  text-transform:\
    \ uppercase;\n  padding-left: 20px;\n}\n```\n\n+   3. Press Enter.\n\n```\np {\n\
    \  line-height: 1.5em;\n  text-indent: .75em;\n  text-align: justify;\n}\n</style>\n\
    </head>\n<body>\n<h1 id=\"top\">Some Interesting Information</h1>\n```"
