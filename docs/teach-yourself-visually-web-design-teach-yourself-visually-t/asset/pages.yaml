  md: '# Create a Database


    The MAMP and WAMP installations include phpMyAdmin, a Web-based tool for administering
    your MySQL database. Although its overall design is not ideal, phpMyAdmin is an
    easy tool for those getting started using databases. MySQL is not a database,
    but instead a database server; It is software that manages set of databases. Therefore,
    your first step in using it will be to create a database. You can do this by simply
    typing the name that you want to use for your database in the phpMyAdmin pages.


    # Create a Database


    +   In Windows, click the WAMP task tray icon (icon).

    Click phpMyAdmin.

    On a Mac, you can access it by launching the MAMP application, then clicking Open
    Start Page, then clicking the phpMyAdmin link.


    ![](img/786eec77afb1e5789b8be7c26fd20881_309_0.png)


    The phpMyAdmin main page opens.


    +   Click Databases.


