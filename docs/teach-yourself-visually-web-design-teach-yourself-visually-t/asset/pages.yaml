  md: '# Introduction to HTML


    hypertext Markup Language (HTML) is the fundamental language for Web pages and
    an essential starting point for anyone wanting to learn Web design. Frankly, HTML
    is not a programming language. You do not need to learn complicated logic processes
    or worry about mathematical computations. Instead, HTML is best seen as a set
    of relatively simple instructions to the Web browser, telling the browser how
    to interpret the text. HTML is completely free, so you never have to worry about
    paying to use it.


    # Tags


    HTML documents are made of text surrounded by tags. A tag is an instruction to
    the software that displays the page — usually a Web browser — on how the text
    contained within the tag should be interpreted and displayed. A tag is made up
    of angle brackets and an element name, and sometimes includes attributes.


    ![](img/786eec77afb1e5789b8be7c26fd20881_31_0.png)


    # Elements


    Elements are the basic pieces that make up HTML. The language contains roughly
    100 elements, when placed in a tag and inserted into your page, they tell the
    browser how to render the text. Examples of elements include html, body, p, and
    table.


    ![](img/786eec77afb1e5789b8be7c26fd20881_31_1.png)


    # Attributes


    Often, the element alone does not provide enough information to tell the browser
    exactly how to handle text. In these cases, you also need to add attributes, which
    provide the additional details on how that element should display. Attributes
    go inside tags, after the element.


    ![](img/786eec77afb1e5789b8be7c26fd20881_31_2.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Getting Started with HTML 2


    # Container Tags


    Most HTML tags are container tags that wrap blocks of text in your document to
    tell the browser both when to begin applying formatting and when to end. Container
    tags are used in sets, with an opening and a closing tag. The closing tag contains
    the angle brackets and the element, and also includes a backslash.


    ```

    <begin formatting>

    block of text

    </end formatting>

    ```


    # Empty Tags


    A few HTML tags are essentially instructions to the browser. For example, <img>
    tag tells the browser where to insert an image. Empty tags do not have or require
    closing tags, but are instead placed in the document alone.


    ```

    <img>

    ```


    # Whitespace and Capitalization


    HTML is both whitespace and case-insensitive. You should include whitespace in
    your code to make it more readable, but it does not impact the display of the
    page. Element names and attributes can be written in any case, also without affecting
    the page display.


    ```

    <html>

    <head>

    <TITLE>My Web Site</title>

    white space

    </head>

    </html>

    ```


    # HTML versus XHTML


    XHTML is merely a version of HTML that requires a stricter syntax. In XHTML, all
    element and attribute names must be lowercase, and attribute values must be enclosed
    in quotation marks. XHTML has no empty tags — all tags, including instructional
    tags such as <img>, must always be closed.


    ```

    <img>

    XHTML

    <frame noresize="noresize">

    ```'
  merge: -1
