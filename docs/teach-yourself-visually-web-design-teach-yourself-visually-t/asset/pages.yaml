  md: '# Upload Your Files Using Dreamweaver


    Once you have defined your remote hosting information in Dreamweaver, you can
    use the expanded panel to upload your files. When you connect to your host''s
    server, you will see your local files on the right half of the screen and the
    remote files — the files on the left. You can simply drag files from your local
    drive to the server to upload them, or from the server to your local drive to
    download. You can also perform normal file system operations such as creating
    folders, renaming files, and moving files.


    # Upload Your Files Using Dreamweaver


