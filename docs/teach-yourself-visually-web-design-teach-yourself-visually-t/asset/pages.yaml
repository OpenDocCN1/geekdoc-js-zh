    # TIPS


    Should I worry about extra room on my canvas?


    The final size of your image will be the size of the canvas, so for something
    like a button, you want to ensure that the canvas matches the size of the artwork.
    You can click Modify, Canvas, and Trim Canvas to have Fireworks remove the extra
    space.


    How big should I make my button?


    The exact size of your button depends on the design of your site. Most buttons
    are around 150 pixels wide by around 50 pixels tall, but you should not feel bound
    by these numbers.


