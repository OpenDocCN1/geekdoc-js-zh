  md: '# Creating a Page Visually in Dreamweaver


    The Save Style Sheet File As dialog box appears.


    +   - Type a name for your style sheet.


    +   - Click Save.


    The new document is created.


    ![](img/786eec77afb1e5789b8be7c26fd20881_196_0.png)


    ![](img/786eec77afb1e5789b8be7c26fd20881_196_1.png)


    > What are the differences between the starter page layouts?

    The starter page layouts provided include one-, two-, or three-column pages. Fixed
    layouts use pixel dimensions for the layout, meaning that the page does not expand
    or collapse as your users resize their browser window. The liquid layouts, on
    the other hand, use percentages for the widths, so the layouts change to fit the
    screen size. Some of the layouts also contain areas for headers and footers.'
