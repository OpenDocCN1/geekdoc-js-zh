    # How complex can my contextual selectors be?


    You can create contextual selectors as complex as you need. For example, if you
    wanted to apply a style to an image that was inside a paragraph, which in turn
    was a div with an ID of content, you could write #content p img and successfully
    target the image.


    # Do I need to use any special selectors for the contextual selector?


    No. A contextual selector is a list of selectors separated by spaces. A comma-separated
    list of selectors applies the style to each of the elements as shown earlier in
    this chapter.


