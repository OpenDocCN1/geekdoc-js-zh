  md: "# Float Elements\n\nPerhaps the easiest method of creating multicolumn layouts\
    \ involves using the CSS float property. When you apply a float to an element,\
    \ you are saying that the content that follows the element in question can float\
    \ next to it. In doing so, you can create columns in your content. The three values\
    \ of float are left, right, and none. Applying float:left allows the element to\
    \ float to the left of elements that follow it, and float:right allows the element\
    \ to float to the right. Setting float to none, removes the float.\n\n# Float\
    \ Elements\n\n+   1 In your editor, open a style sheet document that is linked\
    \ to an HTML document.\n\n```\n/* Stylesheet */\ntext-indent: 0;\npadding-top:\
    \ 20px;\n\n#maincontent p:first-line {\n  font-weight: bold;\n}\n\na:link {\n\
    \  font-weight: bold;\n  color: #540907;\n}\n\na:visited {\n  font-weight: bold;\n\
    \  color: #8A3B20;\n}\n\na:hover {\n  text-decoration: none;\n  color: #372F22;\n\
    }\n\na:active {\n  text-decoration: none;\n  color: #372F22;\n}\n\na:focus {\n\
    \  text-decoration: none;\n  color: #372F22;\n}\n\n#sidebar {\n}\n```\n\nNote:\
    \ The following steps can also be done using an embedded style sheet.\n\n+   2\
    \ In the style sheet, type # followed by the ID of the element you want to float.\n\
    \n+   3 Press Enter.\n\n+   4 Type (.\n\n![](img/786eec77afb1e5789b8be7c26fd20881_167_0.png)"
