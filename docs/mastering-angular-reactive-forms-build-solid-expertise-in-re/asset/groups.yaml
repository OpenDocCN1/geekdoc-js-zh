    \ **formControl** 指令应用复选框的绑定，**termsAndConditions** **formControl** 的值将是：\n- 如果用户勾选复选框，则为\
    \ **true**\n- 如果用户取消勾选复选框，则为 **false**\n\n#### 使用 formControlName 指令\n\n我们可以实现与使用\
    \ **formControl** 指令相同的功能，但这次我们将把 **FormControl** 嵌套在 **FormGroup** 中，如下代码所示，并使用了\
    \ **FormBuilder** 语法糖：\n\n**component.ts 代码**\n```typescript\nimport {Component,\
    \ OnInit} from '@angular/core'\nimport {FormBuilder, FormGroup} from '@angular/forms'\n\
    \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
    \  styleUrls: ['./app.component.scss'],\n})\nexport class AppComponent implements\
    \ OnInit {\n  myForm!: FormGroup\n\n  constructor(private fb: FormBuilder) {}\n\
    \n  ngOnInit() {\n    this.myForm = this.fb.group({\n      termsAndConditions:\
    \ this.fb.control(null),\n    })\n  }\n}\n```\n\n在第 16 行中，**FormControl** 提供的值是\
    \ null。在接下来的代码中，我们通过 **formControlName** 指令在 **FormGroup** 中使用复选框元素来绑定 **FormControl**：\n\
    \n**component.html 代码**\n```html\n<div [formGroup]=\"myForm\">\n  <input type=\"\
    checkbox\"\n         id=\"termsAndConditions\"\n         formControlName=\"termsAndConditions\"\
    >\n\n  <label for=\"termsAndConditions\">我接受条款和条件</label>\n</div>\n```\n\n在第 4\
    \ 行中，我们使用 **formControlName** 指令应用复选框的绑定，**termsAndConditions** 的值将是：\n- 如果用户勾选复选框，则为\
    \ **true**\n- 如果用户取消勾选复选框，则为 **false**\n\n### 设置默认值\n\n复选框的默认值表示在初次渲染时预先选中哪个选项，如图所示：\n\
    \n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_69_0.png)\n\n***图 2.7：*** *带有默认值的复选框示例*\n\
    \n为了实现这一点，默认值应该与我们在 HTML 的 `value` 属性中声明的值相似。\n\n例如，如果单选按钮中的值为 1 和 2（正如我们在之前的代码第\
    \ 9 行和第 18 行中所做的那样），我们应该提供其中一个作为默认值。\n\n在初始化 **FormControl** 时设置数据，我们必须在第一个参数中填充一个值，如下例所示：\n\
    \n1. **frontEndDev: this.fb.control('1')** — 在 FormControl 中提供值 \"1\" 将勾选标签为“是”的第一个单选按钮。\n\
    2. **frontEndDev: this.fb.control('2')** — 在 FormControl 中提供值 \"2\" 将选中标签为“否”的第二个单选按钮。\n\
    \n虽然复选框接受布尔值，但本质上 Angular 使用隐式类型转换将值转换为布尔值。每个真值都会勾选复选框，每个假值都会让复选框未被选中。\n\n我们在\
    \ **FormControl** 初始化或 `setValue`/`patchValue` 方法中使用真值和假值：\n\n1. **termsAndConditions\
    \ = new FormControl(true)** — 在 FormControl 中提供值 true 将选中复选框。\n2. **termsAndConditions:\
    \ this.fb.control(null)** — 在 FormControl 中提供值 null 将使复选框未被选中。\n\n在下面的表格中，我们看到真值和假值的示例：\n\
    \n| 各种值的 FormControl | 是否选中 |\n| :--- | :--- |\n| termsAndConditions = new FormControl()\
    \ | 否 |\n| termsAndConditions = new FormControl(true) | 是 |\n| termsAndConditions\
    \ = new FormControl(\"true\") | 是 |\n| termsAndConditions = new FormControl(\"\
    false\") | 是 |\n| termsAndConditions = new FormControl(false) | 否 |\n| termsAndConditions\
    \ = new FormControl([]) | 是 |\n| termsAndConditions = new FormControl({}) | 是\
    \ |\n| termsAndConditions = new FormControl(null) | 否 |\n| termsAndConditions\
    \ = new FormControl(undefined) | 否 |\n\n***表 2.1***\n\n请注意，将 **FormControl** 替换为\
    \ **FormBuilder** 语法糖具有相同的结果。\n\n### 下拉列表（select element）数据绑定\n\n虽然构建下拉菜单看起来很简单，但由于其数据源可能是字符串数组或对象数组，它比较特殊。当我们选择一个单选按钮时，会在相应的\
    \ **formControl** 中设置单选按钮的值。同样，当我们勾选或取消勾选复选框时，会在相应的 **formControl** 中设置布尔值。\n\n\
    在后续章节中，我们将看到如何使用单个 **FormControl** 为下拉菜单绑定三个选项，如图 2.8 所示。请注意 **formControlName**\
    \ 指令的用法与之前的 HTML 元素类似。\n\n#### 带有预定义选项的用例\n\n通过“预定义”，是指直接在 HTML 中硬编码 **Select**\
    \ 选项。\n\n"
