    15: )

    16:

    17: constructor(private fb: FormBuilder) {}

    18: }

    ```


    In lines 11-15, we initialize the username **FormControl**, and we


    provide the following arguments:


    1. The initial state of the control, which is an empty string.

    2. A custom validator, line 13.

    3. An async validator, line 14.


    The async validators can potentially be expensive because they


    perform HTTP calls. For this reason, their execution happens after


    the synchronous validators and only if the latter is successful.


    An alternative way to declare the **FormControl** along with the


    validators is by using the strict properties


    **validators** and


    **asyncValidators** as seen in the following code:


    ## Declare the FormControl with strict validator properties


