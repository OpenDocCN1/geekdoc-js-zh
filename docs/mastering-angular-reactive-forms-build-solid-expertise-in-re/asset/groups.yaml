    \ as we intend to test the validity of the form.\n\nIn the *Assert* block, we\
    \ expect the form to be valid.\n\n**Tip:** A positive test ensures that the code\
    \ behaves as expected with correct data. It's also highly encouraged to write\
    \ negative tests that ensure the code handles incorrect data.\n\n## Using Test\
    \ Doubles\n\nThere are various test approaches, like unit tests, integration tests,\
    \ and e2e tests. When unit testing, we focus on individual (method, property,\
    \ and so on.). If this part of the code depends on an HTTP call, we use a Test\
    \ Double replaces the production implementation with testing-related one.\n\n\
    To better understand this flow, we will see the service's code. Let's start with\
    \ the service:\n\n### app.service.ts\n\n```typescript\n1: import {HttpClient}\
    \ from '@angular/http'\n2: import {Injectable} from '@angular/core'\n3: \n4: @Injectable({providedIn:\
    \ 'root'})\n5: export class AppService {\n6:   constructor(private http: HttpClient)\
    \ {}\n7: \n8:   save(formData: any) {\n9:     return this.http.post('ENDPOINT',\
    \ formData)\n10:  }\n11:\n```\n\nIn lines 8-10, we see that an HTTP call fires\
    \ when the save method is invoked.\n\nLet's now see a part of the component code.\
    \ Please note that we are focusing only on the part of the code required for the\
    \ test. We won't see how to create a form model since this has already been explained\
    \ in previous chapters.\n\n### component.ts submit method code\n\n```typescript\n\
    1: submit() {\n2:   if (this.myForm.invalid) {\n3:     return\n4:   }\n5: \n6:\
    \   this.appService.save(this.myForm.value).subscribe()\n7:}\n```\n\nThis method\
    \ will call the service's save method if the form is valid. Let's continue with\
    \ the testing part of this code. Since the component we want to test has a dependency\
    \ on an angular service and also performs HTTP requests, we have to adapt the\
    \ TestBed configuration accordingly, as follows:\n\n### Unit test code\n\n```typescript\n\
    1: import {HttpClientTestingModule} from '@angular/common/http/testing'\n2: import\
    \ {TestBed, waitForAsync} from '@angular/core/testing'\n3: import {ReactiveFormsModule}\
    \ from '@angular/forms'\n4: import {AppComponent} from './app.component'\n5: import\
    \ {AppService} from './app.service'\n6: \n7: describe('AppComponent', () => {\n\
    8:   let appService: AppService\n9: \n10:  beforeEach(\n11:    waitForAsync(()\
    \ => {\n12:      TestBed.configureTestingModule({\n13:        imports: [\n14:\
    \          ReactiveFormsModule,\n```\n"
