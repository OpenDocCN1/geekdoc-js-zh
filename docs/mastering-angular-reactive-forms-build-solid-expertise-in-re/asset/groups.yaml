    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_85_0.png)


    ***Figure 3.2:*** *AbstractControl properties*


    In the following code, we see how to access the validity properties


    and display error messages for particular controls:


    **component.html code**


    1: <input type="text"

    2: placeholder="First Name"

    3: [formControl]="firstName" />

    4:

    5: <small *ngIf="firstName.invalid">Field is required</small>

    6:

    7: <input type="text"

    8: placeholder="Last Name"

    9: [formControl]="lastName" />


    In line 5, we set a condition to display an error message to the user if


    "**First Name**" is invalid. Since we have registered to the **firstName**


    control only the required validator, it is safe to use the invalid property to
    display a message mentioning that the field is required.


    This property will change its value solely from the required validator.


    In case, though, we have more than one validator, like in the field


    "**Last Name**," we cannot be sure whether the **.valid** or **.invalid**


    properties have been changed from the **required** or the **minLength**


    validator since both of them affect the control''s validity. In this case,


    we must use the **.errors** property, an object generated from the


    unsatisfied validators.


    Since the **lastName** control has the validators **required** and


    **minLength**, the **.errors** property will have the following generated objects:


    | Validator | Generated errors object |

    | :--- | :--- |

    | required | `{"required": true}` |

    | minLength | `{"minlength": {"requiredLength": 3, "actualLength": 1}}` |


    ***Table 3.3*** (Table content above)


    The **.errors** property is handy because we can set different


    validation messages per case.


    The following code displays different messages if the **required** or the


    **minLength** validator is not satisfied:


    **component.html code**


    1: <input type="text"

    2: placeholder="First Name"

    3: [formControl]="firstName" />

    4:

    5: <small *ngIf="firstName.invalid">Field is required</small>

    6:

    7: <input type="text"

    8: placeholder="Last Name"

    9: [formControl]="lastName" />

    10:

    11: <small *ngIf="lastName.errors?.minlength">The length of this field is {{lastName.errors?.minlength.requiredLength}}</small>

    12: <small *ngIf="lastName.errors?.required">Field is required</small>


    In lines 12–14, we display the message "*The length of this field is 3*" if the
    **minLength** validator is not satisfied.


    In lines 15–17, we display a message if the **required** validator is not satisfied.


    **Note:** It''s encouraged to use the safe navigation operator, also known as
    Elvis operator (?), in the component''s template when using the **errors** property.
    If we omit this, we will get an error similar to "*Cannot read property ''required''
    of null."


    **FormGroup**


    The **FormGroup**, similarly to **FormControl**, extends the **AbstractControl**
    class and has all the properties we saw in *Table 3.1*. The user, though, cannot
    directly trigger **FormGroup**. Any change on the nested **FormControl** instances
    bubbles up and alters **FormGroup**, as we see in the following figure:


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_88_0.png)


    ***Figure 3.3:*** *FormControl state bubbles up*


    Let''s see how it works. The following table shows a tree structure with a root
    node (**myForm**) and children nodes (**firstName** and **lastName**).


    | AbstractControl instance | type |

    | :--- | :--- |

    | myForm | FormGroup |

    | firstName | FormControl |

    | lastName | FormControl |


    ***Table 3.4*** (Table content above)


    We assume that all the defined **FormControl** instances are required. For this
    example, we will focus on the **.valid** property. Firstly, all the controls have
    the default state, and as such, the .valid properties are false, as follows:


    | AbstractControl instance | .valid property |

    | :--- | :--- |

    | myForm | False |

    | firstName | False |

    | lastName | False |


    ***Table 3.5*** (Table content above)


    Then, the user satisfies the required validator of **firstName**, which leads
    to the following:


    1. The .valid property of **firstName FormControl** will turn to true.

    2. The .valid property of **lastName FormControl** will remain false.

    3. The .valid property of **myForm FormGroup** will also remain false.


    The FormGroup(s) validity turns true only when all the nested FormControl(s) are
    true.


    | AbstractControl instance | .valid property |

    | :--- | :--- |

    | myForm | False |

    | firstName | True |

    | lastName | False |


    ***Table 3.6*** (Table content above)


    Finally, the user satisfies the **lastName** validator, and the validity of the
    FormGroup(s) turns true because all the nested FormControl(s) are true.


    | AbstractControl instance | .valid property |

    | :--- | :--- |

    | myForm | True |

    | firstName | True |

    | lastName | True |


    ***Table 3.7*** (Table content above)


    In the following code, we see how the FormControl(s) status bubbles up and updates
    the **FormGroup**:


    **component.ts code**


    1: import {Component, OnInit} from ''@angular/core''

    2: import {FormBuilder, FormGroup, Validators} from ''@angular/forms''

    3:

    4: @Component({

    5: selector: ''app-root'',

    6: templateUrl: ''./app.component.html'',

    7: styleUrls: [''./app.component.scss''],

    8: })

    9: export class AppComponent implements OnInit {

    10: myForm!: FormGroup

    11:

    12: constructor(private fb: FormBuilder) {}

    13:

    14: ngOnInit(): void {

    15: this.myForm = this.fb.group({

    16: firstName: ['''', Validators.required],

    17: lastName: ['''', [Validators.required, Validators.minLength(3)]],

    18: })

    19: }

    20: }


    In the preceding code, we see that both **firstName** and **lastName** are required
    controls, and also, the **lastName** has a **minLength** validator.


    **component.html code**


    1: <form [formGroup]="myForm">

    2:

    3: <input type="text"

    4: placeholder="First Name"

    5: formControlName="firstName" />

    6:

    7: <input type="text"

    8: placeholder="Last Name"

    9: formControlName="lastName" />

    10:

    11: <small *ngIf="myForm.invalid">The form is invalid</small>

    12:

    13: </form>


    In line 11, we have a condition that displays a message to the user if the form
    is invalid. Please note that the **FormGroup** itself has no validation rules.
    The **.invalid** property is calculated from the state of the children **FormControl**.


    **Accessing a FormGroup''s controls**


    We learned how to display a message if an individual **FormControl** is invalid.
    In this section, we will learn how to query **FormControl** from the **FormGroup**.
    To accomplish this, we can do this in two ways, as follows:


    1. **formGroup.controls.formControl.property**: The first option is to use a dot
    notation. As we see in *figure 3.3*, we have to replace **FormGroup**, **formControl**,
    and property with respective values (**myForm.controls.firstName.invalid**).


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_92_0.png)


    ***Figure 3.4:*** *FormGroup and FormControl to pick a property*


    2. **formGroup.get(''formControl'')?.property**: The second option is to use the
    get method. As we see in *figure 3.4*, we have to replace **FormGroup**, **formControl**,
    and property with respective values (**myForm.get(''firstName'')?.invalid**).


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_92_1.png)


    ***Figure 3.5:*** *FormGroup and FormControl to use the get method*


    Please note that **formControl** should be a string value.


    In the following code, we see how to display a message if a nested **FormControl**
    instance is invalid:


    **component.html code**


    1: <form [formGroup]="myForm">

    2:

    3: <input type="text"

    4: placeholder="First Name"

    5: formControlName="firstName" />

    6:

    7: <small *ngIf="myForm.controls.firstName.invalid">Required field</small>

    8:

    9: <input type="text"

    10: placeholder="Last Name"

    11: formControlName="lastName" />

    12:

    13: <small *ngIf="myForm.controls.lastName.invalid">Required field</small>

    14:

    15: </form>

