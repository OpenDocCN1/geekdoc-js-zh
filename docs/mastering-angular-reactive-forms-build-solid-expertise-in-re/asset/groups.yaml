    **Objective**


    After reading this chapter, you will learn how to establish


    communication with the end-user and maintain data integrity on the'
  - '[PAGE 80]


    server by applying built-in validators in the **FormControl** instances.


    **Why use validators?**


    If we have to fill in a paper form with data, we might wonder whether


    we need to fill all the fields or not. If it''s possible, we will ask for help.


    If not, we will submit the paper form to the corresponding physical


    office, and we will wait for confirmation. Maybe they will ask us to fill


    some fields that we deliberately left empty, or they might ask us not


    to write more than a specific amount of letters in certain fields.


    Of course, this shouldn''t be the case in the digital era, as we can


    immediately respond to the end-users.


    With validations, we can:


    Establish communication with the end-user


    Ensure data integrity on the server


    These two are interconnected. We communicate with the users to


    inform them about the form''s "*rules*". Since the users conform to the


    rules, we will have correct data in the server, hence data integrity.


    **The validity in the controls**


    In *Chapter 1: Getting started with Reactive Forms*, we mentioned


    that the **AbstractControl** type calculates the **value** and **validity**. To


    be more specific:


    The **FormControl** handles the **value** and **validity** of a form


    element.


    The **FormGroup** handles the **value** and **validity** of a set of


    **AbstractControl** instances.


    The **FormArray** handles the **value** and **validity** of an array of


    **AbstractControl** instances.


    The validity depicts if **AbstractControl** is valid or not, and this


    Boolean value is available via the property **.valid**.


    In *figure 3.1*, we see some form fields. The "*Name*" field is required,


    and the validity of the bound **FormControl** is false (**.valid=false**). If'
  - '[PAGE 81]


    we type any character on the field, the validity will switch from


    **valid=false** to **valid=true**. By default, the validity is re-calculated on


    every keystroke.


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_81_0.png)


    ***Figure 3.1:*** *Form with validation error messages*


    The **AbstractControl** instances have properties that are handy


    during the validation. The following table describes in categories


    these properties:


    **Property**


    **Type**


    **Description**


    **VALIDITY**


    valid


