    Often the enterprise applications have peculiar use cases that we


    cannot capture with the built-in validators. As with the built-in


    validators, we can create our code library with various custom


    validators, either for **FormControl**, **FormGroup**, or **FormArray** controls.


    In the next chapter, we will learn how to interact dynamically with the


    user inputs and conditionally add or remove built-in or custom


    validators.


    **Key terms**


    **ValidationErrors**: A key-value pair type that both the


    synchronous and async validators use to validate invalid


    validity.


    **ValidatorFn**: It is an interface that the synchronous custom


    validators implement.


    **AsyncValidatorFn**: It is an interface that the async custom


    validators implement.


    **Questions**


    **Q 1\. Can I combine both synchronous and async validations?**


    **A.** The Angular provide explicit API to do so. In **FormControl,** you


    can use the second argument for the synchronous and the third


    argument for the async validators.


    **Q 2\. How can I improve the async validators'' performance and**


    **make them less expensive to the back-end server?**


    **A.** It''s encouraged to use **{updateOn: ''blur''}** every time an async


    validator is in place.


    **Q 3\. Does the validity of the async validators propagate to the**


    **FormGroup or FormArray?**


    **A.** The invalid **FormControl** state will bubble up to the **FormGroup** or


    **FormArray**, and we can check as such the validity of the parent


    **AbstractControl**.


