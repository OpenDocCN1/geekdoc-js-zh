    ## CHAPTER 1: Getting Started with Reactive Forms


    ### Introduction

    Angular forms are a communication channel between a user and a system. We collect
    data through forms, and in most cases, we provide this data in a server using
    an API. Data is a valuable asset that should be accurate, and thus, working with
    Reactive Forms is advantageous as we have all needed tools to reassure data integrity.


    In this chapter, we will learn what Reactive Forms are and why we should master
    them. We will also learn all the Reactive Form Building Blocks: **FormControl**,
    **FormGroup**, and **FormArray**. To fully follow this book, you should be reasonably
    familiar with the following:

    - Have the required skills to create Angular Components and Angular Modules

    - Basic knowledge of HTML5

    - Basic understanding of CSS3


    **Note:** This book''s code examples are available in the following GitHub repo
    separated into different branches: https://github.com/profanis/bpb-mastering-angular-reactive-forms


    ### Structure

    - What are Reactive Forms?

