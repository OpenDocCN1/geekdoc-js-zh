    ***Figure 5.1:*** *A Subject with three Observers*


    Let''s continue with the example of the website and the browsers and

    explain how important it is to block the push notifications if we no

    longer need them.


    If the website has plenty of info to share and the client who uses the

    browser doesn''t want to continue receiving this info, he must **block**

    the notifications.


    In the observer design pattern, instead of the **block** term, we

    literally use the term **unsubscribe**.


    If we do not **unsubscribe** from the **Subject**, we will continue

    receiving the messages and consuming more computer resources

    than we need. This is the so-called memory leak, which will make

    the application performing slower progressively!


    ## Handling the input changes in real-time


    As we already know, **FormControl**, **FormGroup**, and **FormArray** extend

    the **AbstractControl** class. Among the various properties we have

    covered in the previous chapters, it also has the **valueChanges**.

    This observable property receives an event every time the value of the

    control changes.


    **Tip:** We can combine various rxjs operators in the valueChanges

    method to complement our requirements.


    The following code depicts the definition of **valueChanges**:


    **AbstractControl class**


    1: export declare abstract class AbstractControl {

    2: readonly valueChanges: Observable<any>;

    3:}


    Some of the use cases we can achieve with the **valueChanges**

    property are:


    - In the **AbstractControl** instances, we can set validators

    dynamically (we will cover this later in this chapter)

    - Implement an auto-complete feature


    ### Using valueChanges in FormControl


    We can monitor the changes of a **FormControl** instance by

    subscribing to the relevant **valueChanges** property, as seen in the

    following code:


    **component.ts code**


    1: import {Component, OnDestroy, OnInit} from ''@angular/core''

    2: import {FormBuilder} from ''@angular/forms''

    3: import {Subscription} from ''rxjs''

    4:

    5: @Component({

    6: selector: ''app-root'',

    7: template: `<input

    8: type="text"

    9: placeholder="First Name"

    10: [formControl]="firstName"

    11: />`,

    12:})

    13: export class AppComponent implements OnInit, OnDestroy {

    14: firstName = this.fb.control('''')

    15: private firstNameSubscription!: Subscription

    16:

    17: constructor(private fb: FormBuilder) {}

    18:

    19: ngOnInit() {

    20: this.firstNameSubscription =

    21: this.firstName.valueChanges.subscribe(

    22: (value) => console.log(value)

    23: )

    24: }

    25:

    26: ngOnDestroy() {

    27: this.firstNameSubscription?.unsubscribe()

    28: }

    29:}


    In lines 21-23, we subscribe to **valueChanges**, and we register an

    observer responsible for getting the value (line 22). The Observer''s

    responsibility is to **console.log()** the received value.


    In *Chapter 3: Built-in validators*, we learned that the value of the form

    controls is re-calculated on every keystroke. If, for example, we type

    "john" in the input field, we will get in the console of the development

    tools the result of the next figure.


