    6: selector: ''app-root'',

    7: templateUrl: ''./app.component.html'',

    8: styleUrls: [''./app.component.scss''],

    9:})

    10: export class AppComponent {

    11: username = this.fb.control(

    12: '''',

    13: [exactCharacters(5)],

