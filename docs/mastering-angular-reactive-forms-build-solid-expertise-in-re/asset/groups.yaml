    \ Angular 实现了双向数据绑定。\n\n## 使用响应式表单绑定 (Binding using Reactive Forms)\n\n幸运的是，在响应式表单（Reactive\
    \ Forms）中，我们不需要手动处理从源到模板及反向通信。**formControl** 和 **formControlName** 指令解决了绑定问题。\n\
    \n在上一章节，我们学习了如何绑定输入元素。在接下来的示例中，我们将看到如何使用响应式表单实现这一功能。\n\n**component.ts 代码**\n\
