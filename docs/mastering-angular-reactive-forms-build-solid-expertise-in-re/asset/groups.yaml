    ## Conclusion


    For an Angular qualitative application, the developers should know how to write
    and maintain unit tests to ensure that all the individual parts of the code work
    as expected and won''t break any new feature development.


    In this chapter, we learned how to use Reactive Forms to help the code. In the
    next chapter, we will learn more about it.


    ## Key terms


    - **AAA**: A pattern we use when writing tests. Arrange, Act, Assert.

    - **spyOn**: Replaces the original returned value of a method with a value.

    - **Jasmine**: It is a testing framework.

    - **Karma**: It is a test runner.


    ## Questions


    **Q1: How can I increase the quality?**

    **A.** Increasing the quality is a factor of the tests you write.


    **Q2: Do I have to set up some tools to application?**

    **A.** You only have to set up the Jasmine and Karma tools.


    **Q3: Which pattern to follow?**

    **A.** The AAA pattern is handy and straightforward.


