  - '[PAGE 147]


    In the digital era we live in, applications tend to grow at a fast pace.


    The demands and market competition are high. Sometimes it is


    tough to deliver applications without critical bugs, but we must have


    the tools to minimize them.


    Testing the application before delivering is a part of **Software**


    **Development Life Cycle** (**SDLC**). Some companies have **Quality**


    **Assurance** (**QA**) departments that solely manual test the


    applications and give the green light for deployment.


    Developing a new feature on an existing application might cause


    some other features to malfunction. Since this is very common, we


    should re-test the application (regression testing) on every new


    feature development. Doing this manually is a very tedious, time-


    consuming, and error-prone process.


    While the application grows, the business requirements might


    change, and we need to follow them by adapting the code and doing


    the required refactorings. An application without tests is easy to


    break after a code refactor.


    Automating the regression testing process with unit tests saves time


    and money, increases the quality, and decreases the bugs.


    **The toolset**


    The unit testing in the web apps is very mature, and plenty of tools


    exist to help us do our job. The defaults in Angular are Karma and


    Jasmine''s combination, which we will also use in this chapter.


    **Understanding the Jasmine framework**


    **Jasmine** is a JavaScript testing framework that suggests


    **Behavioral Driven Development** (**BDD**) and provides us with an


    assertion and mocking library.


    With Jasmine, we can write the unit tests and run them manually in a


    browser. Any change in the unit tests or the application requires


    manually refreshing the browser to re-run the unit tests. Since this


    can become tiresome very soon, we use Karma!'
- md: "\n**Note:** BDD is a way of writing tests in a more human-readable way so that\
    \ non-technical people can read and understand.\n\n## Understanding the Karma\
    \ runner\n\nThe **Karma** test runner tool complements the development experience\
    \ by running the Jasmine tests on a selected browser. It also has a file watcher\
    \ on the unit test files (**.spec.ts**), which is very handy, because it auto\
    \ re-runs the unit tests on file changes.\n\n## How to conduct unit testing\n\n\
    When unit testing, we check if a part of a code meets the business requirements.\
    \ To be aligned and strict with the terminology, we can even say that we *expect*\
    \ a part of the code to meet the business requirements.\n\nSome tests refer to\
    \ the same context, and it makes sense to group them logically. It's also crucial\
    \ that each test has at least one expectation like we see in the example of the\
    \ simple test as follows:\n\n### Example code\n\n```typescript\n1: describe('Test\
    \ example', () => {\n2:   it('should be true', () => {\n3:     expect(true).toBeTrue()\n\
    4:   })\n5: })\n```\n\nTo group the unit tests, we use the keyword **describe**\
    \ (line 1). We wrap the individual tests in the global **it()** function (line\
    \ 2). Since each test should have at least one expectation, we added one in line\
    \ 3, where we expect \"*true to be true*.\" We write the expectations using the\
    \ expect keyword, and we combine them with matchers¹. In this example, we use\
    \ the matcher toBeTrue.\n\n## Learning the AAA pattern\n\nWe are very keen on\
    \ learning new software patterns as they point us in the correct direction. In\
    \ unit testing, the **Arrange, Act, and Assert** (**AAA**) pattern tends to become\
    \ the de-facto.\n\n### Arrange\n\nIn the Arrange step, we initialize the component\
    \ or variables, and we stub/mock services. The general rule is to do any preparations\
    \ for the testable code.\n\n### Act\n\nIn the Act step, we call a method or trigger\
    \ an event that we intend to test.\n\n### Assert\n\nIn the Assert step, we make\
    \ sure that the given result of the \"*Act*\" is what we expect.\n\nEach step\
    \ is a logical separation of the code and helps us keep a clean and consistent\
    \ code. In the following code, we see a simple example using the AAA pattern:\n\
    \n### Example code\n\n```typescript\n1: it('should return true', () => {\n2: \
    \  // Arrange\n3:   const fixture = TestBed.createComponent(AppComponent)\n4:\
    \   const app = fixture.componentInstance\n5:   const expectedValue = true\n6:\
    \   let returnedValue: boolean\n7: \n8:   // Act\n9:   returnedValue = app.getTrue()\n\
    10: \n11:  // Assert\n12:  expect(returnedValue).toBe(expectedValue)\n13: })\n\
    ```\n\nIn the *Arrange* block, we create the component using the TestBed, we keep\
    \ in a variable the component instance, and we also define the expected and returned\
    \ value.\n\nIn the *Act* block, we call a method that, for this example, we know\
    \ that returns true. In the *Assert* block, we expect the returned value to be\
    \ similar to the expected value.\n\n## Unit Testing a FormGroup\n\nUnit testing\
    \ the Reactive Forms is easy because we do not necessarily have to check the HTML\
    \ inputs to make sure a form is valid or not. Since we define the validators in\
    \ the source code (**component.ts**), we can perform all the test cases using\
    \ the source code exclusively.\n\nTo explain how to test a FormGroup, we will\
    \ use a straightforward example of one FormGroup with two FormControl instances,\
    \ as we see below:\n\n### component.ts code\n\n```typescript\n1: import {Component,\
    \ OnInit} from '@angular/core'\n2: import {FormBuilder, FormGroup, Validators}\
    \ from '@angular/forms'\n3: \n4: @Component({\n5:   selector: 'app-root',\n6:\
    \   templateUrl: './app.component.html',\n7:   styleUrls: ['./app.component.scss'],\n\
    8: })\n9: export class AppComponent implements OnInit {\n10:  myForm!: FormGroup\n\
    11: \n12:  constructor(private fb: FormBuilder) {}\n13: \n14:  ngOnInit() {\n\
    15:    this.myForm = this.fb.group({\n16:      firstName: ['', Validators.required],\n\
    17:      lastName: ['', Validators.required],\n18:    })\n19:  }\n20: }\n```\n\
    \nThe first step when writing unit tests is to prepare the TestBed with all the\
    \ required dependencies, as follows:\n\n### component.spec.ts code\n\n```typescript\n\
    1: import {TestBed, waitForAsync} from '@angular/core/testing'\n2: import {ReactiveFormsModule}\
    \ from '@angular/forms'\n3: import {AppComponent} from './app.component'\n4: \n\
    5: describe('AppComponent', () => {\n6:   beforeEach(\n7:     waitForAsync(()\
    \ => {\n8:       TestBed.configureTestingModule({\n9:         imports: [ReactiveFormsModule],\n\
    10:        declarations: [AppComponent],\n11:      }).compileComponents()\n12:\
    \     })\n13:   )\n14:  )\n```\n\nSince we have to test a Reactive Forms component,\
    \ we import ReactiveFormsModule in TestBed (line 9). Please note that this is\
    \ an elementary test with no further dependencies. In an enterprise test, however,\
    \ we might need to define more dependencies.\n\nHaving the TestBed ready means\
    \ that we can start writing the actual tests. Let's begin with a positive test\
    \ examining how to make sure the form is valid.\n\n### component.spec.ts (the\
    \ form is valid)\n\n```typescript\n1: it('should have a valid form', () => {\n\
    2:   // Arrange\n3:   const fixture = TestBed.createComponent(AppComponent)\n\
    4:   const app = fixture.componentInstance\n5:   fixture.detectChanges()\n6: \n\
    7:   // Act\n8:   app.myForm.patchValue({\n9:     firstName: 'Fanis',\n10:   \
    \ lastName: 'Prodromou',\n11:  })\n12: \n13:  // Assert\n14:  expect(app.myForm.valid).toBeTrue()\n\
    15: })\n```\n\nIn the *Arrange* block, we create the component using the TestBed,\
    \ and we call the component's **ngOnInit** method, which initializes the form.\n\
    \nIn the *Act* block, we use the **patchValue** method to fill the form with values.\
