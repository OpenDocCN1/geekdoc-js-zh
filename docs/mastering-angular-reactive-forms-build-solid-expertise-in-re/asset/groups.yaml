    Let''s continue with the example of the website and the browsers and


    explain how important it is to block the push notifications if we no


    longer need them.


    If the website has plenty of info to share and the client who uses the


    browser doesn''t want to continue receiving this info, he must **block**


    the notifications.


    In the observer design pattern, instead of the **block** term, we


    legitimate use the term **unsubscribe**.


    If we do not **unsubscribe** from the **Subject**, we will continue


    receiving the messages and consuming more computer resources


    than we need. This is the so-called memory leak, which will make


    the application performing slower progressively!


    **Handling the input changes in real-time**


    As we already know, **FormControl**, **FormGroup**, and **FormArray** extend


    the **AbstractControl** class. Among the various properties we have


    covered in the previous chapters, it also has the **valueChanges**. This


    observable property receives an event every time the value of the


    control changes.


    **Tip:** We can combine various rxjs operators in the valueChanges


    method to complement our requirements.'
