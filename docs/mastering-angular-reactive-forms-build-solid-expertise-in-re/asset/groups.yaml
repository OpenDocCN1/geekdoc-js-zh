    ## FormArray custom validators


    Finally, we will see how to apply a validator on a FormArray and handle its validity
    on the template. The logic of the validator is sort of similar to FormGroup and
    FormControl.


    ### Writing the FormArray validator


    We will write a validator that ensures no duplicate values exist in a FormArray.
    If a user writes more than once the same value in an array form, the system will
    communicate back with an error message like the following figure:


    ![](img/cd4d52de6d80bd3f6a0ee9db19_0.png) Figure 4.4: Error message of an invalid
    FormArray


    Before we start examining the code of this example, we should mention that the
    given FormArray will consist of FormGroup items and will look like this:


    - {"name": "Red"}

    - {"name": "Green"}


    So, without further ado, let''s see how to create a function validator for FormArray:


    **validator code in custom-validators.ts**


    1: import {AbstractControl, FormArray, ValidatorFn} from ''@angular/forms''

    2:

    3: export function noDuplicates(property: string): ValidatorFn

    {

    4: return (control: AbstractControl) => {

    5: const formArray = control as FormArray

    6: const hasDuplicates = formArray.value

    7: .map((it: any) => it[property])

    8: .reduce(

    9: (acc: boolean, cur: any, idx: number, arr: any[]) => {

    10: const hasDups = arr.slice(idx + 1)

    11: .some((it: any) => it === cur) || acc

    12: acc = hasDups || acc

    13:

    14: return acc

    15: }, false)

    16:

    17: return hasDuplicates ? {hasDuplicates: true} : null

    18: }


    The example code is a bit complex, but we will go through this by step. We want
    to make sure no duplicates exist in FormArray, and to make this happen, we will
    iterate the array items and we will get the value of property "name" of colors
    array.


    In line 3, we create a function that accepts one argument: the FormControl name
    of the corresponding FormGroup of the FormArray items. In our example, the argument
    will be "name".


    In line 4, we create the inner function, which accepts AbstractControl argument,
    and has the actual validation logic. In lines 5-16, we apply the validation logic.
    To ensure no duplicates exist, we develop the logic using the map and reduce JavaScript
    functions.


    In line 18, we return null if the validator is satisfied or an object.


    ### Using the FormArray validator


    When we initialize a FormArray, we define the AbstractControl instances as we
    have learned. We can also provide the validators using the second argument of
    the array method, as we see in the following code:


