    ## Handling the input statuses in real-time


    In the third chapter, we learned about the **AbstractControl** properties

    and how to check the control''s validity using the **valid** property.


    Similar to the **valid** one, there is also the **status**, which has two

    potential values:


    | Value | Explanation |

    | :--- | :--- |

    | VALID | If all validators are satisfied. |

    | INVALID | At least one validator is not satisfied. |


    Since the **.valid** and **.status** properties have the same purpose,

    we can use them interchangeably.


    The value and the validity of a form control are re-calculated,

    default, on every keystroke. Wouldn''t it be great to have the option to

    register an observer and monitor the status changes?


    Luckily, the **statusChanges** observable method emits an event with

    VALID or INVALID values every time the control change status.


    **AbstractControl class**


