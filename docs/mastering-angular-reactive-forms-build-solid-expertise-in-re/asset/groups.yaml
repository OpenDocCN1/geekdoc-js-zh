    # Mastering Angular Reactive Forms


    Build Solid Expertise in Reactive Forms using Form Control, Form Group, Form Array,
    Validators, Testing and more with Angular 12 Through Real-World Use Cases


    FANIS PRODROMOU


    **Mastering Angular Reactive Forms**


    *Build Solid Expertise in Reactive Forms*

    *Using Form Control, Form Group, Form*

    *Array, Validators, Testing and more with*

    *Angular 12 Through Real-World Use*

    *Cases*


    **Fanis Prodromou**


    www.bpbonline.com


    **FIRST EDITION 2022**


    **Copyright © BPB Publications, India**


    **ISBN: 978-93-91030-247**


    All Rights Reserved. No part of this publication may be reproduced, distributed
    or transmitted in any form or by any means or stored in a database or retrieval
    system, without the prior written permission of the publisher with the exception
    to the program listings which may be entered, stored and executed in a computer
    system, but they can not be reproduced by the means of publication, photocopy,
    recording, or by any electronic and mechanical means.


    **LIMITS OF LIABILITY AND DISCLAIMER OF WARRANTY**


    The information contained in this book is true to correct and the best of author’s
    and publisher’s knowledge. The author has made every effort to ensure the accuracy
    of these publications, but publisher cannot be held responsible for any loss or
    damage arising from any information in this book. All trademarks referred to in
    the book are acknowledged as properties of their respective owners but BPB Publications
    cannot guarantee the accuracy of this information.


    www.bpbonline.com


    **Dedicated to**


    *My patient wife Tania, who transforms my imperfections into perfections and my
    baby girl Nelly!*

    *Thanks for everything.*


    ## About the Author


    **Fanis Prodromou** is a Senior Software Engineer with a passion for front end
    development with Angular. He lives in Athens, Greece, and has worked for many
    big companies. During his 14 years of coding, he has gained vast experience in
    code quality, application architecture and application performance.


    Being aware of how rapidly computer science and tech aspects have evolved, he
    tries to stay up to date by attending conferences and meetups, studying and trying
    new technologies. He loves to share his knowledge and help other developers.


    *"Sharing is Caring"*


    He teaches Angular in enterprise companies via the Code.Hub Institute, writes
    articles, creates YouTube videos and gives talks at Angular meetups. He enjoys
    spending time with his two cats and goes for hiking and scuba diving in his free
    time.


    ## About the Reviewer


    With over seven years of experience working on different frontend technologies
    like Angular, React and EmberJS, **Pankaj Parkar** is currently working for Deskera
    as a Senior Software Engineer. His skills in Angular and Web Application Development
    and more have led him become a Microsoft MVP and Google Developer Expert.


    Pankaj loves to share his knowledge with the community; thus, you will find him
    speaking at various technical events and conferences. Pankaj is also the top contributor
    on Stack Overflow in India and ranks among the top 20 contributors in the world
    on Angular and AngularJS. He is also a technical reviewer for BPB Publications.
    He now focuses on channeling his knowledge into open-source projects and sharing
    with the community through mentoring, creating POCS, running workshops and writing
    blogs to help make the world a better and more developed place.


    ## Acknowledgement


    I met my wife 15 years ago, and ever since, we are living together. Without any
    doubt she is my other half. She supports my ambitions and makes me a better person.
    Without my wife, I wouldn''t have been able to write this book.


    Thanks to my friends and co-organizers at Angular Athens Meetup and Angular Nation,
    where I have met great people and exchanged a lot of ideas.


    My gratitude also goes to the book reviewer Pankaj Parkar. His participation and
    valuable advice has made this book much better. Special thanks to BPB Publications
    especially Nrip Jain, for their support, advice and assistance in creating and
    publishing this book.


    ## Preface


    The Angular Framework has two ways for building HTML forms, the template driven
    forms and reactive forms. The latter, since they are based on a model, are also
    called model-driven forms.


    Comparing these two, we can say that there is a shift of responsibility from the
    HTML template to the source code. For example, while the unit tests and validations
    are applied in the HTML in template driven forms, they are applied in the source
    code (typescript) in reactive forms. In reactive forms, the source code plays
    a significant role and offers great flexibility.


    Angular forms are a communication channel between the user and system. We collect
    data through forms, and in most cases, provide these data in a server using an
    API. Data is a valuable asset that should be accurate. Thus, working with angular
    reactive forms is advantageous as we have all the needed tools to reassure data
    integrity.


    The book follows the Angular 12 latest changes and is based on Typescript''s Strict
    flag.


    *The book consists of seven chapters in which the reader will learn the following:*


    - **Chapter 1:** In this chapter, we will learn what reactive forms are and why
    we should master them. We will also learn in-depth the details of all the building
    blocks of reactive forms.

    - **Chapter 2:** Binding with HTML elements is easy, but things might be complex
    enough in certain cases. In this chapter, we will learn how to apply a binding
    with all the HTML elements.

    - **Chapter 3:** The validations are a core feature as they act as a communication
    channel between the system and the user. In this chapter, we will learn the built-in
    validators.

    - **Chapter 4:** Often, the built-in validators in complex forms are not enough
    for the business scenarios. In this chapter, we will learn how to create custom
    validators.

    - **Chapter 5:** In this chapter, we will learn how to interact with user data
    and create dynamic validators.

    - **Chapter 6:** Unit tests are vital for the quality and robustness of an application.
    The reactive forms offer a great way to write your unit tests.

    - **Chapter 7:** How should we handle a big angular form? How can we split it
    into various components? Furthermore, how can we re-use a particular component
    form more than once? In this chapter, we will learn how to achieve all of these
    and dive deeper into angular reactive forms.


    ## Downloading the code


    **bundle and coloured images:**


    Please follow the link to download the ***Code Bundle*** and the ***Coloured Images***
    of the book:


    **https://rebrand.ly/eccf8c**


    **Errata**


