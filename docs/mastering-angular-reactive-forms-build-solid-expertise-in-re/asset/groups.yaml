- md: "\nLet's break down the key-value pair and analyze each part separately.\n\n\
    ## The ValidationErrors - key\n\nIn the HTML template, we can conditionally display\
    \ error messages to the user by checking the error type. We do this by utilizing\
    \ the **error** property of the **AbstractControl** instance. If, however, we\
    \ want to display a specific message for a particular validator, for example,\
    \ the **minLength**, we write a condition as we see in the following code:\n\n\
    ```html\n<small *ngIf=\"yourControlName.errors?.minlength\">\n  Message to the\
    \ user\n</small>\n```\n\nSimilarly, if we want to display an error message for\
    \ a custom validator, we use the \"*key*\" name. In the skeleton code above, in\
    \ line 9, we return the key **validatorName**. So, if we want to display an error\
    \ message in case the validator is not satisfied, we do this as follows:\n\n```html\n\
    <small *ngIf=\"yourControlName.errors?.validatorName\">\n  Message to the user\n\
    </small>\n```\n\n## The ValidationErrors - value\n\nThe \"*value*\" holds useful\
    \ information we might want to display to the user. For example, the **Validators.minLength(3)**\
    \ returns an object with the following object properties:\n\n- **RequiredLength**:\
    \ It is a number representing the length this validator requires to be satisfied.\n\
    - **ActualLength**: It is a number representing the current length the FormControl\
    \ has.\n\nWe can use this information to display a more meaningful error message\
    \ to the user. If we want to display the message \"*The current length is '1'\
    \ but required at minimum '3'* \", we can use something similar to this:\n\n```html\n\
    <small *ngIf=\"firstName.errors?.minlength\">\n  The current length is '{{firstName.errors?.minlength.actualLength}}'\
    \ but required at minimum '{{firstName.errors?.minlength.requiredLength}}'\n</small>\n\
    ```\n\nSimilarly, we can provide relative information in the custom validator.\n\
    \n## FormControl custom validators\n\nThe structure of the validator is advantageous,\
    \ but it's a bit abstract. Let's dive deeper and learn how to write and use a\
    \ custom validator for FormControl.\n\n## Writing the FormControl validator\n\n\
    In this section, we will create a FormControl validator that we will use to display\
    \ the end-user error messages like the *figure 4.2*:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_111_0.png)\n\
    \n***Figure 4.2:*** *Error message of an invalid FormControl*\n\nIn the following\
    \ code, we create a validator with the name **exactCharacters**, which checks\
    \ if the control's value length is equal to the provided length:\n\n**validator\
    \ code**\n\n```typescript\n1: import {ValidatorFn, ValidationErrors, AbstractControl}\
    \ from '@angular/forms';\n2:\n3: export function exactCharacters(length: number):\
    \ ValidatorFn {\n4: return (control: AbstractControl): ValidationErrors | null\
    \ => {\n5:   const controlLength = control.value?.toString()?.length\n6:\n7: \
    \  return controlLength === length\n8:   ? null\n9:   : {\n10:      exactCharacters:\
    \ {\n11:        requiredLength: length,\n12:        actualLength: controlLength,\n\
    13:      },\n14:  }\n15: }\n16:}\n```\n\nIn line 3, we provide the validator's\
    \ name, and we also provide an argument with the desired length.\n\nIn line 4,\
    \ we create an inner function that accepts the argument `control: FormControl`.\n\
    \nIn lines 7-14, we define the condition of this validator. If the **controlLength\
    \ === length** we return null, an object otherwise.\n\n## Using the FormControl\
    \ validator\n\nLet's see how to use the custom validator:\n\n**component.ts code**\n\
    \n```typescript\n1: import {Component} from '@angular/core'\n2: import {FormBuilder,\
    \ Validators} from '@angular/forms'\n3:\n4: @Component({\n5:   selector: 'app-root',\n\
    6:   templateUrl: './app.component.html',\n7:   styleUrls: ['./app.component.scss'],\n\
    8: })\n9: export class AppComponent {\n10:  firstName = this.fb.control('', Validators.minLength(3))\n\
    11:  lastName = this.fb.control('', exactCharacters(5))\n12:\n13:  constructor(private\
    \ fb: FormBuilder) {}\n14:}\n```\n\nIn line 11, we use the **exactCharacters**\
    \ validator, and we expect the **lastName** control to be five characters long.\n\
    \nNotice that we don't programmatically invoke the inner function, nor we provide\
    \ the argument to it. Both the argument and the invocation happen automatically\
    \ during runtime.\n\n## Informing the user of an invalid FormControl validator\n\
    \nIn the following code, we see how to display an error message to the user if\
    \ the **exactCharacters** validator is not satisfied:\n\n**component.html code**\n\
    \n```html\n1: <input type=\"text\"\n2:   placeholder=\"First Name\"\n3:   [formControl]=\"\
    firstName\" />\n4:\n5: <input type=\"text\"\n6:   placeholder=\"Last Name\"\n\
    7:   [formControl]=\"lastName\" />\n8:\n9: <small *ngIf=\"lastName.errors?.exactCharacters\"\
    >\n10:  The current length is '{{lastName.errors?.exactCharacters.actualLength}}'\
    \ but required '{{lastName.errors?.exactCharacters.requiredLength}}'\n11: </small>\n\
    ```\n\nIn lines 9-11, we display a message similar to \"*The current length is\
    \ '4' but required '5'*\", and we achieve this by using the object properties\
    \ that the validator returns.\n\n## FormGroup custom validators\n\nSo far, we\
    \ learned how to apply a validator on a **FormControl** and handle the validity\
    \ of this control on the template.\n\nIn this section, we will expand our knowledge\
    \ by learning how to create and apply a validator and how to handle the validity\
    \ of a **FormGroup** on the template.\n\n## Writing the FormGroup Validator\n\n\
    We will write a very useful validator that ensures that two HTML form elements\
    \ have the same value. Such validations are often used in a registration form,\
    \ where the user has to type and re-type a password. These forms are similar to\
    \ the following figure:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_114_0.png)\n\
    \n***Figure 4.3:*** *Error message of a password mismatch*\n\nTo develop what\
    \ the figure depicts, we will first start by examining the custom validator function,\
    \ as we see in the following code:\n\n**validator code**\n\n```typescript\n1:\
    \ export function fieldsMatch(\n2:   control1Name: string,\n3:   control2Name:\
    \ string\n4: ): ValidatorFn {\n5:   return (control: AbstractControl): ValidationErrors\
    \ | null => {\n6:     const group = control as FormGroup\n7:     const control1Value\
    \ = group.controls[control1Name].value\n8:     const control2Value = group.controls[control2Name].value\n\
    9:\n10:    if (!control1Value && !control2Value) {\n11:      return null\n12:\
    \    }\n13:\n14:    return control1Value === control2Value\n15:    ? null\n16:\
    \    : {\n17:      fieldsDoNotMatch: true,\n18:      control1Name: control1Value,\n\
    19:      control2Name: control2Value,\n20:    }\n21:  }\n22:}\n```\n\nThe validator\
    \ in the code above will check if two **FormControl** instances belonging to a\
    \ **FormGroup**, have the same value.\n\nIn line 1, we create a function with\
    \ two arguments. The first argument is the name of the first **FormControl**,\
    \ and the second argument is the name of the other **FormControl**. Remember that\
    \ we have to compare the value of two different **FormControl** instances.\n\n\
    In line 5, we create the inner function, which accepts in the runtime the argument\
    \ of type **AbstractControl** and has access to the closure arguments of the outer\
    \ function.\n\nThe exciting part is in lines 6-8. Since we know that the argument\
    \ will be a **FormGroup**, we do the following:\nWe cast the **AbstractControl**\
    \ to **FormGroup**.\nWe get by name the **FormControl** instances from the **FormGroup**.\n\
    We get their values.\n\nIn line 10, we apply the validation condition accordingly.\n\
    \nIn lines 14-20, we return null if the validator is satisfied, an object otherwise.\n\
    \n## Using the FormGroup validator\n\nWhen we initialize a **FormGroup**, we define\
    \ the **FormControl** instances as we have already learned. We can also provide\
    \ validators in the **FormGroup** by filling in the second argument of the group\
    \ method, as we see in the following code:\n\n**Form Builder's group definition**\n\
    \n```typescript\n1: group(controlsConfig: {\n2:   [key: string]: any;\n3:}, options?:\
    \ AbstractControlOptions | {\n4:   [key: string]: any;\n5: } | null): FormGroup;\n\
    ```\n\nThe type of options in line 3 is **AbstractControlOptions** and has the\
    \ following signature:\n\n**AbstractControlOptions definition**\n\n```typescript\n\
    1: export declare interface AbstractControlOptions {\n2:   validators?: ValidatorFn\
    \ | ValidatorFn[] | null;\n3:   asyncValidators?:AsyncValidatorFn |AsyncValidatorFn[]\
    \ | null;\n4:   updateOn?: 'change' | 'blur' | 'submit';\n5:}\n```\n\nLet's now\
    \ see how to apply the custom validator in a **FormGroup**:\n\n**component.ts\
    \ code**\n\n```typescript\n1: import {Component, OnInit} from '@angular/core'\n\
    2: import {FormBuilder, Validators} from '@angular/forms'\n3:\n4: @Component({\n\
    ```\n"
  mdcn: "\n\n让我们拆解键值对并分别分析每个部分。\n\n## ValidationErrors - key（键）\n\n在 HTML 模板中，我们可以通过检查错误类型向用户条件地显示错误消息。我们通过利用\
    \ **AbstractControl** 实例的 **error** 属性来实现。然而，如果我们想为特定的验证器显示特定的消息，例如 **minLength**，我们可以像下面的代码中那样写一个条件：\n\
