    \ did with the preceding\n**obj.foo.key1**. The path is **myForm.basicInfo.firstName**.\n\
    \n### Using FormArray in a FormGroup\n\nThe **FormArray** class is one of the\
    \ three fundamental building blocks\nof Reactive Forms, and we use it in conjunction\
    \ with **FormGroup**.\n\n**FormGroup**, apart from nesting **FormGroup** or **FormControl**\
    \ instances,\ncan also have **FormArray** instances.\n\nWhen we have items of\
