- md: '

    In the following example, we create a **FormControl** instance, which we use in
    the template to bind with the **Select** element:


    **component.ts code**


    1: import {Component} from ''@angular/core''

    2: import {FormControl} from ''@angular/forms''

    3:


    4: @Component({

    5: selector: ''app-root'',

    6: templateUrl: ''./app.component.html'',

    7: styleUrls: [''./app.component.scss''],

    8:})

    9: export class AppComponent {

    10: myColor = new FormControl()

    11: }


    Let''s see an example of how to have predefined **Select** options with a value
    attribute in the HTML:


    **component.html code**


    1: <label>Pick your color</label>

    2: <select [formControl]="myColor" >

    3: <option value="1">Red</option>

    4: <option value="2">Green</option>

    5: <option value="3">Blue</option>

    6: </select>


    We set three predefined options, and each one has a value attribute. In line 2,
    we use the **formControl** directive, which binds the **Select** menu with the
    **myColor formControl** instance.


    When a user chooses a **Select** option, the value of the selected option will
    be assigned to **myColor formControl**. If, for example, the user selects the
    color Green, the **myColor** will get the value 2.


    ### Set default values


    The default value of the **Select** menu denotes the option that appears in the
    browser, as we see in the following figure:


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_73_0.png)


    ***Figure 2.9:*** *Select menu example with default value*


    To set a default value, we should initialize the **formControl** instance with
    the respective **value** of the option we want to be selected.


    If, for example, we want the option Green to be selected, we have to provide the
    value 2, as we see below:


    **component.ts code**


    1. myColor = new FormControl(2)


    ### Use case with predefined options without values


    The following code is similar to the previous one, without the value attribute
    in the **Select** options.


    **component.html code**


    1: <label>Pick your color</label>

    2: <select [formControl]="myColor" >

    3: <option>Red</option>

    4: <option>Green</option>

    5: <option>Blue</option>

    6: </select>


    When a user chooses a **Select** option, the label of the selected option will
    be assigned to **myColor formControl**. If, for example, the user selects the
    color Green, the **formControl** will get the value "Green".


    ### Set default values


    To set a default value, we should initialize the **formControl** instance with
    the respective label of the option we want to be selected. If, for example, we
    want the option "*Green*" to be selected, we have to provide the value "*Green*,"
    as follows:


    **component.ts code**


    1. myColor = new FormControl(''Green'')


    ### Use case with string array Options


    Having predefined values in the HTML is not always the case. We might need to
    get data from an array and create the options using ***ngFor**. We will construct
    the Select menu with the three colors in the example below, but we will get the
    data from an array this time.


    The code in **component.ts** is similar to the previous examples, with the only
    difference that we have to set a string array, as we see in the following code:


    **component.ts code**


    1. colors = [''Red'', ''Green'', ''Blue'']


    In the following HTML code, we will iterate over the array to construct the options:


    **component.html code**


    1: <label>Pick your color</label>

    2: <select [formControl]="myColor">

    3: <option [ngValue]="null">Select</option>

    4: <option *ngFor="let color of colors" [ngValue]="color">

    5: {{color}}

    6: </option>

    7: </select>


    In line 3, we use the **ngValue** directive with a null value, which clears any
    previously assigned value when selected.


    In line 4, we iterate over the array using ***ngFor***, resulting in three options.
    We also set in the **ngValue** directive the variable color, which seems to be
    redundant with the **{{color}}** interpolation, but we need it there to help us
    assign a default value.


    ### Set default values


    Either iterating over an array or having predefined options, the mechanism to
    select an option is the same. If, for example, we want the option with the label
    "*Green*" to be selected, we provide the value "*Green*", as follows:


    **component.ts code**


    myColor = new FormControl(''Green'')


    ### Use case with object array Options


    Let''s now see how to iterate over an object array. The code in **component.ts**
    is similar to previous examples, with the only difference that we have to set
    an object array, as we see in the following code:


    **component.ts code**


    1: colors = [

    2: {key: 1, value: ''Red''},

    3: {key: 2, value: ''Green''},

    4: {key: 3, value: ''Blue''},

    5: ]


    In the following HTML code, we will iterate over the array to construct the options:


    **component.html code**


    1: <label>Pick your color</label>

    2: <select [formControl]="myColor">

    3: <option [ngValue]="null">Select</option>

    4: <option *ngFor="let color of colors"

    5: [ngValue]="color">

    6: {{color.value}}

    7: </option>

    8: </select>


    In line 5, we use the **ngValue** directive, which sets as a value the respective
    object. If, for example, a user selects the option with the value "Green", the
    **myColor formControl** instance will have the value {key: 2, value: ''Green''}


    ### Set default values


    Since we have object items, the mechanism to set the default values has some differences.
    We do not have to provide the object as a value, but the array''s object reference!


    If, for example, we want the option with the value "*Green*" to be selected, and
