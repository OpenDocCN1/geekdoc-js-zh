    We use the custom async validators to perform a condition according to the response
    of an API. A well-known use case is to check if, during registration, the username
    already exists.


    The async validator''s structure is the same as the synchronous (custom) validator.
    The difference is that we implement the AsyncValidatorFn instead of ValidatorFn,
