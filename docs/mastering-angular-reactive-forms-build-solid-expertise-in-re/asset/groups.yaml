    **The built-in validators**


    According to business rules, an HTML form might have specific


    restrictions on each form field. Some fields might be required, while


    others might have different rules. For example, a user might mistype


    an email or leave a required field empty. In the HTML form


    development, these restrictions are called validations.


    In the following table, we see a list of the built-in validators and their


    meaning:


    **Validator**


    **Is valid if,**


    **min(min: number)**


    The value >= provided number


    **max(max: number)**


    The value <= provided number


    **required()**


    The value is not empty


    **requiredTrue()**


    The value is True


    **email()**


    The value is a valid email pattern


    **minLength(minLength: number)**


    The value’s length >= provided minimum


    length


    **maxLength(maxLength: number)**


    The value’s length <= provided minimum


    length


    **pattern(pattern: string)**


    The value matches a regex pattern


