    **What are Reactive Forms?**


    We have two options to construct Angular forms in the Angular


    framework: Template Driven Forms and Reactive Forms.


    It''s quite popular to use the latter in complex forms because it


    increases the developer''s flexibility in terms of validations, unit


    testing, and splitting the code into smaller chunks.


    **Why use Reactive Forms?**


    Either developing a simple form or a very complex one, we need to


    be agile in changes, or better said, to have a maintainable and


    extensible form. Often the business requirements change, and we


    have to follow them, sometimes rapidly.


    Having a form that does not respect the **Separation of Concerns**


    (**SoC**)¹ principle makes even the simplest change looks hard.


