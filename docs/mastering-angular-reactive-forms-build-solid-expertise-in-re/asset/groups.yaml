- md: '

    ## templating


    form model


    unit tests


    validations


    By "**templating**," we mean the actual form the end-user sees in the browser.


    By "**form model**," we mean the model we create to apply a binding with the HTML
    template. Since this is an interesting topic, a separate section has been added
    at the end of this chapter.


    The "**unit tests**" should be a developer''s best friend. We are familiar with
    unit testing the business code in the Angular Services with Karma/Jasmine, Jest,
    or any other library. With Reactive Forms, we can test our forms without referring
    to the HTML but testing only the source code (**component.ts**).


    The "**validations**" can become complicated. An example would be:


    "*An input element should have a minimum of three letters and a maximum of ten
    letters; it should contain at least one special character, and this validation
    should exist if another field has a certain value.*" Oh boy! Well, if we have
    the right tools, this is just a simple challenge to accomplish. And yes, with
    Reactive Forms, the validations can be fun.


    ## Understanding the Building Blocks


    There are three Building Blocks of the Reactive Form, and each one is responsible
    for handling the value and the validity. It''s important to understand that we
    either set the value from the component.ts code or the value is set while the
    end-user types in the HTML form fields. It''s OK not to understand this fully,
    but we will soon learn what value and validity mean.


    - The **FormControl** is a class that we map with the individual HTML input element

    - The **FormGroup** is a group of individual **FormControl** instances

    - The **FormArray** is an array of **FormControl**, **FormGroup**, or **FormArray**
    instances.


    The following figure depicts an example of the preceding:


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_22_0.png)


    ***Figure 1.1:*** *Reactive Forms Building blocks*


    ## Working with FormControl


    **FormControl** is one of the three fundamental building blocks of Reactive Forms.
    The other two are **FormGroup** and **FormArray**, which we will see in the next
    pages. In an HTML form, **FormControl**(s) are the HTML elements, such as input
    elements, checkboxes, radio buttons, and select menus.


    Let''s depict this with the following image:


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_22_1.png)


    ***Figure 1.2:*** *A form with two FormControl items*


    In this figure, the "**First Name**" and "**Last Name**" inputs are considered
    FormControl(s), but we first have to convert them to actual **FormControl** instances.


    At first, and since Angular is modular, we have to import the corresponding module
    in our **Single Page Application** (**SPA**)².


    **Note:** If a framework like Angular weren''t modular and had everything loaded
    upfront by default, this would mean extra compilation and Tree Shaking time.


    The corresponding module is **ReactiveFormsModule**, and we have to import it
    in every feature module³ we meant to use Reactive Forms. By importing this module,
    Angular injects the required functionality necessary to develop the forms. This
    functionality consists of several directives and various classes.


    Let''s see an example of how to import **ReactiveFormsModule** in a module:


    **module.ts code**


    1: import {NgModule} from ''@angular/core'';

    2: import {ReactiveFormsModule} from ''@angular/forms'';

    3: import {BrowserModule} from ''@angular/platform-browser'';

    4: import {AppComponent} from ''./app.component'';

    5:

    6: @NgModule({

    7: declarations: [

    8: AppComponent

    9: ],

    10: imports: [

    11: BrowserModule,

    12: **ReactiveFormsModule**

    13: ],

    14: bootstrap: [AppComponent]

    15:})

    16: export class AppModule {}


    In line 2, we import with an ES6 declaration **ReactiveFormsModule** from **@angular/forms**.
    In line 12, we import that module in Angular''s imports array. Following the preceding
    *figure 1.2*, we will create two **FormControl** instances in our component, as
    seen in the following code:


    **component.ts code**


    1: import {Component, OnInit} from ''@angular/core'';

    2: import {FormControl} from ''@angular/forms'';

    3:

    4: @Component({

    5: selector: ''app-root'',

    6: templateUrl: ''./app.component.html'',

    7: styleUrls: [''./app.component.scss'']

    8:})

    9: export class AppComponent implements OnInit {

    10: firstNameControl!: FormControl

    11: lastNameControl!: FormControl

    12:

    13: ngOnInit(): void {

    14: **this.firstNameControl = new FormControl()**

    15: **this.lastNameControl = new FormControl()**

    16: }

    17:}


    In line 2, we import with an ES6 declaration **FormControl** from **@angular/forms**,
    and in lines 14 and 15, we instantiate the FormControl(s).


    Let''s now see how to use these controls in HTML:


    **component.html code**


    1: <input type="text"

    2: placeholder="First Name"

    3: [formControl]="firstNameControl">

    4:

    5: <input type="text"

    6: placeholder="Last Name"

    7: [formControl]="lastNameControl">


    In lines 3 and 7, we use [formControl], the glue between the source code (**component.ts**)
    and template (**component.html**). What do we mean by binding? Simply speaking,
    whatever the end-user types in the input fields, the value of the corresponding
    **FormControl** will be updated automatically. Let''s give it a try!

