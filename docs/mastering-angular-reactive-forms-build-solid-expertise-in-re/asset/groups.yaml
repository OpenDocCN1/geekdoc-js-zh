    To understand the Observer Pattern, let''s see an example of the


    widespread use of browsers.


    Some websites display a browser window on the top left corner


    when visiting them, asking us to block or allow push notifications.


    When a website has a piece of information to share, it will push a


    message to every web browser that has allowed the notifications.


    The Observer Pattern is a software design pattern composed of two


    parts. The **Subject** and the **Observers**. In the preceding example,


    the website is the Subject, and the browsers are the Observers.


    Some of the Subject''s characteristics are as follows:


    Maintains a list of Observers


    Informs the Observers when it has a new state


    An Observer''s characteristic is as follows:


    It is triggered when the subject changes


    To understand the characteristics, let''s align them with the preceding


    example:


    The website (Subject) maintains a list of browsers (Observers)


    that have allowed the push notifications


    When the website has information to share, it will push it to the


    browsers


    The browser will display a notification window when the website


    pushes a new message


    In the following figure, we will see an example of a **Subject** with


    three **Observers**. When the **Subject** has a new state, it will push it


    to the **Observers**.'
