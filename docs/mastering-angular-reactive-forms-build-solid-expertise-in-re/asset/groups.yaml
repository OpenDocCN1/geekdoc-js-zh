    \n### 设置默认值\n\n单选按钮上的默认值表示在初次渲染时预先选择哪个选项，如图所示：\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_66_0.png)\n\
    \n***图 2.5：*** *带有默认值的单选按钮示例*\n\n为了实现这一点，默认值应该与我们在 HTML 的 `value` 属性中声明的值相似。\n\
    \n例如，如果单选按钮中的值为 1 和 2（正如我们在之前的代码第 9 行和第 18 行中所做的那样），我们应该提供其中一个作为默认值。\n\n在初始化 **FormControl**\
