    \ know how to apply a binding to\nthem.\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_39_0.png)\n\
    \n***Figure 1.8:*** *Colors FormArray example*\n\nBut wait, this image has a plus\
    \ icon on the right bottom corner, which\ndenotes, the user can dynamically add\
    \ more **FormControl** items.\n\nSince we need more **FormControl(s)** of the\
    \ same type (color in\nparticular), we can imagine we need an array.\n\nLet's\
