    ```html

    1: <ng-container [formGroup]="form">

    2: <input type="text"

    3: formControlName="firstName"

    4: placeholder="First Name"

    5: (blur)="onTouch()">

    6:

    7: <input type="text"

    8: formControlName="lastName"

    9: placeholder="Last Name"

    10: (blur)="onTouch()">

    11:

    12: <input type="text"

    13: formControlName="email"

    14: placeholder="e-mail"

    15: (blur)="onTouch()">

    16:

    17: <input type="text"

    18: formControlName="age"

    19: placeholder="Age"

    20: (blur)="onTouch()">

    21: </ng-container>

    ```


    We have succeeded in creating a reusable child form component and reduce the code
    from the parent component.


    According to *figure 7.6*, the User Registration form requires the address details,
    and as such, we have to create the address component. This child component is
    a great exercise to try on your own by following the same approach with the Basic
    Info component. The steps to follow are:


    1. Create a component and implement **ControlValueAccessor** and all its methods.

    2. Define the form in the **ngOnInit** lifecycle hook.

    3. Develop each method in a similar way we did in the Basic Info component.

    4. Develop the HTML template.

    5. Use the component''s selector in the User Registration Form component and bind
    it with the address **FormControl** instance using the **formControlName** directive.


    ## Conclusion


    When developing an application, it often starts small, and progressively its size
    is increasing. It is vital to have the correct tools and use them accordingly
    when needed.


    The fact that **FormGroupDirective** and **ControlValueAccessor** can solve the
    same problems doesn''t make them equivalent "tools".


    If, for example, we need to create a split HTML form where the validity of the
    "*component A*" depends on the values of the "*component B*," then it''s better
    to use **FormGroupDirective**. On the other hand, if we need to reuse an HTML
    form across the application, it''s better to use **ControlValueAccessor**.


    In this chapter, we learned two great features that will help us better organize
    our HTML forms! Additionally, we learned to utilize **ControlValueAccessor** and
    create custom form controls.


    ## Key terms


    - **ControlValueAccessor**: This interface bridges the communication between Angular''s
    control and a native HTML control.

    - **FormGroupDirective**: It is the class type of the **[formGroup]** directive.

    - **forwardRef**: It is a helper function that allows us to use a reference even
    this this hasn''t been defined yet.


    ## Questions


    **Q 1. Can I use async validators using FormGroupDirective?**

    **A.** Nothing stopping you from using any validator you wish.


    **Q 2. I want to use a third party form control and integrate it with Angular
    Forms. How can I do this?**

    **A.** You have to implement **ControlValueAccessor** in a class and implement
    the methods to serve the purpose of the third party component.


    **Q 3. I have a form in which the validator of one form control depends on another
    form control value. Can I split the form?**

    **A.** You can split the form and use **FormGroupDirective**.


