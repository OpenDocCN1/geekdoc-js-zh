    9: export function validatorName(arg1?: any): AsyncValidatorFn

    {

    10: return (

    11: control: AbstractControl

    12: ): Observable<ValidationErrors | null> =>

    13: this.apiMethod(control.value).pipe(

    14: map((response) => (response ? {validatorName: true}

    : null))

    15: )

    16:}

