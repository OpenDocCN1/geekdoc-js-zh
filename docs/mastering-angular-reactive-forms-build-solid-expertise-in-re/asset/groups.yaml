    \n6: placeholder=\"First Name\"\n7: formControlName=\"firstName\" />\n8:\n9: <input\
    \ type=\"text\"\n10: placeholder=\"Last Name\"\n11: formControlName=\"lastName\"\
    \ />\n12:\n13: <input type=\"email\"\n14: placeholder=\"e-mail\"\n15: formControlName=\"\
    email\" />\n16:\n17: <input type=\"number\"\n18: placeholder=\"Age\"\n19: formControlName=\"\
    age\" />\n20:\n21: </div>\n22:\n23: <div formGroupName=\"address\">\n24:\n25:\
    \ <input type=\"text\"\n26: placeholder=\"Street\"\n27: formControlName=\"street\"\
    \ />\n28:\n29: <input type=\"number\"\n30: placeholder=\"Number\"\n31: formControlName=\"\
    number\" />\n32:\n33: <input type=\"number\"\n34: placeholder=\"Postal Code\"\n\
    35: formControlName=\"postal\" />\n36:\n37: </div>\n38:\n39: </form>\n\nIn lines\
    \ 3 and 23, we use the directive **formGroupName**, which works\nsimilarly to\
    \ **formControlName**. We use it to locate by name the nested\nFormGroup and apply\
    \ a binding in the corresponding div element.\n\n### The formGroupName directive\n\
    \nWe use the **formGroupName** directive to apply a binding of a nested\nFormGroup\
    \ into a DOM element.\n\nTo understand how this directive works, let's see an\
    \ example of a\nplain JavaScript Object and how the property accessor works:\n\
    \n1: const obj = {\n2: foo: {\n3: key1: 'value1',\n4: },\n5: foo1: {\n6: key2:\
    \ 'value2',\n7: },\n8: }\n9:\n10: console.log(obj['foo']['key1'])\n11: console.log(obj.foo.key1)\n\
    \nThe example above is an object with two nested objects: the foo and\nthe foo1.\
    \ There are two ways to access the nested objects and their\nproperties:\n\n-\
    \ In line 10, we use the **bracket notation** property accessor\n- In line 11,\
    \ we use the **dot notation** property accessor\n\nBoth assessors will return\
