    **Questions**


    **Q 1\. I want to display an error message, but I do not want the**


    **error message to appear during the first rendering. How**


    **can I control this?**


    **A.** The **.invalid** property is often combined with other


    **AbstractControl** properties to display error messages, either if


    the form is dirty, touched, and so on.


    **Q 2\. On every keystroke, the Form Model is updated with the**


    **user''s entered data. How can I change this behavior?**


    **A.** The default **updateOn** strategy is ''change.'' You can change this


    using either ''submit'' or ''blur.'''
