    **FormControl Validators**


    The **FormControl** class accepts two arguments, and as we have


    already learned, the first argument is the control''s default state. The


    second argument accepts a single or an array of validators. Please


    note that the second argument applies both in **FormControl** classes


    or the **FormBuilder** syntactic sugar.


    In the following code, we see how to set validators on **FormControl**


    instances:


    **component.ts code (with FormControl classes)**


    1: import {Component} from ''@angular/core''


    2: import {FormControl, Validators} from ''@angular/forms''


    3:


    4: @Component({


    5: selector: ''app-root'',


    6: templateUrl: ''./app.component.html'',


    7: styleUrls: [''./app.component.scss''],


    8:})


    9: export class AppComponent {


    10: firstName = new FormControl('''', Validators.required)


    11: lastName = new FormControl('''', [


    12: Validators.required,


    13: Validators.minLength(3),


    14: ])


    15:}


    In line 2, we import the Validators, and in lines 10 and 11, we register


    validators for the "**firstName**" and "**lastName**" form fields. Please note


    that the second argument of the "**lastName**" field is an array with


    more than one validator. As we said, it''s valid to set either a single or


    an array of validators.


    In the following code, we see the same example as before, but using


    the **FormBuilder** syntactic sugar:


    **component.ts code (with FormBuilder)**


    1: import {Component} from ''@angular/core'''
