- md: "\n```typescript\nexport class AppComponent {\n  **isDisabled: boolean** = true;\n\
    }\n```\n\nIn the template, we inject the property **isDisabled** in a button's\
    \ DOM property like the following:\n\n**component.html code**\n```html\n<button\
    \ type=\"button\" [disabled]=\"isDisabled\">Submit</button>\n```\n\nThe preceding\
    \ binding will result in a disabled button in the browser.\n\n**Note:** In both\
    \ examples, the template won't affect the source's value. It is a one-way binding.\n\
    \n**Bidirectional** means that the source will inject data into the template,\
    \ and the template will update the source with data. It is two-way binding. In\
    \ Angular, the functionality that updates the source with data is the event binding.\n\
    \n## Event binding\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_58_0.png)\n***Figure\
    \ 2.3:*** *Event binding*\n\nThe event binding is vital for the template's communication\
    \ with the source. Via an event handler, the template sends events with relevant\
    \ information (event arguments) to the source.\n\nIn the following example, we\
    \ will combine both the event binding and the interpolation:\n\n**component.ts\
    \ code**\n```typescript\nimport {Component} from '@angular/core'\n\n@Component({\n\
    \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls:\
    \ ['./app.component.scss'],\n})\nexport class AppComponent {\n  **buttonLabel\
    \ = 'Submit'**\n\n  submit() {\n    this.buttonLabel = 'Submitting...'\n  }\n\
    }\n```\n\n**component.html code**\n```html\n<button type=\"button\" (click)=\"\
    submit()\">\n  {{buttonLabel}}\n</button>\n```\n\nOn the first browser render,\
    \ the button will have the value \"*Submit*.\" On a user's button-click, the value\
    \ will convert to \"*Submitting*…\". This example combines the interpolation and\
    \ the event binding, which are both one-way data binding—the combination of the\
    \ two, though, results in a two-way data binding. In Angular forms, the two-way\
    \ data binding works similarly to the preceding example.\n\nNext, we will explore\
    \ how to apply data binding in the forms. Firstly, we will explain how to achieve\
    \ this functionality using Vanilla JavaScript.\n\n## Binding Using Vanilla JavaScript\n\
    \nIn the following example, we will handle the form binding using built-in events.\
    \ The use case of this example is to repeat the value of an HTML input element\
    \ on an HTML span element. The value repetition will happen on every keystroke.\n\
    \n**source code (javascript)**\n```javascript\nfunction inputEventHandler() {\n\
    \  const value = document.getElementById('inputId').value\n  document.getElementById('inputValue').innerHTML\
    \ = value\n}\n```\n\nIn line 2, we get the input element's value, and we provide\
    \ it in **innerHTML** in line 3.\n\n**template code**\n```html\n<input type=\"\
    text\" id=\"inputId\" oninput=\"inputEventHandler()\">\n<span id=\"inputValue\"\
    ></span>\n```\n\nIn line 1, we register the event handler **inputEventHandler**\
    \ on the **oninput** event. This event fires on every keystroke, which means every\
    \ time we write on the input. In line 2, the HTML element will repeat the values\
    \ we type on the input element.\n\nWe achieved a two-way data binding using Vanilla\
    \ JavaScript. We can imagine how hard it could be to code something like that\
    \ in a form with multiple HTML input elements. Luckily, we do not need a custom\
    \ implementation. Let's see how to achieve the same using Angular bindings.\n\n\
    ## Binding using Angular Semantics\n\nIn the following example, we will code the\
    \ same functionality in Angular as the previous example with Vanilla JavaScript:\n\
    \n**component.ts code**\n```typescript\nimport {Component} from '@angular/core'\n\
    \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
    \  styleUrls: ['./app.component.scss'],\n})\nexport class AppComponent {\n  inputValue\
    \ = ''\n\n  inputEventHandler(value) {\n    this.inputValue = value\n  }\n}\n\
    ```\n\nIn line 12, we get the input element's value, and we assign it to the **inputValue**\
    \ class property.\n\n**component.html code**\n```html\n<input type=\"text\" (input)=\"\
    inputEventHandler($event.target.value)\" [value]=\"inputValue\">\n<span>{{inputValue}}</span>\n\
    ```\n\nIn line 2, we register the event handler **inputEventHandler** on the input\
    \ event, which fires on every keystroke. This is a one-way binding from the template\
    \ to the source. In line 4, the HTML element will repeat the values we type on\
    \ the input element. Please note that we use interpolation, which is another one-way\
    \ binding from the source to the template. So, we achieved a two-way data binding\
    \ using Angular.\n\n## Binding using Reactive Forms\n\nFortunately, in Reactive\
    \ Forms, we do not have to manually handle the communication from the source to\
    \ the template and vice versa. The **formControl** and **formControlName** directives\
    \ address the binding.\n\nIn the previous chapter, we learned how to bind an input\
