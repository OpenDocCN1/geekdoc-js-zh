    \ |\n| | | **2** (**FormGroup**) |\n| | | **name** (**FormControl**) |\n\n***Table\
    \ 1.1***\n\nPlease note that we have three nested FormGroup instances, which are\
    \ marked with index 0,1,2.\n\n**component.ts code**\n\n1: import {Component, OnInit}\
    \ from '@angular/core'\n2: import {FormControl, FormGroup} from '@angular/forms'\n\
