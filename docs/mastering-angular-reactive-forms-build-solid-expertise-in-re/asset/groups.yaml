- md: "\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_94_0.png)\n\n***Figure 3.6:*** *FormArray\
    \ states is altered and bubbles up*\n\nLet's see how it works. The following table\
    \ shows a tree structure format with a **FormGroup** root node and children nodes\
    \ **FormControl** and **FormArray** instances:\n\n| AbstractControl instance |\
    \ AbstractControl type |\n| :--- | :--- |\n| myForm | FormGroup |\n| colors |\
    \ FormArray |\n| {array item} | FormGroup |\n| Name | FormControl |\n\n***Table\
    \ 3.8***\n\nWe assume that all the defined **FormControl** instances are required.\
    \ For this example, we will focus on the **.valid** property.\n\nFirstly, all\
    \ the controls have the default state, and as such, the **.valid** properties\
    \ are false, as follows:\n\n| AbstractControl instance | .valid property |\n|\
    \ :--- | :--- |\n| myForm | False |\n| colors | False |\n| {array item} | False\
    \ |\n| Name | False |\n\n***Table 3.9***\n\nThen, the user satisfies the required\
    \ validator of **Name formControl**, which leads to the following:\n\n- The **valid**\
    \ property of **Name FormControl** will turn to true\n- The .**valid** property\
    \ of the **parent FormGroup** (array item) will turn to true\n- The .**valid**\
    \ property of **colors FormArray** will turn to true\n- The **.valid** property\
    \ of **myForm FormGroup** will turn to true\n\n| AbstractControl instance | .valid\
    \ property |\n| :--- | :--- |\n| myForm | True |\n| colors | True |\n| {array\
    \ item} | True |\n| Name | True |\n\n***Table 3.10***\n\nIn the first chapter,\
    \ we learned that **FormArray** could either consists of **FormControl** or **FormGroup**\
    \ instances. In the current example, the **FormArray** consists of **FormGroup**\
    \ instances, and that's why the {array item} inherits the status for its **FormControl**\
    \ children.\n\nIn the following code, we see the Form Model of the preceding example:\n\
    \n**component.ts code**\n\n```typescript\n1: import {Component, OnInit} from '@angular/core'\n\
    2: import {FormArray, FormBuilder, FormGroup, Validators} from '@angular/forms'\n\
    3:\n4: @Component({\n5: selector: 'app-root',\n6: templateUrl: './app.component.html',\n\
    7: styleUrls: ['./app.component.scss'],\n8:})\n9: export class AppComponent implements\
    \ OnInit {\n10: myForm!: FormGroup\n11:\n12: get colors() {\n13: return this.myForm.get('colors')\
    \ as FormArray\n14: }\n15:\n16: constructor(private fb: FormBuilder) {}\n17:\n\
    18: ngOnInit(): void {\n19: this.myForm = this.fb.group({\n20: colors: this.fb.array([\n\
    21: this.getFormArrayItem('Red'),\n22: this.getFormArrayItem(),\n23: ]),\n24:\
    \ })\n25: }\n26:\n27: private getFormArrayItem(value?: string) {\n28: return this.fb.group({\n\
    29: name: [value, Validators.required],\n30: })\n31: }\n32:}\n```\n\nLet's now\
    \ see how we check the validity of the root **FormGroup**.\n\n**component.html\
    \ code**\n\n```html\n1: <form [formGroup]=\"myForm\">\n2:\n3: <ng-container formArrayName=\"\
    colors\">\n4: <div *ngFor=\"let color of colors.controls; let idx = index\">\n\
    5: <ng-container [formGroupName]=\"idx\">\n6: <input type=\"text\" formControlName=\"\
    name\" />\n7: </ng-container>\n8: </div>\n9: </ng-container>\n10:\n11: <small\
    \ *ngIf=\"myForm.invalid\">\n12: The form is invalid\n13: </small>\n14: </form>\n\
    ```\n\nIn lines 11-13, we check the validity of the root **FormGroup** and display\
    \ an error message.\n\n**Accessing a FormArray's controls**\n\nWe learned how\
    \ to display error messages for FormControl(s) that are nested in **FormGroup**.\
    \ In this section, we will learn how to display error messages for deep nested\
    \ FormControl(s) in **FormGroup**, which is nested in **FormArray**.\n\nLet's\
    \ see how we check each **FormControl** instance's validity status, which is part\
    \ of **FormArray**:\n\n**component.html code**\n\n```html\n1: <form [formGroup]=\"\
    myForm\">\n2:\n3: <ng-container formArrayName=\"colors\">\n4: <div *ngFor=\"let\
    \ color of colors.controls; let idx = index\">\n5: <ng-container [formGroupName]=\"\
    idx\">\n6: <input type=\"text\" formControlName=\"name\" />\n7: <small *ngIf=\"\
    color.get('name')?.invalid\">\n8: Required field\n9: </small>\n10: </ng-container>\n\
    11: </div>\n12: </ng-container>\n13:\n14: </form>\n```\n\nIn line 4, we iterate\
    \ the array items (which are **FormGroup** instances) of the colors array, and\
    \ we assign each **FormGroup** in the variable color.\n\nIn line 7, we get **FormControl**\
    \ from the current **FormGroup**. We set a condition that displays a message to\
    \ the user if the **FormControl** is invalid.\n\n**Note:** Similarly to the .invalid\
    \ property; we can use any other AbstractControl property, such as .touched, .untouched,\
    \ and so on.\n\nSince the validity status bubbles up, we can set different conditions\
    \ to check the status of **FormControl**, **FormArray**, or the root **FormGroup**.\n\
    \nIn the following code, we see how to check the validity status of **FormArray**:\n\
    \n**component.html code**\n\n```html\n1: <form [formGroup]=\"myForm\">\n2:\n3:\
    \ <ng-container formArrayName=\"colors\">\n4: <div *ngFor=\"let color of colors.controls;\
    \ let idx = index\">\n5: <ng-container [formGroupName]=\"idx\">\n6: <input type=\"\
    text\" formControlName=\"name\" />\n7: </ng-container>\n8: </div>\n9: </ng-container>\n\
    10:\n11: <small *ngIf=\"colors.invalid\">\n12: All fields are required\n13: </small>\n\
    14: </form>\n```\n\n**Using the AbstractControl properties in controls**\n\nAlthough\
    \ we've learned how to display error messages to users, we still need to control\
    \ when to display them, and we can utilize the **updateOn** property. In the example\
    \ below, we combine the **dirty** and **invalid** properties:\n\n**component.html\
    \ code**\n\n```html\n1: <input type=\"text\"\n2: placeholder=\"First Name\"\n\
    3: [formControl]=\"firstName\"\n4:\n5: <small *ngIf=\"firstName.dirty && firstName.invalid\"\
    >\n6: Field is required\n7: </small>\n```\n\n**Note:** Similarly to the .invalid\
    \ property; we can use any other AbstractControl property, such as .touched, .untouched,\
    \ and so on.\n\n**The updateOn option**\n\nAt the beginning of this chapter, we\
    \ saw the statement, \"*By default, the validity is calculated on every keystroke*.\"\
    \ This means that when a user interacts with input elements, even a single keystroke\
    \ triggers the execution of the validator function. Updating the control on every\
    \ keystroke is beneficial, but sometimes we need to prevent updating the control\
    \ so often. We can achieve this by using the **updateOn** property.\n\nThe following\
    \ list describes the **updateOn** options:\n\n- **change**: This is the default\
    \ option and updates the state of the control on every keystroke\n- **blur**:\
    \ Updates the state of the control on the blur event of HTML input fields\n- **submit**:\
    \ Updates the state of the control on the submit event of the HTML form\n\nIn\
    \ a **FormControl**: \n\n**component.ts code**\n\n```typescript\n1: lastName =\
    \ this.fb.control(null, {\n2: validators: [Validators.required,\n3: Validators.minLength(3)],\n\
    4: updateOn: 'blur',\n5:})\n```\n\nIf we want to use the **updateOn** property,\
    \ the second argument of the control should be an object and not a single validator\
    \ or an array of validators.\n\nin a **FormGroup**:\n\n**component.ts code**\n\
    \n```typescript\n1: this.myForm = this.fb.group(\n2: {\n3: firstName: ['', Validators.required],\n\
    4: lastName: ['', Validators.required],\n5: },\n6: {updateOn: 'blur'}\n7:)\n```\n\
    \nIn a **FormArray**:\n\n**component.ts code**\n\n```typescript\n1: this.myForm\
    \ = this.fb.group({\n2: colors: this.fb.array([], {updateOn: 'blur'}),\n3:})\n\
    ```\n\n**The AbstractControl properties and the CSS**\n\nThe communication with\
    \ the end-user requires displaying messages and sometimes decorating the fields\
    \ with specific CSS classes. For example, we apply a red border on the invalid\
    \ input fields.\n"
