  mdcn: "\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_85_0.png)\n\n***图 3.2:*** *AbstractControl\
    \ 属性*\n\n在下面的代码中，我们看到如何访问有效性属性 \n并为特定控件显示错误消息：\n\n**component.html 代码**\n\n1:\
    \ <input type=\"text\"\n2: placeholder=\"First Name\"\n3: [formControl]=\"firstName\"\
    \ />\n4:\n5: <small *ngIf=\"firstName.invalid\">Field is required</small>\n6:\n\
    7: <input type=\"text\"\n8: placeholder=\"Last Name\"\n9: [formControl]=\"lastName\"\
    \ />\n\n在第 5 行中，我们设置了一个条件，如果“**First Name**”无效，则向用户显示错误消息。由于我们只为 **firstName**\
    \ 控件注册了必填（必填）验证器，因此使用 `invalid` 属性来显示关于该字段为必填的消息是安全的。\n\n该属性的值将仅由必填验证器发生改变。\n\n\
    然而，如果我们有多个验证器（如“**Last Name**”字段所示），我们无法确定 **.valid** 或 **.invalid** 属性是由 **required**\
    \ 还是 **minLength** 验证器改变的，因为这两者都会影响控件的有效性。在这种情况下，我们必须使用 **.errors** 属性，这是一个由未满足的验证器生成的对象。\n\
    \n由于 **lastName** 控件拥有 **required** 和 **minLength** 验证器，**.errors** 属性将生成以下对象：\n\
    \n| 验证器 | 生成的错误对象 |\n| :--- | :--- |\n| required | `{\"required\": true}` |\n\
    | minLength | `{\"minlength\": {\"requiredLength\": 3, \"actualLength\": 1}}`\
    \ |\n\n***表 3.3***（上表内容）\n\n**.errors** 属性非常有用，因为我们可以根据不同情况设置不同的验证消息。\n\n下面的代码在\
    \ **required** 或 **minLength** 验证器未被满足时会显示不同的消息：\n\n**component.html 代码**\n\n\
    1: <input type=\"text\"\n2: placeholder=\"First Name\"\n3: [formControl]=\"firstName\"\
    \ />\n4:\n5: <small *ngIf=\"firstName.invalid\">Field is required</small>\n6:\n\
    7: <input type=\"text\"\n8: placeholder=\"Last Name\"\n9: [formControl]=\"lastName\"\
    \ />\n10:\n11: <small *ngIf=\"lastName.errors?.minlength\">The length of this\
    \ field is {{lastName.errors?.minlength.requiredLength}}</small>\n12: <small *ngIf=\"\
    lastName.errors?.required\">Field is required</small>\n\n在第 12–14 行中，如果 **minLength**\
    \ 验证器未被满足，我们将显示消息“*此字段的长度为 3*”。\n\n在第 15–17 行中，如果 **required** 验证器未被满足，我们将显示一条消息。\n\
    \n**注意：** 在组件模板中string **errors** 属性时，建议使用安全导航操作符（也称为 Elvis 运算符 (?)）。如果我们忽略了它，将得到类似于“*Cannot\
    \ read property 'required' of null.*”的错误。\n\n**FormGroup**\n\n**FormGroup** 与\
    \ **FormControl** 类似，它扩展了 **AbstractControl** 类并包含了我们在*表 3.1*中看到的所有属性。然而，用户无法直接触发\
    \ **FormGroup**。嵌套的 **FormControl** 实例的任何更改都会冒泡并改变 **FormGroup**，如如下图所示：\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_88_0.png)\n\
    \n***图 3.3:*** *FormControl 状态冒泡*\n\n让我们看看它是如何工作的。下面的表显示了一个树形结构，包含根节点 (**myForm**)\
    \ 和子节点 (**firstName** 和 **lastName**)。\n\n| AbstractControl 实例 | 类型 |\n| :---\
    \ | :--- |\n| myForm | FormGroup |\n| firstName | FormControl |\n| lastName |\
    \ FormControl |\n\n***表 3.4***（上表内容）\n\n我们假设所有定义的 **FormControl** 实例都是必填的。对于这个示例，我们将关注\
    \ **.valid** 属性。首先，所有控件处于默认状态，如下如下：\n\n| AbstractControl 实例 | .valid 属性 |\n| :---\
    \ | :--- |\n| myForm | False |\n| firstName | False |\n| lastName | False |\n\n\
    ***表 3.5***（上表内容）\n\n然后，用户满足了 **firstName** 的验证器，导致：\n\n1. **firstName FormControl**\
    \ 的 .valid 属性变为 true。\n2. **lastName FormControl** 的 .valid 属性保持为 false。\n3. **myForm\
    \ FormGroup** 的 .valid 属性也保持为 false。\n\n当所有嵌套的 **FormControl** 都为 true 时，FormGroup\
    \ 的有效性才会变为 true。\n\n| AbstractControl 实例 | .valid 属性 |\n| :--- | :--- |\n| myForm\
    \ | False |\n| firstName | True |\n| lastName | False |\n\n***表 3.6***（上表内容）\n\
    \n最后，用户满足了 **lastName** 验证器，因为所有嵌套的 **FormControl** 都为 true，FormGroup 的有效性变为 true。\n\
    \n| AbstractControl 实例 | .valid 属性 |\n| :--- | :--- |\n| myForm | True |\n| firstName\
    \ | True |\n| lastName | True |\n\n***表 3.7***（上表内容）\n\n在下面的代码中，我们看到 FormControl\
    \ 的状态如何冒泡并更新 **FormGroup**：\n\n**component.ts 代码**\n\n1: import {Component, OnInit}\
    \ from '@angular/core'\n2: import {FormBuilder, FormGroup, Validators} from '@angular/forms'\n\
    3:\n4: @Component({\n5: selector: 'app-root',\n6: templateUrl: './app.component.html',\n\
    7: styleUrls: ['./app.component.scss'],\n8: })\n9: export class AppComponent implements\
    \ OnInit {\n10: myForm!: FormGroup\n11:\n12: constructor(private fb: FormBuilder)\
    \ {}\n13:\n14: ngOnInit(): void {\n15: this.myForm = this.fb.group({\n16: firstName:\
    \ ['', Validators.required],\n17: lastName: ['', [Validators.required, Validators.minLength(3)]],\n\
    18: })\n19: }\n20: }\n\n在前面的代码中，我们看到 **firstName** 和 **lastName** 都是必填控件，同样，**lastName**\
    \ 拥有一个 **minLength** 验证器。\n\n**component.html 代码**\n\n1: <form [formGroup]=\"\
    myForm\">\n2:\n3: <input type=\"text\"\n4: placeholder=\"First Name\"\n5: formControlName=\"\
    firstName\" />\n6:\n7: <input type=\"text\"\n8: placeholder=\"Last Name\"\n9:\
    \ formControlName=\"lastName\" />\n10:\n11: <small *ngIf=\"myForm.invalid\">The\
    \ form is invalid</small>\n12:\n13: </form>\n\n在第 11 行中，我们有一个条件，当表单无效时向用户显示消息。请注意\
    \ **FormGroup** 本身没有验证规则。**.invalid** 属性是从子 **FormControl** 的状态计算出的。\n\n**访问 FormGroup\
    \ 的控件**\n\n我们学习了当单个 **FormControl** 无效时如何显示消息。在本节中，我们将学习从 **FormGroup** 查询 **FormControl**。为了实现这一点，我们可以通过以下两种方式：\n\
    \n1. **formGroup.controls.formControl.property**: 第一种方案是使用点符号。正如*图 3.3*所示，我们需要将\
    \ **FormGroup**、**formControl** 和属性替换为相应的值 (**myForm.controls.firstName.invalid**）。\n\
    \n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_92_0.png)\n\n***图 3.4:*** *通过 FormGroup\
    \ 和 FormControl 选择属性*\n\n2. **formGroup.get('formControl')?.property**: 第二种方案是使用\
    \ get 方法。正如*图 3.4*所示，我们需要将 **FormGroup**、**formControl** 和属性替换为相应的值 (**myForm.get('firstName')?.invalid**)。\n\
    \n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_92_1.png)\n\n***图 3.5:*** *通过 FormGroup\
    \ 和 FormControl 使用 get 方法*\n\n请注意 **formControl** 应该是一个字符串。\n\n在下面的代码中，我们看到当嵌套的\
    \ **FormControl** 实例无效时如何显示消息：\n\n**component.html 代码**\n\n1: <form [formGroup]=\"\
    myForm\">\n2:\n3: <input type=\"text\"\n4: placeholder=\"First Name\"\n5: formControlName=\"\
    firstName\" />\n6:\n7: <small *ngIf=\"myForm.controls.firstName.invalid\">Required\
    \ field</small>\n8:\n9: <input type=\"text\"\n10: placeholder=\"Last Name\"\n\
    11: formControlName=\"lastName\" />\n12:\n13: <small *ngIf=\"myForm.controls.lastName.invalid\"\
    >Required field</small>\n14:\n15: </form>\n\n"
