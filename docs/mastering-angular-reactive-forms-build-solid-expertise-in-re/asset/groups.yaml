    **The formControlName directive**


    We use this directive to refer **by name** to a FormControl that belongs


    to a FormGroup.


    FormControl handles the state of an **individual** HTML input element,


    while FormGroup handles a **group** of HTML input elements. To


    access the grouped HTML elements, we use their control name.


    To understand this better, let''s see an example of a plain JavaScript


    Object and how to access the object''s properties. The operation to


    access the properties is called **property accessor**, and we can


    achieve this either by using a "*dot notation*" or a "*bracket notation*".


    1: const obj = {


    2: foo: ''bar'',


    3: foo1: ''bar1'',


    4:}


    5:


    6: console.log(obj[''foo''])


    7: console.log(obj.foo)


    The preceding example is an object with two properties: the foo and


    the foo1\. There are two ways to access the property values:'
