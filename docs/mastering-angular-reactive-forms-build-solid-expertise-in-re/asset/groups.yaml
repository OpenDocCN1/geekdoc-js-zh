- md: "\n**Note:** The removeAt() method is zero-based.\n\nIn the following example,\
    \ we will use the **.removeAt()** method to remove controls from the array:\n\n\
    **component.ts code**\n\n1: removeColor(index: number) {\n2: this.colors.removeAt(index)\n\
    3: }\n\nSuppose we invoke the method **removeColor(0)**. In that case, the color\
    \ array will be decreased by one, and the change will appear in the HTML without\
    \ any further programming action.\n\nHere, we'll see a useful example of how to\
    \ use the **removeColor()** method to an HTML template:\n\n**component.html code**\n\
    \n1: <div *ngFor=\"let _ of colors.controls; let idx = index\">\n2:\n3: <ng-container\
    \ [formGroupName]=\"idx\">\n4: <input type=\"text\" formControlName=\"name\" />\n\
    5: **<span (click)=\"removeColor(idx)\">X</span>**\n6: </ng-container>\n7: \n\
    8: </div>\n\nIn line 5, we are setting the **removeColor** as a click event handler\
    \ on a span element.\n\n## FormGroup Actions\n\n**FormGroup** is a class that\
    \ extends the **AbstractControl** class and has many methods, which will significantly\
    \ help us if we learn how to use them effectively. The list of methods is big\
    \ enough, but we will go over the very basics of them.\n\n| Method name | Description\
    \ |\n| :--- | :--- |\n| **setValue()** | It accepts an object similar to the structure\
    \ of FormGroup |\n| **patchValue()** | It's the same with setValue() with the\
    \ difference that it won't fail if we do not pass the same object structure |\n\
    \n***Table 1.3***\n\nA practical use case for using **setValue()** and **patchValue()**\
    \ methods is when we have to fill **FormGroup** with data from an API. For example,\
    \ let's get a user profile page with the sections \"BasicInfo\" and \"Address.\"\
    \ According to the imaginary business requirements, we have to create a page where\
    \ the user should create a profile and another page to update the already created\
    \ profile. We will name the pages \"*Create*\" and \"*Update*\" respectively.\
    \ To fill in the form fields with data, we will use **setValue()** or **patchValue()**.\n\
    \n### The Create page\n\nWhen a user clicks the submit button of a form, we collect\
    \ the data to process them. In the following code, we'll see how to set a submit\
    \ event in the form:\n\n**component.html code**\n\n1: <form [formGroup]=\"myForm\"\
    \ (ngSubmit)=\"submitForm()\">\n2:\n3: <div formGroupName=\"basicInfo\">\n4: <!--\
    \ Input elements -->\n5: </div>\n6: \n7: <div formGroupName=\"address\">\n8: <!--\
    \ Input elements -->\n9: </div>\n10:\n11: **<button type=\"submit\">Submit</button>**\n\
    12: </form>\n\nIn the next code, we'll see the implementation of the submit event\
    \ handler:\n\n**component.ts code**\n\n1: submitForm() {\n2: // consume a service\
    \ method here which will delegate the request on an API request\n3: console.log(this.myForm.value)\n\
    4: }\n\nIn line 3, we use the property value of **FormGroup**, which returns a\
    \ JSON object similar to what we have constructed in **FormGroup**. The following\
    \ JSON object is the result of the form model where we will create in the 'The\
    \ Update page' section:\n\n```json\n{\n  \"basicInfo\":{\n    \"firstName\":\"\
    John\",\n    \"lastName\":\"Doe\",\n    \"email\":\"john@doe.com\",\n    \"age\"\
    :\"76\"\n  },\n  \"address\":{\n    \"street\":\"street name\",\n    \"number\"\
    :\"12\",\n    \"postal\":\"49000\"\n  }\n}\n```\n\n### The Update page\n\nTo update\
    \ the already created user profile, we get the values from a source (for example,\
    \ API, etc.), and we fill in the form fields with these data. In the following\
    \ code, we create a **FormGroup**, and we provide it with data using the **setValue()**\
    \ method:\n\n**component.ts code**\n\n1: ngOnInit(): void {\n2: this.myForm =\
    \ new FormGroup({\n3: basicInfo: new FormGroup({\n4: firstName: new FormControl(),\n\
    5: lastName: new FormControl(),\n6: email: new FormControl(),\n7: age: new FormControl(),\n\
    8: }),\n9: address: new FormGroup({\n10: street: new FormControl(),\n11: number:\
    \ new FormControl(),\n12: postal: new FormControl(),\n13: }),\n14: })\n15:\n16:\
    \ **this.myForm.setValue(this.mockData())**\n17: }\n18:\n19: private mockData()\
    \ {\n20: return {\n21: basicInfo: {\n22: firstName: 'John',\n23: lastName: 'Doe',\n\
    24: email: 'john@doe.com',\n25: age: '76',\n26: },\n27: address: {\n28: street:\
    \ 'street name',\n29: number: '12',\n30: postal: '49000',\n31: },\n32: }\n33:\
    \ }\n\nIn the preceding example, the **mockData()** method represents an API response.\n\
    \n**Note:** The object's structure of the mockData() method is the same as the\
    \ FormGroup structure. It contains all the properties, and this allows us to use\
    \ the setValue(). If we are not sure that the object has all the required properties,\
    \ it is encouraged to use the patchValue() method.\n\nWe anticipate visiting the\
    \ page and seeing the input elements field with the provided data. The \"*basic\
    \ info*\" form fields will become as follows:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_47_0.png)\n\
    \n***Figure 1.9:*** *User's Basic Info with data*\n\nThe address form fields will\
    \ become as follows:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_47_1.png)\n\n\
    ***Figure 1.10:*** *User's Address with data*\n\nThe **setValue()** method requires\
    \ an object with every property our **FormGroup** has. If the object is not identical\
    \ with the **FormGroup**, Angular will throw an error. For example, if we delete\
    \ the property from line 22, we will get the error: \"Must supply a value for\
    \ firstName\".\n\n## Reactive Forms\n\nIn Angular, two kinds of forms exist, Template-Driven\
    \ forms and Reactive-Forms. There is a perfect reason behind the name \"Reactive,\"\
    \ and it has to do with the user's interaction.\n\n**Note:** The Mapper layer\
    \ can be just a set of methods in a service responsible for the API requests and\
    \ transformations.\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_49_0.png)\n\n***Figure\
    \ 1.11:*** *Basic application architecture*\n\n### Form Builder\n\nIf we have\
    \ a complex form that has many FormGroup(s), FormControl(s), and FormArray(s),\
    \ the syntax might be a bit overwhelming. We can make the code look lot more straightforward\
    \ using **FormBuilder**, which provides syntactic sugar. This is another way of\
    \ creating **FormControl**, **FormGroup**, and **FormArray**. The table below\
    \ describes the equivalence between the class and the FormBuilder syntax.\n\n\
    | class syntax | FormBuilder syntax |\n| :--- | :--- |\n| new FormControl() |\
    \ [] or this.fb.control('') |\n| new FormGroup() | this.fb.group() |\n| new FormArray()\
    \ | this.fb.array() |\n\n***Table 1.4***\n\nTo use the syntactic sugar, we have\
    \ to inject in the component's **FormBuilder**, as seen in the following code\
    \ in line 11:\n\n```typescript\nimport {Component} from '@angular/core';\nimport\
    \ {FormBuilder} from '@angular/forms';\n\n@Component({\n  selector: 'app-root',\n\
    \  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss'],\n\
    })\nexport class AppComponent {\n\n  constructor(private fb: FormBuilder) {}\n\
    \n}\n```\n\n**FormGroup with FormControls**\n\nHere, we see how a Form Model looks\
    \ like with classes and how the equivalence will be with **FormBuilder**.\n\n\
    **With classes**\n\n```typescript\nthis.myForm = new FormGroup({\n  firstName:\
    \ new FormControl(),\n  lastName: new FormControl(),\n})\n```\n"
