    })\nexport class AppComponent implements OnInit {\n  myForm!: FormGroup\n\n  constructor(private\
    \ fb: FormBuilder) {}\n\n  ngOnInit() {\n    this.myForm = this.fb.group({\n \
    \     frontEndDev: this.fb.control(null),\n    })\n  }\n}\n```\n\n**TIP:** In\
    \ FormBuilder, the FormControl is equivalent to [] and `this.fb.control(null)`.\
    \ Let's see how to use the **formControlName** directive in the following code:\n\
    \n**component.html code**\n```html\n<label>I am a front-end developer</label>\n\
    <div [formGroup]=\"myForm\">\n  <div>\n    <label for=\"yesFrontEnd\">Yes</label>\n\
    \    <input id=\"yesFrontEnd\"\n           type=\"radio\"\n           formControlName=\"\
    frontEndDev\"\n           name=\"frontEndDev\"\n           value=\"1\">\n  </div>\n\
    \n  <div>\n    <label for=\"noFrontEnd\">No</label>\n    <input id=\"noFrontEnd\"\
    \n           type=\"radio\"\n           formControlName=\"frontEndDev\"\n    \
    \       name=\"frontEndDev\"\n           value=\"2\">\n  </div>\n</div>\n```\n\
    \nIn line 7 and line 16, we use the **formControlName** directive to request the\
    \ **FormControl** by the name **frontEndDev** from **FormGroup**.\n\n### Set default\
    \ values\n\nThe default values on the radio buttons denote which option to be\
    \ preselected on the initial rendering, as we see in the following figure:\n\n\
    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_66_0.png)\n\n***Figure 2.5:*** *Radio\
    \ button example with default values*\n\nTo make this happen, the default values\
    \ should be similar to what we have declared in the value attribute in the HTML.\n\
    \nIf, for example, the values in the radio buttons are 1 and 2, as we did in the\
    \ previous code in lines 9 and 18, then we should provide as a default value one\
    \ or the other.\n\nTo set data in the **FormControl** initialization, we have\
    \ to fill in the first argument with a value, as we see in the following examples:\n\
    \n1. **frontEndDev: this.fb.control('1')** — Providing the value \"1\" in FormControl\
    \ will check the first radio button with the label \"Yes.\"\n2. **frontEndDev:\
    \ this.fb.control('2')** — Providing the value \"2\" in FormControl will check\
    \ the second radio button with the label \"No.\"\n\n### Data bind Checkbox\n\n\
    The checkbox element accepts a Boolean value type. It can either be \"true,\"\
    \ which makes the checkbox checked, or \"false,\" making the checkbox unchecked.\n\
    \nCompared to the radio buttons, which are often used in groups and accept only\
    \ one selection, the checkbox can have multiple elements checked.\n\nIn the following\
    \ sections, we will see examples of how to data bind a checkbox, either by using\
    \ a **formControl** directive or a **formControlName** directive—the outcome of\
    \ those examples will be:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_67_0.png)\n\
    \n***Figure 2.6:*** *Checkbox example*\n\n#### With [formControl] directive\n\n\
    In the following code, we create a **FormControl** instance, and we apply a binding\
    \ with a checkbox using the **formControl** directive.\n\n**component.ts code**\n\
    ```typescript\nimport {Component} from '@angular/core'\nimport {FormControl} from\
    \ '@angular/forms'\n\n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
    \  styleUrls: ['./app.component.scss'],\n})\nexport class AppComponent {\n  termsAndConditions\
    \ = new FormControl()\n}\n```\n\nSince the **FormControl** instance has no provided\
    \ value, the checkbox in the HTML will be unchecked.\n\nIn the following HTML,\
    \ we bind **FormControl** in a checkbox element:\n\n**component.html code**\n\
    ```html\n<input type=\"checkbox\"\n       id=\"termsAndConditions\"\n       [formControl]=\"\
    termsAndConditions\">\n\n  <label for=\"termsAndConditions\">I accept the terms\
    \ and conditions</label>\n```\n\nIn line 3, we use the **formControl** directive\
    \ to apply a binding with the checkbox, and the value of **termsAndConditions**\
    \ **formControl** will be:\n- **true**, if the user checks the checkbox\n- **false**,\
    \ if the user unchecks the checkbox\n\n#### With formControlName directive\n\n\
    We can apply the same functionality as we did with the **formControl** directive,\
    \ but this time we will nest a **FormControl** in a **FormGroup**, as shown in\
    \ the following code, using the **FormBuilder** syntactic sugar:\n\n**component.ts\
    \ code**\n```typescript\nimport {Component, OnInit} from '@angular/core'\nimport\
    \ {FormBuilder, FormGroup} from '@angular/forms'\n\n@Component({\n  selector:\
    \ 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss'],\n\
    })\nexport class AppComponent implements OnInit {\n  myForm!: FormGroup\n\n  constructor(private\
    \ fb: FormBuilder) {}\n\n  ngOnInit() {\n    this.myForm = this.fb.group({\n \
    \     termsAndConditions: this.fb.control(null),\n    })\n  }\n}\n```\n\nIn line\
    \ 16, the provided value in the **FormControl** is null, a false value, which\
    \ will result in an unchecked checkbox in the browser.\n\nIn the next section,\
    \ we will learn about truthy and falsy values, which define if a checkbox is checked\
    \ or unchecked.\n\nIn the following code, we bind a div element with a **FormGroup**,\
    \ and we access the **FormControl** by name, using the **formControlName** directive:\n\
    \n**component.html code**\n```html\n<div [formGroup]=\"myForm\">\n  <input type=\"\
    checkbox\"\n         id=\"termsAndConditions\"\n         formControlName=\"termsAndConditions\"\
    >\n\n  <label for=\"termsAndConditions\">I accept the terms and conditions</label>\n\
    </div>\n```\n\nIn line 4, we apply a binding in the checkbox using the **formControlName**\
    \ directive. The **termsAndConditions formControl** will be:\n- **true**, if the\
    \ user checks the checkbox\n- **false**, if the user unchecks the checkbox\n\n\
    ### Set default values\n\nThe default values of the checkbox denote if it will\
    \ be checked or not, as we see in the following figure:\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_69_0.png)\n\
    \n***Figure 2.7:*** *Checkbox example with default values*\n\nAlthough the checkbox\
    \ accepts Boolean values, in essence, Angular uses implicit type coercion² to\
    \ translate the values to Boolean equivalent ones. Every truthy value will check\
    \ the checkbox, and every falsy value will leave the checkbox unchecked or force\
    \ the checkbox to uncheck.\n\nWe use the truthy and falsy values in the **FormControl**\
    \ initialization or **setValue/patchValue** methods.\n\nTo set data in the **FormControl**\
    \ initialization, we have fill in the first argument with a value, as we see in\
    \ the following examples:\n\n1. **termsAndConditions = new FormControl(true)**\
    \ — Providing the value \"true\" in FormControl will check the checkbox.\n2. **termsAndConditions:\
    \ this.fb.control(null)** — Providing the value \"null\" in FormControl will leave\
    \ the checkbox unchecked.\n\nIn the following table, we see some examples of truthy\
    \ and falsy values:\n\n| FormControl with various values | Is checked |\n| :---\
    \ | :--- |\n| termsAndConditions = new FormControl() | False |\n| termsAndConditions\
    \ = new FormControl(true) | True |\n| termsAndConditions = new FormControl(\"\
    true\") | True |\n| termsAndConditions = new FormControl(\"false\") | True |\n\
    | termsAndConditions = new FormControl(false) | False |\n| termsAndConditions\
    \ = new FormControl([]) | True |\n| termsAndConditions = new FormControl({}) |\
    \ True |\n| termsAndConditions = new FormControl(null) | False |\n| termsAndConditions\
    \ = new FormControl(undefined) | False |\n\n***Table 2.1***\n\nPlease note that\
    \ replacing the **FormControl** with the **FormBuilder** syntactic sugar has the\
    \ same results.\n\n### Data bind select element\n\nAlthough it seems simple to\
    \ construct a select menu, it's peculiar due to the data source, which could be\
    \ either a string array or an object array. When we select a radio button, we\
    \ set in the respective **formControl** the radio button's value. Similarly, when\
    \ we check/uncheck a checkbox, we set a Boolean value in the respective **formControl**.\
    \ In the **Select** menu, we do not have a consistent flow. Different applications\
    \ have different needs.\n\nFollowing are examples of binding three options in\
    \ a **Select** menu using a single **FormControl**, as shown in *figure 2.8*.\
    \ Please note that the usage of the **formControlName** directive is similar to\
    \ the previous HTML elements.\n\n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_71_0.png)\n\
    \n***Figure 2.8:*** *Select menu example*\n\n#### Use case with predefined options\
