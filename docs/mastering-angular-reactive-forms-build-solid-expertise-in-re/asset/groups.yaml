    \ 在 FormControl 中提供值 \"1\" 将勾选标签为“是”的第一个单选按钮。\n2. **frontEndDev: this.fb.control('2')**\
    \ — 在 FormControl 中提供值 \"2\" 将选中标签为“否”的第二个单选按钮。\n\n### 复选框（Checkbox）数据绑定\n\n复选框元素接受布尔值类型。它可以是\
    \ \"true\"，使复选框处于选中状态；也可以是 \"false\"，使复选框未被选中。\n\n与通常成组使用且仅允许选择一个的单选按钮相比，复选框可以有多个元素处于选中状态。\n\
    \n在接下来的章节中，我们将看到如何通过 **formControl** 指令或 **formControlName** 指令对复选框进行数据绑定——这些示例的结果将是：\n\
    \n![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_67_0.png)\n\n***图 2.6：*** *复选框示例*\n\
    \n#### 使用 [formControl] 指令\n\n在以下代码中，我们创建了一个 **FormControl** 实例，并使用 **formControl**\
