    通过 Angular 12 的真实案例，使用 Form Control、Form Group、Form Array、Validators、测试等构建实实的响应式表单专业知识


    FANIS PRODROMOU


    **精通 Angular 响应式表单**


    *构建实实的响应式表单专业知识*

    *通过 Form Control、Form Group、Form*

    *Array、Validators、测试等技术，通过*

    *Angular 12 的真实案例*

    *实现*


    **Fanis Prodromou**


    www.bpbonline.com


    **2022年第一版**


    **版权所有 © BPB Publications, India**


    **ISBN: 978-93-91030-247**


    版权所有。未经出版者事先书面许可，不得以任何形式或通过任何手段对本书的任何部分进行复制、分发或传输，或存储在数据库或检索系统中，但程序列表可以在计算机系统中录入、存储和执行除外，但它们不能通过出版、复印、录制或任何电子和机械手段进行复制。


    **责任限制与免责声明**


    本书中包含的信息在作者和出版者的已知范围内是真实且准确的。作者已尽一切努力确保这些出版内容的准确性，但对于书中任何信息可能引起的任何损失或损害，出版者不承担任何责任。书中提到的所有商标均承认其各自所有者的财产，但
    BPB Publications 无法保证这些信息的准确性。


    www.bpbonline.com


    **献给**


    *献给我那耐心的妻子 Tania，她将我的不完美变为完美，以及我的女儿 Nelly！*

    *感谢一切。*


    ## 关于作者


    **Fanis Prodromou** 是一位对 Angular 前端开发充满热情的高级软件工程师。他住在希腊雅典，曾曾在许多大型公司工作。在 14 年的编程生涯中，他在代码质量、应用架构和应用性能方面积累了丰富的经验。


    由于意识到计算机科学和技术领域演变之快，他努力通过参加会议和聚会、学习以及尝试新技术来保持与同步。他喜欢分享自己的知识并帮助其他开发者。


    “分享即关怀”


    他通过 Code.Hub Institute 在企业公司教授 Angular，撰写文章，制作 YouTube 视频并在 Angular 聚会上发表演讲。他喜欢与他的两只猫度过时光，并在空闲时间徒步和潜水。


    ## 关于评审员


    **Pankaj Parkar** 在 Angular、React 和 EmberJS 等不同前端技术方面拥有七年的工作经验，目前在 Deskera 担任高级软件工程师。他在
    Angular 和 Web 应用开发等方面的技能使他成为了 Microsoft MVP 和 Google 开发者专家（GDE）。


    Pankaj 喜欢与社区分享知识；因此，你会发现他在各种技术活动和会议上进行演讲。Pankaj 也是印度 Stack Overflow 的顶级贡献者，并在
    Angular 和 AngularJS 领域位列全球前 20 名。他还是 BPB Publications 的技术评审员。他现在专注于将自己的知识投入开源项目，并通过导师指导、创建
    POC（概念验证）、举办工作坊和编写博客与社区分享，以帮助世界变得更美好、更发达。


    ## 致谢


    我在 15 年前遇到了我的妻子，从那以后，我们就生活在一起。毫无疑问，她是我的另一半。她支持我的抱负，让我成为一个更好的人。没有我的妻子，我无法写出这本书。


    感谢我在 Angular Athens Meetup 和 Angular Nation 的朋友和共同组织者，我在那里结识了优秀的人并交流了许多想法。


    感谢书籍评审员 Pankaj Parkar。他的参与和宝贵建议让这本书变得完善。特别感谢 BPB Publications，尤其是 Nrip Jain，感谢他们在创建和出版这本书过程中提供的支持、建议和帮助。


    ## 前言


    Angular 框架有两种构建 HTML 表单的方法：基于模板驱动的表单（template-driven forms）和响应式表单（reactive forms）。后者由于基于模型，因此也被称为模型驱动表单（model-driven
    forms）。


    比较这两者，我们可以说责任已经从 HTML 模板转移到了源代码。例如，在模板驱动的表单中，单元测试和验证是在 HTML 中应用的；而在响应式表单中，它们是应用在源代码（typescript）中的。在响应式表单中，源代码起着重要作用，并提供了极大的活性。


    Angular 表单是用户与系统之间的通信通道。我们通过表单收集数据，并在大多数情况下通过 API 向服务器提供这些数据。数据是一项宝贵的资产，应当是准确的。因此，使用
    Angular 响应式表单是有优势的，因为我们拥有所有必要的工具来确保数据的完整性。


    本书遵循 Angular 12 的最新更改，并基于 Typescript 的 Strict（严格）标志。


    *本书由七章组成，读者将在其中学习以下内容：*


    - **第一章：** 在这一章中，我们将学习什么是响应式表单以及我们为什么要精通它们。我们还将深入学习响应式表单所有构建组件的细节。

    - **第二章：** 与 HTML 元素的绑定是简单的，但在某些情况下情况可能会变得复杂。在这一章中，我们将学习如何对所有 HTML 元素应用绑定。

    - **第三章：** 验证是一项核心功能，因为充当了系统与用户之间的通信通道。在这一章中，我们将学习内置验证器。

    - **第四章：** 通常，复杂表单中的内置验证器不足以满足业务场景。在这一章中，我们将学习如何自定义验证器。

    - **第五章：** 在这一章中，我们将学习如何与用户数据交互并创建动态验证器。

    - **第六章：** 单元测试对于应用程序的质量和健壮性至关重要。响应式表单为编写单元测试提供了极好的方法。

    - **第七章：** 我们应该如何处理大型 Angular 表单？如何将其拆分为不同的组件？此外，我们如何多次使用特定的组件表？在这一章中，我们将学习如何实现所有这些，并深入研究响应式表单。


    ## 下载代码


    **代码包和彩色图片：**


    请通过链接下载本书的***代码包***和***彩色图片***：


    **https://rebrand.ly/eccf8c**


    **勘误**


    我们对 BPB Publications 的工作非常自豪，并遵循最佳实践以确保内容的准确性，为订阅者提供浸式的阅读体验。读者是我们的镜子，我们利用他们的输入来反思并改进出版过程中可能出现的人为错误。为了让我们维护质量并帮助任何因意外错误而遇到困难的读者，请写邮件告诉我们：**errata@bpbonline.com**


    BPB Publications 家庭非常感谢您的支持、建议和反馈。


    您知道吗？BPB 为出版的书提供电子版本，提供 PDF 和 ePub 文件。作为纸质书客户，您可以在 **www.bpbonline.com** 升级到电子版，您有权获得电子版的折扣。


    有关更多信息，请通过 **business@bpbonline.com** 与我们联系。


    在 **www.bpbonline.com**，您还可以阅读免费的技术文章集、订阅一系列免费的时事通讯，并


