- md: "\nEach **AbstractControl** property has an equivalent CSS class, which is auto-appended\
    \ to the HTML elements. For example, if a control is **valid**, the **ng-valid**\
    \ CSS class will auto append in the corresponding HTML element.\n\nIn the following\
    \ table, we see the equivalent CSS class to **AbstractControl** properties.\n\n\
    | Property | CSS class |\n| :--- | :--- |\n| valid | ng-valid |\n| invalid | ng-invalid\
    \ |\n| touched | ng-touched |\n| untouched | ng-untouched |\n| pristine | ng-pristine\
    \ |\n| dirty | ng-dirty |\n| pending | ng-pending |\n\n***Table 3.11***\n\nThese\
    \ CSS classes are useful as we can have global CSS rules to decorate, for example,\
    \ the invalid input fields. In the following code, we see how to apply a border\
    \ on the HTML input fields, which are invalid and dirty.\n\n**component.css code**\n\
    ```css\n1: input.ng-invalid.ng-dirty {\n2: border: 1px solid red;\n3:}\n```\n\n\
    To understand how the CSS classes work, let's see and examine the HTML code of\
    \ the example form that we saw in the section \"*FormArray Validators*.\"\n\n\
    **component.html code**\n```html\n1: <form [formGroup]=\"myForm\">\n2:\n3: <div\
    \ formArrayName=\"colors\">\n4: <ng-container *ngFor=\"let _ of colors.controls;\
    \ let idx = index\">\n5: <div [formGroupName]=\"idx\">\n6: <input type=\"text\"\
    \ formControlName=\"name\" />\n7: </div>\n8: </ng-container>\n9: </div>\n10:\n\
    11: </form>\n```\n\nIn line 1, we bind the form element with a [**formGroup**]\
    \ directive, and Angular automatically will append CSS classes in the generated\
    \ code.\n\nThe same happens in the div elements of lines 3 and 5 and the input\
    \ field in line 6. Whenever we use a directive to apply a binding to an HTML form\
    \ field, Angular will auto append CSS classes to the generated code.\n\n**Note:**\
    \ In the preceding code, we used <div> tags instead of <ng-container> tags. Since\
    \ the <ng-container> does not append any DOM element, we wouldn't have the CSS\
    \ classes attached.\n\nLet's see the generated code:\n\n**generated html code**\n\
    ```html\n1: <form class=\"ng-untouched ng-pristine ng-invalid\">\n2: <div formarrayname=\"\
    colors\" class=\"ng-untouched ng-pristine ng-invalid\">\n3: <div class=\"ng-untouched\
    \ ng-pristine ng-invalid\">\n4: <input type=\"text\"\n5: formcontrolname=\"name\"\
    \n6: class=\"ng-untouched ng-pristine ng-invalid\" />\n7: </div>\n8:\n9: <div\
    \ class=\"ng-untouched ng-pristine ng-invalid\">\n10: <input type=\"text\"\n11:\
    \ formcontrolname=\"name\"\n12: class=\"ng-untouched ng-pristine ng-invalid\"\
    \ />\n13: </div>\n14: </div>\n15: </form>\n```\n\nWhen we bind an HTML element\
    \ with any of the Angular Reactive Form directives (**[formGroup]**, **formArrayName**,\
    \ **[formGroupName]**, **formControlName**), Angular will auto append CSS classes.\n\
    \n## Conclusion\n\nWe learned how to use the **AbstractControl** properties and\
    \ how useful they are. We can set various conditions to capture different business\
    \ and use cases. We also learned that we could achieve data integrity on the server\
    \ with validations, and we are establishing communication with the end-user. In\
    \ the next chapter, we will continue exploring the validators; we will learn how\
    \ to construct custom validators for more advanced use cases.\n\n## Key terms\n\
    \n- **Valid**: A Boolean property that denotes if the control's validators are\
    \ satisfied.\n- **Invalid**: A Boolean property that indicates if at least one\
    \ control's validator is not satisfied.\n- **Touched**: A Boolean property that\
    \ indicates if a user-triggered a blur event.\n- **Untouched**: The default state\
    \ of a control. A Boolean property indicates that the user did not trigger a blur\
    \ event.\n- **Pristine**: A Boolean property that indicates that the user didn't\
    \ yet change the control's data.\n- **Dirty**: A Boolean property that indicates\
    \ that the user changed the control's data.\n- **Validators**: Functions that\
    \ perform validation to **FormControl**, **FormGroup**, or **FormArray**.\n\n\
    ## Questions\n\n**Q 1. I want to display an error message, but I do not want the\
    \ error message to appear during the first rendering. How can I control this?**\n\
    \n**A.** The **.invalid** property is often combined with other **AbstractControl**\
    \ properties to display error messages, either if the form is dirty, touched,\
    \ and so on.\n\n**Q 2. On every keystroke, the Form Model is updated with the\
    \ user's entered data. How can I change this behavior?**\n\n**A.** The default\
    \ **updateOn** strategy is 'change.' You can change this using either 'submit'\
    \ or 'blur.'\n\n# CHAPTER 4: Custom Validators\n\n## Introduction\n\nIn the previous\
    \ chapter, we learned how to establish communication with a user using the built-in\
    \ validators on a FormControl instance. Such validators, in some cases, can be\
    \ limited in enterprise applications that have demanding requirements. It would\
    \ be nice to have flexibility on the validations by creating our own custom rules\
    \ and using them with FormControl, FormGroup, and FormArray.\n\n## Structure\n\
    \nThe structure of custom validators\n\n- **FormControl custom validators**\n\
    \    - Writing the FormControl validator\n    - Using the FormControl validator\n\
    \    - Informing the user of an invalid FormControl validator\n- **FormGroup custom\
    \ validators**\n    - Writing the FormGroup validator\n    - Using the FormGroup\
    \ validator\n    - Informing the user of an invalid FormGroup validator\n- **FormArray\
    \ custom validators**\n    - Writing the FormArray validator\n    - Using the\
    \ FormArray validator\n    - Informing the user of an invalid FormArray validator\n\
    - **The structure of custom async validators**\n    - **FormControl custom async\
    \ validators**\n        - Writing the async validator\n        - Using the async\
    \ validator\n        - Informing the user of an invalid async validator\n\n##\
    \ Objective\n\nAfter reading this chapter, you will know how to create custom\
    \ (sync or async) validators for **FormControl**, **FormGroup**, and **FormArray**.\
    \ This knowledge offers excellent flexibility for enterprise applications and\
    \ covers almost all the validation rules we might face.\n\n## The structure of\
    \ custom validators\n\nEither creating a validator for **FormControl**, **FormGroup**,\
    \ or **FormArray**, the structure is the same and pretty straightforward.\n\n\
    In *figure 4.1*, we see the parts of the validator function. In a nutshell, the\
    \ validation rules are executed in an inner function wrapped in another function.\n\
