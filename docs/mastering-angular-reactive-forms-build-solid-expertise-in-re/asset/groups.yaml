    7: styleUrls: ['./app.component.scss'],\n8:})\n9: export class AppComponent implements\
    \ OnInit {\n10: myForm!: FormGroup\n11:\n12: ngOnInit(): void {\n13: this.myForm\
    \ = new FormGroup({\n14: basicInfo: new FormGroup({\n15: firstName: new FormControl(),\n\
    16: lastName: new FormControl(),\n17: email: new FormControl(),\n18: age: new\
