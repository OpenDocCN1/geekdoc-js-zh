    3 The pristine denotes that the form has not been changed by the user yet - https://angular.io/api/forms/AbstractControl#pristine.\n\
    \n# CHAPTER 3\n## Built-in Validators\n\n### Introduction\nIn the previous chapters,\
    \ we learned the fundamentals of building an Angular Reactive Form. To complement\
    \ what we have already learned, we need to establish a communication channel between\
    \ the UI and the end-user. It is vital to let the user know if the filled-in data\
    \ in the form fields are correct or not. In this chapter, we will learn how to\
    \ register built-in validators on the FormControl(s) and inform the user about\
    \ any erroneous data entry.\n\n### Structure\n- Why use validators?\n- The validity\
    \ in the controls\n- The built-in validators\n- FormControl validators\n- FormGroup\
    \ validators\n- Accessing a FormGroup's controls\n- FormArray validators\n- Accessing\
    \ a FormArray's controls\n- Using the AbstractControl properties in controls\n\
    - The updateOn option\n- The AbstractControl properties and the CSS\n\n### Objective\n\
    After reading this chapter, you will learn how to establish communication with\
    \ the end-user and maintain data integrity on the server by applying built-in\
    \ validators in the **FormControl** instances.\n\n## Why use validators?\nIf we\
    \ have to fill in a paper form with data, we might wonder whether we need to fill\
    \ all the fields or not. If it's possible, we will ask for help. If not, we will\
    \ submit the paper form to the corresponding physical office, and we will wait\
    \ for confirmation. Maybe they will ask us to fill some fields that we deliberately\
    \ left empty, or they might ask us not to write more than a specific amount of\
    \ letters in certain fields.\n\nOf course, this shouldn't be the case in the digital\
    \ era, as we can immediately respond to the end-users.\n\nWith validations, we\
    \ can:\n- Establish communication with the end-user\n- Ensure data integrity on\
    \ the server\n\nThese two are interconnected. We communicate with the users to\
    \ inform them about the form's \"*rules*\". Since the users conform to the rules,\
    \ we will have correct data in the server, hence data integrity.\n\n## The validity\
    \ in the controls\nIn *Chapter 1: Getting started with Reactive Forms*, we mentioned\
    \ that the **AbstractControl** calculates the value and validity. To be more specific:\n\
    - The **FormControl** handles the value and validity of an element.\n- The **FormGroup**\
    \ handles the value and validity of a set of **AbstractControl** instances.\n\
    - The **FormArray** handles the value and validity of an array of **AbstractControl**\
    \ instances.\n\nThe validity depicts if **AbstractControl** is valid or not, and\
    \ this value is available via the property `.valid`. In *figure 3.1*, we see some\
    \ fields. The \"Name\" field is required, and the validity of the bound **FormControl**\
    \ is false (`valid=false`). If we type any character on the field, the validity\
    \ will switch from `valid=false` to `valid=true`. By default, the validity is\
    \ re-calculated on every keystroke.\n\nFigure 3.1: Form with validation error\
    \ messages\n\nThe **AbstractControl** instances have properties that are handy\
    \ during validation. The following table describes these properties:\n\n| Property\
    \ | Type | Description |\n| :--- | :--- | :--- |\n| VALIDITY | valid | Boolean.\
    \ A control is valid if it satisfies all the validation rules. |\n| | invalid\
    \ | Boolean. A control is invalid if it doesn't satisfy all the validation rules.\
    \ |\n| VISITED | touched | Boolean. A control is marked as touched when the user\
    \ triggers a blur event. This is not a reversible value. As it is touched, it\
    \ cannot revert. |\n| | untouched | boolean. The untouched is the default state\
    \ of a control. This is not a reversible value. As it is set to false, it cannot\
    \ revert. |\n| VALUE | pristine | boolean. A control is pristine if the user has\
    \ not yet changed the value. This is not a reversible value. As it is set to false,\
    \ it cannot revert. |\n| | dirty | boolean | A control is dirty if the user has\
    \ changed the value. This is not a reversible value. As it is marked as dirty,\
    \ it cannot revert. |\n\nTable 3.1\n\n## The built-in validators\nAccording to\
    \ business rules, an HTML form might have restrictions on each form field. Some\
    \ fields might be required, while others might have different rules. For example,\
    \ a user might mistype an email or leave a required field empty. In HTML development,\
    \ these restrictions are called validations. In the following table, we see a\
    \ list of built-in validators and their meaning:\n\n| Validator | Is valid if\
    \ |\n| :--- | :--- |\n| min(min: number) | The value >= provided number |\n| max(max:\
    \ number) | The value <= provided number |\n| required() | The value is not empty\
    \ |\n| requiredTrue() | The value is True |\n| email() | The value is a valid\
    \ email pattern |\n| minLength(minLength: number) | The value’s length >= provided\
    \ length |\n| maxLength(maxLength: number) | The value’s length <= provided minimum\
    \ |\n| pattern(pattern: string) | The value matches a regex pattern |\n\nTable\
    \ 3.2\n\n## FormControl Validators\nThe **FormControl** class accepts two arguments,\
    \ and as we have already learned, the first argument is the control's default\
    \ state. The second argument accepts a single or an array of validators. Please\
    \ note that the second argument applies both in **FormControl** classes or the\
    \ **FormBuilder** syntactic sugar.\n\nIn the following code, we see how to set\
    \ validators on **FormControl** instances:\n\ncomponent.ts code (with FormControl\
    \ classes)\n```typescript\nimport {Component} from '@angular/core'\nimport {FormControl,\
    \ Validators} from '@angular/forms'\n\n@Component({\n  selector: 'app-root',\n\
    \  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss'],\n\
    })\nexport class AppComponent {\n  firstName = new FormControl('', Validators.required)\n\
    \  lastName = new FormControl('', [\n    Validators.required,\n    Validators.minLength(3),\n\
    \  ])\n}\n```\n\nIn line 2, we import the Validators, and in lines 10 and 11,\
    \ we register validators for the \"firstName\" and \"lastName\" form fields. Please\
    \ note that the second argument of the \"lastName\" field is an array with more\
    \ than one validator. As we said, it's valid to set either a single or an array\
    \ of validators.\n\nIn the following code, we see the same example as before,\
    \ but using the **FormBuilder** syntactic sugar:\n\ncomponent.ts code (with FormBuilder)\n\
    ```typescript\nimport {Component} from '@angular/core'\nimport {FormBuilder, Validators}\
    \ from '@angular/forms'\n\n@Component({\n  selector: 'app-root',\n  templateUrl:\
    \ './app.component.html',\n  styleUrls: ['./app.component.scss'],\n})\nexport\
    \ class AppComponent {\n  firstName = this.fb.control('', Validators.required)\n\
    \  lastName = this.fb.control('', [\n    Validators.required,\n    Validators.minLength(3),\n\
    \  ])\n\n  constructor(private fb: FormBuilder) {}\n}\n```\n"
  mdcn: "\n\n**A.** 在 HTML 表单中，我们经常会在表单无效、处于 pristine（初始）³状态或任何符合应用需求的其他状态组合时禁用按钮。我们使用\
    \ [disable] 属性绑定来禁用它。\n\n¹1 有关 Angular 绑定的更多信息，请访问 https://angular.io/guide/binding-syntax。\n\
    2 类型强制转换（Type coercion）是将一种数据类型转换为另一种数据类型的过程 https://developer.mozilla.org/en-US/docs/Glossary/Type_coercion\n\
    3 pristine 表示表单尚未被用户修改 - https://angular.io/api/forms/AbstractControl#pristine。\n\
    \n# 第 3 章\n## 内置验证器\n\n### 简介\n在之前的章节中，我们学习了构建 Angular 响应式表单（Reactive Form）的基础。为了补充已学知识，我们需要在\
    \ UI 和终端用户之间建立通信通道。让用户知道表单字段中填写的数据是否正确至关重要。在本章中，我们将学习如何在 `FormControl(s)` 上注册内置验证器，并告知用户任何错误的数据输入。\n\
    \n### 结构\n- 为什么要使用验证器？\n- 控件中的有效性\n- 内置验证器\n- FormControl 验证器\n- FormGroup 验证器\n\
    - 访问 FormGroup 的控件\n- FormArray 验证器\n- 访问 FormArray 的控件\n- 在控件中使用 AbstractControl\
    \ 属性\n- updateOn 选项\n- AbstractControl 属性与 CSS\n\n### 目标\n读完本章后，你将学习如何通过在 **FormControl**\
    \ 实例中应用内置验证器，与终端用户建立通信并并在服务器端维护数据完整性。\n\n## 为什么要使用验证器？\n如果我们必须在纸质表单上填写数据，我们可能会疑惑是否需要填写所有字段。如果可能，我们会寻求帮助；如果不可，我们将把纸质表单提交给相应的实体办公室，并等待确认。他们可能会要求我们填写某些特意留空的字段，或者可能要求我们在某些字段中编写的字符数量不要超过特定限制。\n\
    \n当然，在数字时代这种情况不应该发生，因为我们可以立即对终端用户做出响应。\n\n通过验证，我们可以：\n- 与终端用户建立通信\n- 确保服务器端的数据完整性\n\
    \n这两者是互相关联的。我们与用户通信以告知他们表单的“*规则*”。由于用户遵守规则，我们在服务器上将拥有正确的数据，从而保证数据完整性。\n\n## 控件中的有效性\n\
    在*第 1 章：响应式表单入门*中，我们提到 **AbstractControl** 会计算值和有效性。具体来说：\n- **FormControl** 处理单个元素的值和有效性。\n\
    - **FormGroup** 处理一组 **AbstractControl** 实例的值和有效性。\n- **FormArray** 处理一个 **AbstractControl**\
    \ 实例数组的值和有效性。\n\n有效性（validity）描述 **AbstractControl** 是否有效，该值可以通过 `.valid` 属性获取。在图\
    \ 3.1 中，我们看到了一些字段。“Name”字段是必填的，绑定的 **FormControl** 的有效性为 `false` (`valid=false`)。如果我们在字段上输入任何字符，有效性将从\
    \ `valid=false` 切换到 `valid=true`。默认情况下，有效性会在每次击键时重新计算。\n\n图 3.1：带有验证错误消息的表单\n\n\
    **AbstractControl** 实例拥有在验证过程中非常有用的属性。下表描述了这些属性：\n\n| 属性 | 类型 |  |\n| :--- | :---\
    \ | :--- |\n| VALIDITY | valid | 布尔。如果控件满足所有验证规则，则为有效。 |\n| | invalid | 布尔。如果控件不满足所有验证规则，则为无效。\
    \ |\n| VISITED | touched | 布尔。当用户触发失去事件时，控件被标记为已触碰（touched）。这是一个不可逆的值。一旦被触碰，就无法恢复。\
    \ |\n| | untouched | 布尔。未触碰（untouched）是控件的默认状态。这是一个不可逆的值。一旦被设置为 false，就无法恢复。 |\n\
    | VALUE | pristine | 布尔。如果用户尚未更改值，则控件为初始状态（pristine）。这是一个不可逆的值。一旦被设置为 false，就无法恢复。\
    \ |\n| | dirty | 布尔 | 如果用户更改了值，则控件为已脏（dirty）。这是一个不可逆的值。一旦被标记为脏，就无法恢复。 |\n\n表 3.1\n\
    \n## 内置验证器\n根据业务规则，HTML 表单可能对每个表单字段有限制。某些字段可能是必填的，而另一些字段可能有不同的规则。例如，用户可能会误输电子邮件地址或留空某个必填字段。在\
    \ HTML 开发中，这些限制被称为验证。在下表中，我们看到了内置验证器的列表及其含义：\n\n| 验证器 | 满足条件时有效 |\n| :--- | :---\
    \ |\n| min(min: number) | 值 >= 提供的数字 |\n| max(max: number) | 值 <= 提供的数字 |\n| required()\
    \ | 值不空 |\n| requiredTrue() | 值为 True |\n| email() | 值是有效的电子邮件格式 |\n| minLength(minLength:\
    \ number) | 值的长度 >= 提供的长度 |\n| maxLength(maxLength: number) | 值的长度 <= 提供的最小长度\
    \ |\n| pattern(pattern: string) | 值匹配正则表达式模式 |\n\n表 3.2\n\n## FormControl 验证器\n\
    **FormControl** 类接受两个参数，正如我们已经学过的，第一个参数是控件的默认状态。第二个参数接受单个验证或验证器数组。请注意，第二个参数在 **FormControl**\
    \ 类或 **FormBuilder** 语法糖中均适用。\n\n在下面的代码中，我们看到了如何在 **FormControl** 实例上设置验证器：\n\n\
    component.ts 代码 (使用 FormControl 类)\n```typescript\nimport {Component} from '@angular/core'\n\
    import {FormControl, Validators} from '@angular/forms'\n\n@Component({\n  selector:\
    \ 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.scss'],\n\
    })\nexport class AppComponent {\n  firstName = new FormControl('', Validators.required)\n\
    \  lastName = new FormControl('', [\n    Validators.required,\n    Validators.minLength(3),\n\
    \  ])\n}\n```\n\n在第 2 行中，我们导入了 Validators，在第 10 和 11 行中，我们为 \"firstName\" 和 \"\
    lastName\" 表单字段注册了验证器。请注意，“lastName”字段的第二个参数是一个包含多个验证器的数组。正如我们所说，设置单个验证器或验证器数组都是有效的。\n\
    \n在下面的代码中，我们看到了之前相同的示例，但使用了 **FormBuilder** 语法糖：\n\ncomponent.ts 代码 (使用 FormBuilder)\n\
    ```typescript\nimport {Component} from '@angular/core'\nimport {FormBuilder, Validators}\
    \ from '@angular/forms'\n\n@Component({\n  selector: 'app-root',\n  templateUrl:\
    \ './app.component.html',\n  styleUrls: ['./app.component.scss'],\n})\nexport\
    \ class AppComponent {\n  firstName = this.fb.control('', Validators.required)\n\
    \  lastName = this.fb.control('', [\n    Validators.required,\n    Validators.minLength(3),\n\
    \  ])\n\n  constructor(private fb: FormBuilder) {}\n}\n```\n\n"
