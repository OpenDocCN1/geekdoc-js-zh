- md: "\n**With FormBuilder**\n\n```javascript\n1: this.myForm = this.fb.group({\n\
    2: firstName: [],\n3: lastName: [],\n4:})\n```\n\n### FormArray with FormControl\n\
    \nHere, we see a Form Model using **FormGroup**, **FormControl**(s), and **FormArray**\
    \ classes and how it looks with the **FormBuilder** syntax.\n\n**With classes**\n\
    \n```javascript\n1: this.myForm = new FormGroup({\n2: firstName: new FormControl(),\n\
    3: lastName: new FormControl(),\n4: colors: new FormArray([\n5: new FormControl('Red'),\n\
    6: new FormControl('Green'),\n7: new FormControl('Blue'),\n8: ]),\n9:})\n```\n\
    \n**With FormBuilder**\n\n```javascript\n1: this.myForm = this.fb.group({\n2:\
    \ firstName: [],\n3: lastName: [],\n4: colors: this.fb.array([\n5: ['Red'],\n\
    6: ['Green'],\n7: ['Blue'],\n8: ]),\n9:})\n```\n\n**Note:** The value that we\
    \ set in the array brackets (for example, ['Red']) is the default value of the\
    \ FormControl.\n\n### FormArray with FormGroup\n\nHere, we see a Form Model using\
    \ **FormGroup**, **FormControl**(s), and **FormArray** of **FormGroup**(s) classes\
    \ and how it looks with the **FormBuilder** syntax.\n\n**With classes**\n\n```javascript\n\
    1: this.myForm = new FormGroup({\n2: firstName: new FormControl(),\n3: lastName:\
    \ new FormControl(),\n4: colors: new FormArray([\n5: new FormGroup({name: new\
    \ FormControl('Red')}),\n6: new FormGroup({name: new FormControl('Green')}),\n\
    7: new FormGroup({name: new FormControl('Blue')}),\n8: ]),\n9:})\n```\n\n**With\
    \ FormBuilder**\n\n```javascript\n1: this.myForm = this.fb.group({\n2: firstName:\
    \ [],\n3: lastName: [],\n4: colors: this.fb.array([\n5: this.fb.group({name: ['Red']}),\n\
    6: this.fb.group({name: ['Green']}),\n7: this.fb.group({name: ['Blue']}),\n8:\
    \ ]),\n9:})\n```\n\n### Conclusion\n\nIn this chapter, we covered all the Reactive\
    \ Forms fundamentals. We learned how to construct a form, either with a single\
    \ form element, or multiple form elements, by grouping them or added them in arrays.\
    \ All those variations are the basic tools that we need to start crafting our\
    \ forms. It's an excellent basis on which we will build upon to master Reactive\
    \ Forms.\n\n### Key terms\n\n- **FormControl**: A class that handles the value\
    \ and validity of each form element.\n- **formControlName**: A directive selects\
    \ **FormControl** from **FormGroup** and applies a binding with a form element.\n\
    - **[formControl]**: A directive that binds a **FormControl** instance with a\
    \ form element.\n- **FormArray**: A class that handles the value and validity\
    \ of an array of **AbstractControl** items.\n- **FormGroup**: A class that handles\
    \ the value and validity of a set of **FormControl**, **FormArray**, or nested\
    \ **FormGroup** instances.\n- **FormGroupName**: A directive that selects by name\
    \ a nested **FormGroup** from a parent **FormGroup** and applies a binding with\
    \ a DOM element.\n- **FormArrayName**: A directive that selects by name a nested\
    \ **FormArray** from a parent **FormGroup** and applies a binding with a DOM element.\n\
    - **[formGroup]**: a directive that binds **FormGroup** with a DOM element.\n\
    - **Form model**: A model created by **AbstractControl** classes that represents\
    \ the structure of the HTML form.\n- **FormBuilder**: Provides syntactic sugar\
    \ for the **FormControl**, **FormArray**, and **FormGroup** classes.\n- **AbstractControl**:\
    \ The base class of the **FormControl**, **FormArray**, and **FormGroup** classes.\n\
    \n### Questions\n\n**Q 1. Can I use the [formGroup] directive in any other HTML\
    \ element except <form>?**\n\n**A.** Yes, we can use the [formGroup] directive\
    \ with any HTML element. It's typical to start with a **<form>** since this is\
    \ the HTML standard to collect the data a user enters.\n\n**Q 2. Is it OK not\
    \ to use the FormBuilder syntactic sugar?**\n\n**A.** The FormBuilder is not mandatory,\
    \ and we can avoid it if we prefer the traditional, let's say, way of defining\
    \ Reactive Forms. It's preferable to use **FormBuilder** in complex forms to avoid\
    \ cluttered code, but this is subjective.\n\n**Q 3. I prefer to use FormControl\
    \ instances for each HTML form element. Is it OK, or should I go with FormGroup?**\n\
    \n**A.** It's up to the developer which methodology to follow. It is encouraged\
    \ to use in this situation the **FormGroup** as it offers the required functionality\
    \ to map all the fields in one object.\n\n---\n\n1 The Separation of Concerns\
    \ is a design principle for separating an application into distinct sections -\
    \ https://en.wikipedia.org/wiki/Separation_of_concerns.\n2 The Single Page Application\
    \ (SPA) is a web application that interacts with the browser by dynamically re-rendering\
    \ the current web page with new data from the web server - https://en.wikipedia.org/wiki/Single-page_application.\n\
    3 A Feature Module is used for organizational reasons and encapsulates functionality\
    \ for a specific part of our application - https://angular.io/guide/feature-modules.\n\
    4 The DOM is a hierarchical object representation of the HTML page - https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model/Introduction.\n\
    \n## CHAPTER 2\n## HTML Form Binding\n\n### Introduction\n\nIn the previous chapter,\
    \ we learned how to construct an HTML form using **FormControl, FormGroup**, and\
