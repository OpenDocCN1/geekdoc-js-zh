    Both assessors will return the same result, "*bar*."


    Similarly, a **formGroup** is a JavaScript Object in which the properties


    are accessed in the same way.


    See the following **FormGroup**:


    1: this.myForm = new FormGroup({


    2: **firstName: new FormControl(),**


    3:})


    and HTML:


    1: <form **[formGroup]="myForm">**


    2:


    3: <input type="text"


    4: placeholder="First Name"


    5: **formControlName="firstName" />**


    6:


    7: </form>


    The **formControlName** will request the **FormControl** instance with the


    name "**firstName**" from FormGroup.


    The mechanism behind this is that the **formControlName** directive will


    check the DOM ancestors to find the closest **formGroup** directive. In


    the preceding example, the closest **formGroup** is **myForm**, and the


    **formControlName** is **firstName**. Hence, we have the property accessor


    "**myForm.firstName**".


    **Nested FormGroup**


    Often enterprise applications have complex forms with advanced


    validations. In these cases, the end-users must be notified of the


    form''s validity state (see *Chapter 3: Built-in Validations*, for more).


    It''s easier to manage the data and the validity state if we split the


    form into smaller chunks.'
