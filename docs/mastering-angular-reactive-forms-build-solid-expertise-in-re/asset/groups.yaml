    **Built-in Validators**


    **Introduction**


    In the previous chapters, we learned the fundamentals of building an


    Angular Reactive Form. To complement what we have already


    learned, we need to establish a communication channel between the


    UI and the end-user. It is vital to let the user know if the filled-in data


    in the form fields are correct or not. In this chapter, we will learn how


    to register built-in validators on the FormControl(s) and inform the


    user about any erroneous data entry.


    **Structure**


    Why use validators?


    The validity in the controls


