  md: '**Preface**


    The Angular Framework has two ways for building HTML forms, the


    template driven forms and reactive forms. The latter, since they are


    based on a model, are also called model-driven forms.


    Comparing these two, we can say that there is a shift of


    responsibility from the HTML template to the source code. For


    example, while the unit tests and validations are applied in the HTML


    in template driven forms, they are applied in the source code


    (typescript) in reactive forms. In reactive forms, the source code


    plays a significant role and offers great flexibility.


    Angular forms are a communication channel between the user and


    system. We collect data through forms, and in most cases, provide


    these data in a server using an API. Data is a valuable asset that


    should be accurate. Thus, working with angular reactive forms is


    advantageous as we have all the needed tools to reassure data


    integrity.


    The book follows the Angular 12 latest changes and is based on


    Typescript''s Strict flag.


    *The book consists of seven chapters in which the reader will learn*


    *the following:*


    **Chapter 1:** In this chapter, we will learn what reactive forms are and


    why we should master them. We will also learn in-depth the details


    of all the building blocks of reactive forms.


    **Chapter 2:** Binding with HTML elements is easy, but things might be


    complex enough in certain cases. In this chapter, we will learn how


    to apply a binding with all the HTML elements.


    **Chapter 3:** The validations are a core feature as they act as a


    communication channel between the system and the user. In this


    chapter, we will learn the built-in validators.


    **Chapter 4:** Often, the built-in validators in complex forms are not


    enough for the business scenarios. In this chapter, we will learn how'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'to create custom validators.


    **Chapter 5:** In this chapter, we will learn how to interact with user


    data and create dynamic validators.


    **Chapter 6:** Unit tests are vital for the quality and robustness of an


    application. The reactive forms offer a great way to write your unit


    tests.


    **Chapter 7:** How should we handle a big angular form? How can we


    split it into various components? Furthermore, how can we re-use a


    particular component form more than once? In this chapter, we will


    learn how to achieve all of these and dive deeper into angular


    reactive forms.'
