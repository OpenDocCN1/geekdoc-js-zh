  md: 'templating


    form model


    unit tests


    validations


    By "**templating**," we mean the actual form the end-user sees in the


    browser.


    By "**form model**," we mean the model we create to apply a binding


    with the HTML template. Since this is an interesting topic, a separate


    section has been added at the end of this chapter.


    The "**unit tests**" should be a developer''s best friend. We are familiar


    with unit testing the business code in the Angular Services with


    Karma/Jasmine, Jest, or any other library. With Reactive Forms, we


    can test our forms without referring to the HTML but testing only the


    source code (**component.ts**).


    The "**validations**" can become complicated. An example would be:


    "*An input element should have a minimum of three letters and a*


    *maximum of ten letters; it should contain at least one special*


    *character, and this validation should exist if another field has a*


    *certain value.*" Oh boy! Well, if we have the right tools, this is just a


    simple challenge to accomplish. And yes, with Reactive Forms, the


    validations can be fun.


    **Understanding the Building Blocks**


    There are three Building Blocks of the Reactive Form, and each one


    is responsible for handling the value and the validity. It''s important to


    understand that we either set the value from the component.ts code


    or the value is set while the end-user types in the HTML form fields.


    It''s OK not to understand this fully, but we will soon learn what value


    and validity mean.


    The **FormControl** is a class that we map with the individual


    HTML input element


    The **FormGroup** is a group of individual **FormControl** instances'
