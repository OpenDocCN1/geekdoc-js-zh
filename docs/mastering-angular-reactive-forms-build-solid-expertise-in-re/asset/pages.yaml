  md: '**Tip:** The FormGroupDirective has no limitations on the usage of


    the validators. We can use any validator we wish (built-in,


    custom, or async).


    We can also set dynamic validators on a "component A" based


    on a "component B" value.


    In cases like this, it''s highly encouraged to apply the dynamic


    validators on the parent component.


    **The ControlValueAccessor**


    We know how to use the **formControlName** directive, and as we have


    learned, it bounds a native HTML form control with a respective


    Angular **FormControl**. It is even legit to say that the **formControlName**


    directive synchronizes the values of a native HTML form control with


    an Angular''s **FormControl**.


    This synchronization requires a set of actions that Angular handles


    with the **ControlValuAccessor** interface.


    **Note:** The ControlValueAccessor interface integrates a custom


    control with Angular Forms. That said, these custom controls


    work even with Template Driven Forms.


    In the following table, we see some of the interface implementations


    that already exist in Angular:


    **Class Name**


    **Selector**


    CheckboxControlValue Accessor


    input[type=checkbox][formControlName]


    DefaultValueAccessor


    input:not([type=checkbox])


    [formControlName]


    textarea[formControlName]


    RadioControlValueAccessor


    input[type=radio][formControlName]


    SelectControlValueAccessor


    select:not([multiple])


    [formControlName]


    NumberValueAccessor


    input[type=number][formControlName]


    ***Table 7.1***'
