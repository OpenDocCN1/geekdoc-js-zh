    **What is an HTML binding?**


    Modern applications have a mechanism that synchronizes the source


    (**component.ts**) with the template (**component.html**). The communication


    between the source and the template can either be unidirectional or bi-


    directional.


    **Unidirectional** means that the source will inject data into the template.


    It is a one-way binding.


    It is out of this book''s context to deeply explain how the binding¹ in


    Angular works on all the aspects, but a quick reference on them will


    help us build a better flow:


