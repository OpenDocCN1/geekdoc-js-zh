  md: 'At the beginning of this chapter, we saw the statement, "*By default,*


    *the validity is re-calculated on every keystroke*." This means that


    when a user interacts with the HTML input elements, even a single


    keystroke, triggers the execution of the validator function. The result


    of the validator execution is to change the control''s validity (**.valid**,


    **.invalid**).


    If there is a default strategy, often, an alternative also exists.


    Updating the control on every keystroke is beneficial, but sometimes


    we need to prevent updating the control so often. We can achieve


    this by using the **updateOn** property.


    The **updateOn** property is part of **AbstractControlOptions**.


    1: export declare interface AbstractControlOptions {


    2: validators?: ValidatorFn | ValidatorFn[] | null;


    3: updateOn?: ''change'' | ''blur'' | ''submit'';


    4:}


    The following list describes the **updateOn** options:


    **change**: This is the default option and updates the state of the


    control on every keystroke


    **blur**: Updates the state of the control on the blur event of the


    HTML input fields


    **submit**: Updates the state of the control on the submit event of


    the HTML form


    Let''s see how to use **updateOn**:


    In a **FormControl**:


    **component.ts code**


    1: lastName = this.fb.control(null, {


    2: validators: [Validators.required,


    Validators.minLength(3)],


    3: updateOn: ''blur'',


    4:})'
