  md: 'In


    the


    following


    code,


    we


    see


    the


    signature


    of


    the


    **ControlValueAccessor** interface:


    **ControlValueAccessor interface**


    1: export declare interface ControlValueAccessor {


    2: writeValue(obj: any): void;


    3: registerOnChange(fn: any): void;


    4: registerOnTouched(fn: any): void;


    5: setDisabledState?(isDisabled: boolean): void;


    6:}


    Let''s see what each method is responsible for:


    **writeValue**


    We use this method to write a value from the **FormControl**


    instance to the native HTML control.


    **registerOnChange**


    We use this method to propagate a value from the native HTML


    control to **FormControl**.


    The change event triggers this method.


    **registerOnTouched**


    We use this method to propagate the touched state from the


    native HTML control to **FormControl**.


    The blur event triggers this method.


    **setDisabledState**


    We use this method to provide the "*enable*" or "*disable*" state


    from the **FormControl** native HTML control.


    **Creating a custom control with**


    **ControlValueAccessor**


    Before we dive deeper and learn how to use **ControlValueAccessor**


    to reuse HTML Form Models, let''s start small and learn how to use


    the interface by creating a custom control.


    The enterprise applications often have their UI libraries, which either


    have custom controls or configured third party controls.'
