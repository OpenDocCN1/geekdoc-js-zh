    **lastNameControl.setValue(''Doe'')**


    3\. We can use the method **patchValue(value:any)**, as we see in


    line 4 of the **AbstractControl** class.


    **Example:**


    **lastNameControl.patchValue(''Doe'')**


    To get a value from **FormControl**, we use the property **.value**.


