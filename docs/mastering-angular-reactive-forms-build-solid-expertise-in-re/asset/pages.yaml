  md: '**C****HAPTER** **7**


    **Split and Reuse a Form**


    **Introduction**


    With Reactive Forms, we can build from small to big and complex


    HTML forms. The latter might become hard to maintain either on the


    source code (component.ts) or on the HTML template, especially if


    we have many validation conditions or we reuse a Form Model


    across the application. To increase the code maintainability and


    improve our application architecture, we will use **FormGroupDirective**


    to split a big form. We will use **ControlValueAcessor** to reuse a Form


    Model.


    **Structure**


    The FormGroupDirective


    Splitting the form using FormGroupDirective


    The ControlValueAccessor


    Creating a custom control with ControlValueAccessor


    Reusing Form Model with ControlValueAccessor


    **Objective**


    Not only is it a bad practice to have components that do more than


    one thing, but it''s also tough to maintain them. One solution to this


    problem would be splitting the code into smaller components and


    creating a master component to handle the orchestration.


    There are also business needs that require reusing form models


    across the application.


    In this chapter, we will learn how to handle a complicated HTML form


    using a parent-child structure and how to reuse a form model.'
