    **Conclusion**


    We learned how to use the **AbstractControl** properties and how


    useful they are. We can set various conditions to capture different


    business and use cases. We also learned that we could achieve


    data integrity on the server with validations, and we are establishing


    communication with the end-user. In the next chapter, we will


    continue exploring the validators; we will learn how to construct


    custom validators for more advanced use cases.


    **Key terms**


    **Valid**: A Boolean property that denotes if the control''s validators


    are satisfied.


    **Invalid**: A Boolean property that indicates if at least one


    control''s validator is not satisfied.


    **Touched**: A Boolean property that indicates if a user-triggered a


    blur event.


    **Untouched**: The default state of a control. A Boolean property


    indicates that the user did not trigger a blur event.


    **Pristine**: A Boolean property that indicates that the user didn''t


    yet change the control''s data.


    **Dirty**: A Boolean property that indicates that the user changed


    the control''s data.


    **Validators**: Functions that perform validation to **FormControl**,


    **FormGroup**, or **FormArray**.'
