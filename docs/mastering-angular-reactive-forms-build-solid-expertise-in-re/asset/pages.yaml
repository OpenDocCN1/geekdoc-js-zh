    **The FormControl class**


    Since we have covered the basics of **FormControl** and how we can


    use it, let''s dive a bit deeper and see its class. The **FormControl** class


    extends the **AbstractControl** class, which provides us with methods


    and properties to interact with the control''s value and validity. We


    use the **FormControl** class to create new control instances.


    **AbstractControl class**


    1: class FormControl extends AbstractControl {


    2: constructor(formState: any = null)


    3: setValue(value: any): void


    4: patchValue(value: any): void


    5: value: any


    6:}


    The following figure shows how to set a value in **FormControl**, depict


    this value in the HTML element, and how the binding works:


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_26_0.png)


    ***Figure 1.3:*** *FormControl lifecycle*


    To set a value in **FormControl**, we have the following options:


    1\. We can use the constructor, as we see in line 2 of the


    **AbstractControl** class.


    **Example:**'
  merge: -1
