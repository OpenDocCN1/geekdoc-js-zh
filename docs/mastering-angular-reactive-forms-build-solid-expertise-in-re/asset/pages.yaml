  md: 'actual **FormControl** instances.


    At first, and since Angular is modular, we have to import the


    corresponding module in our **Single Page Application** (**SPA**)².


    **Note:** If a framework like Angular weren''t modular and had


    everything loaded upfront by default, this would mean extra


    compilation and Tree Shaking time**.**


    The corresponding module is **ReactiveFormsModule**, and we have to


    import it in every feature module³ we meant to use Reactive Forms.


    By importing this module, Angular injects the required functionality


    necessary to develop the forms. This functionality consists of several


    directives and various classes.


    Let''s see an example of how to import **ReactiveFormsModule** in a


    module:


    **module.ts code**


    1: import {NgModule} from ''@angular/core'';


    2: import {ReactiveFormsModule} from ''@angular/forms'';


    3: import {BrowserModule} from ''@angular/platform- browser'';


    4: import {AppComponent} from ''./app.component'';


    5:


    6: @NgModule({


    7: declarations: [


    8: AppComponent


    9: ],


    10: imports: [


    11: BrowserModule,


    12: **ReactiveFormsModule**


    13: ],


    14: bootstrap: [AppComponent]


    15:})


    16: export class AppModule {}


    In line 2, we import with an ES6 declaration **ReactiveFormsModule**


    from **@angular/forms**.'
