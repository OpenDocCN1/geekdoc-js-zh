- img_proc: true
  md: 'In the digital era we live in, applications tend to grow at a fast pace.


    The demands and market competition are high. Sometimes it is


    tough to deliver applications without critical bugs, but we must have


    the tools to minimize them.


    Testing the application before delivering is a part of **Software**


    **Development Life Cycle** (**SDLC**). Some companies have **Quality**


    **Assurance** (**QA**) departments that solely manual test the


    applications and give the green light for deployment.


    Developing a new feature on an existing application might cause


    some other features to malfunction. Since this is very common, we


    should re-test the application (regression testing) on every new


    feature development. Doing this manually is a very tedious, time-


    consuming, and error-prone process.


    While the application grows, the business requirements might


    change, and we need to follow them by adapting the code and doing


    the required refactorings. An application without tests is easy to


    break after a code refactor.


    Automating the regression testing process with unit tests saves time


    and money, increases the quality, and decreases the bugs.


    **The toolset**


    The unit testing in the web apps is very mature, and plenty of tools


    exist to help us do our job. The defaults in Angular are Karma and


    Jasmine''s combination, which we will also use in this chapter.


    **Understanding the Jasmine framework**


    **Jasmine** is a JavaScript testing framework that suggests


    **Behavioral Driven Development** (**BDD**) and provides us with an


    assertion and mocking library.


    With Jasmine, we can write the unit tests and run them manually in a


    browser. Any change in the unit tests or the application requires


    manually refreshing the browser to re-run the unit tests. Since this


    can become tiresome very soon, we use Karma!'
  merge: -1
  pgno: 147
- img_proc: true
  md: '**Note:** BDD is a way of writing tests in a more human-readable


    way so that non-technical people can read and understand.


    **Understanding the Karma runner**


    The **Karma** test runner tool complements the development


    experience by running the Jasmine tests on a selected browser. It


    also has a file watcher on the unit test files (***.spec.ts**), which is very


    handy, because it auto re-runs the unit tests on file changes.


    **How to conduct unit testing**


    When unit testing, we check if a part of a code meets the business


    requirements. To be aligned and strict with the terminology, we can


    even say that we *expect* a part of the code to meet the business


    requirements.


    Some tests refer to the same context, and it makes sense to group


    them logically. It''s also crucial that each test has at least one


    expectation like we see in the example of the simple test as follows:


    **Example code**


    1: describe(''Test example'', () => {


    2: it(''should be true'', () => {


    3: expect(true).toBeTrue()


    4: })


    5:})


    To group the unit tests, we use the keyword **describe** (line 1).


    We wrap the individual tests in the global **it()** function (line 2).


    Since each test should have at least one expectation, we added one


    in line 3, where we expect "*true to be true*." We write the


    expectations using the expect keyword, and we combine them with


    matchers¹. In this example, we use the matcher toBeTrue.


    **Learning the AAA pattern**


    We are very keen on learning new software patterns as they point us


    in the correct direction. In unit testing, the **Arrange, Act, and Assert**'
  merge: -1
  pgno: 148
- img_proc: true
  md: '(**AAA**) pattern tends to become the de-facto.


    **Arrange**


    In the Arrange step, we initialize the component or variables, and we


    stub/mock services.


    The general rule is to do any preparations for the testable code.


    **Act**


    In the Act step, we call a method or trigger an event that we intend to


    test.


    **Assert**


    In the Assert step, we make sure that the given result of the "*Act*" is


    what we expect.


    Each step is a logical separation of the code and helps us keep a


    clean and consistent code. In the following code, we see a simple


    example using the AAA pattern:


    **Example code**


    1: it(''should return true'', () => {


    2: // Arrange


    3: const fixture = TestBed. createComponent(AppComponent)


    4: const app = fixture.componentInstance


    5: const expectedValue = true


    6: let returnedValue: boolean


    7:


    8: // Act


    9: returnedValue = app.getTrue()


    10:


    11: // Assert


    12: expect(returnedValue).toBe(expectedValue)


    13:})


    In the *Arrange* block, we create the component using the TestBed,


    we keep in a variable the component instance, and we also define


    the expected and returned value.'
