    **valid=false** to **valid=true**. By default, the validity is re-calculated on


    every keystroke.


    ![](img/cd4d52de62d8803dcbd3f6a0d08ee9db_81_0.png)


    ***Figure 3.1:*** *Form with validation error messages*


    The **AbstractControl** instances have properties that are handy


    during the validation. The following table describes in categories


    these properties:


    **Property**


    **Type**


    **Description**


    **VALIDITY**


    valid


    Boolean


    A control is **valid** if it satisfies all the


    validation rules.


    invalid


    Boolean


    A control is **invalid** if it doesn''t


    satisfy all the validation rules.


    **VISITED**


    touched


    Boolean


    A control is marked as **touched**


    when the user triggers a blur event.


    (This is not a reversible value. As


    soon as it is marked **touched**, it


    cannot revert.)


    untouched


    boolean


    The **untouched** is the default state


    of a control.


    (This is not a reversible value. As


    soon as the **untouched** is set to


    false, it cannot revert.)'
