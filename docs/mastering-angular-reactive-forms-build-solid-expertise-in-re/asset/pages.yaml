    **Using Test Doubles**


    There are various test approaches, like unit tests, integration tests,


    e2e tests. When unit testing, we focus on an individual unit (method,


    property, and so on.). If this part of the code has dependencies or


    requires performing an HTTP call, we use a Test Double, which


    replaces the production implementation with a testing-related one.


    The unit tests should be deterministic, and we should avoid having


    side effects in the testable code. When we test a method that


    depends on data from an HTTP call, we should create a Test Double


    for this HTTP endpoint to return particular data that the test requires.'
