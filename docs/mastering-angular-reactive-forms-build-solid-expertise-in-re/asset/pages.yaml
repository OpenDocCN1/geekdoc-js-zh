    that


    synchronizes


    the


    source


    (**component.ts**) with the template (**component.html**)


    **ngValue**: Binds an object to the related **<option>** so that it


    becomes the selected object if the **<option>** selects


    **Falsy**: Values that are equivalent to a Boolean "*false*" value


    **Truthy**: Values that are equivalent to a Boolean "*true*" value


