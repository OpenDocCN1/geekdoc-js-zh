    Reactive-Forms. There is a perfect reason behind the name


    "*Reactive*," and it has to do with the form''s live reaction to the user''s


    actions. (We will cover this in *Chapter 5: Interact with control''s value*


    *and status*). In the Angular community, we can find Reactive-Forms


    with the name Model-Driven forms as well.


    When creating **FormGroup**, we should keep in mind the structure of


    the HTML form. Based on this structure, we develop the Form


    Model, which is no more than a root **FormGroup** with nested


    FormGroup(s), FormControl(s), and so on.


    It''s not a good practice to use the API data model in the HTML, and


    as such, we use the Form Model. In the following diagram, we


    transform Model - A to Model - B. This application structure ensures


    that any change on the backend will not dramatically affect our front-


    end application. The reason is that we always make sure to


    transform the models in the Mapper layer. The Model-B, in this


    example, is the Form-Model.


    **TIP:** The Mapper layer can be just a set of methods in a service


    responsible for the API requests and transformations**.**'
