    **Conclusion**


    In this chapter, we learned how to construct an HTML form with various


    HTML elements, such as radio buttons, a checkbox, and a select menu.


    We also learned different select menu cases and how to handle them.


    We built upon the fundamentals that we learned in the previous chapter,


    and we learned how to handle the rest HTML form elements, which is


    essential knowledge to start building our Angular Reactive Forms.


    In the next chapter, we will cover even more real-life cases by


    establishing communication between the UI and the end-user, learning


    how to use the built-in validators.


    **Key terms**


    **Binding**:


    A


