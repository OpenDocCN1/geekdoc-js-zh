  md: '**Key terms**


    F**ormControl**: A class that handles the value and validity of each


    form element.


    **formControlName**: A directive selects **FormControl** from **FormGroup**


    and applies a binding with a form element.


    [**formControl**]: A directive that binds a **FormControl** instance with


    a form element.


    **FormArray**: A class that handles the value and the validity of an


    array of **AbstractControl** items.


    **FormGroup**: A class that handles the value and the validity of a


    set of **FormControl**, **FormArray**, or nested **FormGroup** instances.


    **FormGroupName**: A directive that selects by name a nested


    **FormGroup** from a parent **FormGroup** and applies a binding with a


    DOM element.


    **FormArrayName**: A directive that selects by name a nested


    **FormArray** from a parent **FormGroup** and applies a binding with a


    DOM element.


    [**formGroup**]: A directive that binds **FormGroup** with a DOM


    element.


    Form model: A model created by **AbstractControl** classes that


    represents the structure of the HTML form.


    **FormBuilder**: Provides syntactic sugar for the **FormControl**,


    **FormArray**, and **FormGroup** classes.


    **AbstractControl**: The base class of the **FormControl**, **FormArray**,


    and **FormGroup** classes.


    **Questions**


    **Q 1\. Can I use the [****formGroup****] directive in any other HTML**


    **element except**  **<form>****?**


    **A.** Yes, we can use the [**formGroup**] directive with any HTML


    element. It''s typical to start with a **<form>** since this is the HTML


    standard to collect the data a user enters.


    **Q 2\. Is it OK not to use the**  **FormBuilder**  **syntactic sugar?**'
  merge: -1
  pgno: 53
- img_proc: true
  md: '**A.** The FormBuilder is not mandatory, and we can avoid it if we


    prefer the traditional, let''s say, way of defining Reactive Forms.


    It''s preferable to use **FormBuilder** in complex forms to avoid


    cluttered code, but this is subjective.


    **Q 3\. I prefer to use**  **FormControl**  **instances for each HTML form**


    **element. Is it OK, or should I go with**  **FormGroup****?**


    **A.** It''s up to the developer which methodology to follow. It is


    encouraged to use in this situation the **FormGroup** as it offers the


    required functionality to map all the fields in one object.


