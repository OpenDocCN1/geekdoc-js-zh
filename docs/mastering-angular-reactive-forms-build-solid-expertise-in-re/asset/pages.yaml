  md: 'This child component is a great exercise to try on your own by


    following the same approach with the Basic Info component. The


    steps to follow are:


    1\. Create a component and implement **ControlValueAccessor** and


    all its methods.


    2\. Define the form in the **ngOnInit** lifecycle hook.


    3\. Develop each method in a similar way we did in the Basic Info


    component.


    4\. Develop the HTML template.


    5\. Use the component''s selector in the User Registration Form


    component and bind it with the address **FormControl** instance


    using the **formControlName** directive.


    **Conclusion**


    When developing an application, it often starts small, and


    progressively its size is increasing. It is vital to have the correct tools


    and use them accordingly when needed.


    The fact that **FormGroupDirective** and **ControlValueAccessor** can


    solve the same problems doesn''t make them equivalent "tools".


    If, for example, we need to create a split HTML form where the


    validity of the "*component A*" depends on the values of the


    "*component B*," then it''s better to use **FormGroupDirective**.


    On the other hand, if we need to reuse an HTML form across the


    application, it''s better to use **ControlValueAccessor**.


    In this chapter, we learned two great features that will help us better


    organize our HTML forms!


    Additionally, we learned to utilize **ControlValueAccessor** and create


    custom form controls.


    **Key terms**


    **ControlValueAccessor**: This interface bridges the communication


    between Angular''s control and a native HTML control.'
