    ## Building Flappy Bird in Kaboom.js\n\n### Adding in the pipes\n\nNow we can\
    \ get to the main part of the game – adding in the moving pipes that Flappy needs\
    \ to fly through.\n\nHere is a diagram of the layout of the pipes in the game.\n\
    \n> *05https://docs.replit.com/images/35-flappy-bird/flappy-fly.gif\n\n## Building\
    \ Flappy Bird in Kaboom.js\n\n### Pipe gap\n\nWe want to move the pipe gap, and\
    \ therefore the pipes, up and down for each new pipe pair that is created. This\
    \ is so we don't have the gap at the center point of the screen constantly – we\
    \ want it to be slightly different for each pipe pair that comes along. We do\
    \ want to keep the gap size consistent though.\n\nLet's start by having the pipe\
    \ gap in the center of the screen. We'll give the pipe gap a size PIPE_GAP. To\
    \ place the pipes, the bottom of the upper pipe should be PIPE_GAP/2 pixels above\
    \ the center point of the window, which is height()/2. Likewise, the top of the\
    \ lower pipe should be PIPE_GAP/2 pixels below the center point of the window,\
    \ again which is height()/2.\n\nThis way, we place the pipe so that the pipe gap\
    \ is in the center of the window. Now we want to randomly move it up or down for\
    \ each new pair of pipes the way to do this is to create a random offset, which\
    \ we add to each new pipe to effectively move the midpoint of the window up or\
    \ down. We can use the Kaboom rand^496 function to do this. The rand^497 function\
    \ has two parameters to specify the range in which the random number should be.\n\
    \nLet's put that together. The Y-position of the lower pipe can be calculated\
    \ as:\n`height()/2 + offset + PIPE_GAP/2`\n\nRemember, the top of the window is\
    \ y=0, and the bottom is y=height(). In other words, the lower down on the screen\
    \ is the position, the higher y coordinate will be.\n\nFor the upper pipe, we\
    \ can calculate the point where the bottom of the pipe should be like this:\n\n\
    `height()/2 + offset - PIPE_GAP/2`\n\n* ^496https://kaboomjs.com/#rand\n* ^497https://kaboomjs.com/#rand\n\
    \n## Building Flappy Bird in Kaboom.js\n\nKaboom has an origin#8 component that\
    \ sets the point character uses as origin. This is top default, which works well\
    \ for our lower pipe, as our calculations above are calculating for that point.\
    \ For the upper pipe, our calculations are for the bottom of the pipe. Therefore,\
    \ we can use the origin#10 component to specify.\n\nSince we want the pipes to\
    \ come from the right of the screen towards the left, where Flappy is, we'll set\
    \ their X-position to be the width#9 of the screen.\n\nTo identify and query the\
    \ pipes, use the text tag \"pipe\" to them.\nFinally, since we need to create\
    \ many pipes during the game, let's wrap all the pipe code in a function that\
    \ we will be able to call at regular intervals to make the pipes.\n\nHere is the\
    \ code from all these considerations and calculations. Insert this code to the\
    \ game scene:\n\n```javascript\nconst PIPE_GAP = 120;\n\nfunction producePipes(){\n\
    \  const offset = rand(-50, 50);\n\n  add([\n    sprite(\"pipe\"),\n    pos(width(),\
    \ height()/2 + offset + PIPE_GAP/2),\n    \"pipe\",\n    area(),\n  ]);\n\n  add([\n\
    \    sprite(\"pipe\", {flipY: true}),\n    pos(width(), height()/2 + offset -\
    \ PIPE_GAP/2),\n    origin(\"botleft\"),\n    area(),\n  ]);\n}\n```\n\nNow we\
    \ need to do a few more things to make the pipes appear and move.\nMove the pipes\
    \ across the screen, we can use the onUpdate#11 function to update all pipes'\
    \ positions with each frame. Note that we need to adjust the x position of the\
    \ pipe. Add this code to the game scene of your code:\n\n* #8https://kaboomjs.com/origin\n\
    * #10https://kaboomjs.com/origin\n* #9https://kaboomjs.com/width\n* #11https://kaboomjs.com/onupdate\n\
    \n```javascript\nonUpdate(\"pipe\", (pipe) => {\n  pipe.move(-160, 0);\n});\n\
    ```\n\nNext we'll generate pipes at a steady rate. We can use the loop⁴¹² function\
    \ for this. Add the following to the game scene part of the code:\n\n```javascript\n\
    loop(1.5, () => {\n  producePipes();\n});\n```\n\nThis calls our producePipes()\
    \ function every 1.5 seconds. You can adjust this rate, or make it variable to\
    \ increase the rate as the game progresses.\n\nUpdate the game output now and\
    \ you should see the pipes being generated and moving across the screen. You can\
    \ also fly Flappy, although crashing into the pipes does nothing for now.\n\n\
