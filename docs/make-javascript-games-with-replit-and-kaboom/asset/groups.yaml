    - https://kaboomjs.com/doc/#rect\n- https://kaboomjs.com/doc/#wait\n\n![](img/e909780a5f974ff614ba5223d44aa19b_13_0.png)\n\
    \n静态蛇\n\n# 移动蛇\n\n现在我们已经有了地图边界并在屏幕上绘制了蛇，我们可以处理玩家输入并让蛇移动了。\n\nKaboom.js 有一个 `onKeyPress`¹⁷\
    \ 函数，每当按下键时它都会调用提供的函数。我们将用它来确定玩家想往哪个方向走。添加以下代码来获取用户输入：\n\n> ¹⁷https://kaboomjs.com/doc/#onKeyPress\n\
    \nonKeyPress(\"up\", () => {\n  if (current_direction != directions.DOWN) {\n\
    \    current_direction = directions.UP;\n  }\n});\n\nonKeyPress(\"down\", () =>\
    \ {\n  if (current_direction != directions.UP) {\n    current_direction = directions.DOWN;\n\
    \  }\n});\n\nonKeyPress(\"left\", () => {\n  if (current_direction != directions.RIGHT)\
    \ {\n    current_direction = directions.LEFT;\n  }\n});\n\nonKeyPress(\"right\"\
    , () => {\n  if (current_direction != directions.LEFT) {\n    current_direction\
    \ = directions.RIGHT;\n  }\n});\n\n对于每个名为“箭头”的键，我们都设置了一个在按下时调用的函数。在这些函数中，我们检查新输入的方向是否与当前移动的方向相反，因为我们不允许蛇直接反向。如果是合法的移动，我们就更新\
    \ `current_direction` 属性。\n\n现在我们需要思考如何让蛇看起来在移动。一种方法是在蛇的前方添加一个块，我们需要在蛇的尾部移除一个块。我们需要每隔几秒执行一次，以便蛇看起来在移动。Kaboom.js\
    \ 有一个 `onUpdate` 函数，可以在每帧更新对象。添加以下使用 `onUpdate` 函数的代码来移动蛇：\n\n# 在 Kaboom.js 中构建蛇\n\
    \n```\nlet move_delay = 0.2;\nlet timer = 0;\nonUpdate(() => {\n  if (run_action)\
    \ return;\n  timer += dt();\n  if (timer < move_delay) return;\n  timer = 0;\n\
    \n  let move_x = 0;\n  let move_y = 0;\n\n  switch (current_direction) {\n   \
    \ case directions.DOWN:\n      move_x = 0;\n      move_y = block_size;\n     \
    \ break;\n    case directions.UP:\n      move_x = 0;\n      move_y = -1 * block_size;\n\
    \      break;\n    case directions.LEFT:\n      move_x = -1 * block_size;\n  \
    \    move_y = 0;\n      break;\n    case directions.RIGHT:\n      move_x = block_size;\n\
    \      move_y = 0;\n      break;\n  }\n\n  // 获取最后一个元素（蛇头）\n  let snake_head =\
    \ snake_body[snake_body.length - 1];\n\n  snake_body.push(add(\n    rect(block_size,\
    \ block_size),\n    pos(snake_head.pos.x + move_x, snake_head.pos.y + move_y),\n\
    \    color(0,0,255),\n    area(),\n    \"snake\"\n  ));\n\n  if (snake_body.length\
    \ > snake_length) {\n    let tail = snake_body.shift(); // 移除尾部\n    destroy(tail);\n\
    \  }\n}));\n```\n\n我们将动作设置为每0.2秒运行一次以获得平滑移动。动作函数每帧更新游戏对象；我们使用 `dt()` 函数¹获取上一帧和当前帧之间的时间，以便我们可以追踪是否已经过了\
    \ 0.2 秒来移动蛇。如果还没有达到延迟，我们就提前退出不更新；否则，重置计时器并执行移动蛇的代码。你可以通过调整 `move_delay` 变量的值实验不同的时间来观察对游戏的影响。我们还会检查\
    \ `run_action` 标记；如果为 `false`，则提前退出不进行任何更新。然后，函数定义了相对于蛇头的局部变量 `move_x` 和 `move_y`。\n\
    \n函数根据蛇当前指向的方向值进行切换（switch）。对于每个方向，`move_x` 和 `move_y` 被设置为0或-1 `block_size`。如果蛇向左或向右移动，相应地在\
    \ x 维度上增加或减少一个块。如果蛇向上或向下移动，y 维度也会发生同样的情况。\n\n在切换之后，我们通过索引 `snake_body` 数组中的最后一个元素获取当前的蛇头。现在我们既有了当前的蛇头位置以及相对于蛇头移动的位置，就可以通过添加一个新的块游戏对象来创建新的蛇头。\n\
    \n现在剩下的就是使用内置数组 `shift`²移除蛇尾的块，它会从数组中移除第一个元素并返回该元素。由于蛇“最老”的部分（也称为尾）是第一个元素，我们从数组中将其移除，并使用\
    \ Kaboom.js 的 `destroy` 函数³移除该段。只有当 `snake_body` 数组的当前长度大于我们的蛇长度时，我们才这样做。这意味着如果我们增加了\
    \ `snake_length`，蛇的总长度也会随之增加。当我们向游戏中添加食物时可以使用这一点。\n\n现在运行项目并点击游戏屏幕，可以让你移动蛇。注意，目前还没有碰撞检测，蛇可以无后果地超出边界。\n\
    \n> ¹https://kaboomjs.com/doc/edt\n> ²https://developer.mozilla.org/en-US/docs/JavaScript/Global_Objects/Array/shift\n\
    \n> ³https://kaboomjs.com/doc/destroy\n\n"
