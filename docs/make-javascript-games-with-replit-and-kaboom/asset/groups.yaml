- md: "\n## Building tic-tac-toe with WebSocket and Kaboom\n\n![](img/e909780a5f974ff614ba5223d44aa19b_140_0.png)\n\
    \nYou can connect to your game in another browser tab, and enter another name.\
    \ Then you should see both names come up, and the status message change to allow\
    \ a player to make a move. Of course, we haven't yet implemented the code to enable\
    \ making a move from the UI, so let's do that now.\n\n## Handling player moves\n\
    \nWe want a player to be able to click on a block to place their move. Kaboom\
    \ has a function `onMouseRelease` that we can use to handle mouse click events.\
    \ All we need then is the position the cursor is at, and we can map that to one\
    \ of the board positions using `boardSquares` array to do the lookup. We'll use\
    \ the Kaboom function `mousePos` to get the coordinates of the mouse:\n\n[^279]https://kaboomjs.com/doc/#onMouseRelease\n\
    [280]https://kaboomjs.com/doc/#mousePos\n\n## Building tic-tac-toe with WebSocket\
    \ and Kaboom.js\n\n```javascript\nonMouseRelease(() => {\n  const mpos = mousePos();\n\
    \  // find the square we clicked on\n  for (let index = 0; index < boardSquares.length;\
    \ index++) {\n    const square = boardSquares[index];\n    if (mpos.x > square.x\n\
    \      && mpos.x < square.x + square.width\n      && mpos.y > square.y\n     \
    \ && mpos.y < square.y + square.height){\n        socket.emit(\"action\", {\n\
    \          gridindex: square.index\n        });\n        break;\n    }\n  }\n\
    });\n```\n\nIf we find a 'hit' on the board squares, we emit our action event.\
    \ We pass the index of the square that was clicked on the payload data. The server\
    \ listens for this event, and runs the logic we added for the action event on\
    \ the server side. If the action changes the game state, the server will send\
    \ back the new game state, and the UI elements update.\n\nThe only input we need\
    \ to implement is to check if the player wants a rematch. To do that, we'll assign\
    \ the r key as the rematch command. We can use the Kaboom function `charInput`\
    \ to listen for key press events. We'll check if the key is r, or R, then emit\
    \ the rematch event. We don't have any data to pass with that, so we'll just pass\
    \ null.\n\n```javascript\ncharInput((ch) => {\n  if (ch === 'r' || ch === 'R')\
    \ {\n    socket.emit(\"rematch\", null)\n  }\n});\n```\n\nNow you can run the\
    \ game (and the server), and the game in another tab, and you should be able to\
    \ play tic-tac-toe against yourself? Send a link to the game to a friend, and\
    \ see if they can join and play against you.\n\n> ²26https://kaboom.js/doc/#charInput\n\
    \n## Building tic-tac-toe with WebSocket and Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_142_0.png)\n\
    \n## Next Steps\n\nNow that you know the basics of creating a multiplayer online\
    \ game, try your hand at making some different games, like checkers or chess or\
    \ go.\n\nHappy coding!\n\nYou can find the code sample for this tutorial on [github^28](https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/5-tictactoe-with-websockets-kaboom.md)\
    \ or [replit^29](https://replit.com/@ritza/tic-tac-toe-new).\n\n> ^28https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/5-tictactoe-with-websockets-kaboom.md\n\
    ^29https://replit.com/@ritza/tic-tac-toe-new\n\n## Building a Mario-like side-scroller\
    \ with Kaboom.js\n\nThe Mario series is one of the most known and loved game series\
    \ of all time. The first Mario game was released by Nintendo in the mid-80s, and\
    \ people haven't stopped playing Mario since.\n\nTons of games still use the basic\
    \ side-scroller formula of Mario, so it's a good game to build to learn the basics\
    \ of game making. We'll build it in the new Kaboom^284 game engine. Kaboom has\
    \ many useful functions for building platform games, and we'll try to go through\
    \ as many as we can in this tutorial.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_143_0.png)\n\
    \nThe finished game\n\nClick to open gif^285\n\n^284https://kaboomjs.com\n^285https://docs.replit.com/images/tutorials/32-mario-kaboom/bigger-kill-scenes.gif\n\
    \n## Designing the game\n\nWe'd like to make a game that has the Mario essence.\
    \ This means we need a few things:\n\n- The ability to jump and bump boxes.\n\
    - A big and small character.\n- The ability to attack enemies by jumping on them.\n\
    - The classic Mario scrolling and camera motion.\n\nFor the graphics, we will\
    \ use a tile set from this creator^26.\n\n## Creating a new project in Replit\n\
    \nHead over to Replit^27 and create a new repl. Choose Kaboom as your project\
    \ type and a name like \"Mario\".\n\n![](img/e909780a5f974ff614ba5223d44aa19b_144_0.png)\n\
    \nThe repl has booted up, you'll see main.js under the \"Code\" section. This\
    \ is where we'll start. It already has some code in it, but we'll replace that.\
    \ Download this archive of sprite assets files^28 that we'll need for the game,\
    \ and unzip them for your computer. In the Kaboom editor, click \"Files\" icon\
    \ in the sidebar. Now drag and drop all the sprite and asset files into the \"\
    sprites\" folder. Once they have uploaded, we'll replace the code in main.js with\
    \ the code below:\n\n```javascript\nimport kaboom from \"kaboom\";\n\nkaboom({\n\
    \  background: [134, 135, 247],\n  width: 320,\n  height: 240,\n  scale: 2,\n\
    });\n```\n\nThis creates a Kaboom canvas with a nice blue background. We also\
    \ set the size of the view to 320x240 pixels, which is a very low resolution for\
    \ a modern game, but the right kind of pixelation for a Mario-type remake.\n\n\
    > ^29https://docs.replit.com/images/tutorials/32-mario-kaboom/upload-assets.gif\n\
    \n## Setting up Kaboom\n\n### # Setting up Kaboom\n\nTo start, we need to set\
    \ up Kaboom with the screen size and colors we want for the game. Replace the\
    \ code in main.js with:\n\n```javascript\nimport kaboom from \"kaboom\";\n\nkaboom({\n\
    \  background: [134, 135, 247],\n  width: 320,\n  scale: 2,\n});\n```\n\nWe use\
    \ scale to make the background twice the size on screen. Click the \"Run\" button,\
    \ and you should see a lovely blue sky in the output window.\n\nWait, you'll see\
    \ main.js under the \"Code\" section. This is where we'll start. It already has\
    \ some code in it, but we'll replace that.\n\n## Building a Mario-like side-scroller\
    \ with Kaboom.js\n\nNow, let's load up some of the sprites so we can add them\
    \ to the blue scene. This code loads each of the graphic elements we'll use, and\
    \ gives them a name so we can refer to them when we build the characters:\n\n\
    - loadRoot(\"sprites/\");\n- loadAsprite(\"mario\", \"Mario.png\", \"Mario.json\"\
    );\n- loadAsprite(\"enemies\", \"enemies.png\", \"enemies.json\");\n- loadAsprite(\"\
    ground\", \"ground.png\");\n- loadAsprite(\"questionBox\", \"questionBox.png\"\
    );\n- loadAsprite(\"emptyBox\", \"emptyBox.png\");\n- loadAsprite(\"brick\", \"\
    brick.png\");\n- loadAsprite(\"coin\", \"coin.png\");\n- loadAsprite(\"bigMushy\"\
    , \"bigMushy.png\");\n- loadAsprite(\"pipeTop\", \"pipeTop.png\");\n- loadAsprite(\"\
    pipeBottom\", \"pipeBottom.png\");\n- loadAsprite(\"shrubbery\", \"shrubbery.png\"\
    );\n- loadAsprite(\"hill\", \"hill.png\");\n- loadAsprite(\"cloud\", \"cloud.png\"\
    );\n- loadAsprite(\"castle\", \"castle.png\");\n\nThe first line, `loadRoot()`,\
    \ specifies which folder to load all the sprites and game elements from, so we\
    \ don't have to keep typing it for each sprite. Then each line loads a sprite\
    \ and gives it a name so we can refer to it in code later.\n\nhttps://kaboomjs.com/#loadRoot\n\
    \n## Building a Mario-like scroller with Kaboom.js\n\nNotice that the mario and\
    \ enemies sprites are loaded with the function `loadSprite`, and have an extra\
    \ parameter specifying a .json file. This extra file is in a format made by Aseprite,\
    \ which is a pixel art and animation app. If you open the Mario.png file, you\
    \ will see that it has many images of Mario in different positions, which are\
    \ frames of Mario animations. The .json file contains all the information needed\
    \ to animate Mario in our game. Kaboom knows how to interpret this, we can pick\
    \ any animation to run at any time by choosing one from the frameTags list in\
    \ the .json file and using the `.play()` method on it. We can also choose a particular\
    \ frame to show at any time, using the sprite's `.frame` property, starting from\
    \ 0.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_147_0.png)\n\n```json\n{\n  \"\
    meta\": {\n    \"app\": \"http://www.aseprite.org/\",\n    \"version\": \"1.2.27-trial\"\
    ,\n    \"format\": \"RGBA888\",\n    \"size\": {\"w\": 83,\"h\": 32},\n    \"\
    scale\": 1\n  },\n  \"frameTags\": [\n    {\"name\": \"SmallMario\", \"from\"\
    : 0, \"to\": 3, \"direction\": \"forward\"},\n    {\"name\": \"Running\", \"from\"\
    : 4, \"to\": 7, \"direction\": \"forward\"},\n    {\"name\": \"BigMario\", \"\
    from\": 8, \"to\": 16, \"direction\": \"forward\"},\n    {\"name\": \"Running\"\
    , \"from\": 17, \"to\": 25, \"direction\": \"forward\"},\n    {\"name\": \"FireMario\"\
    , \"from\": 18, \"to\": 20, \"direction\": \"forward\"},\n    {\"name\": \"Loop\"\
    , \"from\": 21, \"to\": 24, \"direction\": \"forward\"}\n  ],\n  \"layers\": [\n\
    \    {\"name\": \"Layer 2\", \"opacity\": 255, \"blendMode\": \"normal\"},\n \
    \   {\"name\": \"Layer 1\", \"opacity\": 255, \"blendMode\": \"normal\"}\n  ],\n\
    \  \"slices\": []\n}\n```\n\nThe contents of the Mario.json file. Each frametag\
    \ is an animation sequence\n\nMario Aseprite file\n\n## Next Steps\n\nNow that\
    \ you know the basics of creating a multiplayer online game, try your hand at\
    \ making some different games, like checkers or chess or go.\n\nHappy coding!\n\
    \nYou can find the code sample for this tutorial on [github^28](https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/5-tictactoe-with-websockets-kaboom.md)\
    \ or [replit^29](https://replit.com/@ritza/tic-tac-toe-new).\n\n> ^28https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/5-tictactoe-with-websockets-kaboom.md\n\
    ^29https://replit.com/@ritza/tic-tac-toe-new\n"
