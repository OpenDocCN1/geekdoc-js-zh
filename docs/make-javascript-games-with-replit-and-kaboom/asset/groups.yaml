    # Build a Space Shooter with Kaboom.js


    To make the flashes appear around the position $\rho$ that we specified, the $pos^{141}$
    component is adjusted by a random amount, ranging from $-rad$ to $rad$, the radius
    we specified (in other words, the blast arena).


    Then there are references to two custom components - $lifespan$ and $grow$. Kaboom
    allows us to define our own components to give objects any behaviour or attributes.
    All we need to do is create a function that returns an object with a method called
    $update$, which is then called for each frame of the object it is added to.


    Let''s first look at the custom $grow$. This is used to create the effect of the
    flash expanding outwards, like a firework explosion starting at a small point
    and getting larger until it disappears. In $grow$''s update function, the object
    is scaled up (available because we used the $scale^{142}$ component on the object)
    each frame. This is calculated from the $rate$ in which is the size the object
    $dt^{143}$ function, which provides time difference in seconds for us. The explosion
    flash will keep growing on each frame, so we need a way to end the explosion before
    it covers the entire screen.


    This brings us to the $lifespan$ component. This is implemented to automatically
    $destroy^{144}$ the object after a short time, to solve the ever-growing explosion
    problem. It works by having a timer variable, which is updated each frame with
    the difference in time from the last frame, using the Kaboom $dt^{145}$ function.
    When the timer count is more than the time parameter passed into the component,
    the object is automatically $destroyed^{146}$. This creates the impression of
    a quick explosion blast.


