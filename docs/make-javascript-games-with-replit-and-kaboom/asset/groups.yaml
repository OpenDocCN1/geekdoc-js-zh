    # Building tic-tac-toe with WebSocket and Kaboom.js

    117


    http package enables us to run a simple HTTP server. The socket.io package extends
    that server

    add WebSocket²¹⁴⁹ functionality.


    To create the HTTP server, we use the http.createServer(); method. Then we set
    up Socket.IO

    by creating a new object. We pass in the HTTP server object along with configuration
    for

    CORS²¹⁵⁰ "Cross Origin Resource Sharing", and it''s a system that lets the server

    which sites are allowed to connect to it and we set the origin to allow our player
    repl

    to connect. Replace the origin value with the URL of the project repl you set
    up earlier.


    In the last 2 lines, we start the server by calling its listen method, along with
    a port to listen

    on. We use 3000, as a standard for Node.js. If it starts successfully, we write
    a message to the

    console to let us know.


    We''ll add the rest of the server code above the .listen line, as we only want
    to start the

    server up after all the code is ready.


    # Tracking the game state


    When we have a server, lets us think about how we will represent, or model, the
    game. Our

    tic-tac-toe game will have different properties to track:


    +   - The status of the game: What is currently happening? Are we waiting for
    players to join, the players playing, or is the game over?

    - The current positions on the tic-tac-toe board. Is there a player in grid block,
    or is it empty?

    - All the players. What are their names, and symbol are they using, X or O?

    - The current player. Whose turn is it to go?

    - If the game ends in a win, who won it?


    For the status of the game, we''ll add an enumeration²¹¹ of the possible states
    we can expect. This makes it easier to track and use them as we go through the
    phases of the game.


    ```

    const Statuses = {

    WAITING: ''waiting'',

    PLAYING: ''playing'',

    DRAW: ''draw'',

    WIN: ''win''

    }

    ```


    +   - WAITING: We are waiting for all the players to join the game.

    - PLAYING: The players can move on the board.


    > ²¹⁴https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API

    ²¹⁵⁰https://developer.mozilla.org/en-US/docs/Glossary/CORS

    ²¹¹https://mastering.io/tutorials/fundamentals/enum'
