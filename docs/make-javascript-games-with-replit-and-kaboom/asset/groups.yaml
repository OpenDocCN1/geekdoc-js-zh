    \ 在 Kaboom.js 中构建 Flappy Bird\n\n186\n\n![](img/e909780a5f974ff614ba5223d44aa19b_190_0.png)\n\
    \n### 水管间隙 (Pipe gap)\n\n我们希望对于每一对新生成的水管，都上下移动水管间隙（以及水管本身）。这样做是为了避免间隙始终固定在屏幕中心——我们希望每一对出现的水管间隙位置都略有不同。不过，我们需要保持间隙的大小一致一致。\n\
    \n首先，我们让水管间隙位于屏幕中心。我们为间隙设置一个大小 `PIPE_GAP`。为了放置水管，上方水管的底部应该位于窗口中心点（即 `height()/2`）上方\
    \ `PIPE_GAP/2` 像素处。同样，下方水管的顶部应该位于窗口中心点下方 `PIPE_GAP/2` 像素处（同样是 `height()/2`）。\n\
    \n通过这种方式，我们放置水管使得间隙位于窗口中心。现在，我们希望为每一对新水管随机向上或向下移动，实现这一方法是创建一个随机偏移量（offset），并将其加到每根新水管上，从而有效地移动窗口的中点。我们可以使用\
    \ Kaboom 的 [`rand`^496`](https://kaboomjs.com/#rand) 函数来实现。`rand`^497 函数有两个参数，用于指定随机数所在的范围。\n\
    \n让我们将其整合起来。下方水管的 Y 坐标可以计算为：\n`height()/2 + offset + PIPE_GAP/2`\n\n记住，窗口顶部是 `y=0`，底部是\
    \ `y=height()`。换句话说，屏幕上越靠下的位置，y 坐标越高。\n\n对于上方水管，我们可以这样计算水管底部应该的位置：\n\n`height()/2\
    \ + offset - PIPE_GAP/2`\n\n* [*^496](https://kaboomjs.com/#rand)\n* [*^497](https://kaboomjs.com/#rand)\n\
    \n## 在 Kaboom.js 中构建 Flappy Bird\n\nKaboom 有 [`origin`#8`](https://kaboomjs.com/origin)\
    \ 组件，用于设置字符使用的作为原点的点。默认是 `top`（顶部），这非常适合我们的下方水管，因为我们上面的计算是针对该顶点的。对于上方水管，我们的计算针对水管的底部。因此，我们可以使用\
    \ [`origin`#10`](https://kaboomjs.com/origin) 来指定。\n\n由于我们希望水管从屏幕右侧向 Flappy 所在的左侧移动，我们将它们的\
    \ X 坐标设置为屏幕的 [`width`#9`](https://kaboomjs.com/width)。\n\n为了识别和查询水管，为它们添加文本标签\
    \ `\"pipe\"`。\n最后，由于我们需要在游戏期间创建许多水管，我们将所有水管代码封装在一个函数中，我们可以定期调用该函数来生成水管。\n\n以下是基于所有考虑因素和计算的代码。将此代码插入到游戏场景中：\n\
    \n```javascript\nconst PIPE_GAP = 120;\n\nfunction producePipes(){\n  const offset\
    \ = rand(-50, 50);\n\n  add([\n    sprite(\"pipe\"),\n    pos(width(), height()/2\
    \ + offset + PIPE_GAP/2),\n    \"pipe\",\n    area(),\n  ]);\n\n  add([\n    sprite(\"\
    pipe\", {flipY: true}),\n    pos(width(), height()/2 + offset - PIPE_GAP/2),\n\
    \    origin(\"botleft\"),\n    area(),\n  ]);\n}\n```\n\n现在我们还需要再做几件事来让水管出现并移动。\n\
    为了让水管横跨屏幕，我们可以使用 [`onUpdate`#11`](https://kaboomjs.com/onupdate) 函数每帧更新所有水管的位置。注意我们需要调整水管的\
    \ x 坐标。将此代码添加到你代码的游戏场景中：\n\n* [#8](https://kaboomjs.com/origin)\n* [#10](https://kaboomjs.com/origin)\n\
    * [#9](https://kaboomjs.com/width)\n* [#11](https://kaboomjs.com/onupdate)\n\n\
    ```javascript\nonUpdate(\"pipe\", (pipe) => {\n  pipe.move(-160, 0);\n});\n```\n\
    \n接下来，我们将以稳定的速率生成水管。我们可以使用 [`loop`⁴¹² 函数来实现。将以下内容添加到代码的游戏场景部分：\n\n```javascript\n\
    loop(1.5, () => {\n  producePipes();\n});\n```\n\n这会每隔 1.5 秒调用一次 `producePipes()`\
    \ 函数。你可以调整这个速率，或者使其变为可变，随着游戏进行而增加速率。\n\n现在更新游戏输出，你应该能看到水管正在生成并横跨屏幕。你也可以操控 Flappy\
    \ 飞行，虽然目前撞到水管没有任何反应。\n\n![](img/e909780a5f974ff614ba5223d44aa19b_192_0.png)\n\n\
    点击打开 gif⁴³\n\n"
