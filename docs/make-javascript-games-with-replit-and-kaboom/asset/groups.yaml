- md: "\n```javascript\nplayer.onUpdate(() => {\n  // center camera to player\n  var\
    \ currCam = camPos();\n  if (currCam.x < player.pos.x) {\n    camPos(player.pos.x,\
    \ currCam.y);\n  }\n});\n```\n\nWe add a handler to the `onUpdate` event for the\
    \ player. This is called for each frame that is rendered. In this handler, we\
    \ get the camera's current position by calling the `camPos` function without any\
    \ arguments. We can then check if Mario is further to the right of the scene than\
    \ the camera is. If he is, we set the camera's X position to that of Mario, so\
    \ essentially the camera is following Mario. We only do this if he is further\
    \ to the right of the camera and not for positions further to the left. This is\
    \ because we don't want the player to be able to go back on a level.\n\nUpdate\
    \ the output again and test it. As you move Mario past the center of the screen,\
    \ the camera should start following, giving him the sense of scrolling.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_160_0.png)\n\
    \nScrolling\n\nClick to open gif³331\n\n> 329 https://kaboomjs.com/#onUpdate\n\
    > 396 https://kaboomjs.com/#camPos\n> 331 https://docs.replit.com/images/tutorials/32-mario-kaboom/scrolling.gif\n\
    \n## Building a Mario-like side-scroller with Kaboom.js\n\n### Creating a custom\
    \ component\n\nTo add more abilities to the characters and features to the game,\
    \ we'll use components we create ourselves and add to our game objects. To define\
    \ a new component in Kaboom, we make a function that returns an object with few\
    \ required fields and methods. Here's a template to illustrate code for a custom\
    \ component (not part of the game code):\n\n```javascript\nfunction customComponent(args)\
    \ {\n  return {\n    id: \"name\",\n    require: [\"component1\", \"component2\"\
    ],\n    add() {\n    },\n    update() {\n    },\n  };\n};\n```\n\nIn the object\
    \ we return, Kaboom requires an id, which is a unique name for the component.\
    \ Kaboom also needs a require property, which is a list of other components this\
    \ component needs in order to work. When a component is first initialized on a\
    \ game object, Kaboom calls the `add()` method so we have the opportunity to run\
    \ any setup code we need. The method `update()` is called on every game frame,\
    \ so we can make animation and collision updates there.\n\nOne behavior we need\
    \ is for the enemy characters to walk up and down, instead of just standing in\
    \ one place. Let's make a custom component we can add to our enemy characters\
    \ so that they automatically move back and forth, or patrol their part of the\
    \ level. Add the code below to the bottom of main.js:\n\n```javascript\nfunction\
    \ patrol(distance = 100, speed = 50, dir = 1) {\n  return {\n    id: \"patrol\"\
    ,\n    require: [\"pos\", \"area\"],\n    startingPos: vec2(0, 0),\n    add()\
    \ {\n    this.startingPos = this.pos;\n    this.on(\"collide\", (obj, side) =>\
    \ {\n      if (side === \"left\" || side === \"right\") {\n        dir = -dir;\n\
    \      }\n    });\n    },\n  };\n}\n```\n\n## Building a Mario-like side-scroller\
    \ with Kaboom.js\n\n```javascript\nupdate() {\n  if (Math.abs(this.pos.x - this.startingPos.x)\
    \ >= distance) {\n    dir = -dir;\n  }\n  this.move(speed * dir, 0);\n}\n```\n\
    \nWe've called this custom component \"patrol\", as it will make a character move\
    \ distance, at a set speed, and then turn and walk in the opposite direction,\
    \ dir. The character will turn and move in the opposite direction. The `move`\
    \ method (which is part of the `pos` component), the `collide` event handler (which\
