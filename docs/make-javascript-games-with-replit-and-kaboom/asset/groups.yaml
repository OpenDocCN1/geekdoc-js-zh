  - "[PAGE 114]\n\nBuilding pseudo-3D game in Kaboom\n\nClick to open gif^29\n\n#\
    \ Checking if alien bugs hits the spaceship\n\nNow we can add functionality to\
    \ check if an alien bug hits it part our laser and explodes into the spaceship.\
    \ Since the cockpit covers the entire screen, we can't make use of the onCollide^30\
    \ function to check if an alien has hit the cockpit, as it would always be colliding.\
    \ Instead, we can check the z value of the alien, if plus it is within an area\
    \ of the spaceship that would cause damage. We'll use a \"strike zone\" in the\
    \ center of the cockpit view as the alien can do damage to the craft. Outside\
    \ that, we'll assume that the aliens go around or over the spaceship.\n\nTo implement\
    \ this scheme, add the definition of the strike zone:\n\n```\nconst STRIKE_ZONE\
    \ = [x1:80, x2:240, y1:20, y2:100];\n```\n\nThen we can modify the onUpdate(\"\
    alien\",...) event handler that we dealt earlier in \"Moving the Alien Bugs section\"\
    . In the part of the function where we check if the alien is close to us (if alien.pos.z\
    \ <= 1), update the code as follows:\n\n```\nif (alien.pos.z < 1 )\n  //check\
    \ if the alien has hit the craft\n  if (alien.pos.x > STRIKE_ZONE.x1 &&\n    \
    \  alien.pos.x < STRIKE_ZONE.x2 &&\n      alien.pos.y > STRIKE_ZONE.y1 &&\n  \
    \    alien.pos.y <= STRIKE_ZONE.y2){\n    shake(20);\n    makeExplosion(alien.pos,\
    \ 10, 10, 10);\n  }\ndestroyAlien(alien);\n```\n\nWe've modified the code to check\
    \ if the alien is really close to us (alien.pos.z < 1 ), and if it is, we check\
    \ if it is within the bounds of the STRIKE_ZONE area. The strike zone is a rectangle\
    \ - you could implement more complex shapes if you wanted to be more accurate\
    \ about where the alien can hit. However, a rectangle approximation is OK for\
    \ this game.\n\nIf the alien is close enough, and within our strike zone, we use\
    \ the shake^231 effect to make it \"feel\" like we've hit him. Then we create\
    \ an explosion at the point of impact for some visual effects.\n\n> ^29https://docs.replit.com/tutorials/25-3d-game-kaboom/shooting-explosion.gif\n\
    ^30https://kaboomjs.com/doc/#onCollide\n^31https://kaboomjs.com/#shake"
- md: "\n## Finishing up the game\n\nCongratulations, we've got all the main elements\
    \ of flying and shooting and damage in the game. The next thing to do be to add\
    \ a scoring system, and a way to reduce the spaceship's health or shield when\
    \ it gets hit. You can look at the tutorial for the 2D version of this game, and\
    \ copy the scoring and health code into this game. You can also copy the code\
    \ for background music and more sound effects.\n\nHappy coding and have fun!\n\
    \n## Credits\n\nThe game art and sounds used in this tutorial are from the following\
    \ sources:\nLaser: https://freesound.org/people/sunnyflower/sounds/361471/\n\n\
    > ²232}https://docs.replit.com/tutorials/25-3d-game-kaboom/colliding.gif\n^{233}https://docs.replit.com/tutorials/24-build-space-shooter-with-kaboom\n\
    ^{234}https://freesound.org/people/sunnyflower/sounds/361471/\n\nBuilding a pseudo-3D\
    \ game in Kaboom\n\nExplosion: https://freesound.org/people/tommccann/sounds/235968^{235}\n\
    \nAlien Bug: https://opengameart.org/content/8-bit-alien-assets^{236}\n\nThe spaceship\
    \ cockpit was made by Ritza^{237}.\n\nThank you to all the creators for putting\
    \ their assets up with a Creative Commons license and allowing us to use them.\n\
    \nYou can find the code sample for this tutorial on github^{238} or replit^{239}\n\
    \n- 235 https://freesound.org/people/tommccann/sounds/235968/\n- 236 https://opengameart.org/content/8-bit-alien-assets\n\
    - 237 https://ritza.co\n- 238 https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/4-3d-game-with-kaboom.md\n\
    - 239 https://replit.com/@ritza/3d-space-shooter-new\n\n## Building tic-tac-toe\
    \ with WebSocket and Kaboom.js\n\nTic-tac-toe, or noughts and crosses, or Xs and\
    \ Os, is a simple classic game for 2 players. It's usually played with paper and\
    \ pen, but it also makes a good first game to write for networked multiplayer.\n\
    \nIn this tutorial, we'll create a 2-player online tic-tac-toe game using a Node.js²244\
    \ server. Socket.IO²243 will enable realtime gameplay across the internet. We'll\
    \ use Kaboom.js to create the game interface.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_117_0.png)\n\
    \nClick to open gif²242\n\n### How do multiplayer games work?\n\nMultiplayer games\
    \ have an architecture that typically looks something like this:\n\n> ²244https://nodejs.org/en/\n\
    ²244https://socket.io\n²244https://docs.replit.com/images/tutorials/27-tictactoe-kaboom/gameplay.gif\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_118_0.png)\n\n## Game server architecture\n\
    \nPlayers (clients) connect to a game server over the internet. The game runs\
    \ on the game server, where all the game rules, scores and other data are processed.\
    \ The players' computers render the graphics for the game, and send player commands\
    \ (from the keyboard, mouse, gamepad, or other input device) back to the game\
    \ server. The game server checks if these commands are valid, and then updates\
    \ the game state. The game state is a representation of all the variables, players,\
    \ data and information about the game. This game state is transmitted back to\
    \ all the players and the graphics are updated.\n\nA lot of communication needs\
    \ to happen between a player's computer and the game server in online multiplayer\
    \ games. This generally requires a 2-way, or bidirectional, link so that the game\
    \ server can send data and notify players of updates to the game state. This link\
    \ should ideally be quick too, so a more permanent connection is better.\n\nWith\
    \ the HTTP2^43 protocol that websites usually use, a browser opens a connection\
    \ to a server, then\n\n> ^43https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol\n\
    \n## Building tic-tac-toe with WebSocket and Kaboom.js\n\nmakes a request to the\
    \ server, the server sends back data, and closes the connection. There is no way\
    \ for the server to initiate sending data to the browser. HTTP is also heavy on\
    \ the overhead. WebSocket is an advanced protocol that allows us to create a 2-way,\
    \ persistent connection.\n\nFor the game state, let's think about how we will\
    \ represent, or model, the game. When we have a server, we'll add the following:\n\
    \n- To create the server, choose \"Node.js\" as your project.\n- To create the\
    \ server, choose \"Kaboom\" as your project.\n- To create the server, choose \"\
    WebSocket\" as your project.\n\n## Building the-\n\n.\n\n\n\n..0000000005544444444444444.....\n\
    \n\n\n the..\n\n## Setting up the server\n\n```javascript\nconst http = require('http');\n\
    const io = require('socket.io');\n\nconst server = http.createServer();\nconst\
