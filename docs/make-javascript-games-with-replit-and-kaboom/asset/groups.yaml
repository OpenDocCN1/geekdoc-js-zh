- md: "\n# Building tic-tac-toe with WebSocket and Kaboom.js\n\nEach number in the\
    \ blocks represents the index at which the board position is represented in the\
    \ array. Initially, we fill all the elements of the array with null to indicate\
    \ that the block is open. When players make a move to occupy an open space, we'll\
    \ add a reference to the player instead. That way we can keep track of which blocks\
    \ are empty, and which are occupied by which player.\n\nNext, we have `currentPlayer`,\
    \ which we will alternately set to each player when it's their turn to move.\n\
    \nThen there is an array players, which will hold references to both of the players\
    \ in the game. This will allow us to show the names of the players on screen,\
    \ as well as generally keep track of the players.\n\nThe result field is updated\
    \ after every move. This field will contain the status of the game (as we defined\
    \ above). As it's represented as an object, it will also be able to hold extra\
    \ fields. We'll use that functionality to add a reference to the winner of the\
    \ game, if the game ends in a win.\n\n## Accepting connections\n\nWhen a player\
    \ connects via WebSocket, Sockets.IO will fire a connection event. We can listen\
    \ for this event and handle tracking the connection, as well as creating listeners\
    \ for other custom events. There are a few custom events we can define here, that\
    \ our players will emit:\n\n- addPlayer: We use this for a player request joining\
    \ the game.\n- action: Used when a player wants to make a move.\n- rematch: Used\
    \ when a game is over, but the players want to play again.\n\nWe can also listen\
    \ for the built-in disconnect event, which will alert us if a player leaves the\
    \ game (for example, by closing the browser window or if their connection is lost).\n\
    \nHere's the code that we hook up our listeners to the events:\n\n```javascript\n\
    io.on('connection', function (connection) {\n  connection.on('addPlayer', addPlayer(connection.id));\n\
    \  connection.on('action', action(connection.id));\n  connection.on('rematch',\
    \ rematch(connection.id));\n  connection.on('disconnect', disconnect(connection.id));\n\
    });\n```\n\nNext we'll implement each of these listeners, starting with `addPlayer`.\n\
    \nSide Note: Normally in examples for custom listeners, you'll handle the code\
    \ added immediately with an anonymous function, like this:\n\n²⁵²https://socket.io/docs/v4/server-instance/#connection\n\
    ²⁵³https://socket.io/docs/v4/emitting-events/\n²⁵⁴https://socket.io/docs/v4/server-instance/#disconnect\n\
    \n# Building tic-tac-toe with WebSocket and Kaboom.js\n\n```javascript\n1 io.on('connection',\
    \ function (connection) {\n2   connection.on('addPlayer', (data)=>{\n3     //\
    \ some code here\n4   });\n5 \n6   connection.on('action', (data)=>{\n7     //\
    \ some code here\n8   });\n9 \n10 // etc ...\n11 });\n```\n\nThis is convenient,\
    \ especially when we have a couple of handlers, each with only a small amount\
    \ of code. It's also handy because in each of the handler functions, you still\
    \ have access to the connection object, which is not passed on each event. However,\
    \ it can get a little messy and unwieldy if there are many event handlers, with\
    \ complex logic in each.\n\nWe're doing it differently so that we can separate\
    \ the handlers into functions elsewhere in the code base. We have one problem\
    \ to solve: if they are functions, how will they access the connection parameter\
    \ in such a way that we can tell which player sent the command? With the concept\
    \ of closures which are well-supported in Javascript, we can make functions that\
    \ return another function. In this way, we can use the connection.id parameter\
    \ to the first wrapping function, and it can return another function that takes\
    \ the data arguments from the Socket.IO event caller. The second function is within\
    \ the closure of the first, it will have access to the connection.id parameter.\
    \ The pattern looks like this:\n\n```javascript\n1 io.on('connection', function\
    \ (connection) {\n2   connection.on('addPlayer', addPlayer(connection.id));\n\
    3   connection.on('action', action(connection.id));\n4   // etc ...\n5 });\n```\n\
    \n```javascript\nfunction addPlayer(socketId){\n  return (data)=>{\n    // code\
    \ here\n  }\n}\n```\n\n```javascript\nfunction action(socketId){\n  return (data)=>{\n\
    \    // code here\n  }\n}\n```\n\n> 21https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures\n\
    \n# Handling new players\n\nAdd the following function to handle adding players:\n\
    \n```javascript\nfunction addPlayer(socketId){\n  return (data)={\n    const numberOfPlayers\
    \ = gameState.players.length;\n    if (numberOfPlayers >= 2){\n      return;\n\
    \    }\n\n    let nextSymbol = 'X';\n    if (numberOfPlayers === 1){\n      if\
    \ (gameState.players[0].symbol === 'X'){\n        nextSymbol = 'O';\n      }\n\
    \    }\n\n    const newPlayer = {\n      playerName: data.playerName,\n      id:\
    \ socketId,\n      symbol: nextSymbol\n    };\n\n    gameState.players.push(newPlayer);\n\
    \    if (gameState.players.length === 2){\n      gameState.result.status = Statuses.PLAYING;\n\
    \      gameState.result.currentPlayer = newPlayer;\n    }\n\n    io.emit('gameState',\
    \ gameState);\n  }\n}\n```\n\nThis function does quite a bit. First it checks\
    \ to see how many players are already in the game. If there are already 2 players,\
    \ it returns early without changing anything. If this check passes, it goes on\
    \ to add a new player. Note that when there is no space in the game for a new\
    \ player, we don't disconnect the player - they still get updates and can watch\
    \ the match. Next the function figures out symbol, X or O, the new player should\
    \ be. If there is already a player, the existing player's symbol is X, then it\
    \ will assign O to the new player. Note that there is a possible case where there\
    \ is only one player, and their symbol is O. This would occur if there are 2 players,\
    \ and the player with the X symbol disconnects from the game, leaving only the\
    \ player with the O symbol. Then the function constructs a new player object with\
    \ identifying information, the name that the player sends, the socketId, and their\
    \ symbol. When a new player requests to join, we expect them to send an object\
    \ with playerName. Now we add the new player to the array in our gameState object,\
    \ that they are part of the game. If we have 2 players, we begin by updating the\
    \ status of the game to PLAYING, and set the currentPlayer, i.e the player who\
    \ is first to go, as the latest player to joined. Finally, we use the Socket.IO\
    \ emit function to send the updated gameState to all connections. This will allow\
    \ them to update the displays.\n\n# Handling player actions\n\nThe next handler\
    \ takes care of the moves players make. We expect that the incoming data from\
    \ the player will have a property gridIndex to indicate which block the player\
    \ wants to mark. This should map to the numbers for each block in the board, and\
    \ as earlier.\n\n```javascript\nfunction action(socketId){\n  return(data) =>\
    \ {\n    if (gameState.status === Statuses.PLAYING && gameState.currentPlayer.id\
    \ === socketId) {\n      const player = gameState.players.find(p => p.id === socketId);\n\
    \      if (gameState.board[data.gridIndex] === null) {\n        gameState.board[data.gridIndex]\
    \ = player;\n        gameState.currentPlayer = gameState.players.find(p !== player);\n\
    \        checkEndOfGame();\n      }\n    }\n    io.emit('gameState', gameState);\n\
    \  }\n}\n```\n\nIn this function, we check a couple of things first:\n\n- The\
    \ game status must be PLAYING - players can't make moves if the game is in any\
    \ other state.\n- The player attempting to make the move must be the currentPlayer,\
    \ i.e the player whose turn it is to.\n\nIf these conditions are met, we find\
    \ the player in the gameState.players array using the built-in find method on\
    \ arrays, looking for the player by their socketId.\n\nNow we can check if the\
    \ board position (gridIndex) requested by the player is available. We check the\
    \ value for that position in the gameState.board array is null, and if it is,\
    \ we assign the player to.\n\nThe player has made a successful move, so we give\
    \ the other player turn. We switch the gameState.currentPlayer to the other player\
    \ by using the array find method again, to get the player who does not match the\
    \ current player.\n\nWe also need to check if the player changed the status of\
    \ the game. Did that move make them win, or is it a draw, or is the game still\
    \ in play? We call out to a function checkForEndOfGame to check for this. We'll\
