    function makeExplosion(p, n, size) {\n  for (let i = 0; i < n; i++) {\n    wait(rand()\
    \ * 0.1, () => {\n      for (let j = 0; j < 2; j++) {\n        add(\n        \
    \  rect(1, 1),\n          pos(p.add(vec2(rand(-rad, rad), rand(-rad, rad)))),\n\
    \          color(255, 255, 255),\n          origin(\"center\"),\n          scale(1\
    \ * size, 1 * size),\n          lifespan(1)\n        );\n      }\n    });\n  }\n\
    }\n```\n\n```javascript\nfunction lifespan(time) {\n  let timer = 0;\n  return\
    \ {\n    update() {\n      timer += dt;\n      if (timer >= time) {\n        destroy(this);\n\
    \      }\n    },\n  }\n}\n\nfunction grow(rate) {\n  return {\n    update() {\n\
    \      const n = rate * dt();\n      this.scale.add(n);\n    }\n  }\n}\n```\n\n\
    `makeExplosion` 函数有四个参数（函数的输入）。这些参数是：\n\n- p: 作为爆炸基础的中心位置\n- n: 主闪烁的次数\n- rad:\
    \ 从 p 到产生闪光的半径或距离\n- size: 每个闪光的大小\n\n该函数创建了一个执行 `n` 次的循环（即主闪光的次数）。它使用 Kaboom\
    \ 的 `wait` 函数在每次闪烁之间留出一点时间（0.1 秒）。\n\n另一个另一个循环运行两次以创建 2 次闪光，使用 Kaboom 的 `add`\
    \ 函数添加一个矩形形状作为闪光，并将颜色设置为白色（Kaboom 中的颜色分量范围为 0-255）。这个矩形的初始大小为 1 像素，然后是传递给函数的大小——我们稍后在“增长（grow）”爆炸时会使用它。`origin`\
    \ 组件用于将矩形的原点设置为其中心——这将在“增长”时被用到，以产生一种从小点开始并扩张的印象。设置原点使得缩放（scale）从位置计算，从而产生更自然的感觉。\n\
    \n为了让闪光出现在我们指定的点周围，`pos` 组件通过随机量进行调整，范围从 `-rad` 到 `rad`，即我们指定的半径（换句话说，爆炸区域）。\n\
    \n然后是对两个自定义组件的引用——`lifespan` 和 `grow`。Kaboom 允许我们定义自己的组件来赋予对象任何行为或属性。我们只需要创建一个函数，返回一个带有名为\
    \ `update` 方法的对象，该方法会在对象被添加的每一帧中被调用。\n\n让我们先看看自定义的 `grow`。它用于创建闪光向外扩张的效果，就像烟花爆炸从一个小点开始并变大，直到消失。在\
    \ `grow` 的 `update` 函数中，对象在每一帧都会被放大（因为我们在对象上使用了 `scale` 组件）。这是根据 `rate` 计算的，`rate`\
    \ 是对象的大小，`dt` 函数为我们提供了以秒为单位的时间差。爆炸闪光会在每一帧持续增长，所以我们需要一种方法来……\n\n`lifespan` 组件。它用于在一定时间后销毁对象。这防止了爆炸效果无限增长并消耗内存。\n\
    \n# 添加分数和 UI\n\n让我们添加 UI 来显示飞船的护盾健康值和玩家的总分。\n\n首先，添加玩家分数的文本：\n\n```javascript\n\
    add(\n  text(\"SCORE\", { size: 8, font: \"sink\" }),\n  pos(100, 10),\n  origin(\"\
    center\"),\n  layer(\"ui\")\n);\n\nconst scoreText = add(\n  text(\"000000\",\
    \ { size: 8, font: \"sink\" }),\n  pos(150, 10),\n  origin(\"center\"),\n  layer(\"\
    ui\")\n);\n```\n\n在这里我们添加了两个新对象，使用 `text` 组件渲染。第一个只是分数的静态标签。第二个是实际分数的占位符。注意，在两种情况下都使用了\
    \ `layer`，将文本放置在我们在教程开始创建的 UI 层上。我们在创建其他所有游戏对象时还没有指定 `layer`，因为我们在定义层时已将 `obj`\
    \ 层设置为默认值。\n\n"
