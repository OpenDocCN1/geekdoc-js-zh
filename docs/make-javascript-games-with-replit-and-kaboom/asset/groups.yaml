    \ `detune()` 改变音调以保持声音的新鲜。\n\n当外星人被子弹击时增加分数，更新我们之前为子弹外星虫添加的 `onCollide` 事件：\n\n\
    ```javascript\nonCollide(\"alien\",\"bullet\", (alien, bullet) => {\n  makeExplosion(alien.pos,\
    \ 5, 5, 5);\n  destroy(alien);\n  destroy(bullet);\n  play(\"explosion\", {\n\
    \    volume: 0.2,\n    detune: rand(0, 1200),\n  });\n  updateScore(10); // 新行\n\
    });\n```\n\n下一个要添加的 UI 元素是飞船的护盾生命。这作为一个血条式的显示会非常棒，它开始是绿色，当护盾较低时变为红色。当护盾完全耗尽时游戏应该结束，因为飞船被完全摧毁了。\n\
    \n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/toString\n\
    > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart\n\
    > https://kaboomjs.com/doc/\n\n# 使用 Kaboom.js 构建一个太空射击游戏\n\n```javascript\nadd([\n\
    \  text(\"SHIELD\", { size: 8, font: \"sink\" }),\n  pos(300, 10),\n  origin(\"\
    center\"),\n  layer(\"ui\")\n]);\n\nconst shieldHolder = add([\n  rect(52, 12),\n\
    \  pos(350, 10),\n  color(100, 100, 100),\n  origin(\"center\"),\n  layer(\"ui\"\
    )\n]);\n\nconst shieldHolderInside = add([\n  rect(50, 10),\n  pos(350, 10),\n\
    \  color(0, 0, 0),\n  origin(\"center\"),\n  layer(\"ui\")\n]);\n\nconst shieldBar\
    \ = add([\n  rect(50, 10),\n  pos(325, 5),\n  color(0, 255, 0),\n  layer(\"ui\"\
    )\n]);\n```\n\n首先，我们添加一个文本标签，让玩家知道进度条代表什么。为了创建护盾条 UI，我们使用了 3 个元素：\n\n- 一个边框，或者说\
    \ `shieldHolder`，用于勾勒进度条。\n- 一个黑色内部方块，让容器看起来像一条细线，即 `shieldHolderInside`。\n- `shieldBar`\
    \ 本身，它的长度会随着护盾受损而缩短。\n\n现在我们需要一个函数在想要更新护盾生命值时调用它：\n\n```javascript\nfunction updatePlayerShield()\
    \ {\n  player.shield += shieldPoints;\n  player.shield = Math.max(player.shield,\
    \ 0);\n  player.shield = Math.min(player.shield, 100);\n  shieldBar.width = 50\
    \ * (player.shield / 100);\n  if (player.shield < 20) shieldBar.color = rgb(255,0,0);\n\
    \  else if (player.shield < 50) shieldBar.color = rgb(255,127,0);\n  else shieldBar.color\
    \ = rgb(0,255,0);\n  if (player.shield <= 0) {\n    destroy(player);\n  }\n  for\
    \ (let i = 0; i < 500; i++) {\n    wait(0.01 * i, () => {\n      makeExplosion(vec2(rand(0,\
    \ MAP_WIDTH), rand(0, MAP_HEIGHT)), 5, 10);\n      play(\"explosion\", {\n   \
    \     detune: rand(-1200, 1200)\n      });\n    });\n  }\n  wait(2, () => {\n\
    \    go(\"endGame\");\n  });\n}\n```\n\n该函数有一个参数 `shieldPoints`，用于更新护盾增加的数值，并调整\
    \ UI 层上的自定义护盾 属性。它还将护盾的最小和最大值限制在 0 到 100 之间。\n\n该函数将 `shieldBar` 的宽度（其沿 x 轴的尺寸）设置为可用护盾的百分比\
    \ (`player.shield / 100`) 乘以进度条的全宽 `50`。\n\n然后，函数根据护盾状态更新进度条的颜色：\n\n- 护盾小于 20%，进度条变为红色；\n\
    - 护盾小于 50%，进度条变为橙色；\n- 否则，进度条为绿色。\n如果护盾小于 0，则销毁玩家。\n\n"
