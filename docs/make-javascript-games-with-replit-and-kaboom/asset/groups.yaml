  - "[PAGE 178]\n\n# Ending when we get to the castle\n\nThe final thing to do for\
    \ this tutorial is to handle the case when Mario reaches the castle. At this point,\
    \ Mario is at the door, we want him to freeze, a congratulations message to appear\
    \ to the player, and then move on to the next level.\n\nWe can use a regular collision\
    \ handler to check if Mario is at the castle. Notice in the setup for the castle\
    \ in the level we added earlier, we set the collision area³⁶⁷ of the castle to\
    \ a very narrow, completely vertical line of width 1 pixel and height 240, which\
    \ is the screen height:\n\n```\n\"H\" => [\n  sprite(\"castle\"),\n  area({ width:\
    \ 1, height: 240 }),\n  origin(\"bot\"),\n  \"castle\"\n];\n```\n\nThis is so\
    \ that the collision between Mario and the castle is only registered when Mario\
    \ gets to the center of the castle, where the door is. We can visualize this by\
    \ pressing F1 in the game to enable the debugger and look at the area box at the\
    \ castle:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_178_0.png)\n\nCastle area"
  - "[PAGE 179]\n\n# Building a Mario-like side-scroller with Kaboom.js\n\nThe reason\
    \ we make the area box the height of the screen is make sure the player can' accidentally\
    \ jump over the ending point and fall off the end of the level.\nnNow let's add\
    \ our collision handler for the castle to the game scene:\n\n```\nplayer.onCollide(\"\
    castle\", (castle, side) => {\n  player.freeze();\n  add({\n    text(\"Well Done!\"\
    , { size: 24 }),\n    pos(toWorld(vec2(160, 120))),\n    color(255, 255, 255),\n\
    \    origin('ui'),\n  });\n  wait(1, () => {\n    let nextLevel = levelNumber\
    \ + 1;\n\n    if (nextLevel >= LEVELS.length) {\n      go(\"start\");\n    } else\
    \ {\n      go(\"game\", nextLevel);\n    }\n  });\n});\n```\n\nFirst, we freeze\
    \ Mario so the player can't control him anymore. Then we add368 our \"Well Done!text369\
    \ message to the center of the screen. We wait370 a second before incrementing\
    \ the level number and going to the next level, or going back to the start of\
    \ the game if we have completed all levels.\n\n# Next steps\n\nThere are few things\
    \ left to do to complete the game Kaboom:\n\n+   - Add in scoring. You can check\
    \ out a previous Kaboom tutorial, like Space Shooter371, to see how scoring works.\n\
    - Add in sounds and music. If you get your own copy of the Mario tracks and effects,\
    \ you can use the play372 sound function in Kaboom to get those classic tunes\
    \ blasting as you play.\n\n368https://kaboom.com/#add\n369https://kaboom.com/#text\n\
    370https://kaboom.com/#wait\n371https://docs.replit.com/tutorials/24-build-space-shooter-with-kaboom\n\
    372https://kaboom.com/#play"
