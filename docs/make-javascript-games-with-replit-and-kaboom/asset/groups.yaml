- md: "\n# Building Flappy Bird in Kaboom.js\n\nLet's include a quick way for the\
    \ player to play again and try to beat their score. We use the `onKeyPress` to\
    \ listen for the player pressing the space bar. In our key-press handler, we go\
    \ back to the main game scene, to start the game over again.\n\nWe also need to\
    \ ensure if Flappy flies too high off the screen, or plummets off the screen.\
    \ We can do this by adding a handler for the player's `onUpdate` event, which\
    \ is called each frame. We can check if Flappy's position is beyond the bounds\
    \ of the game window. We will add this code to the game scene:\n\n```\nplayer.onUpdate(()\
    \ => {\n  if (player.pos.y > height() + 30 || player.pos.y < -30) {\n    go(\"\
    gameover\", score);\n  }\n});\n```\n\nThis gives a margin of 30 pixels above or\
    \ below the window, to take account of Flappy's size. If Flappy is out of these\
    \ bounds, we go to the gameover scene to end the game.\n\nUpdate the game output\
    \ window again and test it out. If you fly into a pipe now, or flap too high,\
    \ or out of the sky, you should be taken to the game over screen:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_196_0.png)\n\
    \nClick to open gif\n\n- 420https://kaboom.js/#onKeyPress\n- 421https://kaboom.js/#go\n\
    - 422https://kaboom.js/#add\n- 423https://kaboom.js/#go\n- 424https://docs.replit.com/images/tutorials/35-flappy-bird/game-over.gif\n\
    \n# Next steps\n\nHere are some ideas you can try to improve your clone of the\
    \ Flappy Bird game:\n\n- Make the game play faster as the player gets a higher\
    \ score. You can do this by updating the speed that the pipes move by making the\
    \ speed parameter passed to the pipe.move method a variable, which increases as\
    \ the player score increases.\n- Add some different types of obstacles, other\
    \ than the pipes, for Flappy to try to avoid.\n- Use the Kaboom sprite editor\
    \ to create your own graphics for your Flappy world!\n- Add in some more sound\
    \ effects and play some game music using the `play` function.\n\nYou can find\
    \ the code sample for this tutorial on github or replit\n\n> 27https://docs.replit.com/tutorials/kaboom-editor\n\
    > 28https://kaboomjs.com/#play\n> 29https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/7-flappy-bird-with-kaboom.md\n\
    > 30https://replit.com/@ritza/Flappy-Bird\n\n# Build a Physics playground with\
    \ Kaboom.js\n\nIn this tutorial, we will be building a simple physics playground\
    \ with Kaboom.js*. This will be a 2D side-view platformer in which the player\
    \ can use a gravity gun to pick up and shoot objects in the world, similar to\
    \ games like Half-Life 2 and Rochard.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_198_0.png)\n\
    \nThe finished game\n\nClick to open gif\n\nBy the end of this tutorial, you will:\n\
    \n- Familiar with advanced usage of the Kaboom JavaScript game development framework.\n\
    - Be able to build a simple 2D physics engine.\n- Have the basis for a physics-based\
    \ platformer, which you can extend to a full game.\n\n# Getting started\n\nLog\
    \ into your Replit* account and create a new repl. Choose Kaboom as your project\
    \ type. This needs a repl name, like \"gravity\".\n\n* 42https://kaboom.com/\n\
    * 43https://en.wikipedia.org/wiki/Gravity_gun\n* 44https://docs.replit.com/images/tutorials/36-physics-playground/gameplay\n\
    * 45https://replit.com\n\n# Build a Physics playground with Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_199_0.png)\n\
    \nKaboom repls are quite different from other kinds of repls you may have seen\
    \ before: instead of dealing directly with files in folders, you'll be dealing\
    \ with code, sounds and sprites, the latter of which you can draw directly in\
    \ Replit's editor.\n\n# Setting the scene\n\nWhen you first open your new Kaboom\
    \ repl, you'll be greeted by a file containing the sample code below.\n\n```\n\
    import kaboom from \"kaboom\";\n\n// initialize context\nkaboom();\n\n// load\
    \ assets\nloadSprite(\"bean\", \"sprites/bean.png\");\n\n// add a character to\
    \ screen\nadd([\n  // list of components\nsprite(\"bean\"),\npos(80, 40),\narea(),\n\
    ]);\n```\n\n# Build a Physics playground with Kaboom.js\n\nThis code loads a sprite\
    \ for Kaboom's mascot, and places Bean near the top of the screen. Before we start\
    \ coding, we'll remove the code for Bean, leaving the following lines:\n\n```\
    \ evenimport kaboom from \"kaboom\";\n\n// initialize context\nkaboom();\n\n//\
    \ level\naddLevel({\n  width: 32,\n  height: 32,\n  \"wall\": () => {\n    rect(32,\
    \ 32),\n    color(CYAN),\n    area(),\n    solid(),\n  },\n  \"crate\": () =>\n\
    \    rect(32, 32),\n    color(RED),\n    z(1),\n    outline(1),\n    origin(\"\
    center\"),\n    area(),\n    body(),\n    \"movable\"\n  },\n  \"player\": ()\
    \ => {\n    circle(32),\n    color(GREEN),\n    z(2),\n    outline(2),\n    area({\
    \ width: 64, height: 64 }),\n    body(),\n    origin(\"center\"),\n    {\n   \
    \   speed: 120,\n      jumpspeed: 1000\n    },\n    \"player\"\n  }\n});\n```\n\
    \nThis code uses Kaboom's `addLevel()` function to visually construct level. This\
    \ function takes two arguments: an ASCII art of the level, and a JSON object defining\
    \ the width and height of individual blocks and providing definitions for each\
    \ the objects. Let's take a closer look at all of these definitions, starting\
    \ with the wall object.\n\nA game object definition in Kaboom is a list of components\
    \ and tags, and optionally attributes and functions. Components are a core part\
    \ of Kaboom – they provide different functionality to game objects, from an object's\
    \ appearance to functionality such as collision detection.\n\nThis wall has components:\n\
    \n```\n() () => [\n  rect(32, 32),\n  color(CYAN),\n  area(),\n  solid(),\n];\n\
    ```\n\n- rect(35), which draws a rectangle to represent the object.\n- color(36),\
    \ which gives the rectangle color.\n- area(37), which provides collision detection\
    \ for the object.\n- solid(38), which will prevent other objects from moving past\
    \ it.\n\nWe've given the object tag \"wall\". Objects have multiple tags, which\
    \ can be used to define custom behavior, such as collision detection between objects\
    \ with particular tags.\n\nNext, let's look at the crate definition:\n\n```\n\
    () () => [\n  rect(32, 32),\n  color(RED),\n  z(1),\n  outline(1),\n  origin(\"\
    center\"),\n  area(),\n  body(),\n  \"movable\"\n];\n```\n\nCompared to our wall,\
    \ we've given the crate's z-order(40), ensuring it will be drawn on top of walls.\n\
    \n- outline(41), which will draw a single-pixel outline around the object.\n-\
    \ origin(42), which sets the sprite's origin to \"center\", so that we can move\
    \ it around its center, rather than the default-left corner.\n- body(43), which\
    \ makes our crate subject to gravity.\n\nWe've given it the tag \"movable\", a\
    \ generic tag we can use for all objects that can be manipulated by the player's\
    \ gravity gun.\n\nFinally, let's look at the player object:\n\n```\n() => { //\
    \ player\n  circle(32),\n  color(GREEN),\n  z(2),\n  outline(2),\n  area({ width:\
    \ 64, height: 64}),\n  body(),\n  origin(\"center\"),\n  {\n    speed: 120,\n\
    \    jumpspeed: 1000\n  },\n  \"player\"\n};\n```\n\nNote the following:\n\n-\
    \ As we’re using the circle component to draw the player, we must specify a width\
    \ and height for the area() component. All collision areas in Kaboom.js are rectangular\
    \ (as of v2000.1.6).\n- We’ve added speed and jumpspeed variables to the player\
    \ object, which we’ll use to control its movement speed and jump height.\n\nRun\
    \ your repl now, and you’ll see your level, with player, crates and walls. As\
    \ we’ve placed the player in mid-air, you should see them fall to to the platform\
    \ below, confirming the presence of gravity.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_203_0.png)\n\
    \n> 35https://kaboomjs.com/#rect\n> 36https://kaboomjs.com/#color\n> 37https://kaboomjs.com/#area\n\
    > 38https://kaboomjs.com/#solid\n> 39https://kaboomjs.com/#z\n> 40https://en.wikipedia.org/wiki/Z-order\n\
    > 41https://kaboomjs.com/#outline\n> 42https://kaboomjs.com/#origin\n> 43https://kaboomjs.com/#body\n"
