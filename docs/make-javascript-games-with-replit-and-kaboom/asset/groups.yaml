    \ `BULLET_SPEED` 来定义激光“子弹”飞过屏幕的速度。然后，我们使用 `onKeyPress` 事件来触发发射。注意 `onKeyPress`\
    \ 只在按键按下时调用一次事件处理器，这与我们用于移动的 `onKeyDown` 事件不同。\n\n> ¹¹https://kaboomjs.com/#onKeyPress\n\
    \n这是因为如果玩家需要尽可能快地点击“发射”按钮来击败敌人，比仅仅拥有自动武器更有趣。\n\n`onPress` 处理器使用玩家当前的位置调用 `spawnBullet`\
    \ 函数。该函数负责在正确的方向创建一个新的激光射。方法的前几行调整了子弹的起始位置，使其位于飞船位置的左侧或右侧。这是因为到达中心的位置是飞船中心（记得我们之前添加的\
    \ `origin` 组件）。我们对其稍作调整，使得子弹看起来是从飞船的边缘发射的。\n\n然后，我们使用 `add` 函数向游戏添加一个子弹对象。我们没有使用精灵（sprite），而是绘制了一个任意颜色的矩形（rect）。我们给子弹打了标签（tag），以便在检测到某些东西时引用它。我们还给它设置了一个自定义属性\
    \ `bulletSpeed`，这是我们希望子弹在每一帧中移动的距离。\n\n最后，当玩家射击时添加声音。`play` 函数播放“shoot.wav”。我们略微调低了音量，使其更符合整体混音效果。我们使用带有随机生成器的\
    \ `rand` 参数在每次播放时改变声音的音调。这样做是为了防止声音听起来单调，并让它听起来更有“味道”。\n\n现在我们设置速度使其每帧移动。我们可以通过使用\
    \ `onUpdate` 事件来实现这一点，并使用 `bullet` 标签来识别我们需要更新的对象：\n\n```javascript\nonUpdate(\"\
    bullet\", (b) => {\n  b.move(b.bulletSpeed, 0);\n  if (b.pos.x < 0 || b.pos.x\
    \ > MAP_WIDTH) {\n    destroy(b);\n  }\n});\n```\n\n在每一帧中，`onUpdate` 事件都会更新带有匹配标签（在本例中为\
    \ `bullet`）的对象。我们对子弹调用 `move` 方法，使用为其分配的 `bulletSpeed` 自定义值。我们还检查子弹是否已经离开屏幕，如果是，则销毁它。如果子弹击中平台，我们也需要销毁它。我们可以使用\
    \ `onCollide` 事件来实现这一点：\n\n```javascript\nonCollide(\"bullet\", \"platform\",\
    \ (bullet, platform) => {\n  destroy(bullet);\n});\n```\n\n现在运行代码，你应该已经可以射击了。\n\
    \n## 添加外星虫\n\n现在我们已经有了飞船，而且它可以射击，我们需要一些可以射击的目标。让我们添加一些敌对的外星虫。我们希望它们以相对恒定的流出现，以保持游戏的挑战性。我们还希望它们从不同的侧和角度进入，让玩家保持警惕。我们将添加一个新函数来控制外星虫的生成：\n\
    \n> ²⁶https://docs.replit.com/tutorials/24-space-shooter-kaboom/laser-firing.gif\n\
    \n```javascript\nconst ALIEN_BASE_SPEED = 100;\nconst ALIEN_SPEED_INC = 20;\n\n\
    function spawnAlien() {\n  let alienDirection = choose([directions.LEFT, directions.RIGHT]);\n\
    \  let xpos = (alienDirection == directions.LEFT ? 0 : MAP_WIDTH);\n\n  const\
    \ points_speed_up = Math.floor(player.score / 1000);\n  const alien_speed = ALIEN_BASE_SPEED\
    \ + (points_speed_up * ALIEN_SPEED_INC);\n  const new_alien_interval = 0.8 - (points_speed_up/20);\n\
    \n  add([\n    sprite(\"alien\"),\n    pos(xpos, rand(0, MAP_HEIGHT)),\n    {\n\
    \      speedX: rand(alien_speed * 0.5, alien_speed * 1.5) * (alienDirection ==\
    \ directions.LEFT ? -1 : 1),\n      speedY: rand(alien_speed * 0.1, alien_speed\
    \ * 0.5) * choose([-1, 1]),\n    }\n  ]);\n\n  wait(new_alien_interval, spawnAlien);\n\
    }\n\nspawnAlien();\n```\n\n我们为外星的速度创建了两个参数：基础速率和增量速率。每当玩家获得另一个1000分时，我们增加增量速率。\n\
    \n**提示：** 你可以将这些参数以及我们定义的所有其他参数放在文件顶部，这样如果你想调整游戏参数，就能很容易找到并修改它们。\n\n然后我们定义了 `spawnAlien`\
    \ 函数。为了随机选择外星飞入的一侧，我们使用了 Kaboom 的 `choose` 函数，它会从数组中随机选取一个元素。根据选择的方向，我们可以确定外星在\
    \ x 轴（水平面）上的起始位置。\n\n然后我们进入计算部分，以确定外星应该移动的速度。首先，我们将玩家的分数除以 1000（玩家每获得 1000 分，外星的速度就会增加）。我们通过\
    \ `Math.floor` 函数（JavaScript 内置函数）来去掉小数。得到的结果是 `points_speed_up` 值。\n\n接下来，我们取\
    \ `ALIEN_BASE_SPEED` 并加上乘以其增量速率。\n\n我们还计算了外星生成的新速率，使得外星不仅移动得更快，生成得也更快。\n\n现在我们计算好了基本参数，再次使用\
    \ `add` 函数创建一个新的外星：\n\n- `sprite('alien')` 使用图像创建外星。\n- `pos(xpos, rand(0, MAP_HEIGHT-20))`\
    \ 设置外星的起始位置。我们已经计算了 x pos。我们还为外星添加了 y（垂直）位置，位于地图顶部（位置 0）和底部（MAP_HEIGHT）之间（坐标从屏幕左上角开始）。我们从底部去除了20\
    \ 像素，以考虑到地面。\n- 为该对象添加 \"alien\" 标签，以便在代码的其他部分识别并调用它。\n- 我们还为这个特定的外星添加了一个自定义对象，分解为沿\
    \ x 轴和 y 轴的速度。对于 x 轴的速度，我们添加了一个随机组件，以便不是所有外星的速度都相同。然后，根据外星是向左还是向右跨越屏幕，将速度乘以 -1\
    \ 或 1。\n\n最后，我们使用 Kaboom().wait 函数等待一短时间，然后调用 `spawnAlien` 创建一个新的外星。我们还有一次 `spawnAlien`\
    \ 调用，以便在游戏启动时开始运行。\n\n"
