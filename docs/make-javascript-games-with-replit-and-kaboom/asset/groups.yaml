    # Building Asteroids in Kaboom.js


    Kaboom replies are quite different from other kinds of replies you may have seen
    before: instead of dealing directly with files in folders, you will be dealing
    with scenes, sounds and sprites.


    Before we start coding, we need to upload our sprites and sounds. Download this
    ZIP file⁵ and extract it on your computer. Click the "Files" icon on the sidebar,
    upload everything in Sounds folder to the "sounds" section of your repl, and everything
    in the Sprites folder to the "sprites" section of your repl.


    ![](img/e909780a5f974ff614ba5223d44aa19b_34_0.png)


    Uploading sprites


    Once you''ve uploaded the files, you can click on the "Kaboom" icon in the sidebar,
    and return to the "main" code file.


    # Setting up Kaboom


    To start, we need to initialise and set up Kaboom with the scale we want for the
    game window. Replace the code in main.js with the code below:


    > ⁵https://docs.replit.com/tutorial-files/asteroids-kaboom/asteroids-resources.zip

    ⁶https://docs.replit.com/images/tutorials/23-asteroids-kaboom/upload-sprites.gif'
  - "[PAGE 35]\n\n```\nimport kaboom from \"kaboom\";\nkaboom({\n  scale: 1.5\n});\n\
    ```\n\nThis will give you a canvas with nice checkerboard pattern.\nNow, let's\
    \ load up the sprites and sound files to make them available in the game. This\
    \ code loads each of the graphic elements we use, and gives them a name so we\
    \ can refer to them when we build the game objects:\n\n```\nloadRoot(\"sprites/\"\
    );\nloadSprite(\"space\", \"space.jpg\");\nloadSprite(\"rocket1\", \"rocket1.png\"\
    );\nloadSprite(\"rocket2\", \"rocket2.png\");\nloadSprite(\"rocket3\", \"rocket3.png\"\
    );\nloadSprite(\"rocket4\", \"rocket4.png\");\nloadSprite(\"ship\", \"ship.png\"\
    );\nloadSprite(\"bullet\", \"bullet.png\");\nloadSprite(\"asteroid\", \"asteroid.png\"\
    );\nloadSprite(\"asteroid_small1\", \"asteroid_small1.png\");\nloadSprite(\"asteroid_small2\"\
    , \"asteroid_small2.png\");\nloadSprite(\"asteroid_small3\", \"asteroid_small3.png\"\
    );\nloadSprite(\"asteroid_small4\", \"asteroid_small4.png\");\n\nloadRoot(\"sounds/\"\
    );\nloadSound(\"rocket_thrust\", \"rocket_thrust.wav\");\nloadSound(\"laser\"\
    , \"laser.wav\");\nloadSound(\"explosion\", \"explosion.mp3\");\nloadSound(\"\
    Steamtech-Mayhem-Looping\", \"Steamtech-Mayhem-Looping.mp3\");\n```\n\nThe first\
    \ line, loadRoot5, specifies which folder to load all the sprites and game elements\
    \ from, so we don't have to keeping it for each sprite. Each line loads a sprite\
    \ and gives it a name so we can refer to it in code. We also use similar code\
    \ to load sound elements for our game using the loadSound5 function.\n\n# # Setting\
    \ the scene\n\nA Kaboom.js game is made up of scenes, which you can think of as\
    \ different scenes, levels or stages. You can use scenes for game levels, cut-scenes\
    \ and any other scenes your game might contain. In this tutorial, we will use\
    \ one scene, which will contain the entire game logic.\n\n> 5https://kaboom.js/#loadRoot\n\
    5https://kaboom.js/#loadSound"
- md: "\n# Building Asteroids in Kaboom.js\n\nScenes are further divided into layers,\
    \ which are populated by game objects (also called sprites). The layer object\
    \ determines when it gets drawn and which objects can collide. In this game, we'll\
    \ use three layers: the background layer (bg), the object layer (obj), and UI\
    \ layer (ui). To initialize these layers, add the code to the bottom of the main.js\
    \ file:\n\n```javascript\nscene(\"main\", () => {\n  layers(\n    \"bg\",\n  \
    \  \"obj\",\n    \"ui\"\n  ));\n  // add more scene code here\n});\n```\n\nOn\
    \ the first line we define the main scene, and then we declare the game layers.\
    \ These layers will be drawn in the order. The majority of gameplay will happen\
    \ in the obj layer, so we've set it as the default layer. Any objects we create\
    \ will be placed in this layer unless we specify a different layer when we create\
    \ them.\n\n**Note:** The code snippets that follow should be added within the\
    \ body of the main scene. The bg layer will be drawn first, beneath everything\
    \ else, and we'll use that to specify a background image for our game. By adding\
    \ the following code to the body of the main scene:\n\n```javascript\n// Background\n\
    add([\n  sprite(\"space\"),\n  layer(\"bg\")\n]);\n```\n\nWe're adding a very\
    \ simple game object: the space sprite we uploaded earlier on the background layer.\
    \ Later game objects, such as the player's ship and asteroids, will be more complicated.\
    \ The final layer, ui, is where we will display information such as the player's\
    \ remaining lives and total score. First, we have to declare a global variable\
    \ named score with the following line:\n\n```javascript\nlet score = 0;\n```\n\
    \nNow we'll create an empty object on the UI layer, as follows:\n\n```javascript\n\
    // UI\nadd([\n  layer(\"ui\")\n]);\n```\n\nAlthough Kaboom allows us to create\
    \ objects that display text set once on creation and has to be updated manually,\
    \ which doesn't really make sense for real-time. Instead of that, we'll use our\
    \ object's draw event to draw text containing the current score. After the following\
    \ code:\n\n```javascript\nui.on(\"draw\", () => {\n  drawText({\n    text: \"\
    Score: \" + score,\n    size: 14,\n    font: \"sink\",\n    pos: vec2(8, 24)\n\
    \  });\n});\n```\n\nCallbacks are a key concept in JavaScript and Kaboom makes\
    \ heavy use of them. Some callbacks, such as the one above, are called every frame\
    \ of the game (around 60 times a second). Others are called when specific events\
    \ happen, such as keypresses. Because this callback will be invoked so often,\
    \ our score will always be up to date. Run your reply now and marvel at the emptiness\
    \ of space.\n\n> ⁷https://kaboomjs.com/doc/#text\n⁸https://kaboomjs.com/doc/#event\n\
    ⁹https://en.wikipedia.org/wiki/Callback\n\n# The player's ship\n\nNow let's populate\
    \ empty space. Enter the following code below the UI drawing code to create the\
    \ player:\n\n```javascript\n// The ship\nconst player = add([\n  sprite(\"ship\"\
    ),\n  pos(160, 120),\n  rotate(0),\n  origin(\"center\"),\n  solid(),\n  area(),\n\
    \  \"player\",\n  \"mobile\",\n  \"wraps\",\n  {\n    turn_speed: 4.5,\n    speed:\
    \ 0,\n  }\n]);\n```\n\n```javascript\nmax_thrust: 48,\nacceleration: 2,\ndeceleration:\
    \ 4,\nlives: 3,\ncan_shoot: true,\nlaser_cooldown: 0.5,\ninvulnerable: false,\n\
    invulnerability_time: 3,\nanimation_frame: 0,\nthrusting: false\n}\n```\n\nHere\
    \ we're creating a game object with a number of components, each of which gives\
    \ our object some data or behavior. These are:\n\n- The sprite component, which\
    \ draws the ship sprite.\n- The pos (position) component, which places the player\
    \ near the center of the screen in the Replit browser.\n- The rotate component,\
    \ which sets the ship's origin to \"center\", so that when we rotate the ship,\
    \ it will rotate around the center of its sprite rather than the default top-left\
    \ corner.\n- The area component, which generates the collision area for the ship\
    \ to detect collisions.\n\nFollowing initial configuration, we're giving the player\
    \ object three tags: player, mobile and wraps. Kaboom uses a tagging system to\
    \ apply behavior to objects - you can think of this as similar to multiple inheritance.\
    \ By tagging objects with shared behavior, we can save ourselves from duplicating\
    \ code.\n\nFinally, we assign a number of custom properties to our player object.\
    \ We use these properties to handle a variety of gameplay functions, such as moving\
    \ and shooting. If you run repl now, you will see the ship in the middle of a\
    \ blank screen. In the next section, we'll implement movement controls.\n\n> ⁶⁰\
    \ https://kaboom.com/doc/nadd\n⁶¹ https://kaboom.com/#sprite\n⁶² https://kaboom.com/#pos\n\
    ⁶³ https://kaboom.com/#rotate\n⁶⁴ https://kaboom.com/#origin\n⁶⁵ https://kaboom.com/#area\n\
    ⁶⁶ https://en.wikipedia.org/wiki/Multiple_inheritance\n\n# Score: 0\n\n# Movement\
    \ controls\n\nIn this game, our player will turn the nose of the spaceship with\
    \ the left and right arrow keys, and thrust forward and backward with the up and\
    \ down arrow keys. To turn the ship left and right by pressing the respective\
    \ arrow keys, add the following code:\n\n```javascript\n// Movement keys\nKeyDown(\"\
    left\", () => {\n  player.angle -= turn_speed;\n});\nKeyDown(\"right\", () =>\
    \ {\n  player.angle += turn_speed;\n});\n```\n\nRun your repl now, and you should\
    \ be able to turn the ship left and right. If you think it turns fast or too slow,\
    \ change the value of turn_speed in the player creation. Now let's implement the\
    \ up and down keys, so the player can move around. Enter the following code:\n\
    \n```javascript\nonKeyDown(\"up\", () => {\n  player.speed = Math.min(player.speed\
    \ + acceleration, max_thrust);\n  play(\"rocket_thrust\", {\n    volume: 0.1,\n\
    \    speed: 2.0,\n  });\n});\n```\n\nRather than having the spaceship from zero\
    \ to max speed immediately, we use this to simulate gradual acceleration. To achieve\
    \ this, we use Math.min() to set the player's speed to the minimum between current\
    \ speed plus acceleration and its maximum speed. This will make the ship gradually\
    \ increase speed until it reaches max_thrust. Play around with the values of acceleration\
    \ and max_thrust and see what feels right to you.\n\nAdditionally, we set our\
    \ rocket thrust to play while accelerating. Kaboom allows us to manipulate sounds\
    \ in few different ways, such as changing their speed and volume. We'll handle\
    \ deceleration by doing the opposite to acceleration, using Math.max() to choose\
    \ the maximum between the player's speed minus deceleration, and their maximum\
    \ speed in reverse (i.e. negative). Adding the following code:\n\n```javascript\n\
    onKeyDown(\"down\", () => {\n  player.speed = Math.max(player.speed - deceleration,\
    \ -max_thrust);\n  play(\"rocket_thrust\", {\n    volume: 0.2,\n    speed: 2.0,\n\
    \  });\n});\n```\n\nIf you run your repl now and try to accelerate or decelerate,\
    \ the sound will play, but the ship will go nowhere. This is because we're manipulating\
    \ player.speed, which is a custom property that Kaboom hasn't attached any special\
    \ behavior to (unlike player.angle). Let's add some movement parameters now.\n\
    \n# Movement\n\nMovement in Kaboom and most other 2D game development systems\
    \ is handled using X and Y coordinates on a plane. To move an object left, you\
    \ subtract from its X coordinate, and to move right, you add to its X coordinate.\
    \ To move an object up, you subtract from its Y coordinate, and to move down,\
    \ you add to its Y coordinate. Therefore, basic four-directional movement in games\n"
  mdcn: "\n\n# 在 Kaboom.js 中构建小星游戏\n\n场景被进一步划分为多个层，层由游戏对象（也称为精灵 sprites）填充。层对象决定了它何时被绘制以及哪些对象可以发生碰撞。在\
    \ във游戏中，我们将使用三个层：背景层（bg）、物体层（obj）和 UI 层（ui）。为了初始化这些层，请将以下代码添加到 `main.js` 文件的底部：\n\
    \n```javascript\nscene(\"main\", () => {\n  layers(\n    \"bg\",\n    \"obj\"\
    ,\n    \"ui\"\n  ));\n  // 在此处添加更多场景代码\n});\n```\n\n在第一行中，我们定义了主场景，然后声明了游戏层。这些层将按照顺序绘制。大部分游戏玩法将在\
    \ `obj` 层中进行，因此我们将其设置为默认层。除非我们在创建对象时指定了不同的层，否则我们创建的任何对象都将放置在此层中。\n\n**注意：** 后的代码片段应添加到主场景的主体内部。`bg`\
    \ 层将首先绘制，位于所有其他内容之下，我们将用它来为游戏指定背景图像。通过在主场景体中添加以下代码：\n\n```javascript\n// 背景\n\
    add([\n  sprite(\"space\"),\n  layer(\"bg\")\n]);\n```\n\n我们正在背景层上添加一个非常简单的游戏对象：我们之前上传的太空精灵。稍后的游戏对象，例如玩家的飞船和小行星，将会更加复杂。最后一层\
    \ `ui` 是我们显示信息的地方，例如玩家的剩余生命值和总分。首先，我们必须通过以下行声明一个名为 `score` 的全局变量：\n\n```javascript\n\
    let score = 0;\n```\n\n现在，我们将在 UI 层上创建一个空对象，如下：\n\n```javascript\n// UI\nadd([\n\
    \  layer(\"ui\")\n]);\n```\n\n虽然 Kaboom 允许我们创建在创建时设置一次且必须手动更新的文本显示对象，但这对于实时性来说并并不合理。相反，我们将使用对象的\
    \ `draw` 事件来绘制包含当前分数的文本。在以下代码之后：\n\n```javascript\nui.on(\"draw\", () => {\n \
    \ drawText({\n    text: \"Score: \" + score,\n    size: 14,\n    font: \"sink\"\
    ,\n    pos: vec2(8, 24)\n  });\n});\n```\n\n回调函数是 JavaScript 中的一个核心概念，Kaboom 大量使用了它们。某些回调（例如上面的那个）会在游戏的每一帧中被调用（每秒约\
    \ 60 次）。其他回调会在特定事件发生时（例如按下按键）被调用。由于此回调会被频繁调用，因此我们的分数将始终是最新的。现在运行你的回复并惊叹太空的空旷吧。\n\
    \n> ⁷https://kaboomjs.com/doc/#text\n⁸https://kaboomjs.com/doc/#event\n⁹https://en.wikipedia.org/wiki/Callback\n\
    \n# 玩家的飞船\n\n现在让我们填充太空。在 UI 绘制代码下方输入以下代码来创建玩家：\n\n```javascript\n// 飞船\nconst\
    \ player = add([\n  sprite(\"ship\"),\n  pos(160, 120),\n  rotate(0),\n  origin(\"\
    center\"),\n  solid(),\n  area(),\n  \"player\",\n  \"mobile\",\n  \"wraps\",\n\
    \  {\n    turn_speed: 4.5,\n    speed: 0,\n  }\n]);\n```\n\n```javascript\nmax_thrust:\
    \ 48,\nacceleration: 2,\ndeceleration: 4,\nlives: 3,\ncan_shoot: true,\nlaser_cooldown:\
    \ 0.5,\ninvulnerable: false,\ninvulnerability_time: 3,\nanimation_frame: 0,\n\
    thrusting: false\n}\n```\n\n这里是飞船的属性：\n- `max_thrust: 48`：最大推力。\n- `acceleration:\
    \ 2`：加速度。\n- `deceleration: 4`：减速。\n- `lives: 3`：生命值。\n- `can_shoot: true`：可以射。\n\
