    # 移动控制\n\n във游戏中，我们将通过左右方向键来旋转飞船，通过上下方向键来推推。为了旋转飞船，请添加以下代码：\n\n```javascript\n\
    // 移动键\nKeyDown(\"left\", () => {\n  player.angle -= turn_speed;\n});\nKeyDown(\"\
    right\", () => {\n  player.angle += turn_speed;\n});\n```\n\n现在运行你的回复，你应该能够左右旋转飞船。如果你觉得飞船转得太快或太慢，请修改\
    \ `turn_speed` 的值。现在让我们实现上下方向键，让飞船可以移动：\n\n```javascript\nonKeyDown(\"up\", ()\
    \ => {\n  player.speed = Math.min(player.speed + acceleration, max_thrust);\n\
    \  play(\"rocket_thrust\", {\n    volume: 0.1/\n    speed: 2.0,\n  });\n});\n\
    ```\n\n与其让飞船从零变为最大速度，我们使用这种方式来模拟加速。为了实现这一点，我们使用 `Math.min()` 将速度设置为当前速度加加速度与最大速度之间的最小值。这将让飞船逐渐增加速度，直到达到\
    \ `max_thrust`。\n\n此外，我们设置在加速时播放火箭推力声。Kaboom 允许我们以几种不同的方式处理声音，例如更改速度和音量。我们将通过对加速度的反向操作来处理减速，使用\
    \ `Math.max()` 在玩家速度减减速与最大速度（即负值）之间选择最大值。添加以下代码：\n\n```javascript\nonKeyDown(\"\
    down\", () => {\n  player.speed = Math.max(player.speed - deceleration, -max_thrust);\n\
    \  play(\"rocket_thrust\", {\n    volume: 0.2,\n    speed: 2.0,\n  });\n});\n\
    ```\n\n"
