    \n- 185 https://en.wikipedia.org/wiki/2D\n- 186 https://kaboom.com\n- 187 https://docs.replit.com/tutorials/24-space-shooter-with-kaboom\n\
    - 188 https://docs.replit.com/tutorials/25-3d-game-kaboom/gameplay.gif\n- 189\
    \ https://docs.replit.com/tutorial-files/3d-game-kaboom/3d-game-resources.zip\n\
    \n## 游戏设计\n\n我们从这个游戏中想要的是：\n\n- 深度感以产生三维的幻觉\n- 在整个太空中自由移动的感觉\n\n我们将利用 Kaboom 的\
    \ scale 组件^190 来实现深度感，如果素材较远则表示较小，较近则表示较大。我们将使用算法生成星场来创建一个穿过太空的感觉，就像早期的 Windows\
    \ 屏幕保护。\n\n## 创建新项目\n\n前往 Replit^191 并创建一个 repl。选择 Kaboom 作为你的项目类型。将此 repl 命名为“3D\
    \ Space Shooter”。\n\n![](img/e90780a5f974ff614ba5223d44aa19b_92_0.png)启动后，你应该在“Code”部分看到一个\
    \ main.js 文件。这就是我们开始编码的地方。\n\n> ¹190https://kaboomjs.com/doc/#scale\n>¹191https://replit.com\n\
    \n## 设置 Kaboom 环境\n\nReplit 上的 Kaboom 界面专门用于制作游戏。除了入侵者图标外，你会在文件树中注意到几个特殊文件夹，如“Code”、“Sprites”和“Sounds”。这些特殊文件夹负责加载素材，以及启动和引导游戏所需的所有代码。你可以在此处阅读更多关于\
    \ Kaboom 界面的信息^192。\n\n如果你还没有，请下载包含游戏所有素材和声音的 zip 文件^113。从电脑中解压文件，将素材添加到“Sprites”文件夹，将声音添加到“Sounds”文件夹。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_93_0.png)\n\n点击打开 gif114 设置游戏玩法，我们需要根据游戏窗口所需的尺寸和颜色设置\
    \ Kaboom。将 main.js 中的代码替换为以下代码：\n\n> ¹119 https://docs.replit.com/tutorials/kaboom\n\
    > ¹113 https://docs.replit.com/tutorial-files/3d-game-kaboom/3d-game-resources.zip\n\
    > ¹114 https://docs.replit.com/images/tutorials/25-3d-game-kaboom/upload-sprites.gif\n\
    \n## 在 Kaboom 中构建伪三D 游戏\n\n```\nimport kaboom from \"kaboom\";\nkaboom({\n   \
    \ background: [0, 0, 0],\n    width: 320,\n    height: 200,\n    scale: 2\n});\n\
    ```\n\n在这里我们导入库，并通过调用 `kaboom({ ... })` 初始化上下文。我们设置视图大小为 320x200 像素，并将比例在屏幕上放大一倍。现在，让我们加载游戏所需的素材和声音。以下代码加载每个图形元素，并为它们命名，以便我们在构建游戏角色时引用它们：\n\
    \n```\nloadRoot(\"sprites\")\nloadSprite(\"cockpit\", \"cockpit.png\")\nloadSprite(\"\
    alien\", \"alien.png\")\n\nloadRoot(\"sounds\")\nloadSound(\"shoot\", \"shoot.wav\"\
    )\nloadSound(\"explosion\", \"explosion.wav\")\n```\n\n第一行 `loadRoot^195` 指定从哪个文件夹加载所有素材和游戏元素，我们不需要为每个素材重复输入。然后我们使用类似的代码加载游戏所需的声音，但不是使用\
    \ `loadSprite^196`，而是使用 `loadSound^197` 来加载声音。\n\n## 创建界面层\n\nKaboom 游戏由“场景”（Scenes）组成，类似于关卡或游戏的不同部分和阶段。IDE\
    \ 有默认的“main”场景，我们可以用它编写主游戏代码。每个场景都有多个“层”（Layers），允许我们拥有不影响游戏的背景、主游戏对象（如玩家、子弹、敌人等）以及\
    \ UI 元素（如当前分数和血量）。\n\n将以下代码添加到 main.js 文件以创建 3 个层：“背景 (bg)”、“对象 (obj)”和“用户界面 (ui)”：\n\
    \n"
