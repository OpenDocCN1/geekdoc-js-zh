    - The shield bar is set to green for all other health values, in other words,\
    \ when health is over 50%.\n\nThe final step in the shield health function is\
    \ to check if the shield health is depleted, and end the game if it is.\n\n# Build\
    \ a Space Shooter with Kaboom.js\n\nWhen the game ends, we destroy the spaceship\
    \ to remove it from the scene. Now we have another opportunity to create more\
    \ explosions using the makeExplosion function we built earlier. This time we can\
    \ go big! To make a big impact, we create a for loop to set off 500 explosions\
    \ over the scene for seriously dramatic effect. We use the Kaboom wait() to have\
    \ a small delay between each explosion so they don't all go off at once. Then\
    \ we make each explosion happen at random positions on the map, passing in other\
    \ parameters to the makeExplosion function to set the radius, sub-explosions and\
    \ general size. We also play the explosion sound using Kaboom's play function.\
    \ This we don't adjust the volume down, as we want the sound to be as dramatic\
    \ as possible. We detour randomly to create a true caption and sense of mayhem.\n\
    \nAfter setting off all those sound and visual effects, we wait for 2 seconds\
    \ to settle down, and then use the Kaboom function go() to switch to a new scene,\
    \ endGame, and wait for the player to play again. Add the code below to create\
    \ the endGame scene, at the bottom of the map, below the line go(\"main\",):\n\
    \n```javascript\nscene(\"endGame\", {\n  const MAP_WIDTH = 440;\n  const MAP_HEIGHT\
