    \ m = (b.pos.y - b.targetPos.y) / (b.pos.x - b.targetPos.x);\n  const c = b.targetPos.y\
    \ - m*(b.targetPos.x);\n\n  let newX = b.pos.x + b.bulletSpeed;\n  let newY =\
    \ m * newX + c;\n  b.pos.x = newX;\n  b.pos.y = newY;\n  // Remove the bullet\
