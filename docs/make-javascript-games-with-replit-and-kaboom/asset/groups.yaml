- md: "\n# Building a pseudo-3D game in Kaboom\n\n```\n11 origin('center'),\n12 pos(SCREEN_WIDTH*0.5,\
    \ SCREEN_HEIGHT*0.33),\n13 color(0, 255, 255),\n14 layer(\"ui\")\n]);\n```\n\n\
    This adds 2 lines at a point halfway across the screen, and about 1/3 down the\
