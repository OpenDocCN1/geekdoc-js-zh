    # Building a pseudo-3D game in Kaboom


    Three-dimensional games became popular in the late 80’s and early 90’s with games
    like the early Flight Simulator and Wolfenstein 3D. But these early games were
    really 2.5D, or pseudo-3D¹185; the action takes place in 2 dimensions, and the
    world only appears to be 3D.


    Kaboom.js¹¹⁸⁶⁶ is a 2D game engine, but we can use some of those early game designers’
    techniques to create a pseudo-3D game. This game is roughly based on our 2D space
    shooter game tutorial¹¹⁸⁷ but we’ll use a view from the cockpit of the spaceship
    instead of the side-scrolling view.


    ![](img/e909780a5f974ff614ba5223d44aa19b_91_0.png)


    The finished game


    Click to open gif¹¹⁸⁸⁷


    You can download this zip file¹¹⁸⁹ with all the sprites and sounds you’ll need
    for this tutorial.


    +   ¹¹⁸⁵ https://en.wikipedia.org/wiki/25D

    ¹¹⁸⁶⁶ https://kaboomjs.com

    ¹¹⁸⁷ https://docs.replit.com/tutorials/24-build-space-shooter-with-kaboom

    ¹¹⁸⁸ https://docs.replit.com/tutorials/25-3d-game-kaboom/gameplay.gif

    ¹¹⁸⁹ https://docs.replit.com/tutorial-files/3d-game-kaboom/3d-game-resources.zip'
