    \ 200,\n    scale: 2\n});\n```\n\nHere we import the library, and initialize the\
    \ context by calling kaboom({ ... }). We set the size of the view to 320x200 pixels\
    \ and scale to make the background twice the size on screen. Now, let's load the\
    \ sprites and sounds we will need in this game. The code below loads each of the\
    \ graphic elements we use, and give them a name, so we can refer to them when\
    \ we build the game characters:\n\n```\nloadRoot(\"sprites\")\nloadSprite(\"cockpit\"\
    , \"cockpit.png\")\nloadSprite(\"alien\", \"alien.png\")\n\nloadRoot(\"sounds\"\
    )\nloadSound(\"shoot\", \"shoot.wav\")\nloadSound(\"explosion\", \"explosion.wav\"\
    )\n```\n\nThe first line, loadRoot^195, specifies which folder to load all the\
    \ sprites and game elements from, we don't have to keep typing it in each sprite.\
    \ Then we use similar code to load the sounds we will need in this game, but instead\
    \ of loadSprite^196 we use loadSound^197 to load sounds.\n\n# Creating the interface\
    \ layers\n\nKaboom games are made of \"Scenes\", which are like levels, or different\
    \ parts and stages of a game. The IDE has a default \"main\" scene, which we can\
    \ use for our main game code. Each scene has multiple \"Layers\", allowing us\
    \ to have backgrounds that don't affect the game, main game objects (like the\
    \ player, bullets, enemies, and so on), and UI elements (like the current score\
    \ and health).\n\nAdd the following code to the main.js file to create the 3 layers\
    \ \"Background (bg)\", \"Object (obj)\", \"User Interface (ui)\":\n\n> ^195https://kaboomjs.com/#loadRoot\n\
    196https://kaboomjs.com/#loadSprite\n197https://kaboomjs.com/#loadSound"
- md: "\n```javascript\nlayers({\n  \"bg\",\n  \"obj\",\n  \"ui\",\n  \"obj\"\n});\n\
    ```\n\nThe obj layer is set as the default layer and that's where the game action\
    \ will take place. We'll use the bg layer to draw the star field, as we don't\
    \ interact with the objects on that layer. Then we'll use the ui layer to draw\
    \ fixed foreground objects, the cockpit of the spaceship the player is travelling\
    \ in.\n\n## Creating alien bugs\n\nAs in the 2D version of this game¹⁹⁸ the point\
    \ of our game is to avoid and shoot down exploding alien bugs. This time, instead\
    \ of the bugs coming from the left and right of the screen, we'll make it appear\
    \ as though they are coming toward the player \"inside\" the screen.\n\nTo create\
    \ this effect, we'll start by making the alien bugs small and spread out over\
    \ the screen, and have them get bigger and loom toward the center of the screen\
    \ as they get closer.\n\nWe need a 3D coordinate system to work out how our elements\
    \ should move. We'll create a system like the one in the image below, with 0 for\
    \ all three dimension axes in the center. This is how we'll track the movements\
    \ of the aliens in code. When we draw them to the screen, we'll convert these\
    \ coordinates into the 2D screen coordinate system.\n\n> ¹⁹⁸https://docs.replit.com/tutorials/24-build-space-shooter-with-kaboom\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_96_0.png)\n\nLet's add the following\
    \ code to the main scene file to achieve this:\n\n```javascript\nconst SCREEN_WIDTH\
    \ = 320;\nconst SCREEN_HEIGHT = 200;\nconst ALIEN_SPEED = 200;\nlet aliens = [];\n\
    \nfunction spawnAlien(){\n  const x = rand(0, SCREEN_WIDTH);\n  const y = rand(0,\
    \ SCREEN_HEIGHT);\n  var newAlien = add([\n    sprite(\"alien\"),\n    pos(x,y),\n\
    \    scale(0.2),\n    area(),\n    rotate(0),\n    {\n      xpos: rand(-1*SCREEN_WIDTH/2,\
    \ SCREEN_WIDTH/2),\n      ypos: rand(-1*SCREEN_HEIGHT/2, SCREEN_HEIGHT/2),\n \
    \     zpos: 1000,\n      speed: ALIEN_SPEED + rand(-0.5* ALIEN_SPEED, 0.5*ALIEN_SPEED)\n\
    \    },\n    \"alien\"\n  ]);\n  aliens.push(newAlien);\n}\nloop(0.8, spawnAlien);\n\
    ```\n\nFirst, we define some general constants for the size of the screen and\
    \ the speed at which aliens will move. This way, we don't have to keep remembering\
    \ and typing numbers, and it's easier to change these aspects later if we need\
    \ to. We create an array to hold each alien object so that we can keep track of\
    \ all of them. This will be especially important when we add movement to the aliens.\n\
    \nThe function spawnAlien creates a new alien at a random location on the screen.\
    \ The first lines calculate a random x and y position to place the alien on the\
    \ screen initially. This isn't logically needed, as we'll calculate the alien's\
    \ actual position later from our 3D coordinate system and calculate the projected\
    \ screen position on each frame. But we need to pass a position¹¹⁹ to the add²⁰\
    \ method when we create a new object, so no random position will do.\n\nThere\
    \ are two components we use when constructing the alien object:\n\n- scale¹¹⁹\
    \ allowing us to adjust the size of the alien over time as if it's getting closer,\n\
    - rotate²⁰⁰ allowing us to rotate the aliens so we can simulate 'rolling' when\
