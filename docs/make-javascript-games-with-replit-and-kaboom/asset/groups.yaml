  - "[PAGE 43]\n\n# Building Asteroids in Kaboom.js\n\n+   1 sine(angle) = y / distance\n\
    2 y = distance * sin(angle)\n3\n4 cosine(angle) = x / distance\n5 x = distance\
    \ * cos(angle)\n\nRemember, in Kaboom and take the ship for a spin. You should\
    \ be able to thrust forward and backward, moving according to the ship's nose\
