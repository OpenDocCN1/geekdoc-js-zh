- md: "\n# Building tic-tac-toe with WebSocket and Kaboom.js\n\n```javascript\nrect(400,\
    \ 1),\npos(100, 366),\n);\n```\n\nThis adds 4 rectangles with a width of 1 pixel\
    \ and length of 400 pixels to the screen - each rectangle is more like a line.\
    \ This is how we draw the lines that create the classic tic-tac-toe shape. The\
    \ first 2 rectangles are the vertical lines, and the second 2 are the horizontal\
    \ lines. We place the board closer to the left side of the screen, instead of\
    \ the center, to save space for game information to be displayed on the right\
    \ hand side of the screen.\n\nIf you run the game, and enter your name, you should\
    \ see the board layout like this:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_134_0.png)\n\
    \nWe need to add a way to draw the X and O symbols in each block. To do this,\
    \ we'll add objects with text components in each block of the board. First, we'll\
    \ make an array containing the location and size of each block. Add the following\
    \ code snippets within the \"main\" scene we created above:\n\n```javascript\n\
    const boardSquares = [\n  {index: 0, x: 100, y: 100, width: 133, height: 133},\n\
    \  {index: 1, x: 233, y: 100, width: 133, height: 133},\n  {index: 2, x: 366,\
    \ y: 100, width: 133, height: 133},\n  {index: 3, x: 100, y: 233, width: 133,\
    \ height: 133},\n  {index: 4, x: 233, y: 233, width: 133, height: 133},\n  {index:\
    \ 5, x: 366, y: 233, width: 133, height: 133},\n  {index: 6, x: 100, y: 366, width:\
    \ 133, height: 133},\n  {index: 7, x: 233, y: 366, width: 133, height: 133},\n\
    \  {index: 8, x: 366, y: 366, width: 133, height: 133}\n];\n```\n\nWe can run\
    \ through this array and create a text object that we can when we want to update\
    \ the symbols on the board. Let's create a function to do that.\n\n```javascript\n\
    function createTextBoxesForGrid(){\n  boardSquares.forEach((square)=>{\n    let\
