- md: "\n## Moving the player\n\nLet's write some code to control the player. First,\
    \ we need to retrieve a reference to the player using get();\n\n```javascript\n\
    // player\nplayer = get(\"player\");\n```\n\nNow we'll add code to control the\
    \ player left and right. As we'll use the mouse to control the player's gravity\
    \ gun, it makes sense to control the player with the WASD keys rather than the\
    \ arrow keys. Add the following code:\n\n```javascript\nonKeyDown(\"a\", () =>\
    \ {\n  player.move(-player.speed, 0)\n});\nonKeyDown(\"d\", () => {\n  player.move(player.speed,\
    \ 0)\n});\n```\n\nWe detect the keyDown event for the A key to move the player\
    \ left and the D key to move the right. The move() function automatically checks\
    \ for collisions with solid objects, so the player will only move if there is\
    \ space to do.\n\n```javascript\nonKeyDown(\"w\", () => {\n  if (player.isGrounded())\
    \ {\n    player.jump(player.jumpspeed)\n  }\n});\n```\n\nThe isGrounded() and\
    \ jump() functions are provided by the body() component, making platformer movement\
    \ simple to implement in Kaboom.\n\nRerun your repl (or refresh your repl's web)\
    \ now, and you should be able to move left and right with A and D, and to jump\
    \ with W. If the player jumps off the platform, they will fall out of view. We\
    \ can fix this by having the game camera follow the player. Add the following\
    \ code below your keyboard-handling code:\n\n> https://kaboomjs.com#get  \n> https://kaboomjs.com#onKeyDown\n\
    \n## Build a Physics playground with Kaboom.js\n\n```javascript\n// // camera\
    \ follow player\nplayer.onUpdate(() => {\n  camPos(player.pos);\n});\n```\n\n\
    This code will run every frame and keep the camera focused on the player as they\
    \ move around.\nRefresh your in-repl browser and try it out.\n\n## Pulling objects\
    \ with the gravity gun\n\nNow that we've got our generic platformer functionality\
    \ implemented, it's time to add the gravity gun. The player will aim their gravity\
    \ gun with the mouse. It will have a range, which we'll show as a line. Moving\
    \ objects that fall into that range will have a thicker outline drawn around them.\
    \ When the player holds the right mouse button, objects in range will travel towards\
    \ them, until they reach the end of a secondary, \"holding\" range. Objects in\
    \ the holding range will move with the player until the left mouse button is clicked,\
    \ at point they will be launched into the air. Alternatively, the player can click\
    \ the right mouse button to drop the held object.\n\nIn the code above, we've\
    \ implemented horizontal movement (walking) and vertical movement (jumping). Implementing\
    \ our gravity gun will require us to implement movement at arbitrary angles. To\
    \ end this, we will need to write a couple of helper functions. To the top of\
    \ the page, and add the following code beneath the kaboom(); line:\n\n```javascript\n\
    // helper functions\nfunction angleBetween(p1, p2) {\n  return Math.atan2(p2.y\
    \ - p1.y, p2.x - p1.x);\n}\n\nfunction pointAt(distance, angle) {\n  return vec2(distance*Math.cos(angle),\n\
    \  -distance*Math.sin(angle));\n}\n```\n\nThe first function, angleBetween(),\
    \ uses JavaScript's Math.atan2() to determine the angle two points make with horizontal.\
    \ The second function, pointAt(), uses sines and cosines to determine the point\
    \ at a certain distance and angle.\nNext, we'll add two custom components:\n\n\
    - gravitygun(), which will define attributes and functions for our player's gravity\
    \ gun.\n\n> https://kaboom.js/#onl/update  \n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/atan2\n\
    \n## Build a Physics playground with Kaboom.js\n\n- physics(), which will define\
    \ attributes and functions for the movable objects the gravity gun will manipulate.\n\
    \nAdd the following code for the gravitygun() component beneath your helper function\
    \ definitions:\n\n```javascript\n// custom components\nfunction gravitygun(range,\
    \ hold, firepower) {\n  return {\n    id: \"gravitygun\",\n    require: [\"pos\"\
    ],\n  };\n}\n```\n\nComponents are written as functions that return objects of\
    \ a specific format. Each component should have an id, and a list of components\
    \ it depends on the require attribute. Beyond that, components can have arbitrary\
    \ attributes, which are attached to their parent object, and special functions,\
    \ which will be integrated into the game event loop.\n\nThe only dependency for\
    \ our component is pos(), as it will not work on an object that doesn't have a\
