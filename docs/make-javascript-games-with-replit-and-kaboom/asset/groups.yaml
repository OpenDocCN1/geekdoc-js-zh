    - 太空背景：https://opengameart.org/content/space-background-8180\n- 外星虫：https://opengameart.org/content/8-bit-alien-assets^181\n\
    \n飞船是由 Ritza^182 制作的。\n\n感谢所有创作者通过知识产权许可协议发布他们的资产并允许我们使用它们。\n\n## 接下来可以尝试的内容\n\
