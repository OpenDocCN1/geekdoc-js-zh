    \n收集宝石\n\n点击打开 gif\n\n## 添加背景音乐\n\n有音效很酷，但游戏通常需要背景音乐来将所有声音结合在一起。Kaboom 允许你将音频文件作为背景音乐播放。将此代码添加到\
    \ main.js 底部以播放该轨道：\n\n```\nconst music = play(\"music\");\nmusic.loop();\n```\n\
    \n这首音乐是来自 \"Komiku\" 的 \"Battle of Pogs\"，来自 \"Free music archive^{74}，这是一个你可以在你的游戏中合法使用的音乐资源。\n\
    \n## 玩游戏\n\n恭喜你，完成了这个 Kaboom 游戏的制作！尝试运行并玩一下游戏看看你能得到多少分。你也可以尝试调整参数，看看它们将如何改变游戏性。\n\
