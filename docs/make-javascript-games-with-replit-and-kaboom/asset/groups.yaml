    # Building Snake in Kaboom.js


    The first line we import the kaboom library, and then initialize the context by
    calling kaboom(). This will give us a blank canvas with a nice checkerboard pattern.
    Then we create a constant for the size of each block on our grid. This is just
    so we don''t need to keep typing in the number, and also helps if we want to experiment
    with different block sizes.


    Then we create the game map. The map, or level design, is expressed in an array
    of strings. Each row in the array represents one row on the screen. So, we can
    design visually in text what the map should look like. The width and height parameters
    specify the size of each of the elements in the map. The pos parameter specifies
    where on the screen the map should be place – we choose (0,0), which is the top
    left of the screen, the starting point for the map.


    Then Kaboom.js allows us to draw for each symbol in the text map. We''re only
    using one symbol here, but you can make maps out of many different elements –
    e.g., a symbol for a wall, for water, a symbol for a health kit and so. To tell
    Kaboom.js what to draw for the symbol, we add the symbol as a key, as =, and then
    specify parameters for it. In this code, we draw a red rectangle as piece of the
    boundary wall. The area() component generates the collision area which will be
    useful when we want to check for collision between the snake and wall later on.
    The string wall assigns a tag to each of the pieces of wall drawn, which will
    also help us with collision detection later on.


    If we run this code, we should see the outline of a red square on the screen,
    representing the map.'
- md: "\n# Adding the Snake\n\nNow that we have a map, let's add the snake. The snake\
    \ is made up of a number of blocks moving together. We'll need to keep track of\
    \ these so that we can move them together, so an array¹ would be a good data structure\
    \ to use here.\n\nWe also need to start the snake off with a given size, position\
    \ and direction to move in on the map. It can return to these each time the game\
    \ ends as well. So we should make a function that we can call whenever a new game\
    \ starts, or the old ones, reset the snake to a default position and size.\n\n\
    We'll need to add a few variables and constants that our snake drawing function\
    \ will use. Add these definitions above the `const block_size = 20;` we added\
    \ earlier:\n\n> ¹https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_10_0.png)\n\n# Building Snake in Kaboom.js\n\
    \n```\nconst directions = {\n  UP: \"up\",\n  DOWN: \"down\",\n  LEFT: \"left\"\
    ,\n  RIGHT: \"right\"\n}\n\nlet current_direction = directions.RIGHT;\nlet run_action\
    \ = false;\nlet snake_length = 3;\nlet snake_body = [];\n```\n\nFirst, we define\
    \ an object with properties for each of the allowable directions the snake can\
    \ move. This code checks and changes directions which is easy to read and change,\
    \ compared to just using numbers or strings to define the directions. The variable\
    \ current_direction tracks the snake is moving at any time. We choose a starting\
    \ direction, RIGHT, as its default. run_action is a variable that we will use\
    \ to keep if we are actual in the game, setting or ending the game. The variable\
    \ snake_length keeps track of how long the snake tail becomes - we start it at\
    \ a chosen value of 3. Finally, snake_body holds the screen objects that make\
    \ up the snake's body.\n\nNow we can add a function to spawn, and respawn, the\
    \ snake.\n\n```\nfunction spawnAll(){\n  destroyAll(\"snake\");\n\n  snake_body\
    \ = [];\n  snake_length = 3;\n\n  for (let i = 1; i <= snake_length; i++) {\n\
    \    let segment = add(\n      rect(block_size, block_size),\n      pos(block_size,\
    \ block_size * i),\n      color(0,0,255),\n      area(),\n      \"snake\"\n  \
    \  );\n    snake_body.push(segment);\n  }\n  current_direction = directions.RIGHT;\n\
    }\n\nfunction spawn_all() {\n  run_action = false;\n  wait(0.5, function({\n \
    \   respawn_snake();\n    run_action = true;\n  });\n}\nrespawn_all();\n```\n\n\
    First, the first get gets rid of any existing snake segment objects by using the\
    \ Kaboom.js destroyAll function(). This removes any object with the given tag\
    \ from the game. Then we reset our array to an empty array, and the snake length\
    \ to the default.\n\nThe function sets up a loop to create new snake segments,\
    \ up to the length we specified. It does this by calling the Kaboom.js add method\
    \ which adds a new object to the game. add takes a few parameters, components\
    \ of the object to create. We pass in components to specify how to draw the object\
    \ (using rect()), its color, and a tag \"snake\" to identify the segments when\
    \ we are checking collisions, and updating/removing segments. We also specify\
    \ the position for the segment create. To creating the snake, we ensure it is\
    \ at least one block_size, or block, from the left side, and add each subsequent\
    \ segment more block down per loop. This gives a snake pointing down to start.\
    \ Then we add the new segment to our snake_body array to keep track of it.\n\n\
    Finally, we set a default starting direction for the snake to move.\n\nYou'll\
    \ notice we also add in a function respawn_all, and a call to the function respawn_snake.\
    \ We use the respawn_all to call all of our other respawn functions. We have one\
    \ for the snake, but we will also need one for the food when we add. In the respawn_all\
    \ function, we also take care to set the run_action flag to false, so that no\
    \ updates are made while we are setting or resetting objects. We also wrap the\
    \ calls in a Kaboom.js wait function(), with a small delay of 0.5 seconds. This\
    \ is because when we detect a \"game over\" condition, we don't want to immediately\
    \ reset the game, as it could be a disorienting to player.\n\nRunning the code\
    \ now, you should see a blue line at the top-left side of the map.\n\n- https://kaboomjs.com/doc/#destroyAll\n\
    - https://kaboomjs.com/doc/#add\n- https://kaboomjs.com/doc/#rect\n- https://kaboomjs.com/doc/#wait\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_13_0.png)\n\nStatic snake\n\n# Moving\
    \ the Snake\n\nNow that we've got map boundaries, and a snake drawn on the screen,\
    \ we can work on getting player input and moving the snake around.\n\nKaboom.js\
    \ has a function onKeyPress¹⁷, which can call a supplied function whenever a key\
    \ is pressed. We'll use that to determine which way the player wants to go. Add\
    \ this code to get user input:\n\n> ¹⁷https://kaboomjs.com/doc/#onKeyPress\n\n\
    ```\nonKeyPress(\"up\", () => {\n  if (current_direction != directions.DOWN) {\n\
    \    current_direction = directions.UP;\n  }\n});\n\nonKeyPress(\"down\", () =>\
    \ {\n  if (current_direction != directions.UP) {\n    current_direction = directions.DOWN;\n\
    \  }\n});\n\nonKeyPress(\"left\", () => {\n  if (current_direction != directions.RIGHT)\
    \ {\n    current_direction = directions.LEFT;\n  }\n});\n\nonKeyPress(\"right\"\
    , () => {\n  if (current_direction != directions.LEFT) {\n    current_direction\
    \ = directions.RIGHT;\n  }\n});\n```\n\nFor each the named \"arrow\" keys, we\
    \ set up a function to call if the key is pressed. In each of these functions,\
    \ we check to ensure the new direction input is not the opposite to which the\
    \ snake is currently moving. This is because we don't want to allow the snake\
    \ to reverse. If the input is a legal move, we update the current_direction property\
    \ to the new direction.\n\nNow we need to think about how to make the snake appear\
    \ to move smoothly. A way to do this is to add a block in front of the snake in\
    \ that direction. We'll need to remove a block at the tail-end of the snake. We'll\
    \ need to do this every few seconds so the snake appears to be moving. Kaboom.js\
    \ has a function onUpdate which can be used to update objects on each frame. Add\
    \ the following code, which uses the onUpdate function, to move the snake:\n\n\
    # Building Snake in Kaboom.js\n\n```\nlet move_delay = 0.2;\nlet timer = 0;\n\
    onUpdate(() => {\n  if (run_action) return;\n  timer += dt();\n  if (timer < move_delay)\
    \ return;\n  timer = 0;\n\n  let move_x = 0;\n  let move_y = 0;\n\n  switch (current_direction)\
    \ {\n    case directions.DOWN:\n      move_x = 0;\n      move_y = block_size;\n\
    \      break;\n    case directions.UP:\n      move_x = 0;\n      move_y = -1 *\
    \ block_size;\n      break;\n    case directions.LEFT:\n      move_x = -1 * block_size;\n\
    \      move_y = 0;\n      break;\n    case directions.RIGHT:\n      move_x = block_size;\n\
    \      move_y = 0;\n      break;\n  }\n\n  // Get the last element (the snake\
    \ head)\n  let snake_head = snake_body[snake_body.length - 1];\n\n  snake_body.push(add(\n\
    \    rect(block_size, block_size),\n    pos(snake_head.pos.x + move_x, snake_head.pos.y\
    \ + move_y),\n    color(0,0,255),\n    area(),\n    \"snake\"\n  ));\n\n  if (snake_body.length\
    \ > snake_length) {\n    let tail = snake_body.shift(); // Remove the last of\
    \ the tail\n    destroy(tail);\n  }\n}));\n```\n\nWe set the action to run every\
    \ 0.2 seconds to get smooth movement. The action function updates game objects\
    \ on each frame; we use the dt() function¹ to get the time that has elapsed between\
    \ the previous and current frame, so that we can track if 0.2 seconds has elapsed\
    \ for us to move the snake. If the desired delay has not, we exit early without\
    \ updating; otherwise we reset the timer and execute the code to move the snake.\
    \ You can experiment with different times to see the effect on the game by adjusting\
    \ the value of the move_delay variable. We also check the flag run_action; if\
    \ it is false, we exit early without updating anything. Then, the function defines\
    \ local variables, move_x and move_y, which are relative to the head of the snake.\n\
    \nThe function switches on the value of current direction the snake is heading\
    \ in. For each direction, move_x and move_y are set to 0 or -1 block_size. If\
    \ the snake is moving left or right, we add or subtract a block from the x dimension\
    \ accordingly. The same occurs if the snake is moving up or down, in the y dimension.\n\
    \nAfter the switch, we get the current snake head by indexing the last element\
    \ in the snake body array. Now that we have both the current snake head position\
    \ and the position relative to the snake head to move in, we can create the new\
    \ snake head by adding a new block game object. This is similar to the code we\
    \ used in spawn_snake.\n\nNow all that remains is to remove a block at the tail\
    \ of the snake, using the built-in array shift², which removes the first element\
    \ from an array, and returns that element. Because our 'oldest' part of the snake,\
    \ also known as a tail, is the first element, we shift off the array, and that\
    \ the Kaboom.js destroy function³ to get rid of the segment. We only do this if\
    \ the current length of the snake body array is greater than our desired snake\
    \ length. This means if we increase snake_length, the overall length of the snake\
    \ will also increase. We can use this when we add food to the game.\n\nRunning\
    \ the project now and clicking into the game screen allow you to move the snake\
    \ around. Note that there is no collision detection yet, the snake can go out\
    \ of bounds without consequence.\n\n> ¹https://kaboomjs.com/doc/edt\n\n> ²https://developer.mozilla.org/en-US/docs/JavaScript/Global_Objects/Array/shift\n\
    \n> ³https://kaboomjs.com/doc/destroy\n"
  mdcn: "\n\n# 添加蛇\n\n现在我们已经有了地图，让我们添加蛇吧。蛇是由许多共同移动的方块组成的。我们需要追踪这些方块以便它们一起移动，因此在这里使用数组¹¹是一个很好的数据结构。\n\
    \n我们还需要在游戏开始时赋予蛇给定的尺寸、位置和方向，以便在地图上移动。在每次游戏结束时，它也可以回到这些状态。因此，我们应该创建一个函数，每当新游戏开始或重置旧游戏时调用它，将蛇重置为默认的位置和大小。\n\
    \n我们需要添加几个蛇绘制函数将使用的变量和常量。将这些定义添加到我们之前添加的 `const block_size = 20;` 之上：\n\n> ¹https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_10_0.png)\n\n# 在 Kaboom.js 中构建蛇\n\n\
    ```\nconst directions = {\n  UP: \"up\",\n  DOWN: \"down\",\n  LEFT: \"left\"\
    ,\n  RIGHT: \"right\"\n}\n\nlet current_direction = directions.RIGHT;\nlet run_action\
    \ = false;\nlet snake_length = 3;\nlet snake_body = [];\n```\n\n首先，我们定义了一个对象，包含蛇可以移动的每个允许方向的属性。与仅使用数字或字符串来定义方向相比，这段代码检查并更改方向更容易阅读和修改。变量\
    \ `current_direction` 追踪蛇在任何时刻的移动方向。我们选择 RIGHT 作为默认起始方向。`run_action` 是一个变量，用于记录我们是否正处于游戏中、设置或结束游戏。变量\
    \ `snake_length` 负责追踪蛇尾变得多长——我们将其初始设置为选定的 3。最后，`snake_body` 存储了组成蛇身体的屏幕对象。\n\n\
    现在我们可以添加一个函数来生成（重新生成）蛇。\n\n```\nfunction spawnAll(){\n  destroyAll(\"snake\");\n\
    \n  snake_body = [];\n  snake_length = 3;\n\n  for (let i = 1; i <= snake_length;\
