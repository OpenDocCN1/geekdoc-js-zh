- md: "\n# Build a Space Shooter with Kaboom.js\n\n```javascript\nfunction updateScore(points)\
    \ {\n  player.score += points;\n  scoreText.text = player.score.toString().padStart(6,0);\n\
    \  play(\"score\", {\n    volume: 0.5,\n    detune: rand(-1200, 1200),\n  });\n\
    }\n```\n\nThe updateScore function takes its argument the number of points to\
    \ add to the score and adds them to the player's current score - remember we added\
    \ score as a custom property when we created the player (spaceship) object.\n\n\
    Next we update the scoreText UI element we created previously. The player's score\
    \ is converted to a string using JavaScript's toString() method, which is part\
    \ of every object in JavaScript. It is also modified with padStart(), which makes\
    \ the resulting score exactly 6 digits long, using 0 to put in front of the string\
    \ if the number is smaller than 6 digits long. This makes placeholders for the\
    \ score, and gives a cue to the users as to the maximum score they could reach.\
    \ Finally, we play a little sound to indicate that points have been earned. As\
    \ before, we pitch each sound time using detune() to keep the sound fresh.\n\n\
    To increase the score when the alien hits by a bullet, update the onCollide event\
    \ we added earlier for the bullet alien bug:\n\n```javascript\nonCollide(\"alien\"\
    ,\"bullet\", (alien, bullet) => {\n  makeExplosion(alien.pos, 5, 5, 5);\n  destroy(alien);\n\
    \  destroy(bullet);\n  play(\"explosion\", {\n    volume: 0.2,\n    detune: rand(0,\
    \ 1200),\n  });\n  updateScore(10); // new line\n});\n```\n\nThe next UI element\
    \ to add is the ship's shield health. This would be great as a kind of healthbar-style\
    \ display, that starts out green and turns red when the shield is low. The game\
    \ should end when the shield is fully depleted, as the spaceship is totally destroyed.\n\
    \n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/toString\n\
    > https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart\n\
    > https://kaboomjs.com/doc/\n\n# Build a Space Shooter with Kaboom.js\n\n```javascript\n\
    add([\n  text(\"SHIELD\", { size: 8, font: \"sink\" }),\n  pos(300, 10),\n  origin(\"\
    center\"),\n  layer(\"ui\")\n]);\n\nconst shieldHolder = add([\n  rect(52, 12),\n\
    \  pos(350, 10),\n  color(100, 100, 100),\n  origin(\"center\"),\n  layer(\"ui\"\
    )\n]);\n\nconst shieldHolderInside = add([\n  rect(50, 10),\n  pos(350, 10),\n\
    \  color(0, 0, 0),\n  origin(\"center\"),\n  layer(\"ui\")\n]);\n\nconst shieldBar\
    \ = add([\n  rect(50, 10),\n  pos(325, 5),\n  color(0, 255, 0),\n  layer(\"ui\"\
    )\n]);\n```\n\nFirst, we add a text label so that players know what the bar represents.\
    \ To create the shield bar UI, we use 3 elements:\n\n- A border, or shieldHolder,\
    \ to outline the bar.\n- A black inner block to make the holder look like a thin\
    \ line, shieldHolderInside.\n- The shieldBar itself, which will get shorter as\
    \ the shield is damaged.\n\nNow we need a function to call when we want to update\
    \ the shield's health:\n\n```javascript\nfunction updatePlayerShield() {\n  player.shield\
    \ += shieldPoints;\n  player.shield = Math.max(player.shield, 0);\n  player.shield\
    \ = Math.min(player.shield, 100);\n  shieldBar.width = 50 * (player.shield / 100);\n\
    \  if (player.shield < 20) shieldBar.color = rgb(255,0,0);\n  else if (player.shield\
    \ < 50) shieldBar.color = rgb(255,127,0);\n  else shieldBar.color = rgb(0,255,0);\n\
    \  if (player.shield <= 0) {\n    destroy(player);\n  }\n  for (let i = 0; i <\
    \ 500; i++) {\n    wait(0.01 * i, () => {\n      makeExplosion(vec2(rand(0, MAP_WIDTH),\
    \ rand(0, MAP_HEIGHT)), 5, 10);\n      play(\"explosion\", {\n        detune:\
    \ rand(-1200, 1200)\n      });\n    });\n  }\n  wait(2, () => {\n    go(\"endGame\"\
    );\n  });\n}\n```\n\nThis function has an argument for the number of shieldPoints\
    \ to update the shield by, adjusts the custom shield property on the UI layer.\
    \ It also clamps the minimum and maximum amount the shield can be between 0 and\
    \ 100.\n\nThe function sets the width of the shieldBar (its dimension along the\
    \ x axis) to the percentage of the shield available (player.shield / 100), multiplied\
    \ by the full width of the bar, 50.\n\nThen the function updates the color of\
    \ the bar depending on the health of the shield:\n\n- Less than 20% health, shield\
