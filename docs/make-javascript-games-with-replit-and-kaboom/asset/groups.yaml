    # Adding special behaviors to Mario\n\nNow we've got the basics of all the other\
    \ game elements down, it's time to create a custom component for Mario himself.\
    \ This component will need to do quite a bit, as Mario is the main character.\
    \ Here are the things it need to handle:\n\n- Make Mario get bigger or smaller.\n\
    - Run the \"running\" animation when Mario is running, and change to a standing\
    \ or jumping frame in other cases.\n- \"Freeze\" Mario when he gets to the castle\
    \ or has died, so the player can no longer move him.\n- Handle Mario dying, with\
    \ a classic spring and out of the scene.\n\nOk, here it is, our Mario custom component:\n\
