    \ = m*x_start + (y_target - m*x_target)\ny_start - y_target = m*(x_start - x_target)\n\
    ```\n\n```\nso m = (y_start - y_target) / (x_start - x_target)\n```\n\nNow we\
    \ can solve for c:\nc = y_target - m*x_target\n\nNow that we can advance the bullet's\
    \ current x position by the bullet speed, we can figure out the corresponding\
    \ new y position using the m and c calculated above with our new x position. We\
    \ then need to draw the bullet's new position (pos) with these new values.\n\n\
    We want the bullets to disappear once they hit the target point, so we go to check\
    \ if the bullet has crossed the horizontal axis. If it has, we go to remove the\
    \ bullet from the scene using destroy.\n\nFinally, we have an event handler for\
    \ the space key, which calls the spawnBullet function whenever it is pressed.\n\
    \nTry this out now, and you should be able to shoot some laser bullets into space.\n\
    \n# Checking for collisions\n\nNow that we can shoot bullets, we need to check\
    \ if they hit an alien. If they did, we explode the alien.\n\n```\nconst BULLET_SLACK\
    \ = 10;\nonCollide(\"alien\",\"bullet\", (alien, bullet) => {\n  if (bullet.y\
    \ > SCREEN_HEIGHT+0.33 + BULLET_SLACK) return;\n  makeExplosion(bullet.pos, 5,\
    \ 5, 5);\n  destroy(alien);\n  destroy(bullet);\n});\n```\n\nWe make use of the\
    \ Kaboom event onCollide which is fired when game objects are overlapping or touching\
    \ each other. We pass the tags for the aliens and bullets, so we know when they\
    \ collide.\n\nWe want to limit bullet hits to be only around the target area,\
    \ so that the 3D perspective is kept. But because they could collide at any point\
    \ along the path the bullet takes, we check if the collision has taken place at\
    \ the crosshairs area. Then, if it is in the target zone, we remove both the bullet\
    \ and the alien from the scene, and call a function to create explosion effect.\
    \ This is the same code used in the 2D Space Shooter tutorial.\n\n```\nfunction\
    \ makeExplosion(p, n, size) {\n  for (let i = 0; i < n; i++) {\n    wait(rand(n\
    \ * 0.1), () => {\n      for (let i = 0; i < 2; i++) {\n        add([\n      \
    \    pos(p.add(rand(vec2(-size), vec2(size)))),\n          rect(1, 1),\n     \
    \     scale(1 * size, 1 * size),\n          lifespan(0.1),\n          origin(\"\
    center\")\n        ]);\n      }\n    });\n  }\n}\n```\n\n```\nfunction lifespan(time)\
    \ {\n  let timer = 0;\n  return () => {\n    update();\n    timer += dt();\n \
    \   if (timer >= time) {\n      destroy(this);\n    }\n  }\n}\n```\n\n```\nfunction\
    \ grow(rate) {\n  return {\n    update();\n    const n = rate * dt();\n    this.scale.x\
    \ += n;\n    this.scale.y += n;\n  }\n}\n```\n\nWe won't explain this code here,\
    \ but if you'd like to know how it works, visit the 2D Space Shooter tutorial\
    \ to learn more.\n\nRun this now, and you should be able to shoot the alien bugs\
    \ down.\n"
  mdcn: "\n\n# 在 Kaboom 中构建伪 3D 游戏\n\n```\n11 origin('center'),\n12 pos(SCREEN_WIDTH*0.5,\
    \ SCREEN_HEIGHT*0.33),\n13 color(0, 255, 255),\n14 layer(\"ui\")\n]);\n```\n\n\
    这在屏幕水平中间处、大约屏幕下方 1/3 处添加了两条线，这大致是飞船窗户视野的中心点。由于 Kaboom 没有线条（line）组件，我们实际上是使用 `rect`\
    \ 来绘制宽度为 1 像素的矩形。我们添加了穿过 UI 层的线条，这样它们就会位于外星人和恒星之上。\n\n现在我们有了一个瞄准目标，让我们添加层。我们的玩家将使用空格键进行发射，我们想要一种经典效果：两束激光，分别从飞船的侧边射向同一个点，以产生射向远处、朝向消失点发射的效果。\n\
    \n```\n1 const BULLET_SPEED = 10;\n2 function spawnBullet() {\n3 4 const BULLET_ORIGIN_LEFT\
