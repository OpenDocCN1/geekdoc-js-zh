    \n避免这种情况的一种方法可能是确保我们不在相同的坐标上生成任何两个小行星，但我们可能仍然会生成重叠的小行星。我们需要考虑小行星的大小并防止小行星在任何这些坐标上生成，这会让我们的代码迅速变得复杂。\n\
