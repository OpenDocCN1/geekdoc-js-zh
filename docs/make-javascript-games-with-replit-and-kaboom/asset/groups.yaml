- md: "\n## Building a Mario-like side-scroller with Kaboom.js\n\n```javascript\n\
    player.onCollide(\"badGuy\", (baddie) => {\n  if (baddie.isAlive == false) return;\n\
    \  if (player.isAlive == false) return;\n  if (canSquash) {\n    // Mario has\
    \ jumped on the bad guy:\n    baddie.squash();\n  } else {\n    if (player.isBig)\
    \ {\n      player.smaller();\n    } else {\n      // Mario is dead :(\n      killed();\n\
    \    }\n  }\n});\n```\n\nWe add in a condition at the top of the handler to exit\
    \ early if Mario is not alive.\n\nIn the else case, if Mario did not squash the\
    \ bad guy, we check if we are dealing with bad Mario. If so, Mario World rules\
    \ are that he doesn't die, he gets smaller(). However, if Mario is already small,\
    \ he is unfortunately now dead. We call out to another function killed to handle\
    \ Mario's death scene. Let's add that function:\n\n```javascript\nkilled() {\n\
    \  // Mario is dead :\n  if (player.isAlive == false) return; // Don’t run it\
    \ if mario is already dead\n  player.die();\n  add([\n    text(\"Game Over :\"\
    , { size: 24 }),\n    pos(toCenter(vec(160, 120))),\n    color(255, 255, 255),\n\
    \    origin('center'),\n  ]);\n  wait(2, () => {\n    go(\"start\");\n  });\n\
    }\n```\n\nThis function does a few things. First, we run the code in the die method\
    \ from the custom Mario component. We add text to notify that the game is over.\
    \ We wait for 2 seconds as we pay Mario our final results, and then we go back\
    \ to the start scene to play again.\n\nAnother Mario can die in Mario World if\
    \ he falls off the platform into the void. We can check for this by modifying\
    \ the player.onUpdate handler added earlier for moving the camera:\n\n```javascript\n\
    player.onUpdate(() => {\n  // camera to player\n  var currM = camPos();\n  if\
    \ (currM.x < player.pos.x) {\n    camPos(player.pos.x, currM.y);\n  }\n\n  if\
    \ (player.isAlive && player.grounded()) {\n    canSquash = false;\n  }\n\n  //\
    \ Check if Mario has fallen off the screen\n  if (player.pos.y > height() - 16)\
    \ {\n    killed();\n  }\n});\n```\n\nHere we check if Mario's y-coordinate is\
    \ greater than the height of the Kaboom window, less the size of one platform\
    \ block, which is 16 pixels. If this is the case, it means Mario has fallen off\
    \ the top row of the platform, and therefore has killed().\n\nWe also need to\
    \ update our left and right key handler events to check if Mario is Frozen. In\
    \ this case the handlers should just return early without moving Mario:\n\n```javascript\n\
    onKeyDown(\"right\", () => {\n  if (player.isFrozen) return;\n  player.flipX(false);\n\
    \  player.move(SPEED, 0);\n});\n\nonKeyDown(\"left\", () => {\n  if (player.isFrozen)\
    \ return;\n  player.flipX(true);\n  if (toScreen(player.pos).x > 20) {\n    player.move(-SPEED,\
    \ 0);\n  }\n});\n```\n\n> https://kaboomjs.com/#go\n> https://kaboomjs.com/#height\n\
    \nWe also modify the space key handler to only jump if Mario is still alive\n\n\
    ```javascript\nonKeyPress(\"space\", () => {\n  if (player.isAlive && player.grounded())\
    \ {\n    player.jump();\n    canSquash = true;\n  }\n});\n```\n\nTime to update\
    \ the output and test all these changes out! First thing to test is if Mario grows\
    \ bigger by eating the mushroom. Second thing to check is if Mario gets smaller\
    \ again by colliding with an enemy. Also check if Mario is killed when colliding\
    \ with an enemy when he is small, or when falling off the platform.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_177_0.png)\n\
    \nMario bigger and killed\n\nClick to open gif\n\n> https://docs.replit.com/images/tutorials/32-mario-kaboom/bigger-kill-scenes.gif\n\
    \n## Ending when we get to the castle\n\nThe final thing to do for this tutorial\
    \ is to handle the case when Mario reaches the castle. At this point, Mario is\
    \ at the door, we want him to freeze, a congratulations message to appear to the\
    \ player, and then move on to the next level.\n\nWe can use a regular collision\
    \ handler to check if Mario is at the castle. Notice in the setup for the castle\
    \ in the level we added earlier, we set the collision area of the castle to a\
    \ very narrow, completely vertical line of width 1 pixel and height 240, which\
    \ is the screen height:\n\n```javascript\n\"H\" => [\n  sprite(\"castle\"),\n\
    \  area({ width: 1, height: 240 }),\n  origin(\"center\"),\n  \"castle\"\n];\n\
    ```\n\nThis is so that the collision between Mario and the castle is only registered\
    \ when Mario gets to the door.\n\n```javascript\nplayer.onCollide(\"castle\",\
    \ (castle) => {\n  player.freeze();\n  add([\n    text(\"Game Over : { size: 24\
    \ }),\n    pos(toCenter(vec(160, 120))),\n    color(255, 255, 255),\n    origin('center'),\n\
    \  ]);\n  wait(2, () => {\n    level++;\n    if (level >= levels.length) {\n \
    \     go(\"start\");\n    } else {\n      go(\"game\", level);\n    }\n  });\n\
    });\n```\n\n![](img/e909780a5f974ff614ba5223d44aa19b_178_0.png)\n\nCastle area\n\
    \n## Building a Mario-like side-scroller with Kaboom.js\n\nThe reason we make\
    \ the area of the castle is so that the player can freeze. Then we add a \"Well\
    \ Done!\" message to the center of the screen.\n\n```javascript\nplayer.onCollide(\"\
    castle\", (castle) => {\n  player.freeze();\n  add([\n    text(\"Well Done!\"\
    , { size: 24 }),\n    pos(toCenter(vec(160, 120))),\n    color(255, 255, 255),\n\
    \    origin('center'),\n  ]);\n  wait(2, () => {\n    level++;\n    if (level\
    \ >= levels.length) {\n      go(\"start\");\n    } else {\n      go(\"game\",\
    \ level);\n    }\n  });\n});\n```\n\nNext steps\n\nThere are few things left to\
    \ complete the game:\n\n- Add in scoring. You can check out previous tutorials\
    \ to see how scoring works.\n- Add in sounds and music. If you use classic tracks,\
    \ blasting them as you play.\n\n> https://kaboomjs.com/#add\n> https://kaboomjs.com/#text\n\
    > https://kaboomjs.com/#wait\n> https://kaboomjs.com/#play\n\n## Building a Mario-like\
    \ side-scroller with Kaboom.js\n\n- Add in more levels. This is the really fun\
    \ part, where you create your own levels.\n- Add in more Mario characters.\n\n\
    ## Credits\n\nYou can find the code on GitHub or Replit.\n\n> https://itch.io/super-mario-assets\n\
    > https://github.com/ritza-co/make-javascript-games\n> https://replit.com/@ritza\n\
    \n## Building Flappy Bird in Kaboom.js\n\nFlappy Bird was a smash hit game for\
    \ mobile phones back in 2013-2014. The inspiration behind the app was the challenge\
    \ of bouncing ball on a paddle for long as possible without letting it drop to\
    \ the ground or shoot off the air. At the peak of its success, the game creator\
    \ unexpectedly removed it from all app stores, saying that the game had become\
    \ addictive for many people. In the wake of the removal, many clones were made.\
    \ After a few months, the original author released new versions of the game.\n\
    \nLet's take a trip back to 2014 and create our own clone of Flappy Bird using\
    \ Kaboom! By remaking a game, you can not only learn how to make games, but also\
    \ extend and change the game in any way you like.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_181_0.png)\n\
    \nThe finished game\n\n[Click to open gif](https://docs.replit.com/images/35-flappy-bird/game-play.gif)\n\
    \nThis article is based on video tutorial, with a few small differences. Mainly,\
    \ the Flappy assets (graphics and sound) are no longer available by default in\
    \ Replit Kaboom asset library, but that's OK because we've included them as a\
    \ download here, so you can still use them.\n\n> https://docs.replit.com/images/35-flappy-bird/game-play.gif\n\
    > https://www.youtube.com/watch?v=hgReGdh3xVX\n> tutorial-files/flappy-bird-kaboom/flappy-assets.zip\n"
  mdcn: "\n\n## 使用 Kaboom.js 构建类 Mario 的横向卷轴游戏\n\n```javascript\nplayer.onCollide(\"\
    badGuy\", (baddie) => {\n  if (baddie.isAlive == false) return;\n  if (player.isAlive\
    \ == false) return;\n  if (canSquash) {\n    // Mario 踩中了坏人：\n    baddie.squash();\n\
    \  } else {\n    if (player.isBig) {\n      player.smaller();\n    } else {\n\
    \      // Mario 挂了 :(\n      killed();\n    }\n  }\n});\n```\n\n我们在处理函数的顶部添加了一个条件，如果\
    \ Mario 不处于存活状态则提前退出。\n\n在 `else` 情况中，如果 Mario 没有踩到坏人，我们检查处理的是否不是大状态的 Mario。如果是的话，根据马里奥世界的规则，他不会死，而是会变小\
    \ `smaller()`。然而，如果 Mario 已经很小了，遗憾的是他现在会死。我们调用另一个函数 `killed` 来处理 Mario 的死亡场景。让我们添加该函数：\n\
    \n```javascript\nkilled() {\n  // Mario 挂了 :\n  if (player.isAlive == false) return;\
    \ // 如果 mario 已经死了就不运行它\n  player.die();\n  add([\n    text(\"Game Over :\", {\
    \ size: 24 }),\n    pos(toCenter(vec(160, 120))),\n    color(255, 255, 255),\n\
    \    origin('center'),\n  ]);\n  wait(2, () => {\n    go(\"start\");\n  });\n\
    }\n```\n\n这个函数做了几件事：首先，我们运行自定义 Mario 组件中 `die` 方法的代码。我们添加了文本通知游戏结束。我们等待 2 秒给 Mario\
    \ 最后的结算，然后返回开始场景重新开始。\n\n在马里奥世界中，如果 Mario 掉下平台进入真空也会死。我们可以通过修改之前添加的移动摄像机的 `player.onUpdate`\
    \ 函数来检查这一点：\n\n```javascript\nplayer.onUpdate(() => {\n  // 相机跟随玩家\n  var currM\
    \ = camPos();\n  if (currM.x < player.pos.x) {\n    camPos(player.pos.x, currM.y);\n\
    \  }\n\n  if (player.isAlive && player.grounded()) {\n    canSquash = false;\n\
    \  }\n\n  // 检查 Mario 是否掉出了屏幕\n  if (player.pos.y > height() - 16) {\n    killed();\n\
    \  }\n});\n```\n\n在这里，我们检查 Mario 的 y 坐标是否大于 Kaboom 窗口的高度减去一个平台块的大小（即 16 像素）。如果是这种情况，意味着\
    \ Mario 已经从平台顶排掉落，因此触发了 `killed()`。\n\n我们还需要更新左、右键的处理器事件，以检查 Mario 是否处于冻结（`Frozen`）状态。在这种情况下，处理器应该直接提前返回而不移动\
    \ Mario：\n\n```javascript\nonKeyDown(\"right\", () => {\n  if (player.isFrozen)\
    \ return;\n  player.flipX(false);\n  player.move(SPEED, 0);\n});\n\nonKeyDown(\"\
    left\", () => {\n  if (player.isFrozen) return;\n  player.flipX(true);\n  if (toScreen(player.pos).x\
    \ > 20) {\n    player.move(-SPEED, 0);\n  }\n});\n```\n\n> https://kaboomjs.com/#go\n\
    > https://kaboomjs.com/#height\n\n我们还修改了空格键处理器，只有在 Mario 仍然存活时才跳跃：\n\n```javascript\n\
    onKeyPress(\"space\", () => {\n  if (player.isAlive && player.grounded()) {\n\
    \    player.jump();\n    canSquash = true;\n  }\n});\n```\n\n是时候更新输出并测试这些更改了！首先测试通过吃蘑菇变大。其次测试与敌人碰撞时是否会变小。还要检查在小状态下碰撞敌人或掉落平台时是否会死亡。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_177_0.png)\n\nMario 死亡\n\n点击打开 gif\n\
    \n> https://docs.replit.com/images/tutorials/32-mario-kaboom/bigger-scenes.gif\n\
    \n## 到达城堡\n\n本教程的最后一步是处理 Mario 到达城堡的情况。此时 Mario 到达了门口，我们希望让他冻结，向玩家显示祝贺消息，然后进入下一关。\n\
    \n我们可以使用普通的碰撞处理器来检查 Mario 是否到达城堡。注意在之前的关卡城堡设置中，我们将城堡的碰撞区域设置为非常窄的垂直线，宽度为 1 像素，高度为\
    \ 240（即屏幕高度）：\n\n```javascript\n\"castle\" => [\n  sprite(\"castle\"),\n  area({\
    \ width: 1, height: 240 }),\n  origin(\"center\")\n];\n```\n\n这样一来，只有当 Mario 到达城堡时，它与城堡之间的碰撞会被注册。\n\
    \n```javascript\nplayer.onCollide(\"castle\", (castle) => {\n  player.freeze();\n\
    \  add([\n    text(\"Game Over :\", { size: 24 }),\n    pos(toCenter(vec(160,\
    \ 120))),\n    color(255, 255, 255),\n    origin('center'),\n  ]);\n  wait(2,\
    \ () => {\n    level++;\n    if (level >= levels.length) {\n      go(\"start\"\
    );\n    } else {\n      go(\"game\", level);\n    }\n  });\n});\n```\n\n![](img/e909780a5f974ff614ba5223d44aa19b_178_0.png)\n\
    \n## 城堡区域\n\n我们制作城堡区域是为了让玩家冻结。然后我们在屏幕中心添加一条“Well Done!”的消息。\n\n```javascript\n\
    player.onCollide(\"castle\", (castle) => {\n  player.freeze();\n  add([\n    text(\"\
    Well Done!\", { size: 24 }),\n    pos(toCenter(vec(160, 120))),\n    color(255,\
    \ 255, 255),\n    origin('center'),\n  ]);\n  wait(2, () => {\n    level++;\n\
    \    if (level >= levels.length) {\n      go(\"start\");\n    } else {\n     \
    \ go(\"game\", level);\n    }\n  });\n});\n```\n\n## 后步骤\n\n还有几件事可以完成游戏：\n\n-\
    \ 添加评分系统。你可以查看之前的教程来了解评分是如何工作的。\n- 添加声音和音乐。如果你使用经典曲目，可以在玩时播放它们。\n\n> https://kaboomjs.com/#add\n\
    > https://kaboomjs.com/#text\n> https://kaboomjs.com/#wait\n> https://kaboomjs.com/#play\n\
    \n## 构建类 Mario 卷轴游戏\n\n- 添加更多关卡。这是最有趣的部分，你可以创建自己的关卡。\n- 添加更多 Mario 角色。\n\n## 致谢\n\
    \n你可以在 GitHub 或 Replit 上找到代码。\n\n> https://itch.io/super-mario-assets\n> https://github.com/ritza-co/make-javascript-games\n\
    > https://replit.com/@ritza\n\n## 使用 Kaboom.js 构建 Flappy Bird\n\nFlappy Bird 是\
    \ 2013-2014 年手机上的上的爆款游戏。该应用的灵感来自尽可能让球在拍子上跳动而不让它掉落或飞出屏幕。在成功的巅峰，游戏创造者出意外地从所有应用商店下架了它，声称该游戏对许多人具有成瘾性。下架后，出现了许多克隆版本。几个月后，原作者发布了游戏的新版本。\n\
    \n让我们回到 2014 年，使用 Kaboom 创建自己的 Flappy Bird 克隆版！通过重制游戏，你不仅可以学习如何制作游戏，还可以以你喜欢的方式扩展和改变游戏。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_181_0.png)\n\n完成的游戏\n\n[点击打开 gif](https://docs.replit.com/images/35-flappy-bird/game-play.gif)\n\
    \n本文基于视频教程，有一些细微差别。主要是，Flappy 资源（图形和声音）不再默认在 Replit Kaboom 资源库可用，但没关系，因为我们作为下载项包含在这里，所以你仍然可以使用它们。\n\
    \n> https://docs.replit.com/images/35-flappy-bird/game-play.gif\n> https://www.youtube.com/watch?v=hgReGdh3xVX\n\
    > tutorial-files/flappy-bird-kaboom/flappy-assets.zip\n\n"
