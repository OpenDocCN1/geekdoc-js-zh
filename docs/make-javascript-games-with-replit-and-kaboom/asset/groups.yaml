- md: "\n# Adding Snake Food\n\nWe have a snake, it moves, and a player can steer\
    \ it. Let's add some food that the snake can eat, which will cause it to grow\
    \ longer. Whenever the snake eats the food, we'll have to respawn the food again,\
    \ so let's write the food creation code in a function as well, like we did for\
    \ the snake:\n\n## Building Snake in Kaboom.js\n\n```\nlet food = null;\nfunction\
    \ respawn_food(){\n  let new_pos = rand(vec2(1,1), vec2(13,13));\n  new_pos.x\
    \ = Math.floor(new_pos.x);\n  new_pos.y = Math.floor(new_pos.y);\n  new_pos =\
    \ new_pos.scale(block_size);\n}\n\nif (food) {\n  destroy(food);\n  food = add({\n\
    \    rect(block_size,block_size),\n    color(0,255,0),\n    pos(new_pos),\n  \
    \  area(),\n    \"food\"\n  });\n}\n```\n\nFirstly, we set up a variable food\
    \ so that we can keep track of food objects we create. You can move this variable\
    \ to where we declared other variables, like block_size and snake_body if you\
    \ want to keep them all nearly in the same place.\n\nThen the function respawn_food\
    \ does a few things. In the game of snake, once a food is eaten, another appears\
    \ at a random location on the grid. We'll need a random generator to determine\
    \ the location to place the food. Kaboom.js has a function called rand which we\
    \ can use to find a random position on the screen to place the food. Conveniently,\
    \ the rand function can return 2D vectors as the start and end for the random\
    \ range to generate numbers in, and then return another 2D vector as a result.\n\
    \nWhy do we choose a range of 1-13 for the random position of the food? If you\
    \ look at the map we added earlier, it is 14 spaces across and 14 spaces down.\
    \ The dimensions of our screen are in grid blocks. We don't want to draw over\
    \ the boundaries, we use 1-13 blocks within the map. Now, the rand function returns\
    \ real numbers, with decimals, not integers. This means we need to add Math.floor\
    \ to truncate decimals off the random numbers, as we don't want to place the food\
    \ halfway through a particular grid block. We also need to convert from our grid-coordinates\
    \ to regular screen pixels. This is done by multiplying each coordinate by the\
    \ block_size, which specifies the size of each grid block in pixels. We make use\
    \ of the Kaboom.js scale method on the vec2 class to perform the multiplication.\n\
    \nThe next part of the function checks if the food variable already contains an\
    \ existing object. If it does, we call destroy to remove food from the game. Finally,\
    \ the function creates a new food object by calling the Kaboom.js add function\
    \ to create a new food object at the random position we made.\n\nTo call this\
    \ new respawn_food function, we need to update our respawn_all function, like\
    \ this:\n\n```javascript\nfunction respawn_all(){\n  run_action = false;\n  wait(0.5,\
    \ function(){\n    respawn_snake();\n    respawn_food();\n    run_action = true;\n\
    \  });\n}\n```\n\nRunning the game now shows a green food block positioned somewhere\
    \ randomly on the map:\n\n## Detecting Collisions\n\nNow that we have all the\
    \ objects our game needs – a boundary wall, a snake, and food – we can move on\
    \ to detecting interactions, or collisions, between these objects.\n\nKaboom.js\
    \ has a useful function for helping with this: onCollide. The function takes in\
    \ 2 tags for different game object types, and calls a provided callback function\
    \ if there is a collision of the objects.\n\nLet's start with detecting if the\
    \ snake moves over a food block. Add the code below:\n\n```javascript\nonCollide(\"\
    snake\", \"food\", (s, f) => {\n    snake_length++;\n    respawn_food();\n});\n\
    ```\n\n## Building Snake in Kaboom.js\n\nWe set up the onCollide function with\
    \ tags for the snake, and the food object. Then, in the callback function, snake_length\
    \ is increased by 1, and we call respawn_food to replace the eaten food somewhere\
    \ else on the map.\n\nRunning this, and eating the food, you should see the snake\
    \ grow each time, and the food re-appear on another block:\n\nEating food\n\n\
    Now, we can add similar code to detect if the snake has hit the wall:\n\n```javascript\n\
    onCollide(\"snake\", \"wall\", (s, w) => {\n    run_action = false;\n    shake(12);\n\
    \    respawn_all();\n});\n```\n\n## Building Snake in Kaboom.js\n\nIn the callback\
    \ function, we immediately set the `run_action` flag to false. This is so that\
    \ the code in the move loop does not run and create the appearance of the snake\
    \ stuck in the wall. Then the code calls a cool Kaboom.js effect function `shake()`,\
    \ which \"shakes\" the screen in a way that makes it feel like the snake has crashed\
    \ heavily, and communicates quite effectively that the game is over. Finally,\
    \ we call `respawn_all` to reset all the game objects.\n\nWe can use the same\
    \ code to detect if the snake has hit itself – we just replace the `wall` tag\
    \ with another snake tag:\n\n```javascript\nonCollide(\"snake\", \"snake\", (s,\
    \ t) => {\n  run_action = false;\n  shake(12);\n  respawn_all();\n});\n```\n\n\
    Running the game now, and crashing into the wall should look like this:\n\n##\
    \ Building Snake in Kaboom.js\n\nCongratulations! You've finished Snake in Kaboom.js!\n\
