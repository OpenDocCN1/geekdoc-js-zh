  - "[PAGE 36]\n\n# Building Asteroids in Kaboom.js\n\nScenes are further divided\
    \ into layers, which are populated by game objects (also called sprites). The\
    \ layer object is on determine when it gets drawn and which objects can collide.\
    \ In this game, we'll use three layers: the background layer (bg), the object\
    \ layer (obj), and UI layer (ui). To initialize these layers, add the code to\
    \ the bottom of the main.js file:\n\n```\nscene(\"main\", () => {\n  layers(\n\
    \    \"bg\",\n    \"obj\",\n    \"ui\"\n  ));\n  // add more scene code here\n\
    });\n```\n\nOn the first line we define the main scene, and then we declare the\
    \ game layers. These layers will be drawn in the order. The majority of gameplay\
    \ will happen in the obj layer, so we've set as the default layer. Any objects\
    \ we create will be placed in this layer, unless we specify a different layer\
    \ when we create the object.\n\n> **Note:** The code snippets that follow should\
