    \n既然我们已经添加了射击，我们需要添加一些可以射击的东西。小行星会撞击空间和彼此，小行星系统的密度足以让碰撞频繁发生。\n\n有三种类型的碰撞需要我们考虑：\n\
    \n- 玩家与小行星：会导致玩家损失生命。\n- 子弹与小行星：会销毁它们。\n- 小行星与小行星：会导致它们相互碰撞。\n\n让我们先处理玩家与小行星的碰撞，在玩家生命耗尽之前，在主场景中添加以下代码来减少生命：\n\
