- md: "\n# Build a Space Shooter with Kaboom.js\n\n## Adding Laser Guns\n\nBecause\
    \ the game takes place in outer space, the weapon of choice is a laser gun. We'll\
    \ need to add functions to create the bullet when the players fire, and to control\
    \ the direction of the bullets. We'll also need to add another key handler to\
    \ check when the player presses a key to \"fire\", which is the space key in this\
    \ game.\n\n```javascript\nconst BULLET_SPEED = 400;\n\nonKeyPress(\"space\", ()\
    \ => {\n  spawnBullet(player.pos);\n});\n\nfunction spawnBullet(bulletpos) {\n\
    \  if (current_direction == directions.LEFT){\n    bulletpos = bulletpos.sub(10,0);\n\
    \  } else if (current_direction == directions.RIGHT){\n    bulletpos = bulletpos.add(10,0);\n\
    \  }\n  add([\n    rect(6, 2),\n    pos(bulletpos),\n    origin(\"center\"),\n\
    \    color(255, 255, 255),\n    area(),\n    \"bullet\",\n    {\n      bulletSpeed\
    \ : current_direction == directions.LEFT?-1*BULLET_SPEED:BULLET_SPEED\n    }\n\
    \  ]);\n}\n\nplay(\"shoot\", {\n  volume: 0.2,\n  detune: rand(-1200, 1200),\n\
    });\n```\n\nFirst, we add a constant BULLET_SPEED to define the speed at which\
    \ the laser \"bullets\" fly across the screen. Then we use the onKeyPress event\
    \ to trigger the shooting. Notice onKeyPress only calls the event handler once\
    \ as the key is pressed, unlike the onKeyDown event we used for moving.\n\n> ¹¹https://kaboomjs.com/#onKeyPress\n\
    \nis because it's more fun if the player needs to bash the “fire” button as fast\
    \ as possible to take down an enemy, rather than just having automatic weapons.\n\
    \nThe onPress handler calls the spawnBullet function with the player's current\
    \ position. This function handles creating a new laser shot in the correct direction.\
    \ The first few lines of the method adjust the bullet's starting position to the\
    \ left or right of the spaceship's position. This is because the position of the\
    \ spaceship that gets to the center is the center of the spaceship (remember the\
    \ origin component we added to it earlier). We adjust it a little so that the\
    \ bullet looks like it is coming from the edge of the spaceship.\n\nThen we add\
    \ a bullet object to the game using the add function. We don't use a sprite for\
    \ the bullet, but draw a rect with any color. We tag the bullet so we can refer\
    \ to it later when detecting something. We also give it a custom property, bulletSpeed,\
    \ which is the distance we want the bullet to move on each frame.\n\nFinally,\
    \ we add sound when the player shoots. The play function plays “shoot.wav”. We\
    \ adjust the volume down a bit, so it fits better with the overall mix. We use\
    \ rand parameter with a random generator to change the pitch of the sound each\
    \ time it's played. This is so the sound doesn't become repetitive and also makes\
    \ it “spicy\".\n\nNow we set the velocity to make it move each frame. We can do\
    \ this using onUpdate event, using the bullet tag to identify the objects we want\
    \ to update:\n\n```javascript\nonUpdate(\"bullet\", (b) => {\n  b.move(b.bulletSpeed,\
    \ 0);\n  if (b.pos.x < 0 || b.pos.x > MAP_WIDTH) {\n    destroy(b);\n  }\n});\n\
    ```\n\nWith each frame, the onUpdate event updates the objects with the matching\
    \ tag, in this case bullet. We call move on the bullet, using the custom value\
    \ for bulletSpeed that we assigned to it. We also check to see if the bullet has\
    \ gone off screen, and if so, we destroy it. We also need to destroy the bullet\
    \ if it hits a platform. We can do this using the onCollide event:\n\n```javascript\n\
    onCollide(\"bullet\", \"platform\", (bullet, platform) => {\n  destroy(bullet);\n\
    });\n```\n\nRun the code now, and you should be able to shoot.\n\n## Adding Alien\
    \ Space Bugs\n\nNow that we have a spacecraft, and it can shoot, we need something\
    \ to shoot at. Let's add some hostile alien space bugs. We'll want to have them\
    \ coming in a relatively constant stream to keep the game challenging. We also\
    \ want them coming in from different sides and angles to keep the player on their\
    \ toes. We'll add a new function to control the creation of alien space bugs:\n\
    \n> ²⁶https://docs.replit.com/tutorials/24-space-shooter-kaboom/laser-firing.gif\n\
    \n```javascript\nconst ALIEN_BASE_SPEED = 100;\nconst ALIEN_SPEED_INC = 20;\n\n\
    function spawnAlien() {\n  let alienDirection = choose([directions.LEFT, directions.RIGHT]);\n\
    \  let xpos = (alienDirection == directions.LEFT ? 0 : MAP_WIDTH);\n\n  const\
    \ points_speed_up = Math.floor(player.score / 1000);\n  const alien_speed = ALIEN_BASE_SPEED\
    \ + (points_speed_up * ALIEN_SPEED_INC);\n  const new_alien_interval = 0.8 - (points_speed_up/20);\n\
    \n  add([\n    sprite(\"alien\"),\n    pos(xpos, rand(0, MAP_HEIGHT)),\n    {\n\
    \      speedX: rand(alien_speed * 0.5, alien_speed * 1.5) * (alienDirection ==\
    \ directions.LEFT ? -1 : 1),\n      speedY: rand(alien_speed * 0.1, alien_speed\
    \ * 0.5) * choose([-1, 1]),\n    }\n  ]);\n\n  wait(new_alien_interval, spawnAlien);\n\
    }\n\nspawnAlien();\n```\n\nWe create 2 parameters for the alien's speed: a base\
    \ rate and an incremental rate. Each time the player gains another 1000 points,\
    \ we'll add to the incremental rate.\n\n**Tip:** You can put these parameters\
    \ and all the others we have defined at the top of the file, so they are easy\
    \ to find and adjust if you want to tweak the game parameters.\n\nThen we define\
    \ the spawnAlien function. To randomly choose the side of the alien will fly in,\
    \ we use the Kaboom choose function, which picks an element at random from an\
    \ array. From the chosen direction, we can determine the alien's starting position\
    \ on the x axis (horizontal plane).\n\nThen we go into the calculation to figure\
    \ out the speed that the alien should move. At first, we divide the player's score\
    \ by 1000 (alien speed increases with every 1000 points the player earns). We\
    \ get rid of decimals by using the Math.floor function, which is built into JavaScript.\
    \ Our result is the points_speed_up value.\n\nNext we take ALIEN_BASE_SPEED and\
    \ add the incremental rate multiplied by points_speed_up.\n\nWe also calculate\
    \ a new rate at which aliens are spawned, making the aliens not only faster at\
    \ moving, but faster at respawning.\n\nNow that we've calculated our basic parameters,\
    \ we create a new alien using the add function again:\n\n- sprite('alien') creates\
    \ the alien with the image.\n- pos(xpos, rand(0, MAP_HEIGHT-20)) sets the starting\
    \ position of the alien. We calculated the x pos from the chosen direction. We\
    \ also add a y (vertical) position for the alien, between the top (position 0)\
    \ of the map, and the bottom (MAP_HEIGHT) of the map (coordinate starts from the\
    \ top left of the screen). We remove 20 pixels from the bottom, to account for\
    \ ground.\n- We add the \"alien\" tag to the object, so we can identify and call\
    \ it in other parts of the code.\n- We also add a custom object of this particular\
    \ alien, broken into it speed along the x and y axis. For the speed along the\
    \ x axis speed, we add a random component so that not all aliens move at the same\
    \ speed. We then multiply the speed by -1 or 1 depending on whether the alien\
    \ is moving left or right across the screen.\n\nFinally, we use Kaboom().wait\
    \ function to wait a short amount of time before calling spawnAlien to create\
    \ a new alien. We also have a call to spawnAlien to get it started when the game\
    \ starts.\n"
