    ^184 https://replit.com/@ritza/Space-Shooter-new\n\n## 在 Kaboom 中构建伪三D 游戏\n\n\
    三维游戏在 80 年代末和 90 年代初随着《飞行模拟器》和《毁灭战士3D》等游戏流行起来。但这些早期游戏实际上是 2.5D 或伪三D^185；动作发生在二维，但世界看起来是三维的。\n\
    Kaboom.js^186 是一个二维游戏引擎，但我们可以使用那些游戏设计者的技术来创建一个伪三D游戏。这个游戏大致基于我们的二维太空射击游戏^187，但我们将使用驾驶舱视图而不是侧屏视图。\n\
