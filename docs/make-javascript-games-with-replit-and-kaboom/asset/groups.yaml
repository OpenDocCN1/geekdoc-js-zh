- md: "\n# Build a Space Shooter Kaboom.js\n\n## Setting up Kaboom\n\nTo start, we\
    \ need to set up Kaboom with the screen size and colors we want for the game window.\n\
    Replace the code in main.js with the code below:\n\n```javascript\n1 import kaboom\
    \ from \"kaboom\";\n2 kaboom({\n3 background: [0, 0, 0],\n4 width: 240,\n5 height:\
    \ 275,\n6 scale: 1.5\n7\n8 });\n```\n\nHere we import the kaboom library, and\
    \ then initialize the context by calling kaboom({ ... }). We also set the size\
    \ of the view to 440x275 pixels and scale the background by a factor of 1.5 on\
    \ screen. Now, let's load the sprites and sounds we will need in this game. This\
    \ code loads each of the graphic elements we use, and gives them a name, so we\
    \ can refer to them when we build the game characters:\n\n```javascript\n1 loadSprite(\"\
    sprites/\");\n2 loadSprite(\"stars\", \"stars.png\");\n3 loadSprite(\"gem\", \"\
    gem.png\");\n4 loadSprite(\"spaceship\", \"spaceship.png\");\n5 loadSprite(\"\
    alien\", \"alien.png\");\n6\n7 loadRoot(\"sounds/\");\n8 loadSound(\"shoot\",\
    \ \"shoot.wav\");\n9 loadSound(\"score\", \"score.wav\");\n10 loadSound(\"music\"\
    , \"music.mp3\");\n11 loadSound(\"explosion\", \"explosion.wav\");\n```\n\nThe\
    \ first line, loadRoot¹, specifies which folder to load all the sprites and game\
    \ elements from, so we don't have to keep typing it for each sprite. Each such\
    \ line loads a game sprite and gives it a name that we can refer to in code later.\
    \ We use similar code to load the sounds we will need in this game, but instead\
    \ of loadSprite² we loadSound³ to load sounds.\n\n> ¹https://kaboomjs.com/#loadRoot\n\
    ²https://kaboomjs.com/#loadSprite\n³https://kaboomjs.com/#loadSound\n⁴https://kaboomjs.com/#scene\n\
    \n## Adding the main game scene\n\nKaboom \"scenes\"⁴ allow us to group logic\
    \ and levels together. In this game we'll have 2 scenes:\n\n- A \"main\" scene,\
    \ which will contain the game levels and all the logic to move the spaceship.\n\
    - An \"endGame\" scene which will display when the game is over.\n\n```javascript\n\
    scene(\"main\", () => {\n  layers({\n    \"bg\",\n    \"obj\",\n    \"ui\",\n\
    \  ], \"obj\");\n\n  add({\n    sprite(\"stars\"),\n    layer(\"bg\")\n  });\n\
    \n  // todo.. add main scene code\n});\n\ngo(\"main\");\n```\n\nWe define the\
    \ scene using the scene¹⁰⁵ \"object\". This function takes a string as the scene\
    \ name - we're calling the scene \"main\".\n\nThen we create 3 layers: \"background\"\
    \ (bg), \"obj\" and \"user interface\" (ui). The obj layer is set as the default\
    \ layer. Then we add the stars to the background layer.\n\nFinally, we use the\
    \ go¹⁰⁶ function to go to the main scene when the game starts up.\n\n**Note**:\
    \ The code snippets in the sections that have to be added within the body of the\
    \ main scene unless specified otherwise.\n\n## Creating the Game Map\n\nLet's\
    \ create a scene layout, or map, drawn on the screen. This will define the ground\
    \ and platforms in the game.\n\nKaboom has built-in support for defining game\
    \ maps using text and the function addLevel¹⁰⁷. This takes away lot of hassle\
    \ normally involved in loading and rendering maps.\n\nThe code below creates the\
    \ game map. Add it to the main.js file, within the main scene (below the code\
    \ to add the stars to the background layer).\n\n> ¹⁰⁵https://kaboomjs.com/#scene\n\
    ¹⁰⁶https://kaboomjs.com/#go\n¹⁰⁷https://kaboomjs.com/doc/#addLevel\n\n```javascript\n\
    // Game Parameters\nconst MAP_WIDTH = 440;\nconst MAP_HEIGHT = 275;\nconst BLOCK_SIZE\
    \ = 11;\n\nconst map = addLevel([\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\"\
    , \"\", \"\",\n  \"\", \"\", \"\", \"\", \"ppccccc\",\n  \"\", \"\", \"\", \"\"\
    , \"\", \"\", \"\", \"\", \"\",\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\
    \", \"\",\n  \"ppccccc\",\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\
    \",\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\",\n  \"====================================\"\
    ,\n  \"\",\n], {\n  width: BLOCK_SIZE,\n  height: BLOCK_SIZE,\n  pos: vec2(0,\
    \ 0),\n  \" =>\": {\n    rect(BLOCK_SIZE, BLOCK_SIZE),\n    color(150, 75, 0),\n\
    \    \"ground\",\n    area(),\n    solid()\n  }\n});\n```\n\n```javascript\n\"\
    p\": () => [\n  rect(BLOCK_SIZE, BLOCK_SIZE),\n  color(0,0,255),\n  \"platform\"\
    ,\n  area(),\n  solid()\n],\n\"-\": () => [\n  rect(BLOCK_SIZE/10, BLOCK_SIZE),\n\
    \  color(0,0,0),\n  \"boundary\",\n  area(),\n  solid()\n]\n});\n```\n\nFirst,\
    \ we add some game parameters which we'll use when we define the size of the map,\
    \ and the default block size for elements.\n\nNext, we create the game map. The\
    \ map, or level design, is expressed in an array of strings. Each row represents\
    \ one row on the screen, so we can design visually what the map should look like.\
    \ The width and height parameters specify the size of each element. The pos parameter\
    \ specifies where the map should be placed – we choose (0,0), which is the top\
    \ left of the screen, as the starting point for the map.\n\nKaboom allows us to\
    \ specify what to draw for each element in the map. You can make different elements,\
    \ e.g. a wall, a ground, a platform, and so on. To tell Kaboom what to draw, we\
    \ add a key, and then specify parameters for it.\n\nIn this code, we have 3 types\
    \ of fixed elements: representing the ground, representing platforms, and representing\
    \ the invisible boundaries. This grouping together allows us to refer to them\
    \ collectively.\n\nIf we run the code, we should see the game map like this:\n\
    \n## Adding the spaceship\n\nLet's add the spaceship using the `add`¹⁰⁸ function:\n\
    \n```javascript\nconst player = add([\n  sprite(\"spaceship\"),\n  pos(100, 200),\n\
    \  body(),\n  area(),\n  scale(1),\n  rotate(0),\n  origin(\"center\"),\n  \"\
    player\",\n  {\n    score: 0,\n    shield: 100\n  }\n]);\n```\n\nThe `add`¹⁰⁹\
    \ function constructs a game object using different components, e.g. pos, body,\
    \ scale. Each of these components gives the object features.\n\n> ¹⁰⁸https://kaboomjs.com/doc/#add\n\
    ¹⁰⁹https://kaboomjs.com/doc/#add\n\n## Build a Space Shooter with Kaboom.js\n\n\
    Notably, the body component makes the object react to gravity: the spaceship falls\
    \ if it's not on the ground or a platform. The rotate component allows us to tilt\
    \ the spaceship in the direction the player wants to go, providing feedback. By\
    \ default, all operations are calculated around the top left corner of objects.\
    \ To make the tilt work, we add the origin component and set it to center, so\
    \ that the tilts adjust from the center of the object.\n\nKaboom also allows us\
    \ to attach custom data to a game object. We've added score to hold the player's\
    \ latest score, and shield to hold the ship's protection still available. We can\
    \ adjust these as the player picks up items or crashes into them.\n\nWhen we created\
    \ the map, we added the solid component to map objects. This component marks objects\
    \ as solid, meaning other objects can't move past them.\n\n## Moving the spaceship\n\
    \nWe'll allow a few different moves for the spaceship: change direction left or\
    \ right and fly up. We also need to keep track of which way the spaceship is facing,\
    \ so we'll know which side to shoot lasers from.\n\nTo handle the changing and\
    \ tracking of direction, we add the following code:\n\n```javascript\nconst directions\
    \ = {\n  LEFT: \"left\",\n  RIGHT: \"right\"\n}\n\nlet current_direction = directions.RIGHT;\n\
    \nkeyDown(\"left\", () => {\n  player.flip(-1);\n  player.angle = -11;\n  current_direction\
    \ = directions.LEFT;\n  player.move(-100,0);\n});\n\nkeyDown(\"right\", () =>\
    \ {\n  player.flip(1);\n  player.angle = 11;\n  current_direction = directions.RIGHT;\n\
    \  player.move(100,0);\n});\n```\n\n> ¹¹⁰https://kaboomjs.com/doc/body\n¹¹¹https://kaboomjs.com/doc/rotate\n\
    ¹¹²https://kaboomjs.com/doc/origin\n¹¹³https://kaboomjs.com/doc/shield\n\n```javascript\n\
    onKeyRelease(\"left\", () => {\n  player.angle = 0;\n});\n\nonKeyRelease(\"right\"\
    , () => {\n  player.angle = 0;\n});\n```\n\nFirst, we create a constant object\
    \ defining the direction our game allows. Then we create a variable to track the\
    \ `current_direction` the spaceship is facing.\n\nThen we add the key-handling\
    \ code. The key names left and right refer to the left and right arrow keys on\
    \ the keyboard. Kaboom provides the onKeyDown¹¹ event, which lets us know if a\
    \ certain key is being pressed. We create onKeyDown event handlers for each of\
    \ the arrow keys. As long as the given key is held down, onKeyDown calls the event\
    \ handler repeatedly.\n\nThe code inside each onKeyDown event does the following:\n\
    \n- The flipX function mirrors the player's spaceship image so that it looks depending\
    \ on the direction it is facing. We use -1 to flip it and 1 for right.\n- The\
    \ function player.angle slightly tilts the spaceship while the key is being held\
    \ down so the spaceship looks like it is about to move in the given direction.\n\
    - The current_direction tracking variable is updated. We'll use this variable\
    \ when we add shooting.\n- The move function moves the spaceship in the given\
    \ direction.\n\nNow we want to have the spaceship fly up when we press the up\
    \ arrow key. To do this, we'll take advantage of Kaboom's jump¹¹ attribute (which\
    \ is part of the body¹¹ component) and repurpose it for flying up. The following\
    \ code to the main scene:\n\n```javascript\nonKeyDown(\"up\", () => {\n  player.jump(100);\n\
    });\n```\n\n> ¹¹https://kaboomjs.com/#onKeyDown\n¹¹https://kaboomjs.com/doc#body\n\
    ¹¹https://kaboomjs.com/doc#body\n"
  mdcn: "\n\n# 使用 Kaboom.js 构建一个太空射击游戏\n\n## 设置 Kaboom\n\n首先，我们需要根据游戏窗口所需的屏幕尺寸和颜色来设置\
    \ Kaboom。\n将 `main.js` 中的代码替换为以下代码：\n\n```javascript\n1 import kaboom from \"\
    kaboom\";\n2 kaboom({\n3 background: [0, 0, 0],\n4 width: 240,\n5 height: 275,\n\
    6 scale: 1.5\n7\n8 });\n```\n\n在这里我们导入了 `kaboom` 库，然后通过调用 `kaboom({ ... })` 初始化上下文。我们还设置了视图为\
    \ 440x275 像素，并将背景在屏幕上缩放 1.5 倍。现在，让我们加载游戏所需的精灵和音效。这段代码加载了我们使用的每个图形元素，并为它们赋予了名称，以便我们可以在构建游戏角色时引用它们：\n\
    \n```javascript\n1 loadSprite(\"sprites/\");\n2 loadSprite(\"stars\", \"stars.png\"\
    );\n3 loadSprite(\"gem\", \"gem.png\");\n4 loadSprite(\"spaceship\", \"spaceship.png\"\
    );\n5 loadSprite(\"alien\", \"alien.png\");\n6\n7 loadRoot(\"sounds/\");\n8 loadSound(\"\
    shoot\", \"shoot.wav\");\n9 loadSound(\"score\", \"score.wav\");\n10 loadSound(\"\
    music\", \"music.mp3\");\n11 loadSound(\"explosion\", \"explosion.wav\");\n```\n\
    \n第一行 `loadRoot`¹ 指定了从哪个文件夹加载所有精灵和游戏元素，这样我们就不需要为每个精灵都重复输入路径。每一行这样的代码都会加载一个游戏精灵，并给它一个稍后在代码中引用的名称。我们使用类似的代码来加载游戏所需的音效，但不是使用\
    \ `loadSprite`²，而是使用 `loadSound`³ 来加载声音。\n\n> ¹https://kaboomjs.com/#loadRoot\n\
    ²https://kaboomjs.com/#loadSprite\n³https://kaboomjs.com/#loadSound\n⁴https://kaboomjs.com/#scene\n\
    \n## 添加主游戏场景\n\nKaboom 的“场景”（scenes）⁴允许我们把逻辑和关卡组合在一起。在这个游戏中，我们将拥有2 个场景：\n\n- 一个“main”（主）场景，它包含游戏关卡以及移动飞船的所有逻辑。\n\
    - 一个“endGame”（游戏结束）场景，它会在游戏结束时显示。\n\n```javascript\nscene(\"main\", () => {\n\
    \  layers({\n    \"bg\",\n    \"obj\",\n    \"ui\",\n  ], \"obj\");\n\n  add({\n\
    \    sprite(\"stars\"),\n    layer(\"bg\")\n  });\n\n  // todo.. 添加主场景代码\n});\n\
    \ngo(\"main\");\n```\n\n我们使用 `scene`¹⁰⁵ 对象对象来定义场景。此函数接收一个字符串作为场景名称——我们将场景命名为 \"\
    main\"。\n\n然后我们创建了 3 个层：“background”（背景 bg）、“obj” 和“user interface”（用户界面 ui）。`obj`\
    \ 层被设置为默认层。然后我们将星星星添加到背景层。\n\n最后，我们使用 `go`¹⁰⁶ 函数在游戏启动时进入主场景。\n\n**注意**：除非另有说明，否则章节中的代码片段都应添加到主场景的主体内部。\n\
    \n## 创建游戏地图\n\n让我们创建一个绘制在屏幕上的场景布局，或称为地图。这将定义游戏中的地面和平台。\n\nKaboom 内置了使用文本和 `addLevel`¹⁰⁷\
    \ 函数定义游戏地图的支持。这消除了通常加载和渲染地图时涉及的大量麻烦。\n\n以下代码创建了游戏地图。将其添加到 `main.js` 文件的主场景中（位于将星星添加到背景层的代码代码下方）。\n\
    \n> ¹⁰⁵https://kaboomjs.com/#scene\n¹⁰⁶https://kaboomjs.com/#go\n¹⁰⁷https://kaboomjs.com/doc/#addLevel\n\
    \n```javascript\n// 游戏参数\nconst MAP_WIDTH = 440;\nconst MAP_HEIGHT = 275;\nconst\
    \ BLOCK_SIZE = 11;\n\nconst map = addLevel([\n  \"\", \"\", \"\", \"\", \"\",\
    \ \"\", \"\", \"\", \"\",\n  \"\", \"\", \"\", \"\", \"ppccccc\",\n  \"\", \"\"\
    , \"\", \"\", \"\", \"\", \"\", \"\", \"\",\n  \"\", \"\", \"\", \"\", \"\", \"\
    \", \"\", \"\", \"\",\n  \"ppccccc\",\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\
    \", \"\", \"\",\n  \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\", \"\",\n  \"\
    ====================================\",\n  \"\",\n], {\n  width: BLOCK_SIZE,\n\
    \  height: BLOCK_SIZE,\n  pos: vec2(0, 0),\n  \" =>\": {\n    rect(BLOCK_SIZE,\
    \ BLOCK_SIZE),\n    color(150, 75, 0),\n    \"ground\",\n    area(),\n    solid()\n\
    \  }\n});\n```\n\n```javascript\n\"p\": () => [\n  rect(BLOCK_SIZE, BLOCK_SIZE),\n\
    \  color(0,0,255),\n  \"platform\",\n  area(),\n  solid()\n],\n\"-\": () => [\n\
    \  rect(BLOCK_SIZE/10, BLOCK_SIZE),\n  color(0,0,0),\n  \"boundary\",\n  area(),\n\
    \  solid()\n]\n});\n```\n\n首先，我们添加了一些游戏参数，将用于定义地图尺寸以及元素的默认块大小。\n\n接下来，我们创建了游戏地图。地图或关卡设计是用字符串数组表示的。每一行代表屏幕上的一行，因此我们可以从视觉上设计地图应该的样子。`width`\
    \ 和 `height` 参数指定了每个元素的大小。`pos` 参数指定了地图放置的位置——我们选择 (0,0)，即屏幕的左上角，作为地图的起点。\n\n\
    Kaboom 允许我们为地图中的每个元素指定绘制的内容。你可以创建不同的元素，例如墙、地面、平台等等。要告诉 Kaboom 绘制什么，我们添加一个键，然后为它指定参数。\n\
    \n在这段代码中，我们有 3 类型的固定元素：代表地面、代表平台和代表不可见的边界。这种分组允许我们对它们进行统一引用。\n\n如果我们运行代码，应该能看到像这样的游戏地图：\n\
    \n## 添加飞船\n\n让我们使用 `add`¹⁰⁸ 函数来添加飞船：\n\n```javascript\nconst player = add([\n\
    \  sprite(\"spaceship\"),\n  pos(100, 200),\n  body(),\n  area(),\n  scale(1),\n\
    \  rotate(0),\n  origin(\"center\"),\n  \"player\",\n  {\n    score: 0,\n    shield:\
    \ 100\n  }\n]);\n```\n\n`add`¹⁰⁹ 函数使用不同的组件（例如 `pos`、`body`、`scale`）构建游戏对象。这些组件中的每一个都赋予了对象特征。\n\
    \n> ¹⁰⁸https://kaboomjs.com/doc/#add\n¹⁰⁹https://kaboomjs.com/doc/#add\n\n## 使用\
    \ Kaboom.js 构建太空射击游戏\n\n值得注意的是，`body` 组件使对象对重力产生反应：如果飞船不在地面或平台上，它就会掉落。`rotate`\
    \ 组件允许我们根据玩家想要去的方向倾斜飞船，提供反馈。默认情况下，所有操作都是围绕对象的左上角计算的。为了让倾斜生效，我们添加了 `origin` 组件并设置为中心，这样倾斜就会从对象的中心开始调整。\n\
    \nKaboom 还允许我们为游戏对象附加自定义数据。我们添加了 `score` 来存储玩家的最新分数，以及 `shield` 来存储飞船剩余的护盾。我们可以在玩家捡物品或与之碰撞时调整这些值。\n\
    \n当我们创建地图时，我们在地图对象上添加了 `solid` 组件。该组件将对象标记为实体，意味着其他对象无法通过它们。\n\n## 移动飞船\n\n我们将允许飞船进行几种不同的移动：向左或向右改变方向以及向上飞行。我们还需要追踪飞船面向的方向，以便知道从哪侧发射激光。\n\
    \n为了处理方向的变化和追踪，我们添加了以下代码：\n\n```javascript\nconst directions = {\n  LEFT: \"left\"\
    ,\n  RIGHT: \"right\"\n}\n\nlet current_direction = directions.RIGHT;\n\nkeyDown(\"\
    left\", () => {\n  player.flip(-1);\n  player.angle = -11;\n  current_direction\
    \ = directions.LEFT;\n  player.move(-100,0);\n});\n\nkeyDown(\"right\", () =>\
    \ {\n  player.flip(1);\n  player.angle = 11;\n  current_direction = directions.RIGHT;\n\
    \  player.move(100,0);\n});\n```\n\n> ¹¹⁰https://kaboomjs.com/doc/body\n¹¹¹https://kaboomjs.com/doc/rotate\n\
    ¹¹²https://kaboomjs.com/doc/origin\n¹¹³https://kaboomjs.com/doc/shield\n\n```javascript\n\
    onKeyRelease(\"left\", () => {\n  player.angle = 0;\n});\n\nonKeyRelease(\"right\"\
    , () => {\n  player.angle = 0;\n});\n```\n\n首先，我们创建了一个定义游戏允许方向的常量对象。然后我们创建了一个变量来追踪飞船面向的\
    \ `current_direction`。\n\n然后我们添加了按键处理代码。按键名称 left 和 right 指的是键盘上的左右箭头键。Kaboom\
    \ 提供了 `keyDown`¹¹ 事件，让我们知道某个按键是否被按下。我们为每个箭头键创建了 `keyDown` 事件处理器。只要指定的按键被按住，`keyDown`\
    \ 就会反复调用处理器。\n\n每个 `keyDown` 事件内部的代码执行以下操作：\n\n- `flip` 函数镜像玩家的飞船图像，使其根据面向的方向进行显示。我们使用\
    \ -1 进行翻转，1 代表右侧。\n- `player.angle` 函数在按键被按住期间稍微倾斜飞船，使飞船看起来正朝着指定的方向移动。\n- 更新 `current_direction`\
    \ 追踪变量。我们在添加射击功能会使用这个变量。\n- `move` 函数按方向移动飞船。\n\n现在我们希望飞船在按下向上箭头键时向上飞行。为了实现，我们将利用\
    \ Kaboom 的 `jump`¹¹ 属性（它是 `body`¹¹ 组件的一部分）并将其重新用于向上飞行。将以下代码添加到主场景：\n\n```javascript\n\
    onKeyDown(\"up\", () => {\n  player.jump(100);\n});\n```\n\n> ¹¹https://kaboomjs.com/#onKeyDown\n\
    ¹¹https://kaboomjs.com/doc#body\n¹¹https://kaboomjs.com/doc#body\n\n"
