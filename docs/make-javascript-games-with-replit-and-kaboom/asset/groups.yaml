    We will use these Asteroids sprites*5 and this space background** from OpenGameArt.org,
    and the following sounds from FreeSound:


    +   - Laser*7

    - Explosion*8

    - Rocket thrust*9


    We will also be using music by Eric Matyas of Soundimage.org*10.

    We created a single ZIP file with the sprites and sounds you will need for this
    tutorial, which you can download here*11.


    # Creating a new project and loading assets


    Log into your Replit*12 account and create a new repl. Choose Kaboom as your project
    type. Give this repl a name, "asteroids".


    ![](img/e909780a5f974ff614ba5223d44aa19b_33_0.png)


    Creating an REPL


    > *13docs.replit.com/images/tutorials/23-asteroids-kaboom/asteroids-game.gif

