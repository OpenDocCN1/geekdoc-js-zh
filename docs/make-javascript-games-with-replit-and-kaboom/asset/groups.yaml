  - '[PAGE 123]


    # Building tic-tac-toe with WebSocket and Kaboom.js


    Each number in the blocks represents the index at which the board position is
    represented in the array. Initially, we fill all the elements of the array with
    null to indicate that the block is open. When players make a move to occupy an
    open space, we''ll add a reference to the player instead. That way we can keep
    track of which blocks are empty, and which are occupied by which player.


    Next, we have currentPlayer, which we will alternately set to each player when
    it''s their turn to move.


    Then there is an array players, which will hold references to both of the players
    in the game. This will allow us to show the names of the players on screen, as
    well as generally keep track of the players.


    The result field is updated after every move. This field will contain the status
    of the game (as we defined above). As it''s represented as an object, it will
    also be able to hold extra fields. We''ll use that functionality to add a reference
    to the winner of the game, if the game ends in a win.


    # Accepting connections


    When a player connects via WebSocket, Sockets.IO will fire a connection²⁵² event.
    We can listen for this event and handle tracking the connection, as well as creating
    listeners for other custom events. There are a few custom events²⁵³ we can define
    here, that our players will emit:


    +   - addPlayer: We use this for a player request joining the game.

    - action: Used when a player wants to make a move.

    - rematch: Used when a game is over, but the players want to play again.


    We can also listen for the built-in disconnect²⁴ event, which will alert us if
    a player leaves the game (for example, by closing the browser window or if their
    connection is lost).


    Here''s the code that we hook up our listeners to the events:


    ```

    io.on(''connection'', function (connection) {

    connection.on(''addPlayer'', addPlayer(connection.id));

    connection.on(''action'', action(connection.id));

    connection.on(''rematch'', rematch(connection.id));

    connection.on(''disconnect'', disconnect(connection.id));

    });

    ```


    Next we''ll implement each of these listeners, starting with addPlayer.


    Side Note: Normally in examples for custom listeners, you''ll handle the code
    added immediately with an anonymous function, like this:


    ²⁵²https://socket.io/docs/v4/server-instance/#connection

    ²⁵³https://socket.io/docs/v4/emitting-events/

    ²⁵⁴https://socket.io/docs/v4/server-instance/#disconnect'
