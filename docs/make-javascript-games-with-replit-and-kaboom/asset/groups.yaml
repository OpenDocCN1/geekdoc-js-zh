- md: "\n## Building a pseudo-3D game in Kaboom\n\nWhile this is similar to the code\
    \ we added above for the alien bugs, you'll notice the spawnStars function has\
    \ a few differences to the spawnAlien function, such as:\n\n- We create all the\
    \ stars at once. This is because we need a significant star field to start with,\
    \ not just a few stars every second.\n- We don't create a Kaboom object for each\
    \ star. This is because we don't need the collision handling and other overhead\
    \ that comes with a Kaboom object, especially since we are generating a lot of\
    \ stars (const START_COUNT = 1000); Instead, we need the stars' info in custom\
    \ literals, and each of these to the stars array.\n- We set the initial z-pos\
    \ of the stars to a random value from 0 to 1000 using the rand function. This\
    \ is because we create all the stars at once, so we seed the stars at random positions\
    \ on the z-pos to give the feeling of depth to the star field. If they were initialized\
    \ to the same z-pos, they would move in unison and would look like a mass of pixels\
    \ coming at us - a bit weird!\n\nNow take a look at the onUpdate handler for our\
    \ stars. It differs from the handler for our alien bugs in this case:\n\n- We\
    \ don't use an object filter to look for the stars as we didn't create them as\
    \ Kaboom objects. Instead, create each star in the stars array.\n- Instead of\
    \ destroying the star and removing it from the array when it reaches the 'front'\
    \ of the screen, we recycle it by resetting its z-pos back to 1000.\n- We also\
    \ check if the star is out of view. If it is, we don't draw it to save a bit of\
    \ overhead.\n- Instead of using the z-pos to calculate a value which to scale\
    \ the star, we use it to calculate the star's intensity. Kaboom uses colors in\
    \ the range 0-255. So we first scale the z-pos down to 1. Then we subtract it\
    \ from 1 to create an inverse relationship between z-pos and intensity. We then\
    \ multiply the intensity by 255 to scale it to a value that is within the range\
    \ 0-255. In other words, stars further away have higher z-pos values, giving lower\
    \ intensity. This makes stars far away brighter.\n- Finally, we use Kaboom's drawRect\
    \ method to directly draw the star to the screen. As there is no pixel drawing\
    \ function in Kaboom, we create a rectangle of size 1 to draw one pixel.\n\n##\
    \ Adding the spaceship\n\nNow that we have a star field to fly, let's add the\
    \ player's spaceship. Our game uses the spaceship's point of view. Adding the\
    \ following code to draw our spaceship:\n\n```javascript\nconst cockpit = add([\n\
    \  sprite(\"cockpit\"),\n  layer(\"ui\"),\n  rotate(0),\n  pos(SCREEN_WIDTH/2,\
    \ SCREEN_HEIGHT/2),\n  origin(\"center\"),\n  scale(0.275)\n]);\n```\n\nThis adds\
    \ the cockpit (image) to the ui layer. We also add the rotate component to it,\
    \ so that we can add some rotation effects when the spaceship is flying. We use\
    \ the origin component to center the image in the middle of the screen, which\
    \ also provides the axis to rotate the around when banking (turning) the spaceship.\
    \ Then we use a scaling factor to scale the image down to the size of the screen.\
    \ We scale the image as it's much larger than the size of the screen. We could\
    \ resize the image in an image editing program, but we would lose some detail\
    \ and sharpness. Note that the factor of the scale means that the image is still\
    \ a little larger than the screen size. This gives us a bit of overlap available\
    \ for when we rotate the image when banking the spaceship.\n\nRun the game now\
    \ and you should see the view from inside the spaceship.\n\n![](img/e909780a5f974ff614ba523d44aa19b_104_0.png)\n\
    \n## Creating the spaceship’s movement controls\n\nOur basic game world is up\
    \ and running, now let's add some controls so we can move around in it. We'll\
    \ allow a few different moves for the spaceship: bank left or right, and fly up\
    \ or down.\n\nConsider for a moment how the spaceship moves through the game world.\
    \ We can't move the cockpit left or right, up or down - it would just disappear\
    \ off the screen. One way of simulating movement from the point of view of the\
