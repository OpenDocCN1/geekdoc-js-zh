  - "[PAGE 75]\n\n# Build a Space Shooter with Kaboom.js\n\npoints_speed_up value.\n\
    \nNext we take ALIEN_BASE_SPEED and add the incremental rate multiplied by our\
    \ points_speed_up value.\n\nWe also calculate a new rate at which aliens are spawned,\
    \ making the aliens not only faster at moving, but also faster at respawning.\n\
    \nNow that we've calculated our basic parameters, we create a new alien using\
    \ the add2 function again:\n\n+   * sprite('alien') creates the alien with the\
    \ image alien.\n* pos(xpos, rand(0, MAP_HEIGHT-20)) sets the starting position\
    \ of the alien. We calculated the x pos from the randomly chosen direction. We\
    \ also add a y (vertical) position for the alien, between the top (position 0)\
    \ of the map, and the bottom (MAP_HEIGHT) of the map (coordinate starts from the\
    \ top left of the screen). We remove 20 pixels from the bottom, to account for\
    \ ground.\n* We add the \"alien\" tag to the object, so we can identify and call\
    \ it in other parts of the code.\n* We also add a custom object of this particular\
    \ alien, broken into it speed along the x and y axis. For the speed along the\
    \ x axis speed, we add a random component so that not all aliens move at the same\
    \ speed. We then multiply the speed by -1 or 1 depending on whether the alien\
    \ is moving left or right across the screen.\n\nFinally, we use Kaboom().wait\
    \ function to wait a short amount of time before calling spawnAlien to create\
    \ a new alien. We also have a call to spawnAlien to get it started when the game\
    \ starts.\n\n# Moving the Aliens\n\nTo move the aliens, we'll create a handler\
    \ to attach the onUpdate event, which fires for each alien on every frame. We\
    \ will like this for bullets:\n\n```\nonUpdate(\"alien\", alien) => {\n  alien.move(alien.speedX,\
    \ alien.speedY);\n\n  if ((alien.pos.y - alien.height > MAP_HEIGHT) || (alien.pos.y\
    \ < 0)) {\n    destroy(alien);\n  }\n  if ((alien.pos.x < -1 * alien.width) ||\
    \ (alien.pos.x > MAP_WIDTH)) {\n    destroy(alien);\n  }\n});\n```"
- md: "\n# Build a Space Shooter with Kaboom.js\n\nFirst, the function moves the alien\
    \ by the amount we calculated earlier and saved to the alien's custom data.\n\n\
    Then the function checks to see if the alien has moved out of bounds of the map\
    \ area. If it has, we destroy it, as it is no longer visible. Having too many\
    \ active objects can decrease performance, so this step is important.\n\nRun the\
    \ code now, you should see moving aliens.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_76_0.png)\n\
    \nAliens\n\nClick to open gif¹³¹\n\n# Shooting the Aliens\n\nNow that we have\
    \ moving aliens, a moving spaceship, and laser bullets, let's add the code to\
    \ deal with a bullet hitting an alien. Of course, we want this to have a cool\
    \ explosion and sound effect to give good feedback to the player.\n\n```javascript\n\
    onCollide(\"alien\", \"bullet\", (alien, bullet) => {\n  makeExplosion(alien.pos,\
    \ 5, 5);\n  destroy(alien);\n  destroy(bullet);\n  play(\"explosion\", {\n   \
    \ volume: 0.2,\n    detune: rand(0, 100),\n  });\n});\n```\n\nThis is similar\
    \ to the code used to check if a bullet has hit a platform. We destroy both the\
    \ bullet and alien to remove them from the scene. Then we use the play function\
    \ to play the explosion effect. We set the volume so it fits in the mix, and also\
    \ add a random detune (pitch) to the sound to make it more interesting when a\
    \ lot of aliens are being shot.\n\nWe also call a function to create an explosion\
    \ in the area where the alien used to be. This is from the \"shooter\" example\
    \ on the Kaboom page (which is great). It makes a series of bright white flashes\
    \ across the explosion, giving a cartoon or comic-book feel to the explosions:\n\
    \n```javascript\nfunction makeExplosion(p, n, size) {\n  for (let i = 0; i < n;\
    \ i++) {\n    wait(rand() * 0.1, () => {\n      for (let j = 0; j < 2; j++) {\n\
    \        add(\n          rect(1, 1),\n          pos(p.add(vec2(rand(-rad, rad),\
    \ rand(-rad, rad)))),\n          color(255, 255, 255),\n          origin(\"center\"\
    ),\n          scale(1 * size, 1 * size),\n          lifespan(1)\n        );\n\
    \      }\n    });\n  }\n}\n```\n\n```javascript\nfunction lifespan(time) {\n \
    \ let timer = 0;\n  return {\n    update() {\n      timer += dt;\n      if (timer\
    \ >= time) {\n        destroy(this);\n      }\n    },\n  }\n}\n\nfunction grow(rate)\
    \ {\n  return {\n    update() {\n      const n = rate * dt();\n      this.scale.add(n);\n\
    \    }\n  }\n}\n```\n\nThe makeExplosion function has four arguments (inputs to\
    \ the function). These are:\n\n- p: the center position to base the explosions\n\
    - n: the number of main flashes\n- rad: the radius or distance from p to make\
    \ the flashes\n- size: the size of each of the flashes\n\nThe function creates\
    \ a loop for n times (the number of main flashes). It uses the Kaboom wait function\
    \ to leave a little bit of time (0.1) seconds between each flash.\n\nAnother for\
    \ loops twice to create 2 flashes, using the Kaboom add function to add a rectangle\
    \ shape for flash, and setting the color to white (color components in Kaboom\
    \ from 0-255). This rectangle starts out at 1 pixel in size, then the size passed\
    \ in the function - we'll use this later when “grow” the explosion. The origin\
    \ component is used to set the origin of the rectangle to its center - this will\
    \ be used when we “grow” to give the impression that it is starting from a small\
    \ point and expanding. Set the origin so that the scale is calculated from position,\
    \ giving a more natural feel.\n\nTo make the flashes appear around the position\
    \ that we specified, the pos component is adjusted by a random amount, ranging\
    \ from -rad to rad, the radius we specified (in other words, the blast arena).\n\
    \nThen there are references to two custom components - lifespan and grow. Kaboom\
    \ allows us to define our own components to give objects any behaviour or attributes.\
    \ All we need to do is to create a function that returns an object with a method\
    \ called update, which is then called for each frame of the object it is added\
    \ to.\n\nLet's first look at the custom grow. This is used to create the effect\
    \ of the flash expanding outwards, like a firework explosion starting at a small\
    \ point and getting larger until it disappears. In grow's update function, the\
    \ object is scaled up (available because we used the scale component on the object)\
    \ each frame. This is calculated from the rate in which is the size the object\
    \ dt function, which provides time difference in seconds for us. The explosion\
    \ flash will keep growing on each frame, so we need a way to...\n\nThe lifespan\
    \ component. This is used to destroy the object after a certain amount of time\
    \ has passed. This prevents the explosion effects from growing forever and consuming\
    \ memory.\n\n# Adding Score and UI\n\nLet's add the UI to show the ship's shield\
    \ health and the player's overall score.\n\nFirst, add text for the player's score:\n\
    \n```javascript\nadd(\n  text(\"SCORE\", { size: 8, font: \"sink\" }),\n  pos(100,\
    \ 10),\n  origin(\"center\"),\n  layer(\"ui\")\n);\n\nconst scoreText = add(\n\
    \  text(\"000000\", { size: 8, font: \"sink\" }),\n  pos(150, 10),\n  origin(\"\
    center\"),\n  layer(\"ui\")\n);\n```\n\nHere we add two new objects, rendered\
    \ with the text component. The first is just the static label for the score. The\
    \ second is the placeholder for the actual score. Note that the layer is used\
    \ in both cases to place the text on the UI layer we created at the start of the\
    \ tutorial. We haven't had to specify the layer for all our other game objects,\
    \ we set the obj layer as default to use when we defined the layers.\n"
