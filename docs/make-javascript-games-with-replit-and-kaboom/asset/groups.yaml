    \ = vec2(SCREEN_WIDTH - (SCREEN_WIDTH*0.25), (SCREEN_HEIGHT\n7 HEIGHT - SCREEN_HEIGHT*0.33));\n\
    8 9 const BULLET_VANISHING_POINT = vec2(SCREEN_WIDTH * 0.5, SCREEN_HEIGHT * 0.33);\n\
    10 add((\n11 add([\n12 rect(1, 1),\n13 pos(BULLET_ORIGIN_LEFT),\n14 area),\n15\
    \ color(255, 0, 0),\n16 \"bullet\",\n17 {\n18 bulletSpeed: BULLET_SPEED ,\n19\
    \ targetPos: BULLET_VANISHING_POINT\n20 }\n21 ]);\n22 \n23 add([\n24 rect(1, 1),\n\
    25 pos(BULLET_ORIGIN_RIGHT),\n26 color(255, 0, 0),\n27 \"bullet\",\n{\n  bulletSpeed:\
    \ -1*BULLET_SPEED,\n  targetPos: BULLET_VANISHING_POINT\n});\n```\n\n```\nplay(\"\
    shoot\", {\n  volume: 0.2,\n  detune: rand(-1200, 1200),\n});\n```\n\n当玩家开火时，我们使用\
    \ `spawnBullet` 函数创建一组新的激光弹。为了让它们看起来像是从飞船下方相互发射的，我们通过 `0.25` 和 `0.33` 两个倍数，分别计算了屏幕各侧\
    \ 1/4 处和 1/3 处的子弹起始位置。\n\n然后我们计算子弹的终点。这与十字准星的位置相同。使用这些值，我们创建了 2 个子弹对象——简单的 1 像素点，带有\
    \ `bullet` 标签并将颜色设置为 `(255,0,0)` 以让它们看起来极有威胁性。我们还为对象添加了自定义属性：子弹移动的速度，以及轨迹终点所在的消失点。\n\
    \n作为最后一个细节，我们在每创建一个子弹时都会播放“shoot”音效，通过调整音量并应用随机生成的 `detune` 值，使得每次播放时的音调都不同。\n\
    \n我们已经有了子弹、它们的声音和轨迹，现在让我们通过每帧移动它们，让它们从起始点移动到十字准星所在的消失点：\n\n```\nonUpdate(\"bullet\"\
    , (b) => {\n  const m = (b.pos.y - b.targetPos.y) / (b.pos.x - b.targetPos.x);\n\
    \  const c = b.targetPos.y - m*(b.targetPos.x);\n\n  let newX = b.pos.x + b.bulletSpeed;\n\
    \  let newY = m * newX + c;\n  b.pos.x = newX;\n  b.pos.y = newY;\n  // 当子弹到达消失点的\
    \ y 轴后将其移除\n  if ((b.pos.y < SCREEN_HEIGHT*0.33)) {\n    destroy(b);\n  }\n});\n\
    ```\n\n```\nKeyDown(\"space\", () => {\n  spawnBullet();\n});\n```\n\n在这里我们使用了\
    \ `onUpdate` 事件处理器，并过滤出子弹对象。\n为了计算每帧子弹在轨迹上的下一个位置，我们需要找到子弹当前位置与终点位置之间直线的斜率（m）和\
    \ y 截距（在本例中为 c）。函数的前两行将这些变量参数表示为公式。让我们花点时间看看是如何得到这些公式的。\n\n我们从直线方程开始：\n\n```\n\
    y = m*x + c\n```\n\n由于我们有起点和终点的 x 和 y 坐标，我们可以通过解方程组来求出未知数 m 和 c：\n\n```\ny_start\
    \ = m*x_start + c   (1)\ny_target = m*x_target + c   (2)\n```\n\n重新排列 (2):\nc\
    \ = y_target - m*x_target\n\n```\n将 (2) 代入 (1) 中的 c:\ny_start = m*x_start + (y_target\
    \ - m*x_target)\ny_start - y_target = m*(x_start - x_target)\n```\n\n```\nm =\
    \ (y_start - y_target) / (x_start - x_target)\n```\n\n```\nc = y_target - m*x_target\n\
    ```\n\n现在我们有了斜率和截距，就可以计算子弹的任何位置了。\n\n"
