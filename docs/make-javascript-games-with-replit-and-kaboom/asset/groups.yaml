    \ the level config, we specified in the sprite component that it must use the\
    \ Walking animation, which is defined in the enemies.json file. Kaboom starts\
    \ the character using that animation.\n\n# Building a Mario-like side-scroller\
    \ with Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_156_0.png)\n\nStatic\
    \ Mario world\n\nClick to open gif^310\n\nOk, back to looking at the code we added\
    \ and what it does. First, we define a new `scene`^311 like we did for the start\
    \ scene. Time, we specify a parameter `levelNumber` that can be passed to the\
