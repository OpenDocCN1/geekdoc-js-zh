  - '[PAGE 39]


    # Building Asteroids in Kaboom.js


    ```

    max_thrust: 48,

    celeration: 2,

    deceleration: 4,

    lives: 3,

    can_shoot: true,

    laser_cooldown: 0.5,

    invulnerable: false,

    invulnerability_time: 3,

    animation_frame: 0,

    thrusting: false

    }

    ```


    Here we''re creating a game object with a number of components⁶⁰, each of which
    gives our object some data or behavior. These are:


    +   - The sprite⁶¹ component, which draws the ship sprite.

    - The pos⁶² (position) component, which places the player near the center of the
    screen in the Replit browser.

    - The rotate⁶³ component, which sets the ship''s origin to "center", so that when
    we rotate the ship, it will rotate around the center of its sprite rather than
    the default top-left corner.

    - The area⁵ component, which generates the collision area for the ship to detect
    collisions.


    Following initial configuration, we''re giving the player object three tags: player,
    mobile and wraps. Kaboom uses a tagging system to apply behavior to objects -
    you can think of this as similar to multiple inheritance⁶⁴. By tagging objects
    with shared behavior, we can save ourselves from duplicating code.


    Finally, we assign a number of custom properties to our player object. We use
    these properties to handle a variety of gameplay functions, such as moving and
    shooting.

    If you run repl now, you will see the ship in the middle of a blank screen. In
    the next section, we''ll implement movement controls.


    > ⁶⁰ https://kaboom.com/doc/nadd

    ⁶¹ https://kaboom.com/#sprite

    ⁶² https://kaboom.com/#pos

    ⁶³ https://kaboom.com/#rotate

    ⁶⁴ https://kaboom.com/#origin

    ⁶⁵ https://kaboom.com/#area

    ⁶⁶ https://en.wikipedia.org/wiki/Multiple_inheritance'
  - "[PAGE 40]\n\nBuilding Asteroids in Kaboom.js\n\n# Score: 0\n\n![](img/e909780a5f974ff614ba5223d44aa19b_40_0.png)\n\
    \n# Movement controls\n\nIn this game, our player will turn the nose of the spaceship\
    \ with the left and right arrow keys, and thrust forward and backward with the\
    \ up and down arrow keys. We'll handle movement in two phases: user input, and\
    \ actually moving the ship. First, let's allow the player to turn their ship to\
    \ the left and right. Add the following code:\n\n```\n// Movement keys\nKeyDown(\"\
    left\", () => {\n  player.angle -= player.turn_speed;\n});\nKeyDown(\"right\"\
    , () => {\n  player.angle += player.turn_speed;\n});\n```\n\nRun your repl now,\
    \ and you should be able to turn the ship to the left and right by pressing the\
    \ respective arrow keys. If you think it turns fast or too slow, change the value\
    \ of turn_speed in the player creation code.\n\nNow let's implement the up and\
    \ down keys, so the player can move around the scene. Enter the following code\
    \ beneath the player turning code:"
  - "[PAGE 41]\n\n# Building Asteroids in Kaboom.js\n\n```\nonKeyDown(\"up\", () =>\
    \ {\n  player.speed = Math.min(player.speed+player.acceleration, player.max_thrust);\n\
    \  play(\"rocket_thrust\", {\n    volume: 0.1,\n    speed: 2.0,\n  });\n});\n\
    ```\n\nRather than having the spaceship from zero to max speed immediately, we\
    \ use this to simulate a gradual acceleration to our max speed. To achieve this,\
    \ we use Math.min()^ to set the player's speed to the minimum value between current\
    \ speed plus acceleration and its maximum speed. This will make the ship gradually\
    \ increase speed until it reaches max_thrust. Play around with the values of acceleration\
    \ and max_thrust in the player creation code and see what feels right to you.\n\
    \nAdditionally, we set our rocket thrust to play^6 while accelerating. Kaboom\
    \ allows us to manipulate sounds in few different ways, such as changing their\
    \ speed and volume.\n\nWe'll handle deceleration by doing the opposite to acceleration,\
    \ using Math.max()^ to choose the maximum between the player's speed minus deceleration,\
    \ and their maximum speed in reverse (i.e. negative). Adding the following code\
    \ below the acceleration controls:\n\n```\nonKeyDown(\"down\", () => {\n  player.speed\
    \ = Math.max(player.speed-player.deceleration, -player.max_thrust);\n  play(\"\
    rocket_thrust\", {\n    volume: 0.2,\n    speed: 2.0,\n  });\n});\n```\n\nIf you\
    \ run your repl now and try to accelerate or decelerate, the sound will play,\
    \ but the ship will go nowhere. This is because we're manipulating player.speed,\
    \ which is a custom property that Kaboom hasn't attached any special behavior\
    \ to (unlike player.angle). Let's add some movement parameters now.\n\n# Movement\n\
    \nMovement in Kaboom and most other 2D game development systems is handled using\
    \ X and Y coordinates on a plane. To move an object left, you subtract from its\
    \ X coordinate, and to move right, you add to its X coordinate. To move an object\
    \ up, you subtract from its Y coordinate, and to move down, you add to its Y coordinate.\
    \ Therefore, basic four-directional movement in games\n\n> ^https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/min\n\
    ^https://kaboomjs.com/splay\n^https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/max"
- md: "\n# Building Asteroids in Kaboom.js\n\nlike Snake or Pacman is quite straightforward.\
    \ The directional movement we need for Asteroids (commonly called tank controls⁷⁰)\
    \ is more complex, requiring some calculations.\n\nAt a high level, we want to\
    \ move a given distance (player.speed) in a given direction (player.angle). As\
    \ a first step, let's create an onLoad callback for our mobile tag. This code,\
    \ like our UI code above, will be run by every object with the \"mobile\" tag\
    \ on every frame of the game, so we can use it for more than just the player object.\
    \ Add the following code at the bottom of your main scene:\n\n```\n// Movement\n\
    onUpdate(\"mobile\", (e) => {\n  e.move(pointAt(e.speed, e.angle));\n});\n```\n\
    \nFirst, we move our object, using the pointAt(), which takes a speed and an angle\
    \ and returns the X and Y coordinates as a vec2¹, Kaboom's 2D vector type. This\
    \ data type is provided by Kaboom specifically for working with X and Y coordinates,\
    \ and comes with a number of useful functions, such as addition and subtraction.\n\
    \nNow we need to create the pointAt() function. Before we jump into the code,\
    \ let's think about the problem. Our movement can be drawn as an angle on a line,\
    \ and its X and Y coordinates as horizontal and vertical lines connected to it,\
    \ giving us a right-angled triangle.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_42_0.png)\n\
    \nTriangle\n\nWe know the values of the triangle's angles: one is 90 degrees,\
    \ and the other two are equal to player.angle. The length of the triangle's hypotenuse\
    \ (the red line in the diagram above) is player.speed: this is the ship we will\
    \ be traveling.\n\nWe now need to calculate the lengths of the other two sides\
    \ to get the X and Y values for our movement vector. We can do this using the\
    \ sine and cosine functions⁷², like so:\n\n> ⁷⁰ https://en.wikipedia.org/wiki/Tank_controls\n\
    > ⁷¹ https://kaboomjs.com/doc/vec2\n> ⁷² https://www.clarku.edu/faculty/djoyce/trig/trigonometricformulas.html\n\
    \n# Building Asteroids in Kaboom.js\n\n| 1 sine(angle) = y / distance |\n| 2 y\
    \ = distance * sin(angle) |\n| 4 cosine(angle) = x / distance |\n| 5 x = distance\
    \ * cos(angle) |\n\nRemember, in Kaboom and take the ship for a spin. You should\
    \ be able to thrust forward and backward, moving according to the ship's nose\
    \ pointing. The Y axis is inverted, so we have to make it negative. Add the pointAt()\
    \ function below, at the top of the main scene code.\n\n```\nfunction pointAt(distance,\
    \ angle) {\n  let radians = -1*deg2rad(angle);\n  return vec2(distance * Math.cos(radians),-distance\
    \ * Math.sin(radians));\n}\n```\n\nYour repl now works and you should be able\
    \ to thrust forward and backward, moving according to the ship's nose pointing.\n\
    \nThere's one little problem though: too long, and you'll fly off the screen.\
    \ In any other game, we might solve that by enclosing the play area with walls,\
    \ but that doesn't seem quite right in the infinite expanse of space. The original\
    \ Asteroids solved this by having the player and other key objects wrap around\
    \ the screen, i.e. appear at the bottom coming over the top, or at the left edge\
    \ after going the right edge. Let's implement that, using the \"wraps\" tag we\
    \ assigned to your player when we created it. Add the following code to the code\
    \ of your main scene:\n\n```\n// Wrap around the screen\nonUpdate(\"wraps\", (e)\
    \ => {\n  if (e.pos.x > width()) {\n    e.pos.x = 0;\n  }\n  if (e.pos.x < 0)\
    \ {\n    e.pos.x = width();\n  }\n  if (e.pos.y > height()) {\n    e.pos.y = 0;\n\
    \  }\n  if (e.pos.y < 0) {\n    e.pos.y = height();\n  }\n});\n```\n\nThis is\
    \ a fairly straightforward piece of code that checks whether an object's position\
    \ is outside of the room and, if so, places it on the other side. The width()\
    \ and height() functions are Kaboom built-ins that return the size of the game\
    \ canvas. Run your repl and try it out.\n\n> *https://kaboomjs.com/doc/#width\n\
    > *https://kaboomjs.com/doc/#height\n\n# Rocket animation\n\nOur ship can move\
    \ now, but it would be nice to see its rockets firing when the player presses\
    \ the arrow key, and well as hear them. Reactive animations like these make games\
    \ feel more responsive and look more dynamic.\n\nKaboom has methods for handling\
    \ animations when a game object uses an animated sprite (i.e. with multiple images),\
    \ but this isn't quite what we want. Rather than animating the player's ship,\
    \ we need to animate the rocket that appears behind it when a thrust is pressed,\
    \ so we'll need to handle all the animation code ourselves. Luckily, Kaboom makes\
    \ this fairly simple.\n\nFirst, let's create an array with our four rocket sprites.\
    \ Add the following code to the bottom of your main scene:\n\n```\n// Animate\
    \ rocket\nconst thrust_animation = [\"rocket1\", \"rocket2\", \"rocket3\", \"\
    rocket4\"];\n```\n\nThen we need some way to indicate when to start and stop the\
    \ animation. We can use Kaboom's onKeyPress and onRelease events for this. Add\
    \ the following:\n\n```\nonKeyPress(\"up\", () => {\n  thrusting = true;\n  animation_frame\
    \ = 0;\n});\nonRelease(\"up\", () => {\n  thrusting = false;\n});\n```\n\nNow\
    \ let's draw the animation. We'll use the onUpdate function, and add a callback\
    \ that changes the animation frame every 0.1 seconds. Add the following:\n\n```\n\
    let move_delay = 0.1;\nlet timer = 0;\nonUpdate(() => {\n  timer += dt();\n  if\
    \ (timer < move_delay) return;\n  timer = 0;\n\n  if (thrusting) {\n    animation_frame++;\n\
    \    if (animation_frame >= thrust_animation.length) {\n      animation_frame\
    \ = 0;\n    }\n  }\n});\n```\n\nTo make our ship fire bullets, we need to create\
    \ bullet objects just in front of the ship's nose, and have them travel in the\
    \ same direction the ship is pointing. Here we can reuse our pointAt() function.\
    \ Add the following code beneath the existing movement code:\n\n```\n// Shooting\n\
    onKeyDown(\"space\", () => {\n  add(\n    sprite(\"bullet\"),\n    pos(player.pos.add(player.width/2,\
    \ player.angle)),\n    rotate(player.angle),\n    origin(\"center\"),\n    \"\
    bullet\",\n    \"mobile\",\n    \"destructs\",\n    {\n      speed: 100\n    }\n\
    \  );\n});\n```\n\n# Building Asteroids in Kaboom.js\n\n```\n// draw player\n\
    draw('player', (p) => {\n  if (thrusting) {\n    draw(\n      sprite(thrust_animation[p.animation_frame]),\n\
    \      pos(p.pos.add(p.width/2, p.angle)),\n      rotate(p.angle),\n      origin(\"\
    center\")\n    );\n  }\n});\n```\n\nToo many bullets\n\nAt the moment, a bullet\
    \ object will be created in every frame while space is down. That's a lot of bullets,\
    \ and might make the game too easy, as well as slowing it to a crawl on less capable\
    \ devices. We need to add a cooldown period, and we can do so by altering our\
    \ shooting code to look like this:\n"
  mdcn: "\n\n# 在 Kaboom.js 中构建星卫大战\n\n制作类似贪吃蛇或吃豆人的游戏非常简单。而《星卫大战》需要的方向移动（通常称为坦克控制⁷⁰）要复杂得多，需要一些计算。\n\
    \n从高层次来说，我们希望在给定的方向（player.angle）上移动给定的距离（player.speed）。第一步，为我们的移动标签创建一个 `onLoad`\
    \ 回调。这段代码就像我们上面的 UI 代码一样，会在游戏的每一帧中由每个带有 \"mobile\" 标签的对象运行，因此我们可以将其用于玩家对象以外的物体。在主场景的底部添加以下代码：\n\
    \n```\n// Movement\nonUpdate(\"mobile\", (e) => {\n  e.move(pointAt(e.speed, e.angle));\n\
    });\n```\n\n首先，我们使用 `pointAt()` 来移动对象，它接收一个速度和一个角度，并返回 X 和 Y 坐标作为 `vec2`¹（Kaboom\
    \ 的 2D 向量类型）。这种数据类型是 Kaboom 专门为处理 X 和 Y 坐标提供的，并带有许多实用的函数，如加法和减法。\n\n现在我们需要创建 `pointAt()`\
    \ 函数。在进入代码之前，让我们先思考这个问题。我们的移动可以被画成直线上的一个角度，其 X 和 Y 坐标是连接到它的水平和垂直线，形成了一个直角三角形。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_42_0.png)\n\n三角形\n\n我们知道三角形角度的值：一个是\
    \ 90 度，另外两个等于 `player.angle`。三角形斜边（上图中的红线）的长度为 `player.speed`：这是我们将飞行的飞船。\n\n\
    我们现在需要计算另外两边的长度，以获得移动向量的 X 和 Y 值。我们可以使用正弦和余弦函数⁷² 来做到，如下：\n\n> ⁷⁰ https://en.wikipedia.org/wiki/Tank_controls\n\
    > ⁷¹ https://kaboomjs.com/doc/vec2\n> ⁷² https://www.clarku.edu/faculty/djoyce/trig/trigonometricformulas.html\n\
    \n# 在 Kaboom.js 中构建星卫大战\n\n| 1 sine(angle) = y / distance |\n| 2 y = distance\
    \ * sin(angle) |\n| 4 cosine(angle) = x / distance |\n| 5 x = distance * cos(angle)\
    \ |\n\n记住，在 Kaboom 中操作并让飞船动起来。你应该能够向前和向后推进，并根据飞船头指向的方向移动。Y 轴是反的，所以我们必须将其设为负值。在主场景代码的顶部添加\
    \ `pointAt()` 函数。\n\n```\nfunction pointAt(distance, angle) {\n  let radians =\
    \ -1*deg2rad(angle);\n  return vec2(distance * Math.cos(radians),-distance * Math.sin(radians));\n\
    }\n```\n\n你的 repl 现在可以正常工作了，你应该能够向前和向后推进，并根据飞船头指向的方向移动。\n\n不过，有一个小问题：如果飞得太远，你就会飞出屏幕。在任何其他游戏中，我们可能会通过用墙包围游戏区域来解决这个问题，但在无限的太空中这似乎并不合适。原始的《星卫大战》通过让玩家和其他关键对象在屏幕上环绕来解决这个问题，即：从顶部出现从顶部出现，或者在经过右边缘后从左边缘出现。让我们使用创建玩家时分配的\
    \ \"wraps\" 标签来实现它。在主场景代码中添加以下代码：\n\n```\n// Wrap around the screen\nonUpdate(\"\
    wraps\", (e) => {\n  if (e.pos.x > width()) {\n    e.pos.x = 0;\n  }\n  if (e.pos.x\
    \ < 0) {\n    e.pos.x = width();\n  }\n  if (e.pos.y > height()) {\n    e.pos.y\
    \ = 0;\n  }\n  if (e.pos.y < 0) {\n    e.pos.y = height();\n  }\n});\n```\n\n\
    这是一段相当简单的代码，检查对象的位置是否在房间外，如果是，则将其放在另一侧。`width()` 和 `height()` 函数是 Kaboom 的内置函数，返回游戏画布的大小。运行你的\
    \ repl 并尝试一下吧。\n\n> *https://kaboomjs.com/doc/#width\n> *https://kaboomjs.com/doc/#height\n\
    \n# 火箭发射动画\n\n我们的飞船现在可以移动了，但如果在玩家按下方向键时，能看到它的火箭发射并听到它们的声音，那就更好了。这种响应式动画会让游戏感觉更有响应感，看起来也更动态。\n\
    \nKaboom 有方法在游戏对象使用动画帧精灵（即带有多个图像的精灵）时处理动画，但这并不是我们想要的。我们不需要动画玩家飞船，而是需要在按下推进键时动画飞船后面出现的火箭，因此我们需要自己处理所有的动画代码。幸运的是，Kaboom\
    \ 让这变得非常简单。\n\n首先，创建一个包含我们四个火箭精灵的数组。在主场景的底部添加以下代码：\n\n```\n// Animate rocket\n\
    const thrust_animation = [\"rocket1\", \"rocket2\", \"rocket3\", \"rocket4\"];\n\
    ```\n\n然后我们需要一种方法来指示何时开始和停止动画。我们可以使用 Kaboom 的 `onKeyPress` 和 `onRelease` 事件。添加以下内容：\n\
    \n```\nonKeyPress(\"up\", () => {\n  thrusting = true;\n  animation_frame = 0;\n\
    });\nonRelease(\"up\", () => {\n  thrusting = false;\n});\n```\n\n现在让我们绘制动画吧。我们将使用\
    \ `onUpdate` 函数，并添加一个每 0.1 秒更改一次动画帧的回调。添加以下内容：\n\n```\nlet move_delay = 0.1;\n\
    let timer = 0;\nonUpdate(() => {\n  timer += dt();\n  if (timer < move_delay)\
    \ return;\n  timer = 0;\n\n  if (thrusting) {\n    animation_frame++;\n    if\
    \ (animation_frame >= thrust_animation.length) {\n      animation_frame = 0;\n\
    \    }\n  }\n});\n```\n\n为了让飞船发射子弹，我们需要在船头正前方创建子弹对象，并让它们朝着指向的方向旅行。在这里我们可以复用 `pointAt()`\
    \ 函数。在现有移动代码下方添加以下代码：\n\n```\n// Shooting\nonKeyDown(\"space\", () => {\n  add(\n\
    \    sprite(\"bullet\"),\n    pos(player.pos.add(player.width/2, player.angle)),\n\
    \    rotate(player.angle),\n    origin(\"center\"),\n    \"bullet\",\n    \"mobile\"\
    ,\n    \"destructs\",\n    {\n      speed: 100\n    }\n  );\n});\n```\n\n# 在 Kaboom.js\
    \ 中构建星卫大战\n\n```\n// draw player\ndraw('player', (p) => {\n  if (thrusting) {\n\
    \    draw(\n      sprite(thrust_animation[p.animation_frame]),\n      pos(p.pos.add(p.width/2,\
    \ p.angle)),\n      rotate(p.angle),\n      origin(\"center\")\n    );\n  }\n\
    });\n```\n\n子弹太多\n\n目前，只要空格键被按住，每一帧都会创建一个子弹对象。那是大量的子弹，可能会让游戏变得太简单，并且在性能较差的设备上运行极其缓慢。我们需要添加一个冷却期，可以通过修改我们的射击代码如下所示来实现：\n\
    \n"
