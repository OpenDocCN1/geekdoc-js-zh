    * #11https://kaboomjs.com/onupdate\n\n```javascript\nonUpdate(\"pipe\", (pipe)\
    \ => {\n  pipe.move(-160, 0);\n});\n```\n\nNext we'll generate pipes at a steady\
    \ rate. We can use the loop⁴¹² function for this. Add the following to the game\
