- md: "\n## Build a Physics playground with Kaboom.js\n\nNow let's have the gravity\
    \ pull objects in range when the player holds down the right mouse button. Add\
    \ the following code below the line where you assigned movable.inHold in the body\
    \ of the onUpdate event callback:\n\n```\n// gravity gun pull\nif (isMouseDown(\"\
    right\")) {\n  if (movable.inHold) {\n    movable.held = true;\n  }\n  else if\
    \ (movable.inRange) {\n    movable.moveTo(player.holdLine.p2);\n  }\n}\n```\n\n\
    If the object is in holding range, we set held to true. If the object is in pulling\
    \ range, we move it into holding range. We use the moveTo() function, provided\
    \ by the pos() component, without a speed argument. This means the object will\
    \ teleport to the specified position.\n\nNext, we'll handle holding objects once\
    \ they've been pulled. Add the following code beneath the code you added:\n\n\
    ```\n// gravity gun hold\nif (movable.held) {\n  movable.moveTo(player.holdLine.p2);\n\
    }\n```\n\nThis code will ensure that objects stay in the holding position when\
    \ held, so the player will be able to move them around in an arc.\n\nFinally,\
    \ we'll need to move our object after it's been launched. Add the following code\
    \ below the lines you added above:\n\n```\n// gravity gun launch\nmovable.moveBy(dir(movable.direction).scale(movable.speed));\n\
    movable.speed = Math.max(0, movable.speed - 1); //friction\n```\n\nWhen we launch\
    \ an object, we'll give it a direction and a non-zero speed. We use moveBy(),\
    \ provided by the pos() component, to move the object unless there are other solid\
    \ objects in the way. To give the object a more natural movement arc, we will\
    \ simulate friction by decreasing its speed every frame until it reaches zero.\n\
    \nRun your repl now and try out the gravity gun. You should be able to pull crates\
    \ into the holding position, and then move them around your head.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_211_0.png)\n\
    \n## Fixing the wall-clipping bugs\n\nIf you play around with the game, you should\
    \ notice a couple of wall clipping bugs. When holding an object, you can force\
    \ it to teleport below the platform you're standing on by aiming them. Similarly,\
    \ objects will teleport through platforms if you pull them from the other side.\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_211_1.png)\n\nIn both cases, this is\
    \ because Kaboom's moveTo() function does not take solid objects into account,\
    \ so we'll have to do that ourselves.\n\n## Build a Physics playground with Kaboom.js\n\
    \nWe'll fix the first bug by adding a new, collision-aware movement function to\
    \ our physics() component. Find the component definition and append the function\
    \ to the object it returns, just below the draw() function definition:\n\n```\n\
    moveToNoCollide() {\n  const diff = dest.sub(this.pos);\n  return this.moveBy(diff.unit.scale(diff.len()));\n\
    }\n```\n\nThis function calculates the movement vector needed to move from the\
    \ current position to the destination, and passes this vector to the collision-aware\
    \ function moveBy(). Our moveBy() function will return a Collision object if it\
    \ detects a collision while moving. We'll return this and use it to cancel the\
    \ hold if certain conditions are met.\n\nFind the (movable.held) block in your\
    \ onUpdate(\"movable\") event callback and alter it to match the code:\n\n```\n\
    // gravity gun hold\nif (movable.held) {\n  let col = movable.moveToNoCollide(player.holdLine.p2)\n\
    \  if (col.target != null && col.target.solid) {\n    if (col.target.is(\"player\"\
    )) { // disregard player collisions\n      movable.moveTo(player.holdLine.p2);\n\
    \    }\n    else movable.held = false;\n  }\n}\n```\n\nWe've replaced moveTo()\
    \ with moveToNoCollide(), and we're doing some checks on the collision object\
    \ returned. If the collision is with the player, we ignore it and move the object\
    \ back to the hold position. Otherwise, we cancel the hold.\n\nRefresh your repl\
    \ browser now and try to clip a held crate through the floor. You should be unsuccessful.\n\
    \nTo fix the second clipping bug, we're going to detect solid objects between\
    \ the movable object being pulled and the player's hold position. We'll write\
    \ a new helper function to do this. Add the following code near the top of your\
    \ file, just under the definition of pointAt():\n\n## Build a Physics playground\
    \ with Kaboom.js\n\n```\nfunction checkCollisionLine(line, tag) {\n  collision\
    \ = get(tag).some((object) => {\n    return rectLine(object.worldArea()) && line;\n\
    \  });\n\n  return collision;\n}\n```\n\ncheckCollisionLine() function tests whether\
    \ an object with a given tag intersects with a line. We do this by getting all\
    \ objects with the tag and testing each one until we find a collision. some()\
    \ method will stop executing until a single true is returned, this isn't quite\
    \ as inefficient as it could be, but it's still probably not the optimal way to\
    \ do this. Nonetheless, it should work.\n\nTo use this, find the isMouseDown(\"\
    right\") in your onUpdate(\"movable\") event callback and make the modifications:\n\
    \n```\n// gravity gun pull\nif (isMouseDown(\"right\")) {\n  colLine = lineTo(movable.pos,\
    \ player.holdLine.p2);\n  if (movable.inHold) {\n    movable.held = true;\n  }\n\
    \  else if (movable.inRange && !checkCollisionLine(colLine, \"solid\")) {\n  \
    \  movable.moveTo(player.holdLine.p2);\n  }\n}\n```\n\nTo prevent the player from\
    \ clipping through walls, we check the line between the movable object and the\
    \ player's hold position.\n\n## Dropping and launching objects with the gravity\
    \ gun\n\nNow that we have the pulling implementation, we need to drop objects.\n\
    \n## Build a Physics playground with Kaboom.js\n\n```\n// gravity gun drop\nonMousePress(\"\
    right\", () => {\n  holdlist = get(\"movable\").filter((element) => {\n    return\
    \ element.held;\n  });\n  if (holdlist.length) {\n    selected = holdlist[0];\n\
    \    selected.held = false;\n  }\n});\n```\n\nWhen the right mouse button is clicked,\
    \ we retrieve all movable-tagged objects that aren't currently held. Only one\
    \ object can be held at a time.\n\nTo make dropping more user-friendly, let's\
    \ implement a dropping timeout. Add the following lines below selected.dropping\
    \ = false:\n\n```\nselected.dropping = true;\nwait(2, () => {\n  selected.dropping\
    \ = false;\n});\n```\n\nThis code uses wait(), which will execute after the given\
    \ number of seconds.\n\n## Build a Physics playground with Kaboom.js\n\n```\n\
    // gravity gun launch\nonMousePress(\"left\", () => {\n  rangeList = get(\"movable\"\
    ).filter((element) => {\n    return element.held;\n  });\n  if (rangeList.length)\
    \ {\n    selected = rangeList[0]; // ist for now\n    selected.held = false;\n\
    \    selected.direction = raddeg(-player.aimAngle);\n    selected.speed = player.firepower;\n\
    \  }\n});\n```\n\nThis code is largely similar to the dropping code, but instead\
    \ of specifying a drop timeout, we give the previously held object a direction\
    \ and a speed. The direction will be the player's aimAngle, which we need to convert\
    \ to degrees for Kaboom. The speed will be the firepower value we defined in our\
    \ gravitygun() module.\n\nRestart your reel and play with picking up, dropping\
    \ and launching crates. Some odd behavior you may notice is that objects launched\
    \ straight will tend to slide along the ceiling for a while they bleed their speed.\
    \ We can prevent this by adding the following code to kill a movable object's\
    \ speed on collision with a wall:\n\n```\nonCollide(\"movable\", \"wall\", (a,\
    \ b) => {\n  a.speed = 0;\n});\n```\n\n## Object collisions\n\nOur physics playground\
    \ wouldn't be complete without collisions between objects, let's add some simple\
    \ code to make objects push each other. Add the following collision handler to\
    \ the bottom of your file:\n"
  mdcn: "\n\n## 使用 Kaboom.js 构建物理游乐场\n\n现在，让重力在玩家按住右鼠标键时拉取范围内的物体。在 `onUpdate` 事件回调函数中，给\
    \ `movable.inHold` 赋值的下方添加以下代码：\n\n```\n// 重力枪拉取\nif (isMouseDown(\"right\"))\
    \ {\n  if (movable.inHold) {\n    movable.held = true;\n  }\n  else if (movable.inRange)\
    \ {\n    movable.moveTo(player.holdLine.p2);\n  }\n}\n```\n\n如果物体在抓取范围内，我们将 `held`\
    \ 设置为 `true`。如果物体在拉取范围内，我们就将其移动到抓取范围内。我们使用了由 `pos()` 组件提供的 `moveTo()` 函数，且没有提供速度参数。这意味着物体将瞬间移动到指定位置。\n\
    \n接下来，我们将处理物体被拉取后的持有状态。在你刚才添加的代码下方添加以下代码：\n\n```\n// 重力枪悬持\nif (movable.held)\
    \ {\n  movable.moveTo(player.holdLine.p2);\n}\n```\n\n这段代码将确保物体在被持有时保持在抓持位置，这样玩家就能以弧形移动它们了。\n\
    \n最后，我们需要在物体发射后移动它。在上方添加的代码行下方添加以下代码：\n\n```\n// 重力枪发射\nmovable.moveBy(dir(movable.direction).scale(movable.speed));\n\
    movable.speed = Math.max(0, movable.speed - 1); //摩擦力\n```\n\n当我们发射一个物体时，会给它一个方向和一个非零速度。我们使用\
    \ `pos()` 组件提供的 `moveBy()` 来移动物体，除非路径上有其他实体物体。为了让物体的运动弧线更自然，我们将通过每帧减少减其速度来模拟摩擦力，直到速度变为零。\n\
    \n现在运行你的 repl 并尝试一下重力枪。你应该能够将箱子拉取到抓持位置，然后在你的头部周围移动它们。\n\n![](img/e909780a5f974ff614ba5223d44aa19b_211_0.png)\n\
    \n## 修复穿墙 Bug\n\n如果你玩玩这个游戏，应该会注意到几个穿墙 Bug。当持有物体时，你可以通过对准目标来强制它传送到你正站立的平台下方。同样地，如果你从另一侧拉取物体，物体将穿过平台。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_211_1.png)\n\n在这两种情况下，这都是因为 Kaboom\
    \ 的 `moveTo()` 函数没有考虑实体物体，所以我们必须自己来处理这一点。\n\n## 使用 Kaboom.js 构建物理游乐场\n\n我们将通过向我们的\
    \ `physics()` 组件添加一个新的的、具有碰撞感知能力的移动函数来修复第一个 Bug。找到组件定义，并将函数附加到返回的对象上，紧接 `draw()`\
    \ 函数定义下方：\n\n```\nmoveToNoCollide() {\n  const diff = dest.sub(this.pos);\n  return\
    \ this.moveBy(diff.unit.scale(diff.len()));\n}\n```\n\n此函数计算了从当前位置移动到目标所需的所需的向量，并将此向量传递给具有碰撞感知函数\
    \ `moveBy()`。我们的 `moveBy()` 函数在移动过程中如果检测到碰撞，将返回一个 `Collision` 对象。我们将返回它并在满足特定条件时使用它取消持有。\n\
    \n在你的 `onUpdate(\"movable\")` 事件回调中找到 `(movable.held)` 块并将其修改以匹配代码：\n\n```\n//\
    \ 重力枪悬持\nif (movable.held) {\n  let col = movable.moveToNoCollide(player.holdLine.p2)\n\
    \  if (col.target != null && col.target.solid) {\n    if (col.target.is(\"player\"\
    )) { //忽略玩家碰撞\n      movable.moveTo(player.holdLine.p2);\n    }\n    else movable.held\
    \ = false;\n  }\n}\n```\n\n我们用 `moveToNoCollide()` 替换了 `moveTo()`，并对返回的碰撞对象进行检查。如果与玩家碰撞，我们就忽略它并将物体移回抓持位置。否则，我们取消持有。\n\
    \n现在刷新你的 repl 浏览器并尝试让被持有的箱子穿过地板。你应该会失败的。\n\n为了修复第二个穿墙 Bug，我们将检测在被拉取的移动物体与玩家抓持位置之间的实体物体。我们将编写一个新的辅助函数来完成此操作。将以下代码添加到文件顶部，就在\
    \ `pointAt()` 定义的下方：\n\n## 使用 Kaboom.js 构建物理游乐场\n\n```\nfunction checkCollisionLine(line,\
    \ tag) {\n  collision = get(tag).some((object) => {\n    return rectLine(object.worldArea())\
    \ && line;\n  });\n\n  return collision;\n}\n```\n\n`checkCollisionLine()` 函数测试具有给定标签的物体是否与一条线交叉。我们通过获取带有该标签的所有对象并测试每一个对象直到找到碰撞来实现这一点。`some()`\
    \ 方法会停止执行直到返回一个 `true`，这并不像想象中那么低效，但仍然可能不是实现此操作的最优方法。尽管如此，它应该是可以工作的。\n\n要使用它，请在你的\
    \ `onUpdate(\"movable\")` 事件回调中找到 `isMouseDown(\"right\")` 并进行修改：\n\n```\n// 重力枪拉取\n\
    if (isMouseDown(\"right\")) {\n  colLine = lineTo(movable.pos, player.holdLine.p2);\n\
    \  if (movable.inHold) {\n    movable.held = true;\n  }\n  else if (movable.inRange\
    \ && !checkCollisionLine(colLine, \"solid\")) {\n    movable.moveTo(player.holdLine.p2);\n\
    \  }\n}\n```\n\n为了防止玩家穿墙，我们检查了移动物体与玩家抓持位置之间的线。\n\n## 使用重力枪放下和发射物体\n\n既然我们已经有了拉取的实现，我们需要放下物体。\n\
    \n## 使用 Kaboom.js 构建物理游乐场\n\n```\n// 重力枪放下\nonMousePress(\"right\", () => {\n\
    \  holdlist = get(\"movable\").filter((element) => {\n    return element.held;\n\
    \  });\n  if (holdlist.length) {\n    selected = holdlist[0];\n    selected.held\
    \ = false;\n  }\n});\n```\n\n当点击右鼠标键时，我们检索所有未持有的移动物体。一次只能持有物体。\n\n为了让放下更加用户友好，让我们实现一个放下超时。在\
    \ `selected.held = false` 下方添加以下行：\n\n```\nselected.dropping = true;\nwait(2,\
    \ () => {\n  selected.dropping = false;\n});\n```\n\n这段代码使用了 `wait()`，它将在指定的秒数后执行。\n\
    \n## 使用 Kaboom.js 构建物理游乐场\n\n```\n// 重力枪发射\nonMousePress(\"left\", () => {\n \
    \ rangeList = get(\"movable\").filter((element) => {\n    return element.held;\n\
    \  });\n  if (rangeList.length) {\n    selected = rangeList[0]; // 临时\n    selected.held\
    \ = false;\n    selected.direction = raddeg(-player.aimAngle);\n    selected.speed\
    \ = player.firepower;\n  }\n});\n```\n\n这段代码与放下代码非常相似，但我们不是指定放下超时，而是给之前持有的物体一个方向和一个速度。方向将是玩家的\
    \ `aimAngle`，我们需要将其转换为角度。速度将是我们在 `gravitygun()` 模块中定义的 `firepower` 值。\n\n重启你的\
    \ repl 并尝试拿起、放下和发射箱子。你可能会注意到的某些异常行为是向上发射的物体往往会在天花板上滑动一段时间，直到速度耗尽。我们可以通过添加以下代码在与墙碰撞时杀死移动物体的速度来防止这一点：\n\
    \n```\nonCollide(\"movable\", \"wall\", (a, b) => {\n  a.speed = 0;\n});\n```\n\
    \n## 物体碰撞\n\n如果没有物体之间的碰撞，我们的物理游乐场将完整，让我们添加简单的代码让物体相互推动。将以下碰撞处理程序添加到文件的底部：\n\n"
