  mdcn: "\n\n## 移动玩家\n\n让我们写一些代码来控制玩家。首先，我们需要使用 `get()` 获取玩家的引用：\n\n```javascript\n\
    // player\nplayer = get(\"player\");\n```\n\n现在我们将添加代码来控制玩家向左向右移动。由于我们将使用鼠标控制玩家的重力枪（gravity\
    \ gun），因此使用 WASD 键而不是方向键来控制玩家。添加以下代码：\n\n```javascript\nonKeyDown(\"a\", () =>\
    \ {\n  player.move(-player.speed, 0)\n});\nonKeyDown(\"d\", () => {\n  player.move(player.speed,\
    \ 0)\n});\n```\n\n我们检测 A 键的 `keyDown` 事件来让玩家向左移动，检测 D 键让玩家向右移动。`move()` 函数会自动检查与实体物体的碰撞，因此只有在有空间时玩家才会移动。\n\
    \n```javascript\nonKeyDown(\"w\", () => {\n  if (player.isGrounded()) {\n    player.jump(player.jumpspeed)\n\
    \  }\n});\n```\n\n`isGrounded()` 和 `jump()` 函数由 `body()` 组件提供，这使得在 Kaboom 中实现平台类移动变得非常简单。\n\
    \n现在重新运行你的 repl（或刷新 repl 网页），你应该能够使用 A 和 D 键左右移动，并使用 W 键跳跃。如果玩家跳出平台，他们会掉视野。我们可以通过让游戏相机跟随玩家来修复。在你的键盘处理代码下方添加以下代码：\n\
    \n> https://kaboomjs.com#get  \n> https://kaboomjs.com#onKeyDown\n\n## 使用 Kaboom.js\
    \ 构建物理游乐场\n\n```javascript\n// //相机跟随玩家\nplayer.onUpdate(() => {\n  camPos(player.pos);\n\
    });\n```\n\n这段代码将每帧运行，并在玩家移动时保持相机聚焦在玩家身上。\n刷新你 repl 内的浏览器并尝试一下。\n\n## 使用重力枪抓取物体\n\
    \n现在我们已经实现了通用的平台功能，是时候添加重力枪了。玩家将用鼠标瞄准重力枪。它将有一个范围，我们将用线显示出来。进入该范围的物体周围会绘制较粗的轮廓。当玩家按鼠标右键时，范围内的物体将向他们移动，直到到达一个次级的“持有”范围。持有范围内的物体将随玩家移动，直到点击鼠标左键，在此时它们将被射向空中。或者，玩家可以点击鼠标右键丢掉所持有的物体。\n\
    \n在上面的代码中，我们实现了水平移动（行走）和垂直移动（跳跃）。实现我们的重力枪需要我们实现任意角度的移动。为了完成这一点，我们需要编写几个辅助函数。在页面顶部，并在\
    \ `kaboom();` 行下方添加以下代码：\n\n```javascript\n// 辅助函数\nfunction angleBetween(p1,\
    \ p2) {\n  return Math.atan2(p2.y - p1.y, p2.x - p1.x);\n}\n\nfunction pointAt(distance,\
    \ angle) {\n  return vec2(distance*Math.cos(angle),\n  -distance*Math.sin(angle));\n\
    }\n```\n\n第一个函数 `angleBetween()` 使用 JavaScript 的 `Math.atan2()` 来确定两点与水平线之间的角度。第二个函数\
    \ `pointAt()` 使用正弦和余弦确定特定距离和角度下的点。\n接下来，我们将添加两个自定义组件：\n\n- `gravitygun()`，它将为玩家的重力枪定义属性和函数。\n\
    \n> https://kaboom.js/#onl/update  \n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/atan2\n\
    \n## 使用 Kaboom.js 构建物理游乐场\n\n- `physics()`，它将为重力枪操控的移动物体定义属性和函数。\n\n在你的辅助函数定义下方添加\
    \ `gravitygun()` 组件的代码：\n\n```javascript\n// 自定义组件\nfunction gravitygun(range,\
    \ hold, firepower) {\n  return {\n    id: \"gravitygun\",\n    require: [\"pos\"\
    ],\n  };\n}\n```\n\n组件被写为返回特定格式对象的函数。每个组件都应该有一个 `id`，以及它通过 `require` 属性所依赖的组件列表。除此之外，组件可以拥有任意属性（这些属性会附加到它们的父对象上）以及将集成到游戏事件循环中的特殊函数。\n\
    \n我们组件的唯一依赖是 `pos()`，因为它无法在世界中没有位置的物体上工作。函数参数将允许我们以这种形式自定义此组件，即指定重力枪的范围、持有距离和火力。\n\
