    \ 一个 \"start\" 场景，等待玩家按下按钮开始游戏。\n- 一个主 \"game\" 场景，它将包含关卡所有的逻辑。\n\n我们可以使用 `go`\
    \ 函数来切换场景。让我们添加 \"start\" 场景，并让游戏启动：\n\n```javascript\nscene(\"start\", () =>\
    \ {\n  add({\n    text(\"Press enter to start\", { size: 24 }),\n    pos(vec(160,\
    \ 120)),\n    origin(\"center\"),\n    color(255, 255, 255),\n  });\n\n  onKeyRelease(\"\
