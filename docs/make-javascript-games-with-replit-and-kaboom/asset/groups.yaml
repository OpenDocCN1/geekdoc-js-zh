    8 9 const BULLET_VANISHING_POINT = vec2(SCREEN_WIDTH * 0.5, SCREEN_HEIGHT * 0.33);\n\
    10 add((\n11 add([\n12 rect(1, 1),\n13 pos(BULLET_ORIGIN_LEFT),\n14 area),\n15\
    \ color(255, 0, 0),\n16 \"bullet\",\n17 {\n18 bulletSpeed: BULLET_SPEED ,\n19\
    \ targetPos: BULLET_VANISHING_POINT\n20 }\n21 ]);\n22 \n23 add([\n24 rect(1, 1),\n\
    25 pos(BULLET_ORIGIN_RIGHT),\n26 color(255, 0, 0),\n27 \"bullet\",\n{\n  bulletSpeed:\
    \ -1*BULLET_SPEED,\n  targetPos: BULLET_VANISHING_POINT\n});\n```\n\n```\nplay(\"\
    shoot\", {\n  volume: 0.2,\n  detune: rand(-1200, 1200),\n});\n```\n\nWhen the\
    \ player fires, we use the spawnBullet function to create a new set of laser bullets.\
    \ To make it seem as though they're coming from under the spaceship each other,\
    \ we calculate our bullets' starting positions a quarter way from each side of\
    \ the screen and a third of the way using the multipliers 0.25 and 0.33 respectively.\n\
    \nThen we calculate where the bullets to end. This is the same position as the\
    \ crosshairs. Using these values, we create 2 bullet objects - simple 1 pixel\
    \ with the tag bullet and color to set (255,0,0) so they look menacing. We also\
    \ add custom properties to the object: A speed for the bullet to move out, and\
    \ at the vanishing point where its course ends.\n\nAs a final detail, we set our\
