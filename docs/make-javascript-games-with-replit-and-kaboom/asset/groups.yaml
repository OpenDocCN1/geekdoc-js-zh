    Building tic-tac-toe with WebSocket and Kaboom


    ![](img/e909780a5f974ff614ba5223d44aa19b_140_0.png)


    You can connect to your game in another browser tab, and enter another name. Then
    you should see both names come up, and the status message change to allow a player
    to make a move. Of course, we haven''t yet implemented the code to enable making
    a move from the UI, so let''s do that now.


    # Handling player moves


    We want a player to be able to click on a block to place their move. Kaboom has
    a function onMouseRelease^279 that we can use to handle mouse click events. All
    we need then is the position the cursor is at, and we can map that to one of the
    board positions using boardSquares array to do the lookup. We''ll use the Kaboom
