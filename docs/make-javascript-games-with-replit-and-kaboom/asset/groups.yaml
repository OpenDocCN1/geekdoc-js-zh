    \ we\ncheck if Mario is frozen, in which case we call our standing method to Mario's\
    \ pose. Then\ncheck if Mario is not on the ground, or in other words he is in\
    \ the air, using the grounded() method\nprovided by the body^360 component. This\
    \ method returns true if he is on a solid object, or false\notherwise. If this\
    \ comes back false, we call the jumping method to stop any animations and set\
    \ the\nstatic jumping frame.\n\nIf Mario is not jumping, he is grounded, and we\
    \ check if the user currently has the left or right\nkey down. If so, Mario is\
    \ running(). The final condition is if Mario is on the ground but\nnot moving,\
    \ then he must be standing.\n\nNice! Uncomment the mario component line in the\
    \ levelConf to activate this new component on\nMario. Update the output and test\
