  - "[PAGE 71]\n\nBuild a Space Shooter with Kaboom.js\n\n# Adding Laser Guns\n\n\
    Because the game takes place in outer space, the weapon of choice is a laser gun.\
    \ We'll need to add functions to create the bullet when the players fire, and\
    \ to control the direction of the bullets. We'll also need to add another key\
    \ handler to check when the player presses a key to \"fire\", which is the space\
    \ key in this game.\n\n```\nconst BULLET_SPEED = 400;\n\nonKeyPress(\"space\"\
    , () => {\n  spawnBullet(player.pos);\n});\n\nfunction spawnBullet(bulletpos)\
    \ {\n  if (current_direction == directions.LEFT){\n    bulletpos = bulletpos.sub(10,0);\n\
    \  } else if (current_direction == directions.RIGHT){\n    bulletpos = bulletpos.add(10,0);\n\
    \  }\n  add([\n    rect(6, 2),\n    pos(bulletpos),\n    origin(\"center\"),\n\
    \    color(255, 255, 255),\n    area(),\n    \"bullet\",\n    {\n      bulletSpeed\
    \ : current_direction == directions.LEFT?-1*BULLET_SPEED:BULLET_\n    }\n  ]);\n\
    }\n\nplay(\"shoot\", {\n  volume: 0.2,\n  detune: rand(-1200, 1200),\n});\n```\n\
    \nFirst, we add a constant BULLET_SPEED to define the speed at which the laser\
    \ \"bullets\" fly across the screen. Then we use the onKeyPress¹¹ event to trigger\
    \ the shooting. Notice onKeyPress only calls the event handler once as the key\
    \ is pressed, unlike the onKeyDown event we used for moving.\n\n> ¹¹https://kaboomjs.com/#onKeyPress"
  - "[PAGE 72]\n\n# Build a Space Shooter with Kaboom.js\n\nis because it's more fun\
    \ if the player needs to bash the “fire” button as fast as possible to take down\
    \ an enemy, rather than just having automatic weapons.\n\nThe onPress handler\
    \ calls the spawnBullet function with the player's current position. This function\
    \ handles creating a new laser shot in the correct direction. The first few lines\
    \ of the method adjust the bullet's starting position to the left or right of\
    \ the spaceship's position. This is because the position of the spaceship that\
    \ gets to the center is the center of the spaceship (remember the origin component\
    \ we added to it earlier). We adjust it a little so that the bullet looks like\
    \ it is coming from the edge of the spaceship.\n\nThen we add a bullet object\
    \ to the game using the add118 function. We don't use a sprite for the bullet,\
    \ but draw a rect119, rectangle with any color. We tag the bullet so we can refer\
    \ to it later when detecting if hit something. We also give it a custom property,\
    \ bulletSpeed, which is the distance and we want the bullet to move on each frame.\n\
    \nFinally, we add sound when the player shoots. The play120 function plays “shoot.wav”.\
    \ We adjust the volume down a bit, so it fits better with the overall mix. We\
    \ use theS parameter with a random number generator, rand121 to change the pitch\
    \ of the sound each time it's played. This is so the sound doesn't become too\
    \ repetitive and also makes it weird and “spacy”.\n\nNow we set the velocity to\
    \ make it move on each frame. We can do this using onUpdate122 event, using the\
    \ bullet tag to identify the objects we want to update:\n\n```\nonUpdate(\"bullet\"\
    , (b) => {\n  b.move(b.bulletSpeed, 0);\n  if ((b.pos.x < 0) || (b.pos.x > MAP_WIDTH))\
    \ {\n    destroy(b);\n  }\n});\n```\n\nWith each frame, the action event updates\
    \ the objects with the matching tag, in this case bullet. We call move123 on the\
    \ bullet, using the custom value for bulletSpeed that we assigned to it creation.\
    \ We also check to see if the bullet has gone off screen, and if so, we destroy124\
    \ it.\n\nWe also need to destroy the bullet if it hits a platform. We can do this\
    \ using the Kaboom125 onCollide event. Adding the following code:\n\n> 118https://kaboomjs.com/doc/#add\n\
    119https://kaboomjs.com/doc/#rect\n120https://kaboomjs.com/doc/#play\n121https://kaboomjs.com/doc/#rand\n\
    122https://kaboomjs.com/doc/#onupdate\n123https://kaboomjs.com/doc/#pos\n124https://kaboomjs.com/doc/#move\n\
    125https://kaboomjs.com/doc/#destroy\n126https://kaboomjs.com/doc/#onCollide"
