    \ level.spawn(\"p\", 1, 10)\n);\n```\n\n按下 Command + S 或 Control + S，然后在启动屏幕提示处按回车。你应该看到我们马里奥世界的复制版，而不是错误消息。\n\
    \n你还会看到敌人角色在晃动脚，就像在尝试走路。这是因为我们在关卡配置中添加敌人 E 时，在精灵组件中指定了它必须使用 `Walking` 动画，而该动画定义在\
    \ `enemies.json` 文件中。Kaboom 会使用该动画启动角色。\n\n# 使用 Kaboom.js 构建类马里奥风格的横滚型游戏\n\n![](img/e909780a5f974ff614ba5223d44aa19b_156_0.png)\n\
    \n静态马里奥世界\n\n点击打开 gif^310\n\n好了，回到查看我们添加的代码及其作用。首先，我们像处理开始场景时一样定义了一个新的 `scene`^311。这次，我们指定了一个可以传递给场景的参数\
    \ `levelNumber`。我们给这个参数设置了默认值 0。这将是我们的 `LEVELS` 数组中的第一个关卡——从索引 0 开始，所以是第 1 关。这个参数将允许我们在到达关卡结束时再次进入场景，但参数设为\
    \ 1，这样我们就可以玩下一个关卡。在创建场景时，你可以指定任何喜欢或需要的参数，并可以将值从一个场景传递到另一个场景。这非常有用，例如如果你你想将玩家分数传递给游戏结束场景，或者从开始场景传递玩家选项。\n\
    \n接下来，我们定义了一些 `layers`^312。图层允许我们拥有不影响游戏的背景——我们称之为 `bg`。我们将所有主游戏对象（如我们的英雄、他的敌人以及他交互的任何其他对象）放置在\
    \ `game` 层，并将所有 UI 元素（如当前分数、血量等）放置在 `ui` 层。我们创建了默认图层，所以如果我们没有在游戏对象上指定图层，它将绘制在\
    \ `game` 层上。\n\n在下一行代码中，我们通过调用 `addLevel`^313 函数初始化并创建关卡。我们将值传递给 `LEVELS` 数组，使用从添加到场景的\
    \ `levelNumber` 参数的索引。我们还传递了赋值 `levelConf` 变量的关卡地图中所有符号的配置。此时，地图和其中的所有字符都已被绘制到场景中。注意，由于地图比我们在\
    \ Kaboom 窗口设置中设置的尺寸宽，我们只能看到地图的一部分。这很棒，因为这将允许我们在马里奥开始行走时显示更多地图内容。\n\n然后，我们为背景图层添加了效果——云朵、山丘和灌木。注意这些元素上使用的\
    \ `layer` 组件。我们这样做是为了它们不会与我们的游戏对象产生交互——它们只是增加了一些视觉趣味。你可以添加尽可能多——原版马里奥在整个关卡中以重复模式拥有它们。\n\
    \n我们还在 `ui` 层上添加了一些临时文本，让玩家知道他们处于哪里。注意我们使用了 `lifespan`^314 组件来在 1 秒后自动淡出并移除信息。\n\
    \n最后，我们将马里奥加入游戏！我们本可以通过在关卡定义中放置他的符号 `p` 来添加他。但是，通过使用 `level.spawn()`^315 手动将其添加到场景，我们可以获取它的引用。这在我们以后处理碰撞和其他交互时非常有用。我们还设置了要放置字符的位置。\n\
    \n# 让马里奥移动起来\n\n场景已准备就绪，让我们添加一些交互。玩家将使用方向键让马里奥向左移动，使用空格键让他跳跃。我们将使用 `keyDown`^316\
    \ 函数来左右移动，因为我们希望只要玩家按住键，马里奥就会保持移动。然后可以使用 `keyPressed`^317 函数让马里奥跳跃。玩家每次想让马里奥跳跃时都需要按下空格键——狂按按钮总是很有趣的！在游戏底部添加代码：\n\
    \n```\nconst SPEED = 120;\n\nkeyDown(\"right\", () => {\n  player.flipX(false);\n\
    \  player.move(SPEED, 0);\n});\n\nkeyDown(\"left\", () => {\n  player.flipX(true);\n\
    \  player.move(-SPEED, 0);\n});\n```\n\n> ^310https://docs.replit.com/images/tutorials/32-mario-kaboom/mario-world.gif\n\
    ^311https://kaboomjs.com/#scene\n^312https://kaboomjs.com/#layers\n^313https://kaboomjs.com/#add\n\
    \n^314https://kaboomjs.com/#lifespan\n^315https://kaboomjs.com/#spawn\n^316https://kaboomjs.com/#keyDown\n\
    ^317https://kaboomjs.com/#keyPressed\n\n```\non(\"space\", () => {\n  if (player.grounded())\
