    \ this.holdLine.p2 = pointAt(hold, this.aimAngle);\n    }\n  };\n}\n```\n\n##\
    \ Build a Physics playground with Kaboom.js\n\nfunction physics(mass) {\n  return\
    \ {\n    id: \"physics\",\n    require: [\"area\", \"body\"],\n    mass: mass,\n\
