  mdcn: "\n\n## 在 Kaboom.js 中构建 Flappy Bird\n\n185\n\n![](img/e909780a5f974ff614ba5223d44aa19b_189_0.png)\n\
    \n点击打开 gif *05\n\n## 添加水管\n\n现在我们可以进入游戏的主体部分——添加 Flappy 飞跃时需要穿过的移动水管。\n\n这里是游戏中水管布局的示意图。\n\
