    # Building a Mario-like side-scroller with Kaboom.js


    The Mario series is one of the most known and loved game series of all time. The
    first Mario game was released by Nintendo in the mid-80s, and people haven''t
    stopped playing Mario since.


    Tons of games still use the basic side-scroller formula of Mario, so it''s a good
    game to build to learn the basics of game making. We''ll build it in the new Kaboom$^{284}$
    game engine. Kaboom has many useful functions for building platform games, and
    we''ll try to go through as many as we can in this tutorial.


    ![](img/e909780a5f974ff614ba5223d44aa19b_143_0.png)


    The finished game


    Click to open gif$^{285}$


    $^{284}$https://kaboomjs.com

    $^{285}$https://docs.replit.com/images/tutorials/32-mario-kaboom/bigger-kill-scenes.gif'
  - '[PAGE 144]


    # Designing the game


    We''d like to make a game that has the Mario essence. This means we need a few
    things:


    +   - The ability to jump and bump into reward boxes.

    - A big and small character type.

    - The ability to attack enemies by jumping on them.

    - The classic Mario scrolling and camera motion.


    For the graphics, we will use a tile set from this creator²⁸⁶.


    # Creating a new project in Replit


    Head over to Replit²⁸⁷ and create a new repl. Choose Kaboom as your project type.
    This repl a name, like "Mario".


    ![](img/e909780a5f974ff614ba5223d44aa19b_144_0.png)


    The repl has booted up, you''ll see a main.js file under the "Code" section. This
    is where we''ll start. It already has some code in it, but we''ll replace that.


    Download this archive of sprite and assets files²⁸⁸ that we''ll need for the game,
    and unzip them for your computer. In the Kaboom editor, click "Files" icon in
    the sidebar. Now drag and drop all


    ²⁸⁶https://dotstudio.itch.io/super-marco-1-remade-assets

    ²⁸⁷https://replit.com

    ²⁸⁸https://docs.replit.com/tutorial-files/mario-kaboom/mario-resources.zip'
