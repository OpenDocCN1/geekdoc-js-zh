  - "[PAGE 152]\n\n# Building a Mario-like side-scroller with Kaboom.js\n\n```\narea({\
    \ width: 16, height: 16 }),\nsolid(),\nbody(),\n//patrol(50),\n//enemy(),\norigin(\"\
    badGuy\"),\n\n\"p\" = () => [\n  sprite(\"mario\", { frame: 0 }),\n  area({ width:\
    \ 16, height: 16 }),\n  body(),\n  mario(),\n  //bump(150, 20, false),\n  origin(\"\
    bot\"),\n  \"player\"\n];\n```\n\nThat looks like a lot, but it's really one pattern\
    \ repeated for each element. Let's take it apart.\n\nThe first 3 lines of the\
    \ config set the default width and height of each element in the level maps. We\
    \ use pos to specify where to position the whole map in the Kaboom canvas. This\
    \ is normally going to be (0,0), which is at the top of the screen.\n\nNext we\
    \ have definitions for the symbols used in the map. Each definition is a function\
    \ that returns an array of components. Each character is made up of 1 or more\
    \ components. Components give special properties to each character. There are\
    \ built-in components for many properties, use sprite²⁷ to give the character\
    \ an avatar, body²⁸ to make the character respond to gravity, solid²⁹ to make\
    \ the character solid so others characters cannot move through it, and many others.\n\
    \nKaboom allows you to write your own components to create any property or behavior\
    \ you like for a character. The components patrol, mario, enemy, and bump are\
    \ all custom here. You'll notice that those custom components are commented out\
    \ (//), as we'll need to create the implementations for them before we use them.\
    \ We'll do that later in this tutorial.\n\n# Adding a scene\n\nKaboom \"scenes\"\
    ⁶ allow us to group logic and levels together. In this game we'll have 2 scenes:\n\
    \n> ⁶https://kaboom.com/doc/intro\n²⁷https://kaboom.com/#sprite\n²⁸https://kaboom.com/#body\n\
    ²⁹https://kaboom.com/#solid"
  - "[PAGE 153]\n\n# Building a Mario-like side-scroller with Kaboom.js\n\n+   - A\
    \ \"start\" or intro scene, which waits for a player to press a button to start\
    \ the game. We'll also\nreturn to this scene if the player dies, so they can start\
    \ again.\n- A main \"game\" scene, which will contain the game levels and all\
    \ the logic to move Mario,\nthe logic for the enemies and rewards, etc.\n\nWe\
    \ can use the go^301 function to switch scenes.\nLet's add the \"start\" scene,\
    \ and make the game to go to the start scene by:\n\n```\nscene(\"start\", () =>\
    \ {\n  add({\n    text(\"Press enter to start\", { size: 24 }),\n    pos(vec(160,\
    \ 120)),\n    origin(\"center\\),\n    color(255, 255, 255),\n  });\n\n  onKeyRelease(\"\
    enter\", () => {\n    go(\"game\");\n  });\n});\ngo(\"start\");\n```\n\nWe define\
    \ the scene^302 function. This function takes a string as the scene name-\nwe're\
    \ calling the scene \"start\". We're using an inline function here, using arrow\
    \ function notation^303.\nYou could also use the function keyword, if you'd like\
    \ to specify a function in that way.\n\nWe also add some instruction text in the\
    \ start scene, using the text^304 component and setting\nt text's content and\
    \ size. The pos^305 component sets the position of the text on the screen, and\
    \ the\norigin^306 component sets the color of the text to white using the color^307\
    \ component, which uses RGB (red, green, blue)\nvalues from 0-255.\n\nWe also\
    \ have a call to the function onKeyRelease^308, which listens for the key being\
    \ pressed.\nIf the key is pressed, we go to the main game scene (we'll add shortly!)\n\
    \nFinally, we use the go^309 function to go to the start scene when the game starts\
    \ up.\n\n> ^301 https://kaboomjs.com/#go\n302 https://kaboomjs.com/#scene\n303\
    \ https://developer.mozilla.org/en-US/Web/JavaScript/Reference/Functions/Arrow\n\
    304 https://kaboomjs.com/#text\n305 https://kaboomjs.com/#pos\n306 https://kaboomjs.com/#origin\n\
    307 https://kaboomjs.com/#color\n308 https://kaboomjs.com/#onKeyRelease\n309 https://kaboomjs.com/#go"
- md: "\n# Building a Mario-like side-scroller with Kaboom.js\n\nAfter copying the\
    \ code into your repl, press Command + S (Mac) or Control + S (Windows/Linux)\
    \ to update the output window. You should see something like this:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_154_0.png)\n\
    \nStart scene\n\nNote that if you push enter now to start the game, you'll get\
    \ an error message. Don't worry, we'll sort that out soon.\n\n# Adding the main\
    \ game scene\n\nNow let's get the game scene up and running. Add the code below:\n\
    \n```\nscene(\"game\", (levelNumber = 0) => {\n  layers(\n    \"bg\",\n    \"\
    game\",\n    \"ui\"\n  );\n\n  const level = addLevel(LEVELS[levelNumber], levelConf);\n\
    \  add([\n```\n\n```\nsprite(\"cloud\"),\npos(20, 50),\nlayer(\"bg\"),\n);\n```\n\
    \n```\nadd([\nsprite(\"hill\"),\npos(32, 208),\nlayer(\"bg\"),\norigin(\"bot\"\
    )\n]);\n```\n\n```\nadd([\nsprite(\"shrubbery\"),\npos(200, 208),\nlayer(\"bg\"\
    ),\norigin(\"bot\")\n]);\n```\n\n```\nadd(\ntext(\"Level \" + (levelNumber + 1),\
    \ { size: 24 }),\npos(vec(160, 120)),\ncolor(255, 255, 255),\norigin(\"center\"\
    ),\nlayer(\"ui\"),\nlifespan(1, { fade: 0.5 })\n);\n```\n\n```\nconst player =\
    \ level.spawn(\"p\", 1, 10)\n);\n```\n\nPress Command + S or Control + S, and\
    \ push enter at the start screen prompt. You should see our replica of Mario World\
    \ instead of the error message.\n\nYou should also see the enemy character wobble\
    \ its feet, like it's trying to walk. This is because when we added the enemy\
    \ definition E in the level config, we specified in the sprite component that\
    \ it must use the Walking animation, which is defined in the enemies.json file.\
    \ Kaboom starts the character using that animation.\n\n# Building a Mario-like\
    \ side-scroller with Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_156_0.png)\n\
    \nStatic Mario world\n\nClick to open gif^310\n\nOk, back to looking at the code\
    \ we added and what it does. First, we define a new `scene`^311 like we did for\
    \ the start scene. Time, we specify a parameter `levelNumber` that can be passed\
    \ to the scene. We give this parameter a default value of 0. This will be the\
    \ first level in our LEVELS array - starts at index 0, so is 1. This parameter\
    \ will allow us the scene again when we get to the end of the level, but with\
    \ 1 as the parameter so that we can play the next level. You can specify any parameters\
    \ you like or need when creating a scene, and you can pass values from one scene\
    \ to another. This is very useful, for example if you want to pass the player\
    \ score to an end game scene, or pass player options from the start scene.\n\n\
    Next, we define some `layers`^312. Layers allow us to have backgrounds that don't\
    \ affect the game - we call that bg. We'll place all the main game objects (like\
    \ our hero, his enemies, and any other objects he interacts with) on game layer,\
    \ and all the UI elements (like current score, health, etc.) on the ui layer.\
    \ We make the default layer, so if we don't specify a layer on a game object,\
    \ it will be drawn on the game layer.\n\nIn the next line of code, we initialize\
    \ and create the level by calling the `addLevel`^313 function. We pass in the\
    \ value to the LEVELS array, using the index from the `levelNumber` parameter\
    \ we added to the scene. We also pass in the configuration for all the symbols\
    \ in the level map that we assigned to the levelConf variable. At this point,\
    \ the map and all the characters in it are drawn to the scene. Note, because the\
    \ map is wider than the size we set in the settings for the Kaboom window, we\
    \ only see part of the map. It is great, because it will allow us to show more\
    \ of the map as Mario starts walking.\n\nThen we add a effect to the background\
    \ layer - clouds, hills and shrubries. Note the use of the layer component on\
    \ these elements. We do so that they don't interact with our game objects - they\
    \ just add some visual interest. You can add as many as you like - the original\
    \ Mario has in a repeating pattern across the whole level.\n\nWe also add some\
    \ temporary text to the ui layer to let the player know where they are on. Notice\
    \ that we use the lifespan^314 component to automatically fade out and remove\
    \ the info after 1 second.\n\nFinally, we add Mario to the game! We could have\
    \ added him by placing his symbol, p, on our level definition. However, by adding\
    \ him manually to the scene using level.spawn()^315, we can get a reference to\
    \ this. This will be useful later when we are dealing with collisions and other\
    \ interactions. We also set the position where the character to be placed at.\n\
    \n# Making Mario move\n\nThe scene is all set up, let's add some interaction.\
    \ The player will use the arrow keys to move Mario left and the space bar to make\
    \ him jump. We'll use the keyDown^316 function for moving left and right, as we\
    \ want Mario to keep moving as long as the player holds down key. Then we can\
    \ use the keyPressed^317 function to make Mario jump. The player will need to\
    \ push the space key each time they want Mario to jump - it's always fun to smash\
    \ buttons! Adding the code at the bottom of the game:\n\n```\nconst SPEED = 120;\n\
    \nkeyDown(\"right\", () => {\n  player.flipX(false);\n  player.move(SPEED, 0);\n\
    });\n\nkeyDown(\"left\", () => {\n  player.flipX(true);\n  player.move(-SPEED,\
    \ 0);\n});\n```\n\n> ^310https://docs.replit.com/images/tutorials/32-mario-kaboom/mario-world.gif\n\
    ^311https://kaboomjs.com/#scene\n^312https://kaboomjs.com/#layers\n^313https://kaboomjs.com/#add\n\
    \n^314https://kaboomjs.com/#lifespan\n^315https://kaboomjs.com/#spawn\n^316https://kaboomjs.com/#keyDown\n\
    ^317https://kaboomjs.com/#keyPressed\n\n```\non(\"space\", () => {\n  if (player.grounded())\
    \ {\n    player.jump();\n  }\n});\n```\n\n# Building a Mario-like side-scroller\
    \ with Kaboom.js\n\n```\nconst SPEED = 120;\n\nkeyDown(\"right\", () => {\n  player.flipX(false);\n\
    \  player.move(SPEED, 0);\n});\n\nkeyDown(\"left\", () => {\n  player.flipX(true);\n\
    \  player.move(-SPEED, 0);\n});\n\non(\"space\", () => {\n  if (player.grounded())\
    \ {\n    player.jump();\n  }\n});\n```\n\nWait, I need to fix the logic based\
