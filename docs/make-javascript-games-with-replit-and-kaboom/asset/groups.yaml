    Overlay 3d system over 2d system


    Now we can add the alien''s x and y positions in 3D coordinate space relative
    to the center point of the screen. We bias the center point "up" a bit, as this
    will seem to be the center of the spaceship''s view when we add the cockpit. We
    also modify each of these x and y positions by a factor relating to the alien''s
    z position: As the alien approaches, its zpos value decreases, and our use this
    value to draw the alien to the center of the screen. This enhances the depth illusion
    and makes it feel to the player that the aliens are coming at them.


    Finally, we see if the alien is very close by seeing the zpos < 1. If it is, we
