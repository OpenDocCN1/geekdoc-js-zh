  mdcn: "\n\n# 使用 Kaboom.js 构建类马里奥横向卷轴游戏\n\n顺带提一下，在游戏中按下 F1 可以开启 Kaboom 调试模式，它会在每个游戏元素周围绘制一个区域框，你可以轻松看到角色何时发生碰撞。它还会显示其他有用信息，比如帧率和角色属性：\n\
    \n```\nFPS: 40\n```\n\n![](img/e909780a5f974ff614ba5223d44aa19b_165_0.png)\n\n\
    ```\nsprite: \"enemies\"\narea\nsolid\nbody\norigin: bot\nbadguy\npos: (112, 200)\n\
    grid\n```\n\n### 调试模式\n\n回到我们的代码。我们在 `squash` 方法中评估了敌人被踩扁的逻辑。我们有一个名为 `isAlive`\
    \ 的方法，用它来判断敌人是否即将伤害马里奥。通常它是 `true`，但一旦敌人被踩扁变得无害，就会被设置为 `false`。我们还使用了巡逻（patrol）组件让敌人来回移动。然后我们调用\
    \ `stop`，这是由 `sprite` 组件添加的方法。调用 `stop` 会停止当前动画的播放。接着我们使用 `sprite` 的帧作为 `2`，从而将敌人踩扁，并更新高度和宽度使其与帧的大小相同。最后，我们可以使用\
    \ `wait` 添加生命周期组件，让角色在 0.5 秒后从屏幕上移除，并在 0.1 秒内淡出。\n\n现在让我们将这个组件添加到敌人中。首先，取消我们之前创建的\
    \ `levelConf` 设置中 `//enemy()` 这一行代码的注释。\n\n- https://kaboomjs.com/#area\n- https://kaboomjs.com/#sprite\n\
    - https://kaboomjs.com/#area\n- https://kaboomjs.com/#lifespan\n\n# 使用 Kaboom.js\
    \ 构建类马里奥横向卷轴游戏 162 节\n\n现在在游戏场景中为马里奥和敌人之间创建一个碰撞处理程序，这样我们就能知道它什么时候被踩扁了：\n\n```\n\
    let canSquash = false;\nplayer.onCollide(\"badGuy\", (baddy) => {\n  if (baddy.alive\
    \ == false) return;\n  if (canSquash) {\n    // 马里奥跳到了坏蛋身上：\n    baddy.squash();\n\
    \  }\n  } else {\n    // 马里奥受伤了。之后在这里添加逻辑...\n  }\n});\n```\n\n在 `onCreate` 中，我们检查玩家马里奥是否碰撞到了\
    \ `badGuy` —— 这是我们在 `levelConf` 设置中赋予敌人的标签。然后我们挂载一个处理程序，它接收与马里奥碰撞的实体角色。我们首先检查该实体是否还活着——如果没有活着，则马里奥和死的敌人之间就没有真实的交互。然后，我们检查\
    \ `canSquash` 变量——如果被设置为 `true`，意味着马里奥跳到了敌人身上。我们调用了在敌人的自定义组件中创建的 `squash` 方法。这将执行我们添加的所有逻辑，并“杀死”敌人。我们在处理程序中留了一点空间，以便以后回来添加让马里奥在没有跳上去的情况下伤害敌人的逻辑——我们稍后会添加。\n\
    \n将空格键的 `onKeyPress` 修改如下：\n\n```\nonKeyPress(\"space\", () => {\n  if (player.grounded())\
    \ {\n    player.jump();\n    canSquash = true;\n  }\n});\n```\n\n在这里，我们将 `canSquash`\
    \ 变量设置为 `true`，以便如果玩家在碰撞时跳过了敌人，则允许玩家踩扁敌人。\n\n在 `player.onUpdate` 处理器中添加以下代码：\n\
    \n```\nif (player.grounded()) {\n  canSquash = false;\n}\n```\n\n这段代码将重置 `canSquash`\
    \ 变量，如果玩家在我们之前添加的碰撞处理程序中没有跳过敌人，就不会踩扁敌人。\n\n# 使用 Kaboom.js 构建类马里奥横向卷轴游戏\n\n更新输出并测试我们的游戏。如果你跳到敌人身上，它应该被踩扁并在半秒后消失。\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_167_0.png)\n\n点击打开 gif\n\n## 撞击惊喜箱\n\
    \n马里奥另一个关键动作是用头撞击惊喜箱（带有“?”的箱子）。在马里奥世界中，这可能会释放金币、超级蘑菇（让马里奥变大的那种）等。当马里奥撞击这些箱子时，箱子会被“撞到”并快速上下移动，同时释放它的惊喜。一旦箱子空了，上面的“?”就会被移除。让我们创建控制这些箱子的逻辑。像上面一样，我们将创建更多自定义组件。\n\
