    \ 函数中，我们还处理了将 `run_action` 标记设置为 `false`，这样在我们设置或重置对象时就不会进行更新。我们还将调用封装在 Kaboom.js\
    \ 的 `wait()` 函数中，并留有 0.5 秒的小短延迟。这是因为当我们检测到“游戏结束”条件时，我们不想立即重置游戏，因为这可能会让玩家困惑。\n\n\
