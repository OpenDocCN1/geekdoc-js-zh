    # # Building Snake in Kaboom.js


    Sake was an incredibly popular game, mostly remembered from 1990s era cell phones.
    At the time, it was often the only game you''d find on a phone. In the most basic
    form, it''s a super simple game, but still wildly entertaining. It''s also a great
    game to build when you are learning the basics of game making.


    In this tutorial, we''ll implement Snake using [Kaboom.js](https://kaboomjs.com/)¹
    built into [Replit](https://replit.com)²


    ![](img/e909780a5f974ff614ba5223d44aa19b_5_0.png)


    *The finished game*


    Click to open gif³


    > ¹https://kaboomjs.com

    ²https://replit.com

    ³https://docs.replit.com/images/tutorials/21-snake-kaboom/updated-graphic.gif'
  - '[PAGE 6]


    # Overview and Requirements


    We''ll use the Replit* web IDE to create our version of Snake. If you don''t already
    have a Replit account, create one now*.


    Let''s think a bit about what we need to do. Snake, at its core, is a series of
    blocks representing snake moving over a grid, with the player controlling the
    direction. It also has simple rules – when the snake touches the sides of the
    screen, it dies. If the snake crosses itself, it dies. If the snake eats some
    food (a different type of block), it grows by 1 block. The food then re-appears
    at another place on the screen.


    A few components we will need to build:


    +   - A way to draw the blocks and move them on the screen.

    - A way to get steering directions from the player to the snake.

    - A way to determine if the snake has gone out of bounds of the screen.

    - A way to determine if the snake has crossed over itself (or "bitten itself",
    as another analogy).\n- A way to determine if the snake has eaten, or touched,
    the food.

    - A way to grow the snake.


    That''s a lot to think about! Let''s get started and create a project in Replit*.


    # Creating a New Project


    Log into your Replit* account and create a new repl. Choose Kaboom as your project
    type. Now, give this repl a name, "snake-kaboom".


    > *https://replit.com

    *https://replit.com/signup

    *https://replit.com

    *https://replit.com'
