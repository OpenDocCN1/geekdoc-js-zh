    \ level.spawn()^315, we can get a reference to this. This will be useful later\
    \ when we are dealing with collisions and other interactions. We also set the\
    \ position where the character to be placed at.\n\n# Making Mario move\n\nThe\
    \ scene is all set up, let's add some interaction. The player will use the arrow\
    \ keys to move Mario left and the space bar to make him jump. We'll use the keyDown^316\
    \ function for moving left and right, as we want Mario to keep moving as long\
    \ as the player holds down key. Then we can use the keyPressed^317 function to\
    \ make Mario jump. The player will need to push the space key each time they want\
    \ Mario to jump - it's always fun to smash buttons! Adding the code at the bottom\
    \ of the game:\n\n```\nconst SPEED = 120;\n\nkeyDown(\"right\", () => {\n  player.flipX(false);\n\
    \  player.move(SPEED, 0);\n});\n\nkeyDown(\"left\", () => {\n  player.flipX(true);\n\
    \  player.move(-SPEED, 0);\n});\n```\n\n(Note: The OCR text ended abruptly or\
