  mdcn: "\n\n# 使用 WebSocket 和 Kaboom.js 构建井字游戏\n\n方块中的每个数字代表了棋盘位置在数组中表示的索引。初始情况下，我们将数组中的所有元素填充为\
    \ `null`，表示该方块是开启的。当玩家进行移动占据一个开放空间时，我们将添加该玩家的引用。这样，我们就可以跟踪哪些方块是空的，哪些被哪个玩家占据了。\n\
    \n接下来，我们有一个 `currentPlayer`，当轮到某个玩家移动时，我们会交替将其设置为该玩家。\n\n然后是 `players` 数组，它将持有游戏中两名玩家的引用。这将允许我们在屏幕上显示玩家名称，并通用的跟踪玩家。\n\
    \n结果字段（result field）在每次移动后都会更新。该字段将包含游戏状态（正如我们在上面定义的）。由于它是以对象的形式表示的，它还能持有额外的字段。我们将利用该功能，在游戏以胜利结束时添加一个游戏获胜者的引用。\n\
    \n## 接受连接\n\n当玩家通过 WebSocket 连接时，Sockets.IO 会触发一个连接事件（connection event）。我们可以监听此事件并处理连接跟踪，以及为其他自定义事件创建监听器。这里我们可以定义几个玩家会发射（emit）的自定义事件：\n\
    \n- addPlayer: 我们将其用于玩家请求加入。\n- action: 当玩家想要移动时使用。\n- rematch: 当游戏结束但玩家想要再次游戏时使用。\n\
    \n我们还可以监听内置的断开连接事件（disconnect），如果玩家离开游戏（例如通过关闭浏览器窗口或其连接丢失），该事件将提醒我们。\n\n以下是将监听器挂钩到事件上的代码：\n\
    \n```javascript\nio.on('connection', function (connection) {\n  connection.on('addPlayer',\
    \ addPlayer(connection.id));\n  connection.on('action', action(connection.id));\n\
    \  connection.on('rematch', rematch(connection.id));\n  connection.on('disconnect',\
