    We set the action to run every 0.2 seconds, or 5 times to get smooth movement.
    The action function updates game objects on each frame we use the dt() function¹
    to get the time that has elapsed between the previous and current frame, so that
    we can keep track if 0.2 seconds has elapsed for us to move the snake. If the
    desired delay has not we exit early without updating otherwise we reset the timer
    and execute the code to move the snake. You can experiment with different times
    to see the effect on the game by adjusting the value of the move_delay variable.
    We also check the flag run_action ~ if it is false, we exit early without updating
    anything. Then, the function defines 2 local variables, move_x and move_y, which
    are overall length relative to the head of the snake.


    The function switches on the value of current direction the snake is heading in.
    For each direction, move_x and move_y are set to 0 or -1 block_size. If the snake
    is moving left or right, we add or subtract a block from the x dimension accordingly.
    The same occurs if the snake is moving up or down, in the y dimension


    After the switch, we get the current snake head by indexing the last element in
    the snake body array. Now that we have both the current snake head position and
    the position relative to the snake head to move in, we can create the new snake
    head by adding a new block game object. This is similar to the code we used in
    spawn_snake.


    Now all that remains is to remove a block at the tail of the snake, using the
    built-in array shift function², which removes the first element from an array,
    and returns that element. Because our ''oldest'' part of the snake, also known
    as a tail, is the first element, we shift off the array, and that the Kaboom.js
    destroy function²³ to get rid of the segment. We only do this if the current length
    of the snake body array is greater than our desired snake length. This means if
    we increase snake_length, the overall length of the snake will also increase.
    We can use this when we add food to the game.


    Running the project now and clicking into the game screen allow you to move the
    snake around. Note that there is no collision detection yet, the snake can go
    out of bounds without consequence.


