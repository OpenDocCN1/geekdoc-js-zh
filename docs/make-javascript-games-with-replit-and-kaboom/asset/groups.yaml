    \n## 在 Kaboom.js 中构建 Flappy Bird\n\n![](img/e909780a5f974ff614ba5223d44aa19b_183_0.png)\n\
    \n### 上传精灵\n\n点击打开 gifᵇ382](https://docs.replit.com/images/tutorials/35-flappy-bird/upload-sprites.gif)\n\
    \n## 初始化 Kaboom\n\n在“main”代码文件中，删除所有示例代码。现在我们可以引用 Kaboom 并初始化它：\n\n```js\nimport\
    \ kaboom from \"kaboom\"\n\nkaboom();\n```\n\n让我们导入游戏资源（图形和音效）。我们可以使用 Kaboom 的\
    \ `loadSprite`ᵇ³⁸³](https://kaboomjs.com/#loadSprite) 和 `loadSound`ᵇ³⁴](https://kaboomjs.com/#loadSound)\
    \ 函数：\n\n- loadSprite(\"birdy\", \"sprites/birdy.png\")\n- loadSprite(\"bg\",\
    \ \"sprites/bg.png\")\n- loadSprite(\"pipe\", \"sprites/pipe.png\")\n- loadSound(\"\
    woosh\", \"sounds/woooosh.mp3\")\n\n每个 `load` 函数的第一个参数是我们在稍后代码中用于引用该资源的名称。第二个参数是资源文件的位置。\n\
    \n## 添加场景\n\n场景（Scenes）³'⁸⁵就像 Kaboom 游戏中的不同阶段。游戏通常有三个场景：\n\n- 开场场景（intro scene）：提供一些信息和指令，等待玩家按下“start”。\n\
    - 主游戏（main game）：我们玩的游戏。\n- 结束或游戏结束场景（game over）：给玩家分数或最终结果，并允许他们重新开始。\n\n![](img/e909780a5f974ff614ba5223d44aa19b_184_0.png)\n\
    \n在本教程中，我们将省略开场场景，因为我们已经知道 Flappy bird 是什么以及如何玩，但你以后可以添加自己的开场场景！\n\n让我们添加定义每个场景的代码：\n\
    \n```js\nscene(\"game\", () => {\n  // todo..在此添加场景代码\n});\n```\n\n```js\nscene(\"\
    gameover\", (score) => {\n  // todo..在此添加场景代码\n});\n\ngo(\"game\")\n```\n\n注意\
    \ `gameover` 场景的定义，我们添加了一个自定义参数 `score`。这样我们就可以将玩家最终得分传递给游戏场景进行显示。\n\n要启动整个游戏，我们使用\
    \ `go` 函数，它可以在场景之间切换。\n\n## 构建游戏世界\n\n现在我们已经处理好了主结构和基础函数，让我们开始添加构成 Flappy 世界的角色。在\
    \ Kaboom 中，角色是指任何构成游戏世界的物体，包括地板、平台等，而不仅仅是玩家和机器人。它们也被称为“游戏对象”（game objects）。\n\n\
    我们将从背景开始，使用之前添加的 `.bg` 图片。在游戏场景中添加此代码：\n\n```js\nadd([\n  sprite(\"bg\", {width:\
    \ width(), height: height()})\n]);\n```\n\n在这里，我们使用 `add` 函数向场景添加一个新角色。`add` 函数接收一个组件数组，我们可以用它来赋予每个游戏角色特殊属性。在\
    \ Kaboom 中，每个角色都由一个或多个组件组成。许多属性都有内置组件，例如 `sprite`（赋予角色一个头像）、`body`（让角色对重力产生反应）以及\
    \ `solid`（让角色变为实体，因此其他角色无法穿过它）。\n\n## 在 Kaboom.js 中构建 Flappy Bird\n\n背景不需要做太多，只需要留在最后并保持美观，我们只使用\
    \ `sprite` 组件，它可以显示图像。`sprite` 组件接收精灵名称（即我们之前加载精灵时使用的名称），以及理想情况下它在屏幕上显示的宽度和高度。当我们想要背景覆盖整个屏幕时，我们需要将精灵的宽度和高度设置为屏幕大小。\n\
    \n当你按下“Run”按钮时，你应该能看到 Flappy 从天空掉落：\n\n![](img/e909780a5f974ff614ba5223d44aa19b_186_0.png)\n\
    \n太棒了！现在添加玩家。在场景中添加此代码：\n\n```js\nconst player = add([\n  sprite(\"birdy\"),\n\
    \  scale(2),\n  pos(80, 40),\n  area(),\n  body(),\n]);\n```\n"
