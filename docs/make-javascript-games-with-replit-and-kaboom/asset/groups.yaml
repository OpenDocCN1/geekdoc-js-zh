    We can also update the background to be more interesting. To do this, we can make
    use of Kaboom.js'' layers99. This allows us to create different graphic layers,
    for example one for a static background image, another one for the active game
    objects over that, and another top layer for stats and scores etc.


    We''ll create 2 layers, background and game, to support a background. Download
    and add the background grass image below to your repl as you did for the pizza
    slice:


    ![](img/e909780a5f974ff614ba5223d44aa19b_25_0.png)


    background


    Now, we can set up the layers and add the background grass. Add the following
    code to the top of the main file:


    > 99https://kaboomjs.com/doc/#layers'
  - "[PAGE 26]\n\n# Building Snake in Kaboom.js\n\n```\nlayers({\n  \"background\"\
    ,\n  \"game\",\n});\n\nadd({\n  sprite(\"background\"),\n  layer(\"background\"\
    )\n});\n```\n\nThis sets up 2 layers, which makes the game layer the default layer\
    \ to draw on. Whenever we call add(), we can optionally specify a layer to put\
    \ the object on - if we don't specify a layer, it uses whatever we set as default\
    \ in the layers function. Then we add our background sprite to the background\
    \ layer.\n\nNext, we update the boundaries to look a bit better. Recall that in\
    \ our map we add with addLevel(), each different symbol we can map to a different\
    \ game object. Using this, we can create a good looking border fence, with different\
    \ elements for each side and corners. Download the following 8 sprites as before,\
    \ and upload them to your repl:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_26_0.png)\n\
    \nFence bottom\n\n![](img/e909780a5f974ff614ba5223d44aa19b_26_1.png)\n\nFence\
    \ left\n\n![](img/e909780a5f974ff614ba5223d44aa19b_26_2.png)\n\nFence right\n\n\
    ![](img/e909780a5f974ff614ba5223d44aa19b_26_3.png)\n\nFence top\n\n![](img/e909780a5f974ff614ba5223d44aa19b_26_4.png)\n\
    \nPost bottom left\n\n![](img/e909780a5f974ff614ba5223d44aa19b_26_5.png)\n\nPost\
    \ bottom right\n\n> ³³¹https://kaboomjs.com/doc/#add\n³³⁴https://kaboomjs.com/doc/#layers\n\
    ³³⁵https://kaboomjs.com/doc/#addLevel"
- md: "\n## Building Snake in Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_27_0.png)\n\
    \nPost top left\n\n![](img/e909780a5f974ff614ba5223d44aa19b_27_1.png)\n\nPost\
    \ top right\n\nNow, we can update the level map to use these. Replace the previous\
    \ addLevel code with the following code:\n\n```javascript\nconst map = addLevel([\n\
    \  \"itttttttttt2\",\n  \"11r\",\n  \"11r\",\n  \"11r\",\n  \"11r\",\n  \"11r\"\
    ,\n  \"11r\",\n  \"11r\",\n  \"11r\",\n  \"11r\",\n  \"11r\",\n  \"3bbbbbbbbbbbb4\"\
    ,\n], {\n  width: block_size,\n  height: block_size,\n  pos: vec2(0, 0),\n  \"\
    t\":=> [\n    sprite(\"fence-top\"),\n    area(),\n    \"wall\"\n  ],\n  \"b\"\
    :=> [\n    sprite(\"fence-bottom\"),\n    area(),\n    \"wall\"\n  ],\n  \"l\"\
    :=> [\n    sprite(\"fence-left\"),\n    area(),\n    \"wall\"\n  ],\n  \"r\":\
    \ => [\n    sprite(\"fence-right\"),\n    area(),\n    \"wall\"\n  ],\n  \"1\"\
    : => [\n    sprite(\"post-top-left\"),\n    area(),\n    \"wall\"\n  ],\n  \"\
    2\": => [\n    sprite(\"post-top-right\"),\n    area(),\n    \"wall\"\n  ],\n\
    \  \"3\": => [\n    sprite(\"post-bottom-left\"),\n    area(),\n    \"wall\"\n\
    \  ],\n  \"4\": => [\n    sprite(\"post-bottom-right\"),\n    area(),\n    \"\
    wall\"\n  ],\n});\n```\n\nThe last thing is to upgrade the snake itself. Download\
    \ the skin below, and upload to the repl before.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_28_0.png)\n\
    \nWe create snake pieces in 2 places: in the respawn_snake function, and in the\
    \ draw loop. Update both to use the snake sprite instead of a blue block. The\
    \ respawn_snake function should look like this:\n\n```javascript\nfunction respawn_snake()\
    \ {\n  snake_body.forEach(segment => {\n    destroy(segment);\n  });\n  snake_body\
    \ = [];\n  snake_length = 3;\n\n  for (let i = 1; i <= snake_length; i++) {\n\
    \    snake_body.push(add(\n      sprite('snake-skin'),\n      pos(block_size,\
    \ block_size * i),\n      area(),\n      \"snake\"\n    ));\n  }\n  current_direction\
    \ = directions.RIGHT;\n}\n```\n\nIn the loop callback, the updated code for adding\
    \ a new snake segment to the body should now look like this:\n\n```javascript\n\
    snake_body.push(add(\n  sprite('snake-skin'),\n  pos(snake_head.pos.x + move_x,\
    \ snake_head.pos.y + move_y),\n  area(),\n  \"snake\"\n));\n```\n\nBefore we run\
    \ the game we need to load the sprites that we made reference in the code snippets\
    \ above. Add the following code, below the line kaboom(); to load the sprites\
    \ and make them available in the game:\n\n```javascript\nloadSprite(\"background\"\
    , \"sprites/background.png\");\nloadSprite(\"fence-top\", \"sprites/fence-top.png\"\
    );\nloadSprite(\"fence-bottom\", \"sprites/fence-bottom.png\");\nloadSprite(\"\
    fence-left\", \"sprites/fence-left.png\");\nloadSprite(\"fence-right\", \"sprites/fence-right.png\"\
    );\nloadSprite(\"post-top-left\", \"sprites/post-top-left.png\");\nloadSprite(\"\
    post-top-right\", \"sprites/post-top-right.png\");\nloadSprite(\"post-bottom-left\"\
    , \"sprites/post-bottom-left.png\");\nloadSprite(\"post-bottom-right\", \"sprites/post-bottom-right.png\"\
    );\nloadSprite(\"snake-skin\", \"sprites/snake-skin.png\");\nloadSprite(\"pizza\"\
    , \"sprites/pizza.png\");\n```\n\nIf you run the game now, you should see it looking\
    \ much better!\n\n![](img/e909780a5f974ff614ba5223d44aa19b_30_0.png)\n\nGame graphics\n\
    \nClick to open gif³⁷\n\n## Things to Try\n\nThere is a lot of good functionality\
    \ in Kaboom.js⁸ to try out, and to make the game more entertaining.\nHere are\
    \ some suggestions:\n\n- Create a 2 player version.\n- Add obstacles for the snake.\n\
    - Incrementally speed the game as it goes on, to make it harder. You can do this\
    \ by adjusting the delay parameter of the loop function as the game progresses.\n\
    - Add sound effects⁹ and background music.\n\n> ³⁷https://docs.replit.com/images/tutorials/21-snake-kaboom/updated-graphic.gif\n\
    ³⁸https://kaboomjs.com/\n³⁹https://kaboomjs.com/doc/#play\n\nYou can find the\
    \ code sample for this tutorial on github⁴⁰ or replit⁴¹\n\n* *40https://github.com/ritza-co/make-javascript-games-book-code-book-code-samples/blob/main/1-snake-with-kaboom.md\n\
    *41https://replit.com/@ritza/snake-kaboom\n\n## Building Asteroids in Kaboom.js\n\
    \nFollowing our [previous tutorial on building Snake], in this tutorial we'll\
    \ implement Asteroids, one of the first major arcade game hits, developed by Atari\
    \ in 1979. We'll use Replit's built-in development platform, [Kaboom.js]*†, and\
    \ cover the following topics:\n\n- Getting set up in Kaboom.js.\n- Calculating\
    \ movement angles for our spaceship and bullet mechanics.\n- Random generation\
    \ of asteroid placement.\n- Defining the effects of object collisions.\n- Developing\
    \ a polished game with animation and sound effects.\n\nOur finished game will\
    \ look like this:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_32_0.png)\n\nThe\
    \ finished game\n\n> *https://docs.replit.com/tutorials/21-build-snake-with-kaboom\n\
    †https://kaboomjs.com/\n\n## Building Asteroids in Kaboom.js\n\nClick to open\
    \ gif**\n\nWe will use these Asteroids sprites⁵ and this space background** from\
    \ OpenGameArt.org, and the following sounds from FreeSound:\n\n- Laser*⁷\n- Explosion*⁸\n\
    - Rocket thrust*⁹\n\nWe will also be using music by Eric Matyas of Soundimage.org*¹⁰.\n\
    We created a single ZIP file with the sprites and sounds you will need for this\
    \ tutorial, which you can download here*¹¹.\n\n## Creating a new project and loading\
    \ assets\n\nLog into your Replit¹² account and create a new repl. Choose Kaboom\
    \ as your project type. Give this repl a name, \"asteroids\".\n\n![](img/e909780a5f974ff614ba5223d44aa19b_33_0.png)\n\
    \n# Building Asteroids in Kaboom.js\n\nAsteroids sprites are quite different from\
    \ what you've seen before. To start, we need to initialize and set up Kaboom with\
    \ the scale we want. Replace the code in main.js with:\n\n```javascript\nimport\
    \ kaboom from \"kaboom\";\nkaboom({\n  scale: 1.5\n});\n```\n\nThis will give\
    \ you a canvas with checkerboard pattern.\nNow, let's load up the sprites and\
    \ sound files to make them available in the game. This code loads each of the\
    \ graphic elements we use, and gives them a name so we can refer to them in:\n\
    \n```javascript\nloadRoot(\"sprites/\");\nloadSprite(\"space\", \"space.jpg\"\
    );\nloadSprite(\"rocket1\", \"rocket1.png\");\nloadSprite(\"rocket2\", \"rocket2.png\"\
    );\nloadSprite(\"rocket3\", \"rocket3.png\");\nloadSprite(\"rocket4\", \"rocket4.png\"\
    );\nloadSprite(\"ship\", \"ship.png\");\nloadSprite(\"bullet\", \"bullet.png\"\
    );\nloadSprite(\"asteroid\", \"asteroid.png\");\nloadSprite(\"asteroid_small1\"\
    , \"asteroid_small1.png\");\nloadSprite(\"asteroid_small2\", \"asteroid_small2.png\"\
    );\nloadSprite(\"asteroid_small3\", \"asteroid_small3.png\");\nloadSprite(\"asteroid_small4\"\
    , \"asteroid_small4.png\");\n\nloadRoot(\"sounds/\");\nloadSound(\"rocket_thrust\"\
    , \"rocket_thrust.wav\");\nloadSound(\"laser\", \"laser.wav\");\nloadSound(\"\
    explosion\", \"explosion.mp3\");\nloadSound(\"Steamtech-Mayhem-Looping\", \"Steamtech-Mayhem-Looping.mp3\"\
    );\n```\n\n> ⁵https://docs.replit.com/tutorials/21-snake-with-kaboom\n⁶https://docs.replit.com/images/tutorials/21-snake-kaboom/updated-graphic.gif\n"
