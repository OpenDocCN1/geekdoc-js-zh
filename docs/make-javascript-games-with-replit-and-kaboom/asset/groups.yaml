  - "[PAGE 188]\n\n# Making Flappy fly\n\nOur next task is to save Flappy from plummeting\
    \ to their death by giving control to the player to flap Flappy's wings. We will\
    \ use the space for this. Kaboom has an onKeyPress¹ function, which fires a callback\
    \ with custom code when the specified key is pressed. Add this code to the game\
    \ scene to make Flappy fly when the space key is pressed:\n\n```\nonKeyPress(\"\
    space\", () => {\n  play(\"woosh\");\n  player.jump(400);\n});\n```\n\nIn the\
    \ callback, we first play² a sound of flapping wings to give the player feedback\
    \ and add some interest to the game. Then we use the jump³ method, which is added\
    \ to our player character through the body⁴ component we added earlier. The jump\
    \ function makes a character accelerate sharply. We can adjust just how and high\
    \ the jump should be through the number we pass as an argument to the jump method—the\
    \ larger the number, the higher the jump. Although Flappy is technically not jumping\
    \ (you normally need to be on a solid surface to jump), it still has the effect\
    \ we need.\n\nUpdate the game output window, and if you press the spacebar now,\
    \ you'll be able to keep Flappy in the air! Remember to quickly click in the output\
    \ window as the game starts, so that it can detect player input such as pressing\
    \ the space key.\n\n> ¹https://kaboomjs.com/#onKeyPress\n²https://kaboomjs.com/#play\n\
    ³https://kaboomjs.com/#body\n⁴https://kaboomjs.com/#body"
- md: "\n## Building Flappy Bird in Kaboom.js\n\n185\n\n![](img/e909780a5f974ff614ba5223d44aa19b_189_0.png)\n\
    \nClick to open gif*05\n\n## Adding in the pipes\n\nNow we can get to the main\
    \ part of the game – adding in the moving pipes that Flappy needs to fly through.\n\
    \nHere is a diagram of the layout of the pipes in the game.\n\n> *05https://docs.replit.com/images/35-flappy-bird/flappy-fly.gif\n\
    \n## Building Flappy Bird in Kaboom.js\n\n186\n\n![](img/e909780a5f974ff614ba5223d44aa19b_190_0.png)\n\
    \n### Pipe gap\n\nWe want to move the pipe gap, and therefore the pipes, up and\
    \ down for each new pipe pair that is created. This is so we don't have the gap\
    \ at the center point of the screen constantly – we want it to be slightly different\
    \ for each pipe pair that comes along. We do want to keep the gap size consistent\
    \ though.\n\nLet's start by having the pipe gap in the center of the screen. We'll\
    \ give the pipe gap a size PIPE_GAP. To place the pipes, the bottom of the upper\
    \ pipe should be PIPE_GAP/2 pixels above the center point of the window, which\
    \ is height()/2. Likewise, the top of the lower pipe should be PIPE_GAP/2 pixels\
    \ below the center point of the window, again which is height()/2.\n\nThis way,\
    \ we place the pipe so that the pipe gap is in the center of the window. Now we\
    \ want to randomly move it up or down for each new pair of pipes the way to do\
    \ this is to create a random offset, which we add to each new pipe to effectively\
    \ move the midpoint of the window up or down. We can use the Kaboom rand^496 function\
    \ to do this. The rand^497 function has two parameters to specify the range in\
    \ which the random number should be.\n\nLet's put that together. The Y-position\
    \ of the lower pipe can be calculated as:\n`height()/2 + offset + PIPE_GAP/2`\n\
    \nRemember, the top of the window is y=0, and the bottom is y=height(). In other\
    \ words, the lower down on the screen is the position, the higher y coordinate\
    \ will be.\n\nFor the upper pipe, we can calculate the point where the bottom\
    \ of the pipe should be like this:\n\n`height()/2 + offset - PIPE_GAP/2`\n\n*\
    \ ^496https://kaboomjs.com/#rand\n* ^497https://kaboomjs.com/#rand\n\n## Building\
    \ Flappy Bird in Kaboom.js\n\nKaboom has an origin#8 component that sets the point\
    \ character uses as origin. This is top default, which works well for our lower\
    \ pipe, as our calculations above are calculating for that point. For the upper\
    \ pipe, our calculations are for the bottom of the pipe. Therefore, we can use\
    \ the origin#10 component to specify.\n\nSince we want the pipes to come from\
    \ the right of the screen towards the left, where Flappy is, we'll set their X-position\
    \ to be the width#9 of the screen.\n\nTo identify and query the pipes, use the\
    \ text tag \"pipe\" to them.\nFinally, since we need to create many pipes during\
    \ the game, let's wrap all the pipe code in a function that we will be able to\
    \ call at regular intervals to make the pipes.\n\nHere is the code from all these\
    \ considerations and calculations. Insert this code to the game scene:\n\n```javascript\n\
    const PIPE_GAP = 120;\n\nfunction producePipes(){\n  const offset = rand(-50,\
    \ 50);\n\n  add([\n    sprite(\"pipe\"),\n    pos(width(), height()/2 + offset\
    \ + PIPE_GAP/2),\n    \"pipe\",\n    area(),\n  ]);\n\n  add([\n    sprite(\"\
    pipe\", {flipY: true}),\n    pos(width(), height()/2 + offset - PIPE_GAP/2),\n\
    \    origin(\"botleft\"),\n    area(),\n  ]);\n}\n```\n\nNow we need to do a few\
    \ more things to make the pipes appear and move.\nMove the pipes across the screen,\
