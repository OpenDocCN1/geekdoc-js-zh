    \    pos(MAP_WIDTH / 2, MAP_HEIGHT / 3),\n    layer(\"ui\")\n  ]);\n\n  onKeyRelease(\"\
    enter\", () => {\n    go(\"main\");\n  });\n});\n```\n\nThis scene adds a \"GAME\
    \ OVER\" over the screen until the player releases the enter key. This returns\
    \ the player to the main scene, which is the top of the map.\n\n# Allowing the\
    \ Alien to Attack\n\nNow that we have the shield health, we need to handle the\
    \ alien hitting the player. We use the collide function to:\n\n```javascript\n\
    const ALIEN_DAMAGE = 10;\ncollide(\"alien\", \"player\", (alien, player) => {\n\
    \  shake(2);\n  makeExplosion(alien.pos, 8, 8, 8);\n  destroy(alien);\n  play(\"\
    explosion\", {\n    volume: 0.5,\n    detune: rand(-1200, 1200)\n  });\n  updatePlayerShield(-ALIEN_DAMAGE);\n\
    });\n```\n\nThis is a big event - if the player is hit, we shake the screen and\
    \ play the explosion sound. We call updatePlayerShield to show how much the shield\
    \ is damaged. If the shield is depleted, we destroy the player. We use the makeExplosion\
    \ function to create a visual effect. Sometimes, if the frame rate gets too low,\
    \ the object falls through.\n\n# Raining Gems\n\nIt's time to add the gems that\
    \ give the game its purpose to collect:\n\n```javascript\nfunction spawnGem()\
    \ {\n  let xpos = rand(BLOCK_SIZE, MAP_WIDTH - BLOCK_SIZE);\n  add({\n    sprite(\"\
    gem\"),\n    pos(xpos, BLOCK_SIZE),\n    area(),\n    body(),\n    \"gem\"\n \
    \ });\n}\n\nonUpdate(\"gem\", (gem) => {\n  if (gem.pos.y > MAP_HEIGHT) {\n  \
    \  destroy(gem);\n    spawnGem();\n  }\n});\n\nspawnGem();\n```\n\nOn this planet\
    \ in outer space, the gems rain from the sky, which is the top of our map. We\
    \ calculate a random position, xpos, along the x axis for the gem to appear on\
    \ by calling the rand(). We don't want gems to fall right at the edge of the screen,\
    \ as they will be cut off and the spaceship won't be able to get them because\
    \ of the boundary added around the screen. We limit the random xpos to one BLOCK_SIZE\
    \ from each edge.\n\nNow we add the gem to the scene. The pos component is set\
    \ to the xpos we calculated, with the y component set to the top of the screen.\
    \ This is to avoid the gem getting stuck on our boundary. We also give the gem\
    \ the body component, which makes it subject to Kaboom gravity so that it falls\
    \ towards the ground. We give it the gem label so that we can refer to it.\n"
