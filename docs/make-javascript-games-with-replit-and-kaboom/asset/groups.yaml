    \ to give the effect of shooting into the distance, towards a vanishing point.\n\
    \n```\n1 const BULLET_SPEED = 10;\n2 function spawnBullet() {\n3 4 const BULLET_ORIGIN_LEFT\
    \ = vec2(SCREEN_WIDTH*0.25, (SCREEN_HEIGHT -\n5 HEIGHT*0.33));\n6 const BULLET_ORIGIN_RIGHT\
