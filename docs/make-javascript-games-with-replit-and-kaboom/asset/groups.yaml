  mdcn: "\n# 添加蛇的食物\n\n我们有一条蛇，它会移动，玩家可以控制它的方向。让我们添加一些蛇可以吃的食物，这会让它的身体变得更长。每当蛇吃到食物时，我们需要重新生成食物，所以让我们像之前处理蛇那样，将食物的创建代码也写在一个函数里：\n\
    \n## 在 Kaboom.js 中构建蛇游戏\n\n```\nlet food = null;\nfunction respawn_food(){\n \
    \ let new_pos = rand(vec2(1,1), vec2(13,13));\n  new_pos.x = Math.floor(new_pos.x);\n\
    \  new_pos.y = Math.floor(new_pos.y);\n  new_pos = new_pos.scale(block_size);\n\
    }\n\nif (food) {\n  destroy(food);\n  food = add({\n    rect(block_size,block_size),\n\
    \    color(0,255,0),\n    pos(new_pos),\n    area(),\n    \"food\"\n  });\n}\n\
    ```\n\n首先，我们设置了一个变量 `food`，以便跟踪我们创建的食物对象。如果你想把它们都尽量放在声明其他变量（如 `block_size` 和 `snake_body`）的地方，可以将这个变量移动到那里。\n\
    \n然后，`respawn_food` 函数执行了几个操作。在贪蛇游戏中，一旦食物被吃掉，另一个食物就会出现在网格的随机位置。我们需要一个随机生成器来确定放置食物的位置。Kaboom.js\
    \ 有一个名为 `rand` 的函数，我们可以用它在屏幕上找到一个随机位置来放置食物。方便的是，`rand` 函数可以返回两个二维向量作为随机范围的起始和结束值，用于生成范围内的数字，然后返回另一个二维向量作为结果。\n\
    \n我们为什么为食物的随机位置选择 1-13 的范围？如果你看我们之前添加的地图，它宽 14 格，高 14 格。我们屏幕的尺寸是以网格块为单位的。我们不希望画到边界之外，因此在地图内使用\
    \ 1-13 块。现在，`rand` 函数返回的是带有小数的实数，而不是整数。这意味着我们需要添加 `Math.floor` 来截断随机数的小数部分，因为我们不希望将食物放在某个网格块的中间。我们还需要将网格坐标转换为普通的屏幕像素。这是通过将每个坐标乘以\
    \ `block_size` 实现的，`block_size` 指定了每个网格块的像素大小。我们利用了 vec2 类上的 `scale` 方法来执行乘法。\n\
    \n函数的下部分检查 `food` 变量是否已经包含一个现有对象。如果是，我们调用 `destroy` 从游戏中移除食物。最后，该函数通过调用 Kaboom.js\
    \ 的 `add` 函数，在我们创建的随机位置创建一个新的食物对象。\n\n为了调用这个新的 `respawn_food` 函数，我们需要像这样更新我们的\
    \ `respawn_all` 函数：\n\n```javascript\nfunction respawn_all(){\n  run_action =\
    \ false;\n  wait(0.5, function(){\n    respawn_snake();\n    respawn_food();\n\
    \    run_action = true;\n  });\n}\n```\n\n现在运行游戏，可以看到地图上某个随机位置出现了一个绿色的食物块：\n\n\
    ## 检测碰撞\n\n现在我们已经拥有了游戏所需的所有对象——边界墙、蛇和食物——我们可以开始检测这些对象之间的交互或碰撞了。\n\nKaboom.js 有一个非常有用的函数帮助我们：`onCollide`。该函数接受两个代表不同游戏对象类型的标签（tags），如果对象之间发生碰撞，它会调用提供的回调函数。\n\
    \n让我们从检测蛇是否移动到食物块开始。添加以下代码：\n\n```javascript\nonCollide(\"snake\", \"food\", (s,\
    \ f) => {\n    snake_length++;\n    respawn_food();\n});\n```\n\n## 在 Kaboom.js\
    \ 中构建蛇游戏\n\n我们为蛇和食物对象设置了标签的 `onCollide` 函数。然后，在回调函数中，`snake_length` 加 1，并调用 `respawn_food`\
    \ 在地图的某处替换被吃掉的食物。\n\n运行这段代码并吃掉食物，你应该看到蛇每次都会长大，并且食物会在另一个块上重新出现：\n\n吃食物\n\n现在，我们可以添加类似的代码来检测蛇是否撞到了墙：\n\
    \n```javascript\nonCollide(\"snake\", \"wall\", (s, w) => {\n    run_action =\
    \ false;\n    shake(12);\n    respawn_all();\n});\n```\n\n## 在 Kaboom.js 中构建蛇游戏\n\
    \n在回调函数中，我们立即将 `run_action` 标记置为 `false`。这样移动循环中的代码就不会运行，从而产生蛇卡在墙上的视觉效果。然后代码调用了一个酷的\
    \ Kaboom.js 效果函数 `shake()`，它会“摇晃”屏幕，感觉就像蛇剧烈碰撞一样，非常有效地传达了游戏结束的信息。最后，我们调用 `respawn_all`\
    \ 来重置所有游戏对象。\n\n我们可以使用相同的代码来检测蛇是否撞到了自己——只需将 `wall` 标签替换为另一个 `snake` 标签：\n\n```javascript\n\
    onCollide(\"snake\", \"snake\", (s, t) => {\n  run_action = false;\n  shake(12);\n\
    \  respawn_all();\n});\n```\n\n现在运行游戏，撞墙应该是这样的：\n\n## 在 Kaboom.js 中构建蛇游戏\n\n恭喜！你完成了\
    \ Kaboom.js 版贪蛇游戏！\n\n## 改进图形\n\n我们有一个可以运行的游戏，但看起来有点单调。Kaboom.js 对精灵（sprites）有很好的支持，精灵是用来表示角色的小图片。\n\
    \n现在，我们可以更新食物使其更有趣。为了做到这一点，我们可以使用精灵而不是简单的方块。\n\n## 添加蛇的食物\n\n```javascript\nfunction\
    \ respawn_food() {\n  let new_pos = rand(vec2(1,1), vec2(13,13));\n  new_pos.x\
    \ = Math.floor(new_pos.x);\n  new_pos.y = Math.floor(new_pos.y);\n  new_pos =\
    \ new_pos.scale(block_size);\n\n  if (food) {\n    destroy(food);\n  }\n  food\
    \ = add({\n    sprite(\"food\"),\n    pos(new_pos),\n    area(),\n    \"food\"\
    \n  });\n}\n```"
