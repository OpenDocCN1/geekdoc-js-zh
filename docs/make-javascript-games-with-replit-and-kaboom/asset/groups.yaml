- md: "\n# Building a Mario-like side-scroller with Kaboom.js\n\nKaboom has a really\
    \ cool way of defining levels. It allows us to draw a layout of the level using\
    \ only text. Each letter or symbol in this text map can be mapped to a character\
    \ in the Kaboom game. In Kaboom, characters are anything that makes up the game\
    \ world, including floor, platforms, and so on, and not only the players and bots.\n\
    \nAdd the following to define the levels:\n\n```javascript\nconst LEVELS = [\n\
    \  \"\"                                      /\n  \"\"                       \
    \               /\n  \"\"                                      /\n  \"\"     \
    \                                 /\n  \"\"                                  \
    \    /\n  \"\"                                      /\n  \"\"                \
    \                      /\n  \"\"                                      /\n  \"\"\
    \       -?-b-                        ?       ? /\n  \"\"                     \
    \                 /\n  \"\"                                      /\n  \"\"   \
    \                                   ?       /\n  \"\"                        \
    \              |/\n  \"\"                                      |       |/\n  \"\
    \"       |       |       -       /\n  \"\"       H       |       |       E E \
    \      | /\n  \"\"====================================================================//\n\
    \  \"\"====================================================================/\n\
    \  \"\"====================================================\",\n];\n```\n\nNow\
    \ we can map each symbol and letter in the levels to a character definition:^{295}https://kaboomjs.com/#addLevel\n\
    \n```javascript\nconst levelConf = {\n  // grid size\n  width: 16,\n  height:\
    \ 16,\n  pos: vec2(0, 0),\n  // define each object as a list of components\n \
    \ \"-\": () => {\n    sprite('ground'),\n    area(),\n    solid(),\n    origin('bot'),\n\
    \    'ground'\n  },\n  \"_-\": () => {\n    sprite('brick'),\n    area(),\n  \
    \  solid(),\n    origin('bot'),\n    'brick'\n  },\n  \"H\": () => {\n    sprite('castle'),\n\
    \    area({ width: 1, height: 240 }),\n    origin('bot'),\n    'castle'\n  },\n\
    \  \"?\": () => {\n    sprite('questionBox'),\n    area(),\n    solid(),\n   \
    \ origin('bot'),\n    'questionBox',\n    'coinBox'\n  },\n  \"b\": () => {\n\
    \    sprite('questionBox'),\n    area(),\n    solid(),\n    origin('bot'),\n \
    \   'questionBox',\n    'mushyBox'\n  },\n  \"!\": () => [\n    sprite(\"emptyBox\"\
    ),\n    area(),\n    solid(),\n    // bump(),\n    origin(\"bot\"),\n    \"emptyBox\"\
    ,\n  ],\n  \"c\": () => [\n    sprite(\"coin\"),\n    area(),\n    solid(),\n\
    \    //bump(G4, 8),\n    cleanup(),\n    lifespan(0.4, { fade: 0.01 }),\n    origin(\"\
    bot\"),\n    \"coin\"\n  ],\n  \"M\": () => [\n    sprite(\"bigMushy\"),\n   \
    \ area(),\n    solid(),\n    //patrol(10000),\n    body(),\n    cleanup(),\n \
    \   origin(\"bot\"),\n    \"bigMushy\"\n  ],\n  \"||\": () => [\n    sprite(\"\
    pipeBottom\"),\n    area(),\n    solid(),\n    origin(\"bot\"),\n    \"pipe\"\n\
    \  ],\n  \"\\_\": () => [\n    sprite(\"pipeTop\"),\n    area(),\n    solid(),\n\
    \    origin(\"bot\"),\n    \"pipe\"\n  ],\n  \"E\": () => [\n    sprite(\"enemies\"\
    , { anim: 'Walking' }),\n    area({ width: 16, height: 16 }),\n    solid(),\n\
    \    body(),\n    //patrol(50),\n    //enemy(),\n    origin(\"badGuy\"),\n  ],\n\
    \  \"p\" = () => [\n    sprite(\"mario\", { frame: 0 }),\n    area({ width: 16,\
    \ height: 16 }),\n    body(),\n    mario(),\n    //bump(150, 20, false),\n   \
    \ origin(\"bot\"),\n    \"player\"\n  ],\n};\n```\n\nThat looks like a lot, but\
    \ it's really one pattern repeated for each element. Let's take it apart.\n\n\
    The first lines of Kaboom set the width and height. We use pos(0,0) to specify\
    \ the position. Next we have the scene function, which returns an array of components.\
    \ Kaboom allows you to group levels together. We'll have two scenes:\n\n- A \"\
    start\" scene, which waits for a player to press a button to start the game.\n\
    - A main \"game\" scene, which will contain the levels and all the logic.\n\n\
    We can use the go function to switch scenes. Let's add the \"start\" scene, and\
    \ make the game to start by:\n\n```javascript\nscene(\"start\", () => {\n  add({\n\
    \    text(\"Press enter to start\", { size: 24 }),\n    pos(vec(160, 120)),\n\
    \    origin(\"center\"),\n    color(255, 255, 255),\n  });\n\n  onKeyRelease(\"\
    enter\", () => {\n    go(\"game\");\n  });\n});\ngo(\"start\");\n```\n\nWe define\
    \ the scene function. This function takes a string as the scene name—we're calling\
    \ the scene \"start\". We're using an inline function here, using arrow function\
    \ notation. You could also use the function keyword, you'd like to specify a function\
    \ in that way.\n\nWe also add some instruction text in the start scene, using\
    \ the text component and setting the text's content and size. The pos component\
    \ sets the position of the text on the screen, and the origin component sets the\
    \ color of the text to white using the color component, which uses RGB (red, green,\
    \ blue) values from 0-255.\n\nWe also have a call to the function onKeyRelease,\
    \ which listens for the key being pressed. If the key is pressed, we go to the\
    \ main game scene (we'll add shortly!)\n\nFinally, we use the go function to go\
    \ to the start scene when the game starts up.\n\n> ^301 https://kaboomjs.com/#go\n\
    302 https://kaboomjs.com/#scene\n303 https://developer.mozilla.org/en-US/Web/JavaScript/Reference/Functions/Arrow\n\
    304 https://kaboomjs.com/#text\n305 https://kaboomjs.com/#pos\n306 https://kaboomjs.com/#origin\n\
    307 https://kaboomjs.com/#color\n308 https://kaboomjs.com/#onKeyRelease\n309 https://kaboomjs.com/#go\n"
  mdcn: "\n\n# 使用 Kaboom.js 构建一个类 Mario 的横滚游戏\n\nKaboom 有一种非常酷的关卡定义方式。它允许我们仅使用文本来绘制关卡布局。文本地图中的每个字母或符号都可以映射为\
    \ Kaboom 中的字符。在 Kaboom 中，字符是指构成游戏世界的任何物体，包括地板、平台等，而不仅仅是玩家和机器人。\n\n添加以下内容来定义关卡：\n\
    \n```javascript\nconst LEVELS = [\n  \"\"                                    \
    \  /\n  \"\"                                      /\n  \"\"                  \
    \                    /\n  \"\"                                      /\n  \"\"\
    \                                      /\n  \"\"                             \
    \         /\n  \"\"                                      /\n  \"\"           \
    \                           /\n  \"\"       -?-b-                        ?   \
    \    ? /\n  \"\"                                      /\n  \"\"              \
    \                        /\n  \"\"                                      ?    \
    \   /\n  \"\"                                      |/\n  \"\"                \
    \                      |       |/\n  \"\"       |       |       -       /\n  \"\
    \"       H       |       |       E E       | /\n  \"\"====================================================================//\n\
    \  \"\"====================================================================/\n\
    \  \"\"====================================================\",\n];\n```\n\n现在我们可以将关卡中的每个符号和字母映射到字符定义上：^{295}https://kaboomjs.com/#addLevel\n\
    \n```javascript\nconst levelConf = {\n  // 网格大小\n  width: 16,\n  height: 16,\n\
    \  pos: vec2(0, 0),\n  // 将每个对象定义为组件列表\n  \"-\": () => {\n    sprite('ground'),\n\
    \    area(),\n    solid(),\n    origin('bot'),\n    'ground'\n  },\n  \"_-\":\
    \ () => {\n    sprite('brick'),\n    area(),\n    solid(),\n    origin('bot'),\n\
    \    'brick'\n  },\n  \"H\": () => {\n    sprite('castle'),\n    area({ width:\
    \ 1, height: 240 }),\n    origin('bot'),\n    'castle'\n  },\n  \"?\": () => {\n\
    \    sprite('questionBox'),\n    area(),\n    solid(),\n    origin('bot'),\n \
    \   'questionBox',\n    'coinBox'\n  },\n  \"b\": () => {\n    sprite('questionBox'),\n\
    \    area(),\n    solid(),\n    origin('bot'),\n    'questionBox',\n    'mushyBox'\n\
    \  },\n  \"!\": () => [\n    sprite(\"emptyBox\"),\n    area(),\n    solid(),\n\
    \    // bump(),\n    origin(\"bot\"),\n    \"emptyBox\",\n  ],\n  \"c\": () =>\
    \ [\n    sprite(\"coin\"),\n    area(),\n    solid(),\n    //bump(G4, 8),\n  \
    \  cleanup(),\n    lifespan(0.4, { fade: 0.01 }),\n    origin(\"bot\"),\n    \"\
    coin\"\n  ],\n  \"M\": () => [\n    sprite(\"bigMushy\"),\n    area(),\n    solid(),\n\
    \    //patrol(10000),\n    body(),\n    cleanup(),\n    origin(\"bot\"),\n   \
    \ \"bigMushy\"\n  ],\n  \"||\": () => [\n    sprite(\"pipeBottom\"),\n    area(),\n\
    \    solid(),\n    origin(\"bot\"),\n    \"pipe\"\n  ],\n  \"\\_\": () => [\n\
    \    sprite(\"pipeTop\"),\n    area(),\n    solid(),\n    origin(\"bot\"),\n \
    \   \"pipe\"\n  ],\n  \"E\": () => [\n    sprite(\"enemies\", { anim: 'Walking'\
    \ }),\n    area({ width: 16, height: 16 }),\n    solid(),\n    body(),\n    //patrol(50),\n\
    \    //enemy(),\n    origin(\"badGuy\"),\n  ],\n  \"p\" = () => [\n    sprite(\"\
    mario\", { frame: 0 }),\n    area({ width: 16, height: 16 }),\n    body(),\n \
