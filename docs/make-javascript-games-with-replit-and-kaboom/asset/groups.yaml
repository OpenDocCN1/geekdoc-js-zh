- md: "\n## Building Asteroids in Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_56_0.png)\n\
    \n## Final Touches\n\nOur game is fully playable now, but it's still missing some\
    \ niceties, and one core gameplay feature that you should be able to identify\
    \ if you've played Asteroids before. In this final section, we'll add the following:\n\
    \n- Some background music.\n- Smaller, faster asteroids that our large asteroids\
    \ break into when destroyed.\n- Temporary invulnerability for the player for a\
    \ few seconds after they take damage.\n\n## Background music\n\nAdd the following\
    \ code somewhere in your main scene.\n\n```javascript\n// Background music\nconst\
    \ music = play(\"Steamtech-Mayhem_Looping\");\nmusic.loop();\n```\n\n## Building\
    \ Asteroids in Kaboom.js\n\nThe first line plays the piece Steamtech Mayhem from\
    \ Soundimage.org and the second line ensures that it repeats as long as the game\
    \ is running.\n\n## Smaller asteroids\n\nTo create smaller asteroids when a large\
    \ asteroid is destroyed, we'll use a destroy event callback, which will run every\
    \ time an asteroid is destroyed. Add the following code to the bottom of your\
    \ main scene:\n\n```javascript\n// Asteroid destruction\n(\"destroy\", \"asteroid\"\
    , (a) => {\n  if (a.is(\"small\")) {\n    // create smaller asteroids at each\
    \ corner of the large one\n    positions = [a.pos.add(vec2(a.width/4, -a.height/4)),\n\
    \                 a.pos.add(vec2(-a.width/4, -a.height/4)),\n                \
    \ a.pos.add(vec2(-a.width/4, a.height/4)),\n                 a.pos.add(vec2(a.width/4,\
    \ a.height/4))];\n\n    // small asteroids move out from the center of the explosion\n\
    \    rotations = [16, 34, 65, 87];\n\n    for (let i = 0; i < positions.length;\
    \ i++) {\n      var s = add([\n        sprite(`asteroid_small${i+1}`),\n     \
    \   pos(positions[i]),\n        rotate(rotations[i]),\n        origin(\"center\"\
    ),\n        area(),\n        solid(),\n        \"asteroid\",\n        \"small\"\
    ,\n        \"mobile\",\n        \"wraps\",\n        speed:rand(15, 25),\n    \
    \    initializing: false\n      ]);\n      s.pushOutAll();\n    }\n})\n```\n\n\
    Our small asteroids are mostly similar to our large ones. Differences include\
    \ the addition of the small tag, the less random approach to initial placement,\
    \ the higher speed, and the selection of one of four different possible small\
    \ asteroid sprites.\n\nTo make our game true to the original *Asteroids*, we should\
    \ give the player more points for destroying these fast, small asteroids. Find\
    \ and modify the bullet–asteroid collision code as below:\n\n```javascript\nonCollide(\"\
    bullet\", \"asteroid\", (b, a) => {\n  if (a.initializing) {\n    destroy(b);\n\
    \    destroy(a);\n    play(\"explosion\");\n    score = a.is(\"small\") ? score\
    \ + 2 : score++; // 2 points for small, 1 for big\n  }\n});\n```\n\n![](img/e909780a5f974ff614ba5223d44aa19b_58_0.png)\n\
    \n## Temporary Invulnerability\n\nA nice touch to make our game a little more\
    \ forgiving is temporary invulnerability for the player after they lose a life.\
    \ We can add this finding by altering the player’s damage event callback as follows:\n\
    \n```javascript\n // Take damage\nplayer.on(\"damage\", () => {\n  if (player.invulnerable)\
    \ { // new if statement\n    player.lives--;\n  }\n\n  // destroy ship if lives\
    \ finished\n  if (player.lives <= 0) {\n    destroy(player);\n  }\n  else {\n\
    \    // Temporary invulnerability\n    player.invulnerable = true;\n\n    wait(player.invulnerability_time,\
    \ () => {\n      player.invulnerable = false;\n      player.hidden = false;\n\
    \    });\n  }\n});\n```\n\nWe’re making the player invulnerable and then using\
    \ a wait callback to make them vulnerable again after a few seconds, similar to\
    \ what we did for the laser timeout. We’re also making sure the player is visible\
    \ by setting player.hidden to false, because the way we’re going to indicate the\
    \ player’s invulnerability is...\n\n*(Note: The remaining text from pages 60-63\
    \ contained significant repetitive errors and artifacts which have been omitted\
    \ or truncated due to low coherence in the source code.)*\n"
  mdcn: "\n\n## 在 Kaboom.js 中构建小行星大战游戏\n\n![](img/e909780a5f974ff614ba5223d44aa19b_56_0.png)\n\
    \n## 最后的完善\n\n我们的游戏现在已经完全可行了，但仍然缺少一些细节，以及一个核心玩法功能——如果你玩过《小行星大战》，你应该能识别出这个功能。在最后一个章节中，我们将添加以下内容：\n\
    \n- 一些背景音乐。\n- 大行星被摧毁后分裂出的更小、更快速的小行星。\n- 玩家在受到伤害后几秒钟的临时无敌状态。\n\n## 背景音乐\n\n在你的主场景的某处添加以下代码。\n\
    \n```javascript\n// Background music\nconst music = play(\"Steamtech-Mayhem_Looping\"\
    );\nmusic.loop();\n```\n\n## 在 Kaboom.js 中构建小行星大战游戏\n\n第一行播放来自 Soundimage.org\
    \ 的 Steamtech Mayhem 曲目，第二行确保它在游戏运行期间不断重复播放。\n\n## 小行星\n\n为了在大在大行星被摧毁时创建更小的行星，我们将使用\
    \ `destroy` 事件回调，它会在每次小行星被摧毁时运行。在你的主场景的底部添加以下代码：\n\n```javascript\n// Asteroid\
    \ destruction\n(\"destroy\", \"asteroid\", (a) => {\n  if (a.is(\"small\")) {\n\
    \    // 在大行星的四个角创建更小的行星\n    positions = [a.pos.add(vec2(a.width/4, -a.height/4)),\n\
    \                 a.pos.add(vec2(-a.width/4, -a.height/4)),\n                \
    \ a.pos.add(vec2(-a.width/4, a.height/4)),\n                 a.pos.add(vec2(a.width/4,\
    \ a.height/4))];\n\n    // 小行星从爆炸中心向外移动\n    rotations = [16, 34, 65, 87];\n\n\
    \    for (let i = 0; i < positions.length; i++) {\n      var s = add([\n     \
    \   sprite(`asteroid_small${i+1}`),\n        pos(positions[i]),\n        rotate(rotations[i]),\n\
    \        origin(\"center\"),\n        area(),\n        solid(),\n        \"asteroid\"\
    ,\n        \"small\",\n        \"mobile\",\n        \"wraps\",\n        speed:rand(15,\
    \ 25),\n        initializing: false\n      ]);\n      s.pushOutAll();\n    }\n\
    })\n```\n\n我们的小行星与大行星相似。区别在于增加了 `small` 标签、初始位置的随机性较低、速度更快，以及选择了四种不同的小行星素材之一。\n\
    \n为了让我们的游戏忠于原版 *Asteroids*，我们应该让玩家在摧毁这些快速的小行星时获得更多分数。找到并按如下修改子弹与小行星的碰撞代码：\n\n\
    ```javascript\nonCollide(\"bullet\", \"asteroid\", (b, a) => {\n  if (a.initializing)\
    \ {\n    destroy(b);\n    destroy(a);\n    play(\"explosion\");\n    score = a.is(\"\
    small\") ? score + 2 : score++; // 小行星2分，大行星1分\n  }\n});\n```\n\n![](img/e909780a5f974ff614ba5223d44aa19b_58_0.png)\n\
    \n## 临时无敌\n\n让游戏更有容错性的不错设计是让玩家在失去生命后获得临时无敌状态。我们可以通过如下修改玩家的伤害事件回调来实现这一功能：\n\n```javascript\n\
    \ // 受到伤害\nplayer.on(\"damage\", () => {\n  if (player.invulnerable) { // 新的 if\
    \ 语句\n    player.lives--;\n  }\n\n  // 生命耗尽则摧毁飞船\n  if (player.lives <= 0) {\n\
    \    destroy(player);\n  }\n  else {\n    // 临时无敌\n    player.invulnerable = true;\n\
    \n    wait(player.invulnerability_time, () => {\n      player.invulnerable = false;\n\
    \      player.hidden = false;\n    });\n  }\n});\n```\n\n我们让玩家进入无敌状态，并使用回调在几秒钟后恢复无敌状态，这与我们之前处理激光超时的方法类似。我们还通过设置\
    \ `player.hidden` 为 `false` 来确保玩家可见的，因为我们指示玩家无敌的方式是...\n\n"
