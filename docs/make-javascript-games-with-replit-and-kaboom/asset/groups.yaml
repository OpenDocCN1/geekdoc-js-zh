  - "[PAGE 85]\n\n# Build a Space Shooter Kaboom.js\n\nWhen the game ends, we destroy\
    \ the spaceship to remove it from the scene. Now we have another opportunity to\
    \ create more explosions using the makeExplosion function we built earlier. This\
    \ time we can go big! To make a big impact, we create a for loop to set off 500\
    \ explosions over the scene for seriously dramatic effect. We use the Kaboom wait155\
    \ to have a small delay between each explosion so they don't all go off at once.\
    \ Then we make each explosion happen at random positions on the map, passing in\
    \ other parameters to the makeExplosion function to set the radius, sub-explosions\
    \ and general size. We also play the explosion sound using Kaboom's play156 function.\
    \ This we don't adjust the volume down, as we want the sound to be as dramatic\
    \ as possible. We detour randomly to create a true caption and sense of mayhem.\n\
    \nAfter setting off all those sound and visual effects, we wait157 for 2 seconds\
    \ to settle down, and then use the Kaboom function go158 to switch to a new scene,\
    \ endGame, and wait for the player to play again. Add the code below to create\
    \ the endGame scene, at the bottom of the map. below the line go(\"main\",)\n\n\
    ```\nscene(\"endGame\", {\nconst MAP_WIDTH = 440;\nconst MAP_HEIGHT = 275;\n\n\
    add([\n  text(\"GAME OVER \\ {;size: 40, font: \"sink\"}),\npos(MAP_WIDTH / 2,\
    \ MAP_HEIGHT / 3),\nlayer(\"ui\")\n]);\n\nononKeyRelease(\"enter\", () => {\n\
    go(\"main\");\n});\n});\n```\n\nThis scene adds159 a large \"GAME OVER\" over\
    \ the screen until the player presses and releases the enter key. Then the onKeyUp160\
    \ event returns the player to the main scene, and uses go161 to switch scenes\
    \ and restart the game. Because this is a new scene, in a new scope, we need to\
    \ add the MAP_WIDTH and MAP_HEIGHT constants again.\n\n+   155}https://kaboomjs.com/doc/#wait\n\
    156}https://kaboomjs.com/doc/#play\n157}https://kaboomjs.com/doc/#wait\n158}https://kaboomjs.com/doc/#go\n\
    159}https://kaboomjs.com/doc/#add\n160}https://kaboomjs.com/doc/#onKeyRelease\n\
    161}https://kaboomjs.com/doc/#go"
  - "[PAGE 86]\n\n# Allowing the Alien Bugs to Attack\n\nNow that we have mechanisms\
    \ for updating points and shield health, we can add the code dealing with alien\
    \ bugs hitting the spaceship to the main scene:\n\n```\nconst ALIEN_SHIELD_DAMAGE\
    \ = -15;\ncollide(\"alien\", \"player\", (alien, player) => {\n  shake(20);\n\
    \  makeExplosion(alien.pos, 8, 8, 8);\n  destroy(alien);\n  play(\"explosion\"\
    );\n\n  detune(-1200,\n  volume: 0.5\n});\nupdatePlayerShield(ALIEN_SHIELD_DAMAGE);\n\
    ```\n\nThis is a big event - it's the way the ship gets damaged and it can be\
    \ fatal - so we want to add a bit more dramatic effect. Kaboom can create a cool\
    \ screen-shaking effect, as if the player has been hit, which we can invoke by\
    \ calling shake¹¹⁶² with a number representing how dramatic the shake should be.\
    \ Then we add some visual effect with the makeExplosion function. We also destroy\
    \ the alien and play¹¹⁶³ explosion effect again, this time a bit louder as the\
    \ alien exploding directly affected the player. We also detune the effect to the\
    \ lowest pitch we can, to make it \"feel\" more direct, particularly if the player\
    \ has a sub-woofer.\n\nThen we call the updatePlayerShield function defined previously,\
    \ with a constant that defines how much a shield is damaged per hit. You can move\
    \ the constant to the top of the main scene file to keep it if you want.\n\n#\
    \ Raining Gems\n\nIt's time to add the element that gives the game its purpose:\
    \ gems the player can collect to earn points. Add this function to the main scene\
    \ to create a gem:"
  - "[PAGE 87]\n\n# Build a Space Shooter with Kaboom.js\n\n```\nfunction spawnGem()\
    \ {\n  let xpos = rand(BLOCK_SIZE, MAP_WIDTH - BLOCK_SIZE);\n  add({\n    sprite(\"\
    gem\"),\n    pos(xpos, BLOCK_SIZE),\n    area(),\n    body(),\n    \"gem\"\n \
    \ });\n}\n\nonUpdate(\"gem\", (gem) => {\n  if (gem.pos.y > MAP_HEIGHT) {\n  \
    \  destroy(gem);\n    spawnGem();\n  }\n});\n\nspawnGem();\n```\n\nOn this planet\
    \ in outer space, the gems rain from the sky, which is the top of our map for\
    \ our purposes. We calculate a random position, xpos, along the x axis for the\
    \ gem to appear on by calling the Kaboom rand(). We don't want gems to fall right\
    \ at the edge of the screen, as they will be cut off and the spaceship won't be\
    \ able to get them because of the boundary elements added around the screen. We\
    \ limit the random xpos to one BLOCK_SIZE from each edge.\n\nNow we add the gem\
    \ sprite to the scene. The pos component is set to the xpos we calculated, with\
    \ the y component set to the top of the screen. This is to avoid the gem getting\
    \ stuck on our boundary. We also give the gem the body component, which makes\
    \ it subject to Kaboom gravity so that it falls towards the ground. We give it\
    \ the gem label so that we can refer to it.\n\nThen we add the onUpdate event\
    \ handler for the gem - we need to do this for all objects with a body component\
    \ that interacts with solid objects taken care of. Sometimes, if the frame rate\
    \ gets too low (if there's a lot of action, or the computer's), some body and\
    \ solid might be missed, and the object falls through the solid. This could cause\
    \ the gem to fall through the ground, out of reach of the player's spaceship.\
    \ To account for this possibility, we check the gem's position against the map,\
    \ and spawn a new gem if it is.\n\n> https://kaboom.com/doc/#rand\nhttps://kaboom.com/doc/#add\n\
    https://kaboom.com/doc/#body\nhttps://kaboom.com/doc/#update\nhttps://kaboom.com/doc/#solid\n\
    https://github.com/replit/kaboom/issues/86"
- md: "\nBuild a Space Shooter with Kaboom.js\n\nFinally, we call `spawnGem()` to\
    \ start the gem raining process.\n\n## Collecting Gems\n\nNow that gems are raining,\
    \ we can add a handler to pick up when the player's spaceship moves over a gem.\
    \ This is how the spaceship \"collects\", and will earn the player points. The\
    \ following `onCollide` event handler:\n\n```\nconst POINTS_PER_GEM = 100;\nplayer.onCollide(\"\
    gem\", (gem) => {\n  destroy(gem);\n  updateScore(POINTS_PER_GEM);\n  wait(1,\
    \ spawnGem);\n});\n```\n\nThis fires whenever the spaceship and a gem collides.\
    \ We `destroy` the gem to remove it from the scene, and call the `updateScore`\
    \ function we added earlier to update the player's points by the amount declared\
    \ in the `POINTS_PER_GEM` constant. Then we `wait` one second before another gem\
    \ is spawned for the player to collect.\n\nRun the code now and start collecting\
    \ gems.\n\n> ${179}https://kaboomjs.com/doc/#onCollide\n>^{171}https://kaboomjs.com/doc/#destroy\n\
    >^{172}https://kaboomjs.com/doc/#wait\n\nBuild a Space Shooter with Kaboom.js\n\
    85\n\n![](img/e909780a5f974ff614ba5223d44aa19b_89_0.png)\n\nCollecting gems\n\n\
    Click to open gif\n\n## Adding Background Music\n\nHaving sound effects is cool,\
    \ but games generally need a soundtrack to tie all the sounds together. Kaboom\
    \ allows you to play a sound file on as constant background music. Add this code\
    \ to the bottom of main.js file to play the track:\n\n```\nconst music = play(\"\
    music\");\nmusic.loop();\n```\n\nThe music is a track called \"Battle of Pogs\"\
    \ by \"Komiku\" from \"Free music archive^{74}, a good resource for music that\
    \ you can legally use in your games.\n\n## Playing the Game\n\nCongratulations,\
    \ you've finished making this Kaboom game! Try running and playing the game to\
    \ see what score you can get. You can also experiment with adjusting the parameters\
    \ to see how they change the gameplay.\n\n^{73}https://docs.replit.com/images/tutorials/24-space-shooter-kaboom/collecting-gems.gif\n\
    ^{74}https://freesmusicarchive.org/music/Komiku/Captain_Glougous_Incredible_Week_Soundtrack/pog\n\
    \n## Credits\n\nThe game art and sounds used in this tutorial are from the following\
    \ sources:\n\n- Music: https://freemusicarchive.org/music/Komiku/Captain_Glougous_Incredible_Week_-Soundtrack/pop175\n\
    - Laser: https://freesound.org/people/sunnyflower/sounds/361471/176\n- Explosion:\
    \ https://freesound.org/people/tommccann/sounds/235968/177\n- Point Beep: https://freesound.org/people/LittleRobotFactory/sounds/270303/178\n\
    - Gem: https://opengameart.org/content/planetcube-bluehpng^179\n- Space Background:\
    \ https://opengameart.org/content/space-background-8180\n- Alien Bug: https://opengameart.org/content/8-bit-alien-assets^181\n\
    \nThe spaceship was made by Ritza^182.\n\nThank you to all the creators for putting\
    \ their assets with a Creative Commons license and allowing us to use them.\n\n\
    ## Things to Try Next\n\nHere are a few things you can try to add to the game\
    \ and polish it up:\n\n- Self healing on the shield. Perhaps add 1 or 2 shield\
    \ every 10 seconds, so that players can go further if they die the aliens.\n-\
    \ A better ending screen, with the player’s score.\n- An intro scene, explaining\
    \ the game and the controls.\n- Different types of alien bugs. Perhaps a large\
    \ \"boss\" bug that can also shoot back.\n\nYou can find the code sample for this\
    \ on github^183 or replit^184\n\n> ^175 https://freemusicarchive.org/music/Komiku/Captain_Glougous_Incredible_Week_Soundtrack/pop\n\
    ^176 https://freesound.org/people/sunnyflower/sounds/361471/\n^177 https://freesound.org/people/tommccann/sounds/235968/\n\
    ^178 https://freesound.org/people/LittleRobotFactory/sounds/270303/\n^179 https://opengameart.org/content/planetcube-bluepng\n\
    ^180 https://opengameart.org/content/space-background/\n^181 https://opengameart.org/content/8-bit-alien-assets\n\
    ^182 https://ritza.co\n^183 https://github.com/ritza-co/make-javascript-games/blob/main/space-shooter-with-kaboom.md\n\
    ^184 https://replit.com/@ritza/Space-Shooter-new\n\n## Building a pseudo-3D game\
    \ in Kaboom\n\nThree-dimensional games became popular in the late 80s and early\
    \ 90s with games like the early Flight Simulator and Wolfenstein 3D. But these\
    \ early games were really 2.5D, or pseudo-3D185; the action takes place in 2 dimensions,\
    \ and the world only appears to be 3D.\n\nKaboom.js186 is a 2D game engine, but\
    \ we can use some of those game designers’ techniques to create a pseudo-3D game.\
    \ This game is roughly based on our 2D space shooter game187 but we’ll use a view\
    \ from the cockpit instead of the side-scrolling view.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_91_0.png)\n\
    \nThe finished game\n\nClick to open gif188You can download this zip file189 with\
    \ all the sprites and sounds you’ll need for this.\n\n- 185 https://en.wikipedia.org/wiki/2D\n\
    - 186 https://kaboom.com\n- 187 https://docs.replit.com/tutorials/24-space-shooter-with-kaboom\n\
    - 188 https://docs.replit.com/tutorials/25-3d-game-kaboom/gameplay.gif\n- 189\
    \ https://docs.replit.com/tutorial-files/3d-game-kaboom/3d-game-resources.zip\n\
    \n## Game design\n\nHere’s what we want from this game:\n\n- A sense of depth\
    \ to give the illusion of 3D\n- The feeling of freedom of movement throughout\
    \ space\n\nWe'll make use of Kaboom's scale component190 to achieve the sense\
    \ of depth, representing sprites as smaller if they are not meant to be further\
    \ away, and larger when they are closer. We'll create a feeling of moving through\
    \ space using an algorithm to generate a star field, like the early Windows screensavers.\n\
    \n## Creating a new project\n\nHead over Replit191 and create a new repl. Choose\
    \ Kaboom as your project type. Give this repl name, “3D Space Shooter.\n\n![](img/e90780a5f974ff614ba5223d44aa19b_92_0.png)\n\
    \nAfter the repl has booted up, you should see a main.js file under the “Code”\
    \ section. This is where we’ll start coding.\n\n> ¹190https://kaboomjs.com/doc/#scale\n\
    >¹191https://replit.com\n\n## Setting up the Kaboom environment\n\nThe Kaboom\
    \ interface on Replit is specialised for game-making. Besides the Invader icon,\
    \ you'll notice a few special folders in the file tree, like \"Code\", \"Sprites\"\
    , and \"Sounds\". These special folders take care of loading assets, and all the\
    \ necessary code to start and direct the game. You can read more about the Kaboom\
    \ interface here192.\n\nIf you haven't already, download this zip file113 containing\
    \ all the sprites and sounds for the game. Extract the file from your computer,\
    \ add the sprites to the \"Sprites\" folder, and the sounds to the \"Sounds\"\
    \ folder.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_93_0.png)\n\nClick to open\
    \ gif114To set up the gameplay, we need to set up Kaboom with the screen size\
    \ and colors we want for the game window. Replace the code in main.js with the\
    \ code below:\n\n> ¹119 https://docs.replit.com/tutorials/kaboom\n> ¹113 https://docs.replit.com/tutorial-files/3d-game-kaboom/3d-game-resources.zip\n\
    > ¹114 https://docs.replit.com/images/tutorials/25-3d-game-kaboom/upload-sprites.gif\n\
    \n## Building a pseudo-3D game in Kaboom\n\n```\nimport kaboom from \"kaboom\"\
    ;\nkaboom({\n    background: [0, 0, 0],\n    width: 320,\n    height: 200,\n \
    \   scale: 2\n});\n```\n\nHere we import the library, and initialize the context\
    \ by calling kaboom({ ... }). We set the size of the view to 320x200 pixels and\
    \ scale to make the background twice the size on screen. Now, let's load the sprites\
    \ and sounds we will need in this game. The code below loads each of the graphic\
    \ elements, and give them a name, so we can refer to them when we build the game\
    \ characters:\n\n```\nloadRoot(\"sprites\")\nloadSprite(\"cockpit\", \"cockpit.png\"\
    )\nloadSprite(\"alien\", \"alien.png\")\n\nloadRoot(\"sounds\")\nloadSound(\"\
    shoot\", \"shoot.wav\")\nloadSound(\"explosion\", \"explosion.wav\")\n```\n\n\
    The first line, loadRoot^195, specifies which folder to load all the sprites and\
    \ game elements from, we don't have to keep typing it each sprite. Then we use\
    \ similar code to load the sounds we will need in this game, but instead of loadSprite^196\
    \ we use loadSound^197 to load sounds.\n\n## Creating the interface layers\n\n\
    Kaboom games are made of \"Scenes\", which are like levels, or different parts\
    \ and stages of a game. The IDE has a default \"main\" scene, which we can use\
    \ for our main game code. Each scene has multiple \"Layers\", allowing us to have\
    \ backgrounds that don't affect the game, main game objects (like the player,\
    \ bullets, enemies, and so on), and UI elements (like the current score and health).\n\
    \nAdd the following code to the main.js file to create the 3 layers \"Background\
    \ (bg)\", \"Object (obj)\", \"User Interface (ui)\":\n"
  mdcn: "\n使用 Kaboom.js 构建一个太空射击游戏\n\n最后，我们调用 `spawnGem()` 来开始宝石掉落的过程。\n\n## 收集宝石\n\
    \n现在宝石正在掉落，我们可以添加一个处理器，当玩家的太空飞船移动到宝石上方时将其捡起。这就是飞船“收集”宝石的方式，并将为玩家赢得积分。以下是 `onCollide`\
    \ 事件处理器：\n\n```\nconst POINTS_PER_GEM = 100;\nplayer.onCollide(\"gem\", (gem)\
    \ => {\n  destroy(gem);\n  updateScore(POINTS_PER_GEM);\n  wait(1, spawnGem);\n\
    });\n```\n\n每当飞船和宝石碰撞时，该处理器就会触发。我们使用 `destroy` 宝石将其从场景中，并调用之前添加的 `updateScore`\
    \ 函数，根据 `POINTS_PER_GEM` 常量定义的数值来更新玩家的分数。然后我们 `wait` 一秒钟，然后再生成另一个宝石供玩家收集。\n\n\
    现在运行代码并开始收集宝石。\n\n> ${179}https://kaboomjs.com/doc/#onCollide\n>^{171}https://kaboomjs.com/doc/#destroy\n\
