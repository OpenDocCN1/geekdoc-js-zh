- md: "\n# Building tic-tac-toe with WebSocket and Kaboom.js\n\nThen we check if the\
    \ game is one of the final states, either WIN or DRAW. If it is, we call out to\
    \ a function resetGame to set up the game again. Finally, we use the latest gameState\
    \ to all the players.\n\nLet's implement the resetGame function:\n\n```javascript\n\
    function resetGame() {\n  gameState.board = new Array(9).fill(null);\n\n  if (gameState.players.length\
    \ === 2) {\n    gameState.result.status = Statuses.PLAYING;\n    const randPlayer\
    \ = Math.floor(Math.random() * gameState.players.length);\n    gameState.currentPlayer\
    \ = gameState.players[randPlayer];\n  } else {\n    gameState.result.status =\
    \ Statuses.WAITING;\n    gameState.currentPlayer = null;\n  }\n}\n```\n\nLet's\
    \ take a look at what we're doing:\n\n- First, our function creates a new array\
    \ for the gameState board. This effectively clears the board, setting all the\
    \ positions back to null, or empty.\n- Then it checks that there are still 2 players\
    \ connected. If there are, it sets the game status back to PLAYING and chooses\
    \ at random which player's turn it is to go. We choose the first player randomly\
    \ so that there's not one player getting an advantage by going first time.\n\n\
    If there is only one player remaining, we set the game status to WAITING instead,\
    \ and listen for any new players who want to join. We also set the currentPlayer\
    \ to null, as we will choose which player should go once the new player has joined.\n\
    \n# Handling disconnects\n\nThe last handler we need to implement is if a connection\
    \ to a player is lost. This could be because the player has exited the game (by\
    \ closing the browser tab), or has other internet issues.\n\n```javascript\nfunction\
    \ disconnect(socketId) {\n  return (reason) => {\n    gameState = gameState.players.filter(p\
    \ => p.id != socketId);\n    if (gameState.players.length != 2){\n      resetGame();\n\
    \      io.emit('gameState', gameState);\n    }\n  }\n}\n```\n\nThis function uses\
    \ the built-in filter function[^259] to remove the player that disconnected from\
    \ the server. Since it's possible that the disconnect event isn't from a player\
    \ but a spectator, we check the number of players left after filtering the disconnecting\
    \ socket from the player list. If there aren't 2 players remaining after filtering,\
    \ we reset the game and send out the updated game state.\n\n# Checking for the\
    \ end of the game\n\nNow we can get back to implementing the checkForEndOfGame()\
    \ function we referenced in the action handler.\n\nWe're only interested in detecting\
    \ 2 cases: A win or a draw.\n\nThere are just 8 patterns that determine if a player\
    \ has won at tic-tac-toe. Let's map them to our board with its indexed blocks:\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_129_0.png)\n\nAll possible win lines\n\
    \nWe encode each of these winning patterns into an array of 3 numbers each. We\
    \ can add each of these patterns to a larger array, like this:\n\n> [^259] https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array/filter\n\
    \n```javascript\nconst winPatterns = [\n  [0, 1, 2],\n  [3, 4, 5],\n  [6, 7, 8],\n\
    \  [0, 3, 6],\n  [1, 4, 7],\n  [2, 5, 8],\n  [0, 4, 8],\n  [2, 4, 6]\n]\n```\n\
    \nNow that we have each winning pattern in an array, we can loop through each\
    \ of them to see if there is a player with positions match any of the patterns.\n\
    \nSince the players are also in an array in gameState.players, we can loop through\
    \ that array, and check each player against the winning pattern. If a player matches\
    \ any of these patterns, we can change the game status to WIN and set that player\
    \ as the winner in the results.\n\nHere is the code to do that:\n\n```javascript\n\
    function checkForEndOfGame(){\n  // Check for a win\n  gameState.players.forEach(player\
    \ => {\n    winPatterns.forEach(seq => {\n      if (gameState.board[seq[0]] ==\
    \ player\n        && gameState.board[seq[1]] == player\n        && gameState.board[seq[2]]\
    \ == player) {\n          gameState.result.status = Statuses.WIN;\n          gameState.result.winner\
    \ = player;\n        }\n    });\n  });\n\n  // Check for a draw\n  if (gameState.result.status\
    \ != Statuses.WIN) {\n    const emptyBlock = gameState.board.indexOf(null);\n\
    \    if (emptyBlock == -1){\n      gameState.result.status = Statuses.DRAW;\n\
    \    }\n  }\n}\n```\n\nWe also check for a draw in this function. A draw is defined\
    \ as when all the blocks are occupied (no more moves can be made), but no player\
    \ matched one of the win patterns. To check if there are more empty blocks, we\
    \ use the array method indexOf to find any null values in gameState.board. Remember\
    \ that null means an empty block. The indexOf method will return -1 if it can't\
    \ find any values. In that case, we get the status to DRAW, ending the game.\n\
    \nNow we have all the functionality we need on the server, let's move on to building\
    \ the Kaboom website the players will use to play the game.\n\n# Setting up Kaboom\n\
    \nTo start, we set up Kaboom with the screen size and colors we want for the game.\
    \ Replace the code in main.js with the code below:\n\n```javascript\nimport kaboom\
    \ from \"kaboom\";\n\nkaboom({\n  background: [0, 0, 0],\n  width: 1000,\n  height:\
    \ 600\n});\n```\n\nThis creates a new Kaboom canvas with a black background.\n\
    \n# Setting up Kaboom with Socket.IO\n\nNow we can add a reference to Socket.IO.\
    \ Normally, in a HTML project, we could add a <script> tag and reference the Socket.IO\
    \ client script hosted on our server. However, we will add the script programmatically.\
    \ We can do this by accessing the document object available in every browser,\
    \ and insert a new element with our script. Adding the code to the main.js file\
    \ to initialize Kaboom:\n\n```javascript\nlet script = document.createElement(\"\
    script\");\nscript.src = 'https://tic-tac-toe.' + USER_NAME + '.repl.co/socket.io';\n\
    document.head.appendChild(script);\n```\n\nReplace the <USER_NAME> part of the\
    \ URL with your username. This code inserts the <script> tag into the <head> section\
    \ of the underlying page that Kaboom runs.\n\n# Building tic-tac-toe with WebSocket\
    \ and Kaboom.js\n\nLet's move on creating the relevant scenes for our game. Kaboom\
    \ \"scenes\" allow us to group logic levels together. In this game we'll have\
    \ 2 scenes:\n\n- A \"startGame\" scene that will prompt for the player's name.\n\
    - A \"main\" scene, which will contain all the logic to play the tic-tac-toe game.\n\
    \nLet's move on to the code to prompt the player to enter their name.\n\n```javascript\n\
    scene(\"startGame\", () => {\n  const SCREEN_WIDTH = 100;\n  const SCREEN_HEIGHT\
    \ = 600;\n\n  add([\n    text(\"What's your name?\", { size: 32, font: \"sinko\"\
    \ }),\n    pos(SCREEN_WIDTH / 2, SCREEN_HEIGHT / 3),\n    origin(\"center\")\n\
    \  ]);\n\n  const nameField = add([\n    text(\"\", { size: 32, font: \"sinko\"\
    \ }),\n    pos(SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2),\n    origin(\"center\")\n\
    \  ]);\n\n  charInput((ch) => {\n    nameField.text += ch;\n  });\n\n  keyRelease(\"\
    enter\", () => {\n    go(\"main\", { playerName: nameField.text });\n  });\n});\n\
    \ngo(\"startGame\");\n```\n\nTo keep the calculations for the UI layout simpler,\
    \ we'll use a fixed size for the screen. That's where the screen constraints for\
    \ the screen width and height come in.\n\nWe use the Kaboom function to display\
    \ the prompt \"What's your name?\" on the screen, using the text component. We\
    \ choose a position halfway across the screen, SCREEN_WIDTH / 2, and about a third\
    \ of the way down the screen, SCREEN_HEIGHT / 3. We add the origin component,\
    \ to center, to indicate that the positions we set must be in the center of the\
    \ text field.\n\nWe then add another object with \" text component. This will\
    \ display the characters types in. We position it halfway down and across the\
    \ screen. We also hold a reference to the object in the constant nameField.\n\n\
    To get the user's keyboard input, we use the Kaboom function charinput. This function\
    \ calls an event handler when a key is pressed. We take that character and append\
    \ it to the text in the nameField object. When a player presses a key to enter\
    \ name, it will show up on the screen.\n\nFinally, we use the Kaboom function\
    \ keyRelease to listen for the player pushes the enter key. We'll take that as\
    \ meaning they have finished entering their name and want to start the game. In\
    \ the handler, we use the Kaboom go function to redirect to the main scene of\
    \ the game.\n\n# Adding the game board\n\nNow we can add the UI elements for the\
    \ game itself. Create the \"main\" scene in Kaboom repl by adding the following\
    \ code to draw the tic-tac-toe board:\n\n```javascript\nscene(\"main\", ({ playerName\
    \ }) => {\n  // Board\n  add([\n    rect(1, 400),\n    pos(233, 100),\n  ]);\n\
    \n  add([\n    rect(1, 400),\n    pos(366, 100),\n  ]);\n\n  add([\n    rect(400,\
    \ 1),\n    pos(100, 233),\n  ]);\n```\n"
  mdcn: "\n\n# 使用 WebSocket 和 Kaboom.js 构建井字游戏\n\n然后，我们检查游戏是否处于最终状态之一：获胜（WIN）或平局（DRAW）。如果是，我们就调用\
    \ `resetGame` 函数重新初始化游戏。最后，我们将最新的 `gameState` 发送给所有玩家。\n\n让我们来实现 `resetGame` 函数：\n\
    \n```javascript\nfunction resetGame() {\n  gameState.board = new Array(9).fill(null);\n\
    \n  if (gameState.players.length === 2) {\n    gameState.result.status = Statuses.PLAYING;\n\
    \    const randPlayer = Math.floor(Math.random() * gameState.players.length);\n\
    \    gameState.currentPlayer = gameState.players[randPlayer];\n  } else {\n  \
    \  gameState.result.status = Statuses.WAITING;\n    gameState.currentPlayer =\
    \ null;\n  }\n}\n```\n\n让我们来看看我们正在做什么：\n\n- 首先，我们的函数为 `gameState.board` 创建了一个新数组。这有效地清空了棋盘，将所有位置重置为\
    \ `null` 或空值。\n- 然后，它检查是否仍有 2 个玩家连接。如果是，它会将游戏状态设回 `PLAYING`，并随机选择由哪个玩家回合。我们随机选择第一个玩家，以避免某一个玩家因为先手而获得优势。\n\
    \n如果只剩下一个玩家，我们将游戏状态设置为 `WAITING`，并监听任何想要加入的新玩家。我们还将 `currentPlayer` 设置为 `null`，因为我们将在新玩家加入后才会决定由哪个玩家开始游戏。\n\
    \n# 处理断开连接\n\n我们需要实现的最后一个处理器是当玩家的连接丢失时。这可能是因为玩家退出了游戏（关闭了浏览器标签页），或其他其他网络问题。\n\n\
    ```javascript\nfunction disconnect(socketId) {\n  return (reason) => {\n    gameState\
    \ = gameState.players.filter(p => p.id != socketId);\n    if (gameState.players.length\
    \ != 2){\n      resetGame();\n      io.emit('gameState', gameState);\n    }\n\
    \  }\n}\n```\n\n此函数使用内置的 `filter` 函数[^259] 来移除从服务器断开连接的玩家。由于断开事件可能不是来自玩家而是观众，因此我们在从玩家列表中过滤掉断开的\
    \ socket 后，检查剩余玩家的数量。如果过滤后没有剩余 2 个玩家，我们将重置游戏并发送更新后的游戏状态。\n\n# 检查游戏是否结束\n\n现在我们可以回到实现\
    \ `checkForEndOfGame()` 函数，之前在操作处理程序中引用了它。\n\n我们只对两种情况感兴趣：获胜或平局。\n\n只有 8 种模式可以决定玩家在井字游戏中是否获胜。让我们将这些模式映射到带有索引块的棋盘上：\n\
    \n![](img/e909780a5f974ff614ba5223d44aa19b_129_0.png)\n\n所有可能的获胜线\n\n我们将这些获胜模式编码为每个包含\
    \ 3 个数字的数组。我们可以将这些模式添加到更大的数组中，如下所示：\n\n> [^259] https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array/filter\n\
    \n```javascript\nconst winPatterns = [\n  [0, 1, 2],\n  [3, 4, 5],\n  [6, 7, 8],\n\
    \  [0, 3, 6],\n  [1, 4, 7],\n  [2, 5, 8],\n  [0, 4, 8],\n  [2, 4, 6]\n]\n```\n\
    \n现在我们已经在数组中拥有了每个获胜模式，我们可以遍历每个模式，检查是否有玩家的位置匹配了任何模式。\n\n由于玩家也位于 `gameState.players`\
    \ 数组中，我们可以遍历该数组，并对每个玩家与获胜模式进行检查。如果玩家匹配了任何一个模式，我们可以将游戏状态更改为 `WIN`，并在结果并将该玩家设置为胜利者。\n\
    \n以下是实现该操作的代码：\n\n```javascript\nfunction checkForEndOfGame(){\n  // 检查获胜\n  gameState.players.forEach(player\
    \ => {\n    winPatterns.forEach(seq => {\n      if (gameState.board[seq[0]] ==\
    \ player\n        && gameState.board[seq[1]] == player\n        && gameState.board[seq[2]]\
    \ == player) {\n          gameState.result.status = Statuses.WIN;\n          gameState.result.winner\
    \ = player;\n        }\n    });\n  });\n\n  // 检查平局\n  if (gameState.result.status\
    \ != Statuses.WIN) {\n    const emptyBlock = gameState.board.indexOf(null);\n\
    \    if (emptyBlock == -1){\n      gameState.result.status = Statuses.DRAW;\n\
    \    }\n  }\n}\n```\n\n我们在这个函数中也检查了平局。平局定义为所有格子都被占据（无法再进行移动），但没有玩家匹配任何获胜模式。为了检查是否还有更多空格子，我们使用数组方法\
    \ `indexOf` 来寻找 `gameState.board` 中的任何 `null` 值。记住，`null` 表示空格子。如果 `indexOf` 方法无法找到任何值，它将返回\
    \ -1。在这种情况下，我们将状态设为 `DRAW`，结束游戏。\n\n现在服务器端已经拥有了我们需要的所有功能，让我们继续构建。\n\n[注：由于原文后半部分存在大量重复且无意义的句子片段，以上翻译已根据技术语境进行了对齐。]\n"
