    \ in our LEVELS array - starts at index 0, so is 1. This parameter will allow\
    \ us the scene again when we get to the end of the level, but with 1 as the parameter\
    \ so that we can play the next level. You can specify any parameters you like\
    \ or need when creating a scene, and you can pass values from one scene to another.\
    \ This is very useful, for example if you want to pass the player score to an\
    \ end game scene, or pass player options from the start scene.\n\nNext, we define\
    \ some `layers`^312. Layers allow us to have backgrounds that don't affect the\
    \ game - we call that bg. We'll place all the main game objects (like our hero,\
    \ his enemies, and any other objects he interacts with) on game layer, and all\
    \ the UI elements (like current score, health, etc.) on the ui layer. We make\
    \ the default layer, so if we don't specify a layer on a game object, it will\
    \ be drawn on the game layer.\n\nIn the next line of code, we initialize and create\
    \ the level by calling the `addLevel`^313 function. We pass in the value to the\
