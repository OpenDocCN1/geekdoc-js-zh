    \ Mario world\n\nClick to open gif^310\n\nOk, back to looking at the code we added\
    \ and what it does. First, we define a new `scene`^311 like we did for the start\
    \ scene. Time, we specify a parameter `levelNumber` that can be passed to the\
    \ scene. We give this parameter a default value of 0. This will be the first level\
    \ in our LEVELS array - starts at index 0, so is 1. This parameter will allow\
    \ us the scene again when we get to the end of the level, but with 1 as the parameter\
    \ so that we can play the next level. You can specify any parameters you like\
    \ or need when creating a scene, and you can pass values from one scene to another.\
    \ This is very useful, for example if you want to pass the player score to an\
    \ end game scene, or pass player options from the start scene.\n\nNext, we define\
    \ some `layers`^312. Layers allow us to have backgrounds that don't affect the\
    \ game - we call that bg. We'll place all the main game objects (like our hero,\
    \ his enemies, and any other objects he interacts with) on game layer, and all\
    \ the UI elements (like current score, health, etc.) on the ui layer. We make\
    \ the default layer, so if we don't specify a layer on a game object, it will\
    \ be drawn on the game layer.\n\nIn the next line of code, we initialize and create\
    \ the level by calling the `addLevel`^313 function. We pass in the value to the\
    \ LEVELS array, using the index from the `levelNumber` parameter we added to the\
    \ scene. We also pass in the configuration for all the symbols in the level map\
    \ that we assigned to the levelConf variable. At this point, the map and all the\
    \ characters in it are drawn to the scene. Note, because the map is wider than\
    \ the size we set in the settings for the Kaboom window, we only see part of the\
    \ map. It is great, because it will allow us to show more of the map as Mario\
    \ starts walking.\n\nThen we add a effect to the background layer - clouds, hills\
    \ and shrubries. Note the use of the layer component on these elements. We do\
    \ so that they don't interact with our game objects - they just add some visual\
    \ interest. You can add as many as you like - the original Mario has in a repeating\
    \ pattern across the whole level.\n\nWe also add some temporary text to the ui\
    \ layer to let the player know where they are on. Notice that we use the lifespan^314\
    \ component to automatically fade out and remove the info after 1 second.\n\n\
    Finally, we add Mario to the game! We could have added him by placing his symbol,\
