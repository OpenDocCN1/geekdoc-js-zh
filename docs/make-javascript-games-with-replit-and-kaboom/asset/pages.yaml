  md: '# Game design


    Here’s what we want from this game:


    +   - A sense of depth to give the illusion of 3D

    - The feeling of freedom of movement throughout space


    We''ll make use of Kaboom''s scale component¹¹⁹⁰ to achieve the sense of depth,
    representing sprites as smaller if they are not meant to be further away, and
    larger when they are closer. We''ll create a feeling of moving through space using
    an algorithm to generate a star field, like the early Windows screensavers.


    # Creating a new project


    Head over Replit¹¹⁹¹ and create a new repl. Choose Kaboom as your project type.
    Give this repl name, “3D Space Shooter.


    ![](img/e909780a5f974ff614ba5223d44aa19b_92_0.png)


    After the repl has booted up, you should see a main.js file under the “Code” section.
    This is where we’ll start coding.


    > ¹¹⁹⁰https://kaboomjs.com/doc/#scale

    ¹¹⁹¹https://replit.com'
  merge: -1
