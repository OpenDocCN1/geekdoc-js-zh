  md: '# Creating a new project in Replit


    Head over to Replit<sup>36</sup> and create a new repl. Choose Kaboom as your
    project type. Give this repl a name, like "Flappy"!


    ![](img/e909780a5f974ff614ba5223d44aa19b_182_0.png)


    Creating a new repl


    After the repl has booted up, you should see a main.js file under the "Code" section.
    This is where we will start coding. There is already some code in it for the game,
    but we will replace it.


    Download the sprites and asset files<sup>37</sup> we need for the game, and unzip
    them on your computer. In the Kaboom editor, click the "Files" icon in the sidebar.
    Now drag and drop all the sprites (image files) into the "sprites" folder, and
    all the sounds (MP3 files) into the "sounds" folder. Once they have uploaded,
    click on the "Kaboom" icon in the sidebar, and return to the "main" code file.


    > <sup>36</sup>https://replit.com


    > <sup>37</sup>https://docs.replit.com/tutorial-files/flappy-bird-kaboom/flappy-assets.zip'
