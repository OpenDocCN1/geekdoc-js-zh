    # Fixing the wall-clipping bugs


    If you play around with the game, you should notice a couple of wall clipping
    bugs. When holding an object, you can force it to teleport below the platform
    you''re standing on by aiming them. Similarly, objects will teleport through platforms
    if you pull them from the other side.


    ![](img/e909780a5f974ff614ba5223d44aa19b_211_1.png)


    In both cases, this is because Kaboom''s moveTo() function does not take solid
    objects into account, so we''ll have to do that ourselves.'
