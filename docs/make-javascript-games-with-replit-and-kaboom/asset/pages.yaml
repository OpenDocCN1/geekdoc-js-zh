  md: "# Building a Mario-like side-scroller with Kaboom.js 162\n\nlevelConf setup\
    \ we created earlier. Now create a collision handler in the game scene between\
    \ Mario and the enemy, so we know when it gets squashed:\n\n```\nlet canSquash\
    \ = false;\nplayer.onCollide(\"badGuy\", (baddy) => {\n  if (baddy.alive == false)\
    \ return;\n  if (canSquash) {\n    // Mario jumped on the bad guy:\n    baddy.squash();\n\
    \  }\n  } else {\n    // Mario has been hurt. Add logic here later...\n  }\n});\n\
    ```\n\nIn onCreate, we check if the player, Mario, collides with a badGuy - which\
    \ is the tag we gave to the enemy in the levelConf setup. We then attach a handler,\
    \ which takes the body character Mario collided with. We first check if the body\
    \ is still alive - if not we leave there is no real interaction between Mario\
    \ and a dead enemy. Then, we check the canSquash variable - if it is set to true,\
    \ means Mario jumped onto the enemy. We call the squash method, which we created\
    \ in the custom component for the enemy. This will execute all the logic we added,\
    \ and \"kill\" the enemy. We leave a bit of room in the handler to come back and\
    \ add logic to Mario the enemy without jumping on it - we'll add that in later.\n\
    \nModify the onKeyPress for the space key as follows:\n\n```\nonKeyPress(\"space\"\
    , () => {\n  if (player.grounded()) {\n    player.jump();\n    canSquash = true;\n\
    \  }\n});\n```\n\nHere, we set the canSquash variable to true to allow the player\
    \ to squash the enemy if the player has jumped over it upon collision.\n\nAdd\
    \ the following code to the player.onUpdate handler:\n\n```\nif (player.grounded())\
    \ {\n  canSquash = false;\n}\n```\n\nThis code will reset the canSquash variable\
    \ so that the player will not squash the enemy if it hasn't jumped over it in\
    \ the collision handler we added earlier."
