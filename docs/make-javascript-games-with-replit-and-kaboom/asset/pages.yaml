  md: "# Building tic-toe-toe with WebSocket and Kaboom.js\n\n```\n1 io.on('connection',\
    \ function (connection) {\n2 connection.on('addPlayer', (data)=>{\n3   // some\
    \ code here\n4 });\n5 \n6  connection.on('action', (data)=>{\n7   // some code\
    \ here\n8 });\n9 \n10 // etc ...\n11 });\n```\n\nThis is convenient, especially\
    \ when we have a couple of handlers, each with only a small amount of code. It's\
    \ also handy because in each of the handler functions, you still have access to\
    \ the connection object, which is not passed on each event. However, it can get\
    \ a little messy and unwieldy if there are many event handlers, with complex logic\
    \ in each.\n\nWe're doing it differently so that we can separate the handlers\
    \ into functions elsewhere in the code base. We have one problem to solve: if\
    \ they are functions, how will they access the connection parameter in such a\
    \ way that we can tell which player sent the command? With the concept of closures\
    \ which are well-supported in Javascript, we can make functions that return another\
    \ function. In this way, we can use the connection.id parameter to the first wrapping\
    \ function, and it can return another function that takes the data arguments from\
    \ the Socket.IO event caller. The second function is within the closure of the\
    \ first, it will have access to the connection.id parameter. The pattern looks\
    \ like this:\n\n```\n1 io.on('connection', function (connection) {\n2 connection.on('addPlayer',\
    \ addPlayer(connection.id));\n3 connection.on('action', action(connection.id));\n\
    4   // etc ...\n5 });\n```\n\n```\nfunction addPlayer(socketId){\n  return (data)=>{\n\
    \    // code here\n  }\n}\n```\n\n```\nfunction action(socketId){\n  return (data)=>{\n\
    \    // code here\n  }\n```\n\n> 21https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures"
