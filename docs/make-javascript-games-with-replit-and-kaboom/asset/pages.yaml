  md: "# Build a Space Shooter with Kaboom.js\n\nis because it's more fun if the player\
    \ needs to bash the “fire” button as fast as possible to take down an enemy, rather\
    \ than just having automatic weapons.\n\nThe onPress handler calls the spawnBullet\
    \ function with the player's current position. This function handles creating\
    \ a new laser shot in the correct direction. The first few lines of the method\
    \ adjust the bullet's starting position to the left or right of the spaceship's\
    \ position. This is because the position of the spaceship that gets to the center\
    \ is the center of the spaceship (remember the origin component we added to it\
    \ earlier). We adjust it a little so that the bullet looks like it is coming from\
    \ the edge of the spaceship.\n\nThen we add a bullet object to the game using\
    \ the add118 function. We don't use a sprite for the bullet, but draw a rect119,\
    \ rectangle with any color. We tag the bullet so we can refer to it later when\
    \ detecting if hit something. We also give it a custom property, bulletSpeed,\
    \ which is the distance and we want the bullet to move on each frame.\n\nFinally,\
    \ we add sound when the player shoots. The play120 function plays “shoot.wav”.\
    \ We adjust the volume down a bit, so it fits better with the overall mix. We\
    \ use theS parameter with a random number generator, rand121 to change the pitch\
    \ of the sound each time it's played. This is so the sound doesn't become too\
    \ repetitive and also makes it weird and “spacy”.\n\nNow we set the velocity to\
    \ make it move on each frame. We can do this using onUpdate122 event, using the\
    \ bullet tag to identify the objects we want to update:\n\n```\nonUpdate(\"bullet\"\
