  md: "# Build a Space Shooter with Kaboom.js\n\n```\nfunction spawnGem() {\n  let\
    \ xpos = rand(BLOCK_SIZE, MAP_WIDTH - BLOCK_SIZE);\n  add({\n    sprite(\"gem\"\
    ),\n    pos(xpos, BLOCK_SIZE),\n    area(),\n    body(),\n    \"gem\"\n  });\n\
    }\n\nonUpdate(\"gem\", (gem) => {\n  if (gem.pos.y > MAP_HEIGHT) {\n    destroy(gem);\n\
    \    spawnGem();\n  }\n});\n\nspawnGem();\n```\n\nOn this planet in outer space,\
    \ the gems rain from the sky, which is the top of our map for our purposes. We\
    \ calculate a random position, xpos, along the x axis for the gem to appear on\
    \ by calling the Kaboom rand(). We don't want gems to fall right at the edge of\
    \ the screen, as they will be cut off and the spaceship won't be able to get them\
    \ because of the boundary elements added around the screen. We limit the random\
    \ xpos to one BLOCK_SIZE from each edge.\n\nNow we add the gem sprite to the scene.\
    \ The pos component is set to the xpos we calculated, with the y component set\
    \ to the top of the screen. This is to avoid the gem getting stuck on our boundary.\
    \ We also give the gem the body component, which makes it subject to Kaboom gravity\
    \ so that it falls towards the ground. We give it the gem label so that we can\
    \ refer to it.\n\nThen we add the onUpdate event handler for the gem - we need\
    \ to do this for all objects with a body component that interacts with solid objects\
    \ taken care of. Sometimes, if the frame rate gets too low (if there's a lot of\
    \ action, or the computer's), some body and solid might be missed, and the object\
    \ falls through the solid. This could cause the gem to fall through the ground,\
    \ out of reach of the player's spaceship. To account for this possibility, we\
    \ check the gem's position against the map, and spawn a new gem if it is.\n\n\
    > https://kaboom.com/doc/#rand\nhttps://kaboom.com/doc/#add\nhttps://kaboom.com/doc/#body\n\
    https://kaboom.com/doc/#update\nhttps://kaboom.com/doc/#solid\nhttps://github.com/replit/kaboom/issues/86"
  merge: -1
  pgno: 87
- img_proc: true
  md: "Build a Space Shooter with Kaboom.js\n\nFinally, we call `spawnGem()` to start\
    \ the gem raining process.\n\n# Collecting Gems\n\nNow that gems are raining,\
    \ we can add a handler to pick up when the player's spaceship moves over a gem.\
    \ This is how the spaceship \"collects\", and will earn the player points. The\
    \ following `onCollide`^{179} event handler:\n\n```\nconst POINTS_PER_GEM = 100;\n\
    player.onCollide(\"gem\", (gem) => {\n  destroy(gem);\n  updateScore(POINTS_PER_GEM);\n\
    \  wait(1, spawnGem);\n});\n```\n\nThis fires whenever the spaceship and a gem\
    \ collides. We `destroy`^{171} the gem to remove it from the scene, and call the\
    \ `updateScore` function we added earlier to update the player's points by the\
    \ amount declared in the `POINTS_PER_GEM` constant. Then we `wait`^{172} one second\
    \ before another gem is spawned for the player to collect.\n\nRun the code now\
    \ and start collecting gems.\n\n> ${179}https://kaboomjs.com/doc/#onCollide\n\
    ^{171}https://kaboomjs.com/doc/#destroy\n^{172}https://kaboomjs.com/doc/#wait"
