  md: "# Build a Space Shooter with Kaboom.js\n\nNotably, the body component makes\
    \ the object react to gravity: the spaceship falls if it's not on the ground or\
    \ a platform. The rotate component allows us to tilt the spaceship in the direction\
    \ the player wants to go, providing good feedback. By default, all operations\
    \ are calculated around the top left corner of game objects. To make the tilt\
    \ work, we add the origin component and set it to center, so that the tilts adjust\
    \ from the center of the object.\n\nKaboom also allows us to attach custom data\
    \ to a game object. We've added score to hold the player's latest score, and shield\
    \ to hold the ship's protection shield still available. We can adjust these as\
    \ the player picks up items or crashes into them.\n\nWhen we created the map,\
    \ we added the solid component to map objects. This component marks objects as\
    \ solid, meaning other objects can't move past them.\n\n# Moving the Spaceship\n\
    \nWe'll allow a few different moves for the spaceship: change direction left or\
    \ right and fly up. We also need to keep track of which way the spaceship is facing,\
    \ so we'll know which side to shoot lasers from.\n\nTo handle the changing and\
    \ tracking of direction, we add the following code:\n\n```\nconst directions =\
    \ {\n  LEFT: \"left\",\n  RIGHT: \"right\"\n}\n\nlet current_direction = directions.RIGHT;\n\
    \nKeyDown(\"left\", () => {\n  player.flip(-X);\n  player.angle = -11;\n  current_direction\
    \ = directions.LEFT;\n  player.move(-100,0);\n});\n\nKeyDown(\"right\", () =>\
    \ {\n  player.flip(X);\n  player.angle = 11;\n  current_direction = directions.RIGHT;\n\
    \  player.move(100,0);\n});\n```\n\n> ^¹¹⁰https://kaboomjs.com/doc/body\n¹¹¹https://kaboomjs.com/doc/rotate\n\
    ¹¹²https://kaboomjs.com/doc/origin\n¹¹³https://kaboomjs.com/doc/shield"
