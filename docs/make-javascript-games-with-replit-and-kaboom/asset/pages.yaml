  md: "# Building pseudo-3D game in Kaboom\n\n```\narea(),\nrotate(0),\n{\n  xpos:\
    \ rand(-1*SCREEN_WIDTH/2, SCREEN_WIDTH/2),\n  ypos: rand(-1*SCREEN_HEIGHT/2, SCREEN_HEIGHT/2),\n\
    \  zpos: 1000,\n  speed: ALIEN_SPEED + rand(-0.5* ALIEN_SPEED, 0.5*ALIEN_SPEED)\n\
    },\n\"alien\"\n];\naliens.push(newAlien);\n}\nloop(0.8, spawnAlien);\n```\n\n\
    First, we define some general constants for the size of the screen and the speed\
    \ at which aliens will move. This way, we don't have to keep remembering and typing\
    \ numbers, and it's easier to change these aspects later if we need to. We create\
    \ an array to hold each alien object so that we can keep track of all of them.\
    \ This will be especially important when we add movement to the aliens.\n\nThe\
    \ function spawnAlien creates a new alien at a random location on the screen.\
    \ The first lines calculate a random x and y position to place the alien on the\
    \ screen initially. This isn't logically needed, as we'll calculate the alien's\
    \ actual position later from our 3D coordinate system and calculate the projected\
    \ screen position on each frame. But we need to pass a position¹¹⁹ to the add²⁰\
    \ method when we create a new object, so no random position will do.\n\nThere\
    \ are two components we use when constructing the alien object:\n\n+   - scale¹¹⁹\
    \ allowing us to adjust the size of the alien over time as if it's getting closer,\n\
    - rotate²⁰⁰ allowing us to rotate the aliens so we can simulate 'rolling' when\
    \ changing the spaceship's direction.\n\nWe add the coordinates of the alien's\
    \ position in the 3D system to the alien object as custom properties. We start\
    \ with a fixed²⁰⁰, on the Z axis, far from the screen.\n\nThen we set the alien's\
    \ speed, varied by a random amount of up to half the speed faster or slower that\
    \ there's some variety in the way aliens approach us. We'll use these custom values\
    \ when we calculate the alien's position on each frame.\n\nFinally, we add the\
    \ new alien to the aliens array we created earlier to keep track of it.\n\n> ¹¹⁹https://kaboomjs.com/doc/#pos\n\
    ²⁰⁰https://kaboomjs.com/doc/#add\n¹¹⁹https://kaboomjs.com/doc/#scale\n²⁰⁰https://kaboomjs.com/doc/#rotate"
  merge: -1
