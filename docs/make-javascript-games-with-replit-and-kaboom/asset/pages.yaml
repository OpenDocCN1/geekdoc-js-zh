  md: "# Building Snake in Kaboom.js\n\n```\nconst directions = {\n  UP: \"up\",\n\
    \  DOWN: \"down\",\n  LEFT: \"left\",\n  RIGHT: \"right\"\n}\n\nlet current_direction\
    \ = directions.RIGHT;\nlet run_action = false;\nlet snake_length = 3;\nlet snake_body\
    \ = [];\n```\n\nFirst, we define an object with properties for each of the allowable\
    \ directions the snake can move. This code checks and changes directions which\
    \ is easy to read and change, compared to just using numbers or strings to define\
    \ the directions. The variable current_direction tracks the snake is moving at\
    \ any time. We choose a starting direction, RIGHT, as its default. run_action\
    \ is a variable that we will use to keep if we are actual in the game, setting\
    \ or ending the game. The variable snake_length keeps track of how long the snake\
    \ tail becomes - we start it at a chosen value of 3. Finally, snake_body holds\
    \ the screen objects that make up the snake's body.\n\nNow we can add a function\
    \ to spawn, and respawn, the snake.\n\n```\nfunction spawnAll(){\n  destroyAll(\"\
    snake\");\n\n  snake_body = [];\n  snake_length = 3;\n\n  for (let i = 1; i <=\
    \ snake_length; i++) {\n    let segment = add(\n      rect(block_size, block_size),\n\
    \      pos(block_size, block_size *i),\n      color(0,0,255),\n      area(),\n\
    \      \"snake\"\n    );\n    snake_body.push(segment);\n  }\n  current_direction\
    \ = directions.RIGHT;\n}\n\nfunction spawn_all() {\n```"
