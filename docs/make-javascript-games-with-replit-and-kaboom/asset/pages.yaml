    \ defined above to move the objects in the x and y dimensions.\n\nIn the event\
    \ handlers for left and right keys, we also make use of the Kaboom camRot^216\
    \ effect. This rotates all the objects by the amount we specify, giving the perception\
    \ of spaceship banking hard turning. We add two additional event handlers on onKeyRelease^219\
    \ for the left and right keys to reset the rotation when the player stops turning.\n\
    \nGive the game a run, and you should be able to control the spaceship.\n\n> ^217https://kaboomjs.com/doc/onKeyDown\n\
