  md: "# Build a Physics playground with Kaboom.js\n\n```\n// physics object collisions\n\
    onCollide(\"movable\", \"movable\", (a, b) => {\n  if (a.speed > b.speed) a.direction\
    \ = b.direction;\n  else if (a.speed <= b.speed) a.direction = b.direction;\n\
    \  finalSpeed = (a.speed) + (b.speed) / (a.mass + b.mass);\n  a.speed = finalSpeed;\n\
    \  b.speed = finalSpeed;\n});\n```\n\nThis code will assign the direction of the\
    \ fastest object to both objects, and determine the speed of both from an altered\
    \ form of a simple one-dimensional collision formula⁴⁵⁶. Play around with the\
    \ values and calculations and see what sort of behavior you prefer. Remember,\
    \ it's more important for a game to be fun than it to be realistic.\n\n# Next\
    \ steps\n\nWe've built a rudimentary physics-based platform engine. From here,\
    \ there's a lot you can do to expand this into a full game. Consider the following\
    \ ideas:\n\n+   - Add enemies to throw crates.\n- Add more movables of different\
    \ sizes and masses.\n- Add puzzles that can be solved by arranging crates in specific\
    \ patterns, and launching them from specific angles.\n- Improve the physics simulation\
    \ with 2D collisions, rotating objects, and objects with different behaviors,\
    \ such as bouncing and shattering.\n\nYou can find the code sample for this tutorial\
    \ on github⁴⁵⁷ or replit⁵⁸\n\n> ⁴⁵⁶https://www.dummies.com/article/academics-the-arts/science/physics/how-to-find-the-velocity-of-two-objects-after-collision-174261\n\
    ⁴⁵⁷https://github.com/ritza-co/make-javascript-games-book-code-samples/blob/main/8-physics-playground-with-kaboom.md\n\
    ⁴⁵⁸https://replit.com/ritza/Gravity"
