    \ between 0 and 100.\n\nThe function sets the width of the shieldBar (its dimension\
    \ along the x axis) to the percentage of the shield available (player.shield /\
    \ 100), multiplied by the full width of the bar, 50.\n\nThen the function updates\
    \ the color of the bar depending on the health of the shield:\n\n+   - Less than\
    \ 20% health, shield bar is red;\n- Less than 50% but more than 20% health, shield\
    \ bar is orange;\n- The shield bar is set to green for all other health values,\
    \ in other words, when health is over 50%.\n\nThe final step in the shield health\
    \ function is to check if the shield health is depleted, and end the game if it\
    \ is."
