  md: "![](img/e909780a5f974ff614ba5223d44aa19b_20_0.png)\n\n# # Detecting Collisions\n\
    \nNow that we have all the objects our game needs – a boundary wall, a snake,\
    \ and food – we can move on to detecting interactions, or collisions, between\
    \ these objects.\n\nKaboom.js has a useful function for helping with this: onCollide².\
    \ The function takes in 2 tags for different game object types, and calls a provided\
    \ callback function if there is a collision of the objects.\n\nLet's start with\
    \ detecting if the snake moves over a food block. Add the code below:\n\n```\n\
    onCollide(\"snake\", \"food\", (s, f) => {\n    snake_length++;\n    respawn_food();\n\
    });\n```\n\n> ²https://kaboomjs.com/doc/#onCollide"
  merge: -1
  pgno: 20
- img_proc: true
  md: "# Building Snake in Kaboom.js\n\nWe set up the onCollide function with tags\
    \ for the snake, and the food object. Then, in the callback function, snake_length\
    \ is increased by 1, and we call respawn_food to replace the eaten food somewhere\
    \ else on the map.\n\nRunning this, and eating the food, you should see the snake\
    \ grow each time, and the food re-appear on another block:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_21_0.png)\n\
    \nEating food\n\nNow, we can add similar code to detect if the snake has hit the\
    \ wall:\n\n```\nonCollide(\"snake\", \"wall\", (s, w) => {\n    run_action = false;\n\
    \    shake(12);\n    respawn_all();\n});\n```\n\n> ^28https://docs.replit.com/images/tutorials/21-snake-kaboom/eat-food.gif"
  merge: -1
