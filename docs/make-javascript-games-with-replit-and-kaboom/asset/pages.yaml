  md: "# Ending when we get to the castle\n\nThe final thing to do for this tutorial\
    \ is to handle the case when Mario reaches the castle. At this point, Mario is\
    \ at the door, we want him to freeze, a congratulations message to appear to the\
    \ player, and then move on to the next level.\n\nWe can use a regular collision\
    \ handler to check if Mario is at the castle. Notice in the setup for the castle\
    \ in the level we added earlier, we set the collision area³⁶⁷ of the castle to\
    \ a very narrow, completely vertical line of width 1 pixel and height 240, which\
    \ is the screen height:\n\n```\n\"H\" => [\n  sprite(\"castle\"),\n  area({ width:\
    \ 1, height: 240 }),\n  origin(\"bot\"),\n  \"castle\"\n];\n```\n\nThis is so\
    \ that the collision between Mario and the castle is only registered when Mario\
    \ gets to the center of the castle, where the door is. We can visualize this by\
    \ pressing F1 in the game to enable the debugger and look at the area box at the\
    \ castle:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_178_0.png)\n\nCastle area"
