  md: "# Building Asteroids in Kaboom.js\n\n```\narea(),\nsolid(),\n\"asteroid\",\n\
    \"mobile\",\n\"wraps\",\n{\n  speed: rand(5, 10),\n  initializing: true\n}\n);\n\
    ```\n\n```\na.pushOutAll();\n```\n\n```\n}\n```\n\nHere we're creating a constant\
    \ number of asteroids, and assigning them a random position, direction of movement\
    \ and speed. The asteroid creation code is largely similar to our player creation\
    \ code, but with fewer custom properties. One difference is the presence of the\
    \ solid() component, which marks the asteroid as a solid object that other objects\
    \ shouldn't be able to pass through.\n\nOne custom property that is unique to\
    \ asteroids is initializing. Because we are spawning each asteroid in a random\
    \ position, there's a chance we might spawn one on top of another, or on top of\
    \ the player.\n\nOne approach to avoiding this might be to ensure we don't spawn\
    \ any two asteroids at the same coordinates, we might still end spawning them\
    \ to overlap with each other. We would need to take into account the size of asteroids\
    \ and prevent asteroids from spawning at any of those coordinates, and our code\
    \ would quickly become complicated.\n\nInstead of doing that, we can leverage\
    \ Kaboom's collision detection to achieve the same effect. Right after we create\
    \ the asteroid, we can check if it is overlapping with another \"mobile\"tagged\
    \ object (i.e. another asteroid, or the player's), and if so, we randomize its\
    \ position again. We can use a code loop to repeat until our asteroid lands in\
    \ a free space. After adding the following function:\n\n```\nwhile (a.isColliding(\"\
    mobile\")) {\n  spawnPoint = asteroidSpawnPoint();\n  a.pos = spawnPoint;\n  a.pushOutAll();\n\
    }\n```\n\n```\na.initializing = false;\n```\n\n> https://kaboomjs.com/doc/#solid"
