  md: "# Creating the Game Map\n\nTo start, we can get our board, or map drawn on\
    \ the screen. This will define the edges of the board that if the snake crashes\
    \ into them, we can detect and end the game.\n\nKaboom.js has built-in support\
    \ for defining game maps, using a text array and the function addlevel¹. This\
    \ takes away lot of the hassle normally involved in loading and rendering maps.\n\
    \nReplace the example code in main.js file with the following to create the game\
    \ board:\n\n```\nimport kaboom from \"kaboom\";\nkaboom();\n\nconst block_size\
    \ = 20;\nconst map = addlevel([\n  \"====================\",\n  \"=          \
    \      =\",\n  \"=      =       \",\n  \"=      =       \",\n  \"=      =    \
    \   \",\n  \"=                =\",\n  \"=                =\",\n  \"=         \
    \       =\",\n  \"=                =\",\n  \"=      =       \",\n  \"=      =\
    \       \",\n  \"=      =       \",\n  \"====================\",\n]), {\n  width:\
    \ block_size,\n  height: block_size,\n  pos: vec2(0, 0),\n  \"=\": () => {\n \
    \   rect(block_size, block_size),\n    color(255,0,0),\n    area(),\n    \"wall\"\
    \n  }\n});\",\n```\n\n> ¹https://kaboomjs.com/doc/#addLevel"
  merge: -1
