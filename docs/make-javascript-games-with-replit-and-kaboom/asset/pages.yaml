    \ handler, there is also another check. In Mario, you can't walk back to previous\
    \ parts of a level once it's off screen. We can simulate this by checking if Mario\
    \ is near the left edge of the screen. We get Mario's current position by calling\
    \ the pos method which is added by the pos component. However, this position will\
    \ be relative to the whole level, and not just the onscreen view. To help us figure\
    \ out where Mario is near the edge, and not just at the beginning of the level,\
    \ we can use the toScreen function, which converts \"game world\" or level-coordinates\
