  md: '# Building Snake in Kaboom.js


    ![](img/e909780a5f974ff614ba5223d44aa19b_7_0.png)


    # Creating a new repl


    After the repl has booted up, you should see a main.js file under the "Scenes"
    section. This is where we will start coding.


    # Getting Started with Kaboom.js


    Kaboom.js* is a JavaScript library that contains many useful features to make
    simple in-browser games. It has functionality to draw shapes and sprites (the
    images of characters and game elements) to the screen, get input, play sounds,
    and more. We will explore these features and learn how they work by using some
    of them in our game.


    Kaboom.js also makes use of JavaScript''s support for callbacks*; instead of writing
    loops to read in keyboard input and if game objects have collided (bumped into
    each other), Kaboom.js uses an event model, where it tells us when such an event
    has occurred. Then we can connect up functions^10* on these events.


    Using Kaboom.js in Replit takes care of all the boilerplate initialisation code,
    as well as we can concentrate on writing the game logic and making game graphics
    and sound.


    > *https://kaboom.js

    *https://developer.mozilla.org/en-US/docs/Glossary/Callback_function

    *https://developer.mozilla.org/en-US/docs/Glossary/Callback_function'
