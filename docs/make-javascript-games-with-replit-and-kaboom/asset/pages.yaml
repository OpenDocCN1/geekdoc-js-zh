  md: '# Building Flappy Bird in Kaboom.js


    You''ll also notice that the character we are adding here has many more components
    than just the sprite³95 component we use for the background. We already know what
    the sprite component does, here is what the rest are for:


    +   - The scale³96 component makes the sprite larger on screen by drawing it at
    2 times the sprite''s normal image size. This gives a nice pixelated look, while
    also making it easier to spot the bird.

    - The pos³97 component sets the position on the screen that the character should
    initially be at. It takes X and Y coordinates to specify a position.

    - The area³98 component gives the sprite an invisible bounding box around it,
    which is used when calculating and detecting collisions between characters. We''ll
    need this so that we can detect if Flappy flies into the pipes.

    - The body³99 component makes the character subject to gravity. This means Flappy
    will fall out of the sky if the player doesn''t do anything.


    Press command + s (Mac) or control + s (Windows/Linux) to update the game output
    window. You should see Flappy added and fall out of the sky very quickly:


    ![](img/e909780a5f974ff614ba5223d44aa19b_187_0.png)


    Flappy falling out of the sky


    Click to open gif¹⁰⁰


    ³⁹⁵https://kaboom.com/#sprite

    ³⁹⁶https://kaboom.com/#scale

    ³⁹⁷https://kaboom.com/#pos

    ³⁹⁸https://kaboom.com/#area

    ³⁹⁹https://kaboom.com/#body

    ¹⁰⁰https://docs.replit.com/images/tutorials/35-flappy-bird/flappy-falls.gif'
