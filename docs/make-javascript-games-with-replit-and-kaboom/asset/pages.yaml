  md: "# Build a Physics playground with Kaboom.js\n\n+   - physics(), which will\
    \ define attributes and functions for the movable objects the gravity gun will\
    \ manipulate.\n\nAdd the following code for the gravitygun() component beneath\
    \ your helper function definitions:\n\n```\n// custom components\nfunction gravitygun(range,\
    \ hold, firepower) {\n  return {\n    id: \"gravitygun\",\n    require: [\"pos\"\
    ],\n  };\n}\n```\n\nComponents are written as functions that return objects of\
    \ a specific format. Each component should have an id, and a list of components\
    \ it depends on the require attribute. Beyond that, components can have arbitrary\
    \ attributes, which are attached to their parent object, and special functions,\
    \ which will be integrated into the game event loop\\*\\*.\n\nThe only dependency\
    \ for our component is pos(), as it will not work on an object that doesn't have\
    \ a position in the world. Function arguments will allow us to customize this\
    \ component, in the form of specifying the gravity gun's range, hold distance,\
    \ and firepower.\n\nLet's add custom attributes to our component, to help us aim\
    \ and fire the gravity gun. Expand your component code to match the following:\n\
    \n```\nfunction gravitygun(range, hold, firepower) {\n  return {\n    id: \"gravitygun\"\
    ,\n    require: [\"pos\"],\n    firepower: firepower, // new code from this line\n\
    \    range: range,\n    hold: hold,\n    aimAngle: angleBetween(this.pos, mouseWorldPos),\n\
    \    rangeLine: {\n      p1: this.pos,\n      p2: this.pos,\n      color: BLACK\n\
    \    },\n    holdLine: {\n      p1: this.pos,\n      p2: this.pos,\n      color:\
    \ BLUE\n    }\n  };\n}\n```\n\n> \"https://kaboomjs.com/#on"
