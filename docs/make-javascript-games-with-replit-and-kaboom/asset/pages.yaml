  md: "# Building Snake in Kaboom.js\n\n```\nrun_action = false;\nwait(0.5, function({\n\
    \  respawn_snake();\n  run_action = true;\n});\n```\n\nrespawn_all();\n\nFirst,\
    \ the first get gets rid of any existing snake segment objects by using the Kaboom.js\
    \ destroyAll function(). This removes any object with the given tag from the game.\
    \ Then we reset our array to an empty array, and the snake length to the default.\n\
    \nThe function sets up a loop to create new snake segments, up to the length we\
    \ specified. It does this by calling the Kaboom.js add method which adds a new\
    \ object to the game. add takes a few parameters, components of the object to\
    \ create. We pass in components to specify how to draw the object (using rect()),\
    \ its color, and a tag \"snake\" to identify the segments specify when we are\
    \ checking collisions, and updating/removing segments. We also specify the position\
    \ for the segment create. To creating the snake, we ensure it is at least one\
    \ block_size, or block, from the left side, and add each subsequent segment more\
    \ block down per loop. This gives a snake pointing down to start. Then we add\
    \ the new segment to our snake_body array to keep track of it.\n\nFinally, we\
    \ set a default starting direction for the snake to move.\n\nYou'll notice we\
    \ also add in a function respawn_all, and a call to the function respawn_snake.\
    \ We use the respawn_all to call all of our other respawn functions. We have one\
    \ for the snake, but we will also need one for the food when we add. In the respawn_all\
    \ function, we also take care to set the run_action flag to false, so that no\
    \ updates are made while we are setting or resetting objects. We also wrap the\
    \ calls in a Kaboom.js wait function(), with a small delay of 0.5 seconds. This\
    \ is because when we detect a \"game over\" condition, we don't want to immediately\
    \ reset the game, as it could be a disorienting to player.\n\nRunning the code\
    \ now, you should see a blue line at the top-left side of the map.\n\n+   https://kaboomjs.com/doc/#destroyAll\n\
    https://kaboomjs.com/doc/#add\nhttps://kaboomjs.com/doc/#rect\nhttps://kaboomjs.com/doc/#wait"
