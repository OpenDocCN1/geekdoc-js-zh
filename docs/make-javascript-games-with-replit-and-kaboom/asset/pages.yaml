  md: "# Building Asteroids in Kaboom.js\n\n```\nonKeyDown(\"up\", () => {\n  player.speed\
    \ = Math.min(player.speed+player.acceleration, player.max_thrust);\n  play(\"\
    rocket_thrust\", {\n    volume: 0.1,\n    speed: 2.0,\n  });\n});\n```\n\nRather\
    \ than having the spaceship from zero to max speed immediately, we use this to\
    \ simulate a gradual acceleration to our max speed. To achieve this, we use Math.min()^\
    \ to set the player's speed to the minimum value between current speed plus acceleration\
    \ and its maximum speed. This will make the ship gradually increase speed until\
    \ it reaches max_thrust. Play around with the values of acceleration and max_thrust\
    \ in the player creation code and see what feels right to you.\n\nAdditionally,\
    \ we set our rocket thrust to play^6 while accelerating. Kaboom allows us to manipulate\
    \ sounds in few different ways, such as changing their speed and volume.\n\nWe'll\
    \ handle deceleration by doing the opposite to acceleration, using Math.max()^\
    \ to choose the maximum between the player's speed minus deceleration, and their\
    \ maximum speed in reverse (i.e. negative). Adding the following code below the\
    \ acceleration controls:\n\n```\nonKeyDown(\"down\", () => {\n  player.speed =\
    \ Math.max(player.speed-player.deceleration, -player.max_thrust);\n  play(\"rocket_thrust\"\
    , {\n    volume: 0.2,\n    speed: 2.0,\n  });\n});\n```\n\nIf you run your repl\
    \ now and try to accelerate or decelerate, the sound will play, but the ship will\
    \ go nowhere. This is because we're manipulating player.speed, which is a custom\
    \ property that Kaboom hasn't attached any special behavior to (unlike player.angle).\
    \ Let's add some movement parameters now.\n\n# Movement\n\nMovement in Kaboom\
    \ and most other 2D game development systems is handled using X and Y coordinates\
    \ on a plane. To move an object left, you subtract from its X coordinate, and\
    \ to move right, you add to its X coordinate. To move an object up, you subtract\
    \ from its Y coordinate, and to move down, you add to its Y coordinate. Therefore,\
    \ basic four-directional movement in games\n\n> ^https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/min\n\
    ^https://kaboomjs.com/splay\n^https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/max"
