  md: "# Build a Physics playground with Kaboom.js\n\n```\nthis.rangeLine.p2 = this.pos.add(pointAt(this.range,\
    \ this.aimAngle);\nthis.holdLine.p1 = this.pos;\nthis.holdLine.p2 = this.pos.add(pointAt(this.hold,\
    \ this.aimAngle);\n}\n```\n\nOur gravity gun component is complete. Now we need\
