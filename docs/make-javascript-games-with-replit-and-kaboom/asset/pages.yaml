    # # Moving the Snake


    Now that we''ve got map boundaries, and a snake drawn on the screen, we can work
    on getting player input and moving the snake around.


    Kaboom.js has a function onKeyPress¹⁷, which can call a supplied function whenever
    a particular key is pressed. We''ll use that to determine which way the player
    wants the snake to go. Add this code to get user direction input:


    > ^17https://kaboomjs.com/doc/#onKeyPress'
  merge: -1
  pgno: 13
- img_proc: true
  md: "```\nonKeyPress(\"up\", () => {\n  if (current_direction != directions.DOWN){\n\
    \    current_direction = directions.UP;\n  }\n});\n```\n\n```\nonKeyPress(\"down\"\
    , () => {\n  if (current_direction != directions.UP){\n    current_direction =\
    \ directions.DOWN;\n  }\n});\n```\n\n```\nonKeyPress(\"left\", () => {\n  if (current_direction\
    \ != directions.RIGHT){\n    current_direction = directions.LEFT;\n  }\n});\n\
    ```\n\n```\nonKeyPress(\"right\", () => {\n  if (current_direction != directions.LEFT){\n\
    \    current_direction = directions.RIGHT;\n  }\n});\n```\n\nFor each the named\
    \ \"arrow\" keys, we set up a function to call if the key is pressed. In each\
    \ of these functions, we check to ensure that the new direction input is not the\
    \ complete opposite direction to which the snake is currently moving. This is\
    \ because we don't want to allow the snake to reverse. If the input direction\
    \ is a legal move, we update the current_direction property to the new direction.\n\
    \nNow we need to think about how to make the snake appear to move the screen.\
    \ A way to do this is to add a block in front of the snake in that direction.\
    \ We'll need to remove a block at the tail-end of the snake. We'll need to do\
    \ this every few seconds in that the snake appears to be moving smoothly. Kaboom.js\
    \ has a function onUpdate which can be used to update objects on each frame. Add\
    \ the following code, which uses the onUpdate function, to move the snake:"
