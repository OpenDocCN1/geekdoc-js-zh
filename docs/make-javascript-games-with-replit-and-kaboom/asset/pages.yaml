    \    selected.held = false;\n  }\n});\n```\n\nWhen the right mouse button is clicked,\
    \ we retrieve all the \"movable\"-tagged objects and filter453 the ones that aren't\
    \ currently held. Only one object can be held at a time, so we select that object\
    \ and release it.\n\nIf you restart your repl now, you may have trouble getting\
    \ to drop. Because we use the right mouse button both for pulling and dropping,\
    \ you need to be precise to avoid immediately grabbing objects after dropping\
    \ them.\n\nLet's implement a dropping timeout for dropped objects to make this\
    \ more user-friendly. Add the following lines below selected.dropping = false:\n\
