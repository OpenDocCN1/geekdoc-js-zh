  md: "# # Building tic-tac-toe with WebSocket and Kaboom.js\n\nTic-tac-toe, or noughts\
    \ and crosses, or Xs and Os, is a simple classic game for 2 players. It's usually\
    \ played with paper and pen, but it also makes a good first game to write for\
    \ networked multiplayer.\n\n this tutorial, we'll create a 2-player online tic-tac-toe\
    \ game using a Node.js²⁴⁴ server. Socket.IO²⁴⁴³ will enable realtime gameplay\
    \ across the internet. We'll use Kaboom.js to create the game interface.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_117_0.png)\n\
    \nClick to open gif²⁴⁴²\n\n# ## How do multiplayer games work?\n\nMultiplayer\
    \ games have an architecture that typically looks something like this:\n\n> ²⁴⁴https://nodejs.org/en/\n\
    ²⁴⁴https://socket.io\n²⁴⁴https://docs.replit.com/images/tutorials/27-tictactoe-kaboom/gameplay.gif"
