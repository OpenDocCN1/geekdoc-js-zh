  md: "# Building a Mario-like side-scroller with Kaboom.js\n\n+   - A \"start\" or\
    \ intro scene, which waits for a player to press a button to start the game. We'll\
    \ also\nreturn to this scene if the player dies, so they can start again.\n- A\
    \ main \"game\" scene, which will contain the game levels and all the logic to\
    \ move Mario,\nthe logic for the enemies and rewards, etc.\n\nWe can use the go^301\
    \ function to switch scenes.\nLet's add the \"start\" scene, and make the game\
    \ to go to the start scene by:\n\n```\nscene(\"start\", () => {\n  add({\n   \
    \ text(\"Press enter to start\", { size: 24 }),\n    pos(vec(160, 120)),\n   \
    \ origin(\"center\\),\n    color(255, 255, 255),\n  });\n\n  onKeyRelease(\"enter\"\
    , () => {\n    go(\"game\");\n  });\n});\ngo(\"start\");\n```\n\nWe define the\
    \ scene^302 function. This function takes a string as the scene name-\nwe're calling\
    \ the scene \"start\". We're using an inline function here, using arrow function\
    \ notation^303.\nYou could also use the function keyword, if you'd like to specify\
    \ a function in that way.\n\nWe also add some instruction text in the start scene,\
    \ using the text^304 component and setting\nt text's content and size. The pos^305\
    \ component sets the position of the text on the screen, and the\norigin^306 component\
    \ sets the color of the text to white using the color^307 component, which uses\
    \ RGB (red, green, blue)\nvalues from 0-255.\n\nWe also have a call to the function\
    \ onKeyRelease^308, which listens for the key being pressed.\nIf the key is pressed,\
    \ we go to the main game scene (we'll add shortly!)\n\nFinally, we use the go^309\
    \ function to go to the start scene when the game starts up.\n\n> ^301 https://kaboomjs.com/#go\n\
    302 https://kaboomjs.com/#scene\n303 https://developer.mozilla.org/en-US/Web/JavaScript/Reference/Functions/Arrow\n\
    304 https://kaboomjs.com/#text\n305 https://kaboomjs.com/#pos\n306 https://kaboomjs.com/#origin\n\
    307 https://kaboomjs.com/#color\n308 https://kaboomjs.com/#onKeyRelease\n309 https://kaboomjs.com/#go"
