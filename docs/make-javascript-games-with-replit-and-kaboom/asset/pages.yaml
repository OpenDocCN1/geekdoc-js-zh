    \ (this.inRange) {\n        drawRect({\n          width: this.width,\n       \
    \   height: this.height,\n          pos: vec2(this.pos.x - this.width/2, this.pos.y\
    \ - this.height/2),\n          opacity: 0,\n          outline: { color: BLACK,\
    \ width: 4 }\n        });\n      }\n    }\n  };\n}\n```\n\nThis component requires\
    \ both area and body - to be affected by the gravity gun, objects must have a\
    \ collision area and be subject to regular gravity. We give our physics objects\
    \ a mass, direction and speed, and several variables to add the gravity gun. Finally,\
    \ we define a draw() function which will draw a thick rectangle around the object\
    \ when it is in gravity gun range.\n\nNow we need to add the gravitygun() component\
    \ to the player object and the physics() component to the crate object. Find your\
    \ level creation code and add the new component lines to the objects as below:"
