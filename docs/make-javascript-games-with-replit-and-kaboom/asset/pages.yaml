    affect the game - we call that bg. We''ll place all the main game objects (like
    our hero, his enemies, and any other objects he interacts with) on game layer,
    and all the UI elements (like current score, health, etc.) on the ui layer. We
    make the default layer, so if we don''t specify a layer on a game object, it will
    be drawn on the game layer.


