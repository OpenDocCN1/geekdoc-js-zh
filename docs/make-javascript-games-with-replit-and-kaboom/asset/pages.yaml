  md: "# Allowing the Alien Bugs to Attack\n\nNow that we have mechanisms for updating\
    \ points and shield health, we can add the code dealing with alien bugs hitting\
    \ the spaceship to the main scene:\n\n```\nconst ALIEN_SHIELD_DAMAGE = -15;\n\
    collide(\"alien\", \"player\", (alien, player) => {\n  shake(20);\n  makeExplosion(alien.pos,\
    \ 8, 8, 8);\n  destroy(alien);\n  play(\"explosion\");\n\n  detune(-1200,\n  volume:\
    \ 0.5\n});\nupdatePlayerShield(ALIEN_SHIELD_DAMAGE);\n```\n\nThis is a big event\
    \ - it's the way the ship gets damaged and it can be fatal - so we want to add\
    \ a bit more dramatic effect. Kaboom can create a cool screen-shaking effect,\
    \ as if the player has been hit, which we can invoke by calling shake¹¹⁶² with\
    \ a number representing how dramatic the shake should be. Then we add some visual\
    \ effect with the makeExplosion function. We also destroy the alien and play¹¹⁶³\
    \ explosion effect again, this time a bit louder as the alien exploding directly\
    \ affected the player. We also detune the effect to the lowest pitch we can, to\
    \ make it \"feel\" more direct, particularly if the player has a sub-woofer.\n\
    \nThen we call the updatePlayerShield function defined previously, with a constant\
    \ that defines how much a shield is damaged per hit. You can move the constant\
    \ to the top of the main scene file to keep it if you want.\n\n# Raining Gems\n\
    \nIt's time to add the element that gives the game its purpose: gems the player\
    \ can collect to earn points. Add this function to the main scene to create a\
    \ gem:"
