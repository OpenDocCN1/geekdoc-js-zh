  md: '![](img/e909780a5f974ff614ba5223d44aa19b_118_0.png)


    # Game server architecture


    Players (clients) connect to a game server over the internet. The game runs on
    the game server, where all the game rules, scores and other data are processed.
    The players'' computers render the graphics for the game, and send player commands
    (from the keyboard, mouse, gamepad, or other input device) back to the game server.
    The game server checks if these commands are valid, and then updates the game
    state. The game state is a representation of all the variables, players, data
    and information about the game. This game state is transmitted back to all the
    players and the graphics are updated.


    A lot of communication needs to happen between a player''s computer and the game
    server in online multiplayer games. This generally requires a 2-way, or bidirectional,
    link so that the game server can send data and notify players of updates to the
    game state. This link should ideally be quick too, so a more permanent connection
    is better.


    With the HTTP2^43 protocol that websites usually use, a browser opens a connection
    to a server, then


    > ^43https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol'
