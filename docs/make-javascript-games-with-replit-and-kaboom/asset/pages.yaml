  md: "Building pseudo-3D game in Kaboom\n\nClick to open gif^29\n\n# Checking if\
    \ alien bugs hits the spaceship\n\nNow we can add functionality to check if an\
    \ alien bug hits it part our laser and explodes into the spaceship. Since the\
    \ cockpit covers the entire screen, we can't make use of the onCollide^30 function\
    \ to check if an alien has hit the cockpit, as it would always be colliding. Instead,\
    \ we can check the z value of the alien, if plus it is within an area of the spaceship\
    \ that would cause damage. We'll use a \"strike zone\" in the center of the cockpit\
    \ view as the alien can do damage to the craft. Outside that, we'll assume that\
    \ the aliens go around or over the spaceship.\n\nTo implement this scheme, add\
    \ the definition of the strike zone:\n\n```\nconst STRIKE_ZONE = [x1:80, x2:240,\
    \ y1:20, y2:100];\n```\n\nThen we can modify the onUpdate(\"alien\",...) event\
    \ handler that we dealt earlier in \"Moving the Alien Bugs section\". In the part\
    \ of the function where we check if the alien is close to us (if alien.pos.z <=\
    \ 1), update the code as follows:\n\n```\nif (alien.pos.z < 1 )\n  //check if\
    \ the alien has hit the craft\n  if (alien.pos.x > STRIKE_ZONE.x1 &&\n      alien.pos.x\
    \ < STRIKE_ZONE.x2 &&\n      alien.pos.y > STRIKE_ZONE.y1 &&\n      alien.pos.y\
    \ <= STRIKE_ZONE.y2){\n    shake(20);\n    makeExplosion(alien.pos, 10, 10, 10);\n\
    \  }\ndestroyAlien(alien);\n```\n\nWe've modified the code to check if the alien\
    \ is really close to us (alien.pos.z < 1 ), and if it is, we check if it is within\
    \ the bounds of the STRIKE_ZONE area. The strike zone is a rectangle - you could\
    \ implement more complex shapes if you wanted to be more accurate about where\
    \ the alien can hit. However, a rectangle approximation is OK for this game.\n\
    \nIf the alien is close enough, and within our strike zone, we use the shake^231\
    \ effect to make it \"feel\" like we've hit him. Then we create an explosion at\
    \ the point of impact for some visual effects.\n\n> ^29https://docs.replit.com/tutorials/25-3d-game-kaboom/shooting-explosion.gif\n\
    ^30https://kaboomjs.com/doc/#onCollide\n^31https://kaboomjs.com/#shake"
