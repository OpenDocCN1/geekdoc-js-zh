  md: "# Building a Mario-like side-scroller with Kaboom.js\n\nThe object component\
    \ is added to must also have the pos component. We'll use that to move the object\
    \ when it is bumped.\n\nWe add a method, `bump`, which we can call from a collision\
    \ handler or elsewhere. In the property bumped set to true. This is a flag that\
    \ will trigger the bump behavior. In the bump method, we record the y position\
    \ of the object in a property `originPos` so that we can stop the object at its\
    \ original position if the `stopAtOrigin` flag has been set.\n\nIn the update\
    \ method, which is run on each frame, we first check if the bumped flag has been\
    \ set. If it is, we update the position of the object using the speed set, and\
    \ in the current direction. On a screen, the top of the screen is where y = 0,\
    \ and the bottom is the max height of the screen. Therefore to start, direction\
    \ is set to -1 to move the object. We then have to check to see if the new position\
    \ of the object is higher than the offset parameter distance from its original\
    \ position. If it is, we reverse the direction, so the object starts moving back.\n\
    \nNext, we have to check to see if the flag stopAtOrigin is set. If the object\
    \ has fallen down to its original position (or further), we set the bumped flag\
    \ back to false and update object's position exactly to its original position.\
    \ We also set the direction flag back to -1, so the object is back in a state\
    \ that it can be bumped.\n\nNow that this bump component exists, you can uncomment\
    \ the `bump()`, which lines in the `lineConf` setup we created earlier.\n\nTo\
    \ trigger the headbutt and add the code to make the surprise out, we'll need to\
    \ add a collision handler. Believe it or not, you can also find the special collision\
    \ event called headbutt (which is not documented, but you can find it in the source\
    \ code*1) just for this type of thing!\n\n```\nplayer.on(\"headbutt\", (obj) =>\
    \ {\n  if (obj.is(\"questionBox\")) {\n    if (obj.is(\"coinBox\")) {\n      let\
    \ coin = level.spawn(\"c\", obj.gridPos.sub(0, 1));\n      coin.bump();\n    }\n\
    \  } else {\n    if (obj.is(\"mushbox\")) {\n      level.spawn(\"M\", obj.gridPos.sub(0,\
    \ 1));\n    }\n  }\n  var pos = obj.gridPos;\n  destroy(obj);\n  var box = level.spawn(\"\
    !\", pos);\n  box.bump();\n});\n```\n\nIn the handler for headbutt, we are passed\
    \ the object, obj, that the player headbutted. We check to\n\n> *1https://github.com/replit/kaboom"
