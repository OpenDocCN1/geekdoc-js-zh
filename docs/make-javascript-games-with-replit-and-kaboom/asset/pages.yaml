  md: "# Building tic-tac-toe with WebSocket and Kaboom.js\n\n```\nvar socket = io('https://tic-tac-toe.<YOUR_USER_NAME>.repl.co');\n\
    socket.on('connect', function() {\n  socket.emit(\"addPlayer\", {\n    playerName:\
    \ playerName\n  });\n});\n```\n\nIn the first line, we initialize the Socket.IO\
    \ client library²⁷⁷⁶ to connect to the server. Then we add a listener to the connect²⁷⁷⁶\
    \ event. This lets us know we have established a connection to the server.\n\n\
    If we have a connection, then we add the emit²⁷⁷⁷ event to the server, with our\
    \ custom event type addPlayer. We also add the player name, which we passed from\
    \ scene to startGame scene. Emitting the addPlayer event to the server will cause\
    \ the addPlayer event handler to fire on the server side, adding the player to\
    \ the game, and emitting back the game state.\n\n# Handling updated game state\n\
    \nRemember that our server emits a gameState whenever something changes in the\
