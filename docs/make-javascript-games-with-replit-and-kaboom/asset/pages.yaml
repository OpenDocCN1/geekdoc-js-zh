  md: "# Building Mario-like-scroller with Kaboom.js\n\nadded to the scene. We also\
    \ pass in the configuration for all the symbols in the level map that we assigned\
    \ to the levelConf variable. At this point, the map and all the characters in\
    \ it are drawn to the scene. Note, because the map is wider than the size we set\
    \ in the settings for the Kaboom window, we only see part of the map. It is great,\
    \ because it will allow us to show more of the map as Mario starts walking.\n\n\
    Then we add a effect to the background layer - clouds, hills and shrubries. Note\
    \ the use of the layer component on these elements. We do so that they don't interact\
    \ with our game objects - they just add some visual interest. You can add as many\
    \ as you like - the original Mario has in a repeating pattern across the whole\
    \ level.\n\nWe also add some temporary text to the ui layer to let the player\
    \ know where they are on. Notice that we use the lifespan³¹⁴ component to automatically\
    \ fade out and remove the info after 1 second.\n\nFinally, we add Mario to the\
    \ game! We could have added him by placing his symbol, p, on our level definition.\
    \ However, by adding him manually to the scene using level.spawn()³¹⁵, we can\
    \ get a reference to this. This will be useful later when we are dealing with\
    \ collisions and other interactions. We also set the position where the character\
    \ to be placed at.\n\n# Making Mario move\n\nThe scene is all set up, let's add\
    \ some interaction. The player will use the arrow keys to move Mario left and\
    \ the space bar to make him jump. We'll use the keyDown³¹⁶ function for moving\
    \ left and right, as we want Mario to keep moving as long as the player holds\
    \ down key. Then we can use the keyPressed³¹⁷ function to make Mario jump. The\
    \ player will need to push the space key each time they want Mario to jump - it's\
    \ always fun to smash buttons! Adding the code at the bottom of the game:\n\n\
    ```\nconst SPEED = 120;\n\nkeyDown(\"right\", () => {\n  player.flipX(false);\n\
    \  player.move(SPEED, 0);\n});\n\nkeyDown(\"left\", () => {\n  player.flipX(true);\n\
    \  if (toScreen(player.pos).x > 20) {\n    player.move(-SPEED, 0);\n  });\n```\n\
    \n> ³¹⁴https://kaboomjs.com/lifespan\n³¹⁵https://kaboomjs.com/spawn\n³¹⁶https://kaboomjs.com/onKeyDown\n\
    ³¹⁷https://kaboomjs.com/onKeyPress"
