    Next, we create the game map. The map, or level design, is expressed in an array
    of strings. Each row in the array represents one row on the screen, so we can
    design visually in what the map should look like. The width and height parameters
    specify the size of each of the elements in the map. The pos parameter specifies
    where on the map the symbol should be placed – we choose (0,0), which is the top
    left of the screen, as the starting point for the map.


    Kaboom allows us to specify what to draw for each symbol in the text map. You
    can make maps of different elements, e.g. a symbol for a wall, a symbol for ground,
    a symbol for a hump, and so on. To tell Kaboom what to draw for the symbol, we
    add the symbol as a key, for example =, and then specify parameters for it.


    In this code, we have 3 different type of fixed map elements: representing the
    ground, p representing platforms, and - representing the invisible boundaries
    of the screen. Each of the map elements has a tag (ground, plat.form, boundary)
    which is the name grouping the individual pieces together. This allows us to refer
    to them collectively later.


