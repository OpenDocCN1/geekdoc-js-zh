  md: "# Building a Mario-like scroller with Kaboom.js\n\nNotice that the mario and\
    \ enemies sprites are loaded with the function loadAseprite(), and have an extra\
    \ parameter specifying a .json file. This extra file is in a format made by Aseprite,\
    \ which is a pixel art and animation app. If you open the Mario.png file, you\
    \ will see that it has many images of Mario in different positions, which are\
    \ frames of Mario animations. .json file contains all the information needed to\
    \ animate Mario in our game. Kaboom knows how to interpret this, we can pick any\
    \ animation to run at any time by choosing one from the frameTags list in the\
    \ .json file and using the .play() method on it. We can also choose a particular\
    \ frame to show at any time, using the sprite's .frame property, and specifying\
    \ the frame number to, starting from 0.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_147_0.png)\n\
    \n```\n{\n  \"meta\": {\n    \"app\": \"http://www.aseprite.org/\",\n    \"version\"\
    : \"1.2.27-trial\",\n    \"format\": \"RGBA8888\",\n    \"size\": {\"w\": 83,\"\
    h\": 32},\n    \"scale\": 1\n  },\n  \"frameTags\": [\n    {\"name\": \"SmallMario\"\
    , \"from\": 0, \"to\": 3, \"direction\": \"forward\"},\n    {\"name\": \"Running\"\
    , \"from\": 4, \"to\": 7, \"direction\": \"forward\"},\n    {\"name\": \"BigMario\"\
    , \"from\": 8, \"to\": 16, \"direction\": \"forward\"},\n    {\"name\": \"Running\"\
    , \"from\": 17, \"to\": 25, \"direction\": \"forward\"},\n    {\"name\": \"FireMario\"\
