    });\n```\n\nBecause we're moving the aliens and stars to make it appear as if\
    \ the spaceship is moving, these elements must move in the opposite direction\
    \ to that of the arrow key being used. We use the left key to move the spaceship,\
    \ our scene moves to the right. We use the Kaboom onKeyDown^218 and onKeyRelease^219\
    \ to attach event handlers for direction controls to the arrow keys on the keyboard.\
    \ In each of the onKeyDown event handlers, we get the time elapsed from the last\
    \ frame by calling dt()^217, and multiply it by MOVE_DELTA, representing the amount\
