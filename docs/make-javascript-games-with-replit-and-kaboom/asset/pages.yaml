  md: "# Building a Mario-like side-scroller with Kaboom.js\n\n```\nupdate() {\n \
    \ if (Math.abs(this.pos.x - this.startingPos.x) >= distance) {\n    dir = -dir;\n\
    \  }\n  this.move(speed * dir, 0);\n}\n```\n\nWe've called this custom component\
    \ \"patrol\", as it will make a character move distance, at a set speed, and then\
    \ turn and walk in the opposite direction, dir. The character will turn and move\
    \ in the opposite direction. The move method (which is part of the pos[332] component),\
    \ the collide event handler (which is part of the area[333] component), we can\
    \ add the pos and area components to the require list.\n\nWhen the character is\
    \ first initialized, we want to record its starting position. This is so that\
    \ we know how far from where it started off, and we'll know when to turn it move\
    \ in the opposite direction. We do this by using the add() method. As we mentioned\
    \ above, Kaboom will call this method on when the character is added to the scene.\
    \ We read the position of the character at that time by calling this.pos: this\
    \ refers to the character (as our component is part of character, this reference\
    \ is to the combination of all the components making up the character). We can\
    \ save this initial position to a property of the component object, in one case\
    \ we called startingPos. We then attach a collide[334] handler, so if the character\
    \ bumps into something, we turn it in the opposite direction.\n\nThe collide[335]\
    \ handler has two arguments passed to it: the obj that our character collided\
    \ with, and the side of character that hit. We only want to flip our character\
    \ moves if it was hit from the sides left or right. To change the direction, we\
    \ flip the sign of our dir variable, which we'll use in the update() method.\n\
    \nThe update() method is called for each frame. In it, we first check if the character\
    \ is further than the specified maximum distance from its starting position. If\
    \ it is, we switch the sign of the dir variable to make the character move in\
    \ the opposite direction. We then use the Math.abs[336] function, which returns\
    \ the absolute value of a number. The absolute value of a number is always positive,\
    \ and this allows us to compare it to our distance variable, which is also a positive\
    \ value. We then call the move method (with the pos[337] component) and use the\
    \ speed variable (passed in the component created) to specify how fast and in\
    \ which direction to move the character for this frame.\n\n+   [338]https://kaboom.js/pos\n\
    [339]https://kaboom.js/area\n[340]https://kaboom.js/on\n[341]https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/abs\n\
    [342]https://kaboom.js/pos"
