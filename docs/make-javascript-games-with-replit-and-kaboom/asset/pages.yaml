    # Headbutting surprise boxes


    Another key Mario is headbutting the surprise boxes (the ones with “?” on them).
    In Mario World, this could release a coin, a super mushroom (one that makes Mario
    grow bigger), etc. When Mario headbut these boxes, the box is “bumped” and moves
    up and down quickly, while releasing its surprise. Once the box is empty, the
    “?” is removed from it. Let’s create the logic to control these boxes. As above,
    we’ll make more of custom components.


    We''ll take care of the boxes for coins and for the grow-bigger mushrooms. If
    you take a look in the levelConf setup we added in the beginning, you’ll see entries
    for coin and mushroom “question boxes”. The only real difference between the two
    is the final tag, which marks which surprise box should release. We also have
    definitions for an empty box (!), the coin (c), and the mushroom (M).


