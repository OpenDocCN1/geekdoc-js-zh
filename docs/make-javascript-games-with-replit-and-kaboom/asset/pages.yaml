  md: "# Building Snake in Kaboom.js\n\n```\nlet food = null;\nfunction respawn_food(){\n\
    \  let new_pos = rand(vec2(1,1), vec2(13,13));\n  new_pos.x = Math.floor(new_pos.x);\n\
    \  new_pos.y = Math.floor(new_pos.y);\n  new_pos = new_pos.scale(block_size);\n\
    }\n\nif (food) {\n  destroy(food);\n  food = add({\n    rect(block_size,block_size),\n\
    \    color(0,255,0),\n    pos(new_pos),\n    area(),\n    \"food\"\n  });\n}\n\
    ```\n\nFirstly, we set up a variable food so that we can keep track of food objects\
    \ we create. You can move this variable to where we declared other variables,\
    \ like block_size and snake_body if you want to keep them all nearly in the same\
    \ place.\nThen the function respawn_food does a few things. In the game of snake,\
    \ once a food is eaten, another appears at a random location on the grid. We'll\
    \ need a random generator to determine the location to place the food. Kaboom.js\
    \ has a function called rand which we can use to find a random position on the\
    \ screen to place the food. Conveniently, the rand function can return 2D vectors\
    \ as the start and end for the random range to generate numbers in, and then return\
    \ another 2D vector as a result.\nWhy do we choose a range of 1-13 for the random\
    \ position of the food? If you look at the map we added earlier, it is 14 spaces\
    \ across and 14 spaces down. The dimensions of our screen in grid blocks. We don't\
    \ want to draw over the boundaries, we use 1-13 blocks within the map. Now, the\
    \ rand function returns real numbers, with decimals, not integers. This means\
    \ we need to add Math.floor to truncate decimals off the random numbers, as we\
    \ don't want to place the food halfway through a particular grid block. We also\
    \ need to convert from our grid-coordinates to regular screen pixels. This is\
    \ done by multiplying each co-ordinate by the block_size, which specifies the\
    \ size of each grid block in pixels. We make use of the Kaboom.js scale method\
    \ on the vec2 class to perform the multiplication.\nThe next part of the function\
    \ checks if the food variable already contains an existing object. If it\n\n>\
    \ https://kaboom.js/doc/#rand\nhttps://kaboom.js/doc/#vec2"
