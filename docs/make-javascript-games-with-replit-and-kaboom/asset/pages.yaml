  md: "# Building a Mario-like side-scroller with Kaboom.js\n\n![](img/e909780a5f974ff614ba5223d44aa19b_164_0.png)\n\
    \n# Enemies-index\n\nWe can swap out the animation that is played when the enemy\
    \ is patrolling this frame. Kaboom has a built in `lifespan` component that also\
    \ has a fade function. This component allows us to slowly fade the squashed enemy\
    \ from scene and then automatically remove entirely once the specified lifetime\
    \ is reached. Kaboom also allows us to dynamically add and remove components from\
    \ characters using the `use` and `unset` methods. These methods are not yet documented,\
    \ but you can find them (and more tricks!) by looking at the Kaboom source code\
    \ here. Let's use this knowledge to build a custom component to handle the enemy\
    \ squashed and fading out of the scene:\n\n```\nfunction enemy() {\n  return {\n\
    \    id: \"enemy\",\n    require: [\"pos\", \"area\", \"sprite\", \"patrol\"],\n\
    \    isAlive: true,\n    update() {\n\n},\n    squash() {\n      this.isAlive\
    \ = false;\n      this.unset(\"patrol\");\n      this.stop();\n      this.frame\
    \ = 2;\n      this.area.width = 16;\n      this.area.height = 8;\n      this.use(lifespan(0.5,\
    \ { fade: 0.1 }));\n    }\n  };\n}\n```\n\nWe define the custom component as we\
    \ did before. Because we need to stop the enemy from patrolling, we require the\
    \ `patrol` custom component. We also require the `sprite` component so we can\
    \ stop the animation and set the squashed enemy to display. The `area` component\
    \ is necessary, as the squashed enemy is half the height of the regular enemy\
    \ (8 pixels vs 16 pixels). We're going to adjust the height of the area so that\
    \ the collision zone the enemy occupies after squash is correct.\n\n> [33]https://kaboomjs.com/#lifespan\n\
    [34]https://github.com/replit/kaboom\n[35]https://kaboomjs.com/#sprite\n[36]https://kaboomjs.com/#area"
  merge: -1
