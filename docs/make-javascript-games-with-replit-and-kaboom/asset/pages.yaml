  md: "# Building a pseudo-3D game in Kaboom\n\n```\n{\n  bulletSpeed: -1*BULLET_SPEED,\n\
    \  targetPos: BULLET_VANISHING_POINT\n});\n```\n\n```\nplay(\"shoot\", {\n  volume:\
    \ 0.2,\n  detune: rand(-1200, 1200),\n});\n```\n\nWhen the player fires, we use\
    \ the spawnBullet function to create a new set of laser bullets. To make it seem\
    \ as though they're coming from under the spaceship each other, we calculate our\
    \ bullets' starting positions a quarter way from each side of the screen and a\
    \ third of the way using the multipliers 0.25 and 0.33 respectively.\n\nThen we\
    \ calculate where the bullets to end. This is the same position as the cross hairs.\
    \ Using these values, we create 2 bullet objects - simple 1 pixel with the tag\
    \ bullet and color to set (255,0,0) so they look menacing. We also add custom\
    \ properties to the object: A speed for the bullet to move out, and at the vanishing\
    \ point where its course ends.\n\nAs a final detail, we set our \"shoot\" to play\
    \ as each bullet is created, adjusting the volume and applying a randomly generated\
    \ detune value so that the pitch of the sound is different each time it's played.\n\
    \nWe've got our bullets, their sounds and their trajectories, so let's make them\
    \ go from their origin to the vanishing point at the cross hairs by moving them\
    \ with each frame:\n\n```\nonUpdate(\"bullet\", (b) => {\n  const m = (b.pos.y\
    \ - b.targetPos.y) / (b.pos.x - b.targetPos.x);\n  const c = b.targetPos.y - m*(b.targetPos.x);\n\
    \n  let newX = b.pos.x + b.bulletSpeed;\n  let newY = m * newX + c;\n  b.pos.x\
    \ = newX;\n  b.pos.y = newY;\n  // Remove the bullet once it has hit the vanishing\
    \ point y line\n  if ((b.pos.y < SCREEN_HEIGHT*0.33)) {\n    destroy(b);\n  }\n\
    });\n```"
