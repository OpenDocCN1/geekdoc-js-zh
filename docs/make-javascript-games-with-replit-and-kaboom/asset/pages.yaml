    First, we create a constant object defining the direction our game allows. Then
    we create a variable to track the current_direction the spaceship is facing.


    Then we add the key-handling code. The key names left and right refer to the left
    and right arrow keys on the keyboard. Kaboom provides the onKeyDown¹ event, which
    lets us know if a certain key is being pressed. We create onKeyDown event handlers
    for each of the arrow keys. As long as the given key is held down, onKeyDown calls
    the event handler repeatedly.


    The code inside each onKeyDown event does the following:


    +   - The flipX function mirrors the player''s spaceship image so that it looks
    depending on the direction it is facing. We use -1 to flip it and 1 for right.

    - The function player.angle slightly tilts the spaceship while the key is being
    held down is so the spaceship looks like it is about to move in the given direction.

    - The current_direction tracking variable is updated. We''ll use this variable
    when we add shooting.

    - The move function moves the spaceship in the given direction.


    We also have onKeyUp event handlers for the left and right keys. These reset the
    spaceship''s tilt to 0 (i.e. straight up) when the ship is not moving in direction.


    Now we want to have the spaceship fly up when we press the up arrow key. To do
    this, we''ll take advantage of Kaboom''s jump¹¹ attribute (which is part of the
    body¹¹ component) and repurpose it for flying up. The following code to the main
    scene:


    ```

    1 onKeyDown("up", () => {

    2 player.jump(100);

    3 });

    ```


