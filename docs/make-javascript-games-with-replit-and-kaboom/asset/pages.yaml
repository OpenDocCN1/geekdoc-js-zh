  md: "# Building a pseudo-3D game in Kaboom\n\n```\nfunction shiftAliens(x,y){\n\
    \  aliens.forEach((alien) => {\n    alien.xpos += x / (alien.zpos*0.01);\n   \
    \ alien.ypos += y / (alien.zpos*0.01);\n  });\n}\n```\n\n```\nfunction shiftStars(x,y){\n\
    \  stars.forEach((star) => {\n    star.xpos += x *0.01;\n    star.ypos += y *0.01;\n\
    \  });\n}\n```\n\nThese 2 functions take x and y values for the amount we want\
    \ to \"move\" by, and use those to move the aliens and the stars. In each case,\
    \ we loop through the arrays holding the alien or star game objects. We make some\
    \ adjustments to the values supplied to the functions to account for the perception\
    \ that, when we move, objects further away appear to move \"less\" than objects\
    \ close to us. In the case of the stars, we are all in the far distance, so we\
    \ scale the movement by a constant factor. In the case of the aliens, some are\
    \ far away, while others are right up the spaceship. To account for this variance,\
    \ we adjust the amount to move an alien by a factor related to its distance from\
    \ us, or zpos. Aliens close will appear more than those far away.\n\nNow we can\
    \ add some event handlers for keyboard input:\n\n```\nconst MOVE_DELTA = 2000;\n\
    \nKeyDown(\"left\", () => {\n  const delta = MOVE_DELTA * dt();\n  shiftAliens(delta,\
    \ 0);\n  shiftStars(delta*0.01, 0);\n  camRot(-5.7);\n});\n\nKeyDown(\"right\"\
    , () => {\n  const delta = -1 * MOVE_DELTA * dt();\n  shiftAliens(delta, 0);\n\
    \  shiftStars(delta*0.01, 0);\n  camRot(-5.7);\n});\n```"
