  md: '# Adding scenes


    Scenes³''⁸⁵ are like different stages in a Kaboom game. There are generally three
    scenes in games:


    +   - The intro scene, which gives some info and instructions, and waits for the
    player to press “start”.

    - The main game, which we play.

    - An endgame, or game over scene, which gives the player their score or overall
    result, and allows them to start again.


    ![](img/e909780a5f974ff614ba5223d44aa19b_184_0.png)


    For this tutorial, we’ll omit the intro scene, since we already know what Flappy
    bird is and how to play it, but you can add your own intro scene later!


    Let’s add the code for defining each scene:'
  merge: -1
  pgno: 184
- img_proc: true
  md: "```\nscene(\"game\", ()) => {\n  // todo.. add scene code here\n});\n```\n\n\
    ```\nscene(\"gameover\", (score) => {\n  // todo.. add scene code here\n});\n\
    ```\n\ngo(\"game\")\n\nNotice the gameover scene definition, we add a custom parameter,\
    \ score. This is so that we can pass the player's final score to the game scene\
    \ to display it.\n\nTo start the whole game, we use the go function, which switches\
    \ between scenes.\n\n# Building the game world\n\nNow that we have the main structure\
    \ and overhead functions out of the way, let's start adding in the characters\
    \ that make up the Flappy world. In Kaboom, characters are anything that makes\
    \ up the game world, including floor, platforms, etc., and not only the players\
    \ and bots. They are also known as \"game objects\"\n\nWe'll start the background,\
    \ using the .bg image we added earlier. Add this code to the game scene:\n\n```\n\
    add([\n  sprite(\"bg\", {width: width(), height: height()})\n]);\n```\n\nHere\
    \ we use the add function to add a new character to the scene. The add function\
    \ takes an array of components that we can use to give each game character special\
    \ properties. In Kaboom, every character is made of one or more components. There\
    \ are built-in components for many properties, like sprite which gives the character\
    \ an avatar; body which makes the character respond to gravity; and solid, which\
    \ makes the character solid, so other characters cannot move through it."
  merge: -1
  pgno: 185
- img_proc: true
  md: "# Building Flappy Bird in Kaboom.js\n\nThe background we doesn't need to do\
    \ much, just stay in the back and look pretty, we only use the sprite component,\
    \ which displays an image. The sprite component takes the name of the sprite,\
    \ which we used when we loaded the sprite earlier, and optimally, the width and\
    \ height that it should be displayed at the screen. When we want the background\
    \ to cover the whole screen, we need to set the width and height of the sprite\
    \ to the width and height of the game we are running in. Kaboom provides the width()\
    \ and height() functions to get the window dimensions.\n\nIf you press the \"\
    Run\" button at the top of your repl now, you should see the background of the\
    \ Flappy world come up in the output section of the repl:\n\n![](img/e909780a5f974ff614ba5223d44aa19b_186_0.png)\n\
    \nGreat! Now let's add in the Flappy Bird. Add this code to the game scene:\n\n\
    ```\nconst player = add([\n  // list of components\n  sprite(\"birdy\"),\n  scale(2),\n\
    \  pos(80, 40),\n  area(),\n  body(),\n]);\n```\n\nWe use the add function we\
    \ for adding the background. This time, we grab a reference, const player, to\
    \ the returned game object. This is so we can use this reference later when checking\
    \ collisions, or flipping up when the player taps the space bar.\n\n> https://kaboom.com/#sprite\n\
    https://kaboom.com/#width\nhttps://kaboom.com/#height\nhttps://kaboom.com/#add"
