  md: "# Build a Physics playground with Kaboom.js\n\n```\nfunction checkCollisionLine(line,\
    \ tag) {\n  collision = get(tag).some((object) => {\n    return rectLine(object.worldArea())\
    \ && line;\n  });\n\n  return collision;\n}\n```\n\ncheckCollisionLine() function\
    \ tests whether an object with a given tag intersects with a line. We do this\
    \ by getting all objects with the tag^{51} and testing each one until we find\
    \ a collision. some()^{52} method will stop executing until a single true is returned,\
