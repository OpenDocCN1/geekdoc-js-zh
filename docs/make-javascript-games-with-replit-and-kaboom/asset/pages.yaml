    #  Creating the spaceship’s movement controls


    Our basic game world is up and running, now let''s add some controls so we can
    move around in it. We''ll allow a few different moves for the spaceship: bank
    left or right, and fly up or down.


    Consider for a moment how the spaceship moves through the game world. We can''t
    move the cockpit left or right, up or down - it would just disappear off the screen.
    One way of simulating movement from the point of view of the cockpit is to keep
    it stationary and move all the other game elements.


    To achieve this, let’s add some helper functions to move the game objects. Here’s
    the code:'
