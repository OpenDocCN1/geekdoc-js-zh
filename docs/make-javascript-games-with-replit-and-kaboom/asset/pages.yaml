  md: "# Building Asteroids in Kaboom.js\n\nScenes are further divided into layers,\
    \ which are populated by game objects (also called sprites). The layer object\
    \ is on determine when it gets drawn and which objects can collide. In this game,\
    \ we'll use three layers: the background layer (bg), the object layer (obj), and\
    \ UI layer (ui). To initialize these layers, add the code to the bottom of the\
    \ main.js file:\n\n```\nscene(\"main\", () => {\n  layers(\n    \"bg\",\n    \"\
    obj\",\n    \"ui\"\n  ));\n  // add more scene code here\n});\n```\n\nOn the first\
    \ line we define the main scene, and then we declare the game layers. These layers\
    \ will be drawn in the order. The majority of gameplay will happen in the obj\
    \ layer, so we've set as the default layer. Any objects we create will be placed\
    \ in this layer, unless we specify a different layer when we create the object.\n\
    \n> **Note:** The code snippets that follow should be added within the body of\
    \ the main scene unless specified otherwise.\nThe bg layer will be drawn first,\
    \ beneath everything else, and we'll use that to specify a background image for\
    \ our game. Do that now by adding the following code to within the body of the\
    \ main scene.\n\n```\n// Background\nadd([\n  sprite(\"space\"),\n  layer(\"bg\"\
    \n]);\n```\n\nWe're adding a very simple game object: the space sprite we uploaded\
    \ earlier on the background layer. Later game objects, such as the player's ship\
    \ and the asteroids, will be more complicated.\nThe final layer, ui, is where\
    \ we will display information such as the player's remaining lives and total score.\
    \ Let's draw the score now. First, we have to declare a global variable named\
    \ score, with the following line:\n\n```\nlet score = 0;\n```\n\nNow we'll create\
    \ an empty object on the UI layer, as follows:"
