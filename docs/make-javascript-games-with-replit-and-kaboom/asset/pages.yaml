  md: "Building a Mario-like side-scroller with Kaboom.js\n\n# Creating a custom component\n\
    \nTo add more abilities to the characters and features to the game, we'll use\
    \ components we create ourselves and add to our game objects. To define a new\
    \ component in Kaboom, we make a function that returns an object with few required\
    \ fields and methods. Here's a template to illustrate code for a custom component\
    \ (not part of the game code):\n\n```\nfunction customComponent(args) {\n  return\
    \ {\n    id: \"name\",\n    require: [\"component1\", \"component2\"],\n    add()\
    \ {\n    },\n    update() {\n    },\n  };\n};\n```\n\nIn the object we return,\
    \ Kaboom requires an id, which is a unique name for the component. Kaboom also\
    \ needs a require property, which is a list of other components this component\
    \ needs in order to work. When a component is first initialized on a game object,\
    \ Kaboom calls the add() method so we have the opportunity to run any setup code\
    \ we need. The method update() is called on every game frame, so we can make animation\
    \ and collision updates there.\n\nOne behavior we need is for the enemy characters\
    \ to walk up and down, instead of just standing in one place. Let's make a custom\
    \ component we can add to our enemy characters so that they automatically move\
    \ back and forth, or patrol their part of the level. Add the code below to the\
    \ bottom of main.js:\n\n```\nfunction patrol(distance = 100, speed = 50, dir =\
    \ 1) {\n  return {\n    id: \"patrol\",\n    require: [\"pos\", \"area\"],\n \
    \   startingPos: vec2(0, 0),\n    add() {\n    this.startingPos = this.pos;\n\
    \    this.on(\"collide\", (obj, side) => {\n      if (side === \"left\" || side\
    \ === \"right\") {\n        dir = -dir;\n      }\n    });\n    },\n  };\n}\n```"
