  md: "# Building Asteroids in Kaboom.js\n\nWe want the asteroid to be in an \"initializing\"\
    \ state while we're finding its starting position. When we implement its actions\
    \ later on, we'll check the value of its initializing property to prevent it from\
    \ forming the player or affecting other asteroids while it's spawning.\n\nBefore\
    \ we move on, let's implement the asteroidSpawnPoint() function. Adding the following\
    \ code near the top of the main scene, just before the pointAt():\n\n```\nfunction\
    \ asteroidSpawnPoint() {\n  // spawn randomly at the edge of the scene\n  return\
    \ choose([rand(vec2(0,0)), vec2(width(),0)),\n    rand(vec2(0,height())), vec2(width(),height)),\n\
    \    rand(vec2(0,height())), vec2(width(),height()))]);\n}\n```\n\nThis function\
    \ uses Kaboom's choose()*81 and rand()*82 functions to choose a random location\
