  md: "# Building Snake in Kaboom.js\n\n```\nlet move_delay = 0.2;\nlet timer = 0;\n\
    onUpdate(() => {\n  if (run_action) return;\n  timer += dt();\n  if (timer < move_delay)\
    \ return;\n  timer = 0;\n}\n\nlet move_x = 0;\nlet move_y = 0;\n\nswitch (current_direction)\
    \ {\n  case directions.DOWN:\n    move_x = 0;\n    move_y = block_size;\n    break;\n\
    \  case directions.UP:\n    move_x = 0;\n    move_y = -1*block_size;\n    break;\n\
    \  case directions.LEFT:\n    move_x = -1*block_size;\n    move_y = 0;\n    break;\n\
    \  case directions.RIGHT:\n    move_x = block_size;\n    move_y = 0;\n    break;\n\
    }\n\n// Get the last element (the snake head)\nlet snake_head = snake_body[snake_body.length\
    \ - 1];\n\nsnake_body.push(add(\n  rect(block_size,block_size),\n  pos(snake_head.pos.x\
    \ + move_x, snake_head.pos.y + move_y),\n  color(0,0,255),\n  area(),\n  \"snake\"\
    \n]));\n\nif (snake_body.length > snake_length) {\n  let tail = snake_body.shift();\
    \ // Remove the last of the tail\n```"
