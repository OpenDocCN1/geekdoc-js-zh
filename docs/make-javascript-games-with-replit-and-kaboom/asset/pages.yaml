- img_proc: true
  md: "# Building Snake in Kaboom.js\n\nIn the callback function, we immediately set\
    \ the `run_action` flag to false. This is so that the code in the move loop does\
    \ not run and create the appearance of the snake stuck in the wall. Then the code\
    \ calls a cool Kaboom.js effect function `shake()`, which \"shakes\" the screen\
    \ in a way that makes it feel like the snake has crashed heavily, and communicates\
    \ quite effectively that the game is over. Finally, we call `respawn_all` to reset\
    \ all the game objects.\n\nWe can use the same code to detect if the snake has\
    \ hit itself – we just replace the `wall` tag with another snake tag:\n\n```\n\
    javascript\nonCollide(\"snake\", \"snake\", (s, t) => {\n  run_action = false;\n\
    \  shake(12);\n  respawn_all();\n});\n```\n\nRunning the game now, and crashing\
    \ into the wall should look something like this:\n\n> ^29}https://kaboomjs.com/doc/shake"
