    # Initializing Kaboom


    In the "main" code file, delete all the example code. Now we can add reference
    to Kaboom, and initialize it:


    ```

    import kaboom from "kaboom"


    kaboom();

    ```


    Let’s import the game assets (graphics and sound). We can use Kaboom’s loadSpriteᵇ³⁸³
    and loadSoundᵇ³⁴ functions:


    +   - loadSprite("birdy", "sprites/birdy.png")

    - loadSprite("bg", "sprites/bg.png")

    - loadSprite("pipe", "sprites/pipe.png")

    - loadSound("woosh", "sounds/woooosh.mp3")


    The first argument in each load function is the name we want to use to refer to
    the asset later on in our code. The second parameter is the location of the asset
    file.


    > ᵇ³⁸²https://docs.replit.com/images/tutorials/35-flappy-bird/upload-sprites.gif

