  md: "# Building tic-toe-toe with WebSocket Kaboom.js\n\n```\nsocket.on('gameState',\
    \ function(state) {\nfor (let index = 0; index < state.board.length; index++)\
    \ {\n  const player = state.board[index];\n  if (player != null) {\n    boardSquares[index].textBox\
    \ = player.symbol;\n  } else {\n    boardSquares[index].textBox = '';\n  }\n}\n\
    \nstatusLabel.text = '';\nswitch (state.result.status) {\n  case Statuses.WAITING:\n\
    \    statusLabel.text = 'Waiting for players...';\n    break;\n  case Statuses.PLAYING:\n\
    \    statusLabel.text = state.currentPlayer.playerName + ' to play';\n    break;\n\
    \  case Statuses.DRAW:\n    statusLabel.text = 'Draw! \\nPress R for rematch';\n\
    \    break;\n  case Statuses.WIN:\n    statusLabel.text = state.result.winner.playerName\
    \ + ' Wins! \\nPress R for rematch';\n    break;\n}\n\nplayerOneLabel.text = '';\n\
    playerTwoLabel.text = '';\nif (state.players.length > 0) {\n  playerOneLabel.text\
    \ = state.players[0].symbol + ': ' + state.players[0].playerName\n}\n\nif (state.players.length\
    \ > 1) {\n  playerTwoLabel.text = state.players[1].symbol + ': ' + state.players[1].playerName\n\
    }\n});\n```"
