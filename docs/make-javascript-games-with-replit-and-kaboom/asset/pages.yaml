  md: "# Making Flappy fly\n\nOur next task is to save Flappy from plummeting to their\
    \ death by giving control to the player to flap Flappy's wings. We will use the\
    \ space for this. Kaboom has an onKeyPress¹ function, which fires a callback with\
    \ custom code when the specified key is pressed. Add this code to the game scene\
    \ to make Flappy fly when the space key is pressed:\n\n```\nonKeyPress(\"space\"\
    , () => {\n  play(\"woosh\");\n  player.jump(400);\n});\n```\n\nIn the callback,\
    \ we first play² a sound of flapping wings to give the player feedback and add\
    \ some interest to the game. Then we use the jump³ method, which is added to our\
    \ player character through the body⁴ component we added earlier. The jump function\
    \ makes a character accelerate sharply. We can adjust just how and high the jump\
    \ should be through the number we pass as an argument to the jump method—the larger\
    \ the number, the higher the jump. Although Flappy is technically not jumping\
    \ (you normally need to be on a solid surface to jump), it still has the effect\
    \ we need.\n\nUpdate the game output window, and if you press the spacebar now,\
    \ you'll be able to keep Flappy in the air! Remember to quickly click in the output\
    \ window as the game starts, so that it can detect player input such as pressing\
    \ the space key.\n\n> ¹https://kaboomjs.com/#onKeyPress\n²https://kaboomjs.com/#play\n\
    ³https://kaboomjs.com/#body\n⁴https://kaboomjs.com/#body"
