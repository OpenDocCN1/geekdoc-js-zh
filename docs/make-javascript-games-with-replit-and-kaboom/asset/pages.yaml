  md: '# Building Snake in Kaboom.js


    The first line we import the kaboom library, and then initialize the context by
    calling kaboom(). This will give us a blank canvas with a nice checkerboard pattern.
    Then we create a constant for the size of each block on our grid. This is just
    so we don''t need to keep typing in the number, and also helps if we want to experiment
    with different block sizes.


    Then we create the game map. The map, or level design, is expressed in an array
    of strings. Each row in the array represents one row on the screen. So, we can
    design visually in text what the map should look like. The width and height parameters
    specify the size of each of the elements in the map. The pos parameter specifies
    where on the screen the map should be place – we choose (0,0), which is the top
    left of the screen, the starting point for the map.


    Then Kaboom.js allows us to draw for each symbol in the text map. We''re only
    using one symbol here, but you can make maps out of many different elements –
    e.g., a symbol for a wall, for water, a symbol for a health kit and so. To tell
    Kaboom.js what to draw for the symbol, we add the symbol as a key, as =, and then
    specify parameters for it. In this code, we draw a red rectangle as piece of the
    boundary wall. The area() component generates the collision area which will be
    useful when we want to check for collision between the snake and wall later on.
    The string wall assigns a tag to each of the pieces of wall drawn, which will
    also help us with collision detection later on.


    If we run this code, we should see the outline of a red square on the screen,
    representing the map.'
