  md: "# Build a Physics playground with Kaboom.js\n\n```\n// gravity gun launch\n\
    onMousePress(\"left\", () => {\n  rangeList = get(\"movable\").filter((element)\
    \ => {\n    return element.held;\n  });\n  if (rangeList.length) {\n    selected\
    \ = rangeList[0]; // ist for now\n    selected.held = false;\n    selected.direction\
    \ = raddeg(-player.aimAngle);\n    selected.speed = player.firepower;\n  }\n});\n\
    ```\n\nThis code is largely similar to the dropping code, but instead of specifying\
    \ a drop timeout, we give the previously held object a direction and a speed.\
    \ The direction will be the player's aimAngle, which we need to convert to degrees^455\
    \ for Kaboom. The speed will be the firepower value we defined in our gravitygun()\
    \ module.\n\nRestart your reel and play with picking up, dropping and launching\
    \ crates. Some odd behavior you may notice is that objects launched straight will\
    \ tend to slide along the ceiling for a while they bleed their speed. We can prevent\
    \ this by adding the following code to kill a movable object's speed on collision\
    \ with a wall:\n\n```\nonCollide(\"movable\", \"wall\", (a, b) => {\n  a.speed\
    \ = 0;\n});\n```\n\n# Object collisions\n\nOur physics playground wouldn't be\
    \ complete without collisions between objects, let's add some simple code to make\
    \ objects push each other. Add the following collision handler to the bottom of\
    \ your file:\n\n> ^455https://kaboomjs.com/#raddeg"
