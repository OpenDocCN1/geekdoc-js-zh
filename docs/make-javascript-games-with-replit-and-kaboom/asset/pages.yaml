  md: '# Build a Physics playground with Kaboom.js


    In this tutorial, we will be building a simple physics playground with Kaboom.js*42*.
    This will be a 2D side-view platformer in which the player can use a gravity gun*43
    to pick up and shoot objects in the world, similar to games like Half-Life 2 and
    Rochard.


    ![](img/e909780a5f974ff614ba5223d44aa19b_198_0.png)


    The finished game


    Click to open gif*44


    By the end of this tutorial, you will:


    +   - Familiar with advanced usage of the Kaboom JavaScript game development framework.

    - Be able to build a simple 2D physics engine.

    - Have the basis for a physics-based platformer, which you can extend to a full
    game.


    # Getting started


    Log into your Replit*45 account and create a new repl. Choose Kaboom as your project
    type. This needs a repl name, like "gravity".


    > *42https://kaboom.com/

    *43https://en.wikipedia.org/wiki/Gravity_gun

    *44https://docs.replit.com/images/tutorials/36-physics-playground/gameplay

    *45https://replit.com'
