  md: '# Building tic-tac-toe with WebSocket and Kaboom.js


    This function looks quite long, but it''s mainly updating the text boxes we added.


    First, we loop through the board positions array that is passed from the server
    on the state payload, to check each block for a player positioned on it. If there
    is a player on a block, we write that player''s symbols to the corresponding text
    box, finding in the boardSquares array we created above. If there is no player
    in the block, i.e a null value, we write an empty string to the text box.


    Then we update the statusLabel to show what is currently happening in the game.
    We use a switch^1 statement to create logic for each of the possibilities. We
    use a different message to the statusLabel text box depending on the status, drawing
    from data in the gameState object.


    Next we update the player name text boxes. We reset them, in case one of the players
    has dropped out. Then we update the text boxes with the players'' symbols and
    names. Note that we first check if there are the corresponding players in the
    array.


    Now that we''re done with updating from the game state, let''s try running the
    game again. Open the game window in a new tab so that requests to the repl server
    don''t get blocked by the browser due to the CORS header ''Access-Control-Allow-Origin''
    not matching in the embedded window.


    ![](img/e909780a5f974ff614ba5223d44aa19b_139_0.png)


    Open in new tab


    Make sure the server is also running, and enter your name. You should see something
    like this:


    > ^1https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/switch'
