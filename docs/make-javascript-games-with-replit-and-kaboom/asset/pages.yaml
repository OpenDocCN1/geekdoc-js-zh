  md: "# Building pseudo-3D game in Kaboom\n\nOutside the function, we make use of\
    \ the Kaboom loop203 functionality to call the spawnAlien function to create new\
    \ aliens at regular intervals.\n\n# Moving the alien bugs\n\nNow we need to have\
    \ the aliens we generated move with each frame. Here's the code:\n\n```\nonUpdate(\"\
    alien\", (alien) => {\n  alien.zpos -= alien.speed * dt();\n\n  alien.scale =\
    \ 2 - (alien.zpos * 0.0022);\n\n  const centerX = SCREEN_WIDTH * 0.5;\n  const\
    \ centerY = SCREEN_HEIGHT * 0.25;\n\n  alien.pos.x = centerX + alien.xpos * (alien.zpos\
    \ * 0.0001);\n  alien.pos.y = centerY + alien.ypos * (alien.zpos * 0.0001);\n\n\
    \  if (alien.zpos <= 1) {\n    destroyAlien(alien);\n  }\n});\n\nfunction destroyAlien(alien)\
    \ {\n  aliens = aliens.filter(a => a != alien);\n  destroy(alien);\n}\n```\n\n\
    First we add a new event handler to the onUpdate204 event, and filter for any\
    \ objects tagged alien. The onUpdate event handler is fired for each frame. In\
    \ this event handler, we adjust the zpos of the alien to 'move' closer to the\
    \ screen. We use the dt()205 function to get the time from the last frame, together\
    \ with the speed per second we assign to the alien when we constructed it, to\
    \ calculate the alien's new zpos in our 3D coordinate system. We translate that\
    \ value to coordinates, and인지 the z-axis position by adjusting the size, or scale,\
    \ of the alien sprite.\n\nRemember that screen coordinates starts with (0,0) in\
    \ the top left corner of the screen, and our 3D coordinate system starts with\
    \ (0,0) in the 'center' of the system. To translate between the two systems, we\
    \ need to find the center of the screen so that we can center the 3D system over\
    \ it. We do this by\n\n> 203https://kaboomjs.com/doc/#loop\n204https://kaboomjs.com/doc/#onupdate\n\
    205https://kaboomjs.com/doc/#dt"
  merge: -1
