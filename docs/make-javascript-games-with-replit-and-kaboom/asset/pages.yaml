  md: '# Building a pseudo-3D game in Kaboom


    ```

    1 const BULLET_SLACK = 10;

    2 onCollide("alien","bullet", (alien, bullet)) => {

    3   if (bullet.y SCREEN_HEIGHT+0.33 + BULLET_SLACK) return;

    4   makeExplosion(bullet.pos, 5, 5, 5);

    5   destroy(alien);

    6   destroy(bullet);

    7 };

    ```


    We make use of the Kaboom event onCollide²⁶⁸ which is fired when 2 game objects
    are overlapping or touching each other. We pass the tags for the aliens and bullets,
    so we know when they collide.


    We want to limit bullet hits to be only around the target area, so that the 3D
    perspective is kept. But because they could collide at any point along the path
    the bullet takes, we check if the collision has taken place at the cross hairs
    area. Then, if it is in the target zone, we remove both the bullet and the alien
    from the scene, and call a function to create explosion effect. This is the same
    code used in the 2D Space Shooter tutorial²⁷.


    ```

    function makeExplosion(p, n, size) {

    for (let i = 0; i < n; i++) {

    wait(rand(n * 0.1), () => {

    for (let i = 0; i < 2; i++) {

    add([

    pos(p.add(rand(vec2(-rad), vec2(rad))),

    rect(1, 1),

    scale(1 * size, 1 * size),

    lifespan(0.1),

    origin("center")

    ]);

    });

    });

    }

    ```


    ```

    function lifespan(time) {

    let timer = 0;

    return () {

    update();

    timer += dt();

    if (timer >= time) {

    destroy(this);

    }

    }

    ```


    > ²⁶⁸https://kaboomjs.com/doc/#onCollide

    ²⁷https://docs.replit.com/tutorials/24-build-space-shooter-with-kaboom'
