    Kaboom makes good use of JavaScript''s support for callbacks instead of loops
    to read keyboard input and if game objects have called, Kaboom uses an event model
    that tells us when these events have happened. We can then write callbacks functions
    to act on these events.


    Aoom game is made up of "scenes", which are like levels, or different parts and
    stages of a game. Scenes have multiple "layers", allowing us to have game backgrounds,
    main objects (like the player, bullets, enemies, etc.), and UI elements (like
    the current score, health, etc.).


