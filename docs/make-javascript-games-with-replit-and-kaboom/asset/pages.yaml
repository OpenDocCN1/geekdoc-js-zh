  md: "# Build a Physics playground with Kaboom.js\n\n```\n// // camera follow player\n\
    player.onUpdate(() => {\n  camPos(player.pos);\n});\n```\n\nThis code will run\
    \ every frame**** and keep the camera focused on the player as they move around.\n\
    Refresh your in-repl browser and try it out.\n\n# Pulling objects with the gravity\
    \ gun\n\nNow that we've got our generic platformer functionality implemented,\
    \ it's time to add the gravity gun. The player will aim their gravity gun with\
    \ the mouse. It will have a range, which we'll show as a line. Moving objects\
    \ that fall into that range will have a thicker outline drawn around them. When\
    \ the player holds the right mouse button, objects in range will travel towards\
    \ them, until they reach the end of a secondary, \"holding\" range. Objects in\
    \ the holding range will move with the player until the left mouse button is clicked,\
    \ at point they will be launched into the air. Alternatively, the player can click\
    \ the right mouse button to drop the held object.\n\nIn the code above, weve implemented\
    \ horizontal movement (walking) and vertical movement (jumping). Implementing\
    \ our gravity gun will require us to implement movement at arbitrary angles. To\
    \ end this, we will need to write a couple of helper functions. To the top of\
    \ the page, and add the following code beneath the kaboom(); line:\n\n```\n//\
    \ helper functions\nfunction angleBetween(p1, p2) {\n  return Math.atan2(p2.y\
    \ - p1.y, p2.x - p1.x);\n}\n\nfunction pointAt(distance, angle) {\n  return vec2(distance*Math.cos(angle),\n\
    \  -distance*Math.sin(angle));\n}\n```\n\nThe first function, angleBetween(),\
    \ uses JavaScript's Math.atan2()*** to determine the angle two points make with\
    \ horizontal. The second function, pointAt(), uses sines and cosines to determine\
    \ the point at a certain distance and angle.\nNext, we'll add two custom components:\n\
    \n+   - gravitygun(), which will define attributes and functions for our player's\
    \ gravity gun.\n\n> https://kaboom.js/#onl/update\nhttps://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/atan2"
