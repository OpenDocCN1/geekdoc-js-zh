  md: "# Building Flappy Bird in Kaboom.js\n\nheight()/2 + offset PIPE_GAP/2\nKaboom\
    \ has an origin#8 component that sets the point character uses as origin. This\
    \ is toplendefault, which works well for our lower pipe, as our calculations above\
    \ are calculating for that point. For the upper pipe, our calculations are for\
    \ the bottom of the pipe. Therefore, we can use the origin#10 component to specify.\n\
    \nSince we want the pipes to come from the right of the screen towards the left,\
    \ where Flappy is, we'll set their X-position to be the width()#9 of the screen.\n\
    \nTo identify and query the pipes, use the text tag \"pipe\" to them.\nFinally,\
    \ since we need to create many pipes during the game, let's wrap all the pipe\
    \ code in a function that we will be able to call at regular intervals to make\
    \ the pipes.\n\nHere is the code from all these considerations and calculations.\
    \ Insert this code to the game scene:\n\n```\nconst PIPE_GAP = 120;\n\nfunction\
    \ producePipes(){\n  const offset = rand(-50, 50);\n\n  add([\n    sprite(\"pipe\"\
    ),\n    pos(width(), height()/2 + offset + PIPE_GAP/2),\n    \"pipe\",\n    area(),\n\
    \  ]);\n\n  add([\n    sprite(\"pipe\", {flipY: true}),\n    pos(width(), height()/2\
    \ + offset - PIPE_GAP/2),\n    origin(\"botleft\"),\n    area(),\n  ]);\n}\n```\n\
    \nNow we need to do a few more things to make the pipes appear and move.\nMove\
    \ the pipes across the screen, we can use the onUpdate#11 function to update all\
    \ pipes' positions with each frame. Note that we need to adjust the x position\
    \ of the pipe. Add this code to the game scene of your code:\n\n+   #8https://kaboomjs.com/origin\n\
    #10https://kaboomjs.com/origin\n#9https://kaboomjs.com/width\n#11https://kaboomjs.com/onupdate"
  merge: -1
  pgno: 191
- img_proc: true
  md: "# Building Flappy Bird in Kaboom.js\n\n```\nonUpdate(\"pipe\", (pipe) => {\n\
    \  pipe.move(-160, 0);\n});\n```\n\nNext we'll generate pipes at a steady rate.\
    \ We can use the loop⁴¹² function for this. Add the following to the game scene\
    \ part of the code:\n\n```\nloop(1.5, () => {\n  producePipes();\n});\n```\n\n\
    This calls our producePipes() function every 1.5 seconds. You can adjust this\
    \ rate, or make it variable to increase the rate as the game progresses.\n\nUpdate\
    \ the game output now and you should see the pipes being generated and moving\
    \ across the screen. You can also fly Flappy, although crashing into the pipes\
    \ does nothing for now.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_192_0.png)\n\
    \nClick to open gif⁴¹³\n\n\n\nFlappy is flapping and the pipes are piling on.\
    \ The next task is to detect when Flappy flies past a pipe, increasing the player's\
    \ score.\n\n⁴¹²https://kaboomjs.com/#loop\n⁴¹³https://docs.replit.com/images/tutorials/35-flappy-bird/moving-pipes.gif"
  merge: -1
  pgno: 192
- img_proc: true
  md: "# Adding in scoring\n\nWhen Flappy flies past a pipe, the player's score is\
    \ incremented. To do this, we'll need to keep track of which pipes have gone past\
    \ Flappy. Let's modify the pipe-generating function producePipes to add a custom\
    \ property passed to the pipes. It should look like this now:\n\n```\nfunction\
    \ producePipes(\n  const offset = rand(-50, 50);\n  add([\n    sprite(\"pipe\"\
    ),\n    pos(width(), height()) / 2 + offset + PIPE_GAP / 2,\n    \"pipe\",\n \
    \   area(),\n    {passed: false}\n  ]);\n  add([\n    sprite(\"pipe\", { flipY:\
    \ true }),\n    pos(width(), height()) / 2 + offset - PIPE_GAP / 2,\n    origin(\"\
    bottomleft\"),\n    \"pipe\",\n    area(),\n  ]);\n)\n```\n\nNext, we'll add a\
    \ variable to track the score, and a text element to display it on screen. Add\
    \ this code to the game scene:\n\n```\nlet score = 0;\nconst scoreText = add([\n\
    \  text(score, {size: 50}),\n]);\n```\n\nNow we can add the onUpdate() event handler\
    \ we created earlier for moving the pipes. We'll check if any pipes have moved\
    \ past Flappy, and update their passed flag, so we don't count them more than\
    \ once. We'll only add the passed flag to one of the pipes, and detect it, so\
    \ as not to add a point for both the upper and lower pipe. Update the onUpdate\
    \ handler as follows:"
  merge: -1
  pgno: 193
- img_proc: true
  md: "# Building Flappy Bird in Kaboom.js\n\n```\nonUpdate(\"pipe\", (pipe) => {\n\
    \  pipe.move(-160, 0);\n\n  if (pipe.passed === false && pipe.pos.x < player.pos.x)\
    \ {\n    pipe.passed = true;\n    score += 1;\n    scoreText.text = score;\n \
    \ }\n});\n```\n\nThis checks any pipe that we haven't marked as passed (passed\
    \ === false) to see if it has passed Flappy (pipe.pos.x < player.pos.x). If the\
    \ pipe has gone past, we add 1 to the score and update the score text onscreen.\n\
    \nIf you update the game output window now, you should see the score increase\
    \ as you you fly past pipe.\n\n![](img/e909780a5f974ff614ba5223d44aa19b_194_0.png)\n\
    \nScore increasing\n\nClick to open gif⁴\n\n# Collision detection\n\nNow that\
    \ we have scoring, the last thing to do is collision detection – that is, checking\
    \ if Flappy has splatted into a pipe. Kaboom has a collides¹⁵ method that is added\
    \ with the area¹⁶ collider\n\n+   ¹⁵https://docs.replit.com/images/tutorials/35-flappy-bird/score-increase.gif\n\
    ¹⁶https://kaboom.js/#onCollide\n¹⁷https://kaboom.js/#area"
  merge: -1
  pgno: 194
- img_proc: true
  md: "# Building Flappy Bird in Kaboomjs\n\ncomponent. We can use that to call a\
    \ function when the player collides with any character with the \"pipe\" tag.\
    \ Add this code to the game scene:\n\n```\nplayer.collides(\"pipe\", ()) => {\n\
    \  go(\"gameover\", score);\n});\n```\n\nIn the collision handler, we use the\
    \ go^41 function to switch to the gameover scene. We don't have anything in there\
    \ yet, so let's update to show a game over message and the score. We can also\
    \ keep track of the high score to compare the player's latest score. Update the\
    \ gameover scene as follows:\n\n```\nlet highScore = 0;\nscene(\"gameover\", (score)\
    \ => {\n  if (score > highScore) {\n    highScore = score;\n  }\n\n  add([\n \
    \   text(\nn      \"gameover!\\n\"\n      + \"score: \" + score\n      + \"\\\
    nhigh score: \" + highScore,\n      {size: 45}\n    )\n  ]);\n});\n\nonKeyPress(\"\
    space\", () => {\n  go(\"gameover\");\n});\n```\n\nFirst, create a highScore variable\
    \ where we can track the top score across multiple game plays. In, our gameover\
    \ scene, we check if the latest score passed in is bigger than the highScore we\
    \ recorded. If it, the highScore is updated to the latest score.\n\nTo show a\
    \ \"game over\" message, and the player's score along with the high score, we\
    \ use the add^38 function to add a text^41 component to a new game object or character.\
    \ We also make the font size large-ish for this message.\n\n> ^41https://kaboomjs.com/#go\n\
    ^38https://kaboomjs.com/#add\n^41https://kaboomjs.com/#text"
  merge: -1
