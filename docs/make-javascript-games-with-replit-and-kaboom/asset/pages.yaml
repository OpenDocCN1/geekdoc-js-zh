  md: "# Build a Physics playground with Kaboom.js\n\n+   - rect()³35, which draws\
    \ a rectangle to represent the object.\n- color()³36, which gives the rectangle\
    \ color.\n- area()³37, which provides collision detection for the object.\n- solid()³38,\
    \ which will prevent other objects from moving past it.\n\nWe've given the object\
    \ tag \"wall\". Objects have multiple tags, which can be used to define custom\
    \ behavior, such as collision detection between objects with particular tags.\n\
    \nNext, let's look at the crate definition:\n\n```\n\"#\": () => [ crate\n  rect(32,\
    \ 32),\n  color(RED),\n  z(1),\n  outline(1),\n  origin(\"center\"),\n  area(),\n\
    \  body(),\n  \"movable\"\n];\n```\n\nCompared to our wall, we've given the crate's\
    \ z-order⁴⁰, ensuring it will be drawn on top of walls.\n\n+   - outline()⁴¹,\
    \ which will draw a single-pixel outline around the object.\n- origin()⁴², which\
    \ sets the sprite's origin to \"center\", so that we can move it around its center,\
    \ rather than the default top-left corner.\n- body()⁴³, which makes our crate\
    \ subject to gravity.\n\nWe've given it the tag \"movable\", a generic tag we\
    \ can use for all objects that can be manipulated by the player's gravity gun.\n\
    \nFinally, let's look at the player object:\n\n> ³⁵ https://kaboomjs.com/#rect\n\
