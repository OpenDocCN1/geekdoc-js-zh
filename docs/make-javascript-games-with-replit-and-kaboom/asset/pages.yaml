  md: "# Build a Physics playground with Kaboom.js\n\nNow let's have the gravity pull\
    \ objects in range when the player holds down the right mouse button. Add the\
    \ following code below the line where you assigned movable.inHold in the body\
    \ of the onUpdate event callback:\n\n```\n// gravity gun pull\nif (isMouseDown(\"\
    right\")) {\n  if (movable.inHold) {\n    movable.held = true;\n  }\n  else if\
    \ (movable.inRange) {\n    movable.moveTo(player.holdLine.p2);\n  }\n}\n```\n\n\
    If the object is in holding range, we set held to true. If the object is in pulling\
    \ range, we move it into holding range. We use the moveTo() function, provided\
    \ by the pos() component, without a speed argument. This means the object will\
    \ teleport to the specified position.\n\nNext, we'll handle holding objects once\
    \ they've been pulled. Add the following code beneath the code you added:\n\n\
    ```\n// gravity gun hold\nif (movable.held) {\n  movable.moveTo(player.holdLine.p2);\n\
    }\n```\n\nThis code will ensure that objects stay in the holding position when\
    \ held, so the player will be able to move them around in an arc.\n\nFinally,\
    \ we'll need to move our object after it's been launched. Add the following code\
    \ below the lines you added above:\n\n```\n// gravity gun launch\nmovable.moveBy(dir(movable.direction).scale(movable.speed));\n\
    movable.speed = Math.max(0, movable.speed - 1); //friction\n```\n\nWhen we launch\
    \ an object, we'll give it a direction and a non-zero speed. We use moveBy(),\
    \ provided by the pos() component, to move the object unless there other solid\
    \ objects in the way. To give the object a more natural movement arc, we will\
    \ simulate friction by decreasing its speed every frame until it reaches zero.\n\
    \nRun your repl now and try out the gravity gun. You should be able to pull crates\
    \ into the holding position, and then move them around your head."
