    \  go(\"start\");\n    } else {\n      go(\"game\", nextLevel);\n    }\n  });\n\
    });\n```\n\nFirst, we freeze Mario so the player can't control him anymore. Then\
    \ we add³368 our \"Well Done!\" text³370 message to the center of the screen.\
