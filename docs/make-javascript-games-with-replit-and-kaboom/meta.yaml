  md: "# Build a Physics playground with Kaboom.js\n\nWe'll fix the first bug by adding\
    \ a new, collision-aware movement function to our physics() component. Find the\
    \ component definition and append the function to the object it returns, just\
    \ below the draw() function definition:\n\n```\nmoveToNoCollide() {\n    const\
    \ diff = dest.sub(this.pos);\n    return this.moveBy(diff.unit().scale(diff.len()));\n\
    }\n```\n\nThis function calculates the movement vector needed to move from the\
    \ current position to the destination, and passes this vector to the collision-aware\
    \ function moveBy(). Our moveBy() function will return a Collision object if it\
    \ detects a collision while moving. We'll return this and use it to cancel the\
    \ hold if certain conditions are met.\n\nFind the (movable.held) block in your\
    \ onUpdate(\"movable\") event callback and alter it to match the code:\n\n```\n\
    // gravity gun hold\nif (movable.held) {\n    col = movable.moveToNoCollide(player.holdLine.p2);\n\
    \    if (col.target.is(\"player\")) { // disregard player collisions\n       \
    \ movable.moveTo(player.holdLine.p2);\n    } else\n        movable.held = false;\n\
    \    }\n}\n```\n\nWe've replaced moveTo() with moveToNoCollide(), and we're doing\
    \ some checks on the collision object returned. If it is the player, we ignore\
    \ it and move the object back to the hold position. Otherwise, we cancel the hold.\n\
