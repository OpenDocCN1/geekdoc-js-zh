    \ onKeyRelease(\"right\", ()=>{\n35   camRot(0);\n36 });\n```\n\nBecause we are\
    \ moving the aliens and stars to make it appear as if the spaceship is moving,\
    \ these elements must move in the opposite direction to that of the arrow key\
    \ being used. When we use the key to move the spaceship, our scene moves to the\
    \ right. We use the Kaboom onKeyDown^218 and onKeyRelease^219 to attach event\
    \ handlers for direction controls to the arrow keys on the keyboard. In each the\
    \ onKeyDown event handlers, we get the time elapsed from the last frame by calling\
    \ the dt()^217 function, and multiply it by const MOVE_DELTA, representing the\
    \ amount to move by each second. For the right and up keys, our elements move\
    \ left and down respectively, so we make the amount to move negative - recall\
    \ that we are moving the objects in our 3D coordinate system. We then call the\
    \ helper functions we defined above to move the objects in the x and y dimensions.\n\
    \nIn the event handlers for left and right keys, we also make use of the Kaboom\
    \ camRot^216 effect. This effect rotates all objects by the amount, giving us\
    \ the perception of spaceship banking hard while turning. We add two additional\
    \ event handlers on onKeyRelease^219 for the left and right keys to reset the\
    \ rotation when the player stops turning.\n\nGive the game a run, and you should\
    \ be able to control the spaceship.\n\n> ^218https://kaboomjs.com/doc/onKeyDown\n\
