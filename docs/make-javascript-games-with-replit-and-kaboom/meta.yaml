  md: '# Building Asteroids in Kaboom.js


    Kaboom replies are quite different from other kinds of replies you may have seen
    before: instead of dealing directly with files in folders, you will be dealing
    with scenes, sounds and sprites.


    Before we start coding, we need to upload our sprites and sounds. Download this
    ZIP file⁵ and extract it on your computer. Click the "Files" icon on the sidebar,
    upload everything in Sounds folder to the "sounds" section of your repl, and everything
