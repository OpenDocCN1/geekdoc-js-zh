  md: "# Building a Mario-like side-scroller with Kaboom.js\n\nLet's create a component\
    \ that makes the box jump up and fall back down when it is headbutted. We can\
    \ also re-use it on the coin to make it flip as it's bumped out of the box. We'll\
    \ call this new component bump:\n\n```\nfunction bump(offset = 8, speed = 2, stopAtOrigin\
    \ = true) {\n  return {\n    id: \"bump\",\n    require: [\"pos\"],\n    bumpOffset:\
    \ offset,\n    speed: speed,\n    bumped: false,\n    origPos: 0,\n    direction:\
    \ -1,\n    update() {\n      if (this.bumped) {\n        this.pos.y = this.pos.y\
    \ + this.direction * speed;\n        if (this.pos.y < this.origPos - this.bumpOffset)\
    \ {\n          this.direction = 1;\n        }\n        if (stopAtOrigin && this.pos.y\
    \ >= this.origPos) {\n          this.pos.y = this.origPos;\n          this.direction\
    \ = -1;\n        }\n      }\n    },\n    bump() {\n      this.bumped = true;\n\
    \      this.origPos = this.pos.y;\n    }\n  };\n}\n```\n\nThis looks a bit more\
    \ complicated than our other custom components, but that's only because it has\
    \ code for the object moving in both directions. First off, we have a few parameters\
    \ when creating this component:\n\n+   - offset is how far we want the object\
    \ to be bumped before settling down again.\n- speed is how fast we want it to\
    \ move when bumped.\n- stopAtOrigin specifies whether we want the object to return\
    \ to its original position after being bumped, or just keep falling down - if\
    \ this parameter is false, then bumping the object will make it look like it got\
    \ dislodged and it will fall down."
