  md: "# Building Asteroids in Kaboom.js\n\nWe want the asteroid to be in an \"initializing\"\
    \ state while we're finding its starting position. When we implement its actions\
    \ later, we'll check the value of its initializing property to prevent it from\
    \ harming the player or affecting other asteroids while it's spawning.\n\nBefore\
    \ we move on, let's implement the asteroidSpawnPoint() function. Adding the following\
    \ code near the top of the scene, just before the pointAt() function\n\n```\n\
    function asteroidSpawnPoint() {\n  // spawn randomly at the edge of the scene\n\
    \  return choose([rand(vec2(0,0)), vec2(width(), 0)),\n    rand(vec2(0,height())),\
    \ vec2(width(), height)),\n    rand(vec2(0,height())), vec2(width(), height()))]);\n\
    }\n```\n\nThis function uses Kaboom's choose()*81 and rand()*82 functions to choose\
    \ a random location on the edge of the scene to spawn an asteroid.\n\n# Collisions\n\
    \nIf you've seen any movies set out space, you'll know that the main asteroids\
    \ do crash into spaces and each other, even the real-life asteroid belt*83 in\
    \ our solar system is not nearly enough for asteroid collisions to be a frequent\
    \ occurrence.\n\nThere are three types of collisions we need to account for:\n\
    \n+   - Player and asteroid, which damages the player, causing them to lose a\
    \ life.\n- Bullet and asteroid, which destroys the asteroid.\n- Asteroid and asteroid,\
    \ which causes both to bounce off each other.\n\nLet's go through the code for\
    \ each of these, adding it to our main scene just below the code we wrote make\
    \ objects wrap around the screen. First, player and asteroid:\n\n```\n// Collisions\n\
    onCollide(\\(\"player\", \"asteroid\", (p, a) => {\n  if (!a.initializing) {\n\
    \    p.lives--;\n  }\n});\n```\n\nThis code reduces the player's lives by as long\
    \ as the asteroid is not initializing.\n\nNext, add the code for collisions between\
    \ a bullet and an asteroid:\n\n*81 https://kaboomjs.com/doc/echoose\n*82 https://kaboomjs.com/doc/rand\n\
    *83 https://en.wikipedia.org/wiki/Asteroid_belt"
