    Ok, back to looking at the code we added and what it does. First, we define a
    new scene^311 like we did for the start scene. This time, we specify a parameter
    levelNumber that can be passed to the scene. We give this parameter a default
    value of 0. This will be the first level in our LEVELS array - remember, arrays
    start at index 0, so level 0 is level 1. This parameter will let us call the same
    scene again when we get to the end of the level, but with 1 as the parameter so
    that we can play the next level. You can specify any parameters like or need when
    creating a scene, and you can pass values from one scene to another, for example
    if you want to pass the player score to an end game, or pass player options from
    the start scene.


    Next, we define layers^312. Layers allow us to have backgrounds that don''t affect
    the game - we call that layer. We place all the main game objects (like our hero,
    his enemies, and any other objects he interacts with) on the game layer, and all
    the UI elements (like current score, health, etc.) on the ui layer. We make the
    default layer, so if we don''t specify a component on a game object, it will be
    drawn on the game layer.


    In the next line of code, we initialize and create the level by calling the addLevel^313
    function. We pass in the level in the LEVELS array, using the index from the levelNumber
    parameter we


