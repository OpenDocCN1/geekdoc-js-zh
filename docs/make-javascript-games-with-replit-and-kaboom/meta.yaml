  md: "```\nlayers({\n  \"bg\",\n  \"obj\",\n  \"ui\",\n  \"obj\\n});\n```\n\nThe\
    \ obj layer is set as the default layer and that's where the game action will\
    \ take place. We'll use the bg layer to draw the star field, as we don't interact\
    \ with the objects on that layer. Then we'll use the ui layer to draw fixed foreground\
    \ objects, the cockpit of the spaceship the player is travelling in.\n\n# # Creating\
    \ alien bugs\n\nAs in the 2D version of this game¹⁹⁸, the point of our game is\
    \ to avoid and shoot down exploding alien bugs. This time, instead of the bugs\
    \ coming from the left and right of the screen, we'll make it appear as though\
    \ they are coming toward the player \"inside\" the screen.\n\nTo create this effect,\
    \ we'll start by making the alien bugs small and spread out over the screen, and\
    \ have them get bigger and loom toward the center of the screen as they get closer.\n\
    \nWe need a 3D coordinate system to work out how our elements should move. We'll\
    \ create a system like the one in the image below, with 0 for all three dimension\
    \ axes in the center. This is how we'll track the movements of the aliens in code.\
    \ When we draw them to the screen, we'll convert these coordinates into the 2D\
    \ screen coordinate system.\n\n>"
