  md: "# Building Asteroids in Kaboom.js\n\nlike Snake Pacman is quite straightforward.\
    \ The directional movement we need for Asteroids\n(commonly called tank controls⁷⁰)\
    \ is more complex, requiring some calculations.\n\nAt a high level, we want to\
    \ move a given distance (player.speed) in a given direction (player.angle).\n\
    as a first step, let's create an onUpdate callback for our mobile tag. This code,\
    \ like our UI\ncode above, will be run by every object with the \"mobile\" tag\
    \ on every frame of the game, so we\ncan use it for more than just the player\
    \ object. Add the following code at the bottom of your main\nscene:\n\n```\n//\
    \ Movement\nonUpdate(\"mobile\", (e) => {\n  e.move(pointAt(e.speed, e.angle));\n\
    });\n```\n\nFirst, we move our object, using the pointAt(), which takes a speed\
    \ and an angle and\nreturns the corresponding X and Y coordinates as a vec⁷¹ Kaboom's\
    \ 2D vector type. This\ndata type is provided by Kaboom specifically for working\
    \ with X and Y coordinates, and comes with\na number of useful functions, such\
    \ as addition and subtraction.\n\nNow we need to create the pointAt() function.\
    \ Before we jump into the code, let's think about the\nproblem. Our movement can\
    \ be drawn as an angle on a plane, and its X and Y coordinates as\nhizontal and\
    \ vertical lines connected to it, giving us a right-angled triangle.\n\n![](bbox=[0.339,\
    \ 0.527, 0.66, 0.693])\n\nTriangle\n\nWe know the values of the triangle's angles:\
    \ one is 90 degrees, and the other two are equal\nto player.angle. The length\
    \ of the triangle's hypotenuse (the red line in the diagram above) is\nplayer.speed:\
    \ this is the distance our ship will be traveling.\n\nWe now need to calculate\
    \ the lengths of the other two sides to get the X and Y values for our\nmovement\
    \ vector. We can do this using the trigonometric sine and cosine functions⁷²,\
    \ like so:\n\n> ⁷⁰https://en.wikipedia.org/wiki/Tank_controls\n⁷¹https://kaboomjs.com/doc/#vec2\n\
    ⁷²https://www2.clark.edu/faculty/djJoyce/trig/formulas.html"
  merge: -1
  pgno: 42
- img_proc: false
  md: "# Building Asteroids in Kaboom.js\n\n+   1 sine(angle) = y / distance\n2 y\
    \ = distance * sin(angle)\n3\n4 cosine(angle) = x / distance\n5 x = distance *\
    \ cos(angle)\n\nRemember, in Kaboom and take the ship for a spin. You should be\
    \ able to2D game development platforms, the Y axis is inverted, so we have to\
    \ negate it. Add the `pointAt()` function below, at the top of the main scene\
    \ code.\n\n```\nfunction pointAt(distance, angle) {\n  let radians = -1*deg2rad(angle);\n\
    \  return vec2(distance * Math.cos(radians), -distance * Math.sin(radians));\n\
    }\n```\n\nYour repl now will be able to thrust forward and backward, moving toward\
    \ where the ship's nose is pointing.\n\nThere's one little problem though: too\
    \ long, and you'll fly off the screen. In any other game, we might solve that\
    \ by enclosing the play area with walls, but that doesn't seem right in the infinite\
    \ expanse of space. The original Asteroids solved this by having the player and\
    \ other keys wrap around the screen, i.e. appear at the bottom after going over\
    \ the top, or at the left edge after going past the right edge. Let's implement\
    \ now, using the \"wraps\" tag we added to our player when we created it. Add\
    \ the following code to the top of your main scene:\n\n```\n// Wrap around the\
    \ screen\nonUpdate(\"wraps\", (e) => {\n  if (e.pos.x > width()) {\n    e.pos.x\
    \ = 0;\n  }\n  if (e.pos.x < 0) {\n    e.pos.x = width();\n  }\n  if (e.pos.y\
    \ > height()) {\n    e.pos.y = 0;\n  }\n  if (e.pos.y < 0) {\n    e.pos.y = height();\n\
    \  }\n});\n```\n\nThis is a fairly straightforward piece of code that checks whether\
    \ an object's position is outside of the room and, if so, places it on the other\
    \ side. The `width()`73 and `height()`74 functions are Kaboom built-ins that return\
    \ the size of the game canvas. Run your repl now and try it out.\n\n> ^73https://kaboomjs.com/doc/#width\n\
    74https://kaboomjs.com/doc/#height"
  merge: -1
  pgno: 43
