  md: 'Building a pseudo-3D game in Kaboom


    # Game design


    Here''s what we want from this game:


    +   - A sense of depth to give the illusion of 3D

    - The feeling of freedom of movement throughout space


    We''ll make use of Kaboom''s scale component¹⁹⁰ to achieve the sense of depth,
    representing sprites as smaller if they are meant to be further away, and larger
    when they are closer. We''ll create a feeling of moving through space using an
    algorithm to generate a star field, like the early Windows screensavers.


    # Creating a new project


    Head over to Replit¹¹⁹¹ and create a new repl. Choose **Kaboom** as your project
    type. Give this repl a name, like "3D Space Shooter".


    ![](bbox=[0.119, 0.466, 0.88, 0.755])


    Creating a new repl


    After the repl has booted up, you should see a `main.js` file under the "Code"
    section. This is where we''ll start coding.


    > ¹⁹⁰https://kaboomjs.com/doc/#scale

    ¹¹⁹https://replit.com'
