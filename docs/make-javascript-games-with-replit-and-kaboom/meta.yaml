  md: '# Adding scenes


    Scenes<sup>385</sup> are like different stages in a Kaboom game. There are generally
    three scenes in games:


    +   - The intro scene, which gives some info and instructions, and waits for the
    player to press "start"

    - The main game, where we play.

    - An endgame, or game over scene, which gives the player their score or overall
    result, and allows them to start again.


    ![](bbox=[0.367, 0.3, 0.632, 0.743])


    For this tutorial, we''ll omit the intro scene, since we already know what Flappy
    bird is and how to play it, but you can add your own intro scene later!


    Let''s add the code for defining each scene:'
