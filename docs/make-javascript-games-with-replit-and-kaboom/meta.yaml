  md: "# Building tic-tac-toe with Kaboom.js\n\n```\nconst winPatterns = [\n  [0,\
    \ 1, 2],\n  [3, 4, 5],\n  [6, 7, 8],\n  [0, 3, 6],\n  [1, 4, 7],\n  [2, 5, 8],\n\
    \  [0, 4, 8],\n  [2, 4, 6]\n]\n```\n\nNow that we have each winning pattern in\
    \ an array, we can loop through each of them to see if there is a player that\
    \ positions match any of the patterns.\n\nSince the players are also in an array\
    \ in gameState.players, we can loop through that array, and check each player\
    \ against the winning pattern. If a player matches any of these patterns, we can\
    \ change the game status to WIN and set that player as the winner in the results.\n\
    \nHere is the code to do that:\n\n```\nfunction checkEndOfGame(){\n  // Check\
    \ for a win\n  gameState.players.forEach(player => {\n    winPatterns.forEach(seq\
    \ => {\n      if (gameState.board[seq[0]] == player\n        && gameState.board[seq[1]]\
    \ == player\n        && gameState.board[seq[2]] == player){\n        gameState.result.status\
    \ = Statuses.WIN;\n        gameState.result.winner = player;\n      }\n    });\n\
    \  });\n\n  // Check for a draw\n  if (gameState.result.status != Statuses.WIN)\
    \ {\n    const emptyBlock = gameState.board.indexOf(null);\n    if (emptyBlock\
    \ == -1) {\n      gameState.result.status = Statuses.DRAW;\n    }\n  }\n}\n```\n\
    \nWe also check for a draw in this function. A draw is defined as when all the\
    \ blocks are occupied (no more moves can be made), but no player has matched one\
    \ of the winning patterns. To check if there are"
