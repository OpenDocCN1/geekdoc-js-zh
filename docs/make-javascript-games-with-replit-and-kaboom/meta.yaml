  md: "# Building a Mario-like-scroller with Kaboom.js\n\nlevelConf setup we created\
    \ earlier. Now create a collision handler in the game scene between Mario and\
    \ the enemy, so we know when it gets squashed:\n\n```\nlet canSquash = false;\n\
    player.onCollide(\"badGuy\", (baddy)) => {\n  if (baddy.isAlive == false) return;\n\
    \  if (canSquash) {\n    // Mario jumped on the bad guy:\n    baddy.squash();\n\
    \  }\n  } else {\n    // Mario has been hurt. Add logic here later...\n  }\n});});\n\
    ```\n\nIn this, we check if the player, Mario, collides with a badGuy - which\
    \ is the tag we gave to the enemies in the levelConf setup. Then attach our handler,\
    \ which takes the body character Mario collided with. First check if the body\
    \ is still alive - if not we leave, as there is no real interaction between Mario\
    \ and a dead enemy. Then, we check the canSquash variable - if it is set to true,\
    \ that means Mario has jumped onto the enemy. In this case, we call the squash\
    \ method, which we created in the custom component for the enemy. This will execute\
    \ all the logic we added, and \"kill\" the enemy. We leave a bit of room in the\
    \ handler to come back and add logic to Mario the enemy without jumping on it\
    \ - we'll add that in later.\n\nModify the onKeyPress for the space key as follows:\n\
    \n```\nonKeyPress(\"space\", () => {\n  if (player.grounded()) {\n    player.jump();\n\
    \    canSquash = true;\n  }\n});\n```\n\nHere, we set the canSquash variable to\
    \ true to allow the player to squash the enemy if the player has jumped over it\
    \ upon collision.\n\nAdd the following code to the player.onUpdate handler:\n\n\
    ```\nif (player.grounded()) {\n  canSquash = false;\n}\n```\n\nThis code will\
    \ reset the canSquash variable so that the player will not squash the enemy if\
