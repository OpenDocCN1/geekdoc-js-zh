    22 });\n23 \n24 onKeyDown(\"down\", () => {\n25   const delta = -1 * MOVE_DELTA\
    \ * dt(\\);\n26   shiftAliens(0, delta);\n27   shiftStars(0, delta*0.01);\n28\
