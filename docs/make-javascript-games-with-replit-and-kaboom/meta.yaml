    - The player attempting to make the move must be the currentPlayer, i.e. the player\
    \ whose turn it is to go.\n\nIf these conditions are met, we find the player in\
    \ the gameState.players array using the built-in find28 method on arrays, looking\
    \ for the player by their socketId.\n\nNow we can check the board position (gridIndex)\
    \ requested by the player is available. We check that the value for position in\
    \ the gameState.board array is null, and if it is, we assign the player to it.\n\
    \nThe player has made a successful move, so we give the other player turn. We\
    \ switch the gameState.currentPlayer to the other player by using the array find29\
    \ method again, to get the player who does not match the current player.\n\nWe\
