  md: "# Adding in scoring\n\nWhen Flappy flies past a pipe, the player's score is\
    \ incremented. To do this, we'll need to keep track of which pipes have gone past\
    \ Flappy. Let's modify the pipe-generating function producePipes to add a custom\
    \ property passed to the pipes. It should look like this now:\n\n```\nfunction\
    \ producePipes() {\n  const offset = rand(-50, 50);\n\n  add([\n    sprite(\"\
    pipe\",\n    pos(width(), height()) / 2 + offset + PIPE_GAP / 2,\n    \"pipe\"\
    ,\n    area(),\n    {passed: false}\n  ]);\n\n  add([\n    sprite(\"pipe\", {\
    \ flipY: true }),\n    pos(width(), height()) / 2 + offset - PIPE_GAP / 2,\n \
    \   origin(\"bottomleft\"),\n    \"pipe\",\n    area(),\n  ]);\n}\n```\n\nNext,\
    \ we'll add a variable to track the score, and a text element to display it on\
    \ screen. Add this code to the game scene:\n\n```\nlet score = 0;\nconst scoreText\
    \ = add([\n  text(score, {size: 50})\n]);\n```\n\nNow we can modify the onUpdate()\
    \ event handler we created earlier for moving the pipes. We'll check if any pipes\
    \ have moved past Flappy, and update their passed flag, so we don't count them\
    \ more than once. We'll only add the passed flag to one of the pipes, and detect\
    \ it, so as not to add a point for both the upper and lower pipe. Update the onUpdate\
    \ handler as follows:"
  merge: -1
  pgno: 193
- img_proc: false
  md: "# Building Flappy Bird in Kaboomjs\n\n```\nonUpdate(\"pipe\", (pipe) => {\n\
    \  pipe.move(-160, 0);\n\n  if (pipe.passed === false && pipe.pos.x < player.pos.x)\
    \ {\n    pipe.passed = true;\n    score += 1;\n    scoreText.text = score;\n \
    \ }\n});\n```\n\nThis checks any pipe that we haven't marked as passed (passed\
    \ false == false) to see if it has passed Flappy (pipe.pos.x < player.pos.x).\
    \ If the pipe has gone past, we add 1 to the score and update the score text onscreen.\n\
    \nIf you update the game output window now, you should see the score increase\
    \ as you fly past pipe.\n\n![](bbox=[0.118, 0.398, 0.879, 0.706])\n\nScore increasing\n\
    \nClick to open gif¹14\n\n# Collision detection\n\nNow that we have scoring, the\
    \ last thing to do is collision detection – that is, checking if Flappy has splatted\
