  md: '# # Building tic-tac-toe with WebSocket and Kaboom.js


    Tic-tac-toe, or noughts and crosses, or Xs and Os, is a simple classic game for
    2 players. It''s usually played with paper and pen, but it also makes a good first
    game to write for networked multiplayer.


    In this tutorial, we''ll create a 2-player online tic-tac-toe game using a Node.js²²⁴
    server. Socket.IO²²⁴³ will enable realtime gameplay across the internet. We''ll
    use Kaboom.js to create the game interface.


