  md: "# Building Flappy Bird in Kaboom.js\n\nheight()/2 + offset - PIPE_GAP/2\n\n\
    Kaboom has an origin()#08 component that sets the point character uses as its\
    \ origin. This is toleft by default, which works for our lower pipe, as our calculations\
    \ above are calculating for that point. For the upper pipe, our calculations are\
    \ for the bottom of the pipe. Therefore, we can use the origin()#09 component\
    \ to specify that.\n\nSince we want the pipes to come from the right of screen\
    \ towards the left, where Flappy is, we'll set their X-position to the width()#010\
    \ of the screen.\n\nTo identify and query the pipes, let us add tag \"pipe\" to\
    \ them.\n\nFinally, since we need to create many pipes during the game, let's\
    \ wrap all the pipe code in a function that we will be able to call at regular\
    \ intervals to make the pipes.\n\nHere is the code from all considerations and\
    \ calculations. Insert this code to the game scene:\n\n```\nconst PIPE_GAP = 120;\n\
    \nfunction producePipes(){\n  const offset = rand(-50, 50);\n\n  add([\n    sprite(\"\
    pipe\\),\n    pos(width(), height()/2 + offset + PIPE_GAP/2),\n    \"pipe\",\n\
    \    area(),\n  ]);\n\n  add([\n    sprite(\"pipe\", {flipY: true}),\n    pos(width(),\
    \ height()/2 + offset - PIPE_GAP/2),\n    origin(\"bottomleft\"),\n    area(),\n\
    \  ]);\n}\n```\n\nWe need to do a few more things to make the pipes appear and\
    \ move.\n\nTo move the pipes across the screen, we can use the onUpdate()#011\
    \ to update all pipes' positions with each frame. Note that we need to adjust\
    \ the x position of the pipe. Add this code to the game scene of your code:\n\n\
    +   - [#08](https://kaboomjs.com/origin)\n- [#09](https://kaboomjs.com/origin)\
    \ (Note: link in text points to origin, but context suggests sequence)\n- [#010](https://kaboomjs.com/width)\n\
    - [#011](https://kaboomjs.com/onupdate)"
  merge: -1
  pgno: 191
