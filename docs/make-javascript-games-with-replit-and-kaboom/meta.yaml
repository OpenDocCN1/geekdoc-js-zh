    That looks like a lot, but it''s really one pattern repeated for each element.
    Let''s take it apart.


    The first 3 lines of the config set the default width and height of each element
    in the level maps. We use pos to specify where to position the whole map in the
    Kaboom canvas. This is normally going to be at (0,0), which is at the top of the
    screen.


    Next we have definitions for the symbols used in the map. Each definition is a
    function that returns an array of components. Components give special properties
    to each character. There are built-in components for many properties, sprite to
    give the character an avatar, body to make the character respond to gravity, solid
    to make the character solid so other characters can move through it, and many
    others.


    Kaboom allows you to write your own components to create any property or behavior
    you like for a character. The components patrol, mario, enemy and bump are all
    custom here. You''ll notice that those custom components are commented out (//),
    as we''ll need to create the implementations before we use them. We''ll do that
    later in this tutorial.


    # Adding a scene


    Kaboom *scenes allow us to group logic and levels together. In this game we''ll
    have 2 scenes:


    > 26*https://kaboom.com/doc/intro

    27*https://kaboom.com/#sprite

    28*https://kaboom.com/#body

    29*https://kaboom.com/#solid'
