    # Adding the Snake


    Now that we have a map, let''s add the snake. The snake is made up of a number
    of blocks moving together. We''ll need to keep track of these so that we can move
    them together, so an array¹¹² would be a good data structure to use here.


    We also need to start the snake off with a given size, position and direction
    to move in on the map. It can return to each time the game ends as well. So should
    make a function that we can call whenever a new game starts, or the old one ends,
    reset the snake to a default position and size.


    We''ll need to add a few variables and constants that our snake drawing function
    will use. Add these definitions above the const block_size = 20; we added earlier:


    > ¹²https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array'
