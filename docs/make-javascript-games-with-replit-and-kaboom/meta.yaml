    \ ended in a draw.\n- WIN: A player has won the game.\n\nNow let's add a game\
    \ state object to track everything:\n\n```\nlet gameState = {\n  board: new Array(9).fill(null),\n\
    \  currentPlayer: null,\n  players: [],\n  result: {\n    status: Statuses.WAITING\n\
    \  }\n}\n```\n\nFirst, we have a representation of the tic-tac-toe board as an\
    \ array with 9 elements. This is how the array elements are mapped to the board:\n\
    \n![](bbox=[0.222, 0.433, 0.777, 0.846])\n\nTic-Tac-Toe board mapped to array\
    \ indices"
