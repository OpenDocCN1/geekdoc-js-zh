  md: "# Build a Space Shooter with Kaboom.js\n\nis because it's more fun if the player\
    \ needs to bash the \"fire\" button as fast as possible to take down an enemy,\
    \ rather than just having automatic weapons.\n\nThe onPress handler calls the\
    \ spawnBullet function with the player's current position. This function handles\
    \ creating a new laser shot in the correct direction. The first few lines of the\
    \ method adjust the bullet's starting position to the left or the right of the\
    \ spaceship's position. This is because the position of the spaceship that gets\
    \ passed to the center of the spaceship (remember the origin component we added\
    \ to it earlier). We adjust it a little so that the bullet looks like it is coming\
    \ from the edge of the spaceship.\n\nWe then add a bullet object to the game using\
    \ the add118 function. We don't use a sprite for the bullet, but draw a rect119,\
    \ or rectangle, with any color. We tag it bullet so we can refer to it later when\
    \ detecting if it something. We also give it a custom property, bulletSpeed, which\
    \ is the distance and we want the bullet to move on each frame.\n\nFinally, we\
    \ add sound when the player shoots. The play120 function plays our \"shoot.wav\"\
    . We adjust the volume down a bit, so it fits better with the overall mix. We\
    \ use the tune parameter with a random number generator, rand121 to change the\
    \ pitch of the sound each time it's played. This is so the sound doesn't become\
    \ too repetitive and also makes it weird and \"spacey\".\n\nNow that we've set\
    \ the bullet we need to make it move on each frame. We can do this using onUpdate122\
    \ event, using the bullet tag to identify the objects we want to update:\n\n```\n\
    onUpdate(\"bullet\", b) => {\n  b.move(b.bulletSpeed, 0);\n  if ((b.pos.x < 0)\
    \ || (b.pos.x > MAP_WIDTH)) {\n    destroy(b);\n  }\n});\n```\n\nWith each frame,\
    \ the action event updates the objects with the matching tag, in this case bullet.\
    \ We call move123 on the bullet, using the custom value for bulletSpeed that we\
    \ assigned to it creation. We also check to see if the bullet has gone off the\
    \ screen, and if so, we destroy124 it.\n\nWe also need to destroy the bullet if\
    \ it hits a platform. We can do this using the Kaboom onDestroy125 event. Adding\
