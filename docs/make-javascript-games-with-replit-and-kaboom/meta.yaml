  md: "# Building a Mario-like side-scroller with Kaboom.js\n\nThe reason we make\
    \ the area box the height of the screen is make sure the player can't accidentally\
    \ jump over the ending point and fall off the edge of the level.\n\nNow let's\
    \ add our collision handler for the castle to the game scene:\n\n```\nplayer.on(\"\
    castle\", (castle, side) => {\n  player.freeze();\n  add({\n    text(\"Well Done!\"\
    , { size: 24 }),\n    pos(toWorld(vec2(160, 120))),\n    color(255, 255, 255),\n\
    \    origin(\"center\"),\n    layer('ui'),\n  });\n  wait(1, () => {\n    let\
