  md: '# # Building Flappy Bird in Kaboom.js


    Flappy Bird was a smash hit game for mobile phones back in 2013-2014. The inspiration
    behind the app was the challenge of bouncing ping pong ball on a paddle for as
    long as possible without letting it drop to the ground or shoot off into the air.
    At the peak of its success, the game creator unexpectedly removed it from all
    app stores, saying that he felt guilty that the game had become addictive for
    many people. In the wake of the removal, many clones were made to fill the gap
    left by the original Flappy Bird. After a few months, the original author released
    new versions of the game.


    Let''s take a trip back to 2014 and create our own clone of Flappy Bird using
    Kaboom! By remaking a game, you can not only learn how to make games, but also
    extend and change the game in any way you like.


    ![](bbox=[0.121, 0.413, 0.879, 0.725])


    [Click to open gif³⁷⁷](#)


    This article is based on video tutorial³⁷⁶, with a few small differences. Mainly,
    the Flappy assets (graphics and sound) are no longer available by default in Replit
    Kaboom asset library, but that''s OK because we''ve included them as a download
    here³⁷⁹ so you can still use them.


    > ³⁷⁶ https://docs.replit.com/images/tutorials/35-flappy-bird/game-play.gif

    ³⁷⁷ https://www.youtube.com/watch?v=hggeGcDh3XVU

    ³⁷⁹ tutorial-files/flappy-bird-kaboom/flappy-assets.zip'
