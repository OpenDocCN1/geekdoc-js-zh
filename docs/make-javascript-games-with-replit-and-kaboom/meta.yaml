  md: "# Building Snake in Kaboom.js\n\n```\nconst directions = {\n  UP: \"up\",\n\
    DOWN: \"down\",\nLEFT: \"left\",\nRIGHT: \"right\"\n};\n\nlet current_direction\
    \ = directions.RIGHT;\nlet run_action = false;\nlet snake_length = 3;\nlet snake_body\
    \ = [];\n```\n\nFirst, we define an object with properties for each of the allowable\
    \ directions the snake can move. This code checks and changes directions to be\
    \ easy to read and change, compared to just using numbers or strings to define\
    \ the directions. The variable current_direction tracks the snake is moving at\
    \ any given time. We choose a starting direction, RIGHT, as its default. run_action\
    \ is a variable that we'll use to keep if we are actual in the game, or setting\
    \ or ending the game. The variable snake_length keeps track of how long the snake\
    \ tail becomes - we start it at a chosen value of 3. Finally, snake_body holds\
    \ all the objects that make up the snake's body.\n\nNow we add a function to spawn,\
    \ and respawn, the snake.\n\n```\nfunction spawn_All(){\n  destroyAll(\"snake\"\
    );\n\n  snake_body = [];\n  snake_length = 3;\n\n  for (let i = 1; i <= snake_length;\
    \ i++) {\n    let segment = add(\n      rect(block_size,block_size),\n      pos(block_size,block_size\
    \ *i),\n      color(0,0,255),\n      area(),\n      \"snake\"\n    );\n    snake_body.push(segment);\n\
    \  }\n  current_direction = directions.RIGHT;\n}\n\nfunction respawn_all() {\n\
    ```"
