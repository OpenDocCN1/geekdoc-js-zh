    \ firepower) {\n  return {\n    id: \"gravitygun\",\n    require: [\"pos\"]\n\
    \  }\nn}\n```\n\nComponents are written as functions that return objects of a\
    \ specific format. Each component should have an id, and a list of components\
    \ it depends on attached to the require attribute. Beyond that, components can\
