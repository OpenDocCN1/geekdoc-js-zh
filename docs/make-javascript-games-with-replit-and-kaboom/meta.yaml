  md: 'Building Flappy Bird in Kaboom.js 184


    # Making Flappy fly


    Our next task is to save Flappy from plummeting to their death by giving control
    to the player to flap Flappy''s wings. We will use the spacebar for this. Kaboom
    has an onKeyPress\⁴⁰¹ function, which fires a callback with custom code when the
    specified key is pressed. Add this code to the game scene to make Flappy fly when
    the space key is pressed:


    ```

    1 onKeyPress("space", () => {

    2   play("woosh");

    3   player.jump(400);

    4 });

    ```


    In the callback handler, we first play⁴⁰² a sound of flapping wings to give the
    player feedback and add some interest to the game. Then we use the jump⁴⁰³ method,
    which is added to our player character through the body⁴⁰⁵ component we added
    earlier. The jump function makes a character accelerate sharply. We can adjust
    just how and high the jump should be through the number we pass as an argument
    to the jump method - the larger the number, the higher the jump. Although Flappy
    is technically not jumping (you normally need to be on a solid surface to jump),
    it still has the effect we need.


    Update the game output window, and if you press the spacebar now, you''ll be able
    to keep Flappy in the air! Remember to quickly click in the output window as the
    game starts, so that it can detect player input such as pressing the space key.


    ⁴⁰¹https://kaboomjs.com/#onKeyPress

    ⁴⁰²https://kaboomjs.com/#play

    ⁴⁰³https://kaboomjs.com/#jump

    ⁴⁰⁵https://kaboomjs.com/#body'
