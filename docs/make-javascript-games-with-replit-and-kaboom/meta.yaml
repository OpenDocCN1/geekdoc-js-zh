    # # Adding a star field


    Now that we have the aliens moving and coming at us, let’s add another element
    to give a further sense of depth and show that we are in outer space: the star
    field generator. We can implement the star field in a similar way as we did for
    the aliens’ movement. One difference will be that we will use color, or more specifically
    intensity instead of scaling to proxy for the z-axis. Another difference is that
    we’ll have the stars spread away from the center rather than towards it, as if
    the ship is going past them. This also makes it seem like we’re travelling at
    warp speed, which is cool.


