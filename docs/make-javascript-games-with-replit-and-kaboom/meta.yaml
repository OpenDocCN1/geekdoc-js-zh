  md: "# Building a pseudo-3D game in Kaboom\n\n```\nimport kaboom from \"kaboom\"\
    ;\nkaboom({\n  background: [0, 0, 0],\n  width: 320,\n  height: 200,\n  scale:\
    \ 2\n});\n```\n\nHere we import the library, and initialize the context by calling\
    \ kaboom({ ... }). We set the size of the view to 320x200 pixels and scale to\
    \ make the background twice the size on screen. Now, let's load the sprites and\
    \ sounds we need in this game. The code below loads each of the graphic elements\
    \ we use, and give them a name, so we can refer to them when we build the game\
    \ characters:\n\n```\nloadRoot(\"sprites/\")\nloadSprite(\"cockpit\", \"cockpit.png\"\
    )\nloadSprite(\"alien\", \"alien.png\")\n\nloadRoot(\"sounds/\")\nloadSound(\"\
    shoot\", \"shoot.wav\")\nloadSound(\"explosion\", \"explosion.wav\")\n```\n\n\
    The first line, loadRoot^195, specifies which folder to load all the sprites and\
    \ game elements from, so we don't have to keep typing it in each sprite. Then\
    \ each line loads a game sprite and gives it a name so we can refer to it in code\
    \ later. We use similar code to load the sounds we will need in this game, but\
    \ use loadSprite^196 we use loadSound^197 to load sounds.\n\n# Creating the interface\
    \ layers\n\nKaboom games are made of \"Scenes\", which are like levels, or different\
    \ parts and stages of a game. The IDE has a default \"main\" scene, we can use\
    \ for our main game code. Each scene has multiple \"Layers\", allowing us to have\
    \ backgrounds that don't affect the game, main game objects (like the player,\
    \ bullets, enemies, and so on), and UI elements (like the current score and health).\n\
    \nAdd the following code to the main.js file to create the 3 layers \"Background\
    \ (bg)\", \"Object (obj)\", \"User Interface (ui)\":\n\n> ^195https://kaboomjs.com/#loadRoot\n\
    ^196https://kaboomjs.com/#loadSprite\n^197https://kaboomjs.com/#loadSound"
