    \ called [rand](23) which we can use to find a random position on the screen to\
    \ place the food. We need both random x and y-coordinates -conveniently, the rand\
    \ function can return 2D vectors as the start and end for the random range to\
    \ generate numbers in, and then return another 2D vector as result.\n\nWhy do\
    \ we choose a range of 1-13 for the random position of the food? If you look at\
    \ the map added earlier, it is 14 spaces across and 14 spaces down. These are\
    \ the dimensions of our grid in blocks. We don't want to draw over the boundaries,\
    \ so we use 1-13 to keep blocks within the map. Now, the rand function returns\
    \ numbers with decimals, not integers. This means we need to add the Math.floor\
    \ to truncate decimals off the random numbers, as we don't want to place the food\
    \ halfway through a grid block. We also need to convert from our co-ordinates\
    \ to regular pixels. This is done by multiplying each co-ordinate by block_size,\
    \ which specifies the size of each grid block in pixels. We make use of the Kaboom.js\
    \ scale method[24] on the vec2 class to perform the multiplication.\n\nThe next\
