    \ 0, 0],\n  width: 240,\n  height: 275,\n  scale: 1.5\n});\n```\n\nHere we import\
    \ the kaboom library, and then initialize the context by calling kaboom({ ...\
    \ }).\nWe also set the size of the view to 440x275 pixels and scale the background\
    \ by a factor of 1.5 on screen.\nNow, let's load the sprites and sounds we will\
    \ need in this game. This code loads each of the\ng elements we use, and gives\
    \ them a name, so we can refer to them when we build the game\ncharacters:\n\n\
    ```\nloadRoot(\"sprites/\");\nloadSprite(\"stars\", \"stars.png\");\nloadSprite(\"\
    gem\", \"gem.png\");\nloadSprite(\"spaceship\", \"spaceship.png\");\nloadSprite(\"\
    alien\", \"alien.png\");\nloadRoot(\"sounds/\");\nloadSound(\"shoot\", \"shoot.wav\"\
