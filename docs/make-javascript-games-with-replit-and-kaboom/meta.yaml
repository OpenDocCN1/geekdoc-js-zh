  md: "# Building a pseudo-3D game in Kaboom\n\n```\nonKeyDown(\"space\", () => {\n\
    \  spawnBullet();\n});\n```\n\nHere we use onUpdate222 event handler, filtered\
    \ to bullet objects. we need to find the values for the slope (m) and y-intercept\
    \ (in this case, c) of the straight line between the bullet's current position\
    \ and its end position. Our first 2 lines of the function express these variable\
    \ parameters as formulas. Let's take a moment to see how we come to these formulas.\n\
    \nWe began with the equation for a straight line223:\n\n```\ny = m*x + c\n```\n\
    \nSince we have the x and y coordinates for the start and end of the trajectory,\
    \ we can use them to find the unknowns of m and c by solving simultaneous equations:\n\
    \n```\ny_start = m*x_start + c    (1)\ny_target = m*x_target + c    (2)\n```\n\
    \n```\nre-arranging (2):\nc = y_target - m*x_target\n```\n\n```\nSubstitute (2)\
    \ into (1) for c:\ny_start = m*x_start + (y_target - m*x_target)\ny_start - y_target\
    \ = m*x_start - m*x_target\nm = (y_start - y_target) / (x_start - x_target)\n\
    ```\n\nNow we can solve for c:\nc = y_target - m*x_target\n\nNow that we use m\
    \ and c as formulas, we use them in our code to calculate the parameters. Our\
    \ code goes to advance the bullet by the speed amount, and we can figure out the\
    \ new y position using the m and c values calculated with our new x position.\
    \ We then update the bullet's new position (pos) with these new values.\n\nWe\
    \ want the bullets to disappear once they hit the target at the vertical point,\
    \ so we go on to check if the bullet has crossed the horizontal axis. If it has,\
    \ we remove the bullet from the scene using the destroy224 function.\n\n+   222\
    \ https://kaboomjs.com/doc/onUpdate\n223 https://www.mathisfun.com/equation_of_line.html\n\
    224 https://kaboomjs.com/doc/#destroy"
