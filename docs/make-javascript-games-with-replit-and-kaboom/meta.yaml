  md: "# Building tic-tac-toe with WebSocket and Kaboom.js\n\n```\nio.on('connection',\
    \ function (connection) {\n  connection.on('addPlayer', (data)=>{\n    // some\
    \ code here\n  });\n\n  connection.on('action', (data)=>{\n    // some code here\n\
    \  });\n\n  // ... \n});\n```\n\nThis is convenient, especially when we have a\
    \ couple of handlers, each with only a small amount of code. It's also handy because\
    \ in each of the handler functions, you still have access to the connection object,\
    \ which is not passed on each event. However, it can get a little messy and unwieldy\
    \ if there are many event handlers, with complex logic in each.\n\nWe're doing\
    \ differently so that we can separate the handlers elsewhere in the code base.\
    \ We have one problem to solve: if they are functions, how will they access the\
    \ connection parameter in such a way that we can tell which player sent the command?\
    \ With the concept of closures, which are well-supported in Javascript, we can\
    \ make functions return another function. In this way, we can use the connection.id\
    \ parameter to the first wrapping function, and it can return another function\
    \ that takes the data arguments from the Socket.IO event caller. The second function\
    \ is within the closure of the first, it will have access to the connection.id\
    \ parameter. The pattern looks like this:\n\n```\nio.on('connection', function\
    \ (connection) {\n  connection.on('addPlayer', addPlayer(connection.id));\n  connection.on('action',\
    \ action(connection.id));\n  // ... \n});\n```\n\n```\nfunction addPlayer(socketId){\n\
    \  return (data)=>{\n    // code here\n  }\n}\n```\n\n```\nfunction action(socketId){\n\
    \  return (data)=>{\n    // code here\n}\n```\n\n> [21]https://developer.mozilla.org/en-US/docs/Web/Closures"
