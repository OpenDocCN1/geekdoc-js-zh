  md: "# Build a Space Shooter Kaboom.js\n\nWhen the game ends, we destroy the spaceship\
    \ to remove it from the scene. Now we have opportunity to create more explosions\
    \ using the makeExplosion function we built earlier. This time we can go really\
    \ big! To make a big impact, we create a for loop to set off 500 explosions all\
    \ over the scene for seriously dramatic effect. We use the Kaboom wait function\
    \ to add a small delay between each explosion so they don't all go off at once.\
    \ Then we make each explosion happen at random positions on the map, passing in\
    \ other parameters to the makeExplosion function to set the blast radius, number\
    \ of sub-explosions and general size. We also play the explosion sound effect\
    \ using Kaboom's play() function. We don't adjust the volume down, as we want\
    \ the sound to be as dramatic as possible. We entitle randomly to create a true\
    \ canopy and sense of mayhem.\n\nAfter setting off all sound effects and visual\
    \ effects, we wait for 2 seconds to settle down, then use the Kaboom function\
    \ to switch to a new scene, endGame, and wait for the player to play again. Add\
    \ the code below to create the endGame scene, at the bottom of your map. below\
    \ the line go(\"main\")\n\n```\nscene(\"endGame\", {\n  const MAP_WIDTH = 440;\n\
    \  const MAP_HEIGHT = 275;\n\n  add([\n    text(\"GAME OVER\", {size: 40, font:\
    \ \"sink\"}),\n    pos(MAP_WIDTH / 2, MAP_HEIGHT / 3),\n    origin(\"center\"\
    ),\n    layer(\"ui\")\n  ]);\n\n  onKeyRelease(\"enter\", () => {\n    go(\"main\"\
    );\n  });\n});\n```\n\nThis scene adds a large \"GAME OVER\" over the screen until\
    \ the player presses and releases the enter key. Then the onKey returns the player\
    \ to the main scene, and uses go to switch scenes and restart the game. Because\
    \ this is a new scene, in a new scope, we need to add the MAP_WIDTH and MAP_HEIGHT\
    \ constants always.\n\n> ¹55https://kaboomjs.com/doc/wait\n¹56https://kaboomjs.com/doc/play\n\
    ¹57https://kaboomjs.com/doc/wait\n¹58https://kaboomjs.com/doc/go\n¹59https://kaboomjs.com/onKeyRelease\n\
    160https://kaboomjs.com/doc/go"
