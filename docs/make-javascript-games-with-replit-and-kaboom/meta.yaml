  md: "# Building tic-tac-toe with WebSocket and Kaboomjs\n\nThen we check if the\
    \ game is in one of the final states, either WIN or DRAW. If it is, we call out\
    \ to a function resetGame to set up the game again. Finally, we set the latest\
    \ gameState to all the players.\n\nLet's implement the resetGame() function:\n\
    \n```\nfunction resetGame() {\n  gameState.board = new Array(9).fill(null);\n\n\
    \  if (gameState.players.length === 2) {\n    gameState.result.status = Statuses.PLAYING;\n\
    \    const randPlayer = Math.floor(Math.random() * gameState.players.length);\n\
    \    gameState.currentPlayer = gameState.players[randPlayer];\n  } else {\n  \
    \  gameState.result.status = Statuses.WAITING;\n    gameState.currentPlayer =\
    \ null;\n  }\n}\n```\n\nLet's take a look at what we're doing:\n\n+   - First,\
    \ our function creates a new array for the gameState board. This effectively clears\
    \ the board, setting all the positions back to null, or empty.\n- Then it checks\
    \ that there are still 2 players connected. If there are, it sets the game status\
    \ back to PLAYING and chooses at random which player's turn it is to go. We choose\
    \ the first player randomly so that there isn't one player get an advantage by\
    \ going first time.\n\nIf there is only one player remaining, we set the game\
    \ status to WAITING instead, and listen for any new players who want to join.\
    \ We also set the currentPlayer to null, as we will choose which player should\
    \ go once the new player has joined.\n\n# Handling disconnects\n\nThe handler\
    \ we need to implement is if a connection to a player is lost. This could be because\
    \ the player has exited the game (by closing the browser tab), or has other internet\
    \ issues."
