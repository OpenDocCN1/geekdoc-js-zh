  md: "# Temporary invulnerability\n\nA nice touch to make our game a little more\
    \ forgiving is temporary invulnerability for the player after they lose a life.\
    \ We can add this by finding and altering the player’s damage event callback as\
    \ follows:\n\n```\n// Take damage\nplayer.on(\"damage\", () => {\n  if (player.invulnerable)\
    \ { // new statement\n    player.lives--;\n  }\n\n  // destroy ship if lives finished\n\
    \  if (player.lives <= 0) {\n    destroy(player);\n  }\n  else {\n    // Temporary\
    \ invulnerability\n    player.invulnerable = true;\n\n    wait(player.invulnerability_time,\
    \ () => {\n      player.invulnerable = false;\n      player.hidden = false;\n\
    \    });\n  }\n});\n```\n\nWe’re making the player invulnerable and then using\
    \ a wait callback to make them vulnerable again after a few of seconds, similar\
    \ to what we did for the laser timeout. We’re also making sure the player is visible\
    \ by setting player.hidden to false, because the way we’re going to indicate the\
    \ player’s invulnerability is by having their ship flash rapidly. Find and update\
    \ the onUpdate event callback we added earlier for rocket thrust animation :\n\
