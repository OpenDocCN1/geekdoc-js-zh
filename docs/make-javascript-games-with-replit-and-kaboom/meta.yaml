    \ pipes are piling on. The next task is to detect when Flappy flies past a pipe,\
    \ increasing the player's score.\n\n> ¹¹²https://kaboomjs.com/#loop\n¹¹³https://docs.replit.com/images/tutorials/35-flappy-bird/moving-pipes.gif"
