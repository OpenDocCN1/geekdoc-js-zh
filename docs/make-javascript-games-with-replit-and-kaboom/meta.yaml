  md: '# Building Flappy Bird in Kaboom.js


    You''ll also notice that the character we are adding here has many more components
    than just the sprite³395 component we use for the background. We already know
    what the sprite component does, here is what the rest are for:


    +   - the scale³396 component makes the sprite larger on screen by drawing it
    at 2 times the sprite''s normal image size. This gives a nice pixelated look,
    while also making it easier to spot the bird.

    - the pos³397 component sets the position on the screen that the character should
    initially be at. It takes X and Y coordinates to specify a position.

    - the area³398 component gives the sprite an invisible bounding box around it,
    which is used when calculating and detecting collisions between characters. We''ll
    need this so that we can detect if Flappy flies into the pipes.

    - the body³399 component makes the character subject to gravity. This means Flappy
    will fall out of the sky if the player doesn''t do anything.


    Press command + s (Mac) or control + s (Windows/Linux) to update the game output
    window. You should see Flappy added and fall out of the sky very quickly:


    ![](bbox=[0.183, 0.423, 0.817, 0.755])


    Click to open gif⁴400


    > ³395 https://kaboom.com/#sprite

    ³396 https://kaboom.com/#scale

    ³397 https://kaboom.com/#pos

    ³398 https://kaboom.com/#area

    ³399 https://kaboom.com/#body

    ⁴400 https://docs.replit.com/images/tutorials/35-flappy-bird/flappy-falls.gif'
