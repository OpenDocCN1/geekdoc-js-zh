    of the level using only text. Each letter or symbol in this text map can be mapped
    to a character in the Kaboom game. In Kaboom, characters are anything that makes
    up the game world, including floor, platforms, and so on, and not only the players
    and bots.


    Add the following to define levels:


    ```

    1 const LEVELS = [

