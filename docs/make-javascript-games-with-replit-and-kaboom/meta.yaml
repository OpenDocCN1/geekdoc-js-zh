  md: "![](bbox=[0.218, 0.115, 0.781, 0.549])\n\n# Detecting Collisions\n\nNow that\
    \ we have all the objects game needs – a boundary wall, a snake, and food – we\
    \ can move on detecting interactions, or collisions, between these objects.\n\n\
    Kaboom.js has a useful function for helping with this: onCollide⁷. The function\
    \ takes in 2 tags for different game object types, and calls a callback function\
    \ if there is a collision of the objects.\n\nLet's start with detecting if the\
    \ snake moves over a food block. Add the code below:\n\n```\nonCollide(\"snake\"\
    , \"food\", (s, f) => {\n  snake_length++;\n  respawn_food();\n});\n```\n\n> ⁷https://kaboomjs.com/doc/#onCollide"
