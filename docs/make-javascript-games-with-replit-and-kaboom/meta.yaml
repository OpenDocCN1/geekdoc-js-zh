  md: "Building a Mario-like side-scroller with Kaboom.js\n\n# Adding special behaviors\
    \ to Mario\n\nNow we've got the basics of all the other game elements down, it's\
    \ time to create a custom component for Mario. This component will need to do\
    \ quite a bit, as Mario is the main character. Here are the things it will need\
    \ to handle:\n\n+   - Make Mario get bigger or smaller.\n- Run the \"running\"\
    \ animation when Mario is running, and change to a standing or jumping frame in\
    \ other cases\n- \"Freeze\" Mario when he gets to the castle or dies, so the player\
    \ can no longer move him.\n- Handle Mario dying, with a classic spring and out\
    \ of the scene.\n\nOk, here it is, our custom component:\n\n```\nfunction mario()\
    \ {\n  return {\n    id: \"mario\",\n    require: [\"body\", \"area\", \"sprite\"\
    , \"bump\"],\n    smallAnimation: \"Running\",\n    bigAnimation: \"RunningBig\"\
    ,\n    smallStopFrame: 0,\n    bigStopFrame: 8,\n    smallJumpFrame: 5,\n    bigJumpFrame:\
    \ 13,\n    isBig: false,\n    isFrozen: false,\n    isAlive: true,\n    update()\
    \ {\n      if (this.isFrozen) {\n        this.standing();\n      }\n    }\n  \
    \  if (!this.grounded()) {\n      this.jumping();\n    }\n    else {\n      if\
    \ (keyDown(\"left\") || keyDown(\"right\")) {\n        this.running();\n     \
    \ } else {\n        this.standing();\n      }\n    }\n  }\n}\n```"
