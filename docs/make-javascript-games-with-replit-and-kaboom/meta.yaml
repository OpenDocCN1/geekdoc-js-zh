  md: "# Build a Space Shooter with Kaboom.js\n\n```\nfunction spawnGem() {\n  let\
    \ xpos = rand(BLOCK_SIZE, MAP_WIDTH - BLOCK_SIZE);\n  add({\n    sprite(\"gem\"\
    ),\n    pos(xpos, BLOCK_SIZE),\n    area(),\n    body(),\n    \"gem\"\n  });\n\
    }\n\nonUpdate(\"gem\", (gem) => {\n  if (gem.pos.y > MAP_HEIGHT) {\n    destroy(gem);\n\
    \    spawnGem();\n  }\n});\n```\n\nOn this planet in outer space, the gems rain\
    \ from the sky, which is the top of our map for our purposes. We calculate a random\
    \ position, xpos, along the x axis for the gem to appear on by calling the Kaboom\
    \ rand function We don't want the gems to fall right at the edge of the screen,\
    \ as they will be cut off and the spaceship won't be able to get them because\
    \ of the boundary elements we added around. We limit the random xpos to one BLOCK_SIZE\
    \ from each edge.\n\nNow we add the gem sprite to one BLOCK_SIZE from the top\
    \ of the screen. The pos component is set to the xpos we calculated, with the\
    \ y component set to zero to avoid the gem getting stuck on our upper boundary.\
    \ We also give the gem the body component, which makes it subject to Kaboom gravity\
    \ so that it falls downwards towards the ground. We give the gem a label so we\
    \ can refer to it.\n\nThen we add the update event handler for the gem - we need\
    \ to do this for all objects with a body component that interacts with solid objects\
    \ taken care of. Sometimes, the frame rate gets too low (if there is a lot of\
    \ action, or the computer slows), some body and solid collision might be missed,\
    \ and the object falls through the solid player's space. To account for this possibility,\
    \ we check if the gem's pos is within the bounds of the map, and spawn a new gem\
    \ if it is.\n\n+   https://kaboomjs.com/doc/#rand\nhttps://kaboomjs.com/doc/#add\n\
    https://kaboomjs.com/doc/#body\nhttps://kaboomjs.com/doc/#update\nhttps://kaboomjs.com/doc/#solid\n\
    https://github.com/replit/kaboom/issues/86"
