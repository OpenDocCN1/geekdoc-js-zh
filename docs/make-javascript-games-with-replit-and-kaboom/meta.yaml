  md: "# Building a Mario-like side-scroller from Kaboom.js\n\n```\n}\n);\n\nonKeyPress(\"\
    space\", () => {\n  if (player.rounded()) {\n    player.jump();\n  }\n});\n```\n\
    \nTake a look at keyDown \"right\" and \"left\". We use the flipX method that\
    \ is added to the character through the sprite318 component. If this is true,\
    \ it draws the sprite as a mirror image. This flip will make Mario face in the\
    \ correct direction. We call the move method, which is added by the pos319 move\
    \ method. Our move takes the number of pixels to move per second, which we set\
    \ in the SPEED constant. You might want to move this custom definition next to\
    \ the floor, so it is easier to find if you want to tweak it.\n\nIn the \"left\"\
    \ handler, there is also another check. In Mario, you can't walk back to previous\
    \ parts of a level once it's gone off screen. We simulate this by checking if\
    \ Mario is near the left edge of the screen. We get Mario's current position by\
    \ calling the pos320 method which is added by the pos component. However, this\
    \ position will be relative to the whole level, and not just the onscreen view.\
    \ To help us figure out if Mario is near the edge of the screen, and not at the\
    \ beginning of the level, we use the toScreen321 function, which converts \"game\
    \ world\" or level co-ordinates to actual screen coordinates.\n\nWhen a player\
    \ releases the key, we want to make Mario jump. To do this, we can call the jump322\
    \ method, which is added to the character through the body323 component. However,\
    \ jump will make the character shoot up, even if it is already in the air. To\
    \ prevent this jumping, we first check if the player is standing on solid324 object.\
    \ The body325 component also adds the grounded()326 function, which returns true\
    \ if the player is standing on a solid object.\n\nPress Command + S or Ctrl +\
    \ S to update the output, and Mario move around, but it doesn't look very natural\
    \ or Mario-like - yet! Another thing you'll notice is that the screen does not\
    \ scroll when Mario walks to the right, so we need to get the rest of the level.\
    \ Let's fix that first.\n\n> 318https://kaboom.com/#sprite\n319https://kaboom.com/#pos\n\
    320https://kaboom.com/#pos\n321https://kaboom.com/#onScreen\n322https://kaboom.com/#jump\n\
