  md: "# Building Asteroids in Kaboom.js\n\nScenes are further divided into layers,\
    \ which are populated by game objects (called sprites). The layer object is on\
    \ determine when it gets drawn and which other objects it can collide with. In\
    \ this game, we'll use three layers: the background layer (bg), the object layer\
    \ (obj), and UI layer (ui). To initialize these layers, add the code below to\
