  md: "# Building Flappy Bird in Kaboom.js\n\nLet’s include a quick way for the player\
    \ to play again and try to beat their score. We use the onPress^420 to listen\
    \ for the player pressing the space bar. In our key-press handler, we go^421 back\
    \ to the main game scene, to start the game over again.\n\nWe also need to guard\
    \ if Flappy goes too high off the screen, or plummets off the screen. We can do\
    \ this by adding a handler for the player's onUpdate^422 event, which is called\
    \ each frame. We can check if Flappy’s position is beyond the bounds of the game\
    \ window. We add this to the code of the game scene:\n\n```\nplayer.onUpdate(()\
    \ => {\n  if (player.pos.y > height() + 30 || player.pos.y < -30) {\n    go(\"\
    gameover\", score);\n  }\n});\n```\n\nThis gives a margin of 30 pixels above or\
    \ below the window, to take account of Flappy’s size. If Flappy is out of bounds,\
    \ we go^422 to the gameover scene to end the game.\n\nUpdate the game output window\
    \ again and test it out. If you fly into a pipe now, or flap too high, or out\
    \ of the sky, you should be taken to the gameover screen:\n\n![](bbox=[0.118,\
    \ 0.477, 0.882, 0.771])\n\nGame over screen\n\nClick to open gif^424\n\n+   ^420https://kaboomjs.com/#onKeyPress\n\
