    \ (gameState.board[data.gridIndex] === null{\n        gameState.board[data.gridIndex]\
    \ = player;\n        gameState.currentPlayer = gameState.players.find(p => p !==\
    \ player);\n        checkEndOfGame();\n      }\n    }\n    io.emit('gameState',\
    \ gameState);\n  }\n}\n```\n\nIn this function, we check a couple of things first:\n\
    \n> 234https://socket.io/docs/v4/emitting-events/"
