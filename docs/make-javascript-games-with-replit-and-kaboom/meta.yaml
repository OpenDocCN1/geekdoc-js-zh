    First, we create a constant object defining the direction our game allows. Then
    we create a variable to track the current_direction the spaceship is facing.


    Then we add the key-handling code. The key names refer to the left and right arrow
    keys on the keyboard. Kaboom provides the onKeyDown event, which lets us know
    if a certain key is being pressed. We create onKeyDown event handlers for each
    of the arrow keys. As long as the given key is held down, onKeyDown calls the
    handler repeatedly.


    The code inside each onKeyDown does the following:


    +   - The flipX function mirrors the player''s spaceship image so that it looks
    different depending on the direction it is facing. We use -1 to flip it to appear
    facing the left, 1 to the right.

    - The function player.angle slightly tilts the spaceship while the key is being
    held down is so the spaceship looks like it is about to move in the given direction.

    - The current_direction tracking variable is updated. We''ll use this variable
    when we add shooting.

    - The move function moves the spaceship in the given direction.


    We also have onKeyDown handlers for the left and right keys. These reset the spaceship''s
    tilt to 0 (it straight up) when the ship is no longer moving in that direction.


