    \ time) {\n            destroy(this);\n        }\n    }\n}\n\nfunction grow(rate)\
    \ {\n    update() {\n        const n = rate * dt();\n        this.scale.x += n;\n\
    \        this.scale.y += n;\n    }\n};\n```\n\nThe makeExplosion function has\
