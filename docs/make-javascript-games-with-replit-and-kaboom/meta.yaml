  md: "# Building a Mario-like-scroller with Kaboom.js\n\nNotice that the mario and\
    \ enemies sprites are loaded with the function loadAprite²⁹¹, and have an extra\
    \ parameter specifying a .json file. This extra file is in a format made by Aseprite²⁹²,\
    \ is a pixel art and animation app. If you open the Mario.png file, you will see\
    \ that it has many different images of Mario in different positions, which are\
    \ frames of Mario animations. .json file contains all the information needed to\
    \ animate Mario in our game. Kaboom knows how to interpret this, and we can pick\
    \ any animation to run at any time by choosing one from the frameTags list in\
    \ the .json file and using .play()²⁹³ on a sprite. We can also choose a particular\
    \ frame to show at any time, using the sprite’s .frame²⁹⁴, and specifying the\
    \ frame number to use, starting from 0.\n\n![](bbox=[0.166, 0.296, 0.833, 0.33])\n\
    \n```\n{\n  \"meta\": {\n    \"app\": \"http://www.aseprite.org/\",\n    \"version\"\
    : \"1.2.27-trial\",\n    \"format\": \"RGBA8888\",\n    \"size\": {\"w\": 832,\
    \ \"h\": 32},\n    \"scale\": 1\n  },\n  \"frameTags\": [\n    {\"name\": \"SmallMario\"\
    , \"from\": 0, \"to\": 3, \"direction\": \"forward\"},\n    {\"name\": \"Running\"\
    , \"from\": 1, \"to\": 3, \"direction\": \"forward\"},\n    {\"name\": \"BigMario\"\
    , \"from\": 8, \"to\": 16, \"direction\": \"forward\"},\n    {\"name\": \"FlippingMario\"\
    , \"from\": 17, \"to\": 25, \"direction\": \"forward\"},\n    {\"name\": \"Loop\"\
    , \"from\": 18, \"to\": 20, \"direction\": \"forward\"}\n  ],\n  \"layers\": [\n\
    \    {\"name\": \"Layer 2\", \"opacity\": 255, \"blendMode\": \"normal\"},\n \
    \   {\"name\": \"Layer 1\", \"opacity\": 255, \"blendMode\": \"normal\"}\n  ],\n\
    \  \"slices\": []\n}\n```\n\nThe contents of the Mario.json file. Each frametag\
    \ is an animation sequence\n\nMario Aseprite file\n\n# Creating the level maps\n\
    \nLet’s add 2 levels to start. We can create and add as many levels as you want\
