  md: "# Moving the player\n\nLet's write some code to control the player. First,\
    \ we need to retrieve a reference to the player using get()45;\n\n```\n// player\n\
    player = get(\"player\");\n```\n\nNow we'll add code to move the player left and\
    \ right. As we'll use the mouse to control the player's gravity gun, it makes\
    \ ergonomic sense to control the player with the WASD keys rather than the arrow\
    \ keys. Add the following code:\n\n```\nonKeyDown(\"a\", () => {\n  player.move(-player.speed,\
    \ 0);\n});\nonKeyDown(\"d\", () => {\n  player.move(player.speed, 0);\n});\n```\n\
    \nWe detect the onKeyDown46 event for the A key to move the player to the left\
    \ and D key to move the right. The move() function automatically checks for collisions\
    \ with solid objects, so the player will only move if there is space to do so.\n\
    \n```\nonKeyDown(\"w\", () => {\n  if (player.isGrounded()) {\n    player.jump(player.jspeed);\n\
    \  }\n});\n```\n\nThe isGrounded() and jump() functions are provided by the body()\
    \ component, making basic platformer simple to implement in Kaboom.\n\nRerun your\
    \ repl (or refresh your repl's webview) now, and you should be able to move left\
    \ and right with A and D, and to jump with W. If the player jumps off the platform,\
    \ they will fall out of view. We can fix this by having the game camera follow\
