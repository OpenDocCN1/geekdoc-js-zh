  md: "# Building Asteroids in Kaboom.js\n\n```\nonCollide(\"bullet\", \"asteroid\"\
    , (b, a) => {\n  if (!a.initializing) {\n    destroy(b);\n    destroy(a);\n  \
    \  play(\"explosion\");\n    score++;\n  }\n});\n```\n\nThis very simple code\
    \ destroys both the bullet and the asteroid, plays an explosion sound, increments\
    \ the game score.\n\nFinally, add the following to handle asteroid collisions.\n\
    \n```\nonCollide(\"asteroid\", \"asteroid\", (a1, a2) => {\n  if (!a1.initializing\
    \ || a2.initializing) {\n    a1.speed = -a2.speed;\n    a2.speed = -a1.speed;\n\
    \  }\n});\n```\n\nThis makes the asteroids appear to bounce off each other by\
