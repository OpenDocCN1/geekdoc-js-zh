  md: "# Building a pseudo-3D game in Kaboom\n\n```\n{\n  bulletSpeed: -1*BULLET_SPEED,\n\
    \  targetPos: BULLET_VANISHING_POINT\n}\n);\n```\n\n```\nplay(\"shoot\", {\n \
    \ volume: 0.2,\n  detune: rand(-1200, 1200),\n});\n\n```\n\nWhen the player fires,\
    \ we use the spawnBullet function to create a new set of laser bullets. First,\
    \ we calculate the position the bullets will be coming from. To make it seem as\
    \ though they're coming from under the spaceship either, we calculate the bullets'\
    \ starting positions a quarter away from each side of the screen and a third of\
    \ the way using the multipliers .25 and .33 respectively.\n\nThen we calculate\
    \ where the bullets will end up. This is the same position as the cross hairs.\
    \ Using these values, we create 2 bullet objects - simple 1 pixel objects with\
    \ the tag bullet and color set to (255,0,0) so they look menacing. We also add\
    \ custom properties to the object: A speed for the bullet to move out, and the\
    \ vanishing point where its course ends.\n\nAs a final detail, we set \"shoot\"\
    \ to play as each bullet is created, adjusting the volume and applying a randomly\
    \ generated tune value so that the pitch of the sound is slightly different each\
    \ time it's played.\n\nWe've got our bullets, their sounds and their trajectories,\
    \ so let's make them go from their origin to the vanishing point at the cross\
    \ by moving them with each frame:\n\n```\nonupdate(\"bullet\", (b) => {\n  const\
    \ m = (b.pos.y - b.targetPos.y) / (b.pos.x - b.targetPos.x);\n  const c = b.pos.y\
    \ - m*b.pos.x m*(b.targetPos.x);\n\n  let newX = b.pos.x + b.bulletSpeed;\n  let\
    \ newY = m * newX + c;\n  b.pos.x = newX;\n  b.pos.y = newY;\n  // Remove the\
    \ bullet once it has hit the vanishing point y line\n  if ((b.pos.y < SCREEN_HEIGHT*0.33))\
    \ {\n    destroy(b);\n  }\n});\n```"
