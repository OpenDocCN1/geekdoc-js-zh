  md: "# Building tic-toe-toe with WebSocket and Kaboom.js\n\n+   - Next, the function\
    \ figures out symbol, X or O, the new player should be. It will assign X to the\
    \ first player. If there is already a player, the existing player's symbol is\
    \ X, then it will assign O to the new player. Note that there is a possible case\
    \ where there is only one player, and their symbol is O. This would occur if there\
    \ are 2 players, and the player with the X symbol disconnects from the game, leaving\
    \ only the player with the O symbol. This is why we always check what existing\
    \ player in the game has.\n- Then the function constructs a new player object\
    \ with some identifying information, including the name that the player sends,\
    \ the socketId they connected on, and their symbol. When a new player requests\
    \ to join, we expect them to send an object with a field playerName to tell us\
    \ who they are.\n- Now we add the new player to the player array in our gameState\
    \ object, so they are part of the game.\n- We go on check if we have 2 players,\
    \ and starting if we do. We begin by updating the status of the game to PLAYING,\
    \ and set the currentPlayer, i.e the player who is first to go, as the latest\
    \ player to joined.\n- Finally, we use the Socket.IO emit234 to send the updated\
    \ gameState to all connections. This will allow them to update the players' displays.\n\
    \n# Handling player actions\n\nThe next handler takes care of the moves player.\
