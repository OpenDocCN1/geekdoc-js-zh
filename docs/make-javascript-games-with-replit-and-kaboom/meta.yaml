  md: "# Creating a custom component\n\nTo add more abilities to the characters and\
    \ features to the game, we'll use components that we create ourselves and add\
    \ to our game objects. To define a new component in Kaboom, we make a function\
    \ that returns an object with few required fields and methods. Here's a template\
    \ to illustrate a custom component (not part of the game code):\n\n```\nfunction\
    \ customComponent(args) {\n  return {\n    id: \"name\",\n    require: [\"component1\"\
    , \"component2\"],\n    add() {\n    },\n    update() {\n    },\n  };\n}\n```\n\
    \nIn the object we return, Kaboom requires an id, which is a unique name for the\
    \ component. Kaboom also needs a require property, which is a list of other components\
    \ this component needs in order to work. When a component is first initialized\
    \ on a game object, Kaboom calls the add() method so we have the opportunity to\
    \ run any setup code we need. The method update() is called on every frame, so\
    \ we can make animation and collision updates there.\n\nOne behavior we need is\
    \ for the enemy characters to walk up and down, instead of just standing in one\
    \ place. Let's make a custom component we can add to our enemy characters so that\
    \ they automatically move back and forth, or patrol their part of the level. Add\
    \ the code below to the bottom of main.js:\n\n```\nfunction patrol(distance =\
    \ 100, speed = 50, dir = 1) {\n  return {\n    id: \"patrol\",\n    require: [\"\
    pos\", \"area\"],\n    startingPos: vec2(0, 0),\n    add() {\n      this.startingPos\
    \ = this.pos;\n      this.on(\"collide\", (obj, side) => {\n        if (side ===\
    \ \"left\" || side === \"right\") {\n          dir = -dir;\n        }\n      });\n\
    \    },\n  };\n}\n```"
  merge: -1
  pgno: 161
- img_proc: false
  md: "```\nupdate() {\nif (Math.abs(this.pos.x - this.startingPos.x) >= distance)\
    \ {\n  dir = -dir;\n}\nthis.move(speed * dir, 0);\n}\n```\n\nWe've called this\
    \ custom component 'patrol', as it will make a character move distance, at a speed,\
    \ and then turn and walk in the opposite direction, dir. The character will turn\
    \ and move in the opposite direction when it collides with another game object.\
    \ Because we use the move method (which is part of the pos^332 component), and\
    \ the collide event handler (which is part of the area^333 component), we add\
    \ the pos and area components to the require list.\n\nWhen the component is initialized,\
    \ we want to record its starting position. This is so that we know how far the\
    \ character is from where it started off, and we'll know when we must turn it\
    \ to move in the opposite direction. We do this by using the add() method. As\
    \ mentioned above, Kaboom will call this method on our component when the character\
    \ is added to the scene. We read the position of the character at time of calling\
    \ this.pos: this refers to our character (as our part of character, this reference\
    \ to the combination of all the components making up the character). We can save\
    \ this initial position to a property of the component object, in one case we\
    \ called startingPos. We then attach a collide^334 handler, so if the character\
    \ bumps into something, we can turn it and move in the opposite direction.\n\n\
    The collide^335 handler has two arguments passed to it: the obj that our character\
    \ collided with, and the side of the character that hit. We only want to flip\
    \ the character moves in if it was hit from the left or right. To change the direction,\
    \ we flip the sign of our dir variable, which we'll use in the update() method.\n\
    \nThe update() method is called for each frame. In it, we check if the character\
    \ is further than the specified maximum distance from its starting position. If\
    \ it is, we switch the sign of the dir variable to make the character move in\
    \ the opposite direction. We use the Math.abs^336 function, which returns the\
    \ absolute value of a number. The absolute value of a number is always positive,\
    \ and this allows us to compare it to our distance variable, which is also a positive\
    \ value. Then we can call the move method (which we created) along with the pos^337\
    \ component and use the speed variable (passed in the component created) along\
    \ with the dir to specify how fast and in which direction to move the character\
    \ for this frame.\n\n+   ^332https://kaboom.com/pos\n^333https://kaboom.com/area\n\
    ^334https://kaboom.com/area\n^335https://kaboom.com/collision\n^336https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/abs\n\
    ^337https://kaboom.com/pos"
