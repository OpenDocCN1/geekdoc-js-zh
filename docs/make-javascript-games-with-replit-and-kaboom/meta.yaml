    \ = 10;\nfunction spawnBullet() {\n    const BULLET_ORIGIN_LEFT = vec2(SCREEN_WIDTH*0.25,\
    \ (SCREEN_HEIGHT - SCREEN_HEIGHT*0.33));\n    const BULLET_ORIGIN_RIGHT = vec2(SCREEN_WIDTH\
