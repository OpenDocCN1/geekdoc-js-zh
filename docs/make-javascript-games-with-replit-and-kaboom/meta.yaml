  md: "# Building pseudo-3D game in Kaboom\n\n```\narea(),\nrotate(0),\n{\n  xpos:\
    \ rand(-1*SCREEN_WIDTH/2, SCREEN_WIDTH/2),\n  ypos: rand(-1*SCREEN_HEIGHT/2, SCREEN_HEIGHT/2),\n\
    \  zpos: 1000,\n  speed: ALIEN_SPEED + rand(-0.5* ALIEN_SPEED, 0.5*ALIEN_SPEED)\n\
    },\n\"alien\"\n]);\n\naliens.push(newAlien);\n}\n\nloop(0.8, spawnAlien);\n```\n\
    \nFirst, we define some general constants for the size of the screen and the speed\
    \ at which aliens will move. This way, we don't have to keep remembering and typing\
    \ numbers, and it's easier to keep these aspects later if we need to. We create\
    \ an array to hold each alien object so that we can keep track of all of them.\
    \ This will be especially important when we add movement to the aliens.\n\nThe\
    \ function spawnAlien creates a new alien at a random location on the screen.\
    \ The first lines calculate a x and y position to place the alien on the screen\
    \ initially. This isn't logically needed, we'll calculate the alien's actual position\
    \ later from our 3D coordinate system and calculate the projected screen position\
    \ on frame. But we need to pass a position pos^{199} component when we create\
    \ a new object, so any random position will be.\n\nThere are two components we\
    \ use when constructing the alien object:\n\n+   - scale^{201}, allowing us to\
    \ adjust the size of the alien over time as if it's getting closer,\n- rotate^{202},\
    \ allowing us to rotate the aliens so we can simulate 'rolling' when changing\
    \ the spaceship's direction.\n\nWe also add the coordinates of the alien's position\
    \ in the 3D system to the alien object custom properties. We start with a fixed\
    \ pos^{200}, on the Z axis, far from the screen.\n\nThen we add the alien's speed,\
    \ varied by a random amount of up to half the speed faster or slower that there's\
    \ some variety in the way we approach. We'll use these custom values when we calculate\
    \ the alien's position on each frame.\n\nFinally, we add the new alien to the\
    \ aliens array we created earlier to keep track of it.\n\n> ^{199}https://kaboomjs.com/doc/#pos\n\
    ^{200}https://kaboomjs.com/doc/#add\n^{201}https://kaboomjs.com/doc/#scale\n^{202}https://kaboomjs.com/doc/#rotate"
  merge: -1
