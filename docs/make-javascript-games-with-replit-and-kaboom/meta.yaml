  md: "# Building Asteroids in Kaboom.js\n\n```\n// draw current rocket animation\
    \ frame\nonDraw('player', (p) => {\n  if (player.thrusting) {\n    // draw current\
    \ frame\n    drawSprite(\n      sprite: thrust_animation[p.animation_frame],\n\
    \      pos: p.pos.add(pointAt(-p.height/2, p.angle)),\n      origin: \"center\"\
    ,\n      angle: p.angle\n    );\n  }\n});\n```\n\nHere we're using our pointAt\
    \ function again, but this time we're looking for the rocket end of the ship,\
    \ rather than its nose. We use our thrust_animation array in conjunction with\
    \ the player's animation_frame value to figure out which rocket image to draw.\n\
    \nTo actually make the rocket animate (i.e. cycle through animation frames), we'll\
    \ use Kaboom's onUpdate() function, and add a callback that changes the animation\
    \ frame every 0.1 seconds. Add the following:\n\n```\nlet move_delay = 0.1;\n\
    let timer = 0;\n// loop rocket animation\nonUpdate(() => {\n  timer += dt();\n\
    \  if (timer < move_delay) return;\n  timer = 0;\n\n  if (player.thrusting) {\n\
    \    player.animation_frame++;\n    if (player.animation_frame >= thrust_animation.length)\
    \ { // wrap to start\n      player.animation_frame = 0;\n    }\n  }\n});\n```\n\
    \nThat's it! Run your repl and move your ship around.\n\n> https://kaboomjs.com/#onUpdate"
