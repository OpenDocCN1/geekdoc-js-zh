  md: "# Building Asteroids in Kaboom.js\n\n```\n// Take damage\nplayer.on(\"damage\"\
    , () => {\n    player.lives--;\n    // destroy ship if lives finished\n    if\
    \ (player.lives <= 0) {\n        destroy(player);\n    }\n});\n```\n\nWhen objects\
    \ are destroyed in Kaboom, the \"destroy\" event is triggered. We'll use this\
    \ event to show a game over screen with the player's score by adding the following\
    \ code:\n\n```\n// End game on player destruction\nplayer.on(\"destroy\", () =>\
