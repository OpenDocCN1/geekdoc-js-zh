    \ the gameover scene definition, we add a custom parameter, score. This is so\
    \ that we we can pass the player's final score to the game scene to display it.\n\
    \nTo start the whole game off, we use the go function, which switches between\
    \ scenes.\n\n# Building the game world\n\nNow that we have the main structure\
    \ and overhead functions out of the way, let's start adding in the characters\
    \ that make up the Flappy world. In Kaboom, characters are anything that makes\
