  md: '# Build a Space Shooter with Kaboom.js


    the screen, get input, play sounds, and more. We''ll use some of these features
    in our game to explore how Kaboom works.


    The Replit interface is specialised for game-making. Besides the Space Invader
    icon, you''ll notice a few special folders in the file tray, like "Code", "Sprites",
    and "Sounds". These folders take care of loading up assets, and all the necessary
    code to start scenes and direct the game. You can read more about this interface
    here96.


    If you haven''t already, download this zip file97 which contains all the sprites
    and sounds for the game. Extract the file on your computer, then add the sprites
    to the "Sprites" section in the Replit editor, and the sounds to the "Sounds"
    section.


    ![](bbox=[0.303, 0.305, 0.696, 0.603])


    Uploading sprites


    Click to open gif98


    Kaboom makes use of JavaScript''s support for callbacks99; instead of loops to
    read keyboard input and if game objects have loaded, Kaboom uses an event model
    that tells us when these events happened. We can then write callback functions100
    to act on these events.


    A Kaboom game is made up of "scenes", which are like levels, or different parts
    and stages of a game. Scenes have multiple "layers", allowing us to have backgrounds,
    main game objects (like the player, bullets, enemies, etc.), and UI elements (like
    the current score, health, etc.).


    > *96 https://docs.replit.com/tutorial/kaboom

    *97 https://docs.replit.com/tutorial-files/space-kaboom-shooter/space-shooter-resources.zip

