    \ 0.5*SCREEN_WIDTH),\n      ypos: rand(-0.5*SCREEN_HEIGHT, 0.5*SCREEN_HEIGHT),\n\
    \      zpos: rand(1000)\n    };\n    stars.push(newStar);\n  }\n}\n\nspawnStars();\n\
    \nononUpdate(()=>{\n  const centerX = SCREEN_WIDTH * 0.5;\n  const centerY = SCREEN_HEIGHT\
    \ * 0.5;\n  stars.forEach((star) => {\n    star.zpos -= STAR_SPEED;\n    if (star.zpos\
    \ <= 1) {\n      star.zpos = 1000;\n    }\n    const x = centerX + star.xpos /\
