  md: "# Building a Mario-like side-scroller with Kaboom.js\n\n```\nplayer.onUpdate(()\
    \ => {\n  // center camera to player\n  var currCam = camPos();\n  if (currCam.x\
    \ < player.pos.x) {\n    camPos(player.pos.x, currCam.y);\n  }\n});\n```\n\nHere\
    \ we add a handler to the onUpdate³²⁹ event for the player. This is called for\
    \ each frame that is rendered. In this handler, we get the camera's current position\
    \ by calling the camPos³⁹⁰ function without any arguments. Then we can check if\
    \ Mario is further to the right of the scene than the camera is. If he is, we\
    \ set the camera's X position to that of Mario, so essentially the camera is following\
    \ Mario. We only do this if he is further to the right of the camera, and not\
    \ for positions further to the left. This is because we don't want the player\
    \ to be able to go back on a level.\n\nUpdate the output again and test it. As\
    \ you move Mario past the center of the screen, the camera should start following\
    \ him, giving the sense of scrolling.\n\n![](bbox=[0.118, 0.433, 0.882, 0.812])\n\
    \nClick to open gif³³¹\n\n> ³²⁹https://kaboomjs.com/#onUpdate\n³⁹⁰https://kaboomjs.com/#camPos\n\
    ³³¹https://docs.replit.com/images/tutorials/32-mario-kaboom/scrolling.gif"
