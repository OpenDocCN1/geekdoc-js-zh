    \ for the alien, between the top (position 0) of the map, and the bottom (MAP_HEIGHT)\
    \ of the map (screen-coordinates start from the top of the left). We remove 20\
    \ pixels from the bottom, to account for the ground.\n- We add the \"alien\" tag\
    \ to the object, so we can identify and call it in other parts of the code.\n\
    - We also add a custom object with this particular alien, broken into it speed\
