  md: "# Building tic-toe-toe with WebSocket and Kaboom.js\n\nhttp package enables\
    \ us to run a simple HTTP server. The socket.io package extends that server to\
    \ add WebSocket²⁵⁰ functionality.\n\nTo create the HTTP server, we use the http.createServer();\
    \ method. Then we set up Socket.IO by creating a new object. We pass in the HTTP\
    \ server object with some configuration for CORS²⁵⁰ 'Cross Origin Resource Sharing',\
    \ and it's a system that lets the server which other sites are allowed to connect\
    \ to it and we set the origin to allow our player repl to connect. Replace the\
    \ origin value with the URL of the project repl you set up earlier.\n\nIn the\
    \ last 2 lines, we start the server by calling its listen method, along with a\
    \ port to listen on. We use 3000, as is a standard for block block, or Node.js.\
    \ If it starts successfully, we write a message to the console to let us know.\n\
    \nWe'll add the rest of the server code above the server.listen line, and we only\
    \ want to start the server after all the other code is ready.\n\n# Tracking the\
    \ game state\n\nNow that we have a server, lets think a bit about how we will\
    \ represent, or model, the game. The tic-toe-toe game will have a few properties\
    \ to track:\n\n+   - The status of the game: What is currently happening? Are\
    \ we waiting for players to join, the players playing, or is the game over?\n\
    - The current positions on the tic-toe-board. Is there a player in a grid, or\
    \ is it empty?\n- All the players. What are their names, and symbol are they using,\
    \ X or O?\n- The current player. Whose turn is it to go?\n- If the game ends in\
    \ a win, who won it?\n\nFor the status of the game, we'll add an enumeration²⁵¹\
    \ of the possible states we can expect. It makes easier to track and use them\
    \ as we go through the phases of the game.\n\n```\nconst Statuses = {\n  WAITING:\
    \ 'waiting',\n  PLAYING: 'playing',\n  DRAW: 'draw',\n  WIN: 'win'\n}\n```\n\n\
    +   - WAITING: We are waiting for all the players to join the game.\n- PLAYING:\
    \ The players can move on the board.\n\n> ²⁵⁰https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API\n\
    ²⁵¹https://developer.mozilla.org/en-US/docs/Glossary/CORS\n²⁵²https://mastering.io/tutorials/fundamentals/enum"
