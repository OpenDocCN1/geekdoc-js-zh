  md: "# Building Asteroids in Kaboom.js\n\n```\nimport kaboom from \"kaboom\";\n\
    kaboom({\n  scale: 1.5\n});\n```\n\nThis will give you a blank canvas with nice\
    \ checkerboard pattern.\nNow, let's load the sprites and sound files to make them\
    \ available in the game. This code loads each of the graphic elements we use,\
    \ and gives them a name so we can refer to them when we build the game objects:\n\
    \n```\nloadRoot(\"sprites/\");\nloadSprite(\"space\", \"space.jpg\");\nloadSprite(\"\
    rocket1\", \"rocket1.png\");\nloadSprite(\"rocket2\", \"rocket2.png\");\nloadSprite(\"\
    rocket3\", \"rocket3.png\");\nloadSprite(\"rocket4\", \"rocket4.png\");\nloadSprite(\"\
    ship\", \"ship.png\");\nloadSprite(\"bullet\", \"bullet.png\");\nloadSprite(\"\
    asteroid\", \"asteroid.png\");\nloadSprite(\"asteroid_small1\", \"asteroid_small1.png\"\
    );\nloadSprite(\"asteroid_small2\", \"asteroid_small2.png\");\nloadSprite(\"asteroid_small3\"\
    , \"asteroid_small3.png\");\nloadSprite(\"asteroid_small4\", \"asteroid_small4.png\"\
    );\n\nloadRoot(\"sounds/\");\nloadSound(\"rocket_thrust\", \"rocket_thrust.wav\"\
    );\nloadSound(\"laser\", \"laser.wav\");\nloadSound(\"explosion\", \"explosion.mp3\"\
    );\nloadSound(\"Steamtech-Mayhem-Looping\", \"Steamtech-Mayhem-Looping.mp3\");\n\
    ```\n\nThe first line, loadRoot(), specifies which folder to load all the sprites\
    \ and game elements from, so we don't have to keep it for each sprite. Each line\
    \ loads a sprite and gives it a name so we can refer to it in code. We also use\
    \ similar code to load sound elements for our game using the loadSound() function.\n\
    \n# Setting the scene\n\nA Kaboom.js is made up of scenes, which you can think\
    \ of as different scenes, levels or stages. You can use scenes for game levels,\
    \ menu-cuts and any other scenes your game might contain. In this tutorial, we\
    \ will use one scene, which will contain the entire game logic.\n\n⁵https://kaboom.js/#loadRoot\n\
    ⁶https://kaboom.js/#loadSound"
  merge: -1
