  md: "```\nonUpdate(\"pipe\", (pipe) => {\n  pipe.move(-160, 0);\n});\n```\n\nNext\
    \ we'll generate pipes at a steady rate. We can use the loop⁴¹² function for this.\
    \ Adding the following to the game scene part of the code:\n\n```\nloop(1.5, ()\
    \ => {\n  producePipes();\n});\n```\n\nThis calls our producePipes() function\
    \ every 1.5 seconds. You can adjust this rate, or make it variable to increase\
    \ the rate as the game progresses.\n\nUpdate the game output window now and should\
