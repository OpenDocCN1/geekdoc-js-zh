  md: '# Building Flappy Bird in Kaboom.js


    ![](bbox=[0.218, 0.111, 0.781, 0.477])


    We want to move the pipe gap, and therefore the pipes, up and down for each new
    pipe pair that is created. This is so we don''t have the gap at the center point
    of the screen constantly – we want it to be slightly different for each pipe pair
    that comes along. We want to keep the pipe size consistent though.


    Let''s start by having the pipe gap in the center of the screen. We''ll give the
    pipe gap a size PIPE_GAP. To place the pipes, the bottom of the upper pipe should
    be PIPE_GAP/2 pixels above the center point of the window, which is height()/2.
    Likewise, the top of the lower pipe should be PIPE_GAP/2 pixels below the center
    point of the window, again which is height()/2.


    This way, place the pipe so that the pipe gap is in the center of the window.
    Now we want to randomly move it up or down for each new pair of pipes the way
    to do this is to create a random offset, which we add to the midpoint to effectively
    move the midpoint of the window up or down. We can use the Kaboom rand() function
    to do this. The rand() function has two parameters to specify the range in which
    the rand number should be.


    Let''s put that together. The Y-position of the lower pipe can be calculated as:
    height()/2 + offset + PIPE_GAP/2


    Remember, the top of the window is y=0, and the bottom is y=height(). In other
    words, the lower down on the screen is higher, its y coordinate will be.


    For the upper pipe, we can calculate the point where the bottom of the pipe should
    be like this:


    > * https://kaboomjs.com/#rand

    * https://kaboomjs.com/#rand'
