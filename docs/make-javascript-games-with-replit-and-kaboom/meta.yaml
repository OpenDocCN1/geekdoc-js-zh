  md: "Building a Mario-like side-scroller with Kaboom.js\n\n160\n\n![](bbox=[0.135,\
    \ 0.122, 0.874, 0.163])\n\n# Enemies-index\n\nWe can swap out the animation that\
    \ is played when the enemy is patrolling for this frame. Kaboom has built a lifespan³³\
    \ component that also has a fade function. This component allows us to slowly\
    \ fade the squashed enemy and then automatically remove it once the specified\
    \ lifetime is reached. Kaboom also allows us to dynamically add and remove components\
    \ from characters using the use and unload methods. These methods are not yet\
    \ documented, but you can find them (with tricks!) by looking at the Kaboom source\
    \ code³⁴. Let's use this knowledge to build a custom component to handle the enemy\
    \ squashed and fading out of the scene:\n\n```\nfunction enemy() {\n  return {\n\
    \    id: \"enemy\",\n    require: [\"pos\", \"area\", \"sprite\", \"patrol\"],\n\
    \    isAlive: true,\n    update() {\n\n    squash() {\n      this.isAlive = false;\n\
    \      this.unuse(\"patrol\");\n      this.stop();\n      this.frame = 2;\n  \
    \    this.area.width = 16;\n      this.area.height = 8;\n      this.use(lifespan(0.5,\
    \ { fade: 0.1 }));\n    }\n  };\n}\n```\n\nWe define the custom component as we\
    \ did before. Because we need to stop the enemy from patrolling, we require the\
    \ patrol custom component. We also require the sprite³⁵ component so we can stop\
    \ the animation and set the squashed enemy to display. The area³² component is\
    \ necessary, as the squashed enemy frame is half the height of the regular enemy\
