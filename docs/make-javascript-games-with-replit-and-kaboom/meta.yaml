  md: "# Building tic-tac-toe with WebSocket and Kaboom.js\n\n```\nonMouseRelease(()\
    \ => {\n  const mpos = mousePos();\n  // find the square we clicked on\n  for\
    \ (let index = 0; index < boardSquares.length; index++) {\n    const square =\
    \ boardSquares[index];\n    if (mpos.x > square.x\n      && mpos.x < square.x\
    \ + square.width\n      && mpos.y > square.y\n      && mpos.y < square.y + square.height){\n\
    \        socket.emit(\"action\", {\n          gridindex: square.index\n      \
    \  });\n        break;\n    }\n  }\n});\n```\n\nIf we find a 'hit' on one of the\
    \ board squares, we emit our action event. We pass the index of the square that\
    \ was clicked on as the payload data. The server listens for this event, and runs\
    \ the logic we added for the action event on the server side. If the action changes\
    \ the game state, the server will send back the new game state, and the UI elements\
    \ update.\n\nThe only input we need to implement is to check if the player wants\
    \ a rematch. To do that, we'll assign the r key as the rematch command. We can\
    \ use the Kaboom function charInput²⁶¹ to listen for key press events. We'll check\
    \ if the key is r, or R, then emit the rematch event. We won't have any data to\
    \ pass with that, so we'll just pass null.\n\n```\ncharInput((ch) => {\n  if (ch\
    \ === 'r' || ch === 'R') {\n    socket.emit(\"rematch\", null);\n  }\n});\n```\n\
    \nNow you can run the game (and the server), and open the game in another tab,\
    \ and you should be able to play tic-tac-toe against yourself! Send a link to\
    \ the game to a friend, and see if they can join and play against you.\n\n> ²⁶¹https://kaboom.com/doc/#charInput"
