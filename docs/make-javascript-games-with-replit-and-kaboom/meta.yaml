  md: "![](bbox=[0.119, 0.114, 0.88, 0.381])\n\n# # Adding the Spaceship\n\nLet's\
    \ add the spaceship using the `add^108` function:\n\n```\nconst player = add([\n\
    \  sprite(\"spaceship\"),\n  pos(100, 200),\n  body(),\n  area(),\n  scale(1),\n\
    \  rotate(0),\n  origin(\"center\"),\n  \"player\",\n{\n  score : 0,\n  shield\
    \ : 100\n}\n]);\n```\n\nThe `add^109` function constructs a game object using\
    \ different components, e.g. pos, body, scale. Each of these components gives\
    \ the object different features.\n\n> ^108https://kaboomjs.com/doc/#add\n^109https://kaboomjs.com/doc/#add"
