  md: "# Rocket animation\n\nOur ship can move now, but it would be nice to see its\
    \ rockets firing when the player presses the arrow key, as well as hear them.\
    \ Reactive animations like these make games feel more responsive and look more\
    \ dynamic.\n\nKaboom has methods for handling animations when a game object uses\
    \ an animated sprite (i.e. with multiple images), but this isn't quite what we\
    \ want. Rather animating the player's ship, we need to animate the rocket that\
    \ appears behind it when a key is pressed, so we'll need to handle all the animation\
    \ code ourselves. Luckily, Kaboom makes this fairly simple.\n\nFirst, let's create\
    \ an array with our four rocket sprites. Add the following code at the bottom\
    \ of your main scene:\n\n```\n// Animate rocket\nconst thrust_animation = [\"\
    rocket1\", \"rocket2\", \"rocket3\", \"rocket4\"];\n```\n\nThen we need some way\
    \ to indicate when to start and stop the animation. We can use Kaboom's onKeyPress⁷\
    \ and onKeyRelease⁷⁶ events for this, as well as all the properties we defined\
    \ for our player (thrusting and animation_frame). Add the following code:\n\n\
    ```\n// rocket animation helpers\nonKeyPress(\"up\", () => {\n  player.thrusting\
    \ = true;\n  player.animation_frame = 0;\n});\nonKeyRelease(\"up\", () => {\n\
    \  player.thrusting = false;\n});\n```\n\nNow let's draw the animation. We'll\
    \ use a draw event callback, which lets us make the player draw other things in\
    \ addition to its own sprite. Add the following code:\n\n> ⁷https://kaboomjs.com/doc#onKeyPress\n\
    ⁷⁶https://kaboomjs.com/doc#onKeyRelease"
  merge: -1
