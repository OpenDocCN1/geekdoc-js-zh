  md: "# Building Asteroids in Kaboom.js\n\n```\nkeyDown(\"up\", () => {\n  player.speed\
    \ = Math.min(player.speed+player.acceleration, player.max_thrust);\n  play(\"\
    rocket_thrust\", {\n    volume: 0.1,\n    speed: 2.0,\n  });\n});\n```\n\nRather\
    \ than having the spaceship from zero to max speed immediately, we use Math.min()\
    \ to set the speed to the minimum value between current speed plus acceleration\
    \ and its maximum speed. This will make the ship gradually increase in speed until\
    \ it reaches max_thrust. Play around with the values of acceleration and max_thrust\
    \ in the player creation code and see what feels right to you.\n\nAdditionally,\
    \ we set our rocket thrust to play() while accelerating. Kaboom allows us to manipulate\
    \ sounds in many different ways, such as changing their speed and volume.\n\n\
    We'll handle deceleration by choosing the opposite to accelerate, using Math.max()\
    \ to choose the maximum between the player's speed minus deceleration, and their\
    \ maximum speed in reverse (i.e. negative). Add the following code to accelerate\
    \ the acceleration controls:\n\n```\nkeyDown(\"down\", () => {\n  player.speed\
    \ = Math.max(player.speed-player.deceleration, -player.max_thrust);\n  play(\"\
    rocket_thrust\", {\n    volume: 0.2,\n    speed: 2.0,\n  });\n});\n```\n\nIf you\
    \ run your repl now to try to decelerate, the sound will play, but the ship will\
    \ go nowhere. This is because we're manipulating player.speed, which is a custom\
    \ property that Kaboom hasn't attached any special behavior to (unlike player.angle).\
    \ Let's add some movement parameters now.\n\n# Movement\n\nMovement in Kaboom\
    \ and most other 2D game development systems is handled using X and Y coordinates\
    \ on a plane. To move an object left, you subtract from its X, and to move right,\
    \ you add to its X. To move an object up, you subtract from its Y coordinate,\
    \ and to move it down, you add to its Y coordinate. Therefore, basic four-directional\
    \ movement in games\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/min\n\
    \n> https://kaboomjs.com/docs/#play\n\n> https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/max"
