  md: "# Building Flappy Bird in Kaboom.js 191\n\ncomponent. We can use that to call\
    \ a function when the player collides with any character with the \"pipe\" tag.\
    \ Add this code to the game scene:\n\n```\nplayer.collides(\"pipe\", ()) => {\n\
    \  go(\"gameover\", score);\n});\n```\n\nIn the collision handler, we use the\
    \ go⁴¹¹ function to switch to the gameover scene. We don't have anything in there\
    \ yet, so let's update to show a game over message and the score. We can also\
    \ keep track of the high score to compare the player's latest score to. Update\
    \ the gameover scene as follows:\n\n```\nlet highScore = 0;\nscene(\"gameover\"\
    , (score) => {\n  if (score > highScore) {\n    highScore = score;\n  }\n});\n\
    \nadd([\n  text(\n    \"gameover!\\n\"\n    + \"score: \" + score\n    + \"\\\
    nhigh score: \" + highScore,\n    {size: 45}\n  )\n]);\n\nKeyPress(\"space\",\
    \ () => {\n  go(\"gameover\");\n});\n});\n```\n\nWe create a highScore variable\
    \ where we can track the top score across multiple game plays. In, our gameover\
    \ scene, we check if the latest score passed in is bigger than the highScore If\
    \ we have recorded it, the highScore is updated to the latest score.\n\nTo show\
    \ a \"game over\" message, and the player's score along with the high score, we\
    \ use the add⁴⁸ function to add a text⁴¹ component to a new game object or character.\
    \ We also make the font size large-ish for this message.\n\n> ⁴¹https://kaboomjs.com/#go\n\
    ⁴⁸https://kaboomjs.com/#add\n⁴¹https://kaboomjs.com/#text"
