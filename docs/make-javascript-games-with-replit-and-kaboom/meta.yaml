    +   - The sprite<h6>¹ component, which draws the ship sprite.

    - The pos6² (position) component, which places the player near the center of the
    screen in the Replit browser.

    - The rotate³ component, which will allow the player to turn the ship with the
    left and right arrow keys.

    - The origin<h6>⁴ component, which sets the ship''s origin to "center", so that
    when we rotate the ship, it will rotate around the center of its sprite rather
    than the default top-left corner.

    - The area<h6>⁵ component, which generates the collision area for the ship to
    detect collisions.


    By initial configuration, we''re giving the player object three tags: player,
    mobile and wraps. Kaboom uses a tagging system to apply behavior to objects—you
    can think of this as similar multiple inheritance⁶⁶. By tagging objects with shared
    behavior, we can save ourselves from duplicating code.


    Finally, we assign a number of custom properties to our player object. We will
    use these properties to handle a variety of gameplay functions, such as moving
    and shooting.


