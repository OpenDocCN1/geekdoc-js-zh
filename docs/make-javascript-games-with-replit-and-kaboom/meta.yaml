  md: "# Building Snake in Kaboom.js\n\n```\nonKeyPress(\"up\", () => {\n  if (current_direction\
    \ != directions.DOWN){\n    current_direction = directions.UP;\n  }\n});\nonKeyPress(\"\
    down\", () => {\n  if (current_direction != directions.UP){\n    current_direction\
    \ = directions.DOWN;\n  }\n});\nonKeyPress(\"left\", () => {\n  if (current_direction\
    \ != directions.RIGHT){\n    current_direction = directions.LEFT;\n  }\n});\n\
    onKeyPress(\"right\", () => {\n  if (current_direction != directions.LEFT){\n\
    \    current_direction = directions.RIGHT;\n  }\n});\n```\n\nFor each of the named\
    \ \"arrow\" keys, we set up a function to call if the key is pressed. In each\
    \ of these functions, we check to ensure that the new direction is not the complete\
    \ opposite direction to what the snake is currently moving. This is because we\
    \ don't want to allow the snake to reverse. If its a legal move, we update the\
    \ current_direction property to the new direction.\n\nNow we need to think about\
    \ how to make the snake appear on the screen. A way to do this is to check and\
    \ add a block in front of the snake in that direction. We'll need to remove a\
    \ block at the tail-end of the snake. We'll need to do this a few times in a second\
    \ so that the snake appears to be moving smoothly. Kaboom.js has a function onUpdate*\
    \ which can be used to update game objects on each frame. Add the following code,\
    \ which uses the onUpdate function, to move the snake:\n\n> *https://kaboomjs.com/doc/#onUpdate"
