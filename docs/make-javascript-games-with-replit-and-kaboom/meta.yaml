    \ event callback for objects with the \"movable\" tag. Add the following code\
    \ to the bottom of the main.js file:\n\n```\n// gravity gun pull and hold\nonUpdate(\"\
    movable\", movable) => {\n  // test collisions\n  myRect = movable.area().\n \
    \ movable.inRange = testRectLine(myRect, player.rangeLine);\n  movable.inHold\
    \ = testRectLine(myRect, player.holdLine);\n}\n```\n\nFirst, we get the coordinates\
