  md: "# Handling new players\n\nAdd the following function to handle adding players:\n\
    \n```\nfunction addPlayer(socketId){\n  return (data)=={\n    const numberOfPlayers\
    \ = gameState.players.length;\n    if (numberOfPlayers >= 2){\n      return;\n\
    \    }\n\n    let nextSymbol = 'X';\n    if (numberOfPlayers === 1){\n      if\
    \ (gameState.players[0].symbol === 'X')\n        nextSymbol = 'O';\n      }\n\
    \    }\n\n    const newPlayer = {\n      playerName: data.playerName,\n      id:\
    \ socketId,\n      symbol: nextSymbol\n    };\n\n    gameState.players.push(newPlayer);\n\
    \    if (gameState.players.length === 2){\n      gameState.result.status = Statuses.PLAYING;\n\
    \      gameState.result.currentPlayer = newPlayer;\n    }\n\n    io.emit('gameState',\
    \ gameState);\n}\n```\n\nThis function does quite a bit. Let's go through how\
    \ many players are already in the game. If there are already 2 players, it returns\
    \ early without changing anything. If this check passes, it goes on to add a new\
    \ player. Note that even when there is no space in the game for a new player,\
    \ we don't disconnect the player - they still get updates and can watch the match.\n\
    \n+   - First it checks to see how many players are already in the game. If there\
    \ are already 2 players, it returns early without changing anything. If this check\
    \ passes, it goes on to add a new player. Note that even when there is no space\
    \ in the game for a new player, we don't disconnect the player - they still get\
    \ updates and can watch the match."
