    \  pos(BULLET_ORIGIN_LEFT),\n    color(255, 0, 0),\n    \"bullet\",\n    bulletSpeed:\
    \ BULLET_SPEED ,\n    targetPos: BULLET_VANISHING_POINT\n]);\n\nadd([\n    rect(1,\
    \ 1),\n    pos(BULLET_ORIGIN_RIGHT),\n    color(255, 0, 0),\n    \"bullet\",\n\
