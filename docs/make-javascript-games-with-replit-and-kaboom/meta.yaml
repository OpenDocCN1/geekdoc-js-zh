  md: "# Building tic-tac-toe with WebSocket and Kaboomjs\n\nEach number in the blocks\
    \ represents the index at which the board position is represented in the array.\
    \ Initially, we fill all the elements of the array with null to indicate that\
    \ the block is open. When players make a move to occupy an open space, we'll add\
    \ a reference to the player instead. That way we can keep track of which blocks\
    \ are empty, and are occupied by which player.\n\nNext, we have currentPlayer,\
    \ which we will inevitably set to each player when it's their turn to move.\n\n\
    Then there is an array players, which will hold references to both of the players\
    \ in the game. This will allow us to show the names of the players on screen,\
    \ as well as generally keep track of the players.\n\nThe result field is updated\
    \ every move. This field will contain the status of the game (as defined above).\
    \ As it's represented as an object, it will also be able to hold extra fields.\
    \ We'll use that functionality to add a reference to the winner of the game, if\
    \ that ends in a win.\n\n# Accepting connections\n\nWhen a player connects via\
    \ WebSocket, Sockets.IO will fire a connection²¹⁵ event. We can listen for this\
    \ event and handle tracking the connection, as well as creating listeners for\
    \ other custom events. There are a few custom events²¹³ we define here, that our\
    \ players will emit:\n\n+   - addPlayer: We use this event for a player to joining\
    \ the game.\n- action: Used when a player wants to make a move.\n- rematch: Used\
    \ when a game is over, but the players want to play again.\n\nWe can also listen\
    \ for the built-in disconnect²¹⁴ event, which will alert us if a player leaves\
    \ the game (for example, by closing the browser window or if their connection\
    \ is lost).\nLet's create the code that we will hook up to our listeners:\n\n\
    ```\nio.on('connection', function (connection) {\n  connection.on('addPlayer',\
    \ addPlayer(connection.id));\n  connection.on('action', action(connection.id));\n\
    \  connection.on('rematch', rematch(connection.id));\n  connection.on('disconnect',\
    \ disconnect(connection.id));\n});\n```\n\nNext we'll implement each of these\
    \ listener functions, starting with addPlayer.\n\nSide Note: Normally in examples\
    \ for custom listeners, you'll see the handler code added immediately with an\
    \ anonymous function, like this:\n\n²¹⁵https://socket.io/docs/v4/server-instance/#connection\n\
    ²¹³https://socket.io/docs/v4/emitting-events/\n²¹⁴https://socket.io/docs/v4/server-instance/#disconnect"
