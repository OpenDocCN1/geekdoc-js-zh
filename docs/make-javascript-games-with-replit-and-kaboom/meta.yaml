  md: "# Building a Mario-like side-scroller with Kaboom.js\n\n+   - A \"start\" or\
    \ intro scene, which waits for a player to press a button to start the game. We'll\
    \ also return to this scene if the player dies, so they can start again.\n- A\
    \ main \"game\" scene, which will contain the game levels and all the logic to\
    \ move Mario, the logic for the enemies and rewards, etc.\n\nWe can use the go^301\
    \ function to switch between scenes.\nLet's add the \"start\" scene, and make\
    \ the game to go to it by default:\n\n```\nscene(\"start\", () => {\n  add({\n\
    \    text(\"Press enter to start\", { size: 24 }),\n    pos(vec(160, 120)),\n\
    \    origin(\"center\"),\n    color(255, 255, 255),\n  });\n\n  onKeyRelease(\"\
    enter\", () => {\n    go(\"game\");\n  });\n});\ngo(\"start\");\n```\n\nWe define\
    \ the scene^302 function. This function takes a string as the scene name - we're\
    \ calling the scene \"start\". We're using an inline function here, using arrow\
    \ function notation^303. You could also use the function keyword, if you'd like\
    \ to specify a function in that way.\n\nWe also add some instruction text in the\
    \ scene function, using the text^304 component and setting the text's content\
    \ and size. The pos^305 component sets the position of the text on the screen,\
    \ and the origin^306 component sets the center of the text to be positioned. Finally,\
    \ we set the color of the text to white using the color^307 component, which takes\
    \ RGB (red, green, blue) values from 0-255.\n\nWe also have a call to the function\
    \ onKeyRelease^308, which listens for the key being pressed. If the key is pressed,\
    \ we go to the main game scene (which we'll add shortly!)\n\nFinally, we use the\
    \ go^309 function to go to the start scene when the game starts."
