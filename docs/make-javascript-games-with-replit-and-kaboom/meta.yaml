  md: '# Building Snake in Kaboom.js


    ![](bbox=[0.118, 0.096, 0.879, 0.417])


    # Creating a new repl


    After the repl has booted up, you should see a main.js file under the "Scenes"
    section. This is where we will start coding.


    # Getting Started with Kaboom.js


    Kaboom.js is a JavaScript library that contains many useful features to make simple
    in-browser games. It has functionality to draw shapes and sprites (the images
    of characters and game elements) to the screen, get user input, play sounds, and
    more. We''ll explore these features and learn how to work by using some of them
    in our game.


    Kaboom.js also makes good use of JavaScript''s support for callbacks; instead
    of writing loops to read in keyboard input and check if game objects have collided
    (bumped into each other), Kaboom.js uses an event model, which tells us when such
    an event has occurred. We can then connect via callbacks¹ that on these events.


    Using Kaboom.js in Replit takes care of all the boilerplate initialisation code,
    as well as asset loading, so we can concentrate on writing the game logic and
    making game graphics and sound.


    > *https://kaboom.js²\https://developer.mozilla.org/en-US/docs/Glossary/Callback_function³https://developer.mozilla.org/en-US/docs/Glossary/Callback_function'
