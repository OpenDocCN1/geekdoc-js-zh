    \ the radius or distance from p to make the flashes in\n- size, the size of each\
    \ of the flashes\n\nThe function creates a loop for n times (the number of main\
    \ flashes). It uses the Kaboom wait function to leave a little bit of time (0.1\
    \ seconds) between each main flash.\n\nAnother for loop twice to create 2 flashes,\
