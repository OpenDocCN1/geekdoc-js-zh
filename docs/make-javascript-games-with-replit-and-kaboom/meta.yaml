    \ are built-in functions for many properties, like sprite which gives the character\
    \ an avatar; body which makes the character respond to gravity; and solid which\
    \ makes the character cannot move through it.\n\n> 384https://kaboom.com/#go\n\
    385https://kaboom.com/#add\n386https://kaboom.com/#sprite\n387https://kaboom.com/#body\n\
