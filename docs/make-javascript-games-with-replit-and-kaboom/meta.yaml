  md: '# Building a pseudo-3D game in Kaboom


    While this is similar to the code we added above for the alien bugs, you''ll notice
    the spawnStars function has a few differences to the spawnAlien function, such
    as:


    +   - We create all the stars at once. This is because we need a significant star
    field to start with, not just a few stars every second.

    - We don''t create a Kaboom object for each star. This is because we don''t need
    the collision handling and other that comes with a Kaboom object, especially since
    we are generating a lot of stars (const START_COUNT = 1000); Instead, we seed
    the stars'' info in custom object literals², and add each of them to the stars
    array.

    - We set the initial z-pos of the stars to a random value from 0 to 1000, using
    the Kaboom rand² function. We do this because we create all the stars at once,
    so we seed the stars at random positions on the z-axis to give the field of depth
    to the star field. If they were all initialised to the same z-pos, they would
    move in union and it would look like a mass of pixels coming at us - a bit weird!


    Now take at the onUpdate² event handler for our stars. It differs from the event
    handler for our alien bugs in this way:


    +   - We don''t use an object filter to look for the stars, as we didn''t create
    them as Kaboom objects. Instead, we cycle through each star in the stars array.

    - Instead of destroying the star and removing it from the array when it reaches
    the ''front'' of the screen, we recycle it by resetting its z-pos back to 1000.

    - We also check if the z-pos is out of the screen. If it is, we draw it, to save
    a bit of overhead.

    - Instead of the z-pos to calculate a value by which to scale the star, we use
    it to calculate the star''s intensity, or brightness. Kaboom uses color values
    in the range 0-255. So we first scale the z-pos down to 1. We subtract it from
    1 to create an inverse relationship between z-pos and intensity. We then multiply
    the intensity value by 255 to scale it to a value that is within the range 0-255.
    In other words, stars further away have higher z-pos values, giving us lower intensity.
    This makes stars far away glow dimly, while those closer to our view look brighter.

    - Finally, we use the Kaboom''s drawRect⁴ method to directly draw the star to
    the screen. As there is no pixel level drawing function in Kaboom, we create a
    rectangle of size 1 to just one pixel.


