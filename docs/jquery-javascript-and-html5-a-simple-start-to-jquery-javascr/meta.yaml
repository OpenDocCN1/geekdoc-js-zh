  md: '# # Chapter 1


    # ## Introduction


    If there is one application development framework that can be termed as comprehensive,
    then HTML5 wins the bid hands down. Although, the specification for HTML5 is not
    yet complete, most modern web browsers support the popular features on device,
    which range from a Smartphone to a desktop. What that means is that you just have
    to write one application and it will run on your devices without any interoperability
    issues.


    There is no doubt about the fact that HTML5 is the future of web application development
    and if you wish to remain in the league, you need to think futuristically and
    equip yourself to deal the technological challenges that the future is about to
    throw at you. The scope of HTML5 is evident from the fact that most of the major
    players of the industry and setting their eyes on this technology and giving in
    full support to the same.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# A Simple Start to Jquery, Javascript, and Html5 for Beginners


    If the multi-faceted functionality and high-on features characteristics of HTML5
    intrigue you and you want to start writing your own applications right away, but
    you do not know how and where to begin, then this book is just for you. This book
    covers everything that you shall require to create working applications with the
    help of HTML, JavaScript/JQuery and CSS. However, it is not a reference guide.
    We hope to give you practical knowledge so that you can get to development as
    quickly as possible.


    This book is a perfect start-up guide and covers all the basic facets of HTML5,
    JavaScript and CSS development. It covers everything from the very basics to all
    that you shall require in your tryst with this framework. The first three chapters
    introduce you to these three technologies, giving you some ground to start with.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Chapter 2


    # Basics of HTML5


    HTML (Hyper Text Markup Language) is a language used for creating webpages. In
    fact, this language has been in use since the first webpage was made. However,
    the functionality has evolved as newer and better versions of the language were
    introduced. The language is known to have originated from SGML (Standard Generalized
    Markup Language), which was earlier used for document publishing. HTML has inherited
    the concept of formatting features and their syntax from SGML.


    One of the most interesting and beneficial facet of HTML usage, as far as browsers
    are concerned, is that browsers support both backward as well as forward compatibility.
    While backward compatibility is usually easy to achieve, forward compatibility
    is tricky as the problem domain, in this case, is infinitely large. However, in
    order to implement this, browsers were designed to ignore tags that it did not
    recognize.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'A Simple Start to Jquery, Javascript, and Html5 for Beginners


    For years, HTML remained all that people wanted. However, with time, people felt
    the need for more, which was catalyzed by the presence of another technology called
    XML (eXtensible Markup Language). Although, XML shares a lot of similarities with
    HTML, there exist many fundamental differences between the two. Firstly, XML requires
    tag matching in the sense that for every starting tag, a closing tag must inevitably
    exist. Besides this, XML allow you to create your own tags as it does not possess
    a fixed set of tags like HTML.


    The tags used in XML are meta-tags or tags that describe the data that is included
    between the starting and closing tag. In order to ensure the validity of the XML
    document, a technology called XSD (XML Schema Definition) is used. However, this
    technology cannot be used for validating HTML documents because HTML documents
    lack a well-defined structure.


    The W3C (World Wide Web Consortium) introduced XHTML as an attempt to fix the
    flaws of HTML. According to the XHTML specification, HTML documents were forced
    to adhere to the format specifications used for XML. Therefore, this allowed the
    use of XSD tools'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'for validation of HTML documents. Although, the integration of XML in the framework
    fixed some issues, some issues continued to crop up. One of the staggering issues
    of the modern times was the growing need for integration of multimedia. While
    CSS did perform formatting of some level, it was becoming inadequate for the growing
    demands of users.


    In order to provide support for interactivity and animated visuals, a programmable
    support called JavaScript was added to this ensemble. However, initial versions
    of this support were difficult for programmers to understand and slow on execution
    time incurred. This led to the introduction of plug-ins like Flash to get the
    attention that it did. These plugins did what was expected of them, but the browser-multimedia
    integration was still loose in nature.


    HTML5 is not an evolved form of XHTML. On the contrary, HTML5 can be better described
    as the reinvented form of HTML 4.01 and how HTML, CSS and JavaScript can be used
    together to solve the growing needs of the user base.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# A Simple Start to Jquery, Javascript, and Html5 for Beginners


    # Semantic Markup


    The fundamental feature of HTML5 is that it stresses on separation of behaviour,
    presentation and structure. The semantic markup of a website development specifies
    the structure of the document. In other words, it specifies the meaning of tags
    and what they will do for you. On the other hand, behaviour and presentation are
    governed by CSS and JavaScript respectively.


    # HTML5 Elements


    In HTML, an element is simply a statement that contains a beginning tag, content
    and a closing tag. Therefore, when you write,


    ```

    <div>

    <b>This is my world!</b>

    </div>

    ```


    In this example, the div elements includes everything from <div> to </div>. therefore,
    the <b></b> tag is also a part of the div element.


    It is important to state here that HTML5 is not case'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'sensitive. Therefore, regardless of whether you write <B> or <b> for the bold
    tag, the browser will consider the two same. However, the use of lower case for
    tags is recommended by the W3C standards.


    # Working with Elements in HTML5


    HTML5 defines more than a 100 elements. These elements, with their definitions
    are provided in Appendix.


    # *How to add attributes to elements?*


    Additional data can be added to the begin tag in the form of attributes. An attribute
    can be generally represented as, name="value". The value for the attribute name
    is enclosed within quotes. There is no restriction on the number of attributes
    that can be added to the begin tag. For these attributes, the attribute has a
    name, but it does not have a value.


    Example:


    ```

