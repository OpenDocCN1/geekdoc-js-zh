    # Capturing events:


    There may be situations when an event may be attached to a button click, which
    may lie inside a hyperlink. In this situation, there is nesting of elements. Therefore,
    the event, when triggered, is passed down the DOM hierarchy. This process is called
    event capturing. However, once the event has reached the element, this event is
    bubbled up the hierarchy. This process is called event bubbling. This movement
    of the event across the hierarchy gives the developer an opportunity to subscribe
    or cancel the propagation, on need basis.


    # Subscribing to event:


    The function, addEventListener, can be used for the subscription process. This
    function requires three arguments, the event, the function that needs to be called
    for the event and a Boolean value that determines if the function will be called
    during the capture or bubble process (true – capture, false – bubble). Mostly,
    this value is set to false. This is the preferred method'
