    # The <label> Element


    It is the element that is used to convey the meaning of an element to the user.
    The text in this element is displayed inside the text box, which is auto-removed
    when the user clicks on it. You can also specify the style of a label.


    # Specifying Parent Forms


    There may be situations where the submission elements of a form may not lie inside
    the same construct. Therefore, gathering data, in this case, can be quite a challenge.
    In order to address this issue, HTML5 provides an attribute, id, which can be
    set for multiple form elements. This shall allow data collection from different
    form elements in one go.


    # How to Trigger Form Submission


    Upon triggering, all the data collected from the submission elements of the form
    or forms of the same id is sent to the server using an HTTP method.'
