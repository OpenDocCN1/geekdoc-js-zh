- md: "## A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\nthe event\
    \ like location of the mouse and key-presses, in addition to several other details\
    \ relevant to the event.\n\n## Capturing events:\n\nThere may be situations when\
    \ an event may be attached to a button click, which may lie inside a hyperlink.\
    \ In this situation, there is nesting of elements. Therefore, the event, when\
    \ triggered, is passed down the DOM hierarchy. This process is called event capturing.\
    \ However, once the event has reached the element, this event is bubbled up the\
    \ hierarchy. This process is called event bubbling. This movement of the event\
    \ across the hierarchy gives the developer an opportunity to subscribe or cancel\
    \ the propagation, on need basis.\n\n## Subscribing to event:\n\nThe function,\
    \ addEventListener, can be used for the subscription process. This function requires\
    \ three arguments, the event, the function that needs to be called for the event\
    \ and a Boolean value that determines if the function will be called during the\
    \ capture or bubble process (true – capture, false – bubble). Mostly, this value\
    \ is set to false. This is the preferred method for subscription as it is mentioned\
    \ in the W3C standard.\n\nSample Code:\n\n```\nvar btn = document.getElementById('btnDownload');\n\
    btn.addEventListener('click', initiateDownload, false);\n```\n\nHowever, other\
    \ methods also exist, which include giving an inline subscription to the html\
    \ tag. This subscribes the event to the bubble process. The advantage of using\
    \ this method is that it is the oldest and most accepted method. therefore, you\
    \ can be sure that this method will work, regardless of what browser you are using.\
    \ Please see the tag below to understand how this can be done.\n\n```\n<button\
    \ id='btnDownload' onclick='initiateDownload();' >Download</button>\n```\n\nYou\
    \ can also use the traditional subscription process that uses JavaScript for subscribing\
    \ the event.\n\n```\nvar btn = document.getElementById('btnDownload');\nbtn.onclick\
    \ = initiateDownload;\n```\n\nUnsubscribing:\n\nEvents can be unsubscribed using\
    \ the function, removeEventListener, which takes the same set of parameters as\
    \ addEventListener. For the btn variable used in the previous example, this can\
    \ be done in the following manner:\n\n```\nvar btn = document.getElementById('btnDownload');\n\
    btn.removeEventListener('click', initiateDownload, false);\n```\n\nHow to cancel\
    \ propagation?\n\nThe function, stopPropagation, is used for performing this operation.\
    \ This can be done in the following manner:\n\n```\nvar btn = document.getElementById('btnDownload');\n\
    btn.addEventListener('click', initiateDownload, false);\nfunction initiateDownload\
    \ (e){\n    //download\n    e.stopPropagation();\n}\n```\n\nHow to prevent the\
    \ default operation?\n\nThis can be done by using the function, preventDefault,\
    \ in the following manner:\n\n```\nvar hyperlink = document.getElementById('linkSave');\n\
    hyperlink.addEventListener('click', saveData, false);\nfunction saveData(e){\n\
    \    //save data\n    e.preventDefault();\n}\n```\n\nJavaScript also provides\
    \ the *this* keyword, which can be used if you wish to access the event causing\
    \ element, on a frequent basis.\n\n## Window Event Reference\n\nThe current browser\
    \ window is represented by the window variable, which is an instance of **the\
    \ Window object.** The following events are associated with this object:\n\n-\
    \ afterprint\n- beforeonload\n- beforeprint\n- error\n- blur\n- haschange\n- load\n\
    - message\n- focus\n- online\n- offline\n- pageshow\n- pagehide\n- redo\n- popstate\n\
    - storage\n- resize\n- unload\n- undo\n\n## Form Event Reference\n\nThe actions\
    \ that occur inside an HTML form trigger the flowing events:\n\n- change\n- blur\n\
    - focus\n- contextmenu\n- forminput\n- formchange\n- invalid\n- input\n- submit\n\
    - select\n\n## Keyboard Event Reference\n\nThe keyboard triggers the following\
    \ events:\n\n- keyup\n- keypress\n- keydown\n\n## Mouse Event Reference\n\nThe\
    \ mouse triggers the following events:\n\n- click\n- drag\n- drop\n- scroll\n\
    - dblclick\n- dragenter\n- dragstart\n- dragend\n- dragover\n- dragleave\n- mousemove\n\
    - mousedown\n- mouseover\n- mouseout\n- mousewheel\n- mouseup\n\n## Media Event\
    \ Reference\n\nMedia elements like videos, images and audios also trigger events,\
    \ which are as follows:\n\n- canplay\n- abort\n- waiting\n- durationchange\n-\
    \ canplaythrough\n- ended\n- emptied\n- loadeddata\n- error\n- loadstart\n- loadedmetadata\n\
    - play\n- pause\n- progress\n- playing\n- readystatechange\n- ratechange\n- seeking\n\
    - seeked\n- suspend\n- stalled\n- volumechange\n- timeupdate\n\n## Chapter 4\n\
    \n## Basics of CSS3\n\nCascading Style Sheets or CSS provide the presentation\
    \ that webpages are known for. Although, HTML is capable of providing a basic\
    \ structure to the webpage, CSS offers developers host of design options. Besides\
    \ this, it is fast and efficient, which makes it an all more popular design tool.\n\
    \nCSS is known to have evolved from SGML (Standardized Generalized Markup Language).\
    \ The goal of efforts made in this direction was to standardize the manner in\
    \ which webpages looked. The latest version of this technology is CSS3, which\
    \ is a collection of 50 modules.\n\nThe most powerful characteristic of CSS is\
    \ its cascading ability. Simply, it allows a webpage to take its styles from multiple\
    \ sheets in such a manner that changes to the style in subsequently read sheets\
    \ overwrite the style already implemented from one or more of the previous sheets.\n\
    \n## How to Define and Apply Style\n\nThe definition and application of a style\
    \ involves two facets or parts, **selector and declaration**. While the **selector\
    \ determines the area of the webpage that needs to be styled**, the **declaration\
    \ block describes the style specifications that have to be implemented**. In order\
    \ to illustrate how it works, let us consider the following example,\n\n```\n\
    body {\n    color: white;\n}\n```\n\nIn this example, the selector selects the\
    \ body of the webpage and the declaration block defines that the font color should\
    \ be changed to white. This is a simple example and declarations and selectors\
    \ can be much more complex than this.\n\n## How to Add Comments\n\nComments can\
    \ be added to the style sheet using the following format:\n\n/*write the comment\
    \ here*/\n\n## How to Create an Inline Style\n\nEvery element has an associated\
    \ global attribute, style. This global attribute can be manipulated within the\
    \ tag for that element to modify the appearance of that element. This type of\
    \ styling does not require you to specify the selector. Only the declaration block\
    \ is required. An example of how this is done is given below:\n\n```\n<body style='color:\
    \ white;'>\n</body>\n```\n\nThis HTML tag performs the same functionality as the\
    \ CSS code specified in the previous section. The advantage of using this approach\
    \ is that the style information given in this manner overwrites any other styling\
    \ information. Therefore, if you need to use different style for one element while\
    \ the rest of the document needs to follow a different style, then you can use\
    \ a style sheet for the document and specify the style for this element in its\
    \ tag.\n\n## How to Use Embedded Style\n\nAnother approach for accomplishing the\
    \ same outcome as inline styles is to use the `<style>` element within the element\
    \ concerned, for defining its style specification. Here is how this can be done:\n\
    \n```\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n\
    \    <title></title>\n    <style>\n        body {\n            color: white;\n\
    \        }\n    </style>\n</head>\n<body>\n```"
  mdcn: "\n## 面向初学者的jQuery、Javascript与Html5入门\n\n事件包括鼠标位置和按键，以及与该事件相关的其他若干细节。\n\n\
    ## 事件捕获：\n\n在某些情况下，事件可能附加到按钮点击上，而该按钮可能位于超链接内部。这种情况下，元素是嵌套的。因此，当事件触发时，它会沿着DOM层级向下传递。这个过程称为事件捕获。然而，一旦事件到达目标元素，它就会沿着层级向上冒泡。这个过程称为事件冒泡。事件在层级中的这种移动为开发者提供了根据需要订阅或取消传播的机会。\n\
    \n## 订阅事件：\n\n函数 `addEventListener` 可用于订阅过程。该函数需要三个参数：事件、需要为该事件调用的函数，以及一个布尔值，该值决定函数是在捕获阶段还是冒泡阶段被调用（`true`\
    \ – 捕获，`false` – 冒泡）。通常，此值设置为 `false`。这是W3C标准中推荐的订阅方法。\n\n示例代码：\n\n```\nvar btn\
    \ = document.getElementById('btnDownload');\nbtn.addEventListener('click', initiateDownload,\
    \ false);\n```\n\n然而，也存在其他方法，包括为HTML标签提供内联订阅。这会将事件订阅到冒泡过程。使用此方法的优点在于它是最古老且最被广泛接受的方法。因此，你可以确信无论使用何种浏览器，此方法都将有效。请参阅下面的标签以了解如何操作。\n\
    \n```\n<button id='btnDownload' onclick='initiateDownload();' >Download</button>\n\
    ```\n\n你也可以使用传统的订阅流程，该流程使用JavaScript来订阅事件。\n\n```\nvar btn = document.getElementById('btnDownload');\n\
    btn.onclick = initiateDownload;\n```\n\n取消订阅：\n\n可以使用函数 `removeEventListener`\
    \ 来取消事件订阅，它接受与 `addEventListener` 相同的参数集。对于上例中使用的 `btn` 变量，可以按以下方式进行：\n\n```\n\
    var btn = document.getElementById('btnDownload');\nbtn.removeEventListener('click',\
    \ initiateDownload, false);\n```\n\n如何取消传播？\n\n函数 `stopPropagation` 用于执行此操作。可以按以下方式进行：\n\
    \n```\nvar btn = document.getElementById('btnDownload');\nbtn.addEventListener('click',\
    \ initiateDownload, false);\nfunction initiateDownload (e){\n    //下载\n    e.stopPropagation();\n\
    }\n```\n\n如何阻止默认操作？\n\n可以使用函数 `preventDefault` 按以下方式进行：\n\n```\nvar hyperlink\
    \ = document.getElementById('linkSave');\nhyperlink.addEventListener('click',\
    \ saveData, false);\nfunction saveData(e){\n    //保存数据\n    e.preventDefault();\n\
    }\n```\n\nJavaScript还提供了 *this* 关键字，如果你需要频繁访问触发事件的元素，可以使用它。\n\n## Window事件参考\n\
    \n当前浏览器窗口由 `window` 变量表示，它是 **Window对象** 的一个实例。与此对象关联的事件如下：\n\n- afterprint\n\
    - beforeonload\n- beforeprint\n- error\n- blur\n- haschange\n- load\n- message\n\
    - focus\n- online\n- offline\n- pageshow\n- pagehide\n- redo\n- popstate\n- storage\n\
    - resize\n- unload\n- undo\n\n## 表单事件参考\n\n在HTML表单内发生的操作会触发以下事件：\n\n- change\n\
    - blur\n- focus\n- contextmenu\n- forminput\n- formchange\n- invalid\n- input\n\
    - submit\n- select\n\n## 键盘事件参考\n\n键盘触发以下事件：\n\n- keyup\n- keypress\n- keydown\n\
    \n## 鼠标事件参考\n\n鼠标触发以下事件：\n\n- click\n- drag\n- drop\n- scroll\n- dblclick\n- dragenter\n\
    - dragstart\n- dragend\n- dragover\n- dragleave\n- mousemove\n- mousedown\n- mouseover\n\
    - mouseout\n- mousewheel\n- mouseup\n\n## 媒体事件参考\n\n视频、图像和音频等媒体元素也会触发事件，具体如下：\n\
    \n- canplay\n- abort\n- waiting\n- durationchange\n- canplaythrough\n- ended\n\
    - emptied\n- loadeddata\n- error\n- loadstart\n- loadedmetadata\n- play\n- pause\n\
    - progress\n- playing\n- readystatechange\n- ratechange\n- seeking\n- seeked\n\
    - suspend\n- stalled\n- volumechange\n- timeupdate\n\n## 第4章\n\n## CSS3基础\n\n\
    层叠样式表（CSS）为网页提供了其广为人知的外观呈现。虽然HTML能够为网页提供基本结构，但CSS为开发者提供了大量设计选项。除此之外，它快速且高效，这使其成为更受欢迎的设计工具。\n\
    \n已知CSS是从SGML（标准通用标记语言）发展而来。这一方向的努力旨在使网页外观标准化。该技术的最新版本是CSS3，它是一个包含50个模块的集合。\n\n\
    CSS最强大的特性是其层叠能力。简单来说，它允许网页从多个样式表中获取样式，这样，在后续读取的样式表中对样式的更改会覆盖之前一个或多个样式表中已实现的样式。\n\
    \n## 如何定义和应用样式\n\n样式的定义和应用涉及两个方面或部分，**选择器和声明块**。**选择器确定网页中需要设置样式的区域**，而**声明块描述需要实现的样式规范**。为了说明其工作原理，让我们看下面的例子：\n\
    \n```\nbody {\n    color: white;\n}\n```\n\n在这个例子中，选择器选择了网页的主体（body），声明块定义字体颜色应更改为白色。这是一个简单的例子，声明和选择器可以比这复杂得多。\n\
    \n## 如何添加注释\n\n可以使用以下格式向样式表添加注释：\n\n/*在此处编写注释*/\n\n## 如何创建内联样式\n\n每个元素都有一个关联的全局属性\
    \ `style`。可以在该元素的标签内操作此全局属性以修改该元素的外观。这种样式化不需要你指定选择器。只需要声明块。以下是操作示例：\n\n```\n<body\
    \ style='color: white;'>\n</body>\n```\n\n此HTML标签执行与上一节中指定的CSS代码相同的功能。使用此方法的优点在于，以这种方式给出的样式信息会覆盖任何其他样式信息。因此，如果你需要为某个元素使用不同的样式，而文档的其余部分需要遵循不同的样式，那么你可以为文档使用样式表，并在其标签中为该元素指定样式。\n\
    \n## 如何使用嵌入样式\n\n实现与内联样式相同结果的另一种方法是在相关元素内使用 `<style>` 元素来定义其样式规范。操作如下：\n\n```\n\
    <!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n    <title></title>\n\
    \    <style>\n        body {\n            color: white;\n        }\n    </style>\n\
    </head>\n<body>\n```\n"
