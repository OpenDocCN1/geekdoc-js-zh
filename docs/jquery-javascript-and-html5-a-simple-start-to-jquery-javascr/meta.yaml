- md: "## A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\nprints\
    \ a line on the screen to let the user know that the server is running and listening\
    \ to requests.\n\nOnce you have created the file and saved the contents of the\
    \ file as mentioned above, you must open the command prompt and write the command:\n\
    \n```\nNode myFile.js\n```\n\nNow, keeping the command prompt active, you must\
    \ open the web browser and type the address: http://localhost:8080/\n\nAs soon\
    \ as the request is sent and a response is received, the same is communicated\
    \ to the user using the console window. If you have been able to do this successfully,\
    \ then you have just created your first node.js website. If you wish to stop the\
    \ running of the code, you can just press Cntl+C.\n\nNow that you know how requests\
    \ are received, it is time to look at how these requests are processed and responses\
    \ are generated. You may need to use the url module for parsing the QueryString.\n\
    \nThe code mentioned below shows how you can parse the URL string and generate\
    \ a response in accordance with it.\n\n```javascript\nvar http = require('http');\n\
    var url = require('url');\nhttp.createServer(function (request, response) {\n\
    \    var url_parts = url.parse(request.url, true);\n    response.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n    response.end('Hey ' + url_parts.query.name\
    \ + ':\\n');\n    console.log('Handled request from ' + url_parts.query.name);\n\
    }).listen(8080, 'localhost');\nconsole.log('Server is running at: http://localhost:8080/');\n\
    ```\n\nYou can test the running of this code in the similar manner as the previous\
    \ code.\n\n## How to Create Node.js Module\n\nYou can create modules by writing\
    \ code in the form of functions and then, calling these modules from the main\
    \ code.\n\n```javascript\nvar myHttp = require('http');\nvar myUrl = require('url');\n\
    \nfunction start(){\n    http.createServer(function (request, response) {\n  \
    \      var url_parts = url.parse(request.url, true);\n        response.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n        response.end('Hello ' + url_parts.query.name\
    \ + '!\\n');\n        console.log('Handled request from ' + url_parts.query.name);\n\
    \    }).listen(8080, 'localhost');\n    console.log('Server running at http://localhost:8080/');\n\
    }\nexports.start = start;\n```\n\n## How to Create a Node.js Package\n\nwhen you\
    \ save this piece of code in a file, a module is created. This module can be used\
    \ by other functions using the require function. For instance, if the file is\
    \ saved as sample1.js, then the start() can be used in another function using:\n\
    \n```javascript\nvar samplex = require('./sample1.js');\nsample1.start();\n```\n\
    \nA collection of modules is referred to as an application. Once you have published\
    \ your package, it can be installed and used. Consider for example, a package\
    \ of different mathematical modules.\n\nThe root folder must have the following:\n\
    \n- README.md\n- \\packName\n- \\lib\n- main.js\n- \\bin\n- mod1.js\n- mod2.js\n\
    \n## Creating Aggregate Module\n\nYou may wish to make only one object for the\
    \ user to access. The user should be able to access all the modules of the package\
    \ through this object. In order to accomplish this, a main.js module must be created\
    \ in the bin folder that must define the modules to be included in the module.exports.\n\
    \n## How to Create README.md File\n\nThe README.md file is a help file that can\
    \ be used by the developer as a startup guide for using your package. The extension\
    \ of this file is .md, which is a short form for mark-down. This format gives\
    \ readability to the text written in this file.\n\nA sample file of this type\
    \ is given below:\n\n```\nsamplePackage package\n=====================\n```\n\n\
    In samplePackage, the following functions are available:\n\n- **add** Performs\
    \ addition of two numbers and presents the result.\n- **sub** Performs subtraction\
    \ of one number from the other and presents the result.\n\n## How to Create package.json\
    \ File\n\nThis file contains the metadata for the package and can be created manually\
    \ using the command:\n\n```\nnpm init\n```\n\nThis command creates the file, which\
    \ can later be edited. A sample file is given below:\n\n```json\n{\n  \"name\"\
    : \"sampleFile\",\n  \"version\": \"0.0.0\",\n  \"description\": \"This is a sample\
    \ file \",\n  \"main\": \"bin/main.js\",\n  \"scripts\": {\n    \"test\": \"echo\
    \ \\\"This is a test file\\\" && exit 1\"\n  },\n  \"repository\": \"\",\n  \"\
    keywords\": [\n    \"sample\",\n    \"example\",\n    \"add\",\n    \"sub\"\n\
    \  ],\n  \"author\": \"XYZ\",\n  \"license\": \"ABC\"\n}\n```\n\nIn addition to\
    \ test scripts, you can also give git scripts, which are the best available source\
    \ control managers.\n\n## How to Publish a Package\n\nAs mentioned previously,\
    \ a package can be defined in terms of a folder structure. When you publish your\
    \ package, you make it accessible to all users. In order to perform this operation,\
    \ you must use the npm command, which is also the command used for searching and\
    \ installing packages. However, you shall be required to create an account for\
    \ yourself before publishing any of your packages using the command: npm adduser.\
    \ After you enter the required information, your account is created. However,\
    \ what this also means is that there is no validation required. Therefore, anyone\
    \ can add code to the repository. Therefore, you should be careful while downloading\
    \ and installing packages from the registry.\n\nIn order to publish a package,\
    \ you simply need to go to the root directory of the package and enter the command\
    \ npm publish in the command prompt.\n\n## How to Install and Use the Package\n\
    \nA package that is published can be downloaded and installed by any user. You\
    \ simply need to go to the folder and give the command, npm install samplePackage.\
    \ This installs the package locally. On the other hand, if you wish to install\
    \ the package globally, you can give the command, npm install -g samplePackage.\
    \ For a global installation, you will need to create a link from each application\
    \ to the global install using the command, npm link samplePackage.\n\nThe route\
    \ to a global install is a junction. You can get into the node_modules folder\
    \ and back using the cd command. Once you are inside the folder, you can give\
    \ the command: npm install contoso, to initiate an install. You can now write\
    \ some code that uses the package. A sample is given below:\n\n```javascript\n\
    var samplePackage = require('samplePackage');\nvar finalResult = 0;\n\nconsole.log();\n\
