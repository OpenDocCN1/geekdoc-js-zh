- md: "## A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\n变量已声明。这被称为局部作用域。与许多其他语言（通过变量所在的花括号来定义局部作用域）不同，<mark>JavaScript\
    \ 的局部作用域与函数作用域相同</mark>。\n\n此外，<mark>JavaScript 还支持全局作用域的概念</mark>，其中变量可以被声明为全局变量，因此可以在程序的任何地方使用。\n\
    \n## 嵌套函数\n\n函数可以在任何级别嵌套。换句话说，一个函数可以从另一个函数内部被调用，而后者可能从不同的函数中被调用。然而，需要注意的是，变量的作用域仅限于声明它们的函数内部。\n\
    \n## 数据类型转换\n\n前面讨论的 prompt 函数返回一个字符串。但是，您要求用户输入一个数字。在这种情况下，可能需要将字符串转换为数字。在 JavaScript\
    \ 中，可以使用以下函数将变量从一种类型转换为另一种类型：\n\n- **Number 函数**\n    该函数将其接收到的对象转换为数字数据类型。但是，如果函数无法执行转换，则返回\
    \ *NaN*。\n- **String 函数**\n    该函数将其接收到的对象转换为字符串数据类型。\n\n## 条件编程\n\n编写代码时，您会遇到多种情况，需要在条件为真时执行一组指令，而在条件为假时执行另一组指令。\n\
    \n### if-else\n\n为了实现这种场景，您可以使用 if-else 结构。\n\n语法：\n\n```\nIf(condition)\n{\n\
    \    //code\n}\nelse\n{\n    //code\n}\n```\n\n考虑一个场景，您要求用户使用 prompt 函数输入其年龄。现在，您必须在对提供的值执行任何计算之前，验证该年龄是否为一个有效的数字。这是实现条件编程的一个理想场景。此场景的示例实现如下：\n\
    \n```\nvar userAge = prompt('Enter your age: ', '');\nif(isNaN(userAge))\n{\n\
    \    alert('Age entered is invalid!');\n}\nelse\n{\n    //code\n}\n```\n\n在此示例代码中，if\
    \ 子句检查输入的值是否为数字。如果条件为真，即输入的对象不是数字，则向用户显示一条警告消息。但是，如果条件为假，则执行 else 中的代码。\n\n需要注意的是，对于单条语句，不一定需要使用花括号。上述代码也可以写成：\n\
    \n```\nvar userAge = prompt('Enter your age: ', \"\");\n\nif(isNaN(userAge))\n\
    \    alert('Age entered is invalid!');\nelse\n    //code\n```\n\n然而，使用花括号是一个好习惯，因为以后有添加额外代码的空间。\n\
    \n### if-else if\n\n另一种条件编程结构是 if- else if 结构。此结构允许您声明多个条件及其关联的操作。语法是：\n\n```\n\
    if(condition)\n{\n    //code\n}\nelse if(condition)\n{\n    //code\n}\nelse\n\
    {\n    //code\n}\n```\n\n### Switch\n\n多个 else if 可以使用此结构实现。由于条件是顺序检查有效性，因此此条件编程结构的执行开销很高。作为替代方案，另一个关键字\
    \ `switch` 可用，它以跳转表的形式实现多个条件。因此，`switch` 的执行开销比 if-else if 小。\n\n示例实现：\n\n```\n\
    var userChoice = prompt('Choose an alphabet: a, b, c', 'e');\n\nswitch (userChoice)\
    \ {\n  case 'a':\n    alert('a chosen\\n');\n    break;\n  case 'b':\n    alert('b\
    \ chosen\\n');\n    break;\n  case 'c':\n    alert('c chosen\\n');\n    break;\n\
    \  default:\n    alert('None of the alphabets chosen\\n');\n    break;\n};\n```\n\
    \n`switch` 结构将用户输入的值与 case 中的值进行匹配。如果找到匹配值，则执行该 case。但是，如果没有一个 case 值与输入匹配，则执行\
    \ default case。除此之外，您还可以在 case 值中使用条件，条件为真的 case 将被执行。\n\n如果您不在 case 代码后使用 `break`\
    \ 语句，则匹配 case 之后的所有 case 都将被执行。例如，如果用户在上例中输入 'b'，并且在 case 代码后没有 `break` 语句，则输出将是：\n\
    \n```\nb chosen\nc chosen\nNone of the alphabets chosen\n```\n\n另外，在 default case\
    \ 中使用 `break` 语句也是一个好习惯。\n\n**注意：**\n\n如果您想确定一个关键字是否已被赋值，可以使用以下代码：\n\n```\nif(c)\n\
    {\n    //code\n}\nelse\n{\n    //code\n}\n```\n\n如果变量 `c` 被赋予了非空值，则 if 条件为真，并执行相应的代码。另一方面，如果变量\
    \ `c` 的值是 undefined 或 null，则执行 else 结构中的代码。\n\n**注意：**\n\n以下条件的值将始终为真：\n\n```\n\
    \"\" == 0\nnull == undefined\n'123' == 123\nfalse == 0;\n```\n\n请注意，JavaScript\
    \ 为了在比较中兼容，会转换相关变量的类型。\n\n但是，如果您想比较两个变量的值和类型，那么 JavaScript 提供了另一组运算符 `===` 和 `!==`。当使用此运算符对上述示例中的值进行比较时，结果将始终为\
    \ false。\n\n## 实现代码循环\n\n循环是任何编程语言中一个重要的、常用的结构。当您需要多次执行同一组指令时，就会面临多种情况。为了实现这种场景，必须使用循环。JavaScript\
    \ 中可用的循环结构包括 `for`、`while` 和 `do-while`。\n\n`while` 循环包含一个条件，只要条件保持为真，循环就会继续执行。`do-while`\
    \ 循环是 `while` 循环的修改版。如果 `while` 中的条件为假，则 `while` 循环根本不会执行。另一方面，即使 `while` 条件为假，`do-while`\
    \ 循环也会至少执行一次。\n\n`while` 循环的语法：\n\n```\nwhile(condition)\n{\n    //code\n}\n```\n\
    \n`do-while` 循环的语法：\n\n```\ndo\n{\n    //code\n}\nwhile(condition)\n```\n\nJavaScript\
    \ 中最后一种可用的循环是 `for` 循环。`for` 循环允许您在同一条语句中初始化循环变量、检查条件和修改循环变量。\n\n语法：\n\n```\n\
    for(initialize; condition; modify)\n{\n    //code\n}\n```\n\n示例代码：\n\n```\nfor(i=0;\
    \ i<10; i=i+1)\n{\n    //code\n}\n```\n\n此循环将运行 10 次。\n\n**注意：**\n\n1.  如果在任何时候您希望中断循环，可以使用\
    \ `break` 语句。\n2.  如果您未指定条件或指定的条件始终为真，则循环将无限运行。\n\n## 错误处理\n\n预期在代码的多个点会发生异常。因此，最好实现一种可以帮助您处理这些异常并避免崩溃的机制。\n\
    \n异常可以描述为非法操作或任何意外且不寻常的情况。异常的一些示例包括未经授权的内存访问。"
  mdcn: "\n## 初学者简易入门 jQuery、JavaScript 与 HTML5\n\n变量已声明。这被称为局部作用域。与许多其他语言（通过变量所在的花括号来定义局部作用域）不同，<mark>JavaScript\
    \ 的局部作用域与函数作用域相同</mark>。\n\n此外，<mark>JavaScript 还支持全局作用域的概念</mark>，其中变量可以被声明为全局变量，因此可以在程序的任何地方使用。\n\
    \n## 嵌套函数\n\n函数可以在任何级别嵌套。换句话说，一个函数可以从另一个函数内部被调用，而后者可能从不同的函数中被调用。然而，需要注意的是，变量的作用域仅限于声明它们的函数内部。\n\
    \n## 数据类型转换\n\n前面讨论的 prompt 函数返回一个字符串。但是，您要求用户输入一个数字。在这种情况下，可能需要将字符串转换为数字。在 JavaScript\
    \ 中，可以使用以下函数将变量从一种类型转换为另一种类型：\n\n- **Number 函数**\n    该函数将其接收到的对象转换为数字数据类型。但是，如果函数无法执行转换，则返回\
    \ *NaN*。\n- **String 函数**\n    该函数将其接收到的对象转换为字符串数据类型。\n\n## 条件编程\n\n编写代码时，您会遇到多种情况，需要在条件为真时执行一组指令，而在条件为假时执行另一组指令。\n\
    \n### if-else\n\n为了实现这种场景，您可以使用 if-else 结构。\n\n语法：\n\n```\nIf(condition)\n{\n\
    \    //code\n}\nelse\n{\n    //code\n}\n```\n\n考虑一个场景，您要求用户使用 prompt 函数输入其年龄。现在，您必须在对提供的值执行任何计算之前，验证该年龄是否为一个有效的数字。这是实现条件编程的一个理想场景。此场景的示例实现如下：\n\
    \n```\nvar userAge = prompt('Enter your age: ', '');\nif(isNaN(userAge))\n{\n\
    \    alert('Age entered is invalid!');\n}\nelse\n{\n    //code\n}\n```\n\n在此示例代码中，if\
    \ 子句检查输入的值是否为数字。如果条件为真，即输入的对象不是数字，则向用户显示一条警告消息。但是，如果条件为假，则执行 else 中的代码。\n\n需要注意的是，对于单条语句，不一定需要使用花括号。上述代码也可以写成：\n\
    \n```\nvar userAge = prompt('Enter your age: ', \"\");\n\nif(isNaN(userAge))\n\
    \    alert('Age entered is invalid!');\nelse\n    //code\n```\n\n然而，使用花括号是一个好习惯，因为以后有添加额外代码的空间。\n\
    \n### if-else if\n\n另一种条件编程结构是 if- else if 结构。此结构允许您声明多个条件及其关联的操作。语法是：\n\n```\n\
    if(condition)\n{\n    //code\n}\nelse if(condition)\n{\n    //code\n}\nelse\n\
    {\n    //code\n}\n```\n\n### Switch\n\n多个 else if 可以使用此结构实现。由于条件是顺序检查有效性，因此此条件编程结构的执行开销很高。作为替代方案，另一个关键字\
    \ `switch` 可用，它以跳转表的形式实现多个条件。因此，`switch` 的执行开销比 if-else if 小。\n\n示例实现：\n\n```\n\
    var userChoice = prompt('Choose an alphabet: a, b, c', 'e');\n\nswitch (userChoice)\
    \ {\n  case 'a':\n    alert('a chosen\\n');\n    break;\n  case 'b':\n    alert('b\
    \ chosen\\n');\n    break;\n  case 'c':\n    alert('c chosen\\n');\n    break;\n\
    \  default:\n    alert('None of the alphabets chosen\\n');\n    break;\n};\n```\n\
    \n`switch` 结构将用户输入的值与 case 中的值进行匹配。如果找到匹配值，则执行该 case。但是，如果没有一个 case 值与输入匹配，则执行\
    \ default case。除此之外，您还可以在 case 值中使用条件，条件为真的 case 将被执行。\n\n如果您不在 case 代码后使用 `break`\
    \ 语句，则匹配 case 之后的所有 case 都将被执行。例如，如果用户在上例中输入 'b'，并且在 case 代码后没有 `break` 语句，则输出将是：\n\
    \n```\nb chosen\nc chosen\nNone of the alphabets chosen\n```\n\n另外，在 default case\
    \ 中使用 `break` 语句也是一个好习惯。\n\n**注意：**\n\n如果您想确定一个关键字是否已被赋值，可以使用以下代码：\n\n```\nif(c)\n\
    {\n    //code\n}\nelse\n{\n    //code\n}\n```\n\n如果变量 `c` 被赋予了非空值，则 if 条件为真，并执行相应的代码。另一方面，如果变量\
    \ `c` 的值是 undefined 或 null，则执行 else 结构中的代码。\n\n**注意：**\n\n以下条件的值将始终为真：\n\n```\n\
    \"\" == 0\nnull == undefined\n'123' == 123\nfalse == 0;\n```\n\n请注意，JavaScript\
    \ 为了在比较中兼容，会转换相关变量的类型。\n\n但是，如果您想比较两个变量的值和类型，那么 JavaScript 提供了另一组运算符 `===` 和 `!==`。当使用此运算符对上述示例中的值进行比较时，结果将始终为\
    \ false。\n\n## 实现代码循环\n\n循环是任何编程语言中一个重要的、常用的结构。当您需要多次执行同一组指令时，就会面临多种情况。为了实现这种场景，必须使用循环。JavaScript\
    \ 中可用的循环结构包括 `for`、`while` 和 `do-while`。\n\n`while` 循环包含一个条件，只要条件保持为真，循环就会继续执行。`do-while`\
    \ 循环是 `while` 循环的修改版。如果 `while` 中的条件为假，则 `while` 循环根本不会执行。另一方面，即使 `while` 条件为假，`do-while`\
    \ 循环也会至少执行一次。\n\n`while` 循环的语法：\n\n```\nwhile(condition)\n{\n    //code\n}\n```\n\
    \n`do-while` 循环的语法：\n\n```\ndo\n{\n    //code\n}\nwhile(condition)\n```\n\nJavaScript\
    \ 中最后一种可用的循环是 `for` 循环。`for` 循环允许您在同一条语句中初始化循环变量、检查条件和修改循环变量。\n\n语法：\n\n```\n\
    for(initialize; condition; modify)\n{\n    //code\n}\n```\n\n示例代码：\n\n```\nfor(i=0;\
    \ i<10; i=i+1)\n{\n    //code\n}\n```\n\n此循环将运行 10 次。\n\n**注意：**\n\n1.  如果在任何时候您希望中断循环，可以使用\
    \ `break` 语句。\n2.  如果您未指定条件或指定的条件始终为真，则循环将无限运行。\n\n## 错误处理\n\n预期在代码的多个点会发生异常。因此，最好实现一种可以帮助您处理这些异常并避免崩溃的机制。\n\
    \n异常可以描述为非法操作或任何意外且不寻常的情况。异常的一些示例包括未经授权的内存访问。\n"
