  mdcn: "\n## 面向初学者的 jQuery、Javascript 与 HTML5 简单入门\n\n不精确的结果。因此，这些值必须被截断。\n\n除了数字和字符串，JavaScript\
    \ 还支持使用以下特殊字符。\n\n- `undefined` 表示该值尚未被赋值。\n- `NaN` 代表 'Not a Number'（非数字）。\n\
    - `-Infinity` 任何小于 -1.7976931348623157E + 10308 的数字都由 `-Infinity` 表示。\n- `Infinity`\
    \ 任何超过值 1.7976931348623157E + 10308 的数字都由 `Infinity` 表示。\n\n# 字符串数据类型\n\n字符串可以简单地描述为字符的集合。无论何时，只要你用引号声明了字符，系统都会将其解释为一个字符串。示例字符串包括：\n\
    \n> 'Hello World!'\n\n\"Hello World!\"\n\n然而，如果你想将引号本身作为字符包含在字符串中，则必须在引号前添加 '\\\
    \\'。\n示例字符串：\n'You\\'re Welcome'\n\"You\\'re Welcome\"\n\nJavaScript 还支持其他转义序列，例如\
    \ `\\t` 代表制表符，`\\n` 代表换行符。\n\n# 布尔数据类型\n\n布尔数据类型是一种二元数据类型，返回 `true` 或 `false`。这些运算符通常用于表示比较的结果。例如，`10\
    \ > 5` 将得到 'true'，而 `5 > 10` 将得到 'false'。\n\n# 数字数据类型的操作\n\n为了执行计算，需要使用运算符。JavaScript\
    \ 支持所有基本运算符，运算符优先级如下：\n\n- 加法和减法具有相同的优先级。\n- 乘法和除法具有相同的优先级。\n- 乘法和除法的优先级高于加法和减法。\n\
    - 如果一个表达式包含多个具有相同优先级的运算符，则该表达式从左到右进行计算。\n\n除了基本运算符，JavaScript 还支持取模（`%`）运算符。此运算符执行除法并返回余数作为结果。例如，`23\
    \ % 7` 等于 2。\n\n# 一元运算符\n\n像加法和减法这样的运算符需要两个操作数才能执行，而有些运算符只需要一个。这类运算符的一个例子是 `typeof`，它返回数据的数据类型。例如，`typeof\
    \ 12` 返回 'number'。请注意，'+' 和 '-' 也可以用作一元运算符。这是当它们被用来指定一个数字的符号时的情况。\n\n# 逻辑运算符\n\
    \nJavaScript 中可用三种逻辑运算符，即 Not (!)、Or (||) 和 And (&&)。涉及这些运算符的操作结果是布尔值（`true` 或\
    \ `false`）。这些操作的结果根据以下规则计算：\n\n| 运算符 | 描述 |\n| --- | --- |\n| AND (&&) | 二元运算符<br>两个条件都必须为真\
    \ |\n| OR (\\|\\|) | 二元运算符<br>至少一个条件必须为真 |\n| NOT (!) | 一元运算符<br>条件的值取反 |\n\n\
    例如，\n\n'Red' != 'Blue' && 5 > 1 = 'true'\n\n'Red' != 'Blue' && 5 < 1 = 'false'\n\
    \n'Red' == 'Blue' && 5 < 1 = 'false'\n\n对于条件运算符，JavaScript 使用短路求值。换句话说，如果第一个条件的值被计算为\
    \ 'false'，系统就不会评估其他条件，而是直接呈现结果。\n\n# 在 JavaScript 中编写代码\n\n任何以分号结尾的语句都称为一条语句。这条语句可能产生也可能不产生一个值，不像表达式，它们必然会产生一个值。\n\
    \n# 变量\n\n数据的处理是借助变量完成的。数据被存储在内存中，而对这个内存位置的命名引用就称为一个变量。任何标识符都可以通过在其前面加上关键字 `var`\
    \ 来声明为一个变量。一个变量声明的示例如下：\n\n```\nvar result;\n```\n\n此语句声明了一个变量 *result*。你也可以在声明变量时同时定义它，使用像这样的语句：\n\
    \n```\nvar result = 0;\n```\n\n或者\n\n```\nvar result = 23*4+6;\n```\n\n在命名变量时必须遵循某些规则。这些规则如下：\n\
    \n- 变量名可以是数字和字符的组合。\n- 变量名不能以数字开头。\n- 变量名中唯一允许的特殊字符是下划线 (_) 和美元符号($)。\n- 变量名中不应有任何空格。例如，'result\
    \ value' 是不允许的。\n- JavaScript 关键字是保留的，不能用作变量名。\n\n请注意，**JavaScript** 与 HTML 不同，**区分大小写**。因此，`VAL`\
    \ 和 `val` 是两个不同的变量。此外，建议变量名应能描述其用途。例如，如果我们命名一个变量为 `result`，很明显这个变量将包含代码计算出的结果值。\n\
    \nJavaScript 中使用的另一个惯例是变量名的第一个字母小写。但是，变量名中的每个后续单词都以大写字母开头。一个例子是变量名 `arrayResult`。除此之外，不鼓励使用下划线和美元符号。不过，它们在\
    \ jQuery 对象中会用到。\n\n# 环境\n\n一组完整的变量及其包含的值构成了所谓的环境。因此，每当你在浏览器中加载一个新网页时，你就是在创建一个新的环境。以\
    \ Windows 8 为例，它在应用程序启动时创建一个环境，并在应用程序结束时销毁该环境。\n\n# 函数\n\n一组旨在解决特定目的的语句称为一个函数。使用函数的目的是代码重用。如果你的程序在多处使用相同的功能，则将其作为函数实现，可以在需要时随时调用。由于函数是从代码内部调用的，因此可以从代码向函数传递参数。执行后，函数会向调用它的函数返回一个值。函数声明和定义的语法如下：\n\
    \n```\nfunction multiply(a, b){\n\nreturn a*b;\n\n}\n```\n\n**函数名前面必须始终带有关键字 `function`。**\
    \ 变量 `a` 和 `b` 是传递给函数的参数，该函数返回通过计算 `a*b` 得到的值。这是一个简单的函数，但你可以根据所需的功能实现复杂和大型的函数。\n\
    \n既然你已经实现了函数，你一定想知道如何调用这个函数。这里有一个例子：\n\n```\nvar x=2;\n\nvar y=5\n\nvar c=multiply(x,\
    \ y);\n```\n\n这里，`x` 和 `y` 是函数 `multiply` 将作为参数接收的实参。\n\nJavaScript 是一种弱类型语言。这意味着如果你传递给函数的参数数量多于其预期，系统将只使用所需的前\
    \ n 个参数，而丢弃其余部分。此功能的优点是你可以使用已实现的函数，并传递额外的参数来扩展该函数并为其添加功能。另一方面，如果你无意中传递了错误数量的参数，你将无法得到任何错误提示。\n\
    \nJavaScript 还提供了一些内置函数来与用户交互。这些函数如下：\n\n- `alert`：此函数显示一个带有消息的警告框，用户单击“确定”按钮后系统恢复操作。示例实现：\n\
    \    - `alert('Alert message!');`\n- `prompt`：此函数向用户显示一个文本框，并要求其输入。你可以在显示的文本框中提供默认值，用户可以单击“确定”按钮以接受输入的值是正确的。示例实现：\n\
    \    - `var result = prompt('Enter a value', 'default value');`\n- `confirm`：此消息向用户提供选择以“确定”或“取消”某个操作。示例实现：\n\
    \    - `var result = confirm('Do you wish to proceed?');`\n\n# 函数作用域\n\n你声明的每个变量都拥有一个作用范围，即该变量在其中有效的函数内部。\n"
