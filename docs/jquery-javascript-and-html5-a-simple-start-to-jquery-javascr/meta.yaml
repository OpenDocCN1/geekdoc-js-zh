- md: "# A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\nto this,\
    \ HTML5 adds the meaning 'span of text with special focus, but no change in mood,\
    \ importance level or implication.'\n\nAlthough, the use of the bold style makes\
    \ more sense in this context, but you can still use this element for denoting\
    \ names of products in reviews or keywords. Similarly, the element <strong> indicates\
    \ the relative importance of content and <i> denotes a change in mood or implication\
    \ of the content concerned. Besides this, the <em> element is used for text that\
    \ will be alternatively pronounced by the reader.\n\n## How to Use <abbr> for\
    \ Acronyms and Abbreviations?\n\nIn the previous versions of HTML, the <acronym>\
    \ element was used for this purpose. However, this element has become obsolete\
    \ and the new element used for this purpose is <abbr>. It is an inline element,\
    \ which is generally used with other inline elements like <em> and <strong>.\n\
    \n## Element - <address>\n\nThis element is used for defining the contact information\
    \ of the owner or the author of the webpage.\n\n## Quotations and Citations\n\n\
    You can indicate that a particular text is a quote by using the element <blockquote>,\
    \ which is used for a long quotation, and <q>, which is used for an inline quotation.\
    \ You can mention the source of the quotation using the cite attribute or the\
    \ <cite> element. However, using the <cite> element inside <q> and <blockquote>\
    \ elements is considered a better approach. Please remember that the <cite> element\
    \ can only mention the name of the work and other information elements like author's\
    \ name and location of publishing, are not included here.\n\n## How to Document\
    \ Code in HTML5?\n\nThere are two elements, <code> and <samp>, are used for documenting\
    \ code. While the element <code> is used for documenting the source code, the\
    \ element <samp> is used for the output of the code. A sample HTML for how this\
    \ is done is given below:\n\n```\n<code class=\"maintainWhiteSpace\">  \nechoContent('Screen');\n\
    function echoContent(name)\n{\nalert('This is' + name + '.');\n}\n</code>\n<samp\
    \ class=\"maintainWhiteSpace\">\nThis is Screen.\n</samp>\n```\n\n## The <pre>\
    \ Element\n\nIt is important to mention here that these elements do not preserve\
    \ the whitespace. Therefore, a class needs to be implemented for this purpose.\
    \ This class should look like:\n\nstyle rule.\n\n```\n.maintainWhiteSpace {\n\
    white-space: pre;\n}\n```\n\nSome browsers may not support this style rule. Therefore,\
    \ for such browsers, it is advisable to use the element `<pre>`. Therefore, `<pre>`\
    \ element can be used for defining the pre-formatting rules.\n\n## The <var> Element\n\
    \nThis element is used to declare that the text specified inside it, is a variable.\
    \ Example:\n\n```\n<p>\nThe variable <var>i</var> represents the number of iterations\
    \ for the loop to perform.\n</p>\n```\n\n## The <br /> and <wbr /> Elements\n\n\
    The `<br/>` element implements a line break. On the other hand, the `<wbr/>` implements\
    \ a word break.\n\n## The <dfn> Element\n\nThere may be occasions when you wish\
    \ to define a term. This can be done using the `<dfn>` element, which takes title\
    \ as one of its attributes.\n\n## Working with Figures\n\nImages and figures are\
    \ an integral part of any webpage content. Therefore, every figure can also be\
    \ viewed as a unit of content, which may consist of a caption and a reference\
    \ from the page to which it may belong. In order to define one or more images,\
    \ the `<figure>` element is used. The element `<figcaption>` can be used for defining\
    \ the caption of the figure.\n\nHowever, it is important to mention here that\
    \ the `<figure>` element does not give any importance to the position of the figure\
    \ and the same is included along with the content. However, if the position and\
    \ location of the figure is of importance to you, then you must consider using\
    \ the `<div>` element.\n\n## The `<summary>` and `<details>` Elements\n\nThe element\
    \ `<summary>` contains the summary of the content of the webpage, which can be\
    \ displayed in the form of a collapsible list using the `<details>` element. Therefore,\
    \ when you load a page, only the contents of the `<summary>` element will be displayed,\
    \ while the contents of the `<details>` element are displayed when the user clicks\
    \ on the summary.\n\n## Other Annotations\n\nIn addition to the above mentioned,\
    \ there are a few more annotations available, which include:\n\n- <s> - Used for\
    \ striking out text\n- <u> - Used for underlining text\n- <mark> - Used for highlighting\
    \ text\n- <ins> - Used for indicating that the text has been inserted\n- <del>\
    \ - Used for indicating that the text has been deleted\n- <small> - used for indicating\
    \ that the text must be printed in fine letters\n- <sub> - Indicates that the\
    \ text is a subscript\n- <sup> - Indicates that the text is a superscript\n- <time>\
    \ - Used for indicating that the text denotes time and date\n- <kbd> - used for\
    \ indicating that the text is a user input\n\n## Language Elements\n\nYou may\
    \ need to use characters of Chinese, Japanese or Korean origin in your text. In\
    \ order to support this inclusion, the element `<ruby>` can be used. Inside this\
    \ element, other elements like `<bdi>` and `<bdo>`, for defining the isolation\
    \ and direction of text. Besides this, `<rt>` and `<rp>` elements can also be\
    \ used for placing notation or parentheses in the text of `<ruby>` element.\n\n\
    ## Working with Lists\n\nIn HTML5, several elements for defining unordered, ordered\
    \ and descriptive lists exist. A fourth category of 'Custom lists' is also present\
    \ to allow customization by the developer. The list items for all these are declared\
    \ using the `<li>` element. Moreover, all the three types of lists support list\
    \ nesting.\n\n### Ordered Lists\n\nOrdered lists are declared using the element\
    \ `<ol>` and the elements of 'order' in this list are brought about by an automatic\
    \ numbering of the elements that are included in this list. The attributes that\
    \ can be used with ordered lists include:\n\n- start - Used to set the starting\
    \ number of the list\n- reversed - Used for declaring if the list has to be ordered\
    \ in an ascending or descending order\n- type – Used for declaring the type of\
    \ the list, which can be A, a, 1 or I.\n\n### Unordered Lists\n\nThis type of\
    \ a list is declared using the <ul> element and there is no numbering of elements\
    \ in this case. The elements of the lists are simply represented as bullet points.\n\
    \n### Description Lists\n\nThis type of a list is declared using the <dl> element.\
    \ Using this element, you can give a description containing zero or more terms.\
    \ Besides this, the elements of the list are declared using the <dt> element,\
    \ which specifies the term, and <dd>, which gives a description of the term.\n\
    \n### Custom Lists\n\nThe developer can make use of CSS styles to create custom\
    \ lists. In this case, a different style rule can be created for each level of\
    \ a nested list.\n\n## Working with Tables\n\nAnother format for arranging and\
    \ presenting data in webpages is tables. Tables are declared using the <table>\
    \ element and represents data in a rows-columns format. The cells of the tables\
    \ are defined using the <tr> and <td> elements. While <tr> is used for rows, <td>\
    \ is used for columns.\n\nDespite that fact that HTML5 tables are one of the most\
    \ powerful constructs available to the developer, it is important to understand\
    \ how and where tables can be most appropriately used. Here are the reasons why\
    \ tables should not be used:\n\n- The table created for a webpage is not rendered\
    \ until the </table> tag is read. On the other hand, if the same construct is\
    \ created using the <div> element, the content will be rendered as it is read.\n\
    - Tables are extremely difficult to maintain."
  mdcn: "\n# 初学者的 jQuery、Javascript 和 Html5 入门指南\n\n与此不同，HTML5 为 `<b>` 元素赋予了“具有特殊强调意义的文本段落，但不改变语气、重要程度或含义”的含义。\n\
    \n虽然在此上下文中使用粗体样式更为合理，但您仍可使用此元素来标记产品评论中的产品名称或关键词。同样，`<strong>` 元素表示内容的相对重要性，而 `<i>`\
    \ 元素则表示相关内容的语气或含义发生变化。此外，`<em>` 元素用于标记读者会以不同方式朗读的文本。\n\n## 如何使用 `<abbr>` 表示首字母缩写词和缩写？\n\
    \n在 HTML 的早期版本中，`<acronym>` 元素用于此目的。然而，该元素已被弃用，现在用于此目的的新元素是 `<abbr>`。它是一个内联元素，通常与其他内联元素（如\
    \ `<em>` 和 `<strong>`）一起使用。\n\n## `<address>` 元素\n\n此元素用于定义网页所有者或作者的联系信息。\n\n\
    ## 引用\n\n您可以使用 `<blockquote>` 元素（用于长引用）和 `<q>` 元素（用于内联引用）来表示特定文本为引用。您可以使用 `cite`\
    \ 属性或 `<cite>` 元素来提及引用的来源。然而，在 `<q>` 和 `<blockquote>` 元素内部使用 `<cite>` 元素被认为是更好的做法。请记住，`<cite>`\
    \ 元素只能提及作品的名称，不包含作者姓名和出版地点等其他信息元素。\n\n## 如何在 HTML5 中记录代码？\n\n`<code>` 和 `<samp>`\
    \ 两个元素用于记录代码。`<code>` 元素用于记录源代码，而 `<samp>` 元素用于记录代码的输出。下面是一个示例 HTML，展示了如何实现这一点：\n\
    \n```\n<code class=\"maintainWhiteSpace\">  \nechoContent('Screen');\nfunction\
    \ echoContent(name)\n{\nalert('This is' + name + '.');\n}\n</code>\n<samp class=\"\
    maintainWhiteSpace\">\nThis is Screen.\n</samp>\n```\n\n## `<pre>` 元素\n\n这里需要强调的是，这些元素不会保留空白字符。因此，需要为此实现一个类。该类应如下所示：\n\
    \n样式规则。\n\n```\n.maintainWhiteSpace {\nwhite-space: pre;\n}\n```\n\n某些浏览器可能不支持此样式规则。因此，对于此类浏览器，建议使用\
    \ `<pre>` 元素。因此，`<pre>` 元素可用于定义预格式化规则。\n\n## `<var>` 元素\n\n此元素用于声明其内部指定的文本是一个变量。例如：\n\
    \n```\n<p>\n变量 <var>i</var> 表示循环执行的迭代次数。\n</p>\n```\n\n## `<br />` 和 `<wbr />`\
    \ 元素\n\n`<br/>` 元素实现换行。另一方面，`<wbr/>` 实现单词间换行。\n\n## `<dfn>` 元素\n\n有时您可能希望定义一个术语。这可以使用\
    \ `<dfn>` 元素来完成，该元素将 `title` 作为其属性之一。\n\n## 处理图形\n\n图片和图形是任何网页内容不可或缺的一部分。因此，每个图形也可以被视为一个内容单元，该单元可能包含标题和指向其所属页面的引用。为了定义一个或多个图像，使用\
    \ `<figure>` 元素。`<figcaption>` 元素可用于定义图形的标题。\n\n然而，这里需要强调的是，`<figure>` 元素不会对图形的位置给予任何重视，图形会随内容一起包含。但是，如果图形的位置和位置对您很重要，则必须考虑使用\
    \ `<div>` 元素。\n\n## `<summary>` 和 `<details>` 元素\n\n`<summary>` 元素包含网页内容的摘要，可以使用\
    \ `<details>` 元素以可折叠列表的形式显示。因此，当您加载页面时，只会显示 `<summary>` 元素的内容，而 `<details>` 元素的内容则在用户单击摘要时显示。\n\
    \n## 其他注释\n\n除了上述内容外，还有更多可用的注释，包括：\n\n- <s> - 用于删除文本\n- <u> - 用于为文本添加下划线\n- <mark>\
    \ - 用于高亮显示文本\n- <ins> - 用于指示文本已被插入\n- <del> - 用于指示文本已被删除\n- <small> - 用于指示文本必须以小字体打印\n\
    - <sub> - 表示文本是下标\n- <sup> - 表示文本是上标\n- <time> - 用于指示文本表示时间和日期\n- <kbd> - 用于指示文本是用户输入\n\
    \n## 语言元素\n\n您可能需要在文本中使用中文、日文或韩文字符。为了支持这种包含，可以使用 `<ruby>` 元素。在此元素内部，可以使用其他元素（如\
    \ `<bdi>` 和 `<bdo>`）来定义文本的隔离和方向。此外，还可以使用 `<rt>` 和 `<rp>` 元素在 `<ruby>` 元素的文本中放置注释或括号。\n\
    \n## 处理列表\n\n在 HTML5 中，存在用于定义无序列表、有序列表和描述性列表的多个元素。还存在第四个类别“自定义列表”，允许开发者进行自定义。所有这些的列表项都使用\
    \ `<li>` 元素声明。此外，所有三种类型的列表都支持列表嵌套。\n\n### 有序列表\n\n有序列表使用 `<ol>` 元素声明，此列表中的“顺序”元素通过自动编号包含在此列表中的元素来实现。可用于有序列表的属性包括：\n\
    \n- start - 用于设置列表的起始编号\n- reversed - 用于声明列表必须按升序还是降序排序\n- type – 用于声明列表的类型，可以是\
    \ A、a、1 或 I。\n\n### 无序列表\n\n这种类型的列表使用 `<ul>` 元素声明，此情况下没有元素编号。列表的元素简单地表示为项目符号。\n\
    \n### 描述性列表\n\n这种类型的列表使用 `<dl>` 元素声明。使用此元素，您可以提供包含零个或多个术语的描述。此外，列表的元素使用 `<dt>`\
    \ 元素（指定术语）和 `<dd>` 元素（提供术语的描述）声明。\n\n### 自定义列表\n\n开发者可以利用 CSS 样式创建自定义列表。在这种情况下，可以为嵌套列表的每个级别创建不同的样式规则。\n\
    \n## 处理表格\n\n在网页中排列和呈现数据的另一种格式是表格。表格使用 `<table>` 元素声明，以行-列格式表示数据。表格的单元格使用 `<tr>`\
    \ 和 `<td>` 元素定义。`<tr>` 用于行，`<td>` 用于列。\n\n尽管 HTML5 表格是开发者可用的最强大的结构之一，但理解如何以及在哪里最恰当地使用表格非常重要。以下是不应使用表格的原因：\n\
    \n- 为网页创建的表格在读取 `</table>` 标签之前不会渲染。另一方面，如果使用 `<div>` 元素创建相同的结构，内容将在读取时立即渲染。\n\
    - 表格极其难以维护。\n"
