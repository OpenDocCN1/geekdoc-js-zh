- md: "## How to Create External Style Sheet\n\nFor usages where you wish to use the\
    \ same style for the complete webpage or a number of webpages, the best approach\
    \ is to use an external style sheet.\n\nThis external style sheet can be linked\
    \ to the HTML page in the following manner:\n\n```html\n<!DOCTYPE html>\n<html\
    \ xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n<title></title>\n<link rel='stylesheet'\
    \ type='text/css' href='Content/mainstyle.css' />\n</head>\n<body>\n</body>\n\
    </html>\n```\n\nYou must create a file mainstyle.css, in the Content folder, and\
    \ put the style rule specified below into the file.\n\n```css\nbody {\n    color:\
    \ white;\n}\n```\n\n## Defining Media\n\nIt is important to note that a style\
    \ sheet can contain as many style rules as you want. Besides this, you can also\
    \ link different CSS files for different media. The different media types are\
    \ as follows:\n\n- all\n- embossed\n- braille\n- print\n- handheld\n- speech\n\
    - screen\n- tv\n- tty\n\nThe media used can be defined in the following manner:\n\
    \n```html\n<link rel='stylesheet' type='text/css' href='Content/all.css' media='all'\
    \ />\n```\n\n## Defining Character Encoding\n\nYou can also define the character\
    \ encoding used, using the following format:\n\nStyle sheet:\n\nPlace the following\
    \ line above the style rule in the style sheet.\n\n```css\n@charset 'UTF-8';\n\
    ```\n\nHTML page:\n\nYou must place this line above the link element.\n\n```html\n\
    <meta http-equiv='Content-Type' content='text/html;charset=UTF-8' >\n```\n\n##\
    \ Importing Style Sheets\n\nAs your webpages become complex, the style sheets\
    \ used shall also grow in complexity. Therefore, you may need to use many style\
    \ sheets. You can import the style rules present in one style sheet to another\
    \ by using:\n\n```css\n@import url('/Content/header.css');\n```\n\nHere, header.css\
    \ is imported and the url gives the relative address of the style sheet to be\
    \ imported.\n\n## Importing Fonts\n\nFonts can be imported using the following\
    \ format:\n\n```css\n@font-face {\n    font-family: newFont;\n    src: url('New_Font.ttf'),\n\
    \    url('New_Font.eot'); /* IE9 */\n}\n```\n\n## Selectors, Specificity and Cascading\n\
    \nSelectors can be of three types, class selectors, ID selectors and element selectors.\
    \ The element selector type is the simplest and requires you to simply name the\
    \ element that needs to be used. For instance, if you wish to change the background\
    \ color of the body, then the element selector used is `body`.\n\nWhile declaring\
    \ any element, you can assign an ID to it using the id attribute. You can use\
    \ this ID prefixed with a # as a selector. For example, if you have created a\
    \ button with ID btnID, then the ID selector for this will be #btnID. Similarly,\
    \ you can assign a class name to an element using the class attribute. Class name\
    \ can be used prefixed by a dot(.) in the following manner, .className.\n\nHowever,\
    \ if you wish to select all the elements of the webpage, then asterisk (*) is\
    \ used.\n\n### Using Descendant and Child Selectors\n\nYou may wish to apply a\
    \ particular style to a descendant of a selector. This can be done by specifying\
    \ the complete selector change. It can be done in the following manner:\n\n```css\n\
    li a {\n    text-color: black;\n}\n```\n\nOn the other hand, you may want to apply\
    \ to an element only if it is a direct child of the selector. This can be implemented\
    \ by specifying the parent and child separated by a greater than (>) sign, in\
    \ the following manner:\n\n```css\nli > a {\n    color: white;\n}\n```\n\n###\
    \ Pseudo-element and Pseudo-class Selectors\n\nNow that you know how to apply\
    \ styles to specific elements, let us move on to implementing styles to more specific\
    \ sections like the first line of the second paragraph. In order to style elements\
    \ that cannot be classified on the basis of name, content or is not a part of\
    \ the DOM tree can be styled using pseudo-classes. The available pseudo-classes\
    \ include:\n\n- :visited\n- :link\n- :hover\n- :active\n- :checked\n- :focus\n\
    - :nth-last-child(n)\n- :not\n- :only-child\n- :nth-child(formula)\n- :lang(language)\n\
    - :first-of-type\n- :only-of-type\n\nIf you want to access information of the\
    \ DOM tree that is not accessible otherwise, you can use pseudo-elements. **Pseudo-elements**\
    \ include:\n\n- ::first-letter\n- ::first-line\n- ::after\n- ::before\n\n### Grouping\
    \ Selectors\n\nMultiple selectors can be used for a style rule. These selectors\
    \ must be separated by commas. Sample implementation:\n\n```css\nbody, button\
    \ {\n    color: white;\n}\n```\n\n### Using Adjacent Selectors\n\nIf you want\
    \ to style the first heading in a div or any similar adjacent elements, the selector\
    \ is constructed using a plus sign (+) between the two selectors. Sample implementation:\n\
    \n```css\ndiv + h1 {\n    color: white;\n}\n```\n\n### Sibling Selectors\n\nSibling\
    \ selectors are similar to adjacent selectors except for the fact that all the\
    \ matching elements are styled as against adjacent selectors, which only style\
    \ the first matching element. The selector is constructed using a ~ sign between\
    \ the two selectors. Sample implementation:\n\n```css\ndiv ~ h1 {\n    color:\
    \ white;\n}\n```\n\n### Using Attribute Selector\n\nThis selector selects all\
    \ the elements for which the specified attribute exists. The selector is written\
    \ in this form:\n`a[title]`\nThis selector will select all the links for which\
    \ the title attribute has been specified. Moreover, this selector type can be\
    \ modified into attribute-value selector by specifying the attribute value in\
    \ the following manner:\n`a[title=\"value\"]`\n\n### In-Built Styles of Browsers\n\
    \nEvery browser has a built-in style sheet, which is applied to all the webpages\
    \ opened using this browser. In fact, this style sheet is applied before any other\
    \ style sheet. You can define your own style sheet for the browser using the Accessibility\
    \ option in Tools. However, user style sheets are browser specific. Therefore,\
    \ if you open a different browser, the style sheet you defined may not be accessible.\n\
    \nIn case, you want your user-define style sheet to override any other style specified\
    \ in the HTML page, then you can use the '!important' modifier. This modifier\
    \ sets highest priority for the specified style statement. Sample implementation:\n\
    \n```css\nbody {\n    color: white !important;\n}\n```\n\n### Cascading of Styles\n\
    \nThe precedence and priority of the styles are decided on the basis of the following\
    \ parameters.\n\n- Importance\n- Specificity\n- Textual Order\n\n## Working with\
    \ CSS Properties\n\nNow that you are thorough with the use of selectors, the next\
    \ step is to look at CSS properties.\n\n### Color\n\nOne of the most crucial properties\
    \ that are used in a webpage is color, which can be defined using ARGB, RGB and\
    \ color names.\n\nRGB values are typically defined using a decimal number, which\
    \ lies between 0-255.\n\n- white #ffffff\n- red #ff0000\n- black #000000\n- green\
    \ #008000\n\nColor values can also be used instead of the color name. An example\
    \ of how this can be used is given below.\n\n```css\nbody {\n    color: #ffffff;\n\
    }\n```\n\nAnother way to specify the color is using the RGB function, which specifies\
    \ the values of parameters using a number between 0-255 or percentage. Example\
    \ of this type of declaration is given below:\n\n```css\nh1 { color: rgb(255,0,0);\
    \ }\n```\n\nOther ways to specify color are RGBA, which accepts 4 values and HSL,\
    \ which defines values for hue, saturation and lightness.\n\n### Transparency\n\
    \nThe transparency or opacity are defined by a value between 0.0 (invisible) and\
    \ 1.0 (opaque).\n\n### Text\n\nAs far as text is concerned, font-face and font-size\
    \ can be specified. These properties can be defined in the following manner:\n\
    \n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size: 12px;\
    \ }\n```"
  mdcn: "\n## 如何创建外部样式表\n\n对于需要在整个网页或多个网页上使用相同样式的场景，最佳做法是使用外部样式表。\n\n此外部样式表可以通过以下方式链接到\
    \ HTML 页面：\n\n```html\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
    <head>\n<title></title>\n<link rel='stylesheet' type='text/css' href='Content/mainstyle.css'\
    \ />\n</head>\n<body>\n</body>\n</html>\n```\n\n你必须在 Content 文件夹中创建一个名为 `mainstyle.css`\
    \ 的文件，并将下面指定的样式规则放入该文件中。\n\n```css\nbody {\n    color: white;\n}\n```\n\n## 定义媒体\n\
    \n需要注意的是，一个样式表可以包含任意数量的样式规则。除此之外，你还可以为不同的媒体链接不同的 CSS 文件。不同的媒体类型如下：\n\n- all\n\
    - embossed\n- braille\n- print\n- handheld\n- speech\n- screen\n- tv\n- tty\n\n\
    可以按以下方式定义所使用的媒体：\n\n```html\n<link rel='stylesheet' type='text/css' href='Content/all.css'\
    \ media='all' />\n```\n\n## 定义字符编码\n\n你还可以使用以下格式定义所使用的字符编码：\n\n样式表：\n\n在样式表的样式规则上方放置以下行。\n\
    \n```css\n@charset 'UTF-8';\n```\n\nHTML 页面：\n\n你必须将此行放在 `link` 元素上方。\n\n```html\n\
    <meta http-equiv='Content-Type' content='text/html;charset=UTF-8' >\n```\n\n##\
    \ 导入样式表\n\n随着你的网页变得复杂，所使用的样式表也会相应变得复杂。因此，你可能需要使用多个样式表。你可以使用以下方式将一个样式表中的样式规则导入到另一个样式表中：\n\
    \n```css\n@import url('/Content/header.css');\n```\n\n这里，`header.css` 被导入，而 `url`\
    \ 提供了要导入的样式表的相对地址。\n\n## 导入字体\n\n可以使用以下格式导入字体：\n\n```css\n@font-face {\n    font-family:\
    \ newFont;\n    src: url('New_Font.ttf'),\n    url('New_Font.eot'); /* IE9 */\n\
    }\n```\n\n## 选择器、特异性与层叠\n\n选择器可以分为三种类型：类选择器、ID 选择器和元素选择器。元素选择器类型是最简单的，你只需命名需要使用的元素即可。例如，如果你想改变\
    \ `body` 的背景颜色，那么使用的元素选择器就是 `body`。\n\n在声明任何元素时，你可以使用 `id` 属性为其分配一个 ID。你可以使用以\
    \ `#` 为前缀的这个 ID 作为选择器。例如，如果你创建了一个 ID 为 `btnID` 的按钮，那么它的 ID 选择器就是 `#btnID`。类似地，你可以使用\
    \ `class` 属性为元素分配一个类名。类名可以以点（`.`）为前缀，如下所示：`.className`。\n\n但是，如果你想选择网页的所有元素，则使用星号（`*`）。\n\
    \n### 使用后代选择器和子选择器\n\n你可能希望将特定样式应用于选择器的后代。这可以通过指定完整的选择器路径来完成。可以按以下方式进行：\n\n```css\n\
    li a {\n    text-color: black;\n}\n```\n\n另一方面，你可能只想在元素是选择器的直接子元素时才应用样式。这可以通过指定父元素和子元素，并用大于号（`>`）分隔来实现，如下所示：\n\
    \n```css\nli > a {\n    color: white;\n}\n```\n\n### 伪元素和伪类选择器\n\n既然你知道了如何将样式应用于特定元素，让我们继续探讨如何将样式应用于更具体的部分，例如第二段的第一行。为了对无法根据名称、内容分类或不是\
    \ DOM 树一部分的元素应用样式，可以使用伪类。可用的伪类包括：\n\n- :visited\n- :link\n- :hover\n- :active\n\
    - :checked\n- :focus\n- :nth-last-child(n)\n- :not\n- :only-child\n- :nth-child(formula)\n\
    - :lang(language)\n- :first-of-type\n- :only-of-type\n\n如果你想访问 DOM 树中通常无法访问的信息，可以使用伪元素。**伪元素**包括：\n\
    \n- ::first-letter\n- ::first-line\n- ::after\n- ::before\n\n### 分组选择器\n\n可以为一条样式规则使用多个选择器。这些选择器必须用逗号分隔。示例实现：\n\
    \n```css\nbody, button {\n    color: white;\n}\n```\n\n### 使用相邻选择器\n\n如果你想为 `div`\
    \ 中的第一个标题或任何类似的相邻元素设置样式，选择器通过在两个选择器之间使用加号（`+`）来构造。示例实现：\n\n```css\ndiv + h1 {\n\
    \    color: white;\n}\n```\n\n### 兄弟选择器\n\n兄弟选择器与相邻选择器类似，不同之处在于所有匹配的元素都会被设置样式，而相邻选择器只设置第一个匹配元素的样式。选择器通过在两个选择器之间使用波浪号（`~`）来构造。示例实现：\n\
    \n```css\ndiv ~ h1 {\n    color: white;\n}\n```\n\n### 使用属性选择器\n\n此选择器选择所有存在指定属性的元素。选择器书写形式如下：\n\
    `a[title]`\n此选择器将选择所有指定了 `title` 属性的链接。此外，这种选择器类型可以通过指定属性值修改为属性-值选择器，如下所示：\n`a[title=\"\
    value\"]`\n\n### 浏览器的内置样式\n\n每个浏览器都有一个内置样式表，该样式表会应用于使用此浏览器打开的所有网页。事实上，此样式表会在任何其他样式表之前应用。你可以使用“工具”中的“辅助功能”选项为浏览器定义自己的样式表。但是，用户样式表是特定于浏览器的。因此，如果你打开一个不同的浏览器，你定义的样式表可能无法访问。\n\
    \n如果你希望你的用户定义样式表覆盖 HTML 页面中指定的任何其他样式，可以使用 `!important` 修饰符。此修饰符为指定的样式语句设置最高优先级。示例实现：\n\
    \n```css\nbody {\n    color: white !important;\n}\n```\n\n### 样式的层叠\n\n样式的优先级和优先顺序基于以下参数决定。\n\
    \n- 重要性\n- 特异性\n- 文本顺序\n\n## 使用 CSS 属性\n\n既然你已经熟练掌握了选择器的使用，下一步是了解 CSS 属性。\n\n\
    ### 颜色\n\n网页中使用的最关键属性之一是颜色，它可以通过 ARGB、RGB 和颜色名称来定义。\n\nRGB 值通常使用 0-255 之间的十进制数字定义。\n\
    \n- 白色 #ffffff\n- 红色 #ff0000\n- 黑色 #000000\n- 绿色 #008000\n\n颜色值也可以代替颜色名称使用。以下是其用法示例：\n\
    \n```css\nbody {\n    color: #ffffff;\n}\n```\n\n指定颜色的另一种方式是使用 RGB 函数，它通过 0-255\
    \ 之间的数字或百分比来指定参数值。这种声明类型的示例如下：\n\n```css\nh1 { color: rgb(255,0,0); }\n```\n\n\
    其他指定颜色的方式包括接受 4 个值的 RGBA，以及定义色相、饱和度和亮度的 HSL。\n\n### 透明度\n\n透明度或不透明度由 0.0（不可见）到\
    \ 1.0（不透明）之间的值定义。\n\n### 文本\n\n关于文本，可以指定 `font-face` 和 `font-size`。这些属性可以按以下方式定义：\n\
    \n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size: 12px;\
    \ }\n```\n"
