- md: "## Boolean Attributes\n\nSeveral types of attributes can be used. One of the\
    \ most commonly used types is Boolean attribute. The Boolean attribute can take\
    \ a value from the allowable set of values. Some possible values include:\n\n\
    - Checked\n- Disabled\n- Selected\n- Readonly\n\nThere are two ways to indicate\
    \ the value of a Boolean attribute.\n\n```\n<input type=\"checkbox\" name=\"vegetable\"\
    \nvalue=\"Broccoli\" checked=\"\" />\n\n<input type=\"checkbox\" name=\"vegetable\"\
    \nvalue=\"Broccoli\" checked='checked' />\n```\n\nIn the first case, the value\
    \ is not given and is assumed. Although, the latter seems like a redundant form,\
    \ it is the more preferred form, particularly if you are using jQuery.\n\n## Global\
    \ Attribute Reference\n\nThere is a set of named attributes available in HTML5,\
    \ which can be used with any element. Examples of these attributes include accesskey,\
    \ spellcheck and draggable, in addition to several others.\n\n### Void Elements\n\
    \nSome elements do not have to contain content under any circumstance. These elements\
    \ include `<link>`, `<br>` and `<area>`, in addition to many others.\n\n### Self-closing\
    \ Tags\n\nIf you are using an element that does not contain any content, then\
    \ you can use a self closing tag. An example of this tag is `<br/>`. However,\
    \ please note that other tags like `<div>` have to be written as `<div></div>`\
    \ even if they do not have any content.\n\n### How to Add Expando Attributes\n\
    \nAny attribute that you as the author define is known as expando attribute. You\
    \ can give this custom attribute a name and assign a value to the same as and\
    \ when required.\n\n## How to Add Comments\n\nComments can be added using a !\
    \ and two hyphens (-). The syntax for adding comments is as follows:\n\n```\n\
    <!--text -->\n```\n\nYou can also add conditional comments using the following\
    \ syntax:\n\n```\n<!--[if lte IE 7]> <html class=\"no-js ie6\" lang=\"en\"> <![endif]-->\n\
    ```\n\nThis comment determines if the browser being used is an earlier version\
    \ released earlier than IE7.\n\n## How to Create HTML Document\n\nAn HTML document\
    \ can simply be described as a frame that contains metadata, content and a structure.\n\
    \nThe HTML document must start with the tag `<!DOCTYPE html>`. In HTML5, the declaration\
    \ is an indication to the browser that it should work in no-quirks mode or HTML5\
    \ compliant mode.\n\nThe next tag should be `<html>`. This element includes within\
    \ itself the elements `<head>` and `<body>`. The `<head>` element can contain\
    \ the metadata for the HTML document, which is declared and defined using the\
    \ `<meta>` tag. The `<head>` element also contains the `<title>` element, which\
    \ serves the following purposes:\n\n- Used by search engines\n- This content is\
    \ displayed in the browser toolbar\n- Gives a default name to the page.\n\nThe\
    \ `<body>` element includes any other information that is to be displayed on the\
    \ HTML document.\n\nA sample HTML document is given below:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\" />\n<title>TITLE OF DOC</title>\n</head>\n\
    <body>\nCONTENT\n</body>\n</html>\n```\n\nNote:\n\n1.  Special character like\
    \ ‘>’ or ‘<’, which are a part of the HTML syntax, can be used on the HTML doc\
    \ using their name or number. The syntax for their usage is:\n    *   `&entity_name`\
    \ or `&entity_number`\n    *   The appendix contains the table of entity names\
    \ and numbers to be used.\n2.  White space created using tabs, line breaks and\
    \ spaces is normalized by HTML into a single space. Therefore, if you want to\
    \ use multiple spaces, you must use the non-breaking space character. For example,\
    \ if you want to display 10 mph such that 10 and mph are not separated by a newline,\
    \ you can write `10&amp;nbsp;mph`.\n\n## How to Embed Content\n\nNow that you\
    \ know how to create HTML documents with your content, you may want to embed content\
    \ into the document from other sources. This content may be text from another\
    \ HTML document or flash applications.\n\n### Inline Frames\n\nInline frames are\
    \ used to embed HTML documents inline with the content of the current HTML document.\
    \ Therefore, in a way, this element creates nested browsers as multiple webpage\
    \ are loaded in the same window. These are implemented using the `<iframe>` element.\
    \ Nested browsing contexts can be navigated using:\n\n- `window.parent` – This\
    \ WindowProxy object represents the parent browsing context.\n- `window.top` –\
    \ This WindowProxy object represents the top-level browsing context.\n- `window.frameElement`\
    \ – This represents the browsing context container and if there is no context\
    \ container, it returns null.\n\nThe syntax of the `<iframe>` element is as follows:\n\
    \n```\n<iframe src=\"name\"></iframe>\n```\n\nHere the name of the attribute defines\
    \ the name of the browsing context. This name can be any string like ‘sample.html’.\
    \ However, the strong should not start with an underscore as names starting with\
    \ underscore are reserved for special key names like _blank.\n\n### Sandboxing\n\
    \nSandboxing is used for avoiding the introduction of pop-ups or any other malware\
    \ in your HTML document. In order to implement this, the attribute ‘sandbox’ is\
    \ used. You can use this attribute in the following manner:\n\n```\n<iframe sandbox=\"\
    keywords\" src=\"name\">\n</iframe>\n```\n\nWhen you use sandboxing, several restrictions\
    \ are imposed on the called context. These restrictions include disabling forms,\
    \ scripts, plugins and any frame other than itself. You can force the system to\
    \ override these restrictions using keywords like:\n\n- `allow-same-origin`\n\
    - `allow-scripts`\n- `allow-forms`\n- `allow-top-navigation`\n\nMultiple keywords\
    \ can be used by separating them using a space.\n\n### Seamless Embedding\n\n\
    The seamless attribute can be used in the `<iframe>` element for embedding of\
    \ content in a manner than this content appears to be part of the main content.\
    \ This attribute can be used in the following manner:\n\n```\n<iframe seamless=\"\
    \" src=\"name\"></iframe>\n<iframe seamless src=\"name\"></iframe>\n<iframe seamless=\"\
    seamless\" src=\"name\"></iframe>\n```\n\nThis attribute may not be supported\
    \ by many browsers. Therefore, you can use CSS to achieve a similar effect.\n\n\
    ## Hyperlinks\n\nHyperlinks can be implemented using the `<a>` element. This element\
    \ can be used to link both external (a different HTML document) as well as internal\
    \ (another location in the same HTML document) links.\n\nAll links are underlined\
    \ and depending upon the nature of the link, the colour of the link changes.\n\
    \n- Blue - Unvisited link\n- Purple - Visited link\n- Red - Active link\n\nThe\
    \ first attribute of the `<a>` element is `href`, which is given the value of\
    \ the URL.\n\nSyntax for external links:\n\n```\n<a href=\"address\">Text</a>\n\
    ```\n\nSyntax for internal links:\n\n```\n<a href=\"#id\">Text</a>\n```\n\nThe\
    \ `id` here is the id of the tag to which you want the link to jump onto. However,\
    \ if you use only the `#` value, the link jumps to the top of the page.\n\nThe\
    \ other attribute used with the `<a>` element is `target`, which allows you to\
    \ control the behaviour of the link. For instance, if you want the link to open\
    \ in another window, then this requirement can be specified using this attribute.\
    \ The following can be used:\n\n- `_blank` - This opens the link in a new browser\
    \ window.\n- `_parent` - This opens the link in the parent window.\n- `_self`\
    \ - This opens the link in the current window and is the default setting.\n- `_top`\
    \ - This opens the link in the topmost frame of the current window.\n- `<iframe_name>`\
    \ - This opens the link in the `<iframe>` element of"
  mdcn: "\n## 布尔属性\n\n可以使用多种类型的属性。其中最常用的一种是布尔属性。布尔属性可以从允许的值集合中取值。一些可能的值包括：\n\n- Checked\n\
    - Disabled\n- Selected\n- Readonly\n\n有两种方式可以指定布尔属性的值。\n\n```\n<input type=\"\
    checkbox\" name=\"vegetable\"\nvalue=\"Broccoli\" checked=\"\" />\n\n<input type=\"\
    checkbox\" name=\"vegetable\"\nvalue=\"Broccoli\" checked='checked' />\n```\n\n\
    在第一种情况下，未提供值但被默认假定。虽然第二种形式看起来是冗余的，但它更受欢迎，特别是在使用 jQuery 时。\n\n## 全局属性参考\n\nHTML5\
    \ 中有一组命名的属性，可用于任何元素。除了其他多个属性外，这些属性的示例包括 accesskey、spellcheck 和 draggable。\n\n\
    ### 空元素\n\n有些元素在任何情况下都不必包含内容。这些元素包括 `<link>`、`<br>` 和 `<area>`，以及其他许多元素。\n\n###\
    \ 自闭合标签\n\n如果你使用不包含任何内容的元素，那么你可以使用自闭合标签。此标签的一个示例是 `<br/>`。但是，请注意，像 `<div>` 这样的其他标签，即使没有任何内容，也必须写为\
    \ `<div></div>`。\n\n### 如何添加扩展属性\n\n你作为作者定义的任何属性都称为扩展属性。你可以根据需要为这个自定义属性命名并赋值。\n\
    \n## 如何添加注释\n\n可以使用感叹号和两个连字符（-）添加注释。添加注释的语法如下：\n\n```\n<!--text -->\n```\n\n你也可以使用以下语法添加条件注释：\n\
    \n```\n<!--[if lte IE 7]> <html class=\"no-js ie6\" lang=\"en\"> <![endif]-->\n\
    ```\n\n此注释确定所使用的浏览器是否是早于 IE7 的早期版本。\n\n## 如何创建 HTML 文档\n\nHTML 文档可以简单地描述为一个包含元数据、内容和结构的框架。\n\
    \nHTML 文档必须以标签 `<!DOCTYPE html>` 开头。在 HTML5 中，该声明向浏览器表明它应在非怪异模式或 HTML5 兼容模式下工作。\n\
    \n下一个标签应该是 `<html>`。此元素本身包含 `<head>` 和 `<body>` 元素。`<head>` 元素可以包含 HTML 文档的元数据，这些元数据使用\
    \ `<meta>` 标签声明和定义。`<head>` 元素还包含 `<title>` 元素，其用途如下：\n\n- 被搜索引擎使用\n- 此内容显示在浏览器工具栏中\n\
    - 为页面提供默认名称。\n\n`<body>` 元素包含要在 HTML 文档上显示的任何其他信息。\n\n下面是一个 HTML 文档示例：\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\" />\n<title>TITLE OF DOC</title>\n\
    </head>\n<body>\nCONTENT\n</body>\n</html>\n```\n\n注意：\n\n1.  像 '>' 或 '<' 这样的特殊字符是\
    \ HTML 语法的一部分，可以在 HTML 文档上使用它们的名称或编号。它们的使用语法是：\n    *   `&entity_name` 或 `&entity_number`\n\
    \    *   附录中包含了要使用的实体名称和编号的表格。\n2.  使用制表符、换行符和空格创建的空格会被 HTML 规范化为单个空格。因此，如果你想使用多个空格，必须使用不换行空格字符。例如，如果你想显示\
    \ `10 mph` 并且 `10` 和 `mph` 之间没有换行符分隔，你可以写成 `10&amp;nbsp;mph`。\n\n## 如何嵌入内容\n\n\
    既然你已经知道如何创建包含内容的 HTML 文档，你可能希望从其他来源将内容嵌入到文档中。此内容可能是来自另一个 HTML 文档的文本或 flash 应用程序。\n\
    \n### 内联框架\n\n内联框架用于将 HTML 文档内联嵌入到当前 HTML 文档的内容中。因此，从某种意义上说，此元素创建了嵌套浏览器，因为在同一个窗口中加载了多个网页。这些是使用\
    \ `<iframe>` 元素实现的。嵌套的浏览上下文可以使用以下方式导航：\n\n- `window.parent` – 此 WindowProxy 对象表示父浏览上下文。\n\
    - `window.top` – 此 WindowProxy 对象表示顶层浏览上下文。\n- `window.frameElement` – 这表示浏览上下文容器，如果没有上下文容器，则返回\
    \ null。\n\n`<iframe>` 元素的语法如下：\n\n```\n<iframe src=\"name\"></iframe>\n```\n\n\
    这里属性的名称定义了浏览上下文的名称。这个名称可以是任何字符串，例如 'sample.html'。但是，字符串不应以下划线开头，因为以下划线开头的名称是为特殊键名（如\
    \ _blank）保留的。\n\n### 沙盒\n\n沙盒用于避免在你的 HTML 文档中引入弹出窗口或任何其他恶意软件。为了实现这一点，使用了 'sandbox'\
    \ 属性。你可以使用以下方式使用此属性：\n\n```\n<iframe sandbox=\"keywords\" src=\"name\">\n</iframe>\n\
    ```\n\n当你使用沙盒时，会对被调用的上下文施加多项限制。这些限制包括禁用表单、脚本、插件以及除自身之外的任何框架。你可以使用以下关键字强制系统覆盖这些限制：\n\
    \n- `allow-same-origin`\n- `allow-scripts`\n- `allow-forms`\n- `allow-top-navigation`\n\
    \n可以使用空格分隔多个关键字。\n\n### 无缝嵌入\n\n`<iframe>` 元素中的 `seamless` 属性可用于以一种使内容看起来是主要内容一部分的方式嵌入内容。此属性可以按如下方式使用：\n\
    \n```\n<iframe seamless=\"\" src=\"name\"></iframe>\n<iframe seamless src=\"name\"\
    ></iframe>\n<iframe seamless=\"seamless\" src=\"name\"></iframe>\n```\n\n此属性可能不被许多浏览器支持。因此，你可以使用\
    \ CSS 来实现类似的效果。\n\n## 超链接\n\n超链接可以使用 `<a>` 元素实现。此元素可用于链接外部（不同的 HTML 文档）和内部（同一\
    \ HTML 文档中的另一个位置）链接。\n\n所有链接都带有下划线，并且根据链接的性质，链接的颜色会发生变化。\n\n- 蓝色 - 未访问的链接\n- 紫色\
    \ - 已访问的链接\n- 红色 - 活动链接\n\n`<a>` 元素的第一个属性是 `href`，其值为 URL。\n\n外部链接的语法：\n\n```\n\
    <a href=\"address\">Text</a>\n```\n\n内部链接的语法：\n\n```\n<a href=\"#id\">Text</a>\n\
    ```\n\n这里的 `id` 是你希望链接跳转到的标签的 id。但是，如果你只使用 `#` 值，链接会跳转到页面顶部。\n\n与 `<a>` 元素一起使用的另一个属性是\
    \ `target`，它允许你控制链接的行为。例如，如果你希望链接在另一个窗口中打开，那么可以使用此属性指定此要求。可以使用以下值：\n\n- `_blank`\
    \ - 这会在新的浏览器窗口中打开链接。\n- `_parent` - 这会在父窗口中打开链接。\n- `_self` - 这会在当前窗口中打开链接，这是默认设置。\n\
    - `_top` - 这会在当前窗口的最顶层框架中打开链接。\n- `<iframe_name>` - 这会在 `<iframe>` 元素中打开链接。\n"
