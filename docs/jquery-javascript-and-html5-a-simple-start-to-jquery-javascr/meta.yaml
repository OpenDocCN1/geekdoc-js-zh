    # How to Handle Disconnects


    Connections may sometime close errors concerning the network. Therefore, you may
    be required to call the connect function while you are inside the construct of
    the onClose function. This may lead to issues. A common problem faced in this
    regard is that the server is unable to identify that this new connection request
    belongs to a client that already exists. You can handle this issue by sending
    an identification message to the server.


    # How to Deal with Web Farms


    You may need to run your application in web farm, in which case the incoming requests
    may be handled by many servers. Multiple server are used to perform load balancing
    and performance optimization. In this case, you can implement sticky servers,
    which ensures that a client is served by only one server. In other words, all
    the requests by one client are processed by the same server. This helps you to
    address issues that may arise due to open connections. These problems can also
    be handled using products like Microsoft App Fabric Caching Service and Redis.'
