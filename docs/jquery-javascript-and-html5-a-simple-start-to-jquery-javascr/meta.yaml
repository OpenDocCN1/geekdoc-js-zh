    Simply, **a form is a way in which data is collected and sent to a location where
    it can be processed**, which is a server in most cases. However, since we are
    yet to discuss server side scripting, we will focus on sending the data to an
    email address. However, it is important to note that we do not recommend this
    practice and it is used only for understanding purposes.


    **Web Communications**


