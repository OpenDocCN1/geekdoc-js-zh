  md: 'A Simple Start to Jquery, Javascript, and Html5 for Beginners


    Before moving any further, it is important to know the basics of web services
    and how they can be used. A client needs to communicate with the web server on
    a regular basis and this communication is facilitated by the web service. In this
    case, the client can be anyone from a machine using the web service to the web
    service itself. Therefore, the client, regardless what it is, needs to create
    and send a request to the web service, and receive and parse the responses.


    You must have heard of the term mashups, which is a term used to describe applications
    that pierce together web services. Two main classes of web services exist, which
    are arbitrary web services and REST or representational state transfer. While
    the set of operations are arbitrary in the first case, there exists a uniform
    operations set in the second.


    # Representational State Transfer (REST)


    This framework uses the standard HTTP operations, which are mapped to its create,
    delete, update and retrieve operations. Moreover, REST does not focus on interacting
    with messages. Instead, its interactions are focused towards stateless resources.
    This is perhaps


