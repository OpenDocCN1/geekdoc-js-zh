- md: "# Chapter 7\n\n## Forms\n\nIn the previous chapters, you **have already** studied\
    \ how HTML documents can be created and manipulated. Taking a lead from them,\
    \ we can now move on to understanding forms, which is one of the most crucial\
    \ and commonly used units of content in webpage development.\n\nSimply, **a form\
    \ is a way in which data is collected and sent to a location where it can be processed**,\
    \ which is a server in most cases. However, since we are yet to discuss server\
    \ side scripting, we will focus on sending the data to an email address. However,\
    \ it is important to note that we do not recommend this practice and it is used\
    \ only for understanding purposes.\n\n**Web Communications**\n\nBefore moving\
    \ to the working of forms, it is important to know some basics of HTTP. A typical\
    \ web communication consists of the following activities:\n\n1. When a user browses\
    \ a webpage, a request for access to a web server resource is initiated by sending\
    \ a GET HTTP request.\n2. The request is processed by the server and sends a response\
    \ to the browser using HTTP protocol.\n3. The browser process the server response\
    \ and presents it to the user in the form of a ‘form’.\n4. The user enters inputs\
    \ to the form and upon hitting the submit or enter button, this data is sent to\
    \ the server, using HTTP protocol again.\n5. This data is again processed by the\
    \ server and the server posts its response to the browser, which is displayed\
    \ on the webpage.\n\n## Web Servers\n\nOriginally, web servers were designed to\
    \ receive and process requests and send the results back to the browser using\
    \ HTTP. Initially, when the webpages were simple, such web servers were able to\
    \ process a good number of requests per unit time. There were no states involved\
    \ as sending and receiving requests were as simple as opening a connection, transferring\
    \ data and closing the connection.\n\nThe new age web servers are much more equipped\
    \ than these simple web servers. The web servers of today implement what is called\
    \ the ‘keep alive’ features, which ensures that the connection remains open for\
    \ a definite period of time in which consequent requests by the same browser to\
    \ the server can be entertained.\n\n## Web Browsers\n\nThe web browser is a desktop\
    \ application, which displays webpages and manages user interactions between the\
    \ webpages and the server. The communication between the web servers and pages\
    \ is established using technologies like AJAX and Asynchronous JavaScript.\n\n\
    ## How is Data Submitted to the Web Server\n\nAn HTML form can be created using\
    \ the `<form>` element in the following manner:\n\n```html\n<form method=\"post\"\
    \naction=\"getCustomerInformation.aspx\" >\n\nEnter Customer Number:\n<input type=\"\
    text\" name=\"Number\" />\n\n<input type=\"submit\" value=\"Get Customer Information\"\
    \ />\n\n</form>\n```\n\nThis form takes in the customer number and returns a page\
    \ that displays the details of the customer.\n\nHowever, it is important to note\
    \ that not all elements can be used for submitting data in a form. The allowed\
    \ elements for this purpose are:\n\n- `<textarea>` - It takes a multi-line input.\n\
    - `<button>` - It is a clickable button, which can be placed on any content or\
    \ image.\n- `<select>` - It is a drop-down list, which allows multiple selections.\
    \ The selected options can be identified using jQuery: `$('option:selected')`.\n\
    - `<input type='checkbox'>` - It is a check box, which has a value attribute used\
    \ for setting as well as reading the status of the checkbox. The jQuery for identifying\
    \ checked checkboxes is: `$('input[type=checkbox]:checked')`.\n- `<input type='button'>`\
    \ - It is a clickable button, which has a text prompt.\n- `<input type='datetime'>`\
    \ - It is a control, which is date and time (UTC).\n- `<input type='date'>` -\
    \ It is a control, which is date-only.\n- `<input type='email'>` - It is a file-select\
    \ field, which has a browse button for uploading a file.\n- `<input type='color'>`\
    \ - It is a color picker.\n- `<input type='hidden'>` - It is a hidden input field.\n\
    - `<input type='datetime-local'>` - It is a control, which is date and time (any\
    \ timezone).\n- `<input type='month'>` - It is a month-year control.\n- `<input\
    \ type='image'>` - It is an image submit button.\n- `<input type='password'>`\
    \ - It is a password field, with masked characters.\n\n---\n\n# A Simple Start\
    \ to jQuery, JavaScript, and HTML5 for Beginners\n\nBefore getting to use jQuery,\
    \ you will need to include it into your project. Once you have installed it and\
    \ you are ready to use it in your project, the next step is to learn how to use\
    \ it.\n\nFirst things first, you need to reference the jQuery library on the webpage\
    \ that needs to use it in the following manner:\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"Scripts/qunit.js\"></script>\n\n<script src=\"Scripts/jquery-1.8.2.js\"\
    ></script>\n```\n\nThe next thing to know is that the jQuery code that you are\
    \ hoping to use in your HTML page lies in the jQuery namespace, which has an alias\
    \ `$`. Therefore, you can write either `jQuery.jFeature` or `$.jFeature` when\
    \ referring to a feature of jQuery.\n\nBefore you can start using it in your webpages,\
    \ you will also need to change the default.js file as follows:\n\n```javascript\n\
    function initialize() {\n\n    txtInput = $('#txtInput');\n\n    txtResult = $('#txtResult');\n\
    \n    clear();\n\n}\n```\n\nThis allows you to use jQuery and CSS selectors by\
    \ matching them using their IDs.\n\nAlso, as you move ahead with coding using\
    \ jQuery, remember to refresh the screen using Cntl+F5 after making any changes\
    \ as the browser may not be able to catch the JavaScript modification right away.\
    \ Moreover, use jQuery objects as much as possible because of the cross-browser\
    \ compatibility that they offer.\n\nA DOM object can be referenced from a jQuery\
    \ wrapper in the following manner:\n\n```javascript\nvar domElement = $('#txtInput')[0];\n\
    ```\n\nHere is a simple code that checks if the element exists before referencing\
    \ it.\n\n```javascript\nvar domElement;\nif($('#txtInput').length > 0){\n    domElement\
    \ = $('#txtInput')[0];\n}\n```\n\n## How to Create a jQuery Wrapper for Referencing\
    \ a DOM Element\n\nA jQuery wrapper can be created from a DOM element reference\
    \ in the following manner:\n\n```javascript\nvar myDoc = $(document);\nvar inText\
    \ = $(this).text();\n```\n\nThe first statement assigns the wrapped object to\
    \ the variable. On the other hand, the second statement wraps the object referenced\
    \ using `this`.\n\n## How to Add Event Listeners\n\njQuery provides the `.on`\
    \ method for subscribing to events. Besides this, you can unsubscribe using the\
    \ `.off` method. These methods can be used in the following manner:\n\n```javascript\n\
    $('#btnSubmitInfo').on('click', onSubmit);\n$('#btnSubmitInfo').off('click', onSubmit);\n\
    ```\n\n## How to Trigger Event Handlers\n\njQuery provides triggers or the method,\
    \ `triggerHandler`, for triggering event handlers or handler code execution. This\
    \ can be done in the following manner:\n\n```javascript\n$('#btnSubmitInfo').triggerHandler('click');\n\
    ```\n\n## Initialization Code\n\nYou will often be faced with the requirement\
    \ to run an initialization code upon the loading of an HTML document. You can\
    \ do this using jQuery in the following manner:\n\n```html\n<script>\n\n$(document).ready(function\
    \ () {\n\ninitializationFunction();\n\n});\n\n</script>\n```\n\nThis can be placed\
    \ at the bottom of the HTML document. It will call the `initializationFunction`."
  mdcn: "\n# 第7章\n\n## 表单\n\n在前几章中，你**已经**学习了如何创建和操作HTML文档。以此为起点，我们现在可以开始理解表单，这是网页开发中最关键、最常用的内容单元之一。\n\
    \n简单来说，**表单是一种收集数据并将其发送到可处理位置的方式**，在大多数情况下这个位置是服务器。然而，由于我们尚未讨论服务器端脚本，我们将重点介绍将数据发送到电子邮件地址的方法。但需要注意的是，我们并不推荐这种做法，它仅用于理解目的。\n\
    \n**Web通信**\n\n在了解表单的工作原理之前，有必要了解HTTP的一些基础知识。典型的Web通信包括以下活动：\n\n1. 当用户浏览网页时，通过发送GET\
    \ HTTP请求发起访问Web服务器资源的请求。\n2. 服务器处理该请求，并使用HTTP协议向浏览器发送响应。\n3. 浏览器处理服务器响应，并以“表单”的形式呈现给用户。\n\
    4. 用户在表单中输入信息，点击提交或回车按钮后，这些数据再次通过HTTP协议发送到服务器。\n5. 服务器再次处理这些数据，并将响应发送回浏览器，显示在网页上。\n\
    \n## Web服务器\n\n最初，Web服务器的设计目的是接收和处理请求，并使用HTTP将结果返回给浏览器。在早期，当网页还比较简单时，这类服务器每单位时间能够处理相当数量的请求。由于发送和接收请求就像打开连接、传输数据和关闭连接一样简单，因此不涉及状态问题。\n\
    \n现代Web服务器的功能远比这些简单的服务器强大得多。当今的Web服务器实现了所谓的“保持连接”功能，该功能确保连接在特定时间内保持打开状态，以便同一浏览器对服务器的后续请求能够得到处理。\n\
    \n## Web浏览器\n\nWeb浏览器是一种桌面应用程序，用于显示网页并管理网页与服务器之间的用户交互。Web服务器与网页之间的通信通过AJAX和异步JavaScript等技术建立。\n\
    \n## 数据如何提交到Web服务器\n\n可以使用`<form>`元素以以下方式创建HTML表单：\n\n```html\n<form method=\"\
    post\"\naction=\"getCustomerInformation.aspx\" >\n\nEnter Customer Number:\n<input\
    \ type=\"text\" name=\"Number\" />\n\n<input type=\"submit\" value=\"Get Customer\
    \ Information\" />\n\n</form>\n```\n\n此表单接收客户编号，并返回一个显示客户详细信息的页面。\n\n但需要注意的是，并非所有元素都可用于在表单中提交数据。允许用于此目的的元素包括：\n\
    \n- `<textarea>` - 它接受多行输入。\n- `<button>` - 它是一个可点击的按钮，可以放置在任何内容或图像上。\n- `<select>`\
    \ - 它是一个下拉列表，允许多选。可以使用jQuery识别选中的选项：`$('option:selected')`。\n- `<input type='checkbox'>`\
    \ - 它是一个复选框，其`value`属性用于设置和读取复选框的状态。使用jQuery识别已选中的复选框：`$('input[type=checkbox]:checked')`。\n\
    - `<input type='button'>` - 它是一个可点击的按钮，带有文本提示。\n- `<input type='datetime'>` -\
    \ 它是一个日期和时间（UTC）控件。\n- `<input type='date'>` - 它是一个仅包含日期的控件。\n- `<input type='email'>`\
    \ - 它是一个文件选择字段，带有用于上传文件的浏览按钮。\n- `<input type='color'>` - 它是一个颜色选择器。\n- `<input\
    \ type='hidden'>` - 它是一个隐藏的输入字段。\n- `<input type='datetime-local'>` - 它是一个日期和时间（任意时区）控件。\n\
    - `<input type='month'>` - 它是一个月份-年份控件。\n- `<input type='image'>` - 它是一个图像提交按钮。\n\
    - `<input type='password'>` - 它是一个密码字段，字符会被隐藏显示。\n\n---\n\n# 初学者jQuery、JavaScript和HTML5入门指南\n\
    \n在使用jQuery之前，你需要将其包含到你的项目中。一旦安装完毕并准备好在项目中使用，下一步就是学习如何使用它。\n\n首先，你需要在需要使用jQuery的网页中以如下方式引用jQuery库：\n\
    \n```html\n<script type=\"text/javascript\" src=\"Scripts/qunit.js\"></script>\n\
    \n<script src=\"Scripts/jquery-1.8.2.js\"></script>\n```\n\n接下来需要知道的是，你希望在HTML页面中使用的jQuery代码位于jQuery命名空间中，该命名空间有一个别名`$`。因此，在引用jQuery的某个功能时，你可以写`jQuery.jFeature`或`$.jFeature`。\n\
    \n在网页中开始使用jQuery之前，你还需要按如下方式修改`default.js`文件：\n\n```javascript\nfunction initialize()\
    \ {\n\n    txtInput = $('#txtInput');\n\n    txtResult = $('#txtResult');\n\n\
    \    clear();\n\n}\n```\n\n这允许你通过匹配ID来使用jQuery和CSS选择器。\n\n此外，在使用jQuery进行编码时，请记住在进行任何更改后使用Ctrl+F5刷新屏幕，因为浏览器可能无法立即捕获JavaScript的修改。同时，尽可能使用jQuery对象，因为它们提供了跨浏览器兼容性。\n\
    \n可以按以下方式从jQuery包装器中引用DOM对象：\n\n```javascript\nvar domElement = $('#txtInput')[0];\n\
    ```\n\n以下是一个简单的代码，在引用元素之前检查其是否存在。\n\n```javascript\nvar domElement;\nif($('#txtInput').length\
    \ > 0){\n    domElement = $('#txtInput')[0];\n}\n```\n\n## 如何创建jQuery包装器以引用DOM元素\n\
    \n可以按以下方式从DOM元素引用创建jQuery包装器：\n\n```javascript\nvar myDoc = $(document);\nvar\
    \ inText = $(this).text();\n```\n\n第一条语句将包装后的对象赋值给变量。而第二条语句包装了使用`this`引用的对象。\n\
    \n## 如何添加事件监听器\n\njQuery提供了`.on`方法来订阅事件。除此之外，你可以使用`.off`方法取消订阅。这些方法可以按以下方式使用：\n\
    \n```javascript\n$('#btnSubmitInfo').on('click', onSubmit);\n$('#btnSubmitInfo').off('click',\
    \ onSubmit);\n```\n\n## 如何触发事件处理程序\n\njQuery提供了触发器或`triggerHandler`方法，用于触发事件处理程序或处理程序代码的执行。可以按以下方式进行：\n\
    \n```javascript\n$('#btnSubmitInfo').triggerHandler('click');\n```\n\n## 初始化代码\n\
    \n你经常会遇到在HTML文档加载时运行初始化代码的需求。你可以使用jQuery按如下方式实现：\n\n```html\n<script>\n\n$(document).ready(function\
    \ () {\n\ninitializationFunction();\n\n});\n\n</script>\n```\n\n这段代码可以放在HTML文档的底部。它将调用`initializationFunction`。\n"
