- md: "## How to Use WebSocket Libraries\n\nDealing with all the issues mentioned\
    \ above can be challenging. Therefore, the best way to deal with the situation\
    \ is to use server and client libraries. There are several libraries like SignalR\
    \ and Socket.IO available for you to explore.\n\n## Chapter 10: Managing Local\
    \ Data With the Help of Web Storage\n\nMost of the topics discussed in the previous\
    \ section focused on improving the performance of the websites and the services\
    \ that it provides its customers. Therefore, handling information or data has\
    \ been restricted to the data that is transferred between the client and server.\
    \ In such a case, the server needs to wait for the complete round trip to occur.\
    \ This involves cost overheads.\n\nIn order to address this issue, most modern\
    \ day browsers have started supporting web or DOM storage, which allows storage\
    \ of some data at the client level. This chapter provides an overview of storage\
    \ mechanisms used and how they can be used to improve the performance of the system\
    \ in this regard.\n\n## Introduction to Web Storage\n\nIn most web applications,\
    \ a server-side storage solution like SQL Database Server is implemented. This\
    \ may be an attempt to kill a mosquito with a sword. You don't need such a huge\
    \ storage solution as storing small bits of information at the browser level could\
    \ have solved your purpose.\n\nHttp cookies have been the most preferred and commonly\
    \ used form of data storage at the browser level. In fact, it is used by most\
    \ browsers for storing user information. The cookie value can be set in the following\
    \ manner:\n\n```javascript\nfunction setCookieValue(cName, cValue, daysToExpire)\
    \ {\n    var daysToExpire = new Date();\n    daysToExpire.setDate(daysToExpire.getDate()\
    \ + daysToExpire);\n    cValue = cValue + \"; expires=\" + daysToExpire.toUTCString();\n\
    \    document.cookie = cName + \"=\" + cValue;\n}\n```\n\nThe cookie value can\
    \ be retrieved using the following code:\n\n```javascript\nfunction getCookieValue(cName)\
    \ {\n    var cookie = document.cookie.split(\";\");\n    for (var i = 0; i < cookie.length;\
    \ i++) {\n        var cookies = cookie[i];\n        var indexVal = cookies.indexOf(\"\
    =\");\n        var keyVal = cookies.substr(0, indexVal);\n        var actualVal\
    \ = cookies.substr(indexVal + 1);\n        if (keyVal == cName)\n            return\
    \ actualVal;\n    }\n}\n```\n\nThe last segment of code, shown below, illustrates\
    \ how cookies can be used.\n\n```javascript\nsetCookie('fName', 'Clark', 1);\n\
    \nvar fName = getCookie('fName');\n```\n\nYou can also use the cookie plug-in\
    \ available in jQuery, which can be used in the following manner:\n\n```javascript\n\
    $.cookie('fName', 'Clark');\n\nvar fName = $.cookie('fName');\n```\n\nAlthough\
    \ cookies are extensively used, they pose some serious issues like overhead and\
    \ capacity limitation. Some alternatives available include:\n\n- Google Gears\n\
    - User Data\n- Java Applets\n- Flash Player\n\nThese options are better than cookies\
    \ and address their limitations, but they suffer from some issues, which include:\n\
    \n- A plug-in is required\n- User can block them\n- Not useful for corporate users\n\
    - They are vendor-specific.\n\n## HTML5 Storage\n\nAlthough these tools offer\
    \ some good, yet potentially improvable solutions, HTML5 has come up with some\
    \ innovative tools in their attempt to provide a comprehensive solution.\n\n-\
    \ **Web storage**: The simplest form of storing data over the web is web storage,\
    \ in which key-value pairs are stored.\n- **Web SQL database**: If the application\
    \ requires a full relational database, then Web SQL database is also available\
    \ for us.\n- **IndexedDB**: This is a NoSQL database that is seen as a good alternative\
    \ to its relational counterpart. It is considered to be a good option for complex\
    \ database requirements.\n- **Filesystem API**: This is the preferred form of\
    \ data storage if the data is of larger data types like images, audios and videos.\n\
    \nIn all of the above mentioned types of data storage, the data is tied to the\
    \ URL. Therefore, this data cannot be accessed by other websites. This is an important\
    \ consideration when multiple websites are hosted on a shared domain.\n\n## Exploring\
    \ localStorage\n\nLocalStorage is one of the two storage mechanisms used for data\
    \ storage. It is basically a Storage Object, which is stored as a global variable.\
    \ The biggest advantage of using this mechanism is that the API provided for reading\
    \ and writing data is simple and easy to use.\n\n### How to Use localStorage Object\
    \ Reference\n\nThe attributes and methods available include:\n\n- **setItem(key,\
    \ value)**: It is a method that is used to set a value with the help of an associated\
    \ key. The syntax for this operation is:\n\n```javascript\nlocalStorage.setItem('fName',\
    \ $('#fName').val());\n```\n\n- **getItem(key)**: It is a method that is used\
    \ to get a value associated to the specified key. The syntax for this operation\
    \ is:\n\n```javascript\nvar fName = localStorage.getItem('fName');\n```\n\nIf\
    \ no value is set, then null is returned.\n\n- **removeItem(key)**: It is a method\
    \ that is used to remove a value associated to the specified key. The syntax for\
    \ this operation is:\n\n```javascript\nlocalStorage.removeItem('fName');\n```\n\
    \n- **clear()**: Removes all items from the local storage. Its syntax is:\n\n\
    ```javascript\nlocalStorage.clear();\n```\n\n- **length**: It is the property\
    \ that returns the number of entries in the storage.\n\n```javascript\nvar count\
    \ = localStorage.length;\n```\n\n- **key(index)**: This method is used for finding\
    \ the key associated with the given value. The syntax for this operation is:\n\
    \n```javascript\nvar keyValue = localStorage.key(1);\n```\n\nOne of the biggest\
    \ benefits of using this storage mechanism is that it is supported by most modern\
    \ browsers, unlike other storage mechanisms, which are supported by only a few\
    \ browsers. Although this mechanism is supported by most web browsers, it is a\
    \ good idea to check it before using it. If the first reference to this storage\
    \ returns null, then it can be assumed that the storage mechanism is not supported.\
    \ In addition to this, you can also use the construct given below for this purpose:\n\
    \n```javascript\nfunction isWSSupported() {\n    return 'localStorage' in window;\n\
    }\n\nif (isWSSupported()) {\n    localStorage.setItem('fName', $('#fName').val());\n\
    }\n```\n\nIn addition to this, you can also use the Modernizr javascript library\
    \ for the checking purpose. It is worth mentioning here that this type of web\
    \ storage allows 5MB of web storage, as against the 4KB of web storage allowed\
    \ by cookies. When the storage space is exceeded, an exception for the same is\
    \ thrown by the system.\n\nAlthough web storage allows storage of strings only,\
    \ but you can also store complex objects with the help of JSON utility methods.\n\
    \n## How to Use Short-term Persistence with sessionStorage\n\nSessionStorage is\
    \ also a Storage Object, with the same attributes and methods as localStorage.\
    \ The only difference between the two storage mechanisms is that sessionStorage\
    \ stores data for the session only. If the browser window is closed, the data\
    \ will no longer be available for use.\n\n## Issues Related to sessionStorage\
    \ and localStorage\n\nSome of the issues related to these two storage mechanisms\
    \ include:\n\n1. Simultaneous reading and writing of the hard drive.\n2. Slow\
    \ searching capabilities.\n3. No support for transactions.\n\n## How to Handle\
    \ Storage Events\n\nSynchronization is the biggest challenge faced in the implementation\
    \ of web storage. In order to deal with this issue, you can subscribe to storage\
    \ events, which can notify you about any changes that may have been occurred.\
    \ When you subscribe to a StorageEvent, you get access to the following properties:\n\
    \n- newValue\n- oldValue\n- url\n- key\n- storageArea\n\nUnlike other events,\
    \ cancelling or bubbling a StorageEvent is not allowed. You can subscribe to an\
    \ event using the following construct:\n\n```javascript\nfunction respond(exc)\
    \ {\n    alert(exc.newValue);\n}\n\nwindow.addEventListener('storage', respond,\
    \ false);\n```\n\nThis event can be triggered using the following operation:\n\
    \n```javascript\nlocalStorage.setItem('name', 'Clark');\n```\n\nYou can also bind\
    \ to these events with the help of jQuery."
  mdcn: "\n## 如何使用 WebSocket 库\n\n处理上述所有问题可能具有挑战性。因此，应对此情况的最佳方式是使用服务器和客户端库。有若干库可供探索，例如\
    \ SignalR 和 Socket.IO。\n\n## 第10章：借助 Web Storage 管理本地数据\n\n上一节讨论的大部分主题都侧重于提升网站性能及其为客户提供服务的能力。因此，对信息或数据的处理被限制于客户端与服务器之间传输的数据。在这种情况下，服务器需要等待完整的往返过程发生，这涉及成本开销。\n\
    \n为了解决这个问题，大多数现代浏览器已经开始支持 Web 或 DOM 存储，这允许在客户端级别存储一些数据。本章概述了所使用的存储机制，以及如何利用它们来提升系统在这方面的性能。\n\
    \n## Web Storage 简介\n\n在大多数 Web 应用程序中，会实现一个服务器端的存储解决方案，比如 SQL 数据库服务器。这可能有点像“用牛刀杀蚊”。你并不需要如此庞大的存储解决方案，因为在浏览器级别存储少量信息就能达到目的。\n\
    \nHttp cookies 一直是浏览器级别数据存储最受青睐且最常用的形式。事实上，大多数浏览器都使用它来存储用户信息。可以通过以下方式设置 cookie\
    \ 值：\n\n```javascript\nfunction setCookieValue(cName, cValue, daysToExpire) {\n\
    \    var daysToExpire = new Date();\n    daysToExpire.setDate(daysToExpire.getDate()\
    \ + daysToExpire);\n    cValue = cValue + \"; expires=\" + daysToExpire.toUTCString();\n\
    \    document.cookie = cName + \"=\" + cValue;\n}\n```\n\n可以使用以下代码检索 cookie 值：\n\
    \n```javascript\nfunction getCookieValue(cName) {\n    var cookie = document.cookie.split(\"\
    ;\");\n    for (var i = 0; i < cookie.length; i++) {\n        var cookies = cookie[i];\n\
    \        var indexVal = cookies.indexOf(\"=\");\n        var keyVal = cookies.substr(0,\
    \ indexVal);\n        var actualVal = cookies.substr(indexVal + 1);\n        if\
    \ (keyVal == cName)\n            return actualVal;\n    }\n}\n```\n\n下面的最后一段代码演示了如何使用\
    \ cookie。\n\n```javascript\nsetCookie('fName', 'Clark', 1);\n\nvar fName = getCookie('fName');\n\
    ```\n\n你也可以使用 jQuery 中提供的 cookie 插件，可以按以下方式使用：\n\n```javascript\n$.cookie('fName',\
    \ 'Clark');\n\nvar fName = $.cookie('fName');\n```\n\n尽管 cookies 被广泛使用，但它们带来了一些严重问题，如开销和容量限制。一些可用的替代方案包括：\n\
    \n- Google Gears\n- User Data\n- Java Applets\n- Flash Player\n\n这些选项比 cookies\
    \ 更好，并解决了它们的局限性，但它们也存在一些问题，包括：\n\n- 需要安装插件\n- 用户可以阻止它们\n- 对企业用户没有用处\n- 它们是特定于供应商的。\n\
    \n## HTML5 Storage\n\n尽管这些工具提供了一些不错但可能还有改进空间的解决方案，HTML5 还是推出了一些创新工具，试图提供一个全面的解决方案。\n\
    \n- **Web storage**：在网络上存储数据最简单的形式是 Web storage，它存储键值对。\n- **Web SQL database**：如果应用程序需要完整的关系型数据库，那么\
    \ Web SQL 数据库也为我们提供了选择。\n- **IndexedDB**：这是一个 NoSQL 数据库，被视为其关系型对应物的良好替代方案。它被认为是满足复杂数据库需求的好选择。\n\
    - **Filesystem API**：如果数据是较大的数据类型，如图像、音频和视频，这是首选的数据存储形式。\n\n在上述所有类型的数据存储中，数据都与\
    \ URL 绑定。因此，其他网站无法访问这些数据。这是在共享域名上托管多个网站时的一个重要考虑因素。\n\n## 探索 localStorage\n\nLocalStorage\
    \ 是用于数据存储的两种存储机制之一。它本质上是一个存储对象，作为全局变量存储。使用这种机制的最大优势在于，它提供的用于读写数据的 API 简单易用。\n\n\
    ### 如何使用 localStorage 对象引用\n\n可用的属性和方法包括：\n\n- **setItem(key, value)**：此方法用于通过关联的键设置值。此操作的语法为：\n\
    \n```javascript\nlocalStorage.setItem('fName', $('#fName').val());\n```\n\n- **getItem(key)**：此方法用于获取与指定键关联的值。此操作的语法为：\n\
    \n```javascript\nvar fName = localStorage.getItem('fName');\n```\n\n如果未设置任何值，则返回\
    \ null。\n\n- **removeItem(key)**：此方法用于移除与指定键关联的值。此操作的语法为：\n\n```javascript\nlocalStorage.removeItem('fName');\n\
    ```\n\n- **clear()**：从本地存储中移除所有项。其语法为：\n\n```javascript\nlocalStorage.clear();\n\
    ```\n\n- **length**：返回存储中条目数量的属性。\n\n```javascript\nvar count = localStorage.length;\n\
    ```\n\n- **key(index)**：此方法用于查找与给定值关联的键。此操作的语法为：\n\n```javascript\nvar keyValue\
    \ = localStorage.key(1);\n```\n\n使用此存储机制的最大好处之一是，它受到大多数现代浏览器的支持，而不像其他存储机制那样仅被少数浏览器支持。尽管此机制受到大多数\
    \ Web 浏览器的支持，但在使用之前对其进行检查是一个好主意。如果首次引用此存储返回 null，则可以假定不支持该存储机制。此外，你也可以使用下面的构造来达到此目的：\n\
    \n```javascript\nfunction isWSSupported() {\n    return 'localStorage' in window;\n\
    }\n\nif (isWSSupported()) {\n    localStorage.setItem('fName', $('#fName').val());\n\
    }\n```\n\n此外，你也可以使用 Modernizr javascript 库进行检查。值得一提的是，这种类型的 Web 存储允许 5MB 的存储空间，而\
    \ cookies 仅允许 4KB 的 Web 存储。当存储空间超出时，系统会抛出相应的异常。\n\n尽管 Web 存储只允许存储字符串，但你也可以借助 JSON\
    \ 工具方法存储复杂的对象。\n\n## 如何使用 sessionStorage 进行短期持久化\n\nSessionStorage 也是一个存储对象，具有与\
    \ localStorage 相同的属性和方法。这两种存储机制的唯一区别在于，sessionStorage 仅存储当前会话的数据。如果浏览器窗口被关闭，数据将不再可用。\n\
    \n## 与 sessionStorage 和 localStorage 相关的问题\n\n与这两种存储机制相关的一些问题包括：\n\n1. 同时对硬盘进行读写操作。\n\
    2. 搜索能力较慢。\n3. 不支持事务。\n\n## 如何处理存储事件\n\n同步是实现 Web 存储时面临的最大挑战。为了应对这个问题，你可以订阅存储事件，该事件会通知你可能已发生的任何更改。当你订阅一个\
    \ StorageEvent 时，你将可以访问以下属性：\n\n- newValue\n- oldValue\n- url\n- key\n- storageArea\n\
    \n与其他事件不同，StorageEvent 不允许取消或冒泡。你可以使用以下结构来订阅事件：\n\n```javascript\nfunction respond(exc)\
    \ {\n    alert(exc.newValue);\n}\n\nwindow.addEventListener('storage', respond,\
    \ false);\n```\n\n可以使用以下操作触发此事件：\n\n```javascript\nlocalStorage.setItem('name',\
    \ 'Clark');\n```\n\n你也可以借助 jQuery 来绑定这些事件。\n"
