    \ function (request, response) {\n  if (request.method.toLowerCase() == 'post')\
    \ {\n    var form = new formidable.IncomingForm();\n    form.parse(request, function\
    \ (err, fields) {\n      response.writeHead(200, { 'Content-Type': 'text/html'\
    \ });\n      response.write('Hey ' + fields.userName + '!<br />');\n      response.end('Enjoy\
    \ this POST.');\n      console.log('Handled request from ' + fields.userName);\n\
    \    });\n  }\n});\napp.get('/SubmitHey', function (request, response) {\n  response.writeHead(200,\
    \ { 'Content-Type': 'text/html' });\n  response.write('Hey ' + request.query.userName\
    \ + '!<br />');\n  response.end('Enjoy.');\n  console.log('Handled request from\
    \ ' + request.query.userName);\n});\nvar port = 8080;\napp.listen(port);\nconsole.log('Listening\
    \ on: ' + port + 'port');\n```\n\nf. You can now run the application in a similar\
    \ manner as you did for the previous example.\n\n## Working with web services\n\
    \nOne of the biggest drawbacks of a typical website scenario is that the HTML\
