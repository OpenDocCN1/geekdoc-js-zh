    \ they cannot be used for storing files. Therefore, FileSystem API is used for\
    \ this purpose. The chapter ends with a discussion on how you can make your website\
    \ offline-friendly using HTTP Cache.\n\n### Web SQL\n\nWeb SQL is a relational\
    \ database and its most recent implementations are created on SQLite. However,\
    \ it is important to mention that this database construct is no longer supported\
    \ by W3C yet it is still supported by many browsers.\n\n### How to Create and\
    \ Open Database\n\nA database can be created and opened using the following syntax:\n\
    \n```\nvar dbase = openDatabase('Lib', '1.0', 'Sample library', 5 * 1024 * 1024);\n\
    ```\n\nThe parameters are as follows:\n\n- name\n- version\n- displayName\n- estimatedSize\n\
    - creationCallback\n\n### How to Manipulate Database\n\nManipulation scripts in\
    \ SQL can be given as parameter to the `transaction.executeSql()` function for\
    \ manipulating the database. An example of how a table can be created is given\
    \ below:\n\n```\ntransaction.executeSql(\"CREATE TABLE IF NOT EXISTS\nemployees(\n\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\nfName TEXT,\nlName TEXT\n)\");\n```\n\n\
    ### IndexedDB\n\nTill now, you have dealt with the two extreme cases of storing\
    \ data over the web. While the web storage mechanisms follows the simple key-value\
    \ pair model, Web SQL is based on the relational database model. IndexedDB is\
    \ an alternative model that lies somewhere in between these two models. It is\
    \ capable of dealing with everything from strings to complex objects. However,\
    \ while using this storage mechanism, use browser-independent methods.\n\nA database\
    \ can be opened or created in the following manner:\n\n```\nvar indexedDB = window.indexedDB;\n\
    \nvar openRequest = indexedDB.open('Lib', 1);\n```\n\nAn important facet of IndexedDB\
    \ object is the keypath property, which is used to define the attributes that\
    \ must be used as the key. If the specified property does not exist, then an auto-incrementing\
    \ or auto-decrementing attribute can be created.\n\nIndexes can be added using\
    \ the following code:\n\n```\nvar openRequest = indexedDB.open('Lib', 2);\n\n\
    openRequest.onupgradeneeded = function(response)\n{\n\nvar store = response.currentTarget.transaction.objectStore(\"\
    employees\");\n\nstore.createIndex('lName', 'lName', { unique: false });\n};\n\
    ```\n\nThe parameters required are: Name, keypath and optional parameters. In\
    \ a similar manner, indexes can be removed using the following code:\n\n```\n\
    store.deleteIndex('lastName');\n```\n\nYou can add and remove object stores using\
    \ the following code:\n\n```\nvar openRequest = indexedDB.open('Lib', 3);\n\n\
    openRequest.onupgradeneeded = function(response)\n{\n    response.currentTarget.result.\n\
    \    deleteObjectStore(\"employees\");\n};\n```\n\nSimilarly, an object can be\
    \ added in the following manner:\n\n```\nresponse.currentTarget.result.\ncreateObjectStore(\"\
    employees\", { keyPath: 'email' });\n```\n\nThe next set of operations include\
    \ transactions, which are performed in the following manner:\n\n1. A transaction\
    \ has to be opened in the following manner:\n\n```\nvar newTrans = dbase.transaction(['employees',\
    \ 'payroll']);\n```\n\n```\nvar openRequest = indexedDB.open('Lib', 1);\n```\n\
    \n```\nvar dbase;\n\nopenRequest.onsuccess = function(response) {\n    dbase =\
    \ openRequest.result;\n    addEmployee();\n};\n\nfunction addEmployee() {\n  \
    \  var myTrans = dbase.transaction('employees', 'readwrite');\n    var employees\
    \ = myTrans.objectStore(\"employees\");\n    var request = employees.add({fName:\
    \ 'Sammy', lName: 'Carnie'});\n    request.onsuccess = function(response) {\n\
    \        alert('ID of New Record = ' + request.result);\n    };\n    request.onerror\
    \ = function(response) {\n        alert('Error adding record');\n    };\n}\n```\n\
    \n2. You can add a new record in the following manner:\n\n```\nvar openRequest\
    \ = indexedDB.open('Lib', 1);\n\nvar dbase;\n\nopenRequest.onsuccess = function(response)\
    \ {\ndbase = openRequest.result;\nupdateEmployee();\n};\n\nfunction updateEmployee()\
    \ {\nvar myTrans = dbase.transaction('employees', 'readwrite');\n\nvar employees\
    \ = myTrans.objectStore(\"employees\");\n\nvar request = employees.put({fName:\
    \ 'Sammy', lName: 'Carnie'}, 1);\n\nrequest.onsuccess = function(response) {\n\
    alert('ID of Updated Record = ' + request.result);\n};\n};\n```\n\n3. A record\
    \ can be updated in the following manner:\n\n```\nrequest.onerror = function(response)\
    \ {\n    alert('Error updating record');\n};\n```\n\n4. You can delete a record\
    \ using the following code:\n\n```\nfunction deleteEmployee() {\n    var myTrans\
    \ = dbase.transaction('employees', 'readwrite');\n    var employees = myTrans.objectStore(\"\
    employees\");\n    var request = employees.delete(1);\n    request.onsuccess =\
    \ function(response) {\n        alert('Record deleted');\n    };\n    request.onerror\
    \ = function(response) {\n        alert('Error deleting record');\n    };\n}\n\
    ```\n\n### How to Work with FileSystem API\n\nThe above mentioned storage mechanisms\
    \ can be used for storing data, which is in form of strings. However, complex\
    \ data structures like files and images may also be stored using URIs. However,\
    \ it is an excessively costly option. HTML5 offers a low cost and simpler option\
    \ called FileSystem API for this purpose. Using this format, you can create files\
    \ and directories on a user file system's sandboxed location.\n\nThe functionalities\
    \ available include:\n\n1. A FileSystem can be opened and created using:\n\n```\n\
    window.requestFileSystem(TEMPORARY, 5 * 1024 * 1024, getFile, handleError);\n\n\
    function getFile(fileSystem) {\n    fileSystem.root.getFile(\"sample.txt\", {\
    \ create: true }, fileOpened, handleError);\n}\n\nfunction fileOpened(fileEntry)\
    \ {\n    alert(\"File opened!\");\n}\n\nfunction handleError(error) {\n    alert(error.code);\n\
    }\n```\n\nThe parameters for the `requestFileSystem()` function are type, size,\
    \ successCallback and errorCallback. On the other hand, the parameter for `getFile()`\
    \ function are path and options.\n\n2. You can write to a file using the following\
    \ code:\n\n```\nfunction writeToFile(fileWriter) {\n  fileWriter.onwriteend =\
    \ function() {\n    alert('Success'); };\n\n  fileWriter.onerror = function()\
    \ { alert('Failed'); };\n\n  fileWriter.write(new Blob(['Hello world'], {type:\
    \ 'text/plain'}));\n}\n```\n\nYou can append to a file using the following code:\n\
    \n```\nfunction appendToFile(fileWriter) {\n  fileWriter.onwriteend = function()\
    \ {\n    alert('Success'); };\n\n  fileWriter.onerror = function() { alert('Failed');\
    \ };\n\n  fileWriter.seek(fileWriter.length);\n\n  fileWriter.write(new Blob(['Hello\
    \ world'], {type: 'text/plain'}));\n}\n```\n\n3. You can read from a file using\
    \ the following code:\n\n```\nfunction readFile(file) {\n    var fileReader =\
    \ new FileReader();\n    fileReader.onloadend = function() { alert(this.result);\
    \ };\n    fileReader.onerror = function() { alert('Failed'); };\n    fileReader.readAsText(file);\n\
    }\n```\n\n4. You can delete a file using the following code:\n\n```\nfileEntry.remove(fileRemoved,\
    \ handleError);\n```\n\nSimilar functions exist for directories as well.\n\n##\
    \ Appendix\n\n- `<a>` Hyperlink\n- `<abbr>` Abbreviation\n- `<address>` Contact\
    \ information\n- `<area>` Image map region\n- `<article>` Independent section\n\
    - `<aside>` Auxiliary section\n- `<audio>` Audio stream\n- `<b>` Bold text\n-\
    \ `<base>` Document base URI\n- `<bb>` Browser button\n- `<bdo>` Bi-directional\
    \ text override\n- `<blockquote>` Long quotation\n- `<body>` Main content\n- `<br>`\
    \ Line break\n- `<button>` Push button control"
  mdcn: "\n## 第11章\n\n## 离线Web应用\n\n上一章讨论了存储，这是最常用的离线应用之一。然而，在某些场景下，你可能需要更强大的工具和高级功能，例如索引、异步支持和事务处理。这些功能是众多其他离线应用的一部分。\n\
    \n本章将讨论用于数据存储的两种关系型结构：Web SQL和IndexedDB。然而，它们无法用于存储文件。因此，我们使用FileSystem API来实现此目的。本章最后将讨论如何利用HTTP缓存使你的网站支持离线访问。\n\
    \n### Web SQL\n\nWeb SQL是一个关系型数据库，其最新实现基于SQLite构建。但需要指出的是，这一数据库结构已不再被W3C支持，不过它仍被许多浏览器所支持。\n\
    \n### 如何创建和打开数据库\n\n可以使用以下语法创建和打开数据库：\n\n```\nvar dbase = openDatabase('Lib',\
    \ '1.0', 'Sample library', 5 * 1024 * 1024);\n```\n\n参数如下：\n\n- name\n- version\n\
    - displayName\n- estimatedSize\n- creationCallback\n\n### 如何操作数据库\n\n可以在`transaction.executeSql()`函数中传入SQL操作脚本来操作数据库。以下是一个创建表示例：\n\
    \n```\ntransaction.executeSql(\"CREATE TABLE IF NOT EXISTS\nemployees(\nid INTEGER\
    \ PRIMARY KEY AUTOINCREMENT,\nfName TEXT,\nlName TEXT\n)\");\n```\n\n### IndexedDB\n\
    \n至此，你已经了解了在网络存储数据的两种极端情况。Web存储机制采用简单的键值对模型，而Web SQL则基于关系数据库模型。IndexedDB是一种介于两者之间的替代模型。它能够处理从字符串到复杂对象的一切数据。然而，使用这种存储机制时，请使用与浏览器无关的方法。\n\
    \n可以按以下方式打开或创建数据库：\n\n```\nvar indexedDB = window.indexedDB;\n\nvar openRequest\
    \ = indexedDB.open('Lib', 1);\n```\n\nIndexedDB对象的一个重要特性是keypath属性，它用于定义必须用作键的属性。如果指定的属性不存在，则可以创建一个自动递增或自动递减的属性。\n\
    \n可以使用以下代码添加索引：\n\n```\nvar openRequest = indexedDB.open('Lib', 2);\n\nopenRequest.onupgradeneeded\
    \ = function(response)\n{\n\nvar store = response.currentTarget.transaction.objectStore(\"\
    employees\");\n\nstore.createIndex('lName', 'lName', { unique: false });\n};\n\
    ```\n\n所需参数为：名称、键路径和可选参数。类似地，可以使用以下代码删除索引：\n\n```\nstore.deleteIndex('lastName');\n\
    ```\n\n你可以使用以下代码添加和删除对象存储：\n\n```\nvar openRequest = indexedDB.open('Lib', 3);\n\
    \nopenRequest.onupgradeneeded = function(response)\n{\n    response.currentTarget.result.\n\
    \    deleteObjectStore(\"employees\");\n};\n```\n\n类似地，可以按以下方式添加一个对象：\n\n```\n\
    response.currentTarget.result.\ncreateObjectStore(\"employees\", { keyPath: 'email'\
    \ });\n```\n\n接下来的操作是事务，按以下方式执行：\n\n1. 必须按以下方式打开一个事务：\n\n```\nvar newTrans = dbase.transaction(['employees',\
    \ 'payroll']);\n```\n\n```\nvar openRequest = indexedDB.open('Lib', 1);\n```\n\
    \n```\nvar dbase;\n\nopenRequest.onsuccess = function(response) {\n    dbase =\
    \ openRequest.result;\n    addEmployee();\n};\n\nfunction addEmployee() {\n  \
    \  var myTrans = dbase.transaction('employees', 'readwrite');\n    var employees\
    \ = myTrans.objectStore(\"employees\");\n    var request = employees.add({fName:\
    \ 'Sammy', lName: 'Carnie'});\n    request.onsuccess = function(response) {\n\
    \        alert('新记录的ID = ' + request.result);\n    };\n    request.onerror = function(response)\
    \ {\n        alert('添加记录时出错');\n    };\n}\n```\n\n2. 你可以按以下方式添加一条新记录：\n\n```\n\
    var openRequest = indexedDB.open('Lib', 1);\n\nvar dbase;\n\nopenRequest.onsuccess\
    \ = function(response) {\ndbase = openRequest.result;\nupdateEmployee();\n};\n\
    \nfunction updateEmployee() {\nvar myTrans = dbase.transaction('employees', 'readwrite');\n\
    \nvar employees = myTrans.objectStore(\"employees\");\n\nvar request = employees.put({fName:\
    \ 'Sammy', lName: 'Carnie'}, 1);\n\nrequest.onsuccess = function(response) {\n\
    alert('已更新记录的ID = ' + request.result);\n};\n};\n```\n\n3. 可以按以下方式更新一条记录：\n\n```\n\
    request.onerror = function(response) {\n    alert('更新记录时出错');\n};\n```\n\n4. 你可以使用以下代码删除一条记录：\n\
    \n```\nfunction deleteEmployee() {\n    var myTrans = dbase.transaction('employees',\
    \ 'readwrite');\n    var employees = myTrans.objectStore(\"employees\");\n   \
    \ var request = employees.delete(1);\n    request.onsuccess = function(response)\
    \ {\n        alert('记录已删除');\n    };\n    request.onerror = function(response)\
    \ {\n        alert('删除记录时出错');\n    };\n}\n```\n\n### 如何使用FileSystem API\n\n上述存储机制可用于存储字符串形式的数据。然而，像文件和图像这样的复杂数据结构也可以使用URI来存储。不过，这是一个成本极高的选项。为此，HTML5提供了一种成本更低、更简单的选项，称为FileSystem\
    \ API。使用此格式，你可以在用户文件系统的沙盒位置创建文件和目录。\n\n可用的功能包括：\n\n1. 可以使用以下方式打开和创建文件系统：\n\n```\n\
    window.requestFileSystem(TEMPORARY, 5 * 1024 * 1024, getFile, handleError);\n\n\
    function getFile(fileSystem) {\n    fileSystem.root.getFile(\"sample.txt\", {\
    \ create: true }, fileOpened, handleError);\n}\n\nfunction fileOpened(fileEntry)\
    \ {\n    alert(\"文件已打开！\");\n}\n\nfunction handleError(error) {\n    alert(error.code);\n\
    }\n```\n\n`requestFileSystem()`函数的参数是类型、大小、成功回调和错误回调。另一方面，`getFile()`函数的参数是路径和选项。\n\
    \n2. 你可以使用以下代码写入文件：\n\n```\nfunction writeToFile(fileWriter) {\n  fileWriter.onwriteend\
    \ = function() {\n    alert('成功'); };\n\n  fileWriter.onerror = function() { alert('失败');\
    \ };\n\n  fileWriter.write(new Blob(['Hello world'], {type: 'text/plain'}));\n\
    }\n```\n\n你可以使用以下代码追加到文件：\n\n```\nfunction appendToFile(fileWriter) {\n  fileWriter.onwriteend\
    \ = function() {\n    alert('成功'); };\n\n  fileWriter.onerror = function() { alert('失败');\
    \ };\n\n  fileWriter.seek(fileWriter.length);\n\n  fileWriter.write(new Blob(['Hello\
    \ world'], {type: 'text/plain'}));\n}\n```\n\n3. 你可以使用以下代码读取文件：\n\n```\nfunction\
    \ readFile(file) {\n    var fileReader = new FileReader();\n    fileReader.onloadend\
    \ = function() { alert(this.result); };\n    fileReader.onerror = function() {\
    \ alert('失败'); };\n    fileReader.readAsText(file);\n}\n```\n\n4. 你可以使用以下代码删除文件：\n\
    \n```\nfileEntry.remove(fileRemoved, handleError);\n```\n\n目录也存在类似的功能。\n\n## 附录\n\
    \n- `<a>` 超链接\n- `<abbr>` 缩写\n- `<address>` 联系信息\n- `<area>` 图像映射区域\n- `<article>`\
    \ 独立章节\n- `<aside>` 辅助内容\n- `<audio>` 音频流\n- `<b>` 粗体文本\n- `<base>` 文档基础URI\n\
    - `<bb>` 浏览器按钮\n- `<bdo>` 双向文本覆盖\n- `<blockquote>` 长引用\n- `<body>` 主要内容\n- `<br>`\
    \ 换行\n- `<button>` 按钮控件\n"
