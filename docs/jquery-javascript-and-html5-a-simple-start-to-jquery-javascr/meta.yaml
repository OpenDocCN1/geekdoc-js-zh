    \ can be used in the following manner:\n\n```javascript\nvar xmlhttp=new XMLHttpRequest();\n\
    xmlhttp.open(\"GET\",\"/add?x=50&y=1\",false);\nxmlhttp.send();\nvar xmlDoc=xmlhttp.responseXML;\n\
    ```\n\nThe first line creates the object while the second line sets up the use\
    \ of GET method with the specified QueryString and the use of 'false' indicates\
    \ that the operation must be performed asynchronously. The next line sends the\
    \ request and the last line sets the response to a variable, which can be later\
    \ read and parsed for processing the response.\n\nHowever, the output generated\
    \ is JSON and not XML, therefore, the default.js file must be changed to:\n\n\
    ```javascript\n$(document).ready(function () {\n    $('#btnAdd').on('click', addTwoNum)\n\
    });\n\nfunction addTwoNum() {\n    var x = document.getElementById('x').value;\n\
    \    var y = document.getElementById('y').value;\n    var result = document.getElementById('finalResult');\n\
    \    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.open(\"GET\", \"/add?x=\"\
    \ + x + \"&y=\" + y, false);\n    xmlhttp.send();\n    var jsonObject = JSON.parse(xmlhttp.response);\n\
    \    result.innerHTML = jsonObject.result;\n}\n```\n\nThe code extracts the x\
    \ and y values from the <input> element for the same. After this, the XMLHttpRequest\
    \ is created and the open method is called using the QueryString. After the execution\
    \ of the send function, the response string is parsed. In order to test the page,\
    \ you can give the command:\n\n```\nnode app\n```\n\nThis command starts the web\
    \ service, after which you can open the browser window with the link:\n\nhttp://localhost:8080/SamplePage.html\n\
    \nthis code is operational now. However, you may wish to perform the AJAX call\
    \ in an asynchronous manner. For this, you must locate the open method and change\
    \ the ‘false’ parameter to ‘true’. Besides this, you will also be required to\
    \ subscribe to *onreadystatechange* for managing asynchronous call. This can be\
    \ implemented in the following manner:\n\n```javascript\nfunction addTwoNum ()\
    \ {\n    var a = document.getElementById('a').value;\n    var b = document.getElementById('b').value;\n\
    \    var result = document.getElementById('finalResult');\n    var xmlhttp = new\
    \ XMLHttpRequest();\n    xmlhttp.onreadystatechange = function () {\n        if\
    \ (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n        {\n            var\
    \ jsonObject = JSON.parse(xmlhttp.response);\n            result.innerHTML = jsonObject.result;\n\
    \        }\n    }\n    xmlhttp.open(\"GET\", \"/add?a=\" + a + \"&b=\" + b , true);\n\
    \    xmlhttp.send();\n}\n```\n\nThe codes for states are as follows:\n\n- 0 -\
    \ Uninitialized\n- 1 - Loading\n- 2 - Loaded\n- 3 - Interactive\n- 4 - Completed\n\
    \nIf progress events are provided by the server, you can subscribe to the browser’s\
    \ progress event. Then, an event listener can be added to initiate the execution\
    \ of the code when the event is triggered. This can be done in the following manner:\n\
    \n```javascript\nfunction addTwoNum () {\n    var a = document.getElementById('a').value;\n\
    \    var b = document.getElementById('b').value;\n    var finalResult = document.getElementById('finalResult');\n\
    \    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.onreadystatechange = function\
    \ () {\n        if (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n      \
    \  {\n            var jsonObject = JSON.parse(xmlhttp.response);\n           \
    \ result.innerHTML = jsonObject.result;\n        }\n    }\n    xmlhttp.addEventListener(\"\
    progress\", updateProgress, false);\n    xmlhttp.open(\"GET\", \"/add?a=\" + a\
    \ + \"&b=\" + b , true);\n    xmlhttp.send();\n}\n\nfunction updateProgress(evt)\
    \ {\n    if (evt.lengthComputable) {\n        var percentComplete = evt.loaded\
    \ / evt.total;\n        //display the progress by outputting percentComplete\n\
    \    } else {\n        // You need to know the total size to compute the progress\n\
    \    }\n}\n```\n\nYou can also perform error handling by subscribing to the error\
    \ event and the abort event. This can be done in the following manner:\n\n```javascript\n\
    function addTwoNum () {\n    var a = document.getElementById('a').value;\n   \
    \ var b = document.getElementById('b').value;\n    var finalResult = document.getElementById('finalResult');\n\
    \    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.onreadystatechange = function\
    \ () {\n        if (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n      \
    \  {\n            var jsonObject = JSON.parse(xmlhttp.response);\n           \
    \ result.innerHTML = jsonObject.result;\n        }\n    }\n    xmlhttp.addEventListener(\"\
    progress\", updateProgress, false);\n    xmlhttp.addEventListener(\"error\", failed,\
    \ false);\n    xmlhttp.addEventListener(\"abort\", canceled, false);\n    xmlhttp.open(\"\
    GET\", \"/addition?x=\" + x + \"&y=\" + y , true);\n    xmlhttp.send();\n}\n\n\
    function transferFailed(evt) {\n    alert(\"An error occurred\");\n}\n\nfunction\
    \ canceled(evt) {\n    alert(\"canceled by the user\");\n}\n```\n\nIt is also\
    \ beneficial for you to know that different browsers implement and respond to\
    \ objects in different manners. Therefore, it is advised that you must XMLHttpRequest\
    \ as jQuery wrappers. The use of jQuery makes the code browser independent. The\
    \ jQuery wrapper for AJAX call is $ajax(), which accepts an object as a parameter.\
    \ The above code can be re-implemented in the following manner:\n\n```javascript\n\
    function addTwoNum () {\n    var a = $('#a').val();\n    var b = $('#b').val();\n\
    \    var data = { \"a\": a, \"b\": b };\n    $.ajax({\n        url: '/add',\n\
    \        data: data,\n        type: 'GET',\n        cache: false,\n        dataType:\
    \ 'json',\n        success: function (data) {\n            $('#result').html(data.result);\n\
    \        }\n    });\n}\n```\n\nThe variable values are retrieved and supplied\
    \ to the ajax call. The other properties and objects are set as shown. Another\
    \ topic of concern is CORS, or Cross-Origin Resource Sharing, which is a way for\
    \ allowing cross-site AJAX calls."
  mdcn: "\n## 面向初学者的 jQuery、JavaScript 和 HTML5 入门指南\n\n该包可被使用，并将操作作为参数传递。这个包一个良好的\
    \ RESTful 实现可能如下所示：\n\nhttp://localhost:8080/samplePackage?operation=add&x=1&y=5\n\
    \n## 如何使用 AJAX 调用 Web 服务\n\n可以使用 AJAX 异步调用 Web 服务，AJAX 实际上是一种 JavaScript。AJAX\
    \ 不是调用服务器并重绘 HTML 文档，而是回调到服务器。在这种情况下，屏幕不会被重绘。以下是一个示例实现：\n\n可以使用以下代码创建一个 MyPage.html：\n\
    \n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n\
    \    <title></title>\n    <script type=\"text/javascript\" src=\"/scripts/jquery-1.8.2.min.js\"\
    ></script>\n    <script type=\"text/javascript\" src=\"/scripts/default.js\"></script>\n\
    </head>\n<body>\n    <form id=\"myForm\">\n        Enter Value of X:<input type=\"\
    text\" id=\"x\" /><br />\n        Enter Value of Y:<input type=\"text\" id=\"\
    y\" /><br />\n        Result of Operation: <span id=\"result\"></span><br />\n\
    \        <button id=\"btnAdd\" type=\"button\">Add the Numbers</button>\n    </form>\n\
    </body>\n</html>\n```\n\n必须修改 default.js 文件，以包含处理这些功能所需的代码。请务必检查 jQuery 的版本，以及它是否与你在\
    \ default.js 文件中提到的版本名称相匹配。此处使用的 `<form>` 元素仅是一种安排数据格式的方式，数据实际上并非通过表单发送到服务器。JavaScript\
    \ 和 jQuery 访问输入的数据并执行 AJAX 调用。\n\n## 如何使用 XMLHttpRequest\n\n实际发起 AJAX 调用的对象是 XMLHttpRequest，它可用于发送/接收\
    \ XML 和其他类型的数据。该对象可以按以下方式使用：\n\n```javascript\nvar xmlhttp=new XMLHttpRequest();\n\
    xmlhttp.open(\"GET\",\"/add?x=50&y=1\",false);\nxmlhttp.send();\nvar xmlDoc=xmlhttp.responseXML;\n\
    ```\n\n第一行创建对象，第二行设置使用 GET 方法和指定的 QueryString，'false' 的使用表示操作必须异步执行。下一行发送请求，最后一行将响应设置为一个变量，之后可以读取和解析该变量以处理响应。\n\
    \n但是，生成的输出是 JSON 而不是 XML，因此，必须将 default.js 文件更改为：\n\n```javascript\n$(document).ready(function\
    \ () {\n    $('#btnAdd').on('click', addTwoNum)\n});\n\nfunction addTwoNum() {\n\
    \    var x = document.getElementById('x').value;\n    var y = document.getElementById('y').value;\n\
    \    var result = document.getElementById('finalResult');\n    var xmlhttp = new\
    \ XMLHttpRequest();\n    xmlhttp.open(\"GET\", \"/add?x=\" + x + \"&y=\" + y,\
    \ false);\n    xmlhttp.send();\n    var jsonObject = JSON.parse(xmlhttp.response);\n\
    \    result.innerHTML = jsonObject.result;\n}\n```\n\n该代码从对应的 `<input>` 元素中提取\
    \ x 和 y 的值。之后，创建 XMLHttpRequest 对象，并使用 QueryString 调用 open 方法。执行 send 函数后，响应字符串被解析。为了测试页面，你可以给出命令：\n\
    \n```\nnode app\n```\n\n此命令启动 Web 服务，之后你可以使用以下链接在浏览器窗口中打开页面：\n\nhttp://localhost:8080/SamplePage.html\n\
    \n这段代码现在可以运行了。但是，你可能希望以异步方式执行 AJAX 调用。为此，你必须找到 open 方法并将 'false' 参数更改为 'true'。除此之外，你还需要订阅\
    \ *onreadystatechange* 以管理异步调用。这可以按以下方式实现：\n\n```javascript\nfunction addTwoNum\
    \ () {\n    var a = document.getElementById('a').value;\n    var b = document.getElementById('b').value;\n\
    \    var result = document.getElementById('finalResult');\n    var xmlhttp = new\
    \ XMLHttpRequest();\n    xmlhttp.onreadystatechange = function () {\n        if\
    \ (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n        {\n            var\
    \ jsonObject = JSON.parse(xmlhttp.response);\n            result.innerHTML = jsonObject.result;\n\
    \        }\n    }\n    xmlhttp.open(\"GET\", \"/add?a=\" + a + \"&b=\" + b , true);\n\
    \    xmlhttp.send();\n}\n```\n\n状态码如下：\n\n- 0 - 未初始化\n- 1 - 加载中\n- 2 - 已加载\n-\
    \ 3 - 交互中\n- 4 - 完成\n\n如果服务器提供了进度事件，你可以订阅浏览器的进度事件。然后，可以添加一个事件监听器，以便在事件触发时启动代码的执行。这可以按以下方式完成：\n\
    \n```javascript\nfunction addTwoNum () {\n    var a = document.getElementById('a').value;\n\
    \    var b = document.getElementById('b').value;\n    var finalResult = document.getElementById('finalResult');\n\
    \    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.onreadystatechange = function\
    \ () {\n        if (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n      \
    \  {\n            var jsonObject = JSON.parse(xmlhttp.response);\n           \
    \ result.innerHTML = jsonObject.result;\n        }\n    }\n    xmlhttp.addEventListener(\"\
    progress\", updateProgress, false);\n    xmlhttp.open(\"GET\", \"/add?a=\" + a\
    \ + \"&b=\" + b , true);\n    xmlhttp.send();\n}\n\nfunction updateProgress(evt)\
    \ {\n    if (evt.lengthComputable) {\n        var percentComplete = evt.loaded\
    \ / evt.total;\n        //通过输出 percentComplete 来显示进度\n    } else {\n        //你需要知道总大小才能计算进度\n\
    \    }\n}\n```\n\n你也可以通过订阅 error 事件和 abort 事件来执行错误处理。这可以按以下方式完成：\n\n```javascript\n\
    function addTwoNum () {\n    var a = document.getElementById('a').value;\n   \
    \ var b = document.getElementById('b').value;\n    var finalResult = document.getElementById('finalResult');\n\
    \    var xmlhttp = new XMLHttpRequest();\n    xmlhttp.onreadystatechange = function\
    \ () {\n        if (xmlhttp.readyState == 4 && xmlhttp.status == 200)\n      \
    \  {\n            var jsonObject = JSON.parse(xmlhttp.response);\n           \
    \ result.innerHTML = jsonObject.result;\n        }\n    }\n    xmlhttp.addEventListener(\"\
    progress\", updateProgress, false);\n    xmlhttp.addEventListener(\"error\", failed,\
    \ false);\n    xmlhttp.addEventListener(\"abort\", canceled, false);\n    xmlhttp.open(\"\
    GET\", \"/addition?x=\" + x + \"&y=\" + y , true);\n    xmlhttp.send();\n}\n\n\
    function transferFailed(evt) {\n    alert(\"An error occurred\");\n}\n\nfunction\
    \ canceled(evt) {\n    alert(\"canceled by the user\");\n}\n```\n\n你了解这一点也很有帮助：不同的浏览器以不同的方式实现和响应对象。因此，建议你必须使用\
    \ jQuery 包装器来包装 XMLHttpRequest。使用 jQuery 使代码与浏览器无关。用于 AJAX 调用的 jQuery 包装器是 `$ajax()`，它接受一个对象作为参数。上述代码可以按以下方式重新实现：\n\
    \n```javascript\nfunction addTwoNum () {\n    var a = $('#a').val();\n    var\
    \ b = $('#b').val();\n    var data = { \"a\": a, \"b\": b };\n    $.ajax({\n \
    \       url: '/add',\n        data: data,\n        type: 'GET',\n        cache:\
    \ false,\n        dataType: 'json',\n        success: function (data) {\n    \
    \        $('#result').html(data.result);\n        }\n    });\n}\n```\n\n检索变量值并将其提供给\
    \ ajax 调用。其他属性和对象如图所示进行设置。另一个值得关注的主题是 CORS，即跨域资源共享，它是一种允许跨站 AJAX 调用的方式。\n"
