- md: "## The CSS Box Model\n\nThe CSS Box Model assumes that a webpage can be considered\
    \ to be made up of boxes. The spacing between these boxes are given by margins\
    \ and padding settings. These properties can be given values in the following\
    \ manner:\n\n```\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n```\n\n## Positioning\
    \ <div> elements\n\nThe element used for creating page layouts is <div>. Although,\
    \ HTML5 recommends the use of semantic markup instead of div elements, they are\
    \ still used for content that cannot be styled using semantic markup. A div element\
    \ can be imagined as a rectangular block and is declared in the following manner:\n\
    \n```\n<div>\n  <!--other elements are enclosed within this area-->\n</div>\n\
    ```\n\nProperties used to define the position of a div element include:\n\n- The\
    \ position of the div element can be defined using the properties, top, bottom,\
    \ left and right, in pixels.\n- A property, position, is used to define if the\
    \ position specified is static or relative.\n- The float property can be used\
    \ to allow elements to float to the right or left and is defined as `float: left`\
    \ or `float: right`.\n- The clear property places a clear element right after\
    \ the floating element.\n- You can also change the manner in which the browser\
    \ calculates width with the help of the box-sizing property. This property can\
    \ take three values: content-box (default setting), border-box and padding-box.\n\
    \n## Centering Content\n\nIf you are using a fixed width, the div element can\
    \ be centered using the properties, `margin-left` and `margin-right`. If you fix\
    \ the width and set the margins to `auto`, the extra space on the margins is equally\
    \ divided. It can be done in the following manner:\n\n```\n#container {\n  width:\
    \ 850px;\n  margin-left: auto;\n  margin-right: auto;\n}\n```\n\n## HTML5 Explained\n\
    \nThe chapter focuses on the basics of HTML5 and how they can be used for creating\
    \ high performance, new-generation pages. However, most of the elements explained\
    \ in that chapter included elements that HTML5 has received from its predecessors.\
    \ This chapter takes you a step further in your quest of learning HTML5, introducing\
    \ concepts that are newly added to this technology.\n\nIn the previous chapter\
    \ on CSS, we introduced the concept of `<div>` element to you. This element is\
    \ preferred over all its alternatives as far as page layout creation is concerned.\
    \ While some people also use the `<table>` element, it is usually not a recommended\
    \ solution as it is difficult to maintain as well use. However, both the concepts\
    \ are elaborated upon in this chapter.\n\n## Semantic Markup\n\nThe `<div>` and\
    \ `<span>` elements are the most commonly used and recommended elements for positioning\
    \ and formatting content. However, it is recommended that you should use different\
    \ `<div>` elements for specifying different sections of the page like header and\
    \ footer. This shall allow you to position them individually and in a more organized\
    \ manner. Therefore, the W3C has named these new elements with names like `<footer>`\
    \ and `<header>`.\n\n## Browser Support\n\nIt is true that your HTML code will\
    \ not be read by any of your users. However, there are other tools and machines\
    \ that are constantly parsing your code. These tools include web crawlers, which\
    \ index webpages for searching and NVDA (Non-Visual Desktop Access) devices, which\
    \ are used by many users with special needs as an alternative for reading and\
    \ comprehending webpages. Therefore, they require you to use tags that are understandable.\n\
    \n## How to Create HTML5 Documents\n\nAlthough, the above discussion clearly mentions\
    \ the importance of using meaningful tags and prohibits the use of tags like `<div>`\
    \ and `<span>`, you may still have to use them for styling purposes. As you read\
    \ on, you will realize how semantic tags must be supplied for providing meaning\
    \ to your tags. It is important to mention here that semantic tags should be used\
    \ carefully, and if you realize that there is a need to define custom elements,\
    \ then go ahead and use the `<div>` and `<span>` elements. However, be sure to\
    \ add an ID and class-name to the elements that describe their meaning as well\
    \ as possible.\n\n## How to Create HTML5 Layout Container\n\nA layout container,\
    \ as the name suggests, is a container that entails the layout of a page. In other\
    \ words, the container contains the different sections of the layout or its children\
    \ in such a manner that they can be positioned in a flexible manner. As a developer,\
    \ you can easily distinguish between `<div>` elements on the basis of their classnames\
    \ and IDs. However, this is not true for browsers.\n\nTherefore, there has got\
    \ to be a way by which you can ask the browser to interpret elements. For instance,\
    \ you may want to ask the browser to focus on a certain `<div>` element upon opening.\
    \ All this and more can be done with the help of layout containers that express\
    \ elements in such a manner that they are understandable to both the browser and\
    \ the user.\n\nSome of the commonly used elements for creating a layout container\
    \ include:\n\n- `<header>`\n  - It is used to define the header section or the\
    \ topmost section of the HTML document. This element can also be defined inside\
    \ the `<article>` element.\n- `<footer>`\n  - It is used to define the footer\
    \ section or the bottom-most section of the HTML document. This element can also\
    \ be defined inside the `<article>` element.\n- `<nav>`\n  - It is used to define\
    \ the section that contains all the navigational links.\n- `<aside>`\n  - This\
    \ element is generally used for sidebars and separates the content in the `<aside>`\
    \ element from the content that is outside this element.\n- `<section>`\n  - This\
    \ element defines a part of the whole section and is named with the elements `<h1>`,\
    \ `<h2>`, `<h3>`, `<h4>`, `<h5>` and `<h6>`.\n- `<article>`\n  - This element\
    \ defines a complete unit of content, which you can copy from one location to\
    \ another. An example of such a unit is a blog post.\n\n## Using Roles\n\nThe\
    \ role attribute can be declared inside the `<div>` and `<aside>` elements. The\
    \ role class hierarchy and the usage of roles for providing specific meanings,\
    \ as far as accessibility is concerned, is defined in WAI-ARIA (Web Accessible\
    \ Initiative - Accessible Rich Internet Applications).\n\nOne of the parent role\
    \ classes is the landmark role class, which defines the navigational landmarks\
    \ on the webpage. The child classes of the parent role class include:\n\n- banner\n\
    \  - This defines website specific content that is not expected to change from\
    \ one webpage to another like headers.\n- application\n  - This defines that the\
    \ specified area is a web application.\n- contentinfo\n  - This defines the information\
    \ included in the webpage about the webpage like copyright information. This information\
    \ is mostly a part of the footer content.\n- complementary\n  - This defines a\
    \ section of the page that is meaningful when detached from the page as well.\n\
    - main\n  - The main webpage content is defined using this child role class.\n\
    - form\n  - This defines the area of the webpage that is expected to take webpage\
    \ inputs.\n- search\n  - This child role class is used to define the location\
    \ on the webpage that is used for getting the search query from the user and displaying\
    \ the results of the search.\n- navigation\n  - The area containing navigational\
    \ links is a part of this child role class.\n\nThese roles can be used for providing\
    \ meaning. However, the new elements included in HTML5 are meaningful themselves.\
    \ Yet, there are some utilities that are not available in HTML5 and for these,\
    \ role attribute can be used.\n\n## How to Control format using `<div>` element?\n\
    \nAs mentioned previously, the `<div>` element is essentially invisible and does\
    \ not provide any meaning to the element. However, if you wish to use it for formatting\
    \ purposes only, then it is perfect for this purpose.\n\n## How to Add Thematic\
    \ Breaks?\n\nThe void element `<hr/>` can be used for adding thematic breaks,\
    \ which are used for denoting a transition from one set of content to another.\n\
    \n## How to Annotate Content?\n\nThere are several elements available for annotation.\
    \ These include `<b>` and `<i>`, which you have been using for ages. However,\
    \ they have new meanings now, in addition to the style that they denote. For instance,\
    \ the `<b>` element denotes the style ‘bold’. In addition"
  mdcn: "\n## CSS 盒模型\n\nCSS 盒模型假定网页可以被视为由多个盒子构成。这些盒子之间的间距通过外边距（margin）和内边距（padding）设置来定义。这些属性可以按以下方式赋值：\n\
    \n```\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n```\n\n## 定位 `<div>` 元素\n\
    \n用于创建页面布局的元素是 `<div>`。尽管 HTML5 推荐使用语义化标记来代替 div 元素，但对于那些无法通过语义化标记来设置样式的部分，它们仍然被使用。一个\
    \ div 元素可以被想象为一个矩形块，并按以下方式声明：\n\n```\n<div>\n  <!--other elements are enclosed\
    \ within this area-->\n</div>\n```\n\n用于定义 div 元素位置的属性包括：\n\n- div 元素的位置可以使用 `top`、`bottom`、`left`\
    \ 和 `right` 属性以像素为单位来定义。\n- `position` 属性用于定义指定的位置是静态的还是相对的。\n- `float` 属性可用于让元素向左或向右浮动，其定义为\
    \ `float: left` 或 `float: right`。\n- `clear` 属性会在浮动元素之后紧随一个清除元素。\n- 您还可以借助 `box-sizing`\
    \ 属性来改变浏览器计算宽度的方式。该属性可以接受三个值：`content-box`（默认设置）、`border-box` 和 `padding-box`。\n\
    \n## 内容居中\n\n如果您使用的是固定宽度，div 元素可以通过 `margin-left` 和 `margin-right` 属性来居中。如果您固定了宽度并将边距设置为\
    \ `auto`，那么边距上的额外空间会被平均分配。可以按以下方式实现：\n\n```\n#container {\n  width: 850px;\n \
    \ margin-left: auto;\n  margin-right: auto;\n}\n```\n\n## HTML5 详解\n\n本章侧重于 HTML5\
    \ 的基础知识，以及如何利用它们来创建高性能的新一代页面。然而，上一章解释的大多数元素都包含了 HTML5 从其前身继承而来的元素。本章将带您在学习 HTML5\
    \ 的道路上更进一步，介绍这项技术中新增加的概念。\n\n在之前的 CSS 章节中，我们向您介绍了 `<div>` 元素的概念。就页面布局创建而言，该元素优于其所有替代方案。虽然有些人也使用\
    \ `<table>` 元素，但通常不推荐这样做，因为它难以维护和使用。不过，本章会对这两个概念进行详细阐述。\n\n## 语义化标记\n\n`<div>`\
    \ 和 `<span>` 元素是最常用且推荐用于内容定位和格式化的元素。然而，建议您为页面的不同部分（如页眉和页脚）使用不同的 `<div>` 元素。这将允许您以更有条理的方式单独定位它们。因此，W3C\
    \ 将这些新元素命名为 `<footer>` 和 `<header>` 等。\n\n## 浏览器支持\n\n您的 HTML 代码确实不会被任何用户直接阅读。然而，有其他工具和机器在不断地解析您的代码。这些工具包括网络爬虫（为搜索引擎索引网页）和\
    \ NVDA（非视觉桌面访问）设备（许多有特殊需求的用户将其作为阅读和理解网页的替代工具）。因此，它们要求您使用易于理解的标签。\n\n## 如何创建 HTML5\
    \ 文档\n\n尽管上述讨论明确提到了使用有意义标签的重要性，并禁止使用像 `<div>` 和 `<span>` 这样的标签，但您可能仍需出于样式设置的目的而使用它们。随着阅读的深入，您将理解如何必须提供语义化标签来赋予您的标签以意义。这里需要提及的是，应谨慎使用语义化标签。如果您意识到需要定义自定义元素，那么就继续使用\
    \ `<div>` 和 `<span>` 元素。但是，请务必为元素添加尽可能描述其含义的 ID 和类名。\n\n## 如何创建 HTML5 布局容器\n\n\
    布局容器，顾名思义，是一个包含页面布局的容器。换句话说，该容器以一种灵活的方式包含布局的不同部分或其子元素，以便对它们进行定位。作为开发者，您可以根据它们的类名和\
    \ ID 轻松区分 `<div>` 元素。但是，浏览器并非如此。\n\n因此，必须有一种方式可以让您指示浏览器如何解释元素。例如，您可能希望浏览器在打开时专注于某个\
    \ `<div>` 元素。所有这些以及更多功能，都可以通过布局容器来实现，这些容器以浏览器和用户都能理解的方式表达元素。\n\n一些常用于创建布局容器的元素包括：\n\
    \n- `<header>`\n  - 用于定义 HTML 文档的头部部分或最顶部部分。此元素也可以定义在 `<article>` 元素内部。\n- `<footer>`\n\
    \  - 用于定义 HTML 文档的页脚部分或最底部部分。此元素也可以定义在 `<article>` 元素内部。\n- `<nav>`\n  - 用于定义包含所有导航链接的部分。\n\
    - `<aside>`\n  - 此元素通常用于侧边栏，并将 `<aside>` 元素内的内容与此元素外部的内容分隔开。\n- `<section>`\n\
    \  - 此元素定义了整体部分中的一个片段，并使用 `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>` 和 `<h6>` 元素来命名。\n\
    - `<article>`\n  - 此元素定义了一个完整的内容单元，您可以将其从一个位置复制到另一个位置。例如，一篇博客文章就是一个这样的单元。\n\n\
    ## 使用角色\n\n`role` 属性可以在 `<div>` 和 `<aside>` 元素内声明。关于可访问性，角色类层次结构以及使用角色来提供特定含义的定义，在\
    \ WAI-ARIA（Web 无障碍计划 - 无障碍富互联网应用）中有规定。\n\n父角色类之一是 `landmark` 角色类，它定义了网页上的导航地标。父角色类的子类包括：\n\
    \n- `banner`\n  - 定义网站特定的内容，这些内容预期不会在不同网页之间变化，例如页眉。\n- `application`\n  - 定义指定区域是一个\
    \ Web 应用程序。\n- `contentinfo`\n  - 定义网页中包含的有关网页本身的信息，例如版权信息。这些信息通常是页脚内容的一部分。\n\
    - `complementary`\n  - 定义一个部分，即使从页面中分离出来，该部分仍然有意义。\n- `main`\n  - 使用此子角色类定义网页的主要内容。\n\
    - `form`\n  - 定义网页中预期接收用户输入的区域。\n- `search`\n  - 此子角色类用于定义网页上用于接收用户搜索查询并显示搜索结果的位置。\n\
    - `navigation`\n  - 包含导航链接的区域属于此子角色类。\n\n这些角色可以用于提供含义。然而，HTML5 中包含的新元素本身就具有意义。不过，HTML5\
    \ 中缺少一些实用功能，对于这些功能，可以使用 `role` 属性。\n\n## 如何使用 `<div>` 元素控制格式？\n\n如前所述，`<div>`\
    \ 元素本质上是不可见的，并且不为元素提供任何含义。然而，如果您只想将其用于格式设置目的，那么它非常适合这个用途。\n\n## 如何添加主题分隔？\n\n\
    空元素 `<hr/>` 可用于添加主题分隔，用于表示从一组内容过渡到另一组内容。\n\n## 如何标注内容？\n\n有多种可用于标注的元素。这些包括您长期以来一直在使用的\
    \ `<b>` 和 `<i>`。然而，除了它们所表示的样式之外，现在它们有了新的含义。例如，`<b>` 元素表示“粗体”样式。此外\n"
