    ## 第1章


    ### 引言


    如果说有一个可以称为全面的应用开发框架，那么 HTML5 毫无疑问地胜出。尽管 HTML5 的规范尚未最终完成，但大多数现代网络浏览器都支持从智能手机到台式机等设备上的流行功能。这意味着你只需编写一个应用程序，它就能在你的设备上运行，而不会出现任何互操作性问题。


    毫无疑问，HTML5 是 Web 应用开发的未来。如果你希望在这个领域保持竞争力，就需要以前瞻性思维武装自己，以应对未来将向你袭来的技术挑战。HTML5 的应用范围之广，从大多数行业主要参与者都将目光投向这项技术并给予全力支持这一点就可见一斑。


    如果 HTML5 多方面的功能和丰富的特性引起了你的兴趣，你想要立即开始编写自己的应用程序，但不知道如何着手以及从哪里开始，那么这本书正是为你准备的。本书涵盖了你使用
    HTML、JavaScript/JQuery 和 CSS 创建可运行应用所需的一切知识。然而，它并非一本参考指南。我们希望为你提供实用知识，以便你能尽快投入开发。


    本书是一本完美的入门指南，涵盖了 HTML5、JavaScript 和 CSS 开发的所有基本方面。它涵盖了从最基础的内容到你与这个框架初次接触时所需的一切。前三章将为你介绍这三项技术，为你打下起步的基础。


    ## 第2章


    ### HTML5 基础


    HTML（超文本标记语言）是一种用于创建网页的语言。事实上，自第一个网页诞生以来，这种语言就一直被使用。然而，随着更新、更好的语言版本的引入，其功能也得到了发展。据信，HTML
    起源于最初用于文档发布的 SGML（标准通用标记语言）。HTML 从 SGML 继承了格式化功能及其语法的概念。


    在浏览器方面，HTML 使用最有趣且最有益的方面之一是浏览器同时支持向后兼容和向前兼容。向后兼容通常容易实现，而向前兼容则比较棘手，因为问题域在这种情况下是无限大的。然而，为了实现这一点，浏览器被设计为忽略它不识别的标签。


    多年来，HTML 一直是人们所需的一切。然而，随着时间的推移，人们感觉需要更多，这因另一种名为 XML（可扩展标记语言）的技术的存在而加剧。尽管 XML 与
    HTML 有许多相似之处，但两者之间也存在许多根本性差异。首先，XML 要求标签匹配，即对于每个起始标签，必须存在一个结束标签。除此之外，XML 允许你创建自己的标签，因为它不像
    HTML 那样拥有一组固定的标签。


    XML 中使用的标签是元标签，或描述起始标签和结束标签之间所包含数据的标签。为了确保 XML 文档的有效性，使用了一种名为 XSD（XML 架构定义）的技术。然而，这项技术不能用于验证
    HTML 文档，因为 HTML 文档缺乏明确定义的结构。


    W3C（万维网联盟）引入了 XHTML，试图修正 HTML 的缺陷。根据 XHTML 规范，HTML 文档被迫遵守用于 XML 的格式规范。因此，这允许使用
    XSD 工具来验证 HTML 文档。尽管将 XML 集成到该框架中解决了一些问题，但一些问题仍然不断出现。现代最突出的问题之一是集成多媒体的需求日益增长。虽然
    CSS 确实执行了一定程度的格式化，但对于用户不断增长的需求来说，它正变得力不从心。


    为了提供交互性和动画视觉效果支持，一种名为 JavaScript 的可编程支持被添加到这个组合中。然而，这种支持的早期版本难以让程序员理解，并且执行时间缓慢。这导致了
    Flash 等插件的引入，以吸引人们的关注。这些插件完成了它们预期的任务，但浏览器与多媒体的集成本质上仍然比较松散。


    HTML5 并不是 XHTML 的进化形式。相反，HTML5 可以更好地描述为 HTML 4.01 的重新发明形式，以及如何将 HTML、CSS 和 JavaScript
    一起使用以解决用户群不断增长的需求。


    ### 语义化标记


    HTML5 的基本特征是它强调行为、表现和结构的分离。网站开发中的语义化标记指定了文档的结构。换句话说，它指定了标签的含义以及它们将为你做什么。另一方面，行为和表现分别由
    CSS 和 JavaScript 控制。


    ### HTML5 元素


    在 HTML 中，一个元素仅仅是一个包含起始标签、内容和结束标签的语句。因此，当你写下，


    ```

    <div>

    <b>This is my world!</b>

    </div>

    ```


    在这个例子中，div 元素包含了从 `<div>` 到 `</div>` 的所有内容。因此，`<b></b>` 标签也是 div 元素的一部分。


    这里需要说明的是，HTML5 不区分大小写。因此，无论你是为粗体标签写 `<B>` 还是 `<b>`，浏览器都会认为两者相同。但是，W3C 标准推荐使用小写标签。


    ### 在 HTML5 中使用元素


    HTML5 定义了超过 100 个元素。这些元素及其定义在附录中提供。


    ### 如何向元素添加属性？


    附加数据可以以属性的形式添加到起始标签中。一个属性通常可以表示为 `name="value"`。属性名称的值包含在引号内。对于可以添加到起始标签的属性数量没有限制。对于这些属性，属性有一个名称，但没有值。


    示例：


    ```

    <div id="main" class="mainContent"></div>

    ```


    这里，`id` 和 `class` 是属性，其中 `id` 唯一地标识元素，`class` 指定 CSS 样式。

    '
