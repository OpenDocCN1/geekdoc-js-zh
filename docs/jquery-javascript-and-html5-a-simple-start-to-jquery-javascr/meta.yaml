- md: "## A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\n- Tables\
    \ are difficult to interpret for accessibility devices.\n\nSample Implementation:\n\
    \n```html\n<table>\n<tr>\n<td>Frank</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n\
    <td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\
    \nThe table created above will look like:\n\n| Frank | 1978 |\n|-------|------|\n\
    | David | 1967 |\n| Alex  | 1989 |\n\nAs you observe the table, you must have\
    \ realized that the table is not complete unless we define what is called the\
    \ table headers. This can be done using the `<th>` element. You can create table\
    \ headers both vertically and horizontally. For example, we can define the following\
    \ table header in the code used above.\n\n```html\n<table>\n<tr>\n<th>Name</th>\n\
    <th>Year of Birth</th>\n</tr>\n<tr>\n<td>Franky</td>\n<td>1978</td>\n</tr>\n<tr>\n\
    <td>David</td>\n<td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n\
    </table>\n```\n\nThe resulting table for this code will look like this:\n\n| Name\
    \  | Year of Birth |\n|-------|---------------|\n| Franky| 1978          |\n|\
    \ David | 1967          |\n| Alex  | 1989          |\n\nIn the above case, the\
    \ table headers are simply of a larger font size. However, you can style these\
    \ as you want by style rules. This can be done in the following manner:\n\n```css\n\
    th {\n    background-color: black;\n    color: white;\n}\n```\n\nThis style rule\
    \ will color the cells of the table headers with black color and the text will\
    \ be written in white.\n\nThe normal behavior of most browsers is to automatically\
    \ place all the `<tr>` elements in the `<tbody>`, indicating that this is the\
    \ body of the table. However, it is a good practice to define the `<tbody>` explicitly.\
    \ Besides this, the `<thead>` and `<tfoot>` can also be explicitly defined. The\
    \ header, body and footer of the table can be individually styled using CSS. As\
    \ a rule, you can have one header element, one or more body elements and one footer\
    \ element.\n\nThe next important content feature that must be added to the table\
    \ created above is the table caption. In order to define the table caption, the\
    \ `<caption>` element is used.\n\nIn some cases, you may feel the need to style\
    \ individual columns. This may seem like a difficult task considering the fact\
    \ that tables are essentially row centric in HTML. While you have `<tr>` elements\
    \ to identify rows, there are no `<tc>` elements for identifying columns. The\
    \ `<td>` element identifies a cell. However, you can still style individual columns\
    \ using the `<colgroup>` or `<col>` elements. The `<table>` element can have the\
    \ `<colgroup>` element, which includes the `<col>` elements for columns that are\
    \ a part of this group of elements. In addition, the `<col>` element also has\
    \ a *span* attribute for defining the columns that are a part of this group. A\
    \ sample implementation to explain how this works is given below:\n\n```html\n\
    <colgroup>\n<col span=\"2\" class=\"vHeader\" />\n</colgroup>\n```\n\nThe CSS\
    \ style rule for styling this group of columns can be something like this:\n\n\
    ```css\n.vHeader {\n    color: red;\n}\n```\n\nWhile the tables discussed till\
    \ now are regular tables, HTML5 also supports irregular tables, which can be described\
    \ as tables that have a different number of columns for each row. The rowspan\
    \ and colspan attributes can be used for managing the layout of the table.\n\n\
    ## Chapter 6: JavaScript and jQuery\n\nYou must have got a hang of the power of\
    \ JavaScript already. In the chapter on JavaScript, you have already learnt how\
    \ to create and adding JavaScript for making webpages dynamic. The biggest challenge\
    \ of web development is to design webpage elements that can run just as well on\
    \ any browser as different browsers provide support for different elements, making\
    \ it difficult to find a common ground.\n\nThis chapter takes you a step further\
    \ in JavaScript development by teaching you how to create objects and use them.\
    \ Besides this, it also introduces you to the concept of jQuery, which attempts\
    \ at creating browser-compatible code. Although, it cannot promise 100% browser\
    \ compatibility, but it certainly solves the day-to-day issues regarding the same.\n\
    \n### How to Create JavaScript Objects\n\nAnything from numbers to strings are\
    \ objects in **JavaScript**. Therefore, it is essential to know how to create\
    \ and deal with these effectively. **The simplest way to create objects in JavaScript\
    \ is using the object literal syntax.** The following example illustrates how\
    \ it is done.\n\n```javascript\nvar customer1 = {\n    yearOfBirth: 2000,\n  \
    \  name: 'Alex',\n    getCustomerInfo: function () {\n        return 'Customer:\
    \ ' + this.name + ' ' + this.yearOfBirth;\n    }\n};\n```\n\nThis code creates\
    \ an object customer1, with the data members, name and yearOfBirth and the member\
    \ function getCustomerInformation. It is also important to note the use of *this*\
    \ keyword, which accesses the values correctly being used or referenced for the\
    \ object concerned.\n\nBesides this, you can also create objects dynamically using\
    \ the new keyword. The methods inherited include:\n\n- constructor\n- isPrototypeOf\n\
    - hasOwnProperty\n- toLocalString\n- propertyIsEnumerable\n- valueOf\n- toString\n\
    \nOnce the object has been created, properties can be added to the same in the\
    \ following manner:\n\n```javascript\nfunction getCustomer(myName, myYearOfBirth)\
    \ {\n    var newCust = new Object();\n    newCust.name = myName;\n    newCust.yearOfBirth\
    \ = myYearOfBirth;\n    newCust.getCustomerInfo = function () {\n        return\
    \ 'Customer: ' + this.name + ' ' + this.yearOfBirth;\n    };\n    return newCust;\n\
    }\n```\n\nThis code creates an object newCust dynamically. Several instances of\
    \ this can be created in the following manner:\n\n```javascript\nvar cust1 = getCustomer('Alex',\
    \ 1978);\nvar cust2 = getCustomer('David', 1986);\n```\n\nAlthough, JavaScript\
    \ doesn't support a particular keyword 'class', but you can simulate classes using\
    \ the method mentioned above.\n\n### Namespaces\n\nThere is no specific keyword\
    \ like *namespace* for implementing namespaces. However, namespaces can be implemented\
    \ using the concepts of classes and objects. If you classify variables and methods\
    \ into objects and access them as instances of these objects, then you are placing\
    \ only the names of these objects in the global namespace, reducing the scope\
    \ of the variables to the object that they belong.\n\n### Implementing Inheritance\n\
    \nYou can define 'is-a' relationships between objects in JavaScript by creating\
    \ objects and then classifying those objects on the basis of their common characteristics.\
    \ For instance, if you are implementing an object for employee of a company. You\
    \ can create objects for specific types of objects like managerTechnical, managerGeneral,\
    \ technicalStaff, recruitmentStaff and officeStaff and then classify them into\
    \ objects, technicalStaff, which includes the objects managerTechnical and technicalStaff,\
    \ and adminStaff, which includes the managerGeneral, recruitmentStaff and officeStaff.\
    \ In a similar manner, new functions can also be defined.\n\n### Working with\
    \ jQuery\n\njQuery is a library of browser-compatible helper functions, which\
    \ you can use in your code to minimize the efforts required for typing, implementation\
    \ and testing. These functions are essentially written in JavaScript. Therefore,\
    \ **you can also call jQuery, a JavaScript library.**\n\nThe list of functionalities\
    \ that are available in jQuery include:\n\n- Attributes, which are a group of\
    \ methods that can be used for getting and setting attributes of the DOM elements.\n\
    - Ajax, which is a group of methods that provide support for synchronous and asynchronous\
    \ server calls.\n- Core Methods are the fundamental jQuery functions.\n- Callbacks\
    \ object is an object provided for management of callbacks.\n- Data Methods are\
    \ methods that facilitate the creation of association between DOM elements and\
    \ arbitrary data.\n- CSS Methods are methods that can be used for getting and\
    \ setting CSS-related properties.\n- Dimensions are methods that can be used for\
    \ accessing and manipulating the dimensions of DOM elements."
  mdcn: "\n## 面向初学者的 jQuery、JavaScript 和 HTML5 入门简介\n\n- 表格对于辅助功能设备来说难以解读。\n\n示例实现：\n\
    \n```html\n<table>\n<tr>\n<td>Frank</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n\
    <td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\
    \n上面创建的表格看起来会是：\n\n| Frank | 1978 |\n|-------|------|\n| David | 1967 |\n| Alex\
    \  | 1989 |\n\n当你观察这个表格时，你一定意识到，除非我们定义所谓的表头，否则这个表格是不完整的。这可以使用 `<th>` 元素来完成。你可以垂直或水平地创建表头。例如，我们可以在上面使用的代码中定义以下表头。\n\
    \n```html\n<table>\n<tr>\n<th>Name</th>\n<th>Year of Birth</th>\n</tr>\n<tr>\n\
    <td>Franky</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n\
    <tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\n此代码生成的表格将如下所示：\n\n\
    | Name  | Year of Birth |\n|-------|---------------|\n| Franky| 1978         \
    \ |\n| David | 1967          |\n| Alex  | 1989          |\n\n在上面的例子中，表头只是字体较大。但是，你可以通过样式规则随心所欲地设置它们的样式。这可以通过以下方式完成：\n\
    \n```css\nth {\n    background-color: black;\n    color: white;\n}\n```\n\n此样式规则将把表头的单元格背景色设置为黑色，文本颜色设置为白色。\n\
    \n大多数浏览器的正常行为是自动将所有 `<tr>` 元素放在 `<tbody>` 中，表示这是表格的主体。然而，显式定义 `<tbody>` 是一个好习惯。除此之外，还可以显式定义\
    \ `<thead>` 和 `<tfoot>`。表格的头部、主体和页脚可以分别使用 CSS 进行样式设置。作为一条规则，你可以有一个头部元素、一个或多个主体元素以及一个页脚元素。\n\
    \n必须添加到上面创建的表格中的下一个重要内容特性是表格标题。为了定义表格标题，需要使用 `<caption>` 元素。\n\n在某些情况下，你可能觉得需要为单个列设置样式。考虑到\
    \ HTML 中的表格本质上是行中心化的，这可能看起来像是一项困难的任务。虽然你有 `<tr>` 元素来标识行，但没有 `<tc>` 元素来标识列。`<td>`\
    \ 元素标识一个单元格。但是，你仍然可以使用 `<colgroup>` 或 `<col>` 元素为单个列设置样式。`<table>` 元素可以包含 `<colgroup>`\
    \ 元素，该元素又包含属于此元素组的各列的 `<col>` 元素。此外，`<col>` 元素还有一个 *span* 属性，用于定义属于此组的列。下面是一个解释其工作原理的示例实现：\n\
    \n```html\n<colgroup>\n<col span=\"2\" class=\"vHeader\" />\n</colgroup>\n```\n\
    \n用于为这组列设置样式的 CSS 样式规则可以像这样：\n\n```css\n.vHeader {\n    color: red;\n}\n```\n\n\
    虽然到目前为止讨论的表格都是常规表格，但 HTML5 也支持不规则表格，可以描述为每行列数不同的表格。可以使用 rowspan 和 colspan 属性来管理表格的布局。\n\
    \n## 第 6 章：JavaScript 和 jQuery\n\n你一定已经体会到了 JavaScript 的强大。在 JavaScript 章节中，你已经学习了如何创建和添加\
    \ JavaScript 以使网页动态化。Web 开发的最大挑战是设计网页元素，使其能在任何浏览器上运行得同样好，因为不同的浏览器对不同的元素提供支持，很难找到一个共同点。\n\
    \n本章将带你更进一步地学习 JavaScript 开发，教你如何创建和使用对象。除此之外，它还向你介绍了 jQuery 的概念，它试图创建浏览器兼容的代码。虽然它不能保证\
    \ 100% 的浏览器兼容性，但它确实解决了日常的此类问题。\n\n### 如何创建 JavaScript 对象\n\n从数字到字符串，任何东西在 **JavaScript**\
    \ 中都是对象。因此，了解如何有效地创建和处理这些对象至关重要。**在 JavaScript 中创建对象最简单的方法是使用对象字面量语法。**以下示例说明了如何操作。\n\
    \n```javascript\nvar customer1 = {\n    yearOfBirth: 2000,\n    name: 'Alex',\n\
    \    getCustomerInfo: function () {\n        return 'Customer: ' + this.name +\
    \ ' ' + this.yearOfBirth;\n    }\n};\n```\n\n此代码创建了一个名为 customer1 的对象，包含数据成员 name\
    \ 和 yearOfBirth，以及成员函数 getCustomerInformation。同样重要的是要注意 *this* 关键字的使用，它能正确访问正在为相关对象使用或引用的值。\n\
    \n除此之外，你也可以使用 `new` 关键字动态创建对象。继承的方法包括：\n\n- constructor\n- isPrototypeOf\n- hasOwnProperty\n\
    - toLocalString\n- propertyIsEnumerable\n- valueOf\n- toString\n\n对象创建后，可以按以下方式向其添加属性：\n\
    \n```javascript\nfunction getCustomer(myName, myYearOfBirth) {\n    var newCust\
    \ = new Object();\n    newCust.name = myName;\n    newCust.yearOfBirth = myYearOfBirth;\n\
    \    newCust.getCustomerInfo = function () {\n        return 'Customer: ' + this.name\
    \ + ' ' + this.yearOfBirth;\n    };\n    return newCust;\n}\n```\n\n此代码动态创建了一个对象\
    \ newCust。可以按以下方式创建其多个实例：\n\n```javascript\nvar cust1 = getCustomer('Alex', 1978);\n\
    var cust2 = getCustomer('David', 1986);\n```\n\n尽管 JavaScript 不支持特定的 'class' 关键字，但你可以使用上述方法模拟类。\n\
    \n### 命名空间\n\n没有像 *namespace* 这样的特定关键字来实现命名空间。但是，可以使用类和对象的概念来实现命名空间。如果你将变量和方法分类到对象中，并将它们作为这些对象的实例来访问，那么你实际上是将这些对象的名称放在全局命名空间中，从而将变量的范围缩小到它们所属的对象。\n\
    \n### 实现继承\n\n你可以通过创建对象，然后根据其共同特征对这些对象进行分类，来在 JavaScript 中定义对象之间的 'is-a' 关系。例如，如果你正在为公司的员工实现一个对象。你可以为特定类型的对象创建对象，如\
    \ managerTechnical、managerGeneral、technicalStaff、recruitmentStaff 和 officeStaff，然后将它们分类为对象，technicalStaff（包括\
    \ managerTechnical 和 technicalStaff 对象）和 adminStaff（包括 managerGeneral、recruitmentStaff\
    \ 和 officeStaff）。同样，也可以定义新的函数。\n\n### 使用 jQuery\n\njQuery 是一个浏览器兼容的辅助函数库，你可以在代码中使用它来减少输入、实现和测试所需的工作量。这些函数本质上是用\
    \ JavaScript 编写的。因此，**你也可以将 jQuery 称为一个 JavaScript 库。**\n\njQuery 中可用的功能列表包括：\n\
    \n- 属性（Attributes），这是一组可用于获取和设置 DOM 元素属性的方法。\n- Ajax，这是一组提供同步和异步服务器调用支持的方法。\n\
    - 核心方法（Core Methods）是基础的 jQuery 函数。\n- 回调对象（Callbacks object）是为管理回调提供的对象。\n- 数据方法（Data\
    \ Methods）是促进在 DOM 元素和任意数据之间建立关联的方法。\n- CSS 方法（CSS Methods）是可用于获取和设置 CSS 相关属性的方法。\n\
    - 尺寸（Dimensions）是可用于访问和操作 DOM 元素尺寸的方法。\n"
