- md: "## Chapter 9\n\n## WebSocket Communications\n\nThere are scenarios that may\
    \ require the establishment of two-way communication between the client and the\
    \ server. A sample application that requires this form of communication is a chat\
    \ application. This chapter gives an elaborative study of how WebSocket communication\
    \ can be established and used.\n\n### Communicating by using WebSocket\n\nWebSocket\
    \ communications are established using the WebSocket protocol, which uses the\
    \ TCP connection for establishing a full-duplex communication pathway. The protocol\
    \ has been standardized by the IETF (RFC 6455) and the working draft of the WebSocket\
    \ API is in W3C.\n\nThis technology has replaced the concept of long polling.\
    \ In this case, the client sends a request and keeps waiting for a response until\
    \ a response is received. The benefit of this approach is that the connection\
    \ remains open and as and when the data is available, it is immediately sent.\
    \ However, the connection may be timed out and a re-establishment may be required.\n\
    \n### Understanding WebSocket Protocol\n\nThe WebSocket protocol allows bi-directional\
    \ connection establishment and is designed for implementation for web servers\
    \ and clients. This technology only interacts with the handshake and is interpreted\
    \ as a transition from the http to WebSocket. The frame of this protocol has no\
    \ headers and an overhead of 2 bytes. It is a lightweight technology and its high\
    \ performance allows communication of live content and games.\n\n### Defining\
    \ WebSocket API\n\nThe heart of the WebSocket technology is WebSocket object.\
    \ This object is defined on the window object and contains the following members:\n\
    \n- close\n- WebSocket constructor\n- binaryType\n- send\n- extensions\n- bufferedAmount\n\
    - onerror\n- url\n- onclose\n- onopen\n- onmessage\n- readyState\n- protocol\n\
    \n### How to Implement WebSocket Object\n\nThe WebSocket communication is based\
    \ on TCP and thus, it operates on port number 80. You can use any HTML form for\
    \ demonstration. The WebSocket URL is of the `ws://` and `wss://` form. In order\
    \ to implement this form, you need to create an object of the WebSocket API, which\
    \ can then be configured using `onopen`, `onclose`, `onerror` and `onmessage`\
    \ events. The `default.js` file must be modified in the following manner:\n\n\
    ```javascript\n/// <reference path=\"_references.js\" />\n\nvar wsUri = 'ws://echo.websocket.org/';\n\
    var webSocket;\n\n$(document).ready(function () {\n    if (checkSupported()) {\n\
    \        connect();\n        $('#btnSend').click(doSend);\n    }\n});\n\nfunction\
    \ writeOutput(message) {\n    var output = $(\"#divOutput\");\n    output.html(output.html()\
    \ + '<br />' + message);\n}\n\nfunction checkSupported() {\n    if (window.WebSocket)\
    \ {\n        writeOutput('WebSocket is supported!');\n        return true;\n \
    \   }\n    else {\n        writeOutput('WebSockets is not supported');\n     \
    \   $('#btnSend').attr('disabled', 'disabled');\n        return false;\n    }\n\
    }\n\nfunction connect() {\n    webSocket = new WebSocket(wsUri);\n    webSocket.onopen\
    \ = function (evt) { onOpen(evt) };\n    webSocket.onclose = function (evt) {\
    \ onClose(evt) };\n    webSocket.onmessage = function (evt) { onMessage(evt) };\n\
    \    webSocket.onerror = function (evt) { onError(evt) };\n}\n\nfunction doSend()\
    \ {\n    if (webSocket.readyState != webSocket.OPEN) {\n        writeOutput(\"\
    NOT OPEN: \" + $('#txtMessage').val());\n        return;\n    }\n    writeOutput(\"\
    SENT: \" + $('#txtMessage').val());\n    webSocket.send($('#txtMessage').val());\n\
    }\n\nfunction onOpen(evt) {\n    writeOutput(\"CONNECTED\");\n}\n\nfunction onClose(evt)\
    \ {\n    writeOutput(\"DISCONNECTED\");\n}\n\nfunction onMessage(evt) {\n    writeOutput('RESPONSE:\
    \ ' + evt.data);\n}\n\nfunction onError(evt) {\n    writeOutput('ERROR: ' + evt.data);\n\
    }\n```\n\nWhen you create a WebSocket object, a connection to URI is automatically\
    \ initiated. The function, `connect`, subscribes the object to the events mentioned\
    \ above. The message is sent using the `doSend` function. However, the `readyState`\
    \ property of the object is checked before sending any message. The values of\
    \ the property can be as follows:\n\n- Open = 1\n- Connecting = 0\n- Closing =\
    \ 2\n- Closed = 3\n\nUpon reception of message from the server, the client calls\
    \ the `onMessage` function, which passes the event object. The property, `data`,\
    \ of this object, contains the message sent from the server. On the contrary,\
    \ if an error has occurred, then the `onError` function is called and the `data`\
    \ property contains the reason for error generation. In some cases, the `data`\
    \ property may be ‘undefined’. This is particularly the case in scenarios where\
    \ the connection has timed-out.\n\n### How to Deal with Timeouts\n\nA timeout\
    \ is identified when no activity is triggered for as long as 20 minutes. One of\
    \ the most effective ways to deal with timeouts is sending an empty message to\
    \ the server on a periodic basis. This can be done in the following manner.\n\n\
    ```javascript\n/// <reference path=\"_references.js\" />\nvar wsUri = 'ws://echo.websocket.org/';\n\
    var webSocket;\nvar timerId = 0;\n$(document).ready(function () {\n    if (checkSupported())\
    \ {\n        connect();\n        $('#btnSend').click(doSend);\n    }\n});\n\n\
    function writeOutput(message) {\n    var output = $(\"#divOutput\");\n    output.html(output.html()\
    \ + '<br />' + message);\n}\n\nfunction checkSupported() {\n    if (window.WebSocket)\
    \ {\n        writeOutput('WebSockets supported!');\n        return true;\n   \
    \ }\n    else {\n        writeOutput('WebSockets NOT supported');\n        $('#btnSend').attr('disabled',\
    \ 'disabled');\n        return false;\n    }\n}\n\nfunction connect() {\n    webSocket\
    \ = new WebSocket(wsUri);\n    webSocket.onopen = function (evt) { onOpen(evt)\
    \ };\n    webSocket.onclose = function (evt) { onClose(evt) };\n    webSocket.onmessage\
    \ = function (evt) { onMessage(evt) };\n    webSocket.onerror = function (evt)\
    \ { onError(evt) };\n}\n\nfunction keepAlive() {\n    var timeout = 15000;\n \
    \   if (webSocket.readyState == webSocket.OPEN) {\n        webSocket.send('');\n\
    \    }\n    timerId = setTimeout(keepAlive, timeout);\n}\n\nfunction cancelKeepAlive()\
    \ {\n    if (timerId) {\n        cancelTimeout(timerId);\n    }\n}\n\nfunction\
    \ doSend() {\n    if (webSocket.readyState != webSocket.OPEN) {\n        writeOutput(\"\
    NOT OPEN: \" + $('#txtMessage').val());\n        return;\n    }\n    writeOutput(\"\
    SENT: \" + $('#txtMessage').val());\n    webSocket.send($('#txtMessage').val());\n\
    }\n\nfunction onOpen(evt) {\n    writeOutput(\"CONNECTED\");\n    keepAlive();\n\
    }\n\nfunction onClose(evt) {\n    cancelKeepAlive();\n    writeOutput(\"DISCONNECTED\"\
    );\n}\n\nfunction onMessage(evt) {\n    writeOutput('RESPONSE: ' + evt.data);\n\
    }\n\nfunction onError(evt) {\n    writeOutput('ERROR: ' + evt.data);\n}\n```\n\
    \n### How to Handle Disconnects\n\nConnections may sometimes close due to errors\
    \ concerning the network. Therefore, you may be required to call the `connect`\
    \ function while you are inside the construct of the `onClose` function. This\
    \ may lead to issues. A common problem faced in this regard is that the server\
    \ is unable to identify that this new connection request belongs to a client that\
    \ already exists. You can handle this issue by sending an identification message\
    \ to the server.\n\n### How to Deal with Web Farms\n\nYou may need to run your\
    \ application in web farm, in which case the incoming requests may be handled\
    \ by many servers. Multiple servers are used to perform load balancing and performance\
    \ optimization. In this case, you can implement sticky servers, which ensures\
    \ that a client is served by only one server. In other words, all the requests\
    \ by one client are processed by the same server. This helps you to address issues\
    \ that may arise due to open connections. These problems can also be handled using\
    \ products like Microsoft App Fabric Caching Service and Redis."
  mdcn: "\n## 第9章\n\n## WebSocket 通信\n\n某些场景可能需要在客户端与服务器之间建立双向通信。聊天应用程序就是这种通信形式的一个典型示例。本章将详细研究如何建立和使用\
    \ WebSocket 通信。\n\n### 使用 WebSocket 进行通信\n\nWebSocket 通信使用 WebSocket 协议建立，该协议利用\
    \ TCP 连接来创建一个全双工通信通道。该协议已被 IETF 标准化（RFC 6455），并且其 API 的工作草案由 W3C 维护。\n\n这项技术取代了长轮询的概念。在长轮询中，客户端发送请求并持续等待响应，直到收到响应。这种方法的好处是连接保持打开状态，数据一旦可用即可立即发送。然而，连接可能会超时，需要重新建立。\n\
    \n### 理解 WebSocket 协议\n\nWebSocket 协议允许建立双向连接，专为 Web 服务器和客户端的实现而设计。该技术仅与握手过程交互，并被解释为从\
    \ HTTP 到 WebSocket 的过渡。该协议的数据帧没有头部，只有 2 字节的开销。它是一种轻量级技术，其高性能使其能够用于实时内容和游戏的通信。\n\
    \n### 定义 WebSocket API\n\nWebSocket 技术的核心是 WebSocket 对象。该对象定义在 `window` 对象上，并包含以下成员：\n\
    \n- close\n- WebSocket 构造函数\n- binaryType\n- send\n- extensions\n- bufferedAmount\n\
    - onerror\n- url\n- onclose\n- onopen\n- onmessage\n- readyState\n- protocol\n\
    \n### 如何实现 WebSocket 对象\n\nWebSocket 通信基于 TCP，因此它在端口号 80 上运行。你可以使用任何 HTML 表单进行演示。WebSocket\
    \ URL 的形式为 `ws://` 和 `wss://`。为了实现此形式，你需要创建一个 WebSocket API 对象，然后可以使用 `onopen`、`onclose`、`onerror`\
    \ 和 `onmessage` 事件进行配置。必须按以下方式修改 `default.js` 文件：\n\n```javascript\n/// <reference\
    \ path=\"_references.js\" />\n\nvar wsUri = 'ws://echo.websocket.org/';\nvar webSocket;\n\
    \n$(document).ready(function () {\n    if (checkSupported()) {\n        connect();\n\
    \        $('#btnSend').click(doSend);\n    }\n});\n\nfunction writeOutput(message)\
    \ {\n    var output = $(\"#divOutput\");\n    output.html(output.html() + '<br\
    \ />' + message);\n}\n\nfunction checkSupported() {\n    if (window.WebSocket)\
    \ {\n        writeOutput('WebSocket is supported!');\n        return true;\n \
    \   }\n    else {\n        writeOutput('WebSockets is not supported');\n     \
    \   $('#btnSend').attr('disabled', 'disabled');\n        return false;\n    }\n\
    }\n\nfunction connect() {\n    webSocket = new WebSocket(wsUri);\n    webSocket.onopen\
    \ = function (evt) { onOpen(evt) };\n    webSocket.onclose = function (evt) {\
    \ onClose(evt) };\n    webSocket.onmessage = function (evt) { onMessage(evt) };\n\
    \    webSocket.onerror = function (evt) { onError(evt) };\n}\n\nfunction doSend()\
    \ {\n    if (webSocket.readyState != webSocket.OPEN) {\n        writeOutput(\"\
    NOT OPEN: \" + $('#txtMessage').val());\n        return;\n    }\n    writeOutput(\"\
    SENT: \" + $('#txtMessage').val());\n    webSocket.send($('#txtMessage').val());\n\
    }\n\nfunction onOpen(evt) {\n    writeOutput(\"CONNECTED\");\n}\n\nfunction onClose(evt)\
    \ {\n    writeOutput(\"DISCONNECTED\");\n}\n\nfunction onMessage(evt) {\n    writeOutput('RESPONSE:\
    \ ' + evt.data);\n}\n\nfunction onError(evt) {\n    writeOutput('ERROR: ' + evt.data);\n\
    }\n```\n\n当你创建一个 WebSocket 对象时，会自动发起与 URI 的连接。`connect` 函数将该对象订阅到上述事件。消息使用 `doSend`\
    \ 函数发送。然而，在发送任何消息之前，需要检查对象的 `readyState` 属性。该属性的可能取值如下：\n\n- Open = 1\n- Connecting\
    \ = 0\n- Closing = 2\n- Closed = 3\n\n当接收到服务器的消息时，客户端会调用 `onMessage` 函数，该函数接收事件对象。该对象的\
    \ `data` 属性包含从服务器发送的消息。相反，如果发生错误，则会调用 `onError` 函数，并且 `data` 属性包含错误生成的原因。在某些情况下，`data`\
    \ 属性可能为“undefined”。这在连接超时的场景中尤为常见。\n\n### 如何处理超时\n\n如果在长达 20 分钟内没有触发任何活动，则视为超时。处理超时最有效的方法之一是定期向服务器发送空消息。可以按以下方式完成：\n\
    \n```javascript\n/// <reference path=\"_references.js\" />\nvar wsUri = 'ws://echo.websocket.org/';\n\
    var webSocket;\nvar timerId = 0;\n$(document).ready(function () {\n    if (checkSupported())\
    \ {\n        connect();\n        $('#btnSend').click(doSend);\n    }\n});\n\n\
    function writeOutput(message) {\n    var output = $(\"#divOutput\");\n    output.html(output.html()\
    \ + '<br />' + message);\n}\n\nfunction checkSupported() {\n    if (window.WebSocket)\
    \ {\n        writeOutput('WebSockets supported!');\n        return true;\n   \
    \ }\n    else {\n        writeOutput('WebSockets NOT supported');\n        $('#btnSend').attr('disabled',\
    \ 'disabled');\n        return false;\n    }\n}\n\nfunction connect() {\n    webSocket\
    \ = new WebSocket(wsUri);\n    webSocket.onopen = function (evt) { onOpen(evt)\
    \ };\n    webSocket.onclose = function (evt) { onClose(evt) };\n    webSocket.onmessage\
    \ = function (evt) { onMessage(evt) };\n    webSocket.onerror = function (evt)\
    \ { onError(evt) };\n}\n\nfunction keepAlive() {\n    var timeout = 15000;\n \
    \   if (webSocket.readyState == webSocket.OPEN) {\n        webSocket.send('');\n\
    \    }\n    timerId = setTimeout(keepAlive, timeout);\n}\n\nfunction cancelKeepAlive()\
    \ {\n    if (timerId) {\n        cancelTimeout(timerId);\n    }\n}\n\nfunction\
    \ doSend() {\n    if (webSocket.readyState != webSocket.OPEN) {\n        writeOutput(\"\
    NOT OPEN: \" + $('#txtMessage').val());\n        return;\n    }\n    writeOutput(\"\
    SENT: \" + $('#txtMessage').val());\n    webSocket.send($('#txtMessage').val());\n\
    }\n\nfunction onOpen(evt) {\n    writeOutput(\"CONNECTED\");\n    keepAlive();\n\
    }\n\nfunction onClose(evt) {\n    cancelKeepAlive();\n    writeOutput(\"DISCONNECTED\"\
    );\n}\n\nfunction onMessage(evt) {\n    writeOutput('RESPONSE: ' + evt.data);\n\
    }\n\nfunction onError(evt) {\n    writeOutput('ERROR: ' + evt.data);\n}\n```\n\
    \n### 如何处理断开连接\n\n连接有时会因网络错误而关闭。因此，你可能需要在 `onClose` 函数的构造中调用 `connect` 函数。这可能会导致问题。这方面面临的一个常见问题是服务器无法识别这个新的连接请求是属于一个已存在的客户端的。你可以通过向服务器发送一条识别消息来处理此问题。\n\
    \n### 如何处理 Web 场\n\n你可能需要在 Web 场中运行你的应用程序，在这种情况下，传入的请求可能由多个服务器处理。使用多个服务器是为了执行负载均衡和性能优化。在这种情况下，你可以实现粘性服务器，确保一个客户端仅由一个服务器服务。换句话说，一个客户端的所有请求都由同一个服务器处理。这有助于你解决由于打开连接而可能出现的问题。这些问题也可以使用\
    \ Microsoft App Fabric Caching Service 和 Redis 等产品来处理。\n"
