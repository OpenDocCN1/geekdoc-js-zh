    \ the reason why REST concept is known for creation of clean URLs. Examples of\
    \ REST URLs include http://localhost:8080/Customers/2, which deletes a customer\
    \ and http://localhost:8080/Vehicles?VIN=XYZ12, which is used to retrieve the\
    \ information about a vehicle for which a parameter is passed using GET method.\n\
    \nSome firewalls may not allow the use of POST and GET methods. Therefore, it\
    \ is advisable to use 'verb' in the QueryString. An example of how the URL will\
    \ look like is:\n\n```\nhttp://localhost:8080/Vehicles?verb=DELETE&VIN=XYZ987\n\
    ```\n\nThe HTTP protocol also allows you to implement security using the HTTPS\
    \ version. REST provides several benefits like easy connection, faster operation\
    \ and lesser consumption of resources. However, many developers prefer to use\
    \ JSON or (JavaScript Object Notation) because it is compact in size. Besides\
    \ this, REST only supports GET and POST, which restricts its capabilities. Therefore,\
    \ some developers switch to RESTFUL.\n\n## Arbitrary Web Services\n\nThis type\
    \ of web services is also referred to as big web services. An example of such\
