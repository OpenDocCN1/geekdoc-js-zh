- md: "## A Simple Start to jQuery, JavaScript, and HTML5 for Beginners\n\nYou can\
    \ perform exception handling at your own level by validating the values of variables\
    \ before performing any operations. For instance, before performing division,\
    \ it is advisable to check if the value of the denominator is equal to zero. Any\
    \ operation that involves division of a number by zero raises the divide-by-zero\
    \ exception.\n\nHowever, there are other situations that cannot be handled in\
    \ this manner. For instance, if the network connection breaks abruptly, you cannot\
    \ do anything to pre-emptively handle the situation. Therefore, for situations\
    \ like these, try, catch and finally keywords are used.\n\nThe code that is expected\
    \ to throw an exception is put inside the try block. This exception, upon its\
    \ occurrence, is caught by the catch block, which executes code that is supposed\
    \ to be executed immediately after an exception is caught. The catch may also\
    \ be followed by the finally block, which performs the final cleanup. This block\
    \ is executed after the execution of try and catch blocks.\n\nSyntax:\n\n```\n\
    try\n{\n    //code\n}\n\ncatch(exception name)\n{\n    //code\n}\n\nfinally\n\
    {\n    //code\n}\n```\n\n## Working with Objects\n\nJavaScript allows user access\
    \ to a number of existing objects. One of these objects is an array. This section\
    \ discusses all the basics related to this chapter. Dealing with objects in JavaScript\
    \ also includes creation and handling of customized objects. However, this topic\
    \ shall be covered in the chapter on JavaScript and jQuery.\n\n## Arrays\n\nA\
    \ collection of similar objects that are sequenced contiguously are referred to\
    \ as an array. This array is given a name and each element can be accessed using\
    \ the indexer, in the following form:\n\nLet arrName[] be an array of names. The\
    \ element arrName[2] refers to the third element of the array.\n\nAn array can\
    \ be created using the following three methods:\n\n- Insertion of Items Using\
    \ Indexer\n- An array can be created using the new keyword and then, elements\
    \ can be added into the array by assigning values to independent elements of the\
    \ array. The new keyword creates an instance of the object Array using the constructor\
    \ for the same.\n  - Sample implementation:\n    - var arrName = new Array();\n\
    \    - arrName[0] = 'Jack';\n    - arrName[1] = 'Alex';\n- Condensed Array\n \
    \ - The second type of implementation also uses the new keyword. However, in this\
    \ case, the values are assigned to the elements as arguments to the constructor\
    \ of the Array object.\n  - Sample implementation:\n    - var arrName = new Array('Jack',\
    \ 'Alex');\n- Literal Array\n  - In this type of array definition, values are\
    \ provided within the square brackets.\n  - Sample implementation:\n    - var\
    \ arrName = ['Jack', 'Alex'];\n\nThe advantage of using the first type of definition\
    \ is that it allows you to assign values to the elements anywhere in the code.\
    \ On the other hand, the second and third type of implementation requires you\
    \ to have the exact list of elements with you beforehand.\n\nThere are some properties\
    \ associated with all objects. The one property that can come in handy to you\
    \ is *length*, which is a read-only value and when called returns the number of\
    \ elements present in the array. You can use this property in loops and conditions.\n\
    \nObjects can also have their own functions. These functions are called methods.\
    \ The **methods available for Array include**:\n\n- concat\n- Returns an array,\
    \ which is the concatenation of the two arrays supplied to it.\n- indexOf\n- Finds\
    \ the location of the element concerned in the array and returns the index of\
    \ the same.\n- join\n- This method concatenates all the values present in the\
    \ array. However, all these values are separated by a comma by default. You can\
    \ specify a delimiter of your choice as well.\n- lastIndexOf\n- This method works\
    \ similarly as indexOf. However, it performs the search from the last element\
    \ of the array. Therefore, it returns the index of the last element that matches\
    \ the specified criterion.\n- pop\n- Removes the last element and returns its\
    \ value.\n- push\n- Adds the concerned element to the end of the array and returns\
    \ the changed value of length.\n- reverse\n- This method reverses the order of\
    \ the array elements. The original array is modified by this method.\n- shift\n\
    - Removes and returns the first value. If the array is empty, then undefined is\
    \ returned.\n- slice\n- This method requires two arguments, start index and end\
    \ index. A new array is created with elements same as the elements present at\
    \ indexes (start index) and (end index – 1).\n- sort\n- This method sorts the\
    \ elements and modifies the original array.\n- splice\n- This method removes and\
    \ adds elements to the specified array. The arguments taken by this method are\
    \ start index (index from where the system should start removing elements), number\
    \ of elements to be removed and elements to be added. If the value passed for\
    \ number of elements is 0, then no elements are deleted. On the other hand, if\
    \ this value is greater than the size of the array, all elements from the start\
    \ index to the end of the array are deleted.\n- toString\n- This method creates\
    \ a string, which is a comma separated concatenated string of all the elements\
    \ present in the array.\n- unshift\n- This method adds an element at the first\
    \ location of the array and returns the modified value of length.\n- valueOf\n\
    - This method returns a string, which is the concatenated, comma-separated string\
    \ containing all the values present in the array.\n\n**Note:**\n\n1. When working\
    \ with functions, you can pass the whole array (using the array name) or a particular\
    \ element of the array (using array name[indexer]).\n2. Array elements can be\
    \ modified by accessing the element using the indexer. For example, arrName[1]\
    \ = 'Danny'; assigns the value 'Danny' to the second element of the array.\n\n\
    ## DOM objects\n\nThe primary objects that you need to access while building an\
    \ application are the DOM objects associated with it. This access is necessary\
    \ for you to control and get notified about events that are occurring on the webpage.\n\
    \nThe DOM is a representation of a hierarchy of objects. These objects can be\
    \ accessed using the document variable, which is built-in. This variable references\
    \ the DOM and performs a search, which may return an active or static NodeList.\
    \ While the active NodeList contains a list of elements that keep changing, the\
    \ static NodeList contains elements that do not change over time. Since the retrieval\
    \ of the static NodeList takes longer, it is advisable to choose search methods\
    \ that work with active NodeList.\n\nThe search methods available for DOM include:\n\
    \n- getElementById\n- This method returns a reference to the first element that\
    \ has the specified ID.\n- getElementsByTagName\n- This method returns the active\
    \ NodeList, which has the specified tag name.\n- getElementsByName\n- This method\
    \ returns the active NodeList, which has the specified name. This is a preferred\
    \ method for option buttons.\n- getElementsByClass\n- This method returns the\
    \ active NodeList, which has the specified class name. However, this method is\
    \ not supported by Internet Explorer version 8 and earlier.\n- querySelector\n\
    - This method accepts CSS selector as parameter and returns the first matched\
    \ element. However, this method is not supported by Internet Explorer version\
    \ 7 and earlier.\n- querySelectorAll\n- This method accepts CSS selector as parameter\
    \ and returns all the matched elements. Therefore, it returns a static NodeList.\
    \ However, this method is not supported by Internet Explorer version 7 and earlier.\n\
    \n## Events\n\nIf you look at JavaScript as an engine, then events are what give\
    \ it the required spark. **Events can occur in two situations. The first type\
    \ of events are those that occur during user interactions.** A user may click\
    \ an image or enter text. All these are classified as events. Besides this, **changes\
    \ in state of the system are also considered an event.** For instance, if a video\
    \ starts or stops, an event is said to have occurred. The DOM allows you to capture\
    \ events and execute code for the same.\n\n**In JavaScript, events are based on\
    \ the publish-subscribe methodology.** Upon creation of an object, the developer\
    \ can publish the events that are related to this object. Moreover, event handlers\
    \ can be added to this object whenever it is used. The event handler function\
    \ notifies the subscribed events that the event has been triggered. This notification\
    \ includes information about"
  mdcn: "\n## 初学者的 jQuery、JavaScript 和 HTML5 入门简明指南\n\n你可以在执行任何操作之前，通过验证变量的值来进行自己水平的异常处理。例如，在进行除法运算前，最好检查分母的值是否等于零。任何涉及将数字除以零的操作都会引发除零异常。\n\
    \n然而，有些情况无法用这种方式处理。例如，如果网络连接突然中断，你就无法提前采取任何措施来处理。因此，对于这类情况，可以使用 try、catch 和 finally\
    \ 关键字。\n\n期望抛出异常的代码被放入 try 块中。该异常发生时，会被 catch 块捕获，catch 块会执行在捕获异常后应立即执行的代码。catch\
    \ 块之后还可以跟一个 finally 块，用于执行最后的清理工作。此块在 try 和 catch 块执行完毕后运行。\n\n语法：\n\n```\ntry\n\
    {\n    //代码\n}\n\ncatch(异常名称)\n{\n    //代码\n}\n\nfinally\n{\n    //代码\n}\n```\n\
    \n## 处理对象\n\nJavaScript 允许用户访问许多现有对象。其中之一是数组。本节讨论与本章相关的所有基础知识。在 JavaScript 中处理对象也包括创建和处理自定义对象。不过，这个主题将在\
    \ JavaScript 和 jQuery 的章节中介绍。\n\n## 数组\n\n一系列连续排列的相似对象的集合被称为数组。该数组有一个名称，并且每个元素都可以使用索引器以以下形式访问：\n\
    \n设 arrName[] 是一个名称数组。元素 arrName[2] 指的是数组的第三个元素。\n\n可以使用以下三种方法创建数组：\n\n- 使用索引器插入元素\n\
    \    - 可以使用 new 关键字创建数组，然后通过为数组的独立元素赋值来向数组中添加元素。new 关键字使用其构造函数创建 Array 对象的一个实例。\n\
    \        - 示例实现：\n            - var arrName = new Array();\n            - arrName[0]\
    \ = 'Jack';\n            - arrName[1] = 'Alex';\n- 紧凑数组\n    - 第二种实现方式也使用 new\
    \ 关键字。但是，在这种情况下，值作为 Array 对象构造函数的参数赋给元素。\n        - 示例实现：\n            - var arrName\
    \ = new Array('Jack', 'Alex');\n- 字面量数组\n    - 在这种数组定义方式中，值在方括号内提供。\n        -\
    \ 示例实现：\n            - var arrName = ['Jack', 'Alex'];\n\n使用第一种定义方式的优点是，它允许你在代码中的任何位置为元素赋值。而第二种和第三种实现方式则要求你事先准备好确切的元素列表。\n\
    \n所有对象都有一些属性。对你可能有用的属性之一是 *length*，它是一个只读值，调用时返回数组中存在的元素数量。你可以在循环和条件中使用此属性。\n\n\
    对象也可以有自己的函数。这些函数称为方法。**数组可用的方法包括**：\n\n- concat\n- 返回一个数组，该数组是提供给它的两个数组的连接结果。\n\
    - indexOf\n- 查找相关元素在数组中的位置并返回其索引。\n- join\n- 此方法连接数组中存在的所有值。但是，默认情况下，所有这些值都用逗号分隔。你也可以指定自己选择的分隔符。\n\
    - lastIndexOf\n- 此方法的工作方式与 indexOf 类似。但是，它从数组的最后一个元素开始搜索。因此，它返回与指定条件匹配的最后一个元素的索引。\n\
    - pop\n- 移除最后一个元素并返回其值。\n- push\n- 将相关元素添加到数组末尾，并返回修改后的 length 值。\n- reverse\n\
    - 此方法反转数组元素的顺序。此方法会修改原始数组。\n- shift\n- 移除并返回第一个值。如果数组为空，则返回 undefined。\n- slice\n\
    - 此方法需要两个参数：起始索引和结束索引。创建一个新数组，其元素与（起始索引）和（结束索引 - 1）位置存在的元素相同。\n- sort\n- 此方法对元素进行排序并修改原始数组。\n\
    - splice\n- 此方法从指定数组中移除和添加元素。此方法接受的参数是起始索引（系统应从哪个索引开始移除元素）、要移除的元素数量以及要添加的元素。如果传递的要移除的元素数量为\
    \ 0，则不会删除任何元素。另一方面，如果此值大于数组的大小，则从起始索引到数组末尾的所有元素都将被删除。\n- toString\n- 此方法创建一个字符串，该字符串是由数组中存在的所有元素连接而成的逗号分隔字符串。\n\
    - unshift\n- 此方法在数组的第一个位置添加一个元素，并返回修改后的 length 值。\n- valueOf\n- 此方法返回一个字符串，该字符串是包含数组中所有值的连接、逗号分隔的字符串。\n\
    \n**注意：**\n\n1. 使用函数时，可以传递整个数组（使用数组名称）或数组的特定元素（使用 数组名称[索引器]）。\n2. 可以通过使用索引器访问元素来修改数组元素。例如，arrName[1]\
    \ = 'Danny'; 将值 'Danny' 赋给数组的第二个元素。\n\n## DOM 对象\n\n构建应用程序时需要访问的主要对象是与其关联的 DOM\
    \ 对象。为了控制网页上发生的事件并接收相关通知，这种访问是必要的。\n\nDOM 是对象层次结构的表示。这些对象可以使用内置的 document 变量访问。此变量引用\
    \ DOM 并执行搜索，该搜索可能返回一个活动 NodeList 或静态 NodeList。活动 NodeList 包含不断变化的元素列表，而静态 NodeList\
    \ 包含随时间不变化的元素。由于检索静态 NodeList 耗时较长，建议选择适用于活动 NodeList 的搜索方法。\n\nDOM 可用的搜索方法包括：\n\
    \n- getElementById\n- 此方法返回对具有指定 ID 的第一个元素的引用。\n- getElementsByTagName\n- 此方法返回具有指定标签名称的活动\
    \ NodeList。\n- getElementsByName\n- 此方法返回具有指定名称的活动 NodeList。这是单选按钮的首选方法。\n- getElementsByClass\n\
    - 此方法返回具有指定类名的活动 NodeList。但是，Internet Explorer 8 及更早版本不支持此方法。\n- querySelector\n\
    - 此方法接受 CSS 选择器作为参数，并返回第一个匹配的元素。但是，Internet Explorer 7 及更早版本不支持此方法。\n- querySelectorAll\n\
    - 此方法接受 CSS 选择器作为参数，并返回所有匹配的元素。因此，它返回一个静态 NodeList。但是，Internet Explorer 7 及更早版本不支持此方法。\n\
    \n## 事件\n\n如果将 JavaScript 视为一个引擎，那么事件就是赋予其所需动力的火花。**事件可能在两种情况下发生。第一类事件是发生在用户交互期间的事件。**\
    \ 用户可能点击图像或输入文本。所有这些都被归类为事件。此外，**系统状态的变化也被视为事件。** 例如，如果视频开始或停止播放，就认为发生了事件。DOM\
    \ 允许你捕获事件并执行相应的代码。\n\n**在 JavaScript 中，事件基于发布-订阅模型。** 创建对象后，开发人员可以发布与该对象相关的事件。此外，每当使用该对象时，都可以为其添加事件处理程序。事件处理程序函数会通知已订阅的事件已被触发。此通知包括关于...\n"
