- md: "## A Simple Start to Jquery, Javascript, and Html5 for Beginners\n\n- `<input\
    \ type='number'>` - It is a numeric field.\n- `<input type='range'>` - It is a\
    \ control, which accepts a numeric value and defines the allowed range of values.\n\
    - `<input type='radio'>` - It is an option button, which has a value attribute\
    \ for setting and reading the status of the button. The jQuery used for identifying\
    \ the marked radio buttons is `$('input[type=radio]:checked')`\n- `<input type='search'>`\
    \ - It is a text field, which is used for entering the search string.\n- `<input\
    \ type='reset'>` - It is a button that can be used for resetting the fields of\
    \ a form.\n- `<input type='url'>` - It is a URL field.\n- `<input type='tel'>`\
    \ - It is a telephone number field.\n- `<input type='submit'>` - It is a submit\
    \ button.\n- `<input type='time'>` - It is a control, which accepts a time value.\n\
    - `<input type='text'>` - It is a single-line text field.\n- `<input type='week'>`\
    \ - It is a week-year control.\n\n## The `<label>` Element\n\nIt is the element\
    \ that is used to convey the meaning of an element to the user. The text in this\
    \ element is displayed inside the text box, which is auto-removed when the user\
    \ clicks on it. You can also specify the style of a label.\n\n## Specifying Parent\
    \ Forms\n\nThere may be situations where the submission elements of a form may\
    \ not lie inside the same construct. Therefore, gathering data, in this case,\
    \ can be quite a challenge. In order to address this issue, HTML5 provides an\
    \ attribute, id, which can be set for multiple form elements. This shall allow\
    \ data collection from different form elements in one go.\n\n## How to Trigger\
    \ Form Submission\n\nUpon triggering, all the data collected from the submission\
    \ elements of the form or forms of the same id is sent to the server using an\
    \ HTTP method.\n\nThe `<input>` element can be used for triggering form submission.\
    \ Besides this, you can also use JavaScript for this purpose. In order to implement\
    \ this, you must give an id to the concerned form, myFirstForm. The default.js\
    \ file, which is linked to the HTML document, must contain the following code:\n\
    \n```\n$(document).ready(function () {\n    $('#myFirstButton').on('click', submitMyFirstForm);\n\
    });\n\nfunction submitMyFirstForm() {\n    $('#myFirstForm').submit();\n}\n```\n\
    \nIf the method attribute of the form is not given any value, then it is set to\
    \ a default GET. Moreover, the action attribute will also have a default value.\
    \ Therefore, the button click will reference the page to same page. However, the\
    \ URL will now include a QueryString, which is a combination of values selection\
    \ or entered by the user. For instance, if the form requests the user to enter\
    \ Customer ID and the user enters 1245, then the QueryString will be:\n\n```\n\
    customerID=1245\n```\n\nThis QueryString will be appended to the URL in the following\
    \ manner:\n\n```\nMywebpage.asp?customerID=1245\n```\n\nIt is also important to\
    \ mention here that the QueryString is URI encoded. Therefore, special characters\
    \ are represented by specific values. For instance, a space is represented as\
    \ ‘+’ and exclamation mark (!) as ‘%21’. Name-value pair is represented as ‘name=value’\
    \ and name-value pairs are separated by ‘&’.\n\n## How to Serialize the Form\n\
    \nYou can serialize the form using the jQuery serialize method. This can be done\
    \ in the following manner:\n\n```\nvar myFormData = $('#myFirstForm').serialize();\n\
    ```\n\nYou can decode the URI-encoded string using the following:\n\n```\nvar\
    \ data = decodeURIComponent(myFormData);\n```\n\n## Using Autofocus Attribute\n\
    \nBy default, the focus is not set to any element of the form. However, you can\
    \ set focus using the focus method, which can be implemented in the following\
    \ manner:\n\n```\n$('input[name=\"firstName\"]').focus();\n```\n\nHowever, you\
    \ can also set autofocus in the following manner:\n\n```\n<input type=\"text\"\
    \ name=\"firstName\" autofocus=\"autofocus\"/>\n```\n\n## How to Use Data Submission\
    \ Constraints\n\nA form can send data only if it satisfies the following constraints:\n\
    \n- Name attribute must be set.\n- You must have set the value of form submission\
    \ element.\n- The `<form>` element must have its form submission element defined\
    \ and form submission elements should not be disabled.\n- If multiple submit buttons\
    \ have been implemented, the values will be submitted only on the click of the\
    \ activated submit button.\n- Select the check boxes.\n- Select the Option buttons.\n\
    - The `<option>` elements must have set `<option>` elements.\n- If there is a\
    \ file selection field, one of the fields must be selected.\n- The declare attribute\
    \ of the object elements must be set.\n\nAlways remember that the reset buttons\
    \ don't send any data and the form need not have an ID for its data to be sent.\n\
    \n## How to Use POST or GET\n\nThere are two HTTP methods available for submitting\
    \ data to the server. These methods are GET and POST. In the former case, the\
    \ URL is appended with the QueryString. However, in case of the latter, the information\
    \ is sent within the message body.\n\n## Form Validation\n\nIt is beneficial to\
    \ understand that the root of all security issues in web application is user data.\
    \ The moment you decide to open your application to user data and interactions,\
    \ you are making your application vulnerable to security threats. Therefore, you\
    \ need to validate any data that you receive before processing it to prevent any\
    \ issues from cropping up. Validation can be provided at the browser or server\
    \ end. However, server side validation is recommended as browser-level validation\
    \ can be easily manipulated.\n\nThe simplest form of validation that you can implement\
    \ is using the required attribute in the `<select>` element. You can set this\
    \ attribute in the following manner:\n\n```\n<select name=\"dateOfBirth\" required=\"\
    required\">\n```\n\nThe validation error generated is browser dependent and each\
    \ browser has a different method of communication to the user that a field is\
    \ required for submission.\n\nBesides this, the placeholder attribute is also\
    \ available, which keep the prompt fixed on the unfilled field until a value for\
    \ the same is provided by the user. It can be implemented in the following manner:\n\
    \n```\n<input type=\"text\" name=\"Date of birth\" required=\"required\" placeholder=\"\
    enter the date of birth\"/>\n```\n\nThe addition of time, date and type based\
    \ inputs in HTML5 makes validation much simpler as they can directly be matched\
    \ to see if they have valid input values or not. Besides this, email, numbers\
    \ and ranges can also be easily validated.\n\nHTML5 performs validation and matches\
    \ it with the :valid or :invalid pseudoclasses. If the validation is successful,\
    \ the value is matched to :valid, else it is matched to :invalid. However, if\
    \ a value is not 'required', it is matched to :optional pseudoclass.\n\n## Chapter\
    \ 8\n\n## Web Services\n\nAll the chapters discussed till now dealt with browser\
    \ level coding and scripting. However, now it is time to move on to server side\
    \ scripting. This chapter focuses on the use of JavaScript at the server level,\
    \ which is possible with the help of Node.js, and how you can work around with\
    \ web services.\n\n## Basics of Node.js\n\nNode.js is a platform, which is made\
    \ on Google Chrome, and can be used for creating scalable and flexible applications.\
    \ It allows you to write JavaScript code for the server. However, before you can\
    \ begin, you must download and install Node.js on your system.\n\n## Writing a\
    \ Basic Code\n\nThe first step is to open any text editor and create a file named\
    \ myfile.js. In the file, write the code:\n\n```\nvar http = require('http');\n\
    ```\n\n*A Simple Start to Jquery, Javascript, and Html5 for Beginners*\n\n```\n\
    http.createServer(function (request, response) {\n  response.writeHead(200, {'Content-Type':\
    \ 'text/plain'});\n  response.end('Hello World!\\n');\n  console.log('Handled\
    \ request');\n}).listen(8080, 'localhost');\n\nconsole.log('Server running at\
    \ http://localhost:8080/');\n```\n\nThe first line loads the http module while\
    \ the second line creates a server object. The function createServer takes in\
    \ two parameters, request and response. All the website handling is done from\
    \ these functions. In this example, the response function ends by writing ‘Hello\
    \ World’ on the screen.\n\nThe function createServer, returns a server object,\
    \ which call the function, listen. This function listens at the port 8080 and\
    \ the IP address of the host is set to 127.0.0.1. therefore, if there is a network\
    \ adapter installed on your system, your web server will start listening to web\
    \ requests rights away. The last line"
  mdcn: "\n## 初学者的Jquery、Javascript和Html5入门指南\n\n- `<input type='number'>` - 它是一个数字输入字段。\n\
    - `<input type='range'>` - 它是一个控件，接受一个数值并定义了允许的值范围。\n- `<input type='radio'>`\
    \ - 它是一个单选按钮，具有用于设置和读取按钮状态的 `value` 属性。用于识别被选中单选按钮的 jQuery 代码是 `$('input[type=radio]:checked')`。\n\
    - `<input type='search'>` - 它是一个文本字段，用于输入搜索字符串。\n- `<input type='reset'>` - 它是一个可用于重置表单字段的按钮。\n\
    - `<input type='url'>` - 它是一个 URL 输入字段。\n- `<input type='tel'>` - 它是一个电话号码输入字段。\n\
    - `<input type='submit'>` - 它是一个提交按钮。\n- `<input type='time'>` - 它是一个控件，接受一个时间值。\n\
    - `<input type='text'>` - 它是一个单行文本输入字段。\n- `<input type='week'>` - 它是一个周-年份控件。\n\
    \n## `<label>` 元素\n\n`<label>` 元素用于向用户传达另一个元素的含义。该元素内的文本会显示在文本框内，当用户点击文本框时会自动移除。你也可以指定\
    \ `<label>` 的样式。\n\n## 指定父表单\n\n可能存在表单的提交元素不在同一个构造中的情况。因此，在这种情况下，收集数据可能是一个相当大的挑战。为了解决这个问题，HTML5\
    \ 提供了一个 `id` 属性，可以为多个表单元素设置该属性。这将允许一次性从不同的表单元素收集数据。\n\n## 如何触发表单提交\n\n触发后，从相同\
    \ `id` 的一个或多个表单的提交元素收集到的所有数据，将通过 HTTP 方法发送到服务器。\n\n`<input>` 元素可用于触发表单提交。除此之外，你也可以使用\
    \ JavaScript 来实现此目的。为此，你必须为相关的表单 `myFirstForm` 设置一个 `id`。链接到 HTML 文档的 `default.js`\
    \ 文件必须包含以下代码：\n\n```\n$(document).ready(function () {\n    $('#myFirstButton').on('click',\
    \ submitMyFirstForm);\n});\n\nfunction submitMyFirstForm() {\n    $('#myFirstForm').submit();\n\
    }\n```\n\n如果表单的 `method` 属性没有指定任何值，那么它将被设置为默认的 `GET`。此外，`action` 属性也会有一个默认值。因此，按钮点击将把页面引用到同一页面。但是，URL\
    \ 现在将包含一个查询字符串（QueryString），这是用户选择或输入值的组合。例如，如果表单要求用户输入客户ID，用户输入了 `1245`，那么查询字符串将是：\n\
    \n```\ncustomerID=1245\n```\n\n此查询字符串将按以下方式附加到 URL：\n\n```\nMywebpage.asp?customerID=1245\n\
    ``\n\n这里还需要提一下，查询字符串是经过 URI 编码的。因此，特殊字符由特定的值表示。例如，空格表示为 `+`，感叹号（!）表示为 `%21`。名称-值对表示为\
    \ `name=value`，多个名称-值对之间用 `&` 分隔。\n\n## 如何序列化表单\n\n你可以使用 jQuery 的 `serialize`\
    \ 方法序列化表单。可以按如下方式完成：\n\n```\nvar myFormData = $('#myFirstForm').serialize();\n\
    ```\n\n你可以使用以下代码解码 URI 编码的字符串：\n\n```\nvar data = decodeURIComponent(myFormData);\n\
    ```\n\n## 使用自动聚焦（Autofocus）属性\n\n默认情况下，焦点不会设置在表单的任何元素上。但是，你可以使用 `focus` 方法设置焦点，可以按如下方式实现：\n\
    \n```\n$('input[name=\"firstName\"]').focus();\n```\n\n然而，你也可以按以下方式设置自动聚焦：\n\n\
    ```\n<input type=\"text\" name=\"firstName\" autofocus=\"autofocus\"/>\n```\n\n\
    ## 如何使用数据提交约束\n\n表单只有在满足以下约束条件时才能发送数据：\n\n- 必须设置 `name` 属性。\n- 你必须为表单提交元素设置了值。\n\
    - `<form>` 元素必须定义了其表单提交元素，且表单提交元素不能被禁用。\n- 如果实现了多个提交按钮，只有在点击激活的提交按钮时才会提交值。\n-\
    \ 选中复选框。\n- 选中单选按钮。\n- `<option>` 元素必须设置 `<option>` 元素。\n- 如果存在文件选择字段，必须选择一个字段。\n\
    - 对象元素的 `declare` 属性必须设置。\n\n永远记住，重置按钮不发送任何数据，并且表单的数据发送也不需要拥有 ID。\n\n## 如何使用 POST\
    \ 或 GET\n\n有两种 HTTP 方法可用于向服务器提交数据。这些方法是 GET 和 POST。在前者的情况下，URL 会附加查询字符串。然而，在后者的情况下，信息在消息体中发送。\n\
    \n## 表单验证\n\n理解这一点是有益的：Web 应用程序中所有安全问题的根源是用户数据。一旦你决定将你的应用程序开放给用户数据和交互，你就会使你的应用程序容易受到安全威胁。因此，在处理任何接收到的数据之前，你需要对其进行验证，以防止出现任何问题。验证可以在浏览器端或服务器端提供。但是，建议进行服务器端验证，因为浏览器级别的验证很容易被操纵。\n\
    \n你能实现的最简单的验证形式是在 `<select>` 元素中使用 `required` 属性。你可以按以下方式设置此属性：\n\n```\n<select\
    \ name=\"dateOfBirth\" required=\"required\">\n```\n\n生成的验证错误是浏览器相关的，每个浏览器都有不同的方式向用户传达某个字段是提交所必需的。\n\
    \n除此之外，还有 `placeholder` 属性可用，它会将提示固定在未填写的字段上，直到用户为其提供了值。可以按如下方式实现：\n\n```\n<input\
    \ type=\"text\" name=\"Date of birth\" required=\"required\" placeholder=\"enter\
    \ the date of birth\"/>\n```\n\nHTML5 中添加的基于时间、日期和类型的输入使验证变得更加简单，因为它们可以直接进行匹配，以查看是否具有有效的输入值。除此之外，电子邮件、数字和范围也可以轻松验证。\n\
    \nHTML5 执行验证并将其与 `:valid` 或 `:invalid` 伪类进行匹配。如果验证成功，则值与 `:valid` 匹配，否则与 `:invalid`\
    \ 匹配。但是，如果某个值不是“必需的”，则它与 `:optional` 伪类匹配。\n\n## 第8章\n\n## Web 服务\n\n到目前为止讨论的所有章节都涉及浏览器级别的编码和脚本。但是，现在是时候转向服务器端脚本了。本章重点介绍在服务器级别使用\
    \ JavaScript（这可以通过 Node.js 实现），以及如何使用 Web 服务。\n\n## Node.js 基础\n\nNode.js 是一个基于\
    \ Google Chrome 构建的平台，可用于创建可扩展和灵活的应用程序。它允许你用 JavaScript 编写服务器端代码。但是，在开始之前，你必须在系统上下载并安装\
    \ Node.js。\n\n## 编写基本代码\n\n第一步是打开任何文本编辑器并创建一个名为 `myfile.js` 的文件。在文件中，编写代码：\n\n\
    ```\nvar http = require('http');\n```\n\n*初学者的Jquery、Javascript和Html5入门指南*\n\n\
    ```\nhttp.createServer(function (request, response) {\n  response.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  response.end('Hello World!\\n');\n  console.log('Handled\
    \ request');\n}).listen(8080, 'localhost');\n\nconsole.log('Server running at\
    \ http://localhost:8080/');\n```\n\n第一行加载了 `http` 模块，而第二行创建了一个服务器对象。`createServer`\
    \ 函数接受两个参数：`request` 和 `response`。所有的网站处理都通过这些函数完成。在这个例子中，`response` 函数通过在屏幕上写入\
    \ \"Hello World\" 来结束。\n\n`createServer` 函数返回一个服务器对象，该对象调用 `listen` 函数。此函数在端口\
    \ `8080` 上监听，主机的 IP 地址设置为 `127.0.0.1`。因此，如果你的系统上安装了网络适配器，你的 Web 服务器将立即开始监听 Web\
    \ 请求。最后一行\n"
