  \n### 结论\n\n在本章中，我们利用前九章学到的知识创建了一个实时 Web 应用程序。该应用程序由慷慨的公共 API 平台 MealDB 提供支持。在本章中，我们尽力模仿真实的软件开发过程。虽然我们使用了前九章学到的大部分\
  \ JavaScript 概念，但也学习了一个新概念 `window.location`。我们在应用程序中广泛使用了这个概念。\n\n在下一章中，我们将学习如何在客户端浏览器上存储数据。在客户端浏览器上存储数据有助于节省大量网络带宽并提高网站性能。\n\
  \n### 要点回顾\n\n*   创建优秀网站的第一个技巧是从用户的角度思考。从设计到功能，一切都应以用户为中心来创建。\n\n*   其次，你需要确保设计简洁。用户很少会对杂乱的设计和过多的动画感到满意。\n\
  \n*   编写模块化代码。你应该编写可以拆分为更小函数的代码。此外，编写可重用的代码也会有所帮助。\n\n### 选择题\n\n1.  **查询参数字符串存储在\
  \ `window.location` 对象的哪个属性中？**\n\n    1.  `search`\n    2.  `hostname`\n    3.\
  \  `origin`\n    4.  `pathname`\n\n2.  **系统测试是在类似客户端的环境中对整个应用程序进行端到端测试——正确还是错误？**\n\
  \n    1.  正确\n    2.  错误\n\n### 答案\n\n\n\n\n\n1.  **a**\n\n2.  **a**\n\n# 第 11 章\n\
  \n## 在浏览器中存储数据\n\n在上一章中，我们了解到如今互联网上的绝大多数网站都是动态的。这些网站将数据存储在服务器中，在需要时请求服务器发送数据，并利用响应数据向用户展示\
  \ HTML。然而，为了提高网页性能并节省网络带宽，现代浏览器支持多种在用户本地机器上存储数据的方式。这不仅节省了网络带宽，还能提高网站的加载速度，并支持离线使用网站。在本章中，我们将探讨浏览器允许的几种数据存储方法。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   网络存储简介\n*   Cookie\n*   网络存储 API\n*   IndexedDB\
  \ API\n*   Service Worker\n*   缓存 API\n*   在控制台中测试\n\n### 目标\n\n学习本章后，你将能够通过在浏览器中存储数据来提升\
  \ Web 应用/网站的性能和速度。你将能够实现各种网络存储方法，并理解何时缓存数据或实现网络存储。\n\n## 网络存储简介\n\n如前所述，在上一章中，我们实现了一个从服务器获取数据以填充网页\
  \ HTML 的示例。然而，在某些情况下，将数据存储在用户浏览器中更为合理。例如，如果你正在开发一个电子商务网站，记住用户上一会话购物车中的内容是有意义的。另一个例子是用户希望浏览器记住他已登录，这样下次打开网页时就不必再次登录。在这种情况下，明智的做法是在浏览器中存储一些数据。这个过程称为*客户端存储*。\n\
  \n客户端存储涉及允许数据存储在本地机器上的 JavaScript API。这些信息可以在需要时检索。客户端存储的若干好处如下：\n\n*   个性化网站偏好（例如，网站的暗色/亮色主题、配色方案、字体大小等）\n\
  *   存储用户活动（例如，存储用户上一会话购物车中的商品、记住用户登录状态等）\n*   保存字体、图片等资源以及数据到本地浏览器，以节省重新下载资源的时间和带宽。这有助于加快网站加载速度，因为它省去了到达服务器、等待服务器响应以及下载资源的时间。\n\
  *   在本地保存某些文档，以便离线查看网站。\n\n根据引入的时间，我们可以将网络存储实践分为三个不同的类别（截至撰写本文时）：\n\n*   **旧式**：最早的客户端存储方法，至今仍被许多网站使用，即\
  \ HTTP Cookie。在很大程度上，大多数网站使用 Cookie 进行用户个性化或在网页上向用户展示个性化广告。\n*   **新式**：截至撰写本文时，最常用且最简单的浏览器数据存储方法是网络存储\
  \ API 和 IndexedDB API。前者适用于存储简单数据，如用户名或用户是否选择了暗色或亮色主题。后者适用于存储复杂数据库。\n*   **未来**：缓存的概念长期以来一直是\
  \ Web 开发行业的一部分。然而，截至撰写本文时，只有少数现代浏览器支持新的缓存 API。缓存 API 与 Service Worker API 协同工作。它们适用于离线数据存储。\n\
  \n在本章中，我们将简要介绍所有五种网络存储类型。但我们将重点关注网络存储 API。目前，网络存储 API 在本质上更为成熟。\n\n## Cookie\n\n\
  HTTP Cookie 是服务器发送到用户浏览器的一小段数据。这些 Cookie 通常以文本文件的形式存储在用户浏览器中。浏览器会将此 Cookie 附加到后续对同一服务器的请求中。\n\
  \n从更一般的角度来看，服务器将每个请求视为新请求，即服务器和 HTTP 协议不维护请求的状态。通过发送存储在用户浏览器中的 Cookie，服务器可以“*记住*”关于用户的信息。\n\
  \n### 用途\n\nCookie 主要用于以下三个目的：\n\n![](img/Figure-11.1.jpg)\n\n**图 11.1：** Cookie\
  \ 的用途\n\n如上图所示，自 JavaScript 引入 Cookie 以来，它们一直服务于三个重要目的。第一个是会话管理。它包括帮助服务器记住关于用户的重要信息，包括但不限于登录状态、购物车、游戏分数等。第二个用途是记住用户偏好和主题。Cookie\
  \ 主要用于第三个场景——记录和分析用户行为。它帮助服务器理解用户的行为模式。\n\n### 缺点\n\nCookie 的一个主要缺点是它们会随每个服务器请求一起发送，这可能会降低网页的速度和性能。根据微软的官方文档，大多数浏览器支持的最大\
  \ Cookie 大小为 4096 字节，这是一个相对较小的尺寸。\n\n### 结构\n\nCookie 以名称-值对的形式保存，如下所示：\n\n`username\
  \ = john.doe`\n\n**代码 11.1：** Cookie 的结构\n\n### 使用 JavaScript 创建 Cookie\n\n要创建、读取或删除\
  \ Cookie，我们使用 JavaScript 属性 `document.cookie`。\n\n`document.cookie = \"username=john.doe;\
  \ expires=Fri, 27 Nov 2020 20:08:00 GMT; path: /\"`\n\n**代码 11.2：** 使用 JavaScript\
  \ 设置 Cookie\n\n如*代码示例 11.2* 所示，要使用 JavaScript 设置 Cookie，你需要将一个字符串值赋给 `document.cookie`\
  \ 属性。默认情况下，浏览器关闭时 Cookie 会被删除。要设置 Cookie 在稍后时间过期，你可以添加 expires 的名称-值对并指定过期日期。同样，path\
  \ 键告诉浏览器该 Cookie 属于哪个路径。\n\n### 使用 JavaScript 读取 Cookie\n\n通过输入 `document.cookie`，你将获取浏览器中为该特定网页存储的所有\
  \ Cookie 值。它将所有值作为一个字符串返回。要按名称-值对获取 Cookie，你可以创建一个函数，以分号分割字符串：\n\n1.  `document.cookie\
  \ = \"username=john.doe; theme=dark; expires=Fri, 27 Nov 2020 20:08:00 GMT; path:\
  \ /\";`\n\n3.  `console.log(document.cookie);`\n\n4.  `console.log(document.cookie.split(\"\
  ;\"));`\n\n    **代码 11.3：** 使用 JavaScript 读取 Cookie\n\n当你在 JS 文件中输入上述代码，并打开网页和开发者控制台时，你将看到以下内容：\n\
  \n![](img/Figure-11.2.jpg)\n\n**图 11.2：** 代码示例 11.3 的输出\n\n### 使用 JavaScript 删除\
  \ Cookie\n\n要删除 Cookie，你可以通过路径选择 Cookie，并将其过期日期设置为过去的时间。这将删除该 Cookie。\n\n### 安全性\n\
  \n重要的是要记住，如果使用 JavaScript 设置 Cookie，它们可能对用户隐私构成直接威胁。由于可以使用 JavaScript 访问 Cookie\
  \ 的值，因此切勿将敏感数据添加到使用 JavaScript 设置的 Cookie 中。或者，在创建请求和响应时，服务器可以设置 `HttpOnly` 属性，以防止使用\
  \ JavaScript 访问 Cookie 值。\n\n### 第三方 Cookie\n\n\n\n\n\nCookie 与域名相关联。域名是用户用来访问你网站的地址。例如，*facebook.com*\
  \ 是 Facebook 网页应用的域名。如果与 Cookie 关联的域名与你当前所在网页的域名相同，则称为第一方 Cookie。但如果域名不同，则称为第三方\
  \ Cookie。网站通常允许第三方 Cookie 用于广告和横幅。当用户访问多个网站时，第三方服务器会收到该 Cookie，从而通过跟踪用户的行为和浏览历史来构建用户画像。由于这是一个重大的安全隐患，许多浏览器允许屏蔽第三方\
  \ Cookie。这可能导致一些网页无法正常运行。\n\n# Web 存储 API\n\nWeb 存储 API 提供了两种比 Cookie 更安全、更直观的数据存储机制。与\
  \ Cookie 不同，Web 存储更加安全，因为大量数据存储在浏览器本地，且这些信息永远不会发送到服务器。此外，存储容量也大得多（至少 5 MB）。\n\n\
  HTML Web 存储提供了以下两个用于在浏览器中存储数据的对象：\n\n*   `window.localStorage`\n*   `window.sessionStorage`\n\
  \n这两个对象都在浏览器中存储数据。然而，它们的主要区别在于：`sessionStorage` 对象仅存储单个会话的数据，即浏览器关闭后数据会被删除；而 `localStorage`\
  \ 会持久保存数据，没有过期时间。\n\n# 会话存储\n\n会话存储对象仅存储单个会话的数据。这意味着一旦关闭浏览器或包含网页的标签页，会话存储中的所有数据都会被删除。但刷新网页或恢复网页不会删除会话存储中的数据。\n\
  \n# 设置会话存储中的值\n\n要使用 `sessionStorage` 对象设置值，我们使用 `sessionStorage` 对象的 `setItem`\
  \ 方法。`setItem` 方法接受两个参数——键和值。我们通过一个示例来理解。创建一个简单的 `index.html` 文件和一个 `index.js` 文件。在\
  \ `index.html` 文件中引入 `index.js` 文件。在 `index.js` 文件中输入以下命令：\n\n```\nsessionStorage.setItem(\"\
  username\", \"john.doe\");\n```\n\n**代码 11.4：** 为会话存储设置值。\n\n*代码示例 11.4* 中的代码会将会话存储中的用户名设置为\
  \ `john.doe`。\n\n# 从会话存储中获取值\n\n要获取会话存储对象中存储的值，可以使用 `sessionStorage` 对象的 `getItem`\
  \ 方法。在 `getItem` 方法中，应传入要获取的值对应的键名。继续前面的示例，要获取键为 username 的值，可以在 `index.js` 中添加以下代码：\n\
  \n```\nconsole.log(sessionStorage.getItem(\"username\"));\n```\n\n**代码 11.5：** 获取会话存储中的值。\n\
  \n在 `index.js` 中输入上述代码并刷新页面，控制台将显示以下值：\n\n![](img/Figure-11.3.jpg)\n\n**图 11.3：**\
  \ 代码示例 11.5 的输出\n\n现在，在 `index.js` 中删除 *代码示例 11.4* 中的代码，只保留 *代码示例 11.5* 中的代码。这意味着你没有在会话存储中设置任何值，而只是获取会话存储中已设置的\
  \ username 值。刷新页面时，你仍然会看到 *图 11.3* 中的输出。现在，关闭标签页并重新打开 `index.html` 文件。如果此时检查控制台，你会发现\
  \ `getItem` 的值为 null。这表明当你关闭标签页时，`sessionStorage` 中的数据被删除了。\n\n# 从会话存储中移除值\n\n当浏览器或标签页关闭时，会话存储中的数据会自动删除。但如果你希望在此之前移除数据，可以使用\
  \ `sessionStorage` 对象的 `removeItem` 方法。\n\n要移除单个数据，需要在方法的括号内添加要移除的键名。\n\n```\nsessionStorage.removeItem(\"\
  username\");\n```\n\n**代码 11.6：** 从会话存储中移除值。\n\n要移除 `sessionStorage` 中的所有数据，可以使用以下方法：\n\
  \n```\nsessionStorage.clear();\n```\n\n**代码 11.7：** 移除 sessionStorage 中的所有数据\n\n\
  # 本地存储\n\n本地存储与会话存储在方法和数据存储原理上类似。两者唯一的区别在于，本地存储中的数据永不过期或删除。即使关闭浏览器或标签页，数据也会持久保存。这些数据只能通过\
  \ JavaScript 清除，或者通过清除浏览器缓存或清除本地存储的数据来删除。\n\n# 设置本地存储中的值\n\n与 `sessionStorage` 对象类似，要在\
  \ `localStorage` 中设置值，需要使用 `setItem` 方法。与 `sessionStorage` 一样，`setItem` 方法接受两个参数——键名和值：\n\
  \n```\nlocalStorage.setItem(\"isLogin\", true);\n```\n\n**代码 11.8：** 在本地存储中设置值。\n\
  \n# 从本地存储中获取值\n\n同样，可以使用 `getItem` 方法从本地存储中获取键的值。它接受一个参数，即要传入 `getItem` 方法中的键名：\n\
  \n```\nconsole.log(localStorage.getItem(\"isLogin\"));\n```\n\n**代码 11.9：** 从本地存储中获取值。\n\
  \n输入 *代码示例 11.8* 中的代码将获取以下输出：\n\n![](img/Figure-11.4.jpg)\n\n**图 11.4：** 代码示例 11.8\
  \ 的输出\n\n现在，在 `index.js` 中注释掉 *代码示例 11.8* 中的代码行，保存文件，然后关闭标签页/浏览器。当你重新打开 `index.html`\
  \ 时，你仍然会看到如图 11.8 所示的值。这表明本地存储中的数据是持久化的。\n\n# 从本地存储中移除值\n\n如前所述，要移除本地存储中的数据，需要使用\
  \ JavaScript 清除它，或者清空浏览器缓存。\n\n要移除单个值，可以使用 `localStorage` 对象的 `removeItem` 方法。如前所述，需要在方法的括号内添加要移除的键名。\n\
  \n```\nlocalStorage.removeItem(\"isLogin\");\n```\n\n**代码 11.10：** 从本地存储中移除值。\n\n\
  要清空整个 `localStorage`，可以使用 clear 方法：\n\n```\nlocalStorage.clear();\n```\n\n**代码 11.11：**\
  \ 移除本地存储中的所有数据。\n\n# IndexedDB API\n\n正如我们在上一节中看到的，本地存储和 Web 存储可以存储简单的数据。要存储复杂且大量的数据，我们可以使用\
  \ `IndexedDB` API。使用 `IndexedDB` API 的优势在于可以复制类似 SQL 的整个数据库。其缺点是涉及的过程比 Web 存储 API\
  \ 多得多。\n\n# IndexedDB API 的特性\n\n使用 `IndexedDB` API 有几个优点。其中一些如下：\n\n*   它是一个大规模、NoSQL\
  \ 存储系统。\n\n*   它可以让你在用户浏览器中存储几乎任何内容，包括文件。\n\n*   它支持数据的获取、搜索、放置以及事务操作。\n\n*   它对每个网站域名或子域名都是唯一的。这意味着其他网站无法在浏览器中访问该数据库。\n\
  \n\n\n\n\n它主要是异步的，也就是说，它不会影响你的网站性能。\n\n# IndexedDB 术语\n\n在开始探索和使用 *IndexedDB* API\
  \ 之前，我们先来了解 *IndexedDB* 中使用的术语：\n\n*   **数据库**：这是 *IndexedDB* 的最高层级。它包含对象存储空间，而对象存储空间又包含你要存储的数据。你可以创建多个数据库，但最佳实践是每个应用只使用一个数据库。\n\
  *   **对象存储空间**：对象存储空间是存储数据的独立容器。将对象存储空间类比为传统关系型数据库中的表最为贴切。你需要为每种“*类型*”的数据创建对象存储空间。例如，如果你正在为书籍存储数据库，“*小说*”和“*非小说*”可以作为对象存储空间。\n\
  \n    ![](img/Figure-11.5.jpg)\n\n    **图 11.5：** IndexedDB 中的层级结构\n*   **索引**：与传统关系型数据库类似，索引可以看作是用于检索数据的列名。例如，我们可以通过书名、书籍\
  \ ID 或作者从小说对象存储空间中获取某本特定的书。\n*   **事务**：事务是对操作的包装，即与数据库的任何交互。它确保数据库的完整性。这意味着如果其中一个事务失败，则所有事务都不会被应用，数据库会恢复到事务开始前的状态。\n\
  \n# IndexedDB 流程\n\n*IndexedDB* 的流程包含几个步骤，但最重要的步骤如下：\n\n![](img/Figure-11.6.jpg)\n\
  \n**图 11.6：** IndexedDB 流程的步骤\n\n上述步骤将在下一节中解释。\n\n# 检查是否支持 IndexedDB\n\n你始终需要做的第一件事是检查用户的浏览器是否支持\
  \ IndexedDB。如果不支持，理想情况下你应该在控制台输出一条消息，说明不支持。IndexedDB 可以通过浏览器的 `window` 对象访问。由于我们会频繁使用它，因此应将其存储在一个变量中。在你的\
  \ `index.js` 中，输入以下代码：\n\n```\nlet idb = window.indexedDB;\nif(!idb) {\n    console.log(\"\
  Your browser doesn't support IndexedDB!\");\n}\n```\n\n**代码 11.12：** 检查 IndexedDB\
  \ 支持\n\n# 打开数据库\n\n可以说，流程中的下一步是打开数据库以进行存储。要打开数据库，你需要调用 `window.indexedDB` 对象的 `open`\
  \ 方法。它接受两个参数——数据库的名称及其版本。由于这是一个请求，你还需要使用 `onsuccess` 和 `onerror` 事件处理程序来检查打开数据库请求的状态。我们使用的另一个事件处理程序是\
  \ `onupgradeneeded` 事件处理程序。当我们使用相同的数据库名称但更高的版本号（即升级）打开请求时，会调用此事件处理程序。我们将在下一节中使用此事件处理程序。在下面的\
  \ *代码示例 11.13* 中，我们将代码添加到 *代码示例 11.12* 中显示的代码之后的 `index.js` 中：\n\n```\nlet db;\n\
  let request = idb.open(\"newDB\", 1);\nrequest.onerror = function(event) {\n   \
  \ console.log(event);\n}\nrequest.onsuccess = function(event) {\n    db = request.result;\n\
  }\n```\n\n**代码 11.13：** 打开你的数据库\n\n如 *代码示例 11.13* 所示，我们创建了一个变量 `db`，它将在成功时存储请求的结果。在此之前，我们创建了一个变量\
  \ `request`，在其中调用 IndexedDB 的 `open` 方法，数据库名称为 `newDB`，版本为 1，作用于我们在 *代码示例 11.12*\
  \ 中创建的变量 `idb`。如前所述，请求失败将由 `onerror` 事件处理程序处理，而成功则由 `onsuccess` 事件处理程序处理。在 `onsuccess`\
  \ 事件处理程序内部，我们将请求的结果存储在变量 `db` 中。\n\n# 添加数据\n\n我们可以通过以下两种方式将数据添加到我们在 *代码示例 11.12*\
  \ 和 *11.13* 中创建的数据库中：\n\n*   在上一节中，我们了解了一个名为 `onupgradeneeded` 的事件处理程序。每当使用更高版本打开新请求时，都会调用此事件。第一次创建打开请求时也会调用它。\n\
  *   当显式调用 `add` 函数向数据库添加数据时。\n\n在 IndexedDB 术语一节中，我们看到每个数据库都有一个包含实际数据的对象存储空间。因此，第一步就是创建对象存储空间。由于\
  \ `onupgradeneeded` 函数在第一次时被调用，我们将在其中创建对象存储空间。\n\n在我们的 `index.js` 中，我们将在 *代码示例 11.13*\
  \ 中添加的代码之后添加以下行：\n\n```\nconst data = [\n    {id: \"01\", name: \"John Doe\", age:\
  \ 27},\n    {id: \"02\", name: \"Jane Doe\", age: 27}\n];\nrequest.onupgradeneeded\
  \ = function(event) {\n    let db = event.target.result;\n    let objectStore =\
  \ db.createObjectStore(\"employee\", {keyPath: \"id\", autoIncrement: true});\n\
  \    objectStore.add(data[0]);\n}\n```\n\n**代码 11.14：** 创建 onupgradeneeded 函数\n\n\
  在 *代码示例 11.14* 中，我们将请求的结果存储在变量 `db` 中。接下来，我们将使用 IndexedDB 对象的 `createObjectStore`\
  \ 方法。`createObjectStore` 方法需要一个强制参数——名称。用类比来说，这相当于设置数据库表的名称。我们还可以在创建对象存储空间时传递可选参数。可选参数可以如下：\n\
  \n*   `keypath`：它将定义用于标识特定数据的键名或列名。例如，在 *代码示例 11.14* 中，可以借助键 `id` 来获取和标识单个员工。\n\
  *   `autoincrement`：这意味着将为对象存储空间中的每条数据自动生成一个键。\n\n最后，我们使用 `add` 方法将数据的第一行添加到数据库\
  \ `newDB` 的对象存储空间 `employee` 中。\n\n添加数据的另一种方法是创建一个显式的添加数据函数。在下面的 *代码示例 11.15* 中，我们实现了这一点：\n\
  \n```\nfunction add() {\n    let request = db.transaction([\"employee\"], \"readwrite\"\
  );\n    let objectStore = request.objectStore(\"employee\")\n    let storeRequest\
  \ = objectStore.add(data[1]);\n}\n```\n\n**代码 11.15：** 创建 add 函数\n\n在 *代码示例 11.15*\
  \ 中，由于我们已经创建了一次 `objectStore`，我们将使用 IndexedDB 对象的 `transaction` 方法返回一个包含 `objectStore`\
  \ 方法的事务。这个 `objectStore` 方法将用于访问对象存储空间。`transaction` 方法需要以下三个参数：\n\n*   第一个强制参数用于提供对象存储空间的名称（如果有多个存储空间名称，则使用数组）。\n\
  *   可选的第二个参数用于提供模式或访问类型——`readonly`、`readwrite` 或 `readwriteflush`，用于访问对象存储空间。我们将使用\
  \ `readwrite` 模式来写入/更新我们的对象存储空间 employee。此请求的结果存储在变量 `request` 中。\n*   第三个参数也是可选的。它将存储用于缓存存储的选项。\n\
  \n接下来，一旦创建了请求，我们将从请求内部获取所需的 `objectStore`。由于 `transaction` 方法允许我们获取多个对象存储空间，我们将需要\
  \ `objectStore` 方法来获取我们需要的对象存储空间。\n\n\n\n\n\n最后，我们将数据数组中的第二个对象添加到 `objectStore`\
  \ 员工对象存储中。\n\n为了稳妥起见，我们将在整个 JS 文件解析完毕且所有请求完成后，通过按钮调用来执行这个添加方法。\n\n# 查看数据\n\n我们需要做的最后一件事是查看存储在\
  \ IndexedDB 中的数据。我们可以借助以下函数来实现：\n\n```\nfunction read() {\n    let transaction =\
  \ db.transaction([\"employee\"]);\n    let objectStore = transaction.objectStore(\"\
  employee\");\n    let request = objectStore.get(\"02\");\n    request.onerror =\
  \ function(event) {alert(\"无法检索！\");};\n    request.onsuccess = function(event)\
  \ {console.log(request.result);}\n}\n```\n\n**代码 11.16：** 查看存储在对象存储中的数据\n\n为了查看数据，我们在\
  \ *代码示例 11.16* 中创建了一个 `read` 函数。在这个函数中，我们使用了事务和 *代码示例 11.15* 中使用的 `objectStore`\
  \ 方法来获取我们的员工对象存储。获取到员工对象存储后，我们将使用 `get` 方法从员工对象存储内部获取数据。正如我们之前在 *代码示例 11.14* 的 `createObjectStore`\
  \ 方法中指出的那样，我们将把 id 值作为参数传递给 get 请求。与所有请求一样，错误将由 `onerror` 事件处理程序处理，成功则由 `onsuccess`\
  \ 事件处理程序处理。\n\n如你所见，IndexedDB 对于存储大型复杂数据非常有用。然而，代价是需要编写额外的代码。\n\n# Service Workers\n\
  \n目前，我们不会详细研究 Service Workers 和缓存的概念。不过，我们会花相当多的时间来理解这两个概念背后的思想。\n\nService Workers\
  \ 就像代理服务器，位于 Web 应用程序、浏览器和网络（当可用时）之间。Service Workers 通常用于为网站提供丰富的离线浏览体验。Service\
  \ Workers 与 Cache API 紧密配合以提供这种体验。它们拦截网络请求，并根据网络是否可用采取适当的行动。它们还允许访问推送通知和后台同步 API。\n\
  \nService Worker 是一个 JavaScript 文件，控制着与之关联的网页。它拦截并修改导航和资源请求。它缓存资源，让你完全控制网页在特定情况下（尤其是网络不可用时）的行为。\n\
  \nService Workers 没有 DOM 访问权限。实际上，它在与网页主 JavaScript 不同的线程上运行。因此，它不会阻塞渲染。出于安全原因，Service\
  \ Workers 仅通过 HTTPS 运行。\n\n使用 Service Workers 有四个步骤：\n\n![](img/Figure-11.7.jpg)\n\
  \n**图 11.7：** Service Workers 的步骤\n\n总结一下流程：首先，你需要检查浏览器是否支持 Service Workers。如果支持，我们将注册\
  \ Service Worker。接下来，它会下载并安装 Service Worker。安装完成后，它会被激活。让我们快速看一个 Service Worker\
  \ 的示例。这个示例的灵感来自 MDN 上提供的示例。\n\n在我们创建了 `index.html` 和 `index.js` 用于 IndexedDB 的文件夹中，我们将创建另一个名为\
  \ `sw.js` 的文件。在 `sw.js` 中，我们将输入以下代码：\n\n```\nself.addEventListener('install', function(e)\
  \ {\n    e.waitUntil(\n        caches.open('employees').then(function(cache) {\n\
  \            return cache.addAll([\n                '/index.html',\n           \
  \     '/index.js'\n            ]);\n        })\n    );\n});\n```\n\n**代码 11.18：**\
  \ 注册 Service Worker\n\n在上述 *代码示例 11.18* 中，我们调用了 JavaScript window 对象的 self 方法。它对应于浏览器中打开的当前窗口。我们为窗口上的安装事件添加了一个事件监听器。在内部，我们调用了事件对象的\
  \ `waitUntil` 方法，请求浏览器完成作为参数传递的 Promise。只有在该 Promise 完成后，安装才算完成。在参数内部，我们调用了 Caches\
  \ API 的 open 方法（类似于 IndexedDB），并在其 Promise 中，要求缓存将 `index.html` 和 `index.js` 文件存储在浏览器中。\n\
  \n在 `index.js` 中，我们将添加以下代码：\n\n```\nif('serviceWorker' in navigator) {\n    navigator.serviceWorker\n\
  \            .register('sw.js')\n            .then(function() {console.log(\"Service\
  \ Worker 已注册\");})\n}\n```\n\n**代码 11.19：** 注册 Service Worker\n\n在上述 *代码示例 11.19*\
  \ 中，我们首先测试浏览器是否支持 `serviceWorker`。如果支持，我们调用 navigator 对象（JavaScript navigator 对象对应浏览器）的\
  \ `serviceWorker` 方法。我们调用 register 方法来注册我们在 *代码示例 11.18* 中创建的 `sw.js` 文件。由于这是一个\
  \ JavaScript Promise，我们可以分别添加 then 和 catch 方法来处理成功和失败的情况。当你运行此代码时，上述文件将作为缓存存储在浏览器中。我们将在本章最后一节中对此进行探讨。\n\
  \n# 缓存\n\nCaches API 是一个通常与 Service Workers 一起使用的接口，用于缓存，即在浏览器中存储数据。通过将数据作为缓存存储在浏览器中，你可以节省宝贵的网络带宽并更快地提供网页服务。本节我们不会详细讨论\
  \ Caches API。\n\n在上一节中，我们使用了 Cache 接口的 `addAll` 方法，该方法接收一个 URL 数组，检索它们，并将它们添加到缓存中。Cache\
  \ 接口有多个可用方法。让我们为本章一直在编写的代码添加一段代码。到目前为止，在上一节中，我们已经将 `index.html` 和 `index.js` 文件存储在缓存中。现在，让我们编写一段代码来提供这些文件，而不是在下次发送请求。\n\
  \n在 `sw.js` 中，添加以下行：\n\n```\nself.addEventListener('fetch', function(e) {\n    console.log(e.request.url);\n\
  \    e.respondWith(\n        caches.match(e.request).then(function(response) {\n\
  \            return response || fetch(e.request);\n        })\n    )\n})\n```\n\n\
  **代码 11.20：** 使用缓存提供网页\n\n在上述 *代码示例 11.20* 中，我们为浏览器中打开的当前窗口添加了另一个事件监听器。我们检查 fetch\
  \ 请求。如果存在，则调用 `callback` 函数，在其中检查请求的 URL。在 fetch 事件的 `respondWith` 方法内部，我们使用 Cache\
  \ 接口的 match 方法来检查请求是否存在于缓存中。如果存在，则将其作为响应返回，否则要求浏览器发送请求。\n\n你可以在此处查看完整的 Cache API：**[`developer.mozilla.org/zh-CN/docs/Web/API/Cache`](https://developer.mozilla.org/zh-CN/docs/Web/API/Cache)**。\n\
  \n# 在控制台上测试\n\n\n\n\n\n你可以在谷歌 Chrome 开发者工具的 `Application` 面板中查看任意网页的 Web 存储。打开 Chrome\
  \ 开发者工具的 `Application` 面板后，你会注意到一个侧边栏，其中包含从 Service Worker、本地存储到缓存的选项。你可以检查每个选项，查看由我们的\
  \ `index.js` 文件注册的值。要测试 Service Worker，你需要使用一个名为 *Live Server* 的 Visual Studio 插件。由于\
  \ Service Worker 仅在 HTTPS 下工作，你需要通过 Live Server 打开 `index.html` 来检查 Service Worker。\n\
  \n### 结论\n\n在本章中，我们学习了 JavaScript 的几种客户端存储选项。在这五种选项中，最简单且最常用的客户端存储选项是 Web Storage\
  \ API——本地存储和会话存储。正如我们所看到的，每个选项都满足用户和网站的不同需求。我们还学习了 Cookie、IndexedDB、Service Worker\
  \ 和 Cache API。Cookie 是一种传统的数据存储方法。IndexedDB 用于存储复杂数据。最后两种用于存储缓存。在下一章中，我们将学习如何使用\
  \ JavaScript 进行调试和错误处理。\n\n### 要点回顾\n\n*   Web 存储，即客户端存储，通过将数据存储在用户浏览器中，有助于提高网站的速度和性能。\n\
  *   Cookie 是在浏览器上存储数据的传统方式。然而，第三方 Cookie 因侵犯用户隐私而闻名。\n*   会话存储在用户会话期间（即浏览器/标签页打开时）存储数据。本地存储则保留数据，没有过期时间。\n\
  *   IndexedDB 用于存储大量复杂数据。\n*   Service Worker 和 Cache API 协同工作，以提供离线页面。\n\n### 选择题\n\
  \n1.  **Service Worker 可以与本地资源或 HTTP 一起工作——正确还是错误？**\n    1.  正确\n    2.  错误\n2.\
  \  **用于清除 Web Storage API 中数据的方法是什么？**\n    1.  `clear`\n    2.  `remove`\n    3.\
  \  `empty`\n\n### 答案\n\n1.  **b**\n2.  **a**\n\n# 第 12 章\n\n## 调试与错误处理\n\n你会记得，在\
  \ *第 10 章：实时应用开发* 中，我们在开发应用时遇到了一系列错误或问题。在实际场景中，使用编程语言时难免会遇到一些错误。虽然其中一些错误或 bug 相对较小，不会影响用户使用应用时的体验，但你也会发现一些会导致网页/应用崩溃的错误或\
  \ bug。这里有必要指出，如果你作为用户，发现一个你打算频繁使用的应用（例如股票应用或社交媒体应用）经常崩溃，你就会停止使用它。事实上，你可能会寻找替代品。因此，检测和发现错误至关重要。在本章中，我们将首先通过示例学习几种调试（识别）错误的方法，然后探索处理这些错误的方法。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   错误\n*   调试简介\n*   `console.log()` 方法\n*   使用断点调试\n\
  *   `debugger` 关键字\n*   Try、Catch 和 Finally\n\n### 目标\n\n学习本章后，你应该能够诊断和检测错误发生的位置，并利用\
  \ JavaScript 方法纠正错误。你将学习如何使用 JavaScript 方法处理错误代码，而不让其影响用户界面。\n\n# 错误\n\n在 JavaScript\
  \ 中，当代码中发现错误或问题时，就会发生错误。每当出现运行时错误时，就会抛出 JavaScript 错误对象。这些错误通常以红色背景显示在浏览器开发者工具的\
  \ `Console` 面板中。\n\n正如我们之前所学，有些错误会影响应用的 `用户界面`（`UI`）。通常，当 JavaScript 中出现错误时，JavaScript\
  \ 的执行会在该点停止。如果不加以处理，这也会停止网页上 HTML 的渲染。此时，如果渲染停止，用户可能会看到一个空白屏幕，没有任何提示说明发生了什么。结果，许多用户会直接停止使用该应用并离开。为了避免这种情况，我们首先需要了解几种错误类型。之后，我们将学习如何调试，即识别或检测这些错误，最后学习如何处理这些错误，使其不影响其余代码或\
  \ UI。\n\n# 错误类型\n\nJavaScript 中有几种针对特定问题抛出的错误构造函数。让我们看看这些错误构造函数：\n\n# EvalError\n\
  \n当全局 `eval()` 函数发生错误时，会抛出 `EvalError`。`eval()` 函数用于评估或执行其参数内的表达式。JavaScript 不再抛出此异常；但\
  \ `EvalError` 对象为了兼容性而保留。\n\n# RangeError\n\n当某个值超出合法值的集合或范围时，会抛出 `RangeError`。例如，如\
  \ *代码示例 12.1* 所示，我们使用了 Number 对象的 `toFixed()` 方法。`toFixed()` 方法中参数允许的范围是 0 到 100。然而，在\
  \ *代码示例 12.1* 中，我们传递的参数是 500，超出了合法值的范围。\n\n```\nlet number = 200;\nnumber.toFixed(500);\n\
  ```\n\n**代码 12.1：** 导致 `RangeError` 的错误代码\n\n执行上述代码后，我们将在开发者工具的 Console 面板中看到以下消息：\n\
  \n![](img/Figure-12.1.jpg)\n\n**图 12.1：** 针对 代码示例 12.1 抛出的 `RangeError`\n\n# ReferenceError\n\
  \n当引用一个不存在的变量时，会抛出 `ReferenceError`。例如，在下面的截图中，我们尝试引用尚未声明的变量 `person`，因此导致抛出 `ReferenceError`：\n\
  \n![](img/Figure-12.2.jpg)\n\n**图 12.2：** `ReferenceError` 示例\n\n# SyntaxError\n\
  \n当 JavaScript 遇到语法不正确的代码时，会抛出 `SyntaxError`。我们可以在下面的截图中看到这样一个例子：\n\n![](img/Figure-12.3.jpg)\n\
  \n**图 12.3：** `SyntaxError` 示例\n\n在 *图 12.3* 中，我们将变量名中的字符串用引号括起来。我们用双引号打开字符串，但用单引号结束。由于这在语法上是错误的，因此抛出了\
  \ `SyntaxError`。\n\n# TypeError\n\n当 JavaScript 无法执行代码，因为值的类型不是预期类型时，会抛出 `TypeError`。`TypeError`\
  \ 可能出现在以下情况：\n\n*   传递给函数的参数与函数期望的类型不兼容。\n*   尝试修改一个无法更改的值。\n*   以不恰当的方式使用某个值。\n\
  \n例如，在下面的截图中，我们对存储在变量名中的字符串使用了 Number 对象的 `toFixed` 方法。如你所见，这导致了 `TypeError`：\n\n\
  ![](img/Figure-12.4.jpg)\n\n**图 12.4：** `TypeError` 示例\n\n# URIError\n\n\n\n\n\n\
  最后，当你在统一资源标识符（URI）函数中使用非法字符时，会抛出 `URIError`。URI 是指向资源的字符串。统一资源定位符（URL）是一种 URI，用于标识网络上的位置。JavaScript\
  \ 提供了编码或解码 URI 的函数。如果你在 JavaScript 的 `decodeURI` 函数中传递了像‘%’这样的非法字符，如下面的截图所示，你将收到一个\
  \ `URIError`：\n\n![](img/Figure-12.5.jpg)\n\n图 12.5：URIError 示例\n\n还有两种错误类型——`AggregateError`\
  \ 和 `InternalError`。前者——`AggregateError` 简单表示当多个错误需要被包装成一个单一错误时的错误。后者——`InternalError`\
  \ 并非标准，因此建议不要在任何面向用户的网站上使用它。\n\n# 调试简介\n\n如果你正在创建一个复杂的应用程序（例如，像亚马逊这样的电子商务应用），你将编写数百行代码。在如此庞大的\
  \ JavaScript 文件中，遇到或编写包含错误的代码的可能性更高。你可能会不小心忘记为字符串添加闭合引号，或者可能在没有事先声明变量的情况下引用它。\n\n\
  调试就是搜索和识别这些错误的过程。在接下来的章节中，我们将介绍在 JavaScript 代码中调试错误的各种方法。\n\n在接下来的章节中，我们将使用以下有错误的\
  \ JavaScript 代码进行调试：\n\n```\nconst add = (num1, num2) => {\n    return num1 + num2;\n\
  }\nlet number1 = \"20\";\nlet number2 = Math.random()*100.toFixed(500);\nlet sum\
  \ = add(number1, number2);\ndocument.getElementById(\"result\").innerText = `The\
  \ result of ${number1} and ${number2} is ${sum}.`;\n```\n\n代码 12.2：用于调试的有错误代码\n\n\
  在上一节中，我们了解了 JavaScript 抛出的几种错误类型。这将帮助我们识别在 JavaScript 代码中犯的错误。现在我们对错误类型有了大致的了解，理解如何检测这些错误应该会稍微容易一些。\n\
  \n# `console.log()` 方法\n\n我们在前一章中已经见过并使用了 `console.log()` 方法。`console.log()` 方法向控制台写入一条消息。让我们尝试理解如何使用此方法来调试代码示例\
  \ 12.2 中显示的代码。\n\n我们将首先创建一个文件夹来实现此代码。执行 JavaScript 代码有多种方式；但为了延续我们在前几章中一直使用的方法，我们将创建一个包含\
  \ HTML 文件和 JavaScript 文件的新文件夹。我们将 HTML 文件命名为 `index.html`，并在 body 内部创建一个带有 `id`\
  \ 为 result 的 `p` 元素。添加 HTML 文件后，我们的 `index.html` 文件将如下所示：\n\n```\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n    <title>Debugging</title>\n\
  </head>\n<body>\n    <p id=\"result\"></p>\n    <script src=\"index.js\"></script>\n\
  </body>\n</html>\n```\n\n代码 12.3：index.html 文件\n\n我们将 JavaScript 文件命名为 `index.js`，并将代码示例\
  \ 12.2 中的代码粘贴到我们的 `index.js` 文件中。当我们保存这两个文件并打开 `index.html` 时，我们将看到一个空白屏幕。打开开发者工具中的控制台面板后，你将看到以下内容：\n\
  \n![](img/Figure-12.6.jpg)\n\n图 12.6：index.html 的错误消息\n\n如前面的截图所示，我们的代码收到了一个 `SyntaxError`。正如我们在第\
  \ 2 章：开发者工具中所看到的，文本 `index.js:6` 指的是错误发生的位置。这意味着错误发生在 `index.js` 的第 6 行。如果我们查看代码示例\
  \ 12.2 的第 6 行，看起来错误发生在变量 `number2` 的定义上。\n\n让我们尝试理解定义变量时的错误。在第 6 行，我们做了两件事。首先，我们使用\
  \ `Math.random()` 函数生成一个随机数，并将这个随机生成的数乘以 100。接着，我们对其使用 `Number` 对象的 `toFixed` 方法，并向该\
  \ `toFixed` 方法传递参数 500。让我们使用 `console.log()` 方法逐一检查这两个值。因此，我们将注释掉代码示例 12.2 中从第 6\
  \ 行开始的代码，并在前一行添加以下代码：\n\n```\nconsole.log(Math.random());\n```\n\n代码 12.4：向 Math.random()\
  \ 添加 console.log\n\n当我们保存代码示例 12.2 中的上述更改并刷新网页时，我们将在控制台中看到以下值：\n\n![](img/Figure-12.7.jpg)\n\
  \n图 12.7：添加代码示例 12.4 后的控制台\n\n在前面的截图中，我们可以看到 `Math.random()` 的值是正确的，并且没有返回错误。让我们向代码添加下一步，以检查这是否是导致错误的原因。更新代码示例\
  \ 12.4，我们现在将该值乘以 100：\n\n```\nconsole.log(Math.random()*100);\n```\n\n代码 12.5：检查乘以\
  \ 100\n\n保存此更新并刷新页面后，控制台中会显示一个新值：\n\n![](img/Figure-12.8.jpg)\n\n图 12.8：添加代码示例 12.5\
  \ 后的控制台\n\n`Math.random()` 函数每次都会返回一个新数字。比较图 12.7 和图 12.8，我们可以看到，使用 `Math.random()`\
  \ 函数生成的新数字现在乘以了 100，并返回了图 12.8 中显示的值。同样，我们还没有遇到错误。那么，让我们添加下一步——向代码示例 12.5 添加 `toFixed`\
  \ 函数：\n\n```\nconsole.log(Math.random()*100.toFixed());\n```\n\n代码 12.6：添加 toFixed\
  \ 函数\n\n当我们像代码示例 12.6 所示更新代码并刷新页面时，我们在控制台中收到以下消息：\n\n![](img/Figure-12.9.jpg)\n\n\
  图 12.9：添加代码示例 12.6 后的控制台\n\n如前面的截图所示，我们终于可以看到错误发生的位置了。似乎 `toFixed()` 函数在代码示例 12.5\
  \ 上不起作用。让我们尝试探究收到此错误的原因。我们知道 `Math.random()*100` 给出了正确的值。从前面的章节中，我们也知道 `toFixed()`\
  \ 函数在数字数据类型上完美运行。然而，看起来我们是将 `toFixed()` 方法应用到了代码的 *100 部分，即表达式的一个不完整部分。为了确保 `toFixed()`\
  \ 方法应用于整个表达式，我们将整个表达式放在括号内，并对括号内的这个表达式应用 `toFixed()` 方法：\n\n```\nconsole.log((Math.random()*100).toFixed());\n\
  ```\n\n代码 12.7：将 toFixed 函数添加到括号内\n\n当我们用代码示例 12.7 更新代码并刷新页面时，我们将看到不再收到任何错误。相反，我们现在在控制台中看到一个数字：\n\
  \n![](img/Figure-12.10.jpg)\n\n图 12.10：控制台上未显示错误。\n\n\n\n\n那么，看来我们已经解决了这个错误。让我们添加*代码示例\
  \ 12.2* 中第 6 行所示的最后一步，检查是否还会出现错误。因此，让我们在代码的括号内添加值 500 作为参数，如*代码示例 12.7* 所示。\n\n\
  1.  `console.log((Math.random()*100).toFixed(500));`\n\n    **代码 12.8：** 向 `toFixed`\
  \ 方法添加 500 作为参数\n\n当我们完成上述更改后刷新网页，会看到控制台上又出现了一个新错误：\n\n![](img/Figure-12.11.jpg)\n\
  \n**图 12.11：** 代码中出现了一个新错误\n\n这次，我们看到一个相当直接的 `RangeError` 错误。正如我们在上一节中所见，当你提供的值超出了合法值的集合或范围时，就会发生\
  \ `RangeError`。幸运的是，在*图 12.11* 中，JavaScript 告诉了我们 `toFixed()` 方法需要添加的实际值范围。因此，让我们更新*代码示例\
  \ 12.8* 中的代码，将值 500 替换为 2。保存并刷新页面后，我们会看到错误消失了，取而代之的是一个带有两位小数的数字：\n\n![](img/Figure-12.12.jpg)\n\
  \n**图 12.12：** 错误已解决，我们的代码显示没有错误。\n\n现在，让我们用上述更改更新*代码示例 12.2* 中的原始代码：\n\n1.  `const\
  \ add = (num1, num2) => {`\n2.  `    return num1 + num2;`\n3.  `}`\n4.  `let number1\
  \ = \"20\";`\n5.  `let number2 = (Math.random()*100).toFixed(2);`\n7.  `let sum\
  \ = add(number1, number2);`\n8.  ``document.getElementById(\"result\").innerText\
  \ = `The result of ${number1} and ${number2} is ${sum}.`;``\n\n    **代码 12.9：**\
  \ 更新后的新代码，变量 `number2` 已更改\n\n保存并刷新页面后，我们终于得到了函数 `add` 的输出，控制台上没有抛出任何错误，并且第 8 行的语句显示在控制台上，如下所示：\n\
  \n![](img/Figure-12.13.jpg)\n\n**图 12.13：** 代码示例 12.9 的输出\n\n然而，如果你观察上面的截图，你会注意到两个数相加的结果是错误的。20\
  \ 和 70.30 相加的结果应该是 90.30，但显示的值是 2070.30。如果你仔细看这个值，你会发现它们不是相加，而是拼接在了一起。如果你还记得*第 1\
  \ 章：JavaScript 简介* 中的运算符，你会记得如果一个数字和一个数字字符串，或者两个数字字符串相加，它不会执行加法运算。相反，它会将它们作为两个字符串拼接起来。从*图\
  \ 12.13* 中，我们可以观察到类似的情况正在发生。因此，让我们快速使用 `console.log` 方法来检查传递给 `add` 方法的两个参数的数据类型。\n\
  \n让我们修改*代码示例 12.9* 中的函数 `add`，加入 `console.log` 方法来检查参数的数据类型：\n\n1.  `const add =\
  \ (num1, num2) => {`\n2.  `    console.log(\"Type of num1:   \", typeof num1);`\n\
  3.  `    console.log(\"Type of num2:   \", typeof num2);`\n4.  `    return num1\
  \ + num2;`\n5.  `}`\n\n    **代码 12.10：** 在函数 `add` 内部添加 `console.log` 方法\n\n保存并刷新网页后，我们会看到以下内容：\n\
  \n![](img/Figure-12.14.jpg)\n\n**图 12.14：** 代码示例 12.10 的输出\n\n正如我们在上面的截图中看到的，函数\
  \ `add` 中的两个参数的数据类型都是字符串。这证实了我们的怀疑：我们在 `add` 函数中接收到了两个字符串值。既然我们知道了是什么导致了错误的结果，让我们纠正这个错误的代码。`Number`\
  \ 对象有几种将字符串转换为数字的方法。为了使代码通用，我们将在字符串前使用 `+` 运算符来将字符串值转换为数字。在我们将这个探索添加到代码之前，让我们先用\
  \ `console.log()` 方法测试一下。在*代码示例 12.10* 中，我们将做一些小的改动：\n\n1.  `const add = (num1,\
  \ num2) => {`\n2.  `    console.log(\"Type of num1 after adding + before it:   \"\
  , typeof +num1);`\n3.  `    console.log(\"Type of num2 after adding + before it:\
  \   \", typeof +num2);`\n4.  `    return num1 + num2;`\n5.  `}`\n\n    **代码 12.11：**\
  \ 修改函数 `add` 内部的 `console.log` 方法\n\n更新并刷新页面后，我们会看到以下内容：\n\n![](img/Figure-12.15.jpg)\n\
  \n**图 12.15：** 将字符串转换为数字\n\n在*图 12.15* 中，我们可以看到我们可以使用 `+` 运算符成功地将字符串转换为数字数据类型。让我们移除这个\
  \ `console.log()` 方法，并将*代码示例 12.9* 的第 2 行替换为以下内容：\n\n1.  `const add = (num1, num2)\
  \ => {`\n2.  `    return +num1 + +num2;`\n3.  `}`\n\n    **代码 12.12：** 修改代码示例 12.9\
  \ 中的 `add` 函数\n\n保存并最终刷新页面后，我们会看到以下内容：\n\n![](img/Figure-12.16.jpg)\n\n**图 12.16：**\
  \ 添加代码示例 12.12 后的输出\n\n最终，借助 `console.log()` 方法，我们纠正了代码中的所有错误。\n\n# 使用断点调试\n\n在上一节中，我们系统地使用了\
  \ `console.log()` 方法来检测和解决错误。另一种调试 JavaScript 代码的方法是使用断点。在*第 2 章：开发者工具* 中，我们简要了解了如何向代码添加断点。在本节中，我们将更详细地了解断点，并使用断点解决*代码示例\
  \ 12.2* 中的一个错误。\n\n大多数现代浏览器都支持添加断点。然而，在本书中，我们将主要使用 Google Chrome。要向 JavaScript 代码添加断点，请按照以下步骤操作：\n\
  \n1.  打开 Chrome 开发者工具的 `Sources` 面板。\n\n2.  从左侧边栏中找到并打开 `index.js` 文件。这个侧边栏称为文件导航器窗格。\n\
  \n3.  在文件导航器窗格右侧的部分选择一行代码。这个右侧部分称为代码编辑器窗格。\n\n4.  通过单击代码编辑器窗格中的行号，向所选代码行添加断点。现在，每当浏览器执行\
  \ `index.js` 文件时，它都会在之前第 4 点添加的断点处暂停。当向代码添加断点时，JavaScript 的执行会在 `index.js` 文件中的该点暂停。\n\
  \n5.  使用 Sources 面板底部第三个也是最后一个部分中的控件，你可以移动到下一行或继续执行代码。这个窗格称为 JavaScript 调试窗格。\n\n\
  让我们使用断点来解决其中一个错误。断点对于检查除 `SyntaxError` 之外的错误特别有用。例如，如果你在*代码示例 12.2* 的第 6 行放置一个断点，JavaScript\
  \ 执行不会在第 6 行暂停。相反，一旦在解析文件时发现错误，它甚至不会开始执行 `index.js` 文件。（尝试在第 6 行添加一个断点并刷新页面。）然而，如果存在像\
  \ `TypeError` 或 `ReferenceError` 这样的错误，它会被捕获。这是因为语法错误对整个 JavaScript 至关重要。\n\n但是，如果我们解决了第一个错误，然后对于第二个错误（我们得到了错误的计算结果），你可以暂停执行以检查函数内部的值。\n\
  \n**注意：** 良好的调试需要同时使用这三种方法来找出根本问题。\n\n\n\n\n那么，我们假设已经使用 `console.log` 解决了 *代码示例\
  \ 12.2* 中第 6 行的问题。现在，我们需要调试 `add` 函数返回错误结果的代码，该代码在 *代码示例 12.9* 中给出。因此，让我们移除在 *代码示例\
  \ 12.9* 之后对 `index.js` 所做的修改。最后，在 Sources 面板的 `index.js` 中，我们在第 2 行添加一个断点。完成此操作后，代码将在第\
  \ 2 行暂停执行，你的 Sources 面板将如下所示：\n\n![](img/Figure-12.17.jpg)\n\n**图 12.17：** 添加断点后的\
  \ Sources 面板。\n\n如上图所示，有几种方法可以找出 `add` 函数接收到的值：\n\n*   你可以查看 Code Editor 面板的第 1\
  \ 行，其中参数的值以棕色背景显示。\n*   你可以查看 `Sources` 面板底部 JavaScript Debugging 面板右侧部分的值。\n* \
  \  你可以将鼠标悬停在 Code Editor 面板第 1 行或第 2 行的变量 `num1` 和 `num2` 上。（参见 *图 12.17* 的 Code\
  \ Editor 面板第 1 行。）\n*   在断点暂停代码执行的情况下，你可以前往 Developer Tools 的 Console 面板，输入变量 `num1`\
  \ 和 `num2` 来查看它们的值，或对它们执行任何操作，而不会影响实际代码。\n\n无论使用哪种方法，你都会注意到参数接收到的值被双引号包裹，这表明它是一个字符串。为了确认这一点，在断点仍然暂停执行的情况下，你可以前往\
  \ Developer Tools 的 Console 面板，输入以下内容：\n\n![](img/Figure-12.18.jpg)\n\n**图 12.18：**\
  \ 在 Console 面板上检查值和类型\n\n正如你在 Console 面板中看到的，`num1` 和 `num2` 变量接收的是字符串值。正如我们之前在\
  \ *代码示例 12.12* 中解决的那样，我们可以在字符串值前使用 `+` 运算符将其转换为数字格式。然后代码将无错误地执行。要继续执行代码，即停止断点暂停代码执行，你可以按下\
  \ JavaScript Debugging 面板中蓝色高亮显示的播放按钮。如 *第 2 章：开发者工具* 中所述，如果你想移动到下一行代码，可以按下 JavaScript\
  \ Debugging 面板中播放按钮旁边的按钮。\n\n# debugger 关键字\n\n上一节中手动添加断点的另一种方法是在我们想要检查的行之前添加 JavaScript\
  \ 关键字 `debugger`；它会在该点暂停 JavaScript 代码的执行。\n\n与添加断点一样，你不能对 `SyntaxError` 使用调试器。对于\
  \ `TypeError` 或 `ReferenceError` 等错误，或者对于计算第二种情况，我们可以在函数 `add` 内部第 2 行之前添加 `debugger`；关键字。完成此操作后，你的代码将如下所示：\n\
  \n```\nconst add = (num1, num2) => {\n    debugger;\n    return num1 + num2;\n}\n\
  let number1 = \"20\";\nlet number2 = (Math.random()*100).toFixed(2);\nlet sum =\
  \ add(number1, number2);\ndocument.getElementById(\"result\").innerText = `The result\
  \ of ${number1} and ${number2} is ${sum}.`;\n```\n\n**代码 12.13：** 在函数内部添加 debugger\n\
  \n保存并刷新页面后，你会看到 `index.js` 的 JavaScript 执行将在我们添加 `debugger` 的行暂停，如下面的截图所示：\n\n![](img/Figure-12.19.jpg)\n\
  \n**图 12.19：** 使用 debugger 在 Console 面板上检查值和类型\n\n与上一节中看到的调试一样，JavaScript Debugging\
  \ 面板将显示函数 `add` 作为参数接收的两个变量 `num1` 和 `num2` 的值。你也可以使用上一节中的四种方法检查它们的值或对这些变量执行操作。\n\
  \n最后，既然我们已经知道了变量 `num1` 和 `num2` 的值，我们可以应用 *代码示例 12.12* 中的更改来解决我们的 bug。\n\n# try、catch\
  \ 和 finally\n\n在前面的章节中，我们探讨了调试代码问题的几种方法。正如我们在 `console.log` 部分所见，如果 JavaScript 执行没有停止，由于代码崩溃，用户将看到一个空白页面。这通常是不理想的。例如，考虑一个电子商务应用程序。如果代码崩溃，用户将在屏幕上看到空白页面或一些难看的错误消息。这会让用户反感。为了处理此类意外错误，我们使用\
  \ JavaScript 异常处理。\n\nJavaScript 异常处理中使用了四个关键字，如下所示：\n\n*   `try`：当你想要测试一段代码是否存在错误时，你将把该代码放在\
  \ `try` 语句代码块内。\n*   `catch`：如果 `try` 代码块内的代码出现任何错误，这些错误将被捕获并发送到 `catch` 代码块。在这里，你可以安全地处理这些错误。\n\
  *   `throw`：用于抛出自定义错误。\n*   `finally`：无论结果如何，JavaScript 都会在 `try` 和 `catch` 之后执行\
  \ `finally` 语句内的代码。\n\n这基本上意味着你希望 `try` 语句内的所有代码都能成功执行，没有任何错误。然而，如果它没有成功执行，并导致任何错误，控制权将自动转移到\
  \ `catch` 块。在 `catch` 块内，我们可以编写一段代码来安全地处理此异常。如果在 `try` 语句内没有发现异常或错误，`catch` 块内的代码将被跳过。`finally`\
  \ 语句内的代码将在 `try` 和 `catch` 块完成后立即执行。\n\n为了绕过语法错误，让我们尝试在我们用于 *代码示例 12.2* 和 *12.9*\
  \ 的代码更新示例中引入一个 `TypeError`：\n\n```\nconst add = (num1, num2) => {\n    return +num1\
  \ + +num2;\n}\ntry {\n    let number1 = \"20\";\n    let number2 = (Math.random()*100).tosFixed(500);\n\
  \    let sum = add(number1, number2);\n    document.getElementById(\"result\").innerHTML\
  \ = `The result of ${number1} and ${number2} is ${sum}.`;\n}\ncatch(error) {\n \
  \   document.getElementById(\"result\").innerHTML = `Sorry, it looks like we encountered\
  \ an error.`;\n}\n```\n\n**代码 12.14：** 引入一个 TypeError\n\n在 *代码示例 12.14* 中，我们做的第一件事是在代码中引入一个\
  \ `TypeError`。在第 7 行，我们将 JavaScript 方法 `toFixed` 错误地拼写为 `tosFixed`。接下来，我们将整个代码放在\
  \ `try` 块中。如果代码遇到错误（并且应该会遇到），它将被 `catch` 块捕获。在 `catch` 块内，我们确保告诉用户我们遇到了错误。\n\n如果你注释掉\
  \ `try` 和 `catch` 块，你会看到刷新页面后，你只会看到一个空白屏幕。然而，如果你保留 *代码示例 12.14* 不变，你将看到我们的网页如下所示：\n\
  \n![](img/Figure-12.20.jpg)\n\n**图 12.20：** 错误处理后的页面\n\n因此，我们处理了一个潜在的错误，并且没有让它影响我们网页的\
  \ UI。\n\n### 结论\n\n\n\n\n\n本章开头，我们学习了各种类型的错误及其产生原因。随后，我们了解了不同的调试方法，即检测代码中的错误。第一种方法是使用\
  \ `console.log()` 方法。该方法（如果浏览器支持）会在浏览器的控制台面板中记录一条语句。第二种和第三种方法——添加断点和使用 `debugger`——会暂停代码的执行。最后，我们了解了如何使用\
  \ `try`、`catch` 和 `finally` 来处理错误，以避免影响用户界面。\n\n在下一章中，我们将详细探讨测试和测试框架。\n\n### 要点回顾\n\
  \n* JavaScript 中的调试是指识别并纠正 JavaScript 代码中错误的过程。\n* `console.log()` 方法会在浏览器的控制台面板中记录一条语句，但不会暂停代码的执行。\n\
  * 你可以暂停代码的执行，以检查错误发生点传递的值。要暂停代码执行，可以在开发者工具的“源代码”面板中手动添加断点，或者在错误代码前添加关键字 `debugger`。\n\
  * 如果错误未得到处理，可能会影响网页的用户界面。为了处理错误，我们使用 `try`、`catch` 和 `finally` 块。待测试的代码放在 `try`\
  \ 块中；如果捕获到错误，则会转到 `catch` 块；无论 `try` 和 `catch` 的结果如何，`finally` 块中的代码都会执行。\n\n###\
  \ 选择题\n\n1.  **如果未发现错误，`finally` 块中的代码将不会执行——正确还是错误？**\n\n    1.  正确\n    2.  错误\n\
  \n2.  **如果我们引用一个尚未声明的变量，会抛出以下哪种错误？**\n\n    1.  `TypeError`\n    2.  `ReferenceError`\n\
  \    3.  `SyntaxError`\n\n### 答案\n\n1.  **b**\n2.  **b**\n\n# 第 13 章\n\n## 测试与测试框架\n\
  \n让我们从一个实际例子开始本章。\n\n2014 年，一家印度热门电商网站推出了一项古怪的营销策略来吸引顾客。该电商网站宣传称，在 2014 年的某个节日，网站上超过一半的商品将低至\
  \ 1 卢比。毋庸置疑，这一诱人的营销策略为该网站制造了绝佳的热度。然而，在活动当天，网站对大多数用户来说崩溃了。对于少数成功访问的用户，他们选择的商品在结账时显示已售罄。这次实验严重打击了该网站在大众中的受欢迎程度。事实上，许多忠实用户转而投向了其他电商平台。\n\
  \n从这个例子中我们学到的教训是：如果该电商网站的开发者对网站进行了充分测试，整个惨败本可以避免。这也是为什么测试对每个品牌和每个网站都至关重要的原因之一。在本章中，我们首先了解测试的过程。接着，我们将介绍几种测试类型。最后，在尝试其中一个单元测试框架之前，我们将探讨几种测试框架。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 测试简介\n* 测试类型\n* 理想的测试结构\n* 测试框架\n* Jest\n\n###\
  \ 目标\n\n学习本章后，你应该能够理解测试网站/应用程序的重要性。你将学会在开发的不同阶段实施多种测试类型，并使用 Jest 框架进行单元测试。\n\n#\
  \ 测试简介\n\n正如我们之前所学，测试在你的 Web 应用程序/网站中起着至关重要的作用。在*第 12 章：调试与错误处理*中，我们了解了一个称为“bug”的概念。每当程序产生意外或不正确的结果时，我们将其标记为\
  \ bug。正如上一章所见，如果 bug 无人处理，它们可能导致整个网站/Web 应用程序崩溃。在上一章中，我们探讨了检测 bug 和处理这些 bug 所引发问题的几种方法。在本章中，我们将了解如何测试代码以避免\
  \ bug。\n\n在技术公司从事项目时，你经常会遇到 TDD 和 BDD 等术语。TDD 和 BDD 是敏捷开发方法的范式或模型。虽然还有其他几种范式，但这两个在开发团队中非常流行。测试你的\
  \ Web 开发工作在一定程度上取决于你选择的范式。TDD 的全称是测试驱动开发（Test-Driven Development），而 BDD 代表行为驱动开发（Behavior-Driven\
  \ Development）。\n\nTDD 和 BDD 的区别在于你处理功能的方式。\n\n# 测试驱动开发\n\n在 TDD 中，我们首先为开发一个功能编写测试。例如，要创建一个登录页面，我们强制需要两个输入框——一个用于用户名/邮箱，另一个用于密码。在\
  \ TDD 中，我们不会立即开始编写创建这两个输入框的代码。首先，我们编写一个测试用例，说明登录页面需要两个输入框。由于我们尚未编写能渲染两个输入框的代码，该测试必然会失败。只有当我们编写了正确的代码来渲染这两个输入框后，测试才会通过。通过这种方式，我们将为功能的每一个最小部分创建“蓝图”以使其通过。这将确保你编写的每一段代码都有一个蓝图。\n\
  \n![](img/Figure-13.1.jpg)\n\n**图 13.1：** TDD 流程\n\n由于我们在开发之前编写测试，即测试驱动开发，因此这个过程被称为\
  \ TDD。它回答了“我的代码能工作吗？”这个问题。\n\n# 行为驱动开发\n\n与 TDD 不同，**行为驱动开发**（**BDD**）关注的是系统的行为。在\
  \ BDD 中，回答的问题是“我的代码是否做了它应该做的事情？”。\n\n沿用上一节中的例子，在 BDD 中，我们不会关注页面是否有两个输入框。相反，我们会关注页面是否实现了让用户登录的功能（即行为）。在\
  \ BDD 中，需要结合自然语言（用于描述行为或功能）和领域知识。\n\n总之，TDD 和 BDD 之间没有可比性。TDD 对于小型团队非常有用，能降低出现 bug\
  \ 的可能性。同时，BDD 对于需要跟踪用户行为的大型团队非常有用，但其缺点是 bug 的追踪会稍微困难一些。根据你的开发工作和目标，选择其中一种测试风格很重要。然而，本章最重要的部分是灌输测试对开发非常重要的理念。在下一节中，我们将介绍几种测试类型。\n\
  \n# 测试类型\n\n测试有多种类型或风格。不过，在本节中，我们将介绍最重要的几种测试类型。\n\n# 单元测试\n\n单元测试涉及独立测试小段代码。它对于减少部署期间\
  \ bug 的出现非常有用。由于我们为功能的最小部分编写测试，因此在更高级别出现 bug 的可能性会显著降低。单元测试将软件分解为特定函数，并对这些函数进行单独测试。单元测试的主要目标或目的是在\
  \ bug 被推送到生产环境（即用户可以使用你的应用程序之前）之前识别并消除它。\n\n# 集成测试\n\n\n\n\n在单元测试中，我们编写代码来测试单个函数或一段代码。虽然这可以确保单个函数很少会抛出错误，但它并未涵盖该独立组件与另一个独立组件之间的交互。有可能每个独立组件自身都能完美按预期工作，但当这些组件相互交互时，可能会导致错误，进而使应用程序崩溃。例如，在一个电子商务应用中，移动页面的单元测试涉及确保手机数量与数据库中显示的数量完全一致。同样，购物车页面的单元测试会准确显示添加到购物车中的商品信息，并附带多个输入框供用户输入个人和支付详情。然而，如果移动页面上每部手机的“添加到购物车”按钮没有更新购物车页面上的商品，那么两者之间的交互就会失败，可能导致应用程序崩溃。\n\
  \n集成测试则是将各个独立组件组合成一个组进行测试。通常，它涉及测试多个模块，每个模块由应用程序的两个或多个小组件组成。集成测试用于测试这些组件之间的交互。当多个组件在应用程序中一起运行时，它有助于发现重大错误。\n\
  \n# 端到端测试\n\n端到端测试是测试拼图的最后一块。端到端测试也称为 E2E 测试或功能测试。它用于测试应用程序从开始到结束的整个流程。在 E2E 测试中，函数的技术细节被忽略。在这里，我们通过控制浏览器或网站来测试场景在产品上的表现。在这种风格中，我们从用户的角度看待网站或\
  \ Web 应用程序。我们复制并尝试模拟用户的环境和行为，同时从头到尾测试应用程序。这种风格的缺点是难以找到失败的根源。因此，它对于大型项目来说并不是特别有用。\n\
  \n# 理想的测试结构\n\n我们已经知道测试对于每个 Web 开发项目都至关重要。然而，为每一行代码或你编写的每一个小功能编写测试是没有意义的。同样，为整个应用程序只使用一种测试风格也是错误的。\n\
  \n关键在于*编写恰到好处的测试——编写正确的测试*。目标从来不是达到 100%的测试覆盖率。\n\n一个典型的测试结构应包含以下层次：\n\n![](img/Figure-13.2.jpg)\n\
  \n**图 13.2：** 理想的测试结构\n\n上述截图显示了以下内容：\n\n**静态测试**：你需要做的最基本的事情是包含一个静态类型系统或 linter，以检查基本错误，如拼写错误或语法错误。像\
  \ Visual Studio Code 这样的 IDE 提供了内置系统，可以在用户输入代码时捕获此类拼写或语法错误。\n\n**单元测试**：你需要编写有效的单元测试，针对应用程序的关键行为。不要为应用程序的每个函数编写单元测试，而应只包含那些对应用程序至关重要的功能的测试。\n\
  \n**集成测试**：在应用程序中包含集成测试非常重要，尤其是对于那些从用户角度来看具有严重影响或后果的组件。我们在前面集成测试的子章节中已经看了一个例子。\n\
  \n**端到端测试**：最后，你需要确保你的应用程序从头到尾按预期工作。\n\n添加这四个层次将确保你的 Web 应用程序平稳运行，并且没有可能影响用户体验的重大错误。\n\
  \n# 测试框架\n\n有许多优秀的测试框架和测试工具。在本节中，我们将介绍一些在 Web 开发行业中最流行、维护得最好、并且你绝对应该了解的工具。\n\n#\
  \ jsdom\n\njsdom 是许多 Web 标准的纯 JavaScript 实现。简单来说，jsdom 借助简单的 JavaScript 模拟浏览器环境。在模拟的浏览器环境中，测试运行速度非常快。然而，并非所有内容都能被模拟。例如，截取屏幕截图不是浏览器的行为，因此无法模拟。还有几种类似的实现无法实现。\n\
  \n你可以在此处了解更多关于 jsdom 的信息：[`github.com/jsdom/jsdom`](https://github.com/jsdom/jsdom)\n\
  \n# Karma\n\nKarma 托管一个测试服务器。该测试服务器将有一个特殊的网页，用于在页面环境中运行你的测试。该页面可以在多种浏览器和模拟浏览器环境（如`jsdom`）中进行测试。\n\
  \n你可以在此处查看 Karma：[`karma-runner.github.io/2.0/index.html`](https://karma-runner.github.io/2.0/index.html)\n\
  \n# Chai\n\nChai 是最流行的测试断言库之一。断言库是指你为特定变量或值编写期望，然后根据接收到的值测试该期望。它有许多插件和扩展。\n\n你可以在此处查看\
  \ Chai：[`github.com/chaijs/chai`](https://github.com/chaijs/chai)\n\n# Cucumber\n\
  \nCucumber 专注于 BDD 开发风格。它使用 Gherkin 语法（一种业务可读的领域特定语言）将测试分为验收标准文件和与之对应的测试。测试可以用多种语言编写，包括\
  \ JavaScript。\n\n你可以在此处了解更多关于 Cucumber 的信息：[`github.com/cucumber/cucumber-js`](https://github.com/cucumber/cucumber-js)\n\
  \n# Jest\n\nJest 是一个非常流行的测试框架，由*Facebook*创建并维护。它是开发人员使用的最流行的库框架之一。它被认为对大型项目更快。它清晰、一致，并附带许多功能，如断言、模拟和间谍。它还提供代码覆盖率，并且只更新已更改的文件，因此测试运行速度相对更快。React\
  \ 框架也建议使用*Jest*框架。\n\n你可以在此处查看 Jest：[`jestjs.io/`](https://jestjs.io/)\n\n# Jasmine\n\
  \nJasmine 是 Jest 所基于的测试框架。Jasmine 框架是一个遗留框架，已经存在了更长时间。它是一个即用型框架，可以帮助你快速启动测试。事实上，Angular\
  \ 框架建议使用 Jasmine 框架。\n\n你可以在此处查看 Jasmine：[`github.com/jasmine/jasmine`](https://github.com/jasmine/jasmine)\n\
  \n# Mocha\n\n同样，Mocha 是最常用的库之一。与*Jasmine*不同，它需要与第三方断言、模拟和间谍库一起使用。*Mocha*设置起来稍微困难一些，但它更灵活，对扩展开放。\n\
  \n你可以在此处查看 Mocha：[`github.com/mochajs/mocha`](https://github.com/mochajs/mocha)\n\
  \n# Selenium\n\nSelenium 多年来一直主导着功能测试市场。它可以用于在多个浏览器上测试你的应用程序。它并非专门为测试而编写，而是通过暴露一个驱动程序来控制浏览器，该驱动程序使用浏览器扩展来控制浏览器，可用于多种目的。\n\
  \n你可以在此处查看 Selenium：[`github.com/SeleniumHQ/selenium`](https://github.com/SeleniumHQ/selenium)\n\
  \n# Jest\n\n\n\n\n\n正如我们之前所学，`Jest` 是一个流行的测试框架，由社交媒体巨头 Facebook 公司创建并维护。除了多项突出特性外，Jest\
  \ 专注于简洁性。它可与 `Angular` 和 `React` 等框架配合使用。事实上，ReactJS 官方文档推荐使用 Jest 来测试基于 React 框架构建的应用程序。\n\
  \n在本章中，我们将了解 Jest 框架的相关知识。我们将创建一个简单的 JavaScript 示例，以理解如何使用 Jest 框架进行测试。\n\n要在你的\
  \ Web 应用程序中使用 Jest，你需要在本地机器上安装以下两种依赖之一：`npm` 或 `yarn`。在了解 `npm` 或 `yarn` 之前，我们需要先了解\
  \ Node。Node.js 是一个开源的 JavaScript 运行时环境，可以在浏览器之外运行 JavaScript 代码。\n\n现在，npm 是 JavaScript\
  \ 编程语言的包管理器。npm 注册表包含多个包（例如 `Jest`），这些包本身要么是 Node 模块，要么包含 Node 模块。基本上，Node 模块是可以通过\
  \ Node 平台使用 `require()` 方法加载的文件。\n\n`yarn` 也是一个包管理器，由 Facebook 开发。它执行与 npm 类似的功能。\n\
  \n因此，要使用 Jest 框架测试我们的应用程序，我们只需使用 npm 在我们的应用程序中安装 Jest 框架即可。那么，让我们从以下步骤开始：\n\n# 安装包管理器\n\
  \n要使用 npm 或 yarn，首先需要在你的机器上安装它们。\n\n要安装 npm，请访问：[`www.npmjs.com/get-npm`](https://www.npmjs.com/get-npm)\n\
  \n要安装 yarn，请访问：[`www.npmjs.com/package/yarn`](https://www.npmjs.com/package/yarn)\n\
  \n# 初始化一个新项目\n\n接下来，我们需要使用 npm 初始化一个项目。为此，我们首先应确定要在哪个位置创建项目。在我们的例子中，我在桌面上创建了一个名为\
  \ Testing 的文件夹。在这里，我将初始化我们的项目。\n\n要初始化项目，我们需要使用以下命令：\n\n```\nnpm init\n```\n\n**代码\
  \ 13.1：** 初始化项目\n\n当你输入上述命令时，终端会弹出多个提示，要求你填写项目的详细信息。如果你在每个提示后按 *Enter* 键暂时留空这些详细信息，也完全没问题。当你完成所有详细信息的填写后，你的终端将如下所示：\n\
  \n![](img/Figure-13.3.jpg)\n\n**图 13.3：** 初始化项目时的终端\n\n完成上述过程后，你会注意到在文件夹中创建了一个名为\
  \ `package.json` 的新文件。其中将包含你在终端中添加的详细信息：\n\n```\n{\n  \"name\": \"testing\",\n \
  \ \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n\
  \  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit\
  \ 1\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n**代码 13.2：**\
  \ package.json 文件\n\n# 使用 npm 或 yarn 安装 Jest\n\n现在，我们需要在我们的项目中安装 Jest。回到终端，我们需要进入项目文件夹，并添加以下代码：\n\
  \n```\nnpm install --save-dev jest\n```\n\n**代码 13.3：** 使用 npm 安装 Jest\n\n对于 yarn，我们需要使用以下命令：\n\
  \n```\nyarn add --dev jest\n```\n\n**代码 13.4：** 使用 yarn 安装 Jest\n\n在 *代码示例 13.3*\
  \ 中，我们使用了 `save-dev`。这会将 Jest 安装为开发依赖项。这意味着 Jest 仅在开发期间使用，而不会在生产期间（即用户使用应用程序时）使用。相反，如果我们使用\
  \ `--save`，则会将其保存为依赖项，这意味着 Jest 将在开发和生产期间都使用。由于我们只需要在开发期间测试应用程序，当然不需要在用户实际使用时测试，因此我们将\
  \ Jest 保存为开发依赖项。\n\n# 创建一个用于测试的函数\n\n现在，我们需要创建一个要用 Jest 测试的函数。我将创建一个简单的加法函数。为此，我们将在文件夹中创建一个名为\
  \ `index.js` 的新文件。在 `index.js` 中，我们将编写加法函数如下：\n\n```\nconst add = (num1, num2) =>\
  \ num1 + num2;\n\nmodule.exports = add;\n```\n\n**代码 13.5：** index.js 中的加法函数\n\n\
  在 *代码示例 13.5* 中，我们使用 ES6 箭头函数创建了一个函数 `add`。我们还添加了一行代码来导出我们的函数 `add`。这将确保函数 `add`\
  \ 对项目中的所有其他文件可用。\n\n# 创建测试文件\n\n接下来，我们创建测试文件。首先，我们需要创建一个与存储函数的文件同名的文件。我们需要为文件添加一个额外的扩展名。我们将测试文件命名为\
  \ `index.test.js`。在 `index.test.js` 中，我们将编写以下代码：\n\n```\nconst add = require('./index');\n\
  \ntest('Adding 2 and 3 should be equal to 5', () => {\n     expect(add(2, 3)).toBe(5);\n\
  })\n```\n\n**代码 13.6：** 为加法创建测试文件\n\n在 *代码示例 13.6* 中，我们完成了以下操作：\n\n*   在第一行，我们导入了\
  \ `index.js` 文件。\n\n*   接下来，我们在 Jest 的 `test` 方法中添加了测试代码或条件。它接受两个参数——一个用于标识测试的语句和一个回调函数。\n\
  \n*   在回调函数内部，我们使用了 `expect` 方法。如果你仔细观察，在 `expect` 方法内部，我们调用了 `add` 函数，并将值 2 和 3\
  \ 作为参数传入。根据其英文定义，`expect` 方法表示该函数调用接收到的值将与某个值进行测试。\n\n*   在 `expect` 方法外部，我们使用了一个\
  \ Jest“匹配器”来验证我们的测试。换句话说，匹配器是对 `expect` 方法内部调用的函数的期望或预期答案。在我们的例子中，我们使用了匹配器 `toBe`。`toBe`\
  \ 匹配器用于比较原始值。这里，我们期望结果为 5，因此我们在 `toBe` 匹配器的括号内添加了 5。\n\n总的来说，我们告诉 Jest，`add` 函数执行返回的值预期为\
  \ 5。\n\n# 添加/修改 package.json\n\n在这一步中，我们将添加或修改 `package.json` 文件，以包含一个用于测试的命令。我们将把引号内的内容\
  \ \"`echo \\\"Error: no test specified\\\" && exit 1`\" 替换为单个单词 \"`jest`\"。调用此命令将运行我们的测试。更新后的\
  \ `package.json` 文件将如下所示：\n\n```\n{\n  \"name\": \"testing\",\n  \"version\": \"\
  1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n\
  \    \"test\": \"jest\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"\
  devDependencies\": {\n    \"jest\": \"²⁶.6.3\"\n  }\n}\n```\n\n**代码 13.7：** 修改 package.json\
  \ 文件以进行测试\n\n你会注意到，由于我们之前在命令中使用了 `save-dev`，因此 jest 包已保存在 `devDependencies` 中。这意味着它仅作为开发期间的依赖项存储。\n\
  \n# 运行测试\n\n最后，我们将运行测试。为此，我们将进入终端，并导航到项目所在的文件夹。在这里，我们将输入 `npm run test`。此命令中的 test\
  \ 指的是 `package.json` 的 scripts 对象中的 test 单词。在 `package.json` 的 test 关键字内部，我们有命令\
  \ `jest`。因此，输入该命令后，npm 将运行存储在 test 内部的命令，即 `jest`。当我们这样做时，终端将显示以下内容：\n\n![](img/Figure-13.4.jpg)\n\
  \n**图 13.4：** 运行测试时的终端\n\n\n\n\n\n正如你在前面的截图中所见，我们的测试运行成功，并得到了输出结果 5。为了检查测试函数是否确实正常工作，让我们尝试让这个测试失败。\n\
  \n在我们的 `index.test.js` 中，我们将添加一个额外的条件：\n\n1.  `test('Adding 1 and 4 should not be\
  \ equal to 6', () => {`\n2.  `    expect(add(1, 4)).toBe(6);`\n3.  `})`\n\n**代码\
  \ 13.8：** 添加一个条件使其失败\n\n当我们保存上述代码并运行测试时，我们将看到以下内容：\n\n![](img/Figure-13.5.jpg)\n\
  \n**图 13.5：** 终端显示一个测试通过，一个测试失败\n\n如上图所示，第一个测试通过，而第二个测试失败。\n\n通过这种方式，我们可以使用几种不同的匹配器来测试代码的不同部分。有关匹配器的完整列表，请参考以下链接：**[`jestjs.io/docs/en/expect`](https://jestjs.io/docs/en/expect)**。\n\
  \n### 结论\n\n在本章中，我们学习了避免代码错误的几种技巧。我们可以通过使用 JavaScript 测试模块来实现这一点。本章首先介绍了测试驱动开发（TDD）和行为驱动开发（BDD）之间的区别。接着，我们了解了重要的测试类型以及测试\
  \ JavaScript 应用的理想结构。然后，我们探索了几种测试框架，并最终实现了最流行的 JavaScript 测试框架之一——Jest。\n\n总之，我们了解了测试的重要性以及如何为\
  \ JavaScript 应用实现测试。在下一章中，我们将学习 JavaScript 中的*正则表达式*。它提供了一个很好的框架来在 JavaScript 中搜索单词。\n\
  \n### 要点\n\n*   没有测试的应用可能会将错误暴露给用户。根据错误的严重程度，应用可能会崩溃，这会导致用户离开并停止使用你的应用。\n*   测试驱动开发强调在编写实际代码之前先编写测试。这将确保你遵守严格的规则，从而减少系统中的错误。\n\
  *   行为驱动开发强调编写测试代码行为或功能的代码。它不强调严格的规则。\n*   理想的测试结构并不意味着 100% 的测试覆盖率。相反，它侧重于在应用的关键部分进行有效的单元测试（测试单个最小组件）。除了单元测试之外，还应在应用的关键部分进行若干集成测试，最后进行平台的端到端测试。\n\
  *   针对不同的用例，有多种测试框架。然而，Jest 因其简单性而被广泛使用。\n\n### 选择题\n\n1.  **如果我们使用 –save 而不是 –save-dev，它将仅将依赖项存储为运行时依赖项——正确还是错误？**\n\
  \    1.  正确\n    2.  错误\n2.  **_____ 测试涉及检查各个组件是否能够协同工作。**\n    1.  单元\n    2. \
  \ 集成\n    3.  端到端\n\n### 答案\n\n1.  **b**\n2.  **b**\n\n# 第 14 章\n\n## 正则表达式\n\n\
  在前面的章节中，我们学习了大量关于 JavaScript 及其实现的知识。最后，我们来到了本书的结尾。从本章开始，在接下来的两章中，我们将学习一些辅助概念，这些概念将帮助你编写更好的\
  \ JavaScript。在本章中，我们将学习正则表达式的概念。正则表达式广泛用于匹配字符串中的字符组合。\n\n让我们通过以下实际示例来理解它：\n\n每个电子邮件地址必须包含一个\
  \ \"@\" 符号和一个 \".\"。假设我们有一个应用，要求用户提供有效的电子邮件 ID 以便进行通信或发送重置密码的链接。如果你选择不使用 input type=email，那么确保电子邮件地址在适当位置包含上述两个符号就至关重要。此外，如果我们打算要求用户提供他们的\
  \ Gmail ID，我们还需要确认 \"*@*\" 和 \".\" 之间的文本是 \"*gmail*\"。对于此类场景以及其他许多类似场景，我们需要高级方法来检查字符串。这正是正则表达式极其有用的地方之一。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   正则表达式简介\n*   编写正则表达式模式\n*   使用标志进行高级搜索\n*   用于正则表达式的\
  \ JavaScript 方法\n*   正则表达式的实际示例\n\n### 目标\n\n学习本章后，你应该能够理解正则表达式的概念，并学会如何在 JavaScript\
  \ 中使用正则表达式进行模式匹配。\n\n# 正则表达式简介\n\n简单来说，正则表达式是一个定义搜索模式的字符序列。当我们需要在字符串中搜索字符序列时，可以使用正则表达式创建的模式。\n\
  \n多种编程语言以不同格式使用正则表达式来通过模式搜索字符。在 JavaScript 中，我们可以使用正则表达式的字面量格式，或者通过调用 `RegExp` JavaScript\
  \ 对象来使用正则表达式。\n\n# 创建正则表达式\n\n如前所述，你可以通过以下两种方式之一构造正则表达式：\n\n# 正则表达式字面量\n\n要编写正则表达式字面量，我们需要在斜杠内编写搜索模式：\n\
  \n`let pattern = /abc/;`\n\n**代码 14.1：** 一个正则表达式字面量\n\n在*代码示例 14.1* 中，我们使用了带斜杠的正则表达式字面量。我们将在本章后面更详细地介绍正则表达式字面量。目前，*代码示例\
  \ 14.1* 表示我们将在任何字符串中按精确顺序搜索模式 \"*abc*\"。\n\n# JavaScript RegExp 对象\n\n或者，你可以使用 JavaScript\
  \ 对象 `RegExp` 来创建搜索模式。*代码示例 14.1* 中显示的代码可以使用 `RegExp` 对象重写如下：\n\n`let pattern =\
  \ new RegExp('abc');`\n\n**代码 14.2：** 一个正则表达式 JavaScript 对象\n\n*代码示例 14.1* 和 *14.2*\
  \ 都创建了一个模式并将其存储在变量 `pattern` 中。\n\n# 编写正则表达式模式\n\n正则表达式模式由简单字符组成。根据搜索模式的复杂程度，有三种编写正则表达式模式的方法。需要注意的一点是，正则表达式区分大小写，即\
  \ \"*A*\" 与 \"*a*\" 不同。在大多数情况下，你会混合使用这三种模式来搜索或替换字符串中的文本。\n\n# 使用简单模式\n\n当你想要在字符串中直接匹配一个字符序列时，可以使用简单模式。我们已经在*代码示例\
  \ 14.1* 中看到了一个简单模式的示例。当我们需要搜索一个精确的字符序列（即所有字符按相同顺序排列在一起）时，会使用简单模式。简单模式的一个好例子如下：\n\
  \n![](img/Figure-14.1.jpg)\n\n**图 14.1：** 简单模式搜索的示例\n\n\n\n\n在前面的截图中，我们使用正则表达式字面量定义了一个简单的搜索模式。接着，我们使用了\
  \ JavaScript `String` 对象的 `search` 方法，在字符串变量 `str1` 和 `str2` 中搜索该模式。从 `console.log`\
  \ 语句可以看出，我们成功获取了值 12，它表示模式 `apples` 在变量 `str1` 中的起始位置。然而，对于第二个字符串变量 `str2`，它返回了\
  \ -1，这意味着在 `str2` 中找不到模式 `apples`。如果仔细查看 `str2`，你会发现 `str2` 也包含按相同顺序排列的 a-p-p-l-e-s，但最后一个字符\
  \ s 与前五个字符之间有一个空格。在简单模式中，空格不会被忽略，因此在 `str2` 中搜索该模式会返回 -1。\n\n**注意：** 正则表达式本身拥有大量可供搜索的模式。为清晰起见，从下一个子主题开始，我们只关注最常用的流行模式。如需查看完整模式列表，可查阅官方\
  \ MDN 文档。\n\n# 使用分组和范围\n\n有时你可能需要搜索或替换某个分组或某个范围内的字符。例如，你可能想搜索一个文本中包含单词 `green` 或\
  \ `red` 的模式。另一种情况是，你想搜索一个字符串，其中的字符可以是 a、b、c 或 * 中的任意一个。这类情况可以通过正则表达式中的分组来处理。让我们看看不同类型的分组正则表达式模式。\n\
  \n# x|y\n\n这里，x 和 y 代表任意字符串，而管道符号 (|) 表示“或”。这意味着如果我们想搜索一个文本是 x 或 y 的模式，可以在正则表达式中使用这个运算符。如下面的截图所示，`search`\
  \ 方法仅对包含单词 `blue` 或 `gold` 的字符串返回非 -1 的值：\n\n![](img/Figure-14.2.jpg)\n\n**图 14.2：**\
  \ | 的示例\n\n**注意：** 在接下来的两节中，你可以使用由“或”分隔的两种格式中的任意一种。“或”仅作为分隔符，并非语法的一部分。由“或”分隔的两种格式各自是独立的语法。\n\
  \n# [[xyz] 或 [x-z]](#toc.xhtml_s322a)\n\n当你想要创建一个搜索模式，从选定的几个字符（包括特殊字符）中搜索任意一个字符，或者从某个字符范围内搜索任意一个字符时，可以使用上述两种模式。如*图\
  \ 14.3* 所示，我们使用了第一种模式，让 JavaScript 搜索并返回 a、-、b、f、z 中任意一个字符的位置。如果你查看第二个 `console.log`\
  \ 语句，会发现单词 `Candidate-3` 同时包含 a 和连字符 (-)。但由于我们在连字符之前先遇到了 a，因此返回的是 a 的位置。类似地，在第二个和第三个示例中，你可以看到，如果我们想创建一个模式，要求字符串包含\
  \ 0 到 5 之间的任意一个数字，可以使用 `[012345]` 或 `[0-5]`。\n\n![](img/Figure-14.3.jpg)\n\n**图\
  \ 14.3：** 分组的示例\n\n# [[^xyz] 或 [^x-z]](#toc.xhtml_s323a)\n\n这与我们之前看到的模式类似，但有一个显著区别。在这种情况下，它会匹配方括号内未包含的所有内容。\n\
  \n# 使用特殊字符\n\n当搜索匹配需要比精确匹配或直接匹配更复杂的条件时，我们会使用特殊字符。例如，如果你想查找一个或多个 a，或者想匹配一个模式，其中字符\
  \ H 后面跟着一个或多个 i，就需要使用特殊字符。根据使用位置和方式的不同，特殊字符分为几类。让我们逐一了解。\n\n# 断言\n\n断言包括边界，即指示行和单词的开始与结束。它还包括条件表达式。\n\
  \n# ^\n\n它表示输入的开始。即字符串的第一个字符。正如我们在上一节中看到的，当与分组一起使用时，它有不同的表示法。\n\n![](img/Figure-14.4.jpg)\n\
  \n**图 14.4：** ^ 的示例\n\n# $\n\n它表示输入的结束。即字符串的最后一个字符。如下面的截图所示，第一个 `console.log` 返回了非\
  \ -1 的值，因为它以 y 结尾。\n\n![](img/Figure-14.5.jpg)\n\n**图 14.5：** $ 的示例\n\n# \\b\n\n\
  它用于表示单词边界。它表示一个位置，在该位置，一个单词字符后面或前面没有另一个单词字符，例如字母和空格之间。例如，`/\\ba/` 会匹配 \"apple\"\
  \ 中的 \"a\"。它也会匹配 \"apple\" 中的 `/le\\b/`，因为在 \"apple\" 中 \"le\" 后面没有单词字符。然而，`/le\\\
  b/` 不会匹配 \"left\" 中的 \"le\"，因为 \"le\" 后面跟着 f。\n\n# x(?=y)\n\n# (?<=y)x\n\n上述组合分别称为*先行断言*和*后行断言*。如前所述，你可以将\
  \ x 和 y 替换为任意字符串。如果仔细观察，你会发现第一种情况 `x(?=y)` 只有在 x 后面找到 y 时才会返回正匹配，换句话说，y 跟在 x 后面。类似地，第二种情况\
  \ `(?<=y)x` 只有在 y 位于 x 之前时才会返回正匹配。你可以在下面的示例中看到这一点：\n\n![](img/Figure-14.6.jpg)\n\
  \n**图 14.6：** 后行断言和先行断言的示例\n\n# 字符类\n\n这是最常用且最重要的正则表达式类型之一。它帮助你区分字母、数字和特殊字符。我们将在本章末尾查看所有字符类的综合示例。\n\
  \n*   `\\d`：匹配字符串中的任何数字。等价于我们之前看到的组 `[0-9]`。\n*   `\\D`：匹配字符串中除数字以外的任何内容。等价于组 `[⁰-9]`。\n\
  *   `\\w`：匹配基本拉丁字母表中的任何字母数字字符，包括字符串中的下划线。等价于 `[A-Za-z0-9_]`。\n*   `\\W`：匹配字符串中除基本字母表中的字母数字字符以外的所有内容。等价于\
  \ `[^A-Za-z0-9_]`。\n*   `\\s`：匹配单个空白字符，包括空格、制表符、换页符或换行符。\n*   `\\t`：匹配水平制表符。\n*\
  \   `\\`：用于转义字符。例如，如果你想创建一个模式来匹配反斜杠，不能直接使用 `\\`。要搜索反斜杠，需要使用 `\\\\`，以便 JavaScript\
  \ 理解它是一个反斜杠。这同样适用于其他字符，例如我们将在下一节中看到的 `*`。\n\n结合我们目前学到的原理，我们在下面的截图中展示了它们：\n\n![](img/Figure-14.7.jpg)\n\
  \n**图 14.7：** 字符类的示例\n\n在上面的截图中，我们使用了另一种 JavaScript 方法 `match`。它的作用与 `search` 相同，即根据模式搜索字符串。但它不返回字符串的位置，而是返回一个数组对象。与\
  \ `search` 不同，如果找不到匹配项，它会返回 `null`。\n\n在*图 14.7* 中，如你所见，对于第一条语句，我们在语句中搜索一个数字，它被正确返回。类似地，在第三条语句中，我们再次查找一个数字，但由于找不到任何数字，它返回了\
  \ `null`。在第二条语句中，我们结合了几个原理。\n\n*   首先，我们使用 `^` 断言来确保 `^` 后面的字符是字符串输入的第一个字符。\n\n\n\
  \n接下来，我们使用了之前学过的方括号分组。它表示应存在 `a` 或 `A`。结合前面的要点，这意味着要匹配的字符串必须以 `a` 或 `A` 开头。\n\n\
  之后，我们使用了 `\\s` 字符类来表示第一个单词后应存在一个空格。\n\n然后，我们使用了夹在两个 `\\b` 之间的 `\\d`。正如我们之前和本节所学，`\\\
  ` 用于转义，而 `\\b` 表示单词边界。这意味着我们应该有一个数字，其两端都有空格。\n\n因此，我们能够相应地匹配该模式。\n\n# 量词\n\n它用于指示要匹配的字符或表达式的数量。我们将查看以下几种量词类型。和往常一样，以下示例中的\
  \ `x` 可以被任何字符串替换。我们将在本章末尾看一个综合示例。\n\n- `x*`：表示应匹配由 `x` 表示的项 0 次或多次。例如，`/lo*/` 匹配\
  \ \"Helooo\" 中的 \"looo\"。类似地，`/e*/` 匹配 \"Hey\" 中的 \"e\"，但在 \"Hola\" 中不会返回任何内容。\n\
  - `x+`：表示应匹配由 `x` 表示的项 1 次或多次。例如，`/a+/` 匹配 \"Ha!\" 中的 \"a\" 以及 \"Haaaaaaaa!\" 中的所有\
  \ a，但在 \"Byeee\" 中会返回 null。\n- `x?`：表示应匹配由 `x` 表示的项 0 次或 1 次。例如，`/e?l/` 匹配 \"Angel\"\
  \ 中的 \"le\"，而 `/le?/` 匹配 \"Angel\" 中的 \"l\"。\n- `x{n}`：表示应精确匹配前一项 `x` 的 `n` 次出现。例如，对于\
  \ `/l{2}/` 匹配 \"Hello\"，会返回 \"ll\"，但对于 `/l{3}/` 匹配则会返回 null。\n- `x{n,}`：表示应至少匹配前一项\
  \ `x` 的 `n` 次出现。例如，对于 `/l{2,}/` 匹配 \"Hello\"，会返回 \"ll\"，但对于 \"Halo\" 则会返回 null。\n\
  - `x{n, m}`：表示应至少匹配 `n` 次且至多匹配 `m` 次前一项 `x`。例如，对于 `/l{2, 4}/` 匹配 \"Hello\"，会返回 \"\
  ll\"，但对于 \"Helllllo\" 则会返回 null。\n\n让我们看看量词的示例。在图 14.8 中，对于前两个语句，我们得到 \"taaaaaaaa\"\
  ，即所有的 a，因为第一个匹配要求零个或多个 a，第二个要求一个或多个 a。然而，在第三个匹配中，我们只得到一个 a，因为我们要求匹配 0 或 1 个 a。\n\
  \n对于接下来的三个 `console.log` 语句，我们首先使用 `\\b` 设置了一个边界。在第四个 `console.log` 语句中，在边界内，我们要求匹配任何恰好出现三个字符的单词。如果你查看变量语句，你会注意到第一个三个字符的单词是\
  \ \"the\"，因此返回了 \"the\"。在第五个语句中，我们寻找出现三个或更多字符的单词。我们发现第一个单词 \"this\" 本身就符合。最后，在第六个语句中，我们寻找字符数在\
  \ 1 到 3 之间的单词。因此，我们得到了第二个单词 \"is\"。\n\n![](img/Figure-14.8.jpg)\n\n**图 14.8：** 量词示例\n\
  \n# 使用标志进行高级搜索\n\n到目前为止，在本章中，我们观察到了以下两点：\n\n- 搜索是区分大小写的，也就是说，如果我搜索 \"apple\"，而需要搜索的字符串中有\
  \ \"Apple\"，则会返回 null。\n- 搜索只返回第一个匹配项。\n\n我们可以借助标志来覆盖这种行为。标志添加在正则表达式的末尾，即最后一个斜杠（`/`）之后。你可以同时添加多个标志。\n\
  \n正则表达式提供了六个标志。然而，我们只会看前三个，因为相比之下你会更频繁地使用它们。\n\n# g\n\n`g` 代表全局搜索。它会返回所有匹配项。例如，在下面的截图中，当我们为匹配模式\
  \ \"is\" 添加 `g` 标志时，我们得到了三个 \"is\"。除了两个明显的 \"is\" 之外，它还捕获了 \"This\" 中的 \"is\"：\n\
  \n![](img/Figure-14.9.jpg)\n\n**图 14.9：** `g` 的示例\n\n# i\n\n`i` 代表不区分大小写的搜索。它会返回单词的第一个匹配项，无论其大小写如何。例如，在下面的截图中，当我们为匹配模式\
  \ \"she\" 添加 `i` 标志时，我们得到了第一个 \"She\"，而不是另一个：\n\n![](img/Figure-14.10.jpg)\n\n**图\
  \ 14.10：** `i` 的示例\n\n# m\n\n`m` 代表多行搜索。它会返回单词的第一个匹配项，无论其大小写如何。\n\n![](img/Figure-14.11.jpg)\n\
  \n**图 14.11：** `m` 的示例\n\n如前所述，`m` 和 `i` 标志的缺点在于它们区分大小写且只返回第一个匹配项。为了克服这一点，我们可以组合这三个标志来执行不区分大小写、多行的搜索，并返回所有匹配项：\n\
  \n![](img/Figure-14.12.jpg)\n\n**图 14.12：** `gim` 的示例\n\n# 用于正则表达式的 JavaScript 方法\n\
  \n在前几节中，我们检查了两种可用于处理正则表达式的 JavaScript 方法。现在，我们将再看几个 JavaScript 方法：\n\n# exec()\n\
  \n`exec()` 方法属于我们之前在本章中看到的 `RegExp` 对象。它执行与 `match()` 相同的功能。不过，在这里，我们将要检查的字符串作为参数传递给\
  \ `exec()` 方法：\n\n![](img/Figure-14.13.jpg)\n\n**图 14.13：** `exec()` 的示例\n\n# test()\n\
  \n`test()` 方法也属于 `RegExp` 对象。它根据搜索结果返回 `true` 或 `false`：\n\n![](img/Figure-14.14.jpg)\n\
  \n**图 14.14：** `test()` 的示例\n\n# matchAll()\n\n`matchAll()` 方法与 `match()` 类似。`match()`\
  \ 只返回第一个匹配的值，而 `matchAll()` 返回一个包含所有匹配值的 `RegExp` 字符串迭代器数组：\n\n![](img/Figure-14.15.jpg)\n\
  \n**图 14.15：** `matchAll()` 的示例\n\n# replace()\n\n`replace()` 方法搜索一个字符串，并用第二个参数提供的值替换它。它返回一个包含替换值的新字符串：\n\
  \n![](img/Figure-14.16.jpg)\n\n**图 14.16：** `replace()` 的示例\n\n# replaceAll()\n\n\
  `replaceAll()` 方法搜索字符串中所有正则表达式的匹配项，并用第二个参数提供的值替换所有匹配项，忽略语法错误：\n\n![](img/Figure-14.17.jpg)\n\
  \n**图 14.17：** `replaceAll()` 的示例\n\n# 正则表达式的实际示例\n\n现在我们对正则表达式有了相当的理解，让我们看看正则表达式最常见的示例。在这个示例中，我们将使用正则表达式来验证电子邮件地址。\n\
  \n一个有效的电子邮件地址（例如 `abc23@gmail.com`）必须在文本中包含一个必需的 \"@\" 和一个句点（\".\"）。\"@\" 符号应位于\
  \ \".\" 之前，并且这两个符号之间应有某些文本。类似地，\"@\" 符号之前和 \".\" 符号之后也应有某些文本。让我们将其转化为正则表达式：\n\n\
  1. 电子邮件地址的开头可以包含不区分大小写的字符、数字、下划线（\"_\"）、加号（\"+\"）、句点（\".\"）和连字符。当我们使用方括号将其分组时，它表示单个字符。我们需要确保该组有一个或多个字符。我们可以使用\
  \ \"+\" 量词来实现这一点。让我们将其可视化如下：\n\n```\nlet emailRegEx = /^[a-zA-Z0-9+_.-]+/;\n```\n\
  \n**代码 14.3：** 用于检查文本开头的正则表达式\n\n\n\n\n\n2.  接下来，我们需要确保在 *代码示例 14.3* 的末尾添加“@”符号。这将确保文本中始终有一个“@”符号：\n\
  \n    `let emailRegEx = /^[a-zA-Z0-9+_.-]+@/;`\n\n    **代码 14.4：** 用于检查 @ 的正则表达式\n\
  \n3.  现在，我们需要确保有多个字符且不含任何特殊字符。我们可以通过添加一个包含数字和字母的组，并使用“+”量词来实现：\n\n    `let emailRegEx\
  \ = /^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9]+/;`\n\n    **代码 14.5：** 用于检查 @ 后文本的正则表达式\n\n\
  4.  接下来，我们需要确保在 *代码示例 14.5* 的末尾有一个句点符号。我们可以通过包含句点符号并使用“\\”转义来添加：\n\n    `let emailRegEx\
  \ = /^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9]+\\./;`\n\n    **代码 14.6：** 用于检查句点的正则表达式\n\n5.\
  \  最后，我们需要确保句点符号后的文本应包含一个或多个字母：\n\n    `let emailRegEx = /^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9]+\\\
  .[a-zA-Z]+/;`\n\n    **代码 14.7：** 用于检查句点后文本的正则表达式\n\n现在我们已经有了正则表达式，让我们测试一下：\n\n\
  ![](img/Figure-14.18.jpg)\n\n**图 14.18：** 测试电子邮件的有效性\n\n### 结论\n\n在本章中，我们学习了一个辅助概念——*正则表达式*。正则表达式用于在字符串中搜索模式。它非常常用于搜索，例如，一个人的银行账号或社会安全号码中的各种银行和账户相关信息。本章开始时，我们了解到有两种使用正则表达式的方式。之后，我们学习了创建搜索模式的几种风格，包括简单和复杂的。最后，我们通过探索利用正则表达式的\
  \ JavaScript 方法结束了本章。在下一章（本书的倒数第二章）中，我们将了解为后代发布的 JavaScript 的各种版本。我们将理解 ES7-ES10\
  \ 带来的新特性。\n\n### 要点记忆\n\n*   正则表达式是定义搜索模式的字符序列。它特别用于在字符串中查找部分内容。\n\n*   你可以使用方括号（`[]`）将搜索限制到特定的字符集。\n\
  \n*   `^` 表示字符串的开始，`$` 表示字符串的结束，而 `\\b` 用于为搜索模式添加单词边界。\n\n*   `\\d` 表示所有数字，`\\w`\
  \ 表示字母数字字符（包括数字和下划线），`\\s` 表示空格。\n\n*   在量词中，`*` 表示零次或多次出现，`+` 表示一次或多次出现，`?` 表示零次或一次出现。如果你想固定出现次数，可以使用\
  \ `{}` 来指定。\n\n*   标志 `g` 表示所有匹配实例，标志 `i` 表示不区分大小写的搜索，而标志 `m` 表示多行搜索。\n\n*   最后，JavaScript\
  \ 方法如 `match()`、`exec()` 和 `search()` 帮助查找搜索模式的位置，`replace()` 在字符串中搜索并替换搜索模式的文本，`test()`\
  \ 返回模式是否存在于字符串中。\n\n### 多项选择题\n\n1.  哪个标志用于不区分大小写的搜索结果？\n\n    1.  `g`\n\n    2.\
  \  `i`\n\n    3.  `m`\n\n2.  `+` 量词的作用是什么？\n\n    1.  它表示匹配一个或多个字符。\n\n    2.  它表示匹配零个或多个字符。\n\
  \n    3.  它表示匹配零个或一个字符。\n\n### 答案\n\n1.  **b**\n\n2.  **c**\n\n# 第 15 章：ES6 之后的生活\n\
  \n在本书的第一章中，我们阅读了关于 JavaScript 早期历史的简短信息。我们了解了从脚本起源到 ES6（2015 年发布的版本）的历程。正如我们在本书中所看到的，大多数现代浏览器和\
  \ UI 框架都积极支持并推荐 ES6。然而，JavaScript 的旅程并未止步于 ES6。负责 ECMAScript 标准化的 ECMA 国际（瑞士标准协会）每年都会发布一套新的规范，以跟上编程世界不断变化的趋势。在本章中，我们将了解\
  \ ES6 之后每年发布的新规范集。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   ECMAScript 简介\n\n*   ES7\n\
  \n*   ES8\n\n*   ES9\n\n*   ES10\n\n*   ES11\n\n*   ES.next\n\n### 目标\n\n学习本章后，你应该能够清楚地理解\
  \ JavaScript 的起源，以及它多年来是如何演变的，并探索和利用最新版本中发布的新规范。\n\n## ECMAScript 简介\n\n在本书的 *第\
  \ 1 章：JavaScript 简介* 中，我们简要了解了 JavaScript 在 Netscape 的起源。事实上，我们在本书中主要使用了 ES5 和 ES6。在本节中，我们将更深入地了解这门语言是如何随着时间演变的。\n\
  \n### 起源\n\n正如我们之前所读到的，当前的 JavaScript 语言规范基于多种起源技术。主要基于以下两种技术：\n\n由 *Brendan Eich*\
  \ 在 *Netscape* 为公司的 Navigator 2.0 浏览器发明的 Netscape 浏览器 JavaScript。\n\n微软的 JScript。\n\
  \n所有后续的 *Netscape Navigator 2.0* 和 *Microsoft Internet Explorer 3.0* 浏览器都开始使用这项技术。\n\
  \n### 浏览器战争\n\n当 Netscape 于 1995 年在其 *Navigator 2.0* 浏览器上发布最早的 JavaScript 版本时，它仅由\
  \ Netscape 在其浏览器上支持。\n\n1996 年，微软发布了其自己的脚本方言，称为 *JScript*。\n\n参与 JavaScript 开发的美国程序员\
  \ *Douglas Crockford* 提到，*微软不想与 Sun Microsystems（Netscape）就商标问题打交道，因此他们将实现称为 JScript，以避免商标问题。*\n\
  \n从技术上讲，*Netscape* 和 *Microsoft* 的实现即使不完全相同，也极为相似。然而，开发人员必须创建两种不同的代码实现来支持这两种浏览器，因为微软的版本无法在\
  \ Netscape 浏览器上运行，反之亦然。\n\n### 标准化\n\n随着瑞士标准协会 ECMA 国际的介入，浏览器战争宣告结束。*Netscape* 和\
  \ *Sun Microsystems*（最初拥有 JavaScript 商标的公司）联系了 ECMA 国际，要求维护 JavaScript 的规范，以便其他浏览器供应商能够实现它。ECMA\
  \ 国际创建了一个名为 *技术委员会 39*（通常称为 TC39）的社区来发展和维护这门语言。\n\n这个 TC39（在撰写本文时仍然存在，并负责发布新版本的\
  \ ECMAScript）于 1997 年 6 月发布了该规范的第一版，并将其命名为 ECMA-262，别名 ECMAScript。\n\n随着它的发布，包括\
  \ *JavaScript* 在内的多种语言采用了这些标准。\n\n### 那么，JavaScript 和 ECMAScript 是一样的吗？\n\n答案是否定的。ECMAScript\
  \ 是 JavaScript 所基于的标准。正如我们已经知道的，ECMA 于 1997 年 6 月发布了第一版。JavaScript 采用了 ECMAScript\
  \ 规范的标准。事实上，其他几种语言也实现了 ECMAScript，包括以下：\n\nActionScript（Flash 背后的脚本语言）。它正在失去人气，并于\
  \ 2020 年正式停止使用。\n\n\n\n\nJscript（微软的脚本方言）。微软采用了 Jscript 的 ECMAScript 规范，从而使所有浏览器都能保持统一标准。直到微软\
  \ Internet Explorer 9，微软一直支持 JScript，之后才停止使用。\n\n**注意：** 截至 2020 年撰写本文时，TC39 委员会包括\
  \ Mozilla、Google、Facebook、Apple、Microsoft、Intel、PayPal、Salesforce 等多家顶级公司，以及多位顶尖\
  \ Web 开发者和合作者。TC39 负责维护和发布 ECMAScript 的新标准。每个标准版本的提案在正式发布并应用于所有浏览器之前，都会经历多个阶段。\n\
  \n# 版本\n\nECMAScript 通常缩写为 ES。**ECMAScript 1**（**ES1**）是第一个版本，于 1997 年 6 月发布。一年后的\
  \ 1998 年，**ECMAScript 2**（**ES2**）发布，仅做了少量编辑性修改。1999 年 12 月发布的 ES3 引入了许多流行特性，如正则表达式、`try`/`catch`异常处理和数字格式化。大约在同一时期，万维网开始流行，借助这一成功，许多浏览器开始支持\
  \ ES3，ES3 也因此广为人知。\n\nES4 的工作于 2004 年初开始，被认为是一次重大升级。然而，由于某些原因，ES4 的工作完全停止了。大约在同一时期，出现了几个基于\
  \ JavaScript 的新工具库，如 jQuery、Prototype、AJAX 等。这促使 TC39 重新开始 ES4 的工作。但由于 TC39 内部多家公司之间的技术分歧，ES4\
  \ 最终被正式放弃。\n\n最终，在 1999 年之后的十年，ES5 于 2009 年 12 月发布。这是目前（截至 2020 年）所有浏览器完全支持的版本。它增加了多项增强功能，如\
  \ JSON 解析/序列化、`forEach`等数组方法以及`Object.keys`。它还允许使用`new`和`for`等保留字。最后，它引入了严格模式，使\
  \ JavaScript 成为一种更简洁的语言。\n\n# ES6——全新的未来！\n\n在广受欢迎的 ES5 发布六年后，ECMA 国际于 2015 年 6\
  \ 月发布了下一个版本 ES6。正如我们所看到的，ES6 发布了一系列令人兴奋的新特性，彻底改变了开发者使用 JavaScript 的方式。\n\n它包含以下特性：\n\
  \n* 块级作用域——`let`和`const`\n* 箭头函数\n* 类\n* 模板字面量\n* 解构\n* Promise\n* 模块等等\n\n鉴于历史原因，这次\
  \ TC39 委员会决定每年发布一次 ECMAScript。这意味着每年都会对前一版本进行某些修改和增强。基于此，他们决定将 ECMAScript 的第六版从\
  \ ES6 重命名为 ECMAScript2015。然而，由于标准已经确立，ES6 这个名称被广泛接受，因此这个版本通常被称为 ES6 而非 ES2015。\n\
  \n这就是我们目前所学的内容！\n\n# ES7\n\n按照新的年度发布节奏，ES7 于 2016 年发布。ES7 引入了以下两个新特性：\n\n# Array.prototype.includes()\n\
  \n该方法检查数组中是否存在某个值。它会检查数组中是否包含作为参数传入的值。如果数组包含该值，则返回`true`，否则返回`false`。\n\n以前，我们需要使用数组方法`indexOf`来检查数组中是否存在某个值，并判断`indexOf`返回的值是否不等于-1。现在，我们可以直接使用`includes`来检查是否存在：\n\
  \n![](img/Figure-15.1.jpg)\n\n**图 15.1：** `Array.prototype.includes()`示例\n\n# 指数运算符\n\
  \n我们在*第 1 章 JavaScript 简介*中看到的指数运算符在 ES7（ES2016）中正式引入。使用`**`表示的指数运算符，可以将一个数字提升到`**`符号后指定的幂次，如下面的截图所示：\n\
  \n![](img/Figure-15.2.jpg)\n\n**图 15.2：** 指数运算符示例\n\n# ES8\n\n2017 年夏季，下一个版本 ES8（即\
  \ ES2017）发布。包含的特性如下：\n\n# Object.values()\n\n我们可以使用`Object.values()`以数组形式返回对象的所有值，而无需遍历对象的每个元素：\n\
  \n![](img/Figure-15.3.jpg)\n\n**图 15.3：** `Object.values`示例\n\n# Object.entries()\n\
  \n该方法可以将对象转换为属性数组：\n\n![](img/Figure-15.4.jpg)\n\n**图 15.4：** `Object.entries`示例\n\
  \n# 字符串填充\n\n该方法用另一个字符串（如果需要可多次重复）填充当前字符串，直到结果字符串达到指定长度。你可以使用`padStart`方法在开头添加填充，或使用`padEnd`方法在末尾添加填充。\n\
  \n它接受两个参数。第一个必需参数指定目标长度，即添加填充值后结果字符串的长度。如果该参数的值小于原始字符串的长度，则原样返回原始字符串。第二个可选参数是要作为填充添加的字符串。\n\
  \n如图 15.5 所示，第一行我们对字符串\"Hey\"应用了`padStart(5)`。这意味着应用`padStart()`后结果字符串的总长度应为 5。由于我们没有添加任何可选的第二个参数，它会在开头添加两个空格，使总长度达到\
  \ 5。第二行中，由于我们指定的长度小于字符串的实际长度（3），因此字符串原样返回。第四行中，我们对字符串\"loading\"使用了`padEnd`方法。我们希望目标长度为\
  \ 10。这次我们添加了可选的第二个参数为'.'。因此，当最终字符串被填充时，它会在原始字符串的 7 个长度后添加三个点，形成\"loading…\"。\n\n\
  最后，我们用一个实际示例来尝试隐藏电话号码。我们截取原始号码只显示最后三位，并使用`padStart`在开头添加*，使总长度与原始号码相同。\n\n![](img/Figure-15.5.jpg)\n\
  \n**图 15.5：** 字符串填充示例\n\n# 异步函数（async 和 await）\n\n异步关键字`async`和`await`在 ES8 中引入。它简化了\
  \ JavaScript Promise 的使用。\n\n# 函数中的尾逗号\n\nES8 允许我们在声明末尾使用逗号，使其成为有效声明。例如，参数末尾带逗号的代码示例是有效的：\n\
  \n`const getName = (name, age,) => {…}`\n\n**代码 15.1：** 尾逗号示例\n\n# Object.getOwnPropertyDescriptors()\n\
  \n该方法返回一个对象，描述给定对象上特定属性的配置。它接受两个参数。第一个参数是对象的名称，第二个参数是对象的特定键。\n\n如下面的截图所示，我们在对象 nations\
  \ 上使用了`getOwnPropertyDescriptors()`。如你所见，如果不在第二个参数中指定值，它会返回所有键的属性描述符。\n\n![](img/Figure-15.6.jpg)\n\
  \n**图 15.6：** 属性描述符示例\n\n# ES9\n\nECMAScript 的第九版于 2018 年发布。在众多特性中，最重要的特性如下：\n\n\
  # Rest/Spread 属性\n\n我们在本书前面看到的用于数组的 rest/spread 属性是在 ES6 中发布的。而用于对象的 rest/spread\
  \ 属性在 ES9 中正式发布。\n\n# 正则表达式——前瞻和后顾\n\n\n\n\n\n我们在前一章中学到的先行断言“`?=`”和后行断言“`?<=`”也是在\
  \ ES9 中引入的。\n\n## 异步迭代\n\nES9 引入了 `for await…of` 循环，用于遍历异步和同步可迭代对象。与 `await` 关键字类似，它只能在\
  \ `async` 函数内部使用。它类似于原始的 `for…of` 循环，但用于 `async` 函数：\n\n```\n(async function() {\n\
  for await (let num of asyncObj) {\nconsole.log(num);\n}\n})();\n```\n\n**代码 15.2：**\
  \ 异步迭代示例\n\n## Promise 中的 finally\n\n在前几章中，我们学习并使用了 Promise 进行异步操作。为了获取 Promise\
  \ 接收到的值，我们会链式调用 `.then` 和 `.catch` 来分别捕获解决和拒绝状态。ES9 为 Promise 引入了 `finally`。我们可以将\
  \ `finally` 链式调用到 Promise 上，无论 Promise 执行成功与否，它都会被执行。\n\n正如你在 *图 15.7* 中所见，我们在脚本开头创建了一个变量\
  \ `isLoading`。接着，我们借助 `setTimeout` 函数模拟了一个异步函数来创建 Promise。一旦创建 Promise，我们就将 `isLoading`\
  \ 变量设为 `true`。可以将其想象为一个标志，用于在等待服务器响应时在 UI 上显示加载图标。如你所见，该值为 `true`。\n\n在 *图 15.7*\
  \ 中，三秒后我们拒绝了 Promise。这使得附加到 Promise 上的 `catch` 被激活，并接收到 `reject` 发送的文本。在 `catch`\
  \ 内部，它记录了从 Promise 接收到的语句。之后，`finally` 被执行，我们首先记录一条语句，说明 Promise 已完成。然后，我们将加载标志设为\
  \ `false`。可以将其想象为用于切换 UI 上加载状态的标志。由于我们的 Promise 已完成，我们将标志设为 `false`。假设我们可以将其理解为隐藏\
  \ UI 上的加载图标。因此，Promise 中的 `finally` 用于执行 Promise 的任何后续影响。\n\n![](img/Figure-15.7.jpg)\n\
  \n**图 15.7：** Promise 中 finally 的示例\n\n# ES10\n\nECMAScript 的第十版于 2019 年发布。其中一些最重要的特性包括：\n\
  \n## Array.flat()\n\n顾名思义，它用于扁平化数组。从技术上讲，对于嵌套数组，它会创建一个新数组，其中所有子数组元素递归地连接到指定深度。或者，如果数组中有空洞或空位，`flat`\
  \ 方法可以将其移除。\n\n如下面的 *图 15.8* 所示：\n\n第一个 `console.log` 语句（标记为“1.”）打印了原始数组，我们可以看到在第四个元素之后，有一个包含四个元素的数组（其中第四个元素又是一个数组）。\n\
  \n当我们对数组使用 `flat` 方法时，它会取出第一个嵌套数组的四个元素并将其连接到原始数组中，如第二个 `console.log` 语句所示。\n\n如果我们对数组调用两次\
  \ `flat` 方法，基本上意味着先扁平化一次，然后对第一次调用 `flat` 得到的扁平化数组再次调用 `flat` 方法，如第三个 `console.log`\
  \ 语句所示。相反，我们可以在 `flat` 方法中添加一个参数，该参数指定数组的深度。这意味着它会将数组扁平化到参数中指定的深度。换句话说，它会调用 `flat()`\
  \ 方法 n 次，其中 n 是参数中传入的数字。你可以在语句 3、4、5 和 6 中查看这一点。\n\n在第七条语句中，我们传入了 `Infinity` 作为参数。它会持续扁平化数组，直到所有子数组都被移除。\n\
  \n最后，在第八条语句中，我们可以看到 `arr2` 中的空位被 `flat` 方法移除了。\n\n![](img/Figure-15.8.jpg)\n\n**图\
  \ 15.8：** Array.flat() 示例\n\n## Array.flatMap()\n\n`Array.flatMap()` 方法首先像普通的 `map`\
  \ 方法一样映射数组的每个元素。然后将结果扁平化为一个新数组。在下面的截图中，`flatMap` 映射每个元素并返回一个包含该元素及其值乘以 2 的数组。最后，它对这些数组应用\
  \ `flat()` 方法，将它们转换并连接成一个单一的数组。\n\n![](img/Figure-15.9.jpg)\n\n**图 15.9：** Array.flatMap()\
  \ 示例\n\n## Object.fromEntries()\n\n它将一个可迭代对象（如数组，而非对象）转换为一个对象：\n\n![](img/Figure-15.10.jpg)\n\
  \n**图 15.10：** Object.fromEntries() 示例\n\n## String.trimStart() 和 String.trimEnd()\n\
  \n我们已经见过 JavaScript 的 `trim` 方法，它可以修剪或移除字符串中的空白字符。如果你只想移除字符串之前或之后的空白字符，可以使用上述方法：\n\
  \n![](img/Figure-15.11.jpg)\n\n**图 15.11：** trimStart() 和 trimEnd() 示例\n\n## Function.toString()\n\
  \n它返回一个表示函数源代码的字符串：\n\n![](img/Figure-15.12.jpg)\n\n**图 15.12：** 函数 toString() 示例\n\
  \n## 可选的 catch 绑定\n\n以前，我们需要为 `try…catch` 异常处理的 `catch` 提供一个参数。在 ES10 之后，不再强制要求为\
  \ `catch` 提供参数。\n\n# ES11\n\n由于本书是在 2020 年最后三个月编写的，我们还有 2020 年 6 月发布的第十一版 ECMAScript\
  \ 标准。以下是该版本中一些令人兴奋的新特性：\n\n空值合并运算符\n\n你经常会遇到需要为变量设置默认值的情况。你通常会使用类似下面的代码：\n\n```\n\
  const price = settings.price || 100;\n```\n\n**代码 15.3：** 默认值设置示例\n\n这意味着如果某个 `settings`\
  \ 对象中不存在 `price` 键，则将变量 `price` 的值设为 100。然而，当 `settings.price` 为 0、`false` 或 `\"\
  \"` 时，默认值 100 也会被设置。这可能导致不期望的结果。为了避免这种情况，ES11 引入了空值合并运算符（`??`）。它确保仅当第一个条件返回 `null`\
  \ 或 `undefined` 时，才设置默认值：\n\n![](img/Figure-15.13.jpg)\n\n**图 15.13：** `??` 示例\n\
  \n## 可选链运算符\n\n让我们通过一个例子来理解这一点。在 *图 15.14* 中，我们使用 `document.getElementById` 获取一个元素。在下一行，我们检查该元素是否存在。如果存在，则获取其值并存储在变量\
  \ `phoneNumber` 中，否则存储 `undefined`。我们需要这样做，因为如果我们直接尝试访问该元素的值，而该元素不存在，JavaScript\
  \ 代码将会崩溃。实现这一点的更简洁方法是使用可选链运算符（`?.`）。它仅在存储元素的变量不为 `null` 或 `undefined` 时才会链式访问值。否则，它会自动存储\
  \ `undefined`。\n\n![](img/Figure-15.14.jpg)\n\n**图 15.14：** 可选链运算符示例\n\n## 私有字段\n\
  \n在 *第 7 章：类* 中，我们了解了私有变量对于隐藏关键内部实现的必要性。让我们再次回顾那个例子：\n\n烤面包机是一种用于烤面包片的易用机器。如果我让你用烤面包机帮我烤两片面包，你很可能不需要说明书就能做到。大多数烤面包机都有以下四个或五个指定部分：\n\
  \n*   两个或更多用于放置面包的空位。\n\n\n\n\n\n*   一个类似杠杆的按钮，用于弹出面包片。\n*   一个用于启动机器的按钮。\n*   一个用于调节吐司焦黄程度的旋钮。\n\
  \n然而，如果我打开机器，露出其复杂的内部零件，并让你重复同样的操作，没有说明书你能做到吗？\n\n这个练习的全部意义在于帮助你理解：我们不应该暴露某些内部实现和方法。类似地，在很多情况下，我们也不希望暴露类的内部变量和方法。例如，如果我们有一个`Person`类，用于存储个人的信息，我们希望确保像个人银行账号这样的属性，或者像获取余额这样的方法，不能被任何人访问。这些属性和函数应该只能在类内部使用。\n\
  \n在 ES11 中，ECMAScript 引入了`#`符号，用于将变量和函数设为私有。在变量或函数前加上哈希（`#`）符号，将使其只能在类内部访问。从外部尝试访问会导致错误。让我们看一个例子：\n\
  \n![](img/Figure-15.15.jpg)\n\n**图 15.15：** 私有字段示例\n\n如上图所示，出于显而易见的原因，我们希望隐藏`Person`类的银行账号以及用于获取最近五笔交易的方法。我们在定义它们之前加上哈希（`#`）符号，将它们设为私有变量。由于我们没有将`display`函数设为私有，因此它如第一个输出所示被执行。在`display`内部，我们调用`fetchLastFiveTransactions`方法。`fetchLastFiveTransactions`方法将变量`amountSpent`的值设置为\
  \ 2345.67。这个值用于在控制台打印。如*图 15.15*所示，尝试访问私有字段会显示 undefined 和错误，但内部却能完美运行。通过这种方式，你可以将类内部的字段设为私有。\n\
  \n# 动态导入\n\n以前，每当我们需要导入一个文件时，都需要添加一个静态声明，如下所示：\n\n```\nimport * as modules from\
  \ './../utils/allModules.js';\n```\n\n**代码 15.4：** 静态导入示例\n\n现在，你可以使用新的`import()`语句在运行时动态导入，而不是预先定义导入。这可以大幅提升性能。你需要提供一个字符串作为参数，该字符串作为模块说明符即可。它会返回一个\
  \ promise：\n\n```\nconst books = await import('./../utils/allModules.js');\n```\n\
  \n**代码 15.5：** 动态导入示例\n\n# Import meta\n\n`import.meta`对象提供当前模块的元数据。一些可信网站表示它仅适用于属性\
  \ URL，因此我们暂时跳过。\n\n新的导出语法\n\n如果你想从某个文件导入，并立即导出刚导入的文件，可以按以下方式操作。它结合了导入和导出语法：\n\n\
  ```\nexport * as myModule from './../utils/modules.js';\n```\n\n**代码 15.6：** 导出示例\n\
  \n# 新数据类型 - `bigint`\n\nES11 引入了一种新的数据类型`bigint`，用于表示大于 2⁵³ 的数值。到目前为止，包括浮点数在内的所有数值都属于`Number`数据类型，最大安全整数为\
  \ 2⁵³。新数据类型值克服了这一缺陷。它对于复杂的数学计算和大数值特别有用。\n\n请记住，`Number`和`BigInt`是两种不同的数据类型。\n\n\
  # `globalThis`\n\n在 JavaScript 的历史中，我们一直经历着使用`this`变量的痛苦。最终，我们有了一个新的 JavaScript\
  \ 对象`globalThis`，它可以在不同的 JavaScript 环境中始终访问全局对象。\n\n# `matchAll`\n\n我们在前一章中看到的用于正则表达式的`matchAll`方法是在\
  \ ES11 中引入的。\n\n# `Promise.allSettled()`\n\n鉴于本书的范围，我们没有学习`Promise.all()`方法，该方法允许你以数组形式添加多个\
  \ promise。只有当所有 promise 都完成时，它才会返回一个 promise。然而，如果其中一个 promise 被拒绝，你只会收到一个拒绝结果。你将永远无法知道其余\
  \ promise 的状态。`Promise.allSettled()`通过提供所有 promise 的值（无论其结果如何）解决了这个问题。\n\n# `ES.Next`\n\
  \n`ES.Next`是一个动态名称，指代编写时即将到来的下一个版本。在编写本书时，`ES.Next`指的是 ES12 或 ES2021。\n\n### 结论\n\
  \n在本章中，我们详尽探讨了 ES6 之前和之后的生活。我们了解了 ECMAScript 的起源，以及 ECMAScript 与 JavaScript 之间的主要区别。我们还查看了\
  \ ECMAScript 规范的每个版本。在后面的章节中，我们特别学习了一些有助于改进编码的有用概念。\n\n在本书的最后一章，即下一章，我们将介绍一些实用的技巧，帮助你在工作中脱颖而出。我们将学习一些在编码时应遵守的巧妙技巧和规则。\n\
  \n### 要点回顾\n\n*   JavaScript 和 ECMAScript 不是一回事。ECMAScript 是 JavaScript 遵循的标准。\n\
  *   在 2015 年 ES6 发布后，TC39 决定每年发布一个 ECMAScript 版本。\n*   在最新版本 ES11 中，我们看到了从新数据类型到几个新运算符的诸多顶级引入。\n\
  \n### 选择题\n\n1.  `Object.values`返回对象的所有键——正确还是错误？\n    1.  正确。\n    2.  错误。\n2.\
  \  `Object.fromEntries`作用于对象——正确还是错误？\n    1.  正确。\n    2.  错误。\n\n### 答案\n\n1.\
  \  **b**\n2.  **b**\n\n# 第 16 章\n\n## 技巧与窍门\n\n在前十五个章节中，我们试图解码、解读并简化 JavaScript\
  \ 这个复杂的网络，它常常让最优秀的开发者感到不安。在本书的最后一章，我们将带你了解一些多年来积累的奇特技巧和窍门。这些技巧可以帮助你编写优化代码、提升代码性能，并让你的队友惊叹不已。那么，闲话少说，让我们开始简化\
  \ JavaScript 的最后一章吧。\n\n### 结构\n\n在最后一章中，我们将涵盖以下主题：\n\n*   最佳实践\n*   技巧与窍门\n\n###\
  \ 目标\n\n学习完本章后，你应该能够高效地使用 JavaScript 进行编码。你将理解并运用编写 JavaScript 的最佳实践。你可以编写优化代码，提升应用程序的性能，并利用技巧和窍门避免编写冗长的代码。\n\
  \n# 最佳实践\n\n在本节中，我们将提及全球绝大多数开发者遵循的最佳实践。遵循这些实践并非强制要求，但强烈推荐。这不仅有助于你保持代码的可读性，还能帮助你提高代码的效率。\n\
  \n# 命名\n\n如果你搜索任何编程语言的“*最佳实践*”一词，大多数文章都会指向命名。这意味着你应该确保给变量起的名称足够简单，让任何人都能理解该变量存储的内容。例如，如果我们让你从以下示例中选择更容易理解的代码，你会选哪个？\n\
  \n```\n// 示例 1\nlet c = \"main\";\nlet x = f(c);\nlet a = [],\n     i;\nfor(i=0;i<x.length;i++)\
  \ {\n```\n\n\n\n\n\n```\n7.  if(x[i].id.includes(\"box\")) a.push(x[i]);\n8.  }\n\
  9.  function f(a) {return document.getElementsByClassName(a);}\n10. //-----------------------------------------------------------------------\n\
  12. // Example 2\n13. let boxElements = [];\n14. let className = \"main\";\n15.\
  \ let elements = findElements(className);\n17. for(let index = 0; index < elements.length;\
  \ index++) {\n18.     if(elements[index].id.includes(\"box\")) {\n19.         boxElements.push(elements[index]);\n\
  20.     }\n21. }\n23. function findElements(class) {\n24.     return document.getElementsByClassName(class);\n\
  25. }\n```\n\n**代码 16.1：** 变量命名\n\n正如我们在*代码示例 16.1* 中所见，示例 1 和示例 2 执行的是相同的任务。然而，理解示例\
  \ 2 远比理解示例 1 容易。如果仔细观察，你会发现每个变量都清晰地表明了它存储的内容或需要执行的任务。\n\n**提示：** 一个经验法则：变量命名应做到即使是对编程一无所知的人，也能理解该变量的作用或存储内容。\n\
  \n# 命名约定\n\n在上一节中，我们讨论了变量命名。命名约定指的是你编写变量名的方式。例如，SQL 数据库开发者建议使用下划线分隔多个单词，比如 `date_of_birth`。\n\
  \n主要有四种命名风格：\n\n1.  连字符（例如 `date-of-birth`）\n2.  蛇形命名法（例如 `date_of_birth`）\n3. \
  \ 帕斯卡命名法（例如 `DateOfBirth`）\n4.  驼峰命名法（例如 `dateOfBirth`）\n\n老实说，代码的命名约定取决于你所在的团队。然而，Google\
  \ 风格指南和许多顶级 Web 开发者推荐使用驼峰命名法。这意味着首字母应小写，如果有多个单词，后续单词的首字母应大写。\n\n此外，Google 风格指南建议常量使用全大写的蛇形命名法，例如\
  \ `DATE_OF_BIRTH`。\n\n**注意：** 连字符的问题在于它可能被误认为是减法操作。同样，蛇形命名法需要在两个单词之间的空格处添加下划线，常用于\
  \ SQL 或 PHP。帕斯卡命名法更受 C 语言程序员的青睐。\n\n# 空白符\n\n编码时一个重要的点是：总会有人查看你的代码。可能是你的同事、经理、团队领导，或者如果你的作品变得流行，会有很多人希望复制你的代码。让他们的阅读变得有价值至关重要！\n\
  \n提高代码可读性的最佳方法之一是包含适当的空白符：\n\n```\n1.  // 始终在运算符（包括赋值运算符）之间添加空格。\n2.  let name =\
  \ \"John Doe\";\n3.  let sum = number1 + number2;\n5.  // 在 for 循环内的分号（\";\"）后添加空格\n\
  6.  for(let i=0; i<20; i++) {/*code*/}\n8.  // 在任何花括号（\"{\"）之前添加空格（使用模板字面量时除外）\n\
  9.  let person = {\n10.     name: \"John Doe\",\n11.     address: {\n12.       \
  \  city: \"New York\",\n13.         country: \"United States\"\n14.     }\n15. }\n\
  17. let speech = `His name is ${firstName}.`\n19. // 所有新声明应在新行上：\n20. let firstName,\n\
  21.      lastName,\n22.     age;\n24. // 多个参数应在新行上\n25. function getRole (\n26.\
  \     name,\n27.     id,\n28.     department,\n29.     manager\n30. ) {/*code*/}\n\
  ```\n\n**代码 16.2：** 空白符\n\n# 80 字符规则\n\n全球顶级产品公司都严格遵守的规则是 80 字符规则。这意味着每行最多包含 80\
  \ 个字符。如果代码行超过 80 个字符，应将其换行到下一行。\n\n```\n1.  // 以下行包含 91 个字符\n2.  let affordableFruits\
  \ = foodItems.filter(item => item.type === \"fruit\" && item.price < 100);\n4. \
  \ // 为了遵守 80 字符规则，可以改为：\n5.  let affordableFruits = foodItems.filter(item =>\n6.\
  \      item.type === \"fruit\" && item.price < 100);\n```\n\n**代码 16.3：** 80 字符规则\n\
  \n# 在作用域顶部声明\n\n为了保持代码可读性，始终将变量声明放在各自作用域的顶部。\n\n# 引号一致性\n\n如你所知，JavaScript 允许在字符串中使用单引号和双引号。你可以自由选择其中一种用于\
  \ JavaScript 文件。然而，在整个代码中保持一致至关重要。如果你使用了双引号，请确保代码中所有地方都使用双引号，不要在任何地方使用单引号。\n\n#\
  \ 经常添加注释\n\n正如我之前提到的，你的 JavaScript 代码会被很多人查看。事实上，有时你会在首次编写代码数月或数年后再次参考它。有时你通过复杂的代码成功解决了一个非常棘手的问题。基于上述原因，在代码的适当位置编写合适的注释至关重要，这样你和你的读者都能更容易地阅读代码。\n\
  \n## 技巧与窍门\n\n现在我们对编写 JavaScript 的最佳实践有了基本了解，接下来探索一些提高代码效率的技巧。\n\n# 过滤数组中的唯一值\n\n\
  如果你想从数组中移除重复值，有多种较长的实现方式。然而，最佳方法是使用 ES6 引入的 `Set` 对象类型。`Set` 对象允许你存储任何类型的唯一值，包括原始值和对象引用：\n\
  \n![](img/Figure-16.1.jpg)\n\n**图 16.1：** Set 对象类型\n\n如上图所示，Set 对象不允许添加重复值。现在，如*图\
  \ 16.2* 所示，如果你有一个包含重复值的数组，可以使用 `Set` 对象配合展开运算符来移除重复项。正如我们之前所了解的，展开运算符（...）会复制数组的值（而非引用），将数组放入\
  \ `Set` 对象中即可移除重复项：\n\n![](img/Figure-16.2.jpg)\n\n**图 16.2：** 从数组中移除重复项\n\n# 对象解构\n\
  \n如*代码示例 16.4* 所示，要从对象中获取某些键的值，我们使用点号表示法或方括号表示法来获取并存储其对应的值到变量中：\n\n```\n1.  let\
  \ person = {\n2.      name: \"John Doe\";\n3.      age: 27,\n4.      language: \"\
  English\",\n5.      nationality: \"English\",\n6.      eyeColor: \"black\",\n7.\
  \      gender: \"male\"\n8.  };\n10. let name = person.name;\n11. let age = person.age;\n\
  12. let language = person.language;\n```\n\n**代码 16.4：** 存储对象值的传统方式\n\n你可以通过使用对象解构来缩短这一过程，只从对象中获取某些键：\n\
  \n![](img/Figure-16.3.jpg)\n\n**图 16.3：** 对象解构\n\n# 获取数组的最后几项\n\n如果你想获取数组的最后几项，可以使用\
  \ JavaScript 的 `slice` 方法并传入负值来获取：\n\n![](img/Figure-16.4.jpg)\n\n**图 16.4：** 获取数组的最后几个值\n\
  \n# 设置对象的动态键\n\n\n\n\n\n如果你想动态设置对象的键，可以使用方括号表示法来实现。例如，在图 16.5 中，我们创建了一个名为 `dateObj`\
  \ 的对象。它将包含日期和年份。然而，如果是闰年，我们希望将键命名为 `leapYear`；如果不是，键名应为 `year`。在第 2 行，我们利用了 JavaScript\
  \ 的 `Date` 对象。在 `Date` 的新构造函数中，第一个参数是年份，第二个参数是月份（从 0 开始，即一月为 0，二月为 1，依此类推），第三个参数将提供的天数加到前两个参数指定的日期上。这意味着\
  \ `new Date(2020, 1)` 将输出日期为 2020 年 2 月 1 日。如果我们添加第三个参数为 29，则会在 2020 年 2 月 1 日的基础上增加\
  \ 29 天。如果 2020 年是闰年，闰年后 29 天的结果应为 2020 年 2 月 29 日；如果不是闰年，结果将是 2020 年 3 月 1 日。\n\n\
  在第二行，我们执行了上述操作，然后获取结果的月份。如果是闰年，月份将是二月，即 1（因为一月是 0）；如果不是闰年，月份将是三月，即 2。如果值为 1，我们将值\
  \ `leapYear` 存入变量 `keyName`，否则存入值 `year`。\n\n借助方括号表示法，我们现在为对象存储动态键名：\n\n![](img/Figure-16.5.jpg)\n\
  \n**图 16.5：** 动态键名\n\n# 截断数组\n\n如果你想以破坏性方式移除数组中的值，可以将数组的长度设置为要移除的值的位置：\n\n![](img/Figure-16.6.jpg)\n\
  \n**图 16.6：** 截断数组\n\n# 改进条件语句\n\n如果我们想根据条件执行某些代码，通常会这样做：\n\n```\nlet isLeap = new\
  \ Date(2020, 1, 29).getMonth() === 1;\n\nif(isLeap === true) {\n    printStatement();\n\
  }\n\nfunction printStatement() {\n    console.log(`It is a leap year.`);\n}\n```\n\
