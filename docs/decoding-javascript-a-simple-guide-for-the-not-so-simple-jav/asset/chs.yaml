  \ 所示，我们将食谱列表作为参数传递给函数 `createRecipeCards`。\n\n*   我们需要做的第一件事是获取存储食谱的容器。我们在 *代码示例\
  \ 10.14* 的第 2 行实现了这一点，并将该容器存储在变量 `recipesContainer` 中。\n*   接下来，如第 3 行所示，我们遍历对象列表数组中的每个元素。\n\
