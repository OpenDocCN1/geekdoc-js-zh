  \n# 评论\n\n请留下评论。一旦您阅读并使用了本书，为什么不在您购买它的网站上留下评论呢？潜在读者可以看到并使用您公正的意见做出购买决定，我们 BPB 可以了解您对我们产品的看法，我们的作者可以看到您对他们书籍的反馈。谢谢！\n\
  \n有关 BPB 的更多信息，请访问 [**www.bpbonline.com**](http://www.bpbonline.com/)。\n\n# 第 1\
  \ 章\n\n## JavaScript 简介\n\n\n\n\n\n**你不能在薄弱的地基上建造伟大的建筑。要想拥有超强的结构，你必须有一个坚实的基础。**\n\
  \n*— 戈登·B·欣克利*\n\n稍微不那么严肃地说，要创建下一代超棒的 Web 应用程序，我们需要编写出色的 JavaScript 代码。而要编写出色的 JavaScript\
  \ 代码，我们需要对 JavaScript 的基本概念有扎实的理解。简而言之，熟练掌握 JavaScript 的基本概念将帮助你成为业内最优秀的 Web 开发者之一。有鉴于此，让我们通过回顾\
  \ JavaScript 的基本概念来开启我们的旅程。\n\n不过有一点需要说明：由于本书面向的是高级 JavaScript 概念，我们不会对基本概念进行详尽深入的研究。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* JavaScript 入门\n* JavaScript 中的数据类型和运算符\n* JavaScript\
  \ 中的条件与循环\n* 网页的旅程\n* JavaScript 与 DOM\n\n### 目标\n\n学习完本章后，你应该能够掌握 JavaScript 的基础知识。你将能够用\
  \ JavaScript 编写基本代码，并理解 Web 开发的过程。\n\n# JavaScript 入门\n\n每一个伟大的故事都有一个美好甚至引人入胜的开端。同样，为了更好地理解一个概念或主题，通常有必要认识到为什么这个想法会诞生。在这个概念出现之前，情况是怎样的？\n\
  \n在本节中，我们将首先探讨是什么条件使 JavaScript 成为 Web 开发的事实标准编程语言。到本节结束时，我们将了解什么是 JavaScript，它如何为\
  \ Web 开发过程做出贡献，以及最后如何在我们的 HTML 文件中设置 JavaScript。\n\n# JavaScript 的诞生\n\n在**万维网**（**WWW**）的早期，最流行的\
  \ Web 浏览器是计算机服务公司 Netscape 出品的 Netscape Navigator。那时的网页只能显示静态内容。一旦网页加载完成，就无法实现任何动态行为，比如点击或悬停。\n\
  \n为了消除这一限制，1995 年，Netscape 提出并引入了一种可以在客户端机器（即浏览器）上运行的脚本语言，名为 *JavaScript*。有消息称，该公司决定利用当时\
  \ Java 语言的成功浪潮，将名称定为 JavaScript 作为一种巧妙的营销策略，尽管这两种编程语言之间没有任何联系。\n\n尽管 JavaScript\
  \ 一经推出便大获成功，但一些竞争性浏览器及其脚本语言的引入，使得 Web 开发者很难编写出能在所有浏览器上运行的代码。这种混乱最终导致了客户端（浏览器）脚本语言的标准化。一家名为**欧洲计算机制造商协会**（**ECMA**）的国际组织实现了这一标准化，所有浏览器都必须遵循。因此，JavaScript\
  \ 经常与 ECMAScript 混淆。然而，它们是两个不同的概念。ECMAScript 是 JavaScript 所依据的标准。可以把 JavaScript\
  \ 看作是 ECMAScript 的一个子集。\n\nECMAScript 有多个版本。然而，所有主流浏览器最流行且接受度最高的标准是 1999 年发布的第 3\
  \ 版。自那时起，最重要的更新是第 6 版，在 *2015* 年被命名为 **ES6**。在本书中，我们将主要使用 ES6。随着时间的推移，更新的版本也会发布。在本书末尾，我们将介绍到\
  \ ES11 版本，这些版本已确认但尚未广泛实现。\n\n# JavaScript 到底是什么？\n\n在上一节中，我们了解了浏览器为什么引入 JavaScript。现在，让我们探讨\
  \ JavaScript 在 Web 开发范式中的位置。\n\n打个比方，我们通过一个建筑建造的例子来理解 Web 开发。\n\n建筑建造分为以下三个阶段：\n\
  \n![](img/Figure-1.1.jpg)\n\n**图 1.1：** 开发阶段\n\n让我们理解建筑建造的每个阶段，并最终与 Web 开发进行类比：\n\
  \n* **阶段 1**：当建筑建造开始时，工人在指定位置铺设钢筋，并浇筑水泥。结果是一个灰色的建筑（通常无法居住），一个地基，并划分了房间的空间。\n* **阶段\
  \ 2**：这是工人对建筑进行装饰的阶段。工人在原本灰色的建筑上添加设计和色彩，使其看起来美观。\n* **阶段 3**：虽然阶段 2 结束时的建筑已经可以居住，但这一阶段才真正完成了建造。在这个阶段，工人添加了电梯、停车位、电力等必要设施。\n\
  \n第三阶段可能不是强制性的，但它非常重要。类似地，在 Web 开发中，HTML 和 CSS 完成了网页开发的前两个阶段——基础结构和样式。然而，结果将仅仅是一个零交互的网站。JavaScript\
  \ 是第三阶段，它将网站/Web 应用程序提升了一个档次。\n\nJavaScript，通常称为 JS，不仅为网页添加了交互性，还预装了一系列功能：\n\n*\
  \ 响应特定事件运行代码，例如点击网页上的某个项目、按下键盘上的某个键、向下滚动网页等等。\n* 它内置于所有主流浏览器中，如 *Google Chrome*、*Mozilla\
  \ Firefox*、*Safari*、*Microsoft Internet Explorer*、*Microsoft Edge*、*Opera* 等，并且免费使用。\n\
  * 它是一种结构化的面向对象编程语言。\n* 它是一种解释型语言，即在运行时环境中工作，这意味着无需事先编译代码！\n* 它可以使用一种称为 AJAX 的概念从服务器获取数据，并利用这些数据在网页上渲染元素。\n\
  * 它可以获取网页上显示的 HTML 元素，并且还可以操作它们。\n* 像 MongoDB 这样的数据库和像 Nodejs 这样的服务器端编程平台，分别使用 JavaScript\
  \ 作为其查询语言和应用程序。\n\n# 系统设置\n\n在本节中，我们将设置系统以编写出色的 JavaScript 代码：\n\n* 由于 JavaScript（JS）内置于大多数\
  \ Web 浏览器中，你可以使用 *Google Chrome*、*Mozilla Firefox*、*Safari*、*Internet Explorer*、*Microsoft\
  \ Edge* 或 *Opera* 浏览器来查看你的网页。然而，强烈推荐使用 *Google Chrome*，因为它安全性高且拥有出色的开发者控制台。\n* 虽然你可以使用像\
  \ Windows 上的记事本这样的简单文本编辑器来编写 HTML、CSS 和 JS 代码，但强烈建议你安装一个**集成开发环境**（**IDE**）软件，如\
  \ *Visual Studio Code* 或 *Atom*。\n\n在本书中，我们将使用 **Google Chrome** 和 **Visual Studio\
  \ Code** 进行开发。\n\n就这样！你已经准备好开始你的 JavaScript 之旅了！\n\n# 如何将 JavaScript 添加到你的网页？\n\n\
  你可以像将 CSS 添加到网页一样，将 **JavaScript**（**JS**）应用到网页。与 CSS 类似，有两种不同的方式将 JS 添加到你的代码中：\n\
  \n* **内部 JavaScript**：在这种方法中，你可以通过在 HTML 的 `<head>` 或 `<body>` 中插入 `<script>` 标签，将\
  \ JS 添加到你的 HTML 代码中。由于你是在 HTML 代码内部（即内部）添加 JS，这种方法被称为内部 JavaScript。\n\n\n\n\n\n\
  要在内部添加 JS 代码，请打开您机器上的 *Visual Studio Code* 应用程序，并按照以下步骤操作：\n\n1.  在计算机上选择一个合适的位置创建一个空文件夹。为该文件夹取一个合适的名称。\n\
  \n    **提示：** 命名规范在 Web 开发中非常重要。虽然我们将在“附加章节”中更详细地讨论这一点，但在此处的一个有用建议是：好的名称应简短（少于 60\
  \ 个字符），并且一眼看去就能让读者了解该文件夹或文件的内容。\n\n2.  创建一个 HTML 文件，命名为 `index.html`，并将其保存在您刚刚创建的文件夹中。\n\
  \n    ```html\n    <!DOCTYPE html>\n    <html>\n          <head>\n             <meta\
  \ charset=\"utf-8\">\n             <title>向网页添加 JavaScript</title>\n         </head>\n\
  \         <body>\n             <p>Hello World!</p>\n         </body>\n    </html>\n\
  \    ```\n\n    **代码 1.1：** index.html\n\n3.  接下来，在 HTML 代码的 head 标签内创建一个 `<script>`\
  \ 标签，并添加以下代码行：\n\n    ```html\n    <script>\n        alert(\"Hello World!\");\n\
  \    </script>\n    ```\n\n    **代码 1.2：** 向 HTML 添加 script 标签\n\n    **注意：** 您也可以将\
  \ `<script>` 标签添加到 HTML 代码的 `<body>` 中。将 `<script>` 放在 `<head>` 和 `<body>` 中的区别在于网站性能的显著差异。我们将在“从输入\
  \ URL 到网页渲染的旅程”这一主题中讨论这一点。\n\n    就这样！现在，当您在 Web 浏览器中打开 `index.html` 时，您将看到一个弹出/对话框，其中显示“`Hello\
  \ World`”字样。\n\n    ![](img/Figure-1.2.jpg)\n\n    **图 1.2：** 显示“Hello World”警告的屏幕\n\
  \n*   **外部 JavaScript**：顾名思义，外部 JavaScript（JS）指的是从外部添加的 JS 代码。这意味着您不将 JS 代码写在 HTML\
  \ 文件中，而是将其写在一个单独的文件中，然后将 JavaScript 注入（您会经常遇到这个术语）到 HTML 文件中。要添加外部 JS，请按照以下步骤操作：\n\
  \n    1.  在您创建 HTML 文件的同一文件夹中，创建另一个名为 *scripts* 的文件夹。\n\n    2.  在 scripts 文件夹中，创建一个名为\
  \ `index.js` 的 JS 文件。请记住，JS 文件必须以扩展名 `.js` 结尾，这一点至关重要。此时，您的文件夹结构应如下所示：\n\n     \
  \   ![](img/Figure-1.3.jpg)\n\n        **图 1.3：** 外部 JS 的文件夹结构\n\n    3.  复制您为内部\
  \ JS 编写的 JS 代码（不带 `<script>` 标签），并将其粘贴到 `index.js` 文件中。您的 `index.js` 文件现在将如下所示：\n\
  \n        ```javascript\n        alert(\"Hello World!\");\n        ```\n\n     \
  \   **代码 1.3：** 向 index.js 文件添加 alert\n\n    4.  现在，从 `index.html` 中移除 `<script>`\
  \ 标签，并将其替换为以下内容：\n\n        ```html\n        <script src=\"./scripts/index.js\"\
  ></script>\n        ```\n\n        **代码 1.4：** 添加外部 script 标签\n\n        您的 HTML\
  \ 文件现在将如下所示：\n\n        ```html\n        <!DOCTYPE html>\n        <html lang=\"\
  en\">\n          <head>\n                  <meta charset=\"UTF-8\">\n          \
  \           <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n                     <title>向网页添加 JavaScript</title>\n                     <script\
  \ src=\"./scripts/index.js\"></script>\n                </head>\n              \
  \  <body>\n                    <p>Hello World</p>\n                </body>\n   \
  \     </html>\n        ```\n\n        **代码 1.5：** 添加外部 JS 后的 HTML 文件\n\n    `src`\
  \ 属性指向 JS 文件的存储路径。`src` 中的字符串 `\"./\"` 表示当前文件夹。因此，我们进入 `scripts` 文件夹，并使用 `/` 进入\
  \ `scripts` 文件夹内部，然后选择 `index.js` 文件。\n\n现在，当我们在浏览器中打开 `index.html` 时，您将看到一个弹出/对话框，其中显示“`Hello\
  \ World`”字样，如 *图 1.2* 所示。\n\n# JavaScript 中的注释\n\n与每种重要的编程语言一样，JavaScript 也提供了一种添加注释的方法，浏览器会忽略这些注释。这些注释对于向处理代码的开发人员提供有关代码如何运行的说明非常有用。\n\
  \nJavaScript 提供以下两种注释样式：\n\n| // 这是单行注释 | /* 这是多行注释 */ |\n\n**表 1.1：** 单行注释与多行注释\n\
  \n# JavaScript 中的数据类型和运算符\n\n几乎每种编程语言都处理值以及值之间的运算。例如，当您尝试登录电子邮件帐户时，您会输入电子邮件地址和密码。电子邮件地址和密码就是值。同样，如果您使用\
  \ Facebook 或 Instagram 作为社交媒体应用，并且您喜欢某张照片/帖子，那么您会注意到点赞数（同样是值）增加了 1。在这里，Web 应用执行了将现有点赞数加\
  \ 1 的操作。在本节中，我们将学习 JavaScript 中使用的不同类型的数据（例如，第一个示例中的文本或密码，以及第二个示例中的数字），以及可以在这些数据类型上使用的运算符。\n\
  \n# JavaScript 中的数据类型和变量\n\n在每种编程语言中，都有一个用于存储值的容器。这个容器对于存储数学运算中可能需要的数字、一些文本，甚至关于某个对象（如汽车）的整个信息字典非常有用。这个容器被称为**变量**。\n\
  \n在 JavaScript（JS）中，变量几乎可以存储任何内容。JS 变量可以存储文本字符串、数字、复杂数据以及整个函数。\n\n要使用变量，我们需要执行以下操作：\n\
  \n1.  创建一个变量。（声明）\n\n2.  为变量赋值。（初始化）\n\n# 创建变量（声明）\n\n要创建变量，我们需要使用 JS 关键字 `var`。（在\
  \ *第 3 节* ES6 中，我们将介绍更多用于创建变量的关键字。）\n\n创建变量的语法是：\n\n```javascript\nvar name;\nvar\
  \ age;\n```\n\n**代码 1.6：** 变量的语法\n\n当您输入上述命令时，JavaScript 会在内存中为该变量保留一个空间。可以将其想象成一个放在系统内存中的空盒子（因为我们没有为其分配任何值），盒子上贴有您为变量指定的名称标签。\n\
  \n**注意：** 存在但未赋值的变量 *与* 不存在的变量 *不同*。可以将其想象成一个空盒子与一个不存在的盒子。前者可以放入值，而后者不能。没有值的变量称为\
  \ `undefined`。\n\n# 为变量赋值（初始化）\n\n一旦创建（声明）了变量，您就可以为其赋值。这个过程称为 *初始化变量*。要初始化变量，您需要输入变量名，后跟等号（`=`），然后以您要赋予变量的值结束。\n\
  \n```javascript\nname = 'John Doe';\nage = 24;\n```\n\n**代码 1.7：** 初始化变量\n\n在上述示例中，我们将值\
  \ `'John Doe'` 和 `'24'` 分配给了我们在上一节中创建的变量。\n\n您也可以在一行中声明并初始化变量。\n\n```javascript\n\
  var name = 'John Doe';\n```\n\n**代码 1.8：** 在一行中声明并初始化变量\n\n\n\n\n你也可以通过输入变量名、等号和新值来更新已有变量的值。例如：\n\
  \n1.  `name = 'Cristiano Ronaldo';`\n\n    **代码 1.9：** 更改变量的值\n\n如果现在尝试打印 `name`\
  \ 变量的值，它将不再是 John Doe。`name` 变量的值现在将是 Cristiano Ronaldo。\n\n# JavaScript 中的数据类型\n\
  \n存储在变量中的数据或值可以是不同类型。例如，在前面的示例中，我们看到了数字和文本类型。与其他编程语言不同，在 JavaScript 中，你不需要为不同类型的数据使用不同的关键字。JavaScript\
  \ 中的不同数据类型如下：\n\n*   **数字（Numbers）**：包括整数，例如 30，或小数，例如 245.67。你不需要将这些值放在引号中。\n\n\
  \    1.  `var num1 = 45;`\n\n        **代码 1.10：** 数字数据类型\n\n*   **字符串（Strings）**：字符串就是文本。当你将字符串值赋给变量时，需要用单引号或双引号将其包裹起来。\n\
  \n    1.  `var name = 'John Doe';`\n\n        **代码 1.11：** 字符串数据类型\n\n*   **布尔值（Booleans）**：布尔值有两个值——true\
  \ 或 false。你不需要将值包裹在引号中。布尔值主要用于测试条件。例如，如果布尔变量的值为 true，则可以执行某些代码，否则可以设置其他代码执行。它也可以包含像\
  \ `10>5` 这样的表达式作为值。在这种情况下，由于数字 10 大于数字 5，包含此表达式的变量的值将为 true。\n\n    1.  `var isNumber\
  \ = true;`\n\n        **代码 1.12：** 布尔数据类型\n\n*   **数组（Arrays）**：数组是一种复杂数据类型，可以存储多个值。多个值存储在方括号内，并用逗号分隔。我们将在*第\
  \ 4 章：数组*中更详细地研究数组。\n\n    1.  `var cars = ['BMW', 'Audi', 'Rolls Royce'];`\n\n\
  \        **代码 1.13：** 数组数据类型\n\n*   **对象（Objects）**：对象也是一种复杂数据类型，可以存储多个值。但与数组不同，在对象中，你可以为存储的数据命名。对象用于模拟现实生活中的对象。多个值被命名并存储在大括号内。\n\
  \n    1.  `var employee = {name: 'John Doe', age: 24, city: 'London'}`\n\n     \
  \   **代码 1.14：** 对象数据类型\n\nJavaScript 会自动检测变量值的类型。因此，JS 也被称为“*动态类型语言*”。\n\n# JavaScript\
  \ 中的运算符\n\nJavaScript（JS）运算符允许你执行数学运算、连接两个字符串、比较值、确定变量或值之间的逻辑关系，以及查找变量的数据类型。由于本书专门针对高级\
  \ JavaScript，我们期望读者对 JavaScript 运算符有基本的了解。虽然我们会介绍基本 JS 概念的理论，并看一两个示例，但我们鼓励读者自行练习不同的模式，以复习这些基本概念。\n\
  \nJavaScript 中有以下六种主要运算符类型：\n\n*   **算术运算符（Arithmetic Operators）**：用于对数字执行算术运算。算术运算符包括\
  \ `+`（加法）、`-`（减法）、`*`（乘法）、`/`（除法）、`%`（取模，除法的余数）、`++`（递增）和 `--`（递减）。\n\n    1.  `var\
  \ sum = 4 + 3;      //输出结果为 7`\n\n        **代码 1.15：** 算术运算符示例\n\n*   **赋值运算符（Assignment\
  \ Operators）**：这些运算符用于给 JavaScript 变量赋值。\n\n    | **运算符** | **示例** | **含义** |\n\
  \    | --- | --- | --- |\n    | `=` | `a = 5` | `a = 5` |\n    | `+=` | `a += 5`\
  \ | `a = a + 5` |\n    | `-=` | `a -= 5` | `a = a - 5` |\n    | `*=` | `a *= 5`\
  \ | `a = a * 5` |\n    | `/=` | `a /= 5` | `a = a / 5` |\n    | `%=` | `a %= 5`\
  \ | `a = a % 5` |\n    | `**=` | `a **= 5` | `a = a ** 5` |\n\n    **表 1.2：** 赋值运算符\n\
  \n*   **字符串运算符（String operators）**：当 `+` 运算符用于字符串时，它会连接两个字符串。\n\n    1.  `var txt1\
  \ = 'Hello';`\n    2.  `var txt2 = 'World';`\n    3.  `var greeting = txt1 + txt2;\
  \ //HelloWorld`\n\n        **代码 1.16：** 字符串运算符示例\n\n    **注意：** 当你对数字和数字字符串使用 `+`\
  \ 运算符时，结果将是一个字符串。例如，`5 + '5'` 将得到 `'55'`。但是，如果你对字符串和数字字符串的组合使用任何其他算术运算符，算术运算将成功，结果将是数字。例如，`'25'/5`\
  \ 将得到 `5`。\n\n*   **比较运算符（Comparison operators）**：这些运算符用于比较两个或多个变量和/或值。使用比较运算符进行运算的结果是布尔值。各种比较运算符如下：\n\
  \n    | **运算符** | **示例** | **结果** |\n    | --- | --- | --- |\n    | `==`（检查相等性）\
  \ | `5 == '5'` | true |\n    | `===`（检查值和类型是否相等） | `5 === '5'` | false |\n    |\
  \ `!=`（检查不相等） | `5 != '5'` | false |\n    | `!==`（检查值和类型是否不相等） | `5 !== '5'` | true\
  \ |\n    | `>`（大于） | `5 > 2` | true |\n    | `>=`（大于或等于） | `5 >= 5` | true |\n \
  \   | `<`（小于） | `5 < 2` | false |\n    | `<=`（小于或等于） | `2 <= 2` | true |\n\n   \
  \ **表 1.3：** 比较运算符\n\n*   **逻辑运算符（Logical operators）**：逻辑运算符确定变量和值之间的逻辑关系。有两个主要的逻辑运算符——`&&`（逻辑与）和\
  \ `||`（逻辑或）。当你想在条件逻辑中检查多个语句时，这些运算符将非常有用。\n\n    1.  `(10 > 5) && (2 > 3)      //false`\n\
  \n        **代码 1.17：** 逻辑运算符示例\n\n*   **类型运算符（Type operators）**：`typeof` 运算符返回变量或值的数据类型。\n\
  \n    1.  `typeof 'John Doe' //string`\n    2.  `typeof 24 //number`\n\n       \
  \ **代码 1.18：** 类型运算符示例\n\n# JavaScript 中的条件语句和循环\n\n假设我们正在创建一个像 Amazon 或 eBay 这样的电子商务应用程序。可以预见，我们需要构建成百上千个矩形卡片来展示待售商品。*你会花时间手动创建每一张卡片吗？*\n\
  \n鉴于这是一个电子商务应用程序，用户很可能会搜索特定类别的商品。因此，我们基本上需要检查显示的商品是否与用户输入的文本匹配。\n\n正是为了处理这类情况，我们需要\
  \ JavaScript 中的循环和条件语句等概念。\n\n# JavaScript 中的条件编码\n\n考虑以下场景：\n\n你有一个应用程序，在加载页面时向用户问好。如果是上午或下午，Web\
  \ 应用程序会以“*Good Day*”欢迎用户。如果时间过了下午 4 点，Web 应用程序会以“*Good Evening*”问候用户。\n\n我们上述问题陈述的核心依赖于\
  \ `if…else` 条件。JavaScript 通过两种条件语句实现这种条件编码——`if…else` 和 `switch`。\n\n# If…else 条件语句\n\
  \n`if…else` 条件语句使用起来相当简单。\n\n输入关键字 `if`，后跟括号。\n\n在括号内，编写一个条件测试。如果测试值为 true，则执行语句\
  \ 1。如果测试值为 false，则执行语句 2。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4：** `if…else` 语句的语法\n\
  \n对于我们的问题陈述，代码可能如下所示：\n\n```\nvar hours = new Date().getHours();\nif(hours < 16)\
  \ {\n    alert(\"Good Morning\");\n} else {\n    alert(\"Good evening\");\n}\n```\n\
  \n**代码 1.19：** `if…else` 条件语句示例\n\n\n\n\n如果你不理解代码的第一行，没关系，你会在后续章节中读到。它获取当前日期，并按照\
  \ 24 小时制提取小时数。接下来的两行是基本的条件语句。要添加多个条件，你可以将 `else` 替换为 `else if(condition)`。\n\n```\n\
  1.  var hours = new Date().getHours();\n2.  if(hours < 16) {\n3.      alert(\"Good\
  \ Morning\");\n4.  } else if(hours > 16 && hours < 23) {\n5.      alert(\"Good evening\"\
  );\n6.  } else {\n7.      alert(\"Good night\");\n8.  }\n```\n\n**代码 1.20：** if…else…if\
  \ 条件语句示例。\n\n# Switch 条件语句\n\n让我们考虑另一个场景。在这个用例中，一个变量从服务器接收学生的成绩。根据成绩，我们的 Web 应用程序应打印一条消息。如果成绩是\
  \ `'A'`，应打印 `'Excellent'`。如果成绩是 `'B'`，应打印 `'Good'`。`'C'` 应打印 `'Average'`，`'D'` 应打印\
  \ `'Failed'`。\n\n在这种情况下，我们可以使用 if…else…if 条件语句，但生成的代码会很长且不够优雅。一个优雅的解决方案是 `switch`\
  \ 语句。\n\n在 `switch` 语句中，一个表达式或变量被传递给关键字 `switch`。表达式的结果或变量的值对应 `switch` 关键字后面花括号内的某个\
  \ `case`。如果 case 的值与表达式结果或变量值匹配，则执行该 case 内的语句。如果没有匹配的值，则执行 `default` case。\n\n\
  ![](img/Figure-1.5.jpg)\n\n**图 1.5：** switch 语句的语法\n\n因此，我们的示例可以通过以下代码解决：\n\n```\n\
  1. var grade = 'A';\n2.\n3. switch(grade) {\n4.     case 'A':\n5.         alert('Excellent');\n\
  6.         break;\n7.     case 'B':\n8.         alert('Good');\n9.         break;\n\
  10.     case 'C':\n11.         alert('Average');\n12.         break;\n13.     case\
  \ 'D':\n14.         alert('Failed');\n15.         break;\n16.     default: alert('Not\
  \ present for exams');\n17. }\n```\n\n**注意：** 在 `switch` 语句中，`break` 语句非常重要。如果你移除\
  \ `break` 语句并执行此代码，你会观察到所有 case 都会被执行。\n\n把 `switch` 语句想象成一个瀑布。除非你在中间设置一个障碍（`break`），否则它会一直流下去。\n\
  \n# JavaScript 中的循环\n\n假设你有一个任务，要显示从 1 到 100 的数字。你会怎么做？你可能会创建 100 个包含数字 1 到 100\
  \ 的 `<p>` 元素，对吗？如果我把难度提高，把 100 变成 100,000 呢？\n\n在这种情况下，我们使用一个叫做循环的 JavaScript 概念。循环函数基本上从一个初始值开始，不断递增或递减该值，直到满足某个条件。\n\
  \n![](img/Figure-1.6.jpg)\n\n**图 1.6：** 循环流程图\n\nJavaScript 中有两种循环函数——`for` 循环和\
  \ `while` 循环（以及一个变体 `do…while` 循环）。如图 1.5 所示，所有逻辑都遵循以下相同模式：\n\n1.  用一个值初始化一个变量。\n\
  2.  测试该值。\n3.  如果为真则执行，如果为假则退出。\n\n在下面的 表 1.4 中，我们将理解并比较 JavaScript 中不同的循环方法：\n\n\
  | `for(var i=0; i<100; i++) {``console.log(i);``}` | `var i=0;``while(i<100) {``console.log(i);``i++;``}`\
  \ | `var i=0;``do {``console.log(i);``i++``}``while(i<100);` |\n| --- | --- | ---\
  \ |\n| 在 `for` 循环中，关键字 `for` 后面跟着括号内的三个表达式，用分号（`;`）分隔。第一个表达式初始化值，第二个表达式设置条件，第三个表达式更新值。花括号内的语句执行后，值由第三个表达式更新。只要条件表达式的结果为真，花括号内的语句就会执行。如果条件的结果变为假，代码将跳出\
  \ `for` 循环。 | 在 `while` 循环中，变量在循环语句外部初始化。关键字 `while` 后面跟着一个条件表达式。只要条件表达式的结果为真，花括号内的语句就会执行。值在花括号内更新。花括号内的语句执行并更新后续值后，顶部的条件会再次检查。如果条件为真，则重复该过程，否则代码将跳出循环。\
  \ | `do…while` 循环与 `while` 循环类似。唯一的区别在于，条件只在花括号内的语句至少执行一次后才进行检查。如果条件为真，则再次执行语句，否则代码将跳出循环。\
  \ |\n\n**表 1.4：** JavaScript 中不同的循环方法\n\n# 网页的旅程\n\n**我们所知道的过程**是：我们在浏览器中输入一个 URL。几秒钟后，一个网页神奇地出现在浏览器中。\n\
  \n**我们所不知道的过程**是：从用户输入 URL 到浏览器显示网页的那一刻，网页经历了一次完整的冒险。它作为 URL 从用户的浏览器出发，到达远程服务器，向服务器发送请求，并接收服务器对请求的响应。最后，它从服务器返回，并以网页的形式加载到用户的浏览器中。\n\
  \n![](img/Figure-1.7.jpg)\n\n**图 1.7：** 网页从 URL 到渲染页面的旅程\n\n让我们以 `https://www.google.com`\
  \ 为例来理解这个过程：\n\n![](img/Figure-1.8.jpg)\n\n**图 1.8：** 在浏览器中打开 `www.google.com`\n\
  \n1.  **获取域名**：当用户在浏览器中输入 URL `'https://www.google.com'` 时，浏览器会提取 URL 的主机名（有时也称为域名），并调用\
  \ DNS 服务器的服务。在 URL 中，主机名是 https（即协议）之后的部分。在我们的例子中，域名整体为 `www.google.com`。\n\n2.\
  \  **解析 IP 地址**：**域名系统**（**DNS**）服务器本质上是一个域名的公共目录。DNS 服务器包含主机名及其 IP 地址（分配给连接到计算机网络的设备的数字标签）的列表。DNS\
  \ 服务器查找 `www.google.com` 的 IP 地址，并将该 IP 地址返回给浏览器。\n\n3.  **创建 HTTP 请求**：浏览器为托管上述\
  \ IP 地址的服务器创建一个 HTTP 请求，并请求服务器发送 `www.google.com` 的 HTML 页面。\n\n4.  **返回响应**：如果请求成功，服务器会向浏览器发送一个\
  \ HTTP 响应，并在响应中附加 HTML 页面。\n\n    此时，我们假设我们的 HTML 页面如下所示（**免责声明**：实际页面与此完全不同，但为了简单起见，我们假设这是\
  \ HTML 响应）：\n\n    ```\n    1.  <html>\n    2.      <head>\n    3.          <title>Google</title>\n\
  \    4.      </head>\n    5.      <body>\n    6.          <h1>Google</h1>\n    7.\
  \          <div>\n    8.              <p>Search</p>\n    9.              <button>Search\
  \ Google</button>\n    10.         </div>\n    11.     </body>\n    12. </html>\n\
  \    ```\n\n    **代码 1.22：** 示例 HTML 响应\n\n5.  **创建 DOM 树**：当浏览器收到 HTML 时，它会尝试创建一个**文档对象模型**（**DOM**）树。（快速回顾\
  \ HTML：所有 HTML 标签都需要以 `'/'` 结束。）\n\n\n\n\n\n1.  当 HTML 解析器处理这个 HTML 文件时，它首先发现的是一个开放的\
  \ `html` 标签。因此，解析器将 `html` 标签添加到树的根节点。\n\n    ![](img/Figure-1.9.jpg)\n\n    **图\
  \ 1.9：** `html` 将被添加为根节点。\n\n2.  现在，解析器移动到下一行，并主动寻找刚刚添加到 DOM 树中的 `html` 的闭合标签。然而，它发现了另一个开放标签——`head`。由于\
  \ `html` 标签尚未闭合，解析器将 `head` 解释为 `html` 标签的子元素。因此，它在树的 `html` 根节点下创建了一个 `head` 分支。\n\
  \n    ![](img/Figure-1.10.jpg)\n\n    **图 1.10：** `head` 将被添加为子节点。\n\n3.  解析器现在改变了优先级，主动寻找\
  \ `head` 元素的闭合标签。然而，它发现了另一个名为 `title` 的标签。与上一个过程类似，HTML 解析器将 `title` 解释为 `head`\
  \ 标签的子元素。\n\n    ![](img/Figure-1.11.jpg)\n\n    **图 1.11：** `title` 被添加为 `head`\
  \ 的子节点。\n\n4.  在 `title` 标签内部，解析器遇到了一段文本 *Google*。由于这不是一个 HTML 元素，解析器将其作为内容添加到树的\
  \ `title` 分支中。解析器再次改变优先级，寻找 `title` 标签的闭合标签。\n\n5.  在文本 \"*Google*\" 之后，解析器终于遇到了\
  \ `title` 的闭合标签。由于现在已收到 `title` 的闭合标签，解析器认为该任务已完成，并向上移动一层到 `title` 标签之上，将任务改为寻找\
  \ `head` 元素的闭合标签。\n\n6.  接下来，解析器找到了 `head` 的闭合标签，因此完成了该过程，并向上移动一层到树的根元素，然后移动到代码的下一行。\n\
  \n7.  随着 `title` 和 `head` 元素闭合，解析器现在寻找 `html` 元素的闭合标签，但发现了一个名为 `body` 的新元素。经过与之前相同的过程，它将\
  \ `body` 解释为 `html` 的子元素。\n\n    ![](img/Figure-1.12.jpg)\n\n    **图 1.12：** `body`\
  \ 被添加为 `html` 的子节点。\n\n解析器类似地遍历整个 HTML 文件，直到找到 `html` 元素的闭合标签，并创建出如下所示的 DOM 树：\n\
  \n![](img/Figure-1.13.jpg)\n\n**图 1.13：** 最终的 DOM 树\n\n上述截图展示了 HTML 的最终 DOM 树。\n\
  \n借助这棵 DOM 树，现在可以访问 HTML 的所有元素，它们的内容和属性都存储在其中。每个 HTML 元素现在都被视为一个对象。\n\n# JavaScript\
  \ 与 DOM\n\n在上一节中，我们了解了 DOM 的结构。在本节中，我们将探讨 JavaScript（JS）如何利用 DOM 来获取元素并操作它们。\n\n\
  在 HTML 中，你一定学过类和 ID。JavaScript 基于这些概念来获取元素。JS 使用术语“Document 对象”来获取元素。Document 对象指的是已加载网页的入口点，即\
  \ DOM 树。你可以使用以下方法从 DOM 中选择元素：\n\n1.  `document.getElementById(id)`：使用此方法，JavaScript\
  \ 遍历 DOM 树，找到第一个具有相同 ID 的元素并终止搜索。因此，如果有多个元素具有相同的 ID，只会返回第一个元素。\n\n2.  `document.getElementsByClassName(classnames)`：在此方法中，JavaScript\
  \ 遍历整个 DOM 树，并定位所有具有括号内指定类名的元素。结果是一个元素列表，存储在类似数组的数据类型中，称为 HTMLCollection。此方法也可以仅在元素上调用，而不是在整个文档上调用。\n\
  \n3.  `document.getElementsByTagName(name)`：与上一个方法类似，JavaScript 遍历整个 DOM，收集所有具有相同标签名的元素，并将它们存储在\
  \ HTMLCollection 中。然而，此方法在继续之前会将括号内的名称转换为小写。因此，你需要小心那些以 *camelCase* 形式编写的元素。\n\n\
  4.  `document.querySelector(selectors)`：此方法返回与括号内添加的 CSS 选择器匹配的第一个元素。例如：\n\n   \
  \ 1.  `var element = document.querySelector('#container');`\n\n        **代码 1.23：**\
  \ `document.querySelector()` 示例\n\n要操作 HTML 元素的内容，你可以使用上述任何一种方法获取元素。之后，你可以使用名为 `innerHTML`\
  \ 的方法来获取元素的内容。例如：\n\n1.  `var content = document.getElementById('container').innerHTML;`\n\
  \n    **代码 1.24：** 使用 `innerHTML` 获取元素\n\n这里，`content` 将返回 ID 为 `container` 的元素内部的内容。\n\
  \n类似地，如果你想修改内容，可以使用相同的方法来设置内容。例如：\n\n1.  `document.getElementById('container').innerHTML\
  \ = \"Hello World\";`\n\n    **代码 1.25：** 更改元素的 HTML\n\n### 结论\n\n在本章中，我们回顾了 JavaScript\
  \ 的基本概念。我们涵盖了 JavaScript 中的变量、数据类型、运算符、条件语句和循环。我们还详细了解了 DOM 树以及 JS 如何利用 DOM 树来获取和操作元素。你很可能已经对我们刚刚讨论的主题有了很好的了解。然而，这些主题将为我们在本书中将要学习的高级概念奠定坚实的基础。\n\
  \n在下一章中，我们将开始探索开发者控制台，这是一个非常方便的工具，可以帮助你进行 JavaScript 编码和 Web 开发。\n\n### 要点\n\n*\
  \   已声明但未初始化的 JavaScript (JS) 变量是 `undefined`。它们与未声明的 JavaScript 变量不同。\n\n*   JS\
  \ 是一种动态类型语言。这意味着如果为声明的变量赋予一个具有不同数据类型的新值，该变量的数据类型可以改变。\n\n*   如果在数字字符串上使用 `+` 运算符，例如\
  \ `\"5\"+\"5\"`，它会拼接字符串并返回结果 `\"55\"`。但是，如果在数字字符串上使用任何其他算术运算符，例如 `\"5\" * \"5\"\
  `，它会对结果执行算术运算并返回数学值，例如上述情况下的 `\"25\"`。\n\n*   `==` 只比较值，而 `===` 比较值和数据类型。\n\n* \
  \  JavaScript 广泛使用 DOM 树来获取和操作 HTML 元素。\n\n### 选择题\n\n1.  **以下哪项不是 JavaScript 中的数据类型？**\n\
  \n    1.  string\n\n    2.  number\n\n    3.  int\n\n    4.  boolean\n\n2.  **以下哪项陈述不正确？**\n\
  \n    1.  `===` 对两个变量或值进行严格比较。\n\n    2.  JavaScript 是一种动态类型语言。\n\n    3.  `'200'+'2'`\
  \ 将返回 `'202'`。\n\n    4.  未初始化的变量返回 `undefined`。\n\n### 答案\n\n1.  c\n\n2.  c\n\n\
  # 第 2 章\n\n## 开发者工具\n\n在上一章中，我们回顾了 JavaScript 基本概念的知识。在本章中，我们将了解 Web 开发过程中 Web 开发者的最佳伙伴——*开发者工具*。\n\
  \n然而，在开始探索开发者工具（DevTools）之前，我们将快速了解另一个有用的 JavaScript 概念，称为*事件监听器*。之后，我们将通过一系列截图、实时编码（可选）和一些理论概念来探索\
  \ Google Chrome 浏览器的 DevTools。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   JavaScript 中的事件监听器\n\
  \n\n\n\n\n* 开发者工具简介\n* DevTools 中的面板\n* JavaScript 与 DevTools\n\n### 目标\n\n学习本章后，你应该能够理解\
  \ JavaScript 中的事件。你可以监听网页上发生的事件，并使用 JavaScript 处理这些事件，同时利用浏览器内置的开发者工具调试 JavaScript\
  \ 代码。\n\n# JavaScript 中的事件监听器\n\n在 Web 开发场景中，事件是发生在网页上的事件或动作。例如，用户尝试登录其 Gmail 账户。用户输入用户名和密码，然后点击`登录`按钮。如果用户名和密码正确，网页会显示用户的邮件；如果不正确，网页会显示错误消息。\n\
  \n在 JavaScript 中，点击按钮这个动作就是一个事件。网页会主动等待这个事件发生——这被称为事件监听。最后，点击`登录`按钮后显示用户邮件或错误消息的结果被称为*事件处理*。\n\
  \n在 JavaScript 中，事件在 Web 浏览器内部触发。这些事件可以附加到触发事件的元素、一组 HTML 元素、承载网页的 HTML 文档或整个浏览器窗口上。\n\
  \n除了点击之外，JavaScript 中还有许多其他事件。一些常见的事件包括：\n\n* 网页加载完成时。\n* 用户提交表单时。\n* 用户按下键盘上的某个键时。\n\
  * 用户悬停在某个 HTML 元素上时。\n* 发生错误时。\n\n让我们看一个如何为按钮添加事件监听器的示例：\n\n```\n<!DOCTYPE html>\n\
  <html>\n    <head>\n        <title>事件监听器</title>\n        <script src=\"./scripts/index.js\"\
  ></script>\n     </head>\n     <body>\n        <button id=\"btn\">\n           \
  \ 把我变红！\n        </button>\n    </body>\n</html>\n```\n\n**代码 2.1：** 用于添加事件监听器的\
  \ `index.html` 文件\n\n在上面的代码示例中，我们创建了 `index.html` 文件，其中包含一个 id 为 `'btn'` 的按钮。我们还在\
  \ `index.html` 文件中外部引入了 `index.js` 文件。\n\n```\nvar button = document.querySelector(\"\
  #btn\"); // 将元素存储在变量中\nbutton.addEventListener('click', function(event) {\nevent.target.style.backgroundColor\
  \ = 'red';\n});\n```\n\n**代码 2.2：** `index.js` 中添加事件监听器的 JavaScript 代码\n\n上面的代码示例展示了\
  \ `index.js` 文件，我们在其中为 *代码示例 2.1* 中定义的按钮 `'btn'` 添加了一个事件监听器。\n\n要添加事件监听器，你需要使用一个名为\
  \ `addEventListener` 的函数。`addEventListener` 函数需要在元素（或包含该元素的变量）上调用。\n\n它接受以下两个参数：\n\
  \n* 第一个参数是事件类型，例如 click、hover、keypress 等。（你可以在 [`developer.mozilla.org/en-US/docs/Web/Events`](https://developer.mozilla.org/en-US/docs/Web/Events)\
  \ 上查看完整的事件列表。）\n* 第二个参数是一个函数或代码块，当事件发生时需要执行它。这个事件处理函数带有一个可选的预定义参数。你可以随意命名它。这个可选参数存储了内置的\
  \ JavaScript 对象 `Event`，其中包含刚刚发生的事件的详细信息。\n\n**代码解释：** 在上面的 *代码示例 2.2* 中，我们在 `addEventListener`\
  \ 方法的函数参数中使用了可选的预定义参数，以获取按钮点击事件的更多详细信息。\n\n正如我们之前所学，我们可以给这个参数任意命名。在 *代码示例 2.2* 中，我们将其命名为\
  \ `event`。除了按钮点击事件的各种详细信息外，这个变量还包含一个名为 `target` 的键。`target` 键包含触发事件的 HTML 元素。在我们的例子中，这将是\
  \ id 为 `'btn'` 的按钮元素。因此，代码 `event.target` 指向发生此事件的 HTML 元素按钮。\n\n接下来，我们通过输入 `style.backgroundColor`\
  \ 将存储在 `event.target` 中的按钮的背景颜色改为红色。通过在 `event.target` 后输入 `style`，我们获取按钮的所有样式。然后，通过将\
  \ `backgroundColor` 添加到 `event.target.style`，我们获取元素的背景颜色属性。最后，我们将其改为 `'red'`。\n\n\
  # 开发者工具简介\n\n开发者工具，通常被称为 *DevTools*，是现代浏览器内置的一组强大工具。这些工具为 Web 开发者提供了非凡的功能，如下面的截图所示：\n\
  \n![](img/Figure-2.1.jpg)\n\n**图 2.1：** 开发者工具的功能\n\n开发者工具的功能如下：\n\n* 检查当前加载网页的 HTML、CSS\
  \ 和 JavaScript。\n* 实时编辑网页。\n* 显示构成网页 UI 的所有资源列表，包括图片、视频、XML 文档、PDF 等。\n* 计算每个资源从服务器下载到用户浏览器所需的时间。\n\
  * 模拟网页在不同设备（如不同手机、iPad、笔记本电脑等）上的显示效果。\n* 分析运行时性能，帮助用户优化网站速度。\n\n以上列表只是不同现代浏览器开发者工具中常见功能的集合。不同现代浏览器的开发者工具可能还提供一些上述之外的其他功能。\n\
  \n在本书中，我们将使用 *Google Chrome* 浏览器的开发者工具。在撰写本文时，我使用的是 *Google Chrome 版本 85.0.4183.83*。有关未来的更新和功能，请查看\
  \ [`developers.google.com/web/updates`](https://developers.google.com/web/updates)。\n\
  \n# 打开 DevTools\n\n有多种方法可以打开 Chrome DevTools。在本节中，我们将介绍所有不同的打开方式。你可以选择任何你觉得方便的方法。让我们看看以下不同的打开\
  \ Chrome DevTools 的方法：\n\n* **点击“检查”以查看特定 DOM 元素：** 打开 DevTools 的第一种方法是检查网页上的任何\
  \ HTML 元素。要检查一个元素，你需要完成以下步骤：\n\n  ![](img/Figure-2.2.jpg)\n\n  **图 2.2：** 点击“检查”打开\
  \ Chrome DevTools。\n\n  1. 在 Google Chrome 中打开一个网页。\n  2. 右键单击网页上的任何特定 UI 元素。如上面的截图所示，当你右键单击一个\
  \ UI 元素时，会出现一个下拉菜单。在屏幕上出现的下拉菜单中，点击“检查”。\n  3. Chrome DevTools 窗口将出现在网页的右侧。由于你是通过点击“检查”打开的\
  \ DevTools，它将在名为“元素”的面板中打开。（我们将在下一节中详细了解 Chrome DevTools 的不同面板。）\n\n  ![](img/Figure-2.3.jpg)\n\
  \n  **图 2.3：** Chrome DevTools 在网页右侧的“元素”面板中打开\n\n* **从 *Google Chrome* 工具栏打开 DevTools：**\
  \ 第二种方法是按照传统方式从 *Google Chrome* 的工具栏打开 DevTools。\n\n  ![](img/Figure-2.4.jpg)\n\n\
  \  **图 2.4：** 从 Chrome 工具栏打开 Chrome DevTools\n\n\n\n\n\n在 Google Chrome 工具栏的最右侧，你会看到三个垂直排列的点\
  \ `![](img/vert.jpg)`。点击这三个垂直点会弹出一个菜单。选择 `更多工具` -> `开发者工具`。\n\n*   **打开元素面板的键盘快捷键：**\
  \ 按下 `Control + Shift + C`（Windows 和 Linux 系统）或 `Command(⌘) + Shift + C`（Mac 系统）即可打开\
  \ Chrome DevTools 的元素面板。元素面板通常用于检查网页的 HTML 或 CSS。\n\n*   **打开控制台面板的键盘快捷键：** 按下 `Control\
  \ + Shift + J`（Windows 和 Linux 系统）或 `Command(⌘) + Shift + J`（Mac 系统）即可打开 Chrome\
  \ DevTools 的控制台面板。控制台面板通常用于运行 JavaScript 或查看记录的消息。\n\n*   **打开上次打开的面板的键盘快捷键：** 按下\
  \ `Control + Shift + I`（Windows 和 Linux 系统）或 `Command(⌘) + Option(⌥) + I`（Mac 系统）即可打开\
  \ Chrome DevTools 中你上次打开的面板。\n\n# DevTools 的面板\n\n如果你使用前面列出的任意方法打开 Chrome DevTools，你会看到\
  \ DevTools 顶部有一系列选项卡。这些选项卡被称为*面板*。DevTools 的每个面板都针对已加载网页的不同方面。在本章中，我们将主要了解 Sources（源代码）面板和\
  \ Console（控制台）面板，因为它们负责处理页面的 JavaScript。让我们简要了解一下 Chrome DevTools 的不同面板：\n\n*  \
  \ **元素面板：** 元素面板用于查看已加载网页的 HTML 和 CSS。你还可以双击某个元素或属性来更改其值，相应的更改会立即在网页上显示。元素面板的最佳功能之一是\
  \ CSS 盒子模型，它由以下截图右下角的多色框表示。它帮助你理解元素的放置方式、元素的尺寸、所占空间等更多信息。\n\n    ![](img/Figure-2.5.jpg)\n\
  \n    **图 2.5：** Chrome DevTools 的元素面板\n\n*   **控制台面板：** 控制台面板用于查看网页产生的消息、警告或错误。控制台面板也可以用于运行任何\
  \ JavaScript 代码。\n\n    ![](img/Figure-2.6.jpg)\n\n    **图 2.6：** Chrome DevTools\
  \ 的控制台面板\n\n*   **源代码面板：** 该面板对于调试已加载网页的 JavaScript 代码非常有用。你可以添加断点来查看代码在生命周期各个阶段的状态和变量。你还可以编辑\
  \ JavaScript 并将修改后的更改保存到磁盘。\n\n    ![](img/Figure-2.7.jpg)\n\n    **图 2.7：** Chrome\
  \ DevTools 的源代码面板\n\n*   **网络面板：** 在网络面板中，你可以查看网页的网络活动。网络活动包括浏览器为下载网页所需的各种资源（如 HTML\
  \ 文件、CSS 文件、图片、视频等）而发送的请求。你还可以观察每个资源下载所花费的时间。\n\n    ![](img/Figure-2.8.jpg)\n\n\
  \    **图 2.8：** Chrome DevTools 的网络面板\n\n*   **性能面板：** 性能面板用于监控网页的性能。该面板会提供关于从加载到渲染的每个过程所花费时间的详细信息。它还会生成网页的性能报告。\n\
  \n*   **内存面板：** 内存面板用于跟踪内存使用情况和内存泄漏。\n\n*   **应用面板：** 该面板包含以 cookie、本地存储（永久存储）或会话存储（临时存储）形式存储在浏览器中的用户数据。该面板还包含有关应用缓存、图片、字体和样式表的信息。\n\
  \n*   **安全面板：** 该面板涉及网页的安全性。\n\n# JavaScript 与 DevTools\n\n如前所述，Sources（源代码）面板和\
  \ Console（控制台）面板负责处理 Chrome DevTools 中的 JavaScript。使用 Chrome DevTools，我们可以对 JavaScript\
  \ 执行以下操作：\n\n*   查看或更改已加载网页的 HTML DOM。\n\n*   执行与网页无关的 JavaScript。\n\n*   暂停网页 JavaScript\
  \ 的执行，以查看或更改页面的 DOM。\n\n首先，让我们探索控制台面板和源代码面板。\n\n# 控制台面板\n\n控制台面板的主要任务是显示网页抛出的各种日志、错误或警告。不过，你也可以在控制台面板上执行完全无关的\
  \ JavaScript 代码。此外，当网页的 JavaScript 执行被暂停时，你可以打印并检查代码暂停前变量接收到的值。你甚至可以在执行暂停期间执行和测试与代码相关的条件。\n\
  \n![](img/Figure-2.9.jpg)\n\n**图 2.9：** 控制台面板\n\n上面的截图显示了 Chrome DevTools 的控制台面板。控制台面板有两个主要部分，分别用数字\
  \ 1 和 2 表示。\n\n## 控制台区域\n\n*图 2.9* 中数字 1 表示的部分是实际的控制台区域，它显示由网页的 JavaScript 记录的消息，或由浏览器本身记录的消息。\n\
  \n所有消息，无论其类别如何，在最右侧都有一个可点击的链接。每个链接代表该特定消息的来源。\n\n在 *图 2.9* 中，前三条消息的来源是文件 `index.js`。冒号（:）后面的数字表示记录该消息的行号。\n\
  \n最后三条消息的来源是直接在浏览器上编写的代码（脚本）——因此它们的来源链接被标记为 VM，后跟一个数字。由于脚本是在浏览器上编写的，这里的术语 VM 代表虚拟机，后跟一个分配给该浏览器脚本的\
  \ ID。如果你点击这些链接，它们会带你到 Sources（源代码）面板。\n\n此外，这个控制台区域也是一个自由区域，用于尝试任何 JavaScript 代码，即使它与网页本身无关。例如，在上面的\
  \ *图 2.9* 中，在红色消息下方，我们创建了一个数组 `numbers`，它存储了数字 2、3 和 4，以及一个 for 循环，用于打印数组 `numbers`\
  \ 中的每个数字。\n\n## 过滤区域\n\n*图 2.9* 中数字 2 表示的部分是控制台的过滤区域。它显示了一个侧边栏，该侧边栏对第 1 部分中显示的消息进行了分组。在尝试理解\
  \ *图 2.9* 中显示的侧边栏之前，让我们先了解一下控制台面板中显示的不同类型的消息。\n\n**消息（日志）的类型**\n\n首先，控制台消息（日志）有以下两个主要类别：\n\
  \n\n\n\n\n*   **用户消息**：用户消息（日志）是指用户记录到控制台上的消息，即要么是网页开发者为网页控制台编写的显式 JavaScript 代码，要么是查看控制台的用户编写的一些任意代码。例如，在*图\
  \ 2.9*中，for 循环执行后记录的消息，就是查看控制台的用户记录的消息。因此，它们属于用户消息类别。类似地，如果你点击前两条消息旁边的链接，它会在“源代码”面板中打开\
  \ `index.js` 文件。在这里，你会看到编写 `index.js` 文件的开发者输入了一个名为 `console.warn()` 和 `console.error()`\
  \ 的脚本。由于这些消息是由脚本记录的，而用户明确要求浏览器记录这些消息，因此它们也属于用户消息类别。\n\n    要筛选出所有用户消息，你可以点击侧边栏中的第二个项目，其关键字为“用户消息”。\n\
  \n    ![](img/Figure-2.10.jpg)\n\n    **图 2.10：** 在控制台上筛选用户消息\n\n    点击用户消息后，如果你比较*图\
  \ 2.9*和*图 2.10*，你会观察到一条以“`Uncaught TypeError`”开头、带有红色背景的消息不再显示在控制台上。这表明“`Uncaught\
  \ TypeError`”消息实际上是由浏览器记录的。\n\n*   **浏览器消息**：浏览器消息是指浏览器自身记录的消息。这些消息并非由网页开发者针对已加载网页编写的脚本所触发。当浏览器解析\
  \ JavaScript 代码，并认为网页可能存在某些问题时，就会记录这些消息。例如，在*图 2.9*中，当浏览器无法通过 id 'btn' 找到元素时，抛出了一个错误。因此，它无法应用样式。\n\
  \n如你在*图 2.10*中所见，还有另外四个类别的记录消息。这四个类别基于消息的严重程度。这四个类别分别是**详细**、**信息**、**警告**和**错误**。\n\
  \n*   详细消息指的是在浏览器上编写的代码。例如，*图 2.10*中的变量 numbers 和 for 循环属于详细类别。\n\n*   使用 `console.log()`\
  \ 记录的消息称为信息消息。\n\n*   作为警告的消息称为警告消息。它们在控制台上以淡黄色背景显示。也可以使用 `console.warn()` 手动打印。\n\
  \n*   最后，导致应用程序崩溃或有可能导致应用程序崩溃的消息属于错误消息类别。它们以亮红色背景显示。也可以使用 `console.error()` 手动记录。\n\
  \n# 控制台标题\n\n控制台面板的标题如下所示：\n\n![](img/Figure-2.11.jpg)\n\n**图 2.11：** 控制台面板的标题\n\
  \n让我们详细看看控制台面板标题的不同部分。然而，仅仅阅读这段文字可能无法帮助你理解它们。我个人建议你回到过去，像个孩子一样，尝试每个按钮，看看会发生什么。（*\
  \ 插入吐舌笑脸 *）\n\n*   第一个按钮 ![](img/Image47220.jpg) 用于显示/隐藏筛选部分，该部分在*图 2.9*中用数字 2 表示。\n\
  \n*   第二个按钮 ![](img/Image47230.jpg) 用于清除控制台上的所有消息。\n\n*   第三个部分 ![](img/Image47237.jpg)\
  \ 是一个下拉菜单，显示 JavaScript 上下文。默认情况下，它设置为 top，表示已加载网页的 DOM。但是，如果你的页面中嵌入了广告，该广告将是 iframe\
  \ 的一部分。此类 iframe 会在控制台上创建不同的上下文。通过选择上下文，你可以针对特定的网页文档筛选控制台消息。\n\n*   第四个按钮 ![](img/Image47245.jpg)\
  \ 用于创建实时表达式。如果你认为某个脚本总是需要在控制台上执行，你可以使用实时表达式来创建它。例如，它可以是当前显示网页的日期和时间。\n\n*   筛选框用于通过输入文本来筛选消息。\n\
  \n*   “默认级别”下拉菜单与*图 2.9*中用数字 2 表示的筛选部分相同。当筛选部分隐藏时，“默认级别”下拉菜单会显示消息的各种类别。\n\n*   最后，![](img/Image47256.jpg)\
  \ 按钮显示控制台的设置，其中包括即使在网页重新加载后也保留日志消息等选项。\n\n# 源代码面板\n\nChrome DevTools 中处理 JavaScript\
  \ 的两个面板中的第二个是源代码面板。源代码面板主要用于调试 JavaScript 代码。如下面的截图所示，源代码面板包含以下三个部分：\n\n1.  **文件导航器**窗格以文件夹形式显示页面请求的所有文件。\n\
  \n2.  **代码编辑器**窗格显示在文件导航器窗格中选择的文件的内容。\n\n3.  **JavaScript 调试**窗格用于检查页面的 JavaScript。\n\
  \n    ![](img/Figure-2.12.jpg)\n\n    **图 2.12：** 源代码面板\n\n我们将通过一个实时编码示例来理解源代码面板的不同窗格。在你的本地机器上创建一个名为\
  \ *Exploring DevTools* 的文件夹，并在其中添加一个 `index.html` 文件。在 *Exploring DevTools* 文件夹内再添加一个文件夹，并将其命名为\
  \ 'scripts'。\n\n**代码 2.3：** 用于 Exploring DevTools 的 index.html\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"UTF-8\">\n    \
  \    <title>Learning JavaScript</title>\n    </head>\n    <body>\n        <p id=\"\
  total\"></p>\n        <script src=\"scripts/console.js\"></script>\n    </body>\n\
  </html>\n```\n\n在 'scripts' 文件夹内，添加一个 JavaScript (JS) 文件，并将其命名为 `console.js`。\n\n\
  **代码 2.4：** 用于 Exploring DevTools 的 console.js\n\n```\nfunction add(n1, n2) {\n\
  \    var num1 = n1;\n    var num2 = n2;\n    var total = num1 + num2;\n    document.getElementById('total').innerHTML\
  \ = total;\n}\nadd(\"5\", \"4\");\n```\n\n当你保存这些文件并在浏览器中打开 `index.html` 时，你会注意到\
  \ `<p>` 元素得到的值是 54 而不是 9。（如果你不理解 `console.js` 中编写的代码，没关系。我们将在下一章介绍函数。）要理解我们的函数 `add`\
  \ 哪里出错了，我们的第一直觉会告诉我们，应该检查代码中执行加法的那部分。\n\nDevTools 的源代码面板可以通过断点暂停 JavaScript 的执行以及页面\
  \ UI 的渲染，从而帮助我们应对这种情况。然后，我们可以检查 JavaScript 代码，了解执行失败的位置。\n\n在我们的场景中，我们希望将 JS 执行暂停在变量\
  \ total 将两个数相加的位置，即在其值被添加到 id 为 `total` 的元素之前。要暂停执行，我们需要在代码中添加断点。有两种方法可以向 JS 代码添加断点：\n\
  \n\n\n\n\n* **为代码添加调试器**：要在代码中添加调试器，你需要在希望浏览器停止执行 JavaScript 的位置之前添加 `debugger`\
  \ 关键字。在我们的场景中，我们希望在计算总和后立即暂停执行。因此，它应位于 `document.getElementById()` 之前。添加调试器后，`console.js`\
  \ 中的代码将如下所示：\n\n```\nfunction add(n1, n2) {\n    var num1 = n1;\n    var num2 =\
  \ n2;\n    var total = num1 + num2;\n    debugger;\n    document.getElementById('total').innerHTML\
  \ = total;\n}\nadd(\"5\", \"4\");\n```\n\n**代码 2.5：** 添加调试器后的 console.js\n\n* **在\
  \ DevTools 中选择断点**：或者，你可以在“Sources”面板中通过单击某行代码旁边的行号来为该行添加断点。\n\n![](img/Figure-2.13.jpg)\n\
  \n**图 2.13：** 在 DevTools 上选择断点\n\n当你单击要添加断点的代码行旁边的数字时，会发生两件事：该数字上会出现一个蓝色箭头图标（表示这是一个断点），并且该特定行会被添加到\
  \ JavaScript 调试窗格中名为“Breakpoints”的部分。\n\n添加断点后，当你刷新网页时，JavaScript 执行将在断点所在行停止。\n\
  \n![](img/Figure-2.14.jpg)\n\n**图 2.14：** JavaScript 执行在调试器处暂停\n\n在第一种情况下，如上图所示，JS\
  \ 执行会在代码中添加了调试器的位置停止。\n\n在第二种情况下，如下图所示，JS 执行会在添加了蓝色断点的位置停止。\n\n![](img/Figure-2.15.jpg)\n\
  \n**图 2.15：** JavaScript 执行在蓝色标记高亮的行处暂停\n\n在这两种情况下，网页的渲染都会暂停。\n\n如果你仔细观察上面的截图，你会注意到以下几点：\n\
  \n1. 在**代码编辑器**窗格中，每一行代码旁边都会显示该行变量的值。同样，如果将鼠标悬停在任意变量名上，它会在工具提示中显示该变量的值。\n\n2. 在\
  \ JavaScript 调试部分的**作用域**窗格中，你可以看到到目前为止代码中使用的所有变量的值。\n\n多亏了断点，我们现在可以看到变量 `n1` 和\
  \ `n2` 接收到的值是字符串类型（由双引号表示）。正如我们之前所学，使用 `'+'` 运算符将两个字符串相加会拼接这两个字符串。要解决这个问题，我们需要将第\
  \ 2 行和第 3 行的字符串转换为数字。\n\n现在我们已经成功调试了代码，可以单击 JavaScript (JS) 调试窗格中的 ![](img/Image47412.jpg)（恢复脚本执行）图标来恢复页面的\
  \ JS 执行。如果存在另一个断点，JS 执行将在该断点处暂停。标题栏上的下一个按钮 ![](img/Image47422.jpg)（单步跳过）会继续暂停 JS\
  \ 执行，但也会将其移动到下一行代码。要尝试此操作，请在“Sources”面板中，在我们定义变量 `n1` 的第 2 行添加一个断点。当页面刷新时，JS 执行会在第\
  \ 2 行停止，并以绿色背景指示。如果你现在按下“单步跳过”功能，你会注意到网页仍然暂停，但绿色背景已移动到第 3 行。\n\n默认情况下，JS 执行不会进入函数或循环。按钮组\
  \ ![](img/Image47429.jpg)（单步进入和单步退出）用于进入和退出循环或函数内部的 JS 执行。\n\n按钮组中的第一个按钮 ![](img/Image47440.jpg)\
  \ 用于禁用所有断点，而第二个按钮用于确保每当抛出错误或异常时代码始终暂停执行。如果你单击“Sources”面板上的第一个按钮，你会看到它变成蓝色阴影。现在，当你刷新页面时，JS\
  \ 执行将不会暂停。第一个按钮会暂停“Sources”面板上添加的调试器和断点的执行。\n\n**提示：** 当 JavaScript (JS) 执行因断点或调试器而暂停时，在控制台面板中键入变量名（到目前为止在\
  \ JS 代码中使用过的）将在控制台中显示它们的值。这样，你可以在 JS 执行暂停时在控制台面板中执行表达式或测试条件。试试看！（将 JS 执行暂停在代码 *示例\
  \ 2.5* 的第 3 行，然后在控制台面板中键入 `n1`。）\n\n### 结论\n\n在本章中，我们回顾了 JavaScript 中事件和事件监听器的概念。我们还探索了使用\
  \ JavaScript 的 `Sources` 和 `Console` 面板调试 JavaScript 代码。最后，我们了解了用户或浏览器可以在控制台上记录的不同类型的消息。\n\
  \n在下一章中，我们将探讨 JavaScript 中函数的概念。函数可能是任何 JavaScript 开发者最有用的东西。\n\n### 要点\n\n* 在 JavaScript\
  \ (JS) 中，事件是网页上发生的事件或操作。你可以使用名为 `addEventListener()` 的 JS 函数来监听并处理这些事件。\n\n* Chrome\
  \ **开发者工具** (**DevTools**) 涵盖了网页的各个方面。网页的 JavaScript 可以通过 DevTools 的 Console 和 Sources\
  \ 面板进行处理和查看。\n\n* Console 面板显示用户或浏览器记录的不同类型的消息。消息可以是 Verbose（用户在控制台上键入的代码）、Info（使用\
  \ `console.log()` 记录的信息性消息）、Warning（由用户代码或浏览器触发的警告）和 Error（由用户代码或浏览器触发的错误）。\n\n\
  * Console 面板上由用户在 JavaScript 代码中记录的消息称为用户消息。当浏览器认为用户代码可能引发问题时，它会在控制台上记录错误或警告。这些错误或警告称为浏览器消息。\n\
  \n* 你可以通过向代码中添加调试器，或者通过在 Sources 面板上单击代码行旁边的行号来添加断点，从而暂停 JS 代码的执行。\n\n### 选择题\n\n\
  1. **以下函数中必须使用 e 参数。 – 正确还是错误？**\n\n```\ndocument.getElementById('btn').addEventListener('click',\
  \ function(e) {\n    e.target.innerHTML = 'Button clicked';\n})\n```\n\n**代码 2.6：**\
  \ 选择题 1\n\n1. 正确\n2. 错误\n\n2. **在 *代码示例 2.6* 中，当执行第 2 行时会发生什么？**\n\n1. 网页上会显示一个包含文本“Button\
  \ clicked”的警告框。\n2. 按钮内的文本变为“Button Clicked”。\n3. 文本“Button Clicked”被附加到按钮内的文本后面。\n\
  4. 按钮从网页上被移除。\n\n### 答案\n\n1. **b**\n2. **b**\n\n# 第 3 章\n\n## 函数\n\n让我们设想一个简单的场景。在我们的潜在\
  \ Web 应用程序中，我们将添加一个主要的登录流程，要求用户输入其电子邮件地址和密码。现在，当用户输入其详细信息并单击登录按钮时，会发生几件事。\n\n首先，我们将获取用户输入的电子邮件地址，并检查其有效性。如果该电子邮件地址存在于我们的数据库中，则意味着用户已注册我们的网站，并且用户输入的电子邮件地址是有效的。\n\
  \n\n\n\n\n接下来，我们将获取密码，并将其与用户添加到数据库中的密码进行匹配。如果密码匹配，则表明用户是真实的，我们可以允许其访问应用程序的主页。如果密码不匹配，我们需要在登录页面上告知用户输入的密码不正确。\n\
  \n如你所见，只需点击一个按钮，就会执行一段特定的代码，这段代码仅专属于登录过程。此外，每次用户尝试登录系统时，都需要执行这段代码。\n\n对于这种需要编写可重用代码块的情况，我们使用函数。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   探索函数\n*   函数的类型\n*   JavaScript 作用域\n*   JavaScript\
  \ 闭包\n\n### 目标\n\n学习完本章后，你应该能够成功理解何时以及如何创建函数。你将理解何时重用代码块，并为编写可重用的代码片段创建函数。本章将通过使用最新功能帮助你提升编码知识。\n\
  \n# 探索函数\n\n简单来说，JavaScript（JS）函数是一段旨在执行特定任务的代码块。可以把函数想象成一个容器，里面存放着为客人准备的昂贵餐具。只有当客人来访时，我们才会打开那个盒子使用精美的餐具。\n\
  \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** 将函数想象成存储代码的容器，只有在需要时才会打开\n\n在 JavaScript\
  \ 术语中，“存放餐具”或创建函数的实例被称为定义或声明函数。类似地，“在需要时打开餐具盒”或使用函数的行为被称为调用或执行函数。\n\n# 语法\n\nJS\
  \ 函数的语法（语句结构）如下：\n\n```\nfunction functionName(argument_1, argument_2, …, argument_n)\
  \ {\n    //要执行的代码\n}\n```\n\n**代码 3.1：** 函数声明的语法\n\n**解释**：要创建/声明一个 JS 函数，你需要执行以下四步：\n\
  \n1.  使用关键字 `function`。\n2.  通常，关键字 `function` 后面会跟一个表示函数的名称。编写函数名时，强烈建议使用驼峰命名法。\n\
  3.  接着是一对圆括号 `()`。在编程语言中，函数通常用一对圆括号表示。这些圆括号可以为空，也可以存储可在函数代码执行中使用的变量。这些变量称为参数。\n\
  4.  最后，由于函数的主要任务是存储一段可随时执行的代码块，这段代码块被存储在一对花括号 `{}` 内。\n\n**提示：** 给函数命名是一项极其关键的任务。可以这样想，如果你正在创建一个电子商务\
  \ Web 应用程序，那么你将创建数百个用于不同目的的函数。假设你创建了两个函数——`login` 和 `logsin`。`login` 函数检查用户名和密码，而\
  \ `logsin` 包含用户成功登录后要执行的代码块。现在，对于一个可能包含近 20000 行代码的大型平台（如电子商务应用程序）进行编码，你很有可能会在需要输入\
  \ `login` 的地方意外输入 `logsin`，反之亦然。这种输入错误甚至可能导致应用程序崩溃。想象一下，当你的应用程序在支付过程中崩溃时，用户对着屏幕大喊大叫的场景。为了避免这种情况，函数名应该清楚地告诉你该函数将执行什么任务。在前面的例子中，我们可以将这两个函数命名为\
  \ `onLogin` 和 `onLoginSuccess`。\n\n让我们通过一个简单的例子来理解前面的语法：\n\n```\nfunction add(number1,\
  \ number2) {\n    var sum = number1 + number2;\n    console.log(number1 + \" 和 \"\
  \ + number2 + \" 的和是 \" + sum);\n}\n```\n\n**代码 3.2：** 声明函数 add\n\n我建议你在本地机器上创建一个\
  \ JS 文件，或者在浏览器的控制台面板中键入上述代码，亲自尝试这个例子。\n\n在前面的代码中，我们创建了一个函数 `add`，用于将两个数字相加。如你所见，函数\
  \ `add` 接收两个值作为参数。它将这两个值相加，并将结果存储在一个名为 `sum` 的变量中。然后，它将变量 `sum` 打印到控制台。\n\n在前面的例子中，我们声明了一个用于将两个数字相加的函数。现在，让我们进入第二部分，即调用这个函数。\n\
  \n调用或执行函数的语法如下：\n\n```\nfunctionName(argument_1, argument_2, …, argument_n);\n```\n\
  \n**代码 3.3：** 函数调用的语法\n\n**解释**：要调用一个函数，我们只需写出函数名，然后加上一对圆括号 `()`。圆括号的唯一作用就是调用函数。如果在调用/执行函数时没有在函数名后添加圆括号，函数将不会被调用，因此也不会被执行。\n\
  \n在*代码 3.2* 中，我们声明了一个函数 `add`，用于将两个数字相加。现在，让我们使用在代码 3.3 中学到的语法来调用/执行我们的函数 `add`。\n\
  \n```\nadd(1, 2);\n```\n\n**代码 3.4：** 调用函数 add\n\n当你在 VS Code 或控制台中键入这段代码时，你应该会在控制台中看到一条语句，内容为\
  \ `1 和 2 的和是 3`。\n\n在下面的截图中，我们在浏览器的控制台面板中声明并调用了函数 `add`。如截图所示，我们通过使用不同的数字重复调用函数\
  \ `add`，展示了函数 `add` 的可重用性。\n\n![](img/Figure-3.2.jpg)\n\n**图 3.2：** 在控制台上声明并调用函数\
  \ add\n\n到目前为止，我们已经看到了需要并接受参数的函数。然而，有时你的函数可能不需要任何参数。例如，考虑这样一个场景：当我们的 Web 应用程序在用户的浏览器窗口中加载时，我们希望欢迎用户。让我们看一个无参数函数的例子：\n\
  \n```\nwindow.onload = greetUser();\nfunction greetUser() {\n    alert(\"欢迎来到亚马逊！\"\
  );\n}\n```\n\n**代码 3.5：** 无参数的函数\n\n在前面的*代码示例 3.5* 中，我们在窗口加载完成后调用函数 `greetUser`。关键字\
  \ `window` 指的是加载到用户浏览器窗口中的 HTML。在 HTML 加载时，浏览器调用函数 `greetUser`。由于函数 `greetUser`\
  \ 的唯一目的是调用带有文本 `欢迎来到亚马逊！` 的警告对话框，因此我们不需要任何参数。\n\n# 返回值的函数\n\n在*代码 3.2* 所示的例子中，我们有一个函数\
  \ `add`，它将两个数字相加并在控制台上显示结果。现在，考虑一个场景：函数 `add` 被用不同的值调用了两次。然后需要将函数执行的结果用于更改两个不同的\
  \ HTML 元素。你将如何解决这个问题？\n\n为了解决这类场景，我们使用一个名为 `return` 的关键字，在函数执行完成后将值返回。这个值将返回到调用该函数的代码行。让我们通过一个编码示例来理解这一点。在你的本地机器上创建一个名为\
  \ `Functions returning values` 的文件夹。在该文件夹内，创建一个 `index.html`，如*代码示例 3.5* 所示。在 `Functions\
  \ returning values` 文件夹内再创建一个文件夹，命名为 `scripts`。\n\n```\n<!DOCTYPE html>\n```\n\n\
  \n\n\n\n```\n<html>\n    <head>\n        <title>返回值的函数</title>\n    </head>\n  \
  \  <body>\n        <div>\n            2 和 3 的结果是 <span id=\"result1\"></span>\n\
  \        </div>\n        <div>\n            12 和 10 的结果是 <span id=\"result2\"></span>\n\
  \         </div>\n     </body>\n</html>\n```\n\n**代码 3.5：** index.html\n\n在 `scripts`\
  \ 文件夹内，创建一个名为 `index.js` 的文件，并在 `index.js` 文件中输入如下代码，如以下 *代码示例 3.6* 所示：\n\n```\n\
  function add(number1, number2) {\n    return number1 + number2;\n}\nvar result1\
  \ = add(2, 3);\nconsole.log(\"result1: \", result1);\nvar result2 = add(12, 10);\n\
  console.log(\"result2: \", result2);\ndocument.getElementById(\"result1\").innerHTML\
  \ = result1;\ndocument.getElementById(\"result2\").innerHTML = result2;\n```\n\n\
  **代码 3.6：** index.js 展示了返回值的函数 add。\n\n保存这两个文件后，当你打开 `index.html` 时，你将看到以下内容：\n\n\
  ![](img/Figure-3.3.jpg)\n\n**图 3.3：** 执行一个返回值的函数\n\n正如你在 DevTools 的控制台面板中所见，函数 `add`\
  \ 计算了传入参数的两个值的和，并将各自的结果返回到 `index.js` 中调用它的第 5 行和第 8 行。这些结果分别存储在第 5 行和第 8 行的变量 `result1`\
  \ 和 `result2` 中。然后这些值被填充到 id 为 `result1` 和 `result2` 的 HTML 元素中。\n\n# 函数的类型\n\n\
  在前面的章节中，我们看到了函数的简单声明及其后续执行。我们在前面示例中看到的函数 `add` 只是编写函数的一种风格。让我们来看看以下不同类型的函数：\n\n\
  *   **命名函数**：我们在示例 *代码 3.2* 中看到的函数 `add` 的声明就是命名函数的一个例子。在命名函数中，我们通过给函数起一个名字来创建它。\n\
  \n    ```\n    function add(number1, number2) {\n        return number1 + number2;\n\
  \    }\n    add(2, 3);\n    ```\n\n    **代码 3.7：** 命名函数\n\n*   **立即调用函数**：每当声明一个变量或函数时，全局内存（在我们的例子中，是浏览器的内存，可通过调用对象\
  \ `window` 访问）中就会为该变量/函数保留一个空间。\n\n    对于立即调用函数，我们在声明它们的同时就调用它们。因此，它们被称为 *立即调用函数*。立即调用函数的好处是，由于没有创建变量，它不会占用全局对象或全局内存中的空间。\n\
  \n    当你已经使用了大量全局内存，并且该函数的执行需要立即得到结果而不是等待结果时，立即调用函数尤其有用。\n\n    ```\n    (function\
  \ (number1, number2) {\n        return number1 + number2;\n    })(2, 3);\n    ```\n\
  \n    **代码 3.8：** 立即调用函数\n\n*   **匿名函数**：简单来说，匿名函数就是没有名字的函数。然而，与立即调用函数不同，匿名函数不会在声明时立即执行。如示例\
  \ *代码 3.9* 所示，我们复制了命名函数的示例 *代码 3.7*。但是，我们没有给函数起名字，而是让它保持匿名，并将函数存储在一个名为 `sum` 的变量中。\n\
  \n    ```\n    var sum = function(number1, number2) {return number1+ number2;};\n\
  \    sum(2, 4);\n    ```\n\n    **代码 3.9：** 将匿名函数添加到变量 `sum` 中\n\n    那么，为什么以及在哪里需要匿名函数呢？\n\
  \n    ```\n    setTimeout(function() {\n        console.log(\"这条消息会在 3 秒后出现\");\n\
  \    }, 3000);\n    ```\n\n    **代码 3.10：** 匿名函数作为 JavaScript 的 `setTimeout()` 方法的参数\n\
  \n    有两种主要场景可以使用匿名函数，如下所示：\n\n    1.  当函数非常短小时，最好省略名称，使函数声明保持简洁。\n\n    2.  当你将一个函数作为参数传递给另一个函数时。例如，在\
  \ *代码示例 3.10* 中，我们使用一个函数作为 JavaScript 方法 `setTimeout()` 的参数。在 *代码示例 3.10* 中，该函数将在等待\
  \ 3 秒后执行。\n\n*   **递归函数**：递归函数是一种不断调用自身的函数。递归函数在其代码块中还包含一个条件。如果条件不满足，递归函数将停止调用自身。解释递归函数的最佳示例是创建一个倒计时器。在以下\
  \ *代码示例 3.11* 中，函数 `countdown` 不断调用自身，直到变量 `nextNum` 的值为 0。\n\n    ```\n    function\
  \ countdown(number) {\n        console.log(number);\n        var nextNum = number\
  \ - 1;\n        if(nextNum > 0) {countdown(nextNum);}\n    }\n    countdown(5);\n\
  \    ```\n\n    **代码 3.11：** 递归函数示例\n\n*   **方法**：作为对象一部分的函数被称为 *方法*。例如，在 *代码示例\
  \ 3.12* 中，我们有一个匿名函数作为对象 `person` 中键 `getFullName` 的值。这个函数 `getFullName` 被称为对象 `person`\
  \ 的方法。要调用方法 `getFullName`，你需要输入 `objectName.functionName()` 或 `objectName[functionName]()`。\n\
  \n    ```\n    var person = {\n        firstName: \"John\",\n        lastName: \"\
  Doe\",\n        getFullName: function() {\n            console.log(this.firstName\
  \ + \" \" + this.lastName);\n        }\n    };\n    person.getFullName(); //John\
  \ Doe\n    ```\n\n    **代码 3.12：** 对象 `person` 的 `getFullName` 方法\n\n# JavaScript\
  \ 作用域\n\n为了理解作用域的概念，让我们想象一个动物园。在动物园里，每种动物都被关在各自的私人围栏里。如果动物园管理员决定把鹿和狮子关在同一个围栏里会怎样？同样，如果把长颈鹿和企鹅关在同一个冰冷的围栏里呢？这会导致问题。类似地，在\
  \ JavaScript 中，在函数内部定义的变量有自己的围栏或私有空间。这个空间被称为 *作用域*，函数外部的代码无法访问它。\n\nJavaScript 中有两种作用域：\n\
  \n*   **全局作用域**：全局作用域指的是所有函数和代码块之外的空间。这个作用域指的是整个 JavaScript 程序。每个函数和每个代码块都可以访问存储在全局作用域中的变量的值。\n\
  \n*   **局部作用域**：当变量在函数内部或一对花括号内部声明时，它的访问仅限于该函数或该花括号内部的代码块。函数或花括号外部的任何代码块都无法访问这个在函数内部定义的变量。这个变量是函数局部的，因此，这样的变量具有局部作用域。\n\
  \n    ```\n    var number = 25;\n    console.log(\"调用 1 | 函数外部且之前。数字: \", number);\n\
  \    function displayNumber() {\n        console.log(\"调用 2 | 重新初始化前函数内部。数字: \"\
  , number);\n        var number = 40;\n        console.log(\"调用 3 | 重新初始化后函数内部。数字:\
  \ \", number);\n    }\n    ```\n\n\n\n\n```\nconsole.log(\"Call 4 | After the function,\
  \ before calling the function. Number: \", number);\ndisplayNumber();\nconsole.log(\"\
  Call 5 | After the function, after calling the function. Number: \", number);\n\
  ```\n\n**代码 3.13：** JavaScript 作用域示例。\n\n执行这段代码时，结果如下：\n\n![](img/Figure-3.4.jpg)\n\
  \n**图 3.4：** 代码 3.13 执行后的结果\n\n以下是需要记住的几点：\n\n*   作用域链是从内向外工作的。这意味着当浏览器遇到一个变量时，它会在局部作用域内查找该变量。如果在局部作用域内没有找到，那么浏览器会在全局作用域中查找。如果在全局作用域中也找不到，则该变量被视为未定义。\n\
  \n*   在 *代码示例 3.14* 中，我们有两个函数——`func1` 和 `func2`。它们在全局作用域中分别声明。正如你在代码中看到的，其中一个函数\
  \ `func2` 在函数 `func1` 的代码块内部被调用。然而，在 `func1` 内部声明的变量在 `func2` 内部是不可访问的。这是因为这两个函数在全局作用域中是分别调用的。因此，这两个函数拥有各自独立的局部作用域。所以，在函数\
  \ `func1` 内部定义的变量 `i` 属于 `func1` 的局部作用域，因此在函数 `func2` 内部无法访问它。\n\n```\nfunction\
  \ func1() {\n    var i = 20;\n    func2();\n}\nfunction func2() {\n    console.log(i);\n\
  }\nfunc1(); //undefined\n```\n\n**代码 3.14：** 函数在全局作用域中分别定义\n\n*   当一个函数有多个嵌套（子）函数时，每个子函数都可以访问其祖先作用域中存储的所有变量。这种作用域被称为*词法作用域*。然而，这里需要注意的一点是，虽然子函数可以访问所有祖先的代码，但祖先的代码无法访问子函数的代码。让我们在\
  \ *代码示例 3.15* 中尝试词法作用域：\n\n```\nfunction grandparent() {\n    var g_age = 75;\n\
  \    parent();\n    function parent() {\n        var p_age = 50;\n        child();\n\
  \        function child() {\n            var c_age = 25;\n            console.log(g_age,\
  \ p_age, c_age);\n        }\n    }\n}\ngrandparent(); //75 50 25\n```\n\n**代码 3.15：**\
  \ 相互嵌套的函数\n\n# JavaScript 闭包\n\nJavaScript 中的闭包是一个函数，即使在父作用域关闭后，它仍然可以访问父作用域。通俗地说，它体现了私有函数的概念。像\
  \ Java 这样的高级编程语言包含私有和公共的概念。私有函数意味着除了拥有它的代码之外，其他任何代码都不能调用这些函数。JavaScript 中的闭包帮助我们实现这样的功能。让我们通过下面截图中的示例来理解闭包：\n\
  \n![](img/Figure-3.5.jpg)\n\n**图 3.5：** 闭包\n\n在上面的截图中，我们首先注意到变量 `add` 是一个匿名函数和一个立即调用函数的组合。现在，让我们先尝试理解在变量\
  \ `counter` 被定义之后（从第 3 行开始）的内部函数。在内部函数中，我们访问了在外部父匿名函数中定义的变量 `counter` 的值。（词法作用域，还记得吗？:P）内部函数更新了这个\
  \ `counter` 的值。它将变量 `counter` 的值增加 1 并返回这个值。因此，当函数 `add` 第一次被调用时，内部函数接收到的变量 `counter`\
  \ 的值是 0。接着，这个值 0 被增加到 1，然后这个值 1 被返回到第 3 行（函数被调用的地方）。到目前为止很简单，对吧？\n\n现在，我们从第 3 行的内部函数返回的值是\
  \ 1。然而，就在第 3 行内部函数定义之前，有一个关键字叫做 return。这个 return 语句属于外部匿名函数。所以基本上，内部函数返回的值现在变成了外部函数的值，并且正是这个值被外部函数返回。因此，当我们第一次调用函数\
  \ `add` 时，返回的值是 1。\n\n现在，当我们第二次调用函数 `add` 时，记住上一次执行中外部函数的值已经变成了 1。因此，内部函数现在接收到的值是\
  \ 1，然后它被更新为 2 并返回给外部匿名函数。因此，`add` 函数的第二次调用将给你值 2。\n\n类似地，第三次执行将使用保留的值 2，将其更新为 3，并返回值\
  \ 3。\n\n这种保留值的过程通常被理解为像 Java 这样的面向对象语言中的私有变量。在 JavaScript 中，我们使用这种方法来模拟私有变量的概念，这被称为*闭包*。\n\
  \n### 结论\n\n本章最重要的收获是如何重用代码。作为开发者，我们常常陷入重复编写代码的陷阱。\n\n重复代码不仅浪费你宝贵的时间，还意味着更多的代码行\
  \ = 更大的网页大小 = 从服务器下载所需时间更长 = 在浏览器上加载所需时间更长。\n\n简而言之，如果你不想让客户因为等待网页加载而感到厌烦，就重用你的代码。函数本质上就是完成任务的代码块。通常情况下，这些代码块需要被重复多次使用。因此，函数确实有助于你的网页加载得更快。\n\
  \n在下一章中，我们将学习数组——一种存储多个相关数据的方式。\n\n### 要点回顾\n\n*   函数帮助你编写可以反复重用的代码。编写函数不仅能节省你的时间，还能帮助你的页面加载得更快。\n\
  \n*   创建函数称为声明或定义函数。使用函数称为调用或执行函数。\n\n*   一对圆括号 '()' 是函数最重要的部分。只有存在这对圆括号时，函数才能被调用。\n\
  \n*   当你希望创建一个将被重用的函数时，最好给该函数命名。当你希望节省全局内存时，可以使用立即调用函数。当函数规模较小或需要将函数作为参数传递给另一个函数时，我们使用匿名函数。\n\
  \n*   在需要让函数反复调用自身，直到满足停止调用的条件时，使用递归函数。\n\n*   作为对象一部分的函数被称为方法。\n\n*   在函数或代码块内部定义的变量的可访问性称为局部作用域。在所有函数外部定义的变量的可访问性称为全局作用域。\n\
  \n*   最内层的嵌套函数可以访问其所有祖先的变量。这个概念称为词法作用域。\n\n*   JavaScript 闭包模拟了私有变量的概念。\n\n### 选择题\n\
  \n1.  **当我们需要将一个函数作为参数传递给另一个函数时，我们使用立即调用函数。——正确还是错误？**\n\n    1.  正确\n\n    2. \
  \ 错误\n\n2.  **以下代码的输出是什么？**\n\n    1.  `function grandparent() {`\n\n    2.  ` \
  \   var g_age = 75;`\n\n    3.  `    parent();`\n\n    4.  `    function parent()\
  \ {`\n\n    5.  `        var p_age = 50;`\n\n\n\n\n\n```\n        sibling();\n \
  \   }\n    function sibling() {\n        var s_age = 25;\n        console.log(g_age,\
  \ p_age, s_age);\n    }\n}\ngrandparent();\n```\n\n**代码 3.16：** 多选题第 1 题\n\n1. \
  \ 75 50 25\n2.  75 25 50\n3.  25 50 75\n4.  错误\n\n### 答案\n\n1.  **b**\n2.  **d**\n\
  \n# 第 4 章\n\n## 数组\n\n简单来说，我们使用数组来存储多个相关的值。\n\n比如，如果有人让你列出五款豪华汽车。你可能会回答：宝马、奥迪、奔驰、捷豹和兰博基尼。如果你仔细观察，所有这些名称/值都属于同一类别或同一类型，即汽车。\n\
  \n在 JavaScript 中，这个类别 `cars` 可以是一个数组，这个数组可以存储多个相同或相关概念的值，在这里就是汽车。\n\n在本章中，我们将深入探讨数组的概念。我们将从理解数组的思想开始。之后，我们将学习如何创建数组，最后，我们将探索数组的惊人方法。一如既往，强烈建议练习本章中展示的代码，以便更好地理解这些概念。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   数组介绍\n*   使用数组\n*   数组属性和方法\n\n### 目标\n\n学习本章后，你应该能够理解数组的概念，然后使用它们来存储多个相关的值。你将学会利用数组的卓越属性。\n\
  \n# 数组介绍\n\n在前面的介绍中，我们了解到数组用于存储多个相关的值。让我们继续使用介绍中探讨的例子。\n\n如果有人让你用 JavaScript 列出五款豪华汽车，你会怎么做？根据你目前所学，你会为每辆车创建一个单独的变量。我们的代码看起来像下面这样：\n\
  \n**代码 4.1：** 为每辆车列出变量\n\n```\nvar car1 = 'Audi';\nvar car2 = 'BMW';\nvar car3 =\
  \ 'Mercedes';\nvar car4 = 'Jaguar';\nvar car5 = 'Lamborghini';\n```\n\n由于我们只需要列出五辆车，创建五个不同的变量相当容易。然而，如果要求你列出地球上所有的汽车品牌，你会创建一千个单独的变量吗？创建数千个变量会带来几个问题。其中一些如下：\n\
  \n*   它会为数千个变量预留空间，从而污染全局内存空间。\n*   你可能会忘记创建的变量。例如，你经常会面临这样的问题：“我给存储宝马值的变量起了什么名字？”\n\
  *   如果你想遍历每个汽车品牌，只打印那些名字以 B 开头的汽车，该怎么办？\n*   如果你必须创建显示每个汽车品牌的 HTML 元素，你能想象完成这样一个简单任务需要付出多少努力吗？\n\
  \n为了解决所有这些问题，JavaScript 引入了数组的概念。\n\n数组是一个独特的变量，可以存储多个值。它可以在一个变量名下保存多个值！\n\n数组是有序的集合。这意味着存储在数组中的每个值都有一个指定的索引位置。如果你想获取集合中存储的任何值，你只需要通过其位置访问该值。\n\
  \n# 使用数组\n\n既然我们已经知道数组是什么，让我们首先了解数组是如何创建的。之后，我们将学习如何使用数组，以及在哪里使用它们。\n\n# 创建数组\n\n\
  之前，我们学习了创建变量。正如我们之前所学，要创建一个变量，我们需要声明一个变量，然后初始化它。类似地，要创建一个数组，我们需要声明并初始化数组。\n\n# 声明数组\n\
  \n有两种声明数组的方法，如下所示：\n\n*   **数组字面量**：使用数组字面量是创建数组的最简单方法。与变量类似，你需要使用一个 JavaScript\
  \ 关键字，后跟数组的名称。要声明一个数组，你需要将变量名赋值为方括号表示法。这些方括号表示法被称为数组字面量。这将创建一个空数组。\n\n    **代码 4.2：**\
  \ 使用数组字面量声明数组。\n\n    ```\n    var cars = [];\n    var numbers = [];\n    ```\n\n\
  *   **JavaScript 关键字 new**：第二种方法涉及使用 JavaScript 关键字 `new` 和 JavaScript 对象 `Array`，后跟一对圆括号。这种方法也会创建一个空数组。\n\
  \n    **代码 4.3：** 使用 JavaScript 关键字 new 声明数组。\n\n    ```\n    var cars = new Array();\n\
  \    var numbers = new Array();\n    ```\n\n虽然你可以使用这两种方法来声明数组，但强烈建议使用第一种方法声明数组。第一种方法更简单。它具有更好的可读性，并且执行速度也更快。\n\
  \n# 初始化数组\n\n与变量类似，声明数组后，我们初始化数组。由于数组可以存储多个值，每个值将用逗号分隔（如*代码示例 4.4* 所示）。数组可以存储任何数据类型的值。与数组的声明类似，有两种初始化数组的方法，如下所示：\n\
  \n*   **数组字面量**：对于使用数组字面量初始化的数组，你只需要输入数组名称，并在方括号内用逗号分隔赋值。正如你在下面的*代码示例 4.4* 中所见，数组可以存储任何数据类型的值。\n\
  \n    **代码 4.4：** 初始化数组字面量的数组\n\n    ```\n    cars = ['BMW', 'Audi', 'Mercedes',\
  \ 'Jaguar', 'Lamborghini'];\n    numbers = [2, 4, 5, 6, 8];\n    console.log(cars);\
  \ //(5) [\"BMW\", \"Audi\", \"Mercedes\", \"Jaguar\", \"Lamborghini\"]\n    console.log(numbers);\
  \ //(5) [2, 4, 5, 6, 8]\n    ```\n\n*   **JavaScript 关键字 new**：与前面的方法类似，你可以通过向圆括号内提供多个用逗号分隔的值来初始化使用\
  \ JavaScript 关键字 `new` 创建的数组。如*代码示例 4.5* 所示，需要在圆括号内添加用逗号分隔的值。\n\n    **代码 4.5：**\
  \ 初始化使用 new 关键字创建的数组\n\n    ```\n    cars = new Array('BMW', 'Audi', 'Mercedes',\
  \ 'Jaguar', 'Lamborghini');\n    numbers = new Array(2, 4, 5, 6, 8);\n    console.log(cars);\
  \ //(5) [\"BMW\", \"Audi\", \"Mercedes\", \"Jaguar\", \"Lamborghini\"]\n    console.log(numbers);\
  \ //(5) [2, 4, 5, 6, 8]\n    ```\n\n然而，这种方法的一个缺点是，当你在圆括号内添加一个单独的数字时，它会初始化一个数组，其长度由圆括号内传递的数字指定。如*代码示例\
  \ 4.6* 所示，它会创建一个具有指定长度的空值数组。\n\n**代码 4.6：** 使用单个数字初始化将创建空值\n\n```\nvar numbers =\
  \ new Array();\nnumbers = new Array(5);\nconsole.log(numbers); //(5) [empty × 5]\n\
  ```\n\n与变量类似，你也可以在同一行声明并初始化数组：\n\n**代码 4.7：** 在同一行声明并初始化数组。\n\n```\nvar cars = ['BMW',\
  \ 'Audi', 'Mercedes', 'Jaguar', 'Lamborghini'];\n```\n\n# 访问数组元素\n\n\n\n\n\n存储在数组中的值被称为数组的元素。正如我们之前所学，数组是有序的集合。这意味着数组中的每个元素都存储在一个索引位置上。在数组中，索引位置从\
  \ 0 开始。这基本上意味着数组的第一个元素位于位置 0，第二个元素位于位置 1，依此类推。\n\n让我们以*代码示例 4.7* 中创建的数组作为本节示例。数组通常用方框图形表示，如下面的截图所示：\n\
  \n![](img/Figure-4.1.jpg)\n\n**图 4.1：** 元素的位置\n\n要访问数组中的元素，你可以写出数组的名称，后跟方括号内的元素位置。如*代码示例\
  \ 4.8* 所示，要访问数组 `cars` 中的第三个元素，我们输入 `cars [2]`。\n\n```javascript\nvar cars = ['Audi',\
  \ 'BMW', 'Mercedes', 'Jaguar', 'Lamborghini'];\nconsole.log(cars[2]); //Mercedes\n\
  ```\n\n**代码 4.8：** 访问元素\n\n正如我们在*代码示例 4.9、4.10* 和*图 4.2* 中所见，在元素内部打印数组会打印出该元素内以逗号分隔的字符串值。\n\
  \n我们首先创建以下 `index.html`：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n    <title>Document</title>\n</head>\n<body>\n    <span\
  \ id=\"text1\"></span>\n    <script src=\"scripts/index.js\"></script>\n</body>\n\
  </html>\n```\n\n**代码 4.9：** 用于在 HTML 元素内打印数组的 index.html\n\n然后，我们创建以下 `index.js`：\n\
  \n```javascript\nvar cars = ['BMW', 'Audi', 'Mercedes'];\nconsole.log(cars);\ndocument.getElementById('text1').innerHTML\
  \ = cars;\n```\n\n**代码 4.10：** 用于在 HTML 元素内打印数组的 index.js\n\n最后，我们得到以下输出：\n\n![](img/Figure-4.2.jpg)\n\
  \n**图 4.2：** 在 HTML 元素内打印的数组。\n\n## 更改数组的元素\n\n要更改数组的元素，你需要访问需要更改的数组位置，并使用 `'='`\
  \ 赋予新值。\n\n```javascript\nvar cars = ['BMW', 'Audi', 'Mercedes'];\nconsole.log('更改元素前的汽车数组：',cars);\n\
  cars[1] = 'Jaguar';\nconsole.log('更改位置 1 的元素后的汽车数组：',cars);\ncars[7] = 'Rolls Royce';\n\
  console.log('更改位置 7 的元素后的汽车数组：',cars);\n```\n\n**代码 4.11：** 更改数组的元素 – index.js\n\
  \n如*代码示例 4.11* 及随后的*图 4.3* 所示，我们将数组 `cars` 中位置 1 的元素从 `Audi` 更改为 `Jaguar`。但是，如果你尝试更改一个远超出其实际长度的位置上的元素，则该元素会被添加，中间会填充空元素。\n\
  \n![](img/Figure-4.3.jpg)\n\n**图 4.3：** 更改数组元素的控制台面板\n\n## 数组属性和方法\n\n在前面的章节中，我们学到了很多关于数组的知识。我们了解了什么是数组、如何声明和初始化数组。更重要的是，我们确定了当需要将多个相关值存储在一个地方时，就会使用数组。\n\
  \n然而，数组的主要优势在于其属性和方法。在本节中，我们将探讨数组极其有用的属性和方法。\n\n### length\n\n数组的 `length` 属性返回数组的长度，即数组内元素的数量。\n\
  \n```javascript\nvar cars = ['BMW', 'Audi', 'Mercedes'];\nconsole.log(cars.length);\
  \ //3\n```\n\n**代码 4.12：** 数组的 length 属性\n\n### 访问数组的第一个和最后一个元素\n\n在上一节中，我们了解到要访问数组的一个元素，需要提供该元素的位置。按照这个逻辑，访问数组的第一个元素相当容易，因为每个数组的第一个位置都是\
  \ 0。\n\n然而，使用这个逻辑访问数组的最后一个元素则比较棘手，因为数组的大小会因数组而异。因此，我们永远无法真正知道最后一个元素的索引位置。\n\n多亏了\
  \ `length` 属性，我们现在可以访问元素的最后一个位置。如*代码示例 4.13* 所示，`array.length` 会给出数组的长度。由于数组从 0\
  \ 开始，最后一个元素始终是比整个数组长度小 1 的数字。这样，要访问数组的最后一个元素，我们只需将 `array.length-1` 作为数组的位置索引即可。\n\
  \n```javascript\nvar cars = ['BMW', 'Audi', 'Mercedes'];\nconsole.log(cars[0]);\
  \ //BMW\nconsole.log(cars.length - 1); //2\nconsole.log(cars[cars.length-1]); //Mercedes\n\
  ```\n\n**代码 4.13：** 访问数组的最后一个元素\n\n### 遍历数组\n\n在前面的章节中，我们已经见过几次 for 循环的实例。遍历数组所有元素的最佳方法是使用\
  \ for 循环。我们将数组的长度作为 for 循环应持续执行的条件。如下面的截图所示，经过几次迭代后，变量 `i` 的值将等于数组的长度。由于数组的条件部分检查的是\
  \ `i` 的值小于数组长度，因此条件会失败并跳出循环。\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4：** 遍历数组\n\n###\
  \ push 和 pop\n\n`push` 和 `pop` 方法用于向数组添加元素或从数组中移除元素。为了理解 `push` 和 `pop` 的概念，我们考虑一个建筑物或乐高积木块的例子。\n\
  \n想象一个数组就像一栋建筑，或者一块块叠起来的乐高积木。在这两种情况下，第一层或第一块总是放在最底部。同样，最后一层或最后一块总是位于最顶部。\n\n现在，让我们用这些积木块或建筑物作为类比来理解数组。就像建筑物一样，数组的第一个元素将位于最底部，而最后一个元素则位于最顶部。\n\
  \n![](img/Figure-4.5.jpg)\n\n**图 4.5：** 数组就像乐高积木块或建筑物\n\n现在，如果我要求你给建筑物增加一层，或者给你已经搭好的乐高积木块增加一块，你会把新的一层或新的积木块加在哪里？\n\
  \n在最顶部，对吗？以上述概念作为类比，如果你必须向数组添加一个新元素，你会把它放在最顶部，即最后一个元素之后。同样，移除元素的逻辑就是移除位于最顶部的元素。在这种情况下，如果你试图从建筑物的中间移除一层，可能会导致整个建筑物倒塌。\n\
  \n![](img/Figure-4.6.jpg)\n\n**图 4.6：** 推入和弹出元素\n\n如上图所示，推入（pushing）是指将一个元素放在数组的顶部（末尾）。弹出（popping）是指从数组的顶部（末尾）移除元素。如下面的截图所示，当你使用\
  \ `push` 方法时，需要在括号中提供一个值。然而，当你 `pop` 一个元素时，不需要添加任何值，因为它会移除数组中栈顶（数组末尾）的那个元素。\n\n\
  ![](img/Figure-4.7.jpg)\n\n**图 4.7：** 推入和弹出数组。\n\n### delete\n\n\n\n\n在前面的示例中，我们学习了如何从数组末尾移除元素。现在，如果你想从数组中间移除一个元素，该怎么办呢？\n\
  \n总会有这样的场景：你可能想从数组的某个特定位置移除一个元素。为了实现这一点，我们使用 `delete`。\n\n![](img/Figure-4.8.jpg)\n\
  \n**图 4.8：** 从数组的特定位置删除一个元素\n\n如上图所示，要从数组的特定位置删除一个元素，我们需要使用关键字 `delete`，后面跟上该元素在数组中的位置。\n\
  \n但请记住，使用 `delete` 删除数组中的元素会在数组中留下一个空位。它不会让数组中的元素移动位置来填补这个未定义的空白空间。\n\n# shift 和\
  \ unshift\n\n之前我们学过，`push` 和 `pop` 会从数组末尾移除元素。在本节中，我们将学习如何从数组开头添加和移除元素，且不会在开头留下空位。\n\
  \n`push` 和 `pop` 的优势在于，由于它们操作的是数组末尾，既不会替换元素，也不会在数组中留下难看的空洞。想象一下，如果你想在数组开头添加一个元素。如下图所示，你可能会使用\
  \ `cars[0]` 来尝试向数组添加新元素。然而，它只会替换数组第一个位置的元素。类似地，删除数组的第一个元素会移除第一个位置的 'Jaguar' 元素。在理想情况下，如果我们从数组中删除一个元素，我们希望数组的大小减少\
  \ 1，并且希望数组中的元素移动位置来填补空位。但是，正如我们在前面章节中看到的，`delete` 并不是这样工作的。\n\n![](img/Figure-4.9.jpg)\n\
  \n**图 4.9：** 添加和移除数组的第一个元素\n\n为了解决这个问题，在处理数组的第一个元素时，JavaScript 引入了 `shift` 和 `unshift`\
  \ 方法。与 `push` 和 `pop` 类似，`shift` 和 `unshift` 会从数组中移除和添加元素，只不过是在第一个位置（即数组开头）进行操作。\n\
  \n如下图所示，要使用 `shift`，我们只需调用 `shift` 方法。JavaScript 会自动删除数组的第一个元素，并将剩余元素向前移动一个位置。打印\
  \ `shift` 方法会显示刚刚被移除的元素。类似地，要对数组执行 `unshift`，我们需要提供一个元素，该元素将被添加到数组的开头。当我们使用 `unshift`\
  \ 时，JavaScript 会自动让其余元素向后移动一个位置，并将新元素添加到现在空出的第一个位置。打印 `unshift` 方法会返回数组的长度。\n\n\
  ![](img/Figure-4.10.jpg)\n\n**图 4.10：** 添加和移除数组的第一个元素\n\n你可以通过下图直观地理解这一点：\n\n![](img/Figure-4.11.jpg)\n\
  \n**图 4.11：** 形象化展示 shift 方法。unshift 则按相反方向工作。\n\n# splice 和 slice\n\n在前面的章节中，我们了解了添加和移除元素的不同方式。然而，它们最终都会在数组中留下未定义的空白空间。因此，JavaScript\
  \ 引入了两种方法，用于从数组的任意位置添加或移除元素。让我们先来理解 `splice()` 方法。\n\n# 拼接数组\n\n`splice()` 方法接受多个参数。第一个参数指定数组中需要添加新元素的位置索引；第二个参数定义要移除多少个元素；其余参数定义要添加的新元素。让我们通过一个示例来理解。\n\
  \n![](img/Figure-4.12.jpg)\n\n**图 4.12：** 使用 splice 向数组添加元素，但不移除任何元素\n\n代码解释：在上图中，我们调用\
  \ `splice` 方法，并将位置索引 1 作为第一个参数。这意味着 JavaScript 会在位置索引 1 处添加新元素。`splice` 方法的第二个参数是\
  \ 0，表示我们不想移除任何元素。最后，其余参数是要添加的新元素。因此，最终结果是，其余参数（Jaguar 和 Rolls Royce）被添加到数组 `cars`\
  \ 的第一个位置，且没有移除任何值。\n\n现在，让我们看看代码示例的另一个版本，如*图 4.12* 所示。在下面的代码示例中，如*图 4.13* 所示，我们不再将第二个参数设为\
  \ 0，而是设为 2。由于第二个参数表示需要移除的元素数量，因此我们移除了数组中的接下来两个元素，即 Audi 和 Mercedes。现在，我们在第二个参数之后又提供了两个值，因此这两个参数（Jaguar\
  \ 和 Rolls Royce）将从位置 1 开始添加。这样，我们就实现了替换。\n\n![](img/Figure-4.13.jpg)\n\n**图 4.13：**\
  \ 使用 splice 替换元素\n\n# 切片数组\n\n`slice` 方法与 `splice` 方法类似，但有两个主要区别，如下所示：\n\n*   它只接受两个参数——起始位置和一个可选的结束位置。\n\
  \n*   它不会影响原数组。它会创建一个新数组。\n\n让我们通过以下示例来理解 `slice` 方法：\n\n![](img/Figure-4.14.jpg)\n\
  \n**图 4.14：** 切片数组\n\n在上图中，我们使用了 `slice` 方法的两种变体。\n\n在第一种方法中，我们只提供了第一个参数，即切片开始的位置。当\
  \ `slice` 方法只接收一个参数时，它会将原数组 `cars` 从第一个参数指定的位置开始，一直到数组末尾，复制到一个新数组中。因此，如*图 4.14*\
  \ 所示，`updatedCars` 数组从 Audi 开始，一直到最后一个元素 Rolls Royce。\n\n在第二种方法中，我们提供了两个值：1 和 3。在这种情况下，数组\
  \ `cars` 的切片从索引位置 1 开始，在索引位置 3 之前停止。因此，两个元素被复制到新数组 `updatedCars2` 中。\n\n**注意：**\
  \ `splice` 方法会影响原数组。这意味着当在其上调用 `splice` 方法时，原数组会被改变。然而，`slice` 方法不会影响原数组。实际上，当你对原数组应用\
  \ `slice` 时，会创建一个新数组。\n\n# concat\n\n当你想要合并两个或多个数组时，可以使用 JavaScript 数组的 `concat`\
  \ 方法。如*图 4.14* 所示，要使用 `concat` 方法，我们首先需要指定一个根数组，其他数组将合并到该根数组中。在*图 4.15* 中，我们使用数组\
  \ `comfyCars` 作为根数组。在根数组上，调用 `concat` 方法，并在括号中按顺序提供你想要合并到根数组中的数组。在*图 4.15* 中，我们在括号中提供了数组\
  \ `vipCars` 和 `luxuryCars`。结果是一个新数组，其中包含这三个数组中的所有值。\n\n如下图所示，`concat` 方法不会检查重复值。它只是简单地将数组合并：\n\
  \n![](img/Figure-4.15.jpg)\n\n**图 4.15：** 在数组上使用 concat 方法\n\n# toString\n\n\n\n\
  \n\n如果你想将数组转换为字符串，有两种方法可以实现。第一种方法，你只需在要转换为字符串的数组上调用 `toString` 方法。它会将数组转换为逗号分隔的字符串，如下面的截图所示：\n\
  \n![](img/Figure-4.16.jpg)\n\n**图 4.16：** 使用 `toString` 方法。\n\n# join\n\n在前一种方法中，数组被转换为字符串，值之间默认使用逗号分隔符。而在\
  \ `join` 方法中，你可以为字符串指定一个分隔符。如下面的截图所示，我们使用了分隔符 `'-'` 来分隔数组中的值。\n\n![](img/Figure-4.17.jpg)\n\
  \n**图 4.17：** 使用 `join` 方法。\n\n### 结论\n\n在本章中，我们学习了大量关于数组的知识。我们详细了解了数组的概念，学习了需要使用数组的场景、如何使用数组，以及更重要的是，如何使用数组的一些显著特性。\n\
  \n在下一章中，我们将学习另一种 JavaScript 数据类型——*对象*。与数组类似，对象也用于存储多个值。\n\n### 要点回顾\n\n*   数组用于存储多个相关的值。\n\
  *   你可以通过在方括号内指定值来定义数组。\n*   当你尝试访问数组中超出其长度的位置时，会得到 `undefined`。\n*   数组是有序集合，存储在数组中的每个元素都有一个索引位置。\n\
  *   数组从位置索引 0 开始。\n\n### 选择题\n\n1.  **数组的 `slice` 方法不会影响原数组——正确还是错误？**\n    1. \
  \ 正确\n    2.  错误\n\n2.  **如果在 `splice` 方法中只提供前两个参数为非零整数值，会发生什么？**\n    1.  `splice`\
  \ 方法将无法工作。\n    2.  元素不会被移除。\n    3.  元素只会被移除，不会添加新元素。\n    4.  `splice` 方法只接受一个值。\n\
  \n### 答案\n\n1.  **a**\n2.  **c**\n\n# 第 5 章\n\n## 对象\n\n在本章中，我们将学习 JavaScript 最基础的概念之一——*对象*。在互联网上，几乎每一篇\
  \ JavaScript 的介绍都会称其为一种基于**面向对象编程**（**OOP**）的松散语言。\n\n简单来说，OOP 将现实生活中的事物视为对象。例如，想象一个人。几乎每个人都会有名字，以及一组身体特征，比如在这个例子中的眼睛。然而，这些特征可能因人而异。在\
  \ JavaScript 中，每个个体被视为一个对象，而每个人的每个对象都拥有自己私有的特征。\n\n现在，比较两种场景——为每个个体分配一个单独的变量，与创建数百个描述同一个个体的变量。从各方面来看，前者比后者好得多。这种通过创建对象来组织数据的方式极大地帮助开发人员高效地维护和使用\
  \ JavaScript 中的数据。在本章中，我们将深入学习 JavaScript 对象。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*\
  \   介绍对象\n*   使用对象\n*   对象属性和方法\n*   对象构造函数\n*   对象原型\n\n### 目标\n\n学习本章后，你应该能够理解\
  \ JavaScript 的核心——对象。通过本章，你将能够高效地创建和使用对象。你将学习如何创建对象的蓝图，并区分对象与数组。\n\n# 介绍对象\n\n让我们通过另一个例子来理解对象——汽车：\n\
  \n![](img/Figure-5.1.jpg)\n\n**图 5.1：** 作为对象的汽车\n\n如果你深入思考，几乎每个现实生活中的事物都具有两个特征：它拥有属性，也拥有方法（行为）。让我们以上面截图中的汽车为例。\n\
  \n每辆汽车都有几个属性。其中一些属性如下：\n\n*   制造该车辆的公司的名称（例如，*福特*、*日产*、*宝马*等）\n*   车辆的型号或款式（例如，*福特野马*、*日产\
  \ GT-R*、*宝马 X4*等）\n*   汽车的颜色\n*   汽车是否配备天窗\n*   车辆是双座还是四座汽车\n\n类似地，每辆汽车都有几个方法，或者简单来说，与车辆相关的行为。例如，其中一些方法如下：\n\
  \n*   右转\n*   左转\n*   倒车\n*   打开前灯\n\n每辆汽车肯定都拥有这些属性和行为。然而，这些属性的值会因车而异。同样，不同的汽车也会在不同的时间执行各种方法。\n\
  \n*JavaScript 借助对象来模拟现实生活物品的这些属性和方法。*\n\nJavaScript 对象与 JavaScript 数组类似，因为它们都可以存储多个值。然而，两者之间（除了语法之外）的显著区别在于，你可以为存储的每个值赋予一个名称。与数组不同，对象是无序集合。它们不存储值的索引位置。\n\
  \nJS 对象的语法是以 `name: value` 格式存储值。这些 `name: value` 格式的集合将被包裹在花括号内。\n\n例如，上面截图中汽车的示例可以存储在一个对象中，如下面的*代码示例\
  \ 5.1*所示：\n\n```\nvar car = {\n    companyName: 'BMW',\n    model: 'X4',\n    color:\
  \ 'white',\n    turnRight: function() {\n        //code for turning right\n    },\n\
  \    applyBrakes: function() {\n        //code for applying brakes\n    }\n}\n```\n\
  \n**代码 5.1：** 将汽车存储在对象中\n\n在上面的*代码示例 5.1*中，我们以 `name: value` 格式存储了汽车的各种属性。因此，公司名称存储为\
  \ `companyName: 'BMW'`；汽车颜色存储为 `color: 'white'`，以此类推。类似地，汽车的行为或方法存储为函数。在下一节中，我们将看另一个\
  \ JavaScript 示例。\n\n# 使用对象\n\n现在我们对 JavaScript 对象有了基本了解，让我们学习如何创建和使用 JS 对象。正如我们之前学习变量和数组时那样，在\
  \ JavaScript 中，我们可以通过声明和初始化来创建对象。\n\n# 对象定义\n\n有三种不同的方式来定义（声明 + 初始化）一个对象。这三种方法如下：\n\
  \n# 对象字面量\n\n这是创建 JavaScript 对象最简单的方法。对象字面量是花括号内的一组 `name: value` 对列表。\n\n```\n\
  var person = {\n    firstName: 'John',\n    lastName: 'Doe',\n    age: 24\n}\n```\n\
  \n**代码 5.2：** 对象字面量的示例\n\n如上面的*代码示例 5.2*以及之前展示的*代码示例 5.1*所示，要使用对象字面量创建 JavaScript\
  \ 对象，我们添加几个 `key: value` 对，将它们放在一对花括号内，并为变量命名。\n\n# JavaScript 关键字 new\n\n要使用关键字\
  \ `new` 定义 JavaScript 对象，你需要创建一个变量，并将其赋值为 `new Object()`。\n\n```\nvar person = new\
  \ Object();\nperson.firstName = 'John';\nperson.lastName = 'Doe';\nperson.age =\
  \ 24;\n```\n\n\n\n\n\n**代码 5.3：** 使用 JavaScript 关键字 `new` 定义对象的示例\n\n如 *代码示例 5.3*\
  \ 所示，我们通过输入对象变量名后跟点号和键名来添加对象的键（名称）。如果仔细查看 *代码示例 5.2* 和 *5.3*，你会发现 *代码示例 5.2* 中使用了冒号表示法（`:`）来定义键和值，而在\
  \ *代码示例 5.3* 中，我们使用等号（`=`）为对象赋值。\n\n简单来说，当你在对象字面量（花括号）内为键赋值时，使用冒号表示法（`:`）。\n\n但是，如果你在花括号外为对象的键赋值，则使用等号表示法（`=`）。\n\
  \n**注意：** 在我们刚刚探讨的两种创建 JavaScript 对象的方法中，始终推荐使用第一种方法创建对象。使用 `new` 关键字创建对象的执行速度较慢，可读性也比对象字面量差。\n\
  \n# 构造函数\n\n目前，我们只需将构造函数视为对象的蓝图。我们将在“对象构造函数”一节中进一步了解这种方法。\n\n# 对象属性和方法\n\n在 *代码示例\
  \ 5.2* 中，我们创建了一个包含多个 `key: value` 对的对象 `person`。正如我们之前所学，每个对象都可以包含属性（特征）和行为（方法）。在本节中，我们将探讨对象的属性和方法。\n\
  \n# 对象属性\n\nJavaScript 对象中的 `key: value` 对称为该对象的属性。可以将属性视为描述对象的特征。例如，考虑 *代码示例 5.2*，我们有一个对象\
  \ `person`，它包含以下属性（特征）：\n\n| 属性 | 属性值 |\n| --- | --- |\n| `firstName` | John |\n\
  | `lastName` | Doe |\n| `Age` | 24 |\n\n**表 5.1：** 对象 `person` 的属性\n\n我们可以将这些属性可视化在对象\
  \ `person` 上（为了直观说明，额外添加了一个名为 `eyeColor` 的属性），如下图所示：\n\n![](img/Figure-5.2.jpg)\n\
  \n**图 5.2：** 对象 `person` 的属性\n\n如前面的 *表 5.1* 和 *图 5.2* 所示，人的名字本质上就是该人的一个特征或属性，其值为\
  \ John。同样，*图 5.2* 和 *表 5.1* 中描绘的人还具有其他属性，例如姓氏、年龄和眼睛颜色。\n\n# 访问对象属性\n\n我们可以通过以下两种方式访问对象的属性：\n\
  \n## 点号表示法\n\n如 *代码示例 5.4* 所示，要访问 *代码示例 5.2* 中对象 `person` 的属性 `firstName`，我们写出对象名称，后跟一个点号（`.`）和要访问的属性（键）名称。\n\
  \n```\nperson.firstName //John\n```\n\n**代码 5.4：** 使用点号表示法访问对象\n\n## 方括号表示法\n\n\
  访问对象属性的第二种方法是方括号表示法。在这种方法中，如 *代码示例 5.5* 所示，我们写出对象名称，后跟方括号（`[]`）。在方括号内，我们用单引号或双引号写出要访问的属性（键）名称。\n\
  \n```\nperson[\"firstName\"]; //John\n```\n\n**代码 5.5：** 使用方括号表示法访问对象\n\n我们对键名使用引号，因为它不是我们创建的变量。如果我们创建了一个名为\
  \ `firstName` 的变量，其值为字符串 `firstName`，那么我们可以不加引号地添加键名。\n\n```\nvar firstName = \"\
  firstName\";\nperson[firstName]; //John\n```\n\n**代码 5.6：** 使用方括号表示法和变量访问对象\n\n\
  ## 更改对象属性\n\n类似地，如果要更改对象的属性，可以使用上述方法访问属性名称，然后使用等号（`=`）设置新值，如下面的 *代码示例 5.7* 所示：\n\
  \n```\nconsole.log(\"更改 firstname 的值之前：\", person.firstName);    //John\nperson[\"\
  firstName\"] = \"Jane\";\nconsole.log(\"更改 firstname 的值之后：\", person.firstName);\
  \    //Jane\n```\n\n**代码 5.7：** 更改对象中键的值\n\n## 显示对象属性\n\n如果尝试在 HTML DOM 中显示对象，它会打印出\
  \ `[object Object]`，这显然不是我们想要的。\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3：** 在 HTML\
  \ 上显示对象会显示 `[object Object]`\n\n要打印对象，可以采用以下方法之一。\n\n### 按名称显示对象属性\n\n要按名称显示对象属性，只需写出对象名称，后跟点号或方括号表示法以及键名。这将在\
  \ HTML 上显示对象属性的值。\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 使用属性名称显示对象\n\n### 通过循环遍历属性显示对象\n\
  \n另一种打印对象的方法是遍历整个对象并逐个打印值。如下面的截图所示，你可以使用一种特殊的 `for` 循环来访问对象的每个属性。这种 `for` 循环称为 `for...in`\
  \ 循环。`for...in` 循环会逐个遍历整个对象。我们需要提供一个变量，该变量将存储每次迭代中访问的属性的键。\n\n![](img/Figure-5.5.jpg)\n\
  \n**图 5.5：** 使用 `for...in` 循环显示对象\n\n### 使用 Object.values()\n\n`Object.values()`\
  \ 方法以数组形式返回括号内传递的对象的所有值。如下面的截图所示，你可以使用这个数组在 HTML 上打印这些值。\n\n![](img/Figure-5.6.jpg)\n\
  \n**图 5.6：** 使用 `Object.values()` 显示对象\n\n# 对象方法\n\n我们已经看到，JavaScript 对象可以存储多种数据类型的值，例如字符串、数字、布尔值等。在\
  \ JavaScript 中，对象也可以存储函数。正如我们在前面关于函数的章节中所看到的，存储在对象内部的函数称为*方法*。\n\n```\nvar person\
  \ = {\n    firstName: 'John',\n    lastName: 'Doe',\n    age: 24,\n    fullName:\
  \ function() {\n        return this.firstName + \"  \" + this.lastName\n    }\n\
  }\n```\n\n**代码 5.8：** 更改对象中键的值\n\n如前面的 *代码示例 5.8* 所示，我们在对象 `person` 中添加了一个键 `fullName`。这个键\
  \ `fullName` 包含一个函数，该函数返回对象 `person` 的键 `firstName` 和键 `lastName` 的字符串拼接结果。\n\n\
  ## 'this' 关键字\n\n在 JavaScript 函数中，`this` 关键字指向该函数的所有者。在前面的 *代码示例 5.8* 中，`fullName`\
  \ 内部函数的所有者是对象 `person`。因此，在 `fullName` 的函数内部，`this` 指向对象 `person`，而 `this.firstName`\
  \ 将指向对象 `person` 中的键 `firstName`。\n\n要访问对象内部的方法，你需要输入对象名称，后跟点号或方括号表示法，以及一对圆括号 `()`。\n\
  \n![](img/Figure-5.7.jpg)\n\n**图 5.7：** 调用对象方法\n\n\n\n\n\n如前面的截图所示，如果你忘记添加括号，它只会打印该方法的函数定义。只有添加括号后，你才能调用该函数。\n\
  \n# 对象与原始值\n\n在 JavaScript 中，原始值是指没有任何属性或方法的值。JavaScript 中有以下五种原始值数据类型：\n\n* string\n\
  * number\n* boolean\n* null\n* undefined\n\n如果仔细观察原始值，你会发现原始值是不可变的，也就是说，这些值不能被改变。\n\
  \n1. `var name = 'John Doe';`\n\n    **代码 5.9：** 一个字符串类型的原始值\n\n在上面的代码示例 5.9 中，我们可以为变量\
  \ `name` 设置一个不同的值，但无法改变字符串 `John Doe` 本身的值。\n\n而对象则是可变的。在上面的代码示例 5.7 中，我们看到可以改变对象内部某个属性的值。这默认意味着对象的值发生了变化。\n\
  \n原始值（如字符串、布尔值等）与非原始值（如对象和数组）之间的另一个主要区别是：原始值按值复制，而非原始值按引用复制。我们来理解一下两者的区别。\n\n# 按值复制\n\
  \n为了理解*按值复制*的概念，我们来看下面的例子：\n\n1. `var number1 = 50;`\n\n    **代码 5.10：** 设置变量 `number1`\
  \ 的值\n\n在代码示例 5.10 中，我们将变量 `number1` 的值设置为 50。在幕后，JavaScript 内存中会以名称 `number1` 预留一个空间，并将值\
  \ 50 存储在该空间内。\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8：** 在 JavaScript 内存中设置变量的值。\n\
  \n如上图所示，JavaScript 内存中为变量 `number1` 预留了一个虚构地址 001，其值 50 存储在地址 001 中。\n\n现在，在代码示例\
  \ 5.11 中，我们创建另一个变量 `number2`，并将 `number2` 的值设置为变量 `number1`。\n\n1. `var number2\
  \ = number1;`\n\n    **代码 5.11：** 将变量 `number2` 的值设置为 `number1`\n\n那么，你认为新变量 `number2`\
  \ 的值会是多少呢？\n\n当我们执行代码示例 5.11 时，JavaScript 会复制存储在变量 `number1` 中的值。变量 `number1` 的值\
  \ 50 存储在内存地址 001 中。JavaScript 复制这个值并将其赋给变量 `number2`。如图 5.8 所示，JavaScript 在内存中为新的变量\
  \ `number2` 预留了另一个空间。这个空间用虚构地址 002 表示，如下面的截图所示。现在，JavaScript 将复制的值 50 放入为变量 `number2`\
  \ 预留的内存空间中。因此，值 50 存储在地址 002 中。\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9：** 在 JavaScript\
  \ 内存中设置变量 `number2` 的值\n\n现在，如果我们打印变量 `number1` 和 `number2` 的值，会得到以下结果：\n\n![](img/Figure-5.10.jpg)\n\
  \n**图 5.10：** 显示变量 `number1` 和 `number2` 的值\n\n很简单，对吧？\n\n那么，如果我们将变量 `number1` 的值改为\
  \ 25，代码示例 5.12 中第 2 行和第 3 行的输出会是什么？\n\n1. `number1 = 25;`\n2. `console.log(\"Number1:\
  \  \", number1);`\n3. `console.log(\"Number2:  \", number2);`\n\n    **代码 5.12：**\
  \ 改变变量 `number1` 的值\n\n当我们执行代码示例 5.12 时，输出如下所示：\n\n![](img/Figure-5.11.jpg)\n\n\
  **图 5.11：** 显示变量 `number1` 和 `number2` 的值\n\n那么这里到底发生了什么？如果我们把变量 `number1` 的值改成了\
  \ 25，难道 `number2` 的值不应该也变成 25 吗？\n\n我们来理解一下为什么变量 `number2` 的值仍然是 50。\n\n当 JavaScript\
  \ 解析*代码示例 5.12* 的第 1 行时，它基本上将存储在内存地址 001（变量 `number1` 所在位置）中的值改为了 25。现在，由于代码要求改变变量\
  \ `number1` 的值，JavaScript 不会去碰地址 002 中存储的值，那里存储的是变量 `number2`。因此，变量 `number1` 的值变为\
  \ 25，而存储在地址 002 中的变量 `number2` 的值仍然是 50。\n\n![](img/Figure-5.12.jpg)\n\n**图 5.12：**\
  \ 值改变后变量 `number1` 和 `number2` 的值\n\n根据我们在这里学到的内容，可以得出结论：所有原始值都遵循“*按值复制*”的原则。\n\n\
  # 按引用复制\n\n我们也通过一个例子来理解*按引用复制*的概念。\n\n1. `var person1 = {`\n2. `     name: 'Mark\
  \ Zuckerberg',`\n3. `     age: 36,`\n4. `    nationality: 'American'`\n5. `};`\n\
  7. `var person2 = person1;`\n8. `console.log(\"Person1:   \", person1);`\n9. `console.log(\"\
  Person2:   \", person2);`\n\n    **代码 5.13：** 创建两个对象\n\n在上面的代码示例 5.13 中，我们声明了一个变量\
  \ `person1` 并用一个对象初始化它。接着，我们创建另一个变量 `person2`，并将变量 `person1` 作为其值传递。\n\n你认为代码示例\
  \ 5.13 中第 8 行和第 9 行的输出会是什么？\n\n![](img/Figure-5.13.jpg)\n\n**图 5.13：** 变量 `person1`\
  \ 和 `person2` 的值\n\n答案如上图所示，非常明显。变量 `person1` 和 `person2` 都会显示完全相同的值。\n\n那么，如果我们改变对象\
  \ `person1` 中键 name 的值呢？\n\n1. `person1.name = 'Elon Musk';`\n2. `console.log(\"\
  Person1:   \", person1);`\n3. `console.log(\"Person2:   \", person2);`\n\n    **代码\
  \ 5.14：** 改变 `person1` 中 name 键的值\n\n当我们执行上面的代码示例 5.14 时，得到以下结果：\n\n![](img/Figure-5.14.jpg)\n\
  \n**图 5.14：** 改变键后变量 `person1` 和 `person2` 的值\n\n如上图所示，两个对象 `person1` 和 `person2`\
  \ 的 name 键的值都变成了 Elon Musk。这是为什么呢？\n\n我们用内存引用来理解上面的例子。当我们执行代码示例 5.13 时，内存空间中为变量\
  \ `person1` 预留了一个虚构地址 006。对象 `person1` 的整个值都存储在这个内存地址 006 中。\n\n当我们执行代码示例 5.13 中的第\
  \ 6 行时，JavaScript 内存中为变量 `person2` 预留了一个新地址 007。然而，存储在地址 006 中的对象 `person1` 的值并*没有*被复制到变量\
  \ `person2` 的地址 007 中。相反，变量 `person1` 的地址或引用被存储在了地址 007 中。\n\n![](img/Figure-5.15.jpg)\n\
  \n**图 5.15：** `person2` 变量存储了 `person1` 变量的引用\n\n由于上述原因，当地址 006 中的值发生变化时，变量 `person1`\
  \ 当然会显示新的变化。但是，由于对象 `person1` 的引用（006）存储在变量 `person2` 的内存空间（007）中，因此变量 `person2`\
  \ 也会显示与 `person1` 相同的改变后的值。\n\n![](img/Figure-5.16.jpg)\n\n**图 5.16：** `person2`\
  \ 变量反映了 `person1` 变量的变化\n\n**正如我们在前面的例子中所看到的，数组和对象遵循“*按引用复制*”的原则。**\n\n\n\n\n\n\
  # 对象构造函数\n\n在前面的示例中，我们为每个人创建了一个独立的对象。现在考虑一个场景：我们需要为一个十口之家创建对象。所有家庭成员将拥有相同的属性——*名字、姓氏、年龄和眼睛颜色*。\n\
  \n根据目前所学，我们不得不创建 10 个独立的对象，每个对象有 6 行代码，每个属性包含多个字符，对吗？\n\n相反，我们可以为对象创建一个蓝图函数。这个蓝图将包含对象所需的所有属性。调用这个蓝图函数可以即时创建对象。这可以节省我们输入大量代码行的时间，同时还能提高网页的执行和加载速度。\n\
  \n这种对象的蓝图被称为*对象构造函数*。让我们通过一个示例来理解构造函数：\n\n![](img/Figure-5.17.jpg)\n\n**图 5.17：**\
  \ 对象构造函数示例\n\n在上面的截图中，我们创建了一个函数 `Person`，它接受参数：first、last、age 和 color。在本章前面，我们了解到关键字\
  \ `this` 指的是属性的所有者。在上面的示例中，我们使用关键字 `this` 将属性分配给父函数 `Person`。利用参数中接收到的值，我们定义了函数\
  \ `Person` 的四个属性。由于我们在创建属性，实际上是在借助属性创建一个对象。\n\n在接下来的几行中，我们调用了这个函数六次，从而创建了该函数的六个不同实例。由于我们使用了关键字\
  \ `new`，它会创建六个不同的对象，这些对象具有分配给该函数的属性。\n\n**但是，你不能像向对象添加属性或方法那样，向对象构造函数添加新的属性或方法。**\n\
  \n如下面的截图所示，向 `Person` 对象构造函数添加国籍属性是行不通的。\n\n![](img/Figure-5.18.jpg)\n\n**图 5.18：**\
  \ 向构造函数添加属性无效\n\n如果你想向对象构造函数添加新属性，你需要将其添加到对象构造定义本身中。\n\n# 对象原型\n\n在上一节中，我们学习了如何创建对象构造函数。我们还了解到，我们不能向对象构造函数添加新属性或新方法。关键字\
  \ `prototype` 帮助我们向对象构造函数添加新属性或新方法。让我们通过一个示例来理解原型：\n\n![](img/Figure-5.19.jpg)\n\
  \n**图 5.19：** 使用 prototype 向构造函数添加属性有效\n\n如上图所示，使用关键字 `prototype` 向构造函数添加属性是有效的。使用对象构造函数\
  \ `Person` 创建的每个对象现在都将拥有设置为 `French` 的国籍属性。\n\n### 结论\n\n对象是 JavaScript 的核心。JavaScript\
  \ 对象存储多个值。与数组不同，对象不存储其值的索引位置。在对象中，值以 `name: value` 对的形式存储。你还可以在对象内部存储函数。在实际的 JavaScript\
  \ 开发中，对象被广泛使用。\n\n在下一章中，我们将探讨 JavaScript 最流行的版本——ES6 带来的变化。这将标志着我们向高级 JavaScript\
  \ 开发迈进。\n\n### 要点记忆\n\n*   创建对象有多种方式，但定义对象最有效的方式是使用*对象字面量*。\n\n*   对象可以拥有称为*属性*的\
  \ `name: value` 对，以及称为*方法*的*函数*。\n\n*   在 JavaScript 函数定义中，`this` 关键字指的是函数的所有者。\n\
  \n*   JavaScript 对象遵循引用复制的原则。这意味着复制对象会复制对象的引用，而不是对象的值。\n\n*   当你需要创建多个具有相同属性的对象时，可以使用对象构造函数。但是，你不能向对象构造函数添加新属性或新方法。你需要使用关键字\
  \ `prototype` 来向对象添加新属性和新方法。\n\n### 多项选择题\n\n1.  `Object.values()` **以字符串形式返回对象的所有值——正确还是错误？**\n\
  \n    1.  正确\n\n    2.  错误\n\n2.  **对象遵循 __________ 复制的原则。**\n\n    1.  引用\n\n \
  \   2.  值\n\n### 答案\n\n1.  **b**\n\n2.  **a**\n\n# 第 6 章\n\n## ES6\n\n在其短暂的历史中，JavaScript\
  \ 经历了多个版本和无数次更新。然而，最重要的更新之一发生在 2015 年。这次更新被称为 *ECMAScript2015*，或者更广为人知的 ES6。这次更新带来了一些出色的新特性和方法。事实上，在撰写本文时，一些为\
  \ Facebook、Instagram、Twitter 等应用提供支持的前端库强烈建议深入学习 ES6。\n\n在本章中，我们将探讨 ES6 引入的一些最重要的概念。如果你通过练习给出的代码完成了本章，你应该能够达到开始学习\
  \ React 和 Angular 等前端库的阶段。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   ES6 简介\n\n*   JavaScript\
  \ 提升\n\n*   新的 ES6 语法\n\n*   箭头函数\n\n*   新的数组方法——map、filter 和 reduce\n\n*   数组和对象解构\n\
  \n*   ES6 模块\n\n### 目标\n\n学习本章后，你应该能够将 JavaScript 中最新的、最先进的方法应用到你的应用程序中。你将学习模块，这是\
  \ Angular 和 React 等库的基础，并编写优化的 JavaScript 代码。\n\n### ES6 简介\n\n直到 2015 年，JavaScript\
  \ 主要运行在 1999 年发布的第 3 版和 2009 年发布的第 5 版上。在相当长的一段时间内，这种 Web 开发脚本语言没有添加任何新更新。\n\n最终，在\
  \ 2015 年，JavaScript 的第六版发布了，并被命名为 ECMAScript2015。为简单起见，这个版本被广泛称为 ES6。\n\nES6 带来了多种新特性和方法。其中一些列举如下：\n\
  \n*   用于创建变量的新关键字——`Let` 和 `Const`。\n\n*   对象扩展，如 `Bind`、`Call` 和 `Apply`。\n\n*\
  \   箭头函数。\n\n*   JavaScript 提升。\n\n*   高级运算符，如三元运算符和展开运算符。\n\n*   高级数组方法，如 `map`、`filter`\
  \ 和 `reduce`。\n\n*   模板字面量。\n\n*   模块导入和导出。\n\n在接下来的几节中，我们将学习上述不同的概念。\n\n### JavaScript\
  \ 提升\n\n根据 MDN Web 文档（它几乎相当于 Web 开发者的圣经）的官方文档，JavaScript 提升在 ECMAScript2015（即 ES6）版本中正式被规定。\n\
  \n通俗地说，JavaScript 提升是 JavaScript 将声明移动到顶部的默认行为。让我们通过一个示例来理解这一点。\n\n```\nnumber =\
  \ 1;\nconsole.log(number);\nvar number;\n```\n\n**代码 6.1：** JavaScript 提升示例\n\n\
  传统上，我们先声明 JavaScript 变量，然后再初始化它。然而，在上面的*代码示例 6.1*中，我们在声明变量之前就初始化了它。根据我们目前所学，你认为第\
  \ 2 行的输出会是什么？\n\n![](img/Figure-6.1.jpg)\n\n**图 6.1：** 代码示例 6.1 的输出\n\n\n\n\n\n\
  正如你在前面的截图中所见，*代码示例 6.1* 中第 2 行的输出是 1，并且没有抛出错误。这是为什么呢？\n\n从技术角度来说，JavaScript 在编译阶段会将变量声明和函数声明放入内存。通俗地讲，无论你在哪里声明变量，都可以想象成它被移动到了代码的顶部。因此，代码中的所有变量声明会先被执行，然后\
  \ JavaScript 再按行继续正常执行。\n\n因此，在 *代码示例 6.1* 中，第 3 行的变量 `number` 的声明发生在第一行执行之前。所以当\
  \ JavaScript 执行第 1 行时，它已经有一个名为 `number` 的空声明变量。然后 JavaScript 将其初始化为值 1，如 *代码示例 6.1*\
  \ 的第 1 行所示。由于它既被声明又被初始化，*代码示例 6.1* 第 2 行的执行结果就是值 1。可以把这个过程想象成往容器里装水。要往容器里装水（给变量赋值），显然我们需要确保在尝试装水之前容器已经存在（变量在赋值之前已经存在）。\n\
  \n![](img/Figure-6.2.jpg)\n\n**图 6.2：** JavaScript 提升机制——容器与水的示例\n\n让我们通过更多示例来理解提升机制的概念：\n\
  \n![](img/Figure-6.3.jpg)\n\n**图 6.3：** JavaScript 提升机制中的未定义与未声明\n\n那么，前面的截图中到底发生了什么？让我们逐行理解。\n\
  \n**代码解释：**\n\n首先，我们来理解变量 `number2` 发生了什么：\n\n根据之前的解释和前面的截图，我们知道变量 `number2` 是在使用\
  \ `console.log` 打印它的语句之后才被声明和初始化的。然而，由于 JavaScript 将所有声明移动到顶部，当执行第 3 行（`console.log(\"\
  number2: \", number2);`）时，JavaScript 已经拥有了声明的变量 `number2`。\n\n那么，为什么它没有打印出 50 呢？因为提升机制只将声明移动到顶部，而不会将初始化移动到顶部。可以想象成在装水（值\
  \ 50）之前先放置容器（声明）。因此，当执行第 3 行时，JavaScript 持有变量 `number2` 的空声明（换句话说，容器已经放好，但我们还没有往里面装水）。所以它打印出\
  \ `number2` 为 undefined。\n\n现在，我们来理解变量 `number1` 发生了什么：\n\n与 *代码示例 6.1* 不同，在 *图\
  \ 6.3* 中，我们将变量 `number1` 初始化为值 25，但从未声明它，即使在控制台打印之后也是如此。\n\n那么，在这种情况下，由于变量 `number1`\
  \ 没有被声明，而我们试图打印它，它应该会抛出一个错误，对吗？答案是否定的。可以称之为智能，但因为你将变量 `number1` 初始化为值 25，JavaScript\
  \ 会假定你想要声明它。因此，它会自动声明变量 `number1`，因为它已经被初始化了。回想一下我们之前想象的容器和水的抽象示例。如果你告诉别人你正在往容器里装水，他们就会默认你确实有一个容器。\n\
  \n那么，为什么我们还需要声明变量呢？为什么在给变量赋值之前要写 `var`？这些问题的答案是，关键字 `var` 帮助我们定义变量的作用域或可用性。在 ES6\
  \ 中，JavaScript 引入了两种新的变量声明方式，这将彻底改变我们对作用域的看法。在接下来的几节中，我们将了解用于声明变量的两个新关键字（`let` 和\
  \ `const`），这将回答这里的问题。\n\n最后，变量 `number3` 发生了什么？\n\n如果我们查看代码，在任何时候我们都没有初始化或声明变量 `number3`。这意味着变量\
  \ `number3` 根本不存在。在第 4 行，我们试图打印一个不存在的东西的值。从任何意义上讲，它都会抛出一个错误，指出该变量不存在，或者用 JavaScript\
  \ 术语来说，它会说变量 `number3` 未定义。\n\n与变量类似，JavaScript 也会将函数声明移动到顶部。让我们通过示例来理解：\n\n![](img/Figure-6.4.jpg)\n\
  \n**图 6.4：** JavaScript 函数提升机制\n\n如前面的截图所示，即使我们在函数 `add` 被声明和初始化之前就调用了它，JavaScript\
  \ 仍然显示了函数执行的结果。正如我们之前所学，JavaScript 提升机制会将函数声明移动到顶部。在这种情况下，我们通过编写函数被调用时需要执行的代码来同时初始化函数。因此，我们同时进行了初始化和声明。\n\
  \n现在，让我们看一些 JavaScript 提升机制与函数相关的错误编码示例：\n\n![](img/Figure-6.5.jpg)\n\n**图 6.5：**\
  \ JavaScript 函数提升机制（含错误）\n\n在前面的截图中，我们声明了一个变量 `add`。即使这个变量放在第 2 行之后，它也没有被初始化。因此，它没有值。此时，它甚至不是一个函数。然而，在第\
  \ 2 行，我们将变量 `add` 视为一个函数，并用参数 1 和 6 调用它。显而易见，它会抛出一个错误，指出变量 `add` 不是一个函数。\n\n现在，让我们看最后一个关于函数和\
  \ JavaScript 提升机制的示例：\n\n![](img/Figure-6.6.jpg)\n\n**图 6.6：** JavaScript 匿名函数提升机制\n\
  \n在前面的截图中，我们使用了一个匿名函数。我们将变量 `add` 初始化为该匿名函数。然而，根据 JavaScript 提升机制，只有变量声明被移动到顶部。在调用存储在变量\
  \ `add` 中的匿名函数（参数为 1 和 6）时，它只是一个空的 undefined 变量。因此，我们得到错误，指出 `add` 不是一个函数。\n\n#\
  \ 新的 ES6 语法\n\nES6 为 JavaScript 开发者引入了若干新语法。这些新语法提升了代码执行速度，并在很大程度上优化了 JavaScript\
  \ 代码。让我们逐一了解这些新语法：\n\n## Let 和 const\n\n正如我们在 *第 3 章：函数* 中学到的，在 ES6 引入之前，JavaScript\
  \ 有两种作用域：*全局作用域* 和 *局部作用域*。使用 JavaScript 关键字 `var` 声明的变量在函数内部具有局部作用域。同样，使用 JavaScript\
  \ 关键字 `var` 声明的变量在函数外部具有全局作用域（即，在函数外部声明的变量可以被所有人访问）。\n\nES6 引入了一种新的作用域级别，称为块级作用域。你可以使用关键字\
  \ `let` 和 `const` 在 JavaScript 中创建块级作用域。术语“块级作用域”中的“块”指的是一段代码块。这个块可以是一对花括号内的代码块、函数内部定义的代码块，或者整个脚本中的代码块。理解这些块最重要的一点是，每个块都是一个独立的实体，拥有自己的私有空间。让我们了解什么是块级作用域，以及如何创建它。\n\
  \n### let\n\n在 JavaScript 中，如果你在花括号内使用关键字 `var` 声明一个变量，并在花括号外部访问该变量，你将能够访问该变量。\n\
  \n![](img/Figure-6.7.jpg)\n\n**图 6.7：** 关键字 var 的作用域\n\n\n\n\n\n如前面的截图所示，我们在花括号内声明了一个变量\
  \ `number`，并将其初始化为值 `20`。当我们在花括号外部、变量定义之后尝试访问变量 `number` 时，能够成功访问到该值，如输出所示。\n\n\
  在理想情况下，在花括号内声明的变量不应该能在花括号外部被访问。让我们考虑一个实际场景：\n\n![](img/Figure-6.8.jpg)\n\n**图 6.8：**\
  \ 为什么 `var` 会变得复杂！\n\n在前面的截图中，我们在第 1 行定义了一个值为 `25` 的变量 `number`。然后，我们打开花括号，重新定义了值为\
  \ `50` 的变量 `number`。\n\n正如我们之前所学，花括号代表一个块。这个块内部的值理想情况下应该只能在块内部被访问。同样，由于花括号外部的代码构成了一个独立的块，我们会认为在花括号（块）外部声明的值在外部应保持其各自的值。然而，如\
  \ *图 6.8* 所示，如果用户在花括号内用另一个值重新定义了变量，那么旧值在重新声明之后的所有位置都会被完全替换。\n\n现在，想象一个大约有 1000 行代码的脚本。实际上不可能记住脚本中使用的所有变量名。如果开发者不小心使用了相同的变量名来定义新值，代码很可能会崩溃。\n\
  \n![](img/Figure-6.9.jpg)\n\n**图 6.9：** 使用 `var` 重复变量名会改变值\n\n假设用户定义了变量 `title`\
  \ 来存储用户名。然而，在脚本中间的某个地方，开发者又使用了相同的变量名 `title` 来存储用户汽车的名字。现在，即使开发者最初计划保留变量名 `title`\
  \ 用于存储用户名，但在重新定义之后，任何使用该变量的地方都会显示用户汽车的名字。\n\n为了解决这种容易出错的编码问题，ES6 引入了两个新的 JavaScript\
  \ 关键字来创建变量——`let` 和 `const`。关键字 `let` 具有以下四个特性：\n\n*   **在块内声明的变量不能在块外被访问**\n\n\
  \    类比我们之前看到的 *图 6.7*，让我们用关键字 `let` 来理解同样的例子：\n\n    ![](img/Figure-6.10.jpg)\n\
  \n    **图 6.10：** 使用 `let` 关键字创建的变量不能在外部被访问\n\n    如前面的截图所示，在花括号（代码块）内使用关键字 `let`\
  \ 创建的变量 `number` 不能在花括号外部被访问。\n\n*   **在块外声明的变量不能在块内被访问**\n\n    同样，类比 *图 6.8*，我们将使用关键字\
  \ `let` 来演示相同的例子。\n\n    如下面的截图所示，如果一个变量在块外声明，并且在块内没有重新定义同名的变量，那么你不能在花括号（块）内访问该变量。由于花括号外部的代码和内部的代码构成了不同的块，一个块内的值不能在另一个块内被访问。\n\
  \n    ![](img/Figure-6.11.jpg)\n\n    **图 6.11：** 使用 `let` 在外部声明的变量不能在内部被访问\n\n\
  *   **变量在其块内保持各自的值**\n\n    结合上一点，每个块都会保持自己的值。如下面的截图所示，在花括号外部声明的变量 `number` 在花括号结束后会保持其值。同样，花括号内部的值不会影响外部的值。\n\
  \n    ![](img/Figure-6.12.jpg)\n\n    **图 6.12：** 每个块都有自己的值\n\n*   **不能在同一个块内重新声明同名的变量**\n\
  \n    最后，关键字 `let` 最重要的特性之一是，它不允许你在同一个块内创建同名的变量。但是，你可以在另一个块内创建同名的变量。如下面的截图所示，你可以在另一个块内重新声明变量\
  \ `number`，如 *图 6.13* 的第 4 行所示。然而，如果你试图在花括号之后重新声明变量 `number`，是不允许的。因为花括号外部的代码构成了一个不同的块，而变量\
  \ `number` 已经在那个块的第 1 行被定义了。\n\n    ![](img/Figure-6.13.jpg)\n\n    **图 6.13：**\
  \ 不能在同一个块内重新声明变量\n\n因此，关键字 `let` 允许你为变量创建块级作用域。这将解决我们在 *图 6.9* 中遇到的问题。为什么不自己尝试用关键字\
  \ `let` 替换 `var` 来测试 *图 6.9* 中的脚本呢？\n\n# const\n\n使用关键字 `const` 声明的变量与使用关键字 `let`\
  \ 创建的变量工作方式类似。它们也遵循块级作用域的规则。然而，两者之间的一个主要区别是，你不能为使用 `const` 声明的变量重新赋值。简单来说，你创建了一个不能更改的常量值。\n\
  \n![](img/Figure-6.14.jpg)\n\n**图 6.14：** 使用 `const` 的变量不能赋予新值\n\n编写常量的通用约定是将变量名大写，并使用下划线分隔多个单词。\n\
  \n关于 `const`，我们需要了解以下几点：\n\n*   **不能为使用 `const` 声明的变量赋予新值**\n\n    如 *图 6.14* 所示，你不能为使用\
  \ `const` 定义的变量赋予新值。\n\n*   **不能使用 `const` 重新声明已经声明的变量**\n\n    由于 `const` 遵循与 `let`\
  \ 相同的原则，你不能使用 `const` 重新定义已经声明的变量。\n\n    ![](img/Figure-6.15.jpg)\n\n    **图 6.15：**\
  \ 不能使用 `const` 重新声明变量\n\n*   **使用 `const` 时*必须*赋值**\n\n    如下面的截图所示，你总是需要初始化使用 `const`\
  \ 声明的变量。如果使用 `const` 时没有初始化变量，将会导致错误：\n\n    ![](img/Figure-6.16.jpg)\n\n    **图\
  \ 6.16：** 你需要使用 `const` 初始化变量\n\n*   **可以更改使用 `const` 声明的对象的属性……**\n\n    如下面的截图所示，你可以更改使用\
  \ `const` 声明的对象的属性：\n\n    ![](img/Figure-6.17.jpg)\n\n    **图 6.17：** 使用 `const`\
  \ 声明的对象的属性可以被更改\n\n*   **……但不能将新对象赋值给同一个变量**\n\n    如下面的截图所示，你不能将新对象赋值给使用 `const`\
  \ 声明的变量：\n\n    ![](img/Figure-6.18.jpg)\n\n    **图 6.18：** 不能使用 `const` 将新对象赋值给同一个变量\n\
  \n**提示：** 为了解决使用 `const` 声明的对象的属性可以被更改这一缺陷，你可以使用 `Object.freeze()`。\n\n![](img/Figure-6.19.jpg)\n\
  \n**图 6.19：** `Object.freeze()`\n\n如前面的截图所示，如果一个对象作为参数传递给了 `Object.freeze()`，那么它的值将不会被更改。但请记住，`Object.freeze()`\
  \ 对在对象内部创建的对象不起作用。\n\n# Bind、call 和 apply\n\nES6 为对象引入了三个新方法——`bind`、`call` 和 `apply`。让我们直接通过示例来理解这三个方法：\n\
  \n![](img/Figure-6.20.jpg)\n\n**图 6.20：** 对象方法在调用时返回 `NaN`\n\n\n\n\n\n在前面的截图中，脚本执行的结果是\
  \ `NaN`。知道为什么吗？\n\n让我们重新审视 `this` 关键字的概念。我们已经了解到，`this` 关键字对应函数的拥有者。在前面的例子中，当对象被定义时，方法\
  \ `getFullName` 内部的 `this` 关键字指向 `person` 对象。然而，在第 9 行，我们将该方法赋值给了变量 `fullName`。由于变量\
  \ `fullName` 属于全局对象，当调用变量 `fullName` 时，`this` 的值就转移到了全局对象。而全局对象没有 `firstName` 和\
  \ `lastName` 变量，因此我们得到了 `NaN`。\n\n为了解决这个问题，JavaScript 为全局对象 `Object` 提供了三个新方法。让我们逐一了解每个方法。\n\
  \n# bind\n\n`bind` 方法会创建函数的一个新副本。它接受一个值作为参数。`bind` 函数会将 `this` 关键字的值设置为参数中提供的值。基于我们在\
  \ *图 6.20* 中看到的例子，我们在第 9 行将对象 `person` 的值传递给 `bind` 函数，如下面的截图所示：\n\n![](img/Figure-6.21.jpg)\n\
  \n**图 6.21：** bind 方法\n\n在上面的截图中，我们在调用 `getFullName` 方法时，将对象 `person` 作为参数传递给了 `bind`\
  \ 方法。`bind` 方法创建了原始方法 `getFullName` 的一个新副本，并将 `this` 关键字设置为 `person` 对象。\n\n# call\n\
  \n`call` 方法与 `bind` 方法功能相同。然而，两者之间存在三个显著差异：\n\n*   `call` 方法不会创建函数的新副本。\n*   `call`\
  \ 方法会立即执行函数。\n*   `bind` 方法接受参数。\n\n让我们通过一个例子来理解。\n\n![](img/Figure-6.22.jpg)\n\n\
  **图 6.22：** call 方法\n\n如果你比较 *图 6.21* 和 *图 6.22*，你会注意到在 *图 6.21* 中，应用 `bind` 方法后，你需要单独调用函数。而在\
  \ *图 6.22* 中，你可以看到不需要单独调用函数。相反，`call` 方法默认会调用该函数。另一个需要注意的重要点是，`call` 方法不会创建函数的新副本。基于这两个原因，`call`\
  \ 方法常用于在不同对象上应用方法。\n\n在下面的截图中，你可以观察到 `call` 方法的另一个特性。在传递给 `call` 方法的参数中，在传递 `this`\
  \ 关键字所需的对象之后，你还可以传递多个逗号分隔的参数供方法使用。\n\n![](img/Figure-6.23.jpg)\n\n**图 6.23：** 带参数的\
  \ call 方法\n\n# apply\n\n`apply` 方法与 `call` 方法类似，只有一个区别。在 `apply` 方法中，你需要将额外的参数作为数组传递，而不是逗号分隔的值。\n\
  \n![](img/Figure-6.24.jpg)\n\n**图 6.24：** apply 方法\n\n如果你比较 *图 6.23* 和 *图 6.24*，你会注意到唯一的区别是后者中的参数是以数组形式提供的。以数组形式提供参数的好处是，你始终知道在\
  \ `apply` 方法中最多只能传递两个参数。此外，你可以简单地将数组创建外包给一个持有数组的变量。\n\n# 高级运算符\n\n我们在本书的 *第 1 章：JavaScript\
  \ 简介* 中已经探讨了几个 JavaScript 运算符。ES6 引入了一些新的运算符，使编码更简单。在本节中，我们将介绍 ES6 引入的三个重要特性——三元运算符、剩余参数和展开运算符。\n\
  \n# 三元运算符\n\n三元运算符简化了我们在 JavaScript 中编写 if…else 条件语句的方式。让我们通过一个简单的 if…else 示例来理解三元运算符：\n\
  \n```javascript\nlet result;\nif(number%2 === 0) {\n    result = \"The number is\
  \ even.\";\n} else {\n    result = \"The number is odd.\";\n}\n```\n\n**代码 6.2：**\
  \ JavaScript 中的 if…else 条件语句\n\n在 *代码示例 6.2* 中，我们引入了一个简单的 JavaScript if…else 条件语句来判断一个数字是偶数还是奇数。然而，正如你在\
  \ *代码示例 6.2* 中所见，它需要五行代码。即使我们减少空白字符，仍然需要输入很多字符。\n\n为了简化 if…else 条件语句，ES6 引入了三元运算符。三元运算符的语法如下：\n\
  \n```\ncondition ? ifTrue : ifFalse\n```\n\n**代码 6.3：** 三元运算符的语法\n\n如 *代码示例 6.3*\
  \ 所示，三元运算符的语法需要两个符号——问号 '?' 和冒号 ':'。在三元运算符中，你需要在问号之前添加要测试的条件。如果条件的结果为真，则执行问号之后的语句或表达式（在\
  \ *代码示例 6.3* 中用 `ifTrue` 表示）。如果条件的评估结果为假，则执行冒号符号之后的语句或表达式（在 *代码示例 6.3* 中用 `ifFalse`\
  \ 表示）。让我们通过 *代码示例 6.2* 中的代码来理解这个语法：\n\n```javascript\nlet result = number%2 ===\
  \ 0 ? \"The number is even\" : \"The number is odd\";\n```\n\n**代码 6.4：** 三元运算符示例\n\
  \n如上面的 *代码示例 6.4* 所示，多亏了三元运算符，我们将 *代码示例 6.2* 中的七行代码转换成了 *代码示例 6.4* 中的一行代码。\n\n当你需要返回单行表达式或简单执行时，三元运算符效果最佳。\n\
  \n让我们再看一个三元运算符的实际示例：\n\n![](img/Figure-6.25.jpg)\n\n**图 6.25：** 三元运算符示例\n\n正如你在上面的截图中所见，三元运算符可以处理\
  \ null 值。如果条件评估为 null，或者条件中接收到的表达式为 null，它会自动执行 else 部分（冒号之后的部分）。在 *图 6.25* 中，由于三元运算符在第二次调用函数时接收到了\
  \ null，因此它返回了 stranger。\n\n# 剩余参数\n\n在开始探索剩余参数之前，让我们先重申一下 JavaScript 函数中的几个重要术语。在\
  \ JavaScript 函数中，函数声明时在括号中创建的变量称为参数，而调用（执行）函数时在括号中传递的变量或值称为*实参*。在下面的截图中，我们可以直观地看到参数和实参之间的区别：\n\
  \n![](img/Figure-6.26.jpg)\n\n**图 6.26：** 参数 vs 实参\n\n现在我们已经知道了参数和实参的区别，让我们来理解 ES6\
  \ 中引入的剩余参数的概念。为了理解剩余参数，让我们看看 *图 6.26* 中所示的函数 `add` 的例子。\n\n在 *图 6.26* 中，我们有一个简单的函数，用于将两个数相加。\n\
  \n*但是，如果我们需要一个函数来加三个数呢？*\n\n我们需要创建一个全新的函数，它有三个参数。\n\n*但是，如果我们需要一个函数来加四个数呢？*\n\n\
  我们需要另一个新函数，它有四个参数。\n\n\n\n\n\n*如果我们需要一个参数数量可变的函数怎么办？例如，我需要一个函数，它可以接受任意数量的参数，并且仍然能计算结果。我可以写\
  \ `add(2, 3)`，也可以写 `add(4, 5, 6, 102, 12, 23)`，两种情况下都能得到结果。*\n\n这可以通过剩余参数来实现。剩余参数以三个点作为前缀。这种表示法允许你在函数中引入不定数量的参数。这些参数将以数组的形式呈现。像往常一样，我们通过一个例子来理解这一点。\n\
  \n![](img/Figure-6.27.jpg)\n\n**图 6.27：** 剩余参数\n\n如上述截图所示，我们创建了一个函数，它接受两个主要参数 `number1`\
  \ 和 `number2`。在 *图 6.27* 第一行所示的函数声明中，在输入参数 `number1` 和 `number2` 之后，我们引入了一个剩余参数，它以三个点（…）为前缀，变量名为\
  \ `numbers`。这个剩余参数 `numbers` 可以以数组的形式存储无限数量的参数。借助剩余参数，我们不再需要为不同数量的参数创建多个新函数。实际上，用户现在可以提供任意数量的参数，我们的函数都能处理它们。\n\
  \n简单来说，要使用我们的 `add` 函数，用户至少需要提供两个参数。\n\n如 *图 6.27* 所示，如果用户只提供两个参数，例如 `add(1, 2)`，那么剩余参数\
  \ `numbers` 将显示一个空数组。如果用户提供三个参数，例如 `add(2, 3, 4)`，那么数组 `numbers` 将包含一个值，即第三个参数 4。最后，如果用户提供五个参数，例如\
  \ `add(6, 7, 8, 9, 12)`，那么数组 `numbers` 将包含三个值：8、9 和 12。\n\n# 展开运算符\n\nES6 引入了一个新的运算符，称为展开运算符。展开运算符也以三个点（…）为前缀。然而，展开运算符与我们上一节学习的剩余参数完全不同。展开运算符最直接的字面意思是将可迭代对象（如数组）的元素展开。\n\
  \n为了更好地理解展开运算符，让我们来看看展开运算符的不同功能：\n\n*   **将一个数组/对象插入到另一个数组/对象中**\n\n    展开运算符允许你在数组初始化时插入另一个数组。让我们通过一个例子来理解：\n\
  \n    ![](img/Figure-6.28.jpg)\n\n    **图 6.28：** 将一个数组插入到另一个数组初始化中\n\n    在上面的截图中，第一行我们有一个包含四个值的初始字符数组。在下一行，我们创建了另一个名为\
  \ `allCharacters` 的数组，我们想要将 `initialCharacters` 数组中列出的字符列表与两个新字符一起添加进去。为此，我们只需使用展开运算符将\
  \ `initialCharacters` 数组插入到特定位置。如 *图 6.28* 的第二行和第三行所示，展开运算符会将整个数组仅插入到你使用展开运算符的位置。\n\
  \n    如下面的截图所示，你也可以使用展开运算符将一个对象插入到另一个对象的初始化中：\n\n    ![](img/Figure-6.29.jpg)\n\n\
  \    **图 6.29：** 将一个对象插入到另一个对象初始化中\n\n*   **拼接数组/对象**\n\n    展开运算符也可以用于拼接两个或多个数组或对象。如下面的截图所示，要拼接多个数组，你需要按照你想要的顺序，在数组名称前加上展开运算符前缀（…）。\n\
  \n    ![](img/Figure-6.30.jpg)\n\n    **图 6.30：** 使用展开运算符拼接两个数组\n\n    类似地，你可以使用相同的展开运算符技术来拼接多个对象，如下面的截图所示：\n\
  \n    ![](img/Figure-6.31.jpg)\n\n    **图 6.31：** 使用展开运算符拼接两个对象\n\n*   **复制数组/对象**\n\
  \n    在上一章中，我们了解到数组和对象遵循“*按引用复制*”的概念。如下面的截图所示，这基本上意味着当你复制一个对象时，复制的是对象的引用，而不是它的值。因此，当你更改任何一个对象时，另一个对象的值也会随之改变。\n\
  \n    ![](img/Figure-6.32.jpg)\n\n    **图 6.32：** 对象遵循按引用复制的概念\n\n    如果你只想更改其中一个对象，但两个对象的值都发生了变化，这可能会带来灾难性的后果。想想上面截图中的例子。在实际类比中，对象\
  \ `person1` 和 `person2` 是两个不同的个体。如果我们更改其中一个人的年龄，另一个人的年龄也随之增加是不正确的。或者说，如果我们给 `person2`\
  \ 添加国籍为西班牙，这并不能推断出 `person1` 也是西班牙人。\n\n    为了解决这个难题，我们可以使用展开运算符。当我们使用展开运算符复制对象时，它复制的是对象的内容，而不是其引用。\n\
  \n    如下面的截图所示，要使用展开运算符复制一个对象，你需要打开一对花括号。在花括号内，使用展开运算符表示法（…）并输入要复制的对象名称。类似地，如果要复制一个数组，步骤相同，只是将花括号替换为数组表示法，即方括号（[]）。\n\
  \n    ![](img/Figure-6.33.jpg)\n\n    **图 6.33：** 使用展开运算符复制对象的值\n\n# 模板字面量\n\n到目前为止，每当我们需要在字符串中使用变量时，我们使用单引号（'）或双引号（\"\
  ）来创建字符串文本。要在字符串中插入变量，我们必须结束引号，然后使用加号运算符（+）插入变量。这被称为字符串字面量。\n\n如下面的 *代码示例 6.5* 所示，在使用引号创建字符串字面量时，我们面临很多问题。从在多个位置断开字符串，到使用转义字符（\\\
  ）来确保字符串不会崩溃，编写字符串字面量很少是容易的。\n\n```\n1. let name = \"John Doe\";\n2. let age = 27;\n\
  3. let nationality = \"British\";\n5. let string = \"Today's first candidate is\
  \ \" + name + \". He is \" + age + \" years old. His nationality is \" + nationality\
  \ + \". His favorite quote is \\\"If not now, then when?\\\"\";\n```\n\n**代码 6.5：**\
  \ 字符串字面量\n\n为了解决这个问题，ES6 引入了模板字面量。模板字面量帮助我们以更简单、更清晰、更安全的方式处理字符串。要使用模板字面量，我们将字符串包裹在反引号（`）中。每当我们要在模板字面量中插入变量时，我们使用一种特殊的语法——`${variableName}`。让我们通过一个例子来理解：\n\
  \n```\n1. let name = \"John Doe\";\n2. let age = 27;\n3. let nationality = \"British\"\
  ;\n5. let string = `Today's first candidate is ${name}.\n6. He is ${age} years old.\
  \ His nationality is ${nationality}.\n7. His favorite quote is \"If not now, then\
  \ when?\"`;\n```\n\n**代码 6.6：** 模板字面量\n\n如 *代码示例 6.6* 所示，我们借助模板字面量解决了以下三个问题：\n\n\
  *   **字符串格式化**：与使用传统字符串字面量添加变量相比，我们可以轻松地替换变量。\n\n\n\n\n\n*   **HTML 转义**：在*代码示例\
  \ 6.5*中，由于我们使用了双引号，因此必须使用转义字符来确保字符串中的双引号不会被误认为是字符串的结束。模板字面量通过避免字符转义，为我们省去了很多麻烦。\n\
  \n*   **多行语句**：在*代码示例 6.5*中，我们需要使用转义字符（`\\n`）来换行。而在模板字面量中，只需在新的一行输入文本即可。\n\n# 箭头函数\n\
  \n在本书前面的*第 3 章：函数*中，我们学习了大量关于函数的知识。2015 年，ES6 引入了一种更简洁的函数编写语法。这种新的函数语法被称为箭头函数。一个有趣的名字，对吧？箭头函数之所以这样称呼，是因为其最重要的语法是胖箭头符号（`=>`）。\n\
  \n与传统函数编写方式相比，箭头函数具有两大显著优势：\n\n*   更简洁的语法\n*   消除了 `this` 关键字的绑定\n\n## 更简洁的语法\n\n\
  让我们通过示例来理解箭头函数：\n\n```\nvar add = function(number1, number2) {\n    return number1\
  \ + number2;\n}\n```\n\n**代码 6.7：** 传统函数编写方式\n\n如前面的*代码示例 6.7*所示，我们使用传统方式创建了一个匿名函数\
  \ add。ES6 将同样的函数简化为更简洁的语法，如下面的*代码示例 6.8*所示：\n\n```\nlet add = (number1, number2)\
  \ => number1 + number2;\n```\n\n**代码 6.8：** ES6 函数编写方式\n\n那么这里到底发生了什么？让我们逐词理解：\n\
  \n1.  箭头函数做的第一件事是消除对关键字 `function` 的依赖。\n2.  接着，在添加函数参数（如果有的话）之后，添加 ES6 的胖箭头符号。\n\
  3.  现在到了有趣的部分。如果函数需要返回某个值，并且需要执行的代码只有一行，你可以完全省略花括号和关键字 `return`。\n\n如下面的截图所示，该函数的执行方式完全相同：\n\
  \n![](img/Figure-6.34.jpg)\n\n**图 6.34：** 代码示例 6.8 的箭头函数变体\n\n如果你的函数没有参数，则需要提供空括号。如果你的函数只有一个参数，那么也可以省略括号。如下面的*代码示例\
  \ 6.9*所示：\n\n```\nlet greeting = () => `Good morning, user!`;\nlet greeting = name\
  \ => `Good morning, ${name}!`;\ngreeting();     //Good morning, user!\ngreeting('John');\
  \     //Good morning, John!\n```\n\n**代码 6.9：** ES6 编写零个或一个参数的函数的方法\n\n## ES6 函数中的\
  \ this 关键字\n\n箭头函数改变了函数中 `this` 关键字的作用域。这一改变使得函数执行更加直观。\n\n传统上，当我们使用 `this` 关键字时，它指向函数执行时的所有者或\
  \ window 对象。在下面的截图中，我们在控制台打印了两条语句。第一条语句在 `getFullName` 方法的第一行打印。第二条语句位于存储在变量 `print`\
  \ 中的匿名函数内部。这个匿名函数是 `getFullName` 方法的一部分。\n\n![](img/Figure-6.35.jpg)\n\n**图 6.35：**\
  \ 传统函数中的“this”关键字\n\n*知道为什么内部语句返回 undefined 吗？*\n\n我们已经知道，`this` 关键字指向使用它的函数的所有者。对于外部语句，`this`\
  \ 关键字属于 `getFullName` 方法，而该方法的所有者是对象 `person`。可以说，由于 `person` 对象同时拥有 `firstName`\
  \ 和 `lastName` 属性，因此外部语句的值为 John Doe。\n\n然而，对于内部语句，`this` 关键字属于变量 `print` 内部的函数。匿名函数\
  \ `print` 的所有者是 `getFullName` 方法，从*图 6.35*中可以看出，该方法没有 `firstName` 和 `lastName` 属性。\n\
  \n箭头函数通过消除 `this` 关键字的绑定解决了这一复杂性。让我们通过一个示例来理解：\n\n![](img/Figure-6.36.jpg)\n\n**图\
  \ 6.36：** 箭头函数中的“this”关键字\n\n在上面的截图中，我们对内部语句使用了箭头函数。可以看到，现在内部语句的输出也是 John Doe。那么这里发生了什么？\n\
  \n箭头函数没有自己的 `this`。因此，会使用外层或父级作用域的 `this` 值。在*图 6.36*中，由于匿名函数 `print` 没有 `this`\
  \ 关键字，它会查找 `getFullName` 方法作用域中的 `this` 关键字。正如我们之前所见，由于 `getFullName` 方法属于 `person`\
  \ 对象，因此它从那里获取值。\n\n# 新的数组方法——map、filter 和 reduce\n\n在本书前面的*第 4 章：数组*中，我们学习了数组。在该章中，我们了解到访问数组每个元素的方法之一是使用\
  \ for 循环。ES6 引入了三种新的数组操作方式，它们比 for 循环更简单、更高效。我们将逐一介绍这些方法。\n\n## `map()`\n\n`map()`\
  \ 方法对数组中的每个元素调用一个函数。每个元素对应的函数结果随后由 `map()` 方法填充到一个新数组中。`map()` 方法不会改变原始数组。\n\n让我们通过一个简单的示例来理解\
  \ `map()` 方法。如果我给你一个数字数组，并要求你将数组中所有元素的值加倍，你会怎么做？\n\n在你可以使用的众多方法中，最好的方法如下：\n\n```\n\
  var numbers = [2, 4, 6];\nvar double = [];\n\nfor(var i=0; i<numbers.length; i++)\
  \ {\n    let value = numbers[i]*2;\n    double.push(value);\n}\nconsole.log(\"Double:\
  \    \", double);  //Double:    [4, 8, 12];\n```\n\n**代码 6.10：** 传统方法将数组中的值加倍\n\n\
  ES6 通过 `map()` 方法极大地简化了这一过程。\n\n```\nlet numbers = [2, 4, 6];\nlet double = numbers.map(number\
  \ => number * 2);\n\nconsole.log(\"Double:   \", double);      //Double:   [4, 8,\
  \ 12]\n```\n\n**代码 6.11：** ES6 方法将数组中的值加倍\n\n如前面的*代码示例 6.11*所示，我们在 map 方法中使用了箭头函数。我们在数组\
  \ `numbers` 上调用 map 方法。map 方法逐个遍历数组的每个元素，对该元素执行某种计算（操作），并将计算（操作）后的值返回到新数组中的对应位置。\n\
  \n在*代码示例 6.11*中，变量 `number` 指向数组 `numbers` 中的每个元素。根据箭头函数的功能，由变量 `number` 定义的数组的每个元素都乘以\
  \ 2，并将该值返回到新数组中的相同位置。\n\n你可以直观地想象为：\n\n![](img/Figure-6.37.jpg)\n\n**图 6.37：** map\
  \ 方法的直观参考\n\n**注意：** 仅当你想要返回一个数组时才使用 map 方法。如果你不打算返回任何数组，那么*不要使用* map 方法。相反，你可以使用\
  \ `for…of` 循环或 `forEach` 循环。*6*\n\n## `filter()`\n\n\n\n\n`filter()` 方法的字面任务是根据条件从数组中过滤出元素。想象一下，如果你有一个数字数组，要求你只移除其中的奇数元素，你会怎么做？\n\
  \n`filter()` 方法提供了一种简洁的语法来过滤数组中的元素。`filter()` 方法返回一个由过滤后元素组成的新数组。\n\n```\nlet numbers\
  \ = [1, 20, 21, 46, 213, 452, 615, 729, 8901];\nlet even = numbers.filter(number\
  \ => number%2 === 0);\nconsole.log(\"Even numbers:    \", even);    // Even numbers:\
  \  [20, 46, 452]\n```\n\n**代码 6.12：** 使用 ES6 方法过滤值\n\n如前面的 *代码示例 6.12* 所示，我们再次在\
  \ ES6 的 `filter` 方法中使用了箭头函数。与 `map` 方法类似，我们在数组 `numbers` 上调用 `filter` 方法。变量 `number`\
  \ 指向数组 `numbers` 中的每一个元素。然后，该元素会根据箭头符号后的条件进行检查。如果条件满足，该元素就会被添加到最终返回的新数组中；如果条件不满足，则不会添加。\n\
  \n# `reduce()`\n\nES6 的 `reduce()` 方法将数组缩减为单个值。`reduce` 方法包含两个参数：第一个参数是累加器，简单来说，它就是\
  \ `reduce()` 方法最终返回的结果值；第二个参数是数组的当前元素。最后，在箭头函数之后，我们对其中一个或两个参数执行一些代码，然后将结果值存储到累加器（第一个参数）中，供下一次迭代使用。这个过程一直持续到方法处理完数组的最后一个元素。\n\
  \n话不多说，让我们通过一个简单的例子来理解：\n\n```\nlet numbers = [2, 4, 6, 8, 12];\nlet sum = numbers.reduce((total,\
  \ number) => total + number);\nconsole.log(`The sum is ${sum}`);      //The sum\
  \ is 32\n```\n\n**代码 6.13：** 使用 ES6 方法将数组缩减为单个值\n\n在前面的 *代码示例 6.13* 中，我们在数组 `numbers`\
  \ 上调用了 `reduce` 方法。它会遍历数组 `numbers` 中的每一个元素。\n\n我们将两个参数分别命名为 `total` 和 `number`。变量\
  \ `total` 是累加器，即它会存储计算结果的集合；第二个变量 `number` 指向数组的当前元素。最后，在箭头函数之后，我们将两个参数相加，并将结果存储到累加器（即本例中的变量\
  \ `total`）中。因此，`reduce` 方法遍历每一个元素，将当前值加到 `total` 上，最终返回累加器 `total` 作为最终结果。\n\n#\
  \ 数组和对象解构\n\n英语词典中，“解构”一词的含义是破坏某物的结构，或拆解某物。在 ES6 中，我们利用解构的概念将数组的值分解为简单的变量。我们可以将其理解为打开一个装有值的盒子。\n\
  \n![](img/Figure-6.38.jpg)\n\n**图 6.38：** 解构类似于从盒子中取出物品\n\n让我们通过示例来理解这种“拆包”：\n\n\
  ![](img/Figure-6.39.jpg)\n\n**图 6.39：** 解构数组\n\n如上图所示，我们初始化了一个包含四个字符串值的数组 `colors`。如果你还记得\
  \ *第 4 章* 的内容，数组被称为有序集合，这意味着数组具有索引值，即强调元素的索引或位置。\n\n在数组解构中，我们在左侧模拟一个数组，并提供变量，用于解包并存储数组中的某些值。在右侧，我们将这个模拟数组赋值为原始数组的值，以便从中解包出值。如图所示，数组解构将左侧的变量与原始数组\
  \ `colors` 的位置进行匹配，并将左侧的变量赋值为右侧原始数组中对应位置的值。\n\n对于对象解构，由于对象不是索引集合，我们不能使用与数组相同的方法。对于对象，我们需要在左侧提供与对象中实际存在的键相同的变量名。或者，我们可以使用冒号符号为这些键提供一个伪变量名。\n\
  \n![](img/Figure-6.40.jpg)\n\n**图 6.40：** 解构对象\n\n如上图所示，我们可以使用与数组解构相同的技术，将对象的键和值存储到单独的变量中。现在，我们不再使用模拟数组，而是在赋值语句的左侧使用带花括号的模拟对象，右侧使用实际对象。模拟对象包含对象的键名。如\
  \ *图 6.40* 所示，原始对象 `car` 中没有名为 `wheels` 的键，因此当我们尝试使用变量 `wheels` 解包对象时，会返回 `undefined`。不过，我们可以通过冒号为原始键分配一个新变量，就像我们对键名\
  \ `type` 所做的那样。\n\n# ES6 模块\n\n在 JavaScript 早期，数千行代码的代码库很少见。转眼到了 2020 年，我们已经有了完全用\
  \ JavaScript 构建的应用程序。可以说，在一个应用的多个页面中，可能会有多个代码块我们希望重复使用。有时，这些代码块甚至不属于代码的主流程。例如，我们可以有一个用于求和的函数。与其多次编写\
  \ `add` 函数，不如定义一次并多次使用。这种将代码转化为可重用的小部分的做法称为模块化编码，而这些小段代码则称为模块。\n\n现在，这些模块可能并不属于代码的主流程。例如，一个\
  \ JavaScript 文件可能专门用于登录功能。显然，`add` 函数不应该出现在登录逻辑的中间。此外，可能还有许多其他 JavaScript 文件需要借助这个\
  \ `add` 函数。\n\n因此，将这样一个工具函数单独存放在一个独立的 JavaScript 文件中，供所有人使用，是合理的。接下来的问题是如何让系统中的每个文件都能访问它。这时，ES6\
  \ 的导入和导出就派上了用场。\n\n为了理解 ES6 模块、导入和导出，我们将创建一个示例 `index.html` 文件：\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>ES6 Modules</title>\n\
  </head>\n<body>\n    <p>The sum is <span id=\"result\"></span></p>\n    <script\
  \ type=\"module\" src=\"./scripts/index.js\"></script>\n</body>\n</html>\n```\n\n\
  **代码 6.14：** 用于模块的 index.html\n\n如前面的 *代码示例 6.14* 所示，这是一个简单的 `index.html` 文件，但有一个主要变化——我们在\
  \ HTML 中为 `index.js` 文件的导入添加了 `type=\"module\"`。\n\n这是为了确保浏览器知道该文件将在其代码中使用导入和导出。\n\
  \n现在，让我们创建一个名为 `scripts` 的文件夹，并在其中创建一个名为 `utils.js` 的文件。在 `utils.js` 中，我们将创建模块函数\
  \ `add`。\n\n```\nexport const add = (number1, number2) => number1 + number2;\n```\n\
  \n**代码 6.15：** 用于模块的 utils.js\n\n\n\n\n\n正如你在前面的*代码示例 6.15*中所见，我们现在使用 ES6 箭头函数创建了模块化的可复用函数\
  \ `add`。它接收两个值，将它们相加并返回总和。我们在这里做的唯一额外的事情是使用了关键字 `export`。这个关键字确保该函数可供所有希望导入它的文件使用。\n\
  \n现在，最后，我们将创建在 `index.html` 中提到的 `index.js` 文件。它将如下所示：\n\n```\n1.  import {add}\
  \ from './utils.js';\n2.  let result = add(5, 6);\n3.  document.getElementById('result').innerHTML\
  \ = result;\n```\n\n**代码 6.16：** 模块的 index.js\n\n在 `index.js` 文件中，我们首先尝试从 `utils.js`\
  \ 文件中导入函数 `add`。为此，我们使用关键字 `import`，然后在花括号内导入函数名。最后，我们通过指定需要导入该函数的文件路径来完成这一行。为什么我们要加花括号？我们加花括号是因为每个文件可能导出多个其他函数。我们可能只想使用其中几个函数。这些函数可以通过用逗号分隔它们的名称来导入。\n\
  \n如果在*代码示例 6.15*中我们在关键字 `export` 之后添加了关键字 `default`，那就意味着整个文件只用于导出一个函数，即 `add` 函数。在这种情况下，导入时我们不需要花括号。\n\
  \n*代码示例 6.16*的其余部分存储了函数 `add` 执行的结果，并将其赋值给 HTML 文件中的一个空 span 元素。\n\n我强烈建议你在自己的机器上执行这个文件。这将帮助你更好地理解代码。\n\
  \n### 结论\n\n在这个相当长的章节中，我们学习了 ES6 引入的几个特性。单独挑出任何一个特性都是不合适的。然而，列举一些你将在创建下一代应用时经常使用的\
  \ ES6 特性，包括但不限于箭头函数、`let` 和 `const`、解构以及展开运算符。简而言之，像箭头函数这样的函数以及像 `map`、`filter`\
  \ 和 `reduce` 这样的新数组方法，不仅减少了代码行数，还简化并提高了 JavaScript 的执行速度。同样，`let` 和 `const` 帮助你创建作用域，这可以避免在创建企业级应用时出现重大陷阱。其余的特性有助于改进和促进\
  \ JavaScript 的更快执行。ES6 是几个顶级前端库的基础，这些库用于创建像 *Facebook*、*Twitter*、*Instagram* 等流行的\
  \ Web 应用。事实上，像 *ReactJS* 这样的库积极要求开发者在学习 React 之前先学习 ES6。React 大量使用了 ES6 的几个重要特性。在下一章中，我们将学习类。类是\
  \ ES6 引入的一个 JavaScript 概念，用于简化对象模板的创建。\n\n### 要点回顾\n\n*   JavaScript 中的提升是将声明移动到顶部的过程。需要注意的是，只有声明被移动到顶部，而不是初始化。\n\
  \n*   ES6 引入了两个用于创建变量的新关键字——`let` 和 `const`。`let` 和 `const` 都创建了一种新的作用域类型，称为块级作用域。在块级作用域中，变量的存在仅限于该块。这些变量在块外部不可访问。你不能更改由\
  \ `const` 设置的值。\n\n*   对象的 `bind`、`call` 和 `apply` 方法用于绑定对象的 `this` 值。\n\n*   三元运算符是条件\
  \ `if…else` 语句的简化方式。三元运算符最适合用于需要返回某个值的情况。\n\n*   剩余参数的优势在于当你不确定函数所需的参数数量时。展开运算符与剩余参数具有相同的语法。然而，展开运算符用于连接或复制数组或对象。\n\
  \n*   也许 ES6 引入的最佳特性之一是模板字面量。模板字面量取代了传统的字符串拼接方法，不仅允许更简单的方式在字符串中插入变量，还支持多行字符串。\n\n\
  *   箭头函数有两个重要目的——简化编写返回值的函数的过程，以及移除函数内部 `this` 关键字的绑定。\n\n*   ES6 引入了三种新的数组方法——`map`、`filter`\
  \ 和 `reduce`。这三种方法都会遍历数组的每个元素，并且只应在需要返回新数组时使用。`map` 方法允许你操作数组的每个元素，`filter` 方法允许你根据条件过滤数组元素，`reduce`\
  \ 方法用于将数组的所有元素归约为单个值。\n\n*   数组和对象解构类似于将数组或对象的值拆解到单独的变量中。\n\n*   ES6 模块是一种创建可复用函数的方法，这些函数可以在应用程序工作区中导入和导出。\n\
  \n### 选择题\n\n1.  **以下代码中第 5 行的输出是什么？**\n\n    ```\n    1.  let number = 50;\n  \
  \  2.  {\n    3.      let number = 25;\n    4.  }\n    5.  console.log(number);\n\
  \    ```\n\n    1.  25\n    2.  50\n    3.  错误\n\n2.  **以下代码中第 4 行的输出是什么？**\n\n\
  \    ```\n    1.  let numbers = [2, 4, 6];\n    2.  let even = numbers;\n    3.\
  \  numbers[0] = 7;\n    4.  console.log(even);\n    ```\n\n    1.  [7, 4, 6]\n \
  \   2.  [2, 4, 6]\n    3.  错误\n\n### 答案\n\n1.  **b**\n2.  **a**\n\n# 第 7 章\n\n##\
  \ 类\n\n在上一章中，我们深入探讨了 ES6。在本章中，我们将学习 JavaScript 中最令人兴奋的补充之一——ES6 类。在撰写本文时，类已成为 JavaScript\
  \ 编码中不可或缺的一部分。简单来说，类不过是“*特殊函数*”。随着我们深入学习本章，我们将理解类如何以及为何是本书前面学过的函数的优美扩展。如果你打算学习像\
  \ ReactJS 或 VueJS 这样的前端库，学习类将对你大有裨益。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   理解类\n*\
  \   类与方法\n*   继承\n*   Getter 和 Setter\n\n### 目标\n\n学习完本章后，你应该能够理解如何使用 JavaScript\
  \ 类，并将它们用作创建对象的模板。你将能够创建一种严格的结构来封装数据。\n\n# 理解类\n\nES6 将 JavaScript 引入了类的世界。在本书之外，你将了解到\
  \ ReactJS（由 Facebook 公司创建的世界最流行的前端库之一）将类变成了 Web 开发语言的关键部分。\n\n正如我之前提到的，类是一种特殊的函数。在*第\
  \ 5 章：对象*中，我们学习了对象和原型来创建对象。让我们再看一下那个例子：\n\n```\n1.  function Person(first, last)\
  \ {\n2.      this.firstName = first;\n3.      this.lastName = last;\n4.  }\n5. \
  \ Person.prototype.getFullName = function() {\n6.      console.log(`${this.firstName}\
  \ ${this.lastName}`);\n7.  }\n```\n\n**代码 7.1：** 对象和原型\n\n\n\n\n\n在前面的*代码示例 7.1*中，我们使用了一个函数来为对象\
  \ `persons` 创建模板。在 ES6 之前，创建对象模板的最佳方式是使用函数。ES6 引入了类，以提供一种规范且结构化的格式来生成对象模板。\n\n前面*代码示例\
  \ 7.1*中展示的例子可以用类重写如下：\n\n```\nclass Person {\n    constructor(first, last) {\n \
  \       this.firstName = first;\n        this.lastName = last;\n    }\n\n    getFullName\
  \ = () => {\n        console.log(`${this.firstName} ${this.lastName}`);\n    }\n\
  }\n\nlet father = new Person('John', 'Doe');\nfather.getFullName();  //John Doe\n\
  ```\n\n**代码 7.2：** 类\n\n如*代码示例 7.2*所示，我们采用了一种更结构化的方式，以类的形式创建对象模板。要定义一个类，我们使用关键字\
  \ `class`，后跟类名和一对花括号。\n\n每个类总是有一个名为 `constructor` 的默认方法。构造函数指定了类的属性。即使用户没有显式创建 `constructor`\
  \ 方法，它也始终存在。当类对象被初始化时，这个构造函数方法总是第一个被调用的。\n\n你还可以在类内部添加方法。我们将在下一节详细学习这些方法。\n\n最后，要使用一个类，你需要使用\
  \ JavaScript 关键字 `new` 和一对括号来创建类的实例。你可以在括号中添加任意数量的参数。从逻辑上讲，这些参数应该在构造函数内部被访问。如*代码示例\
  \ 7.2*的第 12 行所示，使用关键字 `new` 会创建类 `Person` 的一个实例。\n\n# 何时使用函数，何时使用类？\n\n通俗地说，函数和类之间的简单区别如下：\n\
  \n*   **函数** 是一种封装可重用代码的方式。\n*   **类** 是 JavaScript 对象的蓝图。\n\n因此，当我们编写将在脚本中多次重用的代码时，可以将其封装在函数中。然而，当我们需要创建一个需要多次生成的对象时，我们使用类来定义对象的属性和方法。\n\
  \n# 类会被提升吗？\n\n在前面的章节中，我们了解到在 JavaScript 中，变量和函数声明会被“移动到脚本的顶部”。这种“移动到顶部”被称为 *JavaScript\
  \ 提升*。\n\n然而，与变量和函数不同，JavaScript 类不会被提升。如下图所示，JavaScript 在第一行就抛出了一个错误（红色高亮错误中冒号后的数字\
  \ 1 表示）。这意味着每次需要使用类时，都需要先定义它，然后才能使用。\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1：** 类声明不会被提升\n\
  \n# 类与方法\n\n在*第 5 章：对象*中，我们了解到在对象内部定义的函数被称为 *方法*。由于类主要是创建对象的蓝图，因此在类内部创建的函数也被称为 *方法*。在前面的*代码示例\
  \ 7.2*中，我们已经看到了两个方法——`constructor` 和 `getFullName`。如果你仔细观察*代码示例 7.2*，你会注意到我们不需要声明在类内部创建的方法。\n\
  \n在 JavaScript 类中，有以下四种类型的方法：\n\n*   **constructor**\n\n    构造函数是类的一个特殊方法。即使开发者选择不显式创建它，它也默认存在。如果开发者选择不添加构造函数，JavaScript\
  \ 会添加一个不可见的空构造函数方法。当类被初始化时，构造函数会自动调用。\n\n    构造函数的主要任务是创建并初始化类的对象。你可以在构造函数内部指定类的属性。\n\
  \n    让我们借助*代码示例 7.3*来回顾构造函数的语法：\n\n    ```\n    class Person {\n        constructor(first,\
  \ last) {\n            this.firstName = first;\n            this.lastName = last;\n\
  \            this.nationality = \"French\";\n        }\n    }\n\n    let father\
  \ = new Person('John', 'Doe');\n    ```\n\n    **代码 7.3：** 类的构造函数方法\n\n    如前面的*代码示例\
  \ 7.3*所示，要创建一个构造函数，你需要使用关键字 `constructor`。请注意，只有确切的名称为 `constructor` 才能用于创建构造函数。如*代码示例\
  \ 7.3*所示，构造函数方法可以接受多个参数。这些参数是在使用 `new` 关键字创建类的新实例时传入的参数。如*代码示例 7.3*的第 9 行所示，参数 `\"\
  John\"` 和 `\"Doe\"` 作为参数传递给构造函数方法。\n\n    **提示：** 当需要在类中的任何代码执行之前初始化数据时，请使用构造函数方法。\n\
  \n*   **通用方法**\n\n    我们已经在*代码示例 7.2*中看到了一个通用 JavaScript 方法的例子。让我们通过另一个代码示例来理解类的方法：\n\
  \n    ```\n    class Person {\n        constructor(first, last) {\n            this.firstName\
  \ = first;\n            this.lastName = last;\n        }\n\n        getFullName\
  \ = () => {\n            console.log(`${this.firstName} ${this.lastName}`);\n  \
  \      }\n\n        addNationality() {\n            this.nationality = \"French\"\
  ;\n        }\n    }\n\n    let father = new Person('John', 'Doe');\n    father.getFullName();\
  \    //John Doe\n    father.addNationality();\n    console.log(father);    //{age:\
  \ 24, firstName: \"John\", lastName: \"Doe\"}\n    ```\n\n    **代码 7.4：** 传统的 JavaScript\
  \ 方法\n\n    如*代码示例 7.4*所示，你可以使用 ES6 箭头函数或传统的 JavaScript 函数。要调用类内部的方法，首先需要创建该类的一个实例，如*代码示例\
  \ 7.4*的第 16 行所示。接下来，你可以通过输入类实例的名称，然后使用一对括号调用方法名来调用该方法。与一般的 JavaScript 方法一样，你可以在方法调用时通过在括号内添加值来向这些方法传递参数。\n\
  \n    如果你一直仔细观察，你会发现当你在类内部使用方法时，不需要声明它。这是因为这些方法是类对象 `Person` 的一部分。\n\n*   **静态方法**\n\
  \n    静态方法是一种特殊的方法。你可以在以下任何一种情况下使用静态方法：\n\n    *   **不依赖类实例**：方法内部的代码不依赖于正在生成的类实例。事实上，如果方法内部的代码根本不使用实例变量，我们应该将其用作静态方法。\n\
  \n\n\n\n\n* **代码共享**：如果实例中的所有方法都将共享一段代码，那么将其用作静态方法更有意义。例如，如果我们有一个计算任意几何图形面积的类 `Area`，我们可能需要一个函数来将任意数字的小数点限制为两位。这样的函数将被类中的所有方法共享以进行计算。这个函数，或者说这个方法，应该是一个静态方法。\n\
  * **方法定义不变**：如果方法的定义或方法中编写的代码不应被更改或重写，则应使用静态方法。\n* **工具类**：如果你正在编写一个不属于代码实际流程，但间接帮助实际流程的类，它应该拥有静态方法。\n\
  \n静态方法定义在类本身上，而不是类的实例上。\n\n要创建静态方法，我们需要在方法前面添加 JavaScript 关键字 `static`。\n\n如下面的截图所示，我们定义了一个静态方法\
  \ `toTwoDecimals`。如果我们在类本身上调用静态方法，它将会执行。然而，如果你尝试在类实例 `rectangle` 上执行 `toTwoDecimals`\
  \ 方法，会导致错误。\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：** 静态方法\n\n# 继承\n\n简单来说，继承意味着从前一个持有者那里接收属性或金钱。JavaScript\
  \ 遵循类似的解释。在 JavaScript 中，当你在类定义中使用 JavaScript 关键字 `extends` 时，它会继承关键字 `extends`\
  \ 后面指定的类名的所有方法。除了关键字之外，你还需要在子元素的构造函数中调用 `super()` 方法，以访问父类的所有属性和方法。\n\n让我们通过一个例子来理解继承：\n\
  \n![](img/Figure-7.3.jpg)\n\n**图 7.3：** 继承\n\n在上面的截图中，我们有一个类 `Person`，它内置了属性 nationality\
  \ 和 language，分别设置为 English 和 UK English。`Person` 类还接受一个参数 age。我们还有一个类 `Student`，它扩展了类\
  \ `Person`。当我们使用关键字 `extends` 时，JavaScript 允许一个类从另一个类继承属性和方法。在*图 7.3* 的情况下，类 `Student`\
  \ 调用 `super (props)` 方法来访问父类 `Person` 的所有属性和方法。因此，当调用类 `Student` 的 `display` 方法时，它会显示来自类\
  \ `Student` 和类 `Person` 两者的属性值。\n\n继承对于代码复用非常有用。它有助于在创建新类时重用现有类的属性和方法。\n\n# 获取器和设置器\n\
  \n在前面的部分中，我们看到了 ES6 类中使用的四种不同类型的方法。最后一类被称为获取器和设置器。根据这个词本身的定义，获取器和设置器是 JavaScript\
  \ 类内部用于获取类属性值和设置类属性值的方法。这些方法无缝地融入类定义中。然而，我们可以做的远不止简单地获取和设置值。这些方法可以帮助我们在获取或设置值之前编写一些需要执行的代码。例如，如果我们想在设置值之前向服务器发送一个请求，我们可以在\
  \ `set` 方法内部完成。\n\n简单来说，获取器和设置器是一种结构化的方式来获取和设置类的值。我们可以使用 JavaScript 关键字 `get` 和\
  \ `set` 来创建 `get` 和 `set` 方法。对于设置器，它还可以接受参数来设置属性值。\n\n这里需要记住的一个重要点是，获取器和设置器方法的名称不能与属性的名称相同。让我们通过一个例子来理解：\n\
  \n在*图 7.4* 中，我们有一个类 `Person`，它有一个属性 name。我们还创建了一个 `get` 方法和一个 `set` 方法。正如我之前提到的，你不能为获取器和设置器使用与属性名称相同的名称。因此，我们使用了方法名称\
  \ `personName` 而不是属性名称 `name`。请注意，你不需要显式调用 `get` 和 `set` 方法。当你尝试获取或设置属性的值时，它们会在幕后工作。\n\
  \n现在，让我们考虑一个烤面包机的例子。在我们生命中的某个时刻，我们一定使用过或见过烤面包机。这是一个易于使用的产品。你只需要将面包片放入指定区域，然后打开机器。当面包片被烤好时，它们会弹出来。在外观上，有两个放置面包的空位、一个弹出面包片的按钮、一个打开机器的按钮以及一个用于设置烤面包焦黑程度的旋钮。然而，如果我让你打开机器，看到其复杂的内部结构，然后再用它来烤面包，你还能使用它吗？\n\
  \n这个例子说明了为什么将某些实现和方法对工具保持私有至关重要，以及不将其公开的充分理由。类似地，我们可以将某些变量和方法设为类的私有。我们将在倒数第二章——ES6\
  \ 及更高版本中，结合最新引入的私有方法更详细地探讨这一点。\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4：** 获取器和设置器\n\
  \n### 结论\n\n类是创建对象模板的绝佳方式。事实上，正如我之前提到的，当你使用像 ReactJS 或 VueJS 这样的前端库时，类会成为 JavaScript\
  \ 最重要的特性之一。在本章中，我们学习了如何创建类，更重要的是，在哪里使用类。我们还学习了可以在类中使用的不同类型的方法。从下一章开始，我们将进入高级 JavaScript\
  \ 的更实际应用，涉及与服务器的通信。\n\n### 要点\n\n* 类是在 ES6 中引入的，用于创建更结构化的对象模板编写格式。\n* 类有四种不同类型的方法。\n\
  * 构造函数方法是类内部的默认方法。它是对象初始化时第一个被调用的方法。通常，构造函数用于设置类的初始值。\n* 即使没有显式创建构造函数方法，JavaScript\
  \ 也会在幕后默认调用它。\n* 如果你有一个方法，它不依赖于类实例，或者方法内部的脚本不会被修改，你可以使用 JavaScript 关键字 `static`\
  \ 将其转换为静态方法。\n* JavaScript 类可以使用 `extends` 关键字继承另一个类的属性和方法，并在子类的构造函数中调用 `super()`\
  \ 方法。\n* 最后，类提供了可选的单独方法用于获取或设置类属性的值。必须注意避免将这些方法命名为与属性相同的名称。\n\n### 选择题\n\n1. **构造函数不是类初始化时第一个被调用的方法——正确还是错误？**\n\
  \n    1. 正确\n    2. 错误\n\n2. **以下代码中第 8 行的输出是什么？**\n\n    ```\n    1. class Person\
  \ {\n    2.     static display(name) {\n    3.         console.log(name);\n    4.\
  \     }\n    5. }\n    7. let father = new Person(\"John\");\n    8. father.display();\n\
  \    ```\n\n    **代码 7.5：**\n\n    1. John\n    2. undefined\n    3. 错误：`father.display()`\
  \ 不是一个函数\n\n\n\n\n\n### 答案\n\n1.  **b**\n2.  **c**\n\n# 第 8 章\n\n## 回调与 Promise\n\
  \n从本章开始，你将步入实际 Web 开发的严酷现实世界。本章标志着与服务器交互的入门。\n\n让我们以 Twitter 或 Facebook（撰写本文时）这样的典型\
  \ Web 应用为例。这些应用每天有近 1 亿用户使用。显然，这些平台需要一个安全可靠的环境，不仅用于存储和获取海量用户数据，还能在需要时执行复杂计算。在技术世界中，这样的地方被称为服务器，每个真正的\
  \ Web 应用都需要服务器来正常运行。\n\n在本章中，你将学习如何从 Web 应用的前端与服务器交互。首先，你将探索异步 JavaScript 的世界，这是与服务器协作的核心。之后，你将详细了解回调函数（我们在*第\
  \ 3 章：函数*中探讨过的概念），最后，我们将通过理解 JavaScript Promise 来结束本章——这是一种处理异步 JavaScript 的简化方式。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   异步 JavaScript\n*   回调\n*   回调地狱\n*   Promise\n\
  \n### 目标\n\n学习本章后，你应该能够理解异步 JavaScript 的概念。你将能够在不影响 Web 应用流程的情况下与服务器交互并获取数据。你可以使用\
  \ JavaScript 回调和 Promise 来处理异步请求。\n\n# 异步 JavaScript\n\n到目前为止，你在本书中看到的大部分 JavaScript\
  \ 都是同步的。同步代码意味着每一行代码都会耐心等待前一行代码执行完毕。让我们通过一个例子来理解这一点。\n\n1.  `console.log(\"Wake\
  \ up\");`\n2.  `console.log(\"Brush your teeth\");`\n3.  `console.log(\"Take a shower\"\
  );`\n\n    **代码 8.1：** 同步 JavaScript\n\n当我们执行上述*代码示例 8.1*中的脚本时，输出结果显然如下所示：\n\n![](img/Figure-8.1.jpg)\n\
  \n**图 8.1：** 同步 JavaScript 的输出\n\n从*代码示例 8.1*和*图 8.1*可以看出，每一行代码都会等待前一行代码执行完毕后，才执行本行代码。这种等待前一行代码完成执行的行为被称为*同步\
  \ JavaScript*。\n\n现在让我们修改*代码示例 8.1*中的代码。\n\n1.  `console.log(\"Wake up\");`\n3.\
  \  `setTimeout(() => {`\n4.  `    console.log(\"Brush your teeth\");`\n5.  `}, 2000);`\n\
  7.  `console.log(\"Take a shower\");`\n\n    **代码 8.2：** 异步 JavaScript\n\n在前面的章节中，我们学习了`setTimeout`函数。快速回顾一下，`setTimeout`函数接受两个参数——一个匿名函数和时间（毫秒）。它会等待第二个参数指定的时间，然后执行第一个参数中的代码。记住这一点，*代码示例\
  \ 8.2*的输出将如下所示：\n\n![](img/Figure-8.2.jpg)\n\n**图 8.2：** 异步 JavaScript 的输出\n\n如上面的截图所示，语句*Brush\
  \ your teeth*在语句*Take a shower*之后被记录。在这种情况下，*代码示例 8.2*中第 7 行的代码不会等待第 3-5 行的代码执行完毕。相反，它在浏览器等待两秒（从到达第\
  \ 3-5 行开始）的同时完成了执行。两秒结束后，第 3-5 行的代码才被执行。\n\n这种不等待前一段代码完成执行的方法被称为*异步 JavaScript*。在上面的例子中，`setTimeout`函数使第\
  \ 4 行变成了异步。\n\n# 自己动手试试\n\n如果执行下面*代码示例 8.3*中的代码，会发生什么？\n\n在浏览器或机器上尝试之前，花几秒钟思考一下答案。\n\
  \n1.  `console.log(\"The order arrives.\");`\n3.  `setTimeout(() => {`\n4.  `  \
  \  console.log(\"Eat fries.\");`\n5.  `}, 2000);`\n7.  `console.log(\"Eat the burger.\"\
  );`\n8.  `console.log(\"Eat the pasta.\");`\n10.  `setTimeout(() => {`\n11.  ` \
  \   console.log(\"Drink the soda.\");`\n12.  `    console.log(\"Eat the garlic bread.\"\
  );`\n13.  `}, 3000);`\n15.  `console.log(\"Eat the chocolate cake.\");`\n\n    **代码\
  \ 8.3：** 自己动手试试的例子\n\n# 何时使用异步 JavaScript\n\n让我们考虑一个更实际的场景。当你在浏览器地址栏中输入**https://www.google.com**时，浏览器是否总是在完全相同的时间渲染\
  \ Google 的主页？\n\n答案是否定的。可以说，Google 主页的渲染取决于多个因素。其中主要因素包括你的网速以及服务器处理请求的速度。\n\n那么，如果我们的整个\
  \ JavaScript 代码是同步的，并且依赖于从服务器收到的响应，会发生什么？我们知道，在最坏的情况下，我们的网页可能需要超过一分钟才能完全渲染。想想那些你输入网站名称后，网站加载了很长时间的情况。显然，你或任何其他用户都会感到沮丧，并在一段时间后离开页面。\n\
  \n因此，当与服务器协作时，确保代码是异步的至关重要。这将确保即使服务器响应时间很长，JavaScript 也不会一直等待，而是继续执行后面的代码。\n\n#\
  \ 回调函数\n\n在*第 3 章：函数*中，我们看到了几种类型的函数。其中一种特别适用于异步 JavaScript 的函数是*回调*函数。当一个函数接受另一个函数作为参数时，被包含的函数称为回调函数。也许回调函数最好的例子就是我们在*代码示例\
  \ 8.2*和*8.3*中看到的`setTimeout`函数。\n\n然而，回调函数不一定是匿名的。让我们看一个命名回调函数的例子：\n\n1.  `function\
  \ greet(name) {`\n2.  ``    console.log(`A very good day to you, ${name}`);``\n\
  3.  `}`\n5.  `function initialize(firstName, lastName, callback) {`\n6.  ``    let\
  \ fullName = `${firstName} ${lastName}`;``\n8.  `    callback(fullName);`\n9.  `}`\n\
  11.  `initialize('John', 'Doe', greet);`\n\n    **代码 8.4：** 命名回调函数\n\n在上述*代码示例 8.4*中，我们有两个函数——initialize\
  \ 和 greet。当定义 initialize 函数时，我们将 greet 函数作为参数传递。\n\n![](img/Figure-8.3.jpg)\n\n\
  **图 8.3：** 代码示例 8.4 的输出\n\n如上面的截图所示，greet 函数作为参数传递。在 initialize 函数内部，greet 函数位于变量参数\
  \ callback 中。这个变量 callback 被调用，并将变量`fullName`作为参数传递给它。最后一行显示的输出确认了我们的命名回调确实被调用了。\n\
  \n# 回调函数如何帮助异步 JavaScript\n\n\n\n\n\n异步 JavaScript 函数的本质在于，开发者几乎无法预知脚本何时会收到响应（以服务器为例）。这实际上意味着，如果某段代码依赖于从服务器收到的响应，那么它只应在收到响应后执行。\n\
  \n例如，一个电子商务 Web 应用向服务器请求了用户添加到购物车的商品数据。在从服务器收到这些特定数据之前，显示购物车页面是没有意义的，对吧？如果我们尝试在未收到响应时显示该页面，它要么显示空购物车，要么显示错误的购物车。同时，由于只有显示购物车的页面依赖于该请求，其余页面应继续渲染而不被阻塞。\n\
  \n为了解决这个问题，我们可以引入一个回调函数，仅在请求成功完成时执行依赖的代码块。让我们通过一个例子来理解。\n\n```\nconst view = (url)\
  \ => {\n    console.log(`Loading ${url}`);\n}\n\nconst download = (url, callback)\
  \ => {\n    setTimeout(() => {\n        console.log(`Downloading ${url}`);\n   \
  \     callback(url);\n    }, 2000)\n}\n\ndownload(\"https://cdn.shopify.com/s/files/1/0329/9547/5515/files/350X240_55x.png?v=1603344594\"\
  , view);\n```\n\n**代码 8.5：** 异步代码中的回调函数\n\n在上述*代码示例 8.5*中，我们有两个函数——`view` 和 `download`。目前，为了保持代码简单，这些函数的唯一工作是打印一条语句。然而，在实际场景中，我们只有在下载图像后才能查看图像，对吧？这个逻辑使得函数\
  \ `view` 依赖于函数 `download` 的结果。因此，作为回调传递给函数 `download` 的函数 `view`，只有在函数 `download`\
  \ 完成打印其语句后才会被调用。当你在本地机器上执行*代码示例 8.5*时，两秒后屏幕上的输出将如下截图所示：\n\n![](img/Figure-8.4.jpg)\n\
  \n**图 8.4：** 代码示例 8.5 的输出\n\n然而，总会出现向服务器请求失败的情况。失败的原因可能有很多——从网络问题到错误的 URL。如果我们不处理这个服务器请求失败，有时甚至可能导致应用程序崩溃。Web\
  \ 开发中的一个良好实践是在异步代码中包含错误处理程序。对于上述*代码示例 8.5*，我们将通过引入 `if…else` 条件来引入错误处理。在本章的最后一节——Promise\
  \ 中，我们将学习一种更好的错误处理方式。\n\n```\nconst view = url => {\n    console.log(`Loading ${url}`);\n\
  }\n\nconst errorHandler = error => {\n    console.log(`The error is ${error}`);\n\
  }\n\nconst download = (url, success, error) => {\n    setTimeout(() => {\n     \
  \   console.log(`Downloading ${url}…`);\n        if(!url || url.length === 0) {\n\
  \            error('URL is not provided');\n        } else {\n            success(url);\n\
  \        }\n    }, 2000)\n}\n\ndownload(\"https://cdn.shopify.com/s/files/1/0329/9547/5515/files/350X240_55x.png?v=1603344594\"\
  , view, errorHandler);\ndownload(\"\", view, errorHandler);\n```\n\n**代码 8.6：**\
  \ 回调中的错误处理\n\n在上述*代码示例 8.6*中，我们在异步函数 `download` 内部引入了一个错误处理程序。实际上，我们将错误处理函数作为第三个参数传递给函数\
  \ `download`。在函数 `download` 内部，我们检查参数中传递的 URL 是否存在以及 URL 的长度。如果任一条件返回 false，则会调用错误处理回调函数，否则调用成功回调函数。当你执行上述代码时，输出如下所示：\n\
  \n![](img/Figure-8.5.jpg)\n\n**图 8.5：** 代码示例 8.6 的输出\n\n在下一章中，我们将介绍用于连接现有服务器的 API。因此，在本章中，我们将借助\
  \ `setTimeout` 函数来模拟 JavaScript 代码的异步行为。\n\n# 回调地狱\n\n在上一节中，我们学习了如何使用回调来解决 JavaScript\
  \ 中异步代码的问题。然而，使用回调存在一个主要问题。让我们通过一个例子来理解这个问题。\n\n在前面的例子中，我们只处理了下载和查看一个 URL。如果有多个\
  \ URL 需要下载呢？此外，如果每次下载都依赖于前一次下载的完成呢？\n\n请花些时间思考并尝试为上述问题提出一个解决方案。\n\n通过对代码进行一些修改以适应我们的需求，我们可以复制上述*代码示例\
  \ 8.6*来下载三个 URL，如下面的*代码示例 8.7*所示：\n\n```\nconst view = url => {\n    console.log(`Loading\
  \ ${url}`);\n}\n\nconst errorHandler = error => {\n    console.log(`The error is\
  \ ${error}`);\n}\n\nconst download = (url, callback) => {\n    console.log(`Downloading\
  \ ${url}…`);\n    callback();\n}\n\nlet url1 = \"https://images.freeimages.com/images/large-previews/4ab/fruits-and-vegetables-1-1324165.jpg\"\
  ;\nlet url2 = \"https://images.freeimages.com/images/large-previews/d42/vegetables-4-1189021.jpg\"\
  \nlet url3 = \"https://images.freeimages.com/images/large-previews/360/banana-1-1330048.jpg\"\
  \n\ndownload(url1, function() {\n    setTimeout(() => {\n        if(url1.length\
  \ !== 0) {\n            view(url1);\n            download(url2, function() {\n \
  \               setTimeout(() => {\n                    if(url2.length !== 0) {\n\
  \                        view(url2);\n                        download(url3, function()\
  \ {\n                            setTimeout(() => {\n                          \
  \      if(url3.length !== 0) {\n                                    view(url3);\n\
  \                                } else {\n                                    errorHandler(\"\
  URL is not provided\");\n                                }\n                   \
  \         }, 2000)\n                        })\n                    } else {\n \
  \                       errorHandler(\"URL is not provided\");\n               \
  \     }\n                }, 2000)\n            })\n        } else {\n          \
  \  errorHandler(\"URL is not provided\");\n        }\n    }, 2000)\n});\n```\n\n\
  **代码 8.7：** 回调地狱\n\n如果你一开始在阅读或理解上述*代码示例 8.7*中第 18 到 44 行的代码时遇到困难，这正是所谓的*回调地狱*。\n\
  \n简单来说，当你处理多个依赖于某个请求或条件执行的函数调用时，会导致回调函数格式混乱且难以理解。这种混乱的结构被称为*厄运金字塔*或*回调地狱*。实际上，请求数量越多，维护这种条件性的回调功能就越困难。在上述*代码示例\
  \ 8.7*中，我们处理了三个需要顺序下载的 URL。想象一下，如果我们需要处理 20 个或 100 个这样的请求。为了解决回调地狱的问题，JavaScript\
  \ 引入了 async/await 和 Promise 的概念。\n\n# Promise\n\n为了理解 Promise，让我给你一个非常简单的现实生活例子：\n\
  \n\n\n\n*一支流行乐队在全球拥有数百万粉丝。这支乐队以在各城市为粉丝举办演唱会而闻名。然而，过去几个月来，乐队一直没有举办任何演出。忧心忡忡的粉丝们频繁催促乐队公布下一场演唱会的细节。最终，乐队回应并请求粉丝在\
  \ Twitter 和 Facebook 等社交媒体平台上关注他们。乐队向粉丝承诺，凡是关注他们社交媒体平台的人，将最先收到下一场演唱会的更新信息。事实上，如果乐队因任何不可预见的情况而不举办演出，关注他们社交媒体的粉丝也将最先得到通知。*\n\
  \n上述例子完美地定义了 JavaScript Promise 的工作方式。如果我们仔细观察上述例子，会发现其中包含三个重要部分，如下所示：\n\n*   **生产者**，或编程术语中的**生产代码**：指需要花费一些时间才能完成某件事的实体。在上述例子中，指的是需要花费时间举办演唱会的乐队。\n\
  *   **消费者**，或编程术语中的**消费代码**：指生产者结果的接收者。例如，在上述例子中，指的是等待乐队举办下一场演唱会的粉丝。\n*   **连接生产者与消费者的\
  \ Promise**：在上述例子中，社交媒体平台是连接生产者（乐队）与消费者（粉丝）的纽带。生产者从容地取得结果，而 Promise 在结果就绪时将其提供给所有消费者。\n\
  \n这可以用下图直观表示：\n\n![](img/Figure-8.6.jpg)\n\n**图 8.6：** Promise 的图形化表示\n\nJavaScript\
  \ Promise 的功能远不止简单地将生产代码与消费代码连接起来。正如我们之前提到的，我们永远无法知道一个请求何时完成，或者是否会失败。JavaScript\
  \ Promise 持有异步请求的状态。待定的 Promise 要么被兑现，要么被拒绝。当两者之一发生时，与 Promise 关联的处理程序会立即得到通知。\n\
  \n在任何给定时刻，Promise 都处于以下状态之一：\n\n*   **待定（Pending）**：Promise 创建时的初始状态。既未兑现，也未拒绝。\n\
  *   **已兑现（Fulfilled）**：表示请求已成功完成。\n*   **已拒绝（Rejected）**：表示请求失败。\n\n`Promise` 的语法如下：\n\
  \n```\nconst promise = new Promise(function(resolve, reject) {\n//Promise 的描述\n\
  }\n```\n\n**代码 8.8：** Promise 的语法\n\n如 *代码示例 8.8* 所示，`Promise` 对象通过 `new` 关键字创建。`Promise`\
  \ 包含一个带有 resolve 和 reject 回调的函数执行体。这个传递给 `Promise` 对象的函数被称为执行器（executor）。当创建 `Promise`\
  \ 时，执行器会立即自动执行。\n\n通常，对服务器的请求会被添加到执行器内部。\n\n每当执行器获得结果时，它应该调用其中一个回调：\n\n*   `resolve(value)`：如果请求或任务成功完成，结果由变量\
  \ `value` 表示。\n*   `reject(error)`：如果请求失败，错误由变量 `error` 表示。\n\n从视觉上看，Promise 的工作方式如下：\n\
  \n![](img/Figure-8.7.jpg)\n\n**图 8.7：** Promise 的工作方式\n\n让我们将本节开头的例子转化为代码：\n\n```\n\
  let ready = true;\n\nlet promise = new Promise((resolve, reject) => {\n    setTimeout(()\
  \ => {\n        if(ready) {\n            let details = {\n                location:\
  \ 'Manchester Arena',\n                city: 'Manchester, UK',\n               \
  \ date: '21/12/2020',\n                time: '17:00 CST'\n            };\n     \
  \       resolve(details);\n        } else {\n            reject('抱歉，我们今年将不会举办任何演唱会。');\n\
  \        }\n    }, 2000);\n});\n\npromise.then((details) => {\n  console.log(\"\
  太棒了！演唱会要举办了！\");\n  console.log(details);\n})\n.catch((error) => {\n    console.log(error);\n\
  })\n```\n\n**代码 8.9：** 作为 Promise 的演唱会示例\n\n如上述 *代码示例 8.9* 所示，其语法比回调函数更结构化、更易读。*代码示例\
  \ 8.9* 可以分为两部分。从第 3 行到第 18 行的代码定义了“如何创建 Promise？”，而从第 19 行到第 25 行的代码展示了“如何使用 Promise？”。\n\
  \n在上述 *代码示例 8.9* 中，我们使用关键字 `new` 创建了一个 `Promise` 对象，并将其赋值给变量 `promise`。在 Promise\
  \ 内部，我们使用 `setTimeout` 函数作为执行器，并设置了两秒的定时器来模拟异步代码。在执行器内部，代码检查变量 `ready` 的值。如果 `ready`\
  \ 的值为 `true`，则表示请求已成功完成；因此我们调用 `resolve` 回调。在 `resolve` 回调中，我们将下一场演唱会的详细信息作为参数传递。然而，如果\
  \ `ready` 的值为 `false`，则表示请求失败；因此我们调用 `reject` 回调，并将错误消息 `'抱歉，我们今年将不会举办任何演唱会。'` 作为参数传递。\n\
  \n如 *代码示例 8.9* 的第 19 行到第 25 行所示，要使用 `Promise`，我们需要将 `.then()` 和 `.catch()` 方法链式调用到\
  \ Promise 上。如果请求成功完成且调用了 `resolve` 回调，则会执行 `then` 方法内的代码。如果请求失败且调用了 `reject` 回调，则会执行\
  \ `catch` 方法内的代码。\n\n由于我们将 `ready` 变量的值设为 `true`，等待后代码的输出如下：\n\n![](img/Figure-8.8.jpg)\n\
  \n**图 8.8：** 当 `ready===true` 时 代码示例 8.9 的输出\n\n类似地，如果变量 `ready` 为 `false`，等待后的输出将是：\n\
  \n![](img/Figure-8.9.jpg)\n\n**图 8.9：** 当 `ready===false` 时 代码示例 8.9 的输出\n\n这个过程可以可视化如下：\n\
  \n![](img/Figure-8.10.jpg)\n\n**图 8.10：** Promise 的过程\n\n# 链式调用 Promise\n\n现在我们已经了解了如何创建和使用\
  \ Promise，接下来看看如何利用 Promise 解决回调地狱的问题。\n\n在 *代码示例 8.9* 的基础上，我们创建另一个 Promise：\n\n\
  ```\nconst bookTicket = (date) => {\n  return new Promise((resolve, reject) => {\n\
  \    let message = `为 ${date} 预订门票`;\n    resolve(message);\n  })\n}\n```\n\n**代码\
  \ 8.10：** 创建一个新的 Promise\n\n在 *代码示例 8.10* 中，我们创建了一个新函数 `bookTicket`。在 `bookTicket`\
  \ 内部，我们创建了一个新的 `Promise`。在这个 Promise 的执行器中，我们调用 `resolve` 回调并传入变量 `message`。\n\n\
  接下来，我们对原始的 *代码示例 8.9* 做一些修改：\n\n```\nlet response = promise.then((details) => {\n\
  \    console.log(\"太棒了！演唱会要举办了！\");\n    console.log(\"详细信息：\", details);\n    return\
  \ bookTicket(details.date);\n})\n.catch((error) => {\n    console.log(error);\n\
  })\n```\n\n**代码 8.11：** 将新的 Promise 添加到我们 Promise 的 `then` 方法中\n\n\n\n\n\n在*代码示例\
  \ 8.11*中，我们通过添加以下两项内容修改了*代码示例 8.9*中展示的代码：\n\n* 首先，我们将*代码示例 8.10*中创建的`bookTicket`函数添加到\
  \ Promise 的`then`方法中。由于我们在`bookTicket`函数中传递了消息的 resolve，因此在`then`方法内部的`bookTicket`函数调用前添加了`return`。\n\
  * 其次，我们将整个 Promise 解析过程放入一个变量`response`中。\n\n最后，我们将 Promise 解析方法`.then()`和`.catch()`添加到变量`response`上，该变量持有在*代码示例\
  \ 8.10*中创建的新 Promise 的返回值。\n\n```\nresponse.then((details) => {\n    console.log(details);\n\
  }).catch((error) => {\n    console.log(error);\n})\n```\n\n**代码 8.12：** 创建变量 response\
  \ 的 Promise 解析方法\n\n将上述所有代码组合起来，我们得到如下内容：\n\n```\nlet ready = true;\n\nlet promise\
  \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        if(ready)\
  \ {\n            let details = {\n                location: 'Manchester Arena',\n\
  \                city: 'Manchester, UK',\n                date: '21/12/2020',\n\
  \                time: '17:00 CST'\n            };\n            resolve(details);\n\
  \        } else {\n            reject('Sorry, we will not be hosting any concerts\
  \ this year.');\n        }\n    }, 2000);\n});\n\nconst bookTicket = (date) => {\n\
  \    return new Promise((resolve, reject) => {\n        let message = `Book ticket\
  \ for ${date}`;\n        resolve(message);\n    })\n}\n\nlet response = promise.then((details)\
  \ => {\n    console.log(\"Hooray! The concert is happening!\");\n    console.log(\"\
  Details:  \", details);\n    return bookTicket(details.date);\n})\n.catch((error)\
  \ => {\n    console.log(error);\n})\n\nresponse.then((details) => {\n    console.log(details);\n\
  }).catch((error) => {\n    console.log(error);\n})\n\npromise.then((details) =>\
  \ {\n    console.log(`The concert is happening at ${details.location} in the city\
  \ of ${details.city} on ${details.date} at ${details.time}.`)\n})\n```\n\n**代码 8.13：**\
  \ 链式调用 Promise\n\n在*代码示例 8.13*中，我们整合了*代码示例 8.9*、*8.10*、*8.11*和*8.12*中编写的代码。最后，我们为变量`promise`添加了另一个解析方法，该变量持有我们在*代码示例\
  \ 8.9*中创建的 Promise 对象。\n\n当我们执行*代码示例 8.13*时，输出如下：\n\n![](img/Figure-8.11.jpg)\n\n\
  **图 8.11：** 代码示例 8.13 的输出\n\n上述截图显示了以下内容：\n\n* 由于变量`ready`为`true`，*代码示例 8.13*中的第\
  \ 27 行和第 28 行首先被执行。\n* 在第 29 行，我们调用了`bookTicket`函数。\n* 然而，对于我们在*代码示例 8.13*第 3 行创建的第一个\
  \ Promise，我们在该示例的第 41 行还有另一个`.then()`方法。因此，第 41-43 行的代码在`bookTicket`函数执行之前被执行。\n\
  * 最后，`bookTicket`函数执行器内部的 Promise 返回的 resolve 值被存储在变量`response`的值中。这导致第 35-39 行的代码被执行。因此，我们得到了*图\
  \ 8.11*中所示的最终响应。\n\n这就是我们如何链式调用多个 Promise。\n\n# async 和 await\n\n关键字`async`和`await`是编写\
  \ Promise 的语法糖。它们通常一起使用。\n\n# async\n\n一个`async`函数返回一个 Promise。如果`async`函数返回一个值，则该\
  \ Promise 将以该值被 resolve。然而，如果`async`函数抛出一个错误，则该 Promise 将以该值被 reject。让我们看一个`async`函数的例子：\n\
  \n```\nasync function eyeColor {\n    return \"red\";\n}\n```\n\n**代码 8.14：** async\
  \ 方法示例\n\n*代码示例 8.14*中展示的代码与*代码示例 8.15*中展示的代码相同：\n\n```\nfunction eyeColor {\n \
  \   return Promise.resolve(\"red\");\n}\n```\n\n**代码 8.15：** Promise 示例\n\n# await\n\
  \n关键字`await`只能与`async`函数一起使用。如果在非`async`函数中使用`await`，将会导致错误。\n\n`await`关键字确保所有 Promise\
  \ 相互等待。如果使用`await`，则不再需要使用`.then()`和`.catch()`方法。相反，我们需要使用传统的 JavaScript `try`和`catch`方法。让我们通过示例来理解这一点。\n\
  \n```\nasync function setName() {\n    let promise = new Promise((resolve, reject)\
  \ => {\n        setTimeout(() => resolve(\"John Doe\"), 2000);\n    })\n\n    let\
  \ result = await promise;\n\n    console.log(result);\n}\nsetName(); //John Doe\n\
  ```\n\n**代码 8.16：** async 和 await 示例\n\n如*代码示例 8.16*所示，第 6 行消除了对 Promise 的`then`和`catch`方法的依赖。在上面的示例中，我们成功接收到了\
  \ resolve 的响应。现在，让我们快速看一下使用`await`进行错误处理的示例。\n\n```\nasync function error() {\n\
  \    await Promise.reject(new Error(\"This is an error!\"));\n}\n\nasync function\
  \ error() {\n    throw new Error(\"This is an error!\");\n}\n```\n\n**代码 8.17：**\
  \ await 和错误示例\n\n在上面的*代码示例 8.17*中，两段代码是相同的，并且执行相同的操作。要使用`async`和`await`处理错误，我们需要使用`try`和`catch`：\n\
  \n```\nasync function setName() {\n    try{\n        let promise = new Promise((resolve,\
  \ reject) => {\n            setTimeout(() => reject(\"Error\"), 2000);\n       \
  \ })\n\n        let result = await promise;\n    }\n    catch(error) {\n       \
  \ console.log(error);\n    }\n\n    console.log(result);\n}\n\nsetName(); //Error\n\
  ```\n\n**代码 8.18：** 使用 async 和 await 进行错误处理\n\n如*代码示例 8.18*所示，当 Promise 抛出错误时，它会被`catch`捕获。这就是我们处理服务器请求及其错误的方式。\n\
  \n### 结论\n\n在本章中，我们为下一章学习 API 和服务器请求奠定了基础。在本章中，我们探讨了异步 JavaScript 的概念。当请求可能需要很长时间才能产生结果时（尤其是在服务器的情况下），异步\
  \ JavaScript 是最佳选择。为了处理异步 JavaScript，我们学习了回调函数。然而，回调函数常常导致一个称为*回调地狱*的复杂问题。为了解决这个问题，我们学习了\
  \ JavaScript Promise。在下一章中，我们将实时处理实际的 API；我们还将学习 AJAX，这是一种使用 Promise 处理服务器请求的方法。\n\
  \n### 要点回顾\n\n\n\n\n\n*   服务器响应请求没有固定的时间。这很大程度上取决于网络速度和服务器的负载能力。让 JavaScript 的执行被服务器请求阻塞是不明智的。这种将依赖于服务器响应的代码延迟执行，并允许其余代码继续执行的过程称为**异步\
  \ JavaScript**。\n*   回调最适合处理短期的异步请求。你可以将一个回调函数传递给处理异步代码的函数。这个回调函数只有在收到服务器响应时才会被调用。\n\
  *   然而，大量的请求使用回调效果不佳。这会导致混乱的代码，被称为*厄运金字塔*或*回调地狱*。\n*   Promise 是连接需要时间产生结果的代码和需要消费生产者代码结果的代码之间的桥梁。\n\
  *   如果请求成功，则调用 `resolve` 回调；如果请求失败，则调用 `reject` 回调。如果 `resolve` 回调被调用，它将在 Promise\
  \ 解析的 `then` 方法中可用。类似地，`reject` 回调将在 Promise 解析的 `catch` 方法中被捕获。\n*   最后，`async`\
  \ 和 `await` 简化了 Promise 的语法。\n\n### 选择题\n\n1.  **`await` 关键字可以在没有 `async` 关键字的情况下使用——正确还是错误？**\n\
  \n    1.  正确\n    2.  错误\n\n2.  **以下哪一项不是 Promise 的状态？**\n\n    1.  待定（Pending）\n\
  \    2.  保持（Holding）\n    3.  已完成（Fulfilled）\n    4.  已拒绝（Rejected）\n\n### 答案\n\n\
  1.  **b**\n2.  **b**\n\n# 第 9 章：AJAX 与服务器交互\n\n说实话，这一章可能是整本书中最重要的一章。让我们用一个简单的例子来理解这个说法。如果你稍加思考，就会意识到每次在浏览器中打开社交媒体网站（如\
  \ Facebook）时，内容并不总是一样的。你会看到不同的内容，因为每次打开 Facebook 时，你的浏览器都会向 Facebook 托管的服务器发送多个请求。这些请求的响应会渲染出你在浏览器中看到的**用户界面**（**UI**）。在现实世界中，你的工作将大量涉及创建依赖于从服务器接收的数据的\
  \ UI。\n\n在本章中，我们不仅将学习如何与服务器交互（以及与之相关的所有喧嚣），还将为下一章使用 API 创建实时网页奠定基础！在本章中，你将学习 AJAX（一种用于连接服务器的\
  \ JavaScript 过程）、JSON（用于从服务器发送或接收数据的通用格式）、请求、响应，并理解创建实时应用程序的基础知识。\n\n### 结构\n\n\
  在本章中，我们将涵盖以下主题：\n\n*   JSON——网络最喜爱的文件格式\n*   AJAX\n*   HTTP 头部\n\n### 目标\n\n学习完本章后，你应该能够与实际的真实服务器进行交互（终于！）。你可以利用从服务器接收的数据高效地更新\
  \ UI，并通过互联网安全地发送请求和接收响应。\n\n## JSON——网络最喜爱的文件格式\n\n在引言中，我们了解了浏览器与服务器交换数据的过程。在最简单的想象中，我们可以将其可视化如下：\n\
  \n![](img/Figure-9.1.jpg)\n\n**图 9.1：** 浏览器与服务器之间数据交换的图形化展示\n\n如果你让想象力驰骋，你可以想到一百种不同的格式用于客户端机器上的浏览器与服务器之间的数据交换。然而，想象一下，如果服务器必须通过互联网发送一个\
  \ 400MB 的视频作为响应。即使拥有最快的网速，用户也会因为等待浏览器接收这个视频作为服务器响应而无聊到死。更糟糕的是，想象一下如果你的 JavaScript\
  \ 不是异步的！这意味着用户将只能看到空白屏幕或加载图标，直到视频最终到达浏览器。（在慢速网络上可能需要半小时以上！）\n\n![](img/Figure-9.2.jpg)\n\
  \n**图 9.2：** 当失望来临时。\n\n因此，为了简单起见，浏览器以文本格式交换数据。它简单且相当轻量。\n\n**提示：下一个可能的问题是：** 如何显示服务器上的视频或图像？虽然这个问题有几个答案，但最好的答案之一是服务器上存储的图像/视频的相对路径。在这种情况下，我们将图像和视频等媒体文件存储在服务器上的一个文件夹中。在服务器响应中，浏览器只接收该图像/视频的相对路径。通过在\
  \ `<img>` 或 `<video>` 标签中使用该路径，它将显示相应的图像/视频，而无需用户浪费大量数据来下载它。\n\n在*第 5 章：对象*中，我们了解到对象是模拟现实世界数据的绝佳方式。这意味着如果你想发送关于特定对象（如汽车、人或任何东西）的多条信息，你可以将所有信息存储在一个简单的对象中。\n\
  \n结合文本和对象两者的优点，JavaScript 引入了一种称为 **JavaScript 对象表示法**（**JSON**）的新格式。\n\n根据 **Mozilla\
  \ 开发者网络**（**MDN**）文档的官方定义，**JavaScript 对象表示法**（**JSON**）是一种基于 JavaScript 对象语法的标准文本格式，用于表示结构化数据。\n\
  \n在最简单的形式中，JSON 是一个类似于 JavaScript 对象的字符串。它也可以独立于 JavaScript 使用。事实上，许多编程环境都能够读取和生成\
  \ JSON。你还可以将 JSON 存储为文件。JSON 文件必须以 `.json` 扩展名保存。\n\n## JSON 的结构\n\n如前所述，JSON 对象与\
  \ JavaScript 对象有着显著的相似之处。闲话少说，让我们快速看一下 JSON 对象的结构。\n\n**代码 9.1：** JSON 对象的语法\n\n\
  ```\n{\n    \"firstName\":\"John\",\n    \"lastName\":\"Doe\",\n    \"address\"\
  : {\n        \"building\":\"River View Apartments\",\n        \"apartment\":12,\n\
  \        \"road\":\"York Road\",\n        \"city\":\"London\",\n        \"country\"\
  :\"England\"\n    },\n    \"cars\": [\"BMW\",\"Audi\",\"Jaguar\"]\n}\n```\n\n正如你在*代码示例\
  \ 9.1*中所见，JSON 对象与 JavaScript 对象字面量非常相似。就像 JavaScript 对象字面量一样，JSON 对象中的数据以键值对的形式存在，并用逗号分隔。同样，对象（如*代码示例\
  \ 9.1*中的 address）和数组（如*代码示例 9.1*中的 cars）分别使用花括号和方括号表示。此外，根据 JavaScript 标准，数据类型为数字的\
  \ JSON 值不应加引号。\n\n然而，JSON 对象和 JavaScript 对象字面量之间存在一些显著差异：\n\n*   在 JSON 对象中，*键值对*中的每个键都需要用双引号括起来。\n\
  *   JSON 值不能是函数、日期或 undefined。\n*   你*不能*对 JSON 键或值使用单引号。\n\nJSON 以两种格式工作：\n\n*\
  \   **字符串**：当数据需要传输时。\n*   **对象**：当你需要访问数据时。\n\nJavaScript 提供了一个全局 JSON 对象，帮助将 JSON\
  \ 从一种形式转换为另一种形式。我们将在下一节中了解这两种格式。\n\n## 使用 JSON\n\n\n\n\n现在我们已经对 JSON 的结构有了相当的了解，并且知道\
  \ JSON 存在两种不同的形式，接下来让我们强调一下处理 JSON 的流程。\n\n我们知道，浏览器和服务器之间进行数据交换的最佳格式是文本格式。然而，一旦我们在浏览器中以文本格式从服务器接收到数据，就需要将文本格式转换为对象格式以便访问数据。JavaScript\
  \ 的全局 `JSON` 对象提供了两种方法，可以轻松地在两种格式之间进行转换。\n\n# `JSON.stringify()`\n\n为了将 JavaScript\
  \ 对象转换为文本格式以便通过网络发送，JavaScript 提供了一种名为 `JSON.stringify()` 的 `JSON` 方法。我们只需在 `JSON.stringify()`\
  \ 方法的括号内提供该对象即可。让我们通过一个例子来理解这一点。\n\n```\nlet obj = {\n    firstName: \"John\",\n\
  \    lastName: \"Doe\",\n    address: {\n        building: \"River View Apartments\"\
  ,\n        apartment: 12,\n        road: \"York Road\",\n        city: \"London\"\
  ,\n        country: \"England\"\n    },\n    cars: [\"BMW\", \"Audi\", \"Jaguar\"\
  ]\n}\n\nJSON.stringify(obj);\n```\n\n**代码 9.2：** `JSON.stringify()` 方法\n\n正如你在 *代码示例\
  \ 9.2* 中所见，我们有一个 JavaScript 对象 `person`。要将其转换为 JSON 字符串，我们需要将对象 `person` 传递给 `JSON.stringify()`\
  \ 方法的括号内。当你执行 *代码示例 9.2* 时，结果将如下所示：\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 代码示例\
  \ 9.2 的输出\n\n正如你在上面的截图中所见，*代码示例 9.2* 中第 14 行的输出是一个 JSON 字符串。如果你仔细观察 *图 9.3*，可以看到\
  \ *代码示例 9.2* 中的对象 `person` 已在 *图 9.3* 中被转换为 JSON 格式。对象 `person` 的键现在按照 JSON 格式被双引号括起来。实际上，输出本身也被打印在双引号内。如果你在此输出前使用\
  \ JavaScript 运算符 `typeof`，你将得到输出为字符串，如下面的截图所示：\n\n![](img/Figure-9.4.jpg)\n\n**图\
  \ 9.4：** stringify 方法输出的数据类型\n\n# `JSON.parse()`\n\n在上一节中，我们学习了如何将 JavaScript 对象转换为\
  \ JSON 字符串。现在，我们还需要了解如何将从服务器接收到的 JSON 字符串转换为可以在 Web 应用程序中使用的 JavaScript 对象。为了将 JSON\
  \ 字符串转换为 JavaScript 对象，JavaScript 为我们提供了 `JSON.parse()` 方法。与 `JSON.stringify()`\
  \ 方法类似，我们需要将 JSON 字符串传递给 `JSON.parse()` 方法的括号内。让我们看一个例子。\n\n![](img/Figure-9.5.jpg)\n\
  \n**图 9.5：** `JSON.parse()` 示例\n\n如上图所示，我们使用了一个 JSON 文本（即我们在 *图 9.3* 中作为输出接收到的文本），并将其提供给\
  \ `JSON.parse()` 方法。如你所见，`JSON.parse()` 方法的输出是一个 JavaScript 对象，这通过缺少双引号来表示。\n\n\
  # 数据交换\n\n在前面的章节中，我们看到了将 JSON 从一种形式转换为另一种形式的过程。此外，我们还了解了何时将 JSON 用作字符串，以及何时将其用作\
  \ JavaScript 对象。牢记这些要点，让我们借助图表来看一下客户端机器上的浏览器与服务器之间进行数据交换的过程：\n\n![](img/Figure-9.6.jpg)\n\
  \n**图 9.6：** `JSON.parse()` 示例\n\n如上图所示，当客户端浏览器通过互联网发送数据时，它使用 `JSON.stringify()`\
  \ 将 JavaScript 对象转换为 JSON 文本。同样，当客户端浏览器以 JSON 文本形式从服务器接收数据时，它使用 `JSON.parse()` 将文本转换为\
  \ JavaScript 对象。\n\n# AJAX\n\n现在我们已经了解了用于服务器之间数据交换的格式，最后让我们学习如何与服务器进行交互。\n\nAJAX\
  \ 是连接服务器的 JavaScript 过程。它代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML）。\n\
  \nAJAX 是 Web 开发人员的梦想。它不仅能够从服务器发送和接收数据，还能在不重新加载页面的情况下更新网页。\n\n然而，在理解 AJAX 并学习 AJAX\
  \ 与服务器交互的简单四步流程之前，我们需要快速停靠一下，首先了解服务器和客户端之间数据交换所涉及的一种协议。\n\n# HTTP\n\n我们在 Web 开发中用于数据交换的协议或规则系统是**超文本传输协议**（**HTTP**）。HTTP\
  \ 以简单的请求-响应方式工作，我们在本章前面已经看到过。其逻辑如下：\n\n![](img/Figure-9.7.jpg)\n\n**图 9.7：** HTTP\
  \ 的逻辑\n\n如上图所示，客户端浏览器向服务器发送请求。客户端浏览器可以向服务器请求多种内容。这包括但不限于：用于在浏览器上显示的 HTML 文件、图像和视频等媒体、字体，以及对象和数组等数据（正如我们在\
  \ JSON 中看到的）。实际上，有时客户端浏览器甚至可以发送请求来更新服务器中存储的数据。服务器接收此请求，解析它，并向客户端发送响应。作为响应，服务器始终会发送关于请求状态的信息。此外，如果浏览器请求了数据，服务器还会在响应中发送数据。\n\
  \n让我们首先探讨各种请求方法。\n\n# HTTP 方法\n\n有几种 HTTP 方法——`GET`、`POST`、`PUT`、`PATCH`、`DELETE`、`HEAD`\
  \ 和 `OPTIONS`。每种方法都满足不同的需求。然而，最常用的方法是 `GET` 和 `POST`。\n\n让我们逐一介绍每种 HTTP 方法：\n\n\
  ## `GET`\n\n`GET` 方法用于从指定资源请求数据。例如，从服务器请求 HTML 文件或员工列表。\n\n但是，在使用 `GET` 方法时，我们需要注意以下几点：\n\
  \n*   `GET` 方法应仅用于请求数据。它*不应*用于修改数据。\n\n*   如果我们需要在 `GET` 请求中发送数据，数据将包含在请求的 URL 中。例如，发送用户的银行账户详细信息以获取用户的交易记录。因此，建议在需要在请求中发送敏感数据时不要使用\
  \ `GET` 请求。\n\n*   `GET` 请求可以被缓存和收藏。它们会保留在浏览器历史记录中。\n\n*   `GET` 请求对数据长度有限制。\n\n\
  ## `POST`\n\n`POST` 方法专门用于向服务器发送数据。其主要目的是在服务器上创建数据。关于 `POST` 请求的其他几点如下：\n\n*   在\
  \ `POST` 请求中发送的数据存储在 `HTTP` 请求的请求体中。\n\n*   `POST` 请求既不会被缓存也不会被收藏。它们不会保留在浏览器历史记录中。\n\
  \n*   `POST` 请求对数据长度没有任何限制。\n\n*   发送 `POST` 请求将在服务器上创建一个新资源。\n\n## `PUT`\n\n\n\n\
  \n\n`PUT` 方法也用于向服务器发送数据。与 `POST` 类似，其主要目的是在服务器上创建和更新数据。`POST` 和 `PUT` 之间存在以下两个主要区别：\n\
  \n*   **精确 URI**：PUT 请求需要知道资源的精确 URI，而 `POST` 并不强制要求完整的 URI。\n\n    例如，假设服务器上有一个员工列表的\
  \ URI，它是 `/employees`。这意味着，如果你向 URI `/employees` 发送一个包含新员工数据的 `POST` 请求，它可以在服务器上创建一个新的\
  \ `employee` 并为其分配一个唯一 ID。为了便于理解这个例子，假设该员工被分配了 `ID 423`。或者，我们也可以通过向 `/employees/423`\
  \ 发送 `POST` 请求来在服务器上创建新用户。如果没有提供 ID，`POST` 请求会自动为新数据生成一个新 ID。这表明 `POST` 请求不一定需要完整的\
  \ URI 才能工作。\n\n    然而，如果你向 `/employees` 发送一个包含新员工数据的 PUT 请求，它会失败。如前所述，`PUT` 请求需要知道精确的\
  \ URI 才能工作。因此，如果你向 `/employees/423` 发送 PUT 请求，如果 ID 423 不存在，它会创建一个新员工；如果存在，则会替换\
  \ ID 423 处的员工。\n\n    |  | `POST` | `PUT` |\n    | --- | --- | --- |\n    | `/employees/`\
  \ | ![](img/Image54833.jpg) | ![](img/Image54841.jpg) |\n    | `/employees/123/`\
  \ | ![](img/Image54849.jpg) | ![](img/Image54849.jpg) |\n\n    **表 9.1：** POST 与\
  \ PUT 对比\n\n*   **幂等性**：可能是在使用 PUT 而非 `POST` 时最重要的原因之一，就是幂等性。这意味着，如果你意外或故意向服务器发送\
  \ N 次包含相同数据的 `POST` 请求，它会在服务器上创建 N 个不同的资源。然而，如果你意外或故意向服务器发送 N 次包含相同数据的 `PUT` 请求，它等效于一次请求修改。\n\
  \n# PATCH\n\n`PATCH` 请求适用于希望对服务器上存储的资源进行部分更新的场景。例如，假设服务器上有一个如下所示的资源：\n\n```\n{\n\
  \    firstName: 'John',\n    lastName: 'Doe',\n    age: 24,\n    location: 'Detroit'\n\
  }\n```\n\n**代码 9.3：** 服务器上的一个资源\n\n假设我们希望更改 *代码示例 9.3* 中所示资源的位置。如果我们发送一个包含数据 `{location:\
  \ 'New York'}` 的 `PUT` 请求，它会将整个对象替换为 location 为 New York。这是因为对于 `PUT` 请求，我们需要完整的资源。如果我们只想发送资源的一部分进行修改，则需要使用\
  \ `PATCH` 请求。\n\n因此，当我们发送一个包含数据 `{location: 'New York'}` 的 `PATCH` 请求时，它会将资源更新为如下所示：\n\
  \n```\n{\n    firstName: 'John',\n    lastName: 'Doe',\n    age: 24,\n    location:\
  \ 'New York'\n}\n```\n\n**代码 9.4：** PATCH 请求后的资源\n\n为了简化对 `POST`、`PUT` 和 `PATCH`\
  \ 的理解，请参考下图：\n\n![](img/Figure-9.8.jpg)\n\n**图 9.8：** POST 与 PUT 与 PATCH 对比\n\n\
  # DELETE\n\n`DELETE` 方法用于删除指定的资源。\n\n# HEAD\n\n`HEAD` 方法与 `GET` 方法类似，但它在响应中不返回主体。这意味着，如果你向\
  \ URI `/employees` 发送一个 `GET` 请求，你会在响应中获得员工列表。然而，如果你向同一个 URI 发送 `HEAD` 请求，它不会返回员工列表。`HEAD`\
  \ 方法对于检查 `GET` 请求将返回什么内容非常有用。它通常在实际发出 `GET` 请求之前执行。\n\n# OPTIONS\n\n`OPTIONS` 请求用于请求关于目标资源通信选项的信息。例如，如果我们想知道某个特定\
  \ URI 允许哪些请求方法，我们可以使用 `OPTIONS` 来获取该信息。\n\n# HTTP 状态消息\n\n在 HTTP 方法部分的介绍中，我们了解到服务器总是返回请求的状态。正如我们将在下一个主题——AJAX\
  \ 过程中看到的，状态响应有助于理解我们的请求在服务器端发生了什么。\n\n例如，如果你在 Google Chrome 浏览器中打开 **https://www.google.com**，并打开\
  \ Chrome 开发者工具的 `Network` 选项卡，你会看到第一个请求标题为 `www.google.com`。如下面的截图所示，如果你查看 `Headers`\
  \ 选项卡，你会看到一个名为 **Status Code** 的键。\n\n![](img/Figure-9.9.jpg)\n\n**图 9.9：** Chrome\
  \ 开发者工具 Network 选项卡中显示的状态码\n\n状态消息由两部分组成——状态码和状态消息。状态码的第一位数字定义了状态消息的类别。你可以在此处查看完整的状态消息列表——**[`developer.mozilla.org/en-US/docs/Web/HTTP/Status`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status)**。\n\
  \n为了便于理解，我们将查看每个类别中几个在 Web 开发中常用的重要状态码：\n\n# 1xx：信息\n\n以 1 开头的状态码本质上是信息性的。例如，状态码\
  \ 100 的状态消息为 Continue。这意味着服务器已收到请求头，并通知客户端继续发送请求主体。\n\n# 2xx：成功\n\n以 2 开头的状态码表示成功。在\
  \ *图 9.9* 中，我们看到了状态码 200，它表示请求已成功。以下列出了一些以 2 开头的常用状态码：\n\n| **状态码** | **状态消息** |\
  \ **描述** |\n| --- | --- | --- |\n| 200 | OK | 成功请求的标准响应。 |\n| 201 | Created | 已创建新资源。\
  \ |\n\n**表 9.2：** 以 2 开头的状态码\n\n# 3xx：重定向\n\n以 3 开头的状态码表示重定向。这意味着你访问的 URL 已被移动，或者你已被重定向到另一个位置。以下列出了一些以\
  \ 3 开头的常用状态码：\n\n| **状态码** | **状态消息** | **描述** |\n| --- | --- | --- |\n| 301 | Moved\
  \ Permanently | 请求的页面或资源已永久移动到新的 URL。 |\n| 302 | Found | 请求的页面或资源已临时移动到新的 URL。 |\n\
  \n**表 9.3：** 以 3 开头的状态码\n\n# 4xx：客户端错误\n\n最常见的状态码之一是以 4 开头的。它表示来自客户端浏览器或客户端机器的错误。以下列出了一些常见的\
  \ 4xx 状态码：\n\n| **状态码** | **状态消息** | **描述** |\n| --- | --- | --- |\n| 400 | Bad\
  \ Request | 由于语法错误，请求无法被处理。 |\n| 401 | Unauthorized | 请求合法，但服务器拒绝响应。这通常发生在尚未提供身份验证时。\
  \ |\n| 403 | Forbidden | 服务器不允许此请求。 |\n| 404 | Not Found | 找不到请求的页面或资源。 |\n\n**表\
  \ 9.4：** 以 4 开头的状态码\n\n# 5xx：服务器错误\n\n最后，以 5 开头的状态码表示服务器上发生的错误。以下列出了一些常见的 5xx 状态码：\n\
  \n| **状态码** | **状态消息** | **描述** |\n\n\n\n\n\n| 500 | 内部服务器错误 | 通用的服务器错误信息。 |\n|\
  \ 501 | 未实现 | 服务器无法识别请求或缺乏完成请求的能力。 |\n| 502 | 错误网关 | 服务器充当代理/网关时收到了无效响应。 |\n| 503\
  \ | 服务不可用 | 服务器当前不可用。 |\n\n**表 9.5：** 以 5 开头的状态码\n\n我们将在下一个主题——AJAX 的流程中用到这些状态码。\n\
  \n# AJAX 的流程\n\n终于，在掌握了实现 AJAX 所需的几乎所有前置知识后，让我们开始学习 AJAX 的流程。\n\n使用 AJAX 有四个简单的步骤，如下所示：\n\
  \n![](img/Figure-9.10.jpg)\n\n**图 9.10：** AJAX 的流程\n\n如上图所示，AJAX 的流程包含以下四个基本步骤：\n\
  \n1.  **创建请求**：顾名思义，AJAX 流程的第一步是创建一个需要发送到服务器的请求。整个 AJAX 过程的基础是 `XMLHttpRequest`\
  \ 对象。\n\n    **注意：** 分解来看，XML 代表可扩展标记语言（Extensible Markup Language）。它是一种类似于 HTML\
  \ 的标记语言，使用标签来定义文档中的元素。\n\n    HTTP 代表超文本传输协议（Hypertext Transfer Protocol），即我们在上一节中学习的主题。\n\
  \n    `XMLHttpRequest` 对象用于在后台与 Web 服务器交换数据。在撰写本文时，所有现代浏览器（包括 Google Chrome、Mozilla\
  \ Firefox、Microsoft Internet Explorer 7+、Microsoft Edge、Safari、Opera）都支持 `XMLHttpRequest`\
  \ 对象。\n\n    创建 `XMLHttpRequest` 的语法如下：\n\n    ```\n    let request = new XMLHttpRequest();\n\
  \    ```\n\n    **代码 9.5：** 创建请求\n\n    如 *代码示例 9.5* 所示，要创建 `XMLHttpRequest` 对象，我们需要使用\
  \ JavaScript 关键字 `new`。由于我们需要频繁使用这个请求，因此将其存储在变量中是明智的做法。\n\n2.  **打开请求**：创建请求后，下一步是打开该请求。这是\
  \ AJAX 流程中最关键的一步。在这一步中，我们需要提供我们想要连接的服务器 URL，以便与我们的网页/Web 应用进行交互。此外，我们还需要指定请求的方法或类型、该请求是否为异步，以及是否需要用户名和密码。\n\
  \n    打开请求的一般详细语法如下：\n\n    `open(`*`method`*`,` *`url`*`, async,` *`username`*`,`\
  \ *`password`*`)`\n\n    **代码 9.6：** 打开请求的语法\n\n    如前面的 *代码示例 9.6* 所示，`open` 方法接受五个参数。不过，后三个参数是可选的。让我们逐一理解每个参数。\n\
  \n    **方法**：第一个参数是方法参数。方法参数帮助服务器理解客户端浏览器发出的请求类型。在“HTTP 方法”一节中，我们了解了 HTTP 请求的几种方法。我们可以将其中任何一种方法作为\
  \ `open` 方法的第一个参数。\n\n    **URL**：`open` 方法的第二个参数是服务器的 URL。这个 URL 可以是一个 API 端点，也可以是服务器上的某个位置。我们将在下一章更详细地了解\
  \ API。或者，它也可以是服务器上某个文件的位置。通常，这些文件可以在发送响应之前对服务器执行操作。\n\n    **异步**：第三个参数是一个可选参数，用于设置请求是否为异步。它是一个布尔值——因此你可以将\
  \ `true` 或 `false` 作为第三个参数传递给 `open` 方法。正如我们已经从上一章了解到的异步的含义，将第三个参数设置为 `true` 不会让\
  \ JavaScript 停止执行并等待该请求的响应。相反，JavaScript 会继续执行，用户交互也会继续，直到服务器响应到达。然而，如果第三个参数设置为\
  \ `false`，JavaScript 将停止所有执行，直到收到该请求的响应。其默认值为 `true`。\n\n    **用户名和密码**：第四个和第五个参数也是可选的。第四个和第五个参数分别用于用户名和密码。它们可用于身份验证目的。其默认值为\
  \ `null`。\n\n    继续我们的 *代码示例 9.6*，让我们尝试使用一个实际的 API 请求来调用 `open` 方法：\n\n    ```\n\
  \    request.open('GET', 'https://www.themealdb.com/api/json/v1/1/search.php?s=Arrabiata',\
  \ true);\n    ```\n\n    **代码 9.7：** 打开请求的示例\n\n    在前面的 *代码示例 9.7* 中，我们使用了在 *代码示例\
  \ 9.5* 中创建的变量 `request`。我们在变量 `request` 上调用 `open` 方法，并向其传递三个参数。第一个参数应该是 HTTP 请求的类型。因此，我们将\
  \ `GET` 方法作为第一个参数。对于第二个参数（应该是 URL），我们添加了一个名为 The Meal DB 的流行公共 API 平台的 API。最后，我们将可选的第三个参数（用于异步行为）设置为\
  \ `true`。我们不需要可选的第四个和第五个参数。\n\n3.  **发送请求**：AJAX 流程的第三步是发送我们在前两步中创建的请求。发送请求的语法是：对于\
  \ `GET` 请求，使用 `request.send()`；对于 `POST` 请求，使用 `request.send(str)`。继续使用 *代码示例 9.5*\
  \ 和 *9.7* 中的示例，我们现在将发送以下请求：\n\n    ```\n    request.send();\n    ```\n\n    **代码\
  \ 9.8：** 发送请求\n\n    如 *代码示例 9.8* 所示，由于我们之前创建的 `XMLHttpRequest` 是一个 `GET` 方法，因此我们将调用不带任何参数的\
  \ `send` 方法。\n\n4.  **等待响应**：通过前三个步骤，我们已经完成了创建、打开和向服务器发送请求。现在，服务器解析请求、准备响应，并将响应返回给客户端。为了理解响应以及如何接收它，我们首先需要理解一个名为\
  \ `readyState` 的概念。\n\n    `readyState` 属性属于 `XMLHttpRequest` 对象。它保存了 `XMLHttpRequest`\
  \ 客户端的状态。`readyState` 属性有五个值：\n\n    | **值** | **状态** | **描述** |\n    | 0 | UNSENT（未发送）\
  \ | 客户端已创建。当我们完成 AJAX 流程的第一步时，`readyState` 的值变为 0。 |\n    | 1 | OPENED（已打开） | `open()`\
  \ 方法已被调用。当我们完成 AJAX 流程的第二步时，`readyState` 的值变为 1。 |\n    | 2 | HEADERS_RECEIVED（已收到响应头）\
  \ | `send()` 方法已被调用。当我们完成 AJAX 流程的第三步时，`readyState` 的值变为 2。此时，响应头已收到。 |\n    | 3\
  \ | LOADING（加载中） | 正在接收响应体。 |\n    | 4 | DONE（完成） | 操作已完成。这意味着数据传输要么成功，要么失败。 |\n\
  \n    **表 9.6：** `readyState` 的值\n\n    如 *表 9.6* 所示，`readyState` 属性的值会随着 AJAX 流程的每个动作或每个步骤而变化。此外，从\
  \ *表 9.6* 中我们可以看到，当 `readyState` 的值为 4 时，表示与服务器的交互过程已完成。\n\n\n\n\n\n`XMLHttpRequest`\
  \ 对象包含一个名为 `onreadystatechange` 的属性。每当 `readyState` 属性的值发生变化时，`onreadystatechange`\
  \ 属性内部的事件处理程序就会被调用。让我们通过一个示例来理解 `onreadystatechange` 属性：\n\n```\nrequest.onreadystatechange\
  \ = function() {\n    if(this.readyState === 4 && this.status === 200) {\n     \
  \   console.log(this.responseText);\n    }\n}\n```\n\n**代码 9.9：** onreadystatechange\
  \ 属性示例\n\n在 *代码示例 9.9* 中，我们继续使用了在 *代码示例 9.5*、*9.7* 和 *9.8* 中创建并使用的变量 request。如 *代码示例\
  \ 9.9* 所示，我们附加了一个函数，用于监听变量 request 的 `readyState` 属性发生变化的事件。在函数内部，我们检查条件：`readyState`\
  \ 属性是否为 4，以及响应的状态是否为 200。正如我们在 *表 9.2* 和 *9.6* 中所看到的，当请求和响应的整个操作完成时，`readyState`\
  \ 属性为 4。类似地，当请求成功时，请求的状态变为 200。总结来说，这意味着我们对服务器的请求已完成且成功。当这两个条件满足时，我们执行语句来记录 `responseText`。`responseText`\
  \ 属性返回从服务器接收到的文本。\n\n将我们的完整代码组合起来，如下所示：\n\n```\nlet request = new XMLHttpRequest();\n\
  request.open('GET', 'https://www.themealdb.com/api/json/v1/1/search.php?s=Arrabiata',\
  \ true);\nrequest.send();\nrequest.onreadystatechange = function() {\n    if(this.readyState\
  \ === 4 && this.status === 200) {\n        console.log(this.responseText);\n   \
  \ }\n}\n```\n\n**代码 9.10：** AJAX 的完整过程\n\n从 *代码示例 9.10* 可以看出，创建并向服务器发送请求相当简单。此外，我们拥有无限的机会来处理服务器响应。除了\
  \ `console.log` 语句，我们还可以包含一个回调函数来处理成功的响应。或者，如果请求失败并且我们得到以 4 或 5 开头的状态码，我们可以包含另一个条件来处理失败的请求。事实上，我们还可以在请求发送之前或请求加载期间执行某些操作时，执行特定的代码。\n\
  \n# HTTP 标头\n\n在上一节中，我们成功完成了一次与公共 API 服务器的交互。让我们快速查看一下 Chrome 开发者工具中的“网络”面板，以观察请求的实际运行情况。\n\
  \n为此，让我们创建一个小项目。在机器上的合适位置，创建一个文件夹并将其命名为 *“Nom Nom”*。这将是我们简单应用程序的名称。你可以自由选择任何你喜欢的项目名称。在此文件夹内，创建一个名为\
  \ `index.html` 的 HTML 文件。以下是我们简单 HTML 文件的内容：\n\n```\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>Nom Nom</title>\n</head>\n\
  <body>\n    <div>\n        <h1>欢迎来到 Nom Nom</h1>\n        <h5>学习美味食谱的最佳去处！</h5>\n\
  \    </div>\n    <script src=\"scripts/index.js\"></script>\n</body>\n</html>\n\
  ```\n\n**代码 9.11：** index.html 文件\n\n现在，我们将在与 `index.html` 文件相同的层级创建一个文件夹，并将其命名为\
  \ scripts。你可以按如下方式查看：\n\n![](img/Figure-9.11.jpg)\n\n**图 9.11：** Nom Nom 的文件夹结构\n\
  \n在 scripts 文件夹内，我们将创建一个 JavaScript 文件并将其命名为 `index.js`。在 `index.js` 中，我们将粘贴在 *代码示例\
  \ 9.10* 中看到的代码。\n\n当你点击 `Nom Nom` 文件夹中的 `index.html` 文件时，它将在你机器的默认浏览器中打开我们的网页。由于我经常使用\
  \ Google Chrome 进行开发，因此我机器上的默认浏览器是 Google Chrome。点击 `index.html` 后，我们的网页在浏览器中将如下所示：\n\
  \n![](img/Figure-9.12.jpg)\n\n**图 9.12：** Nom Nom 的网页\n\n正如我们在 *第 2 章：开发者工具* 中学到的，我们可以通过在浏览器中右键单击网页的任何部分并点击\
  \ `检查` 来打开 Chrome 开发者工具。然后，我们可以通过点击开发者工具顶部的 `网络` 选项卡导航到 `网络` 面板。完成此操作后，你将看到类似以下内容：\n\
  \n![](img/Figure-9.13.jpg)\n\n**图 9.13：** Chrome 开发者工具网络面板视图\n\n如上面的截图所示，当你第一次打开\
  \ `网络` 面板时，它是空白的。实际上，它会提示我们执行一个请求或点击刷新。那么，让我们继续，通过按下机器上的快捷键 *F5*，或点击浏览器地址栏旁边的 ![](img/Image55092.jpg)\
  \ 按钮来刷新页面。\n\n当你刷新时，你将在 `网络` 面板中看到三个请求，如下面的截图所示。如果将鼠标悬停在 `名称` 列中的每个项目上，你会注意到这三个项目分别是\
  \ index.html、index.js 以及最后的服务器 API 请求。\n\n![](img/Figure-9.14.jpg)\n\n**图 9.14：**\
  \ 网络面板中显示的请求\n\n如果我们点击 *图 9.14* 中显示的最后一个请求，它将在请求的 `名称` 列旁边显示一个侧边栏。根据你使用 `网络` 面板的历史记录，侧边栏可能会在下面截图所示的任何选项卡上打开。然而，如果你第一次打开它，很可能会在\
  \ `预览` 选项卡上打开：\n\n![](img/Figure-9.15.jpg)\n\n**图 9.15：** 网络面板侧边栏的预览选项卡\n\n如上图所示，`预览`\
  \ 选项卡显示了服务器对我们的请求所发送的响应的预览。如你所见，对于 API GET 请求 **[`www.themealdb.com/api/json/v1/1/search.php?s=Arrabiata`](https://www.themealdb.com/api/json/v1/1/search.php?s=Arrabiata)**，服务器响应了一个与菜肴“辣味\
  \ Arrabiata 通心粉”相关的对象。然而，正如我们在本章前面所看到的，服务器在互联网上发送的响应并不是一个对象。实际上，它发送的是一个 JSON 字符串作为响应。如果你转到\
  \ `网络` 面板内侧边栏的 `响应` 选项卡，你将看到服务器发送的实际响应。Chrome 开发者工具基本上会检测并将 JSON 字符串转换为对象，以便在 `预览`\
  \ 选项卡中显示，从而使开发者更容易理解响应。\n\n在本节中，我们将重点放在 `网络` 面板侧边栏的 `标头` 选项卡上。因此，如果你转到 `网络` 面板内侧边栏的\
  \ `标头` 选项卡，你将看到类似以下内容：\n\n![](img/Figure-9.16.jpg)\n\n**图 9.16：** 网络面板侧边栏的标头选项卡\n\
  \n如果你向下滚动 `标头` 选项卡，你将看到四个不同的部分。它们分别名为“常规”、“响应标头”、“请求标头”和“查询字符串参数”。那么，标头到底是什么呢？\n\
  \n\n\n\n\nHTTP 头部允许客户端和服务器在请求或响应中发送附加信息。HTTP 头部由一个不区分大小写的名称及其值组成。HTTP 头部可以分为以下四类：\n\
  \n*   **通用头部**：这些头部适用于客户端发送的请求和服务器发送的响应，但与请求或响应的主体内容无关。最常见的通用头部包括 `Date`（包含消息生成时的日期和时间）、`Cache-Control`（包含对请求和响应进行缓存的指令）以及\
  \ `Connection`（指定当前事务完成后连接是否应保持打开）等。\n\n*   **请求头部**：这些头部适用于 HTTP 请求，但与请求的内容无关。它们发送关于请求的附加信息，以便服务器更容易发送准确的响应。像\
  \ `Accept`、`Accept-*` 或 `If-*`（其中 `*` 表示可被其他关键字替换）这样的请求头部可用于为请求添加条件。例如，`Accept`\
  \ 告知服务器它可以返回的数据类型。类似地，`Accept-Language` 告知服务器在发送响应时可接受的语言。除了条件请求外，还有像 `User-Agent`（告知服务器操作系统、软件供应商、软件版本等信息）、`Cache-Control`（告知服务器响应的缓存策略）、`Referer`（告知调用当前网页的上一个网页）等头部。\n\
  \n*   **响应头部**：响应头部用于 HTTP 响应，与消息的内容无关。它们有助于提供关于响应的更多细节。\n\n    一些响应头部包括 `Age`（传达自客户端请求服务器以来的时间）、`Retry-After`（可用于指示客户端服务预计不可用的时长）、`Set-Cookie`（包含用于保留此特定\
  \ URL 的信息的名称-值对）等。\n\n*   **实体头部**：实体头部包含关于资源主体的信息。常用的实体头部包括 `Content-Length`（资源的字节大小）、`Content-Type`（资源的媒体类型，也称为\
  \ MIME 类型）、`Content-Encoding`（资源的压缩算法）、`Content-Language`（面向受众的人类语言）等。实体头部在 `Network`\
  \ 面板的 `Headers` 选项卡中并不单独形成一列，而是分布在 `Request` 和 `Response` 头部中。\n\n在向 MealDB API\
  \ 服务器发送请求时，你在 `Headers` 选项卡中看到的查询字符串参数部分，是附加在 `GET` 请求末尾的字符串。正如我们在上一节中读到的，`GET`\
  \ 请求会将需要发送给服务器的附加信息附加到请求的 URL 上（因此它不安全！）。每当需要将一组信息附加到请求时，可以通过在请求 URL 末尾添加问号（?）后附加字符串来实现。\n\
  \n![](img/Figure-9.17.jpg)\n\n**图 9.17：** API 的请求 URL 显示了查询字符串参数\n\n如上图所示，本应结束于\
  \ `search.php` 的请求 URL 包含了一个额外的字符串 `?s=Arrabiata`。字符串 `s=Arrabiata` 帮助服务器过滤并发送所有标题中包含\
  \ *Arrabiata* 的食谱。每当我们需要向 URL 添加这样的字符串时，首先需要在 URL 末尾附加一个问号（?）。这个问号表示我们正在为 `GET`\
  \ 请求向服务器发送附加数据。然后，在问号之后以 key=value 格式添加实际的字符串。如果有多个字符串，我们需要使用与号（&）来分隔它们。这种对 URL\
  \ 的附加称为*查询字符串*。\n\n为简洁起见，本书未打印完整的请求头部列表。如果你想查看 HTTP 头部的完整列表，可以查阅 MDN 官方文档，链接如下 –\
  \ **[`developer.mozilla.org/zh-CN/docs/Web/HTTP/Headers`](https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Headers)**。\n\
  \n如果你查看 *图 9.17* 之前分享的 HTTP 头部简要列表，或上述链接中显示的完整列表，你会发现可能需要发送头部到请求中的多种场景。例如，如果你想告知服务器只以特定格式发送响应，你需要向服务器发送所需的扩展名。正如我们在上述列表中看到的，在向服务器发送请求时，你需要在\
  \ `Accept` 头部中指定所需的格式。对于此类情况，AJAX 提供了一个名为 `setRequestHeader()` 的方法。\n\n# `setRequestHeader()`\n\
  \n`XMLHttpRequest` 方法 `setRequestHeader()` 用于设置 HTTP 请求头部的值。此方法应在打开请求之后、发送请求之前调用，如下图所示：\n\
  \n![](img/Figure-9.18.jpg)\n\n**图 9.18：** 调用 `setRequestHeader` 的确切时机\n\n如果对同一个头部多次调用此方法，这些值会合并为一个请求头部。在\
  \ *图 9.18* 中，我们特意将请求头部设置为仅接受格式为 `'application/json'` 的响应。如果未设置 `Accept` 头部，则会发送默认值\
  \ `'*/*'`。\n\n### 结论\n\n在本章中，我们探索并学习了如何使用 API 与服务器交互。我们从理解 JSON 开始本章——JSON 是互联网上用于交换数据的格式。在下一节\
  \ AJAX 及 AJAX 过程中，我们应用了 JSON 及其方法的知识。在该节中，我们使用 MealDB 平台的公共 API 尝试了一个实时示例。但在此之前，我们熟悉了不同的\
  \ HTTP 方法和状态码。最后，在本章末尾，我们研究了各种 HTTP 头部。本章所学的一切，加上前八章的知识，将帮助我们在下一章中创建一个实时应用程序。\n\n\
  在下一章中，我们将使用 MealDB 平台的 API 创建一个用于展示食谱的 Web 应用程序。在这里，我们不仅会编写创建 Web 应用程序的代码，还会审视创建应用程序的多个非技术方面，例如如何确定创意、关注目标用户、如何计算页面数量，以及应用程序创建后需要做什么。\n\
  \n### 要点回顾\n\n*   为了更快的交换和简单性，数据以文本格式在互联网上的不同实体之间传输。**JavaScript 对象表示法**（**JSON**）是表示\
  \ JavaScript 对象语法的标准文本格式，用于在互联网上交换数据。\n\n*   JSON 和 JavaScript 对象字面量相似但不相同。与 JavaScript\
  \ 对象字面量不同，JSON 中不能使用单引号。同样，JSON 中的所有键都需要用双引号包裹，并且 JSON 值不能是函数、日期或未定义的值。\n\n\n\n\n\
  \n*   在 Web 开发中，我们使用一种名为**超文本传输协议**（**HTTP**）的协议来在客户端（浏览器）和服务器之间交换数据。根据需求，有多种 HTTP\
  \ 方法可用于与服务器交换数据。其中 `GET` 和 `POST` 请求更为常用。\n*   服务器总是会对请求发送状态响应。即使请求失败，也始终会向客户端返回一条状态消息。\n\
  *   异步 JavaScript 和 XML（AJAX）是与服务器交互的标准流程。它使用 JavaScript 对象 `XMLHttpRequest` 来创建、打开、发送和接收响应。\n\
  *   使用 AJAX 的好处在于，网页的渲染不会受到与服务器交互的影响。实际上，即使需要更改 UI 的一部分，浏览器也无需通过 AJAX 刷新页面。\n* \
  \  最后，HTTP 标头会分别向服务器和客户端提供关于请求和响应的附加信息。对于客户端而言，它们需要使用标头来帮助服务器整理出准确的结果。对于服务器而言，则会发送标头以向客户端提供更多关于响应的信息。\n\
  \n### 选择题\n\n1.  `\"{name: \"John Doe\", \"age\": 24}\"` – 这个语句是有效的 JSON 语法吗？\n\n\
  \    1.  是\n\n    2.  否\n\n2.  **`XMLHttpRequest` 属性 `readyState` 的值为 3 表示什么？**\n\
  \n    1.  请求已创建，但尚未发送。\n\n    2.  与服务器的交互操作已完成。\n\n    3.  已调用 `send()` 方法。\n\n\
  \    4.  正在接收响应体。\n\n### 答案\n\n1.  **b**\n\n2.  **d**\n\n# 第 10 章\n\n## 开发一个实时应用！\n\
  \n虽然听起来有些老套，但英国著名诗人*约翰·济慈*曾说过——*没有什么比亲身体验更真实！*\n\n尽管这句鼓舞人心的话可以应用于多个领域，但对于 Web 开发来说，它再正确不过了。死记硬背语法，或者在脑海中想象代码的输出结果，这些都相当简单。然而，只有当你坐下来开始编码时，你才能真正学会\
  \ Web 开发。\n\n基于此，本章将专门通过从头创建一个 Web 应用来获得这种体验。我们将运用在前九章中探讨过的多个概念。实际上，我们不仅会编写应用的代码，还会将软件开发生命周期的各种原则应用到我们的开发过程中。这将让你体验到产品公司中\
  \ Web 开发的实际流程。\n\n当我们从构思阶段进入测试阶段时，我们还会涉及一些在前几章中尚未涵盖的主题。完成开发后，你可以将代码推送到像 *GitHub*\
  \ 这样的代码仓库平台，向全世界展示你的成果！\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   实时应用 – Nom Nom！\n\n\
  *   构思\n\n*   奠定基础\n\n*   初始样式\n\n*   连接服务器\n\n*   用服务器响应更新主页\n\n*   更新食谱详情页面\n\n\
  *   系统测试\n\n### 目标\n\n学习完本章后，你应该能够创建属于自己的、由服务器数据驱动的实时应用！你将学会探索 Web 开发的真实世界，并向全世界展示你的项目！\n\
  \n# 实时应用 – Nom Nom！\n\n在上一章中，我们学到了很多关于与服务器交互的知识。结合这些知识以及前几章的理解，我们将创建一个关于食谱的实时应用。强烈建议你在本地机器上同步编写该应用的代码。这将帮助你更好地理解流程和代码。\n\
  \n# 软件开发生命周期\n\n全球绝大多数成功的产品公司都遵循以下模式来创建新的 Web 产品或推出新功能：\n\n![](img/Figure-10.1.jpg)\n\
  \n**图 10.1：** 软件开发生命周期\n\n以下是上述截图中所展示流程的总结：\n\n*   **构思**：每个功能/产品都始于一个想法。例如，社交媒体应用\
  \ Instagram 的初衷是创建一个用户可以分享和点赞照片的平台。\n\n*   **业务需求收集**：一旦想法产生，下一步就是理解该想法的范围。这包括了解该想法的目标用户是谁，年龄组、地域、种族等因素如何与概念契合，理想的页面数量应该是多少，以及诸如此类的许多决策。这项工作由产品经理或专门的研究团队完成。在第二步结束时，会生成一份文档，详细说明从业务需求到理想应用结构的应用的所有信息。\n\
  \n*   **设计**：业务需求文档现在会分享给**用户体验**（**UX**）团队。UX/UI 设计师团队将创建一个满足业务需求的模板。该模板随后会分享给开发团队。\n\
  \n*   **开发**：这就是我们作为开发者登场的阶段。基于 UX 团队分享的设计，开发团队的工作是创建用户能够“使用”的想法的实时版本。\n\n*   **测试**：开发完成后，功能/应用会交给测试团队进行彻底测试。如果测试团队发现任何错误或缺陷，会报告给开发团队。一旦开发人员解决了所有错误，功能/应用会再次进行测试。当产品/功能被认为无错误后，产品最终进入最后阶段。\n\
  \n*   **公开发布**：最后阶段包括用新功能更新已发布的应用，或将产品推向市场。这还涉及营销、销售和客户关系。\n\n上述生命周期因团队而异。根据涉及的财务和需求，可以添加或删除一个或多个生命周期流程。但在大多数情况下，上述结构是遵循的。\n\
  \n基于上述生命周期，我们需要在开始应用开发之前完成前三个步骤。为了节省时间，让我们创建一个向用户展示食谱列表的应用。让我们从第一步——构思开始，在下一节中进行。\n\
  \n# 构思\n\n我们简单应用的主要目的和动机是通过提供食谱来帮助用户烹饪美味的菜肴。为了用一个令人难忘的名字吸引用户，我们将应用命名为 Nom Nom（你可以随意在本地机器上为\
  \ Web 应用起任何你喜欢的名字）。\n\n为了获取我们应用的食谱，我们将使用一个名为 *MealDB* 的公共 API 平台。你可以通过在浏览器中输入以下\
  \ URL 来查看该平台：**[`www.themealdb.com/`](https://www.themealdb.com/)**。正如其网站上所述，这是一个来自世界各地的众包食谱数据库。你可以使用他们的\
  \ API 平台获取食谱，以显示在我们的网页上。要了解更多关于他们 API 的信息，你可以点击 MealDB 网页导航栏上的 API 选项卡。\n\n**注意：**\
  \ 在本章中，为了实践我们目前学到的知识，我们不会为 Web 应用添加太多功能。但是，在你按照上述步骤完成应用创建后，可以随意添加其他功能，如搜索、筛选、更多食谱等。\n\
  \n\n\n\n由于我们希望将大部分时间花在理解应用程序的开发上，因此在本节中，我们将结合业务需求收集的第二步和应用程序的设计。\n\n# 流程\n\n回到我们的应用程序，简单的流程应如下所示：\n\
  \n![](img/Figure-10.2.jpg)\n\n**图 10.2：** 应用程序的流程\n\n现在我们已经了解了流程，可以决定应用程序应包含的页面数量。根据上面的截图，我们需要在应用程序中显示以下两个页面：\n\
  \n* 第一个页面应该是着陆页或主页。在此页面上，我们将显示菜肴列表。用户可以选择任意一道菜肴来查看其食谱。\n* 第二个页面应该是食谱详情页。在第二个页面上，我们应该向用户展示他们所选菜肴的食谱。\n\
  \n# 设计\n\n正如上一节所讨论的，我们主页的简单需求是向用户展示食谱列表，并允许他们选择食谱。考虑到这一点，主页的低级设计应如下所示：\n\n![](img/Figure-10.3.jpg)\n\
  \n**图 10.3：** 主页的低级设计\n\n在上面的截图头部，我们可以添加应用程序的名称以展示我们的品牌。为了避免杂乱，我们每行只显示三个食谱。\n\n\
  对于食谱详情页，让我们从用户的角度来思考设计。我们知道这个页面将显示用户在主页上选择的食谱的详细信息。如果你是一个正在搜索食谱的用户，你希望在食谱详情页上看到什么？\n\
  \n在我们的案例中，由于我们热衷于使用 *MealDB* 服务器，我们的部分设计也依赖于数据的获取。我们将向用户展示他们所选菜肴的标题、一个用于展示食谱视频的\
  \ YouTube 视频链接、配料列表，最后是食谱的说明。\n\n考虑到这一点，食谱详情页的低级设计应如下所示：\n\n![](img/Figure-10.4.jpg)\n\
  \n**图 10.4：** 食谱详情页的低级设计\n\n如上图所示，该设计应能满足用户搜索食谱的一般需求。由于在更宽的屏幕上观看视频更可取，我们将为视频提供更大的空间。用户了解配料和食谱都非常关键。为了节省空间并使网页看起来整洁，我们将它们并排放置。\n\
  \n现在，我们已经完成了 SDLC 的前三个步骤，让我们进入本章最重要的部分——开发。\n\n# 奠定基础\n\n在上一节中，我们确定了应用程序的页面数量、流程和目的。在本节中，我们首先创建应用程序的文件夹结构，然后创建\
  \ HTML 文件。\n\n# 文件夹结构\n\n让我们从最基本的步骤开始，如下所示：\n\n1. 在本地机器上的合适位置创建一个文件夹，并将其命名为 *Nom\
  \ Nom – The Recipe App* 或你为应用程序决定的名称。这是为了确保下次打开机器时，不会在查找应用程序代码位置时遇到麻烦。\n\n2. 在此文件夹内，创建两个文件——`index.html`\
  \ 和 `recipe-detail.html`。如前所述，`index.html` 将作为应用程序的主页，而 `recipe-detail.html` 将向用户提供他们在主页上选择的食谱的详细信息。暂时将这些文件留空。\n\
  \n   **注意：** 默认情况下，当你将应用程序上传到服务器时，服务器始终会将 `index.html` 文件视为网站/Web 应用程序的默认主页。\n\n\
  3. 创建两个文件夹，分别命名为 `scripts` 和 `styles`。`scripts` 文件夹将包含所有 JS 文件，而 `styles` 文件夹将存放所有\
  \ CSS 文件。同样，你可以随意为这些文件夹选择逻辑名称。我们将在后续过程中将 JS 和 CSS 文件添加到这些文件夹中。如果你打算以后扩展应用程序，可能还需要将图像和字体添加到网页中。这些图像和字体应存储在名为\
  \ `assets` 的单独文件夹中。\n\n至此，我们完成了应用程序的文件夹结构。完成这三个步骤后，你的文件夹结构应如下所示：\n\n![](img/Figure-10.5.jpg)\n\
  \n**图 10.5：** Nom Nom 的文件夹结构\n\n你一定注意到了上面截图中的文件夹结构里有一个 `README.md` 文件。这是一个 Markdown\
  \ 文件，以扩展名 `.md` 表示。Markdown 文件是可以使用标题、缩进和样式进行格式化的文本文件。\n\n**注意：** 上面 *图 9.19* 中显示的\
  \ `README.md` 文件对于将我们的应用程序托管在名为 *GitHub* 的代码仓库平台上非常有用。虽然现在不强制要求将项目托管在 *GitHub* 上，但将项目放在代码仓库（repo）平台上非常重要。通过将项目上传到像\
  \ *GitHub* 这样的代码仓库平台，你可以在世界任何地方的机器上下载并使用你的代码。然而，*GitHub* 远不止是一个简单的仓库平台。它受到全球几乎所有开发者的信任和使用，不仅保证你的代码安全，还可以与同行和关注者一起协作处理代码。事实上，一些顶级公司坚持只招聘那些有\
  \ Git 使用经验的候选人。\n\n你可以通过在浏览器中输入以下网址来了解更多关于 GitHub 的信息：**[`www.github.com`](https://www.github.com)**。\n\
  \n现在我们已经完成了文件夹结构，让我们开始创建 HTML 文件。\n\n**注意：** 强烈建议使用 Visual Studio Code IDE 进行编码。\n\
  \n# 创建 HTML 文件\n\n在本节中，我们将开始创建 HTML 文件。我们将首先创建 `index.html` 文件，然后创建 `recipe-detail.html`\
  \ 文件。\n\n# Index.html\n\n在我们的着陆页上，我们需要一个头部来品牌化并展示应用程序的名称——*NOM NOM*。除此之外，我们还需要向用户显示所有食谱的列表。基于这些基本知识，让我们创建\
  \ `index.html` 文件：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
  \ charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n    <title>Nom Nom</title>\n</head>\n<body>\n    <div class=\"\
  header\">\n        <p class=\"title\">NOM NOM</p>\n        <p class=\"subtitle\"\
  >The best place to learn mouth-watering recipes!</p>\n    </div>\n    <div class=\"\
  recipes-container\">\n        <p class=\"section-title\">Recipes</p>\n        <div\
  \ class=\"recipes\">Here, we will show all the recipes.</div>\n    </div>\n</body>\n\
  </html>\n```\n\n**代码 10.1：** Nom Nom 的 index.html 文件\n\n如 *代码示例 10.1* 所示，我们为着陆页创建了一个\
  \ `index.html`。正如你所见，在网页的 body 内部，我们创建了两个 `div` 元素。\n\n第一个 `div` 元素包含网页的头部，用于品牌展示。在第一个\
  \ `div` 元素内部，我们有第一个段落用于标题，第二个段落用于吸引人的副标题。\n\n\n\n\n第二个 `div` 元素将向用户展示食谱列表。我们将第二个\
  \ `div` 元素的类名恰当地命名为 `recipes-container`。在这个 `div` 内部，我们首先创建了一个 `p` 元素作为该部分的标题，以及一个\
  \ `div` 元素用于展示食谱。目前，我们输入了一段占位文本，以显示食谱列表部分在网页上的位置。保存后，通过点击新建文件夹中的 `index.html` 文件打开网页，我们将看到类似下图的内容：\n\
  \n![](img/Figure-10.6.jpg)\n\n**图 10.6：** Nom Nom 的 index.html 文件视图\n\n现在，让我们创建\
  \ Web 应用的第二个 HTML 文件。\n\n# Recipe-detail.html\n\n在第二个页面上，我们希望向用户展示他/她所选菜品的食谱。结合\
  \ *图 10.4* 的内容，我们将以下代码添加到 `recipe-detail.html` 中：\n\n```\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n    <title>Nom Nom | Recipe</title>\n\
  </head>\n<body>\n    <div class=\"header\">\n        <div>\n            <p class=\"\
  title\">NOM NOM</p>\n            <p class=\"subtitle\">The best place to learn mouth-watering\
  \ recipes!</p>\n        </div>\n        <p class=\"all-recipes\">All Recipes</p>\n\
  \    </div>\n    <div class=\"recipe-details-container\">\n        <p class=\"recipe-title\"\
  >Title of the selected recipe</p>\n        <div class=\"recipe-video\">\n      \
  \      <iframe class=\"video\" src=\"\" frameborder=\"0\" allow=\"accelerometer;\
  \ autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n\
  \        </div>\n        <div class=\"details\">\n            <div class=\"ingredients\"\
  >\n                <p class=\"section-title\">Ingredients</p>\n                <ol\
  \ class=\"ingredients-list\">Here, we will have the list of the ingredients.</ol>\n\
  \            </div>\n            <div class=\"recipe\">\n                <p class=\"\
  section-title\">Recipe</p>\n                <p class=\"instruction\">Here, we will\
  \ have the instructions of the recipe.</p>\n            </div>\n        </div>\n\
  \    </div>\n</body>\n</html>\n```\n\n**代码 10.2：** Nom Nom 的 recipe-detail.html\
  \ 文件\n\n如 *代码示例 10.2* 所示，我们首先在 body 内添加了应用的页眉，以保持页面间的一致性。不过，我们对 *代码示例 10.1* 中的代码做了一点小改动：现在我们在页眉内添加了一个包含文本“All\
  \ Recipes”的段落元素。该文本将帮助用户返回首页。\n\n在页眉下方，我们创建了一个 `div` 元素，其中包含食谱标题、用于嵌入视频的 iframe\
  \ 元素，以及另一个用于存放食材和食谱的 div 元素。保存后，打开文件夹中的 `recipe-detail.html` 页面，我们将看到以下内容：\n\n![](img/Figure-10.7.jpg)\n\
  \n**图 10.7：** Nom Nom 的 recipe-detail.html 文件视图\n\n至此，我们已经创建了网页的基础结构（即 HTML）。接下来，我们进入样式设计环节。\n\
  \n# 初始样式设计\n\n样式设计是任何 Web 应用或网页的关键部分。正是网页的样式吸引并留住了消费者和用户。一个小建议是：切勿过度设计样式。这意味着过多的动画或过于鲜艳的色彩会使用户反感。\n\
  \n对于我们的应用，我们将保持简洁而优雅的样式。\n\n稍加思考便会发现，两个网页中的某些元素（例如页眉）需要一套通用的样式。然而，大多数元素则需要不同的样式。\n\
  \n作为经验法则，始终为不同的网页保留不同的样式表。这不仅有助于保持 CSS 文件的整洁，还能在需要更改任一页面中某个元素的 CSS 属性时提供便利。如果使用独立的样式表，查找和修改样式会更容易，且不会影响其他样式。基于此，我们将创建三个样式表：`common.css`（用于两个网页的通用样式）、`index.css`（用于\
  \ `index.html`）和 `recipe-detail.css`（用于 `recipe-detail.html`）。\n\n由于本书主要关注 JavaScript，我们不会深入学习或探索\
  \ CSS。如有任何疑问，请参考互联网寻求解答。\n\n在 styles 文件夹中，我们首先创建一个名为 `common.css` 的文件。该文件将处理所有文件中共有元素的样式。在\
  \ `common.css` 中输入以下代码并保存：\n\n```\nhtml, body {\n    padding: 0 15px;\n    margin:\
  \ 0;\n    height: 100%;\n    font-family: 'Roboto', 'Helvetica', sans-serif;\n}\n\
  \n.header {\n    padding-top: 10px;\n    margin-bottom: 32px;\n}\n\n.title, .subtitle,\n\
  .section-title {\n    margin: 0;\n}\n\n.title {\n    font-size: 40px;\n}\n\n.subtitle\
  \ {\n    font-size: 18px;\n}\n```\n\n**代码 10.3：** Nom Nom 的 common.css 文件\n\n由于\
  \ `div` 页眉和 html/body 中的元素在所有页面中都是通用的，因此我们在 `common.css` 中为它们编写了样式。\n\n接下来，我们为 `index.html`\
  \ 文件添加样式。在 styles 文件夹中，创建一个名为 `index.css` 的文件。在 `index.css` 中输入以下样式代码：\n\n```\n\
  .section-title {\n    font-size: 24px;\n    margin-bottom: 12px;\n}\n\n.recipes\
  \ {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    row-gap: 16px;\n\
  }\n```\n\n**代码 10.4：** Nom Nom 的 index.css 文件\n\n如 *代码示例 10.4* 所示，对于存储所有食谱的 `div`，我们希望每行只显示三个食谱。因此，我们使用了网格布局，并设置了三列等分可用空间。\n\
  \n最后，我们为 `recipe-detail.html` 文件创建 `recipe-detail.css` 文件：\n\n```\n.header {\n \
  \   display: flex;\n    flex-direction: row;\n    justify-content: space-between;\n\
  }\n\n.all-recipes {\n    cursor: pointer;\n    color: #007bff;\n}\n\n.recipe-title\
  \ {\n    font-size: 32px;\n}\n\n.details {\n    width: 100%;\n}\n\n.section-title\
  \ {\n    font-size: 18px;\n}\n\n.recipe {\n    overflow-y: auto;\n}\n\n.recipe-video\
  \ {\n    margin-bottom: 16px;\n}\n\n.video {\n    height: 400px;\n    width: 100%;\n\
  }\n\n.ingredients-list {\n    padding-left: 15px;\n}\n```\n\n**代码 10.5：** Nom Nom\
  \ 的 recipe-detail.css 文件\n\n至此，我们已经为网页添加了初始样式。现在，我们需要将这些 CSS 文件链接到各自的 HTML 文件中。在\
  \ `index.html` 中，在结束 `head` 标签之前、`title` 标签之后，添加以下内容：\n\n```\n<link href=\"styles/common.css\"\
  \ rel=\"stylesheet\" />\n<link href=\"styles/index.css\" rel=\"stylesheet\" />\n\
  ```\n\n**代码 10.6：** 在 index.html 中链接 CSS 文件\n\n类似地，我们在 `recipe-detail.html` 页面的\
  \ head 标签末尾链接 CSS 文件：\n\n```\n<link href=\"styles/common.css\" rel=\"stylesheet\"\
  \ />\n<link href=\"styles/recipe-detail.css\" rel=\"stylesheet\" />\n```\n\n**代码\
  \ 10.7：** 在 recipe-detail.html 中链接 CSS 文件\n\n\n\n\n按照前面的步骤操作后，刷新页面时，`index.html`\
  \ 页面将如下所示：\n\n![](img/Figure-10.8.jpg)\n\n**图 10.8：** 应用 CSS 后的 index.html\n\n同样，`recipe-detail.html`\
  \ 现在将如下所示：\n\n![](img/Figure-10.9.jpg)\n\n**图 10.9：** 应用 CSS 后的 recipe-detail.html\n\
  \n至此，我们已经完成了为 Web 应用应用初始 CSS 的工作。接下来，让我们进入 JavaScript 部分！\n\n# 连接到服务器\n\n在前面的章节中，我们完成了\
  \ HTML 文件的创建，并使用 CSS 为其应用了样式。现在，我们将开始处理 JavaScript。\n\n回顾一个旧概念，与服务器的交互通常通过一个称为**应用程序编程接口**（**API**）的接口进行。简单来说，API\
  \ 非常类似于服务器/应用的 URL。API 允许两个应用相互通信。例如，每次你使用像 *Facebook* 或 *Instagram* 这样的社交媒体应用时，都会向服务器发送一个\
  \ API 请求，以获取要在你的手机/电脑上显示的数据。在本节中，我们将使用一个名为 *The MealDB* 的公共 API 平台提供的 API。\n\n如果你查看\
  \ *MealDB* 平台的 API 部分，你会看到一系列 API（也称为端点）。每个 API 都有不同的用途。\n\n![](img/Figure-10.10.jpg)\n\
  \n**图 10.10：** MealDB 平台的 API 页面\n\n对于我们的应用 *Nom Nom*，我们需要在首页上显示一系列食谱。虽然有多种不同的方法可以从\
  \ MealDB 服务器获取这些数据，但我们将使用端点 [`www.themealdb.com/api/json/v1/filter.php?c=Seafood`](https://www.themealdb.com/api/json/v1/filter.php?c=Seafood)\
  \ 来满足我们的需求。不过，我将获取的是 Pasta 类别的食谱列表，而不是 Seafood。\n\n（你可以通过复制 API [`www.themealdb.com/api/json/v1/1/categories.php`](https://www.themealdb.com/api/json/v1/1/categories.php)\
  \ 并将其粘贴到浏览器 URL 中，来查看所有类别的列表。）\n\n那么，闲话少说，我们现在在 scripts 文件夹中创建一个新文件，并将其命名为 `index.js`。在\
  \ `index.js` 中，我们将创建、打开并向 API（端点）发送请求：[`www.themealdb.com/api/json/v1/filter.php?c=Pasta`](https://www.themealdb.com/api/json/v1/filter.php?c=Pasta)\n\
  \n```\nlet request = new XMLHttpRequest();\nrequest.open('GET', 'https://www.themealdb.com/api/json/v1/1/filter.php?c=Pasta',\
  \ true);\nrequest.send();\nrequest.onreadystatechange = function() {\n    if(this.readyState\
  \ === 4 && this.status === 200) {\n        console.log(\"JSON string:  \", this.responseText);\n\
  \        console.log(\"After parsing:  \", JSON.parse(this.responseText));\n   \
  \     //createRecipeCards(this.responseText);\n    }\n}\n```\n\n**代码 10.8：** 在 index.js\
  \ 中创建 AJAX 请求\n\n在代码示例 10.8 中，代码的前五行很容易理解。我们只是创建了一个 AJAX 请求，打开它，将其发送到服务器，然后等待服务器响应状态为\
  \ 200。\n\n在第 5 行之后，一旦我们成功接收到响应，就需要使用该响应在 index.html 上创建食谱列表。为此，我将这个任务分配给一个名为 `createRecipeCards`\
  \ 的函数。我们打算将服务器响应传递给 `createRecipeCards` 函数。不过，在传递响应之前，让我们先看看从服务器接收到的响应。为了更好地理解，我们还将对\
  \ `responseText` 应用 `JSON.parse`，如第 7 行所示。因此，我们将通过在该行开头添加 // 来注释掉第 7 行。\n\n现在，我们将保存\
  \ `index.js` 文件，并将其导入到我们的 `index.html` 中。为此，我们将在关闭 `index.html` 的 `body` 标签之前添加以下代码：\n\
  \n`<script src=\"scripts/index.js\"></script>`\n\n**代码 10.9：** 在 index.html 中导入\
  \ index.js\n\n保存此文件并刷新网页后，你将在控制台中看到以下内容：\n\n![](img/Figure-10.11.jpg)\n\n**图 10.11：**\
  \ 控制台中显示的 API 响应\n\n如上面的截图所示，我们接收到一个包含键 `meals` 的对象。键 `meals` 的值是一个对象数组，其中包含我们的食谱。正是这个对象数组需要发送给函数\
  \ `createRecipeCards`，以创建食谱列表。那么，让我们快速修改一下 `index.js` 中的代码。\n\n让我们删除第 6 行和第 7 行的\
  \ `console.log` 语句。同时，取消注释第 8 行对 `createRecipeCards` 的函数调用，并修改传递给函数的参数。我们将不再直接传递响应文本，而是解析\
  \ JSON 字符串，并传递存储在键 `meals` 中的值：\n\n`createRecipeCards(JSON.parse(this.responseText).meals);`\n\
  \n**代码 10.10：** 解析响应并发送\n\n至此，我们已成功从服务器接收到响应，并将其传递给函数以创建列表。\n\n# 使用服务器响应更新主页\n\n\
  在上一节中，我们接收到了服务器的响应；为了保持代码整洁，我们将创建食谱列表的任务分配给了函数 `createRecipeCards`。在这个函数内部，我们将使用在第\
  \ 1 章：JavaScript 简介中学到的 DOM 方法，为用户创建食谱列表。\n\n现在，有一句常言道：一图胜千言。事实上，人们往往更容易记住图片或图形描述，而不是文字描述。基于这一理念，让我们为用户创建一个图片式的食谱列表。这不仅会让我们的页面看起来更生动，还会吸引用户查看尽可能多的食谱。\n\
  \n在代码示例 10.4 中，我们为将显示食谱的 `div` 元素添加了 CSS 属性 `display: grid` 和 `grid-template-columns:\
  \ 1fr 1fr 1fr`。这意味着我们的食谱容器的大致结构将如下所示：\n\n![](img/Figure-10.12.jpg)\n\n**图 10.12：**\
  \ 食谱容器的结构\n\n如上图所示，每个方框代表一个食谱。如前所述，一旦用户点击任何一个代表食谱的方框，用户将被带到 `recipe-detail` 页面，查看所选食谱的详细信息。\n\
  \n为了帮助我们更好地编码，让我们看看服务器响应中接收到的单个食谱的结构：\n\n![](img/Figure-10.13.jpg)\n\n**图 10.13：**\
  \ 服务器响应中单个食谱的结构\n\n如果你观察上面的截图，你会注意到每个食谱都有一个存储在键 `strMealThumb` 中的食谱图片链接。我们将使用这个链接为图\
  \ 10.12 中所示的方框添加图片。此外，我们可以使用键 `strMeal` 作为食谱的名称。基于此，让我们在 `index.js` 中创建函数 `createRecipeCards`：\n\
  \n```\nconst createRecipeCards = list => {\n    let recipesContainer = document.querySelector(\"\
  .recipes\");\n    for(let recipe of list) {\n        // 创建食谱卡片，即我们将显示食谱的方框\n   \
  \     let recipeCard = document.createElement('div');\n        recipeCard.setAttribute(\"\
  id\", recipe.idMeal);\n        recipeCard.setAttribute(\"class\", \"recipe-card\"\
  );\n\n        // 创建图片并将其添加到我们刚刚创建的食谱卡片中\n        let recipeImg = document.createElement(\"\
  img\");\n        recipeImg.setAttribute(\"src\", recipe.strMealThumb);\n```\n\n\n\
  \n\n\n```\n12.        recipeImg.setAttribute(\"class\", \"recipe-img\");\n13.  \
  \      recipeImg.setAttribute(\"alt\", recipe.strMeal);\n14.        recipeCard.appendChild(recipeImg);\n\
