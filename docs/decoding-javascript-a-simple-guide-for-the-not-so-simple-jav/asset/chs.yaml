  \ *代码示例 10.14* 中，第 10-14 行，我们创建了图片元素，将 `strMealThumb` 作为图片元素的源，为图片元素分配一个类，将食谱名称分配给图片的\
  \ alt 属性，最后将图片元素追加到我们在第 5 行创建的 `recipeCard` 中。\n*   需要添加到食谱卡片的最后一项是文本，即食谱的名称。我们在第\
