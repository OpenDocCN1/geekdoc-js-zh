  \ 10.14* 中创建的新元素添加了样式。虽然前面提到的大多数 CSS 属性都很容易理解，但为了吸引用户的注意力，我们做了一个巧妙的设计：降低了食谱卡片的不透明度。只有当用户将鼠标悬停在食谱卡片上时，卡片才会清晰地显示出来。\n\
  \n当我们保存 JS 和 CSS 文件并在浏览器中刷新 `index.html` 页面时，会看到类似下面的内容：\n\n![](img/Figure-10.14.jpg)\n\
  \n**图 10.14：** 服务器响应中单个食谱的结构\n\n# 跳转到食谱详情页面\n\n在上一节中，我们完成了 `index.html` 的创建，即我们的应用程序\
  \ *Nom Nom* 的主页。下一步是确保当用户点击主页上的任意食谱时，他/她会被引导到 `recipe-detail.html` 页面。在 `recipe-detail.html`\
  \ 页面上，用户应该看到他在主页上选择的食谱的详细信息。\n\n在某种程度上，我们已经为将用户引导到 `recipe-detail.html` 页面奠定了基础。在\
  \ *代码示例 10.14* 中，我们为主页上的每个食谱卡片分配了一个 id。现在，我们需要为每个食谱卡片分配一个点击事件监听器。这个事件监听器将获取所选卡片的\
  \ id，并将其传递给 `recipe-detail.html` 页面。\n\n首先，让我们在 `index.js` 中创建事件处理函数：\n\n```\nconst\
  \ viewRecipe = id => window.location.href = `recipe-detail.html?id=${id}`;\n```\n\
  \n**代码 10.16：** 食谱卡片点击时的事件处理程序\n\n在 *代码示例 10.16* 中，我们创建了一个名为 `viewRecipe` 的 ES6\
  \ 函数。函数 `viewRecipe` 接受一个 id 作为参数。该函数将用户引导到 `recipe-detail.html` 页面，并将 id 作为查询参数传递。\n\
  \n在 *代码示例 10.16* 中，我们使用了 `window.location.href` 属性。`window.location.href` 属性返回页面的当前\
  \ URL。与 JavaScript 属性的特性一致，如果你为 `window.location.href` 属性设置一个值，它就会将该值设置为页面的 URL，即它会在当前标签页中打开该\
  \ URL。因此，在上述代码中，我们让当前网页的窗口跳转到 `recipe-detail.html` 页面。\n\n如前所述，我们还希望将所选食谱的 ID 发送到食谱详情页面。这可以通过一种称为查询字符串参数的概念来实现。每当需要在\
  \ URL 中传递值时，可以将它们作为 key=value 对添加到 URL 中。要指定查询字符串参数，需要在 URL 末尾添加一个问号，然后在其后添加 key=value\
  \ 对。如果有多个参数（key=value 对），则需要用 & 符号分隔。\n\n因此，借助 `window.location.href` 属性和查询字符串参数，我们实现了将用户重定向到食谱详情页面的任务。\n\
  \n现在我们需要为每个食谱卡片元素附加一个事件监听器。为此，在 *代码示例 10.14* 中，我们将在第 23 行 `recipesContainer.appendChild(recipeCard)`\
  \ 代码之后立即添加一个 onclick 事件。我们将在 `index.js` 中的 *代码示例 10.14* 的第 23 行之后添加以下代码：\n\n```\n\
  recipeCard.onclick = () => viewRecipe(recipe.idMeal);\n```\n\n**代码 10.17：** 食谱卡片的事件处理程序\n\
  \n通过添加如上 *代码示例 10.17* 所示的代码，每当用户点击食谱卡片时，它都会调用 `viewRecipe` 函数并将餐食 ID 传递给它。我们必须确保将\
  \ *代码示例 10.17* 中所示的代码添加到 for 循环内部。这将确保每个食谱卡片都获得这个事件监听器。\n\n\n\n\n\n保存这两行代码后，当我们运行应用程序时，你会看到点击任意食谱都会跳转到食谱详情页面。如果你查看食谱详情页面的\
  \ URL，会发现每次点击不同食谱时，URL 中会填充不同的 ID。\n\n# 更新食谱详情页面\n\n现在我们已经完成了网页的第一部分，接下来创建网站的第二部分——`recipe-detail.html`。在上一节中，当用户点击主页上显示的任意食谱时，我们会将其重定向到\
  \ `recipe-detail.html` 页面，并将 ID 作为查询字符串参数传递到 URL 中。\n\n让我们按以下方式完成食谱详情页面：\n\n1. \
  \ 从 URL 中获取 ID，并向服务器发送请求以获取详细食谱。\n2.  使用服务器响应创建必要的 HTML 元素。\n3.  最后，使用 CSS 为这些元素添加样式。\n\
  \n# 获取详细食谱\n\n为了获取详细食谱，我们可以查看 *MealDB* 服务器上的 API 列表，找到能够帮助我们实现这一目标的 API 端点。你会发现端点\
  \ [`www.themealdb.com/api/json/v1/1/lookup.php?i=52772`](https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772)\
  \ 可以帮助我们通过 ID 获取详细食谱。那么，我们来编写获取 ID 并发送请求的代码。\n\n# 获取从主页传递的 ID\n\n为此，我们将在 scripts\
  \ 文件夹中创建一个名为 `recipe-detail.js` 的新 JavaScript 文件。在 `recipe-detail.js` 中，我们首先获取 URL\
  \ 中接收到的 ID。\n\n```\nconst fetchId = () => {\n    let paramsString = window.location.search.slice(1);\n\
  \    let paramsArr = paramsString.split('&');\n    let id = paramsArr\n        \
  \    .find(param => param.split('=')[0] === 'id')\n            .split('=')[1];\n\
  \    return id;\n}\n\nlet id = fetchId();\n```\n\n**代码 10.18：** 从 URL 中获取 ID 的代码。\n\
  \n如 *代码示例 10.18* 所示，我们创建了一个用于获取 ID 的函数，并恰当地将其命名为 `fetchId`。在该函数内部，我们首先获取查询字符串参数。为了更好地理解这一点，让我们在\
  \ `recipe-detail.html` 的开发者工具中打开 `Console` 选项卡。在控制台中，输入 `window.location`。你将在控制台窗口中看到类似以下内容：\n\
  \n![](img/Figure-10.15.jpg)\n\n**图 10.15：** window.location\n\n如上述截图所示，`window.location`\
  \ 包含了与网页 URL 相关的所有信息。我们当前关注的是 `window.location` 的 search 属性。在 search 属性中，包含了完整的查询字符串参数。\n\
  \n*   在 *代码示例 10.18* 的第 2 行，我们获取 `window.location.search` 属性，并使用 JavaScript 的 slice\
  \ 方法截取第一个字符。执行此操作后，变量 `paramsString` 中将得到值 `id=52835`。\n*   在下一行（第 3 行），我们考虑了查询字符串中可能存在多个参数的情况。使用\
  \ JavaScript 数组的 split 方法，以字符 & 为分隔符拆分变量 `paramsString` 中的字符串。这将得到一个以 & 符号分隔的值数组。我们将该数组存储在变量\
  \ `paramsArr` 中。\n*   在第 4-6 行，我们遍历数组 `paramsArr` 中的每个元素，以找到包含从 `index.js` 传递的 ID\
  \ 的参数。在第 5 行，我们使用了 JavaScript 的 `find()` 方法。`find()` 方法与 `filter()` 方法类似，区别在于 filter\
  \ 方法返回所有通过条件测试的元素组成的数组，而 find 方法返回第一个通过测试的元素。在这种情况下，由于我们确定只会有一个查询参数的键为 id，因此我们使用\
  \ find 方法，因为它直接返回对象/值而不是数组。为了找到键，我们需要再次以等号（=）为分隔符拆分 key=value 字符串，以获取键。由于键始终是第一个元素，即结果数组中位置为\
  \ 0 的元素，我们检查拆分数组的第一个元素是否为文本 'id'。\n*   一旦获取到包含键 id 的对象，我们需要使用其值来获取 ID。在第 6 行，我们再次拆分字符串，并获取拆分数组中位置为\
  \ 1 的元素，该元素即为值。由于这是我们代码所需的值，我们将从函数 `fetchId` 中存储并返回该值。\n\n函数 `fetchId` 的结果存储在第 10\
  \ 行的变量 ID 中。\n\n# 使用 ID 向服务器发送请求\n\n现在我们已经从 `index.js` 文件中获取了 ID，接下来使用该 ID 向服务器发送请求以获取详细食谱。正如本节开头所述，我们将使用\
  \ API [`www.themealdb.com/api/json/v1/1/lookup.php?i=52772`](https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772)，并替换末尾的\
  \ ID：\n\n```\nlet request = new XMLHttpRequest();\nrequest.open('GET', `https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`,\
  \ true);\nrequest.send();\nrequest.onreadystatechange = function() {\n    if(this.readyState\
  \ === 4 && this.status === 200) {\n        console.log(JSON.parse(this.responseText));\n\
  \        addRecipeDetails(JSON.parse(this.responseText).meals);\n    }\n}\n```\n\
  \n**代码 10.19：** 从服务器获取食谱详情的代码\n\n如 *代码示例 10.8* 所示，在 *代码示例 10.19* 中，我们创建、打开并向 *MealDB*\
  \ 服务器发送请求，URL 中包含用于根据接收到的 ID 获取食谱详情的地址。同样，我们将创建 `recipe-detail.html` 上各种 HTML 元素的任务分配给一个函数。这次，在\
  \ `recipe-detail.js` 中，我们将使用名为 `addRecipeDetails` 的函数。与之前一样，我们首先使用 `JSON.parse`\
  \ 将 JSON 字符串转换为 JavaScript 对象。然后，将该 JavaScript 对象中键 meals 对应的值发送给该函数。\n\n# 在食谱详情页面中创建\
  \ HTML 元素\n\n在开始编写函数之前，让我们快速查看一下 JSON 解析后的服务器响应。由于我们在 *代码示例 10.19* 的第 6 行添加了 `console.log`\
  \ 语句，让我们查看开发者工具的 Console 面板以查看其值：\n\n![](img/Figure-10.16.jpg)\n\n**图 10.16：** 详细食谱的响应\n\
  \n如上述截图所示，我们收到一个包含单个值的数组（因为对于给定的 ID，始终只有一个食谱）。因此，在继续之前，让我们对 *代码示例 10.19* 的第 7 行进行快速修改。不再发送响应中\
  \ meals 键对应的数组，而是发送数组中的第一个且唯一的元素：\n\n```\naddRecipeDetails(JSON.parse(this.responseText).meals[0]);\n\
  ```\n\n**代码 10.20：** 函数调用的修改\n\n\n\n\n\n回到服务器响应，我们可以看到有很多信息可以帮助我们创建食谱详情页面。不过，我们只需要用到\
  \ `strYoutube` 属性中分享的 *YouTube* 链接、`strMeal` 属性中分享的食谱名称、`strInstructions` 属性中分享的说明，以及存储在多个\
  \ `strIngredient` 和 `strMeasure` 属性中的食材和用量列表。\n\n添加 `strYoutube`、`strMeal` 和 `strInstructions`\
  \ 属性相当直接。因此，我们先将这些属性的数据添加到用户界面中。此外，我们可以使用 `strMeal` 属性来更新页面标题。由于我们将使用 `addRecipeDetails`\
  \ 函数来更新用户界面，让我们在 `addRecipeDetails` 函数内部添加这些属性的代码：\n\n```\nconst addRecipeDetails\
  \ = response => {\n    document.title = `Nom Nom | ${response.strMeal}`;\n    document.querySelector(\"\
  .recipe-title\").innerHTML = response.strMeal;\n    document.querySelector(\".video\"\
  ).setAttribute('src', response.strYoutube);\n    document.querySelector(\".instruction\"\
  ).innerHTML = response.strInstructions;\n}\n```\n\n**代码 10.21：** 向用户界面添加多个属性\n\n\
  保存并刷新网页后，我们不会在 `recipe-detail.html` 上看到任何变化。这是因为我们还没有从 `index.html` 的 URL 中接收到任何\
  \ id。因此，让我们通过修改地址栏中的 URL 回到 `index.html`。现在，当你选择一个食谱时，`recipe-detail.html` 页面将如下所示：\n\
  \n![](img/Figure-10.17.jpg)\n\n**图 10.17：** CORS 错误\n\n如果我们将 *图 10.17* 与 *图 10.9*\
  \ 进行比较，你会发现我们已经取得了巨大进展。然而，视频无法播放。当你检查控制台中的错误时，会看到以下内容：\n\n![](img/Figure-10.18.jpg)\n\
  \n**图 10.18：** 添加多个属性后的食谱详情页面\n\n默认情况下，出于安全原因，浏览器不允许在不同服务器之间共享资源。为了解决这个问题，我们将对 *代码示例\
  \ 10.21* 中第 4 行的 iframe 代码进行小幅修改：\n\n```\ndocument.querySelector(\".video\").setAttribute('src',\
  \ response.strYoutube.replace(\"watch?v=\", \"embed/\"));\n```\n\n**代码 10.22：**\
  \ 在食谱详情页面上启用视频\n\n借助 *代码示例 10.22* 中所示的代码，我们现在将服务器接收到的视频链接转换为嵌入式链接。在 *代码示例 10.22*\
  \ 的 `setAttribute` 方法的第二个参数中，我们将字符串 `watch?v=` 替换为 `embed/`。URL 中的 `watch?v=` 表示在\
  \ YouTube 平台上观看视频，而 `embed/` 表示将 YouTube 视频嵌入或添加到网页中。现在，做出此更改后，当我们刷新页面时，将看到以下内容：\n\
  \n![](img/Figure-10.19.jpg)\n\n**图 10.19：** 启用视频后的食谱详情页面视图\n\n对于食材，我们需要确保食材及其用量像这样一起显示：食材\
  \ N（用量 N）。目前，响应中每个食材都是单独提供的。为了解决这个问题，我们将创建另一个函数，并在 `addRecipeDetails` 函数内部调用它：\n\
  \n```\nconst getIngredients = response => {\n    let ingredients = [],\n       \
  \ measurements = [],\n        ingredientsWithMeasurements = [];\n    for(let key\
  \ in response) {\n        if(key.includes(\"strIngredient\") && response[key].length\
  \ > 0)\n            ingredients.push(response[key]);\n        if(key.includes(\"\
  Measure\") && response[key].length > 0 && response[key] !== \" \")\n           \
  \ measurements.push(response[key]);\n    }\n\n    for(let index in ingredients)\
  \ {\n        ingredientsWithMeasurements.push(`${ingredients[index]} (${measurements[index]})`);\n\
  \    }\n\n    return ingredientsWithMeasurements;\n}\n```\n\n**代码 10.23：** 创建食材字符串数组\n\
  \n在 *代码示例 10.23* 中，我们将接受整个响应作为参数。由于食材和用量在响应中是分开添加的，如 *图 10.16* 所示，因此在此函数中接收整个响应非常重要。\n\
  \n如果你仔细查看 *图 10.16* 中的服务器响应，你会注意到所有食材都包含文本 `strIngredient`，后面附加了一个数字。同样，所有用量都包含文本\
  \ `Measure`，后面附加了一个数字。事实上，每个带索引的食材都对应其带索引的用量。这意味着（请查看 *图 10.16*），`strIngredient1`\
  \ – Macaroni 应该对应 `strMeasure1` – 8 ounces (230 gms) 的用量。这也意味着食材的数量将等于用量的数量。\n\n\
  牢记这一点，在函数内部，我们运行一个 for 循环来解析响应的每个属性。如果键匹配文本 `strIngredient` 且其值不为空，则将其值推入 ingredients\
  \ 数组。同样，我们在第 8 行和第 9 行对用量执行相同操作。\n\n当两个数组都填充完毕后，我们现在将遍历新创建的 ingredients 数组。由于 ingredients\
  \ 数组和 measurements 数组的长度相同，我们可以使用其中任何一个来获取索引值。使用此索引值，我们将它们转换为“食材（用量）”格式。在 *代码示例\
  \ 10.23* 的第 13 行创建的最终数组将传回给 `addRecipeDetails` 函数。\n\n因此，我们将更新 `addRecipeDetails`\
  \ 函数，以接收字符串格式的食材和用量列表。此外，我们将使用此列表来填充食谱详情页面中缺失的食材部分：\n\n```\nconst addRecipeDetails\
  \ = response => {\n    document.title = `Nom Nom | ${response.strMeal}`;\n    document.querySelector(\"\
  .recipe-title\").innerHTML = response.strMeal;\n    document.querySelector(\".video\"\
  ).setAttribute('src', response.strYoutube.replace(\"watch?v=\", \"embed/\"));\n\
  \    let ingredientsList = document.querySelector(\".ingredients-list\");\n    let\
  \ ingredients = getIngredients(response);\n    for(let ingredient of ingredients)\
  \ {\n        let listElement = document.createElement('li');\n        listElement.innerHTML\
  \ = ingredient;\n        ingredientsList.appendChild(listElement);\n    }\n    document.querySelector(\"\
  .instruction\").innerHTML = response.strInstructions;\n}\n```\n\n**代码 10.24：** 更新\
  \ addRecipeDetails 函数以使用食材\n\n现在，我们已经更新了 `addRecipeDetails` 函数。首先，我们获取用于存储食材的 HTML\
  \ 容器。接下来，我们调用 `getIngredients` 函数来接收字符串格式的食材，并将其存储在变量 `ingredients` 中。最后，我们使用这个变量\
  \ `ingredients` 创建一个元素列表，并将其附加到食谱详情页面。保存并刷新网页后，我们将看到以下内容：\n\n![](img/Figure-10.20.jpg)\n\
  \n**图 10.20：** 添加列表后的食谱详情页面视图\n\n如果你仔细观察，会发现我们在等待服务器响应时看到了占位符消息。为了解决这个问题，请删除 `recipe-detail.html`\
  \ 中对应第 24 行和第 28 行的占位符（参考 *代码示例 10.2*），以及 `index.html` 中第 16 行的占位符（参考 *代码示例 10.1*）。\n\
  \n# 添加返回主页的链接\n\n\n\n\n需要添加到食谱详情页的最后一段代码是激活页眉中的“All Recipes”文本。为此，我们创建一个名为 `goToHome`\
  \ 的函数，并将其添加到 `recipe-detail.js` 中。\n\n`const goToHome = () => window.location.href\
  \ = \"index.html\";`\n\n代码 10.25：返回主页的函数\n\n正如我们之前所学，设置 `window.location.href` 属性会将浏览器重定向到所设置的值。因此，我们将值\
  \ `index.html` 添加到此属性。现在，函数已创建，我们需要将此函数的调用添加到文本“All Recipes”中。在我们的 `recipe-detail.html`\
  \ 文件中，我们将找到此文本并为其添加 onclick 事件监听器属性：\n\n`<p class=\"all-recipes\" onclick=\"goToHome()\"\
  >All Recipes</p>`\n\n代码 10.26：为 All Recipes 添加 onclick 属性\n\n保存更改后，我们可以通过刷新食谱详情页并点击“All\
  \ Recipes”文本来测试此功能。现在它应该会跳转到我们应用程序的主页。\n\n至此，我们已经成功完成了应用程序的开发。接下来进入下一部分——测试！\n\n\
  # 系统测试\n\n在图 10.1 中，我们看到开发完成后，下一个流程是测试。测试或**质量保证**（**QA**）是对应用程序进行测试的过程。测试有多种类型，其中一些如下：\n\
  \n*   **单元测试**：在此测试中，我们检查构成 UI 的每个独立组件。测试用于检查它们是否按预期方式工作。\n\n*   **组件测试**：组件测试用于验证组件的功能。例如，一个组件可以是一个模块，也可以是一个网站的配置文件页面，由多个通过单元测试测试过的小组件构成。\n\
  \n*   **冒烟测试**：此测试针对新的“构建”进行。每当开发团队完成他们的任务时，他们会“构建”代码以便上传到服务器。冒烟测试是一种初始测试，用于检查新构建（即代码的每次新更新）是否稳定。\n\
  \n*   **集成测试**：集成测试用于检查不同组件如何协同工作。它主要用于检查一个模块的功能是否会导致另一个模块崩溃。\n\n*   **回归测试**：用于检查对任何特性/功能的更改或修改是否不会破坏或导致原始功能崩溃。\n\
  \n*   **健全性测试**：与冒烟测试类似。用于检查修复代码中错误的补丁是否已解决问题。它还用于识别该修复是否导致了任何新错误。\n\n*   **系统测试**：通常，这是测试人员进行的最后一轮测试。它模拟用户将使用应用程序的实际环境。它检查整个应用程序是否在其实际技术、功能和业务需求方面表现良好。\n\
  \n在本章中，我们将仅执行系统测试，以检查我们的应用程序“Nom Nom”是否基于我们在图 10.2 中设定的粗略期望正常工作。\n\n为了执行系统测试，我们将仔细观察\
  \ Web 应用程序的每一个功能。这包括但不限于：网页在浏览器中正确打开、检查页眉、食谱列表、点击食谱卡片、重定向到食谱详情页、食谱加载、YouTube 视频工作、以及文本是否在网页的正确位置填充。它还包括检查网页的样式以及任何元素或组件（独立功能）是否看起来良好。此外，还包括检查已发送的请求以及我们是否收到了正确的响应。\n\
  \n请花大量时间对你刚刚在机器上创建的应用程序执行系统测试。\n\n如果你已经完成了对应用程序的系统测试，你会观察到我们的应用程序有两个缺点：\n\n*   每当我们向\
  \ MealDB 服务器发送请求时，页面保持空白，没有任何指示表明请求是否已发送，或者列表或详情是否正在加载。如果网络或网速较慢，这可能会很关键。在这种情况下，服务器可能需要超过\
  \ 2-3 分钟才能响应请求。如果我们不提供任何消息或指示，用户在等待响应时可能只会看到空白屏幕，并可能离开应用程序。\n\n*   如果服务器请求失败，我们没有任何方法来处理错误。\n\
  \n那么，让我们解决这些问题。\n\n# 添加加载文本\n\n如前所述，服务器响应请求所需的时间从来都不是固定的。在网络较慢的情况下，服务器甚至可能需要十分钟才能向客户端发送响应。在这种情况下，明智的做法是告知应用程序的用户我们正在等待服务器的响应。为了保持用户的参与度，我们可以添加诸如“加载中…”、“正在从服务器获取信息…”之类的文本，或者像旋转圆圈这样的图形图像来表示加载。选项是无限的，仅受限于你的创造力。\n\
  \n对于我们的应用程序，我们将添加一个简单的“加载中…”文本。\n\n由于我们在两个地方发送服务器请求，我们需要将“加载中…”文本添加到这两个文件中。首先将其添加到\
  \ `index.html` 文件中。\n\n在我们的主页（即 `index.html`）上，将加载文本添加到最终加载食谱图片的食谱容器中是合理的。因此，我们继续在类名为\
  \ recipes-container 的 `div` 元素中添加一个包含文本 loading 的 `<p>` 元素。添加 `p` 元素后，recipes-container\
  \ 将如下所示：\n\n```\n1.  <div class=\"recipes-container\">\n2.      <p class=\"section-title\"\
  >Recipes</p>\n3.      <div class=\"recipes\"></div>\n4.      <p class=\"loading\"\
  >Loading…</p>\n5.  </div>\n```\n\n代码 10.27：向 recipes-container 添加加载文本\n\n现在，我们需要在等待响应时触发并显示加载文本，并在收到响应时隐藏它。为此，我们可以使用\
  \ `readyState` 属性。在上一章中，我们了解了 `XMLHttpRequest` 对象的 `readyState` 属性。当我们发送 `XMLHttpRequest`\
  \ 对象时，`readyState` 属性的值变为 2。在代码示例 10.8 中，我们使用了 `XMLHttpRequest` 对象的 `onreadystatechange`\
  \ 属性来检查收到响应时的条件，此时 `readyState` 属性的值变为 4。现在，我们将在处理 `onreadystatechange` 属性的函数内部添加另一个条件：\n\
  \n```\n1.  request.onreadystatechange = function() {\n2.      if(this.readyState\
  \ === 2) {\n3.          document.querySelector(\".loading\").style.display = 'block';\n\
  4.      }\n5.      if(this.readyState === 4 && this.status === 200) {\n6.      \
  \    document.querySelector(\".loading\").style.display = 'none';\n7.          createRecipeCards(JSON.parse(this.responseText).meals);\n\
  8.      }\n9.  }\n```\n\n代码 10.28：在 index.js 中添加显示/隐藏逻辑\n\n\n\n在 *代码示例 10.28* 中，我们首先检查\
  \ `readyState` 属性值为 2 时的条件。当满足条件时，我们使用 `document.querySelector(\".loading\")` 获取加载元素，并确保显示文本的元素可见。一旦收到响应，即\
  \ `readyState` 属性值变为 4 时，我们将再次获取该元素（如第 6 行所示）并将其隐藏。\n\n保存上述代码并刷新网页后，根据你的网络速度，你会短暂看到加载文本，然后它消失，食谱显示出来：\n\
  \n![](img/Figure-10.21.jpg)\n\n**图 10.21：** 主页上显示的加载文本。\n\n类似地，让我们对食谱详情页面进行相同的修改。在\
  \ `recipe-details-container` 元素内添加加载图标。接下来，在 `recipe-detail.js` 中添加隐藏/显示逻辑。同时，修改网页标题以包含加载状态：\n\
  \n```\nrequest.onreadystatechange = function() {\n    if(this.readyState === 2)\
  \ {\n        document.querySelector(\".loading\").style.display = \"block\";\n \
  \       document.title = \"Nom Nom | Loading…\";\n    }\n    if(this.readyState\
  \ === 4 && this.status === 200) {\n        document.querySelector(\".loading\").style.display\
  \ = \"none\";\n        addRecipeDetails(JSON.parse(this.responseText).meals[0]);\n\
  \    }\n}\n```\n\n**代码 10.29：** 在 recipe-detail.js 中添加加载的隐藏/显示逻辑\n\n保存上述代码并刷新网页后，我们将看到以下内容：\n\
  \n![](img/Figure-10.22.jpg)\n\n**图 10.22：** 在 recipe-detail 页面上看到的加载文本（存在错误）\n\n\
  如上图所示，我们还需要隐藏“食材”和“食谱”的标题。首先，我们需要更新类名为 details 的容器的 CSS 属性，添加 `display: none`。这将确保在正常情况下标题保持隐藏。现在，在\
  \ `recipe-detail.js` 中，更新 `onreadystatechange` 属性内的代码：\n\n```\nrequest.onreadystatechange\
  \ = function() {\n    if(this.readyState === 2) {\n        document.querySelector(\"\
  .loading\").style.display = \"block\";\n        document.title = \"Nom Nom | Loading…\"\
  ;\n    }\n    if(this.readyState === 4 && this.status === 200) {\n        document.querySelector(\"\
  .details\").style.display = \"grid\";\n        document.querySelector(\".details\"\
  ).style.gridTemplateColumns = \"30% 70%\";\n        document.querySelector(\".loading\"\
  ).style.display = \"none\";\n        addRecipeDetails(JSON.parse(this.responseText).meals[0]);\n\
  \    }\n}\n```\n\n**代码 10.30：** 更新 recipe-detail.js 以更新详情容器的隐藏/显示\n\n如 *代码示例 10.30*\
  \ 所示，我们现在更新了代码，确保在收到响应时详情容器变为 `display: grid`。保存并刷新页面后，我们将在显示食谱详情之前看到加载图标：\n\n![](img/Figure-10.23.jpg)\n\
  \n**图 10.23：** 在 recipe-detail 页面上看到的加载文本\n\n至此，我们已成功在必要位置添加了加载图标。\n\n# 错误处理\n\n\
  现在，我们的应用程序只剩下处理请求失败时的 UI。如果你通过在 `index.js` 和 `recipe-detail.js` 的 `request.open()`\
  \ 方法中传入的 URL 中添加随机字符来触发请求错误，你会看到食谱无法加载，但页面保持空白。要解决这个问题，我们只需在 HTML 文件中添加错误处理消息，并通过\
  \ `onreadystatechange` 属性控制其显示，就像我们在上一节中所做的那样。\n\n在 `index.html` 和 `recipe-detail.html`\
  \ 中，我们将在 body 标签末尾、导入 JS 文件之前添加以下行：\n\n`<p class=\"error\">哎呀！看起来与服务器的连接失败了！</p>`\n\
  \n**代码 10.31：** 在两个 HTML 文件中添加错误消息。\n\n我们希望确保默认情况下看不到此文本，因此我们在 `common.css` 中添加以下行：\n\
  \n```\n.error {\n    display: none;\n}\n```\n\n**代码 10.32：** 确保错误消息默认保持隐藏\n\n现在，我们需要在\
  \ JS 文件中处理其显示。在两个 JS 文件的 `onreadystatechange` 属性中，我们将在 `readyState === 4` 的 if 条件之后添加以下行：\n\
  \n```\nelse if(this.readyState === 4 && this.status !== 200) {\n    handleNetworkFailure();\n\
  }\n```\n\n**代码 10.33：** 添加回调函数以处理错误\n\n在 *代码示例 10.33* 中，如果状态码不是 200（即响应不成功），我们将调用\
  \ `handleNetworkFailure` 函数。\n\n现在，我们将在两个文件中创建 `handleNetworkFailure` 函数。在 `index.js`\
  \ 中，我们在 `handleNetworkFailure` 函数内编写以下代码：\n\n```\nconst handleNetworkFailure = ()\
  \ => {\n    document.querySelector(\".recipes-container\").style.display = \"none\"\
  ;\n    document.querySelector(\".error\").style.display = \"block\";\n}\n```\n\n\
  **代码 10.34：** 在 index.js 中定义处理错误的回调函数\n\n类似地，在 `recipe-detail.js` 中，我们添加以下代码：\n\n\
  ```\nconst handleNetworkFailure = () => {\n    document.querySelector(\".recipe-details-container\"\
  ).style.display = \"none\";\n    document.querySelector(\".error\").style.display\
  \ = \"block\";\n}\n```\n\n**代码 10.35：** 在 recipe-detail.js 中定义处理错误的回调函数\n\n最后，在请求失败时，我们的网页可能会显示如下消息：\n\
  \n![](img/Figure-10.24.jpg)\n\n**图 10.24：** 请求失败时的错误消息\n\n至此，我们终于完成了实时应用程序 *Nom\
  \ Nom* 的开发！\n\n你可以在以下网址查看网站 - **[`rushabhshah1993.github.io/nomnom/`](https://rushabhshah1993.github.io/nomnom/)**\n\
