- "# JavaScript 解码指南：针对不那么简单的 JavaScript 概念、库、工具和框架的简单指南（英文版）\n\n# 献给我的\n\n*穆拉杰·D·沙阿\
  \ & 哈尔莎·M·沙阿*\n\n我的父母，感谢你们没有屈服于社会规范，并推动我展翅高飞。\n\n*乌纳蒂·沃拉*\n\n从朋友到成为我的妻子，你一直是我完美的支柱。\n\
  \n*约翰·托马斯*\n\n当我想要一个朋友时，我最终得到了一个兄长和导师。\n\n*苏迪普·罗伊·乔杜里博士*\n\n那位领路人，始终相信我，从未放弃过我。\n\
  \n# 关于作者\n\n**拉什布·穆拉杰·沙阿** 是一位出版过技术著作的作者、技术导师、内容创作者和高级 UI 开发人员。他也是名为 eugenie.ai\
  \ 的令人兴奋的 AI 初创公司的创始成员之一。在超过 5 年的工作经验中，他曾为 Capgemini International、Fractal 和 eugenie.ai\
  \ 等公司工作，并与多个重要客户合作，包括印度海军、Mondelez India、Colgate Palmolive、EY、RB 等。\n\n除了常规工作，拉什布还是一位有影响力的博主和内容撰稿人。他在\
  \ SportsKeeda、Little Black Book (LBB)、NearFox、Zomato 等平台上的文章已获得超过 60 万次浏览。他的个人博客（**[`thevegfoodgasms.blogspot.com/`](http://thevegfoodgasms.blogspot.com/)**）已连续四年获得国家级提名。\n\
  \n# 关于审校者\n\n**维奈·乔希** 拥有 9 年使用 .Net、Java、Node、Azure、GCP、Openshift 等工具以及 C#、Javascript、Java、Typescript、Python\
  \ 等编程语言进行 Web、移动和平台应用开发的经验。他在北阿坎德邦德拉敦的德拉敦理工学院获得了计算机应用硕士学位。他曾就职于 Publicis.Sapient、Next\
  \ Gen Invent Corporation 等公司。目前，他在位于古尔冈的 Optum Global Solutions（联合健康集团旗下）担任技术主管，负责全栈开发。\n\
  \n# 致谢\n\n当我开始写这本书时，发生了一件难以想象的事情。当第一章进入草稿阶段时，整个世界逐渐陷入停滞。新型冠状病毒（COVID-19）迫使世界封锁。空旷的街道伴随着寂静的办公室和安静的公园。在这艰难的时刻，如果没有家人的持续支持，我无法完成这本书。我要感谢我的父母——穆拉杰·D·沙阿、哈尔莎·M·沙阿，以及我的妻子乌纳蒂，感谢他们容忍我深夜写作的恶作剧。\n\
  \n下一个感谢要送给 BPB Publications 的整个团队，感谢他们给我这个绝佳的机会来写这本书，并与大家分享我的经验。\n\n最后，我要感谢约翰·托马斯先生，一位心地善良的真挚朋友，他教会了我最佳实践；还要感谢\
  \ Shweta Doshi 女士和她的 GreyAtom 团队，他们激发了我对教学的热爱。\n\n# 前言\n\n可以公平地说，2020 年将深深烙印在历史书中。2020\
  \ 年，我们快节奏的世界暂停了脚步，将自己封锁起来，踏上了拯救世界的旅程，尽管这与银幕及其超凡英雄所描绘的方式截然不同。这一年也是互联网崭露头角的一年。从救援行动、数据分析、信息服务到封锁中的娱乐，网络及其种类繁多的应用在可能的地方帮助了人类。这不禁让人思考网络及其有用伙伴的重要性。\n\
  \n这本书是关于 Web 开发的。它是关于释放 JavaScript 的魔力，这是一种相当直接的脚本语言，可以帮助你在互联网上创建令人难以置信的下一代应用程序。\n\
  \n简单来说，Web 开发是创建和维护网站及 Web 应用程序的过程。整个 Web 开发理念围绕以下三个简单问题展开：\n\n1.  用户在屏幕上能看到什么？\n\
  2.  它看起来怎么样？\n3.  当用户与屏幕上看到的内容交互时会发生什么？\n\n虽然前两个问题的答案创建了一个用户只能看到但不能交互的网页，但第三个问题的答案才让网页变得生动起来。解决这三个问题的三种技术是\
  \ HTML、CSS 和 JavaScript。在这本书中，我们不仅会探索，还会掌握高级 JavaScript。这将帮助你为构建下一代 Web 应用程序打下基础。\n\
  \n**在本书的 16 章中，你将学到以下内容：**\n\n**第 1 章** 将带你进入 JavaScript 的世界。在本章中，我们将复习 JavaScript\
  \ 的基本概念。我们将讨论 JavaScript 的语法、数据类型、运算符、条件语句、循环和提升等主题。我们还将看到某些高级 JavaScript 概念的变体。\n\
  \n**第 2 章** 将帮助你探索 Google Chrome 中便捷的 Chrome 开发者工具。通常，你为 Web 应用程序编写的每一段代码都应该是浏览器无关的，即它应该是通用的，而不是针对任何特定浏览器。然而，基于流行度和简单性，我们将使用\
  \ Google Chrome 浏览器。\n\n**第 3 章** 将教你关于函数的一切。我们将讨论何时以及为何使用函数、函数的类型、作用域和闭包等主题。\n\n\
  **第 4 章** 将帮助你复习数组的概念。同时，我们还将了解你日常会使用的几个重要的数组内置方法。\n\n**第 5 章** 将帮助你学习关于对象的一切。我们将讨论对象的属性和方法、构造函数、原型以及何时使用对象等主题。\n\
  \n\n\n\n\n**第 6 章** 将向你介绍 ECMAScript 2015，通常称为 ES6。ES6 重振了 JavaScript，并巩固了其作为开发\
  \ Web 应用程序的顶级标准语言的地位。在本章中，我们将探索并学习 ES6 引入的多个概念，包括但不限于 let 和 const、箭头函数、新的数组方法、模块、解构等。\n\
  \n**第 7 章** 探讨了 ES6 引入的一个概念——类。在这里，我们将学习类的必要性、如何编写类以及如何处理继承。\n\n**第 8 章** 将开启“连接服务器”这一部分。在本章中，我们首先会理解异步\
  \ JavaScript 的概念。它将教会我们如何在服务器响应浏览器发送的请求时恢复 JavaScript 的执行。之后，我们将学习回调函数和 Promise——实现异步\
  \ JavaScript 的两种方法。\n\n**第 9 章** 将带领我们踏上使用 AJAX 原理连接实时服务器的旅程。我们还将了解 JSON，这是 Web\
  \ 上传输数据的通用格式。\n\n**第 10 章** 将让你初步体验使用我们迄今学到的概念创建实时应用程序。我们将创建一个 JavaScript Web 应用程序，它可以托管在任何服务器上供全世界查看。我们将遵循传统的\
  \ SDLC 方法来创建此应用程序。\n\n**第 11 章** 将解释在浏览器上存储数据的概念。\n\n**第 12 章** 将教你如何调试崩溃或执行错误的应用程序。在本章中，我们还将学习如何处理错误。\n\
  \n**第 13 章** 将帮助你认识到经常测试 JavaScript 代码的重要性。我们将介绍几个测试框架，并使用其中一个编写示例代码。\n\n**第 14\
  \ 章** 将教你一个重要的概念——正则表达式。它主要用于搜索字符串和模式。然而，它不仅对 JavaScript，而且对多种编程语言都具有更深远的意义。\n\n\
  **第 15 章** 探讨了 ES6 之后的发展。ES6 彻底改变了 JavaScript，使其成为 Web 开发中最流行的语言。然而，ES6 之后的几个版本将这门语言提升到了另一个水平。我们将介绍从\
  \ ES6 到 ES11 的所有版本。\n\n**第 16 章** 是本书的最后一章。在这里，我们将简单介绍一些领先产品公司（如 Google、Facebook、Twitter\
  \ 等）遵循的最佳实践。我们还将介绍一些技巧和窍门，让开发者的工作更轻松。\n\n# 如何使用本书？\n\n**本书包含七个部分。**\n\n**前三个部分——**\
  \ 基础、函数与对象、以及 ES6，将用基础与高级 JavaScript 的基本概念更新你的知识库。众所周知，每一座坚固的建筑都需要坚实的基础。前三个部分将帮助你为高级主题奠定基础。\n\
  \n**接下来的两个部分——** 连接服务器与 Web 存储，将带你踏上你经常要走的旅程。在这里，你将学习如何与服务器交互以创建下一代 Web 应用程序。在学习这些酷炫概念的过程中，我们将一起创建一个实时\
  \ Web 应用程序。这将让你体验真实 Web 开发的感觉。\n\n**第六部分——** 调试与测试，将专门解释测试代码的重要性。它还将教你如何处理代码中的错误。\n\
  \n最后一部分包括正则表达式、ECMAScript 版本（JavaScript 采用的脚本标准）以及技巧与窍门等额外主题。这一部分将提高你的编码技能，以适应不断变化的世界。\n\
  \n正如我们之前提到的，在本书的过程中，我们将使用真实的服务器创建一个实时项目。它将帮助你将所有学到的知识整合到一个实际应用程序中。最终结果可以用于你的个人简介和简历。我们还将帮助你将自己的代码发布到公共平台上供全世界查看。每章末尾都会有测试你对本章知识掌握程度的问题。等宽字体书写的文本代表代码。强烈建议你在本地机器上练习这些代码。\n\
