    the `<head>` and `</head>` tags), or sometimes in the page body (that is, between
    the `<body>` and `</body>` tags). You then write your code between the `<script>`
    and `</script>` tags.


    Putting a script inside the page in this way isn''t a problem if the script is
    relatively short. However, if your script (or scripts) take dozens or hundreds
    of lines, if your HTML code can look clut-

    -tered. Another problem you may run into is needing to use the same code on multiple
    pages. Sure, you can copy the code into each page that requires it, but if you
    make changes down the road, you need to update every page that uses the code.


    The solution to both problems is to move the code out of the HTML file and into
    an external JavaScript file. Moving the code reduces the JavaScript presence in
    the HTML file to a single line (as you''ll learn shortly) and means that you can
