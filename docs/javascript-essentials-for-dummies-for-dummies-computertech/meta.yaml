    \ 164\n\n# INDEX.........................................................................................................\
    \ 165\n\n## Introduction\n\nHTML and CSS are awesome technologies, and you can\
    \ use them to create pages that look amazing. But after you funnel your page to\
    \ your web server and look at it a few (dozen) times, you may notice a subtle\
    \ feeling of disappointment creeping in. Why? It can be hard to pin down, but\
    \ that stuff comes from a stark fact: Your web page just contains kinds of sites.\n\
    \nThere, you probably have a link or three to it, but most likely those links\
    \ just take you to more of your pages that just kind of sit there. Or maybe a\
    \ link takes you to another site altogether, one that feels dynamic and alive\
    \ and interactive. Ah, engagement! Ooh, excitement!\n\nWhat’s the difference between\
    \ a page that does nothing and a page that seems to be always dancing? One word:\
    \ JavaScript. If you want your pages to be dynamic and interactive, you need a\
    \ bit of behind-the-scenes JavaScript to make it.\n\n“But,” I hear you object,\
    \ “HTML isn’t that hard to learn. JavaScript is a programming language, for crying\
    \ out!” I hear you. It’s true that anyone can learn HTML as long as they start\
    \ with the basic tags, examine lots of examples of how they work, and slowly work\
    \ their way up to more complex pages. It’s just a matter of creating a solid foundation\
    \ and building on it.\n\nI’m convinced that JavaScript can be approached in much\
    \ the same way. I’m certainly not going to tell you that JavaScript is as easy\
    \ to learn as HTML. That would be a bad-faced lie. However, I will tell you that\
    \ there is nothing inherently about JavaScript. I believe that if you begin with\
    \ the basic syntax and rules, study tons of examples of how they work, and slowly\
    \ build up to more complex scripts, you can learn JavaScript programming. I predict\
    \ here and now that by the time you finish this book, you’ll even be a little\
    \ amazed at yourself and at what you can do.\n\n## About This Book\n\nWelcome,\
    \ then, to JavaScript Essentials For Dummies. This book gives you a solid education\
    \ on the standard programming language underlying the World Wide Web. You learn\
    \ how to set up the tools you need and, given any web pages you have (or some\
    \ else has) built with HTML and CSS, you learn how to use JavaScript to program\
    \ those pages. My goal is to show you that a sprinkling of JavaScript magic to\
    \ a page isn't hard to learn, and that even the green rookie programmer can learn\
    \ to create dynamic and interactive web pages that will amaze their family and\
    \ friends (and themselves).\n\nIf you're looking for lots of programming history,\
    \ computer science theory, and long-winded explanations of concepts, I'm sorry,\
    \ you won't find it here. My philosophy throughout this book comes from Linus\
    \ Torvalds, the creator of the Linux operating system: “Talk is cheap. Show me\
    \ the code.” I explain what needs to be explained and built with (at all) to examples\
    \ and scripts that do more to (or, most of the time, without any ado) to illuminate\
    \ a concept that any verbose explanations I could muster (and believe me, I can\
    \ muster verbosity with the best of them).\n\n## Foolish Assumptions\n\nThis book\
    \ is not a primer on the internet or on using the World Wide Web. This is a book\
    \ on coding web pages, pure and simple. This means I assume the following:\n\n\
    - You know how to operate a basic text editor, and how to get around the operating\
    \ system and file system on your computer.\n- You have an internet connection.\n\
    - You know how to use your web browser.\n- You know the basics of HTML and CSS.\n\
    \nYep, that’s it.\n\n## Icons Used in This Book\n\nThis icon points out juicy\
    \ tidbits that are likely to be repeated to you — so please don't forget them.\n\
    \nThink of these icons as the fodder of advice columns. They offer (hopefully)\
    \ advice or a bit more information about a topic under discussion.\n\nLook out!\
    \ In this book, you see this icon when I’m trying to help you avoid mistakes that\
    \ can cost you time, money, or embarrassment.\n\n## Where to Go From Here\n\n\
    How you approach this book depends on your current level of coding and/or JavaScript\
    \ expertise (or lack thereof):\n\n- If you've never programmed before, begin at\
    \ the beginning with Chapter 1 and work at your own pace sequentially through\
    \ Chapters 2, 3, 4, and 5. This will give you all the knowledge you need to pick\
    \ and choose what you want to learn throughout the rest of the book.\n\n- If you've\
    \ done some non-JavaScript programming, start with Chapter 1, skim through Chapters\
    \ 2 through 5 to see how JavaScript does the standard programming tasks, and then\
    \ pick and choose your topics from there.\n\n- If you've done some JavaScript\
    \ coding already, I suggest working quickly through the material in Chapters 2\
    \ through 5, and then diving into the all-important material on the Document Object\
    \ Model in Chapter 6. From there, you can peruse the rest of the chapters as you\
    \ see fit.\n\n## Chapter 1 JavaScript: The Big Picture\n\nIn this chapter, you\
    \ explore some useful JavaScript basics. Don’t worry if you've never programmed\
    \ before. I take you through everything you need to know, step-by-step, nice and\
    \ easy. As you are about to find out, it is really fun to program.\n\n## Adding\
    \ JavaScript Code to a Web Page\n\nOkay, it’s time to roll up your sleeves, crack\
    \ your knuckles, and start coding. This section describes the standard procedure\
    \ for constructing and testing a script and takes you through a couple of examples.\n\
    \n### The <script> tag\n\nThe basic container for a script is, naturally enough,\
    \ the HTML <script> tag and its associated </script> tag:\n\n```html\n<script>\n\
    \  JavaScript statements go here\n</script>\n```\n\n- Getting a feel for programming\
    \ in general, and JavaScript in particular\n- Checking out the tools you need\
    \ to get\n- Adding comments to your JavaScript\n- Storing your code in a separate\
    \ file\n\n### Where do you put the <script> tag?\n\nWith certain exceptions, it\
    \ doesn't matter a great deal where you put your <script> tag. Some people place\
    \ the tag between the page's </head> and <body> tags. The HTML standard recommends\
    \ placing the <script> tag within the page header (that is, between <head> and\
    \ </head>), so that's the style I use in this book:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Where do you\
    \ put the script tag?</title>\n<script>\n  JavaScript statements go here\n</script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\nHere are the exceptions to the put-script-anywhere\
    \ technique:\n\n- If your script is designed to write data to the page, the <script>\
    \ tag must be positioned within the page body (that is, between the <body> and\
    \ </body> tags) in the exact position where you want the text to appear.\n- If\
    \ your script refers to an item on the page (such as a form object), the script\
    \ must be placed after that item.\n- With many HTML tags, you can add one or more\
    \ JavaScript statements as attributes within the tag.\n\nIt's perfectly acceptable\
    \ to insert multiple <script> tags within a single page, as long as each one has\
    \ a corresponding </script> end tag, and as long as you don't put one <script>\
    \ block within another one."
