  md: '# Getting info about a date


    When your script just coughs up whatever Date you stored in the variable, the
    results aren''t particularly appealing. If you want to display dates in a more
    attractive format, or if you want to perform arithmetic operations on a date,
    you need to go a little deeper into the Date object to extract specific information
    such as the month, year, hour, and so on. You do that by using the Date object
    methods listed in Table 8-4.


    TABLE 8-4 Date Object Methods That Extract Date Values


    | Method Syntax | What It Returns |

    |---|---|

    | date.getFullYear() | The year as a four-digit number (1999, 2000, and so on)
    |

    | date.getMonth() | The month of the year; from 0 (January) to 11 (December) |

    | date.getDate() | The date in the month; from 1 to 31 |

    | date.getDay() | The day of the week; from 0 (Sunday) to 6 (Saturday) |

    | date.getHours() | The hour of the day; from 0 (midnight) to 23 (11:00 PM) |

    | date.getMinutes() | The minute of the hour; from 0 to 59 |

    | date.getSeconds() | The second of the minute; from 0 to 59 |

    | date.getMilliseconds() | The milliseconds of the second; from 0 to 999 |

    | date.getTime() | The milliseconds since January 1, 1970 GMT |


    # Setting the date


    When you perform arithmetic, you often have to change the value of an existing
    Date object. For example, an e-commerce script may have to calculate a date that
    is 90 days from the date a sale occurs. It''s usually easiest to create a Date
    object and then use an expression or literal value to change the year, month,
    or some other component of the date. You do that by using the Date object methods
    listed in Table 8-5.'
