    \ 永远不会为零。\n\n## 使用 if...else 语句进行分支\n\n使用 `if` 语句进行决策为你的 JavaScript 工具箱增加了一把强大的新武器。然而，`if`\
    \ 的简单版本有一个重要的局限性：假的结果只会跳过一个或多个语句；它不会执行自己的任何语句。在很多情况下确实如此，但有时你需要在条件返回 `true` 时运行一组语句，而在结果为\
