    \ this.`;\n```\n\n- **Multiline strings:** String templates are spread over lines:\n\
    \n```javascript\nconst myHeader = `\n<nav class=\"banner\">\n  <h3 class=\"nav-heading\"\
    >Navigation</h3>\n  <ul class=\"nav-links\">\n    <li>Home</li>\n    <li>Away</li>\n\
    \    <li>In Between</li>\n  </ul>\n</nav>`;\n```\n\n# Determining the length of\
    \ a string\n\nThe most basic property of the String object is its length, which\
    \ tells you how many characters are in the string. All characters within the string\
    \ — including spaces and punctuation — counted toward the length.\n\n```\nfunction\
