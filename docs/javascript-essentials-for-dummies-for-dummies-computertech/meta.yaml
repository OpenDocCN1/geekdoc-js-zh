    \n```\nfunction ([arguments]) {\n  JavaScript statements\n}\n```\n\n你可以使用：\n\n\
    ```\n([arguments]) => {\n  JavaScript statements\n}\n```\n\n我所做的只是删除了 `function`\
    \ 关键字，并在参数和大括号之间加上字符。这些字符看起来像箭头（程序员称之为胖箭头），因此这种版本的语法被称为箭头函数。\n\n箭头函数是 ES6 的发明，如果你需要支持非常旧的浏览器（例如\
    \ Internet Explorer 11），就不要使用它们。\n\n例如，这里是之前（“将匿名函数赋值给变量”一节）中的一个匿名函数：\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_81_0.png)\n\
    \n**记住**\n\n70 JavaScript Essentials For Dummies\n\n```javascript// 使用匿名函数声明 tipCost\n\
    const tipCost = function (preTip, tipPercent) {\n  const tipResult = preTip *\
    \ tipPercent;\n  return (tipResult);\n}\n```\n\n你可以使用箭头函数重写这段代码：\n\n```javascript\n\
    // 使用箭头函数声明 tipCost\nconst tipCost = (preTip, tipPercent) => {\n  const tipResult\
    \ = preTip * tipPercent;\n  return (tipResult);\n}\n```\n\n如果你的匿名函数由单个语句组成，你可以利用箭头函数的特性——*隐式返回*（implicit\
    \ return）：\n\n```\n([arguments]) => statement\n```\n\n在这里，JavaScript 假设单语句意味着函数在执行语句后后返回，因此你可以省略大括号和\
    \ `return` 关键字。这是一个示例：\n\n```javascript\n// 使用带有隐式返回的箭头函数声明 tipCost\nconst tipCost\
    \ = (preTip, tipPercent) => preTip * tipPercent;\n```\n\n同样，这里是上一节中的一个匿名回调函数：\n\
    \n```javascript\ndocument.getElementById('bgRed').addEventListener(\n  'click',\n\
    \  function() {\n    document.body.backgroundColor=\n    'red';\n  }\n);\n```\n\
    \n你可以如下所示重写这段代码，使用带有隐式返回的箭头函数：\n\n```javascript\ndocument.getElementById('bgRed').addEventListener(\n\
    \  'click',\n  () => document.body.style.backgroundColor= 'red'\n);\n```\n"
