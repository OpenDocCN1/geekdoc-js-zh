  md: "Wouldn't it be more efficient if you put these two statements just once in\
    \ the code and then somehow get JavaScript to repeat these statements as many\
    \ times as necessary?\n\nWhy, yes, and the good news is that not only is it possible\
    \ to do this, but JavaScript also gives you a number of different methods to perform\
    \ this so-called looping. I spend the rest of the chapter investigating each of\
    \ these methods.\n\n# Working with while Loops\n\nThe most straightforward of\
    \ the JavaScript loop constructions is the while loop, which uses the following\
    \ syntax:\n\n```\nwhile (expression) {\n  statements\n}\n```\n\nHere, *expression*\
    \ is a comparison or logical expression (that is, an expression that returns *true*\
    \ or *false*) that, as long as it returns *true*, tells JavaScript to keep executing\
    \ the *statements* within the block.\n\nEssentially\n\nHere's a closer look at\
    \ how a *while* loop works:\n\n+   1. Evaluate the *expression* in the while statement.\n\
    2. If *expression* is true, continue with Step 3; if *expression* is false, skip\
    \ to Step 5.\n3. Execute each of the statements in the block.\n4. Return to Step\
    \ 1.\n5. Exit the loop (that is, execute the next statement that occurs after\
    \ the while block)."
