  md: "# Determining the length of a string\n\nThe most basic property of a String\
    \ object is its length, which tells you how many characters are in the string:\n\
    \n```\nstring.length\n```\n\nAll characters within the string — including spaces\
    \ and punctuation marks — counted toward the length. The only exceptions are escape\
    \ sequences (such as \\n), which always count as one character. The following\
    \ code grabs the length property value for various String object types.\n\n```\n\
    function myFunction() {\n  return \"filename.htm\";\n}\nconst bookName = \"JavaScript\
    \ Essentials For Dummies\";\n\nlength1 = myFunction().length; // Returns 12\n\
    length2 = bookName.length; // Returns 37\nlength3 = \"123\\n5678\".length; //\
    \ Returns 8\n```\n\nWhat the String object lacks in properties, it more than makes\
    \ up for methods. There are dozens, and they enable your code to perform many\
    \ useful tasks, from converting between uppercase and lowercase letters, finding\
    \ text within a string, extracting parts of a string.\n\n# Searching for substrings\n\
    \nA substring is a portion of an existing string. For example, substrings of the\
    \ string \"JavaScript\" would be \"Java\", \"Script\", \"vaSc\", and \"v\". When\
    \ working with strings in your scripts, you'll often have to determine whether\
    \ a given string contains a substring. For example, if you're validating a user's\
    \ email address, you should check that it contains an @ symbol.\n\nTable 8-1 lists\
    \ the several String object methods that find substrings within a larger string."
