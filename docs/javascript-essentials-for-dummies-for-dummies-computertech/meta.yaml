    If your code needs to work with the parent of a child element, use the child element''s
    `parentNode` property:


    ```

    child.parentNode

    ```


    **Note:** *child* is the child element.


    For example, suppose you want to work with the parent element of the `h1` element
    from the HTML example at the beginning of this section. Here''s some code that''ll
    do the job:


    ```

    const childElement = document.querySelector("h1");

    const parentElement = childElement.parentNode;

    ```


    # # Getting the siblings of an element


    A parent''s child nodes appear in the DOM in the same order in which they appear
    in the HTML code, which means the siblings also appear in the order they appear
    in the HTML. Therefore, for a given child element, there are two sibling possibilities:


    +   **Previous sibling:** This is the sibling that appears in the DOM immediately
    before the child element you''re working with. If the child element is the first
    sibling, it will have no previous sibling.'
  - '[PAGE 99]


    +   Next sibling: This is the sibling that appears in the DOM immediately after
    the child element you''re working with. If the child element is the last sibling,
    it will have no next sibling.


    # Getting the previous sibling


    To return the previous sibling of a particular element, use the previousElementSibling
    property:


    ```

    element.previousElementSibling

    ```


    Note: element is the element you''re working with.


    For example, the following statement stores the previous sibling of the main element
    in a variable:


    ```

    const currElement = document;

    querySelector("main");

    const prevSib = currElement.

    previousElementSibling;

    ```


    # Getting the next sibling


    To return the next sibling of a particular element, use the nextElementSibling
    property:


    ```

    element.nextElementSibling

    ```


    Note: element is the element you''re working with.


    For example, the following statement stores the next sibling of the header element
    in a variable:


    ```

