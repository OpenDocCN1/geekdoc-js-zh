    # # Dealing with Dates and Times


    Dates and times seem like the kind of things that ought to be straightforward
    programming propositions. After all, there are 12 months in a year, 28 to 31 days
    in a month, seven days in a week, 24 hours in a day, 60 minutes in an hour, and
    60 seconds in a minute. Surely something set in stone couldn''t get even the least
    weird, could it?


    You''d be surprised. Dates and times can get strange, but they get much easier
    to deal with if you always keep three crucial points in mind:


    +   - JavaScript time is measured in milliseconds, or thousands of a second. More
    specifically, JavaScript measures time by counting the number of milliseconds
    between January 1, 1970 and the date and time in question. So, for example, you
    might come across the date January 1, 2001, and think, "Ah, yes, the start of
    the new millennium." JavaScript, however, comes across that date and thinks "97822080000."


    +   - In the JavaScript world, time began on January 1, 1970, at midnight Greenwich
    Mean Time. Dates before that have negative values in milliseconds.'
