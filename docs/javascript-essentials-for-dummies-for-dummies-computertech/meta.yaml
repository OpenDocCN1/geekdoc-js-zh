    # Toggling a class


    The classList object offers the toggle() method, which toggles a class on and
    off an element. That is, it checks the element for the specified class; if the
    class is there, JavaScript removes it; if the class isn''t there, JavaScript adds
    it. Sweet! Here''s the syntax:


    ```

    element.classList.toggle(class)

    ```


    Here''s what the various parts are:


    +   - element: The element you''re working with

    - class: A string representing the name of the class you want to toggle for


    Here''s an example:


    ```

    document.getElementById(''my-div'').classList.toggle(''my-class'');

    ```


    # Using Code to Tweak HTML Attributes


    One of the key features of the DOM is that each tag on the page becomes an element
    object. You may be wondering, do these elements have any properties? Yep, they
    have tons. In particular, if the tag included one or more attributes, those attributes
    become properties of the element object.


    For example, consider the following <img> tag:


    ```

    <img id="header-image"

    src="mangosteen.png"

    alt="Drawing of a mangosteen">

    ```


    This tag has three attributes: id, src, and alt. In the DOM''s representation
    of the <img> tag, these attributes become properties of the img element object.
    Here''s some JavaScript code that references the img element:


    ```

    const headerImage = document.

    getElementById("header-image");

    ```'
