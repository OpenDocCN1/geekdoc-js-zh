    \n要获取选项的文本（即在列表中显示的文本），请使用选项对象的 `text` 属性：\n\n```javascript\ndocument.querySelector(list).options[2].text\n\
    ```\n\n## 获取被选中的列表选项\n\n如果你的代码需要知道选择列表中的特定选项是否被选中或取消选中，请检查选项的 `selected` 属性，如下所示：\n\
    \n```javascript\noption.selected\n```\n\n如果选项被选中，`selected` 属性返回 `true`；如果未选中，则返回\
