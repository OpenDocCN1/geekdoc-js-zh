    \ script displays the document.location property in a console message.\n\nBecause\
    \ the property always contains a value, you're free to use property expressions\
    \ in just any type of JavaScript statement and as an operand in a JavaScript expression.\
    \ For example, the following statement assigns the current value of the `document.location`\
    \ property to a variable named `currentUrl`:\n\n```\nconst currentUrl = document.location;\n\
    ```\n\nSimilarly, the following statement includes `document.location` as part\
    \ of a string expression:\n\n```\nconst message = \"The current address is \"\
    \ + \ndocument.location + \" \".\"\";\n```\n\nSome properties are “read only,”\
    \ which means your code can only read the current value and can't change it. However,\
    \ many properties are “read/write,” which means you can also change their values.\
    \ To change the value of a property, use the following generic syntax:\n\n```\n\
    object.property = value\n```\n\nHere's what the various parts are:\n\n+   - **object:**\
    \ The object that has the property\n- **property:** The name of the property you\
    \ want to change\n- **value:** A literal value (such as a string or number) or\
    \ an expression that returns the value to which you want to set the property"
