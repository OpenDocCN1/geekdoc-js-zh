    # Using variables in statements


    With your variable declared and assigned a value, you can then use that variable
    in other statements. When the browser comes across the variable, it goes to the
    computer''s memory, retrieves the current value of the variable, and then substitutes
    that value into the statement. The following code presents an example:


    ```

    let interestRate = 0.06;

    interestRate = interestRate / 12;

    document.write(interestRate);

    ```


    This code declares a variable interestRate with the value 0.06; it divides that
    value by 12 and stores the result in the variable. The document.write() statement
    displays the current value of the variable, as shown in Figure 2-1.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_33_0.png)


    FIGURE 2-1: The browser substituting the current value of a variable.


    The following code shows a slightly different example:


    ```

    let firstName;

    firstName = prompt("Please tell me your first name");

    document.write("Welcome to my website, " + firstName);

    ```


    This script uses the prompt() method (explained shortly) to ask the user to enter
    their first name, as shown in Figure 2-2. When the user clicks OK, their name
    is stored in the firstName variable.'
