  md: "That seems reasonable enough, but what if your code requires that the user\
    \ enter at le least one value? The following presents one way to change the code\
    \ to ensure that the loop is executed at least once:\n\n```\nlet sum = 0;\nlet\
    \ num = 0;\nwhile (!num === null || sum === 0) {\n    num = prompt(\"Type a number;\"\
    , when you're\ndone, click Cancel:\", 1);\n    sum += Number(num);\n}\ndocument.write(\"\
    The total of your numbers\nis \" + sum);\n```\n\nThe changes here are that the\
    \ code initializes both sum and num as 0. Initializing both to 0 ensures that\
    \ the while expression — num != null || sum === 0 returns the first time through\
    \ the loop, the loop will definitely execute at least once. If the user clicks\
    \ Cancel right away, sum will still be 0, so the while expression — num != null\
    \ || sum === 0 returns true and the loop repeats again.\n\nThis approach works\
    \ fine, but you can also turn to JavaScript's third loop type, which specializes\
    \ in just this kind of situation. It's called a do...while loop, and its general\
    \ syntax looks like this:\n\n```\ndo {\n    statements\n} while (expression);\n\
    ```\n\nHere, statements represents a block of statements to execute each time\
    \ through the loop, and expression is a comparison or logical expression, as long\
    \ as it returns true, tells JavaScript to keep executing the statements within\
    \ the loop.\n\nThis structure ensures that JavaScript executes the loop's statement\
    \ at least once. Take a closer look at how JavaScript processes a do...while loop:"
