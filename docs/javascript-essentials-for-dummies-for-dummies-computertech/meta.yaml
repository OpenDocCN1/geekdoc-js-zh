    \n```javascript\nconst selectedHairProducts = document.\n  querySelector('#hair-products').selectedOptions;\n\
    \  for (const hairProduct of selectedHairProducts) {\n    console.log(hairProduct.text);\n\
    \  }\n```\n\n## 修改被选中的选项\n\n要将选择列表选项设置为选中或取消选中状态，请将一个布尔表达式赋值给选项对象的 `selected`\
    \ 属性：\n\n```javascript\noption.selected = Boolean\n```\n\n以下是各个部分的含义：\n\n- **option**:\
    \ 你想要修改的选项元素的引用。\n- **Boolean**: 要赋值给选项的布尔值或表达式。使用 `true` 选中选项；使用 `false` 取消选中。\n\
    \n使用上一节中的 HTML 代码，以下语句选中了列表中的第三个选项：\n\n```javascript\ndocument.querySelector('#hair-products').\n\
    \  options[2].selected = true;\n```\n\n你可以通过取消选中所有选项来重置列表。你可以通过将选择列表对象的 `selectedIndex`\
    \ 属性设置为 `-1` 来实现：\n\n```javascript\ndocument.querySelector('#hair-products').\n\
    selectedIndex = -1\n```\n\n## 处理表单事件\n\n在不断的点击、输入、制表键和拖拽操作中，Web 表单是真正的事件工厂。幸运的是，你可以忽略大部分这些事件，但有几个确实非常有用，无论是在事件发生时运行代码，还是在你自己触发事件时都很有帮助。\n\
    \n大多数事件都是点击，所以你可以使用 JavaScript 的 `addEventListener()` 方法设置点击事件处理程序来处理它们（我将在第 6\
    \ 章中介绍）。这是一个示例：\n\nHTML:\n\n```html\n<form>\n  <label for=\"user\">Username:</label>\n\
    \  <input id=\"user\" type=\"text\" name=\"username\">\n  <label for=\"pwd\">Password:</label>\n\
    \  <input id=\"pwd\" type=\"password\">\n</form>\n```\n\nJavaScript:\n\n```javascript\n\
    document.querySelector('form').\n  addEventListener('click', () => {\n    console.log('Thanks\
    \ for clicking the form!');\n  });\n```\n\n这个示例列出了针对字段点击的监听器。\n\n### 设置焦点\n\n\
    与其说取消焦点，你可能想监控特定字段何时获得焦点（例如，通过用户点击该字段）。你可以通过设置焦点处理程序来监控这一点：\n\n```javascript\n\
    field.addEventListener('focus', () => {\n  // 焦点代码\n});\n```\n\n###这是一个示例：\n\n\
    ```javascript\ndocument.querySelector('#user').\naddEventListener('focus', ()\
    \ => {\n  console.log('用户名字段获得了焦点');\n});\n```\n\n### 监听 blur 事件\n\n设置焦点的反面是失去焦点，即移除元素的焦点。你可以通过对元素运行\
    \ `blur()` 方法来使其失去焦点：\n\n```javascript\nfield.blur()\n```\n\n然而，与其说让元素失去焦点，你更可能想在特定元素失去焦点时运行某些代码（例如，通过用户点击字段外区域）。你可以通过设置\
    \ `blur()` 事件处理程序来监控特定元素：\n\n```javascript\nfield.addEventListener('blur', ()\
    \ => {\n  // blur 的代码\n});\n```\n\n这是一个示例：\n\n```javascript\ndocument.querySelector('#user').\n\
    addEventListener('blur', () => {\n  console.log('用户名字段不再拥有焦点！');\n});\n```\n\n\
    监听元素的变化取决于元素类型：\n\n- 对于 `textarea` 元素和各种文本相关的输入元素，change 事件在元素失去焦点时触发。\n- 对于复选框、单选按钮、选择列表、选择器，change\
    \ 事件在用户点击元素以修改选择或值时立即触发。\n\n- 你通过设置 `change()` 事件处理程序来监听字段的 change 事件：\n\n```javascript\n\
    field.addEventListener('change', () => {\n  // change 的代码\n});\n```\n\n这是一个示例：\n\
    \nHTML:\n\n```html\n<label for=\"bgcolor\">选择背景颜色</label>\n<input id=\"bgcolor\"\
    \ type=\"color\" name=\"bg-color\" value=\"#ffffff\">\n```\n\nJavaScript:\n\n\
    ```javascript\ndocument.querySelector('#bgcolor').\naddEventListener('change',\
    \ (event) => {\n  const backgroundColor = event.target.value;\n  document.body.backgroundColor\
    \ = backgroundColor;\n});\n```\n"
