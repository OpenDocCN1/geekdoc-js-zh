  md: '# Understanding escape sequences


    What if you must include, say, a double quotation mark within a string''s enclosed
    by double quotation marks? Having to nest the same type of quotation mark is rare,
    but it is possible if you precede the double quotation mark with a backslash (\),
    like this:


    ```

    "The double quotation mark (\") encloses this string.";

    ```


    The \" combination is called an escape sequence. You can combine the backslash
    with a number of other characters to form other escape sequences, and each one
    enables the browser to present a character that, by itself, would be illegal or
    not represent otherwise. Table 2-1 lists the most commonly used escape sequences.


    # TABLE 2-1 Common JavaScript Escape Sequences


    | Escape Sequence | Character It Represents |

    |---|---|

    |\'' | Single quotation mark |

    |\" | Double quotation mark |

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \t | Tab |

    | \\ | Backslash |


    The following code shows an example script that uses the \n escape sequence to
    display text on multiple lines with an alert box.


    ```

    alert("This is line 1.\nSo what. This is line 2.");

    ```


    Figure 2-4 shows the result.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '![](img/e1fc091e438a5ffb052e3126ba2bbd1f_41_0.png)


    **FIGURE 2-4:** Using the \n escape sequence enables you to format text that it
    displays on different lines.


    To learn how to combine two or more string literals, check out Chapter 3. Also,
    JavaScript has a nice collection of string manipulation features, which I Discuss
    in Chapter 8.


    # # Working with Boolean literals


    Booleans are the simplest of all the literal data types because they can assume
    only one of two values: true or false. That simplicity may make it seem as though
    Booleans aren''t particularly useful, but the capability to test whether a particular
    variable or condition is true or false is invaluable in JavaScript programming.


    You can assign Boolean literals directly to a variable, like this:


    ```

    taskCompleted = true;

    ```


    Alternatively, you can work with Boolean values implicitly in expressions:


    ```

    currentMonth === "August"

    ```


    The comparison expression currentMonth === "August" asks the following: Does the
    value of the currentMonth variable equal the string "August"? If it does, the
    expression evaluates to the Boolean value true; if it doesn''t, the expression
    evaluates to false. I discuss much more about comparison expressions in Chapter
    3.'
