- md: "# Listening for Page Events\n\nIn web development, an event is an action that\
    \ occurs in response to some external stimulus. A common type of external stimulus\
    \ is when a user interacts with a web page. Here are some examples:\n\n- Surfing\
    \ to or reloading the page\n- Clicking a button\n- Pressing a key\n- Scrolling\
    \ to the page\n\nWhy don’t web pages respond to events automatically? Why do they\
    \ just sit there? Because web pages are static by default, meaning that they ignore\
    \ the events that are firing around them. Your job as a web developer is to change\
    \ that behavior by making your web pages “listen” for particular events to occur.\
    \ You do that by setting up special chunks of code called event handlers. An event\
    \ handler consists of two parts:\n\n- Event listener: An instruction to the web\
    \ browser to watch out (“listen”) for a particular event occurring on a particular\
    \ element.\n- Callback function: The code that the web browser executes when it\
    \ detects the event has occurred.\n\nYou configure your code to listen for and\
    \ react to an event by setting up an event handler using the element object’s\
    \ addEventListener() method. Here’s the syntax:\n\n```\nelement.addEventListener(event,\
    \ callback);\n```\n\nHere’s what the various parts are:\n\n- element: The web\
    \ page element to be monitored for the event. The event is said to be bound to\
    \ the element.\n- event: A string specifying the name of the event you want the\
    \ browser to listen for. For the main events I mention in the previous section,\
    \ use one of the following, enclosed in quotation marks: DOMContentLoaded, click,\
    \ dblclick, mouseover, keypress, focus, blur, change, submit, scroll, or resize.\n\
    - callback: The callback function that JavaScript executes when the event occurs.\
    \ The callback can be an anonymous function or a reference to a named function.\n\
    \nHere's an example:\n\nHTML:\n\n```\n<div id=\"my-div\"></div>\n<button id=\"\
    my-button\">Click to add some text,\nabove</button>\n```\n\nJavaScript:\n\n```javascript\n\
    const myBuilder = document.\ngetElementById('my-button');\nmyButton.addEventListener('click',\
    \ function() {\n  const myDiv = document.\ngetElementById('my-div');\n  myDiv.innerHTML\
    \ = '<h1>Hello Click World!</h1>';\n});\n```\n\nThe HTML sets up an empty div\
    \ element and a button element. The JavaScript code attaches a click listener\
    \ to the button, and the callback function adds the HTML string <h1>Hello Click\
    \ World!</h1> to the div. Figure 6-6 shows the resulting page after the button\
    \ has been clicked.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_112_0.png)\n\n\
    FIGURE 6-6: The click event callback function adds some HTML and text to the div\
    \ element.\n\nIf you want to run some code after the web page document has loaded,\
    \ add an event handler to the document object that listens for the DOMContentLoaded\
    \ event:\n\n```javascript\ndocument.addEventListener('DOMContentLoaded',\nfunction()\
    \ {\n  console.log('We are loaded!');\n});\n```\n\nWhen an event fires, the DOM\
    \ creates an Event object, the properties of which contain info about the event,\
    \ including the following:\n\n- **target**: the web page element to which the\
    \ event occurred. For example, if you set up a click handler for a div element,\
    \ that div is the target of the click.\n- **which**: a numeric code that specifies\
    \ the key that was pressed during a keypress event.\n- **pageX**: the distance\
    \ (in pixels) that the mouse pointer from the left edge of the browser's content\
    \ area when the event fired.\n- **pageY**: the distance (in pixels) that the mouse\
    \ pointer from the top edge of the browser's content area when the event fired.\n\
    - **metaKey**: a Boolean value that equals true if the user had the Windows key\
    \ or the Mac Command key (⌘) held down when the event fired.\n- **shiftKey**:\
    \ a Boolean value that equals true if the user had the Shift key held down when\
    \ the event fired.\n\nTo access these properties, you insert a name for the Event\
    \ object as an argument in your event handler's callback function:\n\n```javascript\n\
    element.addEventListener(event, function(e) {\n  // This code runs when the event\
    \ fires\n});\n```\n\n**Note:** e is a name for the Event object that the DOM generates\
    \ the event. You can use whatever name you want, but most coders use e (although\
    \ evt and event are also common).\n\nFor example, when handling the keypress event,\
    \ you need access to the which property to find out the code for the key you pressed.\
    \ Here's an example page that can help you determine which code value to use:\n\
    \nHTML:\n\n```html\n<div>\n  Type a key:\n</div>\n<input id=\"key-input\" type=\"\
    text\">\n<div>\n  Here's the code of the key you pressed:\n</div>\n<div id=\"\
    key-output\">\n</div>\n```\n\nJavaScript:\n\n```javascript\nconst keyInput = document.\n\
    \  getElementById('key-input');\nkeyInput.addEventListener('keypress', function(e)\
    \ {\n  const keyOutput = document.\n  getElementById('key-output');\n  keyOutput.innerHTML\
    \ = e.which;\n});\n```\n\nThe HTML sets up an <input> tag to accept a keystroke,\
    \ and a <div> tag with id=\"key-output\" to use for the output. The JavaScript\
    \ code adds a keypress event listener to the input element, and when the event\
    \ fires, the callback function writes e.which to the output div. Figure 6-7 shows\
    \ the page in action.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_114_0.png)\n\
    \nFIGURE 6-7: The keypress event callback function uses to write the numeric code\
    \ of the pressed key to the div element.\n\n# Chapter 7\nWorking with Arrays\n\
    \nIn this chapter, you take your coding efficiency to an even higher level by\
    \ exploring one of JavaScript's most important concepts: the array. Arrays are\
    \ important not only because they're extremely efficient and very powerful but\
    \ also after you know how to use them, you'll think of a thousand and one uses\
    \ for them. To make sure you're ready for your new array-filled life, this chapter\
    \ explains what they are and why they're so damn useful, and then explores all\
    \ the fantastic ways arrays can make your coding life easier.\n\n# What Is an\
    \ Array?\n\nIn JavaScript, whenever you have a collection of variables with related\
    \ data, you can group them together into a single variable called an array. You\
    \ can enter as many values as you want into the array.\n\nIn JavaScript, whenever\
    \ you have a collection of variables with related data, you can group them together\
    \ into a single variable called an array. You can enter as many values as you\
    \ want into the array.\n\n# Declaring an Array\n\nIn JavaScript, whenever you\
    \ have a collection of variables with related data, you can group them together\
    \ into a single variable called an array. You can enter as many values as you\
    \ want into the array.\n\n# Populating an Array\n\nAfter your array is declared,\
    \ you can start populating it with the data values you want to store.\n\n# Declaring\
    \ and populating an array at the same time\n\nEarlier, I mentioned that JavaScript\
    \ has two other syntaxes for declaring an array. Both enable you to declare an\
    \ array and populate it with values by using just a single statement."
  mdcn: "\n# 监听页面事件\n\n在 Web 开发中，事件（event）是对某些外部刺激而发生的动作。一种常见的外部刺激是用户与网页的交互。以下是一些示例：\n\
    \n- 浏览到页面或刷新页面\n- 点击按钮\n- 按下按键\n- 滚动到页面\n\n为什么网页不会自动对事件做出响应？它们为什么只是静静地呆在那里？因为网页默认是静态的，这意味着它们会忽略周围发生的事件。作为\
    \ Web 开发人员，你的任务是改变这种行为，通过让你的网页“监听”特定事件的发生。你通过设置称为事件处理器（event handlers）的特殊代码块来实现这一点。事件处理器由两部分组成：\n\
    \n- 事件监听器（Event listener）：告诉 浏览器监视（“监听”）在特定元素上发生的特定事件。\n- 回调函数（Callback function）：当浏览器检测到事件发生时，执行的代码。\n\
    \n你通过使用元素对象的 `addEventListener()` 方法设置事件处理器，来配置代码以监听并响应某个事件。语法如下：\n\n```\nelement.addEventListener(event,\
    \ callback);\n```\n\n以下是各个部分的含义：\n\n- element：要监控事件的网页元素。该事件被称为绑定（bound）到该元素上。\n\
    - event：一个字符串，指定你想让浏览器监听的事件名称。对于我在上一节中提到的主要事件，请使用以下带引号的名称之一：DOMContentLoaded,\
    \ click, dblclick, mouseover, keypress, focus, blur, change, submit, scroll, 或\
    \ resize。\n- callback：JavaScript 在事件发生时执行的回调函数。该回调可以是匿名函数，也可以是已命名函数的引用。\n\n这是一个示例：\n\
    \nHTML:\n\n```\n<div id=\"my-div\"></div>\n<button id=\"my-button\">Click to add\
    \ some text,\nabove</button>\n```\n\nJavaScript:\n\n```javascript\nconst myBuilder\
    \ = document.\ngetElementById('my-button');\nmyButton.addEventListener('click',\
    \ function() {\n  const myDiv = document.\ngetElementById('my-div');\n  myDiv.innerHTML\
    \ = '<h1>Hello Click World!</h1>';\n});\n```\n\nHTML 设置了一个空的 `div` 元素和一个 `button`\
    \ 元素。JavaScript 代码在按钮上附加了一个点击监听器，回调函数将 HTML 字符串 `<h1>Hello Click World!</h1>`\
    \ 添加到 `div` 中。图 6-6 显示了点击按钮后的页面。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_112_0.png)\n\
    \n图 6-6：点击事件回调函数向 `div` 元素添加了一些 HTML 和文本。\n\n如果你想在网页文档加载后运行某些代码，请向 `document`\
    \ 对象添加一个监听 `DOMContentLoaded` 事件的事件处理器：\n\n```javascript\ndocument.addEventListener('DOMContentLoaded',\n\
    function() {\n  console.log('We are loaded!');\n});\n```\n\n当事件触发时，DOM 会创建一个 `Event`\
    \ 对象，其属性包含有关事件的信息，包括：\n\n- **target**：发生事件的网页元素。例如，如果你为一个 `div` 元素设置了点击处理器，那么该\
    \ `div` 就是点击的元素。\n- **which**：一个数字代码，指定在 `keypress` 事件期间按下的按键代码。\n- **pageX**：事件触发时，鼠标指针距离浏览器内容区域左边缘的距离（像素）。\n\
    - **pageY**：事件触发时，鼠标指针距离浏览器内容区域顶边缘的距离（像素）。\n- **metaKey**：一个布尔值，如果用户在事件触发时按住了\
    \ Windows 键或 Mac Command 键 (⌘)，值为 `true`。\n- **shiftKey**：一个布尔值，如果用户在事件触发时按住了\
    \ Shift 键，值为 `true`。\n\n要访问这些属性，你只需将 `Event` 对象的名称作为参数插入事件处理器的回调函数：\n\n```javascript\n\
    element.addEventListener(event, function(e) {\n  // 此代码在事件触发时运行\n});\n```\n\n\
    **注意：** `e` 是 DOM 生成事件对象的名称。你可以使用任何名称，但大多数代码人员使用 `e`（尽管 `evt` 和 `event`也很常见）。\n\
    \n例如，在处理 `keypress` 事件时，你需要访问 `which` 属性来找到你按下的键的代码。这个示例页面可以帮助你确定使用哪种代码值：\n\n\
    HTML:\n\n```html\n<div>\n  Type a key:\n</div>\n<input id=\"key-input\" type=\"\
    text\">\n<div>\n  Here's the code of the key you pressed:\n</div>\n<div id=\"\
    key-output\">\n</div>\n```\n\nJavaScript:\n\n```javascript\nconst keyInput = document.\n\
    \  getElementById('key-input');\nkeyInput.addEventListener('keypress', function(e)\
    \ {\n  const keyOutput = document.\n  getElementById('key-output');\n  keyOutput.innerHTML\
    \ = e.which;\n});\n```\n\nHTML 设置了一个 `<input>` 标签来接收按键，以及一个 `id=\"key-output\"\
    ` 的 `<div>` 标签用于输出。JavaScript 代码在 `input` 元素上添加了 `keypress` 事件监听器，当事件触发时，回调函数将\
    \ `e.which` 写入输出 `div` 中。图 6-7 显示了运行中的页面。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_114_0.png)\n\
    \n图 6-7：keypress 事件回调函数将按键的数字代码写入 `div` 元素。\n"
