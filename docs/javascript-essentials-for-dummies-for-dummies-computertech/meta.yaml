  - "[PAGE 61]\n\nIt's also possible to use for to count down. You do this by using\n\
    the subtraction assignment operator instead of the addition\nassignment operator:\n\
    \n```\nfor (let counter = start; counterExpression;\n  counter -= 1) {\n  statements\n\
    }\n```\n\nIn this case, you must initialize the counter variable to the max-\n\
    imum value you want to use for the loop counter, and use the\ncounterExpression\
    \ to compare the value of counter to the mini-\nmum value you want to use to end\
    \ the loop.\n\nIn the following example, I use a decrementing counter to ask the\n\
    user to rank, in reverse order, their three CSS colors:\n\n```\nfor (let rank\
    \ = 3; rank >= 1; rank -- 1) {\n  let ordinal;\n  let color;\n  switch (rank)\
    \ {\n    case 1:\n      ordinal = \"first\";n    break;\n    case 2:\n      ordinal\
    \ = \"second\";n    break;\n    case 3:\n      ordinal = \"third\";n  }\n  color\
    \ = prompt(\"What is your \" + ordinal + \n\"-favorite CSS color?\", \"\");\n\
    document.write(rank + \" \" + color + \"<br>\");\n}\n```\n\nThe loop runs by decrementing\
    \ the rank variable from 3 down\nto 1. Each iteration of the loop prompts the\
    \ user to type a favorite\nCSS color, and that color is written to the page, with\
    \ the cur-\nrent of rank being used to create a reverse-ordered list, as\nshown\
