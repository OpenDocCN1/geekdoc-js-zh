    # Adding, Modifying, and Removing Elements


    After you''ve got a reference to one or more elements, you can then use code to
    manipulate those elements in various ways, as shown in the next few sections.


    # Adding an element to the page


    One of the most common web development chores is to add elements to a web page
    on the fly. When you add an element, you always specify the parent element to
    which it will be added, and then you decide whether you want the new element added
    to the end or to the beginning of the parent’s children.


    To add an element to the page, you follow three steps:


    +   1. Create an object for the type of element you want to add.

    2. Add the new object from Step 1 as a child element of an element.

    3. Insert some text and tags into the new object from Step 1.


    # Step 1: Creating the element


    For Step 1, you use the document object’s createElement() method:


    ```

    document.createElement(elementName)

    ```


    Note: elementName is a string containing the HTML element name for the type of
    the element you want to create.


    This method creates the element and then returns it, which means you can store
    the new element in a variable. Here’s an example:


    ```

    const newArticle = createElement("article");

    ```'
  - '[PAGE 101]


    # Step 2: Adding the new element as a child


    With your element created, Step 2 is to add it to an existing parent nelement.
    You have four choices:


    +   Append the new element to the end of the parent''s collection of child elements:
    Use the append() method.


    ```

    parent.append(child)

    ```


    Here are the parts of the append() method:


    +   * parent: A reference to the parent element to which the new element will
    be appended.

    * child: A reference to the child element you''re appending. Note that you can
    append multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    +   Prepend the new element to the beginning of the parent''s collection of child
    elements: Use the prepend() method.


    ```

    parent.prepend(child)

    ```


    Here are the parts of the prepend() method:


    +   * parent: A reference to the parent element to which the new element will
    be prepended.

    * child: A reference to the child element you''re prepending. Note that you can
    prepend multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    +   Insert the new element just after an existing child element of the parent:
    Use the after() method.


    ```

    child.after(sibling)

    ```


    Here are the parts of the after() method:


    +   * child: A reference to the child element after which the new element will
    be inserted.

    * sibling: A reference to the new element you''re inserting. Note that you can
    insert multiple elements at the same time by separating each element with a comma.
    The sibling parameter can also be a text string.'
  - '[PAGE 102]


    Insert the new element just before an existing child element of the parent: Use
    the before() method:


    ```

    child.before(sibling)

    ```


    Here are the parts of the before() method:


    +   - child: A reference to the child element before which the new element will
    be inserted.

    - sibling: A reference to the new element you''re inserting. Note that you can
    insert multiple elements at the same time by separating each element with a comma.
    The sibling parameter can also be a text string.


    Here’s an example that creates a new article element and appends it to the main
    element:


