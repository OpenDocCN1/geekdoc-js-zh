    \  }\n```\n\n# Changing the selected option\n\nTo select a selection list option\
    \ to either the selected or deselected state, assign a Boolean expression to the\
    \ option object's selected property:\n\n```\noption.selected = Boolean\n```\n\n\
    Here's what the various parts are:\n\n+   **option**: A reference to the option\
    \ element you want to modify.\n- **Boolean**: The Boolean value or expression\
    \ to assign to the option. Use true to select the option; false to deselect the\
    \ option.\n\nUsing the HTML code from the previous section, the following statement\
