  - "[PAGE 76]\n\n# Getting a Value from a Function\n\nSo far, I've outlined two major\
    \ advantages of using functions:\n\n+   - You can use them to control when code\
    \ is executed.\n- You can use them to consolidate repetitive code into a routine.\n\
    \nThe major benefit that functions bring to the JavaScript table is that you can\
    \ use them to perform calculations and return the result. As an example, here's\
    \ a function that calculates the tip on a restaurant bill:\n\n```\nfunction calculateTip(preTip,\
    \ tipPercent) {\n  const tipResult = preTip * tipPercent;\n  return tipResult;\n\
    }\n\nconst preTipTotal = 100.00;\nconst tipPercentage = 0.15;\nconst tipCost =\
    \ calculateTip(preTipTotal, tipPercentage);\nconst totalBill = preTipTotal + tipCost;\n\
    document.write(\"Your total bill is $\" + totalBill);\n```\n\nThe function named\
    \ calculateTip takes two arguments: preTip is the total of the bill before the\
    \ tip, and tipPercent is the percentage used to calculate the tip. The function\
    \ then declares a variable named tipResult and uses it to store the calculation\
    \ — preTip multiplied by tipPercent. The key for this example is the second line\
    \ of the function:\n\n```\nreturn tipResult;\n```\n\nThe return statement is JavaScript's\
    \ way of sending a value back to the statement that called the function. That\
    \ statement comes after the function:\n\n```\ntipCost = calculateTip(preTipTotal,\
    \ tipPercentage);\n```"
