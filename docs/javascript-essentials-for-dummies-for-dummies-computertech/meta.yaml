  - "[PAGE 165]\n\nYou can reset the list by deselecting all the options. You do that\
    \ by setting the selection list object's selectedIndex property to -1:\n\n```\n\
    document.querySelector('#hair-products').\nselectedIndex = -1\n```\n\n# Working\
    \ with Form Events\n\nWith all the clicking, typing, tabbing, and dragging that\
    \ goes on, web forms are veritable event factories. Fortunately, you can let most\
    \ of these events pass you by, but a few do come in handy, both in running code\
    \ when the event occurs and in triggering the events yourself.\n\nMost events\
    \ are clicks, so you can handle them by setting click event handlers using JavaScript's\
    \ addEventListener() method (which I cover in Chapter 6). Here's an example:\n\
    \nHTML:\n\n```\n<form>\n  <label for=\"user\">Username:</label>\n  <input id=\"\
    user\" type=\"text\" name=\"username\">\n  <label for=\"pwd\">Password:</label>\n\
    \  <input id=\"pwd\" type=\"password\">\n</form>\n```\n\nJavaScript:\n\n```\n\
    document.querySelector('form').\n  addEventListener('click', () => {\n    console.log('Thanks\
    \ for clicking the form!');\n  });\n```\n\nThis example lists listeners for clicks\
    \ on the entire form element, but you can also create click event handlers for\
    \ buttons, input elements, checkboxes, radio buttons, and more."
  - "[PAGE 166]\n\n# Setting the focus\n\nOne simple feature that can improve the\
    \ user experience on your form pages is to set the focus on the first form field\
    \ when your page loads. Setting the focus saves the user from having to make that\
    \ annoying click inside the first field.\n\nnTo get this done, run JavaScript’s\
    \ focus() method on the element you want to have the focus at startup:\n\n```\n\
    field.focus()\n```\n\nHere's an example that sets the focus on the text field\
    \ with id equal to user at startup:\n\nHTML:\n\n```\n<form>\n  <label for=\"user\"\
    >Username: </label>\n  <input id=\"user\" type=\"text\" name=\"username\">\n \
    \ <label for=\"pwd\">Password:</label>\n  <input id=\"pwd\" type=\"password\"\
    \ name=\"password\">\n</form>\n```\n\nJavaScript:\n\n```\ndocument.querySelector('#user').focus();\n\
    ```\n\n# Monitoring the focus event\n\nRather than the focus, you may want to\
    \ monitor when a particular field gets the focus (for example, by the user clicking\
    \ or tabbing into the field). You can monitor that by setting up a focus event\
    \ handler on the field:\n\n```\nfield.addEventListener('focus', () => {\n  Focus\
    \ code goes here\n});\n```"
  - "[PAGE 167]\n\nHere's an example:\n\n```\ndocument.querySelector('#user').\naddEventListener('focus',\
    \ () => {\n  console.log('The username field has the\n  focus!');\n});\n```\n\n\
    # Monitoring the blur event\n\nThe opposite of setting the focus on an element\
    \ is blurring an element, which removes the focus from the element. You blur an\
    \ element by running the blur() method on the element, which causes it to lose\
    \ focus:\n\n```\nfield.blur()\n```\n\nHowever, rather than blur an element, you're\
    \ more likely to want to run some code when a particular element is blurred (for\
    \ example, by the user clicking orabbing out of the field). You can monitor for\
    \ a particular blurred element by setting up a blur() event handler:\n\n```\n\
    field.addEventListener('blur', () => {\n  Blur code goes here\n});\n```\n\nHere's\
    \ an example:\n\n```\ndocument.querySelector('#user').\naddEventListener('blur',\
    \ () => {\n  console.log('The username field no longer has\n  focus!');\n});\n\
    ```\n\n# Listening for element changes\n\nOne of the most useful form events is\
    \ the change event, which fires when the value or state of a field is modified\
    \ in some way. When this event fires depends on the element type:"
  - "[PAGE 168]\n\n+   For a textarea element and the various text-related input elements,\
    \ the change event fires when the element loses its focus.\n\n+   For checkboxes,\
    \ radio buttons, selection lists, pickers, the change event fires as soon as the\
    \ user clicks the element to modify the selection or value.\n\nYou listen for\
    \ a field's change events by setting up a change() event handler:\n\n```\nfield.addEventListener('change',\
    \ () => {\n  Change code goes here\n});\n```\n\nHere's an example:\n\nHTML:\n\n\
    ```\n<label for=\"bgcolor\">Select a background color</label>\n<input id=\"bgcolor\"\
    \ type=\"color\" name=\"bg-color\" value=\"#ffffff\">\n```\n\nJavaScript:\n\n\
    ```\ndocument.querySelector('#bgcolor').\naddEventListener('change', (event) =>\
    \ {\n  const backgroundColor = event.target.value;\n  document.body.backgroundColor\
    \ = backgroundColor;\n});\n```\n\nThe HTML code sets up a color picker. The JavaScript\
    \ applies the change event handler to the color picker. When the change event\
    \ fires on the picker, the code stores the new color value in the backgroundColor\
    \ variable by referencing event.target.value, where event.target refers to the\
    \ element to which the event listener is bound (the color picker, in this case).\
    \ The code then applies that to the body element's backgroundColor property."
- md: "# Handling Form Data\n\nThere's one form event that I didn't cover earlier,\
    \ and it's a big: the `submit` event, which fires when the form data is to be\
    \ sent to the server.\n\nHowever, if your scripts deal with form data only locally\
    \ — that is, you never send the data to a server — then you don't need to bother\
    \ with submitting the form data. Instead, it's more straight-forward to add a\
    \ button to your form and then use that button's `click` event handler to process\
    \ the form data in whatever way you need.\n\nHere's an example:\n\nHTML:\n\n```html\n\
    <form>\n  <fieldset>\n    <legend>\n      Settings\n    </legend>\n    <label\
    \ for=\"background-color\">Select a background color</label>\n    <input id=\"\
    background-color\" type=\"color\" name=\"bg-color\" value=\"#ffffff\">\n    <label\
    \ for=\"text-color\">Select a text color</label>\n    <input id=\"text-color\"\
    \ type=\"color\" name=\"text-color\" value=\"#000000\">\n    <label for=\"font-stack\"\
    >Select a typeface</label>\n    <select id=\"font-stack\">\n      <option value=\"\
    Georgia, Times New Roman, serif\">Serif</option>\n      <option value=\"Verdana,\
    \ Tahoma, sans-serif\">Sans-serif</option>\n      <option value=\"Bradley Hand,\
    \ Brush Script MT, cursive\">Script</option>\n      <option value=\"Luminari,\
    \ Fantasy\">Fantasy</option>\n      <option value=\"Monaco, Courier monospace\"\
    >primary</option>\n    </select>\n    <button>\n      Save Your Settings\n   \
    \ </button>\n  </fieldset>\n</form>\n```\n\nJavaScript:\n\n```javascript\n// Listen\
    \ for changes on the #background-color color picker\ndocument.querySelector('#background-color').\n\
    \  addEventListener('change', function() {\n  const backgroundColor = this.value;\n\
    \  document.body.style.backgroundColor = \n  backgroundColor;\n});\n// Listen\
    \ for changes on the #text-color picker\ndocument.querySelector('#text-color').\n\
    \  addEventListener('change', function() {\n  const textColor = this.value;\n\
    \  document.body.style.color = textColor;\n});\n// Listen for changes on the #font-stack\
    \ selection list\ndocument.querySelector('#font-stack').\n  addEventListener('change',\
    \ function() {\n  const fontStack = this.selectedOptions[0].value;\n  document.body.style.fontFamily\
    \ = fontStack;\n});\n// Listen for the button being clicked\ndocument.querySelector('#button').\n\
    \  addEventListener('click', () => {\n// Store the form data in a JavaScript object\n\
    const userSettings = {\n  backgroundColor: document.\n  querySelector('#background-color').value,\n\
    \  textColor: document.querySelector('#text-color').\n  value,\n  fontStack: document.querySelector('#font-stack').\n\
    \  selectedOptions[0].value\n}\n// Save the settings in local storage\nlocalStorage.setItem('user-settings',\
    \ JSON.stringify(userSettings));\n```\n\nThe HTML sets up a form (check out Figure\
    \ 10-2) to gather some settings — background color, text color, and typeface style\
    \ — well as a button. The JavaScript sets up change handlers for the two color\
    \ pickers and the selection list. Finally, the code listens for click events on\
    \ the button, and the handler stores the data in a JavaScript object and then\
    \ saves the data to local storage.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_171_0.png)\n\
    \nFIGURE 10-2: A form used to gather user settings for the page.\n\n# Chapter\
    \ 11\nTen JavaScript Debugging Strategies\n\nGiven any nontrivial JavaScript code,\
    \ it's a rare (probably nonexistent!) script that runs perfectly the first (or\
    \ even tenth!) time. Script bugs happen to even the most experienced developers,\
    \ so having errors in your code does not mean you're a failure as a coder! All\
    \ it means is that you're a coder.\n\nWhen bugs get into your code, you'll want\
    \ to exterminate them as quickly as you can. This chapter provides you with ten\
    \ debugging strategies that can help.\n\n# Get Thee to Your Dev Tools\n\nAll web\
    \ page debugging begins with a visit to your web browser development tools. In\
    \ every browser, the quickest way to open the dev tools is to right-click a page\
    \ element and then click Inspect. You can also press Ctrl+Shift+I (Windows) or\
    \ Option+Command+I (macOS).\n\n# The Console Is Your Best Debugging Friend\n\n\
    In your code, you can see the current value of a variable or object property by\
    \ outputting that value to the dev tools Console tab:\n\n```javascript\nconsole.log(output);\n\
    ```\n\nReplace `output` with the expression you want to print in the console.\
    \ The output expression can be a text string, a variable, object property, a function\
    \ result, or any combination of these.\n\n# Give Your Code a Break(point)\n\n\
    Pausing your code enables you to see what's going on and to run some commands\
    \ in the console. You have two ways to pause your code mid-execution:\n\n- **Set\
    \ a breakpoint.** In the dev tools, open the file that contains the JavaScript\
    \ code, locate the statement where you want to pause, then click the line number\
    \ to the left of that statement.\n- **Add a debugger statement.** In your JavaScript\
    \ code, on the line just before the statement where you want to pause, add a debugger\
    \ statement.\n\n# Step Through Your Code\n\nOnce you have some JavaScript code\
    \ in break mode, use the dev tools execution controls to step through the code.\
    \ You can step one statement at a time, step over functions, or step into functions.\n\
    \n# Monitor Variable and Object Property Values\n\nEither `console.log()` statements\
    \ to output values to the console or, when your code is in break mode, hover the\
    \ mouse pointer over the variable or object to see its current value in a tooltip.\
    \ You can also create expressions to monitor values.\n\n# Indent Your Code\n\n\
    JavaScript code is immeasurably more readable when you indent the code within\
    \ each statement block. Readable code is that much easier to trace and decipher,\
    \ so your debugging efforts have one less hurdle to negotiate. Indenting each\
    \ statement by two or four spaces is typical.\n\n# Break Down Complex Tasks\n\n\
    Don’t try to solve all your problems at once. If you have a large script or function\
    \ that isn’t working right, test it in small chunks to try to narrow down the\
    \ problem.\n\n# Break Up Long Statements\n\nOne of the most complicated aspects\
    \ of script debugging is making sense out of long statements (especially expressions).\
    \ The Console window can help, but it's usually best to keep statements short\
    \ as possible to get things working more properly.\n\n# Comment Out Statements\n\
    \nIf a particular statement is giving problems, you can temporarily deactivate\
    \ it by placing two slashes (//) at the beginning of the line.\n\n# Use Comments\
    \ To Document Your Scripts\n\nSpeaking of comments, it's a programming truism\
    \ that you can never add enough comments to your code. The more comments you add,\
    \ the easier your scripts will be to debug.\n\n# Index\n\nSYMBOLS\n\n- - (minus\
    \ sign), 27\n- \" (quotation marks)\n- handling internal, 118–120\n- string literals,\
    \ 28\n- onclick attribute, 63\n- single quotation marks and, 63\n- (division operator),\
    \ 20\n- /* (multiline comment), 13–14\n- // (double-slash), 34\n- ; (semicolon),\
    \ 7\n- \\ (backslash), 29\n- _ (underscore), 24\n- ` (back ticks), 119\n- || (OR\
    \ operator), 35\n- + (concatenation sign), 33\n- + (plus sign), 27\n- = (equals\
    \ sign), 19–20\n- => (arrow functions), 70\n- ! (NOT operator), 35\n- && (AND\
    \ operator), 35\n- * (multiplication sign), 32\n- [] (brackets operator), 150\n\
    - {} (braces)\n- if statements and, 40–41\n- as part of function, 56\n\n- anonymous\
    \ functions\nassigning to variables, 67–68\noverview, 66–70\nreplacing function\
    \ call with, 68–70\n- arguments\ndefined, 61\nfor Date object, 124\nfunction,\
    \ 56\nlocation, 93\n- arithmetic assignment operators, 32–33\n- arrays\ndeclaring,\
    \ 106\nelements and, 80\nindex numbers and, 105\niterating\nfind() method, 112–114\n\
    forEach() method, 109–110\nmap() method, 110–111\nreduce() method, 111–112\nlength\
    \ property, 114\nmanipulating, 114–115\nmethods, 114–115\noverview, 105\npoping,\
    \ 106–109\nspecifying elements by class and type\nname, 80\n- arrow functions\
    \ (=>), 70\n- attributes\nHTML, 97–99\n<img> tag, 97\nonclick, 61, 63\nradio button\
    \ state, 147–148\nsingle quotation marks and, 63\nsrc, 15\n\n- add() method, 95\n\
    addEvent.Listener() method, 100\nafter(method), 90\nalert() method, 7–28\nAND\
    \ operator (&&), 35\n\nIndex 165"
  mdcn: "\n# 处理表单数据\n\n我之前漏掉了一个表单事件，它非常重要：`submit` 事件，当表单数据准备发送到服务器时，该事件就会触发。\n\n\
    然而，如果你的脚本仅在本地处理表单数据——也就是说，你从未打算将数据发送到服务器——那么你就不需要费心去提交表单数据了。相反，更直接的方法是在你的表单中添加一个按钮，然后使用该按钮的\
    \ `click` 事件处理器来按你需要的任意处理表单数据。\n\n这里有一个示例：\n\nHTML:\n\n```html\n<form>\n  <fieldset>\n\
    \    <legend>\n      设置\n    </legend>\n    <label for=\"background-color\">选择背景颜色</label>\n\
    \    <input id=\"background-color\" type=\"color\" name=\"bg-color\" value=\"\
    #ffffff\">\n    <label for=\"text-color\">选择文字颜色</label>\n    <input id=\"text-color\"\
    \ type=\"color\" name=\"text-color\" value=\"#000000\">\n    <label for=\"font-stack\"\
    >选择字体</label>\n    <select id=\"font-stack\">\n      <option value=\"Georgia,\
    \ Times New Roman, serif\">衬线字体</option>\n      <option value=\"Verdana, Tahoma,\
    \ sans-serif\">无衬线字体</option>\n      <option value=\"Bradley Hand, Brush Script\
    \ MT, cursive\">草字体</option>\n      <option value=\"Luminari, Fantasy\">幻想字体</option>\n\
    \      <option value=\"Monaco, Courier monospace\">主要</option>\n    </select>\n\
    \    <button>\n      保存你的设置\n    </button>\n  </fieldset>\n</form>\n```\n\nJavaScript:\n\
    \n```javascript\n// 监听 #background-color 颜色选择器的变化\ndocument.querySelector('#background-color').\n\
    \  addEventListener('change', function() {\n  const backgroundColor = this.value;\n\
    \  document.body.style.backgroundColor = \n  backgroundColor;\n});\n// 监听 #text-color\
    \ 选择器的变化\ndocument.querySelector('#text-color').\n  addEventListener('change',\
    \ function() {\n  const textColor = this.value;\n  document.body.style.color =\
    \ textColor;\n});\n// 监听 #font-stack 选择列表的变化\ndocument.querySelector('#font-stack').\n\
    \  addEventListener('change', function() {\n  const fontStack = this.selectedOptions[0].value;\n\
    \  document.body.style.fontFamily = fontStack;\n});\n// 监听按钮被点击\ndocument.querySelector('#button').\n\
    \  addEventListener('click', () => {\n// 将表单数据存储在 JavaScript 对象中\nconst userSettings\
    \ = {\n  backgroundColor: document.\n  querySelector('#background-color').value,\n\
    \  textColor: document.querySelector('#text-color').\n  value,\n  fontStack: document.querySelector('#font-stack').\n\
    \  selectedOptions[0].value\n}\n// 将设置保存到本地存储中\nlocalStorage.setItem('user-settings',\
    \ JSON.stringify(userSettings));\n```\n\nHTML 设置了一个表单（参见图 10-2）来收集一些设置——背景颜色、文字颜色和字体样式——以及一个按钮。JavaScript\
    \ 为两个颜色选择器和选择列表设置了更改处理器。最后，代码监听按钮上的点击事件，处理器处理器将数据存储在 JavaScript 对象中，然后将数据保存到本地存储中。\n\
    \n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_171_0.png)\n\n图 10-2：用于收集页面用户设置的表单。\n\
    \n# 第 11 章\n十种 JavaScript 调试策略\n\n对于任何非复杂的 JavaScript 代码，很少有脚本在第一次（甚至是第十次！）运行完美无缺。脚本\
    \ bug 也会出现在最有经验的开发者身上，所以代码中出现错误并不意味着你作为一个程序员是失败的！这仅仅意味着你是一个程序员。\n\n当 bug 进入你的代码时，你希望尽可能快地消灭它们。本章为你提供了十种可以有所帮助的调试策略。\n\
    \n# 进入你的开发工具\n\n所有的网页调试都始于访问浏览器的开发工具。在每个浏览器中，打开开发工具最快的方法是右键点击页面元素，然后点击“检查”。你也可以按\
    \ Ctrl+Shift+I (Windows) 或 Option+Command+I (macOS)。\n\n# 控制台是你最好的调试伙伴\n\n在代码中，你可以通过将该值输出到开发工具的\
    \ Console 标签来查看变量或对象属性的当前值：\n\n```javascript\nconsole.log(output);\n```\n\n将 `output`\
    \ 替换为你想要在控制台中打印的表达式。输出表达式可以是文本字符串、变量、对象属性、函数结果或这些者的任何组合。\n\n# 给你的代码一个停顿（断点）\n\n\
    暂停你的代码可以让你看到正在发生什么，并在控制台中运行一些命令。你有两种方法可以在执行中途暂停代码：\n\n- **设置断点。**在开发工具中，打开包含 JavaScript\
    \ 代码的文件，找到你想要暂停的语句，然后点击该语句左侧的行号。\n- **添加 debugger 语句。**在你的 JavaScript 代码中，在在你想要暂停的语句之前的一行添加一个\
    \ `debugger` 语句。\n\n# 逐行执行你的代码\n\n一旦你的 JavaScript 代码进入断点模式，请使用开发工具的执行控制控件来逐行执行代码。你可以逐个语句地执行代码。\n\
    \n# 监控变量和属性值\n\n在断点模式下，通过在控制台中输出语句来查看值，或者悬停在变量上查看，或者进入函数。\n\n# 缩进你的代码\n\n代码缩进两个或四个空格会让调试工作变得更易读。\n\
