    # # Chapter 4

    Controlling the Flow of JavaScript


    With the default script flow, the browser processes the code inside a script element
    or an external JavaScript file one statement at a time. The browser reads and
    executes the first statement, reads and then executes the second statement, and
    so on until it has no more JavaScript left to read and execute.


    That statement-by-statement flow seems reasonable, but it''s extremely limited.
    What if you want your code to test some condition and then branch to a specific
    chunk of code depending on the result of that test? What if you want your code
    to repeat some statements multiple times, with some change occurring in each repetition?
    Code that runs tests and code that repeats itself all fall under the rubric of
    controlling the flow of JavaScript. In this chapter, you explore this fascinating
    and powerful subject.


    CHAPTER 4 Controlling the Flow of JavaScript 39'
