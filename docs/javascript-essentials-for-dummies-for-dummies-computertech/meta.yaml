    selectedIndex = -1\n```\n\n# Working with Form Events\n\nWith all the clicking,\
    \ typing, tabbing, and dragging that goes on, web forms are veritable event factories.\
    \ Fortunately, you can let most of these events pass you by, but a few do come\
    \ in handy, both in running code when the event occurs and in triggering the events\
    \ yourself.\n\nMost events are clicks, so you can handle them by setting click\
    \ event handlers using JavaScript's addEventListener() method (which I cover in\
    \ Chapter 6). Here's an example:\n\nHTML:\n\n```\n<form>\n  <label for=\"user\"\
    >Username:</label>\n  <input id=\"user\" type=\"text\" name=\"username\">\n  <label\
    \ for=\"pwd\">Password:</label>\n  <input id=\"pwd\" type=\"password\">\n</form>\n\
    ```\n\nJavaScript:\n\n```\ndocument.querySelector('form').\n  addEventListener('click',\
    \ () => {\n    console.log('Thanks for clicking the form!');\n  });\n```\n\nThis\
    \ example lists listeners for clicks on the entire form element, but you can also\
    \ create click event handlers for buttons, input elements, checkboxes, radio buttons,\
    \ and more."
