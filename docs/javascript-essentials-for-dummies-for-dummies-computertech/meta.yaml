    \ = function (preTip, tipPercent) {\n  const tipResult = preTip * tipPercent;\n\
    \  return (tipResult);\n}\n```\n\nYou can rewrite this using an arrow function:\n\
    \n```\n// Declare tipCost using an arrow function\nconst tipCost = (preTip, tipPercent)\
    \ => {\n  const tipResult = preTip * tipPercent;\n  return (tipResult);\n}\n```\n\
    \nIf your anonymous function consists of a single statement, you can take advantage\
    \ of an arrow function feature called *implicit return*:\n\n```\n([arguments])\
    \ => statement\n```\n\nHere, JavaScript assumes that a single-statement function\
    \ means that the function returns right after executing the statement, so you\
    \ can leave out the braces and the `return` keyword. Here's an example:\n\n```\n\
    // Declare tipCost using an arrow function with implicit return\nconst tipCost\
    \ = (preTip, tipPercent) => preTip * tipPercent;\n```\n\nSimilarly, here's one\
    \ of the anonymous callback functions from the previous section:\n\n```\ndocument.getElementById('bgRed').addEventListener(\n\
    \  'click',\n  function() {\n    document.body.backgroundColor=\n    'red';\n\
