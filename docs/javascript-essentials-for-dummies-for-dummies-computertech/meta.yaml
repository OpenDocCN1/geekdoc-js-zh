    +   Chrome for Mac: Select View ⌥ Developer Tools Shortcut: Option+⌘I.


    +   Firefox for Windows: Click Open Application Menu (the three horizontal lines
    on the right of the toolbar) and then select More Tools ⌥ Developer Tools. Shortcut:
    Ctrl+Shift+I.


    +   Firefox for Mac: Select Tools ⌥ Browser Tools Shortcut: Option+⌘I.


    +   Microsoft Edge: Click Settings and More (the three vertical dots to the right
    of the address bar) and then select More Tools ⌥ Developer Tools. Shortcut: Ctrl+Shift+I.


    +   Safari: Select Develop ⌥ Show Web Inspector. Shortcut: Option+⌘I. If you don''t
    have the Developer menu, select Safari ⌥ Settings, click the Advanced tab, and
    then select the Show Menu in Menu Bar checkbox.


    Development tools vary in the features they offer, but each one provides the same
    set of basic tools, which are the tools you''ll use most often. These basic web
    development tools include:


    +   HTML viewer: This tab (called Inspector in Firefox and Elements in the other
    browsers) shows the HTML source code used in the web page. When you hover the
    mouse pointer over a tag, the browser highlights the element in the displayed
    page and shows its width and height, as shown in Figure 9-1. When you click a
    tag, the browser shows the CSS styles applied with the tag, as well as the tag''s
    box dimensions (again, refer to Figure 9-1).


    +   Console: This tab enables you to view error messages, log messages, test expressions,
    and execute statements. I cover the Console in more detail in the next section.


    +   Debugging tool: This tab (called Debugger in Firefox and Sources in the other
    browsers) enables you to pause code execution, step through your code, watch the
    values of variables and properties, and much more. This is the most important
    JavaScript debugging tool, so I cover it in detail later in this chapter.'
