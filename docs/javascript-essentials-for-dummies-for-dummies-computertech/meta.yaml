    # Programming Checkboxes


    You use a checkbox in a web form to toggle a setting on (that is, the checkbox
    is selected) and off (the checkbox is deselected). You create a checkbox by including
    in your form the following version of the <input> tag:


    ```

    <input id="checkId" type="checkbox" name="checkName" value="checkValue" [checked]>

    ```'
