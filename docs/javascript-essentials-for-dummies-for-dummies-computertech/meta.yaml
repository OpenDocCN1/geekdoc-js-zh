  mdcn: "\n# 获取文本字段值\n\n你的脚本可以使用字段对象与值相关的属性之一来获取任何文本字段的当前值：\n\n```\nfield.value\n\
    field.valueAsDate\nfield.valueAsNumber\n```\n\n这是一个示例：\n\nHTML:\n\n```\n<label\
    \ for=\"search-field\">\n  搜索网站：\n</label>\n<input id=\"search-field\" name=\"\
    q\" type=\"search\">\n```\n\nJavaScript:\n\n```javascript\nconst searchString\
    \ = document;\n  getElementById('search-field').value;\n  console.log(searchString);\n\
    ```\n\n# 设置文本字段值\n\n要更改文本字段的值，可以将新字符串赋值给字段对象的 `value` 属性：\n\n```\nfield.value\
    \ = value\n```\n\n以下是各个部分的含义：\n\n- field：指向你想要操作的表单字段对象的引用\n- value：你想要赋值给文本字段的字符串\n\
    \n这是一个示例：\n\nHTML:\n\n```\n<label for=\"homepage-field\">\n输入你的主页地址：\n</label>\n\
    <input id=\"homepage-field\" name=\"homepage\"\ntype=\"url\" value=\"HTTPS://PAULMCFEDRIES.COM/\"\
    \">\n```\n\nJavaScript:\n\n```javascript\nconst homepageField = document;\ngetElementById('homepage-field');\n\
    const homepageURL = homepageField.value;\nhomepageField.value = homepageURL.toLowerCase();\n\
    ```\n\nHTML 定义了一个 `url` 类型的输入元素，其默认值为全大写字母。JavaScript 代码获取了 URL，将其转换为全小写字母，并返回到同一个\
    \ URL 字段。如图 10-1 所示，文本框显示为全小写字母。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_155_0.png)\n\
    \n图 10-1：脚本将输入的默认文本转换为全小写字母。\n\n# 复选框\n\n你在 Web 表单中使用复选框来切换设置的开启（即复选框被选中）和关闭（即复选框未被选中）。你通过在表单中包含以下版本的\
    \ `<input>` 标签来创建复选框：\n\n```\n<input id=\"checkId\" type=\"checkbox\" name=\"\
    checkName\" value=\"checkValue\" [checked]>\n```\n\n以下是各个部分的含义：\n\n- *checkId*：复选框的唯一标识符。\n\
    - *checkName*：你想赋予复选框的。\n- *checkValue*：你想要赋值的值，脚本在提交表单时可以访问；用户永远看不到它。\n- *checked*：当此可选属性存在时，复选框初始为选中。\n\
    \n# 引用复选框\n\n如果你的代码需要引用页面上的所有复选框，请使用以下选择器：\n\n```\n`document.querySelectorAll('input[type=checkbox]')`\n\
    ```\n\n如果你想要特定表单中的复选框，对表单的 *id* 值使用后代或子选择器：\n\n```\n`document.querySelectorAll('#formid\
    \ input[type=checkbox]')`\n```\n\n或者：\n\n```\n`document.querySelectorAll('#formid\
    \ input[type=checkbox]')`\n```\n\n# 获取复选框状态\n\n你的代码需要知道复选框是被选中还是未选中。这被称为复选框的*状态*State）。在这种情况下，你需要检查复选框对象的\
    \ *checked* 属性：\n\n```\n`checkbox.checked`\n```\n\n如果复选框被选中，*checked* 属性返回 *true*；如果未选中，则返回\
    \ *false*。\n\n这是一个示例：\n\nHTML:\n\n```\n<label>\n  <input id=\"autosave\" type=\"\
    checkbox\"\n    name=\"autosave\">\n  自动保存此项目\n</label>\n```\n\nJavaScript:\n\n\
    ```javascript\nconst autoSaveCheckBox = document.\nquerySelector('#autosave');\n\
    if (autoSaveCheckBox.checked) {\n  console.log(`${autoSaveCheckBox.name}\n  已选中`);\n\
    } else {\n  console.log(`${autoSaveCheckBox.name}\n  未选中`);\n}\n```\n\nJavaScript\
    \ 代码将复选框对象的引用存储在 `autoSaveCheckBox` 变量中。然后，`if` 语句检查对象的 checked 属性，并根据 checked\
    \ 返回 true 或 false 在控制台中显示不同的不同的消息。\n\n# 设置复选框状态\n\n要将复选框字段设置为选中或未选中状态，请将布尔表达式赋值给\
    \ checked 属性：\n\n```\ncheckbox.checked = true|false\n```\n\n例如，假设你有一个包含许多复选框的表单，你想设置该表单，使用户最多最多选择三个复选框。以下是实现该功能的代码：\n\
    \n```javascript\ndocument.querySelector('form').\naddEventListener('click', event\
    \ => {\n\n  // 确保点击了复选框\n  if (event.target.type === 'checkbox') {\n\n  // 获取已选中复选框的总数\n\
    \  const totalSelected = document.querySelectorAll('input[type=checkbox]:checked').length;\n\
