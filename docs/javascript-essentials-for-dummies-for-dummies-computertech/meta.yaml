    # Understanding escape sequences


    What if you must include, say, a double quotation mark within a string''s enclosed
    by double quotation marks? Having to nest the same type of quotation mark is rare,
    but it is possible if you precede the double quotation mark with a backslash (\),
    like this:


    ```

    "The double quotation mark (\") encloses this string.";

    ```


    The \" combination is called an escape sequence. You can combine the backslash
    with a number of other characters to form other escape sequences, and each one
    enables the browser to present a character that, by itself, would be illegal or
    not represent otherwise. Table 2-1 lists the most commonly used escape sequences.


    # TABLE 2-1 Common JavaScript Escape Sequences


    | Escape Sequence | Character It Represents |

    |---|---|

    |\'' | Single quotation mark |

    |\" | Double quotation mark |

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \t | Tab |

    | \\ | Backslash |


    The following code shows an example script that uses the \n escape sequence to
    display text on multiple lines with an alert box.


    ```

    alert("This is line 1.\nSo what. This is line 2.");

    ```


    Figure 2-4 shows the result.'
