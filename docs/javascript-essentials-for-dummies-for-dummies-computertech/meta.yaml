  - "[PAGE 77]\n\nThis statement first passes the value of preTipTotal (initialized\
    \ as 100.00 earlier in the script) and tipPercentage (initialized as 0.15 earlier)\
    \ to the calculateTip function. When that function returns its result, the entire\
    \ expression calculateTip(preTipTotal, tipPercentage) is replaced by that result,\
    \ meaning that it gets stored in the cost variable. preTipTotal and tipCost are\
    \ added together, the result is stored in totalBill, and a document.write statement\
    \ displays the final calculation (check Figure 5-4).\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_77_0.png)\n\
    \n**Figure 5-4:** The output includes the return value of the custom function\
    \ calculation.\n\n# # Working with Anonymous Functions\n\nHere's another look\
    \ at the function syntax from earlier in this chapter:\n\n```\nfunction functionName([arguments])\
    \ {\n  JavaScript statements\n}\n```\n\nThis version of function syntax creates\
    \ a so-called named function because — you guessed it — the function has a name.\n\
    \nHowever, creating a function that doesn't have a name is also possible:\n\n\
    ```\nfunction ([arguments]) {\n  JavaScript statements\n}\n```\n\nThis variety\
    \ of function syntax creates a so-called anonymous function because — that’s right\
    \ — the function has no name."
  - '[PAGE 78]


    Why use anonymous functions? Well, first, you don''t have to if you don''t want
    to. Second, the main reason to use anonymous functions is to avoid creating a
    named object when you don''t need to. Every large web project has a huge namespace,
    which refers to the full collection of identifiers you assign to things like variables
    and functions. The larger the namespace, the greater the chance of a namespace
    collision, where you use the same identifier for two different things. Bad news!


    Anonymous functions were introduced in ES6, so you don''t use them if you need
    to support very old browsers, such as Internet Explorer 11.


    If you have a function that will be used only once in your project, it''s considered
    good modern programming practice to make that an anonymous function so that you
    have one less identifier in your namespace.


    Okay, I hear you thinking, earlier we said we invoke a function using the function
    name. If an anonymous function has no name, how are we supposed to run it? Excellent
    question! There are two main methods to look at:


    +   - Assigning the function to a variable

    - Replacing a function call with the function itself


    # Assigning an anonymous function to a variable


    The example code from the previous section defines the named function calculateTip()
    and later uses the tipCost variable to store the function result. This is a perfect
    example of when a named function is not needed because you only use the named
    function to calculate the tipCost value. Adding identity to the namespace when
    you don''t have to is polluting the namespace, and it''s a big no-no in modern
    JavaScript programming.


    You can rewrite this code to use an anonymous function instead:


    ```

    const preTipTotal = 100.00;

    const tipPercentage = 0.15;

    ```


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_78_0.png)'
