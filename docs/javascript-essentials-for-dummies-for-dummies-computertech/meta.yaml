  md: '# Getting to know the Date object


    Whenever you work with dates and times in JavaScript, you work with an instance
    of the Date object. More to the point, when you deal with a Date object in JavaScript,
    you deal with a specific moment in time, down to the millisecond. A Date object
    can never be a block of time, and it''s not a kind of clock ticks along while
    your script runs. Instead, the Date object is a temporal snapshot that you use
    to extract the specifics of the time you taken: the year, month, date, hour, and
    so on.


    # Specifying the current date and time


    The most common use of the Date object is to store the current date and time.
    You do that by invoking the Date() function, which is the constructor for creating
    a new Date object. Here''s the general format:


    ```

    const dateToday = new Date();

    ```


    # Specifying any date or time


    If you need to work with a specific date or time, you need to use the Date() function''s
    arguments. There are five versions of the Date() function syntax (refer to the
    list of arguments near the beginning of this chapter):


    ```

    const date = new Date("month dd, yyyy hh:mm:ss");

    const date = new Date("month dd, yyyy");

    const date = new Date(yyyy, mth, dd, hh, mm, ss);

    const date = new Date(yyyy, mth, dd);

    const date = new Date(ms);

    ```


    The following statements give you an example for each syntax:


    ```

    const myFunction = new Date("August 23, 2024

    3:02:01");

    const myFunction = new Date("August 23, 2024");

    const myFunction = new Date(2024, 8, 23, 3, 2, 1);

    const myFunction = new Date(2024, 8, 23);

    const myFunction = new Date(1692763200000);

    ```'
  merge: -1
