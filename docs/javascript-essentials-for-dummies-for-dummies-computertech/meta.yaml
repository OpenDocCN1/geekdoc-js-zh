  md: '# Listening for Page Events


    In web development, an event is an action that occurs in response to some external
    stimulus. A common type of external stimulus is when a user interacts with a web
    page. Here are some examples:


    +   - Surfing to or reloading the page

    - Clicking a button

    - Pressing a key

    - Scrolling to the page


    Why don’t web pages respond to events automatically? Why do they just sit there?
    Because web pages are static by default, meaning that they ignore the events that
    are firing around them. Your job as a web developer is to change that behavior
    by making your web pages “listen” for particular events to occur. You do that
    by setting up special chunks of code called event handlers. An event handler consists
    of two parts:


    +   - Event listener: An instruction to the web browser to watch out (“listen”)
    for a particular event occurring on a particular element.

    - Callback function: The code that the web browser executes when it detects the
    event has occurred.


    You configure your code to listen for and react to an event by setting up an event
    handler using the element object’s addEventListener() method. Here’s the syntax:


    ```

    element.addEventListener(event, callback);

    ```


    Here’s what the various parts are:


    +   - element: The web page element to be monitored for the event. The event is
    said to be bound to the element.

    - event: A string specifying the name of the event you want the browser to listen
    for. For the main events I mention in the previous section, use one of the following,
    enclosed in quotation marks: DOMContentLoaded, click, dblclick, mouseover, keypress,
    focus, blur, change, submit, scroll, or resize.'
