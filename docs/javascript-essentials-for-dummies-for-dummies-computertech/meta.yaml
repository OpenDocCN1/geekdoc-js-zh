  md: '# Invoking break mode


    JavaScript gives you two ways to enter break mode:


    +   - By setting breakpoints

    - By using a debugger statement


    # Setting a breakpoint


    If you know approximately where an error or logic flaw occurs, you can enter break
    mode at a specific statement in the script by setting up a breakpoint. Here are
    the steps to set up a breakpoint:


    +   1. Display your web browser''s developer tools and switch to the debugging
    tool (such as the Sources tab in Chrome).

    2. Open the file that contains the JavaScript code you want to debug.

    How you do this depends on the browser: in Chrome (and most browsers), you have
    two choices:

    - In the left pane, click the HTML file (if your JavaScript is within a script
    element in your HTML file) or the JavaScript (.js) file (if your code resides
    in an external JavaScript file).

    - Press Ctrl+P (Windows) or Cmd+P (macOS) and then click the file in the list
    that appears.

    3. Locate the statement where you want to enter break mode.

    JavaScript will run every line of code up to, but not including, this statement.

    4. Click the line number to the left of the statement to set the breakpoint, as
    shown in Figure 9-3.'
