    const tipCost = function (preTip, tipPercent) {\n  const tipResult = preTip *\
    \ tipPercent;\n  return (tipResult);\n}\nconst totalBill = preTipTotal +\ntipCost(preTipTotal,\
    \ tipPercentage);\ndocument.write(\"Your total bill is $\" + +\ntotalBill);\n\
    ```\n\nThe big change here is now I declare the value of the tipCost variable\
    \ to be an anonymous function. That anonymous function is the same as the calculateTip()\
    \ named function from before, just without the name. In the second-last statement,\
    \ I invoke the anonymous function by using tipCost(preTipTotal, tipPercentage).\n\
    \n## Replacing a function call with an anonymous function\n\nOne of the most common\
    \ uses for anonymous functions is when you need to pass a function as an argument\
