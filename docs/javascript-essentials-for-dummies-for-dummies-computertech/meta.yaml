    # Checking out another way to declare a variable: const


    The word variable implies the value assigned to a variable is allowed to vary,
    which is the case for most variables you declare. Most, but not all. Sometimes
    your scripts will need to use a value that remains constant. For example, suppose
    you''re building a calculator that converts miles to kilometers. The conversion
    factor is 1.60934, and that value will remain constant throughout your script.


    It''s good programming practice to store such values in a variable for easier
    reading. However, if you use let for this declaration, you run the risk of accidentally
    changing the value somewhere in your code because variables declared with let
    can change.


    To avoid accidentally changing a value that you want to remain constant, you can
    declare the variable using the const keyword. Here''s the general syntax:


    ```

    const variableName = value;

    ```


    Note, unlike with let, you must assign a value to the variable when you declare
    it with const. Here''s an example that declares a variable named milesToKilometers
    and assigns it value 1.60934:


    ```

    const milesToKilometers = 1.60934;

    ```


    Are there any real advantages to using const over let in cases where a variable''s
    value must never change? Yep, there are two good ones:


    +   - Using the const keyword is a reminder that you''re dealing with a nonchanging
    value, which helps you to remember not to assign the variable a new value.

    - If you do to change the value of a variable declared with const, you''ll generate
    an error, which is another way to remind you that the variable''s value is not
    to be messed with.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_32_0.png)'
