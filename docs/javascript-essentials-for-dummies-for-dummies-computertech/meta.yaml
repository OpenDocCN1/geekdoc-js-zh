    # Chapter 3

    Building Expressions


    When coding in JavaScript, you use expressions constantly, so it''s vital to understand
    what they are and to get comfortable with the types of expressions that are available.
    Every JavaScript coder is different, but I can say without fear of contradiction
    that every good JavaScript coder is fluent in expressions.


    This chapter takes you through everything you need to know about expressions.
    You discover some expression basics and then explore a number of techniques for
    building powerful expressions using numbers, strings, and Boolean values.


    # Understanding How Expressions

    Are Structured


    A JavaScript expression takes one or more inputs, such as a bill total and a tip
    percentage, and combines them in some way — for example, by using multiplication.
    In expression lingo, the inputs are called operands, and they''re combined by
    using special symbols called operators.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '+   operand: An input value for an expression. It is, in other words, the raw
    data that the expression manipulates to produce its result. It could be a number,
    a string, a variable, a function result (refer to Chapter 5), or an object property
    (refer to Chapter 6).


    +   operator: A symbol that represents a particular action performed on one or
    more operands. For example, the * operator represents multiplication, and the
    + operator represents addition. I discuss the various JavaScript operators throughout
    this chapter.


    For example, here''s an expression that calculates a tip amount and assigns the
    result to a variable:


    ```

    tipAmount = billTotal * tipPercentage;

    ```


    The expression is everything to the right of the equals sign (=). Here, billTotal
    and tipPercentage are the operands, and the multiplication sign (*) is the operator.


    # Creating Numeric Expressions


    In JavaScript, a mathematical calculation is called a numeric expression, and
    it combines numeric operands and arithmetic operators to produce a numeric result.
    This section discusses all the JavaScript arithmetic operators and shows you how
    best to use them to build useful and handy numeric expressions.


    Table 3-1 lists the basic arithmetic operators you can use in your JavaScript
    expressions.


    JavaScript also comes with a few extra operators that combine some of the arithmetic
    operators and the assignment operator, which is the humble equals sign (=) that
    assigns a value to a variable. Table 3-2 lists these so-called arithmetic assignment
    operators.'
  merge: -1
