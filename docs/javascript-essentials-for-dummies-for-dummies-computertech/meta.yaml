  - "[PAGE 17]\n\n# Where do you put the <script> tag?\n\nWith certain exceptions,\
    \ it doesn't matter a great deal where you put your <script> tag. Some people\
    \ place the tag between the page's </head> and <body> tags. The HTML standard\
    \ recommends placing the <script> tag within the page header (that is, between\
    \ <head> and </head>), so that's the style I use in this book:\n\n```\n<DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Where\
    \ do you put the script tag?</title>\n<script>\n  JavaScript statements go here\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nHere are the exceptions to\
    \ the put-script-anywhere technique:\n\n+   - If your script is designed to write\
    \ data to the page, the <script> tag must be positioned within the page body (that\
    \ is, between the <body> and </body> tags) in the exact position where you want\
    \ the text to appear.\n- If your script refers to an item on the page (such as\
    \ a form object), the script must be placed after that item.\n- With many HTML\
    \ tags, you can add one or more JavaScript statements as attributes within the\
    \ tag.\n\nIt's perfectly acceptable to insert multiple <script> tags within a\
    \ single page, as long as each one has a corresponding </script> end tag, and\
    \ as long as you don't put one <script> block within another one.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_17_0.png)"
- md: "## Example #1: Displaying a message to the user\n\nYou're ready to construct\
    \ and try out your first script. This example shows you the simplest of all JavaScript\
    \ actions: display- a basic message to the user. The following code shows the\
    \ script within an HTML file:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    \  <head>\n  <meta charset=\"utf-8\">\n  <title>Displaying a Message to the User</title>\n\
    \  <script>\n    alert(\"Hello JavaScript World!\");\n  </script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\nAs shown in here, place the script within the header\
    \ of a page, save the file, and then open the HTML file within your browser.\n\
    \nThis script consists of just a single line:\n\n```javascript\nalert(\"Hello\
    \ JavaScript World!\");\n```\n\nThis is called a statement, and each statement\
    \ is designed to perform a single JavaScript task. Your scripts will range from\
    \ simple programs with just few statements to huge projects consisting hundreds\
    \ of statements.\n\nYou may be wondering about the semicolon (;) that appears\
    \ at the end of the statement. Good eye. You use the semicolon to mark the end\
    \ of each of your JavaScript statements.\n\nIn the example, the statement runs\
    \ the JavaScript alert method, which displays to the user whatever message is\
    \ enclosed within the parentheses (which could be a welcome message, an announcement\
    \ of new features on your site, an advertisement for a promotion, and so on).\
    \ Figure 1-1 shows the message when you open the file.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_0.png)\n\
    \nFIGURE 1-1: This \"alert\" message appears when you open the HTML file containing\
    \ the example script.\n\nHow did the browser know to run the JavaScript statement?\
    \ When a browser processes (parses, in the vernacular) a page, it basically starts\
    \ at the beginning of the HTML file and works its way, one line at a time. If\
    \ it trips over a <script> tag, it knows one or more JavaScript statements are\
    \ coming, and it automatically executes those statements, in order, as soon as\
    \ it reads them. The exception is when JavaScript statements are enclosed within\
    \ a function, which I explain in Chapter 5.\n\nOne of the cardinal rules of JavaScript\
    \ programming is \"one statement, one line.\" That is, each statement must appear\
    \ on only a single line, and there should be no more than one statement on each\
    \ line. I said \"should\" in the second part of the previous sentence because\
    \ it is possible to put multiple statements on a single line, as long as you separate\
    \ each statement with a semicolon (;). There are rare times when it's necessary\
    \ to have two or more statements on one line, but you should avoid it for the\
    \ bulk of your programming because multiple-statement lines are difficult to read\
    \ and troubleshoot.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_1.png)\n\n\
    ## Example #2: Writing text to the page\n\nOne of JavaScript's most powerful features\
    \ is the capability to write text and even HTML tags and CSS rules to the web\
    \ page on-the-fly. That is, the text (or whatever) gets inserted into the page\
    \ when a web browser loads the page. What good that? For one thing, it's ideal\
    \ for time-sensitive data. For example, you may want to display the date and time\
    \ that a web page was modified so that visitors know how old (or new) the page\
    \ is. Here's some code that shows just a script:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Writing Data\
    \ to the Page</title>\n</head>\n<body>\n  This is a regular line of text.<br>\n\
    \  <script>\n    document.write(\"Last modified: \" + document.lastModified)\n\
    \  </script>\n  <br>This is another line of regular text.\n</body>\n</html>\n\
    ```\n\nNotice how the script appears within the body of the HTML document, which\
    \ is necessary whenever you want to write data to the page. Figure 1-2 shows the\
    \ result.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_20_0.png)\n\nFIGURE 1-2:\
    \ When you open the file, the file displays the date and time the file was last\
    \ modified.\n\nThis script makes use of the document object, which is a built-in\
    \ JavaScript construct that refers to whatever HTML file (document) the script\
    \ resides in (check out Chapter 6 for more about the document object). The document.write()\
    \ statement tells the browser to insert whatever is within the parentheses the\
    \ web page. The document.lastModified portion returns the date and time the file\
    \ was last changed and saved.\n\n## What You Need to Get Started\n\nOne of the\
    \ nicest things about HTML and CSS is that the hurdles you have to learn to get\
    \ started are not only short but few in number. In fact, you really need two things,\
    \ both of which are free: a text editor to enter the text, tags, and properties;\
    \ and a browser to view the results. (You'll also need a web server to host the\
    \ finished pages.) Yes, there are high-end text editors and fancy graphics programs,\
    \ but these fall into the “Bells and Whistles” category; you can create perfectly\
    \ respectable web pages without them.\n\nThe basic requirements for JavaScript\
    \ programming are exactly the same as for HTML: a text editor and a browser. Again.\n\
    \n## Dealing with Exceptional Cases\n\nOne of the nicest things about HTML and\
    \ CSS is that the hurdles you have to learn to get started are not only short\
    \ but few in number. In fact, you really need two things, both of which are free:\
    \ a text editor to enter the text, tags, and properties; and a browser to view\
    \ the results. (You'll also need a web server to host the finished pages.) Yes,\
    \ there are high-end text editors and fancy graphics programs, but these fall\
    \ into the “Bells and Whistles” category; you can create perfectly respectable\
    \ web pages without them.\n\nThe basic requirements for JavaScript programming\
    \ are exactly the same as for HTML: a text editor and a browser. Again.\n\n##\
    \ Handling browsers with off\n\nOne of the cardinal rules of JavaScript programming\
    \ is \"one statement, one line.\" That is, each statement must appear on only\
    \ a single line, and there should be no more than one statement on each line.\
    \ I said \"should\" in the second part of the previous sentence because it is\
    \ possible to put multiple statements on a single line, as long as you separate\
    \ each statement with a semicolon (;). There are rare times when it's necessary\
    \ to have two or more statements on one line, but you should avoid it for the\
    \ bulk of your programming because multiple-statement lines are difficult to read\
    \ and troubleshoot.\n\n## Handling very old browsers\n\nIn this book, you learn\
    \ the version of JavaScript called ECMAScript 2015, also known as ECMAScript 6,\
    \ or just ES6. Why this version, in particular, and not any of the later versions?\
    \ Two reasons:\n\n- ES6 has excellent browser support, with more than 98 percent\
    \ of current browsers supporting the features released in ES6. Later versions\
    \ of JavaScript have less support.\n- ES6 has everything you need to add all kinds\
    \ of useful and dynamic features to your pages. Unless you're a professional programmer,\
    \ the features released in subsequent versions of JavaScript are way beyond what\
    \ you need.\n\nOkay, so what about couple of percent of browsers that don't support\
    \ ES6?\n\nFirst, know that the number of browsers that choke on ES6 features is\
    \ getting smaller every day. Sure, it's 2 percent (about 1.7 percent, actually),\
    \ but it will be 1 percent in six months, a 0.5 percent in a year, and so on until\
    \ the numbers get too small to measure.\n\nSecond, the percentage of browsers\
    \ that don't support ES6 varies by region (it's higher in many countries in Africa,\
    \ for example) and by environment. Most of the people running browsers that don't\
    \ fully support ES6 are using Internet Explorer 11, and most of those people are\
    \ in situations in which they can't upgrade (some) corporate environments, for\
    \ example)."
  mdcn: "\n## 示例 #1：向用户显示消息\n\n你已经准备好构建并尝试你的第一个脚本了。这个示例向你展示了 JavaScript 操作中最简单的：向用户显示一条基础消息。以下代码显示了\
    \ HTML 文件中的脚本：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n  <meta\
    \ charset=\"utf-8\">\n  <title>Displaying a Message to the User</title>\n  <script>\n\
    \    alert(\"Hello JavaScript World!\");\n  </script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n如此处所示，将脚本放置在页面的 `header`（头部）中，保存文件，然后在浏览器中打开该 HTML 文件。\n\n此脚本仅包含一行代码：\n\
    \n```javascript\nalert(\"Hello JavaScript World!\");\n```\n\n这被称为一条语句（statement），每条语句都旨在执行单一\
    \ JavaScript 任务。你的脚本范围可能从仅有几条语句的简单程序，到包含数百条语句的巨型项目。\n\n你可能对语句末尾出现的分号（;）感到好奇。眼光不错。你使用分号来标记每个\
    \ JavaScript 语句的结束。\n\n在示例中，该语句运行 JavaScript `alert` 方法，该方法向用户显示括号括内的任何消息（可以是欢迎消息、网站新功能公告、促销广告等）。图\
    \ 1-1 显示了当你打开文件时显示的消息。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_0.png)\n\
    \n图 1-1：当你打开包含示例脚本的 HTML 文件时，会出现这个“alert”（警报）消息。\n\n浏览器是如何知道要运行这条 JavaScript 语句的？当浏览器处理（用俗语说是“解析”）一个页面时，它基本上从\
    \ HTML 文件的开头开始，逐一行地向下工作。如果它遇到 `<script>` 标签，它就知道后面将要有一条或多个 JavaScript 语句，并在读取到它们时立即按顺序自动执行这些语句。例外是\
    \ JavaScript 语句被封装在函数内部，我将在第 5 章中解释。\n\nJavaScript 编程的基本准则之一是“一条语句一行”。也就是说，每条语句必须出现在单行中，且每行不应超过一条语句。我在上一句的后半部分使用了“应该”，是因为只要用分号（;）分隔每条语句，就可以将多条语句放在同一行。虽然在少数情况下有必要在一行中放置两条或更多语句，但在大多数编程中，你应该避免这样做，因为包含多条语句的行难以阅读和排故障。\n\
    \n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_1.png)\n\n## 示例 #2：向页面写入文本\n\nJavaScript\
    \ 最强大的功能之一是能够动态地向网页写入文本，甚至是 HTML 标签和 CSS 规则。也就是说，当网络浏览器加载页面时，文本（或其他内容）会被插入到页面。这有什么用？首先，它对于时间敏感的数据非常理想。例如，你可能想显示网页修改的日期和时间，以便访问者知道页面有多老（或多新）。这里有一段仅显示脚本的代码：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Writing Data to the Page</title>\n</head>\n<body>\n  This is a regular\
    \ line of text.<br>\n  <script>\n    document.write(\"Last modified: \" + document.lastModified)\n\
    \  </script>\n  <br>This is another line of regular text.\n</body>\n</html>\n\
    ```\n\n注意脚本是如何出现在 HTML 文档的 `body` 中的，每你想向页面写入数据时这都是必要的。图 1-2 显示了结果。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_20_0.png)\n\
    \n图 1-2：当你打开文件时，文件会显示最后最后修改的日期和时间。\n\n此脚本使用了 `document` 对象，这是一个内置 JavaScript 结构，指向脚本所在的任何\
    \ HTML 文件（文档）。更多关于 document 对象的信息请参阅第 6 章。`document.write()` 语句告诉浏览器将括号内的任何内容插入网页。`document.lastModified`\
    \ 部分返回文件最后更改并保存的日期和时间。\n\n## 如何入门\n\nHTML 和 CSS 最棒的地方之一是，入门需要学习的障碍不仅门槛低，而且很少。事实上，你真的只需要两样东西，而且都是免费的：一个用于输入文本、标签和属性的编辑器；以及一个查看结果的浏览器。（你还需要一个\
    \ Web 服务器来托管完成后的页面。）是的，有高级编辑器和花哨的图形程序，但这些属于“锦上添花”类型；没有它们你也可以创建非常体面的网页。\n\nJavaScript\
    \ 编程的基本要求与 HTML 完全相同：一个编辑器和一个浏览器。再次如此。\n\n## 处理特殊情况\n\nHTML 和 CSS 最棒的地方之一是，入门需要学习的障碍不仅门槛低，而且很少。因上，你真的只需要两样东西，而且都是免费的：一个用于输入文本、标签和属性的编辑器；以及一个查看结果的浏览器。（你还需要一个\
    \ Web 服务器来托管完成后的页面。）是的，有高级编辑器和花哨的图形程序，但这些属于“锦上添花”类型；没有它们你也可以创建非常体面的网页。\n\nJavaScript\
    \ 编程的基本要求与 HTML 完全相同：一个编辑器和一个浏览器。再次如此。\n\n## 处理存在异常的浏览器\n\nJavaScript 编程的基本准则之一是“一条语句一行”。也就是说，每条语句必须出现在单行中，且每行不应超过一条语句。我在上一句的后半部分使用了“应该”，是因为只要用分号（;）分隔每条语句，就可以将多条语句放在同一行。虽然在少数情况下有必要在一行中放置两条或更多语句，但在大多数编程中，你应该避免这样做，因为包含多条语句的行难以阅读和排故障。\n\
    \n## 处理非常旧的浏览器\n\n在本书中，你学习的是被称为 ECMAScript 2015（也称为 ECMAScript 6 或 ES6）的 JavaScript\
    \ 版本。为什么是这个特定的版本而不是后续版本？有两个：\n\n- ES6 具有佳的浏览器支持，超过 98% 的当前浏览器都支持 ES6 发布的特性。后续\
    \ JavaScript 版本的支持较少。\n- ES6 包含了你为页面添加各种有用动态功能所需的所有内容。除非你是专业程序员，否则后续版本发布的 JavaScript\
    \ 功能远超你的需求。\n\n那么，那百分之二不支持 ES6 的浏览器怎么办？\n\n首先，要知道不支持 ES6 特性的浏览器数量每天都在减少。确实，现在是\
    \ 2%（实际上是 1.7%），但六个月后它将变成 1%，一年后将变成 0.5%，以此类推，直到数字小到无法测量。\n\n其次，不支持 ES6 的浏览器百分比随地区（例如在非洲的许多国家较高）和环境而异。运行不完全支持\
    \ ES6 浏览器的人大多在使用 Internet Explorer 11，而这些人中的大多数处于无法升级的环境中（例如某些公司环境）。\n"
