    # 第 3 章

    构建表达式


    在 JavaScript 中编写代码时，你会不断地使用表达式，因此理解它们是什么以及熟悉各种可用表达式类型至关重要。每位 JavaScript 开发者各不相同，但我可以毫无顾忌地说，每一位优秀的
    JavaScript 开发者都能熟练地使用表达式。


    本章将带你了解关于表达式所需的所有知识。你将发现一些表达式的基础知识，然后探索使用数字、字符串和布尔值来构建强大表达式的多种技术。


    ## 理解表达式的结构


    一个 JavaScript 表达式接受一个或多个输入（例如账单总额和小费比例），并以某种方式将它们结合起来——例如使用乘法。在表达式的术语中，这些输入被称为**操作数**（operands），它们通过称为**运算符**（operators）的特殊符号进行组合。


    - **操作数（operand）**：表达式的输入值。换句话说，它是表达式处理以产生结果的原始数据。它可以是一个数字、字符串、变量、函数结果（参见第 5 章）或对象属性（参见第
    6 章）。

    - **运算符（operator）**：代表对一个或多个操作数执行特定操作的符号。例如，`*` 运算符表示乘法，`+` 运算符表示加法。我将在本章中讨论各种
    JavaScript 运算符。


    例如，这里有一个计算小费金额并将结果赋值给变量的表达式：


    ```

    tipAmount = billTotal * tipPercentage;

    ```


    表达式是等号 (=) 右侧的所有内容。在这里，`billTotal` 和 `tipPercentage` 是操作数，而乘号 (`*`) 是运算符。


    ## 创建数值表达式


    在 JavaScript 中，数学计算被称为数值表达式，它结合了数值操作数和算术运算符产生产生数值结果。本节将讨论所有的 JavaScript 算术运算符，并向你展示如何最好使用它们来构建实用且方便的数值表达式。


    表 3-1 列出了你可以在 JavaScript 表达式中使用的基础算术运算符。


    JavaScript 还提供了一些额外的运算符，它们将部分算术运算符与赋值运算符（即用于为变量赋值的谦虚等号 `=`）结合在一起。表 3-2 列出了这些所谓的算术赋值运算符。


    # 表 3-1 JavaScript 算术运算符


    | 运算符 | 名称 | 示例 | 结果 |

    |---|---|---|--|

    | + | 加法 | 10 + 4 | 14 |

    | ++ | 自增 | 10++ | 11 |

    | - | 减法 | 10 - 4 | 6 |

    | - | 取负 | -10 | -10 |

    | -- | 递减 | 10-- | 9 |

    | * | 乘法 | 10 * 4 | 40 |

    | / | 除法 | 10 / 4 | 2.5 |

    | % | 取模 | 10 % 4 | 2 |


    # 表 3-2 JavaScript 算术赋值运算符


    | 运算符 | 示例 | 等效于 |

    |---|---|--|

    | += | x += y | x = x + y |

    | -= | x -= y | x = x - y |

    | *= | x *= y | x = x * y |

    | /= | x /= y | x = x / y |

    | ^= | x ^= y | x = x ^ y |

    | %= | x %= y | x = x % y |


    ## 构建字符串表达式


    字符串表达式是指至少一个操作数是字符串，且表达式的结果是另一个字符串。字符串表达式是非常直观的，因为你只需要处理一个运算符：连接（`+`）。你使用这个运算符在表达式中组合（或连接）字符串。例如，表达式
    `"Java" + "Script"` 返回字符串 `"JavaScript"`。但注意，你也可以在下一节讨论的比较运算符中使用字符串。


    ## 构建比较表达式


    你使用比较表达式来比较两个或多个数字、字符串、变量、属性或函数结果的值。如果表达式为真，则表达式的结果被设置为布尔值 `true`；如果表达式为假，则表达式的结果被设置为布尔值
    `false`。你在编写 JavaScript 代码时会以惊人的频率使用比较，因此理解它们是什么以及你如何使用它们很重要。


    表 3-3 总结了 JavaScript 的比较运算符。


    # 表 3-3 JavaScript 比较运算符


    | 运算符 | 名称 | 示例 | 结果 |

    | --- | --- | --- | --- |

    | == | 等于 | 10 == 10 | true |

    | != | 不等于 | 10 != 5 | true |

    | > | 大于 | 10 > 5 | true |

    | < | 小于 | 10 < 5 | false |

    | >= | 大于等于 | 10 >= 10 | true |

    | <= | 小于等于 | 10 <= 10 | true |

    | === | 严格相等 | 10 === 10 | true |

    | !== | 严格不相等 | 10 !== 5 | true |


    ## 构建逻辑表达式


    你使用逻辑表达式来组合布尔值，特别是用来测试表达式是否为真。表 3-4 列出了逻辑运算符。


    # 表 3-4 逻辑运算符


    | 运算符 | 名称 | 语法 | 返回值 |

    |---|---|---|---|

    | && | 与 (AND) | expr1 && expr2 | 如果 expr1 和 expr2 都为真，则返回 true。 |

    | || | 或 (OR) | expr1 || expr2 | 如果一个或两个表达式为真，则返回 true。 |

    | ! | 非 (NOT) | !expr1 | 如果 expr1 为假，则返回 true。 |


    ## 理解运算符优先级


    在复杂的表达式中，计算的顺序至关重要。例如，考虑表达式 `3+5*2`。如果你从左到右计算，得到的结果是 `16`。为了得到正确的答案，你必须覆盖优先级，让
    `5*2` 先执行。表 3-5 总结了 JavaScript 使用的完整优先级。


    # 表 3-5 运算符优先级


    | 运算符 | 操作 | 优先级 |  |

    | --- | --- | --- | --- |

    | ++ | 自增 | 第一 | R -> L |

    | -- | 递减 | 第一 | R -> L |

    | - | 取负 | 第一 | R -> L |

    | ! | 非 | 第一 | R -> L |

    | *, /, % | 乘法、除法、取模 | 第二 | L -> R |

    | +, - | 加法、减法 | 第三 | L -> R |

    | + | 连接 | 第三 | L -> R |

    | <, <= | 小于、小于等于 | 第四 | L -> R |

    | >, >= | 大于、大于等于 | 第四 | L -> R |

    | == | 等于 | 第五 | L -> R |

    | != | 不等于 | 第五 | L -> R |

    | === | 严格相等 | 第五 | L -> R |

    | !== | 严格不相等 | 第五 | L -> R |

    | && | 与 | 第六 | L -> R |

    | || | 或 | 第六 | L -> R |

    | ?: | 三元运算符 | 第七 | R -> L |

    | = | 赋值 | 第八 | L -> R |

    | +=, -= = 等 | 算术赋值 | 第八 | R -> L |


    ## 控制优先级


    有时你想控制局面并覆盖优先级。这听起来是一件相当奇怪的事情，所以也许需要一个例子。假设你知道物品的最终价格，并且给定税率，你想要知道原始（即税前）价格。


    JavaScript 计算的第一次尝试可能像这样：


    ```

    retailPrice = totalPrice / 1 + taxRate;

    ```


    这不起通。为什么呢？嗯，根据优先级规则，JavaScript 先执行除法后执行加法，所以 `totalPrice` 值首先除以 1，然后加上 `taxRate`
    值，这并不是正确的顺序。


    为了得到正确答案，你需要覆盖优先级，让 `1 + taxRate` 先执行。你通过用括号包裹表达式该部分来覆盖优先级，如下所示：


    ```

    const retailPrice = totalPrice / (1 + taxRate);

    ```


    通常，你可以使用括号来控制 JavaScript 计算表达式的顺序。括号内的项总是先计算，括号外的项按顺序（根据优先级）计算。

