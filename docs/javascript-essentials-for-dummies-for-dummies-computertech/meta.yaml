    | && | AND | expr1 && expr2 | true if both expr1 and expr2 are true; false otherwise.
    |

    | || | OR | expr1 || expr2 | true if one or both of expr1 and expr2 are true;
    false otherwise. |

    | ! | NOT | !expr | true if expr is false; false if expr is true. |


    # Understanding Operator Precedence


    In complex expressions, the order in which the calculations are performed becomes
    crucial. For example, consider the expression 3+5*2. If you calculate from left
    to right, the answer you get is 16 (3+5 equals 8, and 8*2 equals 16). However,
    if you perform the multiplication first and then the addition, the result is 13
    (5*2 equals 10, and 3+10 equals 13).


    To control this ordering problem, JavaScript evaluates the expression according
    to a predefined order of precedence. This order of precedence lets JavaScript
    calculate an expression unambiguously by determining which part of the expression
    it part second, and so on.


    # The order of precedence


    The order of precedence JavaScript uses is determined by the various expression
    operators that I''ve covered so far in this chapter. Table 3-5 summarizes the
    complete order of precedence used by JavaScript.


    For example, Table 3-5 tells you that JavaScript performs multiplication before
    addition. Therefore, the correct answer for the expression 3+5*2 (just discussed)
    is 13.'
