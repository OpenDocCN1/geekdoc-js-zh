  md: "# Chapter 1 JavaScript: The Big Picture\n\nn this chapter, you explore some\
    \ useful JavaScript basics. Don’t worry if you've never programmed before. I take\
    \ you through everything you need to know, step-by-step, nice and easy. As you\
    \ are about to find out, it is really fun to program.\n\n# Adding JavaScript Code\
    \ to a Web Page\n\nOkay, it’s time to roll up your sleeves, crack your knuckles,\
    \ and start coding. This section describes the standard procedure for constructing\
    \ and testing a script and takes you through a couple of examples.\n\n# The <script>\
    \ tag\n\nThe basic container for a script is, naturally enough, the HTML <script>\
    \ tag and its associated </script> end tag:\n\n```\n<script>\n  JavaScript statements\
    \ go here\n</script>\n```\n\n+   * Getting a feel for programming in general,\
    \ and JavaScript in particular\n* Checking out the tools you need to get coding\n\
    * Adding comments to your JavaScript code\n* Storing your code in a separate JavaScript\
    \ file"
  merge: -1
  pgno: 16
- img_proc: true
  md: "# Where do you put the <script> tag?\n\nWith certain exceptions, it doesn't\
    \ matter a great deal where you put your <script> tag. Some people place the tag\
    \ between the page's </head> and <body> tags. The HTML standard recommends placing\
    \ the <script> tag within the page header (that is, between <head> and </head>),\
    \ so that's the style I use in this book:\n\n```\n<DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Where do you put the script\
    \ tag?</title>\n<script>\n  JavaScript statements go here\n</script>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\nHere are the exceptions to the put-script-anywhere\
    \ technique:\n\n+   - If your script is designed to write data to the page, the\
    \ <script> tag must be positioned within the page body (that is, between the <body>\
    \ and </body> tags) in the exact position where you want the text to appear.\n\
    - If your script refers to an item on the page (such as a form object), the script\
    \ must be placed after that item.\n- With many HTML tags, you can add one or more\
    \ JavaScript statements as attributes within the tag.\n\nIt's perfectly acceptable\
    \ to insert multiple <script> tags within a single page, as long as each one has\
    \ a corresponding </script> end tag, and as long as you don't put one <script>\
    \ block within another one.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_17_0.png)"
  merge: -1
  pgno: 17
- img_proc: true
  md: "# Example #1: Displaying a message to the user\n\nYou're ready to construct\
    \ and try out your first script. This example shows you the simplest of all JavaScript\
    \ actions: display- a basic message to the user. The following code shows the\
    \ script within an HTML file:\n\n```\n<DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \  <meta charset=\"utf-8\">\n  <title>Displaying a Message to the User</title>\n\
    \  <script>\n    alert(\"Hello JavaScript World!\");\n  </script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\nAs shown in here, place the script within the header\
    \ of a page, save the file, and then open the HTML file within your browser.\n\
    \nThis script consists of just a single line:\n\n```\nalert(\"Hello JavaScript\
    \ World!\");\n```\n\nThis is called a statement, and each statement is designed\
    \ to perform a single JavaScript task. Your scripts will range from simple programs\
    \ with just few statements to huge projects consisting hundreds of statements.\n\
    \nYou may be wondering about the semicolon (;) that appears at the end of the\
    \ statement. Good eye. You use the semicolon to mark the end of each of your JavaScript\
    \ statements."
  merge: -1
  pgno: 18
- img_proc: true
  md: 'In the example, the statement runs the JavaScript alert method, which displays
    to the user whatever message is enclosed within the parentheses (which could be
    a welcome message, an announcement of new features on your site, an advertisement
    for a promotion, and so on). Figure 1-1 shows the message when you open the file.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_0.png)


    FIGURE 1-1: This "alert" message appears when you open the HTML file containing
    the example script.


    How did the browser know to run the JavaScript statement? When a browser processes
    (parses, in the vernacular) a page, it basically starts at the beginning of the
    HTML file and works its way, one line at a time. If it trips over a <script> tag,
    it knows one or more JavaScript statements are coming, and it automatically executes
    those statements, in order, as soon as it reads them. The exception is when JavaScript
    statements are enclosed within a function, which I explain in Chapter 5.


    One of the cardinal rules of JavaScript programming is "one statement, one line."
    That is, each statement must appear on only a single line, and there should be
    no more than one statement on each line. I said "should" in the second part of
    the previous sentence because it is possible to put multiple statements on a single
    line, as long as you separate each statement with a semicolon (;). There are rare
    times when it''s necessary to have two or more statements on one line, but you
    should avoid it for the bulk of your programming because multiple-statement lines
    are difficult to read and troubleshoot.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_19_1.png)


    # Example #2: Writing text to the page


    One of JavaScript''s most powerful features is the capability to write text and
    even HTML tags and CSS rules to the web page on-the-fly. That is, the text (or
    whatever) gets inserted into the


    8 JavaScript Essentials For Dummies'
  merge: -1
  pgno: 19
- img_proc: true
  md: "page when a web browser loads the page. What good that? For one thing, it's\
    \ ideal for time-sensitive data. For example, you may want to display the date\
    \ and time that a web page was modified so that visitors know how old (or new)\
    \ the page is. Here's some code that shows just a script:\n\n```\n<DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Writing Data\
    \ to the Page</title>\n</head>\n<body>\n  This is a regular line of text.<br>\n\
    \  <script>\n    document.write(\"Last modified: \" + document.lastModified)\n\
    \  </script>\n  <br>This is another line of regular text.\n</body>\n</html>\n\
    ```\n\nNotice how the script appears within the body of the HTML document, which\
    \ is necessary whenever you want to write data to the page. Figure 1-2 shows the\
    \ result.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_20_0.png)\n\nFIGURE 1-2:\
    \ When you open the file, the file displays the date and time the file was last\
    \ modified.\n\nThis script makes use of the document object, which is a built-in\
    \ JavaScript construct that refers to whatever HTML file (document) the script\
    \ resides in (check out Chapter 6 for more about the document object). The document.write()\
    \ statement tells the browser to insert whatever is within the parentheses\n\n\
    # CHAPTER 1 JavaScript: The Big Picture 9"
