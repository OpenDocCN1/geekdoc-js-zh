- md: "<channel|>## Chapter 6\n## Coding the Document Object Model\n\nI've talked\
    \ a lot of JavaScript over the past few chapters, but in a very real sense that\
    \ all has been just the programming equivalent of noshing on a few appetizers.\
    \ Now it's time to sit down for the main course: programming the Document Object\
    \ Model.\n\nIn this chapter, you explore the fascinating world of the Document\
    \ Object Model. You learn lots of powerful coding techniques that enable you to\
    \ make your web pages do almost anything you want to do. You learn, too, that\
    \ this is where web coding becomes fun and maybe just a little addictive (in a\
    \ good way, I promise).\n\n## Getting Familiar with Objects\n\nTo write truly\
    \ useful scripts, you have to do what JavaScript was designed to do from the start:\
    \ Manipulate the web page that it is displaying. That's what JavaScript is all\
    \ about, and that manipulation can come in many different forms:\n\n- Add text\
    \ and HTML attributes to an element.\n- Modify a CSS property of a class or other\
    \ selector.\n- Store data in the browser's internal storage.\n- Validate a form's\
    \ data before submitting it.\n\nThe bold items in this list are examples of the\
    \ “things” that you can work with, and they're special for no other reason they're\
    \ programmable. In JavaScript parlance, these “programmable things” are called\
    \ objects.\n\nYou can work with objects in JavaScript in any of the following\
    \ ways:\n\n- You can read and make changes to the object's properties.\n- You\
    \ can make the object perform a task by activating a method associated with the\
    \ object.\n- You can define a procedure that runs whenever a particular event\
    \ happens to the object.\n\n## Working with object properties\n\nYou refer to\
    \ a property by using the syntax in the following generic expression:\n\n```\n\
    object.property\n```\n\n- object: The object that has the property\n- property:\
    \ the name of the property you want to work with\n\nFor example, consider the\
    \ following expression:\n\n```\ndocument.location\n```\n\nThis expression refers\
    \ to the document object's location property, which holds the address of the document\
    \ currently displayed in the browser window. (In conversation, you'd pronounce\
    \ this as “document dot location.”) The following code shows a simple one-line\
    \ script that displays this property in the console, as shown in Figure 6-1.\n\
    \n```\nconsole.log(document.location);\n```\n\n**img/e1fc091e438a5ffb052e3126ba2bbd1f_86_0.png**\n\
    \n**Figure 6-1:** This script displays the document.location property in a console\
    \ message.\n\nBecause the property always contains a value, you're free to use\
    \ property expressions in just any type of JavaScript statement and as an operand\
    \ in a JavaScript expression. For example, the following statement assigns the\
    \ current value of the `document.location` property to a variable named `currentUrl`:\n\
    \n```\nconst currentUrl = document.location;\n```\n\nSimilarly, the following\
    \ statement includes `document.location` as part of a string expression:\n\n```\n\
    const message = \"The current address is \" + \ndocument.location + \".\";\n```\n\
    \nSome properties are “read only,” which means your code can only read the current\
    \ value and can't change it. However, many properties are “read/write,” which\
    \ means you can also change their values. To change the value of a property, use\
    \ the following generic syntax:\n\n```\nobject.property = value\n```\n\nHere's\
    \ what the various parts are:\n\n- **object:** The object that has the property\n\
    - **property:** the name of the property you want to change\n- **value:** a literal\
    \ value (such as a string or number) or an expression that returns the value to\
    \ which you want to set the property\n\nHere's an example:\n\n```\nconst newAddress\
    \ = prompt(\"Enter the address you\nwant to surf to:\");\ndocument.location =\
    \ newAddress;\n```\n\nThis script prompts the user for a web page address and\
    \ stores the result in the newAddress variable. This value is then used to change\
    \ the document.location property, in which case tells the browser to open the\
    \ specified address.\n\n## Working with object methods\n\nTo run a method, begin\
    \ with the simplest case, which is a method that takes no arguments:\n\n```\n\
    object.method()\n```\n\nHere's what the various parts are:\n\n- object: The object\
    \ that has the method you want to work with\n- method: the name of the method\
    \ you want to execute\n\nFor example, consider the following statement:\n\n```\n\
    history.back();\n```\n\nThis runs the history object's back() method, which tells\
    \ the browser to go back.\n\nIf a method requires arguments, you use the following:\n\
    \n```\nobject.method(argument1, argument2)\n```\n\nFor example, consider the following\
    \ statement:\n\n```\nconfirm(\"Do you want?\");\n```\n\nFinally, as with properties,\
    \ if the method returns a value, you can assign it to a variable.\n\n## Introducing\
    \ the Document Model\n\nHere's some code for a simple page:\n\n```html\n<html\
    \ lang=\"en\">\n  <head>\n    <title>So Many Recipes</title>\n  </head>\n  <body>\n\
    \    <header>\n      <h1>Above and Beyond</h1>\n    </header>\n    <main>\n  \
    \    <p>\n        <a href=\"kale\">kale</a>\n      </p>\n    </main>\n  </body>\n\
    </html>\n```\n\nOne way to examine this code is hierarchically. The arrows represent\
    \ parent–child relationships. Also, elements on the same level — such as header\
    \ and main — are known as siblings.\n\nYou have several points to consider here:\n\
    \n* Every box in 6-2 represents an object.\n* Every object in 6-2 is one of three\
    \ types: element, text, or attribute.\n* The page as a whole is represented by\
    \ the document object.\n\nTherefore, this object representation is known as the\
    \ Document Object Model, or the DOM as it is usually called. The DOM enables your\
    \ JavaScript code to access the complete structure of an HTML document.\n\n**img/e1fc091e438a5ffb052e3126ba2bbd1f_89_0.png**\n\
    \nWhen speaking of hierarchies, if object P contains object C, object P is said\
    \ to be the parent of C, and object C is said to be the child of P.\n\n## Specifying\
    \ Elements in Your Code\n\nElements represent the tags in a document, so you'll\
    \ be using them constantly. This section shows you several methods for referencing\
    \ one or more elements.\n\n### Specifying an element by id\n\nIf it's a specific\
    \ element you want to work with in your script, you can reference the element\
    \ directly by first assigning an id attribute:\n\n```\n<div id=\"kale-quotations\"\
    >\n```\n\nWith that, you can then refer to the element in your code using the\
    \ document object's getElementById() method:\n\n```\ndocument.getElementById(id)\n\
    ```\n\nNote: id is a string representing the id attribute of the element you want\
    \ to work with.\n\nFor example, the following statement returns a reference to\
    \ the previous <div> tag (the one that has id=\"kale-quotations\"):\n\n```\ndocument.getElementById(\"\
    kale-quotations\")\n```\n\nWhen you're coding the document object, don't put your\
    \ <script> tag in the web page's head section (that is, between the <head> and\
    \ </head> tags). If you place you code there, the web browser will run your code\
    \ before it has a chance to create the document object, which means your code\
    \ will fail, big time. Instead, place your <script> tag at the bottom of the web\
    \ page, just before the </body> tag.\n\n**img/e1fc091e438a5ffb052e3126ba2bbd1f_90_0.png**\n\
    \n### Specifying elements by tag name\n\nBesides working with individual elements,\
    \ you can also work with collections of elements. One such collection is the set\
    \ of all elements in a page that use the same tag name. For example, you could\
    \ reference all the <a> tags or all the <div> tags."
  mdcn: "\n## 第 6 章\n## 编写文档对象模型\n\n在过去的几个章节中，我讨论了很多 JavaScript，但从现实意义上说，那都只是编程世界的“垫了几道开胃菜”。现在是时候坐下来吃主菜了：编写文档对象模型。\n\
    \n在本章中，你将探索文档对象模型（DOM）这个迷人的世界。你将学习许多强大的编码技术，这些技术能让你的网页实现几乎任何你想的功能。你还会发现，这正是 Web\
    \ 编码变得有趣甚至可能让人小微上瘾的地方（我保证是好事）。\n\n## 熟悉对象\n\n要编写真正实用的脚本，你必须完成 JavaScript 设计之初想要的任务：操作它正在显示的网页。这就是\
    \ JavaScript 的核心所在，而这种操作可以通过许多不同的形式存在：\n\n- 为元素添加文本和 HTML 属性。\n- 修改类或其他选择器的 CSS\
    \ 属性。\n- 在浏览器的内部存储中存储数据。\n- 在提交表单之前验证表单数据。\n\n列表中的**粗体项目**是你可以处理的“实体”示例，它们之所以特殊，仅仅是因为它们是可编程的。在\
    \ JavaScript 术语中，这些“可编程实体”被称为**对象**。\n\n你可以通过以下任何方式在 JavaScript 中操作对象：\n\n- 读取并修改对象的属性。\n\
    - 通过激活与对象关联的方法来让对象执行某个任务。\n- 定义一个程序，每当对象发生特定事件时运行该程序。\n\n## 使用对象属性\n\n你通过以下通用表达式中的语法来引用属性：\n\
    \n```\nobject.property\n```\n\n- object: 拥有该属性的对象\n- property: 你想要处理的属性名称\n\n\
    例如，考虑以下表达式：\n\n```\ndocument.location\n```\n\n该表达式引用文档对象的 location 属性，它存储了当前在浏览器窗口中显示的文档地址。（在口语中，你将其读作“document\
    \ dot location”）下面的代码显示了一个简单的单行脚本，可以在控制台中显示该属性，如图 6-1 所示。\n\n```\nconsole.log(document.location);\n\
    ```\n\n**img/e1fc091e438a5ffb052e3126ba2bbd1f_86_0.png**\n\n**图 6-1：** 该脚本在控制台消息中显示\
    \ document.location 属性。\n\n由于属性始终包含一个值，你可以自由在任何类型的 JavaScript 语句中使用属性表达式，并将其作为\
    \ JavaScript 表达式的操作数。例如，以下语句将 `document.location` 属性的当前值赋值给名为 `currentUrl` 的变量：\n\
    \n```\nconst currentUrl = document.location;\n```\n\n同样，以下语句将 `document.location`\
    \ 作为字符串表达式的一部分：\n\n```\nconst message = \"The current address is \" + \ndocument.location\
    \ + \".\";\n```\n\n某些属性是“只读的”，这意味着你的代码只能读取当前值而不能更改它。然而，许多属性是“可读可写的”，这意味着你也可以更改它们的值。要更改属性的值，请使用以下通用语法：\n\
    \n```\nobject.property = value\n```\n\n这里各个部分的含义如下：\n\n- **object：** 拥有该属性的对象\n\
    - **property：** 你想要更改的属性名称\n- **value：** 字面量值（如字符串或数字）或返回你想要设置的属性的值的表达式\n\n这里有一个例子：\n\
    \n```\nconst newAddress = prompt(\"Enter the address you\nwant to surf to:\");\n\
    document.location = newAddress;\n```\n\n该脚本提示用户输入网页地址并将结果存储在 `newAddress` 变量中。然后使用该值来更改\
    \ `document.location` 属性，这会告诉浏览器打开指定的地址。\n\n## 使用对象方法\n\n要运行方法，从最简单的情况开始，即不带任何参数的方法：\n\
    \n```\nobject.method()\n```\n\n这里各个部分的含义如下：\n\n- object: 拥有你想要处理的方法的对象\n- method:\
    \ 你想要执行的方法名称\n\n例如，考虑以下语句：\n\n```\nhistory.back();\n```\n\n这会运行 history 对象的 `back()`\
    \ 方法，告诉浏览器后退。\n\n如果方法需要参数，请使用以下格式：\n\n```\nobject.method(argument1, argument2)\n\
    ```\n\n例如，考虑以下语句：\n\n```\nconfirm(\"Do you want?\");\n```\n\n最后，与属性一样，如果方法返回一个值，你可以将其赋值给变量。\n\
    \n## 引入文档模型\n\n以下是一个简单页面的代码：\n\n```html\n<html lang=\"en\">\n  <head>\n    <title>So\
    \ Many Recipes</title>\n  </head>\n  <body>\n    <header>\n      <h1>Above and\
    \ Beyond</h1>\n    </header>\n    <main>\n      <p>\n        <a href=\"kale\"\
    >kale</a>\n      </p>\n    </main>\n  </body>\n</html>\n```\n\n检查此代码的一种方法是分层级的。箭头代表父-子关系。此外，处于同一层级的元素（如\
    \ `header` 和 `main`）被称为兄弟元素。\n\n你在此处有几点需要考虑：\n\n* 6-2 中的每个框都代表一个对象。\n* 6-2 中的每个对象都是三种类型之一：元素、文本或属性。\n\
    * 整个页面由 `document` 对象表示。\n\n因此，这种对象的表示被称为文档对象模型，通常称为 **DOM**。DOM 允许你的 JavaScript\
