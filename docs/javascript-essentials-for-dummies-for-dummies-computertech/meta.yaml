    \ of function syntax creates a so-called anonymous function because — that’s right\
    \ — the function has no name.\n\nWhy use anonymous functions? Well, first, you\
    \ don't have to if you don't want to. Second, the main reason to use anonymous\
    \ functions is to avoid creating a named object when you don't need to. Every\
    \ large web project has a huge namespace, which refers to the full collection\
    \ of identifiers you assign to things like variables and functions. The larger\
    \ the namespace, the greater the chance of a namespace collision, where you use\
