    \n使用单行语法还是块语法，取决于你当 `expression` 返回 `true` 结果时想要运行的语句。如果你只有一条语句，可以使用任何一种语法。如果你有多个语句，请使用块语法。\n\
    \n考虑以下示例：\n\n```javascript\nif (totalSales != 0) {\n  const grossMargin = (totalSales\
