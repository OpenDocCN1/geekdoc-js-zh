    \ | Tests whether substring appears in string |\n| indexOf(substring, start) |\
    \ Searches string for the first instance of substring |\n| lastIndexOf(substring,\
    \ start) | Searches string for the last instance of substring |\n| startsWith(substring,\
    \ start) | Tests whether substring appears at the beginning of string |\n\n# Learning\
    \ the methods to extract substrings\n\nFinding a substring is one thing, but you'll\
    \ often have to extract a substring, as well. For example, if the user enters\
