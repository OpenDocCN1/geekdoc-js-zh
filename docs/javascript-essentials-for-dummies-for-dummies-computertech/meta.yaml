    \  makeBackgroundRed\n);\ndocument.getElementById('bgWhite').\naddEventListener(\n\
    \  'click',\n  makeBackgroundWhite\n);\n</script>\n```\n\nThe script declares\
    \ two named functions: makeBackgroundRed() and makeBackgroundWhite(). The code\
    \ then creates two event listeners. One of them listens for clicks on the button\
    \ that has the id bgRed and, when a click is detected, runs the makeBackgroundRed()\
    \ callback function. The other event listener listens for clicks on the button\
    \ that has the id bgWhite, and when a click is detected, runs the makeBackgroundWhite()\
    \ callback function. Refer to Chapter 6 to get the details on the document object\
    \ and the getElementById() and addEventListener methods.\n\nAgain, you have two\
    \ functions that don't need to be, so you can remove them from the namespace by\
    \ replacing the callbacks with anonymous functions. Here's the revised code:\n\
    \n```\n<body>\n  <button id=\"bgRed\">\n    Make Background Red\n  </button>\n\
    \  <button id=\"bgWhite\">\n    Make Background White\n  </button>\n  <script>\n\
    \    document.getElementById('bgRed').\n    addEventListener(\n      'click',\n\
    \      function() {\n        document.body.style.backgroundColor = 'red';\n  \
    \    }\n    );\n  </script>\n```"
