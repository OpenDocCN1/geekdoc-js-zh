  md: '# Chapter 8

    Coding Strings and Dates


    Although your JavaScript code will spend much of its time dealing with web page
    knickknacks such as HTML tags and CSS properties, it will also perform the most
    behind-the-scenes chores that require manipulating strings and dealing with dates
    and times. To help you go through these tasks, in this chapter you explore two
    of JavaScript''s built-in objects: the String object and the Date object. You
    investigate the most important properties of each object and master the most used
    methods.


    # Manipulating Strings


    I''ve used dozens of examples of strings so far in this book. These include not
    only string literals (such as "JavaScript Essentials For Dummies") but also methods
    that return strings (such as the prompt() method). So, it should be clear by now
    that strings play a major role in all JavaScript programming, and it will be a
    rare script that doesn''t have to deal with strings in some fashion.


    For this reason, it pays to become proficient at manipulating strings, which includes
    locating text within a string and extracting text from a string. You''ll find
    out all about that and more in this section.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Any string you work with — whether it''s a string literal or the result of
    a method or function that returns a string — is a String object. So, for example,
    the following two statements are equivalent:


    ```

    const bookName = new String("JavaScript Essentials For Dummies");

    bookName = "JavaScript Essentials For Dummies";

    ```


    This means that you have a bit of flexibility when applying the properties and
    methods of String objects. For example, the String object has a length property
    that I describe in the next section. The following are all legal JavaScript expressions
    that use this property:


    ```

    bookName.length;

    "JavaScript Essentials For Dummies".length;

    prompt("Enter the book name").length;

    myFunction().length;

    ```


    The last example assumes that myFunction() returns a string value.


    # Working with string templates


    Before diving in to the properties and methods of the String object, take a second
    to examine a special type of string that''s designed to solve three string-related
    problems that will come again and again in your coding career:


    +   **Handling internal quotation marks:** String literals are surrounded by quotation
    marks, but what do you when you need the same type of quotation mark inside the
    string?

    One solution is to use a different type of quotation mark to delimit the string.
    For example, this is illegal:


    ```

    ''There''s got to be some better way to do this.''

    ```'
