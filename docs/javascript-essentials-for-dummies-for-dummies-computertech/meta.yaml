    # What You Need to Get Started


    One of the nicest things about HTML and CSS is that the hurdles you have to learn
    to get started are not only short but few in number. In fact, you really need
    two things, both of which are free: a text editor to enter the text, tags, and
    properties; and a browser to view the results. (You''ll also need a web server
    to host the finished pages.) Yes, there are high-end text editors and fancy graphics
    programs, but these fall into the “Bells and Whistles” category; you can create
    perfectly respectable web pages without them.


    The basic requirements for JavaScript programming are exactly the same as for
    HTML: a text editor and a browser. Again, programs are available to help you write
    and test your scripts, but you don''t need them.


    # Dealing with Two Exceptional Cases


    In this book, I make a couple of JavaScript assumptions related to the people
    who''ll be visiting the pages you post to the web:


    +   * Those people have JavaScript enabled in their web browser.

    * Those people are using a relatively up-to-date version of the modern web browser,
    such as Chrome, Edge, Safari, or Firefox.


    These are pretty safe assumptions, but it pays to be a bit paranoid and wonder
    how you might handle the teensy percentage of people who don''t pass one or both
    tests.


    # Handling browsers with JavaScript turned off


    You don''t have to worry about web browsers not being able to handle JavaScript,
    because all modern browsers have supported JavaScript for a very long time. You
    may, however, want to worry'
