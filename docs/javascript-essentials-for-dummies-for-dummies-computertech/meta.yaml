- img_proc: true
  md: "When JavaScript stumbles upon the for statement, it changes into its for-loop\
    \ outfit and follows this seven-step process:\n\n+   1. Set counter equal to start.\n\
    2. Evaluate counterExpression in the for statement.\n3. If counterExpression is\
    \ true, continue with Step 4; if counterExpression is false, skip to Step 7.\n\
    4. Execute each of the statements in the block.\n5. Use counterUpdate to increment\
    \ (or whatever) counter.\n6. Return to Step 2.\n7. Exit the loop (that is, execute\
    \ the next statement that occurs after the for).\n\nAs an example, the following\
    \ code shows how to use for to rewrite the inefficient code shown earlier in this\
    \ chapter:\n\n```\nlet sum = 0;\nlet num;\nfor (let counter = 1; counter <= 3;\
