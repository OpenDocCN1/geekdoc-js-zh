  md: "# When an event fires\n\nOne of the most common ways that JavaScript functions\
    \ are called in response to some event. Events are such an important topic that\
    \ I devote a big chunk of Chapter 6 to them. For now, check out a relatively straightforward\
    \ application: executing the function when the user clicks a button. The following\
    \ code shows one way to do it:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>Calling a function in response to an event</title>\n\
    \  <script>\n    function makeBackgroundRed() {\n      document.body.style.backgroundColor=\"\
    red\";\n    }\n    function makeBackgroundWhite() {\n      document.body.style.backgroundColor=\"\
    white\";\n    }\n  </script>\n</head>\n<body>\n  <button onclick=\"makeBackgroundRed()\"\
    >\n    Make Background Red\n  </button>\n  <button onclick=\"makeBackgroundWhite()\"\
    >\n    Make Background White\n  </button>\n</body>\n</html>\n```\n\nWhat I've\
    \ done here is place two functions in the script: makeBackgroundRed changes the\
    \ page background to red, as before, and makeBackgroundWhite changes the background\
    \ color back to white."
  merge: -1
  pgno: 71
- img_proc: true
  md: "The buttons are standard HTML button elements (check out Figure 5-3), each\
    \ of which includes the onclick attribute. This attribute defines a handler —\
    \ that is, the function to execute for the event that occurs when the user clicks\
    \ the button. For example, consider the first button:\n\n```\n<button onclick=\"\
    makeBackgroundRed()\">\n```\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_72_0.png)\n\
    \nFigure 5-3: An example of calling a function in response to an event.\n\nThe\
    \ onclick attribute here says, in effect, “When somebody clicks this button, call\
    \ the function makeBackgroundRed.\"\n\n# # Passing One or More Values to a Function\n\
    \nOne of the main reasons to use functions is to gain control over when chunk\
    \ of JavaScript code gets executed. The previous section, discusses how easy it\
    \ is to use functions to set things up so that code doesn’t run until the user\
    \ clicks a button.\n\nHowever, there’s another major reason to use functions:\
    \ to avoid repeating code unnecessarily. To understand what I mean, consider the\
    \ two functions from the previous section:\n\n```\nfunction makeBackgroundRed()\
    \ {\n    document.body.style.backgroundColor= \"red\";\n}\nfunction makeBackgroundWhite()\
    \ {\n    document.body.style.backgroundColor= \"white\";\n}\n```"
  merge: -1
  pgno: 72
- img_proc: true
  md: "These functions perform the same task — changing the background color — and\
    \ the only difference between them is that one changes the color to red and the\
    \ other changes it to white. Whenever you end up with two or more functions that\
    \ do essentially the same thing, you know that your code is inefficient.\n\nSo\
    \ how do you make the code more efficient? That's where the arguments mentioned\
    \ earlier come into play. An argument is a value that is \"sent\" — or passed,\
    \ in programming terms — to the function. The argument acts just like a variable,\
    \ and it automatically stores value is sent.\n\n# Passing one value to a function\n\
    \nAs an example, you can take the previous two functions, reduce them to a single\
    \ function, and set up the color value as an argument. Here's a new function that\
    \ does that:\n\n```\nfunction changeBackgroundColor(newColor) {\n  document.body.style.backgroundColor\
    \ = \n  newColor;\n}\n```\n\nThe argument is named newColor and is added between\
    \ the parentheses that occur after the function name. JavaScript declares newColor\
    \ as a variable automatically, so you don't need a separate let or const statement.\
    \ The function then uses the newColor value to change the background color. So\
    \ how do you pass a value to the function? The following code presents a sample\
    \ file that does so:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
    \ charset=\"utf-8\">\n  <title>Passing a single value to a function</title>\n\
    \  <script>\n    function changeBackgroundColor(newColor) {\n      document.body.style.backgroundColor\
    \ = \n    newColor;\n    }\n  </script>\n```\n\n62 JavaScript Essentials For Dummies"
  merge: -1
