    # Chapter 6

    Coding the Document Object Model


    > ''ve talked a lot of JavaScript over the past few chapters, but in a very real
    sense that all has been just the programming equivalent of noshing on a few appetizers.
    Now it''s time to sit down for the main course: programming the Document Object
    Model.


    In this chapter, you explore the fascinating world of the Document Object Model.
    You learn lots of powerful coding techniques that enable you to make your web
    pages do almost anything you want to do. You learn, too, that this is where web
    coding becomes fun and maybe just a little addictive (in a good way, I promise).


    # Getting Familiar with Objects


    To write truly useful scripts, you have to do what JavaScript was designed to
    do from the start: Manipulate the web page that it''s displaying. That''s what
    JavaScript is all about, and that manipulation can come in many different forms:


    +   - Add text and HTML attributes to an element.

    - Modify a CSS property of a class or other selector.'
  - '[PAGE 85]


    +   >> Store data in the browser''s internal storage.


    +   >> Validate a form''s data before submitting it.


    The bold items in this list are examples of the “things” that you can work with,
    and they''re special for no other reason they''re programmable. In JavaScript
    parlance, these “programmable things” are called objects.


    You can work with objects in JavaScript in any of the following ways:


    +   >> You can read and make changes to the object''s properties.


    +   >> You can make the object perform a task by activating a method associated
    with the object.


    +   >> You can define a procedure that runs whenever a particular event happens
    to the object.


    # Working with object properties


    You refer to a property by using the syntax in the following generic expression:


    ```

    object.property

    ```


    +   >> object: The object that has the property


    +   >> property: The name of the property you want to work with


    For example, consider the following expression:


    ```

    document.location

    ```


    This expression refers to the document object''s location property, which holds
    the address of the document currently displayed in the browser window. (In conversation,
    you''d pronounce this as “document dot location.”) The following code shows a
    simple one-line script that displays this property in the console, as shown in
    Figure 6-1.


    ```

    console.log(document.location);

    ```'
  - "[PAGE 86]\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_86_0.png)\n\n**Figure 6-1:**\
    \ This script displays the document.location property in a console message.\n\n\
    Because the property always contains a value, you're free to use property expressions\
    \ in just any type of JavaScript statement and as an operand in a JavaScript expression.\
    \ For example, the following statement assigns the current value of the `document.location`\
    \ property to a variable named `currentUrl`:\n\n```\nconst currentUrl = document.location;\n\
    ```\n\nSimilarly, the following statement includes `document.location` as part\
    \ of a string expression:\n\n```\nconst message = \"The current address is \"\
    \ + \ndocument.location + \" \".\"\";\n```\n\nSome properties are “read only,”\
    \ which means your code can only read the current value and can't change it. However,\
    \ many properties are “read/write,” which means you can also change their values.\
    \ To change the value of a property, use the following generic syntax:\n\n```\n\
    object.property = value\n```\n\nHere's what the various parts are:\n\n+   - **object:**\
    \ The object that has the property\n- **property:** The name of the property you\
    \ want to change\n- **value:** A literal value (such as a string or number) or\
    \ an expression that returns the value to which you want to set the property"
  - '[PAGE 87]


    Here''s an example:


    ```

    const newAddress = prompt("Enter the address you

    want to surf to:");

    document.location = newAddress;

    ```


    This script prompts the user for a web page address and stores the result in the
    newAddress variable. This value is then used to change the document.location property,
    in which case tells the browser to open the specified address.


    # Working with object methods


    To run a method, begin with the simplest case, which is a method that takes no
    arguments:


    ```

    object.method()

    ```


    Here''s what the various parts are:


    +   - object: The object that has the method you want to work with

    - method: The name of the method you want to execute


    For example, consider the following statement:


    ```

    history.back();

    ```


    This runs the history object''s back() method, which tells the browser to go back
    to the previously visited page.


    If a method requires arguments, you use the following generic syntax:


    ```

    object.method (argument1, argument2, ...)

    ```


    For example, consider the confirm() method, used in the following statement, which
    takes a single argument — a string that specifies the text to display to the user:


    ```

    confirm("Do you want to go back?")

    ```'
  - "[PAGE 88]\n\nFinally, as with properties, if the method returns a value, you\
    \ can assign value to a variable (as I do with the confirm() method in the earlier\
    \ example) or you can incorporate the method into an expression.\n\n# Introducing\
    \ the Document Object Model\n\nHere's some source code for a simple web page:\n\
    \n```\n```html lang=\"en\">\n  <head>\n    <title>So Many Kale Recipes</title>\n\
    \  </head>\n  <body>\n    <header>\n      <h1>Above and Beyond the Kale of Duty</h1>\n\
    \    </header>\n    <main>\n      <p>\n        Do you love to cook with <a href=\"\
    kale.html\">kale</a>?\n      </p>\n    </main>\n  </body>\n</html>\n```\n```\n\
    \nOne way to examine this code is hierarchically. That is, the html element is,\
    \ in sense, the topmost element because every other element is contained within\
    \ it. The next level down in the hierarchy contains the head and body elements.\
    \ The head element contains a title element, which contains the text So Many Kale\
    \ Recipes. Similarly, the body element contains a header element and a main element.\n\
    \nHierarchies are almost always more readily grasped in visual form, as so Figure\
    \ 6-2 graphs the page elements hierarchically."
  - '[PAGE 89]


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_89_0.png)


    When speaking of object hierarchies, if object P contains object C, object P is
    said to be the parent of object C, and object C is said to be the child of object
    P. In 6-2, the arrows represent parent–to–child relationships. Also, elements
    on the same level — such as the header and main elements — are known as siblings.


    You have several key points to consider here:


    +   * Every box in Figure 6-2 represents an object.

    * Every object in Figure 6-2 is one of three types: element, text, or attribute.

    * Every object in Figure 6-2, regardless of its type, is called a node.

    * The page as a whole is represented by the document object.


    Therefore, this hierarchical object representation is known as the Document Object
    Model, or the DOM as it''s usually called. The DOM enables your JavaScript code
    to access the complete structure of an HTML document.'
  - '[PAGE 90]


    # Specifying Elements in Your Code


    Elements represent the tags in a document, so you''ll be using them constantly
    in your code. This section shows you several methods for referencing one or more
    elements.


    # Specifying an element by id


    If it''s a specific element you want to work with in your script, you can reference
    the element directly by first assigning it an id attribute:


    ```

    <div id="kale-quotations">

    ```


    With that, you can then refer to the element in your code using the document object''s
    getElementById() method:


    ```

    document.getElementById(id)

    ```


    Note: id is a string representing the id attribute of the element you want to
    work with.


    For example, the following statement returns a reference to the previous <div>
    tag (the one that has id="kale-quotations"):


    ```

    document.getElementById("kale-quotations")

    ```


    When you''re coding the document object, don''t put your <script> tag in the web
    page''s head section (that is, between the <head> and </head> tags). If you place
    you code there, the web browser will run your code before it has a chance to create
    the document object, which means your code will fail, big time. Instead, place
    your <script> tag at the bottom of the web page, just before the </body> tag.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_90_0.png)


    # Specifying elements by tag name


    Besides working with individual elements, you can also work with collections of
    elements. One such collection is the set of all elements in a page that use the
    same tag name. For example, you could reference all the <a> tags or all the <div>
    tags.'
