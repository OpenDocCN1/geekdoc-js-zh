    # Chapter 5 Harnessing the Power of Functions


    Almost every JavaScript project beyond the simplest scripts

    will require one or more (usually a lot more) tasks or cal-

    culations that aren''t part of the JavaScript language or any

    Web API. What''s a coder to do? You roll up your sleeves and then

    roll your own code that accomplishes the task or runs the

    calculation.


    This chapter shows how to create such do-it-yourself code.

    In the pages that follow, you explore the powerful and infinitely

    useful realm of custom functions, where you craft reusable code

    that performs tasks that out-of-the-box JavaScript can''t.


    # Getting to Know the Function Structure


    A function is a group of JavaScript statements that are separate

    from the rest of the script and that perform a designated task.

    When your script needs to perform that task, you tell it to run —

    or execute, in the vernacular — the function.'
  - "[PAGE 67]\n\nThe basic structure of function looks like this:\n\n```\nfunction\
    \ functionName([arguments]) {\n  JavaScript statements\n}\n```\n\nHere's a summary\
    \ of the various parts of a function:\n\n+   - function: Identifies the block\
    \ of code that follows it as a function.\n- functionName: A unique name for the\
    \ function. The naming rules and guidelines that I outline for variables in Chapter\
    \ 2 also apply to function names.\n- arguments: One or more values that are passed\
    \ to the function and act as variables within the function. Arguments (or parameters,\
    \ they're sometime called) are typically one or more values that the function\
    \ uses as the raw materials for its tasks or calculations. You always enter arguments\
    \ between parentheses after the function name, and you separate multiple arguments\
    \ with commas. If you do not use arguments, you must still include the parentheses\
    \ after the function.\n- JavaScript statements: This is the code that performs\
    \ the function's tasks or calculations.\n\nNote, too, the use of braces { and\
    \ }. These are used to enclose the function's statements within a block, which\
    \ tells you (and the browser) where the function's code begins and ends. There\
    \ are only two rules for these braces appear:\n\n+   - The opening brace must\
    \ appear after the function's parentheses and before the first function statement.\n\
    - The closing brace must appear after the last function statement.\n\n# Making\
    \ a Function Call\n\nAfter your function is defined, you'll eventually need to\
    \ tell the browser to execute — or call — the function. There are three ways to\
    \ do this:"
