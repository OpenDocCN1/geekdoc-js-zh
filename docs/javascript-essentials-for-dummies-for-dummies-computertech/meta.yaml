    # CHAPTER 5 Harnessing the Power of Functions 59\n\n# When an event fires\n\n\
    One of the most common ways that JavaScript functions are called in response to\
    \ some event. Events are such an important topic that I devote a big chunk of\
    \ Chapter 6 to them. For now, check out a relatively straightforward application:\
    \ executing the function when the user clicks a button. The following code shows\
    \ one way to do it:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>Calling a function in response to an event</title>\n\
    \  <script>\n    function makeBackgroundRed() {\n      document.body.style.backgroundColor=\"\
    red\";\n    }\n    function makeBackgroundWhite() {\n      document.body.style.backgroundColor=\"\
    white\";\n    }\n  </script>\n</head>\n<body>\n  <button onclick=\"makeBackgroundRed()\"\
    >\n    Make Background Red\n  </button>\n  <button onclick=\"makeBackgroundWhite()\"\
    >\n    Make Background White\n  </button>\n</body>\n</html>\n```\n\nWhat I've\
    \ done here is place two functions in the script: makeBackgroundRed changes the\
    \ page background to red, as before, and makeBackgroundWhite changes the background\
    \ color back to white.\n\nThe buttons are standard HTML button elements (check\
    \ out Figure 5-3), each of which includes the onclick attribute. This attribute\
    \ defines a handler — that is, the function to execute for the event that occurs\
    \ when the user clicks the button. For example, consider the first button:\n\n\
    ```html\n<button onclick=\"makeBackgroundRed()\">\n```\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_72_0.png)\n\
    \nFigure 5-3: An example of calling a function in response to an event.\n\nThe\
    \ onclick attribute here says, in effect, “When somebody clicks this button, call\
    \ the function makeBackgroundRed.\"\n\n# Passing One or More Values to a Function\n\
    \nOne of the main reasons to use functions is to gain control over when your JavaScript\
    \ code gets executed. The previous section discusses how easy it is to use functions\
    \ to set things up so that code doesn’t run until the user clicks a button.\n\n\
    However, there’s another major reason to use functions: to avoid repeating code.\
    \ To understand what I mean, consider the two functions from the previous section:\n\
    \n```javascript\nfunction makeBackgroundRed() {\n    document.body.style.backgroundColor=\"\
    red\";\n}\nfunction makeBackgroundWhite() {\n    document.body.style.backgroundColor=\"\
    white\";\n}\n```\n\nThese functions perform the same task — changing the background\
    \ color — and the only difference between them is that one changes the color to\
    \ red and the other changes it to white. Whenever you end up with two or more\
    \ functions that essentially do the same thing, you know that your code is inefficient.\
    \ So how do you make the code more efficient? That's where arguments come into\
    \ play. An argument is a value that is \"sent\" — or passed, in programming terms\
    \ — to the function. The argument acts just like a variable, and it stores value.\n\
    \n# Passing one value to a function\n\nAs an example, you can take the previous\
    \ two functions, reduce them to a single function, and set up the value as an\
    \ argument. Here's a new function that does that:\n\n```javascript\nfunction changeBackgroundColor(newColor)\
    \ {\n  document.body.style.backgroundColor = newColor;\n}\n```\n\nThe argument\
    \ is named newColor and is added between the parentheses that occur after the\
    \ function name. JavaScript declares newColor as a variable automatically, so\
    \ you don't need a separate let or const statement. The function then uses the\
    \ newColor value to change the background color. So how do you pass a value to\
    \ the function? The following code presents a sample that does so:\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Passing\
    \ a single value to a function</title>\n  <script>\n    function changeBackgroundColor(newColor)\
    \ {\n      document.body.style.backgroundColor = newColor;\n    }\n  </script>\n\
    </head>\n<body>\n  <button onclick=\"changeBackgroundColor('red')\">\n    Make\
    \ Background Red\n  </button>\n  <button onclick=\"changeBackgroundColor('white')\"\
    >\n    Make Background White\n  </button>\n</body>\n</html>\n```\n\nThe key is\
    \ the onclick attribute that appears in both <button> tags. For example:\n\n```html\n\
    onclick=\"changeBackgroundColor('red')\"\n```\n\nThe string 'red' is inserted\
    \ into the parentheses after the function name, so that value is passed to the\
    \ function itself. The other button passes the value 'white', and the function\
    \ result accordingly.\n\n> In the two onclick attributes in the example code,\
    \ notice that the values passed to the function are enclosed in single quotation\
    \ marks. This is necessary because the onclick value as a whole is enclosed in\
    \ double quotation marks.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_74_0.png)\n\
    \n# Passing two or more values to a function\n\nFor more complex functions, you\
    \ may need to use multiple arguments so that you can pass different kinds of values.\
    \ If you use multiple arguments, separate each one with a comma, like this:\n\n\
    ```javascript\nfunction changeColors(newBackgroundColor, newForeColor) {\n  document.body.style.backgroundColor\
    \ = newBackgroundColor;\n  document.body.style.color = newForeColor;\n}\n```\n\
    \nIn this function, the document.body.style.color statement changes the foreground\
    \ color (that is, the color of the page text). The following code shows a revised\
    \ page where the buttons pass two values to the function:\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Passing\
    \ multiple values to a function</title>\n  <script>\n    function changeColors(newBackColor,\
    \ newForegroundColor) {\n      document.body.style.backgroundColor = newBackColor;\n\
    \      document.body.style.color = newForegroundColor;\n    }\n  </script>\n</head>\n\
    <body>\n  <h1>Passing Multiple Values to a Function</h1>\n  <button onclick=\"\
    changeColors('red', 'white')\">Red Background, White Text</button>\n  <button\
    \ onclick=\"changeColors('white', 'red')\">White Background, Red Text</button>\n\
    </body>\n</html>\n```\n\n> If you define a function to have multiple arguments,\
    \ you must always pass values for each of those arguments to the function. If\
    \ you don't, the \"value\" undefined is passed, instead, which can cause problems.\n\
    \n# Getting a Value from a Function\n\nSo far, I've outlined two major advantages\
    \ of using functions:\n\n- You can use them to control when code is executed.\n\
    - You can use them to consolidate repetitive code into a routine.\n\nThe major\
    \ benefit that functions bring to the JavaScript table is that you can use them\
    \ to perform calculations and return the result. As an example, here's a function\
    \ that calculates the tip on a restaurant bill:\n\n```javascript\nfunction calculateTip(preTip,\
    \ tipPercent) {\n  const tipResult = preTip * tipPercent;\n  return tipResult;\n\
    }\n\nconst preTipTotal = 100.00;\nconst tipPercentage = 0.15;\nconst tipCost =\
    \ calculateTip(preTipTotal, tipPercentage);\nconst totalBill = preTipTotal + tipCost;\n\
    document.write(\"Your total bill is $\" + totalBill);\n```\n\nThe function named\
    \ calculateTip takes two arguments: preTip is the total of the bill before the\
    \ tip, and tipPercent is the percentage used to calculate the tip. The function\
    \ then declares a variable named tipResult and uses it to store the calculation\
    \ — preTip multiplied by tipPercent. The key for this example is the second line\
    \ of the function:\n\n```javascript\nreturn tipResult;\n```\n\nThe return statement\
    \ is JavaScript's way of sending a value back to the statement that called the\
    \ function. That statement comes after the function:\n\n```javascript\ntipCost\
    \ = calculateTip(preTipTotal, tipPercentage);\n```"
