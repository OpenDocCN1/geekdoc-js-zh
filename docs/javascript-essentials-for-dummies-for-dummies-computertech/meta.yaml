    \n**Figure 5-4:** The output includes the return value of the custom function\
    \ calculation.\n\n## Working with Anonymous Functions\n\nHere's another look at\
    \ the function syntax from earlier in this chapter:\n\n```\nfunction functionName([arguments])\
