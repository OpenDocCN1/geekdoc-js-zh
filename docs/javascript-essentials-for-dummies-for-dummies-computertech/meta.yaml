    \ => {\n  JavaScript statements\n}\n```\n\nAll I've done here is to remove the\
    \ function keyword and replaced it with the characters => between the arguments\
    \ and the opening brace. The characters look like an arrow (JavaScripters call\
    \ it a fat arrow), so this version of the syntax is known as an arrow function.\n\
    \nArrow functions are the ES6 invention, don't use them if you need to support\
