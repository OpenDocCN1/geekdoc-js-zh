    \    <li>In Between</li>\n  </ul>\n</nav>\n``` （此处原文缺少闭合引号）\n\n你可以通过使用字符串模板（也称为模板字面量）来解决所有三个问题，它是一种字符串字面量，其中界定引号被反引号（`\
    \ ）所替换：\n\n```\n`Your string goes here`\n```\n\n字符串模板作为 ECMAScript 2015 (ES6)\
    \ 的一部分引入的，因此只有在你不需要支持像 Internet Explorer 11 这样的旧网络浏览器时才使用它们。\n\n以下是你如何使用字符串模板解决上述三个问题的每一个方法：\n\
    \n-   **处理内部引号：** 你可以在字符串内任意任意数量的单引号或双引号：\n\n```\n`There's got to be some better\
    \ way to do this.`\n```\n\n-   **合并变量值：** 字符串模板支持插值，它可以插入变量的值：\n\n```\nconst adjective\
    \ = \"better\";\nconst lament = `There's got to be some ${adjective} way to do\
    \ this.`;\n```\n\n-   **多行字符串：** 字符串模板可以跨行：\n\n```javascript\nconst myHeader =\
    \ `<nav class=\"banner\">\n  <h3 class=\"nav-heading\">Navigation</h3>\n  <ul\
    \ class=\"nav-links\">\n    <li>Home</li>\n    <li>Away</li>\n    <li>In Between</li>\n\
    \  </ul>\n</nav>`;\n```\n\n# 确定字符串的长度\n\nString 对象的最基本的属性是 `length`，它告诉你字符串中有多少个字符。字符串中的所有字符——包括空格和标点——都计入长度。\n\
    \n```\nfunction myFunction() {\n  return \"filename\";\n}\nconst bookName = \"\
