    # # Understanding Literal Data Types


    In programming, a variable''s *data type* specifies what kind of data is stored
    within the variable. The data type is a crucial idea because it determines not
    how two or more variables are combined (for example, mathematically), but also
    whether they can be combined at all. *Literals* are a special class of data type,
    and they cover those values that are fixed (even if temporarily). For example,
    consider the following variable assignment:


    ```

    ```let todays = "What color is your parachute?"; ```

    ```


    Here, the text "What color is your parachute?" is a literal string value. JavaScript
    supports three kinds of literal data types: numeric, string, and Boolean. The
    next three sections discuss each type.


    # ## Working with numeric literals


    Unlike many other programming languages, JavaScript treats all numbers the same,
    so you don''t have to do anything special when working with the two basic numeric
    literals, which are integers and floating-point numbers:


    +   - Integers: These are numbers that don''t have a fractional decimal part.
    So, you represent an integer using a sequence of one or more digits, as in these
