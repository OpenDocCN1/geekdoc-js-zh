  md: 'the web page. The document.lastModified portion returns the date and time the
    file was last changed and saved.


    # What You Need to Get Started


    One of the nicest things about HTML and CSS is that the hurdles you have to learn
    to get started are not only short but few in number. In fact, you really need
    two things, both of which are free: a text editor to enter the text, tags, and
    properties; and a browser to view the results. (You''ll also need a web server
    to host the finished pages.) Yes, there are high-end text editors and fancy graphics
    programs, but these fall into the “Bells and Whistles” category; you can create
    perfectly respectable web pages without them.


    The basic requirements for JavaScript programming are exactly the same as for
    HTML: a text editor and a browser. Again, programs are available to help you write
    and test your scripts, but you don''t need them.


    # Dealing with Two Exceptional Cases


    In this book, I make a couple of JavaScript assumptions related to the people
    who''ll be visiting the pages you post to the web:


    +   * Those people have JavaScript enabled in their web browser.

    * Those people are using a relatively up-to-date version of the modern web browser,
    such as Chrome, Edge, Safari, or Firefox.


    These are pretty safe assumptions, but it pays to be a bit paranoid and wonder
    how you might handle the teensy percentage of people who don''t pass one or both
    tests.


    # Handling browsers with JavaScript turned off


    You don''t have to worry about web browsers not being able to handle JavaScript,
    because all modern browsers have supported JavaScript for a very long time. You
    may, however, want to worry'
  merge: -1
  pgno: 21
- img_proc: true
  md: "about people who don't support JavaScript. Although rare, some folks have turned\
    \ off their browser's JavaScript functionality. Why would someone do such a thing?\
    \ Many people disable JavaScript because they're concerned about security, they\
    \ don't want cookies written to their hard drives, and so on.\n\nTo handle these\
    \ iconoclasts, place the <noscript> tag within the body of the page:\n\n```\n\
    <noscript>\n<p>\n  Hey, your browser has JavaScript turned\n  off!\n</p>\n<p>\n\
    \  Okay, cool, perhaps you'll prefer this <a href=\"no-js.html\">non-JavaScript\
    \ version</a> of\nthe page.\n</p>\n</noscript>\n```\n\nIf the browser has JavaScript\
    \ enabled, the browser doesn't display any of the text within the <noscript> tag.\
    \ However, if JavaScript is disabled, the browser displays the text and tags within\
    \ the <noscript> tag to the user.\n\nTo test your site with JavaScript turned\
    \ off, here are the techniques to use in some popular browsers:\n\n+   **Chrome\
    \ (desktop):** Open Settings, click Privacy and Security, click Site Settings,\
    \ click JavaScript, and then select the Don't Allow Sites to Use JavaScript option.\n\
    **Chrome (Android):** Open Settings, tap Site Settings, JavaScript, and then tap\
    \ the JavaScript switch to off.\n**Edge:** Open Settings, click the Settings menu,\
    \ click Cookies and Site Permissions, click JavaScript, and then click the Allowed\
    \ switch to off.\n**Safari (macOS):** Open Settings, click the Advanced tab, select\
    \ the Show Develop Menu in Menu Bar, and then close Settings. Choose Develop >\
    \ Disable JavaScript.\n\n# CHAPTER 1 JavaScript: The Big Picture 11"
  merge: -1
  pgno: 22
- img_proc: true
  md: "+   > Safari (iOS or iPadOS): Open Settings, tap Safari,\nt Advanced, and then\
    \ tap the JavaScript switch to off.\n\n+   > Firefox (desktop): In the Address\
    \ bar, type about:config\\and press Enter or Return. If Firefox displays a warning\
    \ page,\n Accept the Risk and Continue to display the Advanced\nPreferences page.\
    \ In the Search Preference Name box, type\njavascript. In the search results,\
    \ look for the javascript.\nenabled preference. On the far right of that preference,\
    \ click\nThe Toggle button to return the value of the preference from\nto false.\n\
    \n# Handling very old browsers\n\nIn this book, you learn the version of JavaScript\
    \ called ECMAScript\n2015, also known as ECMAScript 6, or just ES6. Why this version,\n\
    in particular, and not any of the later versions? Two reasons:\n\n+   > ES6 has\
    \ excellent browser support, with more than 98 percent\nof current browsers supporting\
    \ the features released in\nES6. Later versions of JavaScript have less support.\n\
    \n+   > ES6 has everything you need to add all kinds of useful\nand dynamic features\
    \ to your pages. Unless you're a\nprofessional programmer, the features released\
    \ in subse-\\quent versions of JavaScript are way beyond what you need.\n\nOkay,\
    \ so what about couple of percent of browsers that don't\nsupport ES6?\n\nFirst,\
    \ know that the number of browsers that choke on ES6 fea-\ntures is getting smaller\
    \ every day. Sure, it's 2 percent (about\n1.7 percent, actually), but it will\
    \ be 1 percent in six months, a\n0.5 percent in a year, and so on until the numbers\
    \ get too\nsmall to measure.\n\nSecond, the percentage of browsers that don't\
    \ support ES6 varies\nby region (it's higher in many countries in Africa, for\
    \ example)\\sand by environment. Most of the people running browsers that\ndon't\
    \ fully support ES6 are using Internet Explorer 11, and most of\nthose people\
    \ are in situations in which they can't upgrade (some)\ncorporate environments,\
    \ for example)."
  merge: -1
  pgno: 23
- img_proc: true
  md: 'If luck has it that your web pages draw an inordinate share of these older
    browsers, you may need to eschew the awomeness of ES6 in favor of the tried–and–true
    features of ECMAScript 5. To that end, as I introduce each new JavaScript feature,
    I point out those that arrived with ES6 and let you know if there''s a simple
    fallback or workaround (known as a polyfill in the JavaScript trade) if you prefer
    to use ES5.


    # Commenting Your Code


    A script that consists of just a few lines is usually easy to read and understand.
    However, your scripts won''t stay for long, and these longer and more complex
    creations will be correspondingly more difficult to read. (This difficulty will
    be particularly acute if you''re looking at the code a few weeks or months after
    you first coded it.) To help decipher your code, it''s good programming practice
    to make liberal use of comments throughout a script. A comment is text that describes
    or explains a statement or group of statements. Comments are ignored by the browser,
    so you can add as many as you deem necessary.


