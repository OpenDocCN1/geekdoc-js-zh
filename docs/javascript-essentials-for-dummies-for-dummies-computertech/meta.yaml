    >\n    将背景变为红色\n  </button>\n  <button onclick=\"makeBackgroundWhite()\">\n  \
    \  将背景变为白色\n  </button>\n</body>\n</html>\n```\n\n我在这里做的是脚本中放置了两个函数：`makeBackgroundRed`\
    \ 如之前一样将页面背景改为红色，而 `makeBackgroundWhite` 将背景颜色改回白色。\n\n这些按钮是标准的 HTML 按钮元素（查看图\
