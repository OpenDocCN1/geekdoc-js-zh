  md: 'The mechanism for returning a collection of elements that have the same tag
    is the getElementsTagName() method:


    ```

    document.getElementsByTagName(tag)

    ```


    **Note:** tag is a string representing the HTML name used by the tags you want
    to work with.


    This method returns an array-like collection that contains all the elements in
    the document that use the specified tag. (Refer to Chapter 7 to find out how arrays
    work. Also check out “Working with collections of elements,” Later in this chapter.)
    For example, to return a collection that includes all the div elements in the
    current page, you use the following statement:


    ```

    const divs = document.getElementsByTagName("div");

    ```


    # # Identifying elements by class name


    Another collection you can work with is the set of all elements in a page that
    use the same class. The JavaScript tool for returning all the elements that share
    a specific class name is the getClassName() method:


    ```

    document.getElementsByClassName(class)

    ```


    **Note:** class is a string representing the class name used by the elements you
    want to work with.


    This method returns an array-like collection that contains all the elements in
    the document that use the specified class name. The collection order is the same
    as the order in which the elements appear in the document. Here''s an example:


    ```

    const keywords = document.getElementsByClassName("keyword");

    ```


    # # Identifying elements by selector


    The same selectors and combinators that you use with CSS are also available in
    your JavaScript code to reference page elements by using the document object''s
    querySelector() and querySelectorAll() methods:'
