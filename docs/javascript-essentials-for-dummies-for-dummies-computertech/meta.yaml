    # Naming Variables: Rules and Best Practices


    If you want to write clear, easy-to-follow, and easy-to-debug scripts (and who
    doesn''t?), you can go a long way toward your goal by giving careful thought to
    the names you use for your variables. This section helps by running through the
    rules you need to follow and by giving you some tips and guidelines for creating
    good variable names.


    # Rules for naming variables


    JavaScript has only a few rules for variable names:


    +   * The first character must be a letter or an underscore (_). You can''t use
    a number as the first character.


    +   * The rest of the variable name can include any letter, number, or the underscore.
    You can''t use any other characters, including spaces, symbols, and punctuation
    marks.


    +   * As with the rest of JavaScript, variable names are case sensitive. That
    is, a variable named InterestRate is treated as an entirely different variable
    than one named interest.


    +   * There''s no limit to the length of the variable name.


    +   * You can''t use one of JavaScript''s reserved words as a variable name (such
    as let, const, var, alert, or prompt). All programming languages have a supply
    of words that are used internally by the language and can''t be used for variable
    names, because doing so would cause confusion (or worse).


    # Ideas for good variable names


    The process of declaring a variable doesn''t take much thought, but that doesn''t
    mean you should just type in any variable name that comes to mind. Take a few
    extra seconds to come up with a good name by following these guidelines:'
- md: '- Make your names descriptive. Sure, using names that just a few characters
    long makes them easier to type, but I guarantee that you won''t remember the variables
    represent when you look at the script down the road. For example, if you want
    to represent an account number, use accountNumber or accountNum instead of, accm
    or accnum.


    - Mostly avoid single-letter names. Although it''s best to avoid single-letter
    variable names, such short names are accepted in some places, such as when constructing
    loops, as described in Chapter 4.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_36_0.png)


    - Use multiple words with no spaces. The best way to create a descriptive variable
    name is to use multiple words. However, because JavaScript doesn''t take kindly
    to spaces in names, you need some way of separating the words to keep the name
    readable. The two standard conventions for multi-word variable names are camelCase,
    where you cam the words together and capitalize all but the first word (for example,
    lastName), or to separate each word with an underscore (last_name). I prefer the
    former, so I use it throughout this book.


    - Use separate naming conventions. Use one convention for JavaScript variables
    and a different one for HTML identifiers and CSS classes. For example, if you
    use camelCase for multi-word JavaScript variables, use dashes to separate words
    for id values and class names.


    - Differentiate your variable names from JavaScript keywords. Try to make your
    variable names look as different from JavaScript''s keywords and built-in terms
    (such as alert()) as possible. Differentiating variable names avoids the confusion
    that can arise when you look at a term and you can''t remember if it''s a variable
    or a JavaScript word.


    - Don''t make your names too long. Although short, cryptic names are to be shunned
    in favor of, descriptive names, that doesn''t mean you should be using entire
    sentences. Extremely long names are inefficient because they take so long to type,
    and they''re dangerous because the longer the name, the more likely you are to
    make a typo. Names of 2 to 4 words and 8 to 20 characters should be all you need.


    # Understanding Literal Data Types


    In programming, a variable''s *data type* specifies what kind of data is stored
    within the variable. The data type is a crucial idea because it determines not
    how two or more variables are combined (for example, mathematically), but also
    whether they can be combined at all. *Literals* are a special class of data type,
    and they cover those values that are fixed (even if temporarily). For example,
    consider the following variable assignment:


    ```javascript

    let todays = "What color is your parachute?";

    ```


    Here, the text "What color is your parachute?" is a literal string value. JavaScript
    supports three kinds of literal data types: numeric, string, and Boolean. The
    next three sections discuss each type.


    ## Working with numeric literals


    Unlike many other programming languages, JavaScript treats all numbers the same,
    so you don''t have to do anything special when working with the two basic numeric
    literals, which are integers and floating-point numbers:


    - Integers: These are numbers that don''t have a fractional decimal part. So,
    you represent an integer using a sequence of one or more digits, as in these examples:


    ```

    0

    42

    2001

    -20

    ```


    - Floating-point numbers: These are numbers that do have a fractional or decimal
    part. Therefore, you represent a floating-point number by first writing the integer
    part, followed by a decimal point, followed by the fractional or decimal part,
    as in these examples:


    ```

    0.07

    3.14159

    -16.6666667

    7.6543e+21

    1.234567e-89

    ```


    ## Exponential notation


    The last two floating-point examples require a bit more explanation. These two
    use exponential notation, which is an efficient way to represent very large or
    small floating-point numbers. Exponential notation uses an e (or E) followed by
    the exponent, which is a number preceded by a plus sign (+) or a minus sign (-).


    You multiply the first part of the number (that is, the part before the e or E)
    by 10 to the power of the exponent. Here''s an example:


    ```javascript

    9.87654e+5;

    ```


    The exponent is 5, and 10 to the power of 5 is 100,000, multiplying 9.87654 by
    100,000 results in the value 987,654.


    Here''s another example:


    ```javascript

    3.4567e-4;

    ```


    The exponent is -4, and 10 to the power of -4 is 0.0001. So, multiplying 3.4567
    by 0.0001 results in the value .00034567.


    ## Hexadecimal integer values


    You''ll likely deal with the usual decimal (base-10) number system throughout
    most of your JavaScript career. However, just in case you have to work with hexadecimal
    (base-16) numbers, this section shows you how JavaScript deals with them.


    The hexadecimal number system uses the digits 0 through 9 and the letters A through
    F (or a through f), where these letters represent the decimal numbers 10 through
    15. So, what in the decimal system would be 16 is actually 10 in hexadecimal.
    To specify a hexadecimal number in JavaScript,


    ## Working with string literals


    A string literal is a sequence of characters enclosed in either double or single
    quotes. JavaScript supports both types of string literals:


    ```javascript

    "This is a double-quoted string."

    ''This is a single-quoted string.''

    ```


    The following example shows how to nest one type inside the other:


    ```javascript

    "He said, ''Hello there!'' to me."

    ''She asked, "How are you?" today.''

    ```


    ## Using quotation marks within strings


    What if you must include, say, a double quotation mark within a string? You precede
    the mark with a backslash, like this:


    ```javascript

    "The \"quote\" is inside the string.";

    ```


    ## Understanding escape sequences


    The backslash combination is called an escape sequence. You can combine the backslash
    with a number of other characters to form escape sequences, and each one enables
    the browser to present a character that, by itself, would be illegal or not represent.
    Table 2-1 lists the most commonly escape sequences.


    ### TABLE 2-1 Common Escape Sequences


    | Escape Sequence | Character It Represents |

    |---|---|

    | \'' | Single quotation mark |

    | \" | Double quotation mark |

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \t | Tab |

    | \\ | Backslash |


    The following code shows an example that uses the \n escape sequence to display
    text on multiple lines.


    ```javascript

    alert("This is line 1.\nSo what. This is line 2.");

    ```


    Figure 2-4 shows the result.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_41_0.png)


    **FIGURE 2-4:** Using the \n escape sequence enables you to format text that it
    displays on different lines.'
