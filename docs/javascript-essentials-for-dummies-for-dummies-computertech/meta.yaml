  md: '# Specifying Elements in Your Code


    Elements represent the tags in a document, so you''ll be using them constantly
    in your code. This section shows you several methods for referencing one or more
    elements.


    # Specifying an element by id


    If it''s a specific element you want to work with in your script, you can reference
    the element directly by first assigning it an id attribute:


    ```

    <div id="kale-quotations">

    ```


    With that, you can then refer to the element in your code using the document object''s
    getElementById() method:


    ```

    document.getElementById(id)

    ```


    Note: id is a string representing the id attribute of the element you want to
    work with.


    For example, the following statement returns a reference to the previous <div>
    tag (the one that has id="kale-quotations"):


    ```

    document.getElementById("kale-quotations")

    ```


    When you''re coding the document object, don''t put your <script> tag in the web
    page''s head section (that is, between the <head> and </head> tags). If you place
    you code there, the web browser will run your code before it has a chance to create
    the document object, which means your code will fail, big time. Instead, place
    your <script> tag at the bottom of the web page, just before the </body> tag.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_90_0.png)


    # Specifying elements by tag name


    Besides working with individual elements, you can also work with collections of
    elements. One such collection is the set of all elements in a page that use the
    same tag name. For example, you could reference all the <a> tags or all the <div>
    tags.'
  merge: -1
