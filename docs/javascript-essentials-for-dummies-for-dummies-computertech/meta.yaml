  mdcn: "\n使用注释来描述每个变量：变量往往会大量增多，以至于通常很难记得每个变量代表什么。你可以在变量声明之后紧跟着添加注释，使每个变量的目的变得清晰，如下所示：\n\
    \n```\nlet interestRate; // 贷款计算的年利率\n```\n\n在使用每个变量之前声明它：如果你在声明变量之前使用它，将会得到一个错误。对于前两个项目，我会说你会“得到一个错误”，我的并不是屏幕上会弹出一个错误消息。你唯一注意到的现象是你的脚本没有运行。要读取错误消息，你需要访问浏览器的\
    \ Web 开发工具，我将在第 9 章中详细介绍这项任务。\n\n在在使用每个变量之前立即声明它：如果你遵循这一简单规则，你的编程和调试（请参考第 9 章）生活将变得简单得多：在变量第一次使用之前（或尽可能靠近第一次使用处）声明每个变量。\n\
    \nlet 关键字是在 ECMAScript 2015 (ES6) 中引入的。如果你需要支持非常旧的浏览器——我指的是 Internet Explorer\
    \ 11 及更早版本——那么请改用 `var` 关键字。\n\n## 在变量中存储值\n\n在声明变量之后，你的下一个任务是给它赋值值。你使用赋值运算符——等号\
    \ (=)——来将值存储在变量中，如下通用语句所示：\n\n```\nvariableName = value;\n```\n\n这是一个将值 0.06 赋值给变量\
    \ `interestRate` 的示例：\n\n```\ninterestRate = 0.06;\n```\n\n另请注意，如果你提前知道变量的初始值，可以将声明和初始赋值合并为一个语句，如下：\n\
    \n```\nlet interestRate = 0.06;\n```\n\n必须记住，对于使用 `let` 关键字声明的变量，你可以随意更改该变量的值。例如，如果你分配给\
    \ `interestRate` 变量的值是年利率，在稍后的代码中，你需要处理月利率，即年利率除以 12。与其手动计算，不如直接在代码中使用除法运算符 (/)\
    \ 将其放入代码中：\n\n```\ninterestRate = 0.06 / 12;\n```\n\n关于使用变量赋值的最后一点，请看一种经常让新程序员感到困惑的变体。具体来说，你可以设置一个语句，通过更改现有值来为变量赋新值。这里有一个示例：\n\
    \n```\ninterestRate = interestRate / 12;\n```\n\n如果你从未遇到过这种语句，它可能看起来有点不逻辑。东西本身怎么能除以\
    \ 12 呢？理解这种语句的秘密在于首先执行等号 (=) 右侧表达式。换句话说，它获取 `interestRate` 的当前值（即 0.06），并将其除以\
    \ 12。完成后，结果值将存储在 `interestRate` 中。关于运算符和表达式的更深入讨论，请查看第 3 章。\n\n由于这种“先求表达式后存储结果”的行为，JavaScript\
    \ 赋值语句不应被读为“变量表达式”。相反，将它们视为“变量被设置为表达式”或“变量采用表达式给出的值”更有意义。这样读取赋值语句有助于强化一个重要概念：表达式的结果正存储在变量中。\n\
    \n## 傻呆版 JavaScript 基础\n\n## 另一种声明变量的方法：const\n\n“variable”（变量）一词意味着分配给变量的值允许变化，你声明的大多数变量都是如此。大多数，但不是所有。有时你的脚本需要使用一个保持不变的值。例如，假设你正在构建一个将英里转换为公里的计算器。转换因子是\
    \ 1.60934，该值在你的整个脚本中将保持不变。\n\n将此类值存储在变量中以便于阅读是良好的编程习惯。然而，如果你在此处声明中使用 `let`，你将面临在代码某处意外更改该值的风险，因为用\
    \ `let` 声明的变量是可以改变的。\n\n为了避免意外更改你想要保持不变的值，你可以使用 `const` 关键字声明变量。其通用语法如下：\n\n```\n\
    const variableName = value;\n```\n\n注意，与 `let` 不同，当你用 `const` 声明变量时，必须为变量赋值。这是一个声明名为\
    \ `milesToKilometers` 变量并为其赋值值 1.60934 的示例：\n\n```\nconst milesToKilometers =\
    \ 1.60934;\n```\n\n在变量值必须永远不要的情况下，使用 `const` 相比 `let` 是否有任何真正的优势？是的，有两个优点：\n\n\
    - 使用 `const` 关键字是在提醒你正在处理一个不可改变的值，这有助于你记住不要给该变量分配新值。\n- 使用 `const` 关键字可以防止你意外重新分配变量，有助于及早发现错误。\n\
    \n---\n\n## 在语句中使用变量\n\n一旦你有了变量，就可以在代码中使用它。这是一个示例：\n\n```javascript\nlet interestRate\
    \ = 0.06;\nconsole.log(interestRate * 2);\n```\n\n这段代码获取 `interestRate` 的值并乘以\
    \ 2。你也可以在表达式中使用变量：\n\n```javascript\nlet a = 10;\nlet b = 20;\nlet c = a + b;\n\
    console.log(c);\n```\n\n这会输出 30。你也可以在函数中使用变量：\n\n```javascript\nfunction greet(name)\
    \ {\n  console.log(\"Hello, \" + name);\n}\n\ngreet(\"Alice\");\n```\n\n这将输出 Hello,\
    \ Alice\n\n## 变量的作用域\n\n变量具有作用域，即可以被访问的代码区域。JavaScript 中有两种作用域：全局和局部。\n\n### 全局作用域\n\
    \n在函数之外的变量具有全局作用域。可以在脚本的任何地方访问它。\n\n```javascript\nlet globalVar = \"I am global\"\
    ;\n\nfunction showVar() {\n  console.log(globalVar);\n}\n\nshowVar();\n```\n\n\
    这将输出 I am global\n\n### 局部作用域\n\n在函数内部声明的变量具有局部作用域。它只能在该函数内部访问。\n\n```javascript\n\
    function showVar() {\n  let localVar = \"I am local\";\n  console.log(localVar);\n\
    }\n\nshowVar();\nconsole.log(localVar); // 这将导致错误\n\n### 块作用域\n\n块是花括号 `{ }` 之间的任何代码。用\
    \ `let` 和 `const` 声明的变量具有块作用域，这意味着它们只能在该块内访问。用 `var` 声明的变量没有块作用域；它们限于它们所在的函数。\n\
    \n```javascript\nif (true) {\n  let blockVar = \"I am block-scoped\";\n  var functionVar\
