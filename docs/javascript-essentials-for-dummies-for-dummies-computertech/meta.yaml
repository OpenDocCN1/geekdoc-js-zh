  md: "Finally, as with properties, if the method returns a value, you can assign\
    \ value to a variable (as I do with the confirm() method in the earlier example)\
    \ or you can incorporate the method into an expression.\n\n# Introducing the Document\
    \ Object Model\n\nHere's some source code for a simple web page:\n\n```\n```html\
    \ lang=\"en\">\n  <head>\n    <title>So Many Kale Recipes</title>\n  </head>\n\
    \  <body>\n    <header>\n      <h1>Above and Beyond the Kale of Duty</h1>\n  \
    \  </header>\n    <main>\n      <p>\n        Do you love to cook with <a href=\"\
    kale.html\">kale</a>?\n      </p>\n    </main>\n  </body>\n</html>\n```\n```\n\
    \nOne way to examine this code is hierarchically. That is, the html element is,\
    \ in sense, the topmost element because every other element is contained within\
    \ it. The next level down in the hierarchy contains the head and body elements.\
    \ The head element contains a title element, which contains the text So Many Kale\
    \ Recipes. Similarly, the body element contains a header element and a main element.\n\
    \nHierarchies are almost always more readily grasped in visual form, as so Figure\
    \ 6-2 graphs the page elements hierarchically."
