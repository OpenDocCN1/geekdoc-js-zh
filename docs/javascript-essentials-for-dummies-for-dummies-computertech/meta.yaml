    \ get a feel for the program flow to make sure that things as loops and function\
    \ calls are executing properly. You can use four techniques:\n\n- Stepping one\
    \ statement at a time\n- Stepping into some code\n- Stepping over some code\n\
    - Stepping out of some code\n\n# Stepping one statement at a time\n\nThe most\
    \ common way of stepping through your code is to step one statement at a time.\
    \ In break mode, stepping one statement at a time means two things:\n\n- You execute\
    \ the current statement and then pause on the statement.\n- If the current statement\
    \ to run is a function, stepping takes you into the function and pauses at the\
    \ function's first statement. You can then continue to step through the function\
    \ until you execute the last statement, at which point the browser returns you\
    \ to the statement after the function call.\n\nStepping through your code one\
    \ statement at a time, set a break-point and then, after your code is in break\
    \ mode, one of the following to step through a single statement:\n\n- **Click\
    \ the Step button.** Chrome's version of this button is shown here in the margin.\n\
    - **Press the browser's Step keyboard shortcut.** In Chrome (and most browsers,\
    \ except Firefox, which doesn't support Step as of this writing; use the Step\
    \ Into button, instead), press F9.\n\nKeep stepping through until the script ends\
    \ or until you're ready to resume normal execution (clicking Resume).\n\n# Stepping\
    \ into some code\n\nIn all the major browsers (except Firefox), stepping into\
    \ code is exactly the same as stepping through the code one statement at a time.\
    \ The difference comes when a statement executes asynchronously (that is, it performs\
    \ its operation after some delay rather than right away.\n\nTo understand the\
    \ difference, consider the following code (I've added line numbers to the left;\
    \ they're not part of the code):\n\n```javascript\nsetTimeout(() => {\n  console.log('Inside\
    \ the setTimeout\nblock!');\n3 ), 5000;\n4 console.log('Outside the setTimeout)\
    \ block!');\n```\n\nThis code uses setTimeout() to execute an anonymous function\
    \ after five seconds. Suppose you enter break mode at the setTimeout() statement\
    \ (line 1). What happens if you use Step Into here? Check it out:\n\n- **Step**:\
    \ Clicking the Step button doesn't take you to line 2, as you might expect. Instead,\
    \ because setTimeout() is asynchronous, Step essentially ignores the anonymous\
    \ function and takes you directly to line 4.\n- **Step Into**: Clicking the Step\
    \ button does take you to line 2, but only after the specified delay (five seconds,\
    \ in this case). You can then step through the anonymous function as needed.\n\
    \nStep into your code, set a breakpoint and then, after your code, do one of the\
    \ following:\n\n- **Click the Step Into button**. Chrome's version of this button\
    \ is shown here in the margin.\n- **Press the browser's Step Into keyboard shortcut**.\
    \ In Chrome (and most browsers), either F11 or press Ctrl+(Windows) or ⌘+ (macOS).\n\
    \nMy description of Step Into doesn't apply (at least as we write this) to Firefox.\
    \ Instead, the Firefox Step Into feature works the Step feature I describe in\
    \ the previous section.\n\n# Stepping over some code\n\nSome statements call other\
    \ functions. If you're not interested in stepping through a called function, you\
    \ can step over it. Stepping over a function means that JavaScript executes the\
    \ function normally and then resumes break mode at the next statement after the\
    \ function call.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_150_0.png)\n\nTo\
    \ step over a function, first either step through your code until you come to\
    \ the function call you want to step over, or set a breakpoint on the function\
    \ call and refresh the web page. When you're in break mode, you can step over\
    \ the function using any of the following techniques:\n\n- **Click the Step Over\
    \ button.** Chrome's version of this button is shown here in the margin.\n- **Press\
    \ the browser's Step Over keyboard shortcut.** In Chrome (and most browsers),\
    \ either press F10 or press Ctrl+' (Windows) or ⌘+ (macOS).\n\n# Stepping over\
    \ some code\n\nI'm always accidentally stepping into functions I'd rather step\
    \ over. If the function is short, I just step through it until I'm back in the\
    \ original code. If the function is long, however, I don't want to waste time\
    \ stepping through every statement. Instead, I invoke the Step Out using any of\
    \ these:\n\n- **Click the Step Out button.** Chrome's version of this button is\
    \ shown here in the margin.\n- **Press the browser's Step Out keyboard shortcut.**\
    \ In Chrome (and most browsers), either F11 or press Ctrl+ (Windows) or ⌘+ (macOS).\n\
    \nJavaScript executes the rest of the function and reenters break mode at the\
    \ first line.\n\n# IN THIS CHAPTER\n\nProgramming checkboxes, radio buttons, and\
    \ selection lists\nMonitoring and triggering form events\nDealing with form data\n\
    \n# Chapter 10: Dealing with Form Data\n\nIn this chapter, you learn how to \"\
