    # Chapter 2 Programming with Variables


    By default, JavaScript programs live a life without short-term memory. The web
    browser executes your code one statement at a time until there are no more statements
    to process. It all happens in the perpetual now. Ah, but notice that I1 refer
    to this lack of short-term memory as the “default” state of your scripts. It’s
    not the only state, so that means things can be different. You have the power
    to give your scripts the gift of short-term memory, and you do that by using hardly
    little chunks of code called variables. In this chapter, you delve into variables,
    which is a fundamental and crucial programming topic. You investigate what variables
    are, what you can do with them, and how to wield them in your JavaScript code.


    # Getting Your Head around Variables


    Why would a script need short-term memory? Because one of the most common concepts
    that crops up when coding is the need to store a temporary value for later on.
    In most cases, you want to use that value a bit later in the same script. However,
    you may also need to use it in some other script, to populate an HTML form, or
    as part of a larger or more complex calculation.'
  - '[PAGE 29]


    For example, your page may have a button that toggles the page text between a
    larger font size and the regular font size, so you need some way to “remember”
    that choice. Similarly, if your script performs calculations, you may need to
    set aside or more calculated values to use later. For example, if you''re reconstructing
    a shopping cart script, you may need to calculate taxes on the order. To do that,
    you must first calculate the total value of the order, store that value, and then
    later take a percentage of it to work out the task.


    In programming, the way you save a value for later use is storing it in a variable.
    A *variable* is a small area of computer memory that''s set aside for holding
    a chunk of data. The good news is that the specifics of how the data is stored
    and retrieved from memory behind the scenes happen well before anything you ever
    have to worry about. As a coder, working with variables involves three things:


    +   - Creating (or declaring) variables

    - Assigning values to those variables

    - Including the variables in other statements in your code


    The next three sections fill the details.


    # Declaring a variable with let


    The process of creating a variable is *declaring* in programming. All declaring
    really means you''re supplying the variable with a name and telling the browser
    to set aside a bit of room in memory to hold whatever value you end up in the
    variable. To declare a variable in JavaScript, you use the *let* keyword, followed
    by a space, the name of the variable, and the usual line-ending semicolon. For
    example, to declare a variable `interestRate`, you use the following statement:


    ```

    let interestRate;

    ```


    Here are a few things to bear in mind when you''re declaring variables in your
    scripts:


    +   - Declare a variable only once: Although you''re free to use a variable as
    many times as you need to within a script, you declare the variable only once.
    Trying to declare a variable more than once will cause an error.


