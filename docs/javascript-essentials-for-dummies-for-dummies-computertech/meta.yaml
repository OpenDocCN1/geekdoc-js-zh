    ## Dealing with Dates and Times


    Dates and times seem like the kind of things that ought to be straightforward
    programming propositions. After all, there are 12 months in a year, 28 to 31 days
    in a month, seven days in a week, 24 hours in a day, 60 minutes in an hour, and
    60 seconds in a minute. Surely something set in stone couldn''t get even the least
    weird, could it?


    You''d be surprised. Dates and times can get strange, but they get much easier
    to deal with if you always keep three crucial points in mind:


    - JavaScript time is measured in milliseconds, or thousands of a second. More
    specifically, JavaScript measures time by counting the number of milliseconds
    between January 1, 1970 and the date and time in question. So, for example, you
    might come across the date January 1, 2001, and think, "Ah, yes, the start of
    the new millennium." JavaScript, however, comes across that date and thinks "978220800000."


    - In the JavaScript world, time began on January 1, 1970, at midnight Greenwich
    Mean Time. Dates before that have negative values in milliseconds.


    - Because your JavaScript programs run inside a user''s browser, dates and times
    are almost always the user''s local dates and times. That is, the dates and times
    your scripts will manipulate not be those of the server on which your page resides.
    This means that you can never know what time the user is viewing your page.


    ## Learning the arguments used with the Date object


    Before getting to the nitty-gritty of the Date object and its associated methods,
    I''ll take a second to run through the various arguments that JavaScript requires
    for many date-related features. This will save us from repeating these arguments
    tediously later on. Table 8–3 has the details.


    TABLE 8–3 Arguments Associated with the Date Object


    | Argument | What It Represents | Possible Values |

    | :--- | :--- | :--- |

    | date | A variable name | A Date object |

    | yyyy | The year | Four-digit integers |

    | yy | The year | Two-digit integers |

    | month | The month | The full month name from "January" to "December" |

    | mth | The month | Integers from 0 (january) to 11 (December) |

    | dd | the day of the month | Integers from 1 to 31 |

    | hh | the hour of the day | Integers from 0 (midnight) to 23 (11:00 PM) |

    | mm | the minute of the hour | Integers from 0 to 59 |

    | ss | the second of the minute | Integers from 0 to 59 |

    | ms | the milliseconds of the second | Integers from 0 to 999 |


    ## Getting to know the Date object


    Whenever you work with dates and times in JavaScript, you work with an instance
    of the Date object. More to the point, when you deal with a Date object in JavaScript,
    you deal with a specific moment in time, down to the millisecond. A Date object
    can never be a block of time, and it''s not a kind of clock ticks along while
    your script runs. Instead, the Date object is a snapshot that you use to extract
    the specifics: the year, date, hour, and so on.


    ### Specifying the current date


    The most common use of the Date object is to store the current date and time.
    You do that by invoking the Date() function, which is the constructor for creating
    a new Date object. Here''s the general format:


    ```javascript

    const date = new Date();

    ```


    ### Specifying any date or time


    If you need to work with a specific date or time, you need to use the Date() function''s
    arguments. There are five versions of the Date() syntax (refer to the list of
    arguments near the beginning of this chapter):


    The following statements give you an example for each syntax:


    ```javascript

    const date = new Date("August 23, 2024");

    const date = new Date("August 23, 2024");

    const date = new Date(2024, 8, 23, 3, 21);

    const date = new Date(2024, 8, 23);

    const date = new Date(1692763200000);

    ```


    ### Getting info about a date


    When your script cough up whatever you stored in the variable, the results aren''t
    particularly appealing. If you want to display dates in a more attractive format,
    or if you want to perform arithmetic operations on a date, you need to go a little
    deeper into the Date object to extract specific information such as the month,
    year, and so on. You do that by using the Date object methods listed in Table
    8-4


    TABLE 8-4 Date Object Methods That Extract Values


    | Method Syntax | What It Returns |

    | :--- | :--- |

    | date.getFullYear() | the year as a four-digit number (1999, 2000, and so on)
    |

    | date.getMonth() | the month of the year; from 0 (January) to 11 (December) |

    | date.getDate() | the date in the month; from 1 to 31 |

    | date.getDay() | the day of the week; from 0 (Sunday) to 6 (Saturday) |

    | date.getHours() | the hour of the day; from 0 (midnight) to 23 (11:00 PM) |

    | date.getMinutes() | the minute of the hour; from 0 to 59 |

    | date.getSeconds() | the second of the minute; from 0 to 59 |

    | date.getMilliseconds() | the milliseconds of the second; from 0 to 999 |

    | date.getTime() | the milliseconds since January 1, 1970 GMT |


    ## Setting the date


    When you perform arithmetic, you often have to change the value of an existing
    Date object. For example, an e-commerce script may have to calculate a date that
    is 90 days from the date a sale occurs. It''s usually easiest to create a Date
    object and then use an expression or literal value to change the year, month,
    or some other component of the date. You do that by using the Date object methods
    listed in Table 8-5.


    | Method Syntax | What It Sets |

    | :--- | :--- |

    | date.setYear(yyyy) | the year as a four-digit number (1999, 2000, and so on)
    |

    | date.setMonth(mth) | the month of the year; from 0 (January) to 11 (December)
    |

    | date.setDate(dd) | the date in the month; from 1 to 31 |

    | date.setHours(hh) | the hour of the day; from 0 (midnight) to 23 (11:00 PM)
    |

    | date.setMinutes(mm) | the minute of the hour; from 0 to 59 |

    | date.setSeconds(ss) | the second of the minute; from 0 to 59 |

    | date.setMilliseconds(ms) | the milliseconds of the second; from 0 to 999 |

    | date.setTime(ms) | the milliseconds since January 1, 1970 GMT |


    # Chapter 9

    Debugging JavaScript


    JavaScript and modern web browsers offer a ton of top-notch debugging tools that
    can remove some of the burden of program solving. In this chapter, you delve into
    these tools to explore how they can help you find and fix most programming errors.
    You also investigate a number of tips and techniques that can go a long way in
    helping you avoid coding errors in the first place.


    ## Laying Out Your Debugging Tools


    All the major web browsers come with a sophisticated set of debugging tools that
    can make your life as easier and much saner. Most web developers debug their scripts
    using Google Chrome, so I focus on that browser in this chapter. But in this section,
    I give you an overview of the tools that are available in all the browsers and
    how to get them.


    Here’s how you open the development tools in Chrome, Firefox, Microsoft Edge,
    and Safari:


    - Chrome for Windows: Click Customize and Control Google Chrome (the three vertical
    dots to the right of the address bar) and then select More Tools: Developer Tools.
    Shortcut: Ctrl+Shift+I.


    - Chrome for Mac: Select View ⌥ Developer Tools Shortcut: Option+⌘I.


    - Firefox for Windows: Click Open Application Menu (the three horizontal lines
    on the right of the toolbar) and then select More Tools: Developer Tools. Shortcut:
    Ctrl+Shift+I.


    - Firefox for Mac: Select Tools ⌥ Browser Tools Shortcut: Option+⌘I.


    - Microsoft Edge: Click Settings and More (the three vertical dots to the right
    of the address bar) and then select More Tools: Developer Tools. Shortcut: Ctrl+Shift+I.


    - Safari: Select Develop ⌥ Show Web Inspector. Shortcut: Option+⌘I. If you don''t
    have the Developer menu, select Safari ⌥ Settings, click the Advanced tab, and
    then select the Show Menu in Menu Bar checkbox.'
