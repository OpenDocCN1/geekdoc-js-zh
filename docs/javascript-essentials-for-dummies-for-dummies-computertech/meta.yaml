    - Mac 版 Firefox：选择“工具>浏览器工具”。快捷键：`Option+Command+I`。


    - Windows 版 Edge：点击“设置和更多”（地址栏右侧的三个点），然后选择“更多工具>开发者工具”。快捷键：`Ctrl+Shift+I`。


