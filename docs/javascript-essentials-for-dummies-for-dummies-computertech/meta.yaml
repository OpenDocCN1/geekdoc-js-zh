  md: "# Getting a Value from a Function\n\nSo far, I've outlined two major advantages\
    \ of using functions:\n\n+   - You can use them to control when code is executed.\n\
    - You can use them to consolidate repetitive code into a routine.\n\nThe major\
    \ benefit that functions bring to the JavaScript table is that you can use them\
    \ to perform calculations and return the result. As an example, here's a function\
    \ that calculates the tip on a restaurant bill:\n\n```\nfunction calculateTip(preTip,\
    \ tipPercent) {\n  const tipResult = preTip * tipPercent;\n  return tipResult;\n\
    }\n\nconst preTipTotal = 100.00;\nconst tipPercentage = 0.15;\nconst tipCost =\
    \ calculateTip(preTipTotal, tipPercentage);\nconst totalBill = preTipTotal + tipCost;\n\
    document.write(\"Your total bill is $\" + totalBill);\n```\n\nThe function named\
    \ calculateTip takes two arguments: preTip is the total of the bill before the\
    \ tip, and tipPercent is the percentage used to calculate the tip. The function\
    \ then declares a variable named tipResult and uses it to store the calculation\
    \ — preTip multiplied by tipPercent. The key for this example is the second line\
    \ of the function:\n\n```\nreturn tipResult;\n```\n\nThe return statement is JavaScript's\
    \ way of sending a value back to the statement that called the function. That\
    \ statement comes after the function:\n\n```\ntipCost = calculateTip(preTipTotal,\
    \ tipPercentage);\n```"
  merge: -1
  pgno: 76
- img_proc: true
  md: "This statement first passes the value of preTipTotal (initialized as 100.00\
    \ earlier in the script) and tipPercentage (initialized as 0.15 earlier) to the\
    \ calculateTip function. When that function returns its result, the entire expression\
    \ calculateTip(preTipTotal, tipPercentage) is replaced by that result, meaning\
    \ that it gets stored in the cost variable. preTipTotal and tipCost are added\
    \ together, the result is stored in totalBill, and a document.write statement\
    \ displays the final calculation (check Figure 5-4).\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_77_0.png)\n\
    \n**Figure 5-4:** The output includes the return value of the custom function\
    \ calculation.\n\n# # Working with Anonymous Functions\n\nHere's another look\
    \ at the function syntax from earlier in this chapter:\n\n```\nfunction functionName([arguments])\
    \ {\n  JavaScript statements\n}\n```\n\nThis version of function syntax creates\
    \ a so-called named function because — you guessed it — the function has a name.\n\
    \nHowever, creating a function that doesn't have a name is also possible:\n\n\
    ```\nfunction ([arguments]) {\n  JavaScript statements\n}\n```\n\nThis variety\
    \ of function syntax creates a so-called anonymous function because — that’s right\
    \ — the function has no name."
