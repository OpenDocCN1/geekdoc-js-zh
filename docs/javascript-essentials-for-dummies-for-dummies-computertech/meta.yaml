    \ Between</li>\n  </ul>\n</nav>\n```\n\nYou can solve all three problems by using\
    \ a string template (also called a template literal), which is a kind of string\
    \ literal where the delimiting quotation marks are replaced by back ticks (`):\n\
    \n```\n`Your string goes here`\n```\n\nString templates were introduced as part\
