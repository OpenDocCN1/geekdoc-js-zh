    # About the Author


    Information appears to stew out of me naturally, like the precious ottar of roses
    out of the otter.


    > —MARK TWAIN


    PaulFedries is a technical writer who spends his days writing books just like
    the one you’re holding in your hands. In fact, Paul has written more than 100
    books which have sold over four million copies worldwide. Paul invites everyone
    to drop by his personal website at https://paulmcfedries.com, or to follow him
    on X (www.twitter.com/paulmcf) or Facebook (www.facebook.com/PaulMcFedries).


    # Dedication


    To Karen, my lobster.


    # Author’s Acknowledgments


    Each time I complete a book, the publisher sends me a heavy box filled with a
    few so-called “author” copies. Opening that box, lifting up a book, feeling the
    satisfying weight of something that has, up to now, weightlessly digital, and
    seeing my name printed on the cover, well, it’s a pretty fine feeling, let me
    tell you. That’s a pretty cool, but you know what’s really cool? I’ve done that
    over a hundred times in my writing career, and seeing my name on the cover has
    never gotten old.


    But because mine is the only name you see on the cover, doesn’t mean this book
    was a one—man show. Far from it, Sure. I wrote this book’s text and take its screenshots,
    but those represent only a part of what constitutes a “book.” The rest of it is
    brought to you by the dedication and professionalism of Wiley’s editing, graphics,
    and production teams, who toiled long and hard to turn my text and images into
    an actual book.


    I offer my heartfelt thanks to everyone at Wiley who made this book possible,
    but I’d like to extend some special thank-you to the folks I worked with directly:
    Executive Editor Lindsay Berg and Editor Elizabeth Kuball.'
