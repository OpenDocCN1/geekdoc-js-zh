    \ For Dummies\";\n\nlength1 = myFunction().length; // 12\nlength2 = bookName.length;\
    \ // 37\nlength3 = \"123\\n578\".length; // 8\n```\n\nWhat the String object lacks\
    \ in properties, it more than makes up for methods. There are dozens, and they\
    \ enable your code to perform many tasks, from converting between uppercase and\
    \ lowercase, finding text within a string, extracting parts of a string.\n\n#\
    \ Searching for substrings\n\nA substring is a portion of an existing string.\
    \ For example, substrings of \"JavaScript\" would be \"Java\", \"Script\", \"\
    vaSc\". When working with strings in your scripts, you'll often have to determine\
    \ whether a given string contains a substring. For example, if you're validating\
    \ a user's email address, you should check that it contains an @ symbol.\n\nTable\
    \ 8-1 lists the several String object methods that find substrings within a larger\
