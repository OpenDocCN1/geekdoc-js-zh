    ## Getting the parent of a child element


    If your code needs to work with the parent of a child element, use the child element''s
    `parentNode` property:


    ```

    child.parentNode

    ```


    **Note:** *child* is the child element.


    For example, suppose you want to work with the parent element of the `h1` element
    from the HTML example at the beginning of this section. Here''s some code that''ll
    do the job:


    ```javascript

    const childElement = document.querySelector("h1");

    const parentElement = childElement.parentNode;

    ```


    ## Getting the siblings of an element


    A parent''s child nodes appear in the DOM in the same order in which they appear
    in the HTML code, which means the siblings also appear in the order they appear
    in the HTML. Therefore, for a given child element, there are two sibling possibilities:


    - **Previous sibling:** This is the sibling that appears in the DOM immediately
    before the child element you''re working with. If the child element is the first
    sibling, it will have no previous sibling.

    - **Next sibling:** This is the sibling that appears in the DOM immediately after
    the child element you''re working with. If the child element is the last sibling,
    it will have no next sibling.


    ## Getting the previous sibling


    To return the previous sibling of a particular element, use the previousElementSibling
    property:


    ```

    element.previousElementSibling

    ```


    Note: element is the element you''re working with.


    For example, the following statement stores the previous sibling of the main element
    in a variable:


    ```javascript

    const currElement = document.querySelector("main");

    const prevSib = currElement.previousElementSibling;

    ```


    ## Getting the next sibling


    To return the next sibling of a particular element, use the nextElementSibling
    property:


    ```

    element.nextElementSibling

    ```


    Note: element is the element you''re working with.


    For example, the following statement stores the next sibling of the header element
    in a variable:


    ```javascript

    const currElement = document.querySelector("header");

    const nextSib = currElement.nextElementSibling;

    ```


    ## Adding, Modifying, and Removing Elements


    After you''ve got a reference to one or more elements, you can then use code to
    manipulate those elements in various ways, as shown in the next few sections.


    ## Adding an element to the page


    One of the most common web development chores is to add elements to a web page
    on the fly. When you add an element, you always specify the parent element to
    which it will be added, and then you decide whether you want the new element added
    to the end or to the beginning of the parent’s children.


    To add an element to the page, you follow three steps:


    1. Create an object for the type of element you want to add.

    2. Add the new object from Step 1 as a child element of an element.

    3. Insert some text and tags into the new object from Step 1.


    ### Step 1: Creating the element


    For Step 1, you use the document object’s createElement() method:


    ```

    document.createElement(elementName)

    ```


    Note: elementName is a string containing the HTML element name for the type of
    the element you want to create.


    This method creates the element and then returns it, which means you can store
    the new element in a variable. Here’s an example:


    ```javascript

    const newArticle = document.createElement("article");

    ```


    ### Step 2: Adding the new element as a child


    With your element created, Step 2 is to add it to an existing parent element.
    You have four choices:


    - Append the new element to the end of the parent''s collection of child elements:
    Use the append() method.


    ```

    parent.append(child)

    ```


    Here are the parts of the append() method:


    - *parent*: A reference to the parent element to which the new element will be
    appended.

    - *child*: A reference to the child element you''re appending. Note that you can
    append multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    - Prepend the new element to the beginning of the parent''s collection of child
    elements: Use the prepend() method.


    ```

    parent.prepend(child)

    ```


    Here are the parts of the prepend() method:


    - *parent*: A reference to the parent element to which the new element will be
    prepended.

    - *child*: A reference to the child element you''re appending. Note that you can
    append multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    - Insert the new element just after an existing child of the parent: Use the after()
    method.


    ```

    child.after(sibling)

    ```


    Here are the parts of the after() method:


    - *child*: A reference to the child element after which the new element will be
    inserted.

    - *sibling*: A reference to the new element you''re inserting. Note that you can
    insert multiple elements at the same time by separating each element with a comma.
    The sibling parameter can also be a text string.


    - Insert the new element just before an existing child of the parent: Use the
    before() method:


    ```

    child.before(sibling)

    ```


    Here are the parts of the before() method:


    - *child*: A reference to the child element before which the new element will
    be inserted.

    - *sibling*: A reference to the new element you''re inserting. Note that you can
    insert multiple elements at the same time by separating each element with a comma.
    The sibling parameter can also be a text string.


    ### Step 3: Adding text and tags to the new element


    With your element created and appended to a parent, the final step is to add text
    and tags using the innerHTML property:


    ```

    element.innerHTML = text

    ```


    Here’s what the various parts are:


    - *element*: A reference to the new element within which you want to add the text
    and tags

    - *text*: A string containing the text and HTML tags you want to insert


    Whatever value you assign to the innerHTML property completely overwrites an element''s
    existing text and tags, so use caution when wielding innerHTML. Check the next
    section to learn how to insert text and tags rather than overwrite them.


    In this example, the code creates a new nav element, prepends it to the main element,
    and adds a heading:


    ```javascript

    const newNav = document.createElement("nav");

    document.querySelector("main").prepend(newNav);

    newNav.innerHTML = "<h2>Navigation</h2>";

    ```


    ## Inserting text or HTML into an element


    It''s often the case that you want to keep the element''s existing tags and text
    and insert new tags and text. Each element offers a couple of methods that enable
    you to do this:


    - **To insert text into an element:** Use the insertAdjacentText() method:


    ```

    element.insertAdjacentText(location, text)

    ```


    Here is what the parts are:


    - *element*: A reference to the element into which the new text will be inserted.

    - *location*: A string specifying where you want the text inserted. I outline
    your choices here shortly.

    - *text*: A string containing the text you want to insert.


    - **To insert tags and text into an element:** Use the insertAdjacentHTML() method:


    ```

    element.insertAdjacentHTML(location, data)

    ```


    Here''s what the parts are:


    - *element*: A reference to the element into which the new tags and text will
    be inserted.

    - *location*: A string specifying where you want the text inserted. I outline
    your choices here shortly.

    - *data*: A string containing the tags and text you want to insert.'
