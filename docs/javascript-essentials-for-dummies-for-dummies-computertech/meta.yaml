    # Chapter 3

    Building Expressions


    When coding in JavaScript, you use expressions constantly, so it''s vital to understand
    what they are and to get comfortable with the types of expressions that are available.
    Every JavaScript coder is different, but I can say without fear of contradiction
    that every good JavaScript coder is fluent in expressions.


    This chapter takes you through everything you need to know about expressions.
    You discover some expression basics and then explore a number of techniques for
    building powerful expressions using numbers, strings, and Boolean values.


    ## Understanding How Expressions Are Structured


    A JavaScript expression takes one or more inputs, such as a bill total and a tip
    percentage, and combines them in some way — for example, by using multiplication.
    In expression lingo, the inputs are called operands, and they''re combined by
    using special symbols called operators.


    - **operand**: An input value for an expression. It is, in other words, the raw
    data that the expression manipulates to produce its result. It could be a number,
    a string, a variable, a function result (refer to Chapter 5), or an object property
    (refer to Chapter 6).

    - **operator**: A symbol that represents a particular action performed on one
    or more operands. For example, the * operator represents multiplication, and the
    + operator represents addition. I discuss the various JavaScript operators throughout
    this chapter.


    For example, here''s an expression that calculates a tip amount and assigns the
    result to a variable:


    ```

    tipAmount = billTotal * tipPercentage;

    ```


    The expression is everything to the right of the equals sign (=). Here, billTotal
    and tipPercentage are the operands, and the multiplication sign (*) is the operator.


    ## Creating Numeric Expressions


    In JavaScript, a mathematical calculation is called a numeric expression, and
    it combines numeric operands and arithmetic operators to produce a numeric result.
    This section discusses all the JavaScript arithmetic operators and shows you how
    best to use them to build useful and handy numeric expressions.


    Table 3-1 lists the basic arithmetic operators you can use in your JavaScript
    expressions.


    JavaScript also comes with a few extra operators that combine some of the arithmetic
    operators and the assignment operator, which is the humble equals sign (=) that
    assigns a value to a variable. Table 3-2 lists these so-called arithmetic assignment
    operators.


    # TABLE 3-1 The JavaScript Arithmetic Operators


    | Operator | Name | Example | Result |

    |---|---|---|--|

    | + | Addition | 10 + 4 | 14 |

    | ++ | Increment | 10++ | 11 |

    | - | Subtraction | 10 - 4 | 6 |

    | - | Negation | -10 | -10 |

    | -- | Decrement | 10-- | 9 |

    | * | Multiplication | 10 * 4 | 40 |

    | / | Division | 10 / 4 | 2.5 |

    | % | Modulus | 10 % 4 | 2 |


    # TABLE 3-2 The JavaScript Arithmetic Assignment Operators


    | Operator | Example | Equivalent |

    |---|---|--|

    | += | x += y | x = x + y |

    | -= | x -= y | x = x - y |

    | *= | x *= y | x = x * y |

    | /= | x /= y | x = x / y |

    | ^= | x ^= y | x = x ^ y |

    | %= | x %= y | x = x % y |


    ## Building String Expressions


    A string expression is where at least one of the operands is a string, and the
    result of the expression is another string. String expressions are straightforward
    in the sense that there is only one operator to deal with: concatenation (+).
    You use this operator to combine (or concatenate) strings within an expression.
    For example, the expression "Java" + "Script" returns the string "JavaScript".
    Note, however, you can also use strings with the comparison operators discussed
    in the next section.


    ## Building Comparison Expressions


    You use comparison expressions to compare the values of two or more numbers, strings,
    variables, properties, or function results. If the expression is true, the expression
    result is set to the Boolean true; if the expression is false, the expression
    result is set to the Boolean value false. You''ll use comparisons with alarming
    frequency in your JavaScript code, so it''s important to understand what they
    are and how you use them.


    Table 3-3 summarizes JavaScript''s comparison operators.


    # TABLE 3-3 The JavaScript Comparison Operators


    | Operator | Name | Example | Result |

    | --- | --- | --- | --- |

    | == | Equality | 10 == 10 | true |

    | != | Inequality | 10 != 5 | true |

    | > | Greater than | 10 > 5 | true |

    | < | Less than | 10 < 5 | false |

    | >= | Greater than or equal | 10 >= 10 | true |

    | <= | Less than or equal | 10 <= 10 | false |

    | === | Strict equality | 10 === 10 | true |

    | !== | Strict inequality | 10 !== 5 | true |


    ## Building Logical Expressions


    You use logical expressions to combine Boolean values, particularly to test whether
    expressions are true. Table 3-4 lists logical operators.


    # TABLE 3-4 The Logical Operators


    | Operator | Name | Syntax | Returned Value |

    |---|---|---|---|

    | && | AND | expr1 && expr2 | true if both expr1 and expr2 are true. |

    | || | OR | expr1 || expr2 | true if one or both expressions are true. |

    | ! | NOT | !expr1 | true if expr1 is false. |


    ## Understanding Operator Precedence


    In complex expressions, the order in which calculations are performed becomes
    crucial. For example, consider the expression 3+5*2. If you calculate from left
    to right, the answer you get is 16. To get the correct answer, you have to override
    the order of precedence so that the multiplication 5*2 is performed first. Table
    3-5 summarizes the complete order of precedence used by JavaScript.


    # TABLE 3-5 The Order of Precedence


    | Operator | Operation | Order of Precedence | Order of Evaluation |

    | --- | --- | --- | --- |

    | ++ | Increment | First | R -> L |

    | -- | Decrement | First | R -> L |

    | - | Negation | First | R -> L |

    | ! | NOT | First | R -> L |

    | *, /, % | Multiplication, division, modulus | Second | L -> R |

    | +, - | Addition, subtraction | Third | L -> R |

    | + | Concatenation | Third | L -> R |

    | <, <= | Less than, less than or equal | Fourth | L -> R |

    | >, >= | Greater than, greater than equal | Fourth | L -> R |

    | == | Equality | Fifth | L -> R |

    | != | Inequality | Fifth | L -> R |

    | === | Strict equality | Fifth | L -> R |

    | !== | Strict inequality | Fifth | L -> R |

    | && | AND | Sixth | L -> R |

    | || | OR | Sixth | L -> R |

    | ?: | Ternary | Seventh | R -> L |

    | = | Assignment | Eighth | L -> R |

    | +=, -= =, etc. | Arithmetic assignment | Eighth | R -> L |


    ## Controlling the order of precedence


    Sometimes you want to take control of the situation and override the order of
    precedence. That may seem like a decidedly odd thing to do, so perhaps an example
    is in. Suppose you know the final price of an item and, given the tax rate, you
    want to know the original (that is, pre-tax) price.


    A first pass at the JavaScript calculation may look something like this:


    ```

    retailPrice = totalPrice / 1 + taxRate;

    ```


    This won''t work. Why not? Well, according to the rules of precedence, JavaScript
    performs division before addition, so the totalPrice value first is divided by
    1 and then is added to the taxRate value, which isn''t the correct order.


    To get the correct answer, you have to override the order of precedence so that
    the addition 1 + taxRate is performed first. You override precedence by surrounding
    that part of the expression with parentheses, as shown in the following code:


    ```

    const retailPrice = totalPrice / (1 + taxRate);

    ```


    In general, you can use parentheses to control the order that JavaScript uses
    to calculate expressions. Terms inside parentheses are always calculated first;
    terms outside parentheses are calculated sequentially (according to the order
    of precedence).'
