  md: '# Step 2: Adding the new element as a child


    With your element created, Step 2 is to add it to an existing parent nelement.
    You have four choices:


    +   Append the new element to the end of the parent''s collection of child elements:
    Use the append() method.


    ```

    parent.append(child)

    ```


    Here are the parts of the append() method:


    +   * parent: A reference to the parent element to which the new element will
    be appended.

    * child: A reference to the child element you''re appending. Note that you can
    append multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    +   Prepend the new element to the beginning of the parent''s collection of child
    elements: Use the prepend() method.


    ```

    parent.prepend(child)

    ```


    Here are the parts of the prepend() method:


    +   * parent: A reference to the parent element to which the new element will
    be prepended.

    * child: A reference to the child element you''re prepending. Note that you can
    prepend multiple elements at the same time by separating each element with a comma.
    The child parameter can also be a text string.


    +   Insert the new element just after an existing child element of the parent:
    Use the after() method.


    ```

    child.after(sibling)

    ```


    Here are the parts of the after() method:


    +   * child: A reference to the child element after which the new element will
    be inserted.

    * sibling: A reference to the new element you''re inserting. Note that you can
