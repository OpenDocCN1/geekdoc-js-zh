    ## Debugging 101: Using the Console


    If your web page is behaving strangely — for example, the page is blank or missing
    elements — you should first check your HTML code to make sure it''s correct. (Common
    HTML errors are not finishing a tag with a greater than sign (>), not including
    a closing quotation mark for an attribute value.) If your HTML checks out, there''s
    a good chance that your JavaScript code is worthy. How do you know? A trip to
    the Console is your first step.


    The Console is an interactive browser window that shows warnings and errors, displays
    the output of console.log() statements, and enables you to execute expressions
    and statements without having to run your entire script. The Console is one of
    the handy web browser debugging tools, so you need to know your way around it.


    ## Getting the console onscreen


    To display the Console, open your web browser''s development tools and then click
    the Console tab. You can also use the following keyboard shortcuts:


    - Chrome for Windows: Press Ctrl+Shift+J.

    - Chrome for Mac: Press Option+J.

    - Firefox for Windows: Press Ctrl+Shift+K.

    - Firefox for Mac: Press Option+K.

    - Microsoft Edge: Press Ctrl+Shift+J.

    - Safari: Press Option+C.


    ## Printing program data in the Console


    You can use the console.log() method of the special object to print text and expression
    values in the Console:


    ```

    console.log(output)

    ```


    Note: output is the expression you want to print in the Console.


    The output expression can be a text string, a variable, an object property, a
    function result, or any combination of these.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_143_0.png)


    You can also use the handy console.table() method to output the values of arrays
    or objects in an easy-to-read tabular format:


    ```

    console.table(output)

    ```


    Note: output is the array or object (as a variable or as a literal) you want to
    view in the Console.


    For debugging purposes, you most often use the Console to keep an eye on the values
    of variables, object properties and expressions. That is, when your code sets
    or changes the value of something, you insert a console.log() (or console.table())
    statement that outputs the new value. When the script execution is complete, you
    can open the Console and then check out the logged value or values.


    ## Running code in the Console


    One of the great features of the Console is that it''s interactive, which means
    that you can not only read messages generated by the browser or by your console.log()
    statements but also type directly into the Console. That is, you can use the Console
    to execute expressions and statements. There are many uses for this feature:


    - You can try some experimental expressions or statements to determine their effect
    on the script.

    - When the script is paused, you can output the current value of a variable or
    property.

    - When the script is paused, you can change the value of a variable or property.
    For example, if you notice a variable with a value of zero is about to be used
    as a divisor, you can change that variable to a nonzero value to avoid crashing
    the script.

    - When the script is paused, you can run a function or method to determine whether
    it operates as expected under the current conditions.


    Each browser''s Console tab includes a text box (usually marked by a greater-than
    > prompt) that you can use to enter your expressions or statements.


    You can execute multiple statements in the Console by separating each statement
    with a semicolon. For example, you can test a for... loop by entering a statement
