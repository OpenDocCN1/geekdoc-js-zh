    \ `discountRate` 变量后，`if...else` 语句检查 `currMonth` 是否等于 \"December\"。*（注：此处原文似乎误复制了上文关于\
    \ totalSales 的描述，翻译时已按原文逻辑保留）*\n\n## 理解循环的价值\n\n有人会说编程的唯一目标就是完成任务。只要代码产生正确的结果，其他一切都是多余的。然而，在编码中引入效率的最佳方法是避免造轮子。例如，考虑以下代码：\n\
    \n```javascript\nlet sum = 0;\nlet num = prompt(\"Type a number:\", 1);\nsum +=\
    \ Number(num);\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\nnum\
    \ = prompt(\"Type a number:\", 1);\nsum += Number(num);\ndocument.write(\"The\
    \ total of your numbers is \" + sum);\n```\n\n这段代码首先声明了一个变量为 `sum`。代码提示用户输入一个数字（使用默认值为\
    \ 1 的 `prompt` 方法），存储在 `num` 变量中，加到 `sum` 上，然后重复多次。（注意我对 `Number` 函数的使用，它确保 `prompt`\
    \ 返回的值被视为数字而不是字符串。）最后，向用户显示三个数字之和。\n\n除了有点没用之外，这段代码极其缺乏效率，因为代码大部分由以下两行重复三次：\n\n\
    ```javascript\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\n```\n\
    \n如果你把这两条语句只放在代码中一次，然后让 JavaScript 根据需要重复它们，不是更高效吗？\n\n是的，而且好消息是不仅可以这样做，JavaScript\
    \ 还提供了许多不同的方法来实现这种操作——被称为**循环**。我将在本章的剩余部分研究每种方法。\n\n## 使用 while 循环\n\nJavaScript\
    \ 最直接的循环结构是 `while` 循环，它使用以下语法：\n\n```javascript\nwhile (expression) {\n  statements\n\
    }\n```\n\n在这里，`expression` 是一个比较表达式或逻辑表达式（即返回 `true` 或 `false` 的表达式），只要它返回 `true`，就会告诉\
    \ JavaScript 继续执行块内部的 `statements`。\n\n本质上\n\n这里是 `while` 循环工作的详细原理：\n\n- 1. 评估\
    \ `while` 语句中的 `expression`。\n2. 如果 `expression` 为 `true`，继续执行第 3 步；如果 `expression`\
    \ 为 `false`，跳转到第 5 步。\n3. 执行块中的每个语句。\n4. 返回第 1 步。\n5. 退出循环（即执行 `while` 块之后的下一条语句）。\n"
