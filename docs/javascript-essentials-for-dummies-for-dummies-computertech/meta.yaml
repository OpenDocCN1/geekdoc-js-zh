    \  'click',\n  function() {\n    document.body.style.\n    backgroundColor = 'white';\n\
    \  }\n);\n</script>\n</body>\n```\n\n# # Working with Arrow Functions\n\nAs you\
    \ progress in JavaScript, you'll find yourself using anonymous functions constantly.\
    \ When you get to that stage, you'll be happy to know that ES6 also offers a simpler\
