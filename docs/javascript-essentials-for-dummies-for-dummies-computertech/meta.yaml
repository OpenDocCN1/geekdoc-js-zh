  md: "# Decision-Making with if Statements\n\nA smart script performs tests on its\
    \ environment and then decides what to do next based on the results of each test.\
    \ For example, suppose you've declared a variable that you later use as a divisor\
    \ in an expression. You should test the variable before using it in the expression\
    \ to make sure that the variable's value isn't zero.\n\nThe most basic test is\
    \ the simple true/false decision (which could be thought of as a yes/no or an\
    \ on/off decision). In this case, your program looks at a certain condition, determines\
    \ whether it's currently true or false, and acts accordingly. Logical expressions\
    \ (covered in Chapter 3) play a big part here because they always return a true\
    \ result.\n\nIn JavaScript, simple true/false decisions are handled by the if\
    \ statement. You can use either the single-line syntax:\n\n```\nif (expression)\
    \ statement;\n```\n\nor the block syntax:\n\n```\nif (expression) {\n  statement1;\n\
    \  statement2;\n  ...\n}\n```\n\nIn both cases, expression is a comparison or\
    \ logical expression that returns true or false, and statement(s) represent the\
    \ JavaScript statement or statements to run if expression returns true. If expression\
    \ returns false, JavaScript skips over the statements.\n\n> This is a good place\
    \ to note that JavaScript defines the following values as the equivalent of 0,\
    \ \"\" (that is, the empty string), null, and undefined. Everything else is the\
    \ equivalent of true.\n\n> This is the first time you've encountered JavaScript's\
    \ braces (( and )), so take a second to understand what they do they come up a\
    \ lot. The braces surround one or more statements that you want JavaScript to\
    \ treat as a single entity. This entity is a kind\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_51_0.png)"
