    # Chapter 7

    Working with Arrays


    In this chapter, you take your coding efficiency to an even higher level by exploring
    one of JavaScript''s most important concepts: the array. Arrays are important
    not only because they''re extremely efficient and very powerful but also after
    you know how to use them, you''ll think of a thousand and one uses for them. To
    make sure you''re ready for your new array-filled life, this chapter explains
    what they are and why they''re so damn useful, and then explores all the fantastic
    ways arrays can make your coding life easier.


    # What Is an Array?


    In JavaScript, whenever you have a collection of variables with related data,
    you can group them together into a single variable called an array. You can enter
    as many values as you want into the array, and JavaScript tracks each value using
    an index number. For example, the first value you add is given the index 0. The
    second value you put into the array is given the index 1; the third value gets
    2; and so on. You can then access any value in the array by specifying the index
    number you want.'
  - '[PAGE 117]


    # Declaring an Array


    Because an array is a type of variable, you need to declare it before using it.
    There are four syntaxes you can use. Here''s the syntax that''s the most informative:


    ```

    const arrayName = new Array();

    ```


    Here, arrayName is the name you want to use for the array variable.


    In JavaScript, an array is actually an object, so what the new-word is doing is
    creating a new Array object. For example, to create a new Array() part of the
    statement is called a constructor because its job is to construct the object in
    memory. To create a new array named dogPhotos, you''d use the following statement:


    ```

    const dogPhotos = new Array();

    ```


    The second syntax is useful if you know in advance the number of values (or elements)
    you''ll be putting into the array:


    ```

    const arrayName = new Array(num);

    ```


    Here''s what the various parts are:


    +   * arrayName: The name you want to use for the array variable


    For example, here''s a statement that declares a new dogPhotos array with five
    elements:


    ```

    const dogPhotos = new Array(5);

    ```


    # Populating an Array


    After your array is declared, you can start populating it with the data values
    you want to store. Here''s the general syntax for doing this:


    ```

    arrayName[index] = value;

    ```'
  - '[PAGE 118]


    Here''s what the various parts are:


    +   * arrayName: The name of the array variable


    +   * index: The array index number where you want the value\stored


    +   * value: The value you''re storing in the array


    JavaScript is willing to put just any type of data inside an array, including
    numbers, strings, Boolean values, and even other arrays! You can even mix multiple
    data types within a single array.


    As an example, here are a few statements that declare a new array named dogPhotos
    and then enter five values into the array:


    ```

    const dogPhotos = new Array(5);

    dogPhotos[0] = "dog-1";ndogPhotos[1] = "dog-2";ndogPhotos[2] = "dog-3";ndogPhotos[3]
    = "dog-4";ndogPhotos[4] = "dog-5";

    ```


    To reference an array value (say, to use it within an expression), you specify
    the appropriate index:


    ```

    strURL + dogPhotos[3]

    ```


    # Declaring and populating an array at the same time


    Earlier, I mentioned that JavaScript has two other syntaxes for declaring an array.
    Both enable you to declare an array and popu late with values by using just a
    single statement.


    The first method uses the Array() constructor in the following general format:


    ```

    const arrayName = new Array(value1, value2, ...);

    ```'
- md: "Here's what the various parts are:\n\n- * arrayName: The name you want to use\
    \ for the array variable\n- value1, value2, ...: The initial values with which\
    \ you want to populate the array\n\nHere's an example:\n\n```javascript\nconst\
    \ dogPhotos = new Array(\"dog-1\", \"dog-2\",\n\"dog-3\", \"dog-4\", \"dog-5\"\
    );\n```\n\nJavaScript also supports support for array literals. You can create\
    \ an array literal by enclosing one or more values in square brackets.\nHere's\
    \ the general format:\n\n```javascript\nconst arrayName = [value1, value2, ...];\n\
    ```\n\nHere's what the various parts are:\n\n- * arrayName: The name you want\
    \ to use for the array variable\n- value1, value2, ...: The initial values with\
    \ which you want to populate the array\n\nAn example:\n\n```javascript\nconst\
    \ dogPhotos= [\"dog-1\", \"dog-2\", \"dog-3\",\n\"dog-4\", \"dog-5\"];\n```\n\n\
    Most JavaScript programmers prefer this syntax over using the Array constructor.\n\
    \n## Populating an array using a loop\n\nYou can populate an array using a loop\
    \ and some kind of variable to access an array's index number programmatically.\n\
    Here's an example:\n\n```javascript\nconst dogPhotos = [];\nfor (let counter =\
    \ 0; counter < 5; counter += 1) {\n  dogPhotos[counter] = \"dog-\" + (counter\
    \ + 1);\n}\n```\n\nThe statement inside the for() loop uses the variable counter\
    \ as the array's index. For example, when counter is 0, the statement looks like\
    \ this:\n\n```javascript\ndogPhotos[0] = \"dog-\" + (0 + 1);\n```\n\nIn this case,\
    \ the expression to the right of the equals sign evaluates to \"dog-1\", which\
    \ is the correct value.\n\n## Iterating Arrays\n\nArrays can help make your code\
    \ more efficient by enabling you to reduce these kinds of long-winded procedures\
    \ to a much shorter route that fits inside a function. These routines are iterative\
    \ methods of the Array object, where iterative means that the method runs through\
    \ the items in the array, and for each item, a function (called a callback) performs\
    \ some operation on or with the item.\n\nThe Array object actually has 14 iterative\
    \ methods. I don’t cover them all, but over the next few sections I will talk\
    \ about the most uses.\n\n## Iterating an array: forEach()\n\nThe Array object’s\
    \ forEach() method runs a callback function for each element in the array. That\
    \ callback takes up to three arguments:\n\n- value: The value of the element\n\
    - index: (Optional) The Array index of the element\n- array: (Optional) the array\
    \ being iterated\n\nYou can use any of the following syntaxes:\n\n```javascript\n\
    array.forEach(namedFunction);\narray.forEach(function (value, index, array) {\n\
    \  code\n});\narray.forEach((value, index, array) => { code });\n```\n\nHere's\
    \ what the various parts are:\n\n- * array: The Array object you want to iterate\
    \ over.\n- * namedFunction: The name of an existing function. This function should\
    \ accept the value argument and perhaps the optional index and array arguments.\n\
    - code: The statements to run during each iteration.\n\nHere's an example:\n\n\
