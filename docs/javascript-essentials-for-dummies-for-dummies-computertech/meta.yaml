    \n**Figure 5-1:** An example of calling a function when the <script> tag is parsed.\n\
    \n# When the page load is complete\n\nIf your function references a page element,\
    \ calling the function from within the page's head section won't work because\
    \ the browser parses the script, the rest of the page hasn't loaded yet, so your\
    \ element reference will fail.\n\nTo work around this problem, place another <script>\
    \ tag at the end of the body section, just before the closing </body> tag, as\
    \ shown here:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    utf-8\">\n  <title>Calling a function after the page is loaded</title>\n  <script>\n\
    \    function makeBackgroundRed() {\n      document.body.style.backgroundColor\
    \ = \"red\";\n    }\n```"
