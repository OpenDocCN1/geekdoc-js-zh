    ## 布局你的调试工具


    所有主要的浏览器都带有一套复杂的调试工具，可以让你的工作变得更容易。大多数 Web 开发者使用 Google Chrome 调试脚本，因此在本章中重点关注该浏览器。但在本节中，我提供了所有工具的概述以及如何获取它们。


