  md: "# Setting the focus\n\nOne simple feature that can improve the user experience\
    \ on your form pages is to set the focus on the first form field when your page\
    \ loads. Setting the focus saves the user from having to make that annoying click\
    \ inside the first field.\n\nnTo get this done, run JavaScript’s focus() method\
    \ on the element you want to have the focus at startup:\n\n```\nfield.focus()\n\
    ```\n\nHere's an example that sets the focus on the text field with id equal to\
    \ user at startup:\n\nHTML:\n\n```\n<form>\n  <label for=\"user\">Username: </label>\n\
    \  <input id=\"user\" type=\"text\" name=\"username\">\n  <label for=\"pwd\">Password:</label>\n\
    \  <input id=\"pwd\" type=\"password\" name=\"password\">\n</form>\n```\n\nJavaScript:\n\
    \n```\ndocument.querySelector('#user').focus();\n```\n\n# Monitoring the focus\
    \ event\n\nRather than the focus, you may want to monitor when a particular field\
    \ gets the focus (for example, by the user clicking or tabbing into the field).\
    \ You can monitor that by setting up a focus event handler on the field:\n\n```\n\
    field.addEventListener('focus', () => {\n  Focus code goes here\n});\n```"
  merge: -1
  pgno: 166
- img_proc: true
  md: "Here's an example:\n\n```\ndocument.querySelector('#user').\naddEventListener('focus',\
    \ () => {\n  console.log('The username field has the\n  focus!');\n});\n```\n\n\
    # Monitoring the blur event\n\nThe opposite of setting the focus on an element\
    \ is blurring an element, which removes the focus from the element. You blur an\
    \ element by running the blur() method on the element, which causes it to lose\
    \ focus:\n\n```\nfield.blur()\n```\n\nHowever, rather than blur an element, you're\
    \ more likely to want to run some code when a particular element is blurred (for\
    \ example, by the user clicking orabbing out of the field). You can monitor for\
    \ a particular blurred element by setting up a blur() event handler:\n\n```\n\
    field.addEventListener('blur', () => {\n  Blur code goes here\n});\n```\n\nHere's\
    \ an example:\n\n```\ndocument.querySelector('#user').\naddEventListener('blur',\
    \ () => {\n  console.log('The username field no longer has\n  focus!');\n});\n\
    ```\n\n# Listening for element changes\n\nOne of the most useful form events is\
    \ the change event, which fires when the value or state of a field is modified\
    \ in some way. When this event fires depends on the element type:"
  merge: -1
