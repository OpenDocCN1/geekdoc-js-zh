  md: '![](img/e1fc091e438a5ffb052e3126ba2bbd1f_89_0.png)


    When speaking of object hierarchies, if object P contains object C, object P is
    said to be the parent of object C, and object C is said to be the child of object
    P. In 6-2, the arrows represent parent–to–child relationships. Also, elements
    on the same level — such as the header and main elements — are known as siblings.


    You have several key points to consider here:


    +   * Every box in Figure 6-2 represents an object.

    * Every object in Figure 6-2 is one of three types: element, text, or attribute.

    * Every object in Figure 6-2, regardless of its type, is called a node.

    * The page as a whole is represented by the document object.


    Therefore, this hierarchical object representation is known as the Document Object
    Model, or the DOM as it''s usually called. The DOM enables your JavaScript code
    to access the complete structure of an HTML document.'
