    # Learning the methods to extract substrings


    Finding a substring is one thing, but you''ll often have to extract a substring,
    as well. For example, if the user enters an email address, you may need to extract
    the username (the part to the left of the @) or the domain name (the part to the
    right of @). For these kinds of operations, JavaScript offers six methods, listed
    in Table 8-2.


    # TABLE 8-2 String Object Methods for Extracting Substrings


    | Method | What It Does |

    | string.charAt(index) | Returns the character in string that''s at the index
    position specified by index |

    | string.charCodeAt(index) | Returns the code of the character in string that''s
    at the index position specified by index |

    | string.slice(start, end) | Returns the substring in string that starts at the
    index position specified by start and ends before the index position specified
    by end |'
