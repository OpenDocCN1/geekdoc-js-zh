  md: '# # Introduction


    TML and CSS are awesome technologies, and you can use them to create pages that
    look amazing. But after you funnel your page to your web server and look at it
    a few (dozen) times, you may notice a subtle feeling of disappointment creeping
    in. Why? It can be hard to pin down, but that of dis comes from a stark fact:
    Your web page just contains kinds of sites.


    There, you probably have a link or three to it, but most likely those links just
    take you to more of your pages that just kind of sit there. Or maybe a link takes
    you to another site altogether, one that feels dynamic and alive and interactive.
    Ah, engagement! Ooh, excitement!


    What’s the difference between a page that does nothing and a page that seems to
    be always dancing? One word: JavaScript. If you want your pages to be dynamic
    and interactive, you need a bit of behind-the-scenes JavaScript to make it.


    But,” I hear you object,“HTML isn’t that hard to learn. JavaScript is a programming
    language, for crying out!” I hear you. It’s true that anyone can learn HTML as
    long as they start with the basic tags, examine lots of examples of how they work,
    and slowly work their way up to more complex pages. It’s just a matter of creating
    a solid foundation and building on it.


    I’m convinced that JavaScript can be approached in much the same way. I’m certainly
    not going to tell you that JavaScript is as easy to learn as HTML. That would
    be a bad-faced lie. However, I will tell you that there is nothing inherently
    about JavaScript. I believe that if you begin with the basic syntax and rules,
    study tons of examples of how they work, and slowly build up to more complex scripts,
    you can learn JavaScript programming. I predict here and now that by the time
    you finish this book, you’ll even be a little amazed at yourself and at what you
    can do.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# About This Book


    Welcome, then, to JavaScript Essentials For Dummies. This book gives you a solid
    education on the standard programming language underlying the World Wide Web.
    You learn how to set up the tools you need and, given any web pages you have (or
    some else has) built with HTML and CSS, you learn how to use JavaScript to program
    those pages. My goal is to show you that a sprinkling of JavaScript magic to a
    page isn''t hard to learn, and that even the green rookie programmer can learn
    to create dynamic and interactive web pages that will amaze their family and friends
    (and themselves).


    If you''re looking for lots of programming history, computer science theory, and
    long-winded explanations of concepts, I''m sorry, you won''t find it here. My
    philosophy throughout this book comes from Linus Torvalds, the creator of the
    Linux operating system: “Talk is cheap. Show me the code.” I explain what needs
    to be explained and built with (at all) to examples and scripts that do more to
    (or, most of the time, without any ado) to illuminate a concept that any verbose
    explanations I could muster (and believe me, I can muster verbosity with the best
    of them).


    # Foolish Assumptions


    This book is not a primer on the internet or on using the World Wide Web. This
    is a book on coding web pages, pure and simple. This means I assume the following:


    +   * You know how to operate a basic text editor, and how to get around the operating
    system and file system on your computer.

    * You have an internet connection.

    * You know how to use your web browser.

    * You know the basics of HTML and CSS.


    Yep, that’s it.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Icons Used in This Book


    This icon points out juicy tidbids that are likely to be repeated

    nto you — so please don''t forget them.


    Think of these icons as the fodder of advice columns. They offer

    (hopefully) advice or a bit more information about a topic

    under discussion.


    Look out! In this book, you see this icon when I’m trying to help you

    avoid mistakes that can cost you time, money, or embarrassment.


    # Where to Go From Here


    How you approach this book depends on your current level of

    coding and/or JavaScript expertise (or lack thereof):


    +   > If you''ve never programmed before, begin at the beginning

    with Chapter 1 and work at your own pace sequentially

    through Chapters 2, 3, 4, and 5. This will give you all the

    knowledge you need to pick and choose what you want to

    learn throughout the rest of the book.


    +   > If you''ve done some non-JavaScript programming, start with

    Chapter 1, skim through Chapters 2 through 5 to see how

    JavaScript does the standard programming tasks, and then

    pick and choose your topics from there.


    +   > If you''ve done some JavaScript coding already, I suggest

    working quickly through the material in Chapters 2

    through 5, and then diving into the all-important material

    on the Document Object Model in Chapter 6. From there,

    you can peruse the rest of the chapters as you see fit.'
