    # Programming Selection Lists


    Selection lists are common sights in HTML forms because they enable the web developer
    to display a relatively large number of choices in a compact control that most
    users know how to operate.


    To create the list container, use the <select> tag:


    ```

    <select id="selectId" name="selectName"

    size="selectSize" [multiple]>

    ```


    Here''s what the various parts are:


    +   * selectId: A unique identifier for the selection list.


    +   * selectName: The name you want to assign to the selection list.'
- md: "- >> select: The optional number of rows in the selection list box that are\
    \ visible. If you omit this value, the browser displays the list as a drop-down\
    \ box.\n- >> multiple: When this optional attribute is present, the user is allowed\
    \ to select multiple options in the list.\n\nFor each item in the list, you add\
    \ an `<select>` tag between the `<select>` and `</select>` tags:\n\n```html\n\
    <option value=\"optionValue\" [selected]>\n```\n\nHere's what the various parts\
    \ are:\n\n- >> oldValue: The value you want to assign to the list option.\n- >>\
    \ selected: When this optional attribute is present, the list option is initially\
    \ selected.\n\n## Referencing selection list options\n\nIf your code needs to\
    \ work with all the options in a selection list, use the selection list object's\
    \ options property:\n\n```javascript\ndocument.querySelector(list).options\n```\n\
    \nTo work with a particular option within a list, use JavaScript's square brackets\
    \ operator ([]) to specify the index of the option's position in the list:\n\n\
    ```javascript\ndocument.querySelector(list).options[n]\n```\n\nHere's what the\
    \ various parts are:\n\n- >> list: A selector that specifies the select element\
    \ you want to work with\n- >> n: The index of the option in the returned NodeList\
    \ collection (where 0 is the first option, 1 is the second option, and so on)\n\
    \nTo get the option's text (that is, the text that appears in the list) use the\
    \ option object's text property:\n\n```javascript\ndocument.querySelector(list).options[2].text\n\
    ```\n\n## Getting the selected list option\n\nIf your code needs to know whether\
    \ a particular option in a selection list is selected or deselected, examine the\
    \ option's selected property, like so:\n\n```javascript\noption.selected\n```\n\
    \nThe selected attribute returns true if the option is selected, or false if it\
    \ is deselected.\n\nFor example, consider the following list select:\n\n```html\n\
    <select id=\"hair-color\" name=\"hair-color\">\n  <option value=\"black\">Black</option>\n\
    \  <option value=\"blonde\">Blonde</option>\n  <option value=\"brunette\">Brunette</option>\n\
    \  <option value=\"red\">Red</option>\n  <option value=\"neon\">Something neon</option>\n\
    \  <option value=\"none\">None</option>\n</select>\n```\n\nYour code will likely\
    \ want to know which option in selection is selected. You do that via the list's\
    \ selectedOptions property:\n\n```javascript\nconst hairColor = document.querySelector('#hair-color').selectedOptions[0];\n\
    ```\n\nThis isn't a multi-select list, so selectedOptions returns the selected\
    \ option element. In this example, your code could use hairColor.text to get the\
    \ text of the selected option.\n\nIf the list includes the multiple attribute,\
    \ the selectedOptions property may return an HTMLCollection object that contains\
    \ multiple elements. Your code needs to allow for that possibility by, looping\
    \ through the collection:\n\n### HTML:\n\n```html\n<select id=\"hair-products\"\
    \ name=\"hair-products\"\nsize=\"5\" multiple>\n  <option value=\"gel\" selected>Gel</option>\n\
    \  <option value=\"grecian-formula\" selected>Grecian Formula</option>\n  <option\
    \ value=\"mousse\">Mousse</option>\n  <option value=\"peroxide\">Peroxide</option>\n\
    \  <option value=\"shoe-black\">Shoe black</option>\n</select>\n```\n\n### JavaScript:\n\
    \n```javascript\nconst selectedHairProducts = document.\n  querySelector('#hair-products').selectedOptions;\n\
    \  for (const hairProduct of selectedHairProducts) {\n    console.log(hairProduct.text);\n\
    \  }\n```\n\n## Changing the selected option\n\nTo select a selection list option\
    \ to either the selected or deselected state, assign a Boolean expression to the\
    \ option object's selected property:\n\n```javascript\noption.selected = Boolean\n\
    ```\n\nHere's what the various parts are:\n\n- **option**: A reference to the\
    \ option element you want to modify.\n- **Boolean**: The Boolean value or expression\
    \ to assign to the option. Use true to select the option; false to deselect the\
    \ option.\n\nUsing the HTML code from the previous section, the following statement\
    \ selects the third option in the list:\n\n```javascript\ndocument.querySelector('#hair-products').\n\
    \  options[2].selected = true;\n```\n\nYou can reset the list by deselecting all\
    \ the options. You do that by setting the selection list object's selectedIndex\
    \ property to -1:\n\n```javascript\ndocument.querySelector('#hair-products').\n\
    selectedIndexselectedIndex -1\n```\n\n## Working with Form Events\n\nWith all\
    \ the clicking, typing, tabbing, and dragging that goes on, web forms are veritable\
    \ event factories. Fortunately, you can let most of these events pass you by,\
    \ but a few do come in handy, both in running code when the event occurs and in\
    \ triggering the events yourself.\n\nMost events are clicks, so you can handle\
    \ them by setting click event handlers using JavaScript's addEventListener() method\
    \ (which I cover in Chapter 6). Here's an example:\n\nHTML:\n\n```html\n<form>\n\
    \  <label for=\"user\">Username:</label>\n  <input id=\"user\" type=\"text\" name=\"\
    username\">\n  <label for=\"pwd\">Password:</label>\n  <input id=\"pwd\" type=\"\
    password\">\n</form>\n```\n\nJavaScript:\n\n```javascript\ndocument.querySelector('form').\n\
    \  addEventListener('click', () => {\n    console.log('Thanks for clicking the\
    \ form!');\n  });\n```\n\nThis example lists listeners for clicks on the field.\n\
    \n### Setting the focus\n\nRather than the focus, you may want to monitor when\
    \ a particular field gets focus (for example, by the user clicking into the field).\
    \ You can monitor that by setting up a focus handler:\n\n```javascript\nfield.addEventListener('focus',\
    \ () => {\n  Focus goes here\n});\n```\n\nHere's an example:\n\n```javascript\n\
    document.querySelector('#user').\naddEventListener('focus', () => {\n  console.log('The\
    \ username field has focus');\n});\n```\n\n### Monitoring the blur event\n\nThe\
    \ opposite of setting the focus on an element is blurring an element, which removes\
    \ the focus from the element. You blur an element by running the blur() method\
    \ on the element, which causes it to lose focus:\n\n```javascript\nfield.blur()\n\
    ```\n\nHowever, rather than blur an element, you're more likely to want to run\
    \ some code when a particular element is blurred (for example, by the user clicking\
    \ out of the field). You can monitor for a particular element by setting up a\
    \ blur() event handler:\n\n```javascript\nfield.addEventListener('blur', () =>\
    \ {\n  Blur code goes here\n});\n```\n\nHere's an example:\n\n```javascript\n\
    document.querySelector('#user').\naddEventListener('blur', () => {\n  console.log('The\
    \ username field no longer has focus!');\n});\n```\n\n## Listening for element\
    \ changes\n\nOne of the most useful form events is the change event, which fires\
    \ when the value or state of a field is modified. When this event fires depends\
    \ on the element type:\n\n- For a textarea element and the various text-related\
    \ input elements, the change event fires when the element loses its focus.\n-\
    \ For checkboxes, radio buttons, selection lists, pickers, the change event fires\
    \ as soon as the user clicks the element to modify the selection or value.\n\n\
    You listen for a field's change events by setting up a change() event handler:\n\
    \n```javascript\nfield.addEventListener('change', () => {\n  Change code goes\
    \ here\n});\n```\n\nHere's an example:\n\nHTML:\n\n```html\n<label for=\"bgcolor\"\
    >Select a background color</label>\n<input id=\"bgcolor\" type=\"color\" name=\"\
    bg-color\" value=\"#ffffff\">\n```\n\nJavaScript:\n\n```javascript\ndocument.querySelector('#bgcolor').\n\
    addEventListener('change', (event) => {\n  const backgroundColor = event.target.value;\n\
    \  document.body.backgroundColor = backgroundColor;\n});\n```"
  mdcn: "\n- >> select: 选择列表框中可见的可选行数。如果你省略了此值，浏览器将以下拉框的形式显示该列表。\n- >> multiple: 当此可选属性存在时，允许用户在列表中选择多个选项。\n\
    \n对于列表中的每个项目，你需要在 `<select>` 标签和 `</select>` 标签之间添加一个 `<option>` 标签：\n\n```html\n\
    <option value=\"optionValue\" [selected]>\n```\n\n以下是各个部分的含义：\n\n- >> oldValue:\
    \ 你想要赋值给列表选项的值。\n- >> selected: 当此可选属性存在时，该列表选项将初始化为被选中状态。\n\n## 引用选择列表选项\n\n\
