    A JavaScript expression takes one or more inputs, such as a bill total and a tip
    percentage, and combines them in some way — for example, by using multiplication.
    In expression lingo, the inputs are called operands, and they''re combined by
    using special symbols called operators.'
  - '[PAGE 43]


    +   operand: An input value for an expression. It is, in other words, the raw
    data that the expression manipulates to produce its result. It could be a number,
    a string, a variable, a function result (refer to Chapter 5), or an object property
    (refer to Chapter 6).


    +   operator: A symbol that represents a particular action performed on one or
    more operands. For example, the * operator represents multiplication, and the
    + operator represents addition. I discuss the various JavaScript operators throughout
    this chapter.


    For example, here''s an expression that calculates a tip amount and assigns the
    result to a variable:


    ```

    tipAmount = billTotal * tipPercentage;

    ```


    The expression is everything to the right of the equals sign (=). Here, billTotal
    and tipPercentage are the operands, and the multiplication sign (*) is the operator.


    # Creating Numeric Expressions


    In JavaScript, a mathematical calculation is called a numeric expression, and
    it combines numeric operands and arithmetic operators to produce a numeric result.
    This section discusses all the JavaScript arithmetic operators and shows you how
    best to use them to build useful and handy numeric expressions.


    Table 3-1 lists the basic arithmetic operators you can use in your JavaScript
    expressions.


    JavaScript also comes with a few extra operators that combine some of the arithmetic
    operators and the assignment operator, which is the humble equals sign (=) that
    assigns a value to a variable. Table 3-2 lists these so-called arithmetic assignment
    operators.'
  - '[PAGE 44]


    # TABLE 3-1 The JavaScript Arithmetic Operators


    | Operator | Name | Example | Result |

    |---|---|---|--|

    | + | Addition | 10 + 4 | 14 |

    | ++ | Increment | 10++ | 11 |

    | - | Subtraction | 10 - 4 | 6 |

    | - | Negation | -10 | -10 |

    | -- | Decrement | 10-- | 9 |

    | * | Multiplication | 10 * 4 | 40 |

    | / | Division | 10 / 4 | 2.5 |

    | % | Modulus | 10 % 4 | 2 |


    # TABLE 3-2 The JavaScript Arithmetic Assignment Operators


    | Operator | Example | Equivalent |

    |---|---|--|

    | += | x += y | x = x + y |

    | -= | x -= y | x = x - y |

    | *= | x *= y | x = x * y |

    | /= | x /= y | x = x / y |

    | ^= | x ^= y | x = x ^ y |

    | %= | x %= y | x = x % y |


    # Building String Expressions


    A string expression is where at least one of the operands is a string, and the
    result of the expression is another string. String expressions are straightforward
    in the sense that there is only one operator to deal with: concatenation (+).
    You use this operator to combine (or concatenate) strings within an expression.
    For example, the expression "Java" + "Script" returns the string "JavaScript".
    Note, however, you can also use strings with the comparison operators discussed
    in the next section.'
  - '[PAGE 45]


    # Building Comparison Expressions


    You use comparison expressions to compare the values of two or more numbers, strings,
    variables, properties, or function results. If the expression is true, the expression
    result is set to the Boolean true; if the expression is false, the expression
    result is set to the Boolean value false. You''ll use comparisons with alarming
    frequency in your JavaScript code, so it''s important to understand what they
    are and how you use them.


    Table 3-3 summarizes JavaScript''s comparison operators.


    # TABLE 3-3 The JavaScript Comparison Operators


    | Operator | Name | Example | Result |

    | --- | --- | --- | --- |

    | == | Equality | 10 == 4 | false |

    | != | Inequality | 10 != 4 | true |

    | > | Greater than | 10 > 4 | true |

    | < | Less than | 10 < 4 | false |

    | >= | Greater than or equal | 10 >= 4 | true |

    | <= | Less than or equal | 10 <= 4 | false |

    | === | Strict equality | "10" === 10 | false |

    | !== | Strict inequality | "10" !== 10 | true |


    # Building Logical Expressions


    You use logical expressions to combine or manipulate Boolean values, particularly
    comparison expressions. For example, if your code needs to test whether two different
    comparison expressions are both true before proceeding, you can do that with a
    logical expression.


    Table 3-4 lists JavaScript''s logical operators.'
  - '[PAGE 46]


    # TABLE 3-4 The JavaScript Logical Operators


    | Operator | Name | General Syntax | Returned Value |

    |---|---|---|--|

    | && | AND | expr1 && expr2 | true if both expr1 and expr2 are true; false otherwise.
    |

    | || | OR | expr1 || expr2 | true if one or both of expr1 and expr2 are true;
    false otherwise. |

    | ! | NOT | !expr | true if expr is false; false if expr is true. |


    # Understanding Operator Precedence


    In complex expressions, the order in which the calculations are performed becomes
    crucial. For example, consider the expression 3+5*2. If you calculate from left
    to right, the answer you get is 16 (3+5 equals 8, and 8*2 equals 16). However,
    if you perform the multiplication first and then the addition, the result is 13
    (5*2 equals 10, and 3+10 equals 13).


    To control this ordering problem, JavaScript evaluates the expression according
    to a predefined order of precedence. This order of precedence lets JavaScript
    calculate an expression unambiguously by determining which part of the expression
    it part second, and so on.


    # The order of precedence


    The order of precedence JavaScript uses is determined by the various expression
    operators that I''ve covered so far in this chapter. Table 3-5 summarizes the
    complete order of precedence used by JavaScript.


    For example, Table 3-5 tells you that JavaScript performs multiplication before
    addition. Therefore, the correct answer for the expression 3+5*2 (just discussed)
    is 13.'
  - '[PAGE 47]


    # TABLE 3-5 The JavaScript Order of Precedence for Operators


    | Operator | Operation | Order of Precedence | Order of Evaluation |

    | --- | --- | --- | --- |

    | ++ | Increment | First | R -> L |

    | -- | Decrement | First | R -> L |

    | - | Negation | First | R -> L |

    | ! | NOT | First | R -> L |

    | *, /, % | Multiplication, division, modulus | Second | L -> R |

    | +, - | Addition, subtraction | Third | L -> R |

    | + | Concatenation | Third | L -> R |

    | <, <= | Less than, less than or equal | Fourth | L -> R |

    | >, >= | Greater than, greater than or equal | Fourth | L -> R |

    | == | Equality | Fifth | L -> R |

    | != | Inequality | Fifth | L -> R |

    | === | Strict equality | Fifth | L -> R |

    | !== | Strict inequality | Fifth | L -> R |

    | && | AND | Sixth | L -> R |

    | || | OR | Sixth | L -> R |

    | ?: | Ternary | Seventh | R -> L |

    | = | Assignment | Eighth | L -> R |

    | +=, -=, =, etc. | Arithmetic assignment | Eighth | R -> L |'
  - '[PAGE 48]


    # Controlling the order of precedence


    Sometimes you want to take control of the situation and override the order of
    precedence. That may seem like a decidedly odd thing to do, so perhaps an example
    is in. Suppose you know the final price of an item and, given the tax rate, you
    want to know the original (that is, pre-tax) price.


    A first pass at the JavaScript calculation may look something like this:


    ```

    retailPrice = totalPrice / 1 + taxRate;

    ```


    This won''t work. Why not? Well, according to the rules of precedence, JavaScript
    performs division before addition, so the totalPrice value first is divided by
    1 and then is added to the taxRate value, which isn''t the correct order.


    To get the correct answer, you have to override the order of precedence so that
    the addition 1 + taxRate is performed first. You override precedence by surrounding
    that part of the expression with parentheses, as shown in the following code:


    ```

    const retailPrice = totalPrice / (1 + taxRate);

    ```


    In general, you can use parentheses to control the order that JavaScript uses
    to calculate expressions. Terms inside parentheses are always calculated first;
    terms outside parentheses are calculated sequentially (according to the order
    of precedence).'
- md: "## Setting up your code to make decisions\n## Understanding code looping\n\
    ## Setting up code loops\n\n## Chapter 4\n### Controlling the Flow of JavaScript\n\
    \nWith the default script flow, the browser processes the code inside a script\
    \ element or an external JavaScript file one statement at a time. The browser\
    \ reads and executes the first statement, reads and then executes the second statement,\
    \ and so on until it has no more JavaScript left to read and execute.\n\nThat\
    \ statement-by-statement flow seems reasonable, but it's extremely limited. What\
    \ if you want your code to test some condition and then branch to a specific chunk\
    \ of code depending on the result of that test? What if you want your code to\
    \ repeat some statements multiple times, with some change occurring in each repetition?\
    \ Code that runs tests and code that repeats itself all fall under the rubric\
    \ of controlling the flow of JavaScript. In this chapter, you explore this fascinating\
    \ and powerful subject.\n\n## Decision-Making with if Statements\n\nA smart script\
    \ performs tests on its environment and then decides what to do next based on\
    \ the results of each test. For example, suppose you've declared a variable that\
    \ you later use as a divisor in an expression. You should test the variable before\
    \ using it in the expression to make sure that the variable's value isn't zero.\n\
    \nThe most basic test is the simple true/false decision (which could be thought\
    \ of as a yes/no or an on/off decision). In this case, your program looks at a\
    \ certain condition, determines whether it's currently true or false, and acts\
    \ accordingly. Logical expressions (covered in Chapter 3) play a big part here\
    \ because they always return a true result.\n\nIn JavaScript, simple true/false\
    \ decisions are handled by the if statement. You can use either the single-line\
    \ syntax:\n\n```\nif (expression) statement;\n```\n\nor the block syntax:\n\n\
    ```javascript\nif (expression) {\n  statement1;\n  statement2;\n  ...\n}\n```\n\
    \nIn both cases, expression is a comparison or logical expression that returns\
    \ true or false, and statement(s) represent the JavaScript statement or statements\
    \ to run if expression returns true. If expression returns false, JavaScript skips\
    \ over the statements.\n\n> This is a good place to note that JavaScript defines\
    \ the following values as the equivalent of 0, \"\" (that is, the empty string),\
    \ null, and undefined. Everything else is the equivalent of true.\n\n> This is\
    \ the first time you've encountered JavaScript's braces (( and )), so take a second\
    \ to understand what they do they come up a lot. The braces surround one or more\
    \ statements that you want JavaScript to treat as a single entity. This entity\
    \ is a kind of statement itself, so the whole caboodle — the braces and the code\
    \ they enclose — is called a block statement. Also, any JavaScript construction\
    \ that consists of a statement (such as if) followed by a block statement is called\
    \ a compound statement. Also, just to keep you on your toes, note that the lines\
    \ that include the braces don't end with semicolons.\n\nWhether you use the single-line\
    \ or block syntax depends on the statements you want to run if the expression\
    \ returns a true result. If you have only one statement, you can use either syntax.\
    \ If you have multiple statements, use the block syntax.\n\nConsider the following\
    \ example:\n\n```javascript\nif (totalSales != 0) {\n  const grossMargin = (totalSales\
    \ - totalExpenses) / totalSales;\n}\n```\n\nThis code assumes that earlier, the\
    \ script has calculated the total sales and total expenses, which are stored in\
    \ totalSales and totalExpenses variables, respectively. The code calculates the\
    \ gross margin, which is defined as gross profit (that is, minus expenses) divided\
    \ by sales. The code uses if to test the value of the totalSales variable is not\
    \ equal to zero. If the totalSales != 0 expression returns true, the gross Margin\
    \ calculation is executed; otherwise, nothing happens. The test in this example\
    \ is righteous because it ensures that the divisor in the calculation — totalSales\
    \ — is never zero.\n\n## Branching with if...else Statements\n\nUsing the if statement\
    \ to make decisions adds a powerful new weapon to your JavaScript answer. However,\
    \ the simple version of if suffers from an important limitation: A false result\
    \ only bypasses one or more statements; it doesn't execute any of its own. This\
    \ is in many cases, but there will be times you need to run one group of statements\
    \ if the condition returns true and a different group if the result is false.\
    \ To handle these scenarios, you need to use an if...else statement:\n\n```javascript\n\
    if (expression) {\n    statements-if-true\n} else {\n    statements-if-false\n\
    }\n```\n\nThe expression is a comparison or logical expression that returns true\
    \ or false. statements-if-true represents the block of statements you use JavaScript\
    \ to run if expression returns true, and statements-if-false represents the block\
    \ of statements you executed if expression returns false.\n\nAs an example, consider\
    \ the following code:\n\n```javascript\nlet discountRate;\nif (currMonth === \"\
    December\") {\n    discountRate = 0.2;\n} else {\n    discountRate = 0.1;\n}\n\
    const discountedPrice = regularPrice * (1 - discountRate);\n```\n\nThis code calculates\
    \ a discount price of an item, the code depends on whether the current month is\
    \ December. The code assumes that earlier, the script set the value of the current\
    \ month (currMonth) and the item's regular price (regularPrice). After declaring\
    \ the discountRate variable, an if...else statement checks whether curr equals\
    \ December. If the totalSales != 0 expression returns true, the gross Margin calculation\
    \ is executed; otherwise, nothing happens. The test in this example is righteous\
    \ because it ensures that the divisor in the calculation — totalSales — is never\
    \ zero.\n\n## Understanding the Value of Looping\n\nThere are some who would say\
    \ that the only goal of programming is to get it done. As long as the code produces\
    \ the correct result, everything else is superfluous. However, the best ways to\
    \ introduce efficiency into your coding is to avoid reinventing too wheels. For\
    \ example, consider the following code:\n\n```javascript\nlet sum = 0;\nlet num\
    \ = prompt(\"Type a number:\", 1);\nsum += Number(num);\nnum = prompt(\"Type a\
    \ number:\", 1);\nsum += Number(num);\nnum = prompt(\"Type a number:\", 1);\n\
    sum += Number(num);\ndocument.write(\"The total of your numbers is \" + sum);\n\
    ```\n\nThis code first declares a variable named sum. The code prompts the user\
    \ for a number (using the prompt method with a default value of 1) that gets stored\
    \ in the num variable, adds value to sum, and then repeats this more times. (Note\
    \ my use of the Number-function, which ensures that the value returned by prompt\
    \ is treated as a number rather than a string.) Finally, the sum of the three\
    \ numbers is displayed to the user.\n\nBesides being a tad useless, this code\
    \ just reeks of inefficiency because most of the code consists of the following\
    \ two lines appearing three times:\n\n```javascript\nnum = prompt(\"Type a number:\"\
    , 1);\nsum += Number(num);\n```\n\nWouldn't it be more efficient if you put these\
    \ two statements just once in the code and then get JavaScript to repeat these\
    \ as many times as necessary?\n\nWhy, yes, and the good news is that not only\
    \ is it possible to do this, but JavaScript also gives you a number of different\
    \ methods to perform this-called looping. I spend the rest of the chapter investigating\
    \ each of these methods.\n\n## Working with while Loops\n\nThe most straightforward\
    \ of the JavaScript loop constructions is the while loop, which uses the following\
    \ syntax:\n\n```javascript\nwhile (expression) {\n  statements\n}\n```\n\nHere,\
    \ *expression* is a comparison or logical expression (that is, an expression that\
    \ returns *true* or *false*) that, as long as it returns *true*, tells JavaScript\
    \ to keep executing the *statements* within the block.\n\nEssentially\n\nHere's\
    \ a closer look at how a *while* loop works:\n\n- 1. Evaluate the *expression*\
    \ in the while statement.\n2. If *expression* is true, continue with Step 3; if\
    \ *expression* is false, skip to Step 5.\n3. Execute each of the statements in\
    \ the block.\n4. Return to Step 1.\n5. Exit the loop (that is, execute the next\
    \ statement that occurs after the while block)."
