    \ syntax is a bit more complex than that of the while loop. However, the for loop\
    \ excels at one thing: looping when you know exactly how times you want to repeat\
    \ a group of statements. This is extremely common in all types of programming,\
    \ so there's no wonder for is so often used in scripts.\n\nThe structure of a\
    \ typical for loop looks like this:\n\n```\nfor (let counter = start; counterExpression;\n\
    counterUpdate) {\n  statements\n}\n```\n\nThere's a lot going on here, I'll take\
    \ it one bit at a time:\n\n+   **counter: A numeric variable used as a loop counter.\
    \ The loop counter is a number that counts how many times the procedure goes through\
    \ the loop. (Note that you need to include it only if this is the first time you've\
    \ used the variable in the script.)\n\n+   **start: The initial value of counter.**\
    \ This value is usually 1, but you can use whatever value makes sense for your\
    \ script.\n\n+   **counterExpression: A comparison or logical expression that\
    \ determines the number of times through the loop goes. This expression usually\
    \ compares the current value of counter to some maximum value.\n\n+   **counterUpdate:\
    \ An expression that changes the value of counter.** This expression is evaluated\
    \ after each turn through the loop. Most of the time, you'll increment the value\
    \ of counter with the expression counter += 1.\n\n+   **statements: The statements\
    \ you want JavaScript to execute each time through the loop."
  - "[PAGE 59]\n\nWhen JavaScript stumbles upon the for statement, it changes into\
    \ its for-loop outfit and follows this seven-step process:\n\n+   1. Set counter\
    \ equal to start.\n2. Evaluate counterExpression in the for statement.\n3. If\
    \ counterExpression is true, continue with Step 4; if counterExpression is false,\
    \ skip to Step 7.\n4. Execute each of the statements in the block.\n5. Use counterUpdate\
    \ to increment (or whatever) counter.\n6. Return to Step 2.\n7. Exit the loop\
    \ (that is, execute the next statement that occurs after the for).\n\nAs an example,\
    \ the following code shows how to use for to rewrite the inefficient code shown\
    \ earlier in this chapter:\n\n```\nlet sum = 0;\nlet num;\nfor (let counter =\
    \ 1; counter <= 3; counter += 1) {\n  num = prompt(\"Type a number:\", 1);\n \
    \ sum += Number(num);\n}\ndocument.write(\"The total of your numbers\nis \" +\
    \ sum);\n```\n\nThis is the most efficient version yet because the declaring,\
    \ initializing, and incrementing of the counter variable all take place within\
    \ the for statement.\n\nTo keep the number of variables declared in a script to\
    \ a minimum, always try to use the same name in all your for loop counters. The\
    \ letters i through n traditionally are used for counters in programming. For\
    \ greater clarity, you may prefer full words, as out counter.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_59_0.png)\n\
    \nHere's a slightly more complex example:\n\n```\nlet sum = 0;\nfor (let counter\
