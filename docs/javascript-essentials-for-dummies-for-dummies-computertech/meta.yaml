  md: "# Working for Loops\n\nAlthough while is the most straightforward of the JavaScript\
    \ loops, the most common type by far is the for loop. This fact is slightly surprising\
    \ when you consider (as you will shortly) the for loop's syntax is a bit more\
    \ complex than that of the while loop. However, the for loop excels at one thing:\
    \ looping when you know exactly how times you want to repeat a group of statements.\
    \ This is extremely common in all types of programming, so there's no wonder for\
    \ is so often used in scripts.\n\nThe structure of a typical for loop looks like\
    \ this:\n\n```\nfor (let counter = start; counterExpression;\ncounterUpdate) {\n\
    \  statements\n}\n```\n\nThere's a lot going on here, I'll take it one bit at\
    \ a time:\n\n+   **counter: A numeric variable used as a loop counter. The loop\
    \ counter is a number that counts how many times the procedure goes through the\
    \ loop. (Note that you need to include it only if this is the first time you've\
    \ used the variable in the script.)\n\n+   **start: The initial value of counter.**\
    \ This value is usually 1, but you can use whatever value makes sense for your\
    \ script.\n\n+   **counterExpression: A comparison or logical expression that\
    \ determines the number of times through the loop goes. This expression usually\
    \ compares the current value of counter to some maximum value.\n\n+   **counterUpdate:\
    \ An expression that changes the value of counter.** This expression is evaluated\
    \ after each turn through the loop. Most of the time, you'll increment the value\
    \ of counter with the expression counter += 1.\n\n+   **statements: The statements\
    \ you want JavaScript to execute each time through the loop."
  merge: -1
