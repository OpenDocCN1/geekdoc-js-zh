    The headerImage variable holds the img element object, so your code could now
    reference the img element''s attribute values by any of the following property
    references:


    ```

    headerImage.id

    headerImage.src

    headerImage.alt

    ```


    However, the DOM doesn''t create properties either for custom attributes or for
    added programmatically. Fortunately, each element object also offers methods that
    enable you to read any attribute, as well as add, modify, or remove the element''s
    attributes. The next few sections tell all.


    # Reading an attribute value


    If you want to read the current value of an attribute for an element, use the
    element object''s getAttribute() method:


    ```

    element.getAttribute(attribute)

    ```


    Here''s what the various parts are:


    +   - element: The element you want to work with

    - attribute: The name of the attribute you want to read


    Here''s an example that gets the src attribute of the element with an id value
    of header-image:


    ```

    const headerImage = document.

    getElementById("header-image")

    const srcHeaderImage = headerImage.

    getAttribute("src");

    ```


    # Setting an attribute value


    To set an attribute value on an element, use the element object''s setAttribute()
    method:


    ```

    element.setAttribute(attribute, value);

    ```'
