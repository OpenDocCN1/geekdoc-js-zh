    \ index) => {\n  console.log(\"Element \" + index + \" has the value \" + value);\n\
    });\n```\n\n## Iterating to create a new array: map()\n\nWhen you iterate over\
    \ an array, it's common to apply some operation to each element value. In some\
    \ cases, however, you want to preserve the original array values and create a\
    \ new array that contains the updated values.\n\nThe easiest way to create a new\
    \ array that stores updated values of an existing array is to use the Array object's\
    \ map() method. There are three syntaxes you can use:\n\n```javascript\narray.map(namedFunction);\n\
    array.map(function (value, index, array) { code });\narray.map((value, index,\
    \ array) => { code });\n```\n\nHere's what the various parts are:\n\n- * array:\
    \ The Array object with the values you want to use.\n- * namedFunction: The name\
    \ of an existing function that performs the operation on each array value. This\
    \ function should accept the value argument and perhaps also the optional index\
    \ and array arguments.\n- code: The statements to run during each iteration perform\
    \ the operation on each value.\n\nThe map() method returns an Array object that\
    \ contains the updated values, so be sure to store the result in a variable.\n\
    \nHere's an example:\n\n```javascript\n// Declare an array of Fahrenheit temperatures\n\
    const tempsFahrenheit = [-40, 0, 32, 100, 212];\n\n// Convert each array value\
    \ to Celsius\nconst tempsCelsius = tempsFahrenheit.map(currentTemp => {\n  return\
    \ (currentTemp - 32) * 0.5556;\n});\n\n// Output the result\nconsole.log(tempsCelsius);\n\
    ```\n\n## Iterating an array down to a value: reduce()\n\nOne common iteration\
    \ pattern is to perform a cumulative operation on every element in an array to\
    \ produce a value. For example, you may want to know the sum of all the values\
    \ in the array.\n\nIterating an array in this way to produce a value is the job\
    \ of the Array object's reduce() method. There are three syntaxes you can use:\n\
    \n```javascript\narray.reduce(namedFunction, initialValue);\narray.reduce(function\
    \ (value, index, array) { code }, initialValue);\narray.reduce((value, index,\
    \ array) => { code }, initialValue);\n```\n\nHere's what the various parts are:\n\
    \n- * array: The Array object with the values you want to use.\n- * namedFunction:\
