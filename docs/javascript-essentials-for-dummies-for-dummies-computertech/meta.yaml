    \n# 关于作者\n\n信息自然而然从我身上淌出来，就像水獭从玫瑰中提取珍贵的花蜜一样。\n\n> —马克·吐怀因\n\nPaul Fedries 是一位技术作家，他每天的工作就是编写像你手中这本书这样的书。事实上，Paul\
    \ 已经写了 100 多本书，全球销量已超过 400 万册。Paul 欢迎大家访问他的个人网站 https://paulmcfedries.com，或者在\
    \ X (www.twitter.com/paulmcf) 或 Facebook (www.facebook.com/PaulMcFedries) 上关注他。\n\
    \n# 献辞\n\n给 Karen，我的龙虾。\n\n# 作者致谢\n\n每当我完成一本书时，出版社都会给我寄来装有几本所谓“作者副本”的沉重箱子。打开盒子，拿起书，感受那件一直以来毫无重量的数字事物如今带来的分量感，并看到封面上印着我的名字，我告诉你，那种感觉非常棒。这确实很酷，但你知道什么真正酷吗？在我的写作生涯中，我已经这样做过一百多次了，看到封面上自己的名字从未让我感到厌倦。\n\
    \n但因为封面上只有我这一个名字，并不意味着这本书是一个人的独角戏。恰非如此。当然，我写了这本书的文字并截了屏，但这仅代表了构成“书”的一部分。其余部分得益于\
    \ Wiley 编辑、图形和制作团队的奉献和专业精神，他们辛勤耕耘，将我的文字和图像转化成了真正的书。\n\n我向所有让这本书成为可能的 Wiley 同仁表示由衷的感谢，但我想向与我直接合作的人员表示特别感谢：执行编辑\
    \ Lindsay Berg 和编辑 Elizabeth Kuball。\n\n# 出版社致谢\n\n执行编辑：Lindsay Berg\n编辑：Elizabeth\
    \ Kuball\n制作：Saikarth Kumar\n封面设计和图像：Wiley\n\n# 随处可见 dummies\n\n无论你是对电子书感兴趣、想从网上获取更多信息，还是沉浸于社交媒体，dummies都能让一切变得简单。\n\
    \ndummies 是该领域全球领先且最受信赖的品牌。不再局限于实体书籍，读者现在可以获取 dummies 所需的内容。我们将共同打造一种在竞争中脱颖而出的解决方案，帮助你实现目标。\n\
