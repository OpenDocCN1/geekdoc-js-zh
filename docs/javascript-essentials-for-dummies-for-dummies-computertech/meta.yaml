    # # Understanding the Value of Code Looping


    There are some who would say that the only real goal of the programmer is to get
    the job done. As long as the code produces the correct result or performs the
    correct tasks in the correct order, everything else is superfluous. Perhaps, real
    programmers know that the true goal of programming is not only to get the job
    done, but to get it done as efficiently as possible. Efficient scripts run faster,
    take less time to code, and are usually (not always, but usually) easier to read
    and troubleshoot.


    One of the best ways to introduce efficiency into your coding is to avoid reinventing
    too many wheels. For example, consider the following code:


    ```

    let sum = 0;

    let num = prompt("Type a number:", 1);

    sum += Number(num);

    num = prompt("Type a number:", 1);

    sum += Number(num);

    num = prompt("Type a number:", 1);

    sum += Number(num);

    document.write("The total of your numbers

    is is " + sum");

    ```


    This code first declares a variable named sum. The code prompts the user for a
    number (using the prompt method with a default value of 1) that gets stored in
    the num variable, adds value to sum, and then repeats this prompt-and-sum routine
    more times. (Note my use of the Number-function, which ensures that the value
    returned by prompt is treated as a number rather than a string.) Finally, the
    sum of the three numbers is displayed to the user.


    Besides being a tad useless, this code just reeks of inefficiency because most
    of the code consists of the following two lines appearing three times:


    ```

    num = prompt("Type a number:", 1);

    sum += Number(num);

    ```'
  - "[PAGE 55]\n\nWouldn't it be more efficient if you put these two statements just\
    \ once in the code and then somehow get JavaScript to repeat these statements\
    \ as many times as necessary?\n\nWhy, yes, and the good news is that not only\
    \ is it possible to do this, but JavaScript also gives you a number of different\
    \ methods to perform this so-called looping. I spend the rest of the chapter investigating\
    \ each of these methods.\n\n# Working with while Loops\n\nThe most straightforward\
    \ of the JavaScript loop constructions is the while loop, which uses the following\
    \ syntax:\n\n```\nwhile (expression) {\n  statements\n}\n```\n\nHere, *expression*\
    \ is a comparison or logical expression (that is, an expression that returns *true*\
    \ or *false*) that, as long as it returns *true*, tells JavaScript to keep executing\
    \ the *statements* within the block.\n\nEssentially\n\nHere's a closer look at\
    \ how a *while* loop works:\n\n+   1. Evaluate the *expression* in the while statement.\n\
    2. If *expression* is true, continue with Step 3; if *expression* is false, skip\
    \ to Step 5.\n3. Execute each of the statements in the block.\n4. Return to Step\
    \ 1.\n5. Exit the loop (that is, execute the next statement that occurs after\
    \ the while block)."
- md: "The following code demonstrates how to use while to rewrite inefficient code\
    \ shown in the previous section:\n\n```javascript\nlet sum = 0;\nlet counter =\
    \ 1;\nlet num;\nwhile (counter <= 3) {\n  num = prompt(\"Type a number:\", 1);\n\
    \  sum += Number(num);\n  counter += 1;\n}\ndocument.write(\"The total of your\
    \ numbers is \" + sum);\n```\n\nTo control the loop, the code declares a variable\
    \ named counter and initializes it to 1, which means that the expression counter\
    \ <= 3 is true, so the code enters the block, the prompt-and-sum thing, and then\
    \ increments counter. This is repeated until the third time through the loop,\
    \ when counter is incremented to 4, at which point the expression counter <= 3\
    \ becomes false and the loop is done.\n\nTo make your loop code as readable as\
    \ possible, always use two or four-space indent for each statement in the while\
    \ block. The same applies to the for and do...while loops that I talk about later\
    \ in this chapter.\n\nThe while statement isn't the greatest loop choice when\
    \ you know exactly how many times you want to run through the loop. For that,\
    \ use the for statement, described in the next section. The best use of the while\
    \ statement is when your script has some naturally occurring condition that you\
    \ can turn into a comparison expression. A good example is when you're prompting\
    \ the user for input values. You'll often want to keep prompting the user until\
    \ they click the Cancel button. The easiest way to set that is to include the\
    \ prompt inside a while loop, as shown here:\n\n```javascript\nlet sum = 0;\n\
    let num = prompt(\"Type a number or click Cancel.\", 1);\n```\n\n```javascript\n\
    while (num != null) {\n  sum += Number(num);\n  num = prompt(\"Type a number or\
    \ click Cancel:\", 1);\n}\ndocument.write(\"The total of your numbers is \" +\
    \ sum);\n```\n\nThe first prompt method displays a dialog box like the one in\
    \ Figure 4-1 to get the initial value; then it stores it in the num variable.\n\
    \nFIGURE 4-1: Set up your while expression so that the prompting stops when the\
    \ user clicks the Cancel button.\n\nThe while statement checks the following expression:\n\
    \n```javascript\nnum != null\n```\n\nTwo things can happen here:\n\n- If the user\
    \ enters a number, this expression returns true and the loop continues. In this\
    \ case, the value of num is added to the sum variable, and the user is prompted\
    \ for the next number.\n\n- If the user clicks Cancel, the value returned by prompt\
    \ is null, so the expression becomes false and the looping stops.\n\n# Working\
    \ for Loops\n\nAlthough while is the most straightforward of the JavaScript loops,\
    \ the most common type by far is the for loop. This fact is slightly surprising\
    \ when you consider (as you will shortly) the for loop's syntax is a bit more\
    \ complex than that of the while loop. However, the for loop excels at one thing:\
    \ looping when you know exactly how times you want to repeat a group of statements.\
    \ This is extremely common in all types of programming, so there's no wonder for\
    \ is so often used in scripts.\n\nThe structure of a typical for loop looks like\
    \ this:\n\n```javascript\nfor (let counter = start; counterExpression; counterUpdate)\
    \ {\n  statements\n}\n```\n\nThere's a lot going on here, I'll take it one bit\
    \ at a time:\n\n- **counter**: A numeric variable used as a loop counter. The\
    \ loop counter is a number that counts how many times the procedure goes through\
    \ the loop. (Note that you need to include it only if this is the first time you've\
    \ used the variable in the script.)\n\n- **start**: The initial value of counter.\
    \ This value is usually 1, but you can use whatever value makes sense for your\
    \ script.\n\n- **counterExpression**: A comparison or logical expression that\
    \ determines the number of times through the loop goes. This expression usually\
    \ compares the current value of counter to some maximum value.\n\n- **counterUpdate**:\
    \ An expression that changes the value of counter. This expression is evaluated\
    \ after each turn through the loop. Most of the time, you'll increment the value\
    \ of counter with the expression counter += 1.\n\n- **statements**: The statements\
    \ you want JavaScript to execute each time through the loop.\n\nWhen JavaScript\
    \ stumbles upon the for it follows this seven-step process:\n\n1. Set counter\
    \ equal to start.\n2. Evaluate counterExpression.\n3. If counterExpression is\
    \ true, continue to 4; if counterExpression is false, skip to 7.\n4. Execute the\
    \ statements.\n5. Use counterUpdate to increment counter.\n6. Return to Step 2.\n\
    7. Exit the loop.\n\nAs an example, the following code shows how to use for to\
    \ rewrite inefficient code:\n\n```javascript\nlet sum = 0;\nlet num;\nfor (let\
    \ counter = 1; counter <= 3; counter += 1) {\n  num = prompt(\"Type a number:\"\
    , 1);\n  sum += Number(num);\n}\n```\n\nThis is the most efficient version because\
    \ it uses the declaring, initializing, and incrementing of counter all in the\
    \ statement. To keep clarity, you may prefer to use words for counters, always\
    \ try to use for.\n\nIt's also possible to use for to count down. You do this\
    \ by using the subtraction assignment operator instead of the addition assignment\
    \ operator:\n\n```javascript\nfor (let counter = start; counterExpression; counter\
    \ -= 1) {\n  statements\n}\n```\n\nIn this case, you must initialize the counter\
    \ variable to the maximum value you want to use for the loop counter, and use\
    \ the counterExpression to compare the value of counter to the minimum value you\
    \ want to use to end the loop.\n\nIn the following example, I use a decrementing\
    \ counter to ask the user to rank, in reverse order, their three CSS colors:\n\
    \n```javascript\nfor (let rank = 3; rank >= 1; rank -= 1) {\n  let ordinal;\n\
    \  let color;\n  switch (rank) {\n    case 1:\n      ordinal = \"first\";\n  \
    \    break;\n    case 2:\n      ordinal = \"second\";\n      break;\n    case\
    \ 3:\n      ordinal = \"third\";\n  }\n  color = prompt(\"What is your \" + ordinal\
    \ + \"-favorite CSS color?\", \"\");\n  document.write(rank + \" \" + color +\
    \ \"<br>\");\n}\n```\n\nThe loop runs by decrementing the rank variable from 3\
    \ down to 1. Each iteration of the loop prompts the user to type a favorite CSS\
    \ color, and that color is written to the page, with the current of rank being\
    \ used to create a reverse-ordered list, as shown in Figure 4-3.\n\nFIGURE 4-2:\
    \ This script uses the current value of counter variable to customize the prompt\
    \ message."
