    \ is to be sent to the server.\n\nHowever, if your scripts deal with form data\
    \ only locally — that is, you never send the data to a server — then you don't\
    \ need to bother with submitting the form data. Instead, it's more straight-forward\
    \ to add a button to your form and then use that button's `click` event handler\
