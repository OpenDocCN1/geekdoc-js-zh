- img_proc: true
  md: '+   Because your JavaScript programs run inside a user''s browser, dates and
    times are almost always the user''s local dates and times. That is, the dates
    and times your scripts will manipulate not be those of the server on which your
    page resides. This means that you can never know what time the user is viewing
    your page.


    # Learning the arguments used with the Date object


    Before getting to the nitty-gritty of the Date object and its associated methods,
    I''ll take a second to run through the various arguments that JavaScript requires
    for many date-related features. This will save us from repeating these arguments
    tediously later on. Table 8–3 has the details.


    TABLE 8–3 Arguments Associated with the Date Object


    | Argument | What It Represents | Possible Values |

    |---|---|--|

    | date | A variable name | A Date object |

    | yyyy | The year | Four-digit integers |

    | yy | The year | Two-digit integers |

    | month | The month | The full month name from "January" to "December" |

    | mth | The month | Integers from 0 (january) to 11 (December) |

    | dd | The day of the month | Integers from 1 to 31 |

    | hh | The hour of the day | Integers from 0 (midnight) to 23 (11:00 PM) |

    | mm | The minute of the hour | Integers from 0 to 59 |

    | ss | The second of the minute | Integers from 0 to 59 |

    | ms | The milliseconds of the second | Integers from 0 to 999 |'
