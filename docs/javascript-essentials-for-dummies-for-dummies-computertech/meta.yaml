    \n最基本的测试是简单的真/假决策（可以被认为是是/否或开/关决策）。在这种情况下，你的程序会查看某个条件，确定它当前是真还是假，并采取相应的行动。逻辑表达式（在第\
    \ 3 章中介绍）在这里起着重要作用，因为它们总是返回一个真值的结果。\n\n在 JavaScript 中，简单的真/假决策由 `if` 语句处理。你可以使用单行语法：\n\
    \n```\nif (expression) statement;\n```\n\n或者块语法：\n\n```javascript\nif (expression)\
