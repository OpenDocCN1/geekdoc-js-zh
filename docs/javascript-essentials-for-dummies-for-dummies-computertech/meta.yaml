  pgno: 30
- img_proc: true
  md: 'Note, too, that if you know the initial value of the variable in advance, you
    can combine the declaration and initial assignment into a single statement, like
    this:


    ```

    let interestRate = 0.06;

    ```


    It''s important to remember that, given a variable declared with the let keyword,
    you''re free to change that variable''s value any time you want. For example,
    if the value you assign to interestRate variable is an annual rate, later on your
    code you need to work with a monthly rate, which is the annual rate divided by
    12. Rather than calculate that by hand, just put it in your code using the division
    operator (/);


    ```

    interestRate = 0.06 / 12;

    ```


    As a final note about using a variable assignment, take a look at a variation
    that often causes confusion among new programmers. Specifically, you can set up
    a statement that assigns a new value to a variable by changing its existing value.
    Here'' an example:


    ```

    interestRate = interestRate / 12;

    ```


    If you''ve never come across this kind of statement before, it probably looks
    a bit illogical. How can something itself divided by 12? The secret to understanding
    such a statement is — that is, the expression to the right of the equals sign
    (= — first. In other words, it takes the current value of interestRate, which
    is 0.06, and divides it by 12. The resulting value is what''s stored in interestRate
    when all is said and done. For a more in-depth discussion of operators and expressions,
    head over to Chapter 3.


    ![](img/e1fc091e438a5ffb052e3126ba2bbd1f_31_0.png)


    Because of this evaluate-the-expression-and-then-store-the-result behavior, JavaScript
    assignment statements shouldn''t be read as "variables expression." Instead, it
    makes more sense to think of them as "variable is set to expression" or "variable
    assumes the value given by expression." Reading assignment statements- this way
    helps to reinforce the important concept that the expression result is being stored
    in the variable.


    # JavaScript Essentials For Dummies'
  merge: -1
