  md: '# # Understanding the Value of Code Looping


    There are some who would say that the only real goal of the programmer is to get
    the job done. As long as the code produces the correct result or performs the
    correct tasks in the correct order, everything else is superfluous. Perhaps, real
    programmers know that the true goal of programming is not only to get the job
    done, but to get it done as efficiently as possible. Efficient scripts run faster,
    take less time to code, and are usually (not always, but usually) easier to read
    and troubleshoot.


    One of the best ways to introduce efficiency into your coding is to avoid reinventing
    too many wheels. For example, consider the following code:


    ```

    let sum = 0;

    let num = prompt("Type a number:", 1);

    sum += Number(num);

    num = prompt("Type a number:", 1);

    sum += Number(num);

    num = prompt("Type a number:", 1);

    sum += Number(num);

    document.write("The total of your numbers

    is is " + sum");

    ```


    This code first declares a variable named sum. The code prompts the user for a
    number (using the prompt method with a default value of 1) that gets stored in
    the num variable, adds value to sum, and then repeats this prompt-and-sum routine
    more times. (Note my use of the Number-function, which ensures that the value
    returned by prompt is treated as a number rather than a string.) Finally, the
    sum of the three numbers is displayed to the user.


    Besides being a tad useless, this code just reeks of inefficiency because most
    of the code consists of the following two lines appearing three times:


    ```

    num = prompt("Type a number:", 1);

    sum += Number(num);

    ```'
