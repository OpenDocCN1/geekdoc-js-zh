- md: "If luck has it that your web pages draw an inordinate share of these older\
    \ browsers, you may need to eschew the awomeness of ES6 in favor of the tried–and–true\
    \ features of ECMAScript 5. To that end, as I introduce each new JavaScript feature,\
    \ I point out those that arrived with ES6 and let you know if there's a simple\
    \ fallback or workaround (known as a polyfill in the JavaScript trade) if you\
    \ prefer to use ES5.\n\n## Commenting Your Code\n\nA script that consists of just\
    \ a few lines is usually easy to read and understand. However, your scripts won't\
    \ stay for long, and these longer and more complex creations will be correspondingly\
    \ more difficult to read. (This difficulty will be particularly acute if you're\
    \ looking at the code a few weeks or months after you first coded it.) To help\
    \ decipher your code, it's good programming practice to make liberal use of comments\
    \ throughout a script. A comment is text that describes or explains a statement\
    \ or group of statements. Comments are ignored by the browser, so you can add\
    \ as many as you deem necessary.\n\nFor short, single-line comments, use the double-slash\
    \ (//). Put the // at the beginning of the line, and then type your comment after\
    \ it. Here's an example:\n\n```javascript\n// Display the date and time the page\
    \ was modified\ndocument.write(\"This page was last modified on \" + document.lastModified);\n\
    ```\n\nYou can also use // for two or three lines of text, as long as you start\
    \ each line with //. If a comment stretches beyond that, however, you're better\
    \ off using multiline comments that begin with the /* characters and end with\
    \ the */ characters. Here's an example:\n\n```javascript\n/*\nThis script demonstrates\
    \ JavaScript's ability to write text to the web page by using the\ndocument.write()\
    \ method to display the date and\ntime the web page file was last modified.\n\n\
    This script is Copyright Paul McFedries.\n*/\n```\n\nAlthough it's fine to add\
    \ a few comments when you're just startng out, you don't have to add a comment\
    \ to everything. A statement is trivial or its purpose is glaring obvious, forget\
    \ the comment and move on.\n\n## Moving to External JavaScript Files\n\nEarlier\
    \ in this chapter, I talk about adding JavaScript code to a web page by inserting\
    \ the `<script>` and `</script>` tags into the page header (that is, between the\
    \ `<head>` and `</head>` tags), or sometimes in the page body (that is, between\
    \ the `<body>` and `</body>` tags). You then write your code between the `<script>`\
    \ and `</script>` tags.\n\nPutting a script inside the page in this way isn't\
    \ a problem if the script is relatively short. However, if your script (or scripts)\
    \ take dozens or hundreds of lines, if your HTML code can look cluttered. Another\
    \ problem you may run into is needing to use the same code on multiple pages.\
    \ Sure, you can copy the code into each page that requires it, but if you make\
    \ changes down the road, you need to update every page that uses the code.\n\n\
    The solution to both problems is to move the code out of the HTML file and into\
    \ an external JavaScript file. Moving the code reduces the JavaScript presence\
    \ in the HTML file to a single line (as you'll learn shortly) and means that you\
    \ can update the code by editing the external file.\n\nHere are some things to\
    \ note about using an external JavaScript file:\n\n- The file must use a plain\
    \ text format.\n- Use the .js extension when you name the file.\n- Don't use the\
    \ <script> tag within the file. Just enter your statements exactly as you would\
    \ within an HTML file.\n- The rules for when the browser executes statements within\
    \ an external file are identical to those used for statements within an HTML file.\
    \ That is, statements outside of functions are executed automatically when the\
    \ browser comes across your file reference, and statements within a function aren't\
    \ executed until the function is called. (Not sure what a \"function\" is? You\
    \ get the full scoop in Chapter 5.)\n\nTo let the browser know that an external\
    \ JavaScript file exists, add the src attribute to the `<script>` tag. For example,\
    \ if the external file is named myscripts.js, your `<script>` tag is set up as\
    \ follows:\n\n```html\n<script src=\"myscripts.js\"></script>\n```\n\nThis example\
    \ assumes that myscripts.js file is in the same directory as the HTML file. If\
    \ the file resides in a different directory, adjust the src value. For example,\
    \ if myscripts.js file is in a subdirectory named scripts, you use this:\n\n```html\n\
    <script src=\"scripts/myscripts.js\"></script>\n```\n\nYou can even specify a\
    \ file from another site (presumably your own!) by specifying a full URL as the\
    \ src value:\n\n```html\n<script src=\"http://www.host.com/myscripts.js\"></script>\n\
    ```\n\nAs an example, the following code shows a one-line external JavaScript\
    \ file named footer.js:\n\n```javascript\ndocument.write(\"This page is Copyright\
    \ \" + new Date().getFullYear());\n```\n\nThis statement writes the text \"Copyright\"\
    \ followed by the current year. (I know: this code looks like real gobbledyg right\
    \ now. Don't sweat it, because you'll learn exactly what's going on here when\
    \ I discuss the JavaScript Date object in Chapter 8.)\n\nThe following code shows\
    \ an HTML file that includes a reference for the external JavaScript file:\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Using External JavaScript</title>\n</head>\n<body>\n  <p>Some content\
    \ here.</p>\n  <script src=\"footer.js\"></script>\n</body>\n</html>\n```\n\n\
    ## Getting Your Head around Variables\n\nWhy would a script need short term memory?\
    \ Because one of the most common concepts that crops up when coding is the need\
    \ to store a temporary value. In most cases, you want to use that value later\
    \ in the same script. However, you may also need to use it in other script, to\
    \ populate a form, or as part of a larger calculation.\n\nFor example, your page\
    \ may have a button that toggles the page text between a larger font size and\
    \ the regular font size, so you need some way to \"remember\" that choice. Similarly,\
    \ if your script performs calculations, you may need to set aside values to use\
    \ later. For example, if you're reconstructing a shopping cart script, you may\
    \ need to calculate taxes on the order. To do that, you must first calculate the\
    \ total value of the order, store that value, and then take a percentage of it.\n\
    \nIn programming, the way you save a value for later use is storing it in a variable.\
    \ A *variable* is a small area of computer memory that's set aside for holding\
    \ a chunk of data. The good news is that the specifics of how the data is stored\
    \ and retrieved from memory happen well before you ever have to worry. As a coder,\
    \ working with variables involves three things:\n\n- Creating (or declaring) variables\n\
    - Assigning values to those variables\n- Including the variables in other statements\n\
    \nThe next three sections fill the details.\n\n## Declaring a variable with let\n\
    \nThe process of creating a variable is *declaring* in programming. All declaring\
    \ really means you're supplying the variable with a name and telling the browser\
    \ to set aside a bit of room in memory to hold whatever value you end up in the\
    \ variable. To declare a variable in JavaScript, you use the *let* keyword, followed\
    \ by a space, the name of the variable, and the usual line-ending semicolon. For\
    \ example, to declare a variable `interestRate`, you use the following statement:\n\
    \n```javascript\nlet interestRate;\n```\n\nHere are a few things to bear in mind\
    \ when you're declaring variables in your scripts:\n\n- Declare a variable only\
    \ once: Although you're free to use a variable as many times as you need to within\
    \ a script, you declare the variable only once. Trying to declare a variable more\
    \ than once will cause an error."
  mdcn: "\n如果运气不好，你的网页吸引了过多的这些旧版浏览器用户，那么你可能需要放弃 ES6 的强大特性，转而使用经经测试的 ECMAScript 5 特性。为此，当我介绍每个新的\
    \ JavaScript 特性时，我会指出那些随 ES6 引入的特性，如果你倾向于使用 ES5，我会告诉你是否有简单的回退方案或变通方法（在 JavaScript\
    \ 术语中称为 polyfill 填充）。\n\n## 为你的代码添加注释\n\n一个仅包含几行的脚本通常易于阅读和理解。然而，你的脚本运行时间不会太长，而这些更长、更复杂的作品将变得越来越难以阅读。（如果你在首次编写代码的几周或几个月后再次查看代码，这种困难性会尤为严峻。）为了帮助解析你的代码，在整个脚本中大量使用注释是一项良好的编程习惯。注释是描述或解释单条语句或一组语句的文本。浏览器会忽略注释，因此你可以根据需要添加任意数量的注释。\n\
    \n对于简短的单行注释，请使用双斜杠（//）。将 // 放在行的开头，然后在之后输入你的注释。例如：\n\n```javascript\n// 显示页面修改的日期时间\n\
    document.write(\"This page was last modified on \" + document.lastModified);\n\
    ```\n\n你也可以使用 // 处理两或三行文本，只要每行都以 // 开头即可。但是，如果注释超过了长度，最好使用以 `/*` 开头并以 `*/` 的多行注释。例如：\n\
    \n```javascript\n/*\n此脚本演示了 JavaScript 使用 document.write() 方法向网页写入文本的能力，\n用于显示网页文件最后修改的日期和时间。\n\
    \n此脚本版权所有 Paul McFedries。\n*/\n```\n\n虽然在刚开始学习时添加几条注释没问题，但你不需要对每个内容都添加注释。如果一个语句是微不足道的，或者它的目的显而易见，直接忘掉注释并继续即可。\n\
    \n## 移动到外部 JavaScript 文件\n\n在本章稍早之前，我讨论了如何通过在页面头部插入 `<script>` 和 `</script>` 标签（即\
    \ `<head>` 和 `</head>` 标签之间），或者有时在页面主体中（即 `<body>` 和 `</body>` 标签之间）来将 JavaScript\
    \ 代码添加到网页中。然后，你在 `<script>` 和 `</script>` 标签之间编写代码。\n\n通过这种方式将脚本放在页面内部，如果脚本较短则没有问题。然而，如果你的脚本（或多个脚本）占据了数十或数百行，你的\
    \ HTML 代码看起来可能会非常杂乱。你可能遇到的另一个问题是需要在多个页面上使用相同的代码。当然，你可以将代码复制到每个需要它的页面中，但如果你以后对其进行了更改，就需要更新每个使用该代码的页面。\n\
    \n这两个问题的解决方案是将代码从 HTML 文件中移动出来并在外部 JavaScript 文件中。移动代码可以将 HTML 文件中的 JavaScript\
    \ 出现量减少到单行（你很快就会学会），并且意味着你可以通过编辑外部文件来更新代码。\n\n以下是关于使用外部 JavaScript 文件需要注意的几点：\n\
    \n- 文件必须使用纯文本格式。\n- 命名文件时使用 `.js` 扩展名。\n- 不要在此文件中使用 `<script>` 标签。只需像在 HTML 文件中那样直接输入你的语句即可。\n\
    - 浏览器执行外部文件中语句的规则与 HTML 文件内执行语句的规则完全相同。也就是说，函数之外的语句会在浏览器遇到你的文件引用时自动执行，而函数内部的语句在调用函数之前不会执行。（不确定什么是“函数”？你将在第\
    \ 5 章中获得全面介绍。）\n\n要让浏览器知道外部文件的存在，请为 `<script>` 标签添加 `src` 属性。例如，如果文件名为 `myscripts.js`：\n\
    \n```html\n<script src=\"myscripts.js\"></script>\n```\n\n假设 `myscripts.js` 位于同一目录。如果它位于另一个目录，你可以指定完整的\
    \ URL：\n\n```html\n<script src=\"http://www.com/myscripts.js\"></script>\n```\n\
    \n作为示例，以下是名为 `footer.js` 的单行 JavaScript：\n\n```javascript\ndocument.write(\"Copyright\
    \ \" + new Date().getFullYear());\n```\n\n该语句写入了“Copyright”以及当前年份。（我不确定 Date 是什么，但别担心，我将在第\
    \ 8 章中讨论 Date 对象。）\n\n以下代码显示了一个引用外部 JavaScript 文件的 HTML：\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Using\
    \ JavaScript</title>\n</head>\n<body>\n  <p>这里是一些内容。</p>\n  <script src=\"footer.js\"\
    ></script>\n</body>\n</html>\n```\n\n## 理解变量\n\n为什么脚本需要短期记忆？因为编程中经常出现的概念之一就是存储临时值。在大多数情况下，你希望在同一个脚本中使用该值。然而，你可能需要在填充表单或作为较大计算的一部分中使用它。\n\
    \n例如，你的页面可能有一个按钮来切换大字体号和普通字体号，因此你需要某种方式来“记住”这种选择。同样，如果你的脚本执行计算，你可能需要留出值。例如，如果你在重构购物车脚本，你需要计算税费。你需要先计算总额，存储该值，然后取百分比。\n\
    \n在编程中，为以后使用保存值的方法将其存储在变量中。变量是为存储数据而留的小内存区域。好消息是，数据的存储和检索细节在你考虑之前就已经解决了。作为程序员，处理变量涉及三件事：\n\
    \n- 创建（声明）变量\n- 为变量赋值\n- 在语句中使用变量\n\n接下来的三个章节将介绍细节。\n\n## 使用 let 声明变量\n\n创建变量的过程在编程中被称为“声明”。声明的所有意义其实是你为变量提供一个名称，并告诉浏览器在内存中留出一些空间来存放你最终放入变量的值。在\
    \ JavaScript 中声明变量，你使用 `let` 关键字，后跟一个空格、变量名以及通常的结尾分号。例如，声明变量 `interestRate`，你使用以下语句：\n\
    \n```javascript\nlet interestRate;\n```\n\n在声明变量时需要注意以下几点：\n\n- 变量只能声明一次：虽然可以在脚本中多次使用变量，但你只能声明一次变量。重复声明同一个变量会导致错误。\n"
