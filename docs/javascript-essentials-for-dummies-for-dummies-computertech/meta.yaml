    \ 165\n\n## 引言\n\nHTML 和 CSS 是非常棒的技术，你可以用它们创建看起来惊人的页面。但当你把页面推送到 Web 服务器并查看几次（几十次）后，你可能会注意到一种微妙的失望感袭来。为什么？这很难确定，但这种感觉源于一个事实：你的网页仅仅包含了各种站点。\n\
    \n在那里，你可能有一个或三个链接，但大多数链接只是带你进入更多仅仅呆在那里的页面。或者某个链接带你进入完全另一个网站，一个感觉动态、活跃且具有交互性的网站。啊，参与感！噢，兴奋感！\n\
    \n一个无所事的页面和一个看起来一直在跳舞的页面之间有什么区别？一个词：JavaScript。如果你想让页面变得动态且具有交互性，你需要一些幕后 JavaScript\
    \ 来来实现。\n\n“但是，”我听到你反对道，“HTML 并不难学。JavaScript 是一门编程语言，天哪！”我听懂了。确实，只要从基础标签开始，研究大量它们工作方式的示例，并逐渐过渡到更复杂的页面，任何人都可以学习\
    \ HTML。这只是建立坚实基础并在此基础上构建的问题。\n\n我深信 JavaScript 的学习方法大体相同。我绝不会告诉你 JavaScript 像\
    \ HTML 一样容易学。那是彻劣的谎言。然而，我会告诉你，JavaScript 本身并没有什么特别困难的。我相信，如果你从基础语法和规则开始，学习大量它们工作方式的示例，并逐渐构建更复杂的脚本，你就可以学习\
    \ JavaScript 编程。我在这里现在预测，当你读完这本书时，你甚至会对自己以及你所做的事情感到有些惊讶。\n\n## 关于本书\n\n那么，欢迎阅读《傻瓜学\
    \ JavaScript》（JavaScript Essentials For Dummies）。这本书将为你提供关于万网底层的标准编程语言的坚实教育。你将学习如何设置所需的工具，并且针对你拥有的（或他人用\
    \ HTML 和 CSS 构建的）任何网页，你将如何使用 JavaScript 对这些页面进行编程。我的目标是向你展示，在页面上洒一点 JavaScript\
    \ 魔法并不难学，即使是绿手新手程序员也能学会创建动态且交互式的网页，并让他们的家人和朋友（以及他们自己）感到惊讶。\n\n如果你在寻找大量的编程历史、计算机科学理论以及对概念的冗长解释，我很抱歉，你在这里找不到。我整本书书的哲学源于\
    \ Linux 操作系统的创建者 Linus Torvalds：“口说很廉价。给我看代码。”我解释需要解释的内容，并用示例和脚本来构建，这些示例能更多（或在大多数情况下毫不费力地）说明一个概念，这比我能凑出的任何冗长解释都有效（相信我，我最擅长冗长了）。\n\
    \n## 愚蠢的假设\n\n这本书不是关于互联网或使用万维网的入门教程。这是一本关于编写网页的书，纯粹而简单。这意味着我假设以下情况：\n\n- 你知道如何操作基础文本编辑器，以及如何在电脑的操作系统和文件系统中穿梭。\n\
    - 你有互联网连接。\n- 你知道如何使用 浏览器。\n- 你知道 HTML 和 CSS 的基础知识。\n\n是的，就是这些。\n\n## 本书中使用的图标\n\
    \n此图标指向可能会向你重复的有用小技巧——所以请不要忘记它们。\n\n将这些图标看作建议专栏的素材。它们为正在讨论的话题提供了（希望是）建议或更多信息。\n\
    \n注意！在本书中，当你看到这个图标时，我正试图帮助你避免可能浪费时间、金钱或尴尬的错误。\n\n## 接下来该往何处去\n\n你如何学习这本书取决于你目前的编程水平和/或\
    \ JavaScript  专业知识（或缺乏）：\n\n- 如果你从未编程过，请从第 1 章开始，按照自己的节奏顺序阅读第 2、3、4 和 5 章。这将为你提供所需的所有知识，以便在书的其余部分中挑选出你想要学习的内容。\n\
    \n- 如果你做过一些非 JavaScript 编程，从第 1 章开始，快速浏览第 2 到 5 章，看看 JavaScript 是如何处理标准编程任务的，然后根据需要选择。\n\
    \n- 如果你已经做过 JavaScript 编程，我建议快速通过第 2 到 5 章，然后深入研究第 6 章中重要的文档模型。之后你可以挑选剩下的章节。\n\
    \n## 第 1 章 JavaScript：概览\n\n在本章中，你将探索实用的 JavaScript 基础。如果你从未编程过，不要担心。我将以循序渐进、简单易懂的方式带你一切知识。正如你将发现的，编程非常有趣。\n\
    \n## 在网页中添加 JavaScript 代码\n\n好了，是时候卷起袖子，敲击手指开始编码了。本节描述了构建和测试脚本的标准程序，并带你通过几个示例。\n\
    \n### <script> 标签\n\n脚本的基本容器自然是 HTML `<script>` 标签及其关联的 `</script>` 标签：\n\n```html\n\
    <script>\n  JavaScript statements go here\n</script>\n```\n\n- 感受通用编程，特别是 JavaScript\n\
    - 查看你需要的工具\n- 为你的 JavaScript 添加注释\n- 将代码存储在单独文件中\n\n### 你将 <script> 标签放在哪里？\n\n\
    在某些例外情况下，将 `<script>` 标签放在哪里并不重要。有些人会将标签放在 `</head>` 和 `<body>` 标签之间。HTML 标准建议将标签放在页面头部（即\
    \ `<head>` 和 `</head>` 之间），这就是我在书中使用的样式：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>你将脚本标签放在哪里?</title>\n<script>\n\
    \  JavaScript statements go here\n</script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n"
