  md: '# Using Code to Mess Around with CSS


    Although you specify your CSS rules in a static stylesheet (.css) file, that doesn''t
    mean that the rules themselves have to be static. With JavaScript on the job,
    you can modify an element''s CSS in a number of ways.


    # Changing an element’s styles


    Most elements have a style property that enables you to get and modify a tag''s
    styles. It works like this: The style property returns a style object that has
    properties for every CSS property. When referencing these style properties, you
    need to know two things in mind:


    +   * Single-word CSS properties (such as color and visibility), use all-lowercase
    letters.

    * Multiple-word CSS properties, drop the hyphen and use uppercase for the first
    letter of the second word and for each subsequent word if the property has more
    than two. For example, the font-size and border-left-width properties become the
    fontSize and borderLeftWidth


    Here''s an example:


    ```

    const pageTitle = document.querySelector("h1");

    pageTitle.style.fontSize = "64px";

    pageTitle.style.color = "maroon";

    pageTitle.style.textAlign = "center";

    pageTitle.style.border = "1px solid black";

    ```


    This code gets a reference to the page''s first <h1> element. With that reference
    in hand, the code uses the style object to set four properties of the heading:
    fontSize, color, text-align, and border.


    # Adding a class to an element


    If you add a class defined in your CSS, you can apply that rule to an element
    by adding the class attribute to the element''s tag and setting the value of the
    class attribute to the name of your class rule.'
