    \  'white';\n    }\n  </script>\n```\n\n```javascript\ndocument.getElementById('bgRed').\n\
    addEventListener(\n  'click',\n  makeBackgroundRed\n);\ndocument.getElementById('bgWhite').\n\
    addEventListener(\n  'click',\n  makeBackgroundWhite\n);\n</script>\n```\n\nThe\
    \ script declares two named functions: makeBackgroundRed() and makeBackgroundWhite().\
