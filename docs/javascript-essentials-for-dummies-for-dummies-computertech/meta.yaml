- md: "- 3. papayawhip\n2. lemonchiffon\n1. chocolate\n\n**Figure 4-3:** The decrementing\
    \ value of the rank variable is used to create a reverse-ordered list.\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_62_0.png)\n\
    \nThere's no reason why the for loop counter has to be only incremented or decremented.\
    \ You're actually free to use any expression to adjust the value of the loop counter.\
    \ For example, suppose you want the loop counter to run through only the odd numbers\
    \ 1, 3, 5, 7, and 9. Here's a for statement that will do that:\n\n```\nfor (let\
    \ counter = 1; counter <= 9; counter += 2)\n```\n\nThe expression counter += 2\
    \ uses the addition assignment operator to increase the counter variable by 2\
    \ each time through the loop.\n\n# Working with do..while Loops\n\nJavaScript\
    \ has a third and final type of loop that I've left until the last because it\
    \ isn't one that you'll use all of that. To understand when you might use it,\
    \ consider this snippet:\n\n```\nlet sum = 0;\nlet num = prompt(\"Type a number\
    \ or click\nCancel:\", 1);\nwhile (num != null) {\n\tsum += Number(num);\n\tnum\
    \ = prompt(\"Type a number or click\nCancel:\", 1);\n}\n```\n\nThe code needs\
    \ the first prompt statement so that the loop's expression can be evaluated. The\
    \ user may not feel like entering any numbers, and they can avoid it by clicking\
    \ Cancel in the first prompt box so that the loop will be bypassed.\n\nThat seems\
    \ reasonable enough, but what if your code requires that the user enter at least\
    \ one value? The following presents one way to change the code to ensure that\
    \ the loop is executed at least once:\n\n```\nlet sum = 0;\nlet num = 0;\nwhile\
    \ (!num === null || sum === 0) {\n    num = prompt(\"Type a number; when you're\n\
    done, click Cancel:\", 1);\n    sum += Number(num);\n}\ndocument.write(\"The total\
    \ of your numbers\nis \" + sum);\n```\n\nThe changes here are that the code initializes\
    \ both sum and num as 0. Initializing both to 0 ensures that the while expression\
    \ — num != null || sum === 0 returns the first time through the loop, the loop\
    \ will definitely execute at least once. If the user clicks Cancel right away,\
    \ sum will still be 0, so the while expression — num != null || sum === 0 returns\
    \ true and the loop repeats again.\n\nThis approach works fine, but you can also\
    \ turn to JavaScript's third loop type, which specializes in just this kind of\
    \ situation. It's called a do...while loop, and its general syntax looks like\
    \ this:\n\n```\ndo {\n    statements\n} while (expression);\n```\n\nHere, statements\
    \ represents a block of statements to execute each time through the loop, and\
    \ expression is a comparison or logical expression, as long as it returns true,\
    \ tells JavaScript to keep executing the statements within the loop.\n\nThis structure\
    \ ensures that JavaScript executes the loop's statement at least once. Take a\
    \ closer look at how JavaScript processes a do...while loop:\n\n- 1. Execute each\
    \ of the statements in the block.\n- 2. Evaluate the expression in the while statement.\n\
    - 3. If expression is true, return to Step 1; if expression is false, continue\
    \ with Step 4.\n- 4. Exit the loop.\n\nFor example, the following shows you how\
    \ to use do...while to restructure the prompt-and-sum code I showed you earlier:\n\
    \n```\nlet sum = 0;\nlet num;\ndo {\n    num = prompt(\"Type a number; when you're\
    \ done,\n    click Cancel:\", 1);\n    sum += Number(num);\n}\nwhile (num != null\
    \ || sum === 0);\ndocument.write(\"The total of your numbers\nis \" + sum);\n\
    ```\n\nThis code is very similar to the while code I show earlier in this section.\
    \ All that's really changed is that the while statement and its expression have\
    \ been moved after the statement block so that the loop must be executed once\
    \ before the expression is evaluated.\n\n# IN THIS CHAPTER\n\n- Getting to know\
    \ JavaScript functions\n- Creating and using custom functions\n- Passing and returning\
    \ function values\n- Working with anonymous and arrow functions\n\n# Chapter 5\
    \ Harnessing the Power of Functions\n\nAlmost every JavaScript project beyond\
    \ the simplest scripts will require one or more (usually a lot more) tasks or\
    \ calculations that aren't part of the JavaScript language or any Web API. What's\
    \ a coder to do? You roll up your sleeves and then roll your own code that accomplishes\
    \ the task or runs the calculation.\n\nThis chapter shows how to create such do-it-yourself\
    \ code. In the pages that follow, you explore the powerful and infinitely useful\
    \ realm of custom functions, where you craft reusable code that performs tasks\
    \ that out-of-the-box JavaScript can't.\n\n# Getting to Know the Function Structure\n\
    \nA function is a group of JavaScript statements that are separate from the rest\
    \ of the script and that perform a designated task. When your script needs to\
    \ perform that task, you tell it to run — or execute, in the vernacular — the\
    \ function.\n\nThe basic structure of function looks like this:\n\n```\nfunction\
    \ functionName([arguments]) {\n  JavaScript statements\n}\n```\n\nHere's a summary\
    \ of the various parts of a function:\n\n- function: Identifies the block of code.\n\
    - functionName: A unique name for the function.\n- arguments: One or more values\
    \ passed to the function.\n- JavaScript statements: This is the code that performs\
    \ the tasks.\n\nNote, too, the use of braces { } are used to enclose the function.\
    \ There are only two rules for these braces:\n\n- The opening brace must appear\
    \ after the function name.\n- The closing brace must appear after the statements.\n\
    \n# Making a Function Call\n\nAfter your function is defined, you'll eventually\
    \ need to tell the browser to execute — call — the function. There are three ways\
    \ to do this:\n\n- When the browser parses the <script> tag\n- After the page\
    \ is loaded\n- In response to an event, such as the user clicking a button\n\n\
    # When the browser parses the <script> tag\n\nThe simplest way to call a function\
    \ is to include in your script a statement consisting of only the function name,\
    \ followed by parentheses (assuming for the moment your function uses no arguments).\
    \ The following code provides an example. (I've listed the entire page to show\
    \ where the function and the statement that calls it appear.)\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Calling\
    \ a function when the <script>\ntag is parsed</title>\n  <script>\n    function\
    \ displayGreeting() {\n      const currentHour = new Date().\n      getHours();\n\
    \      if (currentHour < 12) {\n        console.log(\"Good morning!\");\n    \
    \  } else {\n        console.log(\"Good day!\");\n      }\n    }\n  displayGreeting();\n\
    \  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nThe <script> tag includes\
    \ a function named displayGreeting, which determines the current hour of the day\
    \ and writes a greeting to the console (check out Figure 5-1; you learn about\
    \ the console in Chapter 9) based on whether it's currently morning. The function\
    \ is called by the displayGreeting statement that appears just after the function.\n\
    \n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_69_0.png)\n\n**Figure 5-1:** An example\
    \ of calling a function when the <script> tag is parsed.\n\n# When the page load\
    \ is complete\n\nIf your function references a page element, calling the function\
    \ from within the page's head section won't work because the browser parses the\
    \ script, the rest of the page hasn't loaded yet, so your element reference will\
    \ fail.\n\nTo work around this problem, place another <script> tag at the end\
    \ of the body section, just before the closing </body> tag, as shown here:\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n\
    \  <title>Calling a function after the page is loaded</title>\n  <script>\n  \
    \  function makeBackgroundRed() {\n      document.body.style.backgroundColor =\
    \ \"red\";\n    }\n  </script>\n</head>\n<body>\n  <script>\n    makeBackgroundRed();\n\
    \  </script>\n</body>\n</html>\n```"
  mdcn: "\n- 3. papayawhip\n2. lemonchiffon\n1. chocolate\n\n**图 4-3:** 排名变量的递减值用于创建一个倒序列表。\n\
    \n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_62_0.png)\n\n没有理由规定 for 循环计数器只能递增或递减。你实际上可以自由任何表达式来调整循环计数器的值。例如，假设你想让计数器只遍历奇数\
    \ 1, 3, 5, 7 和 9。这里有一个可以实现该目的的 for 语句：\n\n```\nfor (let counter = 1; counter <=\
    \ 9; counter += 2)\n```\n\n表达式 `counter += 2` 使用加赋值运算符在每次循环时将 `counter` 变量增加 2。\n\
    \n# 使用 do..while 循环\n\nJavaScript 有第三种也是最后一种循环类型，我把它留到最后是因为你可能并不总是需要用到它。要理解你什么时候可能会使用它，请考虑这段代码片段：\n\
    \n```\nlet sum = 0;\nlet num = prompt(\"输入一个数字或点击\n取消:\", 1);\nwhile (num != null)\
    \ {\n\tsum += Number(num);\n\tnum = prompt(\"输入一个数字或点击\n取消:\", 1);\n}\n```\n\n\
    代码需要第一个 `prompt` 语句，以便可以评估循环的表达式。用户可能不想输入任何数字，他们可以通过点击第一个提示框中的“取消”（Cancel）来避免，从而跳过循环。\n\
    \n这看起来足够合理，但如果你的代码要求用户至少输入一个值呢？以下展示了更改代码以确保循环至少执行一次的方法：\n\n```\nlet sum = 0;\n\
    let num = 0;\nwhile (!num === null || sum === 0) {\n    num = prompt(\"输入一个数字；完成后，\n\
    \    点击取消：\", 1);\n    sum += Number(num);\n}\ndocument.write(\"你的数字总和为\nn \"\
    \ + sum);\n```\n\n这里的变化在于，代码将 `sum` 和 `num` 都初始化为 0。将两者都初始化为 0 确保了 `while` 表达式\
    \ `num != null || sum === 0` 在第一次循环时返回真，循环至少会执行一次。如果用户立即点击“取消”，`sum` 仍为 0，因此 `while`\
    \ 表达式 `num != null || sum === 0` 返回真，循环再次重复。\n\n这种方法运行良好，但你也可以转向 JavaScript 的第三种循环类型，它专门处理这种这种情况。它被称为\
    \ `do...while` 循环，其通用语法如下：\n\n```\ndo {\n    statements\n} while (expression);\n\
    ```\n\n在这里，`statements` 代表每次循环时要执行的语句块，而 `expression` 是一个比较或逻辑表达式，只要它返回 `true`，就会告诉\
    \ JavaScript 继续执行循环内的语句。\n\n这种结构确保了 JavaScript 至少执行一次循环语句。仔细观察 JavaScript 如何处理\
    \ `do...while` 循环：\n\n- 1. 执行块中的每个语句。\n- 2. 评估 `while` 语句中的表达式。\n- 3. 如果表达式为 `true`，则返回第\
    \ 1 步；如果表达式为 `false`，则继续第 4 步。\n- 4. 退出循环。\n\n例如，以下内容展示了如何使用 `do...while` 来重构我之前向你展示的提示并求和的代码：\n\
    \n```\nlet sum = 0;\nlet num;\ndo {\n    num = prompt(\"输入一个数字；完成后，\n    点击取消：\"\
    , 1);\n    sum += Number(num);\n}\nwhile (num != null || sum === 0);\ndocument.write(\"\
    你的数字总和为\nn \" + sum);\n```\n\n这段代码与我在本节稍早展示的 `while` 代码非常相似。真正改变的地方是 `while` 语句及其表达式移动到了语句块之后，因此在评估表达式之前必须执行一次循环。\n\
    \n# 本章内容\n\n- 认识 JavaScript 函数\n- 创建和使用自定义函数\n- 传递函数值和返回函数值\n- 使用匿名函数和箭头函数\n\n\
    # 第 5 章 运用函数的威力\n\n除了简单的脚本外，几乎每个 JavaScript 项目都将一个或多个（通常多得多）任务或计算，而这些任务并不是 JavaScript\
    \ 语言或任何 Web API 的一部分。程序员该怎么办？你得卷起袖子，编写你自己的代码来完成任务或运行计算。\n\n本章展示了如何创建这种自己编写的代码。在接下来的页面中，你将探索强大且无限实用的自定义函数领域，在那里你可以编写可重用的代码来执行开箱用的\
    \ JavaScript 无法完成的任务。\n\n# 了解函数结构\n\n函数是一组 JavaScript 语句，它们与脚本的其他部分分离并执行指定的任务。当你的脚本需要执行该任务时，你告诉它运行——或者用术语说，执行（execute）——函数。\n\
    \n函数的基本结构如下：\n\n```\nfunction functionName([arguments]) {\n  JavaScript statements\n\
    }\n```\n\n以下是函数各个部分的总结：\n\n- function: 标识代码块。\n- functionName: 函数的唯一名称。\n- arguments:\
    \ 传递给函数或多个值。\n- JavaScript statements: 这是执行任务的代码。\n\n此外，大括号 `{ }` 用于封装函数。大括号只有两个规则：\n\
    \n- 开大括号必须出现在函数名之后。\n- 闭大括号必须出现在语句之后。\n\n# 调用函数\n\n在定义函数之后，你最终需要告诉浏览器执行——调用——该函数。有三种方法：\n\
    \n- 当浏览器解析 `<script>` 标签时\n- 在页面加载后\n- 响应事件，例如用户点击按钮\n\n# 当浏览器解析 `<script>` 标签时\n\
    \n调用函数的最简单方法是在脚本中包含一个函数名，后面跟着括号（假设你的函数没有参数）。下面的代码提供了示例。（我列出了整个页面以显示函数及其调用语句的位置。）\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>在解析 <script>\n标签时调用函数</title>\n  <script>\n    function displayGreeting()\
    \ {\n      const currentHour = new Date().\n      getHours();\n      if (currentHour\
    \ < 12) {\n        console.log(\"Good morning!\");\n      } else {\n        console.log(\"\
    Good day!\");\n      }\n    }\n  displayGreeting();\n  </script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n`<script>` 标签包含一个名为 `displayGreeting` 的函数，它根据当前是否为早晨向控制台（在第\
    \ 9 章中学习控制台）写入问候。该函数是由紧跟在函数之后的 `displayGreeting()` 语句调用的。\n\n图 5-1：在解析 `<script>`\
    \ 标签时调用函数的示例。\n\n![](img/e1fc091e438a5ffb052e3126ba2bbd1f_69_0.png)\n\n# 当页面加载完成后\n\
    \n如果你的函数引用了页面元素，在页面的 `head` 部分调用函数将不起作用，因为浏览器解析脚本时，其余部分尚未加载，因此你的元素引用将失败。\n\n为了解决这个问题，将另一个\
    \ `<script>` 标签放在 `body` 部分的末尾，就在闭合的 `</body>` 标签之前，如下：\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>在页面加载后调用函数</title>\n\
    \  <script>\n    function makeBackgroundRed() {\n      document.body.style.backgroundColor\
    \ = \"red\";\n    }\n  </script>\n</head>\n<body>\n  <script>\n    makeBackgroundRed();\n\
    \  </script>\n</body>\n</html>\n```\n"
