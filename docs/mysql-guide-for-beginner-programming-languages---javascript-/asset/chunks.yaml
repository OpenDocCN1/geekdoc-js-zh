    \ Introduction to MySQL DML\n\nMySQL DML deals with the modification of data within\
    \ the tables of a database. DML statements used for adding(inserting), deleting,\
    \ and modifying (updating) data in a database.\n\nFollowing are the commands of\
    \ DML:\n- `INSERT` – It is used to add rows to a table manually.\n- `SELECT` –\
    \ We can access and manipulate data using `Select` command.\n- `DELETE` – We can\
    \ remove rows of existing table using `Delete` command.\n- `UPDATE` - To change\
    \ the actual data in a table.\n\n## 4.2 DML command execution\n\nIn previous chapter\
    \ we have created an `employees` table, now let’s manipulate the table using DML\
    \ commands.\n\n### 4.2.1 `INSERT` command\n\nIn this topic, I am going to discuss\
    \ about how we can insert rows into a table. We have a table named `employees`.\
    \ I will select everything from my table `employees`.\n\n```sql\nSELECT * FROM\
    \ employees;\n```\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| | | | | |\n\nLet’s insert a row of\
    \ data using `INSERT` command. To insert a row into a table we would type `INSERT\
    \ INTO` the name of the table followed by `VALUES` parentheses semicolon, between\
    \ this set of parentheses we will add all of the data for a row. We will follow\
    \ this order beginning with `employee_id`, `first_name`, `last_name` so on but\
    \ we do have to pay attention to the data types. Each piece of data will be separated\
    \ with a comma.\n\nLet’s insert a row of data in `Employees` table:\n```sql\n\
    INSERT INTO employees\nVALUES (1, \"Eugene\", \"Krabs\", 25.50, \"2023-01-02\"\
    );\n```\n\nNow we can execute these statements and get the result as shown below.\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n\n\
    Let’s insert multiple rows at once, to do this MySQL allows us to add another\
    \ set of parentheses each separated with a comma as below:\n```sql\nINSERT INTO\
    \ employees\nVALUES (2, \"Squidward\", \"Tentacles\", 15.00, \"2023-01-03\"),\n\
    (3, \"Spongebob\", \"Squarepants\", 12.50, \"2023-01-04\"),\n(4, \"Patrick\",\
    \ \"Star\", 12.50, \"2023-01-05\"),\n(5, \"Sandy\", \"Cheeks\", 17.25, \"2023-01-06\"\
    );\n```\nExecute:\n```sql\nSELECT * FROM employees;\n```\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
    \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 |\
    \ Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
    \ |\n\n### 4.2.2 `SELECT` command\n\nIn this section, we are going to discuss\
    \ how to select data in a table. To select entire rows and columns in `employees`\
    \ table:\n```sql\nSELECT * FROM employees;\n```\nSometimes you may not want all\
    \ of the data. We can select specific columns. To retrieve full name of `employees`:\n\
    ```sql\nSELECT first_name, last_name FROM employees;\n```\n| first_name | last_name\
    \ |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward | Tentacles |\n| Spongebob\
    \ | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks |\n\nWe can also change\
    \ the order of column:\n```sql\nSELECT last_name, first_name FROM employees;\n\
    ```\nThere is a `WHERE` clause if we are looking for something. Let’s select all\
    \ from `employees` where `employee_id` equals one:\n```sql\nSELECT * FROM employees\n\
    WHERE employee_id = 1;\n```\nThis will give us a specific employee, the employee\
    \ that has an ID of one. Note: Similarly, we can take reference of any column\
    \ and their corresponding data such as `first_name`, `last_name` and so on. We\
    \ can also add conditions using comparison operator to `WHERE` clause. Let’s find\
    \ all employees that have an hourly pay greater than or equal to 15:\n```sql\n\
    SELECT * FROM employees\nWHERE hourly_pay >= 15;\n```\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
    \ | 2023-01-03 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n\nWe can also add\
    \ integrity constraints to `WHERE` clause. `NULL` means no data, let’s display\
    \ the data of every employee that does have a hire date:\n```sql\nSELECT * FROM\
    \ employees\nWHERE hire_date IS NOT NULL;\n```\n| employee_id | first_name | last_name\
    \ | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene\
    \ | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
    \ |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star\
    \ | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n\n### 4.2.3\
    \ `UPDATE` command\n\nIn this section, we are going discuss how to update data\
    \ from a table. In our table `employee_id` 6 is missing some data.\n\n| employee_id\
    \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
    \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 |\
    \ 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks\
    \ | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | | |\n"
