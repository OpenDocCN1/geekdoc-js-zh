  trans: "\n\n# 注意：如果我们想保存更改，请使用 `COMMIT` 命令。\n\n# 第 7 章：数据查询语言 (DQL)\n\n## 7.1 MySQL\
    \ DQL 简介\n\nMySQL 中的 `DQL` 是 SQL 子语言基础分组的一部分。它被用于向数据库架构发送查询。它提供了使用 `SELECT` 命令的最大灵活性，可以根据用户需求从数据库中检索信息。我们将详细讨论\
    \ `SELECT` 命令。\n\n当针对表执行 `SELECT` 语句时，结果将根据要求编译成进一步的临时表。\n\n只有在创建表并插入值后，我们才能使用\
    \ `SELECT` 命令。让我们以已经创建的 employees 表举例。\n\n### 7.1.1 语法 1\n\n```sql\nSELECT * FROM\
    \ table_name;\n```\n\n实现：从 employees 表中检索所有信息。\n\n```sql\nSELECT * FROM employees;\n\
    ```\n\n执行并获取结果\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
    \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
    \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy\
    \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07\
    \ |\n\n### 7.1.2 语法 2\n\n```sql\nSELECT Col1, Col2,…. FROM table_name;\n```\n\n\
    实现：检索表的特定列。\n\n```sql\nSELECT employee_id, first_name, last_name FROM employees;\n\
    ```\n\n执行并获取结果\n\n| employee_id | first_name | last_name |\n| :--- | :--- | :---\
    \ |\n| 1 | Eugene | Krabs |\n| 2 | Squidward | Tentacles |\n| 3 | Spongebob |\
    \ Squarepants |\n| 4 | Patrick | Star |\n| 5 | Sandy | Cheeks |\n| 6 | Sheldon\
    \ | Plankton |\n\n注意：列的顺序将由用户决定。\n\n### 7.1.3 语法 3\n\n```sql\nSELECT * FROM table_name\
    \ WHERE condition;\n```\n\n实现：它将检索所有与 `WHERE` 子句相关的数据行。\n\n```sql\nSELECT * FROM\
    \ employees WHERE employee_id< 4;\n```\n\n执行并获取结果\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
    \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\n注意：`WHERE`\
    \ 子句用于根据条件过滤行。\n\n### 7.1.4 语法 4\n\n```sql\nSELECT col1, col2, …… FROM table_name\
    \ WHERE condition;\n```\n\n实现：这里将根据 `WHERE` 子句检索员工的 `first_name`、`last_name` 和\
    \ `hourly_pay`。\n\n```sql\nSELECT first_name, last_name, hourly_pay FROM employees\
    \ WHERE hourly_pay<15;\n```\n\n执行并获取结果\n\n| first_name | Last_name | hourly_pay\
    \ |\n| :--- | :--- | :--- |\n| Spongebob | Squarepants | 12.50 |\n| Patrick |\
    \ Star | 12.50 |\n| Sheldon | Plankton | 10.25 |\n\n## 7.2 使用 MySQL 获取当前日期和时间\n\
    \n让我们创建一个临时演示表，输入：\n\n```sql\nCREATE TABLE demo(\n    my_date DATE,\n    my_time\
    \ TIME,\n    my_datetime DATETIME\n);\n```\n\n执行它，我们成功创建了一个包含三个列的表——`my_date`、`my_time`、`my_datetime`。\n\
    \n如果我们想获取当前日期，我们需要创建一个时间戳。\n\n向 `DEMO` 表插入数据，输入：\n\n```sql\nINSERT INTO demo\n\
    VALUE(CURRENT_DATE(), CURRENT_TIME(), NOW());\n\nSELECT * FROM demo;\n```\n\n\
    执行它并获取当前日期和时间。\n\n| my_date | my_time | my_datetime |\n| :--- | :--- | :--- |\n\
    | 2024-07-23 | 07:27:58 | 2024-07-23 07:27:58 |\n\n在当前日期基础上加一天，输入：\n\n```sql\n\
    INSERT INTO demo\nVALUES(CURRENT_DATE() + 1, NULL, NULL)\n\nSELECT * FROM demo;\n\
    ```\n\n执行并获取结果\n\n| my_date | my_time | my_datetime |\n| :--- | :--- | :--- |\n\
    | 2024-07-23 | 07:27:58 | 2024-07-23 07:27:58 |\n| 2024-07-24 | | |\n\n注意：这里 time\
    \ 和 datetime 设置为 `NULL`。\n\n# 第 8 章：约束的作用\n\n在本节中我们将讨论 MySQL 中的约束。\n\n### 8.1\
    \ UNIQUE 约束\n\n`UNIQUE` 约束确保列中的值是不同的。\n\n```sql\nCREATE TABLE products (\n   \
    \ product_id INT,\n    product_name VARCHAR(25),\n    price DECIMAL(4,2)\n);\n\
    ```\n\n如果我们两次插入相同的 `product_name`，将会发生错误。可以使用以下命令添加：\n\n```sql\nALTER TABLE products\
    \ ADD UNIQUE (product_name);\n```\n\n### 8.2 NOT NULL 约束\n\n`NOT NULL` 约束确保列不能为\
    \ `NULL` 值\n\n### 8.3 CHECK 约束\n\n`CHECK` 约束用于限制列的值范围。\n\n```sql\nCREATE TABLE\
    \ employees (\n    employee_id INT,\n    first_name VARCHAR(50),\n    last_name\
    \ VARCHAR(50),\n    hourly_pay DECIMAL(5,2),\n    hire_date DATE,\n    CONSTRAINT\
    \ chk_hourly_pay CHECK (hourly_pay >= 10.00)\n);\n```\n\n如果薪水小于 10，则违反约束。要删除它：\n\
    \n```sql\nALTER TABLE employees DROP CHECK chk_hourly_pay;\n```\n\n### 8.4 DEFAULT\
    \ 约束\n\n`DEFAULT` 在未指定值时为列提供默认值。\n\n```sql\nCREATE TABLE products (\n    product_id\
    \ INT,\n    product_name VARCHAR(25),\n    price DECIMAL(4,2) DEFAULT 0\n);\n\
    ```\n\n### 8.5 PRIMARY KEY 约束\n\n`PRIMARY KEY` 是 `UNIQUE` 和 `NOT NULL` 的组合。一个表只能有一个主键。\n\
    \n```sql\nCREATE TABLE transactions(\n    transaction_id INT PRIMARY KEY,\n  \
    \  amount DECIMAL(5,2)\n);\n```\n\n向现有表添加它：\n\n```sql\nALTER TABLE products ADD\
    \ PRIMARY KEY (transaction_id);\n```\n\n### 8.6 MYSQL 中的自动递增属性\n\n"
- fmt: "\n# The `auto increment` attribute can be applied to a column that is set\
    \ as a key whenever we insert a new row our primary key can be populated automatically\
    \ then each subsequent row is auto incremented.\n\n# Let’s drop the transaction\
    \ table and recreate with auto increment feature, type\n\n```sql\nCREATE TABLE\
    \ transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL\
    \ (5,2)\n);\n```\n\nNote: By default, `auto increment` will set to `1`.\n\n# Let’s\
    \ insert some values in transaction table, no need to insert `transaction_id`,\
    \ it will be automatically assigned.\n\n```sql\nINSERT INTO transactions (amount)\n\
    VALUES (2.56);\nSELECT * FROM transactions;\n```\n\n| transaction_id | amount\
    \ |\n| :--- | :--- |\n| 1 | 2.56 |\n\nNote: Here `transaction_id` automatically\
    \ inserted.\n\n# We could set our primary key to begin at a different value, type\n\
    \n```sql\nALTER TABLE transactions\nAUTO_INCREMENT = 1000;\n```\n\nExecute and\
    \ get the result, transaction ID set to `1000` onwards. We must delete entire\
    \ rows and insert new values.\n\n## 8.7 FOREIGN KEY constraint\n\nForeign key\
    \ is a `PRIMARY KEY` from one table that can be found within a different table\
    \ using a `foreign key` we can establish a link between two tables. There are\
    \ two primary benefits to this in our transaction table if I were to take a look\
    \ at the customer ID of who initiated this transaction, I could refer to the `customers`\
    \ table then find the first and last name of that customer.\n\n# Let’s create\
    \ transaction and customer table, establish a link between them using foreign\
    \ key\n\n# I am going to create a new table of customers, type\n\n```sql\nCREATE\
    \ TABLE customers (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n  first_name\
    \ VARCHAR (50),\n  last_name VARCHAR (50)\n);\n```\n\nExecute and get the result\n\
    \n# Now insert some values in to the table, type\n\n```sql\nINSERT INTO customers\
    \ (first_name, last_name)\nVALUES (“Fred”, “Fish”),\n(“Larry”, “Lobster”),\n(“Bubble”,\
    \ “Bass”\n\nSELECT * FROM customers;\n```\n\n| customer_id | first_name | last_name\
    \ |\n| :--- | :--- | :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3\
    \ | Bubble | Bass |\n\n# Now we are going to create a link between our `customers`\
    \ table and our `transactions` table via `ID`. Let’s create a `transactions` table\
    \ with `FOREIGN KEY` constraint, type\n\n```sql\nCREATE TABLE transactions (\n\
    \  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2),\n \
    \ customer_id INT,\n  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n\
    );\n```\n\nExecute and get the result\n\nNote: Here `customer_id` column is `FOREIGN\
    \ KEY`.\n\nLink between two table using foreign key is shown below\n\n| transaction_id\
    \ | amount | customer_id | first_name | last_name |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 1000 | 4.89 | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 | Bubble\
    \ | Bass |\n| 1002 | 3.32 | 1 | Fred | Fish |\n| 1003 | 4.99 | 3 | Bubble | Bass\
    \ |\n\n## 8.8 JOIN clause\n\nA `JOIN` is a clause that is used to combine rows\
    \ from two or more tables based on a related column between them such as a foreign\
    \ key. Let’s join previously created table. We have two tables a of `transaction`\
    \ and a table of `customers`.\n\n| transaction_id | amount | customer_id |\n|\
    \ :--- | :--- | :--- |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32\
    \ | 1 |\n| 1003 | 4.99 | 3 |\n\n| customer_id | first_name | last_name |\n| :---\
    \ | :--- | :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble\
    \ | Bass |\n\n# Let’s inner join both table, type\n\n```sql\nSELECT *\nFROM transactions\n\
    INNER JOIN customers ON transactions.customer_id = customers.customer_id;\n```\n\
    \nExecute and get the result\n\n| transaction_id | amount | customer_id | first_name\
    \ | last_name |\n| :--- | :--- | :--- | :--- | :--- |\n| 1000 | 4.89 | 2 | Larry\
    \ | Lobster |\n| 1001 | 2.68 | 3 | Bubble | Bass |\n| 1002 | 3.32 | 1 | Fred |\
    \ Fish |\n| 1003 | 4.99 | 3 | Bubble | Bass |\n\n# Chapter 9: Functions and Logical\
    \ operators in MySQL\n\n### 9.1 Functions in MySQL\n\nA stored program that accepts\
    \ parameter from the user and returns the value known as `Function`. `MySQL` provides\
    \ lot of functions. Some of them shown below.\n\n# Let’s count number of rows\
    \ in `amount` column of `transaction` table, type\n\n```sql\nSELECT COUNT(amount)\n\
    FROM transaction;\n```\n\nExecute and get the result\n\n# Let’s find the maximum\
    \ value in `amount` column, type\n\n```sql\nSELECT MAX(amount) AS maximum\nFROM\
    \ transaction;\n```\n\nNote: Here column name will be changed in output “maximum”.\n\
    \n# Let’s find the minimum value in `amount` column, type\n\n```sql\nSELECT MIN(amount)\
    \ AS minimum\nFROM transaction;\n```\n\nExecute and get the result\n\n# Let’s\
    \ find average value of `amount` column, type\n\n```sql\nSELECT AVG(amount) AS\
    \ average\nFROM transaction;\n```\n\nExecute and get the result\n\n# Let’s find\
    \ sum of `amount` column, type\n\n```sql\nSELECT SUM(amount) AS sum\nFROM transaction;\n\
    ```\n\nExecute and get the result\n\n# Let’s concatenate the first and last name\
    \ of employees, type\n\n```sql\nSELECT CONCAT(first_name, last_name) AS full_name\n\
    FROM employees;\n```\n\nExecute and get the result\n\nNote: Here, I have explained\
    \ the process of using functions in `MySQL`.\n\n### 9.2 Logical operators in MySQL\n\
    \nThe `Logical operator` is a keyword use to combine more than one condition.\
    \ Let’s use our `employees` table to demonstrate logical operators.\n\n```sql\n\
    SELECT * FROM employees;\n```\n\n| employee_id | first_name | last_name | hourly_pay\
    \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\
    \ 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n|\
    \ 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50\
    \ | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon |\
    \ Plankton | 10.25 | 2023-01-07 |\n\n#### 9.2.1 AND operator\n\n```sql\nSELECT\
    \ *\nFROM employees\nWHERE hire_date<“2023-01-06” AND hourly_pay<15;\n```\n\n\
    It will return any results that match these criteria.\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50\
    \ | 2023-01-05 |\n\n#### 9.2.2 OR operator\n\n```sql\nSELECT *\nFROM employees\n\
    WHERE hire_date<“2023-01-06” OR hourly_pay<15;\n```\n\nIt will return any results\
    \ that match one of these criteria.\n\n| employee_id | first_name | last_name\
    \ | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene\
    \ | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
    \ |\n\n#### 9.2.3 NOT operator\n\n```sql\nSELECT *\nFROM employees\nWHERE NOT\
    \ hourly_pay = 12.50;\n```\n\nHere, `NOT` basically reverses anything you say.\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n|\
    \ 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n#### 9.2.4 Between operator\n\
    \n```sql\nSELECT *\nFROM employees\nWHERE hire_date BETWEEN “2023-01-04” AND “2023-01-07”;\n\
    ```\n\nExecute and get the result according to criteria.\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50\
    \ | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon |\
    \ Plankton | 10.25 | 2023-01-07 |\n\n#### 9.2.5 IN operator\n\n```sql\nSELECT\
    \ *\nFROM employees\nWHERE hourly_pay IN (17.25,10.25);\n```\n\nWe can find any\
    \ values that are within a set.\n\n| employee_id | first_name | last_name | hourly_pay\
    \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 5 | Sandy | Cheeks |\
    \ 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n# Chapter\
    \ 10: Some important MySQL commands\n\n# In this section, we are going to discuss\
    \ about some important clauses used in MySQL to handle databases or schema object.\n\
    \n### 10.1 Wild card character\n\nWild card is a special character used to handle\
    \ the database. There are two wild card character – percent and underscore.\n\n\
    # Let’s use `%` in our `employees` table to retrieve first name begins with S,\
    \ type\n\n```sql\nSELECT * FROM employees\nWHERE first_name LIKE “s%”;\n```\n\n\
    Execute and get the result\n"
