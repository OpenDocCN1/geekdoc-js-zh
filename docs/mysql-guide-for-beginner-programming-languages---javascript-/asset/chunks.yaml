    \n# 要删除 `employees` 表中的第 6 行，输入\n\n```sql\nDELETE FROM employees\nWHERE employee_id\
    \ = 6;\n```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay |\
    \ hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25\
    \ | 2023-01-02 |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob\
    \ | Squarepants | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05\
    \ |\n| 5 | Sandy | Cheeks | 10.25 | 2023-01-06 |\n\n# 第 5 章：数据控制语言 (DCL)\n\n##\
    \ 5.1 MySQL DCL 简介\n\nMySQL DCL 用于对对象实现安全性。`GRANT` 命令授予访问权限，`REVOKE` 命令用于移除之前授予的权限。\n\
    \nMySQL 中的主要 DCL 命令包括：\n- `GRANT`：允许用户执行特定任务。\n- `REVOKE`：移除权限。\n\n## 5.2 DCL\
    \ 执行\n\n我们通过授予权限来控制数据库。DCL 让我们能够对创建的数据库实现安全性。\n\n### 5.2.1 `GRANT` 命令\n\n我们已经创建了数据库（`employees`\
    \ 表），使用 `GRANT` 命令为新用户（`user1`）授予权限。转到 MySQL Workbench，点击连接，进入服务器的“Users and Privileges”（用户和权限）。在“Users\
    \ and Privileges”部分，我们已经创建了用户，现在我们将添加一个账户，输入 `user_1` 和密码 `12345`，确认并应用。\n\n现在转到\
    \ MySQL Workbench 的主页，点击数据库，连接数据库，输入 `User_1` 和密码 `12345`，会出现一个空白屏幕。因为没有给用户访问权限，我们必须关闭此应用并进入已创建的数据库（`hr_emp`）。输入\
    \ Grant 命令：\n\n```sql\nUSE hr_emp;\nGRANT SELECT, INSERT, DELETE ON hr_emp TO\
    \ \"User_1\";\n```\n\n执行语句序列：\n\n```sql\nUSE hr_emp;\nGRANT SELECT ON TO \"User_1\"\
    ;\n```\n\n现在注销 MySQL Workbench，使用 `User_1` 和密码 `12345` 重新登录，`User_1` 获取了员工数据的访问，输入：\n\
    \n```sql\nUSE hr_emp;\nSELECT * FROM employees;\n```\n\n### 输出\n\n| employee_id\
    \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
    \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 |\
    \ 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks\
    \ | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n\
    注意：新用户（`User_1`）拥有访问、插入和删除数据库中数据的权限。\n\n### 5.2.2 `REVOKE` 命令\n\n让我们移除向 `employees`\
    \ 表插入数据的权限，登录根数据库，按 `ctrl+V` 并输入：\n\n```sql\nUSE hr_emp;\nREVOKE INSERT ON employees\
    \ FROM 'User_1';\n```\n\n执行并获取结果：`INSERT` 命令的用户访问权限已成功移除。\n\n注意：现在新用户（`User_1`）无法在数据库（`employees`\
    \ 表）中插入数据。\n\n# 第 6 章：事务控制语言 (TCL)\n\n## 6.1 MySQL TCL 简介\n\nMySQL TCL 是 SQL 命令的子集，用于管理数据库中的事务。它允许我们回滚事务期间对数据库进行的更改。\n\
    \n以下是 MySQL TCL 的应用：\n1. **提交事务 (Committing Transactions)**：TCL 允许保存数据库中的更改。\n\
    2. **回滚事务 (Rolling Back Transactions)**：TCL 用于撤销事务期间的更改，并将数据库恢复到之前的状态。\n3. **设置事务隔离级别\
    \ (Setting Transaction Isolation Levels)**：TCL 用于设置事务隔离级别。我们可以确定并发和一致性的水平。\n4.\
    \ **保存点 (Savepoints)**：TCL 允许在事务内部设置保存点，以便需要时进行部分回滚。\n5. **在存储过程中管理事务 (Managing\
    \ Transactions in Stored Procedures)**：我们可以在过程范围内管理事务。\n\n## 6.2 TCL 命令执行\n\n\
    在本节中我们将解释自动提交（auto commit）、`commit`（提交）和 `rollback`（回滚）。自动提交是默认模式，当你在 MySQL 中执行事务时，只要自动提交开启，该事务就会被保存。如果我们创建一个事务并需要撤销它怎么办？例如如果我们小心删除了表中的所有行。\n\
    \n以我们已经创建的 `employees` 表为例，我由于忘记添加 `WHERE` 子句而删除了所有行，现在所有行都消失了，如何撤销这些更改，输入：\n\n\
    ```sql\nDELETE FROM employees;\n```\n\n要撤销，请按照以下步骤操作：\n\n```sql\nSET AUTOCOMMIT\
    \ = OFF;\n```\n\n现在，事务不会自动保存，我们需要手动保存每个事务，输入：\n\n```sql\nCOMMIT;\n```\n\n执行它。现在我要选择我的表，输入：\n\
    \n```sql\nSELECT * FROM employees;\n```\n\n现在如果我删除行并撤销更改，输入：\n\n```sql\nROLLBACK\n\
    ```\n\n这将我的当前事务恢复到我们使用 `commit` 的之前的保存点，输入：\n\n```sql\nSELECT * FROM employees;\n\
    ```\n\n我们的表恢复到了原来的样子。\n\n"
- fmt: "\n# Note: If we want to save the change, use `COMMIT` command.\n\n# Chapter\
    \ 7: Data Query Language (DQL)\n\n## 7.1 Introduction to MySQL DQL\n\n`DQL` in\
    \ MySQL is a part of the base grouping of SQL sub-languages. It is used to pass\
    \ query to the data base schema. It offers maximum flexibility of using `SELECT`\
    \ command to retrieve the information from database according to requirement of\
    \ user. We are going to discuss in details about `SELECT` command.\n\nWhen a `SELECT`\
    \ statement is fired against a table the result is compiled into a further temporary\
    \ table according to requirements.\n\nWe can use `SELECT` commands only if table\
    \ is created and values are inserted. Let’s take an example of employees table\
    \ which is already created.\n\n### 7.1.1 Syntax1\n\n```sql\nSELECT * FROM table_name;\n\
    ```\n\nImplementation: To retrieve all information from employees table.\n\n```sql\n\
    SELECT * FROM employees;\n```\n\nExecute and get the result\n\n| employee_id |\
    \ first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
    \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
    | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
    \ |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n### 7.1.2 Syntax 2\n\n\
    ```sql\nSELECT Col1, Col2,…. FROM table_name;\n```\n\nImplementation: To retrieve\
    \ specific column of table.\n\n```sql\nSELECT employee_id, first_name, last_name\
    \ FROM employees;\n```\n\nExecute and get the result\n\n| employee_id | first_name\
    \ | last_name |\n| :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\n| 2 | Squidward\
    \ | Tentacles |\n| 3 | Spongebob | Squarepants |\n| 4 | Patrick | Star |\n| 5\
    \ | Sandy | Cheeks |\n| 6 | Sheldon | Plankton |\n\nNote: The order of column\
    \ will be decided by the user.\n\n### 7.1.3 Syntax 3\n\n```sql\nSELECT * FROM\
    \ table_name WHERE condition;\n```\n\nImplementation: It will retrieve all the\
    \ rows of data related to `WHERE` clause.\n\n```sql\nSELECT * FROM employees WHERE\
    \ employee_id< 4;\n```\n\nExecute and get the result\n\n| employee_id | first_name\
    \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
    \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\nNote:\
    \ `WHERE` clause use to filter the rows depending upon condition.\n\n### 7.1.4\
    \ Syntax 4\n\n```sql\nSELECT col1, col2, …… FROM table_name WHERE condition;\n\
    ```\n\nImplementation: Here `first_name`, `last_name` and `hourly_pay` of employees\
    \ will be retrieved, depending upon `WHERE` clause.\n\n```sql\nSELECT first_name,\
    \ last_name, hourly_pay FROM employees WHERE hourly_pay<15;\n```\n\nExecute and\
    \ get the result\n\n| first_name | Last_name | hourly_pay |\n| :--- | :--- | :---\
    \ |\n| Spongebob | Squarepants | 12.50 |\n| Patrick | Star | 12.50 |\n| Sheldon\
    \ | Plankton | 10.25 |\n\n## 7.2 Current date and time using MySQL\n\nLet’s create\
    \ a temporary demo table, type:\n\n```sql\nCREATE TABLE demo(\n    my_date DATE,\n\
    \    my_time TIME,\n    my_datetime DATETIME\n);\n```\n\nExecute it, we have successfully\
    \ created a table with three columns – `my_date`, `my_time`, `my_datetime`.\n\n\
    If we want to get the current date than we need to create a timestamp.\n\nLet’s\
    \ insert data into a `DEMO` table, type:\n\n```sql\nINSERT INTO demo\nVALUE(CURRENT_DATE(),\
    \ CURRENT_TIME(), NOW());\n\nSELECT * FROM demo;\n```\n\nExecute it and get the\
    \ current date and time.\n\n| my_date | my_time | my_datetime |\n| :--- | :---\
    \ | :--- |\n| 2024-07-23 | 07:27:58 | 2024-07-23 07:27:58 |\n\nLet’s add a day\
    \ to current date, type:\n\n```sql\nINSERT INTO demo\nVALUES(CURRENT_DATE() +\
    \ 1, NULL, NULL)\n\nSELECT * FROM demo;\n```\n\nExecute and get the result\n\n\
    | my_date | my_time | my_datetime |\n| :--- | :--- | :--- |\n| 2024-07-23 | 07:27:58\
    \ | 2024-07-23 07:27:58 |\n| 2024-07-24 | | |\n\nNote: Here time and datetime\
    \ set to `NULL`.\n\n# Chapter 8: Role of Constraints\n\nIn this section we will\
    \ discuss about the constraints in MySQL.\n\n### 8.1 UNIQUE constraint\n\nThe\
    \ `UNIQUE` constraint ensures that all values in a column are different.\n\n```sql\n\
    CREATE TABLE products (\n    product_id INT,\n    product_name VARCHAR(25) UNIQUE,\n\
    \    price DECIMAL(4,2)\n);\n```\n\nIf we insert the same `product_name` twice,\
    \ an error will occur. We can add it using:\n\n```sql\nALTER TABLE products ADD\
    \ UNIQUE (product_name);\n```\n\n### 8.2 NOT NULL constraint\n\n`NOT NULL` constraint\
    \ ensures that a column cannot have a `NULL` value.\n\n### 8.3 CHECK constraint\n\
    \nThe `CHECK` constraint is used to limit the value range that can be in a column.\n\
    \n```sql\nCREATE TABLE employees (\n    employee_id INT,\n    first_name VARCHAR(50),\n\
    \    last_name VARCHAR(50),\n    hourly_pay DECIMAL(5,2),\n    hire_date DATE,\n\
    \    CONSTRAINT chk_hourly_pay CHECK (hourly_pay >= 10.00)\n);\n```\n\nIf pay\
    \ is less than 10, the constraint is violated. To remove it:\n\n```sql\nALTER\
    \ TABLE employees DROP CHECK chk_hourly_pay;\n```\n\n### 8.4 DEFAULT constraint\n\
    \n`DEFAULT` provides a default value for a column when none is specified.\n\n\
    ```sql\nCREATE TABLE products (\n    product_id INT,\n    product_name VARCHAR(25),\n\
    \    price DECIMAL(4,2) DEFAULT 0\n);\n```\n\n### 8.5 PRIMARY KEY constraint\n\
    \nThe `PRIMARY KEY` is a combination of `UNIQUE` and `NOT NULL`. A table can have\
    \ only one primary key.\n\n```sql\nCREATE TABLE transactions(\n    transaction_id\
    \ INT PRIMARY KEY,\n    amount DECIMAL(5,2)\n);\n```\n\nTo add it to an existing\
    \ table:\n\n```sql\nALTER TABLE products ADD PRIMARY KEY (transaction_id);\n```\n\
    \n### 8.6 Auto increment attribute in MYSQL\n"
