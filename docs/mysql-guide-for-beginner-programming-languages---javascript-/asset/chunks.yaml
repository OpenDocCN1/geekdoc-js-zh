    # Preface

    SQL is one of the most powerful language which handles the tasks of RDBMS (Relational
    Data Management System). It uses compact-English statements to create, define,
    update, and control the relational database.


    SQL is used to store and process information in relational database whereas MySQL
    is used in open-source relational database. MySQL is best suitable for client-Server
    Environment. It provides flexible transaction management. It serves as the primary
    relational database for many applications as well as commercial products. As an
    eBook, this would be a good reference on how to use MySQL to extract, manage,
    and manipulate data stored in relational databases. We have discussed in details
    with examples about DDL, DQL, DCL and TCL. If you find most programming books
    to be dry, this could be an excellent book for you to get started in MySQL.


    # Overview of MySQL

    SQL (Structured query language) is initially created by IBM and first implemented
    by Oracle corporation in 1979 but there were no standards so later 1986 it was
    improved and jointly published by ANSI and ISO. In 1992, SQL’92 was published.
    It is organised in much better way, Data is contained in table, tables are grouped
    into schemas and schemas are grouped into clusters. The first version of MySQL
    was developed by Monty Widenius, David Axmark and Allan. It appeared in 1995.
    Many versions of the MySQL were released by 2000. These versions were compatible
    with all the major platforms.


    MySQL is a RDBMS (Relational Database management system) which is based on structured
    query language (SQL). A relational database stores information in tabular form,
    with rows and columns representing different data attributes and the various relationships
    between the data values. We use commands to create, define, insert, update and
    control the database. Following are the types of SQL:

    * DDL (Data Definition Language)

    * DQL (Data Query Language)

    * DML (Data Manipulation Language)

    * DCL (Data Control Language)

    * TCL (Transaction Control Language)

    We will discuss all these in upcoming chapters.


    Following are the Top 10 popular applications using MySQL

    1. online gaming

    2. digital marketing

    3. retail point-of-sale systems

    4. Internet of Things monitoring systems

    5. SaaS applications

    6. Facebook

    7. Flickr

    8. Web development

    9. Twitter

    10. YouTube


    # Chapter 1: Introduction to MySQL

    ## 1.1 Introduction

    MySQL is a software which employs SQL (Structured query language). It is very
    fast, reliable, scalable, and easy to use for both small and large applications.
    The name MySQL suggested by the co-founder Widenius''s daughter.


    ## What is Database?

    Data is a raw fact and figure that is used everywhere in our real world. A group
    of data makes a specific information or database. In our day-to-day life if we
    visit a mall, we see that a shopkeeper is handling a product database using a
    scanner. Another example, let us consider a bank, they are handling customer database.
    Third example is in schools they are handling student’s database. Henceforth the
    database can be handled either manually in a register or through computer software
    such as MySQL.


    ## What is relational database?

    It is a collection of organized data stored in one or more tables. We can easily
    see and understand how different data structures relate to each other.


    # Difference between MySQL and SQL

    We can create, read, update, and delete the database using MySQL. But SQL (structured
    query language) is a Compact-English-Statement used to access, manipulate, and
    coordinate the database. In this eBook we are going to discuss about interactive
    environment that is how to work on entered database.


    # Types of Command used in MySQL

    Following are the types of commands used in MySQL:

    * DDL (Data definition language)- These commands are used to create, drop, alter
    and describe the Table.

