  trans: "\n\n# `auto increment` 属性可以应用于设置为键的列，每当我们插入一条新行时，我们的主键就会自动填充，然后随后的每一行都会自动递增。\n\
    \n# 让我们删除事务表并带有自动递增功能重新创建，输入：\n\n```sql\nCREATE TABLE transactions (\n  transaction_id\
    \ INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2)\n);\n```\n\n注意：默认情况下，`auto\
    \ increment` 将设置为 `1`。\n\n# 让我们在 transactions 表中插入一些值，不需要插入 `transaction_id`，它将被自动分配。\n\
    \n```sql\nINSERT INTO transactions (amount)\nVALUES (2.56);\nSELECT * FROM transactions;\n\
    ```\n\n| transaction_id | amount |\n| :--- | :--- |\n| 1 | 2.56 |\n\n注意：这里 `transaction_id`\
    \ 是自动插入的。\n\n# 我们可以设置主键从不同的值开始，输入：\n\n```sql\nALTER TABLE transactions\nAUTO_INCREMENT\
    \ = 1000;\n```\n\n执行并获取结果，transaction ID 从 `1000` 开始设置。我们必须删除整个行并插入新值。\n\n## 8.7\
    \ FOREIGN KEY 约束\n\n外键是一个表中的 `PRIMARY KEY`，可以通过 `foreign key` 在另一个表中找到，我们可以在两个表之间建立链接。在我们的事务表中，这样做这样做有两个主要优点：如果我想查看发起此交易的客户\
    \ ID，我可以引用 `customers` 表，然后找到该客户的姓和名。\n\n# 让我们创建事务和客户表，使用外键建立它们之间的链接\n\n# 我将创建一个新的客户表，输入：\n\
    \n```sql\nCREATE TABLE customers (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n\
    \  first_name VARCHAR (50),\n  last_name VARCHAR (50)\n);\n```\n\n执行并获取结果\n\n\
    # 现在向表中插入一些值，输入：\n\n```sql\nINSERT INTO customers (first_name, last_name)\nVALUES\
    \ (“Fred”, “Fish”),\n(“Larry”, “Lobster”),\n(“Bubble”, “Bass”\n\nSELECT * FROM\
    \ customers;\n```\n\n| customer_id | first_name | last_name |\n| :--- | :--- |\
    \ :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\
    \n# 现在我们将通过 `ID` 在我们的 `customers` 表和 `transactions` 表之间建立链接。让我们创建一个带有 `FOREIGN\
    \ KEY` 约束的 `transactions` 表，输入：\n\n```sql\nCREATE TABLE transactions (\n  transaction_id\
    \ INT PRIMARY KEY AUTO_INCREMENT,\n  amount DECIMAL (5,2),\n  customer_id INT,\n\
    \  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n);\n```\n\n执行并获取结果\n\
    \n注意：这里 `customer_id` 列是 `FOREIGN KEY`。\n\n使用外键两个表之间的链接所示所示：\n\n| transaction_id\
    \ | amount | customer_id | first_name | last_name |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 1000 | 4.89 | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 | Bubble\
    \ | Bass |\n| 1002 | 3.32 | 1 | Fred | Fish |\n| 1003 | 4.99 | 3 | Bubble | Bass\
    \ |\n\n## 8.8 JOIN 子句\n\n`JOIN` 是一个用于根据表与表之间的相关列（例如外键）合并两个或多个表的行的子句。让我们连接之前创建的表。我们有两个表：`transaction`\
    \ 表和 `customers` 表。\n\n| transaction_id | amount | customer_id |\n| :--- | :---\
    \ | :--- |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32 | 1 |\n| 1003\
    \ | 4.99 | 3 |\n\n| customer_id | first_name | last_name |\n| :--- | :--- | :---\
    \ |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n#\
    \ 让我们内连接两个表，输入：\n\n```sql\nSELECT *\nFROM transactions\nINNER JOIN customers ON\
    \ transactions.customer_id = customers.customer_id;\n```\n\n执行并获取结果\n\n| transaction_id\
    \ | amount | customer_id | first_name | last_name |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 1000 | 4.89 | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 | Bubble\
    \ | Bass |\n| 1002 | 3.32 | 1 | Fred | Fish |\n| 1003 | 4.99 | 3 | Bubble | Bass\
    \ |\n\n# 第 9 章：MySQL 中的函数和逻辑运算符\n\n### 9.1 MySQL 中的函数\n\n一种接受用户参数并返回值的存储程序称为 `Function`。`MySQL`\
    \ 提供了许多函数。其中一些显示所示。\n\n# 让我们统计 `transaction` 表 `amount` 列的行数，输入：\n\n```sql\nSELECT\
    \ COUNT(amount)\nFROM transaction;\n```\n\n执行并获取结果\n\n# 查找 `amount` 列中的最大值，输入：\n\
    \n```sql\nSELECT MAX(amount) AS maximum\nFROM transaction;\n```\n\n注意：这里列名将变为\
    \ “maximum”。\n\n# 查找 `amount` 列中的最小值，输入：\n\n```sql\nSELECT MIN(amount) AS minimum\n\
    FROM transaction;\n```\n\n执行并获取结果\n\n# 查找 `amount` 列的平均值，输入：\n\n```sql\nSELECT\
    \ AVG(amount) AS average\nFROM transaction;\n```\n\n执行并获取结果\n\n# 查找 `amount` 列的总和，输入：\n\
    \n```sql\nSELECT SUM(amount) AS sum\nFROM transaction;\n```\n\n执行并获取结果\n\n# 拼接\
    \ `employees` 的姓和名，输入：\n\n```sql\nSELECT CONCAT(first_name, last_name) AS full_name\n\
    FROM employees;\n```\n\n执行并获取结果\n\n注意：这里我解释了 `MySQL` 中的函数的用法。\n\n### 9.2 MySQL\
    \ 中的逻辑运算符\n\n`Logical operator` 是一个用于组合多个条件的关键字。让我们使用 `employees` 表来演示逻辑运算符。\n\
    \n```sql\nSELECT * FROM employees;\n```\n\n| employee_id | first_name | last_name\
    \ | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene\
    \ | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
    \ |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star\
    \ | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon\
    \ | Plankton | 10.25 | 2023-01-07 |\n\n#### 9.2.1 AND 运算符\n\n```sql\nSELECT *\n\
    FROM employees\nWHERE hire_date<“2023-01-06” AND hourly_pay<15;\n```\n\n它将返回符合这些标准的结果。\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04\
    \ |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n\n#### 9.2.2 OR 运算符\n\n```sql\n\
    SELECT *\nFROM employees\nWHERE hire_date<“2023-01-06” OR hourly_pay<15;\n```\n\
    \n它将返回符合这些标准之一的结果。\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
    \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n#### 9.2.3 NOT 运算符\n\
    \n```sql\nSELECT *\nFROM employees\nWHERE NOT hourly_pay = 12.50;\n```\n\n这里，`NOT`\
    \ 基本上反转了你说的任何。\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
    \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n#### 9.2.4 Between\
