    \ type\n\n```sql\nUPDATE employees\nSET hire_date = NULL\nWHERE employee_id =\
    \ 6;\n```\n\n### Output\n\n| employee_id | first_name | last_name | hourly_pay\
    \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\
    \ 10.25 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n|\
    \ 3 | Spongebob | Squarepants | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25\
    \ | 2023-01-05 |\n| 5 | Sandy | Cheeks | 10.25 | 2023-01-06 |\n| 6 | Sheldon |\
    \ Plankton | 10.25 | |\n\nNote: Plankton’s `hire_date` is now `NULL`.\n\n## 4.2.4\
    \ `DELETE` command\n\n# To delete all rows in `employees` table, type\n\n```sql\n\
    DELETE FROM employees;\n```\n\nNote: Be alert! entire rows in a table will be\
    \ deleted.\n\n# To delete 6th row in `employees` table, type\n\n```sql\nDELETE\
    \ FROM employees\nWHERE employee_id = 6;\n```\n\n### Output\n\n| employee_id |\
    \ first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
    \ | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 10.25 | 2023-01-04 |\n\
    | 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 10.25 | 2023-01-06\
    \ |\n\n# Chapter 5: Data Control Language (DCL)\n\n## 5.1 Introduction to MySQL\
    \ DCL\n\nMySQL DCL used to implement security on objects. `GRANT` command gives\
    \ the permission to access the database and `REVOKE` command is used to remove\
    \ previously granted access from a user.\n\nThe primary DCL commands in MySQL\
    \ include:\n- `GRANT`: It allows users to perform specified tasks.\n- `REVOKE`:\
    \ To remove access rights.\n\n## 5.2 DCL execution\n\nLet us control the root\
    \ database by giving access. DCL gives us facility to implement security on created\
    \ database.\n\n### 5.2.1 `GRANT` command\n\nWe have already created a root database\
    \ (`employees` table), now let’s give access privileges to a new user (`user1`)\
    \ using `GRANT` command. To create a dummy user, let’s move to MySQL workbench.\
    \ We can click on connection, we have already created a database (`employees`\
    \ table), click on server and go to Users and Privileges. In \"User and Privileges\"\
    \ section we have all the users created, now I will add an account, enter `user_1`\
    \ and password `12345`, confirm the password and apply.\n\nNow go to Home of MySQL\
    \ workbench, click on database, and connect to database, enter `User_1` and password\
    \ `12345`, a blank screen will appear. There is no database here because there\
    \ is no access given to the user, we must close this application and go to root\
    \ database (`hr_emp`) which is already created by us (`employees` table). Enter\
    \ the Grant command, type:\n\n```sql\nUSE hr_emp;\nGRANT SELECT, INSERT, DELETE\
    \ ON hr_emp TO \"User_1\";\n```\n\nExecute the sequence of statements:\n\n```sql\n\
    USE hr_emp;\nGRANT SELECT ON TO \"User_1\";\n```\n\nNow, Logout from MySQL workbench,\
    \ Login and reconnect with `User_1` and password `12345`. `User_1` got the access\
    \ to the employee data, type:\n\n```sql\nUSE hr_emp;\nSELECT * FROM employees;\n\
    ```\n\n### Output\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
    \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
    \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy\
    \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07\
    \ |\n\nNote: New user (`User_1`) having permission to access, insert and delete\
    \ data from root database.\n\n### 5.2.2 `REVOKE` command\n\nLet’s remove the permission\
    \ of inserting data into a `employees` table, login to the root database, press\
    \ `ctrl+V` and type:\n\n```sql\nUSE hr_emp;\nREVOKE INSERT ON employees FROM 'User_1';\n\
    ```\n\nExecute and get the result: User access rights for `INSERT` command is\
    \ successfully removed.\n\nNote: Now the new user (`User_1`) is unable to insert\
    \ data in root database (`employees` table).\n\n# Chapter 6: Transaction Control\
    \ Language (TCL)\n\n## 6.1 Introduction to MySQL TCL\n\nMySQL TCL is a subset\
    \ of SQL commands used to manage transactions in a database. It allows us to roll\
    \ back the changes made in database during transaction.\n\nFollowing are the applications\
    \ of MySQL TCL:\n1. **Committing Transactions**: TCL allows us to save the changes\
    \ made in database.\n2. **Rolling Back Transactions**: TCL used to undo the changes\
    \ made during the transaction and restores the database to its previous state.\n\
    3. **Setting Transaction Isolation Levels**: TCL used to set the transaction isolation\
    \ level. We can determine the level of concurrency and consistency.\n4. **Savepoints**:\
    \ TCL allows us to set savepoints within a transaction, allowing for partial rollback\
    \ if needed.\n5. **Managing Transactions in Stored Procedures**: We can use manage\
    \ transactions within the scope of the procedure.\n\n## 6.2 TCL command execution\n\
    \nIn this section we are going to explain auto commit, `commit` and `rollback`.\
    \ Auto commit is a mode by default, Auto commit is set to on whenever you execute\
    \ a transaction within MySQL that transaction is saved. What if we were to make\
    \ a transaction and we need to undo a transaction, for example if we accidentally\
    \ delete all of the rows of the table.\n\nLet’s take an example of `employees`\
    \ table which we have already created, I accidentally deleted all rows because\
    \ I forgot to add a `WHERE` clause so all rows are now gone, how to undo these\
    \ changes, type:\n\n```sql\nDELETE FROM employees;\n```\n\nTo undo follow these\
    \ steps, type:\n\n```sql\nSET AUTOCOMMIT = OFF;\n```\n\nNow, transaction will\
    \ not save automatically, we would need to manually save each transaction, type:\n\
    \n```sql\nCOMMIT;\n```\n\nExecute it, Now I am going to select my table, type:\n\
    \n```sql\nSELECT * FROM employees;\n```\n\nNow if I delete the rows and to undo\
    \ the changes, type:\n\n```sql\nROLLBACK\n```\n\nThis will restore my current\
    \ transaction back to previous save point where we used `commit`, type:\n\n```sql\n\
    SELECT * FROM employees;\n```\n\nOur table is back to what it previously was.\n\
    \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n|\
    \ 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
    \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy\
    \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07\
    \ |\n"
