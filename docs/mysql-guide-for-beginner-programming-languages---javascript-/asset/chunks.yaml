    Chapter 8: Role of Constraints in MySQL


    # In this section we will discuss about the constraints in MySQL.


    8.1 UNIQUE constraint in MySQL


    # The unique constraint shows the values of a column are all different. We add
    this constraint when we create a table, so let’s a create a new table


    # 1 CREATE TABLE products (


    # 2 ​product_id INT,


    # 3 ​product_name VARCHAR (25) UNIQUE,


    # 4 ​price DECIMAL (4,2)


    # 5 );


    # Since we have used UNIQUE constraint so we cannot insert any product names that
    are the same they all have to be unique.


    # In case if we forgot to add UNIQUE constraint during table creation than we
    can use the following sequence of commands to add UNIQUE constraint


    # 1 ALTER TABLE products


    # 2 ADD CONSTRAINT


    # 3 UNIQUE (product_name);


    # Execute and get the result.


    # UNIQUE constraint is successfully added to column product_name.


    # If we insert the same product twice in product_name column than an error message
    will be displayed. So, all the values in product_name need to be different.


    8.2 NOT NULL constraint


    # If we use NOT NULL constraint than the value within a specific column should
    not be null. If we forgot to add value than error will occur. We cannot enter
    a null value. We can set to be zero that’s acceptable. It’s a useful constraint
    to verify input if there’s any column that you don’t want to have any null values.


    8.3 CHECK constraint


    # The CHECK constraint is used to limit what values can be placed in a column,
    for example I live in a United States depending on which state you live in there
    is a minimum hourly wage that employers must pay in this example let’s set an
    hourly pay to our employees table, every employee needs to be paid at least minimum
    wage in that region, we can do that with the CHECK constraint.


    # Let’s create employees table with constraint CHECK


    # 1 CREATE TABLE employees (


    # 2 ​employee_id INT,


    # 3​first_name VARCHAR (50),


    # 4​last_name VARCHAR (50),


    # 5​hourly_pay DECIMAL (5,2),


    # 6​hire_date DATE


    # 7​CONSTRAINT chk_hourly_pay CHECK (hourly_pay >= 10.00)


    # 8​);


    # Here, check constraint check hourly pay will be violated if hourly_pay is less
    than 10.00\. so after executing the above sequence of statement a user must be
    alert not to enter any value less than 10 in hourly_pay column.


    # We can also remove the CHECK constraint, type


    # 1 ALTER TABLE employees


    # 2 DROP CHECK chk_hourly_pay;


    # Execute and get the result


    8.4 DEFAULT constraint


    # When we are inserting a new row if we do not specify a value for a column by
    default, we can add some value that we set here’s an example. Let’s create products
    table and set the price default value to 0\. Type


    # 1 CREATE TABLE products (


    # 2 ​product_id INT,


    # 3 ​product_name VARCHAR(25),


    # 4 ​price DECIMAL(4,2) DEFAULT 0


    # 5 );


    # Here, if we insert product id and product name in the table than the price 0
    will be automatically included due to DEFAULT constraint.


    # Let’s insert some values in to the products table, type


    # 1 INSERT INTO products (product_id, product_name)


    # 2 VALUES (10, “spoon”),


    # 3 ​(11, “fork”);


    # 4 SELECT * FROM products;


    # Output


    | product_id | product_name | price |


    | 10 | spoon | 0.00 |


    | 11 | fork | 0.00 |


    8.5 PRIMARY KEY constraint


    # The PRIMARY KEY is applied to a column where each value in that column must
    both be unique and not NULL. It is typically used as a unique identifier, for
    example I live in United States each citizen within the United States has a unique
    social security number. There is a strong possibility that two citizens in the
    United States shares the same first name and last name. Let us take an example
    “John Smith”, if we search for a citizen with a unique social security number
    than we know for sure we have the right person. A table can have only one primary
    key constraint.


    # Let’s create a table of transactions with two columns and PRIMARY KEY constraint,
    type


    # 1 CREATE TABLE transactions(


    # 2​transaction_id INT PRIMARY KEY,


    # 3​amount DECIMAL(5,2)


    # 4 );


    # Execute and get the result


    # We can also add primary key to any table, type


    # 1 ALTER TABLE products


    # 2 ADD CONSTRAINT


    # 3 PRIMARY KEY (transaction_id);


