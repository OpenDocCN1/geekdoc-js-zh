    ## Chapter 2: MySQL Syntax


    Just like other programming language MySQL follows the unique set of rules and
    guidelines known as MySQL syntax. It is very easy to run and execute as well.


    ### 2.1 Data Types in MySQL


    MySQL data types specify the type of value that can be store in database table.
    Data types are mainly classified into three categories.


    * Numeric

    * String

    * Date and Time


    #### 2.1.1 Numeric data type


    It refers to the data that is in the form of numbers such as `Integer`, `Float`
    and `Boolean`. The following table lists the MySQL Numeric data type.


    | Numeric data Type | Range |

    | :--- | :--- |

    | BIT | 0-1 |

    | TINYINT | 0-255 |

    | SMALLINT | -32,768 - 32,767 |

    | BIGINT | -9,223,372,036,854,775,808 - 9,223,372,036,854,775,807 |

    | FLOAT | -1.79E+308 - 1.79E+308 |

    | REAL | -3.40E+38 - 3.40E+38 |


    #### 2.1.2 String data type


    It allows us to store fixed or variable character values such as `char`, `varchar`,
    and `text`. The following table lists the MySQL String data type.


    | String data Type | Description |

    | :--- | :--- |

    | CHAR | Fixed length of 8000 characters |

    | VARCHAR | Variable- length of 8000 characters |

    | TEXT | Variable- length of 2GB data |


    #### 2.1.3 Date and Time data type


    It is used for storing values that can contain both date as well as time. The
    following table lists the MySQL Date and Time data type.


    | Date and Time data Type | Description |

    | :--- | :--- |

    | DATE | It stores date in the format (YYYY-MM-DD) |

    | TIME | It stores time in the format (HH:MI:SS) |

    | DATETIME | It stores date and time information (YYYY-MM-DD HH:MI:SS) |


    ### 2.2 Operators in MySQL


    MySQL operators use to specify certain condition in statement. Operators are broadly
    classified in five categories -


    * Arithmetic operator

    * Logical operator

    * Comparison operator

    * Bitwise operator

    * Set operator


    #### 2.2.1 Arithmetic operators


    It performs arithmetical operation on numerical data as well. The following table
    lists the Arithmetic operators.


    | Arithmetic operators | Description |

    | :--- | :--- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |


    #### 2.2.2 Logical operators


    It gives results either true or false. The following table lists the Logical operators.


    | Logical operators | Description |

    | :--- | :--- |

    | AND | True if both expressions are true |

    | IN | if operand is equal to any from list |

    | OR | True if any one |

    | NOT | Reverses the value |

    | LIKE | if operand matches a pattern |

    | BETWEEN | if operand is within range |


    #### 2.2.3 Comparison operators


    It is also known as relational which compare values in table. The following table
    lists the Comparison operators.


    | Comparison operators | Description |

    | :--- | :--- |

    | = | Equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal |

    | <= | Less than or equal |

    | <> | Not equal to |


    #### 2.2.4 Bitwise operators


    It converts two integer values to binary, perform the AND, OR, and NOT on each
    bit. The following table lists the Bitwise operators.


    | Bitwise operators | Description |

    | :--- | :--- |

    | AND | True if both |

    | OR | True if any |

    | NOT | Reverses the |


    #### 2.2.5 Set operators


    Set operators used to combine rows from two or more table. The following table
