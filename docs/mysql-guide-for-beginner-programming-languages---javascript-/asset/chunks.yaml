    | Set operators | Description |

    | :--- | :--- |

    | UNION | Combines two or more result set without duplicating values |

    | UNION ALL | Combines two or more result set including duplicating values |

    | INTERSECT | It includes only the common values present in two or more |

    | EXCEPT | It includes only results from first set that are not included in second
    |


    ## Chapter 3: Data Definition Language (DDL)


    In previous chapter we have seen the syntax of MySQL which includes datatypes
    and operators used in MySQL, now we will learn about integrity constraints used
    in MySQL than we will learn about DDL and create a table using DDL commands.


    ### 3.1 Integrity constraints in MySQL


    Integrity constraints are set of rules that a table’s data or column must follow.
    We can use integrity Constraints with commands at the column or table level. The
    table-level Integrity constraints will be applied to the entire table, but the
    column level constraints are only applied to one column. Table shows the list
    of Integrity constraints used in MySQL.


    | Integrity constraints | Description |

    | :--- | :--- |

    | NOT NULL | It prevents a column from having a NULL value |

    | DEFAULT | When no value is defined for a column, the DEFAULT Constraint provides
    a default value |

    | UNIQUE | It ensures that any value in a column is unique |

    | PRIMARY KEY | Uniquely identifies each row/record |

    | FOREIGN KEY | It recognizes a row/record in any database table uniquely |


    ### 3.2 Introduction to MySQL DDL


    MySQL DDL statements are used to define and manipulate data base structure. It
    allows us to create a table, modify and maintain databases using commands.


    Following are the commands of DDL.


    * `CREATE` - It is used to create a table and schema.

    * `ALTER` - It is used to add, modify or delete columns or constraints from the
    database table.

    * `TRUNCATE` - It is used to delete the data present in the table but this will
    not delete the table.

    * `DROP` – It is used to delete the entire Table.

    * `RENAME` – It is used to rename the Table.


