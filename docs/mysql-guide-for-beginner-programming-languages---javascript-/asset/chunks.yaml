    Chapter 6: Transaction Control Language (TCL)


    6.1 Introduction to MySQL TCL


    # MySQL TCL is a subset of SQL commands used to manage transactions in a database.
    It allows us to roll back the changes made in database during transaction.


    # Following are the applications of MySQL TCL:


    # 1. Committing Transactions: TCL allows us to save the changes made in database.


    # 2. Rolling Back Transactions: TCL used to undo the changes made during the transaction
    and restores the database to its previous state.


    # 3. Setting Transaction Isolation Levels: TCL used to set the transaction isolation
    level. We can determine the level of concurrency and consistency.


    # 4. Savepoints: TCL allows us to set savepoints within a transaction, allowing
