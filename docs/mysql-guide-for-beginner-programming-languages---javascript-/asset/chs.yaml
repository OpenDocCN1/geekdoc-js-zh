- "# MySQL 入门指南（编程语言 - JavaScript, Java, MySQL, PHP 及使用 Python 自动化）\n\n\n\n![](img/image_rsrc43A.jpg)\n\
  \n\n# 前言\n\n# MySQL 概述\n\n\n\n\n\n\n# 前言\nSQL 是处理 RDBMS（关系型数据库管理系统）任务最强大的语言之一。它使用简洁的英语语句来创建、定义、更新和控制关系型数据库。\n\
  \nSQL 用于在关系型数据库中存储和处理信息，而 MySQL 用于开源关系型数据库。MySQL 最适用于客户端-服务器环境。它提供了灵活的事务管理。它是许多应用程序以及商业产品的主要关系型数据库。作为一本电子书，这将是关于如何使用\
  \ MySQL 提取、管理和操作存储在关系型数据库中的数据的参考。我们已经通过示例详细讨论了 DDL、DQL、DCL 和 TCL。如果你觉得大多数编程书籍很枯燥，这可能是你入门\
  \ MySQL 的绝佳书籍。\n\n# MySQL 概述\nSQL（结构化查询语言）最初由 IBM 创建，并于 1979 年由 Oracle 公司首次实现，但由于没有标准，在随后的\
  \ 1986 年它由 ANSI 和 ISO 改进并联合发布。1992 年发布了 SQL_92。它的组织方式变得更好，数据包含在表中，表分组为模式（schemas），模式分组为集群（clusters）。MySQL\
  \ 的第一个版本由 Monty Widenius、David Axmark 和 Allan 开发，于 1995 年出现。到 2000 年，发布了多个版本的 MySQL。这些版本兼容所有主流平台。\n\
  \nMySQL 是一种基于结构化查询语言（SQL）的 RDBMS（关系型数据库管理系统）。关系型数据库以表格的形式存储信息，行和列表示不同的数据属性以及数据值之间的各种关系。我们使用命令来创建、定义、插入、更新和控制数据库。以下是\
  \ SQL 的类型：\n* DDL（数据定义语言）\n* DQL（数据查询语言）\n* DML（数据操纵语言）\n* DCL（数据控制语言）\n* TCL（事务控制语言）\n\
  我们将在后续章节中讨论所有这些内容。\n\n以下是使用 MySQL 的前 10 个热门应用程序：\n1. 在线游戏\n2. 数字营销\n3. 零售销售点系统\n\
  4. 物联网监控系统\n5. SaaS 应用程序\n6. Facebook\n7. Flickr\n8. Web 开发\n9. Twitter\n10. YouTube\n\
  \n# 第 1 章：MySQL 简介\n## 1.1 简介\nMySQL 是一个采用 SQL（结构化查询语言）的软件。它非常快速、可靠、可扩展，且易于小型和大型应用程序。MySQL\
  \ 的名字是由创始人 Widenius 的女儿命名的。\n\n### 什么是数据库？\n数据是现实世界中到处使用的原始事实和数字。一组数据构成特定的信息或数据库。在我们的日常生活中，如果我们访问商场，会看到店主使用扫描器处理产品数据库。另一个例子，让我们考虑银行，他们处理客户数据库。第三个例子是学校，他们处理学生数据库。因此，数据库既可以手动在登记簿处理，也可以通过\
  \ MySQL 等计算机软件处理。\n\n### 什么是关系型数据库？\n它是存储在一个或多个表中的组织数据集合。我们可以轻松地看到并理解不同数据结构之间相互的关系。\n\
  \n## MySQL 和 SQL 的区别\n我们使用 MySQL 来创建、读取、更新和删除数据库。但 SQL（结构化查询语言）是一种用于访问、操作和协调数据库的简洁英语语句。在本文电子书中，我们将讨论关于如何在进入的数据库上操作交互式环境。\n\
  \n## MySQL 中使用的命令类型\n以下是 MySQL 中使用的命令类型：\n* DDL（数据定义语言）- 这些命令用于创建、删除、修改和描述表。\n\n\
  \n\n\n\n### DML (数据操纵语言) - 这些命令用于操作数据，如求和、平均值等\n\n# DCL (数据控制语言) – 它为数据库提供安全性，如\
  \ `Grant`（授权）和 `Revoke`（撤销）。\n\n### DQL (数据查询语言) – 它允许用户向关系型数据库传递查询。\n\n### TCL\
  \ (事务控制语言) – 它允许用户保存和恢复数据库。\n\n**注意：** 我们即将在接下来的章节中讨论这些命令。\n\n## 1.2 安装 MySQL\n\n\
  在本节中，你将学习安装 MySQL Workbench。让我们从从 `dev.mysql.com` 下载 MySQL 开始。选择操作系统并下载 MySQL 安装程序\
  \ `8.0.19`。将其保存在合适的位置，例如桌面。\n\n![](img/image_rsrc43B.jpg)\n\n点击保存的文件，现在选择一种安装类型，我根据我的需求选择“Full”（完整安装），然后点击\
  \ next（下一步）按钮。\n\n![](img/image_rsrc43C.jpg)\n\n选择 MySQL 和数据的位置。点击 next（下一步）按钮，出现需求检查界面，你可以选择需求或直接点击\
  \ next（下一步）。\n\n![](img/image_rsrc43D.jpg)\n\n如果我们不选择需求，将出现下方所示界面，只需点击“Yes”（是），然后点击\
  \ next（下一步）。\n\n![](img/image_rsrc43E.jpg)\n\n将出现 MySQL 的功能界面，点击 `Execute`（执行）并等待几分钟。\n\
  \n![](img/image_rsrc43F.jpg)\n\n所有产品已成功安装在我们的电脑上，现在双击 next（下一步）按钮，选择 standalone\
  \ MySQL server（独立 MySQL 服务器），然后点击 next（下一步）按钮。\n\n![](img/image_rsrc43G.jpg)\n\n\
  点击 next（下一步）跳过类型和网络/身份验证。\n\n现在为你的账户设置密码，点击 next（下一步）按钮。\n\n![](img/image_rsrc43H.jpg)\n\
  \n点击 next（下一步）到达 Apply configuration（应用配置）界面，点击 `execute` 然后点击 `Finish`（完成）。我们已成功配置了\
  \ MySQL。下一步跳过产品配置。\n\n![](img/image_rsrc43J.jpg)\n\n将出现 Connect to the server（连接服务器）界面，输入你的账户密码并检查是否已连接到服务器\
  \ – 连接成功，点击 next（下一步）按钮。\n\n![](img/image_rsrc43K.jpg)\n\n回到 Apply configuration（应用配置），点击\
  \ `execute` 然后点击 `Finish`（完成）。我们在电脑上已成功配置并安装了 MySQL。\n\nMySQL Workbench 安装成功，使用你的密码连接服务器并开始使用\
  \ MySQL。\n\n# 第 2 章：MySQL 语法\n\n与其他编程语言一样，MySQL 遵循一套独特的规则和指南，被称为 MySQL 语法。它也非常容易运行和执行。\n\
  \n## 2.1 MySQL 中的数据类型\n\nMySQL 数据类型指定了存储在数据库表中的值的类型。数据类型主要分为三类。\n\n* 数字\n* 字符串\n\
  * 日期和时间\n\n#### 2.1.1 数字数据类型\n\n它是指数字形式的数据，如 `Integer`（整数）、`Float`（浮点数）和 `Boolean`（布尔）。下表列出了\
  \ MySQL 数字数据类型。\n\n| 数字数据类型 | 范围 |\n| :--- | :--- |\n| BIT | 0-1 |\n| TINYINT |\
  \ 0-255 |\n| SMALLINT | -32,768 - 32,767 |\n| BIGINT | -9,223,372,036,854,775,808\
  \ - 9,223,372,036,854,775,807 |\n| FLOAT | -1.79E+308 - 1.79E+308 |\n| REAL | -3.40E+38\
  \ - 3.40E+38 |\n\n#### 2.1.2 字符串数据类型\n\n它允许我们存储固定或可变的字符值，如 `char`、`varchar` 和 `text`。下表列出了\
  \ MySQL 字符串数据类型。\n\n| 字符串数据类型 | 说明 |\n| :--- | :--- |\n| CHAR | 固定长度 8000 字符 |\n\
  | VARCHAR | 变长 8000 字符 |\n| TEXT | 变长 2GB 数据 |\n\n#### 2.1.3 日期和时间数据类型\n\n它用于存储同时包含日期和时间的值。下表列出了\
  \ MySQL 日期和时间数据类型。\n\n| 日期和时间数据类型 | 说明 |\n| :--- | :--- |\n| DATE | 以 (YYYY-MM-DD)\
  \ 格式存储日期 |\n| TIME | 以 (HH:MI:SS) 格式存储时间 |\n| DATETIME | 存储日期和时间信息 (YYYY-MM-DD HH:MI:SS)\
  \ |\n\n## 2.2 MySQL 中的运算符\n\nMySQL 运算符用于在语句中指定特定条件。运算符大致分为五类：\n\n* 算术运算符\n* 逻辑运算符\n\
  * 比较运算符\n* 位运算符\n* 集合运算符\n\n#### 2.2.1 算术运算符\n\n它也可以对数值型数据执行算术操作。下表列出了算术运算符。\n\n\
  | 算术运算符 | 说明 |\n| :--- | :--- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n\
  | % | 取模 |\n\n#### 2.2.2 逻辑运算符\n\n它给出真或假的结果。下表列出了逻辑运算符。\n\n| 逻辑运算符 | 说明 |\n| :---\
  \ | :--- |\n| AND | 如果两个表达式都为真则为真 |\n| IN | 如果操作数等于列表中的任何一个则为真 |\n| OR | 如果任意一个为真则为真\
  \ |\n| NOT | 取反逻辑 |\n| LIKE | 如果操作数匹配模式 |\n| BETWEEN | 如果操作数在范围内 |\n\n#### 2.2.3\
  \ 比较运算符\n\n它是关系性的，比较表中的值。下表列出了比较运算符。\n\n| 比较运算符 | 说明 |\n| :--- | :--- |\n| = | 等于\
  \ |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n| <> | 不等于 |\n\n####\
  \ 2.2.4 位运算符\n\n它将整数转换为二进制，对每个位执行 AND、OR 和 NOT 操作。下表列出了位运算符。\n\n| 位运算符 | 说明 |\n\
  | :--- | :--- |\n| AND | 如果两个位都为 1 |\n| OR | 如果任意一位为 1 |\n| NOT | 取反 |\n\n#### 2.2.5\
  \ 集合运算符\n\n集合运算符用于合并两个或多个表的行。下表列出了集合运算符。\n\n| 集合运算符 | 说明 |\n| :--- | :--- |\n| UNION\
  \ | 不包含重复值的结果集合并 |\n| UNION ALL | 包含重复值的结果集合并 |\n| INTERSECT | 仅包含两个集合共有的值 |\n|\
  \ EXCEPT | 包含第一个集合不在第二个集合中的结果 |\n\n# 第 3 章：数据定义语言 (DDL)\n\n在上一章中我们看到了 MySQL 的语法，包括\
  \ MySQL 中的数据类型和运算符，现在我们将学习 MySQL 中的完整性约束，然后学习使用 DDL 命令创建表。\n\n## 3.1 MySQL 中的完整性约束\n\
  \n完整性约束是表数据或列必须遵循的规则。我们可以在列级或表级使用约束约束。表级约束适用于整个表，而列级约束仅适用于列。表显示了 MySQL 中使用的完整性约束。\n\
  \n| 完整性约束 | 说明 |\n| :--- | :--- |\n| NOT NULL | 防止列出现空值 |\n| DEFAULT | 当列没有定义值时，DEFAULT\
  \ 约束提供默认值 |\n| UNIQUE | 确保列中的任何值都是唯一的 |\n| PRIMARY KEY | 唯一标识每行/记录 |\n| FOREIGN\
  \ KEY | 唯一识别任何数据库表中的行/记录 |\n\n## 3.2 MySQL DDL 简介\n\nMySQL DDL 语句用于定义和操作数据库结构。它允许我们使用命令创建、修改和维护数据库。\n\
  \n以下是 DDL 命令：\n\n* `CREATE` - 用于创建表和模式。\n* `ALTER` - 用于从数据库表中添加、修改或删除列或约束。\n* `TRUNCATE`\
  \ - 用于删除表中的数据，但不会删除表本身。\n* `DROP` – 用于删除整个表。\n* `RENAME` – 用于重命名表。\n\n#### 3.2.1\
  \ CREATE 命令\n\n\n\n\n\n# MySQL 允许我们使用 `CREATE` 命令创建数据库表。让我们创建一个员工表。如果我们在 MySQL Workbench\
  \ 中按如下所示执行语句序列，就可以创建一个员工表。\n\n```sql\nCREATE TABLE employees (\n  employee_id INT,\n\
  \  first_name VARCHAR (50),\n  last_name VARCHAR (50),\n  hourly_pay DECIMAL (5,2),\n\
  \  hire_date DATE\n);\n```\n\n我将向你展示如何在 MySQL 中创建一些表。关系型数据库中的表由行和列组成，类似于 Excel 表格。在本主题中，我们将创建表和列。\n\
  \n只需输入 `CREATE TABLE` 然后跟上表名，我将创建一个名为 `employees` 的表，然后在末尾添加一组括号和分号；在括号内部，我们将列出\
  \ `employees` 的列，例如 `employee_id`、`first_name`、`hourly_pay` 和 `hire_date`。现在，我们需要为每个列设置要在该列中存储的数据类型。\n\
  \n让我们为每一列设置数据类型：\n- `Employee_id INT` – 数据将为整数\n- `First_name VARCHAR (50)` –最多\
  \ 50 个字符的序列\n- `Last_name VARCHAR (50)` –最多 50 个字符的序列\n- `Hourly_pay Decimal (5,2)`\
  \ – 小数前最多 5 位，后 2 位 (99999.99)\n- `Hire_data DATE` – 日期格式 (dd-mm-yyyy)\n\n如果你需要查询表，请输入：\n\
  **语法：** `SELECT * FROM table name;`\n**实现：** `SELECT * FROM employees;`\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| | | | | |\n\n我们已成功创建了一个包含五列的员工表。\n\n#### 3.2.2 `RENAME` 命令\n\n如果我们需要重命名上面的表，请输入：\n\
  **语法：** `RENAME TABLE original name TO new name;`\n**实现：** `RENAME TABLE employees\
  \ TO workers;`\n\n在 MYSQL workbench 中执行并获取结果。\n\n#### 3.2.3 `DROP` 命令\n\n如果我们需要删除上面的表，请输入：\n\
  **语法：** `DROP TABLE name of table;`\n**实现：** `DROP TABLE employees;`\n\n在 MYSQL\
  \ workbench 中执行并获取结果。\n\n#### 3.2.4 `ALTER` 命令\n\n如果我们需要修改表，让我们添加新列 `phone_number`，输入：\n\
  ```sql\nALTER TABLE employees\nADD phone_number VARCHAR (15);\n```\n在 MYSQL workbench\
  \ 中执行并获取结果。\n\n将 `phone_number` 重命名为 `email`，输入：\n```sql\nALTER TABLE employees\n\
  RENAME COLUMN phone_number to email;\n```\n在 MYSQL workbench 中执行并获取结果。\n\n让我们为 `email`\
  \ 列添加数据类型，这里我们必须使用 `MODIFY` 命令，输入：\n```sql\nALTER TABLE employees\nMODIFY COLUMN\
  \ email VARCHAR (100);\n```\n在 MYSQL workbench 中执行并获取结果。\n\n在 `last_name` 之后添加 `email`，输入：\n\
  ```sql\nALTER TABLE employees\nMODIFY email VARCHAR (100)\nAFTER last_name;\n```\n\
  在 MYSQL workbench 中执行并获取结果。\n\n让我们删除 `email` 列，输入：\n```sql\nALTER TABLE employees\n\
  DROP COLUMN email;\n```\n在 MYSQL workbench 中执行并获取结果。\n\n# 第 4 章：数据操语言 (DML)\n\n\
  ## 4.1 MySQL DML 简介\n\nMySQL DML 处理数据库表中数据的修改。DML 语句用于向数据库中添加（插入）、删除和修改（更新）数据。\n\
  \n以下是 DML 命令：\n- `INSERT` – 用于手动向表中添加行。\n- `SELECT` – 我们可以使用 `Select` 命令访问和操作数据。\n\
  - `DELETE` – 可以使用 `Delete` 命令删除现有表的行。\n- `UPDATE` - 用于更改表中的实际数据。\n\n## 4.2 DML 命令执行\n\
  \n在上一章节中，我们创建了一个 `employees` 表，现在让我们使用 DML 命令操作该表。\n\n### 4.2.1 `INSERT` 命令\n\n\
  在本主题中，我将讨论如何向表中插入行。我们有一个名为 `employees` 的表。我将从我的 `employees` 表中选择所有内容。\n\n```sql\n\
  SELECT * FROM employees;\n```\n\n| employee_id | first_name | last_name | hourly_pay\
  \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| | | | | |\n\n让我们使用 `INSERT`\
  \ 命令插入一行数据。要向表中插入行，我们将输入 `INSERT INTO` 后跟上表名，然后是 `VALUES` 括号和分号；在这组括号之间，我们将添加该行的所有数据。我们将按照从\
  \ `employee_id`、`first_name`、`last_name` 等开始的顺序进行操作，但我们必须注意数据类型。每条数据之间将用逗号分隔。\n\n\
  在 `Employees` 表中插入一行数据：\n```sql\nINSERT INTO employees\nVALUES (1, \"Eugene\", \"\
  Krabs\", 25.50, \"2023-01-02\");\n```\n\n现在我们可以执行这些语句并获得如下所示的结果。\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n\n让我们一次插入多行，MySQL 允许如下通过逗号添加另一组括号：\n\
  ```sql\nINSERT INTO employees\nVALUES (2, \"Squidward\", \"Tentacles\", 15.00, \"\
  2023-01-03\"),\n(3, \"Spongebob\", \"Squarepants\", 12.50, \"2023-01-04\"),\n(4,\
  \ \"Patrick\", \"Star\", 12.50, \"2023-01-05\"),\n(5, \"Sandy\", \"Cheeks\", 17.25,\
  \ \"2023-01-06\");\n```\n执行：\n```sql\nSELECT * FROM employees;\n```\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n\n### 4.2.2 `SELECT` 命令\n\n在本节中，我们将讨论如何在表中选择数据。要选择 `employees` 表中的整个行和列：\n\
  ```sql\nSELECT * FROM employees;\n```\n有时你可能不需要所有数据。我们可以选择特定的列。检索 `employees` 的全名：\n\
  ```sql\nSELECT first_name, last_name FROM employees;\n```\n| first_name | last_name\
  \ |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward | Tentacles |\n| Spongebob\
  \ | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks |\n\n我们还可以更改列的顺序：\n```sql\n\
  SELECT last_name, first_name FROM employees;\n```\n如果我们正在寻找某些内容，有一个 `WHERE` 子句。从\
  \ `employees` 中选择 `employee_id` 等于 1 的：\n```sql\nSELECT * FROM employees\nWHERE\
  \ employee_id = 1;\n```\n这将给我们一个 ID 为 1 的特定员工。同样，我们可以引用任何列及其对应的数据，如 `first_name`、`last_name`\
  \ 等。我们还可以在 `WHERE` 子句中使用比较运算符。找到所有时薪大于或等于 15 的员工：\n```sql\nSELECT * FROM employees\n\
  WHERE hourly_pay >= 15;\n```\n\n| employee_id | first_name | last_name | hourly_pay\
  \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50\
  \ | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 5 | Sandy\
  \ | Cheeks | 17.25 | 2023-01-06 |\n\n我们还可以向 `WHERE` 子句添加完整性约束。`NULL` 表示没有数据，让我们显示每个有入职日的员工数据：\n\
  ```sql\nSELECT * FROM employees\nWHERE hire_date IS NOT NULL;\n```\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n\n### 4.2.3 `UPDATE` 命令\n\n在本节中，我们将讨论如何从表中更新数据。在我们的表中，`employee_id` 6 缺少了一些数据。\n\
  \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
  \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04\
  \ |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 |\
  \ 2023-01-06 |\n| 6 | Sheldon | Plankton | | |\n\n\n\n\n\n# 让我们更新单列 `hourly_pay\
  \ = 10.25` 类型\n\n```sql\nUPDATE employees\nSET hourly_pay = 10.25\nWHERE employee_id\
  \ = 6;\n```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n# 让我们更新多列\
  \ `hourly_pay` 和 `hire_date` 类型\n\n```sql\nUPDATE employees\nSET hourly_pay = 10.25,\n\
  \    hire_date = \"2023-01-07\"\nWHERE employee_id = 6;\n```\n\n### 输出\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n# 我们可以更新列中的所有行。\n\n# 让我们更新所有员工的\
  \ `hourly_pay = 10.25` 类型\n\n```sql\nUPDATE employees\nSET hourly_pay = 10.25;\n\
  ```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 10.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n# 我们也可以在\
  \ `UPDATE` 命令中使用完整性约束\n\n# 让我们将某个字段设置为 `NULL`（表示无值），如上面的示例所示，Sheldon Plankton 的\
  \ `hire_date` 是空的\n\n```sql\nUPDATE employees\nSET hire_date = NULL\nWHERE employee_id\
  \ = 6;\n```\n\n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants\
  \ | 10.25 | 2023-01-04 |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy\
  \ | Cheeks | 10.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | |\n\n注意：Plankton\
  \ 的 `hire_date` 现在是 `NULL`。\n\n### 4.2.4 `DELETE` 命令\n\n# 要删除 `employees` 表中的所有行，输入\n\
  \n```sql\nDELETE FROM employees;\n```\n\n注意：小心！表中的整行将被删除。\n\n# 要删除 `employees` 表中的第\
  \ 6 行，输入\n\n```sql\nDELETE FROM employees\nWHERE employee_id = 6;\n```\n\n### 输出\n\
  \n| employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 10.25 | 2023-01-02 |\n| 2 | Squidward\
  \ | Tentacles | 10.25 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 10.25 | 2023-01-04\
  \ |\n| 4 | Patrick | Star | 10.25 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 10.25 |\
  \ 2023-01-06 |\n\n# 第 5 章：数据控制语言 (DCL)\n\n## 5.1 MySQL DCL 简介\n\nMySQL DCL 用于对对象实现安全性。`GRANT`\
  \ 命令授予访问权限，`REVOKE` 命令用于移除之前授予的权限。\n\nMySQL 中的主要 DCL 命令包括：\n- `GRANT`：允许用户执行特定任务。\n\
  - `REVOKE`：移除权限。\n\n## 5.2 DCL 执行\n\n我们通过授予权限来控制数据库。DCL 让我们能够对创建的数据库实现安全性。\n\n###\
  \ 5.2.1 `GRANT` 命令\n\n我们已经创建了数据库（`employees` 表），使用 `GRANT` 命令为新用户（`user1`）授予权限。转到\
  \ MySQL Workbench，点击连接，进入服务器的“Users and Privileges”（用户和权限）。在“Users and Privileges”部分，我们已经创建了用户，现在我们将添加一个账户，输入\
  \ `user_1` 和密码 `12345`，确认并应用。\n\n现在转到 MySQL Workbench 的主页，点击数据库，连接数据库，输入 `User_1`\
  \ 和密码 `12345`，会出现一个空白屏幕。因为没有给用户访问权限，我们必须关闭此应用并进入已创建的数据库（`hr_emp`）。输入 Grant 命令：\n\
  \n```sql\nUSE hr_emp;\nGRANT SELECT, INSERT, DELETE ON hr_emp TO \"User_1\";\n```\n\
  \n执行语句序列：\n\n```sql\nUSE hr_emp;\nGRANT SELECT ON TO \"User_1\";\n```\n\n现在注销 MySQL\
  \ Workbench，使用 `User_1` 和密码 `12345` 重新登录，`User_1` 获取了员工数据的访问，输入：\n\n```sql\nUSE\
  \ hr_emp;\nSELECT * FROM employees;\n```\n\n### 输出\n\n| employee_id | first_name\
  \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00\
  \ | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick\
  \ | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n|\
  \ 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n注意：新用户（`User_1`）拥有访问、插入和删除数据库中数据的权限。\n\
  \n### 5.2.2 `REVOKE` 命令\n\n让我们移除向 `employees` 表插入数据的权限，登录根数据库，按 `ctrl+V` 并输入：\n\n\
  ```sql\nUSE hr_emp;\nREVOKE INSERT ON employees FROM 'User_1';\n```\n\n执行并获取结果：`INSERT`\
  \ 命令的用户访问权限已成功移除。\n\n注意：现在新用户（`User_1`）无法在数据库（`employees` 表）中插入数据。\n\n# 第 6 章：事务控制语言\
  \ (TCL)\n\n## 6.1 MySQL TCL 简介\n\nMySQL TCL 是 SQL 命令的子集，用于管理数据库中的事务。它允许我们回滚事务期间对数据库进行的更改。\n\
  \n以下是 MySQL TCL 的应用：\n1. **提交事务 (Committing Transactions)**：TCL 允许保存数据库中的更改。\n2.\
  \ **回滚事务 (Rolling Back Transactions)**：TCL 用于撤销事务期间的更改，并将数据库恢复到之前的状态。\n3. **设置事务隔离级别\
  \ (Setting Transaction Isolation Levels)**：TCL 用于设置事务隔离级别。我们可以确定并发和一致性的水平。\n4. **保存点\
  \ (Savepoints)**：TCL 允许在事务内部设置保存点，以便需要时进行部分回滚。\n5. **在存储过程中管理事务 (Managing Transactions\
  \ in Stored Procedures)**：我们可以在过程范围内管理事务。\n\n## 6.2 TCL 命令执行\n\n在本节中我们将解释自动提交（auto\
  \ commit）、`commit`（提交）和 `rollback`（回滚）。自动提交是默认模式，当你在 MySQL 中执行事务时，只要自动提交开启，该事务就会被保存。如果我们创建一个事务并需要撤销它怎么办？例如如果我们小心删除了表中的所有行。\n\
  \n以我们已经创建的 `employees` 表为例，我由于忘记添加 `WHERE` 子句而删除了所有行，现在所有行都消失了，如何撤销这些更改，输入：\n\n\
  ```sql\nDELETE FROM employees;\n```\n\n要撤销，请按照以下步骤操作：\n\n```sql\nSET AUTOCOMMIT\
  \ = OFF;\n```\n\n现在，事务不会自动保存，我们需要手动保存每个事务，输入：\n\n```sql\nCOMMIT;\n```\n\n执行它。现在我要选择我的表，输入：\n\
  \n```sql\nSELECT * FROM employees;\n```\n\n现在如果我删除行并撤销更改，输入：\n\n```sql\nROLLBACK\n\
  ```\n\n这将我的当前事务恢复到我们使用 `commit` 的之前的保存点，输入：\n\n```sql\nSELECT * FROM employees;\n\
  ```\n\n我们的表恢复到了原来的样子。\n\n\n\n\n\n# 注意：如果我们想保存更改，请使用 `COMMIT` 命令。\n\n# 第 7 章：数据查询语言\
  \ (DQL)\n\n## 7.1 MySQL DQL 简介\n\nMySQL 中的 `DQL` 是 SQL 子语言基础分组的一部分。它被用于向数据库架构发送查询。它提供了使用\
  \ `SELECT` 命令的最大灵活性，可以根据用户需求从数据库中检索信息。我们将详细讨论 `SELECT` 命令。\n\n当针对表执行 `SELECT` 语句时，结果将根据要求编译成进一步的临时表。\n\
  \n只有在创建表并插入值后，我们才能使用 `SELECT` 命令。让我们以已经创建的 employees 表举例。\n\n### 7.1.1 语法 1\n\n\
  ```sql\nSELECT * FROM table_name;\n```\n\n实现：从 employees 表中检索所有信息。\n\n```sql\nSELECT\
  \ * FROM employees;\n```\n\n执行并获取结果\n\n| employee_id | first_name | last_name |\
  \ hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene |\
  \ Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03\
  \ |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star\
  \ | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon\
  \ | Plankton | 10.25 | 2023-01-07 |\n\n### 7.1.2 语法 2\n\n```sql\nSELECT Col1, Col2,….\
  \ FROM table_name;\n```\n\n实现：检索表的特定列。\n\n```sql\nSELECT employee_id, first_name,\
  \ last_name FROM employees;\n```\n\n执行并获取结果\n\n| employee_id | first_name | last_name\
  \ |\n| :--- | :--- | :--- |\n| 1 | Eugene | Krabs |\n| 2 | Squidward | Tentacles\
  \ |\n| 3 | Spongebob | Squarepants |\n| 4 | Patrick | Star |\n| 5 | Sandy | Cheeks\
  \ |\n| 6 | Sheldon | Plankton |\n\n注意：列的顺序将由用户决定。\n\n### 7.1.3 语法 3\n\n```sql\n\
  SELECT * FROM table_name WHERE condition;\n```\n\n实现：它将检索所有与 `WHERE` 子句相关的数据行。\n\
  \n```sql\nSELECT * FROM employees WHERE employee_id< 4;\n```\n\n执行并获取结果\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  \n注意：`WHERE` 子句用于根据条件过滤行。\n\n### 7.1.4 语法 4\n\n```sql\nSELECT col1, col2, …… FROM\
  \ table_name WHERE condition;\n```\n\n实现：这里将根据 `WHERE` 子句检索员工的 `first_name`、`last_name`\
  \ 和 `hourly_pay`。\n\n```sql\nSELECT first_name, last_name, hourly_pay FROM employees\
  \ WHERE hourly_pay<15;\n```\n\n执行并获取结果\n\n| first_name | Last_name | hourly_pay\
  \ |\n| :--- | :--- | :--- |\n| Spongebob | Squarepants | 12.50 |\n| Patrick | Star\
  \ | 12.50 |\n| Sheldon | Plankton | 10.25 |\n\n## 7.2 使用 MySQL 获取当前日期和时间\n\n让我们创建一个临时演示表，输入：\n\
  \n```sql\nCREATE TABLE demo(\n    my_date DATE,\n    my_time TIME,\n    my_datetime\
  \ DATETIME\n);\n```\n\n执行它，我们成功创建了一个包含三个列的表——`my_date`、`my_time`、`my_datetime`。\n\
  \n如果我们想获取当前日期，我们需要创建一个时间戳。\n\n向 `DEMO` 表插入数据，输入：\n\n```sql\nINSERT INTO demo\nVALUE(CURRENT_DATE(),\
  \ CURRENT_TIME(), NOW());\n\nSELECT * FROM demo;\n```\n\n执行它并获取当前日期和时间。\n\n| my_date\
  \ | my_time | my_datetime |\n| :--- | :--- | :--- |\n| 2024-07-23 | 07:27:58 | 2024-07-23\
  \ 07:27:58 |\n\n在当前日期基础上加一天，输入：\n\n```sql\nINSERT INTO demo\nVALUES(CURRENT_DATE()\
  \ + 1, NULL, NULL)\n\nSELECT * FROM demo;\n```\n\n执行并获取结果\n\n| my_date | my_time\
  \ | my_datetime |\n| :--- | :--- | :--- |\n| 2024-07-23 | 07:27:58 | 2024-07-23\
  \ 07:27:58 |\n| 2024-07-24 | | |\n\n注意：这里 time 和 datetime 设置为 `NULL`。\n\n# 第 8 章：约束的作用\n\
  \n在本节中我们将讨论 MySQL 中的约束。\n\n## 8.1 UNIQUE 约束\n\n`UNIQUE` 约束确保列中的值是不同的。\n\n```sql\n\
  CREATE TABLE products (\n    product_id INT,\n    product_name VARCHAR(25),\n  \
  \  price DECIMAL(4,2)\n);\n```\n\n如果我们两次插入相同的 `product_name`，将会发生错误。可以使用以下命令添加：\n\
  \n```sql\nALTER TABLE products ADD UNIQUE (product_name);\n```\n\n## 8.2 NOT NULL\
  \ 约束\n\n`NOT NULL` 约束确保列不能为 `NULL` 值\n\n## 8.3 CHECK 约束\n\n`CHECK` 约束用于限制列的值范围。\n\
  \n```sql\nCREATE TABLE employees (\n    employee_id INT,\n    first_name VARCHAR(50),\n\
  \    last_name VARCHAR(50),\n    hourly_pay DECIMAL(5,2),\n    hire_date DATE,\n\
  \    CONSTRAINT chk_hourly_pay CHECK (hourly_pay >= 10.00)\n);\n```\n\n如果薪水小于 10，则违反约束。要删除它：\n\
  \n```sql\nALTER TABLE employees DROP CHECK chk_hourly_pay;\n```\n\n## 8.4 DEFAULT\
  \ 约束\n\n`DEFAULT` 在未指定值时为列提供默认值。\n\n```sql\nCREATE TABLE products (\n    product_id\
  \ INT,\n    product_name VARCHAR(25),\n    price DECIMAL(4,2) DEFAULT 0\n);\n```\n\
  \n## 8.5 PRIMARY KEY 约束\n\n`PRIMARY KEY` 是 `UNIQUE` 和 `NOT NULL` 的组合。一个表只能有一个主键。\n\
  \n```sql\nCREATE TABLE transactions(\n    transaction_id INT PRIMARY KEY,\n    amount\
  \ DECIMAL(5,2)\n);\n```\n\n向现有表添加它：\n\n```sql\nALTER TABLE products ADD PRIMARY\
  \ KEY (transaction_id);\n```\n\n## 8.6 MYSQL 中的自动递增属性\n\n\n\n\n\n# `auto increment`\
  \ 属性可以应用于设置为键的列，每当我们插入一条新行时，我们的主键就会自动填充，然后随后的每一行都会自动递增。\n\n# 让我们删除事务表并带有自动递增功能重新创建，输入：\n\
  \n```sql\nCREATE TABLE transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n\
  \  amount DECIMAL (5,2)\n);\n```\n\n注意：默认情况下，`auto increment` 将设置为 `1`。\n\n# 让我们在\
  \ transactions 表中插入一些值，不需要插入 `transaction_id`，它将被自动分配。\n\n```sql\nINSERT INTO transactions\
  \ (amount)\nVALUES (2.56);\nSELECT * FROM transactions;\n```\n\n| transaction_id\
  \ | amount |\n| :--- | :--- |\n| 1 | 2.56 |\n\n注意：这里 `transaction_id` 是自动插入的。\n\n\
  # 我们可以设置主键从不同的值开始，输入：\n\n```sql\nALTER TABLE transactions\nAUTO_INCREMENT = 1000;\n\
  ```\n\n执行并获取结果，transaction ID 从 `1000` 开始设置。我们必须删除整个行并插入新值。\n\n## 8.7 FOREIGN KEY\
  \ 约束\n\n外键是一个表中的 `PRIMARY KEY`，可以通过 `foreign key` 在另一个表中找到，我们可以在两个表之间建立链接。在我们的事务表中，这样做这样做有两个主要优点：如果我想查看发起此交易的客户\
  \ ID，我可以引用 `customers` 表，然后找到该客户的姓和名。\n\n# 让我们创建事务和客户表，使用外键建立它们之间的链接\n\n# 我将创建一个新的客户表，输入：\n\
  \n```sql\nCREATE TABLE customers (\n  customer_id INT PRIMARY KEY AUTO_INCREMENT,\n\
  \  first_name VARCHAR (50),\n  last_name VARCHAR (50)\n);\n```\n\n执行并获取结果\n\n# 现在向表中插入一些值，输入：\n\
  \n```sql\nINSERT INTO customers (first_name, last_name)\nVALUES (“Fred”, “Fish”),\n\
  (“Larry”, “Lobster”),\n(“Bubble”, “Bass”\n\nSELECT * FROM customers;\n```\n\n| customer_id\
  \ | first_name | last_name |\n| :--- | :--- | :--- |\n| 1 | Fred | Fish |\n| 2 |\
  \ Larry | Lobster |\n| 3 | Bubble | Bass |\n\n# 现在我们将通过 `ID` 在我们的 `customers` 表和\
  \ `transactions` 表之间建立链接。让我们创建一个带有 `FOREIGN KEY` 约束的 `transactions` 表，输入：\n\n```sql\n\
  CREATE TABLE transactions (\n  transaction_id INT PRIMARY KEY AUTO_INCREMENT,\n\
  \  amount DECIMAL (5,2),\n  customer_id INT,\n  FOREIGN KEY (customer_id) REFERENCES\
  \ customers(customer_id)\n);\n```\n\n执行并获取结果\n\n注意：这里 `customer_id` 列是 `FOREIGN\
  \ KEY`。\n\n使用外键两个表之间的链接所示所示：\n\n| transaction_id | amount | customer_id | first_name\
  \ | last_name |\n| :--- | :--- | :--- | :--- | :--- |\n| 1000 | 4.89 | 2 | Larry\
  \ | Lobster |\n| 1001 | 2.68 | 3 | Bubble | Bass |\n| 1002 | 3.32 | 1 | Fred | Fish\
  \ |\n| 1003 | 4.99 | 3 | Bubble | Bass |\n\n## 8.8 JOIN 子句\n\n`JOIN` 是一个用于根据表与表之间的相关列（例如外键）合并两个或多个表的行的子句。让我们连接之前创建的表。我们有两个表：`transaction`\
  \ 表和 `customers` 表。\n\n| transaction_id | amount | customer_id |\n| :--- | :---\
  \ | :--- |\n| 1000 | 4.89 | 2 |\n| 1001 | 2.68 | 3 |\n| 1002 | 3.32 | 1 |\n| 1003\
  \ | 4.99 | 3 |\n\n| customer_id | first_name | last_name |\n| :--- | :--- | :---\
  \ |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n# 让我们内连接两个表，输入：\n\
  \n```sql\nSELECT *\nFROM transactions\nINNER JOIN customers ON transactions.customer_id\
  \ = customers.customer_id;\n```\n\n执行并获取结果\n\n| transaction_id | amount | customer_id\
  \ | first_name | last_name |\n| :--- | :--- | :--- | :--- | :--- |\n| 1000 | 4.89\
  \ | 2 | Larry | Lobster |\n| 1001 | 2.68 | 3 | Bubble | Bass |\n| 1002 | 3.32 |\
  \ 1 | Fred | Fish |\n| 1003 | 4.99 | 3 | Bubble | Bass |\n\n# 第 9 章：MySQL 中的函数和逻辑运算符\n\
  \n## 9.1 MySQL 中的函数\n\n一种接受用户参数并返回值的存储程序称为 `Function`。`MySQL` 提供了许多函数。其中一些显示所示。\n\
  \n# 让我们统计 `transaction` 表 `amount` 列的行数，输入：\n\n```sql\nSELECT COUNT(amount)\nFROM\
  \ transaction;\n```\n\n执行并获取结果\n\n# 查找 `amount` 列中的最大值，输入：\n\n```sql\nSELECT MAX(amount)\
  \ AS maximum\nFROM transaction;\n```\n\n注意：这里列名将变为 “maximum”。\n\n# 查找 `amount` 列中的最小值，输入：\n\
  \n```sql\nSELECT MIN(amount) AS minimum\nFROM transaction;\n```\n\n执行并获取结果\n\n#\
  \ 查找 `amount` 列的平均值，输入：\n\n```sql\nSELECT AVG(amount) AS average\nFROM transaction;\n\
  ```\n\n执行并获取结果\n\n# 查找 `amount` 列的总和，输入：\n\n```sql\nSELECT SUM(amount) AS sum\n\
  FROM transaction;\n```\n\n执行并获取结果\n\n# 拼接 `employees` 的姓和名，输入：\n\n```sql\nSELECT\
  \ CONCAT(first_name, last_name) AS full_name\nFROM employees;\n```\n\n执行并获取结果\n\n\
  注意：这里我解释了 `MySQL` 中的函数的用法。\n\n## 9.2 MySQL 中的逻辑运算符\n\n`Logical operator` 是一个用于组合多个条件的关键字。让我们使用\
  \ `employees` 表来演示逻辑运算符。\n\n```sql\nSELECT * FROM employees;\n```\n\n| employee_id\
  \ | first_name | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06\
  \ |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n### 9.2.1 AND 运算符\n\n```sql\n\
  SELECT *\nFROM employees\nWHERE hire_date<“2023-01-06” AND hourly_pay<15;\n```\n\
  \n它将返回符合这些标准的结果。\n\n| employee_id | first_name | last_name | hourly_pay | hire_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 3 | Spongebob | Squarepants | 12.50\
  \ | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n\n### 9.2.2 OR 运算符\n\
  \n```sql\nSELECT *\nFROM employees\nWHERE hire_date<“2023-01-06” OR hourly_pay<15;\n\
  ```\n\n它将返回符合这些标准之一的结果。\n\n| employee_id | first_name | last_name | hourly_pay |\
  \ hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50\
  \ | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n### 9.2.3\
  \ NOT 运算符\n\n```sql\nSELECT *\nFROM employees\nWHERE NOT hourly_pay = 12.50;\n```\n\
  \n这里，`NOT` 基本上反转了你说的任何。\n\n| employee_id | first_name | last_name | hourly_pay |\
  \ hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50\
  \ | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n### 9.2.4\
  \ Between 运算符\n\n```sql\nSELECT *\nFROM employees\nWHERE hire_date BETWEEN “2023-01-04”\
  \ AND “2023-01-07”;\n```\n\n根据标准执行并获取结果。\n\n| employee_id | first_name | last_name\
  \ | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 3 | Spongebob\
  \ | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05\
  \ |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25\
  \ | 2023-01-07 |\n\n### 9.2.5 IN 运算符\n\n```sql\nSELECT *\nFROM employees\nWHERE\
  \ hourly_pay IN (17.25,10.25);\n```\n\n我们可以找到集合中的任何值。\n\n| employee_id | first_name\
  \ | last_name | hourly_pay | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 |\
  \ 2023-01-07 |\n\n# 第 10 章：一些重要的 MySQL 命令\n\n# 在本节中，我们将讨论用于 MySQL 中处理数据库或架构对象的一些重要子句。\n\
  \n## 10.1 通配符\n\n通配符是一种用于处理数据库的特殊字符。有两种通配符——百分号和下划线。\n\n# 让我们在 `employees` 表中使用\
  \ `%` 来检索以 S 开头的姓名，输入：\n\n```sql\nSELECT * FROM employees\nWHERE first_name LIKE\
  \ “s%”;\n```\n\n执行并获取结果\n\n\n\n\n\n| employee_id | first_name | last_name | hourly_pay\
  \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 2 | Squidward | Tentacles\
  \ | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04 |\n\
  | 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 |\
  \ 2023-01-07 |\n\n## 让我们从 employees 表中查找 1 月份入职的员工，输入\n\n```sql\nSELECT * FROM employees\n\
  WHERE hire_date LIKE “____-01-__”;\n```\n\n注意：年份使用四个下划线，月份使用两个下划线。\n\n### 输出\n\n\
  | employee_id | first_name | last_name | hourly_pay | hire_date |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02 |\n| 2 | Squidward\
  \ | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob | Squarepants | 12.50 | 2023-01-04\
  \ |\n| 4 | Patrick | Star | 12.50 | 2023-01-05 |\n| 5 | Sandy | Cheeks | 17.25 |\
  \ 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25 | 2023-01-07 |\n\n## 10.2 Order\
  \ by 子句\n\n`ORDER BY` 子句根据我们列出的列按升序或降序对查询结果进行排序。\n\n### 让我们更改 employees 表中姓名的顺序，输入\n\
  \n```sql\nSELECT * FROM employees\nORDER BY first_name DESC;\n```\n\n执行并获取结果：\n\n\
  ```sql\nSELECT * FROM employees\nORDER BY first_name ASC;\n```\n\n执行并获取结果。\n\n##\
  \ 10.3 Limit 子句\n\n`LIMIT` 子句用于限制记录数。如果你正在处理大型数据库，它将非常有用。\n\n### 让我们限制 employees\
  \ 表中显示的员工数量，输入\n\n```sql\nSELECT * FROM employees\nLIMIT 2;\n```\n\n注意：仅显示前两个员工的详细信息。\n\
  \n### 输出\n\n| employee_id | first_name | last_name | hourly_pay | hire_date |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50 | 2023-01-02\
  \ |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n\n## 10.4 Union 运算符\n\n\
  `UNION` 运算符合并两个或多个 select 语句的结果。\n\n### 让我们合并两个表（Employees 表和 Customers 表）的 `first_name`\
  \ 和 `last_name`。\n\n#### Employees 表\n| employee_id | first_name | last_name | hourly_pay\
  \ | hire_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | Eugene | Krabs | 25.50\
  \ | 2023-01-02 |\n| 2 | Squidward | Tentacles | 15.00 | 2023-01-03 |\n| 3 | Spongebob\
  \ | Squarepants | 12.50 | 2023-01-04 |\n| 4 | Patrick | Star | 12.50 | 2023-01-05\
  \ |\n| 5 | Sandy | Cheeks | 17.25 | 2023-01-06 |\n| 6 | Sheldon | Plankton | 10.25\
  \ | 2023-01-07 |\n\n#### Customers 表\n| customer_id | first_name | last_name |\n\
  | :--- | :--- | :--- |\n| 1 | Fred | Fish |\n| 2 | Larry | Lobster |\n| 3 | Bubble\
  \ | Bass |\n\n### 使用 `UNION` 进行合并，输入\n\n```sql\nSELECT first_name, last_name FROM\
  \ employees\nUNION\nSELECT first_name, last_name FROM customers\n```\n\n### 输出\n\
  | first_name | last_name |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward | Tentacles\
  \ |\n| Spongebob | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks |\n| Sheldon\
  \ | Plankton |\n| Fred | Fish |\n| Larry | Lobster |\n| Bubble | Bass |\n\n注意：如果我们想合并重复值，请使用\
  \ `UNION ALL` 而不是 `UNION`。\n\n## 10.5 MySQL 中的视图\n\n我们可以使用 MySQL 中的 `VIEWS` 创建一个虚拟表。视图中的字段是数据库中一个或多个真实表中的字段。\n\
  \n### 让我们将 employees 表显示为 `employees_attendance` 表，输入\n\n```sql\nCREATE employees_attendance\
  \ AS\nSELECT first_name, last_name\nFROM employees;\n```\n\n输出：\n| first_name |\
  \ last_name |\n| :--- | :--- |\n| Eugene | Krabs |\n| Squidward | Tentacles |\n\
  | Spongebob | Squarepants |\n| Patrick | Star |\n| Sandy | Cheeks |\n| Sheldon |\
  \ Plankton |\n\n## 10.6 MySQL 中的索引\n\n索引用于快速查找列中的值。通常在列上创建。\n\n#### Customer 表\n\
  | customer_id | first_name | last_name |\n| :--- | :--- | :--- |\n| 1 | Fred | Fish\
  \ |\n| 2 | Larry | Lobster |\n| 3 | Bubble | Bass |\n\n### 让我们在 customers 表上创建一个名为索引，输入\n\
  \n```sql\nCREATE INDEX last_name ON customers(last_name);\n```\n\n执行并获取结果：\n如果我们按姓氏搜索：\n\
  \n```sql\nSELECT * FROM customers\nWHERE last_name = “Bass”;\n```\n\n## 10.7 子查询\n\
  \n查询内部的查询被称为子查询。\n\n### 让我们显示薪水等于平均值的员工姓名，输入\n\n```sql\nSELECT first_name, last_name,\
  \ (SELECT AVG(hourly_pay) FROM employees) AS avg_pay\nFROM employees;\n```\n\n执行并获取结果。\n\
  \n## 10.8 Group by 子句\n\n`GROUP BY` 子句按特定列对行进行分组，通常与聚合函数 `SUM()`、`MAX()`、`MIN()`、`COUNT()`\
  \ 等一起使用。\n\n#### Transaction 表\n| transaction_id | amount | order_date |\n| :---\
  \ | :--- | :--- |\n| 1000 | 4.89 | 2023-01-01 |\n| 1001 | 2.68 | 2023-01-01 |\n\
  | 1002 | 3.32 | 2023-01-02 |\n| 1003 | 4.99 | 2023-01-02 |\n\n### 让我们在 transactions\
  \ 表应用 group by 子句计算每日交易额，输入\n\n```sql\nSELECT SUM (amount), order_date\nFROM transactions\n\
  GROUP BY order_date;\n```\n\n输出：\n| SUM(amount) | order_date |\n| :--- | :--- |\n\
  | 7.57 | 2023-01-01 |\n| 8.31 | 2023-01-02 |\n\n## 10.9 Roll up 子句\n\n它是 `GROUP\
  \ BY` 子句的扩展，产生另一行并显示超级聚合值。\n\n### 让我们使用 `ROLLUP` 计算 transactions 表中的交易总额，输入\n\n\
  ```sql\nSELECT SUM (amount), order_date\nFROM transactions\nGROUP BY order_date\
  \ WITH ROLLUP;\n```\n\n输出：\n| SUM(amount) | order_date |\n| :--- | :--- |\n| 7.57\
  \ | 2023-01-01 |\n| 8.31 | 2023-01-02 |\n| 15.88 | |\n\n## 10.10 On delete 子句\n\n\
  `ON DELETE` 子句有两个版本：\n\n1. `ON DELETE SET NULL`\n2. `ON DELETE CASCADE`\n\n当外键被删除，我们可以将外键替换为值\
  \ 0。\n\n### 让我们以 customer 表为例，其中 customer id 是外键，因此要删除整个选定行，输入：\n\n```sql\nSET foreign_key_checks\
  \ = 0;\nDELETE FROM customers\nWHERE customer_id = 4;\nSELECT * FROM customers;\n\
  ```\n\n# 结束\n\n"
