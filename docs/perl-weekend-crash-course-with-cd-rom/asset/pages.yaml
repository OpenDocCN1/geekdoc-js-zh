    ![](img/407bedec2b2c349369b174a7f5fb6718_48_2.png)


    Before we go full speed into programming in Perl, it''s useful to learn a little
    about how the Perl interpreter works. The interpreter is the main engine that
    allows Perl programs to function, and when you installed Perl in the previous
    session, it was primarily the Perl interpreter that you installed. (You installed
    a few other things like well, but the interpreter is the most important thing.)
    The interpreter is a piece of software like any other. Its function is to translate
    the instructions that you write in your programs into binary instructions that
    your computer''s processor can understand.


    It may surprise you to learn that the Perl interpreter is not written in Perl.
    It is written in C. The reason for this is that C is a very good language for
    dealing with information at the binary level. Unlike Perl, C is a compiled language,
    which means that the raw programming instructions are converted to binary information,
    and then left in that form. The advantage of this is that binary information can
    be processed directly by the computer, and thus these types of programs run faster.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 24 Friday Evening


    than others. Perl, by contrast is an interpreted language, which means that the
    programming instructions must be converted to binary each time the program is
    run. This yields a slower program, but on the other hand, it is much easier to
    mod-ify such a program, because it needs not be recompiled each time it''s changed.


    Which is better? That depends on whom you ask. I know people who think that compiled
    languages are the only serious programming languages that exist, whereas others
    shudder whenever they have to use a compiler. In reality, there''s no pat answer
    to that question. By the construction of Perl itself shows, there are times when
    compiled languages are better for a certain job, and there are times when interpreted
    languages best fill the bill.


    # Invoking the Perl Interpreter


    At this point, the question may occur to you, “If the Perl interpreter is just
    a piece of software, can I simply run it?” The answer to this, perhaps surprisingly,
    is yes. At a shell prompt, type the following:


    ```

    joe@ika$ perl

    ```


    What happened? But you''ll notice that your shell prompt didn''t come back. The
    interpreter is running, but it has nothing to do. Now stop the inter-preter by
    hitting the Control key, and the C key at the same time (Ctrl+C). At this point,
    your prompt should come back. So now you know how to run the inter-preter, but
    you don''t know how to get it to do anything other than sit there idle.


    Now try this: your prompt, type


