    B+

    will match B, BB, and so on.


    The question mark (?) makes the character to its left optional. Thus

    AB?C


    will match ABC or AC.

    Finally, there is the general multiplier. The general multiplier uses a set of
    num-bers enclosed in curly braces (()) to indicate that the character immediately
    to the

    left should be repeated certain number of times. Thus


    ```

    B(2,4)

    ```


    will match B, BBB, BBBB. If the character on the right is omitted, it means

    that the maximum number of repeats is unlimited. Thus


    ```

    B(0, )

    ```


    is the same as

    B*


    If the comma is omitted, it means “exactly this many.” Thus


    ```

    B{10}

    ```


    will match only a string of ten Bs.


