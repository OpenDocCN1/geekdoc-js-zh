  md: '# Keeping Things Organized —Using Braces


    When you start getting into references, it''s easy for your code to become messy.
    This is more than just an aesthetic problem. Messy code is disorganised code.
    It''s harder to read, and harder to debug. The messier your code, the more likely
    it is that you will have serious problems with it.


    The solution to the messy code problem is to keep things organized. Perl lets
    you do this in various ways by using quotes and curly braces to block off particular
    parts of code.


    You saw earlier that you could combine a reference and a scalar variable like
    so: #/usr/bin/perl


    ```

    @list_1 = ("foo", "bar", "baz", "hejaz");

    $list_2 = ("wheel", "poit", "ptang");


    $ref_1 = \@list_1;

    $ref_2 = \@list_2;


    $listofrefs = ($ref_1, $ref_2);

    ```


    print "${$listofrefs[1][1]} \n";


    In the statement, the curly braces serve to keep the scalar part, $listofrefs[1]
    separate from the de-reference, {}[1]. Braces can be used this way in general.
    For example, the statement


    ```

    print \($var);

    ```


    is the same as


    ```

    print $var;

    ```


    This becomes useful if you have a variable name that could be confused with something
    else. Suppose that you have a variable called $shift. shift, which of course,
    is the name of a Perl native function, so using it as a variable name can get
    you into trouble because the interpreter considers that name to be a *reserved*
    word. You can get around this problem by referring to the variable as \($shift).
    (Although you really should just change the name of the variable.) If you really'
