    # Introduction to Web Programming


    +   Session Checklist

    - Reviewing HTML

    - Going beyond static HTML

    - Making the Web useful

    - Understanding the CGI


    programming for the Web has evolved along with the Web itself. Initially, the
    Web was a mass of static pages that would show every user the same content. As
    more people started using the Web and developers realized the importance of allowing
    the user to interact with sites, dynamic Web pages came into existence. Many of
    these dynamic pages use the Common Gateway Interface (CGI) to accomplish this.
    Session begins by reviewing the Hypertext Markup Language (HTML), the language
    that dictates the content of a Web page will be displayed.


    # A Quick HTML Refresher


    Hypertext Markup Language (HTML) is made up of a series of tags that are placed
    within the content of a document to define how it should be displayed to the user.'
