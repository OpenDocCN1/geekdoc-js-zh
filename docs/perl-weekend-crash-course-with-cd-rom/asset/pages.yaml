    ```


    This puts into $value the value in $query where the key is field_name.

    (param() function is used with CGI_pm to set as well as to retrieve data from
    the

    CGI object.


    This format for extracting data from the object works for every key-value pair

    stored in the object. The key is the name associated with the form element.

    For example, we created a sample scrolling list. Recently,


    ```

    print $query->scrolling_list(-name=''scrolling_list_name'',

    -values=>[''foo'', ''bar'', ''baz'',

    ''qux''],

