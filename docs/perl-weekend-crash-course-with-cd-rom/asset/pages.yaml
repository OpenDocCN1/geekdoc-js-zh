- img_proc: true
  md: '212 Saturday Evening


    # Revisiting the Concept


    Let''s take a minute to step back from the minutia of actual programming and look
    at the big picture. Think for a moment about the Perl functions. What are they,
    really? They are reserved words which, when invoked and given certain types of
    arguments, produce for us a given type of result. In a very broad sense, isn''t
    that what programs themselves are? While it''s true that programs have a more
    interactive type of input and output, and are generally more complex, the actual
    conceptual difference between a function and a program is quite small, and mostly
    a matter of degree rather than substance.


    You can think of a function as being a sort of prefab minprogram that you can
    include within bigger programs. Conversely, you can think of your programs as
    being a sort of giant metaprogram that is mainly concerned with the manipulation
    of smaller programs (the in fact, the whole of computer operations can be thought
    of in these terms. Your computer''s processor is a controller of millions of circuits,
    which are organized into logical arrangements (like microcode). These arrangements
    are abstracted into a command language that the chip-manufacturer publishes. This
    command language is abstracted into an assembly language, which is somewhat more
    "human friendly." but still controls the operations of the process at a very fine-grained
    level. Assembly language is then abstracted into some higher-level languages,
    such as C. When C is compiled, the compiler basically converts it into machine
    code so that it can control the processor directly. Then you have written in Perl,
    which is interpreted by a program (the interpreter) that is written in C. Whenever
    you write a Perl program, you are actually writing a program that controls a program
    that controls the processor. Phew!


    In context, it makes sense that you might write a program whose primary purpose
    is to be used within a larger program. These programs would not be any different
    in respect from the miniprograms that are the native functions, and would be used
    in the same way. In fact, this is more than just a conceptual possibility. The
    writing of functions is a VERY common programming practice. It is probably not
    an exaggeration to say that in programming of any complexity, the writing of functions
    is the dominant portion of the activity.


    # Creating Your Own Functions


    Now we''ve stretched our brain on the theoretical side of functions, let''s move
    on to the relatively easy part — actually writing them.'
