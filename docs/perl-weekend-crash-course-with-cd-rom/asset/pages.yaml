    Before Perl got popular as a Web scripting language, it found a niche among system
    administrators. Because of its freeform style, powerful set of functions, and
    similarities to other system-oriented languages (such as the Unix shell environments),
    Perl allowed system administrators to whip up quick utility programs in minutes.
    The symbiosis between Perl and people who do programming has continued to the
    present, and has led to a great deal of development on those commands and functions
    that allow Perl programs to interact with many popular operating systems.


    In keeping with the rest of this book, my main focus will be on using Perl with
    the various Unix and Unix-derived operating systems, however, the techniques derived
    in this session should apply to all operating systems, with the differences coming
    mainly in how your particular OS handles particular tasks. If you are looking
    for information on the particularities of using Perl with your OS, I suggest you
    look on the World Wide Web. The Web is dotted with pages containing information
    on almost anything pertaining to Perl.'
