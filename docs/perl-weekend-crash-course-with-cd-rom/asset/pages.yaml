    # A Case Study: The Database Interface Module


    # Session Checklist


    +   - Installing the DBI module

    - Connecting to a database server

    - Getting data from the database server

    - Applying DBI to real world situations


    In the last session, I described how to use modules in fairly general terms. Although
    I did offer a few examples, I thought it might be best to take a in-depth look
    at a single module. The module that I''ve chosen is the Perl module, DBI stands
    for Database Interface, and true to its name, the DBI module is used to allow
    Perl programs to access database servers without having to code all the particulars
    of database functions yourself.


    # Using Perl to Access a Database


    The DBI module provides a set of functions for making network connections to database
    servers, and using their functions. It does all regardless of the particular database
    server being used. You can use almost any database — Oracle, Sybase, Postgres,
    Informix, MySQL, or any database using the ODBC programming interface.'
