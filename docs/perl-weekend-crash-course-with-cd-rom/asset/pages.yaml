  md: '# Session 28—Passing Data via CGI


    # Making the CGI Useful


    While it''s helpful to see the data that the user posted was properly sent to
    your CGI, printing back to the user what she posted is not very useful. In order
    to make your survey functional, you need to tabulate the results. You also want
    to e-mail the comments to the Webmaster.


    In order to do this, you will use parts of form.cgi (shown previously) to save
    the form data into another manageable hash. You will also add sections to e-mail
    the comments to the Webmaster, and a section to display the survey results to
    the user after submission. These sections can be used to accomplish other manipulations
    of form data.


    There are three parts you must implement in order to display the survey results
    to the user. You must collect your survey results, translate those results along
    with the existing results, and then display the final tabulation to the user.


    First, you create a file to hold all of the survey information. The file is a
    plain-text file of data. This is called a flat-file database.


    In general, CGI programs are not allowed to create files themselves. Therefore,
    you must create the flat-file database yourself in the folder where your CGI is,
    and set the permissions to be world writable:


    ```

    touch icecreamsvey.out

    chmod 666 icecreamsvey.out

    ```


    Next, you write the posted information to this file. You must first open the file,
    and then lock it so no other CGI POST can write while you are


    ```

    open SURVEY_DB or die "Couldn’t open $SURVEY_DB_FILE for writing: $!\"

    flock (SURVEY_DB, 2);

    ```


    Use a variable to set the filehandle of the flat-file database within your script.
    If the filehandle changes in the future, you only have to change it at one place
    within the script. Previously, you set SURVEY_DB to icecreamsvey.out, and used
    SURVEY_DB to call the file.


    In the chance that someone wrote to the file as you were locking it, you set the
    file pointer to the end of the file. The seek command is used to set the location
    of the file pointer. seek is of the form


    ```

    seek(filehandle, offset, whence);

    ```


    ![](img/407bedec2b2c349369b174a7f5fb6718_334_0.png)'
  merge: -1
  pgno: 334
- img_proc: true
