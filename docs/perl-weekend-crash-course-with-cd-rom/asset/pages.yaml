  md: '# 292 Sunday Afternoon


    The foundation of HTML documents is made up of hyperlinks, which are used to navigate
    between documents. The tag to create a hyperlink is


    ```

    <A href="URL">name to click</A>

    ```


    This displays "name to click" in the document in the color defined in the body
    attribute section, or if that has not been set, the default colors specified in
    the Web browser. The format for an e-mail hyperlink is basically the same as the
    previous one, but with the mailto: specified as shown here.


    ```

    <A href="mailto:someuser@foo.com">name to click</A>

    ```


    A final type of hyperlink is used when you want to link to elsewhere on the current
    document. This requires two separate tags:


    +   * To create the target location: <A name="NAME">name of location</A>

    * To create the link to the target location: <A href="#NAME">name to click</A>


    Other useful HTML tags format the text within the document. Boldface, italic,
    underline as well as horizontal separators and line breaks help to format the
    text. Tags for formatting text and paragraphs may be viewed in Table 27-1.


    # Table 27-1

    Character and Paragraph Formatting Tags in HTML4.01


    | Tag | Function |

    |---|---|

    | <PRE></PRE> | Create preformatted text |

    | <H1></H1> | Create the largest headline text |

    | <H6></H6> | Create the smallest headline text |

    | <B></B> | Create boldface text |

    | <I></I> | Create italic text |

    | <U></U> | Create underline text |

    | <TT></TT> | Create typewriter-style text |

    | <STRONG></STRONG> | Emphasize the text |

    | <EM></EM> | Emphasize the text |

    | <CITE></CITE> | Create a citation (usually italic) |'
