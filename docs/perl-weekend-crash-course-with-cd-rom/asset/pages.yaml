  md: '# SESSION


    # 12


    # Control Structures


    # Session Checklist


    +   * Using flow control

    * Using conditional structures

    * Using iterative structures


    Control structures get carried out the same way every time and a program make
    the difference between a program that is a rote set of instructions that is a
    dynamic piece of software that can react to input and varying conditions and make
    decisions about how to handle particular sets of circumstances. Control structures
    provide the "thinking" framework of any program.


    # What Is Flow Control?


    When we talk about control structures, what we''re talking about is the particular
    constructs that allow the programmer to control the flow of the program. When
    the Perl interpreter runs a program, it starts at the top and executes each step
    in sequence. Control structures are used to alter this top-to-bottom flow by telling
    the interpreter to skip a certain section, or to repeat a certain section depending
    on certain conditions.'
