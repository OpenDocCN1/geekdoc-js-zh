- img_proc: true
  md: '# Session 13—Functions I: Perl Native Functions


    Like control structures, functions can often be nested inside one another. When
    this happens, the functions are processed from the inside outwards, with the return
    value of the inner function acting as the data being passed to the outer function.
    Thus


    ```

    $input = <STDIN>;nchomp $input;

    ```


    is the same as

    chomp ($input - <STDIN>);


    You might notice that the first function in the preceding example does not actually
    contain a function, but only an operator. In fact, the creators of Perl have gone
    to some lengths to create ambiguity between what constitutes a function and what
    constitutes an operator (according to the camel book, 2nd ed., page 141). There
    is some validity to this. The difference between what constitutes an operator,
    and what constitutes a function is not always clear.


    In any case, you can think of a function as a sort of black box. You throw data
    into the box, and something else comes out. For practical purposes, it doesn''t
    matter how it gets done, as long as it does.


    # Passing Data to Functions


    As mentioned previously, data is passed to functions in the form of arguments.
    Like command-line arguments, this data is given to the function at the time you
    want to use it. The best way to see how this is done is to look at an example.
    The length function takes a scalar value as input, and returns the length of that:


    ```

    $phrase = "Hello there";n$len = length $phrase;

    print $len;

    ```


    The preceding code will output the value 11, as there are eleven characters in
    Hello there (the space counts).


    > Note A much easier way to do the previous code would be print(length "Hello
    there");


    ![](img/407bedec2b2c349369b174a7f5fb6718_158_0.png)'
