  md: '# SESSION


    ![](img/407bedec2b2c349369b174a7f5fb6718_156_0.png)


    # Functions I: Perl Native Functions


    # Session Checklist


    +   - Learning about functions

    - Using functions in your programs

    - Learning individual functions


    Now that you''ve got the grammar of Perl under your belt, it''s time to work on
    the vocabulary. When I talk about the grammar of Perl, I''m talking about the
    main structural elements of the language. Data types, variables, operators, statements,
    flow control constructs, and the like, provide all the structure upon which you
    build your programs.


    But there is another side of the language as well, and that is the function. Functions
    provide the vocabulary of Perl, in that they allow us to actually do something.
    A language with grammar but no vocabulary might be formally interesting, but we
    wouldn''t be capable of expressing much with it. Similarly, a programming language
    with only structures and no functions might be interesting to a student of languages,
    but it wouldn''t allow us to get much work done.


    There are two types of functions, native functions and user-defined functions.
    User-defined functions are functions that you create. We will discuss those in
    more detail in Session 20. In this session we discuss native functions, which
    are functions that are built into the language itself. (Functions are also provided
    by modules).'
  merge: -1
