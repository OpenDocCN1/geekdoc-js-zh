  md: '# Fun with CPAN


    Because modules are such a big part of Perl, the standard Perl distribution comes
    with a handy program that you find and install them. The program is called CPAN,
    so called because it uses the Comprehensive Perl Archive Network (CPAN). CPAN
    is a repository of many modules contributed by many authors. You can visit the
    CPAN Web site at www.cpan.org.


    Using CPAN, you can connect directly to a CPAN repository site (there are several),
    download, and install modules all from a single interface. Obviously, your computer
    needs to be connected to the Internet in order for this to work.


    CPAN has two modes — an interactive mode, and a noninteractive mode. In this session
    we will only be concerned with the interactive mode. If you want to learn how
    to use the noninteractive mode, read the CPAN perdoc page (perldoc CPAN).


    To start the CPAN interface, type perl -CPAN -e shell


    at a system prompt. The -CPAN syntax is the way that Perl lets you invoke modules
    on the command line. The CPAN interface is provided by the CPAN module, which
    should have been installed when you installed the main Perl distribution. By invoking
    the CPAN interface in this way doesn''t work, you may not have installed the CPAN
    module, in which case, you''ll have to download and install it manually in the
    next section for how to do that).


    You should get a CPAN prompt that looks like this: cpan>


    If you have problems doing this, you may need to have super privileges to access
    some of the resources needed for the CPAN program to work. Become root if you
    can. If you can''t, ask your system administrator what you can do.


    The first time you use CPAN, you may need to configure the program before you
    can use it. If you see a screen that looks like this:'
