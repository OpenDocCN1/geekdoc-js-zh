    # Unix pipes


    For those readers who need a refresher, or for those who are coming to Perl from
    operating systems other than those in the Unix family, a brief tutorial on the
    concept of pipes might be in order.


    A pipe in Unix is a way of communicating between processes. In the Bourne shell,
    which is one of the most popular Unix command environments, the pipe character
    signifies that the output from one command is used as the input to another. Thus
    it is very common to see Unix commands that look like


    +   - 1 | more


    which pipes the output of the ls command (the directory listing command—analogous
    to the dir command in DOS) into the more command, which scrolls through a file
    page-by-page. If the output of the ls command takes more than one page, the more
    command will let you look at it page at a time.


    Another way of using pipes in Unix is the named pipe. This is a file that uses
    the output of a process as its content. Using a named pipe, processes can use
    the output of another program simply by reading from the pipe file.


    In Perl, the modifiers used in the open command to signify reading, writing, and
    piping are "by an amazing coincidence" (read: "quite deliberately”), the same
    as the Bourne shell symbols for input and output redirection, and for piping.


    ```

    open(WRITEPROC, "|write $user");

    print WRITEPROC "call me now";

    close WRITEPROC;


