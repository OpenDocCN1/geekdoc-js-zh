- img_proc: true
  md: '# 132 Saturday Afternoon


    These are someone else''s user-defined functions that have been packaged and distributed
    publicly.) Some languages, such as C, have a relatively small number of native
    functions. These languages provide extended functions through libraries (files
    full of archived functions). Other languages, such as Perl, have quite a few native
    functions. (There are Perl libraries, of course, the point is that the number
    of native functions in Perl is far greater than that of, say, C.)


    # What’s a Function?


    You have already seen several examples of functions throughout in this book. One
    of the most frequently used has been the print function. As we have seen, print
    a chunk of text and prints it to the terminal screen. There are also, as we will
    see later, ways of making print to other places, such as files. In the most general
    sense, the print function has a job, and that job is to take text and put it somewhere.
    We can use operators and perl to modify the way it does this, but the basic essence
    of the function — the placement of text — remains intact.


    In general, all functions share this quality. They have a job, whose essence remains
    the same, but whose behavior can be modified by means of options and arguments.
    The basic syntax of a function looks like this:


    ```

    function(arguments);

    ```


    Arguments to a function are the same as arguments given on your operating systems
    command line. Much in the same way that we used command line switches as e to
    modify the behavior of the Perl interpreter, we can use various options to modify
    the behavior of functions. Arguments can also represent data given to the function
    for processing. For Perl being, the parentheses around the arguments are often
    optional. For example with the print function, I often don''t use parentheses
    because the quotation marks provide the same type of clarity.


    # Using Functions in Programming


    Functions are used in programming as simple command statements. That is, use a
    function as a simple command wherever you want that function''s job carried out.'
