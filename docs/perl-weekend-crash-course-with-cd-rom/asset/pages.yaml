  md: '# Finding a Substring


    One of the most common operations when dealing with textual data is that of finding
    a substring. This is, in a sense, what you were doing with the s operator, but
    in that instance, you were looking for textual patterns. In other cases, you may
    have no idea what the text will look like, but you might know where it is. You
    may know, for example, that the interesting part of a certain string might be
    located exactly fourteen characters from the beginning of the line, and that it
    is exactly nine characters long. In that case, you can use the substr function
    to extract it:


    ```

    $substring = substr($string, 14, 9);

    ```


    Thus, if


    ```

    $string = "Now is the time for all good men to come to the aid of the party.";

    ```


    then the value of $substring would be:


    ```

    e for all

    ```


    > Remember spaces count as characters.


    The value of the second argument — the offset — is a negative number, it is interpreted
    to be an offset from the end of the string. Thus, $substring = substr($string,
    -3, 5);


    will extract the five characters beginning at the third character from the end.
    Note that the substring still goes from left to right, therefore this particular
    example will only extract three characters.


    Another way you can use the substr function is to replace a substring with another
    one. For example,


    ```

    $string = "Now is the time for all good men to come to the aid of the party.";

    ```'
