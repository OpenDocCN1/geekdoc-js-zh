  md: '# SESSION


    # Advanced Input and Output:

    Directory Manipulation


    # Session Checklist


    +   - Using directory handles

    - Using directory-related functions

    - Using the filename globbing operator


    Having learned how to use filehandles and the functions that manipulate them,
    you are half way towards being able to make full use of your computer''s file
    system. But while you are able to access individual files, your still unable to
    traverse directories, get directory listings, and work with files in groups. Such
    techniques are the subject of this session.


    # Directory Handles


    In order to manipulate directories, you must assign a directory handle to the
    directory you want to use. A directory handle works in exactly the same way as
    a file-handle does, except that you create it using the opendir function.


    ```

    opendir(DIRHANDLE, "/path/to/dirname/");

    ```'
