    The output should be:


    hi


    Congratulations, you have just written your first Perl program. The -e flag is

    instruction to the interpreter that means "execute the Perl command enclosed in

    single quotes follows." Get comfortable with the -e flag, because it is a very

    useful thing. Any time you think of a simple task that could be done with a

    very short Perl program, the -e flag will allow you to run it quickly with the
    com-

    line, without having to go through the formalities of real programming.

    The -e flag is not limited to one-liners. You could just easily do


    ```

