    # Comments


    The lines preceded by hashesmarks (#) are comments.


    +   # This subroutine acts like a Server Side Include. It takes the # name of
    a file as argument, and-includes that file in the web #page.


    These notes are ignored by the Perl interpreter; they exist merely as a way for
    the programmer to leave notes, either to himself or to other programmers. Many
    novice programmers think comments are trivial or unnecessary. Nothing could be
    further from the truth. Comments make the work of deciphering someone''s work,
    or your own old work, much, easier.


    In this example, the comment tells you that the piece of code is designed to do.
    Comments can also be used to remind yourself of how you were going about attacking
    a problem, of another idea you had for a similar piece of code, to keep notes
    about what you changed in the program and, for any other purpose whatsoever.


    You may think, "Oh, this program is only a one-off, I don''t need to comment it,"
    but you may be surprised at how often you find yourself revisiting one-off programs
    because you''ve run across another task that can be accomplished more by quickly
    adapting an old program, rather than writing a new one from scratch. Using old
    code is one of the most reliable ways of increasing your efficiency as a programmer,
    but it only works if you don''t have to spend a lot of time figuring out what
    you did the first time you wrote the program.


    It is a far, far better thing to overcomment than undercomment. A comment costs
    nothing except the time it takes to type it. Since comments are completely ignored
    by the Perl interpreter, they have no effect on the running of your program. While
    some may chide you for your prolific commenting style, you can retort by chiding
    them for the amount of time they spend relearning old code.


