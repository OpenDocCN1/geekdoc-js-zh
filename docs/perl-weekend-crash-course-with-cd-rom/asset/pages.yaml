  md: '# SESSION

    29

    The CGI.pm Module


    # Session Checklist


    +   - Using shortcuts to HTML generation

    - Understanding CGI module functions

    - Processing form data

    - Benefiting from smarter HTML


    The CGI.pm library module uses objects to create HTML forms and parse their contents.
    CGI.pm includes functions that enable you to create HTML documents quickly. By
    generating HTML this way, the value of previous queries is used to initialize
    the form. This preserves the state of the form. CGI.pm also provides functions
    to parse and interpret queries sent to CGI scripts.


    # Shortcuts to HTML Generation


    CGI.pm includes many functions that can generate HTML easily. Before you use these
    functions, you must select which mode you wish to use. CGI.pm can be used in either
    function-oriented mode or object-oriented mode.'
