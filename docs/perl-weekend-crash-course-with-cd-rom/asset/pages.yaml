  md: "# BEGIN and END Blocks\n\nIt's time for me to own up to a little fib I told\
    \ at the beginning of this book. When I told you that Perl is an interpreted language,\
    \ and not a compiled language, I was only telling the truth. In fact, Perl is\
    \ both interpreted and compiled. The Perl interpreter is also a compiler. While\
    \ it's true that you don't have to compile your programs as you do with, say,\
    \ C, it is also true that time you run a Perl program, the Perl code gets compiled\
    \ into a kind of shorthand bytecode.\n\nOne of the things that lets you to give\
    \ instructions to the compiler in the course of your program that affect the way\
    \ the program is compiled. Such is the case with the BEGIN statement. A BEGIN\
    \ statement looks like a subroutine, but what it actually does is have the enclosed\
    \ code before anything else happens. If you have some code that everything depends\
    \ on, it's often a good idea to put it in a BEGIN block.\n\nThe opposite of the\
    \ BEGIN block is the END block. The END block is compiled last, before the program\
    \ exits. It is primarily used for housekeeping chores such as removing temporary\
    \ files. Here's an example of a program using BEGIN and END blocks:\n\n```\n#!/usr/bin/perl\n\
    \nprint \"This is the main phase of the program. \\n\";\n\nEND {\n  print \"This\
    \ is the cleanup phase. \\n\"\n}\n\nBEGIN {\n  print \"This is the beginning phase\
    \ of the program. \\n\"\n}\n```\n\nWhen you run this code, what you will get for\
    \ output\nThis is the beginning phase of the program.\nThis is the main phase\
    \ of the program.\nThis is the cleanup phase.\n\nAlthough BEGIN and END blocks\
    \ can be used anywhere in any program, they become especially important in the\
    \ context of modules because they can be used to force your subroutines to be\
    \ evaluated prior to the running of the main part of"
  merge: -1
