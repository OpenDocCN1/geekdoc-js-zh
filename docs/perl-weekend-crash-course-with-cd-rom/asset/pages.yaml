    A list is just what it sounds like it might be. That is, a list is a simple group
    of items, organized under a single name. List variables are signified with the
    @ character, and the elements are grouped inside parentheses, and separated by
    commas. For example, you could create a list like this:


    ```

    @dogs = ( "husky", "shepherd", "collie", "dane", "greyhound" );

    ```


    As you see here, we have the variable name, introduced by the @, and we have a
    group of elements, which together comprise the variable''s value. Look again at
    our example:


    ```

    @dogs = ( "husky", "shepherd", "collie", "dane", "greyhound" );

    ```


    The value of part of this, which is in parentheses, is called the list literal.
    This way list literal is shown — each value with its set of quotation marks and
    comma separator — probably the most explicit way of assigning the variable, but
    it''s also fairly clunky and a pair to type. I mentioned in an earlier session
    that Perl has a fairly relaxed approach to quoting. While certain types of quotation
    marks can mean very specific things, if the situation you''re in a common one,
    there is usually a shortcut. In this case, we can use the word function, qw():


    ```

    @dogs = qw( husky shepherd collie dane greyhound );

    ```


    The qw() function in a list context (remember, context is important with some
    Perl functions) interprets any as a separator, and builds the list from any character
    strings separated by it. It is not necessary that this whitespace be simple spaces,
    either. For example, you might find preferable to render your list like so:


    ```

    @dogs = qw( husky

    shepherd

    collie

    dane

    greyhound );

    ```


    However you choose to handle the quoting, you need to be aware of where you have
    constant textual values, and where you might have variable values, or numerical
    data.


