  md: "# Session 16—Using the Operating System\n\n```\nwhile (true) {\n    fork;\n\
    }\n```\n\nSince the expression always returns a true value, the condition in the\
    \ while loop is always true. Thus the preceding code will simply loop and loop,\
    \ continuing to fork off child processes. In addition, each child process does\
    \ the same thing. The number of processes increases exponentially until the process\
    \ table overflows. This is called a *fork bomb*.\n\n![](img/407bedec2b2c349369b174a7f5fb6718_196_0.png)\n\
    \n> Never write fork bombs; even accidentally, if you can help it. In the process\
    \ of writing this system, I created a fork bomb that crashed my computer. Fortunately,\
    \ most of my work was saved, but I could easily lost a great deal of work because\
    \ of it. If you run a fork bomb on your own system, you will have the headache\
    \ of recovering from a crash. If you run a fork bomb on someone else's system,\
    \ you will probably make an enemy for life.\n\nIn order to use fork properly,\
    \ you need to know a little about process management. Under Unix and its derivatives,\
    \ each running process receives an identification number called a *process ID*,\
    \ or PID. When you use a fork, the return value of the command is the PID of the\
    \ child process. Thus you can keep track of the child PID by invoking fork in\
    \ this way:\n\n```\n$childPID = fork;\n```\n\nA second return value, 0, is given\
    \ to the child process. Thus you can keep track of which process is with which\n\
    \n```\n$childPID = fork;\nif ($childPID == 0) {\n    # I am the child process.\n\
    } else {\n    # I am the parent process.\n}\n```\n\nunless the fork failed, in\
    \ which case the return value is undefined:\n\n```\nif ( undefined childPID=fork()\
    \ ) {\n    die \"couldn't fork\";\n}\n```"
