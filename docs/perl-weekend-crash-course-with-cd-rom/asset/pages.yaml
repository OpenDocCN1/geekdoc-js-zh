- img_proc: true
  md: "# 156 Saturday Afternoon\n\nDirectory handles have a separate namespace (a\
    \ way in which names of things are stored) from filehandles, so it shouldn't matter\
    \ if you have a directory handle and a filehandle with the same name, however,\
    \ from the point of view programming style, it's best if you keep them distinct.\n\
    \nOnce you've got the directory open, you use the readdir function to get the\
    \ names of the files in that directory. Like many Perl functions, readdir behaves\
    \ differently depending on whether you use it in a scalar or a list context. In\
    \ a scalar context, it returns the name of the next file in the directory. (In\
    \ other words, if you had files in your directory name a, b, and so on, the files\
    \ would be returned in that order.) Used in a list context, readdir returns a\
    \ list of all filenames in that directory.\n\nLet's take a look at a concrete\
    \ example of how you might use these functions in a program:\n\n```\n#!/usr/bin/perl\n\
    \nopen(OUTPUTFILE, \"./output\");\n\\opendir(MYDIR, \"/home/me/mydatadir\") ||\
    \ die \"we have a problem\";\n@files = readdir(MYDIR);\n\nforeach $file (@files)\
    \ {\n    open(READFILE, $file) || die \"couldn't open $file\";\n    while(<READFILE>)\
    \ {\n        print OUTPUTFILE;\n    }\n}\nclose(READFILE); #only need to do this\
    \ once since each new 'open'\n#closes the previous one.\n```\n\nThis program takes\
    \ the contents of every file in the mydatadir directory and dumps its contents\
    \ into the output file. (Note that if your program is in the same directory as\
    \ your data files, you will also get a copy of your program in the output file.)\n\
    \nWhat you've done here is to define a directory, open, read the contents into\
    \ a list variable, and then use the foreach construct to iterate over each list\
    \ element. Since these list elements are filenames, you can feed them into an\
    \ open statement in this way, you can access the contents of the files without\
    \ actually knowing their names."
