  md: "# Session 26—References\n\ndid mean to use the function shift, you can signal\
    \ that by adding something makes it clear that you mean the function, and not\
    \ just an identifier, such as:\n\n```\n${ shift() }\n```\n\nHere, the parentheses\
    \ show that you're talking about a function. You could get the same effect with\
    \ an argument:\n\n```\n${ shift @list };\n```\n\nThat last one is especially useful\
    \ if @list is a list of references!\n\n![](img/407bedec2b2c349369b174a7f5fb6718_308_0.png)\n\
    \n```\n@list_1 = (\"foo\", \"bar\", \"baz\", \"hejaz\");\n@list_2 = (\"whee\"\
    , \"poit\", \"ptang\");\n$ref_1 = \\@list_1;\n$ref_2 = \\@list_2;\n@listofrefs\
    \ = ($ref_1, $ref_2);\nwhile (@listofrefs) {\n    foreach $val (@ shift @listofrefs\
    \ ) {\n        print \"$val \\n\";\n    }\n}\n```\n\nHere, you use the shift function\
    \ to give the next reference in @listofrefs, and then, using braces, you de-reference\
    \ that value, and feed the resulting value to the foreach loop, effectively iterating\
    \ over all the values in all the arrays referred by the values in @listofrefs.\n\
    \nThis is also useful when you want to jam the value of a variable right next\
    \ to some other text, but don't want the adjacent text to be considered part of\
    \ the variable.\n\n```\n$bug = \"Spider\";nprint \"${$bug}man\";\n```\n\nwould\
    \ output Spiderman. There are, of course, other ways of doing this, such as\n\
    print ($bug . \"man\");"
