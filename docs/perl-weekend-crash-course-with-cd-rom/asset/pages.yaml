    \n# The Diamond Operator\n\nYou will have noticed that the STDIN token is enclosed\
    \ in angle brackets when it is used to take input from the keyboard. The angle\
    \ brackets are actually an operator, and when they are used, they return a line\
    \ of input (if used in scalar context), or a list of all the lines input (if used\
    \ in list context).\n\nUsing the angle brackets without anything inside them is\
    \ a special way of dealing with input, and it has its own name — the diamond operator.\
    \ The diamond operator takes input from files that you name on the command line\
    \ (and so constitutes an alternate way of using command line arguments). For example,\
    \ if you:\n\n```\n#!/usr/bin/perl\n\nwhile (<>) { This is a loop. Loops are\n\
    \  print $_; # discussed in Session 12.\n}\n```\n\nand saved this program with\
    \ the name myprog, you could invoke it with the names of one or more files on\
    \ the command line, as in\n\n```\nmyprog file1 file2\n```\n\nand it would print\
    \ each line of every file. (We haven’t discussed looping yet, for now just assume\
    \ the while statement will repeat everything between the curly braces for long\
    \ as there is data to process.)\n\nThe handling of command-line arguments is implicit\
    \ in the diamond operator, so you don’t need to set up any special handling of\
    \ @ARGV. The thing to keep in mind is that the <> represents the next line contained\
    \ in the file(s). Thus if each file has three lines, the fourth line handled by\
    \ the <> operator is the first line of the second file. For this reason, the diamond\
    \ operator is sometimes referred to as the readline operator.)"
