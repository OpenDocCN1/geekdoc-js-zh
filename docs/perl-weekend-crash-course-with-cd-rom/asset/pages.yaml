    at a system prompt. You should see a bunch of entries that look more or

    less like this:


    +   Wed Nov 22 14:37:27 2000: Module the Apache::DBI manpage

    * installed into: /usr/lib/per15/site_perl/5.005

    * LINKTYPE: dynamic

    * VERSION: 0.10

    * EXE_FILES:


    This tells you the date and time of installation, the name of the module,

    and some information about it.


    # An Abridged Guided Tour


    Let''s take a look at some of the modules that are available as part of the standard

    library as well as a few of the more nonstandard modules. (The following are

    short descriptions only. For the full scoop, read the module''s perdoc page.)


    > Although I refer to all of the following as “modules,” some of

    them are, in fact pragmas. A pragma is an instruction that you

    changes the behavior of the Perl compiler. Pragmas are

    used in much the same way as modules, so they are generally

    grouped together. You can tell them apart because pragmas usu-

    ally begin with a lower case letter, whereas modules begin with a

    capital letter.'
