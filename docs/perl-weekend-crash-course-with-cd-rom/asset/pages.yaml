    # Installing the DBI Module


    You can install the DBI module in either of the ways that I described in Session
    21. If you choose to install it using the CPAN interface, you need only invoke
    the CPAN shell:


    ```

    perl -MCPAN -e shell

    ```


    Then at the cpan> prompt, type


