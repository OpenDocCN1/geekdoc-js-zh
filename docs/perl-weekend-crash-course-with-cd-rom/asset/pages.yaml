  md: 'disadvantages are that it is more complicated, and there are more opportunities
    for things to go wrong.


    If you choose to install from source code, you should at least be familiar with
    the process in general; ideally, you will have installed a simple software package
    from source code at once before. You should also be certain that you have a complete
    compilation environment: a C compiler, and all the standard C libraries that you
    would need to build any other software package. Again, if you have a standard
    Linux or Unix installation, the odds are very good that you have these packages
    already installed. You should also have the make package installed.


    If your compilation environment is complete, and you wish to perform a default
    install, perform the following steps:


    +   1. Download the source package, which, if you get the latest version, will
    be named stable.tar.gz


    +   2. Place the package in a convenient directory, such as /tmp, or /usr/src.
    (For general housekeeping reasons, I suggest that you do not use your home directory.)


    +   3. Extract the package using the utility:

    `[root@fugu]# tar cvfz stable.tar.gz`


    A lot of lines will scroll off the screen.


    +   4. IMPORTANT: Before you do anything else, read the documentation that comes
    with the package. Most especially, read anything with the title README or INSTALL
    with the name of your operating system in the title. If anything has changed in
    the particular distribution you''re using, or if there are any special instructions
    regarding compiling on your particular system, they will be spelled out in these
    documents. In case of any discrepancies between this book, and the package documentation,
    follow the directions in the package documentation.


    +   5. Assume superuser privileges using su command.


    +   6. Extracting the package will create a new directory that should have the
    name perl-x.x.x (where x.x.x is the version number, for example, perl-5.6.1).
    Changing the working directory to that directory.


    +   7. Issue the following commands, in order:

    `rm -f config.sh Policy.sh`

    `sh Configure -de`

    `make`

    `make test`

    `make install`'
