    The previous snippet could be simplified to:

    print(split(/, ., @string) "\n";


    If you split on a null expression (a regular expression with nothing inside),
    you can split a string up into individual characters, for example,

    $string = "Hello";

    $letters = split(@letters, $string);

    foreach $letter (@letters) {

    print "$letter \n";

    }


    would print each letter on a separate line.


    # join


    The join function does the opposite of split. It joins several strings together
    into one big string, using an expression as a separator. Thus if you were to do

    join('' '', "Now", "is", "the", "time");


    the resulting output would be

    Now is the time.


    Note that in this example, you have used a space as the separator. Similarly,
    if you were to do

    join('':'', "Now", "is", "the", "time");


    the resulting output would be

    Now:is:the:time


