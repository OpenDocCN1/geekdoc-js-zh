  md: '# Session 28—Passing Data via CGI


    | Variable Name | Value |

    | REQUEST_URI | Pathname of requested document/CGI relative to document root |

    | REMOTE_ADDR | IP address of visitor |

    | REMOTE_HOST | Hostname of the visitor (if reverse DNS is allowed; otherwise
    same as IP) |

    | REMOTE_PORT | Port of the visitor is connected to the server |

    | REMOTE_USER | Visitor''s username (for .htaccess protected pages only) |

    | QUERY_STRING | Query string (set by GET; see "GET and POST" section later in
    this session) |

    | HTTPS | "on", if the script is called through a secure server |

    | HTTP_COOKIE | The visitor''s cookie, if one is set |

    | HTTP_HOST | Hostname of the server |

    | HTTP_REFERER | URL of the page that called the script |

    | HTTP_USER_AGENT | Browser type of the visitor |

    | DOCUMENT_ROOT | Root directory of the server |

    | PATH | System path the server is running under |


    Some servers set additional environment variables; the server documentation will
    specify these. Also, not every environment variable is set for every CGI. QUERY_STRING
    is only set when GET is used to send the form data (see "GET and POST" later in
    this session). REMOTE_USER is only set for password-protected pages using a .htaccess
    file.


    The %ENV hash is automatically created and populated for every CGI. In order to
    print out the IP address of the visitor, you would use:


    ```

    print "IP of visitor: $ENV(''REMOTE_ADDR")\n";

    ```


    You can create a simple Perl CGI script to print each environment variable. This
    script will be useful later, to verify that the correct items are being sent from
    the HTML form.


