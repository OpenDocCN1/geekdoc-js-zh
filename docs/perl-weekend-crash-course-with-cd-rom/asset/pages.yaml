  md: '# Session 29—The CGI.pm Module


    # Smarter HTML


    CGI.pm module offers functions to assist in making smarter HTML. CGI.pm provides
    access to various HTTP session variables and cookies.


    # HTTP session variables


    Accept() is one of the useful HTTP session variables that you can access through
    CGI.pm. Accept() returns a list of the MIME types that the remote browser will
    accept.


    While generally you would find an entire list useful, if you pass the method single
    argument like


    ```

    $query->Accept(''text/html'')

    ```


    Accept() returns a floating-point value that corresponds to the browser''s preference
    for this type. 0.0 indicates that the browser doesn''t want to handle this type,
    and 1.0 indicates that the browser is ready and willing to handle textHTML.


    Another HTTP variable that CGI.pm provides is http(). http() returns the list
    of all HTTP environment variables when called with no arguments. If http() returns
    the name of the HTTP header field HTTP_ACCEPT_LANGUAGE, it will return its value.


    HTTP session variables similar to CGI environment variables. Used well, HTTP session
    variables enable you to handle users using different browsers, languages, and
    network connections. By using this information, you can adapt your HTML documents
    accordingly.


    # Cookies


    Cookies are used to manage state within a browser session. You can create and
    read from cookies using modules specified in CGI.pm. Cookies, much like the key-value
    pairs in a CGI query string, are made up of name-value pairs.


    You can create cookies and send them to the browser in the HTTP header. The browser
    then stores the cookie on the client machine, maintains a list of cookies, and
    returns them to the CGI script during later interactions with the particular Web
    server.


    To create a new cookie, use cookie(). There are many parameters you can set for
    each cookie, however. For example, if you are an online bookstore using cookies,
    you may wish to create a cookie to save the last book viewed by the user. If


