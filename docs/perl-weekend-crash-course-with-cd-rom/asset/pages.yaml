- img_proc: true
  md: 'Notwithstanding the contents of the README file, as a general procedure at
    this point, do the following:


    +   1. Give the command `perl Makefile.pl`. A bunch of messages will scroll up
    the screen. You will need to provide any information at this point, you will be
    prompted for it. This step creates a configuration file called Makefile, which
    is used as a script for the remainder of the installation process.


    +   2. Give the command `make`. This may or may not be necessary depending on
    exactly how the package is constructed, but it won''t hurt anything if you do
    it when you don''t need to.


    +   3. Give the command `make test`. This will run the packages various self-tests.
    If there are any problems, they should manifest at this point.


    +   4. Give the command `make install`. This command will place the module in
    the appropriate directory for use in your Perl programs.


    Once you''ve done these steps, your module should be installed and ready to be
    used.


    # REVIEW


    In this session, you learned to install packages and modules for use in your Perl
    programs. You started by learning how to get information about modules from search.cpan.org.
    Then you learned to install the modules using Perl''s built in CPAN interface.
    Finally, you learned to install modules without using the CPAN interface.


