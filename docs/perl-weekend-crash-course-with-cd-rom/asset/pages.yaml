    Enough with the metaissues, already. It''s time to get down to actual programming.
    concept: the variable. Why is the variable the first and most important programming
    concept? Because the variable turns a program from rote list of static instructions
    into a dynamic processing machine capable of making decisions about how to run
    itself.


    # What’s a Variable?


    Anyone who''s ever taken algebra in high school has at least some idea of what
    a variable is, but we need to review the concept for several reasons: 1) not everyone
    in school that day, 2) some of us have been out of school long enough that we''ve
    forgotten, and 3) the concept is slightly different when we talk about it in a
    computing context.'
