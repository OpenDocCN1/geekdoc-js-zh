  md: '# Saturday Evening


    The beginning-of-line anchor character should not be confused with the character
    class negation operator. Even though they both use the carat character, the character
    class negation operator only occurs within square brackets. Thus,


    [^]


    is a character class negation, whereas


    ^


    means "Capital J at the beginning of a line."


    Similarly, the dollar sign character ($) matches the attached pattern at the end
    of the line. Thus


    Jim.$


    matches My friend''s name is Jim, but not Let''s see if Jim is home.

    The final anchor is the word-boundary anchor, \b. This anchor requires that there
    be a boundary at that position. Thus


    Jim\b


    match Jim, but not Jimmy. This can be negated with the \B anchor. This specifies
    that there must NOT be a boundary there. Thus


    Jim\B


    would match Jimmy but not Jim.


    # Alternation


    Some times you need to specify an either/or condition. You can do that with the
    alternation operator, the vertical bar (|). The expression


    Jim|Jerry


    will match Either My friend''s name is Jim or My friend''s name is Jerry.


    # Grouping


    We use parentheses to group characters, so that a particular construct is contained
    in a certain part of the expression. For example:


    (road|foot)race


    182'
