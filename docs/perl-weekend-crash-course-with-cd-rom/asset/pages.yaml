    # The camel book


    There are, of course, many books about Perl. (You have demonstrated your superior
    taste and judgement by selecting this one.) One book stands out, however, and
    must come in for specific mention. That book is called Programming Perl, and is
    published by O''Reilly and Associates. What is it about this book that would be
    so compelling to plug a rival publisher? Simply that this book was written by
    Larry Wall, who is the creator of Perl, along with Tom Christiansen and Randal
    Schwartz, who are probably the most well-known Perl experts.


    > Programming Perl is so authoritative that it is considered official Perl documentation.
    It is well known that it is referred to simply as “the camel book,” because of
    the picture of the camel on the cover. (Indeed, the camel has become the Perl
    mascot.) It is common, when asking a question about Perl, to receive an answer
    like, “That’s covered on page 252 of the camel book.”


    # The World Wide Web


    Like just anything computer-oriented these days, Perl has a thriving community
    on the Internet. Web pages devoted to Perl abound, some of them are quite good.


    Ground zero for the online Perl community is www.perl.com. This is the official
    Web site; here you can find links to Perl software, as well as the latest news,
    and links to get more software. There is also a link to the Perl documentation,
    which is the same documentation you have accessible by the man program. Finally,
    there is a Resources link that takes you to a page of links to various topics
    of interest.'
