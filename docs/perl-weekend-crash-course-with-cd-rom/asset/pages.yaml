    # Programming Style


    So what do I mean by programming style? In a nutshell, style means two things:
    First, it means the way your program looks to a reader. This may seem like a trivial
    consideration, but I assure you, it is quite important. A clear and readable program
    is not only a thing of beauty, it is also something that will pay dividends in
    the future. But why should you care? After all, you are only writing this program
    for'
