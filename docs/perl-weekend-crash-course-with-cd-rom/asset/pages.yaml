    # mod_perl in Action


    Programming in mod_perl is not that different from programming in Perl. However,
    there are a few instances where mod_perl and Perl act differently. This section
    offers samples of code and comments about common errors that Perl programmers
    run into when programming in mod_perl and porting old CGI scripts.


    The most common problem that Perl programmers run into when writing mod_perl scripts
    is that a script will work, and other times it will not. This is generally a problem
    that can be solved by running http in single process mode. Since mod_perl uses
    the same Perl interpreter, global variables can exist from one script to another
    unless you change them. The first step in debugging problems where a script sometimes
    works but not others is by running the Web server in single process mode.


