    \ calls itself every time it encounters a new directory. If you've never used\
    \ recursive techniques before, this can seem odd. After all, how can you define\
    \ something in terms of itself? The fact is, this is entirely possible in Perl.\
    \ (Nor is this unique to Perl—many languages have the ability to do this.)"
