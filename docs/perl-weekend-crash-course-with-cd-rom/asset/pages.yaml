  md: '# Single quotes


    The single quotation mark, '''', quotes a string exactly with no interpolation.
    Thus the statements


    ```

    $name = "Joe";nprint "My name is $name. \n";

    ```


    will return the output


    My name is $name. \n


    The construction q() is a synonym for the single quote.


    ![](img/407bedec2b2c349369b174a7f5fb6718_122_0.png)


    Think "Single quote, single q, double quote, double q."


    Finally, the qw construction is used as a synonym for putting quotes around all
    the elements of a list. Thus the construction


    ```

    @stones = ("Mick", "Keith", "Bill", "Charlie");

    ```


    is exactly the same as


    ```

    @stones = qw(Mick, Keith, Bill, Charlie);

    ```


    ![](img/407bedec2b2c349369b174a7f5fb6718_122_1.png)


    Instead of using double quotes, qq() or qw() (in a list context), you can simply
    omit quotes all together. The statements:


    ```

    @stones = ("Mick", "Keith", "Bill", "Charlie");

    ```


    and


    ```

    @stones = qw(Mick, Keith, Bill, Charlie);

    ```


    are the same as


    ```

    @stones = (Mick, Keith, Bill, Charlie);

    ```


    You need to use some caution if you do this, however, as there are certain words
    (such as "my") that if used unquoted and certain contexts can confuse the Perl
    interpreter and cause an error. When in doubt, use the quotes.'
