  md: 'But, you may find that the former gives your statement a better flow. As the
    two previous examples show, the braces can be used either inside or outside quotation
    marks.


    You can also use braces to make a de-reference clearer, as in


    ```

    print $($ref);

    ```


    or


    ```

    print @($ref);

    ```


    To a certain extent, using braces for organization is a matter of personal taste;
    however, your goal should always be to make your code as clear as possible. Try
    to look at your code with an objective eye and identify places where a reader
    could become confused. When you find these places, what can you do to disambiguate
    your code. Perl''s syntax is somewhat freeform, but you should not use that as
    an excuse to be sloppy. If you can''t sufficiently clarify your code using braces,
    leave a comment.


    # REVIEW


    In this session, you learned to create references and use them to pass data indirectly
    using the backslash operator, and to de-reference them by prepending the reference''s
    data type character ($, @ or %) to the reference. You learned to use references
    to manage lists of lists. You learned to create references to anonymous lists
    and hashes by implication. You learned to create anonymous subroutines using references.
    You learned to suppress the use of symbolic references using the strict pragma.
    Finally, you learned to use braces to keep things organized.


    # QUIZ YOURSELF


    +   1. If you know that the reference $ref is a reference to an array, what it
    proper way to de-reference it? (See "What Is a Reference?")


    +   2. To what does the expression $$ref[1][1] refer? (See "References and Complex
    Data Structures.")


    +   3. Why would you want to create an anonymous array? (See "References and Complex
    Data Structures.")'
