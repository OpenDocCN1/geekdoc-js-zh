  md: '# 152 Saturday Afternoon


    As a rule, it''s a good idea to unlink files if you don''t need them. For example,
    you might have had the need to create a file to store data for your program while
    it''s running, but once the program is done, it doesn''t need them anymore. Putting
    in a few lines at the end of your program to clean up is always a good idea.


    Whenever you use a function such as unlink, you need to be aware of the permissions
    on the file you''re using. You cannot unlink files in directories for which you
    don''t have permission.


    Never use unlink when running a program as the superuser-without being, VERY sure
    of what you''re doing. Careless, or even slightly unattentive of use of this function
    can do serious damage to your operating system. In fact, it''s probably not a
    good idea to run any program as the superuser without being vigilant.


    # rename


    The rename function, as you might guess, changes the name of a file. Its syntax
    is simple:


    ```

    rename OLDNAME, NEWNAME;

    ```


    If there is already a file with the same name as the new name, it will be overwritten.


    # chmod


    The chmod function does the same as the Unix chmod command. That is, it changes
    the permissions on a file. chmod takes a list of arguments, the first of which
    must be the numerical permission mode that you wish to switch the file to. (Sorry
    - Perl''s chmod can''t use symbolic modes.) For example:


    ```

    chmod 0755, /home/joe/somefile;

    ```


    Look at the Unix man page for chmod if you need to find out how to figure the
    numerical mode.'
