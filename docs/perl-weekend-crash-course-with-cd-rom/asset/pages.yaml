  md: '# Session 14—Advanced Input and Output: File Manipulation


    This creates the filehandle MYFILE, and associates it with the file /home/joe/myfile.


    Once a file has been opened and a filehandle created for it, you must then close
    it when you are done. As you might expect, this is done with the close function:
    close(MYFILE);


    If you use the same filehandle again in reference to another file, in other words,
    the first file is closed by default. open(MYFILE, /home/joe/myfile); some code;
    open(MYFILE, /home/joe/myotherfile);


    /home/joe/myfile would be closed before /home/joe/myotherfile was opened. However,
    it''s a good idea to get into the habit of closing your files before opening new
    ones, because it forces you to be aware that it''s happening. Note that when you
    open a file open(MYFILE, /home/joe/myfile);


    you are opening the file for reading. That is, you are expecting to take input
    from the file, and not write output to it. You can make this default assumption
    explicit by using the < character, like this: open(MYFILE, </home/joe/myfile);


    If you want to open a file for the purpose of writing output to it, you need to
    use the > character: open(MYFILE, >home/joe/myfile);


    If you want to append data to an already existing file, you need to use >>: open(MYFILE,
    >>home/joe/myfile);


    > Tip Opening a file for appending data is especially good for keeping log files.


    All well and good, you say, but what if I want to open a file for reading and
    writing at the same time? In this case, you need to use -> or <+. You should use
    >> if you wish to open a file for reading and appending.


    ![](img/407bedec2b2c349369b174a7f5fb6718_172_0.png)'
