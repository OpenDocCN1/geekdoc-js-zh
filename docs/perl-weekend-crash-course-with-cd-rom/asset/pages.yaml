  md: '# Session 28—Passing data via CGI


    submit it, two things will happen. First, the URL in the web browser location
    bar looks similar to:


    ```

    http://www.foo.com/ch28/environ.cgi?username=foo&gender=1&icecream-mint+chocolate+chip&comments=what+a+great+idea

    ```


    Secondly, the QUERY_STRING shown in the browser''s address window is set to the
    same content displayed after the question mark (?) in the above URL. It looks
    like:


    ```

    QUERY_STRING = username=foo&gender=1&icecream=Mint+Chocolate&Chip&comments=what+a+great+idea

    ```


    Note that the key-value pairs are separated by an sign (&). I will show you how
    to parse this CGI in the next section. Also note that any spaces in the input
    have been changed to the plus sign (+), and similar changes have been made to
    other nonalphanumeric characters, using a percent sign (%) as an escape character.
    This is called URL encoding.


    GET is not a secure method, so passwords and other sensitive data should not be
    sent using the GET method. The data is passed through part of the URL, so it shows
    up in the Web server''s log file, which is easily readable by most users. Private
    information should be sent using the POST method.(Although the POST method does
    not display the information, it is still sent over the Internet in clear text.
    This may be okay for very basic data, such as your name, but should not be used
    for very sensitive data, such as a credit number.


    The POST method sends the data to your CGI as an input stream. This means that
    your CGI must first fetch the stream and store it in a string that you can easily
    manipulate it. In order to save the input stream into a string, copy the STDIN
    into a buffer of the length that, as shown here:


    ```

    read(STDIN, $buffer, $ENV(''CONTENT_LENGTH''));

    ```


    Once you have the form data stored in a string, you can easily parse and process
    it.


    # Parsing and Processing Form Data


    Once the data has been sent to your CGI script, you must parse and process it.
    This will allow you to pass dynamic information to the user, compute the standing
    of a poll, and handle database searching other functions.


    ![](img/407bedec2b2c349369b174a7f5fb6718_330_0.png)'
