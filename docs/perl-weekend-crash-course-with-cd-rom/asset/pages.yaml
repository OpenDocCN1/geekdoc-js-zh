  md: '# Session 19—Formats


    # Fieldholders


    You saw previously that the fieldholder @<<<<<<<< represents a nine-character,
    left-justified field. Note that there are nine characters (including the @) in
    the fieldholder, and the angle brackets are pointing to the left. The number of
    characters allowed in the field will always match the number of characters in
    the fieldholder. In a left-justified field such as this, if the value of the variable
    to be substituted is shorter than the length of the field, the field will be padded
    with spaces on the right-hand side of the value.


    You can specify a right-justified field by using rightward pointing angle brackets:

    >>>>>>


    If you do this, the field will be padded with spaces on the left-hand side of
    the value.


    If you use the vertical bar character, like so:

    @|||||||


    you will create a centered field. The spaces will be padded on both sides of the
    value so that the value is centered in the field.


    Numeric fieldholders are created using the hashmark character:

    @@######.


    The dot here is interpreted as a decimal point.

    You can define a field of arbitrary length by using the construction:

    @*


    This is used for fields that are expected to take up more than one line. In this
    instance, the data is presented exactly as it appears in the original string.
    This is called a *multiline field*.


    Finally, you have a constructor that is used to wrap long text. It is called a
    *filled field*, and it looks like this:

    <<<<<<<<<<<<


    This is used anywhere you''d like to have multiple lines formatted in a specific
    way. For example, you might have something like:


    ![](img/407bedec2b2c349369b174a7f5fb6718_228_0.png)'
