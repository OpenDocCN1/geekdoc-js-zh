  md: '# APPENDIX


    # What’s on the CD-ROM


    The CD-ROM that accompanies this book contains the following:


    +   - Perl interpreter binaries for Red Hat Linux and Debian GNU/

    - Source Code Perl Distribution

    - Freeware version of Adobe Acrobat Reader 5.0

    - A self-assessment test to help you measure how much you have learned


    # System Requirements


    The following are the system requirements for running the CD-ROM:


    +   - A PC with a 486/DX or faster CPU

    - Linux or Unix operating system (software for other platforms is available on
    the Internet)

    - At least 32 MB of RAM

    - A minimum of 350 MB of disk space

    - A CD-ROM drive


    Although the software provided with this book is intended primarily for Linux
    and Unix systems, Perl interpreters are available for almost every computing platform.
    Generally, the code examples in the book should work on any platform. The main
    exceptions to this are programs that use the operating system. You will need to
    supply proper syntax for executable programs, file names, and directory paths.'
