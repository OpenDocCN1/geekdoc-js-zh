    \      /\\|/,$i);\n    # increment total user\n    $total_user++;\n    # etc...\n\
    }\n```\n\nOther information can be calculated by accessing the stored information\
    \ and using Perl to increment variables. Once the results have been tallied, you\
    \ can post the results to the user by simply printing out HTML with embedded Perl.\n\
    \n```\nprint <END>;n<HTML>\n<HEAD><TITLE>Results of Ice Cream Survey</TITLE></HEAD>\n\
    <body>\n<h2>Ice Cream Survey Results</h2><BR>\n<B>Total visitors:</B> $total_user<BR>\n\
    <BR><BR>\n<P>Thank you for submitting! If you have any additional comments, please\
