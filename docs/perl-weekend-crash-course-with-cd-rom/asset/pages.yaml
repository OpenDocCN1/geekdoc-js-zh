    One of the areas in which Perl excels is that of handling text. Indeed, Perl is
    a veritable textual Cuisart, chopping up lines and paragraphs, extracting some
    bits, and recombining them in new ways. This is one of the reasons Perl has become
    so popular for Web-based applications.


    # What’s a Regular Expression?


    The core of Perl''s text-fu is the regular expression. You can think of regular
    expressions as a sort of textual generality. It enables you to describe what a
    bit of text should look like without actually naming specific text. This sounds
    rather high-concept, but in practice it makes a lot of sense. Consider: if you
    stipulate that a certain character, the dot (.) can stand for any character you
    can construct expressions based on that idea. The expression h.t would be equivalent
    to the'
