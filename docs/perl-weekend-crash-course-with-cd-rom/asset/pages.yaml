  md: '# Some Perl Native Functions


    The remainder of this session is devoted to describing a selected set of Perl
    native functions. These functions will be used throughout the rest of this book,
    and as they are fairly common in Perl, it''s a good idea to memorize them as fully
    as you can. You should also feel free to follow what follows as a reference for
    further work. If a function deals with a concept we haven''t met yet, I will note
    it.


