  md: '# Session 23—A Case Study: The Database Interface Module


    # Using DBI Methods and Functions


    As you saw in Session 21, the DBI module uses object-oriented syntax. The module
    provides methods for creating database and statement handles that you can use
    to send SQL statements to the database.


    > Note A tutorial on the SQL language is outside the scope of this book. It should
    be largely evident from the statements themselves what they do. Their purpose
    is to illustrate the use of the DBI module, and not to teach you the language.


    # Connecting to a database server


    The first method that you need to learn is the DBI->connect method. This method
    establishes a connection to the database server, and creates a database handle
    for you to use as a target for your SQL statements. The DBI->connect method works
    like this:


    ```

    $dbh = DBI->connect($database, $username, $password);

    ```


    The variables that the DBI->connect method takes as arguments are just what their
    names imply. They can be defined before being passed as arguments, or they can
    be stated directly. The $database variable needs to be explained a bit. This value
    needs to be in the format:


    ```

    dbi:driver=database=<database name>:host=$hostname

    ```


    > The format will vary a bit from database to database. This is the proper format
    for MySQL. To find out about other databases, read their DBD perdoc pages, for
    example, perdoc DBD::oracle, to find the specific syntax for an Oracle database.


    Thus, an example of a connection statement might look like this:


    ```

    $dbh = DBI->connect("dbi:mysql:database=perl:host=localhost", "perl", "e492a")
    || die "

    ```


    Or, you might prefer a cleaner look:


    ```

    $database = "dbi:database=perl:host=localhost"

    $username = "perl"

    $password = "e492a";

    ```'
