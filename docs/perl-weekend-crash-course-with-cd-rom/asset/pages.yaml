    \ This may be true, but you'd be amazed at how easy it is to forget what you were\
    \ thinking when you wrote a bit of code. It is quite easy to write a piece of\
    \ a program one day, and come back the next to finish it, only to find that you\
    \ have no idea what you were thinking the day before. A well-styled piece of programming\
    \ should make the thought process clear.\n\nSecond, programming style refers to\
    \ the elegance and efficiency with which a programmer solves a particular problem.\
    \ Ideally, the problem be solved with as few steps as possible. Programs that\
    \ solve a problem in a roundabout way are usually disdaained as culdy or \"spaghetti\
    \ code\". These programs are not only elegant from a point of view, the also operate\
    \ inefficiently, using more time and computing power than necessary, wasting system\
    \ resources.\n\nThis session focuses on the first definition of style. The second\
    \ definition is something that mainly relates to a programmer's understanding\
    \ of general programming technique and the particular language in use, as well\
    \ as to her ingenuity in problem solving. As such, it is not particularly suited\
    \ to a short session. So, here I focus on clear structuring and presentation of\
