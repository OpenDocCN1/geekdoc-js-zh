  md: '# Session 24—Creating Your Own Packages and Modules


    If you choose to declare your package in this way, there are some additional requirements
    that you must meet before your package is ready to use. Just because you have
    declared your package does not mean that its subroutines can be automatically
    used in your programs exactly the same way as Perl native functions. In order
    to use one of your functions in your module you name it explicitly. Thus if you
    have a function in your module called foo(), you must invoke it in your program
    as mymod:foo().


    You can get around this by exporting your functions. In order to do this, you
    need to use:


    ```

    #!usr/bin/perl


    package mymod;


    require Exporter;

    @ISA=qw(Exporter);

    @EXPORT=qw(&foo);

    ```


    Any functions that you wish to export need to go inside the list of values for
    the @EXPORT variable. The @ISA variable is used to tell the interpreter where
    to look for methods that are not in the current package. In this context, you''re
    telling the interpreter that the Exporter module will tell it how to handle the
    values belonging to the @EXPORT variable. (If that seems confusing, don''t worry—just
    be aware that @ISA needs to appear whenever you use the Exporter module.)


    You have noted that freeing the name of your subroutine with an ampersand—&foo.
    This explicitly tags the name as a subroutine.


    You may be wondering at this point why, if this is an optional step, you would
    want to bother with it. The answer is, that in subroutines, you can also export
    variables, and (if you''re in the OOP thing) methods and classes. You can use
    other variables to tag subroutines, variables, and so forth optionally exported
    or not. In this way, you can keep the internal parts of the module from being
    accidentally messed up by being used wrongly in a program. For now, though, you
    don''t really need to worry about that. But be aware that using the exporter module
    gives you a lot more control over the structure of the package.


    # Invoke any other modules you need to use


    As with the Exporter module in the previous step, you are allowed to use other
    modules within your modules. If you do this, of course, you will need to have
    those other modules installed before yours work. It is important to be aware of'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'if you decide to share your module with others. You may want to include a list
    of dependencies as a comment in your module.


    # Declare any variables that are local to the package


