  md: '# What''s a Format?


    Simply put, a format is a way of defining how a certain type of output will be
    presented on the screen or page. It allows the programmer to create a template
    that will be used as the formal description for whatever output she chooses to
    plug into it.


    A format consists of constant elements, such as titles, column headers, labels,
    and the like, and variable elements whose values will be substituted into fields,
    whose form and location you can specify.


    # How to Create a Format


    There are three parts to a format: literal text, variables, and fieldholders.
    Fieldholders are special groupings of characters that tell the interpreter how
    the variable text is to be displayed. The three elements are grouped together
    in a format definition, which can appear anywhere in your program text. A typical
    format might look something like this:


    ```

    format MYFORMAT =

    HEADER1 HEADER2 HEADER3

    <<<<<<<< @<<<<<<< @<<<<<

    $datum1, $datum2, $datum3

    ```


    In this example, MYFORMAT is the name of the format. You will use a line later
    when you start directing output to the format. The dot by itself indicates the
    end of the format. The textual elements HEADER1,HEADER2, and HEADER3 are literal,
    and will be displayed as shown. The scalars $datum1, $datum2, and $datum3 are
    variable data, and the strings that look like <<<<<< are fieldholders. In this
    example, each fieldholder represents a nine-character, left-just string. The values
    of three variables will be loaded into the fields where the format is printed.


    Whenever you define a format, the layout you define is considered to be the most
    important feature. If the value of a variable is too long for the field to it
    corresponds, it will be truncated. If it is too short, it will be padded with
    spaces. Thus, if you define columns as I have done previously, the column format
    will always be preserved, even if the whole of your data isn''t.'
