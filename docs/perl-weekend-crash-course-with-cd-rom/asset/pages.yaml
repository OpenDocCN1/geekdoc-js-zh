  md: 'You should not feel as though you need to learn the entire language in this
    one session. (You have the rest of the book for that.) In general, you should
    focus on the terminology, and the basics of program construction.


    # Parts of Speech


    Computer languages are a lot like human languages. They''re not exactly the same,
    of course, but they''re similar enough that we can make meaningful comparisons
    between the two. Like human languages, computer languages have a grammar. They
    have "nouns" (variables), "verbs" (commands), and "objects" (operands and arguments).
    In this section, you''ll get a look at how some of these ideas are realized in
    Perl.


    # Statements


    A Perl program (or any program, for that matter) is a series of statements that
    gives instructions to the computer. In general, these statements can either direct
    the computer to perform an action, as printing something on the terminal screen
    or solving a math problem, or they can tell the computer something about the program
    itself.


    Statements that tell the computer something about the program are often used to
    change the way the program behaves in response to certain conditions. The components
    of a statement are functions and expressions. If you compare programming language
    to human language, functions would be the verbs, and expressions would be complex
    clauses. You also have nouns in variables. In Perl, every statement ends with
    a semicolon or with a closing curly brace.


    # Data


    A program isn''t very useful without a way of handling information — data. Programs
    hold data in the form of variables. Variables represent things. These things can
    be numbers, bits of text, words, expressions, or even other variables. In Perl,
    there are three types of variables:


    # Scalars


    Scalar variables hold single values. That is, any scalar value is a single number,
    a single bit of text, or something similar. Any value held in a scalar variable
    is'
