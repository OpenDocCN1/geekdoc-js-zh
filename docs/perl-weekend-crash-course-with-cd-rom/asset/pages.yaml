    (the underscore character is included in the word class).


    By this time, the alert reader has probably wondered how we go about matching
    the characters that we are using as our operators. What if, for instance, we want
    to match a period, or a real carat or asterisk? You do that by placing a backslash
    in front of that character. Thus


    ```

    \.

    ```


    indicates a literal period.


    ```

    \*

    ```


    indicates a literal asterisk. If you want to match a literal backslash,


    ```

    \\

    ```


    is the way to do it.


    # Multipliers


    We have already seen the asterisk character can be used as a multiplier to match
    zero or more occurrences of a character. Thus the expression


    ```

    B*

    ```


    will match B, BB, BBB, BBBBBB, and so on (or no B at all).


    A similar operator is the plus sign. The plus sign (+) matches one or more occurrences
    of the character immediately to its left. Thus'
