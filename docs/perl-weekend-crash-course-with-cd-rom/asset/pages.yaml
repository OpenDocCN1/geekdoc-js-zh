  md: '# SESSION


    ![](img/407bedec2b2c349369b174a7f5fb6718_258_0.png)


    ![](img/407bedec2b2c349369b174a7f5fb6718_258_1.png)


    # Using Packages and Modules


    # Session Checklist


    +   - Learning why to use modules

    - Meeting the conditions for using modules

    - Using the require and use functions

    - Using module functions


    # Why Use Packages and Modules?


    There are several reasons why modules and packages offer advantages to you, the
    programmer:


    +   - Less work for you: Using packages from the CPAN archive allows you to take
    advantage of a lot of useful functions that have been written by other programmers,
    saving you the trouble of having to write them yourself. A further advantage here
    is that the modules in the CPAN archive have been used and tested by others, so
    that you can be assured they work.

    - More functions for you: The module system has made Perl a truly extensible language.
    The extensions represented by modules create a “bigger” Perl — one that is able
    to handle complex tasks with relative ease.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Interfaces to other languages: Many of the modules that are available designed
    to allow you to use other languages'' functions in your Perl program. For example,
    the DBI module (which we''ll look at in a bit depth in Session 23) allows you
    to talk to database servers in their native language — Structured Query Language
    (SQL). By embedding your SQL calls within a Perl program, you can use Perl functions
    to manipulate the data returned by the SQL calls. The Perl/Tk module allows you
    to use the Tk toolkit to create graphical applications.


    +   * Platform independence: Many modules are designed to provide a set of functions
    that operate in a consistent way on different operating systems. Functions originally
    written on a Macintosh system that might need to be rewritten can often be rewritten
    using modules so that they will operate exactly the same way regardless of the
    operating system.


    +   * Better program organization: When writing a large piece of software, it
    is best to move subroutines out their own package. This allows you to keep the
    program small and streamlined. This is conceptually helpful that the simpler you
    can keep the program, the more clearly you''ll be able to think about it. Moving
    the block of the programming detail into packaged subroutines also forces you
    to organize your data in a neater fashion. Variables that are local to subroutines
    in the subroutines do not get confused with global variables.


    +   * Easier reuse of code: If you had created a package for one program, you
    might find some of the functions you have written are useful in some-else you''re
    working on. Using those functions is as simple as calling the module in the current
    program. (This is another aspect of the first advantage, “less work for you.”)


    +   * The ability to share your code: One of the things that makes Perl such a
    vibrant and robust language is the contribution of programmers all the world sharing
    their code. If you believe you''ve written might be useful to others, modules
    give you a convenient way to make it available to others to use. (You might even
    consider donating it to CPAN.)


    # Using Modules


    Once you''ve got a module installed, it''s ready to be used. In order to use the
    module in your own program there are two things you have to do: Have to declare
    that you''re intending to use that particular module, and then you have to actually
    use the module''s functions in your program.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Session 22—Using Packages and Modules


    @INC


    In order to import the functions of external modules into your program, two conditions
    must be met. First, the module must reside in a directory whose full path name
    is included in the special variable @INC. If you want to see what the current
    value of @INC is on your system, use this command:


    ```

    perl -e ''print @INC;''

    ```


    The value should look something like this:

    /usr/lib/perl5/5.00503/1386-linux/usr/lib/perl5/5.00503/usr/lib/perl5/5.005/1386-linux/lib/perl1/5.005


    The interpreter looks for modules in these directories. If you''re using modules
    from CPAN, it is almost certain that when you installed the module it was placed
    in one of these directories. If you''re using a module of your own creation, you
    should either place it into one of these directories, or modify @INC to include
    the name of the directory where you put it. You can do that with the command


    ```

    perl -I /home/joe/mymods

    ```


    Or, you can do it from within your program with a command

    push(@INC, "/home/joe/mymods");


    which would add the directory at the end of @INC, or

    unshift(@INC, "/home/joe/mymods");

    which would add it at the beginning.


    ![](img/407bedec2b2c349369b174a7f5fb6718_260_0.png)


    Using push or shift in this way will affect the value of @INC only for the duration
    of your program. The basic value of @INC is built into the Perl interpreter when
    it is compiled.


    # use and require


    The second condition that must be met is that you must explicitly declare in your
    program that you intend to use that module. You can do this using either the use
    or require command. Both of these will incorporate the module''s code into your
    program. The difference between the two has to do with the way in which the module''s
    code is incorporated into your program.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 236 Sunday Morning


    require access to the simpler of the two. It simply loads the module code into
    memory and provides access to the subroutines. use on the other hand allows for
    a good deal of initialization and symbol table manipulation before your code is
    actually executed.


    Which should you use? It depends on what you''re doing. If you''re intending to
    use a simple set of functions — perhaps a module that you''re writing yourself
    — use require. It''s much easier on system resources. On the other hand, if you''re
    using a CPAN library with advanced functions, use it. It will make sure that all
    of the functions are initialized properly.


    # Using Module Functions in Your Programs


    Once you''ve made the module declarations that you need for your program, it only
    remains to use the functions in your program. The functions you''ll need to will
    vary from module to module. The first step, is to read up on your module, and
    see how it''s used. You can do this by reading the perdoc pages. For example,
    if you wish to see the documentation for the IO::Socket module (which provides
    certain interacting network functions), see the command


    ```

    perdoc IO::Socket

    ```


    # Object-oriented programming


    Many Perl modules use object-oriented programming techniques. Perl has a syntax
    to handle this, and fortunately it''s not much of a difference from normal Perl
    programming.


    Object-oriented programming, or OOP, has become very trendy in recent years, and
    there are plenty of good reasons for that. Unfortunately, the jargon that has
    grown up around it can be confusing to a novice. Talk of objects, classes, methods,
    and so forth can be enough to make you wonder why you got interested in programming
    in the first place.


    If you are familiar with another object-oriented language such as C++ or Java,
    then you already know how OOP techniques work. If you''re not, here''s what you
    need to know to do simple OOP in Perl.


    An object is nothing more than a big chunk of data. You can think of it as a sort
    of compound variable made up of other variables. The values of the'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Session 22—Using Packages and Modules


    various variables control aspects of its behavior. You don''t have to grapple
    directly with the object. Rather, you manipulate it by means of a method. A method
    is a kind of function that the module''s (and hence, the object''s) programmer
    has created precisely for the purpose of manipulating the object.


    A method is invoked by means of the arrow operator (->). For example, if I wanted
    to call a method called foo on an object called bar, I might do it like this:


    ```

    $handle = bar->foo;

    ```


    In addition, a method might take arguments, which are often attributes that we
    wish to ascribe to the object. Thus,


    ```

    $handle = bar->foo(arg1, arg2, arg3);

    ```


    is seen. Once the method has been called, the variable to which the result has
    been assigned is often a handle (like a filehandle or a directory handle) for
    referring to that object. For example, here''s how you connect to a database using
    the DBI module (we''ll cover DBI in more detail in Session 23):


    ```

    $dbh = DBI->connect("database","username","password");",

    ```


    The connect method is one that is used to create a new database handle, and so
    is called directly from the DBI class. $dbh is a database handle, and is now the
    object upon which you will call further methods. If you want to prepare an SQL
    statement to be sent to the database you would:


    ```

    $sth = $dbh->prepare("some SQL statement");

    ```


    Now you have a second object handle, $sth, which refers to the given SQL statement.
    You can execute that statement on the database server by doing


    ```

    $sth->execute();

    ```


    Once you''ve done that, you have means of extracting the data that the database
    returns.


    The point of all this is despite the fact that OOP terminology often seems difficult,
    it actually makes it easier to deal with complex operations.


