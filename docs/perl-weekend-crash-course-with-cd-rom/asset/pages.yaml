    creates a reference, $ref, to a scalar variable, $var. $ref itself does not contain
    the value of $var, rather it contains the address (location in memory) of $var.
    For example, if you had the program


    ```

    #!/usr/bin/perl


    $var = "foo"

    $ref = \var;

    print "$ref \n";

    ```


    you would get output that looks something like


    SCALAR(0x80e4ae8)


    In order to use the reference to extract the value from $var, we must de-reference
    it. This is done using the dollar sign, like so:


    ```

    #!/usr/bin/perl


    $var = "foo"

    $ref = \var;

    print "$$ref \n";

    ```


    Now, your output will be foo.

    Likewise, you can create a reference to an array:


    ```

    #!/usr/bin/perl

    ```


    ```

    @list = ("foo", "bar", "baz", "hejaz");

    $ref = \var;

    print "@$ref \n";

    ```


    Notice to de-reference your array, you had to use the @ symbol. You could also
    access a single member of the array like this:


    ```

    print "$$ref[0] \n";

    ```


    It should be clear that if you want to de-reference a variable, you do so by prepending
    the symbol of the type of variable that it is to the scalar name of the reference.
    Thus, for a hash:


    ```

    #!/usr/bin/perl

    ```'
