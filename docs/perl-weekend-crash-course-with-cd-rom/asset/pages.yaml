- img_proc: true
  md: "# Function-oriented vs. object-oriented\n\nIn function-oriented mode, you import\
    \ the CGI functions into your script's namespace, and then call them directly.\
    \ An example of a simple function-oriented script is shown next:\n\n```\n#!/usr/bin/Perl\n\
    use CGI qw=/standard;\nprint header(),\nstart_html(-title=>'Function-Oriented\
    \ Generation',\n       -BGCOLOR=>'red',\n       -author=>'user@foo.com'),\nh22('Function-Oriented\
    \ Generation')\n'This has been generated using CGI.pm in function-oriented mode.',\n\
    end_html();\n```\n\nIn this script, you use :standard set of function definitions,\
    \ which include the HTML generation functions.\nIn object-oriented mode, we use\
    \ CGI; and communicate with CGI.pm using a CGI object. This object contains all\
    \ of the information about the current CGI transaction, including values passed\
    \ to the CGI. An object-oriented version of the script may look like this:\n\n\
    ```\n#!/usr/bin/Perl\nuse CGI;\n$query = $query->header,\nprint $query->start_html(-title=>'Object-Oriented\
    \ Generation',\n       -BGCOLOR=>'red',\n       -author=>'user@foo.com'),\n$query->h2('Object-Oriented\
    \ Generation'),\n'This has been generated using CGI.pm in object-oriented mode.',\n\
    $query->end_html();\n```\n\nNote that in this instance of the script, we create\
    \ an object $query and the arrow operator to de-reference it, then call the function\
    \ in CGI.pm. The examples of code in this session will use the object-oriented\
    \ mode."
  merge: -1
