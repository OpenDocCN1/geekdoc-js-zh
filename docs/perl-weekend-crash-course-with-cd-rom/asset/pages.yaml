  md: '# Session 14—Advanced Input and Output: File Manipulation


    # chown


    Like chmod, chown does the same thing as the Unix command of the same name. It
    changes the owner of a file. The first argument must be the numerical user ID
    (UID) of the file''s new owner. The second argument must be the numerical group
    ID (GID) of the new owning group. All arguments after that are the names of files
    to be changed. For example,


    +   chown 501, 505, /home/joe/somefile:


    # How and When to die


    You have already seen the die function. This function causes your Perl program
    to abort, and prints an optional error message. The die function is especially
    useful as an adjunct to the open function:


    open(HANDLE, /sedir/somefile) or die-“could''t open somefile":


    This prevents the program from going on if the specified file is not available
    for any reason. This lets you know the reason your program isn''t working is that
    some file isn''t available, rather than a bug in the code. (If you hadn''t used
    the die function, the program would produce errors when the expected input is
    nowhere to be found.)


    In general, when you open a file, especially for reading or appending, you should
    include a die statement to handle any problems that may be a result of file availability
    problems.


    # SUMMARY


    In this session, you learned about file manipulation. You might want to use files
    as sources of input and destinations for output. You continued by learning how
    to use the open function to open files and create file-handles. You learned to
    extract data from files, and to direct output to them. Finally, you learned some
    appropriate ways in which to use the die function.'
