  md: '# Assignment Operators


    You have already seen the basic assignment operator =. This operator takes a variable
    name on the left side, and an expression on the right. Thus,


    ```

    $a = 2+3;

    ```


    assigns the value of the expression 2+3, or 5, to the name $a. In addition, there
    are a bunch of ways to work a mathematical operation into the assignment. Consider
    the following:


    ```

    $a = 1+1;

    $a += 1;

    ```


    The value of $a after these two statements is 2. The += operator simply adds the
    value on the right-hand side to the current value of the variable. In other words
    the expression


    ```

    $a += $b;

    ```


    is the same as


    ```

    $a = $a + $b;

    ```


    Likewise, the -- operator performs the same operation, but incorporates subtraction.
    That is,


    ```

    $a -- $b;

    ```


    is the same as


    ```

    $a = $a - $b;

    ```


    Similarly, *= applies multiplication, /= applies division, and **= applies exponentiation.


    # Increment and Decrement Operators


    The increment and decrement operators work along the same lines as the mathematically
    active assignment operators described previously. The function of an increment
    operator is to raise the value of a variable by 1, and the function of a decrement
    operator is to lower the value of a variable by 1.'
