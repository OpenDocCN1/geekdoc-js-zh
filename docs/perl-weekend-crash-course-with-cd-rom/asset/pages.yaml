    While managing a site, often you will wish to standardize the appearance of each
    of the pages within your site. You can use SSI to include a common header/or footer
    within a site. To do this, create a file that includes all of the code you would
    like in your footer. The include element can be coupled with either the file key
    or the virtual key. The file key requires that the file path be relative to the
    current directory, cannot include the / or .. character sequences as part of the
    file path. The virtual key specifies a URL relative to the file being served,
    and must exist on the server:


    ```

    <-- include virtual="/common/footer.html" -->

    ```


    SSI can also execute commands in the shell using the exec element:


    ```

    <-- exec cmd="ls -l" -->

    ```


    This means that any code embedded in the exec element will be executed. This can
    be incredibly dangerous. However, you can configure Apache to allow SSI, but disapp
    the exec element by adding


    Options +IncludesNOEXEC


    Through the use of SSI, you can embed dynamic content that is processed by the
