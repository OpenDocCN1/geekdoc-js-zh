  md: "# Session 26—References\n\n# 281\n\nyou did a de-reference on $name($name),\
    \ which was never a reference. What happened here?\n\nWhen you de-referenced $name,\
    \ you told the interpreter that you wanted to use the value of $name as a fake\
    \ reference. It created the scalar $var out of the value of $name, and then treated\
    \ the de-reference as if it were a de-reference that actually existed, thus assigning\
    \ the value hello there to the implicit $var.\n\nIf you had done\n\n```\n@$name\
    \ = (something)\n```\n\nwe would instead created a list variable called @var instead\
    \ of a scalar. This can be a little dangerous. The Perl interpreter assumes that\
    \ you know what you're doing when you throw de-references around. It is very easy\
    \ to intend to use a hard reference, but accidentally use a symbolic reference.\
    \ To guard against this, you can turn off the strict refs pragma to restrict references\
    \ by this:\n\n```\nuse strict 'refs':\n```\n\nThis will tell the compiler not\
    \ to use symbolic references, and you will get an error if you do so. If you need\
    \ to use a symbolic reference in some portion of your program, you can turn off\
    \ the strict refs pragma by giving the command:\n\n```\nno strict 'refs':\n```\n\
