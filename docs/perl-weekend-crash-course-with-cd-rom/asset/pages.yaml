  md: '# Session 19—Formats 209


    # # Top-of-Page Formats


    Top-of-page formats are a special subspecies of format that are intended to be
    used when you plan to print your output. When writing to a formatted filehandle,
    the existence of a top-of-page format will cause the Perl interpreter to arrange
    your output in groups (60 lines by default, but you can change that). If an entry
    in your format won''t fit in the current page''s remaining lines, the interpreter
    will print a form-feed character, and reprint any header-type information that
    may be contained in the top-of-page format.


    > Keep in mind that any top-of-page format is related to another regular format,
    and a top-of-page format cannot function by itself.


    ![](img/407bedec2b2c349369b174a7f5fb6718_234_0.png)


    A top-of-page format is created by defining a format in the same way that you
    would for an ordinary format, but the name of a top-of-page format always ends
    with _TOP. Thus, you could define a top-of-page format for your earlier catalog
    like so:


    ```

    format CATALOG_ENTRY_TOP =

    Catalog of inventory items.    Page@$\$

    ```


    Now, whenever you write to the CATALOG_ENTRY_format, the output will be broken
    up into pages, and the header you specified above will be added to each page.
    $% is a special variable that keeps track of the number of times the top-of-page
    header has been called, and thus makes a handy page counter.

    As I mentioned previously, the default number of lines per page is 60, however,
    if you need to change it, you can do so by setting the variable $-. This variable
    contains the number of lines per page for the current filehandle. You must make
    sure that the variable in the filehandle is the one to you want to apply the format.
    If you set the variable in the wrong place, you could end up changing the value
    for the wrong format. $- takes the simple number of lines per page as a value.


    ```

    $- = 50;

    ```


    would set the value at 50 lines per page.

    As with ordinary formats, you can change the top-of-page format name so that the
    top-of-page format being used is a different one. You do that by setting the'
  merge: -1
