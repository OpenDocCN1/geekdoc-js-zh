  md: "The most common form of a control structure is\ncontrol-operator ( expression\
    \ ) {\ncode: }\n\nHowever, it is also possible under certain circumstances to\
    \ have (\ncode:\n} control-operator ( expression )\n\nThe difference between the\
    \ two of these is that in the first, the expression is evaluated after the code\
    \ is executed, whereas in the second, the code will always be executed once, whereas\
    \ in the first, depending on the expression, it may not be executed at all. (Of\
    \ course, Perl being Perl, there are ways of bending the rules here.)\n\n# # Conditional\
    \ Structures\n\nThe easiest control structure to grasp is the conditional type.\
    \ Conditional structures allow us to write a block of code that will only be executed\
    \ if a certain condition is true or false.\n\n# # if\n\nWe have already seen many\
    \ examples of if constructs. If allows us to create a block of code that will\
    \ only be executed if the expression evaluates as *true* (that is, returns a value\
    \ of 1). Consider the following:\n\n```\n$name = \"Bill\";\n```\n\n```\nif ($name\
    \ eq \"Bill\") {\n    print \"The name is correct! \\n\";\n}\n```\n\nIn this example,\
    \ the print statement will only be executed if the variable $name holds a value\
    \ of *Bill*. In this case it does, so the print statement is executed. If we were\
    \ to change the first line to\n\n```\n$name = \"Sandy\";\n```"
