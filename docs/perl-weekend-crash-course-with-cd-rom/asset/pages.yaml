  md: '# 42


    # Saturday Morning


    something a little more generic. Office applications tend to use file formats
    involving a great deal of layout instructions, which make the document look nice
    but are alien to the Perl interpreter.


    The Perl interpreter deals with ASCII text characters. ASCII text is a very simple
    text format that assigns a number to each character you might type, as well as
    to a few invisible characters such as the carriage return (or newline) and the
    tab character. This scheme produces files that may not look very fancy, but that
    can be read by any program—including the Perl interpreter.


    Once these ASCII text files are created, they can be saved to your computer''s
    hard drive just like any other file. But how do you create them in the first place?
    In order to do that, you need to use a program known as a text editor. You might
    think of text editors as stripped-down word processors. That is, you can manipulate
    text, but you cannot control the font or other visual attributes of the document
    beyond what you can accomplish by using spaces, tabs, newlines, and the like.
    (Some of us prefer to use word processors as gussied-up text editors, but we''re
    probably hopelessly behind the times.)


    ![](img/407bedec2b2c349369b174a7f5fb6718_67_0.png)


    > While it is theoretically possible to create text files with a word processor
    as Microsoft''s Word, I don''t recommend it. Word processors always seem to have
    their own agendas, and I''ve found my attempts at ASCII file creation to have
    been something of a battle. Text editors make the job much simpler.


    I have chosen in this section to discuss three text editors: two of them, Pico
    and Edit are Unix or Linux programs, and the third, WordPad is native to Microsoft''s
    Windows family. The reason that I have two Unix editors is because one of them
    is a character mode editor (that is, it can be used without any kind of graphical
    software running) and the other is a graphical editor with many new features.
    On the Windows side of thing, WordPad is pretty much the game in town. While and
    it comes with the standard Windows package, unless you prefer something else,
    there''s really no reason not to use it.


