  md: '# General programming tools


    General programming tools are exactly what their name implies they are – tools
    that help you write programs.


    # Benchmark


    The Benchmark module contains functions for seeing how fast given pieces of code
    will run. Some of its functions and methods are


    +   - timethis: Runs a piece of code several times.

    - timestep: Runs several pieces of code several times.

    - timit: Runs a piece of code to see how long it takes.

    - new: Creates a new benchmark object.


    # Config


    The Config module enables access to the Perl executable''s configuration information.
    Here''s a sample script that will print out this information:


    ```

    #!/usr/bin/perl


    use Config;

    use Config qw(myconfig config_sh);

    print myconfig();

    print config_sh();

    ```


    # Env


    The Env module enables access to your system''s environment variables. These variables
    are stored in a hash %ENV. You can see these environment variables by running
    this program:


    ```

    #!/usr/bin/perl


    use Env;

    use Env(PATH);

    print $PATH;

    ```'
