  md: "# Subroutine References\n\nIn addition to variables, references can also be\
    \ created to anonymous subroutines. This is a somewhat less formal way of going\
    \ about subroutines. You create subrou-ine references implicitly by assigning\
    \ a anonymous subroutine to a scalar variable name, like so:\n\n```\n$subref =\
    \ sub {\n  some code;\n};\n```\n\nNote the semicolon here. This is necessary because\
    \ the code block is part of an assignment statement. This wouldn't ordinarily\
    \ be necessary in a named subrou-tine. Once you've created a subroutine reference,\
    \ you can de-reference it like so:\n\n```\n$$subref;\n```\n\nIf there are arguments\
    \ to be passed to your subroutine, they are simply enclosed in parentheses:\n\n\
    ```\n$$subref(arg);\n```\n\n# Symbolic References\n\nThe references discussed\
    \ previously are known as hard references. That is, when a reference is created,\
    \ it exists, and things that access that reference are accessing the thing it\
    \ refers to, without calling by name.\n\nBut, what happens if we call something\
    \ using a reference that hasn't actually been created? When this happens, we create\
    \ a symbolic reference, which is really just another name for something. If that\
    \ seems a bit confusing, perhaps an exam-ple will clear it up:\n\n```\n#!/usr/bin/perl\n\
    \n$name = \"var\";n$$name = \"hello there\";nprint $var;\n```\n\nThe output of\
    \ this program will be hello there. Did you see what happened?\nThe variable $var\
    \ was never explicitly assigned. As if that weren't affront enough,"
