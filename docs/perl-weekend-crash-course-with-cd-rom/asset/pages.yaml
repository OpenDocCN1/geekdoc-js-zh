    # The Standard Library


    # Session Checklist


    +   - Deciding which modules to install

    - Looking at modules in the standard library

    - Looking at a few nonstandard modules


    Now that you understand the ins and outs of using packages and modules, you need
    to know what kinds of modules are available for use. While it is possible to search.cpan.org
    to find any given module, that''s not necessarily going to help you if the module
    you need is part of the Perl Standard Library.


    # Which Modules Do You Need?


    The basic Perl distribution comes with a good number of packages and modules already
    installed. Some of these are so basic to the functioning of any even moderately
    complex Perl program that it would be almost impossible to run a decent system
    without them. Others are not quite so basic, but are popular enough that the'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Perl developers thought it was worthwhile to include them in the basic Perl
    package. All of these packages are part of the Standard Library.


    In addition there are certain modules that, while not necessarily so as to necessitate
    its in a default installation, are useful enough that the odds are that you will
    find yourself installing them at some point. Why not install everything? That''s
    one strategy. If you''ve got the disk space on your computer, and the processor
    speed to handle large directories every time you try to load a module, you may
    well want to install everything. On the other hand, what are the odds that you''re
    actually going to use the Math::Spline module? In practice, you''ll end up installing
    a combination of modules that you may find useful, along with those that are required
    in order to make something else.


    Case in point: I have a lot of less-used modules on my system because at one point
    I worked for the people who develop the code that runs the Slash Web site. I made
    it necessary for me to run the Slashcode on my computer, so that I could look
    at how it works. Before I was to run the Slashcode, I had to install a whole set
    of modules that the Slashcode developers had used in the course of their work.
    Fortunately, all these modules were packaged in a bundle, so I merely had to give
    the command `install Bundle::Slash` at the `cpan>` prompt in order to install
    them all. Now that I no longer need to run that code, I have no need for those
    modules, but there''s no point in removing them from my computer. They''re not
    doing any harm, and who knows — I might need them again some day.


    But probably won''t. Most casual Perl programmers will do just fine with modules
    that installed by default, and a few of the more popular downloadable modules.


    # The Standard Library


    Those modules that come packaged with the Perl distribution are known as the *Standard
    Library*. These are modules that you should not have to install because they are
    already on your system. While many of them are quite useful, you may find that
    you never even look at certain others. Some of the modules are only useful for
    Perl developers. Others will not interest you if you do not any network programming.'
