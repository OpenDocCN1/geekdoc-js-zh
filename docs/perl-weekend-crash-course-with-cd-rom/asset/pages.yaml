- img_proc: true
  md: "Briefly put, a variable is a name that we can associate with one or more values.\n\
    For example, consider the algebraic equation:\nX=100\n\nHere, the X is the name,\
    \ and 100 is the value. We can also be less direct about it:\nX=50+50\n\nand we\
    \ can define it in terms of another variable:\nX=10Y (where Y=10)\n\nEven though\
    \ the right side (the value side) takes different forms, the value of X\nremains\
    \ the same in all three examples.\nHowever — and this is the key part — there’\
    \ no particular reason why the value\nof X has to be 100. It just happens to be\
    \ in all of these examples, but that’s\npurely a contrivance on the part of the\
    \ author. X could also be 1, 512, stepping\nout of a mathematical context, the\
    \ word “fish.”\n\nIn programming, we also add another dimension to picture: the\
    \ value of any\nparticular variable can change — so we have to think not only\
    \ what the\nof a variable is, but at what point in the program's execution it\
    \ holds that\nvalue.\n\nOne way to think about variables is to think of any variable’s\
    \ name as a\ncontainer — say, a can. At one point, the can may be empty, at another\
    \ point,\nit may be filled with water. At still another, it may be filled with\
    \ sand. This is useful\nbecause the name of the can is always the same. At any\
    \ point, you are able to say,\nLet’s see what’s in ‘can X’ right now, or you can\
    \ decide to dump the contents\nof ‘can X’ and fill it with something else.\n\n\
    Why would you want to do this? For one thing, you can make decisions based\non\
    \ the contents of your can. We have already seen the if construct in previous\n\
    sessions. Although we haven’t treated it formally, its function is fairly obvious\
    \ — it\nexecutes code based on a certain condition. In other words, you can say\
    \ the pro-\ngram equivalent of:\n\n```\nif (“can X” is filled with coffee) {\n\
    fry an egg;\n}\n```\n\nIf there is water in the can, and not coffee, the egg will\
    \ not be fried. Likewise,\nif there is sand in the can. The egg will only be fried\
    \ if the can is filled with cof-\ffee. You can see that in this way, you can make\
    \ decisions about your pro-\ngram is to do by manipulating the values of your\
    \ variables."
