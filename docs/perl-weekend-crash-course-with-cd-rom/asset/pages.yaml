  md: '# Session 11—Basic Input and Output


    other processes. We will discuss them in Session 14. Other than the fact that
    STDIN and STDOUT are the standard and often the default, there is nothing partic-lar
    about them.


    # STDERR


    One place we might want to send output other than the standard output, is the
    standard error. This is the default location for error messages. The Perl token
    for the standard error is, not surprisingly, STDERR. Very often, the standard
    error is the same as the standard output, but not always. Under Unix systems,
    it is possible to redirect the standard error to to some place other than the
    terminal screen. For example, you may want to redirect the standard error to a
    log file so:


    ```

    unix_prompt> myprog.pl 2>logfile

    ```


    # Files and devices


    In fact, STDIN and STDOUT actually represent files. As we will see in Session
    14, any input or output can be taken from or sent to a file. This points up Perl''s
    Unix heritage. In Unix, everything is represented as a file. Text files, binary
    files, programs, directories, hardware devices and so on are all files of Unix
    — alike with particular types of attributes. Using the tokens STDIN and STDOUT
    merely tell the program — by extension, the operating system — which files are
    being used. Every time you run a program in Unix, three files, or streams are
    opened, standard input, standard output, and standard error (see the next sect-ion).
    Under normal circumstances, the files that are associated with these are device
    files that correspond to the terminal which the pro-gram started.


    Under it is easy to rearrange the files to which standard input, stan-dard output,
    and standard error correspond, because, special attributes notwithstanding, a
    file is a file.


    Other operating systems have their own ways of dealing with input and output,
    and you should be aware of those, but aside from some particular-ities regarding
    naming conventions, the basic methods described in this session should work on
    any platform.


    ![](img/407bedec2b2c349369b174a7f5fb6718_136_0.png)'
