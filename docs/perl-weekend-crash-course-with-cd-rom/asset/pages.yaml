    and so on.


    We use the token STDIN because we are taking our data from the standard input,
    which is usually the keyboard. (I say "usually" here because it is possible to
    change the thing to which the standard input is attached. For example, on a Unix
    system, if you have your input piped from another process, or you redirected from
    a file, STDIN will use that instead. Throughout this book, however, and for the
    great majority of practical purposes, we are talking about the keyboard.)


    # Writing Output to the Screen


    We have already done a great deal of writing output to the screen. The statement
    print "Something";


    does automatically. There is, however, an assumption that the output of the print
    function is to sent to the standard output. The standard output is usually the
    terminal screen. (Although, as with the standard input, this can be changed.)
    If we wanted to make the assumption in the print statement explicit, we could
    do it like this:


    ```

    print(STDOUT, "Something");

    ```


