    | <FONT size=?></FONT> | Set the size of the font, from 1 to 7 |

    | <FONT color=?></FONT> | Set the color of the font, in name or hex value |

    | <FONT face=?></FONT> | Set the font typeface to use, if possible |

    | <P></P> | Create a new paragraph |

