    # Simple vs. compound expressions


    Most of the examples in the previous section are examples of simple expressions.
    Simple expressions are expressions that cannot be reduced to other expressions.
    The expression


    ```

    1+2

    ```


    is a simple expression, because there is no way to reduce it further without evaluating
    the whole thing. By contrast, the expression


    ```

    1+2+3

    ```


    is a compound expression, because it can be seen in terms of two separate expressions.
    To evaluate the expression, we first reduce it to another expression,


    ```

    3+3

    ```


    and then finally, to its unified value, 6.

    in programming, it is common to see such an expression such as

    $a = $b + 1;


    Here we have a compound expression in that we have an assignment, but the value
    that is being assigned is the result of another expression (the addition). Previously,
    we saw a compound logical expression:

    ("lion" eq "tiger") or ("horse" eq "horse")


    This is fairly obvious as a compound expression, but look at it formally. There
    are actually three expressions here:


    +   1. ("lion" eq "tiger")

    2. ("horse" eq "horse")

    3. (value of left side) or (value of right side)


