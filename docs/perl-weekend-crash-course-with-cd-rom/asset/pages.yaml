  md: '290 Sunday Afternoon


    In this way, HTML is less of a programming language and more of a method of formatting-content.


    HTML tags are of two types. The first type can be thought of as a switch. The
    tag turns on the formatting and must be turned off with another tag. The closing
    tag looks like the beginning tag except that the first character after the tag
    bracket is a slash (/). For example, this following code section shows two sentences.
    The first sentence, between the <B> and </B> tags, is boldface.


    <B>I am boldfaced.</B> I am not boldfaced.


    The other type of tag is the sort of tag that requires no closing tag. These tags
    are generally used to set the attributes of the area, or to insert an image as
    shown.


    ```

    <IMG src="http://www.someurl.com/image.jpg">

    ```


    Note that there is no <IMG> tag.

    While there are many HTML tags, three main tags are necessary to create an HTML
    document. The first is the tag that signifies to the Web browser that the document
    is an HTML document. This tag is <HTML>, and it generally appears on the first
    line of a HTML document. At the end of the HTML content of the page, a </HTML>
    tag is required to signify the end of the HTML content. The second main tag is
    the <HEAD> tag, which creates the header of the document. The header contains
    all of the information that is not displayed in the page itself. A closing tag
    of </HEAD> is required at the end of the header content. The final necessary tag
    is the <BODY> tag. It is used to set the body of the document off from the other
    parts of the document.


    Using just these tags, here is the skeleton of a Web page in the source code shown
    here.


    ```

    <HTML>

    <HEAD>

    <TITLE>I am the title of the document</TITLE>

    </HEAD>

    <BODY>

    I am the body of the document.

    </BODY>

    </HTML>

    ```


    However, this HTML document has defined no text color, no background color, and
    none of the general attributes of the page. There are additional attributes to'
  merge: -1
