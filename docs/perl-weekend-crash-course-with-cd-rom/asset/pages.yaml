  md: '# Session 5—Using Text Editors


    A buffer is an area in your computer''s memory that a program reserves for its
    own use. When you start Pico, it reserves a buffer for the file you''re working
    on. When you save the file, the contents of the buffer will be written to the
    hard drive.


    The information line is the text area. This is the area where you actually do
    your work. Finally, at the bottom, there are two lines that serve as reminders
    of some of Pico''s most commonly used functions. These functions allow you to
    do such things as save the file, exit Pico, move from page to page, find a particular
    string of text, and so on.


    All functions in Pico are invoked by using the Control key (Ctrl) with letter
    keys. Thus the combination meaning Exit is ^X.


    > In Unwise, the carat character, ^, is used to denote the Control key.


    You should enter a cursor in the text area. To enter text in Pico, simply begin
    typing. Your text will appear at the cursor. As you might expect, you can use
    your keyboard''s arrow keys to move around in the text. You can also use the sequence
    ^A to go to the beginning of the current line, and the sequence ^E to go to the
    end of the current line. If you make a mistake, you can use the Backspace key
    to delete the text immediately to the left of the cursor. Other control sequences
