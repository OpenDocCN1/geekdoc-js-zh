  md: '# File Test Operators


    The final class of operators are those used for testing the attributes of files.
    In using these operators, you will wander into that area of programming known
    as system programming, because you will be using Perl to call functions of the
    operating system.


    Very often when programming, you may want to open a file or a directory for reading
    or writing purposes. I will discuss the procedure for doing this in Session 14,
    but for now, you simply need to be aware that this is a common way of getting
    data into and out of your programs.


    However, sometimes before you attempt to open a file, you may want to determine
    if a file exists; its type, owner, other attributes. Perl gives you a number of
    operators, shown here in Table 10-4, to deal with these kinds of situations.


    # Table 10-4

    File Test Operators


    | Operator | Function |

    |---|---|n| -e | Tests that file exists |

    | -s | Returns file size |

    | -z | Returns true if file has size 0 |

    | -f | Returns true if file is a plain file |

    | -d | Returns true if file is a directory |

    | -l | Returns true if file is a symbolic link |

    | -p | Returns true if file is a named pipe |

    | -S | Returns true if file is socket |

    | -T | Returns true if file is a text file |

    | -B | Returns true if file is a binary file |

    | -r | Returns true if file is readable by UID under which program is running
    |


