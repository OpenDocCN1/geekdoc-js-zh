- img_proc: true
  md: '# 302 Sunday Afternoon


    <P>Please select your favorite flavors of ice cream:<BR>

    <SELECT multiple name="icecream" size="4">

    <OPTION>Vanilla

    <OPTION>Chocolate

    <OPTION>Strawberry

    <OPTION>Butter Pecan

    <OPTION>Mint Chocolate Chip

    <OPTION>Coffee

    <OPTION>Chocolate Chip Cookie Dough

    </SELECT></P>


    In the select multiple name="icecream" size="4" tag shown previously, the name
    associated with this select is icecream. icecream is called the key of this select.
    When a user submits this form, and has selected Vanilla as her favorite ice cream
    flavor, the value of key is set to Vanilla. This is a key-value pair, which looks
    like:


    ```

    icecream=Vanilla

    ```


    Later in this session, I''ll show you how this data is sent to CGI program, and
    how to parse and use it.


    Another method of extracting data from HTML forms is to use the environment variables.
    CGI is a set of environment variables that the Web server sends to every CGI program
    run. Our CGI program can parse these variables and use the data they hold. Our
    environment variables are contained in a hash called ENV.


    A table of the variable names and the associated values is shown in Table 28-1.


    Table 28-1 CGI Environment Variables

    | Variable Name | Value |

    |---|---|n| SERVER_ADMIN | E-mail address for the server''s Webmaster |

    | SERVER_NAME | Server''s fully qualified domain name |

    | SERVER_PORT | Port number the server is listening |

    | SERVER_SOFTWARE | server software you''re using |

    | SCRIPT_FILENAME | full pathname of current CGI |

    | SCRIPT_NAME | pathname relative to document root |

    | REQUEST_METHOD | GET or POST |'
