  md: '# What''s an Expression?


    Expressions are the work engines of a program. You use expressions to assign the
    values of variables, perform computations, evaluate conditions, and so on. It
    is through expressions that the logical action of the program is articulated.


    In formal terms, an expression is a series of variables, constants, operators,
    functions, and/or methods that evaluates to a single value. That last part is
    important. In order to be a valid expression, the result of combining all the
    elements you''ve put together must be a single unary value.


    This may sound a little esoteric, but in practice, it''s very simple. Here''s
    an example of an expression:


    ```

    1+2

    ```


    It doesn''t get much simpler than that, but if you look at it, you''ll see that
    we''ve satisfied the requirements: we have an operator, the plus sign, and two
    constants. When you combine these through the action of the operator, you get
    a single resulting value: 3.


    It is not necessary for an expression to be a mathematical one. The comparison
    of text strings is also an expression. Consider


    ```

    "tiger" eq "lion"

    ```


    In this expression, the eq operator tests two strings to see if their values are
    the same. In this case, they are not the same, so the value of the expression
    is false. In the eyes of the Perl interpreter, the condition of falsehood is represented
    by the number 0, which, of course, is a single unified value. Expressions can
    become more complicated as well. For example,


    ```

    2x3y(2xy)

    ```


    can be valid (non-Perl) expression, provided that you know the values of x and
    y. Likewise logical expressions can be complex. For example,


    ```

    ("tiger") eq "lion") or ("horse") eq "horse"

    ```


    is a complex expression that evaluates as true (or 1) since the right side is
    true, and the logical or or operator returns a value of true if either side of
    the expression is true.


    Some operations return a value depending on the success or failure of some other
    task. For example,


    ```

    $a=1;

    ```'
