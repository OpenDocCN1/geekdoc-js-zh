    # REVIEW


    In this session, you learned how to conceptualize expressions and statements.
    First, you learned that expressions are the simplest unit of programming, and
    that they must always evaluate to a single indivisible value. You learned that
    expressions can be combined to yield compound expressions. You learned how expressions
    evaluate, and save the order of precedence for the operators in Perl. You then
    went on to learn the properties of statements. You learned that statements are
    the commands that are given to the Perl interpreter in order to get it to perform
    your desired tasks. You learned that statements, like expressions, can be of a
    simple or compound nature. You learned that compound statements evaluate from
    the inside out. Finally, you learned that blocks of statements, whether part of
    a control structure or freestanding, can be considered compound statements.


