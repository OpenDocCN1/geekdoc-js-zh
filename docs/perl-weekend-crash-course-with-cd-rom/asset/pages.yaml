  md: '# What''s a database?


    A database is really nothing more than a way of organizing data so that related
    pieces of information can be associated and recalled. Remember your /etc/passwd
    file? This is a very special kind of database. The file contains a line for each
    user on the system and each line contains various pieces of information related
    to that person. This sort of thing is known as a flat file database. However,
    it is also possible to construct databases where each piece of data may be related
    to many other things. These sorts of multidimensional databases are often of substantial
    complexity and require special software called database servers to keep track
    of how the information is organized.


    Database servers operate like any other kind of server. They listen on a network
    port, and respond to incoming connections. Once connected to a server, a client
    may make any number of additions, deletions, or updates to the data, or simply
    request certain pieces of data by queries. When given a query, the server locates
    the proper data, constructs a response, and sends it to the client.


    While the various database servers may differ in the way they deal with things
    like administrative tasks, when it comes to the data almost every popular database
    speaks a language called Structured Query Language, or SQL. SQL is not as complex
    as a full featured programming language such as Perl. It contains only functions
    and syntax for interacting with database servers, and not general programming
    features.


    Nevertheless, it is possible to get quite complex with SQL given sufficient imagination.


    One of the functions of the Perl DBI module is to make it possible to embed SQL
    statements within Perl code. This gives you the strong database handling of SQL,
    but the ability to use Perl to handle your data — the best of both worlds!


    What kinds of data go in databases? Almost anything. Databases can handle text,
    binary, or numerical data in just about any form.


    For this session, I will assume that you have a database installed on your local
    machine. If you don''t, I would recommend the excellent MySQL server. MySQL is
    available free of charge at www.mysql.com, and binary packages are available for'
