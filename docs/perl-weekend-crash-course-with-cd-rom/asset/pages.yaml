  md: '# SESSION


    # Creating Your Own Packages

    and Modules


    +   Session Checklist

    * Learning why to create modules

    * Creating a simple module

    * Using your module

    * Using BEGIN and END statements

    * Keeping your variables in their places


    In the foregoing sessions, you have seen how modules can be used to provide functions
    that, in their absence, you''d have to code yourself — possibly at prohibitive
    levels of effort. In this session, I''ll show you how to create your own packages
    and modules.


    # Why Create a Package or Module?


    By this point, you should see the reasons why creating your own modules might
    be appealing. By creating a module, you need only write a given subroutine once
    in order to be able to use it in any number of programs. If the programming you
    do'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'tends to relate to a common area, having a core set of functions can make each

    program a breeze to write.


    Another possible reason to use modules is to maintain the simplicity of a pro-

    gram Often creating a large or complex program, it helps to maintain the

    focus when the subroutines are moved into a file of their own. This keeps the
    size

    of the main file down (although the module file can get quite large), and keeps

    the logical structure of the main program in the foreground. In addition, it helps

    to keep the number of variables in the main program to a minimum, as most of the

    variables become local to the subroutines in the module.


    Finally, you may be motivated by altruism. If your subroutines are sufficiently

    general (that is, if they apply to tasks beyond the single program you''ve designed

    them for), other programmers may find them useful. By packaging them as a mod-\ule,
    you can make it very simple for other programmers to use them.


    # Creating a Module


    Creating a module is a slightly more complicated affair than writing a program,
    but

    is still fairly simple.


    # Declare your package to be a package (or not)


    The first step in creating your package is an optional one. If you want your pack-

    age to be a full-fledged module, as opposed to a simple collection of subroutines,

    y need to declare that your package is a package. This is done, not surprisingly,

    using the package function. This should be the first line of your package file,
    after

    the Perl interpreter invocation:


    ```

    #!/usr/bin/perl


    package mymod;

    ```


    Note that in declaring the package in this way, you are making an implicit

    assumption that a file called mymod.pm will exist in one of the directories included

    in the value of @INC. You can also specify subdirectories of any of the @INC direc-

    tories using a double colon. Thus,


    ```

    package MINE::mymod;

    ```


    will assume that a file called mymod.pm resides in a directory MINE, which is

    aubdirectory of one of the @INC directories.'
