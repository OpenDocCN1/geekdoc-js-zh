  md: '# SESSION 28


    ![](img/407bedec2b2c349369b174a7f5fb6718_326_0.png)


    # Passing Data via CGI


    # Session Checklist


    +   * Extracting data from HTML forms

    * Using GET and POST

    * Parsing and processing form data


    You use HTML forms to give the user an easy way to input data. HTML forms also
    make it easy to collect this data. The data is extracted from the HTML form, sent
    to the CGI via GET or POST, and lastly, parsed and processed. This session begins
    with a discussion on how to extract information from HTML forms.


    # Extracting Data from HTML Forms


    Once you have created an HTML form to collect input from the user, you need a
    way to access the user''s input. If you recall from the previous session, each
    section of the form has a certain name value associated with it. Consider this
    snippet of HTML from the HTML forms example in Session 27.'
  merge: -1
