    # Getting and Installing Perl


    # Session Checklist


    +   - Checking to see if Perl is already installed

    - Locating Perl packages

    - Installing Perl


    Before you can start writing programs in Perl, you need to have it installed on
    your computer. Perl programs are written simply as text files, but you need to
    have a piece of software called an interpreter installed in order to run them.
    The interpreter converts the programs from text into the binary format that your
    computer needs in order to execute your program instructions.

    Fortunately, the Perl interpreter falls into a category of software often called
    Open Source or Free Software. The Free Software movement arose in the 80s as a
    response to the trade secret protection practices of companies like Microsoft
    and Sun. The "Free" in free software does not necessarily mean that the software
    is available free of charge (although practically speaking this is often the case);
    rather Free Software can be freely copied, used, modified, and distributed by
    anyone. Perl is only one example of Free Software. Other notables include the
    Linux operating system, and the Apache web server (both of which will be discussed
    in'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'brief elsewhere in this book). While you may have little need to involve yourself
    in Free Software in general, the practical upshot is that anyone with an Internet-connection
    can download the Perl interpreter free of charge.


    # You May Already Have It


    Perl has become very popular over the past few years, primarily owing to its ease
    of use, and suitability for Internet-related tasks. Because of this popularity,
    Perl comes as part of the standard suite of packages on many operating systems.
    (In fact, the Perl web suggests that if you do not already have Perl installed
    as part of your Linux or Unix OS, you may want to rethink your choice of OS. It''s
    become basic.) If you are running Linux, BSD, or any variant of Unix, the odds
    are good that you have Perl installed on your system. You can test this by issuing
    the command which perl. That command should return the full path name of the Perl
    interpreter, which should be like `/usr/bin/perl`. (If you get a response like
    this, write it down. You''ll need to know the full path later.) If you do not
    have Perl installed, you should see something like:


    +   - /usr/bin/which: no perl in (/usr/bin:/usr/bin:/usr/X11:/usr/local/bin:/usr/bin/X11R6/bin:/home/joe/bin:/usr/sbin:bin:sbin:/usr/X11R6/bin:/home/joe/bin:/usr/sbin:sbin:/usr/X11R6/bin:/home/joe/bin:
    /usr/bin/sbin)


    If you are running another operating system as Windows or MacOS, your odds of
    having Perl already installed are a lot smaller. Unless Perl was installed on
    your computer by another user, you probably don''t have it. Use your file manager
    or file-finding utility to see if you have it.


    # Download Sites


    If you don''t have Perl already installed on your computer, you''re going to have
    to install yourself. Fortunately, this isn''t difficult.


    There are two kinds of software packages that you could install: source code and
    binary packages. Of the two, installing binary packages is far easier, and for
    something as complex as Perl, is by far the recommended method.


    Home base for the Perl distribution is, surprisingly, www.perl.com. Here you can
    find links to Perl packages for just every Unix variant imaginable, as as for
    Windows and Macintosh. Simply click the Downloads link and you should find a link
    to your operating system.'
  merge: -1
