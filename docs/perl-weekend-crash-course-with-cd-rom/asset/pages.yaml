  md: '# Other HTML tags


    Unpaired tags such as <BR> and <HR> can be created using the syntax:


    ```

    print $query->br;

    ```


    This prints out the text <BR>.

    Pired tags such as <B> and <H3> can be created using the syntax


    ```

    print $query->b("This is in boldface.");

    ```


    You can also nest tags as shown here:


    ```

    print $query->h3("I am a ", query->b("header"), "of size 3")

    ```


    While most of the tags are represented in lowercase, there are some exceptions
    due to conflicts with other Perl functions.


    +   - <TR> must be specified with Tr or TR.

    - <param> must be specified with PARAM().

    - <select> must be specified with Select().

    - <sub> must be specified with Sub().


    Tags with attributes can be written syntactically in one of two ways. You have
    already seen the first type in the previous examples using start_html. An example
    may look like this:


    ```

    print $query->img (src=''foo.gif'',

    -align=''right'');

    ```


    The dashes in the front of the attributes may be removed. This is the other syntactic
    method:


    ```

    print $query->img (src=''foo.gif'',

    align=''right'');

    ```


    Sometimes an attribute has no argument. In this case, set the attribute to undef
    as shown here:


    ```

    print $query->table({{border=>undef}});

    ```


    This creates the tag <TABLE border>.'
