  md: '# Kinds of Scalar Data


    The types of data that can be stored in scalar variables are not unique to scalars.
    Numerical and textual data can just as easily be stored in list or hash variables.


    # Numbers


    Probably the easiest type of scalar data to grasp is numerical data, and scalar
    numerical data is the simplest type.

    Making the statement


    ```

    $number = 1;

    ```


    is certainly straightforward forward, and has a direct correlation with X=1 of
    our high school algebra. And like algebra, it is possible to give an expression
    on the right hand side of the statement that evaluates to a number. Thus, the
    statement


    ```

    $number = 5 - 4;

    ```


    gives us the same result as assigning 1 directly. This may seem somewhat trivial,
    but remember that we can use variable substitution here. Thus,


    ```

    $first_number = 5;

    $second_number = $first_number - 4;

    ```


    will achieve the same thing.


    # Text data


    Another kind of data we can store in scalar variables is text data. We have already
    seen an example of this previously:


    ```

    $name = "joe";

    print $name;

    ```


    Using variable substitution, we get the slightly more complex


    ```

    $name = "joe";

    print "My name is $name";

    ```'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Special characters


    No discussion of textual values in Perl is complete without a mention of the special
    characters that are available. These are characters that are invisible on the
    screen, but that have meaning in the context of text formatting or other invisible
    text functions.


    Let''s bring back the last example:


    ```

    $name = "joe";

    print "My name is $name";

    ```


    There is a minor problem with with this program. When we run it, it will return
    our system prompt without a carriage return, so that the session would look like
    this:


    ```

    [ika joe]$ perl -e ''

    >$name = joe;

    > print "My name is $name";

    >

    ```


    Perl then returns,

    My name is joe[ika joe]$


    Notice how the new prompt is stuck on the end of the output line. To fix this,
    we need to insert a newline character onto the end of our print statement. We
    do that like so:


    ```

    $name = "joe";

    print "My name is $name \n";

    ```


    When we run the program, the output looks a lot better:


    ```

    [ika joe]$ perl -e ''

    >$name = joe;

    > print "My name is $name \n";

    >

    ```


    My name is joe

    [ika joe]$


    The newline is indicated by the character sequence \n. In Perverse, this is called
    an escape sequence, because the backslash is used to escape the normal function
    of the n character.'
