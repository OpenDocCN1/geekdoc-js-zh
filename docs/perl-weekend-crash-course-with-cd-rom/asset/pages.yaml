  md: '# Session 7—Variables 1: Scalar Data


    You can also use variables to describe actions to be taken even when you don''t
    actually know the variable''s value. For example, you can take input from a person
    using the program. You can say, in effect, "Here—you fill the can, and depending
    on what you put in it, I''ll figure out what to do.


    It should be denying on you exactly how much possibility there is in the idea
    of variables. Perl adds another layer of complexity. Perl variables come in three
    flavors: scalar, list, and hash. To stretch the metaphor to the breaking point,
    scalar variables allow you to put one thing in the can, while list and hash variables
    allow you to put groups of things in the can. I''ll discuss list and hash variables
    in the next session, and for the remainder of this one I''ll focus on scalar variables
    only.


    # What Do We Mean by Scalar Data?


    Scalar data is a special kind of data in that it consists of only one element.
    That is, you''re only allowed to put one thing in the can. Here are some examples
    of scalar data:


    +   - 4

    - "dog"

    - 2+2


    Here is an example of scalar data:


    +   - 4,2,6,44,34,64,23,75,23,2,664


    So, it should be clear at this point that a scalar variable has only one value
    at any given time.


    As a rule, variables are created either by declaration or by assignment. However,
    declaration happens only in programming languages where you have to specify the
    type of data you''re going to store in your variable. Perl does most of the work
    of creating the variable for you, so you need only assign a value to a name to
    be off and running:


    ```

    $name = "joe";

    ```


    There are a couple of interesting features of the preceding line. Let''s take
    them in reverse order from right to left. Note first that the line ends with a
    semicolon. This is one of only two ways to let the Perl interpreter know that
    you''ve ended a line. Every statement in Perl must end with a semicolon, unless
    it is a construct that uses curly braces to enclose a block (like the previous
    if statement). If it


