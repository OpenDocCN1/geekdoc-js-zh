    While it is possible to write programs that don''t require anything in the way
    of input or output, such programs are not likely to be very useful. You need to
    be able to communicate with your programs in order to make them really work. There
    are many ways to get data in and out of your programs; command line arguments,
    the keyboard and monitor screen, files, other processes, and so on. In this session,
    I''ll focus on the most basic — command line arguments, and the keyboard and screen.


    # Passing Data on the Command Line


    Remember how you told the Perl interpreter to execute a command by putting the
    -e flag and command on the system''s command line, like this:


    ```

    perl -e ''some command;''

    ```'
