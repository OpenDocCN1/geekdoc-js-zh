  md: '# Session 3—The Very Basics


    -X

    This is an odd flag that you can use to execute a Perl script that might, for
    example, be part of a text file, or an e-mail-like message. This flag causes the
    interpreter to look for a line beginning with the characters # and containing
    the word perl (as you should see, this is how you begin most Perl programs). In
    order for this to work properly, the Perl program must be either the last thing
    in the e-mail (or file, or whatever it is that contains the program), or the program
    must end with the line __END__


    Assuming there are no arguments to any of the flags you''re using, you can group
    them together. For example, if you wanted to use -U and -w flags at the same time,
    you could group them as -Uw.


    Arguments are bits of data attached to a command line or to a program that give
    it further information to work with. Thus, the -i flag expects to be given (that
    is, takes as an argument) the name of a directory, for example, perl -i/home/joe/perl/modules
    <whatever>. Some flags take arguments, and not still. Others can use arguments
    if they are provided, but do not require them.


    ![](img/407bedec2b2c349369b174a7f5fb6718_52_0.png)


    # Using Perl on the Command Line


    If you''re used to use Unix-style command-line constructs, such as those found
    in the bash or other shells, it probably won''t surprise you to find out that
    you can use the Perl interpreter in the same way as you''d use any Unix command.
    That means you can use input and output redirection, and especially pipes, to
    assist in command-line processing. For example, suppose you have a bash script
    that produces some particular sort of output, and you want to make a change in
    that output before capturing it to a file, you might use a command line looking
    like this:


    ```

    $joe@ika joe$ bashprog | perl -e ''s/foo/bar/g;'' > outputfile

    ```


    This command line will take the output of the program bashprog, and filter it
    through Perl''s pattern-matching operator, which will change every occurrence
    of the word foo to the word bar, and then capture the output of that operation
    in the file called outputfile. In this way, Perl is acting as a stream editor
    similar to sed.'
