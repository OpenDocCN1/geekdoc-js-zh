    # By functions


    In addition to manipulating list data through assignment, there are several Perl
    functions that are specifically for the purpose of working with lists.


    push() and pop() If you''ve ever done programming with stacks, the concept of
    pushing and popping should be familiar to you. If not, it can be a tricky thing
    to understand. A stack is a bunch of data elements that are lined up to be used
    in order. The head of the stack is a Dixie Cup dispenser, and the cups as the
    data elements. As we use data elements, we pull cups off the bottom of the stack.
    This is popping. If we want to add a new element to the stack, we must push the
    cup into the dispenser. Once we''ve pushed a cup, it will be the first one off
    the next time we pop.


    To translate that into more intermediate terms, we can think of the right-hand
    side of a list literal as the bottom of the stack. Using the push() function adds
    an element to the literal as the right-hand side of the list, while the pop()
    function removes one. For example, if we have


