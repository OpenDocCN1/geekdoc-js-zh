  md: '# REVIEW


    To extract information from HTML forms, information is sent to the CGI in the
    form of key-value pairs. Key-value pairs set a variable name (key) to the value
    that the user specified. These key-value pairs are then sent to a CGI program
    using either GET or POST. GET sends the pairs from the form as part of the URL,
    as well as saving them in the QUERY_STRING environment variable. POST sends the
    pairs from the form as an input stream to the program. When GET and POST send
    this data, URL-encode it. When the CGI receives the information, it must unencode
    it. Once the data is decoded, the CGI program can manipulate the data. CGI programs
    are often used to collect information, save it to a database, compute results,
    and post information back to the user.


    # QUIZ YOURSELF


