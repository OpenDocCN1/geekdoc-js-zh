    # abs


    +   **Syntax:** abs(expression)

    **Description:** Returns the absolute value of a particular expression. (If the
    expression is omitted, it uses $).


    # atan2


    +   **Syntax:** atan2(x,y)

    **Description:** Mathematical function which returns the arctangent of y/x in
    the range of -[pi] to [pi].


    # chdir


    +   **Syntax:** chdir(expression)

    **Description:** Changes the working directory to the directory represented by
    the expression. If the target directory does not exist, the function fails, and
    returns a value of 0.


    # chmod


    +   **Syntax:** chmod(value, list)

    **Description:** Changes the permissions on a list of files to the permission
    represented by the value. The value must be in numerical form, for example:

    ```nchmod(0666, $file1, $file2);

    ```


    # chomp


    +   **Syntax:** chomp(scalar or list variable)'
