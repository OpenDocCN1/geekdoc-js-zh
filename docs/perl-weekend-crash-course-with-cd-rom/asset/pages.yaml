    > You don''t have to use $dbh as the name of your database handle object. Any
    scalar variable name will work equally well.


    ![](img/407bedec2b2c349369b174a7f5fb6718_271_0.png)


    # Creating SQL statements


    Once you''ve established a connection to a database, you can begin to execute
    statements using the connection. This is done using two methods, prepare, and
    execute.


    The actual SQL statement is created using the prepare method. This method is called
    on the database handle like so:


    ```

    $sth = $dbh->prepare($sql_statement);

    ```


    So, an example of preparing a statement might look like this:


    ```

    $sth = $dbh->prepare("SELECT * FROM perl_table");

    ```


    This statement would finally fetch all the data from the table called perl_table.
    Calling this method, you create another object handle. $sth is the statement handle,
    and it refers to the particular statement you''re creating.


    Once the statement is prepared, it can be executed. The execute method is called
    on the statement handle:


    ```

    $sth->execute();

    ```'
