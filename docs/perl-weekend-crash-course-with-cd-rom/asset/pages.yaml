  md: '# Preface


    T his book is for people who want to learn to program in Perl. No experience in
    Perl or in any other programming language is required, although you should have
    basic familiarity with the PC and whatever operating system you''re using, as
    well as keyboarding skills. The book''s focus is Perl as a full-featured programming
    language used in application development. The book supports any version of Perl
    greater than 5.0. It provides a CD-ROM with the Perl interpreter software.


    # Who Should Read This Book


    This book is for you if you wish to learn Perl programming. Though the focus is
    primarily on Unix and Linux systems, Perl interpreters are available for almost
    every operating system.


    Perl Weekend Crash Course teaches you the fundamentals of Perl programming in
    a series of short lessons you can cover in one weekend. The first session starts
    Friday evening, and the last session ends Sunday afternoon. There are 30 sessions,
    each requiring approximately one-half hour.


    # What''s in the Book


    The book begins by telling you how to get and install Perl. Once you''ve got the
    necessary software in place, you can begin writing programs. (The good news is
    if you''re working on a Unix or Linux system, the odds are very good that Perl'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'software is already installed.) With that task out of the way, an overview
    of the language follows. You''ll be introduced to the basic concepts that make
    up a Perl program, and you''ll get a taste of how one is put together.


    From here, you shift focus a bit. Before you start writing programs, you need
    to know a few things about how programming works in general. You learn to use
    the Perl interpreter, including the ways in which you can alter its behavior.
    Then you move to Perl''s built-in help system. Any time you get stuck, you can
    almost always find something in the help system to get you moving again. The final
    preliminary is getting comfortable with a text editor. Programs are written as
    text files; to create and edit a text file, you need to use a text editor. Whether
    this is the Windows text editor, Notepad, or one of the Unix text editors, you
    need to be comfortable with your editor before you can program effectively.


    With these preliminaries taken care of, you begin to address the Perl language.
    You start by learning about variables and getting to know Perl''s three native
    data types. You learn how to use expressions and operators to construct statements
    and how to put those statements together into sequences that do something. You
    address input and output and learn to control the flow of your program and to
    interact with your system.


    Then you look at some of Perl''s most powerful capabilities — text processing,
    data transformation, and data display. From strictly linear programming, you advance
    to subroutines, packages, and modules. You learn to use these features to make
    your programs more efficient, more powerful, and less demanding.


    Finally, you look at one of the more popular applications of Perl — programming
    for the World Wide Web. Perl can be used to create HTML documents on the fly;
    by combining Perl techniques with the common gateway interface (CGI), you can
    create Web pages that interact with the user and present dynamic content.


    Perl is a freeform language, and it''s possible — even likely — that some of the
    Perl you encounter in the real world will look somewhat, or quite a bit, different
    from the code you see in this book. That''s okay. One of Perl''s mantras is "There''s
    More Than One Way to Do It."


    # Organization and Presentation


    The book is organized into 30 sessions, each requiring approximately 30 minutes.
    I divide the sessions as follows:


    +   - Friday evening. Sessions 1 through 4. Reading time: 2 hours.

    - Saturday morning. Sessions 5 through 10. Reading time: 3 hours.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Preface


    +   - Saturday afternoon, Sessions 11 through 16. Reading time: 3 hours.

    - Saturday evening, Sessions 17 through 20. Reading time: 2 hours.

    - Sunday morning, Sessions 21 through 26. Reading time: 3 hours.

    - Saturday afternoon. Sessions 27 through 30. Reading time: 2 hours.


    At the end of each session, I present questions designed to check your progress.
    The text is sprinkled with icons designed to catch your attention.


    ![](img/407bedec2b2c349369b174a7f5fb6718_10_0.png)


    The Minutes to go icons mark your progress in the session.


    ![](img/407bedec2b2c349369b174a7f5fb6718_10_1.png)


    The Tip icons offer suggestions on style and mention shortcuts that can save programming
    effort.


    ![](img/407bedec2b2c349369b174a7f5fb6718_10_2.png)


    The Note icons highlight incidental or technical information that clarifies and
    expands the discussion.


    ![](img/407bedec2b2c349369b174a7f5fb6718_10_3.png)


    The CD-ROM icon refers to material furnished on the book''s CD. Use it to find
    electronic versions of programs and software elements mentioned in the text.


    # Contacting the Author


    I can''t guarantee I can solve all your Perl problems, but I promise to take a
    look at your questions and see if I can help. If you get stuck, you can contact
    me at the following e-mail address: joe@nigiri.org.'
