  md: '# Session 21—Getting and Installing Packages and Modules


    # Table 21-1

    CPAN Display Commands


    | Command | Action |

    | --- | --- |

    | a | Authors |

    | b | Bundles |

    | d | Distributions |

    | m | Modules |

    | i | Any |


    Authors returns a list of authors of various modules. Bundles are prepackaged
    bundles of modules that you might need for a particular purpose. For example,
    if you wished to do a lot of work with XML, you might install Bundle::XML, which
    contains a lot of modules designed for XML processing. Distributions are package
    files, usually in tar.gz format. Modules returns a list of modules, and the i
    option will return any author, distribution, or module that suits the search criterion.
    Any of these display commands can take a string or regular expression as an argument.
    Thus


    ```

    cpan> i DBI

