  md: '# Answers to Part Reviews


    12. The Perl Standard Library is that collection of modules and pragmas included
    with the standard Perl distribution. In other words, you need not do anything
    to install these modules and pragmas, since you already have them.


    13. You can see a list of installed modules by giving the command perldoc local


    14. Apragma is an instruction to the compiler.


    15. The IO::Socket provides object methods for making network connections and
    controlling their input and output.


    16. A reference is an indirect way of passing data. References provide a pointer
    to a variable or subroutine''s location in memory. References can be created explicitly,
    using the backslash operator, or implicitly, using anonymous variables or subroutines.


    17. A symbolic reference is created when a reference is used without having ever
    created. The interpreter acts as if the reference had been created and performed
    whatever operation is specified on the implied reference. Symbolic references
    can be useful, but they can also present a certain data to the programmer, and
    should be handled with care. In doubt, the strict pragma can be used to prevent
    the interpretation of symbolic references.


    # Sunday Afternoon Review Answers


    +   1. HTML is HyperText Markup Language. It presents documents on the Web by
    means of formatting tags and form elements.


    +   2. The <FORM> tag indicates that whatever falls between it and the closing
    </FORM> tag is to be treated as an HTML form. That is, form elements indicated
    within these tags will be rendered on the client''s browser, and the user can
    input data via these form elements.


    +   3. CGI stands for Common Gateway Interface. The CGI is a way of passing Web
    data to programs residing on the Web server. Thus, the data from a Web form can
    be passed to a Perl script, which may, for example, fetch data from a database
    server, and reassemble into an HTML document. In this way, a simple Web-based
    search engine could be created.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '348


    # Appendix A


    +   4. Because CGI causes programs to be executed on the server, there is always
    a danger that the action of these programs can be hijacked and made to perform
    actions that the programmer did not intend. Programmers and Web administrators
    need to take care that CGI programs are as secure as they can be, and that other
    system security measures are in place.


    +   5. GET and POST are the two methods of passing data from an HTML form to a
    CGI program. GET sends the information from the form as part of the return document''s
    URL, whereas POST sends data as an input string, and can be read from STDIN. In
    general, POST is more secure than GET, since it does not advertise itself in the
    URL, however anyone with even a modest knowledge of WWW software can figure out
    how to access the information passed in a POST operation as well, so POST should
    not be considered secure. POST also has the advantage (or disadvantage depending
    on the situation) of not sending horizontally encoded URLs.


    +   6. The read function reads a certain number of bytes (characters) from the
    filehandle. An optional offset can be given to define the particular starting
    point of the substring in which you''re interested. It is used to read data from
    STDIN when processing POST operations.


    +   7. The CGI module contains functions and object methods that greatly simplify
    the process of creating HTML documents on the fly.


    +   8. The start_html method creates the initial headers that signal the beginning
    of an HTML document. Arguments to this method represent parameters that will be
    included in the HTML headers.


    +   9. The CGI module''s function-oriented mode allows the programmer to avoid
    the overhead of importing all of its object methods into a program where they
    are not needed. Since CGI overhead can become a real performance when there are
    a large number of clients accessing a Web site, this can be a major way of streamlining
    CGI program overhead.


    +   10. A cookie is a piece of information passed back and between a Web server
    and a Web browser. Cookies are used to manage Web sessions, and keep track of
    the state of the browser.


    +   11. SSI stands for server-side include. SSIs are a way of creating server-parsed
    documents on the fly.


    +   12. mod_perl is a module that can be compiled into the Apache Web server.
    mod_perl essentially embeds a Perl interpreter within Apache itself, saving the
    processor overhead of having to start a new instance of the Perl interpreter every
    time a CGI script is run. This can greatly reduce the load on the Web server''s
    processor, and make for faster and more efficient processing of Perl scripts.'
