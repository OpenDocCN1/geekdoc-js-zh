- img_proc: true
  md: '# The Apache Web Server


    A Web server is a program that runs on a computer and serves up Web sites. The
    Web server waits for a request from a visitor for an object, and replies by sending
    these objects to the visitor. These objects include HTML documents, images, sounds,
    and video.


    The Apache Web server is one of the fastest and most robust Web servers. The Apache
    Software Foundation (ASF) maintains Apache at http://www.apache.org/.

    Apache is a very reliable Web server, used by 60 percent of the Web server market
    at its main core of functions. Also, since incredibly reliable and supports many
    features in its main core of functions. Since Apache is open-source, other developers
    have written modules that support other features. In the chance that there is
    not a module that supports a feature you would like, due to Apache being open-source,
    you can write the feature yourself. Since Apache dominates the Web server market,
    support is relatively easy to find.


    # Basics of installation


    Apache can be built and installed in many different ways. There are three main
    ways that Apache is installed: binary installation, through an operating system
    package, and directly from the source.


    Binary installation involves obtaining a precompiled source for your specific
    operating system. This means you must use a Linux binary on your Linux machine,
    and Solaris binary on your Solaris machine. It also means that if a binary for
    your OS doesn''t exist, you have to install using a different method. Binaries
    are generally preconfigured, which means you lose some flexibility in being able
    to alter Apache to your specifics. Lastly, binaries are generally a couple of
    versions before the current source, so you lose the benefit of having new features
    and recent fixes.


    Package-specific binaries for Apache also exist in form of package managers like
    Red Hat Package Manager (RPM) and Debian''s Package Manager. These are basically
    identical to binary, however they are configured to play well with other RPMs
    and provide an easy-to-manage way to install, update, and remove packages. Packages
    are generally less flexible than binaries, and others times it is difficult to
    tell where a package will be installed. However, packages do an easy installation
    route if you do not want any special configurations, or if you are simply trying
    to get your feet wet, and plan to do a fully customized installation later.


    The third option involves downloading the Apache source and compiling it on the
    Web server. While this may sound a bit frightening, the'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Session 30—Apache and mod_perl


    Apache developers have made the installation an easy one. Compiling the source
    offers the most flexible installation as well as the most up-to-date source.


    If you simply wish to get Apache up and running as quickly as possible without
    any special configurations, using a binary or a package is the easiest to install
    Apache. However, if you require some special configurations and want more control
    over the installation, compiling the source is the best method of installation.


    Apache can do more than simply serving HTML documents. In the rest of this session,
    I''ll discuss various ways to harness Apache''s power through the use of server-side
    processing and mod_perl.


    # Server-Side Processing


    Server-side processing is a process where bits of data evaluated by the server
    to serve dynamic content to the user without serving an entire page via CGI program.
    Server-side includes (SSI) is one main way to add server-side processed dynamic
    content.


    Server-includes (SSI) are directives placed directly in HTML pages and evaluated
    on the server as the page is delivered. They enable you to add dynamic content
    to a page without making the entire page dynamic. The decision of whether to use
    SSI depends on how much dynamic content is being served. If only a part of a page
    needs to show dynamic content, then SSI is a good way to do this. If most of the
    page is generated dynamically, however, CGI programs are more likely a better
    solution.


    # Configuring Apache for SSI


    To configure Apache to permit SSI, you add the following directive to your httpd.conf
    or .htacces file:


    Options +Includes


    Next, you need to tell Apache which files should be parsed for SSI content. You
    don''t want to tell Apache to parse every HTML file for SSI directives, as this
    will slow down the server significantly. However, you may wish to configure Apache
    to parse every .shtml file for SSI directives. Tell Apache


    ```

    AddType text/html .shtml

    AddHandler server-parsed .shtml

    ```


    However, this means that you need to rename all pages with SSI directives to .shtml
    files, and change all links to those pages. Another method you can use to


    ![](img/407bedec2b2c349369b174a7f5fb6718_354_0.png)'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'configure Apache to parse for SSI directives is to tell Apache to parse all
    files with the execute bit set. This way, you simply have to make all files with
    SSI directives executable.


    In order to set Apache to parse executable files for SSI directives, set


    XBitHack on


    Now that you have configured Apache to handle SSI, let''s discuss how to write
    SSI directives.


    # SSI directives


    SSI directives are formatted like HTML comments. If SSI is not enabled on the
    Web server, it will ignore the directives and they will be served as part of the
    HTML document. If SSI is enabled, the directive will be replaced with the calculated
    value.


    The basic syntax of an SSI directive looks like this:


    ```

    <!-- #element key1=value1 key2=value2 ... -->

    ```


    One use of SSI is to add the current date and time to an HTML document:


    ```

    <!-- echo var=DATE_LOCAL -->

    ```


    This echoes the value of DATE_LOCAL. DATE_LOCAL is one of many standard variables.
    SSI supports the set of environment variables available to CGI, as well as allowing
    you to define your own variables using set.


    You can change the format that is printed in by using the config element and the
    timefmt key as shown here.


    ```

    <!-- #config timefmt="%d, %Y" -->

    <!-- echo var=DATE_LOCAL -->

    ```


    Another use of SSI is to print the last modified date of a file. This is shown
    here:


    Last modified: <!-- #lastmod file="index.html" -->


    The problem with this is that it requires to edit the file every time you add
    this directive to a page. A better way would be to use the variable LAST_MODIFIED,
    which will populate the directive with the last modified time-stamp of the file:


    Last modified: <!-- echo var="LAST_MODIFIED -->'
