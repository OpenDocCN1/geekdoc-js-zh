    # Getting and Installing Packages

    and Modules


    # Session Checklist


    +   - Learning about packages and modules

    - Installing packages and modules using the CPAN interface

    - Installing packages and module without CPAN


    It has been remarked that Perl is a language for lazy programmers. That isn''t
    to (really!), but that Perl programmers are incorrigible slackers who never do
    any work, rather that Perl is designed so that common and repetitive programming
    tasks can be handled with minimal effort. Perl hackers have taken this idea to
    heart, and a frequent brand of one-upsmanship in the Perl community is to accomplish
    a task using a shorter program than your neighbor.


    From a certain perspective, this has to do with actual laziness than with a certain
    admiration for the beauty of efficiency. The shorter the program, the less energy
    put into into writing. Using less energy to accomplish a given task implies greater
    efficiency. Greater efficiency means there''s more energy to be used for other
    tasks. So the so-called laziness of the Perl hacker is just a disguise for getting
    as much done as possible in the shortest amount of code.


    Among the types of inefficiencies Perl hackers abhor, duplication of effort ranks
    right up there. One will often hear Perl hackers speak disdainfully of'
  merge: -1
  pgno: 250
- img_proc: true
  md: '“reinventing the wheel.” After all, the wheel has already been invented. If
    we had to reinvent it every time we wanted to use one, we wouldn''t get done.


    In practice, the Perl programmer''s disdain for duplication of effort manifests
    in the idea that if someone else already solved a particular problem, you are
    better off using their solution than you are coming up with a solution of your
    own. The flip side of this is, if you come with a solution to a problem that is
    either new, or better than the existing solution, the Perl community would be
    awfully happy if you shared it with the world. Sharing solutions is the basic
    idea behind Perl''s package and module infrastructure.


    # What Are Packages and Modules?


    Packages and modules are two different forms of abstracting subroutines. A package
    creates a separate namespace for variable and subroutine names. Recall that when
    you created subroutines in your programs, you tried as much as possible to use
    local variables and keep the subroutines from interfering with each other and
    with the program as a whole. Packages give an explicit way to do this.


    By declaring a package, all of the variables and all of the subroutines in the
    package will be local to that package. In order to use them, you must name the
    package explicitly. You would use a package where you had a large number of subroutines
    and wanted to keep them separate from the main part of the program. That way,
    a subroutine could have a variable named $norbert, and the main part of the program
    could also have a variable named $norbert, and there would be no conflict between
    the two.


    A module is a special kind of package. A module has been guessed up with a few
    magical incantations to make it portable. That, as long as you follow a couple
    of procedures, any module can be used in any program,


    The best thing about modules is that there are lots of them already in existence.
    Modules are the means by which Perl programmers share their code, and there are
    a huge number of modules that exist to perform a mindoggling assortment of tasks.


    Each module provides a set of subroutines that you can use exactly like you would
    use native functions, except that the functions contained in the modules generally
    have a very specific purpose.


    For example, later in this section, we will be looking at the DBI module. This
    is a module that provides a set of functions specifically designed for talking
    to database programs (DBI stands for *database interface*). This module provides,
    for example, the *dbi->connect* function, which makes a network connection to
    a database.'
