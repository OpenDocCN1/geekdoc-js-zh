  md: '# Session 4—Getting Help


    +   * www.perl.org: Home of the Perl Mongers, The Perl Mongers are a group dedicated
    to Perl advocacy, and one of their areas of focus is helping beginners get started.
    They host a Perl e-mail list where you can ask questions and get help with specific
    problems.


    +   * www.tpj.com: Web site for the Perl Journal, which is a magazine devoted
    to Perl. While somewhat advanced, the magazine contains articles on topics of
    interest to Perl programmers. [NOTE: at the time of this writing, the Perl Journal
    was in a state of management transition, and the Web site was down. They promise
    to be back up, however].


    +   * www.perlmons.org: A site maintained by the Perl Monks. The Monks are dedicated
    to making “learning Perl as non intimidating and easy to use as possible, as well
    as helping Perl programmers hone their skills. The site is a bit dense and tough
    to navigate, but the amount of information here is huge.


    # Usenet


    In addition to Web resources, there are several Usenet newsgroups devoted to Perl.
    The primary one is comp.lang.perl.misc. This is a newsgroup devoted to general
    discussion about Perl. A word of warning on this group, however: its habits can
    be a bit prickly, especially if they sense you haven''t done your homework. A
    question that has an obvious answer in the available documentation is likely to
    be ignored or inflamed.


    Other newsgroups include comp.lang.perl.announce, where Perl news is announced;
    comp.lang.perl.modules, where you can discuss various Perl modules (as are introduced
    later in this book); and comp.lang.perl.tk, a group devoted to graphical programming
    in Perl using the Tk toolkit.


    # Mailing lists


    In addition to the Perl Monks'' beginners mailing list, there are numerous other
    Perl-oriented mailing lists. Many of these are devoted to relatively narrow areas,
    and so should be approached with that in mind. A full listing of these lists is
    available at http://www.perl.com/pub/language/info/mailing-lists.html.


    As you can see, there''s no excuse for being ill informed on the subject of Perl.
    Between built-in documentation, the Web, and the various books on the subject,
    the amount of information at your disposal is enormous, and I encourage you to
    make liberal use of it.'
