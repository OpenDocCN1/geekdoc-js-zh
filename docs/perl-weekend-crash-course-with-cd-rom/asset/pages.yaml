  md: '# 108 Saturday Afternoon


    The -e flag and the command are arguments to the perl command. They give the interpreter
    extra information about what it''s supposed to do. This is one of the most basic
    kinds of input there is. We can use the same principle to get data into our Perl
    programs, by using the special variable @ARGV. The @ARGV variable is a list that
    contains all of the line arguments—that is, anything that appears on the command
    line after the name of the program. Here''s an example:


    ```

    #!/usr/bin/perl


    print "@ARGV\n";

    ```


    We save this program under the name argtest.pl. Now if we run the program so,


    ```

    argtest.pl foo bar baz bim

    ```


    the output will be


    ```

    foo bar baz bim

    ```


    We could modify the program slightly:


    ```

    #!/usr/bin/perl

    ```


    ```

    print "$ARGV[0]\n"

    print "$ARGV[1]\n"

    print "$ARGV[2]\n"

    print "$ARGV[3]\n"

    and now the output would be

    ```


    ```

    foo

    bar

    baz

    bim

    ```


    The thing to remember here is that the arguments start with the first term after
    the name of the program, and each successive word (that is, each successive string
    of alphanumeric characters separated by whitespace), is a subsequent argument.
    Another thing to bear in mind is that the numbering of arguments starts with 0.
    In all respects, @ARGV acts like any other list. Any of the operations that can
    work on an array will work on @ARGV.'
