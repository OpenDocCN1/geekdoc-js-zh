    In this instance, the key associated with this list is scrolling_list_name.

    selection made by the user will be stored in the CGI object as scrolling_list,

    name=user_selection. To extract the user_selection from the CGI object, use:


    ```

    $selection = $query->param(''scrolling_list_name'');

    ```


    The syntax for extracting the data associated with this scrolling list is exactly

    same as the syntax for extracting the data associated with the textfield.

    However, there is one difference. If the user was allowed to select multiple

    options from this list, the values returned from the CGI object would be a list,
    and

    you would have to use an array to store the list. It would look like this:


    ```

    @selection = $query->param(''scrolling_list_name'');

    ```


    A rule of thumb is to know whether you are retrieving a single object back, as

    a a textfield or a standalone checkbox, or if you may be receiving multiple objects

    back from a single form element, as in a multiple select list or a group of check-boxes.
    If you could be receiving multiple elements, you extract them into an array.

    If it is only a singular element, a string will suffice.'
