    # What''s a Hash?


    If you''re anything like me, the first thing that comes to mind when you hear
    the word hash is a tasty concoction of meat and potatoes. In Perl, however, the
    hash is our third and final data type. A hash is similar to list in that it contains
    multiple elements, but it is distinct from a list in the elements have a particular
    relation to one another. Specifically, the elements of a hash come in pairs.


    You can create a hash as you would any other variable, except the leading character
    is the percent character, % (for example, %my_hash).


    You might be wondering at what point would happen if you created the variables
    $var, @var, and %var all at the same time. The answer, perhaps surprisingly, is
    nothing. Perl maintains separate namespaces for each type of value. If you create
    a scalar and, say, a hash with the same name, these are considered to be two separate,
    distinct, and wholly unrelated variables by the Perl interpreter—unless the variables
    were somehow thematically related. However, this would be considered a bad programming
    practice, as it would tend to be confusing.


    Each pair of elements in a hash has a key (the first element) and a value (the
    second element). Each of these is associated with that for any key, we can retrieve
    the corresponding value, and vice versa. The idea is a little clearer if you think
    about an example.


    Imagine you are a teacher, and you want to record the grades that your students
    got on your most recent test in a Perl program for easy processing later.'
