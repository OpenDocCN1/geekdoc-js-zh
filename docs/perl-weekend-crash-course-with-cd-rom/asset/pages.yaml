    The CPAN interface program will download and build the package from one of CPAN''s
    mirror sites. Alternatively, you can download the DBI module, and you should also
    install the DBD (Database Driver) module that corresponds to the database server
    you''re using. (You won''t need to use DBI functions in your program, but the
    DBI module needs DBD in order to know how to talk to the database server.) For
    example, if you''re using MySQL server, you should install the DBI::mysql module,
