    doesn''t end in a semicolon or a curly brace, the interpreter has no way of knowing
    where the end of the line is.


    Second, notice the quotes around the word joe. This lets the interpreter know
    that the data is in the form of text. (Actually this isn''t really necessary.
    Perl is pretty relaxed about the use of quotes. I could have left them out.)


    Third, there is the equals sign (-). In this context, it acts as an assignment
    operator, letting the interpreter know that there is a value coming up (we''ll
    talk more about operators in Session 10).


    Finally, the dollar sign ($ preceding the name of the variable. This dollar sign
    is how we tell the interpreter that we are creating a scalar variable. Other characters
    are used to signal list and hash variables. It is very important that you always
    put a dollar sign in front of any scalar variable name for two reasons: 1) if
    you leave it off, the interpreter won''t know it''s supposed to be a variable
    name, and 2) if you use the wrong character, it''s a command word that it doesn''t
    know, and the interpreter might think it''s a list instead of a scalar. This can
    cause problems because some Perl functions work differently depending on whether
    they''re used in a scalar or list context.


    # Variable Substitution


    One of the more important things you can do with variables is to use their names
    as a sort of placeholder for where you want values to go. That way, you can use
    the value for various purposes without having to know in advance what value actually
    is.


    Here''s an example. We''ve already seen the print function. It simply prints out
    whatever is given to it. So if you give the command


    ```

    print "joe";

    ```


    it will print the word "joe" on a line, and exit.


    Now consider


    ```

    $name = "joe";

    ```


    ```

    print $name;

    ```


    This will give you the exact same result.'
