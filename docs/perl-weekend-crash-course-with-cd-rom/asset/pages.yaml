    # Saturday Evening


    words hat or hot. You can extend this idea further. Suppose that the asterisk
    (*) will match zero or more of the immediately previous characters. Now you can
    construct the expression h.*t, which will match hat and hot, and also heat, heut,
    heart, or anything else starts with h and ends with t.


    > The regular expression operator (*) should not be confused with the filehandle
    globbing operator, which is discussed in Session 15.


    At this point, it should become evident that a given sufficient number of these
    wildcard characters (or metacharacters), you can match a simply staggering number
    of textual possibilities. But it gets even better — you can stipulate character
    classes (that is, just letters or numbers), various types of whitespace (spaces
    and tabs), or position (whether the expression is at the beginning or end of the
    line). You can specify subsets of characters (e.g., only a, x, or q). You can
    specify characters of only upper- or lowercase. You can create expressions that
    contain other expressions.


    I won''t cover that much material here, but you will get to know the basics of
    constructing regular expressions, and making use of them in Perl programs.


    # Constructing Simple Regular Expressions


    In the last section, you saw two regular expression operators. You saw the wildcard
    (.) and the multiplier (*). In this section, you''ll see a few more operators,
    and learn to use them in constructing regular expressions.


    > Regular expressions are one of the few areas in Perl where the exact format
    of what you do matters greatly. Things like-space, line breaks and the like can
    really affect the meaning of what you''re trying to express.


