  md: '# HTML header creation


    CGI.pm includes the start_html() function you used in the examples above. It creates
    an HTML header and the opening <BODY> tag. Other parameters are available, including
    the character set of the browser, and a parameter to turn the page into an attachment.
    The available parameters are listed in Table 29-1.


    # **Table 29-1**

    HTTP Header Parameters in CGI.pm


    | Parameter | Definition |

    | --- | --- |

    | -expires | Specify when to expire the CGI script. |

    | -type | Specify the content-type of the document. |

    | -cookie | Ask the browser to return a cookie during all transactions with the
    script. |

    | -charset | Control the character set of the browser. |

    | -attachment | Turn the page into an attachment. |

    | -nph | Generate a valid header for use in scripts in which the header is not
    parsed. |


    The syntax for utilizing multiple parameters is shown in the example below:

    print $query->start_html(-title=>Title of the Document'', -author=>user@foo.com'',
    -meta=(''keywords''=>''keyword1 keyword2''), -BGCOLOR=>black'', -TEXT=>white'');


    # **Ending an HTML document**


    To end an HTML document by printing <</body>></HTML>, CGI.pm offers the function:

    print $query->end_html();'
