  md: '# WordPad for Windows


    Let we forget the Windows users out there, we''ll now look at the default Windows
    text editor, WordPad is not terribly different from NEdit described previously,
    although it lacks syntax highlighting, and has rather more options for text formatting.
    However, like NEdit, it is a graphical editor, and allows you to use your mouse
    to paste text, and to position the cursor.


    Open WordPad by going to your Windows Start, selecting the Programs submenu. Under
    Programs select Accessories, and then you will find WordPad. Click on WordPad,
    and you should see the main WordPad screen.


    Click in the text area, and begin typing. You can move your cursor using the mouse
    to position the cursor in an exact location. By clicking and dragging, you can
    highlight text, which can then be copied, cut, or pasted by using the corresponding
    entries in the Edit drop-down menu.


    When you wish to save your work, click on File, and then Save. A dialog will appear,
    prompting you to give your file name. Enter the name, and make sure to select
    Text Document in the field labeled Save Type.


    > Do not save your file as Rich text or Unicode text. The Perl interpreter will
    not be able to understand these formats.


