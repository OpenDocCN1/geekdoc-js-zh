  md: '# 8- Friday Evening


    However, on the off chance that you do not have Perl installed on your system,
    you''ll need to install it.


    # Installing from binary packages


    As I said previously, binary packages are by far the easiest way of installing
    Perl. In most cases, the binary packages come with installation programs that
    handle all the configuration for you, thus you need only install the package,
    and you''re ready to go.


    As an example, here''s how you would install Perl under Red Hat Linux:


    +   1. Download the Perl package from the Red Hat web (www.redhat.com) or one
    of its mirrors. (The proper package would be "perl-5.6.0-12.i386.rpm" for the
    version of Perl that comes with Red Hat Linux 7.1). Alternatively, if you have
    the installation CD for your Red system, you should be able to find the Perl package
    on it.

    2. Assume superuser privileges on your computer using the su command.

    3. Using the RPM package manager, install the package:


    ```

    [root@fugu joe ~]#rpm -ivh perl-5.6.0-12.i386.rpm

    ########################################################### [100%]

    1:perl ############################################################ [100%]

    ```


    +   4. If you are upgrading, substitute U for i in the preceding command.


    Once the package is installed, you should be ready to begin writing Perl programs.

    If you are using a Debian or Debian-derived version of Linux, you can use the
    dpkg utility to install the Debian package. Under Solaris, you would use the pkgadd
    utility, and so on. Some systems will have special installation programs you may
    have to download and run. Make sure you check the instructions that come with
    the package you are using.


    # Installing from source code


    Installing from source code is an alternative that you always have even if you
    can also install from binary packages. The advantages that you have with a source
    code install are that you can exercise a deal more control over the installation
    (for example, where the files will be put, and so on) and you can install Perl
    even if you don''t have superuser privileges on the machine you''re working with.
    The'
