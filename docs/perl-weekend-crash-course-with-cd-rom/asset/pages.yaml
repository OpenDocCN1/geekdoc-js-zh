    Done.


    Let''s break this down. The constructor specifies that the enclosed code is to
    be repeated as long as the value of $a is less than 10. The initial value of $a
    is 0. At the start, the condition is evaluated. Since $a$ is 0 is less than 10,
    the condition is true. The message *Still looping...* is printed, and the value
    of $a is increased by one. The program returns to the top of the loop. The condition
    is evaluated again. The value of $a is now 1, which is less than 10, so the message
    is printed, and $a$ is increased by one. The program goes back to the top, and
    so on. The tenth iteration, the value of $a is 9 (because we started at 0). The
    conditional block is executed, and the value of $a is increased by one to 10.
    Back to the top again, the condition is evaluated. The program sees that 10 is
    not less than 10, so it skips to the line immediately following the closing brace.
    The message *Done.* is printed, and the program exits.


