    # Iterative constructs


    Sometimes you want to have a section of code execute repeatedly under certain
    conditions. For this, there are several constructs:


    # while


    The while construct causes a section of code to repeat as long as a certain condition
    holds true:


    ```

    while (some condition) {

    statement 1;

    statement 2;

    statement 3;

    }

    ```


    If, at some point the condition ceases to hold true, the execution of the program
    will skip to the line immediately following the closing brace.


    # until


    until is the opposite of while. until causes a section of code to repeat as long
    as a certain condition does not hold true:


    ```

    until (some condition) {

    statement 1;

    statement 2;

    statement 3;

    }

    ```'
