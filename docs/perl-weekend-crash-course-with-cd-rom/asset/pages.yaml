  md: '# 238


    # Sunday Morning


    Once you''ve looked at the methods and functions that the module provides, you
    can simply include them into your programs as if they were native functions. Here''s
    an example of a program that makes use of the LWP::Simple module:


    ```

    #!/usr/bin/perl


    use LWP::Simple;

    $location = "http://www.weather.com/weather/local/02136"

    print $location;

    ```


    The LWP module provides functions for making Web connections. It is very simple
    to write Web client software in Perl using LWP. In this example, you connect to
    www.weather.com, and download the page local weather information for the 02136
    Zip code. The getprint function simply gets the page residing at the desired URL,
    and prints it to standard output. The getprint function is described in the perldoc
    page for LWP::Simple:


    ```

    getprint($url)

    ```


    Get and print a document identified by a URL. The document is printed to STDOUT
    as data is received from the network. If the request fails, then the status code
    and message are printed on STDERR. The return value is the HTTP response code.


    Other functions from the LWP::Simple module are shown in Table 22-1.


    Table 22-1

    LWP::Simple functions

    | Function | Arguments | Action |

    |---|---|---|

    | get | URL | Fetches and returns the desired URL |

    | head | URL | Fetches and returns headers for document desired |

    | getprint | URL | Fetches and prints the desired URL |

    | getstore | URL, filename | Fetches desired URL, and stores it in a file |

    | mirror | URL, filename | Same as getstore but checks date of last modification
    |


