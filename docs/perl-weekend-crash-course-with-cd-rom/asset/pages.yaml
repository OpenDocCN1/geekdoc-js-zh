  md: '# Quoting operators


    I have said in previous sessions that Perl is fairly relaxed about how you go
    about making quotations. This is true, up to a point. For most practical purposes,
    you can use quotes, or not, as you choose. However, when you are trying to construct
    very specific sorts of quotes, the rules about how it is done become very important.


    # Double quotes


    The double quote character, ", is the standard quote that we use most of the time.
    This operator renders the enclosed string, but also allows for interpolation.
    Interpolation means that if you include a variable name in your string, the value
    of that variable will be substituted for the name. Thus if you were to write:


    ```

    $name = "Joe"

    print "My name is $name"

    ```


    the output would be


    ```

    My name is Joe

    ```


    In addition to variable names, the double quote operator allows for the interpolation
    of escape sequences. You will recall that if you want to insert a newline character
    in your output, you use the sequence \n. Thus


    ```

    $name = "Joe"

    print "My name is $name. \n"

    ```


    will print


    ```

    My name is Joe.

    ```


    and then move the cursor to the start of the next line before printing the prompt.
    The construction qq() is a synonym for the double quote operator. The statement


    ```

    print "My name is $name. \n"

    ```


    is exactly the same as


    ```

    print qq(My name is $name. \n)

    ```'
  merge: -1
