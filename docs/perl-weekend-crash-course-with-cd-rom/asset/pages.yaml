    # Socket


    The Socket module enables you to create TCP or UDP sockets and creates a socket
    handle for them to be manipulated. For example,


    ```

    #!/usr/bin/perl


    use Socket;


    socket(HANDLE, $proto);

    ```


    creates a socket handle called HANDLE, using the protocol specified in $proto.
    $proto needs to be set with a statement like


    ```

    $proto = getprotobname(''tcp'');

    ```


    Once the socket is created, it can be opened using the connect (for TCP) or send
    (for UDP) functions.'
