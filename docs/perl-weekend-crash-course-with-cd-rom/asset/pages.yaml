    Saturday Afternoon


    Other than these new features, this program is entirely straightforward. It uses
    simple iteration to go through each file in the working directory by turn.

    You have, however, a new function. The chdir function changes the current-working
    directory to whatever is given as an argument. It is important to remember that
    this function has effects that are relative to whichever directory is seen as
    the current directory. For example, the dot character (.) refers to the current
    directory, and will change when you use chdir. It is also important to remember
    when you change the current directory, you need to open it before you can do any
    reads on it. The initial working directory is always the one in which the program
    was started.


    # Creating and Destroying Directories


    ![](img/407bedec2b2c349369b174a7f5fb6718_185_0.png)


    One thing you might find especially useful is the ability to create new directories.
    This is especially true if you have a program that outputs a lot of data to files.
    It would be useful if you have a central location for these files.

    Creating directories is simple enough. One simply uses the mkdir function. Destroying
    directories is done with the rmdir function. Note that the directory itself must
    be empty for rmdir to work.


    Suppose you have a program that creates a lot of temporary files. You''d like
    to place these files in a central location, and then get rid of them when you''re
    done.

    You could insert these bits of code into your program:


    ```

    $tmpdir = "/tmp/junk";

    mkdir $tmpdir;

    opendir(TEMP, $tmpdir);

    chdir $tmpdir;

    open(JUNK, ">junkfile");

    ```


    Now you have your temporary directory and file ready and open for writing.

    When you''re ready to finish up, you can do:


    ```

    chdir "..";

    @list = readdir(TEMP);

    foreach $name (@list) {

    unlink($name);# deletes the file $name

    }

    rmdir(TEMP);

    ```'
