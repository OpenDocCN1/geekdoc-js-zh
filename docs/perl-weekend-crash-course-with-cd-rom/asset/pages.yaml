  md: '# Reading data from a file


    Assume that you have the file /home/joe/datafile, that contains this text:


    +   - first line of text

    - second line of text

    - third line of text

    - fourth line of text

    - fifth line of text

    - sixth line of text

    - seventh line of text

    - eighth line of text

    - ninth line of text

    - tenth line of text


    Now, consider the following code:


    ```

    #!/usr/bin/perl


    $datafile = "/home/joe/datafile"


    open(DATAFILE, $datafile);

    $line = <DATAFILE>

    print "$line \n"

    ```


    What happens when you run this code? You should get only the first line of text,
    followed by a blank line, and then your system prompt should come back. Why is
    this? Let''s tackle the blank line first.


    When you created the text file, you hit the Enter key after typing each successive
    line. That placed a newline character at the end of each line. When the interpreter
    executes the line


    ```

    print "$line \n"

    ```


    it prints attached newline character, along with the one we''ve specified. You
    have two choices for getting rid of the blank line: You could eliminate the newline
    character from your print statement, but you can''t be sure there''ll be a newline
    on every line, or you could change our input line to


    ```

    chomp($line = <DATAFILE>);

    ```


    Is this starting to look familiar? This looks an awful lot like our old friend:


    ```

    chomp($input = <STDIN>);

    ```'
