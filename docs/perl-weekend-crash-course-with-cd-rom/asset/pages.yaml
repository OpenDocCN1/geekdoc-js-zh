    Don''t try to figure out what this code does — you have the rest of the book to
    learn that. Rather, look simply at the visual aspect of it. You can see a couple
    of unique features. First, the lines preceded by hashesmarks (#) don''t look like
    programming code at all. Second, several programming instructions are enclosed
    in various parentheses and braces, and indented to various degrees. Finally, a
    number of braces are on lines by themselves. Although it may not be obvious at
