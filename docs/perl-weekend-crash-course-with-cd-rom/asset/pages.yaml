  md: '# Command line flags are sometimes referred to as switches or options. In fact,
    the Perl documentation mostly refers to them as switches.


    Selected flags are listed in Table 3-1. Don''t worry if some of the descriptions
    don''t make sense to you now. They''ll be more accessible when you''ve learned
    some of the language.


    # Table 3-1


    Selected Perl Command Line Flags


    +   - Turns off command flag processing. If the interpreter sees this flag, any
    flags that come after (to the right of) it will be ignored.


    +   -c Causes the interpreter to check the syntax of the program and then exit
    without running the program. This is very useful for debugging purposes.


    +   -d Runs the program under the Perl debugger.


    +   -e Executes the command that follows it from the command line.


    +   -h Prints a summary of Perl''s command line flags. (Think "h for help")


    +   -I Lets you add a directory to the list of directories that Perl searches
    for modules (additional prewritten Perl functions). If you have a module that
    you keep in a special place, you can specify it with this flag.


    +   -m M Allows you to include a module in your program. This is more common from
    done within the program.


    +   -U Allows you to use unsafe operations in your Perl program. At this point,
    the only thing that qualifies as an unsafe operation is the unleashing (deletion)
    of directories when running with root privileges.


    +   -v Prints the version and patch level of your Perl interpreter.


    +   -V Prints a summary of your interpreter''s configuration.


    +   -w This is a VERY important flag! This flag will print various aspects of
    your program''s syntax. If you''re writing a program of any complexity, you need
    to use this flag.'
