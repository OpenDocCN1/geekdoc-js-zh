    behavior. The c modifier will cause the replacement to be applied to everything

    that isn''t the original string. For example,


    ```

    $string = "mick and keith";

    tr/aeiou/x/c;

    ```


    would yield a $string of xixx axx keix.

    The d modifier suppresses the tr operator''s padding behavior. Thus,


    ```

    $string = "mick and keith";

    tr/mick/x/d;

    ```


    would make our $string equal to x and keith.

    The tr operator can be bound to a variable name in the same way that the s

    operator is — with the ~ assignment operator:


    ```

