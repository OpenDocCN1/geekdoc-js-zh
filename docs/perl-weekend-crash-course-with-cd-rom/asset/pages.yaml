  md: 'Thus get downloads a module, while make downloads and compiles the module,
    and test downloads, compiles, and tests the module. The easiest way to install
    any module, bundles or distribution is simply to use the install command. This
    takes care of all the steps necessary to download, build, and install any given
    module, bundle, or distribution.


    In the case of bundles, an entire sequence of modules will be downloaded and installed.
    For example, giving the command


    ```

    cpan> install Bundle::DBI

    ```


    will download and install a many modules related to database processing. After
    giving the command, you need do nothing while the modules are installed. (This
    can take a while depending on the size of the package, and the speed of your network
    connection. If it''s slow, you might want to have something else to do while the
    process runs.) Once you''ve installed everything you need to, give the command
    q and you will quit the CPAN program.


    # Installing Modules Without CPAN


    If for any reason you are unable or unwilling to use the CPAN program, there is
    an alternate method for installing modules. This method is similar to compiling
    and installing other kinds of software.


    As with CPAN, the first thing you need to do is find the package you want to install.
    You can do this by using the search engine at search.cpan.org. Once you''ve found
    the particular module you''re looking for, you can download it. If you''re using
    the search engine, you can download the package directly from that page. If not,
    use one of the CPAN FTP mirror sites. They are listed at www.perl.com/CPAN-local/SITES.html.


    Once you''ve got the package, unpack it using the command


    ```

    tar xvfz modulename.tar.gz

    ```


    where modulename is the name of the module''s tarball. Once the file is extracted,
    move into the directory created by the unpacking process, and list the contents
    of the directory. There should be a file called README in this directory. Read
    this file carefully. It will explain the proper procedure for installing the module,
    with any special considerations that you need to take into account.'
  merge: -1
