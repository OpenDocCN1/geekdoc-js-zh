  md: "# Mixing Argument Types\n\nWhat if you have a situation where you want to process\
    \ files on the command line using <>, and also use other types of arguments as\
    \ well? This is possible, provided you are careful to keep things arranged so\
    \ that you can keep them separate.\nThe <> operator uses @ARGV, but does so implicitly.\
    \ For example, consider a program like this:\n\n```\n#!/usr/bin/perl\nprint(shift,\
    \ \"\\n\");\nwhile (<>){\n    print:\nAnd invoked it like this:\nmyprog.pl hello\
    \ file1 file2\nthe output would be\nhello\nfirst line of file1\nsecond line of\
    \ file1\nfirst line of file 2\nsecond line of file 2\n```\n\nand so on. Because\
    \ we know that in this first argument will not be a file, we can handle it separately—in\
    \ this case splitting it with the shift function and printing it. The remainder\
    \ of the arguments are handled using the <> operator.\nThis will only work, if\
    \ you know what the format and order of the command-line arguments will be. If\
    \ you don't, you will need to use @ARGV explicitly, and use other techniques to\
    \ access the contents of any files named on the command line. We will tell more\
    \ about this sort of thing in Session 14.\nIf there are no filenames given as\
    \ arguments on the command line, the diamond operator takes its input from the\
    \ standard input. Thus, in a program invoked with no arguments,\n\n$input = <>;\n\
    is is the same as\n\n```\n$input = <STDIN>\n```"
