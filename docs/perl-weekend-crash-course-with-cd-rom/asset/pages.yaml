  md: '# Splitting on ampersands


    When a form uses the GET method for many key-value pairs, it sends it in a string
    that separates the key-value pairs with an ampersand (&). Your CGI script must
    separate these pairs in order to use this data. This can be done using Perl''s
    split function. The split function allows you to split a string into an array
    of strings, breaking on a specific character. The Perl code to split your QUERY_STRING
    into an array of key-value pairs, called @pairs, looks like this:


    ```

    @pairs = split (\/, $ENV{''QUERY_STRING''});

    ```


    You have created an array called @pairs that contains the key-value pairs contained
    in the QUERY_STRING. This will make parsing these values later.


    # URL Decoding


    As we have discussed, a Web URL-encodes the data sent from the HTML forms to the
    CGI. In order to use this information, you must decode this data. Using Perl''s
    commands for substitution and transliteration, you can easily decode the URL-encoded
    data.


    You can use this line in order to translate every + back into a space:


    ```

    $value =~ tr/+ / /;

    ```


    In order to convert the hex pairs back to their equivalent ASCII character, use
    the pack() function along regular expressions:


    ```

    $value =~ s/%([a-fA-F0-9][a-fA-F0-9])/pack("C",$1)/eg;

    ```


    Often, it is easier to save all of the values from the submitted form into a hash:


    ```

    $($key) = $value;

    ```


    # Putting It All Together


    The following CGI script saves the form data from the input stream into a string,
    stores it, decodes it, and prints out each value. This can be quite useful in
    debugging a script.'
  merge: -1
  pgno: 331
- img_proc: true
