    | <UL></UL> | Create a bulleted list |

    | <HR> | Insert a horizontal rule |


    Finally, HTML has tags to create forms for user input. However, the bare HTML
    simply gives the appearance of a form. In order to make functional forms, a CGI
    program is necessary. We''ll cover that at the end of this session. For now, the
    HTML tags to create the appearance of a form within an HTML document are shown
    in Table 27-2.


