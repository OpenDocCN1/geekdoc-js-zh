    exists.


    Often, you use a CGI script to handle multiple levels of interaction between a
    user and the Web server. An example of this would be a site with a survey script
    that would serve a survey question and form. After posting to this script, the
    server-repages the page to site visitors, with the updated survey results. The
    original document is served through the use of a CGI program, the POST/GET/ of
    the survey selection by the user is another interaction the server must handle,
    and other scripts involve many interactions between the client and the server.
    Again, on a high-traffic site, this can significantly slow down the Web server.
    It also increases the likelihood that a level of interaction will fail.


    While CGI programs are fast and fairly easy to implement on low-traffic sites,
    high-traffic sites and sites concerned with security, they may not be the correct
    solution to dynamic content generation. However, you have the ability to integrate
    Perl with Apache in a robust, secure way, mod_perl in a situation where Perl CGI
    scripts do not seem like the proper solution, mod_perl may be the answer.


    # Giving Apache Some Perl Muscle


    Perl and Apache are strong, but if you integrate them, you can make them stronger
    yet. If you link the Perl runtime library into the Apache server and provide a
    object-oriented interface to the server''s API, you can give Apache Perl muscle.
    Mod_perl enables you to do this.


    Mod_perl gives additional power and speed. It gives access to the Web server and
    enables you to intervene at any point in the process. This enables you to customize
    the process of authentication, logging, and other phases. Mod_perl has a very
    low runtime overhead, unlike CGI. In fact, mod_perl can replace CGI entirely,
    and run existing CGI programs transparently.


    The easiest way to compile mod_perl support into Apache is to run mod_perl''s
    Makefile.pl, which will configure the mod_perl module into Apache. Once this is
    complete and mod_perl is linked to httpd, you can run it with the -1 switch, which
    will list the compiled-modules.


    Existing CGI scripts should continue to run, though they may require an adjustment
    if write() is used. In developing new CGI scripts, it is best to use CGI.pm, as
    mod_perl and CGI.pm have no conflicts.


