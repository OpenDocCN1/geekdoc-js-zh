  md: '# Session 11—Basic Input and Output


    # The shift function


    One very helpful function for processing @ARGV values is shift. This function
    returns the leftmost value from the list, and then chops off the list, shortening
    the list by one. Thus, the previous program could be rewritten as


    ```

    #!/usr/bin/perl


    shift(@ARGV);

    print;      # first value is passed via the $_ variable

    shift(@ARGV);

    print;

    ```


    and so on.


    ![](img/407bedec2b2c349369b174a7f5fb6718_134_0.png)


    > In fact, since the name @ARGV can be passed implicitly, you could even pare
    that down to


    shift;

    print;

    shift;


    print;

    and so on; or even to

    print(shift);

    print(shift);


    and so on.


