  md: 'By contrast, the exec command replaces the Perl program with the shell command
    that is called. In other words, once the shell program is started, the Perl program
    has exited. This is important, if you try to use an exec in the middle of a program,
    you will not be able to execute the remainder of the Perl program.


    # backquotes


    Backquotes (sometimes called backticks), are equivalent to the system command.
    Thus, instead of doing


    ```

    $date = system("/bin/date");

    ```


    you could also do


    ```

    ''date = `/bin/date`;

    ```


    The only difference here is that while the system function passes the output of
    the shell command via the standard output, the backquote function captures the
    output of the enclosed command as a string.


    > The backtick character can often be found on the key to the immediate left of
    the number 1 on most keyboards.


    ![](img/407bedec2b2c349369b174a7f5fb6718_195_0.png)


    # Forking


    One interesting way of using the operating system is by using it to clone your
    Perl program using the fork function. fork makes a system call, that is, it interacts
    with the operating system, not by issuing a shell command, but by issuing command
    directly to the OS.


    Using fork can be a bit tricky, because of the way in which it works. Every time
    you fork a process, the new clone — the child process — must have a way to exit.
    If it doesn''t, you will create zombie processes that don''t die. They sit there,
    taking up space in your OS''s process table, and generally slowing things down.


    In addition, certain kinds of careless or malicious uses of fork can rapidly fill
    up your process table and memory, and crash your system. Consider


    ```

    #!/usr/bin/perl

    ```'
