  md: '# Session 1—Getting and Installing Perl


    If you are running a Microsoft Windows system, you may wish to go directly to
    www.activestate.com. This is the Web site of the ActiveState Corporation, which
    creates a version of Perl designed to run on Windows systems. While there is a
    pure Perl distribution for Windows, ActivePerl (the version of Perl created by
    ActiveState) is much easier to install and maintain. Even the core developers
    recommend that Windows users use ActivePerl.


    Likewise, Macintosh users may wish to proceed directly to www.macperl.com. MacPerl
    is a Perl distribution designed for the Macintosh. It is easy to install, and
    with lots of helpful applications to get you.


    Read the docs:


    > You will find that throughout this book I harp pretty consistently on the need
    to read documentation wherever it appears. While you might get annoyed at the
    constant admonitions, there''s a reason for it. The documentation that comes with
    programs is written by the programmers themselves, or people working directly
    with them. The documents that are packaged with software-specific to that version
    of the software. They are simply the most accurate and specific instructions you
    can possibly get on any particular piece of software. The downside of the included
    documents is that they''re not always especially user-friendly. That''s what books
    like this are for.


    ![](img/407bedec2b2c349369b174a7f5fb6718_32_0.png)


    # Which Version?


    At the time of this writing, the current version of Perl is 5.6.1, however, it
    is still common to find version 5.005 series installations around. While there
    have been some changes between the two versions, you may wish to upgrade, all
    of the examples in this book should work just fine with either version. However,
    if you find that you have a version of Perl installed with a version number lower
    than 5, you should upgrade immediately.


    # Installing under Linux/Unix


    As I mentioned previously, about any decent Linux or Unix system will have Perl
    already installed. Perl in an integral part of many of these systems, and in addition
    to the Perl interpreter, you may find Perl programs already on them.'
