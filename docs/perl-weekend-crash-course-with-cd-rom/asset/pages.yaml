  md: '# Using Files


    As you recall from Session 4, text files are nothing more than groupings of ASCII
    data identified by a name and a location on your computer''s hard drive. Files
    are a great way of dealing with fairly large amounts of text, which is something
    for Perl is well suited. Moreover, if you''re doing something like maintaining
    a Site, you are probably dealing with text files already. (While it is true that
    a Web site uses HTML files, HTML is just text with formatting tags.) Perl makes
    it easy to read, parse, and modify files fairly quickly. Or perhaps you intend
    for your program to run automatically (as a daemon or a cron-job) in order to
    perform some mechanical function. In this case, you''d probably want to keep a
    record of what it did. Keeping a log file would be the obvious way to go here.


    # Filehandles


    If you''re old enough to remember the CB craze of the ''70s, and you might remember
    that people used nicknames for themselves on the air, and that these nicknames
    were called "handles." Handles are alive and well in Perl, and like the handles
    of yore, a handle is still a sort of nickname. Database handles and directory
    handles are two common types, but perhaps the most common is the filehandle. (Yes,
    it''s all one word. For some reason, the creators of Perl seem to like it that
    way).


    > A handle in a Perl parlance is a token or symbol by which you refer to something
    external to the program. It is a way of abstracting that so that it can be incorporated
    into Perl''s syntax. In a way, a handle is like a variable name in that it is
    an arbitrary name that is used to represent something else. Unlike a variable
    name, a handle stands for something concrete like a file or directory — not an
    arbitrary value.


    Some functions, as print, allow for filehandles in their syntax. This allows the
    programmer to direct the output of that command (or the input to it) to come from
    the file represented by the filehandle.


    # Opening and closing files


    Before you can use a file, you need to open it. By doing this, you place the file
    in memory, and make the Perl interpreter aware of where it is. You open the file,
    and create its filehandle at the same time, using the open function:


    ```

    open(MYFILE, /home/joe/myfile);

    ```'
