    a CGI program to list what percentage of the people polled certain types of pets.
    (See "Parsing and Processing Data.")


    +   4. Name three items that have to be decoded after the form data has been submitted.
    (See "Parsing and Processing Data.")


    +   5. Write a document with associated CGI to allow the user to e-mail you comments.
    (See "Parsing and Processing Data.")'
