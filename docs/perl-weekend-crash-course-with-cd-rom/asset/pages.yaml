  md: '# Session 30—Apache and mod_perl


    be able to access world-readable files. However, different mod_perl scripts run
    using the same Perl interpreter instance. This means that a rogue mod_perl script
    can redefine the Perl objects and change how the mod_perl scripts act. You can
