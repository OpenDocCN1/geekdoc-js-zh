  md: '# Session 6—Basics of Programming Style


    ```

    if (/\n/) print "<P>";

    ```


    While this may seem straightforward enough, imagine if there were many other lines
    of code beside the print statement. Putting them all on a single line would make
    the code very confusing. Not only that, it is possible to enclose such a state-
    inside another similar statement. Thus, the statement


    ```

    if (something) { if (/\n/) { print "<P>"; }

    ```


    is possible. Likewise the statement


    ```

    if (something else) { if (something) { if (/\n/) { print "<P>"; } }

    ```


    and so on is possible. The level of complexity here is practically unlimited.
    You can see that beyond a certain level of enclosure, it becomes difficult to
    discern exactly which statements are enclosed inside which. By placing each statement
    on its own line, and indenting lines that are enclosed in other lines, the chain
    of dependency becomes:


    ```

    if (something else) { if (something) { if (/\n/) { print "<P>"; } }

    ```


    This also explains the brackets on the lines by themselves. By closing each block
    with a bracket on its own line, we create a visual enclosure for the block inside.
    To find the beginning of a particular block one need only scan up the bracket
    until a line that begins at the same indent level is found. All statements to
    the right of that indent level will be inside. This makes it much easier to isolate
    a section for editing purposes.


