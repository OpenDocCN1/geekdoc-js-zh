    Figure 27-2

    nThe form as it appears in the browser.


    Now that you can create static HTML documents, let''s go beyond static HTML.


    # Beyond Static HTML


    Today, Web sites are steadily changing from collections of static HTML documents
    to interactive sites. These sites require dynamic content and cannot rely on static
    HTML alone.


    There are two main ways to implement dynamic content within a Web page. The first
    method uses the Common Gateway Interface (CGI) and a server that re-serves a program
    to a client upon execution of the CGI program. The second way to implement dynamic
    content is to use Dynamic Hypertext Markup Language, or HTML. HTML is not really
    “dynamic HTML,” it is simply a way of putting HTML together with Cascading Style
    Sheets (CSS), the Document Object Module (DOM), and JavaScript or VBScript. HTML
    is a fairly new development without defined standards, while CGI is a de facto
    standard that has been around for many years.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Session 27—Introduction to Web Programming 297


    In the CGI implementation of dynamic content, the server handles the working and
    displays the dynamically created page to the user. While this costs in terms of
    network traffic and server processing time, it is handled by the server and follows
    a standard, so it is compatible with the software of most users.


    However, in the HTML implementation of dynamic content, the user''s Web browser
    handles the processing of the dynamic portion. The server does not play a part
    in processing the dynamic content. But, different Web browsers handle HTML differently,
    most notably in the DOM. The DOM is the browser recognizes the HTML elements within
    the JavaScript (or VScript). This means the developer must either write separate
    code for every Web browser or attempt to write compatible code across all platforms.


    Interactive sites are not used for entertainment only. The ability to interact
    with users in real time enables Webmasters to make their sites useful in many
    ways.


    # Making the Web Useful


    A common goal of Webmasters is to create functional sites that users enjoy using.
    In order for sites to be as useful as is engaging, the user must be able to interact
    with the content of the site. With dynamic content in Web sites, the user is given
    the ability to interact with the content of the site. Common examples of useful
    sites that use dynamic content include online shopping sites, search engines,
    and online support sites.


    Consider a man who needs a software package immediately. He travels to a Web site
    specializing in software, the package he is looking for into the site''s search
    tool, and decides to purchase the software package for immediate download. He
    selects the option to buy the software package, and is then prompted for his contact
    and account information. After this information is verified, he downloads the
    software to his computer. Upon installation, he encounters a problem. Instead
    of calling the technical support line of the software developers where he is sure
    to be on hold for hours, he accesses his Web site. At their site, he searches
    for his specific problem, and the site dynamically presents him with the possible
    solutions, and ignores solutions to unrelated problems.


    In this example, dynamic content is accessed at least three times (searching for
    the software package, ordering it, and searching for his problem). By implementing
    dynamic content in Web sites, the Web is becoming more useful. Perl scripts using
    the Common Gateway Interface are one way dynamic content is implemented on the
    Web today.


    ![](img/407bedec2b2c349369b174a7f5fb6718_322_0.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# The Common Gateway Interface


    The Common Gateway Interface (CGI) is a de facto standard for interfacing external
    applications with other servers. As we have discussed, HTML documents alone are
    static. To create pages that contain dynamic content, we use CGI programs executed
    in real time, and output dynamic information.


    For example, if a user is shopping at an bookstore and wishes to search for Perl
    Weekend Crash, the page that displays the textbox to the phrase is contained in
    a static HTML document. However, once the user submits the query, retrieve the
    query response, and display it to the user.


    Since a CGI program is executed on the system every time a user submits a form,
    there are a couple of points to keep in mind. First, the program should process
    very quickly. If it does not, the user will be stuck at nothing while it processes.
    Second, reactionary measures must be taken to prevent harmful things to the system.
    In general, the Web server will require all CGI programs reside in a specified
    folder on the system. This keeps average users from creating CGI programs, unless
    they have access granted by the system administrator.


    Since Perl is a scripting language and therefore does not require a compile of
    the source code to create executable code, Perl CGI programs are CGI scripts.
    If a CGI program was written in C, the source code would have to be compiled and
    then the executable placed in the proper folder, and it would not be called a
    CGI script.


    CGI scripts written in Perl can perform powerful functions in a short time, serving
    the user dynamic content efficiently.


    # REVIEW


    Hypertext Markup Language (HTML) is the language that defines how the Web page
    is displayed. However, HTML alone can only define a static document. Static documents,
    by definition, are not interactive. The current push towards interactive sites
    online necessitates that sites implement dynamic content. The Common Gateway Interface
    (CGI) and dynamic HTML (DHT) are the two main ways that dynamic content is created
    today. CGI is a de facto standard for interfacing external applications with data
    servers. The external application is presented to the user, generally as an HTML
    document with forms. The user uses the forms and upon submission of the form,
    a CGI program runs and re-serves the user another HTML document based upon the
    submitted form information. CGI scripts written in Perl serve dynamic content
    efficiently to the user.'
