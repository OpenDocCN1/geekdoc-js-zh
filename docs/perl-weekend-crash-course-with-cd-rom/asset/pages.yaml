    # The Downside of CGI


    I spoke about the benefits of CGI this afternoon, there are always downsides to
    every upside. CGI programs are no different. CGI programs have a high runtime
    overhead, pose a certain security risk, and often require multiple interactions
    between the client and the server.


    Sites that utilize CGI programs to deliver dynamic content must execute the CGI
    script every time serve the dynamic content to the user every time the site is
    accessed. On a high-traffic site, this can cause the Web server to slow significantly.


    Since CGI scripts are executed on the server, they can access privileged server
    information if the script is careless. A rogue user could exploit a CGI script
    and gain access to a server without permission or down a Web server with well-placed
    denial of service (DoS) attack. If you program well, and are careful with


