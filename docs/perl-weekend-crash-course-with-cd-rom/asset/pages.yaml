  md: '# Session 8—Variables 2: List and Hash Data


    # Hash-specific functions


    There are a couple of aspects that are unique to working with hashes, and these
    require some special functions.


    # keys() and values()


    The keys() function is used to extract only the keys from the hash. For example,
    you extract the names of your students like so:


    ```

    $grades = %("betsy", 84, "jim", 76, "alex", 92, "melissa", 88);

    @names = keys(%grades);

    ```


    The list @names contains the names of your students.

    Likewise, you can extract the scores by using the values() function:


    ```

    $grades = %("betsy", 84, "jim", 76, "alex", 92, "melissa", 88);

    @scores = values(%grades);

    ```


    Now the @scores list will contain values from the hash.


    # delete()


    The final hash function makes it possible for you to remove a key/value pair from
    a hash. Suppose that Melissa has moved out of town, and you need to remove data
    from your record book. You simply use the delete() function, like so:


    ```

    delete $grades(melissa);

    ```


    and her key/value pair will be expunged from the hash.


    # Hash slices


    Despite another Perl term that sounds like food, hash slices are actually a way
    of streamlining the process of assigning key/value pairs to a hash. Suppose that
    you''ve just a bunch of new students assigned to your class. You give them all
    a test, and now you need to insert their scores into the %grades hash.


    The obvious (but slow and clumsy) way to do this would be to simply assign each
    individually:


    ```

    $grades("jane")=79;

    $grades("dean")=71;

    $grades("susan")=83;

    ```'
