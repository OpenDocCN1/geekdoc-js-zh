  md: '# SESSION


    ![](img/407bedec2b2c349369b174a7f5fb6718_236_0.png)


    # Functions II: User-Created Functions and Subroutines


    # Session Checklist


    +   - Creating subroutines

    - Using subroutines in your programs

    - Passing data to subroutines

    - Returning values from subroutines


    Up to this point, the vast majority of the programming you''ve done has been completely
    linear. That is, it starts at the top of the program and works its line by line
    to the bottom. This kind of structure has an attractive simplicity; in order to
    follow the working of a program, one need only read it top-to-bottom. The downside
    of this approach is that in practice, you end up repeating a lot of code. Any
    time you tend to do something in the same way that it has been done previously
    (which tends to happen in programming), you find yourself writing something similar
    to — or exactly the same as — something you''ve already written.


    Fortunately, Perl lets the programmer define functions and subroutines that can
    be called from any place in the program. This allows you to avoid duplicating
    your efforts, since you need only write any given routine once, but you can use
    it any number of times.'
