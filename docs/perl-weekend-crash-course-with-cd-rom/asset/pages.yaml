  md: "# Session 15—Advanced Input and Output: Directory Manipulation\n\nThe previous\
    \ example is typical of the kinds of things that Perl is good at. Though short\
    \ and simple, it is actually quite powerful. It's well worth your while to get\
    \ comfortable with it, since you'll probably find yourself writing similar things\
    \ often.\n\nIf you're planning on working on files outside your immediate home\
    \ environment, you may want to add a few file tests to make sure that the files\
    \ you want to work on have the appropriate permissions:\n\n```\n#!usr/bin/perl\n\
    \nopen(OUTPUTFILE, \".output\");\n\nopendir(MYDIR, \"/home/me/mydatadir\") ||\
    \ die \"we have a problem\";\n@files = readdir(MYDIR);\nclosedir(MYDIR);\n\nforeach\
    \ $file (@files) {\n    if ( -r $file) {\n        open(READFILE, $file) || die\
    \ \"couldn't open $file\";\n        while(<READFILE>) {\n            print OUTPUTFILE;\n\
    \        }\n    } else {\n        print \"You do not have read permission on $file\"\
    ;\n    }\n}\nclose(READFILE);\n```\n\nThis saves you having to abort the program\
    \ if you run into inaccessible files, and also makes it clear that the problem\
    \ is one of permissions, and not something more fundamental.\n\n# Moving Around\
    \ the File System\n\nSuppose you need to find a certain file, but you don't know\
