  md: '# Session 25—The Standard Library


    # English


    The English module allows you to use “English” names for special variables. These
    names are the same as the names used by the Unix awk program. For example, in
    Perl, the return value from the previous function is stored in the variable $_.
    Using the English module, we could use the name $ARG for that variable.


    # lib


    The lib module enables you to manipulate the module search path variable, @INC,
    as your program is being compiled.


    # Shell


    The Shell module enables you to run Unix shell commands inside your Perl program
    without having to use a system command or backquotes. For example, you could use
    the cat command like this:


    ```

    #!/usr/bin/perl


    use Shell;


    $file = cat("<somefile");

    print $file;

    ```


