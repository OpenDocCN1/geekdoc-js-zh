    # Installing Packages


    The meat of the CPAN program, however, is its ability to download and install
    modules, bundles, and the like. The commands for doing that are shown in Table
    21-2.


    | Command | Action |

    | --- | --- |

    | get | download |

    | make | make (implies get) |

    | test | make test (implies make) |

    | install | make install (implies test) |

    | clean | make clean |

    | look | open subshell in these dists directories |

    | readme | display these dists README files |


    Each of these commands, except for look and readme a is a step in the compilation
    and installation process. Note that many of them imply the previous step.'
