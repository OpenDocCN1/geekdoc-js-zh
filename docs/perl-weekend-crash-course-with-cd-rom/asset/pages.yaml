- img_proc: true
  md: "# Session 20—Functions II: User-Created Functions and Subroutines\n\n# # Nonlinear\
    \ programming\n\nI said at the top of this session that till now, all of your\
    \ programming was done top-to-bottom. With the introduction of subroutines, all\
    \ this changes. Your subroutines can appear anywhere in the program (though it\
    \ is common to group them all together at the beginning or at the end), and can\
    \ include anything that might appear in any program, including other subroutines,\
    \ or even themselves (in the case of recursive functions—explained later in this\
    \ session). This greatly expands your bag of programming tricks, but it also forces\
    \ you to change the way you think about programming. Instead of thinking of the\
    \ program as a straight line that goes from the top to the bottom, you must now\
    \ think of it as something of an integrated whole.\n\nEach time you use a subroutine,\
    \ you find yourself whiskked off to a different part of the program, and when\
    \ the subroutine is finished, you are whiskked back to where you left off. If\
    \ the subroutine invokes another subroutine, you are whiskked from the first subroutine\
    \ to the second, back to the first, and then back to the main part of the program.\
    \ If the subroutine calls itself, you are whiskked from the main program to the\
    \ subroutine, to a second (and possibly third, fourth, or hundredth) iteration\
    \ of the same subroutine, and back.\n\nInstead of thinking about your program\
    \ as a linear succession of steps, you must now think of your program as a machine\
    \ with many parts that all interact with each other. In order for the whole machine\
    \ to work, each part must perform its function properly. As a programmer, you\
    \ must be able to keep all of these relationships in mind. It is not always easy\
    \ to develop this mindset, but once done, you will find that what you accomplish\
    \ with your programs will take a quantum leap.\n\nI have referred to functions\
    \ that the programmer writes as user-created functions and also as subroutines.\
    \ These are the same thing, and from this point on, I prefer *subroutine* as I\
    \ believe it is somewhat more descriptive.\n\nOne creates a subroutine according\
    \ to the following format:\n\n```\nsub name {\n  some code;\n}\n```"
  merge: -1
  pgno: 238
- img_proc: true
  md: "sub is a special word that lets the interpreter know what comes next is a subroutine\
    \ definition. name is the name that you give your subroutine. This can be anything\
    \ as long as it doesn't conflict with any other function's name. (As a matter\
    \ of practice, though, it's best to name something descriptive. It may seem cute\
    \ to name a subroutine harry, but it'll vex you when you forget harry was supposed\
    \ to do.) The name is followed by curly braces ({}), inside of which is the code\
    \ that makes up the function. A simple (rather useless) example of a subroutine\
    \ might look like this:\n\n```\nsub say_my_name {\n    print $name;\n}\n```\n\n\
    Now, anywhere the say_my_name subroutine is invoked, it will print out the value\
    \ of the variable $name.\n\n# Using the Functions You Create\n\nYou use your subroutines\
    \ in a program in the same way that you use native functions—by creating statements\
    \ and expressions that use them. The only difference is that in using a subroutine,\
    \ you must include parentheses after the name of the function, as illustrated\
    \ in the following:\n\n```\n#!/usr/bin/perl\n\n# This is the main part:\n$name\
    \ = \"Joe\"\nsay_my_name();\n```\n\n```\n# This is the subroutine:\nsub say_my_name\
    \ {\n    print \"$name \\n\"\n}\n```\n\nWhen the interpreter reaches a part of\
    \ a program where a subroutine is called, it immediately skips to where the subroutine\
    \ is defined, executes that code, and then jumps back to where it left off."
  merge: -1
  pgno: 239
- img_proc: true
  md: "# Return values\n\nLike native functions, subroutines have a return value.\
    \ By default, the return value of a subroutine is the return value of the last\
    \ statement evaluated within the subroutine. Thus, given\n\n```\n#!/usr/bin/perl\n\
    \n$name = joe;\nprint(say_my_name(), \"\\n\");\n\nsub say_my_name {\n    print\
    \ \"$name \\n\";\n}\n```\n\nThe return value of the subroutine will be 1, because\
    \ the line will have been successfully printed. If you run this program, the output\
    \ will be:\n\nJoe\n1\n\nIf you want to change the return value produced by the\
    \ subroutine, you can do using the return function:\n\n```\n#!/usr/bin/perl\n\n\
    $name = joe;\nprint(say_my_name(), \"\\n\");\n\nsub say_my_name {\n    print \"\
    $name \\n\";\n    return \"done\";\n}\n```\n\nThis will produce the output:\n\n\
    Joe\ndone\n\nThis is a trivial example. The return function becomes much more\
    \ useful when your subroutine actually produces some data. For example,"
  merge: -1
  pgno: 240
- img_proc: true
  md: "```\n#!/usr/bin/perl\n\n$a = 5;\n$b = 3;\nprint(add_a_and_b(), \"\\n\");\n\n\
    sub add_a_and_b {\n  $c = $a + $b;\n  return $c;\n}\n```\n\nreturns the value\
    \ of the addition operation.\n\n# Passing arguments to functions\n\nMany Perl\
    \ native functions take arguments. The print function, for example takes arguments\
    \ as the data it is supposed to print, well as (optionally) a filehandle that\
    \ tells where to print it. Arguments make a function much more useful in that\
    \ they can modify the behavior of the function in response to certain conditions.\n\
    Subroutines also take arguments. As you saw previously, when you invoke a subroutine,\
    \ follow the name with parentheses. If you place anything inside these parentheses,\
    \ it is interpreted as an argument, and is assigned to a special variable — the\
    \ list variable @.\n\nThe @_ variable is local to the subroutine. That is, it\
    \ exists only within the subroutine, so that each subroutine in your program can\
    \ have its own @_ variable without conflicting with other subroutines.\n\nConsider\
    \ the following:\n\n```\n#!/usr/bin/perl\n\nprint( add_us(2,3), \"\\n\");\n\n\
    sub add_us {\n  $result = $_[0] + $_[1];\n  return $result;\n}\n```\n\nRemember\
    \ that the scalar values $_[0] and $_[1] correspond to the first two elements\
    \ of the list @_. This means that you can pass any two values to the subroutine,\
    \ and they will be added here. Try modifying the program to make it more general:"
  merge: -1
  pgno: 241
- img_proc: true
  md: "# Session 20—Functions II: User-Created Functions and Subroutines 217\n\n```\n\
    #!/usr/bin/perl\n```\n\n```\nprint \"We need two numbers to add together. \\n\"\
    \nprint \"Enter the first number: \\\";\nchomp($a = <STDIN>);\nprint \"Enter the\
    \ second number: \\\";\nchomp($b = <STDIN>);\n```\n\n```\nprint(\"The result is:\
    \ \", add_us($a,$b), \"\\n\");\n```\n\n```\nsub add_us {\n    $result = $_[0]\
    \ + $_[1];\n    return $result;\n}\n```\n\nYou can think of the $_ variable as\
    \ being a sort of subroutine-specific version of the @ARGV variable. Just as the\
    \ @ARGV variable lets you pass arguments to the program when you run it, the $_\
    \ variable lets you pass arguments to the subroutine when you call it.\n\nWhenever\
    \ possible, you should try to get data in and out of your subroutines using arguments\
    \ and return values rather than global variables. The reason for this is that\
    \ at some point, you might want to extract your function and use it in other programs.\
    \ If you've used global variables in your subroutine, you'll have to change them\
    \ to suit each and every program you write, whereas using arguments and return\
    \ values, you should be able to plug them in anywhere you need them.\n\n# Private\
    \ variables\n\nWhen writing subroutines, it's usually a good thing to keep the\
    \ variables in a given function separate from the variables in other functions,\
    \ and the variables pertaining to the program as a whole. This helps you keep\
    \ organization within your program. Note in the last subroutine in the previous\
    \ section that the variable @ exists only within that function. When a variable\
    \ is limited to a single function it is called a *private* variable. Other functions\
    \ have their own $_ variables, but they never conflict because the Perl interpreter\
    \ knows that they are meant to be private.\n\nSuch is not the case with variables\
    \ you define in your subroutines. In the absence of any indication to the contrary,\
    \ the interpreter will assume that they are"
  merge: -1
  pgno: 242
- img_proc: true
  md: "the same as the variables that are used in the rest of the program. That is,\
    \ the interpreter will assume that they are global variables.\n\nIf you want to\
    \ create a private variable, you do so by using the my function, like so:\n\n\
    ```\nmy $classname = value;\n```\n\nWhen the interpreter sees the word my, it\
    \ knows that the variable is not intended to exist outside the function in which\
    \ it is defined. You can have variables with the same name in other functions,\
    \ or within the main structure of the program and they will be kept separate.\n\
    \n# Recursive Functions\n\nRecursive functions are functions that call themselves.\
    \ A general example of a recursive function might be:\n\n```\nsub I_Am_Recursive\
    \ {\n  I_Am_Recursive();\n}\n```\n\nThose of us trained in the language arts may\
    \ well balk at the idea that a function can be part of its own definition, but\
    \ from a functional point of view, there is no reason why a function can't be\
    \ recursive. In fact, the only thing that differentiates a recursive function\
    \ from a nonrecursive function is the requirement that a recursive function must\
    \ have some sort of ending condition built in. This is not so much a formal requirement\
    \ as a practical one. The previous general case has no ending condition, therefore\
    \ will continue to call itself forever. The ending condition is needed to avoid\
