  md: '# # Get Up to Speed on Perl in a Weekend!


    CD-ROM INCLUDES:


    +   * Perl 5.6.1, plus binary distributions for Red Hat and Debian


    +   * Assessment software to help gauge your progress


    +   * Operators


    The big day is Monday. The day you get to show off what you know about Perl. The
    problem is, you''re not really up to speed. Maybe it''s been a while since you
    worked with Perl. Or maybe you just like a challenge. In any event, we''ve got
    a solution for you—Perl Weekend Crash Course. Open the book Friday evening and
    Saturday afternoon, after completing 30 fast, focused sessions, you''ll be able
    to jump right in and start writing Perl scripts. It''s as simple as that.


    # ## The Curriculum


    FRIDAY

    Evening: 4 Sessions, 2 Hours


    +   * Getting and Installing Perl

    * An Overview of the Language

    * The Very Basics

    * Getting Help


    SATURDAY

    Morning: 6 Sessions, 3 Hours


    +   * Using Text Editors

    * Basics of Programming Style

    * Variables 1: Scalar Data

    * Variables 2: List and Hash Data

    * Statements and Expressions

    * Operators


    SATURDAY, Continued

    Afternoon: 6 Sessions, 3 Hours


    +   * Basic Input and Output

    * Control Structures

    * Functions II Native Functions

    * Advanced Input and Output: File Manipulation

    * Advanced Input and Output: Directory Manipulation

    * Using the Operating System


    SUNDAY

    Morning: 6 Sessions, 3 Hours


    +   * Getting and Installing Packages and Modules

    * Unique Packages and Modules

    * A Case Study: The Database Interface Module

    * Creating Your Packages and Modules

    * The Standard Library

    * References


    Afternoon: 6 Sessions, 2 Hours


    +   * Regular Expressions

    * Data Transformations

    * Formats

    * Functions III: User-Created Functions and Subroutines


    System Requirements:

    PC running Windows

    9/2000/Me/XP; Linux or Unix;

    CD-ROM drive..

    "What''s on the CD-ROM"

    appendices for details andncomplete system requirements


