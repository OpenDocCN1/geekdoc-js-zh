    When learning to write JavaScript, it''s easy to make simple mistakes that cause
    your whole script to fail. Here are some tips and guidelines to keep you from
    pulling your hair out.


    # Case Sensitivity


    When you name a variable or function


    # Comments


    Comments are an important part of the coding process even though they don''t actually
    do anything. They are helpful hints for other people who might read your code.
    More often, they remind me of why I wrote that weird piece of code yesterday.


    Single-line comments look like this:


    ```

    // This is a single-line comment

    nreturn true; // Comment after code

    ```


    Multiline comments look like this:


    ```

    /* This comment can wrap

    into the next line */

    ```'
  - '[PAGE 23]


    # Semicolons


    JavaScript statements should end with a semicolon like sentences end with a period.
    Technically they are optional, but that’s only because JavaScript interpreters
    add them automatically at the end of most lines. It’s best to get into the habit
    of adding the semicolons yourself because there can be strange side effects when
    you let the interpreter do it for you. All of the examples in this book to demonstrate
    proper semicolon usage.


    # Whitespace and New Lines


    Most whitespace such as spaces, tabs, and empty lines is ignored in JavaScript
    and usually just aids readability. In fact, on large-scale production code, all
    nonessential whitespace is usually stripped out so that script files download
    quicker. In my examples, I’ll try to demonstrate how best to use whitespace for
    readability.


    # Reserved Words


    JavaScript reserves certain words for specific uses, so be careful to avoid the
    following unless you mean to use them:


    +   break for throw

    case function try

    catch if typeof

    continue in var

    default instanceof void

    delete new while

    do return with

    else switch

    finally this'
