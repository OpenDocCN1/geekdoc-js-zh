    \ functions.\n\nBy clearing a timeout, you can stop the callback function from\
    \ ever executing. Here's a good way to make nothing happen:\n\n```javascript\n\
    var timeoutId = setTimeout(callback, 3000);\nclearTimeout(timeoutId);\n```\n\n\
    In this example, the callback function keeps track of how many times it gets called\
    \ and clears the interval after five calls.\n\n```javascript\nfunction fiveTimes()\
    \ {\n  console.log(\"Interval \" + fiveTimes.count);\n  // Add 1 to count and\
    \ compare it to 5. If\n  // over 5, stop the interval\n  if (++fiveTimes.count\
    \ > 5) {\n    clearInterval(intervalId);\n  }\n}\nfiveTimes.count = 1;\n```\n\n\
    ```javascript\nvar intervalId = setInterval(fiveTimes, 3000);\n```\n\nThe console\
    \ will count up to 5 before clearing the interval and stopping.\n\n## Asynchronous\
    \ Programming\n\nThe setTimeout() and setInterval() functions are the first examples\
    \ in this book of asynchronous programming. You'll also encounter this crucial\
    \ JavaScript concept when you learn about events, Ajax, and animation in Chapters\
    \ 11, 15, and 16, respectively.\n\nA script is asynchronous when code can be executed\
    \ at arbitrary points in time. JavaScript embraces this concept by treating functions\
    \ as just another type of data. You can pass around functions as callbacks and\
    \ event handlers, not knowing exactly when (if ever) the browser will call them.\
    \ You may want a function to run when the user clicks the mouse, but you can't\
    \ know when they will actually do so.\n\nAsynchronous programming makes function\
    \ context binding much more complicated. Consider this example:\n\n```javascript\n\
    var myWeb = {\n  value : \"myObject's value\",\n  method : function() {\n    console.log(this.value);\n\
    \  }\n}\nsetTimeout(myObject.method, 3000);\n```\n\nThe method function executes\
    \ about three seconds later, but it's no longer bound to myObject. Without that\
    \ context, this.value returns undefined.\n\n## Asynchronous Programming (continued)\n\
    \nThe most common solution is to create an anonymous function that calls the function\
    \ in the context of myObject.\n\n```javascript\nsetTimeout(function() {\n  myObject.method();\n\
    }, 3000);\n```\n\nYou could also use the bindContext() function from Chapter 6.\n\
    \n```javascript\nsetTimeout(bindContext(myObject.method, myObject), 3000);\n```\n\
    \nYou may also want to pass arguments to the callback function.\nAnonymous functions\
    \ are also useful in this case:\n\n```javascript\nsetTimeout(function() {\n  callbackFunction(\"\
    an argument\");\n}, 3000);\n```\n\nKeep these techniques in mind when working\
    \ with events and other code that involves indeterminate delays in execution.\n\
    \n## Client-Side Scripting\n\nUp until now, I really haven't covered any practical\
    \ uses of JavaScript. You can go only so far manipulating simple data such as\
    \ strings and arrays. JavaScript is a \"scripting language,\" which by definition\
    \ operates inside some kind of environment. Usually, this environment is an HTML\
    \ document in a Web browser. From here on, this book focuses on interacting with\
    \ browsers, Web pages, servers, and user input.\n\n## Script Tags\n\nHTML provides\
    \ a means of including executable code in the form of the <script> element. You\
    \ can include code in a Web page in two ways.\n\n### Inline Scripts\n\nInline\
    \ scripts include JavaScript code directly in the markup, like this:\n\n```html\n\
    <script type=\"text/javascript\">\n  var element = document.getElementById(\"\
    domId\");\n</script>\n```\n\nInline scripts allow you to include your code as\
    \ text right in the Web page. This is great for quickly testing a solution or\
    \ adding code that is specific to this particular page.\n\n### Remote Scripts\n\
    \nRemote scripts instruct the browser to download a separate script file and execute\
    \ it in the page. The src attribute points to the script file like any other URL.\n\
    \n```html\n<script src=\"my-script.js\" type=\"text/javascript\"></script>\n```\n\
    \nIn most cases, this is the preferred solution for a few reasons:\n\n- Storing\
    \ JavaScript directly in HTML with an inline script makes your HTML files larger\
    \ and harder to maintain.\n- You can easily include the same script in multiple\
    \ pages just by including the same remote <script> tag.\n- Browsers cache JavaScript\
    \ files so they don’t have to download a script file twice when visiting another\
    \ page that uses it.\n\n## Where to Include the <script> Tag\n\nYou can use the\
    \ <script> tag nearly anywhere in an HTML document. I recommend including inline\
    \ and remote scripts at the very end, right before the closing `</body>` tag.\
    \ This has two advantages:\n\n- When some browsers encounter a <script> tag, they\
    \ halt any other processes until they download and parse the script. By including\
    \ scripts at the end, you allow the browser to download and render all page elements,\
    \ style sheets, and images without any unnecessary delays.\n- Since the browser\
    \ encounters and renders the Web page before executing any script, you know that\
    \ all page elements are already available for you to retrieve and manipulate.\n\
    \nPutting <script> tags at the end has one distinct disadvantage, however. Because\
    \ the Web page downloads and renders first, there may be a noticeable delay before\
    \ any scripts execute. This should not be the case with the short examples in\
    \ this book, so I will use this general template for HTML documents:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title></title>\n  <link rel=\"stylesheet\"\
    \ href=\"styles.css\" type=\"css\" />\n</head>\n<body>\n  <!-- page elements go\
    \ here -->\n  <script src=\"my-script.js\" type=\"text/javascript\"></script>\n\
    </body>\n</html>\n```\n\n## Nonblocking and Lazy Loading\n\nWhat I'll show next\
    \ is an advanced technique, but you'll encounter it in later chapters that use\
    \ certain JavaScript libraries, so I'll briefly explain it here.\n\nYou can use\
    \ JavaScript to include other script files in a Web page. You simply create a\
    \ <script> element and append it to the document.\n\n```javascript\nvar script\
    \ = document.createElement(\"script\");\nscript.type = \"text/javascript\";\n\
    script.src = \"my-script.js\";\ndocument.getElementsByTagName(\"head\")[0].appendChild(script);\n\
    ```\n\nWhen you dynamically append a script to a page, the browser does not halt\
    \ other processes, it continues rendering page elements and downloading resources.\
    \ This is called *nonblocking* script loading.\n\nYou can also use this technique\
    \ at arbitrary times in your script. You may decide to include only a small amount\
    \ of code at page load and then download other script files only when needed.\
    \ This is called *lazy loading*.\n\nMany popular JavaScript libraries now include\
    \ utility functions to encourage these practices. Some libraries exist specifically\
    \ for this purpose, such as LABJs (http://labjs.com/). Other libraries use it\
    \ as the primary method of including scripts in a page, such as YUI3 (http://developer.yahoo.com/yui/).\n\
    \nUnless they use a library that leverages nonblocking script loading, the examples\
    \ in this book will use simple <script> elements to include JavaScript in HTML.\n"
  mdcn: "\n延迟计时结束后，它会等待直到线程空闲。（在此处“指令”指的是浏览器执行的任何语句、表达式、事件或其他代码段。所有指令的执行都需要花费有限的时间，即使只有几毫秒。）\n\
    \n如果你为 `delay` 传入 0 毫秒，它将以最短延迟执行 `func`。\n\n`setTimeout()` 的返回值是一个标识符，用于配合 `clearTimeout()`。\n\
    \n```javascript\nfunction callback() {\n  console.log(\"At least three seconds\
    \ passed\");\n}\n```\n\nsetTimeout(callback, 3000);\n\n短时间延迟后，控制台将输出以下内容：\n\n\"\
    At least three seconds passed\"\n\n## setInterval(func, delay)\n\n`setInterval()`\
    \ 函数每隔 `delay` 毫秒重复执行一次函数。它还会返回一个标识符，用于 `clearInterval()`。\n\n与 `setTimeout()`\
    \ 不同，你必须传递大于 0 毫秒的延迟。\n\n```javascript\nsetInterval(callback, 3000);\n```\n\n\
    大约每三秒，控制台会显示 \"At least three seconds passed\"，直到你卸载页面为止。\n\n如果间隔时间到达时浏览器正忙于其他指令，`setInterval()`\
    \ 会等待直到浏览器空闲以执行回调函数。和 `setTimeout()` 一样，你不能依赖 `setInterval()` 在精确的时间点后执行回调。\n\n\
    ## clearInterval(id), clearTimeout(id)\n\n如果你需要停止回调函数的执行，你必须存储 `setTimeout()`\
    \ 或 `setInterval()` 返回的标识符，并将其传递给这两个函数之一。\n\n通过清除定时器，你可以停止回调函数不再执行。这里有一个让它“什么都不发生”的好方法：\n\
    \n```javascript\nvar timeoutId = setTimeout(callback, 3000);\nclearTimeout(timeoutId);\n\
    ```\n\n在例示例中，回调函数记录了它被调用的次数，并在调用五次后清除间隔。\n\n```javascript\nfunction fiveTimes()\
    \ {\n  console.log(\"Interval \" + fiveTimes.count);\n  // 将 count 加 1 并与 5 进行比较。如果\n\
    \  // 超过 5，则停止间隔\n  if (++fiveTimes.count > 5) {\n    clearInterval(intervalId);\n\
    \  }\n}\nfiveTimes.count = 1;\n```\n\n```javascript\nvar intervalId = setInterval(fiveTimes,\
    \ 3000);\n```\n\n控制台会计数到 5，然后清除间隔并停止。\n\n## 异步编程\n\n`setTimeout()` 和 `setInterval()`\
    \ 函数是本书中异步编程的第一个示例。当你分别在第 11、15 和 16 章学习事件、Ajax 和动画时，你也会遇到这个关键的 JavaScript 概念。\n\
    \n当代码可以在任意时间执行时，脚本就是异步的。JavaScript 通过将函数视为另一种数据类型来拥抱这一概念。你可以将函数作为回调和事件处理程序进行传递，而无需确切浏览器何时（或是否）会调用它们。你可能希望在用户点击鼠标时运行一个函数，但你无法知道他们何时会真正这样做。\n\
    \n异步编程使得函数的上下文绑定变得复杂得多。考虑这个用例：\n\n```javascript\nvar myWeb = {\n  value : \"myObject's\
    \ value\",\n  method : function() {\n    console.log(this.value);\n  }\n}\nsetTimeout(myObject.method,\
    \ 3000);\n```\n\n该方法大约在三秒后执行，但它不再绑定到 `myObject`。没有了该上下文，`this.value` 返回 `undefined`。\n\
    \n## 异步编程（续）\n\n最常见的解决方案是创建一个匿名函数，在 `myObject` 的上下文中调用该函数。\n\n```javascript\n\
    setTimeout(function() {\n  myObject.method();\n}, 3000);\n```\n\n你也可以使用第 6 章中的\
    \ `bindContext()` 函数。\n\n```javascript\nsetTimeout(bindContext(myObject.method,\
    \ myObject), 3000);\n```\n\n你可能还想向回调函数传递参数。在这种情况下匿名函数也是很有用的：\n\n```javascript\n\
    setTimeout(function() {\n  callbackFunction(\"an argument\");\n}, 3000);\n```\n\
    \n在处理事件以及涉及执行不确定延迟的代码时，请记住这些技术。\n\n## 客户端脚本语言\n\n到目前为止，我还没有真正介绍 JavaScript 的任何实际用途。在操作字符串和数组等简单数据时，你能做的范围是有限的。JavaScript\
    \ 是一种“脚本语言”，根据定义，它运行在某种环境中。通常，这个环境是 Web 浏览器中的一个 HTML 文档。从现在开始，本书将侧重于与浏览器、网页、服务器和用户输入进行交互。\n\
    \n## Script 标签\n\nHTML 提供了一种以 `<script>` 元素形式包含可执行代码的方法。你可以通过两种方式在网页中包含代码。\n\n\
    ### 内联脚本\n\n内联脚本直接将 JavaScript 代码包含在标记中，如下：\n\n```html\n<script type=\"text/javascript\"\
    >\n  var element = document.getElementById(\"domId\");\n</script>\n```\n\n内联脚本允许你将代码作为文本直接放在网页中。这对于快速测试解决方案或添加特定于此页的代码非常好。\n\
    \n### 远程脚本\n\n远程脚本指示浏览器下载单独的脚本文件并在页面中执行。`src` 属性像其他 URL 一样指向脚本文件。\n\n```html\n\
    <script src=\"my-script.js\" type=\"text/javascript\"></script>\n```\n\n在大多数情况下，出于以下原因，这是首选方案：\n\
    \n- 使用内联脚本将 JavaScript 直接存储在 HTML 中会使你的 HTML 文件更大且更难维护。\n- 你可以通过相同的 `<script>`\
    \ 标签在多个页面中包含脚本。\n- 浏览器会缓存 JavaScript 文件，这样在访问另一个页面时不需要重复下载。\n\n## <script> 标签的位置\n\
    \n你可以在 HTML 文档的任何地方使用 `<script>` 标签。我建议将内联和远程脚本放在最后，即 `</body>` 标签之前。这样做有两个优点：\n\
    \n- 当浏览器遇到 `<script>` 标签时，它会停止其他进程，直到下载并解析脚本。通过将脚本放在最后，允许浏览器下载页面元素、样式表和图像。\n-\
    \ 由于浏览器在执行任何脚本之前渲染了网页，你知道页面元素已经可用。\n\n然而，将 `<script>` 放在最后有一个明显的缺点。由于网页先下载并渲染，执行任何脚本之前可能会有延迟。本书的示例中不会出现这种情况，因此我将使用这个通用模板：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title></title>\n  <link rel=\"\
    stylesheet\" href=\"styles.css\" type=\"css\" />\n</head>\n<body>\n  <!-- 页面元素在这里\
    \ -->\n  <script src=\"my-script.js\" type=\"text/javascript\"></script>\n</body>\n\
    </html>\n```\n\n## 非阻塞和懒加载\n\n我要展示的是高级技术，但你将在使用某些 JavaScript 库的后续章节遇到它，因此在这里简要解释一下。\n\
    \n你可以使用 JavaScript 在网页中引入其他脚本文件。你只需创建一个 `<script>` 元素并将其附加文档。\n\n```javascript\n\
    var script = document.createElement(\"script\");\nscript.type = \"text/javascript\"\
    ;\nscript.src = \"my-script.js\";\ndocument.getElementsByTagName(\"head\")[0].appendChild(script);\n\
    ```\n\n当你动态将脚本添加到页面时，浏览器不会停止其他进程，而是继续渲染页面元素并下载资源。这被称为**非阻塞**脚本加载。\n\n你也可以在脚本的任意时间使用这种技术。你可能决定只在页面加载时包含少量代码，然后在需要时再下载其他脚本文件。这被称为**懒加载**。\n\
    \n许多流行的 JavaScript 库现在都包含了实用函数来鼓励这些实践。某些库专门为此目的设计，例如 LABJs (http://labjs.com/)。其他库将其作为在页面中包含脚本的主要方法，例如\
    \ YUI3 (http://developer.yahoo.com/yui/)。\n\n除非使用利用非阻塞脚本加载的库，否则本书示例将使用简单的 `<script>`\
    \ 元素将 JavaScript 包含在 HTML 中。\n\n"
