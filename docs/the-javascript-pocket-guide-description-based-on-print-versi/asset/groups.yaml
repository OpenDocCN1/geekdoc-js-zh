    # Deleting Cookies


    Deleting cookies is simple: Just set the cookie''s value to nothing with a max-age
    of zero.


    ```

    document.cookie = "anotherName;max-age=0";

    ```


    # The navigator Object


    The navigator object gives some insight into what browser is running your code.
    This is sometimes referred to as browser sniffing. This is useful for two reasons:


    +   You can use it to collect data about browsers visit your sites. This is called
    analytics, and there are many prebuilt solutions for this like Google Analytics.


    +   You can use it to target code for a particular browser. For instance, if you
    know that Internet Explorer doesn''t support some code, you can test for "Microsoft
    Internet Explorer" in window.navigator.appName.


    Unfortunately, this object isn''t as useful as it could be for a couple of reasons:


    +   There aren''t any standards for what type of values navigator properties should
    have. For instance, window.navigator.appVersion is not just a version number but
    can include a variety of other information.


    +   Early JavaScript programmers relied too heavily on this information, so their
    scripts worked only in certain browsers. When a new browser came out, it would
    use the navigator properties to pretend to be a different browser. For instance,
    many sites in the 1990s were built to work best in Netscape. Internet Explorer
    then copied parts of Netscape''s window.navigator.appName in order to trick those
    sites to run code as if it were Netscape.'
  - '[PAGE 154]


    # Feature Detection vs. Browser Sniffing


    In the next few chapters, I''ll discuss many properties and methods that some
    browsers (mainly Internet Explorer) don''t support. In your code, you could take
    one of two approaches to handling these differences:


    +   - You could use the navigator properties to determine whether the browser
    is Internet Explorer and execute different code.


    +   - You could check to see whether the property or method you want to use exists
    and execute different code if it doesn''t.


    The latter method is always the better way to go. If Internet Explorer 10 includes
    support for the property or method, then your test is no longer applicable. Feature
    detection—testing for the feature before using it—is the most reliable way to
    make sure your code continues to work efficiently with future browsers.'
