    argumentRequired(); // Whoops, no argument given\nError: arg cannot be null or\
    \ undefined.\n```\n\n# break and continue\n\nTwo keywords, break and continue,\
    \ manage control flow inside loops. The break keyword can stop a loop. This loop\
