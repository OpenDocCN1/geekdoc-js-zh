    ![](img/4a8fa16ebbe3c330347de80256b877b4_212_0.png)\n\n# Libraries\n\n在本书中，你看到了字符串、数组、元素和事件的辅助函数。你可能想在代码中使用这些或类似的函数。当你开始第二个项目时，你可能会决定复制大部分这类代码复制，这样你就不需要从头开始了。哒！你创建了一个库！\n\
    \n使用库最重要的原因是避免为每个项目都重复造轮子。JavaScript 的内置函数set相对较小，因此可复用的代码可以极大地节省时间。\n\nJavaScript\
    \ 程序员还花费大量时间处理浏览器之间的差异，特别是 Internet Explorer 与所有其他现代浏览器（如 Firefox 和 Chrome）之间的差异。有时由于不同的实现方式，例如标准的\
    \ `addEventListener()` 和非标准的 `attachEvent()`。其他时候，浏览器可能完全缺少某个功能，如 `querySelector()`，而库可以填补这一空白。解决方案的性能永远不如原生函数，但通常比完全没有要好。\n\
    \n库的一个不那么重要但有影响的方面与编码风格有关。JavaScript 是一门特别灵活的语言，没有两个程序员编写的代码完全相同。然而，JavaScript\
    \ 库倾向于强制一种特定的风格。这可以通过它们使用的语言特性、命名规范，或其设计和组织来实现。统一的风格使得阅读相似的代码以及与其他程序员合作变得更加容易。\n\
    \n最后，几乎每个 JavaScript 库都是开源的，并且可以在你的项目中免费使用。这鼓励了创新，许多开发者发布了供该库使用的组件和工具。使用库允许你利用全球成百上万其他\
    \ JavaScript 程序员的心血。\n\n# Choosing a Library\n\n有很多 JavaScript 库可供选择。总来说，你在一个库中做的任何事情在另一个库中也可以同样完美完成。那么，该如何选择呢？\n\
    \n首先，该库是否能实现你需要的功能？如果你需要复杂的功能，例如高级的数据网格或绘图能力，你可能需要考虑某些库而非其他。如果你的需求很简单，大多数流行的库都能胜任。\n\
    \n另一个考虑因素是你是否需要你的库与其他代码良好地工作。在第 6 章中，你学习了如何向内置原型添加方法，以及这可能如何与其他代码冲突。\n\n文件大小是一个重要的考虑因素，因为你需要让库随页面一起加载。幸运的是，Google\
    \ 和 Yahoo! 等公司提供了分发网络。除了库本身提供的功能外，你还应该考虑库是否使用了许多第三方技术。\n\n许多库都有自己的在线文档。这鼓励了创新，许多开发者发布了供该库使用的组件和工具。使用库允许你利用全球成百上万其他\
    \ JavaScript 程序员的心血。\n\n最后，最重要的是，选择库是一个个人风格问题。你可以选择一个符合你直觉的。\n\n最后，最重要的是，选择库是一个个人风格问题。选择一个符合你直觉的。的，选择一个符合你直觉的。\n\
    \n最后，最重要的是，选择库是一个个人风格问题。选择一个符合你直觉的。\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_214_0.png)\n\
    \n学习库就像学习一门全新的语言。本书显然无法涵盖任何一个库的细节。此外，你应该使用每个库网站的在线文档。\n\n# Using Libraries with\
    \ This Book\n\n后续许多章节使用了 JavaScript 库。使用库最简单的方法是使用 Yahoo! 自己的分发网络。如果你想离线跟踪教程，你需要从各自站点下载库。\n\
    \nYUI 3 使用了一些有趣的库技术，我稍后会讨论。Google 的 Ajax 库 (http://code.google.com/ajaxlibs/)\
    \ 是一个分发网络，提供了最新版本的 JavaScript。\n\n我在编写时包含了这些库的最新版本，但有时新版本的更改会破坏代码。如果你遇到问题，请使用我指定的版本。\n\
    \n# jQuery\n\nhttp://www.jquery.com\n\njQuery 是 Web 上流行的 JavaScript 库。它由 John\
