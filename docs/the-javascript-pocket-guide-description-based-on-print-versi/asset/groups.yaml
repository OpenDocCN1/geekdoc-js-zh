    \n- *Ease out*（淡出）是动画在结束时逐渐减速。\n- *Ease in*（淡入）是动画在开始时逐渐加速。\n- *Ease in/out*（淡入淡出）是两者的结合。\n\
    \n首先重写 timeBased() 函数以使用缓动方程。我通常缩短变量名以匹配方程：t 是通过时间（timePassed），c 是移动距离（distanceToTravel\
    \ 或 \"change\"），b 是起始（begin），e 是结束（end），d 是持续时间（duration）。\n\n```getfunction timeBasedEasing(box,\
    \ b, e, d, easing) {\n  var c = e - b,\n  startTime = new Date();\n\n  function\
    \ move() {\n    var t = new Date() - startTime;\n\n    if (t < d) {\n      box.style.left\
    \ = easing(t, b, c, d) + \"px\"\n      setTimeout(move, 0);\n    } else {\n  \
    \    box.style.left = e + \"px\"\n    }\n  }\n  move(); // 开始动画\n}\n```\n\n该函数基本上与\
    \ timeBased() 相同，只是它将大部分计算交给了 easing 参数。接下来，创建一个线性的缓动方程：\n\n```javascript\nfunction\
    \ linear(t, b, c, d) {\n  return c*t/d + b;\n}\n```\n\n> 本章中的缓动函数来自 Robert Penner\
