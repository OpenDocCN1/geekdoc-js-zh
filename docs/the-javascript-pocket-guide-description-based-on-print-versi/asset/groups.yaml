    If you also provide the length argument, splice() deletes only that number of
    values.


    ```

    var myArray = ["a", "b", "c", "d", "e"];

    myArray.splice(2, 2); // Delete 2 values starting at "c"

    ["c", "d"]

    myArray;

    ["a", "b", "e"]

    ```


    If you provide any more arguments, those values are inserted in the array in the
    place of the deleted values.


    ```

    var myArray = ["a", "b", "c", "d", "e"];

    // Insert these values after

    // deleting 2 values starting at "c"

    myArray.splice(2, 2, "x", "y", "z");

    ["c", "d"]

    myArray;

    ["a", "b", "x", "y", "z", "e"]

    ```


    You can specify the length argument as zero to insert elements at an arbitrary
    point in the array.


    ```

    var myArray = ["a", "b", "c"];

