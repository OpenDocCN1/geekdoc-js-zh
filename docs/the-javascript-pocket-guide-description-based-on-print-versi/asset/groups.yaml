    # Removing Items from Arrays


    The push() and shift() methods have analogs for removing values from the ends
    of an array.


    # pop()


    The pop() method is the opposite of push(). It returns one element removed from
    the end of the array. It does change the original array, including its length
    property.


    ```

    var myArray = ["a", "b", "c\];

    myArray.pop();

    "c"

    myArray;

    ["a", "b"]

    ```


    # shift()


    Unsurprisingly, the shift() method is the opposite of unshift().


    ```

    var myArray = ["a", "b", "c\];

    myArray.shift();

    "a"

    myArray;

    ["b", "c"]

    ```


    # Extracting Items from Arrays


    The slice() and splice() methods are very useful for manipulating arrays. It''s
    easy to forget which method is which, even though they work in very different
    ways.'
  - '[PAGE 79]


    # slice(x, y)


    The slice() method works the same for arrays as it does for strings. It returns
    a new array starting with the value at the index x up to not including the value
    at the index y. It doesn''t change the original array. The arguments can both
    be negative, which counts the position from the end of the array. The second argument
    is optional, returning an array from x until the end of the array.


    ```

    ["a", "b", "c", "d", "e"].slice(0, 2);

    ["a", "b"]\n["a", "b", "c", "d", "e"].slice(1, -1);

    ["b", "c", "d"]

    ["a", "b", "c", "d", "e"].slice(-2);

    ["d", "e"]

    ```


    # splice(start, length, newValue ...)


    The splice() method deletes a specified number of values from an array and optionally
    inserts new values in their place. It changes the original array and returns a
    new array containing any deleted values.


    If you provide only the start argument, splice() deletes all the values from start
    until the end of the array. The start argument can be negative, counting the starting
    index from the end of the array.


    ```

    var myArray = ["a", "b", "c", "d", "e\];

    myArray.splice(2); // Start deleting at "c"

    ["c", "d", "e"]

    myArray;

    ["a", "b"]

    ```'
