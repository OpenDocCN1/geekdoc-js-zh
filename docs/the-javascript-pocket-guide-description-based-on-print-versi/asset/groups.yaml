    A lot of people learn JavaScript by copying and pasting code they find on on the
    Web without really understanding it. In this book, you''ll start from the very
    beginning.


    A language is a system for organizing and transmitting meaning through symbols.
    A computer language uses symbols you can type with any average keyboard to organize
    and transmit instructions to hardware and software.


    The JavaScript language doesn''t have a large number of symbols. Instead, it''s
    very flexible in how you can combine those symbols. That flexibility allows you
    to produce expressive and powerful code, but it also creates the potential for
    ambiguity and confusion. Symbols in the language combine to create syntax, which
    acts as the structure or grammar of the language. Values, variables, and functions
    are the subjects and actions.'
  - "[PAGE 29]\n\nOnce you get the hang of the symbols and syntax, learning JavaScript\
    \ is a matter of understanding the various data types you can use. JavaScript\
    \ includes a few built-in data types, most of which I'll cover in Chapters 2 through\
    \ 7. If you're using JavaScript in a browser, you have access to many more data\
    \ types, which will be the focus of Chapters 9, 10, and 11.\n\n# Expressions and\
    \ Statements\n\n*Expressions* are phrases that produce a value. JavaScript code\
    \ is made up mostly of expressions in various forms.\n\n*Statements* are phrases\
    \ that don't produce a value but instead have some sort of side effect. Examples\
    \ of side effects include storing variables in memory and jumping to a different\
    \ part of the script. Statements often combine keywords such as var, if, or while\
    \ with one or more expressions so that the side effects have values to work with.\n\
    \nFirebug makes it easy to differentiate between expressions and statements. When\
    \ you enter an expression, it outputs the resulting value:\n\n```\n1 + 2;\n3\n\
    ```\n\nWhen you enter a statement, Firebug doesn't show you any output, even if\
    \ the statement includes some expressions. That's why I have to use console.log()\
    \ in some of my examples. If this statement doesn't produce a value. Instead,\
    \ it controls whether to evaluate the *block* (the code in curly braces).\n\n\
    ```\nif (true) {\n    console.log(\"expression\");\n}\n```"
