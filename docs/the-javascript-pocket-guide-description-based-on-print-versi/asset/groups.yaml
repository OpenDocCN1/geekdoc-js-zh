  - "[PAGE 202]\n\n# DOMContentLoaded\n\nThe DOMContentLoaded event is relatively\
    \ new and poorly supported across browsers, especially Internet Explorer and nearly\
    \ all browsers released before 2009. But it's important enough that nearly all\
    \ JavaScript libraries emulate it as best as possible.\n\nThe load event waits\
    \ until all the resources in the page finish loading before. Images, style sheets,\
    \ and scripts can delay the load event. The DOMContentLoaded event fires as soon\
    \ as all DOM elements in the page are available. This lets you manipulate elements\
    \ in the page as soon as possible.\n\n```\ndocument.addEventListener(\"DOMContentLoaded\"\
    , function() {\n  // All DOM elements are now available, but the browser\n  //\
    \ might still be loading images and other files\n}, false);\n```\n\nIf you don't\
    \ include your <script> tags at the bottom of the HTML markup, you'll need to\
    \ use the DOMContentLoaded event to make sure your DOM elements exist before using\
    \ them in JavaScript.\n\n# Mouse Events\n\nJavaScript lets you take advantage\
    \ of the versatility of the mouse in many ways. Mouse events provide useful information\
    \ about the event, including where it took place and whether the user was holding\
    \ down any keys during the event.\n\n+   - clientX, clientY The mouse position\
    \ compared to the top-left corner of the viewport (window).\n\n+   - pageX, pageY\
    \ The mouse position compared to the top-left corner of the page, which may be\
    \ scrolled out of view.\n\n+   - screenX, screenY The mouse position compared\
    \ to the top-left corner of the computer screen."
  - "[PAGE 203]\n\n# The JavaScript Pocket Guide\n\n+   - **offsetX, offsetY** The\
    \ mouse position compared to the top-left corner of the element on which the event\
    \ occurred.\n\n+   - **altKey, ctrlKey, metaKey, shiftKey** Evaluates to true\
    \ if, respectively, the Alt, Ctrl, meta, or Shift key is went down during the\
    \ event. The meta key is the Cmd key on Mac OS, so Internet Explorer doesn't support\
    \ it (being Windows-only).\n\n+   - **button** Indicates the button used, so it\
    \ works only on events that involve mouse buttons. The left button is 0, the middle\
    \ button is 1, and the right button is 2.\n\n+   - **detail** For mouse button\
    \ events, the number of times the user clicked the mouse quickly enough together.\
    \ For mouse wheel events, the distance the wheel has spun.\n\n+   - **relatedTarget**\
    \ For mouseover events, the elements that the mouse just left. For mouseout events,\
    \ the element that the mouse just entered.\n\n# click\n\nThe click event is the\
