    \ the element and runs a bunch of code with it. Then it rewrites the getElement\
    \ function to solely return the created element. This makes subsequent calls to\
    \ getElement much quicker.\n\nUnderstanding objects is crucial to writing well-organized,\
    \ expressive JavaScript. If you've used other languages such as Java or ActionScript,\
    \ JavaScript may seem like it's missing a lot of language features such as classes\
