    \ from functions and objects.\n\nYou can break up your code into logical, reusable\
    \ chunks using *functions*. Functions can take input, called *arguments*, and\
    \ execute differently based on that input. In the following example, *name* is\
    \ an argument passed to the sayHello() function:\n\n```\nfunction sayHello(name)\
    \ {\n  console.log(\"Hello, \" + name + \"!\");\n}\n```\n\n```\nsayHello(\"Lenny\"\
    )\n\"Hello Lenny!\"\nsayHello(\"Sally\")\n\"Hello Sally!\"\n```\n\nFunctions can\
    \ also *return* a value. Here's a function that calculates the hypotenuse of a\
    \ right triangle based on the lengths of the other two sides, using the square\
    \ root function (Math.sqrt()):\n\n```\nfunction hypotenuse(sideA, sideB) {\n \
    \ return Math.sqrt(sideA * sideA + sideB * sideB);\n}\n```\n\n```\nvar sideC =\
    \ hypotenuse(3, 4);\nconsole.log(sideC); 5\n```\n\nIn JavaScript, functions are\
    \ just another data type, so you can assign a function to a variable.\n\n```\n\
    var myFunc = function() {\n  return 42;\n}\ntypeof myFunc; \"function\"\nmyFunc();\
    \ 42\n```\n\nFunctions are also an incredibly useful tool for organizing your\
    \ code and acting upon values. You’ll use them throughout the first few chapters\
    \ before exploring them in more depth in Chapter 5.\n\n# Objects\n\nObjects are\
    \ so fundamental to JavaScript that it is considered an object-oriented language.\
    \ An object is a collection of values called properties. You usually access a\
