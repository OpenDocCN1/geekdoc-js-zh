    \n```javascript\nvar functionName = function(arg1, arg2, argN) {\n  // 语句\n};\n\
    \nfunction outerFunction() {\n  // 此函数返回一个匿名函数\n  return function() {\n    console.log(\"\
    inner function\");\n  }\n}\n```\n\n> **注意** 在函数声明的闭合大括号后面不需要加分号。相反，函数表达式应该始终以分号结束。\n\
    \n## 自执行函数\n\n有时你可能想要立即调用一个函数，其原因将在本章稍后的“闭包”节中解释。\n\n```javascript\n(function()\
