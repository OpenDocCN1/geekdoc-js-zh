    }\n```\n\n(continues on next page)"
  - "[PAGE 252]\n\n# Practical Function Context Binding (continued)\n\nThis won't\
    \ work, however, because toggleLink() also a Menu object method. Since the this\
    \ keyword refers to the clicked element, you don't have access to the toggleLink()\
    \ method for the current Menu object. Fortunately, MooTools provides a helper\
    \ method for all functions to bind the context of a function to an object:\n\n\
    ```\nthis.links.add(\"click\", onClick.bind(this));\nonClick : function(event)\
    \ {\n  // Open or close the submenu for this link\n  var clickedLink = ???;\n\
    \  this.toggleLink(clickedLink);\n}\n```\n\nNow you need another way to access\
    \ the clicked element, since you changed what the this keyword referred to. In\
    \ this case, the clicked element is also available as event.target.\n\n```\nonClick\
    \ : function(event) {\n  // Open or close the submenu for this link\n  var clickedLink\
    \ = event.target;\n  this.toggleLink(clickedLink);\n}\n```\n\nIf the link contained\
    \ children, you might have had to walk up the DOM tree to get to the link element\
    \ because of event bubbling.\n\nIf you're used to programming in a language with\
    \ built-in classes, this context binding miss seem like an awkward step. In ActionScript\
    \ 3, for instance, the this keyword always refers to the current object and always\
    \ has access to the object's properties and methods. It's easier to change function\
    \ context in JavaScript, so these extra steps are necessary if you want to emulate\
    \ classes and classical object-oriented patterns."
  - "[PAGE 253]\n\n# Showing and Hiding Submenus\n\nThe behavior of this menu isn't\
    \ too complicated. When the user clicks a menu item, the following happens:\n\n\
    +   * If the item's submenu is closed, open it after closing any other open submenus.\n\
    * If the item's submenu is open, close it.\n\nAlso, when the user clicks anywhere\
    \ other than the menu, it should close any open submenus. That's why you're binding\
    \ a click event to the `<body>` element.\n\n```\ntoggleLink : function(link) {\n\
    \  if (link.retrieve(\"open\")) {\n    this.closeLink(link);\n  } else {\n   \
    \ this.openLink(link);\n  }\n}\n```\n\nAn easy way to keep track of the status\
    \ of a link and its submenu is using MooTool's store() and retrieve() methods,\
    \ which allow you to store arbitrary data on an object. If the \"open\" data for\
    \ a link is true, call the closeLink() method. Otherwise, call the openLink()\
    \ method.\n\n```\ncloseLink : function(link) {\n  var submenu = link.getParent().getElements(\"\
    ul\");\n  if (submenu.length) {\n    link.store(\"open\", false);\n    link.getParent().removeClass(\"\
    open\");\n    this.hideMenu(submenu);\n  }\n}\n```"
  - "[PAGE 254]\n\n```\nopenLink : function(link) {\n  var submenu = link.getParent().getElements(\"\
    ul\");\n  if (submenu.length) {\n    link.store(\"open\", true);\n    link.getParent().addClass(\"\
    open\");\n    this.showMenu(submenu);\n    this.closeOtherLinks(link);\n  }\n\
    },\n```\n\nThese two methods are nearly identical. They perform the following\
    \ tasks:\n\n+   - Find the appropriate submenu for the clicked link. Make sure\
    \ the submenu exists (the array returned by getElements() has a length greater\
    \ than o).\n- Set the \"open\" data to true or false appropriately.\n- Add or\
    \ remove the \"open\" CSS class to the containing <li>.\n- Show or hide the submenu.\n\
    - For openLink() only, close any other open submenus.\n\nTo find the submenu for\
    \ a link, traverse up the DOM tree to its parent <li> element with getParent(),\
    \ and look for any <ul> elements inside it.\n\nTo show or hide a submenu, simply\
    \ set the display style of the <ul> to \"block\" or \"none\", just like the CSS-only\
    \ implementation shown earlier.\n\n```\nshowMenu : function(submenu) {\n  submenu.setStyle(\"\
    display\", \"block\");\n},\n\nhideMenu : function(submenu) {\n  submenu.setStyle(\"\
    display\", \"none\");\n},\n```"
  - "[PAGE 255]\n\n# The JavaScript Pocket Guide\n\nIt may seem overkill to create\
    \ entirely separate methods to run a single line of code, but it will become clear\
    \ why I structured the code this way when you extend open the Menu class later\
    \ in the chapter.\n\nClosing any other open submenu is pretty simple: Just call\
    \ the closeLink() method for all the other links.\n\n```\ncloseOtherLinks : function(currentLink)\
    \ {\n  var otherlinks = $(this.links).erase(currentLink);\n  otherLinks.each(this.closeLink,\
    \ this);\n},\n```\n\nThe $A() function is a MooTools helper that adds useful methods\
    \ to an array. The method you want here is erase(), which removes the given item\
    \ from the array.\n\nThe each() method runs a function for each item in an array,\
    \ but just like event handlers, you must make sure that this.closeLink() executes\
    \ in the context of the Menu object. Fortunately, you can pass the context object\
    \ as the second argument in each().\n\n# Clicking Outside the Menus\n\nThe final\
    \ method in the Menu class is the event handler for the click event on the <body>\
    \ element. Recall from Chapter 11 that click events bubble up the DOM tree all\
    \ the way to the document, so you need to check whether the click event originated\
    \ from an element inside the menu's container.\n\n```\nonOutsideClick : function(event)\
    \ {\n  if (! $(event.target).getParents().contains(this)) {\n    this.closeOtherLinks();\n\
    \  }\n}\n```"
  - '[PAGE 256]


    # Chapter 14: Drop-Down Menus


    MooTool''s getParents() method returns every ancestor in the DOM tree for a particular
    element, so all you need to do is whether the menu''s container exists in that
    array. If the click did not originate from inside the menu, you can close all
    the submenus by calling closeOtherLinks() without an argument.


    # Extending the Menu Class


    Your drop-down menu should now work as expected, but it''s not terribly exciting
    at this point. In this section you''ll learn how to take advantage of the special
    functionality in MooTool''s classes to add a fancy slide effect to the menu.


    The slide effect is an extra component in MooTool''s More library. Google''s JavaScript
    libraries API doesn''t provide this component, so you''ll need to download it
    from the MooTool''s Web site (http://mootools.net/more). Select the Fx.Slide box,
    and click Download at the bottom of the page. Include the downloaded JavaScript
    file after the core MooTools library in your HTML document.


    ```

    <script src="http://ajax.googleapis.com/ajax/libs/mootools/1.2.4/mootools-yui-compressed.js"
    type="text/javascript"></script>

    <script src="mootools-1.2.4.2-more.js" type="text/javascript"></script>

    <script src="menu.js" type="text/javascript"></script>

    ```


    Instead of changing your Menu class to add the new functionality, you can create
    a new class that "extends" the Menu class. This new class, FancyMenu, inherits
    all the properties and methods of the Menu class. It can also selectively override
    Menu properties to add behavior specific to FancyMenu objects.'
- md: "\nThe basic structure of the FancyMenu class is much simpler than Menu. Because\
    \ it inherits all the properties of the Menu class, you don't have to repeat methods\
    \ such as initMenuItems() and addMouseBehavior(). Make sure this code comes after\
    \ the Menu class in menu.js.\n\n```javascript\nvar FancyMenu = new Class({\n \
    \ Extends : Menu,\n  Implements : Options,\n  options : {\n    duration: \"short\"\
    \n  },\n  initialize : function(container, options) {},\n  addEffect : function(menu)\
    \ {},\n  showMenu : function(menu) {},\n  hideMenu : function(menu) {}\n});\n\
    ```\n\nThe special Extends property tells MooTool's Class constructor that this\
    \ new class will inherit properties from Menu.\n\nThe special Implements property\
    \ pulls in some extra functionality from the MooTools Options component, which\
    \ you'll use to make the FancyMenu behavior customizable. The default options\
    \ for each FancyMenu object are stored on the options property by convention.\n\
    \nChange the domready event handler to use your new class:\n\n```javascript\n\
    window.addEventListener(\"domready\", function() {\n  // var menu = new Menu($(\"\
    menu\"));\n  var menu = new FancyMenu($(\"menu\"));\n});\n```\n\n## Overriding\
    \ Inherited Methods\n\nThe FancyMenu initialize() method should perform the same\
    \ actions as the Menu initialize() method, with two additions:\n\n- It should\
    \ handle any customization passed in with the options argument.\n- It should set\
    \ up the slide effects for each submenu.\n\nMooTools allows you to add behavior\
    \ to an inherited method by overriding it and executing the original behavior\
    \ with the special parent() method.\n\n```javascript\ninitialize : function(container,\
    \ options) {\n  this.setOptions(options || {});\n  this.parent(container);\n \
    \ this.submenus.each(this.addEffect, this);\n}\n```\n\nThe first line uses the\
    \ setOptions() method. You don't have to define that method yourself, it's available\
    \ from the Options component included by the Implements class property.\n\nThe\
    \ second line calls the Menu initialize() method via the parent() method, which\
    \ ensures that initMenuItems() and addMouseBehavior() are still executed.\n\n\
    The last line runs the new addEffect() method for each submenu.\n\n## Using MooTools\
    \ Effects\n\nMooTools provides the slide effect as a class called Fx.Slide. To\
    \ use it, you create a new instance of the class, passing in the element that\
    \ receives the effect and any optional parameters.\n\n```javascript\n// This example\
    \ code doesn't go in menu.js\nvar slideEffect = new Fx.Slide(submenu, {\n  duration:\
    \ \"short\"\n});\n```\n\nYou can then control the effect by calling methods such\
    \ as show(), hide(), slideIn(), slideOut(), and cancel().\n\n```javascript\n//\
    \ This example code doesn't go in menu.js\nslideEffect.hide(); // Start hidden\n\
    slideEffect.slideIn(); // Slide the submenu into view\n```\n\nThe effect works\
    \ by wrapping the submenu <ul> in a <div> element with its overflow style set\
    \ to \"hidden\".\n\nBecause the slide effect adds a new element to the markup,\
    \ you need to add a little more CSS to menu.css to position it correctly.\n\n\
    ```css\n#menu li div {\n  position: absolute;\n  left: 0;\n}\n\n#menu li div ul\
    \ {\n  position: relative;\n}\n```\n\nThe addEffect() method creates Fx.Slide\
    \ objects for each submenu and calls hide() to set their initial position. It\
    \ uses the duration property from the options object to determine the speed of\
    \ the slide effect. Finally, it stores the Fx objects for later use when the user\
    \ clicks a menu item.\n\n```javascript\naddEffect : function(submenu) {\n  submenu.setStyle(\"\
    display\", \"block\");\n  var slideEffect = new Fx.Slide(submenu, {\n    duration:\
    \ this.options.duration\n  });\n  slideEffect.hide();\n  submenu.store(\"slide\"\
    , slideEffect);\n}\n```\n\nThe final step is to override the showMenu() and hideMenu\
    \ methods to use the slide effect objects instead of just setting the display\
    \ style.\n\n```javascript\nshowMenu : function(submenu) {\n  submenu[0].retrieve(\"\
    slide\").cancel().slideIn();\n}\n\nhideMenu : function(submenu) {\n  submenu[0].retrieve(\"\
    slide\").cancel().slideOut();\n}\n```\n\nThese methods retrieve the slide object\
    \ from the stored data, cancel any currently active animations, and call slideIn()\
    \ or slideOut() appropriately.\n\nBecause you implemented the MooTools Options\
    \ component, you can customize the speed of the slide effect when creating the\
    \ FancyMenu object.\n\n```javascript\nvar menu = new FancyMenu(\"menu\", {\n \
    \ duration : 1000 // One second in milliseconds\n});\n```\n\nNow you have two\
    \ different classes that define drop-down menu behavior, but you didn't have to\
    \ write any code twice. If you don't mind the extra work managing method context\
    \ and the this keyword for event listeners, MooTools classes and similar object-oriented\
    \ patterns can be a great way to organize your code.\n\n## Keyboard Support\n\n\
    The Menu and FancyMenu classes support keyboard navigation successfully because\
    \ the click event responds to the Enter/Return key as well as the mouse. You can\
    \ test this by navigating the links in the page with the Tab key.\n\nThe FancyMenu\
    \ has a slight complication, though: Because of how the slide effect hides the\
    \ submenus, you can still tab to their links even when they are hidden. Keyboard\
    \ users prefer being able to tab to visible elements. (The Menu class hides submenus\
    \ with the display property.)\n\nYou can set the \"tabability\" of submenus with\
    \ the tabindex property:\n\n```javascript\n$(submenu).getElementsBy(\"a\").set(\"\
    tabindex\", -1);\n```\n\nAdd this line to addEffect(), hideMenu(), and showMenu()\
    \ to make the submenus accessible. Now when you tab to a menu item, you have to\
    \ hit Enter/Return.\n\n## MooTools Glossary\n\nHere is a short summary of the\
    \ MooTools functions used in this chapter. You can find much more information\
    \ in the online documentation at http://moools.net/docs/core.\n\n### Element Utilities\n\
    \n$(id) MooTools' version of getElementById(). This returns a MooTools element.\n\
    \n$(selector) Retrieves elements that match the given selector.\n\n$(collection)\
    \ Returns an array of MooTools elements that each provide methods.\n\n### Element\
    \ Methods\n\nelement.add(eventType, handler) MooTools' version of addEventListener().\n\
    \nelement.getChildren() Returns the element's child elements.\n\nelement.getParent()\
    \ Returns the element's parent.\n\nelement.getParents() Returns an array of all\
    \ the element's ancestors.\n\nelement.store(name, value) Stores an arbitrary value\
    \ on an element.\n\nelement.retrieve(name) Retrieves arbitrary values saved on\
    \ the element with store().\n\nelement.setStyle(name, value) Sets the style property\
    \ of the element(s).\n\nelement.set(name, value) Sets an attribute on the element(s).\n\
    \nelement.addClass(className) Adds a class name to the element(s).\n\n### Array\
    \ Utilities\n\n$A(collection) Returns a true array from the given collection.\n\
    \narray.each(func) Calls the given function for each element in the array.\n\n\
    array.erase(value) Removes the given value from the array.\n\narray.contains(value)\
    \ Returns true if the array contains the given value.\n\n### Function Utilities\n\
    \nfunc.bind(context) Returns a new function that calls the function in the given\
    \ context. This is similar to bindContext() from Chapter 5.\n"
  mdcn: "\n\nFancyMenu 类的基本结构比 Menu 简单得多。因为它继承了 Menu 类的所有属性，所以你不需要重复编写 `initMenuItems()`\
    \ 和 `addMouseBehavior()` 等方法。请确保这段代码位于 `menu.js` 中 Menu 类的之后。\n\n```javascript\n\
    var FancyMenu = new Class({\n  Extends : Menu,\n  Implements : Options,\n  options\
    \ : {\n    duration: \"short\"\n  },\n  initialize : function(container, options)\
    \ {},\n  addEffect : function(menu) {},\n  showMenu : function(menu) {},\n  hideMenu\
    \ : function(menu) {}\n});\n```\n\n特殊的 `Extends` 属性告诉 MooTool 的 Class 构造函数，这个新类将继承\
    \ Menu 的属性。\n\n特殊的 `Implements` 属性从 MooTools 的 Options 组件引入了一些额外功能，你将用它来使 FancyMenu\
    \ 的行为可自定义。按照约定，每个 FancyMenu 对象的默认选项存储在 `options` 属性上。\n\n修改 `domready` 事件处理器以使用你新定义的类：\n\
    \n```javascript\nwindow.addEventListener(\"domready\", function() {\n  // var\
    \ menu = new Menu($(\"menu\"));\n  var menu = new FancyMenu($(\"menu\"));\n});\n\
    ```\n\n## 覆盖继承的方法\n\nFancyMenu 的 `initialize()` 方法应该执行与 Menu 的 `initialize()`\
    \ 方法相同的操作，但额外包含两点：\n\n- 它应该处理通过 `options` 参数传递的任何定制化内容。\n- 它应该为每个子菜单设置滑动效果（slide\
    \ effects）。\n\nMooTools 允许你通过重写继承的方法并使用特殊的 `parent()` 方法执行原始行为，从而添加新的行为。\n\n```javascript\n\
    initialize : function(container, options) {\n  this.setOptions(options || {});\n\
    \  this.parent(container);\n  this.submenus.each(this.addEffect, this);\n}\n```\n\
    \n第一行使用了 `setOptions()` 方法。你不需要自己定义该方法，它是由 `Implements` 类属性包含的 Options 组件提供的。\n\
    \n第二行通过 `parent()` 方法调用了 Menu 的 `initialize()` 方法，这确保了 `initMenuItems()` 和 `addMouseBehavior()`\
    \ 仍然被执行。\n\n最后一行为每个子菜单运行新的 `addEffect()` 方法。\n\n## 使用 MooTools 效果\n\nMooTools\
    \ 提供了一个名为 `Fx.Slide` 的类作为滑动效果。要使用它，你需要创建一个该类的实例，传入接收效果的元素以及任何可选参数。\n\n```javascript\n\
    // 此示例代码不在 menu.js 中\nvar slideEffect = new Fx.Slide(submenu, {\n  duration: \"\
    short\"\n});\n```\n\n然后你可以通过调用 `show()`、`hide()`、`slideIn()`、`slideOut()` 和 `cancel()`\
    \ 等方法来控制效果。\n\n```javascript\n// 此示例代码不在 menu.js 中\nslideEffect.hide(); // 隐藏隐藏\n\
    slideEffect.slideIn(); // 将子菜单滑入视图\n```\n\n该效果的工作原理是将子菜单的 `<ul>` 包装在一个 `<div>`\
    \ 元素中，并将其 `overflow` 样式设置为 `\"hidden\"`。\n\n由于滑动效果在 HTML 标记中添加了一个新元素，你需要在 `menu.css`\
    \ 中添加额外的 CSS 来对其进行正确定位。\n\n```css\n#menu li div {\n  position: absolute;\n  left:\
    \ 0;\n}\n\n#menu li div ul {\n  position: relative;\n}\n```\n\n`addEffect()` 方法为每个子菜单创建\
    \ `Fx.Slide` 对象并调用 `hide()` 设置它们的初始位置。它使用 `options` 对象中的 `duration` 属性来决定滑动效果的速度。最后，它存储\
    \ `Fx` 对象以供用户点击菜单项时稍后使用。\n\n```javascript\naddEffect : function(submenu) {\n \
    \ submenu.setStyle(\"display\", \"block\");\n  var slideEffect = new Fx.Slide(submenu,\
    \ {\n    duration: this.options.duration\n  });\n  slideEffect.hide();\n  submenu.store(\"\
    slide\", slideEffect);\n}\n```\n\n最后一步是覆盖 `showMenu()` 和 `hideMenu()` 方法，使用滑动效果对象而不是仅仅设置\
    \ `display` 样式。\n\n```javascript\nshowMenu : function(submenu) {\n  submenu[0].retrieve(\"\
    slide\").cancel().slideIn();\n}\n\nhideMenu : function(submenu) {\n  submenu[0].retrieve(\"\
    slide\").cancel().slideOut();\n}\n```\n\n这些方法从存储的数据中检索滑动对象，取消任何正在运行的动画，并相应地调用\
    \ `slideIn()` 或 `slideOut()`。\n\n由于你实现了 MooTools Options 组件，你可以在创建 FancyMenu 对象时自定义滑动效果的速度。\n\
    \n```javascript\nvar menu = new FancyMenu(\"menu\", {\n  duration : 1000 // 毫秒为一秒\n\
    });\n```\n\n现在你有了两个定义下拉菜单行为的类类，但你不需要编写任何重复代码。如果你不介意管理方法上下文和事件监听器中 `this` 关键字的额外工作，MooTools\
    \ 类和类似的面向对象模式是组织代码的极佳方式。\n\n## 键盘支持\n\nMenu 和 FancyMenu 类能够成功支持键盘导航，因为点击事件不仅响应鼠标，还响应\
    \ Enter/Return 回车键。你可以通过使用 `Tab` 键导航页面中的链接来测试这一点。\n\n不过，FancyMenu 有一点复杂之处：由于滑动效果隐藏子菜单的方式，即使在它们被隐藏时，你仍然可以\
    \ Tab 到它们的链接上。键盘用户倾向于 Tab 到可见元素。（Menu 类使用 `display` 属性来隐藏子菜单）。\n\n你可以通过 `tabindex`\
    \ 属性设置子菜单的“可标签性”（tabability）：\n\n\n\n```javascript\n$(submenu).getElementsBy(\"\
    a\").set(\"tabindex\", -1);\n```\n\n将此行添加到 `addEffect()`、`hideMenu()` 和 `showMenu()`\
    \ 中，以使子菜单可访问。现在当你 Tab 到菜单项时，必须按下 Enter/Return。\n\n## MooTools 术语表\n\n这里是本章使用的\
    \ MooTools 函数的简要。你可以在在线文档 http://moools.net/docs/core 中找到更多信息。\n\n### 元素工具函数\n\
    \n$(id) MooTools 版本的 `getElementById()`。它返回一个 MooTools 元素。\n\n$(selector) 获取匹配给定选择器的元素。\n\
    \n$(collection) 返回一个包含每个方法的 MooTools 元素数组。\n\n### 元素方法\n\nelement.add(eventType,\
    \ handler) MooTools 版本的 `addEventListener()`。\n\nelement.getChildren() 返回元素的子元素。\n\
    \nelement.getParent() 返回元素的父级元素。\n\nelement.getParents() 返回元素所有祖先元素的数组。\n\nelement.store(name,\
    \ value) 在元素上存储任意值。\n\nelement.retrieve(name) 检索通过 `store()` 存储的任意值。\n\nelement.setStyle(name,\
    \ value) 设置元素的样式属性。\n\nelement.set(name, value) 设置元素的属性。\n\nelement.addClass(className)\
    \ 为元素添加类名。\n\n### 数组工具函数\n\n$A(collection) 从给定集合返回一个真正的数组。\n\narray.each(func)\
    \ 为数组中的每个元素调用给定函数。\n\narray.erase(value) 从数组中删除给定值。\n\narray.contains(value) 如果数组包含给定值，则返回\
    \ true。\n\n### 函数工具函数\n\nfunc.bind(context) 返回一个在给定上下文中调用该函数的新函数。这类似于第 5 章中的 `bindContext()`。\n\
    \n"
