    # Creating Nodes


    The DOM provides a few methods to create new nodes. In addition, Microsoft created
    a nonstandard way of creating nodes that had enough benefits to be adopted by
    modern browsers.


    # Using DOM Methods


    The DOM methods are great for when you want to create one node at a time.


    # createElement(tagName)


    Creating element nodes is as simple as passing the desired tag name to document.createElement().
    Unlike many DOM methods, createElement() is available only on the document object.


