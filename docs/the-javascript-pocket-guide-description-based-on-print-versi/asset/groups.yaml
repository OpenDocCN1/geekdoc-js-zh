    # jQuery Glossary


    Here is a short summary of the jQuery functions and concepts used in this chapter.
    You can find much more information in the online documentation at http://api.jquery.com/


    # The jQuery Function: $()


    This remarkable little element has multiple uses.


    +   * It finds elements if you pass it a CSS selector.


    ```

    var foundElements = $("#domId > .selector + div");

    ```


    +   * It adds methods to DOM elements by wrapping them in jQuery objects. This
    is especially useful inside iterators and event handlers.


    ```

    var wrappedElement = $(this);

    wrappedElement.fadeIn();

    ```


    +   * It creates DOM elements if you pass it an HTML string.


    ```

    var newElement = $(''<a href="index.html">Click here</a></a>'');

    ```


    # jQuery Object Methods


    jQuery objects provide dozens of methods for finding, creating, and manipulating
    DOM elements. Like the jQuery function ($), many of these methods have multiple
    uses, so these descriptions are incomplete. These methods act upon single elements
    and collections of elements in the same manner.


    find(selector) Finds child elements that match the given selector.


    attr(name[, value]) Reads an attribute from the first element in the set and sets
    attributes on all the elements.'
