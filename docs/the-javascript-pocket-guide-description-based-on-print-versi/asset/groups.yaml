    \ type=\"text/javascript\">\n</script>\n<script src=\"slideshow.js\" type=\"text/javascript\"\
    >\n    </script>\n</body>\n</html>\n```\n\n尽管文档很短，但你应该注意到几个重要的细节：\n\n- 页面链接了一个名为\
