    \ rules like this:\n\n```css\nhtml.no-js .accessibilityMessage {\n    display:\
    \ block\n}\n\nhtml.js #alternateNav {\n    display: none;\n}\n```\n\n> Credit\
    \ for this technique goes to Paul Irish (http://paulirish.com/).\n\n# Browsers\
    \ and Windows\n\nYou learned in previous chapters that window is the global object\
    \ in client-side JavaScript. Many of its properties and methods are part of the\
    \ core JavaScript language, but it also has many other that are specific to programming\
    \ in the browser. This chapter gives a quick overview and reference of the properties\
    \ and methods that directly relate to browsers and browser windows.\n\n# Properties\n\
    \nBrowser windows have a couple of properties that mostly deal with the size and\
    \ position of the window on the screen. These properties are read-only, and you'll\
    \ need to use the window methods described in the next sections to change their\
    \ values.\n\n- **innerHeight, innerWidth** Represent the pixel values of the size\
    \ of the browser viewport. The viewport is the scrollable area inside the window.\
    \ The following are the equivalent properties for most versions of Internet Explorer:\n\
    \n`document.documentElement.clientHeight;`\n`document.documentElement.clientWidth;`\n\
    \n- **outerHeight, outerWidth** Represent the pixel values of the size of the\
    \ browser window. Internet Explorer does not have equivalent properties.\n\n-\
    \ **pageXOffset, pageYOffset** Represent the pixel values for how far the user\
    \ has scrolled the page. The following are the equivalent properties for most\
    \ versions of Internet Explorer:\n\n`document.documentElement.scrollLeft;`\n`document.documentElement.scrollTop;`\n\
    \n- **screenLeft, screenTop, screenX, screenY** Represent the position of the\
    \ browser window on the user's screen. There is little agreement between browsers\
    \ about which property to use, so you must check both.\n\n`var screenX = window.screenX\
    \ || window.screenLeft;`\n`var screenY = window.screenY || window.screenTop;`\n"
