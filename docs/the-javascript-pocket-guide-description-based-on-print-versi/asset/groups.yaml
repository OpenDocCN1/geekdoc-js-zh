    \ references to jQuery from the Google Libraries API and a new file called slideshow.js\
    \ that you'll also create.\n\n+   - The opening <html> tag and the first <script>\
    \ element use the no-js/js technique I described in Chapter 8.\n\n+   - The slideshow\
    \ is contained in a <div> with the ID of \"slideshow,\" which makes it easy to\
    \ hook JavaScript behavior into the page."
  - "[PAGE 229]\n\n# The JavaScript Pocket Guide\n\n+   Each image will exist inside\
    \ the slides <div>, but I've included only the first image in the markup.\n\n\
    +   The slideshow includes an unordered list of links that point to the remaining\
    \ images. I've also stored their sizes on the custom data-size attributes.\n\n\
    This is a somewhat rudimentary example of progressive enhancement. The unordered\
    \ list of links serves dual purposes: Users without JavaScript can still access\
    \ the remaining images by clicking the links and loading the images individually,\
    \ and it's easy to use the data stored in the markup to build the slideshow dynamically.\
    \ I consider it a small victory whenever I can reuse accessible markup in the\
    \ page to create a more engaging experience for users who can support it.\n\n\
    # Slideshow CSS\n\nCreate a file called slideshow.css, and include the following\
    \ CSS rules. It's pretty bare now, but you'll add more rules to support the JavaScript\
    \ behavior in the next section.\n\n```\n#slideshow .slides {\n  position: relative;\n\
    \  margin: 0 auto;\n  width: 450px;\n}\n\nhtml.js #slideshow .slides img {\n \
    \ position: absolute;\n}\n```\n\nI prefixed the second selector with html.js because\
    \ I want the images to be absolutely positioned only if JavaScript is available\
    \ to create the slideshow."
