    \n大多数现代浏览器——包括 Apple 的 Safari、Google 的 Chrome、Opera Software 的 Opera 以及微软的 Internet\
    \ Explorer 8——如果你愿意使用 Firefox以外的浏览器，它们都内置了 JavaScript 控制台。不过，我觉得 Firebug 的输出是最用的，因此书中打印的示例输出可能与你使用其他浏览器时看到的内容不匹配。\n\
    \n现在你已经为 Firefox 设置好了 Firebug 扩展（或正在使用其他浏览器），你可以编写一些 JavaScript 代码了。\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_28_0.png)\n\
    \n许多人通过复制和粘贴在网络上找到的代码来学习 JavaScript，而并没有真正理解它。在本书中，你将从零开始。\n\n语言是一种通过符号组织和传递意义的系统。计算机语言使用你可以用任何普通键盘输入的符号来向硬件和软件组织并传递指令。\n\
    \nJavaScript 语言并没有大量的大量的符号。相反，它在组合这些符号的方式上非常灵活。这种灵活性允许你编写出具有表现力且强大的代码，但也带来了产生歧义和困惑的可能。语言中的符号组合成语法，语法充当语言的结构或逻辑规则。值、变量和函数是主体和动作。\n\
    \n一旦你掌握了符号和语法，学习 JavaScript 只需要理解你可以使用的各种数据类型。JavaScript 包含了一些内置数据类型，其中大多数我将在第\
    \ 2 到第 7 章中介绍。如果你在浏览器中使用 JavaScript，你还可以访问更多数据类型，这些将是第 9、10 和第 11 章的重点。\n\n##\
    \ 表达式与语句\n\n*表达式*是能够产生一个值的短语。JavaScript 代码主要由各种形式的表达式组成。\n\n*语句*是不产生值而是具有某种副作用的短语。副作用的示例包括在内存中存储变量以及跳转到脚本的不同部分。语句通常将\
    \ `var`、`if` 或 `while` 等关键字与一个或多个表达式结合，以便副作用有值可以操作。\n\nFirebug 让区分表达式和语句变得非常简单。当你输入一个表达式时，它会输出结果值：\n\
    \n```\n1 + 2;\n3\n```\n\n当你输入一个语句时，Firebug 不会显示任何输出，即使该语句中包含了一些表达式。这就是为什么我在某些示例中必须使用\
    \ `console.log()`。如果这个语句不产生值，相反，它控制是否评估*代码块*（大括号中的代码）。\n\n```\nif (true) {\n \
    \   console.log(\"expression\");\n}\n```\n\n## 变量与数据\n\n> 注意：将此代码示例输入 Firefox\
    \ 中的多行文本框中，因为在单行文本框中按 Enter/Return 键会执行不完整的代码并导致错误。\n\n变量存储你可以稍后在脚本中引用的值。变量名可以是任何有效标识符。JavaScript\
    \ 标识符是一个仅包含字母、数字、`$` 和 `_` 的单词，且不以数字开头。\n\n变量是语句和表达式如何结合的绝佳演示。你使用变量声明语句来创建一个变量。\n\
    \n```\nvar myVariable;\n```\n\n如果你已经有了一个变量，可以使用变量赋值表达式给它赋值。\n\n```\nmyVariable\
