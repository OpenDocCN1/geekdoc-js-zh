  - "[PAGE 231]\n\nThe first thing you need to do is find the slideshow <div> by passing\
    \ a CSS selector to the jQuery function($). Store it on a variable so that you\
    \ can find other elements inside it later in the script. The first element to\
    \ find is the slides <div>. You'll also need to keep track of the currently visible\
    \ image with the currentIndexIndex variable.\n\n# Best Practices for Using CSS\
    \ Selectors in JavaScript\n\nThere's only one <div class=\"slides\"> element in\
    \ the page, so why did I use slideshow.find(\".slides\") instead of just $(\\\
    (\".slides\")\\?\n\nInternet Explorer as well as older browsers do not support\
    \ getElementsByClassName() and queryquerySelectorAll(). JavaScript libraries provide\
    \ support for these utilities in older browsers by looping over every element\
    \ to find the ones that match your class name or CSS selector. This can take a\
    \ noticeable amount of time if the library has to loop over many elements.\n\n\
    By using slideshow.find(), you can limit the search to just the elements inside\
    \ the slideshow <div> to improve the performance of your code.\n\n# Creating the\
    \ Slideshow Images\n\nThe next step is to use the list of links to create images\
    \ and add them to the slideshow.\n\n```\n// Create images from the link list\n\
    slideshow.find(\"ul a\").each(function() {\n  var link = \\$(this);\n  var size\
    \ = link.attr(\"data-size\").split(\"x\");\n```"
  - "[PAGE 232]\n\n# Chapter 13: Image Slideshow\n\n```\n$(\"<img />\").attr({\n \
    \ src : link.attr(\"href\"),\n  width : size[0],\n  height : size[1],\n  alt :\
    \ link.text()\n}).hide().appendTo(slides);\n);\n```\n\nThis code snippet might\
    \ look like a little daunting because jQuery allows you to do so much in very\
    \ little code.\n\nThe first thing it does is find all the links in the unordered\
    \ list using find() and loop over them using the each() function. jQuery encourages\
    \ a functional coding style, meaning that you use looping functions such as each()\
    \ more often than language features such as for or while.\n\nInside the loop function,\
    \ you can access each link with this keyword and turn it into a jQuery object\
    \ by passing it to($). Save it on the link variable because you'll access it three\
    \ times in the loop function.\n\nEach link has a string like \"350x263\" stored\
    \ on the data-size attribute. It's easy to separate the width from the height\
    \ by splitting the \"x.\",\n\nWhen you pass an HTML string to the jQuery function,\
    \ such as $(\"<img />\"), it creates new HTML elements. The attr() method lets\
    \ you pass attributes to the new element, which is how you can set the src, width,\
    \ height, and alt attributes for each new image.\n\njQuery emphasizes chainability,\
    \ allowing you to immediately call hide() and appendTo() on the newly created\
    \ <img> without having to save it to a variable first. The hide() method sets\
    \ its display style property to \"none,\" and the appendTo() method inserts it\
    \ into the slides <div>."
- md: "\n# 206 The JavaScript Pocket Guide\n\nIt's very easy to write ten lines of\
    \ code in jQuery that require six paragraphs to explain. I happen to enjoy jQuery's\
    \ terse style, but it's definitely a matter of personal preference.\n\nNow that\
    \ you've created all the images, create an array that holds all of them (including\
    \ the one that existed in the markup).\n\n```javascript\n// Collect all images\
    \ in one node set and hide the list\nvar images = slides.find(\"img\");\nslides.find(\"\
    ul\").hide();\n```\n\n# Centering the Images\n\nTo center each of these arbitrarily\
    \ sized images, you need to find the tallest and widest dimensions. This is something\
    \ I do often enough that I've written some jQuery plug-ins to make this easy.\
    \ You have to include plugin-ins before they are used in your scripts. Skip to\
    \ the top of your JavaScript file, and add this code:\n\n```javascript\n// Include\
    \ utility jQuery plug-ins\n$.fn.tallest = function(outer, margins) {\n  var fn\
    \ = outer ? \"height\" : \"outerHeight\";\n  return Math.max.apply(Math, $.map(this,\
    \ function(el) {\n    return $(el)[fn](margins);\n  }));\n};\n\n$.fn.widest =\
    \ function(outer, margins) {\n  var fn = outer ? \"width\" : \"outerWidth\";\n\
    \  return Math.max.apply(Math, $.map(this, function(el) {\n    return $(el)[fn](margins);\n\
    \  }));\n};\n```\n\nBack toward the bottom of your JavaScript file, you can now\
    \ use the tallest() and widest() methods to set the size of the slides `<div>`\
    \ to hold the largest images.\n\n```javascript\n// Resize slides <div> to hold\
    \ the largest images\nvar slidesWidth = images.widest();\nvar slidesHeight = images.tallest();\n\
    slides.css({\n  width : slidesWidth,\n  height : slidesHeight\n});\n```\n\nThe\
    \ css() method is a shorthand way of setting style properties on elements. It\
    \ takes care of adding \"px\" to numbers for you and other small conveniences.\n\
    \n```javascript\n// Center each image\nimages.each(function() {\n  var image =\
    \ $(this);\n  image.css({\n    left : slidesWidth / 2 - image.width() / 2,\n \
    \   top : slidesHeight / 2 - image.height() / 2\n  });\n});\n```\n\nCentering\
    \ elements with JavaScript is a pretty common task. I find myself typing variations\
    \ of this formula quite often. The each() method makes it easy to set the left\
    \ and top style properties for every image.\n\n```javascript\n// Save a reference\
    \ to the first image\nvar activeImage = images.eq(currentImageIndex);\n```\n\n\
    Before you start the slideshow, you'll need to save a reference to the first image.\
    \ The eq() method returns a single element wrapped in a jQuery object. (If you\
    \ wanted just the plain DOM element, you can access it as an element in an array:\
    \ images[0]).\n\n# The Slideshow Code\n\nEverything up to this point has been\
    \ setup code. The meat of the script is in the showImage() function, which takes\
    \ an index that indicates which image to show.\n\n```javascript\n// The function\
    \ to show the next or previous image\nfunction showImage(newIndex) {\n  currentImageIndex\
    \ = newIndex >= images.length ? 0 :\n  - newIndex;\n  currentImageIndex = currentImageIndex\
    \ < 0 ? images.length\n  - 1 : currentImageIndex;\n\n  activeImage.fadeOut();\n\
    \  activeImage = images.eq(currentImageIndex).fadeIn();\n}\n```\n\nThe first two\
    \ lines are another pattern I end up writing a lot. There are only four images\
    \ (indices 0 through 3), so when you pass 4 to showImage(), the number should\
    \ wrap around to 0. Likewise, if you pass -1, it should wrap the other direction\
    \ to 3. At this point, I can easily recognize this pattern when I see it, but\
    \ you may prefer a more obvious version.\n\n```javascript\n// This example code\
    \ doesn't go in slideshow.js\ncurrentImageIndex = newIndex;\nif (currentImageIndex\
    \ >= images.length) {\n  currentImageIndex = 0;\n} else if (currentImageIndex\
    \ < 0) {\n  currentImageIndex = images.length - 1;\n}\n```\n\nTo actually cross-fade\
    \ the images, jQuery provides two very useful animation-functions, fadeIn() and\
    \ fadeOut(). To hide the current image, simply fadeOut() on the image stored on\
    \ the activeImage variable.\n\nTo show the next image, retrieve it from the images\
    \ collection with the eq() method and call fadeIn(). Also be sure to save this\
    \ image on the activeImage variable for the next time you call the showImage()\
    \ function.\n\nThe last thing you need to do to get the slideshow running is to\
    \ call showImage() repeatedly using setInterval().\n\n```javascript\n// Start\
    \ timer to cycle through images\nvar interval = setInterval(function() {\n  showImage(currentImageIndex\
    \ + 1);\n}, 5000);\n```\n\nEach time setInterval() calls this anonymous function,\
    \ it calls showImage() to display the next image by adding one to currentImageIndex.\
    \ You'll also need to save a reference to the interval to be able to cancel the\
    \ automatic image rotation.\n\n# Slideshow Controls\n\nI try not to mix HTML into\
    \ my JavaScript files, but I make an exception for HTML elements that would have\
    \ no use without JavaScript. You could have put these links in the HTML document\
    \ and retrieved them with CSS selectors. However, I think creating these elements\
    \ with JavaScript is the appropriate solution in this case.\n\n```javascript\n\
    // Create next controls\n$('a href=\"#\" class=\"next\">Next</a>').appendTo(slides).on(\"\
    click\", 1);\n\n// Create prev controls\n$('a href=\"#\" class=\"prev\">Prev</a>').appendTo(slides).on(\"\
    click\", -1);\n```\n\nThe Unicode entities (such as \"→\" and \"←\") are used\
    \ to indicate direction. Even though you created the links with JavaScript, it's\
    \ usually best to style them in CSS. Add these rules to position the next and\
    \ previous links of the slideshow.\n\n```css\n#slideshow .next,\n#slideshow .prev\
    \ {\n  position: absolute;\n  margin-top: -0.5em;\n  width: 40px;\n  font-size:\
    \ 32px;\n  text-decoration: none;\n}\n\n#slideshow .next {\n  right: -50px;\n\
    \  padding-left: 10px;\n}\n\n#slideshow .prev {\n  left: -50px;\n  padding-right:\
    \ 10px;\n  text-align: right;\n}\n```\n\n# jQuery Glossary\n\nHere is a short\
    \ summary of the jQuery functions and concepts used in this chapter. You can find\
    \ much more information in the online documentation at http://api.jquery.com/\n\
    \n# The jQuery Function: $()\n\nThis remarkable little element has multiple uses.\n\
    \n- It finds elements if you pass it a CSS selector.\n\n```javascript\nvar foundElements\
    \ = $(\"#domId > .selector + div\");\n```\n\n- It adds methods to DOM elements\
    \ by wrapping them in jQuery objects. This is especially useful inside iterators\
    \ and event handlers.\n\n```javascript\nvar wrappedElement = $(this);\nwrappedElement.fadeIn();\n\
    ```\n\n- It creates DOM elements if you pass it an HTML string.\n\n```javascript\n\
    var newElement = $('<a href=\"index.html\">Click here</a>');\n```\n\n# jQuery\
    \ Object Methods\n\njQuery objects provide dozens of methods for finding, creating,\
    \ and manipulating DOM elements. Like the jQuery function ($), many of these methods\
    \ have multiple uses, so these descriptions are incomplete. These methods act\
    \ upon single elements and collections of elements in the same manner.\n\nfind(selector)\
    \ Finds child elements that match the given selector.\n\nattr(name[, value]) Reads\
    \ an attribute from the first element in the set and sets attributes on all the\
    \ elements.\n"
  mdcn: "\n\n# 206 JavaScript 口袋指南\n\n在 jQuery 中编写十行代码非常简单，但可能需要六段话才能解释清楚。我恰好喜欢 jQuery\
    \ 简洁的风格，但这完全取决于个人喜好。\n\n现在你已经创建了所有的图片，请创建一个数组来包含所有的图片（包括标记中已存在的那一张）。\n\n```javascript\n\
    // 将所有图片收集到一个节点集合中并隐藏列表\nvar images = slides.find(\"img\");\nslides.find(\"ul\"\
    ).hide();\n```\n\n# 居中图片\n\n为了让这些尺寸任意的图片居中，你需要找到最大的高度和最大宽度。我经常需要做这件事，以至于我写了一些\
    \ jQuery 插件来让它变得简单。你必须在脚本中使用这些插件之前包含它们。跳转到 JavaScript 文件的顶部，添加以下代码：\n\n```javascript\n\
    // 包含工具 jQuery 插件\n$.fn.tallest = function(outer, margins) {\n  var fn = outer\
    \ ? \"height\" : \"outerHeight\";\n  return Math.max.apply(Math, $.map(this, function(el)\
    \ {\n    return $(el)[fn](margins);\n  }));\n};\n\n$.fn.widest = function(outer,\
    \ margins) {\n  var fn = outer ? \"width\" : \"outerWidth\";\n  return Math.max.apply(Math,\
    \ $.map(this, function(el) {\n    return $(el)[fn](margins);\n  }));\n};\n```\n\
    \n回到 JavaScript 文件的底部，你现在可以使用 `tallest()` 和 `widest()` 方法来设置幻片 `<div>` 的尺寸，以容纳最大的图片。\n\
    \n```javascript\n// 调整 slides <div> 以容纳最大的图片\nvar slidesWidth = images.widest();\n\
    var slidesHeight = images.tallest();\nslides.css({\n  width : slidesWidth,\n \
    \ height : slidesHeight\n});\n```\n\n`css()` 方法是设置元素样式属性的简写方式。它会自动为你为数字添加“px”，并提供其他小便利。\n\
    \n```javascript\n// 居中每张图片\nimages.each(function() {\n  var image = $(this);\n\
    \  image.css({\n    left : slidesWidth / 2 - image.width() / 2,\n    top : slidesHeight\
    \ / 2 - image.height() / 2\n  });\n});\n```\n\n使用 JavaScript 居中元素是一项很常见的任务。我发现自己经常编写这个公式的变体。`each()`\
    \ 方法可以轻松地为每张图片设置 `left` 和 `top` 样式属性。\n\n```javascript\n// 保存第一张图片的引用\nvar activeImage\
    \ = images.eq(currentImageIndex);\n```\n\n在启动幻灯片之前，你需要保存第一张图片的引用。`eq()` 方法返回一个被封装在\
    \ jQuery 对象中的单个元素。（如果你只需要普通的 DOM 元素，可以像数组中的元素一样访问它：`images[0]`）。\n\n# 幻灯片代码\n\n\
    到目前为止的内容都是设置代码。脚本的核心在 `showImage()` 函数中，它接收一个索引来指示显示哪一张图片。\n\n```javascript\n\
    // 显示下一张或上一个图片的函数\nfunction showImage(newIndex) {\n  currentImageIndex = newIndex\
    \ >= images.length ? 0 :\n  - newIndex;\n  currentImageIndex = currentImageIndex\
    \ < 0 ? images.length\n  - 1 : currentImageIndex;\n\n  activeImage.fadeOut();\n\
    \  activeImage = images.eq(currentImageIndex).fadeIn();\n}\n```\n\n前两行是我经常编写的另一种模式。这里只有四张图片（索引\
    \ 0 到 3），所以当你向 `showImage()` 传递 4 时，数字应该回绕到 0。同样地，如果你传递 -1，它应该向另一个方向回绕到 3。在这个阶段，当我看到这种模式时可以很容易识别出它，但你可能更倾向于一个更直观的版本。\n\
    \n```javascript\n// 示例代码不在 slideshow.js 中\ncurrentImageIndex = newIndex;\nif (currentImageIndex\
    \ >= images.length) {\n  currentImageIndex = 0;\n} else if (currentImageIndex\
    \ < 0) {\n  currentImageIndex = images.length - 1;\n}\n```\n\n为了真正实现图片的交叉淡入，jQuery\
    \ 提供了两个非常有用的动画函数：`fadeIn()` 和 `fadeOut()`。要隐藏当前图片，只需对存储在 `activeImage` 变量上的图片调用\
    \ `fadeOut()`。\n\n要显示下一张图片，使用 `eq()` 方法从 `images` 集合中获取它并调用 `fadeIn()`。同时，确保将此图片保存到\
    \ `activeImage` 变量中，以便下次调用 `showImage()` 函数使用。\n\n让幻灯片运行的最后一步是使用 `setInterval()`\
    \ 重复调用 `showImage()`。\n\n```javascript\n// 启动定时器循环图片\nvar interval = setInterval(function()\
    \ {\n  showImage(currentImageIndex + 1);\n}, 5000);\n```\n\n每当 `setInterval()`\
    \ 调用这个匿名函数时，它都会调用 `showImage()` 通过给 `currentImageIndex` 加 1 来显示下一张图片。你还需要保存定时器的引用，以便取消自动图片旋转。\n\
    \n# 幻灯片控制\n\n我尽量不在我的 JavaScript 文件中混合 HTML，但对于没有 JavaScript 就毫无用处的 HTML 元素，我会破例。你可以将这些链接放在\
    \ HTML 文档中，并使用 CSS 选择器获取它们。然而，我认为在这种情况下，用 JavaScript 创建这些元素是合适的解决方案。\n\n```javascript\n\
    // 创建下一个控制按钮\n$('a href=\"#\" class=\"next\">Next</a>').appendTo(slides).on(\"\
    click\", 1);\n\n// 创建上一个控制按钮\n$('a href=\"#\" class=\"prev\">Prev</a>').appendTo(slides).on(\"\
    click\", -1);\n```\n\n使用 Unicode 实体（如“→”和“←”）来指示方向。尽管你是用 JavaScript 创建这些的，但最好在\
    \ CSS 中为它们设置样式。添加以下规则来定位幻灯片的下一个和上一个链接。\n\n```css\n#slideshow .next,\n#slideshow\
    \ .prev {\n  position: absolute;\n  margin-top: -0.5em;\n  width: 40px;\n  font-size:\
    \ 32px;\n  text-decoration: none;\n}\n\n#slideshow .next {\n  right: -50px;\n\
    \  padding-left: 10px;\n}\n\n#slideshow .prev {\n  left: -50px;\n  padding-right:\
    \ 10px;\n  text-align: right;\n}\n```\n\n# jQuery 术表\n\n这是本章使用的 jQuery 函数和概念的摘要。你可以在在线文档中找到更多信息：http://api.jquery.com/\n\
    \n# jQuery 函数：$()\n\n这个神奇的小元素有多种用途。\n\n- 如果传递一个 CSS 选择器，它会查找元素。\n\n```javascript\n\
    var foundElements = $(\"#domId > .selector + div\");\n```\n\n- 通过将其封装在 jQuery\
    \ 对象中为 DOM 元素添加方法。在迭代器和事件处理器中特别有用。\n\n```javascript\nvar wrappedElement = $(this);\n\
    wrappedElement.fadeIn();\n```\n\n- 如果传递一个 HTML 字符串，它会创建 DOM 元素。\n\n```javascript\n\
    var newElement = $('<a href=\"index.html\">Click here</a>');\n```\n\n# jQuery\
    \ 对象方法\n\njQuery 对象提供了许多用于查找、创建和操作 DOM 元素的方法。和 jQuery 函数 ($) 一样，许多方法有用途，因此这些描述是不完整的。这些方法以相同的方式处理单个元素和集合。\n\
    \nfind(selector) 查找匹配给定选择器的子元素。\n\nattr(name[, value]) 从集合中的第一个元素读取属性，并为所有元素设置属性。\n\
    \n"
