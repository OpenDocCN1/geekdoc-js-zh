    # The history object


    The history object gives you programmatic access to the browser''s Back and Forward
    buttons. It has three methods: back(), forward(), and go().


    ```

    // Same as pressing the Back button

    window.history.back();

    // Same as pressing the Forward button

    window.history.forward();

    // Same as pressing the Back button twice

    window.history.go(-2);

    // Same as pressing the Forward button twice

    window.history.go(2);

    ```


    # The location Object


    The location object allows you to inspect and change the window’s current URL.
    You can change the current page by setting it to a different string value.


    ```

    window.location = "http://www.google.com";

    ```


    You can also change just part of a URL by assigning new values to any of the properties.
    Refer to this example URL:


    ```

    http://www.example.com:8080/dir/file.html?param=value&param2=value2#comments

    ```


    +   - hash The string after and including the hash: #comments

    - host The domain and port: www.example.com:8080

    - hostname Just the domain name: www.example.com

    - href The entire URL: http://www.example.com:8080/dir/file.html?param=value&param2=value2#comments'
