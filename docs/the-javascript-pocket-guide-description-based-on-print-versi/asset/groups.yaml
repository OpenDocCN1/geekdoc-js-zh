    \ Firebug extension for Firefox set up (or are using another browser), you’re\
    \ ready to write some JavaScript code.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_28_0.png)\n\
    \nA lot of people learn JavaScript by copying and pasting code they find on the\
    \ Web without really understanding it. In this book, you'll start from the very\
    \ beginning.\n\nA language is a system for organizing and transmitting meaning\
    \ through symbols. A computer language uses symbols you can type with any average\
    \ keyboard to organize and transmit instructions to hardware and software.\n\n\
    The JavaScript language doesn't have a large number of symbols. Instead, it's\
    \ very flexible in how you can combine those symbols. That flexibility allows\
    \ you to produce expressive and powerful code, but it also creates the potential\
    \ for ambiguity and confusion. Symbols in the language combine to create syntax,\
    \ which acts as the structure or grammar of the language. Values, variables, and\
    \ functions are the subjects and actions.\n\nOnce you get the hang of the symbols\
    \ and syntax, learning JavaScript is a matter of understanding the various data\
    \ types you can use. JavaScript includes a few built-in data types, most of which\
    \ I'll cover in Chapters 2 through 7. If you're using JavaScript in a browser,\
    \ you have access to many more data types, which will be the focus of Chapters\
    \ 9, 10, and 11.\n\n## Expressions and Statements\n\n*Expressions* are phrases\
    \ that produce a value. JavaScript code is made up mostly of expressions in various\
    \ forms.\n\n*Statements* are phrases that don't produce a value but instead have\
    \ some sort of side effect. Examples of side effects include storing variables\
    \ in memory and jumping to a different part of the script. Statements often combine\
    \ keywords such as var, if, or while with one or more expressions so that the\
    \ side effects have values to work with.\n\nFirebug makes it easy to differentiate\
    \ between expressions and statements. When you enter an expression, it outputs\
    \ the resulting value:\n\n```\n1 + 2;\n3\n```\n\nWhen you enter a statement, Firebug\
    \ doesn't show you any output, even if the statement includes some expressions.\
    \ That's why I have to use console.log() in some of my examples. If this statement\
    \ doesn't produce a value. Instead, it controls whether to evaluate the *block*\
    \ (the code in curly braces).\n\n```\nif (true) {\n    console.log(\"expression\"\
    );\n}\n```\n\n## Variables and Data\n\n> note Enter this code example into the\
    \ multiline text box in Firefox, because hitting Enter/Return in the single-line\
    \ text box will execute the incomplete code and cause an error.\n\nVariables store\
    \ a value you can refer to later in the script. Variable names can be nearly any\
    \ valid identifier. A JavaScript identifier is a word that contains only letters,\
    \ numbers, $, and _, and that doesn't start with a number.\n\nVariables are a\
    \ great demonstration of how statements and expressions can be combined. You use\
    \ a variable declaration statement to create a variable.\n\n```\nvar myVariable;\n\
    ```\n\nIf you already have a variable, you can use a variable assignment expression\
    \ to assign it a value.\n\n```\nmyVariable = 42;\n42\n```\n\nYou can combine a\
    \ variable declaration with an assignment expression.\n\n```\nvar myVariable =\
    \ 42;\n```\n\nYou can also string together several variable declarations with\
    \ commas. Don't forget the commas, though! Leaving off a comma can have the unintended\
    \ side effect of declaring a global variable when you don't mean to do that. I'll\
    \ explain that more in Chapter 5.\n\n```\nvar variable1 = 4,\nvariable2 = 8,\n\
    variable3 = 15;\n```\n\n## Values\n\nJavaScript has a relatively small number\
    \ of built-in data types, including these common types:\n\n```\nvar myNumber =\
    \ 42;\nvar myString = \"A string of text\";\nvar myBoolean = true;\nvar myArray\
    \ = [myNumber, myString, myBoolean];\n```\n\nArrays are ordered lists of values,\
    \ and you can access a particular value by its index, or its position in the list.\
    \ Indices always start at zero.\n\n```\nmyArray[0];\n42\nmyArray[2];\ntrue\n```\n\
    \nFor primitive values (Number, String, and Boolean), you can find the data type\
    \ of the variable with the typeof operator:\n\n```\ntypeof myNumber;\n\"number\"\
    \ntypeof myString;\n\"string\"\ntypeof myBoolean;\n\"boolean\"\ntypeof myArray;\n\
    \"object\"\n```\n\nWhoops! Arrays are not primitive values but examples of objects,\
    \ or collections of values. The quick-and-dirty way of checking whether a variable\
    \ is an array is to use the instanceof operator.\n\n```\nmyArray instanceof Array;\n\
    true\n```\n\nYou can also declare a variable without a value.\n\n```\nvar myVariable;\n\
    ```\n\nAnd unlike strongly typed languages such as C and Java, you can:\n\n```\n\
    typeof myVariable;\n\"undefined\"\n```\n\nThe null value represents intentional\
    \ absence of any.\n\n```\nmyVariable = null;\n```\n\n## Comparison\n\nComparison\
    \ expressions return a Boolean. Booleans are the simplest data type, representing\
    \ either true or false. There are two comparison operators, equality (==) and\
    \ identity (===). Don't confuse them with assignment (=) operator that you've\
    \ already used to assign values.\n\n```\nmyVariable = 42;\nmyVariable == 42; //\
    \ Does it equal number 42?\ntrue\nmyVariable == \"42\"; // Does it equal string\
    \ \"42\"?\ntrue\nmyVariable === 42; // Is it identical to number 42?\ntrue\nmyVariable\
    \ === \"42\"; // Is it identical to string \"42\"?\nfalse\n```\n\n## The JavaScript\
    \ Pocket Guide\n\nThe equality operator tries to reconcile different types, such\
    \ as converting the string \"42\" to the number 42, before making the comparison.\
    \ The identity operator does not do any coercion. The comparison operators have\
    \ (! ) versions for checking inequality and nonidentity.\n\n```\nmyNumber != 10;\n\
    true\nmyNumber != \"42\";\ntrue\n```\n\nComparing composite values such as arrays\
    \ and objects is different from comparing primitive values such as numbers and\
    \ strings.\n\n```\nvar array1 = [1, 2, 3];\nvar array2 = [1, 2, 3];\narray1 ==\
    \ array2;\nfalse\narray1 === array2;\nfalse\narray1 == array1; // Same object\n\
    true\narray1 === array1; // Equal and identical\ntrue\n```\n\nThe comparison operators\
    \ check whether the values are actually the same object instead of checking whether\
    \ it is composed of all the same values in the same order.\n\n## Truthiness and\
    \ Falsiness\n\nAll values in JavaScript have a notion of \"truthiness\" and \"\
    falsiness,\" meaning they can often be treated as true or false values without\
    \ actually being Booleans. Here are some examples of truthiness:\n\n```\nif (1)\
    \ {\n  console.log(true);\n}\nif (\"Nonempty string\") {\n  console.log(true);\n\
    }\nif ([]) // Empty array, all composite values are trusty\n  console.log(true);\n\
    }\n```\n\nZero, null, undefined, and empty string values are all \"falsy,\" and\
    \ every other value is \"truthy.\" Both of these examples output false to the\
    \ console:\n\n```\nif (0) {\n  console.log(true);\n} else {\n  console.log(false);\n\
    }\n```\n\n```\nif (\"\") // Empty string\n  console.log(true);\n} else {\n  console.log(false);\n\
    }\n```\n\nUse the identity (===) operator if you need to know that a value is\
    \ actually true or false.\n\n```\nmyBoolean === true; true\n// Truthy but not\
    \ true\nmyBoolean === 1; false\n```\n"
