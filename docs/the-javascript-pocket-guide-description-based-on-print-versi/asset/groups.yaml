  mdcn: "\n\n# JavaScript 口袋指南\n\n`indexOf()` 返回 -1 而不是 `false` 这个事实很容易让你困惑。如果你不小心，可能会写出运行结果与预期完全相反的代码。\n\
    \n```javascript\nvar myString = \"hello world\";\n// 如果字符串*不*包含子字符串：\nif (!myString.indexOf(\"\
    not found\"))\n```\n\n在上述代码的第一个示例中，`indexOf()` 没有找到子字符串并返回 -1，而这是一个“真值”（truthy）值。我本想在找不到子字符串时向控制台打印，但因为我使用了非\
    \ (!) 运算符，它的结果与我预期的相反。\n\n在上述代码的第二个示例中，`indexOf()` 在位置 0 找到了子字符串，这是一个“假值”（falsey）值。因为子字符串位于\
    \ `myString` 的开头，这个测试的结果也与我的预期相反。\n\n使用 `indexOf()` 的唯一安全方法是显式地测试 -1，如下：\n\n```javascript\n\
    if (myString.indexOf(\"not found\") == -1) {\n  console.log(\"String not found!\"\
    );\n}\n\nif (myString.indexOf(\"hello\") != -1) {\n  console.log(\"String contains\
    \ 'hello'\");\n}\n```\n\n# 第 3 章：字符串\n\nindexOf(substring[, start])\n\n`lastIndexOf()`\
    \ 方法与 `indexOf()` 相同，不同在于它从字符串末尾而不是开头开始搜索。\n\n```javascript\n\"hello world\".lastIndexOf(\"\
    o\");\n```\n\n# 正则表达式\n\n以下方法 `search()`、`match()` 和 `replace()` 的强大源于另一个 JavaScript\
    \ 内置数据类型：正则表达式。\n\n正则表达式（或 RegExps）非常复杂，基本上是 JavaScript 内部的一种微型语言。掌握它们需要一段时间——比我这本书书中涵盖的内容要长得多。我会解释示例中使用的正则表达式，但我建议在其他书籍和网上查找示例、教程和参考资料。\n\
    \nJavaScript 正则表达式有很多功能，但它们并没有其他语言中的 Perl 兼容正则表达式和 RegExp 引擎那样功能齐全。请确保你寻找的是专门\
    \ JavaScript 语言的引用和示例。\n\n正则表达式描述了字符串中的一种模式。最基本的模式是一系列字母数字字符。\n\n```javascript\n\
    var myPattern = /matching characters/\n```\n\n正则表达式看起来像字符串，但它们使用正斜杠 (/) 而不是引号来界定开始和结束。与字符串一样，你必须用反斜杠\
    \ (\\) 转义特殊字符。与字符串不同，正则表达式中有几个特殊字符：^ $ . * + ? = ! \\ ( ) [ ] {}.。\n\n# search(regexp)\n\
    \n`search()` 方法与 `indexOf()` 相同，不同在于它接收一个正则表达式模式而不是子字符串。如果未找到模式，它也会返回 -1。\n\n\
    ```javascript\n\"hello world\".search(/[aeiou]/); // 找到第一个元音\n\"hello world\"\
    .search(/\\d/); // 找到第一个数字\n-1\n```\n\n# match(regexp)\n\n`match()` 方法返回一个数组，包含所有与正则表达式及其子模式匹配的字符串。与其他搜索和替换方法不同，如果模式不匹配，它将返回\
    \ `null`。这里是一些简单的示例，我将在第 8 章介绍这个函数：\n\n```javascript\n// 找到所有元音\n\"hello world\"\
    .match(/[aeiou]/g);\n[\"e\", \"o\", \"o\"]\n// 不区分大小写地找到 \"world\"\n\"hElLo WoRiID\"\
    .match(/world/i);\n[\"WoRiID\"]\n```\n\n# replace(pattern, replacement)\n\n`replace()`\
    \ 方法的工作与 `match()` 类似，但它返回一个将所有模式实例替换为 `replacement`字符串的字符串。\n\n```javascript\n\
    // 从电话号码中删除所有非数字字符\n\"(310) 555-9876\".replace(/\\D/g, \"\");\n\"3105559876\"\n\
    ```\n\n`pattern` 参数可以是简单的子字符串而不是正则表达式，但它只会替换第一个出现处。\n\n\"favorite color: red\"\
    .replace(\"red\", \"blue\");\n\"favorite color: \"blue\"\n\n要替换每个出现处，请使用带有全局 (g)\
    \ 选项的模式。\n\n```javascript\n// 不使用全局选项\n\"red, red, red\".replace(/red/, \"blue\"\
    );\n\"blue, red, red\"\n\"red, red, red\".replace(/red/g, \"blue\");\n\"blue,\
    \ blue, blue\"\n```\n\n（注：原文中存在大量重复和 OCR 错误，译文已根据逻辑流进行了清理。）\n\n"
