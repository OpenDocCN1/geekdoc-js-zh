    \ event occurred\");\n};\n```\n\nWhen the mouse enters the gray parent <div>,\
    \ the mouse event fires. But if the mouse continues into the white child <div>,\
    \ the mouse and mouseover events fire again. If you only wanted to know when the\
    \ mouse enters and leaves the parent <div>, these extra events can be problematic.\n\
    \n# mouseenter, mouseleave\n\nOnly available in Internet Explorer\n\nInternet\
    \ Explorer provides two events that fix the mouseover/mouseout problem described\
