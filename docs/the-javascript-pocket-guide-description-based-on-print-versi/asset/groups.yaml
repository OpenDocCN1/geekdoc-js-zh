    \ p]\nparagraph.children; // Ignores the nonempty text node\n[a walking.html#]\n\
    ```\n\n## Finding Nodes\n\nWalking the DOM is useful for finding elements that\
    \ are close to one another, but if you need an element deep in the DOM tree, it's\
    \ much easier to find it with one of these retrieval methods.\n\n## getElementById(domId)\n\
    \nThe getElementById() method is one of the most common DOM methods. It returns\
