    }\n\n// Finally, call the constructor function in the context\n// of the object\n\
    ConstructorFunc.call(instance);\n\ninstance.method();\n```\n"
  mdcn: "\n\n跳过使用 `hasOwnProperty()` 是很有吸引力的，尤其是当你非常小心不向任何内置原型添加属性时。但请记住，页面上的任何脚本都可以更改内置对象。你需要留心的不只是你的代码。\n\
    \n## 删除属性\n\n你可以使用 `delete` 运算符从对象中删除属性。该属性将不再出现在 `for/in` 循环中。只有当成功删除该属性时，`delete`\
