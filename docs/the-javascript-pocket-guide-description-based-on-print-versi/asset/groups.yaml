    # Creating Arrays


    The best way to create a new array is with the array literal syntax ([]), but
    the array constructor function is available too. If you pass a single number value
    to the constructor function, you get an array filled with that many undefined
    values.


    ```

    var myArray = [];

    var myFilledArray = new Array(4);

    myFilledArray;

    [undefined, undefined, undefined, undefined];

    ```


    # Properties


    Like strings, arrays have one built-in property: length. This property is equal
    to the number greater than the last index in the array. This is true even if you
    skip indices.


    ```

    "a", 1, true, null].length;

    4

    ```


    ```

    var myArray = [];

    myArray.length;

    0

    myArray[99] = 1;

    1

    myArray.length;

    100

    ```


    The new length of myArray is 100 even though it contains only one value at index
    99. All the other values are undefined.


    The following is the quickest way to add an item to the end of an array, since
    the length property is one greater than the index of the last item:'
- md: "\n# Looping Over Arrays\n\n```javascript\nmyArray = [\"a\", \"b\", \"c\"];\n\
    // Same as myArray[3] = \"d\"\nmyArray[myArray.length] = \"d\";\n```\n\nLooping\
    \ over arrays is one of the most common tasks in JavaScript, and there are dozens\
    \ of ways to do it. In my code, I stick to just two versions for readability and\
    \ performance reasons.\n\nBoth versions use the for statement. The simpler of\
    \ the two should look familiar from Chapter 1, as shown here:\n\n```javascript\n\
    var myArray = [1, 2, 3, 4, 5];\nfor (var i = 0, l = myArray.length; i < l; i++)\
    \ {\n  console.log(myArray[i]);\n}\n```\n\nThe important difference is in the\
    \ setup expression, where I declare both i and l at the same time. I do this because\
    \ the test is executed every time the loop runs, and I can save a few milliseconds\
    \ by saving the value of length to a variable from the start.\n\nMy second favorite\
    \ loop pattern is used only if every element in the array is \"truthy\" (not zero,\
    \ false, an empty string, null, or undefined), so I use it only in special cases.\
    \ The most common case is when I'm looping over elements in a page.\n\n```javascript\n\
    // Get a collection of <a> tags from the page\n// and loop over them\nvar allLinks\
    \ = document.getElementsByTagName(\"a\");\nfor (var i = -1, link; link = allLinks[++i];\
    \ ) {\n  console.log(link);\n}\n```\n\nMake sure you run this in a page that actually\
    \ has links, or you won't see any output!\n\nThe previous is still a normal for\
    \ loop, but I'm doing some tricky things in each expression:\n\n- In the setup,\
    \ I declare i as -1 and link as undefined (it doesn't need a value yet).\n- In\
    \ the test, I access the next link in the allLinks collection by incrementing\
    \ i and using the bracket operators ([]). The first time this happens, -1 becomes\
    \ 0 and returns the first item in allLinks. I then assign that value to link.\n\
    \nNote that I use the increment (++) operator on the left side of i so that I\
    \ add 1 to before evaluating it in the brackets.\n\n- In the increment expression,\
    \ I don't do anything because I already incremented i in the test. Note that the\
    \ semicolon is still required after the test.\n\nI like this usage of the for\
    \ loop because I don't worry about i in the body of the loop. I have the link\
    \ variable to work with as soon as possible. It's also a great demonstration of\
    \ the flexibility of JavaScript.\n\n# forEach(loopFunc)\n\nLooping over arrays\
    \ using functions is increasingly common, especially in certain libraries. Modern\
    \ browsers support the forEach() method, but you can also build your own.\n\n\
    ```javascript\nfunction arrayForEach(array, loopFunc) {\n  // If the browser support\
    \ for forEach, use it because\n  // it will be faster\n  if (\"forEach\" in array)\
    \ {\n    return array.forEach(loopFunc);\n  }\n  // Otherwise, loop over the array\
    \ and pass in\n  // the array values to the loop function\n  else {\n    for (var\
    \ i = 0, l = array.length; i < l; i++) {\n      loopFunc(array[i], i, array);\n\
    \    }\n    return array;\n  }\n}\n```\n\n```javascript\nfunction doSomeMath(num)\
    \ {\n  console.log(num * 10 - 5);\n}\n\narrayForEach([1, 2, 3], doSomeMath);\n\
    ```\n\n5\n15\n25\n\n# Methods\n\nUnlike string methods, some array methods change\
    \ the original array while returning a separate value.\n\n# Adding Items to Arrays\n\
    \nEarlier, I showed you how to quickly add a value to the end of an array using\
    \ the length property. JavaScript also provides a few methods for adding values\
    \ to both ends of an array.\n\n# concat(x[, y, z ...])\n\nThe concat() method\
    \ concatenates values to the end of the array and returns the result. The original\
    \ array doesn't change. You can pass in any number of arguments. If an argument\
    \ is an array, each value is concatenated individually.\n\n```javascript\n[1,\
    \ 2, 3].concat(4, [5, 6]);\n[1, 2, 3, 4, 5, 6]\n```\n\n# push(x[, y, z ...])\n\
    \nThe push() method is the same as the concat() method except for a few differences:\n\
    \n- It does change the original array.\n- It returns the new length of the array.\n\
    - If an argument is an array, it does not concatenate each value individually.\n\
    \n```javascript\nvar myArray = [\"a\", \"b\", \"c\"];\nmyArray.push(\"d\", [\"\
    e\", \"f\"]);\nmyArray;\n[\"a\", \"b\", \"c\", \"d\", [\"e\", \"f\"]]\n```\n\n\
    # unshift(x[, y, z ...])\n\nThe shift() method is exactly the same as push() except\
    \ that it adds values to the beginning of the array instead of the end.\n\n```javascript\n\
    var myArray = [\"d\", \"e\", \"f\"];\nmyArray.unshift(\"a\", [\"b\", \"c\"]);\n\
    myArray;\n[\"a\", [\"b\", \"c\"], \"d\", \"e\", \"f\"]\n```\n\n# Removing Items\
    \ from Arrays\n\nThe push() and shift() methods have analogs for removing elements\
    \ from the ends.\n\n# pop()\n\nThe pop() method removes the last element from\
    \ the array and changes the original array.\n\n```javascript\nvar myArray = [\"\
    a\", \"b\", \"c\"];\nmyArray.pop();\nmyArray;\n[\"a\", \"b\"]\n```\n\n# shift()\n\
    \nThe shift() method removes the first element from the array and changes the\
    \ original array.\n\n```javascript\nvar myArray = [\"a\", \"b\", \"c\"];\nmyArray.shift();\n\
    myArray;\n[\"b\", \"c\"]\n```\n\n# Extracting Items from Arrays\n\nThe slice()\
    \ and splice() methods are useful for extracting elements from arrays. They work\
    \ different ways.\n\n# slice(x, y)\n\nThe slice() method returns a new array containing\
    \ a portion of the array. It doesn't change the original array. The arguments\
    \ can be negative, counting from the end.\n\n```javascript\nvar arr = [\"a\",\
    \ \"b\", \"c\", \"d\", \"e\"];\narr.slice(1, 4);\n[\"b\", \"c\", \"d\"]\n```\n\
    \n# splice(start, length, newValue ...)\n\nThe splice() method deletes a specified\
    \ number of values from an array and inserts new values in place. If you provide\
    \ only the start argument, it deletes all values until the end.\n\n```javascript\n\
    var arr = [\"a\", \"b\", \"c\", \"d\", \"e\"];\narr.splice(2, 2, \"x\", \"y\"\
    );\n[\"a\", \"b\", \"x\", \"y\", \"e\"]\n```\n\n# Ordering Arrays\n\nSometimes\
    \ you may want to present the values of an array in a particular order. These\
    \ methods come in handy for simple and complex array sorting.\n\n# reverse()\n\
    \nThe reverse() method reverses the order of the values in the array. It changes\
    \ the original array and returns a reference to the same array.\n\n```javascript\n\
    var myArray = [1, 2, 3];\nmyArray.reverse();\n[3, 2, 1]\n```\n\n# sort([func])\n\
    \nBy default, the sort() method reorders the values in the array alphabetically,\
    \ with lowercase letters being higher than uppercase. With numbers, this is not\
    \ the expected behavior:\n\n```javascript\n[222, 3, 11].sort();\n[11, 222, 3]\n\
    ```\n\nFortunately, you can pass a function as an argument that sorts the array\
    \ however you like.\n\n```javascript\nfunction numericalSort(a, b) {\n  return\
    \ a - b;\n}\n[222, 3, 11].sort(numericalSort);\n[3, 11, 222]\n```\n\nThe sorting\
    \ function must return the following:\n\n- A number greater than zero if a is\
    \ greater than b\n- A number less than zero if a is less than b\n- Zero if a equals\
    \ b\n\nYou can also sort arbitrary objects this way.\n"
