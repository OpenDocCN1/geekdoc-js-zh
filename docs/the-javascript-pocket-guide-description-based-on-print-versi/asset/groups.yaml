    The Web is made up of text: HTTP is a text-based protocol, and browsers consume
    Web content in HTML text files. JavaScript handles text in a flexible, capable
    manner with the powerful String data type.'
  - '[PAGE 59]


    # Escape Characters


    You can surround characters with either single primes ('''') or double primes
    (") to create a string. But whichever symbol you use, you can''t use it again
    in the middle of the string because that will end the string early. However, you
    can escape any character with a backslash (\) to solve this or use single primes
    inside double primes (and vice versa).


    ```

    "He said "hello!"

    SyntaxError: missing ; before statement

    "She said "hello!""

    "She said "hello!"

    ''They say "hello!''''

    "They said "hello!""

    ```


    Escape sequences are useful for other things too, such as for newlines (\n), tabs
    (\t), and Unicode character codes (\u00A3 is £ and \u2603 is ☺).


    # Operators


    The plus sign (+) operator concatenates strings together. Concatenation isn''t
    the same as addition, so watch out when you''re adding strings and numbers together.


    ```

    "hello" + " world"

    hello world

    "2" + "2"

    "22"

    ```


    Like numbers, the plus operator also has an assignment version (+=) so you can
    concatenate a string in place. These two examples are identical if myString equals
    "hello".'
  - '[PAGE 60]


    ```

    myString = myString + " world";

    "hello world"

    myString += " world";

    "hello world"

    ```


    The greater-than (>) and less-than (<) operators compare strings in alphabetical
    order. sort A is less than Z, but uppercase letters are "lower" than lowercase
    letters, so Z is less than a.


    ```

    "Alpha" < "Zeta";

    true

    "Zeta" > "alpha";

    false

    ```


    # Properties


    Strings have one built-in property, length, which is the number of characters
    in a string.


    ```

    "abcdefghijklmnopqrstuvwxyz".length;

    26

    ```


    # Methods


    All string methods return a new string, leaving the original string unchanged.


    ```

    var myString = "hello";

    var myTransformedString = myString.toUpperCase();

    myTransformedString;

    "HELLO"

    myString; // Remains the same

    "hello"

    ```'
  - '[PAGE 61]


    # Changing Case: toUpperCase(), toLowerCase()


    The methods toUpperCase() and toLowerCase() are pretty self-evident. I mentioned
    earlier that uppercase letters are “lower” than lowercase letters, so these methods
    are useful when you want to reliably compare strings in alphabetical order.


    ```

    var string1 = "B comes after (is greater than) a";

    var string2 = "a comes before (is less than) b";


    string1 > string2;

    alse


    string1.toLowerCase() > string2.toLowerCase();

    true


    string2.toUpperCase() < string1.toUpperCase();

    true

    ```


    It doesn''t really matter which method you use as long as you’re consistent.


    # Extracting Parts of a String


    Extracting bits and pieces from strings is such a common task that JavaScript
    has several functions for doing so. Some of these functions are so similar that
    you’ll want to return to the following sections when you need a reminder of the
    distinctions between them.


    # charAt(x), charCodeAt(x)


    The charAt() method returns a string with the character at the specified index
    in the string. Like arrays, indices start at zero.


    ```

    "abcd".charAt(0);

    "a"

    ```'
  - '[PAGE 62]


    ```

    "abcde".charAt(3);

    "d"

    // Using an index greater than the string''s length

    "abcde".charAt(10);

    ""

    ```


    The charCode() method is similar, except that it returns the numeric

    encoding for the found character. You''ll see in Chapter 11 that key presses

    are returned as character encodings, so it''s helpful to know how to

    convert characters and character codes.


    ```

    "a".charCodeAt(0);

    97

    ```


    The fromCharCode() method is available on the String object—not on a

    specific string instance—to turn a character code back into string.


    ```

    String.fromCharCode(97);

    "a"

    ```


    # slice(x, y)


    > Note When I specify function arguments in brackets, as in (x[, y]), I''m

    indicating that those arguments are optional. In this case, y is optional

    but x is not. The brackets aren''t part of the code, but the parentheses are.


    The slice() method returns a subsection of the string, starting at position-

    x and including the characters up to (but not including) position y.

    The arguments can both be negative, which means they start counting-

    ing the position from the end of the string instead of the beginning. If

    t second argument isn''t specified, slice(x) returns the subsection of

    the string starting at position x through the end of the string.'
