    \n# Functions as Methods\n\nFunctions always have a context when they're called,\
    \ which is accessible via the this keyword. This is one of the more confusing\
    \ concepts in JavaScript, so I'll start with some illustrative examples.\n\n```javascript\n\
    function globalFunc() {\n  console.log(this);\n}\nglobalFunc();\n```\n\nWhen you\
    \ call a function normally, its context is the global object. (See Chapter 8 for\
    \ a discussion of the global object.)\n\n```javascript\nvar myObject = {\n  someProperty:\
    \ 42\n};\nmyObject.method = function() {\n  console.log(this.someProperty);\n\
    };\nmyObject.method();\n```\n\nWhen a function is a property of an object, it's\
    \ referred to as a method. Calling that function with the dot (.) on the object\
    \ changes the function's context. You could create your own push method for an\
    \ array like this:\n\n```javascript\nvar myArray = [];\nmyArray.push = function(obj)\
    \ {\n  this.length = obj;\n  return this.length;\n};\nmyArray.push(1);\nmyArray.push(2);\n\
    myArray.push(3);\n```\n\nOf course, this implementation of push() is incomplete,\
    \ since you should be able to pass any number of arguments. (Hint: Loop over the\
    \ arguments.)\n\nFunctions can lose their context easily.\n\n```javascript\nvar\
    \ myObject = {\n  someProperty: 42\n};\nmyObject.method = function() {\n  console.log(this.someProperty);\n\
    };\nvar objectMethod = myObject.method;\nobjectMethod();\nundefined\n```\n\nHere,\
    \ you stored a reference to the object's method and called it without using the\
    \ dot operator. This causes the function's context to change back to the window.\
    \ Since window doesn't have a property called someProperty, it returns undefined.\
    \ These concepts are extremely important because JavaScript code is asynchronous,\
    \ which means that you're passing functions around and waiting for them to be\
    \ executed in a certain context. See Chapter 13 to learn more about this.\n\n\
    # Context Binding\n\nJavaScript is one of small number of languages that gives\
    \ you the ability to manage function context. Functions have two methods of their\
    \ own call() and apply(), which allow you to execute them in a certain context.\n\
    \n```javascript\nvar myObject = {\n  someProperty: 42\n};\ncalledFunc.call(myObject);\n\
    calledFunc.apply(myObject);\n```\n\nThe first argument for both call() and apply()\
    \ is the context for the function. You can also pass arguments to the function\
    \ with these methods, as shown here:\n\n```javascript\nfunction adder(num1, num2)\
    \ {\n  return num1 + num2;\n}\nadder.call(myObject, 10, 20);\n```\n\nThe values\
    \ 10 and 20 are passed in the arguments num1 and num2. The apply() method handles\
    \ this a little differently:\n\n```javascript\nvar numbers = [4, 8, 15, 16, 23];\n\
    adder.apply(myObject, numbers);\n```\n\nThe apply() method lets us pass all the\
    \ arguments as a single array. Here's an example that uses Math.max() to find\
    \ the largest number in an array function call:\n\n# Closures\n\nFunctions in\
    \ JavaScript have *lexical scope*, which means that they maintain access to the\
    \ scope they are declared in. This is also a confusing topic, so here's an example:\n\
    \n```javascript\nfunction scopeFunc() {\n  var scopedVar = 42;\n\n  function innerFunc()\
    \ {\n    console.log(scopedVar);\n  }\n\n  return innerFunc;\n}\nvar closure =\
    \ scopeFunc();\nclosure();\n```\n\nIt breaks down like this:\n\n1. You declare\
    \ the variable scopedVar inside scopeFunc(). This means you cannot access scopedVar\
    \ outside scopeFunc().\n2. You also declare the function innerFunc() inside scopeFunc().\
    \ Since it is in the same scope as scopedVar, it still has access to that variable.\n\
    3. You return a reference to innerFunc() when scopeFunc() executes.\n4. You save\
    \ the returned reference to innerFunc() on the variable closure. When you execute\
    \ the function, it still has access to scopedVar and prints its value to the console.\n\
    \n# Chapter 5: Functions\n\nThese inner functions are called closures because\
    \ they \"close over\" the variables in their scope. This is a very powerful organizational\
    \ tool, especially when you want to keep different pieces of code separate. It\
    \ allows you to create \"private\" variables and functions and control access\
    \ to them by selectively returning references.\n\nOne simple practical example\
    \ is creating a function that returns a unique string every time it runs, like\
    \ this:\n\n```javascript\nvar uniqueId = (function() {\n  var counter = 0;\n\n\
    \  return function() {\n    return \"unique-id-\" + counter++;\n  }\n})(); //\
    \ Self-invoking function executes automatically\n```\n\n```javascript\nuniqueId();\n\
    \"unique-id-0\"\nuniqueId();\n\"unique-id-1\"\nuniqueId();\n\"unique-id-2\"\n\
    ```\n\nThe uniqueId variable holds a reference to the anonymous function, which\
    \ is the only object that has access to the counter variable. You can be sure\
    \ that nothing else can change counter and every string returned is unique.\n\n\
    Another practical example is a little more complicated and therefore usually trips\
    \ up novice JavaScript coders. This code uses objects and functions you’ll find\
    \ in Chapters 10 and 11 later in the book.\n\n```javascript\nfor (var i = 0; i\
    \ < 10; i++) {\n  var link = document.createElement(\"a\");\n  link.innerHTML\
    \ = \"Link \" + i;\n  link.href = \"#\";\n  link.onclick = function() {\n    alert(\"\
    This is link \" + i);\n    return false;\n  };\n  document.body.appendChild(link);\n\
    }\n```\n\nThis loop creates 10 <a> elements and appends them to the body of the\
    \ page. (If you're typing into the Firebug console, you may have to scroll to\
    \ the bottom of the page to see the links.) The expected behavior is that clicking\
    \ each link should alert \"This is link 0\" or \"This is link 5\" depending on\
    \ the link. But if you try it, every link alerts \"This is link 10.\" Why is that?\n\
    \nThis function is lexically scoped to the i variable:\n\n```javascript\nlink.onclick\
    \ = function() {\n  alert(\"This is link \" + i);\n  return false;\n};\n```\n\n\
    When it runs, it accesses the current value of i. Since the for loop finished\
    \ long before you clicked the link, the value of i is 10, the final value of the\
    \ loop. To fix this, you need to create a new scope to hold the value of i for\
