- md: "\n## Arrays in MooTools\n\nThe next method, initMenuItems(), finds all the\
    \ elements in the menu's container that you'll need to add menu behavior.\n\n\
    ```javascript\ninitMenuItems : function() {\n// The top <ul>\nthis.list = this.container.getChildren();\n\
    // The top <li>(File, Edit, Window)\nthis.items = $(this.list.getChildren());\n\
    // The links in the top <li>\nthis.links = $(this.list.getElementsByElements(\"\
    a\"));\n// The submenu <ul><li>\nthis.submenus = this.container.getElements(\"\
    ul ul\");\n}\n```\n\nMooTools's element-finding methods, such as getChildren()\
    \ and getElements(), return special arrays with added methods. When you call an\
    \ element-finding method on an array of MooTools objects, it returns an array\
    \ of arrays:\n\n```javascript\n// An array of links for each item in this.items\n\
    this.items.getChildren(\"a #\")\n// [[a #], [a #], [a #]]\n```\n\nThe $$() function\
    \ has many uses, one of which is flattening these nested arrays for use with all\
    \ the MooTools methods.\n\n```javascript\n$$(this.items.getChildren(\"a #\"))\n\
    // [a #, a #, a #]\n```\n\n## Event Handlers in MooTools Classes\n\nThe Menu class's\
    \ addMouseEvents() method adds click event handlers to the links in the menu and\
    \ on the document element.\n\n```javascript\naddMouseBehavior : function() {\n\
    \    this.links.addEventListener(\"click\", this.onClick.bind(this));\n    $(document).addEventListener(\"\
    click\", onOutsideClick.bind(this));\n},\n```\n\nThe onClick() method is very\
    \ simple. It passes the clicked element to the toggleLink() method and prevents\
    \ the event's default behavior to keep the browser from navigating to a new page.\n\
    \n```javascript\nonClick : function(event) {\n    this.toggleLink(event.target);\n\
    \    event.preventDefault();\n},\n```\n\n## Practical Function Context Binding\n\
    \nThe onClick() function is a method belonging to a Menu object. But you're also\
    \ using it as an event handler. You need access to two different objects inside\
    \ the onClick() event handler:\n\n- The current Menu object so that you have access\
    \ to other properties and methods defined by the Menu class\n- The clicked element\
    \ so that you know which submenu to open\n\nYou learned in Chapter 11 that event\
    \ handlers execute in the context of the element handling the event. Under normal\
    \ circumstances, you could access the clicked element with this keyword:\n\n```javascript\n\
    this.links.addEventListener(\"click\", this.onClick);\nonClick : function(event)\
    \ {\n    // Open or close the submenu for this link\n    var clickedLink = this;\n\
    \    this.toggleLink(clickedLink);\n}\n```\n\n## Practical Function Context Binding\
    \ (continued)\n\nThis won't work, however, because toggleLink() is also a Menu\
    \ object method. Since the this keyword refers to the clicked element, you don't\
    \ have access to the toggleLink() method for the current Menu object. Fortunately,\
    \ MooTools provides a helper method for all functions to bind the context of a\
    \ function to an object:\n\n```javascript\nthis.links.add(\"click\", onClick.bind(this));\n\
    onClick : function(event) {\n  // Open or close the submenu for this link\n  var\
    \ clickedLink = ???;\n  this.toggleLink(clickedLink);\n}\n```\n\nNow you need\
    \ another way to access the clicked element, since you changed what the this keyword\
    \ referred to. In this case, the clicked element is also available as event.target.\n\
    \n```javascript\nonClick : function(event) {\n  // Open or close the submenu for\
    \ this link\n  var clickedLink = event.target;\n  this.toggleLink(clickedLink);\n\
    }\n```\n\nIf the link contained children, you might have had to walk up the DOM\
    \ tree to get to the link element because of event bubbling.\n\nIf you're used\
    \ to programming in a language with built-in classes, this context binding might\
    \ seem like an awkward step. In ActionScript 3, for instance, the this keyword\
    \ always refers to the current object and always has access to the object's properties\
    \ and methods. It's easier to change function context in JavaScript, so these\
    \ extra steps are necessary if you want to emulate classes and classical object-oriented\
    \ patterns.\n\n## Showing and Hiding Submenus\n\nThe behavior of this menu isn't\
    \ too complicated. When the user clicks a menu item, the following happens:\n\n\
    - If the item's submenu is closed, open it after closing any other open submenus.\n\
    - If the item's submenu is open, close it.\n\nAlso, when the user clicks anywhere\
    \ other than the menu, it should close any open submenus. That's why you're binding\
    \ a click event to the `<body>` element.\n\n```javascript\ntoggleLink : function(link)\
    \ {\n  if (link.retrieve(\"open\")) {\n    this.closeLink(link);\n  } else {\n\
    \    this.openLink(link);\n  }\n}\n```\n\nAn easy way to keep track of the status\
    \ of a link and its submenu is using MooTool's store() and retrieve() methods,\
    \ which allow you to store arbitrary data on an object. If the \"open\" data for\
    \ a link is true, call the closeLink() method. Otherwise, call the openLink()\
    \ method.\n\n```javascript\ncloseLink : function(link) {\n  var submenu = link.getParent().getElements(\"\
    ul\");\n  if (submenu.length) {\n    link.store(\"open\", false);\n    link.getParent().removeClass(\"\
    open\");\n    this.hideMenu(submenu);\n  }\n}\n```\n\n```javascript\nopenLink\
    \ : function(link) {\n  var submenu = link.getParent().getElements(\"ul\");\n\
    \  if (submenu.length) {\n    link.store(\"open\", true);\n    link.getParent().addClass(\"\
    open\");\n    this.showMenu(submenu);\n    this.closeOtherLinks(link);\n  }\n\
    },\n```\n\nThese two methods are nearly identical. They perform the following\
    \ tasks:\n\n- Find the appropriate submenu for the clicked link. Make sure the\
    \ submenu exists (the array returned by getElements() has a length greater than\
    \ 0).\n- Set the \"open\" data to true or false appropriately.\n- Add or remove\
    \ the \"open\" CSS class to the containing `<li>`.\n- Show or hide the submenu.\n\
    - For openLink() only, close any other open submenus.\n\nTo find the submenu for\
    \ a link, traverse up the DOM tree to its parent `<li>` element with getParent(),\
    \ and look for any `<ul>` elements inside it.\n\nTo show or hide a submenu, simply\
    \ set the display style of the `<ul>` to \"block\" or \"none\".\n\n```javascript\n\
    showMenu : function(submenu) {\n  submenu.setStyle(\"display\", \"block\");\n\
