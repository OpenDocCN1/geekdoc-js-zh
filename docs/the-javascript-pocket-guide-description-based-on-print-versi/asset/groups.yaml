    ```\n\n```javascript\n}\n// Example usage\nusefulNextSibling(heading);\n```\n\n\
    The statement `while (sibling= sibling.nextSibling)` reassigns the value of sibling\
    \ to its nextSibling until it runs out of elements and the loop stops. The if\
    \ statement checks whether the sibling is a text node (nodeType === 3) and that\
    \ contains characters other than tabs, newlines, and spaces using a regular expression.\n\
    \nMany libraries include useful tree-walking functions to make programmers' lives\
