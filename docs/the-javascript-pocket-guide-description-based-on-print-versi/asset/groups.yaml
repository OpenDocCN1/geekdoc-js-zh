- md: "\n# The Browser Problem\n\nProgramming in pure JavaScript is relatively straightforward,\
    \ but once you add the myriad of browsers available to the equation, everything\
    \ gets significantly more complicated.\n\nBrandon Eich developed JavaScript for\
    \ Netscape 2.0 in the midst of the \"browser wars\" of the late 1990s. To keep\
    \ up, Microsoft made its own version of JavaScript that it called JScript. It\
    \ wasn't an exact copy of the original implementation, and many of the original\
    \ differences persist today.\n\nIn addition, the Web and its technologies continue\
    \ to evolve at a rapid pace. Browser makers have the daunting task of innovating\
    \ their products and keeping up with each other, all while maintaining backward\
    \ compatibility with the billions of Web sites that exist on the Internet.\n\n\
    Fortunately, groups such as the W3C, WHATWG, and ECMA have made great strides\
    \ in codifying and standardizing JavaScript and browser APIs. Their efforts allow\
    \ developers to more easily \"write once, run anywhere\" and trust that their\
    \ code will continue to work as the Web evolves. Most modern browsers, such as\
    \ Firefox, Safari, Opera, and Chrome, follow Web standards very closely. Internet\
    \ Explorer still lags behind in standards support and is often a thorn in every\
    \ developer's side.\n\nJavaScript developers tackle browser differences with libraries\
    \ of code that help provide consistent APIs across all browsers. You'll learn\
    \ about libraries soon, but the next few chapters focus on pure JavaScript objects,\
    \ properties, and functions.\n\n# What Does API Mean?\n\nAPI stands for application\
    \ programming interface, which is a somewhat-generic term for whatever tools you\
    \ use to programmatically interact with a piece of software. Browser APIs are\
    \ mostly functions and properties that give you access to browser windows, elements\
    \ in HTML documents, and even certain parts of the user's computer.\n\n# Progressive\
    \ Enhancement\n\nWeb development is an interesting and challenging field because\
    \ you can't reliably know how the user will end up viewing your code.\n\nUsually,\
    \ the ideal end user is someone using a modern browser on a fast computer with\
    \ a high-speed internet connection. This may describe the majority of Web surfers,\
    \ but dozens of factors affect how any given person might see your code:\n\n-\
    \ Some people can't or won't upgrade from an older browser.\n- Some people have\
    \ slower computers with smaller screens.\n- Some people surf the Web on mobile\
    \ devices with tiny screens and no mice.\n- Some people don't have fine motor\
    \ control, so computer mice aren't a viable option.\n- Some people are visually\
    \ impaired and use screen reader software to operate computers using aural cues.\n\
    - Some people lock down their browsers out of a concern for privacy, so JavaScript\
    \ and cookies aren't available.\n\nCreating interesting, engaging, and useful\
    \ Web pages that anyone can use is a daunting challenge, but it is possible. The\
    \ most prevalent strategy is commonly known as progressive enhancement.\n\nI like\
    \ to think of Web development as layers upon layers (Figure 10.1). HTML is your\
    \ most basic, fundamental layer. A well-organized HTML page should be accessible\
    \ to any user because it is just plain text decorated with a bit of meaning (or\
    \ semantics) using HTML tags.\n\n**Figure 8.1**\nThe layers of Web development.\n\
    \n![](img/4a8fa16ebbe3c330347de80256b877b4_140_0.png)\n\nCSS is your second layer,\
    \ which determines presentation and layout. Some users, especially the visually\
    \ impaired, won't get this layer.\n\nJavaScript is your third layer, which adds\
    \ behavior and interactivity. The number of users without JavaScript is dwindling,\
    \ but they still exist.\n\nImages, plug-ins such as Flash and Silverlight, video,\
    \ and audio are examples of additional layers of Web content.\n\nBecause it's\
    \ inherently the most accessible, the fundamental HTML layer should be the only\
    \ layer required to use your Web pages. Each layer above that should progressively\
    \ enhance the content below it, making the experience more attractive, more efficient,\
    \ and more engaging. If a layer isn't available to a user, the core content of\
    \ the page should still be just as accessible.\n\nOne of your most important \"\
    users\" isn't a person at all. Search engine robots are like blind, deaf, keyboard-reliant\
    \ users who browse the Web with images and JavaScript turned off. Search engine\
    \ optimization (SEO) and progressive enhancement often go hand in hand.\n\nProgressive\
    \ enhancement and accessibility are incredibly important topics that unfortunately\
    \ are a bit beyond the scope of this book. Still, I'll show how I include progressive\
    \ enhancement techniques in my examples starting in Chapter 14 of the book.\n\n\
    # Handling Non-JavaScript Situations\n\nIf a user comes to your page without JavaScript,\
    \ you can use two different techniques to make your content still accessible.\
    \ Keep in mind that your HTML and CSS foundation must be well organized for these\
    \ techniques to be of any use.\n\n# The <noscript> Tag\n\nBrowsers only show the\
    \ content inside the <noscript> tags when JavaScript is unavailable. I don't find\
    \ this to be terribly useful; it's often used to display a message notifying the\
    \ user of the missing JavaScript behaviors.\n\n```\n<noscript>\n  <p>This page\
    \ requires JavaScript.</p>\n</noscript>\n```\n\n# Chapter 8: Client-Side Scripting\n\
    \nRequiring JavaScript goes against the principles of progressive enhancement,\
    \ so I avoid code like this whenever I can.\n\n### JavaScript-Specific CSS Classes\n\
    \nI use the following technique a lot so that I can write CSS for situations with\
    \ and without JavaScript by replacing the no-js class with the js class. Start\
    \ by including a no-js class in your markup, as shown here:\n\n```\n<html class=\"\
    no-js\">\n```\n\nThen include a <script> tag that immediately replaces that class\
    \ with a js class.\n\n```javascript\n<script type=\"text/javascript\">\n  document.documentElement.className\
    \ = document.documentElement.className.replace(/\\bno-js\\b/, \"js\");\n</script>\n\
    ```\n\nI like this technique enough, in fact, that I prefer a shorter version,\
    \ as shown here:\n\n```javascript\n(function(d, c) {\n  d[c] = d[c].replace(/\\\
    bno-js\\b/, \"js\");\n})(document.documentElement, \"className\");\n```\n\nBy\
    \ passing the repetitive parts of that line of code as arguments of a self-invoking\
    \ function, I can reference them as single-character variable names (document.documentElement\
    \ becomes d, and \"className\" becomes c).\n\nThis is one of the rare times I\
    \ want to include a <script> tag earlier in the page, such as in the <head> element.\
    \ Replacing the no-js class as quickly as possible reduces any flashes of content\
