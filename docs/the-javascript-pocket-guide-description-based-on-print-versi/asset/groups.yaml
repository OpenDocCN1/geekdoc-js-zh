    \n# sort([func])\n\nBy default, the sort() method reorders the values in the array\
    \ alphabetically, with lowercase letters being higher than uppercase. With numbers,\
    \ this is not the expected behavior:\n\n```\n[222, 3, 11].sort();\n[11, 222, 3]\n\
    ```\n\nFortunately, you can pass a function as an argument that sorts the array\
    \ however you like.\n\n```\nfunction numericalSort(a, b) {\n  return a - b;\n\
    }\n[222, 3, 11].sort(numericalSort);\n[3, 11, 222]\n```\n\nThe sorting function\
    \ must return the following:\n\n+   - A number greater than zero if a is greater\
    \ than b\n- A number less than zero if a is less than b\n- Zero if a equals b\n\
