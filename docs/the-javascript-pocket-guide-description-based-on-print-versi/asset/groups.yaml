    # Coordinates on the Screen


    Most people are used to coordinate systems that start in the bottom right. The
    X value moves the left as it gets bigger, and the Y value moves up as it gets
    bigger. On computer screens, the Y value gets flipped (**Figure 9.1**).


    **Figure 9.1**

    The screen coordinate system.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_146_0.png)


    # Global Functions


    Advertisers and spammers have abused some of these methods, especially window.open(),
    which they use to create pop-up and pop-under windows. Use discretion when manipulating
    browser windows to avoid obnoxious and intrusive behavior.


    # Dialog Boxes


    Dialog boxes allow for rudimentary user interaction. I don''t like using them
    unless I really need to demand the user''s attention. They are *modal*, which
    means the user must dismiss the dialog box before being allowed to interact with
    the rest of the browser again.'
  - '[PAGE 147]


    +   - alert(message) Show a dialog with the message and an OK button. alert()
    is useful for debugging in browsers such as Internet Explorer 6 that don''t have
    console.log(). Objects passed to alert() are coerced into a string via the toString()
    method, which often only returns "[object Object]", so it''s not nearly as useful
    as a real console.


    +   - confirm(message) Shows a dialog box that includes Cancel and OK buttons.
    The method returns true or false based on whether the user clicked OK or Cancel,
    respectively. Be very careful when using this method because it''s often difficult
    to write questions that can really be answered by Cancel or OK.


    +   - prompt(message, defaultResponse) Shows a dialog box that includes a text
    field for the user to enter a response string. The field is prepopulated with
    defaultResponse if provided.


    # Manipulating Browser Windows


    You have some control over browser windows, but again, try not to annoy or frustrate
    your users with these methods.


    +   - open(url, name, features) Opens the page located at url in a new window,
    or if a window with the name already exists, the url opens in that window. It
    returns a reference to the opened window that you can control programmatically.


    The features argument is an optional string specifying what browser features the
    new window should have. It is a comma-separated list of "feature=value" pairs.
    Most values are "yes" or "no" except for height and width, which expect pixel
    values.


    Some browsers like Firefox ignore "no" values on the location bar to make it harder
    to pretend to be a secure site like a banking website.'
