    Hexadecimal character codes look like %20 (which represents a space) or %u20AC
    (which represents €).


    The unescape() function performs the reverse operation.


    # encodeURI(string), decodeURI(string)


    The encodeURI() method is similar to escape(), but it''s specifically meant for
    encoding Web addresses. It converts all characters to hexadecimal character codes
    except letters, digits, and the following characters:


    +   - @ * + - . / ! ~ ^ ( ) ; / ? : & = , #


    This function assumes you''re encoding a full URL.


    The decodeURI() function performs the reverse operation.


    # encodeURIComponent(string), decodeURIComponent(string)


    The encodeURIComponent() function is the most useful of these global string functions.
    It converts all characters to hexadecimal character codes except letters, digits,
    and the following characters:


    +   - _ . ! * ~ ()


    This function encodes characters that separate different components of a URL,
    so you can safely encode a string for use as a single component. This is most
    commonly used for encoding a string for use as a query string value. You can even
    encode a URL as a query string parameter.


    ```

    var value = "http://www.other.com/?param=1&param2=2";

    var encodedValue = encodeURIComponent(value);

    "http://www.example.com/redirect?url=" + encodedValue;

    http://example.com/redirect?url

    ```'
