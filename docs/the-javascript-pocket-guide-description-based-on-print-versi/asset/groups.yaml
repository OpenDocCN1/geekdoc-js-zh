    \n## 基础\n\n创建对象的最佳方法是使用对象字量符。\n\n```javascript\nvar myObject = {};\n```\n\n你可以通过在对象字量符中列出属性创建一个带有属性的对象，用冒号分隔属性名和值：\n\
    \n```javascript\nvar myObject = {\n  propertyName : \"most names are valid identifiers\"\
    ,\n  \"arbitrary strings\" : \"can be property names too\",\n  42 : \"property\
    \ names can be numbers\"\n};\n```\n\n> 注意每个属性值对之间是用逗号分隔的，但确保不要在最后一对之后放置逗号。大多数浏览器会忽略它，但\
    \ Internet Explorer 会抛出一个难以发现的错误。\n\n属性可以是任何值，包括对象和函数。\n\n你可以通过两种方式通过其名称访问属性值：使用点运算符\
    \ (.) 或方括号运算符 ([{}])。这两个表达式是相同的：\n\n```javascript\nmyObject.property1 = 42;\n\
    myObject[\"property1\"] = 42;\n```\n\n要使用点运算符，属性名必须是有效的标识符。方括号运算符接收一个表达式并使用其值作为属性名。以下将不起作用，因为在这种情况下\
    \ `property1` 是一个未定义的变量：\n\n```javascript\nmyObject[property1] = 42;\n```\n\n\
    但如果你声明了 `property1`，它就能工作：\n\n```javascript\nvar property1 = \"property1\";\n\
    myObject[property1] = 42;\n```\n\n方括号运算符非常灵活。通过它，你可以使用变量或表达式访问属性：\n\n```javascript\n\
    var obj = {\n  name: \"John\"\n};\nconsole.log(obj[\"name\"]);\n```\n\n## 遍历属性\n\
    \n大多数 JavaScript 程序员更喜欢使用点运算符，因为它更短。除非你需要使用变量的灵活性，否则请使用方括号运算符。\n\n```javascript\n\
    var myObject = {\n  property1: 42,\n  property2: \"string value\",\n  property3:\
    \ true\n};\n\nfor (var propertyName in myObject) {\n  console.log(propertyName\
    \ + \": \" + myObject[propertyName]);\n}\n```\n\n你可以使用 `for/in` 语句遍历任何对象，包括数组。\n\
    \n```javascript\nvar myArray = [\"a\", \"b\", \"c\"];\nfor (var i in myArray)\
    \ {\n  console.log(myArray[i]);\n}\n```\n\n## 可枚举属性\n\n记住，所有的数组方法（如 `push()` 和\
    \ `slice()`）也是数组的属性。但在遍历 `myArray` 时，它们不会出现。这是因为它们不是可枚举的。所有对象都有一个便利函数 `propertyIsEnumerable()`\
    \ 来检查这一点：\n\n```javascript\nvar myArray = [1,2,3];\nmyArray.propertyIsEnumerable(0);\
    \ // true\nmyArray.propertyIsEnumerable(\"push\"); // false\n```\n\n我在代码中从未有过使用\
    \ `propertyIsEnumerable()` 的理由，但它有助于解释为什么要使用 `hasOwnProperty()`。通过原型（我将在本章稍后的“原型”部分解释），你可以同时向所有对象添加属性。\n\
    \n```javascript\nObject.prototype.someRandomProperty = 42;\n{}.someRandomProperty;\
    \ // 42\n[].someRandomProperty; // 42\n\"\".someRandomProperty; // 42\n```\n\n\
    当你向对象或对象的原型添加属性时，它是总是可枚举的。这与 `push()` 或 `toString()` 等内置属性不同。你添加的属性将出现在每一个 `for/in`\
    \ 循环中。\n\n```javascript\nObject.prototype.someRandomProperty = 42;\nvar myArray\
    \ = [1,2,3];\nfor (var propertyName in myArray) {\n  console.log(myArray[propertyName]);\n\
    }\n// 1, 2, 3, 42\n```\n\n为了防止意外遍历这些属性，始终使用 `hasOwnProperty()` 方法测试属性是否仅属于该对象。\n\
    \n```javascript\nfor (var propertyName in myArray) {\n  // 这过滤掉了 someRandomProperty\n\
    \  if (myArray.hasOwnProperty(propertyName)) {\n    console.log(myArray[propertyName]);\n\
    \  }\n}\n```\n\n"
