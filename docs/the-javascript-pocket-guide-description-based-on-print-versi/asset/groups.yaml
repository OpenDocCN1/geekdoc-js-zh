  - "[PAGE 74]\n\n# Looping Over Arrays\n\n```\nmyArray = [\"a\", \"b\", \"c\\];\n\
    // Same as myArray[3] = \"d\"\nmyArray[myArray.length] = \"d\";\n```\n\nLooping\
    \ over arrays is one of the most common tasks in JavaScript, and there are dozens\
