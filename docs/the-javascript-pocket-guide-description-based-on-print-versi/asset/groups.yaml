    myPara.innerHTML = ''Click <a href="#">here</a>'';

    ```


    Regardless of the former contents of myPara, it now looks like the following because
    innerHTML completely overwrites the element''s content:


    ```

    <p id="myPara">Click <a href="#">here</a></p>

    ```


    You can now retrieve the newly created <a> tag like so:


    ```

