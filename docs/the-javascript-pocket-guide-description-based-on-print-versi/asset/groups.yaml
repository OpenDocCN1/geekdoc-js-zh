- md: "\nIt's tempting to skip using hasOwnProperty(), especially if you are careful\
    \ not to add properties to any built-in prototypes. But keep in mind that any\
    \ script in the page can alter built-in objects. It's not just your code that\
    \ you have to be careful of.\n\n## Deleting Properties\n\nYou can remove properties\
    \ from an object by using the delete operator. The property will no longer show\
    \ up in a for/in loop. The delete operator returns true only if it could successfully\
    \ delete the property.\n\n```\nvar myObject = {\n  property1 : 42,\n  property2\
    \ : 108\n};\n\nfor (var propertyName in myObject) {\n  console.log(propertyName,\
    \ myObject[propertyName]);\n}\nproperty1 42\nproperty2 108\n\n// This deletes\
    \ the property completely\ndelete myObject.property1;\ntrue\n\nmyObject.property1;\n\
    undefined\n\n// This just changes the value of the property\n// instead of removing\
    \ it\nmyObject.property2 = null;\n\nfor (var propertyName in myObject) {\nconsole.log(propertyName,\
    \ myObject[propertyName]);\n}\nproperty2 null\n```\n\n## Constructor Functions\n\
    \nAll data types, even primitives such as Number and String, have constructor\
    \ functions. They are rarely used because literals are faster and easier.\n\n\
    ```\nnew Number(5);\n5\nnew String(\"hello\");\n\"hello\"\nnew Boolean();\ntrue\n\
    ```\n\nYou also don't want to use them because checking the data type gets confusing.\n\
    \n```\ntypeof new Number(5);\n\"object\"\ntypeof new Number(5).valueOf();\n\"\
    number\"\n```\n\nI only point this out because you can create your own data types\
    \ with constructor functions, which are normal functions called right after the\
    \ new keyword.\n\n```\nvar MyDataType = function() {\n};\nvar myData = new MyDataType();\n\
    ```\n\nConstructor functions are one of the rare places where it's customary start\
    \ the name with a capital letter. It tells you that it's meant to be used with\
    \ the new keyword.\n\nInside the constructor function, you can use the this keyword\
    \ to add properties to new *instances* of the data type. This is a great way to\
    \ create reusable pieces of code.\n\n```\nvar Jedi = function(name) {\n  this.name\
    \ = name;\n  this.theForce = \"strong\";\n}\n\nvar obiwan = new Jedi(\"Obi Wan\"\
    );\nvar yoda = new Jedi(\"Yoda\");\n\nyoda.name;\nYoda.theForce;\n\"strong\"\n\
    obiwan.theForce;\n\"strong\"\n```\n\n## Prototypes\n\nAll arrays have the same\
    \ methods, like push(), slice(), and join().\nAll strings have split(), substr(),\
    \ and replace(). And every object has the toString() method. Where do these methods\
    \ come from?\n\nIt turns out that every data type has a prototype object that\
    \ defines a set of properties. Each instance of a data type has access to the\
    \ prototype of its type's prototype.\n\nYou can find the prototype object for\
    \ a type by accessing the prototype property on its constructor function, like\
    \ this:\n\n```\nNumber.prototype;\nString.prototype;\nArray.prototype;\nObject.prototype;\n\
    ```\n\nWhen you access a property of an object, JavaScript follows these steps\
    \ to find the value of that property:\n\n- 1. First, it looks for the property\
    \ on the object. When you add the property directly to the object, JavaScript\
    \ finds the value here.\n```\nvar myArray = [1,2,3];\nmyArray[0];\n1\n```\n- 2.\
    \ If the property doesn't exist on the object, JavaScript looks at the prototype\
    \ of the object's constructor.\n```\nmyArray.push;\npush()\nArray.prototype.push;\n\
    push()\nmyArray.push === Array.prototype.push;\ntrue\n```\n- 3. You can tell that\
    \ push() exists on Array.prototype and not on myArray with the hasOwnProperty()\
    \ method.\n```\nmyArray.hasOwnProperty(\"push\");\nfalse\n```\n- 4. Finally, if\
    \ the property can't be found on the object or the prototype of the object's constructor,\
    \ JavaScript determines that it doesn't exist. If you try to call it as a method,\
    \ you'll get an error.\n\n```\ntypeof myArray.missingProperty;\n\"undefined\"\n\
    ```\n\n```\nmyArray.missingProperty();\nTypeError: myArray.missingProperty is\
    \ not a function\n```\n\n## Changing Built-in Prototypes\n\nYou can add, change,\
    \ and remove properties from the prototypes of built-in types. I'll get to why\
    \ this can be a bad idea in a moment, but first I'll show some examples.\n\nIn\
    \ Chapter 4, you learned how to trim spaces off the beginnings and endings of\
    \ a string. That function works like this:\n\n```\nstringTrim(\" \");\n\"hello\"\
    \n```\n\nYou can turn that function into a method for every string by adding it\
    \ to String.prototype.\n\n```\nString.prototype.trim = function() {\n// Since\
    \ this is a method, the context is the string\n// that you can access with the\
    \ \"this\" keyword\nreturn this.replace(/^(\\s|\\u00A0)+|(\\s|\\u00A0)+$/g, \"\
    \");\n}\n\" hello \" .trim();\n\"hello\"\n\" this string also has the trim method\
    \ \" .trim();\n\"this string also has the trim method\"\n```\n\nIn my opinion,\
    \ this is often a much more pleasant way to organize code. It is sometimes referred\
    \ to as an object-oriented style of programming, because you act upon objects\
    \ with methods. (The stringTrim() style is functional programming because you're\
    \ passing values to functions.)\n\n## Adding Modern JavaScript to Older Browsers\n\
    \nFunctions such as string.trim() are part of the ECMAScript specification, but\
    \ they aren't supported in most browsers yet. Adding them to the built-in prototypes\
    \ yourself is a good way to take advantage of new additions to the language. However,\
    \ you should check to see whether the browser supports a function before adding\
    \ it because the built-in version is always faster.\n\n```\nif (! String.prototype.trim)\
