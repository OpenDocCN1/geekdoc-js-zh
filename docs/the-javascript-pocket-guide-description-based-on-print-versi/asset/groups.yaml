  - "[PAGE 196]\n\n```\nfunction whatNode(event) {\n  console.log(this.nodeName);\n\
    \  event.preventDefault();\n}\n```\n\nWhen you click the link, the console shows\
    \ this:\n\nDIV\nBODY\n#document\n\nIf you just click the <div> element, the event\
    \ handlers for the <a> and <p> elements won't execute:\n\nDIV\nBODY\n#document\n\
    \nThe Event object *bubbles* from the target element through each element in the\
    \ DOM tree all the way up to the document. If you add an event handler to an element,\
    \ any child element can cause that handler to execute.\n\nThis is important enough\
    \ to repeat: Events firing on the children of an element cause the element's event\
    \ handlers to execute. Because the document object is an ancestor of all elements\
    \ in the page, its event handlers always execute regardless of where the event\
    \ originated.\n\n# Capturing\n\nThe bubbling phase is actually the last phase\
    \ of an Event object's life cycle. All events originate on the document and travel\
    \ down the DOM tree to the target element. This is called the *capture* phase."
  - "[PAGE 197]\n\nTo add an event handler to the capture phase of an event, change\
    \ the third argument in addEventListener() to true. Add these lines to the HTML\
    \ document you created to test bubbling:\n\n```\ndocument.addEventListener(\"\
    click\", whatNode, true);\ndocument.body.addEventListener(\"click\", whatNode,\
    \ true);\ndiv.addEventListener(\"click\", whatNode, true);\np.addEventListener(\"\
    click\", whatNode, true);\na.addEventListener(\"click\", whatNode, true);\n```\n\
    \nAlso, change the whatNode() function to this:\n\n```\nfunction whatNode(event)\
    \ {\n  console.log(this.nodeName, \"phase: \" + event.eventPhase);\n  event.preventDefault();\n\
    }\n```\n\nNow when you click the link, the console shows this:\n\n```\n#document\
    \ phase: 1\nBODY phase: 1\nDIV phase: 1\nP phase: 1\nA phase: 2\nA phase: 2\n\
    P phase: 3\nDIV phase: 3\nBODY phase: 3\n#document phase: 3\n```\n\nAs the event\
    \ travels from the document to the target element, it's in the capture phase,\
    \ represented by the 1. At the target element, the event is in the second \"at\
    \ target\" phase. The last phase is the bubbling phase, which you've seen before."
  - "[PAGE 198]\n\n# Stop Propagation\n\nYou can stop an element from continuing to\
    \ capture or bubble by calling stopPropagation() on the Event object. Change the\
    \ whatNode() function to demonstrate this.\n\n```\nfunction whatNode(event) {\n\
    \  if (this.nodeName === \"DIV\") {\n    event.stopPropagation();\n  }\n  console.log(this.nodeName,\
    \ \"phase: \" + event.eventPhase);\n  event.preventDefault();\n}\n```\n\nClicking\
    \ the link now results in this:\n\n```\n#document phase: 1\nBODY phase: 1\nDIV\
    \ phase: 1\n```\n\nWith this event handler, the event stops propagating down the\
    \ DOM tree once it reaches the <div> element during the capture phase.\n\n# Event\
    \ Delegation\n\nUnderstanding bubbling and capturing is mostly important for knowing\
    \ how child elements affect the event handlers of their parents. It also has a\
    \ practical use with a technique called event delegation.\n\nSay you have a page\
    \ with 100 links and want to do something special when the user clicks any of\
    \ them. You could loop through all the links and attach event handlers to each\
    \ of them.\n\n```\nvar allLinks = document.getElementsByTagName(\"a\");\nvar i\
    \ = allLinks.length;\n```"
  - "[PAGE 199]\n\n```\nwhile (i--) {\n  allLinks[i].addEventListener(\"click\", somethingSpecial,\n\
    \  => false);\n}\n```\n\n```\nfunction somethingSpecial(event) {\n  alert(this.href);\n\
    \  event.preventDefault();\n}\n```\n\nBut what if you later add links to the page,\
    \ maybe with an Ajax call?\nYou'll have to add the event handler to that link\
    \ too, probably by repeating the line of code for addEventListener().\n\nA more\
    \ elegant solution involves adding a single event handler to the document and\
    \ acting it based on the target element of the event.\n\n```\n// Add one event\
    \ handler to the capture phase\ndocument.addEventListener(\"click\", delegatedSomethingSpecial,\n\
    => true);\n```\n\n```\nfunction delegatedSomethingSpecial(event) {\n  if (event.target.nodeName\
    \ === \"A\") {\n    alert(event.target.href);\n    event.preventDefault();\n}\n\
    ```\n\nThis new event handler doesn't do anything unless the element that originated\
    \ the event is a link. You can add dozens more links to the page, and this handler\
    \ will work for all of them. It's also slightly faster because you're using the\
    \ capture phase of the event. That way, the event doesn't travel through all phases\
    \ of the event life cycle before executing."
  - '[PAGE 200]


    # Event Examples


    Adding/removing event handlers is the same regardless of the type of event. Handling
    events, however, differs depending on the event type. Here are examples of common
    event types.


    # Browser Events


    These events are triggered by the browser, not by the user. They''re very important
    but not entirely all that interesting.


    # load


    Most scripts need to wait until the page finishes loading before executing. The
    simplest way to do this is by adding an event handler on the window object. You
    usually want to add the event handler as soon as possible, maybe even before any
    third-party code loads. In that case, use the onload attribute, but make sure
    not to override any event handlers already added to the page. See the addonloadHandler()
    function discussed earlier in the chapter for an example.


    You can also add load event handlers to <img> elements. Unfortunately, you can''t
    rely on them because Internet Explorer may not fire the event if the image is
    cached on the user''s computer.


    # unload


    The unload event fires right before the browser unloads the page, usually to travel
    to another page. If your page is a complex Web application like Google Docs, you
    may want to save recent changes to the server with Ajax before the user loads
    a new page.'
  - "[PAGE 201]\n\n# The JavaScript Pocket Guide\n\n# beforeunload\n\nThe beforeunload\
    \ event is a special event that is also useful for complex Web applications. It\
    \ allows you to warn the user that they're about to leave the page. The event\
    \ handler can return a message for a confirmation dialog to inform the user of\
    \ the consequences of leaving the page.\n\n```\nwindow.onbeforeunload = function()\
    \ {\n  return \"Leaving the page will lose all your work!\";\n}\n```\n\nThe entire\
    \ dialog will say, \"Are you sure you want to navigate away from this page? Leaving\
    \ the page will lose all your work! Press OK to continue, or Cancel to stay on\
    \ the current page.\n\n# resize\n\nThe resize event is useful for redrawing a\
    \ complex layout based on the size of the window.\n\n```\nwindow.onresize = function()\
    \ {\n  var div = document.getElementById(\"centeredBox\");\n  var windowHeight\
    \ = window.innerHeight || document.documentElement.clientHeight;\n  div.style.top\
    \ = windowHeight / 2 - div.offsetHeight / 2 + \"px\";\n}\n\nwindow.onload = function()\
    \ {\n  window.onresize();\n}\n```\n\nThis example centers a <div> element vertically\
    \ in the browser, which isn't possible with just CSS. It calls the resize() method\
    \ as soon as possible to force the browser to position the <div> when the page\
    \ loads."
- md: "\n# DOMContentLoaded\n\nThe DOMContentLoaded event is relatively new and poorly\
    \ supported across browsers, especially Internet Explorer and nearly all browsers\
    \ released before 2009. But it's important enough that nearly all JavaScript libraries\
    \ emulate it as best as possible.\n\nThe load event waits until all the resources\
    \ in the page finish loading before. Images, style sheets, and scripts can delay\
    \ the load event. The DOMContentLoaded event fires as soon as all DOM elements\
    \ in the page are available. This lets you manipulate elements in the page as\
    \ soon as possible.\n\n```\ndocument.addEventListener(\"DOMContentLoaded\", function()\
    \ {\n  // All DOM elements are now available, but the browser\n  // might still\
    \ be loading images and other files\n}, false);\n```\n\nIf you don't include your\
    \ <script> tags at the bottom of the HTML markup, you'll need to use the DOMContentLoaded\
    \ event to make sure your DOM elements exist before using them in JavaScript.\n\
    \n# Mouse Events\n\nJavaScript lets you take advantage of the versatility of the\
    \ mouse in many ways. Mouse events provide useful information about the event,\
    \ including where it took place and whether the user was holding down any keys\
    \ during the event.\n\n- **clientX, clientY**: The mouse position compared to\
    \ the top-left corner of the viewport (window).\n- **pageX, pageY**: The mouse\
    \ position compared to the top-left corner of the page, which may be scrolled\
    \ out of view.\n- **screenX, screenY**: The mouse position compared to the top-left\
    \ corner of the computer screen.\n\n# The JavaScript Pocket Guide\n\n- **offsetX,\
    \ offsetY**: The mouse position compared to the top-left corner of the element\
    \ on which the event occurred.\n- **altKey, ctrlKey, metaKey, shiftKey**: Evaluates\
    \ to true if, respectively, the Alt, Ctrl, meta, or Shift key is went down during\
    \ the event. The meta key is the Cmd key on Mac OS, so Internet Explorer doesn't\
    \ support it (being Windows-only).\n- **button**: Indicates the button used, so\
    \ it works only on events that involve mouse buttons. The left button is 0, the\
    \ middle button is 1, and the right button is 2.\n- **detail**: For mouse button\
    \ events, the number of times the user clicked the mouse quickly enough together.\
    \ For mouse wheel events, the distance the wheel has spun.\n- **relatedTarget**:\
    \ For mouseover events, the elements that the mouse just left. For mouseout events,\
    \ the element that the mouse just entered.\n\n# click\n\nThe click event is the\
    \ most important because it's not strictly a mouse event (which is why it doesn't\
    \ have mouse in the name like most other events shown next). The keyboard can\
    \ also trigger click events by hitting Enter/Return on a focused element. This\
    \ event fires after mouse-down and mouseup.\n\n<a href=\"#\" id=\"myLink\">Click\
    \ or hit enter on this element</a>\n\n```\nvar link = document.getElementById(\"\
    myLink\");\nlink.onclick = function(event) {\n  alert(\"clicked!\");\n};\n```\n\
    \nTry tabbing to the link and hitting Enter/Return to see if you can fire the\
    \ click event with the keyboard. It's a lot easier to use click than attach-ing\
    \ events on both mouseup and keyup.\n\n# mousedown, mouseup\n\nThe mousedown event\
    \ is the first event to fire when the user clicks a mouse button.\n\nThe mouseup\
    \ event fires when the user releases the mouse button, right before the click\
    \ event fires.\n\n# dblclick\n\nThe dblclick method fires after any other mouse\
    \ button events. It's very difficult to distinguish between single clicks and\
    \ double clicks. The detail property, which isn't available in older versions\
    \ of Internet Explorer, gives you a count of the number of clicks.\n\n<a href=\"\
    #\" id=\"myLink\">Click this twice</a>\n\n```\nvar link = document.getElementById(\"\
    myLink\");\nlink.onclick = function(event) {\n  // Prevent the default behavior\
    \ or you won't have\n  // time to click again and fire the dblclick event\n  return\
    \ false;\n}\nnlink.ondblclick = function(event) {\n  alert(\"double clicked!\"\
    );\n};\n```\n\n# mouseover, mouseout\n\nWhen the mouse enters an element, the\
    \ mouseover event fires. When the mouse leaves, the mouseout event fires. These\
    \ events are actually tricky to use because of event bubbling. Create an HTML\
    \ document with this CSS and markup:\n\n```css\ndiv {\n  width: 50px;\n  height:\
    \ 50px;\n}\n#parent {\n  padding: 20px;\n  background: #999;\n}\n#child {\n  background:\
    \ #fff;\n}\n```\n\n```html\n<div id=\"parent\">\n  <div id=\"child\">\n  </div>\n\
    </div>\n```\n\nNow add a <script> block that adds mouseover and mouseout event\
    \ handlers to the parent element:\n\n```javascript\nvar parent = document.getElementById(\"\
    parent\");\nparent.onmouseover = function(event) {\n  console.log(\"mouseover\
    \ event occurred\");\n};\n```\n\n```javascript\nparent.onmouseout = function(event)\
    \ {\n  console.log(\"mouseout event occurred\");\n};\n```\n\nWhen the mouse enters\
    \ the gray parent <div>, the mouse event fires. But if the mouse continues into\
    \ the white child <div>, the mouse and mouseover events fire again. If you only\
    \ wanted to know when the mouse enters and leaves the parent <div>, these extra\
    \ events can be problematic.\n\n# mouseenter, mouseleave\n\nOnly available in\
    \ Internet Explorer\n\nInternet Explorer provides two events that fix the mouseover/mouseout\
    \ problem. The mouseenter and mouseleave events are the same as mouseover, except\
    \ that they don't bubble.\n\n```javascript\nparent.onmouseenter = function(event)\
    \ {\n  console.log(\"mouseenter event occurred\");\n};\n\nparent.onmouseleave\
    \ = function(event) {\n  console.log(\"mouseleave event occurred\");\n};\n```\n\
    \nWhen the mouse enters the gray parent <div>, the mouse event fires. But if the\
    \ mouse continues into the white child <div>, the mouse and mouseover events fire\
    \ again. If you only wanted to know when the mouse enters and leaves the parent\
    \ <div>, these extra events can be problematic.\n\n# Keyboard Events\n\nKeyboard\
    \ events have two properties related to which key: keyCode and charCode. Unfortunately,\
    \ these properties work differently depending on the browser.\n\n# keydown\n\n\
    The keydown event occurs when the user presses a key. Nearly any key on the keyboard\
    \ can fire this event.\n\n# keypress\n\nThe keypress event occurs only when the\
    \ user presses a key that normally prints a character. Keys like Enter/Return\
    \ and Shift do not fire this event.\n\n# keyup\n\nThe keyup event occurs when\
    \ the user releases the key as the last event after keydown and keypress.\n\n\
    To demonstrate how confusing the events can be, here's an example script you can\
    \ run on any browser:\n\n```html\n<input type=\"text\" name=\"textInput\" value=\"\
    \" id=\"textInput\" />\nvar input = document.getElementById(\"textInput\");\n\n\
    function keyReport(event) {\n    event = event || window.event;\n\n    var keyCode\
    \ = event.keyCode;\n    var keyCharacter = String.fromCharCode(keyCode);\n   \
    \ var charCode = event.charCode;\n    var charCharacter = String.fromCharCode(charCode);\n\
    \n    var report = [\n        \"Event: \" + event.type,\n        \"Key: \" + keyCode\
    \ + \", \" + keyCharacter,\n        \"Char: \" + charCode + \", \" + charCharacter\n\
    \    ].join(\"\\n\");\n\n    alert(report);\n}\n\ninput.onkeydown = keyReport;\n\
    input.onkeypress = keyReport;\n```\n\nThe browser will show two alert dialogs\
    \ when you press any key while typing in the text input. Here's what Firefox shows\
    \ when you press the A key:\n\nEvent: keydown\nKey: 65, A\nChar: o,\n\nEvent:\
    \ keypress\nKey: o,\nChar: 97, a\n\nIn this case, the keyCode attribute works\
    \ only for the keydown and keyup events. The value represents the key pressed,\
    \ not the letter pressed, so it gives you an uppercase A.\n\nFurthermore, the\
    \ charCode attribute works only for the keypress event. The value represents the\
    \ letter pressed, so it gives you a lowercase a.\n\nBy contrast, the same action\
    \ in Internet Explorer 8 results in these alert messages:\n\nEvent: keydown\n\
    Key: 65, A\nChar: undefined,\n\nEvent: keydown\nKey: 97, a\nChar: undefined,\n\
    \n# Form Element Events\n\nAll of the previous events work on form elements such\
    \ as <input> and <select>, but forms also have a few special events.\n"
  mdcn: "\n\n# DOMContentLoaded\n\nDOMContentLoaded 事件相对较新，在各个浏览器中的支持程度较差，特别是 Internet\
    \ Explorer 以及几乎在 2009 年之前发布的所有浏览器。但它足够重要，因此几乎所有的 JavaScript 库都会尽可能地模拟它。\n\nload\
    \ 事件会等待页面中所有资源完成加载后才继续。图像、样式表和脚本都会延迟 load 事件的触发。DOMContentLoaded 事件在页面中所有 DOM\
    \ 元素都可用时就会触发。这让你能够尽快地操作页面中的元素。\n\n```\ndocument.addEventListener(\"DOMContentLoaded\"\
    , function() {\n  // 所有 DOM 元素现在都可用了，但浏览器\n  // 可能仍在加载图像和其他文件\n}, false);\n```\n\
    \n如果你没有将 <script> 标签包含在 HTML 标记的底部，你可能需要使用 DOMContentLoaded 事件来确保在 JavaScript\
    \ 中使用 DOM 元素之前它们已经存在。\n\n# 鼠标事件 (Mouse Events)\n\nJavaScript 允许你以多种方式利用鼠标的多功能性。鼠标事件提供了关于事件的有用信息，包括事件发生的位置以及在事件期间用户是否按下了任何键。\n\
    \n- **clientX, clientY**: 鼠标相对于视口（窗口）左上角的位置。\n- **pageX, pageY**: 鼠标相对于页面左上角的位置，该位置可能已经滚动出了视图。\n\
    - **screenX, screenY**: 鼠标相对于计算机屏幕左上角的位置。\n\n# JavaScript 口袋指南 (The JavaScript\
    \ Pocket Guide)\n\n- **offsetX, offsetY**: 鼠标相对于发生事件元素左上角的位置。\n- **altKey, ctrlKey,\
    \ metaKey, shiftKey**: 如果在事件期间分别按下了 Alt、Ctrl、meta 或 Shift 键，则结果为 true。meta 键在\
    \ Mac OS 上是 Cmd 键，因此 Internet Explorer 不支持它（因为它仅限 Windows）。\n- **button**: 表示所使用的按钮，因此它只在涉及鼠标按钮的事件上有效。左键为\
    \ 0，中键为 1，右键为 2。\n- **detail**: 对于鼠标按钮事件，用户短时间内连续点击鼠标的次数。对于鼠标轮事件，滚轮旋转的距离。\n- **relatedTarget**:\
    \ 对于 mouseover 事件，鼠标刚刚离开的元素。对于 mouseout 事件，鼠标刚刚进入的元素。\n\n# 点击 (click)\n\nclick\
    \ 事件是最重要的，因为它并不是严格意义上的鼠标事件（这就是为什么它的名称不像后面显示的大多数事件那样带有 \"mouse\" 字样）。键盘也可以通过在焦点元素上按下\
    \ Enter/Return 来触发 click 事件。该事件在鼠标按下（mouse-down）和鼠标释放（mouseup）之后触发。\n\n<a href=\"\
    #\" id=\"myLink\">点击此元素或按回车</a>\n\n```\nvar link = document.getElementById(\"\
    myLink\");\nlink.onclick = function(event) {\n  alert(\"clicked!\");\n};\n```\n\
    \n尝试使用 Tab 键跳转到链接并按下 Enter/Return，看看是否可以用键盘触发 click 事件。使用 click 比在 mouseup 和 keyup\
    \ 上都绑定事件要简单得多。\n\n# 鼠标按下 (mousedown), 鼠标释放 (mouseup)\n\nmousedown 事件是用户点击鼠标按钮时触发的第一个事件。\n\
    \nmouseup 事件在用户释放鼠标按钮时触发，紧在 click 事件触发之前。\n\n# 双击 (dblclick)\n\ndblclick 方法在任何其他鼠标按钮事件之后触发。要区分单击和双击是非常困难的。detail\
    \ 属性（在较旧版本的 Internet Explorer中不可用）可以提供点击次数的计数。\n\n<a href=\"#\" id=\"myLink\"\
    >双击这里</a>\n\n```\nvar link = document.getElementById(\"myLink\");\nlink.onclick\
    \ = function(event) {\n  // 防止默认行为，否则你将没有时间再次点击并触发 dblclick 事件\n  return false;\n\
    }\nnlink.ondblclick = function(event) {\n  alert(\"double clicked!\");\n};\n```\n\
    \n# 鼠标移入 (mouseover), 鼠标移出 (mouseout)\n\n当鼠标进入一个元素时，触发 mouseover 事件。当鼠标离开时，触发\
    \ mouseout 事件。由于事件冒泡，这些事件使用起来其实很棘手。使用以下 CSS 和标记创建一个 HTML 文档：\n\n```css\ndiv {\n\
    \  width: 50px;\n  height: 50px;\n}\n#parent {\n  padding: 20px;\n  background:\
    \ #999;\n}\n#child {\n  background: #fff;\n}\n```\n\n```html\n<div id=\"parent\"\
    >\n  <div id=\"child\">\n  </div>\n</div>\n```\n\n现在添加一个 <script> 块，为父元素添加 mouseover\
    \ 和 mouseout 事件处理器：\n\n```javascript\nvar parent = document.getElementById(\"\
    parent\");\nparent.onmouseover = function(event) {\n  console.log(\"mouseover\
    \ event occurred\");\n};\n```\n\n```javascript\nparent.onmouseout = function(event)\
    \ {\n  console.log(\"mouseout event occurred\");\n};\n```\n\n当鼠标进入灰色的父元素 <div>\
    \ 时，会触发鼠标事件。但如果鼠标继续进入白色的子元素 <div>，鼠标和 mouseover 事件会再次触发。如果你只想知道鼠标何时进入和离开父元素 <div>，这些额外的事件可能会产生问题。\n\
    \n# 鼠标进入 (mouseenter), 鼠标离开 (mouseleave)\n\n仅适用于 Internet Explorer\n\nInternet\
    \ Explorer 提供了两个可以解决 mouseover/mouseout 问题的事件。mouseenter 和 mouseleave 事件与 mouseover\
    \ 相同，不同在于它们不冒泡。\n\n```javascript\nparent.onmouseenter = function(event) {\n  console.log(\"\
    mouseenter event occurred\");\n};\n\nparent.onmouseleave = function(event) {\n\
    \  console.log(\"mouseleave event occurred\");\n};\n```\n\n当鼠标进入灰色的父元素 <div> 时，触发鼠标事件。但如果鼠标继续进入白色的子元素\
    \ <div>，鼠标和 mouseover 事件会再次触发。如果你只想知道鼠标何时进入和离开父元素 <div>，这些额外的事件可能会产生问题。\n\n# 键盘事件\
    \ (Keyboard Events)\n\n键盘事件有两个关于按键的属性：keyCode 和 charCode。遗憾的是，这些属性取决于浏览器。\n\n\
    # 键按下 (keydown)\n\nkeydown 事件在用户按下按键时触发。键盘上的几乎按键都可以触发此事件。\n\n# 按按下 (keypress)\n\
    \nkeypress 事件仅在用户按下可以打印字符的键时触发。Enter/Return 和 Shift 等键不会触发此事件。\n\n# 键释放 (keyup)\n\
    \nkeyup 事件在用户释放按键时触发，是 keydown 和 keypress 之后的最后一个事件。\n\n为了演示这些事件有多混乱，这里有一个可以在任何浏览器上运行的示例脚本：\n\
    \n```html\n<input type=\"text\" name=\"textInput\" value=\"\" id=\"textInput\"\
    \ />\nvar input = document.getElementById(\"textInput\");\n\nfunction keyReport(event)\
    \ {\n    event = event || window.event;\n\n    var keyCode = event.keyCode;\n\
    \    var keyCharacter = String.fromCharCode(keyCode);\n    var charCode = event.charCode;\n\
    \    var charCharacter = String.fromCharCode(charCode);\n\n    var report = [\n\
    \        \"Event: \" + event.type,\n        \"Key: \" + keyCode + \", \" + keyCharacter,\n\
    \        \"Char: \" + charCode + \", \" + charCharacter\n    ].join(\"\\n\");\n\
    \n    alert(report);\n}\n\ninput.onkeydown = keyReport;\ninput.onkeypress = keyReport;\n\
    ```\n\n当你在文本输入中输入任何键时，浏览器会显示两个警告对话框。当按下 A 键时，Firefox 显示如下：\n\nEvent: keydown\n\
    Key: 65, A\nChar: o,\n\nEvent: keypress\nKey: o,\nChar: 97, a\n\n在这种情况下，keyCode\
