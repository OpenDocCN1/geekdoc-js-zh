    # Chapter 9: Browsers and Windows 123


    +   - **pathname** The string after the host and before the search, including
    the leading slash (/): /dir/file.html


    +   - **port** The port: 8080


    +   - **protocol** The string before the host, *not* including the slashes (//):
    http:


    +   - **search** The query string variables, including the leading question mark
    (?):?param=value&param2=value


    # # Cookies


    *Cookies* are small strings that let you store data across page views and sessions.
    These are some common uses of cookies:


    +   - Keeping track of whether the user has logged in to your site


    +   - Remembering that a user has visited a page before


    +   - Differentiating between first-time visitors and repeat visitors


    Cookies are also sent to the server with every page request. That''s how the server
    knows whether the user is logged in. Because cookies add data to the request and
    therefore increase the size of the request, cookie data is limited to 4KB.


    The window.document object has a funny little property called cookie. You can
    use that object to read and set cookie data.


    # # Setting Cookies


    To set a cookie, just assign the name and value to document.cookie in the following
    format:


    ```

    document.cookie = "name=value";

    ```'
  - "[PAGE 151]\n\n# 124 The JavaScript Pocket Guide\n\nYou can set only one cookie\
    \ at a time, but assigning another value to document.cookie doesn't overwrite\
    \ the previous cookies, unless one of them shares the same name. You can continue\
    \ to assign name/value pairs to document.cookie until you hit the 4KB limit enforced\
    \ by the browser.\n\n```\n// Adding another cookie\ndocument.cookie = \"anotherName=anotherValue\"\
    ;\n```\n\nYou should always pass the value part of the string through encodeURIComponent()\
    \ to make sure it doesn't contain any illegal characters like spaces, commas,\
    \ and semicolons.\n\n```\nvar cookieValue = \"encoded value\";\ndocument.cookie\
    \ = \"thirdCookie=\" + \nencodeURIComponent(cookieValue);\n```\n\nYou can also\
    \ set the following optional parameters that affect the visibility, life span,\
    \ and security of this particular cookie:\n\n+   - domain The domain or subdomain\
    \ that can read this cookie.\n- expires The date on which this cookie expires.\
    \ This must be in GMT format.\n- max-age The lifetime in seconds before the cookie\
    \ should expire.\n- path The URL path to which this cookie is restricted.\n- secure\
    \ If set, the browser will send this cookie over HTTPS only for security.\n\n\
    You can set any of these parameters by appending them to the cookie string, separated\
    \ by semicolons.\n\n```\n// This secure cookie will last a year\ndocument.cookie\
    \ = \"name=value;max-age=\" + (60*60*24*365) + \n\";secure\";\n```"
- md: "\n## Chapter 9: Browsers and Windows\n\n> note Restricting the visibility of\
    \ a cookie by setting the domain and path parameters does not make your cookie\
    \ secure. Never store sensitive information such as usernames and passwords in\
    \ cookies.\n\n## Reading Cookies\n\nEven though document.cookie only lets you\
    \ set one cookie at a time, you read all the cookie values at once.\n\n```\ndocument.cookie;\n\
    \"name=value;anotherName=anotherValue;thirdCookie-\nencoded%20value\"\n```\n\n\
    You'll have to use your string manipulation skills to extract a single cookie's\
    \ value from this string. Regular expressions come in handy here.\n\n```javascript\n\
    function getCookie(name) {\n  // Get each individual cookie by splitting\n  //\
    \ on semicolons and possible spaces\n  var cookies = document.cookie.split(/\\\
    ;\\s*/);\n\n  // Make a regular expression to match the name\n  // and value in\
    \ a subpattern\n  var pattern = new RegExp(\"\\b\" + name + \"=(.*)\");\n\n  //\
    \ Check each cookie until you find a match\n  for (var i = 0; i < cookies.length;\
    \ i++) {\n    var match = cookies[i].match(pattern);\n    if (match) {\n     \
    \ return decodeURIComponent(match[1]);\n    }\n  }\n}\ngetCookie(\"thirdCookie\"\
    );\n\"encoded value\"\n```\n\n## Deleting Cookies\n\nDeleting cookies is simple:\
    \ Just set the cookie's value to nothing with a max-age of zero.\n\n```javascript\n\
    document.cookie = \"anotherName;max-age=0\";\n```\n\n## The navigator Object\n\
    \nThe navigator object gives some insight into what browser is running your code.\
    \ This is sometimes referred to as browser sniffing. This is useful for two reasons:\n\
    \n- You can use it to collect data about browsers visit your sites. This is called\
    \ analytics, and there are many prebuilt solutions for this like Google Analytics.\n\
    \n- You can use it to target code for a particular browser. For instance, if you\
    \ know that Internet Explorer doesn't support some code, you can test for \"Microsoft\
    \ Internet Explorer\" in window.navigator.appName.\n\nUnfortunately, this object\
    \ isn't as useful as it could be for a couple of reasons:\n\n- There aren't any\
    \ standards for what type of values navigator properties should have. For instance,\
    \ window.navigator.appVersion is not just a version number but can include a variety\
    \ of other information.\n\n- Early JavaScript programmers relied too heavily on\
    \ this information, so their scripts worked only in certain browsers. When a new\
    \ browser came out, it would use the navigator properties to pretend to be a different\
    \ browser. For instance, many sites in the 1990s were built to work best in Netscape.\
    \ Internet Explorer then copied parts of Netscape's window.navigator.appName in\
    \ order to trick those sites to run code as if it were Netscape.\n\n## Feature\
    \ Detection vs. Browser Sniffing\n\nIn the next few chapters, I'll discuss many\
    \ properties and methods that some browsers (mainly Internet Explorer) don't support.\
    \ In your code, you could take one of two approaches to handling these differences:\n\
    \n- You could use the navigator properties to determine whether the browser is\
    \ Internet Explorer and execute different code.\n\n- You could check to see whether\
    \ the property or method you want to use exists and execute different code if\
    \ it doesn't.\n\nThe latter method is always the better way to go. If Internet\
    \ Explorer 10 includes support for the property or method, then your test is no\
    \ longer applicable. Feature detection—testing for the feature before using it—is\
    \ the most reliable way to make sure your code continues to work efficiently with\
    \ future browsers.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_156_0.png)\n\n\
    This chapter could easily be titled something like “Scripting HTML,” but the DOM\
    \ is such an important concept that it deserves marquee status. DOM stands for\
    \ “Document Object Model,” which is a concise way of explaining exactly what it\
    \ is: the model (or representation) for the objects in an HTML document. More\
    \ specifically, it is a hierarchy of data types for HTML documents, links, forms,\
    \ comments, and everything else that can be represented in HTML code.\n\nLike\
    \ everything else in client-side scripting, the DOM has a muddy history, and resulting\
    \ implementations across browsers are more complicated for it. Web standards have\
    \ smoothed out many rough edges, but you still have to account for missing methods\
    \ and differences in implementations, especially in Internet Explorer. (Chapter\
    \ 12 will show how to take advantage of code that lets you ignore all these differences.)\n\
    \n## Nodes\n\nNodes are the general data type for objects in the DOM. They have\
    \ attributes, and some nodes can contain other nodes.\n\nThere are several node\
    \ types, which represent more specific data types for HTML elements. Node types\
    \ are represented by numeric constants, so if you need to determine the type of\
    \ a node, compare its nodeType property with the values in Table 10.1.\n\n## Table\
    \ 10.1 Common Node Types\n\n| Type | Constants |\n| --- | --- |\n| Document, the\
    \ element at the top of the DOM tree | Node.DOCUMENT_NODE === 9 |\n| Element,\
    \ the general type for nodes represented by HTML tags | Node.ELEMENT_NODE ===\
    \ 1 |\n| Text, representing simple text in HTML including whitespace | Node.TEXT_NODE\
    \ === 3 |\n| Comment, for <!-- html comments --> | Node.COMMENT_NODE === 8 |\n\
    | DocumentFragment, the top element for abstract DOM trees | Node.DOCUMENT_FRAGMENT_NODE\
    \ === 11 |\n\nNotice that text and comments are also nodes in the DOM, even though\
    \ it's rare that you'll need to retrieve and manipulate them.\n\n## Node Collections\n\
    \nCollections are arraylike objects that hold lists of nodes. Unlike arrays, these\
    \ lists are “live,” meaning that if the DOM changes (nodes are added, removed,\
    \ or reordered), the collection automatically updates to reflect those changes.\n\
    \nAs an example, say you have three paragraphs in your page, like this:\n\n```html\n\
    <p>one</p>\n<p>two</p>\n<p>three</p>\n```\n\nYou can retrieve a collection of\
    \ those nodes with the getElementsByByTagName(\"p\") method. Its length property\
    \ has the value of 3.\n\n```javascript\nvar paragraphs = document.getElementsByTagName(\"\
    p\");\nconsole.log(paragraphs.length);\n3\n```\n\nNow, create a new paragraph,\
    \ and append it to the document body.\n\n```javascript\nvar newPara = document.createElement(\"\
    p\");\nnewPara.appendChild(document.createTextNode(\"four\"));\ndocument.body.appendChild(newPara);\n\
    ```\n\nThe collection of paragraphs automatically updates to include the new paragraph\
    \ as soon as it is added to the page.\n\n```javascript\nconsole.log(paragraphs.length);\n\
    4\n```\n\nIf you need array methods such as splice() or reverse(), you have to\
    \ convert the collection to an array by looping over each item and adding the\
    \ items to a real array. However, this new array is not live, so it will not automatically\
    \ update to reflect changes to the page.\n\n## Node Trees\n\nNodes are organized\
    \ in hierarchies, or trees. Nodes that contain other nodes are parent nodes. Nodes\
    \ contained in a parent node are child nodes. Text and comment nodes can be child\
    \ nodes, but they can't be parent nodes.\n\nAn HTML document that looks like the\
    \ following is represented as a node tree in the DOM:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n  <head>\n    <title>DOM Example</title>\n  </head>\n  <body>\n    <div>\n\
    \      <h1>Heading</h1>\n    </div>\n    <p>Click this <a href=\"#\">Link</a>\
    \ to see more.</p>\n  </body>\n</html>\n```\n\nYou could diagram the DOM tree\
    \ as shown in Figure 10.1.\n\nFigure 10.1\nA DOM tree diagram.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_159_0.png)\n\
    \nNotice how the <p> element contains three nodes: a text node, an <a> element,\
    \ and another text node.\n\nThis tree diagram is actually missing many more text\
    \ nodes, because newlines and indentations count as text nodes. The node tree\
    \ starting at the <div> element should actually look like Figure 10.2 to include\
    \ the formatting whitespace.\n\nFigure 10.2\nA branch of the DOM tree with whitespace\
    \ text nodes.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_160_0.png)\n\n## Node\
    \ Properties\n\nAll nodes have three common properties, though some of them are\
    \ less useful on certain node types.\n\n### nodeName\n\nFor element nodes, which\
    \ are represented by <tags> in HTML, the node-Name property is the tag name. In\
    \ HTML it is always uppercase.\n\n```javascript\ndocument.createElement(\"a\"\
    ).nodeName;\n\"A\"\n```\n\n```javascript\ndocument.createElement(\"fieldset\"\
    ).nodeName;\n'FIELDSET'\n```\n\nOther node types return a string representation\
    \ of its type.\n\n```javascript\ndocument.nodeName;\n\"#document\"\n```\n\n```javascript\n\
    document.createTextNode(\"a text node\").nodeName;\n\"#text\"\n```\n"
  mdcn: "\n\n## 第 9 章：浏览器与窗口\n\n> 注意：通过设置 domain 和 path 参数来限制 cookie 的可见性并不能让你的 cookie\
    \ 安全。永远不要在 cookie 中存储用户名和密码等敏感信息。\n\n## 读取 Cookie\n\n尽管 `document.cookie` 每次只允许你设置一个\
