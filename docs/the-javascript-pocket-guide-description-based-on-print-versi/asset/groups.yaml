    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Walking the DOM</title>\n</head>\n\
    <body>\n<h1>Heading</h1>\n<p>Paragraph with <a href=\"#\">Link</a></p>\n</body>\n\
    </html>\n```\n\n## Starting with document\n\nThe document element is a property\
    \ of the global window object, so it’s the most easily accessed and most used\
    \ DOM node. It has two important properties that act as starting points in the\
    \ DOM tree.\n\n```javascript\ndocument.documentElement;\n<html>\ndocument.body;\n\
    <body>\n```\n\nUse the firstChild property to access the <head> element inside\
    \ the documentElement.\n\n```javascript\ndocument.documentElement.firstChild;\n\
    <head>\n```\n\nThe childNodes property returns a collection, so you can loop over\
    \ it like an array. In a well-formatted HTML document, you will find many text\
    \ nodes.\n\n```javascript\nvar childNodes = document.body.childNodes;\nfor (var\
    \ i = 0, l = childNodes.length; i < l; i++) {\n  console.log(childNodes[i]);\n\
    }\n```\n\n```html\n<TextNode content=\"\\n \">\n<h1>\n<TextNode content=\"\\n\
    \ \">\n<p>\n<TextNode content=\"\\n \">\n```\n\nThe <h1> tag is the second child\
    \ node of <body>. You can access it by walking from the text node to its next\
