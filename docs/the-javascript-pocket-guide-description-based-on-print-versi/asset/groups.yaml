    # The Event Object


    Using the standard API, event handlers receive an Event object as an argument.
    This object provides information about the event as well as methods for controlling
    the outcome and life cycle of the event.


    # Properties


    Different types of events have different properties, which you''ll learn later
    in the chapter. Here are a few properties common to all standard Event objects:


    +   - **type** The type of the event, like "click," "load," or "keypress."

    - **target** The element that originally dispatched the event. This may not be
    the same as the element to which the event handler is attached.

    - **currentTarget** The element to which you attached the event handler. In most
    cases, it is synonymous with the this keyword. If you change the context of the
    event handler with call() or apply(), you can still access the element with currentTarget.

    - **eventPhase** A number that indicates whether the event is currently capturing
    (1), bubbling (3), or at the target element (2). Find out more information in
    the "Event Bubbling and Capturing" section later in this chapter.

    - **timeStamp** A number in seconds that represents the time at which the event
    occurred.


    # Methods


    These methods give you control over the how long the event lives and what its
    final outcome is.


    +   - **preventDefault()** Prevents the default behavior from occurring. Default
    behaviors include following links and submitting forms.'
- md: "\n<a id=\"link\" href=\"http://www.google.com\">Don't go to \U0001F449 Google</a>\n\
    \n```javascript\nvar link = document.getElementById(\"link\");\nlink.addEventListener(\"\
    click\", dontFollowLink, false);\n```\n\n```javascript\nfunction dontFollowLink(event)\
    \ {\n  alert(\"Not going to \" + this.href);\n  event.preventDefault();\n}\n```\n\
    \n- `stopPropagation()` Stops the event from continuing to propagate through the\
    \ DOM tree. Find out more information in the “Event Bubbling and Capturing” section.\n\
    \n> Event Objects in Internet Explorer\n\nIn Internet Explorer, the Event object\
    \ isn't available as an argument of the handler. Instead, it's a property of window.\
    \ To write cross-browser DOM Level 0 code, look for the Event object in both places.\n\
    \n```javascript\nfunction handler(event) {\n  event = event || window.event;\n\
    }\n```\n\n## Event Bubbling and Capturing\n\nThe life cycle of an Event object\
    \ is more complicated than you may initially expect. Events go through three phases\
    \ and travel up and down the DOM tree when they fire. Most of the time this doesn't\
    \ come into play, but it's still an important concept to understand.\n\n## Bubbling\n\
    \nWhen an event occurs on an element, it triggers on all the parent nodes of that\
    \ element. You can test this for yourself. Make an HTML document with this body:\n\
    \n```html\n<body>\n  <div>\n    <p>\n      <a href=\"http://www.google.com\">Click</a>\n\
    \    </p>\n  </div>\n</body>\n```\n\nAdd some padding to the elements too so you\
    \ can click a parent element without clicking the child:\n\n```css\nbody, div,\
    \ p {\n  padding: 10px;\n}\n```\n\nThen add a script block that adds an event\
    \ listener to each element and the document. (Remember, this code won't work in\
    \ IE):\n\n```javascript\nvar div = document.getElementsByTagName(\"div\")[0];\n\
    var p = document.getElementsByTagName(\"p\")[0];\nvar a = document.getElementsByTagName(\"\
    a\")[0];\n\ndocument.addEventListener(\"click\", whatNode, false);\ndocument.body.addEventListener(\"\
    click\", whatNode, false);\ndiv.addEventListener(\"click\", whatNode, false);\n\
