    ```

    var myNumber = 42;

    typeof myNumber;

    "number"

    myNumber + "";

    "42"

    typeof(myNumber + "");

    "string"

    ```


    Any time you use a number in a string context, it''s automatically converted to
    a string. But be careful because this is another place where operator precedent
    rules come into play.


    ```

    "The answer is " + 40 + 2;

    "The answer is 402"

    "The answer is " + (40 + 2);

    "The answer is 42"

    ```


    Converting strings to numbers can be a little trickier. If the string is basically
    a number primitive wrapped in quotes, you can put the unary plus (+) operator
    in front of it.


    ```

    +"1.5"

    1.5

    +"5px"

    NaN

    ```


    If the string contains any non-numeric characters, the result is NaN, or Not a
    Number. You can test for this with the isNaN() function.


    ```

    isNaN("5px")

    true

    isNaN("123456")

    false

    ```'
