    for (var name in ConstructorFunc.prototype) {\n  instance[name] = ConstructorFunc.prototype[name];\n\
    }\n\n// 最后，在对象的上下文中调用构造函数\nConstructorFunc.call(instance);\n\ninstance.method();\n\
    ```\n"
