    \ phase: 3\n#document phase: 3\n```\n\nAs the event travels from the document\
    \ to the target element, it's in the capture phase, represented by the 1. At the\
    \ target element, the event is in the second \"at target\" phase. The last phase\
    \ is the bubbling phase, which you've seen before.\n\n## Stop Propagation\n\n\
    You can stop an element from continuing to capture or bubble by calling stopPropagation()\
    \ on the Event object. Change the whatNode() function to demonstrate this.\n\n\
    ```javascript\nfunction whatNode(event) {\n  if (this.nodeName === \"DIV\") {\n\
    \    event.stopPropagation();\n  }\n  console.log(this.nodeName, \"phase: \" +\
    \ event.eventPhase);\n  event.preventDefault();\n}\n```\n\nClicking the link now\
    \ results in this:\n\n```\n#document phase: 1\nBODY phase: 1\nDIV phase: 1\n```\n\
    \nWith this event handler, the event stops propagating down the DOM tree once\
    \ it reaches the <div> element during the capture phase.\n\n## Event Delegation\n\
    \nUnderstanding bubbling and capturing is mostly important for knowing how child\
    \ elements affect the event handlers of their parents. It also has a practical\
    \ use with a technique called event delegation.\n\nSay you have a page with 100\
    \ links and want to do something special when the user clicks any of them. You\
    \ could loop through all the links and attach event handlers to each of them.\n\
    \n```javascript\nvar allLinks = document.getElementsByTagName(\"a\");\nvar i =\
    \ allLinks.length;\n```\n\n```javascript\nwhile (i--) {\n  allLinks[i].addEventListener(\"\
    click\", somethingSpecial, false);\n}\n```\n\n```javascript\nfunction somethingSpecial(event)\
    \ {\n  alert(this.href);\n  event.preventDefault();\n}\n```\n\nBut what if you\
    \ later add links to the page, maybe with an Ajax call?\nYou'll have to add the\
    \ event handler to that link too, probably by repeating the line of code for addEventListener().\n\
    \nA more elegant solution involves adding a single event handler to the document\
    \ and acting it based on the target element of the event.\n\n```javascript\n//\
    \ Add one event handler to the capture phase\ndocument.addEventListener(\"click\"\
    , delegatedSomethingSpecial, true);\n```\n\n```javascript\nfunction delegatedSomethingSpecial(event)\
    \ {\n  if (event.target.nodeName === \"A\") {\n    alert(event.target.href);\n\
    \    event.preventDefault();\n  }\n}\n```\n\nThis new event handler doesn't do\
    \ anything unless the element that originated the is a link.\n\n## Event Examples\n\
    \nAdding/removing event handlers is the same regardless of the type. Handling\
    \ events, however, differs depending on the type. Here are examples of common\
    \ event types.\n\n### Browser Events\n\nThese events are triggered by the browser,\
    \ not by the user. They're very important but not entirely interesting.\n\n####\
    \ load\n\nMost scripts need to wait until the page finishes loading. The simplest\
    \ way to do this is by adding an event handler on the window. You usually want\
    \ to add the event handler as soon as possible, maybe before any third-party code\
    \ loads. In that case, use the onload attribute, but make sure not to override\
    \ event handlers. See the onload() function discussed earlier for an example.\n\
    \nYou can also add load event handlers to <img> elements. Unfortunately, you can't\
    \ rely on them because Internet Explorer may not fire the event if the image is\
    \ cached on the user's computer.\n\n#### unload\n\nThe unload event fires right\
    \ before the browser unloads the page, usually to travel to another page. If your\
    \ page is a complex Web application like Google Docs, you may want to save recent\
    \ changes to the server with Ajax before the user loads a new page.\n\n## The\
    \ JavaScript Pocket Guide\n\n### beforeunload\n\nThe beforeunload event is a special\
    \ event that is also useful for complex Web applications. It allows you to warn\
    \ the user that they're about to leave the page. The event handler can return\
    \ a message for a confirmation dialog to inform the user of the consequences of\
    \ leaving the page.\n\n```javascript\nwindow.onbeforeunload = function() {\n \
    \ return \"Leaving the page will lose all your work!\";\n}\n```\n\nThe entire\
    \ dialog will say, \"Are you sure you want to navigate away from this page? Leaving\
    \ the page will lose all your work! Press OK to continue, or Cancel to stay on\
    \ the current page.\"\n\n### resize\n\nThe resize event is useful for redrawing\
    \ a complex layout based on the size of the window.\n\n```javascript\nwindow.onresize\
    \ = function() {\n  var div = document.getElementById(\"centeredBox\");\n  var\
    \ windowHeight = window.innerHeight || document.documentElement.clientHeight;\n\
    \  div.style.top = windowHeight / 2 - div.offsetHeight / 2 + \"px\";\n}\n\nwindow.onload\
    \ = function() {\n  window.onresize();\n}\n```\n\nThis example centers a <div>\
    \ element vertically in the browser, which isn't possible with just CSS. It calls\
    \ the resize() method as soon as possible to force the browser to position the\
    \ <div> when the page loads.\n"
  mdcn: "\n\n<a id=\"link\" href=\"http://www.google.com\">不要去 \U0001F449 Google</a>\n\
    \n```javascript\nvar link = document.getElementById(\"link\");\nlink.addEventListener(\"\
    click\", dontFollowLink, false);\n```\n\n```javascript\nfunction dontFollowLink(event)\
    \ {\n  alert(\"不会去 \" + this.href);\n  event.preventDefault();\n}\n```\n\n- `stopPropagation()`\
    \ 停止事件继续在 DOM 树中传播。请在“事件泡泡与捕获”部分查阅更多信息。\n\n> Internet Explorer 中的事件对象\n\n在 Internet\
    \ Explorer 中，Event 对象不会作为句柄函数的参数可用。相反，它是 `window` 的一个属性。若要编写跨浏览器的 DOM Level 0\
    \ 代码，请在两个地方都查找 Event 对象。\n\n```javascript\nfunction handler(event) {\n  event\
    \ = event || window.event;\n}\n```\n\n## 事件泡泡与捕获\n\n事件对象的生命周期比你最初预期的要复杂。事件在触发时会经过三个阶段，并在\
    \ DOM 树中向上和向下移动。大多数情况下这不会起作用，但它仍然需要理解的重要概念。\n\n## 泡泡\n\n当元素上发生事件时，该事件会在该元素的所有父节点上触发。你可以亲自测试这一点。创建一个具有如下\
    \ `body` 的 HTML 文档：\n\n```html\n<<body>\n  <div>\n    <p>\n      <a href=\"http://www.google.com\"\
    >点击</a>\n    </p>\n  </div>\n</body>\n```\n\n同时也也给这些元素添加一些内边距（padding），这样你就可以点击父元素而不点击子元素：\n\
    \n```css\nbody, div, p {\n  padding: 10px;\n}\n```\n\n然后添加一个脚本块，为每个元素和文档添加事件监听器。（记住，这段代码在\
    \ IE 中将无法工作）：\n\n```javascript\nvar div = document.getElementsByTagName(\"div\"\
    )[0];\nvar p = document.getElementsByTagName(\"p\")[0];\nvar a = document.getElementsByTagName(\"\
    a\")[0];\n\ndocument.addEventListener(\"click\", whatNode, false);\ndocument.body.addEventListener(\"\
    click\", whatNode, false);\ndiv.addEventListener(\"click\", whatNode, false);\n\
    p.addEventListener(\"click\", whatNode, false);\na.addEventListener(\"click\"\
    , whatNode, false);\n```\n\n```javascript\nfunction whatNode(event) {\n  console.log(this.nodeName);\n\
    \  event.preventDefault();\n}\n```\n\n当你点击链接时，控制台显示如下：\n\nDIV\nBODY\n#document\n\
    \n如果你只点击 `<div>` 元素，`<a>` 和 `<p>` 元素的事件句柄将不会执行：\n\nDIV\nBODY\n#document\n\nEvent\
    \ 对象从目标元素开始*泡泡*，穿过 DOM 树中的每个元素，一直到达文档。如果你在元素上添加了事件句柄，任何子元素都可以导致该句柄的执行。\n\n这一点重要到值得重复：在元素子元素上触发的事件会导致该元素的事件句柄执行。因为文档对象是页面上所有元素的祖先，无论事件源于何，它的事件句柄都会执行。\n\
    \n## 捕获\n\n泡泡阶段实际上是事件对象生命周期的最后一个阶段。所有事件源于文档，并沿着 DOM 树向下移动到目标元素。这被称为*捕获*阶段。\n\n\
    要在事件的捕获阶段添加事件句柄，将 `addEventListener()` 中的第三个参数改为 `true`。在你创建用于测试泡泡的 HTML 文档中添加这些行：\n\
    \n```javascript\ndocument.addEventListener(\"click\", whatNode, true);\ndocument.body.addEventListener(\"\
    click\", whatNode, true);\ndiv.addEventListener(\"click\", whatNode, true);\n\
    p.addEventListener(\"click\", whatNode, true);\na.addEventListener(\"click\",\
    \ whatNode, true);\n```\n\n同时，将 `whatNode()` 函数更改为：\n\n```javascript\nfunction\
    \ whatNode(event) {\n  console.log(this.nodeName, \"phase: \" + event.eventPhase);\n\
    \  event.preventDefault();\n}\n```\n\n现在当你点击链接时，控制台显示如下：\n\n```\n#document phase:\
    \ 1\nBODY phase: 1\nDIV phase: 1\nP phase: 1\nA phase: 2\nA phase: 2\nP phase:\
    \ 3\nDIV phase: 3\nBODY phase: 3\n#document phase: 3\n```\n\n当事件从文档移动到目标元素时，它正处于捕获阶段，由\
    \ 1 表示。在目标元素处，事件处于第二个“到达目标”阶段。最后一个阶段是泡泡阶段，这是你之前见过的。\n\n## 停止传播\n\n你可以通过调用 Event\
    \ 对象上的 `stopPropagation()` 来阻止元素继续捕获或泡泡。更改 `whatNode()` 函数来演示这一点。\n\n```javascript\n\
    function whatNode(event) {\n  if (this.nodeName === \"DIV\") {\n    event.stopPropagation();\n\
    \  }\n  console.log(this.nodeName, \"phase: \" + event.eventPhase);\n  event.preventDefault();\n\
    }\n```\n\n现在点击链接结果如下：\n\n```\n#document phase: 1\nBODY phase: 1\nDIV phase: 1\n\
    ```\n\n使用此事件句柄后，事件一旦在捕获阶段到达 `<div>` 元素，它就会停止在 DOM 树中向下传播。\n\n## 事件委托\n\n理解泡泡和捕获的主要意义在于了解子元素如何影响其父元素的事件句柄。它在一种被称为“事件委托”的技术中具有实际用途。\n\
    \n假设你有一个包含100个链接的页面，并希望在用户点击任何链接时做一些特殊处理。你可以遍历所有链接并为它们添加事件句柄：\n\n```javascript\n\
    var allLinks = document.getElementsByTagName(\"a\");\nvar i = allLinks.length;\n\
    while (i--) {\n  allLinks[i].addEventListener(\"click\", somethingSpecial);\n\
    }\n```\n\n```javascript\nfunction somethingSpecial(event) {\n  alert(this.href);\n\
    }\n```\n\n但如果你要在用户加载新页面之前通过 Ajax 保存最新更改呢？一种更优雅的解决方案是在文档上添加单个事件句柄，并根据目标元素进行操作：\n\
    \n```javascript\n// 在捕获阶段添加事件处理器\ndocument.addEventListener(\"click\", delegatedSpecial,\
    \ true);\n```\n\n```javascript\nfunction delegatedSpecial(event) {\n  if (event.target.nodeName\
    \ === \"A\") {\n    alert(event.target.href);\n    event.preventDefault();\n \
    \ }\n}\n```\n\n## 事件示例\n\n添加/移除事件句柄无论什么类型都是相同的。然而，处理事件取决于类型。这里是常见类型的示例。\n\n###\
    \ 浏览器事件\n\n这些事件由浏览器触发，而不是用户。它们非常重要，但不有趣。\n\n#### load\n\n大多数脚本需要等待页面加载。最简单的方法是在\
    \ `window` 上添加事件句柄。你通常希望尽快添加事件句柄，可能在任何第三方代码加载之前。在这种情况下，使用 `onload` 属性，但要确保不要覆盖事件句柄。参见之前讨论的\
    \ `onload()` 函数。\n\n你也可以为 `<img>` 元素添加加载事件句柄。遗憾的是，你不能依赖它们，因为如果图像在用户的计算机上有缓存，Internet\
    \ 可能不会触发事件。\n\n#### unload\n\nunload 事件在浏览器卸载页面之前触发，通常到另一个页面。如果你的页面是像 Google Docs\
    \ 这样的复杂的 Web 应用，你可能需要在用户加载新页面之前通过 Ajax 保存更改。\n\n## JavaScript 指南\n\n### beforeunload\n\
    \nbeforeunload 事件是一个特殊的事件，对于复杂的 Web 应用也很有用。它允许你警告用户即将离开页面。事件句柄可以返回一个消息用于确认框，以告知用户离开页面的后果。\n\
    \n```javascript\nwindow.onbeforeunload = function() {\n  return \"离开页面将丢失所有工作！\"\
    ;\n}\n```\n\n整个对话将显示：“确定要离开此页面吗？离开页面将丢失所有工作！按确定继续，或按取消留在当前页面。”\n\n### resize\n\
    \nresize 事件对于根据窗口大小重绘复杂的布局很有用。\n\n```javascript\nwindow.onresize = function()\
    \ {\n  var div = document.getElementById(\"centeredBox\");\n  var windowHeight\
    \ = window.innerHeight || document.documentElement.clientHeight;\n  div.style.top\
    \ = windowHeight / 2 - div.offsetHeight / 2 + \"px\";\n}\n\nwindow.onload = function()\
    \ {\n  window.onresize();\n}\n```\n\n此示例将 `<div>` 元素在浏览器中垂直居中，这仅靠 CSS 是无法实现的。它尽可能地调用\
    \ `resize()` 方法，以强制浏览器在页面加载时对 `<div>` 进行定位。\n\n"
