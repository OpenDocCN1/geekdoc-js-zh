    \ I usually load Google.com.\n\nFigure 1.3\nEnabling the console.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_27_0.png)\n\
    \nMost modern browsers—including Apple’s Safari, Google’s Chrome, Opera Software’s\
