- md: "\n# Coordinates on the Screen\n\nMost people are used to coordinate systems\
    \ that start in the bottom right. The X value moves the left as it gets bigger,\
    \ and the Y value moves up as it gets bigger. On computer screens, the Y value\
    \ gets flipped (**Figure 9.1**).\n\n**Figure 9.1**\nThe screen coordinate system.\n\
    \n![](img/4a8fa16ebbe3c330347de80256b877b4_146_0.png)\n\n# Global Functions\n\n\
    Advertisers and spammers have abused some of these methods, especially window.open(),\
    \ which they use to create pop-up and pop-under windows. Use discretion when manipulating\
    \ browser windows to avoid obnoxious and intrusive behavior.\n\n# Dialog Boxes\n\
    \nDialog boxes allow for rudimentary user interaction. I don't like using them\
    \ unless I really need to demand the user's attention. They are *modal*, which\
    \ means the user must dismiss the dialog box before being allowed to interact\
    \ with the rest of the browser again.\n\n- alert(message) Show a dialog with the\
    \ message and an OK button. alert() is useful for debugging in browsers such as\
    \ Internet Explorer 6 that don't have console.log(). Objects passed to alert()\
    \ are coerced into a string via the toString() method, which often only returns\
    \ \"[object Object]\", so it's not nearly as useful as a real console.\n\n- confirm(message)\
    \ Shows a dialog box that includes Cancel and OK buttons. The method returns true\
    \ or false based on whether the user clicked OK or Cancel, respectively. Be very\
    \ careful when using this method because it's often difficult to write questions\
    \ that can really be answered by Cancel or OK.\n\n- prompt(message, defaultResponse)\
    \ Shows a dialog box that includes a text field for the user to enter a response\
    \ string. The field is prepopulated with defaultResponse if provided.\n\n# Manipulating\
    \ Browser Windows\n\nYou have some control over browser windows, but again, try\
    \ not to annoy or frustrate your users with these methods.\n\n- open(url, name,\
    \ features) Opens the page located at url in a new window, or if a window with\
    \ the name already exists, the url opens in that window. It returns a reference\
    \ to the opened window that you can control programmatically.\n\nThe features\
    \ argument is an optional string specifying what browser features the new window\
    \ should have. It is a comma-separated list of \"feature=value\" pairs. Most values\
    \ are \"yes\" or \"no\" except for height and width, which expect pixel values.\n\
    \nSome browsers like Firefox ignore \"no\" values on the location bar to make\
    \ it harder to pretend to be a secure site like a banking website.\n\n# Chapter\
    \ 9: Browsers and Windows\n\n```\nvar newWindow = open(\"http://www.google.com\"\
    ,\n  \"searchWindow\", \"location=yes,menubar=yes,\n  resizable=yes,scrollbars=yes,status=yes,\n\
    \  toolbar=yes,width=600,height=400,left=10,top=10\");\n```\n\n- close() Closes\
    \ a window you opened programmatically. You cannot close a window that you didn't\
    \ open, including the current window.\n\n- moveBy(deltaX, deltaY) Moves the window\
    \ a certain number of pixels from the current position. The arguments can be negative\
    \ or positive integers. A positive deltaX moves the window to the right, and a\
    \ negative-deltaY moves the window up.\n\n- moveTo(x, y) Moves the window to the\
    \ x, y position on the user's screen.\n\n- resizeBy(deltaWidth, deltaHeight) Resizes\
    \ a window a certain number of pixels from the current size. The arguments can\
    \ be positive or negative integers. Calling resizeBy(50, -25) on a window that\
    \ is 600x800 pixels results in a 650x775 pixel window.\n\n- resizeTo(width, height)\
    \ Resizes a window to be width pixels wide and height pixels tall. Browsers no\
    \ longer allow a window to be very small so that you can't hide a window from\
    \ a user. This applies to resizeBy() as well.\n\n- scrollBy(deltaX, deltaY) Scrolls\
    \ the document to the left by deltaX pixels down by deltaY pixels.\n\n- scrollTo(x,\
    \ y) Scrolls the document so that the part of the document located at x, y is\
    \ in the top-left corner of the browser viewport.\n\n- focus() Brings a browser\
    \ window to the front and sets it to respond to keyboard events.\n\n- blur() The\
    \ opposite of focus(), sending the window behind other windows so that it won't\
    \ respond to keyboard events.\n\n- print() Brings up the browser's Print dialog\
    \ box.\n\n# The history object\n\nThe history object gives you programmatic access\
    \ to the browser's Back and Forward buttons. It has three methods: back(), forward(),\
    \ and go().\n\n```\n// Same as pressing the Back button\nwindow.history.back();\n\
    // Same as pressing the Forward button\nwindow.history.forward();\n// Same as\
    \ pressing the Back button twice\nwindow.history.go(-2);\n// Same as pressing\
    \ the Forward button twice\nwindow.history.go(2);\n```\n\n# The location Object\n\
    \nThe location object allows you to inspect and change the window’s current URL.\
    \ You can change the current page by setting it to a different string value.\n\
    \n```\nwindow.location = \"http://www.google.com\";\n```\n\nYou can also change\
    \ just part of a URL by assigning new values to any of the properties. Refer to\
    \ this example URL:\n\n```\nhttp://www.example.com\n```\n"
  mdcn: "\n\n# 屏幕坐标\n\n大多数人习惯于从右下角开始的坐标系。X 值越大越靠左；Y 值越大，位置越高。在计算机屏幕上，Y 值被反转了（**图 9.1**）。\n\
    \n**图 9.1**\n屏幕坐标系。\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_146_0.png)\n\n\
    # 全局函数\n\n广告商和垃圾邮件者滥用了这些中的某些方法，特别是 `window.open()`，他们用它来创建弹出和覆盖窗口。在操作浏览器窗口时请谨慎，以避免引起反感和侵入性的行为。\n\
    \n# 对话框\n\n对话框允许基础的用户交互。除非我真的需要要求用户注意，否则我不喜欢使用它们。它们是*模态的*（modal），这意味着用户在关闭对话框之前才能与浏览器的其他部分交互。\n\
    \n- alert(message) 显示一个带有消息和 OK 按钮的对话框。`alert()` 对于像 Internet Explorer 6 这样没有\
    \ `console.log()` 的浏览器调试非常有用。传递给 `alert()` 的对象通过 `toString()` 方法强制转换为字符串，这通常只返回\
    \ \"[object Object]\"，所以它远没有真正的控制台那么有用。\n\n- confirm(message) 显示一个包含 Cancel 和\
    \ OK 按钮的对话框。该方法根据用户点击 OK 还是 Cancel分别返回 `true` 或 `false`。使用此方法时要非常小心，因为编写一个可以通过\
    \ Cancel 或 OK 真正回答的问题非常困难。\n\n- prompt(message, defaultResponse) 显示一个包含文本字段的对话框，允许用户输入响应字符串。如果提供了\
    \ `defaultResponse`，该字段将预填充该值。\n\n# 操作浏览器窗口\n\n你对浏览器窗口有一定的控制权，但再次强调，尽量不要用这些方法让用户感到烦恼或沮丧。\n\
    \n- open(url, name, features) 在新窗口中打开位于 url 处的页面；如果已经存在同名的窗口，则在那个窗口中打开 url。它返回一个对打开的窗口的引用，你可以通过编程方式对其进行控制。\n\
    \n`features` 参数是一个可选字符串，用于指定新窗口应该具有哪些浏览器功能。它是一个由“feature=value”对组成的逗号分隔列表。除了高度和宽度（期望像素值）外，大多数值都是\
    \ \"yes\" 或 \"no\"。\n\n像 Firefox 这样的浏览器会忽略地址栏上的 \"no\" 值，以使其更难伪装成银行网站等安全站点。\n\n\
    # 第 9 章：浏览器与窗口\n\n```\nvar newWindow = open(\"http://www.google.com\",\n  \"searchWindow\"\
    , \"location=yes,menubar=yes,\n  resizable=yes,scrollbars=yes,status=yes,\n  toolbar=yes,width=600,height=400,left=10,top=10\"\
    );\n```\n\n- close() 关闭你通过编程方式打开的窗口。你无法关闭一个并非你打开的窗口，包括当前窗口。\n\n- moveBy(deltaX,\
    \ deltaY) 将窗口从当前位置移动若干像素。参数可以是负整数或正整数。正的 `deltaX` 将窗口向右右移动，负的 `deltaY` 将窗口向上移动。\n\
    \n- moveTo(x, y) 将窗口移动到用户屏幕上的 x, y 位置。\n\n- resizeBy(deltaWidth, deltaHeight)\
    \ 根据当前大小调整窗口若干像素。参数可以是正整数或负整数。在 600x800 像素的窗口上调用 `resizeBy(50, -25)` 将得到一个 650x775\
    \ 像素的窗口。\n\n- resizeTo(width, height) 将窗口调整为宽 width 像素、高 height 像素。浏览器不再允许窗口变得非常小，这样你就无法在用户面前隐藏窗口。这同样适用于\
    \ `resizeBy()`。\n\n- scrollBy(deltaX, deltaY) 将文档向左滚动 `deltaX` 像素，向下滚动 `deltaY`\
    \ 像素。\n\n- scrollTo(x, y) 滚动文档，使位于 x, y 处的文档部分位于浏览器视口（viewport）的左上角。\n\n- focus()\
    \ 将浏览器窗口置于最顶层，并将其设置为响应键盘事件。\n\n- blur() `focus()` 的反操作，将窗口发送到其他窗口之后，使其不再响应键盘事件。\n\
    \n- print() 弹出浏览器的打印对话框。\n\n# history 对象\n\nhistory 对象允许你通过编程访问浏览器的“后退”和“前进”按钮。它有三个方法：`back()`、`forward()`\
    \ 和 `go()`。\n\n```\n// 等同于点击后退按钮\nwindow.history.back();\n// 等同于点击前进按钮\nwindow.history.forward();\n\
    // 等同于点击两次后退按钮\nwindow.history.go(-2);\n// 等同于点击两次前进按钮\nwindow.history.go(2);\n\
    ```\n\n# location 对象\n\nlocation 对象允许你检查和更改窗口的当前 URL。你可以通过将其设置为不同的字符串值来更改当前页面。\n\
    \n```\nwindow.location = \"http://www.google.com\";\n```\n\n你也可以通过给任何一个属性分配新值来更改\
    \ URL 的部分。参考此示例 URL：\n\n```\nhttp://www.example.com\n```\n\n"
