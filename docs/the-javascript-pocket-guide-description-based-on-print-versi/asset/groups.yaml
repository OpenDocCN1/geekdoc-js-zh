    Ajax used to be an acronym for “Asynchronous JavaScript and XML,” but now it’s
    just a buzzword for highly dynamic Web pages. With Ajax, you have the ability
    to send and receive data from your server without having to load a whole new page.
    This allows you to do the following:


    +   - Quickly load additional content only when the user needs it, making your
    initial page load smaller


    +   - Send data from links and forms back to the server without a page refresh,
    which makes your pages feel faster


    The XMLHttpRequest object makes Ajax possible. Originally a Microsoft innovation,
    all modern browsers support it without too many cross-browser inconsistencies.
    I recommend researching how to use the native XMLHttpRequest object to understand
    what’s going on under the hood,'
- md: "\nbut for this tutorial, you'll just use jQuery's .ajax() function to keep\
    \ things simple.\n\n## Ajax Considerations\n\nOn the surface, Ajax is a relatively\
    \ simple technique, but in practice you need to be aware of some security and\
    \ usability concerns.\n\n## Servers\n\nYou'll need a server to use Ajax because\
    \ browsers won't let JavaScript read files off your hard drive. This is an important\
    \ security restriction; you never want to allow a script to access your important\
    \ documents.\n\n## Same-Origin Policy\n\nThe same-origin policy is another security\
    \ restriction that prevents a script from sending and receiving data from another\
    \ server. It's especially important for Web pages that use cookies to manage user\
    \ accounts. Without this restriction, a script could use your cookies and pretend\
    \ to be you on another site.\n\n## Data Formats\n\nAjax responses are always text,\
    \ but you have a few options on how that text is formatted.\n\n**Text or HTML.**\
    \ If the server responds with text or HTML, you can simply inject it into your\
    \ HTML to add or update content on your page. Text responses can also provide\
    \ arbitrary data such as error messages.\n\n**XML.** The X in Ajax originally\
    \ stood for XML, which was the common response type when Microsoft invented the\
    \ XMLHttpRequest object. You can use DOM methods and properties such as getElementsByTagName()\
    \ or childNodes to walk the XML DOM tree and extract information. I think that\
    \ using XML responses is overly complicated, so I avoid it when possible.\n\n\
    **JSON:** JavaScript Object Notation (JSON) is a way to store data in a string\
    \ that looks like a JavaScript object or array. It's easy to turn this string\
    \ into a real JavaScript object, so it's my preferred data format in most Ajax\
    \ situations.\n\nModern browsers such as Firefox and Safari provide a simple API\
    \ for handling JSON:\n\n```\nJSON.stringify({ propertyName : \"value\" });\nJSON.parse(\"\
    {propertyName\":\"value\"}\");\nObject { propertyName=\"value\" }\n```\n\nJavaScript\
    \ libraries provide functions like jQuery's $.parseJSON so that you can effortlessly\
    \ handle JSON across all browsers.\n\n## User Experience\n\nUsers used to loading\
    \ new pages when they click links and submit forms. If you replace that behavior\
    \ with Ajax, you may need to do some extra work so that users still know what's\
    \ happening.\n\n**Loading indicators.** The browser doesn't tell the user that\
    \ you're making an Ajax request. You should show some kind of loading indicator\
    \ so the user knows that something is happening. I like using animated GIFs, such\
    \ as the free ones at http://www.ajaxload.info/\n\n**Back buttons and bookmarks.**\
    \ Ajax actions don't change the URL in the browser's location field. This has\
    \ two effects: The user can't bookmark or share a URL that corresponds to your\
    \ page's current state, and the browser's back and forward buttons are no longer\
    \ useful. The solution is to use the window.location.hash property to change the\
    \ URL without reloading the page.\n\n- Before clicking an Ajax-driven link: http://example.com/index.html\n\
    - After clicking the link: http://example.com/index.html#page2\n\nThis is a complicated\
    \ technique, so I'll skip this concern in the example later in the chapter. Check\
    \ out the SWFADress library (http://www.as.com/swfadress/) to learn more about\
    \ this technique.\n\n**Accessibility and search engine optimization.** Search\
    \ engines and users without JavaScript enabled won't see your Ajax behaviors.\
    \ It's always a great idea to use progressive enhancement so that your pages work\
    \ just as well with and without Ajax. The following example demonstrates one way\
    \ to achieve this.\n\n## Ajax Example\n\nThis example shows you how to take a\
    \ simple Web page and add Ajax behavior to it. The page does three things:\n\n\
    - Shows a table of data pulled from a storage file\n- Breaks the data into “pages”\
    \ that you can navigate with Previous and Next links\n- Provides a form for adding\
    \ new data to the storage file\n\nAjax isn't much use unless your server can send\
    \ and receive useful data, so you'll use a little bit of PHP (http://php.net)\
    \ to manage your data. You'll need PHP version 5.2.0 or higher to use the JSON\
    \ functions.\n\n## Servers and PHP\n\nIf you don't already have a server that\
    \ supports PHP, I recommend installing the basic version of XAMPP (http://www.apachefriends.org/en/xampp.html).\
    \ The installation instructions are excellent and should get you up and running\
    \ fairly quickly. After you install XAMPP and start the Apache Web server, create\
    \ your example files in these directories (assuming you installed it in the default\
    \ location):\n\n- Windows: C:\\xampp\\htdocs\\\n- Mac: /Applications/XAMPP/htdocs/\n\
    \nThen you can point your browser to http://localhost to see your files.\n\n##\
    \ Setup\n\nThis example has several interlocking parts, so you should keep them\
    \ in separate files to make the code clearer. Start by creating these four files:\n\
    \n- index.php (XAMPP might supply this file for you already, but you can overwrite\
    \ it.)\n- template.php\n- ajax.js\n- people.json\n\n## Data File\n\nPHP handles\
    \ JSON very well, so for this example you'll store all your data in a simple JSON\
    \ object. It looks a lot like regular JavaScript. Create at least six objects\
    \ in the array so that you'll have enough data to do something interesting.\n\n\
    ```json\n{\n  \"name\": \"Lenny\",\n  \"location\": \"Los Angeles\",\n  \"browser\"\
    : \"Safari\"\n},\n{\n  \"name\": \"Adam\",\n  \"location\": \"Austin\",\n  \"\
    browser\": \"Internet Explorer\"\n},\n{\n  \"name\": \"Charlie\",\n  \"location\"\
    : \"New York\",\n  \"browser\": \"Chrome\"\n},\n{\n  \"name\": \"David\",\n  \"\
    location\": \"London\",\n  \"browser\": \"Firefox\"\n},\n{\n  \"name\": \"Eve\"\
    ,\n  \"location\": \"Paris\",\n  \"browser\": \"Safari\"\n},\n{\n  \"name\": \"\
    Frank\",\n  \"location\": \"Berlin\",\n  \"browser\": \"Edge\"\n}\n```\n\n## Controller\
    \ File\n\nThe index.php is a simple script that manages the data. It handles both\
    \ normal requests and Ajax requests.\n\n```php\n<?php\n// Reading data from the\
    \ file\n$people = json_decode(file_get_contents(\"people.json\"));\nif ($people\
    \ == null) {\n    echo \"Invalid JSON file\";\n    exit;\n}\n\n// Get the page\
    \ number from query string\n$pageCount = ceil(count($people) / 3);\n$page = isset($_GET[\"\
    page\"]) ? (int)$_GET[\"page\"] : 0;\n$page = $page < 0 ? 0 : $page;\n$page =\
    \ $page >= $pageCount ? $pageCount - 1 : $page;\n\n$start = $page * 3;\n$end =\
    \ $start + 3;\n$pagePeople = array_slice($people, $start, 3);\n\n// Handle Ajax\
    \ request\nif (isset($_GET[\"ajax\"])) {\n    header('Content-Type: application/json');\n\
    \    echo json_encode($pagePeople);\n    exit;\n}\n\n// Handle normal request\n\
    include \"template.php\";\n?>\n```\n\n## Template File\n\nThe template.php displays\
    \ the data and provides navigation.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>Ajax Example</title>\n</head>\n<body>\n    <h1>People</h1>\n    <table>\n\
    \        <tr>\n            <th>Name</th>\n            <th>Location</th>\n    \
    \        <th>Browser</th>\n        </tr>\n        <?php foreach ($pagePeople as\
    \ $person): ?>\n        <tr>\n            <td><?php echo $person->name; ?></td>\n\
    \            <td><?php echo $person->location; ?></td>\n            <td><?php\
    \ echo $person->browser; ?></td>\n        </tr>\n        <?php endforeach; ?>\n\
    \    </table>\n\n    <nav>\n        <?php if ($page > 0): ?>\n            <a href=\"\
    ?page=<?php echo $page - 1; ?>\" class=\"nav-link\">Previous</a>\n        <?php\
    \ endif; ?>\n\n        <?php if ($page < $pageCount - 1): ?>\n            <a href=\"\
    ?page=<?php echo $page + 1; ?>\" class=\"nav-link\">Next</a>\n        <?php endif;\
    \ ?>\n    </nav>\n\n    <form id=\"add-person\">\n        <input type=\"text\"\
    \ name=\"name\" placeholder=\"Name\">\n        <input type=\"text\" name=\"location\"\
    \ placeholder=\"Location\">\n        <select name=\"browser\">\n            <option\
    \ value=\"Chrome\">Chrome</option>\n            <option value=\"Firefox\">Firefox</option>\n\
    \            <option value=\"Safari\">Safari</option>\n            <option value=\"\
    Edge\">Edge</option>\n        </select>\n        <button type=\"submit\">Add Person</button>\n\
    \    </form>\n\n    <script src=\"ajax.js\"></script>\n</body>\n</html>\n```\n\
    \n## JavaScript File\n\nThe ajax.js handles the Ajax requests for navigation and\
    \ submission.\n\n```javascript\n$(document).ready(function() {\n    // Handle\
    \ navigation links\n    $('.nav-link').on('click', function(e) {\n        e.preventDefault();\n\
    \        let url = $(this).attr('href');\n        loadPage(url);\n    });\n\n\
    \    function loadPage(url) {\n        $.ajax({\n            url: url + '&ajax=1',\n\
    \            dataType: 'json',\n            success: function(data) {\n      \
    \          let tableRows = '';\n                data.forEach(function(person)\
    \ {\n                    tableRows += `<tr>\n                        <td>${person.name}</td>\n\
    \                        <td>${person.location}</td>\n                       \
    \ <td>${person.browser}</td>\n                    </tr>`;\n                });\n\
    \                $('table tbody').html(tableRows);\n                window.history.pushState(null,\
    \ '', url);\n            }\n        });\n    }\n\n    // Handle form submission\n\
    \    $('#add-person').on('submit', function(e) {\n        e.preventDefault();\n\
    \        let formData = $(this).serialize();\n        $.ajax({\n            url:\
    \ 'index.php',\n            type: 'POST',\n            data: formData,\n     \
    \       success: function() {\n                alert('Person added!');\n     \
    \           location.reload(); // Simple way to show the update\n            }\n\
    \        });\n    });\n});\n```\n\n## Saving Form Data to the File\n\nAdd this\
    \ to your index.php to handle saving new people.\n\n```php\nif (count($_POST))\
    \ {\n    $people = json_decode(file_get_contents(\"people.json\"));\n    $person\
    \ = new StdClass();\n    $person->name = htmlspecialchars($_POST[\"name\"]);\n\
    \    $person->location = htmlspecialchars($_POST[\"location\"]);\n    $person->browser\
    \ = htmlspecialchars($_POST[\"browser\"]);\n    $people[] = $person;\n\n    $fp\
    \ = fopen(\"people.json\", \"w+\");\n    fwrite($fp, json_encode($people));\n\
    \    fclose($fp);\n}\n```\n"
  mdcn: "\n但对于本教程，你将仅使用 jQuery 的 .ajax() 函数来保持简单。\n\n## Ajax 注意事项\n\n从表面上看，Ajax 是一项相对简单的技术，但在实践中，你需要意识到一些安全性和易用性问题。\n\
    \n## 服务器\n\n你需要一个服务器来使用 Ajax，因为浏览器不会允许 JavaScript 从你的硬盘上读取文件。这是一个重要的安全限制；你永远不希望脚本访问你的重要文档。\n\
    \n## 同源策略\n\n同源策略是另一种安全限制，它防止脚本从另一个服务器发送和接收数据。这对于使用 cookie 管理用户账户的 Web 页面来说尤为重要。如果没有这个限制，脚本可以使用你的\
    \ cookie 并在另一个网站上伪装成你。\n\n## 数据格式\n\nAjax 响应始终是文本，但对于该文本的格式化，你有几种选择。\n\n**文本或\
    \ HTML。** 如果服务器响应文本或 HTML，你可以简单地将其注入到 HTML 中，以在页面上添加或更新内容。文本响应也可以提供任意数据，如错误消息。\n\
    \n**XML。** Ajax 中的 X 原本代表 XML，这是微软发明 `XMLHttpRequest` 对象时最常见的响应类型。你可以使用 DOM 方法和属性（如\
    \ `getElementsByTagName()` 或 `childNodes`）来遍历 XML DOM 树并提取信息。我认为使用 XML 响应过于复杂，因此我尽可能地避免使用它。\n\
    \n**JSON：** JavaScript 对象表示法（JSON）是一种以字符串形式存储数据的方法，它看起来像一个 JavaScript 对象或数组。很容易将此字符串转换为真正的\
    \ JavaScript 对象，因此它是我在大多数 Ajax 场景下的首选数据格式。\n\n现代浏览器（如 Firefox 和 Safari）提供了一个处理\
    \ JSON 的简单 API：\n\n```\nJSON.stringify({ propertyName : \"value\" });\nJSON.parse(\"\
    {propertyName\":\"value\"}\");\nObject { propertyName=\"value\" }\n```\n\nJavaScript\
    \ 库提供了如 jQuery 的 `$.parseJSON` 等函数，以便你可以在所有浏览器中轻松地处理 JSON。\n\n## 用户体验\n\n用户过去习惯在点击链接和提交表单时加载新页面。如果你用\
    \ Ajax 替换掉这种行为，你可能需要做一些额外的工作，让用户仍然知道正在发生什么。\n\n**加载指示器。** 浏览器不会告诉用户你正在发送 Ajax\
    \ 请求。你应该显示某种加载指示器，让用户知道正在进行操作。我喜欢使用动画 GIF，例如来自 http://www.ajaxload.info/ 的免费资源。\n\
    \n**后退按钮和书签。** Ajax 操作不会改变浏览器地址栏中的 URL。这产生了两个影响：用户无法收藏或分享对应于你页面当前状态的 URL，且浏览器的后退和前进按钮不再好用了。解决方案是使用\
    \ `window.location.hash` 属性在不刷新页的情况下更改 URL。\n\n- 在点击 Ajax 驱动的链接之前：http://example.com/index.html\n\
    - 点击链接后：http://example.com/index.html#page2\n\n这是一项复杂的技术，因此我将在章随后的示例中跳过这个考虑。查看\
    \ SWFADress 库 (http://www.as.com/swfadress/) 以了解更多关于该技术的知识。\n\n**无性和搜索引擎优化。**\
    \ 搜索引擎和没有启用 JavaScript 的用户看不到你的 Ajax 行为。使用渐进增强始终是一个很棒的主意，这样你的页面无论有没有 Ajax 都能正常工作。下面的示例演示了实现这一目标的方法。\n\
    \n## Ajax 示例\n\n此示例展示了如何向一个简单的 Web 页面添加 Ajax 行为。该页面执行三件事：\n\n- 显示从存储文件中提取的数据表格\n\
    - 将数据拆分为“页”，你可以通过“上一个”和“下一个”链接进行导航\n- 提供一个表单用于向存储文件添加新数据\n\n除非你的服务器可以发送和接收有用数据，否则\
    \ Ajax 并没有什么用，因此你将使用一些 PHP (http://php.net) 来管理数据。你需要 PHP 5.2.0 或更高版本来使用 JSON\
    \ 函数。\n\n## 服务器与 PHP\n\n如果你还没有支持 PHP 的服务器，我建议安装基础版本的 XAMPP (http://www.apachefriends.org/en/xampp.html)。其安装说明非常出色，应该能让你很快运行起来。在安装\
    \ XAMPP 并启动 Apache Web 服务器后，请在这些目录中创建你的示例文件（假设你安装在默认位置）：\n\n- Windows: C:\\xampp\\\
    htdocs\\\n- Mac: /Applications/XAMPP/htdocs/\n\n然后你可以将浏览器指向 http://localhost 来查看你的文件。\n\
    \n## 设置\n\n此示例包含几个相互关联联的部分，因此你应该将它们保持在单独的文件中，以使代码更清晰。从创建这四个文件开始：\n\n- index.php（XAMPP\
    \ 可能已经为你提供了此文件，但你可以覆盖它。）\n- template.php\n- ajax.js\n- people.json\n\n## 数据文件\n\
    \nPHP 处理 JSON 的效果非常好，因此在这个示例中，你将所有数据存储在一个简单的 JSON 对象中。它看起来非常像普通的 JavaScript。在数组中至少创建六个对象，以便你有足够的数据来做有趣的事情。\n\
    \n```json\n{\n  \"name\": \"Lenny\",\n  \"location\": \"Los Angeles\",\n  \"browser\"\
    : \"Safari\"\n},\n{\n  \"name\": \"Adam\",\n  \"location\": \"Austin\",\n  \"\
    browser\": \"Internet Explorer\"\n},\n{\n  \"name\": \"Charlie\",\n  \"location\"\
    : \"New York\",\n  \"browser\": \"Chrome\"\n},\n{\n  \"name\": \"David\",\n  \"\
    location\": \"London\",\n  \"browser\": \"Firefox\"\n},\n{\n  \"name\": \"Eve\"\
    ,\n  \"location\": \"Paris\",\n  \"browser\": \"Safari\"\n},\n{\n  \"name\": \"\
    Frank\",\n  \"location\": \"Berlin\",\n  \"browser\": \"Edge\"\n}\n```\n\nPHP\
    \ 处理 JSON 得得非常好，所以在这个示例中，你将所有数据存储在一个简单的 JSON 对象中。它看起来非常像普通的 JavaScript。在数组中至少创建六个对象，以便你有足够的数据来做有趣的事情。\n"
