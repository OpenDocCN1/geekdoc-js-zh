    \ cookie\n  var cookies = document.cookie.split(/\\;\\s*/);\n\n  // 创建一个正则表达式来匹配子模式\
    \ \n  // 中的名称和值\n  var pattern = new RegExp(\"\\b\" + name + \"=(.*)\");\n\n \
    \ // 检查每个 cookie 直到找到匹配\n  for (var i = 0; i < cookies.length; i++) {\n    var\
    \ match = cookies[i].match(pattern);\n    if (match) {\n      return decodeURIComponent(match[1]);\n\
    \    }\n  }\n}\ngetCookie(\"thirdCookie\");\n\"encoded value\"\n```\n\n## 删除 Cookie\n\
    \n删除 cookie 非常简单：只需将 cookie 的值设置为空并将 max-age 设置为零。\n\n```javascript\ndocument.cookie\
    \ = \"anotherName;max-age=0\";\n```\n\n## navigator 对象\n\n`navigator` 对象可以让你了解是哪个浏览器正在运行你的代码。这有时被称为“浏览器嗅探（browser\
    \ sniffing）”。这有用有两个原因：\n\n- 你可以使用它来收集访问你网站的浏览器数据。这被称为数据分析（analytics），有很多预构建的解决方案，比如\
    \ Google Analytics。\n\n- 你可以使用它来针对特定的浏览器编写代码。例如，如果你知道 Internet Explorer 不支持某些代码，你可以在\
    \ `window.navigator.appName` 中测试是否为 \"Microsoft Internet Explorer\"。\n\n遗憾的是，由于几个原因，这个对象并没有它想象的那么有用：\n\
    \n- 对于 `navigator` 属性应该具有什么类型的值，没有任何标准。例如，`window.navigator.appVersion` 不仅仅是一个版本号，还可以包含各种其他信息。\n\
    \n- 早期的 JavaScript 程序员过度依赖这些信息，导致他们的脚本只能在某些浏览器中运行。当新浏览器出现时，它会利用 `navigator` 属性来伪装成不同的浏览器。例如，1990\
    \ 年代的许多网站是为了在 Netscape 中运行得最好而构建的。Internet Explorer 然后复制了 Netscape 的 `window.navigator.appName`\
    \ 部分，以欺骗这些网站运行代码scape Net代码。\n\n## 特性检测与浏览器嗅探\n\n在接下来的章节中，我将讨论某些浏览器（主要是 Internet\
    \ Explorer）不支持的许多属性和方法。在你的代码中，你可以采取两种方法来处理这些差异：\n\n- 你可以使用 navigator 属性判断浏览器是否为\
    \ Internet Explorer 并执行不同的代码。\n\n- 你可以检查要使用的属性或方法是否存在，如果不存在则执行不同的代码。\n\n后者总是更好的方法。如果\
    \ Internet Explorer 10 包含了对该属性或方法的支持，那么你的测试就不再适用。特性检测——在使用之前对其进行测试——是确保你的代码在未来的浏览器中继续高效运行的最可靠方法。\n\
    \n![](img/4a8fa16ebbe3c330347de80256b877b4_156_0.png)\n\n这一章完全可以命名为“HTML 脚本编写”，但\
    \ DOM 是一个如此重要的概念，它应该处于核心地位。DOM 代表“文档对象模型（Document Object Model）”，这是解释其确切含义的简洁方式：HTML\
    \ 文档中对象的模型（或表示）。更具体地说，它是 HTML 文档、链接、表单、注释以及其他可以在 HTML 代码中表示的任何内容的数据类型的层次结构。\n\n\
    就像客户端脚本中的其他一切一样，DOM 拥有一段混乱的历史，导致其在不同浏览器中的实现更加复杂。Web 标准平滑了许多棱角，但你仍然必须考虑缺失的方法和实现上的差异，特别是在\
    \ Internet Explorer 中。（第 12 章将展示如何利用代码来忽略所有这些差异。）\n\n## 节点 (Nodes)\n\n节点是 DOM\
    \ 中对象的通用数据类型。它们具有属性，某些节点可以包含其他节点。\n\n有几种节点类型，代表 HTML 元素的更具体的数据类型。节点类型由数字常量表示，因此如果你需要确定节点的类型，请将其\
    \ `nodeType` 属性与表 10.1 中的值进行比较。\n\n## 表 10.1 常见节点类型\n\n| 类型 | 常量 |\n| --- | ---\
    \ |\n| Document，DOM 树顶部的元素 | Node.DOCUMENT_NODE === 9 |\n| Element，HTML 标签表示的节点的通用类型\
    \ | Node.ELEMENT_NODE === 1 |\n| Text，代表 HTML 中的简单文本包括空白 | Node.TEXT_NODE ===\
    \ 3 |\n| Comment，用于 <!-- html 注释 --> | Node.COMMENT_NODE === 8 |\n| DocumentFragment，抽象\
    \ DOM 树的顶层元素 | Node.DOCUMENT_FRAGMENT_NODE === 11 |\n\n注意，文本和注释也是 DOM 中的节点，尽管你很少需要检索和操作它们。\n\
    \n## 节点集合 (Node Collections)\n\n集合是包含节点列表的类数组对象。与数组不同，这些列表是“活的（live）”的，这意味着如果\
    \ DOM 发生变化，集合会自动更新。\n\n例如，假设你的页面上有三个段落：\n\n```html\n<p>one</p>\n<p>two</p>\n<p>three</p>\n\
    ```\n\n你可以获取这些节点的集合（`p` ）。使用 `getElementsByTagName(\"p\")` 方法可以获取这些节点。其 `length`\
    \ 属性值为 3。\n\n```javascript\nvar paragraphs = document.getElementsByTagName(\"\
    p\");\nconsole.log(paragraphs.length);\n3\n```\n\n现在，创建一个新的段落并将其添加到 body。\n\n\
    ```javascript\nvar newPara = document.createElement(\"p\");\nnewPara.appendChild(document.createTextNode(\"\
    four\"));\ndocument.body.appendChild(newPara);\n```\n\n一旦将段落添加到页面，集合会自动更新。\n\n\
    ```javascript\nconsole.log(paragraphs.length);\n4\n```\n\n如果你需要 `splice()` 或 `reverse()`\
    \ 等数组方法，必须通过遍历每个项目将集合转换为数组。然而，这个新数组不是活的，所以它不会随着页面的变化而更新。\n\n## 节点树 (Node Trees)\n\
    \n节点以层次结构或树的形式组织。包含其他节点的节点是父节点。位于父节点内部的是子节点。文本和注释可以是子节点，但它们不能是父节点。\n\n如下 HTML\
    \ 文档在 DOM 中表示为节点树：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>DOM\
    \ Example</title>\n  </head>\n  <body>\n    <div>\n      <h1>Heading</h1>\n  \
    \  </div>\n    <p>Click this <a href=\"#\">Link</a> to see more.</p>\n  </body>\n\
    </html>\n```\n\n你可以像图 10.1 所示绘制 DOM 树图。\n\n图 10.1\nDOM 树图。\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_159_0.png)\n\
    \n注意 `<p>` 元素包含了三个节点：一个文本节点、一个 `<a>` 元素和另一个文本节点。\n\n这个树图实际上丢失了许多文本节点，因为换行和缩进也被视为文本节点。从\
    \ `<div>` 元素开始的节点树应该像图 10.2 所示，包含格式空白。\n\n图 10.2\n包含空白文本节点的 DOM 树分支。\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_160_0.png)\n\
    \n## 节点属性 (Node Properties)\n\n所有节点都有三个常用属性，尽管其中某些属性在特定节点类型上用处不大。\n\n### nodeName\n\
    \n对于在 HTML 中用 `<标签>` 表示的元素节点，`nodeName` 属性是标签名。在 HTML 中它总是大写的。\n\n```javascript\n\
    document.createElement(\"a\").nodeName;\n\"A\"\n```\n\n```javascript\ndocument.createElement(\"\
    fieldset\").nodeName;\n'FIELDSET'\n```\n\n其他节点类型返回其类型的字符串表示。\n\n```javascript\n\
    document.nodeName;\n\"#document\"\n```\n\n```javascript\ndocument.createTextNode(\"\
    a text node\").nodeName;\n\"#text\"\n```\n\n"
