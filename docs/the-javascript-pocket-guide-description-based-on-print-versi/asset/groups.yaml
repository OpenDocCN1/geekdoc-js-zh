    \  String.prototype.trim = function() {\n    // ...\n  }\n}\n```\n\n### 原型的潜在问题\n\
    \n在更改内置原型时必须小心，因为可能会影响所有对象。此外，数据类型原型上的属性在使用 `hasOwnProperty()` 时不会显示。在我简单的示例中，我将属性直接添加到对象，因此它们会出现在\
    \ `for/in` 循环中。\n\n## 自定义类型的原型\n\n你的自定义类型也可以拥有原型。这是为所有实例添加公共属性和方法的方法。\n\n```\n\
    var Jedi = function(name) {\n  this.name = name;\n};\n\nJedi.prototype = {\n \
    \ theForce: \"strong\",\n  lightaber: function() {\n    console.log(\"Waves hand\"\
    );\n  }\n};\n\nvar obiwan = new Jedi(\"Obi Wan\");\nvar yoda = new Jedi(\"Yoda\"\
    );\n\nyoda.name;\nyoda.theForce;\n\"strong\"\n\nobiwan.theForce;\n\"strong\"\n\
    \nyoda.lightaber();\n\"Waves hand\"\nobiwan.lightaber();\n\"Waves hand\"\n```\n\
    \n你仍然可以为单个对象添加属性，而不会影响其他对象。\n\nobiwan.saberColor = \"blue\";\n\n## 如何理解构造函数和原型\n\
    \n`new` 关键字和对象原型看起来像某种魔法行为，但它们实际上非常简单。以下代码是一个简单的示例，但它应该让你对底层原理有一个了解。\n\n```\n\
