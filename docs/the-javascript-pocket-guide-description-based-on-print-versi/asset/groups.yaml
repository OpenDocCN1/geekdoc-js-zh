    - 无论大小如何，每张图像都应该在幻灯片中居中显示。\n\n如果所有图像的大小都相同，创建一个幻灯片将会简单得多。事实上，最后一个要求几乎让代码的长度增加了一倍。如果我没有提前计划它，我可能会以完全不同的方式组织我的代码，这就是为什么提前决定你的功能非常有帮助。\n\
