- md: "\n## Slideshow Ingredients\n\nFor this simple example, you need the following:\n\
    \n- A simple HTML page with the list of images (slideshow.html)\n- A simple style\
    \ sheet to help position and display the images and controls (slideshow.css)\n\
    - A handful of LOLcat images to test with (http://www.lolcats.com)\n\nFigure 13.2\
    \ shows a preview of the final result.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_226_0.png)\n\
    \nThis list of functional requirements helps plan how you want the widget to behave:\n\
    \n- Without JavaScript, the page should contain the first image and a list of\
    \ links to the subsequent images.\n- The visible image should fade out as the\
    \ next image fades in.\n- The slideshow should loop back to the first image after\
    \ showing the last image.\n- The slideshow should automatically cycle through\
    \ images every five seconds until the user clicks the next or previous arrows.\n\
    - Each image should be centered in the slideshow, regardless of size.\n\nIt would\
    \ be much easier to create a slideshow for images that are all the same size.\
    \ In fact, that last requirement almost doubles the length of the code. If I hadn't\
    \ planned for it, I might have organized my code very differently, which is why\
    \ it really helps to decide on your functionality in advance.\n\n## Slideshow\
    \ HTML\n\nThis example HTML document contains only the bare-minimum markup to\
    \ demonstrate how to build a slideshow:\n\n```\n<!DOCTYPE html>\n<html class=\"\
    no-js\">\n<head>\n    <title>LOLcat Slideshow</title>\n    <link rel=\"stylesheet\"\
    \ href=\"slideshow.css\" type=\"text/css\" />\n    <script type=\"text/javascript\"\
    >\n        (function(d, c) { d[c] = d[c].replace(/\\bno-js\\b/, \"js\"); })(document.documentElement,\"\
    className\");\n    </script>\n</head>\n<body>\n    <div id=\"slideshow\">\n  \
    \      <div class=\"slides\">\n```\n\n## Chapter 13: image Slideshow\n\n```html\n\
    <img src=\"lolcat-1.jpg\" width=\"450\" height=\"336\"\n    alt=\"Lolcat 1\" />\n\
    </div>\n<ul>\n  <li><a href=\"lolcat-2.jpg\" data-size=\"350x263\">\n    Lolcat\
    \ 2</a></li>\n  <li><a href=\"lolcat-3.jpg\" data-size=\"450x350\">\n    Lolcat\
    \ 3</a></li>\n  <li><a href=\"lolcat-4.jpg\" data-size=\"450x314\">\n    Lolcat\
    \ 4</a></li>\n</ul>\n</div>\n<script src=\"http://ajax.googleapis.com/ajax/libs/\n\
    \    jquery/1.4.1/jquery.min.js\" type=\"text/javascript\">\n</script>\n<script\
    \ src=\"slideshow.js\" type=\"text/javascript\">\n    </script>\n</body>\n</html>\n\
    ```\n\nAs short as the document is, you should notice several important details:\n\
    \n- The page links to a style sheet called slideshow.css that you'll create in\
    \ a moment.\n- The page also includes references to jQuery from the Google Libraries\
    \ API and a new file called slideshow.js that you'll also create.\n- The opening\
    \ <html> tag and the first <script> element use the no-js/js technique I described\
    \ in Chapter 8.\n- The slideshow is contained in a <div> with the ID of \"slideshow,\"\
    \ which makes it easy to hook JavaScript behavior into the page.\n\n## The JavaScript\
    \ Pocket Guide\n\n- Each image will exist inside the slides <div>, but I've included\
    \ only the first image in the markup.\n- The slideshow includes an unordered list\
    \ of links that point to the remaining images. I've also stored their sizes on\
    \ the custom data-size attributes.\n\nThis is a somewhat rudimentary example of\
    \ progressive enhancement. The unordered list of links serves dual purposes: Users\
    \ without JavaScript can still access the remaining images by clicking the links\
    \ and loading the images individually, and it's easy to use the data stored in\
    \ the markup to build the slideshow dynamically. I consider it a small victory\
    \ whenever I can reuse accessible markup in the page to create a more engaging\
    \ experience for users who can support it.\n\n## Slideshow CSS\n\nCreate a file\
    \ called slideshow.css, and include the following CSS rules. It's pretty bare\
    \ now, but you'll add more rules to support the JavaScript behavior in the next\
    \ section.\n\n```\n#slideshow .slides {\n  position: relative;\n  margin: 0 auto;\n\
    \  width: 450px;\n}\n\nhtml.js #slideshow .slides img {\n  position: absolute;\n\
    }\n```\n\nI prefixed the second selector with html.js because I want the images\
    \ to be absolutely positioned only if JavaScript is available to create the slideshow.\n\
    \n## Slideshow JavaScript\n\nSince you already know all the functional requirements\
    \ of slideshow, you can quickly sketch an outline of the JavaScript code using\
    \ comments. Create a file called slideshow.js, and enter this code:\n\n```\n(function($)\
    \ {\n\n// Include utility jQuery plug-ins\n// Declare initial variables\n// Create\
    \ images from the link list\n// Collect all images in one node set and hide the\
    \ list\n// Resize slides <div> to hold the largest images\n// Center each image\n\
    // Save a reference to the first image\n// The function to show the next or previous\
    \ image\n// Start timer to cycle through images\n// Create next and previous controls\n\
    // The event handler for the controls\n\n})(jQuery); // Self-invoking function\
    \ executes automatically\n```\n\nIncluding all the code in a self-invoking function\
    \ lets you declare functions and variables without worrying that another script\
    \ might overwrite them and cause conflicts.\n\nSkipping the \"Include utility\
    \ jQuery plug-ins\" comment for now, add this code beneath the \"Declare initial\
    \ variables\" line:\n\n```\nvar slideshow = $(\"#slideshow\");\nvar slides = slideshow.find(\"\
    .slides\");\nvar currentImageIndex = 0;\n```\n\nThe first thing you need to do\
    \ is find the slideshow <div> by passing a CSS selector to the jQuery function($).\
    \ Store it on a variable so that you can find other elements inside it later in\
    \ the script. The first element to find is the slides <div>. You'll also need\
    \ to keep track of the currently visible image with the currentIndexIndex variable.\n\
    \n## Best Practices for Using CSS Selectors in JavaScript\n\nThere's only one\
    \ <div class=\"slides\"> element in the page, so why did I use slideshow.find(\"\
    .slides\") instead of just $(\".slides\")?\n\nInternet Explorer as well as older\
    \ browsers do not support getElementsByClassName() and queryquerySelectorAll().\
    \ JavaScript libraries provide support for these utilities in older browsers by\
    \ looping over every element to find the ones that match your class name or CSS\
    \ selector. This can take a noticeable amount of time if the library has to loop\
    \ over many elements.\n\nBy using slideshow.find(), you can limit the search to\
    \ just the elements inside the slideshow <div> to improve the performance of your\
    \ code.\n\n## Creating the Slideshow Images\n\nThe next step is to use the list\
    \ of links to create images and add them to the slideshow.\n\n```\n// Create images\
    \ from the link list\nslideshow.find(\"ul a\").each(function() {\n  var link =\
    \ $(this);\n  var size = link.attr(\"data-size\").split(\"x\");\n```\n\n## Chapter\
    \ 13: Image Slideshow\n\n```javascript\n$(\"<img />\").attr({\n  src : link.attr(\"\
    href\"),\n  width : size[0],\n  height : size[1],\n  alt : link.text()\n}).hide().appendTo(slides);\n\
    ```\n\nThis code snippet might look like a little daunting because jQuery allows\
    \ you to do so much in very little code.\n\nThe first thing it does is find all\
    \ the links in the unordered list using find() and loop over them using the each()\
    \ function. jQuery encourages a functional coding style, meaning that you use\
    \ looping functions such as each() more often than language features such as for\
    \ or while.\n\nInside the loop function, you can access each link with this keyword\
    \ and turn it into a jQuery object by passing it to $(). Save it on the link variable\
    \ because you'll access it three times in the loop function.\n\nEach link has\
    \ a string like \"350x263\" stored on the data-size attribute. It's easy to separate\
    \ the width from the height by splitting the \"x\".\n\nWhen you pass an HTML string\
    \ to the jQuery function, such as $(\"<img />\"), it creates new HTML elements.\
    \ The attr() method lets you pass attributes to the new element, which is how\
    \ you can set the src, width, height, and alt attributes for each new image.\n\
    \njQuery emphasizes chainability, allowing you to immediately call hide() and\
    \ appendTo() on the newly created <img> without having to save it to a variable\
    \ first. The hide() method sets its display style property to \"none,\" and the\
    \ appendTo() method inserts it into the slides <div>.\n"
  mdcn: "\n\n## 幻灯片所需组件\n\n对于这个简单的示例，你需要以下内容：\n\n- 一个包含图像列表的简单 HTML 页面 (slideshow.html)\n\
