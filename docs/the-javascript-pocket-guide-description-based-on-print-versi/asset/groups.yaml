    ![](img/4a8fa16ebbe3c330347de80256b877b4_286_0.png)


    Animation is actually a pretty simple concept. At its most basic, animation is
    just the process of changing a value over time. That value could be the position,
    size, opacity, or even color of an HTML element. Used appropriately, JavaScript
    animation can help create a dynamic and engaging user experience for your Web
    site.


    Animation has endless uses, so instead of a specific example, I’ll show you how
    to program animation utilities from the ground up. It’s also a great example of
    asynchronous programming and the global timer functions from Chapter 7.'
  - "[PAGE 287]\n\n# Simple Animation\n\nThe following examples use this HTML document,\
    \ which simply draws a small black box, to demonstrate animation concepts:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Animation</title>\n  <style type=\"\
    text/css\" media=\"screen\">\n  #box {\n    background: #000;\n    width: 25px;\n\
    \    height: 25px;\n    position: absolute;\n    left: 0;\n    top: 0;\n  }\n\
    </style>\n</head>\n<body>\n  <div id=\"box\"></div>\n  <script type=\"text/javascript\"\
    >\n    // Animation code goes here\n  </script>\n</body>\n</html>\n```"
  - "[PAGE 288]\n\nThe simplest animation involves changing a property by a little\
    \ bit every interval of time. For example, this function moves an element to the\
    \ left from 0 to 100, by adding one every ten milliseconds:\n\n```\nfunction simpleAnimation(box)\
    \ {\n  var position = 0;\n\n  function move() {\n    position++; // Move by 1\n\
    \    if (position < 100) {\n      box.style.left = position + \"px\";\n      //\
    \ Call move again after 10 ms\n      setTimeout(move, 10);\n    }\n  }\n  move();\
    \ // Start the animation\n}\nsimpleAnimation(document.getElementById(\"box\"));\n\
    ```\n\nThe inner function, move(), calls itself repeatedly with a ten-millisecond\
    \ delay using setTimeout(). The position variable increments and updates the box's\
    \ left property until it equals 100, when the animation stops.\n\nHowever, this\
    \ animation pattern has limited use. More frequently, you'll want to specify a\
    \ duration and let the animation function figure out how to increment the value\
    \ each interval."
  - "[PAGE 289]\n\n# Time-Based Animation\n\nThe general idea behind time-based animation\
    \ is tricky to explain, but it's actually pretty simple. There's a direct relationship\
    \ between the distance traveled and the time passed since starting the animation.\n\
    \n```\nfunction timeBased(box, begin, end, duration) {\n  var distanceToTravel\
    \ = end - begin;\n  startTime = new Date().getTime();\n\n  function move() {\n\
    \    // A number in milliseconds\n    var timePassed = new Date().getTime() -\
    \ startTime;\n    // A number between 0 to 1\n    var percentPassed = timePassed\
    \ / duration;\n\n    if (timePassed < duration) {\n      var newValue = (distanceToTravel\
    \ * percentPassed) + begin;\n      box.style.left = newValue + \"px\";\n     \
    \ setTimeout(move, 0);\n    } else {\n      box.style.left = end + \"px\";\n \
    \   }\n  }\n  move(); // Start the animation\n}\n\ntimeBased(document.getElementById(\"\
    box\"), 0, 200, 1000);\n```"
  - '[PAGE 290]


    The first thing timeBased() does calculate how far to travel, or the end value
    minus the begin value. Second, it stores the current time so you can easily tell
    how how much time has passed on the next interval.


    Like in the simpleAnimation() function, the inner move() function calls itself
    repeatedly with setTimeout(). This time, the interval is zero milli-seconds (which
    really means "as soon as possible"). The smaller the delay, the smoother the animation.


    The first thing move() does calculate how much time has passed since startTime.
    That value is in milliseconds, but to turn time into distance, you want a sample
    percentage of how much time has passed. By dividing timePassed by the desired
    duration, you get a number between 0 and 1. At 0, the animation has just begun.
    At 1, the animation is complete. And at 0.5, the animation is halfway down.


    If the amount of time passed is less than the duration, then move() updates the
    style.left property according to this formula:


    > (Distance to travel * Percentage of duration passed) + Beginning value


    You might remember this as y = mx+b, or a linear algebraic equation.


    If the duration of time has passed, then move() just sets style.left to the ending
    value and does not repeat itself.


    Time-based animation has three main benefits:


    +   - It''s easier to keep animations in sync because you know exactly how long
    they are going to take.


    +   - If the browser gets tied up with another process, the animation might stutter
    a bit but will still complete in the desired duration.


    +   - You''re not limited to linear animations, as you''ll see in a moment.'
- md: "\n# The Date Data Type\n\nI haven't discussed the Date data type yet, but it's\
    \ one of the built-in data types like String and Function. Here are a few example\
    \ uses of the Date data type:\n\n```\n// Create a date object for the current\
    \ time\nvar date = new Date();\ndate;\nSun Feb 15 2010 19:01:26 GMT-0800 (PST)\
    \ {}\n\n// Create a date object specifying a certain time\n// year, month, day,\
    \ hours, minutes, seconds, ms\n// January is 0, February is 1\nvar mayanApocalypse\
    \ = new Date(2012, 0, 1, 0, 0, 0, 0);\nmayanApocalypse;\nSun Jan 01 2012 00:00:00\
    \ GMT-0800 (PST) {}\n\n// Get the millisecond representation of a date.\n// This\
    \ is useful for comparing dates\nmayanApocalypse.getTime();\n1325404800000\n\n\
    // Getting and setting various parts of the date\ndate.setDate(date.getDate()\
    \ + 1); // tomorrow\n1266376009093\ndate.getMonth();\n1\n```\n\n# Easing\n\nEasing\
    \ refers to using curved equations for more graceful or expressive animation.\
    \ There are three basic types:\n\n- *Ease out* is when the animation gradually\
    \ slows down as it ends.\n- *Ease in* is when the animation gradually speeds up\
    \ as it starts.\n- *Ease in/out* is a combination of both.\n\nFirst rewrite the\
    \ timeBased() function to use easing equations. I usually shorten some variable\
    \ names to match the equations: t is timePassed, c is distanceToTravel (or \"\
    change\"), b is begin, e is end, and d is duration.\n\n```getfunction timeBasedEasing(box,\
    \ b, e, d, easing) {\n  var c = e - b,\n  startTime = new Date();\n\n  function\
    \ move() {\n    var t = new Date() - startTime;\n\n    if (t < d) {\n      box.style.left\
    \ = easing(t, b, c, d) + \"px\"\n      setTimeout(move, 0);\n    } else {\n  \
    \    box.style.left = e + \"px\"\n    }\n  }\n  move(); // Start the animation\n\
    }\n```\n\nThe function is basically identical to timeBased(), except that it offloads\
    \ most of the calculation to the easing argument. Next, create the linear easing\
    \ equation:\n\n```javascript\nfunction linear(t, b, c, d) {\n  return c*t/d +\
    \ b;\n}\n```\n\n> The easing functions in this chapter come from Robert Penner's\
    \ Easing Equations for ActionScript, released under a BSD License: http://www.robertpenner.com/easing_terms_of_use.html.\n\
    \nThen, you can call the timeBasedEasing() function with the linear() function\
    \ as an argument:\n\n```javascript\ntimeBasedEasing(document.getElementById(\"\
    box\"), 0, 200, 1000,\nlinear);\n```\n\nThere's nothing surprising there, but\
    \ you can swap linear() with a function like this:\n\n```javascript\nfunction\
    \ easeOutExpo(t, b, c, d) {\n  return (t==d) ? b+c : c * (-Math.pow(2, -10 * t/d)\
    \ + 1) + b;\n}\ntimeBasedEasing(document.getElementById(\"box\"), 0, 200, 1000,\n\
    easeOutExpo);\n```\n\nThe animation starts much faster and \"eases\" to a stop.\
    \ The \"ease in\" version looks like this:\n\n```javascript\nfunction easeInExpo(t,\
    \ b, c, d) {\n  return (t==0) ? b : c * Math.pow(2, 10 * (t - 1)) + b;\n}\ntimeBasedEasing(document.getElementById(\"\
    box\"), 0, 200, 1000,\neaseInExpo);\n```\n\nThere are even more easing functions\
    \ for elastic and bouncing movement, but they're too complicated to include in\
    \ this book.\n\nCheck out Robert Penner's library of ActionScript equations at\
    \ http://www.robertpenner.com/easing/. ActionScript is another dialect of ECMAScript,\
    \ so the equations are easily translated to JavaScript.\n\n# Animation with Libraries\n\
    \nAnimation is a pretty simple concept, but it's still a lot easier to use a JavaScript\
    \ library to create animation utilities than writing them from scratch. Library\
    \ animation utilities allow you to do many things:\n\n- Set the ending values\
    \ for multiple properties at once\n- Set the duration and easing equations\n-\
    \ Add callback functions that trigger at the end of the animation\n\nTo see how\
    \ both the YUI 3 and jQuery libraries handle this, replace the <script> element\
    \ in the previous example HTML with the following markup:\n\n```html\n<p><a href=\"\
    #\" id=\"yuiLink\">Animate with YUI</a></p>\n<p><a href=\"#\" id=\"jqueryLink\"\
    >Animate with jQuery</a></p>\n<p><a href=\"#\" id=\"reset\">Reset</a></p>\n```\n\
    \n```html\n<script src=\"http://yui.yahoo.com/3.0.0/build/yui-yui-min.js\" type=\"\
