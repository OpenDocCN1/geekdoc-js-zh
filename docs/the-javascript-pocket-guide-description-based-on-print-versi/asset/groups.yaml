    # Compound Expressions


    Expressions are the building blocks of JavaScript. Most of the time they''re very
    simple, but like anything else, if you put a whole bunch of them together, they
    can get pretty complicated.


    The simplest expression is a value by itself.


    ```

    16;

    16

    ```


    The next-simplest expression contains two values and an operator.


    ```

    15 + 16;

    31

    ```


    You can combine any number of values and operators to create complex compound
    expressions. Different data types work with various operators in specific ways.
    Chapters 2 through 4 will cover important operators for Numbers, Strings, and
    Arrays, but since all values are “truthy” or “falsy”, it’s useful to cover the
    Boolean operators on their own.


    # Boolean Operators


    Boolean operators help manage “truthy” and “falsy” values. They are most useful
    in if statements and the like, but they also have some interesting uses in and
    of themselves.


    # Logical NOT : !


    The logical NOT operator turns a “truthy” value into false and a “falsy” value
