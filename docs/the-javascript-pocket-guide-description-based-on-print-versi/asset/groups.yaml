    # 浏览器问题


    在纯 JavaScript 中进行编程相对简单，但一旦你将可用的各种浏览器考虑进来，一切就会变得显著复杂得多。


    Brandon Eich 在 20 世纪 90 年代末的“浏览器大战”期间为 Netscape 2.0 开发了 JavaScript。为了跟上进度，微软开发了它自己的
    JavaScript 版本，并命名为 JScript。它并不是原始实现的精确复制，许多原始的差异一直持续到今天。


    此外，Web 及其技术仍在以飞快的速度不断演进。浏览器制造商面临着一项艰巨的任务：既要创新自己的产品并保持相互领先，又要与互联网上数以十亿的 Web 网站保持向后兼容性。


    幸运的是，W3C、WHATWG 和 ECMA 等组织在 JavaScript 和浏览器 API 的代码化和标准化方面取得了巨大进展。他们的努力让开发者能够更轻松地“编写一次，随处运行”，并相信他们的代码会随着
    Web 的演进而持续工作。大多数现代浏览器（如 Firefox、Safari、Opera 和 Chrome）都非常严格遵循 Web 标准。Internet
    Explorer 在标准支持方面仍然落后，经常是每个开发者的心头之患。


    JavaScript 开发人员通过代码库来处理浏览器差异，这些库有助于在所有浏览器中提供一致的 API。你很快就会学习这些库，但接下来的几章将关注纯 JavaScript
    对象、属性和函数。


    # API 是什么？


    API 代表应用程序编程接口（application programming interface），这是一个相当通用的术语，指你用于与软件进行程序化交互的任何工具。浏览器
    API 主要是函数和属性，它们允许你访问浏览器窗口、HTML 文档中的元素，甚至是用户计算机的某些部分。


    # 渐进式增强


    Web 开发是一个有趣且充满挑战的领域，因为你无法可靠地知道用户最终将如何查看你的代码。


    通常，理想的终端用户是那些在带有高速互联网连接的快速计算机上使用现代浏览器的人。这可能描述了大多数 Web 浏览者，但有几十个因素影响着任何人看到你代码的方式：


    - 有些人无法或不愿从旧浏览器升级。

    - 有些人的电脑较慢，屏幕较小。

    - 有些人在带有小屏幕且没有鼠标的移动设备上上网。

    - 有些人没有精细的动作控制能力，因此计算机鼠标不是可行选项。

    - 有些人视力障碍，使用屏幕阅读器软件通过听觉提示操作计算机。

    - 有些人出于隐私考虑锁定了浏览器，因此 JavaScript 和 cookie 无法使用。


    创建任何人都可以使用的有趣、吸引且实用的 Web 页面是一项艰巨的挑战，但这是可能的。最流行的策略通常被称为渐进式增强（progressive enhancement）。


    我喜欢将 Web 开发想象成层层堆叠（图 10.1）。HTML 是你最基础、最核心的层。一个组织良好的 HTML 页面应该让任何用户访问，因为它只是使用 HTML
    标签装饰了一点点含义（或语义）的纯文本。


    **图 8.1**

    Web 开发的层级。


    ![](img/4a8fa16ebbe3c330347de80256b877b4_140_0.png)


    CSS 是你的第二层，决定了呈现和布局。某些用户（特别是视力障碍者）将看不到这一层。


    JavaScript 是你的第三层，它增加了行为和交互性。没有 JavaScript 的用户数量正在减少，但他们仍然存在。


    图像、插件（如 Flash 和 Silverlight）、视频和音频是 Web 内容额外层的示例。


    因为 HTML 本质上具有最好的可访问性，基础 HTML 层应该是使用你的 Web 页面所需的唯一层。其上每一层都应该渐进地增强下方的内容，使体验更有吸引力、更高效且更具参与性。如果用户无法使用某层，页面的核心内容仍然易于访问。


    你最重要的“用户”之一根本不是人。搜索引擎优化（SEO）与渐进增强密不可分。由于 HTML 本质上具有最好的可访问性，基础 HTML 层应该是使用你的 Web
    页面所需的唯一层。其上每一层都应该渐进地增强下方的内容，使体验更有吸引力、更高效且更具参与性。如果用户无法使用某层，页面的核心内容仍然易于访问。


    你最重要的“用户”之一根本不是人。搜索引擎优化（SEO）与渐进增强密不可分。


    # 处理非 JavaScript 情况


    # <noscript> 标签


    # JavaScript 特特定的类


    使用 JavaScript 快速替换 `no-js` 类


