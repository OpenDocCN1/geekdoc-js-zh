    \ property.\n\n```\nvar myObject = {};\nmyObject.property = 42;\n42\nmyObject.anotherProperty\
    \ = \"value\";\n\"value\"\nmyObject;\nObject property=42 anotherProperty=\"value\"\
    \n```\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_36_0.png)\n\nYou can create\
    \ any number of objects with any number of properties. Properties can be any value,\
    \ including other objects and functions.\n\nWhen a property is function, it’s\
    \ referred to as a method. The first several chapters cover many of the methods\
    \ for built-in data types, after which you'll learn to create your own methods.\
    \ Together, objects and functions make JavaScript a powerful and flexible language.\
    \ I'll cover the various uses of objects in Chapter 6.\n\n# Loops\n\nComputers\
    \ are great at doing something over and over, making our human lives easier. Say\
    \ you wanted to print \"I am awesome!\" in the console 10 times. Instead of typing\
    \ console.log(\"I am awesome!\") over and over, you can use a loop.\n\n```\nvar\
    \ times = 10;\nwhile (times--) {\n  console.log(\"I am awesome!\");\n}\n```\n\n\
    The while statement tests the expression inside the parentheses for truthiness\
    \ and executes the code block repeatedly. times-- is shorthand for times = times\
    \ - 1 (also called the *decrement operator*). When times reaches 0, the expression\
    \ evaluates to false, and the while loop ends.\n\nAnother common loop is the for\
    \ statement, which takes three expressions separated by semicolons.\n\n```\nfor\
    \ (var i = 0; i < 10; i++) {\n  console.log(\"Loop \" + i);\n}\n```\n\nThe first\
    \ expression, var i = 0, is the *setup*, which runs once. The second, i < 10,\
    \ is the *test*, which runs each time. The last is the *increment* (++) which\
    \ adds 1 to i each time. You can often use while and for interchangeably.\n\n\
    Make sure that your test expressions become \"falsy,\" or the loop will never\
    \ end:\n\n```\nvar counter = 0;\nwhile (counter < 10) {\n  console.log(\"counter\
