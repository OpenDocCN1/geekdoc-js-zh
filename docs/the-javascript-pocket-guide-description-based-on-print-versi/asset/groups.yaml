    \ 方法配合使用。\n\n```javascript\n$$(this.items.getChildren(\"a #\"))\n// [a #, a #,\
    \ a #]\n```\n\n## MooTools 类中的事件处理器\n\n`Menu` 类的 `addMouseEvents()` 方法为菜单中的链接以及文档元素添加点击事件处理器。\n\
    \n```javascript\naddMouseBehavior : function() {\n    this.links.addEventListener(\"\
    click\", this.onClick.bind(this));\n    $(document).addEventListener(\"click\"\
    , onOutsideClick.bind(this));\n},\n```\n\n`onClick()` 方法非常简单。它将被点击的元素传递给 `toggleLink()`\
    \ 方法，并阻止事件的默认行为以防止浏览器导航到新页面。\n\n```javascript\nonClick : function(event) {\n \
    \   this.toggleLink(event.target);\n    event.preventDefault();\n},\n```\n\n##\
    \ 实际中的函数上下文绑定\n\n`onClick()` 函数是一个属于 `Menu` 对象的方法。但你也将将其作为事件处理器使用。在 `onClick()`\
