    ```\n\n第一次运行 `getElement` 时，它创建元素并对其运行许多代码。然后它重写 `getElement` 函数，仅返回创建的元素。这使得后续调用\
    \ `getElement` 要快得多。\n\n理解对象对于编写组织良好、具有表现力的 JavaScript 代码至关重要。如果你用过 Java 或 ActionScript\
