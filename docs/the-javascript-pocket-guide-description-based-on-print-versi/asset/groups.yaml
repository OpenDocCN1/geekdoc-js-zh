- md: "\n# Introduction\n\nBetween e-mail applications, social networking sites, online\
    \ word processors, and mobile Web browsers, the Internet is becoming more useful\
    \ and more powerful every day. A lot of that power comes from JavaScript, a quirky\
    \ little language available on nearly every computer in the world through browsers\
    \ such as Internet Explorer, Firefox, Safari, Opera, and Chrome. Brendan Eich\
    \ created the language for the Netscape browser in 1995, naming it after Java\
    \ even though the languages have only superficial similarities. Its formal name\
    \ is ECMAScript, governed by the European Computer Manufacturers Association (ECMA),\
    \ which published the fifth edition of the language in December 2009.\n\nJavaScript\
    \ is a *scripting language*, meaning it gives you the ability to control an environment\
    \ with code. In the case of JavaScript, the environment is usually a Web page\
    \ in a browser, where you can react to the mouse and keyboard, create and animate\
    \ elements on the page, communicate with servers, and much more.\n\n# Why JavaScript\
    \ Is Cool\n\nThe following are the reasons why JavaScript is cool—or at least\
    \ why I think it's cool:\n\n- **Low barrier to entry.** Anyone can start writing\
    \ and testing JavaScript with software they already have on their computer.\n\
    - **Easy of deployment.** All you need to include JavaScript on your Web site\
    \ is a server to store the code files and the `<script>` tag.\n- **Small language,\
    \ big power.** The language has a relatively small number of features, but its\
    \ flexibility and expressiveness lets you accomplish a great deal.\n- **The quirkiness.**\
    \ JavaScript has a lot of little oddities and flaws that I find fascinating. It\
    \ seems like I learn a new nuance to the language every week. Some nuances are\
    \ even useful!\n- **The language of the moment.** JavaScript is becoming more\
    \ important and more powerful as our lives are increasingly impacted by the Internet.\n\
    - **The community.** I'm continually amazed at the brilliance and ingenuity of\
    \ the JavaScript community, most of whom release their code for anyone to use\
    \ for free.\n\n# Who Should Read This Book\n\nYou'll need a solid foundation of\
    \ HTML and CSS because there's little room to explain either of those languages\
    \ in this book. Ideally, you've seen JavaScript before; maybe you've even copied\
    \ some code from an online tutorial to into your blog. If you're coming from a\
    \ different programming background, I'll briefly touch on the factors that make\
    \ JavaScript fairly unique among popular languages today.\n\n# What You Need to\
    \ Follow Along\n\nYou need a text editor to write JavaScript files, ideally one\
    \ with syntax highlighting such as Notepad2 for Windows or TextWrangler for Mac\
    \ OS X (both free). Also, because of security restrictions on Web browsers, you\
    \ will need a server to try the Ajax examples, either running on your own computer\
    \ or running on the Web. XAMPP (http://www.apachefriends.org/en/xampp.html) is\
    \ a good program to get a server running quickly on your own computer.\n\n# What's\
    \ in This Book\n\nThe first half of this book (Chapters 1–8) begins with some\
    \ basics followed by explanations of the fundamental parts of the language. You\
    \ won't learn many practical uses of JavaScript until the second half (Chapters\
    \ 9–17), which covers programming Web pages and contains in-depth tutorials for\
    \ a variety of tasks. Throughout the chapters and code examples, I emphasize the\
    \ important concepts more than the minute details, but you'll also be able to\
    \ take much of this code and use it in your own sites right away.\n\n# What’s\
    \ Not in This Book\n\nI'm not trying to cover everything about JavaScript. Some\
    \ parts of the scripting language are problematic and not worth using. Other parts\
    \ are used too infrequently to mention; if I haven't used it in my own code in\
    \ the last few years, I'm not including it here. And many parts are just too new\
    \ to be useful, because browser makers still have yet to implement them (which\
    \ is a shame because there's some exciting stuff just around the corner).\n\n\
    Also, I'm not diving into performance and optimization. JavaScript is tricky enough\
    \ to learn without getting into the obscure tricks that make your code slightly\
    \ faster. Once you get the hang of it, though, plenty of books and online resources\
    \ are available to help you write efficient JavaScript code.\n\nYou can find all\
    \ of the code examples from the tutorial chapters of this book, as well as a few\
    \ bonus chapters, on its companion Web site http://www.peachpit.com/javascriptpocketguide.\n\
    \n# Resources\n\nWhile you're online, here are two of my favorite JavaScript resources\
    \ on the Web for further reading:\n\nYUI Theater. I especially like Douglas Crockford's\
    \ presentations about the language and its history. http://developyahoo.com/yui/theater/\n\
    \nMozilla Developer Center. This site covers more than just JavaScript, but it's\
    \ one of the most comprehensive resources, especially for new language features.\
    \ https://developer.mozilla.org/\n\n# Writing JavaScript Code\n\nWhen learning\
    \ to write JavaScript, it's easy to make simple mistakes that cause your whole\
    \ script to fail. Here are some tips and guidelines to keep you from pulling your\
    \ hair out.\n\n# Case Sensitivity\n\nWhen you name a variable or function\n\n\
    # Comments\n\nComments are an important part of the coding process even though\
    \ they don't actually do anything. They are helpful hints for other people who\
    \ might read your code. More often, they remind me of why I wrote that weird piece\
    \ of code yesterday.\n\nSingle-line comments look like this:\n\n```\n// This is\
    \ a single-line comment\nreturn true; // Comment after code\n```\n\nMultiline\
    \ comments look like this:\n\n```\n/* This comment can wrap\ninto the next line\
    \ */\n```\n\n# Semicolons\n\nJavaScript statements should end with a semicolon\
    \ like sentences end with a period. Technically they are optional, but that’s\
    \ only because JavaScript interpreters add them automatically at the end of most\
    \ lines. It’s best to get into the habit of adding the semicolons yourself because\
    \ there can be strange side effects when you let the interpreter do it for you.\
    \ All of the examples in this book to demonstrate proper semicolon usage.\n\n\
    # Whitespace and New Lines\n\nMost whitespace such as spaces, tabs, and empty\
    \ lines is ignored in JavaScript and usually just aids readability. In fact, on\
    \ large-scale production code, all nonessential whitespace is usually stripped\
    \ out so that script files download quicker. In my examples, I’ll try to demonstrate\
    \ how best to use whitespace for readability.\n\n# Reserved Words\n\nJavaScript\
    \ reserves certain words for specific uses, so be careful to avoid the following\
    \ unless you mean to use them:\n\n- break | for | throw\n- case | function | try\n\
    - catch | if | typeof\n- continue | in | var\n- default | instanceof | void\n\
    - delete | new | while\n- do | return | with\n- else | switch\n- finally | this\n\
    \nYou should also avoid these words because they may be used in future versions\
    \ of JavaScript:\n\n- abstract | final | protected\n- boolean | float | public\n\
    - byte | goto | short\n- char | implements | static\n- class | import | super\n\
    - const | int | synchronized\n- debugger | interface | throws\n- double | long\
    \ | transient\n- enum | native | volatile\n- export | package\n- extends | private\n\
    \nThese words refer to useful objects in the language and Web pages, so be careful\
    \ not to redefine them with your own values:\n\n- arguments | EvalError | parseInt\n\
    - Array | Function | RangeError\n- Boolean | Infinity | ReferenceError\n- Date\
    \ | isFinite | RegExp\n- decodeURI | isNaN | String\n- decodeURIComponent | Math\
    \ | SyntaxError\n- encodeURI | NaN | TypeError\n- Error | Number | undefined\n\
    - Object | unescape\n- eval | parseFloat | URIError\n\n# Balanced Brackets and\
    \ Quotes\n\nIt is easy to make mistakes when it comes to punctuation. Remember\
    \ that every time you open a bracket, such as [, (, or {, or a quote mark, such\
    \ as ' or '\"', you must close it in the correct order. It can be trickier than\
    \ you think.\n\n```javascript\nfunction() {\n  alert([1,2,3].join(\",\"));\n}\n\
    ```\n\n# Firebug\n\nMy favorite way to explore JavaScript is to use the Firebug\
    \ extension for Mozilla Firefox, because its Console tab gives you a way to run\
    \ a snippet of JavaScript and quickly see the result. I'll use Firebug to demonstrate\
    \ how JavaScript works throughout most of the book, so to follow along with the\
    \ examples, you'll want to download and install it (http://getfirebug.com).\n\n\
    After you install Firebug, load up a Web page and click the Firebug icon (Figure\
    \ I.1) in the lower-right corner of Firefox. You type single-line JavaScript statements\
    \ to the bottom of the Console tab and hit Enter/Return to execute the code. To\
    \ type multiple lines at once, expand the text box by clicking the arrow on the\
    \ right (Figure I.2). In this book, the regular code in the examples demonstrates\
    \ what you enter into Firebug, and the highlighted code gives you an example of\
    \ the result. (The function console.log() is another way to print output to the\
    \ console; I'll cover functions in Chapter 5.)\n"
  mdcn: "\n\n# 引言\n\n从电子邮件应用程序、社交网络网站、在线文字处理器到移动 Web 浏览器，互联网正变得越来越实用、越来越强大。这种力量很大程度上来自于\
    \ JavaScript，这是一种奇特的小型语言，通过 Internet Explorer、Firefox、Safari、Opera 和 Chrome 等浏览器，存在于世界上几乎每台计算机上。Brendan\
    \ Eich 在 1995 年为 Netscape 浏览器创建了这种语言，并以 Java 的名字命名，尽管这两种语言之间只有浅层次的相似之处。它的正式名称是\
    \ ECMAScript，由欧洲计算机厂商协会（ECMA）管理，该协会在 2009 年 12 月发布了该语言的第五版。\n\nJavaScript 是一种*脚本语言*，这意味着它让你能够通过代码控制环境的能力。对于\
    \ JavaScript 来说，环境通常是浏览器中的 Web 页面，你可以在其中对鼠标和键盘做出响应，在页面上创建并制作元素，与服务器通信等。\n\n# 为什么\
    \ JavaScript 很酷\n\n以下是 JavaScript 很酷的原因——或者至少是我认为它酷的原因：\n\n- **入门门槛低**。任何人都可以可以使用计算机上已有的软件开始编写和测试\
    \ JavaScript。\n- **部署简单**。在你的 网站上包含 JavaScript 只需要一个存储代码文件的服务器和一个 `<script>` 标签。\n\
    - **小语言，大威力**。这种语言的特征相对较少，但它的灵活性和表达能力让你完成大量工作。\n- **奇特之处**。JavaScript 有许多小小的异常和缺陷，我觉得它们非常迷人。似乎我每周都会学到这种语言的新细微差别。有些细微差别甚至有用！\n\
    - **当下的语言**。随着我们的生活受互联网的影响越来越大，JavaScript 变得越来越重要、越来越强大。\n- **社区**。我对 JavaScript\
    \ 社区的才华和创意感到不断惊讶，他们大多数人免费发布自己的代码供任何人使用。\n\n# 谁应该读这本书\n\n你需要具备坚实的 HTML 和 CSS 基础，因为书中几乎没有空间来解释这两种语言中的任何一种。情况下，你之前见过过\
    \ JavaScript；也许你甚至从在线教程中复制过一些代码到你的博客中。如果你来自不同的编程背景，我将简要介绍一些让 JavaScript 在当今流行语言中显得相当独特的因素。\n\
    \n# 跟进学习需要准备什么\n\n你需要一个文本编辑器来编写 JavaScript 文件，理想情况下是带有语法高亮的，如 Windows 上的 Notepad2\
    \ 或 Mac OS X 上的 TextWrangler（均为免费）。此外，由于 Web 浏览器的安全限制，你需要一个服务器来尝试 Ajax 示例，可以在你自己的计算机上运行或在\
    \ Web 上运行。XAMPP (http://www.apachefriends.org/en/xampp.html) 是一个让你在自己的计算机上快速运行服务器的好程序。\n\
    \n# 书中有什么\n\n本书的前半部分（第 1-8 章）从一些基础知识开始，然后是对语言基础部分进行解释。直到后半部分（第 9-17 章），你才会学到 JavaScript\
    \ 的许多实际用途，这部分涵盖了 Web 编程并包含了各种任务的深度教程。在整个章节和代码示例中，我强调重要的概念而非细微的细节，但你也可以立即将大部分代码应用到你自己的网站中。\n\
    \n# 书中没有什么\n\n我并没有试图涵盖关于 JavaScript 的所有内容。脚本语言的一些部分是有问题的且不值得使用。其他部分的使用频率太低，不值一提；如果我在过去几年里没有在自己的代码中使用它，我就不会把它包含在这里。还有许多部分由于太新而还没有用，因为浏览器制造商尚未实现它们（这很遗憾，因为一些令人兴奋的内容就在眼前）。\n\
    \n此外，我没有深入探讨性能和优化。JavaScript 的学习已经足够困难了，不需要研究那些让你的代码稍微快一点的晦涩技巧。然而，一旦你掌握了它，有大量的书籍和在线资源可以帮助你编写高效的\
    \ JavaScript 代码。\n\n你可以在本书的教程章节的所有代码示例，以及几个额外的奖励章节，可以在其配套网站 http://www.peachpit.com/javascriptpocketguide\
    \ 上找到。\n\n# 资源\n\n当你在线时，这里有两个我最喜欢的 Web 上 JavaScript 资源可供进一步阅读：\n\nYUI Theater。我特别喜欢\
    \ Douglas Crockford 关于这种语言及其历史的演讲。http://developyahoo.com/yui/theater/\n\nMozilla\
    \ Developer Center。这个网站涵盖的内容不仅是 JavaScript，但它是最全面的资源之一，特别是对于新语言特性。https://developer.mozilla.org/\n\
    \n# 编写 JavaScript 代码\n\n在学习编写 JavaScript 时，很容易犯下简单的错误导致整个脚本失败。这里有一些提示和指南，可以防止你抓狂头发。\n\
    \n# 大小写敏感\n\n当你为变量或函数命名时\n\n# 注释\n\n注释是编码过程中的重要部分，尽管它们实际上无所作为。它们对可能阅读你代码的其他人是有用的提示。更多时候，它们提醒我我昨天为什么要写那段奇怪的代码。\n\
    \n单行注释看起来像这样：\n\n```\n// 这是一个单行注释\nreturn true; // 代码后的注释\n```\n\n多行注释看起来像这样：\n\
    \n```\n/* 这个注释可以折叠\n到行 */\n```\n\n# 分号\n\nJavaScript 语句应该以分号结束，就像句子以句号结束一样。技术上它们是可选的，但那是因为\
    \ JavaScript 解释器会自动在大多数行的末尾添加它们。最好的办法是养成自己添加分号的习惯，因为让解释器为你这样做可能会产生奇怪的副作用。书中的所有示例都演示了正确的分号用法。\n\
    \n# 空格和换行\n\nJavaScript 会忽略大多数空格，如空格、制表符和空行，它们通常只有助于提高可读性。事实上，在大规模生产代码中，所有非必要的空格通常会被删除，以便脚本文件下载得更快。在我的示例中，我会尝试演示如何最好使用空格来提高可读性。\n\
    \n# 留关键字\n\nJavaScript 为特定用途保留了某些单词，所以要小心避免使用以下内容，除非你打算使用它们：\n\n- break | for\
    \ | throw\n- case | function | try\n- catch | if | typeof\n- continue | in | var\n\
    - default | instanceof | void\n- delete | new | while\n- do | return | with\n\
    - else | switch\n- finally | this\n\n你也应该避免这些词，因为它们可能会在 JavaScript 的未来版本中被：\n\n\
    - abstract | final | protected\n- boolean | float | public\n- byte | goto | short\n\
    - char | implements | static\n- class | import | super\n- const | int | synchronized\n\
    - debugger | interface | throws\n- double | long | transient\n- enum | native\
    \ | volatile\n- export | package\n- extends | private\n\n这些词指向语言和 Web 页面中的有用对象，所以小心用自己的值重新定义它们：\n\
    \n- arguments | EvalError | parseInt\n- Array | Function | RangeError\n- Boolean\
    \ | Infinity | ReferenceError\n- Date | isFinite | RegExp\n- decodeURI | isNaN\
    \ | String\n- decodeURIComponent | Math | SyntaxError\n- encodeURI | NaN | TypeError\n\
    - Error | Number | undefined\n- Object | unescape\n- eval | parseFloat | URIError\n\
    \n# 平衡括号和引号\n\n在涉及标点符号时很容易出错。记住，每当你打开一个括号，如 [ ( 或 {，或者一个引号，如 ' 或 '\"你必须按照正确的顺序关闭它。这比你想象的要复杂。\n\
    \n```javascript\nfunction() {\n  alert([1,2,3].join(\",\"));\n}\n```\n\n# Firebug\n\
    \n我探索 JavaScript 最喜欢的方法是使用 Mozilla Firefox 的 Firebug 扩展，因为它的 Console 提供了一种运行 JavaScript\
    \ 代码段并快速查看结果的方法。我在书中大部分范围内使用 Firebug 来演示 JavaScript 的工作原理，为了跟随示例，你需要下载并安装它（http://getfirebug.com）。\n\
    \n安装 Firebug 后，加载 Web 页面并点击 Firefox 右下角的 Firebug 图标（图 I.1）。你在 Console 底部输入单行 JavaScript\
    \ 语句并按 Enter/Return 执行代码。要一次性输入多行，点击右侧的箭头展开文本框（图 I.2）。在本书中，示例中的普通代码演示了你输入 Firebug\
    \ 的内容，而高亮的代码给出了结果的示例。（console.log() 函数是另一种向控制台打印输出的方法；我将在第 5 章介绍函数。）\n\n"
