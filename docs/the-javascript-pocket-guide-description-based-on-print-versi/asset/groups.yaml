    \"strong\"\nobiwan.theForce;\n\"strong\"\n```\n\n## 原型\n\n所有数组都有相同的方法，如 `push()`、`slice()`\
    \ 和 `join()`。\n所有字符串都有 `split()`、`substr()` 和 `replace()`。每个对象都有 `toString()`\
    \ 方法。这些方法是从哪里来的呢？\n\n事实证明每个数据类型都有一个原型对象，定义了一组属性。每个数据类型的实例都可以访问其类型原型的原型。\n\n你可以通过访问其构造函数上的\
    \ `prototype` 属性来查找类型的原型对象，如下：\n\n```\nNumber.prototype;\nString.prototype;\n\
    Array.prototype;\nObject.prototype;\n```\n\n当你访问对象的属性时，JavaScript 遵循以下步骤来查找该属性的值：\n\
    \n- 1. 首先，在对象上查找该属性。当你直接将属性添加到对象上时，JavaScript 在这里找到值。\n```\nvar myArray = [1,2,3];\n\
    myArray[0];\n1\n```\n- 2. 如果对象上不存在该属性，JavaScript 将查看对象构造函数的原型。\n```\nmyArray.push;\n\
    push()\nArray.prototype.push;\npush()\nmyArray.push === Array.prototype.push;\n\
    true\n```\n- 3. 你可以使用 `hasOwnProperty()` 方法判断 `push()` 存在于 `Array.prototype` 而不是在\
