    \n函数的参数在 JavaScript 中非常灵活。函数签名中的命名参数更多是为了方便。你不需要为每个参数提供值。\n\n```javascript\nfunction\
    \ myFunc(arg0, arg1, arg2) {\n  console.log(arg0);\n  console.log(arg1);\n  console.log(arg2);\n\
    }\n```\n\nmyFunc(\"a\", \"b\"); // 省略了第三个参数\n\n\"a\"\n\"b\"\nundefined\n\n你也可以提供比函数签名中定义的更多的参数值。所有参数都存储在一个名为\
    \ `arguments` 的局部变量中以便以便访问。\n\n```javascript\nfunction myFunc(arg0) {\n  console.log(arg0);\n\
    \  console.log(arguments[1]); // 第二个参数\n  console.log(arguments[2]); // 第三个参数\n\
    }\n```\n\nmyFunc(\"a\", \"b\");\n\n\"a\"\n\"b\"\n\"c\"\n\n## 参数的默认值\n\n由于参数是可选的，你可能希望提供默认值。在大多数情况下，你可以使用\
    \ `||` 运算符在参数为 `undefined` 时分配默认值。\n\n```javascript\nfunction sayHello(name) {\n\
