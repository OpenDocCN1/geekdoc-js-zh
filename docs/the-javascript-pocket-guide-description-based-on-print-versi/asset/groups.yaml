    The parseInt() and parseFloat() functions are more flexible but may also return
    NaN.


    ```

    parseInt("5.1 inches", 10);

    5

    ```


    ```

    parseFloat("1.5f", 10);

    1.5

    ```


    ```

    parseInt("a1", 10);

    NaN

    ```


    The second argument is the radix, or the base system you''re using. It''s almost
    always 10, unless you are parsing a base-8 or base-16 number. If your number starts
    with a zero, make sure to define the radix.


    ```

    parseInt("07");

    0

    ```


    ```

    parseInt("07", 10);

    7

    ```


    You can use the toFixed() method to convert a number to a string and determine
    the number of decimal places displayed.


    ```

    var interest = 100 * 2.95 / 12;

    interest.toFixed(0);

    "24"

    ```


    ```

    interest.toFixed(2);

    "24.58"

    ```'
