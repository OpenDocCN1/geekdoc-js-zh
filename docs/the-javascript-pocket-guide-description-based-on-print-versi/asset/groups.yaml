    \ 函数\n\n函数在 JavaScript 中非常灵活。这种灵活性提供了巨大的力量，但也可能导致困惑，特别是在函数如何与变量和对象交互方面。本章涵盖了一些相当高级的概念；某些细微之处可能不会让你立刻理解，但一旦你在函数上花费一些时间，你将真正开始欣赏\
    \ JavaScript 语言的力量。\n\n## 创建函数\n\n创建函数的两种方式都使用 `function` 关键字，因此它们之间的差异并不显而易见。\n\
    \n## 声明\n\n变量声明和函数声明的操作方式相似。它们以关键字（`var` 或 `function`）开头，后面跟着标识符。函数声明在括号中添加参数列表，然后是大括号中的代码块。\n\
    \n```javascript\nfunction functionName(arg1, arg2, argN) {\n  // 语句块\n}\n```\n\
