    The increment (++) and decrement (--) operators work differently on the left side
    of a variable than on the right.


    ```

    var first = 0;

    var second = first++;

    [first, second];

    [1, 0]

    ```


    In the previous example, the value of first is assigned to second *before* the
    increment operator adds 1. Put the operator on the other side of the variable,
    and you''ll get a different result, as shown here:


    ```

    var first = 0;

    var second = ++second;

    [first, second];

    [1, 1]

    ```


    This time, the value of first is assigned to second *after* incrementing by 1.


    Most math operators have *assignment* versions, which perform the operation and
    assign the value to the same variable with one operator.


    ```

    var num = 2;

    num += 5; // Same as num = num + 5;

    7

    num /= 2;

    3.5

    num *= 4;

    14

    num -= 5;

    9

    num %= 2;

    1

    ```'
