    # Regular Expressions


    The following methods, search(), match(), and replace(), get their power from
    another built-in JavaScript data type: Regular Expressions.


    Regular expressions, or RegExps, are complicated enough to basically be a mini-language
    inside JavaScript. It takes a while to get the hang of them—far longer than I
    can cover in this book. I will explain the regular expressions used in my examples,
    but I recommend looking for examples, tutorials, and reference material in other
    books and online.


    JavaScript regular expressions have a lot of features, but they aren''t as fully
    featured as Perl-compatible regular expressions and RegExp engines in other languages.
    Make sure you''re looking for references and examples specifically for the JavaScript
    language.


    A regular expression describes a pattern. in a string. The most basic pattern
    is a series of alphanumeric characters.


    ```

    var myPattern = /matching characters/

    ```


    Regular expressions sort of look like strings, except they use forward slashes
    (/) instead of quote marks to delineate the beginning and end. Like strings, you
    have to escape special characters with backslashes (\). Unlike strings, there
    are several special characters in regular expressions: ^ $ . * + ? = ! \ ( ) [
    ] {}.'
  - '[PAGE 67]


    # search(regexp)


    The search() method is the same as indexOf() except that it takes a regular expression
    pattern instead of a substring. It also returns -1 if the pattern isn''t found.


    ```

    "hello world".search(/[aeiou]/); // Find the first vowel

    1

    "hello world".search(/\d/); // Find the first digit

    -1

    ```


    # match(regexp)


    The match() method returns an array containing all the substrings matching the
    regular expression and its subpatterns. Unlike the other search-and-replace methods,
    it returns null if the pattern doesn''t match. Here are some simple examples,
    but I''ll cover this function in Chapter 8:


    ```

    // Find all the vowels

    "hello world".match(/[aeiou]/g);

    ["e", "o", "o"]

    // Find "world" regardless of capitalization

    "hElLo WoRiID".match(/world/i);

    ["WoRiID"]

    ```


    # replace(pattern, replacement)


    The replace() method works like match() except that it returns a string with all
    instances of pattern replaced by the string replacement.


    ```

    // Remove all non-numeric characters from a phone number

    "(310) 555-9876".replace(/\D/g, "");

    "3105559876"

    ```'
