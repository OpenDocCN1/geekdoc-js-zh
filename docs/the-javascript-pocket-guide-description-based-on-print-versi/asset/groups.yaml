    \ y, z ...])\n\n`push()` 方法与 `concat()` 方法相同，但有几点不同：\n\n- 它确实会改变原始数组。\n- 它返回数组的新长度。\n\
    - 如果参数是数组，它不会单独连接每个值。\n\n```javascript\nvar myArray = [\"a\", \"b\", \"c\"];\n\
    myArray.push(\"d\", [\"e\", \"f\"]);\nmyArray;\n[\"a\", \"b\", \"c\", \"d\", [\"\
    e\", \"f\"]]\n```\n\n# unshift(x[, y, z ...])\n\n`unshift()` 方法与 `push()` 方法完全相同，只是它将值添加到数组的开头而不是末尾。\n\
    \n```javascript\nvar myArray = [\"d\", \"e\", \"f\"];\nmyArray.unshift(\"a\",\
    \ [\"b\", \"c\"]);\nmyArray;\n[\"a\", [\"b\", \"c\"], \"d\", \"e\", \"f\"]\n```\n\
    \n# 从数组中移除项\n\n`push()` 和 `shift()` 方法有对应的从末端移除元素的方法。\n\n# pop()\n\n`pop()` 方法从数组移除最后一个元素并改变原始数组。\n\
