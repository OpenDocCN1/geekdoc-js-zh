    \ I don't use it very often, but here's an example: This switch statement compares\
    \ the value of letter to each case, one by one. If the values match, it executes\
    \ any given code or continues down the list. The break keyword stops it from continuing\
    \ any further.\n\n```\nswitch (letter) {\n  case \"a\":\n    console.log(\"letter\
    \ is definitely a\");\n    break;\n  case \"e\":\n    console.log(\"letter might\
