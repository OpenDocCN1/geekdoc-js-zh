    \ the document by looping through every offsetParent.\n\n```\nfunction getLeft(element)\
    \ {\n  var left = element.offsetLeft;\n  while (element = element.offsetParent)\
    \ {\n    left += element.offsetLeft; (continues on next page)\n```"
  - "[PAGE 181]\n\n```\n}\n  return left;\n}\nfunction getTop(element) {\n  var top\
    \ = element.offsetTop;\n  while (element = element.offsetParent) {\n    top +=\
    \ element.offsetTop;\n  }\n  return top;\n}\n```\n\n# ## Element Styles\n\nChanging\
    \ the appearance of an element is probably the most common task in JavaScript\
    \ programming. In fact, I would say that, at a basic level, most of the user interface\
    \ components I build do little more than change the styles of elements in various\
    \ ways.\n\nJavaScript and CSS are very powerful, but they're such different technologies\
    \ that it takes a while to understand how to use them together. Browser APIs and\
    \ incompatibilities don't make it any easier, either. After events, the second\
    \ most important reason why I use JavaScript libraries is reading and writing\
    \ element styles.\n\nYou can do plenty of things with plain JavaScript, classes,\
    \ and the style property, though.\n\n# ## The class Attribute\n\nThe easiest and\
    \ often most effective way to change an element's appearance is to change the\
    \ CSS that affects it by changing its class. If you want to hide an element, you\
    \ can use this:"
  - "[PAGE 182]\n\n```\n/* In your CSS code */\n.hide {\n    display: none\n}\n```\n\
    \n```\n// In JavaScript\nelement.className = \"hide\";\n```\n\nTo revert the element\
    \ to its original state, just remove the \"hide\" class. The tasks of adding,\
    \ removing, and toggling classes are so common that nearly every JavaScript library\
    \ includes functions to facilitate them.\n\nIt’s an effective best practice to\
    \ put all your appearance-related code in the CSS and just use class names in\
    \ JavaScript. Imagine your site highlights special text by changing the color\
    \ to red. You could litter your JavaScript with code like this:\n\n```\ntext.style.color\
    \ = \"red\";\n```\n\nBut if your design changes and you want to highlight text\
    \ in blue, you have to change every reference to \"red\" in your JavaScript files.\
    \ A better solution would be to use a \"highlight\" class to keep all your color\
    \ references in CSS.\n\n```\n/* In your CSS */\n.highlight {\n    color: blue;\n\
    }\n```\n\n```\n// Using a JavaScript function provided by a library\naddClass(text,\
    \ \"highlight\");\n```"
  - "[PAGE 183]\n\n# The style Attribute\n\nThe style attribute is special in JavaScript.\
    \ In HTML, it allows you to write inline CSS for a specific element.\n\n```\n\
    <p style=\"font-family: monospace; background-color: #fcc;\n  margin-bottom: 10px\"\
    >Text</p>\n```\n\nIn JavaScript, element's style property is a special object\
    \ with properties for every CSS property.\n\n```\np.style.fontFamily = \"monospace\"\
    ;\np.style.backgroundColor = \"#fcc\";\np.style.marginBottom = \"10px\";\n```\n\
    \nTake note of two really important details about that example:\n\n+   - CSS properties\
    \ with multiple words are referenced in camelCase in JavaScript.\n- Values for\
    \ style properties are always strings. Numbers still need units like \"px\" or\
    \ \"em.\"\n\nYou can assign values freely to style properties. If the browser's\
    \ CSS engine doesn't understand a value, it will be ignored.\n\nThere are nearly\
    \ limitless uses for style properties, but they require a solid understanding\
    \ of CSS to be used effectively.\n\nReading values from the style property can\
    \ be confusing at first. Values come from the actual style attribute in the HTML,\
    \ not from CSS.\n\n```\n#styled {\n  width: 100px;\n}\n<div id=\"styled\" style=\"\
    height: 100px\"></div>\n```"
  - "[PAGE 184]\n\n```\nvar div = document.getElementById(\"styled\");\ndiv.style.height;\n\
    \"100px\"\ndiv.style.width;\n\"\"\n```\n\nStyle properties aren't very useful\
    \ for inspecting the appearance of an element, unless you've set the styles in\
    \ HTML or with JavaScript. That's where computed styles come in.\n\n# Computed\
    \ DOM Styles\n\nThe DOM provides an API for retrieving the computed value of an\
    \ element's style. Unfortunately, not only is it very awkward to use, but Internet\
    \ Explorer has its own incompatible version. I usually leave this work to a JavaScript\
    \ library, but here is how it basically works if you're interested:\n\n```\n//\
    \ The standard API\ndocument.defaultView.getComputedStyle(element, \nnull).getPropertyValue(\"\
    width\");\n```\n\n```\n// The Microsoft API\nelement.currentStyle(\"width\");\n\
    ```\n\nThe standard API is long and ugly but ugly, it at least works how you want\
    \ it. The Microsoft API is actually pretty nice, except that it doesn't always\
    \ return useful values. Width, height, position, and font size values are returned\
    \ literally from the CSS, so sometimes they are percentages, in ems, or even just\
    \ \"auto.\" JavaScript libraries use a number of tricks to turn these relative\
    \ values into absolute pixels, which are far more useful in JavaScript."
- md: "\n# Events\n\nEvents are hugely important to client-side programming. Without\
    \ them, you couldn't add interactivity to web pages beyond clicking links and\
    \ submitting forms.\n\nUsing events is a matter of executing function in response\
    \ to an action or input. These functions are known as event listeners or event\
    \ handlers. I prefer *handler* even though some method names use *listener*. (Would\
    \ a function handle an event or listen for an event? The former makes more sense\
    \ to me.)\n\nYou can add event handlers to page elements in two ways, and Internet\
    \ Explorer throws a wrench into the works by providing a completely different\
    \ event API from every other modern browser. Handling events properly across all\
    \ browsers can be tricky, but fortunately JavaScript libraries make it much easier\
    \ by abstracting away the messy details. Cross-browser event handling is the biggest\
    \ reason why I almost always use a library when programming JavaScript.\n\nThis\
    \ chapter introduces event handling in pure JavaScript, followed by examples for\
    \ the different event types. That way, you can have a sense of what's going on\
    \ under the hood when you use JavaScript event library functions in the examples\
    \ later in the book.\n\n# Event Attributes\n\nThe simplest way to add an event\
    \ handler is to assign a function to an event attribute of DOM element. Event\
    \ attributes have names like onclick, onkeypress, and onload.\n\n```javascript\n\
    var link = document.getElementsByTagName(\"a\")[0];\nfunction clickHandler() {\n\
    \  alert(this.href);\n  return false;\n}\nlink.onclick = handleClick;\n```\n\n\
    Assuming there is a link in your HTML document, clicking it shows an alert dialog\
    \ box with the href value of the link. The browser won't follow the link because\
    \ its default behavior is prevented.\n\nThis style of event handling works the\
    \ same across all browsers. For simple tasks, it's a great way to start working\
    \ with events.\n\n# Event Attributes in HTML\n\nI'm referring to this style of\
    \ event handling as *event attributes* and not *properties* because you can use\
    \ them as HTML attributes.\n\n```html\n<a href=\"http://www.google.com\" onclick=\"\
    alert(this.href); return false;\">Click Here</a>\n```\n\nI won't show any more\
    \ examples of this style of code because it's always best to avoid mixing HTML\
    \ and JavaScript.\n\n# Return Values\n\nHandlers on event attributes can prevent\
    \ the default behavior of an event by returning false. For click events on links,\
    \ this prevents the browser from following the link and loading a new page. For\
    \ submit events on forms, this prevents the form from submitting and loading a\
    \ new page.\n\n```javascript\nvar form = document.getElementsByTagName(\"form\"\
    )[0];\nfunction preventSubmit() {\n  return false;\n}\nform.onsubmit = preventSubmit;\n\
    ```\n\n# Event Attribute Method Context\n\nThe browser executes event attribute\
    \ handlers in the context of the elements to which they were bound. This means\
    \ you can access the element with the `this` keyword.\n\n```javascript\nfunction\
    \ whatDidICOnClick() {\n    console.log(\"You clicked on \", this);\n    return\
    \ false;\n}\nvar links = document.getElementsByTagName(\"a\");\nfor (var i = -1,\
    \ link; link = links[++i]); {\n    link.onclick=whatDidICOnClick;\n}\n```\n\n\
    You clicked <a href=\"http://www.google.com\">\n\n# Multiple Event Handlers\n\n\
    One problem with event attributes is that you can assign only one function to\
    \ them at a time. You may need an event to execute two different functions. This\
    \ is common for the onload event. Many scripts add event handlers to the window\
    \ object's onload event so that they wait until the page finishes loading before\
    \ running any code. Fortunately, this isn't too hard to overcome.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>Multiple Load Handlers</title>\n</head>\n\
    <body>\n    <script type=\"text/javascript\">\n        function addOnloadHandler(newHandler)\
    \ {\n            var previousHandler = window.onload;\n            window.onload\
    \ = function() {\n                if (typeof previousHandler === \"function\"\
    ) {\n                    previousHandler.call(this);\n                }\n    \
    \        }\n            newHandler.call(this);\n        }\n        addonloadHandler(function()\
    \ {\n          alert(\"first handler\");\n        });\n        addonloadHandler(function()\
    \ {\n          alert(\"second handler\");\n        });\n    </script>\n</body>\n\
    </html>\n```\n\nThe onloadHandler() function saves a reference to the current\
    \ value of window.onload before assigning it a new value. This lets you call both\
    \ the original event handler and the new event handler when the load event occurs.\n\
    \nThe actual event handler ends up being an anonymous function that retains access\
    \ to both the previousHandler and newHandler variables. It checks to see whether\
    \ the previousHandler is a function before calling it. Using call() allows you\
    \ to execute the event handlers in the proper context so that this refers to window.\n\
    \n# Event Methods\n\nThe DOM provides a more modern and flexible API for handling\
    \ events. The core methods are commonly referred to as the DOM Level 2 Event API.\
    \ (Using event attributes, as described earlier, is sometimes referred to as the\
    \ DOM Level 0 API.) None of these methods work in Internet Explorer.\n\n# addEventListener(eventType,\
    \ handler, capture)\n\nThe addEventListener() method explains its purpose right\
    \ in the name. The eventType argument is a string for the type, like \"submit,\"\
    \ \"mouseover,\" or \"keypress.\" The handler is a function. And capture is a\
    \ required Boolean value that I will describe in a moment. It will be false in\
    \ most cases.\n\n<p id=\"para\">Click here</p>\n\n```javascript\nvar para = document.getElementById(\"\
    para\");\npara.addEventListener(\"click\", eventHandler, false);\npara.addEventListener(\"\
    click\", otherHandler, false);\n\nfunction eventHandler(event) {\n  alert(\"You\
    \ clicked \" + this.nodeName);\n}\nfunction otherHandler(event) {\n  alert(\"\
    This was \" + event.type);\n}\n```\n\nremoveEventListener(eventType, handler,\
    \ capture)\n\nThe removeEventListener() method is also self-explanatory. All arguments\
    \ work exactly as they do in addEventListener(). To remove a particular event,\
    \ pass the same arguments you used in addEventListener().\n\n# <h1 id=\"header\"\
    >Click multiple times</h1>\n\n```javascript\nvar header = document.getElementById(\"\
    header\");\nheader.addEventListener(\"click\", selfRemovingEvent, false);\n\n\
    function selfRemovingEvent(event) {\n    alert(\"Listening for event\");\n   \
    \ this.removeEventListener(event.type, selfRemovingEvent);\n}\n```\n\nThis event\
    \ handler removes itself after being called, so you will see the alert only once.\n\
    \n> The Internet Explorer API is different and inconvenient enough that I never\
    \ use it. Not only does it work differently than the standard API, but it also\
    \ has problems with memory leaks... eventually slows down the browser. You can\
    \ write a function that uses the standard API or the Internet Explorer API depending\
    \ on what's available, but JavaScript libraries already handle and do it better.\
    \ You can look forward to handling cross-browser events with APIs like this:\n\
    \n```javascript\nlink.bind(\"click\", function(event) {\n    alert(\"Don't go\
    \ to \" + this.href);\n    event.preventDefault();\n});\n```\n"
  mdcn: "\n\n# 事件\n\n事件对于客户端编程至关重要。没有了事件，你就无法在点击链接和提交表单之外为网页添加交互性。\n\n使用事件本质上是响应动作或输入来执行函数。这些函数被称为事件监听器（event\
    \ listeners）或事件处理器（event handlers）。我更倾向于使用 *handler*（处理器），尽管某些方法名使用了 *listener*（监听器）。（函数是“处理”事件还是“监听”事件？对我来说，前者更符合逻辑。）\n\
    \n你可以通过两种方式为页面元素添加事件处理器，而 Internet Explorer 提供了一套与所有其他现代浏览器完全不同的事件 API，这给工作增添了麻烦。在所有浏览器中正确处理事件可能是棘手的，但幸运的是，JavaScript\
    \ 库通过抽象掉杂乱的细节让它变得简单得多。跨浏览器事件处理是我在编写 JavaScript 时几乎总是使用库的主要原因。\n\n本章将介绍原生 JavaScript\
    \ 中的事件处理，随后是不同类型事件的示例。这样，当你在本书后后的示例中使用 JavaScript 事件库函数时，你就能对底层发生了什么有所了解。\n\n\
    # 事件属性\n\n添加事件处理器最简单的方法是将函数赋值给 DOM 元素的事件属性。事件属性具有如 `onclick`、`onkeypress` 和 `onload`\
    \ 等名称。\n\n```javascript\nvar link = document.getElementsByTagName(\"a\")[0];\n\
    function clickHandler() {\n  alert(this.href);\n  return false;\n}\nlink.onclick\
    \ = handleClick;\n```\n\n假设你的 HTML 文档中有一个链接，点击它会显示一个带有链接 href 值的 alert 对话框。浏览器不会跳转到链接，因为它的默认行为被阻止了。\n\
    \n这种风格的事件处理在所有浏览器中都一样。对于简单任务，它是开始学习事件的好方法。\n\n# HTML 中的事件属性\n\n我将这种事件处理风格称为 *事件属性*（event\
    \ attributes）而不是 *属性*（properties），因为你可以将其作为 HTML 属性使用。\n\n```html\n<a href=\"\
    http://www.google.com\" onclick=\"alert(this.href); return false;\">点击这里</a>\n\
    ```\n\n我将不再展示更多这种风格的代码示例，因为避免混合使用 HTML 和 JavaScript 总是最好的做法。\n\n# 返回值\n\n事件属性上的处理器可以通过返回\
    \ `false` 来阻止事件的默认行为。对于链接的点击事件，这可以阻止浏览器跳转到链接并加载新页面。对于表单的提交事件，这可以阻止表单提交并加载新页面。\n\
    \n```javascript\nvar form = document.getElementsByTagName(\"form\")[0];\nfunction\
    \ preventSubmit() {\n  return false;\n}\nform.onsubmit = preventSubmit;\n```\n\
    \n# 事件属性方法的上下文\n\n浏览器在与其绑定的元素上下文中执行事件属性处理器。这意味着你可以通过 `this` 关键字访问该元素。\n\n```javascript\n\
    function whatDidICOnClick() {\n    console.log(\"你点击了 \", this);\n    return false;\n\
    }\nvar links = document.getElementsByTagName(\"a\");\nfor (var i = -1, link; link\
    \ = links[++i]); {\n    link.onclick=whatDidICOnClick;\n}\n```\n\n你点击了 <a href=\"\
    http://www.google.com\">\n\n# 多个事件处理器\n\n事件属性的一个问题是，你一次只能为其分配一个函数。你可能需要一个事件执行两个不同的函数。这在\
    \ `onload` 事件中很常见。许多脚本向 `window` 对象的 `onload` 事件添加事件处理器，以便它们在页面加载完成之前运行任何代码。幸运的是，这并不难克服。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>多个 Load 加载处理器</title>\n\
    </head>\n<body>\n    <script type=\"text/javascript\">\n        function addOnloadHandler(newHandler)\
    \ {\n            var previousHandler = window.onload;\n            window.onload\
    \ = function() {\n                if (typeof previousHandler === \"function\"\
    ) {\n                    previousHandler.call(this);\n                }\n    \
    \        }\n            newHandler.call(this);\n        }\n        addonloadHandler(function()\
    \ {\n          alert(\"第一个处理器\");\n        });\n        addonloadHandler(function()\
    \ {\n          alert(\"第二个处理器\");\n        });\n    </script>\n</body>\n</html>\n\
    ```\n\n`onloadHandler()` 函数在赋值新值之前，先保存了 `window.onload` 当前值的引用。这允许你在载加载事件发生时，同时调用原始的事件处理器和新的事件处理器。\n\
    \n实际的事件处理器最终变成了一个匿名函数，它保留了对 `previousHandler` 和 `newHandler` 变量的访问权限。它在调用 `previousHandler`\
    \ 之前会检查它是否是一个函数。使用 `call()` 允许你在正确的上下执行事件处理器，这样 `this` 就会指向 `window`。\n\n# 事件方法\n\
    \nDOM 提供了一个更现代、更灵活的 API 来处理事件。核心方法通常被称为 DOM Level 2 事件 API。（使用前文描述的事件属性有时被称为 DOM\
    \ Level 0 API。）这些方法在 Internet Explorer 中均无法工作。\n\n# addEventListener(eventType,\
    \ handler, capture)\n\n`addEventListener()` 方法直接在名称中就解释了它的用途。`eventType` 参数是一个表示类型的字符串，例如\
    \ \"submit\"、\"mouseover\" 或 \"keypress\"。`handler` 是一个函数。`capture` 是一个必需的布尔值，我稍后会描述。在大多数情况下它为\
    \ `false`。\n\n<p id=\"para\">点击这里</p>\n\n```javascript\nvar para = document.getElementById(\"\
    para\");\npara.addEventListener(\"click\", eventHandler, false);\npara.addEventListener(\"\
    click\", otherHandler, false);\n\nfunction eventHandler(event) {\n  alert(\"你点击了\
    \ \" + this.nodeName);\n}\nfunction otherHandler(event) {\n  alert(\"这是 \" + event.type);\n\
    }\n```\n\nremoveEventListener(eventType, handler, capture)\n\n`removeEventListener()`\
    \ 方法同样自而易懂。所有参数的工作方式都与 `addEventListener()` 完全相同。要移除特定事件，请传递你在 `addEventListener()`\
    \ 中使用的相同参数。\n\n# <h1 id=\"header\">点击多次</h1>\n\n```javascript\nvar header = document.getElementById(\"\
    header\");\nheader.addEventListener(\"click\", selfRemovingEvent, false);\n\n\
    function selfRemovingEvent(event) {\n    alert(\"正在监听事件\");\n    this.removeEventListener(event.type,\
    \ selfRemovingEvent);\n}\n```\n\n此事件处理器在调用后会移除自己，因此你只会看到一次 alert。\n\n> Internet\
    \ Explorer API 既不同又不方便，我从不使用它。它不仅工作方式与标准 API 不同，而且存在内存泄漏问题……最终会减慢浏览器。你可以编写一个根据可用性使用标准\
    \ API 或 Internet Explorer API 的函数，但 JavaScript 库已经处理了这些并做得更好。你可以期待使用类似这样的 API\
    \ 来处理跨浏览器事件：\n\n```javascript\nlink.bind(\"click\", function(event) {\n    alert(\"\
    不要去 \" + this.href);\n    event.preventDefault();\n});\n```\n\n"
