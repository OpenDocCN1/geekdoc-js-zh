- md: "\n## Object-Oriented Patterns\n\nYou may already be familiar with an object-oriented\
    \ language such as Java, PHP, or ActionScript 3 that includes concepts like modules\
    \ and classes. JavaScript doesn't have these concepts built into the language,\
    \ but it is flexible enough to simulate them with custom data types and prototypes.\
    \ You can even simulate inheritance.\n\nInheritance is a way of modeling your\
    \ data with general data types that have common functionality and specific data\
    \ types that have specific functionality. Start with a general data type, as shown\
    \ here:\n\n```\nvar Person = function(name) {\n  this.name = name;\n}\n\nPerson.prototype\
    \ = {\n  says : function(message) {\n    console.log(this.name + \" says \" +\
    \ message);\n  }\n}\n```\n\n```\nvar lenny = new Person(\"Lenny\");\nlenny.says(\"\
    Hello!\");\n\"Lenny says Hello!\"\n```\n\nNow you can make a more specific type\
    \ of person, but it should still have the same name attribute, as well as the\
    \ says() method.\n\n```\nvar Jedi = function(name, saberColor) {\n  Person.call(this,\
    \ name);\n  this.saberColor = saberColor;\n}\n```\n\nPerson.call(this, name) lets\
    \ you reuse the Person() constructor function to change instances of this new\
    \ data type. Then you can make it more specific by using the new saberColor argument.\n\
    \n```\nJedi.prototype = new Person();\n```\n\nYou assign a person object as the\
    \ Jedi prototype so that the Jedi objects share properties and methods of People\
    \ objects.\n\n```\nJedi.prototype.lightSaber = function() {\n  console.log(\"\
    Shrruumm! Shr-zzmm!\");\n};\n```\n\nNow you can add new properties and methods\
    \ to the Jedi data type that don't exist on the Person data type.\n\n```\nvar\
    \ yoda = new Jedi(\"Yoda\", \"blue\");\nvar macewindu = new Jedi(\"Mace Windu\"\
    , \"purple\");\n```\n\n> yoda.says(\"Do or not, there is no try.\")\n\"Yoda says\
    \ Do or not, there is no try.\",\n\nInstances of the Jedi data type share the\
    \ methods and properties of the Person data type, so you can still use the says()\
    \ method on the yoda object.\n\n```\nmacewindu.lightSaber();\n\"Shrruumm! Shr-zzmm!\"\
    \n```\n\nThese instances have new methods to use that are specific to the Jedi\
    \ data type.\n\nYou can use the instanceof operator to determine the type of an\
    \ object.\n\n```\nlenny instanceof Person;\ntrue\n```\n\n```\nlenny instanceof\
    \ Jedi;\nfalse\nyoda instanceof Person;\ntrue\nyoda instanceof Jedi;\ntrue\n```\n\
    \nSince Jedi inherits from Person, yoda is an instance of both data types.\n\n\
    Inheritance is the reason why all objects have methods like toString() and hasOwnProperty().\
    \ All data types inherit from Object.\n\n```\nlenny instanceof Object;\ntrue\n\
    myArray instanceof Object;\ntrue\n```\n\n## Namespacing\n\nNamespacing is a common\
    \ technique for keeping code separate and reducing naming conflicts. In JavaScript,\
    \ all you need to do is create objects that store your code and data away from\
    \ other objects. Often, you name these objects after your Web sites because URLs\
    \ are guaranteed to be unique. Also, URLs use periods, which look a whole lot\
    \ like JavaScript dot operators.\n\n> Many other languages provide special language\
    \ features to support namespacing. JavaScript lacks these features, but objects\
    \ are flexible enough to get some of the benefits of namespacing to better organize\
    \ your code.\n\n```\nvar PEACHPIT = {};\nPEACHPIT.com = {};\nPEACHPIT.com.sayHello\
    \ = function() {\n```\nconsole.log(\"Hello!\");\n;\n```\n\nNaming your top object\
    \ in all capitals indicates to yourself and others to be careful never to reassign\
    \ that variable.\n\nThe reason for namespacing is that you may want to use a script\
    \ on your pages that defines its own sayHello() function. Because these functions\
