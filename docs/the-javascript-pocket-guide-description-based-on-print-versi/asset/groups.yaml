- md: "\n# change\n\nThe change event occurs after the user changes the value of an\
    \ editable element. It usually occurs after any mouse or keyboard events.\n\n\
    ```html\n<select name=\"select\" id=\"mySelect\">\n  <option value=\"4\">Option\
    \ 1</option>\n  <option value=\"8\">Option 2</option>\n  <option value=\"15\"\
    >Option 3</option>\n</select>\n```\n\n```javascript\nvar select = document.getElementById(\"\
    mySelect\");\nselect.onchange = function(event) { // Note: corrected from .on\
    \ to .onchange\n  var newValue = this.options[this.selectedIndex].value;\n  alert(\"\
    \ New value is \" + newValue);\n}\n```\n\n# submit\n\nThe submit event applies\
    \ only to <form> elements. It occurs when the user submits a form. You can prevent\
    \ its default behavior, which is useful for stopping the submission if there are\
    \ errors in the fields.\n\n# Other Events\n\nThese events pertain to mouse and\
    \ keyboard use and are especially relevant to form inputs.\n\n# focus\n\nAn element\
    \ has focus when it can receive keyboard events. By default, the only elements\
    \ that can receive focus are the document, links, and form inputs. Users typically\
    \ change focus from one element to another by pressing the Tab key. The focus\
    \ event does not bubble up the DOM tree.\n\nYou can make any element focusable\
    \ by setting its tabindex attribute to 0. Then the user can tab to the element\
    \ and control it with the keyboard.\n\n# blur\n\nThe blur event occurs when an\
    \ element loses focus. Like the focus event, it does not bubble.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_212_0.png)\n\
    \n# Libraries\n\nThroughout this book you've seen helper functions for strings,\
    \ arrays, elements, and events. You may want to use these or similar functions\
    \ in your code. And when you start your second project, you may decide to copy\
    \ much of this code over so you don't have to start from scratch. Ta-da! You've\
    \ created a library!\n\nThe most important reason for using a library is to avoid\
    \ reinventing the wheel for each project. JavaScript has a relatively small set\
    \ of built-in functions, so collections of reusable code can be great time-savers.\n\
    \nJavaScript programmers also spend much of their time dealing with the differences\
    \ between browsers, especially between Internet Explorer and all the other modern\
    \ browsers like Firefox and Chrome. Sometimes it's a matter of different implementations,\
    \ such as the standard addEventListener() and the nonstandard attachEvent(). Other\
    \ times, a browser might completely lack a feature, such as querySelector(), and\
    \ a library can fill that gap. The solution won't ever perform quite as well as\
    \ the native function, but it's usually better than having it at all.\n\nA less\
    \ important but influential aspect of libraries has to do with coding style. JavaScript\
    \ is an especially flexible language, and no two programmers write code exactly\
    \ the same way. JavaScript libraries however, tend to enforce a particular style.\
    \ This can be through which language features they use, their naming conventions,\
    \ or their design and organization. A unified style makes it easier to read similar\
    \ code and work with other programmers.\n\nLastly, nearly every library is open\
    \ source and free to use in your projects. This encourages innovation, and many\
    \ developers release components and tools for use with the library. Using a library\
    \ allows you to take advantage of the hard work of hundreds of other JavaScript\
    \ programmers all over the world.\n\n# Choosing a Library\n\nDoz of JavaScript\
    \ libraries are available. On the whole, anything you do in one library you can\
    \ do just as well in another. So, how do you choose?\n\nFirst, does the library\
    \ do what you need to do? If you need complicated features, such as sophisticated\
    \ data grids or drawing capabilities, you may want to consider certain libraries\
    \ over others. If your needs are simple, most popular libraries will fit the bill.\n\
    \nAnother consideration is if you need your library to play well with other code.\
    \ In Chapter 6, you learned about adding methods to built-in prototypes and how\
    \ that can possibly conflict with other code. Some libraries are built on augmenting\
    \ Array.prototype and other built-in objects, while others keep all their functions\
    \ and properties in a single namespace to avoid conflicts.\n\nFile size is an\
    \ important consideration because the user will have to download the library along\
    \ with your own code. A large library may have a lot of code that you don't even\
    \ use but still makes your pages load slower. Fortunately, large libraries are\
    \ getting smarter with lazy loading techniques, and companies such as Google and\
    \ Yahoo! provide content distribution networks for many popular libraries.\n\n\
    In addition to the features provided by the library itself, you should consider\
    \ what other code is available for your library. Maybe the library developers\
    \ don't see a reason to include an image slideshow component in the library, but\
    \ many other independent developers have probably created and released one that\
    \ you can leverage. Take a look at the source code of third-party components for\
    \ clearly written and well-commented code before deciding to use it on your sites.\n\
    \nLastly and most importantly, choosing a JavaScript library is a matter of personal\
    \ style. Some libraries will just make more sense to you in how they name functions\
    \ and organize the code. In the end, you can achieve the same goals no matter\
    \ what library you use, so pick one that feels right to you.\n\n![](img/4a8fa16ebbe3c330347de80256b877b4_214_0.png)\n\
    \nLearning a library is like learning an entirely new language on top of JavaScript.\
    \ This book obviously can't cover all the specifics of any one library. Instead,\
    \ when a tutorial uses a library, it will include a short glossary at the end\
    \ of the chapter that briefly explains the functions.\n\nIn addition, you should\
    \ use the online documentation at each library's website, as well as myriad \"\
    cheat sheets\" available online.\n\n# Using Libraries with This Book\n\nMany of\
    \ the following chapters use JavaScript libraries. The easiest way to use the\
    \ library is to use Yahoo!'s own distribution network. If you want to follow the\
    \ tutorials offline, you'll need to download the libraries from their respective\
    \ sites.\n\nYUI 3 uses some interesting techniques for including parts of the\
    \ library, as I'll discuss in a moment. Google's Ajax Libraries (http://code.google.com/ajaxlibs/)\
    \ is a content distribution network that provides copies of recent versions of\
    \ JavaScript.\n\nI'm including the most recent versions of these libraries at\
    \ the time of writing, but sometimes changes in new versions will break your code.\
    \ Use the version I've specified if you're running into problems.\n\n# jQuery\n\
    \nhttp://www.jquery.com\n\njQuery is the most popular JavaScript library on the\
    \ Web. Created by John Resig in 2006, it is a general-purpose library that emphasizes\
    \ interacting with HTML elements. It is a single JavaScript file weighing 59KB\
    \ (compressed).\n\nFor the last couple of years, I've used jQuery more than any\
    \ other library. I appreciate that it's a relatively small library with a manageable\
    \ number of functions and utilities.\n\n# Coding with jQuery\n\nUsing jQuery in\
    \ your pages is quite simple; just include the entire library in your HTML document:\n\
    \n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.1/jquery.min.js\"\
    \ type=\"text/javascript\"></script>\n<script type=\"text/javascript\">\n  (function($)\
    \ {\n    $(\"#element\").addClass(\"jquery-ied\");\n  })(jQuery); // Self-invoking\
    \ function\n</script>\n```\n\nThe entire library is stored on the jQuery variable,\
    \ which is often aliased as $. Because $ is a common variable name in other libraries,\
    \ it's a common practice to pass the jQuery variable as an argument in a self-invoking\
    \ function and aliasing it yourself, as shown in the previous example.\n\nYou\
    \ can also start your scripts by attaching a DOMContentLoaded event handler:\n"
  mdcn: "\n\n# change\n\n`change` 事件在用户更改可编辑元素的值后发生。它通常发生在任何鼠标或键盘事件之后。\n\n```html\n\
