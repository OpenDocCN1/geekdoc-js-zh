    \ = [1, 2, 3, 4, 5];\nfor (var i = 0, l = myArray.length; i < l; i++) {\n  console.log(myArray[i]);\n\
    }\n```\n\nThe one important difference is in the setup expression, where I declare\
    \ both i and l at the same time. I do this because the test is executed every\
    \ time the loop runs, and I can save a few milliseconds by saving the value of\
    \ length to a variable from the start.\n\nMy second favorite loop pattern is used\
    \ only if every element in the array is \"truthy\" (not zero, false, an empty\
    \ string, null, or undefined), so I use it only in special cases. The most common\
    \ case is when I'm looping over elements in a page.\n\n```\n// Get a collection\
    \ of <a> tags from the page\n// and loop over them\nvar allLinks = document.getElementsByTagName(\"\
    a\");\nfor (var i = -1, link; link = allLinks[++i]); {\n  console.log(link);\n\
    }\n```"
