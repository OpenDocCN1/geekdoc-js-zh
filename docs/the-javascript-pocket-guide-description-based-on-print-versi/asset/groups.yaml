- md: "\n```javascript\nvar gum = { price : 0.79 };\nvar mints = { price : 1.29 };\n\
    var candy = { price : 1.49 };\nvar products = [mints, candy, gum];\nproducts.sort(function(a,\
    \ b) {\n  return a.price - b.price;\n});\n```\n\n[Object price=0.79, Object price=1.29,\
    \ Object price=1.49]\n\n> In this example, I passed an anonymous function to the\
    \ sort() method instead of a reference to a declared function. If you need to\
    \ use a function only once, this is a great style to adopt.\n\nThe sort() function\
    \ changes the original array and returns a reference to the same array.\n\n##\
    \ Converting Arrays to Strings\n\nStrings have the split() function, so it makes\
    \ sense that arrays would have a method to perform the opposite operation.\n\n\
    ## join([delimiter])\n\nThe join() method is the opposite of the split() method\
    \ for strings. It turns each value of an array into strings and concatenates them\
    \ together with commas between each value. The optional delimiter argument can\
    \ change the comma to any other string.\n\n```javascript\n[\"a\", \"b\", \"c\"\
    ].join();\n\"a,b,c\"\n[\"a\", \"b\", \"c\"].join(\"--\");\n\"a--b--c\"\n[\"a\"\
    , \"b\", \"c\"].join(\"++\");\n\"a+b+c\"\n```\n\nIn the third example of the previous\
    \ code, the second value of the array is another array. Before joining the values\
    \ with \"+\", it converts the [\"b\", \"c\"] array into a string with the toString()\
    \ method, which may not be the expected result.\n\nJoining string values together\
    \ is a great way to create long strings out of many parts. Consider these two\
    \ examples:\n\n```javascript\nvar longString = \"\";\nfor (var i = 0; i < 100;\
    \ i++) {\n  longString += \"shorter string no. \" + i + \"\\n\";\n}\n\nvar stringArray\
    \ = [];\nfor (var i = 0; i < 100; i++) {\n  stringArray.push(\"shorter string\
    \ no. \" + i);\n}\nvar longString = stringArray.join(\"\\n\");\n```\n\nThe second\
    \ example is often slightly faster, especially in Internet Explorer.\n\n## toString()\n\
    \nThe toString() method acts just like join() with no arguments.\n\n## Functions\n\
    \nFunctions are remarkably flexible in JavaScript. That flexibility provides a\
    \ lot of power, but it can also create confusion, especially in how functions\
    \ interact with variables and objects. This chapter covers some pretty advanced\
    \ concepts; some nuances might not stick with you right away, but once you spend\
    \ some time with functions, you'll really start to appreciate the power of the\
    \ JavaScript language.\n\n## Creating Functions\n\nThe two ways to create functions\
    \ both use the function keyword, so the differences between them aren't immediately\
    \ apparent.\n\n## Declarations\n\nVariable declarations and function declarations\
    \ operate similarly. They start with a keyword (var or function), followed by\
    \ an identifier. Function declarations add lists of arguments in parentheses followed\
    \ by blocks in curly braces.\n\n```javascript\nfunction functionName(arg1, arg2,\
    \ argN) {\n  // Block of statements\n}\n```\n\nJavaScript interpreters look at\
    \ function declarations before everything else in the script, so you can call\
    \ them even before you declare them.\n\nmyFunc();\n\n```javascript\nfunction myFunc()\
    \ {\n  // Statements\n}\n```\n\n## Expressions\n\nYou don't have to declare a\
    \ name for a function, though the following example is pretty useless (and requires\
    \ extra parentheses so as not to throw an error):\n\n```javascript\n(function()\
    \ {\n  // Statements\n});\n```\n\nFunctions expressed without a name are *function\
    \ expressions* and are sometimes referred to as *anonymous functions*. You can\
    \ store a function expression on a variable or use it as a return value in another\
    \ function.\n\n```javascript\nvar functionName = function(arg1, arg2, argN) {\n\
    \  // Statements\n};\n\nfunction outerFunction() {\n  // This function returns\
    \ an anonymous function\n  return function() {\n    console.log(\"inner function\"\
    );\n  }\n}\n```\n\n> **note** You don't need to put a semicolon after the closing\
    \ curly bracket in a function declaration. Function expressions, on the other\
    \ hand, should always end with a semicolon.\n\n## Self-invoking Functions\n\n\
    Sometimes you may want to call a function immediately, for reasons explained in\
    \ the “Closures” section later in this chapter.\n\n```javascript\n(function()\
    \ {\n  // Executed immediately\n})()\n```\n\nYou can't immediately invoke a function\
    \ declaration, so parentheses are required around the function to indicate that\
    \ this is a function expression.\n\n## Arguments\n\nFunction arguments are very\
    \ flexible in JavaScript. Named arguments in the function signature are just for\
    \ convenience more than anything else. You don't need to provide a value for each\
    \ argument.\n\n```javascript\nfunction myFunc(arg0, arg1, arg2) {\n  console.log(arg0);\n\
    \  console.log(arg1);\n  console.log(arg2);\n}\n```\n\nmyFunc(\"a\", \"b\"); //\
    \ Left off the third argument\n\n\"a\"\n\"b\"\nundefined\n\nYou can also provide\
    \ more argument values than defined in the function signature. All of the arguments\
    \ are stored in a local variable called arguments for easy access.\n\n```javascript\n\
    function myFunc(arg0) {\n  console.log(arg0);\n  console.log(arguments[1]); //\
    \ The second argument\n  console.log(arguments[2]); // The third argument\n}\n\
    ```\n\nmyFunc(\"a\", \"b\");\n\n\"a\"\n\"b\"\n\"c\"\n\n## Default Values for Arguments\n\
    \nSince arguments are optional, you may want to provide default values. In most\
    \ cases, you can use the OR (||) operator to assign a default value if it is undefined.\n\
    \n```javascript\nfunction sayHello(name) {\n  name = name || \"Lenny\";\n  console.log(\"\
    Hi \" + name);\n}\n```\n\nsayHello();\n\"Hi Lenny\"\nsayHello(\"Sally\");\n\"\
    Hi Sally\"\n\n## Objects as Arguments\n\nYou may want to write functions that\
    \ take many arguments, some of which are optional.\n\n```javascript\nfunction\
    \ drawElement(color, border, width, height,\n  left, top, zIndex) {\n  // Make\
    \ and display an element with these variables\n}\ndrawElement(\"red\", 4, null,\
    \ null, 100, 10);\n```\n\nFunction signatures like this aren't ideal for a couple\
    \ of reasons:\n\n- It's hard to remember the exact order of arguments.\n- You\
    \ have to specify null values when you want to use the default value in the middle\
    \ of the signature.\n- Did you notice that I forgot to specify a value for zIndex?\
    \ It's hard to count all those arguments\n\nPassing multiple values in a single\
    \ object is often a better solution:\n\n```javascript\nfunction drawElement(options)\
    \ {\n  // Make and display an element with the values in options\n}\ndrawElement({\n\
    \  color: \"red\",\n  border: 4,\n  left: 100,\n  top: 10\n});\n```\n\nSpecifying\
    \ default values is a little bit trickier with this technique. You'll need to\
    \ create an object holding all the defaults and merge it with the options object.\n\
    \n```javascript\ndrawElement.DEFAULTS = {\n  color: \"blue\",\n  border: 0,\n\
    \  width: 50,\n  height: 50,\n  left: 0,\n  top: 0,\n  zIndex: 1\n};\n```\n"
