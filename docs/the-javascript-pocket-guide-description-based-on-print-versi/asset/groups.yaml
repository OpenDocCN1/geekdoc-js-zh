    # YUI Gallery


    http://yuilibibrary.com/gallery/


    The YUI 3 Gallery is a great resource for finding a large number of components
    built by third-party developers for YUI 3. These range from user interface widgets
    such as accordions and date pickers to sophisticated utilities for Ajax and form
    validation.


    # MooTools


    http://mootools.net/


    MooTools arrived in 2006 alongside jQuery and many other libraries. It has many
    of the same capabilities as jQuery and YUI 3, but its authors took a different
    approach to organizing the code and providing features.


    # Coding with MooTools


    You can include the entire MooTools Core library from Google''s Ajax Libraries
    API:


    ```

    <script src="http://ajax.googleapis.com/ajax/libs/mootools/1.2.4/mootools-yui-compressed.js"
    type="text/javascript"></script>

    ```


    MooTools also gives you the ability to create a custom version of the library
    that includes only the functionality you need for your scripts. The MooTools Builder
    (http://mootools.net/core) has checkboxes for each component of the library if
    you desire a slimmer, more efficient library file.'
  - '[PAGE 222]


    MooTools also wraps DOM elements using a custom Element data type that provides
    additional methods and properties to facilitate finding, creating, and manipulating
    elements. MooTools contains many of the same element methods as jQuery, but it
    tends to use longer and arguably clearer method names.


    The http://mootorial.com/ Web site links to several great tutorials to get a feel
    for MooTools.


    # Namespacing


    The biggest difference between MooTools and the libraries discussed earlier is
    in how it organizes its code. Unlike jQuery and YUI 3, MooTools spreads its properties
    and functions across several global variables, including $, $$, A, Class, Element,
    F, and Request. It also adds methods to the prototypes of built-in objects such
    as Function and Array. Many programmers find this to be a clearer or more useful
    approach to library organization, but you do have to be more careful about conflicts
    between global variables.


    # MooTools More


    http://mootools.net/more


    The MooTools More library contains a number of plug-ins to the Core library for
    form and dragging functionality, additional effects, interface widgets, and internationalization
    and translation utilities. Like with the Core library, you can customize your
    library files to include only the plug-ins you need.'
