    \ separate methods for a single line of code, but it will become clear why I structured\
    \ the code this way when you extend the Menu class.\n\nClosing any other open\
    \ submenu is pretty simple: Just call the closeLink() method for all the links.\n\
    \n```javascript\ncloseOtherLinks : function(currentLink) {\n  var otherLinks =\
    \ $(this.links).erase(currentLink);\n  otherLinks.each(this.closeLink, this);\n\
    },\n```\n\nThe $A() function is a MooTools helper that adds useful methods to\
    \ an array. The method you want here is erase(), which removes the given item\
    \ from the array.\n\nThe each() method runs a function for each item in an array,\
    \ but just like event handlers, you must make sure this.closeLink() executes in\
    \ the context of the Menu object. Fortunately, you can pass the context as the\
    \ second argument in each().\n\n## Clicking the Menus\n\nThe final method in the\
    \ Menu class is the event handler for the click event on the `<body>` element.\
    \ Recall from Chapter 11 that click events bubble up the DOM tree all the way\
    \ to the document, so you need to check whether the click event originated from\
    \ an element inside the menu.\n\n```javascript\nonOutsideClick : function(event)\
    \ {\n  if (! $(event.target).getParents().contains(this)) {\n    this.closeOtherLinks();\n\
    \  }\n}\n```\n"
