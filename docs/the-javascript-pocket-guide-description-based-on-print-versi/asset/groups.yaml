    ![](img/4a8fa16ebbe3c330347de80256b877b4_156_0.png)


    This chapter could easily be titled something like “Scripting HTML,” but the DOM
    is such an important concept that it deserves marquee status. DOM stands for “Document
    Object Model,” which is a concise way of explaining exactly what it is: the model
    (or representation) for the objects in an HTML document. More specifically, it
    is a hierarchy of data types for HTML documents, links, forms, comments, and everything
    else that can be represented in HTML code.


    Like everything else in client-side scripting, the DOM has a muddy history, and
    resulting implementations across browsers are more complicated for it. Web standards
    have smoothed out many rough edges, but you still have to account for missing
    methods and differences in implementations, especially in Internet Explorer. (Chapter
    12 will show how to take advantage of code that lets you ignore all these differences.)'
  - '[PAGE 157]


    # Nodes


    Nodes are the general data type for objects in the DOM. They have attributes,
    and some nodes can contain other nodes.


    There are several node types, which represent more specific data types for HTML
    elements. Node types are represented by numeric constants, so if you need to determine
    the type of a node, compare its nodeType property with the values in Table 10.1.


    # Table 10.1 Common Node Types


    | Type | Constants |

    | --- | --- |

    | Document, the element at the top of the DOM tree | Node.DOCUMENT_NODE === 9
    |

    | Element, the general type for nodes represented by HTML tags | Node.ELEMENT_NODE
    === 1 |

    | Text, representing simple text in HTML including whitespace | Node.TEXT_NODE
    === 3 |

    | Comment, for <!-- html comments --> | Node.COMMENT_NODE === 8 |

    | DocumentFragment, the top element for abstract DOM trees | Node.DOCUMENT_FRAGMENT_NODE
    === 11 |


    Notice that text and comments are also nodes in the DOM, even though it''s rare
    that you''ll need to retrieve and manipulate them.


    # Node Collections


    Collections are arraylike objects that hold lists of nodes. Unlike arrays, these
    lists are “live,” meaning that if the DOM changes (nodes are added, removed, or
    reordered), the collection automatically updates to reflect those changes.'
  - '[PAGE 158]


    As an example, say you have three paragraphs in your page, like this:


    ```

    <p>one</p>

    <p>two</p>

    <p>three</p>

    ```


    You can retrieve a collection of those nodes with the getElementsByByTagName("p")
    method. Its length property has the value of 3.


    ```

    var paragraphs = document.getElementsByTagName("p");

    console.log(paragraphs.length);

    3

    ```


    Now, create a new paragraph, and append it to the document body.


    ```

    var newPara = document.createElement("p");

    newPara.appendChild(document.createTextNode("four"));

    document.body.appendChild(newPara);

    ```


    The collection of paragraphs automatically updates to include the new paragraph
    as soon as it is added to the page.


    ```

    console.log(paragraphs.length);

    4

    ```


    If you need array methods such as splice() or reverse(), you have to convert the
    collection to an array by looping over each item and adding the items to a real
    array. However, this new array is not live, so it will not automatically update
    to reflect changes to the page.


    # Node Trees


    Nodes are organized in hierarchies, or trees. Nodes that contain other nodes are
    parent nodes. Nodes contained in a parent node are child nodes. Text and comment
    nodes can be child nodes, but they can''t be parent nodes.'
