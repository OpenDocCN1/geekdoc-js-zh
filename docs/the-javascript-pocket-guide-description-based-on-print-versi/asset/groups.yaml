    \    break;\n  case \"o\":\n    console.log(\"letter is o\");\n    break;\n  case\
    \ \"u\":\n    console.log(\"letter is y\");\n    break;\n  default:\n    console.log(\"\
    letter isn't a vowel\");\n    break;\n}\n```\n\n# try/catch/finally\n\nYour code\
    \ will throw an error on occasion. Sometimes your code is perfectly valid, but\
