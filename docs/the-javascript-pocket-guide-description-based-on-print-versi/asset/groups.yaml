    \ c is distanceToTravel (or \"change\"), b is begin, e is end, and d is duration.\n\
    \n```\nfunction timeBasedEasing(box, b, e, d, easing) {\n  var c = e - b,\n  startTime\
    \ = new Date();\n\n  function move() {\n    var t = new Date() - startTime;\n\n\
    \    if (t < d) {\n      box.style.left = easing(t, b, c, d) + \"px\"\n      setTimeout(move,\
    \ 0);\n    } else {\n      box.style.left = e + \"px\"\n    }\n  }\n  move();\
    \ // Start the animation\n}\n```\n\nThe function is basically identical to timeBased(),\
