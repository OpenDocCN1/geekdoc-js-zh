    ```javascript\nfunction easeOutExpo(t, b, c, d) {\n  return (t==d) ? b+c : c *\
    \ (-Math.pow(2, -10 * t/d) + 1) + b;\n}\ntimeBasedEasing(document.getElementById(\"\
    box\"), 0, 200, 1000,\neaseOutExpo);\n```\n\n动画开始得快得多，并“平滑地”停止。“Ease in”版本看起来所示：\n\
