- md: "\n## querySelectorAll(selector)\n\nNot available in Internet Explorer 6 or\
    \ 7\n\nThe querySelectorAll() method works the same as querySelector() except\
    \ that it returns all elements that match selector. Unlike getElementsByTagName(),\
    \ querySelectorAll() returns a static list that doesn't automatically update when\
    \ the DOM changes.\n\n## Creating Nodes\n\nThe DOM provides a few methods to create\
    \ new nodes. In addition, Microsoft created a nonstandard way of creating nodes\
    \ that had enough benefits to be adopted by modern browsers.\n\n## Using DOM Methods\n\
    \nThe DOM methods are great for when you want to create one node at a time.\n\n\
    ## createElement(tagName)\n\nCreating element nodes is as simple as passing the\
    \ desired tag name to document.createElement(). Unlike many DOM methods, createElement()\
    \ is available only on the document object.\n\n```\ndocument.createElement(\"\
    div\");\n<div>\ndocument.createElement(\"a\");\n<a>\ndocument.createElement(\"\
    body\");\n<body></body>\n```\n\n## Creating HTML5 Elements\n\nHTML5 introduces\
    \ several new elements for richer semantics and better document structure, such\
    \ as <article>, <aside>, and <nav>. By default, Internet Explorer handles these\
    \ new elements so poorly that they become unusable. Unfortunately, you can pass\
    \ any tag name to createElement(). Creating a single copy of a new element causes\
    \ Internet Explorer to treat it as if it was a <div>.\n\nThere are a few \"HTML5\
    \ shim\" scripts available online that add support for all of the new HTML5 elements.\n\
    \n## createTextNode(nodeValue)\n\nYou can use the createTextNode() method to add\
    \ text inside an element node.\n\n```\n<p id=\"myPara\"></p>\n```\n\n```\nvar\
    \ textNode = document.createTextNode(\"Inserted Text\");\ndocument.getElementById(\"\
    myPara\").appendChild(textNode);\n<TextNode textContent=\"Inserted Text\">\n```\n\
    \nThe paragraph element now looks like this:\n\n```\n<p id=\"myPara\">Inserted\
    \ Text</p>\n```\n\n## cloneNode(deep)\n\nYou can create a copy of a node with\
    \ cloneNode(). The deep argument is required. If deep is true, cloneNode() copies\
    \ the entire tree of the node, including all element and text nodes. If it is\
    \ false, it copies only the node in question.\n\n```\n<p id=\"myPara\">Click <a\
    \ href=\"#\">here</a></a></p>\n```\n\n```\nvar myPara = document.getElementById(\"\
    myPara\");\nvar deepClone = myPara.cloneNode(true);\nvar shallowClone = myPara.cloneNode(false);\n\
    deepClone.childNodes.length;\n3\nshallowClone.childNodes.length;\n0\n```\n\n##\
    \ Using innerHTML\n\nMicrosoft created the innerHTML property on element nodes\
    \ as a quick-and-dirty way of setting the HTML contents of an element. Simply\
    \ assign the property to a string with HTML tags.\n\n```\nvar myPara = document.getElementById(\"\
    myPara\");\nmyPara.innerHTML = 'Click <a href=\"#\">here</a></a>';\n```\n\nRegardless\
    \ of the former contents of myPara, it now looks like the following because innerHTML\
    \ completely overwrites the element's content:\n\n```\n<p id=\"myPara\">Click\
    \ <a href=\"#\">here</a></a></p>\n```\n\nYou can now retrieve the newly created\
    \ <a> tag like so:\n\n```\nvar newLink = myPara.getElementsByTagName(\"a\")[0];\n\
    ```\n\nThe benefit of this technique is that you can make massive changes to the\
    \ DOM with only a single line of code. Achieving the same result with createElement()\
