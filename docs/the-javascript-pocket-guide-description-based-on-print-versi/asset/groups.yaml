    # Chapter 3: Strings


    ```

    ["a", "b", "c", "d", "e"]

    "a sentence split by words".split(" "); // Split spaces

    ["a", "sentence", "split", "by", "words"]

    ["alblcl|".split("|"); // The parts can be empty strings

    ["", "a", "b", "c", ""]\n"a,b,c,d,e".split(); // No delimiter

    ["a,b,c,d,e"]

    ```


    If you specify a numeric limit as the second argument, the resulting array contains
    only the specified number of items.


    ```

    "a,b,c,d,e".split(",", 3);

    ["a", "b", "c"]

    ```


    # Search and Replace


    You often need to know whether a string contains another string or matches a certain
    pattern. Once you''ve found the string or pattern, you can replace it with another
    string. It''s surprising how many different ways you can use the following methods.


    # indexOf(substring[, start])


    The indexOf() method returns the position of the first occurrence of a substring.
    If the substring doesn''t exist inside the string, it returns -1. If you specify
    a start argument, it starts searching for the substring after that position in
    the string.


    ```

    "hello world".indexOf("world");

    6

    "hello world".indexOf("World"); // It''s case sensitive

    -1

    "hello world".indexOf("o", 5); // Skips the first o

    7

    ```'
