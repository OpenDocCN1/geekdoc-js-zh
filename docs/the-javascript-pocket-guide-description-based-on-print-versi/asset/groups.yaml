    # Libraries


    Throughout this book you''ve seen helper functions for strings, arrays, elements,
    and events. You may want to use these or similar functions in your code. And when
    you start your second project, you may decide to copy much of this code over so
    you don''t have to start from scratch. Ta-da! You''ve created a library!


    The most important reason for using a library is to avoid reinventing the wheel
    for each project. JavaScript has a relatively small set of built-in functions,
    so collections of reusable code can be great time-savers.


    JavaScript programmers also spend much of their time dealing with the differences
    between browsers, especially between Internet Explorer and all the other modern
    browsers like Firefox and Chrome. Sometimes it''s a matter of different implementations,
    such as the standard'
  - '[PAGE 213]


    addEventListener() and the nonstandard attachEvent(). Other times, a browser might
    completely lack a feature, such as querySelector(), and a library can fill that
    gap. The solution won''t ever perform quite as well as the native function, but
    it''s usually better than having it at all.


    A less important but influential aspect of libraries has to do with coding style.
    JavaScript is an especially flexible language, and no two programmers write code
    exactly the same way. JavaScript libraries however, tend to enforce a particular
    style. This can be through which language features they use, their naming conventions,
    or their design and organization. A unified style makes it easier to read similar
    code and work with other programmers.


    Lastly, nearly every library is open source and free to use in your projects.
    This encourages innovation, and many developers release components and tools for
    use with the library. Using a library allows you to take advantage of the hard
    work of hundreds of other JavaScript programmers all over the world.


    # Choosing a Library


    Doz of JavaScript libraries are available. On the whole, anything you do in one
    library you can do just as well in another. So, how do you choose?


    First, does the library do what you need to do? If you need complicated features,
    such as sophisticated data grids or drawing capabilities, you may want to consider
    certain libraries over others. If your needs are simple, most popular libraries
    will fit the bill.


    Another consideration is if you need your library to play well with other code.
    In Chapter 6, you learned about adding methods to built-in'
  - '[PAGE 214]


    prototypes and how that can possibly conflict with other code. Some libraries
    are built on augmenting Array.prototype and other built-in objects, while others
    keep all their functions and properties in a single namespace to avoid conflicts.


    File size is an important consideration because the user will have to download
    the library along with your own code. A large library may have a lot of code that
    you don''t even use but still makes your pages load slower. Fortunately, large
    libraries are getting smarter with lazy loading techniques, and companies such
    as Google and Yahoo! provide content distribution networks for many popular libraries.


    In addition to the features provided by the library itself, you should consider
    what other code is available for your library. Maybe the library developers don''t
    see a reason to include an image slideshow component in the library, but many
    other independent developers have probably created and released one that you can
    leverage. Take a look at the source code of third-party components for clearly
    written and well-commented code before deciding to use it on your sites.


    Lastly and most importantly, choosing a JavaScript library is a matter of personal
    style. Some libraries will just make more sense to you in how they name functions
    and organize the code. In the end, you can achieve the same goals no matter what
    library you use, so pick one that feels right to you.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_214_0.png)


    Learning a library is like learning an entirely new language on top of JavaScript.
    This book obviously can''t cover all the specifics of any one library. Instead,
    when a tutorial uses a library, it will include a short glossary at the end of
    the chapter that briefly explains the functions and concepts used.


    In addition, you should use the online documentation available at each library''s
    website, as well as the myriad of "cheat sheets" available online to learn more.'
