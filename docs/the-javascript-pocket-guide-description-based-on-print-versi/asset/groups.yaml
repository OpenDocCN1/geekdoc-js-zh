    \ when separated by a space.\n\n## The JavaScript Pocket Guide\n\n```html\n<p>Normal\
    \ paragraph</p>\n<p class=\"special\">Special paragraph</p>\n<p class=\"extra\
    \ special\">Special paragraph</p>\n```\n\n```javascript\ndocument.getElementsByClassName(\"\
    special\");\n[ p.special, p.extra ]\ndocument.getElementsByClassName(\"extra special\"\
    );\n[ p.extra ]\n```\n\nYou can write a helper function that works similarly to\
    \ getElementsByClassName() by looping over all the elements in the page and testing\
