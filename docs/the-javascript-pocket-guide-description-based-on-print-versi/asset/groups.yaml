    # Same-Origin Policy


    The same-origin policy is another security restriction that prevents a script
    from sending and receiving data from another server. It''s especially important
    for Web pages that use cookies to manage user accounts. Without this restriction,
    a script could use your cookies and pretend to be you on another site.


    # Data Formats


    Ajax responses are always text, but you have a few options on how that text is
    formatted.


    **Text or HTML.** If the server responds with text or HTML, you can simply inject
    it into your HTML to add or update content on your page. Text responses can also
    provide arbitrary data such as error messages.


    **XML.** The X in Ajax originally stood for XML, which was the common response
    type when Microsoft invented the XMLHttpRequest object. You'
  - '[PAGE 266]


    # Chapter 15: Ajax 239


    Can use DOM methods and properties such as getElementsByTagName() or childNodes
    to walk the XML DOM tree and extract information.

    I think that using XML responses is overly complicated, so I avoid it when possible.


    JSON: JavaScript Object Notation (JSON) is a way to store data in a string that
    looks like a JavaScript object or array. It''s easy to turn this string into a
    real JavaScript object, so it''s my preferred data format in most Ajax situations.


    Modern browsers such as Firefox and Safari provide a simple API for handling JSON:


    ```

    JSON.stringify({ propertyName : "value" });

    JSON.parse("{propertyName\":"value\}");

    Object { propertyName="value" }

    ```


    JavaScript libraries provide functions like jQuery''s $.parseJSON so that you
    can effortlessly handle JSON across all browsers.


    # User Experience


    Users used to loading new pages when they click links and submit forms. If you
    replace that behavior with Ajax, you may need to do some extra work so that users
    still know what''s happening.


    Loading indicators. The browser doesn''t tell the user that you''re making an
    Ajax request. You should show some kind of loading indicator so the user knows
    that something is happening. I like using animated GIFs, such as the free ones
    at http://www.ajaxload.info/


    Back buttons and bookmarks. Ajax actions don''t change the URL in the browser''s
    location field. This has two effects: The user can''t bookmark'
  - '[PAGE 267]


    or share a URL that corresponds to your page''s current state, and the browser''s
    back and forward buttons are no longer useful. The solution is to use the window.location.hash
    property to change the URL without reloading the page.


    +   - Before clicking an Ajax-driven link: http://example.com/index.html


    +   - After clicking the link: http://example.com/index.html#page2


    This is a complicated technique, so I''ll skip this concern in the example later
    in the chapter. Check out the SWFADress library (http://www.as.com/swfadress/)
    to learn more about this technique.


    **Accessibility and search engine optimization.** Search engines and users without
    JavaScript enabled won''t see your Ajax behaviors. It''s always a great idea to
    use progressive enhancement so that your pages work just as well with and without
    Ajax. The following example demonstrates one way to achieve this.


    # # Ajax Example


    This example shows you how to take a simple Web page and add Ajax behavior to
    it. The page does three things:


    +   - Shows a table of data pulled from a storage file


    +   - Breaks the data into “pages” that you can navigate with Previous and Next
    links


    +   - Provides a form for adding new data to the storage file


    Ajax isn''t much use unless your server can send and receive useful data, so you''ll
    use a little bit of PHP (http://php.net) to manage your data. You''ll need PHP
    version 5.2.0 or higher to use the JSON functions.'
  - '[PAGE 268]


    # Servers and PHP


    If you don''t already have a server that supports PHP, I recommend installing
    the basic version of XAMPP (http://www.apachefriends.org/en/xampp.html). The installation
    instructions are excellent and should get you up and running fairly quickly. After
    you install XAMPP and start the Apache Web server, create your example files in
    these directories (assuming you installed it in the default location):


    Windows: C:\xampp\htdocs\

    Mac: /Applications/XAMPP/htdocs/

    Then you can point your browser to http://localhost to see your files.


    # Setup


    This example has several interlocking parts, so you should keep them in separate
    files to make the code clearer. Start by creating these four files:


    +   - index.php (XAMPP might supply this file for you already, but you can overwrite
    it.).

    - template.php

    - ajax.js

    - people.json


    # Data File


    PHP handles JSON very well, so for this example you''ll store all your data in
    a simple JSON object. It looks a lot like regular JavaScript. Create at least
    six objects in the array so that you''ll have enough data to do something interesting.'
