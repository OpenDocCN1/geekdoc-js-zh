    # Variables and Data


    > note Enter this code example into the multiline text box in Firefox, because
    hitting Enter/Return in the single-line text box will execute the incomplete code
    and cause an error.


    Variables store a value you can refer to later in the script. Variable names can
    be nearly any valid identifier. A JavaScript identifier is a word that contains
    only letters, numbers, $, and _, and that doesn''t start with a number.


    Variables are a great demonstration of how statements and expressions can be combined.
    You use a variable declaration statement to create a variable.


    ```

    var myVariable;

    ```


    If you already have a variable, you can use a variable assignment expression to
    assign it a value.


    ```

    myVariable = 42;

    42

    ```


    You can combine a variable declaration with an assignment expression.


    ```

    var myVariable = 42;

    ```


    You can also string together several variable declarations with commas. Don''t
    forget the commas, though! Leaving off a comma can have the unintendedide side
    effect of declaring a global variable when you don''t mean to do that. I''ll explain
    that more in Chapter 5.


    ```

    var variable1 = 4,

    variable2 = 8,

    variable3 = 15;

    ```'
  - '[PAGE 31]


    # Values


    JavaScript has a relatively small number of built-in data types, including these
    common types:


    ```

    var myNumber = 42;

    var myString = "A string of text";

    var myBoolean = true;

    var myArray = [myNumber, myString, myBoolean];

    ```


    Arrays are ordered lists of values, and you can access a particular value by its
    index, or its position in the list. Indices always start at zero.


    ```

    myArray[0];

    42

    myArray[2];

    true

    ```


    For primitive values (Number, String, and Boolean), you can find the data type
    of the variable with the typeof operator:


    ```

    typeof myNumber;

    "number"

    type myString;

    "string"

    type myBoolean;

    "boolean"

    type myArray;

    "object"

    ```


    Whoops! Arrays are not primitive values but examples of objects, or collections
    of values. The quick-and-dirty way of checking whether a variable is an array
    is to use the instanceof operator.


    ```

    myArray instanceof Array;

    true

    ```'
  - '[PAGE 32]


    You can also declare a variable without a value, in case you want to assign the
    value later.


    ```

    var myVariable;

    typeof myVariable;

    "undefined"

    ```


    And unlike strongly typed languages such as C and Java, you can change the type
    of data stored on a variable.


    ```

    myVariable = 42;

    myVariable = "Now it''s a string";nmyVariable = true;

    ```


    The null value represents the intentional absence of any other value.


    ```

    myVariable = null;

    ```


    # Comparison


    Comparison expressions return a Boolean. Booleans are the simplest data type,
    representing either true or false. There are two comparison operators, equality
    (==) and identity (===). Don''t confuse them with the assignment (=) operator
    that you''ve already used to assign values to variables.


    ```

    var myNumber = 42;

    42

    myNumber == 42; // Does it equal the number 42?

    true

    myNumber == "42"; // Does it equal the string "42"?

    true

    myNumber === "42"; // Is it identical to the string "42"?

    false

    ```'
  - '[PAGE 33]


    # The JavaScript Pocket Guide


    The equality operator tries to reconcile different data types, such as converting
    the string "42" to the number 42, before making the comparison. The identity operator
    does not do any type coercion. The comparison operators have not (! ) versions
    for checking inequality and nonidentity.


    ```

    myNumber != 108;

    true

    myNumber != "42";ntrue

    ```


    Comparing composite values such as arrays and objects is different from comparing
    primitive values such as numbers and strings.


    ```

    var array1 = [1, 2, 3];\var array2 = [1, 2, 3];

    array1 == array2;

    false

    array1 === array2;

    false

    array1 == array1; // Same object

    true

    array1 === array1; // Equal and identical

    true

    ```


    The comparison operators check whether the values are actually the same object
    instead of checking to see whether it is composed of all the same values in the
    same order.


    # Truthiness and Falsiness


    All values in JavaScript have a notion of "truthiness" and "falsiness," meaning
    they can often be treated as true or false values without actually being Booleans.
