    \ 就会确定它不存在。如果你尝试将其作为方法调用，将得到错误。\n\n```\ntypeof myArray.missingProperty;\n\"undefined\"\
    \n```\n\n```\nmyArray.missingProperty();\nTypeError: myArray.missingProperty is\
    \ not a function\n```\n\n## 修改内置原型\n\n你可以向内置类型的原型添加、更改和删除属性。我稍后会解释为什么这可能是一个坏主意，但首先我给你展示一些示例。\n\
    \n在第 4 章中，你学习了如何去除字符串开头和结尾的空格。该函数的工作原理：\n\n```\nstringTrim(\" \");\n\"hello\"\n\
    ```\n\n你可以通过将该函数添加到 `String.prototype`，将其转换为每个字符串的方法。\n\n```\nString.prototype.trim\
    \ = function() {\n// 因为这是一个方法，上下文是该字符串\n// 你可以通过 \"this\" 关键字访问它\nreturn this.replace(/^(\\\
