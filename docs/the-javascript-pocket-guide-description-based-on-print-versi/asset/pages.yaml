    # match(regexp)


    The match() method returns an array containing all the substrings matching the
    regular expression and its subpatterns. Unlike the other search-and-replace methods,
    it returns null if the pattern doesn''t match. Here are some simple examples,
    but I''ll cover this function in Chapter 8:


    ```

    // Find all the vowels

    "hello world".match(/[aeiou]/g);

    ["e", "o", "o"]

    // Find "world" regardless of capitalization

    "hElLo WoRiID".match(/world/i);

    ["WoRiID"]

    ```


    # replace(pattern, replacement)


    The replace() method works like match() except that it returns a string with all
    instances of pattern replaced by the string replacement.


    ```

    // Remove all non-numeric characters from a phone number

