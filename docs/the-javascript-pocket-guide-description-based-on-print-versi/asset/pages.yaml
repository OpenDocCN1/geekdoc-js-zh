- img_proc: true
  md: "Functions expressed without a name are *function expressions* and are sometimes\
    \ referred to as *anonymous functions*. You can store a function expression on\
    \ a variable or use it as a return value in another function.\n\n```\nvar functionName\
    \ = function(arg1, arg2, argN) {\n  // Statements\n};\n\nfunction outerFunction()\
    \ {\n  // This function returns an anonymous function\n  return function() {\n\
    \    console.log(\"inner function\");\n  }\n}\n```\n\n> > **note** You don't need\
    \ to put a semicolon after the closing curly bracket in a function declaration.\
    \ Function expressions, on the other hand, should always end with a semicolon.\n\
    \n# Self-invoking Functions\n\nSometimes you may want to call a function immediately,\
    \ for reasons explained in the “Closures” section later in this chapter.\n\n```\n\
    (function() {\n  // Executed immediately\n})()\n```\n\nYou can't immediately invoke\
    \ a function declaration, so parentheses are required around the function to indicate\
    \ that this is a function expression."
