  md: "\"people\" : [\n  // People objects\n]\n\nThe Firebug console displays Ajax\
    \ requests, so at this point you can make sure everything works by loading index.php\
    \ in the browser and clicking Next (Figure 15.1). Now you can request data over\
    \ Ajax, the next step is to present the data to the user by updating the page.\n\
    \n**Figure 15.1**\nFirebug lets you inspect the Ajax request and response.\n\n\
    ![](img/4a8fa16ebbe3c330347de80256b877b4_280_0.png)\n\n# Updating the User Interface\n\
    \nThe insertJson() function loops over all the people objects from the JSON response\
    \ and creates HTML strings using a template. Once it creates `<tr>` elements for\
    \ each person object, it empties the table and inserts the new HTML into the page.\n\
    \n```\nfunction insertJson(people) {\n  var template = \"<tr><td>{name}</td><td>{location}</td><td>{browser}</td></tr>\"\
    ;\n  var results = [];\n\n  for (var i = 0, l = people.length; i < l; i++) {\n\
    \    results.push(templatize(template, people[i]));\n  }\n}\n```\n\n(continues\
    \ on next page)"
