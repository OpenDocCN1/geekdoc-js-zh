    \ images.\n\n```\n// Resize slides <div> to hold the largest images\nvar slidesWidth\
    \ = images.widest();\nvar slidesHeight = images.tallest();\nslides.css({\n  width\
    \ : slidesWidth,\n  height : slidesHeight\n});\n```\n\nThe css() method is a shorthand\
    \ way of setting style properties on elements. It takes care of adding \"px\"\
