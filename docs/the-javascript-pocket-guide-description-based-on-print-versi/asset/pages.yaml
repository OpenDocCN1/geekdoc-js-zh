    \ will be the focus of Chapters 9, 10, and 11.\n\n# Expressions and Statements\n\
    \n*Expressions* are phrases that produce a value. JavaScript code is made up mostly\
    \ of expressions in various forms.\n\n*Statements* are phrases that don't produce\
    \ a value but instead have some sort of side effect. Examples of side effects\
    \ include storing variables in memory and jumping to a different part of the script.\
    \ Statements often combine keywords such as var, if, or while with one or more\
    \ expressions so that the side effects have values to work with.\n\nFirebug makes\
    \ it easy to differentiate between expressions and statements. When you enter\
