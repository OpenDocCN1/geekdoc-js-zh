  md: '# About the Author


    In the seventh grade, Lenny Burdette checked out the book Teach Yourself HTML
    in 24 Hours from the public library, and the rest, as they say, is history. Since
    graduating from UCLA, Burdette has worked at Schematic in Los Angeles, California,
    where he is the reigning Guitar Hero champion. Schematic (http://www.schematic.com)
    is a digital marking agency that has given him opportunities to develop JavaScript
    for Web sites, e-commerce platforms, TV, and mobile.


    # Acknowledgments


    I''d first like to thank Cliff Colby and Bruce Hyslop for the opportunity to write
    this book as well as the fact that I could. Huge thanks go to editor Kim Wimsett
    and the rest of the team at Peachpit Press for making the process go more smoothly
    than I ever imagined it would.


    Adam Luikart''s feedback and sharp eye were invaluable throughout the writing
    process. All of my colleagues at Schematic, especially Richard Herrera and the
    rest of IEG, are a wealth of inspiration and support. Additionally, Nick Rodriguez
