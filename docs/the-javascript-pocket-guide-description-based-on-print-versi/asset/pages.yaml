  md: '# What Does API Mean?


    API stands for application programming interface, which is a somewhat-generic
    term for whatever tools you use to programmatically interact with a piece of software.
    Browser APIs are mostly functions and properties that give you access to browser
    windows, elements in HTML documents, and even certain parts of the user''s computer.


    # Progressive Enhancement


    Web development is an interesting and challenging field because you can''t reliably
    know how the user will end up viewing your code.


    Usually, the ideal end user is someone using a modern browser on a fast computer
    with a high-speed internet connection. This may describe the majority of Web surfers,
    but dozens of factors affect how any given person might see your code:


    +   * Some people can''t or won''t upgrade from an older browser.

    * Some people have slower computers with smaller screens.

    * Some people surf the Web on mobile devices with tiny screens and no mice.

    * Some people don''t have fine motor control, so computer mice aren''t a viable
    option.

    * Some people are visually impaired and use screen reader software to operate
    computers using aural cues.

    * Some people lock down their browsers out of a concern for privacy, so JavaScript
    and cookies aren''t available.'
  merge: -1
