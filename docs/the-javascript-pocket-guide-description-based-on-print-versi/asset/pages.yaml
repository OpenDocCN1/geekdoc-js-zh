    \n> Event Objects in Internet Explorer\n\nIn Internet Explorer, the Event object\
    \ isn't available as an argument of the handler. Instead, it's a property of window.\
    \ To write cross-browser DOM Level o code, look for the Event object in both places.\n\
    \nfunction handler(event) {\n  event = event || window.event;\n}\n\n# Event Bubbling\
    \ and Capturing\n\nThe life cycle of an Event object is more complicated than\
    \ you may initially expect. Events go through three phases and travel up and down\
    \ the DOM tree when they fire. Most of the time this doesn't come into play, but\
    \ it's still an important concept to understand."
