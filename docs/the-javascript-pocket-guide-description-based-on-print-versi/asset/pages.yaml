- img_proc: true
  md: "The Unicode entities (such as \"\\u232A\") in the text of these links are nice-looking\
    \ arrow characters pointing left and right.\n\nThis is another example of passing\
    \ an HTML string to the jQuery function to create a new element. Again, you can\
    \ immediately append the elements to the page and add event handlers by chaining\
    \ jQuery methods.\n\nThe bind() method is jQuery's version of addEventListener()—another\
    \ advantage with JavaScript libraries are the shorter names—but with a few differences.\
    \ You can optionally pass some data to the event handler in the second argument.\
    \ You're using the same event handler for both links and passing in +1 or -1 to\
    \ indicate which direction to cycle the slideshow.\n\nThe event handler, onClick(),\
    \ is very simple because it passes the real functionality to the showImages()\
    \ function.\n\n```\n// Event handler for the controls\nfunction onClick(event)\
    \ {\n  event.preventDefault();\n  clearInterval(interval);\n  showImage(currentImageIndex\
    \ + event.data);\n}\n```\n\nThe first thing the event handler does is prevent\
    \ the default link behavior with event.preventDefault().jQuery normalizes the\
    \ event object across all browsers so you can use the standard API even in Internet\
    \ Explorer.\n\nThe handler then clears the interval so that the slideshow no longer\
    \ automatically cycles after the user interacts with it."
