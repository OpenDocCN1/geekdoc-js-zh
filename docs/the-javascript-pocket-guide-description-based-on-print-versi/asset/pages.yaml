    \n```\nb replace : not a function\n  currCSS\n  style()\n  body()\n  (0)\n  slideshow.js\n\
    a.currentState(f-Ko.test(a.currentSty...unimeStyle.le\nJquery.min.js (line 113)\n\
    ```\n\n+   - If you don't have any errors, check your variables to make sure they\
    \ hold the values you expect. Use console.log() to print the value of the variables\
    \ to the console. You may find that an array is actually empty or you have false\
    \ instead of true.\n\n+   - Firebug's Script tab is really powerful but takes\
    \ some effort to understand. It allows you to add breakpoints to specific lines\
    \ of code so you can stop the script and inspect the variables at that point.\n\
    \n+   - When in doubt, back up a few steps and make sure you typed everything\
