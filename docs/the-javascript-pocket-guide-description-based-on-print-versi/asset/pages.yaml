  md: '# Even More Properties and Methods


    The following lesser-used Math properties and methods are good for more complex
    math and trigonometry:


    ```

    Math.E              Math.SQRT2         Math.exp()

    Math.LN10           Math.acos()         Math.log()

    Math.LN2            Math.asin()         Math.pow()

    Math.LOG10E         Math.atan()         Math.sin()

    Math.LOG2E          Math.atan2()        Math.tan()

    Math.SQRT1_2        Math.cos()

    ```


    # Generating Random Integers


    Math.random() only returns numbers between zero and one, but you can easily generate
    a random integer between two integers with a little extra math.


    ```

    var lower = 2;

    var higher = 10;

    Math.round(Math.random() * (higher - lower)) + lower;

    ```


    # Conversion


    Because JavaScript is a “loosely typed” language, data changes from one type to
    another easily. This lets you use Booleans, Numbers, and Strings interchangeably
    in many cases. Some values don''t easily convert to another data type, however,
    so it''s useful to understand the conversion rules.


    The easiest way to convert a number to a string is add a string to it.'
