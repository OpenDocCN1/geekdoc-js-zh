  md: "# mouseover, mouseout\n\nWhen the mouse enters an element, the mouseover event\
    \ fires. When the mouse leaves, the mouseout event fires. These events are actually\
    \ tricky to use because of event bubbling. Create an HTML document with this CSS\
    \ and markup:\n\n```\ndiv {\n  width: 50px;\n  height: 50px;\n}\n#parent {\n \
    \ padding: 20px;\n  background: #999;\n}\n#child {\n  background: #fff;\n}\n```\n\
    \n```\n<div id=\"parent\">\n  <div id=\"child\">\n  </div>\n</div>\n```\n\nNow\
    \ add a <script> block that adds mouseover and mouseout event handlers to the\
    \ parent element:\n\n```\nvar parent = document.getElementById(\"parent\");\n\
    parent.onmouseover = function(event) {\n  console.log(\"mouseover event occurred\"\
    );\n};\n```"
  merge: -1
  pgno: 205
- img_proc: true
  md: "```\nparent.onmouseout = function(event) {\n  console.log(\"mouseout event\
    \ occurred\");\n};\n```\n\nWhen the mouse enters the gray parent <div>, the mouse\
    \ event fires. But if the mouse continues into the white child <div>, the mouse\
    \ and mouseover events fire again. If you only wanted to know when the mouse enters\
    \ and leaves the parent <div>, these extra events can be problematic.\n\n# mouseenter,\
    \ mouseleave\n\nOnly available in Internet Explorer\n\nInternet Explorer provides\
    \ two events that fix the mouseover/mouseout problem described earlier. The mouseenter\
    \ and mouseleave events are the same as mouseover and mouseout, respectively,\
    \ except that they don't bubble. For browsers that don't support these events,\
    \ you can emulate them with event.relatedTarget.\n\n```\nparent.onmouseover =\
    \ function(event) {\n  var related = event.relatedTarget;\n\n  while (related\
    \ && related !== this) {\n    related = related.parentNode;\n  }\n\n  if (related\
    \ !== this) {\n    console.log(\"mouseenter (not mouseover) event occurred\");\n\
    \  }\n}\nparent.onmouseout = function(event) {\n  var related = event.relatedTarget;\n\
    ```\n\n(continues on next page)"
  merge: -1
  pgno: 206
- img_proc: true
  md: "```\nwhile (related && related !== this) {\n  related = related.parentNode;\n\
    }\n\nif (related === this) {\n  console.log(\"mouseleave (not mouseout) event\
    \ occurred\");\n}\n;\n```\n\nThe trick behind these event handlers is testing\
    \ to see whether the Event is a child of the parent <div>. Iterating up the DOM\
    \ tree with while and parentNode is the quickest way to test this. Some JavaScript\
    \ libraries have built-in support for mouseenter and mouseleave.\n\n# Keyboard\
    \ Events\n\nKeyboard events have two properties related to which key the user\
    \ pressed: keyCode and charCode. Unfortunately, these properties work differently\
    \ depending on the browser and operating system. The user's language also makes\
    \ a difference, since different languages use different keyboard layouts. Generally\
    \ speaking, keyCode is a number representing a particular key on the keyboard,\
    \ and charCode is the character code of the key pressed. It's best to let a JavaScript\
    \ library smooth out the differences.\n\n# keydown\n\nThe keydown event occurs\
    \ when the user presses a key. Nearly any key on the keyboard can fire this event,\
    \ and it always fires before keypress.\n\n# keypress\n\nThe keypress event occurs\
    \ only when the user presses a key that normally prints a character. Keys like\
    \ Enter/Return and Shift do not fire this event. The event also repeats while\
    \ the user holds the key down."
