    # Using innerHTML


    Microsoft created the innerHTML property on element nodes as a quick-and-dirty
    way of setting the HTML contents of an element. Simply assign the property to
    a string with HTML tags.


    ```

    var myPara = document.getElementById("myPara");

    myPara.innerHTML = ''Click <a href="#">here</a>'';

    ```


    Regardless of the former contents of myPara, it now looks like the following because
    innerHTML completely overwrites the element''s content:


    ```

    <p id="myPara">Click <a href="#">here</a></p>

    ```


    You can now retrieve the newly created <a> tag like so:


    ```

    var newLink = myPara.getElementsByTagName("a")[0];

    ```


    The benefit of this technique is that you can make massive changes to the DOM
    with only a single line of code. Achieving the same result with createElement()
    and createNode() requires many more method calls and lines of code.'
