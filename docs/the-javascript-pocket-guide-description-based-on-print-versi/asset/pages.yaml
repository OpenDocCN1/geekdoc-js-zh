    \  // The browser doesn't support string.trim(),\n  // so you can add it here\n\
    \  String.prototype.trim = function() {\n    // ...\n  }\n}\n```\n\n> ### Potential\
    \ Problems with prototype\nYou have to be careful when changing built-in prototypes,\
    \ because you're basically creating your own version of JavaScript. If you're\
    \ using code written by someone else, such as a JavaScript library or an advertisement\
