    # Changing Built-in Prototypes


    You can add, change, and remove properties from the prototypes of built-in types.
    I''ll get to why this can be a bad idea in a moment, but first I''ll show some
    examples.


    In Chapter 4, you learned how to trim spaces off the beginnings and endings of
    a string. That function works like this:


    ```

    stringTrim(" ");

    "hello"

    ```


    You can turn that function into a method for every string by adding it to String.prototype.


    ```

    String.prototype.trim = function() {

    // Since this is a method, the context is the string

    // that you can access with the "this" keyword

    return this.replace(/^(\s|\u00A0)+|(\s|\u00A0)+$/g, "");

    }

    " hello " .trim();

    "hello"

    " this string also has the trim method " .trim();

    "this string also has the trim method"

    ```


    In my opinion, this is often a much more pleasant way to organize code. It is
    sometimes referred to as an object-oriented style of programming, because you
    act upon objects with methods. (The stringTrim() style is functional programming
    because you''re passing values to functions.)'
