  md: '# The Event Object


    Using the standard API, event handlers receive an Event object as an argument.
    This object provides information about the event as well as methods for controlling
    the outcome and life cycle of the event.


    # Properties


    Different types of events have different properties, which you''ll learn later
    in the chapter. Here are a few properties common to all standard Event objects:


    +   - **type** The type of the event, like "click," "load," or "keypress."

    - **target** The element that originally dispatched the event. This may not be
    the same as the element to which the event handler is attached.

    - **currentTarget** The element to which you attached the event handler. In most
    cases, it is synonymous with the this keyword. If you change the context of the
    event handler with call() or apply(), you can still access the element with currentTarget.

    - **eventPhase** A number that indicates whether the event is currently capturing
    (1), bubbling (3), or at the target element (2). Find out more information in
    the "Event Bubbling and Capturing" section later in this chapter.

    - **timeStamp** A number in seconds that represents the time at which the event
    occurred.


    # Methods


    These methods give you control over the how long the event lives and what its
    final outcome is.


    +   - **preventDefault()** Prevents the default behavior from occurring. Default
    behaviors include following links and submitting forms.'
  merge: -1
  pgno: 193
- img_proc: true
  md: "<a id=\"link\" href=\"http://www.google.com\">Don't go to\n\U0001F449 Google</a>\n\
    \n```\nvar link = document.getElementById(\"link\");\nlink.addEventListener(\"\
    click\", dontFollowLink, false);\n```\n\n```\nfunction dontFollowLink(event) {\n\
