  md: '# Slideshow Ingredients


    For this simple example, you need the following:


    +   - A simple HTML page with the list of images (slideshow.html)

    - A simple style sheet to help position and display the images and controls (slideshow.css)

    - A handful of LOLcat images to test with (http://www.lolcats.com)


    Figure 13.2 shows a preview of the final result.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_226_0.png)


    This list of functional requirements helps plan how you want the widget to behave:


    +   - Without JavaScript, the page should contain the first image and a list of
    links to the subsequent images.

    - The visible image should fade out as the next image fades in.'
  merge: -1
  pgno: 226
- img_proc: true
  md: "+   - The slideshow should loop back to the first image after showing the last\
    \ image.\n\n+   - The slideshow should automatically cycle through images every\
    \ five seconds until the user clicks the next or previous arrows.\n\n+   - Each\
    \ image should be centered in the slideshow, regardless of size.\n\nIt would be\
    \ much easier to create a slideshow for images that are all the same size. In\
    \ fact, that last requirement almost doubles the length of the code. If I hadn't\
    \ planned for it, I might have organized my code very differently, which is why\
    \ it really helps to decide on your functionality in advance.\n\n# Slideshow HTML\n\
    \nThis example HTML document contains only the bare-minimum markup to demonstrate\
    \ how to build a slideshow:\n\n```\n<!DOCTYPE html>\n<html class=\"no-js\">\n\
    <head>\n    <title>LOLcat Slideshow</title>\n    <link rel=\"stylesheet\" href=\"\
    slideshow.css\" type=\"text/css\" />\n    <script type=\"text/javascript\">\n\
    \        (function(d, c) { d[c] = d[c].replace(/\\bno-js\\b/, \"js\"); })(document.documentElement,\"\
    className\");\n    </script>\n</head>\n<body>\n    <div id=\"slideshow\">\n  \
    \      <div class=\"slides\">\n```"
