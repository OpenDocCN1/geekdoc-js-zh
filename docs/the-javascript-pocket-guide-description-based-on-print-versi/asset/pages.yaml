  md: "# Keyboard Support\n\nThe Menu and FancyMenu classes support keyboard navigation\\\
    pretty successfully because the click event responds to the Enter/\nReturn key\
    \ as well as the mouse. You can test this by navigating thenlinks in the page\
    \ with the Tab key.\n\nThe FancyMenu has a slight complication, though: Because\
    \ of how\nt slide effect hides the submenus, you can still tab to their links\n\
    even when they are hidden. Keyboard users prefer being able to tab\n to visible\
    \ elements.(The Menu class hides submenus with the\ndisplay style property, so\
    \ you can't tab to them.)\n\nYou can set the \"tabability\" of an element with\
    \ the tabindex prop-\nerty. A tabindex of 0 means it can be tabbed to. A tabindex\
    \ of -1\nremoves its \"tabability.\"\n\nMooTool's making setting the tabindex\
    \ property on all the links in a\nsubmenu a simple one-liner:\n\n```\n$$(submenu).getElementsBy(\"\
    a\").set(\"tabindex\", -1);\n```\n\nAdd this line to addEffect(), hideMenu(),\
    \ and showMenu() to set the\ntab properties appropriately for hidden and visible\
    \ submenus.\nDon't forget to change the -1 to a o in showMenu().\n\nNow when you\
    \ tab to a menu item, you have to hit Enter/Return to\nbe able to tab to the links\
    \ in its submenu."
