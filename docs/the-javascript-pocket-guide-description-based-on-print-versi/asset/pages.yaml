  md: '# Feature Detection vs. Browser Sniffing


    In the next few chapters, I''ll discuss many properties and methods that some
    browsers (mainly Internet Explorer) don''t support. In your code, you could take
    one of two approaches to handling these differences:


    +   - You could use the navigator properties to determine whether the browser
    is Internet Explorer and execute different code.


    +   - You could check to see whether the property or method you want to use exists
    and execute different code if it doesn''t.


    The latter method is always the better way to go. If Internet Explorer 10 includes
    support for the property or method, then your test is no longer applicable. Feature
    detection—testing for the feature before using it—is the most reliable way to
    make sure your code continues to work efficiently with future browsers.'
  merge: -1
