  md: '# Events


    Events are hugely important to client-side programming. Without them, you couldn''t
    add interactivity to web pages beyond clicking links and submitting forms.


    Using events is a matter of executing function in response to an action or input.
    These functions are known as event listeners or event handlers. I prefer *handler*
    even though some method names use *listener*. (Would a function handle an event
    or listen for an event? The former makes more sense to me.)'
  merge: -1
