  md: '# Number Formats


    You can express numbers in a few different ways, though I rarely have a reason
    to do so. JavaScript doesn''t differentiate between integers and real numbers.
    I tend to refer to numbers with decimal points as floating-point numbers, though
    technically all numbers are floating-point numbers.


    ```

    var myInteger = 16;

    var myFloat = 1.08;

    ```


    If you need to express really big or really small numbers, you can use scientific
    notation.


    ```

    var reallyBig = 8.67e100;

    var reallySmall = 15e-42;

    ```


    Most JavaScript numbers use the base-10 system, but you can also express numbers
    in base-8 or base-16. Base-8 numbers start with a zero and only use zero through
    seven. Base-16 numbers start with ox or OX and use zero through nine and A through
    F. Colors are often expressed in base-16, or hexadecimal, digits.


    ```

    0123; // Base-8

    83

    0xFF; // Base-16

    4095

    ```


    Be careful not to start numbers with a zero unless you really mean to express
    a base-8 number!'
