  md: "# Memoization\n\nMemoization is a technique similar to caching that takes advantage\
    \ of the fact that functions are just data. Once an expensive function runs, it\
    \ can rewrite itself with an optimized version.\n\n```\nvar getElement = function()\
    \ {\n  console.log(\"creating element\");\n  var element = document.createElement(\"\
    div\");\n  // ... Do a bunch of expensive operations\n\n// Overwrite the function\
    \ with a simpler version\n  getElement = function() {\n    return element;\n \
    \ };\n  return element;\n};\n```\n\nThe first time getElement runs, it creates\
    \ the element and runs a bunch of code with it. Then it rewrites the getElement\
    \ function to solely return the created element. This makes subsequent calls to\
    \ getElement much quicker."
