  md: "# Getting Around the Same-Origin Policy\n\nOne of the most popular uses for\
    \ JavaScript is the creation of mash-ups, pulling data from different sites and\
    \ combining it in useful and interesting ways. The same-origin policy, while being\
    \ an important security restriction, makes this much more difficult than it should\
    \ be. Here are a few ways to circumvent the policy.\n\n# Proxies\n\nYou can set\
    \ up a script on your own server that redirects an Ajax request to another server,\
    \ taking advantage of the flexibility of server-to-server communication. Try searching\
    \ the Web for some example scripts.\n\n# JSON-P\n\nYou can't request data from\
    \ another server with Ajax, but you can load JavaScript from another server with\
    \ <script> tags. JSON with Padding (JSON-P) takes advantage of this fact. Here's\
    \ a quick example that loads data from Twitter:\n\n```\n<script type=\"text/javascript\"\
    >\nfunction twitterCallback(tweets) {\n  alert(\"Latest Tweet: \" + tweets[0].text);\n\
    }\n</script>\n<script src=\"http://twitter.com/status/user_timeline/whitehouse.json?callback=twitterCallback\"\
    \ type=\"text/javascript\"></script>\n```"
  merge: -1
  pgno: 283
- img_proc: true
  md: "The first <script> defines a function called twitterCallback() that consumes\
    \ the Twitter JavaScript data. The second <script> loads a special JavaScript\
    \ file using the Twitter API, passing the name of the twitterCallback() as a parameter.\
    \ The Twitter JavaScript file looks like the following:\n\n```\ntwitterCallback({\n\
    \  \"user\": {\n    \"screen_name\": \"whitehouse\",\n  },\n  \"text\": \"\\Feeling\
    \ the Olympic Spirit\\\": Valerie Jarrett \\n-> reports back from Vancouver, with\
    \ photos http://bit.ly/aGibb1\"\n}),\n// ... More tweets\n]);\n```\n\nThe JavaScript\
    \ file immediately executes the callback function and delivers the data as an\
    \ argument. You can dynamically create <script> tags in your code to request data\
    \ from other servers with JSON-P APIs.\n\n> JSON-P is inherently less secure than\
    \ sending data with Ajax, so don't use it with passwords and other sensitive information."
  merge: -1
