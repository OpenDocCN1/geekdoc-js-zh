  md: '# concat(x[, y, z ...])


    The concat() method concatenates values to the end of the array and returns the
    result. The original array doesn''t change. You can pass in any number of arguments.
    If an argument is an array, each value is concatenated individually.


    ```

    [1, 2, 3].concat(4. [5. 6]);

    [1, 2, 3, 4, 5, 6]

    ```


    # push(x[, y, z ...])


    The push() method is the same as the concat() method except for a few differences:


    +   - It does change the original array.

    - It returns the new length of the array.

    - If an argument is an array, it does not concatenate each value individually.


    ```

    var myArray = ["a", "b", "c"];

    myArray.push("d", ["e", "f"]);

    5

    myArray;

    ["a", "b", "c", "d", ["e", "f"]

    ```


    # unshift(x[, y, z ...])


    The shift() method is exactly the same as push() except that it adds values to
    the beginning of the array instead of the end.


    ```

    var myArray = ["d", "e", "f"];

    myArray.unshift("a", ["b", "c"]);

    5

    ```'
  merge: -1
