    +   - **pathname** The string after the host and before the search, including
    the leading slash (/): /dir/file.html


    +   - **port** The port: 8080


    +   - **protocol** The string before the host, *not* including the slashes (//):
    http:


    +   - **search** The query string variables, including the leading question mark
    (?):?param=value&param2=value


    # # Cookies


    *Cookies* are small strings that let you store data across page views and sessions.
    These are some common uses of cookies:


    +   - Keeping track of whether the user has logged in to your site


    +   - Remembering that a user has visited a page before


    +   - Differentiating between first-time visitors and repeat visitors


    Cookies are also sent to the server with every page request. That''s how the server
    knows whether the user is logged in. Because cookies add data to the request and
    therefore increase the size of the request, cookie data is limited to 4KB.


    The window.document object has a funny little property called cookie. You can
    use that object to read and set cookie data.


    # # Setting Cookies


    To set a cookie, just assign the name and value to document.cookie in the following
    format:


    ```

    document.cookie = "name=value";

    ```'
