  md: '# Number Precision


    JavaScript is a great language for many things, but I don''t recommend using it
    to design your trip to the moon. You might crash and burn if your calculations
    work out like this:


    ```

    0.1 + 0.2;

    0.30000000000000004

    ```


    The floating-point number system in JavaScript is flawed and introduces tiny rounding
    errors in many operations. To be honest, you probably will not need that much
    accuracy in your code, but it''s still worth noting.'
