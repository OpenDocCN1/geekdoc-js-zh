  md: '# Creating HTML5 Elements


    HTML5 introduces several new elements for richer semantics and better document
    structure, such as <article>, <aside>, and <nav>. By default, Internet Explorer
    handles these new elements so poorly that they become unusable. Unfortunately,
    you can pass any tag name to createElement(). Creating a single copy of a new
    element causes Internet Explorer to treat it as if it was a <div>.


    There are a few "HTML5 shim" scripts available online that add support for all
    of the new HTML5 elements.


