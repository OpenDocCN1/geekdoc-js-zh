  md: '# The Browser Problem


    Programming in pure JavaScript is relatively straightforward, but once you add
    the myriad of browsers available to the equation, everything gets significantly
    more complicated.


    Brandon Eich developed JavaScript for Netscape 2.0 in the midst of the "browser
    wars" of the late 1990s. To keep up, Microsoft made its own version of JavaScript
    that it called JScript. It wasn''t an exact copy of the original implementation,
    and many of the original differences persist today.


    In addition, the Web and its technologies continue to evolve at a rapid pace.
    Browser makers have the daunting task of innovating their products and keeping
    up with each other, all while maintaining backward compatibility with the billions
    of Web sites that exist on the Internet.


    Fortunately, groups such as the W3C, WHATWG, and ECMA have made great strides
    in codifying and standardizing JavaScript and browser APIs. Their efforts allow
    developers to more easily "write once, run anywhere" and trust that their code
    will continue to work as the Web evolves. Most modern browsers, such as Firefox,
    Safari, Opera, and Chrome, follow Web standards very closely. Internet Explorer
    still lags behind in standards support and is often a thorn in every developer''s
    side.


    JavaScript developers tackle browser differences with libraries of code that help
    provide consistent APIs across all browsers. You''ll learn about libraries soon,
    but the next few chapters focus on pure JavaScript objects, properties, and functions.'
  merge: -1
  pgno: 138
