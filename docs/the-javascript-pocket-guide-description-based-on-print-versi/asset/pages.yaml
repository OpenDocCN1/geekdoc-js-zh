    <!DOCTYPE html>\n<html>\n<head>\n    <title>Multiple Load Handlers</title>\n</head>\n\
    <body>\n    <script type=\"text/javascript\">\n        function addOnloadHandler(newHandler)\
    \ {\n            var previousHandler = window.onload;\n            window.onload\
