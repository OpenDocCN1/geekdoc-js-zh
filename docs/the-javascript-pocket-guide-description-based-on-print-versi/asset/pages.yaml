  md: '# Walking the DOM


    The simplest way to find DOM nodes is to “walk” the DOM tree. Nodes have several
    properties that return adjacent nodes in the tree. You can combine these properties
    to walk from node to node.


    Refer to this HTML document for the examples in this section:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Walking the DOM</title>

    </head>

    <body>

    <h1>Heading</h1>

    <p>Paragraph with <a href="#">Link</a></p>

    </body>

    </html>

    ```


    # Starting with document


    The document element is a property of the global window object, so it’s the most
    easily accessed and most used DOM node. It has two important properties that act
    as starting points in the DOM tree.


    ```

    document.documentElement;

    <html>

    document.body;

    <body>

    ```


    Use the firstChild property to access the <head> element inside the documentElement.


    ```

    document.documentElement.firstChild;

    <head>

    ```'
  merge: -1
