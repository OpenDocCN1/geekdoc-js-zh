- img_proc: true
  md: 'Check out Robert Penner''s library of ActionScript equations at http://www.robertpenner.com/easing/.
    ActionScript is another dialect of ECMAScript, so the equations are easily translated
    to JavaScript.


    # Animation with Libraries


    Animation is a pretty simple concept, but it''s still a lot easier to use a JavaScript
    library to create animation utilities than writing them from scratch. Library
    animation utilities allow you to do many things:


    +   - Set the ending values for multiple properties at once

    - Set the duration and easing equations

    - Add callback functions that trigger at the end of the animation


    To see how both the YUI 3 and jQuery libraries handle this, replace the <script>
    element in the previous example HTML with the following markup:


    ```

    <p><a href="#" id="yuiLink">Animate with YUI</a></p>

    <p><a href="#" id="jqueryLink">Animate with jQuery</a></p>

    <p><a href="#" id="reset">Reset</a></p>

    ```


    ```

    <script src="http://yui.yahoo.com/3.0.0/build/yui-yui-min.js" type="text/javascript"></script>

    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.4.1/jquery.min.js"
    type="text/javascript"></script>

    <script src="animation.js" type="text/javascript"></script>

    ```


    > There is really no reason to load two libraries into a page at once, but at
    least YUI 3 and jQuery play nicely with each other by using namesacing and closures
    to encapsulate their code.'
  merge: -1
  pgno: 294
- img_proc: true
  md: "# YUI 3 Animation Objects\n\nIn a new file, animation.js, add the following\
    \ code to create a YUI 3 animation object:\n\n```\nYUI().use(\"anim\", function(Y)\
    \ {\n  var animation = new Y.Anim({\n    node: \"#box\",\n    to: {\n      width:\
    \ 200,\n      height: 100,\n      left: 50,\n      top: 150,\n      backgroundColor:\
    \ \"#f00\"\n    },\n    duration: 2, // In seconds\n    easing: Y.Easing.easeOut\n\
    \  });\n  // Continue YUI 3 code here\n});\n```\n\nThe Y.Anim constructor function\
    \ creates an object you can control later in the script. The node parameter takes\
    \ a selector like the one you would pass to Y.one() to select a single DOM element.\
    \ You can find the rest of the parameters in the online documentation: http://developer.yahoo.com/yui/3/api/Anim.html#configattributes\n\
    \nContinuing the YUI 3 version of the script, you can add an event handler to\
    \ the animation object that fires when the animation ends:\n\n```\nanimation.on(\"\
    end\", animationCallback);\n```"
  merge: -1
  pgno: 295
- img_proc: true
  md: "Add this callback function outside the YUI closure function so you can use\n\
    it in the jQuery example too:\n\n```\nfunction animationCallback() {\n  console.log(\"\
    animation finished!\");\n}\n```\n\nThe code so far doesn't actually start the\
    \ execution. Add an event\nhandler to the <a> element in the page:\n\n```\n//\
    \ Inside the YUI closure function\nYone(\"#yuiLink\").on(\"click\", function(event)\
    \ {\n  event.preventDefault();\n  animation.run();\n});\n```\n\nThe run() method\
    \ starts the animation, and after two seconds, the\ncallback function will print\
    \ \"animation finished!\" to the console.\n\n# The jQuery animate() Method\n\n\
    jQuery takes a slightly different approach to animation and has a\nslightly different\
    \ set of capabilities. Create a second closure function\nin animation.js for the\
    \ following jQuery code:\n\n(function($) {\n\n```\n$(\"jqueryLink\").click(function(event)\
    \ {\n  event.preventDefault();\n\n  (\"#box\").animate({\n    width: 200,\n  \
    \  height: 100,\n    left: 50,\n```\n\n(continues on next page)"
  merge: -1
  pgno: 296
- img_proc: true
  md: "```\ntop: 150\n{\n  duration: 2000, // In ms\n  complete: animationCallback\n\
    });\n}(jQuery);\n```\n\nThe animate() method runs immediately instead of returning\
    \ an object to control it later. It can take several combinations of arguments;\
    \ the online documentation at http://api.jquery.com/animate/ covers all the variations.\
    \ In this example, the first argument specifies the ending values for the properties\
    \ you want to animate. The second argument specifies parameters such as the duration\
    \ and any callback functions.\n\nOther difference between YUI 3 and jQuery in\
    \ terms of animation include the following:\n\n+   * You can animate only a single\
    \ object with a YUI 3. Animate, whereas jQuery's animate() function can animate\
    \ multiple elements at once in one method call.\n\n+   * YUI 3 includes a number\
    \ of easing functions automatically, which you can find here: http://developeryahoo.com/yui/3/api/Easing.html.\
    \ jQuery includes only two easing functions by default, \"linear\" and \"swing\"\
    .\n\n+   * jQuery can't animate color values by default. The jQuery UI library\
    \ adds this capability, as well as additional easing equations.\n\n# Resetting\
    \ Animation\n\nAnimations work by changing the style attribute, so you can reset\
    \ the animation by setting the attribute to an empty string. This is one case"
  merge: -1
  pgno: 297
- img_proc: true
  md: "where you have to use the setAttribute() method, because the style\\property\
    \ is read-only.\n\n```\ndocument.getElementById(\"box\").style = \"\"\nTypeError:\
    \ setting a property that has only getter\ndocument.getElementById(\"box\").setAttribute(\"\
    style\", \"\");\n```\n\nYou can add an event handler for the Reset link using\
    \ either YUI 3 or jQuery. Here's the YUI 3 version:\n\n```\nY.one(\"#reset\").on(\"\
    click\", function(event) {\n  event.preventDefault();\n  Y.one(\"#box\").setAttribute(\"\
    style\", \"\");\n}\n```\n\n# Using Animation\n\nYou have a lot of freedom when\
    \ animating DOM elements. I tend to\\follow a couple simple rules when using animation\
    \ on my sites:\n\n+   - Easing equations, especially exponential equations, make\
    \ animations feel more natural and expressive.\n- Animations should ideally enhance\
    \ the usability of the user interface. For example, a quick flip between two elements\
    \ might be easy to miss, but a slow transition can tell the user where the new\
    \ content comes from.\n- Subtlety is key. If you have too many elements moving\
    \ around the page, you’ll distract the user from your content."
