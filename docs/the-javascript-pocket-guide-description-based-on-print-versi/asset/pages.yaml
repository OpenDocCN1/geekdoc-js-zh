- img_proc: true
  md: "You can add event handlers to page elements in two ways, and Internet Explorer\
    \ throws a wrench into the works by providing a completely different event API\
    \ from every other modern browser. Handling events properly across all browsers\
    \ can be tricky, but fortunately JavaScript libraries make it much easier by abstracting\
    \ away the messy details. Cross-browser event handling is the biggest reason why\
    \ I almost always use a library when programming JavaScript.\n\nThis chapter introduces\
    \ event handling in pure JavaScript, followed by examples for the different event\
    \ types. That way, you can have a sense of what's going on under the hood when\
    \ you use JavaScript event library functions in the examples later in the book.\n\
    \n# Event Attributes\n\nThe simplest way to add an event handler is to assign\
    \ a function to an event attribute of DOM element. Event attributes have names\
    \ like onclick, onkeypress, and on onload.\n\n```\nvar link = document.getElementsByTagName(\"\
    a\")[0];\nfunction clickHandler() {\n  alert(this.href);\n  return false;\n}\n\
    link.onclick = handleClick;\n```\n\nAssuming there is a link in your HTML document,\
    \ clicking it shows an alert dialog box with the href value of the link. The browser\
    \ won't follow the link because its default behavior is prevented.\n\nThis style\
    \ of event handling works the same across all browsers. For simple tasks, it's\
    \ a great way to start working with events."
