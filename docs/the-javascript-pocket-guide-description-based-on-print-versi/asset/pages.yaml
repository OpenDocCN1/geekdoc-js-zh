  md: '# Nonblocking and Lazy Loading


    What I''ll show next is an advanced technique, but you''ll encounter it in later
    chapters that use certain JavaScript libraries, so I''ll briefly explain it here.


    You can use JavaScript to include other script files in a Web page. You simply
    create a <script> element and append it to the document.


    ```

    var script = document.createElement("script");

    script.type = "text/javascript";

    script.src = "my-script.js";

    document.getElementsByTagName("head")[0].appendChild(script);

    ```


    When you dynamically append a script to a page, the browser does not halt other
    processes, it continues rendering page elements and downloading resources. This
    is called *nonblocking* script loading.


    You can also use this technique at arbitrary times in your script. You may decide
    to include only a small amount of code at page load and then download other script
    files only when needed. This is called *lazy loading*.


    Many popular JavaScript libraries now include utility functions to encourage these
    practices. Some libraries exist specifically for this purpose, such as LABJs (http://labjs.com/).
    Other libraries use it as the primary method of including scripts in a page, such
    as YUI3 (http://developer.yahoo.com/yui/).


    Unless they use a library that leverages nonblocking script loading, the examples
    in this book will use simple <script> elements to include JavaScript in HTML.'
  merge: -1
