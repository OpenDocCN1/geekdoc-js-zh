  md: "# The style Attribute\n\nThe style attribute is special in JavaScript. In HTML,\
    \ it allows you to write inline CSS for a specific element.\n\n```\n<p style=\"\
    font-family: monospace; background-color: #fcc;\n  margin-bottom: 10px\">Text</p>\n\
    ```\n\nIn JavaScript, element's style property is a special object with properties\
    \ for every CSS property.\n\n```\np.style.fontFamily = \"monospace\";\np.style.backgroundColor\
    \ = \"#fcc\";\np.style.marginBottom = \"10px\";\n```\n\nTake note of two really\
    \ important details about that example:\n\n+   - CSS properties with multiple\
    \ words are referenced in camelCase in JavaScript.\n- Values for style properties\
    \ are always strings. Numbers still need units like \"px\" or \"em.\"\n\nYou can\
    \ assign values freely to style properties. If the browser's CSS engine doesn't\
    \ understand a value, it will be ignored.\n\nThere are nearly limitless uses for\
    \ style properties, but they require a solid understanding of CSS to be used effectively.\n\
    \nReading values from the style property can be confusing at first. Values come\
    \ from the actual style attribute in the HTML, not from CSS.\n\n```\n#styled {\n\
    \  width: 100px;\n}\n<div id=\"styled\" style=\"height: 100px\"></div>\n```"
