  md: "```\nreturn table.find(\"tbody\").empty().append(results);\n  join(\"\\n\"\
    );\n\nfunction templatize(template, obj) {\n  return template.replace(/\\{([^\\\
    }]+\\}/g,\n    function(match, subpattern) {\n      return obj[subpattern] ==\
    \ null ? \"\" : obj[subpattern];\n    });\n}\n```\n\nThe template() function is\
    \ a sophisticated usage of regular expressions and the replace method that maps\
    \ words inside curly braces (such as \"{name}\") with the property names of an\
    \ object.\n\nThe updatePageLinks() function changes the <caption> and the navigation\
    \ links to reflect the new page loaded in Ajax. The href attributes of \"Previous\"\
    \ and \"Next\" links change to point to pageNum + 1, respectively.\n\n```\nfunction\
    \ updatePageLinks(pageNum) {\n  pageCount.text(pageNum + 1);\n  var pattern =\
    \ /\\page=-?\\\\d+;/\n  pageLinks.eq(0).attr(\"href\", function(index, value)\
    \ {\n    return value.replace(pattern, \"page=\" + (pageNum - 1));\n  });\n  pageLinks.eq(1).attr(\"\
    href\", function(index, value) {\n    return value.replace(pattern, \"page=\"\
    \ + (pageNum + 1));\n  });\n}\n```\n\nAt this point, the Previous and Next links\
    \ should work without reloading the page."
