  md: 'or share a URL that corresponds to your page''s current state, and the browser''s
    back and forward buttons are no longer useful. The solution is to use the window.location.hash
    property to change the URL without reloading the page.


    +   - Before clicking an Ajax-driven link: http://example.com/index.html


    +   - After clicking the link: http://example.com/index.html#page2


    This is a complicated technique, so I''ll skip this concern in the example later
    in the chapter. Check out the SWFADress library (http://www.as.com/swfadress/)
    to learn more about this technique.


    **Accessibility and search engine optimization.** Search engines and users without
    JavaScript enabled won''t see your Ajax behaviors. It''s always a great idea to
    use progressive enhancement so that your pages work just as well with and without
    Ajax. The following example demonstrates one way to achieve this.


    # # Ajax Example


    This example shows you how to take a simple Web page and add Ajax behavior to
    it. The page does three things:


    +   - Shows a table of data pulled from a storage file


    +   - Breaks the data into “pages” that you can navigate with Previous and Next
    links


    +   - Provides a form for adding new data to the storage file


    Ajax isn''t much use unless your server can send and receive useful data, so you''ll
    use a little bit of PHP (http://php.net) to manage your data. You''ll need PHP
    version 5.2.0 or higher to use the JSON functions.'
