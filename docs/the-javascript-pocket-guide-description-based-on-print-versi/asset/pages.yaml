  md: '# MooTools Glossary


    Here is a short summary of the MooTools functions used in this chapter. You can
    find much more information in the online documentation at http://mootools.net/docs/core.


    # Element Utilities


    $(id) MooTools'' version of getElementsById(). This returns a MooTools element
    that provides element methods.


    $$(selector) Retrieves elements that match the given selector.


    $$(collection) Returns an array of MooTools elements that each provide element
    methods.


    # Element Methods


    element.add(eventType, handler) MooTools'' version of addEventListener().


    element.getChildren() Returns the element''s child elements.


    element.getParent() Returns the element''s parent element.


    element.getParents() Returns an array of all of the element''s ancestors.


    element.store(name, value) Stores an arbitrary value on an element.


    element.retrieve(name) Retrieves arbitrary values saved on the element with store().


    element.setStyle(name, value) Sets the style property of the element(s).


    element.set(name, value) Sets an attribute on the element(s).


    element.addClass(className) Adds a class name to the element(s).'
