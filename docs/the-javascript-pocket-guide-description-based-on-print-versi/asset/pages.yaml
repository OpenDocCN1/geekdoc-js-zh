  md: 'Ajax used to be an acronym for “Asynchronous JavaScript and XML,” but now it’s
    just a buzzword for highly dynamic Web pages. With Ajax, you have the ability
    to send and receive data from your server without having to load a whole new page.
    This allows you to do the following:


    +   - Quickly load additional content only when the user needs it, making your
    initial page load smaller


    +   - Send data from links and forms back to the server without a page refresh,
    which makes your pages feel faster


    The XMLHttpRequest object makes Ajax possible. Originally a Microsoft innovation,
    all modern browsers support it without too many cross-browser inconsistencies.
    I recommend researching how to use the native XMLHttpRequest object to understand
    what’s going on under the hood,'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'but for this tutorial, you''ll just use jQuery''s .ajax() function to keep
    things simple.


    # Ajax Considerations


    On the surface, Ajax is a relatively simple technique, but in practice you need
    to be aware of some security and usability concerns.


    # Servers


    You''ll need a server to use Ajax because browsers won''t let JavaScript read
    files off your hard drive. This is an important security restriction; you never
    want to allow a script to access your important documents.


    # Same-Origin Policy


    The same-origin policy is another security restriction that prevents a script
    from sending and receiving data from another server. It''s especially important
    for Web pages that use cookies to manage user accounts. Without this restriction,
    a script could use your cookies and pretend to be you on another site.


    # Data Formats


    Ajax responses are always text, but you have a few options on how that text is
    formatted.


    **Text or HTML.** If the server responds with text or HTML, you can simply inject
    it into your HTML to add or update content on your page. Text responses can also
    provide arbitrary data such as error messages.


    **XML.** The X in Ajax originally stood for XML, which was the common response
    type when Microsoft invented the XMLHttpRequest object. You'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 15: Ajax 239


    Can use DOM methods and properties such as getElementsByTagName() or childNodes
    to walk the XML DOM tree and extract information.

    I think that using XML responses is overly complicated, so I avoid it when possible.


    JSON: JavaScript Object Notation (JSON) is a way to store data in a string that
    looks like a JavaScript object or array. It''s easy to turn this string into a
    real JavaScript object, so it''s my preferred data format in most Ajax situations.


    Modern browsers such as Firefox and Safari provide a simple API for handling JSON:


    ```

    JSON.stringify({ propertyName : "value" });

    JSON.parse("{propertyName\":"value\}");

    Object { propertyName="value" }

    ```


    JavaScript libraries provide functions like jQuery''s $.parseJSON so that you
    can effortlessly handle JSON across all browsers.


    # User Experience


    Users used to loading new pages when they click links and submit forms. If you
    replace that behavior with Ajax, you may need to do some extra work so that users
    still know what''s happening.


    Loading indicators. The browser doesn''t tell the user that you''re making an
    Ajax request. You should show some kind of loading indicator so the user knows
    that something is happening. I like using animated GIFs, such as the free ones
    at http://www.ajaxload.info/


    Back buttons and bookmarks. Ajax actions don''t change the URL in the browser''s
    location field. This has two effects: The user can''t bookmark'
