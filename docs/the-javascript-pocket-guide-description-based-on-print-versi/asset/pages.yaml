  md: '# Servers and PHP


    If you don''t already have a server that supports PHP, I recommend installing
    the basic version of XAMPP (http://www.apachefriends.org/en/xampp.html). The installation
    instructions are excellent and should get you up and running fairly quickly. After
    you install XAMPP and start the Apache Web server, create your example files in
    these directories (assuming you installed it in the default location):


    Windows: C:\xampp\htdocs\

    Mac: /Applications/XAMPP/htdocs/

    Then you can point your browser to http://localhost to see your files.


    # Setup


    This example has several interlocking parts, so you should keep them in separate
    files to make the code clearer. Start by creating these four files:


