  md: "# Chapter 8: Client-Side Scripting\n\nRequiring JavaScript goes against the\
    \ principles of progressive enhancement, so I avoid code like this whenever I\
    \ can.\n\n# ### JavaScript-Specific CSS Classes\n\nI use the following technique\
    \ a lot so that I can write CSS for situations with and without JavaScript by\
    \ replacing the no-js class with the js class. Start by including a no-js class\
    \ in your markup, as shown here:\n\n```\n<html class=\"no-js\">\n\n```\n\nThen\
    \ include a <script> tag that immediately replaces that class with a js class.\n\
    \n```\n<script type=\"text/javascript\">\n  document.documentElement.className\
    \ = document.documentElement.className.replace(/\\bno-js\\b/, \"js\");\n</script>\n\
    ```\n\nI like this technique enough, in fact, that I prefer a shorter version,\
    \ as shown here:\n\n```\n(function(d, c) {\n  d[c] = d[c].replace(/\\bno-js\\\
