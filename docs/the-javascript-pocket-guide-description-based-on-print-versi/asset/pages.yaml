    images.each(function() {\n  var image = $(this);\n  image.css({\n    left : slidesWidth\
    \ / 2 - image.width() / 2,\n    top : slidesHeight / 2 - image.height() / 2\n\
    \  });\n});\n```\n\nCentering elements with JavaScript is a pretty common task.\
    \ I find myself typing variations of this formula quite often. The each() method\
    \ makes it easy to set the left and top style properties for every image.\n\n\
    ```\n// Save a reference to the first image\nvar activeImage = images.eq(currentImageIndex);\n\
    ```\n\nBefore you start the slideshow, you'll need to save a reference to the\
    \ first image. The eq() method returns a single element wrapped in a jQuery"
