  md: '![](img/4a8fa16ebbe3c330347de80256b877b4_156_0.png)


    This chapter could easily be titled something like “Scripting HTML,” but the DOM
    is such an important concept that it deserves marquee status. DOM stands for “Document
    Object Model,” which is a concise way of explaining exactly what it is: the model
    (or representation) for the objects in an HTML document. More specifically, it
    is a hierarchy of data types for HTML documents, links, forms, comments, and everything
    else that can be represented in HTML code.


    Like everything else in client-side scripting, the DOM has a muddy history, and
    resulting implementations across browsers are more complicated for it. Web standards
    have smoothed out many rough edges, but you still have to account for missing
    methods and differences in implementations, especially in Internet Explorer. (Chapter
    12 will show how to take advantage of code that lets you ignore all these differences.)'
  merge: -1
