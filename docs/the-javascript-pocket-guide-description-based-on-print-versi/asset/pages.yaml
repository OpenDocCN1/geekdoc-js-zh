  md: "# Chapter 12: Libraries\n\n```\n<script type=\"text/javascript\" src=\"http://yui.yahooapis.com/combo?3.0.0/build/yui-min.js\"\
    ></script>\n<script type=\"text/javascript\">\nYUI().use(\"overlay\", function(Y)\
    \ {\n  var overlay = new Y.Overlay();\n});\n</script>\n```\n\nThis example includes\
    \ the seed file in one <script> element and uses the YUI().use() method to load\
    \ all the JavaScript required to use the Overlay widget, which ends up being another\
    \ 98KB. Using this pattern, you download only the code you need for each page,\
    \ which helps avoid wasting bandwidth.\n\nOnce the rest of the JavaScript downloads,\
    \ the library executes the callback function. The Y object contains all the methods\
    \ and objects in the library for you to use in your code. Using callback functions\
    \ like this encourages programmers to encapsulate their code in functions to avoid\
    \ conflicts with other JavaScript in the page. The Y object is specific to that\
    \ script and and available only inside the callback function.\n\nOnce the callback\
    \ function executes, YUI 3 operates similarly to jQuery, just replace $ with Y.\
    \ It has basically the same support for CSS selectors, event handling, and chainability,\
    \ just with different method names.\n\nY.one(\"#domId\").all(\".className\").on(\"\
    click\", onClick);\n\nYUI 3 stands apart from jQuery by having a large number\
