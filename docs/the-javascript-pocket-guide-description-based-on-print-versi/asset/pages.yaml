  md: "# Event Attributes in HTML\n\nI'm referring to this style of event handling\
    \ as *event attributes* and not *properties* because you can use them as HTML\
    \ attributes.\n\n```\n<a href=\"http://www.google.com\" onclick=\"alert(this.href);\n\
    \rightarrow return false;\">Click Here</a>\n```\n\nI won't show any more examples\
    \ of this style of code because it's always best to avoid mixing HTML and JavaScript.\n\
    \n# Return Values\n\nHandlers on event attributes can prevent the default behavior\
    \ of an event by returning false. For click events on links, this prevents the\
    \ browser from following the link and loading a new page. For submit events on\
    \ forms, this prevents the form from submitting and loading a new page.\n\n```\n\
    var form = document.getElementsByTagName(\"form\")[0];\nfunction preventSubmit()\
    \ {\n  return false;\n}\nform.onsubmit = preventSubmit;\n```\n\n# Event Attribute\
    \ Method Context\n\nThe browser executes event attribute handlers in the context\
    \ of the elements to which they were bound. This means you can access the element\
    \ with the `this` keyword."
