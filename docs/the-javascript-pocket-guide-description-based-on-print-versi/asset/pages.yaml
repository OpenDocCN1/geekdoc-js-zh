  md: '# Changing Case: toUpperCase(), toLowerCase()


    The methods toUpperCase() and toLowerCase() are pretty self-evident. I mentioned
    earlier that uppercase letters are “lower” than lowercase letters, so these methods
    are useful when you want to reliably compare strings in alphabetical order.


    ```

    var string1 = "B comes after (is greater than) a";

    var string2 = "a comes before (is less than) b";


    string1 > string2;

    alse


    string1.toLowerCase() > string2.toLowerCase();

    true


    string2.toUpperCase() < string1.toUpperCase();

    true

    ```


    It doesn''t really matter which method you use as long as you’re consistent.


