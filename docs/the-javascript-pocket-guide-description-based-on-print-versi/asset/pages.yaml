    \ here</p>\n\n```\nvar para = document.getElementById(\"para\");\npara.addEventListener(\"\
    click\", eventHandler, false);\npara.addEventListener(\"click\", otherEventHandler,\
    \ false);\n\nfunction eventHandler(event) {\n  alert(\"You clicked \" + this.nodeName);\n\
    }\nfunction otherEventHandler(event) {\n  alert(\"This was a \" + event.type +\
    \ \" event\");\n}\n```\n\nClicking the paragraph element should result in two\
    \ alert dialogs that say, \"You clicked a P\" and \"This was a click event.\"\n\
    \nYou cannot be sure which event handler will execute first. It's entirely up\
