  md: "# change\n\nThe change event occurs after the user changes the value of an\
    \ editable element. it usually occurs after any mouse or keyboard events.\n\n\
    ```\n<select name=\"select\" id=\"mySelect\">\n  <option value=\"4\">Option 1</option>\n\
    \  <option value=\"8\">Option 2</option>\n  <option value=\"15\">Option 3</option>\n\
    </select>\n```\n\n```\nvar select = document.getElementById(\"mySelect\");\nselect.on\
    \ = function(event) {\n  var newValue = this.options[this.selectedIndex].value;\n\
    \  alert(\" New value is \" + newValue);\n}\n```\n\n# submit\n\nThe submit event\
    \ applies only to <form> elements. It occurs when the user submits a form. You\
    \ can prevent its default behavior, which is useful for stopping the submission\
    \ if there are errors in the fields.\n\n# Other Events\n\nThese events pertain\
    \ to mouse and keyboard use and are especially relevant to form inputs.\n\n# focus\n\
    \nAn element has focus when it can receive keyboard events. By default, the only\
    \ elements that can receive focus are the document, links, and form inputs. Users\
    \ typically change focus from one element to another"
