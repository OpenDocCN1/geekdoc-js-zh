  md: "# Asynchronous Programming\n\nThe setTimeout() and setInterval() functions\
    \ are the first examples in this book of asynchronous programming. You'll also\
    \ encounter this crucial JavaScript concept when you learn about events, Ajax,\
    \ and animation in Chapters 11, 15, and 16, respectively.\n\nA script is asynchronous\
    \ when code can be executed at arbitrary points in time. JavaScript embraces this\
    \ concept by treating functions as just another type of data. You can pass around\
    \ functions as callbacks and event handlers, not knowing exactly when (if ever)\
    \ the browser will call them. You may want a function to run when the user clicks\
    \ the mouse, but you can't know when they will actually do so.\n\nAsynchronous\
    \ programming makes function context binding much more complicated. Consider this\
    \ example:\n\n```\nvar myWeb = {\n  value : \"myObject's value\",\n  method :\
    \ function() {\n    console.log(this.value);\n  }\n}\nsetTimeout(myObject.method,\
    \ 3000);\n```\n\nThe method function executes about three seconds later, but it's\
    \ no longer bound to myObject. Without that context, this.value returns undefined."
