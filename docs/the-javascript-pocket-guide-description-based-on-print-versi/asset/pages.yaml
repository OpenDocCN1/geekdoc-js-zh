  md: '# Introduction


    Between e-mail applications, social networking sites, online word processors,
    and mobile Web browsers, the Internet is becoming more useful and more powerful
    every day. A lot of that power comes from JavaScript, a quirky little language
    available on nearly every computer in the world through browsers such as Internet
    Explorer, Firefox, Safari, Opera, and Chrome. Brendan Eich created the language
    for the Netscape browser in 1995, naming it after Java even though the languages
    have only superficial similarities. Its formal name is ECMAScript, governed by
    the European Computer Manufacturers Association (ECMA), which published the fifth
    edition of the language in December 2009.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'JavaScript is a *scripting language*, meaning it gives you the ability to control
    an environment with code. In the case of JavaScript, the environment is usually
    a Web page in a browser, where you can react to the mouse and keyboard, create
    and animate elements on the page, communicate with servers, and much more.


    # Why JavaScript Is Cool


    The following are the reasons why JavaScript is cool—or at least why / I think
    it''s cool:


    +   - **Low barrier to entry.** Anyone can start writing and testing JavaScript
    with software they already have on their computer.


    +   - **Easy of deployment.** All you need to include JavaScript on your Web site
    is a server to store the code files and the `<script>` tag.


    +   - **Small language, big power.** The language has a relatively small number
    of features, but its flexibility and expressiveness lets you accomplish a great
    deal.


    +   - **The quirkiness.** JavaScript has a lot of little oddities and flaws that
    I find fascinating. It seems like I learn a new nuance to the language every week.
    Some nuances are even useful!


    +   - **The language of the moment.** JavaScript is becoming more important and
    more powerful as our lives are increasingly impacted by the Internet.


    +   - **The community.** I''m continually amazed at the brilliance and ingenuity
    of the JavaScript community, most of whom release their code for anyone to use
    for free.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Who Should Read This Book


    You''ll need a solid foundation of HTML and CSS because there''s little room to
    explain either of those languages in this book. Ideally, you''ve seen JavaScript
    before; maybe you''ve even copied some code from an online tutorial to into your
    blog. If you''re coming from a different programming background, I''ll briefly
    touch on the factors that make JavaScript fairly unique among popular languages
    today.


    # What You Need to Follow Along


    You need a text editor to write JavaScript files, ideally one with syntax highlighting
    such as Notepad2 for Windows or TextWrangler for Mac OS X (both free). Also, because
    of security restrictions on Web browsers, you will need a server to try the Ajax
    examples, either running on your own computer or running on the Web. XAMPP (http://www.apachefriends.org/en/xampp.html)
    is a good program to get a server running quickly on your own computer.


    # What''s in This Book


    The first half of this book (Chapters 1–8) begins with some basics followed by
    explanations of the fundamental parts of the language. You won''t learn many practical
    uses of JavaScript until the second half (Chapters 9–17), which covers programming
    Web pages and contains in-depth tutorials for a variety of tasks. Throughout the
    chapters and code examples, I emphasize the important concepts more than the minute
    details, but you''ll also be able to take much of this code and use it in your
    own sites right away.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# What’s Not in This Book


    I''m not trying to cover everything about JavaScript. Some parts of the scripting
    language are problematic and not worth using. Other parts are used too infrequently
