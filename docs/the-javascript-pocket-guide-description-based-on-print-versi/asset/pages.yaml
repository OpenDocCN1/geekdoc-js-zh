  md: '# Arrays in MooTools


    The next method, initMenuItems(), finds all the elements in the menu''s container
    that you''ll need to add menu behavior.


    ```

    initMenuItems : function() {

    // The top <ul>

    this.list = this.container.getChildren();

    // The top <li>(File, Edit, Window)

    this.items = $(this.list.getChildren());

    // The links in the top <li>

    this.links = $(this.list.getElementsByElements("a"));

    // The submenu <ul><li>

    this.submenus = this.container.getElements("ul ul");

    }

    ```


    MooTools''s element-finding methods, such as getChildren() and getElements(),
    return special arrays with added methods. When you call an element-finding method
    on an array of MooTools objects, it returns an array of arrays:


    ```

    // An array of links for each item in this.items

    this.items.getChildren("a #")

    [[a #], [a #], [a #]]

    ```


    The $$() function has many uses, one of which is flattening these nested arrays
    for use with all the MooTools methods.


    ```

    $$(this.items.getChildren("a #"))

    [a #, a #, a #]

    ```


    # Event Handlers in MooTools Classes


    The Menu class''s addMouseEvents() method adds click event handlers to the links
    in the menu and on the document element.'
