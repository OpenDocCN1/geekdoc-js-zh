  md: "# The JavaScript Pocket Guide\n\naddEventListener(eventType, handler, capture)\n\
    \nThe addEventListener() method explains its purpose right in the name. The eventType\
    \ argument is a string for the type, like \"submit,\"mouseover,\" or \"keypress.\"\
    \ The handler is a function. And capture is a required Boolean value that I will\
