  md: 'addEventListener() and the nonstandard attachEvent(). Other times, a browser
    might completely lack a feature, such as querySelector(), and a library can fill
    that gap. The solution won''t ever perform quite as well as the native function,
    but it''s usually better than having it at all.


    A less important but influential aspect of libraries has to do with coding style.
    JavaScript is an especially flexible language, and no two programmers write code
    exactly the same way. JavaScript libraries however, tend to enforce a particular
    style. This can be through which language features they use, their naming conventions,
    or their design and organization. A unified style makes it easier to read similar
    code and work with other programmers.


    Lastly, nearly every library is open source and free to use in your projects.
    This encourages innovation, and many developers release components and tools for
    use with the library. Using a library allows you to take advantage of the hard
    work of hundreds of other JavaScript programmers all over the world.


    # Choosing a Library


    Doz of JavaScript libraries are available. On the whole, anything you do in one
    library you can do just as well in another. So, how do you choose?


    First, does the library do what you need to do? If you need complicated features,
    such as sophisticated data grids or drawing capabilities, you may want to consider
    certain libraries over others. If your needs are simple, most popular libraries
    will fit the bill.


    Another consideration is if you need your library to play well with other code.
    In Chapter 6, you learned about adding methods to built-in'
