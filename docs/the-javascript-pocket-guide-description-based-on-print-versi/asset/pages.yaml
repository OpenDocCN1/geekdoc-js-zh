  md: '# Constants and Functions


    JavaScript has a number of built-in constants and functions that you can use:


    +   - **NaN(x)** Returns true if x is not a number or easily converted to a number.


    +   - **Number.MAX_VALUE** The largest number you can express in JavaScript.


    +   - **Number.MIN_VALUE** The lowest negative number you can express in JavaScript.


    +   - **Infinity** A global variable that represents infinity. This is the result
    if you try to divide by zero.


    # The Math Object


    The Math object provides many constants and functions for more complex operations.


    +   - **Math.PI** An approximate value of pi


    +   - **Math.abs(x)** The absolute value of x


    +   - **Math.ceil(x)** The closest integer greater than x


    +   - **Math.floor(x)** The closest integer less than x


    +   - **Math.max(x, y, ...)** The largest of all arguments


    +   - **Math.min(x, y, ...)** The smallest of all arguments


    +   - **Math.random()** A pseudorandom number between o and 1


    +   - **Math.round(x)** The closest integer to x


    +   - **Math.sqrt(x)** The square root of x'
