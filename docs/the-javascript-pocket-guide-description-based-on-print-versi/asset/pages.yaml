  md: "```\nvar slideEffect = new Fx.Slide(submenu, {\n  duration: this.options.duration\n\
    });\nslideEffect.hide();\nsubmenu.store(\"slide\", slideEffect);\n```\n\nThe final\
    \ step is to override the showMenu() and hideMenu methods to use the slide effect\
    \ objects instead of just setting the display style.\n\n```\nshowMenu : function(submenu)\
