  md: 'Creating interesting, engaging, and useful Web pages that anyone can use is
    a daunting challenge, but it is possible. The most prevalent strategy is commonly
    known as progressive enhancement.


    I like to think of Web development as layers upon layers (Figure 10.1). HTML is
    your most basic, fundamental layer. A well-organized HTML page should be accessible
    to any user because it is just plain text decorated with a bit of meaning (or
    semantics) using HTML tags.


    **Figure 8.1**

    The layers of Web development.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_140_0.png)


    CSS is your second layer, which determines presentation and layout. Some users,
    especially the visually impaired, won''t get this layer.


    JavaScript is your third layer, which adds behavior and interactivity. The number
    of users without JavaScript is dwindling, but they still exist.


    Images, plug-ins such as Flash and Silverlight, video, and audio are examples
    of additional layers of Web content.


    Because it''s inherently the most accessible, the fundamental HTML layer should
    be the only layer required to use your Web pages. Each'
