  md: "# Creating Functions\n\nThe two ways to create functions both use the function\
    \ keyword, so the differences between them aren't immediately apparent.\n\n# Declarations\n\
    \nVariable declarations and function declarations operate similarly. They start\
    \ with a keyword (var or function), followed by an identifier. Function declarations\
    \ add lists of arguments in parentheses followed by blocks in curly braces.\n\n\
    ```\nfunction functionName(arg1, arg2, argN) {\n  // Block of statements\n}\n\
    ```\n\nJavaScript interpreters look at function declarations before everything\
    \ else in the script, so you can call them even before you declare them.\n\nmyFunc();\n\
    \n```\nfunction myFunc() {\n  // Statements\n}\n```\n\n# Expressions\n\nYou don't\
    \ have to declare a name for a function, though the following example is pretty\
    \ useless (and requires extra parentheses so as not to throw an error):\n\n```\n\
    (function() {\n  // Statements\n});\n```"
  merge: -1
