- img_proc: true
  md: "The first thing you need to do is find the slideshow <div> by passing a CSS\
    \ selector to the jQuery function($). Store it on a variable so that you can find\
    \ other elements inside it later in the script. The first element to find is the\
    \ slides <div>. You'll also need to keep track of the currently visible image\
    \ with the currentIndexIndex variable.\n\n# Best Practices for Using CSS Selectors\
    \ in JavaScript\n\nThere's only one <div class=\"slides\"> element in the page,\
    \ so why did I use slideshow.find(\".slides\") instead of just $(\\(\".slides\"\
    )\\?\n\nInternet Explorer as well as older browsers do not support getElementsByClassName()\
    \ and queryquerySelectorAll(). JavaScript libraries provide support for these\
    \ utilities in older browsers by looping over every element to find the ones that\
    \ match your class name or CSS selector. This can take a noticeable amount of\
    \ time if the library has to loop over many elements.\n\nBy using slideshow.find(),\
    \ you can limit the search to just the elements inside the slideshow <div> to\
    \ improve the performance of your code.\n\n# Creating the Slideshow Images\n\n\
    The next step is to use the list of links to create images and add them to the\
    \ slideshow.\n\n```\n// Create images from the link list\nslideshow.find(\"ul\
    \ a\").each(function() {\n  var link = \\$(this);\n  var size = link.attr(\"data-size\"\
    ).split(\"x\");\n```"
  merge: -1
