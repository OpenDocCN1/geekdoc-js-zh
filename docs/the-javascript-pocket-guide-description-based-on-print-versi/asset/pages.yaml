  md: "# The JavaScript Pocket Guide\n\n+   Each image will exist inside the slides\
    \ <div>, but I've included only the first image in the markup.\n\n+   The slideshow\
    \ includes an unordered list of links that point to the remaining images. I've\
    \ also stored their sizes on the custom data-size attributes.\n\nThis is a somewhat\
    \ rudimentary example of progressive enhancement. The unordered list of links\
    \ serves dual purposes: Users without JavaScript can still access the remaining\
    \ images by clicking the links and loading the images individually, and it's easy\
    \ to use the data stored in the markup to build the slideshow dynamically. I consider\
    \ it a small victory whenever I can reuse accessible markup in the page to create\
    \ a more engaging experience for users who can support it.\n\n# Slideshow CSS\n\
    \nCreate a file called slideshow.css, and include the following CSS rules. It's\
