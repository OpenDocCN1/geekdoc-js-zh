  md: '# The JavaScript PocketGuide


    Here is your essential companion to JavaScript. *The JavaScript Pocket Guide steers
    you through how to:


    +   - Use basic JavaScript objects such as numbers, strings, and arrays.

    - Tap the power of functions.

    - Take advantage of JavaScript''s flexible objects.

    - Interact with browsers, Web pages, servers, and user input through client-side
    scripting.

    - Build slideshows and dropdown menus.

    - Create dynamic Web pages with Ajax and animation.


    Plus an introductory chapter that covers JavaScript basics and brings the novice
    coder up to speed.


    The book’s companion Web site at www.peachpit.com/javascriptpocketguide includes
