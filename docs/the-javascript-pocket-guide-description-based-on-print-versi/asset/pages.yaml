    # Enumerable Properties


    Remember all those array methods such as push() and slice() are properties of
    arrays too. But they don''t show up when you loop over the properties of myArray.
    This is because they are not enumerable. All objects have a convenience function
    called propertyIsEnumerable() to check this:


    ```

    var myArray = [1,2,3];

    myArray.propertyIsEnumerable(0);

