  md: "# Practical Function Context Binding (continued)\n\nThis won't work, however,\
    \ because toggleLink() also a Menu object method. Since the this keyword refers\
    \ to the clicked element, you don't have access to the toggleLink() method for\
    \ the current Menu object. Fortunately, MooTools provides a helper method for\
    \ all functions to bind the context of a function to an object:\n\n```\nthis.links.add(\"\
    click\", onClick.bind(this));\nonClick : function(event) {\n  // Open or close\
    \ the submenu for this link\n  var clickedLink = ???;\n  this.toggleLink(clickedLink);\n\
    }\n```\n\nNow you need another way to access the clicked element, since you changed\
    \ what the this keyword referred to. In this case, the clicked element is also\
    \ available as event.target.\n\n```\nonClick : function(event) {\n  // Open or\
    \ close the submenu for this link\n  var clickedLink = event.target;\n  this.toggleLink(clickedLink);\n\
    }\n```\n\nIf the link contained children, you might have had to walk up the DOM\
    \ tree to get to the link element because of event bubbling.\n\nIf you're used\
    \ to programming in a language with built-in classes, this context binding miss\
    \ seem like an awkward step. In ActionScript 3, for instance, the this keyword\
    \ always refers to the current object and always has access to the object's properties\
    \ and methods. It's easier to change function context in JavaScript, so these\
    \ extra steps are necessary if you want to emulate classes and classical object-oriented\
    \ patterns."
