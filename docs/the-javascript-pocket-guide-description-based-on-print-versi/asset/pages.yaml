  md: "object. (If you wanted just the plain DOM element, you can access it as an\
    \ element in an array: images[0]).\n\n# The Slideshow Code\n\nEverything up to\
    \ this point has been setup code. The meat of the script is in the showImage()\
    \ function, which takes an index that indicates which image to show.\n\n```\n\
    // The function to show the next or previous image\nfunction showImage(newIndex)\
    \ {\n  currentImageIndex = newIndex >= images.length ? 0 :\n  - newIndex;\n  currentImageIndex\
    \ = currentImageIndex < 0 ? images.length\n  - 1 : currentImageIndex;\n\n  activeImage.fadeOut();\n\
    \  activeImage = images.eq(currentImageIndex).fadeIn();\n}\n```\n\nThe first two\
    \ lines are another pattern I end up writing a lot. There are only four images\
    \ (indices o through 3), so when you pass 4 to showImage(), the number should\
    \ wrap around to 0. Likewise, if you pass -1, it should wrap the other direction\
    \ to 3. At this point, I can easily recognize this pattern when I see it, but\
    \ you may prefer a more obvious version.\n\n```\n// This example code doesn't\
    \ go in slideshow.js\ncurrentImageIndex = newIndex;\nif (currentImageIndex >=\
    \ images.length) {\n  currentImageIndex = 0;\n} else if (currentImageIndex < 0)\
    \ {\n  currentImageIndex = images.length - 1;\n}\n```"
