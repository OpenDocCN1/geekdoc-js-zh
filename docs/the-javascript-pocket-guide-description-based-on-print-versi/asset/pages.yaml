  md: "# Easing\n\nEasing refers to using curved equations for more graceful or expressive\
    \ animation. There are three basic types:\n\n+   * *Ease out* is when the animation\
    \ gradually slows down as it ends.\n* *Ease in* is when the animation gradually\
    \ speeds up as it starts.\n* *Ease in/out* is a combination of both.\n\nFirst\
    \ rewrite the timeBased() function to use easing equations. I usually shorten\
    \ some variable names to match the equations: t is timePassed, c is distanceToTravel\
    \ (or \"change\"), b is begin, e is end, and d is duration.\n\n```\nfunction timeBasedEasing(box,\
    \ b, e, d, easing) {\n  var c = e - b,\n  startTime = new Date();\n\n  function\
    \ move() {\n    var t = new Date() - startTime;\n\n    if (t < d) {\n      box.style.left\
    \ = easing(t, b, c, d) + \"px\"\n      setTimeout(move, 0);\n    } else {\n  \
    \    box.style.left = e + \"px\"\n    }\n  }\n  move(); // Start the animation\n\
    }\n```\n\nThe function is basically identical to timeBased(), except that it offloads\
    \ most of the calculation to the easing argument. Next, create the linear easing\
    \ equation:"
  merge: -1
  pgno: 292
- img_proc: true
  md: "```\nfunction linear(t, b, c, d) {\n  return c*t/d + b;\n}\n```\n\n> The easing\
    \ functions in this chapter come from Robert Penner's Easing Equations for ActionScript,\
    \ released under a BSD License: http://www.robertpenner.com/easing_terms_of_use.html.\n\
    \nThen, you can call the timeBasedEasing() function with the linear() function\
    \ as an argument:\n\n```\ntimeBasedEasing(document.getElementById(\"box\"), 0,\
    \ 200, 1000,\nlinear);\n```\n\nThere's nothing surprising there, but you can swap\
    \ linear() with a function like this:\n\n```\nfunction easeOutExpo(t, b, c, d)\
    \ {\n  return (t==d) ? b+c : c * (-Math.pow(2, -10 * t/d) + 1) + b;\n}\ntimeBasedEasing(document.getElementById(\"\
    box\"), 0, 200, 1000,\neaseOutExpo);\n```\n\nThe animation starts much faster\
    \ and \"eases\" to a stop. The \"ease in\" version looks like this:\n\n```\nfunction\
    \ easeInExpo(t, b, c, d) {\n  return (t==0) ? b : c * Math.pow(2, 10 * (t - 1))\
    \ + b;\n}\ntimeBasedEasing(document.getElementById(\"box\"), 0, 200, 1000,\neaseInExpo);\n\
    ```\n\nThere are even more easing functions for elastic and bouncing movement,\
    \ but they're too complicated to include in this book."
  merge: -1
