    what you do, I''m including references to copies of the files stored by Google
    and Yahoo!


    Google''s Ajax Libraries API (http://code.google.com/apis/ajaxlibs/) is a content
    distribution network (CDN) that provides copies of recent versions of JavaScript
    library files. One downside to using Google''s API or any other CDN is that you
    have to be connected to the Internet to continually download the files and test
    your code. If you want to follow the tutorials of this book offline, you''ll need
    to download the libraries from their respective sites.


    YUI 3 uses some interesting techniques for including parts of the library, as
    I''ll discuss in a moment. The easiest way to use the library is to use the Yahoo!s
    own content distribution network.


    I''m including the most recent versions of these libraries at the time of this
    writing. A newer version may be available by the time you''re reading this, but
