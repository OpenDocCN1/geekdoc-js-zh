  md: '# Global Variable Best Practices


    You should limit your global variables and functions as much as possible. Another
    script could easily overwrite your global variables and cause hard-to-find bugs
    in your code. Fortunately, you can take advantage of function scope to control
    access to your variables and functions.


    For simple scripts, I like to put all my code inside a self-invoking function.
    For more complicated scripts, especially ones that interact with other scripts,
    I prefer storing all the code on a single namespace object. See Chapters 5 and
    6 for examples of both these techniques.


