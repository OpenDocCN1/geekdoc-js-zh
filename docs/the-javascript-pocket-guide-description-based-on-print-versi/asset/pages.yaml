  md: "# Prototypes of DOM Nodes\n\nDOM nodes aren't true JavaScript objects but instead\
    \ interfaces to the elements in the HTML document. The actual implementation of\
    \ these interfaces is complicated and varies across browsers, the end result is\
    \ that you can't reliably manipulate the prototypes of their data types. For example,\
    \ you can't add an insertAfter() method to all DOM elements like I added trim()\
    \ to all strings in Chapter 6.\n\nMost JavaScript libraries create wrapper objects\
    \ for DOM nodes in order to add methods and code in an object-oriented style.\
    \ Here is a simple example so that the concept is more familiar once you start\
    \ using libraries:\n\n```\nvar Wrapper = function(node) {\n  this.node = node;\n\
    };\n\nWrapper.prototype = {\n  // Implement built-in methods\n  appendChild :\
    \ function(child) {\n    return this.node.appendChild(child);\n  },\n  // Implement\
    \ custom methods\n  prepend : function(child) {\n    if (this.node.firstChild)\
    \ {\n      return this.node.insertBefore(child,\n      this.node.firstChild);\n\
    \    } else {\n      return this.node.appendChild(child);\n    }\n  }\n}\n```\n\
    \n(continues on next page)"
