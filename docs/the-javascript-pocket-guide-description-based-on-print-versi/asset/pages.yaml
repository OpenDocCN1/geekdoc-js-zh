- img_proc: true
  md: 'MooTools also wraps DOM elements using a custom Element data type that provides
    additional methods and properties to facilitate finding, creating, and manipulating
    elements. MooTools contains many of the same element methods as jQuery, but it
    tends to use longer and arguably clearer method names.


    The http://mootorial.com/ Web site links to several great tutorials to get a feel
    for MooTools.


    # Namespacing


    The biggest difference between MooTools and the libraries discussed earlier is
    in how it organizes its code. Unlike jQuery and YUI 3, MooTools spreads its properties
    and functions across several global variables, including $, $$, A, Class, Element,
    F, and Request. It also adds methods to the prototypes of built-in objects such
    as Function and Array. Many programmers find this to be a clearer or more useful
    approach to library organization, but you do have to be more careful about conflicts
    between global variables.


    # MooTools More


    http://mootools.net/more


    The MooTools More library contains a number of plug-ins to the Core library for
    form and dragging functionality, additional effects, interface widgets, and internationalization
    and translation utilities. Like with the Core library, you can customize your
    library files to include only the plug-ins you need.'
