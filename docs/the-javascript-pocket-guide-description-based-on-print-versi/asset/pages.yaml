  md: "# Closures\n\nFunctions in JavaScript have *lexical scope*, which means that\
    \ they maintain access to the scope they are declared in. This is also a confusing\
    \ topic, so here's an example:\n\n```\nfunction scopeFunc() {\n  var scopedVar\
    \ = 42;\n\n  function innerFunc() {\n    console.log(scopedVar);\n  }\n\n  return\
    \ innerFunc;\n}\n\nvar closure = scopeFunc();\nclosure();\n42\n```\n\nIt breaks\
    \ down like this:\n\n+   1. You declare the variable scopedVar inside scopeFunc().\
    \ This means you cannot access scopedVar outside scopeFunc().\n2. You also declare\
    \ the function innerFunc() inside scopeFunc(). Since it is in the same scope as\
    \ scopedVar, it still has access to that variable.\n3. You return a reference\
    \ to innerFunc() when scopeFunc() executes.\n4. You save the returned reference\
    \ to innerFunc() on the variable closure. When you execute the function, it still\
    \ has access to scopedVar and prints its value to the console."
