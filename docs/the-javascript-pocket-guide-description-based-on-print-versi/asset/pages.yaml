  md: 'by pressing the Tab key. The focus event does not bubble up the DOM tree.


    You can make any element focusable by setting its tabindex attribute to 0. Then
    the user can tab to the element and control it with the keyboard.


    # blur


    The blur event occurs when an element loses focus. Like the focus event, it does
