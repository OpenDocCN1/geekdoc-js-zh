    \ the repetitive parts of that line of code as arguments of a self-invoking function,\
    \ I can reference them as single-character variable names (document.documentElement\
    \ becomes d, and \"className\" becomes c).\n\nThis is one of the rare times I\
    \ want to include a <script> tag earlier in the page, such as in the <head> element.\
