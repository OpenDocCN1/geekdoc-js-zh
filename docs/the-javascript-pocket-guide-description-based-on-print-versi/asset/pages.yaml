  md: "```\nnewHandler.call(this);\n}\naddonloadHandler(function() {\n  alert(\"first\
    \ handler\");\n});\naddonloadHandler(function() {\n  alert(\"second handler\"\
    );\n});\n</script>\n</body>\n</html>\n```\n\nThe onloadHandler() function saves\
    \ a reference to the current value of window.onload before assigning it a new\
    \ value. This lets you call both the original event handler and the new event\
    \ handler when the load event occurs.\n\nThe actual event handler ends up being\
