- img_proc: true
  md: "# Bubbling\n\nWhen an event occurs on an element, it triggers on all the parent\
    \ nodes of that element. You can test this for yourself. Make an HTML document\
    \ with this body:\n\n```\n<body>\n  <div>\n    <p>\n      <a href=\"http://www.google.com\"\
    >Click</a>\n    </p>\n  </div>\n</body>\n```\n\nAdd some padding to the elements\
    \ too so you can click a parent element without clicking the child:\n\n```\nbody,\
    \ div, p {\n  padding: 10px;\n}\n```\n\nThen add a script block that adds an event\
    \ listener to each element and the document. (Remember, this code won't work in\
    \ IE):\n\n```\nvar div = document.getElementsByTagName(\"div\")[0];\nvar p = document.getElementsByTagName(\"\
    p\")[0];\nvar a = document.getElementsByTagName(\"a\")[0];\n\ndocument.addEventListener(\"\
    click\", whatNode, false);\ndocument.body.addEventListener(\"click\", whatNode,\
    \ false);\ndiv.addEventListener(\"click\", whatNode, false);\np.addEventListener(\"\
    click\", whatNode, false);\na.addEventListener(\"click\", whatNode, false);\n\
    ```"
  merge: -1
  pgno: 195
- img_proc: true
  md: "```\nfunction whatNode(event) {\n  console.log(this.nodeName);\n  event.preventDefault();\n\
    }\n```\n\nWhen you click the link, the console shows this:\n\nDIV\nBODY\n#document\n\
    \nIf you just click the <div> element, the event handlers for the <a> and <p>\
    \ elements won't execute:\n\nDIV\nBODY\n#document\n\nThe Event object *bubbles*\
    \ from the target element through each element in the DOM tree all the way up\
    \ to the document. If you add an event handler to an element, any child element\
    \ can cause that handler to execute.\n\nThis is important enough to repeat: Events\
    \ firing on the children of an element cause the element's event handlers to execute.\
    \ Because the document object is an ancestor of all elements in the page, its\
    \ event handlers always execute regardless of where the event originated.\n\n\
    # Capturing\n\nThe bubbling phase is actually the last phase of an Event object's\
    \ life cycle. All events originate on the document and travel down the DOM tree\
    \ to the target element. This is called the *capture* phase."
  merge: -1
  pgno: 196
- img_proc: true
  md: "To add an event handler to the capture phase of an event, change the third\
    \ argument in addEventListener() to true. Add these lines to the HTML document\
    \ you created to test bubbling:\n\n```\ndocument.addEventListener(\"click\", whatNode,\
    \ true);\ndocument.body.addEventListener(\"click\", whatNode, true);\ndiv.addEventListener(\"\
    click\", whatNode, true);\np.addEventListener(\"click\", whatNode, true);\na.addEventListener(\"\
    click\", whatNode, true);\n```\n\nAlso, change the whatNode() function to this:\n\
    \n```\nfunction whatNode(event) {\n  console.log(this.nodeName, \"phase: \" +\
    \ event.eventPhase);\n  event.preventDefault();\n}\n```\n\nNow when you click\
    \ the link, the console shows this:\n\n```\n#document phase: 1\nBODY phase: 1\n\
    DIV phase: 1\nP phase: 1\nA phase: 2\nA phase: 2\nP phase: 3\nDIV phase: 3\nBODY\
    \ phase: 3\n#document phase: 3\n```\n\nAs the event travels from the document\
    \ to the target element, it's in the capture phase, represented by the 1. At the\
    \ target element, the event is in the second \"at target\" phase. The last phase\
    \ is the bubbling phase, which you've seen before."
  merge: -1
  pgno: 197
- img_proc: true
  md: "# Stop Propagation\n\nYou can stop an element from continuing to capture or\
    \ bubble by calling stopPropagation() on the Event object. Change the whatNode()\
    \ function to demonstrate this.\n\n```\nfunction whatNode(event) {\n  if (this.nodeName\
    \ === \"DIV\") {\n    event.stopPropagation();\n  }\n  console.log(this.nodeName,\
    \ \"phase: \" + event.eventPhase);\n  event.preventDefault();\n}\n```\n\nClicking\
    \ the link now results in this:\n\n```\n#document phase: 1\nBODY phase: 1\nDIV\
    \ phase: 1\n```\n\nWith this event handler, the event stops propagating down the\
    \ DOM tree once it reaches the <div> element during the capture phase.\n\n# Event\
    \ Delegation\n\nUnderstanding bubbling and capturing is mostly important for knowing\
    \ how child elements affect the event handlers of their parents. It also has a\
    \ practical use with a technique called event delegation.\n\nSay you have a page\
    \ with 100 links and want to do something special when the user clicks any of\
    \ them. You could loop through all the links and attach event handlers to each\
    \ of them.\n\n```\nvar allLinks = document.getElementsByTagName(\"a\");\nvar i\
    \ = allLinks.length;\n```"
  merge: -1
  pgno: 198
- img_proc: true
  md: "```\nwhile (i--) {\n  allLinks[i].addEventListener(\"click\", somethingSpecial,\n\
    \  => false);\n}\n```\n\n```\nfunction somethingSpecial(event) {\n  alert(this.href);\n\
    \  event.preventDefault();\n}\n```\n\nBut what if you later add links to the page,\
    \ maybe with an Ajax call?\nYou'll have to add the event handler to that link\
    \ too, probably by repeating the line of code for addEventListener().\n\nA more\
    \ elegant solution involves adding a single event handler to the document and\
    \ acting it based on the target element of the event.\n\n```\n// Add one event\
    \ handler to the capture phase\ndocument.addEventListener(\"click\", delegatedSomethingSpecial,\n\
    => true);\n```\n\n```\nfunction delegatedSomethingSpecial(event) {\n  if (event.target.nodeName\
    \ === \"A\") {\n    alert(event.target.href);\n    event.preventDefault();\n}\n\
    ```\n\nThis new event handler doesn't do anything unless the element that originated\
    \ the event is a link. You can add dozens more links to the page, and this handler\
    \ will work for all of them. It's also slightly faster because you're using the\
    \ capture phase of the event. That way, the event doesn't travel through all phases\
    \ of the event life cycle before executing."
  merge: -1
