  md: '# Coordinates on the Screen


    Most people are used to coordinate systems that start in the bottom right. The
    X value moves the left as it gets bigger, and the Y value moves up as it gets
    bigger. On computer screens, the Y value gets flipped (**Figure 9.1**).


    **Figure 9.1**

    The screen coordinate system.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_146_0.png)


    # Global Functions


    Advertisers and spammers have abused some of these methods, especially window.open(),
    which they use to create pop-up and pop-under windows. Use discretion when manipulating
    browser windows to avoid obnoxious and intrusive behavior.


    # Dialog Boxes


    Dialog boxes allow for rudimentary user interaction. I don''t like using them
    unless I really need to demand the user''s attention. They are *modal*, which
    means the user must dismiss the dialog box before being allowed to interact with
    the rest of the browser again.'
  merge: -1
