  md: '# The Date Data Type


    I haven''t discussed the Date data type yet, but it''s one of the built-in data
    types like String and Function. Here are a few example uses of the Date data type:


    ```

    // Create a date object for the current time

    var date = new Date();

    date;

    Sun Feb 15 2010 19:01:26 GMT-0800 (PST) {}


    // Create a date object specifying a certain time

    // year, month, day, hours, minutes, seconds, ms

    // January is 0, February is 1

    var mayanApocalypse = new Date(2012, 0, 1, 0, 0, 0, 0);

    mayanApocalypse;

    Sun Jan 01 2012 00:00:00 GMT-0800 (PST) {}


    // Get the millisecond representation of a date.

    // This is useful for comparing dates

    mayanApocalypse.getTime();

    1325404800000


    // Getting and setting various parts of the date

    date.setDate(date.getDate() + 1); // tomorrow

    1266376009093

    date.getMonth();

    1

    ```'
