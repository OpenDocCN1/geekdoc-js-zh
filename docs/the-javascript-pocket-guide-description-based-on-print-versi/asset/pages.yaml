    \ calling it. Using call() allows you to execute the event handlers in the proper\
    \ context so that this refers to window.\n\n# Event Methods\n\nThe DOM provides\
    \ a more modern and flexible API for handling events. The core methods are commonly\
    \ referred to as the DOM Level 2 Event API. (Using event attributes, as described\
    \ earlier, is sometimes referred to as the DOM Level 0 API.) None of these methods\
    \ work in Internet Explorer."
