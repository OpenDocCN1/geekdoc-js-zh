  md: 'You can find the prototype object for a type by accessing the prototype property
    on its constructor function, like this:


    ```

    Number.prototype;

    String.prototype;

    Array.prototype;

    Object.prototype;

    ```


    When you access a property of an object, JavaScript follows these steps to find
    the value of that property:


    +   1. First, it looks for the property on the object. When you add the property
    directly to the object, JavaScript finds the value here.

    var myArray = [1,2,3];

    myArray[0];

    1


    +   2. If the property doesn''t exist on the object, JavaScript looks at the prototype
    of the object''s constructor.

    myArray.push;

    push()

    Array.prototype.push;

    push()

    myArray.push === Array.prototype.push;

    true


    +   3. You can tell that push() exists on Array.prototype and not on myArray with
    the hasOwnProperty() method.

    myArray.hasOwnProperty("push");

    false


    +   4. Finally, if the property can''t be found on the object or the prototype
    of the object''s constructor, JavaScript determines that it doesn''t exist. If
    you try to call it as a method, you''ll get an error.'
