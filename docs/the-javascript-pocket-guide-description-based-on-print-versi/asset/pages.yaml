- img_proc: true
  md: 'prototypes and how that can possibly conflict with other code. Some libraries
    are built on augmenting Array.prototype and other built-in objects, while others
    keep all their functions and properties in a single namespace to avoid conflicts.


    File size is an important consideration because the user will have to download
    the library along with your own code. A large library may have a lot of code that
    you don''t even use but still makes your pages load slower. Fortunately, large
    libraries are getting smarter with lazy loading techniques, and companies such
    as Google and Yahoo! provide content distribution networks for many popular libraries.


    In addition to the features provided by the library itself, you should consider
    what other code is available for your library. Maybe the library developers don''t
    see a reason to include an image slideshow component in the library, but many
    other independent developers have probably created and released one that you can
    leverage. Take a look at the source code of third-party components for clearly
    written and well-commented code before deciding to use it on your sites.


    Lastly and most importantly, choosing a JavaScript library is a matter of personal
    style. Some libraries will just make more sense to you in how they name functions
    and organize the code. In the end, you can achieve the same goals no matter what
    library you use, so pick one that feels right to you.


    ![](img/4a8fa16ebbe3c330347de80256b877b4_214_0.png)


    Learning a library is like learning an entirely new language on top of JavaScript.
    This book obviously can''t cover all the specifics of any one library. Instead,
    when a tutorial uses a library, it will include a short glossary at the end of
    the chapter that briefly explains the functions and concepts used.


    In addition, you should use the online documentation available at each library''s
    website, as well as the myriad of "cheat sheets" available online to learn more.'
