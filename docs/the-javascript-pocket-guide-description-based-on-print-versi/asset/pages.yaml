  md: "You still need to update index.php to handle an Ajax response before this will\
    \ work. Replace the if (false) statement in index.php with the following code:\n\
    \n```\nif ($SERVER[\"HTTP X-REQUESTED WITH\"] == \"XMLHttpRequest\") {\n    sleep(1);\n\
    \    header(\"Content-type: application/json\");\n    $response = new StdClass();\n\
    \    $response->people = $people;\n    echo json_encode($response);\n} else {\n\
    \    include(\"template.php\");\n}\n```\n\njQuery sets a header called X_REQUESTED_WITH\
    \ to \"XMLHttpRequest\". That's how you can differentiate between normal page\
    \ requests and Ajax requests. (This does not happen automatically with Ajax or\
    \ other JavaScript libraries.)\n\nThe sleep() function adds an artificial delay;\
    \ without it, you probably wouldn't be able to see the \"Loading...\" message.\n\
    \nThe header() function adds a response header that indicates the data format\
    \ of the response. jQuery handles application/json responses as JSON. (This also\
    \ does not happen automatically with Ajax or other JavaScript libraries.)\n\n\
    Lastly, the $response object contains two pieces of information: the current page\
    \ number and the $people array. The echo keyword outputs the JSON response, which\
    \ looks similar to the following:\n\n```\n{\n    \"page\" : 1,\n}\n```"
