  md: "# Script Tags\n\nHTML provides a means of including executable code in the\
    \ form of the <script> element. You can include code in a Web page in two ways.\n\
    \n# Inline Scripts\n\nInline scripts include JavaScript code directly in the markup,\
    \ like this:\n\n```\n<script type=\"text/javascript\">\n  var element = document.getElementById(\"\
    domId\");\n</script>\n```\n\nInline scripts allow you to include your code as\
    \ text right in the Web page. This is great for quickly testing a solution or\
    \ adding code that is specific to this particular page.\n\n# Remote Scripts\n\n\
    Remote scripts instruct the browser to download a separate script file and execute\
    \ it in the page. The src attribute points to the script file like any other URL.\n\
    \n```\n<script src=\"my-script.js\" type=\"text/javascript\"></script>\n```\n\n\
    In most cases, this is the preferred solution for a few reasons:\n\n+   - Storing\
    \ JavaScript directly in HTML with an inline script makes your HTML files larger\
    \ and harder to maintain.\n- You can easily include the same script in multiple\
    \ pages just by including the same remote <script> tag.\n- Browsers cache JavaScript\
    \ files so they don’t have to download a script file twice when visiting another\
    \ page that uses it."
  merge: -1
  pgno: 135
- img_proc: true
  md: "# Where to Include the <script> Tag\n\nYou can use the <script> tag nearly\
    \ anywhere in an HTML document. I recommend including inline and remote scripts\
    \ at the very end, right before the closing </body>` tag. This has two advantages:\n\
    \n+   - When some browsers encounter a <script> tag, they halt any other processes\
    \ until they download and parse the script. By including scripts at the end, you\
    \ allow the browser to download and render all page elements, style sheets, and\
    \ images without any unnecessary delays.\n\n+   - Since the browser encounters\
    \ and renders the Web page before executing any script, you know that all page\
    \ elements are already available for you to retrieve and manipulate.\n\nPutting\
    \ <script> tags at the end has one distinct disadvantage, however. Because the\
    \ Web page downloads and renders first, there may be a noticeable delay before\
    \ any scripts execute. This should not be the case with the short examples in\
    \ this book, so I will use this general template for HTML documents:\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title></title>\n  <link rel=\"stylesheet\"\
    \ href=\"styles.css\" type=\"text/css\" />\n</head>\n<body>\n  <!-- page elements\
    \ go here -->\n  <script src=\"my-script.js\" type=\"text/javascript\"></script>\n\
    </body>\n</html>\n```"
  merge: -1
