    \ mostly concerned with setting functions to\nhandle various stages of the Ajax\
    \ request.\n\n# Waiting for the Request to Load\n\nThe loadingFunc() function\
    \ adds a message to the <caption> element\nthat tells the user that something\
    \ is happening. The message displays"
