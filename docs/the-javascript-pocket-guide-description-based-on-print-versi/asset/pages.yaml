- img_proc: true
  md: "# Chapter 13: Image Slideshow\n\n```\n$(\"<img />\").attr({\n  src : link.attr(\"\
    href\"),\n  width : size[0],\n  height : size[1],\n  alt : link.text()\n}).hide().appendTo(slides);\n\
    );\n```\n\nThis code snippet might look like a little daunting because jQuery\
    \ allows you to do so much in very little code.\n\nThe first thing it does is\
    \ find all the links in the unordered list using find() and loop over them using\
    \ the each() function. jQuery encourages a functional coding style, meaning that\
    \ you use looping functions such as each() more often than language features such\
    \ as for or while.\n\nInside the loop function, you can access each link with\
    \ this keyword and turn it into a jQuery object by passing it to($). Save it on\
    \ the link variable because you'll access it three times in the loop function.\n\
    \nEach link has a string like \"350x263\" stored on the data-size attribute. It's\
    \ easy to separate the width from the height by splitting the \"x.\",\n\nWhen\
    \ you pass an HTML string to the jQuery function, such as $(\"<img />\"), it creates\
    \ new HTML elements. The attr() method lets you pass attributes to the new element,\
    \ which is how you can set the src, width, height, and alt attributes for each\
    \ new image.\n\njQuery emphasizes chainability, allowing you to immediately call\
    \ hide() and appendTo() on the newly created <img> without having to save it to\
    \ a variable first. The hide() method sets its display style property to \"none,\"\
    \ and the appendTo() method inserts it into the slides <div>."
