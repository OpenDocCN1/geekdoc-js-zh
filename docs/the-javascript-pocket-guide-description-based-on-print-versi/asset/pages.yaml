  md: "# Debugging Your Code\n\nThis is the first chapter in the book that will walk\
    \ you step-by-step through a nontrivial example. If you get stuck, Firebug will\
    \ become your best friend. Here are some tips to help you debug your code:\n\n\
    +   - Check the console to see whether there are any errors. Firebug does a pretty\
    \ good job of telling you on which line number the error occurred.\n\n+   - If\
    \ the error actually occurs inside a JavaScript library, Firebug's output might\
    \ be a bit cryptic. Expand the error message by clicking the triangle to see what\
    \ line number in your file is involved (Figure 13.1).\n\nFigure 13.1\nThe error\
