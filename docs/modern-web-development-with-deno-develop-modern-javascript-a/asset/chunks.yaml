    \n    *   nest.land\n\n    *   Skypack CDN\n\n    *   esm.sh\n\n    *   jspm\n\
    \n    *   Web\n\n*   Dependency management\n\n# [Objectives](#toc.xhtml_s68a)\n\
    \nWe will be exploring the various sections of the Deno ecosystem in this chapter.\
    \ The ecosystem includes **command line interface** (**CLI**) commands such as\
    \ run, install, and so on. The runtime APIs (Web + Deno global) and standard modules\
    \ (inspired by Go’s standard library) such as uuid, http, fs, and so on. Apart\
    \ from the standard modules, there are thousands of third-party Deno modules available\
