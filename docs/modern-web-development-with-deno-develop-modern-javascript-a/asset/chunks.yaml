    The preceding format starts with **`deno`** executable command followed by **`run`**\
    \ subcommand, which executes the provided script followed by optional security\
    \ flags such as **`--allow-net`**, **`--allow-read`**, and so on. The path for\
    \ the script to be executed is then provided, followed by optional arguments.\
    \ All the entries (separated by space) provided after the script are considered\
    \ as arguments and are made available via **`Deno.args`** variable.\n\nWe can\
    \ use the preceding format for running Deno scripts with arguments. Create a file\
    \ named **`args.ts`** in the projects folder (like **`home/my/work/deno/passing-arguments`**)\
    \ with the following code:\n\n1.  `// args.ts`\n\n2.  `console.log(Deno.args);`\n\
    \nThe preceding code simply logs Deno runtime variable **`Deno.args`**, which\
    \ is an array of provided arguments. An empty array [] is logged if no arguments\
    \ are provided, as shown in *[figure 4.1](#c04.xhtml_fig4_1)*:\n\n![](images/Figure-4.1.jpg)\n\
    \n**Figure 4.1:** Passing arguments\n\nWe will now pass two arguments **`deno`**\
    \ and **`land`**, to the **`args.ts`** file. As shown in *[figure 4.1](#c04.xhtml_fig4_1)*,\
    \ the console should log **`[“deno”, “land”]`** after running the following code:\n\
    \n1.  `deno run args.ts deno land`\n\n2.  `# Output: [“deno”, “land”]`\n\nThe\
    \ preceding code runs the **`args.ts`** file with two additional parameters **`deno`**\
    \ and **`land`**. As Deno considers all the entries passed after the file name\
    \ separated with space as arguments, the entries are made available to the **`args.ts`**\
    \ file in **`Deno.args`** variable.\n\n**Note: Flags should not be passed after\
    \ the script name as they will be considered as arguments.**\n\nThe **`--allow-net`**\
