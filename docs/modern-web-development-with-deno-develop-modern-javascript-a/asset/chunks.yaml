    \ backend) | V8 (Rust bindings and backend) |\n| Event loop | libuv | tokio |\n\
    | TypeScript support | Need to be installed | Out of the box |\n| Package manager\
    \ | Npm (centralized) | no package manager (decentralized) |\n| Import system\
    \ | CommonJS (`require()`) | ES modules (`import`) |\n| Security | Full access\
    \ by default | No access by default |\n| package.json | Used | Not used |\n\n\
    # Deno features\n\nDeno has excellent support for modern features and includes\
    \ many features not available in Node out of the box (TypeScript support). Let\
    \ us have a look at some of its main features.\n\n- External dependencies are\
    \ loaded using URLs\n- Code execution in Sandbox\n    - Runtime has no access\
    \ to network file systems and environments\n    - Access needs to be granted explicitly\n\
    - Typescript support out of the box\n- Top-level await\n- Standard modules library\n\
    - Built-in tools provided like:\n    - **Bundler**: Builds scripts and dependencies\
    \ into a single file\n    - **Dependency inspector**: Inspects ES modules and\
    \ lists all their dependencies\n    - **Documents generator**: Parses JSDoc\n\
    \    - **Formatter**: For auto-formatting JS and TS Files\n    - **Test-runner**:\
    \ For testing using the assertions module from the standard library\n    - **Linter**:\
    \ To catch code issues\n\n# Deno foundation stack\n\nDeno has been created using\
    \ some solid technologies, which increase its chances of becoming highly successful.\
    \ Once we have gone through the stack used for creating Deno, we can be assured\
    \ about Deno’s future (a very bright one). Let us check the tech stack used by\
    \ Deno.\n\n- Uses Google’s V8 Engine\n- Written in Rust\n- Tokio (async runtime\
    \ written in Rust) used for event thread management\n\n# The V8 Engine by Google\n\
    \nAn open-source JavaScript engine built using C++ by Google. It converts JavaScript\
    \ code (passed by Deno) into bytecode/machine code. Deno supports Typescript out\
    \ of the box, so we can also provide Typescript code which gets compiled to JavaScript\
    \ by Deno. It executes the JavaScript code and passes Deno API-related code (Rust\
    \ code) to the Rust backend via `rusty_v8` bindings written in Rust for the V8\
    \ engine by the Deno team.\n\nThe combination of an interpreter (`Ignition`) and\
    \ compiler (`TurboFan`) makes V8 produce optimized machine code which runs really\
    \ fast.\n\n# Rust\n\nRust has been the “most loved” language in every StackOverflow\
    \ survey since 2016 (five years in a row). It is a systems programming language\
    \ that enables control over low-level details. It provides memory-safety, thread-safety,\
    \ and type systems. For these and many other features, Rust remains the most loved\
    \ and wanted language for the last five years in StackOverflow surveys.\n\n- Memory\
    \ safe by default\n- Ownership and borrowing support\n- Performance is very close\
    \ to other low-level languages (C, C++)\n- Either one mutable or many immutable\
    \ references\n- No NULL pointers, only options\n\nUsed by:\n- Amazon—firecracker\n\
    - Google—Fuchsia\n- Facebook—Mononoke\n- Microsoft—IoT Edge\n\nThe Deno backend\
    \ contains a file system, network and environment access and is written in Rust.\
    \ The asynchronous i/o bindings are handled by tokio library.\n\n# Tokio I/O library\n\
    \nIt is used to write asynchronous applications with Rust. It is an event-driven,\
    \ non-blocking i/o platform. It uses thread pools and workers to perform the operations\
    \ in the background.\n\nWhenever a code related to i/o, network, and so on is\
    \ passed to the V8 engine, it forwards it to Rust backend using `rusty_v8` bindings.\
    \ The execution of the received code is done by tokio using workers.\n\n- Asynchronous\
    \ I/O ops using non-blocking event\n- Uses Mio as an event queue\n- The event\
    \ loop mechanism is used to monitor the call stack and callback queue\n- Thread\
    \ pool and workers are used to perform the tasks in the background\n\n# What is\
    \ a JavaScript engine\n\nJavaScript engine is used to convert JavaScript/Typescript\
    \ code into bytecode (interpreter) or optimized machine code (compiler) so the\
    \ computer can execute it.\n\nThere are many JavaScript engines released since\
    \ release.\n\n- V8 Engine by Google\n- SpiderMonkey by Mozilla\n- Chakra by Microsoft\n\
    \nIn the JavaScript engine, the code is parsed into tokens, which are used to\
    \ generate the Abstract Syntax Tree. The interpreter uses this tree to generate\
    \ Byte Code. A profiler monitors the byte code and passes it to the compiler if\
    \ there is a scope for optimization. Compiler outputs optimized machine code which\
    \ performs faster than the byte code.\n\n**Interpreter:**\nAn interpreter translates\
    \ the code one line at a time. It provides a ByteCode as output. The interpreter\
    \ is very fast to get started coding but does not provide any optimizations.\n\
    \n**Compiler:**\nThe compiler translates the entire code at once. The compiler\
    \ has a scope to analyze the entire program and optimize it. It outputs optimized\
    \ machine code. The compiler takes longer to analyze and optimize the code as\
    \ it goes through the entire program.\n\nJavaScript engine combines the functionality\
    \ of interpreter and compiler. This way, we get an optimized code that runs faster.\
    \ Such a compiler is called the “JIT Compiler”.\n\n# What is a JavaScript runtime\n\
    \nJavaScript runtime is an environment that combines the JavaScript Engine (V8\
    \ in Deno), The API backend written in some low-level language (Rust in Deno),\
    \ a callback queue and event loop that continuously monitors the call stack.\n\
    \n**Memory heap:**\nJavaScript code is passed to the V8 engine that stores the\
    \ variables and functions from the code.\n\n**Call Stack:**\nIt stores the functions\
    \ invoked within the code. It operates on Last In Out (LIFO) principle. It always\
    \ points to the currently running function. Once the function returns or is passed\
    \ to Deno API, it pops the function out and executes the earlier one on the stack.\n\
    \n**Deno API:**\nWhenever Deno detects code related to i/o, network, environment,\
    \ and so on, it passes the code to the API backend, which is written in Rust.\
    \ It uses `rusty_v8` bindings to pass the code to the backend.\n\n**Tokio:**\n\
    It is an event-driven, asynchronous i/o platform. Deno API passes the code to\
    \ tokio. This uses thread pool and workers to execute the operations in the background\
    \ and passes them on the callback queue.\n\n**Callback Queue:**\nIt operates on\
    \ First In Out (FIFO) principle. It stores all the completed functions passed\
    \ by Tokio. It waits till the call stack is empty.\n\n**Event loop:**\nIt monitors\
    \ the call stack and the callback queue continuously. If the call stack is empty\
    \ and the callback queue has a function in the queue, it passes the function on\
    \ the call stack where it gets executed.\n\n# Conclusion\n\nOur journey in the\
    \ Deno land has begun with this chapter. We learnt the history of Deno and Node,\
    \ compared Deno with Node and listed Deno features. We also covered the stack\
    \ Deno is built from, i.e., *V8* JavaScript engine, *Tokio* event-loop, and Deno\
    \ API backend written in Rust. Finally, we covered the JavaScript engine and the\
    \ JavaScript runtime architectures, which are not mandatory but give us a solid\
    \ foundation to understand what is Deno and how it performs the operations in\
    \ the background.\n"
