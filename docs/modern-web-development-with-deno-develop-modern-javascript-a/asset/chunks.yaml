    \ 中的 `Login16` 和 `Logout16` 图标用于登录和注销按钮。\n\n# 结论\n\n在本章中，我们使用各种 deno 模块（如 `snel`、`snel-carbon`、`axiod`\
    \ 等）实现了一个 svelte 应用 UI。Snel 模块适用于使用 deno 运行时创建 Svelte 应用程序。`Snel-carbon` 提供了基于\
    \ carbon 设计系统的组件和图标。我们使用这些组件和图标创建了我们的 UI。`Axiod` 用于向服务器发送网络请求。`Svelte Routing`\
    \ 模块用于为应用定义各种路由（公共和私有）。我们默认使用 snel 提供的 `trex` 来运行脚本。\n\n这些知识将有助于为 Svelte UI 应用设置新的\
    \ deno 项目。我们可以通过与上一章中的 API 服务器一并运行来测试实现结果。至此，我们的*电话簿*应用就完成了，可以在本地使用，也可以通过各种平台部署到云端。\n\
