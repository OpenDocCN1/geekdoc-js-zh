  trans: "\n\n```typescript\ntype myInt = number; // type 为原始类型 number 提供了新名称 myInt\n\
    ```\n\n```typescript\nlet myId: myInt = 11; // 这里 myInt 代表 number 类型\n```\n\n\
    ```typescript\nlet id: number = 11;\n```\n\n### 联合类型 (Unions)\n```typescript\n\
    type unionId = number | string; // 联合类型\n```\n\n```typescript\nlet myUnionId:\
    \ unionId = 25; // number\nmyUnionId = “1a2b”; // string\n```\n\n### 与接口（interfaces）功能相似\n\
    ```typescript\ntype PersonType = {\n  firstName: string;\n  lastName: string;\n\
    };\n\nconst person: PersonType = {\n  firstName: “first”,\n  lastName: “last”,\n\
    \  // place: “unknown”, // 错误：类型 IPerson 中不存在 place\n};\n```\n\n# 接口 (Interfaces)\
    \ 与 类型别名 (type aliases)\n\nTypeScript 允许接口合并（Interface merging），而类型别名的合并会导致编译错误。\n\
    \n```typescript\ninterface IPerson {\n  name: string;\n}\n\ninterface Iperson\
    \ {\n  // 将 place 合并到现有的 Iperson 中\n  place: string;\n}\n\nconst person: Iperson\
    \ = { name: “Name1”, place: “space” };\n```\n\n```typescript\ntype PersonType\
    \ = {\n  name: string;\n};\n\n// type PersonType = {\n//   // 错误：重复的标识符 ‘PersonType’\n\
    //   place: string;\n// };\n// const person1: PersonType = { name: “name2”, place:\
    \ “time” }; // 不 place\n\n# 类型推断 (Type inference)\n\nTypeScript 有两种处理类型推断的方法。当我们显式地提供类型时，它被称为“显式类型\
    \ (Explicit typing)”；当 TypeScript 使用赋值的值*隐式地*推断类型时，它被称为“隐式类型 (Implicit typing)”。\n\
    \n### 显式类型\n每当我们显式地为变量提供类型时，就称为显式类型。\n\n```typescript\nlet myId: number = 25;\
    \  // 显式类型为 number\n```\n\n#### 隐式类型\n即使没有通过初始赋值值、函数参数默认值或函数返回类型显式指定类型，TypeScript\
    \ 也会推断变量的数据类型。这被称为隐式类型或类型推断。\n\n如果没有给 `isAllowed` 变量显式标注 `false`，TypeScript 根据\
    \ `false` 值判断出数据类型为 `boolean`。\n\n```typescript\nlet isAllowed = false; // 隐式类型\n\
    // TypeScript 根据值 false 推断类型为 boolean\n// let isAllowed: boolean = false;\n//\
    \ 错误\n// isAllowed = 25; // TS2322 [ERROR]: 类型与类型 ‘boolean’。\n```\n\n如果在声明时未提供值，则推断为\
    \ `any` 类型。此行为可以通过在 `tsconfig.json` 中设置 `“noImplicitAny”: true;`get 来禁用。\n\n```typescript\n\
    let anyVar; // 推断为 ‘any’ 类型\nanyVar = 2.3;\nanyVar = false;\nanyVar = “I’m any”;\n\
    ```\n\n# 类型断言 (Type assertions)\n\n类型断言用于覆盖编译器推断的类型。类型断言可以通过两种方式定义：\n\n### `as`\
    \ 语法\n```typescript\nconst word: unknown = “abcdefg”;\n// const charCount: number\
    \ = word.length; // 错误: TS2571 [ERROR]: 对象类型为 ‘unknown’。\nconst charCount: number\
    \ = (word as string).length;\n```\n\n### 尖括号 <> 语法\n```typescript\nconst word:\
    \ unknown = “abcdefg”;\n// const charCount: number = word.length; // 错误: TS2571\
    \ [ERROR]: 对象类型为 ‘unknown’。\nconst charCount: number = (<string>word).length;\n\
    ```\n\n# 联合类型 (Unions)\n在联合类型中，变量可以持有两种或多种类型的值。联合类型用竖线或管道符号 `|`符号表示。\n\n```typescript\n\
    let myNum: number = 24;\n// myNum = “id2234”; // 错误: TS2322 [ERROR]: 类型 ‘string’\
    \ 不能赋值给类型 ‘number’。\nlet myId: string | number = 25; // myId 可以接受 string 或 number。\n\
    myId = “id234”; // 接受 string\n```\n```typescript\ntype myIdType = string | number;\n\
    let myId1: myIdType = 53;\nmyId1 = “id234”;\n```\n\n# 交叉类型 (Intersections)\n交叉类型通过组合两个不同类型的所有属性和方法来创建。使用符号\
    \ `&` 来创建交叉类型。\n\n```typescript\ninterface IPerson {\n  name: string;\n  age:\
    \ number;\n}\n\ninterface IEmployee {\n  employeeId: number;\n}\n\n// PersonType\
    \ 将拥有 IPerson & IEmployee 的所有属性\ntype PersonType = IPerson & IEmployee;\nconst\
    \ printMe = (person: PersonType): PersonType => {\n  return person;\n};\n\nconst\
    \ user: PersonType = {\n  name: “name1”,\n  age: 25,\n  employeeId: 555,\n};\n\
    const result = printMe(user);\nconsole.log(result);\n```\n\n# 类 (Classes)\nTypeScript\
    \ 允许通过类来实现一种面向对象的编程方法。在 `OOP` 术语中，类是用于创建实例或对象的蓝图。通常情况下，一个类可以包含以下内容：\n\n* `constructor()`：每当要创建类的实例时都会被调用。\n\
    * `fields`：变量或属性。\n* `method`：函数\n\n# 修饰符 (Modifiers)\n修饰符是类字段的访问控制器。有三种修饰符：`public`、`private`\
    \ 和 `protected`，用于字段和方法。\n\n### public\n这是默认修饰符，允许在类外部访问字段/方法。\n\n```typescript\n\
    class Person {\n  name: string; // public\n  age: number; // public\n  // 创建实例\n\
    \  constructor(name: string, age: number) {\n    this.name = name;\n    this.age\
    \ = age;\n  }\n  printMe() {\n    console.log(this.name, this.age);\n  }\n}\n\
    const person = new Person(“me”, 99); // 调用构造函数，name=”me” 和 age=99\nperson.printMe();\n\
    console.log(person.age); // 属性可以在类外部访问\n```\n\n### private\n不允许在类外部访问字段/方法。子类无法访问私有属性。它通过\
    \ private 关键字或 ECMAScript 的 `hash)` 修饰符定义。\n\n```typescript\nclass Person {\n\
    \  name: string;\n  private _age: number;\n  #isActive: boolean; // 私有标识符\n  constructor(name:\
    \ string, age: number, isActive: boolean = true) {\n    this.name = name;\n  \
    \  this.age = age;\n    this.#isActive = isActive;\n  }\n  printMe() {\n    console.log(this.name,\
    \ this.age, this.#isActive);\n  }\n}\nconst person = new Person(“me”, 99);\nperson.printMe();\n\
    console.log(person.name);\n/**\n * 错误: TS2341 [ERROR]: 属性 ‘age’ 是私有的，只能在类 ‘Person’\
    \ 内部访问。\n */\n// console.log(person.age);\n/**\n * TS18013 [ERROR]: 属性 ‘#isActive’\
    \ 不可在类 ‘Person’ 外部访问因为它是一个私有标识符。\n */\n// console.log(person.#isActive);\n```\n\
    \n### protected\n不允许在类外部访问字段/方法，但子类可以访问其字段。\n\n```typescript\nclass Person {\n\
    \  name: string;\n  protected age: number; // 受保护的字段\n  constructor(name: string\
    \ = “unnamed”, age: number = 0) {\n    this.name = name;\n    this.age = age;\n\
    \  }\n  printMe() {\n    console.log(this.name, this.age);\n  }\n}\n\nclass User\
    \ extends Person {\n  userId: number;\n  constructor(userId: number, name: string,\
    \ age: number) {\n    super(name, age);\n    this.userId = userId;\n  }\n  printMe()\
    \ {\n    console.log(this.name);\n    console.log(this.age); // Person 类的保护字段\
    \ age 可供子类访问\n  }\n}\nconst user = new User(1, “me”, 99);\n```\n\n"
