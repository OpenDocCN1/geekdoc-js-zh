  trans: "\n\n| 构建语言 | C++ | Rust |\n| :--- | :--- | :--- |\n| JavaScript 引擎 | V8\
    \ (C++ 绑定和后端) | V8 (Rust 绑定和后端) |\n| 事件循环 | libuv | tokio |\n| TypeScript 支持 |\
    \ 需要安装 | 开箱即用 |\n| 包管理器 | Npm (中心化) | 无包管理器 (去中心化) |\n| 导入系统 | CommonJS (`require()`)\
    \ | ES  (`import`) |\n| 安全性 | 默认完全访问 | 默认无访问 |\n| package.json | 使用 | 不使用 |\n\n\
    # Deno 特性\n\nDeno 对现代功能提供了极支持，并包含了许多 Node 原生不支持的功能（如 TypeScript 支持）。让我们来看看它的一些主要特性。\n\
    \n- 外部依赖通过 URL 加载\n- 在沙箱中执行代码\n    - 运行时无法访问网络文件系统和环境\n    - 访问需要显式授权\n- 开箱即用的\
    \ TypeScript 支持\n- 顶层等待 (Top-level await)\n- 标准模块库\n- 提供的内置工具，例如：\n    - **Bundler**:\
    \ 将脚本和依赖构建成单个文件\n    - **Dependency inspector**: 检查 ES 模块并列出所有依赖项\n    - **Documents\
    \ generator**: 解析 JSDoc\n    - **Formatter**: 用于自动格式化 JS 和 TS 文件\n    - **Test-runner**:\
    \ 使用标准库中的断言模块进行测试\n    - **Linter**: 用于检测代码问题\n\n# Deno 基础栈\n\nDeno 的创建使用了一些坚实的技术，这增加了它成功的概率。一旦我们熟悉了构建\
    \ Deno 所使用的技术栈，就可以对 Deno 的未来充满信心（一个非常光未来）。让我们来看看 Deno 使用的技术栈。\n\n- 使用 Google 的\
    \ V8 引擎\n- 使用 Rust 编写\n- 使用 Tokio（用 Rust 编写的异步运行时）用于事件线程管理\n\n# Google 开发的 V8\
    \ 引擎\n\n一个由 Google 使用 C++ 构建的开源 JavaScript 引擎。它将 JavaScript 代码（由 Deno 传递）转换为字节码/机器码。Deno\
    \ 开箱即用支持 TypeScript，因此我们也可以提供 TypeScript 代码，Deno 将其编译为 JavaScript。它执行 JavaScript\
    \ 代码，并通过 Deno 团队为 V8 引擎编写的 Rust 绑定 `rusty_v8` 将 Deno API 相关代码（Rust 代码）传递给 Rust\
    \ 后端。\n\n解释器 (`Ignition`）和编译器 (`TurboFan`）的结合使得 V8 生成运行极快的优化机器码。\n\n# Rust\n\n\
    自 2016 年以来，Rust 在每次 StackOverflow 调查中一直是“最受喜爱”语言（连续五年）。它是一种系统编程语言，能够对底层细节进行控制。它提供了内存安全、线程安全和类型系统。由于这些以及许多其他特性，Rust\
    \ 在过去五年的 StackOverflow 调查中是最受喜爱和最期待的语言。\n\n- 默认内存安全\n- 支持所有权和借用\n- 性能与其他底层语言（C,\
    \ C++）非常接近\n- 只能有一个可变引用或多个不可变引用\n- 没有 NULL 指针，只有 options（选项）\n\n使用者：\n- Amazon—firecracker\n\
    - Google—Fuchsia\n- Facebook—Mononoke\n- Microsoft—IoT Edge\n\nDeno 后端包含文件系统、网络和环境访问，并用\
    \ Rust 编写。异步 i/o 绑定由 tokio 库处理。\n\n# Tokio I/O 库\n\n它用于用 Rust 编写异步应用程序。它是一个事件驱动、非阻塞\
    \ i/o 平台。它使用线程池和工作线程在后台执行操作。\n\n当任何与 i/o、网络相关的代码传递给 V8 引擎时，它会通过 `rusty_v8` 绑定将其转发到\
    \ Rust 后端。接收到的代码的执行由 tokio 使用工作线程完成。\n\n- 使用非阻塞事件进行异步 I/O 操作\n- 使用 Mio 作为事件队列\n\
    - 事件循环机制用于监控调用栈和回调队列\n- 使用线程池和工作线程在后台执行任务\n\n# 什么是 JavaScript 引擎\n\nJavaScript\
    \ 引擎用于将 JavaScript/TypeScript 代码转换为字节码（解释器）或优化的机器码（编译器），以便计算机可以执行它。\n\n自发布以来，已发布许多\
    \ JavaScript 引擎。\n\n- Google 的 V8 引擎\n- Mozilla 的 SpiderMonkey\n- Microsoft 的\
    \ Chakra\n\n在 JavaScript 引擎中，代码被解析为标记（tokens），用于用于生成抽象语法树（AST）。解释器使用该树生成字节码。剖析器（profiler）监控字节码，如果有优化空间，则将其传递给编译器。编译器输出优化的机器码，运行速度比字节码更快。\n\
    \n**解释器：**\n解释器逐行翻译代码。它提供字节码作为输出。解释器开始编码的速度非常快，但不提供任何优化。\n\n**编译器：**\n编译器一次性翻译整个代码。编译器具有分析整个程序并对其优化空间。它输出优化的机器码。由于需要遍历整个程序，编译器分析和优化代码需要更长时间。\n\
    \nJavaScript 引擎结合了解释器和编译器的功能。通过这样，我们得到了运行更快的优化代码。这种编译器被称为“JIT 编译器”。\n\n# 什么是 JavaScript\
    \ 运行时\n\nJavaScript 运行时是一个环境，结合了 JavaScript 引擎（Deno 中的 V8）、用底层语言编写的 API 后端（Deno\
    \ 中的 Rust）、持续监控调用栈的回调队列和事件循环。\n\n**内存堆：**\nJavaScript 代码传递给 V8 引擎，它存储代码中的变量和函数。\n\
    \n**调用栈：**\n它存储代码中调用的函数。它按照后进先（LIFO）原则运行。它始终指向当前运行的函数。一旦函数返回或传递给 Deno API，它就会弹出函数并执行栈中的上一个函数。\n\
    \n**Deno API：**\n当 Deno 检测到与 i/o、网络等相关的代码时，它将代码传递给用 Rust 编写的 API 后端。它使用 `rusty_v8`\
    \ 绑定将代码传递给后端。\n\n**Tokio：**\n它是一个事件驱动的异步 i/o 平台。Deno API 将代码传递给 tokio。它使用线程池和工作线程在后台执行操作并传递到回调队列。\n\
    \n**回调队列：**\n按照先进先出（FIFO）原则运行。它存储 Tokio 传递的所有完成函数。它等待调用栈为空。\n\n**事件循环：**\n它持续监控调用栈和回调队列。如果调用栈为空且回调队列中有函数，它将函数传递到调用栈上进行执行。\n\
    \n# 总结\n\n我们在 Deno 世界的之旅从这一章开始。我们学习了 Deno 和 Node 的历史，比较了 Deno 和 Node，并列出了 Deno\
    \ 的特性。我们还涵盖了构建 Deno 的栈，即 *V8* JavaScript 引擎、*Tokio* 事件循环以及用 Rust 编写的 Deno API\
    \ 后端。最后，我们涵盖了 JavaScript 引擎和 JavaScript 运行时架构，这些虽然强制性的，但为我们理解什么是 Deno 以及它如何在后台执行操作提供了坚实的基础。\n\
    \n"
- fmt: "\nWhile this chapter covered the Major Deno features, TypeScript is one important\
    \ section in Deno land that needs to be covered. TypeScript support out of the\
    \ box is a major Deno feature, and learning TypeScript requires an entire dedicated\
    \ chapter to cover the basics. Hence, we will learn `TypeScript` in the upcoming\
    \ chapter, as we will be using `TypeScript` for programming throughout this book.\n\
    \nAs you have reached this point, it is evident that you are interested and excited\
    \ to learn Deno. Deno has many exciting and modern features, which we will learn\
    \ throughout this book.\n\n# CHAPTER 2](#toc.xhtml_c02)\n\n# Introduction to TypeScript](#toc.xhtml_c02)\n\
    \n## Introduction](#toc.xhtml_s16a)\n\nTypeScript support out of the box is an\
    \ exciting feature offered by Deno runtime. TypeScript has been a popular choice\
    \ for large-scale applications and is being adopted rapidly in the industry. It\
    \ ranked second in the Most Loved Languages ([https://insights.stackoverflow.com/survey/2020#most-loved-dreaded-and-wanted](https://insights.stackoverflow.com/survey/2020#most-loved-dreaded-and-wanted))\
    \ section of the Stack Overflow Developer Survey 2020 ([https://insights.stackoverflow.com/survey/2020](https://insights.stackoverflow.com/survey/2020)).\n\
    \n## Structure](#toc.xhtml_s17a)\n\nIn this chapter, we will cover the following\
    \ topics:\n\n*   Introducing TypeScript\n*   TypeScript benefits\n*   TypeScript\
    \ features\n*   TypeScript basics\n    *   Basic types\n    *   Interfaces\n \
    \   *   Type aliases\n    *   Interfaces versus Type aliases\n    *   Type inferences\n\
    \    *   Type assertions\n    *   Unions\n    *   Intersections\n    *   Classes\n\
    *   Dynamic versus static typing\n*   Strongly versus weakly typing\n*   TypeScript\
    \ setup\n\n## Objectives](#toc.xhtml_s18a)\n\nThis chapter should help you become\
    \ familiar with TypeScript fundamentals and the use of TypeScript for programming\
    \ Deno applications. This chapter should also help you understand the pros and\
    \ cons of static type checking and the benefits provided by TypeScript.\n\n##\
    \ Introducing TypeScript](#toc.xhtml_s19a)\n\nAnnounced publicly by `Anders Hejlsberg`\
    \ in 2012, TypeScript is a very popular and open-source superset of JavaScript.\
    \ It adds static type definitions to JavaScript code. It was developed and maintained\
    \ by Microsoft. TypeScript provides type safety, type inference, type assertions,\
    \ and many more features, including ES Next features to JavaScript. Please take\
    \ a look at the following screenshot:\n\n![](images/Figure-2.1.jpg)\n\n**Figure\
    \ 2.1:** TypeScript\n\n## TypeScript benefits](#toc.xhtml_s20a)\n\nJavaScript\
    \ is very popular and widely used in our industry. But while using JavaScript\
    \ for large-scale applications, its dynamic nature lets many type-related errors\
    \ and bugs pass through in the development phase and are caught only during runtime.\
    \ Runtime debugging is more awful compared to compile-time debugging.\n\nStatically\
    \ typed languages caught errors and bugs during compilation, even before running\
    \ the code. TypeScript helps us write and maintain large-scale applications by\
    \ providing type safety during the development cycle. TypeScript catches type-related\
    \ or other errors during compile time, saving a lot of our precious time.\n\n\
    TypeScript was introduced to add types to JavaScript. TypeScript code gets transformed\
    \ into Javascript by TypeScript compiler or babel transpiler. TypeScript enables\
    \ `static type checking`, which detects errors in the code without running it,\
    \ that is, in compile time. It preserves the runtime behavior of JavaScript, meaning\
    \ the code will run the same way. Keeping the same runtime behavior is one of\
    \ the core features of TypeScript.\n\n## TypeScript features](#toc.xhtml_s21a)\n\
    \nTypeScript provides many es-next features out of the box, along with features\
    \ helpful for developing large-scale applications. We will list some of the major\
    \ features of TypeScript.\n\n*   Detects errors in compile-time, without running\
    \ the code\n*   IDE can use type definitions for auto-completion\n*   Static type\
    \ system support for JavaScript code\n*   Less prone to errors due to static type\
    \ checking\n*   ES-Next Features support out of the box\n*   Tooling\n*   Type\
    \ safety\n*   Type inference\n*   Type assertions\n*   Generics\n*   Interfaces\
    \ and type aliases\n*   Language services\n*   Same runtime behavior as that of\
    \ JavaScript\n\n## Basics of TypeScript](#toc.xhtml_s22a)\n\nBeing a superset\
    \ of JavaScript, TypeScript is easy to grasp for a JavaScript developer. Assuming\
    \ you are familiar with JavaScript, we will learn the additional types included\
    \ in TypeScript.\n\n## Basic types](#toc.xhtml_s23a)\n\nWe are covering the commonly\
    \ used data types in this section. We will be using them for the majority of the\
    \ time during Deno’s development.\n\n*   **Boolean**: Accepts either `true` or\
    \ `false` value.\n*   **Number**: Accepts either floating point or integer.\n\
    *   **String**: Accepts texts and characters.\n*   **Array**: Array of elements.\n\
    *   **Generics**: `Array<string>`\n*   **Tuple**: A fixed number of elements.\n\
    *   **Enum**: Maps values to a set.\n*   **Unknown**: Accepts all types.\n*  \
    \ **Any**: It is more permissible than `unknown`.\n*   **Null**: Accepts null.\n\
    *   **Undefined**: Accepts undefined.\n*   **Never**: Used as return type that\
    \ never returns.\n*   **Void**: Used as return type that does not.\n*   **Object**:\
    \ Represents non-primitive types.\n\n## Interfaces](#toc.xhtml_s24a)\n\nInterfaces\
    \ are used to define the shape of an entity or object. It describes the properties\
    \ an object should have.\n\n```typescript\ninterface IPerson {\n  firstName: string;\n\
    \  lastName: string;\n}\n\nconst person: IPerson = {\n  firstName: \"first\",\n\
    \  lastName: \"last\"\n};\n```\n\nIn the preceding example, `IPerson` (notice\
    \ the capital I for interface) defines a shape that the object `person` must have.\
    \ Hence, the property `place` will cause a compiler error as it does not exist\
    \ in `IPerson`.\n\n## Optional properties](#toc.xhtml_s25a)\n\nIn many cases,\
    \ we need to provide a field that can be optional. In an interface, `?` symbol\
    \ can be used to make the field optional.\n\n```typescript\ninterface IPerson\
    \ {\n  name: string;\n  age?: number; // age is optional\n}\n\nlet printProfile\
    \ = (person: IPerson): void => {\n  console.log(person.name);\n};\n\nconst person\
    \ = { name: \"name1\" };\nprintProfile(person);\n```\n\n## Read only properties](#toc.xhtml_s26a)\n\
    \nA `readonly` keyword before the property indicates we want a property to be\
    \ immutable after creation.\n\n```typescript\ninterface IPerson {\n  name: string;\n\
    \  readonly age: number; // age is read-only\n}\n\nconst person: IPerson = {\n\
    \  name: \"me\",\n  age: 29\n};\n\nperson.name = \"you\";\n// person.age = 25;\
    \ // Cannot assign to age because it is a read-only property\n```\n\n## Type aliases](#toc.xhtml_s27a)\n\
    \nType aliases work in a similar way to that of interfaces. While interfaces are\
    \ used to define the shape of an object, type aliases can be used to provide names\
    \ for primitive types. They can also be used for union types.\n"
