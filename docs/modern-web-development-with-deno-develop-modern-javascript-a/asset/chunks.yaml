  trans: "\n最后，我们将在应用中添加 `oakcors` 中间件以启用`跨源资源共享 (CORS)`，允许其他域名访问此服务器上的资源。我们还将使用 `PORT`\
    \ 环境变量来设置服务器端口。修改后，我们的 `mod.ts` 文件将包含代码：\n\n```typescript\nimport { Application\
    \ } from \"oak\";\nimport { GraphQLService } from \"./middlewares.ts\";\nimport\
    \ { oakCors } from \"cors\";\n\nconst app = new Application();\nconst _PORT =\
    \ Deno.env.get(\"PORT\");\nconst PORT = parseInt(_PORT as string);\nconst port\
    \ = isNaN(PORT) ? 8080 : PORT;\napp.use(\n  oakCors()\n);\napp.use(GraphQLService.routes(),\
    \ GraphQLService.allowedMethods());\nconsole.log(`GraphQL Server listening on\
    \ ${port}/graphql`);\nawait app.listen({ port });\n```\n\n我们将使用以下命令安装 `cors` 模块：\n\
    \n```bash\ntrex i -m cors@v1.2.2\n```\n\n# 总结\n\n在本章中，我们使用了多种 Deno 模块（如 `oak-graphql`、`djwt`、`scrypt`\
    \ 和 `cors`）实现了一个 GraphQL API。Oak-GraphQL 配合 Oak 框架创建 GraphQL API 服务器非常有用。Djwt\
    \ 用于创建和验证 JSON Web Tokens。Scrypt 用于密码哈希处理。CORS 用于允许通过不同域名访问服务器。我们学习了如何使用 `velociraptor`\
    \ 配置设置（环境变量、脚本和权限）。我们使用了 `trex` 模块来安装 Deno 模块并将它们添加到 `import_map.json` 文件中。\n\n\
    这些知识对于建立一个新的 Deno 项目将非常有帮助。目前，我们可以在播放器（playground）中测试实现结果。我们将在接下来的章节中使用 `Snel`\
    \ 模块创建一个 Svelte 前端，并集成 GraphQL API。\n\n# 第 9 章\n\n# 通讯录应用 - UI 实现\n\n# 引言\n\n\
    在上一章中，我们为电话通讯录应用实现了 GraphQL API 服务器。应用程序的用户界面（UI）将在本章中通过该 API 进行实现。我们将使用 `snel`\
    \ 模块在 deno 中创建 `svelte` 应用，并配合 `snel-carbon` 模块，该模块提供了基于 IBM Carbon 设计系统的 carbon\
    \ 组件和图标。我们还将使用 `axiod` 模块向服务器发送网络请求。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 初始设置\n  \
    \  * Snel 设置\n    * Snel-carbon 安装\n* 路由\n    * 公共路由\n        * 登录\n        *\
    \ 注册\n    * 私有路由\n        * 首页\n        * 联系人\n            * 联系人表格\n         \
    \   * 联系表单\n* 布局\n    * 头部\n    * 侧边栏\n\n# 目标\n\n完成本章后，你应该能够使用 `snel` 和 `snel-carbon`\
    \ 模块创建 svelte UI 应用。之后你应该能够为 svelte 应用创建公共和私有路由。你还将学习使用 `axiod` 模块进行网络请求。\n\n\
    # 初始设置\n\n在本节中，我们将安装 `snel` 并初始化一个 snel 项目，然后使用 `trex` 运行脚本。一旦创建了 snel 项目，我们将安装\
    \ `snel-carbon` 组件、图标模块以及用于网络请求的 `axiod` 模块。让我们从安装 snel 开始。\n\n# Snel 设置\n\nSnel\
    \ 是“一个用于 deno 中 svelte 应用的控制论框架”，它将 Svelte 组件编译为 javascript 文件。我们将使用以下命令安装 snel：\n\
    \n```bash\ndeno run --allow-run --allow-read https://deno.land/x/snel/install.ts\n\
    ```\n\n上述命令将安装 `snel`、`trex`、`bundler` 模块以提供良好的开发者体验。命令成功执行后，我们将使用以下命令创建新的 snel\
    \ 应用：\n\n```bash\nsnel create [project name]\n```\n\n图 9.1 显示了使用默认设置创建新的 snel\
    \ 项目。\n\n![](img/Figure-9.1.jpg)\n\n**图 9.1：** Snel 项目创建\n\n项目完成后，我们可以使用多个命令在各种模式下运行项目，如\
    \ `development`、`watch`、`build` 等。\n\n图 9.2 列出了运行 snel 项目的可用命令。\n\n![](img/Figure-9.2.jpg)\n\
    \n**图 9.2：** 用于 Snel 项目的 Trex 命令\n\n我们将通过运行 `trex start` 命令启动项目。这将在 `3000` 端口启动服务器。\n\
    \n图 9.3 显示在 3000 端口运行的示例项目。\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 在 3000 端口运行的\
    \ Snel 项目\n\n# Snel Carbon 安装\n\nSnel-Carbon 是一个为 svelte 提供 UI 的 deno 模块。它可以帮助我们基于设计系统构建\
    \ UI。让我们从在 `index.html` 文件中添加 css 开始。\n\n```html\n<link rel=\"stylesheet\" href=\"\
    https://cdn.jsdelivr.net/npm/carbon-components@0.4\" />\n```\n\nSnel 提供 `snel.config.js`\
    \ 文件来配置设置。我们将向项目中添加导入映射（import maps）。\n\n```javascript\nexport default {\n  port:\
    \ 3000,\n  mode: \"dom\",\n  plugins: [],\n  extendsMap: [\n    \"https://denkg.com/io/components.json\"\
    ,\n    \"https://denkg.com/io/icons.json\",\n  ],\n};\n```\n\n现在我们使用 `trex` 命令安装\
    \ `axiod` 模块：\n\n```bash\ntrex i -m axiod@0\n```\n\n上述命令将 `axiod` 添加到 `import_map.json`\
    \ 文件中。\n\n# 路由\n\nSnel 包含了 Svelte Routing 来创建路由。我们将使用它创建名为公共和私有的两种路由。公共路由对所有用户可用，而私有路由对已验证的用户可用。让我们先在\
    \ `App.svelte` 文件中从 `routes/svelte` 添加 `Route` 组件：\n\n```svelte\n<script>\n  import\
    \ Routes from \"./routes.svelte\";\n  import { fade } from \"svelte/transition\"\
    ;\n</script>\n\n<main transition:fade>\n  <Routes />\n</main>\n\n<style>\n  main\
    \ {\n    max-width: 240px;\n  }\n  @media (min-width: 640px) {\n    main {\n \
    \     max-width: none;\n    }\n  }\n</style>\n```\n\n在前面的代码中，我们用 `Route` 组件替换了\
    \ main 元素（代表主体主体内容的 HTML 元素）中的代码。这样我们的应用程序就会根据路由地址渲染每个页面。让我们在 `routes/index.svelte`\
    \ 文件中实现路由：\n\n```svelte\n<script>\n  // \n  import Router from \"svelte-routing/Router\"\
    ;\n  import Route from \"svelte-routing/Route\";\n\n  // 路由\n  import Contacts\
    \ from \"./Contacts.svelte\";\n  import Login from \"./Login.svelte\";\n  import\
    \ Register from \"./Register.svelte\";\n  import Home from \"./Home.svelte\";\n\
    \  import NotFound from \"./NotFound.svelte\";\n  import PrivateRoute from \"\
    ./PrivateRoute.svelte\";\n</script>\n\n<Router>\n  <Route path=\"/login\" component={Login}\
    \ />\n  <Route path=\"/register\" component={Register} />\n  <PrivateRoute path=\"\
    /home\" component={Home} />\n  <PrivateRoute path=\"/contacts\" component={Contacts}\
    \ />\n  <Route path=\"/\" component={Home} />\n  <Route path=\"*\" component={NotFound}\
    \ />\n</Router>\n```\n\n"
