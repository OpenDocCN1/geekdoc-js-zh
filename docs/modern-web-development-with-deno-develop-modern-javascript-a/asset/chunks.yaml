  trans: "\n在本章中，我们将学习核心 `Graph Query Language`（`GraphQL`）概念及其特性。在涵盖了基础知识后，我们将在接下来的章节中利用这些概念为\
    \ `Phonebook` 应用创建一个 API 服务器（`GraphQL`）。我们还将介绍 `Oak Web` 框架和 `Oak GraphQL`。两者都将在后续章节中用于\
    \ GraphQL API 服务器的实现。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   GraphQL 简介\n    *   特性\n\
    \        *   精确获取\n        *   单一 API 端点\n        *   验证与类型检查\n        *   片段\
    \ (Fragments)\n        *   自动生成的 API 文档\n    *   核心概念\n        *   Schema（模式）\n\
    \            *   类型 (Type)\n            *   输入 (Input)\n            *   查询 (Query)\n\
    \            *   变更 (Mutation)\n            *   关系 (Relationship)\n        * \
    \  Resolver（Resolver）\n*   引入 Oak 框架\n*   引入 Oak-GraphQL\n\n# 目标\n\n完成本章后，你将能够理解并应用\
    \ GraphQL 核心概念，如查询、变更、解析器、类型定义等。你还应该能够使用 Oak 框架创建 Deno Web 服务器，并使用 Oak-GraphQL\
    \ 模块创建 GraphQL 服务器。\n\n# 引入 GraphQL\n\nGraphQL 是由 Facebook 开发并在 2015 年发布的开源 API\
    \ 查询语言。它允许客户端控制解析后的数据结构，而不是 REST 中固定的数据结构。通过这种方式，客户端可以仅`query` 所需精确数据。它还允许 `mutations`（写入或更改数据）和\
    \ `subscriptions`（订阅数据更新）。许多大型组织如 Facebook、GitHub、Coursera 和 Pinterest 等都在使用它。\n\
    \n# 特性\n\nGraphQL 允许客户端在单个请求中跨多个资源`查询或更改数据`。它创建了一个单一入口或 API 端点 POST `/graphql`\
    \ 来查询或更改数据。GraphQL 提供的解析数据格式与请求查询的格式相同。其他 GraphQL 特性将详细说明如下。\n\n# 精确获取\n\n通过允许仅获取所需的数据，GraphQL\
    \ 解决了数据相关问题，即客户端获取了多于所需的数据（过度获取）或少于所需的数据（获取不足）。\n\n# 单一 API 端点\n\n与 REST 不同，GraphQL\
    \ 始终有一个单一的端点 `/graphql (POST)`，客户端可以使用它来获取 schema 中定义的任何数据，因为 GraphQL 使用通过请求体传递的\
    \ `query` 来解析请求。\n\n*[图 7.1]* 通过在正文中提供所示的 `users` 查询使用 `/graphql` 端点获取 `users`\
    \ 数据：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 获取用户\n\n*[图 7.2]* 通过在正文中提供所示的 `todos`\
    \ 查询使用相同的端点 `/graphql` 获取 `Todos 数据`：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2:**\
    \ 获取 Todos\n\n如`[图 7.1]`和`[7.2]`所示，GraphQL 允许通过单一 API 端点使用`query 操作`来获取 `users`\
    \ 和 `todos`。\n\n我们甚至可以在单个请求中获取 `users` 和 `todos`。这是 GraphQL 一个非常强大的特性，允许客户端在单个请求中获取所有所需数据，这对于网络较慢的设备极其有用。\n\
    \n*[图 7.3]* 所示如何在单个请求中同时获取 `users` 和 `todos`：\n\n![](img/Figure-7.3.jpg)\n\n**图\
    \ 7.3:** 获取用户和 Todos\n\n# 验证与类型检查\n\nGraphQL 使用`type system` 来验证查询。客户端可以在发送请求之前检查哪些字段是可选（带有字段类型），以及查询是否有效。\n\
    \n*[图 7.4]* 展示了针对 `todos` 的验证和类型检查概念，其中 schema 中未定义 `someField` 字段：\n\n![](img/Figure-7.4.jpg)\n\
    \n**图 7.4:** 验证\n\n# 片段 (Fragments)\n\nGraphQL 允许编写可重用的代码 `fragment`，该片段可以在多个查询之间使用。我们可以创建一个片段来替换重复的代码单元，使查询更整洁、更具可读性。\n\
    \n*[图 7.5]* 显示了 `todos`（获取所有 Todos）和 `todo`（通过 id 获取单个 Todo）查询中重复的代码单元：\n\n![](img/Figure-7.5.jpg)\n\
    \n![](img/Figure-7.5.jpg)\n\n**图 7.5:** 重复的代码单元\n\n我们将把重复的代码单元移动到 `todoData` 片段中，并在两个查询中使用扩展运算符（`…`）使用它。\n\
    \n*[图 7.6]* 展示了使用 `fragment` 获取 `todos` 和 `userData`。\n\n# 自动生成的 API 文档\n\nGraphQL\
    \ 为*queries*和*mutations*生成 API 文档。*图 7.7* 显示了 `todo` 的自动生成文档。如果我们把 `user` 改为 `Int`，文档将反映此变化。\n\
    \n# 核心概念\n\nGraphQL 提供了一个解析请求的 `Resolver`，以及用于读取数据的 `query`、用于写入数据的 `mutations`\
    \ 和用于实时数据的 `subscription`。\n\n# Schema\n\n`type system` 是客户端和服务器之间的约，定义了数据的形状。它定义了描述实体或字段的\
    \ `types`。GraphQL 使用 Schema 定义语言 (SDL) 来定义 schema。一个示例应用定义如下：\n\n```graphql\n\
    type User {\n  userId: String!\n  name: String!\n  todos: [Todo!]\n}\n\ntype Todo\
    \ {\n  todoId: String!\n  title: String!\n  user: User!\n}\n\ninput UserInput\
    \ {\n  name: String!\n}\n\ninput TodoInput {\n  title: String!\n  userId: String!\n\
    }\n\ntype Query {\n  todos: [Todo!]\n  todo(todoId: String!): Todo!\n  users:\
    \ [User!]\n  user(userId: String!): User!\n}\n\ntype Mutation {\n  addTodo(todo:\
    \ TodoInput!): Todo\n  addUser(user: UserInput!): User\n}\n```\n\n此 schema 也可以通过\
    \ GraphQL Playground 查看，如`[图 7.9]`所示。\n\n![](img/Figure-7.9.jpg)\n\n**图 7.9:**\
    \ GraphQL schema\n\n解释上述 schema 中使用的各种关键字（`type` 和 `input`）：\n\n### Type\n\nType\
    \ 用于定义解析查询的形状。图 7.9 所示的 schema 定义了两个对象类型 `User` 和 `Todo`。`User` 类型定义了字段 `userId`、`name`\
    \ 和 `todos`（`Todo` 对象数组）。`Todo` 类型定义了字段 `todoId`、`title` 和 `user`（类型为 `User`）。这两个对象类型都被\
    \ `Query` 类型用于以返回相应的数据。\n\n### Input\n\nInput 用于定义变更的数据结构。\n\n"
- fmt: "\nInput is used to define the shape of client input during `mutation`. It\
    \ defines two `input types`, `UserInput` and `TodoInput`. `UserInput` accepts\
    \ a `name` argument, and `TodoInput` accepts `title` and `userId` arguments. Both\
    \ Input types are used for creating or updating the corresponding entity by the\
    \ `mutation` type.\n\n# Query\n\nDefines entry points for `read` operations to\
    \ be executed by the client. Four fields `todos`, `todo`, `users`, and `user`\
    \ are defined in the query. `todos` and `users` fields accept no arguments and\
    \ return array corresponding types. `todo` and `user` fields accept the `id` of\
    \ the entity and return the entity of corresponding types.\n\n# Mutation\n\nDefines\
    \ entry points for `write` operations to be executed by the client. `addTodo`\
    \ and `addUser` fields are defined in this type. `addTodo` accepts arguments of\
    \ type `TodoInput` and returns data of type `Todo`, whereas `addUser` accepts\
    \ arguments of type `UserInput` and returns data of type `User`.\n\n# Relationship\n\
    \nThe Todos schema defines the relationship of type `one-to-many` between `User`\
    \ and `Todo` types. It means every `Todo` has `one` user, and every `user` has\
    \ `many` Todos.\n\nAs shown in `[figure 7.10]`, GraphQL gives flexibility to the\
    \ client to fetch all user-related Todos in a single query.\n\n![](images/Figure-7.10.jpg)\n\
    \n**Figure 7.10:** Relationships\n\n# Resolver\n\nA resolver is a function used\
    \ to resolve a `query` or `mutation` by populating data for a single field in\
    \ a schema. The following code demonstrates the use of `resolvers` for a previously\
    \ defined schema:\n\n```javascript\nexport const resolvers = {\n  Query: {\n \
    \   todos: (parent: any, args: any, context: any, info: any) => {\n      if (args.userId)\
    \ return getTodosByUserId(args.userId);\n      return getTodos();\n    },\n  \
    \  todo: async (parent: any, args: any, context: any, info: any) => {\n      return\
    \ getTodo(args._id);\n    },\n    users: (parent: any, args: any, context: any,\
    \ info: any) => {\n      return getUsers();\n    },\n    user: async (parent:\
    \ any, args: any, context: any, info: any) => {\n      return getUser(args._id);\n\
    \    },\n  },\n  Mutation: {\n    addTodo: async (parent: any, args: any, context:\
    \ any, info: any) => {\n      const { title, userId } = args.todo;\n      return\
    \ createTodo(title, userId);\n    },\n    addUser: async (parent: any, args: any,\
    \ context: any, info: any) => {\n      const { name } = args.user;\n      const\
    \ user = createUser(name);\n      return user;\n    },\n  },\n  Todo: {\n    title:\
    \ (parent: any, args: any, context: any, info: any) => {\n      return parent.title;\n\
    \    },\n    user: async (parent: any, args: any, context: any, info: any) =>\
    \ {\n      const user = await info.rootValue.user(\n        parent,\n        {\
    \ _id: parent.userId },\n        context,\n        info\n      );\n      return\
    \ user;\n    },\n  },\n  User: {\n    name: (parent: any, args: any, context:\
    \ any, info: any) => {\n      return parent.name;\n    },\n    todos: async (parent:\
    \ any, args: any, context: any, info: any) => {\n      const todos = await resolvers.Query.todos(\n\
    \        parent,\n        { userId: parent._id },\n        context,\n        info\n\
    \      );\n      return todos;\n    },\n  },\n};\n```\n\nLet us see what is happening\
    \ in the preceding code. We define `Query`, `Mutation`, `Todo`, and `User` objects.\
    \ `Query` object contains `todos` (list), `todo`, `users`, and `user` objects.\
    \ Similarly, `Mutation` contains `addTodo` and `addUser` objects, each with the\
    \ same signature. The other objects `User` and `Todo` are required for resolving\
    \ internal fields (title and so on) of the respective type. The data can then\
    \ be fetched from various sources. Each object previously accepts optional parameters:\
    \ `parent`, `args`, `context`, and `info`.\n\nThe `parent` is the return value\
    \ for the field’s parent, and `args` contains all the GraphQL arguments, a `context`\
    \ is an object whose content is available across all resolvers, and `info` contains\
    \ information such as field name, path, and so on.\n\n# Oak framework\n\nOak is\
    \ a Web framework for Deno, inspired by the `koa` framework of node.js. It provides\
    \ middleware functions that are invoked in between the request and the response.\
    \ Oak provides the `use()` method to use the middleware function. The following\
    \ code demonstrates the `Hello World` server in oak:\n\n```javascript\nimport\
    \ { Application } from \"https://deno.land/x/oak@v7.7.0/mod.ts\";\n\nconst app\
    \ = new Application();\n\napp.use((ctx) => {\n  ctx.response.body = \"Hello World!\"\
    ;\n});\n\nawait app.listen({ port: 8000 });\n```\n\nIn the preceding code, the\
    \ `Application` instance `app` invokes each middleware with `context`, which contains\
    \ necessary info such as `app`, `cookies`, `request`, `response`, `state`, `assert()`,\
    \ and `throw()`. Finally, the server starts listening on port `8000` for incoming\
    \ requests using `listen()` method.\n\n# Oak-GraphQL middleware\n\nOak-GraphQL\
    \ module allows us to create a GraphQL API on top of the oak server. We will be\
    \ using Oak-GraphQL middleware for GraphQL API implementation. A simple Hello\
    \ World GraphQL API can be set up as follows:\n\n```typescript\n// oak_graphql_server.ts\n\
    import {\n  Application,\n  Router,\n  RouterContext,\n} from \"https://deno.land/x/oak@v9.0.0/mod.ts\"\
    ;\nimport {\n  applyGraphQL,\n  gql,\n  GQLError,\n}\n\nconst types = gql`\n \
    \ type Query {\n    hello(name: String): String\n  }\n`;\n\nconst resolvers =\
    \ {\n  Query: {\n    hello: (parent: any, { name }: any, context: any, info: any)\
    \ => {\n      if (!name) throw new GQLError(\"Name not provided\");\n      return\
    \ `Hello ${name}`;\n    },\n  },\n};\n\nconst GraphQLService = await applyGraphQL<Router>({\n\
    \  Router, // Same as Router:\n  typeDefs: types,\n  resolvers: resolvers,\n});\n\
    \nconst app = new Application();\napp.use(GraphQLService.routes(), GraphQLService.allowedMethods());\n\
    \nconsole.log(\"Server listening on http://localhost:8080/graphql\");\nawait app.listen({\
    \ port: 8000 });\n```\n\nIf we run the preceding code with the command `deno run\
    \ --allow-net oak_graphql_server.ts` and open URL `http://localhost:8080/graphql`\
    \ with query `{ hello(name: “ABC”) }` we should see the results shown in `[figure\
    \ 7.11]` as follows:\n"
