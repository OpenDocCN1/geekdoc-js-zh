    \ // instanceCount = 1;\nconst person2 = new Person(\"you\", 29);\nperson2.printMe();\n\
    person2.printTotalPersons(); // instanceCount = 2;\n```\n\n# 抽象 (Abstract)\n\n\
    抽象类是一个常见的基类（例如，`Person`），具有基本结构，可以被其他类继承（例如，`Employee`、`Employer`）。\n\n```typescript\n\
