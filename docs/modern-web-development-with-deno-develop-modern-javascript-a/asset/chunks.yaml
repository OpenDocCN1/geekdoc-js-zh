    44.  `      return parent.name;`


    45.  `    },`


    46.  `    todos: async (parent: any, args: any, context: any, info: any) => {`


    47.  `      const todos = await resolvers.Query.todos(`


    48.  `        parent,`


    49.  `        { userId: parent._id },`


    50.  `        context,`


    51.  `        info`


    52.  `      );`


    53.  `      return todos;`


    54.  `    },`


    55.  `  },`


    56.  `};`


    Let us see what is happening in the preceding code. We define **`Query`**, **`Mutation`**,
    **`Todo`**, and **`User`** objects. **`Query`** object contains **`todos`** (list),
    **`todo`**, **`users`**, and **`user`** objects. Similarly, **`Mutation`** contains
    **`addTodo`** and **`addUser`** objects, each with the same signature. The other
    objects **`User`** and **`Todo`** are required for resolving internal fields (title
    and so on) of the respective type. The data can then be fetched from various sources.
    Each object mentioned previously accepts optional parameters: parent**,** **`args`,**
    **`context`**, and **`info`**.


    The **`parent`** is the return value for the field’s parent, and **`args`** contains
    all the provided GraphQL arguments, a **`context`** is an object whose content
    is available across all resolvers, and **info** contains information such as field
    name, path, and so on.


    # [Introducing Oak framework](#toc.xhtml_s130a)


    Oak is a Web framework for Deno, inspired by the *koa* framework of node.js. It
    provides middleware functions that are invoked in between the request and the
    response. Oak provides the **`use()`** method to use the middleware function.
    The following code demonstrates the **`Hello World`** server in oak**:**


    1.  `import { Application } from “https://deno.land/x/oak@v7.7.0/mod.ts”;`


    3.  `const app = new Application();`


    5.  `app.use((ctx) => {`


    6.  `  ctx.response.body = “Hello World!”;`


    7.  `});`


    9.  `await app.listen({ port: 8000 });`


    In the preceding code, the **`Application`** instance **`app`** invokes each middleware
    with *context*, which contains necessary info such as **`app`**, **`cookies`**,
    **`request`**, **`response`**, **`state`**, **`assert()`**, and **`throw()`**.
    Finally, the server starts listening on port **`8000`** for incoming requests
    using **`listen()`** method.


    # [Introducing Oak-GraphQL middleware](#toc.xhtml_s131a)


    Oak-GraphQL module allows us to create a GraphQL API on top of the oak server.
    We will be using Oak-GraphQL middleware for GraphQL API implementation. A simple
    Hello World GraphQL API can be set up as follows:


    1.  `// oak_graphql_server.ts`


    3.  `import {`


    4.  `  Application,`


    5.  `  Router,`


    6.  `  RouterContext,`


    7.  `} from “https://deno.land/x/oak@v9.0.0/mod.ts”;`


    8.  `import {`


    9.  `  applyGraphQL,`


    10.  `  gql,`


    11.  `  GQLError,`


    12.  `} from “https://deno.land/x/oak_graphql/mod.ts”;`


    14.  `const app = new Application();`


    15.  `` const types = gql` ``


    16.  `  type Query {`


    17.  `    hello(name: String): String`


    18.  `  }`


    19.  `` `; ``


    21.  `const resolvers = {`


    22.  `  Query: {`


    23.  `    hello: (parent: any, { name }: any, context: any, info: any) => {`


    24.  `      if (!name) throw new GQLError(“Name not provided”);`


    25.  ``      return `Hello ${name}`;``


    26.  `    },`


    27.  `  },`


    28.  `};`


    30.  `const GraphQLService = await applyGraphQL<Router>({`


    31.  `  Router,  // Same as Router: Router,`


    32.  `  typeDefs: types,`


    33.  `  resolvers: resolvers,`


    34.  `});`


    36.  `app.use(GraphQLService.routes(), GraphQLService.allowedMethods());`


    38.  `console.log(“Server listening on http://localhost:8080/graphql”);`


    39.  `await app.listen({ port: 8080 });`


    Preceding code imports required methods and classes from **`oak`** (Application,
    Router, and RouterContext) and **`oak-graphql`** (applyGraphQL, gql, and GQLError).
    After creating an **`Application`** instance, type definitions are defined using
    **`gql`** along with **resolvers** for the type definitions.


    A **`GraphQLService`** is then created using the **`applyGraphQL`** function that
    accepts an object with a **`Router`**, **`typeDefs`**, and **`resolvers`**. Middlewares
    **`GraphQLService.routes()`**, **`GraphQLService.allowedMethods()`** are then
    added to the **`app`** using the **`use()`** method. Finally, the server starts
    and listens to incoming requests using the **`listen()`** method on port 8080.


    If we run the preceding code with the command **`deno run --allow-net oak_graphql_server.ts`**
    and open URL **http://localhost:8080/graphql** with query **`{ hello(name: “ABC”)
    }`** we should see the results shown in *[figure 7.11](#c07.xhtml_fig7_11)* as
    follows:'
