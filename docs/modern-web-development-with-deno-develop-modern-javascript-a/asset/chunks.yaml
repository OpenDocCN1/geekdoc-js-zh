- fmt: "\nModule registries are places where the Deno modules are hosted. Just like\
    \ `npm` in Node, Deno has several module registries built using modern features\
    \ like blockchain.\n\nAfter listing the standard and third-party modules for Deno,\
    \ we will be checking the major module registries available for Deno:\n\n| Module\
    \ Registry | Description |\n| :--- | :--- |\n| `deno.land/x` | An official module\
    \ registry hosting large numbers of third-party modules (1651 modules at the time\
    \ of writing) |\n| `nest.land` | A modern Deno module registry built using `blockweave`,\
    \ a derivative of `blockchain`. The published modules are immutable, decentralized,\
    \ and permanent, meaning they can never be deleted. |\n| `Skypack CDN` | A CDN\
    \ to host pre-optimized ES modules offered by `Pika`. It provides minification,\
    \ caching, polyfilling, and converts `npm` packages to ES modules. Whenever `?dts`\
    \ is appended to the module URL, it automatically fetches type declarations using\
    \ the `X-TypeScript-Types` header. |\n| `esm.sh` | A CDN for ES modules from the\
    \ creator of the `aleph` framework that bundles all dependencies (except peer\
    \ dependencies) for every module. Node packages are transformed to ES modules\
    \ using `esbuild` to run on Deno via polyfill. It provides type declarations via\
    \ the `X-TypeScript-Types` header by default. |\n| `jspm` | A module CDN that\
    \ converts `npm` packages to ES modules. |\n| `Web` | Any ECMAScript module hosted\
    \ on the internet (e.g., GitHub) can be used via ESM import supported by Deno.\
    \ |\n\n**Table 4.8:** Deno module registries\n\n# Central dependencies in deps.ts\n\
    \nThere is one convention in Deno land to import all the dependencies in the `deps.ts`\
    \ file. These dependencies are re-exported and used throughout the project. This\
    \ helps us maintain all the dependencies in a single place. Similarly, development\
    \ dependencies are kept in a single file named `dev_deps.ts`.\n\nIn the following\
    \ code, we are importing all the dependency URLs in the `deps.ts` file and exporting\
    \ them to use across the project. We are importing the `titleCase` function from\
    \ a third-party module case that returns each word in the title case. We are also\
    \ importing `assertEquals` function from the testing module from Deno’s standard\
    \ library.\n\n```\n// deps.ts\n1. import titleCase from \"https://deno.land/x/case@v2.1.0/titleCase.ts\"\
    ;\n2. import { assertEquals } from \"https://deno.land/std@0.97.0/testing/asserts.ts\"\
    ;\n4. export { titleCase, assertEquals };\n```\n\nWe will now import the modules\
    \ from `deps.ts` file in `hello.ts` file, as shown in the following code:\n\n\
    ```typescript\n// hello.ts\n1. import { titleCase, assertEquals } from \"./deps.ts\"\
    ;\n3. console.log(titleCase(\"hello world\"));\n4. assertEquals(\"hello\", \"\
    helloz\");\n```\n\nThe preceding code logs `\"hello world\"` string in title case\
    \ `\"Hello World\"` and the `assertEquals` function throws `AssertionError` as\
    \ actual (`\"hello\"`) and expected (`\"helloz\"`) values are not equal, as shown\
    \ in the following figure:\n\n![](images/Figure-4.2.jpg)\n\n**Figure 4.2:** deps.ts\
    \ example\n\n# Conclusion\n\nWe are now concluding this chapter on the Deno Ecosystem.\
    \ It outlined various sections of the Deno Ecosystem, such as runtime API, CLI,\
    \ standard and third-party modules, module registries, and so on. Being a new\
    \ technology in the industry, the Deno Ecosystem is evolving at a rapid pace.\
    \ We would likely see the Deno community come up with new and exciting ideas and\
    \ implementations in the coming time, as they have done until now.\n\nWith the\
    \ end of this chapter, we are now ready to move to the most exciting part of the\
    \ book—writing code. We will start with writing a Deno application from scratch\
    \ in the upcoming chapters. Till then, keep exploring the Deno ecosystem.\n\n\
    # CHAPTER 5\n\n# Todos App—API\n\n# Introduction\n\nWe are now ready to enter\
    \ the Deno coding battlefield or playground (it depends on how you see it). We\
    \ will create a `CREATE`, `RETRIEVE`, `UPDATE`, and `DELETE` (`CRUD`) application\
    \ in this chapter. A Todos app. It will be a great way to begin our Deno coding\
    \ journey. We will learn, tweak, and play around with the Todos app created using\
    \ a Full Stack React framework called `Aleph.js` (aleph), listed in [Table 4.7]\
    \ of [Chapter 4, Deno Ecosystem]. The API will be implemented in this chapter,\
    \ whereas the UI will be implemented in the next one.\n\n# Structure\n\nIn this\
    \ chapter, we will cover the following topics:\n\n* Introduction to Aleph.js\n\
    \    * Features\n    * Concepts\n        * Pages\n        * Routing\n        *\
    \ APIs\n* Todos app API implementation\n\n# Objective\n\nWe will be able to learn:\
    \ there are three basic concepts we need to learn to develop a full stack app\
    \ using aleph. We will use these concepts for creating pages, routing based on\
    \ filenames, and API. The aim of this chapter is to get familiar with aleph.js.\
    \ We will start with writing a Deno application from scratch in the upcoming chapters.\
    \ Till then, keep exploring the Deno ecosystem. We will also learn to implement\
    \ `Representational State` (`REST`) actions like `CREATE`, `RETRIEVE`, `UPDATE`,\
    \ and `DELETE`.\n\n# Introducing Aleph.js\n\nAleph.js is a Full Stack framework\
    \ inspired by Next.js. It uses ES module syntax without the need for Webpack or\
    \ other bundlers. It does not re-bundle only the changed module but updates instantly\
    \ in the browser by Hot Module Replacement (`HMR`). Aleph.js can be installed\
    \ using the following command:\n\n```bash\ndeno install -A -n aleph https://deno.land/x/aleph/cli.ts\n\
    ```\n\n# Features\n\nAleph.js is a feature-rich framework that provides server-side\
    \ rendering, static site generation, API development, and many other features.\
    \ Some of the major features are as follows:\n\n* File-system-based pages and\
    \ routing\n* API development\n* Server-side rendering\n* Static site generation\n\
    * Zero config\n* Use of import maps\n* HMR with Fast Refresh\n* Access to Deno\
    \ runtime within component via `useDeno` hook\n\n# Command Line Interface\n\n\
    Aleph.js **Command Line Interface** (`CLI`) provides commands for static site\
    \ generation, creating a new app with boilerplate code, upgrading aleph.js, and\
    \ so on. All major commands are listed in the following:\n\n| Command | Description\
    \ |\n| :--- | :--- |\n| `aleph init` | Create new app with boilerplate code |\n\
    | `aleph upgrade` | Upgrade aleph.js |\n| `aleph` | Prints all cli commands |\n\
    | `aleph -h` / `aleph --help` | Prints help message |\n| `aleph -v` / `aleph --version`\
    \ | Prints aleph.js version |\n| `aleph dev` | Starts server in development mode\
    \ |\n| `aleph start` | Starts server in production mode |\n| `aleph build` | Builds\
    \ the app to static site |\n| `aleph analyze` | Analyzes app dependencies |\n\n\
    `aleph init` command provides an example app with boilerplate code. We will be\
    \ using it to initialize the demo app as follows:\n\n```bash\naleph init hello-aleph\
    \ // Creates hello-aleph folder with boilerplate code\ncd hello-aleph\naleph dev\
    \ // Runs app in development mode\n```\n\nYou can visit `http://localhost:8080`\
    \ to view the demo app, as shown in the following figure:\n\n![](images/Figure-5.1.jpg)\n\
    \n**Figure 5.1:** Aleph.js Demo App\n\n# Concepts\n\nThere are three basic concepts\
    \ we need to learn to develop a full stack app using aleph. We will use these\
    \ concepts for creating pages, routing based on filenames, and API.\n\n# Pages\n"
  raw: "Module registries are places where the Deno modules are hosted. Just like\
    \ **`npm`** in Node, Deno has several module registries built using modern features\
    \ like blockchain.\n\nAfter listing the standard and third-party modules for Deno,\
    \ we will be checking the major module registries available for Deno:\n\n| **Module\
    \ Registry** | **Description** |\n\n| **`deno.land/x`** | An official module registry\
    \ hosting large numbers of third-party modules (1651 modules at the time of writing)\
    \ |\n\n| **`nest.land`** | A modern Deno module registry built using **blockweave,**\
    \ a derivative of **blockchain**. The published modules are immutable, decentralized,\
    \ and permanent, meaning they can never be deleted. |\n\n| **`Skypack CDN`** |\
    \ A CDN to host pre-optimized ES modules offered by **Pika**. It provides minification,\
    \ caching, polyfilling, and converts npm packages to ES modules. Whenever **?dts**\
    \ is appended to the module URL, it automatically fetches type declarations using\
    \ the **X-TypeScript-Types** header. |\n\n| **`esm.sh`** | A CDN for ES modules\
    \ from the creator of the **aleph** framework that bundles all dependencies (except\
    \ peer dependencies) for every module. Node packages are transformed to ES modules\
    \ using **esbuild** to run on Deno via polyfill. It provides type declarations\
    \ via the **X-TypeScript-Types** header by default. |\n\n| **`jspm`** | A module\
    \ CDN that converts npm packages to ES modules. |\n\n| **`Web`** | Any ECMAScript\
    \ module hosted on the internet (e.g., GitHub) can be used via ESM import supported\
    \ by Deno. |\n\n**Table 4.8:** Deno module registries\n\n# [Central dependencies\
    \ in deps.ts](#toc.xhtml_s85a)\n\nThere is one convention in Deno land to import\
    \ all the dependencies in the **`deps.ts`** file. These dependencies are re-exported\
    \ and used throughout the project. This helps us maintain all the dependencies\
    \ in a single place. Similarly, development dependencies are kept in a single\
    \ file named **`dev_deps.ts`**.\n\nIn the following code, we are importing all\
    \ the dependency URLs in the **`deps.ts`** file and exporting them to use across\
    \ the project. We are importing the **`titleCase`** function from a third-party\
    \ module case that returns each word in the title case. We are also importing\
    \ **`assertEquals`** function from the testing module from Deno’s standard library.\n\
    \n`// deps.ts`\n\n1.  `import titleCase from “https://deno.land/x/case@v2.1.0/titleCase.ts”;`\n\
    \n2.  `import { assertEquals } from “https://deno.land/std@0.97.0/testing/asserts.ts”;`\n\
    \n4.  `export { titleCase, assertEquals };`\n\nWe will now import the modules\
    \ from **`deps.ts`** file in **`hello.ts`** file, as shown in the following code:\n\
    \n`// hello.ts`\n\n1.  `import { titleCase, assertEquals } from “./deps.ts”;`\n\
    \n3.  `console.log(titleCase(“hello world”));`\n\n4.  `assertEquals(“hello”, “helloz”);`\n\
    \nThe preceding code logs **`“hello world“`** string in title case **`“Hello World“`**\
    \ and the **`assertEquals`** function throws **`AssertionError`** as actual (**`“hello”`**)\
    \ and expected (**`“helloz”`**) values are not equal, as shown in the following\
    \ figure:\n\n![](images/Figure-4.2.jpg)\n\n**Figure 4.2:** deps.ts example\n\n\
    # [Conclusion](#toc.xhtml_s86a)\n\nWe are now concluding this chapter on the Deno\
    \ Ecosystem. It outlined various sections of the Deno Ecosystem, such as runtime\
    \ API, CLI, standard and third-party modules, module registries, and so on. Being\
    \ a new technology in the industry, the Deno Ecosystem is evolving at a rapid\
    \ pace. We would likely see the Deno community come up with new and exciting ideas\
    \ and implementations in the coming time, as they have done until now.\n\nWith\
    \ the end of this chapter, we are now ready to move to the most exciting part\
    \ of the book—writing code. We will start with writing a Deno application from\
    \ scratch in the upcoming chapters. Till then, keep exploring the Deno ecosystem.\n\
    \n# [CHAPTER 5](#toc.xhtml_c05)\n\n# [Todos App—API](#toc.xhtml_c05)\n\n# [Introduction](#toc.xhtml_s87a)\n\
    \nWe are now ready to enter the Deno coding battlefield or playground (it depends\
    \ on how you see it). We will create a **CREATE, RETRIEVE, UPDATE**, and **DELETE**\
    \ (**CRUD**) application in this chapter. A Todos app. It will be a great way\
    \ to begin our Deno coding journey. We will learn, tweak, and play around with\
    \ the Todos app created using a Full Stack React framework called **`Aleph.js`**\
    \ (aleph), listed in *[Table 4.7](#c04.xhtml_tab4_7)* of *[Chapter 4, Deno Ecosystem](#c04.xhtml)*.\
    \ The API will be implemented in this chapter, whereas the UI will be implemented\
    \ in the next one.\n\n# [Structure](#toc.xhtml_s88a)\n\nIn this chapter, we will\
    \ cover the following topics:\n\n*   Introduction to Aleph.js\n\n    *   Features\n\
    \n    *   Concepts\n\n        *   Pages\n\n        *   Routing\n\n        *  \
    \ APIs\n\n*   Todos app API implementation\n\n    *   Routes\n\n        *   GET\
    \ (list)\n\n        *   POST\n\n        *   PATCH\n\n        *   GET (object)\n\
    \n        *   DELETE\n\n# [Objective](#toc.xhtml_s89a)\n\nWe will be able to create\
    \ a server-side API using the *Aleph.js* framework after studying this chapter.\
    \ The aim of this chapter is to get familiar with Aleph.js and use its concepts\
    \ to create API. Aleph.js is a Full Stack React framework used to create API and\
    \ UI as well. We will start the chapter by introducing Aleph.js features and concepts.\
    \ The API for the Todos app will then be developed using Aleph.js.\n\nWe will\
    \ also learn to implement different **Representational State Transfer** (**REST**)\
    \ API actions like **`POST`** (CREATE), **`GET`** (RETRIEVE), **`PATCH`** (UPDATE),\
    \ and **`DELETE`** (DELETE) after studying this chapter.\n\n# [Introducing Aleph.js](#toc.xhtml_s90a)\n\
    \nAleph.js is a Full Stack React framework inspired by Next.js. It uses the ES\
    \ module import syntax without the need for Webpack or other bundlers. It does\
    \ not re-bundle every change but only the changed module and updates instantly\
    \ in the browser by **Hot Module Replacement** (**HMR**) with React Fast Refresh.\n\
    \nAleph.js can be installed using the following command:\n\n1.  `deno install\
    \ -A -f -n aleph https://deno.land/x/aleph/cli.ts`\n\n# [Features](#toc.xhtml_s91a)\n\
    \nAleph.js is a feature-rich framework that provides server-side rendering, static\
    \ site generation, API development, and many other features. Some of the major\
    \ features are as follows:\n\n*   File-system-based pages and API routing\n\n\
    *   API development\n\n*   Server-side rendering\n\n*   Static site generation\n\
    \n*   Zero config\n\n*   Use of import maps\n\n*   HMR with Fast Refresh\n\n*\
    \   Access to Deno runtime within component via **`useDeno`** hook\n\n# [Command\
    \ Line Interface](#toc.xhtml_s92a)\n\nAleph.js **Command Line Interface** (**CLI**)\
    \ provides commands for static site generation, creating a new app with boilerplate\
    \ code, upgrading Aleph.js, and so on. All major commands are listed in the following\
    \ table:\n\n| **Command** | **Description** |\n\n| **`aleph init`** | Create new\
    \ app with boilerplate code |\n\n| **`aleph upgrade`** | Upgrade aleph.js |\n\n\
    | **`aleph`** | Prints all cli commands |\n\n| **`aleph -h / aleph --help`** |\
    \ Prints help message |\n\n| **`aleph -v / aleph --version`** | Prints aleph.js\
    \ version |\n\n| **`aleph dev`** | Starts server in development mode |\n\n| **`aleph\
    \ start`** | Starts server in production mode |\n\n| **`aleph build`** | Builds\
    \ the app to static site |\n\n| **`aleph analyze`** | Analyzes app dependencies\
    \ |\n\n**Table 5.1:** Aleph.js CLI\n\n**`aleph init`** command provides an example\
    \ app with boilerplate code. We will be using it to initialize the demo app as\
    \ follows:\n\n1.  `aleph init hello-aleph // Creates hello-aleph folder with boilerplate\
    \ code`\n\n2.  `cd hello-aleph`\n\n3.  `aleph dev // Runs app in development mode`\n\
    \nYou can visit **http://localhost:8080** to view the demo app, as shown in the\
    \ following figure:\n\n![](images/Figure-5.1.jpg)\n\n**Figure 5.1:** Aleph.js\
    \ Demo App\n\n# [Concepts](#toc.xhtml_s93a)\n\nThere are three basic concepts\
    \ we need to learn to develop a full stack app using aleph. We will use these\
    \ concepts for creating pages, routing based on filenames, and API.\n\n# [Pages](#toc.xhtml_s94a)"
