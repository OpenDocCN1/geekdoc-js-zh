    \n            *   ContactForm\n\n*   Layout\n\n    *   Header\n\n    *   Sidebar\n\
    \n# [Objective](#toc.xhtml_s149a)\n\nAfter completion of this chapter, you should\
    \ be able to create svelte UI applications using **`snel`** and **`snel-carbon`**\
    \ modules. You should be able to create public and private routes for svelte applications\
    \ afterwards. You will also learn the use of **`axiod`** module to make network\
    \ requests.\n\n# [Initial setup](#toc.xhtml_s150a)\n\nIn this section, we will\
    \ install **`snel`** and initialize a snel project and then use **`trex`** to\
    \ run the scripts. Once a snel project is created, we will install **`snel-carbon`**\
    \ components, icons module and **`axiod`** module for network requests. Let’s\
    \ start with snel installation.\n\n# [Snel setup](#toc.xhtml_s151a)\n\nSnel is\
    \ “*A Cybernetical framework for svelte applications in deno*” that compiles Svelte\
    \ components to javascript files. We will install snel using following command:\n\
    \n1.  `deno run --allow-run --allow-read https://deno.land/x/snel/install.ts`\n\
    \nAbove command will install **`snel`**, **`trex`**, **`bundler`** modules to\
    \ provide good developer experience. Once the command is successfully executed,\
    \ we will create new snel app using following command:\n\n1.  `snel create [project\
    \ name]`\n\n*[Figure 9.1](#c09.xhtml_fig9_1)* shows creation of new snel project\
    \ with default settings.\n\n![](images/Figure-9.1.jpg)\n\n**Figure 9.1:** Snel\
    \ Project Creation\n\nOnce the project is created, we can use several commands\
