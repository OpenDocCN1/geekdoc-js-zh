    import type { APIHandler} from “aleph/types.d.ts”;\n\nexport default function\
    \ handler({response}: APIHandler) {\n  response.json({ message: “Aleph!” });\n\
    }\n```\n\n![](images/Figure-5.7.jpg)\n\n**Figure 5.7:** Dynamic route\n\n# Initializing\
