    \nIn this chapter, we will cover the following topics:\n\n*   Initial setup\n\n\
    \    *   Snel setup\n\n    *   Snel-carbon installation\n\n*   Routes\n\n    *\
    \   Public routes\n\n        *   Login\n\n        *   Register\n\n    *   Private\
