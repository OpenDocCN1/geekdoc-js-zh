    \ and so on.\n\n*[Figure 9.2](#c09.xhtml_fig9_2)* lists several commands available\
    \ to run the snel project.\n\n![](images/Figure-9.2.jpg)\n\n**Figure 9.2:** Trex\
    \ Commands for Snel Project\n\nWe will start the project by running **`trex run\
    \ start`** command as suggested in the message. This will run the server on port\
    \ **`3000`**.\n\n*[Figure 9.3](#c09.xhtml_fig9_3)* shows a sample snel project\
    \ running on port 3000.\n\n![](images/Figure-9.3.jpg)\n\n**Figure 9.3:** Snel\
    \ sample project running on port 3000\n\n# [Snel Carbon installation](#toc.xhtml_s152a)\n\
    \nSnel-Carbon is a deno module providing UI components for svelte. It would help\
    \ us to build a UI based on the Carbon Design System. Let’s start by adding css\
    \ in the **`index.html`** file. This will add stylings required for the components.\n\
    \n1.  `<link rel=”stylesheet” href=”https://cdn.jsdelivr.net/npm/carbon-components-svelte@0.44.2/css/all.min.css”\
    \ />`\n\nSnel provides **`snel.config.js`** file to configure snel settings. It\
    \ provides **`extendsImportMap`** field to link external import map to the project.\
    \ We will add import maps for components and icons provided by **`snel-carbon`**\
    \ library in this field as follows:\n\n1.  `// snel.config.js`\n\n3.  `export\
    \ default {`\n\n4.  `  port: 3000,`\n\n5.  `  mode: “dom”,`\n\n6.  `  plugins:\
    \ [],`\n\n7.  `  extendsImportMap: [`\n\n8.  `    “https://denopkg.com/crewdevio/Snel-carbon@main/components.map.json”,`\n\
    \n9.  `    “https://denopkg.com/crewdevio/Snel-carbon@main/icons.map.json”,`\n\
    \n10.  `  ],`\n\n11.  `};`\n\nWe will now install **`axiod`** module using familiar\
    \ **`trex`** command as follows:\n\n1.  `trex i -m axiod@0.20.0-0`\n\nAbove command\
    \ will add **`axiod`** in **`import_map.json`** file in the project. We have installed\
    \ all the required modules in this section. We will now create routes for different\
    \ pages in the next section.\n\n# [Routes](#toc.xhtml_s153a)\n\nSnel module includes\
    \ **Svelte Routing** library to create routes. We will use it to create two types\
    \ of routes named public and private routes for our project. Public routes will\
    \ be available to all the users while private routes will be available only to\
    \ authenticated users.\n\nLet’s start by adding **`Route`** component from **`routes/index.svelte`**\
    \ file in **`App.svelte`** file as follows:\n\n1.  `// App.svelte`\n\n3.  `<script>`\n\
    \n4.  `  import Routes from “routes/index.svelte”;`\n\n5.  `  import { fade }\
    \ from “svelte/transition”;`\n\n6.  `</script>`\n\n8.  `<main transition:fade>`\n\
    \n9.  `  <Routes />`\n\n10.  `</main>`\n\n12.  `<style>`\n\n13.  `  main {`\n\n\
    14.  `    max-width: 240px;`\n\n15.  `  }`\n\n17.  `  @media (min-width: 640px)\
    \ {`\n\n18.  `    main {`\n\n19.  `      max-width: none;`\n\n20.  `    }`\n\n\
    21.  `  }`\n\n22.  `</style>`\n\nIn the preceding code, we are replacing code\
    \ within the main element (HTML element that represents the dominant content of\
    \ the body) by **`Route`** component. This way our app will always render each\
    \ page as per the route address. Let’s implement the routes in the **`routes/index.svelte`**\
