  trans: "\n\n![](img/Figure-7.11.jpg)\n\n**图 7.11:** GraphQL API Hello World\n\n\
    # 结论\n\n我们已经涵盖了 GraphQL 的基本功能和概念，例如模式（schema）、解析器（resolver）以及类型（type）、查询（query）和变更（mutation）。我们还介绍了用于创建\
    \ Web 服务器的 `oak` 框架以及用于创建 GraphQL 服务器的 `Oak-GraphQL` 模块。\n\n在接下来的章节中，我们将使用上述 GraphQL\
    \ 概念，利用 `Oak` 和 `Oak-GraphQL` 模块为电话录应用创建一个 GraphQL API 服务器。\n\n# 第 8 章\n\n## 电话录应用—API\
    \ 实现\n\n### 引言\n\n在本章中，我们将实现**图形查询语言**（**GraphQL 应用程序接口**服务器。我们之前学习的 GraphQL 基础将在本章用于\
    \ API 实现。我们将使用之前介绍的 `oak` 和 `oak-graphql` 模块来实现 API 服务器。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
    \n*   初始化设置\n    *   使用 `git` 进行版本控制\n    *   使用 `Trex` 作为包管理器\n    *   使用 `Velociraptor`\
    \ 作为脚本运行器\n*   `Oak GraphQL` 服务器设置\n*   模式 (Schema)\n*   解析器 (Resolvers)\n*  \
    \ `DenoDB` 设置\n    *   数据库 (DB)\n        *   `ElephantSQL PostgreSQL` 设置\n   \
    \ *   模型 (Models)\n        *   `User`\n        *   `Contact`\n    *   控制器 (Controllers)\n\
    *   身份验证\n\n### 目标\n\n完成本章后，你将能够使用 `Oak` 和 `Oak-GraphQL` 模块创建 GraphQL API 服务器。你将学习使用\
    \ `denodb` 模块通过**对象关系映射 (ORM)** 连接到 MySQL、PostgreSQL、NoSQL 等数据库。你还将学习使用 `djwt`\
    \ 模块通过 **JSON Web 令牌 (JWT)** 验证用户身份。你也将学习使用 `trex` 和 `velociraptor` 模块设置 Deno\
    \ 服务器项目。\n\n### 初始化设置\n\n我们将通过初始化 git 仓库开始编写代码。然后我们将安装 `oak` 和 `oak-graphql` 模块来创建\
    \ Web 服务器。我们将使用 `trex` 包管理模块来安装这些模块。\n\n### 使用 git 进行版本控制\n\n*[图 8.1]* 显示了 git\
    \ 仓库初始化、安装 `trex` 模块以及使用 `trex` 模块安装 `oak` 和 `oak-graphql`。\n\n![](img/Figure-8.1.jpg)\n\
    \n**图 8.1:** 初始化设置\n\n### Trex 作为包管理器\n\nTrex 缓存已安装的包并将其添加到 `import_map.json`\
    \ 文件中。[图 8.2]* 显示了 `import_map.json` 文件中已安装模块列表（`oak`、`oak-graphql`）。\n\n![](img/Figure-8.2.jpg)\n\
    \n**图 8.2:** import_map.json 中的安装模块\n\n已安装的模块可以通过以下方式访问：\n\n1.  `import { Application\
    \ } from “oak”;`\n\n### Velociraptor 作为脚本运行器\n\n在 `src` 文件夹中创建一个名为 `mod.ts` 文件，代码如下：\n\
    \n```javascript\nconsole.log(\"Hello Velociraptor!\");\n```\n\n你可能会问什么是 velociraptor。它是用于\
    \ Deno 的脚本运行器模块。我们将安装 velociraptor 并使用它运行 `mod.ts` 文件。可以使用 [`nest.land/`](https://nest.land/)\
    \ 包注册表按照如下方式安装 velociraptor：\n\n```bash\ndeno install -qAn vr https://x.nest.land/velociraptor@1.1.0/cli.ts\n\
    ```\n\n现在我们将创建 `scripts.yaml` 文件以添加运行 `mod.ts` 文件的脚本。Veliraptor 将扩展名为 `yml`、`yaml`、`json`\
    \ 和 `ts` 且名为 `scripts` 或 `velociraptor` 的文件识别为脚本文件。\n\n*[图 8.3]* 显示了带有执行 `src/mod.ts`\
    \ 文件的 `dev` 脚本的 `scripts.yaml` 文件。\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3:** scripts.yaml\
    \ 文件\n\n如果我们在终端中运行 `vr` 命令，将看到可用脚本列表。然后我们可以如下所示运行可用脚本：\n\n```bash\nvr dev\n```\n\
    \n*[图 8.4]* 显示了列出可用脚本和运行脚本的命令。\n\n![](img/Figure-8.4.jpg)\n\n**图 8.4:** Velociraptor\
    \ CLI\n\n我们已经使用 trex 和 velociraptor 设置了一个 Deno 服务器项目。现在，我们将在下一节中设置 Web 服务器。\n\n\
    ### Oak GraphQL 设置\n\n我们将使用 `oak` 和 `oak-graphql` 模块设置一个简单的 GraphQL 服务器。我们将使用第\
    \ 7 章“GraphQL 简介”中的 `oak-graphql` 代码，并进行少量更改来设置服务器。我们不再需要提到 URL。相反，我们可以在 `import_map.json`\
    \ 中提到模块名。\n\n```javascript\nimport { Application, Router } from \"oak\";\nimport\
    \ { gql, GQLError } from \"oak-graphql\";\n```\n\n我们将通过拥有 `mod.ts`（主文件）、`middlewares.ts`（GraphQL\
    \ 中间件）、`schema.ts`（GraphQL 模式/类型定义）和 `resolvers.ts`（GraphQL 解析器）文件来构建项目。[图 8.5]*\
    \ 显示了项目结构：\n\n![](img/Figure-8.5.jpg)\n\n**图 8.5:** 项目结构\n\n我们将逐个编写每个文件的代码，从 `mod.ts`\
    \ 文件开始如下：\n\n```javascript\n// src/mod.ts\nimport { Application } from \"oak\"\
    ;\nimport { GraphQLService } from \"./middlewares.ts\";\nconst app = new Application();\n\
    app.use(GraphQLService.routes(), GraphQLService.allowedMethods());\nconsole.log(\"\
    Server listening on http://localhost:8080/graphql\");\nawait app.listen({ port:\
    \ 8080 });\n```\n\n在前面的代码中，我们正在创建一个带有名为 `GraphQLService` 的 de 间件的 oak 服务器，可以通过\
    \ `/graphql` 路由访问。\n\n```javascript\n// src/schema.ts\nimport { gql } from \"\
    oak_graphql\";\nexport const types = gql`\n  type Query {\n    hello(name: String):\
    \ String\n  }\n`;\n```\n\n在 `schema.ts` 文件中，我们定义了一个接受 `name` 参数的 `hello` 查询。GraphQL\
    \ 根据 `types` 中定义的模型进行验证。进入请求将由 `resolvers` 解析。\n\n```javascript\n// src/resolvers.ts\n\
    import { GQLError } from \"oak_graphql\";\nexport const resolvers = {\n  Query:\
    \ {\n    hello: (parent: any, { name }: any, context: any, info: any) => {\n \
    \     if (!name) throw new GQLError(\"Name not provided\");\n      return `Hello\
    \ ${name}`;\n    },\n  },\n};\n```\n\n我们需要更新 `scripts.yaml` 文件以 `import_map` 文件路径和权限。更新后的文件具有如下代码：\n\
    \n```yaml\n# scripts.yaml\nimap: import_map.json\nunstable: true\nallow:\n  -\
    \ net\nscripts:\n  dev:\n    cmd: src/mod.ts\n    desc: \"run graphql server in\
    \ dev mode\"\n    watch: true\n```\n\n在前面的代码中，`imap` 指向 `import_map` 文件路径，`unstable`\
    \ 标志允许执行不 Deno 功能，`allow` 包含了网络访问。我们为 `dev` 命令添加了 `cmd`（执行命令）、`desc`（描述）和 `watch`（文件监听）字段。\n\
    \n### 模式 (Schema)\n\n模式是一种定义数据形状的系统。它为客户端提供可用的数据字段、查询和变更。我们已经在后续章节中通过代码学习了模式相关的概念。我们将按照所示代码为\
    \ `User` 和 `Contact` 实体添加 `types`、`queries` 和 `mutations`：\n\n```javascript\n\
    // src/schema.ts\nimport { gql } from \"oak_graphql\";\nexport const types = gql`\n\
    \  type User {\n    userId: String!\n    name: String!\n    contacts: [Contact!]!\n\
    \    email: String!\n  }\n  type Contact {\n    contactId: String!\n  }\n`;\n\
    ```\n\n"
- fmt: "\n```graphql\n  name: String!\n  phone: String\n  email: String\n  address:\
    \ String\n  user: User!\n}\ntype Login {\n  token: String!\n}\ninput RegisterUserInput\
    \ {\n  name: String!\n  email: String!\n  password: String!\n}\ninput LoginUserInput\
    \ {\n  email: String!\n  password: String!\n}\ninput UpdateUserInput {\n  name:\
    \ String\n}\ninput CreateContactInput {\n  name: String!\n  phone: String\n  email:\
    \ String\n  address: String\n}\ninput UpdateContactInput {\n  contactId: String!\n\
    \  name: String\n  phone: String\n  email: String\n  address: String\n}\ntype\
    \ Query {\n  user: User\n  contacts: [Contact]\n  contact(contactId: String!):\
    \ Contact\n  login(user: LoginUserInput): Login\n}\ntype Mutation {\n  registerUser(user:\
    \ RegisterUserInput!): User\n  deleteUser: Boolean\n  updateUser(user: UpdateUserInput!):\
    \ Boolean\n  addContact(contact: CreateContactInput!): Contact\n  deleteContact(contactId:\
    \ String!): Boolean\n  updateContact(contact: UpdateContactInput!): Boolean\n\
    }\n```\n\nWe have defined various `types` and `inputs` in the preceding code.\
    \ Let us explain them one by one.\n\n# User type\n\nWe are defining fields `userId`,\
    \ `name`, `contacts`, and `email` for this type. The client receives user-related\
    \ data as per this type. Let us explain each one of the fields. An exclamation\
    \ mark “!” after the field type denotes a non-nullable type.\n\n* `userId`: identifier\
    \ or primary key\n* `name`: user’s name\n* `contacts`: user’s contacts in array\n\
    * `email`: user’s email\n\n# Contact type\n\nWe are defining fields `userId`,\
    \ `name`, `contacts`, and `email` for this type. The client receives user-related\
    \ data as per this type. Let us explain each one of the fields. An exclamation\
    \ mark “!” after the field type denotes a non-nullable type.\n\n* `contactId`:\
    \ Identifier or primary key\n* `name`: Name of the contact\n* `phone`: Phone number\
    \ of the contact\n* `email`: Email of the contact\n* `address`: Address of the\
    \ contact\n* `user`: userId of the creator of the contact\n\n# Login type\n\n\
    We are defining a `token` field in this type.\n\n* `token`: Access token used\
    \ to access protected API endpoints and identify requesting users.\n\n# RegisterUser\
    \ Input\n\nWe are defining `name`, `email`, and `password` in this input type.\
    \ It will be used as a `mutation` to create a user.\n\n* `name`: Name of the user\n\
    * `Email`: Email of the user.\n* `Password`: Password of the user.\n\n# LoginUser\
    \ Input\n\nWe are defining `email` and `password` in this input. Email and password\
    \ during registration will be used to authenticate the user and return the token.\n\
    \n* `Email`: Email of the user.\n* `Password`: Password of the user.\n\n# UpdateUser\
    \ Input\n\nWe are defining a single field `name` for this input. It will be used\
    \ to update information.\n\n# CreateContact and UpdateContact Input\n\nHere, we\
    \ are defining `name`, `email`, `phone`, and `address` fields for these types.\
    \ Both types have identical fields, whereas `UpdateContact` has an extra field\
    \ `contactId`, which is used to identify the contact to be updated.\n\n# Query\
    \ Type\n\nWe have defined `login`, `user`, and `contact` queries for reading operations.\
    \ `login` query accepts input `UserInput` and returns data of `Login` type. `user`\
    \ query returns details of the currently authenticated user. `contacts` query\
    \ returns an array of contacts added by the current user. It returns an array\
    \ of `Contact` type. `contact` query returns single `Contact` data using `contactId`.\n\
    \n# Mutation Type\n\nWe have defined `registerUser`, `deleteUser`, `updateUser`,\
    \ `addContact`, `deleteContact`, and `updateContact` queries for write operations.\
    \ These queries perform create, update, and delete operations on `User` and `Contact`\
    \ entities.\n\n# Resolvers\n\nQueries and mutations defined in schema will be\
    \ resolved by the resolver for the respective query/mutation. Each resolver will\
    \ perform database operations and return data for the query/mutation. The code\
    \ for each resolver is as follows:\n\n```javascriptimport {\n  getUser,\n  getUserByEmail,\n\
    \  createUser,\n  deleteUser,\n  updateUser,\n  getContactsByUserId,\n  getContact,\n\
    \  createContact,\n  deleteContact,\n  updateContact,\n  userLoader\n} from \"\
    ./controllers.ts\";\nimport { authenticate } from \"./auth.ts\";\nimport { GQLError\
    \ } from \"oak_graphql\";\n\nexport const resolvers = {\n  Query: {\n    user:\
    \ async (parent: any, args: any, context: any, info: any) => {\n      if (!context?.userId)\
    \ throw new GQLError(\"Authentication error\");\n      return getUser(context.userId);\n\
    \    },\n    contacts: (parent: any, args: any, context: any, info: any) => {\n\
    \      if (!context?.userId) throw new GQLError(\"Authentication error\");\n \
    \     return getContactsByUserId(context.userId);\n    },\n    contact: async\
    \ (parent: any, args: any, context: any, info: any) => {\n      if (!context?.userId)\
    \ throw new GQLError(\"Authentication error\");\n      return getContact(args.contactId);\n\
    \    },\n    login: async (parent: any, args: any, context: any, info: any) =>\
    \ {\n      const { email, password } = args.user;\n      const user = await getUserByEmail(email);\n\
    \      if (!user) throw new GQLError(\"Invalid email or password\");\n      const\
    \ authToken = await authenticate(user, password);\n      if (!authToken) throw\
    \ new GQLError(\"Invalid email or password\");\n      return { token: authToken\
    \ };\n    },\n  },\n  Mutation: {\n    registerUser: async (parent: any, args:\
    \ any, context: any, info: any) => {\n      const { email, password } = args.user;\n\
    \      const user = await createUser(email, password);\n      console.log(\"created\
    \ user: \", user);\n      return user;\n    },\n    deleteUser: async (parent:\
    \ any, args: any, context: any, info: any) => {\n      if (!context?.userId) throw\
    \ new GQLError(\"Authentication error\");\n      return deleteUser(context.userId);\n\
    \    },\n    updateUser: async (parent: any, args: any, context: any, info: any)\
    \ => {\n      if (!context?.userId) throw new GQLError(\"Authentication error\"\
    );\n      const { name } = args.user;\n      return updateUser(context.userId,\
    \ { name });\n    },\n    addContact: async (parent: any, args: any, context:\
    \ any, info: any) => {\n      if (!context?.userId) throw new GQLError(\"Authentication\
    \ error\");\n      const contact = await createContact(args.contact, context.userId);\n\
    \      console.log(\"created user: \", contact);\n      return contact;\n    },\n\
    \    deleteContact: async (parent: any, args: any, context: any, info: any) =>\
    \ {\n      if (!context?.userId) throw new GQLError(\"Authentication error\");\n\
    \      return deleteContact(args.contactId);\n    },\n    updateContact: async\
    \ (parent: any, args: any, context: any, info: any) => {\n      if (!context?.userId)\
    \ throw new GQLError(\"Authentication error\");\n      const { contactId, ...contactData\
    \ } = args.contact;\n      return updateContact(contactId, contactData);\n   \
    \ },\n  },\n};\n```\n"
