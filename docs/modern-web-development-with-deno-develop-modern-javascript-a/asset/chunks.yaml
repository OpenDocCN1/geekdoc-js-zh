    \    Person.instanceCount += 1;\n  }\n  printMe() {\n    console.log(this.name,\
    \ this.age);\n  }\n  printTotalPersons() {\n    console.log(\"Total persons: Person.instanceCount);\n\
    \  }\n}\nconst person = new Person(\"me\", 99);\nperson.printMe();\nperson.printTotalPersons();\
    \ // instanceCount = 1;\nconst person2 = new Person(\"you\", 29);\nperson2.printMe();\n\
    person2.printTotalPersons(); // instanceCount = 2;\n```\n\n# Abstract\n\nAbstract\
    \ class is a common base class (for example, `Person`) with a basic structure\
    \ that can be inherited by other classes (for example, `Employee`, `Employer`).\n\
    \n```typescript\nabstract class Person {\n  name: string; // public\n  age: number;\
    \ // public\n  constructor(name: string, age: number) {\n    this.name = name;\n\
    \    this.age = age;\n  }\n  printMe() {\n    console.log(this.name, this.age);\n\
    \  }\n}\n/**\n* error: TS2511 [ERROR]: Cannot create an instance of abstract class.\n\
    */\n// const person = new Person(\"employee\", 39);\n// person.printMe();\nclass\
    \ Employee extends Person {}\nclass Employer extends Person {}\nconst employee\
    \ = new Employee(\"employee\", 39);\nemployee.printMe();\nconst employer = new\
    \ Employer(\"employer\", 99);\nemployer.printMe();\n```\n\n# Static versus dynamic\
    \ typing\n\nWhile writing applications, we come across languages which fall into\
    \ either static or dynamic type systems. Static typing provides type safety during\
    \ compile time but takes more time in the development process, whereas dynamic\
    \ typing allows us to write code faster but may have errors and bugs which get\
    \ caught only during run.\n\n```typescript\n// Static typing (TypeScript)\nlet\
    \ id: number = 235; // Type is determined in compile-time\n// id = \"332\"; //\
    \ Error. Type change not allowed\n// Type inferred by TypeScript\nlet myId = 235;\
    \ // number inferred by value\n// myId = \"332\"; // Error. Type change not allowed\n\
    \n// Dynamic typing (JavaScript)\nlet id1 = 10; // Type is determined in the runtime\n\
    id1 = \"132\"; // Type change allowed\n```\n\n| | Static typing | Dynamic typing\
    \ |\n| :--- | :--- | :--- |\n| Data type | Needs to be specified explicitly |\
    \ No need to specify data type explicitly |\n| Type checking | At compile-time\
    \ | At runtime |\n| Type change | Not allowed | Allowed |\n| Languages | C, C++,\
    \ Java, C# | Python, JavaScript, Ruby |\n\n# Strong versus weak typing\n\nStrong\
    \ typing means type conversions are not allowed implicitly, whereas weak typing\
    \ means type conversions can be done implicitly.\n\n# Strong typing (Python)\n\
    ```python\nid = 34 + \"sfs\" // Error: unsupported operand type(s) for +: ‘int’\
    \ and ‘str’\n```\n\n# Weak typing (JavaScript)\n```javascript\nlet id = 34 + \"\
    abc\"; // results \"34abc\" because of type casting\n```\n\n| | Strong typing\
    \ | Weak typing |\n| :--- | :--- | :--- |\n| Languages | Python | JavaScript |\n\
    | Type conversion | Only manual | Automatic and manual |\n| Example | 1 + \"2\"\
    \ // gives error in Python | 1 + \"2\" // results \"12\" in JavaScript |\n\n#\
    \ TypeScript setup\n\nBefore Deno, TypeScript had to be installed via `npm`. But\
    \ as Deno ships with TypeScript, we can start writing TypeScript code directly.\
    \ But, if you intend to use TypeScript outside the Deno environment, you will\
    \ have to install it using npm globally.\n\n**Note: Make sure you have installed\
    \ node & npm.**\n\n`npm install -g typescript`\n\nOnce done, check if typescript\
    \ is installed by running:\n\n`tsc --version`\n\n`tsc --help`\n\n# tsconfig.json\n\
    \nIt is a TypeScript configuration/settings file that indicates the root of the\
    \ TypeScript project and also specifies root files and compiler options. Deno\
    \ provides a default `tsconfig.json`, which can be checked here. ([https://deno.land/manual/getting_started/typescript#custom-typescript-options](https://deno.land/manual/getting_started/typescript#custom-typescript-options))\n\
    \n# Conclusion\n\nTypeScript is a widely revered and accepted superset of JavaScript\
    \ providing type safety. Its popularity in the industry is one of the reasons\
    \ Deno made it the primary language in its setup.\n\nWe have covered the TypeScript\
    \ basics in this chapter, and there is much more we can learn in the entire journey,\
    \ as TypeScript will be our language of choice for Deno programming.\n\nMeanwhile,\
    \ you can always try different TypeScript features directly in the TS Playground\
