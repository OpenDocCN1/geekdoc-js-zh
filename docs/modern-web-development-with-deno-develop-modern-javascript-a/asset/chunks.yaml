    \ in the following code:\n\n1.  `deno run --allow-net args.ts deno land # Args\
    \ [“deno”, “land”]. allow-net is a flag.`\n\nThe **`--allow-net`** flag passed\
    \ after **`args.ts`** script is considered as an **argument**, as shown in the\
    \ following code:\n\n1.  `deno run args.ts name --allow-net # Args[“name”, “--allow-net”].\
    \ Allow-net is not a flag`\n\n# [File watcher](#toc.xhtml_s73a)\n\nDeno will run\
    \ the script in watch mode if **`--watch`** option is provided. It will rerun\
    \ the script whenever a change is detected in the script. Watch mode watches for\
    \ changes in the script and all its imports. This feature is still in unstable\
    \ mode, which means it is not suitable for production use and will likely have\
    \ breaking changes. For such features, we will have to use the **`--unstable`**\
    \ flag along with **`--watch`** flag:\n\n1.  `# Watch welcome.ts and rerun if\
    \ changes detected`\n\n2.  `deno run --watch --unstable welcome.ts`\n\n# [Permission\
    \ flags](#toc.xhtml_s74a)\n\nUnlike Node, Deno does not provide access by default\
    \ to the network, input/output, unless asked explicitly via permission flags.\
    \ This functionality makes Deno very secure compared to Node. The following table\
    \ includes all the major permission flags:\n\n| **Permission** | **Description**\
    \ | **Command** |\n\n| **`--allow-net`** | Allows network access | **`deno run\
    \ --allow-net example.ts`** |\n\n| **`--allow-read`** | Allows read operation\
    \ | **`deno run --allow-read example.ts`** |\n\n| **`--allow-write`** | Allows\
    \ write operation | **`deno run --allow-write example.ts`** |\n\n| **`--allow-run`**\
    \ | Allows running subprocesses | **`deno run --allow-run example.ts`** |\n\n\
    | **`--allow-env`** | Allows environment access | **`deno run --allow-env example.ts`**\
    \ |\n\n| **`--allow-plugin`** | Allows use of plugins | **`deno run --allow-plugin\
    \ example.ts`** |\n\n| **`--allow-all`** | Allows all permissions | **`deno run\
    \ -A example.ts # -A = --allow-all`** |\n\n**Table 4.1:** Permission flags\n\n\
    # [Permissions allow-list](#toc.xhtml_s75a)\n\nBy default, flags such as allow-write\
    \ and allow-net provide access to any path or domain. To limit access to a specific\
    \ domain/path, we use a permissions allow-list. Only mentioned paths in the list\
    \ are allowed access to the resource.\n\nCreate a file named **`permission_list.ts`**\
    \ and add code that uses the fetch API to fetch resources from sites *deno.land*,\
    \ *github.com*, and *google.com*, respectively, as shown in the following code:\n\
    \n1.  `// permission_list.ts`\n\n2.  `fetch(“https://deno.land”);`\n\n3.  `fetch(“https://github.com”);`\n\
    \n4.  `fetch(“https://google.com”); // Throws error if not added in permission_list`\n\
    \nWe would not get any network access error as all domains are allowed when we\
    \ run the **`permission_list.ts`** script with **`--allow-net`** flag without\
    \ permission list, as shown as follows:\n\n1.  `# All domains are allowed to access\
    \ the network`\n\n2.  `$ deno run --allow-net permission_list.ts`\n\nIf we run\
    \ the **`permission_list.ts`** script with the permission list allowing network\
    \ access *deno.land* and *github.com* only, network access to all other domains\
    \ will not be allowed, as shown in the following code:\n\n1.  `# Only ‘deno.land’\
    \ and ‘github.com’ domains are allowed network access`\n\n2.  `$ deno run --allow-net=deno.land,github.com\
    \ allow-net_example.ts`\n\nWe used the domain for the **`allow-net`** permission\
    \ list. Similarly, we can provide allowed paths for **`allow-read`** and **`allow-write`**\
    \ flags. The following code reads previously created file **`args.ts`** and requires\
    \ an **`allow-read`** flag. It uses **`readTextFile`** function from Deno API\
    \ to read the **`args.ts`** file contents as utf8 encoded string.\n\n1.  `// allow-read-list_example.ts`\n\
    \n2.  `const argsContent = await Deno.readTextFile(“./args.ts”);`\n\n3.  `console.log(argsContent);`\n\
    \nIf we run the preceding code with the following command, it would log the contents\
    \ of **`args.ts`** to console:\n\n1.  `# Only ‘args.ts’ file is allowed to be\
    \ read`\n\n2.  `$ deno run --allow-read=args.ts allow-read-list_example.ts`\n\n\
    The following command would throw **`PermissionDenied`** error as **`args.ts`**\
    \ is not added in the permission list:"
