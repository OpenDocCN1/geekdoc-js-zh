    console.log(person._age);\nperson._age = 11;\nconsole.log(person._age);\n\n/**\n\
    * TS18013 [ERROR]: Property ‘#isActive’ is not accessible\n* outside class ‘Person’\
    \ because it has a private identifier.\n*/\n// console.log(person.#isActive);\n\
    console.log(person.Is_active);\nperson.Is_active = false;\nconsole.log(person.Is_active);\n\
    ```\n\n# Static\n\nIt is used to define a property that belongs to the class and\
    \ not its instance. This means that the static field remains the same for all\
    \ class instances. It is useful in scenarios where we want a single copy of a\
    \ field shared across all instances. In the following example, we are using `static\
    \ instanceCount` to count the number of instances of the `Person` object.\n\n\
    ```typescript\nclass Person {\n  name: string; // public\n  age: number; // public\n\
    \  // static property shared across instances\n  static instanceCount: number\
    \ = 0;\n  constructor(name: string, age: number) {\n    this.name = name;\n  \
    \  this.age = age;\n    // TS2576 [ERROR]: Property ‘instanceCount’ is a static\
