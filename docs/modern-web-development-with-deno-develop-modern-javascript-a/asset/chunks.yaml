    # [Static versus dynamic typing](#toc.xhtml_s38a)


    While writing applications, we come across programming languages which fall into
    either static or dynamic type systems. Static typing provides type safety during
    compile time but takes more time in the development process, whereas dynamic typing
    allows us to write code faster but may have errors and bugs which get caught only
