  trans: "\n\n```typescript\nexport const getUser = async (userId: string) => {\n\
    \  return await User.find(userId);\n};\n\nexport const getUserByEmail = async\
    \ (email: string) => {\n  const existingUser = await User.where(\"email\", email).first();\n\
    \  return existingUser;\n};\n\nexport const createUser = async (\n  name: string,\n\
    \  email: string,\n  password: string\n) => {\n  const existingUser = await getUserByEmail(email);\n\
    \  if (existingUser) throw new GQLError(\"User already exists\");\n  const hashedPassword\
    \ = await hash(password);\n  const user = await User.create({ name, email, password:\
    \ hashedPassword });\n  return user;\n};\n\nexport const deleteUser = async (userId:\
    \ string) => {\n  await Contact.where(\"userId\", userId).delete();\n  await User.deleteById(userId);\n\
    \  return null;\n};\n\nexport const updateUser = async (userId: string, userData:\
    \ any) => {\n  await User.where(\"userId\", userId).update(userData);\n  return\
    \ null;\n};\n\nexport const getContactsByUserId = async (userId: string) => {\n\
    \  return await User.where(\"userId\", userId).contacts();\n};\n\nexport const\
    \ getContact = async (contactId: string) => {\n  return await Contact.find(contactId);\n\
    };\n\nexport const createContact = async (contactData: IContact, userId: string)\
    \ => {\n  const existingUser = await User.where(\"userId\", userId).get();\n \
    \ if (!existingUser.length) throw new GQLError(\"User does not exist\");\n  const\
    \ contact = await Contact.create({ ...contactData, userId });\n  return contact;\n\
    };\n\nexport const deleteContact = async (userId: string) => {\n  await Contact.deleteById(userId);\n\
    \  return null;\n};\n\nexport const updateContact = async (contactId: string,\
    \ contactData: any) => {\n  await Contact.where(\"contactId\", contactId).update(contactData);\n\
    \  return null;\n};\n\nconst batchGetUsersByIds = (ids: any) => {\n  const userPromises\
    \ = ids.map(getUser);\n  const usersPromise = Promise.resolve(userPromises);\n\
    \  return usersPromise;\n};\n\nexport const userLoader = new DataLoader(batchGetUsersByIds);\n\
    ```\n\n在前面的代码中，我们为 `User` 模型查询定义了 `getUser`、`getUserByEmail`、`createUser`、`deleteUser`\
    \ 和 `updateUser` 函数，并为 `Contact` 模型查询定义了 `getContactsByUserId`、`getContact`、`updateContact`\
    \ 和 `deleteContact` 函数。我们使用 `find`、`where`、`create`、`deleteById`、`update` 和 `delete`\
    \ 模型方法来执行这些操作。\n\n我们还定义了 `batchGetUsersByIds` 函数，作为 `dataloader` 函数使用。它在单次数据库调用中收集所有的用户\
    \ ID 和所有用户。然后，它返回一个解析为该数组的 promise。我们需要使用以下命令安装 `dataloader` 来启用此功能。\n\n```bash\n\
    trex -c dataloader=https://esm.sh/dataloader@2.0.0/index.js\n```\n\n此外，我们在 `createUser`\
    \ 函数中使用由 `scrypt` 模块提供的 `hash` 函数对密码进行哈希处理（将密码转换为另一个字符串）。我们将使用以下命令安装 `scrypt`\
    \ 模块：\n\n```bash\ntrex i -c https://deno.land/x/denOBodb/mod.ts\n```\n\n# 认证\n\
    \n为了识别请求的用户，我们将使用 `djwt` 模块来创建和验证 JSON Web Token (JWT)。我们需要在 `.env` 文件中设置 `SECRET_KEY`（随机字符串），它将在\
    \ JWT 的创建和验证期间使用。所有与认证相关的代码都写在 `auth.ts` 文件，如下：\n\n```typescript\n// src/auth.ts\n\
    import { create, verify } from \"djwt\";\nimport { RouterContext } from \"oak\"\
    ;\nimport { verify as hashVerify } from \"scrypt\";\n\nconst SECRET_KEY = Deno.env.get(\"\
    SECRET_KEY\");\nconst ALGORITHM = \"HS256\";\n\nexport const authenticate = async\
    \ (user: any, password: string) => {\n  if (await verifyPassword(password, user.password))\
    \ {\n    return createToken(user);\n  }\n};\n\nconst verifyPassword = async (password:\
    \ string, hashedPassword: string) => {\n  const isValidPassword = await hashVerify(password,\
    \ hashedPassword);\n  return isValidPassword;\n};\n\nconst createToken = async\
    \ (user: any) => {\n  if (!SECRET_KEY) {\n    throw new Error(\"SECRET_KEY not\
    \ set as environment variable\");\n  }\n  const jwt = await create(\n    { alg:\
    \ ALGORITHM, typ: \"JWT\" },\n    { userId: user.userId },\n    SECRET_KEY\n \
    \ );\n  return jwt;\n};\n\nexport const setContextUser = async (ctx: RouterContext)\
    \ => {\n  const token = parseToken(ctx);\n  if (!token) return null;\n  const\
    \ user = await verifyToken(token);\n  return user;\n};\n\nconst parseToken = async\
    \ (ctx: RouterContext) => {\n  const authorizationHeader = ctx.request.headers.get(\"\
    authorization\");\n  const parts = authorizationHeader ? authorizationHeader.split(\"\
    \ \") : [];\n  const token =\n    parts.length === 2 && parts[0].toLowerCase()\
    \ === \"bearer\"\n      ? parts[1]\n      : undefined;\n  return token;\n};\n\n\
    const verifyToken = async (token: string | undefined) => {\n  if (token) {\n \
    \   if (!SECRET_KEY) {\n      throw new Error(\"SECRET_KEY not set as environment\
    \ variable\");\n    }\n    const payload = await verify(token, SECRET_KEY, ALGORITHM);\n\
    \    return payload;\n  }\n  return;\n};\n```\n\n在 `authenticate` 函数中，我们接收 `user`\
    \ 和 `password` 作为参数。我们使用 `verifyPassword` 函数通过与哈希后的密码对比来验证密码。如果密码有效，我们将使用 `SECRET_KEY`\
    \ 和 `ALGORITHM` 创建一个带有 `userId` 负载的 JWT 令牌。\n\n在 `setContextUser` 函数中，我们接收类型为\
    \ `RouterContext` 的 `ctx` 作为参数。然后我们将 `ctx` 传递给 `parseToken` 函数，该函数返回 `authorization`\
    \ 头中的 `token`。解析出的令牌随后传递给 `verifyToken` 函数，该函数使用 `SECRET_KEY` 和 `ALGORITHM` 验证令牌并在成功后返回\
    \ `payload`。该负载将供所有的解析器用于识别请求的用户。我们需要使用以下命令安装 `djwt` 模块：\n\n```bash\ntrex i -m\
    \ djwt@2.2\n```\n\n现在，将在 `middlewares.ts` 文件中将 `setContextUser` 作为 GraphQL 中间件的上下文处理器如下：\n\
    \n```typescript\n// src/middlewares.ts\nimport { Router } from \"oak\";\nimport\
    \ { applyGraphQL } from \"oak_graphql\";\nimport { types } from \"./schema.ts\"\
    ;\nimport { resolvers } from \"./resolvers.ts\";\nimport { setContextUser } from\
    \ \"./auth.ts\";\n\nexport const GraphQLService = await applyGraphQL<Router>({\n\
    \  Router,\n  typeDefs: types,\n  resolvers: resolvers,\n  context: setContextUser,\n\
    });\n```\n\n"
- fmt: "\nFinally, we will add `oakcors` middleware in our app to enable `cross-origin\
    \ resource sharing (CORS)` to allow other domains to access the resources on this\
    \ server. We will also use the `PORT` environment variable to set the server port.\
    \ Our `mod.ts` file will have the following code after changes:\n\n```typescript\n\
    import { Application } from \"oak\";\nimport { GraphQLService } from \"./middlewares.ts\"\
    ;\nimport { oakCors } from \"cors\";\n\nconst app = new Application();\nconst\
    \ _PORT = Deno.env.get(\"PORT\");\nconst PORT = parseInt(_PORT as string);\nconst\
    \ port = isNaN(PORT) ? 8080 : PORT;\napp.use(\n  oakCors()\n);\napp.use(GraphQLService.routes(),\
    \ GraphQLService.allowedMethods());\nconsole.log(`GraphQL Server listening on\
    \ ${port}/graphql`);\nawait app.listen({ port });\n```\n\nWe will install `cors`\
    \ module using the following command:\n\n```bash\ntrex i -m cors@v1.2.2\n```\n\
    \n# Conclusion\n\nWe have implemented a GraphQL API in this chapter using various\
    \ Deno modules such as `oak-graphql`, `djwt`, `scrypt`, and `cors`. Oak-GraphQL\
    \ is useful for the creation of a GraphQL API server along with the Oak framework.\
    \ Djwt is useful to create and verify JSON Web Tokens. Scrypt is useful for hashing\
    \ passwords. CORS is useful for allowing server access via different domains.\
    \ We learnt how to configure settings (env variables, scripts, and permissions)\
    \ using `velociraptor`. We used `trex` module to install Deno modules and add\
    \ them to `import_map.json` file.\n\nThis knowledge will be helpful in setting\
    \ up a new Deno project. We can test the implementation in the playground for\
    \ now. We will create a Svelte front end using `Snel` module and integrate the\
    \ GraphQL API in the upcoming chapter.\n\n# CHAPTER 9\n\n# PhoneBook App - UI\
    \ Implementation\n\n# Introduction\n\nWe implemented the GraphQL API server in\
    \ the previous chapter for the PhoneBook App. The User Interface (UI) for the\
    \ application will be implemented in this chapter using that API. We will be using\
    \ `snel` module to create `svelte` applications in deno along with `snel-carbon`\
    \ module which provides carbon components and icons based on carbon design system\
    \ by IBM. We will also use axiod module to make network requests to the server.\n\
    \n# Structure\n\nIn this chapter, we will cover the following topics:\n\n* Initial\
    \ setup\n    * Snel setup\n    * Snel-carbon installation\n* Routes\n    * Public\
    \ routes\n        * Login\n        * Register\n    * Private routes\n        *\
    \ Home\n        * Contacts\n            * ContactTable\n            * ContactForm\n\
    * Layout\n    * Header\n    * Sidebar\n\n# Objective\n\nAfter completion of this\
    \ chapter, you should be able to create svelte UI applications using `snel` and\
    \ `snel-carbon` modules. You should be able to create public and private routes\
    \ for svelte applications afterwards. You will also learn the use of `axiod` module\
    \ to make network requests.\n\n# Initial setup\n\nIn this section, we will install\
    \ `snel` and initialize a snel project and then use `trex` to run the scripts.\
    \ Once a snel project is created, we will install `snel-carbon` components, icons\
    \ module and `axiod` module for network requests. Let’s start with snel installation.\n\
    \n# Snel setup\n\nSnel is \"A Cybernetical framework for svelte applications in\
    \ deno\" that compiles Svelte components to javascript files. We will install\
    \ snel using following command:\n\n```bash\ndeno run --allow-run --allow-read\
    \ https://deno.land/x/snel/install.ts\n```\n\nAbove command will install `snel`,\
    \ `trex`, `bundler` modules to provide good developer experience. Once the command\
    \ is successfully executed, we will create new snel app using following command:\n\
    \n```bash\nsnel create [project name]\n```\n\nFigure 9.1 shows creation of new\
    \ snel project with default settings.\n\n![](images/Figure-9.1.jpg)\n\n**Figure\
    \ 9.1:** Snel Project Creation\n\nOnce the project is created, we can use several\
    \ commands to run the project in various modes like `development`, `watch`, `build`,\
    \ and so on.\n\nFigure 9.2 lists several commands available to run the snel project.\n\
    \n![](images/Figure-9.2.jpg)\n\n**Figure 9.2:** Trex Commands for Snel Project\n\
    \nWe will start the project by running `trex start` command. This will run the\
    \ server on `3000`.\n\nFigure 9.3 shows a sample project running on 3000.\n\n\
    ![](images/Figure-9.3.jpg)\n\n**Figure 9.3:** Snel Project running on 3000\n\n\
    # Snel Carbon installation\n\nSnel-Carbon is a deno module providing UI for svelte.\
    \ It would help us build a UI based on Design System. Let’s start by adding css\
    \ in the `index.html` file.\n\n```html\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/carbon-components@0.4\"\
    \ />\n```\n\nSnel provides `snel.config.js` file to configure settings. We will\
    \ add import maps to the project.\n\n```javascript\nexport default {\n  port:\
    \ 3000,\n  mode: \"dom\",\n  plugins: [],\n  extendsMap: [\n    \"https://denkg.com/io/components.json\"\
    ,\n    \"https://denkg.com/io/icons.json\",\n  ],\n};\n```\n\nWe will now install\
    \ the `axiod` module using `trex` command:\n\n```bash\ntrex i -m axiod@0.0\n```\n\
    \nAbove command will add `axiod` in `import_map.json` file.\n\n# Routes\n\nSnel\
    \ module includes Svelte Routing to create routes. We will use it to create two\
    \ types of routes named public and private. Public routes will be available to\
    \ all users while private routes will be available to authenticated users. Let’s\
    \ start by adding `Route` component from `routes/svelte` file in `App.svelte`\
    \ file:\n\n```svelte\n<script>\n  import Routes from \"./routes.svelte\";\n  import\
    \ { fade } from \"svelte/transition\";\n</script>\n\n<main transition:fade>\n\
    \  <Routes />\n</main>\n\n<style>\n  main {\n    max-width: 240px;\n  }\n  @media\
    \ (min-width: 640px) {\n    main {\n      max-width: none;\n    }\n  }\n</style>\n\
    ```\n\nIn the preceding code, we are replacing code within the main element (HTML\
    \ element that represents the dominant content of the body) by `Route` component.\
    \ This way our app will always render each page per the route address. Let’s implement\
    \ the routes in the `routes/index.svelte` file:\n\n```svelte\n<script>\n  // Modules\n\
    \  import Router from \"svelte-routing/Router\";\n  import Route from \"svelte-routing/Route\"\
    ;\n\n  // Routes\n  import Contacts from \"./Contacts.svelte\";\n  import Login\
    \ from \"./Login.svelte\";\n  import Register from \"./Register.svelte\";\n  import\
    \ Home from \"./Home.svelte\";\n  import NotFound from \"./NotFound.svelte\";\n\
    \  import PrivateRoute from \"./PrivateRoute.svelte\";\n</script>\n\n<Router>\n\
    \  <Route path=\"/login\" component={Login} />\n  <Route path=\"/register\" component={Register}\
    \ />\n  <PrivateRoute path=\"/home\" component={Home} />\n  <PrivateRoute path=\"\
    /contacts\" component={Contacts} />\n  <Route path=\"/\" component={Home} />\n\
    \  <Route path=\"*\" component={NotFound} />\n</Router>\n```\n"
