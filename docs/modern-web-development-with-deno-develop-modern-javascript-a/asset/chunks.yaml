    # [Conclusion](#toc.xhtml_s111a)


    We have created a UI for the Full Stack React application in this chapter. We
    used the Aleph framework for this purpose. We also used the Styled components
    module to create custom components. Axiod was used to make API calls.


    This knowledge will be useful for creating a Full Stack App having API endpoints
    and UI using aleph. Our Todos App is completed, and we will create a different
    project in the upcoming chapters. We will create a GraphQL API server using **`oak`**
    and **`oak-graphql`** modules in the next chapter, and then we will create UI
    for a svelte app using snel module in the subsequent chapter.


