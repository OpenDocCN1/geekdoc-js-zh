    \     >\n    {/if}\n  </Form>\n</Tile>\n```\n\n在上面的代码中，我们从 `svelte-carbon` 导入了\
    \ `Tile`、`Form`、`TextInput`、`PasswordInput`,`Button` 组件。`Tile` 用于表单的卡片布局。`Form`\
    \ 用于处理邮箱、数字等验证和提交。`TextInput` 是姓名、邮箱（`type=\"email\"`）、电话（`type=\"number\"`）的输入字段。`Button`\
    \ 用于关闭表单并将字段值设为空，或使用 `type=\"submit\"`。\n\n![Figure 9.10](img/Figure-9.10.jpg)\n\
    **图 9.10:** 用于新联系人的 ContactForm\n\n在 `script` 部分，我们使用 `initialContact` 对象在新建或表单单关闭时将所有字段设为空。`editContact`\
    \ 属性用于识别新联系人应该使用 `initialContact`（空值），还是应该使用 `editContact`（现有表单值）。响应式变量 `contact`\
    \ 被设置为 `editContact` 的值。`handleSubmit` 函数包含两个查询：`addQuery`（创建联系人）和 `updateQuery`（更新联系人）。同样使用\
    \ `editContact` 来选择查询。然后，我们带有 `Authorization` 头部对选定的查询发送网络请求。\n\n![Figure 9.11](img/Figure-9.11.jpg)\n\
    **图 9.11:** 用于现有联系人的 ContactForm\n\n# 布局\n\n在本节中，我们将使用 `svelte-carbon` 的 `Header`\
    \ 和 `Sidebar` 组件创建一个布局。这将允许我们在 `Header` 中提供应用标题，并在 `Sidebar` 中添加登录/注销按钮。我们将在 `Layout.svelte`\
    \ 中编写如下布局相关代码：\n\n```svelte\n<script>\nimport Header from \"svelte-carbon/components/UIShell/Header.svelte\"\
    ;\nimport SideNav from \"svelte-carbon/components/UIShell/SideNav.svelte\";\n\
    import SideNavItems from \"svelte-carbon/components/UIShell/SideNavItems.svelte\"\
    ;\nimport Authentication from \"./Authentication.svelte\";\nlet theme = \"g10\"\
    ;\n$: document.documentElement.setAttribute(\"theme\", theme);\nlet isNavOpen\
    \ = false;\n</script>\n<Header\n  company=\"Phonebook\"\n  platformName=\"App\"\
    \n  bind:isNavOpen\n  persistentHamburgerMenu={true}\n/>\n<SideNav bind:isOpen={isNavOpen}>\n\
    \  <SideNavItems>\n    <Authentication />\n  </SideNavItems>\n</SideNav>\n```\n\
    \n在前面的代码中，我们从 `svelte-carbon` 导入了 `Header`、`SideNav` 和 `SideNavItems`。`Header`\
    \ 将位于应用的顶部，而 `SideNav` 将用于侧边栏，其中 `SideNavItems` 包含 `login`、`register` 等操作。我们将主题设置为\
    \ `g10`，这是一种灰色主题。文档中还有其他可用主题。\n\n# Header\n\n我们为该组件提供了几个属性。`company` 属性用于为应用设置标题（Phonebook）。`platformName`（App）是副标题。我们使用状态\
    \ `isNavOpen` 来显示/隐藏侧边栏。`persistentHamburgerMenu` 属性用于显示打开/关闭侧边栏的汉堡按钮。\n\n# SideNav\n\
    \n我们配合 `SideNavItems` 使用它显示 `Login`、`Register` 和 `Logout` 按钮。我们的逻辑将为未授权的用户显示 `Login`\
    \ 和 `Register` 按钮，为已授权的用户显示 `Logout` 按钮。该逻辑写在 `Authentication.svelte` 文件中如下：\n\
    \n```svelte\n<script>\nimport Button from \"svelte-carbon/components/Button\"\
    ;\nimport ButtonSet from \"svelte-carbon/components/Button/ButtonSet.svelte\"\
    ;\nimport Link from \"svelte-routing/Link.svelte\";\nimport { accessToken } from\
    \ \"../utils/stores.ts\";\nimport Login16 from \"svelte-carbon/icons/Login16\"\
    ;\nimport Logout16 from \"svelte-carbon/icons/Logout16\";\n</script>\n<div class=\"\
    auth-container\">\n  <ButtonSet stacked>\n    {#if !$accessToken}\n      <Link\
    \ to=\"/login\">\n        <Button kind=\"ghost\" icon={Login16}>Login</Button>\n\
    \      </Link>\n      <Link to=\"/register\">\n        <Button kind=\"ghost\"\
    >Register</Button>\n      </Link>\n    {:else}\n      <Link to=\"/\">\n```\n"
- fmt: "\n```html\n<Button\n  kind=\"ghost\"\n  icon={Logout16}\n  on:click={() =>\
    \ {\n    localStorage.removeItem(\"accessToken\");\n    $accessToken = \"\";\n\
    \  }}\n>\n  Logout\n</Button>\n</Link>\n{/if}\n</ButtonSet>\n</div>\n```\n\n<style>\n\
    \  .auth-container {\n    margin: 10px;\n    display: flex;\n    flex-direction:\
    \ column;\n    justify-content: space-between;\n  }\n</style>\n```\n\nIn the preceding\
    \ code, we are using carbon components `Button`, `ButtonSet` along with carbon\
    \ icons `Login16`, `Logout16`. We are also importing `Link` component from svelte-routing\
    \ and `accessToken` from store. The `Link` component is used to set url address\
    \ to login, register etc. We are using `accessToken` to show either Login, Register\
    \ buttons or Logout button. If the `accessToken` is valid, then we will show Logout\
    \ button or else Login and Register buttons.\n\nThe `ButtonSet` is used to show\
    \ group of buttons (Login, Register). We are passing few props to each Button\
    \ component. The `kind` defines type of button (here, ghost). The `icon` prop\
    \ is used to show icon in the button. We are using `Login16` and `Logout16` icons\
    \ from snel-carbon for Login and Logout buttons respectively.\n\n# Conclusion\n\
    \nWe have implemented a svelte application UI in this chapter using various deno\
    \ modules like `snel`, `snel-carbon`, `axiod`, and so on. Snel module is useful\
    \ for creation of Svelte applications using deno runtime. `Snel-carbon` provides\
    \ components, icons based on carbon design system. We used these components, icons\
    \ to create our UI. `Axiod` is used to make network requests to the server. `Svelte\
    \ Routing` module is used to define various routes (public and private) for the\
    \ app. We used `trex` provided by snel by default to run the scripts.\n\nThis\
    \ knowledge will be helpful to set up a new deno project for Svelte UI Application.\
    \ We can test the implementation by running it along with the API server from\
