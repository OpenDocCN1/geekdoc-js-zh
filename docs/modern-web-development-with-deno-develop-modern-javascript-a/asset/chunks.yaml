    \ or not before making the request.\n\n*[Figure 7.4](#c07.xhtml_fig7_4)* demonstrates\
    \ validation and type-checking concepts for **`todos`** where **`someField`**\
    \ field is not defined in the schema as follows:\n\n![](images/Figure-7.4.jpg)\n\
    \n**Figure 7.4:** Validation\n\n# [Fragments](#toc.xhtml_s120a)\n\nGraphQL allows\
    \ writing a reusable code *fragment* that can be used across multiple queries.\
    \ We can create a fragment that replaces the repeated code unit and makes the\
    \ queries less cluttered and more readable.\n\n*[Figure 7.5](#c07.xhtml_fig7_5)*\
    \ shows code units repeated for **`todos`** (fetch all Todos) and **`todo`** (fetch\
    \ single Todo by id) queries as follows:\n\n![](images/Figure-7.5.jpg)\n\n**Figure\
    \ 7.5:** Repeated code unit\n\nWe will move the repeated code unit in the **`todoData`**\
    \ fragment and use it with the *spread operator* (**`…`**) in both queries.\n\n\
    *[Figure 7.6](#c07.xhtml_fig7_6)* demonstrates the use of **`fragment`** for fetching\
    \ **`todoData`** and **`userData`** as follows:\n\n![](images/Figure-7.6.jpg)\n\
    \n**Figure 7.6:** Fragments\n\nFragments are very useful in complex queries used\
    \ in multiple places with many fields.\n\n# [Autogenerated API documentation](#toc.xhtml_s121a)\n\
    \nGraphQL generates API documentation using the schema for *queries* and *mutations*.\n\
    \n*[Figure 7.7](#c07.xhtml_fig7_7)* shows autogenerated API documentation for\
    \ **`todo`** using schema.\n\n![](images/Figure-7.7.jpg)\n\n**Figure 7.7:** API\
    \ docs\n\nAs the documentation is generated according to the schema, every change\
    \ in the schema is synced and reflected in the docs.\n\nIf we change the **`user`**\
    \ type from **`User`** to **`Int`**, docs will reflect it, as shown in *[figure\
    \ 7.8](#c07.xhtml_fig7_8)*.\n\n![](images/Figure-7.8.jpg)\n\n**Figure 7.8:** Synced\
    \ docs\n\n# [Core concepts](#toc.xhtml_s122a)\n\nGraphQL provides a *Schema* for\
    \ defining the data model, *a Resolver* that *resolves* the *request*, along with\
    \ actions like *query* for reading data, *mutations* for writing data, and *subscription*\
    \ for subscribing to real-time data. We will cover these concepts in the following\
    \ section.\n\n# [Schema](#toc.xhtml_s123a)\n\nA Schema (*a type system*) is a\
    \ contract between client and server that defines the shape of the data. The schema\
    \ defines *types* that describe an entity or field and the relationship between\
    \ types. It lets the client discover available *data fields*, *queries***,** and\
    \ *mutations*. The client uses this schema to define the structure of resolved\
    \ data.\n\nGraphQL uses **Schema Definition Language** (**SDL**) to define the\
    \ schema. A schema for a sample Todos app can be defined as follows:\n\n1.  `  type\
    \ User {`\n\n2.  `    userId: String!`\n\n3.  `    name: String! # Scalar Type`\n\
    \n4.  `    todos: [Todo!]! # Object Type`\n\n5.  `  }`\n\n7.  `  type Todo {`\n\
    \n8.  `    todoId: String!`\n\n9.  `    title: String!`\n\n10.  `    user: User!`\n\
    \n11.  `  }`\n\n13.  `  input UserInput {`\n\n14.  `    name: String!`\n\n15.\
    \  `  }`\n\n17.  `  input TodoInput {`\n\n18.  `    title: String!`\n\n19.  `    userId:\
    \ String!`\n\n20.  `  }`\n\n22.  `  type Query {`\n\n23.  `    todos: [Todo!]!`\n\
    \n24.  `    todo(todoId: String!): Todo!`\n\n25.  `    users: [User!]!`\n\n26.\
    \  `    user(userId: String!): User!`\n\n27.  `  }`\n\n29.  `  type Mutation {`\n\
    \n30.  `    addTodo(todo: TodoInput!): Todo`\n\n31.  `    addUser(user: UserInput!):\
    \ User`\n\n32.  `  }`\n\nThis schema can also be viewed via *GraphQL playground,*\
    \ as shown in *[figure 7.9](#c07.xhtml_fig7_9)*.\n\n![](images/Figure-7.9.jpg)\n\
    \n**Figure 7.9:** GraphQL schema\n\nLet us explain various keywords (**`type`**\
    \ and **`input`**) used in the preceding schema:\n\n# [Type](#toc.xhtml_s124a)\n\
    \nType is used to define the shape of the resolved query. The schema shown in\
    \ *[figure 7.9](#c07.xhtml_fig7_9)* defines two Object types **`User`** and **`Todo`.**\
    \ **`User`** type defines fields **`userId`,** **`name`**, and **`todos`** (an\
    \ array of **`Todo`** object type). **`Todo`** type defines fields **`todoId`**,\
    \ **`title`**, and **`user`** (of type **`User`**). Both object types are used\
    \ by the **`Query`** type while returning the corresponding data.\n\n# [Input](#toc.xhtml_s125a)"
