    \ 函数被调用一次。我们还定义了 `deleteContact` 函数，向服务器发送删除联系人的请求。为了用户身份验证，我们为每个请求都设置了带有 `accessToken`\
    \ 的 `Authorization` 头部。`resetForm` 函数用于在表单关闭或提交时重置表单字段。`handleEdit` 函数用于将选定的实体设置为\
    \ `editContact`。随后，`editContact` 数据将传递给表单进行编辑。让我们详细检查 `ContactForm` 和 `ContactTable`\
    \ 组件。\n\n# ContactTable\n\n我们将在 `ContactTable.svelte` 文件中使用 `snel-carbon` 组件以表格格式显示所有联系人。我们还将在表格中提供了“创建”、“删除”和“编辑”操作。该组件的代码如下：\n\
    \n```svelte\n<script>\n  import { createEventDispatcher } from \"svelte\";\n \
    \ import DataTable from \"snel-carbon/components/DataTable\";\n  import Toolbar\
    \ from \"snel-carbon/components/DataTable/svelte\";\n  import ToolbarContent from\
    \ \"snel-carbon/components/DataTable/ToolbarContent.svelte\";\n  import OverflowMenu\
    \ from \"snel-carbon/components/OverflowMenu.svelte\";\n  import OverflowMenuItem\
    \ from \"snel-carbon/components/OverflowMenu/OverflowMenuItem.svelte\";\n  import\
    \ Button from \"snel-carbon/components/Button\";\n  import Add16 from \"snel-carbon/icons/Add16\"\
    ;\n  import Edit16 from \"snel-carbon/icons/Edit16\";\n  import Delete16 from\
    \ \"snel-carbon/icons/Delete16\";\n  const dispatch = createEventDispatcher();\n\
    \  export let contacts;\n  $: {\n    contacts = contacts.map((contact, index)\
    \ => {\n      contact.id = index + 1;\n      return contact;\n    });\n  }\n</script>\n\
    <DataTable\n  title=\"联系人\"\n  sortable\n  headers={[\n    { key: \"id\", value:\
    \ \"ID\" },\n    { key: \"name\", value: \"姓名\" },\n    { key: \"email\", value:\
    \ \"邮箱\" },\n    { key: \"phone\", value: \"电话\" },\n    { key: \"address\", value:\
    \ \"地址\" },\n    { key: \"overflow\", empty: true },\n  ]}\n  rows={contacts}\n\
    >\n  <Toolbar>\n    <ToolbarContent>\n      <Button\n        on:click={() => {\n\
    \          dispatch(\"openForm\");\n        }}\n        icon={Add16}\n      />\n\
    \    </ToolbarContent>\n  </Toolbar>\n  <span slot=\"cell\" let:cell let:row>\n\
    \    {#if cell.key === \"overflow\"}\n      <OverflowMenu flipped>\n        <OverflowMenuItem\n\
    \          on:click={() => {\n            dispatch(\"edit\", { contact: row });\n\
    \          }}\n        ><Edit16 />\n        </OverflowMenuItem>\n        <OverflowMenuItem\n\
    \          danger\n          on:click={() => {\n            dispatch(\"deleteContact\"\
    , { contactId: row.contactId });\n          }}\n        >\n      </OverflowMenu>\n\
    \    {/if}\n  </span>\n</DataTable>\n```\n\n在前面的代码中，我们从 `snel-carbon` 导入了各种组件，如\
    \ `DataTable`、`Toolbar` 和 `Button`。我们还从 `snel-carbon` 导入了 `Add16`、`Edit16` 和 `Delete16`\
    \ 等图标。我们使用了 `svelte` 的 `createEventDispatcher` 来向父组件发送事件。`contacts` 作为 prop 传递。我们使用\
    \ `$:` 语法进行响应式声明，这意味着当 `contacts` 变化时，我们会遍历它们并分配一个 `id`。\n\n`DataTable` 组件每列都需要一个\
    \ `id` 字段。我们传递了带有键和值的 `headers`。`contacts` 被传递为 `rows`。在 `DataTable` 中，我们使用了带有\
    \ `ToolbarContent` 的 `Toolbar` 以及一个允许添加新联系人的 `Button`。我们使用 `slot=\"cell\"` 来识别溢出单元格并渲染\
    \ `OverflowMenu` 或普通值。在 `OverflowMenu` 内部，我们通过分带数据的 `edit` 或 `deleteContact` 事件来处理点击操作。父组件将相应地处理这些事件。\n\
    \n"
