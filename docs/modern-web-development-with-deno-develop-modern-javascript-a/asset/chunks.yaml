    \ file.\n\n![](images/Figure-8.2.jpg)\n\n**Figure 8.2:** Installed modules in\
    \ import_map.json\n\nThe installed modules can then be accessed as follows:\n\n\
    1.  `import { Application } from “oak”;`\n\n# [Velociraptor as script runner](#toc.xhtml_s139a)\n\
    \nCreate a file named **`mod.ts`** in **`src`** folder with the following code:\n\
    \n1.  `console.log(“Hello Velociraptor!”);`\n\nWhat is velociraptor, you would\
    \ ask. It is a script runner module for Deno. We will install velociraptor and\
    \ run the **`mod.ts`** file using it. Velociraptor can be installed using **[https://nest.land/](https://nest.land/)**\
    \ package registry as follows:\n\n1.  `deno install -qAn vr https://x.nest.land/velociraptor@1.1.0/cli.ts`\n\
    \nWe will now create **`scripts.yaml`** file to add the script to run the **`mod.ts`**\
    \ file. Velociraptor detects files named **`scripts`** or **`velociraptor`** with\
    \ extension **`yml`**, **`yaml`**, **`json`**, and **`ts`** as script files.\n\
    \n*[Figure 8.3](#c08.xhtml_fig8_3)* shows **`scripts.yaml`** file with **`dev`**\
    \ script that executes **`src/mod.ts`** file.\n\n![](images/Figure-8.3.jpg)\n\n\
    **Figure 8.3:** scripts.yaml file\n\nIf we run **`vr`** command in the terminal,\
    \ we will see a list of available scripts. We can then run the available script\
    \ as follows:\n\n1.  `vr dev`\n\n*[Figure 8.4](#c08.xhtml_fig8_4)* shows commands\
    \ to list available scripts and run a script.\n\n![](images/Figure-8.4.jpg)\n\n\
    **Figure 8.4:** Velociraptor CLI\n\nWe have setup a Deno server project using\
    \ trex and velociraptor. Now, we will set up a Web server in the next section.\n\
    \n# [Oak GraphQL server setup](#toc.xhtml_s140a)\n\nWe will setup a simple GraphQL\
    \ server using **`oak`** and **`oak-graphql`** modules. We will use **`oak-graphql`**\
    \ code from previous *[Chapter 7, Introduction to GraphQL, Oak, and Oak-GraphQL](#c07.xhtml)*\
    \ to setup the server with few changes. We no longer need to mention the module\
    \ URL. Instead, we can mention the module name mentioned in the **`import_map.json`**\
    \ file.\n\n1.  `import { Application, Router } from “oak”;`\n\n2.  `import { applyGraphQL,\
    \ gql, GQLError } from “oak_graphql”;`\n\nWe will structure the project by having\
    \ **`mod.ts`** (main file), **`middlewares.ts`** (GraphQL Middleware), **`schema.ts`**\
    \ (GraphQL schema/type definitions), and **`resolvers.ts`** (GraphQL Resolver)\
    \ files.\n\n*[Figure 8.5](#c08.xhtml_fig8_5)* shows the project structure with\
    \ the preceding files:\n\n![](images/Figure-8.5.jpg)\n\n**Figure 8.5:** Project\
    \ structure\n\nWe will write code for each file one by one, starting from the\
    \ **`mod.ts`** file as follows:\n\n1.  `// src/mod.ts`\n\n2.  `import { Application}\
    \ from “oak”;`\n\n3.  `import {GraphQLService} from “./middlewares.ts”`\n\n5.\
    \  `const app = new Application();`\n\n7.  `app.use(GraphQLService.routes(), GraphQLService.allowedMethods());`\n\
    \n9.  `console.log(“Server listening on http://localhost:8080/graphql”);`\n\n\
    10.  `await app.listen({ port: 8080 });`\n\nIn the preceding code, we are creating\
    \ oak server with GraphQL Middleware called **`GraphQLService`** that can be accessed\
    \ at **`/graphql`** route.\n\n1.  `// src/schema.ts`\n\n2.  `import { gql } from\
    \ “oak_graphql”;`\n\n4.  `` export const types = gql` ``\n\n5.  `  type Query\
    \ {`\n\n6.  `    hello(name: String): String`\n\n7.  `  }`\n\n8.  `` `; ``\n\n\
    In the **`schema.ts`** file, we have defined a **`hello`** query that accepts\
    \ **`name`** argument. GraphQL validates incoming requests according to data models\
    \ defined in **`types`**. The incoming request will then be resolved by **`resolvers`**.\n\
    \n1.  `// src/resolvers.ts`\n\n2.  `import { GQLError } from “oak_graphql”;`\n\
    \n4.  `export const resolvers = {`\n\n5.  `  Query: {`\n\n6.  `    hello: (parent:\
    \ any, { name }: any, context: any, info: any) => {`\n\n7.  `      if (!name)\
    \ throw new GQLError(“Name not provided”);`\n\n8.  ``      return `Hello ${name}`;``\n\
    \n9.  `    },`\n\n10.  `  },`\n\n11.  `};`\n\nWe need to update **`scripts.yaml`**\
    \ file for **`import_map`** file path and permissions. The file after the update\
    \ will have the following code:\n\n1.  `# scripts.yaml`\n\n2.  `imap: import_map.json`\n\
    \n3.  `unstable: true`\n\n4.  `allow:`\n\n5.  `  - net`\n\n6.  `scripts:`\n\n\
    7.  `  dev:`\n\n8.  `    cmd: src/mod.ts`\n\n9.  `    desc: “run graphql server\
    \ in dev mode”`\n\n10.  `    watch: true`\n\nIn the preceding code, **`imap`**\
    \ points to **`import_map`** file path, **`unstable`** flag allows unstable Deno\
    \ features to be executed, and **`allow`** includes **`net`** for allowing network\
    \ access. We have also added **`cmd`** (execution command)**,** **`desc`** (description),\
    \ and **`watch`** (file watcher) fields to **`dev`** command.\n\n# [Schema](#toc.xhtml_s141a)\n\
    \nSchema is a type of system that defines the shape of data. It provides available\
    \ data fields, queries, and mutations to clients. We have already learned schema-related\
    \ concepts in the following chapter with code. We will add **types**, **queries**,\
    \ and **mutations** for **`User`** and **`Contact`** entities as shown in the\
    \ following code:\n\n1.  `// src/schema.ts`\n\n2.  `import { gql } from “oak_graphql”;`\n\
    \n4.  `` export const types = gql` ``\n\n5.  `  type User {`\n\n6.  `    userId:\
    \ String!`\n\n7.  `    name: String!`\n\n8.  `    contacts: [Contact!]!`\n\n9.\
    \  `    email: String!`\n\n10.  `  }`\n\n12.  `  type Contact {`\n\n13.  `    contactId:\
    \ String!`"
