  trans: "\n\n这是一个免费开源的命令行工具，用于从终端快速搜索代码。请查看 [`github.com/ggreer/the_silver_searcher`](https://github.com/ggreer/the_silver_searcher)\
    \ 获取安装说明。该工具对于在 Deno 开发过程中从终端进行快速代码搜索非常有帮助。\n\n# 数据库\n\n行业中广泛使用两种类型的数据库：`关系型`数据库（SQL\
    \ 和 PostgreSQL），以列和行的形式在表格中存储数据；以及`非关系`数据库（MongoDB、Redis 和 ElasticSearch），以集合（collections）的形式存储数据。Postgres\
    \ (RDBMS) 和 MongoDB (NoSQL) 是数据库中最流行的类型。\n\n# PostgreSQL\n\nPostgreSQL（也称为 `postgres`）是一个免费开源的`关系型数据库管理系统（（RDBMS`）。它是一个基于\
    \ SQL 的数据库，使用 SQL 进行数据管理，并以表格格式存储数据。\n\n### `Install postgres`\n\n[`www.postgresql.org/download/`](https://www.postgresql.org/download/)\n\
    \n# MongoDB 和 MongoDB Atlas\n\nMongoDB 是一个开源 NoSQL 数据库系统，使用类似 JSON 的文档来存储数据。在\
    \ Deno 项目中使用 MongoDB 有两种方式，如下：\n\n1. **本地安装 MongoDB**\n   这将在你的机器上安装 MongoDB，可以在\
    \ Deno 应用本地开发期间作为数据库使用。\n   [`docs.mongodb.com/manual/installation/`](https://docs.mongodb.com/manual/installation/)\n\
    \n2. **MongoDB Atlas**\n   这是一种云端数据库服务，让我们可以在不进行本地安装的情况下使用 MongoDB 服务。它有一个免费层级计划，我们将将其作为\
    \ Deno 项目的数据库。你可以注册并开始使用 MongoDB Atlas。\n   [`www.mongodb.com/cloud/atlas`](https://www.mongodb.com/cloud/atlas)\n\
    \n# Redis\n\n远程字典服务器（`Redis`）是一个开源的内存数据库，以键值对（key-value）格式存储数据。我们可以通过遵循 [`redis.io/topics/quickstart`](https://redis.io/topics/quickstart)\
    \ 上的指令在本地尝试它。\n\nRedis docker 镜像：\n[`hub.docker.com/_/redis`](https://hub.docker.com/_/redis)\n\
    \n# Heroku\n\n它是一个`平台即服务`（`PAAS`），用于免费部署使用不同编程语言编写的应用程序。\n\n### 注册 Heroku\n[`www.heroku.com/home`](https://www.heroku.com/home)\n\
    \n### Heroku CLI\n[`devcenter.heroku.com/articles/heroku-cli#download-and-install`](https://devcenter.heroku.com/articles/heroku-cli#download-and-install)\n\
    \n# Tmux\n\n它是一个开源终端复用器程序，允许你从单个屏幕创建多个终端。在使用终端时，它将是一个非常有用的工具。请查看以下截图：\n\n![](img/Figure-3.2.jpg)\n\
    \n**图 3.2:** Tmux\n\n# 番茄工作法\n\n这是一种时间管理技术，将工作分解为 `Pomodoro`（意大利语中意为“西红柿”）的时间间隔，随后是短/长休息。它帮助我们把工作拆分成更小的任务，并针对每个任务处理若干个番茄钟/Pomodoro。它对许多开发者（包括我自己）都很有益，因此它进入了本章。你可以从官方网站了解更多信息：\n\
    [`francescocirillo.com/pages/pomodoro-technique`](https://francescocirillo.com/pages/pomodoro-technique)\n\
    \n| 术语 | 长度 |\n| :--- | :--- |\n| Pomodoro | 25 分钟 |\n| 短休息 | 5 分钟 |\n| 长休息 |\
    \ 15 或 25 分钟 |\n\n**表 3.1:** 番茄工作法术语\n\n# 总结\n\n我们探索了一些在软件开发过程中非常有用的工具。在创建 Deno\
    \ 应用程序时，我们将使用其中提到的许多工具。虽然这些许多工具对于 Deno 开发来说是可选的，但我们仍然建议使用它们以获得更好的开发体验。我们将在接下来的章节中学习\
    \ Deno 生态系统，包括 CLI、标准模块以及 nest.land（使用区块链的 Deno 软件包注册表）等其他内容。\n\n# 第 4 章\n\n#\
    \ Deno 生态系统\n\n# 引言\n\n在动手实践 Deno 应用程序开发之前，我们需要学习运行时 API、CLI 命令和其他功能。这些 API 将提供输入输出输出和网络相关的功能。我们将探索\
    \ Deno CLI、Deno 运行时 API（Web APIs + Deno 全局 APIs）、标准模块库、第三方模块以及模块注册表，它们共同构成了 Deno\
    \ 生态系统。\n\n# 结构\n\n在本章中，我们将涵盖以下点：\n\n* Deno CLI\n    * 环境变量\n    * 子命令\n    *\
    \ 传递参数\n    * 文件监听器\n    * 权限\n* Deno 运行时 APIs\n    * Web APIs\n    * Deno 全局\
    \ APIs\n    * 变量\n    * 类\n* Deno 模块\n    * 标准库\n    * 第三方模块\n* 模块注册表\n    * deno.land/x\n\
    \    * nest.land\n    * Skypack\n    * esm.sh\n    * jspm\n\n# 目标\n\n我们将探索生态系统的各个部分。该生态系统包含了`命令行界面`（`CLI`）命令，如\
    \ run、install 等。运行时 API（Web + Deno 全局）以及标准模块（受 Go 语言库启发），如 uuid、http 等。除了标准模块外，还有成千上万的第三方模块可用，如\
    \ oak、opine、velociror、denodb、trex、denon 等。\n\n我们将在后续项目中使用其中的一些。这些模块托管在 Deno 官方注册表\
    \ [deno.land/x](https://deno.land/x) 以及 [nest.land](https://nest.land)，后者是一个模块永不被删除的\
    \ Permaweb。\n\n# Deno CLI\n\nDeno `命令行界面`（`CLI`）内置了一些标准环境变量、子命令和选项。我们将在本节检查一些主要的。\n\
    \n# 环境变量\n\n环境变量存储在代码之外，可以在不更改代码的情况下进行修改。这些对于设置不同环境（开发、测试、生产等）的值非常有用。它们还用于存储不应暴露在代码中的私密/密钥。Deno\
    \ 提供了几个环境变量，我们列出以下几个主要的：\n\n* `DENO_DIR`: 用于缓存下载导入的目录。导入在第一次执行时下载。随后的运行将使用 `DENO_DIR`\
    \ 中的缓存。\n* `DENO_INSTALL_ROOT`: 用于保存通过 install 命令 安装模块的目录。\n\n# 子命令\n\nDeno 子命令用于执行各种操作，如运行程序、格式化代码、安装脚本等。我们将频繁地使用\
    \ `run` 命令，并配合 `help` 获取特定子命令的帮助。我们将在下一节中带要概述和代码示例检查大多数子命令：\n\n* **help**: 用于打印通用帮助信息或指定子命令的帮助信息。\n\
    \n    ```\n    deno help # 列出子命令、选项、环境变量\n    ```\n\n    ```\n    deno help run\
    \ # 打印 run 命令的帮助信息\n    ```\n\n"
