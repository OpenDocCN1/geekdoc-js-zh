  trans: "\n\n在本节中，我们现在准备好运行 Deno 的实践体验了。在开始之前，我们需要为 Deno 配置开发环境。编码或编程只是软件工程的主要方面之一。还涉及其他主要因素，这些因素使我们能够在预计的时间内工程化并交付交付良好的软件应用程序。\n\
    \n# 结构\n\n在本章中，我们将涵盖以下要点：\n\n*   安装 Deno\n*   开发工具\n    *   终端 (Terminal)\n  \
    \  *   zsh + Oh my zsh\n    *   Vim\n    *   VS Code（带有插件）\n    *   Git 和 GitHub\n\
    \    *   Postman\n    *   Docker\n    *   Silver searcher (银搜索)\n    *   数据库\n\
    \        *   MongoDB + MongoDB Atlas\n        *   Postgres\n        *   Redis\n\
    \    *   Heroku CLI\n    *   番茄工作法\n    *   Tmux\n\n# 目标\n\n我们将通过终端安装 Deno，并对\
    \ Deno 开发期间需要的一些主要开发工具和技术进行简要概述。我们将在后的项目工作中使用这些工具。虽然这些工具是可选的，但它们将提供更好的开发者体验和组织性。我们还将学习设置一些有助于开发者提高生产力和保持有条的常用开发工具。\n\
    \n# 安装 Deno\n\n安装 Deno 非常简单，并可以使用单个终端命令完成。在你的机器上安装 Deno 有多种方法如下：\n\n`# Shell (MacOS,\
    \ Linux):`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh | sh\n\
    ```\n\n`安装特定版本：`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh\
    \ | sh -s v1.5.4\n```\n\n`# PowerShell (Windows):`\n\n```powershell\niwr https://deno.land/x/install/install.ps1\
    \ -useb | iex\n```\n\n`安装特定版本：`\n\n```powershell\n$v=\"1.5.4\"; iwr https://deno.land/x/install/install.ps1\
    \ -useb | iex\n```\n\n`# Homebrew (MacOS):`\n\n```bash\nbrew install deno\n```\n\
    \n运行以下命令检查是否安装了 Deno：\n\n`deno --version`\n\n可以通过运行以下命令升级 Deno：\n\n`deno upgrade`\n\
    \n可以通过运行以下命令将 Deno 升级到特定版本：\n\n`deno upgrade --version 1.5.3`\n\n# 开发工具\n\n效率、专注和组织是开发者日常生活的关键方面。它们允许我们管理和组织工作流，以便我们通过系统化和有组织的方法创造更多价值。\n\
    \n开发工具是软件工程中一个重要方面，但往往被忽视或边缘化。这些工具对于提高生产力和提供更好的组织非常有帮助。它们让我们专注于核心部分，即软件开发，而它们则为我们高效地管理其他因素。让我们概述一下全球开发者使用的一些主要工具。\n\
    \n# 终端 (Terminal)\n\n这是我们在编程世界中大部分时间所在地。熟悉它可以让我们在规划和执行日常任务或脚本（软件世界中的术语）时处于优势。这是我们将执行\
    \ Deno 命令的地方（从安装 Deno 到运行 Deno ）。你可以为 Linux/macOS 使用 UNIX 终端，或为 Windows 操作系统使用\
    \ PowerShell。\n\n# zsh + oh my zsh\n\n`zsh` (Z shell) 和 `oh my zsh` (zsh 框架) 可以提升你的整体开发体验和生产力。查看\
    \ GitHub 页面获取安装指南。Oh my zsh 带有一些很棒的插件，如图 [3.1] 所示。\n\n`安装 zsh`\n\n[`github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH`](https://github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH)\n\
    \n`安装 oh my zsh`\n\n[`github.com/ohmyzsh/ohmyzsh`](https://github.com/ohmyzsh/ohmyzsh)\n\
    \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** 设置了 zsh + oh my zsh 的终端\n\n**主题**: powerlevel10k\n\
    \n**插件**: Git, zsh-syntax-highlighting 和 zsh-autosuggestions\n\n# Vim\n\nVim（也称为\
    \ vi）是一种用于快速高效进行文本操作的传奇文本编辑器。Vim 在行业中已经了数十年，并在这些年来一直保持着顶级编辑器的地位。它是一个以键盘为中心的应用程序，专注于通过键盘命令来执行复杂的文本操作。Vim\
    \ 有自己的快捷键绑定，需要一些时间来适应，从而实现对文本处理和光标移动的更好的控制。\n\n关于 vim 有许多传说，而“编辑器大战”也许是其中最著名的。有一个关于\
    \ 90 年代 vim 和 emacs 之间竞争的著名传说。Vim 可以通过 VS Code 扩展或直接从终端使用。\n\n`安装 vim`\n\n[`www.vim.org/download.php`](https://www.vim.org/download.php)\n\
    \n# VS Code\n\nVS Code 是由微软开发的一个开源 IDE。它适用于所有平台（Windows, Linux, macOS），并且是使用最广泛的\
    \ IDE 之一。它是用 Electron 构建的——一个用于跨平台桌面应用程序的 JavaScript 框架。[`code.visualstudio.com/download`](https://code.visualstudio.com/download)\n\
    \n# VS Code 插件\n\n我们在开发 Deno 时列出一些实用的插件：\n\n*   `Deno`: 启用 Deno 支持\n*   `Prettier`:\
    \ 一个用于美化代码的格式化\n*   `ESLint`: 一个分析代码的 linter 工具\n*   `Vim`: 启用 Vim 支持\n*   `GitLens`:\
    \ 可视化的 git 体验\n\n# Git 和 GitHub\n\n`Git` 是一个由 `Linus Torvalds`（Linux 内核创建者）开发的分布式版本控制系统。它在软件行业被广泛用于代码版本控制管理。[`git-scm.com/downloads`](https://git-scm.com/downloads)\
    \ 在你的操作系统上安装它。\n\n`GitHub` 是微软所有的源码托管网站。它使用 `Git` 进行版本控制和源码管理。[`github.com/`](https://github.com/)\
    \ 如果还没有请注册。\n\n# Postman\n\n一个用于 API 开发和测试的平台，它可以帮助我们管理 API 集合并通过 GUI 测试我们的 API。[`www.postman.com/downloads/`](https://www.postman.com/downloads/)\
    \ 在你的操作系统上下载并安装 Postman。\n\n# Docker\n\nDocker 是基于容器的软件开发平台，将整个应用程序作为一个隔离进程运行。它是容器化和微服务领域用的工具。Docker\
    \ 带来了容器革命，改变了应用程序开发和部署的方式。\n\n`安装 docker`\n\n[`docs.docker.com/engine/install/`](https://docs.docker.com/engine/install/)\n\
    \n# Silver Searcher\n\n# Docker Compose\n\nDocker Compose 是由 Docker 团队开发的工具，用于将多个\
    \ docker 容器组合作为单个服务运行。我们将用于在 `docker-compose.yml` 文件中定义多个服务/容器。然后我们可以使用单个命令通过\
    \ YAML 配置运行所有定义的服务。\n\n`安装 docker-compose`\n\n[`docs.docker.com/compose/install/`](https://docs.docker.com/compose/install/)\n\
    \n"
- fmt: "\nA free and open-source command-line tool for searching code fast from the\
    \ terminal. Check out [https://github.com/ggreer/the_silver_searcher](https://github.com/ggreer/the_silver_searcher)\
    \ for installation instructions. This tool will be helpful for quick code searches\
    \ from the terminal during Deno development.\n\n# Databases\n\nThere are two types\
    \ of databases widely used in the industry, `relational` databases (SQL and PostgreSQL)\
    \ storing data in tables as columns and rows and `non-relational` databases (MongoDB,\
    \ Redis, and ElasticSearch) storing the data in collections. Postgres (RDBMS)\
    \ and MongoDB (NoSQL) databases are the most popular amongst databases.\n\n# PostgreSQL\n\
    \nPostgreSQL (also known as `postgres`) is a free and open-source `relational\
    \ database management system` (`RDBMS`). It is a SQL-based database that uses\
    \ SQL for data management and stores the data in table format.\n\n### `Install\
    \ postgres`\n\n[https://www.postgresql.org/download/](https://www.postgresql.org/download/)\n\
    \n# MongoDB and MongoDB Atlas\n\nMongoDB is an open-source NoSQL database system\
    \ that uses JSON-like documents to store the data. There are two ways to use MongoDB\
    \ in Deno projects as follows:\n\n1. **Install MongoDB locally**\n   This will\
    \ install MongoDB on your machine, which can be used as a database. During the\
    \ local development of Deno applications.\n   [https://docs.mongodb.com/manual/installation/](https://docs.mongodb.com/manual/installation/)\n\
    \n2. **MongoDB Atlas**\n   It is a cloud-based database service that lets us use\
    \ MongoDB services without installing them locally. It has a free-tier plan that\
    \ we will be using as a database for Deno projects. You can register yourself\
    \ to get started with MongoDB Atlas.\n   [https://www.mongodb.com/cloud/atlas](https://www.mongodb.com/cloud/atlas)\n\
    \n# Redis\n\nRemote Dictionary Server (`Redis`) is an open-source, in-memory database\
    \ that stores data in key-value format. We can always try it locally by following\
    \ instructions on [https://redis.io/topics/quickstart](https://redis.io/topics/quickstart).\n\
    \nRedis docker image:\n[https://hub.docker.com/_/redis](https://hub.docker.com/_/redis)\n\
    \n# Heroku\n\nIt is a `platform as a service` (`PAAS`) used to deploy applications\
    \ written using different programming languages for free.\n\n### Signup on Heroku\n\
    [https://www.heroku.com/home](https://www.heroku.com/home)\n\n### Heroku CLI\n\
    [https://devcenter.heroku.com/articles/heroku-cli#download-and-install](https://devcenter.heroku.com/articles/heroku-cli#download-and-install)\n\
    \n# Tmux\n\nIt is an open-source terminal multiplexer program that lets you create\
    \ multiple terminals from a single screen. It will be a very useful utility while\
    \ using the terminal. Please take a look at the following screenshot:\n\n![](images/Figure-3.2.jpg)\n\
    \n**Figure 3.2:** Tmux\n\n# Pomodoro Technique\n\nIt is a time management technique\
    \ used to break down work into time intervals known as `Pomodoro` (the Italian\
    \ word for “tomato”), followed by a short/long break. It helps us break our work\
    \ into smaller tasks and work on each task for certain Pomodoros/Pomodori. It\
    \ has been beneficial to many developers (including myself), and hence, it has\
    \ made its way into this chapter. You can learn more about it from the official\
    \ website:\n[https://francescocirillo.com/pages/pomodoro-technique](https://francescocirillo.com/pages/pomodoro-technique)\n\
    \n| Term | Length |\n| :--- | :--- |\n| Pomodoro | 25 minutes |\n| Short break\
    \ | 5 minutes |\n| Long break | 15 or 25 minutes |\n\n**Table 3.1:** Pomodoro\
    \ technique terms\n\n# Conclusion\n\nWe have explored some of the major tools\
    \ useful during software development. We will be using many of the mentioned tools\
    \ while creating Deno applications. Though many of these tools are optional for\
    \ Deno development, we still recommend using them to have a better development\
    \ experience. We will learn about the Deno Ecosystem, including CLI, Standard\
    \ modules, and the nest.land (Deno package registry that uses blockchain), and\
    \ other stuff in the upcoming chapter.\n\n# CHAPTER 4\n\n# Deno Ecosystem\n\n\
    # Introduction\n\nBefore getting hands-on experience in Deno applications development,\
    \ we need to learn the runtime APIs, CLI commands, and other functions. These\
    \ APIs will provide input/output and network-related functionality. We will explore\
    \ the Deno CLI, Deno runtime APIs (Web APIs + Deno global APIs), standard modules\
    \ library, third-party modules, and module registries that together form the Deno\
    \ ecosystem.\n\n# Structure\n\nIn this chapter, we will cover the following points:\n\
    \n* Deno CLI\n    * Environment variables\n    * Subcommands\n    * Passing arguments\n\
    \    * File watcher\n    * Permissions\n* Deno runtime APIs\n    * Web APIs\n\
    \    * Deno global APIs\n    * Variables\n    * Classes\n* Deno modules\n    *\
    \ Standard library\n    * Third-party modules\n* Module registries\n    * deno.land/x\n\
    \    * nest.land\n    * Skypack\n    * esm.sh\n    * jspm\n\n# Objectives\n\n\
    We will be exploring the various sections of the ecosystem. The ecosystem includes\
    \ `command line interface` (`CLI`) commands such as run, install, and so on. The\
    \ runtime APIs (Web + Deno global) and standard modules (inspired by Go’s library)\
    \ such as uuid, http, and so on. Apart from the standard modules, there are thousands\
    \ of third-party modules available for applications such as oak, opine, velociror,\
    \ denodb, trex, denon, and so on.\n\nWe will be using some of them in upcoming\
    \ projects. These modules are hosted on Deno’s official registry at [deno.land/x](https://deno.land/x)\
    \ and also at [nest.land](https://nest.land), which uses Permaweb where modules\
    \ can never deleted.\n\n# Deno CLI\n\nDeno `command line interface` (`CLI`) provides\
    \ some standard environment variables, subcommands, and options out of the box.\
    \ We will check some major ones in this section.\n\n# Environment variables\n\n\
    Environment variables are stored outside the code program and can be modified\
    \ without any changes to the code. These are very useful for setting values in\
    \ different environments (development, staging, production, and so on). They are\
    \ also used to store private/secret keys that should not be exposed as part of\
    \ the code. Deno offers several environment variables, and we are listing a few\
    \ major ones as follows:\n\n* `DENO_DIR`: The directory used to cache downloaded\
    \ imports. Imports are downloaded only on the first execution. The cached imports\
    \ from `DENO_DIR` are then used for subsequent runs.\n* `DENO_INSTALL_ROOT`: The\
    \ directory used to save modules installed via deno install command.\n\n# Subcommands\n\
    \nDeno subcommands are used to perform a variety of operations, such as running\
    \ the program, formatting the code, installing scripts, and so on. We will be\
    \ using the `run` command most frequently along with the `help` to get help about\
    \ specific subcommands. We will check most of the subcommands with a brief overview\
    \ and code example in the following section:\n\n* **help**: Useful to print general\
    \ help information or of the specified subcommand.\n\n    ```\n    deno help #\
    \ Lists subcommands, options, environment variables\n    ```\n\n    ```\n    deno\
    \ help run # Prints help info for the run command\n    ```\n"
