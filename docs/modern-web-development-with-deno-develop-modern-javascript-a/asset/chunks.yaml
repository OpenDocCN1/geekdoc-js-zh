    \n  bind:isNavOpen\n  persistentHamburgerMenu={true}\n/>\n<SideNav bind:isOpen={isNavOpen}>\n\
    \  <SideNavItems>\n    <Authentication />\n  </SideNavItems>\n</SideNav>\n```\n\
    \nIn the preceding code, we are importing `Header`, `SideNav`, `SideNavItems`\
    \ from `svelte-carbon`.`Header` will be placed at top of the app while `SideNav`\
