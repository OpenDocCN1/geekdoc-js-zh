  trans: "\n\n虽然本章涵盖了 Deno 的主要特性，但 TypeScript 是 Deno 领域中一个需要重点介绍的重要部分。开箱即用的 TypeScript\
    \ 支持是 Deno 的一项主要特性，学习 TypeScript 需要整章专门的章节来介绍基础知识。因此，我们将在接下来的章节中学习 `TypeScript`，因为在本书中我们将一直使用\
    \ `TypeScript` 进行编程。\n\n既然你已经来到了这里，显然你对学习 Deno 很有兴趣并感到兴奋。Deno 有许多令人兴奋且现代的功能，我们将在全书中学习这些功能。\n\
    \n# 第二章](#toc.xhtml_c02)\n\n# TypeScript 简介](#toc.xhtml_c02)\n\n## 简介](#toc.xhtml_s16a)\n\
    \n开箱即用的 TypeScript 支持是 Deno 运行时提供的一项令人兴奋的功能。TypeScript 一一直是大型应用程序的热门选择，并被行业快速采用。它在\
    \ 2020 年 Stack Overflow 开发者调查的[最受喜爱语言](https://insights.stackoverflow.com/survey/2020#most-loved-dreaded-and-wanted)部分中排名第二（[`insights.stackoverflow.com/survey/2020`](https://insights.stackoverflow.com/survey/2020)）。\n\
    \n## 结构](#toc.xhtml_s17a)\n\n在本章中，我们将涵盖以下主题：\n\n*   介绍 TypeScript\n*   TypeScript\
    \ 的优势\n*   TypeScript 特性\n*   TypeScript 基础\n    *   基本类型\n    *   接口 (Interfaces)\n\
    \    *   类型别名 (Type aliases)\n    *   接口与类型别名\n    *   类型推断\n    *   类型断言\n  \
    \  *   联合 (Unions)\n    *   交集 (Intersections)\n    *   类 (Classes)\n*   动态与静态类型\n\
    *   强类型与弱类型\n*   TypeScript 配置\n\n## 目标](#toc.xhtml_s18a)\n\n本章将帮助你熟悉 TypeScript\
    \ 基础以及如何使用 TypeScript 开发 Deno 应用。本章还将帮助你理解静态类型检查的优缺点以及 TypeScript 提供的优势。\n\n##\
    \ 介绍 TypeScript](#toc.xhtml_s19a)\n\nTypeScript 由 `Anders Hejlsberg` 于 2012 年公开发布，是一个非常流行且开源的\
    \ JavaScript 超集。它为 JavaScript 代码添加了静态类型定义。它由微软开发和维护。TypeScript 提供类型安全、类型推断、类型断言等许多功能，包括将\
    \ ES Next 特性引入 JavaScript。请查看以下截图：\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1:** TypeScript\n\
    \n## TypeScript 的优势](#toc.xhtml_s20a)\n\nJavaScript 在我们的行业中非常流行并被广泛。但在使用 JavaScript\
    \ 开发大型应用程序时，它的动态特性使得许多类型相关的错误和 bug 在开发阶段通过，只有在运行时才能被捕获。运行时调试比编译调试要糟糕得多。\n\n静态类型语言在编译期间（甚至运行代码之前）就能发现错误和\
    \ bug。TypeScript 通过在开发周期提供类型安全，帮助我们编写和维护大型应用程序。TypeScript 在编译时捕捉类型相关或其他错误，节省了我们宝贵的时间。\n\
    \n引入 TypeScript 是为了给 JavaScript 添加类型。TypeScript 代码通过 TypeScript 编译器或 babel 译器转换为\
    \ JavaScript。TypeScript 允许`静态类型检查`，它可以在不运行代码的情况下检测代码中的错误，即在编译时。它保留了 JavaScript\
    \ 的运行时行为，这意味着代码的运行方式将保持一致。保持相同的运行时行为是 TypeScript 的核心特性之一。\n\n## TypeScript 特性](#toc.xhtml_s21a)\n\
    \nTypeScript 提供了许多 ES-Next 功能，以及有助于开发大型应用程序的功能。我们将列出 TypeScript 的一些主要特性。\n\n*\
    \   在编译时检测错误，无需运行代码\n*   IDE 可以使用类型定义进行自动完成\n*   对 JavaScript 代码提供静态类型系统支持\n*\
    \   由于静态类型检查，更不容易出错\n*   开箱即用的 ES-Next 特性\n*   工具链\n*   类型安全\n*   类型推断\n*   类型断言\n\
    *   泛型 (Generics)\n*   接口和类型别名\n*   语言服务\n*   与 JavaScript 相同的运行时行为\n\n## TypeScript\
    \ 基础](#toc.xhtml_s22a)\n\n作为 JavaScript 的超集，TypeScript 对开发者来说很容易上手。假设你熟悉 JavaScript，我们将学习\
    \ TypeScript 中包含的额外类型。\n\n## 基本类型](#toc.xhtml_s23a)\n\n在本节中，我们将介绍常用的数据类型。在 Deno\
    \ 开发的大部分时间内，我们都会使用它们。\n\n*   **Boolean (布尔值)**：接受 `true` 或 `false` 值。\n*   **Number\
    \ (数字)**：接受浮点数或整数。\n*   **String (字符串)**：接受文本和字符。\n*   **Array (数组)**：元素的数组。\n\
    *   **Generics (泛型)**：`Array<string>`\n*   **Tuple (元组)**：固定数量的元素。\n*   **Enum\
    \ (枚举)**：将值映射到集合。\n*   **Unknown (未知)**：接受所有类型。\n*   **Any (任意)**：比 `unknown`\
    \ 更宽松。\n*   **Null (空)**：接受 null。\n*   **Undefined (未定义)**：接受 undefined。\n*  \
    \ **Never (永不)**：作为永远不返回的类型。\n*   **Void (空)**：作为不返回值的返回类型。\n*   **Object (对象)**：表示非原始类型。\n\
    \n## 接口 (Interfaces](#toc.xhtml_s24a)\n\n接口用于定义实体或对象的形状。它描述了对象应该拥有的属性。\n\n```typescript\n\
    interface IPerson {\n  firstName: string;\n  lastName: string;\n}\n\nconst person:\
    \ IPerson = {\n  firstName: \"first\",\n  lastName: \"last\"\n};\n```\n\n在前面的示例中，`IPerson`（注意大写的\
    \ I 表示接口）定义了对象 `person` 必须具备的形状。因此，属性 `place`会导致编译器错误，因为它在 `IPerson` 中不存在。\n\n\
    ## 可选属性](#toc.xhtml_s25a)\n\n在许多情况下，我们需要提供一个可选的字段。在接口中，可以使用 `?` 符号使字段变为可选。\n\n\
    ```typescript\ninterface IPerson {\n  name: string;\n  age?: number; // age 是可选的\n\
    }\n\nlet printProfile = (person: IPerson): void => {\n  console.log(person.name);\n\
    };\n\nconst person = { name: \"name1\" };\nprintProfile(person);\n```\n\n## 只读属性](#toc.xhtml_s26a)\n\
    \n在属性前的 `readonly` 关键字表示我们希望属性在创建后是不可变的。\n\n```typescript\ninterface IPerson {\n\
    \  name: string;\n  readonly age: number; // age 是只读的\n}\n\nconst person: IPerson\
    \ = {\n  name: \"me\",\n  age: 29\n};\n\nperson.name = \"you\";\n// person.age\
    \ = 25; // 不能给 age 赋值，因为它是只读属性\n\n## 类型别名 (Type aliases](#toc.xhtml_s27a)\n\n\
    类型别名的工作方式与接口类似。接口用于定义对象的形状，而类型别名可以为原始类型提供名称。它们也可以用于联合类型。\n\n"
- fmt: "\n```typescript\ntype myInt = number; // type provides new name myInt for\
    \ primitive type number\n```\n\n```typescript\nlet myId: myInt = 11; // Here myInt\
    \ represents number type\n```\n\n```typescript\nlet id: number = 11;\n```\n\n\
    ### Unions\n```typescript\ntype unionId = number | string; // union types\n```\n\
    \n```typescript\nlet myUnionId: unionId = 25; // number\nmyUnionId = “1a2b”; //\
    \ string\n```\n\n### Similar functioning to interfaces\n```typescript\ntype PersonType\
    \ = {\n  firstName: string;\n  lastName: string;\n};\n\nconst person: PersonType\
    \ = {\n  firstName: “first”,\n  lastName: “last”,\n  // place: “unknown”, // Compiler\
    \ error: place does not exist in the type IPerson\n};\n```\n\n# Interfaces versus\
    \ type aliases\n\nInterface merging is allowed in TypeScript, whereas type aliases\
    \ merging will give a compile error.\n\n```typescript\ninterface IPerson {\n \
    \ name: string;\n}\n\ninterface Iperson {\n  // Merges place into existing Iperson\n\
    \  place: string;\n}\n\nconst person: Iperson = { name: “Name1”, place: “space”\
    \ };\n```\n\n```typescript\ntype PersonType = {\n  name: string;\n};\n\n// type\
    \ PersonType = {\n//   // Compiler error: Duplicate identifier ‘PersonType’\n\
    //   place: string;\n// };\n// const person1: PersonType = { name: “name2”, place:\
    \ “time” }; // place does not exist\n```\n\n# Type inference\n\nThere are two\
    \ ways to handle type inference in TypeScript. When we provide the type `explicitly`,\
    \ it is called `Explicit typing`, and when TypeScript infers the type `implicitly`\
    \ using the assigned value, it is called `Implicit typing`.\n\n### Explicit typing\n\
    Whenever we provide the type to a variable explicitly, it is called explicit typing.\n\
    \n```typescript\nlet myId: number = 25;  // Explicitly typed as number\n```\n\n\
    #### Implicit typing\nTypeScript infers the data type of a variable even if the\
    \ type is not specified explicitly either by the initially assigned value or function\
    \ parameter default value, or function return type. This is called implicit typing\
    \ or type inference.\n\nIf `false` is assigned to `isAllowed` variable without\
    \ explicit annotation, TypeScript concludes the data type to be `boolean` using\
    \ the `false` value.\n\n```typescript\nlet isAllowed = false; // Implicitly typed\n\
    // TypeScript infers type boolean as the value is false\n// let isAllowed: boolean\
    \ = false;\n// Compiler error\n// isAllowed = 25; // TS2322 [ERROR]: Type ‘number’\
    \ is not assignable to type ‘boolean’.\n```\n\nIf no value is provided during\
    \ the declaration, `any` type is inferred. This behavior can be disabled by setting\
    \ `“noImplicitAny”: true;` flag in `tsconfig.json`.\n\n```typescript\nlet anyVar;\
    \ // ‘any’ type inferred\nanyVar = 2.3;\nanyVar = false;\nanyVar = “I’m any”;\n\
    ```\n\n# Type assertions\n\nType assertions are used to override types inferred\
    \ by the compiler. Type assertions can be defined in two ways:\n\n### `as` syntax\n\
    ```typescript\nconst word: unknown = “abcdefg”;\n// const charCount: number =\
    \ word.length; // error: TS2571 [ERROR]: Object is of type ‘unknown’.\nconst charCount:\
    \ number = (word as string).length;\n```\n\n### Angle bracket <> syntax\n```typescript\n\
    const word: unknown = “abcdefg”;\n// const charCount: number = word.length; //\
    \ error: TS2571 [ERROR]: Object is of type ‘unknown’.\nconst charCount: number\
    \ = (<string>word).length;\n```\n\n# Unions\nIn union types, a variable can hold\
    \ values of two or more types. Union is denoted by the vertical bar or pipe `|`\
    \ symbol.\n\n```typescript\nlet myNum: number = 24;\n// myNum = “id2234”; // error:\
    \ TS2322 [ERROR]: Type ‘string’ is not assignable to type ‘number’.\nlet myId:\
    \ string | number = 25; // myId will accept string or number.\nmyId = “id234”;\
    \ // string is accepted\n```\n```typescript\ntype myIdType = string | number;\n\
    let myId1: myIdType = 53;\nmyId1 = “id234”;\n```\n\n# Intersections\nIntersection\
    \ types are created by combining all the properties and methods of two different\
    \ types. Ampersand` is used to create intersection types.\n\n```typescript\ninterface\
    \ IPerson {\n  name: string;\n  age: number;\n}\n\ninterface IEmployee {\n  employeeId:\
    \ number;\n}\n\n// PersonType will have all props of IPerson & IEmployee\ntype\
    \ PersonType = IPerson & IEmployee;\nconst printMe = (person: PersonType): PersonType\
    \ => {\n  return person;\n};\n\nconst user: PersonType = {\n  name: “name1”,\n\
    \  age: 25,\n  employeeId: 555,\n};\nconst result = printMe(user);\nconsole.log(result);\n\
    ```\n\n# Classes\nTypeScript allows an object-oriented programming approach with\
    \ the help of classes. In `OOP` terms, class is a blueprint used to create an\
    \ instance or object. In general, a class can have the following:\n\n* `constructor()`:\
    \ Invoked whenever an instance of the class is to be created.\n* `fields`: A variable\
    \ or property.\n* `method`: A function\n\n# Modifiers\nModifiers are access controllers\
    \ for the fields of the class. There are three modifiers named `public`, `private`,\
    \ and `protected`, used for fields and methods.\n\n### public\nThis is the default\
    \ modifier which allows access to the field/method outside class.\n\n```typescript\n\
    class Person {\n  name: string; // public\n  age: number; // public\n  // Called\
    \ during instance creation\n  constructor(name: string, age: number) {\n    this.name\
    \ = name;\n    this.age = age;\n  }\n  printMe() {\n    console.log(this.name,\
    \ this.age); // this refers to ‘person’ instance\n  }\n}\nconst person = new Person(“me”,\
    \ 99); // Calls constructor, name=”me” and age=99\nperson.printMe();\nconsole.log(person.age);\
    \ // public property is accessible outside class\n```\n\n### private\nIt does\
    \ not allow access to the field/method outside class. Even the subclasses do not\
    \ have access to private properties. It is defined by either a private keyword\
    \ or ECMAScript’s `hash(#)` modifier.\n\n```typescript\nclass Person {\n  name:\
    \ string;\n  private _age: number;\n  #isActive: boolean; // private identifier\n\
    \  constructor(name: string, age: number, isActive: boolean = true) {\n    this.name\
    \ = name;\n    this.age = age;\n    this.#isActive = isActive;\n  }\n  printMe()\
    \ {\n    console.log(this.name, this.age, this.#isActive);\n  }\n}\nconst person\
    \ = new Person(“me”, 99);\nperson.printMe();\nconsole.log(person.name);\n/**\n\
    \ * error: TS2341 [ERROR]: Property ‘age’ is private and only accessible within\
    \ class ‘Person’.\n */\n// console.log(person.age);\n/**\n * TS18013 [ERROR]:\
    \ Property ‘#isActive’ is not accessible\n * outside class ‘Person’ because it\
    \ has a private identifier.\n */\n// console.log(person.#isActive);\n```\n\n###\
    \ protected\nIt does not allow access to the field/method outside class, but the\
    \ subclasses do have access to its fields.\n\n```typescript\nclass Person {\n\
    \  name: string;\n  protected age: number; // protected field\n  constructor(name:\
    \ string = “unnamed”, age: number = 0) {\n    this.name = name;\n    this.age\
    \ = age;\n  }\n  printMe() {\n    console.log(this.name, this.age);\n  }\n}\n\n\
    class User extends Person {\n  userId: number;\n  constructor(userId: number,\
    \ name: string, age: number) {\n    super(name, age);\n    this.userId = userId;\n\
    \  }\n  printMe() {\n    console.log(this.name);\n    console.log(this.age); //\
    \ protected field age of Person class is accessible to subclasses\n  }\n}\nconst\
    \ user = new User(1, “me”, 99);\n```\n"
