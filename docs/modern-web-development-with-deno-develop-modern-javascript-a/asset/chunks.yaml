    \n    *   File watcher\n\n    *   Permission flags\n\n    *   Permissions allow-list\n\
    \n*   Deno runtime APIs\n\n    *   Web APIs\n\n    *   Deno global APIs\n\n  \
    \  *   Variables\n\n    *   Classes\n\n*   Deno modules\n\n    *   Standard library\n\
