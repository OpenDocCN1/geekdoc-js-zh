    */\n// console.log(user.age);\n```\n\n# Getter and Setter\n\nAs we saw in the\
    \ modifier section, `private` and `protected`, fields/methods are not accessible\
    \ outside the class. We will need to access them in some situations. Getters and\
    \ Setters will be helpful in such cases.\n\n```typescript\nclass Person {\n  name:\
    \ string;\n  private _age: number;\n  #isActive: boolean;\n  constructor(name:\
    \ string, age: number, isActive: boolean = true) {\n    this.name = name;\n  \
    \  this.age = age;\n    this.#isActive = isActive;\n  }\n  printMe() {\n    console.log(this.name,\
    \ this.age, this.#isActive);\n  }\n  get _age() {\n    return this.age;\n  }\n\
    \  set _age(value: number) {\n    this.age = value;\n  }\n  get Is_active() {\n\
    \    return this.#isActive;\n  }\n  set Is_active(value: boolean) {\n    this.#isActive\
    \ = value;\n  }\n}\nconst person = new Person(\"me\", 99);\nperson.printMe();\n\
    console.log(person.name);\n\n/**\n* error: TS2341 [ERROR]: Property ‘age’ is private\
