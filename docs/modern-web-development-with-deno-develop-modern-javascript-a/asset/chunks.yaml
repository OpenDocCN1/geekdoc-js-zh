  raw: 'Any file with extension **`*.js`**, **`*.jsx`**, **`*.ts`**, **`*tsx`**, and
    **`*.mjs`** in /pages folder having a default exported React component is considered
    as a page. As aleph.js supports filename-based routing, each page will then be
    associated with a route based on the filename.


    **Example**:


    If we create **`pages/hello.tsx`** with the default exported React component as
    shown in the following code, then we can access that page at **http://localhost:8080/hello**,
    as shown in *[figure 5.2](#c05.xhtml_fig5_2).*


    1.  `// pages/hello.tsx`


    2.  `import React from “react”;`


    4.  `export default function Hello() {`


    5.  `return “Hello Deno!”;`


    6.  `}`


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Hello Deno! Page


    Every page is **pre-rendered**, meaning HTML for the page is generated in advance,
    resulting in better performance and SEO. Aleph.js also supports a **hydration**
    process, where associated JavaScript code for the HTML is run when the page is
    loaded by the browser, making it fully interactive.


    # [Routing](#toc.xhtml_s95a)


    Aleph.js supports file-system-based routing. It automatically routes files named
    **`index`** to the root of the directory. **Dynamic Routes** are also supported
    via **bracket** syntax ([]) or **$** sign prefix.


    `// Index routing`


    `pages/index.tsx => localhost:8080/`


    `pages/hello/index.tsx => localhost:8080/hello`


    `// Dynamic routing`


    `// $ prefix`


    `pages/hello/$name.tsx => pages/hello/buddy`


    The following code uses a **`params`** object of **`useRouter()`** hook to obtain
    the passed parameter value. The property key of **`params`** is determined by
    the filename ($name).


    1.  `// pages/hello/$name.tsx`


    2.  `import React from “react”;`


    3.  `import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;`


    6.  `export default function Hello() {`


    7.  `const { params } = useRouter();`


    8.  ``return `Hello ${params.name}!`;``


    9.  `}`


    If we enter **`route /hello/buddy`** in the browser, where **`buddy`** is the
    value of the **`name`** parameter, we shall see the response shown in *[figure
    5.3](#c05.xhtml_fig5_3)*.


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Dynamic routes ($ Syntax)


    `// Bracket syntax []`


    `pages/places/[place].ts => pages/places/munich`


    Similar to $ sign syntax, a bracket syntax [] does serve the same purpose as shown
    as follows. Here, the parameter key is the place (derived from the filename **`[place].ts`**).
    If we enter **`/places/munich`** in the browser, where Munich is the value of
    the place parameter, we shall see the response as shown in *[figure 5.4](#c05.xhtml_fig5_4)*.


    1.  `// pages/places/[place].tsx`


    2.  `import React from “react”;`


    3.  `import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;`


    5.  `export default function Places() {`


    6.  `const { params } = useRouter();`


    8.  ``return <h1>{`${params.place} is a wonderful place!`}</h1>;``


    9.  `}`


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Dynamic routes (bracket syntax)


    **Nested Routes** are supported and can be achieved as shown in the following
    code:


    `pages/users/[username]/account.tsx => pages/users/user1/account`


    1.  `// pages/users/[username]/account.tsx`


    2.  `import React from “react”;`


    3.  `import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;`


    5.  `export default function UserAccount() {`


    6.  `const { params } = useRouter();`


    8.  ``return <h1>{`${params.username}’s account.`}</h1>;``


    9.  `}`


    ![](images/Figure-5.5.jpg)


    **Figure 5.5:** Nested routes


    # [Application Programming Interface (API)](#toc.xhtml_s96a)


    Similar to pages, any file with **`*.ts`**, **`*.js`**, **`*.mjs`** extension
    having default exported function inside **`api/`** folder is mapped to **`/api/*`**
    and is treated as an API endpoint. The exported function will be of type **`APIHandler`**.


    1.  `// api/users/index.ts`


    2.  `import type { APIHandler} from “aleph/types.d.ts”;`


    4.  `const users = [`


    5.  `{ id: 1, name: “abc”, place: “Munich” },`


    6.  `{ id: 2, name: “name2”, place: “wonderland” },`


    7.  `];`


    9.  `export const handler: APIHandler = ({response}) => {`


    10.  `response.status = 200;`


    11.  `response.json(users);`


    12.  `}`


    ![](images/Figure-5.6.jpg)


    **Figure 5.6:** API routing


    **Dynamic API routes** are also supported. We can create a file like **`api/users/[id].ts`**
    with the default export function. The **`id`** can then be passed as a parameter
    like **`api/users/1234`** and will be obtained from the **`router.params`** object.


    1.  `// api/users/[id].ts`


    2.  `import type { APIHandler } from “aleph/types.d.ts”;`


    4.  `export const handler: APIHandler = async ({response, router}) => {`


    5.  `response.json(router.params);`


    6.  `}`


    ![](images/Figure-5.7.jpg)


    **Figure 5.7:** Dynamic API route


    # [Initializing Todos App](#toc.xhtml_s97a)


    We have checked the major Aleph.js concepts required for full-stack application
    development. We will now initialize our todos app using the **`aleph init`** command.
    Head over to the terminal and type the following commands. Make sure you have
    installed Deno, Aleph, and VS code before running the commands.


    1.  `aleph init todos-app`


    2.  `cd todos-app`


    3.  `code . // Make sure VS code is installed`


    4.  `aleph dev // Server running on http://localhost:8080`


    # [Project structure](#toc.xhtml_s98a)


    The project structure shown in *[figure 5.8](#c05.xhtml_fig5_8)* is familiar to
    us. We have already seen API and page concepts. The **`app.tsx`** file is the
    entry point for our app. **`styles`** folder contains styling-related files, the
    components folder contains React Component files, the public folder contains all
    the static files, and **`lib`** folder contains custom hooks and other utility
    functions.


    ![](images/Figure-5.8.jpg)


    **Figure 5.8:** Aleph project structure


    Our development approach will be creating API endpoints first and then creating
    UI that consumes the API.


    # [Todos API](#toc.xhtml_s99a)


    Before creating the UI for Todos App, we will need to create the API endpoints
    for CRUD actions. Create an **`index.ts`** file in a folder called **`todos`**
    in the **`api`** folder. It should have a path like **`api/todos/index.ts`**.


    1.  `// api/todos/index.ts`


    2.  `import type { APIHandler} from “aleph/types.d.ts”;`


    4.  `export const handler: APIHandler = ({response}) => {`


    5.  `response.json({ message: “Hello Aleph!” });`


    6.  `}`


    Preceding code exports a function of type **`APIHandler`**. If you hit **http://localhost:8080/api/todos**
    using Postman, curl, or browser, the function will be called with the context
    argument containing request, response, and router objects. The **`response.json`**
    function is then used to reply with JSON content, as shown in *[figure 5.9](#c05.xhtml_fig5_9)*.


    ![](images/Figure-5.9.jpg)


    **Figure 5.9:** **`api/todos`** endpoint


    # [GET (list)](#toc.xhtml_s100a)


    Now, we should modify the file to GET all existing todos instead of the message.
    We will create a Todos array with dummy todos, as shown here:


    1.  `// api/todos/index.ts`


    2.  `import type { APIHandler} from “aleph/types.d.ts”;`


    4.  `const todos = [`


    5.  `{ id: 1, title: “todo1” },`


    6.  `{ id: 2, title: “todo2” },`


    7.  `];`


    9.  `export const handler: APIHandler = ({request, response}) => {`


    10.  `switch (request.method) {`


    11.  `case “GET”:`


    12.  `   response.json(todos);`


    13.  `   break;`


    15.  `  default:`


    16.  `   response.status = 405;`


    17.  `   response.json({ message: “Action not allowed” });`


    18.  `   break;`


    19.  `}`


    20.  `}`


    Here, we are using a **`switch`** statement with the request **`method (GET, POST)`**
    as a case.


    ![](images/Figure-5.10.jpg)


    **Figure 5.10:** GET/api/todos endpoint'
