  trans: "\n模块注册表是托管 Deno 的地方。就像 Node 中的 `npm` 一样，Deno 也有几个使用区块链等现代功能构建的模块注册表。\n\n\
    在列出 Deno 的标准模块和第三方模块之后，我们将检查 Deno 可用的主要模块注册表：\n\n| 模块注册表 |  |\n| :--- | :--- |\n\
    | `deno.land/x` | 官方模块注册表，托管了大量第三方模块（编写时有 1651 个模块） |\n| `nest.land` | 一个使用 `blockweave`（区块链的派生物）构建的现代\
    \ Deno 模块注册表。发布的模块是不可变的、去中心化的且永久的，这意味着它们永远无法被删除。 |\n| `Skypack CDN` | 由 `Pika`\
    \ 提供的托管预优化 ES 模块的 CDN。它提供压缩、缓存、填充填充（polyfilling），并将 `npm` 包转换为 ES 模块。每当在模块 URL\
    \ 后面添加 `?dts` 时，它会自动使用 `X-TypeScript-Types` 请求头获取类型声明。 |\n| `esm.sh` | 由 `aleph`\
    \ 框架创建者提供的 ES 模块 CDN，它为每个模块封装所有依赖（同行依赖除外）。Node 包通过 `esbuild` 转换为 ES 模块以便通过填充在\
    \ Deno 上运行。它默认通过 `X-TypeScript-Types` 请求头提供类型声明。 |\n| `jspm` | 一个将 `npm` 包转换为\
    \ ES 模块的模块 CDN。 |\n| `Web` | 托管在互联网（例如 GitHub）上的任何 ECMAScript 模块都可以 Deno 支持的 ESM\
    \ import 使用。 |\n\n**表 4.8：** Deno 模块注册表\n\n# deps.ts 中的中心依赖\n\n在 Deno 世界中，有一种约定用于从\
    \ `deps.ts` 文件中导入所有依赖。这些依赖被重新导出并在整个项目中使用。这有助于我们在一个地方维护所有依赖。同样地，开发依赖被保存在在一个名为 `dev_deps.ts`\
    \ 的单文件中。\n\n在接下来的代码中，我们从 `deps.ts` 文件中导入所有的依赖 URL 并将其导出以供整个项目使用。我们从第三方大小处理模块导入了\
    \ `titleCase` 函数，该函数会返回每个单词首字母大写的标题格式。我们还从 Deno 标准库的测试模块导入了 `assertEquals` 函数。\n\
    \n```\n// deps.ts\n1. import titleCase from \"https://deno.land/x/case@v2.1.0/titleCase.ts\"\
    ;\n2. import { assertEquals } from \"https://deno.land/std@0.97.0/testing/asserts.ts\"\
    ;\n4. export { titleCase, assertEquals };\n```\n\n现在我们将在 `hello.ts` 文件中从 `deps.ts`\
    \ 文件导入模块，如下代码所示：\n\n```typescript\n// hello.ts\n1. import { titleCase, assertEquals\
    \ } from \"./deps.ts\";\n3. console.log(titleCase(\"hello world\"));\n4. assertEquals(\"\
    hello\", \"helloz\");\n```\n\n前面的代码输出了标题格式为 `\"Hello World\"` 的字符串 `\"hello world\"\
    `，并且 `assertEquals` 函数因为实际值（`\"hello\"`）和预期值（`\"helloz\"`）不等而抛出 `AssertionError`，如图所示：\n\
    \n![](img/Figure-4.2.jpg)\n\n**图 4.2：** deps.ts 示例\n\n# 结论\n\n我们现在结束关于 Deno 生态系统的章节。它概述了\
    \ Deno 生态系统的各个部分，如运行时 API、CLI、标准模块和第三方模块、模块注册表等。作为行业中的一项新技术，Deno 生态系统正在以快速速度进化。我们可能会看到\
    \ Deno 社区提出新的令人兴奋的想法和实现，就像他们一直以来所做的那样。\n\n随着本章的结束，我们现在准备好进入书中最激动的部分——编写代码。我们将在接下来的章节中从头开始编写\
    \ Deno 应用。在此之前，继续探索 Deno 生态系统。\n\n# 第 5 章\n\n# Todos 应用—API\n\n# 简介\n\n我们现在准备好进入编码战场或游乐场（取决于你如何看待）。在本章中，我们将创建一个包含\
    \ `CREATE`、`RETRIEVE`、`UPDATE` 和 `DELETE`（`CRUD`）的应用。一个 Todos 应用。这将是我们 Deno 编码之旅的绝佳开始。我们将学习、调整并尝试使用名为\
    \ `Aleph.js` (aleph) 的全栈 React 框架创建的 Todos 应用，它列在 [第 4 章，Deno 生态系统] 的 [表 4.7]\
    \ 中。API 将在本章实现，而 UI 将下一章实现。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n* Aleph.js 简介\n    *\
    \ 特性\n    * 概念\n        * 页面\n        * 路由\n        * API\n* Todos 应用 API 实现\n\
    \n# 目标\n\n我们将能够学习：使用 aleph 开发全栈应用需要学习的三个基本概念。我们将使用这些概念来创建页面、基于文件名的路由以及 API。本章的目标是熟悉\
    \ aleph.js。我们将在接下来的章节中从头开始编写 Deno 应用。在此之前，请继续探索 Deno 生态系统。我们还将学习实现“表述状态转换”（`REST`）操作，如\
    \ `CREATE`、`RETRIEVE`、`UPDATE` 和 `DELETE`。\n\n# 引入 Aleph.js\n\nAleph.js 是一个受 Next.js\
    \ 启发的全栈框架。它使用 ES 模块语法，不需要 Webpack 或或其他绑定器。它仅重新打包更改的模块，并通过热更新（`HMR`）立即在浏览器中更新。Aleph.js\
    \ 可以使用以下命令安装：\n\n```bash\ndeno install -A -n aleph https://deno.land/x/cli.ts\n\
    ```\n\n# 特性\n\nAleph.js 是一个功能丰富的框架，提供了服务端渲染、静态站点生成、API 开发等许多功能。主要功能如下：\n\n* 基于文件系统的页面和路由\n\
    * API 开发\n* 服务端渲染\n* 静态站点生成\n* 零配置\n* 映射的使用\n* 带有 Fast Refresh 的 HMR\n* 通过 useDeno\
    \ hook 在组件中访问 Deno \n\n# 命令行界面\n\nAleph.js **命令行界面**（CLI）提供了静态站点生成、创建带有模板代码的新应用、升级\
    \ aleph.js 等命令。主要命令列如下：\n\n| 命令 |  |\n| :--- | :--- |\n| `aleph init` | 创建带有模板代码的新应用\
    \ |\n| `aleph upgrade` | 升级 aleph.js |\n| `aleph` | 显示所有命令行命令 |\n| `aleph -h`\
    \ / `aleph --help` | 显示帮助信息 |\n| `aleph -v` / `aleph --version` | 显示 aleph.js\
    \ 版本 |\n| `aleph dev` | 以开发模式启动服务器 |\n| `aleph start` | 以生产模式启动服务器 |\n| `aleph\
    \ build` | 构建应用为静态站点 |\n| `aleph analyze` | 分析应用依赖 |\n\n`aleph init` 命令提供了一个带有模板代码的示例应用。我们将使用它来初始化示例应用：\n\
    \n```bash\naleph init hello-aleph // 创建带有模板代码的 hello-aleph 文件夹\ncd hello-aleph\n\
    aleph dev // 以开发模式运行应用\n```\n\n你可以访问 `http://localhost:8080` 查看示例应用，如图所示：\n\n\
    ![](img/Figure-5.1.jpg)\n\n**图 5.1：** Aleph.js 示例应用\n\n# 概念\n\n使用 aleph 开发全栈应用需要学习的三个基本概念。我们将使用这些概念来创建页面、基于文件名的路由以及\
    \ API。\n\n# 页面\n"
- fmt: "\nAny file with extension `*.js`, `*.jsx`, `*.ts`, `*.tsx`, and `*.mjs` in\
    \ `/pages` folder having a default exported React component is considered as a\
    \ page. As `aleph.js` supports filename-based routing, each page will then be\
    \ associated with a route based on the filename.\n\n### Example:\n\nIf we create\
    \ `pages/hello.tsx` with the default exported React component as shown in the\
    \ following code, then we can access that page at `http://localhost:8080/hello`,\
    \ as shown in *[figure 5.2](#c05.xhtml_fig5_2)*.*\n\n```tsx\n// pages/hello.tsx\n\
    import React from “react”;\n\nexport default function Hello() {\nreturn “Hello\
    \ Deno!”;\n}\n```\n\n![](images/Figure-5.2.jpg)\n\n**Figure 5.2:** Hello Deno!\
    \ Page\n\nEvery page is **pre-rendered**, meaning HTML for the page is generated\
    \ in advance, resulting in better performance and SEO. Aleph.js also supports\
    \ a **hydration** process, where associated JavaScript code for the HTML is run\
    \ when the page is loaded by the browser, making it fully interactive.\n\n# Routing\n\
    \nAleph.js supports file-system-based routing. It automatically routes files named\
    \ `index` to the root of the directory. **Dynamic Routes** are also supported\
    \ via **bracket** syntax `[]` or **$`** sign prefix.\n\n```text\n// Index routing\n\
    pages/index.tsx => localhost:8080/\npages/hello/index.tsx => localhost:8080/hello\n\
    \n// Dynamic routing\n// $ prefix\npages/hello/$name.tsx => pages/hello/buddy\n\
    ```\n\nThe following code uses a `params` object of `useRouter()` hook to obtain\
    \ the passed parameter value. The property key of `params` is determined by the\
    \ filename (`$name`).\n\n```tsx\n// pages/hello/$name.tsx\nimport React from “react”;\n\
    import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\
    \nexport default function Hello() {\nconst { params } = useRouter();\nreturn `Hello\
    \ ${params.name}!`;\n}\n```\n\nIf we enter `route /hello/buddy` in the browser,\
    \ where `buddy` is the value of the `name` parameter, we shall see the response\
    \ shown in *[figure 5.3](#c05.xhtml_fig5_3)*.*\n\n![](images/Figure-5.3.jpg)\n\
    \n**Figure 5.3:** Dynamic routes ($ Syntax)\n\n```text\n// Bracket syntax []\n\
    pages/places/[place].ts => pages/places/munich\n```\n\nSimilar to $ sign syntax,\
    \ a bracket syntax `[]` does serve the same purpose as shown as follows. Here,\
    \ the parameter key is the `place` (derived from the filename `[place].ts`). If\
    \ we enter `/places/munich` in the browser, where Munich is the value of the place\
    \ parameter, we shall see the response as shown in *[figure 5.4](#c05.xhtml_fig5_4)*.*\n\
    \n```tsx\n// pages/places/[place].tsx\nimport React from “react”;\nimport { useRouter\
    \ } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\nexport default\
    \ function Places() {\nconst { params } = useRouter();\nreturn <h1>{`${params.place}\
    \ is a wonderful place!`}</h1>;\n}\n```\n\n![](images/Figure-5.4.jpg)\n\n**Figure\
    \ 5.4:** Dynamic routes (bracket syntax)\n\n**Nested Routes** are supported and\
    \ can be achieved as shown in the following code:\n\n```text\npages/users/[username]/account.tsx\
    \ => pages/users/user1/account\n```\n\n```tsx\n// pages/users/[username]/account.tsx\n\
    import React from “react”;\nimport { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\
    \nexport default function UserAccount() {\nconst { params } = useRouter();\nreturn\
    \ <h1>{`${params.username}’s account.`}</h1>;\n}\n```\n\n![](images/Figure-5.5.jpg)\n\
    \n**Figure 5.5:** Nested routes\n\n# Application Programming Interface (API)\n\
    \nSimilar to pages, any file with `*.ts`, `*.js`, `*.mjs` extension having default\
