  trans: "\n\n在 `/pages` 文件夹下，任何扩展名为 `*.js`、`*.jsx`、`*.ts`、`*.tsx` 和 `*.mjs` 且包含默认导出\
    \ React 组件的文件都被视为页面。由于 `aleph.js` 支持基于文件名的路由，每个页面将根据文件名关联到相应的路由。\n\n### 示例：\n\n\
    如果我们按照如下代码，创建一个具有默认导出 React 组件的 `pages/hello.tsx` 文件，那么我们就可以通过 `http://localhost:8080/hello`\
    \ 访问该页面，如 *图 5.2* 所示。\n\n```tsx\n// pages/hello.tsx\nimport React from “react”;\n\
    \nexport default function Hello() {\nreturn “Hello Deno!”;\n}\n```\n\n![](img/Figure-5.2.jpg)\n\
    \n**图 5.2:** Hello Deno! 页面\n\n每个页面都会被**预渲染**，这意味着页面的 HTML 会提前生成，从而获得更好的性能和 SEO。Aleph.js\
    \ 还支持**水合（hydration）**过程，当浏览器加载页面时，会运行与 HTML 相关的 JavaScript 代码，使其具有完全交互性。\n\n\
    # 路由\n\nAleph.js 支持基于文件系统的路由。它会自动将名为 `index` 的文件路由到目录根节点。同时也支持通过**括号**语法 `[]`\
    \ 或 **$** 符号前缀来实现**动态路由**。\n\n```text\n// 路由\npages/index.tsx => localhost:8080/\n\
    pages/hello/index.tsx => localhost:8080/hello\n\n// 动态路由\n// $ 前缀\npages/hello/$name.tsx\
    \ => pages/hello/buddy\n```\n\n以下代码使用 `useRouter()` 钩的 `params` 对象来获取传递的参数值。`params`\
    \ 的属性键由文件名（`name`）决定。\n\n```tsx\n// pages/hello/$name.tsx\nimport React from “react”;\n\
    import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\
    \nexport default function Hello() {\nconst { params } = useRouter();\nreturn `Hello\
    \ ${params.name}!`;\n}\n```\n\n如果我们在浏览器中输入 `route /hello/buddy`（其中 `buddy` 是 `name`\
    \ 参数的值），我们将会看到如 *图 5.3* 所示的响应。\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3:** 动态路由 ($\
    \ 语法)\n\n```text\n// 括号语法 []\npages/places/[place].ts => pages/places/munich\n\
    ```\n\n与 $ 符号语法类似，括号语法 `[]` 也具有相同的作用，所示。在这里，参数键是 `place`（源自文件名 `[place].ts`）。如果我们在浏览器中输入\
    \ `/places/munich`（其中 Munich 是 `place` 参数的值），我们将会看到如 *图 5.4* 所示的响应。\n\n```tsx\n\
    // pages/places/[place].tsx\nimport React from “react”;\nimport { useRouter }\
    \ from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\nexport default function\
    \ Places() {\nconst { params } = useRouter();\nreturn <h1>{`${params.place} is\
    \ a wonderful place!`}</h1>;\n}\n```\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4:**\
    \ 动态路由（括号语法）\n\n该系统支持**嵌套路由**，并如下所示所示实现：\n\n```text\npages/users/[username]/account.tsx\
    \ => pages/users/user1/account\n```\n\n```tsx\n// pages/users/[username]/account.tsx\n\
    import React from “react”;\nimport { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\
    \nexport default function UserAccount() {\nconst { params } = useRouter();\nreturn\
    \ <h1>{`${params.username}’s account.`}</h1>;\n}\n```\n\n![](img/Figure-5.5.jpg)\n\
    \n**图 5.5:** 嵌套路由\n\n# 应用程序接口 (API)\n\n与页面类似，`api/` 文件夹下任何扩展名为 `*.ts`、`*.js`、`*.mjs`\
    \ 且内部默认导出函数的文件都会映射到 `/api/*` 并被视为 API 端点。导出的函数类型将为 `APIHandler`。\n\n```ts\n//\
    \ api/users/index.ts\nimport type { APIHandler} from “aleph/types.d.ts”;\n\nconst\
    \ users = [\n  { id: 1, name: “abc”, place: “Munich” },\n];\n\nexport default\
    \ function handler(req: APIHandler) {\n  // ...\n}\n```（等待，根据提供的文本重新对齐逻辑）\n\n\
    ![](img/Figure-5.6.jpg)\n\n**图 5.6:** API\n\n同时也支持**动态路由**。前面的代码导出了类型为 `APIHandler`\
    \ 的函数。\n\n```ts\n// api/users/index.ts\nindex.ts\nimport type { APIHandler} from\
    \ “aleph/types.d.ts”;\n\nexport default function handler({response}: APIHandler)\
    \ {\n  response.json({ message: “Aleph!” });\n}\n```\n\n![](img/Figure-5.7.jpg)\n\
    \n**图 5.7:** 动态路由\n\n# 初始化应用\n\n我们已经检查了主要部分。现在我们使用 `aleph` 命令初始化应用。\n\n```bash\n\
    aleph init\ncd app\n```\n\n# 项目结构\n\n*图 5.8*所示的项目结构对我们来说很熟悉。\n\n![](img/Figure-5.8.jpg)\n\
    \n**图 5.8:** 项目结构\n\n# Todos API\n\n我们应该修改文件来获取所有现 todos，而不是消息。我们将创建一个包含虚拟 todos\
    \ 的 Todos 数组，如下所示：\n\n```ts\n// api/todos/index.ts\nimport type { APIHandler}\
    \ from “aleph/types.d.ts”;\n\nconst todos = [\n  { id: 1, title: “todo1” },\n\
    \  { id: 2, title: “todo2” },\n];\n\nexport default function handler({request,\
    \ response}: APIHandler) {\n  switch (request.method) {\n    case “GET”:\n   \
    \   response.json(todos);\n      break;\n    default:\n      response.status =\
    \ 405;\n      response.json({ message: “Action not allowed” });\n      break;\n\
    \  }\n}\n```\n\n![](img/Figure-5.10.jpg)\n\n**图 5.10:** GET/api/todos 端点\n\n"
- fmt: "\nIt will respond with all the existing todos for the `GET` method ([figure\
    \ 5.10](#c05.xhtml_fig5_10)), and if the requested action is not defined in the\
    \ switch statement, it will reply with the `405` Method Not Allowed code ([figure\
    \ 5.11](#c05.xhtml_fig5_11)). The `break` skips the following cases and ensures\
    \ that only matched case code is executed.\n\n![](images/Figure-5.11.jpg)\n\n\
    **Figure 5.11:** 405 code for undefined actions\n\n# [POST]\n\nWe will now implement\
    \ `CREATE (POST)` action for adding todo.\n\n```javascript\n…\nexport const handler:\
    \ APIHandler = async ({request, response}) => {\n  switch (request.method) {\n\
    \    case “GET”:\n      response.json(todos);\n      break;\n    case “POST”:\n\
    \      let body;\n      try {\n        body = await request.json();\n      } catch\
    \ (error) {\n        response.status = 400;\n        response.json({ error: error.message\
    \ });\n        break;\n      }\n      const title = body.title ? body.title.toLowerCase()\
    \ : null;\n      if (!title) {\n        response.status = 400;\n        response.json({\n\
    \          message: “title not provided”,\n        });\n        break;\n     \
    \ }\n      let todo = todos.find((_todo) => _todo.title === title);\n      if\
    \ (!todo) {\n        todo = {\n          id: todos[todos.length - 1].id + 1,\n\
    \          title, // Shorthand for title: title\n        };\n        todos.push(todo);\n\
    \      }\n      response.json(todo);\n      break;\n    default:\n      …\n```\n\
    \nWe are decoding the request body using the `request.json()` method that parses\
    \ the request body as JSON. `400` code is responded with an error message for\
    \ invalid or no JSON and also if the title is not provided. We are using the `toLowerCase()`\
    \ function to get todo titles in lowercase. This will help us find existing Todo\
    \ with the same title using the `find` method. If an existing todo is not found,\
    \ a new todo will be created and added to the Todos list. The `id` property set\
    \ uses the `id` of the last todo item (last Todo id + 1). The Todo (existing or\
    \ created) will then be returned using the `response.json` function. Now, try\
    \ adding a todo, as shown in [figure 5.12](#c05.xhtml_fig5_12).\n\n![](images/Figure-5.12.jpg)\n\
    \n**Figure 5.12:** POST `api/todos` API endpoint\n\nThe `GET api/todos` endpoint\
    \ should contain the newly created Todo, as shown in [figure 5.13](#c05.xhtml_fig5_13).\n\
    \n![](images/Figure-5.13.jpg)\n\n**Figure 5.13:** Newly created Todo in GET api/todos\n\
    \nNow, close the server by hitting `Ctrl` + `c` and start again using the `aleph\
    \ dev` command. You will not see the newly created Todo. This is because we are\
    \ not saving the data to a file or database. To persist the data, we will create\
    \ a `todos.json` file with the following JSON data in `db` folder.\n\n```json\n\
    // db/todos.json\n[\n  { “id”: 1, “title”: “todo1” },\n  { “id”: 2, “title”: “todo2”\
    \ }\n]\n```\n\nThe saved todos can then be retrieved using `readTodos` utility\
    \ function created in `lib/read_todos.ts` file. We are using `Deno.readFileSync`\
    \ function to read the text synchronously and then parse the JSON using `JSON.parse`.\n\
    \n```typescript\nlib/read_todos.ts\nconst readTodos = () => JSON.parse(Deno.readFileSync(\"\
    db/todos.json\"));\nexport default readTodos;\n```\n\nNow, we will obtain all\
    \ saved todos using `readTodos` in the `index.ts` file. Replace the existing todos\
    \ code with the following:\n\n```javascript\n// api/todos/index.ts\nimport type\
    \ { APIHandler } from “aleph/types.d.ts”;\nimport readTodos from \"../../lib/read_todos.ts”;\n\
    export const handler: APIHandler = async ({request, response}) => {\n  const todos\
    \ = readTodos();\n…\n```\n\nWe will create another utility function named `writeTodo`\
    \ in `lib/write_todos.ts` to persist the added Todo by writing it to the `todos.json`\
    \ file.\n\n```javascript\n// lib/write_todos.ts\nconst writeTodos = (todos) =>\n\
    \  Deno.writeFileSync(\"db/todos.json\", JSON.stringify(todos));\nexport default\
    \ writeTodos;\n```\n\nThe typescript compiler shows a message for implicit any\
    \ type for todos as shown in the following:\n\n![](images/Figure-14.jpg)\n\n**Figure\
    \ 14:** TypeScript warning for any type\n\nLet us fix this by adding an `ITodo`\
    \ interface in the `interfaces/ITodo.ts` file.\n\n```typescript\n// interfaces/ITodo.ts\n\
    export interface ITodo {\n  id: number;\n  title: string;\n}\n```\n\nWe will provide\
    \ `ITodo` as a type for the `todos` parameter in `write_todos.ts`. The bracket\
    \ `[]` after `ITodo` indicates an `ITodo` array. The TypeScript warning should\
    \ be gone.\n\n```typescript\n// utils/write_todos.ts\nimport ITodo from \"../interfaces/ITodo.ts\"\
    ;\nconst writeTodos = (todos: ITodo[]) =>\n…\n```\n\nWe will use the `writeTodo`\
    \ function and `ITodo` interface in the `index.ts` file.\n\n```javascript\n//\
    \ api/todos/index.ts\n…\nlet todo = todos.find((_todo: ITodo) => _todo.title ===\
    \ title); // Modified code\n…\ntodos.push(todo);\nwriteTodos(todos); // New code\n\
    …\n```\n\nIf you restart the server after adding a Todo, you should see the created\
    \ Todo persists in the `todos.json` file and is included in the `GET api/todos`\
    \ response.\n\n# [GET (object), PATCH, and DELETE]\n\nWe will now implement the\
    \ remaining actions (`GET`, `PUT`, and `DELETE`). All these actions will be performed\
    \ on the existing Todo. Hence, we will require a unique identifier like the `id`\
    \ of the Todo to be passed as a parameter. We will achieve this with the use of\
    \ the `Dynamic API Route`, which we learned previously in the API section.\n\n\
    As we learned in the Routing section, the bracket syntax is used to create a `Dynamic\
    \ Route`. We will create the file `api/todos/[id].ts` with the following code:\n\
    \n```javascript\n// api/todos/[id].ts\nimport type { APIHandler } from “aleph/types.d.ts”;\n\
    export const handler:APIHandler = async ({request, response, router}) => {\n \
    \ const id = parseInt(router.params.id);\n  response.json({ id: id });\n}\n```\n\
