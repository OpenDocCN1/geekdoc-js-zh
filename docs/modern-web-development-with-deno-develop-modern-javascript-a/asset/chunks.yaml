    We have defined various **types** and **inputs** in the preceding code. Let us
    explain them one by one.


    # User type


    We are defining fields **`userId`**, **`name`**, **`contacts`**, and **`email`**
    for this type. The client receives user-related data as per this type. Let us
    explain each one of the fields. An exclamation mark “!” after the field type denotes
    a non-nullable type.


    *   **`userId`**: identifier or primary key


    *   **`name`**: user’s name


    *   **`contacts`**: user’s contacts in array


    *   **`email`**: user’s email


    # Contact type


    We are defining fields **`userId`**, **`name`**, **`contacts`**, and **`email`**
    for this type. The client receives user-related data as per this type. Let us
    explain each one of the fields. An exclamation mark “!” after the field type denotes
    a non-nullable type.


    *   **`contactId`**: Identifier or primary key


    *   **`name`**: Name of the contact


    *   **`phone`**: Phone number of the contact


    *   **`email`**: Email of the contact


    *   **`address`**: Address of the contact


    *   **`user`**: userId of the creator of the contact


    # Login type


    We are defining a **`token`** field in this type.


    *   **token:** Access token used to access protected API endpoints and identify
    requesting users.


    # RegisterUser Input


    We are defining **`name`**, **`email`**, and **`password`** in this input type.
    It will be used as a **`mutation`** to create a user.


    *   **`name`**: Name of the user


    *   **`Email`**: Email of the user.


    *   **`Password`**: Password of the user.


    # LoginUser Input


    We are defining **`email`** and **`password`** in this input type. Email and password
    created during registration will be used to authenticate the user and return the
    token.


    *   **`Email`**: Email of the user.


    *   **`Password`**: Password of the user.


    # UpdateUser Input


    We are defining a single field **`name`** for this input. It will be used to update
    user information.


    # CreateContact and UpdateContact Input


    Here, we are defining **`name`**, **`email`**, **`phone`**, and **`address`**
    fields for these types. Both types have identical fields, whereas **`UpdateContact`**
    has an extra field **`contactId`,** which is used to identify the contact to be
    updated.


    # Query Type


    We have defined **`login`**, **`user`**, **`contacts`**, and **`contact`** queries
    for reading operations. **`Login`** query accepts input **user** of type **`LoginUserInput`**
    and returns data of **`Login`** type. **`user`** query returns details of the
    currently authenticated user.


    **`contacts`** query returns an array of contacts added by the current user. It
    returns an array of **`Contact`** type. **`Contact`** query returns single **Contact**
    data using contactId.


    # Mutation Type


    We have defined **`registerUser`,** **`deleteUser`,** **`updateUser`,** **`addContact`,**
    **`deleteContact`**, and **`updateContact`** queries for write operations. These
    queries perform create, update, and delete operations on User and Contact entities.


