  trans: "\nInput 用于定义在 `mutation` 过程中客户端输入的形状。它定义了两个 `input types`（输入类型）：`UserInput`\
    \ 和 `TodoInput`。`UserInput` 接受一个 `name` 参数，而 `TodoInput` 接受 `title` 和 `userId`\
    \ 参数。这两个输入类型都用于通过 `mutation` 类型创建或更新相应的实体。\n\n# Query\n\n定义由客户端执行的 `read` 操作的入口。query\
    \ 中定义了四个字段：`todos`、`todo`、`users` 和 `user`。`todos` 和 `users` 字段不接受参数并返回对应类型的数组。`todo`\
    \ 和 `user` 字段接受实体的 `id` 并返回对应类型的实体。\n\n# Mutation\n\n定义由客户端执行的 `write` 操作的入口。该类型中定义了\
    \ `addTodo` 和 `addUser` 字段。`addTodo` 接受类型为 `TodoInput` 的参数并返回 `Todo` 类型的数据，而 `addUser`\
    \ 接受类型为 `UserInput` 的参数并返回 `User` 类型的数据。\n\n# Relationship\n\nTodos schema 定义了\
    \ `User` 类型和 `Todo` 类型之间的“一对多”关系。这意味着每个 `Todo` 拥有`一个`用户，而每个 `user` 拥有`多个` Todo。\n\
    \n如`[图 7.10]`所示，GraphQL 赋予了客户端活性，可以在单个查询中获取所有与用户相关的 Todos。\n\n![](img/Figure-7.10.jpg)\n\
    \n**图 7.10:** 关系\n\n# Resolver\n\nResolver 是一个函数，通过为 schema 中的单个字段填充数据来解析 `query`\
    \ 或 `mutation`。以下代码演示了为之前定义的 schema 使用 `resolvers`：\n\n```javascript\nexport const\
    \ resolvers = {\n  Query: {\n    todos: (parent: any, args: any, context: any,\
    \ info: any) => {\n      if (args.userId) return getTodosByUserId(args.userId);\n\
    \      return getTodos();\n    },\n    todo: async (parent: any, args: any, context:\
    \ any, info: any) => {\n      return getTodo(args._id);\n    },\n    users: (parent:\
    \ any, args: any, context: any, info: any) => {\n      return getUsers();\n  \
    \  },\n    user: async (parent: any, args: any, context: any, info: any) => {\n\
    \      return getUser(args._id);\n    },\n  },\n  Mutation: {\n    addTodo: async\
    \ (parent: any, args: any, context: any, info: any) => {\n      const { title,\
    \ userId } = args.todo;\n      return createTodo(title, userId);\n    },\n   \
    \ addUser: async (parent: any, args: any, context: any, info: any) => {\n    \
    \  const { name } = args.user;\n      const user = createUser(name);\n      return\
    \ user;\n    },\n  },\n  Todo: {\n    title: (parent: any, args: any, context:\
    \ any, info: any) => {\n      return parent.title;\n    },\n    user: async (parent:\
    \ any, args: any, context: any, info: any) => {\n      const user = await info.rootValue.user(\n\
    \        parent,\n        { _id: parent.userId },\n        context,\n        info\n\
    \      );\n      return user;\n    },\n  },\n  User: {\n    name: (parent: any,\
    \ args: any, context: any, info: any) => {\n      return parent.name;\n    },\n\
    \    todos: async (parent: any, args: any, context: any, info: any) => {\n   \
    \   const todos = await resolvers.Query.todos(\n        parent,\n        { userId:\
    \ parent._id },\n        context,\n        info\n      );\n      return todos;\n\
    \    },\n  },\n};\n```\n\n让我们看看上述代码中发生了什么。我们定义了 `Query`、`Mutation`、`Todo` 和 `User`\
    \ 对象。`Query` 对象包含 `todos`（列表）、`todo`、`users` 和 `user` 对象。同样，`Mutation` 包含 `addTodo`\
    \ 和 `addUser` 对象，每个对象具有相同的签名。其他对象 `User` 和 `Todo` 用于解析各自类型的内部字段（title 等）。数据随后可以从各种来源中获取。每个对象之前都接受可选参数：`parent`、`args`、`context`\
    \ 和 `info`。\n\n`parent` 是字段父字段的返回值，`args` 包含所有 GraphQL 参数，`context` 是一个内容在所有 resolver\
    \ 中可用的对象，而 `info` 包含如字段名、路径等信息。\n\n# Oak framework\n\nOak 是一个用于 Deno 的 Web 框架，灵感来源于\
    \ node.js 的 `koa` 框架。它提供了在请求和响应之间调用的中间件函数。Oak 提供了 `use()` 方法来使用中间件函数。以下代码演示了 oak\
    \ 中的 `Hello World` 服务器：\n\n```javascript\nimport { Application } from \"https://deno.land/x/oak@v7.7.0/mod.ts\"\
    ;\n\nconst app = new Application();\n\napp.use((ctx) => {\n  ctx.response.body\
    \ = \"Hello World!\";\n});\n\nawait app.listen({ port: 8000 });\n```\n\n在上述代码中，`Application`\
    \ 实例 `app` 使用 `context` 调用每个中间件，`context` 包含了必要的信息如 `app`、`cookies`、`request`、`response`、`state`、`assert()`\
    \ 和 `throw()`。最后，服务器使用 `listen()` 方法在端口 `8000` 上监听。\n\n# Oak-GraphQL middleware\n\
    \nOak-GraphQL 模块允许我们在 oak 服务器之上创建 GraphQL API。我们将使用 Oak-GraphQL 中间件来实现 GraphQL\
    \ API。简单的 Hello World GraphQL API 可以如下设置：\n\n```typescript\n// oak_graphql_server.ts\n\
    import {\n  Application,\n  Router,\n  RouterContext,\n} from \"https://deno.land/x/oak@v9.0.0/mod.ts\"\
    ;\nimport {\n  applyGraphQL,\n  gql,\n  GQLError,\n}\n\nconst types = gql`\n \
    \ type Query {\n    hello(name: String): String\n  }\n`;\n\nconst resolvers =\
    \ {\n  Query: {\n    hello: (parent: any, { name }: any, context: any, info: any)\
    \ => {\n      if (!name) throw new GQLError(\"Name not provided\");\n      return\
    \ `Hello ${name}`;\n    },\n  },\n};\n\nconst GraphQLService = await applyGraphQL<Router>({\n\
    \  Router, // 同于 Router:\n  typeDefs: types,\n  resolvers: resolvers,\n});\n\n\
    const app = new Application();\napp.use(GraphQLService.routes(), GraphQLService.allowedMethods());\n\
    \nconsole.log(\"Server listening on http://localhost:8080/graphql\");\nawait app.listen({\
    \ port: 8000 });\n```\n\n如果我们使用命令 `deno run --allow-net oak_graphql_server.ts`\
    \ 运行上述代码，并在 URL `http://localhost:8080/graphql` 中查询 `{ hello(name: “ABC”) }`，我们应该看到如\
    \ `[图 7.11]` 所示的结果如下：\n\n"
- fmt: "\n![](images/Figure-7.11.jpg)\n\n**Figure 7.11:** GraphQL API Hello World\n\
    \n# Conclusion\n\nWe have covered the basic features and concepts of GraphQL,\
    \ such as schema, resolver along with type, query, and mutation. We also introduced\
    \ the `oak` framework used to create a Web server along with the `Oak-GraphQL`\
    \ module used to create a GraphQL server.\n\nWe will use the preceding GraphQL\
    \ concepts to create a GraphQL API server for the PhoneBook App using `Oak` and\
    \ `Oak-GraphQL` modules in the upcoming chapter.\n\n# CHAPTER 8\n\n## PhoneBook\
    \ App—API Implementation\n\n### Introduction\n\nWe will implement **Graph Query\
    \ Language** (**GraphQL**) **Application Programming Interface** (**API**) server\
    \ in this chapter. The basics of GraphQL we learnt previously will be applied\
    \ in this chapter for API implementation. We will use `oak` and `oak-graphql`\
    \ modules (introduced previously) to implement the API server.\n\n### Structure\n\
    \nIn this chapter, we will cover the following topics:\n\n*   Initial setup\n\
    \    *   Version control using `git`\n    *   `Trex` as the package manager\n\
    \    *   `Velociraptor` as script runner\n*   `Oak GraphQL` Server setup\n*  \
    \ Schema\n*   Resolvers\n*   `DenoDB` setup\n    *   DB\n        *   `ElephantSQL\
    \ PostgreSQL` setup\n    *   Models\n        *   `User`\n        *   `Contact`\n\
    \    *   Controllers\n*   Authentication\n\n### Objective\n\nAfter completion\
    \ of this chapter, you will be able to create GraphQL API server using `Oak` and\
    \ `Oak-GraphQL` modules. You will learn the use of **Object–relational mapping**\
    \ (**ORM**) using the `denodb` module to connect to different databases such as\
    \ MySQL, PostgreSQL, NoSQL, and so on. You will also learn the use of **JSON Web\
    \ Token** (**JWT**) to authenticate users using `djwt` module. You will also learn\
    \ to setup a Deno server project using `trex` and `velociraptor` modules.\n\n\
    ### Initial setup\n\nWe will start coding by initiating a git repository repository.\
    \ Then we shall install the `oak` and `oak-graphql` modules for creating Web server.\
    \ We will use `trex` package management module for installing these modules.\n\
    \n### Version control using git\n\n*[Figure 8.1]* shows git repo initialization,\
    \ installation of `trex` module, and installation of `oak` and `oak-graphql` using\
    \ `trex` module.\n\n![](images/Figure-8.1.jpg)\n\n**Figure 8.1:** Initial setup\n\
    \n### Trex as the package manager\n\nTrex caches installed packages and add them\
    \ to the `import_map.json` file. *Figure 8.2]* shows the list of installed modules\
    \ (`oak`, `oak-graphql`) in the `import_map.json` file.\n\n![](images/Figure-8.2.jpg)\n\
    \n**Figure 8.2:** Installed modules in import_map.json\n\nThe installed modules\
    \ can then be accessed as follows:\n\n1.  `import { Application } from “oak”;`\n\
    \n### Velociraptor as script runner\n\nCreate a file named `mod.ts` in `src` folder\
    \ with the following code:\n\n```javascript\nconsole.log(\"Hello Velociraptor!\"\
    );\n```\n\nWhat is velociraptor, you would ask. It is a script runner module for\
    \ Deno. We will install velociraptor and run the `mod.ts` file using it. Velociraptor\
    \ can be installed using [https://nest.land/](https://nest.land/) package registry\
    \ as follows:\n\n```bash\ndeno install -qAn vr https://x.nest.land/velociraptor@1.1.0/cli.ts\n\
    ```\n\nWe will now create `scripts.yaml` file to add the script to run the `mod.ts`\
    \ file. Velociraptor detects files named `scripts` or `velociraptor` with extension\
    \ `yml`, `yaml`, `json`, and `ts` as script files.\n\n*[Figure 8.3]* shows `scripts.yaml`\
    \ file with `dev` script that executes `src/mod.ts` file.\n\n![](images/Figure-8.3.jpg)\n\
    \n**Figure 8.3:** scripts.yaml file\n\nIf we run `vr` command in the terminal,\
    \ we will see a list of available scripts. We can then run the available script\
    \ as follows:\n\n```bash\nvr dev\n```\n\n*[Figure 8.4]* shows commands to list\
    \ available scripts and run a script.\n\n![](images/Figure-8.4.jpg)\n\n**Figure\
    \ 8.4:** Velociraptor CLI\n\nWe have setup a Deno server project using trex and\
    \ velociraptor. Now, we will set up Web server in the next section.\n\n### Oak\
    \ GraphQL setup\n\nWe will setup a simple GraphQL server using `oak` and `oak-graphql`\
    \ modules. We will use `oak-graphql` code from Chapter 7, Introduction to GraphQL,\
    \ and Oak-GraphQL to setup the server with few changes. We no longer need to mention\
    \ URL. Instead, we can mention the module name in `import_map.json`.\n\n```javascript\n\
    import { Application, Router } from \"oak\";\nimport { gql, GQLError } from \"\
    oak-graphql\";\n```\n\nWe will structure the project by having `mod.ts` (main\
    \ file), `middlewares.ts` (GraphQL Middleware), `schema.ts` (GraphQL schema/type\
    \ definitions), and `resolvers.ts` (GraphQL Resolver) files. *Figure 8.5]* shows\
    \ the project structure:\n\n![](images/Figure-8.5.jpg)\n\n**Figure 8.5:** Project\
    \ structure\n\nWe will write code for each file by one, starting from the `mod.ts`\
    \ file as follows:\n\n```javascript\n// src/mod.ts\nimport { Application } from\
    \ \"oak\";\nimport { GraphQLService } from \"./middlewares.ts\";\nconst app =\
    \ new Application();\napp.use(GraphQLService.routes(), GraphQLService.allowedMethods());\n\
    console.log(\"Server listening on http://localhost:8080/graphql\");\nawait app.listen({\
    \ port: 8080 });\n```\n\nIn the preceding code, we are creating oak server with\
    \ GraphQL Middleware called `GraphQLService` that can be accessed at `/graphql`\
    \ route.\n\n```javascript\n// src/schema.ts\nimport { gql } from \"oak_graphql\"\
    ;\nexport const types = gql`\n  type Query {\n    hello(name: String): String\n\
    \  }\n`;\n```\n\nIn the `schema.ts` file, we have defined a `hello` query that\
    \ accepts `name` argument. GraphQL validates incoming requests according to models\
    \ defined in `types`. The incoming request will then be resolved by `resolvers`.\n\
    \n```javascript\n// src/resolvers.ts\nimport { GQLError } from \"oak_graphql\"\
    ;\nexport const resolvers = {\n  Query: {\n    hello: (parent: any, { name }:\
    \ any, context: any, info: any) => {\n      if (!name) throw new GQLError(\"Name\
    \ not provided\");\n      return `Hello ${name}`;\n    },\n  },\n};\n```\n\nWe\
    \ need to update `scripts.yaml` file for `import_map` file path and permissions.\
    \ The file after the update will have the following code:\n\n```yaml\n# scripts.yaml\n\
    imap: import_map.json\nunstable: true\nallow:\n  - net\nscripts:\n  dev:\n   \
    \ cmd: src/mod.ts\n    desc: \"run graphql server in dev mode\"\n    watch: true\n\
    ```\n\nIn the preceding code, `imap` points to `import_map` file path, `unstable`\
    \ flag allows unstable Deno features to be executed, and `allow` includes `net`\
    \ for allowing network access. We have also added `cmd` (execution command), `desc`\
    \ (description), and `watch` (file watcher) fields to `dev` command.\n\n### Schema\n\
    \nSchema is a type of system that defines the shape of data. It provides available\
    \ data fields, queries, and mutations to clients. We have already learned schema-related\
    \ concepts in the following chapter with code. We will add `types`, `queries`,\
    \ and `mutations` for `User` and `Contact` entities as shown in the following\
    \ code:\n\n```javascript\n// src/schema.ts\nimport { gql } from \"oak_graphql\"\
    ;\nexport const types = gql`\n  type User {\n    userId: String!\n    name: String!\n\
    \    contacts: [Contact!]!\n    email: String!\n  }\n  type Contact {\n    contactId:\
    \ String!\n  }\n`;\n```\n"
