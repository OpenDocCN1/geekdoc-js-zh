- fmt: "\nWe are going to learn the core `Graph Query Language` (`GraphQL`) concepts\
    \ along with its features in this chapter. Once we cover the basics, we shall\
    \ create an API server (`GraphQL`) for the `Phonebook` App using these concepts\
    \ in the upcoming chapter. We will also introduce the `Oak Web` framework and\
    \ `Oak GraphQL`. Both will be used for GraphQL API server implementation in the\
    \ upcoming chapter.\n\n# Structure\n\nIn this chapter, we will cover the following\
    \ topics:\n\n*   GraphQL intro\n    *   Features\n        *   Precise fetching\n\
    \        *   Single API endpoint\n        *   Validation and type checking\n \
    \       *   Fragments\n        *   Auto-generated API docs\n    *   Core concepts\n\
    \        *   Schema\n            *   Type\n            *   Input\n           \
    \ *   Query\n            *   Mutation\n            *   Relationship\n        *\
    \   Resolver\n*   Introducing Oak framework\n*   Introducing Oak-GraphQL\n\n#\
    \ Objective\n\nAfter completion of this chapter, you will be able to understand\
    \ and apply GraphQL core concepts such as query, mutation, resolvers, type definitions,\
    \ and so on. You should also be able to use the Oak framework to create Deno Web\
    \ servers and the Oak-GraphQL module to create GraphQL servers.\n\n# Introducing\
    \ GraphQL\n\nGraphQL is an open-source query language for APIs developed by Facebook\
    \ and released in 2015. It allows the client to control the resolved data structure\
    \ as opposed to a fixed data structure in REST. This way, the client can `query`\
    \ only for the exact necessary data. It also allows `mutations` (writing or changing\
    \ data) and `subscriptions` (subscribing to data updates). It is used by many\
    \ large organizations, such as Facebook, GitHub, Coursera, and Pinterest, to name\
    \ a few.\n\n# Features\n\nGraphQL allows clients to `query or mutate data across\
    \ multiple resources in a single request. It creates a single entry point or API\
    \ endpoint POST `/graphql` to query or mutate the data. GraphQL also provides\
    \ resolved data in the same format as that of the requested query. Other GraphQL\
    \ features are explained in detail as follows.\n\n# Precise fetching\n\nBy allowing\
    \ the client to fetch only required data, GraphQL solves the data-related issues\
    \ where the client gets more than required data (`over fetching`) or less than\
    \ required data (`under fetching`).\n\n# Single API endpoint\n\nUnlike REST, GraphQL\
    \ will always have a single Endpoint `/graphql (POST)`, which can be used by the\
    \ client to fetch any data defined in the schema as GraphQL resolves the request\
    \ using the `query` passed in the request body.\n\n*[Figure 7.1]* fetches `users`\
    \ data using `/graphql` endpoint by providing the `users` query in the body as\
    \ follows:\n\n![](images/Figure-7.1.jpg)\n\n**Figure 7.1:** Fetch users\n\n*[Figure\
    \ 7.2]* fetches `Todos data` using the same endpoint `/graphql` by providing `todos`\
    \ query in the body as follows:\n\n![](images/Figure-7.2.jpg)\n\n**Figure 7.2:**\
    \ Fetch Todos\n\nAs shown in `[figures 7.1]` and `[7.2],` GraphQL allows fetching\
    \ `users` and `todos` from a single API endpoint using `query operation.`.\n\n\
    We can even fetch `users` and `todos` in a single request. This is a very powerful\
    \ feature of GraphQL that lets the client get all the required data in a single\
    \ request, which is extremely useful for devices with slower networks.\n\n*[Figure\
    \ 7.3]* fetches both `users` and `todos` in a single request as follows:\n\n![](images/Figure-7.3.jpg)\n\
    \n**Figure 7.3:** Fetch Users and Todos\n\n# Validation and type checking\n\n\
    GraphQL uses a `type system` to validate the query. The client can check which\
    \ fields are available (with field type) and whether the query is valid or not\
    \ before making the request.\n\n*[Figure 7.4]* demonstrates validation and type-checking\
    \ concepts for `todos` where `someField` field is not defined in the schema as\
    \ follows:\n\n![](images/Figure-7.4.jpg)\n\n**Figure 7.4:** Validation\n\n# Fragments\n\
    \nGraphQL allows writing a reusable code `fragment` that can be used across multiple\
    \ queries. We can create a fragment that replaces the repeated code unit and makes\
    \ the queries less cluttered and more readable.\n\n*[Figure 7.5]* shows code units\
    \ repeated for `todos` (fetch all Todos) and `todo` (fetch single Todo by id)\
    \ queries as follows:\n\n![](images/Figure-7.5.jpg)\n\n**Figure 7.5:** Repeated\
    \ code unit\n\nWe will move the repeated code unit in the `todoData` fragment\
    \ and use it with the spread operator (`…`) in both queries.\n\n*[Figure 7.6]*\
    \ demonstrates the use of `fragment` for fetching `todos` and `userData`.\n\n\
    # Autogenerated API documentation\n\nGraphQL generates API documentation for *queries*\
    \ and *mutations*. *Figure 7.7* shows autogenerated documentation for `todo`.\
    \ If we change `user` to `Int`, docs will be reflected.\n\n# Core concepts\n\n\
    GraphQL provides a `Resolver` that resolves the request, along with `query` for\
    \ reading data, `mutations` for writing data, and `subscription` for real-time\
    \ data.\n\n# Schema\n\nA `type system` is a contract between client and server\
    \ that defines the shape of the data. It defines `types` that describe an entity\
    \ or field. GraphQL uses Schema Definition Language (SDL) to define the schema.\
    \ A sample app can be defined as follows:\n\n```graphql\ntype User {\n  userId:\
    \ String!\n  name: String!\n  todos: [Todo!]\n}\n\ntype Todo {\n  todoId: String!\n\
    \  title: String!\n  user: User!\n}\n\ninput UserInput {\n  name: String!\n}\n\
    \ninput TodoInput {\n  title: String!\n  userId: String!\n}\n\ntype Query {\n\
    \  todos: [Todo!]\n  todo(todoId: String!): Todo!\n  users: [User!]\n  user(userId:\
    \ String!): User!\n}\n\ntype Mutation {\n  addTodo(todo: TodoInput!): Todo\n \
    \ addUser(user: UserInput!): User\n}\n```\n\nThis schema can also be viewed via\
    \ GraphQL playground, as shown in *[figure 7.9]*.\n\n![](images/Figure-7.9.jpg)\n\
    \n**Figure 7.9:** GraphQL schema\n\nLet explain various keywords (`type` and `input`)\
    \ used in the preceding schema:\n\n### Type\n\nType is used to define the shape\
    \ of the resolved query. The schema shown in *[figure 7.9]* defines two Object\
    \ types `User` and `Todo`. `User` type defines fields `userId`, `name`, and `todos`\
    \ (an array of `Todo` object type). `Todo` type defines fields `todoId`, `title`,\
    \ and `user` (of type `User`). Both object types are used by the `Query` type\
    \ while returning the corresponding data.\n\n### Input\n\nInput is used to define\
    \ the data structure for mutations.\n"
