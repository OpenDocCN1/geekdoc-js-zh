    \n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:** Terminal with zsh + oh my zsh\
    \ setup\n\n**Theme**: powerlevel10k\n\n**Plugins**: Git, zsh-syntax-highlighting,\
    \ and zsh-autosuggestions\n\n# [Vim](#toc.xhtml_s50a)\n\nVim (also known as vi)\
    \ is a legendary text editor used for fast and efficient text operations. Vim\
    \ has been in the industry for decades and has maintained its ranking in the topmost\
    \ editors for all these years. It is a keyboard-centric application that focuses\
    \ on keyboard commands to perform complex text operations. Vim has its own keybinding,\
    \ which needs some time to get used to, resulting in better control over text\
    \ manipulation and cursor movements.\n\nThere are many legends associated with\
    \ vim, and editor war is perhaps the most famous of all. There is a famous legend\
    \ about the rivalry between vim and emacs back in the 90s. Vim can be used via\
    \ VS Code Extension or directly from the terminal.\n\n**`Install vim`**\n\n**[https://www.vim.org/download.php](https://www.vim.org/download.php)**\n\
    \n# [VS Code](#toc.xhtml_s51a)\n\nVS Code is an open-source IDE developed by Microsoft.\
    \ It is available on all platforms (Windows, Linux, and macOS) and is one of the\
    \ most popular and widely used IDE at the moment.\n\nIt is built with Electron—A\
    \ JavaScript framework for the development of cross-platform desktop applications.\
    \ We will be using it for coding Deno applications. Installing VS Code on any\
    \ platform is very easy. Open **[https://code.visualstudio.com/download](https://code.visualstudio.com/download)**\
    \ and download and run the executable file for your OS.\n\n# [VS Code extensions](#toc.xhtml_s52a)\n\
    \nWe will list a few useful extensions while developing Deno programs in VS Code.\
    \ These extensions can be searched and installed from VS Code.\n\n*   **Deno**:\
    \ Enables Deno support for VS Code\n\n*   **Prettier**: A code formatter to prettify\
