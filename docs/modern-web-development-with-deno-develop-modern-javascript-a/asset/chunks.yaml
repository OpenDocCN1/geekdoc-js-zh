    In the **`src/middlewares.ts`** file, we are importing GraphQL schema/type definitions
    from the **`types.ts`** file. We are also importing resolvers from the **`resolvers.ts`**
    file. They are passed along with **Router** to **`applyGraphQL`** service to create
    **`GraphQL`** service. The **`setContextUser`** function uses **JSON Web Token
    (JWT)** provided in the authorization header to retrieve userId and set it in
    the context so every resolver will have access to it.'
