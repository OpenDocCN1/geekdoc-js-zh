    using **`value`** and **`onChange`** attributes. The **`disabled`** flag is also
    set to **`isCompleted`** similar to **`completed`** flag. In the end, we are **`Button`**
    element with **`onClick`** attribute to **Edit** or **Delete** the Todo by invoking
