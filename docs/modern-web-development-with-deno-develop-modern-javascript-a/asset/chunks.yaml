    # Deno runtime APIs


    Deno provides several number of runtime API functions that are useful during application
    development. All these runtime functions are documented at `doc.deno.land` ([`https://doc.deno.land/https/github.com/denoland/deno/releases/latest/download/lib.deno.d.ts`](https://doc.deno.land/https/github.com/denoland/deno/releases/latest/download/lib.deno.d.ts)).
    These functions can be categorized into two sections, namely Web (browser) APIs
    and Deno global APIs.


    # Web APIs


    Deno focuses on using existing Web standard APIs instead of creating new ones.
    Browser APIs such as `fetch`, `setTimeout`, and many other Web APIs are available
    in Deno. This gives an advantage that the developer familiar with web APIs can
    use them directly. We will list these APIs in the following table:


    | Web API | Description |

    | :--- | :--- |

    | `Fetch` | Used to make HTTP requests and fetch a resource from the network.
    It returns a promise. |

    | `addEventListener` | Adds an event listener in the global scope. |

    | `removeEventListener` | Removes `eventListener` added by the `addEventListener`
    function from the global scope |

    | `Alert` | A standard alert function that shows an alert message and waits until
    Enter key is pressed |

    | `setInterval` | Calls provided function repeatedly after provided interval until
    it is cleared using `clearInterval` function |

    | `clearInterval` | Cancels an action initiated by `setInterval` |

    | `setTimeout` | Invokes function after the specified time period |

    | `clearTimeout` | Cancels delayed action initiated by `setTimeout` |

    | `Btoa` | Creates base-64 ASCII encoded string from the provided string |

    | `Atob` | Decodes string of data encoded by base-64 encoder like `btoa` |

    | `Confirm` | Shows provided message and wait for user input. Returns user input
    in `boolean` (only `y` and `Y` are true) |

    | `Prompt` | Shows provided message and wait for user input. Returns user input
    in `string` format |

    | `dispatchEvent` | Dispatches event in the global scope and invokes registered
    listeners. Returns `false` for a cancelable event or if a listener called `Event.preventDefault()`
    |


    **Table 4.2:** Web APIs


    # Deno global APIs


    All non-Web standard APIs are made available via Deno global namespace. APIs for
    i/o (`Deno.readFile`, `Deno.writeFile`) and networking (`Deno.listen`, `Deno.connect`)
    are available in this namespace.


    Note that many of the functions have synchronous versions available.


    For example, `create` function has a synchronous method `createSync`.


    We will list the Web APIs and their synchronous versions (if available) in the
    following table:


    | Deno API | Sync | Description |

    | :--- | :--- | :--- |

    | `listen` | `–` | Used to create a listener with options for hostname, port,
    and transport |

    | `close` | `–` | Closes previously opened resource ID (`rid`) |

    | `connect` | `–` | Connects to the provided hostname, port |

    | `copy` | `–` | Copies from source to destination |

    | `cwd` | `–` | Returns current working directory (`cwd`) as a string |

    | `run` | `–` | Spawns a new subprocess. The subprocess command must be defined
    as an array to the cmd key |

    | `exit` | `–` | Exits the Deno process. An optional error code can be provided
    as an argument(default=0) |

    | `open` | `openSync` | Open a file to perform read, write, and create operations
    |

    | `copyFile` | `copyFileSync` | Copies contents and permissions of one file to
    another file |

    | `create` | `createSync` | Creates a file if none exists or truncates the existing
    one |

    | `mkdir` | `mkdirSync` | Creates a new directory with a provided string path
    |

    | `readDir` | `readDirSync` | Reads directory at the provided path and returns
    `Deno.dirEntry` iterable. Error is thrown if the path is not a directory |

    | `readFile` | `readFileSync` | Reads file as an array of bytes. The bytes can
    be converted to a string using TextDecoder. Returns an empty array if the path
    contains a directory |

    | `readTextFile` | `readTextFileSync` | Reads file as an utf8 encoded string.
    Throws an error if the path contains a directory |

    | `remove` | `removeSync` | Removes file or directory at the provided path. Throws
    error for the provided path |

    | `rename` | `renameSync` | Renames file or directory |

    | `chmod` | `chmodSync` | Changes permissions of file |

    | `chown` | `chownSync` | Changes owner of file |

    | `writeFile` | `writeFileSync` | Writes data to file |

    | `writeTextFile` | `writeTextFileSync` | Writes text to file |


    **Table 4.3:** Deno APIs


    # Variables


    Deno provides variables for various applications. The following table lists major
    variables:


    | Variable | Description |

    | :--- | :--- |

    | `args` | Returns array of arguments |

    | `build` | Provides system-related info as `os`, `target`, `arch`, `vendor` |

    | `env` | Provides environment variables via `get`, `set`, `keys`, `values`, `entries`,
    and `delete` |

    | `mainModule` | Returns URL of entrypoint module |

    | `pid` | Returns current process id |

    | `stdin` | A handle for `stdin` (Standard Input) |

    | `stdout` | A handle for `stdout` (Standard Output) |

    | `stderr` | A handle for `stderr` (Standard Error) |

    | `version` | Provides version-related info for Deno, Typescript, and v8 |


    **Table 4.4:** Deno variables


    # Classes


    There are several classes in Deno runtime for different purposes. We will be using
    `Request` and `Response` classes in our upcoming projects. The following list
    contains the major classes with the description:


    | Class | Description |

    | :--- | :--- |

    | `Blob` | A file-like object containing raw, immutable data. |

    | `Event` | Class representing DOM Event. Contains target attribute, `PreventDefault()`
    method, and so on. |

    | `File` | Provides file-related info like `lastModified`, `name`, `type`, `size`,
    and so on. It is inherited from the `Blob` class. |

    | `FormData` | Represents form fields in key-value pair format. Provides methods
    such as `get`, `set`, `keys`, `values`, `entries`, and so on. |

    | `Headers` | Represents header-related data in object format. |

    | `Location` | Provides location/URL of the linked object via `globalThis.location`
    |

    | `Request` | Represents a request related info |

    | `Response` | Represents a response to the request |

    | `TextEncoder` | Provides utf8 encoding functionality useful to encode a string
    to an array of bytes |

    | `TextDecoder` | Provides decoding function to decode an array of bytes to string
    |

    | `URL` | Provides object with static methods required to create object URLs |

