    \n    *   filename:\n\n        1. `deno run welcome.ts # executes local welcome.ts\
    \ file`\n\n    *   url:\n\n        1. `deno run https://deno.land/std@0.79.0/examples/welcome.ts`\n\
    \n    *   stdin:\n\n        1. `cat welcome.ts | deno run -`\n\n*   `install`:\
    \ Installs a Deno script as an executable in the directory specified as `DENO_INSTALL_ROOT`.\n\
    \n    1. `# Install denon (file watcher) as an executable`\n\n    2. `deno install\
    \ -qAf https://deno.land/x/denon@2.4.5/denon.ts`\n\n*   `fmt`: Formatter for TypeScript/Javascript\
    \ code.\n\n    1. `deno fmt # Formats all the files in the current directory recursively`\n\
    \n*   `doc`: Prints documentation for provided source file (module)\n\n*   `eval`:\
    \ Evaluate Javascript code from the terminal\n\n    1. `deno eval “console.log(Deno.args)”\
    \ deno land`\n\n    2. `# Output: [“deno”, “land”]`\n\n*   `test`: Runs tests\
    \ using a built-in test runner. Files with `{*_,*.,}test.{js,mjs,ts,jsx,tsx}`\
    \ patterns are considered for testing. Supports filter, coverage, fail-fast, and\
    \ other options.\n\n*   `cache`: Downloads and compiles a module and saves all\
    \ its dependencies in the local cache without running the code.\n\n    1. `deno\
    \ cache https://deno.land/std/http/file_server.ts`\n\n*   `bundle`: Bundles a\
    \ single JavaScript file with all dependencies.\n\n*   `completions`: Outputs\
    \ Deno shell completion script to the provided source file.\n\n    1. `# Install\
    \ Deno completions as a plugin in oh-my-zsh`\n\n    2. `mkdir ~/.oh-my-zsh/custom/plugins/deno`\n\
    \n    3. `deno completions zsh > ~/.oh-my-zsh/custom/plugins/deno/_deno`\n\n \
    \   4. `# Add deno in ~/.zshrc plugin`\n\n    5. `plugins=(… deno) // … represents\
    \ other plugins`\n\n*   `compile`: Compiles provided script into self-contained\
    \ executable.\n\n# Passing arguments\n\nArguments are useful whenever a dynamic\
    \ value needs to be provided to the code. Arguments can be passed to the script\
    \ by specifying them after the script name in the following format:\n\n1. `deno\
    \ run [FLAGS] [SCRIPT] [ARGUMENTS]`\n\nThe preceding format starts with `deno`\
    \ executable command followed by `run` subcommand, which executes the provided\
    \ script followed by optional security flags such as `--allow-net`, `--allow-read`,\
    \ and so on. The path for the script to be executed is then provided, followed\
    \ by optional arguments. All the entries (separated by space) provided after the\
    \ script are considered as arguments and are made available via `Deno.args` variable.\n\
    \nWe can use the preceding format for running Deno scripts with arguments. Create\
    \ a file named `args.ts` in the projects folder (like `home/my/work/deno/passing-arguments`)\
    \ with the following code:\n\n1. `// args.ts`\n\n2. `console.log(Deno.args);`\n\
    \nThe preceding code simply logs Deno runtime variable `Deno.args`, which is an\
    \ array of provided arguments. An empty array [] is logged if no arguments are\
    \ provided, as shown in [figure 4.1](#c04.xhtml_fig4_1):\n\n![](images/Figure-4.1.jpg)\n\
    \n**Figure 4.1:** Passing arguments\n\nWe will now pass two arguments `deno` and\
    \ `land`, to the `args.ts` file. As shown in [figure 4.1](#c04.xhtml_fig4_1),\
    \ the console should log `[“deno”, “land”]` after running the following code:\n\
    \n1. `deno run args.ts deno land`\n\n2. `# Output: [“deno”, “land”]`\n\nThe preceding\
    \ code runs the `args.ts` file with two additional parameters `deno` and `land`.\
    \ As Deno considers all the entries passed after the file name separated with\
    \ space as arguments, the entries are made available to the `args.ts` file in\
    \ `Deno.args` variable.\n\n**Note: Flags should not be passed after the script\
    \ name as they will be considered as arguments.**\n\nThe `--allow-net` flag passed\
    \ before `args.ts` script is considered as a `flag`, as shown in the following\
    \ code:\n\n1. `deno run --allow-net args.ts deno land # Args [“deno”, “land”].\
    \ allow-net is a flag.`\n\nThe `--allow-net` flag passed after `args.ts` script\
    \ is considered as an **argument**, as shown in the following code:\n\n1. `deno\
    \ run args.ts name --allow-net # Args[“name”, “--allow-net”]. Allow-net is not\
    \ a flag`\n\n# File watcher\n\nDeno will run the script with `--watch` flag, which\
    \ will automatically restart the script when changes are detected in the files.\
    \ This is useful for development.\n\n```bash\ndeno run --watch index.ts\n```\n\
    \n# Permission flags\n\nBy default, Deno scripts have no access to the network,\
    \ file system, or environment variables. You must explicitly grant these permissions\
    \ using flags.\n\n| Flag | Description | \n| :--- | :--- |\n| `--allow-net` |\
    \ Allow access to the network |\n| `--allow-read` | Allow read access to the file\
    \ |\n| `--allow-write` | Allow write access to the file |\n| `--allow-env` | Allow\
    \ access to environment variables |\n| `--allow-run` | Allow execution of subprocesses\
    \ |\n\nExample of using flags:\n\n```bash\ndeno run --allow-net --allow-read=config.json\
    \ index.ts\n```\n"
