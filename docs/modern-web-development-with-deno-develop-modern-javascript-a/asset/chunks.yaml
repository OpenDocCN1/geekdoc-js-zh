    \ “Deleted” });\n  break;\ndefault:\n  response.status = 405;\n  response.json({\
    \ message: “Action not allowed” });\n  break;\n}\n} else {\n…\n```\n\nFor `GET`\
    \ method, we are simply returning the matched Todo. This `GET` method differs\
    \ from the one in the `index.ts` file. It provides only a single todo (derived\
    \ using provided `id`), whereas the `GET` in `index.ts` provides a list/array\
    \ of all the todos.\n\nFor `DELETE`, we are filtering out the matched Todo from\
    \ todos and then writing the updated todos to the `todos.json` file using the\
    \ `writeTodos` function.\n\nFor `PATCH`, the initial code is similar to that of\
    \ the `POST` method from `index.ts` file. We obtain an updated title from the\
    \ JSON provided by `readBody(“json”)`. Then using `forEach`, we are updating only\
    \ the matched Todo of todos data. The updated Todos is then saved to the file\
    \ using the `writeTodos` function, and the updated Todo is replied.\n\n# Conclusion\n\
    \nThe Todos App API endpoints have been implemented in this chapter. We can now\
    \ use Postman, or `curl` to test them. We have also learned the features and basic\
    \ concepts of Aleph.js.\n\nThe next phase will be to implement the UI for Todos\
    \ App. We will check the unique features offered by Aleph.js for React Development\
    \ and implement the UI in the upcoming chapter.\n\n# CHAPTER 6\n\n# Todos App—UI\
    \ Implementation\n\n# Introduction\n\nWe have implemented REST APIs for Todos\
    \ App in the previous chapter. We will implement UI for the same in this chapter.\
    \ We will be using a Full Stack React framework named `aleph.js` for this purpose.\
    \ We will also be using the `styled components` library to create UI components\
    \ and the `axiod` to make network requests.\n\n# Structure\n\nIn this chapter,\
    \ we will cover the following topics:\n\n* Styled components\n    * Card\n   \
    \ * Text\n    * Button\n    * Input\n    * Checkbox\n* Todos components\n    *\
    \ TodoList\n    * TodoDetails\n\n# Objective\n\nAfter completion of this chapter,\
    \ you will be able to create UI for react application using the aleph module.\
    \ You should also be able to create custom components using styled components\
    \ and integrate them into the app. You should also be able to make network requests\
    \ using `axiod` module.\n\n# Styled components\n\nStyled components is a React\
    \ library that allows us to create components with css styles having a component-level\
    \ scope. We will use this library to create components such as `Button`, `Text`,\
    \ `Card`, and so on. Switch over to the `todos-app` folder from a terminal that\
    \ was initialized in the previous chapter. To install styled-components, we will\
    \ use the following `trex` command:\n\n```bash\ntrex -c styled=”https://esm.sh/styled-components@5.3.1”\n\
    ```\n\nOnce installed, we will create various components in `StyledComponents.tsx`\
    \ file. The code for each component will be as follows:\n\n```typescript\nimport\
    \ styled, { css } from “styled”\n\nexport const Card = styled.div`\n    display:\
    \ flex;\n    flex-direction: row;\n    background: #ddd;\n    border-radius: 5px;\n\
    \    margin: 10px;\n    justify-content: space-between;\n    align-items: center;\n\
    \    max-width: 600px;\n    margin: “auto”;\n`\n\nexport const Text = styled.span`\n\
    \    font-size: 20px;\n    font-weight: bold;\n    flex: 1;\n    margin-left:\
    \ 10px;\n    ${props => props.completed && css`\n      text-decoration: line-through;\n\
    \      color: grey\n    `}\n`\n\nexport const Button = styled.button`\n    /*\
    \ Adapt the colors on primary prop */\n    background: ${props => props.primary\
    \ ? “palevioletred” : “white”};\n    color: ${props => props.primary ? “white”\
    \ : “palevioletred”};\n    font-size: 1em;\n    margin: 1em;\n    padding: 0.25em\
    \ 1em;\n    border: 2px solid palevioletred;\n    border-radius: 3px;\n    cursor:\
    \ pointer;\n    ${props => props.disabled && css`\n      background: lightgrey;\n\
    \      cursor: not-allowed;\n      border: 2px solid lightgrey;\n    `}\n`\n\n\
    export const Input = styled.input`\n    flex: 1;\n    padding: 10px;\n    margin:\
    \ 10px;\n    border: none;\n    background: #ddd;\n    font-size: 20px;\n    font-weight:\
    \ bold;\n    ${props => props.completed && css`\n      text-decoration: line-through;\n\
    \      color: grey\n    `}\n`\n\nexport const Checkbox = styled.input`\n    type:\
    \ “checkbox”;\n    color: red;\n    margin-left: 10px;\n`\n\nexport const Header1\
    \ = styled.h1\n``\n```\n\nIn the preceding code, we are styling various components\
    \ such as `Card`, `Button`, `Text`, and so on using `styled` and `css` from `styled`\
    \ components. Each component is then exported and used across the project. We\
    \ are creating our own library using this approach.\n\nWe are passing a function\
    \ to some components. These functions are used to set values based on props. We\
    \ are using the `completed` prop in `Text` and `Input` components to adapt color\
    \ and text decoration accordingly. We are using the `primary` flag in the `Button`\
    \ component to adapt the color as per the prop.\n\n# Creating Todos components\n\
    \nWe will now use the custom-styled components in `TodoDetails` and `TodoList`\
    \ components. We will start by adding the `TodoList` component in `pages/index.tsx`\
    \ file, which is the entry point of our project as follows:\n\n```typescript\n\
    import React from ‘react’\nimport TodoList from “components/TodoList.tsx”\nexport\
    \ default function Home() {\n  return <TodoList />\n}\n```\n\nWe will check the\
    \ details of the `TodoList` component in the next section.\n\n# TodoList\n\nThis\
    \ component will be used to add new Todo and list existing Todos. We will be using\
    \ custom components from `StyledComponents.tsx` file for this purpose. The API\
    \ calls will be made using `axiod` module. The code for this file is as follows:\n\
    \n```typescript\n// components/TodoList.tsx\nimport React from ‘react’\nimport\
    \ { useDeno } from “https://deno.land/x/aleph/framework/react/mod.ts”;\nimport\
    \ axiod from “axiod”;\nimport TodoDetails from \"./TodoDetails.tsx”;\nimport {\
    \ Button, Card, Input, Header1 } from \"./StyledComponents.tsx”;\nimport readTodos\
    \ from “../lib/read_todos.ts”;\nexport default function Page() {\n  const _todos\
    \ = useDeno(async () => {\n    return await readTodos();\n  }, { revalidate: 1\
    \ });\n  const [todos, setTodos] = React.useState(_todos);\n  const [todoInput,\
    \ setTodoInput] = React.useState(\"\");\n\n  const getTodos = () => {\n    axiod.get(/api/todos”).then((res)\
    \ => {\n      console.log(res);\n      setTodos(res.data);\n    }).catch((err)\
    \ => {\n      console.log(err);\n    });\n  };\n\n  const addTodo = () => {\n\
    \    if (!todoInput) {\n```\n"
