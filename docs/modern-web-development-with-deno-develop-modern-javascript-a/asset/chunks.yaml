    \  .auth-container {\n    margin: 10px;\n    display: flex;\n    flex-direction:\
    \ column;\n    justify-content: space-between;\n  }\n</style>\n```\n\n在前面的代码中，我们使用了\
    \ carbon 组件 `Button`、`ButtonSet`，以及 carbon 图标 `Login16`、`Logout16`。我们还从 svelte-routing\
    \ 导入了 `Link` 组件，并从 store 中导入了 `accessToken`。`Link` 组件用于设置登录、注册等 URL 地址。我们使用 `accessToken`\
    \ 来显示登录、注册按钮或注销按钮。如果 `accessToken` 有效，则我们将显示注销按钮，否则显示登录和注册按钮。\n\n`ButtonSet` 用于显示一组按钮（登录、注册）。我们向每个\
