    | `WebSocket` | Provides APIs to create and manage WebSocket connections and send
    and receive data |


    **Table 4.5:** Deno classes


    # [Deno modules](#toc.xhtml_s81a)


    The runtime ecosystem cannot be completed without the modules (standard and third-party).
    In fact, the popularity of Node is owed to a large number of third-party modules
    available via npm. There are two types of modules available in Deno: Standard
    Library and Third-Party modules. We will check both types of modules in the following
    sections.


    # [Standard library](#toc.xhtml_s82a)


    Deno standard library is a collection of standard modules and is inspired by the
    standard library of the Go language. All the standard modules are reviewed by
    Deno Core Team and do not have external dependencies. These modules are available
    at `[https://deno.land/std](https://deno.land/std)`. We have listed them in the
    following table:


    | Module | Description |

    | :--- | :--- |

    | `archive` | Module providing `Tar`, `Untar` functionality. |

    | `Async` | Asynchronous task utility with `deferred` (Promise with reject, resolve
    functions), `delay` (delay promise resolve) functionality. |

    | `Bytes` | Provides helper functions to manipulate bytes. |

    | `Datetime` | Datetime module with `parse` (string to date), `format` (date to
    string), `difference` (the difference between 2 dates), and some additional functions.
    |

    | `Encoding` | Ported from Go’s `encoding` module, this module is useful for dealing
    with external data structures such as csv, yaml, toml, and so on. |

    | `flags` | A command-line argument parser based on `minimist` npm module. It
    is useful for CLI tool development. |

    | `Fmt` | Provides i/o formatting functions like `printf`. |

    | `Fs` | Provides helper functions for file system manipulation. Provides `emptyDir`,
    `ensureDir`, `exists`, `move`, `copy`, `walk`, and other functions. This module
    is unstable as of now, and hence, will need to use `--unstable` flag during usage.
    |

    | `Hash` | Used to create a hash with a large number of supported algorithms.
    |

    | `http` | Useful for creating HTTP Web servers. It also includes a file server
    function to serve local files over HTTP. |

    | `Io` | Provides functions like `Reader`, `Writer`, `Streams`, and so on. |

    | `Log` | A logger module with log levels. |

    | `Mime` | Used to deal with multipart form data. |

    | `Node` | The Compatibility module for Node’s Standard Library. Enables use of
    Node modules like lodash in Deno. |

    | `Path` | Provides path related functions. |

    | `Permissions` | Provides Permissions to the scripts. |

    | `Signal` | Provides APIs to capture and monitor OS signals like SIGINT. |

    | `Testing` | Provides test-related utilities such as `assert`, `equal`, and so
    on. |

    | `Textproto` | Inspired by Go’s `textproto` module. |

    | `Uuid` | Provides functions to `generate` and `validate` `Universal unique identifier`
    (`UUID`) with support for versions 1, 4, and 5. |

    | `Wasi` | Provides the implementation for `WebAssembly System Interface` (`WASI`).
    |

    | `ws` | Useful to create WebSocket servers. |


