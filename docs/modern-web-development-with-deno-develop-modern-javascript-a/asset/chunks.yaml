    # Dedicated to


    *"To all the Developers in the world"*


    # About the Author


    `Mayur` is a Dynamic and Result Oriented professional with a passion for Software
    Engineering and Perfection. Currently, working as a Full Stack Software Engineer
    on various projects utilising `Gatsby.js`, `Nikola`, `HTML`, `CSS`, `Bootstrap`,
    `Javascript` and so on. `Mayur` has also used various design patterns such as
    `CRUD`, `SearchBar`, `CSVDownloader`, `Loader` for UI creation of a network device
    and written blogs on each of them. He has done Bachelors of Electronic Engineering
    from University of Pune, along with a Diploma in Electronics and Telecommunications.
    Apart from this, he posseses 60+ certifications on Pluralsight, which includes
    course subjects such as `React`, `React Native`, `GraphQL`, `Python`, `Django`,
    `Javascript`, etc. He is also passionate about philosophy and spirituality.


    # About the Reviewer


    `Chad Elofson` is a Software Analyst using `Node` and `Deno`-based technologies.
    He works at Thompson Rivers University as a Software Analyst. He started his IT
    career 19 years ago as Network Administrator. For the past eight years, he has
    moved to Software Engineering focused on JavaScript runtime-based technologies.


    # Acknowledgement


    I’m grateful to the team at BPB Publications for giving me the opportunity to
    write the book.


    # Preface


    This book introduces developers to the new JavaScript runtime named `Deno`. It
    also shows how to create web applications on the front-end and the back-end with
    `TypeScript` using `Deno.js`.


    This book takes a practical approach for web developers or JavaScript. It covers
    a few realtime examples as well.


    This book is divided into **9 chapters**. They will cover Introduction to Deno,
    Introduction to TypeScript, Create Web Applications with React, Introduction to
    GraphQL, Creating GraphQL API server, Creating Svelte Application etc. The details
    are listed below.


    - **[Chapter 1](#c01.xhtml)** will cover what `Deno` is, why `Deno` was introduced
    by the creator of `Node.js` (popular JavaScript runtime), what are the differences
    between `Deno` and `Node` etc. Will list features of `Deno`. Will explain different
    technologies used in creating `Deno`. It will also provide information about What
    is JavaScript runtime and What is JavaScript engine.

    - **[Chapter 2](#c02.xhtml)** will cover What is `TypeScript`, benefits of `TypeScript`,
    features of `TypeScript` etc. It will also explain the basics of `TypeScript`
    for the JavaScript developers. It will also provide details about how to set up
    `TypeScript`.

    - **[Chapter 3](#c03.xhtml)** will provide details on how to install `Deno`. It
    will also list some of the widely used developer tools like `VS Code`, `Terminal`
    etc. necessary for development.

    - **[Chapter 4](#c04.xhtml)** will cover details about the `Deno` Ecosystem. `Deno`
    ecosystem includes `Deno CLI` details like Environment variables, subcommands,
    how to pass arguments, File watcher, Permission flags, Permission allow-list etc.
    It will also list `Deno` runtime APIs like `Web APIs`, `Global APIs` etc. `Deno`
    modules which are an essential part of the ecosystem are listed as two categories
    Standard library and Third-party modules. Also, Module registries like `Deno`’s
    own site `deno.land/x` and `nest.land` will also be listed.

    - **[Chapter 5](#c05.xhtml)** will introduce `Aleph.js`, A Full-stack React framework
    for `Deno`. It will list the concepts like pages, routing etc. in brief. It will
    create a `Todos App` API using provided API like `GET`, `POST`, `DELETE` etc.
    This will be helpful for the developer to get familiar with the concepts utilized
    in the next chapter.

    - **[Chapter 6](#c06.xhtml)** will continue the `Todos` app development and will
    cover UI implementation. It will provide details on how to use the Styled component
    library to create React components with CSS. It will provide code for basic components
    like `Button`, `Input` etc. and will utilize them in the app along `TodoList`
    and `TodoDetails` components.

    - **[Chapter 7](#c07.xhtml)** will introduce GraphQL and will provide details
    about features like precise fetching, Single API Endpoint etc. It will also list
    some of core concepts like `Type`, `Input`, `Mutation`, `Resolver` etc. It will
    then introduce `oak` module along with `oak-graphql` which will be used to implement
    GraphQL Server in the next chapter.

    - **[Chapter 8](#c08.xhtml)** will cover implementation of GraphQL server using
    `oak, oak-graphql` for creating Phonebook app. It will provide details on how
    to create a git repo, use `trex` as package manager and `velocaptor` as script
    runner. It will also provide the code for server setup, `Schema`, `Resolvers`.
    Database setup using ORM and authentication etc.

    - **[Chapter 9](#c09.xhtml)** will introduce the promising JavaScript framework
    or compiler `Svelte`. `Snel` is a module for creating Svelte applications using
    `Deno`. It will cover the setup process for `Snel` and `snel-carbon` (UI component
    module). It will then provide code for setting up public private routes for the
    app along Svelte components.


