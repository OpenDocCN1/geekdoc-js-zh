    \ :--- | :--- |\n| 数据类型 | 需要显式指定 | 不需要显式指定数据类型 |\n| 类型检查 | 在编译时 | 在运行时 |\n| 类型更改\
    \ | 不允许 | 允许 |\n| 语言 | C, C++ |\n\n# 强类型与弱类型\n\n强类型意味着不允许隐式类型转换，而弱类型意味着类型转换可以隐式进行。\n\
    \n# 强类型 (Python)\n```python\nid = 34 + \"sfs\" // 错误：不支持的运算符类型：‘int’ 和 ‘str’\n\
    ```\n\n# 弱类型 (JavaScript)\n```javascript\nlet id = 34 + \"abc\"; // 因为类型转换结果 \"\
    34abc\"\n```\n\n| | 强类型 | 弱类型 |\n| :--- | :--- | :--- |\n| 语言 | Python | JavaScript\
    \ |\n| 类型转换 | 仅限手动 | 自动和手动 |\n| 示例 | 1 + \"2\" // 在 Python 中报错 | 1 + \"2\" //\
    \ 在 JavaScript 中结果为 \"12\" |\n\n# TypeScript 安装\n\n在 Deno 之前，通过 `npm` 安装 TypeScript。由于\
    \ Deno 自带 TypeScript，我们可以直接开始编写 TypeScript 代码。但如果你打算在 Deno 环境外使用 TypeScript，你需要全局安装它。\n\
    \n**注意：确保你已安装 node 和 npm。**\n\n`npm install -g typescript`\n\n完成后，运行以下命令检查是否已安装\
    \ TypeScript：\n\n`tsc --version`\n\n`tsc --help`\n\n# tsconfig.json\n\n它是 TypeScript\
    \ 配置/设置文件，指示 TypeScript 项目的根目录，并指定根文件和编译器选项。Deno 提供默认的 `tsconfig.json`，可以在此处查看。([`deno.land/manual/getting_started/typescript#custom-typescript-options`](https://deno.land/manual/getting_started/typescript#custom-typescript-options))\n\
    \n# 总结\n\nTypeScript 是 JavaScript 受受认可和接受的超集，提供了类型安全。它在行业的流行是 Deno 将其作为主要语言的原因之一。\n\
    \n我们在本中涵盖了 TypeScript 的基础，在整个过程中还有很多可以学习的内容，因为 TypeScript 是我们 Deno 编程的首选语言。\n\n\
    同时，你可以随时在 TS Playground 中尝试不同的 TypeScript 功能：[`www.typescriptlang.org/play/`](https://www.typescriptlang.org/play/)。\n\
    \n通过本章，我们的基础部分（Deno, TypeScript）已经完成，我们将在接下来的章节开始 Deno 实战编程，届时我们将设置 Deno 并了解基础\
    \ Deno 命令。\n\n"
- fmt: "\nWe are now ready to get our hands-on experience running Deno in this section.\
    \ Before getting started, we need to set up the development environment for Deno.\
    \ Coding or programming is only one of the major aspects of software engineering.\
    \ There are other major factors involved that allow us to engineer and ship well-crafted\
    \ software applications in an estimated timeframe.\n\n# Structure\n\nIn this chapter,\
    \ we will cover the following points:\n\n*   Installing Deno\n*   Development\
    \ tools\n    *   Terminal\n    *   zsh + Oh my zsh\n    *   Vim\n    *   VS Code\
    \ (with extensions)\n    *   Git and GitHub\n    *   Postman\n    *   Docker\n\
    \    *   Silver searcher\n    *   Database\n        *   MongoDB + MongoDB Atlas\n\
    \        *   Postgres\n        *   Redis\n    *   Heroku CLI\n    *   Pomodoro\
    \ Technique\n    *   Tmux\n\n# Objectives\n\nWe will be installing Deno via terminal,\
    \ and we will also have a brief overview of some major development tools and technologies\
    \ required during Deno development. We will be using them while working on the\
    \ projects later on. Though optional, these tools will provide a better developer\
    \ experience and organization. We will also learn to set up some of the popular\
    \ development tools useful for developers to be productive and organized.\n\n\
    # Installing Deno\n\nInstalling Deno is quite easy and can be done using a single\
    \ terminal command. There are various ways to install Deno on your machine as\
    \ follows:\n\n`# Shell (MacOS, Linux):`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh\
    \ | sh\n```\n\n`Install specific version:`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh\
    \ | sh -s v1.5.4\n```\n\n`# PowerShell (Windows):`\n\n```powershell\niwr https://deno.land/x/install/install.ps1\
    \ -useb | iex\n```\n\n`Install specific version:`\n\n```powershell\n$v=\"1.5.4\"\
    ; iwr https://deno.land/x/install/install.ps1 -useb | iex\n```\n\n`# Homebrew\
    \ (MacOS):`\n\n```bash\nbrew install deno\n```\n\nCheck if Deno is installed by\
    \ running:\n\n`deno --version`\n\nDeno can be upgraded by running:\n\n`deno upgrade`\n\
    \nDeno can be upgraded to a specific version by running:\n\n`deno upgrade --version\
    \ 1.5.3`\n\n# Development tools\n\nProductivity, focus, and organization are critical\
    \ aspects of a developer’s day-to-day life. They allow us to manage and organize\
    \ our workflow so we can create more value with a systematic and organized approach.\n\
    \nDevelopment tools are one important aspect of software engineering that is often\
    \ ignored or sidelined. These tools are very helpful for increased productivity\
    \ and better organization. They let us focus on the prime part, that is, software\
    \ development, whereas they manage other factors efficiently for us. Let us have\
    \ an overview of some of the major tools used by developers worldwide.\n\n# Terminal\n\
    \nThis is where we live in the programming world for most of our time. Getting\
    \ familiar with it gives us an upper edge while planning and executing daily tasks\
    \ or scripts as they are known in the software world. This is the place where\
    \ we will execute Deno commands (from installing Deno to running Deno applications).\
    \ You could use UNIX terminal for Linux/mac or PowerShell for windows OS.\n\n\
    # zsh + oh my zsh\n\n`zsh` (Z shell) and `oh my zsh` (zsh framework) can level\
    \ up your overall development experience and productivity. Check out the GitHub\
    \ page for installation guides. Oh my zsh comes with some great plugins, as shown\
    \ in [figure 3.1].\n\n`Install zsh`\n\n[https://github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH](https://github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH)\n\
    \n`Install oh my zsh`\n\n[https://github.com/ohmyzsh/ohmyzsh](https://github.com/ohmyzsh/ohmyzsh)\n\
    \n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:** Terminal with zsh + oh my zsh\
    \ setup\n\n**Theme**: powerlevel10k\n\n**Plugins**: Git, zsh-syntax-highlighting,\
    \ and zsh-autosuggestions\n\n# Vim\n\nVim (also known as vi) is a legendary text\
    \ editor used for fast and efficient text operations. Vim has been in the industry\
    \ for decades and has maintained its ranking in the topmost editors for all these\
    \ years. It is a keyboard-centric application that focuses on keyboard commands\
    \ to perform complex text operations. Vim has its own keybinding, which needs\
    \ some time to get used to, resulting in better control over text manipulation\
    \ and cursor movements.\n\nThere are many legends associated with vim, and editor\
    \ war is perhaps the most famous of all. There is a famous legend about the rivalry\
    \ between vim and emacs back in the 90s. Vim can be used via VS Code Extension\
    \ or directly from the terminal.\n\n`Install vim`\n\n[https://www.vim.org/download.php](https://www.vim.org/download.php)\n\
    \n# VS Code\n\nVS Code is an open-source IDE developed by Microsoft. It is available\
    \ on all platforms (Windows, Linux, macOS) and is one of the most used IDE. It\
    \ is built with Electron—A JavaScript framework for cross-platform desktop applications.\
    \ [https://code.visualstudio.com/download](https://code.visualstudio.com/download)\n\
    \n# VS Code extensions\n\nWe will list a few useful extensions while developing\
    \ Deno:\n\n*   `Deno`: Enables Deno support\n*   `Prettier`: A code formatter\
    \ to prettify your code\n*   `ESLint`: A linter that analyses your code\n*   `Vim`:\
    \ Enables vim support\n*   `GitLens`: Visualized git experience\n\n# Git and GitHub\n\
    \n`Git` is a distributed version control system developed by `Linus Torvalds`\
    \ (Creator of the Linux kernel). It is widely used in the Software Industry for\
    \ code versioning and management. [https://git-scm.com/downloads](https://git-scm.com/downloads)\
    \ to install it on your OS.\n\n`GitHub` is a source code hosting site owned by\
    \ Microsoft. It uses `Git` for version control and source code management. [https://github.com/](https://github.com/)\
    \ to sign up if you have not.\n\n# Postman\n\nA platform for API development and\
    \ testing, it helps us manage the API collections and test our APIs with GUI.\
    \ [https://www.postman.com/downloads/](https://www.postman.com/downloads/) to\
    \ download and install Postman on your OS.\n\n# Docker\n\nDocker is a container-based\
    \ software development platform that runs the entire application as an isolated\
    \ process. It is a very useful tool in containerization and microservices. Docker\
    \ has brought the container revolution that changed the way an application is\
    \ developed and deployed.\n\n`Install docker`\n\n[https://docs.docker.com/engine/install/](https://docs.docker.com/engine/install/)\n\
    \n# Silver Searcher\n\n# Docker Compose\n\nDocker Compose is a tool developed\
    \ by the Docker team to compose and run multiple docker containers as a single\
    \ service. We will be using it to define multiple services/containers in the `docker-compose.yml`\
    \ file. We can then run all the defined services with the YAML configurations\
    \ using a single command.\n\n`Install docker-compose`\n\n[https://docs.docker.com/compose/install/](https://docs.docker.com/compose/install/)\n"
