    \n# CHAPTER 1 (#toc.xhtml_c01)\n\n# The Deno Land (#toc.xhtml_c01)\n\n# Introduction\
    \ (#toc.xhtml_s1a)\n\nAfter a decade of success of `Node` runtime, its creator\
    \ `Ryan Dahl` has come up with another exciting technology called `Deno`, which\
    \ is also a runtime like `Node` but is more secure and provides many improvements\
    \ and modern features in comparison to `Node`. Dahl stormed the development world\
    \ by announcing `Deno` during a `JSCONF EU` talk in 2018 named `10 things I Regret\
    \ about Node.js` (**https://www.youtube.com/watch?v=M3BM9TB-8yA**). Since then,\
    \ `Deno` has been a topic of excitement in the software industry.\n\n# Structure\
    \ (#toc.xhtml_s2a)\n\nIn this chapter, we will cover the following topics:\n\n\
    *   Introducing Deno\n    *   The Node revolution\n*   Comparison of Deno and\
    \ Node\n*   Deno features\n*   Deno foundation stack\n*   What is a JavaScript\
