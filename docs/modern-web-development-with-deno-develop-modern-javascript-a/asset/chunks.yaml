    \n# [CHAPTER 1](#toc.xhtml_c01)\n\n# [The Deno Land](#toc.xhtml_c01)\n\n# [Introduction](#toc.xhtml_s1a)\n\
    \nAfter a decade of success of **Node** runtime, its creator *Ryan Dahl* has come\
    \ up with another exciting technology called **Deno**, which is also a runtime\
    \ like Node but is more secure and provides many improvements and modern features\
    \ in comparison to Node. Dahl stormed the development world by announcing **Deno**\
    \ during a *JSCONF EU* talk in 2018 named *10 things I Regret about Node.js* (**https://www.youtube.com/watch?v=M3BM9TB-8yA**).\
    \ Since then, Deno has been a topic of excitement in the software industry.\n\n\
    # [Structure](#toc.xhtml_s2a)\n\nIn this chapter, we will cover the following\
    \ topics:\n\n*   Introducing Deno\n\n    *   The Node revolution\n\n*   Comparison\
    \ of Deno and Node\n\n*   Deno features\n\n*   Deno foundation stack\n\n*   What\
    \ is a JavaScript engine?\n\n*   What is a JavaScript runtime?\n\n# [Objectives](#toc.xhtml_s3a)\n\
    \nAfter studying this chapter, you will be familiar with the main features of\
    \ Deno and its internal architecture. You will also be able to understand the\
    \ reasons for the creation of Deno, the role of Node in the creation of Deno,\
    \ the similarities and differences between Deno and Node, and the stack used for\
    \ creating Deno, that is, Chrome V8 Engine by Google, Rust by Mozilla, and Tokio.\n\
    \nYou will also be familiar with how the JavaScript engine works and how the JavaScript\
    \ runtime works.\n\n# [Introducing Deno](#toc.xhtml_s4a)\n\nDeno is a secure and\
    \ modern JavaScript runtime that uses the V8 engine for JavaScript code conversion,\
    \ Tokio (written in Rust) for async event handling and the API backend written\
    \ in Rust. It provides features as follows:\n\n*   Integrated security. Access\
    \ to the network, file, and environment is provided only through flags.\n\n* \
    \  Built-in tools such as formatter, test-runner, debugger, linter, and so on.\n\
    \n*   Typescript support out of the box.\n\n*   Top-level await (without async).\n\
    \n*   ES Modules import (default).\n\n*   No package manager is required as module\
    \ imports are done using URLs.\n\nDeno is the creation of *Ryan Dahl*. Interestingly,\
    \ Dahl is also the creator of Node, which is also a runtime. In fact, Deno was\
    \ created to overcome the limitations of Node and provide modern features out\
    \ of the box, which is not part of Node runtime. Hence, the journey of Deno begins\
    \ with Node, which changed the way JavaScript was perceived and used in the industry.\
    \ It is a fact that JavaScript has become a widely used and revered language after\
    \ the entry of Node. Many developers are using only JavaScript for their entire\
    \ stack, thanks to Node. Therefore, to understand “*The Deno Evolution*”, one\
    \ must begin with “*The Node Revolution*”.\n\n# [The Node Revolution](#toc.xhtml_s5a)\n\
    \nA decade ago, JavaScript was mocked as a funny and peculiar language useful\
    \ mostly for front-end Web development. The scope of JavaScript was very limited\
    \ compared to mainstream languages like C++ or Java, as it was mainly useful for\
    \ browser-based applications only.\n\nIn 2009, *Ryan Dahl* introduced Node.js\
    \ to the world. **Node** is a JavaScript runtime written in C++ which uses V8\
    \ Engine by Google (launched in 2008) and **libuv** event loop to perform asynchronous\
    \ operations in the background. Since its release, Node.js has revolutionized\
    \ JavaScript usability and is being used by several tech giants such as PayPal,\
    \ LinkedIn, Netflix, and Uber to name a few. Let us see the features that led\
    \ to the rise of Node.\n\n# JavaScript everywhere\n\nNode has been the reason\
    \ that made JavaScript available outside the browser. Nowadays, JavaScript is\
    \ used for development across many domains. **Electron.js** is used for cross-platform\
    \ desktop apps, **React.js** for Web development, and **React Native** for mobile\
    \ development. Many companies and developers use JavaScript alone for their entire\
    \ stack as the code logic can be moved from client to server because both are\
    \ using the same language.\n\n# Asynchronous and event-driven architecture\n\n\
    Node is single-threaded, meaning it contains only one call stack that executes\
    \ only one program at a time. It has event-driven architecture. This means executions\
    \ in Node are done according to some event occurrence. Node uses an event loop\
    \ **libuv** to handle executions asynchronously, i.e., in a non-blocking way.\n\
    \n# Open-source and cross-platform\n\nNode is open source which is one of the\
    \ major factors for its popularity and acceptance amongst the developers.\n\n\
    Cross-platform support is also an amazing feature node offers to developers. It\
    \ works on OSX, Linux and Windows very well. Using this benefit, a developer can\
    \ write node code on OSX and can use Linux to deploy.\n\n# Very performant\n\n\
    Node uses V8 JavaScript Engine under the hood. The V8 engine is very fast, and\
    \ this makes the Node a very high-performing runtime. Performance is one of the\
    \ major feature node offers.\n\n# A node package manager (npm) for handling dependencies\n\
    \nNode package manager **`npm`** is used to install packages and manage package\
    \ dependencies. It is also a centralized registry where users can publish their\
    \ node packages.\n\n# [Event loop](#toc.xhtml_s6a)\n\nNode uses **libuv** event\
    \ loop for performing async i/o operations. The event loop uses workers and a\
    \ thread pool for performing operations in the background. It also checks if the\
    \ call stack is empty and the main programme has been executed so it can push\
    \ the code from the callback queue to the empty call stack. The JavaScript runtime\
    \ process is available in visualization here (**[http://latentflip.com/loupe/](http://latentflip.com/loupe/)**).\
    \ We will check the JavaScript runtime architecture in detail later in this chapter.\n\
    \nAlong with such great features, Node has several shortcomings, which led its\
    \ creator *Ryan Dahl* to start a new project (Deno). In the next section, we will\
    \ compare Deno with Node and see how Deno overcomes Node’s shortcomings.\n\n#\
    \ [Deno comparison with Node](#toc.xhtml_s7a)\n\nDeno was created to address the\
    \ shortcomings of Node. So, it would be evident that both of them will have many\
    \ similarities and differences. Let us check each of these.\n\n| **Feature** |\
    \ **Node** | **Deno** |"
