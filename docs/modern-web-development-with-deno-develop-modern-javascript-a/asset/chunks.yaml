    # [Conclusion](#toc.xhtml_s165a)


    We have implemented a svelte application UI in this chapter using various deno
    modules like **`snel`**, **`snel-carbon`**, **`axiod`**, and so on. Snel module
    is useful for creation of Svelte applications using deno runtime. **Snel-carbon**
    provides components, icons based on carbon design system. We used these components,
    icons to create our UI. **Axiod** is used to make network requests to the server.
    **Svelte Routing** module is used to define various routes (public and private)
    for the app. We used **trex** provided by snel by default to run the scripts.


    This knowledge will be helpful to set up a new deno project for Svelte UI Application.
    We can test the implementation by running it along with the API server from previous
    chapter. With this, our *Phonebook* App is completed and can be used locally or
    can be deployed to cloud using various platforms.


