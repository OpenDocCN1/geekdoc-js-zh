    \ “land”]`\n\n上面的代码带两个额外参数 `deno` 和 `land` 运行 `args.ts` 文件。由于 Deno 将文件名之后之后用空格分隔的所有条目都视为参数，这些条目通过\
    \ `Deno.args` 变量提供给 `args.ts` 文件。\n\n**注意：标志不应在脚本名称之后传递，因为它们会被视为参数。**\n\n在 `args.ts`\
    \ 脚本之前传递的 `--allow-net` 标志被视为一个`标志 (flag)`，如下代码所示：\n\n1. `deno run --allow-net\
    \ args.ts deno land # Args [“deno”, “land”]. allow-net is a flag.`\n\n在 `args.ts`\
    \ 脚本之后传递的 `--allow-net` 标志被视为一个**参数 (argument)**，如下代码所示：\n\n1. `deno run args.ts\
    \ name --allow-net # Args[“name”, “--allow-net”]. Allow-net is not a flag`\n\n\
    # 文件监听\n\nDeno 将带有 `--watch` 标志运行脚本，当文件变化时会自动重启脚本。这对于开发非常有用。\n\n```bash\ndeno\
    \ run --watch index.ts\n```\n\n# 权限标志\n\n默认情况下，Deno 脚本没有访问网络、文件系统或环境变量的权限。你必须使用标志显式授予这些权限。\n\
    \n| 标志 | 说明 |\n| :--- | :--- |\n| `--allow-net` | 允许访问网络 |\n| `--allow-read` |\
    \ 允许读取文件 |\n| `--allow-write` | 允许写入文件 |\n| `--allow-env` | 允许访问环境变量 |\n| `--allow-run`\
    \ | 允许执行子进程 |\n\n使用标志的示例：\n\n```bash\ndeno run --allow-net --allow-read=config.json\
    \ index.ts\n```\n\n"
