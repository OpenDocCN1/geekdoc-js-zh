    \ from \"https://deno.land/x/axiod/mod.ts\";\n  let name = \"\";\n  let email\
    \ = \"\";\n  let password = \"\";\n  let confirmPassword = \"\";\n  let loading\
    \ = false;\n  let errors = [];\n  const handleSubmit = (e) => {\n    if (password\
    \ === confirmPassword) {\n      loading = true;\n      const query = `\n    mutation{\n\
    \      registerUser(email:\"${email}\", password:\"${password}\", name:\"${name}\"\
    ){\n        name\n      }\n    }`;\n      axiod\n        .post(\"http://localhost:8080/graphql\"\
    , { query })\n        .then((res) => {\n          if (res.data.errors) {\n   \
    \         errors = res.data.errors;\n```\n\n"
- fmt: "\n```javascript\nerrors = res.data.errors;\n}\nif (res.data.data.registerUser?.name)\
    \ {\n  alert(`user ${res.data.data.registerUser.name} registered`);\n  navigate(\"\
    /contacts\", {\n    replace: false,\n    state: { accessToken: res.data.data.login\
    \ },\n  });\n})\n.catch((err) => {\n  console.log(`err`, err);\n});\n} else {\n\
    \  alert(\"Passwords do not match\");\n};\n</script>\n```\n\n```html\n{#each errors\
    \ as error}\n  <InlineNotification type=\"error\" title={error.message} />\n{/each}\n\
    ```\n\n<Tile>\n  <Form on:submit={handleSubmit}>\n    <TextInput\n      bind:value={name}\n\
    \      required\n      labelText=\"Name\"\n      placeholder=\"Enter Name\"\n\
    \      size=\"sm\"\n    />\n    <TextInput\n      bind:value={email}\n      required\n\
    \      type=\"email\"\n      labelText=\"Email\"\n      placeholder=\"Enter Email\"\
    \n      size=\"sm\"\n    />\n    <PasswordInput\n      bind:value={password}\n\
    \      required\n      type=\"password\"\n      labelText=\"Password\"\n     \
    \ placeholder=\"Enter Password\"\n      size=\"sm\"\n    />\n    <PasswordInput\n\
    \      bind:value={confirmPassword}\n      required\n      type=\"password\"\n\
    \      labelText=\"Confirm Password\"\n      placeholder=\"Enter Confirm Password\"\
    \n      size=\"sm\"\n    />\n    {#if loading}\n      <Loading />\n    {:else}\n\
    \      <Button type=\"submit\" size=\"small\">Register</Button>\n    {/if}\n \
    \ </Form>\n</Tile>\n\nAs we can see, the above code has many similarities with\
    \ `Login.svelte`. We have added two additional states `name` and `confirmPassword`\
    \ bound to an input component (`TextInput`, `PasswordInput`). In the `handleSubmit`\
    \ function, we are using `mutation` instead of `query` as we are creating a new\
    \ user on the backend. Figure 9.5 shows Register route with name, email, password\
    \ fields.\n\n### Home\nThis will be the home page for authenticated users. It\
    \ will be containing `Link` component that navigates to `contacts` path. The code\
    \ for this route is as follows:\n\n```javascript\nimport Link from \"svelte-routing\"\
    ;\n<h1>Home</h1>\n<Link to=\"contacts\">Contacts</Link>\n```\nFigure 9.6 shows\
    \ Home route with `Link` component for `Contacts` route.\n\n### NotFound\nWhenever\
    \ a user opens a non-existing path address, this route will get rendered. We have\
    \ used asterisk (`*`) for that purpose. The code for the route is as follows:\n\
    \n```javascript\nimport Link from \"svelte-routing\";\n<h2>Page Found</h2>\nGo\
    \ back to <Link=\"/\">Home</Link>\n<style>\n  h2 {\n    color: red;\n  }\n</style>\n\
    ```\nAbove code is a simple page with `Page Found` message and `Link` to Home\
    \ page. Figure 9.7 shows `NotFound` component rendered for undefined path.\n\n\
    ### Private route\nWhile Login, Register are public routes (no authentication\
    \ required), Home, Contacts are private routes and should only be accessible to\
    \ authenticated users. We will protect these pages by using `PrivateRoute` (a\
    \ custom route) instead of normal `Route`. The code for private route is as follows:\n\
    \n```javascript\nimport Route from \"svelte-routing/Route\";\nimport PrivateRouteGuard\
    \ from \"./PrivateRouteGuard.svelte\";\nexport let path;\n<Route {path}>\n  <PrivateRouteGuard>\n\
    \    <slot />\n  </PrivateRouteGuard>\n</Route>\n```\nIn the above code we are\
    \ using the `Route` component as wrapper. We are passing the `path` prop to it\
    \ which is an route address. The `slot` element is nothing but the component to\
    \ be rendered. We are wrapping it using `PrivateRouteGuard` component. The code\
    \ for `PrivateRouteGuard` is as follows:\n\n```javascript\nimport { onMount }\
    \ from \"svelte\";\nimport { navigate } from \"svelte-routing\";\nimport { accessToken\
    \ } from \"../utils/stores.ts\";\n\nonMount(() => {\n  console.log(\"Mounting...\"\
    );\n  if (!$accessToken) {\n    navigate(\"/login\", {\n      replace: false,\n\
    \    });\n  }\n});\n{#if $accessToken}\n  <slot />\n{/if}\n```\n\n`PrivateRouteGuard`\
    \ uses `onMount` function that gets called on mount. It checks the `accessToken`\
    \ value. If `accessToken` is null then it will navigate to `login` route else\
    \ it will render the child component. This route will be accessible to all the\
    \ users and lists all the contacts of the user. The code for contacts is as follows:\n\
    \n```javascript\nimport { onMount } from \"svelte\";\nimport Modal from \"svelte-carbon/Modal\"\
    ;\nimport axios from \"https://deno.land/x/axios/mod.ts\";\nimport ContactForm\
    \ from \"../components/ContactForm.svelte\";\nimport ContactTable from \"../components/ContactTable.svelte\"\
    ;\nlet showForm = false;\nlet contacts = [];\nconst accessToken = localStorage.getItem(\"\
    accessToken\");\nlet editContact = null;\nconst getContacts = () => {\n  console.log(\"\
    fetching contacts...\");\n  const query = `\n    contacts {\n      contactId\n\
    \      name\n      email\n      phone\n      address\n    }\n  `;\n  axios\n \
    \   .post(\"http://localhost:8080/graphql\",\n      query,\n      {\n        headers:\
    \ { Authorization: `Bearer ${accessToken}` },\n      }\n    )\n    .then((res)\
    \ => {\n      console.log(`res`, res);\n      if (res.data.errors) {\n       \
    \ for (let error of res.data.errors) {\n          alert(error.message);\n    \
    \    }\n      } else {\n        // console.log(`res.data.data.login`, res.data.data.login);\n\
    \        if (res.data.data?.contacts) {\n          contacts = res.data.data.contacts;\n\
    \        }\n      }\n    })\n    .catch((err) => {\n      console.log(`err`, err);\n\
    \    });\n  console.log(\"fetched\");\n};\nconst deleteContact = (contactId) =>\
    \ {\n  const query = `\n    mutation {\n      deleteContact(contactId:\"${contactId}\"\
    )\n    }\n  `;\n  axios\n    .post(\"http://localhost:8080/graphql\",\n      query,\n\
    \      {\n        headers: { Authorization: `Bearer ${accessToken}` },\n     \
    \ }\n    )\n    .then((res) => {\n      console.log(`res`, res);\n      if (res.data.errors)\
    \ {\n        for (let error of res.data.errors) {\n          alert(error.message);\n\
    \        }\n      } else {\n        getContacts();\n      }\n    });\n};\n```\n"
