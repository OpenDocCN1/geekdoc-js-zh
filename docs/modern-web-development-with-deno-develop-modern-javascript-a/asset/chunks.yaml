    **首次出版**：2023

    BPB Online 出版

    WeWork, 119 Marylebone Road

    London NW1 5PU

    **英国 | 阿联酋酋 | 印度 | 新加坡**


    ISBN 978-93-55510-969

    **[www.bpbonline.com](http://www.bpbonline.com)**


    # 献给


    *"献给世界上所有的开发者"*


    # 关于作者


    `Mayur` 是一位动态且以结果为导向的专业人士，对软件工程和完美追求充满激情。目前，他担任全栈软件工程师，参与多个使用 `Gatsby.js`、`Nikola`、`HTML`、`CSS`、`Bootstrap`
    和 `Javascript` 等项目。`Mayur` 还使用了各种设计模式，如 `CRUD`、`SearchBar`、`CSVDownloader`、`Loader`
    用于网络设备的 UI 创建，并针对每个模式编写了博客。他拥有浦那大学电子工程学士学位，以及电子与电信学文凭。此外，他在 Pluralsight 上拥有 60
    多项认证，涵盖 `React`、`React Native`、`GraphQL`、`Python`、`Django`、`Javascript` 等课程主题。他对哲学和灵性也感兴趣。


    # 关于评审员


    `Chad Elofson` 是一位使用 `Node` 和 `Deno` 技术的软件分析师。他在汤普森河流大学担任软件分析师。他在 19 年前作为网络管理员开始了他的
    IT 职业。在过去的八年里，他转向了基于 JavaScript 运行时技术的软件工程。


    # 致谢


    我感谢 BPB 出版团队给我编写这本书的机会。


    # 前言


    本书向开发者介绍了名为 `Deno` 的新 JavaScript 运行时。它还展示了如何使用 `Deno.js` 和 `TypeScript` 在前端后端创建
    Web 应用。


    本书为 Web 开发人员或 JavaScript 开发者提供了实用的方法。它也涵盖了一些实时示例。


    本书分为 **9 章**。将涵盖 Deno 简介、TypeScript 简介、使用 React 创建 Web 应用、GraphQL 简介、创建 GraphQL
    API 服务器、创建 Svelte 应用等。详情列如下：


    - **第一章** 将介绍 `Deno` 是什么、为什么由 `Node.js`（流行的 JavaScript 运行时）的作者引入 `Deno`、`Deno`
    与 `Node` 之间的差异等。将列出 `Deno` 的特性，解释创建 `Deno` 使用的不同技术。还将提供关于什么是 JavaScript 运行时以及什么是
    JavaScript 引擎的信息。

    - **第二章** 将介绍什么是 `TypeScript`、`TypeScript` 的优势、`TypeScript` 的特性等。它还将为 JavaScript
    开发者解释 `TypeScript` 的基础知识。并提供有关如何设置 `TypeScript` 的详细信息。

    - **第三章** 将提供如何安装 `Deno` 的详细信息。还将列出一些开发所需的常用开发者工具，如 `VS Code`、`Terminal` 等。

    - **第四章** 将涵盖 `Deno` 生态系统的详细信息。`Deno` 生态系统包括 `Deno CLI` 细节，如环境变量、子命令、如何传递参数、文件监听器、权限标志、权限白名单等。还将列出
    `Deno` 运行时 API，如 `Web APIs`、`Global APIs` 等。作为生态系统组成部分的 `Deno` 模块分为两类：标准库和第三方模块。还将列出模块注册中心，如
    Deno 自己的站点 `deno.land/x` 和 `nest.land`。

    - **第五章** 将介绍 `Aleph.js`，一个用于 `Deno` 的全栈 React 框架。它将列出页面、路由等概念。简要介绍使用 `GET`、`POST`、`DELETE`
    等 API 创建 `Todos` 应用。

    - **第六章** 将继续开发 `Todos` 应用并涵盖 UI 实现。它将提供如何使用样式组件库创建 React 组件的详细信息。提供 `Button`、`Input`
    等基础组件的代码。

    - **第七章** 将介绍 GraphQL 并提供精确获取、单端点等特性的细节。还将列出 `Type`、`Input`、`Mutation`、`Resolver`
    等核心概念。随后引入 `oak` 模块以及 `oak-graphql`，将用于实现 GraphQL 服务器。

    - **第八章** 将涵盖使用 `oak, oak-graphql` 创建电话簿应用的 GraphQL 实现。将提供如何创建 git 仓库、使用 `trex`
    作为包管理器以及使用 `velocaptor` 作为脚本运行器的详细信息。还将提供使用 ORM 进行数据库设置和认证的代码。

    - **第九章** 将介绍富有前景的 JavaScript 框架或编译器 `Svelte`。`Snel` 是一个使用 `Deno` 创建 Svelte 应用的模块。它将涵盖
    `Snel` 和 `snel-carbon`（UI 组件模块）的设置过程。随后提供为应用设置公私有路由的代码。以及 Svelte 组件。


