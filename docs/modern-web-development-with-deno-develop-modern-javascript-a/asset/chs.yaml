  \n我们向某些组件传递函数。这些函数根据 props 设置值。我们使用 `Text` 和 `Input` 组件中的 `completed` 属性来调整颜色和装饰线。我们使用\
  \ `Button` 组件中的 `primary` 标记来调整颜色。\n\n### 创建 Todos 组件\n\n现在我们将在 `TodoDetails` 和\
  \ `TodoList` 组件中使用自定义样式组件。我们将首先在 `pages/index.tsx` 文件中添加 `TodoList` 组件，它是我们项目的入口，如下：\n\
