  71. export default TodoDetails;\n```\n\n\n\n在本章中，我们将学习核心 `Graph Query Language`（`GraphQL`）概念及其特性。在涵盖了基础知识后，我们将在接下来的章节中利用这些概念为\
  \ `Phonebook` 应用创建一个 API 服务器（`GraphQL`）。我们还将介绍 `Oak Web` 框架和 `Oak GraphQL`。两者都将在后续章节中用于\
  \ GraphQL API 服务器的实现。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   GraphQL 简介\n    *   特性\n\
  \        *   精确获取\n        *   单一 API 端点\n        *   验证与类型检查\n        *   片段 (Fragments)\n\
  \        *   自动生成的 API 文档\n    *   核心概念\n        *   Schema（模式）\n            * \
  \  类型 (Type)\n            *   输入 (Input)\n            *   查询 (Query)\n         \
  \   *   变更 (Mutation)\n            *   关系 (Relationship)\n        *   Resolver（Resolver）\n\
  *   引入 Oak 框架\n*   引入 Oak-GraphQL\n\n### 目标\n\n完成本章后，你将能够理解并应用 GraphQL 核心概念，如查询、变更、解析器、类型定义等。你还应该能够使用\
  \ Oak 框架创建 Deno Web 服务器，并使用 Oak-GraphQL 模块创建 GraphQL 服务器。\n\n### 引入 GraphQL\n\n\
  GraphQL 是由 Facebook 开发并在 2015 年发布的开源 API 查询语言。它允许客户端控制解析后的数据结构，而不是 REST 中固定的数据结构。通过这种方式，客户端可以仅`query`\
  \ 所需精确数据。它还允许 `mutations`（写入或更改数据）和 `subscriptions`（订阅数据更新）。许多大型组织如 Facebook、GitHub、Coursera\
  \ 和 Pinterest 等都在使用它。\n\n### 特性\n\nGraphQL 允许客户端在单个请求中跨多个资源`查询或更改数据`。它创建了一个单一入口或\
  \ API 端点 POST `/graphql` 来查询或更改数据。GraphQL 提供的解析数据格式与请求查询的格式相同。其他 GraphQL 特性将详细说明如下。\n\
  \n### 精确获取\n\n通过允许仅获取所需的数据，GraphQL 解决了数据相关问题，即客户端获取了多于所需的数据（过度获取）或少于所需的数据（获取不足）。\n\
  \n### 单一 API 端点\n\n与 REST 不同，GraphQL 始终有一个单一的端点 `/graphql (POST)`，客户端可以使用它来获取 schema\
  \ 中定义的任何数据，因为 GraphQL 使用通过请求体传递的 `query` 来解析请求。\n\n*[图 7.1]* 通过在正文中提供所示的 `users`\
  \ 查询使用 `/graphql` 端点获取 `users` 数据：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:** 获取用户\n\
  \n*[图 7.2]* 通过在正文中提供所示的 `todos` 查询使用相同的端点 `/graphql` 获取 `Todos 数据`：\n\n![](img/Figure-7.2.jpg)\n\
  \n**图 7.2:** 获取 Todos\n\n如`[图 7.1]`和`[7.2]`所示，GraphQL 允许通过单一 API 端点使用`query 操作`来获取\
  \ `users` 和 `todos`。\n\n我们甚至可以在单个请求中获取 `users` 和 `todos`。这是 GraphQL 一个非常强大的特性，允许客户端在单个请求中获取所有所需数据，这对于网络较慢的设备极其有用。\n\
  \n*[图 7.3]* 所示如何在单个请求中同时获取 `users` 和 `todos`：\n\n![](img/Figure-7.3.jpg)\n\n**图\
  \ 7.3:** 获取用户和 Todos\n\n### 验证与类型检查\n\nGraphQL 使用`type system` 来验证查询。客户端可以在发送请求之前检查哪些字段是可选（带有字段类型），以及查询是否有效。\n\
  \n*[图 7.4]* 展示了针对 `todos` 的验证和类型检查概念，其中 schema 中未定义 `someField` 字段：\n\n![](img/Figure-7.4.jpg)\n\
  \n**图 7.4:** 验证\n\n### 片段 (Fragments)\n\nGraphQL 允许编写可重用的代码 `fragment`，该片段可以在多个查询之间使用。我们可以创建一个片段来替换重复的代码单元，使查询更整洁、更具可读性。\n\
  \n*[图 7.5]* 显示了 `todos`（获取所有 Todos）和 `todo`（通过 id 获取单个 Todo）查询中重复的代码单元：\n\n![](img/Figure-7.5.jpg)\n\
  \n![](img/Figure-7.5.jpg)\n\n**图 7.5:** 重复的代码单元\n\n我们将把重复的代码单元移动到 `todoData` 片段中，并在两个查询中使用扩展运算符（`…`）使用它。\n\
  \n*[图 7.6]* 展示了使用 `fragment` 获取 `todos` 和 `userData`。\n\n### 自动生成的 API 文档\n\nGraphQL\
  \ 为*queries*和*mutations*生成 API 文档。*图 7.7* 显示了 `todo` 的自动生成文档。如果我们把 `user` 改为 `Int`，文档将反映此变化。\n\
  \n### 核心概念\n\nGraphQL 提供了一个解析请求的 `Resolver`，以及用于读取数据的 `query`、用于写入数据的 `mutations`\
  \ 和用于实时数据的 `subscription`。\n\n### Schema\n\n`type system` 是客户端和服务器之间的约，定义了数据的形状。它定义了描述实体或字段的\
  \ `types`。GraphQL 使用 Schema 定义语言 (SDL) 来定义 schema。一个示例应用定义如下：\n\n```graphql\ntype\
  \ User {\n  userId: String!\n  name: String!\n  todos: [Todo!]\n}\n\ntype Todo {\n\
  \  todoId: String!\n  title: String!\n  user: User!\n}\n\ninput UserInput {\n  name:\
  \ String!\n}\n\ninput TodoInput {\n  title: String!\n  userId: String!\n}\n\ntype\
  \ Query {\n  todos: [Todo!]\n  todo(todoId: String!): Todo!\n  users: [User!]\n\
  \  user(userId: String!): User!\n}\n\ntype Mutation {\n  addTodo(todo: TodoInput!):\
  \ Todo\n  addUser(user: UserInput!): User\n}\n```\n\n此 schema 也可以通过 GraphQL Playground\
  \ 查看，如`[图 7.9]`所示。\n\n![](img/Figure-7.9.jpg)\n\n**图 7.9:** GraphQL schema\n\n解释上述\
  \ schema 中使用的各种关键字（`type` 和 `input`）：\n\n### Type\n\nType 用于定义解析查询的形状。图 7.9 所示的\
  \ schema 定义了两个对象类型 `User` 和 `Todo`。`User` 类型定义了字段 `userId`、`name` 和 `todos`（`Todo`\
  \ 对象数组）。`Todo` 类型定义了字段 `todoId`、`title` 和 `user`（类型为 `User`）。这两个对象类型都被 `Query` 类型用于以返回相应的数据。\n\
  \n### Input\n\nInput 用于定义变更的数据结构。\n\n\n\n\nInput 用于定义在 `mutation` 过程中客户端输入的形状。它定义了两个\
  \ `input types`（输入类型）：`UserInput` 和 `TodoInput`。`UserInput` 接受一个 `name` 参数，而 `TodoInput`\
  \ 接受 `title` 和 `userId` 参数。这两个输入类型都用于通过 `mutation` 类型创建或更新相应的实体。\n\n### Query\n\n\
  定义由客户端执行的 `read` 操作的入口。query 中定义了四个字段：`todos`、`todo`、`users` 和 `user`。`todos` 和\
  \ `users` 字段不接受参数并返回对应类型的数组。`todo` 和 `user` 字段接受实体的 `id` 并返回对应类型的实体。\n\n### Mutation\n\
  \n定义由客户端执行的 `write` 操作的入口。该类型中定义了 `addTodo` 和 `addUser` 字段。`addTodo` 接受类型为 `TodoInput`\
  \ 的参数并返回 `Todo` 类型的数据，而 `addUser` 接受类型为 `UserInput` 的参数并返回 `User` 类型的数据。\n\n###\
  \ Relationship\n\nTodos schema 定义了 `User` 类型和 `Todo` 类型之间的“一对多”关系。这意味着每个 `Todo`\
  \ 拥有`一个`用户，而每个 `user` 拥有`多个` Todo。\n\n如`[图 7.10]`所示，GraphQL 赋予了客户端活性，可以在单个查询中获取所有与用户相关的\
  \ Todos。\n\n![](img/Figure-7.10.jpg)\n\n**图 7.10:** 关系\n\n### Resolver\n\nResolver\
  \ 是一个函数，通过为 schema 中的单个字段填充数据来解析 `query` 或 `mutation`。以下代码演示了为之前定义的 schema 使用 `resolvers`：\n\
  \n```javascript\nexport const resolvers = {\n  Query: {\n    todos: (parent: any,\
  \ args: any, context: any, info: any) => {\n      if (args.userId) return getTodosByUserId(args.userId);\n\
  \      return getTodos();\n    },\n    todo: async (parent: any, args: any, context:\
  \ any, info: any) => {\n      return getTodo(args._id);\n    },\n    users: (parent:\
  \ any, args: any, context: any, info: any) => {\n      return getUsers();\n    },\n\
  \    user: async (parent: any, args: any, context: any, info: any) => {\n      return\
  \ getUser(args._id);\n    },\n  },\n  Mutation: {\n    addTodo: async (parent: any,\
  \ args: any, context: any, info: any) => {\n      const { title, userId } = args.todo;\n\
  \      return createTodo(title, userId);\n    },\n    addUser: async (parent: any,\
  \ args: any, context: any, info: any) => {\n      const { name } = args.user;\n\
  \      const user = createUser(name);\n      return user;\n    },\n  },\n  Todo:\
  \ {\n    title: (parent: any, args: any, context: any, info: any) => {\n      return\
  \ parent.title;\n    },\n    user: async (parent: any, args: any, context: any,\
  \ info: any) => {\n      const user = await info.rootValue.user(\n        parent,\n\
  \        { _id: parent.userId },\n        context,\n        info\n      );\n   \
  \   return user;\n    },\n  },\n  User: {\n    name: (parent: any, args: any, context:\
  \ any, info: any) => {\n      return parent.name;\n    },\n    todos: async (parent:\
  \ any, args: any, context: any, info: any) => {\n      const todos = await resolvers.Query.todos(\n\
  \        parent,\n        { userId: parent._id },\n        context,\n        info\n\
  \      );\n      return todos;\n    },\n  },\n};\n```\n\n让我们看看上述代码中发生了什么。我们定义了 `Query`、`Mutation`、`Todo`\
  \ 和 `User` 对象。`Query` 对象包含 `todos`（列表）、`todo`、`users` 和 `user` 对象。同样，`Mutation`\
  \ 包含 `addTodo` 和 `addUser` 对象，每个对象具有相同的签名。其他对象 `User` 和 `Todo` 用于解析各自类型的内部字段（title\
  \ 等）。数据随后可以从各种来源中获取。每个对象之前都接受可选参数：`parent`、`args`、`context` 和 `info`。\n\n`parent`\
  \ 是字段父字段的返回值，`args` 包含所有 GraphQL 参数，`context` 是一个内容在所有 resolver 中可用的对象，而 `info`\
  \ 包含如字段名、路径等信息。\n\n### Oak framework\n\nOak 是一个用于 Deno 的 Web 框架，灵感来源于 node.js 的\
  \ `koa` 框架。它提供了在请求和响应之间调用的中间件函数。Oak 提供了 `use()` 方法来使用中间件函数。以下代码演示了 oak 中的 `Hello\
  \ World` 服务器：\n\n```javascript\nimport { Application } from \"https://deno.land/x/oak@v7.7.0/mod.ts\"\
  ;\n\nconst app = new Application();\n\napp.use((ctx) => {\n  ctx.response.body =\
  \ \"Hello World!\";\n});\n\nawait app.listen({ port: 8000 });\n```\n\n在上述代码中，`Application`\
  \ 实例 `app` 使用 `context` 调用每个中间件，`context` 包含了必要的信息如 `app`、`cookies`、`request`、`response`、`state`、`assert()`\
  \ 和 `throw()`。最后，服务器使用 `listen()` 方法在端口 `8000` 上监听。\n\n### Oak-GraphQL middleware\n\
  \nOak-GraphQL 模块允许我们在 oak 服务器之上创建 GraphQL API。我们将使用 Oak-GraphQL 中间件来实现 GraphQL API。简单的\
  \ Hello World GraphQL API 可以如下设置：\n\n```typescript\n// oak_graphql_server.ts\nimport\
  \ {\n  Application,\n  Router,\n  RouterContext,\n} from \"https://deno.land/x/oak@v9.0.0/mod.ts\"\
  ;\nimport {\n  applyGraphQL,\n  gql,\n  GQLError,\n}\n\nconst types = gql`\n  type\
  \ Query {\n    hello(name: String): String\n  }\n`;\n\nconst resolvers = {\n  Query:\
  \ {\n    hello: (parent: any, { name }: any, context: any, info: any) => {\n   \
  \   if (!name) throw new GQLError(\"Name not provided\");\n      return `Hello ${name}`;\n\
  \    },\n  },\n};\n\nconst GraphQLService = await applyGraphQL<Router>({\n  Router,\
  \ // 同于 Router:\n  typeDefs: types,\n  resolvers: resolvers,\n});\n\nconst app =\
  \ new Application();\napp.use(GraphQLService.routes(), GraphQLService.allowedMethods());\n\
  \nconsole.log(\"Server listening on http://localhost:8080/graphql\");\nawait app.listen({\
  \ port: 8000 });\n```\n\n如果我们使用命令 `deno run --allow-net oak_graphql_server.ts` 运行上述代码，并在\
  \ URL `http://localhost:8080/graphql` 中查询 `{ hello(name: “ABC”) }`，我们应该看到如 `[图 7.11]`\
  \ 所示的结果如下：\n\n\n\n\n\n![](img/Figure-7.11.jpg)\n\n**图 7.11:** GraphQL API Hello\
  \ World\n\n### 结论\n\n我们已经涵盖了 GraphQL 的基本功能和概念，例如模式（schema）、解析器（resolver）以及类型（type）、查询（query）和变更（mutation）。我们还介绍了用于创建\
  \ Web 服务器的 `oak` 框架以及用于创建 GraphQL 服务器的 `Oak-GraphQL` 模块。\n\n在接下来的章节中，我们将使用上述 GraphQL\
  \ 概念，利用 `Oak` 和 `Oak-GraphQL` 模块为电话录应用创建一个 GraphQL API 服务器。\n\n# 第 8 章\n\n## 电话录应用—API\
  \ 实现\n\n### 引言\n\n在本章中，我们将实现**图形查询语言**（**GraphQL 应用程序接口**服务器。我们之前学习的 GraphQL 基础将在本章用于\
  \ API 实现。我们将使用之前介绍的 `oak` 和 `oak-graphql` 模块来实现 API 服务器。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   初始化设置\n    *   使用 `git` 进行版本控制\n    *   使用 `Trex` 作为包管理器\n    *   使用 `Velociraptor`\
  \ 作为脚本运行器\n*   `Oak GraphQL` 服务器设置\n*   模式 (Schema)\n*   解析器 (Resolvers)\n*   `DenoDB`\
  \ 设置\n    *   数据库 (DB)\n        *   `ElephantSQL PostgreSQL` 设置\n    *   模型 (Models)\n\
  \        *   `User`\n        *   `Contact`\n    *   控制器 (Controllers)\n*   身份验证\n\
  \n### 目标\n\n完成本章后，你将能够使用 `Oak` 和 `Oak-GraphQL` 模块创建 GraphQL API 服务器。你将学习使用 `denodb`\
  \ 模块通过**对象关系映射 (ORM)** 连接到 MySQL、PostgreSQL、NoSQL 等数据库。你还将学习使用 `djwt` 模块通过 **JSON\
  \ Web 令牌 (JWT)** 验证用户身份。你也将学习使用 `trex` 和 `velociraptor` 模块设置 Deno 服务器项目。\n\n###\
  \ 初始化设置\n\n我们将通过初始化 git 仓库开始编写代码。然后我们将安装 `oak` 和 `oak-graphql` 模块来创建 Web 服务器。我们将使用\
  \ `trex` 包管理模块来安装这些模块。\n\n### 使用 git 进行版本控制\n\n*[图 8.1]* 显示了 git 仓库初始化、安装 `trex`\
  \ 模块以及使用 `trex` 模块安装 `oak` 和 `oak-graphql`。\n\n![](img/Figure-8.1.jpg)\n\n**图 8.1:**\
  \ 初始化设置\n\n### Trex 作为包管理器\n\nTrex 缓存已安装的包并将其添加到 `import_map.json` 文件中。[图 8.2]*\
  \ 显示了 `import_map.json` 文件中已安装模块列表（`oak`、`oak-graphql`）。\n\n![](img/Figure-8.2.jpg)\n\
  \n**图 8.2:** import_map.json 中的安装模块\n\n已安装的模块可以通过以下方式访问：\n\n1.  `import { Application\
  \ } from “oak”;`\n\n### Velociraptor 作为脚本运行器\n\n在 `src` 文件夹中创建一个名为 `mod.ts` 文件，代码如下：\n\
  \n```javascript\nconsole.log(\"Hello Velociraptor!\");\n```\n\n你可能会问什么是 velociraptor。它是用于\
  \ Deno 的脚本运行器模块。我们将安装 velociraptor 并使用它运行 `mod.ts` 文件。可以使用 [`nest.land/`](https://nest.land/)\
  \ 包注册表按照如下方式安装 velociraptor：\n\n```bash\ndeno install -qAn vr https://x.nest.land/velociraptor@1.1.0/cli.ts\n\
  ```\n\n现在我们将创建 `scripts.yaml` 文件以添加运行 `mod.ts` 文件的脚本。Veliraptor 将扩展名为 `yml`、`yaml`、`json`\
  \ 和 `ts` 且名为 `scripts` 或 `velociraptor` 的文件识别为脚本文件。\n\n*[图 8.3]* 显示了带有执行 `src/mod.ts`\
  \ 文件的 `dev` 脚本的 `scripts.yaml` 文件。\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3:** scripts.yaml\
  \ 文件\n\n如果我们在终端中运行 `vr` 命令，将看到可用脚本列表。然后我们可以如下所示运行可用脚本：\n\n```bash\nvr dev\n```\n\
  \n*[图 8.4]* 显示了列出可用脚本和运行脚本的命令。\n\n![](img/Figure-8.4.jpg)\n\n**图 8.4:** Velociraptor\
  \ CLI\n\n我们已经使用 trex 和 velociraptor 设置了一个 Deno 服务器项目。现在，我们将在下一节中设置 Web 服务器。\n\n\
  ### Oak GraphQL 设置\n\n我们将使用 `oak` 和 `oak-graphql` 模块设置一个简单的 GraphQL 服务器。我们将使用第 7\
  \ 章“GraphQL 简介”中的 `oak-graphql` 代码，并进行少量更改来设置服务器。我们不再需要提到 URL。相反，我们可以在 `import_map.json`\
  \ 中提到模块名。\n\n```javascript\nimport { Application, Router } from \"oak\";\nimport\
  \ { gql, GQLError } from \"oak-graphql\";\n```\n\n我们将通过拥有 `mod.ts`（主文件）、`middlewares.ts`（GraphQL\
  \ 中间件）、`schema.ts`（GraphQL 模式/类型定义）和 `resolvers.ts`（GraphQL 解析器）文件来构建项目。[图 8.5]*\
  \ 显示了项目结构：\n\n![](img/Figure-8.5.jpg)\n\n**图 8.5:** 项目结构\n\n我们将逐个编写每个文件的代码，从 `mod.ts`\
  \ 文件开始如下：\n\n```javascript\n// src/mod.ts\nimport { Application } from \"oak\";\n\
  import { GraphQLService } from \"./middlewares.ts\";\nconst app = new Application();\n\
  app.use(GraphQLService.routes(), GraphQLService.allowedMethods());\nconsole.log(\"\
  Server listening on http://localhost:8080/graphql\");\nawait app.listen({ port:\
  \ 8080 });\n```\n\n在前面的代码中，我们正在创建一个带有名为 `GraphQLService` 的 de 间件的 oak 服务器，可以通过 `/graphql`\
  \ 路由访问。\n\n```javascript\n// src/schema.ts\nimport { gql } from \"oak_graphql\"\
  ;\nexport const types = gql`\n  type Query {\n    hello(name: String): String\n\
  \  }\n`;\n```\n\n在 `schema.ts` 文件中，我们定义了一个接受 `name` 参数的 `hello` 查询。GraphQL 根据 `types`\
  \ 中定义的模型进行验证。进入请求将由 `resolvers` 解析。\n\n```javascript\n// src/resolvers.ts\nimport\
  \ { GQLError } from \"oak_graphql\";\nexport const resolvers = {\n  Query: {\n \
  \   hello: (parent: any, { name }: any, context: any, info: any) => {\n      if\
  \ (!name) throw new GQLError(\"Name not provided\");\n      return `Hello ${name}`;\n\
  \    },\n  },\n};\n```\n\n我们需要更新 `scripts.yaml` 文件以 `import_map` 文件路径和权限。更新后的文件具有如下代码：\n\
  \n```yaml\n## scripts.yaml\nimap: import_map.json\nunstable: true\nallow:\n  - net\n\
  scripts:\n  dev:\n    cmd: src/mod.ts\n    desc: \"run graphql server in dev mode\"\
  \n    watch: true\n```\n\n在前面的代码中，`imap` 指向 `import_map` 文件路径，`unstable` 标志允许执行不\
  \ Deno 功能，`allow` 包含了网络访问。我们为 `dev` 命令添加了 `cmd`（执行命令）、`desc`（描述）和 `watch`（文件监听）字段。\n\
  \n### 模式 (Schema)\n\n模式是一种定义数据形状的系统。它为客户端提供可用的数据字段、查询和变更。我们已经在后续章节中通过代码学习了模式相关的概念。我们将按照所示代码为\
  \ `User` 和 `Contact` 实体添加 `types`、`queries` 和 `mutations`：\n\n```javascript\n//\
  \ src/schema.ts\nimport { gql } from \"oak_graphql\";\nexport const types = gql`\n\
  \  type User {\n    userId: String!\n    name: String!\n    contacts: [Contact!]!\n\
  \    email: String!\n  }\n  type Contact {\n    contactId: String!\n  }\n`;\n```\n\
  \n\n\n\n\n```graphql\n  name: String!\n  phone: String\n  email: String\n  address:\
  \ String\n  user: User!\n}\ntype Login {\n  token: String!\n}\ninput RegisterUserInput\
  \ {\n  name: String!\n  email: String!\n  password: String!\n}\ninput LoginUserInput\
  \ {\n  email: String!\n  password: String!\n}\ninput UpdateUserInput {\n  name:\
  \ String\n}\ninput CreateContactInput {\n  name: String!\n  phone: String\n  email:\
  \ String\n  address: String\n}\ninput UpdateContactInput {\n  contactId: String!\n\
  \  name: String\n  phone: String\n  email: String\n  address: String\n}\ntype Query\
  \ {\n  user: User\n  contacts: [Contact]\n  contact(contactId: String!): Contact\n\
  \  login(user: LoginUserInput): Login\n}\ntype Mutation {\n  registerUser(user:\
  \ RegisterUserInput!): User\n  deleteUser: Boolean\n  updateUser(user: UpdateUserInput!):\
  \ Boolean\n  addContact(contact: CreateContactInput!): Contact\n  deleteContact(contactId:\
  \ String!): Boolean\n  updateContact(contact: UpdateContactInput!): Boolean\n}\n\
  ```\n\n\n\n\n\n```javascript\n71.  if (contactId) return updateContact(contactId,\
  \ contactData);\n72.  },\n73.  },\n74.  User: {\n75.    name: (parent: any, args:\
  \ any, context: any, info: any) => {\n76.      return parent.name;\n77.    },\n\
  78.    contacts: async (parent: any, args: any, context: any, info: any) => {\n\
  79.      const contacts = await resolvers.Query.contacts(\n80.        parent,\n\
  81.        {},\n82.        context,\n83.        info\n84.      );\n85.      return\
  \ contacts;\n86.    },\n87.  },\n88.  Contact: {\n89.    name: (parent: any, args:\
  \ any, context: any, info: any) => {\n90.      return parent.name;\n91.    },\n\
  92.    user: async (parent: any, args: any, context: any, info: any) => {\n93. \
  \     return await userLoader.load(parent.userId);\n94.    },\n95.  },\n96. };\n\
  ```\n\n我们的解析器（resolvers）代码基于上一章节的解析器代码。我们定义了 `Query`、`Mutation`、`User` 和 `Contact`\
  \ 对象，每个对象包含解析器。`Query` 对象包含 `user`、`contacts`、`contact` 和 `login` 解析器。`Mutation`\
  \ 包含 `registerUser`、`updateUser`、`deleteUser`、`addContact`、`updateContact` 和 `deleteContact`\
  \ 解析器。其他对象 `User` 和 `Contact` 用于解析相应类型的内部字段（名称等）。数据可以从各种来源获取。每个解析器函数都接受可选参数 `parent`、`args`、`context`\
  \ 和 `info`，这些在上一章节中已经解释过。\n\n图 8.6 显示了 `resolvers.ts` 文件中所有解析器的列表\n\n![](img/Figure-8.6.jpg)\n\
  \n**图 8.6：** 解析器\n\n在解析查询时，我们需要执行诸如数据库读/写、身份验证等操作。我们在 `controllers.ts` 文件中处理数据库操作，并在\
  \ `auth.ts` 文件中处理身份验证。\n\n将在 `models.ts` 文件中定义的数据库模型 `User` 和 `Contact` 执行查询、创建、更新和删除操作。我们需要设置数据库并将其与模型链接，以便在控制器中使用这些模型。让我们使用名为\
  \ `denodb` 的 Deno 模块来设置数据库并创建模型。\n\n## 数据库设置\n\n我们将使用 `ElephantSQL` 设置一个 PostgreSQL\
  \ 数据库。访问 [`www.elephantsql.com/`](https://www.elephantsql.com/) 并使用你的账户登录/注册。完成后，我们需要创建一个名为\
  \ `phonebook` 的实例，并选择 `tiny turtle (free)` 计划。打开创建的实例，并复制 `Details` 部分提到的 `URL`。我们将在\
  \ `.env` 文件中如下设置名为 `DATABASE_URL` 的环境变量：\n\n1. `// .env`\n2. `// 将以下 url 替换为 elephantsql\
  \ url`\n3. `DATABASE_URL=postgres://deno_admin:deno_admin@localhost:5432/deno_db`\n\
  \n现在，为了在代码中访问 `DATABASE_URL`，我们将在 `scripts.yaml` 文件中带有 `.env` 文件的 `envFile` 标记：\n\
  \n1. `# scripts.yaml`\n2. `…`\n3. `allow:`\n4. `  - net`\n5. `  - env`\n6. `  envFile:`\n\
  7. `  - .env`\n8. `…`\n\n使用 `deno add -c https://deno.land/x/denodb/mod.ts` 安装 `denodb`，并在\
  \ `db.ts` 文件中使用 `PostgresConnector` 连接数据库 URL：\n\n```typescript\nimport { Database,\
  \ PostgresConnector } from \"denodb\";\nconst DATABASE_URL = Deno.env.get(\"DATABASE_URL\"\
  ) as string;\nconst connector = new PostgresConnector({\n  uri: DATABASE_URL,\n\
  });\nexport const db = new Database(connector);\n```\n\n下一节将使用上述数据库并链接数据库模型 `User`\
  \ 和 `Contact`。\n\n### 模型\n\n我们将使用 `denodb` 模块中的 `Model`、`DataTypes` 和 `Relationships`\
  \ 定义两个模型：`User` 和 `Contact`。两个模型的代码如下：\n\n```typescript\n// src/models.ts\nimport\
  \ { Model, DataTypes, Relationships } from \"denodb\";\nimport { db } from \"./db.ts\"\
  ;\nimport { v4 } from \"uuid\";\n\nexport class User extends Model {\n  static table\
  \ = \"users\";\n  static timestamps = true;\n  static fields = {\n    userId: {\n\
  \      type: DataTypes.STRING,\n      primaryKey: true,\n    },\n    name: { type:\
  \ DataTypes.STRING, length: 50 },\n    isActive: { type: DataTypes.BOOLEAN },\n\
  \    email: { type: DataTypes.STRING },\n    password: { type: DataTypes.STRING\
  \ },\n  };\n  static defaults = {\n    userId: v4.generate,\n    name: \"ABC\",\n\
  \    isActive: true,\n  };\n  static contacts() {\n    return this.hasMany(Contact);\n\
  \  }\n}\n\nexport class Contact extends Model {\n  static table = \"contacts\";\n\
  \  static timestamps = true;\n  static fields = {\n    contactId: {\n      type:\
  \ DataTypes.STRING,\n      primaryKey: true,\n    },\n    name: { type: DataTypes.STRING,\
  \ length: 100 },\n    phone: { type: DataTypes.STRING, length: 50, allowNull: true\
  \ },\n    email: { type: DataTypes.STRING, length: 100, allowNull: true },\n   \
  \ address: { type: DataTypes.STRING, length: 200, allowNull: true },\n  };\n  static\
  \ defaults = {\n    contactId: v4.generate,\n    name: \"Learn Deno\",\n    isCompleted:\
  \ false,\n  };\n  static user() {\n    return this.hasOne(User);\n  }\n}\n\nRelationships.belongsTo(Contact,\
  \ User);\ndb.link([User, Contact]);\nawait db.sync({ drop: true });\n```\n\n对于两个模型，我们定义了\
  \ `table`、`timestamps`、`fields`、`defaults` 和 `relationship` 静态属性。`table` 将是数据库表的名称，例如\
  \ `User` 模型对应 `users`，`Contact` 模型对应 `contacts`。我们将 `timestamps` 设置为 `true` 以为模型添加\
  \ `created_at` 和 `updated_at` 字段。\n\n### 控制器\n\n我们需要通过控制器将解析器与模型映射。每个控制器将对模型执行数据库操作，以获取、创建、更新和删除实体。所有的控制器函数都添加到\
  \ `controllers.ts` 文件中：\n\n```typescript\nimport { User, Contact } from \"./models.ts\"\
  ;\nimport { GQLError } from \"oak_graphql\";\nimport DataLoader from \"dataloader\"\
  ;\nimport { hash } from \"scrypt\";\n\ninterface IContact {\n  name: string;\n \
  \ phone: string;\n  email: string;\n  address: string;\n}\n```\n\n\n\n\n\n```typescript\n\
  export const getUser = async (userId: string) => {\n  return await User.find(userId);\n\
  };\n\nexport const getUserByEmail = async (email: string) => {\n  const existingUser\
  \ = await User.where(\"email\", email).first();\n  return existingUser;\n};\n\n\
  export const createUser = async (\n  name: string,\n  email: string,\n  password:\
  \ string\n) => {\n  const existingUser = await getUserByEmail(email);\n  if (existingUser)\
  \ throw new GQLError(\"User already exists\");\n  const hashedPassword = await hash(password);\n\
  \  const user = await User.create({ name, email, password: hashedPassword });\n\
  \  return user;\n};\n\nexport const deleteUser = async (userId: string) => {\n \
  \ await Contact.where(\"userId\", userId).delete();\n  await User.deleteById(userId);\n\
  \  return null;\n};\n\nexport const updateUser = async (userId: string, userData:\
  \ any) => {\n  await User.where(\"userId\", userId).update(userData);\n  return\
  \ null;\n};\n\nexport const getContactsByUserId = async (userId: string) => {\n\
  \  return await User.where(\"userId\", userId).contacts();\n};\n\nexport const getContact\
  \ = async (contactId: string) => {\n  return await Contact.find(contactId);\n};\n\
  \nexport const createContact = async (contactData: IContact, userId: string) =>\
  \ {\n  const existingUser = await User.where(\"userId\", userId).get();\n  if (!existingUser.length)\
  \ throw new GQLError(\"User does not exist\");\n  const contact = await Contact.create({\
  \ ...contactData, userId });\n  return contact;\n};\n\nexport const deleteContact\
  \ = async (userId: string) => {\n  await Contact.deleteById(userId);\n  return null;\n\
  };\n\nexport const updateContact = async (contactId: string, contactData: any) =>\
  \ {\n  await Contact.where(\"contactId\", contactId).update(contactData);\n  return\
  \ null;\n};\n\nconst batchGetUsersByIds = (ids: any) => {\n  const userPromises\
  \ = ids.map(getUser);\n  const usersPromise = Promise.resolve(userPromises);\n \
  \ return usersPromise;\n};\n\nexport const userLoader = new DataLoader(batchGetUsersByIds);\n\
  ```\n\n在前面的代码中，我们为 `User` 模型查询定义了 `getUser`、`getUserByEmail`、`createUser`、`deleteUser`\
  \ 和 `updateUser` 函数，并为 `Contact` 模型查询定义了 `getContactsByUserId`、`getContact`、`updateContact`\
  \ 和 `deleteContact` 函数。我们使用 `find`、`where`、`create`、`deleteById`、`update` 和 `delete`\
  \ 模型方法来执行这些操作。\n\n我们还定义了 `batchGetUsersByIds` 函数，作为 `dataloader` 函数使用。它在单次数据库调用中收集所有的用户\
  \ ID 和所有用户。然后，它返回一个解析为该数组的 promise。我们需要使用以下命令安装 `dataloader` 来启用此功能。\n\n```bash\n\
  trex -c dataloader=https://esm.sh/dataloader@2.0.0/index.js\n```\n\n此外，我们在 `createUser`\
  \ 函数中使用由 `scrypt` 模块提供的 `hash` 函数对密码进行哈希处理（将密码转换为另一个字符串）。我们将使用以下命令安装 `scrypt` 模块：\n\
  \n```bash\ntrex i -c https://deno.land/x/denOBodb/mod.ts\n```\n\n# 认证\n\n为了识别请求的用户，我们将使用\
  \ `djwt` 模块来创建和验证 JSON Web Token (JWT)。我们需要在 `.env` 文件中设置 `SECRET_KEY`（随机字符串），它将在\
  \ JWT 的创建和验证期间使用。所有与认证相关的代码都写在 `auth.ts` 文件，如下：\n\n```typescript\n// src/auth.ts\n\
  import { create, verify } from \"djwt\";\nimport { RouterContext } from \"oak\"\
  ;\nimport { verify as hashVerify } from \"scrypt\";\n\nconst SECRET_KEY = Deno.env.get(\"\
  SECRET_KEY\");\nconst ALGORITHM = \"HS256\";\n\nexport const authenticate = async\
  \ (user: any, password: string) => {\n  if (await verifyPassword(password, user.password))\
  \ {\n    return createToken(user);\n  }\n};\n\nconst verifyPassword = async (password:\
  \ string, hashedPassword: string) => {\n  const isValidPassword = await hashVerify(password,\
  \ hashedPassword);\n  return isValidPassword;\n};\n\nconst createToken = async (user:\
  \ any) => {\n  if (!SECRET_KEY) {\n    throw new Error(\"SECRET_KEY not set as environment\
  \ variable\");\n  }\n  const jwt = await create(\n    { alg: ALGORITHM, typ: \"\
  JWT\" },\n    { userId: user.userId },\n    SECRET_KEY\n  );\n  return jwt;\n};\n\
  \nexport const setContextUser = async (ctx: RouterContext) => {\n  const token =\
  \ parseToken(ctx);\n  if (!token) return null;\n  const user = await verifyToken(token);\n\
  \  return user;\n};\n\nconst parseToken = async (ctx: RouterContext) => {\n  const\
  \ authorizationHeader = ctx.request.headers.get(\"authorization\");\n  const parts\
  \ = authorizationHeader ? authorizationHeader.split(\" \") : [];\n  const token\
  \ =\n    parts.length === 2 && parts[0].toLowerCase() === \"bearer\"\n      ? parts[1]\n\
  \      : undefined;\n  return token;\n};\n\nconst verifyToken = async (token: string\
  \ | undefined) => {\n  if (token) {\n    if (!SECRET_KEY) {\n      throw new Error(\"\
  SECRET_KEY not set as environment variable\");\n    }\n    const payload = await\
  \ verify(token, SECRET_KEY, ALGORITHM);\n    return payload;\n  }\n  return;\n};\n\
  ```\n\n在 `authenticate` 函数中，我们接收 `user` 和 `password` 作为参数。我们使用 `verifyPassword`\
  \ 函数通过与哈希后的密码对比来验证密码。如果密码有效，我们将使用 `SECRET_KEY` 和 `ALGORITHM` 创建一个带有 `userId` 负载的\
  \ JWT 令牌。\n\n在 `setContextUser` 函数中，我们接收类型为 `RouterContext` 的 `ctx` 作为参数。然后我们将 `ctx`\
  \ 传递给 `parseToken` 函数，该函数返回 `authorization` 头中的 `token`。解析出的令牌随后传递给 `verifyToken`\
  \ 函数，该函数使用 `SECRET_KEY` 和 `ALGORITHM` 验证令牌并在成功后返回 `payload`。该负载将供所有的解析器用于识别请求的用户。我们需要使用以下命令安装\
  \ `djwt` 模块：\n\n```bash\ntrex i -m djwt@2.2\n```\n\n现在，将在 `middlewares.ts` 文件中将\
  \ `setContextUser` 作为 GraphQL 中间件的上下文处理器如下：\n\n```typescript\n// src/middlewares.ts\n\
  import { Router } from \"oak\";\nimport { applyGraphQL } from \"oak_graphql\";\n\
  import { types } from \"./schema.ts\";\nimport { resolvers } from \"./resolvers.ts\"\
  ;\nimport { setContextUser } from \"./auth.ts\";\n\nexport const GraphQLService\
  \ = await applyGraphQL<Router>({\n  Router,\n  typeDefs: types,\n  resolvers: resolvers,\n\
  \  context: setContextUser,\n});\n```\n\n\n\n\n最后，我们将在应用中添加 `oakcors` 中间件以启用`跨源资源共享\
  \ (CORS)`，允许其他域名访问此服务器上的资源。我们还将使用 `PORT` 环境变量来设置服务器端口。修改后，我们的 `mod.ts` 文件将包含代码：\n\
  \n```typescript\nimport { Application } from \"oak\";\nimport { GraphQLService }\
  \ from \"./middlewares.ts\";\nimport { oakCors } from \"cors\";\n\nconst app = new\
  \ Application();\nconst _PORT = Deno.env.get(\"PORT\");\nconst PORT = parseInt(_PORT\
  \ as string);\nconst port = isNaN(PORT) ? 8080 : PORT;\napp.use(\n  oakCors()\n\
  );\napp.use(GraphQLService.routes(), GraphQLService.allowedMethods());\nconsole.log(`GraphQL\
  \ Server listening on ${port}/graphql`);\nawait app.listen({ port });\n```\n\n我们将使用以下命令安装\
  \ `cors` 模块：\n\n```bash\ntrex i -m cors@v1.2.2\n```\n\n### 总结\n\n在本章中，我们使用了多种 Deno\
  \ 模块（如 `oak-graphql`、`djwt`、`scrypt` 和 `cors`）实现了一个 GraphQL API。Oak-GraphQL 配合 Oak\
  \ 框架创建 GraphQL API 服务器非常有用。Djwt 用于创建和验证 JSON Web Tokens。Scrypt 用于密码哈希处理。CORS 用于允许通过不同域名访问服务器。我们学习了如何使用\
  \ `velociraptor` 配置设置（环境变量、脚本和权限）。我们使用了 `trex` 模块来安装 Deno 模块并将它们添加到 `import_map.json`\
  \ 文件中。\n\n这些知识对于建立一个新的 Deno 项目将非常有帮助。目前，我们可以在播放器（playground）中测试实现结果。我们将在接下来的章节中使用\
  \ `Snel` 模块创建一个 Svelte 前端，并集成 GraphQL API。\n\n# 第 9 章\n\n## 通讯录应用 - UI 实现\n\n###\
  \ 引言\n\n在上一章中，我们为电话通讯录应用实现了 GraphQL API 服务器。应用程序的用户界面（UI）将在本章中通过该 API 进行实现。我们将使用\
  \ `snel` 模块在 deno 中创建 `svelte` 应用，并配合 `snel-carbon` 模块，该模块提供了基于 IBM Carbon 设计系统的\
  \ carbon 组件和图标。我们还将使用 `axiod` 模块向服务器发送网络请求。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 初始设置\n\
  \    * Snel 设置\n    * Snel-carbon 安装\n* 路由\n    * 公共路由\n        * 登录\n        *\
  \ 注册\n    * 私有路由\n        * 首页\n        * 联系人\n            * 联系人表格\n           \
  \ * 联系表单\n* 布局\n    * 头部\n    * 侧边栏\n\n### 目标\n\n完成本章后，你应该能够使用 `snel` 和 `snel-carbon`\
  \ 模块创建 svelte UI 应用。之后你应该能够为 svelte 应用创建公共和私有路由。你还将学习使用 `axiod` 模块进行网络请求。\n\n###\
  \ 初始设置\n\n在本节中，我们将安装 `snel` 并初始化一个 snel 项目，然后使用 `trex` 运行脚本。一旦创建了 snel 项目，我们将安装\
  \ `snel-carbon` 组件、图标模块以及用于网络请求的 `axiod` 模块。让我们从安装 snel 开始。\n\n# Snel 设置\n\nSnel\
  \ 是“一个用于 deno 中 svelte 应用的控制论框架”，它将 Svelte 组件编译为 javascript 文件。我们将使用以下命令安装 snel：\n\
  \n```bash\ndeno run --allow-run --allow-read https://deno.land/x/snel/install.ts\n\
  ```\n\n上述命令将安装 `snel`、`trex`、`bundler` 模块以提供良好的开发者体验。命令成功执行后，我们将使用以下命令创建新的 snel\
  \ 应用：\n\n```bash\nsnel create [project name]\n```\n\n图 9.1 显示了使用默认设置创建新的 snel 项目。\n\
  \n![](img/Figure-9.1.jpg)\n\n**图 9.1：** Snel 项目创建\n\n项目完成后，我们可以使用多个命令在各种模式下运行项目，如\
  \ `development`、`watch`、`build` 等。\n\n图 9.2 列出了运行 snel 项目的可用命令。\n\n![](img/Figure-9.2.jpg)\n\
  \n**图 9.2：** 用于 Snel 项目的 Trex 命令\n\n我们将通过运行 `trex start` 命令启动项目。这将在 `3000` 端口启动服务器。\n\
  \n图 9.3 显示在 3000 端口运行的示例项目。\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 在 3000 端口运行的\
  \ Snel 项目\n\n# Snel Carbon 安装\n\nSnel-Carbon 是一个为 svelte 提供 UI 的 deno 模块。它可以帮助我们基于设计系统构建\
  \ UI。让我们从在 `index.html` 文件中添加 css 开始。\n\n```html\n<link rel=\"stylesheet\" href=\"\
  https://cdn.jsdelivr.net/npm/carbon-components@0.4\" />\n```\n\nSnel 提供 `snel.config.js`\
  \ 文件来配置设置。我们将向项目中添加导入映射（import maps）。\n\n```javascript\nexport default {\n  port:\
  \ 3000,\n  mode: \"dom\",\n  plugins: [],\n  extendsMap: [\n    \"https://denkg.com/io/components.json\"\
  ,\n    \"https://denkg.com/io/icons.json\",\n  ],\n};\n```\n\n现在我们使用 `trex` 命令安装\
  \ `axiod` 模块：\n\n```bash\ntrex i -m axiod@0\n```\n\n上述命令将 `axiod` 添加到 `import_map.json`\
  \ 文件中。\n\n### 路由\n\nSnel 包含了 Svelte Routing 来创建路由。我们将使用它创建名为公共和私有的两种路由。公共路由对所有用户可用，而私有路由对已验证的用户可用。让我们先在\
  \ `App.svelte` 文件中从 `routes/svelte` 添加 `Route` 组件：\n\n```svelte\n<script>\n  import\
  \ Routes from \"./routes.svelte\";\n  import { fade } from \"svelte/transition\"\
  ;\n</script>\n\n<main transition:fade>\n  <Routes />\n</main>\n\n<style>\n  main\
  \ {\n    max-width: 240px;\n  }\n  @media (min-width: 640px) {\n    main {\n   \
  \   max-width: none;\n    }\n  }\n</style>\n```\n\n在前面的代码中，我们用 `Route` 组件替换了 main\
  \ 元素（代表主体主体内容的 HTML 元素）中的代码。这样我们的应用程序就会根据路由地址渲染每个页面。让我们在 `routes/index.svelte` 文件中实现路由：\n\
  \n```svelte\n<script>\n  // \n  import Router from \"svelte-routing/Router\";\n\
  \  import Route from \"svelte-routing/Route\";\n\n  // 路由\n  import Contacts from\
  \ \"./Contacts.svelte\";\n  import Login from \"./Login.svelte\";\n  import Register\
  \ from \"./Register.svelte\";\n  import Home from \"./Home.svelte\";\n  import NotFound\
  \ from \"./NotFound.svelte\";\n  import PrivateRoute from \"./PrivateRoute.svelte\"\
  ;\n</script>\n\n<Router>\n  <Route path=\"/login\" component={Login} />\n  <Route\
  \ path=\"/register\" component={Register} />\n  <PrivateRoute path=\"/home\" component={Home}\
  \ />\n  <PrivateRoute path=\"/contacts\" component={Contacts} />\n  <Route path=\"\
  /\" component={Home} />\n  <Route path=\"*\" component={NotFound} />\n</Router>\n\
  ```\n\n\n\n\n```svelte\nimport Column from \"snel-carbon/components/Grid/Column.svelte\"\
  ;\n\n// Components\nimport Layout from \"@/components/Layout.svelte\";\n</script>\n\
  \n<Router>\n  <Layout />\n  <Content>\n    <Grid>\n      <Row>\n        <Column>\n\
  \          <Route path=\"login\" component={Login} />\n          <Route path=\"\
  register\" component={Register} />\n          <Route path=\"*\" component={NotFound}\
  \ />\n          <PrivateRoute path=\"/\">\n            <Home />\n          </PrivateRoute>\n\
  \          <PrivateRoute path=\"contacts\" let:location>\n            <Contacts\
  \ />\n          </PrivateRoute>\n        </Column>\n      </Row>\n    </Grid>\n\
  \  </Content>\n</Router>\n```\n\n在前面的代码中，我们使用了来自 `svelte-routing` 模块的 `Router` 和\
  \ `Route` 组件。`Router` 通过上下文向 `Route`、`Link` 组件提供路由信息并渲染最匹配的 `Route`。\n\n在 `Routes`\
  \ 导入部分，我们导入了 `Contacts`、`Login`、`Home` 和 `Register`。每个路由将被分配一个路径。除了这些路由外，我们还导入了两个名为\
  \ `NotFound` 和 `PrivateRoute` 的特殊路由。当没有匹配其他路由时，渲染 `NotFound`。`PrivateRoute` 用于限制只有已身份的用户才能访问如\
  \ `Contacts` 等路由。\n\n我们从 `snel-carbon` 模块导入了 Carbon 组件，如 `Content`、`Row`、`Grid`、`Column`，创建一个响应式\
  \ UI，并配合带有头部和侧边栏实现的自定义组件 `Layout`。\n\n让我们逐个实现每个路由的代码。\n\n### Login\n\n登录将是显示给每个未验证用户的默认页面。我们将使用\
  \ `Form` 来处理 `email` 和 `password` 的验证。`Login.svelte` 的实现如下：\n\n```svelte\n// Login.svelte\n\
  <script>\n  import { navigate } from \"svelte-routing\";\n  import Form from \"\
  snel-carbon/components/Form\";\n  import Tile from \"snel-carbon/components/Tile\"\
  ;\n  import TextInput from \"snel-carbon/components/TextInput/TextInput.svelte\"\
  ;\n  import PasswordInput from \"snel-carbon/components/TextInput/PasswordInput.svelte\"\
  ;\n  import Button from \"snel-carbon/components/Button\";\n  import InlineLoading\
  \ from \"snel-carbon/components/InlineLoading\";\n  import InlineNotification from\
  \ \"snel-carbon/components/Notification/InlineNotification.svelte\";\n  import axiod\
  \ from \"https://deno.land/x/axiod/mod.ts\";\n  import { accessToken } from \"../utils/stores.ts\"\
  ;\n  let email = \"\";\n  let password = \"\";\n  let loading = false;\n  let errors\
  \ = [];\n  const handleSubmit = (e) => {\n    loading = true;\n    const query =\
  \ `\n    {\n      login(email:\"${email}\", password:\"${password}\"){\n       \
  \ token\n      }\n    }`;\n    axiod\n      .post(\"http://localhost:8080/graphql\"\
  , { query })\n      .then((res) => {\n        if (res.data.errors) {\n         \
  \ errors = res.data.errors;\n        }\n        if (res.data.data?.token) {\n  \
  \        localStorage.setItem(\"accessToken\", res.data.data?.token);\n        \
  \  $accessToken = res.data.data?.token;\n          navigate(\"/contacts\", {\n \
  \           replace: false,\n          });\n        }\n      })\n      .catch((err)\
  \ => {\n        console.log(`err`, err);\n      })\n      .finally(() => {\n   \
  \     loading = false;\n      });\n  };\n</script>\n{#each errors as error (error.message)}\n\
  \  <InlineNotification timeout={5000} type=\"error\" title={error.message} />\n\
  {/each}\n<Tile>\n  <Form on:submit={handleSubmit}>\n    <TextInput\n      bind:value={email}\n\
  \      required\n      type=\"email\"\n      labelText=\"Email\"\n      placeholder=\"\
  Enter Email\"\n      size=\"sm\"\n    />\n    <PasswordInput\n      bind:value={password}\n\
  \      required\n      type=\"password\"\n      labelText=\"Password\"\n      placeholder=\"\
  Enter Password\"\n      size=\"sm\"\n    />\n    {#if loading}\n      <InlineLoading\
  \ />\n    {:else}\n      <Button type=\"submit\" size=\"small\">Login</Button>\n\
  \    {/if}\n  </Form>\n</Tile>\n```\n\n在上面的代码中，我们使用了 `snel-carbon` 组件，如 `Form`、`Tile`、`TextInput`、`PasswordInput`、`InlineLoading`\
  \ 和 `InlineNotification`。我们使用 `navigate` 函数跳转到 `contacts` 路由。我们使用了 `email`、`password`、`loading`\
  \ 和 `errors` 状态。响应包含 `errors` 和 `token`。\n\n### Register\n\n此路由与 `Login` 路由相似，有少数变化。`Register.svelte`\
  \ 的实现如下：\n\n```svelte\n<script>\n  import { navigate } from \"svelte-routing\";\n\
  \  import Form from \"snel-carbon/components/Form\";\n  import Tile from \"snel-carbon/components/Tile\"\
  ;\n  import TextInput from \"snel-carbon/components/TextInput/TextInput.svelte\"\
  ;\n  import PasswordInput from \"snel-carbon/components/TextInput/PasswordInput.svelte\"\
  ;\n  import Button from \"snel-carbon/components/Button\";\n  import InlineNotification\
  \ from \"snel-carbon/components/Notification/InlineNotification.svelte\";\n  import\
  \ InlineLoading from \"snel-carbon/components/InlineLoading\";\n  import axiod from\
  \ \"https://deno.land/x/axiod/mod.ts\";\n  let name = \"\";\n  let email = \"\"\
  ;\n  let password = \"\";\n  let confirmPassword = \"\";\n  let loading = false;\n\
  \  let errors = [];\n  const handleSubmit = (e) => {\n    if (password === confirmPassword)\
  \ {\n      loading = true;\n      const query = `\n    mutation{\n      registerUser(email:\"\
  ${email}\", password:\"${password}\", name:\"${name}\"){\n        name\n      }\n\
  \    }`;\n      axiod\n        .post(\"http://localhost:8080/graphql\", { query\
  \ })\n        .then((res) => {\n          if (res.data.errors) {\n            errors\
  \ = res.data.errors;\n```\n\n\n\n\n\n```javascript\nerrors = res.data.errors;\n\
  }\nif (res.data.data.registerUser?.name) {\n  alert(`user ${res.data.data.registerUser.name}\
  \ registered`);\n  navigate(\"/contacts\", {\n    replace: false,\n    state: {\
  \ accessToken: res.data.data.login },\n  });\n})\n.catch((err) => {\n  console.log(`err`,\
  \ err);\n});\n} else {\n  alert(\"Passwords do not match\");\n};\n</script>\n```\n\
  \n```html\n{#each errors as error}\n  <InlineNotification type=\"error\" title={error.message}\
  \ />\n{/each}\n```\n\n<Tile>\n  <Form on:submit={handleSubmit}>\n    <TextInput\n\
  \      bind:value={name}\n      required\n      labelText=\"Name\"\n      placeholder=\"\
  Enter Name\"\n      size=\"sm\"\n    />\n    <TextInput\n      bind:value={email}\n\
  \      required\n      type=\"email\"\n      labelText=\"Email\"\n      placeholder=\"\
  Enter Email\"\n      size=\"sm\"\n    />\n    <PasswordInput\n      bind:value={password}\n\
  \      required\n      type=\"password\"\n      labelText=\"Password\"\n      placeholder=\"\
  Enter Password\"\n      size=\"sm\"\n    />\n    <PasswordInput\n      bind:value={confirmPassword}\n\
  \      required\n      type=\"password\"\n      labelText=\"Confirm Password\"\n\
  \      placeholder=\"Enter Confirm Password\"\n      size=\"sm\"\n    />\n    {#if\
  \ loading}\n      <Loading />\n    {:else}\n      <Button type=\"submit\" size=\"\
  small\">Register</Button>\n    {/if}\n  </Form>\n</Tile>\n\n正如我们看到的，上面的代码与 `Login.svelte`\
  \ 有许多相似之处。我们添加了两个绑定到输入组件（`TextInput`、`PasswordInput`）的额外状态 `name` 和 `confirmPassword`。在\
  \ `handleSubmit` 函数中，我们使用了 `mutation` 而不是 `query`，因为我们正在后端创建一个新用户。图 9.5 显示了带有姓名、邮箱、密码字段的注册路由。\n\
  \n### Home (首页)\n这将是身份验证用户的首页。它将包含一个导航到 `contacts` 路径的 `Link` 组件。该路由的代码如下：\n\n```javascript\n\
  import Link from \"svelte-routing\";\n<h1>Home</h1>\n<Link to=\"contacts\">Contacts</Link>\n\
  ```\n图 9.6 显示了带有用于 `Contacts` 路由的 `Link` 组件的首页路由。\n\n### NotFound (未找到)\n每当用户打开不存在的路径地址时，此路由将被渲染。我们为此目的使用了星号（`*`）。该路由的代码如下：\n\
  \n```javascript\nimport Link from \"svelte-routing\";\n<h2>Page Found</h2>\nGo back\
  \ to <Link=\"/\">Home</Link>\n<style>\n  h2 {\n    color: red;\n  }\n</style>\n\
  ```\n上面的代码是一个简单的页面，带有 `Page Found` 消息和指向主页页的 `Link`。图 9.7 显示了为未定义路径渲染的 `NotFound`\
  \ 组件。\n\n### Private route (私有路由)\n虽然 Login 和 Register 是公共路由（不需要身份验证），但 Home 和 Contacts\
  \ 是私有路由，应该仅供身份验证用户访问。我们将通过使用 `PrivateRoute`（一个自定义路由）而不是普通的 `Route` 来保护这些页面。私有路由的代码如下：\n\
  \n```javascript\nimport Route from \"svelte-routing/Route\";\nimport PrivateRouteGuard\
  \ from \"./PrivateRouteGuard.svelte\";\nexport let path;\n<Route {path}>\n  <PrivateRouteGuard>\n\
  \    <slot />\n  </PrivateRouteGuard>\n</Route>\n```\n在上面的代码中，我们使用 `Route` 组件作为包装器。我们向它传递\
  \ `path` 属性，这是一个路由地址。`slot` 元素就是将被渲染的组件。我们使用 `PrivateRouteGuard` 组件将其封装起来。`PrivateRouteGuard`\
  \ 的代码如下：\n\n```javascript\nimport { onMount } from \"svelte\";\nimport { navigate\
  \ } from \"svelte-routing\";\nimport { accessToken } from \"../utils/stores.ts\"\
  ;\n\nonMount(() => {\n  console.log(\"Mounting...\");\n  if (!$accessToken) {\n\
  \    navigate(\"/login\", {\n      replace: false,\n    });\n  }\n});\n{#if $accessToken}\n\
  \  <slot />\n{/if}\n```\n\n`PrivateRouteGuard` 使用在挂载时调用的 `onMount` 函数。它检查 `accessToken`\
  \ 的值。如果 `accessToken` 为 `null`，它将跳转到 `login` 路由，否则将渲染子组件。此路由所有用户可用，并列出用户所有的联系人。联系人的代码如下：\n\
  \n```javascript\nimport { onMount } from \"svelte\";\nimport Modal from \"svelte-carbon/Modal\"\
  ;\nimport axios from \"https://deno.land/x/axios/mod.ts\";\nimport ContactForm from\
  \ \"../components/ContactForm.svelte\";\nimport ContactTable from \"../components/ContactTable.svelte\"\
  ;\nlet showForm = false;\nlet contacts = [];\nconst accessToken = localStorage.getItem(\"\
  accessToken\");\nlet editContact = null;\nconst getContacts = () => {\n  console.log(\"\
  fetching contacts...\");\n  const query = `\n    contacts {\n      contactId\n \
  \     name\n      email\n      phone\n      address\n    }\n  `;\n  axios\n    .post(\"\
  http://localhost:8080/graphql\",\n      query,\n      {\n        headers: { Authorization:\
  \ `Bearer ${accessToken}` },\n      }\n    )\n    .then((res) => {\n      console.log(`res`,\
  \ res);\n      if (res.data.errors) {\n        for (let error of res.data.errors)\
  \ {\n          alert(error.message);\n        }\n      } else {\n        // console.log(`res.data.data.login`,\
  \ res.data.data.login);\n        if (res.data.data?.contacts) {\n          contacts\
  \ = res.data.data.contacts;\n        }\n      }\n    })\n    .catch((err) => {\n\
  \      console.log(`err`, err);\n    });\n  console.log(\"fetched\");\n};\nconst\
  \ deleteContact = (contactId) => {\n  const query = `\n    mutation {\n      deleteContact(contactId:\"\
  ${contactId}\")\n    }\n  `;\n  axios\n    .post(\"http://localhost:8080/graphql\"\
  ,\n      query,\n      {\n        headers: { Authorization: `Bearer ${accessToken}`\
  \ },\n      }\n    )\n    .then((res) => {\n      console.log(`res`, res);\n   \
  \   if (res.data.errors) {\n        for (let error of res.data.errors) {\n     \
  \     alert(error.message);\n        }\n      } else {\n        getContacts();\n\
  \      }\n    });\n};\n```\n\n\n\n\n\n```javascript\n      })\n    .catch((err)\
  \ => {\n        console.log(`err`, err);\n    });\n  };\n  onMount(async () => {\n\
  \    console.log(\"Mounting…”);\n    await getContacts();\n  });\n  const resetForm\
  \ = () => {\n    showForm = !showForm;\n    editContact = null;\n  };\n  const handleEdit\
  \ = (event) => {\n    showForm = true;\n    editContact = event.detail.contact;\n\
  \  };\n</script>\n{#if showForm}\n  <Modal\n    bind:open={showForm}\n    preventCloseOnClickOutside\n\
  \    modalHeading={`${editContact ? “编辑” : “添加”} 联系人`}\n  >\n    <ContactForm\n\
  \      on:resetForm={resetForm}\n      on:contactSaved={(event) => {\n        console.log(`event`,\
  \ event);\n        showForm = event.detail.showForm;\n        getContacts();\n \
  \       editContact = event.detail.editContact;\n      }}\n      {editContact}\n\
  \    />\n  </Modal>\n{/if}\n<ContactTable\n  {contacts}\n  on:deleteContact={(event)\
  \ => deleteContact(event.detail.contactId)}\n  on:edit={handleEdit}\n  on:openForm={resetForm}\n\
  />\n```\n\n上述代码渲染了两个组件，分别是 `ContactForm` 和 `ContactTable`。来自 `snel-carbon` 的 `Modal`\
  \ 组件用于在模态视图中显示 `ContactForm`。它定义了三个状态：`showContact`、`contacts` 和 `editContact`。`showContact`\
  \ 是一个布尔标记，用于显示或隐藏 `ContactForm` 模态框。`contacts` 是联系人数组。这些联系人是通过 `getContacts` 函数获取的，该函数使用\
  \ `axios` 向 GraphQL API 服务器发送网络请求。它会在组件挂载时通过 `onMount` 函数被调用一次。我们还定义了 `deleteContact`\
  \ 函数，向服务器发送删除联系人的请求。为了用户身份验证，我们为每个请求都设置了带有 `accessToken` 的 `Authorization` 头部。`resetForm`\
  \ 函数用于在表单关闭或提交时重置表单字段。`handleEdit` 函数用于将选定的实体设置为 `editContact`。随后，`editContact`\
  \ 数据将传递给表单进行编辑。让我们详细检查 `ContactForm` 和 `ContactTable` 组件。\n\n## ContactTable\n\n\
  我们将在 `ContactTable.svelte` 文件中使用 `snel-carbon` 组件以表格格式显示所有联系人。我们还将在表格中提供了“创建”、“删除”和“编辑”操作。该组件的代码如下：\n\
  \n```svelte\n<script>\n  import { createEventDispatcher } from \"svelte\";\n  import\
  \ DataTable from \"snel-carbon/components/DataTable\";\n  import Toolbar from \"\
  snel-carbon/components/DataTable/svelte\";\n  import ToolbarContent from \"snel-carbon/components/DataTable/ToolbarContent.svelte\"\
  ;\n  import OverflowMenu from \"snel-carbon/components/OverflowMenu.svelte\";\n\
  \  import OverflowMenuItem from \"snel-carbon/components/OverflowMenu/OverflowMenuItem.svelte\"\
  ;\n  import Button from \"snel-carbon/components/Button\";\n  import Add16 from\
  \ \"snel-carbon/icons/Add16\";\n  import Edit16 from \"snel-carbon/icons/Edit16\"\
  ;\n  import Delete16 from \"snel-carbon/icons/Delete16\";\n  const dispatch = createEventDispatcher();\n\
  \  export let contacts;\n  $: {\n    contacts = contacts.map((contact, index) =>\
  \ {\n      contact.id = index + 1;\n      return contact;\n    });\n  }\n</script>\n\
  <DataTable\n  title=\"联系人\"\n  sortable\n  headers={[\n    { key: \"id\", value:\
  \ \"ID\" },\n    { key: \"name\", value: \"姓名\" },\n    { key: \"email\", value:\
  \ \"邮箱\" },\n    { key: \"phone\", value: \"电话\" },\n    { key: \"address\", value:\
  \ \"地址\" },\n    { key: \"overflow\", empty: true },\n  ]}\n  rows={contacts}\n\
  >\n  <Toolbar>\n    <ToolbarContent>\n      <Button\n        on:click={() => {\n\
  \          dispatch(\"openForm\");\n        }}\n        icon={Add16}\n      />\n\
  \    </ToolbarContent>\n  </Toolbar>\n  <span slot=\"cell\" let:cell let:row>\n\
  \    {#if cell.key === \"overflow\"}\n      <OverflowMenu flipped>\n        <OverflowMenuItem\n\
  \          on:click={() => {\n            dispatch(\"edit\", { contact: row });\n\
  \          }}\n        ><Edit16 />\n        </OverflowMenuItem>\n        <OverflowMenuItem\n\
  \          danger\n          on:click={() => {\n            dispatch(\"deleteContact\"\
  , { contactId: row.contactId });\n          }}\n        >\n      </OverflowMenu>\n\
  \    {/if}\n  </span>\n</DataTable>\n```\n\n在前面的代码中，我们从 `snel-carbon` 导入了各种组件，如\
  \ `DataTable`、`Toolbar` 和 `Button`。我们还从 `snel-carbon` 导入了 `Add16`、`Edit16` 和 `Delete16`\
  \ 等图标。我们使用了 `svelte` 的 `createEventDispatcher` 来向父组件发送事件。`contacts` 作为 prop 传递。我们使用\
  \ `$:` 语法进行响应式声明，这意味着当 `contacts` 变化时，我们会遍历它们并分配一个 `id`。\n\n`DataTable` 组件每列都需要一个\
  \ `id` 字段。我们传递了带有键和值的 `headers`。`contacts` 被传递为 `rows`。在 `DataTable` 中，我们使用了带有 `ToolbarContent`\
  \ 的 `Toolbar` 以及一个允许添加新联系人的 `Button`。我们使用 `slot=\"cell\"` 来识别溢出单元格并渲染 `OverflowMenu`\
  \ 或普通值。在 `OverflowMenu` 内部，我们通过分带数据的 `edit` 或 `deleteContact` 事件来处理点击操作。父组件将相应地处理这些事件。\n\
  \n\n\n\n```svelte\nimport { accessToken } from \"../utils/stores.ts\";\nimport {\
  \ createEventDispatcher } from \"svelte\";\n\nconst initialContact = {\n  name:\
  \ \"\",\n  email: \"\",\n  phone: \"\",\n  address: \"\",\n};\n\nconst dispatch\
  \ = createEventDispatcher();\nexport let editContact;\n$: contact = editContact\
  \ || initialContact;\nlet loading = false;\nconst handleSubmit = () => {\n  loading\
  \ = true;\n  const addQuery = `\n    mutation {\n      addContact(contact: {name:\
  \ \"${contact.name}\", email: \"${contact.email}\", phone: \"${contact.phone}\"\
  , address: \"${contact.address}\"}){\n        name\n      }\n    }\n  `;\n  const\
  \ updateQuery = `\n    mutation {\n      updateContact(contact: {contactId: \"${contact?.contactId}\"\
  , name: \"${contact.name}\", email: \"${contact.email}\", phone: \"${contact.phone}\"\
  , address: \"${contact.address}\"})\n    }\n  `;\n  const query = editContact ?\
  \ updateQuery : addQuery;\n  axiod\n    .post(\n      \"http://localhost:8080/graphql\"\
  ,\n      { query },\n      {\n        headers: { Authorization: `Bearer ${$accessToken}`\
  \ },\n      }\n    )\n    .then((res) => {\n      console.log(`res`, res);\n   \
  \   if (res.data.errors) {\n        for (let error of res.data.errors) {\n     \
  \     alert(error.message);\n        }\n      } else {\n        contact = initialContact;\n\
  \        dispatch(\"contactSaved\", {\n          showForm: false,\n          editContact:\
  \ null,\n        });\n      }\n    })\n    .catch((err) => {\n      console.log(`err`,\
  \ err);\n    })\n    .finally(() => {\n      loading = false;\n    });\n};\n</script>\n\
  <Tile>\n  <Form on:submit={handleSubmit}>\n    <TextInput bind:value={contact.name}\
  \ required label=\"Name\" placeholder=\"Enter Name\" size=\"sm\" />\n    <TextInput\
  \ bind:value={contact.email} required type=\"email\" label=\"Email\" placeholder=\"\
  Enter Email\" size=\"sm\" />\n    <TextInput bind:value={contact.phone} required\
  \ type=\"number\" label=\"Phone\" placeholder=\"Enter Phone Number\" size=\"sm\"\
  \ />\n    <TextArea bind:value={contact.address} required label=\"Address\" placeholder=\"\
  Enter Address\" size=\"sm\" />\n    {#if loading}\n      <InlineLoading />\n   \
  \ {:else}\n      <Button type=\"submit\" size=\"small\">Save</Button>\n      <Button\n\
  \        on:click={() => {\n          dispatch(\"resetForm\");\n        }}\n   \
  \     size=\"small\"\n        kind=\"danger\">Cancel</Button>\n      >\n    {/if}\n\
  \  </Form>\n</Tile>\n```\n\n在上面的代码中，我们从 `svelte-carbon` 导入了 `Tile`、`Form`、`TextInput`、`PasswordInput`,`Button`\
  \ 组件。`Tile` 用于表单的卡片布局。`Form` 用于处理邮箱、数字等验证和提交。`TextInput` 是姓名、邮箱（`type=\"email\"\
  `）、电话（`type=\"number\"`）的输入字段。`Button` 用于关闭表单并将字段值设为空，或使用 `type=\"submit\"`。\n\n\
  ![Figure 9.10](img/Figure-9.10.jpg)\n**图 9.10:** 用于新联系人的 ContactForm\n\n在 `script`\
  \ 部分，我们使用 `initialContact` 对象在新建或表单单关闭时将所有字段设为空。`editContact` 属性用于识别新联系人应该使用 `initialContact`（空值），还是应该使用\
  \ `editContact`（现有表单值）。响应式变量 `contact` 被设置为 `editContact` 的值。`handleSubmit` 函数包含两个查询：`addQuery`（创建联系人）和\
  \ `updateQuery`（更新联系人）。同样使用 `editContact` 来选择查询。然后，我们带有 `Authorization` 头部对选定的查询发送网络请求。\n\
  \n![Figure 9.11](img/Figure-9.11.jpg)\n**图 9.11:** 用于现有联系人的 ContactForm\n\n### 布局\n\
  \n在本节中，我们将使用 `svelte-carbon` 的 `Header` 和 `Sidebar` 组件创建一个布局。这将允许我们在 `Header` 中提供应用标题，并在\
  \ `Sidebar` 中添加登录/注销按钮。我们将在 `Layout.svelte` 中编写如下布局相关代码：\n\n```svelte\n<script>\n\
  import Header from \"svelte-carbon/components/UIShell/Header.svelte\";\nimport SideNav\
  \ from \"svelte-carbon/components/UIShell/SideNav.svelte\";\nimport SideNavItems\
  \ from \"svelte-carbon/components/UIShell/SideNavItems.svelte\";\nimport Authentication\
  \ from \"./Authentication.svelte\";\nlet theme = \"g10\";\n$: document.documentElement.setAttribute(\"\
  theme\", theme);\nlet isNavOpen = false;\n</script>\n<Header\n  company=\"Phonebook\"\
  \n  platformName=\"App\"\n  bind:isNavOpen\n  persistentHamburgerMenu={true}\n/>\n\
  <SideNav bind:isOpen={isNavOpen}>\n  <SideNavItems>\n    <Authentication />\n  </SideNavItems>\n\
  </SideNav>\n```\n\n在前面的代码中，我们从 `svelte-carbon` 导入了 `Header`、`SideNav` 和 `SideNavItems`。`Header`\
  \ 将位于应用的顶部，而 `SideNav` 将用于侧边栏，其中 `SideNavItems` 包含 `login`、`register` 等操作。我们将主题设置为\
  \ `g10`，这是一种灰色主题。文档中还有其他可用主题。\n\n### Header\n\n我们为该组件提供了几个属性。`company` 属性用于为应用设置标题（Phonebook）。`platformName`（App）是副标题。我们使用状态\
  \ `isNavOpen` 来显示/隐藏侧边栏。`persistentHamburgerMenu` 属性用于显示打开/关闭侧边栏的汉堡按钮。\n\n### SideNav\n\
  \n我们配合 `SideNavItems` 使用它显示 `Login`、`Register` 和 `Logout` 按钮。我们的逻辑将为未授权的用户显示 `Login`\
  \ 和 `Register` 按钮，为已授权的用户显示 `Logout` 按钮。该逻辑写在 `Authentication.svelte` 文件中如下：\n\n\
  ```svelte\n<script>\nimport Button from \"svelte-carbon/components/Button\";\nimport\
  \ ButtonSet from \"svelte-carbon/components/Button/ButtonSet.svelte\";\nimport Link\
  \ from \"svelte-routing/Link.svelte\";\nimport { accessToken } from \"../utils/stores.ts\"\
  ;\nimport Login16 from \"svelte-carbon/icons/Login16\";\nimport Logout16 from \"\
  svelte-carbon/icons/Logout16\";\n</script>\n<div class=\"auth-container\">\n  <ButtonSet\
  \ stacked>\n    {#if !$accessToken}\n      <Link to=\"/login\">\n        <Button\
  \ kind=\"ghost\" icon={Login16}>Login</Button>\n      </Link>\n      <Link to=\"\
  /register\">\n        <Button kind=\"ghost\">Register</Button>\n      </Link>\n\
  \    {:else}\n      <Link to=\"/\">\n```\n\n\n\n\n```html\n<Button\n  kind=\"ghost\"\
  \n  icon={Logout16}\n  on:click={() => {\n    localStorage.removeItem(\"accessToken\"\
  );\n    $accessToken = \"\";\n  }}\n>\n  退出\n</Button>\n</Link>\n{/if}\n</ButtonSet>\n\
  </div\n```\n\n<style>\n  .auth-container {\n    margin: 10px;\n    display: flex;\n\
  \    flex-direction: column;\n    justify-content: space-between;\n  }\n</style>\n\
  ```\n\n在前面的代码中，我们使用了 carbon 组件 `Button`、`ButtonSet`，以及 carbon 图标 `Login16`、`Logout16`。我们还从\
  \ svelte-routing 导入了 `Link` 组件，并从 store 中导入了 `accessToken`。`Link` 组件用于设置登录、注册等 URL\
  \ 地址。我们使用 `accessToken` 来显示登录、注册按钮或注销按钮。如果 `accessToken` 有效，则我们将显示注销按钮，否则显示登录和注册按钮。\n\
  \n`ButtonSet` 用于显示一组按钮（登录、注册）。我们向每个 Button 组件传递了几个属性。`kind` 定义了按钮类型（此处为 ghost）。`icon`\
  \ 属性用于在按钮中显示图标。我们分别使用了 snel-carbon 中的 `Login16` 和 `Logout16` 图标用于登录和注销按钮。\n\n###\
  \ 结论\n\n在本章中，我们使用各种 deno 模块（如 `snel`、`snel-carbon`、`axiod` 等）实现了一个 svelte 应用 UI。Snel\
  \ 模块适用于使用 deno 运行时创建 Svelte 应用程序。`Snel-carbon` 提供了基于 carbon 设计系统的组件和图标。我们使用这些组件和图标创建了我们的\
  \ UI。`Axiod` 用于向服务器发送网络请求。`Svelte Routing` 模块用于为应用定义各种路由（公共和私有）。我们默认使用 snel 提供的\
  \ `trex` 来运行脚本。\n\n这些知识将有助于为 Svelte UI 应用设置新的 deno 项目。我们可以通过与上一章中的 API 服务器一并运行来测试实现结果。至此，我们的*电话簿*应用就完成了，可以在本地使用，也可以通过各种平台部署到云端。\n\
