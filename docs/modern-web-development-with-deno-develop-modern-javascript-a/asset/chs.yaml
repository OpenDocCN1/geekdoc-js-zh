  \n### 事件循环 (#toc.xhtml_s6a)\n\n在 `Node` 运行时成功十年后，其创建者 `Ryan Dahl` 提出了另一种令人兴奋的技术，称为\
  \ `Deno`。它也是一个像 `Node` 一样的运行时，但与 `Node` 相比更加安全，并提供了许多改进和现代功能。Dahl 在 2018 年的 `JSCONF\
  \ EU` 演讲中通过名为“我对 Node.js 遗憾的 10 件事”（****https://www.youtube.com/watch?v=M3BM9TB-8yA**）\
  \ 宣布了 `Deno`，震撼了开发领域。从那时起，`Deno`一直是软件行业的一个兴奋的话题。\n\n### Deno 与 Node 的比较 (#toc.xhtml_s7a)\n\
  \n在 `Node` 运行时成功十年后，其创建者 `Ryan Dahl` 提出了另一种令人兴奋的技术，称为 `Deno`。它也是一个像 `Node` 一样的运行时，但与\
  \ `Node` 相比更加安全，并提供了许多改进和现代功能。Dahl 在 2018 年的 `JSCONF EU` 演讲中通过名为“我对 Node.js 遗憾的\
  \ 10 件事”（****https://www.youtube.com/watch?v=M3BM9TB-8yA**） 宣布了 `Deno`，震撼了开发领域。从那时起，`Deno`一直是软件行业的一个兴奋的话题。\n\
  \n| **特性** | **Node** | **Deno** |\n\n\n\n\n\n| 构建语言 | C++ | Rust |\n| :--- | :---\
  \ | :--- |\n| JavaScript 引擎 | V8 (C++ 绑定和后端) | V8 (Rust 绑定和后端) |\n| 事件循环 | libuv\
  \ | tokio |\n| TypeScript 支持 | 需要安装 | 开箱即用 |\n| 包管理器 | Npm (中心化) | 无包管理器 (去中心化)\
  \ |\n| 导入系统 | CommonJS (`require()`) | ES  (`import`) |\n| 安全性 | 默认完全访问 | 默认无访问\
  \ |\n| package.json | 使用 | 不使用 |\n\n### Deno 特性\n\nDeno 对现代功能提供了极支持，并包含了许多 Node\
  \ 原生不支持的功能（如 TypeScript 支持）。让我们来看看它的一些主要特性。\n\n- 外部依赖通过 URL 加载\n- 在沙箱中执行代码\n   \
  \ - 运行时无法访问网络文件系统和环境\n    - 访问需要显式授权\n- 开箱即用的 TypeScript 支持\n- 顶层等待 (Top-level await)\n\
  - 标准模块库\n- 提供的内置工具，例如：\n    - **Bundler**: 将脚本和依赖构建成单个文件\n    - **Dependency inspector**:\
  \ 检查 ES 模块并列出所有依赖项\n    - **Documents generator**: 解析 JSDoc\n    - **Formatter**:\
  \ 用于自动格式化 JS 和 TS 文件\n    - **Test-runner**: 使用标准库中的断言模块进行测试\n    - **Linter**:\
  \ 用于检测代码问题\n\n### Deno 基础栈\n\nDeno 的创建使用了一些坚实的技术，这增加了它成功的概率。一旦我们熟悉了构建 Deno 所使用的技术栈，就可以对\
  \ Deno 的未来充满信心（一个非常光未来）。让我们来看看 Deno 使用的技术栈。\n\n- 使用 Google 的 V8 引擎\n- 使用 Rust 编写\n\
  - 使用 Tokio（用 Rust 编写的异步运行时）用于事件线程管理\n\n### Google 开发的 V8 引擎\n\n一个由 Google 使用 C++\
  \ 构建的开源 JavaScript 引擎。它将 JavaScript 代码（由 Deno 传递）转换为字节码/机器码。Deno 开箱即用支持 TypeScript，因此我们也可以提供\
  \ TypeScript 代码，Deno 将其编译为 JavaScript。它执行 JavaScript 代码，并通过 Deno 团队为 V8 引擎编写的 Rust\
  \ 绑定 `rusty_v8` 将 Deno API 相关代码（Rust 代码）传递给 Rust 后端。\n\n解释器 (`Ignition`）和编译器 (`TurboFan`）的结合使得\
  \ V8 生成运行极快的优化机器码。\n\n### Rust\n\n自 2016 年以来，Rust 在每次 StackOverflow 调查中一直是“最受喜爱”语言（连续五年）。它是一种系统编程语言，能够对底层细节进行控制。它提供了内存安全、线程安全和类型系统。由于这些以及许多其他特性，Rust\
  \ 在过去五年的 StackOverflow 调查中是最受喜爱和最期待的语言。\n\n- 默认内存安全\n- 支持所有权和借用\n- 性能与其他底层语言（C,\
  \ C++）非常接近\n- 只能有一个可变引用或多个不可变引用\n- 没有 NULL 指针，只有 options（选项）\n\n使用者：\n- Amazon—firecracker\n\
  - Google—Fuchsia\n- Facebook—Mononoke\n- Microsoft—IoT Edge\n\nDeno 后端包含文件系统、网络和环境访问，并用\
  \ Rust 编写。异步 i/o 绑定由 tokio 库处理。\n\n### Tokio I/O 库\n\n它用于用 Rust 编写异步应用程序。它是一个事件驱动、非阻塞\
  \ i/o 平台。它使用线程池和工作线程在后台执行操作。\n\n当任何与 i/o、网络相关的代码传递给 V8 引擎时，它会通过 `rusty_v8` 绑定将其转发到\
  \ Rust 后端。接收到的代码的执行由 tokio 使用工作线程完成。\n\n- 使用非阻塞事件进行异步 I/O 操作\n- 使用 Mio 作为事件队列\n\
  - 事件循环机制用于监控调用栈和回调队列\n- 使用线程池和工作线程在后台执行任务\n\n### 什么是 JavaScript 引擎\n\nJavaScript\
  \ 引擎用于将 JavaScript/TypeScript 代码转换为字节码（解释器）或优化的机器码（编译器），以便计算机可以执行它。\n\n自发布以来，已发布许多\
  \ JavaScript 引擎。\n\n- Google 的 V8 引擎\n- Mozilla 的 SpiderMonkey\n- Microsoft 的 Chakra\n\
  \n在 JavaScript 引擎中，代码被解析为标记（tokens），用于用于生成抽象语法树（AST）。解释器使用该树生成字节码。剖析器（profiler）监控字节码，如果有优化空间，则将其传递给编译器。编译器输出优化的机器码，运行速度比字节码更快。\n\
  \n**解释器：**\n解释器逐行翻译代码。它提供字节码作为输出。解释器开始编码的速度非常快，但不提供任何优化。\n\n**编译器：**\n编译器一次性翻译整个代码。编译器具有分析整个程序并对其优化空间。它输出优化的机器码。由于需要遍历整个程序，编译器分析和优化代码需要更长时间。\n\
  \nJavaScript 引擎结合了解释器和编译器的功能。通过这样，我们得到了运行更快的优化代码。这种编译器被称为“JIT 编译器”。\n\n### 什么是 JavaScript\
  \ 运行时\n\nJavaScript 运行时是一个环境，结合了 JavaScript 引擎（Deno 中的 V8）、用底层语言编写的 API 后端（Deno\
  \ 中的 Rust）、持续监控调用栈的回调队列和事件循环。\n\n**内存堆：**\nJavaScript 代码传递给 V8 引擎，它存储代码中的变量和函数。\n\
  \n**调用栈：**\n它存储代码中调用的函数。它按照后进先（LIFO）原则运行。它始终指向当前运行的函数。一旦函数返回或传递给 Deno API，它就会弹出函数并执行栈中的上一个函数。\n\
  \n**Deno API：**\n当 Deno 检测到与 i/o、网络等相关的代码时，它将代码传递给用 Rust 编写的 API 后端。它使用 `rusty_v8`\
  \ 绑定将代码传递给后端。\n\n**Tokio：**\n它是一个事件驱动的异步 i/o 平台。Deno API 将代码传递给 tokio。它使用线程池和工作线程在后台执行操作并传递到回调队列。\n\
  \n**回调队列：**\n按照先进先出（FIFO）原则运行。它存储 Tokio 传递的所有完成函数。它等待调用栈为空。\n\n**事件循环：**\n它持续监控调用栈和回调队列。如果调用栈为空且回调队列中有函数，它将函数传递到调用栈上进行执行。\n\
  \n### 总结\n\n我们在 Deno 世界的之旅从这一章开始。我们学习了 Deno 和 Node 的历史，比较了 Deno 和 Node，并列出了 Deno\
  \ 的特性。我们还涵盖了构建 Deno 的栈，即 *V8* JavaScript 引擎、*Tokio* 事件循环以及用 Rust 编写的 Deno API 后端。最后，我们涵盖了\
  \ JavaScript 引擎和 JavaScript 运行时架构，这些虽然强制性的，但为我们理解什么是 Deno 以及它如何在后台执行操作提供了坚实的基础。\n\
  \n\n\n\n\n虽然本章涵盖了 Deno 的主要特性，但 TypeScript 是 Deno 领域中一个需要重点介绍的重要部分。开箱即用的 TypeScript\
  \ 支持是 Deno 的一项主要特性，学习 TypeScript 需要整章专门的章节来介绍基础知识。因此，我们将在接下来的章节中学习 `TypeScript`，因为在本书中我们将一直使用\
  \ `TypeScript` 进行编程。\n\n既然你已经来到了这里，显然你对学习 Deno 很有兴趣并感到兴奋。Deno 有许多令人兴奋且现代的功能，我们将在全书中学习这些功能。\n\
  \n# 第二章](#toc.xhtml_c02)\n\n## TypeScript 简介](#toc.xhtml_c02)\n\n### 简介](#toc.xhtml_s16a)\n\
  \n开箱即用的 TypeScript 支持是 Deno 运行时提供的一项令人兴奋的功能。TypeScript 一一直是大型应用程序的热门选择，并被行业快速采用。它在\
  \ 2020 年 Stack Overflow 开发者调查的[最受喜爱语言](https://insights.stackoverflow.com/survey/2020#most-loved-dreaded-and-wanted)部分中排名第二（[`insights.stackoverflow.com/survey/2020`](https://insights.stackoverflow.com/survey/2020)）。\n\
  \n### 结构](#toc.xhtml_s17a)\n\n在本章中，我们将涵盖以下主题：\n\n*   介绍 TypeScript\n*   TypeScript\
  \ 的优势\n*   TypeScript 特性\n*   TypeScript 基础\n    *   基本类型\n    *   接口 (Interfaces)\n\
  \    *   类型别名 (Type aliases)\n    *   接口与类型别名\n    *   类型推断\n    *   类型断言\n    *\
  \   联合 (Unions)\n    *   交集 (Intersections)\n    *   类 (Classes)\n*   动态与静态类型\n\
  *   强类型与弱类型\n*   TypeScript 配置\n\n### 目标](#toc.xhtml_s18a)\n\n本章将帮助你熟悉 TypeScript\
  \ 基础以及如何使用 TypeScript 开发 Deno 应用。本章还将帮助你理解静态类型检查的优缺点以及 TypeScript 提供的优势。\n\n###\
  \ 介绍 TypeScript](#toc.xhtml_s19a)\n\nTypeScript 由 `Anders Hejlsberg` 于 2012 年公开发布，是一个非常流行且开源的\
  \ JavaScript 超集。它为 JavaScript 代码添加了静态类型定义。它由微软开发和维护。TypeScript 提供类型安全、类型推断、类型断言等许多功能，包括将\
  \ ES Next 特性引入 JavaScript。请查看以下截图：\n\n![](img/Figure-2.1.jpg)\n\n**图 2.1:** TypeScript\n\
  \n### TypeScript 的优势](#toc.xhtml_s20a)\n\nJavaScript 在我们的行业中非常流行并被广泛。但在使用 JavaScript\
  \ 开发大型应用程序时，它的动态特性使得许多类型相关的错误和 bug 在开发阶段通过，只有在运行时才能被捕获。运行时调试比编译调试要糟糕得多。\n\n静态类型语言在编译期间（甚至运行代码之前）就能发现错误和\
  \ bug。TypeScript 通过在开发周期提供类型安全，帮助我们编写和维护大型应用程序。TypeScript 在编译时捕捉类型相关或其他错误，节省了我们宝贵的时间。\n\
  \n引入 TypeScript 是为了给 JavaScript 添加类型。TypeScript 代码通过 TypeScript 编译器或 babel 译器转换为\
  \ JavaScript。TypeScript 允许`静态类型检查`，它可以在不运行代码的情况下检测代码中的错误，即在编译时。它保留了 JavaScript 的运行时行为，这意味着代码的运行方式将保持一致。保持相同的运行时行为是\
  \ TypeScript 的核心特性之一。\n\n### TypeScript 特性](#toc.xhtml_s21a)\n\nTypeScript 提供了许多\
  \ ES-Next 功能，以及有助于开发大型应用程序的功能。我们将列出 TypeScript 的一些主要特性。\n\n*   在编译时检测错误，无需运行代码\n\
  *   IDE 可以使用类型定义进行自动完成\n*   对 JavaScript 代码提供静态类型系统支持\n*   由于静态类型检查，更不容易出错\n*  \
  \ 开箱即用的 ES-Next 特性\n*   工具链\n*   类型安全\n*   类型推断\n*   类型断言\n*   泛型 (Generics)\n*\
  \   接口和类型别名\n*   语言服务\n*   与 JavaScript 相同的运行时行为\n\n### TypeScript 基础](#toc.xhtml_s22a)\n\
  \n作为 JavaScript 的超集，TypeScript 对开发者来说很容易上手。假设你熟悉 JavaScript，我们将学习 TypeScript 中包含的额外类型。\n\
  \n### 基本类型](#toc.xhtml_s23a)\n\n在本节中，我们将介绍常用的数据类型。在 Deno 开发的大部分时间内，我们都会使用它们。\n\n\
  *   **Boolean (布尔值)**：接受 `true` 或 `false` 值。\n*   **Number (数字)**：接受浮点数或整数。\n* \
  \  **String (字符串)**：接受文本和字符。\n*   **Array (数组)**：元素的数组。\n*   **Generics (泛型)**：`Array<string>`\n\
  *   **Tuple (元组)**：固定数量的元素。\n*   **Enum (枚举)**：将值映射到集合。\n*   **Unknown (未知)**：接受所有类型。\n\
  *   **Any (任意)**：比 `unknown` 更宽松。\n*   **Null (空)**：接受 null。\n*   **Undefined (未定义)**：接受\
  \ undefined。\n*   **Never (永不)**：作为永远不返回的类型。\n*   **Void (空)**：作为不返回值的返回类型。\n* \
  \  **Object (对象)**：表示非原始类型。\n\n### 接口 (Interfaces](#toc.xhtml_s24a)\n\n接口用于定义实体或对象的形状。它描述了对象应该拥有的属性。\n\
  \n```typescript\ninterface IPerson {\n  firstName: string;\n  lastName: string;\n\
  }\n\nconst person: IPerson = {\n  firstName: \"first\",\n  lastName: \"last\"\n\
  };\n```\n\n在前面的示例中，`IPerson`（注意大写的 I 表示接口）定义了对象 `person` 必须具备的形状。因此，属性 `place`会导致编译器错误，因为它在\
  \ `IPerson` 中不存在。\n\n### 可选属性](#toc.xhtml_s25a)\n\n在许多情况下，我们需要提供一个可选的字段。在接口中，可以使用\
  \ `?` 符号使字段变为可选。\n\n```typescript\ninterface IPerson {\n  name: string;\n  age?:\
  \ number; // age 是可选的\n}\n\nlet printProfile = (person: IPerson): void => {\n  console.log(person.name);\n\
  };\n\nconst person = { name: \"name1\" };\nprintProfile(person);\n```\n\n### 只读属性](#toc.xhtml_s26a)\n\
  \n在属性前的 `readonly` 关键字表示我们希望属性在创建后是不可变的。\n\n```typescript\ninterface IPerson {\n\
  \  name: string;\n  readonly age: number; // age 是只读的\n}\n\nconst person: IPerson\
  \ = {\n  name: \"me\",\n  age: 29\n};\n\nperson.name = \"you\";\n// person.age =\
  \ 25; // 不能给 age 赋值，因为它是只读属性\n\n### 类型别名 (Type aliases](#toc.xhtml_s27a)\n\n类型别名的工作方式与接口类似。接口用于定义对象的形状，而类型别名可以为原始类型提供名称。它们也可以用于联合类型。\n\
  \n\n\n\n\n```typescript\ntype myInt = number; // type 为原始类型 number 提供了新名称 myInt\n\
  ```\n\n```typescript\nlet myId: myInt = 11; // 这里 myInt 代表 number 类型\n```\n\n```typescript\n\
  let id: number = 11;\n```\n\n## 联合类型 (Unions)\n```typescript\ntype unionId = number\
  \ | string; // 联合类型\n```\n\n```typescript\nlet myUnionId: unionId = 25; // number\n\
  myUnionId = “1a2b”; // string\n```\n\n#### 与接口（interfaces）功能相似\n```typescript\n\
  type PersonType = {\n  firstName: string;\n  lastName: string;\n};\n\nconst person:\
  \ PersonType = {\n  firstName: “first”,\n  lastName: “last”,\n  // place: “unknown”,\
  \ // 错误：类型 IPerson 中不存在 place\n};\n```\n\n## 接口 (Interfaces) 与 类型别名 (type aliases)\n\
  \nTypeScript 允许接口合并（Interface merging），而类型别名的合并会导致编译错误。\n\n```typescript\ninterface\
  \ IPerson {\n  name: string;\n}\n\ninterface Iperson {\n  // 将 place 合并到现有的 Iperson\
  \ 中\n  place: string;\n}\n\nconst person: Iperson = { name: “Name1”, place: “space”\
  \ };\n```\n\n```typescript\ntype PersonType = {\n  name: string;\n};\n\n// type\
  \ PersonType = {\n//   // 错误：重复的标识符 ‘PersonType’\n//   place: string;\n// };\n//\
  \ const person1: PersonType = { name: “name2”, place: “time” }; // 不 place\n\n##\
  \ 类型推断 (Type inference)\n\nTypeScript 有两种处理类型推断的方法。当我们显式地提供类型时，它被称为“显式类型 (Explicit\
  \ typing)”；当 TypeScript 使用赋值的值*隐式地*推断类型时，它被称为“隐式类型 (Implicit typing)”。\n\n### 显式类型\n\
  每当我们显式地为变量提供类型时，就称为显式类型。\n\n```typescript\nlet myId: number = 25;  // 显式类型为 number\n\
  ```\n\n#### 隐式类型\n即使没有通过初始赋值值、函数参数默认值或函数返回类型显式指定类型，TypeScript 也会推断变量的数据类型。这被称为隐式类型或类型推断。\n\
  \n如果没有给 `isAllowed` 变量显式标注 `false`，TypeScript 根据 `false` 值判断出数据类型为 `boolean`。\n\n\
  ```typescript\nlet isAllowed = false; // 隐式类型\n// TypeScript 根据值 false 推断类型为 boolean\n\
  // let isAllowed: boolean = false;\n// 错误\n// isAllowed = 25; // TS2322 [ERROR]:\
  \ 类型与类型 ‘boolean’。\n```\n\n如果在声明时未提供值，则推断为 `any` 类型。此行为可以通过在 `tsconfig.json` 中设置\
  \ `“noImplicitAny”: true;`get 来禁用。\n\n```typescript\nlet anyVar; // 推断为 ‘any’ 类型\n\
  anyVar = 2.3;\nanyVar = false;\nanyVar = “I’m any”;\n```\n\n## 类型断言 (Type assertions)\n\
  \n类型断言用于覆盖编译器推断的类型。类型断言可以通过两种方式定义：\n\n### `as` 语法\n```typescript\nconst word: unknown\
  \ = “abcdefg”;\n// const charCount: number = word.length; // 错误: TS2571 [ERROR]:\
  \ 对象类型为 ‘unknown’。\nconst charCount: number = (word as string).length;\n```\n\n\
  ### 尖括号 <> 语法\n```typescript\nconst word: unknown = “abcdefg”;\n// const charCount:\
  \ number = word.length; // 错误: TS2571 [ERROR]: 对象类型为 ‘unknown’。\nconst charCount:\
  \ number = (<string>word).length;\n```\n\n## 联合类型 (Unions)\n在联合类型中，变量可以持有两种或多种类型的值。联合类型用竖线或管道符号\
  \ `|`符号表示。\n\n```typescript\nlet myNum: number = 24;\n// myNum = “id2234”; // 错误:\
  \ TS2322 [ERROR]: 类型 ‘string’ 不能赋值给类型 ‘number’。\nlet myId: string | number = 25;\
  \ // myId 可以接受 string 或 number。\nmyId = “id234”; // 接受 string\n```\n```typescript\n\
  type myIdType = string | number;\nlet myId1: myIdType = 53;\nmyId1 = “id234”;\n\
  ```\n\n## 交叉类型 (Intersections)\n交叉类型通过组合两个不同类型的所有属性和方法来创建。使用符号 `&` 来创建交叉类型。\n\n\
  ```typescript\ninterface IPerson {\n  name: string;\n  age: number;\n}\n\ninterface\
  \ IEmployee {\n  employeeId: number;\n}\n\n// PersonType 将拥有 IPerson & IEmployee\
  \ 的所有属性\ntype PersonType = IPerson & IEmployee;\nconst printMe = (person: PersonType):\
  \ PersonType => {\n  return person;\n};\n\nconst user: PersonType = {\n  name: “name1”,\n\
  \  age: 25,\n  employeeId: 555,\n};\nconst result = printMe(user);\nconsole.log(result);\n\
  ```\n\n## 类 (Classes)\nTypeScript 允许通过类来实现一种面向对象的编程方法。在 `OOP` 术语中，类是用于创建实例或对象的蓝图。通常情况下，一个类可以包含以下内容：\n\
  \n* `constructor()`：每当要创建类的实例时都会被调用。\n* `fields`：变量或属性。\n* `method`：函数\n\n### 修饰符\
  \ (Modifiers)\n修饰符是类字段的访问控制器。有三种修饰符：`public`、`private` 和 `protected`，用于字段和方法。\n\n\
  #### public\n这是默认修饰符，允许在类外部访问字段/方法。\n\n```typescript\nclass Person {\n  name: string;\
  \ // public\n  age: number; // public\n  // 创建实例\n  constructor(name: string, age:\
  \ number) {\n    this.name = name;\n    this.age = age;\n  }\n  printMe() {\n  \
  \  console.log(this.name, this.age);\n  }\n}\nconst person = new Person(“me”, 99);\
  \ // 调用构造函数，name=”me” 和 age=99\nperson.printMe();\nconsole.log(person.age); // 属性可以在类外部访问\n\
  ```\n\n#### private\n不允许在类外部访问字段/方法。子类无法访问私有属性。它通过 private 关键字或 ECMAScript 的 `hash)`\
  \ 修饰符定义。\n\n```typescript\nclass Person {\n  name: string;\n  private _age: number;\n\
  \  #isActive: boolean; // 私有标识符\n  constructor(name: string, age: number, isActive:\
  \ boolean = true) {\n    this.name = name;\n    this.age = age;\n    this.#isActive\
  \ = isActive;\n  }\n  printMe() {\n    console.log(this.name, this.age, this.#isActive);\n\
  \  }\n}\nconst person = new Person(“me”, 99);\nperson.printMe();\nconsole.log(person.name);\n\
  /**\n * 错误: TS2341 [ERROR]: 属性 ‘age’ 是私有的，只能在类 ‘Person’ 内部访问。\n */\n// console.log(person.age);\n\
  /**\n * TS18013 [ERROR]: 属性 ‘#isActive’ 不可在类 ‘Person’ 外部访问因为它是一个私有标识符。\n */\n//\
  \ console.log(person.#isActive);\n```\n\n#### protected\n不允许在类外部访问字段/方法，但子类可以访问其字段。\n\
  \n```typescript\nclass Person {\n  name: string;\n  protected age: number; // 受保护的字段\n\
  \  constructor(name: string = “unnamed”, age: number = 0) {\n    this.name = name;\n\
  \    this.age = age;\n  }\n  printMe() {\n    console.log(this.name, this.age);\n\
  \  }\n}\n\nclass User extends Person {\n  userId: number;\n  constructor(userId:\
  \ number, name: string, age: number) {\n    super(name, age);\n    this.userId =\
  \ userId;\n  }\n  printMe() {\n    console.log(this.name);\n    console.log(this.age);\
  \ // Person 类的保护字段 age 可供子类访问\n  }\n}\nconst user = new User(1, “me”, 99);\n```\n\
  \n\n\n\n\n```typescript\nuser.printMe();\n\n/**\n* error: TS2445 [ERROR]: Property\
  \ ‘age’ is protected and only accessible within\n* class ‘Person’ and its subclasses.\n\
  */\n// console.log(user.age);\n```\n\n### Getter 和 Setter\n\n正如我们在修饰符部分所看到的，`private`\
  \ 和 `protected` 字段/方法无法在类外部访问。在某些情况下，我们需要访问它们。在这种情况下，Getters 和 Setters 会非常有帮助。\n\
  \n```typescript\nclass Person {\n  name: string;\n  private _age: number;\n  #isActive:\
  \ boolean;\n  constructor(name: string, age: number, isActive: boolean = true) {\n\
  \    this.name = name;\n    this.age = age;\n    this.#isActive = isActive;\n  }\n\
  \  printMe() {\n    console.log(this.name, this.age, this.#isActive);\n  }\n  get\
  \ _age() {\n    return this.age;\n  }\n  set _age(value: number) {\n    this.age\
  \ = value;\n  }\n  get Is_active() {\n    return this.#isActive;\n  }\n  set Is_active(value:\
  \ boolean) {\n    this.#isActive = value;\n  }\n}\nconst person = new Person(\"\
  me\", 99);\nperson.printMe();\nconsole.log(person.name);\n\n/**\n* error: TS2341\
  \ [ERROR]: Property ‘age’ is private and only accessible within class ‘Person’.\n\
  */\n// console.log(person.age);\nconsole.log(person._age);\nperson._age = 11;\n\
  console.log(person._age);\n\n/**\n* TS18013 [ERROR]: Property ‘#isActive’ is not\
  \ accessible\n* outside class ‘Person’ because it has a private identifier.\n*/\n\
  // console.log(person.#isActive);\nconsole.log(person.Is_active);\nperson.Is_active\
  \ = false;\nconsole.log(person.Is_active);\n```\n\n### 静态 (Static)\n\n它用于定义属于类而不是属于实例的属性。这意味着静态字段对于所有类实例都保持不变。在我们希望所有实例共享一个字段的副本时，这种场景非常有用。在下面的示例中，我们使用\
  \ `static instanceCount` 来计算 `Person` 对象实例的数量。\n\n```typescript\nclass Person {\n\
  \  name: string; // public\n  age: number; // public\n  // 跨实例共享的静态属性\n  static\
  \ instanceCount: number = 0;\n  constructor(name: string, age: number) {\n    this.name\
  \ = name;\n    this.age = age;\n    // TS2576 [ERROR]: Property ‘instanceCount’\
  \ is a static member of type ‘Person’.\n    // this.instanceCount += 1;\n    //\
  \ 使用类属性\n    Person.instanceCount += 1;\n  }\n  printMe() {\n    console.log(this.name,\
  \ this.age);\n  }\n  printTotalPersons() {\n    console.log(\"Total persons: Person.instanceCount);\n\
  \  }\n}\nconst person = new Person(\"me\", 99);\nperson.printMe();\nperson.printTotalPersons();\
  \ // instanceCount = 1;\nconst person2 = new Person(\"you\", 29);\nperson2.printMe();\n\
  person2.printTotalPersons(); // instanceCount = 2;\n```\n\n### 抽象 (Abstract)\n\n\
  抽象类是一个常见的基类（例如，`Person`），具有基本结构，可以被其他类继承（例如，`Employee`、`Employer`）。\n\n```typescript\n\
  abstract class Person {\n  name: string; // public\n  age: number; // public\n \
  \ constructor(name: string, age: number) {\n    this.name = name;\n    this.age\
  \ = age;\n  }\n  printMe() {\n    console.log(this.name, this.age);\n  }\n}\n/**\n\
  * error: TS2511 [ERROR]: Cannot create an instance of abstract class.\n*/\n// const\
  \ person = new Person(\"employee\", 39);\n// person.printMe();\nclass Employee extends\
  \ Person {}\nclass Employer extends Person {}\nconst employee = new Employee(\"\
  employee\", 39);\nemployee.printMe();\nconst employer = new Employer(\"employer\"\
  , 99);\nemployer.printMe();\n```\n\n### 静态类型与动态类型\n\n在编写应用程序时，我们遇到遇到属于静态或动态类型系统的语言。静态类型在编译时提供类型安全，但在开发过程中花费更多时间，而动态类型允许我们更快地编写代码，但可能会出现只有在运行时才能发现的错误和\
  \ Bug。\n\n```typescript\n// 静态类型 (TypeScript)\nlet id: number = 235; // 类型在编译时确定\n\
  // id = \"332\"; // 错误。不允许更改类型\n// TypeScript 推断类型\nlet myId = 235; // 根据值推断为 number\n\
  // myId = \"332\"; // 错误。不允许更改类型\n\n// 动态类型 (JavaScript)\nlet id1 = 10; // 类型在运行时确定\n\
  id1 = \"132\"; // 更改类型\n```\n\n| | 静态类型 | 动态类型 |\n| :--- | :--- | :--- |\n| 数据类型\
  \ | 需要显式指定 | 不需要显式指定数据类型 |\n| 类型检查 | 在编译时 | 在运行时 |\n| 类型更改 | 不允许 | 允许 |\n| 语言 |\
  \ C, C++ |\n\n### 强类型与弱类型\n\n强类型意味着不允许隐式类型转换，而弱类型意味着类型转换可以隐式进行。\n\n### 强类型 (Python)\n\
  ```python\nid = 34 + \"sfs\" // 错误：不支持的运算符类型：‘int’ 和 ‘str’\n```\n\n### 弱类型 (JavaScript)\n\
  ```javascript\nlet id = 34 + \"abc\"; // 因为类型转换结果 \"34abc\"\n```\n\n| | 强类型 | 弱类型\
  \ |\n| :--- | :--- | :--- |\n| 语言 | Python | JavaScript |\n| 类型转换 | 仅限手动 | 自动和手动\
  \ |\n| 示例 | 1 + \"2\" // 在 Python 中报错 | 1 + \"2\" // 在 JavaScript 中结果为 \"12\" |\n\
  \n## TypeScript 安装\n\n在 Deno 之前，通过 `npm` 安装 TypeScript。由于 Deno 自带 TypeScript，我们可以直接开始编写\
  \ TypeScript 代码。但如果你打算在 Deno 环境外使用 TypeScript，你需要全局安装它。\n\n**注意：确保你已安装 node 和 npm。**\n\
  \n`npm install -g typescript`\n\n完成后，运行以下命令检查是否已安装 TypeScript：\n\n`tsc --version`\n\
  \n`tsc --help`\n\n### tsconfig.json\n\n它是 TypeScript 配置/设置文件，指示 TypeScript 项目的根目录，并指定根文件和编译器选项。Deno\
  \ 提供默认的 `tsconfig.json`，可以在此处查看。([`deno.land/manual/getting_started/typescript#custom-typescript-options`](https://deno.land/manual/getting_started/typescript#custom-typescript-options))\n\
  \n### 总结\n\nTypeScript 是 JavaScript 受受认可和接受的超集，提供了类型安全。它在行业的流行是 Deno 将其作为主要语言的原因之一。\n\
  \n我们在本中涵盖了 TypeScript 的基础，在整个过程中还有很多可以学习的内容，因为 TypeScript 是我们 Deno 编程的首选语言。\n\n\
  同时，你可以随时在 TS Playground 中尝试不同的 TypeScript 功能：[`www.typescriptlang.org/play/`](https://www.typescriptlang.org/play/)。\n\
  \n通过本章，我们的基础部分（Deno, TypeScript）已经完成，我们将在接下来的章节开始 Deno 实战编程，届时我们将设置 Deno 并了解基础 Deno\
  \ 命令。\n\n\n\n\n\n在本节中，我们现在准备好运行 Deno 的实践体验了。在开始之前，我们需要为 Deno 配置开发环境。编码或编程只是软件工程的主要方面之一。还涉及其他主要因素，这些因素使我们能够在预计的时间内工程化并交付交付良好的软件应用程序。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下要点：\n\n*   安装 Deno\n*   开发工具\n    *   终端 (Terminal)\n  \
  \  *   zsh + Oh my zsh\n    *   Vim\n    *   VS Code（带有插件）\n    *   Git 和 GitHub\n\
  \    *   Postman\n    *   Docker\n    *   Silver searcher (银搜索)\n    *   数据库\n \
  \       *   MongoDB + MongoDB Atlas\n        *   Postgres\n        *   Redis\n \
  \   *   Heroku CLI\n    *   番茄工作法\n    *   Tmux\n\n### 目标\n\n我们将通过终端安装 Deno，并对 Deno\
  \ 开发期间需要的一些主要开发工具和技术进行简要概述。我们将在后的项目工作中使用这些工具。虽然这些工具是可选的，但它们将提供更好的开发者体验和组织性。我们还将学习设置一些有助于开发者提高生产力和保持有条的常用开发工具。\n\
  \n## 安装 Deno\n\n安装 Deno 非常简单，并可以使用单个终端命令完成。在你的机器上安装 Deno 有多种方法如下：\n\n`# Shell (MacOS,\
  \ Linux):`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh | sh\n\
  ```\n\n`安装特定版本：`\n\n```bash\ncurl -fsSL https://deno.land/x/install/install.sh |\
  \ sh -s v1.5.4\n```\n\n`# PowerShell (Windows):`\n\n```powershell\niwr https://deno.land/x/install/install.ps1\
  \ -useb | iex\n```\n\n`安装特定版本：`\n\n```powershell\n$v=\"1.5.4\"; iwr https://deno.land/x/install/install.ps1\
  \ -useb | iex\n```\n\n`# Homebrew (MacOS):`\n\n```bash\nbrew install deno\n```\n\
  \n运行以下命令检查是否安装了 Deno：\n\n`deno --version`\n\n可以通过运行以下命令升级 Deno：\n\n`deno upgrade`\n\
  \n可以通过运行以下命令将 Deno 升级到特定版本：\n\n`deno upgrade --version 1.5.3`\n\n## 开发工具\n\n效率、专注和组织是开发者日常生活的关键方面。它们允许我们管理和组织工作流，以便我们通过系统化和有组织的方法创造更多价值。\n\
  \n开发工具是软件工程中一个重要方面，但往往被忽视或边缘化。这些工具对于提高生产力和提供更好的组织非常有帮助。它们让我们专注于核心部分，即软件开发，而它们则为我们高效地管理其他因素。让我们概述一下全球开发者使用的一些主要工具。\n\
  \n### 终端 (Terminal)\n\n这是我们在编程世界中大部分时间所在地。熟悉它可以让我们在规划和执行日常任务或脚本（软件世界中的术语）时处于优势。这是我们将执行\
  \ Deno 命令的地方（从安装 Deno 到运行 Deno ）。你可以为 Linux/macOS 使用 UNIX 终端，或为 Windows 操作系统使用 PowerShell。\n\
  \n### zsh + oh my zsh\n\n`zsh` (Z shell) 和 `oh my zsh` (zsh 框架) 可以提升你的整体开发体验和生产力。查看\
  \ GitHub 页面获取安装指南。Oh my zsh 带有一些很棒的插件，如图 [3.1] 所示。\n\n`安装 zsh`\n\n[`github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH`](https://github.com/ohmyzsh/ohmyzsh/wiki/Installing-ZSH)\n\
  \n`安装 oh my zsh`\n\n[`github.com/ohmyzsh/ohmyzsh`](https://github.com/ohmyzsh/ohmyzsh)\n\
  \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** 设置了 zsh + oh my zsh 的终端\n\n**主题**: powerlevel10k\n\
  \n**插件**: Git, zsh-syntax-highlighting 和 zsh-autosuggestions\n\n### Vim\n\nVim（也称为\
  \ vi）是一种用于快速高效进行文本操作的传奇文本编辑器。Vim 在行业中已经了数十年，并在这些年来一直保持着顶级编辑器的地位。它是一个以键盘为中心的应用程序，专注于通过键盘命令来执行复杂的文本操作。Vim\
  \ 有自己的快捷键绑定，需要一些时间来适应，从而实现对文本处理和光标移动的更好的控制。\n\n关于 vim 有许多传说，而“编辑器大战”也许是其中最著名的。有一个关于\
  \ 90 年代 vim 和 emacs 之间竞争的著名传说。Vim 可以通过 VS Code 扩展或直接从终端使用。\n\n`安装 vim`\n\n[`www.vim.org/download.php`](https://www.vim.org/download.php)\n\
  \n### VS Code\n\nVS Code 是由微软开发的一个开源 IDE。它适用于所有平台（Windows, Linux, macOS），并且是使用最广泛的\
  \ IDE 之一。它是用 Electron 构建的——一个用于跨平台桌面应用程序的 JavaScript 框架。[`code.visualstudio.com/download`](https://code.visualstudio.com/download)\n\
  \n### VS Code 插件\n\n我们在开发 Deno 时列出一些实用的插件：\n\n*   `Deno`: 启用 Deno 支持\n*   `Prettier`:\
  \ 一个用于美化代码的格式化\n*   `ESLint`: 一个分析代码的 linter 工具\n*   `Vim`: 启用 Vim 支持\n*   `GitLens`:\
  \ 可视化的 git 体验\n\n### Git 和 GitHub\n\n`Git` 是一个由 `Linus Torvalds`（Linux 内核创建者）开发的分布式版本控制系统。它在软件行业被广泛用于代码版本控制管理。[`git-scm.com/downloads`](https://git-scm.com/downloads)\
  \ 在你的操作系统上安装它。\n\n`GitHub` 是微软所有的源码托管网站。它使用 `Git` 进行版本控制和源码管理。[`github.com/`](https://github.com/)\
  \ 如果还没有请注册。\n\n### Postman\n\n一个用于 API 开发和测试的平台，它可以帮助我们管理 API 集合并通过 GUI 测试我们的 API。[`www.postman.com/downloads/`](https://www.postman.com/downloads/)\
  \ 在你的操作系统上下载并安装 Postman。\n\n### Docker\n\nDocker 是基于容器的软件开发平台，将整个应用程序作为一个隔离进程运行。它是容器化和微服务领域用的工具。Docker\
  \ 带来了容器革命，改变了应用程序开发和部署的方式。\n\n`安装 docker`\n\n[`docs.docker.com/engine/install/`](https://docs.docker.com/engine/install/)\n\
  \n### Silver Searcher\n\n### Docker Compose\n\nDocker Compose 是由 Docker 团队开发的工具，用于将多个\
  \ docker 容器组合作为单个服务运行。我们将用于在 `docker-compose.yml` 文件中定义多个服务/容器。然后我们可以使用单个命令通过 YAML\
  \ 配置运行所有定义的服务。\n\n`安装 docker-compose`\n\n[`docs.docker.com/compose/install/`](https://docs.docker.com/compose/install/)\n\
  \n\n\n\n\n这是一个免费开源的命令行工具，用于从终端快速搜索代码。请查看 [`github.com/ggreer/the_silver_searcher`](https://github.com/ggreer/the_silver_searcher)\
  \ 获取安装说明。该工具对于在 Deno 开发过程中从终端进行快速代码搜索非常有帮助。\n\n## 数据库\n\n行业中广泛使用两种类型的数据库：`关系型`数据库（SQL\
  \ 和 PostgreSQL），以列和行的形式在表格中存储数据；以及`非关系`数据库（MongoDB、Redis 和 ElasticSearch），以集合（collections）的形式存储数据。Postgres\
  \ (RDBMS) 和 MongoDB (NoSQL) 是数据库中最流行的类型。\n\n### PostgreSQL\n\nPostgreSQL（也称为 `postgres`）是一个免费开源的`关系型数据库管理系统（（RDBMS`）。它是一个基于\
  \ SQL 的数据库，使用 SQL 进行数据管理，并以表格格式存储数据。\n\n### `Install postgres`\n\n[`www.postgresql.org/download/`](https://www.postgresql.org/download/)\n\
  \n## MongoDB 和 MongoDB Atlas\n\nMongoDB 是一个开源 NoSQL 数据库系统，使用类似 JSON 的文档来存储数据。在 Deno\
  \ 项目中使用 MongoDB 有两种方式，如下：\n\n1. **本地安装 MongoDB**\n   这将在你的机器上安装 MongoDB，可以在 Deno\
  \ 应用本地开发期间作为数据库使用。\n   [`docs.mongodb.com/manual/installation/`](https://docs.mongodb.com/manual/installation/)\n\
  \n2. **MongoDB Atlas**\n   这是一种云端数据库服务，让我们可以在不进行本地安装的情况下使用 MongoDB 服务。它有一个免费层级计划，我们将将其作为\
  \ Deno 项目的数据库。你可以注册并开始使用 MongoDB Atlas。\n   [`www.mongodb.com/cloud/atlas`](https://www.mongodb.com/cloud/atlas)\n\
  \n## Redis\n\n远程字典服务器（`Redis`）是一个开源的内存数据库，以键值对（key-value）格式存储数据。我们可以通过遵循 [`redis.io/topics/quickstart`](https://redis.io/topics/quickstart)\
  \ 上的指令在本地尝试它。\n\nRedis docker 镜像：\n[`hub.docker.com/_/redis`](https://hub.docker.com/_/redis)\n\
  \n## Heroku\n\n它是一个`平台即服务`（`PAAS`），用于免费部署使用不同编程语言编写的应用程序。\n\n### 注册 Heroku\n[`www.heroku.com/home`](https://www.heroku.com/home)\n\
  \n### Heroku CLI\n[`devcenter.heroku.com/articles/heroku-cli#download-and-install`](https://devcenter.heroku.com/articles/heroku-cli#download-and-install)\n\
  \n## Tmux\n\n它是一个开源终端复用器程序，允许你从单个屏幕创建多个终端。在使用终端时，它将是一个非常有用的工具。请查看以下截图：\n\n![](img/Figure-3.2.jpg)\n\
  \n**图 3.2:** Tmux\n\n## 番茄工作法\n\n这是一种时间管理技术，将工作分解为 `Pomodoro`（意大利语中意为“西红柿”）的时间间隔，随后是短/长休息。它帮助我们把工作拆分成更小的任务，并针对每个任务处理若干个番茄钟/Pomodoro。它对许多开发者（包括我自己）都很有益，因此它进入了本章。你可以从官方网站了解更多信息：\n\
  [`francescocirillo.com/pages/pomodoro-technique`](https://francescocirillo.com/pages/pomodoro-technique)\n\
  \n| 术语 | 长度 |\n| :--- | :--- |\n| Pomodoro | 25 分钟 |\n| 短休息 | 5 分钟 |\n| 长休息 | 15\
  \ 或 25 分钟 |\n\n**表 3.1:** 番茄工作法术语\n\n### 总结\n\n我们探索了一些在软件开发过程中非常有用的工具。在创建 Deno 应用程序时，我们将使用其中提到的许多工具。虽然这些许多工具对于\
  \ Deno 开发来说是可选的，但我们仍然建议使用它们以获得更好的开发体验。我们将在接下来的章节中学习 Deno 生态系统，包括 CLI、标准模块以及 nest.land（使用区块链的\
  \ Deno 软件包注册表）等其他内容。\n\n# 第 4 章\n\n## Deno 生态系统\n\n### 引言\n\n在动手实践 Deno 应用程序开发之前，我们需要学习运行时\
  \ API、CLI 命令和其他功能。这些 API 将提供输入输出输出和网络相关的功能。我们将探索 Deno CLI、Deno 运行时 API（Web APIs\
  \ + Deno 全局 APIs）、标准模块库、第三方模块以及模块注册表，它们共同构成了 Deno 生态系统。\n\n### 结构\n\n在本章中，我们将涵盖以下点：\n\
  \n* Deno CLI\n    * 环境变量\n    * 子命令\n    * 传递参数\n    * 文件监听器\n    * 权限\n* Deno 运行时\
  \ APIs\n    * Web APIs\n    * Deno 全局 APIs\n    * 变量\n    * 类\n* Deno 模块\n    *\
  \ 标准库\n    * 第三方模块\n* 模块注册表\n    * deno.land/x\n    * nest.land\n    * Skypack\n\
  \    * esm.sh\n    * jspm\n\n### 目标\n\n我们将探索生态系统的各个部分。该生态系统包含了`命令行界面`（`CLI`）命令，如\
  \ run、install 等。运行时 API（Web + Deno 全局）以及标准模块（受 Go 语言库启发），如 uuid、http 等。除了标准模块外，还有成千上万的第三方模块可用，如\
  \ oak、opine、velociror、denodb、trex、denon 等。\n\n我们将在后续项目中使用其中的一些。这些模块托管在 Deno 官方注册表\
  \ [deno.land/x](https://deno.land/x) 以及 [nest.land](https://nest.land)，后者是一个模块永不被删除的\
  \ Permaweb。\n\n### Deno CLI\n\nDeno `命令行界面`（`CLI`）内置了一些标准环境变量、子命令和选项。我们将在本节检查一些主要的。\n\
  \n### 环境变量\n\n环境变量存储在代码之外，可以在不更改代码的情况下进行修改。这些对于设置不同环境（开发、测试、生产等）的值非常有用。它们还用于存储不应暴露在代码中的私密/密钥。Deno\
  \ 提供了几个环境变量，我们列出以下几个主要的：\n\n* `DENO_DIR`: 用于缓存下载导入的目录。导入在第一次执行时下载。随后的运行将使用 `DENO_DIR`\
  \ 中的缓存。\n* `DENO_INSTALL_ROOT`: 用于保存通过 install 命令 安装模块的目录。\n\n### 子命令\n\nDeno 子命令用于执行各种操作，如运行程序、格式化代码、安装脚本等。我们将频繁地使用\
  \ `run` 命令，并配合 `help` 获取特定子命令的帮助。我们将在下一节中带要概述和代码示例检查大多数子命令：\n\n* **help**: 用于打印通用帮助信息或指定子命令的帮助信息。\n\
  \n    ```\n    deno help # 列出子命令、选项、环境变量\n    ```\n\n    ```\n    deno help run\
  \ # 打印 run 命令的帮助信息\n    ```\n\n\n\n\n\n*   `run`: 它通过以下任意方式执行提供的 Deno 程序：\n\n  \
  \  *   filename：\n\n        1. `deno run welcome.ts # 执行本地 welcome.ts 文件`\n\n  \
  \  *   url：\n\n        1. `deno run https://deno.land/std@0.79.0/examples/welcome.ts`\n\
  \n    *   stdin：\n\n        1. `cat welcome.ts | deno run -`\n\n*   `install`: 将\
  \ Deno 脚本安装为 `DENO_INSTALL_ROOT` 指定目录下的可执行文件。\n\n    1. `# 将 denon（文件监听器）安装为可执行文件`\n\
  \n    2. `deno install -qAf https://deno.land/x/denon@2.4.5/denon.ts`\n\n*   `fmt`:\
  \ TypeScript/Javascript 代码格式化工具。\n\n    1. `deno fmt # 递归格式化当前目录下所有文件`\n\n*   `doc`:\
  \ 打印提供的源文件（模块）的文档\n\n*   `eval`: 在终端评估 Javascript 代码\n\n    1. `deno eval “console.log(Deno.args)”\
  \ deno land`\n\n    2. `# 输出: [“deno”, “land”]`\n\n*   `test`: 使用内置测试运行器运行测试。符合\
  \ `{*_,*.,}test.{js,mjs,ts,jsx,tsx}`模式的文件将被考虑。支持过滤、覆盖率、快速失败（fail-fast）等选项。\n\n*\
  \   `cache`: 下载并编译模块，并将所有依赖项保存在本地缓存中而不运行代码。\n\n    1. `deno cache https://deno.land/std/http/file_server.ts`\n\
  \n*   `bundle`: 将单个 JavaScript 文件与其所有依赖打包。\n\n*   `completions`: 将 Deno shell 补全脚本输出到提供的源文件中。\n\
  \n    1. `# 在 oh-my-zsh 中作为插件安装 Deno 补全`\n\n    2. `mkdir ~/.oh-my-zsh/custom/plugins/deno`\n\
  \n    3. `deno completions zsh > ~/.oh-my-zsh/custom/plugins/deno/_deno`\n\n   \
  \ 4. `# 在 ~/.zshrc 插件中添加 deno`\n\n    5. `plugins=(… deno) // … 代表其他插件`\n\n*   `compile`:\
  \ 将提供的脚本编译为自包含的可执行文件。\n\n### 传递参数\n\n当需要为代码提供动态值时，参数非常有用。可以通过以下格式在脚本名称之后指定，将参数传递给脚本：\n\
  \n1. `deno run [FLAGS] [SCRIPT] [ARGUMENTS]`\n\n前面的格式以 `deno` 可执行命令开始，后跟 `run` 子命令，该命令执行提供的脚本，随后是可选的安全标志（如\
  \ `--allow-net`、`--allow-read` 等）。接着提供要执行的脚本路径，然后是可选参数。脚本之后提供的所有条目（用空格分隔）都被视为参数，并通过\
  \ `Deno.args` 变量可用。\n\n我们可以使用前面的格式运行带参数的 Deno 脚本。在项目文件夹（如 `home/my/work/deno/passing-arguments`）中创建一个名为\
  \ `args.ts` 的文件，内容如下：\n\n1. `// args.ts`\n\n2. `console.log(Deno.args);`\n\n上面的代码简单记录了\
  \ Deno 运行时变量 `Deno.args`，它是提供的参数的数组。如果没有提供参数，则记录一个空数组 `[]`，如图 4.1 所示：\n\n![](img/Figure-4.1.jpg)\n\
  \n**图 4.1:** 传递参数\n\n现在我们将向 `args.ts` 文件传递两个参数 `deno` 和 `land`。如图 4.1 所示，运行以下代码后控制台应记录\
  \ `[“deno”, “land”]`：\n\n1. `deno run args.ts deno land`\n\n2. `# 输出: [“deno”, “land”]`\n\
  \n上面的代码带两个额外参数 `deno` 和 `land` 运行 `args.ts` 文件。由于 Deno 将文件名之后之后用空格分隔的所有条目都视为参数，这些条目通过\
  \ `Deno.args` 变量提供给 `args.ts` 文件。\n\n**注意：标志不应在脚本名称之后传递，因为它们会被视为参数。**\n\n在 `args.ts`\
  \ 脚本之前传递的 `--allow-net` 标志被视为一个`标志 (flag)`，如下代码所示：\n\n1. `deno run --allow-net args.ts\
  \ deno land # Args [“deno”, “land”]. allow-net is a flag.`\n\n在 `args.ts` 脚本之后传递的\
  \ `--allow-net` 标志被视为一个**参数 (argument)**，如下代码所示：\n\n1. `deno run args.ts name --allow-net\
  \ # Args[“name”, “--allow-net”]. Allow-net is not a flag`\n\n### 文件监听\n\nDeno 将带有\
  \ `--watch` 标志运行脚本，当文件变化时会自动重启脚本。这对于开发非常有用。\n\n```bash\ndeno run --watch index.ts\n\
  ```\n\n### 权限标志\n\n默认情况下，Deno 脚本没有访问网络、文件系统或环境变量的权限。你必须使用标志显式授予这些权限。\n\n| 标志 | 说明\
  \ |\n| :--- | :--- |\n| `--allow-net` | 允许访问网络 |\n| `--allow-read` | 允许读取文件 |\n\
  | `--allow-write` | 允许写入文件 |\n| `--allow-env` | 允许访问环境变量 |\n| `--allow-run` | 允许执行子进程\
  \ |\n\n使用标志的示例：\n\n```bash\ndeno run --allow-net --allow-read=config.json index.ts\n\
  ```\n\n\n\n\n\n1. `# 只允许读取 ‘args1.ts’, ‘args2.ts’ 文件`\n2. `$ deno run --allow-read=args1.ts,args2.ts\
  \ allow-read-list_example.ts`\n\n### Deno 运行时 API\n\nDeno 提供了许多在应用开发过程中非常有运行时 API\
  \ 函数。所有这些运行时函数都记录在 `doc.deno.land` 中（[`https://doc.deno.land/https/github.com/denoland/deno/releases/latest/download/lib.deno.d.ts`](https://doc.deno.land/https/github.com/denoland/deno/releases/latest/download/lib.deno.d.ts)）。这些函数可以分为两个部分，即\
  \ Web（浏览器）API 和 Deno 全局 API。\n\n### Web APIs\n\nDeno 专注于使用现有的 Web 标准 API，而不是创建新的\
  \ API。Deno 提供了诸如 `fetch`、`setTimeout` 以及许多其他 Web API。这为熟悉 web API 的开发者提供了一个可以直接使用的优势。我们将在下表中列出这些\
  \ API：\n\n| Web API | 描述 |\n| :--- | :--- |\n| `Fetch` | 用于发送 HTTP 请求并从网络获取资源。它返回一个\
  \ promise。 |\n| `addEventListener` | 在全局作用范围内添加事件监听器。 |\n| `removeEventListener`\
  \ | 从全局作用范围内移除由 `addEventListener` 函数添加的 `eventListener`。 |\n| `Alert` | 标准提示函数，显示提示消息并等待按下\
  \ Enter 键。 |\n| `setInterval` | 在指定的间隔后反复调用提供的函数，直到使用 `clearInterval` 函数将其清除。 |\n\
  | `clearInterval` | 取消由 `setInterval` 启动的操作。 |\n| `setTimeout` | 在指定的时间段后调用函数。 |\n\
  | `clearTimeout` | 取消由 `setTimeout` 启动的延迟操作。 |\n| `Btoa` | 从提供的字符串创建 base-64 ASCII\
  \ 编码字符串。 |\n| `Atob` | 解码由 base-64 编码（如 `btoa`）编码的数据字符串。 |\n| `Confirm` | 显示提供的消息并等待用户输入。返回\
  \ `boolean` 类型的用户输入（仅 `y` 和 `Y` 为真）。 |\n| `Prompt` | 显示提供的消息并等待用户输入。返回 `string`\
  \ 格式的用户输入。 |\n| `dispatchEvent` | 在全局作用范围内分发事件并调用已注册的监听器。对于可取消事件或监听器调用了 `Event.preventDefault()`，返回\
  \ `false`。 |\n\n**表 4.2:** Web APIs\n\n### Deno 全局 APIs\n\n所有非 Web 标准 API 都通过 Deno\
  \ 全局命名空间可用。用于 i/o（`Deno.readFile`, `Deno.writeFile`）和网络（`Deno.listen`, `Deno.connect`）的\
  \ API 在此命名空间可用。\n\n注意，许多函数都有同步版本。\n\n例如，`create` 函数有一个同步方法 `createSync`。\n\n我们将在下表中列出\
  \ Web APIs 及其同步版本（如果可用）：\n\n| Deno API | 同步 | 描述 |\n| :--- | :--- | :--- |\n| `listen`\
  \ | `–` | 用于带有主机、端口和传输选项的监听器。 |\n| `close` | `–` | 关闭之前打开的资源 ID (`rid`)。 |\n| `connect`\
  \ | `–` | 连接到提供的主机和端口。 |\n| `copy` | `–` | 从源复制到目标。 |\n| `cwd` | `–` | 将当前工作目录 (`cwd`)\
  \ 作为字符串返回。 |\n| `run` | `–` | 启动一个新的子进程。子进程命令必须定义为给 `cmd` 键的数组。 |\n| `exit` | `–`\
  \ | 退出 Deno 进程。可以提供可选错误码作为参数（默认=0）。 |\n| `open` | `openSync` | 打开文件以执行读取、写入和创建操作。\
  \ |\n| `copyFile` | `copyFileSync` | 将一个文件的内容和权限复制到另一个文件。 |\n| `create` | `createSync`\
  \ | 如果不存在则创建文件，或截断现有文件。 |\n| `mkdir` | `mkdirSync` | 使用提供的字符串路径创建新目录。 |\n| `readDir`\
  \ | `readDirSync` | 读取提供路径下的目录并返回 `Deno.dirEntry` 可迭代对象。如果路径不是目录则抛出错误。 |\n| `readFile`\
  \ | `readFileSync` | 将文件读取为字节数组。可以使用 TextDecoder 将字节转换为字符串。如果路径包含目录，则返回空数组。 |\n\
  | `readTextFile` | `readTextFileSync` | 读取 utf8 编码字符串读取文件。如果路径包含目录则抛出错误。 |\n| `remove`\
  \ | `removeSync` | 移除提供路径下的文件或目录。对于提供的路径抛出错误。 |\n| `rename` | `renameSync` | 重命名文件或目录。\
  \ |\n| `chmod` | `chmodSync` | 修改文件权限。 |\n| `chown` | `chownSync` | 更改文件所有者。 |\n\
  | `writeFile` | `writeFileSync` | 将数据写入文件。 |\n| `writeTextFile` | `writeTextFileSync`\
  \ | 将文本写入文件。 |\n\n**表 4.3:** Deno APIs\n\n### 变量\n\nDeno 为各种应用程序提供了变量。下表列出了主要变量：\n\
  \n| 变量 | 描述 |\n| :--- | :--- |\n| `args` | 返回参数数组 |\n| `build` | 提供系统相关信息，如 `os`。\
  \ |\n| `env` | 通过 `get`, `set`, `keys`, `values`, `delete` 提供环境变量。 |\n| `mainModule`\
  \ | 返回入口模块的 URL |\n| `pid` | 返回当前进程 ID |\n| `stdin` | `stdin`（标准输入）的句柄 |\n| `stdout`\
  \ | `stdout`（标准输出）的句柄 |\n| `stderr` | `stderr`（标准错误）的句柄 |\n| `version` | 提供 Deno、TypeScript\
  \ 和 v8 的版本信息 |\n\n**表 4.4:** Deno 变量\n\n### 类\n\nDeno 运行时有许多不同用途的类。我们将在后续项目中使用 `Request`\
  \ 和 `Response` 类。以下列表包含主要类及其描述：\n\n| 类 | 描述 |\n| :--- | :--- |\n| `Blob` | 包含原始不可变数据的类对象。\
  \ |\n| `Event` | 代表 DOM 事件的类。包含 `target` 属性、`PreventDefault()` 方法等。 |\n| `File`\
  \ | 提供文件相关信息，如 `lastModified`、`name`、`type`、`size` 等。它继承自 `Blob` 类。 |\n| `FormData`\
  \ | 以键值对格式表示表单字段。提供 `get`, `set`, `keys`, `values`, `entries` 等方法。 |\n| `Headers`\
  \ | 以对象格式表示头部相关数据。 |\n| `Location` | 通过 `globalThis.location` 提供链接对象的位置/URL。 |\n\
  | `Request` | 代表请求相关信息 |\n| `Response` | 代表对请求的响应 |\n| `TextEncoder` | 提供 utf8 编码功能，用于将字符串编码为字节数组。\
  \ |\n| `TextDecoder` | 提供解码函数，将字节数组解码为字符串。 |\n| `URL` | 提供创建对象 URL 所需的静态方法的对象。 |\n\
  \n\n\n\n\n| `WebSocket` | 提供创建和管理 WebSocket 连接以及发送和接收数据的 API |\n\n**表 4.5:** Deno\
  \ 类\n\n### Deno 模块\n\n如果没有模块（标准库和第三方模块），运行时生态系统将是不完整的。事实上，Node.js 的流行归功于 npm 提供的大量第三方模块。Deno\
  \ 提供了两种模块：标准库和第三方模块。我们将在接下来的章节中检查这两种模块。\n\n### 标准库\n\nDeno 标准库是标准模块的集合，灵感来源于 Go\
  \ 语言的标准库。所有标准模块都经过 Deno 核心团队审核，且不包含外部依赖。这些模块可以在 `[`deno.land/std`](https://deno.land/std)`\
  \ 获得。我们在下表中列出了它们：\n\n| 模块 | 描述 |\n| :--- | :--- |\n| `archive` | 提供 `Tar`、`Untar`\
  \ 功能的模块。 |\n| `Async` | 异步任务工具，具有 `deferred`（带有 reject 和 resolve 函数的 Promise）、`delay`（延迟\
  \ promise 决）功能。 |\n| `Bytes` | 提供处理字节的辅助函数。 |\n| `Datetime` | 日期时间模块，包含 `parse`（字符串到日期）、`format`（日期到字符串）、`difference`（两个日期之间的差异）以及一些额外的函数。\
  \ |\n| `Encoding` | 移植自 Go 的 `encoding` 模块，该模块对于处理 csv、yaml、toml 等外部数据结构非常有用。 |\n\
  | `flags` | 基于 `minimist` npm 模块的命令行参数解析器。适用于 CLI 工具开发。 |\n| `Fmt` | 提供类似 `printf`\
  \ 的 I/O 格式化函数。 |\n| `Fs` | 提供文件系统操作的辅助函数。提供 `emptyDir`、`ensureDir`、`exists`、`move`、`copy`、`walk`\
  \ 等函数。该模块目前是不稳定的，因此在使用时需要使用 `--unstable` 标记。 |\n| `Hash` | 用于创建支持大量算法的哈希值。 |\n|\
  \ `http` | 有用于创建 HTTP Web 服务器。它还包含一个通过 HTTP 服务本地文件的文件服务器函数。\n| `Io` | 提供类似 `Reader`、`Writer`、`Streams`\
  \ 等函数。 |\n| `Log` | 带有日志级别的日志器模块。 |\n| `Mime` | 用于处理多部分表单数据。 |\n| `Node` | Node\
  \ 标准库的兼容模块。允许在 Deno 中使用 lodash 等 Node 模块。 |\n| `Path` | 提供路径相关的函数。 |\n| `Permissions`\
  \ | 为脚本提供权限。 |\n| `Signal` | 提供捕获和监控操作系统信号（如 SIGINT）的 API。 |\n| `Testing` | 提供测试相关的工具函数，如\
  \ `assert`、`equal` 等。 |\n| `Textproto` | 灵感来源于 Go 的 `textproto` 模块。 |\n| `Uuid`\
  \ | 提供 `generate` 和 `validate` 通用唯一标识符 (`UUID`) 的函数，并支持版本 1、4 和 5。 |\n| `Wasi` |\
  \ 提供 WebAssembly 系统接口 (`WASI`) 的实现。 |\n| `ws` | 有用于创建 WebSocket 服务器。 |\n\n**表 4.6:**\
  \ Deno 标准库\n\n### 第三方模块\n\nDeno 1.0 于 2020 年 5 月发布。从那时起已有许多用于不同目的模块，例如 Web 服务器 (`oak`)、身份验证\
  \ (`onyx`)、数据库 (`mongo`)、ORM (`denodb`)、JWT (`djwt`) 等。我们将在接下来的表中简要概述许多此类模块：\n\n\
  | 第三方模块 | 描述 |\n| :--- | :--- |\n| `oak` | 一个极其流行的 Web 中间件框架，包括路由等中间件。灵感来源于 `koa`\
  \ 框架。 |\n| `Aleph` | 一个灵感来源于 `Next.js` 的 React 框架，支持服务端渲染 (`SSR`)、静态网站生成器 (`SSG`)\
  \ 等。 |\n| `Pagic` | 用于静态网站生成的 React 框架。 |\n| `drash` | 一个轻量级的 REST 微框架，支持使用 React\
  \ 和 Vue 进行 API 开发和单页应用 (`SPA`) 开发。 |\n| `Servest` | 与 `std/http` 兼容的 Web 服务器，开箱支持\
  \ WebSocket 和 JSX。 |\n| `Denon` | Deno 版本的 Node `nodemon` 替代品，在检测到更改时会自动重启应用或服务器。它还作为\
  \ `deno` 命令的替换封装器。 |\n| `Webview` | 创建桌面 GUI 应用的跨平台模块。 |\n| `Denodb` | 支持 MySQL、PostgreSQL、MongoDB、MariaDB\
  \ 和 SQLite 数据库的 ORM。 |\n| `Trex` | 类似于 NPM 的模块管理器，符合 Deno 的哲学。它使用 `import_map.json`\
  \ 作为根。 |\n| `Webview` | 创建桌面 GUI 应用的跨平台模块。 |\n| `Denodb` | 用于 Deno 的类模块模块管理器。 |\n\
  | `ts` | 用于 Deno 的 TypeScript 模块。 |\n| `Postgres` | 类似 PostgreSQL 的驱动程序。 |\n| `Redis`\
  \ | Redis 客户端。 |\n| `Dvm` | Deno 版本管理器。 |\n| `Mongo` | MongoDB 驱动程序。 |\n| `Vno`\
  \ | 类似 Vue 的框架。 |\n| `Eta` | 模板引擎。 |\n| `Mysql` | MySQL 驱动程序。 |\n| `Sqlite` | SQLite\
  \ 驱动程序。 |\n| `Ssgo` | 静态网站生成器。 |\n| `Onyx` | 身份验证模块。 |\n| `Otpauth` | 身份验证模块。 |\n\
  | `Aqua` | Web 框架。 |\n| `Denox` | 跨平台脚本。 |\n| `Dejs` | EJS 模板引擎。 |\n| `Dotenv` |\
  \ 环境变量的模块。 |\n| `Udd` | 更新依赖的模块。 |\n| `Djwt` | JSON Web Token 模块。 |\n| `Cotton`\
  \ | SQL Toolkit。 |\n| `Denomander` | 命令行界面。 |\n| `Lume` | 静态网站生成器。 |\n| `Oak_graphql`\
  \ | GraphQL 中间件。 |\n| `Drake` | 任务运行器。 |\n| `Rhum` | 测试框架。 |\n| `websocket` | WebSocket\
  \ 模块。 |\n| `dext.js` | Preact 框架。 |\n| `denoliver` | 静态文件服务器。 |\n| `wocket` | WebSocket\
  \ 模块。 |\n| `dem` | 版本管理器。 |\n| `bundler` | 打包器。 |\n| `dmm` | 模块管理器。 |\n| `opencv`\
  \ | OpenCV 模块。 |\n| `garn_validator` | 验证器模块。 |\n| `watch` | 文件监听器。 |\n| `smtp`\
  \ | SMTP 模块。 |\n| `nanoid` | NanoID 实现。 |\n| `superoak` | HTTP 断言模块。 |\n| `dpx`\
  \ | 类似 NPX 的运行器。 |\n| `drash_middleware` | 中间件模块。 |\n| `cors` | CORS 模块。 |\n| `postcss`\
  \ | Postcss 模块。 |\n| `oak_middleware` | 中间件集合。 |\n\n\n\n\n模块注册表是托管 Deno 的地方。就像 Node\
  \ 中的 `npm` 一样，Deno 也有几个使用区块链等现代功能构建的模块注册表。\n\n在列出 Deno 的标准模块和第三方模块之后，我们将检查 Deno\
  \ 可用的主要模块注册表：\n\n| 模块注册表 |  |\n| :--- | :--- |\n| `deno.land/x` | 官方模块注册表，托管了大量第三方模块（编写时有\
  \ 1651 个模块） |\n| `nest.land` | 一个使用 `blockweave`（区块链的派生物）构建的现代 Deno 模块注册表。发布的模块是不可变的、去中心化的且永久的，这意味着它们永远无法被删除。\
  \ |\n| `Skypack CDN` | 由 `Pika` 提供的托管预优化 ES 模块的 CDN。它提供压缩、缓存、填充填充（polyfilling），并将\
  \ `npm` 包转换为 ES 模块。每当在模块 URL 后面添加 `?dts` 时，它会自动使用 `X-TypeScript-Types` 请求头获取类型声明。\
  \ |\n| `esm.sh` | 由 `aleph` 框架创建者提供的 ES 模块 CDN，它为每个模块封装所有依赖（同行依赖除外）。Node 包通过 `esbuild`\
  \ 转换为 ES 模块以便通过填充在 Deno 上运行。它默认通过 `X-TypeScript-Types` 请求头提供类型声明。 |\n| `jspm` |\
  \ 一个将 `npm` 包转换为 ES 模块的模块 CDN。 |\n| `Web` | 托管在互联网（例如 GitHub）上的任何 ECMAScript 模块都可以\
  \ Deno 支持的 ESM import 使用。 |\n\n**表 4.8：** Deno 模块注册表\n\n### deps.ts 中的中心依赖\n\n在\
  \ Deno 世界中，有一种约定用于从 `deps.ts` 文件中导入所有依赖。这些依赖被重新导出并在整个项目中使用。这有助于我们在一个地方维护所有依赖。同样地，开发依赖被保存在在一个名为\
  \ `dev_deps.ts` 的单文件中。\n\n在接下来的代码中，我们从 `deps.ts` 文件中导入所有的依赖 URL 并将其导出以供整个项目使用。我们从第三方大小处理模块导入了\
  \ `titleCase` 函数，该函数会返回每个单词首字母大写的标题格式。我们还从 Deno 标准库的测试模块导入了 `assertEquals` 函数。\n\
  \n```\n// deps.ts\n1. import titleCase from \"https://deno.land/x/case@v2.1.0/titleCase.ts\"\
  ;\n2. import { assertEquals } from \"https://deno.land/std@0.97.0/testing/asserts.ts\"\
  ;\n4. export { titleCase, assertEquals };\n```\n\n现在我们将在 `hello.ts` 文件中从 `deps.ts`\
  \ 文件导入模块，如下代码所示：\n\n```typescript\n// hello.ts\n1. import { titleCase, assertEquals\
  \ } from \"./deps.ts\";\n3. console.log(titleCase(\"hello world\"));\n4. assertEquals(\"\
  hello\", \"helloz\");\n```\n\n前面的代码输出了标题格式为 `\"Hello World\"` 的字符串 `\"hello world\"\
  `，并且 `assertEquals` 函数因为实际值（`\"hello\"`）和预期值（`\"helloz\"`）不等而抛出 `AssertionError`，如图所示：\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2：** deps.ts 示例\n\n### 结论\n\n我们现在结束关于 Deno 生态系统的章节。它概述了\
  \ Deno 生态系统的各个部分，如运行时 API、CLI、标准模块和第三方模块、模块注册表等。作为行业中的一项新技术，Deno 生态系统正在以快速速度进化。我们可能会看到\
  \ Deno 社区提出新的令人兴奋的想法和实现，就像他们一直以来所做的那样。\n\n随着本章的结束，我们现在准备好进入书中最激动的部分——编写代码。我们将在接下来的章节中从头开始编写\
  \ Deno 应用。在此之前，继续探索 Deno 生态系统。\n\n# 第 5 章\n\n## Todos 应用—API\n\n### 简介\n\n我们现在准备好进入编码战场或游乐场（取决于你如何看待）。在本章中，我们将创建一个包含\
  \ `CREATE`、`RETRIEVE`、`UPDATE` 和 `DELETE`（`CRUD`）的应用。一个 Todos 应用。这将是我们 Deno 编码之旅的绝佳开始。我们将学习、调整并尝试使用名为\
  \ `Aleph.js` (aleph) 的全栈 React 框架创建的 Todos 应用，它列在 [第 4 章，Deno 生态系统] 的 [表 4.7] 中。API\
  \ 将在本章实现，而 UI 将下一章实现。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* Aleph.js 简介\n    * 特性\n\
  \    * 概念\n        * 页面\n        * 路由\n        * API\n* Todos 应用 API 实现\n\n### 目标\n\
  \n我们将能够学习：使用 aleph 开发全栈应用需要学习的三个基本概念。我们将使用这些概念来创建页面、基于文件名的路由以及 API。本章的目标是熟悉 aleph.js。我们将在接下来的章节中从头开始编写\
  \ Deno 应用。在此之前，请继续探索 Deno 生态系统。我们还将学习实现“表述状态转换”（`REST`）操作，如 `CREATE`、`RETRIEVE`、`UPDATE`\
  \ 和 `DELETE`。\n\n### 引入 Aleph.js\n\nAleph.js 是一个受 Next.js 启发的全栈框架。它使用 ES 模块语法，不需要\
  \ Webpack 或或其他绑定器。它仅重新打包更改的模块，并通过热更新（`HMR`）立即在浏览器中更新。Aleph.js 可以使用以下命令安装：\n\n```bash\n\
  deno install -A -n aleph https://deno.land/x/cli.ts\n```\n\n### 特性\n\nAleph.js 是一个功能丰富的框架，提供了服务端渲染、静态站点生成、API\
  \ 开发等许多功能。主要功能如下：\n\n* 基于文件系统的页面和路由\n* API 开发\n* 服务端渲染\n* 静态站点生成\n* 零配置\n* 映射的使用\n\
  * 带有 Fast Refresh 的 HMR\n* 通过 useDeno hook 在组件中访问 Deno \n\n### 命令行界面\n\nAleph.js\
  \ **命令行界面**（CLI）提供了静态站点生成、创建带有模板代码的新应用、升级 aleph.js 等命令。主要命令列如下：\n\n| 命令 |  |\n|\
  \ :--- | :--- |\n| `aleph init` | 创建带有模板代码的新应用 |\n| `aleph upgrade` | 升级 aleph.js\
  \ |\n| `aleph` | 显示所有命令行命令 |\n| `aleph -h` / `aleph --help` | 显示帮助信息 |\n| `aleph\
  \ -v` / `aleph --version` | 显示 aleph.js 版本 |\n| `aleph dev` | 以开发模式启动服务器 |\n| `aleph\
  \ start` | 以生产模式启动服务器 |\n| `aleph build` | 构建应用为静态站点 |\n| `aleph analyze` | 分析应用依赖\
  \ |\n\n`aleph init` 命令提供了一个带有模板代码的示例应用。我们将使用它来初始化示例应用：\n\n```bash\naleph init hello-aleph\
  \ // 创建带有模板代码的 hello-aleph 文件夹\ncd hello-aleph\naleph dev // 以开发模式运行应用\n```\n\n\
  你可以访问 `http://localhost:8080` 查看示例应用，如图所示：\n\n![](img/Figure-5.1.jpg)\n\n**图 5.1：**\
  \ Aleph.js 示例应用\n\n### 概念\n\n使用 aleph 开发全栈应用需要学习的三个基本概念。我们将使用这些概念来创建页面、基于文件名的路由以及\
  \ API。\n\n### 页面\n\n\n\n\n在 `/pages` 文件夹下，任何扩展名为 `*.js`、`*.jsx`、`*.ts`、`*.tsx` 和\
  \ `*.mjs` 且包含默认导出 React 组件的文件都被视为页面。由于 `aleph.js` 支持基于文件名的路由，每个页面将根据文件名关联到相应的路由。\n\
  \n### 示例：\n\n如果我们按照如下代码，创建一个具有默认导出 React 组件的 `pages/hello.tsx` 文件，那么我们就可以通过 `http://localhost:8080/hello`\
  \ 访问该页面，如 *图 5.2* 所示。\n\n```tsx\n// pages/hello.tsx\nimport React from “react”;\n\
  \nexport default function Hello() {\nreturn “Hello Deno!”;\n}\n```\n\n![](img/Figure-5.2.jpg)\n\
  \n**图 5.2:** Hello Deno! 页面\n\n每个页面都会被**预渲染**，这意味着页面的 HTML 会提前生成，从而获得更好的性能和 SEO。Aleph.js\
  \ 还支持**水合（hydration）**过程，当浏览器加载页面时，会运行与 HTML 相关的 JavaScript 代码，使其具有完全交互性。\n\n###\
  \ 路由\n\nAleph.js 支持基于文件系统的路由。它会自动将名为 `index` 的文件路由到目录根节点。同时也支持通过**括号**语法 `[]` 或\
  \ **$** 符号前缀来实现**动态路由**。\n\n```text\n// 路由\npages/index.tsx => localhost:8080/\n\
  pages/hello/index.tsx => localhost:8080/hello\n\n// 动态路由\n// $ 前缀\npages/hello/$name.tsx\
  \ => pages/hello/buddy\n```\n\n以下代码使用 `useRouter()` 钩的 `params` 对象来获取传递的参数值。`params`\
  \ 的属性键由文件名（`name`）决定。\n\n```tsx\n// pages/hello/$name.tsx\nimport React from “react”;\n\
  import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\n\
  export default function Hello() {\nconst { params } = useRouter();\nreturn `Hello\
  \ ${params.name}!`;\n}\n```\n\n如果我们在浏览器中输入 `route /hello/buddy`（其中 `buddy` 是 `name`\
  \ 参数的值），我们将会看到如 *图 5.3* 所示的响应。\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3:** 动态路由 ($\
  \ 语法)\n\n```text\n// 括号语法 []\npages/places/[place].ts => pages/places/munich\n```\n\
  \n与 $ 符号语法类似，括号语法 `[]` 也具有相同的作用，所示。在这里，参数键是 `place`（源自文件名 `[place].ts`）。如果我们在浏览器中输入\
  \ `/places/munich`（其中 Munich 是 `place` 参数的值），我们将会看到如 *图 5.4* 所示的响应。\n\n```tsx\n\
  // pages/places/[place].tsx\nimport React from “react”;\nimport { useRouter } from\
  \ “https://deno.land/x/aleph/framework/react/mod.ts”;\n\nexport default function\
  \ Places() {\nconst { params } = useRouter();\nreturn <h1>{`${params.place} is a\
  \ wonderful place!`}</h1>;\n}\n```\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4:** 动态路由（括号语法）\n\
  \n该系统支持**嵌套路由**，并如下所示所示实现：\n\n```text\npages/users/[username]/account.tsx => pages/users/user1/account\n\
  ```\n\n```tsx\n// pages/users/[username]/account.tsx\nimport React from “react”;\n\
  import { useRouter } from “https://deno.land/x/aleph/framework/react/mod.ts”;\n\n\
  export default function UserAccount() {\nconst { params } = useRouter();\nreturn\
  \ <h1>{`${params.username}’s account.`}</h1>;\n}\n```\n\n![](img/Figure-5.5.jpg)\n\
  \n**图 5.5:** 嵌套路由\n\n### 应用程序接口 (API)\n\n与页面类似，`api/` 文件夹下任何扩展名为 `*.ts`、`*.js`、`*.mjs`\
  \ 且内部默认导出函数的文件都会映射到 `/api/*` 并被视为 API 端点。导出的函数类型将为 `APIHandler`。\n\n```ts\n// api/users/index.ts\n\
  import type { APIHandler} from “aleph/types.d.ts”;\n\nconst users = [\n  { id: 1,\
  \ name: “abc”, place: “Munich” },\n];\n\nexport default function handler(req: APIHandler)\
  \ {\n  // ...\n}\n```（等待，根据提供的文本重新对齐逻辑）\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6:**\
  \ API\n\n同时也支持**动态路由**。前面的代码导出了类型为 `APIHandler` 的函数。\n\n```ts\n// api/users/index.ts\n\
  index.ts\nimport type { APIHandler} from “aleph/types.d.ts”;\n\nexport default function\
  \ handler({response}: APIHandler) {\n  response.json({ message: “Aleph!” });\n}\n\
  ```\n\n![](img/Figure-5.7.jpg)\n\n**图 5.7:** 动态路由\n\n### 初始化应用\n\n我们已经检查了主要部分。现在我们使用\
  \ `aleph` 命令初始化应用。\n\n```bash\naleph init\ncd app\n```\n\n### 项目结构\n\n*图 5.8*所示的项目结构对我们来说很熟悉。\n\
  \n![](img/Figure-5.8.jpg)\n\n**图 5.8:** 项目结构\n\n### Todos API\n\n我们应该修改文件来获取所有现\
  \ todos，而不是消息。我们将创建一个包含虚拟 todos 的 Todos 数组，如下所示：\n\n```ts\n// api/todos/index.ts\n\
  import type { APIHandler} from “aleph/types.d.ts”;\n\nconst todos = [\n  { id: 1,\
  \ title: “todo1” },\n  { id: 2, title: “todo2” },\n];\n\nexport default function\
  \ handler({request, response}: APIHandler) {\n  switch (request.method) {\n    case\
  \ “GET”:\n      response.json(todos);\n      break;\n    default:\n      response.status\
  \ = 405;\n      response.json({ message: “Action not allowed” });\n      break;\n\
  \  }\n}\n```\n\n![](img/Figure-5.10.jpg)\n\n**图 5.10:** GET/api/todos 端点\n\n\n\n\
  \n\n它将响应 `GET` 方法的所有现有 todo（见图 5.10），如果请求的操作在 switch 语句中没有定义，它将返回 `405` Method Not\
  \ Allowed 代码（见图 5.11）。`break` 会跳过后续的情况，并确保只执行匹配的 case 代码。\n\n![](img/Figure-5.11.jpg)\n\
  \n**图 5.11：** 未定义动作 405 错误\n\n### [POST]\n\n我们现在将实现添加 todo 的 `CREATE (POST)` 动作。\n\
  \n```javascript\n…\nexport const handler: APIHandler = async ({request, response})\
  \ => {\n  switch (request.method) {\n    case “GET”:\n      response.json(todos);\n\
  \      break;\n    case “POST”:\n      let body;\n      try {\n        body = await\
  \ request.json();\n      } catch (error) {\n        response.status = 400;\n   \
  \     response.json({ error: error.message });\n        break;\n      }\n      const\
  \ title = body.title ? body.title.toLowerCase() : null;\n      if (!title) {\n \
  \       response.status = 400;\n        response.json({\n          message: “title\
  \ not provided”,\n        });\n        break;\n      }\n      let todo = todos.find((_todo)\
  \ => _todo.title === title);\n      if (!todo) {\n        todo = {\n          id:\
  \ todos[todos.length - 1].id + 1,\n          title, // title: title 的简写\n      \
  \  };\n        todos.push(todo);\n      }\n      response.json(todo);\n      break;\n\
  \    default:\n      …\n```\n\n我们正在使用 `request.json()` 方法解码请求体，该方法将请求体解析为 JSON。如果\
  \ JSON 无效或不存在，或者未提供 title，将返回 `400` 代码并带有错误消息。我们正在使用 `toLowerCase()` 函数来获取小写的 todo\
  \ 标题。这将帮助我们使用 `find` 方法找到具有相同标题的现有 Todo。如果没有找到现有 todo，将创建一个新的 todo 并将其添加到 Todos\
  \ 列表中。`id` 属性使用了最后一个 todo 项目的 `id`（最后一个 Todo id + 1）。然后将使用 `response.json` 函数返回\
  \ Todo（现有的或创建的）。现在，尝试添加一个 todo，如图 5.12 所示。\n\n![](img/Figure-5.12.jpg)\n\n**图 5.12：**\
  \ POST `api/todos` API 端点\n\n`GET api/todos` 端点应该包含新创建的 Todo，如图 5.13 所示。\n\n![](img/Figure-5.13.jpg)\n\
  \n**图 5.13：** GET api/todos 中新创建的 Todo\n\n现在，通过按下 `Ctrl` + `c` 关闭服务器，并使用 `aleph\
  \ dev` 命令重新启动。你将看不到新创建的 Todo。这是因为我们没有将数据保存到文件或数据库。为了持久化数据，我们将在 `db` 文件夹中创建一个包含以下\
  \ JSON 数据的 `todos.json` 文件。\n\n```json\n// db/todos.json\n[\n  { “id”: 1, “title”:\
  \ “todo1” },\n  { “id”: 2, “title”: “todo2” }\n]\n```\n\n保存的 todos 随后可以使用 `lib/read_todos.ts`\
  \ 文件创建的 `readTodos` 工具函数检索。我们正在使用 `Deno.readFileSync` 函数同步读取文本，然后使用 `JSON.parse`\
  \ 解析 JSON。\n\n```typescript\nlib/read_todos.ts\nconst readTodos = () => JSON.parse(Deno.readFileSync(\"\
  db/todos.json\"));\nexport default readTodos;\n```\n\n\n\n\n\n```javascript\n  \
  \  response.status = 400;\n    response.json({\n      error: “title not provided”,\n\
  \    });\n    break;\n  }\ntodos.forEach((_todo: ITodo) => {\n  if (_todo.id ===\
  \ todo.id) {\n    _todo.title = title;\n  }\n});\nwriteTodos(todos);\nresponse.json(todo);\n\
  break;\ncase “DELETE”:\n  const _todos = todos.filter((_todo: ITodo) => _todo.id\
  \ !== id);\n  writeTodos(_todos);\n  response.json({ message: “Deleted” });\n  break;\n\
  default:\n  response.status = 405;\n  response.json({ message: “Action not allowed”\
  \ });\n  break;\n}\n} else {\n…\n```\n\n对于 `GET` 方法，我们简单地返回匹配的 Todo。这个 `GET` 方法与\
  \ `index.ts` 文件中的方法不同。它仅提供单个 todo（通过提供的 `id` 派生），而 `index.ts` 中的 `GET` 提供了所有 todo\
  \ 的列表/数组。\n\n对于 `DELETE`，我们从 todos 中过滤掉匹配的 Todo，然后使用 `writeTodos` 函数将更新后的 todos\
  \ 写入 `todos.json` 文件。\n\n对于 `PATCH`，初始代码与 `index.ts` 文件中的 `POST` 方法类似。我们从 `readBody(“json”)`\
  \ 提供的 JSON 中获取更新后的标题。然后使用 `forEach`，我们只更新 todos 数据中匹配的 Todo。随后使用 `writeTodos` 函数将更新后的\
  \ Todos 保存到文件中，并返回更新后的 Todo。\n\n### 结论\n\n本章已经实现了 Todos App 的 API 端点。我们现在可以使用 Postman\
  \ 或 `curl` 来测试它们。我们还 学习了 Aleph.js 的功能和基本概念。\n\n下一阶段将为 Todos App 实现 UI。我们将检查 Aleph.js\
  \ 为 React 开发提供的独特特性，并将在接下来的章节中实现 UI。\n\n# 第 6 章\n\n## Todos App—UI 实现\n\n### 引言\n\
  \n在上一节中，我们为 Todos App 实现了 REST API。在本章中，我们将为它实现 UI。我们将使用一个名为 `aleph.js` 的全栈 React\
  \ 框架。我们还将使用 `styled components` 库来创建 UI 组件，并使用 `axiod` 进行网络请求。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n* Styled components\n    * Card\n    * Text\n    * Button\n    * Input\n    *\
  \ Checkbox\n* Todos components\n    * TodoList\n    * TodoDetails\n\n### 目标\n\n\
  在完成本章后，你将能够使用 aleph 模块为 react 应用程序创建 UI。你还能够使用 styled components 创建自定义组件并将其集成到应用中。你还能够使用\
  \ `axiod` 模块进行网络请求。\n\n### Styled components\n\nStyled components 是一个 React 库，允许我们创建具有组件级作用域的\
  \ css 样式的组件。我们将使用该库来创建如 `Button`、`Text`、`Card` 等组件。从上一节初始化的终端切换到 `todos-app` 文件夹。要安装\
  \ styled-components，我们将使用以下 `trex` 命令：\n\n```bash\ntrex -c styled=”https://esm.sh/styled-components@5.3.1”\n\
  ```\n\n安装完成后，我们将在 `StyledComponents.tsx` 文件中创建各种组件。每个组件的代码如下：\n\n```typescript\n\
  import styled, { css } from “styled”\n\nexport const Card = styled.div`\n    display:\
  \ flex;\n    flex-direction: row;\n    background: #ddd;\n    border-radius: 5px;\n\
  \    margin: 10px;\n    justify-content: space-between;\n    align-items: center;\n\
  \    max-width: 600px;\n    margin: “auto”;\n`\n\nexport const Text = styled.span`\n\
  \    font-size: 20px;\n    font-weight: bold;\n    flex: 1;\n    margin-left: 10px;\n\
  \    ${props => props.completed && css`\n      text-decoration: line-through;\n\
  \      color: grey\n    `}\n`\n\nexport const Button = styled.button`\n    /* 根据\
  \ primary prop 调整颜色 */\n    background: ${props => props.primary ? “palevioletred”\
  \ : “white”};\n    color: ${props => props.primary ? “white” : “palevioletred”};\n\
  \    font-size: 1em;\n    margin: 1em;\n    padding: 0.25em 1em;\n    border: 2px\
  \ solid palevioletred;\n    border-radius: 3px;\n    cursor: pointer;\n    ${props\
  \ => props.disabled && css`\n      background: lightgrey;\n      cursor: not-allowed;\n\
  \      border: 2px solid lightgrey;\n    `}\n`\n\nexport const Input = styled.input`\n\
