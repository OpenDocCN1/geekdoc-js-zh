  raw: 'At the worst-case scenario, BFS will explore every single node in the tree.


    For example, if a tree will have up to 4 options per node and the tree can be
    4 levels deep, then the algorithm will store 4^4 = 256 units of memory if it explores
    every node in that tree.


    # Javascript 06: Frontier Search as DFS and BFS


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    When implementing Frontier Search, the algorithm will actually, by default, either
    be Depth-First Search or Breadth-First Search. This will depend on one key factor,
    as we will demonstrate below.


    First, let’s recall the path picker from earlier:


    /*


    // HELPER FUNCTION #1:


    // INPUT: a List of Paths


    // OUTPUT: a Single Path


    // EFFECT: based on positioning of your choice:


    // - Select & remove a path


    // - return that path


    // NOTE: you can modify the position assignment to change the Search Strategy


    */


    function pickPath(f) {


    var position = 0;


    var ret = f[position];


    f.splice(position, 1);


    return ret;


    }


    Note how the path picker works. The output path, chosen from the input array (the
    frontier), is based on an index position. That index is set on the first line
    of the procedure:


    var position = 0;


    When items are entered into an array, they are sent to the end of the array like
    so:


    [0: a][1: b][2: c] <- inserting [d]


    [0: a][1: b][2: c][3: d]


    So setting the position to 0 means that the front (earliest) path on the frontier
    is selected. In other words, the path picker will treat the frontier as a queue.
    Therefore it will be BFS.


    var position = 0;


    Before path picker call: [0: a][1: b][2: c][3: d]


    After path picker call: [0: a][1: b][2: c] Selected For Processing: [d]


    Otherwise, setting the position to the back (latest) path will need this line
    instead:


    var position = f.length-1;


    The line above will set the position to the latest path added to the frontier.
    In other words, the path picker will treat the frontier as a stack. Therefore,
    it will be DFS.


    var position = f.length-1;


    Before path picker call: [0: a][1: b][2: c][3: d]


    After path picker call: [0: b][1: c][2: d] Selected For Processing: [a]


    Now, let’s test everything we know so far on the below graph.


    Bigger Search Graph:￼![M-AI-DeeperFSTree.png](images/00006.jpeg)


    (The code for the graph above is found on Archive A3.2)


    Place the code above into the bottom end of your code to create the graph.


    We start with the completed Node and Path classes from the previous chapter. If
    you need to copy the Search Algorithm, Nodes, and Paths, see Archive A3.1.


    We will then modify the pickPath() method to be either DFS and BFS.


    Step 1:


    We’ll modify our pickPath() in the code below:


    /*


    // HELPER FUNCTION #1: (Modified)


    */


    function pickPath(f) {


    // Breadth-First: uncomment line below to use


    // var position = 0


    // Depth-First: uncomment line below to use


    // var position = f.length-1;


    var ret = f[position];


    f.splice(position, 1);


    return ret;


    }


    Uncomment either of the lines above to set the position.


    Step 2:


    Next, we’ll run and test the algorithm.


    Before we do this, make sure you have the printer() function in your code. You
    can find this from either Javascript-02 or ARCHIVE A-01.


    Moving on, simply add these two lines within your code, just after the code for
    creating the bigger graph:


    pg = search("g", a);


    print(printer(pg))


    There are two nodes that have “g” as their content. The algorithm will output
    either one as the solution depending on which search strategy you use.


    If you set your pickPath() to DFS, the output lines should be:


    Solution Found! Path: a, d, j, g,


    Here’s what happened after the algorithm processed Node a:


    - the algorithm added Nodes b, c, and d into the frontier


    - Node d was added most recently; so it’ll be processed first


    - Its subnode j is added


    - Node j is added most recently; it’ll be processed first


    - Nodes k and g2 are added


    - Node g2 is added most recently; it’ll be processed first


    - Node g2 is a goal. So a path with it and all its ancestor nodes is the solution
    path.


    And if you look at the nodes carefully, you’ll notice that the algorithm went
    “Depth-First”:￼![M-AI-DeeperFSTree (2).png](images/00007.jpeg)


    Otherwise, if you set it to BFS, the output lines should be:


    Solution Found! Path: a, c, g,


    Here’s what happens after the algorithm processes Node a:


    - the algorithm added Nodes b, c, and d into the frontier


    - Node b is added first, so it’s processed first


    - So Nodes e and f are added to the frontier


    - Now the earliest node is c, so it’s then processed


    - Nodes g1, h, and i are added


    - Then Node d is processed, so Node j is added.


    - Nodes e, f, and g1 are processed in that order, since they’re now the oldest
    nodes in the frontier


    - Node g1 is a goal, so a path including it and its ancestors is the solution
    path.


    And if you look at the nodes carefully, you’ll notice that the algorithm went
    “Breadth-First”:￼![M-AI-DeeperFSTree (1).png](images/00008.jpeg)


    where the green-circled nodes have been processed already and the yellow-circled
    ones are in the frontier. They were supposed to be processed as well but the algorithm
    found a solution and finished instead.


    # Chapter 6.3: Lowest-Cost First Search


    ==== ==== ==== ==== ====


    Sometimes, there can be costs between nodes and subnodes. For example, if a node
    had three subnodes, one of them would cost 10 to reach and the other two would
    cost 15.


    So if the algorithm finds a solution, the path will have a total sum of all the
    costs required to reach the solution.


    In this case, we want the solution that takes least overall cost to reach.


    How it works:


    The link between nodes and subnodes are called arcs. They can contain information
    vital for the algorithm to produce a viable, legal solution. For cost-based search
    algorithms, arcs will need costs between a node and a subnode.


    [Node A] - - - -> arc A-B: cost=10 - - - ->[Node b]


    Example: The Lowest-Cost-First Search Algorithm


    Take note of the tree below. The red numbers indicate the cost to travel between
    nodes.￼![M-AI-LCFSTree.png](images/00009.jpeg)


    The algorithm will add Nodes B, C, and D to the frontier, as well as their respective
    costs, 5, 7, and 10\. Which node will require the least cost to travel to? Node
    B. So Node B will be processed first, then Nodes E and F are added to the frontier,
    along with their respective total costs (Node E: 11 = 5+6, Node F: 8=3+5). Node
    C will be processed next, because it now has the lowest cost at 7\. As you can
    see, the node that requires the least cost to reach is processed first.


    Hence, why the algorithm is called LOWEST-COST FIRST.


    Algorithm Analysis: Lowest-Cost-First Search


    Is it Complete?


    Yes, but there are certain conditions that need to be met. You can’t have arc
    costs be zero or any negative numbers. If this happens, you risk having the algorithm
    loop and run forever.


    So as long as the arc costs have real, non-negative values, you can expect the
    algorithm to either deliver a solution or tell you that there isn’t any.


    Is it Optimal?


    Yes, and this is the algorithm variant’s main strength. You can guarantee that
    LCFS will give you a solution and a path that took the lowest cost to reach, as
    long as the arc costs are, again, real and non-negative values.


    Otherwise, the path costs will be distorted and the solution produced might not
    be the optimal one.


    What is its Time Complexity?


    O(b^m)


    At the worst-case, the LCFS algorithm will process all nodes in the tree. For
    example, if a tree had up to 5 subnodes per node and 4 levels down, you’re looking
    at 625 nodes to explore.


    What is its Space Complexity?


    O(b^m)


    At the worst case, the LCFS algorithm will have every node in the tree stored
    into memory. So if you have a tree with 3 subnodes per node and 3 levels down,
    then you may have up to 27 nodes stored into memory.'
