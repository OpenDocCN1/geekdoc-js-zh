    \n现在我们知道预预期发生什么了。例如，如果我们用‘d’作为输入，算法应该找到它并输出节点路径 `a->c->d`。如果我们用‘g’或其他无关的字母作为输入，算法将说未找到。\n\
    \n人工智能将严重依赖搜索算法来为其给的情况提供解决方案和最佳决策。我们稍后会探索更多内容。\n\n同时，让我们开始构建算法。\n\n## 第 1 ：理解并创建节点结构\n\
    \n首先，我们必须为我们的网络构建底层数据结构。我们的 `Nodes` 包含了我们想要使用的数据类型，以及其连接节点列表。由于我们只使用字母，因此我们的 `Node`\
    \ 数据类型可以是 `String`。\n\n将下方的类代码复制到你的 IDE 中。我们将在此基础上构建。\n\n```javascript\n// 一个\
    \ Node 拥有：\n// - 一些内容（你选择的数据类型）\n// - 一个其他连接的节点列表\n// 它可以：\n// - 搜索其所有后代节点以找到解决方案\n\
    // (我们的搜索算法作为一个类方法)\n\nfunction Node(c) {\n  this.contents = c\n  this.children\
    \ = []\n}\n```\n\n之后，我们需要 ![M-AI simpleNetwork-1.png](img/00003.jpeg) 节点网络。\n\n\
    看起来 ‘d’ 连接到 ‘c’，而 ‘b’ 和 ‘c’ 连接到 ‘a’。我们将在代码中重新创建这个网络。\n\n将下面的代码复制并放在你代码的最底部：\n\n\
    ```javascript\n// 创建并连接节点 a, b, c, d\nvar a = new Node(\"a\");\nvar b = new Node(\"\
    b\");\nvar c = new Node(\"c\");\nvar d = new Node(\"d\");\n\na.children.push(b);\n\
    a.children.push(c);\nc.children.push(d);\n```\n\n接下来，我们需要设计 `Path`。\n\n## 第 2\
    \ ：创建 Path 结构\n\n`Path` 将包含一个有序的 `Nodes` 列表。每个节点将与其相邻的节点连接，而 `Path` 中的第一个节点是起始节点。\n\
    \n将下方的类代码复制到你的 IDE 中，放在你放置 `Node` 类之前。\n\n```javascript\n// 一个 Path 拥有：\n// -\
    \ 一个节点列表\n// (可以修改以包含更多方法/字段)\n\nfunction Path() {\n  this.contents = []\n}\n\
    ```\n\n## 第 3 ：开始编写算法\n\n（在我们继续之前，强烈建议复习过去几章中的算法过程。）\n\n在这里，我们的搜索算法将是一个独立函数。我们可以像使用普通函数一样访问它，并将一个\
    \ `Node` 对象作为输入。\n\n由于我们正在检查字母，因此搜索查询将是一个 `String` —— 与 `Node` 容器相同的数据类型。\n\n\
    将主算法放在你代码的下方，紧在你创建的 `Node` 类之后。\n\n```javascript\n/*\n// 主算法：\n// 输入：\n// - 一个目标查询\n\
    // <数据类型与节点内容相同>\n// - 一个起始节点\n// (通过此方法访问起始节点及其图网络)\n// 输出：\n// - 从起始到终点的路径（节点列表）\n\
    // （在 Ruby 中不接受多个输出类型；\n// 如果未找到解决方案，则将空 Path 作为输出）\n// 效果：\n// 边界搜索算法：返回一组\n\
    // 节点\n*/\n\nfunction search(query, start) {\n  // - frontier:= {节点数组}\n  var\
    \ frontier = [];\n  // 创建新的 Path\n  p = new Path();\n  // - 将新的 Path 放入边界\n  frontier.push(start);\n\
