    # Chapter 3: Environment Representation for AI


    ==== ==== ==== ==== ====


    Representation Scheme


    For an Artificial Intelligence unit to be able to generate data and solutions
    for you, it will usually need some sort of data source.


    And sometimes, this data source depends on the environment: the AI agent will
    need to determine and observe the environment that it’s focused on.


    Therefore, the AI agent will need to represent its environment in data. Afterwards,
    it can process that data with its own algorithms and generate solutions.


    # Javascript 03a: Environment Models with Javascript


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    Modelling the Environment


    A very crucial element in artificial intelligence is having a code model of its
    focused environment. For your AI agent to be able to create solutions, it needs
    to know about its environment and surroundings.


    So to model the AI agent’s environment, there are two main ways to do so.


    First, you can either use the “Traffic Light” principle - have enumerations of
    the possible states or conditions of the AI agent’s focus. This is a very simple
    representation of an environment.


    For example, an AI agent can monitor the traffic lights in your closest intersection
    and determine which colour the light will be (either Red, Yellow, or Green).


    Use this for making very simple interpretations of whatever the AI agent focuses
    on.


    var trafficLights = ["Red", "Yellow", "Green"]


    Second, you can describe the environment features into detailed data representations.
    With Object-Oriented Programming, you can simply create class objects about your
    AI’s environment observations - including the many little details as class fields.
    Use this for more natural, detailed environment observations.


    function BeachVisit (loc, tide, crowd, temp) {


    this.location = loc


    this.tide = tide


    this.crowdSize = crowd


    this.temperature = temp


    }


    var b1 = new BeachVisit("Santa Monica Beach",


    "high",


    "large",


    "81f")


    var b2 = new BeachVisit("Santa Monica Beach",


    "medium",


    "medium",


    "78f")


    Environment Models using Data Combinations


    If you choose your AI agent to describe environments via Object-Oriented Programming,
    you can also link two objects from different classes. You create a relationship
    between them, taking note of how they are linked together.


    For example, we can take our beach visit objects and link them together with photos:


    // (assume instances b1 - b25 have been created)


    // all beach visits into an array:


    var allBeachVisits = [b1, b2, b3, b4, b5]


    // (assume instances ph1 - ph7 have been created)


    // all photos into an array:


    var allPhotos = [ph1, ph2, ph3, ph4, ph5, ph6, ph7]


    // Possible Relation Propositions:


    // #1: PhotosTaken


    // proposition: return TRUE if photo has been taken during Beach Visit


    function photoTakenAtVisit(ph1, b3)


    // #2: PhotosTaken


    // proposition: return TRUE if photo has been taken at Beach Visit location


    function photoTakenHere(ph3, b5)


    # Javascript 03b: Creating a Model Environment


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    Now let’s practice creating environments for our AI to examine. This will all
    come together later on, as an AI agent will have a chance to explore its environment
    with its given knowledge and abilities.


    Modelling A House


    The most simple way you can model an environment is the Traffic Light principle
    mentioned earlier.


    If you model your house in a simple enumeration-type data collection, you might
    have something similar below:


    var myHouse = ["livingRoom", "diningRoom", "den", "bathroom1", "bathroom2", "hallway",
    "bedroom1", "bedroom2", "patio"]


    You may also model your house using Object-Oriented Programming. You can represent
    every room in the house as a Room object.


    // A Room has:


    // - a name


    // - adjacent, connected rooms


    function Room(name) {


    this.name = name


    this.connected = []


    this.addRoom = function(room) {


    this.connected.push(room)


    }


    }


    To keep things very simple for now, you can model a simple condo in the heart
    of a thriving downtown core.


    // Create 5 rooms in a simple condo in the City


    var kitchen = new Room("kitchen")


    var livRM = new Room("livingRoom")


    var dineRM = new Room("diningRoom")


    var bd = new Room("bedroom")


    var wr = new Room("washroom")


    /*


    // Connect all rooms as so:


    // <-> Washroom <-> Bedroom <-> livingRoom <-> Kitchen <-> DiningRoom <->


    */


    kitchen.connected.push(livRM, dineRM)


    livRM.connected.push(bd, kitchen)


    bd.connected.push(wr, livRM)


    wr.connected.push(dineRM, bd)


    dineRM.connected.push(kitchen, wr)


    Whichever way you would like to model your environment is up to you.


    Just keep in mind that you will eventually design the AI agent that will correspond
    to your model environment.


    Your Turn


    In Javascript (or whichever programming language you want), create a code model
    of your home based on the to modelling directions above. First, do the “traffic
    light method” by creating a simple enumeration or array of the rooms in your house.


    Then, as Object-Oriented Programming, model your home by having each room represented
    by Room instances. Then, connect each room accordingly.


