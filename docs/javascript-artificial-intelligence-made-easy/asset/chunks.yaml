  trans: "\n\n`Constraint` 过程也没有耗费多少精力。每个朋友的小时数组至少被遍历了两次：一次检查不可用的时间，另 两次或多次以移除它们。\n\
    \n在两个版本之间，差异是数万种组合。\n\n如果现在看起来变化不多，但如果这个过程需要检查**数百**或**数千**个个人——以及他们的可用时间——那么不同版本的过程在投入精力上可能会产生**巨大**差异。\n\
    \n所以请始终记住：当你设计任何类型的算法时，你必须考虑过程的时间和内存空间。如果有更高效的过程，请使用它。\n\n# 第 2 章：逻辑与推理\n\n##\
    \ 逻辑与 AI？\n\n布尔逻辑，或“真/假”逻辑在人工智能领域被广泛使用。它本质上是处理一组非真即假的实和陈述。\n\n思考 AI 的实现方式。你可以使用基于逻辑的编程让\
    \ AI 代理体根据某些条件做出更好的决策。此外，你可以让 AI 代理体诊断技术问题，甚至让 AI 代理体为你执行操作——例如去取咖啡（前提是机器人满足某些条件）。\n\
    \n## 为什么要使用逻辑？\n\n也许最有说服力的理由是，将事实和陈述表示为真或假是如此简单、容易且自然。你可以有一个像“我们今晚要吃牛排晚餐”这样的陈述，但它显然无法用数字表示。你也可以尝试将变量赋值为字符串或对象，但这需要更多的时间和精力。\n\
    \n但作为一个布尔值，“我们今晚要吃牛排晚餐”这个陈述要么为真（True），要么为假（False）。就如此：要么是真的（我们今晚真的要吃牛排），要么是假的。\n\
    \nAI 代理体可以使用多个真/假陈述并以复杂的方式将它们结合。尽管如此，AI 代理体也能更容易更容易管理信息。这是因为一个真陈述可以推导出另一个，再是另一个，最终导致一个结论、决策，甚至是代理体的一项行动方案。\n\
    \n## 添加更多逻辑\n\n如果需要，我们甚至可以轻松地添加更多事实和知识。可以有一个真事实或两个。然后两个真或假事实推导出另一个真理。再如此。例如，我们可以说一个真陈述，如“外面是晴天”，然后是另一个如“外面很暖”。这些陈述可以导致另一个真理：“外面既晴朗又温暖。因此，我将跑步一里”。\n\
    \n如果你将上述内容组合成一个命题语句，它看起来像这样：\n\n“我将跑步一里” <— “外面是晴天” AND “外面是晴天”\n\n如果你使用变量标签来表示上面的陈述，它看起来像这样：\n\
    \n`c <— b AND a`\n\n## 使用逻辑进行调试\n\n相反，你可以使用逻辑来解释某个事实的根源。如果一个陈述是真的，它可以由另一个事实得到解释和证明，然后这些事实又由更多事实证明，以此此类推。这里有一个例子：你发现“电视遥控器无法打开电视”。你仔细观察遥控器，意识到“它的电池没电了”。你更换了遥控器的电池，尝试打开电视，发现它仍然无法打开。你检查了电视的电源线，发现“它没插上”。好，你把它插上，再次尝试打开。这次，它成功了。\n\
    \n你可以将上述内容作为逐步的逻辑陈述：\n\n1) 真：“遥控器**没有**打开电视。”\n\n2) 真：“电视电源线**没有**插上”\n\n3) 真：“遥控器电池**没有**充电”\n\
    \nAND “电视电源线**没有**插上”\n\n这种过程通常用于调试；如果你发现某些东西不起工作，你必须返回检查其内部机制，以弄清楚原因是什么。\n\n\
    ## AI 如何分析基于逻辑的系统\n\nAI 代理体可以根据某些条件是否为真来分析给定的系统。这些条件会导致其他条件变为真或假，然后是其他条件，以此此类推。\n\
    \n执行此此通用方法。首先是自上而下的诊断，过程将检查某些关键条件（最可能是影响其他条件的顶层语句），然后遍历系统以查看结果。\n\n另一种是自下而上的诊断，过程将检查为什么某个最终状态是或不是它应该有的。这是通过检查是什么其他条件导致了它的状态实现的。\n\
    \n# Javascript 02a：使用基于逻辑的 AI\n\n对于下面的过程，请选择一个你喜欢的 IDE。你也可以使用在线 IDE，如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n市上有许多设计和系统。几乎所有的系统都可以表示为基于逻辑的系统——可以由 AI\
    \ 系统进行诊断、修复和分析。然而，为了让 AI 代理体良好地管理系统，其程序员必须非常了解该系统。然后程序员必须很好地将系统表示为逻辑代码。\n\n例如，你家中的电线系统可以使用一系列真/假系统构建。墙上的插座以及房间里的灯都是真/假开关，它们的电源来自断路器和配电箱——这些是更多组真/假开关。这种设计造福了家庭开发者，因为他们可以追踪从外部进入的主电，并判断电力是否流向所有插座、灯以及房屋中任何需要用电的设备。这种设计也有益于房屋居民；如果某个灯或插座不工作，可以一直追溯布线到外部源，查看电力是在哪里被切断的。\n\
    \n## 房屋水流示例：\n\n下面是一个一居室套房的水流图：![M-AI-WaterDiagram.jpg](img/00001.jpeg)\n\n浴缸、卫浴室洗手池和厨房都有水龙头。洗衣机可以短时间启动，使用冷水的组合。马桶有一个开关将水流导向它。马桶要么在冲水，要么不在。此外，还有一个开关可以将水输送到锅炉系统或不。还有标记为\
    \ A 到 H 的水龙头，可以停止或允许水流。最后，主水开关要么允许或停止进入整个套房的水流。\n\n水是否会从某个水源流出取决于房屋中的连接、水龙头和开关。\n\
    \n## 开关和水龙头在哪里？\n\n你可能想做的第一件事是识别上述系统中哪些水流点可以开启和关闭。\n\n如果你看图表，开关：\n\n- 浴缸、卫浴室和厨房的一对冷热水龙头\n\
    - 洗衣机的一对冷热水开关\n- 标记为 A - H 的水龙头\n- 锅炉开关\n- 主水开关\n\n这些将是布尔龙头，状态为真（TRUE）、假（FALSE），或取决于另一个开关/龙头的真假状态。\n\
    \n## 将系统表示为逻辑陈述\n\n在这个阶段，最好先编写代码。我们需要确定每个开关如何将水输送到下一个开关——一直到达居民使用的末端龙头。\n\n我们可以从马桶开始。居民通过冲马桶使用水。我们可以有一个这样的陈述，“马桶可以冲水。因此，它连接到了供水系统”；逻辑符号如下：\n\
    \n```\n ToiletFlushable <- ToiletConnected\n```\n\n我们可以看到龙头 A、B、C 和 D 影响了它的水流，还有马桶连接器和主水开关：\n\
    \n```\n// ToiletConnected <- D and C\n// C <- B and A\n// A <- MainWaterSwitch\n\
    ```\n\n"
- fmt: "\nNow we can move on to the rest of the house. For one, both the `Kitchen\
    \ Taps` and the `Laundry washer` depend on taps `E` and `C`, which depend on taps\
    \ `B`, `A`, and ultimately, the `Main Water Switch`. Since both the `Kitchen`\
    \ and `Laundry` use hot water, both of them also depend on tap `H`.\n\n```\n//\
    \ KitchenTap_Hot <- H\n// KitchenTap_Cold <- E and C\n// LaundryWasher_Hot <-\
    \ H\n// LaundryWasher_Cold <- E and C\n// F and H <- BoilerSwitch\n```\n\nThe\
    \ `Washroom` and `Bathtub` taps each have a hot and cold tap. The washroom cold\
    \ tap depends on switch `C` while the hot tap depends on taps `F` and `G`.\n\n\
    ```\n// WashroomTap_Hot <- F and G\n// WashroomTap_Cold <- C\n```\n\nAnd lastly,\
    \ the bathtub cold water tap depends on tap `B` releasing water, while the hot\
    \ water tap depends on tap `F` to release water.\n\n```\n// BathTubTap_Hot <-\
    \ F\n// BathTubTap_Cold <- B\n```\n\nIf you have everything together, it will\
    \ look like this:\n\n```\n// ToiletFlushable <- ToiletConnected\n// ToiletConnected\
    \ <- D and C\n// C <- B\n// B <- A\n// A <- MainWaterSwitch\n// KitchenTap_Hot\
    \ <- H\n// KitchenTap_Cold <- E and C\n// LaundryWasher_Hot <- H\n// LaundryWasher_Cold\
    \ <- E and C\n// BathTubTap_Hot <- F\n// BathTubTap_Cold <- B\n// WashroomTap_Hot\
    \ <- F and G\n// WashroomTap_Cold <- C\n// F and H <- BoilerSwitch\n```\n\n##\
    \ Using AI to Analyze a system\n\nBecause we’ve mapped out the logical links between\
    \ facts (namely, we now know which taps and switches feed water into what) we\
    \ can start creating procedure to analyze and diagnose the system.\n\nWe’ll create\
    \ both top-down and bottom-up diagnoses for this system, explaining what happens\
    \ for each one.\n\n### The Top-Down Procedure\n\nBased on how the system was mapped\
    \ out using boolean logic, we’ve found five root taps and switches that affect\
    \ the rest of the water system - the `Main Water Switch`, the `Boiler Switch`,\
    \ and taps `D`, `E`, and `G`. Therefore, a Top-down procedure can determine which\
    \ water sources within the house are affected.\n\nYou can find the `Procedure\
    \ Code` in the Archive section.\n\n### The Bottom-Up Procedure\n\nHere, the same\
    \ five root taps and switches are global variables you can toggle `true/false`.\
    \ Then you can run the procedure for one of the water sources in the house to\
    \ check whether or not water flows through it.\n\nYou can also find the `Procedure\
    \ Code` in the Archive section.\n\n# Chapter 3: Environment Representation for\
    \ AI\n\n## Representation Scheme\n\nFor an Artificial Intelligence unit to be\
    \ able to generate data and solutions for you, it will usually need some sort\
    \ of data source.\n\nAnd sometimes, this data source depends on the environment:\
    \ the AI agent will need to determine and observe the environment that it’s focused\
    \ on.\n\nTherefore, the AI agent will need to represent its environment in data.\
    \ Afterwards, it can process that data with its own algorithms and generate solutions.\n\
    \n# Javascript 03a: Environment Models with Javascript\n\nFor the procedure below,\
