  raw: '# EASIEST WAY TO LEARN JAVASCRIPT, Part 2


    To easily run code, select an IDE (Integrated Development Environment: essentially
    somewhere that you write and run code) of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    Part 5a: Arrays in Javascript


    Arrays are a sequenced list of a certain data type. Those data types can be simple
    or compound data.


    To set up an array, follow this syntax:


    var (variable name) = []


    Or:


    (variable name) = []


    You can also access individual items based on that item’s position within the
    array. 0 is the first item; the array size minus one is the last item.


    (In programming, the very 1st number is often 0\. Remember this!)


    For example, you would get the first item of an array like so:


    someArray[0]


    And you would get the last item of an array like so:


    // an Array with room for 10 items:


    someArray[9]


    Part 5b: Iteration


    To process each item in an array, use these lines:


    for (var x in <arrayName>) {


    // every time you mention ‘x’ in this code,


    // it will be applied to every item within the array


    }


    For example, this would print out 1 to 5:


    var a = [1,2,3,4,5]


    for (var x in a) {


    print(a[x])


    }


    Alternatively, you can also iterate them the traditional way. Many other programming
    languages


    for (var x=0; x < arrayName.length;x++) {


    // every time you mention ‘x’ in this code,


    // it will be applied to every item within the array


    }


    Again, this would print out 1 to 5:


    var a = [1,2,3,4,5]


    for (var x=0; x < a.length;x++) {


    print(a[x])


    }


    Part 6: Logic & Operators


    There are three Basic Logic Operators: AND, OR. and NOT.


    AND and OR are used to compare two or more statements that are either True or
    False. They are used in the form of (x AND y) or (x OR y)


    AND is true if all items between it is true. OR is true if either one of its items
    is true.


    NOT returns the opposite of a single statement it’s set to; so ‘NOT true’ would
    be false and ‘NOT False’ would be true.


    In Javascript, here are how the operators are:


    AND operator: &&


    OR operator: ||


    NOT operator: !<boolean>


    Examples:


    // print false:


    print(true && false)


    // print true:


    print(true || false)


    // print false:


    print(!true)


    Part 7: IF-ELSE Statements


    The concept is simple: There’s a boolean statement to check. If it’s true, do
    the procedure after the IF line. If it’s false, do the procedure after the ELSE
    line.


    if (<insert something that would output a boolean>) {


    // code that happens if true


    }


    else {


    // code that happens if false


    }


    Note that the conditional procedures are in between the curly brackets ‘{ }’.


    an IF statement also doesn’t need an ELSE statement; it can be by itself:


    if (<insert something that would output a boolean>) {


    // code that happens if true


    }


    Examples:


    // IF-ELSE together:


    if (age > 20) {


    drinkingAge = true


    }


    else {


    drinkingAge = false


    }


    // IF-statement alone:


    if happy() and knowIt() {


    hands.clap()


    }


    # EASIEST WAY TO LEARN OBJECT-ORIENTED


    We’ve also included a complementary guide to learning Object-Oriented programming
    -one of the most popular types of programming in use today.


    To easily run code, select an IDE (Integrated Development Environment: essentially
    somewhere that you write and run code) of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    1a) Object Oriented Programming


    In the world of programming, you will hear this term very very often.


    This is because Object-Oriented Programming (OOP for short) is one of the most
    widely-used programming styles out there.


    In other programming languages, Classes, a form of composite data, are used to
    group up smaller data into a larger whole.


    The main point of Object-Oriented Programming is this:


    In object-oriented programming, you create ‘copies’ of those classes you’ve designed.
    In even simpler terms, A Class is a data structure that acts as “blueprints”.
    Those “created copies” you’ve made, based on that class ‘blueprints’, are called
    Objects.


    But why? Because as you learn more and more about programming, you will encounter
    the notion of Abstraction - applying a general idea across multiple times and
    scenarios - ultimately saving time and effort, while greatly reducing confusion
    and frustration.


    Re-coding the same composite data over and over would lead to more effort and
    frustration, whereas re-using the same idea leads to efficiency and consistency.


    2) Classes & Constructors


    Constructors are special class methods. Based on the classes they belong to, they
    create Objects for you.


    In Javascript, functions are used as a combined class and constructor. When defining
    a class, you define its constructor function at the same time.


    To define a class - as well as its constructor - in Javascript, use the following
    syntax:


    var ClassName = function(<any inputs>) {


    // insert methods, fields, and other code here


    }


    Also, the constructor is simply your class name as a function. To create a data
    object based on a certain class, follow this syntax:


    var <variable name> = new Classname()


    You’re essentially setting some other variable as a data object.


    Example:


    var House = function() {


    // insert code here


    }


    var h = new House()


    To call a class object, simply refer to it:


    Example:


    let h = House()


    var MyHouse = h


    3) OOP Terminology


    Variables and Functions can take on new roles in OOP. They can be called Fields
    and Methods, respectively. They can also be called Members functions or Member
    Variables. In some cases, it’s really up to you to use which names you want, just
    as long as you understand what other programmers mean when they use these terms.


    Fields represent variables in OOP because, just like fields in any entry form,
    data objects can have fields with as many different values as you can think of.


    Think of fields as a certain attribute for an object. Each object might have different
    attributes from each other:


    var Cat = function() {


    var color = "green"


    }


    // these cats are objects based on Cat class:


    catA.color = "white"


    catB.color = "grey"


    catC.color = "orange"


    Methods represent the functions that Objects have. Think of Methods as ‘actions’
    and ‘behaviours’ that objects do.


    To create a class Method for a particular Class, follow this syntax:


    <Class Name>.prototype.<Method Name> = function() {


    // some code


    }


    Example:


    Cat.prototype.meow = function() {


    // some code


    }


    Moving onwards, in OOP you need to access the method from an object itself. For
    example, if we create a few Cat objects based on some Cat Class, each Cat object
    would have all the methods defined on the Cat Class:


    class Cat{


    // some code


    }


    Cat.prototype.meow = function() {


    // some code


    }


    // these cats are objects based on Cat class:


    catA.meow()


    catB.meow()


    catC.meow()


    Lastly, remember that Methods are still functions at heart. You still place them
    in code where you expect a function output’s data type to be.


    Example:


    // Outputs a String


    Fox.prototype.say = function() {


    return "ringdingdingding"


    }


    var whatDoesTheFoxSay = someFox.say()


    print(whatDoesTheFoxSay)


