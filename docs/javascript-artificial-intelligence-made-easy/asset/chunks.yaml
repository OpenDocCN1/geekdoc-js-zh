    // EFFECT: based on positioning of your choice:


    // - Select & remove a path


    // - return that path


    // NOTE: you can modify the position assignment to change the Search Strategy


    */


    function pickPath(f) {


    var position = 0;


    var ret = f[position];


    f.splice(position, 1);


    return ret;


    }


    Step 5: Add the Goal-checking Function


    This function helps the algorithm check a path for solutions. It will check all
    the nodes in a path to see if one of them has the contents the algorithm is looking
    for.


    Since our query is a String, we’ll use that data type as a function input. We’ll
    also have a Path of Nodes as an input; we’ll check whether or not there’s a solution
    within these nodes.


    Like the other helper function, place this one in your code just after where placed
    the Search Algorithm.


