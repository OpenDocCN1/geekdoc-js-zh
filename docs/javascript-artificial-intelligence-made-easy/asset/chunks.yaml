    // - Node contents that have a solution


    // <same data type as Node’s container>


    // OUTPUT: boolean


    // EFFECT: outputs True if path contains a Goal


    */


    function hasGoal(s, p) {


    for (i in p.contents) {


    if (p.contents[i].contents == s) return true;


    }


    return false;


    }


