    \    // (使用辅助函数 pickPath() )\n    pick = pickPath(frontier);\n\n    // 如果节点 (sk)\
    \ 是目标节点，则返回所定的 Path\n    if (hasGoal(query, pick)) {\n      return pick;\n   \
    \ }\n    else {\n      // 对于结束节点 sk 的每个连接节点:\n      // - 为选定的 Path 制作拷贝\n    \
    \  // - 将 sk 的连接节点添加到路径拷贝中\n      // - 将拷贝的 Path <s0, s1,….,sk, s> 放入边界;\n   \
    \   size = pick.contents.length;\n      last = pick.contents[size - 1];\n    \
    \  for (n in last.children) {\n        toAdd = new Path();\n        for (x in\
    \ pick.contents) {\n          toAdd.contents.push(pick.contents[x])\n        }\n\
    \        toAdd.contents.push(last.children[n]);\n        frontier.push(toAdd);\n\
    \      }\n    }\n  }\n\n  // - 如果边界为空，则指示“无解决方案”\n  // (如果没有解决方案，我们将输出 false)\n\
    \  return false;\n}\n```\n\n简化函数的功能被认为是一种良好的编程习惯。因此，与其让我们的算法函数执行很多操作，它将调用辅助函数来简化工作量。这使得程序员更容易更容易检查、编辑、调试和修改代码。\n\
    \n## 第 4 ：添加边界选择器函数\n\n边界搜索的路径选择函数是可自定义的，对吧，因为修改此函数会影响搜索策略。我们稍后会介绍更多搜索策略。现在，只需确保函数正确地选择、移除并输出路径即可。\n\
    \n将此辅助函数放在你代码中位于搜索算法之前的某个位置。\n\n```javascript\n/*\n// 辅助函数 #1：\n// 输入：路径列表\n//\
    \ 输出：单个 Path\n// 效果：基于你选择的位置：\n// - 选择并移除一个路径\n// - 返回该路径\n// 注意：你可以修改位置赋值来更改搜索策略\n\
    */\n\nfunction pickPath(f) {\n  var position = 0;\n  var ret = f[position];\n\
    \  f.splice(position, 1);\n  return ret;\n}\n```\n\n## 第 5 ：添加目标检查函数\n\n此函数帮助算法检查路径是否有解决方案。它将检查路径中的所有节点，查看其中一个是否包含算法寻找的内容。\n\
    \n```javascript\n/*\n// 辅助函数 #2：\n// 输入：\n// - 一个 Path\n// - 解决方案\n// <与节点容器相同类型>\n\
    // 输出：布尔值\n// 效果：如果路径包含目标，则输出 True\n*/\n\nfunction hasGoal(s, p) {\n  for (i in\
    \ p.contents) {\n    if (p.contents[i].contents == s) return true;\n  }\n  return\
    \ false;\n}\n```\n\n算法测试\n\n"
- fmt: "\nAnd finally, we test our algorithm. There’s at least three major scenarios\
    \ to think of: searching for the starting node’s letter; searching for a letter\
    \ further down the network; and searching for a letter that’s not in the network.\
    \ For each of these times, we want the algorithm to run through the scenario properly.\n\
    \nInsert this testing function in your code just after your `Search Algorithm`\
    \ and `Helper Functions`:\n\n```javascript\nfunction printer(p) {\n  if (p ==\
    \ false) return \"NOTE: No Solution Found\";\n  else {\n    var s = \"Solution\
    \ Found! Path: \";\n    for (i = 0; i<p.contents.length; i++) {\n      s += p.contents[i].contents\
    \ + \", \";\n    }\n    return s;\n  }\n}\n```\n\nAfterwards, we’ll create a few\
    \ paths generated from our `Search Algorithm`. Place the code at the very bottom\
    \ of your code, just after the node network you’ve created.\n\n```javascript\n\
    // test search()\npa = search(\"a\", a);\npc = search(\"c\", a);\npd = search(\"\
    d\", a);\npg = search(\"g\", a);\n```\n\nA search for the starting node’s letter\
    \ should output a `Path` with just the starting node. So Path `pa` should have\
    \ a path with only node `a` in it. If everything was done right, the code below\
    \ should print out, “Solution Found! Path: a, ”.\n\n```javascript\nprint(printer(pa))\n\
    ```\n\nA search for a letter somewhere down the network should output a `Path`\
    \ with a sequenced list of `Nodes`. Paths `pc` and `pd` should have nodes `a,\
    \ c` and `a, c, d` respectfully. If the codes below run, then they should print\
    \ out their respective paths:\n\n```javascript\nprint(printer(pc))\nprint(printer(pd))\n\
    ```\n\nA search for a letter that isn’t in the network should output `false`,\
    \ according to our current `Search algorithm`. So if `pg` is an argument for the\
    \ `printer` function, it should output `false`. If you run the line of code below,\
    \ it should notify you that a solution isn’t found (`g` currently isn’t in the\
    \ network)\n\n```javascript\nprint(printer(pg))\n```\n\nAnd there we have it.\
    \ A successfully operating Frontier Search algorithm. \n\n# Chapter 6: Search\
    \ Strategies\n\nAs mentioned earlier, the way the search algorithm picks a path\
    \ from the frontier will determine the overall algorithm search strategy.\n\n\
    Now that we’ve developed our search algorithm, we can now modify it to suit any\
    \ situation that arises.\n\nBelow are the four main ways that the search algorithm\
    \ will pick a path to explore. The path picked from the frontier is either:\n\
    - the most recently added (Stack)\n- the least recently added (Queue)\n- the one\
    \ with the least cost (Priority Queue)\n- the one with the most value (Priority\
    \ Queue)\n\nWe’ll explore and analyze each strategy and implement them with our\
    \ search algorithm.\n\n# Chapter 6.1: Depth-First Search\n\nIn Depth-First Search,\
    \ the algorithm treats the `Frontier Options` as a `Stack`. Therefore, if the\
    \ algorithm has a list of unexplored options it has yet to examine, it will explore\
    \ the options and sub-options first.\n\n### Use Depth-First Search When:\n1. You\
    \ expect long path lengths; in other words, the solutions will have long sets\
    \ of options to get there.\n2. You don’t expect any nodes that are subnodes to\
    \ each other.\n3. You don’t have much space available.\n\n### Don’t use Depth-First\
    \ Search When:\n- The three looks fairly shallow. In other words, there aren’t\
    \ many levels of `Option` nodes in the tree.\n- If having the best possible solution\
    \ is very important.\n\n### Example: The Depth-First Search Algorithm\n\nConsider\
    \ the graph below. If all these nodes are placed on a to-do list for the algorithm,\
    \ the last node added to the frontier would be processed first.\n\nNode `#1`’s\
    \ options are added to the frontier: `#2`, `#7`, and `#8`. If Node `#2` was added\
    \ last, it would be processed first. So Nodes `#3` and `#6` would be added. If\
    \ `#3` was added last, then it would be processed first - so that means adding\
    \ `#4` and `#5` to the frontier. The node depths are explored first - hence, why\
    \ it’s !![pasted-image.png](images/00004.jpeg) DEPTH-FIRST search.\n\n### Algorithm\
    \ Analysis: Depth-First Search\n\n#### Is it Complete?\nSort of. Why? If there\
    \ are any loops or cycles in the graph (meaning one of the end nodes link up to\
    \ the beginning nodes, thus creating a loop) the algorithm might be stuck. It\
    \ will keep exploring the end node, the beginning node, the path between them,\
    \ the end node again, and so on and so on - probably in a sort of infinite loop.\n\
    \nOn the other hand, if there are no loops or cycles in the node network, this\
    \ algorithm is complete.\n\n#### Is it Optimal?\nNo. If it gives off the first\
    \ solution it encounters, it may not necessarily be the best one. There may be\
    \ better solutions that have yet to be encountered before the algorithm gets to\
    \ it.\n\n#### What is its Time Complexity?\n`O(b^m)`\n\nMeaning, at the worst-case\
    \ scenario, the algorithm will explore every node and reach the furthest tree\
    \ depth. For example, if a node in a tree has up to 2 options and the entire tree\
    \ can be up to 4 levels deep, the worst-case complexity will be `2x2x2x2 = 16`\
    \ nodes possibly explored.\n\n#### What is its Space Complexity?\n`O(b*m)`\n\n\
    Meaning, at the worst-case scenario, a path for unexplored nodes will be stored\
    \ in memory for every node explored. The longest path possible is the furthest\
    \ tree depth. Also, every node has a maximum amount of nodes it can explore. For\
    \ example, if a tree will have up to 2 options per node and the tree can be 4\
    \ levels deep, then the algorithm will store `2x4 = 8` units of memory.\n\n# Chapter\
    \ 6.2: Breadth-First Search\n\nWhile Depth-first search has a `Stack` for the\
    \ frontier, Breadth-first search has a `Queue`. In other words, if the algorithm\
    \ has a list of options to explore, it will select the earliest added options\
    \ and sub-options.\n\n### Use Breadth-First Search When:\n- you don’t have to\
    \ worry about memory space.\n- you NEED a solution with the least amount of options\
    \ chosen.\n- there are some options that can be explored that don’t need depth.\n\
    \n### Don’t use Breadth-First Search When:\n- solutions tend to need a lot of\
    \ options chosen (i.e. they’re deep into the tree).\n- you have a limited amount\
    \ of space.\n- there’s a high branching factor (nodes with many subnodes/options).\n\
    \n### Example: The Breadth-First Search Algorithm\n\nConsider the graph below.\
    \ If all these nodes are placed on a to-do list for the algorithm, Node `#1` would\
    \ be processed first, then it’s sub-nodes `#8`, `#7`, `#2` would be added to the\
    \ frontier. Since Node `#8` was entered first, it will be processed first. So\
    \ Nodes `#9` and `#12` are added. Then `#7` is processed. Then `#2`, which adds\
    \ Nodes `#6` and `#3` to the frontier. Overall, the algorithm will explore all\
    \ nodes level first - hence why it’s !![pasted-image-1.png](images/00005.jpeg)\n\
    \n### Algorithm Analysis: Breadth-First Search\n\n#### Is it Complete?\nYes, as\
    \ long as there’s a limited number of subnodes. When there are nodes that are\
    \ children to each other (for example: Node `X` is a sub-node to Node `Y`, and\
    \ vice-versa), this would normally create a loop for Depth-first search. Node\
    \ `X` would be added to the frontier, processed, then Node `Y` would be added\
    \ and processed, then Node `X` is added, and so on - in an infinite loop. This\
    \ won’t happen in BFS. However, if a tree has infinite subnodes per node, then\
    \ BFS certainly won’t stop. There will be just too many nodes to explore.\n\n\
    #### Is it Optimal?\nPossibly. Because BFS is likely to find the solutions with\
    \ the least number of options/steps, there is a chance the solution will be optimal.\n\
    \n#### What is its Time Complexity?\n`O(b^m)`\n\nJust like DFS, BFS will, at the\
    \ worst-case scenario, explore every node and reach the furthest tree depth. For\
    \ example, if a node in a tree has up to 3 options and the entire tree can be\
    \ up to 4 levels deep, the worst-case complexity will be `3x3x3x3 = 81` nodes\
    \ possibly explored.\n\n#### What is its Space Complexity?\n`O(b^m)`\n"
