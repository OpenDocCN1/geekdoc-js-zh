    For now, we focus on Default Knowledge and abilities.


    AI Knowledge by Default


    Your AI agent can receive, by default, a fixed set of all information it will
    ever need. If you believe some part of your AI agent’s information won’t change,
    you may model your AI agent’s information this way.


    For example, your AI agent may be a self-driving vehicle. The rules of the road
    will stay consistent in the long term. Also, its driving patterns and techniques
    will stay consistent too. The road maps will also stay consistent.


    Therefore, your self-driving vehicle can navigate its way through a city and make
    its way from two points.


    AI Knowledge by Learning


    Your AI agent can learn and acquire information about the environment it’s focused
    on. Its algorithms and processes can also use this new information to create up-to-date
    results and solutions. However, your AI agent will need a default set of knowledge
    - so it will be able to compute even if it doesn’t acquire any new information.
    Overall, if you find that your AI agent’s environment will change and vary over
    time (therefore affecting its processes), you may have your AI agent continuously
    learn about its environment and update its knowledge.


    For example, your AI agent - as a self-driving vehicle - may be based on your
    local area. You know that residences may change owners over time and business/shops
    will be created or shut down. Also, traffic patterns can change throughout the
    day; there could be an accident at this street, or that street will have heavy
    gridlock during rush hour. Your AI agent can take note of all this information
    in order to get from place to place consistently and efficiently - by taking the
    better routes and even knowing where to go (or if a place for it to go to even
    exists).


    # Chapter 5: How to Create a Problem-Solving AI


    ==== ==== ==== ==== ====


    Let’s start developing our Search algorithm: an automatic problem solver. We’ll
    have a general overview of it in Pseudocode. Then you’ll get to code and run it
    on your own, with this book’s primary programming language.


    Abstract Search Algorithm


    In its most basic procedure, a search algorithm will have a default condition
    and a goal condition. It will then evaluate each option it can take, starting
    from the default condition, step-by-step, until it eventually finds a full set
    of options to achieve the goal condition.


    The General Frontier Search Algorithm:


    The Frontier Search algorithm follows the same procedure as above. Given a start
    node, goal nodes, and an entire network, it will incrementally assess and explore
    pathways from the start node until it reaches the goal node.


    The Frontier is simply a list of paths to be checked. The Frontier Search algorithm
    will keep adding paths to the Frontier until it either finds a solution or has
    explored the entire network


    For example, this is just like giving a Search Algorithm a map of your local city,
    your current location, and a restaurant you’re about to go to. That search algorithm
    will give you directions to get there.


    The standard data structure to use a Search Algorithm with is a Network of interconnected
    Nodes. Each node contains an amount of data and a list of connected nodes:


    // A Node has:


    // - its data (any data type you want)


    // - a set of connected nodes


    class Node


    <some data type>: contents


