    # 序言：作为人工智能的 JAVASCRIPT


    Javascript 最近作为主要的网页技术之一（`HTML`、`CSS` 和 Javascript）掀起了热潮。许多网站和应用程序正在全面采用 Javascript
    技术来执行大多数任务。最棒的一点是 Javascript 是一种客户端语言，这意味着计算是由你的计算机或移动设备完成的，而不是服务器本身。因此，即使服务器不可用，应用程序依然。


    本书的目标是通过 Javascript 代码将你的编程技能扩展到一个新的范式——即人工智能领域。你可能是一个希望学习新技能的熟练程序员，也可能是编程新手，或者两者兼有。


    ## 你的快速开始


