    厨房龙头没有热水.\")\n}\n// 厨房冷龙头 <- E 和 C\nif (tapE && tapC) {\n  print(\"水龙头 C 已开启.\
    \ \")\n  print(\"水龙头 E 已开启.\")\n  print(\"冷水可以流过厨房龙头.\")\n} else {\n  print(\"\
    厨房龙头没有冷水.\")\n}\nreturn\n}\n\nif (mode == 5){\n// 洗衣机热水 <- H\nif (tapH) {\n  print(\"\
    水龙头 H 已开启.\")\n  print(\"洗衣机有热水.\")\n} else {\n  print(\"进入洗衣机没有热水.\")\n}\n//\
