    \ warm outside”. These statements can lead to another truth: “It’s sunny AND warm\
    \ outside. Therefore, I will be running for a mile”.\n\nIf you put the above together\
    \ into a proposition statement, it would look like so:\n\n“I will be running for\
    \ a mile” <— “it’s sunny outside” AND “it’s sunny outside”\n\nAnd if you use variable\
    \ labels to represent the above statements, it would look like so:\n\n`c <— b\
    \ AND a`\n\n## Debugging with Logic\n\nConversely, you can use logic to explain\
    \ the root causes of a certain fact. If one statement is true, it can be explained\
