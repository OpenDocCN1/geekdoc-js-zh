  trans: "\n最后，我们来测试算法。至少有三种主要的场景需要考虑：搜索起始节点的字母；搜索网络中更靠处的字母；搜索网络中不存在的字母。对于每种情况，我们都希望算法能够正确运行。\n\
    \n在代码中 `Search Algorithm`（搜索算法）和 `Helper Functions`（辅助函数）之后插入此测试函数：\n\n```javascript\n\
    function printer(p) {\n  if (p == false) return \"NOTE: No Solution Found\";\n\
    \  else {\n    var s = \"Solution Found! Path: \";\n    for (i = 0; i<p.contents.length;\
    \ i++) {\n      s += p.contents[i].contents + \", \";\n    }\n    return s;\n\
    \  }\n}\n```\n\n之后，我们将根据 `Search Algorithm` 生成几条路径。将这些代码放在代码的最底部，紧接在你创建的节点网络之后。\n\
    \n```javascript\n// test search()\npa = search(\"a\", a);\npc = search(\"c\",\
    \ a);\npd = search(\"d\", a);\npg = search(\"g\", a);\n```\n\n对起始节点字母的搜索应该输出一个仅包含起始节点的\
    \ `Path`。因此，路径 `pa` 应该包含一个仅有节点 `a`。如果一切操作正确，下面的代码将打印出“Solution Found! Path: a,”。\n\
    \n```javascript\nprint(printer(pa))\n```\n\n对网络中某处字母的搜索应该输出一个包含有序 `Nodes` 列表的\
    \ `Path`。路径 `pc` 和 `pd` 应分别包含节点 `a, c` 和 `a, c, d`。如果以下代码运行，它们应该打印出各自的路径：\n\n\
    ```javascript\nprint(printer(pc))\nprint(printer(pd))\n```\n\n根据我们目前的 `Search\
    \ algorithm`，对网络中不存在字母的搜索应该输出 `false`。因此，如果 `pg` 是 `printer` 函数的参数，它应该输出 `false`。运行下行代码，它会提示你未找到解决方案（`g`\
    \ 目前不在网络中）\n\n```javascript\nprint(printer(pg))\n```\n\n这样，我们就有了一个运行良好的 Frontier\
    \ Search（边界搜索）算法。 \n\n# 第 6 章：搜索策略\n\n如前所述，搜索算法从边界（Frontier）中选择路径的方式将决定算法的整体搜索策略。\n\
    \n现在我们已经开发了搜索算法，可以对其进行修改以适应任何出现的情况。\n\n以下是搜索算法选择路径进行探索的四种主要方式。从边界中选择的路径是：\n- 最近被添加的（栈，Stack）\n\
    - 最早被添加的（队列，Queue）\n- 成本最低的（优先级队列，Priority Queue）\n- 价值最高的（优先级队列，Priority Queue）\n\
    \n我们将探索并分析每种策略，并并在我们的搜索算法中实现它们。\n\n# 第 6.1 章：深度优先搜索\n\n在深度优先搜索（Depth-First Search）中，算法将\
    \ `Frontier Options`（边界选项）视为一个 `Stack`。因此，如果算法有一组待检查的探索选项，它将首先探索这些选项和子选项。\n\n\
    ### 在以下情况下使用深度优先搜索：\n1. 你预期路径长度很长；句话说，解决方案需要很长的选项集合到达那里。\n2. 你不预期任何节点之间存在子节点关系。\n\
    3. 你没有足够的可用空间。\n\n### 在以下情况下不要使用深度优先搜索：\n- 深度看起来相当浅。换句话说，树中的 `Option`（选项）节点层级不多。\n\
    - 如果拥有最优解决方案非常重要。\n\n### 示例：深度优先搜索算法\n\n考虑下面的图表。如果将所有节点都置于算法的待办列表中，最后添加到边界的节点将首先被处理。\n\
    \n节点 `#1` 的选项被添加到边界：`#2`、`#7` 和 `#8`。如果节点 `#2` 是最后添加的，它将首先被处理。于是添加节点 `#3` 和 `#6`。如果\
    \ `#3` 是最后添加的，它将首先被处理——这意味着向边界添加了 `#4` 和 `#5`。节点深度首先被探索——这就是为什么它是 !![pasted-image.png](img/00004.jpeg)\
    \ 深度优先（DEPTH-FIRST）搜索。\n\n### 算法分析：深度优先搜索\n\n#### 它是完备的（Complete）吗？\n差不多。为什么？如果图中存在任何循环或环（意味着一个端节点连接回起始节点，从而形成循环），算法可能会卡住。它将不断探索端节点、起始节点、它们之间的路径、再次端节点，以此类——可能陷入某种无限循环中。\n\
    \n另一方面，如果节点网络中没有循环或环，该算法就是完备的。\n\n#### 它是最优的（Optimal）吗？\n不是。如果它直接给出遇到的第一个解决方案，它不一定是最好的。在算法找到更好的解决方案之前，可能存在尚未遇到的更好方案。\n\
    \n#### 它的时间复杂度是多少？\n`O(b^m)`\n\n意味着在最坏情况下，算法将探索每个节点并达到最远的树深。例如，如果树中的一个节点最多有 2\
    \ 个选项，而整棵树最多有 4 层深，最坏情况的复杂度可能是探索 `2x2x2x2 = 16` 个节点。\n\n#### 它的空间复杂度是多少？\n`O(b*m)`\n\
    \n意味着在最坏情况下，对于每个探索的节点，内存中都会存储一条未探索节点的路径。可能的长路径是最远的树深。此外，每个节点都有可以探索的节点数量限制。例如，如果一个树每个节点最多有\
    \ 2 个选项，树深为 4 层，那么算法将存储 `2x4 = 8` 个内存。\n\n# 第 6.2 章：广度优先搜索\n\n深度优先搜索对边界使用 `Stack`，而广度优先搜索使用\
    \ `Queue`（队列）。换句话说，如果算法有一组待探索的选项列表，它将选择最早添加的选项和子选项。\n\n### 在以下情况下使用广度优先搜索：\n-\
    \ 你不需要担心内存空间。\n- 你**需要**一个选择选项最少的解决方案。\n- 有某些不需要深度即可探索的选项。\n\n### 在以下情况下不要使用广度优先搜索：\n\
    - 解决方案往往需要选择很多选项（即它们很深）。\n- 你的空间有限。\n- 分支因子很高（许多子节点/选项）。\n\n### 示例：广度优先搜索算法\n\n\
    考虑下面的图表。如果将所有节点都置于算法的待办列表中，节点 `#1` 将首先被处理，然后是子节点 `#8`、`#7` 和 `#2` 被添加到边界。由于 `#8`\
    \ 最先进入，它将首先被处理。于是添加了 `#9` 和 `#12`。然后处理 `#7`。接着是 `#2`，它向边界添加了 `#6` 和 `#3`。总体而言，算法将优先按层探索所有节点——这就是为什么它是\
    \ !![pasted-image-1.png](img/00005.jpeg)\n\n### 算法分析：广度优先搜索\n\n#### 它是完备的吗？\n\
    是的，只要子节点数量有限。当节点之间存在相互关系（例如：节点 `X` 是节点 `Y` 的子节点，反之亦然），这通常会导致深度搜索产生循环。节点 `X` 被添加到边界并处理，然后节点\
    \ `Y` 被添加并处理，接着是 `X`，以此类推——陷入无限循环。这在 BFS 中不会发生。然而，如果树的每个节点都有无限子节点，那么 BFS 肯定不会停止。待的节点太多。\n\
    \n#### 它是最优的吗？\n可能。因为 BFS 可能会找到选项/步骤最少的解决方案，解决方案可能是最优的。\n\n#### 它的时间复杂度是多少？\n\
    `O(b^m)`\n\n与 DFS 类似，BFS 在最坏情况下将探索每个节点并达到最远的树深。例如，如果树中的一个节点最多有 3 个选项，而整棵树最多有 4\
    \ 层深，最坏情况的复杂度可能是探索 `3x3x3x3 = 81` 个节点。\n\n#### 它的空间复杂度是多少？\n`O(b^m)`\n\n"
