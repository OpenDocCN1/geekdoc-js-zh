    Anna, Betty, Cara, and Diana can hang out at: 16:00


    Anna, Betty, Cara, and Diana can hang out at: 17:00


    Computing Effort: Generate-and-Test


    This procedure will create a LOT of hour combinations to check. Roughly, it’s
    the number of hours per friend, to the power of how many friends to schedule:


    (# of hours) ^ (# of friends)


    In our example, we have hours 9 to 23, so that’s 15 hours per friend. We have
    four friends. So that’s 15^4 = 50625 possible hour combinations to check. Don’t
    worry; we’re just very lucky that a computer can solve this for us.


