  trans: "\n现在我们可以处理房子的其余部分。首先，`Kitchen Taps`（厨房龙头）和 `Laundry washer`（洗衣机）都取决于水龙头\
    \ `E` 和 `C`，而它们又取决于水龙头 `B`、`A`，最终取决于 `Main Water Switch`（主水开关）。由于`Kitchen`和洗衣房都使用热水，因此它们也都依赖于水龙头\
    \ `H`。\n\n```\n// KitchenTap_Hot <- H\n// KitchenTap_Cold <- E and C\n// LaundryWasher_Hot\
    \ <- H\n// LaundryWasher_Cold <- E and C\n// F and H <- BoilerSwitch\n```\n\n\
    `Washroom`（浴室）和 `Bathtub`（浴缸）的水龙头各有一个热水和一个冷龙头。浴室的冷龙头取决于开关 `C`，而热水龙头依赖于水龙头 `F`\
    \ 和 `G`。\n\n```\n// WashroomTap_Hot <- F and G\n// WashroomTap_Cold <- C\n```\n\
    \n最后，浴缸的冷水龙头取决于水龙头 `B` 放水，而热水龙头依赖于水龙头 `F` 放水。\n\n```\n// BathTubTap_Hot <- F\n\
    // BathTubTap_Cold <- B\n```\n\n如果你将所有内容整合在一起，它看起来是这样的：\n\n```\n// ToiletFlushable\
    \ <- ToiletConnected\n// ToiletConnected <- D and C\n// C <- B\n// B <- A\n//\
    \ A <- MainWaterSwitch\n// KitchenTap_Hot <- H\n// KitchenTap_Cold <- E and C\n\
    // LaundryWasher_Hot <- H\n// LaundryWasher_Cold <- E and C\n// BathTubTap_Hot\
    \ <- F\n// BathTubTap_Cold <- B\n// WashroomTap_Hot <- F and G\n// WashroomTap_Cold\
    \ <- C\n// F and H <- BoilerSwitch\n```\n\n## 使用 AI 分析系统\n\n由于我们已经映射了事实之间的逻辑链接（也就是说，我们现在知道哪些龙头和开关为哪些地方供水），我们可以开始创建用于分析和诊断系统的程序。\n\
    \n我们将为该系统创建自上而下和自下而上的诊断，并解释每种方法发生的情况。\n\n### 自上而下的程序\n\n根据使用布尔逻辑映射系统的方式，我们发现了五个影响其余水系统的根源龙头和开关——`Main\
    \ Water Switch`（主水开关）、`Boiler Switch`（锅炉开关）以及龙头 `D`、`E` 和 `G`。因此，自上而下的程序可以确定房屋内的哪些水源受影响。\n\
    \n你可以在 Archive（存档）部分找到 `Procedure Code`（程序代码）。\n\n### 自下而上的程序\n\n在这里，同样的五个根源龙头和开关是全局变量，你可以切换它们的\
    \ `true/false`。然后你可以运行房屋内其中一个水源的程序，以检查水是否流过那里。\n\n你可以在 Archive（存档）部分找到 `Procedure\
    \ Code`（程序代码）。\n\n# 第 3 章：AI 的环境表示\n\n## 表示方案\n\n为了让人工智能单元能够为你生成数据和解决方案，它通常需要某种数据源。\n\
    \n有时，这种数据源取决于环境：AI 代理需要确定并观察它所关注的环境。\n\n因此，AI 代理需要用数据来表示其所处的环境。此后，它可以使用自己的算法处理这些数据并生成解决方案。\n\
    \n# Javascript 03a：使用 Javascript 构建环境模型\n\n对于下面的程序，请选择你喜欢的 IDE。你也可以使用在线 IDE，如\
    \ `rextester.com`、`ideone.com` 或 `codpad.org`。\n\n## 环境建模\n\n人工智能中一个非常关键的元素是拥有其关注环境的代码模型。为了让你的\
    \ AI 代理能够创建解决方案，它需要了解其环境和周围环境。\n\n所以，为 AI 代理的环境建模有两种主要方法。\n\n首先，你可以使用“红绿灯”原则——对\
    \ AI 代理关注的可能状态或条件进行枚举。这是一种非常简单的环境表示。\n\n例如，AI 代理可以监控你最近的交叉口的红绿灯，并判断灯将变成什么颜色（`Red`\
    \ 红、`Yellow` 黄或 `Green` ）。\n\n使用这种方法对 AI 代理关注的任何内容进行非常简单的解释。\n\n```javascriptvar\
    \ trafficLights = [\"Red\", \"Yellow\", \"Green\"]\n```\n\n其次，你可以将环境特征描述为详细的数据表示。通过面向对象编程，你可以简单地创建关于你\
    \ AI 环境观测的类对象——将许多小细节作为类字段。使用这种方法进行更自然、更详细的环境观察。\n\n```javascript\nfunction BeachVisit\
    \ (loc, tide, crowd, temp) {\n  this.location = loc\n  this.tide = tide\n  this.crowdSize\
    \ = crowd\n  this.temperature = temp\n}\n\nvar b1 = new BeachVisit(\"Santa Monica\
    \ Beach\", \"high\", \"large\", \"81f\")\nvar b2 = new BeachVisit(\"Santa Monica\
    \ Beach\", \"medium\", \"medium\", \"78f\")\n```\n\n### 使用数据组合的环境模型\n\n如果你选择让\
    \ AI 代理通过面向对象编程来描述环境，你还可以链接来自不同类的两个对象。你在它们之间建立关系，并注意它们是如何链接在一起的。\n\n例如，我们可以将海滩访问对象与照片链接在一起：\n\
    \n```javascript\n// （假设实例 b1 - b25 已创建）\n// 将所有的海洋访问放入数组：\nvar allBeachVisits\
    \ = [b1, b2, b3, b4, b5]\n// （假设实例 ph1 - ph7 已创建）\n// 将所有照片放入数组：\nvar allPhotos\
    \ = [ph1, ph2, ph3, ph4, ph5, ph6, ph7]\n\n// 可能的关系命题：\n// #1: PhotosTaken\n//\
    \ 命题：如果在海滩访问期间拍摄了照片，则返回 TRUE\nfunction photoTakenAtVisit(ph1, b3)\n// #2: PhotosTaken\n\
    // 命题：如果在海滩访问地点拍摄了照片，则返回 TRUE\nfunction photoTakenHere(ph3, b5)\n```\n\n# Javascript\
    \ 03b：创建一个模型环境\n\n对于下面的程序，请选择你喜欢的 IDE。你也可以使用在线 IDE，如 `rextester.com`、`ideone.com`\
    \ 或 `codpad.org`。\n\n现在让我们练习为我们的 AI 创建用于检查的环境。这些在之后将整合在一起，因为 AI 代理将有机会根据其给定的知识和能力来探索它的环境。\n\
    \n## 建模房屋\n\n建模环境最简单的方法是前面提到的“红绿灯”原则。\n\n如果你用简单的枚举类型数据集合来建模房屋，你可能会得到类似下面的内容：\n\
    \n```javascriptvar myHouse = [\"livingRoom\", \"diningRoom\", \"den\", \"bathroom1\"\
    , \"bathroom2\", \"hallway\", \"bedroom1\", \"bedroom2\", \"patio\"]\n```\n\n\
    你也可以使用面向对象编程来建模房屋。你可以将房屋中的每个房间表示为 `Room` 对象。\n\n```javascript\n// Room 具有：\n//\
    \ - 一个名称\n// - 相邻的连接房间\nfunction Room(name) {\n  this.name = name\n  this.connected\
    \ = []\n  this.addRoom = function(room) {\n    this.connected.push(room)\n  }\n\
    }\n```\n\n为了现在保持简单，你可以模拟位于繁华市中心的一个简单公寓。\n\n```javascript\n// 在城市中心的一个简单公寓创建 5\
    \ 个房间\nvar kitchen = new Room(\"kitchen\")\nvar livRM = new Room(\"livingRoom\"\
    )\nvar dineRM = new Room(\"diningRoom\")\nvar bd = new Room(\"bedroom\")\nvar\
    \ wr = new Room(\"washroom\")\n\n/*\n// 如下连接所有房间：\n// <-> 浴室 <-> 卧室 <-> 客厅 <->\
    \ 厨房 <-> 餐厅 <->\n*/\n\nkitchen.connected.push(livRM, dineRM)\nlivRM.connected.push(bd,\
    \ kitchen)\nbd.connected.push(wr, livRM)\nwr.connected.push(dineRM, bd)\ndineRM.connected.push(kitchen,\
    \ wr)\n```\n\n由你决定。\n\n请记住，你最终将设计与你的模型环境相对应的 AI 代理。\n\n## 轮到\n\n使用 Javascript（或你喜欢的任何编程语言），根据上面的建模指导说明为你的房屋创建一个代码模型。首先，使用“红绿灯法”，为你房屋中的房间创建一个简单的枚举或数组。\n\
    \n然后，使用面向对象编程对你的房屋建模，用 `Room` 实例表示每个房间。然后，相应地连接每个房间。\n"
- fmt: "\nThere are two solutions to this: your AI agent either has all its knowledge\
    \ given by default; or it will scout/observe/learn its environment and gain information\
    \ this way. Also, you can choose a combination of both.\n\nFor now, we focus on\
    \ Default Knowledge and abilities.\n\n## AI Knowledge by Default\n\nYour AI agent\
    \ can receive, by default, a fixed set of all information it will ever need. If\
    \ you believe some part of your AI agent’s information won’t change, you may model\
    \ your AI agent’s information this way.\n\nFor example, your AI agent may be a\
    \ self-driving vehicle. The rules of the road will stay consistent in the long\
    \ term. Also, its driving patterns and techniques will stay consistent too. The\
    \ road maps will also stay consistent.\n\nTherefore, your self-driving vehicle\
    \ can navigate its way through a city and make its way from two points.\n\n##\
    \ AI Knowledge by Learning\n\nYour AI agent can learn and acquire information\
