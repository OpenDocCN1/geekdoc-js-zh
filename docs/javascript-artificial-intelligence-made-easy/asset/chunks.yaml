    # Javascript 05b: Using Frontier Search


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    Here, we implement the Frontier Search Algorithm step-by-step onto a simple node
    network:￼![M-AI simpleNetwork.png](images/00002.jpeg)


    Each circle a, b, c, and d each represent interconnected nodes, which will only
    have their respective letters as contents.


    We ask the algorithm if there is a path to a particular letter from a starting
    point.


    The Search Algorithm would have a letter as an input. It would then check the
    nodes row-by-row until it either finds a suitable path from the input node to
    that letter - or notify you that a path couldn’t be found.


    So we now know what to expect. If we have, say ,’d’ as the input, the algorithm
    is supposed to find it, and output the node path a->c->d. If we have ‘g’ or some
    other irrelevant letter as an input, the algorithm will say that it’s not found.


    Artificial Intelligence will heavily rely on Search Algorithms to come up with
    solutions and best decisions for its given situations. We will explore more about
    this later on.


    Meanwhile, let’s start building our algorithm.


    Step 1: Understand & Create the Node Structure


    First, we have to build the underlying data structure for our Network. Our Nodes
    contain the data type we want to use, as well as a list of its connected nodes.
    Since we’re only using letters, our Node data type can be String.


    Copy the class code below to your IDE. We’ll build on from here.


    // A Node has:


    // - Some Contents (Data type of your choice)


    // - A List of other connected Nodes


    // It can:


    // - Search all its descendant nodes to find a solution


    // (Our Search Algorithm as a Class Method)


    function Node(c) {


    this.contents = c


    this.children = []


    }


    Afterwards, we need￼![M-AI simpleNetwork-1.png](images/00003.jpeg) the node network.


    So it looks like ‘d’ is a connected to ‘c’, while ‘b’ and ‘c’ are connected to
    ‘a’. We’ll be re-creating this network in code.


    Copy the code below and place it at the very bottom of your code:


    // Creates & connects nodes a, b, c, d


    var a = new Node("a");


    var b = new Node("b");


    var c = new Node("c");


    var d = new Node("d");


    a.children.push(b);


    a.children.push(c);


    c.children.push(d);


    Next, we need to design the Path.


    Step 2: Create the Path Structure


    The Path will contain an ordered list of Nodes. Each node will be connected to
    the ones next to it, while the first node in the Path is the Start node.


    Copy the class code below to your IDE, just before where you put the Node class.


    // A Path has:


    // - A List of Nodes


    // (can be modified to include more Methods/Fields)


    function Path() {


    this.contents = []


