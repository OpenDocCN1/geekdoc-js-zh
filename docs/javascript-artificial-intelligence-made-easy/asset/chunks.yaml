  trans: "\n\n# 第 6.4 节：启发式搜索\n\n确定如何获取最佳路径的另一种方法是在弧上添加启发式（heuristics）。启发式值可以代表两个含义：\n\
    \n- 对到达解决方案总成本的极低估算\n- 一个需要最大化的值：解决方案应该具有尽可能的值\n\n在第一种情况下，你可以估计从起点到达最近目标节点的总成本。只要成本没有被高估，它就是可采的（admissible）。\n\
    \n在第二种情况下，它将与 LCFS（最后入先出）相反——每个从节点到子节点的弧都将有一个值，算法将找到一个值尽可能高的解决方案。\n\n### 它的工作原理：\n\
    \n节点与子节点之间的连接被称为弧（arcs）。它们可以包含算法生成可行、合法解决方案至关重要的信息。对于基于成本的搜索算法，弧需要具备节点与子节点之间的成本。\n\
    \n`[Node A] - - - -> arc A-B: cost=10 - - - ->[Node b]` 示例：启发式搜索算法\n\n下面的树与 LCFS\
    \ 中的树是同一个，但现在为 `![M-AI-LCFSTree (4).png](img/00010.jpeg)` 弧添加了值。\n\n启发式搜索算法将根据最接近估计值的成本或最大值来选择其节点。首先，它将节点\
    \ `b`、`c` 和 `d` 添加到沿（frontier）。\n\n例如，如果我们估计到达 `Node g` 的成本为 `7`，算法将首先处理 `Node\
    \ c`，因为它的成本是 `7`。因此，节点 `g`、`h` 和 `i` 被添加到沿中，各自的总成本分别为 `g` 的 `11` (`4+7`)、`h` 的\
    \ `13` (`6+7`) 和 `i` 的 `10` (`7+3`)。接着将处理 `Node b`，因为它的成本（`5`）目前最接近 `7`。然后添加它的子节点\
    \ `e` (`11 = 6+5`) 和 `f` (`8=5+3`)。随后处理 `Node f`，沿沿加入了第二个 `Node g`，成本为 `(9=1+3+5)`。最近添加的\
    \ `Node g` 成本最接近 `7`，因此对其进行处理。这是一个可行的最优解，因为其他 `g-nodes` 的成本分别为 `11` 和 `15`。\n\n\
    另一方面，我们也可以让算法选择一个创建最高值的解决方案。如果我们想选择值最高的通 `Node g` 的路径，发生的情况如下：首先处理 `Node c`，因为它的值（`4`）。这添加了节点\
    \ `g`、`h` 和 `i`，其值分别为 `12`、`13` 和 `10`。接下来将处理 `Node h`，但没有子节点可以添加到沿中。一旦 `Node\
    \ g` 被处理后，`i` 将成为一个可行的解决方案，值为 `12`。\n\n### 算法分析：启发式搜索\n\n#### 它是完备的吗？\n不是，因为算法在两个高值节点或两个最接近估计值的节点之间循环时，可能会陷入无限循环。\n\
    \n#### 它是最优的吗？\n遗憾不是，但这是因为基于值或基于成本的算法有时会是“贪婪”的。这意味着算法只会倾向于它目前拥有的最佳节点，而忽略所有其他选项。如果更深节点具有更高的值，但算法因为处理其他节点而无法到达它们，那么算法可能会产生次优的解决方案。\n\
    \n#### 它的时间与空间复杂度是多少？\n`O(b^m)`\n\n在最坏情况下，启发式搜索将探索树中的每个节点，并将每个节点存储在内存中。\n\n# 学习\
    \ JAVASCRIPT 的最方法，第 1 部分\n\n我们包含了一份学习编程基础知识的补充指南，帮助你成为一名更优秀的程序员。\n\n为了让你更轻松地理解，我们将其设置得尽可能简单。\n\
    \n为了方便运行代码，请选择你选择的 IDE（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n## 1) 基础数据类型。\n\n### 布尔值（Booleans）：\n\
    这些本质上是开关闭开关值。在代码中，布尔值将是 `TRUE` 或 `FALSE`。\n\n在 Javascript 中，布尔值只能小写（即 `true`、`false`）。布尔值中不能包含任何大写字母（即\
    \ `TRUE`、`True`）。\n\n示例：\n`true`, `false`\n\n### 字符串（Strings）：\n这些是键盘字符的集合——包括字母、数字和其他符号——按某种顺序排列形成一个文本短语。它们以双引号开头和结尾。\n\
    \n示例：\n`\" This is a String. \"`\n`\" This 15 4 &^%$! 5tring t00\\.\" `\n\n###\
    \ 数字（Numbers）：\nJavascript 对所有数字一视为仁。它们都是 64 位浮点数（如果你不知道这意味着什么，可以查一下）。\n\n但通常来说，编程中主要有两种类型的数字：整数（整数）和浮点数（小数）。\n\
    \n#### 整数（Integers）：\n它们定义为没有分数或小数的整数。例如：\n`12`\n`143`\n`199932`\n\n#### 浮点数（Floats）：\n\
    也称为小数，它们是整数的相反。\n\n## 2) 变量（Variables）\n在编程中，变量是用于存储数据的名称。记得在学校里你使用字母如 `X` 和 `Y`\
    \ 来表示数字吗？在 Javascript 中也存在变量。\n\n你可以使用以下语法创建变量：\n`var (VariableName) = (Initial\
    \ Value)`\n\n或者，替代：\n`(VariableName) = (Initial Value)`\n\n示例：\n`var a = \" This\
    \ is a String. \"`\n`var b = 12`\n`var c = true`\n`var d = 0.123`\n\n## 3) 函数（Functions）\n\
    如果变量是句子，函数仅仅是动词。本质上是指令集。一旦代码调用它们，计算机就会执行。\n\n### 3a) 创建函数\n在 Javascript 中创建函数，遵循此语法：\n\
    \n```javascript\nfunction funcName(input1, input2, etc...) {\n    // 在此处编写代码\n\
    \    // 如果函数输出任何数据，使用下一行：\n    return data\n}\n```\n\n### 3b) 使用函数\n调用函数，只需编写其名称以及任何输入（如果需要）。但通常有两个地方可以放置函数。\n\
    \n单独占一行：\n`funcName(any required inputs)`\n\n或者在预期其输出数据类型的地方：\n`var variableName\
    \ = funcName(any required inputs)`\n\n示例：\n`funcABC(a, b, c)`（无输出）\n`var integer1\
    \ = funcABC(a, b, c)`\n\n## 4) 复合数据（Composite Data）\n这个概念意味着一组独立的、较小的数据组合成一个完整的、单一的数据块。用简单的话来说，如果变量是句子，复合数据就是由句子组成的整个段落。\n\
    \n在 Javascript 中，可以使用变量创建简单的复合数据。你可以使用以下语法创建它们：\n\n```javascript\nvar CompositeName\
    \ = {\n    part1name: value1,\n    part2name: value2,\n    part3name: value3,\n\
    };\n```\n\n这些被称为关联数组。我们稍后会介绍数组。\n\n示例：\n```javascript\nvar c = {\n    c1: \"String\
    \ Sample\",\n    c2: 234,\n    c3: true\n}\n```\n\n"
- fmt: "\n# EASIEST WAY TO LEARN JAVASCRIPT, Part 2\n\nTo easily run code, select\
    \ an `IDE` (Integrated Development Environment: essentially somewhere that you\
    \ write and run code) of your choice. You may also use online `IDE`s such as [rextester.com](http://rextester.com),\
    \ [ideone.com](http://ideone.com), or [codpad.org](http://codepad.org).\n\n##\
    \ Part 5a: Arrays in Javascript\n\nArrays are a sequenced list of a certain data\
    \ type. Those data types can be simple or compound.\n\nTo set up an array, follow\
    \ this syntax:\n\n```javascript\nvar (variable name) = []\n```\n\nOr:\n\n```javascript\n\
    (variable name) = []\n```\n\nYou can also access individual items based on that\
    \ item’s position within the array. `0` is the first item; the array size minus\
    \ one is the last item. (In programming, the very 1st number is often `0`. Remember\
    \ this!)\n\nFor example, you would get the first item of an array like so:\n\n\
    ```javascript\nsomeArray[0]\n```\n\nAnd you would get the last item of an array\
    \ like so:\n\n```javascript\n// an Array with room for 10 items:\nsomeArray[9]\n\
    ```\n\n## Part 5b: Iteration\n\nTo process each item in an array, use these lines:\n\
    \n```javascript\nfor (var x in <arrayName>) {\n  // every time you mention ‘x’\
    \ in this code,\n  // it will be applied to every item within the array\n}\n```\n\
    \nFor example, this would print out 1 to 5:\n\n```javascript\nvar a = [1,2,3,4,5]\n\
    for (var x in a) {\n  print(a[x])\n}\n```\n\nAlternatively, you can also iterate\
    \ them the traditional way. Many other programming languages:\n\n```javascript\n\
    for (var x=0; x < arrayName.length;x++) {\n  // every time you mention ‘x’ in\
    \ this code,\n  // it will be applied to every item within the array\n}\n```\n\
    \nAgain, this would print out 1 to 5:\n\n```javascript\nvar a = [1,2,3,4,5]\n\
    for (var x=0; x < a.length;x++) {\n  print(a[x])\n}\n```\n\n## Part 6: Logic &\
    \ Operators\n\nThere are three Basic Logic Operators: AND, OR. and NOT.\n\nAND\
    \ and OR are used to compare two or more statements that are either True or False.\
    \ They are used in the form of `(x AND y)` or `(x OR y)`.\n\nAND is true if all\
    \ items between it is true. OR is true if either one of its items is true.\n\n\
    NOT returns the opposite of a single statement it’s set to; so ‘NOT true’ would\
    \ be false and ‘NOT False’ would be true.\n\nIn Javascript, here are how the operators\
    \ are:\n\n- AND operator: `&&`\n- OR operator: `||`\n- NOT operator: `!<boolean>`\n\
    \nExamples:\n\n```javascript\n// print false:\nprint(true && false)\n\n// print\
    \ true:\nprint(true || false)\n\n// print false:\nprint(!true)\n```\n\n## Part\
    \ 7: IF-ELSE Statements\n\nThe concept is simple: There’s a boolean statement\
    \ to check. If it’s true, do the procedure after the IF line. If it’s false, do\
    \ the procedure after the ELSE line.\n\n```javascript\nif (<insert something that\
    \ would output a boolean>) {\n  // code that happens if true\n} else {\n  // code\
    \ that happens if false\n}\n```\n\nNote that the conditional procedures are in\
    \ between curly brackets `{ }`. an IF statement also doesn’t need an ELSE statement;\
    \ it can be by itself:\n\n```javascript\nif (<insert something that would output\
    \ a boolean>) {\n  // code that happens if true\n}\n```\n\nExamples:\n\n```javascript\n\
    // IF-ELSE together:\nif (age > 20) {\n  drinkingAge = true\n} else {\n  drinkingAge\
    \ = false\n}\n\n// IF-statement alone:\nif (happy() and knowIt()) {\n  hands.clap()\n\
    }\n```\n\n# EASST WAY TO LEARN OBJECT-ORIENTED\n\nTo easily run code, select an\
    \ `IDE` (Integrated Development Environment: essentially somewhere that you write\
    \ and run code) of your choice. You may also use online `IDE`s such as [rextester.com](http://rextester.com),\
    \ [ideone.com](http://ideone.com), or [codpad.org](http://codpad.org).\n\n## a)\
    \ Object Oriented Programming\n\nIn the world of programming, you will hear this\
    \ term very often. This is because Object-Oriented Programming (OOP for short)\
    \ is one of the most widely used styles there. In other programming languages,\
    \ `Classes`, a form of composite data, are used to group smaller data into a larger\
    \ whole. The main point of Object-Oriented Programming is: in object-oriented\
    \ programming, you create ‘copies’ of those classes. In simpler terms, a `Class`\
    \ is a data structure that acts as “blueprints”. Those “created copies” you’ve\
    \ made are called `Objects`. Why? Because as you learn more and more about programming,\
    \ you will encounter the notion of Abstraction - applying a general idea across\
    \ multiple scenarios ultimately saving time and effort while greatly reducing\
    \ confusion and frustration. Coding the same data over over would lead to effort\
    \ whereas re-using the same idea leads to consistency.\n\n## b) Classes & Constructors\n\
    \nConstructors are special class methods. Based on the classes they belong to,\
    \ they create `Objects` for you. In Javascript, functions are used as a combined\
    \ class and constructor. When defining a class, you define its constructor function\
    \ at the same time. To define a class as well as its constructor in Javascript,\
    \ use the following syntax:\n\n```javascript\nvar ClassName = function(<any inputs>)\
    \ {\n  // insert methods, fields, and other code here\n}\n```\n\nAlso, the constructor\
    \ is simply your class name as a function. To create a data object based on a\
    \ certain class, follow this syntax:\n\n```javascript\nvar <variable name> = new\
    \ Classname()\n```\n\nExample:\n\n```javascript\nvar House = function() {\n  //\
    \ insert code here\n}\nvar h = new House()\nvar MyHouse = h\n```\n\nTo call a\
    \ class object, simply refer to it:\n\n```javascript\nlet h\n```\n\n## 3) OOP\
    \ Terminology\n\nVariables and Functions take on new roles in OOP. They can be\
    \ called `Fields` and `Methods`, respectively. They can also be called Member\
    \ functions or Member Variables. In some cases, it’s really up to you to use which\
    \ names you want, as long as you understand what programmers mean when they use\
    \ these terms.\n\n`Fields` represent variables in OOP because, just like fields\
    \ in any entry form, data objects can have fields as many different values as\
    \ you can think of. Think of fields as a certain attribute for an object. Each\
    \ object might have different attributes from each other:\n\n```javascript\nvar\
    \ Cat = function() {\n  var color = \"green\"\n}\n// these cats are objects based\
    \ on Cat class:\ncatA.color = \"white\"\ncatB.color = \"grey\"\ncatC.color = \"\
    orange\"\n```\n\n`Methods` represent the functions that Objects have. Think of\
    \ Methods as ‘actions’ and behaviours that objects do. To create a class-Method\
    \ for a particular `Class`, follow this syntax:\n\n```javascript\n<Class Name>.prototype.<Method\
    \ Name> = function() {\n  // some code\n}\n```\n\nExample:\n\n```javascript\n\
    Cat.prototype.meow = function() {\n  // some code\n}\n```\n\nMoving onwards, in\
    \ OOP you need to access the method from an object itself. For example, if we\
    \ create a few `Cat` objects based on some `Cat Class`, each object would have\
    \ all the methods defined on the `Cat Class`:\n\n```javascript\nclass Cat{\n \
    \ // some code\n}\nCat.prototype.meow = function() {\n  // some code\n}\n// these\
    \ cats are objects based on Cat class:\ncatA.meow()\ncatB.meow()\ncatC.meow()\n\
    ```\n\nLastly, remember that Methods are still functions at heart. You still place\
    \ them in code where you expect a function output’s data type to be.\n\nExample:\n\
    \n```javascript\n// Outputs a String\nFox.prototype.say = function() {\n  return\
    \ \"ringdingdingding\"\n}\nvar whatDoesTheFoxSay = someFox.say()\nprint(whatDoesTheFoxSay)\n\
    ```\n\n# Archive Javascript-A1a: Solving Schedule Problems\n\nAI to Solve Scheduling\
    \ Problems using Generate-and-test Algorithm. Copy and paste the code below to\
    \ an IDE of your choice:\n\n```javascript\n/*\n// Archive Javascript-A1\n// Artificial\
    \ Intelligence for solving Schedule Problems\n//\n// There's Four people: Anna,\
    \ Betty, Cara, & Donna\n// 1st Goal: Find out what times everyone is available\
    \ to meet together for Coffee\n//\n// Constraint 1: Anna has classes 11am - 1:50pm\n\
    // Constraint 2: Betty has classes noon - 3:50pm\n// Constraint 3: Cara has work\
