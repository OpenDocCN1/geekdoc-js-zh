    \ For your AI agent to be able to create solutions, it needs to know about its\
    \ environment and surroundings.\n\nSo to model the AI agent’s environment, there\
    \ are two main ways to do so.\n\nFirst, you can either use the “Traffic Light”\
    \ principle - have enumerations of the possible states or conditions of the AI\
    \ agent’s focus. This is a very simple representation of an environment.\n\nFor\
    \ example, an AI agent can monitor the traffic lights in your closest intersection\
    \ and determine which colour the light will be (either `Red`, `Yellow`, or `Green`).\n\
    \nUse this for making very simple interpretations of whatever the AI agent focuses\
    \ on.\n\n```javascriptvar trafficLights = [\"Red\", \"Yellow\", \"Green\"]\n```\n\
    \nSecond, you can describe the environment features into detailed data representations.\
    \ With Object-Oriented Programming, you can simply create class objects about\
    \ your AI’s environment observations - including the many little details as class\
    \ fields. Use this for more natural, detailed environment observations.\n\n```javascript\n\
    function BeachVisit (loc, tide, crowd, temp) {\n  this.location = loc\n  this.tide\
    \ = tide\n  this.crowdSize = crowd\n  this.temperature = temp\n}\n\nvar b1 = new\
    \ BeachVisit(\"Santa Monica Beach\", \"high\", \"large\", \"81f\")\nvar b2 = new\
    \ BeachVisit(\"Santa Monica Beach\", \"medium\", \"medium\", \"78f\")\n```\n\n\
    ### Environment Models using Data Combinations\n\nIf you choose your AI agent\
    \ to describe environments via Object-Oriented Programming, you can also link\
    \ two objects from different classes. You create a relationship between them,\
    \ taking note of how they are linked together.\n\nFor example, we can take our\
    \ beach visit objects and link them together with photos:\n\n```javascript\n//\
    \ (assume instances b1 - b25 have been created)\n// all beach visits into an array:\n\
    var allBeachVisits = [b1, b2, b3, b4, b5]\n// (assume instances ph1 - ph7 have\
    \ been created)\n// all photos into an array:\nvar allPhotos = [ph1, ph2, ph3,\
    \ ph4, ph5, ph6, ph7]\n\n// Possible Relation Propositions:\n// #1: PhotosTaken\n\
    // proposition: return TRUE if photo has been taken during Beach Visit\nfunction\
    \ photoTakenAtVisit(ph1, b3)\n// #2: PhotosTaken\n// proposition: return TRUE\
    \ if photo has been taken at Beach Visit location\nfunction photoTakenHere(ph3,\
    \ b5)\n```\n\n# Javascript 03b: Creating a Model Environment\n\nFor the procedure\
    \ below, select an IDE of your choice. You may also use online IDE’s such as `rextester.com`,\
    \ `ideone.com`, or `codpad.org`.\n\nNow let’s practice creating environments for\
    \ our AI to examine. This will all come together later on, as an AI agent will\
    \ have a chance to explore its environment with its given knowledge and abilities.\n\
    \n## Modelling A House\n\nThe most simple way you can model an environment is\
    \ the Traffic Light principle mentioned earlier.\n\nIf you model your house in\
    \ a simple enumeration-type data collection, you might have something similar\
    \ below:\n\n```javascriptvar myHouse = [\"livingRoom\", \"diningRoom\", \"den\"\
    , \"bathroom1\", \"bathroom2\", \"hallway\", \"bedroom1\", \"bedroom2\", \"patio\"\
    ]\n```\n\nYou may also model your house using Object-Oriented Programming. You\
    \ can represent every room in the house as a `Room` object.\n\n```javascript\n\
    // A Room has:\n// - a name\n// - adjacent, connected rooms\nfunction Room(name)\
    \ {\n  this.name = name\n  this.connected = []\n  this.addRoom = function(room)\
    \ {\n    this.connected.push(room)\n  }\n}\n```\n\nTo keep things very simple\
    \ for now, you can model a simple condo in the heart of a thriving downtown core.\n\
    \n```javascript\n// Create 5 rooms in a simple condo in the City\nvar kitchen\
    \ = new Room(\"kitchen\")\nvar livRM = new Room(\"livingRoom\")\nvar dineRM =\
    \ new Room(\"diningRoom\")\nvar bd = new Room(\"bedroom\")\nvar wr = new Room(\"\
    washroom\")\n\n/*\n// Connect all rooms as so:\n// <-> Washroom <-> Bedroom <->\
    \ livingRoom <-> Kitchen <-> DiningRoom <->\n*/\n\nkitchen.connected.push(livRM,\
    \ dineRM)\nlivRM.connected.push(bd, kitchen)\nbd.connected.push(wr, livRM)\nwr.connected.push(dineRM,\
    \ bd)\ndineRM.connected.push(kitchen, wr)\n```\n\nWhichever way you would like\
    \ to model your environment is up to you.\n\nJust keep in mind that you will eventually\
