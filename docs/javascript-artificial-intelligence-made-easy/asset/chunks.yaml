    )\n} else {\n  print(\"浴室水龙头没有热水.\")\n}\n// 浴室冷龙头 <- C\nif (tapC) {\n  print(\"\
    水龙头 C 已开启. \")\n  print(\"冷水可以流过浴室水龙头.\")\n} else {\n  print(\"浴室水龙头没有冷水.\")\n\
    }\nreturn\n}\n\nif (mode == 3) {\n// 浴缸热水龙头 <- F\nif (tapF) {\n  print(\"水龙头 F\
    \ 已开启.\")\n  print(\"热水可以流过浴缸龙头.\")\n} else {\n  print(\"浴缸龙头没有热水.\")\n}\n// 浴缸冷龙头\
