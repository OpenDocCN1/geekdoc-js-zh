- fmt: "\n# Chapter 6.4: Heuristic Search\n\nAnother way to determine how to get the\
    \ best path is to add heuristics to the arcs. The heuristic values can represent\
    \ two things:\n\n- A very low estimate of the total cost to reach a solution\n\
    - A value to maximize: the solution should have the highest value possible\n\n\
    In the first case, you can estimate the total cost to reach the nearest goal node\
    \ from the start. It will be admissible as long as the cost isn’t overestimated.\n\
    \nIn the second case, it will be the opposite of LCFS - each node-to-subnode arc\
    \ will then have a value and the algorithm will find a solution with the highest\
    \ value possible.\n\n### How it works:\n\nThe link between nodes and subnodes\
    \ are called arcs. They can contain information vital for the algorithm to produce\
    \ a viable, legal solution. For cost-based search algorithms, arcs will need costs\
    \ between a node and a subnode.\n\n`[Node A] - - - -> arc A-B: cost=10 - - - ->[Node\
    \ b]` Example: Heuristic Search Algorithm\n\nThe tree below is the same one from\
    \ LCFS, but now with added values to the `![M-AI-LCFSTree (4).png](images/00010.jpeg)`\
    \ arcs.\n\nThe Heuristic search algorithm will choose its nodes based on either\
    \ the closest cost to the estimate or a maximum value. First, it adds Nodes `b`,\
    \ `c`, and `d` to the frontier.\n\nIf, say, we estimate that the cost to get to\
    \ `Node g` is `7`, the algorithm will process `Node c` first because its cost\
    \ is `7`. So Nodes `g`, `h`, and `i` are added to the frontier, each with respective\
    \ total costs `11` for `g` (`4+7`), `13` for `h` (`6+7`) and `10` for `i` (`7+3`).\
    \ So `Node b` will then be processed next, because its cost (`5`) is currently\
    \ closest to `7`. Then its subnodes `e` (`11 = 6+5`) and `f` (`8=5+3`) are added.\
    \ `Node f` is then processed, so a second `Node g` is added to the frontier, with\
    \ a cost of `(9=1+3+5)`. The recently added `Node g` has the closes cost to `7`,\
    \ so it’s then processed. It is a viable optimal solution, since the other `g-nodes`\
    \ have costs of `11` and `15` respectively.\n\nOn the other hand, we can also\
    \ have the algorithm pick a solution that creates the highest value. If we want\
    \ to pick the path to `Node g` with the highest value, here’s what happens. `Node\
    \ c` is processed first, because of its value (`4`). This adds Nodes `g`, `h`,\
    \ and `i` with values `12`, `13` and `10`, respectively. `Node h` will then be\
    \ processed next, but with no subnodes to add to the frontier. And once `Node\
    \ g` is processed, `i` would be a viable solution, at a value of `12`.\n\n###\
    \ Algorithm Analysis: Heuristic Search\n\n#### Is it Complete?\nNo, because there\
    \ is a chance that the algorithm will be in an infinite loop once it cycles between\
    \ two high-value nodes or two nodes closest to the estimate.\n\n#### Is it Optimal?\n\
    Unfortunately no, but this is because the value-based or cost-based algorithms\
    \ can be “greedy” at times. Meaning, the algorithm will only prefer the best possible\
    \ node it has at the moment, but ignoring all other options. If deeper nodes have\
    \ higher values, but the algorithm can’t get to them because it processes other\
    \ nodes instead, then the algorithm might produce less optimal solutions instead.\n\
    \n#### What is its Time & Space Complexity?\n`O(b^m)`\n\nAt the worst case, a\
    \ heuristic search will explore every node in a tree and have each node stored\
    \ in memory.\n\n# EASIEST WAY TO LEARN JAVASCRIPT, Part 1\n\nWe’ve included a\
    \ complementary guide to learning programming essentials and to help you become\
    \ a better programmer.\n\nAs a way to help you understand it much more easily,\
    \ we’ve set it up as simple as possible.\n\nTo easily run code, select an IDE\
    \ (Integrated Development Environment: essentially somewhere that you write and\
    \ run code) of your choice. You may also use online IDE’s such as [rextester.com](http://rextester.com),\
    \ [ideone.com](http://ideone.com), or [codepad.org](http://codepad.org).\n\n##\
    \ 1) The Basic Data Types.\n\n### Booleans:\nThese are essentially on-off switch\
    \ values. In code, boolean values are going to be either `TRUE` or `FALSE`.\n\n\
    In Javascript, booleans can only be in lower-case (i.e. `true`, `false`). Booleans\
    \ cannot have any upper-case letters in them (i.e. `TRUE`, `True`).\n\nExamples:\n\
    `true`, `false`\n\n### Strings:\nThese are sets of keyboard characters - including\
    \ letters, numbers, and other symbols - arranged in some order to make a text\
    \ phrase. They start and end with double quotation marks.\n\nExamples:\n`\" This\
    \ is a String. \"`\n`\" This 15 4 &^%$! 5tring t00\\.\" `\n\n### Numbers:\nJavascript\
    \ treats all numbers the same. They’re all 64-bit floating points (you can look\
    \ it up if you don’t know what it means).\n\nBut in general, there are two main\
    \ types of numbers in programming: Integers (whole numbers) and Floats (decimal-point\
    \ numbers).\n\n#### Integers:\nThey’re exactly as they’re defined - whole numbers\
    \ without any fractions or decimals. Here are some examples:\n`12`\n`143`\n`19999932`\n\
    \n#### Floats:\nalso called floating-point numbers, they represent the opposite\
    \ of Integers.\n\n## 2) Variables\nIn programming, variables are names used to\
    \ store data. Remember in grade school you used letters such as `X` and `Y` to\
    \ represent numbers? In Javascript, variables exist too. \n\nYou can create variables\
    \ in the following syntax:\n`var (VariableName) = (Initial Value)`\n\nOr, alternatively:\n\
    `(VariableName) = (Initial Value)`\n\nExamples:\n`var a = \" This is a String.\
    \ \"`\n`var b = 12`\n`var c = true`\n`var d = 0.123`\n\n## 3) Functions\nIf Variables\
    \ are sentences, Functions are merely verbs. In essence, functions are outlined\
    \ set of instructions. They are carried out by the computer once a line of code\
    \ calls them.\n\n### 3a) Making Functions\nTo create a function in Javascript,\
    \ follow this syntax:\n\n```javascript\nfunction funcName(input1, input2, etc...)\
    \ {\n    // write code here\n    // use the next line if the function outputs\
    \ any data:\n    return data\n}\n```\n\n### 3b) Using Functions\nTo call a function,\
    \ you just write its name, along with any inputs (if necessary). However, there\
    \ are generally two places where you place a function.\n\nOn a line of its own:\n\
    `funcName(any required inputs)`\n\nOr wherever its output data type is expected:\n\
    `var variableName = funcName(any required inputs)`\n\nExamples:\n`funcABC(a, b,\
    \ c)` (No Output)\n`var integer1 = funcABC(a, b, c)`\n\n## 4) Composite Data\n\
    This concept means that a set of individual, lesser data are comprised together\
    \ to form a whole, singular chunk of data. Put in the simplest way possible, if\
    \ Variables are sentences, Composite Data are entire paragraphs that can be made\
    \ of sentences.\n\nIn Javascript, variables can be used to create simple composite\
    \ data. You can create them in the following syntax:\n\n```javascript\nvar CompositeName\
    \ = {\n    part1name: value1,\n    part2name: value2,\n    part3name: value3,\n\
    };\n```\n\nThese are called associative arrays. We’ll get to arrays later on.\n\
    \nExample:\n```javascript\nvar c = {\n    c1: \"String Sample\",\n    c2: 234,\n\
    \    c3: true\n}\n```\n"
