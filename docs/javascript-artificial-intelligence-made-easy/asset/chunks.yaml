  trans: "\n\n# 学习 JAVASCRIPT 的简单方法，第 2 部分\n\n为了方便运行代码，请选择你喜欢的 `IDE`（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线\
    \ `IDE`，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n## 第 5a 部分：Javascript 中的数组\n\n数组是特定数据类型的顺序列表。这些数据类型可以是简单的，也可以是复合的。\n\
    \n要设置数组，请遵循以下语法：\n\n```javascript\nvar (variable name) = []\n```\n\n或者：\n\n```javascript\n\
    (variable name) = []\n```\n\n你还可以根据项目在数组中的位置来访问单个项目。`0` 是第一个项目；数组大小减 1 是最后一个项目。（在编程中，极个数字通常是\
    \ `0`。记住这一点！）\n\n例如，你可以这样获取数组的第一个项目：\n\n```javascript\nsomeArray[0]\n```\n\n你可以像这样获取数组的最后一个项目：\n\
    \n```javascript\n// 一个可以容纳 10 个项目的数组：\nsomeArray[9]\n```\n\n## 第 5b 部分：迭代\n\n\
    要处理数组中的每个项目，请使用这些行：\n\n```javascript\nfor (var x in <arrayName>) {\n  // 每当在这段代码中提到‘x’时，\n\
    \  // 它将应用到数组中的每一个项目\n}\n```\n\n例如，这将打印出 1 到 5：\n\n```javascript\nvar a = [1,2,3,4,5]\n\
    for (var x in a) {\n  print(a[x])\n}\n```\n\n或者，你也可以用传统方式迭代它们。许多其他编程语言中：\n\n```javascript\n\
    for (var x=0; x < arrayName.length;x++) {\n  // 每当在这段代码中提到‘x’时，\n  // 它将应用到数组中的每一个项目\n\
    }\n```\n\n再次，这将会打印 1 到 5：\n\n```javascript\nvar a = [1,2,3,4,5]\nfor (var x=0;\
    \ x < a.length;x++) {\n  print(a[x])\n}\n```\n\n## 第 6 部分：逻辑与运算符\n\n有三种基础逻辑运算符：AND（与）、OR（或）和\
    \ NOT（非）。\n\nAND 和 OR 用于比较两个或多个为真或假的陈句。它们以 `(x AND y)` 或 `(x OR y)` 的形式使用。\n\n\
    如果其之间的所有项目都为真，则 AND 为真。如果其中的任意一个项目为真，则 OR 为真。\n\nNOT 返回其设置的单个陈句的相反值；因此‘NOT true’为假，而‘NOT\
    \ False’为真。\n\n在 Javascript 中，这些运算符的形式如下：\n\n- AND 运算符：`&&`\n- OR 运算符：`||`\n-\
    \ NOT 运算符：`!<boolean>`\n\n示例：\n\n```javascript\n// 打印 false:\nprint(true && false)\n\
    \n// 打印 true:\nprint(true || false)\n\n// 打印 false:\nprint(!true)\n```\n\n## 第\
    \ 7 部分：IF-ELSE 语句\n\n这个概念非常简单：有一个布尔陈句需要检查。如果它为真，执行 IF 行之后的程序。如果为假，执行 ELSE 行之后的程序。\n\
    \n```javascript\nif (<插入可以输出布尔值的内容>) {\n  // 如果为真执行的代码\n} else {\n  // 如果为假执行的代码\n\
    }\n```\n\n注意，条件程序位于大括号 `{ }` 之间。一个 IF 语句也不需要 ELSE 语句；它可以独立存在：\n\n```javascript\n\
    if (<插入可以输出布尔值的内容>) {\n  // 如果为真执行的代码\n}\n```\n\n示例：\n\n```javascript\n// IF-ELSE\
    \ 结合使用：\nif (age > 20) {\n  drinkingAge = true\n} else {\n  drinkingAge = false\n\
    }\n\n// 独的 IF 语句：\nif (happy() and knowIt()) {\n  hands.clap()\n}\n```\n\n# 学习面向对象的简单方法\n\
    \n为了方便运行代码，请选择你喜欢的 `IDE`（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 `IDE`，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n## a) 面向对象编程\n\n在编程世界中，你会经常听到这个术语。这是因为面向对象编程（简称\
    \ OOP）是那里最广泛使用的风格之一。在其他编程语言中，`Classes`（类）作为复合数据的形式，用于将较小的数据组合成一个更大的整体。面向对象编程的核心点是：在面向对象编程中，你创建了这些类的“副本”。简单来说，`Class`（类）是一个充当“蓝图”的数据结构。你创建的那些“副本”被称为\
    \ `Objects`（对象）。为什么呢？随着你对编程的了解越来越多，你将遇到“抽象”的概念——将一个通用的思想应用于多个场景，最终节省时间和精力，同时极大地减少了困惑和挫败感。重复编码相同的数据会浪费精力，而重用相同的思想会导致一致性。\n\
    \n## b) 类与构造函数\n\n构造函数是特殊的类方法。根据它们所属的类，为你创建 `Objects`（对象）。在 Javascript 中，函数被用作组合的类和构造函数。在定义类时，你同时也定义了它的构造函数。在\
    \ Javascript 中定义类以及它的构造函数，请使用以下语法：\n\n```javascript\nvar ClassName = function(<any\
    \ inputs>) {\n  //在此处插入方法、字段和其他代码\n}\n```\n\n此外，构造函数仅仅是你作为函数形式的类名。要根据某个类创建数据对象，请遵循以下语法：\n\
    \n```javascript\nvar <variable name> = new Classname()\n```\n\n示例：\n\n```javascript\n\
    var House = function() {\n  //在此处插入代码\n}\nvar h = new House()\nvar MyHouse = h\n\
    ```\n\n要调用类对象，只需引用它：\n\n```javascript\nlet h\n```\n\n## 3) OOP 术语\n\n变量和函数在 OOP\
    \ 中承担了新的角色。它们可以分别被称为 `Fields`（字段）和 `Methods`（方法）。它们也可以被称为成员函数（Member functions）或成员变量（Member\
    \ Variables）。在某些情况下，完全取决于你想要使用哪个名称，只要你理解程序员在使用这些术语时的意思即可。\n\n`Fields`（字段）在 OOP\
    \ 中代表变量。就像任何条目中的字段一样，对象可以拥有许多你想到的值。将字段看作是对象的属性：\n\n```javascript\nvar Cat = function()\
    \ {\n  color = \"green\"\n}\n// 这些是基于类的对象的猫：\ncatA.color = \"white\"\ncatB.color\
    \ = \"grey\"\ncatC.color = \"orange\"\n```\n\n`Methods`（方法）代表对象拥有的函数。将方法看作对象执行的“动作”和行为。为特定的\
    \ `Class` 创建类方法，请遵循以下语法：\n\n```javascript\n<Class Name>.prototype.<Method Name>\
    \ = function() {\n  // 代码\n}\n```\n\n示例：\n\n```javascript\nCat.prototype.meow\
    \ = function() {\n  // 代码\n}\n```\n\n之后在 OOP 中你需要从对象本身访问方法。例如，如果我们基于 `Cat Class`\
    \ 创建了几个 `Cat` 对象，每个对象都拥有定义在 `Cat Class` 中的方法：\n\n```javascript\nclass Cat{\n \
    \ // 代码\n}\nCat.prototype.meow = function() {\n  // 代码\n}\n// 这些是基于类的对象的猫：\ncatA.meow()\n\
    catB.meow()\ncatC.meow()\n```\n\n最后，记住方法本质上仍然是函数。你仍然将它们放置在期望函数输出数据类型的地方。\n\n示例：\n\
    \n```javascript\n// 输出字符串\nFox.prototype.say = function() {\n  return \"ringdingdingding\"\
    \n}\nvar whatDoesTheFoxSay = someFox.say()\nprint(whatDoesTheFoxSay)\n```\n\n\
    # Archive Javascript-A1a: 解决调度问题\n\n使用生成并测试算法解决调度问题的 AI。将以下代码复制到你喜欢的 IDE 中：\n\n\
