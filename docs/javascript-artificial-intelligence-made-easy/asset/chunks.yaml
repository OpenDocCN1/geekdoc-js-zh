    ========================= ======


    This is the default Frontier Search Algorithm used by most chapters throughout
    the book.


    It is strongly recommended to view this only after you’ve finished building &
    successfully testing the algorithm already.


    function Node(c) {


    this.contents = c


    this.children = []


    this.getContents = function() {


    return this.contents


    }


    this.getChildren = function() {


    return this.children


    }


    }


    /*


    // MAIN FRONTIER SEARCH ALGORITHM:


    */


    function search(query, start) {


    // - frontier:= {new array of Nodes}


    var frontier = [];


    // - create a new Path and put the Start node in it


    p = new Path();


    p.contents.push(start);


    // - put the new Path into the frontier


    frontier.push(p)


    while (frontier.length > 0) {


    // - select and remove a Path <s0, s1,….,sk> from frontier;


    // (use helper function pickPath() )


    pick = pickPath(frontier);


    // If node (sk) is a goal, return selected Path


    if (hasGoal(query, pick)) {


    return pick;


    }


    else {


    // For every connected node of end node sk:


    // - Make a copy of the selected Path


    // - Add connected node of sk onto path copy


    // - add copied Path <s0, s1,….,sk, s> to frontier;


    size = pick.contents.length;


    last = pick.contents[size - 1];


    for (n in last.children) {


    toAdd = new Path();


    for (x in pick.contents) {


    toAdd.contents.push(pick.contents[x])


    }


    toAdd.contents.push(last.children[n]);


    frontier.push(toAdd);


    }


    }


    }


    // - indicate ‘NO SOLUTION’ if frontier empties


    // (we''ll output false if there''s no solution)


    return false;


    }


    /*


    // HELPER FUNCTION #1:


    // NOTE: you can modify the position assignment to change the Search Strategy


    */


    function pickPath(f) {


    var position = 0;


    var ret = f[position];


    f.splice(position, 1);


    return ret;


    }


    /*


    // HELPER FUNCTION #2:


    */


    function hasGoal(s, p) {


    for (i in p.contents) {


    if (p.contents[i].contents == s) return true;


    }


    return false;


    }


    // The Path Class:


    function Path() {


    this.contents = []


    }


    Printer Function:


    function printer(p) {


    if (p == false) return "NOTE: No Solution Found";


    else {


    var s = "Solution Found! Path: ";


    for (i = 0; i<p.contents.length; i++) {


    s += p.contents[i].contents + ", ";


    }


    return s;


    }


    }


