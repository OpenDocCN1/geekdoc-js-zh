- fmt: "\nIncluded is a quick kit to cover Basic Javascript Programming. You’ll find\
    \ what you need to get a good start in programming Javascript. Then, you’ll be\
    \ prepared to use the many tools and components of AI throughout the book.\n\n\
    # Introduction\n\nLogic. Rationality. Reasoning. Thought. Analysis. Calculation.\
    \ Decision-making.\n\nAll this is within the mind of a human being, correct? Humanity\
    \ has been blessed with the ability to think and act so intelligently.\n\nThen\
    \ came Machine. Humanity has also blessed it the gift of intelligence.\n\nAnd\
    \ in today’s world, you can see firsthand what an intelligent mind can do for\
    \ you; carry a conversation, give you directions to a certain location, play a\
    \ video game as an opponent, and so on.\n\nIn essence, only our imaginations will\
    \ limit us from what’s truly possible\n\n## An Artificial Intelligence Agent\n\
    \nIn terms of Artificial Intelligence, an agent can be anything that, given an\
    \ environment to focus on, can think intelligently and act independently. It can\
    \ continue observing and learning through experience. It can calculate and independently\
    \ decide the best course of action, whether it has perfect knowledge of the situation\
    \ or just a part of it. It can also take note and adapt to a changing environment.\n\
    \nSo you might wonder, how has mankind ever developed something so complex?\n\n\
    Well, it’s not as complex as you think.\n\nIf you understand the process of how\
    \ a computer can observe, learn, and expand its knowledge - and how it can take\
    \ all this information and come up with an ideal solution or decision - then an\
    \ artificially created mind won’t be as complex as you think.\n\nSometimes, it\
    \ can take as little as a few lines of code to have a computer come up with solutions\
    \ for you. Sometimes it can take hundreds. Sometimes, thousands.\n\n# Chapter\
    \ 1: Algorithms: The Essentials\n\nIn essence, how an AI agent will contemplate,\
    \ process, rationalize, apply logic, & ultimately generate solutions will mainly\
    \ be through the use of algorithms.\n\nIf you’re new to programming, don’t be\
    \ intimidated. An algorithm is essentially a procedure to handle data. As long\
    \ as you understand how a certain algorithm processes its data, you’ll be fine.\n\
    \n## Algorithm Traits\n\nFirst, you’ll want your algorithms to satisfy four key\
    \ factors:\n\n- Completeness\n- Optimization\n- Time Complexity\n- Space Complexity\n\
    \nNow we’ll go through each of these and explain them all. Afterwards, you’ll\
    \ explore some algorithm ideas and determine how they fit in to each of these\
    \ factors.\n\n### Completeness\n\nIf an algorithm is guaranteed to find at least\
    \ one existing solution or conclusion within a certain time frame, we can say\
    \ that an algorithm is complete.\n\n### Optimization\n\nIf an algorithm finds\
    \ a solution and guarantees that it is the optimal one, then that algorithm is\
    \ considered optimal.\n\n### Time Complexity\n\nFor an algorithm, this is an expression\
    \ for the longest possible time it will take to complete. In other words, the\
    \ worst-case scenario when it runs and finds a suitable solution.\n\n### Space\
    \ Complexity\n\nThis expression is similar to Time Complexity, but instead it\
    \ represents the maximum amount of memory the algorithm may use in order to find\
    \ a solution. This is also considered the worst-case scenario.\n\n## Your Ideal\
    \ Algorithm\n\nAfter discussing the traits your algorithm can have, you’ll get\
    \ an idea in what to look for when creating an AI algorithm. You want to design\
    \ yours to find at least one solution (completeness), and the best solution it\
    \ can create given data it has (optimization) while using up as little computational\
    \ effort as you can (Time & Space Complexity)\n\n# Javascript 01a: using AI to\
    \ Solve Complex Time Scheduling\n\nImagine 5 of your friends trying to get together\
    \ and have fun somewhere. It might sound simple at first, but it can become far\
    \ more complicated than you think.\n\nWhat if one of your friends has work at\
    \ certain times? What if another friend has school? What if he/she has a prior\
    \ engagement? Soccer practice? Dance classes? Study time? Sure, you can all get\
    \ together and have fun. However, it has to be at a time when EVERYONE is available.\n\
    \nSo, given each friend you have, you need to lay out their time schedules, then\
    \ cross out times that they’re busy. Afterwards, if there is some common available\
    \ time among all your friends, everyone says they’re available, then you and your\
