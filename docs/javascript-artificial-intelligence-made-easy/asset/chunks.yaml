    }\n}\n```\n\n# 归档 Javascript A3.1: 前沿搜索算法 (Frontier Search Algorithm)\n\n对于下述过程，请选择你选择的\
    \ IDE。你也可以使用在线 IDE，如 [rextester.com](http://rextester.com), [ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org)。\n\n这是书中大部分章节使用的默认前沿搜索算法。强烈建议在你已经完成构建并成功测试该算法后再查看此内容。\n\
    \n```javascript\nfunction Node(c) {\n  this.contents = c\n  this.children = []\n\
    \  this.getContents = function() {\n    return this.contents\n  }\n  this.getChildren\
    \ = function() {\n    return this.children\n}\n\n// 前沿搜索算法：\nfunction search(query,\
    \ start) {\n  // 创建前沿\n  var frontier = [];\n  // 将起始节点放入前沿\n  frontier.push(start);\n\
    \  while (frontier.length > 0) {\n    // 从前沿中选择一个节点\n    pick = pickPath(frontier);\n\
    \    // 如果该节点是目标\n    if (hasGoal(query, pick)) {\n      return pick;\n    } else\
    \ {\n      // 否则，将该节点的子节点加入前沿\n      for (n in pick.getChildren()) {\n       \
    \ toAdd = new Node(n);\n        frontier.push(toAdd);\n      }\n    }\n  }\n \
    \ // 如果前沿为空仍未找到\n  return false;\n}\n\n// 辅助函数 #1：从前沿中选择并移除节点\nfunction pickPath(f)\
    \ {\n  var position = 0;\n  var ret = f[position];\n  f.splice(position, 1);\n\
    \  return ret;\n}\n\n// 辅助函数 #2：检查节点是否是目标\nfunction hasGoal(s, p) {\n  for (i\
    \ in p.contents) {\n    if (p.contents[i].contents == s) return true;\n  }\n \
    \ return false;\n}\n\n// 打印函数：\nfunction printer(p) {\n  if (p == false) return\
    \ \"注意：未找到解决方案\";\n  else {\n    var s = \"找到解决方案！路径： \";\n    for (i = 0; i<p.contents.length;\
    \ i++) {\n      s += p.contents[i].contents + \", \";\n    }\n    return s;\n\
    \  }\n}\n```\n\n# 归档 Javascript A3.2: 更大的搜索图 (Bigger Search Graph)\n\n用于深度优先搜索\
