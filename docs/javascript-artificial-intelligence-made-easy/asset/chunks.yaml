    Step 3: Start coding the Algorithm


    (Before we move forward, it’s highly recommended to review the Algorithm procedure
    in the past few chapters.)


    Here, our search algorithm will be a standalone function. We can simply access
    it as a normal function, with a. a Node object as an input.


    Since we are checking for letters, the search query will be a String - the same
    data type for the Node containers.


    Place the Main Algorithm onto your code below, just after the Node Class you’ve
    created.


    /*


    // MAIN ALGORITHM:


    // INPUT:


    // - a goal query


    // <has same data type as node contents>


    // - a Start Node


    // (Start Node & its graph network accessed thru this method)


    // OUTPUT:


    // - a Path from start to Goal (a List of Nodes)


    // (multiple output types not acceptable in Ruby;


    // empty Path as output if no solution found)


    // EFFECT:


    // Frontier Search Algorithm: Returns a set of


    // nodes that lead from the input Node to a solution node if found


    */


    function search(query, start) {


    // - frontier:= {new array of Nodes}


    var frontier = [];


    // - create a new Path and put the Start node in it


    p = new Path();


    p.contents.push(start);


    // - put the new Path into the frontier


    frontier.push(p)


    while (frontier.length > 0) {


    // - select and remove a Path <s0, s1,….,sk> from frontier;


    // (use helper function pickPath() )


    pick = pickPath(frontier);


    // If node (sk) is a goal, return selected Path


    if (hasGoal(query, pick)) {


    return pick;


    }


    else {


    // For every connected node of end node sk:


    // - Make a copy of the selected Path


    // - Add connected node of sk onto path copy


    // - add copied Path <s0, s1,….,sk, s> to frontier;


    size = pick.contents.length;


    last = pick.contents[size - 1];


    for (n in last.children) {


    toAdd = new Path();


    for (x in pick.contents) {


    toAdd.contents.push(pick.contents[x])


    }


    toAdd.contents.push(last.children[n]);


    frontier.push(toAdd);


    }


    }


    }


    // - indicate ‘NO SOLUTION’ if frontier empties


    // (we''ll output false if there''s no solution)


    return false;


    }


    It’s considered a good programming practice to simplify what a function does.
    So instead of our algorithm function doing a lot of different things, it will
    call specialized helper functions to simplify the workload. This also makes it
    easier for programmers to check, edit, debug, and modify the code.


    Step 4: Add the Frontier Path Picker Function


