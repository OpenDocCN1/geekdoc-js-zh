    \ 运行诊断以检查水是否可以为房屋中的选定源供水\n*/\n\nfunction botUpDiagnostic (mode) {\nvar tapA\n\
    var tapB\nvar tapC\nvar tapF\nvar tapH\nvar kitchenTap_Hot\n\n// A <- 主水开关 (MainWaterSwitch)\n\
