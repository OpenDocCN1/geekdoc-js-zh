  raw: 'The Constraint procedures didn’t take much effort either. Each friend’s array
    of hours were only iterated through at least twice; once to check for unavailable
    hours, and twice or more to remove them.


    Between both versions, the difference was tens of thousands of combinations.


    If it doesn’t seem like much now, if this procedure were to check HUNDREDS or
    THOUSANDS of people - and their available hours - then different versions of the
    procedure can have HUGE differences in their efforts spent.


    So always remember: when you design algorithms of any sort, you have to take the
    procedure times and memory space into account. If there’s a more efficient procedure,
    use it.


    # Chapter 2: Logic & Reasoning


    ==== ==== ==== ==== ====


    Logic and AI?


    Boolean, or “True/False” logic is widely used in the field of Artificial Intelligence.
    It is essentially working with a collection of facts and statements that are either
    true or false.


    Think of the implementations for AI. You can use logic-based programming to have
    an AI agent make better decisions based on certain conditions. Further, you can
    have an AI agent diagnose technical problems, and even have AI agents take actions
    for you - such as fetch coffee (if the robot meets certain conditions, that is).


    Why use Logic?


    Perhaps the most compelling reason is how simple, easy, and natural it is to express
    facts and statements as true or false. You can have a statement such as “We’re
    having steak dinner tonight”, yet it clearly can’t be represented by numbers.
    You can also try assigning variables as strings or objects as such, but that will
    require more time and effort.


    But as a boolean, the statement “We’re having steak dinner tonight” will either
    be True or False. It’s that simple; either it’s true (we really are having steak
    dinner tonight) or it’s false.


    An AI agent can use several true/false statements and combine them in complex
    ways. And even so, the AI agent will manage the information much more easily.
    This is because one true statement can lead to another, then another, resulting
    in a conclusion, decision, or even a course of action for the agent.


    Adding more Logic


    We can even add more facts and knowledge easily, if needed. There can be one true
    fact or two. Then two true or false facts lead to another truth. Then another.
    For example, we can say a true statement such as, “it’s sunny outside”, then another
    such as “it’s warm outside”. These statements can lead to another truth: “It’s
    sunny AND warm outside. Therefore, I will be running for a mile”.


    If you put the above together into a proposition statement, it would look like
    so:


    “I will be running for a mile” <— “it’s sunny outside” AND “it’s sunny outside”


    And if you use variable labels to represent the above statements, it would look
    like so:


    c <— b AND a


    Debugging with Logic


    Conversely, you can use logic to explain the root causes of a certain fact. If
    one statement is true, it can be explained and justified by another fact, then
    those facts are justified by more facts, and so on. Here’s an example: you realize
    that “the remote control is not turning on the TV.” You carefully look at the
    remote and realize “its batteries are dead”. You change the batteries on the remote,
    try to turn on the TV, and realize that it’s still not turning on. You check the
    TV power cord and realize “it’s not plugged in.” Okay, you plug it in, try to
    turn it on again. And this time, it works.


    You can have the above as step-by-step logic statements as so:


    1) True: “The remote control is NOT turning on the TV.”


    2) True: “TV power cord is NOT plugged in”


    3) True: “Remote batteries are NOT charged”


    AND “TV power cord is NOT plugged in”


    This procedure is often used for debugging; if you find something that doesn’t
    work, you must go back and examine the inner workings to figure out what’s causing
    it.


    How AI analyzes a Logic-Based System


    An AI agent can analyze a given system based on whether or not certain conditions
    are true. Those conditions will lead to other conditions being true or not, then
    other conditions, and so on.


    There are two general procedures to do this. First is a top-down diagnosis, where
    the procedure will check certain key conditions (most likely topmost statements
    that affect other conditions), then go through the system to see what results.


    The other is a bottom-up diagnosis, where the procedure will check why a certain
    end condition is or isn’t what it should be. This is done by checking what other
    conditions lead it to be the way it is.


    # Javascript 02a: Using Logic-Based AI


    For the procedure below, select an IDE of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com), [ideone.com](http://ideone.com),
    or [codepad.org](http://codepad.org).


    ========================= ======


    There are plenty of designs and systems out there. Almost all of them can be represented
    as logic-based systems - which can be managed by AI systems to diagnose, repair,
    and analyze. However, in order to have the AI agent manage the system well, its
    programmer must understand the system very well. The programmer then has to represent
    the system as a logical code very well.


    For example, the electric wiring system in your house can be built using a series
    of true/false systems. The plugs in the wall, as well as the lights in your room,
    are all true/false switches that receive their feed from circuit breakers and
    wiring panels - more sets of true/false switches. This design benefits home developers,
    as they can trace the main power coming from outside and figure out whether or
    not electrical power flows to all plugs, lights, and generally anything that needs
    electricity in the house. This design also benefits house residents; if a certain
    light or plug isn’t working, the wiring can be traced all the way to the outside
    source to see where is the electricity getting cut off.


    Water Flow In a House Example:


    Below is a diagram for water flow for a 1-bedroom suite:￼![M-AI-WaterDiagram.jpg](images/00001.jpeg)


    There are taps for the bath tub, washroom sink, and kitchen. The laundry washer
    can activate for a short time, using some combination of hot and cold water. The
    toilet has a switch that directs flow to it. The toilet is either flushing or
    not. Also, there is a switch that either feeds water onto the boiler system or
    not. There are also taps labelled A to H that stop or allow water flow. And lastly,
    the Main Water Switch either allows or stops overall water flow into the suite.


    Whether or not water will flow from a certain water source will depend on the
    connections, taps, and switches in the house.


    Where are the Switches & Taps?


    The first thing you’ll want to do is identify which points of water flow in the
    system above can be toggled on and off.


    If you look at the diagram, the switches:


    - the pair of hot/cold taps for the bathtub, washroom, and kitchen


    - A pair of hot/cold switches laundry washer


    - taps labelled A - H


    - The Boiler Switch


    - The Main Water Switch


    These will be boolean taps that are either TRUE, FALSE, or dependent on the true/false
    state of another switch/tap.


    Representing the System as Logical Statements


    At this stage, it’s best not to code yet. We need to determine how each of the
    switches feeds water to the next switch - all the way to the end taps that give
    water to the residents.


    We can start with the toilet. House residents use the water by flushing the toilet.
    We can have a statement such as, “The Toilet can Flush. Therefore, it is connected
    to the water supply” ; The logic notation is shown below:


    // ToiletFlushable <- ToiletConnected


    We can see that taps A, B, C, and D affect its water flow, as well as the Toilet
    Connector and the Main Water Switch:


    // ToiletConnected <- D and C


    // C <- B and A


    // A <- MainWaterSwitch'
