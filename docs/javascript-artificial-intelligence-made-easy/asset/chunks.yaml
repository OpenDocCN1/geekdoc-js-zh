    \ The Lowest-Cost Search Algorithm\n\n![M-AI-LCSTree.png](images/00009.jpeg)\n\
    The algorithm will add Nodes `B`, `C`, and `D` to the frontier, as well as their\
    \ respective costs, `5`, `7`, and `10`. Which node will require the least cost\
    \ to reach? `B`. So Node `B` will be processed first, then Nodes `E` and `F` are\
