  raw: 'Included is a quick kit to cover Basic Javascript Programming. You’ll find
    what you need to get a good start in programming Javascript. Then, you’ll be prepared
    to use the many tools and components of AI throughout the book.


    # Introduction


    ==== ==== ==== ==== ====


    Logic. Rationality. Reasoning. Thought. Analysis. Calculation. Decision-making.


    All this is within the mind of a human being, correct? Humanity has been blessed
    with the ability to think and act so intelligently.


    Then came Machine. Humanity has also blessed it the gift of intelligence.


    And in today’s world, you can see firsthand what an intelligent mind can do for
    you; carry a conversation, give you directions to a certain location, play a video
    game as an opponent, and so on.


    In essence, only our imaginations will limit us from what’s truly possible


    An Artificial Intelligence Agent


    In terms of Artificial Intelligence, an agent can be anything that, given an environment
    to focus on, can think intelligently and act independently. It can continue observing
    and learning through experience. It can calculate and independently decide the
    best course of action, whether it has perfect knowledge of the situation or just
    a part of it. It can also take note and adapt to a changing environment.


    So you might wonder, how has mankind ever developed something so complex?


    Well, it’s not as complex as you think.


    If you understand the process of how a computer can observe, learn, and expand
    its knowledge - and how it can take all this information and come up with an ideal
    solution or decision - then an artificially created mind won’t be as complex as
    you think.


    Sometimes, it can take as little as a few lines of code to have a computer come
    up with solutions for you. Sometimes it can take hundreds. Sometimes, thousands.


    # Chapter 1: Algorithms: The Essentials


    ==== ==== ==== ==== ====


    In essence, how an AI agent will contemplate, process, rationalize, apply logic,
    & ultimately generate solutions will mainly be through the use of algorithms.


    If you’re new to programming, don’t be intimidated. An algorithm is essentially
    a procedure to handle data. As long as you understand how a certain algorithm
    processes its data, you’ll be fine.


    Algorithm Traits


    First, you’ll want your algorithms to satisfy four key factors:


    - Completeness


    - Optimization


    - Time Complexity


    - Space Complexity


    Now we’ll go through each of these and explain them all. Afterwards, you’ll explore
    some algorithm ideas and determine how they fit in to each of these factors.


    Completeness


    If an algorithm is guaranteed to find at least one existing solution or conclusion
    within a certain time frame, we can say that an algorithm is complete.


    Optimization


    If an algorithm finds a solution and guarantees that it is the optimal one, then
    that algorithm is considered optimal.


    Time Complexity


    For an algorithm, this is an expression for the longest possible time it will
    take to complete. In other words, the worst-case scenario when it runs and finds
    a suitable solution.


    Space Complexity


    This expression is similar to Time Complexity, but instead it represents the maximum
    amount of memory the algorithm may use in order to find a solution. This is also
    considered the worst-case scenario.


    Your Ideal Algorithm


    After discussing the traits your algorithm can have, you’ll get an idea in what
    to look for when creating an AI algorithm. You want to design yours to find at
    least one solution (completeness), and the best solution it can create given data
    it has (optimization) while using up as little computational effort as you can
    (Time & Space Complexity)


    # Javascript 01a: using AI to Solve Complex Time Scheduling


    ========================= ======


    Imagine 5 of your friends trying to get together and have fun somewhere.


    It might sound simple at first, but it can become far more complicated than you
    think.


    What if one of your friends has work at certain times? What if another friend
    has school? What if he/she has a prior engagement? Soccer practice? Dance classes?
    Study time? Sure, you can all get together and have fun. However, it has to be
    at a time when EVERYONE is available.


    So, given each friend you have, you need to lay out their time schedules, then
    cross out times that they’re busy. Afterwards, if there is some common available
    time among all your friends, everyone says they’re available, then you and your
    friends have fun.


    Let’s have another example.


    How do you think a 32-team Sports League will schedule games throughout a year?
    For all 32 teams, they each need to match up with up to one other team to schedule
    a game. Each team needs a certain amount of games scheduled in a season of, say,
    6 months. There can only be a certain number of games in a single week and there
    needs to be enough time to travel between cities to have a game.


    These are times when a Scheduling Algorithm can help. It will take all members’
    availabilities and time constraints, then generate a viable solution. For scheduling,
    it can tell you what times of the day is everyone available. For large-scale implementations,
    it can be used to schedule sports league match-ups, schedule exams for tens of
    thousands of college students, and more.


    A very simple and easy algorithm to start with is the Generate-and-Test algorithm.


    The next chapters will show you the Algorithm and guide you through its procedure…


