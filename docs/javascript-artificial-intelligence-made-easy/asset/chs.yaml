  *(注：由于提供的原始文本包含大量重复内容，上述翻译已根据您的要求进行了处理。)*\n\n\n\n\n## 第 6.4 节：启发式搜索\n\n确定如何获取最佳路径的另一种方法是在弧上添加启发式（heuristics）。启发式值可以代表两个含义：\n\
  \n- 对到达解决方案总成本的极低估算\n- 一个需要最大化的值：解决方案应该具有尽可能的值\n\n在第一种情况下，你可以估计从起点到达最近目标节点的总成本。只要成本没有被高估，它就是可采的（admissible）。\n\
  \n在第二种情况下，它将与 LCFS（最后入先出）相反——每个从节点到子节点的弧都将有一个值，算法将找到一个值尽可能高的解决方案。\n\n### 它的工作原理：\n\
  \n节点与子节点之间的连接被称为弧（arcs）。它们可以包含算法生成可行、合法解决方案至关重要的信息。对于基于成本的搜索算法，弧需要具备节点与子节点之间的成本。\n\
  \n`[Node A] - - - -> arc A-B: cost=10 - - - ->[Node b]` 示例：启发式搜索算法\n\n下面的树与 LCFS\
  \ 中的树是同一个，但现在为 `![M-AI-LCFSTree (4).png](img/00010.jpeg)` 弧添加了值。\n\n启发式搜索算法将根据最接近估计值的成本或最大值来选择其节点。首先，它将节点\
  \ `b`、`c` 和 `d` 添加到沿（frontier）。\n\n例如，如果我们估计到达 `Node g` 的成本为 `7`，算法将首先处理 `Node c`，因为它的成本是\
  \ `7`。因此，节点 `g`、`h` 和 `i` 被添加到沿中，各自的总成本分别为 `g` 的 `11` (`4+7`)、`h` 的 `13` (`6+7`)\
  \ 和 `i` 的 `10` (`7+3`)。接着将处理 `Node b`，因为它的成本（`5`）目前最接近 `7`。然后添加它的子节点 `e` (`11 =\
  \ 6+5`) 和 `f` (`8=5+3`)。随后处理 `Node f`，沿沿加入了第二个 `Node g`，成本为 `(9=1+3+5)`。最近添加的 `Node\
  \ g` 成本最接近 `7`，因此对其进行处理。这是一个可行的最优解，因为其他 `g-nodes` 的成本分别为 `11` 和 `15`。\n\n另一方面，我们也可以让算法选择一个创建最高值的解决方案。如果我们想选择值最高的通\
  \ `Node g` 的路径，发生的情况如下：首先处理 `Node c`，因为它的值（`4`）。这添加了节点 `g`、`h` 和 `i`，其值分别为 `12`、`13`\
  \ 和 `10`。接下来将处理 `Node h`，但没有子节点可以添加到沿中。一旦 `Node g` 被处理后，`i` 将成为一个可行的解决方案，值为 `12`。\n\
  \n### 算法分析：启发式搜索\n\n#### 它是完备的吗？\n不是，因为算法在两个高值节点或两个最接近估计值的节点之间循环时，可能会陷入无限循环。\n\n\
  #### 它是最优的吗？\n遗憾不是，但这是因为基于值或基于成本的算法有时会是“贪婪”的。这意味着算法只会倾向于它目前拥有的最佳节点，而忽略所有其他选项。如果更深节点具有更高的值，但算法因为处理其他节点而无法到达它们，那么算法可能会产生次优的解决方案。\n\
  \n#### 它的时间与空间复杂度是多少？\n`O(b^m)`\n\n在最坏情况下，启发式搜索将探索树中的每个节点，并将每个节点存储在内存中。\n\n# 学习\
  \ JAVASCRIPT 的最方法，第 1 部分\n\n我们包含了一份学习编程基础知识的补充指南，帮助你成为一名更优秀的程序员。\n\n为了让你更轻松地理解，我们将其设置得尽可能简单。\n\
  \n为了方便运行代码，请选择你选择的 IDE（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 IDE，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n## 1) 基础数据类型。\n\n### 布尔值（Booleans）：\n这些本质上是开关闭开关值。在代码中，布尔值将是\
  \ `TRUE` 或 `FALSE`。\n\n在 Javascript 中，布尔值只能小写（即 `true`、`false`）。布尔值中不能包含任何大写字母（即\
  \ `TRUE`、`True`）。\n\n示例：\n`true`, `false`\n\n### 字符串（Strings）：\n这些是键盘字符的集合——包括字母、数字和其他符号——按某种顺序排列形成一个文本短语。它们以双引号开头和结尾。\n\
  \n示例：\n`\" This is a String. \"`\n`\" This 15 4 &^%$! 5tring t00\\.\" `\n\n### 数字（Numbers）：\n\
  Javascript 对所有数字一视为仁。它们都是 64 位浮点数（如果你不知道这意味着什么，可以查一下）。\n\n但通常来说，编程中主要有两种类型的数字：整数（整数）和浮点数（小数）。\n\
  \n#### 整数（Integers）：\n它们定义为没有分数或小数的整数。例如：\n`12`\n`143`\n`199932`\n\n#### 浮点数（Floats）：\n\
  也称为小数，它们是整数的相反。\n\n## 2) 变量（Variables）\n在编程中，变量是用于存储数据的名称。记得在学校里你使用字母如 `X` 和 `Y`\
  \ 来表示数字吗？在 Javascript 中也存在变量。\n\n你可以使用以下语法创建变量：\n`var (VariableName) = (Initial\
  \ Value)`\n\n或者，替代：\n`(VariableName) = (Initial Value)`\n\n示例：\n`var a = \" This\
  \ is a String. \"`\n`var b = 12`\n`var c = true`\n`var d = 0.123`\n\n## 3) 函数（Functions）\n\
  如果变量是句子，函数仅仅是动词。本质上是指令集。一旦代码调用它们，计算机就会执行。\n\n### 3a) 创建函数\n在 Javascript 中创建函数，遵循此语法：\n\
  \n```javascript\nfunction funcName(input1, input2, etc...) {\n    // 在此处编写代码\n \
  \   // 如果函数输出任何数据，使用下一行：\n    return data\n}\n```\n\n### 3b) 使用函数\n调用函数，只需编写其名称以及任何输入（如果需要）。但通常有两个地方可以放置函数。\n\
  \n单独占一行：\n`funcName(any required inputs)`\n\n或者在预期其输出数据类型的地方：\n`var variableName\
  \ = funcName(any required inputs)`\n\n示例：\n`funcABC(a, b, c)`（无输出）\n`var integer1\
  \ = funcABC(a, b, c)`\n\n## 4) 复合数据（Composite Data）\n这个概念意味着一组独立的、较小的数据组合成一个完整的、单一的数据块。用简单的话来说，如果变量是句子，复合数据就是由句子组成的整个段落。\n\
  \n在 Javascript 中，可以使用变量创建简单的复合数据。你可以使用以下语法创建它们：\n\n```javascript\nvar CompositeName\
  \ = {\n    part1name: value1,\n    part2name: value2,\n    part3name: value3,\n\
  };\n```\n\n这些被称为关联数组。我们稍后会介绍数组。\n\n示例：\n```javascript\nvar c = {\n    c1: \"String\
  \ Sample\",\n    c2: 234,\n    c3: true\n}\n```\n\n\n\n\n\n# 学习 JAVASCRIPT 的简单方法，第\
  \ 2 部分\n\n为了方便运行代码，请选择你喜欢的 `IDE`（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 `IDE`，例如 [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n## 第 5a 部分：Javascript 中的数组\n\n数组是特定数据类型的顺序列表。这些数据类型可以是简单的，也可以是复合的。\n\
  \n要设置数组，请遵循以下语法：\n\n```javascript\nvar (variable name) = []\n```\n\n或者：\n\n```javascript\n\
  (variable name) = []\n```\n\n你还可以根据项目在数组中的位置来访问单个项目。`0` 是第一个项目；数组大小减 1 是最后一个项目。（在编程中，极个数字通常是\
  \ `0`。记住这一点！）\n\n例如，你可以这样获取数组的第一个项目：\n\n```javascript\nsomeArray[0]\n```\n\n你可以像这样获取数组的最后一个项目：\n\
  \n```javascript\n// 一个可以容纳 10 个项目的数组：\nsomeArray[9]\n```\n\n## 第 5b 部分：迭代\n\n要处理数组中的每个项目，请使用这些行：\n\
  \n```javascript\nfor (var x in <arrayName>) {\n  // 每当在这段代码中提到‘x’时，\n  // 它将应用到数组中的每一个项目\n\
  }\n```\n\n例如，这将打印出 1 到 5：\n\n```javascript\nvar a = [1,2,3,4,5]\nfor (var x in a)\
  \ {\n  print(a[x])\n}\n```\n\n或者，你也可以用传统方式迭代它们。许多其他编程语言中：\n\n```javascript\nfor\
  \ (var x=0; x < arrayName.length;x++) {\n  // 每当在这段代码中提到‘x’时，\n  // 它将应用到数组中的每一个项目\n\
  }\n```\n\n再次，这将会打印 1 到 5：\n\n```javascript\nvar a = [1,2,3,4,5]\nfor (var x=0; x\
  \ < a.length;x++) {\n  print(a[x])\n}\n```\n\n## 第 6 部分：逻辑与运算符\n\n有三种基础逻辑运算符：AND（与）、OR（或）和\
  \ NOT（非）。\n\nAND 和 OR 用于比较两个或多个为真或假的陈句。它们以 `(x AND y)` 或 `(x OR y)` 的形式使用。\n\n如果其之间的所有项目都为真，则\
  \ AND 为真。如果其中的任意一个项目为真，则 OR 为真。\n\nNOT 返回其设置的单个陈句的相反值；因此‘NOT true’为假，而‘NOT False’为真。\n\
  \n在 Javascript 中，这些运算符的形式如下：\n\n- AND 运算符：`&&`\n- OR 运算符：`||`\n- NOT 运算符：`!<boolean>`\n\
  \n示例：\n\n```javascript\n// 打印 false:\nprint(true && false)\n\n// 打印 true:\nprint(true\
  \ || false)\n\n// 打印 false:\nprint(!true)\n```\n\n## 第 7 部分：IF-ELSE 语句\n\n这个概念非常简单：有一个布尔陈句需要检查。如果它为真，执行\
  \ IF 行之后的程序。如果为假，执行 ELSE 行之后的程序。\n\n```javascript\nif (<插入可以输出布尔值的内容>) {\n  // 如果为真执行的代码\n\
  } else {\n  // 如果为假执行的代码\n}\n```\n\n注意，条件程序位于大括号 `{ }` 之间。一个 IF 语句也不需要 ELSE 语句；它可以独立存在：\n\
  \n```javascript\nif (<插入可以输出布尔值的内容>) {\n  // 如果为真执行的代码\n}\n```\n\n示例：\n\n```javascript\n\
  // IF-ELSE 结合使用：\nif (age > 20) {\n  drinkingAge = true\n} else {\n  drinkingAge\
  \ = false\n}\n\n// 独的 IF 语句：\nif (happy() and knowIt()) {\n  hands.clap()\n}\n```\n\
  \n# 学习面向对象的简单方法\n\n为了方便运行代码，请选择你喜欢的 `IDE`（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 `IDE`，例如\
  \ [rextester.com](http://rextester.com)、[ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org)。\n\
  \n## a) 面向对象编程\n\n在编程世界中，你会经常听到这个术语。这是因为面向对象编程（简称 OOP）是那里最广泛使用的风格之一。在其他编程语言中，`Classes`（类）作为复合数据的形式，用于将较小的数据组合成一个更大的整体。面向对象编程的核心点是：在面向对象编程中，你创建了这些类的“副本”。简单来说，`Class`（类）是一个充当“蓝图”的数据结构。你创建的那些“副本”被称为\
  \ `Objects`（对象）。为什么呢？随着你对编程的了解越来越多，你将遇到“抽象”的概念——将一个通用的思想应用于多个场景，最终节省时间和精力，同时极大地减少了困惑和挫败感。重复编码相同的数据会浪费精力，而重用相同的思想会导致一致性。\n\
  \n## b) 类与构造函数\n\n构造函数是特殊的类方法。根据它们所属的类，为你创建 `Objects`（对象）。在 Javascript 中，函数被用作组合的类和构造函数。在定义类时，你同时也定义了它的构造函数。在\
  \ Javascript 中定义类以及它的构造函数，请使用以下语法：\n\n```javascript\nvar ClassName = function(<any\
  \ inputs>) {\n  //在此处插入方法、字段和其他代码\n}\n```\n\n此外，构造函数仅仅是你作为函数形式的类名。要根据某个类创建数据对象，请遵循以下语法：\n\
  \n```javascript\nvar <variable name> = new Classname()\n```\n\n示例：\n\n```javascript\n\
  var House = function() {\n  //在此处插入代码\n}\nvar h = new House()\nvar MyHouse = h\n\
  ```\n\n要调用类对象，只需引用它：\n\n```javascript\nlet h\n```\n\n## 3) OOP 术语\n\n变量和函数在 OOP\
  \ 中承担了新的角色。它们可以分别被称为 `Fields`（字段）和 `Methods`（方法）。它们也可以被称为成员函数（Member functions）或成员变量（Member\
  \ Variables）。在某些情况下，完全取决于你想要使用哪个名称，只要你理解程序员在使用这些术语时的意思即可。\n\n`Fields`（字段）在 OOP 中代表变量。就像任何条目中的字段一样，对象可以拥有许多你想到的值。将字段看作是对象的属性：\n\
  \n```javascript\nvar Cat = function() {\n  color = \"green\"\n}\n// 这些是基于类的对象的猫：\n\
  catA.color = \"white\"\ncatB.color = \"grey\"\ncatC.color = \"orange\"\n```\n\n\
  `Methods`（方法）代表对象拥有的函数。将方法看作对象执行的“动作”和行为。为特定的 `Class` 创建类方法，请遵循以下语法：\n\n```javascript\n\
  <Class Name>.prototype.<Method Name> = function() {\n  // 代码\n}\n```\n\n示例：\n\n\
  ```javascript\nCat.prototype.meow = function() {\n  // 代码\n}\n```\n\n之后在 OOP 中你需要从对象本身访问方法。例如，如果我们基于\
  \ `Cat Class` 创建了几个 `Cat` 对象，每个对象都拥有定义在 `Cat Class` 中的方法：\n\n```javascript\nclass\
  \ Cat{\n  // 代码\n}\nCat.prototype.meow = function() {\n  // 代码\n}\n// 这些是基于类的对象的猫：\n\
  catA.meow()\ncatB.meow()\ncatC.meow()\n```\n\n最后，记住方法本质上仍然是函数。你仍然将它们放置在期望函数输出数据类型的地方。\n\
  \n示例：\n\n```javascript\n// 输出字符串\nFox.prototype.say = function() {\n  return \"\
  ringdingdingding\"\n}\nvar whatDoesTheFoxSay = someFox.say()\nprint(whatDoesTheFoxSay)\n\
  ```\n\n# Archive Javascript-A1a: 解决调度问题\n\n使用生成并测试算法解决调度问题的 AI。将以下代码复制到你喜欢的 IDE\
