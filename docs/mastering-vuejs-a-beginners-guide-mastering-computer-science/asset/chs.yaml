  \ 组件。我们可以在它放入一个 `<style>` 元素，将样式定义保持在组件附近。然而，如果这些样式更改了组件之外的任何内容，可能很难追踪和修复问题。这就是\
  \ scoped 功能大显用场的地方；它为你的每个样式分配一个唯一的 HTML 数据属性选择器，从而防止它们在全局范围内冲突。\n\n要使用 scoped 修符，请在\
