  \ block;\n  margin-bottom: 6px;\n}\n.custom-checkbox >.checkbox {\n  font-family:\
  \ Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing:\
  \ grayscale;\n  font-weight: 410;\n  font-size: 18px;\n  font-size: 1rem;\n  line-height:\
  \ 1.26;\n  box-sizing: border-box;\n  width: 90%;\n  height: 42px;\n  height: 2.6rem;\n\
  \  margin-top: 0;\n  padding: 6px;\n  border: 3px solid #0b0c0c;\n  border-radius:\
  \ 0;\n  -webkit-appearance: none;\n  -moz-appearance: none;\n  appearance: none;\n\
  }\n.custom-checkbox > input:focus {\n  outline: 3px dashed #fd0;\n  outline-offset:\
  \ 0;\n  box-shadow: inset 0 0 0 2px;\n}\n.custom-checkbox {\n  font-family: Arial,\
  \ sans-serif;\n  -webkit-font-smoothing: antialiased;\n  font-weight: 410;\n  font-size:\
  \ 1.8rem;\n  line-height: 1.26;\n  display: block;\n  position: relative;\n  min-height:\
  \ 41px;\n  margin-bottom: 12px;\n  padding-left: 41px;\n  clear: left;\n}\n.custom-checkbox\
  \ > input[type=\"checkbox\"] {\n  -webkit-font-smoothing: antialiased;\n  cursor:\
  \ pointer;\n  position: absolute;\n  z-index: 1;\n  top: -2px;\n  left: -2px;\n\
  \  width: 45px;\n  height: 45px;\n  margin: 0;\n  opacity: 0;\n}\n.custom-checkbox\
  \ >.checkbox-label {\n  font-size: inherit;\n  font-family: inherit;\n  line-height:\
  \ inherit;\n  display: inline-block;\n  margin-bottom: 0;\n  padding: 9px 16px 6px;\n\
  \  cursor: pointer;\n  touch-action: manipulation;\n}\n.custom-checkbox > label::before\
  \ {\n  content: \"\";\n  box-sizing: border-box;\n  position: absolute;\n  top:\
  \ 0;\n  left: 0;\n  width: 41px;\n  height: 41px;\n  border: 3px solid currentColor;\n\
  \  background: transparent;\n}\n.custom-checkbox > input[type=\"checkbox\"]:focus\
  \ + label::before {\n  border-width: 5px;\n  outline: 4px dashed #228bec;\n}\n.custom-checkbox\
  \ > label::after {\n  box-sizing: content-box;\n  content: \"\";\n  position: absolute;\n\
  \  top: 12px;\n  left: 8px;\n  width: 19px;\n  height: 8px;\n  transform: rotate(-45deg);\n\
  \  border: solid;\n  border-width: 0 0 6px 6px;\n  border-top-color: transparent;\n\
  \  opacity: 0;\n  background: transparent;\n}\n.custom-checkbox > input[type=\"\
  checkbox\"]:checked + label::after {\n  opacity: 1;\n}\n@media only screen and (min-width:\
  \ 40rem) {\n  label,\n  input,\n  .custom-checkbox {\n    font-size: 18px;\n   \
  \ font-size: 1.8rem;\n    line-height: 1.31579;\n  }\n}\n```\n\n为了连接这些样式，我们需要在我们的模板中添加一些\
  \ CSS 类。\n\n为根元素 `<div>` 添加 `custom-checkbox` 类。为 `<input>` 添加 `checkbox` 类。最后，为\
  \ `<label>` 添加 `checkbox-label` 类。修改后的模板如下所示：\n\n*   应用程序中现在可以使用**自定义复选框**（*Custom\
  \ checkboxes*）了。\n*   Vue 组件的 CSS 样式可以帮助开发者为其应用程序添加设计感，例如背景颜色、文本大小、内边距、位置、动画以及针对不同屏幕尺寸的响应式显示。\n\
  *   Vue 指令允许你在模板中处理类和样式绑定。为了保持应用程序的结构化，你可以在组件中使用内联样式或使用外部 CSS 文件。\n\n通过创建一个简单的网页，本节将将介绍几种使用\
  \ CSS 对 Vue 组件进行样式化的方法。\n\n### 前提条件\n\n在开始执行此说明之前，有几点你需要注意。首先，你需要一个代码编辑器，首选 Visual\
  \ Studio Code。然后，在终端中运行以下命令以确认你的 Node.js 版本在 10.x 或以上：\n\n```bash\nnode -v\n```\n\
  \n你还需要 Vue 最新的 CLI。要下载最新版本，请先卸载之前的版本：\n\n```bash\nnpm uninstall -g @vue/cli\n```\n\
  \n然后安装最新版本：\n\n```bash\nnpm install -g @vue/cli\n```\n\n或者，你可以通过以下方式升级版本：\n\n```bash\n\
  npm update -g @vue/cli\n```\n\n### 设置你的项目\n\n要启动新项目，输入：\n\n```bash\nvue create <project_name>\n\
  ```\n\n它将提示你选择预设：\n1. 默认设置，包含 Babel + ESLint。\n2. Vue。\n3. 手动选择你想要的功能。\n\n然后我们将切换目录：\n\
  \n```bash\ncd <project_name>\n```\n\n我们将配置为在 localhost 中查看：\n\n```bash\nnpm run\
  \ serve\nor yarn serve\n```\n\n### 在 Vue 中设置样式，使用 Scoped\n\n链接到 `<style>` 标签的 `scoped`\
  \ 属性表示，此处提供的任何 CSS 将仅应用于此模板，而不会应用于任何其他组件。\n\n首先创建一个名为 `Navbar` 的导航栏组件：\n\n```vue\n\
  <template>\n    <div class=\"navbar\">\n        <a href=\"#\">About</a>\n      \
  \  <a href=\"#\">Services</a>\n        <a href=\"#\">Contact</a>\n    </div>\n</template>\n\
  \n<script>\nexport default {\n    name: 'Navbar'\n}\n</script>\n\n<style scoped>\n\
  .navbar {\n    background: #fff;\n    padding: 2rem;\n    display: flex;\n    flex-direction:\
  \ column;\n}\n.navLink {\n    color: #228bec;\n    text-decoration: none;\n    padding:\
  \ 1rem;\n    font-size: 1.7rem;\n}\n@media only screen and (max-width: 610px) {\n\
  \    .navLink {\n        text-align: center;\n    }\n}\n</style>\n```\n\n在前面的示例中，我们使用了\
  \ `scoped` 属性，这意味着此处定义的样式将仅用于该组件。\n\n### 使用外部 CSS 文件链接样式\n\n随着应用程序的扩展，我们可能将 CSS\
  \ 拆分到外部文件中。这是一种清理代码的方法。\n\n这是一个示例，首先创建一个名为 `Body` 的组件：\n\n```vue\n<template>\n \
  \   <div class=\"container\">\n        <h2>Cruz Page</h2>\n        <button class=\"\
  btn\">Get started</button>\n    </div>\n</template>\n\n<script>\nexport default\
  \ {\n    name: 'Body'\n}\n</script>\n\n<style scoped src=\"../assets/css/startpage.css\"\
  >\n/* 此处可以添加覆盖样式 */\n</style>\n```\n\n上面的组件将包含以下外部 CSS 文件：\n\n```css\n.startPage\
  \ {\n    height: 610px;\n    background-color: #f44337;\n    text-align: left;\n\
  }\nh2 {\n    padding-top: 12rem;\n    font-size: 5rem;\n}\n.btn {\n    background:\
  \ black;\n    color: #fff;\n    border-radius: 6px;\n    -webkit-border-radius:\
  \ 6px;\n    -moz-border-radius: 6px;\n    -ms-border-radius: 6px;\n    -o-border-radius:\
  \ 6px;\n    outline: none;\n    padding: 0.8rem 3rem;\n    border: none;\n    margin-top:\
  \ 3rem;\n}\n```\n\n当使用外部文件时，你可以直接从源文件链接，或者在 `<style>` 标签中导入。在这个示例中，我们连接了位于 Vue 应用程序\
  \ 文件夹中的外部 CSS 文件。\n\n### 在 Vue.js 中使用全局样式\n\n我们将在应用程序组件中使用各种样式。为了节省时间，我们将使用全局样式，而不是在\
  \ scoped 或外部文件中设置样式（尽管那样也行）。对于字体、颜色、背景颜色、圆角和边距等通用样式，全局样式是你的最佳选择。\n\n在下面的示例中，将在 `app.vue`\
  \ 的 style 标签中添加全局样式：\n\n```vue\n<template>\n  <div>\n    <Navbar/>\n    <Body/>\n\
  \  </div>\n</template>\n\n<script>\nimport Navbar from './components/Navbar.vue'\n\
  import Body from './components/Body.vue'\n\nexport default {\n  name: 'App',\n \
  \ components: {\n    Navbar,\n    Body\n  }\n}\n</script>\n<style>\n* {\n  box-sizing:\
  \ border-box;\n  padding: 1;\n  margin: 1;\n}\nh1,h2,h3,h4,h5,h6 {\n  color: #fff;\n\
  }\n</style>\n```\n\n\n\n我们使用了 CSS 通配符选择器（读作星号）来选取我们应用程序中的所有项目，正如你看到的。在这种情况下，所有方向的页边距（margin）和内边距（padding）均设置为\
  \ 0，且 `box-sizing` 为 `border-box`。\n\n## 使用内联样式\n\n使用 `style` 标签，内联 CSS 可以为特定的 HTML\
  \ 元素应用唯一的样式。\n\n这是一个简单的示例：\n\n```\n<h1 style=\"color: yellow; text-align: center;\"\
  >I am a footer</h1>\n```\n\n我们可以在 Vue.js 中通过在 HTML 标签中绑定 `style` 属性来为我们的元素应用内联样式。在这种情况下，`:style`\
  \ 是 `v-bind:style` 的缩写。\n\n内联样式有两种方法：对象语法和数组语法。下面将详细讨论这两种方法。\n\n### 对象语法\n\n使用对象语法，我们可以通过将\
  \ CSS 属性名作为对象的键名（key），将值作为每个 CSS 属性的值，来利用内联样式。在使用对象语法时，请使用 `camelCase`（驼峰命名法）或 “kebab-case”（短横线命名法），如下所示：\n\
  \n```\n<template>\n    <footer\n      :style=\"{backgroundColor: bgColor, color:\
  \ textColor,\n              height: '${height}px', textAlign: align,\n         \
  \     padding: '${padding}rem'\n              }\">\n          <p> &copy; 2022</p>\n\
  \    </footer>\n</template>\n<script>\nexport default {\n    data(){\n        return{\n\
  \            bgColor: 'black',\n            textColor: 'black',\n            height:\
  \ 220,\n            align: 'center',\n            padding: 6\n        }\n    }\n\
  }\n</script>\n<style>\n\n</style>\n```\n\n我们开发了一个页脚组件，然后使用对象语法对页脚元素进行了样式处理。\n\n\
  当使用对象语法技术时，直接连接到样式对象是一个创新想法，这样随着应用程序的增长，我们的模板看起来更整洁。考虑以下示例：\n\n```\n<template>\n\
  \        <footer :style=\"footerStyles\">\n          <p> &copy; 2022</p>\n     \
  \   </footer>\n</template>\n<script>\nexport default {\n    data(){\n        return{\n\
  \            footerStyles:{\n                backgroundColor: 'white',\n       \
  \         color: 'black',\n                height: '220px',\n                textAlign:\
  \ 'left',\n                padding: '6rem'\n            }\n\n        }\n    }\n\
  }\n</script>\n<style>\n\n</style>\n```\n\n### 数组语法\n\n数组语法用于为内联样式添加多个样式对象。在下一个示例中，我们将向数组语法添加一个新对象\
  \ `textColor`，它将改变文本颜色。\n\n```\n<template>\n             <footer :style=\"[footerStyles1,\
  \ textColor]\">\n             <p> &copy; 2022</p>\n             </footer>\n</template>\n\
  <script>\nexport default {\n    data(){\n         return{\n             footerStyles1:{\n\
                  backgroundColor: 'white',\n                height: '220px',\n                textAlign:\
  \ 'left',\n                padding: '6rem'\n            },\n             textColor:{\n\
                 color: 'red',\n              }\n\n         }\n       }\n\n   }\n\
  }\n</script>\n<style>\n\n</style>\n```\n\n如上面的示例所示，当添加许多样式对象时，数组语法是理想的；而对于动态样式类，对象语法是内联样式的最佳选择。\n\
  \n本节向我们展示了如何通过多种方法为 Vue.js 应用设置样式，包括范围样式、连接外部 CSS 文件、全局样式以及使用对象和数组语法的内联样式。\n\n完成本章内容后，我们将进入\
  \ 第 3 章 的后续部分：样式组件（Styled Components）。\n\n## 样式组件 (STYLED COMPONENTS)\n\nWeb 开发框架的样式随着\
  \ Web 开发能力和工具的进步而演变。放弃内联样式转向 CSS-in-JS 解决方案提高了开发体验的一致性。\n\n开发者可以在 JavaScript 中使用\
  \ CSS，或者在 JavaScript 中使用 JavaScript 来处理样式。\n\n### 在 Vue 中使用样式组件的优势 (Benefits of\
  \ Styled Components in Vue)\n\n#### 构建你的组件 (Build Components)\n\n#### 在 Vue 中的样式组件\
  \ (Styled Components in Vue)\n\n#### 无需类名 (No Classes)\n\n#### 并发设计 (Concurrent\
  \ Design)\n\n#### 巨大的社区 (A Huge Community)\n\n### 在 Vue 中安装样式组件 (Installing Styled\
  \ Components in Vue)\n\n正如我们看到的，有一个基础的 h1 元素没有样式。我们将使用样式组件为这个 h1 设置样式，因此我们需要在 `src`\
  \ 目录下创建一个新文件夹来存放它们。\n\n在为我们的 HTML 标签设置样式之前，我们需要在机器上安装库。\n\n### 在 Vue 项目中安装样式组件 (Styled\
  \ Components in Vue 项目)\n\n在创建 Vue 项目后，使用以下命令安装库：\n\n```\nnpm i vue-styled-components\n\
  ```\n\n如果你使用 Vue CLI 创建项目，目录结构如下：\n\n![A screenshot displays the folder structure\
  \ using Vue.](img/ufig3_5.jpg)\n\n目录结构。\n\n移除所有样式后，Helloeveryone.vue 看起来是这样的：\n\n\
  ```\n<template>\n  <div class=\"hello\">\n    <h1>{{ msg }}</h1>\n  </div>\n</template>\n\
  \n<script>\nexport default {\n  name: 'Helloeveryone',\n  props: {\n    msg: String\n\
  \  }\n}\n</script>\n```\n\n让我们执行项目并在浏览器中查看结果。\n\n![A screenshot displays a project\
  \ output in the browser when all styles are removed. The navigation bar reads local\
  \ host 8080. The screen reads, Welcome to Your Vue.](img/ufig3_6.jpg) <details><summary>图\
  \ 1 详细描述 (Long Description Unnumbered Figure 1)</summary> 导航栏显示 VUE APP，带有保存、刷新和最小化按钮。屏幕列出了：node_modules、public、src（右侧有一个小圆）、assets、logo.png（带有图标）、components（右侧有一个小圆）、styled\
  \ components（右侧有一个小圆）、App.vue（带有 Vue 图标）、main.js（带有 JS 图标）、.gitignore、babel.config.js、package.json（带有一对大括号）、package-lock.json、readme.md（带有图标）。</details>\n\
  \n输出屏幕。\n\n正如我们看到的，有一个没有任何样式的基础 h1 头部元素。我们将使用样式组件为该 h1 设置样式，因此我们需要 `src` 目录下创建一个文件夹来保持它们。在该文件夹中创建一个\
  \ `Header.js` 文件。以下是项目结构。\n\n然后，在 `Header.js` 中添加以下代码：\n\n```\nimport styled from\
  \ \"vue-styled-components\";\n\nexport const StyledHeader = styled.h1`\n  font-size:\
  \ 1.6em;\n  text-align: left;\n  color: red;\n  background-color: lightgrey;\n';\n\
  ```\n\n最后，在 `Helloeveryone.vue` 中，我们可以注册 `StyledHeader` 并使用它来替代 `h1`。\n\n\n\n```html\n\
  <template>\n  <div class=\"hello\">\n    <StyledHeader>{{ msg }}</StyledHeader>\n\
  \  </div>\n</template>\n\n<script>\nimport {StyledHeader} from \"../styled-components/Header\"\
  \nexport default {\n  name: 'Helloeveryone',\n  components:{\n    StyledHeader\n\
  \  },\n  props: {\n    msg: String\n  }\n}\n</script>\n```\n\n现在，让我们启动服务器，看看这个基础且无聊的\
  \ header 标签会发生什么。\n\n正如我们所看到的，在不需要任何 CSS 的情况下已经实现了必要的样式。\n\n### 在 Styled Components\
  \ 中传递 Props\n\nProps 可以像任何其他组件一样与 styled 组件一起使用。例如，我们可以构建一个输入字段并为其提供一个 prop。在本节中，我们将在\
  \ `components` 文件夹中构建一个名为 `Input.js` 的新组件，并向其中添加以下代码：\n\n```javascript\nimport styled\
  \ from \"vue-styled-components\";\n\nexport const StyledInput = styled.input'\n\
  \  font-size: 1.26em;\n  padding: 0.6em;\n  margin: 0.6em;\n  color: violet;\n \
  \ border: none;\n  background-color: lavender;\n  border-radius: 2px;\n\n  &:hover\
  \ {\n    box-shadow: inset 2px 2px 1px rgba(0, 0, 0, 0.1);\n  }\n';\n```\n\n接一步是在\
  \ `Helloeveryone.vue` 中使用它：\n\n```html\n<template>\n  <div class=\"hello\">\n  \
  \  <StyledHeader>{{ msg }}</StyledHeader>\n    <StyledInput/>\n  </div>\n</template>\n\
  \n<script>\nimport {StyledInput} from \"../styled-components/Input\"\nimport {StyledHeader}\
  \ from \"../styled-components/Header\"\n\nexport default {\n  name: 'Helloeveryone',\n\
  \  components:{\n    StyledInput,StyledHeader\n  },\n  props: {\n    msg: String\n\
  \  }\n}\n</script>\n```\n\n保存更改将导致这些更改反映在浏览器中，表明我们的输入已经完成渲染。\n\n然而，如果没有足够的输入，这看起来很奇怪。让我们将类型连同\
  \ prop 一起提供给 `StyledInput`。\n\n```html\n<template>\n  <div class=\"hello\">\n  <StyledHeader>{{\
  \ msg }}</StyledHeader>\n  <StyledInput placeholder=\"Password\" type=\"text\"/>\n\
  \  </div>\n</template>\n\n…\n```\n\n### 在 Vue.js 中通过 Props 进行动态样式处理\n\n这是样式组件的重要特性之一。它允许开发者在不依赖大量类名的情况下创建动态样式。\n\
  \n由于样式组件可以接收 props 并根据它们应用样式，让我们为 `StyledHeader` 提供自定义 props。\n\n对我们的 `Header.js`\
  \ 文件进行以下更改：\n\n```javascript\nimport styled from \"vue-styled-components\";\nconst\
  \ hdrProps = { primary: Boolean };\n\nexport const StyledHeader = styled(\"h1\"\
  , hdrProps)'\n  font-size: 1.5em;\n  text-align: start;\n  color: ${(props) => (props.primary?\
  \  \"white\" : \"black\")};\n  background-color: ${(props) => (props.primary?  \"\
  green\" : \"red\")};\n';\n```\n\n我们在这里为 `StyledHeader` 指定了 props。`styled` 函数接受包含\
  \ props 的 HTML 元素作为参数，此后我们可以根据该 prop 的值提供 CSS 的行为。\n\n让我们在不向之前构建的 header 提供任何 prop\
  \ 的情况下运行项目，观察浏览器中发生了什么。\n\n它的运行方式正如我们预期的那样。现在，给我们的 `StyledHeader` 一个主 prop，看看样式是否正确应用：\n\
  \n```html\n<template>\n  <div class=\"hello\">\n  <StyledHeader primary>{{ msg }}</StyledHeader>\n\
  \  <StyledInput placeholder=\"Password\" type=\"text\"/>\n  </div>\n</template>\n\
  \n<script>\nimport {StyledInput} from \"../styled-components/Input\"\nimport {StyledHeader}\
  \ from \"../styled-components/Header\"\n\nexport default {\n  name: 'Helloeveryone',\n\
  \  components:{\n    StyledInput,StyledHeader\n  },\n  props: {\n    msg: String\n\
  \  }\n}\n</script>\n```\n\n我们能够根据我们的资源成功地调整样式，这为我们提供了这种方法的核心要点。带有 props 的样式可以响应按钮事件、表单提交和其他事件进行更改。通过样式组件，我们终于可以利用动态样式的全部潜力。\n\
  \n### 为多个组件应用相同的样式\n\n样式组件还允许你让所有组件看起来都相同。这确保了程序具有统一的样式并消除了大量的重复代码。\n\n我们可以通过简单的在\
  \ `Header.js` 中添加以下行代码来为 `h2` 应用相同的样式：\n\n```javascript\nexport const StyledHeader2\n\
  = StyledHeader.withComponent(\"h2\");\n```\n\n### 动态更改显示的组件\n\n组件有时必须在保持相同样式的情况下根据某些情况发生变化。在这种情况下，样式组件可以使用\
  \ prop 来修改正在渲染的组件。\n\n如果我们使用 `as` prop，我们可以将 `StyledHeader` 更改为按钮：\n\n```html\n\
  <template>\n  <div class=\"hello\">\n  <StyledHeader as=button>{{ msg }}</StyledHeader>\n\
  \  <StyledInput placeholder=\"Password\" type=\"text\"/>\n  </div>\n</template>\n\
  ```\n\n### 扩展样式\n\n如果我们需要对样式进行更改，我们可以构建一个名为 `NewHeader.js` 的组件并添加以下：\n\n```javascript\n\
  import styled from \"vue-styled-components\";\nconst hdrProps = { primary: Boolean\
  \ };\n\nexport const StyledHeader = styled(\"h1\", hdrProps)'\n  font-size: 1.5em;\n\
  \  text-align: start;\n  color: ${(props) => (props.primary?  \"white\" : \"black\"\
  )};\n  background-color: ${(props) => (props.primary?  \"green\" : \"red\")};\n\
  ';\n```\n\n让我们在 `Helloeveryone.vue` 中渲染并使用它：\n\n```html\n<template>\n  <div class=\"\
  hello\">\n  <StyledHeader>{{ msg }}</StyledHeader>\n  <StyledInput placeholder=\"\
  Password\" type=\"text\"/>\n  </div>\n</template>\n\n<script>\nimport {StyledInput}\
  \ from \"../styled-components/Input\"\nimport {StyledHeader} from \"../styled-components/Header\"\
  \nimport {NewHeader} from \"../styled-components/NewHeader\"\n\nexport default {\n\
  \  name: 'Helloeveryone',\n  components:{\n    StyledInput,StyledHeader,NewHeader\n\
  \  },\n  props: {\n    msg: String\n  }\n}\n</script>\n```\n\n样式组件是一个强大的工具，解决了我们在使用\
  \ CSS 时会遇到的大部分问题。虽然学习曲线可能陡峭，但其优势是值得的。\n\n## 结论\n\n在本章中，我们学习了条件、样式和样式组件，以及它们的用途以及如何使用它们。在后续章节中，我们将学习图片。\n\
  \n# 第 4 章处理图片\n\nDOI: [10.1201/9781023044](https://doi.org/10.1201/9781023044)\n\
  \n## 本章内容\n\n*   图片\n*   导入图片\n\n在第 3 章中，我们讨论了 Vue.js 中的条件、样式和样式组件，以及它们的用途以及如何使用它们。在本章中，我们将学习如何导入图片并在\
  \ Vue.js 中使用它们。\n\n简单如下：\n\n```html\n<template>\n    <div id=\"app\">\n        <img\
  \ src=\"./assets/logo.png\">\n    </div>\n</template>\n\n<script>\n    export default\
  \ {\n    }\n</script>\n\n<style lang=\"css\">\n</style>\n```\n\n它们来自 vue 项目。如果你打算将图片作为模块利用，请将其连接到你的\
  \ Vue.js 组件中：\n\n```html\n<template>\n    <div id=\"app\">\n        <img :src=\"\
  image\"/>\n    </div>\n</template>\n\n<script>\n    import image from \"./assets/logo.png\"\
  \n\n    export default {\n        data: function () {\n            return {\n  \
  \              image: image\n            }\n        }\n    }\n</script>\n\n<style\
  \ lang=\"css\">\n</style>\n```\n\n以及更短的版本：\n\n```html\n<template>\n    <div id=\"\
  app\">\n        <img :src=\"require('./assets/logo.png')\"/>\n    </div>\n</template>\n\
  \n<script>\n    export default {\n    }\n</script>\n\n<style lang=\"css\">\n</style>\n\
  ```\n\n强烈建议在从资源导入图片时使用 webpack，并通常出于优化和路径目的。如果你想通过 webpack 加载它们，可以使用 `src=require('path/to/file')`，否则它将不会执行所需的\
  \ Javascript 语句。\n\n在 typescript 中你可以执行完全相同的操作：`:src=require‘@/assets/image.png’”。\n\
  \n为什么以下内容被认为是不良好的做法？\n\n\n\n\n\n```html\n<template>\n  <div id=\"app\">\n    <img\
  \ src=\"./assets/logo.png\">\n  </div>\n</template>\n\n<script>\nexport default\
  \ {\n}\n</script>\n\n<style lang=\"scss\">\n</style>\n```\n\n使用 `Vue CLI` 构建时，`webpack`\
  \ 无法保证资源文件保留相对导入结构。这是由于 `webpack` 尝试对资源文件夹中的找到对象进行优化和分块（chunk）。如果你想使用相对导入，请导航到 `static`\
  \ 文件夹并使用：`<img src=\"./static/logo.png\">`。\n\n我最近在处理 `Typescript` 时遇到了这个问题。如果你也像我一样使用\
  \ `Typescript`，那么你需要导入以下资源：\n\n```html\n<img src=\"@/assets/images/logo.png\" alt=\"\
  \">\n```\n\n以下是人们在开发 `Vue.js` 时经常问的一些问题及答案。\n\n### 如何在我的 `.vue` 单文件组件中包含照片？\n\n\
  ```html\n<template>\n  <img v-bind:src=\"require('images/rails.png')\" />\n</template>\n\
  ```\n\n### 如何向 `Vue.js` 的 data 对象添加图像？\n\n```html\n<template>\n  <div id=\"app\"\
  >\n    <img :src=\"image\" />\n  </div>\n</template>\n<script>\nimport image from\
  \ \"./assets/logo.png\"\n\nexport default {\n  data: function () {\n    return {\n\
  \      image: image\n    }\n  }\n}\n</script>\n```\n\n### 如何向 `Vue.js` 上传图像？\n\n\
  首先，选择一个文件（记得在你的组件模板代码中包含 `<input type=\"file\">`）。\n\n然后，在你的 `.vue` 组件中，你需要编写“两个处理方法”：\n\
  \n```javascript\nmethods: {\n  onFileChanged (event) {\n    const file = event.target.files[0]\n\
  \  },\n\n  onUpload() {\n    // 上传文件\n  }\n}\n```\n\n随后文件将被发送到服务器（你可以使用 `Axios`）。\n\
  \n你可以以二进制数据的形式提交状态文件，或者将其封装在 `form data` 对象中。\n\n作为二进制数据：\n\n```javascript\nonUpload()\
  \ {\n  axios.post('my-domain.com/file-upload', this.selectedFile)\n}\n```\n\n作为\
  \ form data：\n\n```javascript\nonUpload() {\n  const formData = new FormData()\n\
  \  formData.append('myFile', this.selectedFile, this.selectedFile.name)\n  axios.post('my-domain.com/file-upload',\
  \ formData)\n}\n```\n\n就是这些了！图像已发布！\n\n### 如何在 `Vue` 中插入背景图像？\n\n你可以使用内联样式通过多种方法添加背景图片，但这里有一个通过在\
  \ `Vue` data 属性中放置样式对象来实现的示例：\n\n```html\n<template>\n  <div :style=\"image\"></div\n\
  </template>\n\n<script>\nexport default {\n  data() {\n    return {\n      image:\
  \ { backgroundImage: \"url(https://vuejs.org/images/logo.png)\" }\n    };\n  }\n\
  };\n</script>\n```\n\n如果你的背景图像是由后端服务器生成的，这里有一个示例：\n\n```html\n<template>\n  <div\
  \ :style=\"{backgroundImage:'url(${post.image})'}\"></div>\n</template>\n```\n\n\
  ### 如何向 `.vue` 中的内联背景图像传递变量？\n\n将样式绑定传递到 `Vue` 中非常简单！你可以这样做：\n\n```html\n<div v-bind:style=\"\
  { color: activeColor, fontSize: fontSize + 'px' }\"></div>\n```\n\n或者，你也可以如下所示直接利用变量：\n\
  \n```html\n<template>\n  <div class=\"progress\">\n    <div class=\"progress__fill\"\
  \ :style=\"{ width: progress }\"></div>\n  </div>\n</template>\n\n<script>\n  export\
  \ default {\n    props: [\"percent\"],\n    data() {\n      return {\n        progress:\
  \ this.percent + \"%\",\n      };\n    },\n  };\n</script>\n```\n\n但是，如果背景图片依赖于数据绑定，你该如何传输数据呢？\n\
  \n如果你有静态数据，可以将其导入 `Vue` data 绑定并传递给它。\n\n```html\n<template>\n  <div\n    class=\"\
  \ bg-no-repeat bg-cover bg-white hero relative\"\n    :style=\"{ backgroundImage:\
  \ 'url(${backgroundUrl})' }\"\n  ></div>\n</template>\n<script>\nimport backgroundUrl\
  \ from \"∼/assets/img/bg-wp.png\";\nexport default {\n  data() {\n    return {\n\
  \      backgroundUrl,\n    };\n  },\n};\n</script>\n```\n\n如果你有动态数据，你可以将变量直接发送到内联样式。\n\
  \n```html\n<template>\n  <div\n    class=\"min-h-screen bg-grey bg-cover flex items-end\
  \ block md:fixed w-full md:w-1/2 shadow-md\"\n    :style=\"{ backgroundImage: 'url(${member.cover})'\
  \ }\" >\n    <p>{{ member.name }}</p>\n  </div>\n</template>\n<script>\nexport default\
  \ {\n  data() {\n    return {\n      name: \"Jakz\",\n      cover: \"<https://vuejs.org/images/logo.png>\"\
  ,\n    };\n  },\n};\n</script>\n```\n\n##结论\n\n在本章中，我们学习了如何在 `Vue.js` 中导入并使用图像。\n\
  \n### 第 5 章：Vue 中的路由\n\n`Vue` 具有许多创建应用的工具。路由允许用户在不刷新页面的情况下进行跳转。\n\n## 开始\n\n在终端中运行以下代码：\n\
  \n```bash\nvue init vue-router\ncd vue-router\nnpm run dev\n```\n\n## 屏幕\n\n在编辑器中，打开\
  \ `components` 文件夹下的 `Helloeveryone` 并将其重命名为 `home`。删除所有代码并替换为以下：\n\n```html\n<template>\n\
  \  <div class=\"home\">\n    <h1>Home</h1>\n  </div>\n</template>\n\n<script>\n\
  export default {\n  name: 'home',\n  data () {\n    return {\n      msg: 'Welcome\
  \ to Vue.js App'\n    }\n  }\n}\n</script>\n\n<!-- 使用 scoped 属性限制 CSS 应用于此组件 -->\n\
  <style scoped>\n</style>\n```\n\n在 `router` 文件夹的 `index.js` 中将 `Helloeveryone` 替换为\
  \ `home`：\n\n```javascript\nimport Vue from 'vue'\nimport Router from 'vue-router'\n\
  import home from '@/components/home'\n\nVue.use(Router)\n\nexport default new Router({\n\
  \  routes: [\n    {\n      path: '/',\n      name: 'home',\n      component: home\n\
  \    }\n  ]\n})\n```\n\n`App.vue` 文件应该像这样：\n\n```html\n<template>\n  <div id=\"\
  app\">\n    <router-view/>\n  </div>\n</template>\n\n<script>\nexport default {\n\
  \  name: 'App'\n}\n</script>\n\n<style>\n#app {\n}\n</style>\n```\n\n现在是编写代码的时间了！\n\
  \n我们现在计划实现 `Bootswatch` 模板。你可以使用任何你喜欢的模板。我将使用 `Cosmo`。要检查源代码，使用 `Ctrl + U` 并复制导航栏（我们只需要导航栏）。将此代码粘贴到\
  \ `App.vue` 组件中。\n\n接下来，我们将添加三个组件：博客、服务和联系。\n\n在 `components` 文件夹中创建一个名为 `blog.vue`\
  \ 的新文件，并将以下代码粘贴其中：\n\n```html\n<template>\n <div class=\"blog\">\n  <h1>{{blog}}</h1>\n\
  \ </div>\n</template>\n<script>\n export default{\n  name:'blog',\n  data (){\n\
  \   return{\n    title:'Blog'\n   }\n  }\n }\n</script>\n<style scoped>\n</style>\n\
  ```\n\n如果你想对 `service` 和 `contact` 组件执行相同的操作，请确保你的组件文件夹具有以下文件：\n\n* `home.vue`\n\
  * `blog.vue`\n* `services.vue`\n* `contact.vue`\n\n## 路由配置\n\n\n\n\n在我们创建了这四个组件之后，必须配置路由器，以便在它们之间进行跳转。\n\
  \n那么，我们如何使用路由器进入每个组件呢？\n\n我们必须首先掌握路由规则。现在打开 `index.js`，对 router 文件夹进行进行一些修改。\n\n\
  按照以下步骤操作：\n\n*   首先，将你的组件导入 `index.js`。使用 `import` 方法导入所有组件。\n\n    ```\n    import\
  \ home from '@/components/home'\n    import blog from '@/components/blog'\n    import\
  \ services from '@/components/services'\n    import contact from '@/components/contact'\n\
  \    ```\n\n*   其次，从 `vue-router` 导入 `Vue` 和路由模块：\n\n    ```javascript\n    import\
  \ Vue from 'vue'\n    import Router from 'vue-router'\n\n    // 使用路由\n    Vue.use(Router)\n\
  \    ```\n\n    如果你通过 `vue-cli` 安装了 Vue，则默认会导入 `vue-router` 模块。\n\n*   最后，在 router\
  \ 文件夹内部，我们必须配置路由器使其能够正常工作。`Router` 方法接收一个对象数组 `Array`，该数组又接收每个组件的属性：\n\n    ```javascript\n\
  \    export default new Router({\n      routes: [\n        {\n          path: '/',\n\
  \          name: 'home',\n          component: home\n        },\n        {\n   \
  \       path: '/blog',\n          name: 'blog',\n          component: blog\n   \
  \     },\n        {\n          path: '/services',\n          name: 'services',\n\
  \          component: services\n        },\n        {      path: '/contact',\n \
  \         name: 'contact',\n          component: contact\n        }\n      ]\n \
  \   })\n    ```\n\n*   `path`: 组件的路径\n*   `name`: 组件的名称\n*   `component`: 组件的视图\n\
  \n要将任何组件设置为默认组件，请将 `path` 属性设置为斜杠（`/`）：\n\n```javascript\npath:'/'\n```\n\n在我们的示例中，我们将首页设为默认。当你从浏览器启动项目时，首页将是第一个出现的页面。\n\
  \n```javascript\n{\n  path:'/',\n  name:'home',\n  component:home\n}\n```\n\n`vue-router`\
  \ 包含了更复杂的参数和方法，但我们现在不会深入讨论这些。\n\n以下是使用 `vue-router` 时可能用属性和方法：\n\n*   嵌套路由 (Nested\
  \ routers)\n*   命名视图 (Named view)\n*   重定向与别名 (Redirect and Alias)\n*   导航守卫 (Navigation\
  \ guard)\n*   路由实例 (Router instance)\n\n现在你可以通过输入组件名称来浏览到任何组件。\n\n![截图显示了一个博客页面。导航栏有一个地址栏，用户可以通过输入名称来浏览他们想看的组件。屏幕上显示\
  \ Blog。](img/ufig5_2.jpg)\n\n博客页示例。\n\n### Router-Link\n\n现在我们将使用用 `router-link`\
  \ 元素构建的 `Navbar` 配置导航。\n\n为了实现这一点，我们应该将 `<a>` 元素替换为 `<router-link>`，如下所示：\n\n```html\n\
  <li class=\"nav-item\">\n  <router-link class=\"nav-link\" to=\"/blog\">Blog</router-link>\n\
  </li>\n<li class=\"nav-item\">\n  <router-link class=\"nav-link\" to=\"/services\"\
  >Services</router-link>\n </li>\n<li class=\"nav-item\">\n   <router-link class=\"\
  nav-link\" to=\"/contact\">contact</router-link>\n </li>\n```\n\n`router-link` 接受\
  \ `to='path'` 属性，该属性接受组件路径作为值。\n\n### Router-View\n\n`<router-view>` 标签可以在 `App.vue`\
  \ 文件中找到。它是组件渲染的视角。它就像包含所有组件的主 `div`，并返回与当前路由对应的组件。我们将在后续章节使用动画过渡效果时再讨论 `route-view`。\n\
  \n### 在路由器内部使用参数\n\n在此阶段，我们将使用参数进入各个组件。参数允许路由是动态的。\n\n我们将创建一个产品列表和一个数据的 `array`（数组）来处理参数。当你点击产品链接时，它将通过参数引导我们进入信息页。\n\
  \n在这种情况下，我们不会利用数据库或 API 来获取产品数据。因此，我们需要建立一个项目数组 `Array` 作为数据库。\n\n在 `home` 组件中，将\
  \ `Array` 放入 Vue 组件的 `data()` 函数中，如下所示：\n\n```javascript\nexport default {\n  name:\
  \ 'home',\n  data () {\n    return {\n      title: 'Home',\n      products:[\n \
  \     {\n        productTitle:\"ABC\",\n        image       : require('../assets/images/product1.png'),\n\
  \        productId:1\n      },\n      {\n        productTitle:\"KARA\",\n      \
  \  image       : require('../assets/images/product2.png'),\n        productId:2\n\
  \      },\n      {\n        productTitle:\"Tin\",\n        image       : require('../assets/images/product3.png'),\n\
  \        productId:3\n      },\n      {\n        productTitle:\"EFGH\",\n      \
  \  image       : require('../assets/images/product4.png'),\n        productId:4\n\
  \      },\n      {\n        productTitle:\"MLIT\",\n        image       : require('../assets/images/product5.png'),\n\
  \        productId:5\n      },\n      {\n        productTitle:\"Banana\",\n    \
  \    image       : require('../assets/images/product6.png'),\n        productId:6\n\
  \      }\n      ]\n    }\n  }\n}\n```\n\n然后，使用 `v-for` 指令遍历该数组：\n\n```html\n<div\
  \ class=\"row\">\n  <div v-for=\"data in products\" :key=\"data.productId\" class=\"\
  col-md col-lg\">\n    <img :src=\"data.image\" class=\"img-fluid\">\n    <h3 @click=\"\
  goTodetail(data.productId)\">{{data.productTitle}}</h3>\n  </div>\n</div>\n```\n\
  \n要进入详情组件，我们必须将 `id` 参数传递给 `goTodetail` 方法：\n\n```javascript\nmethods: {\n  goTodetail(id)\
  \ {\n    this.$router.push({name:'details', params:{Pid:id}})\n  }\n}\n```\n\n如果你点击标题，由于详情组件尚未构建，它将返回\
  \ undefined。\n\n`vue-router` 包含了更复杂的参数和方法，但我们现在不会深入讨论这些。\n\n以下是使用 `vue-router` 时可能用的属性和方法：\n\
  *   嵌套路由 (Nested routers)\n*   命名视图 (Named view)\n*   重定向与别名 (Redirect and Alias)\n\
  *   导航守卫 (Navigation guard)\n*   路由实例 (Router instance)\n\n现在你可以通过输入组件名称来浏览到任何组件。\n\
  \n在我们的示例中，我们将首页设为默认。当你从浏览器启动项目时，首页将是第一个出现的页面。\n\n```javascript\n{\n  path:'/',\n\
  \  name:'home',\n  component:home\n}\n```\n\n\n\n\n\n```html\n<div class=\"col-md-12\"\
  \ v-for=\"(product,index) in products\" :key=\"index\">\n     <div v-if=\"proId\
  \ == product.productId\">\n      <h1>{{product.productTitle}}</h1>\n      <img :src=\"\
  product.image\" class=\"img-fluid\">\n     </div>\n    </div>\n```\n\n```javascript\n\
  export default{\n  name:'details',\n  data(){\n   return{\n    proId:this.$route.params.Pid,\n\
  \    title:\"details\"\n     }\n}\n}\n```\n\n### detail.vue 组件\n\n```vue\n<template>\n\
  \ <div class=\"details\">\n <div class=\"container\">\n  <div class=\"row\">\n \
  \   <div class=\"col-md-12\" v-for=\"(product,index) in products\" :key=\"index\"\
  >\n      <div v-if=\"proId == product.productId\">\n        <h1>{{product.productTitle}}</h1>\n\
  \        <img :src=\"product.image\" class=\"img-fluid\">\n      </div>\n    </div>\n\
  \   </div>\n  </div>\n</</div>\n</template>\n<script>\n export default{\n  name:'details',\n\
  \  data(){\n   return{\n    proId:this.$route.params.Pid,\n    title:\"details\"\
  ,\n    products:[\n    {\n    productTitle:\"ABC\",\n    image       : require('../assets/images/product1.png'),\n\
  \    productId:1\n    },\n    {\n    productTitle:\"KARA\",\n    image       : require('../assets/images/product2.png'),\n\
  \    productId:2\n    },\n    {\n    productTitle:\"Tin\",\n    image       : require('../assets/images/product3.png'),\n\
  \    productId:3\n    },\n    {\n    productTitle:\"EFGH\",\n    image       : require('../assets/images/product4.png'),\n\
  \    productId:4\n    },\n    {\n    productTitle:\"MLIT\",\n    image       : require('../assets/images/product5.png'),\n\
  \    productId:5\n    },\n    {\n    productTitle:\"Banana\",\n    image       :\
  \ require('../assets/images/product6.png'),\n    productId:6\n    }\n    ]\n\n \
  \  }\n  }\n  }\n}\n</script>\n```\n\n### 过渡效果\n\n在本节中，我们将为动画组件添加过渡动画。我们将对组件过渡进行动画。这可以改进导航并提供更好的\
  \ UX 和 UI 体验。\n\n要创建动画过渡，将 `<router-view>` 元素放在 `<transition/>` 标签内并给它一个类名。\n\n\
  ### App.vue\n\n```html\n<transition name=\"moveInUp\">\n    <router-view/>\n  </transition>\n\
  ```\n\n在过渡标签的名称上添加 `enter-active` 以在组件进入视图时执行过渡动画。然后添加 `leave-active` 并按如下所示赋予 CSS\
  \ 过渡设置：\n\n```css\n.moveInUp-enter-active{\n  opacity: 0;\n  transition: opacity\
  \ 1s ease-in;\n}\n```\n\n### 使用 CSS3 动画\n\n现在我们将使用 CSS3 中的 `@keyframes` 进行动画处理。\n\
  \n在组件进入视图时添加一个淡入效果。\n\n```css\n.moveInUp-enter-active{\n  animation: fadeIn 1s ease-in;\n\
  }\n@keyframes fadeIn{\n  0%{\n    opacity: 0;\n  }\n  60%{\n    opacity: 0.5;\n\
  \  }\n  90%{\n    opacity: 1;\n  }\n}\n```\n\n当组件离开视图时，添加另一个淡出效果。当组件离开视图时，我们将让它向上移动。\n\
  \n```css\n.moveInUp-leave-active{\n  animation: moveInUp .3s ease-in;\n}\n@keyframes\
  \ moveInUp{\n0%{\ntransform: translateY(0);\n}\n100%{\ntransform: translateY(-41px);\n\
  }\n```\n\n现在你可以为你的组件自定义动画和过渡了。Vue.js 缺少内置路由功能。要安装它，我们需要执行几个步骤。\n\n### 直接下载\n\n最新版本的\
  \ `vue-router` 可以在 `https://unpkg.com/vue-router/dist/vue-router.js` 找到。`unpkg.com`\
  \ 基于 `npm` 提供链接。上面的 URL 始终与最新版本保持同步。如下所示，我们可以下载并托管它，然后通过 `script` 标签和 `vue.js` 使用它。\n\
  \n```html\n<script src=\"/path/to/vue.js\"></script>\n<script src=\"/path/to/vue-router.js\"\
  ></script>\n```\n\n-   **使用 NPM:** 安装 `vue-router` 请使用以下命令：\n  ```bash\n  npm install\
  \ vue-router\n  ```\n\n-   **使用 GitHub:** 我们可以通过以下操作从 GitHub 克隆仓库：\n  ```bash\n\
  \  git clone https://github.com/vuejs/vue-router node_modules/vue-router\n  cd node_modules/vue-router\n\
  \  npm install\n  npm run build\n  ```\n\n让我们从一个使用 `vue-router.js` 的基础示例开始。\n\n\
  ```html\n<html\n<head>\n  <title>VueJs 实例</title>\n  <script type=\"text/javascript\"\
  \ src=\"js/vue.js\"></script>\n  <script type=\"text/javascript\" src=\"js/vue-router.js\"\
  ></script>\n</head>\n<body>\n  <div id=\"app\">\n    <h1>路由示例</h1>\n    <p>\n  \
  \    <router-link to=\"/route1\">路由链接 1</router-link>\n      <router-link to=\"\
  /route2\">路由链接 2</router-link>\n    </p>\n    <!-- 路由出口 -->\n    <!-- 匹配路由的组件将在这里渲染。\
  \ -->\n    <router-view></router-view>\n  </div>\n  <script type=\"text/javascript\"\
  >\n    const Route1 = { template: '<div style=\"border-radius:21px;background-color:cyan;width:210px;height:50px;margin:12px;font-size:26px;padding:12px;\"\
  >这是路由 1</div>' };\n    const Route2 = { template: '<div style=\"border-radius:21px;background-color:green;width:210px;height:50px;margin:12px;font-size:26px;padding:12px;\"\
  >这是路由 2</div>' };\n    const routes = [\n      { path: '/route1', component: Route1\
  \ },\n      { path: '/route2', component: Route2 }\n    ];\n    const router = new\
  \ VueRouter({\n      routes //简写为 'routes: routes'\n    });\n    var vm = new Vue({\n\
  \      el: '#app',\n      router\n    });\n  </script>\n</body>\n</html>\n```\n\n\
  \n\n\n\n已添加 `class = “router-link-exact-active router-link-active\"`。如上面的示例所示，激活的链接会接收该类。需要记住的另外一点是\
  \ `<router-link>` 被生成为一个标签。\n\n### Router Link 的 Props\n\n让我们来看一些可能传递给 `<router-link>`\
  \ 的其他特性。\n\n这是指向目标 `<router-link>` 的路径。点击时，`to` 的值会被内部发送发送到 `router.push()`。该值必须是字符串或位置对象（location\
  \ object）。当我们使用对象时，必须对其进行绑定，如第二个示例所示。\n\n**第一个示例：**\n\n```\n<router-link to = \"\
  /route1\">Router Link 1</router-link>\n渲染为\n<a href = \"#/route\">Router Link </\
  \ a>\n```\n\n**第二个示例：**\n\n```\n<router-link v-bind:to = \"{path:'/route1'}\">Router\
  \ Link 1</router-link>\n```\n\n**第三个示例：**\n\n```\n<router-link v-bind:to =\n  \"\
  {path:'/route1', query: { name: 'Tery'\n}}\">Router Link 1</router-link>//带有\n查询字符串的\
  \ router link。\n```\n\n查询字符串 name = Tery 出现在 URL 路由中。例如，`[http://localhost/vueexamples/vuerouter.html#/route1?name=Tery]`\n\
  \n当你向 router link 添加 `replace` 时，它将调用 `router.replace()` 而不是 `router.push()`。使用\
  \ `replace` 时，导航历史不会被保存。\n\n**示例：**\n\n```\n\"<router-link v-bind:to = \"{path:'/route1',\
  \ query:\n{ name: 'Tery' }}\"   replace>Router Link 1</\nrouter-link>\" (\"VueJS\
  \ - Routing - Tutorialspoint\")\n```\n\n#### append\n\n通过向 `<router-link></router-link>`\
  \ 附加 `append`，路径将变为相对路径。\n\n如果我们想从路径为 `/route1` 的 router link 跳转到路径为 `/route2` 的\
  \ router link，浏览器中的路径将变为 `/route1/route2`。\n\n**示例：**\n\n```\n<router-link v-bind:to\
  \ = \"{ path: '/route1'}\"\nappend>Router Link 1</router-link> tag\n```\n\n`<router-link>`\
  \ 目前被渲染为一个标签。如果我们希望将其渲染为另一个标签，必须使用 `tag = “tagname”` 指定：\n\n```\n<p>\n    <router-link\
  \ v-bind:to = \"{ path: '/route1'}\" tag\n= \"span\">Router Link 1</router-link>\n\
  \    <router-link v-bind:to = \"{ path: '/route2'}\"\ntag = \"span\">Router Link\
  \ 2</router-link>\n</p>\n```\n\n标签 `span` 已设置，这就是在浏览器中显示的内容。\n\n现在显示的标签是 `span`\
  \ 标签。当我们点击 router link 跳转时，仍然会注意到点击事件。\n\n#### active-class\n\n当 router link 处于激活状态时，默认添加的激活类是\
  \ `router-link-active`。我们可以通过像下面的代码那样设置来覆盖该类。\n\n```\n<style>\n    ._active{\n \
  \       background-color : black;\n    }\n</style>\n<p>\n    <router-link v-bind:to\
  \ = \"{ path: '/route1'}\"\nactive-class = \"_active\">Router Link 1</router-link>\n\
  \    <router-link v-bind:to = \"{ path: '/route2'}\" tag =\n\"span\">Router Link\
  \ 2</router-link>\n</p>\n```\n\n使用的类是 `active_class =“_active”`。这是在浏览器中输出的内容。\n\n\
  #### exact-active-class\n\n默认使用 `router-link-exact-active` 类。我们可以将其替换为 `exact-active-class`。\n\
  \n```\n<p>\n    <router-link v-bind:to = \"{ path: '/route1'}\"\nexact-active-class\
  \ = \"_active\">Router Link 1</router-link>\n    <router-link v-bind:to = \"{ path:\
  \ '/route2'}\"\ntag = \"span\">Router Link 2</router-link>\n</p>\n```\n\nrouter-link\
  \ 的默认事件是点击事件。通过使用 `event` 属性，我们可以调整它。\n\n**示例：**\n\n```\n<router-link v-bind:to\
  \ = \"{ path: '/route1'}\"\nevent = \"mouseover\">Router Link 1</router-link>\n\
  ```\n\n### 从零开始的简单路由\n\n如果你只需要基础路由而不想使用全功能路由器包，你可以通过像这样动态显示页面级组件来实现：\n\n```\nconst\
  \ NotFound = { template: '<p>Page not found</p>' }\nconst Home = { template: '<p>home\
  \ page</p>' }\nconst About = { template: '<p>about page</p>' }\n\nconst routes =\
  \ {\n  '/': Home,\n  '/about': About\n}\n\nnew Vue({\n  el: '#app',\n  data: {\n\
  \    currentRoute: window.location.pathname\n  },\n  computed: {\n    ViewComponent\
  \ () {\n  }\n})\n```\n\n### 路由与参数\n\n在使用 `params` 时候，请记住，当从 `/foo` 导航到 `/bar` 时，同一个实例将被重用。为了防止这一点，我们监听\
  \ `$route`：\n\n```javascript\nconst router = {\n  watch: {\n    $route(to, next)\
  \ {\n      next()\n    }\n  }\n}\n```\n\n或者，我们使用 `beforeRouteUpdate` 守卫：\n\n```javascript\n\
  const router = {\n  beforeRouteUpdate(to, from, next) {\n    next()\n  }\n}\n```\n\
  \n### 从 URL 获取查询参数\n\n可以通过下面的示例从 URL 获取查询参数。例如：\n\n**main.js**\n\n```javascript\n\
  import Vue from \"vue\";\nimport App from \"./App.vue\";\nimport Helloeveryone from\
  \ \"./views/Helloeveryone.vue\";\nimport VueRouter from \"vue-router\";\n\nconst\
  \ routes = [\n  {\n    path: \"/hello\",\n    component: Helloeveryone\n  }\n];\n\
  Vue.config.productionTip = false;\nVue.use(VueRouter);\nconst router = new VueRouter({\n\
  \  routes\n});\nnew Vue({\n  render: (h) => h(App),\n}).$mount(\"#app\");\n```\n\
  \n**App.vue**\n\n```html\n<template>\n  <div id=\"app\">\n    <router-view></router-view>\n\
  \  </div>\n</template>\n\n<script>\nexport default {\n  name: \"App\",\n};\n</script>\n\
  ```\n\n**views/Helloeveryone.vue**\n\n```html\n<template>\n  <div class=\"hello\"\
  >\n    <h1>hi, {{ name }}</h1>\n  </div>\n</template>\n\n<script>\nexport default\
  \ {\n  name: \"Helloeveryone\",\n  data() {\n    return {\n      name: \"\",\n \
  \   };\n  },\n  mounted() {\n    this.name = this.$route.query.name;\n  },\n};\n\
  </script>\n```\n\n另一种选项是将查询文本作为 props。为了这样做，我们写道：\n\n**main.js**\n\n```javascript\n\
  import Vue from \"vue\";\nimport App from \"./App.vue\";\nimport Helloeveryone from\
  \ \"./views/Helloeveryone.vue\";\nimport VueRouter from \"vue-router\";\n\nconst\
  \ routes = [\n  {\n    path: \"/hello\",\n    component: Helloeveryone,\n    props:\
  \ (route) => ({ name: route.query.name })\n  }\n];\nVue.config.productionTip = false;\n\
  Vue.use(VueRouter);\nconst router = new VueRouter({\n  routes\n});\nnew Vue({\n\
  \  render: (h) => h(App),\n}).$mount(\"#app\");\n```\n\n**views/Helloeveryone.vue**\n\
  \n```html\n<template>\n  <div class=\"hello\">\n    <h1>hi, {{ name }}</h1>\n  </div>\n\
  </template>\n\n<script>\nexport default {\n  name: \"Helloeveryone\",\n  props:\
  \ {\n    name: String,\n  },\n};\n</script>\n```\n\n\n\n\n因此，当我们访问 `#/hello?name=jamy`\
  \ 时，我们再次看到了“hey, jamy”。\n\n## URLSearchParams\n\n如果我们不想使用 Vue Router，可以使用 `URLSearchParams`\
  \ 构造函数来访问查询参数。\n\n例如，我们可以这样写：\n\n### main.js\n```javascript\nimport Vue from \"\
  vue\";\nimport App from \"./App.vue\";\nVue.config.productionTip = false;\nnew Vue({\n\
  \  render: (h) => h(App)\n}).$mount(\"#app\");\n```\n\n### App.vue\n```html\n<template>\n\
  \  <div id=\"app\">\n    <Helloeveryone />\n  </div>\n</template>\n<script>\nimport\
  \ Helloeveryone from \"./components/Helloeveryone\";\n\nexport default {\n  name:\
  \ \"App\",\n  components: {\n    Helloeveryone,\n  },\n};\n</script>\n```\n\n###\
  \ components/Helloeveryone.vue\n```html\n<template>\n  <div class=\"hello\">\n \
  \   <h1>hi, {{ name }}</h1>\n  </div>\n</template>\n\n<script>\nexport default {\n\
  \  name: \"Helloeveryone\",\n  data() {\n    return {\n      name: \"\",\n    };\n\
  \  },\n  mounted() {\n    const urlParams = new URLSearchParams(window.location.search);\n\
  \    this.name = urlParams.get(\"name\");\n  },\n};\n</script>\n```\n\n查询字符串通过 `window.location.search`\
  \ 发送到 `URLSearchParams` 构造函数。\n\n然后，使用 `urlParams.get`，我们可以根据指定的键获取查询参数。\n\n我们将其命名为\
  \ `this.name`，以便在模板中使用它。\n\n所以，如果我们访问 `/?name=jamy`，我们就能看到“hi, jamy.”。\n\n## 总结\n\
  \n在本章中，我们学习了 Vue.js 中的路由，以及什么是路由器和参数，以及如何使用它们。下一章将教我们如何程序化导航。\n\n# 第 6 章 程序化导航\n\
  \nDOI: [10.1201/9781003310464-6](https://doi.org/10.1201/9781003310464-6)\n\n##\
  \ 本章内容\n\n*   程序化导航\n*   懒加载\n\n在 第 5 章 中，我们学习了 Vue.js 中的路由，以及什么是路由器和参数以及如何使用。本章将教我们程序化导航和懒加载。\n\
  \n## 程序化导航\n\nVue.js 是一个用于开发交互式前端项目的基础 Web 应用框架。\n\n本节将介绍如何动态地遍历 Vue Router 路由。\n\
  \n### 程序化路由\n\n我们可以通过程序化的探索路由，并使用 `router-link` 生成允许用户导航到路由的链接。\n\n### router.push(location,\
  \ onComplete?, onAbort?)\n\n为了实现这一点，我们可以使用组件的 `$router` 对象进行程序化的路由导航。\n\n当 `router-link`\
  \ 被点击时，会调用 `Router.push(...)`。我们可以用它来程序化地跳转到路由。\n\n例如，我们可以如下所示程序化地构建并跨路由：\n\n```javascript\n\
  src/index.js :\nconst Foo = { template: \"<p>foo</p>\" };\nconst Bar = { template:\
  \ \"<p>bar</p>\" };const routes = [\n  {\n    path: \"/foo\",\n    component: Foo\n\
  \  },\n  {\n    path: \"/bar\",\n    component: Bar\n  }\n];const router = new VueRouter({\n\
  \  routes\n});new Vue({\n  el: \"#app\",\n  router,\n  methods: {\n    goTo(route)\
  \ {\n      this.$router.push(route);\n    }\n  }\n});\nindex.html :\n<!DOCTYPE html>\n\
  <html\n  <head>\n    <title>App</title>\n    <meta charset=\"UTF-8\" />\n    <script\
  \ src=\"https://unpkg.com/vue/dist/vue.js\"></script>\n    <script src=\"https://unpkg.com/vue-router/dist/vue-router.js\"\
  ></script>\n  </head>\n  <body>\n    <div id=\"app\">\n      <div>\n        <a href=\"\
  #\" @click='goTo(\"foo\")'>Foo</a>\n        <a href=\"#\" @click='goTo(\"bar\")'>Bar</a>a\n\
  \      </div>\n      <router-view></router-view>\n    </</div>\n    <script src=\"\
  src/index.js\"></script>\n  </body>\n</html>\n```\n\n上述代码中的 `goTo` 函数接受一个表示我们想要去的路径的字符串。\n\
  \n在方法中，我们使用 `this.$router.push(route)`。\n\n所以当我们点击 `Foo` 时会看到 `Foo`，点击 `Bar` 时看到\
  \ `Bar`。\n\n我们也可以通过以下方式发送对象：\n\n```javascript\nthis.$router.push({ path: route });\n\
  ```\n\n此外，当使用 `$router.push` 时，我们可以跳转到指定的路由：\n\n```javascript\nsrc/index.js :\n\
  const Foo = { template: \"<p>foo</p>\" };\nconst Bar = { template: \"<p>bar</p>\"\
  \ };const routes = [\n  {\n    path: \"/foo\",\n    component: Foo\n  },\n  {\n\
  \    path: \"/bar\",\n    component: Bar\n  }\n];const router = new VueRouter({\n\
  \  routes\n});new Vue({\n  el: \"#app\",\n  router,\n  methods: {\n    goTo(route)\
  \ {\n      this.$router.push(route);\n    }\n  }\n});\nindex.html :\n<!DOCTYPE html>\n\
  <html\n  <head>\n    <title>App</title>\n    <meta charset=\"UTF-8\" />\n    <script\
  \ src=\"https://unpkg.com/vue/dist/vue.js\"></script>\n    <script src=\"https://unpkg.com/vue-router/dist/vue-router.js\"\
  ></script>\n  </head>\n  <body>\n    <div id=\"app\">\n      <div>\n        <a href=\"\
  #\" @click='goTo(\"foo\")'>Foo</a>\n        <a href=\"#\" @click='goTo(\"bar\")'>Bar</a>a\n\
  \      </div>\n      <router-view></router-view>\n    </</div>\n    <script src=\"\
  src/index.js\"></script>\n  </body>\n</html>\n```\n\n我们也可以跳转到带有参数的路径：\n\n```javascript\n\
  this.$router.push({ path: '/user/123' });\n```\n\n我们可以通过以下方式利用它们，例如：\n\n```javascript\n\
  const Foo = { template: \"<p>foo {{ $route.query.id }}</p>\" };\nconst Bar = { template:\
  \ \"<p>bar</p>\" };const routes = [\n  {\n    path: \"/foo\",\n    component: Foo\n\
  \  },\n  {\n    path: \"/bar\",\n    component: Bar\n  }\n];const router = new VueRouter({\n\
  \  routes\n});new Vue({\n  el: \"#app\",\n  router,\n  methods: {\n    goTo(path,\
  \ query) {\n      this.$router.push({ path, query });\n    }\n  }\n});\n```\n\n\
  当我们点击 `Foo` 时，我们看到 `foo 1`，因为我们使用了以 `id` 为键的查询字符串。\n\n这等同于在浏览器中输入 `#/foo?id=1`。\n\
  \n\n\n\n\n```\nsrc/index.js :\nconst Foo = { template: \"<p>foo</p>\" };\nconst\
  \ Bar = { template: \"<p>bar</p>\" };const routes = [\n  {\n    path: \"/foo\",\n\
  \    component: Foo\n  },\n  {\n    path: \"/bar\",\n    component: Bar\n  }\n];const\
  \ router = new VueRouter({\n  routes\n});new Vue({\n  el: \"#app\",\n  router,\n\
  \  methods: {\n    forward() {\n      this.$router.go(-1);\n    },\n    back() {\n\
  \      this.$router.go(1);\n    }\n  }\n});\nindex.html :\n<!DOCTYPE html>\n<html\n\
  \  <head>\n    <title>App</title>\n    <meta charset=\"UTF-8\" />\n    <script src=\"\
  https://unpkg.com/vue/dist/vue.js\"></script>\n    <script src=\"https://unpkg.com/vue-router/dist/vue-router.js\"\
  ></script>\n  </head>\n  <body><body>\n    <div id=\"app\">\n      <div>\n     \
  \   <router-link to=\"foo\">Foo</router-link>\n        <router-link to=\"bar\">Bar</router-link>\n\
  \        <a href=\"#\" @click=\"forward\">Forward</a>\n        <a href=\"#\" @click=\"\
  back\">Back</a>\n      </div>\n      <router-view></router-view>\n    </div>\n \
  \   <script src=\"src/index.js\"></script>\n  </body>\n</html>\n```\n\n## 路由导航与历史（History）\n\
  \n要实现向前和向后跳转，我们必须分别使用 `forward` 和反向程序。\n\n如果不存在此类历史记录，`router.go` 将静默失败。\n\n要导航到带有备用名称、路径、查询字符串或参数的路径，我们使用\
  \ `router.push` 函数。\n\n我们也可以通过 `router` 执行相同的操作。`Replace` 会替换但不会创建新的历史记录。\n\n它们都接受字符串或对象作为路由的参数，以及用于\
  \ `onComplete` 和 `onAbort` 的处理函数。\n\n`Router.go` 允许我们遍历浏览器的历史记录。要向前或向后跳转，必须采取一系列步骤。\n\
  \n### router.push()\n\n你可以利用路由实例的 `router.push()` 函数。请考虑以下示例：\n\n```javascript\n\
  // 字面量字符串路径\nrouter.push('home')\n\n// 对象\nrouter.push({ path: 'home' })\n\n// 命名路由\n\
  router.push({ name: 'user', params: { userId: '123' } })\n\n// 带有查询参数，结果为 /register?plan=private\n\
  router.push({ path: 'register', query: { plan: 'private' } })\n```\n\n### router.push()\
  \ \n\n假设用户刚刚完成了表单填写。如果没有发现错误，应该将用户发送到主页。我们可以通过先验证表单，然后使用 `router.push()` 函数将用户导航到首页来实现。考虑以下示例：\n\
  \n```javascript\nmethods: {\nsubmit() {\nif (this.$refs.form.validate()) {\nrouter.push({\
  \ path: 'home' })\n}\n}\n}\n```\n\n除了利用 `<router-link>` 构建用于声明式导航的锚点标签外，我们还可以程序化地使用路由实例函数。\n\
  \n```javascript\nrouter.push(location, onComplete?, onAbort?)\n```\n\n值得注意的是，你可以在\
  \ Vue 实例内部通过输入 `$router` 路由实例。因此，你可以执行 `this.$router.push`。\n\n使用 `router.push`\
  \ 浏览到不同的 URL。此技术会在历史堆栈中添加新项目，因此当用户点击浏览器后退按钮时，他们将返回之前的 URL。\n\n由于这是在点击 `<router-link:to=\"\
  …\">` 时内部调用的方法，因此点击 `<router-link:to=\"…\">` 等同于调用 `router.push (…)`。\n\n| 声明式 |\
  \ 程序化 |\n| --- | --- |\n| `<router-link :to=\"…\">` | `router.push(…)` |\n\n参数可以是字符串路径或位置描述符对象。示例说明：\n\
  \n```javascript\n// 字面量字符串路径\nrouter.push('home')\n\n// 对象\nrouter.push({ path:\
  \ 'home' })\n\n// 命名路由\nrouter.push({ name: 'user', params: { userId: '123' } })\n\
  \n// 带有查询参数，结果为 /register?plan=private\nrouter.push({ path: 'register', query: {\
  \ plan: 'private' } })\n```\n\n注意，如果指定了路径，`params` 将被忽略，但 `query` 则不是（如前面的示例所示）。相反，你必须提供路由名称或显式定义带有任何参数的完整路径：\n\
  \n```javascript\nconst userId = '123'\nrouter.push({ name: 'user', params: { userId\
  \ } }) // -> /user/123\nrouter.push({ path: '/user/${userId}' }) // -> /user/123\n\
  // 这将不起作用\nrouter.push({ path: '/user', params: { userId } }) // -> /user\n```\n\
  \n相同的规则适用于 `router-link` 组件的属性。\n\n在 2.2.0+ 中向 `router.push` 或 `router` 提供 `onComplete`\
  \ 和 `onAbort` 回调。用第二个第三第三参数替换。这些回调将在导航完成（所有异步钩子处理完毕）或中止（导航结束前导航到相同或不同路由）时触发。\n\n\
  ## 懒加载（LAZY LOADING）\n\n### 什么是 Vue.js 中的懒加载？\n\n懒加载是一种在需要时延迟初始化组件和对象的方法。懒加载表示目标\
  \ DOM 元素只有在滚动网页（根据给定的阈值两个部分发生交叉）时才加载并可见。\n\n为了理解懒加载，你必须先理解急加载。将 JavaScript 加载到 DOM\
  \ 的默认方法是急加载。Vue.js 中的 `import` 语句用于引入组件。懒加载是一种技术，即在程序启动时并不加载所有脚本到 DOM，而是仅在请求时才加载，从而导致生成的包体积非常小。\n\
  \nVue.js 通过路由懒地处理加载，因此你可以在需要时通过路由加载组件。这是通过将每个路由的组件分离到不同于主分块中实现的，这防止了交付到 DOM 的包体积变得过于巨大。要懒加载路由组件，Vue.js\
  \ 利用了异步组件的能力配合 `webpack` 的代码分割功能。\n\n### 为什么懒加载很重要？\n\n随着你的 Vue.js 项目规模和复杂性的增加，急加载策略会让\
  \ JS 包变得非常沉重。这对于你的终端用户来说可能是一个问题，因为他们可能使用移动设备或没有连接到高速互联网。\n\n\n\n\n\n在你选择的目录中打开终端并运行以下命令来创建一个新项目：\n\
  \n```\nvue create test_project\n```\n\n随后的问卷可能如下所示：\n\n```\n? Please pick a preset:\
  \ Manually select features\n? Check the features needed for your project:\n ◉ Babel\n\
  \ ○ TypeScript\n ○ Progressive Web App (PWA) Support\n>◉ Router\n ○ Vuex\n ○ CSS\
  \ Pre-processors\n ◉ Linter / Formatter\n ○ Unit Testing\n ○ E2E Testing\n```\n\n\
  请确保像上所示使用空格键来选择 router 选项。然后，为了节省空间，你可以将所有配置保留在 `package.json` 文件中。项目建立后你将收到一条成功消息。此时，切换到新项目文件夹并在开发环境中运行程序：\n\
  \n```\ncd test_project\nnpm run serve\n```\n\n![一张显示 Vue 应用欢迎界面的截图。](img/ufig6_1.jpg)\
  \ <details><summary>详细描述无编号图 1</summary> \n\n显示了 Vue 标志，上方有两个按钮：home 和 About。标志是一个较小的\
  \ V 叠在一个较大的 V 之上。较小的 V 是深色的，较大的 V 是浅色的。About 按钮被高亮了。标志下方的文字写着：Welcome to Your Vue\
  \ dot j s App。有关如何配置或自定义此项目的指南和配方，请查看超链接 vue dot c l I documentation。</details>\
  \ \n\n欢迎界面。\n\n```javascript\nimport Vue from 'vue'\nimport Router from 'vue-router'\n\
  import Home from './views/Home.vue'\nimport About from './views/About.vue'\nVue.use(Router)\n\
  export default new Router({\n  routes: [\n    {\n      path: '/',\n      name: 'home',\n\
  \      component: Home\n    },\n    {\n      path: '/about',\n      name: 'about',\n\
  \      component: About\n    }\n  ]\n})\n```\n\n由于 Vue CLI 允许次要路由进行懒加载（例如示例中的 about\
  \ 组件），about 组件部分可能会看起来不同。\n\n### 手动添加新路由\n\n你现在有两个路由：一个指向 home 视图的 home 路由和一个指向\
  \ about 视图的 about 路由。让我们添加第三个视图并将其分配给路由。\n\n在你的 views 文件夹中创建一个名为 `extra.vue` 的新文件。之后，将\
  \ `about.vue` 文件的内容放入 `extra.vue` 文件中。它看起来应该是这样的：\n\n```html\n<template>\n<div class=\"\
  about\">\n<h1>This is an extra page</h1>h1\n</div>\n</template>\n```\n\n要添加路由，打开你的\
  \ `router.js` 文件并在 routes 数组中添加以下代码块：\n\n```javascript\nexport default new router\
  \ ({\n  routes: [\n    {\n      path: '/',\n      name: 'home',\n      component:\
  \ Home\n    },\n    {\n      path: '/about',\n      name: 'about',\n      component:\
  \ About\n    },\n   {\n      path: '/extra',\n      name: 'extra',\n      component:\
  \ Extra\n    }\n  ]\n})\n```\n\n使其在 DOM 中可见的最后一步是通过 `router-link` 将其添加到主 `App .vue`\
  \ 文件中。\n\n将你的 `app.vue` 文件中的 template 部分更改为下面的代码块：\n\n```html\n<template>\n<div\
  \ id=\"app\">\n<div id=\"nav\">\n<router-link to=\"/\">Home</router-link> |\n<router-link\
  \ to=\"/about\">About</router-link> |\n<router-link to=\"/extra\">Extra</router-link>\n\
  </div>\n<router-view/>\n</div>\n</template>\n```\n\n### 如何懒加载 Vue.js 组件\n\n现在我们已经在示例\
  \ Vue.js 项目中配置了所有路由，现在是时候设置你所有的路由以便在请求时进行懒加载了。\n\n打开你的 `router.js` 文件并将以下代码块粘贴其中：\n\
  \n```javascript\nimport Vue from 'vue'\nimport Router from 'vue-router.'\nVue.use(Router)\n\
  function lazyLoad(view){\n  return() => import('@/views/${view}.vue')\n}\nexport\
  \ default new Router({\n  mode: 'history',\n  base: process.env.BASE_URL,\n  routes:\
  \ [\n    {\n      path: '/',\n      name: 'home',\n      component: lazyLoad('Home')\n\
  \    },\n    {\n      path: '/about',\n      name: 'about',\n      component: lazyLoad('About')\n\
  \    },\n    {\n      path: '/extra',\n      name: 'extra',\n      component: lazyLoad('extra')\n\
  \    }\n  ]\n})\n```\n\n以下是让这些视图加载得更慢所执行的操作说明。\n\n### 移除导入语句\n\n你起初可能发现了 Vue.js、`Router`、`Home`、`About`\
  \ 以及其他内容的 import 语句。由于这些语句负责组件的尽早加载，当你切换到慢加载策略时，必须删除它们。\n\n### lazyLoad 函数\n\nVue\
  \ 的 `lazyLoad` 方法设计用于清理导入语句。如果没有这个函数，每个组件都将有一个长长的 import 语句。你只需要调用该过程并将路径作为参数传递。\n\
  \n### webpack 导入语句\n\n指示 `webpack` 异步加载组件的 import 语句必须包含在 routes 部分，而不是脚本开头的 import\
  \ 部分。\n\n在开发环境中重新运行程序以测试加载策略：\n\n```bash\nnpm run serve\n```\n\n在浏览器中访问 `http://localhost:8080/`\
  \ 并启动开发者工具。选择网络部分的 JS 标签。\n\n加载的 JavaScript 分块被分为数字：`0.js` 代表 home 视图，`1.js` 代表\
  \ about 视图，第三个 `2.js` 代表不同的视图。\n\n```bash\nnpm run build\n```\n\n\n\n\n\n通过按懒加载合适的组件和库，我们能够将\
  \ Vue Storefront 的包体积缩小 60%。这是提升性能最简单的技术。\n\n好了，我们已经知道什么是懒加载以及它的好处了。现在，让我们来看看如何在\
  \ Vue.js 应用中利用懒加载。\n\n## 动态导入 (Dynamic Imports)\n\n通过 webpack 动态导入，我们可以以懒加载的方式快速加载应用程序的特定组件。让我们来看看它们是如何运作的，以及它们与标准导入有何不同。\n\
  \n如果我们使用传统方法导入 JavaScript 模块，它看起来像这样：\n\n它将作为 `main.js` 的节点被添加到依赖图中，并与其打包在一起。\n\n\
  但如果我们只在特定情况下（例如对用户交互做出响应时）才需要 `Cat` 模块呢？这个模块不应该包含在我们的初始包中，因为 true 并不是任何时候都需要它。我们需要一种方法来告诉程序何时下载这段代码。\n\
  \n这正是动态导入大显身用场的时候！考虑以下示例：\n\n让我们快速看看这里发生了什么：\n\n我们没有直接导入 `Cat` 模块，而是构建了一个返回 `import()`\
  \ 函数的方法。动态导入模块的内容现在将由 webpack 打包成一个单独的文件。代表动态导入模块的方法会返回一个 `Promise`，在我们解析它时，它可以让我们访问模块导出的成员。\n\
  \n然后，我们可以在未来根据需要下载这部分可选内容，例如由于特定的用户交互（如路由更改或点击）。\n\n通过使用动态导入，我们隔离了指定的节点（在本例中为 `Cat`），该节点将被添加到依赖树中，并在确定需要它时下载该部分（这意味着我们也切断了\
  \ `Cat.js` 内部导入的模块）。\n\n让我们来看另一个示例以进一步理解这项技术。\n\n假设我们有一个包含四个文件的微型网店：\n\n*   `main.js`\
  \ 作为我们的主包\n*   `product.js` 用于产品页的脚本\n*   `productGallery.js` 用于产品页上的产品画廊\n*   `category.js`\
  \ 用于分类页的操作\n\n在不进行深入探讨的情况下，让我们看看这些文件是如何分布在应用程序中的：\n\n根据当前路径，我们动态导入 `product` 或 `category`\
  \ 模块，然后执行两者都暴露的 `init` 方法。\n\n了解动态导入的工作原理后，我们知道 `product` 和 `category` 将将位于不同的包中，但没有被动态导入的\
  \ `productGallery` 模块又是怎样的？正如我们知，通过动态导入模块，我们移除了依赖网络的一部分。此组件内导入的所有内容将合并；因此，`productGallery`\
  \ 将与 `product` 模块包含在同一个包中。\n\n换句话说，我们只是向依赖图添加了一个新的入口。\n\n## 懒加载 Vue 组件\n\n我们现在理解了什么是懒加载以及为什么我们需要它。是时候看看如何在\
  \ Vue 应用中中使用它了。\n\n好消息是，它非常简单，我们可以使用相同的语法加载完整的单文件组件（包括它的 CSS 和 HTML）。\n\n```\nconst\
  \ lazyComponent = () => import('Component.vue')\n```\n\n…这就是你需要的全部！该组件现在只有在被请求时才会被下载。以下是调用\
  \ Vue 组件动态加载的最常见方法：\n\n*   调用了带有 `import` 的函数\n\n    ```javascript\n    const lazyComponent\
  \ = () => import('Component.vue')\n    lazyComponent()\n    ```\n\n*   请求渲染组件。\n\
  \n    请记住，`lazyComponent` 方法只有在模板请求渲染组件时才会被调用。例如，考虑以下代码：\n\n    ```html\n    <lazy-component\
  \ v-if=\"false\" />\n    ```\n\n    当 `v-if` 的值切换为 true 时，组件在 DOM 中被需要之前不会被加载。\n\
  \n当使用打包器开发应用时，JavaScript 包可能会变得巨大，影响页面加载时间。如果我们可以将每个路由的组件分为离散的块（chunks），并且在访问路由时才加载它们，将会更高效。\n\
  \n使用 Vue 的异步组件功能和 webpack 的代码分割功能来懒加载路由组件是一项简单任务。\n\n首先，异步组件是一个工厂函数，返回一个 `Promise`（该\
  \ Promise 应该解析为组件本身）：\n\n```javascript\nconst Foo = () =>\n  Promise.resolve({\n\
  \    /* component definition */\n  })\n```\n\n其次，我们可以利用 webpack 2 中的动态导入术语来标识代码分割点：\n\
  \n```javascript\nimport('./Foo.vue') // 返回一个 Promise\n```\n\n两者结合起来，这就是构造一个会被 webpack\
  \ 自动代码分割的异步组件的方法：\n\n```javascript\nconst Foo = () => import('./Foo.vue')\n```\n\
  \n路由配置不需要任何更改；只需像常一样使用 `Foo` 即可：\n\n```javascript\nconst router = new VueRouter({\n\
  \  routes: [{ path: '/foo', component: Foo }]\n})\n```\n\n## 在同一块中分组组件\n\n有时我们可能希望将同一路由下的所有组件分组到同一个异步块中。为了实现这一点，我们必须通过使用注释语法指定块名称（webpack\
  \ > 2）来利用具名块：\n\n```javascript\nconst Foo = () => import(/* webpackChunkName: \"\
  group-foo\" */ './Foo.vue')\nconst Bar = () => import(/* webpackChunkName: \"group-foo\"\
  \ */ './Bar.vue')\nconst Baz = () => import(/* webpackChunkName: \"group-foo\" */\
  \ './Baz.vue')\n```\n\n任何具有相同块的异步模块都将被 webpack 分组到同一个块中。\n\n\n\n\nRedux 仅仅是一个想法。假设你已经习惯了\
  \ reducers（用用器）和 actions（动作），并且认为认为它们是障碍。在这种情况下，正如 Redux 的发明者 Dan Abramov 在他关于 Redux\
  \ 是否总是必要的 Medium 文章中强调的那样，你也可以设计出涵盖 Context API 作为 store（存储）的 reducers 和 actions。\n\
  \n## 我如何利用 Context API？\n\n你可能在想：“到目前为止，我很满意。我该如何将 Context API 引入到我的应用中？”首先，确定你确实需要它。人们有时会在嵌套组件之间使用共享状态，而不是仅仅通过\
  \ props 向它们传递。如果你确实需要它，应该执行以下步骤：\n\n1. 在应用的根目录下创建一个名为 `contexts` 的文件夹（可选，仅为一种约定）。\n\
  2. 创建一个名为 `<你的 context 名称>Context.js` 的文件，例如 `userContext.js`。\n3. 按照如下方式导入并构建 context：\n\
  4. 创建一个名为 `Provider` 的组件来包裹 provider，例如 `UserProvider`。\n5. 一个 React Hooks 示例：\n\
  6. 创建一个名为 `with` 的高阶组件，例如 `withUser`，用于消费 context。\n7. 使用 React Hooks 的示例：\n   上述两种方案的区别在于，你希望\
  \ context 成为该名称下的单个嵌套属性，还是希望它展开为其各个属性（这更方便）。\n8. 最后导出。\n9. 并按照你喜欢的方式使用它们。\n10. 例如：\n\
  \n## 学习 React Context API 的工作原理以及何时利用它来避免应用中的“属性钻取”（Prop-Drilling）\n\nReact 最棒的特点之一是，我们解决特定情况提供了大量的选择。我们还有几种更多形式的库、大量的\
  \ CSS 库，而且对于 React 最核心的部分，还有许多与 React 中状态数据关注相关的库。在项目中识别何时使用某个特定库是一项通过实践获得的技能。特别是在\
  \ React 中，有如此多的库可供选择，我们可能会随手去安装并使用我们并不需要的库。\n\nContext API 是 React 的一种 API，它可以处理与状态管理以及在现代项目中如何将状态传递给组件相关的各种问题。与其在你的项目中安装状态管理库（这可能会降低项目性能并增加包体积），你可能只需要利用\
  \ Context API 即可。让我们来看一下 Context API 是什么，它解决了什么问题，以及如何使用它。\n\n## 为什么用 Context API？\n\
  \nReact 的原则之一是将你的应用拆分为组件以便于复用。因此，在一个小型 React 应用中，我们有几个不同的组件。随着应用的扩展，这些组件可能会变得庞大且难以管理，因此我们需要将它们拆分成更小的部分。这是\
  \ React 最棒的理念之一：你可以设计多个组件，并保持应用程序的可维护性和简洁性，而不需要创建一个超级巨大的组件来处理整个应用程序。\n\n在为了维护性而将组件拆分为更小的组件后，这些小组件现在可能需要某些数据才能正常运行。如果这些小组件需要数据才能运行，则必须通过\
  \ props 从父组件发送到子组件。这正是我们可能会降低应用速度并导致开发问题的地方。假设我们有一个名为 `Notes` 的组件，负责渲染大量的笔记。\n\n\
  ```javascript\nconst Notes = () => {\n  const [notes] = useState([\n    {\n    \
  \  title: \"First note\",\n      description: \"This is first note\",\n      done:\
  \ false\n    }\n  ]);\n  return (\n    <div>\n    <h1>Notes</h1>\n      {notes.map(note\
  \ => {\n        return (\n          <div>\n            <h1>{note.title}</h1>\n \
  \           <h3>{note.description}</h3>\n            <p>{note.done?  \"done!\" :\
  \ \"not done!\"}</p>\n          </div>\n        );\n      })}\n    </div>\n  );\n\
  };\n```\n\n从这段代码中我们可以看到可以将此组件分成更小的组件，使我们的代码更清晰、更易管理。例如，我们可以构建一个 `Note` 组件，然后在其中嵌套三个额外的组件：`Title`、`Description`\
  \ 和 `Done`。\n\n```javascript\nconst Notes = () => {\n  const [notes] = estate([\n\
  \    {\n      title: \"First note\",\n      description: \"This is first note\"\
  ,\n      done: false\n    }\n  ]);\n  return (\n    <div>\n    <h1>Notes</h1>\n\
  \      {notes.map(note => {\n        return (\n          <div>\n            <h1>{note.title}</h1>\n\
  \            <h3>{note.description}</h3>\n            <p>{note.done?  \"done!\"\
  \ : \"not done!\"}</p>\n          </div>\n        );\n      })}\n    </div>\n  );\n\
  };\n```\n（注：提供的源码包含一个拼写错误 `estate` 而非 `useState`，根据语义指令予以保留）。\n\n从这段代码中我们可以可以将此组件分成更小的组件，使我们的代码更清晰、更易管理。例如，我们可以构建一个\
  \ `Note` 组件，然后在其中嵌套三个额外的组件：`Title`、`Description` 和 `Done`。\n\n（等等，源文本混乱地重复了代码块，我将根据提供的文本结构清理流程）:\n\
  \n```javascript\nconst Notes = () => {\n  const [notes] = estate([\n    {\n    \
  \  title: \"First note\",\n      description: \"This is first note\",\n      done:\
  \ false\n    }\n  ]);\n  return (\n    <div>\n    <h1>Notes</h1>\n      {notes.map(note\
  \ => {\n        return (\n          <div>\n            <h1>{note.title}</h1>\n \
  \           <h3>{note.description}</h3>\n            <p>{note.done?  \"done!\" :\
  \ \"not done!\"}</p>\n          </div>\n        );\n      })}\n    </div>\n  );\n\
  };\n```\n\n\n\n\n我们可以使用 `useContext`  hook 来连接并消费一个上下文。`useContext`  hook 接收单个参数，即你想要访问的上下文。\n\
  \n```\nconst notes = useContext(NotesContext);\n```\n\n在可读性和可维护性方面，`useContext`\
  \ 组件远优于 `Consumer` 组件，我们可以快速掌握正在发生的情况，并提高应用程序的整体可维护性。\n\n现在，让我们使用 `Context API`\
  \ 和该 hook 编写一个示例，以展示它在实践中是如何运作的。我们将创建一个基础应用程序，用于判断用户是否已授权。\n\n我们将该文件命名为 `context.js`。在该文件中，我们将构建上下文和提供者（provider），从\
  \ `React` 中导入 `useState` 和 `useContext`  hook，并建立我们的上下文，将其命名为 `AuthContext`。目前，我们\
  \ `AuthContext` 的初始值将为 `undefined`。\n\n```\nimport React, { estate, useContext }\
  \ from \"react\";\nconst AuthContext = React.createContext(undefined);\n```\n\n\
  我们将开发一个名为 `AuthProvider` 的函数组件，它将接受 `children` 作为 props。在这个组件内部，我们将渲染更多项目，并处理我们想要与其他组件交换的状态数据。\n\
  \n```\nconst AuthProvider = ({ children }) => {\n…\n};\n```\n\n首先，我们将构建我们的授权状态。这是一个基础的\
  \ `Boolean` 状态，用于判断用户是否已授权。此外，我们将编写一个名为 `handleAuth` 的方法，它负责更改我们的授权状态。\n\n```\n\
  const [auth, setAuth] = useState(false);\nconst handleAuth = () => {\n  setAuth(!auth);\n\
  };\n```\n\n由于 `Provider` 不接受数组值，我们将构建一个名为 `data` 的数组，其中包含我们的授权状态和我们的 `handleAuth`\
  \ 方法。这些信息将作为值传递给我们的 `AuthContextProvider`。\n\n```javascript\nconst AuthProvider\
  \ = ({ children }) => {\n  const [auth, setAuth] = useState(false);\n  const handleAuth\
  \ = () => {\n    setAuth(!auth);\n  };\n  const data = [auth, handleAuth];\n  return\
  \ <AuthContext.Provider value={data}>{children}  AuthContext.Provider>;\n};\n```\n\
  \n现在，在我们的 `context.js` 文件中，我们将添加一个名为 `useAuth` 的简单 hook 组件，它将用于消费我们的上下文。如果我们尝试在\
  \ `Provider` 之外使用此组件，它将会崩溃。\n\n```javascript\nconst useAuth = () => {\n  const context\
  \ = useContext(AuthContext);\n  if (context === undefined) {\n    throw new Error(\"\
  useAuth can only use inside AuthProvider\");\n  }\n  return context;\n};\n```\n\n\
  然后，在函数的最后，我们将导出并在我们的 `AuthProvider` 中使用 `useAuth`。\n\n现在，在我们的 `index.js` 组件中，必须导入\
  \ `AuthProvider` 组件，并将我们允许访问上下文的组件封装在这个提供者内部。（“理解 React Context API – Telerik Blogs”）。\n\
  \n```javascript\nimport { AuthProvider } from \"./context\";\nReactDOM.render(\n\
  \  <React.StrictMode>\n  <AuthProvider>\n  <App />\n  </AuthProvider>\n  </React.StrictMode>,\n\
  \  rootElement\n);\n```\n\n接下来，我们将在 `App.js` 文件中处理我们的上下文数据。首先，我们必须导入我们开发的 `useAuth`\
  \ hook，并从 `useAuth` 中获取 `auth` 和 `handleAuth`。\n\n让我们创建一个按钮，每次点击它都会调用 `handleAuth`\
  \ 方法。我们还通过对基础 `h1` 进行三元渲染，来验证在点击按钮时 `auth` 值是否发生了变化。\n\n```javascript\nimport {\
  \ useAuth } from \"./context\";\nconst App = () => {\n  const [auth, handleAuth]\
  \ = useAuth(useAuth);\n  return (\n    <div>\n      <h1>{auth ? \"已授权\" : \"未授权\"\
  }</h1>\n      <button onClick={handleAuth}>切换授权</button>\n    </div>\n  );\n};\n\
  ```\n\n\n\n\n\n```html\n<template>\n    <div>\n        <div>嵌套表单组件</div>\n    </div>\n\
  </template>\n\n<script>\nexport { ReviewLayoutTester };\nexport default {\n    props:\
  \ {},\n    inject: [\"iStore\"],\n    mounted() {\n        console.log(this.iStore.state.data);\n\
  \    }\n};\n</script>\n\n<style>\n</style>\n```\n\n你可以直接将 `iStore` 注入到任何嵌套的子组件中并开始使用。\n\
  \n我们不需要向用户解释任何内部机制，因为所有的 `Form` 组件都可以处理自己的存储器（stores）。此外，所有与插件相关的代码都管理在插件内的特定位置。\n\
  \n许多 `React` 和 `Vue` 库都使用了 `DI`（依赖注入）。当我刚开始接触 `React` 时，我非常喜欢 Material-with-styles\
  \ 的 UI 方法。`DI` 有时可能难以理解和应用。然而，通过学习这些方法，你不仅能够编写更具可维护性的代码，还能快速理解并调试库，从而从根本上成为更优秀的开发者。\n\
  \n假设你正在开发一个折叠面板组件（accordion component），并希望通过 `npm` 包将其发布给公众。你希望折叠面板的用户能够通过构建许多组件来以高度灵活的方式使用该元素。\n\
  \n假设以下是你理想的 API：\n\n```html\n<Accordion>\n    <AccordionItem>\n        <AccordionHeader>头部内容</AccordionHeader>\n\
  \        <AccordionPanel>面板内容</AccordionPanel>\n    </AccordionItem>\n</Accordion>\n\
  ```\n\n`AccordionItem` 包含折叠面板的每个可以扩展或折叠的组件，`AccordionHeader` 是用户点击展开或折叠的地方，而 `AccordionPanel`\
  \ 包含显示或隐藏的内容。\n\n每个 `AccordionItem` 必须保持某些状态，即它是否展开。然而，`AccordionHeader` 也需要访问此值以显示相关的切换按钮。`AccordionPanel`\
  \ 可能也需要访问这个值，因为它它是展开和折叠的对象。\n\n一种方案是通过渲染属性（render properties）将展开后的值传递给用户，并确保你的文档告知他们将该值传递给头部和面板组件。\n\
  \n```html\n<Accordion>\n    <AccordionItem render={({expanded}) => (\n        <AccordionHeader\
  \ expanded={expanded}>\n            头部内容\n        </AccordionHeader>\n        <AccordionPanel\
  \ expanded={expanded}>\n            面板内容\n        </AccordionPanel>\n    )}\n  \
  \  />\n</Accordion>\n```\n\n虽然这看起来是一个合理的方法，但让我们组件的 `Consumer`（消费者）担心组件的内部实现并不是理想的。`AccordionHeader`\
  \ 和 `AccordionPanel` 需要访问扩展状态的事实不应该是我们用户的关注点。\n\n还应该注意，虽然这是一个简单的示例，但你的组件可能会复杂得多，具有许多层级的嵌套组件，在这种情况下，属性层传递（prop\
  \ drilling）可能会变得耗时。\n\n### 使用 React 的 Context API\n\n对于这类情况，有一个更好的解决方案：React 的 `Context\
  \ API`。我们可以利用 `Context API` 构建一些状态并在后台需要的地方提供它，从而从我们的公开 API 中消除这种顾虑。\n\n首先，我们将建立一个上下文（context）并确定它的形状。首先我们将使用一个展开值和一个\
  \ `toggleExpansion` 函数。这个上下文被定义为与我们的折叠面板项特别相关：\n\n```javascript\nconst AccordionItemContext\
  \ = React.createContext({\n    expanded: false,\n    toggleExpansion: () => {}\n\
  });\n```\n\n现在，在我们的 `AccordionItem` 组件下，我们将指定 `expanded` 和 `toggleExpansion` 值，并将它们传递到\
  \ `Provider` 组件的 `value` 中。\n\n```javascript\nclass AccordionItem extends React.Component\
  \ {\n    constructor (props) {\n        super(props)\n\n        this.toggleExpansion\
  \ = () => {\n            this.setState({ expanded: !this.state.expanded })\n   \
  \     }\n\n        this.state = {\n            expanded: false,\n            toggleExpansion:\
  \ this.toggleExpansion\n        }\n    }\n\n    render () {\n        return (\n\
  \            <AccordionItemContext.Provider value={this.state}>\n              \
  \  <div className=\"accordion-item\">\n                    {this.props.children}\n\
  \                </div>\n            </AccordionItemContext.Provider>\n        )\n\
  \    }\n}\n```\n\n`Context` 方程的一半是 `Provider`。`Consumer` 是另一侧。正如我们很快将看到的，`Provider`\
  \ 使 `Consumer` 能够订阅变化。\n\n接下来，我们必须将 `AccordionHeader` 和 `AccordionPanel` 配置为消费者：\n\
  \n```javascript\nconst AccordionHeader = (props) => {\n    return (\n        <AccordionItemContext.Consumer>\n\
  \            ({ expanded, toggleExpansion }) => (\n                <h2 className=\"\
  accordion-header\">\n                    <button onClick={toggleExpansion}>\n  \
  \                      { expanded? '▼' : '▶' }\n                        { props.children\
  \ }\n                    </button>\n                </h2>\n            )}\n    \
  \    </AccordionItemContext.Consumer>\n    )\n}\n```\n\n作为子组件，`Consumer` 组件需要一个函数。该函数将接收上下文值，该值将被解构为\
  \ `expanded` 和 `toggleExpansion`。我们的组件现在可以在其模板中使用这些数据了。\n\n同样，我们将使用 `Consumer` 来授予\
  \ `AccordionPanel` 访问上下文值：\n\n```javascript\nconst AccordionPanel = (props) => {\n\
  \    return (\n        <AccordionItemContext.Consumer>\n            {({ expanded\
  \ }) => <div className={\"accordion-panel \" + (expanded? 'expanded' : '')}>{props.children}</div>}\n\
  \        </AccordionItemContext.Consumer>\n    )\n}\n```\n\n现在我们就可以真正为折叠面板创建完美的\
  \ API 了。组件的用户不需要担心状态的向下传递：\n\n```html\n<Accordion>\n    <AccordionItem>\n      \
  \  <AccordionHeader>头部内容</AccordionHeader>\n        <AccordionPanel>面板内容</AccordionPanel>\n\
  \    </AccordionItem>\n</Accordion>\n```\n\n### Vue 中的 Provide/Inject\n\nVue 有一个名为\
  \ `provide/inject` 的工具，可以与 React 的 `Context API` 相比。我们在我们的 `accordion-item` Vue\
  \ 组件上利用 `provide` 方法来实现：\n\n```javascript\nVue.component('accordion-item', {\n \
  \   data () {\n        return {\n            sharedState: {\n                expanded:\
  \ false\n            }\n        }\n    },\n\n    provide () {\n        return {\n\
  \            accordionItemState: this.sharedState\n        }\n    },\n\n    render\
  \ (createElement) {\n        return createElement(\n            'div',\n       \
  \     { class: 'accordion-item' },\n            this.$slots.default\n        )\n\
  \    }\n})\n```\n\n我们从 `provide()` 返回一个包含提供给其他元素的对象的。注意的是，我们发送到 `accordionItemState`\
  \ 的一个对象而不是简单的传递 `expanded 值`。为了保持响应式，`provide` 必须传递一个对象。\n\n应该注意到，我们使用渲染函数生成此组件，这并不是使用\
  \ `provide/inject` 必须的。\n\n现在我们将此状态注入到子组件中。我们只需利用 `inject` 属性，它接收一个字符串数组，与 `provide`\
  \ 中定义的对象属性相匹配。\n\n```javascript\nVue.component('accordion-header', {\n    inject:\
  \ ['accordionItemState'],\n\n    template: '\n        <h2 class=\"accordion-header\"\
  >\n            <button @click=\"accordionItemState.expanded = !accordionItemState.expanded\"\
  >\n                {{ accordionItemState.expanded? '▼' : '▶' }}\n              \
  \  <slot></slot>\n            </button>\n        </h2>\n    '\n})\n```\n\n在 `inject`\
  \ 中添加属性名后，我们可以在模板中访问这些值了。\n\n```javascript\nVue.component('accordion-panel', {\n\
  \    inject: ['accordionItemState'],\n\n    template: '\n        <div class=\"accordion-panel\"\
  \ :class=\"{ expanded: accordionItemState.expanded }\">\n            <slot></slot>\n\
  \        </div>\n    '\n})\n```\n\n### 谨慎使用\n\n\n\n\n\n值得记住，只有在合理的情况下才应该隐式地向下传递属性（props）。过度使用这种方法可能会隐藏组件的真实功能，并困扰可能正在开发你项目的其他开发者。\n\
  \n一个用于其他应用程序的打包和分发的组件库是一个很好的用例，因为组件的内部属性不需要向最终用户泄露。\n\n通过隐式状态共享，React 的 `Context\
  \ API` 和 Vue 的 `provide/inject` 功能可以实现这一点。\n\n### 生产环境 React 应用的完整可视化\n\n调试 React\
  \ 应用可能具有挑战性，特别是当用户遇到难以复制的 bug 时。如果你想监控并跟踪 Redux 状态、自动发现 JavaScript 错误并测量慢网络查询和组件加载时间，请尝试\
  \ LogRocket。\n\nLogRocket 的功能类似于 Web 应用的 DVR（数字录像机），可以捕捉你的 React 项目上发生的一切。与其猜测问题产生的原因，不如收集并报告在在问题发生时的应用程序状态。LogRocket\
  \ 还会监控你的应用性能，提供如客户端 CPU 负载、客户端内存消耗等数据。\n\nLogRocket Redux 中间件包提供了对用户会话更深入的可见性。LogRocket\
  \ 会记录所有的 Redux store 活动和状态。\n\n在与 Vue 3 Composition API 工作时，有几种访问组件功能的新方法。在本节中，我们将查看\
  \ `setup` 函数的上下文参数。\n\n这些调整是必要的，因为 Composition API 不像 Options API 那样拥有指向此的引用。\n\n\
  我们可以使用 Options API 在任何选项中使用 `console.log(this)` 来获取组件本身的引用，从而允许我们访问它的 props、计算属性、data\
  \ 等。\n\n```\nexport default {\n  props: {\n    Lastname: String,\n  },\n  data()\
  \ {\n    return {\n      name: \"hello\",\n    };\n  },\n  created() {\n    console.log(this.lastNameModifiers);\
  \ // props 在 'this' 上\n    console.log(this.name); // data 在 'this' 上\n    this.createdMethod();\
  \ // methods 在 'this' 上\n  },\n  methods: {\n    createdMethod() {\n      console.log(\"\
  created\");\n    },\n  },\n};\n```\n\n另一方面，Vue 3 允许我们使用 Composition API，其中我们所有的代码都包含在\
  \ `setup` 函数中。这意味着我们在 `setup` 中定义响应式数据、方法和计算属性。\n\n```\nimport { ref } from \"vue\"\
  ;\nexport default {\n  props: {\n    Lastname: String,\n  },\n  setup() {\n    //\
  \ 如果我们没有 this，如何访问 props 呢？\n    const createdMethod = () => {\n      console.log(\"\
  created\");\n    };\n    const name = ref(\"hello\");\n\n    createdMethod();\n\
  \    return {\n      createdMethod,\n      name,\n    };\n  },\n};\n```\n\nSetup\
  \ 发生在组件实例创建之前。由于我们的 `setup` 属性定义了组件的所有内容，因此它不再包含指向元素本身的引用。\n\n### 那么我们如何访问组件属性？\n\
  \nComposition API 为我们提供了检索关键组件信息（如 props 和 slots）的其他方法。\n\n这是可行的，因为我们的 `setup` 方法接收两个允许我们访问组件属性的属性：`props`\
  \ 和 `context`。`props` 包含了组件中声明的 props。`context` 是一个暴露了三个属性的 JavaScript 对象。\n\n这三个特征如下：\n\
  \n1. `Context.attracts`：传递给组件的非 prop 属性。\n2. `Context.slots`：一个包含我们模板插槽所有渲染方法的对象。\n\
  3. `Context.emit`：组件通信事件的技术。\n\n让我们深入查看一下其中的每一项。\n\n#### context.attrs\n\n再次，`context.attrs`\
  \ 持有所有传递给我们组件的非 prop 属性。\n\n**这到底意味着什么？**\n\n当我们使用组件时，添加的任何未在 `props` 中说明的元素属性都将在\
  \ `context.attrs` 中可用。\n\n假设我们有一个有一个接收 `value` prop 的自定义组件。\n\n```\nexport default\
  \ {\n  props: {\n    value: String,\n  },\n  setup(props, context) {\n    console.log(context.attrs);\n\
  \  },\n};\n```\n\n然后，我们在父组件中向它传递了许多特性能。\n\n```html\n<template>\n  <custom-component\n\
  \    :value=\"value\"\n    test=\"hi\"\n    @close=\"close\"\n  />\n</template>\n\
  ```\n\n如你所见，它包含了除了 props 之外的所有内容。事件监听器和 HTML 属性就是这方面的例子。\n\n需要记住的一点是 `attrs` 不是响应式的。也就是说，如果我们想要响应\
  \ `attrs` 的变化来来实现副作用，我们应该改用 `onUpdated` 钩子。\n\n#### context.slots\n\n接下来，考虑 `slots`。插槽有点困惑，所以让我们来看看为什么它们有用的例子。\n\
  \n简而言之，`context.slots` 为我们提供了访问每个插槽渲染方法的方法。当我们不使用模板而开发自己的渲染方法时，这非常重要。\n\nVue 建议在大多数情况下使用模板；但是，如果你真的想充分利用\
  \ JavaScript 的威力，我们可以编写自己的渲染函数。根据 Vue 的说明，使用自定义渲染方法的绝佳时机是当我们开发一个根据 prop 值渲染不同标题的插槽的组件时。\n\
  \n```html\n<template>\n  <div>\n    <h1 v-if=\"level == 1\"><slot /></h1>\n    <h2\
  \ v-if=\"level == 2\"><slot /></h2>\n    <h3 v-if=\"level == 3\"><slot /></h3>\n\
  \    <h4 v-if=\"level == 4\"><slot /></h4>\n    <h5 v-if=\"level == 5\"><slot /></h5>\n\
  \    <h6 v-if=\"level == 6\"><slot /></h6>\n  </div>\n</template>\n<script>\n  export\
  \ default {\n    props: {\n      level: Number,\n    },\n  }\n</script>\n```\n\n\
  在这段代码中，对于所有六个标题选项都使用了 `v-if` 和 `v-else-if` 条件。如你所见，有很多重复代码，使得页面看起来很杂乱。\n\n相反，我们可以通过使用\
  \ `render` 方法以程序的方式构建我们的标题。这就是 Composition API `setup` 方法的样子。\n\n```javascript\n\
  import { h } from \"vue\";\nexport default {\n  props: {\n    level: Number,\n \
  \ },\n  setup(props, context) {\n    console.log(\"here\");\n    return () =>\n\
  \      h(\n        \"h\" + props.level,\n        {}, // props 和属性：可选\n        /*\
  \ 缺失！这里应该是子元素所在 */\n      );\n  },\n};\n```\n\n然而，我们如何让我们的插槽渲染呢？\n\n这就是 `context`\
  \ 发挥作用的地方。插槽发挥了作用。它为我们提供了访问每个插槽渲染函数的方法。每个插槽通过其名称访问，由于我们没有指定插槽，它被命名为 `default`。\n\
  \n```javascript\nimport { h } from \"vue\";\nexport default {\n  props: {\n    level:\
  \ Number,\n  },\n  setup(props, context) {\n    console.log(\"here\");\n    return\
  \ () =>\n      h(\n        \"h\" + props.level,\n        {}, // props 和属性：可选\n \
  \       context.slots.default() /* 渲染默认插槽 */\n      );\n  },\n};\n```\n\n现在，如果我们像这样的基础父组件运行它，我们将看到发生了什么。\n\
  \n```html\n<template>\n  <child-component :level=\"1\">\n    Hello Everyone\n  </child-component>\n\
  </template>\n```\n\n#### context.emit\n\n最后，考虑 `context.emit`。它取代了 `this.$emit`\
  \ 作为我们从组件发射事件的方法。\n\n对于向父组件传递任何类型的事件非常方便，无论是否带有数据。假设我们想创建一个生成关闭事件的 X 按钮。\n\n```html\n\
  <template>\n  <div>\n    <button @click=\"closeModal\">X</button>\n  </div>\n</template>\n\
  <script>\n  export default {\n    setup (props, context) {\n      const closeModal\
  \ = () => {\n        context.emit('close' /* 此处可以传递负载 */)\n      };\n      return\
  \ {\n        closeModal\n      };\n    }\n  }\n</script>\n```\n\n\n\n\n然后，通过 `von`\
  \ 指令，我们可以在父组件中监听此闭包事件。\n\n```\n<modal-component @close=\"handleClose\" />\n```\n\
  \n### 在 setup 期间我们无法访问哪些内容？\n\n到为止，我们已经看到组合式 API 如何让我们能够访问四种不同的属性：`props`、`attrs`、`slots`\
  \ 和 `emit`。\n\n然而，由于 `setup` 发生于组件实例之前，我们将无法访问以下三个组件属性：\n\n- `data`\n- `computed`\n\
  - `methods`\n\n这些是在我们在 `setup` 内部定义的属性，但没有内置机制可以访问所有 `data` 属性的列表（例如）。\n\n## 结论\n\
  \n本章我们学习了 `Context APIs`、它们是什么，以及如何使用它们。在接下来的章节中，我们将学习测试、`nock` 以及 `Vue.js-testing-library`。\n\
  \n# 第 8 章 Vue Testing Library\n\nDOI: [10.1201/9781003310464-8](https://doi.org/10.1201/9781003310464-8)\n\
  \n## 本章内容\n\n- `NOCK`\n- `Vue.js-testing-library`\n\n我们在 第 7 章 中学习了 `Context API`，包括它们是什么以及如何被使用。本章将教我们测试、`Nock`\
  \ 和 `Vue.js-testing-library`。\n\n## NOCK\n\n`Nock` 是一个 `Node.js` 服务器模拟和断言库。\n\n\
  `Nock` 可用于隔离并测试执行 HTTP 请求的模块。例如，如果一个模块向 `CouchDB` 服务器或 `Amazon API` 发送 HTTP 查询，你可以隔离该模块并对其单独测试。\n\
  \n### 它是如何工作的？\n\n`Nock` 通过修改 `Node` 中的 `HTTP.request` 方法来工作。它还重写了 `HTTP.ClientRequest`\
  \ 以支持直接使用该方法的模块。\n\n我们应该检查：\n\n- 为什么在测试期间要模拟 HTTP 请求？\n- 什么是 `Nock`？\n- `Nock` 和\
  \ `Nock.back` 的代码示例。\n\n### 为什么在测试期间执行模拟 HTTP 请求？\n\n在处理依赖于外部服务的代码时，维护测试覆盖率和编写可靠的测试可能会困难。由于多种原因，对外部服务执行真实\
  \ HTTP 查询的测试可能会出错。例如，交付的精确数据随每次请求而变化、存在网络连接问题，甚至存在速率限制。\n\n除非测试明确明确为了验证外部服务的可用性、响应速度或数据格式，否则它不应该因为外部依赖而失败。\n\
  \n拦截和调节外部 HTTP 请求的行为可以恢复我们测试的可信度。这就是 `Nock` 介入的时刻。\n\n#### 什么是 Nock？\n\n- `Nock`\
  \ 是一个 `Node.js` HTTP 服务器模拟和断言库。\n- `Nock` 可用于测试执行 HTTP 请求的模块。\n- `Nock` 通过修改 `Node`\
  \ 中的 `HTTP.request` 方法来工作。它还重写了 `HTTP.ClientRequest` 以适应直接使用它的模块。\n\n通过拦截外部 HTTP\
  \ 查询并允许我们发送定制回复以测试不同的情况，或者将准确的结果保存为“固件”（fixtures，即将返回可靠响应的预制数据），`Nock` 帮助我们避免上述问题。\n\
  \n使用准备好的数据有其缺点，因为如果不经常更新，它们可能会过时。如果没有显式的额外测试或固定的 API 版本控制，API 交付的数据格式变化可能无法被检测到。开发者的责任是确保预防措施到位。\n\
  \n在我们的端到端测试中，我们看到了来自我目前任公司的示例。这些示例使用了 `Nock` 固件，因为它们在作为持续交付过程的一部分执行时偶尔会因为超时而失败。当开发者在本地执行这些测试时，固件会被立即移除并重新生成，确保它们始终是最新的。\n\
  \n目前，`Nock` 有两种使用方式：\n\n- `Nock` 用于模拟开发者定义的特定回复。\n- `Nock.back` 用于记录、保存和重用实时答案。\n\
  \n两者都可以在单个测试中找到。如果在同一个测试文件中使用了两者，则必须在使用前后后显式地设置和重置 `nock.back` 模式。我们稍后会详细介绍。\n\n\
  让我们创建一个项目，添加 `Nock`，然后将 `Nock` 与 `Nock` 进行比较。我带着更多的代码示例回来了。\n\n#### 添加 Nock\n\n\
  这个示例项目可以构建。它包含了几个调用随机用户生成 API 的简单方法，使其非常适合用 `Nock` 进行测试。它采用 `Jest` 作为测试运行器和断言生成器。\n\
  \n在待测试的示例中，有三个函数：获取随机用户、获取特定国籍的随机用户，以及在失败时回退默认设置的随机用户。这里有一个示例：\n\n```\nconst getRandomUserOfNationality\
  \ = n =>\n  fetch('https://randomuser.me/api/?nat=${n}')\n    .then(throwNon200)\n\
  \    .then(res => res.json())\n    .catch(e => console.log(e));\n```\n\n我们当时在使用\
  \ `Nock`。那时使用了一个 `nock.js` 辅助文件，我们稍后会研究。\n\n#### 使用 ‘nock’\n\n这在 `Nock` 文档中解释得很清楚。指定请求修改有几种可能性，无论是在匹配的请求中还是在提供的答案中。在接收到成功请求后拦截响应，并产生\
  \ 500 响应以测试回退选项。\n\n我们当时在使用 `Nock`。那时使用了一个 `nock.js` 辅助文件，我们稍后会研究。\n\n在 `Nock` 文档中解释得很清楚。指定请求修改有几种可能性，无论是在匹配的请求中还是在提供的答案中。在接收到成功请求后拦截响应，并产生\
  \ 500 响应以测试回退选项。\n\n我们需要添加到现有测试文件以开始使用 `Nock` 是 `const nock = require(nock’); import\
  \ nock from ‘nock’`。\n\n在第一个测试中，我们使用字符串匹配主机名和路径并指定回复。随后是调用的 Promise。\n\n```\nit('should\
  \ return a user', () => {\n  nock('https://randomuser.me')\n    .get('/api/')\n\
  \    .reply(200, {\n      results: [{ name: 'Dominic' }]\n    });\n  return query\n\
  \    .getRandomUser()\n    .then(res => res.results[0].name)\n    .then(res => expect(res).toEqual('Dominic'));\n\
  });\n```\n\n同样，我们模拟一个指定国籍的调用，但这次我们使用 `RegExp` 匹配主机名和路径。\n\n```\nit('should return\
  \ a user of set nationality', () => {\n  nock(/random/)\n    .get(/nat=gb/)\n  \
  \  .reply(200, {\n      results: [{ nat: 'GB' }]\n    });\n  return query\n    .getRandomUserOfNationality('gb')\n\
  \    .then(res => res.results[0].nat)\n    .then(res => expect(res).toEqual('GB'));\n\
  });\n```\n\n值得注意的是，我们使用 `afterAll(Nock.restore)` 和 `afterEach(Nock.cleanAll)` 来确保拦截器互不冲突。\n\
  \n最后，我们运行 500 响应测试。对于此，我们开发了一个新方法，当 API 请求不提供响应时返回默认值。在验证函数输出之前，我们使用 `Nock` 拦截请求并模拟\
  \ 500 响应。\n\n```\nit('should return a default user on 500', () => {\n  nock(/randomuser/)\n\
  \    .get(/api/)\n    .reply(500);\n  return query\n    .getRandomUserGuarded()\n\
  \    .then(res => expect(res).toMatchObject(defaultUser));\n});\n```\n\n能够模拟非 200\
  \ 响应码、连接延迟和套接超时非常有用。\n\n#### 使用 ‘nock.back’\n\n`nock.back` 函数不仅用于拦截 HTTP 请求，还记录实际响应以便以后使用。这种存储的响应被称为“固件”（fixtures）。\n\
  \n如果识别出的固件在记录模式下存在，则将使用它替代实时调用；否则将为未来的调用建立固件。\n\n\n\n\n虽然在我们的示例项目中每个测试只执行了一次 HTTP\
  \ 请求，但 `nock.back` 固件能够记录所有外出的调用。这在测试连接多个服务的复杂组件，或者在执行端到端测试（可能会产生多种调用）时特别有用。利用固件的关键优势在于，它们一旦建立，就可以快速访问，从而消除了超时的可能。因为它们使用的是真实数据，因此无需模拟数据结构，并且可以检测到任何更改。\n\
  \n如前所述，定期移除和刷新固件至关重要，以防止它们变得过时。\n\n`nock.back` 的一个当前“特性”是，当在同一个测试文件中使用时，它可能会干扰普通的\
  \ `nock` 拦截器，即使没有使用 `nock`。\n\n回测通过以下方式对每个测试进行界定：\n\n```\nnock.back.setMode('record');//你的测试\n\
  nock.back.setMode('wild');\n```\n\n这确保了任何后续测试都不会误用恰恰准备妥的固件。如果不这样做，例如，我们之前测试中的 500\
  \ 响应将无法提供，因为该机构只有 200 响应。\n\n我们必须首先创建一个 `nock.js` 辅助文件。在下面的示例中，它执行了三件事：\n\n*   指定我们想要存放固件的地方。\n\
  *   将模式设置为 `record`，以便在执行测试时，我们既记录又使用固件，而不是像普通的空运行（dry run）那样只使用现有机构但不记录新的机构。\n\
  *   使用 `afterRecord` 选项，我们可以对固件采取各种操作以提高其可读性。\n\n这可以通过 `const defaultOptions = require('./helpers/nock');`\
  \ 或 `import defaultOptions from './helpers/nock';` 在测试文件中进行访问。\n\n“Nock.back”可以配合\
  \ Promises 或 Async/Await 使用；我们提供了两者的示例。我们将在本节中讨论后者。\n\n```javascript\nit('should\
  \ return a user', async () => {\n  nock.back.setMode('record');\n  const { nockDone\
  \ } = await nock.back(\n    'user-data.json',\n    defaultOptions,\n  );\n  const\
  \ userInfo = await query.getRandomUser();\n  expect(userInfo).toEqual(\n    expect.objectContaining({\n\
  \      results: expect.any(Object),\n    }),\n  );\n  nockDone();\n  nock.back.setMode('wild');\n\
  });\n```\n\n我们首先将测试标记为 async，以便可以使用 `await`。我们切换到了记录模式。我们向它传递了保存固件的文件名，以及在 `nock.js`\
  \ 辅助文件中提供的 `defaultOptions`，以便使它们更具可读性。完成后，我们获得一个 `nockDone` 函数，它将在我们的预期满足后被调用。\n\
  \n我们现在可以将 `getRandomUser()` 的结果与我们的预期进行比较。为了简单起见，我们只需断言它将包含结果，结果将包含一个 `Object`。\n\
  \n随后，我们将模式设置为 `wild`，因为我们不希望在这种情况下让其他测试使用该固件。\n\n固件本身非常直观，可以在 `nock.js` 辅助文件中提供的目录中找到。\n\
  \nNock 是一个提高使用外部服务的测试可靠性的高效有效工具，并且通过重新评估以前被认为太不稳定而无法实现的测试，允许实现更高的测试覆盖率。\n\n与任何 mock\
  \ 一样，确保 mock 工作不过头，并且测试仍可能由于功能更改而失败（否则它是没用的），是开发者的职责。\n\n### Mock 操作 (Mocking Actions)\n\
  \n让我们看一下代码。\n\n这是我们想要测试的组件。它引用了 Vuex 操作。\n\n```html\n<template>\n  <div class=\"\
  text-align-center\">\n    <input type=\"text\" @input=\"actionInputIfTrue\" />\n\
  \    <button @click=\"actionClick()\">Click</button>\n  </div>\n</template>\n\n\
  <script>\n  import { mapActions } from 'vuex'\n\n  export default {\n    methods:\
  \ {\n      ...mapActions(['actionClick']),\n      actionInputIfTrue: function actionInputIfTrue(event)\
  \ {\n        const inputValue = event.target.value\n        if (inputValue === 'input')\
  \ {\n          this.$store.dispatch('actionInput', { inputValue })\n        }\n\
  \      }\n    }\n  }\n</script>\n```\n\n对于此测试，我们不在乎 actions 执行了什么，或者 store 是什么样子的。我们只需要理解这些操作是在正确的时间以正确的值执行的。\n\
  \n当我们 `shallowMount` 组件时，必须提供 store。\n\n```javascript\nimport { shallowMount, createLocalVue\
  \ } from '@vue/test-utils'\nimport Vuex from 'vuex'\nimport Actions from '../../../Actions'\n\
  \nconst localVue = createLocalVue()\n\nlocalVue.use(Vuex)\n\ndescribe('Actions',\
  \ () => {\n  let actions\n  let store\n\n  beforeEach(() => {\n    actions = {\n\
  \      actionClick: jest.fn(),\n      actionInput: jest.fn()\n    }\n    store =\
  \ new Vuex.Store({\n      actions\n    })\n  })\n\n  it('dispatches \"actionInput\"\
  \ when input is \"input\"', () => {\n    const wrapper = shallowMount(Actions, {\
  \ store })\n    const input = wrapper.find('input')\n    input.element.value = 'input'\n\
  \    input.trigger('input')\n    expect(actions.actionInput).toHaveBeenCalledWith('actionInput',\
  \ { inputValue: 'input' })\n  })\n\n  it('does not dispatch \"actionInput\" when\
  \ input is not \"input\"', () => {\n    const wrapper = shallowMount(Actions, {\
  \ store })\n    const input = wrapper.find('input')\n    input.element.value = 'not\
  \ input'\n    input.trigger('input')\n    expect(actions.actionInput).not.toHaveBeenCalled()\n\
  \  })\n\n  it('calls \"actionClick\" when button is clicked', () => {\n    const\
  \ wrapper = shallowMount(Actions, { store })\n    wrapper.find('button').trigger('click')\n\
  \    expect(actions.actionClick).toHaveBeenCalled()\n  })\n})\n```\n\n\n\n\n```\n\
  import { shallowMount, createLocalVue } from '@vue/test-utils'\nimport Vuex from\
  \ 'vuex'\nimport Getters from '../../../src/components/Getters'\n\nconst localVue\
  \ = createLocalVue()\n\nlocalVue.use(Vuex)\n\ndescribe('Getters.vue', () => {\n\
  \  let getters\n  let store\n\n  beforeEach(() => {\n    getters = {\n      clicks:\
  \ () => 2,\n      inputValue: () => 'input'\n    }\n\n    store = new Vuex.Store({\n\
  \      getters\n    })\n  })\n\n  it('Renders \"store.getters.inputValue\" in first\
  \ p tag', () => {\n    const wrapper = shallowMount(Getters, { store, localVue })\n\
  \    const p = wrapper.find('p')\n    expect(p.text()).toBe(getters.inputValue())\n\
  \  })\n\n  it('Renders \"store.getters.clicks\" in second p tag', () => {\n    const\
  \ wrapper = shallowMount(Getters, { store, localVue })\n    const p = wrapper.findAll('p').at(1)\n\
  \    expect(p.text()).toBe(getters.clicks().toString())\n  })\n})\n```\n\n这是一个与我们的活动测试相似的测试。我们在每个测试之前都会构建一个伪造的\
  \ store，在使用 `shallowMount` 时将其作为选项传递，并检查 mock getters 返回的值是否已显示。\n\n这太棒了，但如果我们想确保\
  \ getters 返回的是状态（state）的正确部分该呢？\n\n### 使用模块进行模拟（Mocking with Modules）\n\n模块对于将商店拆分成更小的部分非常有帮助。它们也携带了\
  \ getters。这些在我们的实验中将非常有用。\n\n让我们仔细观察：\n\n```\n<template>\n  <div\n    <button @click=\"\
  moduleActionClick()\">Click</button>\n    <p>{{moduleClicks}}</p>\n  </div>\n</template>\n\
  \n<script>\n  import { mapActions, mapGetters } from 'vuex'\n\n  export default\
  \ {\n    methods: {\n      …mapActions(['moduleActionClick'])\n    },\n\n    computed:\
  \ mapGetters(['moduleClicks'])\n  }\n</script>\n```\n\n一个包含一个 action 和一个 getter\
  \ 的简单组件。\n\n现在来进行测试：\n\n```javascript\nimport { shallowMount, createLocalVue } from\
  \ '@vue/test-utils'\nimport Vuex from 'vuex'\nimport MyComponent from '../../../src/components/MyComponent'\n\
  import myModule from '../../../src/store/myModule'\n\nconst localVue = createLocalVue()\n\
  \nlocalVue.use(Vuex)\n\ndescribe('MyComponent.vue', () => {\n  let actions\n  let\
  \ state\n  let store\n\n  beforeEach(() => {\n    state = {\n      clicks: 2\n \
  \   }\n\n    actions = {\n      moduleActionClick: jest.fn()\n    }\n\n    store\
  \ = new Vuex.Store({\n      modules: {\n        myModule: {\n          state,\n\
  \          actions,\n          getters: myModule.getters,\n          namespaced:\
  \ true\n        }\n      }\n    })\n  })\n\n  it('calls store action \"moduleActionClick\"\
  \ when button is clicked', () => {\n    const wrapper = shallowMount(MyComponent,\
  \ { store, localVue })\n    const button = wrapper.find('button')\n    button.trigger('click')\n\
  \    expect(actions.moduleActionClick).toHaveBeenCalled()\n  })\n\n  it('renders\
  \ \"state.clicks\" in first p tag', () => {\n    const wrapper = shallowMount(MyComponent,\
  \ { store, localVue })\n    const p = wrapper.find('p')\n    expect(p.text()).toBe(state.clicks.toString())\n\
  \  })\n})\n```\n\n### 测试 Vuex Store\n\n测试 Vuex store 有两种方法。第一种技术是独立地单元测试 getters、mutations\
  \ 和 actions。第二种方法是构建一个 store 然后对其进行测试。我们将查看这两种方案。\n\n我们将创建一个一个计数计数商店来演示如何测试 Vuex\
  \ store。store 中将有一个 `increment` mutation 和一个 `evenOrOdd` getter。\n\n```javascript\n\
  // mutations.js\nexport default {\n  increment(state) {\n    state.count++\n  }\n\
  }\n// getters.js\nexport default {\n  evenOrOdd: state => (state.count % 2 === 0?\
  \  'even' : 'odd')\n```\n\n#### 分别测试 Getters, Mutations 和 Actions\n\n由于 getters、mutations\
  \ 和 actions 都是 JavaScript 函数，它们不需要 Vue Test Utils 和 Vuex 即可进行测试。\n\n独立测试 getters、mutations\
  \ 和 actions 的优点是你的单元测试更加全面。当它们失败时，你能够立即知道代码出了什么问题。缺点是你必须模拟 Vuex 方法，如 `commit` 和\
  \ `dispatch`。这可能会导致单元测试通过，但生产环境代码由于错误的 mock 而失败的情况。\n\n我们将构建两个测试文件，`mutations.spec.js`\
  \ 和 `getters.spec.js`，如下：\n\n首先，让我们 `increment` mutation 放入测试：\n\n```javascript\n\
  // mutations.spec.js\n\nimport mutations from './mutations'\n\ntest('\"increment\"\
  \ increments \"state.count\" by 1', () => {\n  const state = {\n    count: 0\n \
  \ }\n  mutations.increment(state)\n  expect(state.count).toBe(1)\n})\n```\n\n现在将\
  \ `evenOrOdd` getter 放入测试：\n\n```javascript\n// getters.spec.js\n\nimport getters\
  \ from './getters'\n\ntest('\"evenOrOdd\" returns \"even\" when state.count is even',\
  \ () => {\n  const state = {\n    count: 2\n  }\n  expect(getters.evenOrOdd(state)).toBe('even')\n\
  })\n\ntest('\"evenOrOdd\" returns \"odd\" when state.count is odd', () => {\n  const\
  \ state = {\n    count: 1\n  }\n  expect(getters.evenOrOdd(state)).toBe('odd')\n\
  })\n```\n\n#### 测试运行中的 Store (Running Store)\n\n测试 Vuex store 的另一种方法是使用配置建立一个运行中的\
  \ store。当测试失败时，可能很难确定源头。为了避免污染计数器，我们将使用：\n\n```javascript\n// store-config.js\n\n\
  import mutations from './mutations'\nimport getters from './getters'\n\nexport default\
  \ {\n  state: {\n    count: 0\n  },\n  mutations,\n  getters\n}\n// store-config.spec.js\n\
  \nimport { createLocalVue } from '@vue/test-utils'\nimport Vuex from 'vuex'\nimport\
  \ storeConfig from './store-config'\nimport { cloneDeep } from 'lodash'\n\ntest('increments\
  \ \"count\" when \"increment\" is committed', () => {\n  const localVue = createLocalVue()\n\
  \  localVue.use(Vuex)\n  const store = new Vuex.Store(cloneDeep(storeConfig))\n\
  \  expect(store.state.count).toBe(0)\n  store.commit('increment')\n  expect(store.state.count).toBe(1)\n\
  })\n\ntest('updates \"evenOrOdd\" when \"increment\" is committed', () => {\n  const\
  \ localVue = createLocalVue()\n  localVue.use(Vuex)\n  const store = new Vuex.Store(cloneDeep(storeConfig))\n\
  \  expect(store.getters.evenOrOdd).toBe('even')\n  store.commit('increment')\n \
  \ expect(store.getters.evenOrOdd).toBe('odd')\n})\n```\n\n\n\n\n\n你的单元测试框架在测试失败时提供有用的错误信息是至关重要的。断言库负责这一点。具有高质量错误信息的断言可以减少调试问题所需的时间。断言库不仅会报告哪些测试失败了，还会提供测试失败的原因信息，例如预期值与实际获取值之间的对比。\n\
  \n断言库包含在多个单元测试框架中，例如 `Jest`。而其他框架（如 `Mocha`）则需要单独安装断言库（通常是 `Chai`）。\n\n* 鼓励社区和团队的参与。\n\
  \n由于大多数单元测试框架都是开源的，对于某些需要长期维护测试并需要确保项目将持续维护的团队来说，拥有活跃的社区可能是关重要的。此外，当你遇到问题时，活跃的社区可以提供额外的帮助。\n\
  \n`Vue Testing Library` 通过提供与 Vue 组件交互的 API 扩展了 `DOM Testing Library`。它基于 Vue 官方测试库\
  \ `@vue/test-utils`\n\n* [GitHub 上的 Vue Testing Library](https://github.com/testing-library/vue-testing)\n\
  \n简而言之，`Vue Testing Library` 做了三件事：\n\n1. 重新导出 `DOM Testing Library` 的查询工具和辅助函数。\n\
  2. 隐藏了与 `Testing Library` 不兼容的 `@vue/test-utils` 函数。\n3. 对两个来源的某些方法进行了微调。\n\n####\
  \ 安装\n\n该模块通过 `npm` 提供，应作为 `devDependency` 安装在你的项目中：\n\n```\nnpm install --save-dev\
  \ @testing-library/vue\n```\n\n此库包含了 Vue 和 `vue-template-compiler` 的 `peerDependencies`。\n\
  \n你可能还想要安装 `@testing-library/jest-dom` 以使用自定义的 Jest 匹配器。\n\n**示例：**\n\n```\n<template>\n\
  \  <div>\n    <p>Times clicked: {{ count }}</p>\n    <button @click=\"increment\"\
  >increment</button>\n  </div>\n</template>\n\n<script>\n  export default {\n   \
  \ name: 'Button',\n    data: () => ({\n      count: 0,\n    }),\n    methods: {\n\
  \      increment() {\n        this.count++\n      },\n    },\n  }\n</script>\nimport\
  \ {render, screen, fireEvent} from '@testing-library/vue'\nimport Button from './Button'\n\
  \ntest('increments value on click', async () => {\n  // 'render' 方法将组件渲染到文档中。\n\
  \  // 它还向 'screen' 绑定了所有可用的查询方法，用于与组件进行交互。\n  render(Button)\n\n  // queryByText\
  \ 返回匹配提供文本的第一个节点\n  // 或者返回 null。\n  expect(screen.queryByText('Times clicked: 0')).toBeTruthy()\n\
  \n  // getByText 获取匹配指定文本的第一个节点\n  // 否则抛出错误。\n  const button = screen.getByText('increment')\n\
  \n  // 点击几次。\n  await fireEvent.click(button)\n  await fireEvent.click(button)\n\
  \n  expect(screen.queryByText('Times clicked: 2')).toBeTruthy()\n})\n```\n\n####\
  \ 什么是 Vue Testing Library？\n\n`Vue Testing Library` 是一个轻量级的 Vue 测试库，它为 `@vue/test-utils`\
  \ 添加了轻量级的工具方法。它的设计基于一个核心思想：你的测试越能模拟程序的使用方式，它们能带给你的信心就越大。\n\n#### 为什么要使用 Vue Testing\
  \ Library？\n\n* 你希望开发不关注实现细节的测试，例如检查解决方案是如何实现的，而不是检查它是否提供了预期的结果。\n* 你希望开发关注 DOM\
  \ 节点而非显示的 Vue 组件的测试。\n* 你希望开发像用户一样查询 DOM 的测试。\n\n#### Vue Testing Library 如何工作\n\
  \n`Vue Testing Library` 通过提供以与用户相同的方式查询 DOM 的工具来工作。这些工具允许你根据标签文本搜索对象，根据文本内容识别链接和按钮，并确保你的\
  \ Vue 应用具有完全的可访问性（accessible）。\n\n在通过文本内容或标签发现项目不合理或不切实际的情况下，`Vue Testing Library`\
  \ 建议利用 `data-tested` 属性作为定位这些组件的逃生口（escape hatch）。\n\n`data-tested` 属性应用于你打算在测试中查询的\
  \ HTML 元素上。\n\n**示例：**\n\n```\n<button data-testid=\"checkoutButton\">Check Out</button>\n\
  ```\n\n#### 开始使用 Vue Testing Library\n\n现在你已经理解了为什么要使用 `Vue Testing Library` 以及它是如何工作的，让我们从在一个全新的\
  \ Vue CLI 生成的 Vue 项目中安装它开始吧。\n\n首先，在终端中执行以下命令（假设你的系统中已安装了 Vue CLI）来构建一个新的 Vue 应用：\n\
  \n```\nvue create vue-testing-library-demo\n```\n\n`Jest` 是由 Facebook 构建的测试运行器将用于执行我们的测试。`Jest`\
  \ 可以通过 Vue CLI 插件简单地安装。让我们包含该插件：\n\n```\nvue add unit-jest\n```\n\n你会发现 `package.json`\
  \ 中添加了一个脚本...\n\n```json\n\"test:unit\": \"vue-cli-service test\",\n```\n\n\n\n\n\
  你可能还想安装 `@testing-library/jest-dom` 以利用针对 DOM 的专用 Jest 匹配器（matchers）。\n\n### 问题\n\
  \n你想为你的 Vue 组件开发易于维护的测试用例。你希望测试能够避免将组件的实现细节作为测试的一部分。你更倾向于专注于确保测试能提供你所需的信心。\n\n###\
  \ 解决方案\n\nVue Testing Library 是一个针对 Vue 组件的轻量级测试解决方案。它在 `@vue/test-utils` 之上增加了轻量实用方法，鼓励养成更好的测试习惯。\n\
  \n它的核心理念是：测试模拟产品使用方式程度越高，你对它们的信任就越高。\n\n因此，你的测试将不再处理显示的 Vue 组件实例，而是处理真实的 DOM 节点。\n\
  \n该包提供的工具方法使你能够以用户相同的方式查询 DOM。它们允许你通过标签文本（label text）、链接和按钮来发现对象，并确保你的应用程序是可访问的（accessible）。\n\
  \n它还提供了一种 `data-tested` 建议技术，当文本内容或标签没有意义或不实际时，作为元素的“逃生口”（escape hatch）。\n\n**基础示例：**\n\
  \n```\n<template>\n  <div>\n    <p>点击次数: {{ count }}</p>\n    <button @click=\"\
  increment\">increment</button>\n  </div>\n</template>\n\n<script>\n  export default\
  \ {\n    name: 'Button',\n    data: () => ({\n      count: 0,\n    }),\n    methods:\
  \ {\n      increment() {\n        this.count++\n      },\n    },\n  }\n</script>\n\
  ```\nimport {render, screen, fireEvent} from '@testing-library/vue'\nimport Button\
  \ from './Button'\n\ntest('increments value on click', async () => {\n  // 'render'\
  \ 方法将组件渲染到文档中。\n  // 它还在 'screen' 上绑定了所有可用的查询方法以交互组件(\"@testing-library/vue - Documentation,\
  \ Popularity | Stackleap\")\n  render(Button)\n\n  // queryByText 获取匹配指定文本的第一个节点\n\
  \  // 或者返回 null。\n  expect(screen.queryByText('Times clicked: 0')).toBeTruthy()\n\
  \n  // getByText 获取匹配指定文本的第一个节点\n  // 或者抛出错误。\n  const button = screen.getByText('increment')\n\
  \n  // 点击几次。\n  await fireEvent.click(button)\n  await fireEvent.click(button)\n\
  \n  expect(screen.queryByText('Times clicked: 2')).toBeTruthy()\n})\n```\n\n安装 `@testing-library/jest-dom`\
  \ 以提供实用的断言，如 `.toBeInTheDocument()`。你可以在上面的示例中编写 `expect(screen.queryByText('Times\
  \ clicked: 0')).toBeInTheDocument()`（）。\n\n使用 `byText` 查询不是查找组件的唯一或最佳技术。要了解其他选项，请参见我应该使用哪种查询？。在上面的示例中，`getByRole('button',\
  \ {name: 'increment'})` 可能是获取按钮元素的最佳方法。\n\n## 结论\n\n在这一章中我们学习了 NOCK 和 Vue.js-testing-library，包括它们是什么以及如何使用。下一章将讨论表单和表单验证。\n\
  \n# 第 9 章 表单与验证\n\nDOI: [10.1201/9781003310464-9](https://doi.org/10.1201/9781003310464-9)\n\
  \n## 本章内容\n\n*   表单基础\n*   JavaScript 表单验证\n\n我们在 第 8 章 中学习了 NOCK 和 Vue。我们还学习了什么是\
  \ JS 测试库以及它们如何工作。我们将在本章中学习表单和表单验证。\n\n## 表单基础\n\n在 HTML 中创建表单，你使用 `<form>` 元素：（“JavaScript\
  \ Form Archives - Tutorial”）\n\n```\n<form action=\"/signup\" method=\"post\" id=\"\
  signup\">\n</form>\n```\n\n*   `action` 是一个用于处理表单提交的 URL。在此情况下，`action` 是 `/signup`\
  \ 路径。\n*   `method` 指定了应该使用哪种 HTTP 方法来提交表单。`post` 或 `get` 都是可行的方法。\n\n当你想从服务器获取数据时，你通常使用\
  \ `get` 方法；当你想更改服务器上的某些内容时，你通常使用 `post` 方法。\n\nJavaScript 中的 `HTMLFormElement` 对象用于表示表单。`HTMLFormElement`\
  \ 具有下面列出的属性，这些属性对应于 HTML 属性：\n\n*   `action`:它是处理表单数据的 URL。它类似于 `<form>` 元素的 `action`\
  \ 属性。\n*   `method`:它是对应于 `<form>` 元素 `method` 属性的 HTTP 方法。\n\n此外，`HTMLFormElement`\
  \ 还有以下实用的方法：\n\n*   `submit()`：提交表单。\n*   `reset()`：重置表单。\n\n### 引用表单\n\n你可以使用 `getElementById('signup')`\
  \ 来引用表单：\n\n```javascript\nconst form = document.getElementById('signup');\n```\n\
  \n`forms` 属性返回表单列表（HTMLFormCollection）：\n\n```javascript\ndocument.forms\n```\n\n\
  ### 提交表单\n\n使用索引来查找特定的表单。考虑以下注册表单，它有两个输入元素：\n\n```html\n<form action=\"signup.html\"\
  \ method=\"post\" id=\"signup\">\n       <h1>Sign Up</h1>\n       <div class=\"\
  field\">\n              <label for=\"name\">Name:</label>\n              <input\
  \ type=\"text\" id=\"name\" name=\"name\" placeholder=\"Enter fullname\" />\n  \
  \            <small></small>\n       </div>\n       <div class=\"field\">\n    \
  \          <label for=\"email\">Email:</label>\n              <input type=\"text\"\
  \ id=\"email\" name=\"email\" placeholder=\"Enter email address\" />\n         \
  \     <small></small>\n       </div>\n       <button type=\"submit\">Subscribe</button>\n\
  </form>\n```\n\n当提交按钮被选中时按下回车键，浏览器会提交表单。\n\n使用表单元素的 `addEventListener()` 函数为提交事件添加监听器：\n\
  \n```javascript\nconst form = document.getElementById('signup');\n\nform.addEventListener('submit',\
  \ (event) => {\n    // 处理表单数据\n});\n```\n\n要防止表单被提交，在提交处理器内部执行 `event` 对象的 `preventDefault()`\
  \ 函数：\n\n```javascript\nform.addEventListener('submit', (event) => {\n    // 停止表单提交\n\
  \    event.preventDefault();\n});\n```\n\n如果表单数据无效，你通常调用 `event.preventDefault()`\
  \ 方法。\n\n表单对象的 `submit()` 方法用于在 JavaScript 中提交表单：\n\n```javascript\nform.submit();\n\
  ```\n\n`form.submit()` 函数不会触发提交事件。因此，在使用此方法之前，你应该仔细验证表单。\n\n### 访问表单字段\n\n你可以利用\
  \ DOM 技术（如 `getElementsByName()`、`getElementById()`、`querySelector()` 等）来获取表单字段。\n\
  \n你也可以使用表单对象的 `elements` 属性。表单元素集合存储在 `form.elements` 属性中。\n\n你可以通过索引、ID 或名称在 JavaScript\
  \ 中访问元素。\n\n```javascript\nform.elements[0]\n```\n\n\n\n\n\n```javascript\nconst\
  \ form = document.getElementById('signup');\n```\n要访问该元素，可以使用 `index`、`id` 或 `name`。访问第一个表单元素如下：\n\
  \n```javascript\nform.elements[0]; // 通过索引访问\nform.elements['name']; // 通过 name\
  \ 访问\nform.elements['name']; // 通过 id 访问（在此情况下 name 和 id 相同的）\n```\n\n以下是访问第二个输入元素：\n\
  \n```javascript\nform.elements[1]; // 通过索引访问\nform.elements['email']; // 通过 name\
  \ 访问\nform.elements['email']; // 通过 id 访问\n```\n\n访问表单字段后，你可以使用 `value` 属性来获取其值，例如：\n\
  \n```javascript\nconst form = document.getElementById('signup');\nconst name = form.elements['name'];\n\
  const email = form.elements['email'];\n\n// 获取元素的值\nlet fullName = name.value;\n\
  let emailAddress = email.value;\n```\n\n### 整合在一起：注册表单\n以下包含注册表单的 HTML 文档示例。\n\n\
  ```html\n```\nHTML 文本中引用了 `style.css` 和 `app.js` 文件。`<small>` 元素用于在 `<input>` 元素的数据无效时显示错误消息。\n\
  \n如果你在提交表单时不提供任何信息，将发生以下错误：如果你在提交表单时提供了姓名但电子邮件格式无效，将发生以下错误：\n\n下面是整个 `app.js` 文件的内容：\n\
  \n```javascript\n```\n\n### 工作原理\n\n#### showMessage() 函数\n`showMessage()` 函数接收一个输入元素\
  \ `message` 和一个类型 `type`。\n\n```javascript\n```\n\n以下显示了表单上的名称输入字段：\n\n```html\n\
  ```\n\n如果 `name` 的 `value` 为空，你需要先获取它的父元素，即具有类 `field` 的 `<div>`。\n\n```css\n```\n\
  \n接下来，你需要选择 `<small>` 元素：\n\n```javascript\n```\n\n然后，我们更新消息：\n\n随后，将根据 `type` 参数的值更改输入字段的\
  \ CSS 类。如果 `type` 为 `true`，我们将输入元素的类设置为 `success`。否则，将类设置为 `error`。\n\n```javascript\n\
  ```\n\n最后，返回 `type` 的值：\n\n```javascript\n```\n\n`showError()` 和 `showSuccess()`\
  \ 函数分别用于显示错误和成功。\n\n`showMessage()` 函数由 `showError()` 和 `showSuccess()` 程调用。`showError()`\
  \ 函数始终返回 `false`，但 `showSuccess()` 函数始终返回 `true`。`showSuccess()` 方法还会将错误消息设置为空字符串。\n\
  \n```javascript\n```\n\n### hasValue() 函数\n`hasValue()` 函数确定输入元素是否有值，并根据需要适当使用 `showError()`\
  \ 或 `showSuccess()` 函数显示错误消息或成功消息：\n\n```javascript\n```\n\n### validateEmail()\
  \ 函数\n`validateEmail()` 函数验证邮箱字段是否包含有效的电子邮件地址：\n\n```php\n```\n\n`validateEmail()`\
  \ 方法调用 `hasValue()` 函数来检查字段值是否为空。如果输入字段为空，它会显示 `requiredMsg`。\n\n为了验证邮箱，使用了正则表达式。如果电子邮件无效，`validateEmail()`\
  \ 函数将返回 `invalid Msg` 变量。\n\n### 提交事件处理器\n首先，使用 `querySelector()` 方法通过其 `id` 选择注册表单：\n\
  \n```javascript\n```\n\n其次，创建一些变量来存储错误消息：\n\n```javascript\n```\n\n第三，使用 `addEventListener()`\
  \ 方法为注册表单添加 `submit` 事件监听器：\n\n```javascript\n```\n\n在 `submit` 事件处理器中：\n1. 调用事件以停止表单提交。`preventDefault()`\
  \ 是一个阻止默认发生任何操作的方法。\n2. 使用 `hasValue()` 和 `validateEmail()` 函数验证姓名和邮箱字段。\n3. 如果姓名和电子邮件地址都正确，则显示提示。在实际应用中，你必须调用\
  \ `form`。要提交表单，请使用 `submit()` 方法。\n\n## 总结\n* 要构建 HTML 表单，使用 `<form>` 元素。\n* 要选择\
  \ `<form>` 元素，使用 `getElementById()` 和 `querySelector()` 等 DOM 技术。`form` 元素也可以通过\
  \ `document.forms[index]` 中的数字索引返回。\n* 要访问表单元素，使用 `form.elements`。\n* 当用户点击表单的提交按钮时，会触发\
  \ `submit` 事件。\n\n## JAVASCRIPT 表单验证\nJavaScript 能够验证 HTML 表单。\n\n如果表单字段 (`fname`)\
  \ 为空，此方法将发送一条消息并返回 `false`，防止表单上传：\n\n```javascript\nfunction validateForm() {\n\
  \  let x = document.forms[\"myForm\"][\"fname\"].value;\n  if (x == \"\") {\n  \
  \  alert(\"Name must filled out\");\n    return false;\n  }\n}\n```\n\n在提交表单时可以调用该函数：\n\
  \n```html\n<form name=\"myForm\" action=\"/action_page.php\" onsubmit=\"return validateForm()\"\
  \ method=\"post\">\nName: <input type=\"text\" name=\"fname\">\n<input type=\"submit\"\
  \ value=\"Submit\">\n</form>\n```\n\n### JavaScript 有验证数值输入的能力\n数字输入经常使用 JavaScript\
  \ 进行验证：\n\n```\n请输入 1 到 10 之间的值\n```\n\n### 自动 HTML 表单验证\n浏览器可以自动完成 HTML 表单的验证。\n\
  \n`required` 属性会在当表单字段 (`fname`) 为空时阻止此表单提交：\n\n```html\n<form action=\"/action_page.php\"\
  \ method=\"post\">\n  <input type=\"text\" name=\"fname\" required>\n  <input type=\"\
  submit\" value=\"Submit\">\n</form>\n```\n\nInternet Explorer 9 及之前的版本不支持自动 HTML\
  \ 验证。\n\n### 数据验证\n确保用户信息清洁、正确且用的被称为数据验证。\n\n验证任务包括：\n* 用户是否填写了所有必要字段？\n* 用户输入的日期是否正确？\n\
  * 用户是否在数值字段中输入了文本？\n\n数据验证的最常见目标是确保输入是正确的。验证可以通过多种方式定义和实现。在输入传输到服务器之后，由服务器执行服务器端验证。网络浏览器在发送数据到服务器之前执行客户端验证。\n\
  \n\n\n\n\n在 `form`、`textarea` 和 `select` 元素上，可以使用 `v-model` 指令构建双向数据连接。它会根据输入类型选择合适的元素更新技术。`v-model`\
  \ 是在用户输入事件上更新数据的语法糖，并特别考虑了某些特定的边缘情况。\n\n任何表单元素的初始值、`checked` 或 `chosen` 属性都会被 `v-model`\
  \ 忽略。`Vue` 实例数据始终被视为事实来源（source of truth）。初始值应该在 JavaScript 端声明，在组件的 `data` 选项中。\n\
  \n对于不同的输入组件，`v-model` 使用不同的属性并触发不同的事件：\n\n- `text` 和 `textarea` 元素使用 `value` 属性和\
  \ `input` 事件；\n- `checkboxes` 和 `radiobuttons` 使用 `checked` 属性和 `change` 事件；\n-\
  \ `Select` 字段利用 `value` 作为属性（prop），并使用 `change` 作为事件。\n\n你会发现，对于需要 IME（输入法编辑器）的语言，在\
  \ IME 组合过程中 `v-model` 不会更新。如果你也想处理这些变化，请改用 `input` 事件。\n\n#### 文本 (Text)\n```html\n\
  <input v-model=\"message\" placeholder=\"edit me\">\n<p>Message is: {{ message }}</p>\n\
  ```\n![一个文本框示例，标签为 edit me，下方是陈述 message is:。](img/fig9_1.jpg)\n\n消息块。\n\n#### 多行文本\
  \ (Multiline text)\n```html\n<span>Multiline message is:</span>\n<p style=\"white-space:\
  \ pre;\">{{ message }}</p>\n<br>\n<textarea v-model=\"message\" placeholder=\"add\
  \ lines\"></textarea>\n```\n![一个陈述，multiline message is: 后面跟着一个标签为 add multiple\
  \ 的文本框。](img/fig9_2.jpg)\n\n多行消息块。\n\n#### 复选框 (Checkbox)\n##### 单选复选框，布尔值\n```html\n\
  <input type=\"checkbox\" id=\"checkbox\" v-model=\"checked\">\n<label for=\"checkbox\"\
  >{{ checked }}</label>\n```\n![一个标记为 false 的复选框。](img/fig9_3.jpg)\n\n复选框块。\n\n#####\
  \ 多复选框，绑定到同一个数组\n```html\n<input type=\"checkbox\" id=\"jacky\" value=\"Jack\" v-model=\"\
  checkedNames\">\n<label for=\"jacky\">Jacky</label>\n<input type=\"checkbox\" id=\"\
  johnny\" value=\"John\" v-model=\"checkedNames\">\n<label for=\"johnny\">Johny</label>\n\
  <input type=\"checkbox\" id=\"midny\" value=\"Mike\" v-model=\"checkedNames\">\n\
  <label for=\"midny\">Midny</label>\n<br>\n<span>Checked names: {{ checkedNames }}</span>\n\
  ```\n```javascript\nnew Vue({\n  el: '…',\n  data: {\n    checkedNames: []\n  }\n\
  })\n```\n![显示了多个复选框的区块。一行中有三个标记为 Jack 和 Mike 的复选框。下方的陈述为：Checked names:](img/fig9_4.jpg)\n\
  \n多复选框块。\n\n#### 单选按钮 (Radio)\n##### 多复选框（注：此处标题可能有误，实为单选框）\n```html\n<input type=\"\
  radio\" id=\"one\" value=\"One\" v-model=\"picked\">\n<label for=\"one\">One</label>\n\
  <br>\n<input type=\"radio\" id=\"two\" value=\"Two\" v-model=\"picked\">\n<label\
  \ for=\"two\">Two</label>\n<br>\n<span>Picked: {{ picked }}</span>\n```\n![两个标记为\
  \ one 和 two 的单选按钮垂直对齐。陈述 Picked: 位于下方。](img/fig9_5.jpg)\n\n单选按钮示例。\n\n#### 下拉框 (Select)\n\
  ##### 单选框\n```html\n<select v-model=\"selected\">\n  <option value=\"\">Please select\
  \ one</option>\n  <option>A</option>\n  <option>B</option>\n  <option>C</option>\n\
  </select>\n<span>Selected: {{ selected }}</span>\n```\n```javascript\nnew Vue({\n\
  \  el: '…',\n  data: {\n    selected: ''\n  }\n})\n```\n![一个带有下拉选项的 select 按钮示例。标记为\
  \ select one 的下拉框后面是陈述 selected:](img/fig9_6.jpg)\n\nselect 按钮示例。\n\n##### 多选框（绑定到数组）\n\
  ```html\n<select v-model=\"selected\" multiple>\n  <option>A</option>\n  <option>B</option>\n\
  \  <option>C</option>\n</select>\n<br>\n<span>Selected: {{ selected }}</span>\n\
  ```\n![一个 select 列表示例。给出了右侧带有垂直滚动条的 select 。select 框显示了 3 个选项：A、B 和 C。陈述 Selected:](img/fig9_7.jpg)\n\
  \nselect 列表示例。\n\n#### 使用 v-for 渲染动态选项\n```html\n<select v-model=\"selected\">\n\
  \  <option v-for=\"option in options\" v-bind:value=\"option.value\">\n    {{ option.text\
  \ }}\n  </option>\n</select>\n<span>Selected: {{ selected }}</span>\n```\n```javascript\n\
  new Vue({\n  el: '…',\n  data: {\n    selected: 'A',\n    options: [\n      { text:\
  \ 'One', value: 'A' },\n      { text: 'Two', value: 'B' },\n      { text: 'Three',\
  \ value: 'C' }\n    ]\n  }\n})\n```\n\n#### 值绑定 (Value Bindings)\n`v-model` 对于 `radio`、`checkbox`\
  \ 和 `select` 的值通常是字符串（checkboxes 为布尔值）：\n\n```html\n<!-- 选中时，picked 为字符串 \"a\" -->\n\
  <input type=\"radio\" v-model=\"picked\" value=\"a\">\n\n<!-- toggle 为 true 或 false\
  \ -->\n<input type=\"checkbox\" v-model=\"toggle\">\n\n<!-- 选中第一个选项时，selected 为字符串\
  \ \"abc\" -->\n<select v-model=\"selected\">\n  <option>ABC</option>\n</select>\n\
  ```\n\n有时我们希望将值与 `Vue` 实例的动态属性关联。为了实现这一点，我们可以使用 `v-bind`。我们也可以通过 `v-bind` 将输入绑定到非字符串值。\n\
  \n##### 复选框\n```html\n<input\n  type=\"checkbox\"\n  v-model=\"toggle\"\n  true-value=\"\
  yes\"\n  false-value=\"no\"\n>\n// 选中时：\nvm.toggle === 'yes'\n// 未选中时：\nvm.toggle\
  \ === 'no'\n```\n\n##### 单选按钮\n```html\n<input\n  type=\"radio\"\n  id=\"one\"\n\
  \  value=\"One\"\n  v-model=\"picked\"\n>\n<label for=\"one\">One</label>\n<br>\n\
  <input\n  type=\"radio\"\n  id=\"two\"\n  value=\"Two\"\n  v-model=\"picked\"\n\
  >\n<label for=\"two\">Two</label>\n```\n\n##### 下拉框\n```html\n<select v-model=\"\
  selected\">\n  <option value=\"\">Please select one</option>\n  <option>A</option>\n\
  \  <option>B</option>\n  <option>C</option>\n</select>\n```\n\n#### 修饰符 (Modifiers)\n\
  - `.lazy`: 默认，`v-model` 在每次 `input` 事件时同步输入（IME 组合除外）。如果你希望在输入完成后后同步，可以使用 `lazy`\
  \ 修饰符。\n- `.number`: 如果希望输入被自动转换为 `Number` 类型，因为 HTML 元素的值总是字符串，你可以在输入框上添加 `number`\
  \ 修饰符。\n- `.trim`: 你可以使用 `trim` 修饰符来修剪用户输入中的空白字符。\n\n#### 组件上的 v-model\n内置的输入类型并不总是能满足需求。相反，`Vue`\
  \ 组件允许你创建具有完全可配置行为的可用输入。这些输入甚至与 `v-model` 兼容！\n\n### 懒更新\n\n\n\n\n在每个输入事件后，`v-model`\
  \ 默认会将输入内容与数据同步。你可以通过添加 `lazy` 属性将行为更改为在 `change` 事件后同步：\n\n```\n1 <!-- 在 \"change\"\
  \ 事件而非 \"input\" 事件后同步 -->\n2 <input v-model=\"msg\" lazy>\n```\n\n### 将值强制转换为数字\n\
  \n如果你希望用户输入被自动存储为数字，可以为你的 `v-model` 驱动的输入框添加 `number` 属性：\n\n```\n1 <input v-model=\"\
  age\" number>\n```\n\n### 绑定到表达式\n\n**仅限 ⁰.12.12**\n\n当在复选框和单选框上使用 `v-model` 时，绑定的值是\
  \ `Boolean` 类型或字符串：\n\n```\n1 <!-- toggle 值为 true 或 false -->\n2 <input type=\"\
  checkbox\" v-model=\"toggle\">\n3 \n4 <!-- 选中此单选框时，pick 为 \"green\" -->\n5 <input\
  \ type=\"radio\" v-model=\"pick\" value=\"green\">\n```\n\n这可能会有一些限制；有时我们希望将底层值绑定到其他内容。以下是实现方法：\n\
  \n复选框：\n\n```\n1 <input type=\"checkbox\" v-model=\"toggle\" true-exp=\"a\" false-exp=\"\
  b\">\n1 // 选中时：\n2 vm.toggle === vm.a\n3 // 未勾选时：\n4 vm.toggle === vm.b\n```\n\n\
  单选框：\n\n```\n1 <input type=\"radio\" v-model=\"pick\" exp=\"a\">\n1 // 选中时：\n2 vm.pick\
  \ === vm.a\n```\n\n### 动态选择选项\n\n由于你需要为 `<select>` 元素动态渲染选项列表，你应该使用 `options` 属性配合\
  \ `v-model`，以便当选项变化时，`v-model` 能够正确同步：\n\n```\n1 <select v-model=\"selected\" options=\"\
  myOptions\"></select>\n```\n\n`MyOptions` 应该是你数据中的一个键路径/表达式，它连接到一个将用作选项的 `Array`。\n\
  \n纯字符串可以在 `Array` 选项中找到：\n\n```\n1 options = ['a', 'b', 'c']\n```\n\n它也可以包含 `{text:’,\
  \ value:’’}` 格式的项目。在这种对象格式下，选项的文字显示可以与底层值不同：\n\n```\n1 options = [\n2   { text:\
  \ 'A', value: 'a' },\n3   { text: 'B', value: 'b' }\n4 ]\n```\n\n将渲染为：\n\n```\n\
  1 <select>\n2   <option value=\"a\">A</option>\n3   <option value=\"b\">B</option>\n\
  4 </select>\n```\n\n`value` 也可以是 `Objects`：\n\n仅限 0.12.11+\n\n```\n1 options = [\n\
  2   { text: 'A', value: { msg: 'hello' }},\n3   { text: 'B', value: { msg: 'bye'\
  \ }}\n4 ]\n```\n\n#### 选项组\n\n或者，可以将格式化为 `{label:\", options:[…]}`。在这种情况下，它将呈现为\
  \ `<optgroup>`：\n\n```\n1 [\n2   { label: 'A', options: ['a', 'b']},\n3   { label:\
  \ 'B', options: ['c', 'd']}\n4 ]\n```\n\n将渲染为：\n\n```\n1 <select>\n2   <optgroup\
  \ label=\"A\">\n3     <option value=\"a\">a</option>\n4     <option value=\"b\"\
  >b</option>\n5   </optgroup>\n6   <optgroup label=\"B\">\n7     <option value=\"\
  c\">c</option>\n8     <option value=\"d\">d</option>\n9   </optgroup>\n10 </select>\n\
  ```\n\n#### 选项过滤器\n\n你的源数据可能不是这种格式，因此你必须更改它来创建动态选项。`options` 参数支持过滤器以简化转换（DRY 原则），并且将你的转换逻辑封装在可重用的自定义过滤器中非常有用：\n\
  \n```\n1 Vue.filter('extract', function (value, keyToExtract) {\n2   return value.map(function\
  \ (item) {\n3     return item[keyToExtract]\n4   })\n5 })\n1 <select\n2   v-model=\"\
  selectedUser\"\n3   options=\"users | extract 'name'\">\n4 </select>\n```\n“上述过滤器将数据\
  \ `[{ name: ‘Bruce’ }, { name: ‘Chuck’ }]` 转换为 `['Bruce’, ‘Chuck’]`，使其格式正确。”（“Handling\
  \ Forms - vue.js”）\n\n#### 静态默认选项\n\n仅限 0.12.10+\n\n除了动态生成的选项外，你还可以提供一个静态默认选项：\n\
  \n```\n1 <select v-model=\"selectedUser\" options=\"users\">\n2   <option>Select\
  \ a user</option>\n3 </select>\n```\n\n### 输入防抖\n\n`debounce` 参数允许你在处理输入（例如耗时操作）之前指定一个延迟：\n\
  \n```\n1 <input v-model=\"msg\" debounce=\"500\">\n```\n\n### 设置 Vue 应用\n\n我们从构建一个带有某些标记的基础应用开始：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Forms with Vue</title>\n  <link\
  \ rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css\"\
  >\n</head>\n\n<body>\n  <div class=\"container\">\n    <div class=\"section\">\n\
  \      <h1 class=\"title\">Forms with Vue</h1>\n      <p class=\"subtitle\">Learn\
  \ to work with v-model</p>\n      <div class=\"columns\" id=\"app\">\n        <!--\
  \ 内容将在这里 -->\n      </div>\n    </div>\n  </div>>\n\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/vue/2.3.4/vue.min.js\"\
  ></script>\n  <script>\n    new Vue({\n      el: '#app',\n      data: {\n      \
  \  form: {\n          name: ''\n        }\n      }\n    })\n  </script>\n</body>\n\
  </html>\n```\n\n### 使用 v-model 绑定输入值\n\n使用 `v-model`，可以将输入元素绑定到实例数据。`name` 是我们定义的第一个属性，它是表单输入的初始值。\n\
  \n文本输入示例：\n\n```html\n<div class=\"field\">\n  <label class=\"label\">Name</label>\n\
  \  <div class=\"control\">\n    <input v-model=\"form.name\" class=\"input\" type=\"\
  text\" placeholder=\"Name\">\n  </div>\n</div>\n```\n\n以及数据模型中的对应值：\n\n```javascript\n\
  data: {\n  form : {\n    name: ''\n  }\n}\n```\n\n为了查看表单对象的所有属性，我们可以添加一个结果区域：\n\n\
  ```html\n<section id=\"results\">\n  <div class=\"box\">\n    <ul>\n      <li v-for=\"\
  (item, k) in form\">\n        <strong>{{ k }}:</strong> {{ item }}\n      </li>\n\
  \    </ul>\n  </div>\n</section>\n```\n\n文本域示例：\n\n它们的工作方式与普通输入框相同：\n\n```html\n\
  <div class=\"field\">\n  <label class=\"label\">Message</label>\n  <div class=\"\
  control\">\n    <textarea class=\"textarea\" placeholder=\"Message\" v-model=\"\
  form.message\"></textarea>\n  </div>\n</div>\n```\n\n以及数据模型中的对应值：\n\n```javascript\n\
  data: {\n  form : {\n    name: '',\n    message: '' // textarea 值\n  }\n}\n```\n\
  \n务必记住，双向绑定在 `textarea> form.message/textarea>` 的插值中不起作用。相反，请使用 `v-model` 指令。\n\n\
  ### 使用 v-model 指令处理选择框\n\n对于选择框，`v-model` 指令也可以轻松接入。所指定选项的值将与定义的模型同步。\n\n\n\n\n\
  ```html\n…\n<div class=\"field\">\n  <label class=\"label\">咨询类型</label>\n  <div\
  \ class=\"control\">\n    <div class=\"select\">\n      <select v-model=\"form.inquiry_type\"\
  >\n        <option disabled value=\"\">未选择</option>\n        <option v-for=\"option\
  \ in options.inquiry\" v-bind:value=\"option.value\">\n          {{ option.text\
  \ }}\n        </option>\n      </select>\n    </div>\n  </div>\n</div>\n…\n```\n\
  \n我们在上面的代码中使用了 `v-for` 指令来动态加载选项。这要求我们同时定义 Vue 实例中可访问的选项：\n\n```javascript\ndata:\
  \ {\n  form : {\n    name: '',\n    message: '',\n    inquiry_type: '' // 单选框选择值\n\
  \  },\n  options: {\n    inquiry: [\n      { value: 'feature', text: \"功能请求\"},\n\
  \      { value: 'bug', text: \"漏洞报告\"},\n      { value: 'support', text: \"技术支持\"\
  }\n    ]\n  }\n}\n```\n\n多选框遵循相同的步骤。另一方面，多选框选中的值被存储在一个数组中。\n\n示例：\n\n```html\n…\n\
  <div class=\"field\">\n  <label class=\"label\">LogRocket 用用例</label>\n  <div class=\"\
  control\">\n    <div class=\"select is-multiple\">\n      <select multiple v-model=\"\
  form.logrocket_usecases\">\n        <option>调试</option>\n        <option>修复错误</option>\n\
  \        <option>用户支持</option>\n      </select>\n    </div>\n  </div>\n</div>\n\
  …\n```\n\n## 结论\n\n在本章，我们学习了 Vue.js 表单和表单验证，包括它们是什么以及如何使用它们。\n\n# 参考文献\n\n1.  #learning,\
