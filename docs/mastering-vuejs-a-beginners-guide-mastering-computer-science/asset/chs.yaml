  \n# 第 3 章 Vue 组件\n\nDOI: [10.1201/9781003310464-3](https://doi.org/10.1201/9781003310464-3)\n\
  \n## 本章内容\n\n* 条件渲染\n* 样式化\n* 样式化组件\n\n我们在第 2 章中学习了 `JSX`、`Setup`、第一个组件、`props`\
  \ 以及其他术语，该章节也涵盖了它们是什么以及如何使用它们。\n\n本章将介绍组件、条件、样式等。让我们从依赖性组件开始。\n\n## 条件渲染\n\n###\
  \ Vue.js 条件渲染\n\nVue.js 是一个用于构建用户界现代框架。核心库只关注视图层，易于上手并与其他库结合。当与现代技术和相关框架集成时，Vue\
  \ 还能够驱动复杂的单页应用（SPA）。\n\nVue 的条件渲染使得我们可以根据预定义的标准，简单地控制 DOM 中任何元素的存在。这是通过使用 `v-if`\
  \ 和 `v-else` 指令实现的。\n\n`v-if` 指令可用于条件地渲染一个块。根据值，它可能被赋值一个布尔变量，从而切换底层的 DOM 元素。`v-else`\
  \ 指令用于渲染不符合 `v-if` 指令标准的块。为了使该指令生效，它必须紧跟在 `v-if` 指令之后。可以使用 `v-else-if` 指令链使用多个条件。\n\
  \n以下示例展示了 Vue.js 中的条件渲染：\n\n**第一个示例：** 如果 `isVisible` 变量有效，则将显示 `v-if` 指令指定的文本。\n\
  \n```\nFilename: index.html\n\n<html>\n<head>\n<script src=\n\"https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js\"\
  >\n</script>\n</head>\n<body>\n<div id='parent'>\n      <h1 style=\"color: yellow\"\
  >\n      PiiksforPiiks\n      </h1>\n      <strong v-if=\"isVisible\">\n      Text\
  \ is visible\n      <strong>\n</div>\n<script src='app.js'></script>\n</body>\n\
  </html>\n\nFilename: app.js\n\nconst parent = new Vue({\nel : '#parent',\ndata :\n\
  \n      // 数据在 DOM 中进行插值\n      isVisible: false\n}\n})\n```\n\n**第二个示例：**\n\n```\n\
  Filename: index.html\n<html>\n<head>\n<script src=\n\"https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js\"\
  >\n</script>\n</head>\n<body>\n<div id='parent'>\n     <h1 style=\"color: yellow\"\
  >\n     PiiksforPiiks\n     </h1>\n     <h3>DataStructure Course</h3>\n     <p v-if='gfg'>\n\
  \     PiiksforPiiks Self-paced the Data Structure course is Awesome!\n     </p>\n\
  \n     <p v-else>\n     Not PiiksforPiiks course!\n     </p>\n\n</div>\n<script\
  \ src='app.js'></script>\n</body>\n</html>\nFilename: app.js\nconst parent = new\
  \ Vue({\nel : '#parent',\ndata : {\n\n     // 数据在 DOM 中进行插值\n     gfg: true\n}\n\
  })\n```\n\n调节模板代码是否被注册的能力被称为条件渲染。通过我们应用程序当前的状态，我们可以实现这一点。\n\n考虑以下示例。假设我们正在设计一个表单，如果密码少于六个字符，我们想要显示无效输入错误消息。\n\
  \n因此，我们将在模板中包含一个带有几个输入框的必要表单区域。我们将在脚本中使用 `V-model` 使我们的表单模型成为我们的数据。\n\n```\n<template>\n\
  \  <div>\n    <h2>SignUp</h2>\n    {{ email }} {{ password }}\n    <p><input type=\"\
  text\" placeholder=\"Email\" v-model=\"email\" /></p>\n    <p><input type=\"password\"\
  \ placeholder=\"Password\" v-model=\"password\" /></p>\n  </div>\n</template>\n\n\
  <script>\n  export default {\n    data() {\n      return {\n        email: '',\n\
  \        password: ''\n      }\n    }\n  }\n</script>\n```\n\n\n\n\n通过 `v-else`，你还可以包含一个“else\
  \ 块”。\n\n```\n<h1 v-if=\"awesome\">The Vue is awesome!</h1>\n<h1 v-else>Oh no </h1>\n\
  ```\n\n### 在 <template> 上使用 v-if 进行条件分组\n\n-由于 `v-if` 是一个指令，它只能应用于一个元素。但如果我们想同时切换多个元素呢？在这种情况下，我们可以在\
  \ `<template>` 元素上使用 `v-if` 来创建一个不可见的包装器。`<template>` 元素不会包含在最终的显示输出中。\n\n```\n\
  <template v-if=\"ok\">\n  <h1>标题</h1>\n  <p>段落 1</p>\n  <p>段落 2</p>\n</template>\n\
  ```\n\n#### v-else\n\n-由于 `v-else` 指令可以为 `v-if` 提供一个“else 块”：\n\n```\n<div v-if=\"\
  Math.random() > 0.6\">\n  Now you see me\n</div>\n<div v-else>\n  Now you do not\n\
  </div>\n```\n\n`v-else` 元素必须紧跟在 `v-if` 或 `v-else-if` 元素之后，否则它将被忽略。\n\n`v-else-if`\
  \ 顾如其义，充当 `v-if` 的“else if 块”。它可以被多次链用：\n\n```\n<div v-if=\"type === 'A'\">\n  A\n\
  </div>\n<div v-else-if=\"type === 'B'\">\n  B\n</div>\n<div v-else-if=\"type ===\
  \ 'C'\">\n  C\n</div>\n<div v-else>\n  Not A/B/C\n</div>\n```\n\n`v-else-if` 元素和\
  \ `v-else` 一样，必须紧跟在 `v-if` 或 `v-else-if` 元素之后。\n\n### 使用 Key 控制复用元素\n\nVue 尝试尽可能高效地渲染元素，频繁地复用它们而不是从头创建。除了让\
  \ Vue 变得极快之外，这还有几个有益处。例如，如果你允许用户在几种登录方式之间进行选择：\n\n```\n<template v-if=\"loginType\
  \ === 'username'\">\n  <label>Username</label>\n  <input placeholder=\"Enter username\"\
  >\n</template>\n<template v-else>\n  <label>Email</label>\n  <input placeholder=\"\
  Enter email address\">\n</template>\n```\n\n那么，在上面的代码中，更改登录类型不会覆盖用户已经输入的任何内容。因为两个模板都使用了相同的组件，只是替换了\
  \ `<input>` 的占位符。\n\n在输入框中输入一些文本，然后点击切换按钮亲眼观察。\n\n![旁边提供了一个用于输入用户名的文本框。下方是标记为“切换登录类型”的按钮。](img/ufig3_3.jpg)\n\
  \n用户名按钮。\n\n这并不总是我们希望的；因此，Vue 提供了一种方法来声明：“这两个项目是完全独立的——不要复用它们。” 包含一个具有不同值的 `key`\
  \ 属性即可：\n\n```\n<template v-if=\"loginType === 'username'\">\n  <label>Username</label>\n\
  \  <input placeholder=\"Enter username\" key=\"username-input\">\n</template>\n\
  <template v-else>\n  <label>Email</label>\n  <input placeholder=\"Enter email address\"\
  \ key=\"email-input\">\n</template>\n```\n\n每次切换时，这些输入框将从头重新创建。尝试一下吧。\n\n![旁边提供了一个用于输入用户名的文本框。下方是标记为“切换登录类型”的按钮。](img/ufig3_4.jpg)\n\
  \n用户名按钮。\n\n由于它们缺少 `key` 属性，`<label>` 元素仍然被高效地复用。\n\n#### v-show\n\n`v-show` 指令是条件显示元素的另一种选择。用法相同：\n\
  \n```\n<h1 v-show=\"ok\">Hello!</h1>\n```\n\n区别在于，带有 `v-show` 的元素始终会被渲染并保留在 DOM\
  \ 中；`v-show` 只是切换元素的显示 CSS 值。\n\n需要注意的是，`v-show` 不支持 `<template>` 元素，且无法与 `v-else`\
  \ 配合使用。\n\n#### v-if vs v-show\n\n由于 `v-if` 保证了条件块内的事件监听器和子组件在切换期间会被适当地删除和重建，因此它是“真正的”条件渲染。\n\
  \n`v-if` 也是懒的：如果条件在首次渲染时为假，它将什么都不做——在条件第一次变为真之前，条件块不会被绘制。\n\n相比之下，`v-show` 更直接：无论初始状态如何，元素始终通过\
  \ CSS 切换呈现。\n\n通常，`v-if` 的切换开销更大，而 `v-show` 的初始渲染成本更高。因此，如果你需要频繁切换内容，请使用 `v-show`；如果条件在运行时不太改变，请使用\
  \ `v-if`。\n\n#### v-if 与 v-for\n\n不建议将 `v-if` 和 `v-for` 同时使用。更多信息请参阅样式指南。\n\n当与\
  \ `v-if` 使用时，`v-for` 的优先级高于 `v-if`。\n\n#### v-else-if\n\n`v-else-if` 指令像 `v-else`\
  \ 一样可以与 `v-if` 指令结合使用。\n\n例如：\n\n```\n<div v-if=\"type == 'bus'\">\n   <p>Bus</p>\n\
  </div>\n<div v-else-if=\"type == 'books'\">\n   <p>Books</p>\n</div>\n<div v-else-if=\"\
  type == 'animals'\">\n   <p>Animals</p>\n</div>\n<div v-else>\n   <p>None of the\
  \ above</p>\n</div>\n```\n\n\n\n\n\n```css\n/*reset.css*/\n/* RESETS */\n*,\n*::before,\n\
