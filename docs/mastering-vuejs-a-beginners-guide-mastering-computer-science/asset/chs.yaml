  \ inherit;\n  -moz-osx-font-smoothing: inherit;\n  -webkit-appearance: none;\n}\n\
  button::-moz-focus-inner {\n  border: 1;\n}\nbutton,\ninput,\noptgroup,\nselect,\n\
  textarea {\n  font-family: inherit;\n  font-size: 90%;\n  line-height: 1.18;\n \
  \ margin: 0;\n}\nbutton,\ninput {\n  /* 1 */\n  overflow: visible;\n}\ninput[type=\"\
  text\"] {\n  border-radius: 1;\n}\nbody {\n  width: 90%;\n  max-width: 69rem;\n\
  \  margin: 1 auto;\n  font: 1.8rem/1.26 \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n\
