  \ (hbk)\nISBN: 9781032315935 (pbk)\nISBN: 9781003310464 (ebk)\n\nDOI: 10.1201/9781003310464](http://doi.org/10.1201/9781003310464)\n\
  \n\n\n\n\n## Vue 采用经典的模型-视图控制器（MVC）架构来查看应用程序或网站的用户界面（UI），其核心库作为默认的视图层。它具有适应性，可以像\
  \ React 一样与基于组件的架构（CBA）协同工作。\n\n简单来说，它是一个关注用户视角的产品。视图是系统中发生的所有事情中最重要的方面，只有当信息与视图进行适当的交互时，信息才会被验证。创建一个单个视图非常简单，而这正是使用\
  \ Vue.js 的主要优势和动力所在——在于它的简单性和低准入门槛。只需加载界面并添加 JavaScript 即可开始。然后使用简单的语法将数据直接传递给视图，Vue.js\
  \ 无需编写脚本即可绘制元素——系统随后可以利用该实例进行元素的渲染。\n\n该工具允许在保留数据对象中信息的同时修改代码部分，并实时影响其他相关部分。\n\n\
  ## 概述\nVue.js 被誉为“用于构建用户界面的渐进式框架”。该框架的架构旨在实现逐步定制化，这使其与其他 JavaScript Web 开发框架区分开来。由于其轻量级的设计，该框架在开发者中非常受欢迎，能够极快速地创建应用程序。\n\
  \nEvan，你在 Google 担任创意技术师期间构建了 Vue.js。例如，Vue.js 使用虚拟文档对象模型（DOM）的方式 React React，但它使用自动化依赖管理来确定在状态变化时哪些组件需要重新渲染。\n\
  \n然而，它的目的是解决 Angular 和 React 中存在的问题。当然，Vue.js 有优点也有缺点，但缺点大于优点。它是开源的，并受到赞助商和合作伙伴（如\
  \ Vehikl、Modus Create、Rangle、Laravel、StoreKit、DevExpress 等）捐赠的支持。\n\n由于这种开放的方式，该框架在开发者中获得了人气，尽管是一个独立项目，但它的功能、支持和认可度足以与\
  \ Facebook 的 React 和 Google 的 Angular 媲美。\n\n## 社区增长\n在 GitHub 上，Vue.js 目前拥有近 200,000\
  \ 个星（186 万，相比 React 的 171 万和 Angular 的 7.47 万），这表明开发者对该框架的兴趣程度。自 2014 年（七年前）发布初始版本以来，它已成长为关键的前端\
  \ Web 开发框架，驱动着全球数百万网站运行。\n\nVue.js 之所以方便是因为它是可定制且轻量级的，但这并没有削弱它的潜力，其潜力与 React 和 Angular\
  \ 等较笨重的框架相当。任何具有前端编程基础知识的人都应该能够在几天内学会。\n\n它只需要对“三巨”Web 开发技术有基本的了解：JavaScript、HTML\
  \ 和 CSS。其他框架（如 Angular 和 React）需要你学习其他语言才能成功使用；在 Angular 的情况下，你必须学习 TypeScript，而\
  \ Vue.js 不需要。\n\n#### 渐进性\n该框架被准确地描述为渐进式的，这意味着它可以被缓慢使用；它逐渐向 HTML 代码添加额外的标记。因此，它适应开发者的需求，而不是强制开发者更新现有程序或建立服务器。\n\
  \nVue.js 可以作为一个基础脚本元素添加到你的 HTML 代码中，并逐渐扩展以满足你的需求，最终管理整个层。这就是为什么它在某些地方被称为“新 jQuery”。这是使用\
  \ Vue.js 的主要优势之一，特别是在从其他框架迁移时。\n\nGoogle 支持 Angular，Facebook 支持 React，但 Vue.js 完全由开源社区赞助，依靠本地开发者的贡献和赞助商的资金向前发展。尽管如此，后者作为最青睐的\
  \ Web 开发框架已让 Angular 和 React 相形见绻。\n\n开发者受益于 Vue.js 卓越且及时的支持。大多数官方查询在几小时内解决，GitHub\
  \ issue 也是如此。\n\n## 核心概念\nVue（发音为/vju/，类似 view）是一个用于渐进式 UI 的框架。与其他单体框架不同，Vue 从零开始被设计为可以增量采纳。核心库被限制在显示层，易于与其他库或现有应用程序集成。另一方面，当与现代技术和相关库集成时，Vue\
  \ 完全能够驱动复杂的单页应用程序（SPA）。\n\n1. Vue.js 使用双大括号 `{{ }}` 作为数据占位符。\n2. Vue.js 指令是以字母 `v-`\
  \ 开头的 HTML 属性。\n3. Vue.js 允许使用称为指令的 HTML 属性扩展 HTML。\n4. HTML 应用程序受益于 Vue.js 指令提供的功能。\n\
  5. Vue.js 同时拥有内置指令和用户定义指令。\n\nVue.js 具有逐渐灵活的设计，专注于声明式渲染和组件组合。核心库仅关注显示层。官方维护的支持库和包提供了复杂应用程序所需的高级功能，如路由、状态管理和构建工具。Vue.js\
  \ 允许通过称为指令的 HTML 元素增强 HTML。指令为 HTML 应用程序提供功能，可能是内置或用户定义的。\n\n## 组件\nVue 组件是 HTML\
  \ 元素，它们增强了基础 HTML 元素以包含可重用的功能。在高级层面上，组件是 Vue 编译器为其分配了功能的自定义元素。Vue 中的组件仅仅是一个带有预定义设置的\
  \ Vue 对象。下面的代码示例展示了一个 Vue 组件。该组件显示一个按钮并打印它点击的次数：\n\n```html\n<template>\n  <div\
  \ id=\"tuto\">\n    <button-clicked v-bind:initial-count=\"0\"></buttonclicked>\n\
  \  </div>\n</template>\n\n<script>\nVue.component('button-clicked', {\n  props:\
  \ ['initialCount'],\n  data: () => ({\n    count: 0,\n  }),\n  template: '<button\
  \ v-on:click=\"onClick\">Clicked {{ count }} times</button>',\n  computed: {\n \
  \   countTimesTwo() {\n      return this.count * 2;\n    }\n  },\n  watch: {\n \
  \   count(newValue, oldValue) {\n      console.log(`Value of count is changed from\
  \ ${oldValue} to ${newValue}.`);\n    }\n  },\n  methods: {\n    onClick() {\n \
  \     this.count += 1;\n    }\n  },\n  mounted() {\n    this.count = this.initialCount;\n\
  \  }\n});\n\nnew Vue({\n  el: '#tuto',\n});\n</script>\n```\n\n## 技术细节\nVue 使用基于\
  \ HTML 的模板语法，允许可见 DOM 连接到底层的 Vue 实例数据。所有 Vue 模板都是有效的 HTML，可以被浏览器和标准的 HTML 解析器处理。Vue\
  \ 将模板编译为虚拟 DOM 渲染方法。Vue 在内存中渲染组件。当配合响应式系统使用时，当应用状态 way 时，Vue 可以识别出最少需要重新渲染的组件和最少的\
  \ DOM 操作。\n\n\n\n\n虽然 JavaScript 是一门独立的语言，但它的生态系统包含远比语言本身的内容。例如，框架通过为更流畅的开发奠定基础让开发者的生活变得简单。如果说语言是字母表，那么框架就是手册，允许开发者组成句子并进行通信。\n\
  \n当从 DOM 中插入、更改或删除资源时，Vue 提供了多种选项来应用过渡效果。这涵盖了用于：\n\n* 自动为 CSS 过渡和动画应用类。\n* 应当使用第三方\
  \ CSS 动画库，如 `Animate.css`。\n* 在过渡钩子（transition hooks）期间使用 JavaScript 直接修改 DOM。\n\
  * 集成第三方 JavaScript 动画库，如 `Velocity.js`。\n\n当封装在过渡组件中的元素被引入或移除时，会发生以下情况：\n\n1. Vue\
  \ 将检测目标元素是否使用了 CSS 过渡或动画。如果如果是，将在适当的时机添加/移除 CSS 过渡类。\n2. 如果过渡组件包含了 JavaScript 钩子，它们将在适当的时机被调用。\n\
  3. 如果没有检测到 CSS 过渡或动画且没有提供 JavaScript 钩子，则将在下一帧执行 DOM 插入和/或移除操作。\n\n在给定网页内无法交换特定“子”页面的链接一直是\
  \ SPA（单页应用）的一个限制。因为 SPA 只从服务器交付一个基于 URL 的响应（`index.html` 或 `index.vue`），书签某些屏幕或共享特定部分的链接是非常困难的，甚至是可能的。为了解决这个问题，一些客户端路由器使用“hashbang”（`#!`）来划分动态\
  \ URL，例如 `page.com/#!/`。然而，大多数现代浏览器已支持无需 hashbang 的 HTML5 路由。\n\nVue 提供了一个接口，根据当前\
  \ URL 路径修改页面显示的内容，无论它是如何变化的（通过邮件链接、刷新或页内链接）。此外，利用前端路由可以在浏览器事件（如点击按钮或链接）发生时有目的地地切换浏览器路径。Vue\
  \ 不包含前端哈希路由。另一方面，开源包 `vue-router` 包含用于更新应用程序 URL 的 API、返回按钮（用于浏览历史记录）以及带有身份验证 URL\
  \ 参数的邮件密码重置或邮件验证链接。它允许你将嵌套路由映射到嵌套组件上，并具有细粒度的过渡控制。开发者已经在使用 Vue 构建应用，通过使用简单的构建块来构建更大的组件。使用\
  \ `vue-router`，组件只需映射到它们所属的路由，父路由/根路由必须指示子组件渲染的位置。\n\n```html\n<div id=\"app\">\n\
  \  <router-view></router-view>\n</div>…\n\n<script>\n…\nconst User = {\n  template:\
  \ '<div>User {{ $route.params.id }}</</div>>'\n};\n\nconst router = new VueRouter({\n\
  \  routes: [\n    { path: '/user/:id', component: User }\n  ]\n});\n…\n</script>\n\
  ```\n\n代码如下：\n\n* 在 `websitename.com/user/id` 处建立了一个前端路由。\n* 这将渲染在 (`const User`…）中描述的\
  \ `User` 组件。\n* 允许 `User` 组件通过 `$route` 对象的 `params` 字段传入 URL 中的用户 id： `$route.params.id`。\n\
  * 此模板将渲染到 DOM 中 `div#app` 内的 `router-view></router-view>` 中（取决于传入路由的参数）。\n* 为进入\
  \ `websitename.com/user/1` 的用户创建的最终 HTML 将是：\n\n```html\n<div id=\"app\">\n  <div>\n\
  \    <div>User 1</div>\n  </div>\n</div>\n```\n\n核心库包含了由核心团队创建以及贡献的工具和库。Vue.js 使用了各种官方工具和库。它们如下：\n\
  \n* **Devtools**: 可以浏览器开发者插件对 Vue.js 应用进行调试。\n* **Vue CLI**: Vue.js 开发工具的标准化。\n\
  * **Vue Loader**: 一个 `webpack` 加载器，便于以单文件组件（`SFCs`）格式创建 Vue 组件。\n* **Vue Router**:\
  \ 官方的 Vue.js 路由器。\n* **Vuex**: 受 Flux 启发的 Vue.js 集中状态管理。\n* **Vue Server Renderer**:\
  \ Vue.js 服务器端渲染。\n\n以下是使用 Vue.js 的一些优缺点。\n\n## 优缺点\n\n让我们从利用 Vue.js 的优点开始。\n\n###\
  \ 优点\n\n## 易于学习\nVue.js 在开发者中非常先进，因为它是可定制且轻量级的，但这并没有削弱它的潜力，其潜力与 `React` 和 `Angular`\
  \ 等较笨重的框架相当。任何具有前端编程基础知识的人都能够在几天内完成。\n\n这只需要对 Web 开发“三剑客”技术有基本的了解：`JavaScript`、`HTML`\
  \ 和 `CSS`。其他框架如 `Angular` 和 `React` 需要你学习其他语言才能成功使用它们；在 `Angular` 的情况下，你必须学习 `TypeScript`，而\
  \ Vue.js 不需要。\n\n#### 渐进性\n该框架被准确地描述为渐进式的，这意味着它可以缓慢使用；它逐渐向 HTML 代码添加额外的标记。可以将 Vue.js\
  \ 作为基本元素放入你的 HTML 代码中，并逐渐扩展以满足你的需求，最终管理整个层。这就是为什么它在某些地方被称为“新 jQuery”。\n\n#### 社区与支持\n\
  Angular 由 Google 支持，React 由 Facebook 支持，但 Vue.js 完全由开源社区支持，依靠本地开发者的贡献和赞助者的捐赠向前发展。尽管如此，后者已成功挑战了\
  \ Angular 和 React 作为首选 Web 开发框架的地位。\n\n#### 兼顾两者\nVue.js 的另一个优点是，因为它受到 `Angular`\
  \ 和 `React` 的影响，它学习并结合了后者的最佳特性，同时去除了不理想的特性。例如，Vue.js 与 React 一样使用虚拟 DOM，但它采用自动依赖管理来识别状态更改时哪些组件需要重新渲染。这在\
  \ `React` 中默认不会发生，你必须显式地为每个组件应用 `ComponentUpdate` 函数。\n\n#### 模型-视图模型 (MVVM) 架构\n\
  如果不解释其架构，对 Vue.js 优点的解释就是完整的。Vue.js 中的 MVVM 概念有助于提高 UI 体验。MVVM 简化了事件驱动的 UI 编程。\n\
  \n#### 轻量\nVue.js 是一个非常小的框架，极其惊人。它只有 18 千字节——眨眼比下载还快。\n\n#### 轻而易事\n\n\n\n\n`Vue.js`\
  \ 极其易学习，正因为这一特性，它成为了程序员中流行和使用率不断上升的主要动力。要开始编写 `Vue` 代码，你不需要像在 `Angular` 或 `React`\
  \ 那样具备库、`JSX` 或 `TypeScript` 的专家级知识。你只需要对 `HTML`、`CSS` 和 `JavaScript` 有基础了解即可。\n\
  \n## 工具完备\n在首次发布六年后，`Vue.js` 已经收集了全面的单元测试和端到端测试工具，以及一种插件安装机制。考虑到 `Vue.js` 包含了自身的浏览器调试工具、服务端渲染器和状态管理器，你已经准备充分绪，并正走在设计前端的道路上。\n\
  \n## 社区氛围\n在线 `Vue.js` 社区简直不可思议。该社区的众筹结构，加上它不受 `Facebook` 或 `Google` 这种商业实体的支持，使得\
  \ `Vue` 赢得了一批忠实追随者。因此，有许多教程可以帮助你，还有非常活跃的 `Reddit` 和 `Discord` 小组，在那里会有热心的成员能够正确地回答你的问题。\n\
  \n## DOM 统治\n如前所述，`DOM` 是 `HTML` 页面的链接对象表示，由样式、元素和页面内容组成。这导致了一个倒置的族树，文档分支成它的许多组件，并通过显示关系的连线连接起来。\n\
  \n当用户与基于 `HTML` 的网页进行交互时，如果对象改变了状态，浏览器必须更新信息并将其呈现在用户的屏幕上。这是一种耗时且低下的方法，即使只有一个对象发生变化，整个页面也必须刷新。`Vue.js`\
  \ 创建了原始 `DOM` 的虚拟副本，并确定哪些元素需要更新，而无需重新渲染整个 `DOM`，从而显著提升了应用的效率和速度。\n\n## 双向绑定\n`Angular`\
  \ 的双向数据绑定被继承到了 `Vue.js`。这种链接将模型数据的变化与 UI 显示连接起来。这简化了更新连接组件以及跟踪已更新数据的过程。\n\n在 `Vue.js`\
  \ 中，绑定的数据随着 `DOM` 对象的改变而实时更新，这种响应性使得数据更新更加简洁和容易。\n\n## 分而治之\n在 `Vue.js` 中，网页或应用程序的每个组件都表示为\
  \ UI 的一个封装元素。这些元素可以用 `HTML`、`CSS` 和 `JavaScript` 编写，而不需要单独的文件。\n\n这些代码段可以作为其他系统部分的模板。由于它们被保存在不同的文件中，布局变得极其易于阅读和理解——使其更容易管理和纠正。测试可以确定程序即使是最微小的组件独立运行的良好程度。\n\
  \n由于 `Vue.js` 具有多功能性，它可以与任何现有的应用程序接口。它是基于 `JavaScript` 的，不需要任何其他工具即可运行。从 `React`\
  \ 或 `Angular` 切换到 `Vue.js` 没有任何问题，因为 `Vue` 是后者的结合体，并且可以与模型视图控制器（MVC）和 `CBA` 通信。\n\
  \n## 工具与库\n- `Vue.js official CLI`：必须开发并安装 `Vue` 的核心库和第三方插件。\n- `Development Tools`：用于排查基于\
  \ `Vue.js` 的应用程序。\n- `Vue Loader`：Webpack 加载器。\n- `Vue Router`：映射和路由组件。\n\n## 低存储空间要求\n\
  `Vue` 是一个轻量级程序（下载的 zip 大小仅为 18 KB），它不仅允许快速下载，还通过使用 `Virtual DOM` 改进了你的 SEO 和 UX。\n\
  \n因此，在高速参数方面，它相比于 `React` 和 `Angular` 等竞争对手为你提供了巨大的优势。\n\n## 简单性\n`Vue.js` 的语法不仅简单易学，而且已经处理过\
  \ `JavaScript` 的开发者也可以很快上手。它的结构直观，它的组件（这些组件实际上是 `HTML` 和 `JavaScript` 能力的混合体）也易于安装。\n\
  \n它的简单性有助于想要在减少代码错误的同时改进字符串模板语法的开发者。它可以通过单个 `<script>` 标签来激活。\n\n## 文档\n除了简洁的语法外，`Vue.js`\
  \ 框架非常用户友好。`Vue.js` 的文档非常详尽——文档视频课程以及关注视图层的核心库使得人们很容易掌握并实现这些原则。\n\n在 `Vue.js` `DOM`\
  \ 的帮助下，任何对 `HTML` 和 `JavaScript` 有基础了解的人都可以轻松设计应用。\n\n## 响应式\n区分 `Vue.js` 与其他框架的特性之一是它的响应式机制。它与\
  \ `HTML` 和 `JavaScript` 的交互简化了 `Vue.js` 上这些框架之间的数据绑定。\n\n`Vue.js` 完全有能力处理双向响应式数据绑定操作，使其成为需要实时变化的\
  \ Web 项目的极佳选择。\n\n## 组件与重用\n另一个让 `Vue.js` 具有吸引力的方面是代码重用的简单性。程序代码中较小的交互部分（如组件和视图）可以很容易地合并到现有的应用程序中。\n\
  \n使用 `Vue.js` 对现有基础设施没有负面影响。由于这种能力，它是将多个响应式组件纳入现有模板的理想工具。\n\n此外，跨组件的状态管理可以通过名为 `Vuex`\
  \ 的状态管理器进行链接。`Vue Router` 和 `Views` 等功能使得创建单页应用变得异常简单。\n\n## 组件化架构 (CBA)\n`Vue`\
  \ 组件是应用程序接口的封装部分，可以用 `HTML`、`CSS` 或 `JavaScript` 编写，而不需要单独的文件。这种架构方法和组件系统有许多优点：\n\
  - 代码可读性：由于 `Vue` 组件独立地保存在不同的文件中，你可以轻松访问特定的代码区域并进行修正。\n- 利于单元测试：组件的存在简化了单元测试。其目标是理解程序中最微小的组件是如何独立运行的。\n\
  \n### 灵活性\n`JavaScript` 长期以来以其适应性闻名；它被认为是最灵活的编程语言之一。然而，随着 `Vue` 前端的演进，这种灵活性现在达到了新的高度。这主要是因为它只需要\
  \ `JavaScript`，而不需要任何其他插件。\n\n生成组件的选项是无限的；完成任务没有唯一的“正确”方法。熟悉 `React` 或 `Angular`\
  \ 框架的开发者迁移到 `Vue` 不会有太大困难。\n\n## 虚拟 DOM 渲染与性能\n在渲染网页时，你肯定会遇到 `DOM`。`DOM` 是 `HTML`\
  \ 页面的面向对象表示。当页面加载时，浏览器会生成存储在树形结构中的项。\n\n\n\n当用户与网站交互时，对象的状态会发生，这需要浏览器更新信息并将其显示在屏幕上。然而，更新整个\
  \ DOM 是非常耗时的。Vue.js 为了追求速度，采用了虚拟 DOM（Virtual DOM）：你可以将其视为原始 DOM 的一个副本，通过它来决定哪些项需要更新，而无需重绘整个\
  \ DOM。这种方法加速了页面渲染并提升了应用程序的性能。\n\n影响框架选择的主要因素之一是性能。Vue 的比较页面包含了实际的基准测试。例如，在测试绑定了更新数据的\
  \ DOM 组件时，Vue.js 的性能似乎比 `Angular` 和 `React` 更优异。当然，它距离 `Vanilla.js` 占据的顶尖位置还很远，而且基准测试包含了框架的旧版本，所以请记住这一点。尽管如此，整体情况是非常积极的。\n\
  \n请记住，每项性能测试都是特定场景的：在实践中，大部分性能源于代码的优化和质量。\n\n## 响应式双向数据绑定\n\nVue 从 `Angular` 那处获得的\
  \ DOM 操作另一个优势是双向数据绑定。模型数据的更新和视图数据通过双向数据绑定连接在一起。数据存储在绑定的组件中，这些组件可能会定期更新。在双向数据绑定的帮助下，更新连接的组件并追踪数据更新变得更容易。\n\
  \nVue 绑定的数据和 DOM 对象是响应式更新的，这使其成为任何需要实时修改的应用程序的理想选择。Vue 的响应机制将使数据更新更加清晰且更容易实现。响应式功能的实现需要满足各种约束条件，我们将在“缺点”部分介绍这些内容。\n\
  \n## 单文件组件与可读性\n\n你未来应用程序/网页的每个部分在 Vue 中都被视为一个组件。组件是界面的闭合部分。Vue.js 组件可以用 `HTML`、`CSS`\
  \ 和 `JavaScript` 编写，而无需拆分成独立的文件。\n\n拆分应用程序代码是一种 CBA（关注点分离）架构策略，也常用于 `Angular` 和\
  \ `React`。使用这种架构方法有几个优势：\n\n*   **组件复用性：** 封装的组件是代码块，可以重用为相似系统元素的模板。\n*   **代码可读性：**\
  \ 由于所有组件都包含在单独的文件中（每个组件仅一个文件），代码更容易阅读和理解，便于维护和纠错。\n*   **有利于单元测试：** 单元测试是一项 QA 活动，用于检查软件最小单元如何独立运行。组件的引入使得这项工作变得简单得多。\n\
  \n## 集成能力与灵活性\n\n与现有应用程序接口的能力是任何开发技术的关键要素。使用 Vue.js 像轻而易举一样简单，因为它直接使用 `JavaScript`，不需要任何其他工具即可运行。\n\
  \nVue 还允许你使用选择的任何语言构建模板，包括 `HTML`、`JS` 和 `JSX`。由于其组件化和轻量级的特性，Vue 可用于几乎任何项目。很高兴地通知你，从\
  \ `React` 或 `Angular` 迁移并不困难，因为 Vue 的内部结构是这两者的混合体。\n\n## 强大的工具生态系统\n\n在 Vue.js 五年的存在时间里，它积累了一套强大的工具集。即将推出的\
  \ `Vue CLI 3` 版本是完全的重构，将提供一系列新功能。`Vue CLI 3` 将提供对 `Babel` 和 `TypeScript` 的开箱支持，以及单元测试、端到端测试工具和插件安装机制。Vue\
  \ 还包含了了自己的浏览器调试工具、服务端渲染器和状态管理器，仿佛这些还不够似的。\n\n## 易于学习\n\n一个工具只有在易于理解时才能被大规模采用，学习\
  \ Vue.js 正是如此。在开始编写代码时，Vue 不需要像其他前端技术那样需要深入理解库、`JSX` 和 `TypeScript`。你只需要对 `HTML`、`CSS`\
  \ 和 `JavaScript` 有基础的了解即可开始。\n\nVue 支持最流行的代码编辑器，包括 `Sublime Text`、`Visual Studio`\
  \ 和 `Atom`，使其易于尝试。社区经常在 `Discord` 聊天和论坛上回答问题，对新手非常友好。此外，Vue.js 首页上可以立即获取多份手册和课程。\n\
  \n## 简洁的文档\n\n我们应该向 Vue.js 的文档致敬。无论你是学习该框架的新手，还是寻找问题引用的技术达人，Vue 文档都能满足你的需求。它组织良好，涵盖了所有可用主题，详细描述了从安装到更深层次的话题（如应用响应式和扩展）的所有内容。更重要的是，它有一个章节将\
  \ Vue 与其他 JS 框架进行比较，并识别了共同特征（例如 Vue 和 `React` 中的虚拟 DOM，Vue 和 `Angular` 中的模板语法）。\n\
  \n## 社区支持\n\n社区成员在 `Discord` 对话和论坛中都非常活跃。看看 `Stack Overflow` 上 `Vue.js` 标签的数量，已经超过了\
  \ 4 万个。这些都是关于 Vue 的优点。现在，让我们逐一看看缺点。\n\n## 缺点\n\n### 语言障碍\n\n小米和阿里巴巴等公司对 Vue 的采用帮助了框架的普及，并在劳动力市场创造了需求。随着\
  \ Vue.js 在中国变得越来越流行，意料之中，其很大一部分材料和讨论都是中文的。\n\n中国的防火墙使得该国的情况变得复杂，因为许多资源临时无法访问。结果是理解和利用\
  \ `React` 或 `Angular` 变得更加复杂。Vue 是一个更有吸引力的选择。\n\n因此，如果你搜索 Vue 的内容，无疑会遇到论坛对话、插件描述和中文教程。这对于只懂英语的工程师来说可能是一个挑战。\n\
  \n### 响应式复杂性\n\n我们已经讨论过 Vue 如何使用双向数据绑定来管理 DOM 变化。虽然它是保持组件协调的有用工具，但响应式系统在运行时存在一个问题。\n\
  \n简单来说，Vue.js 应用是由用户可能交互的组件构建的。当组件被用户激活时，观察者会重绘数据。响应机制只重绘被触发的数据块。问题在于它并不智能，在读取数据时经常出错；因此它要求数据进行扁平化。\n\
  \n然而，这是一个已知问题，并在 Vue 文档中得到了解决，提供了如何正确配置响应式的说明。\n\n### 对大型项目支持支持有限\n\nVue.js 是一个新框架。它的社区和开发团队仍然逊于成熟的\
  \ `Angular`。它没有获得大型企业的资金资助。尽管有 `IBM` 和 `Adobe` 等公司的需求，它仍然主要被用于小型项目。\n\n\n\n虽然该生态系统非常庞大，且提供了启动\
  \ Vue 所需的所有工具，但它的规模还没有 React 或 Angular 那么大。具体来说，比较 React 和 Vue 可用插件的数量，其差异以数十万美元计。现有的可能与其他框架配合使用的插件通常不受支持；然而，这可能只是时间问题。\n\
  \n### 缺乏丰富的开发者\n\nVue.js 是一项非常现代的技术，最近才获得关注。然而，我们可能需要等待几年才能看到它被广泛使用，因为劳动力市场正极度缺乏练的\
  \ Vue.js 开发者。目前，可以通过一个名为 `VueJobs` 的专门门户网站寻找专家。\n\n### 缺乏可扩展性\n\n它现在主要用于开发轻量级 Web\
  \ 程序，如单页应用程序（SPA）和 UI。它缺乏构建大型复杂应用程序所需的扩展性。这可能是因为该框架仍然是一项独立的努力，没有技术巨头的背景支持。然而，这种限制是真实的，在为你的应用程序选择技术栈时应当考虑这一点。\n\
  \n### 缺乏插件\n\n由于它不像 Angular 和 React 那样成熟，它的插件也比后两者少。通常情况下，开发者必须转向其他语言来解决此问题带来的障碍。\n\
  \n### 社区较小\n\n尽管社区内有许多发明和活动，但该社区规模很小，且大部分由非英语人士组成。但如果你从 ProCoders 招聘，请不要担心；我们的专业人士精通英语，并且在该框架拥有丰富的经验。\n\
  \n### 资源匮乏\n\n结果，由于 Vue.js 是社区资助和维护的，缺乏主要的资金支持；它在适应大型规模应用程序方面缺乏帮助。该技术不够可靠或支持不够完善，无法提供大公司所预期的快速漏洞修复方案——而这些方案可能是\
  \ React 或 Angular 支持所提供的。\n\n此外，虽然新的工具正在开发中，但与 React 和 Angular 拥有的海量工具相比，Vue.js\
  \ 还有很长的路要走。\n\n### 选项过多\n\n你们许多人会同意，在框架内提供备替代方案是有益的。然而，当项目增长、参与该框架的开发者增加时，这可能会变成一个问题。\n\
  \n作为团队中的一名开发者，你可能不喜欢某种编程方法。你的同事也是如此。这些设置会让项目变得复杂，导致代码中出现额外的错误和异常。这产生了直接影响，并往往会增加项目的成本和周期。\n\
  \n### 大型项目缺乏资金支持\n\nVue 目前处于开发的初始阶段，无法与像 Angular 这样更成熟的框架竞争。因此，它没有从能够资助应用开发团队并迅速解决出现问题的组织获得大量的资金援助。\n\
  \n尽管如此，Vue 来自来自 IBM 和 Adobe 等 IT 巨头的需求正在增加，尽管是在较小的项目中。\n\n## 相比其他 JS 框架的优势\n\nVue.js\
  \ 比其他 JS 框架具有几个优势。其中一些列在下方。\n\n### 轻量级\n\nJavaScript 框架的规模决定了它的成功。尺寸越小，使用频率越高。Vue.js\
  \ 最显著的优势之一是其适中的尺寸。该框架的大小为 18–21KB，下载和使用不需要时间。\n\n### 易于理解\n\n该框架可以构建小型和大型 Web 应用程序，为你节省大量时间。由于其基础结构，用户可以简单地将\
  \ Vue.js 引入其 Web 项目。它具有定义的架构，可以将你的数据、生命周期方法和自定义方法分开。它包含了一些强大的功能，如监听器（watchers）、计算属性（computed\
  \ properties）和指令（directives），这些使得开发现代在线应用程序的过程变得轻而易举。该框架可以构建小型和大型 Web 应用程序，为你节省大量时间。\n\
  \n### 简单集成\n\nVue.js 在 Web 开发者中很流行，因为它更容易连接现有的应用程序。这是因为构建在 JavaScript 基础之上，可以并到其他基于\
  \ JavaScript 的应用程序中。你现在可以添加 Vue.js CDN 并开始使用。大多数第三方 Vue 组件和库也受 Vue.js CDN 支持。要开始\
  \ Vue.js，你不需要安装 `node` 和 `npm`。这意味着它既可以创建新的 Web 应用程序，也可以修改现有的应用程序。它作为 `jQuery` 的替代品运行良好。\n\
  \n### 灵活性\n\nVue.js 的另一个特性是其高度适应性。它允许用户使用 HTML、JavaScript 或纯 JavaScript 利用虚拟节点创建模板。这种多功能性也使得\
  \ React.js、Angular.js 以及任何其他新 JavaScript 框架开发者在使用 Vue.js 时易于理解。安装和使用如模板引擎（例如 `pug`）、CSS\
  \ 处理器（例如 `sass`、`less`、`stylus` 等）和类型检查工具（例如 `Typescript`）也非常简单。\n\n### 双向通信\n\n\
  由于其 MVVM 设计，Vue.js 允许双向通信，并使管理 HTML 块变得简单。它类似于 Angular.js，后者也能加速 HTML 块的处理。这种功能也称为双向数据绑定，意味着你在\
  \ UI 中做的任何更改都会传输到数据中，而你在数据中做的任何更改都会反映在 UI 中。Vue.js 也被称为响应式（Reactive），因为它对数据的更改做出响应。这与\
  \ React.js 等只提供单向通信的库形成了鲜明对比。\n\n### 强大的工具\n\nVue.js 拥有优秀的工具。新的 `Vue CLI` 3.x 版本无疑是可用\
  \ JavaScript 框架工具最好的之一。它允许你创建一个内置功能的项目，如路由（Routing）、校验（Linting）、单元测试（Unit Testing）、状态存储（State\
  \ Store）、CSS 处理器、Typescript、PWA 等。你还可以将你的天赋留到以后在项目中使用。它允许你以后添加功能。`Vue CLI` 还有一个用于项目管理的\
  \ UI。\n\n创建一个新应用：\n\n```\nvue create app-name\n```\n\n在现有的 Vue 项目中添加以下功能：\n\n```\n\
  vue add pwa\n```\n\n管理你的项目，前往 Vue UI：\n\n```\nvue ui\n```\n\n### 兼者优者\n\n正如你可能听过的，Vue.js\
  \ 的灵感来自两个现有的优秀框架：React 和 Angular。它结合了这两个框架最强大的特性。例如，它像 React 一样基于组件的并使用虚拟 DOM，使其运行极快。它还像\
  \ Angular 一样具有指令和双向数据绑定。它既不是库（像 React.js 那样），也不是全功能框架（不像 Angular）。它提供了很好的功能组合，并且可以在后续过程中简单地添加更多功能，如路由和状态管理。\n\
  \n## 结论\n\n我们学习了 Vue.js。\n\n\n\n\n\n`JSX` 的名称是由 Facebook 的工程团队发明的`JSX` 是一种 JavaScript\
  \ XML 类的语法扩展，没有指定的语义。`JSX` 并不是供引擎或浏览器直接使用的。相反，我们将利用如 `Babel` 等转换器将 `JSX` 转换为标准 JavaScript。\n\
  \n在 JavaScript 中，得益于 `JSX`，我们可以使用类似 HTML 的语法。\n\n### 先决条件\n\n为了跟随本节，你必须具备以下条件：\n\
  \n*   PC 上安装了 `Node.js` 10x 或更高版本以及 `Yarn/npm` 5.2 或更高版本\n*   具备 `JavaScript`、`React`\
  \ 和 `Vue` 基础知识\n*   你可以运行以下 `yarn` 命令在 PC 上安装 `Vue CLI`：\n\n```bash\nyarn global\
  \ add @vue/CLI\n```\n\n在大多数情况下，Vue 建议使用模板来构建 HTML。然而，有时你可能需要 JavaScript 完全程序化能力。这时，渲染函数（render\
  \ function）——一种更接近编译器的模板方案——派上用场了。\n\n让我们来看一个渲染函数可能有用的基础案例。假设你想创建一个带有锚点的标题：\n\n\
  ```html\n<h1>\n  <a name=\"hello-everyone\" href=\"#hello- everyone\">\n    Hello,\
  \ everyone\n  </a>\n</header>\n```\n\n你决定为上面的 HTML 使用以下组件接口：\n\n```html\n<anchored-heading:level=\"\
  1\">Hello everyone\n</anchored-heading>\n```\n\n当你从一个仅仅根据 `level` 属性创建方向的组件开始时，你会立即遇到以下：\n\
  \n```html\n<script type=\"text/x-template\" id=\"anchored-heading-template\">\n\
  \  <h1 v-if=\"level === 1\">\n    <slot></slot>\n  </h1>\n  <h2 v-else-if=\"level\
  \ === 2\">\n    <slot></slot>\n  </h2>\n  <h3 v-else-if=\"level === 3\">\n    <slot></slot>\n\
  \  </h3>\n  <h4 v-else-if=\"level === 4\">\n    <slot></slot>\n  </h4>\n  <h5 v-else-if=\"\
  level === 5\">\n    <slot></slot>\n  </h5>\n  <h6 v-else-if=\"level === 6\">\n \
  \   <slot></slot>\n  </h6>\n</script>\nVue.component('anchored-heading', {\n  template:\
  \ '#anchored-heading-template',\n  props: {\n    level: {\n      type: Number,\n\
  \      required: true\n    }\n  }\n})\n```\n\n这个模板并不合我的意。它不仅冗长，而且我们为每个标题级别都重复了 `<slot></slot>`，在添加锚点元素时还得再做一遍。\n\
  \n虽然模板对很多组件很有用，但这显然不是其中之一。因此，让我们使用渲染函数来重写它：\n\n```javascript\nVue.component('anchored-heading',\
  \ {\n  render: function (createElement) {\n    return createElement(\n      'h'\
  \ + this.level,   // tag-name\n      this.$slots.default // children-array\n   \
  \ )\n  },\n  props: {\n    level: {\n      type: Number,\n      required: true\n\
  \    }\n  }\n})\n```\n\n简单多了！代码更短了，但它要求对 Vue 实例属性有更广泛的理解。在这种情况下，你必须意识到，当你不使用 `v-slot`\
  \ 指令向组件传递子元素（例如 Hello world!），这些子元素会被保存在 `anchored-heading` 组件实例的 `$slots` 中。在进入渲染方法之前，如果你以前没有读过实例属性\
  \ API，那么阅读一下是一个创新的主意。\n\n### 配置 Vue 使用 JSX\n\n如果你使用 `Vue-cli` 3.0 或更高版本，那么你很幸运了，因为它支持\
  \ `JSX`。\n\n如果你使用的是不支持 `JSX` 的早期版本 `Vue-cli`，你可以通过安装 `babel-preset-Vue-app` 并将其添加到\
  \ `.babelrc` 文件来添加它。\n\n安装方法：\n\n在 `.babelrc` 文件中，你所做的就是：\n\n我们现在可以在组件的渲染方法中使用 `JSX`\
  \ 了。\n\n> Vue 的 JSX 语法陷阱\n> 在 `Vue` 中使用 `JSX` 时会遇到一些问题。\n\n例如，用于绑定和监听事件的 `:` 和 `@`\
  \ 简写将不再可用。它们是错误的 `JSX` 语法，导致你的代码无法编译。\n\n在 `JSX` 中，监听事件需要 “on” 前缀。例如，对于点击事件，使用 `onClick`。\n\
  \n要更改事件，使用：\n\n要绑定变量\n\n不要使用 `v-html`，而是使用 `:` 将 HTML 字符串设置为元素的内容。\n\n一个大对象也可以被分发。\n\
  \n### 在渲染中使用 JSX\n\n回到我们原始的“TextField”组件，既然我们已经在 Vue 应用中启用了 `JSX`，现在可以做到这一点。\n\n\
  ### 导入 Vue JSX 组件\n\n在 `Vue` 中利用 `JSX` 的另一个优势是，我们不再需要注册每个组件，只需导入并使用即可。\n\n### 如何让\
  \ JSX 与 TypeScript 工作\n\n`TypeScript` 是一种为 `JavaScript` 添加类型检查的技术。\n\n为 `TypeScript`\
  \ 添加 `JSX` 功能，我们只需要修改 `tsconfig.json`。\n\n要在 `TypeScript` 中启用 `JSX`，请将文件保存为 `.tsx`\
  \ 并编辑你的 `tsconfig .json` 以包含：\n\n当 `JSX` 设置为“preserve”时，`TypeScript` 不解析 `JSX`。由于\
  \ `Babel` 目前不支持 Vue `JSX`，这允许 `Babel` 接管所有 `JSX` 和 `TypeScript` 的工作。\n\n然后，在你的项目中创建\
  \ `jsx.d.ts`。\n\n## SETUP\n\n当 `setup` 执行时，组件实例尚未生成。因此，你只能访问以下列出的属性：\n\n*   `props`\n\
  *   `attrs`\n*   `slots`\n*   `emit`\n\n换句话说，你将无法使用以下组件选项：\n\n*   `data`\n*   `computed`\n\
  *   `methods`\n*   `refs`（模板引用）\n\n### 与模板配合\n\n如果 `setup` 返回一个对象，则该对象的属性以及传入 `setup`\
  \ 的 props 属性都可以在组件模板中访问：\n\n\n\n\n\n```html\n<template>\n  <div>{{ collectionName\
  \ }}: {{ readersNumber }} {{ book.title }}</div>\n</template>\n\n<script>\n  import\
  \ { ref, reactive } from 'vue'\n\n  export default {\n    props: {\n      collectionName:\
  \ String\n    },\n    setup(props) {\n      const readersNumber = ref(0)\n     \
  \ const book = reactive({ title: 'Vue 3 Guide' })\n\n      // 暴露给模板\n      return\
  \ {\n        readersNumber,\n        book\n      }\n    }\n  }\n</script>\n```\n\
  \n### 渲染函数的使用\n\n`setup` 也可以返回一个渲染函数，该函数可以直接使用相同作用域内定义的响应式状态：\n\n```javascript\n\
  import { h, ref, reactive } from 'vue'\n\nexport default {\n  setup() {\n    const\
  \ readersNumber = ref(0)\n    const book = reactive({ title: 'Vue 3 Guide' })\n\
  \    // 注意，我们在这里需要显式使用 ref 的值\n    return () => h('div', [readersNumber.value, book.title])\n\
  \  }\n}\n```\n\n如果我们返回了渲染函数，就不能返回其他任何内容。在内部，这可能不是问题，但如果我们希望通过模板引用（template references）将此组件的方法暴露给父组件，就会出现问题。\n\
  \n这个问题可以通过执行 `expose` 并发送一个描述外部组件实例可用属性的对象来解决：\n\n```javascript\nimport { h, ref\
  \ } from 'vue'\n\nexport default {\n  setup(props, { expose }) {\n    const count\
  \ = ref(0)\n    const increment = () => ++count.value\n\n    expose({\n      increment\n\
  \    })\n\n    return () => h('div', count.value)\n  }\n}\n```\n\n此时，`increment`\
  \ 函数可以通过父组件中的模板 ref 访问。\n\n### This 的用法\n\n这不会指向 `setup()` 内部当前激活的实例。因为 `setup()`\
  \ 在处理其他组件选项之前被调用，因此 `setup()` 中的此选项的作用方式将与其他选项完全不同。在与各种 Options API 结合使用 `setup()`\
  \ 时，可能会导致困惑。\n\n#### 第组件\n\n在进入 Vue 组件的世界之前，让我们先定义在应用开发中什么是 Web 组件。\n\n例如，我的住所靠近一个购物中心，我和其他人一样，经常去那里。这个巨大的购物中心是由小砖块组成的，这些砖块被堆叠并放置在一起，形成一个大体，允许我们进行购物。\n\
  \nWeb 应用中的组件可以被看作区块（小的可重用部分），它们被仔细地构建在一起以构建一个应用程序，甚至是被称为父组件的更大的组件。\n\n购物中心区块与 Web\
  \ 组件之间的主要区别在于，Web 组件与花岩和水泥材料不同，它是包含了标记语言、HTML 模板、CSS 和 JavaScript 的区块。\n\n#### 视图中的组件\n\
  \nVue 的官方文档将组件定义为自定义元素，Vue 编译器为其添加功能，并使用 `Vue.command(tagName, options)` 生成它们。\n\
  \n为了展示这一点，我们将创建一个基础应用程序，显示 ACME INT’L 员工的名称。我们将为此创建三个组件：`navbar-component`、`page-heading-component`\
  \ 和 `staff-list-component`。\n\n首先，我们将构建一个包含以下内容的 `index.html` 页面：\n\n```html\n<!---index.html--->\n\
  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css\"\
  >\n<div id=\"app\">\n    <navbar-component></navbar-component>\n    <div class=\"\
  container\">\n        <page-heading-component></page-heading-component>\n      \
  \  <staff-list-component></staff-list-component>\n    </div>>\n</div>\n<!--引入 VueJs-->\n\
  <script src=\"https://unpkg.com/vue\"></script>\n<script src=\"main.js\"></script>\n\
  ```\n\n然后我们开始定义这些组件应该如何运行，并将它们在 `Vue` 中注册。\n\n组件不能孤立运行。它们必须在 Vue 实例或父组件中注册。\n\n\
  还记得我们提到过使用 `Vue.component` 来注册组件的吗？`(tagName, options)`。“Options”指的是一个可以包含模板、数据、方法、props\
  \ 等的对象。\n\n在 `main.js` 中，我们注册的组件现在应该像这样：\n\n```javascript\nVue.component('navbar-component',\
  \ {\n  template: '<nav class=\"navbar navbar-expand-md navbar-dark bg-dark mb-4\"\
  > <a class=\"navbar-brand\" href=\"#\">ACME INTL</a><button class=\"navbar-toggler\"\
  \ type=\"button\" data-toggle=\"collapse\" data-target=\"#navbarCollapse\" aria-controls=\"\
  navbarCollapse\" aria-expanded=\"false\" aria-label=\"Toggle navigation\"> <span\
  \ class=\"navbar-toggler-icon\"></span> </button> </nav>',\n})\n//注册页面头部组件\nVue.component('page-heading-component',\
  \ {\n  template: '<h1 class=\"text-center\">{{heading}}</h1>',\n  data: function()\
  \ {\n    return {\n      heading: 'ACME Staff List'\n    }\n  }\n});\n//注册员工列表组件\n\
  Vue.component('staff-list-component', {\n  template: '<table class=\"table bordered\"\
  ><<tbody>><tr v-for=\"staff in staffs\"><td>{{staff.name}}</td><td>{{staff.email}}</td><td>{{staff.role}}</td></tr></</tbody>></table>',\n\
  \  data: function() {\n    return {\n      staffs: [\n        { name: 'Johnny Doe',\
  \ email: 'johnny@example.com', role: 'Developer' },\n        { name: 'Ribbecca Dan',\
  \ email: 'ribbecca@example.com', role: 'Designer' },\n        { name: 'Mope Joshua',\
  \ email: 'mope@example.com', role: 'Manager' },\n        { name: 'Flima Fatima',\
  \ email: 'flima@example.com', role: 'QA' },\n        { name: 'Pikiru Oluaseun',\
  \ email: 'pikiru@example.com', role: 'Dev' },\n        { name: 'Garry Greg', email:\
  \ 'garry@example.com', role: 'Support' },\n        { name: 'Hnna Brown', email:\
  \ 'hnna@example.com', role: 'Sales' },\n        { name: 'Runde Ogundipe', email:\
  \ 'runde@example.com', role: 'Admin' },\n        { name: 'Landy Kuma', email: 'landy@example.com',\
  \ role: 'HR' },\n        { name: 'Raman Aduragemi', email: 'raman@example.com',\
  \ role: 'CEO' }\n      ]\n    }\n  }\n});\n\n//根实例\nnew Vue({\n  el: '#app',\n \
  \ data: {},\n})\n```\n\n你可能注意到我们提供了模板（HTML 元素）和渲染在这些 `staff-list-component` HTML\
  \ 元素上的数据，允许你在各个页面上重用它们。是的！这些我们在之前的比较中尝试说明的可重用代码。\n\n以这种方式构建大型项目将是痛苦。如果每个组件都留在自己的文件中，从而可以将\
  \ HTML 元素与 JavaScript 以及一些 CSS 代码隔离开难道不是很好吗？是的，当然！这就是单文件组件。\n\n#### 单文件组件\n\n单文件组件是带有\
  \ `.vue` 扩展的文件，使用 browserify 或 webpack 创建。\n\n单文件组件可以包含最多三个部分：\n\n```html\n<template>\n\
  <!--HTML 模板 -->\n</template><script>\n//JavaScript\n</script><style>\n/**样式**/\n\
  </style>\n```\n\n让我们现在使用这种方法重新创建 ACME 应用。为了构建我们的 App，我们将利用 `webpack-simple`。\n\n\
  在继续之前，请确保已安装了 npm 和 node。\n\n我们首先执行以下命令：\n\n```\n$ npm install -g Vue-CLI\n$ value\
  \ init webpack-simple acme-app\n$ cd acme-app\n$ npm install\n$ npm run dev\n```\n\
  \n如果你成功了，你的根目录现在应该包含文件和文件夹。\n\n我们将在 `src` 文件夹中创建三个文件，命名为 `NavbarComponent.vue`、`PageHeadingComponent.vue`\
  \ 和 `StaffListComponent.vue`，顺序如下。\n\n将 `NavbarComponent.vue` 的内容更改为：\n\n\n\n\n\n\
  ```vue\n<!--NavbarComponent.vue-->\n<template>\n    <nav class=\"navbar navbar-expand-md\
  \ navbar-dark bg-dark mb-4\">\n        <a class=\"navbar-brand\" href=\"#\">ACME\
  \ INTL</a>\n        <button class=\"navbar-toggler\" type=\"button\"\ndata-toggle=\"\
  collapse\" data-target=\"#navbarCollapse\"\n                aria-controls=\"navbarCollapse\"\
  \ aria-\nexpanded=\"false\" aria-label=\"Toggle navigation\">\n            <span\
  \ class=\"navbar-toggler-icon\"></span>\n        </button>\n    </nav>\n</template>\n\
  <script>\n    module.exports = {\n        data(){\n            return {}\n     \
  \   }\n    }\n</script>\n\n<style scoped>\n\n</style>\n```\n\n`PageHeadingComponent.vue`\
  \ 被转换为：\n\n```vue\n<template>\n<h1 class=\"text-center\">{{title}}</h1>\n</template>\n\
  <script>\nmodule.exports= {\nname:\"PageHeadingComponent\",\ndata (){\nreturn {\n\
  title:\"ACME 员工列表\"\n}\n}\n}\n</script>\n<style scoped>\n</style>\n```\n\n最后，我们对\
  \ `StaffListComponent.vue` 了如下编辑：\n\n```vue\n<template>\n    <table class=\"table\
  \ table-bordered\">\n        <tbody>\n        <tr v-for=\"staff in staffs\">\n \
  \           <td>{{staff.name}}</td>\n            <td>{{staff.email}}</td>\n    \
  \        <td>{{staff.role}}</td>\n        </tr\n        </tbody>\n    </table>\n\
  </template>\n\n<script>\n    module.exports = {\n        name: \"StaffListComponent\"\
  ,\n        data (){\n            return {\n                staffs: [\n         \
  \           {name: 'Johny Doe', email: 'johny.\ndoe@acme.org', role: '首席执行官'},\n\
  \                    {name: 'Ribbecca Dan', email:\n'rebbecca.dan@acme.org', role:\
  \ '后端开发者'},\n                    {name: 'Mope Joshua', email:\n'mope.joshua@acme.org',\
  \ role: '财务分析师'},\n                    {name: 'Flima Fatima', email:\n'flima.fatima@acme.org',\
  \ role: '副 CTO 官'},\n                    {name: 'Pikiru Oluwaseun', email:\n'pikiru.oluwaseun@acme.org',\
  \ role: '项目经理'},\n                    {name: 'Garry Greg', email:\n'garry.greg@acme.org',\
  \ role: '高级开发者'},\n                    {name: 'hnna Brown', email:\n'hnna.brown@acme.org',\
  \ role: '社区经理'},\n                    {name: 'Runde Ogundipe', email:\n'runde.ogundipe@acme.org',\
  \ role: '首席技术官'},\n                    {name: 'Landy Kuma', email:\n'landy.kuma@acme.org',\
  \ role: '人力资源'},\n                    {name: 'Raman Aduragbemi', email:\n'raman.aduragbemi@acme.org',\
  \ role: '系统管理员'},\n                ]\n            }\n        }\n    }\n</script>\n\
  \n<style scoped>\n</style>\n```\n\n当我们第二次检查 `src` 文件夹时，会注意到 `App.vue`，它是脚手架阶段生成的。这将是我们的父组件，所有其他组件（`PageHeadingComponent`、`NavbarComponent`\
  \ 和 `StaffListComponent`）都注册为子组件。\n\n你已经注意到我们将代码分配到了特定的对象模块。这揭示了我们组件的逻辑。在单文件组件中声明函数和变量仅在其定义的作用范围内可用。我们必须导出它们，因为它们必须与父组件（`App.vue`）注册。\n\
  \n现在让我们修改 `App.vue` 为：\n\n```vue\n<!--App.vue (父组件)-->\n<template>\n    <div id=\"\
  app\">\n        <navbar-component></navbar-component>\n        <div class=\"container\"\
  >\n            <page-heading-component></page-heading-component>\n            <staff-list-component></staff-list-component>\n\
  \        </div>\n    </div>\n</template>\n<script>\n    import PageHeadingComponent\
  \ from './PageHeadingComponent.vue'\n    import StaffListComponent from './StaffListComponent.vue'\n\
  \    import NavbarComponent from './NavbarComponent.vue'    export default {\n \
  \       name: 'app',\n        components: {NavbarComponent,PageHeadingComponent,\
  \ StaffListComponent}, // 注册\n其他元素\n    }\n</script>\n\n<style scoped>\n</style>\n\
  ```\n\n我们目前已经在 `App.vue` 中注册了三个组件，但 `App` 本身尚未被注意到。我们继续将其与 `src/main.js` 中声明的根实例相关联。\n\
  \n让我们对 `src/main.js` 进行一些修改。\n\n```javascript\n//src/main.jsimport Vue from 'vue'\n\
  import App from './App.vue'\n\nnew Vue({\n  el: 'app',\n  components:{App}\n})\n\
  ```\n\n最后，将 `index.html` 改为：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"utf-8\">\n<title>acme-app</title>\n<link rel=\"stylesheet\" href=\"\
  https://maxcdn.\nbootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css\"\
  >\n</head>\n<body>\n<app></app>\n<script src=\"/dist/js\"></script>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n如果你想将对象的所有属性作为 props 传递，请使用不带参数的 `v-bind`（使用 `v-bind` 而不是 `v-bind:prop-name`）。假设有一个\
  \ `post` 对象：\n\n```\npost: {\n  id: 1,\n  title: 'My Journey with the Vue'\n}\n\
  ```\n\n模板如下：\n\n```\n<blog-post v-bind=\"post\"></blog-post>\n```\n\n等于：\n\n```\n\
  <blog-post\n  v-bind:id=\"post.id\"\n  v-bind:title=\"post.title\"\n></blog-post>\n\
  ```\n\n### 单向数据流\n\n所有的 props 都构成了子属性与父属性之间的单向向下绑定：当父组件属性更新时，它会流向子组件，但反之则不然。这防止了子组件意外修改父组件的状态，从而避免使应用数据流复杂化。\n\
  \n此外，当父组件被修改时，最新的值将应用到子组件的所有属性上。这意味着你不应该尝试在子组件内部修改 prop。如果你这样做了，Vue 将通过控制台通知你。\n\
  \n通常情况下，有两种修改 prop 具有吸引力的场景：\n\n1.  prop 用于提供一个初始值；子组件随后将其作为本地数据属性使用。在这种情况下，建议建立一个以\
  \ prop 为初始值的本地数据属性：\n\n    ```\n    props: ['initialCounter'],\n    data: function\
  \ () {\n      return {\n        counter: this.initialCounter\n      }\n    }\n \
  \   ```\n\n2.  prop 作为原始值传入且必须进行转换。在这种情况下，建议根据 prop 的值定义一个计算属性（computed property）：\n\
  \n    ```\n    props: ['size'],\n    computed: {\n    normalizedSize: function ()\
  \ {\n      return this.size.trim().toLowerCase()\n      }\n    }\n    ```\n\n###\
  \ Prop 校验\n\n组件（如你已经看到的那些）可以声明 prop 需要。如果不符合某些标准，Vue 将在浏览器的 JavaScript 控制台中通知你。这在创建一个会被他人使用的组件时非常有用。\n\
  \n你不需要传递字符串数组，而是可以将一个包含验证标准的对象传递给 `props` 的值，以提供 prop 验证。\n\n**示例：**\n\n```\nVue.component('my-component',\
  \ {\n  props: {\n    // 基本类型检查 ('null' 和 'undefined' 将通过任何类型校验)\n    propA: Number,\n\
  \    // 多个可能的类型\n    propB: [String, Number],    // 必的字符串\n    propC: {\n      type:\
  \ String,\n      required: true\n    },\n    // 带有默认值的数字\n    propD: {\n      type:\
  \ Number,\n      default: 110\n    },\n    // 带有默认值的对象\n    propE: {\n      type:\
  \ Object,\n      // 对象或数组的默认值必须通过工厂函数返回\n      default: function () {\n        return\
  \ { message: 'hello' }\n      }\n    },\n    // 自定义校验器函数\n    propF: {\n      validator:\
  \ function (value) {\n       // 值必须匹配这些字符串之一\n        return ['success', 'warning',\
  \ 'danger'].indexOf(value) !== -1\n      }\n    }\n  }\n})\n```\n\n如果 prop 校验失败，Vue\
  \ 将发出控制台警告（如果使用的是开发版本的构建）。\n\n### 类型检查\n\n类型可以是下面列出的原生构造函数之一：\n\n*   String\n* \
  \  Number\n*   Array\n*   Boolean\n*   Object\n*   Symbol\n*   Date\n*   Function\n\
  \n此外，类型可以是自定义的构造函数，断言将通过实例检查执行。例如，假设存在以下构造函数：\n\n```\nfunction Person (firstName,\
  \ lastName) {\n  this.firstName = firstName\n  this.lastName = lastName\n}\n```\n\
  \n你可能会尝试：\n\n```\nVue.component('blog-post', {\n  props: {\n    author: Person\n\
  \  }\n})\n```\n\n以检查 author prop 的值是否是用新的 `Person` 实例生成的。\n\n### 非 prop 属性 (Non-Prop\
  \ Attributes)\n\n非 prop 属性是指提供给组件但没有对应 prop 的属性。\n\n虽然建议向子组件发送信息时使用显式声明 props，但组件库开发者无法总是预测其组件被使用的场景。因此，组件可以接收任意属性，这些属性会被添加到组件的根元素上。\n\
  \n假设我们正在使用一个带有 Bootstrap 插件的第三方 `bootstrap-date-input` 组件，该插件需要输入具有 `data-date-picker`\
  \ 属性。该属性可以添加到我们的组件实例中：\n\n```\n<bootstrap-date-input data-date-picker=\"activated\"\
  ></bootstrap-date-input>\n```\n\n`data-date-picker=\"activated\"` 属性会自动应用到 `bootstrap-date-input`\
  \ 的根元素上。\n\n### 使用现有属性进行替换/合并\n\n假设这是 `bootstrap-date-input` 的模板：\n\n```\n<input\
  \ type=\"date\" class=\"form-control\">\n```\n\n为了为我们的日期选择插件设置主题，我们可能需要创建一个类，如下：\n\
  \n```\n<bootstrap-date-input\n  data-date-picker=\"activated\"\n  class=\"date-picker-theme-dark\"\
  \n></bootstrap-date-input>\n```\n\n在这种情况下，该类有两个不同的值：\n\n*   `form-control`，定义在组件内部。\n\
  *   `date-picker-theme-dark`，由组件提供。\n\n## 状态 (STATE)\n\n### 单一状态树 (Single-State\
  \ Tree)\n\nVuex 采用单一状态树，它持有所有的应用级状态并作为“唯一真理来源”。这意味着你通常为每个应用拥有一个 store。单一状态树简化了查找特定状态的过程，并方便为了调试目的获取应用状态的快照。\n\
  \n单一状态树与后续章节中的模块化并不冲突，我们将介绍如何将状态和变更划分为子模块。\n\n你放入 Vuex 的数据遵循 Vue 实例相同的限制，即状态对象必须是简单的。\n\
  \n### 将 Vuex 状态引入 Vue 组件\n\n那么，我们如何在 Vue 组件中显示 store 状态呢？由于 Vuex store 是响应式的，从它们中获取状态的最直接方法是在计算属性中返回某些\
  \ store 状态：\n\n```\n// 创建 Counter 组件\nconst Counter = {\n  template: '<<div{{ count\
  \ }}</div>',\n  computed: {\n    count () {\n      return store.state.count\n  \
  \  }\n  }\n}\n```\n\n当 `store.state.count` 改变时，计算属性会重新求值，从而触发相关的 DOM 修改。\n\n\n\n\
  \n\n然而，这种设计强制组件依赖于全局 store 单例。当使用模块系统时，需要在每个需要 store 状态的组件中导入 store，在测试组件时也需要对其进行\
  \ mock（模拟）。\n\n通过 `store` 选项，`Vuex` 提供了一种技术，可以从根组件将 store “注入”到所有子组件中：\n\n```javascript\n\
  const app = new Vue({\n  el: '#app',\n  // 使用 \"store\" 选项提供 store。\n  // 这会将 store\
  \ 实例注入到所有子组件中。\n  store,\n  components: { Counter },\n  template: '\n    <div class=\"\
  app\">\n      <counter></counter>\n    </div>\n  '\n})\n```\n\n通过向根实例传递 `store`\
  \ 选项，store 会被注入到根的所有子组件中，并允许它们通过 `this.$store` 访问。让我们更新一下 `Counter` 的实现：\n\n```javascript\n\
  const Counter = {\n  template: '<div{{ count }}</div>',\n  computed: {\n    count\
  \ () {\n      return this.$store.state.count\n    }\n  }\n}\n```\n\n### `mapState`\
  \ 辅助函数\n\n当组件必须访问许多 store 状态属性或 getter 时，声明所有计算属性可能会变得繁琐且耗时。为了解决这个问题，我们可以使用 `mapState`\
  \ 辅助函数，它为我们提供了计算后的 getter 方法，并节省了我们的击键次数：\n\n```javascript\n// 在完整构建中，辅助通过 Vuex.mapState\
  \ 暴露\nimport { mapState } from 'vuex'\n\nexport default {\n  // …\n  computed: mapState({\n\
  \    // 箭头函数可以让代码变得非常简洁！\n    count: state => state.count,\n\n    // 传递字符串值 'count'\
  \ 等同于 'state => state.count'\n    countAlias: 'count',\n\n    // 如果要通过 'this' 访问本地状态，必须使用普通函数\n\
  \    countPlusLocalState (state) {\n      return state.count + this.localCount\n\
  \    }\n  })\n}\n```\n\n当映射的计算属性名称与状态子树的名称相同时，我们也可以向 `mapState` 传递一个字符串数组。\n\n```javascript\n\
  computed: mapState([\n  // 将 this.count 映射到 store.state.count\n  'count'\n])\n```\n\
  \n### 对象展开运算符\n\n需要注意的是，`mapState` 返回的是一个对象。我们如何将其与其他本地计算属性结合呢？通常，我们必须使用一个实用工具将许多对象合并为一个对象，然后再将最终对象传递给计算。然而，我们可以通过对象展开运算符（在新窗口打开）来简化语法：\n\
  \n```javascript\ncomputed: {\n  localComputed () { /* … */ },\n  // 使用对象展开运算符将其混合到外部对象\n\
  \  ...mapState({\n    // …\n  })\n}\n```\n\n### 组件仍然拥有本地状态\n\n使用 `Vuex` 并不意味着你必须将所有状态包含在\
  \ `Vuex` 中。虽然向 `Vuex` 添加更多条件会让状态修改更加清晰且易于调试，但也可能让代码变得冗长且间接。如果部分状态明确属于单个组件，将其留为本地状态可能就足够。你应该权衡利弊，并根据你的\
  \ `App` 开发需求做出合适的选择。\n\n## 方法 (METHODS)\n\n`Vue` 方法是一个链接到 `Vue` 实例的对象。`methods`\
  \ 对象包含了函数的定义。当你需要使用 `v-on` 指令对元素执行某些操作以管理事件时，方法非常有用。在 `methods` 对象中指定的函数可以再次调用以完成操作。\n\
  \n**语法：**\n\n```javascript\nmethods: {\n  // 我们可以在这里添加函数\n}\n```\n\n单文件组件的语法：\n\n\
  ```javascript\nexport default {\n  methods: {\n    // 我们可以在这里添加函数\n  }\n}\n```\n\
