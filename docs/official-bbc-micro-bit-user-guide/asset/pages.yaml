    # Program 7: The Fruit Catcher Game


    The programs in this chapter have been relatively simple, for creating games,
    only one thing at a time, as a means of introducing some of the base concepts
    you need to know when programming the BBC microbit in JavaScript. This program,
    though, is considerably more complex: a game which has the player—in the form
    of a single glowing pixel at the bottom of the display—attempt to catch ever-faster
    falling fruit—another pixel, starting at the top of the display and falling downward—before
    it hits the bottom of the display.


    This program uses an instruction category not previously seen: The Game category.
    This is a category of instructions designed specifically for creating simple games,
    with built-in tools for keeping track of the score, displaying a ''game over''
    screen, creating single-pixel sprites—objects which can be moved around the display—and
    detecting when a sprite has collided with another sprite or the edge of the display.


    The Fruit Catcher Game is relatively simple but still quite a hefty program. If
    you have been working through this chapter nonstop, now might be a good time to
    take a break away from the screen so you can come refreshed.'
