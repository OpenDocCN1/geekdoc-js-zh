    This line represents a combination of three instructions (see Figure 7-12): display.scroll,
    which is used to scroll a string on the BBC micro:bit display as it did in the
    ''Hello, World!'' and Touch inputs; temperature(); and str to convert the number—or
    output—by the temperature into a string the display.scroll instruction can show
    on the BBC micro:bit display. This highlights a key feature of programming in
    Python: rather than putting a number into the display.scroll instruction, or a
    variable like earlier in this chapter, you can put a whole instruction there and
    have it print out the instruction''s output—in this case, the reading from the
    BBC micro:bit internal temperature sensor.


    ```

    1 from microbit import *

    2 while True:

    3 display.scroll(str(temperature()))

    ```


