  md: 'Pins 3, 4, 6, 7, 9, and 10 are all used to control the BBC micro:bit''s LED
    matrix display; they may be used as GPIO pins (and in the cases of Pins 3, 4,
    and 10 as analogue inputs) when the display is not in use.


    Pins 5 and 11 are linked to Button A and Button B, respectively. They are fitted
    with a pull-up resistor, meaning they are at 3V by default and must be brought
    low to register as an input.


    The small pins should not be used except with a compatible breakout board to allow
    safe electrical connections to be made. Examples of these breakout boards can
    be found in Chapter 11, ''Extending the BBC micro:bit''.


    When working with the BBC micro:bit''s pins, be aware of the following limitations:


    +   - You cannot draw more than 90mA from the 3V power supply pins.

    - All GPIO pins are limited to 0.5mA by default, with a maximum of three pins
    configurable to a 5mA high-current mode at any given time.

    - Pulse Width Modulation (PWM) output is available on a maximum of three pins
    at any given time.


    More detail on the BBC micro:bit''s pins and their functions can be found on the
    official website at tech.microbit.org/hardware/edgeconnector_ds/'
