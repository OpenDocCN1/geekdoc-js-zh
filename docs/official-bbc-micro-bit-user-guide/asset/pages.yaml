  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    The first step of this project should be obvious by now. Save your previous program
    if you haven''t already, and then press Ctrl+A followed by Delete to begin with
    a blank, fresh program listing before typing in the import and infinite loop lines:


    ```

    from microbit import *

