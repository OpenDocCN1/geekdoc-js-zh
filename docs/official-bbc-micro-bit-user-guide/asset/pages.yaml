    If you click the Download button, flash your new program version, and then shake
    the BBC micro:bit, you briefly see the surprised image before the asleep image
    takes over. If you were to continuously shake the BBC micro:bit without stopping—
    ''face'' would change from the surprised image to the asleep image and again over
    and relatively quickly. That''s not realistic; it takes time to get back asleep
    when you''ve been shaken awake!


    To fix that, you''re going to add a delay between the two display.show instructions.
    A delay does exactly what its name suggests: it pauses the program for a set length
    of time, delaying the execution of the next instruction. Move your cursor to the
    end of Line 4, press Enter to add a new, blank Line 5, and type the following
    (see Figure 7-16):


    ```

