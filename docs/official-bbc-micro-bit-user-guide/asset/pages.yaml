  md: '# # Chapter 12

    The Wearable BBC micro:bit


    In this chapter


    +   - A look at what makes the BBC micro:bit so well suited to wear-able and embedded
    projects

    - An explanation of conductive thread

    - The Rain-Sensing Hat: A semi-practical project for you to build


    **WHILE THE WORLD''S** first computers were literally the size of a room—or, in
    some cases, several rooms—the march of technology has given us devices of greater
    processing power which we can fit in our pockets. So as electronics became small
    enough, people started to find ways to carry them around all times. Pocket calculators
    led to digital watches, which eventually gave rise to the modern smartwatch (see
    Figure 12-1) and related devices like fitness trackers and location monitors.


    Although most people''s experience of wearable electronics is for tasks schedule
    notification and monitoring, the technology is used in a variety of fields. Hardware
    is being developed which aims to monitor the wearer''s health, with tiny pill-like
    sensors which can be swallowed to monitor internal health, and there are even
    devices which can actively improve conditions for Parkinson''s Disease.


    As electronics become ever-smaller and more powerful, it''s likely that the field
    of wearable electronics will steadily grow—and the BBC micro:bit is a great platform
    to begin your experiments in the field.


    *The Official BBC micro:bit® User Guide, First Edition., Gareth Halcaree.

    © 2018 by John Wiley & Sons, Inc. Published 2018 by John Wiley & Sons, Inc.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/a8e06f84ec80226aea02c25f7c99ab0e_244_0.png)


    FIGURE 12-1: A smartwatch-style wearable


    # # Advantages of the Wearable BBC micro:bit


    The BBC micro:bit has a range of features which make it extremely well suited
    to wearable projects, not the size of which it is. Measuring around half the size
    of a standard credit card, the BBC micro:bit is small and light enough to be integrated
    into clothing or worn directly on the body without causing discomfort.


    Another feature of the BBC microbit makes it easier to build practical electronics
    project. A small laptop computer can run from its battery for around eight hours;
    a modern smartwatch can go for one and four days between charges; a BBC microbit
    running from a pair of AA batteries (see Figure 12-2), however, can gather information
    from its sensors over a month without difficulty.


    The BBC micro:bit''s built-in display, sensors, and buttons make it an all-in-one
    device, too. Traditionally, a microcontroller is provided without these accessories,
    meaning you need to add them on yourself to build your wearable project. Naturally,
    the input-output pins on the BBC micro:bit mean that you can add extra hardware
    if your project requires it.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# CHAPTER 12 THE WEARABLE BBC MICRO:BIT


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_245_0.png)


    FIGURE 12-2: A BBC micro:bit running from batteries


    There''s a key extra feature that the BBC micro:bit—particularly well suited for
    wearable projects, and it''s not commonly seen in microcontrollers: support for
    conductive thread, which could be wound around the holes in the larger input-output
    pins to quickly make a solid electrical contact for fabric-based flexible, soft,
    and wearable circuits.


    # Conductive Thread


    For circuit to work, electricity has to be able to flow along conductors—the opposite
    of insulators—which are typically copper wires or copper tracks on a printed circuit.
    The copper-coloured input-output pins on the BBC micro:bit are conductors, while
    underneath the micro:bit''s surface are more copper conductors called tracks which
    serve to connect its components together.


    Copper wire is an excellent conductor, but it has its disadvantages. Chief among
    these is its weakness in the face of constant movement: as a wire bends backward
    and forward, the metal begins to weaken—a process known as metal fatigue—and eventually
    breaks. Once the wire has broken, it can no longer act as a conductor, and the
    circuit fails. The same is true of solder joints connecting wires to other components.
    Pressure on these solder joints'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'cause the solder or the copper to which it is connected to weaken and break,
    again causing the circuit to fail.


    Put together, these issues are a real problem for wearable projects. This is conductive
    thread comes in. As the name suggests, conductive thread is a sewable thread—similar
    to a thick cotton or woven nylon—which acts as a conductor, replacing the copper
    wire in circuits with a material that is flexible and soft to the touch (see Figure
    12-3).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_246_0.png)


    FIGURE 12-3: A spool of conductive thread


    Conductive thread is typically made of extremely fine strands of steel, sometimes
    with silver plating, woven in the same way as cotton to make a thick and strong
    thread (see Figure 12-4). As a rule of thumb, the thicker the thread, the more
    conductive it is and the more power it can supply to components. A thin thread
    may provide enough power for a small LED or a button, while a thicker thread—or
    multiple strands of thinner thread woven together—could provide enough power for
    a small display or motor.


    While copper wire is usually covered in plastic as an insulator, conductive thread
    is not. If you touch two conductive threads together, they act as a single conductor.
    As a result, you have to be careful when making a circuit with conductive thread.
    If you accidentally cross two sections of conductive thread, they create a short-circuit
    which at prevents your project from working properly and at worst damage components
    up to and including the BBC micro:bit itself.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# CHAPTER 12 THE WEARABLE BBC MICRO:BIT


    # 237


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_247_0.png)


    FIGURE 12-4: A length of conductive thread under a microscope


    The lack of insulator on conductive thread makes it easy to work with, however,
    and even allows you to build touch or moisture sensors without a single piece
    of extra hardware, and you''ll see later in this chapter.


    # Using Conductive Thread


    Conductive thread is easy to work with, but you need a few extra pieces of hardware
    to get started. Besides the thread itself, which is sold at most hobbyist electronics
    shops and websites under a variety of brand names, you need the following:


    +   - **A sewing needle**—When using conductive thread to add a circuit to fabric,
    you need a needle to pull it through. Make sure to consider the size of your thread
    when choosing a needle. Too small a needle, and you cannot insert your thread
    into its eye; too large a needle, and you''re accidentally pulling the end of
    the thread through the hole you just made.


    +   - **Fabric**—A conductive thread needs an insulator, like a printed circuit
    board, and this is typically fabric. Usually, this is whatever you are looking
    to build your wearable project on: gloves, a hat, a coat, and shoes are all suitable
    insulators. The thicker the material, though, and the harder it is to sew. Thick
    leather is considerably more difficult to work with than thin cotton.


    +   - **A needle threader**—Although not strictly necessary, a needle threader
    makes easier to use the needle with your conductive thread. This is particularly
    important using thicker thread, which can fray at the end making it difficult
    to fit through'
