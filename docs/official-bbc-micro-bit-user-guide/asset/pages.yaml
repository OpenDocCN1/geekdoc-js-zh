  md: '# CHAPTER 7 PYTHON


    If this is the first time using the compass, or if you''ve moved from one environment
    to another since the last time you used, you may be asked to calibrate it. If
    the message Draw a circle appears on the display when you run your program, simply
    do as asked: rotate the display and draw a circle so that the center of the display
    rolls around the edge of the display and draws a circle. When the circle is complete,
    the compass is calibrated and the program runs normally. The accuracy of the calibration
    is very dependent on environmental factors. If you''re calibrating the compass
    in an area surrounded by metal or near magnetic fields—such as on a desk or next
    to a set of speakers—the compass will not calibrate correctly. For the highest
    accuracy, always try to calibrate the compass in an environment as close to that
    in you''ll be using as possible.


    > TIP


    One neat feature of using the % symbol to add to strings is that you''re not limited
    to adding one: ''1 %s %s (%2'', ''3)'' results in 123, where ''1 %s %s (%2'',
    ''3'', ''4)'' gives 1234 and so on. You can keep adding strings using the % symbol
    without ever writing a second line of code. Try it by modifying the existing program
    to print out the degrees after the compass reading.


    As always, when you''ve finished, remember to click the Save button, making the
    result somewhere safe, and rename it to a descriptive name like compasssensor.py.


    # Program 6: The Accelerometer Sensor


    The second of the two sensors labelled on the rear of the BBC micro:bit, alongside
    the compass, is the accelerometer. Where the compass is designed to measure magnetic
    fields and thus determine which direction the BBC microbit is facing, the accelerometer
    measures acceleration in three planes: X, Y, and Z. As well as being able to return
    actual values, it can be used to detect different types of motion like gestures—by
    the simplest way to interact with the sensor in your programs.


    The accelerometer is a powerful tool. Besides being able to detect motion, it
    can be used to calculate the angle at which the BBC microbit is positioned by
    tracking the force of gravity pulling the BBC microbit towards the center of the
    Earth—even when the BBC microbit is sat securely on a table or held in your hand.
    This''s feature of an accelerometer that a smartphone or tablet uses to detect
    when you''ve turned it from portrait to landscape orientation or vice versa, so
    that it can automatically rotate the display to match.


    To begin, make sure you''ve saved, moved, and renamed your previous program. Then
    press Ctrl+A followed by Delete to start with a blank program listing.'
