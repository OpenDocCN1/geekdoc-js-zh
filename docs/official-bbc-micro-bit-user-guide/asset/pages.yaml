    # Robotics and the BBC micro:bit


    Despite its small size, the microbit is a powerful tool. Its internal sensors
    and relatively large number of programmable pins make it ideal for robotics projects.
    It''s small and light enough not to weigh whatever you build, and its low power
    draw longer battery life.


    You can build your robot using off-the-shelf components, but a number of companies
    have begun offering robot kits. Simply pick up a kit, assemble the robot, program
    the micro:bit, and slot it to complete the build.


    A selection of different robot kits is offered next as a representative sample.


    # Kitronik Line-Following Buggy


    A relatively simple two-wheeled robot, Kitronik''s Line-Following Buggy (see Figure
    15-5) adds a pair of extra sensors to the micro:bit itself: light-dependent resistors
    (LDRs). Using the LDRs and LED lights that shine underneath the buggy, the robot
    is capable of following a black line drawn on the floor without the need for a
    remote control.


    The kit includes everything you need to build the robot, including a motor driver
    board which allows the micro:bit to control the twin motors and a battery pack
    which holds AA batteries to power the motors and the micro:bit itself. Two sample
    programs are also provided: one which follows a line drawn on the floor, and the
    other which uses the micro:bit''s accelerometer to spin the robot around when
    it bumps into obstacles.


    More information on the Kitronik Line-Following Buggy can be found on kitronik.co.uk.'
