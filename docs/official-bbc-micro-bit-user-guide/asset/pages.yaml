    # Program 6: The Accelerometer Sensor


    The of the two sensors labelled on the rear of the BBC microbit, alongside the
    compass, is the accelerometer. Where the compass is designed to measure magnetic
    fields and determine which direction the BBC microbit is facing, the accelerometer
    measures acceleration in three planes: X, Y, and Z. As well as being able to return
    actual values, it can be used to detect different types of motion like gestures—by
    the simplest way to interact with your sensor.


    The accelerometer is a powerful tool; besides able to detect motion, it can be
    used to calculate the angle at which the microbit is positioned by tracking the
    force of gravity pulling the BBC microbit towards the centre of the Earth—even
    when the BBC microbit is sat on a table or in your hand. This feature of an accelerometer
    that a smart-phone or tablet can detect when you''ve turned it from portrait to
    landscape orientation or vice versa that can automatically rotate the display.


    To begin, click on the Projects menu, click on New, and then click on the Editor
    to create a blank project. Click on Untitled at the bottom of the screen; then
    type Accelerometer Sensor to name your new project. If this part of the process
    seems repetitive, good. Keep repeating it until it sense to always create a new
    project and give it a name; then you don''t run the risk of accidentally overwriting
    one of your previous projects or losing it in a sea of identically-named projects.


    This project uses the basic for( ) loop. Although you''ve left these lines in
    place previously—because there are no other lines of code inside, they are ignored
    when you try to run the program—you can tidy the program by deleting them. Highlight
    the entire program with the mouse or keyboard, and then press the Backspace or
    Delete key to give you a entirely blank program listing with only one line.


