  md: 'processor, but its antenna is with the marking ''BLE ANTENNA'' pointing to
    the upper-left corner of the board where specially-shaped circuit board traces
    act to receive and send radio signals.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_175_0.png)


    FIGURE 8-1: The BBC micro:bit processor with radio module


    Although there''s only one physical chip, there are actually two radio functions
    provided. The first function provides what is known as peer-to-peer connectivity,
    sending signals which can be received by any nearby BBC micro:bit. The second
    function uses Bluetooth Low Energy (BLE), a variant of the Bluetooth short-range
    wireless standard found in all smartphones and most tablets but modified to ensure
    the bare minimum power usage.


    The peer-to-peer radio function is the one if you want to create projects where
    BBC micro:modules communicate with each other. Whether you''re building a BBC
    micro:bit-powered doorbell, a multiplayer game, or a pager alert system, the peer-to-peer
    radio allows you to get started quickly and easily.


    # Program 1: One-to-One Communication


    The simplest use of the BBC micro:bit radio module is for one-to-one communication:
    sending a message from one BBC micro:bit and receiving it on another. This is
    known as peer-to-peer communication, as there is no central server. The first
    BBC micro:bit talks'
