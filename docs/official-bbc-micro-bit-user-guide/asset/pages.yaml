  md: '# 26


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_41_0.png)


    FIGURE 2-6: The BBC micro:bit''s reset button


    Regardless of why you want to start the program again, get used to using the reset
    button. While it''s technically possible to restart a program by disconnecting
    and reconnecting power, this puts unnecessary strain on the power connectors and
    can cause damage to the BBC micro:bit over time.


    You''ll never damage the BBC micro:bit using the reset button. Unlike a desktop
    or laptop computer, which must go through a shut-down process before being powered
    off, the micro:bit can be reset or powered off at any time without damage. Likewise,
    you can disconnect the micro:bit''s battery or USB cable almost any time without
    fear of damaging it. The only exception is when you''re loading a new program
    onto the BBC micro:bit, as described in Chapter 3. Although you won''t cause any
    permanent damage by removing the cable before the process has finished, you may
    end up with a BBC micro:bit that doesn''t respond properly. If this happens, simple
    reconnect it to your computer and try loading the program again.'
