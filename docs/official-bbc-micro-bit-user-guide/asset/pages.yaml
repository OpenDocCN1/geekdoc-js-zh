    The BBC micro:bit supports computers running Microsoft Windows 7 or later, Apple
    OS 10.6 or later, or Linux 3.0. Its clever design, though, means that it can work
    on even older machines, but if you experience any problems, the first step should
    always be to try the BBC micro:bit on a computer with these minimum operating
    systems versions.


    WARNING


    # Drag-and-Drop


    Unlike some boards, the BBC micro:bit does not require you to install any additional
    software or drivers on your computer in order to load new programs. Instead, it
    appears as a *USB Mass Storage Device*, in the same way as an external hard drive
    or flash memory. When you first connect it, don''t be surprised to see it running
    your sample program; the BBC micro:bit will continue to run whatever program was
    last loaded onto its memory whenever it has power, even as you''re preparing to
    load a new program of your own devising.


    Loading a program onto the BBC micro:bit is known as *flashing*, after the type
    of memory the BBC micro:bit uses for its storage: flash memory. More information
    about flash memory can be found at the end of this chapter, but for all you need
    to know is that when the BBC micro:bit appears in the same way as a storage device
    on your computer; it''s the flash memory you''re accessing.'
