  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    This small program is the entirety of the wearable''s logic. Line 1 places the
    BBC micro:bit in an infinite loop, while Line 2 clears the screen of anything
    it is currently displaying. Line 3 checks if Pin 0 has touched, and if it displays
    an image of an umbrella on the screen, pauses for 500 milliseconds, switches to
    a built-in icon of a chessboard handles down as rain, and pauses for another 500
    milliseconds before going back to the start of the loop, clearing the screen,
    and checking Pin 0 again.


    It may seem strange to testing Pin 0 for having been touched, but testing for
    rain and testing for touch in the same way: both rely on conductivity and resistance.
    One of your conductive threads connected to the GND pin and the other connected
    to Pin 0, completes the circuit and acts as a ''touch'' just as your finger does.


    There''s a reason for the umbrella being upside down. With the BBC micro:bit connected
    to the peak of the car by its input-output ports, it''s upside down, any picture
    you draw on the BBC micro:bit''s display in this manner is also upside down as
    a result, which means you can''t use the ''umbrella'' icon. The basic.show instruction
    is used to create a custom image, which is simply the existing image flipped upside
    down—making it right up to the person wearing the hat.


    Click the Download button and flash the program onto your micro:bit. To test if
    it works, you can touch the conductive threads on top of your car with your finger
    or sprinkle a little water on them to simulate rain. If everything''s working,
    the BBC micro:bit begins to alternate between the umbrella and rain images. If
    the images before you pressed or wet the conductive threads, the threads are touching
    and creating a short; look closely to find out, and then adjust so they''re no
    longer touching each other.


    > Electricity and water don''t mix. Although it''s perfectly safe to get a car
    a little wet while testing the rain sensor, make sure you don''t accidentally
    soak the BBC micro:bit located underneath the peak. If the BBC micro:bit gets
    wet when it''s powered on, it''s likely to short out and break.


    # Battery Power


    The only thing left to finish your wearable is to power it. Disconnect the micro-USB
    cable, if it is currently connected, and then take your battery pack and insert
    fresh batteries, making sure to put them in the right way. Take the JST connector
    on the end of the battery pack''s wires and insert it into the battery connector
    on the BBC micro:bit, making sure it''s the right way around. The red, positive
    wire goes to the small + symbol is on the board, and the black, negative wire
    goes to the – symbol. The connector is keyed to prevent you from putting it in
    backward; if it doesn''t seem to be fitting properly, double-check that it''s
    the right way up and try again.


    WARNING'
  merge: -1
  pgno: 256
