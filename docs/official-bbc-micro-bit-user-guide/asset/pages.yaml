  md: 'Variable names should always be as descriptive as possible, their purpose within
    the program is obvious. There are restrictions on the names you can use, though.
    You can''t use a name which is reserved for an instruction in the programming
    language you''re using, a name typically can''t begin with a number, and a name
    can''t contain spaces or other symbols. To make variables with mult words clearer
    without spaces, it''s common practice to use camel case: ''Number of Fish'', for
    example, becomes ''numberOfFish'' in camel case; ''Age of User'' becomes ''ageOfUser''.
    Camel case itself is written as ''camelCase'' to make its use more obvious.


