    # Program 6: The Accelerometer Sensor


    The second of two sensors labelled on the rear of the BBC microbit, alongside
    the compass, is the accelerometer. Whereas the compass is designed to measure
    magnetic fields, and thus determine which direction the BBC microbit is facing,
    the accelerometer measures relative activation in three planes: X, Y, and Z. As
    well as being able to return actual sensor values, it can be used to detect different
    types of motion known as gestures—by far the simplest way to interact with the
    sensor in your projects.


    The accelerometer is a powerful tool. Besides being able to detect motion, it
    can be used to calculate the angle at which the BBC microbit is tracking by the
    force of gravity pulling the BBC microbit towards the centre of the Earth—even
    when sat on or held in your hand. This''s this feature of an accelerometer that
    a smartphone or tablet uses detect when you''ve turned it from portrait to landscape
    orientation or vice versa, that it can automatically rotate the display to match


    To begin, click on the Projects menu and then click New to create a blank project.
    Click on Untitled at the bottom of the screen; then type Accelerometer Sensor
    to name your new project. If this part of the process feels repetitive, keep repeating
    until it''s second nature to always create a new project and give it a name; then
    you won''t run the risk of accidentally overwriting one of your previous programs
    or losing it in a set of identically projects.


    This project uses neither of the [forever] or [start] blocks. You''ve left these
    blocks in place previously—because there are no blocks inside, they are simply
    ignored when it''s time to run the program—you can update the Workspace by deleting
    it. Right-click on the [start] block and click the Delete Block option, or click
    and drag the block back to the Blocks toolbox, which will turn into a dustbin
    icon. Then do the same to the [forever] block.'
