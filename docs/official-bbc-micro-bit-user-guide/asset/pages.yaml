- img_proc: true
  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    A red LED has a forward current of 25mA and a forward current of 1.7V. Knowing
    that the BBC micro:bit uses 3V power, you can now calculate the precise value
    of resistor required to protect the LED: (3 - 1.7) / 0.025 = 52\Omega Other LEDs
    have other values; blue and white have higher current requirements than green
    or red, and LEDs sold as ''ultrabright'' still have needs.


    Often the value you get from the equation doesn''t match any common value of resistor,
    in which case you simply round up to the nearest resistor value you have to hand.
    In this example, a 68\Omega resistor protects the LED perfectly with a small amount
    of brightness; rounding down to a 47\Omega resistor may also work, but with a
    wide tolerance may allow enough current to flow and damage the LED over enough
    time.


    Note, however the BBC micro:bit''s edge connector is not designed for high-current
    devices. Your chosen LED may have a forward current of 25mA, the BBC micro:bit
    edge connector is only capable of providing around 0.5mA before the voltage drops
    below its 3V. For individual LEDs, this doesn''t matter. You might find your LED
    is dimmer than you would expect, but it won''t do any damage. For other devices,
    such as motors or long strips of multiple LEDs, a given pin on the edge connector
    will switch off to protect the BBC micro:bit before enough current to run the
    device. In these cases, you will need an external power supply and a transistor
    or other controlling component to activate and deactivate the high-current device.


    If you have no documentation for your LEDs—if they were salvaged from old electronics,
    for example—then always err on the side of caution. Try higher-value resistors,
    and if the LED seems too dim, step down until you find a suitable value. Remember,
    you can replace the resistor, but when the LED has blown, it''s gone for good!


    Put your circuit using the following instructions so it matches Figure 10-8, as
    always making sure that if you''re using crocodile clips they are attached to
    the BBC micro:bit securely and not accidentally bridging any of the smaller pins
    and beginning with the BBC micro:bit switched off.


    +   1. Take the LED between your fingers and look at its metal legs. The longer
    is called the anode, and the shorter one is called the cathode. Attach a crocodile
    clip to the longer leg (anode), and connect the other end of the wire to Pin 1
    of the BBC micro:bit using either a crocodile clip or a banana plug.


    +   2. Attach another crocodile clip to the shorter leg of the LED, and then attach
    the other end of the wire to one leg of your current-limiting resistor. The resistor
    works either way around, so don''t worry about which the coloured bands are facing.


    +   3. Attach a final crocodile clip to the other leg of the resistor, and then
    connect the other end to the GND pin on the BBC micro:bit using a crocodile clip
    or banana plug to complete the circuit.'
