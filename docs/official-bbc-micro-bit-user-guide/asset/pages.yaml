  md: '# CHAPTER 10 BUILDING CIRCUITS


    The following two sections describe the I2C buses in general detail. These are
    advanced connections designed primarily for use with more complex add-on devices;
    if you''re eager to learn building your first project with simpler blocks like
    switches and LEDs, skip the following two sections and continue with the rest
    of the chapter.


    # Serial Peripheral Interface (SPI)


    The Serial Peripheral Interface (SPI) is commonly used to talk to add-on hardware
    such as displays and keyboards. It uses Pins 13 through 15 of the BBC:bit edge
    connection. Pin 13 provides the Serial (SCK) signal, Pin 14 the Master Input Slave
    Output (MISO) signal, and Pin 15 the Master Output Slave Input (MOSI) signal.


    If you''re connecting the BBC microbit to an SPI device, make sure you wire the
    pins in the right order: SCK should go to SCK, MISO to MISO, and MOSI to MOSI
    on both devices. This is in contrast with other methods of serial communications
    where marked ''input'' need to be connected to pins marked ''output'' and vice
    versa. You can use multiple SPI devices with the BBC microbit by using GPIO pins
    as Chip Select (CS) pins, one pin per device.


    For details on how to use the SPI bus, see the documentation that came with your
    SPI-compatible device.


    # Inter-Integrated Circuit (I2C)


    The Inter-Integrated Circuit (I2C, pronounced ''squared C'') is typically used
    to talk to more complex add-on devices powered by their own microcontrollers or
    processors. These signals are available on Pins 19 and 20 of the BBC:bit edge
    connection. Pin 19 provides the Clock (SCL) and Pin 20 the Data (SDA) signals.


    One of the major benefits of the I2C bus is that it allows for a large number
    of devices in a single circuit. Using I2C, it is possible to connect multiple
    slave devices to a single microbit—or to connect multiple microbits to a single
    I2C bus master device. The accelerometer and magnetometer both connect to the
    I2C bus and cannot be disabled. As a result, the I2C pins cannot be used as general-input-output
    (GPIO) pins even if you are not using the I2C bus in your projects.


    With the SPI bus, if you''re looking to connect an I2C device to the BBC microbit,
    you should consult the documentation that came with your hardware for instructions.


    # Universal Asynchronous Receiver/Transmitter (UART)


    The microbit''s UART is responsible for handling the serial connection, but it
    can also be reassigned to a pair of the edge pins: one pin to transmit data, and
    the other pair to receive data. This allows the BBC:microbit to communicate with
    external devices that have their own UART, including other BBC microbits.'
