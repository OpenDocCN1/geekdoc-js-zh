    # Reading Resistor Colour Codes


    Before you build the next circuit, you need to know how to tell the value of resistor
    apart. Frankly, through-hole electronic components are clearly labelled: capacitors
    have their capacitance, measured in farads, printed on their casing while crystals
    have their frequency marked. Resistors, too, are marked with their values, but
    not in numbers; they use a colour code.


    The surface of a through-hole resistor is covered in bands, with each band giving
    you of the numbers you need to know both the value of the resistor in ohms and
    its tolerance—a value which tells you how close to the ''perfect'' resistance
    value the resistor is likely to be. To decode this, use the diagram in Figure
    10-7; the same diagram is available in full colour on the BBC Microbit User Guide
    at www.wiley.com/bbcmicrobituserguide.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '![](img/a8e06f84ec80226aea02c25f7c99ab0e_217_0.png)


    | 1st/2nd Band | Multiplier | Tolerance |

    |---|---|--|

    | Black | 0 | ×10⁰ | ±1% |

    | Red | 2 | ×10² | ±2% |

    | Orange | 3 | ×10³ | - |

    | Yellow | 4 | ×10⁴ | ±0.5% |

    | Blue | 6 | ×10⁶ | ±0.25% |

    | Violet | 7 | ×10⁷ | ±0.1% |

    | Grey | 8 | ×10⁸ | ±0.05% |

    | White | 9 | ×10⁹ | - |

    | Gold | - | ×10¹ | ±5% |

    | Silver | - | ×10² | ±10% |

    | None | - | - | ±20% |


    FIGURE 10-7: Resistor colour table code


    By reading the value of the printed example resistor. The first two bands starting
    from the left indicate the resistance, the next band indicates the multiplier
    and the final band indicates the tolerance. For the sample resistor, the first
    two bands are coloured red. The table included in Figure 10-7, red equates the
    value 2, the initial number for the resistance value is 22.


    The next band is the multiplier band and the colour is coloured green, which translates
    to 10⁵ or 100,000 (1 followed by five zeros). As the name suggests, the multiplier
    is used with the initial resistance value: multiplying 22 by 100,000 equates 2,200,000,
    which is the true resistance value of the example resistor in ohms: 2,200,000Ω.


    That''s a big number, so it pays to simplify. There are 1,000 ohms in a kilohm
    and 1,000 kiloohms in a megaohm.2,200,000Ω is typically written as 2.2MΩ, or 2.2
    megaohms.


    The final band, located on the right side of the resistor, indicates the tolerance,
    or accuracy—in other words, how close it is to the listed resistance you would
    see you to measure the resistor. For our sample resistor, this band is coloured
    gold, which indicates plus or minus 5 cent. In other words, the actual resistance
    of the 2.2MΩ resistor could be as low as 2.09MΩ or as high as 2.31MΩ. The tighter
    the tolerance, the smaller that variation goes. For hobbyist use, almost any tolerance
    value gets you sufficiently close for the circuit to work.'
