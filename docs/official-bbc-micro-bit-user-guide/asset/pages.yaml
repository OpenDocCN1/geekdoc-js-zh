  md: '# The Rain-Sensing Hat


    As a demonstration of how to build a simple wearable using the BBC micro:bit,
    a rain-sensing

    hat is a fantastic project. As an actual practical device, it''s somewhat less
    useful. If you''re

    outside and it''s raining, you know whether it or not you''re wearing a ‘smart’
    hat!


    To follow this project, you need the following materials:


    +   * A BBC micro:bit—The BBC micro:bit forms the brains of the wearable, actually

    detecting when the rain begins to fall, as well as providing the display that
    warns the

    weaker to seeker. You also need a micro-USB cable to program the BBC micro:bit

    from your computer.


    +   * A battery pack—A wearable that keeps you tethered to your computer through
    a

    USB cable isn''t much of a wearable, so you need a battery pack. The one provided
    as

    part of the micro:bit Go is perfect, or you can reduce the height of the hat by

    opting for a third-party pack which uses smaller batteries. You also need fresh
    alkaline

    batteries, rather than-used or rechargeable batteries.


    +   * Conductive thread—You use the conductive thread to build a moisture sensor
    on

    top of the hat, which the BBC micro:bit employs to trigger the warning. It also

    serves to fatten the BBC micro:bit to the hat, so look for thicker than thinner

    conductive thread to increase its strength.


    +   * Sewing materials—A needle on its is enough to build this project, but to
    make

    life easier and keep your fingers safe, consider adding a thimble, dedicated scissors,

    a a needle thread, as discussed earlier in this chapter.


    +   * A baseball cap—The peak of a baseball cap makes it a great place to hang
    a BBC

    microbit, putting it in front of the wearer''s eyes without blocking their vision
    too

    badly. It''s probably a good idea to buy a cheap cap specifically for this project;
    you don''t

    want end up putting holes over your favourite!


    +   * A ruler or measuring tape—This allows you to make measurements, ensuring
    your

    BBC micro:bit and threads are positioned in the right places.


    +   * A fabric pencil—Use this to mark out measurements on the baseball cap. You

    can try using a normal pencil or pen, although these leave a permanent mark on

    the.


    If you don''t want to build the project right now, you can skip to the software
    section

    later in this chapter to experiment with the program. Touching the BBC micro:bit
    on Pin 0

    while holding the GND pin is enough to simulate the rain sensor.'
