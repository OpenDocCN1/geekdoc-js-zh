  md: '# # Chapter 10

    Building Circuits


    **In this chapter**


    +   * An introduction to the basic components of electronic circuits

    * The BBC micro:bit''s input-output pins and what they can do

    * Using the BBC micro:bit to power your electronic circuits

    * How to read and write to the BBC micro:bit''s pins from your own programs

    * Reading from a button input

    * Writing to an LED output

    * A practical project: building your own set of traffic lights


    **THE BBC MICRO:BIT''S** on-board buttons and LED display make a device which
    works perfectly on its own. You can build surprisingly complex projects without
    ever additional hardware, from games to touch detectors.


    Sooner or later, you''re going to expand the capabilities of your BBC micro:bit,
    and it''s here the *edge connector* comes into play. This connector includes multiple
    *input-output pins* which can be used to talk to your own circuits.


    Before you get started, though, you need to learn a little bit about the equipment,
    components, and terminology that go into making electronic circuits.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Electronic Equipment


    Before you begin building electronic circuits to connect to the BBC micro:bit
    on its own, you need some basic equipment. If you purchased the BBC micro:bit
    on its own, you need to find them separately; if you purchased an expansion pack
    or experimenter''s kit, you should find the equipment you need in your bundle.


    The following is a basic list of what you need to get started with building the
    sample projects later in this chapter. As you begin experimenting with your own
    circuit designs, you need additional components, but the following is enough to
    get you started.


    +   Wires with crocodile clips or banana plugs—The BBC micro:bit is designed to
    be easily connected to additional hardware using jumper wires which end in crocodile
    plugs (spring metal clips with serrated teeth which look a bit like the jaws of
    a crocodile) or banana plugs (split poles which wind in the middle to the edges
    of a connector). You can use any type of connector, but make sure you buy the
    right size. Crocodile clips should be no wider than 4mm, though thinner will;
    banana plugs must be 4mm in diameter exactly, to fit through the holes. Try to
    buy bundles that contain multiple colours, as it makes your layout easier to follow
    as you are building the circuit.


    +   Buttons or switches—The BBC micro:bit has two buttons, but on an external
    button or two is a great way to learn about reading input signals. Almost any
    button or switch works, but ideally look for momentary switches which send a signal
    while actively held down; these are the same as you find on the BBC micro:bit.


    +   Light emitting diodes (LEDs)—An LED is fantastic and inexpensive to quickly
    see whether your project is sending a signal or not. LEDs come in all shapes and
    sizes, but for your first projects keep things simple and use single-colour LEDs
    for low-current. Avoid extremely bright white or blue LEDs; these typically require
    more than the BBC micro:bit''s pins can provide and need an external power supply
    and an additional component, called a transistor, to switch them on and off.


    +   Resistors—Most circuits use resistors as means of controlling the voltage
    or current flowing through a component. Resistors are particularly important when
    working with LEDs. If you link a LED directly into the BBC micro:bit pin without
    a resistor to limit the current, it''s theoretically possible to burn the LED
    out. Try to buy a selection of values of resistor, measured in ohms (Ω). A pack
    with 10Ω and 68Ω resistors is enough to see through most BBC micro:bit projects.


    +   Potentiometers—Also known as varistors, or variable resistors, potentiometers
    are resistors, the value of which can be changed by turning a knob or screw. The
    most common potentiometers have a maximum of 10KΩ resistance and are often used
    in projects as volume or brightness controls.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# CHAPTER 10 BUILDING CIRCUITS


    The BBC microbit is designed to be used without another form of equipment, and
    circuits can be built using nothing than the wires and components. If you''re
    looking to make your project more permanent, you may need to invest in a few additional
    pieces.


    +   **Breadboard**—Also known as a solderless breadboard, the breadboard is a
    plastic tray covered in small holes. W and the legs of components are inserted
    into these holes, and hidden metal strips on the underside of the breadboard join
    them in an electrical circuit. A breadboard circuit has the benefit of being less
    liable to come apart than one made with wires and crocodile clips, while still
    allowing you to remove the components and reuse them for a different project.
    Look for a breadboard which features 2.54mm pin spacing.


    +   **Breadboard jumper wires**—Crocodile clips are of little use with a breadboard,
    so you need a selection of breadboard jumper wires which end in plain wire or
    soldered pins. Remember that you still need to connect the breadboard to the BBC
    microbit, so make sure you have a few wires with a crocodile clip or plug at one
    end to make those connections; alternatively, use a strip of 2.54mm male pin headers
    and insert them into the breadboard to give you something to attach a crocodile
    clip to.


    +   **Stripboard**—The next step from a breadboard, a stripboard allows you to
    make permanent circuits by soldering components into place. Like a breadboard,
    the stripboard has rows of metal underneath which make the circuit; these rows
    can be cut using a tracking tool (or a small drill bit) to alter the shape of
    the circuit.


    +   **Soldering iron**—If you''re using a stripboard, you need a soldering iron,
    a screwdriver-like device which heats up metal to melt solder and create permanent
    connections between the components and the stripboard. Make sure you choose a
    soldering iron which is labelled as electronics work and with a reasonably fine
    tip, and always remember that soldados irons get extremely hot. To find an iron
    which comes with basic accessories kit including a stand, some electrical solder,
    and a sponge or water for cleaning the tip of the iron.


    +   **Side cutters**—The components you use to make your circuit are known as
    throughhole technology (THT), customised by their long legs. If you''re building
    a stripboard circuit, you''re going to cut them down to size when you''ve finished
    soldering them into place; to do this, you need a pair of small side cutters.


    +   **Multimeter**—A multimeter is a multifunction measuring device, which at
    its most is capable of measuring voltage, amperage (current), and resistance.
    It''s particularly useful if you need to diagnose a problem with your circuit.
    While professional versions can be extremely expensive, even the cheapest models
    are suitable for hobby projects.'
  merge: -1
  pgno: 206
