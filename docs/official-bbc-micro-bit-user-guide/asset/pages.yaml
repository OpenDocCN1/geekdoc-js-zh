  md: '# 44 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    Although the idea of dragging and dropping blocks of code may seem basic, JavaScript
    Blocks is an extremely powerful language in which it''s possible to make complex
    and substantial programs. It''s also a gateway language. As you''re writing a
    JavaScript Blocks program, the editor is quietly translating it into text-based
    JavaScript. When your program is complete, you''re able to see the JavaScript
    version with all the graphical elements replaced with their raw instructions with
    the click of a mouse.


    # JavaScript


    Originally released in 1995, JavaScript has become the language of the World Wide
    Web. Not to be confused with Java, an entirely separate programming language with
    which it shares the first part of its name, JavaScript is flexible, lightweight,
    and cross-platform. The latter means it can run on a wide variety of computers,
    from powerful servers all the way down to the BBC micro:bit. It''s also a traditional
    text-based language, rather than visual JavaScript Blocks. Instructions are represented
    as lines of writing rather than typically typing them out (see Figure 4-2).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_58_0.png)


    FIGURE 4-2: The JavaScript Editor


    The JavaScript Editor is identical to the JavaScript Blocks Editor. It''s possible,
    in fact, to switch between the two at will even part-way through writing a program.
    A program written in JavaScript Blocks can be viewed and edited in JavaScript
    proper, and at least'
