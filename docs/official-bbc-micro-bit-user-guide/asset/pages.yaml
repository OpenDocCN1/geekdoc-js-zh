  md: '# Chapter 9

    The BBC micro:bit and the Raspberry Pi


    In this chapter


    +   - An introduction to the Raspberry Pi educational microcomputer

    - How to connect the BBC micro:bit to the Raspberry Pi and reward from its internal
    sensors or add-on hardware

    - How to use the BBC micro:bit as an external display device for the Raspberry
    Pi

    - A practical example of Raspberry Pi-to-BBC micro:bit communication: a BBC micro:bit-powered
    Raspberry Pi CPU monitor


    **THE BBC MICRO:BIT** is a powerful computing device in its own, and there is
    no end of projects you can develop using only the BBC micro:bit and a few low-cost
    components. Pairing it with the Raspberry Pi, however, opens a whole new world
    of potential for both the BBC micro:bit and the Raspberry Pi—and if you already
    have a Raspberry Pi and a BBC micro:bit, you don''t need anything else to get
    started.


    At simplest, the Raspberry Pi can be used with the BBC micro:bit like any other
    computer. The BBC micro:bit appears as a removable device, labelled MICROBIT,
    and you can write programs in the browser, download them, and drag them to the
    BBC micro:bit just as with a more expensive desktop or laptop. Delve a little
    deeper, however, and you can integrate the BBC micro:bit fully into your Raspberry
    Pi programs, using it as an external display or reading from its various sensors—combining
    the two platforms into a powerful educational experimentation tool.'
  merge: -1
