  md: '> For my father, the enthusiastic past, and my daughters,

    the exciting future.

    —Gareth


    # # About the Author


    **GARETH HALFACREE** is a freelance technology journalist and the co-author of
    the

    Raspberry Pi User Guide alongside project co-founder Eben Upton. Formerly a system
    admin-nistrator working in the education sector, Gareth''s passion for open source
    projects has fol-lowed him from one career to another, and he can be seen reviewing,
    documenting or GNU/Linux, LibreOffice, Fritz and Arduino. He is

    also the creator of the Sleepduino and Burduino open hardware projects, which
    extend the

    cabilities of the Arduino electronics prototyping system. A summary of his current
    work

    can be found at http://halffacree.co.uk.


    # # About the Technical Editor


    **DAVID WHALE** is an embedded software engineer whose career of over 30 years
    has

    involved him designing and building embedded software for a diverse collection
    of high

    tech products. David is a STEM Ambassador and volunteer for the Institution of
    Engineering

    Technology (IET), where he regularly helps schools and teachers introduce and
    run

    computing clubs, as well as trains teachers normally. It was through his association
    with

    t IET that David became involved with the micro:bit project, where he has helped
    to

    develop a large base of teaching resources, as well as train and support the delivery
    of the

    IET Faraday National STEM challenges using the BBC micro:bit. David now works
    with

    the Micro:bit Educational Foundation, where he continues to develop projects and
    resources

    with many partner organisations, which includes the Doctor Who team at the BBC.
    David is

    t co-author of the successful Wiley title Adventures in Minecraft, a book that
    teaches

    Python coding to children via their interest in the Minecraft game, and he has
    been techni-\cal editor of a wide range of technology and computing books.'
