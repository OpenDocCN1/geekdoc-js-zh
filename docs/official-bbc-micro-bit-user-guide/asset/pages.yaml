  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    Be careful if you''re using more than one BBC micro:bit on a single computer:
    the Uploader will flash new programs to every BBC micro:bit currently connected
    at the time you download the hex file. If you had a different program on any of
    the BBC micro:bits, this program will be overwritten.


    To load a previously-downloaded program without downloading it again, simply use
    the drag-and-drop method outlined earlier in this chapter.


    # The Code Editor


    Computer programs start their lives as text files with instructions on exactly
    what the computer should do. Although it''s entirely possible to write a program
    in a text editor like Microsoft Notepad or a word processor like LibreOffice Writer,
    it''s more common to use a tool known as an integrated development environment
    (IDE). At its heart, an IDE is a text editor designed specifically for programming
    and contains all the tools you need to code, debug, and compile with your own
    programs.


    With BBC micro:bit, there''s no need to install any IDE software on your computer
    itself. Instead, the IDE, as the code editor, runs entirely in your web browser.
    Although the BBC micro:bit supports a range of different programming languages,
    the most commonly used is the JavaScript Blocks Editor, powered by MicrosoftCode.


    By loading the JavaScript Blocks Editor into your web browser by visiting makecode.bit.org
    you will see a sample program already loaded (see Figure 3-5). When you first
    load it, the JavaScript Blocks Editor defaults to Blocks mode; clicking on the
    toggle at the top of the screen will show you a program in a different programming
    language, JavaScript. You''ll learn more about the different languages in Chapter
    4.


    You will also see a picture of the BBC micro:bit, normally located on the left
    side of the screen. This is a key feature of the simulated BBC micro:bit IDE.
    It offers you insight into what your program will do before you even load it onto
    the BBC micro:bit. Using this, you can try out changes to the program without
    having to take the time to test it on the BBC micro:bit hardware each time, or
    even if you don''t have a physical BBC available. if you write a program which
    needs to press Button A or B, just click on the picture''s Button A or B to simulate
    the input.


    If having the simulator running through a half-finished program is distracting,
    simply click the Stop button underneath it (see Figure 3-6). When you want to
    test your program again, just click the button again to begin the simulator afresh.'
