  md: '# Program 2: Button Inputs


    ''Hello, World!'' demonstrated how to get an output from the BBC micro:bit via
    the screen, but there''s another key feature of programs: inputs. Frankly, the
    BBC micro:bit has two inputs: Button A and Button B, either side of the display,
    and now it''s time to introduce them into your program.


    To ensure you don''t lose your ''Hello, World!'' program, start a new project
    by clicking on the Projects menu and clicking on New. You''ll get a fresh project
    with two control blocks (see Figure 5-1 earlier in this chapter), and any changes
    you make won''t affect your previous project. To keep the two easy to find, remember
    to give this new project a name: click on Untitled at the bottom of the screen;
    then Button Inputs to rename the project.


    Begin by clicking on the Input category of the Blocks toolbox and then clicking
    on the button A pressed block. When it appears on your Workspace, notice that
    it doesn''t have the diagonal lines you saw on the [show string "Hello!"] block.
    If you look closer, you''ll notice it''s shaped like a control block, too (see
    Figure 5-6).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_71_0.png)


    The [on button A pressed] block is an event block, and it works a little differently
    from the blocks you''ve been using before. Any blocks within do not normally run,
    but that changes when its trigger is activated. In the case of the [on button
    A pressed] block, that trigger is Button A being pressed. When that trigger is
    activated, the BBC micro:bit will jump into the [on button A pressed] block as
    soon as it is able, and the blocks within it will begin to run.'
