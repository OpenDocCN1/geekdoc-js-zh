  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    The sample program doesn''t store information between uses. Every time the BBC
    micro:bit is powered on, the sample program starts again from the beginning. When
    you load your own program onto the BBC micro:bit, detailed in Chapter 3, that
    program replaces the sample program in the BBC micro:bit''s memory.


    If you''d like to go into the BBC micro:bit''s introductory program with no expectations,
    reading this paragraph and come back when you''ve run through the program at least
    once. To begin, power the BBC micro:bit via USB or battery.


    # Signs of Life


    The first thing you''ll see when the BBC micro:bit runs through the sample program
    is an animation demonstrating the capabilities of the LED display. Although a
    5 × 5 array of single-colour LEDs may sound limited, in reality it''s enough to
    display some attractive graphics and animations; it can even be to play a game,
    as you''ll see later on the program.


    Following the animation, the BBC micro:bit will greet you with a simple word scrolling
    across the display: ''HELLO''. This is in reference to the classic first program
    written when learning a new programming language: ''Hello, World! You''ll learn
    to write your own version of ''Hello, World!'' in Section II, ''Coding for the
    BBC micro:bit'', but for now wait for the message to scroll and the program to
    move on to its next segment.


    # Testing the Buttons


    With the animation and greeting over, the program moves on to its first interactive
    section. You''ll see a flashing arrow pointing toward Button A, replaced at intervals
    with the letter A to further drive the home point: you should press Button A,
    on the left of the LED display, now.


    When you press Button A, you''ll be rewarded with another animation, followed
    by an arrow pointing toward the Button B replaced at intervals with the letter
    B. Press the Button as instructed to fire off another animation, and the program
    will load its segment: motion control.


    # Motion Gaming


    The micro:bit''s accelerometer, detailed in Chapter 1, allows it to detect movement
    as well as the angle at which it is held across all three dimensions. This is
    initially demonstrated in a simple manner: the message ''SHAKE'' will scroll the
    LED display, followed by a simple animation. Shake the BBC micro:bit—be careful
    not to throw it across the room or out its power cable—and the program will proceed.


    With the shaking over, the program will display the message ''CHASE THE DOT''
    before playing a game where the aim is to—as you''ve probably guessed—chase a
    dot. The dot takes'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'form of an LED at the top right of the display, while your character is another
    LED in the middle of the display.


    This game isn''t played with the buttons, though. Holding the BBC micro:bit flat,
    begin to tilt the BBC micro:bit as though you''re rolling a marble on a tray.
    You''ll see the dot representing your character begin to move, as the accelerometer
    detects the changes in angle. Keeping until your dots on the target dot, and a
    new target dot will light up. When you''ve caught one, the program will move into
    its final segment.


    # Getting Coding


    Having caught the, you''ll see the encouraging message ''GREAT!'' scroll across
    the screen, followed by a simple instruction: ''NOW GET CODING''


    At this point, the program is complete. The final segment loads a simple animation
    around a picture of a heart, which will repeat over and again. If you want to
    run through the program, you can press the Reset button on the back of the BBC
    micro:bit to go back to the beginning; alternatively, if you disconnect it from
    its power source and reconnect it again, the program will begin from the start.


    Although it may seem simple—and, really, it is—the simple program covers many
    of the BBC micro:bit''s major features: using the LED display for pictures and
    animations; reading the buttons as inputs; using the accelerometer to detect gross
    motion and fine angles; and scrolling text across the LED display. These are the
    features you''ll be using yourself as you learn to write your code for the BBC
    micro:bit, starting in Chapter 3.


    # Resetting the BBC micro:bit


    Whether you''re using the sample program or one of your own making, it pays to
    become familiar with resetting the BBC micro:bit: using the Reset button on the
    rear between the micro-USB and battery connectors. Pressing this sends a signal
    to the BBC micro:bit''s processor to act as though the power has been briefly
    cut, starting the program from the beginning.


    The reset button (see Figure 2-6) is important, as there are many reasons you
    may need to interrupt a program run and start again. There may be a bug in a program
    which has caused an infinite loop, whereby you can''t progress any further. Some
    programs, like the preloaded sample program detailed earlier in this chapter,
    are only designed to run once and stop entirely with the only way to restart is
    resetting the BBC micro:bit. When you''re writing your programs, you may want
    to test a program over and again to iron out any bugs.'
