  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    When using the Repl shell in Mu, any instruction you type is run immediately after
    you press the Enter key. However, the usual rules of a Python or MicroPython program
    apply (as discussed in Chapter 7, ''Python''): you need to import instructions
    before you can use them, and if you''re using loops or nested code you need to
    pay attention to the indentations at the start of each line.


    A simple way to test Repl''s capabilities is with the two-line ''Hello, World!''
    program from Chapter 7. Delete any program code from the Mu window and click the
    Flash button to load MicroPython onto your BBC microbit, and then click the Repl
    to load the shell and type the following two lines one after the other:


    ```

    from microbit import *

    dis.scroll(''Hello, world!'')

    ```


    As soon as you press the Enter key to see the second line, you see the message
    Hello, world! scroll across the microbit''s LED display. When the message ends,
    so does the program. Without a loop, there''s nothing to tell the BBC microbit
    what to do next. You can type any instructions in this way—even creating an infinite
    loop to keep the program running—but for a program of more than a few lines it''s
    much easier to write them in, either Mu or the browser-based Python Editor, and
    flash them to the BBC microbit.


    Mu is useful for microbit programming in MicroPython, but you can also communicate
    with the BBC microbit in another way: integrating into programs running on the
    Raspberry Pi, or integrating the Raspberry Pi into programs on the BBC microbit.
    The remainder of this chapter looks at some of the possibilities that open up
    when you use the two devices in harmony.


    # Reading from the BBC micro:bit


    The BBC microbit has a number of features an unexpanded Raspberry Pi lacks, including
    5x5 LED display, accelerometer, magnetic compass, and analogue-to-digital (ADC)
    converters attached to its pins (see Chapter 10, ''Building Circuits'', for more
    on these). All of these features can be used from the Raspberry Pi over the micro-USB
    cable, using the full version of the Python programming language.


    To get started, first need to find the device name the BBC microbit is using—the
    name you give to the device under the /dev directory in Linux. Usually, this is
    /dev/ttyACM; in cases, if you have other devices connected to your Raspberry Pi,
    the number at the end of the name differs. To find your device name, connect the
    BBC microbit to the Raspberry Pi. If the MICROBIT pops up, close that and open
    the terminal from the upper left of the screen before typing the following command:


    ```

    dmesg | tail -20 | grep tty

    ```'
