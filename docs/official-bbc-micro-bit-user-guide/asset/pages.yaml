  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    # Building the Hat


    Begin by measuring and writing down the distance between the centre of the hole
    Pin 0 and the centre of the hole GND pin of your BBC micro:bit; it will be around
    42mm (1.65"). This is the distance between the ending points of your two lengths
    of conductive thread, making it so that the thread can fasten the BBC micro:bit
    to the underside of the baseball cap''s peak.


    Find the centre point of the baseball cap''s peak, and then make a small mark
    near the front of the peak on its underside. Measure half the distance you wrote
    down earlier (21mm/0.827") to the left and mark it; then do the same to the right
    (see Figure 12-8).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_252_0.png)


    FIGURE 12-8: Marking the hat


    Cut a length of conductive thread about four times longer than your original measurement—around
    168mm (6.61"). Tie a knot in one end and thread the other end through the needle.
    Push the needle through the peak of the baseball cap from the underside where
    your left mark is. Pull it all the way through the top, and then begin sewing
    a square-wave pattern as shown in Figure 12-9 without passing the needle fully
    the the peak; just just the needle sideways through the fabric to the peak to
    secure each part of the pattern. Stop when you reach the second mark, passing
    your needle through so the thread is closer to the front of the peak than the
    mark.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# CHAPTER 12 THE WEARABLE BBC MICRO:BIT


    # 243


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_253_0.png)


    FIGURE 12-9: Sewing the square-wave pattern


    Unthread your needle, leaving the rest of the thread hanging from the underside
    of the hat, and then cut a second length of conductive thread, knot it, and thread
    it through the needle. Place the needle on the right mark at the underside of
    the hat and begin the sewing process again, creating the pattern but slightly
    above the old one (see Figure 12-10). Make sure that at no point do the two threads
    touch; they should be close, but not touching.


    The spacing between the threads is important. Too far apart, the rainwater isn''t
    conductive enough for the sensor to work; too close together, the threads connect
    to each other and short the circuit, causing the sensor to trigger even when no
    rain is present.


    When you reach the end of the pattern, pass the needle fully through the peak
    and pull the thread through behind it, but don''t unthread the needle yet. Take
    your scissors and cut off any excess thread from the knotted ends of both conductive
    thread lengths, leaving them as close to flush with the peak of the baseball cap
    as possible.'
  merge: -1
