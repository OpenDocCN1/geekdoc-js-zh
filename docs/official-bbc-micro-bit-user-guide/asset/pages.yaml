  md: '# # Appendix D

    Pin-Out Listing


    THE FOLLOWING FIGURE is a numbered diagram of the BBC micro:bit’s general-purpose
    input-output (GPIO) pins, both large and small. The table describes the functions
    available on each pin.


    For more information on the BBC micro:bit GPIO pins, see Chapter 10, ''Building
    Circuits''.


    | Pin No. | Main Function | Additional Function | Notes |

    |---|---|---|--|

    | 0 | GPIO Pin 0 | Analogue Input | Large pin, Weak Pull-Up Resistor |

    | 1 | GPIO Pin 1 | Analogue Input | Large pin, Weak Pull-Up Resistor |

    | 2 | GPIO Pin 2 | Analogue Input | Large pin, Weak Pull-Up Resistor |

    | 3V | 3V Power Supply | | Large Pin |

    | GND | Ground Connection | | Large Pin |

    | 3 | LED Column 1 | GPIO Pin 3, Analogue Input | Small Pin |

    | 4 | LED Column 2 | GPIO Pin 4, Analogue Input | Small Pin |

    | 5 | Button A Input | GPIO Pin 5 | Small Pin, Pull-Up Resistor |'
