  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    is known auto-indentation and is a time-saving feature of the Python Editor: Because
    you opened an infinite loop on Line 2, and Python requires the contents of that
    loop are indented by spaces, the Python Editor has automatically inserted indentation
    for you.


    Auto-indentation works on multiple levels. If you open another loop within the
    current loop, the next line is automatically indented by eight spaces: four for
    the initial loop and another four for the inner loop. Put a loop in the loop,
    and the next line is indented by 12 spaces, 4 for each level of the loop.


    Although auto-indentation creates indentation for you, it''s up to you to delete
    the indentation when you no longer require it. The Python Editor doesn''t know
    when you''ve finished writing code for loop, only that you had started; when you
    come to the last line of your loop, you need to manually delete the indentation
    from the next line using the Backspace key on your keyboard. One press of the
    Backspace key when your cursor is to the right of the indentation deletes one
    line, or four spaces. Remember that Python uses this indentation to tell which
    lines of code are part of a loop and which lines of code aren''t, so it''s important
    to get the indentation right.


    Type the following on Line 3, after the four-space indentation the Python Editor
    for you:


    ```

    if button_a.is_pressed():

    ```


    When you press Enter at the end of this line, Python auto-indents the next line
    by spaces in total: four for the infinite loop opened on Line 2, and another four
    for the line you''ve created. This line is known as a conditional, or more specifically
    an if statement. An if statement in Python works just like if statement would
    in English: ''If we''re out of milk, go to the shop'' tells someone to go to the
    shop but only if the milk has run out; if the milk hasn''t run out, there''s no
    need to go to the shop.


    In the case of code lines you''ve typed, the condition is simple: if button_a.is_pressed()
    checks to see if Button A on the BBC micro:bit is being pressed. If it is, the
    lines following the colon (:) at the end of Line 3 and featuring an eight-space
    indentation run; if it isn''t pressed, they are ignored


    It can be difficult to keep track of what code runs, but it''s here that the indentation
    really helps. If lines of code are lined up at the left, they''re nested together
    and run after another.'
