  md: '# CHAPTER 4 PROGRAMMING LANGUAGES


    # # JavaScript Blocks


    JavaScript Blocks design likely be most people''s first introduction to the BBC
    micro:bit. Based on design of Scratch, which was originally developed by the Massachusetts
    Institute of Technology''s Media Lab, JavaScript Blocks is a visual programming
    language. Rather than typing instructions by hand from memory or consulting a
    reference guide, all the instructions available to the language are available
    in a Blocks toolbox. Click on the block the instruction you need, drag it to the
    workspace, and connect it to other instructions to build your program (see Figure
    4-1).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_57_0.png)


    FIGURE 4-1: The JavaScript Blocks Editor


    The visual nature of JavaScript Blocks makes it an ideal first programming language
    for younger coders, while the vary blocks click together like jigsaw pieces it''s
    also a great way to learn fundamental programming concepts. It''s easy to see
    how a loop—section of program which depends on a particular input, such as or
    not you''re holding down a button or a sensor has a particular reading—works in
    JavaScript Blocks, for instance, thanks to colour-coded blocks and the repeated
    blocks inside the control block.


    If you''ve previously used Scratch, there''s one important difference: the stage,
    the area of the screen onto which sprite objects can be placed and animated, doesn''t
    exist in JavaScript Blocks. Scratch programs are designed to be run on your computer,
    JavaScript Blocks programs are designed to be run on the BBC micro:bit, and the
    BBC micro:bit itself forms the stage.'
