    which the game uses to control where the player—represented by a dot—is drawn
    on the screen. Notice how this variable has two numbers, enclosed in square brackets
    and separated by a comma. This represents a list, which is effectively a variable
    which can hold more than one piece of data (or datum)—in this case, two numbers
    that would have had a variable each.


    The numbers in the playerPosition = [2, 4] variable are important. They control
    exactly where the player, known as a sprite, appears on the BBC micro:bit''s display.
