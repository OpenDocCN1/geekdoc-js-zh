  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    If you''ve been working through the book from the start, the official website
    at microbit.org should be entirely familiar; it''s where you can find the programming
    environments you''ve been using with your BBC microbit. As well as guides using
    the BBC microbit at home and at school, the site has additional resources split
    into categories by clicking the three-line ''hamburger'' icon at the top-right:
    Let''s Code, Ideas, Meet microbit, Teach, and a link to buy the BBC microbit from
    international resellers (see Figure 13-1).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_259_0.png)


    FIGURE 13-1: The BBC microbit homepage


    Meet microbit offers a range of guides and animations for beginners, starting
    with a similar tour of the BBC microbit hardware that you can find in Chapter
    1, ''Meet the microbit'', and working through typing programs in a variety of
    languages and connecting your BBC microbit to a battery pack for portable use.


    Let''s Code is where you can find the program editors discussed in Chapter 4,
    ''Programming Languages''. The editors aren''t the only things available on this
    page, however. Below the Let''s Code buttons which launch each editor is a Lessons
    button which takes you to language-specific guides and tutorials suitable from
    absolute beginners. Some languages feature a Reference button which links to a
    more technical reference, handy for looking up how a proper function or instruction
    works.


    The Ideas page is where the BBCbit website really gets interesting. Constantly
    updated, the Ideas section includes a round-up of projects, competitions, news
    stories, and educational materials from third-party websites including the BBC,
    Tech Will Save Us, Microsoft, and'
