  md: 'When gently pulling the rest of the thread, take care not to let the thread
    come out of the eye of the needle. If it does, just reread it and continue sewing.
    Once the knot has reached the fabric, the thread will stop; don''t pull it any
    harder, or you''ll pull the knot through the fabric and have to start again.


    Exactly how you continue to sew depends on the fabric you''re using and whether
    you''re sewing to create a strong join—such as when linking two pieces of fabric—or
    simply to create a conductive path for your circuit. As a rule of thumb, the more
    times the needle passes through the fabric, the stronger the join. A length of
    thread which sits on top of the fabric and only passes through two points is weaker
    than one which constantly zig-zags backward and forward.


    To make a connection to one of the BBC micro:bit''s input-output pins, simply
    wrap a free end of thread around the pin, passing it through the hole and back
    again (see Figure 12-7). Make sure to wind it around a few times, to make a secure
    and electrically-sound connection. If you''re attaching the BBC micro:bit to the
    fabric at this point, you can do this by passing the needle through the fabric
    and the hole of the BBC micro:bit''s input-output pin, and looping it back to
    the fabric at the bottom of the pin before repeating the process four or five
    times. This gives you a solid and secure connection.


