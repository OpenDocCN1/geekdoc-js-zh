    # # Battery Power


    Powering the BBC micro:bit from a USB power source is quick and easy, but it''s
    not very flexible. If you''re planning on making use of the BBC micro:bit away
    from your desk, a better choice is to power the board using batteries installed
    in a protective holder, which then connects to the BBC micro:bit''s battery header
    via a short length of wire. With the micro-USB cable, some BBC micro:bit hardware
    bundles include a suitable battery holder. If you did not, look for a holder capable
    of containing two AAA batteries, fitted with a JST ''PH'' connector and specially
    noted to be compatible with the micro:bit.


    The BBC micro:bit is designed to be powered via alkaline or carbon-zinc batteries
    only. Rechargeable batteries should not be used because they do not provide the
    right voltage. Whereas a nonchargeable AAA battery outputs 1.5 V for a total of
    3 V from, for example, rechargeable AAA batteries output 1.2 V for a total of
    2.4 V. The BBC micro:bit may seem to work at this lower voltage; however, as the
    batteries discharge, it may begin oddly and lack the power to run external hardware
    (as described in Chapter 10, ''Building Circuits'', and Chapter 11, ''Extending
    the BBC micro:bit'').'
