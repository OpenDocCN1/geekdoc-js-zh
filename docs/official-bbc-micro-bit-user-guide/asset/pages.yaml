    ```


    The first line sets the game''s timing delay, which is multiplied by 100 milliseconds
    later in the program giving an initial delay of one second. This line demonstrates
    an important feature of variable initialise: you can initialise a variable with
    whatever data you require, not just zero as in previous programs. The detail in
    this line controls how fast the game is when it starts. If you''d like a challenge,
