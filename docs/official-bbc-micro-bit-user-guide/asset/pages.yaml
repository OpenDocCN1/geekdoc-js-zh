    # Introducing the JavaScript Editor


    The JavaScript Editor is an all-in-one development environment created specifically
    for the JavaScript language. Running entirely within the web browser of any modern
    computer, the JavaScript Editor doesn''t require you to install software on your
    computer. All you need to load the JavaScript Editor is open the web browser of
    an Internet-connected computer, type **makecode.microbit.org** into the address
    bar and press the Enter, and then click the Editor in the centre of the top menu
    to switch to JavaScript Blocks Editor to JavaScript Editor mode (see Figure 6-1).
    Once the editor has loaded, it runs on your computer even if you disconnect from
    the Internet.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_101_0.png)


    Figure 6-1: The JavaScript Editor


    The main features of the JavaScript Editor follow:


    +   - **The Projects menu**—Located at the top-left and looking like a folder
    icon, use this menu to create a new, blank project, or to load a previous project.
    These project files are stored on your computer, in your web browser''s local
    storage area, so are available only'
