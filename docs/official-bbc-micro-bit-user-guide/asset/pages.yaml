  md: '# Foreword


    **IN APRIL 2015**, I spent a lunchbreak searching my local supermarket for the
    cheapest thing I couldise to finish a demo for the BBC. What they saw that afternoon
    was the battery clip from a £1 alarm clock, glued onto an early BBC:microbit prototype.
    This was building a demo as one of the 31 partner organisations the BBC had recruited
    to help them deliver a bold and adventurous project: to create a coding device
    to every year 7 in the UK, for free. However, the BBC microbit wasn''t designed
    to be just another programmable ‘development board’, but a seamless plug-and-play
    tool puts creativity, learning, and ease-of-use for teachers and young people
    first.


    As an engineer on the project, the most compelling thing about working with the
    BBC micro:bit is the exciting (and sometimes ridiculous) things these new audiences
    choose to do with this technology: build a game based on a teleporting duck, measure
    a rocket car’s acceleration, tell the interactive story of pizza, build a portable
    heartratemonitor, or invent the fantastic ‘rain detecting’ that you can find in
    this book. This brilliantly captures the exhilaration, simplicity, and creative
    potential of the BBC micro:bit, and I''m sure it will help many more people become
    coders and inventors.


    Instantly, the BBC microbit''s sensors and sleek design make it accessible and
    exciting to the widest possible audience, even (perhaps especially) those who
    didn''t realise coding was for. It takes no time at all to build your first program,
    and the simplicity of the tools means that what follows is an upward spiral of
    success and satisfaction that encourages your imagination to run wild.


    Part of the BBC microbit is how effortlessly it brings the virtual and physical
    together. Within minutes, you''ve made with the computer start controlling the
    real world. It''s physicality and immediacy that create the ‘micro:bit moment’.
    It''s amazing to see people of all ages have that empowering experience when they
    realise the potential of the device in their hands, and what want to make something
    new with it—the moment people start to feel excited about using technology instead
    of holding back from it.


    Micro-bit isn''t really about learning to code; it''s about learning to do things
    that you care about technology. Learning to code happens along your way: learn
    about loops almost by accident making your BBC microbit dance, and the song has
    a verse and chorus to repeat. This approach helps engage new coders of all ages.
    Independent research tracked the progress of the BBC microbit in the UK during
    its first year and found that 85% of teachers who used the device agreed that
    it made Computer Science more enjoyable for their students, and 90% of the children
    who used it helped show them that anyone can code.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The cool design, broad appeal, and technological simplicity of the micro:bit
    tools come as a direct result of the diverse backgrounds, outlooks, communities,
    and interests within the micro:bit partnership. This broad, interdisciplinary
    team has shaped the device, the editors, the learning materials, and the concept
    of the micro:bit itself into a truly unique ecosystem.


    Founded in September 2016, the Micro:bit Educational Foundation has been entrusted
    with supporting and developing that ecosystem, and taking the micro:bit project
    around the world. At the time of writing, the device is available in more than
    50 countries, with the website available in 12 languages. We have a growing library
    of lesson plans, projects and ideas, new, more advanced editors developed with
    our partners (which are explained in this book), and a growing community of enthusiasts,
    volunteers, great partners, and educators.


    So, getting started with the BBC micro:bit isn''t just about building your own
    creations. It''s also about joining a worldwide community of people who are using
    technology creatively to express themselves, solve problems they care about, make
    life better for others, and change the way it feels to learn code.


    This book will introduce you to the world of micro:bit, but it''s only the start
    of your journey. Welcome to the micro:bit community. We''re looking forward to
    seeing what you create!


    —Jonny Austin, CTO, Micro:bit Educational Foundation'
