  md: '# 202 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    When reassigning the UART in a program, be aware that it will affect any other
    serial communications already configured. Assigning the UART to edge-connector
    pins will disable the BBC microbit''s serial-over-USB capabilities, though this
    can be quickly restored by flashing a different program onto your BBC microbit.


    Details on which pins can be used as UART receive and transmit pins can be found
    on the BBC microbit''s edge connector data sheet at tech.microbit.org/hardware/edgeconnector_ds/.


    > The power provided by the BBC microbit:bits pins depends on the power you provide
    to the BBC microbit: itself. When running from USB, the BBC microbit: run at its
    peak voltage; when running from a battery pack, the voltage out on each pin will
    drop as the battery pack drops. This can make parts like LEDs appear dimmer or
    motors run more slowly. Eventually, circuits may stop working until you replace
    the batteries or switch to a USB connection for power.


    # Your First Circuits


    Now that you know where to find the BBC micro:bits pins and what they can do,
    it''s time to start building your first circuits. The two circuits in this section
    of the chapter are as simple as they get and demonstrate the two main uses of
    the BBC microbit: pins: as inputs and outputs.


    The examples in this chapter are programmed using the Python language (see Chapter
    7, ''Python''). The same circuits can be used with any of the other languages
    supported by the BBC microbit: however, and writing your own programs in the other
    languages is a great way to fix your skills.


    > When building these circuits, always use the BBC microbit to power the circuit
    as shown, and never try to make the circuit the BBC micro:bit by connecting an
    external power supply or battery. While it''s possible to build a more advanced
    circuit which supplies the 3V BBC microbit needs, it''s also easy to make a mistake
    and supply too much voltage which will damage the BBC micro:bit.


    > The programs in this chapter are written in Python. If you would prefer to use
    JavaScript Blocks or JavaScript, versions written in these languages can be found
    in Appendix A and B, respectively.


