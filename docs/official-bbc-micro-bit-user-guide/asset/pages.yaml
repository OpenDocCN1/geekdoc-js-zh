    One of the major advantages to Python is its use in other educational programming
    projects.

    The Raspberry Pi Foundation, as an example, uses Python as one of the languages
    for its\ Raspberry Pi single-board computer; any school or coding club which uses
    Raspberry Pi will be familiar with the Python language, and that familiarity gives
    them a head start when using the same language on the BBC micro:bit, just as anyone
    using Python on the BBC micro:bit will find Python on the Raspberry Pi comfortably.


    With JavaScript, Python was originally devised as an interpreted language but
    is used on the BBC micro:bit as the functional equivalent to a compiled language,
    which the program is written in full then compiled into a hex file to be flashed
    onto the BBC micro:bit. The exception lies in a powerful feature of Python: *Repl*,
    an interactive interpreted *shell* which runs your commands as soon as you type
    them. Repl is explored in more detail in Chapter 9, where it is used to allow
    the Raspberry Pi to take control of the BBC micro:bit.


    # Comparing Programming Languages


    Table 4.1 offers a quick comparison of each language''s major features.'
