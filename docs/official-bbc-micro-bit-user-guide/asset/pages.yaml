    It''s this line of code is responsible for speeding the game up after every successful
    catch of the fruit. The first part of the code tells JavaScript to change the
    delay variable to the outcome of a short sequence; the second tells it to take
    something away from the current value of the delay variable; the last part tells
    it to take away the current value of the delay variable divided by 10. Result:
    the delay variable shrinks by 10 percent each time the fruit is caught, making
    the game 10 percent faster each round.


    There''s another neater way to decrease, or decrement, the value of a variable.
