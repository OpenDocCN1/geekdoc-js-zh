  md: '# # Chapter 13

    # Additional Resources


    **In this chapter**


    +   - A guide to the official resources available from the Micro:bit Educational
    Foundation

    - Where to find lesson plans and guides for teachers and other educators

    - An introduction to Code Clubs and how they can help students come to grips with
    the BBC micro:bit and coding


    **WHILE THIS BOOK** is designed to get you up and running with the BBC micro:bit
    as quickly as possible, it can only take you so far. Eventually you''re going
    to need to seek additional resources to continue your journey—and the good news
    is that there are plenty to be found, ranging from the official BBC micro:bit
    website to in-person meetings taking place around the globe.


    This chapter serves as a reference guide for some of the more popular micro:bit
    resources available, but it is by no means exhaustive. Searching for ''micro:bit''
    on your favourite engine brings up plenty more resources.


    # ## The Micro:bit Educational Foundation


    The Micro_bit Educational Foundation was set up in 2016 with one goal: in supporting
    the use of the BBC microbit in education throughout the world. Encompassing materials
    developed by and for the BBC as well as new resources developed, the Foundation
    is a non-for-profit organisation dedicated to the BBC micro:bit and a fantastic
    first for a wide range of resources.


    *The BBC micro:bit User Guide*, First Edition, Gareth Halmelface.

    © 2018 by John Wiley & Sons, Inc. Published in 2018 by John Wiley & Sons, Inc.'
