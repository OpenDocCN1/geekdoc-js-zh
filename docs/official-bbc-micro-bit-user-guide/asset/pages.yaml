    # # Conditional Loops


    So far, you''ve only worked with a single type of loop: the infinite loop, which
    runs forever. A more powerful type of loop is the conditional loop, which tests
    for a particular condition—such as whether a variable is equal to another variable—and
    runs only when the condition is true.


    Click on the Loops category of the Blocks toolbox, click the [while true do] block,
