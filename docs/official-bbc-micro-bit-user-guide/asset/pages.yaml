    As an experiment, try another [on button A pressed] block, changing it to an [on
    A+B pressed] block, and picking a different icon to display. On a real BBC micro:bit,
    hold down Button A and Button B to make the new block. On the simulator, you can''t
    click on both buttons at the same time, you''ll see an A+B button appear just
    below Button B. The A+B button is the equivalent of pressing both buttons at the
    same time on a physical micro:bit.


    # Program 3: Touch Inputs


    Although its buttons give the BBC micro:bit up to three possible inputs, that
    might not be enough for your needs. This is where the input-output pins, the numbered
    contacts on the copper strip at the bottom of the BBC micro:bit, come into play.
    The BBC micro:bit can detect when you touch one of them with your finger and register
    accurately—a alternative to the physical buttons and a great way to add inputs
    to a program without the need to wire up more buttons.


    As, you need to start a new project by clicking on the Projects menu and clicking
    on New so you can always work on the Button Inputs project. Click on Untitled
    of the screen; then type Touch Inputs to name your new project.


    > Remember that you can always find your projects by clicking on the Projects
    menu and looking under the My Stuff section. Projects are ordered according to
    when they were last modified, so your newest projects will be first and your oldest
    lasts.'
