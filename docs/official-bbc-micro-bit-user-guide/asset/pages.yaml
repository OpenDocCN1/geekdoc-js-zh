  md: 'To build this circuit, you need the following:


    +   - Wires with crocodile clips or banana plugs

    - A potentiometer


    A potentiometer is, in effect, a form of variable. When at its minimum setting,
    a potentiom-teter is almost completely without resistance—like a plain piece of
    wire; at its maximum setting, a potentiometer offers its full rated resistance—10KΩ
