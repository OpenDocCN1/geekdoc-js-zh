    Be careful when touching components on the back of the BBC microbit. If you have
    not properly grounded yourself by touching a metal surface first, you could fire
    a static shock into the sensitive circuitry and potentially damage your BBC microbit
    beyond repair.


    # Program 5: The Compass Sensor


    The BBC microbit''s magnetic compass is one of the two sensors labelled on the
    back—other the accelerometer, detailed later in this chapter—and one of the most
    interesting. By reading the strength of the local magnetic field in three dimensions,
    it can work out the direction the microbit is facing relative to magnetic north.
    This same technology is built into many smartphones and is used by mapping software
    to figure out which direction the user is facing.'
