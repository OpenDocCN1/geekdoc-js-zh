    # Program 4: The Temperature Sensor


    The BBC micro:bit has more inputs than simple buttons and touch-sensing pins.
    The simplest of these is the temperature sensor, which works exactly like a thermometer:
    read from the sensor and it will return a temperature, measured in degrees Celsius.


    Although the temperature sensor is enough to give you a rough idea of how hot
    or cold your surroundings are, it''s not a precision. It''s built into the BBC
    micro:bit''s processor and was originally designed for monitoring the processor''s
    temperature rather than environmental temperatures. If the BBC micro:bit were
    a desktop computer, that would be a problem; desktop computers run tens of degrees
    hotter than your surroundings when'
  merge: -1
  pgno: 78
