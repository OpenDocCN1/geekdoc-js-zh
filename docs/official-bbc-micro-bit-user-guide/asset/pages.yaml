- img_proc: true
  md: '# CHAPTER 13 ADDITIONAL RESOURCES


    others. If you''re struggling to come up with a concept for your next project,
    the Ideas page is sure to help.


    The Teach category is more specific. As well as a rundown of the benefits offered
    by the BBC microbit to schools, colleges, and universities around the world, each
    link provides teaching resources, hosted both by the Micro:bit Educational Foundation
    itself and specially-chosen third parties. More details on these resources can
    be found in the ''Official Teaching Resources'' section later in this chapter.


    The major advantage of the official BBC microbit website over finding-third party
    resources is directly a guarantee of quality. Everything on the website has been
    checked and vetted by the Foundation for technical accuracy and suitability, making
    it a great resource for younger students.


    # Official Teaching Resources


    The microbit has been designed to support curricula around the globe and ranging
    from the direct action of programming the device for coding lessons to its use
    in cross-curricular activities like art and music. To help teachers get the most
    from the BBC microbit, a wide range of teaching resources is available—starting
    with lesson plans and supporting materials developed by the Micro:bit Educational
    Foundation, which can be found on microbit.org/teach (see Figure 13-2).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_260_0.png)


    FIGURE 13-2: Teaching resources on microbit.'
