    # Program 3: Radio Groups


    Sometimes you don''t want all the BBC micro:bits in a given area to be talking
    to each other. Perhaps you''re in a classroom environment with children all trying
    to build radio networks which are interfering with each other. Perhaps your neighbour
    is using BBC micro:bits as well and you keeping track of each other''s networks.
    Or perhaps you''re building a project which uses many BBC micro:bits and you need
    a way to keep them organised.


    Thankfully, the BBC micro:bit is ready for this: it supports radio groups, which
    allow you to create up to 256 individual radio networks with one or more BBC micro:bits
    per network. These groups don''t affect the radio module directly—they don''t
    change the frequency at which the radio transmits or receives, for example—but
    instead instruct the BBC micro:bit to ignore any transmissions which do not match
    the group number set in the program. All nearby BBC micro:bits will still receive
    any and all radio messages sent by any other'
