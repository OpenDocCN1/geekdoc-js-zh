    +   - 3g—The 3g gesture works in the same way as the 8g gesture, but it triggers
    at a more gentle rate of acceleration.


    +   - face up—The face gesture triggers when the BBC micro:bit''s display is facing
    upward towards the user.


    +   - face down—The opposite of face up, this gesture triggers only when the BBC
