  md: '# CHAPTER 3 PROGRAMMING THE BBC MICRO:BIT


    hexadecimal code, which tells the BBC microbit what each block of its flash memory
    should store. These programs have the file extension .hex and are known as hex
    files.


    Whether you''re writing your own program or using someone else''s, these hex files
    are downloaded using your computer''s web browser. If you''ve downloaded a file,
    open your Downloads folder, click and hold the left mouse button while the cursor
    is over the file, and then drag it to the MICROBIT drive. The BBC microbit will
    see the file, analyse it, and load it into memory before restarting your new program
    can run.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_46_0.png)


    FIGURE 3-4: Dragging a hex file to the BBC micro:bit


    When a new program is loaded onto the MICROBIT drive, the BBC micro:bit will automatically
    reset in order to begin running. This will typically trigger a warning that what
    it is treating as a removable storage device has been removed without using the
    ''eject'' or ''remove hardware'' function. For a traditional storage device, removing
    it from the computer without using your operating system''s ''eject'' function
    can result in data being lost. The BBC microbit, however, is designed in such
    a way that it never needs to be ejected. If you see a warning message telling
    you otherwise, it can safely be dismissed.


    # Automatic Flashing


    If you''re running Microsoft Windows 7 or above, there''s another way to flash
    new programs onto the BBC microbit: the micro:bit Uploader tool. Available from
    makecode.microbit.org/uploader, the tool runs in the background and monitors your
    Downloads folder for new hex files. When a new hex file is detected, it is automatically
    flashed onto your BBC microbit.'
