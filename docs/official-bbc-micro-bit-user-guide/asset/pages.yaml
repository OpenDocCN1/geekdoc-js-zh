    idle, requiring large metal heatsinks and fans to keep them cool. The BBC micro:bit''s
    processor, though runs close enough to the temperature of its surroundings—known
    as the ambient temperature—that will typically be accurate within a degree or
    two.


    If you''re looking to get the most accurate temperature reading possible, it''s
    important to keep your program simple. If your program is working the BBC micro:bit''s
    processor hard—doing lots of complicated sums, for instance—then the processor
    will be warm up, throwing off your readings.


