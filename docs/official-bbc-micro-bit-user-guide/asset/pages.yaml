  md: '# INTRODUCTION


    Part II, ''Coding for the BBC micro-bit'', gets you started writing your programs.
    You learn the languages available for the BBC micro-bit and how they differ, and
    you learn to write your own programs from a simple message scrolling across the
    BBC micro-bit''s display and reading from its various built-in sensors to writing
    a simple game.


    There''s a chapter dedicated to each of the three main programming languages used
    with the BBC micro-bit: JavaScript Blocks, JavaScript, Python. Each chapter is
    designed to be as close to the others as possible, allowing you to quickly see
    the process of writing each program differs between languages. You can use the
    comparison table at the start of the section to pick a favoured language and read
    only that language''s chapter, or you can work through all three chapters to get
    a real feel for how each operates.


    Part III, ''Advanced micro-bit Projects'', gets a step further, introducing the
    radio module with examples of communicating between individual BBC micro-bits
    and groups of BBC micro-bits without the need for wires. There''s also a chapter
    dedicated to using the BBC micro-bit with the popular Raspberry Pi educational
    board computer, extending the capabilities of devices.


    In addition, you will learn how to add external components like switches and LEDs
    to the BBC micro-bit, building electronic circuits from basic components to extend
    its functionality. No soldering is involved, and the circuits are described to
    be safe and accessible for the youngest reader; they require only a small number
    of affordable electronic components.


    You will have a sound understanding of how the BBC micro-bit works, how to program
    it, and how to use it with other devices. You won''t have reached the end of its
    capabilities, though the final chapter offers information on additional resources,
    including hardware that can further increase the BBC micro-bit''s flexibility,
    and websites offering more project ideas and formal lesson plans for use in structured
    education.


    Finally, the appendices provide full program lists for every program mentioned
    in the book in all three languages, making it easy to type them in without getting
    distracted by comments and explanations of what each part of the program is doing.
    If you''d rather save your programs, you can download the same programs from the
    book''s website at www.wiley.com/go/bbcmicrobitguide. You will also find a pin-out
    diagram of the BBC micro-bit with a full list of its capabilities.


