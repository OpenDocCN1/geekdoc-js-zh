    When you press Enter at the end of Line 2, Python automatically indents Line 3
    by four spaces to indicate that it forms part of the infinite loop. Type the following:


    ```

    display.scroll(''Heading %'' % compass.heading())

    ```


    This is a little dense, so it requires a bit of unpacking. The display.scroll
    section should be familiar. It tells Python to take a message, or string, and
    print it to the BBC microbit''s display. In the Temperature Sensor, you used this
    in quick success-ion to print the temperature reading followed by a helpful Celsius
    message. Here''s doing the same thing—formatting the message printed to the BBC
    microbit''s display—in a single line: the message begins with the word Heading
    and ends with the actual sensor reading.


    The secret to this trick is surprisingly simple. It all lies in the % symbol to
    insert a variable or output of an instruction into another string. In this case,
    the first string is the word Heading followed by a space, and the second string
    is the output of the compass.heading() instruction. Notice how there are two symbols
    in this line: the first, %s, is inside the single quotes as part of the string
    and tells Python to insert a string at that position—what the s of %s means, ''string'';
    the second is outside the single quotes and tells Python that what provides the
    string that should be placed where the %s is. What you took two lines in the Temperature
    Sensor program takes one in this.


    ```

    1 from microbit import *

    2 while True:

    3 display.scroll(''Heading %'' % compass.heading())

    ```


