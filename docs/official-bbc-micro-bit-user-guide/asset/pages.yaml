  md: '# CHAPTER 10 BUILDING CIRCUITS


    sleep(1)


    As always, the BBC micro:bit runs quickly for the fading effect to be easily visible;
    this line tells the BBC micro:bit to wait one millisecond between each iteration
    of the loop making the transition more easily visible.


    ```

    for brightnessValue in range (1023, -1, -1):

    ```


    The only difference between this line and the previous for loop is the values
    given to the range instruction. This time, the count starts at 1023, where the
    previous count ended, stops before -1, and counts by each time. In other words,
    this is the exact opposite of the previous loop: it counts backward from 1023
    rather than forward to 1023, turning the LED from light to dark light.


    ```

    pin1.write_analog(brightnessValue)

    ```


    As before, you need to write the value to Pin 1 to actually change the brightness
    of the LED, which this write_analog instruction does.


    ```

    sleep(1)

    ```


    Finally, a sleep delays the process long enough to see its effect. As with the
    flashing example, changing the sleep delays changes the speed of the effect; experiment
    with different values to see how they affect the smoothness of the fade.


    This method can control hardware that regulates a PWM signal, such as stepper
    motors. To do so, you might need to change the period of the pulse; a short period
    suitable for dimming an LED may not be appropriate for a stepper servo motor.
    More information on changing the period of a PWM pulse is available in Appendix
    C, ''Python Recipes''.


    # Reading an Analogue Input


    A traditional switch or a button is a digital input; it is either pressed or it
    is not, with nothing in between. Not all inputs are digital, however. Some are
    capable of offering a range of values between fully on and fully off, and these
    are called analogue inputs.


    All three of the large input pins of the BBC micro:bit support analogue inputs
    thanks to the board''s analogue to digital converter (ADC), which takes the analogue
    inputs and transforms them into a digital format the BBC micro:bit can understand.
    For this project, you use Pin 2 of the BBC micro:bit.'
