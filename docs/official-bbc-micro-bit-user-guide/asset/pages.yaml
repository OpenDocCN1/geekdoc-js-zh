    # Writing to an LED Output


    The next circuit to build flips things. Rather than using a pin as an input and
    reading from a button, it uses a pin as an output and lights up an LED. Remember
    that all three pins can act as either an input or an output, as what they do is
    defined entirely by the program you write.


    To build this circuit, you will need the following:


    +   - Wires with crocodile clips or banana plugs

    - An LED

    - A suitable resistor


    If you purchased a component kit with your BBC micro-bit, you can find resistors
    that are matched to the LEDs. If you''re buying your components individually or
    have a kit of LEDs, you need to match your resistor to LED to protect both the
    LED and the BBC micro-bit. In this circuit, the resistor acts as a *limiting resistor*.


    If you have a resistor already matched to your LED, you can skip the following
    explanation; otherwise, it tells you how to calculate what resistor you need to
    run your LED at peak brightness without running the risk of damaging it.


    > To find the value of a current-limiting resistor that you need to protect an
    LED, you must know two things about the LED: its *forward* voltage, which is the
    voltage at which the LED is supported to light, and its *forward current*, which
    is the maximum current the LED can draw before being damaged. This information
    can be found in the data sheet available from your component supplier.


    For the BBC micro, always use LEDs with forward voltages given at 3.3V or 3V;
    any will need an external power supply and a switch to switch them on and off.
    It''s possible to use LEDs with forward voltages below 3V by using a higher-value
    resistor to protect them.


    To calculate precisely what value of resistor you need for a given LED, you need
    to do some mathematics. The formula R=(V-F)/I tells you what you need to know:
    R is resistance in ohms, V is the voltage applied to the LED, F is the forward
    voltage of the LED, and I is the maximum forward current of the LED in amps. Most
    LEDs have their forward current measured in milliamperes (mA), so you need to
    divide the value by 1,000: a 25mA forward current is the same as 0.025A.'
  merge: -1
