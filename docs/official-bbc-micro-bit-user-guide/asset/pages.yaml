    FIGURE 6-9: Initialising a variable


    Variables are a new concept. Like the name suggests, a variable is something that
    changes as the program is run. A variable can be almost anything: a number, a
    string of text, even the data required to draw a picture on the screen. The variable
    itself has two main properties: name and data. In the case of the variable you''ve
    just created, the variable name is touches and it has been set to store the value.
    The let instruction creates the variable and initializes it. A variable must always
    be initialised before it is used, which is why the let touches = 0 is placed at
    the top of the program. Creating a global variable, which can be used by any other
    part of the program. Placing the let touches = 0 line elsewhere in the program
    creates a local variable only during the part of the program—instance, within
    the basic.forever (() => {}) loop.


    Variable names should always be as descriptive as possible, so their purpose within
    the program is obvious. There are restrictions on the names you can use, though:
    you can''t use a name which is reserved for an instruction in the programming
    language you''re using; typically they can''t begin with a number, and they can''t
    contain characters or other symbols. To make variables with multiword names clearer
    to read without spaces, it is common practice to use camel case: ‘Number of Fish’,
    for example, becomes numberFish in camel case; ‘Age of User’ becomes ageUser.
    Camel case is itself written as ‘camelCase’ to make its use more obvious.


    Now that you have a variable, you need to do something with it. Move your cursor
    to the Empty line 6, within the onPressed event, and type the following (adding
    a four-space indent at the beginning if the JavaScript Editor has not done so
    for you):


    ```

    touches += 1

    ```


    Like instructions, variable names are case sensitive. If you called your variable
    touches when initialised it Touches when you tried to change it, you get an error.
    Using the wrong case is a common source of bugs in JavaScript programs.'
