    # Program 4: The Temperature Sensor


    The BBC micro:bit has more than simple inputs and touch-sensing pins. The simplest
    of these is the temperature sensor, which works exactly like a thermometer: read
    from the sensor and it returns a temperature, measured in degrees Celsius.


    Although the temperature sensor is enough to give you a rough idea of how hot
    or cold your surroundings are, though it''s not a precision instrument. It''s
    built into the BBC micro:bit''s processor and was originally designed for monitoring
    the processor''s temperature rather than environmental temperatures. If the BBC
    micro:bit was a desktop computer, that would be a problem: desktop computer processors
    run tens of degrees hotter than their surroundings even idle, requiring large
    heat sinks and fans to keep cool. The BBC micro:bit''s processor, though, runs
    close enough to the temperature of its surroundings—known as the ambient temperature—that
    it is typically accurate within a degree or two.


    If you''re looking to get the most accurate temperature reading possible, it''s
    important to keep your program simple. If your program is working the BBC micro:bit''s
    processor hard—doing lots of complicated tasks, for instance—then the processor
    begins to warm up, throwing off your readings.


    > TIP


    Start your program in the traditional way: save, move, and rename your existing
    program if you haven''t already, and then press Ctrl+A on your keyboard followed
    by Delete to start with a fresh, blank program listing.'
