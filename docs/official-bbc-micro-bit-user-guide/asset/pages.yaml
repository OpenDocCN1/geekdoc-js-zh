  md: '# # Chapter 8

    The Wireless BBC micro:bit


    In this chapter


    +   - A look at the capabilities of the BBC micro:bit''s built-in radio

    - Sending messages from one BBC micro:bit to another via the radio

    - Sending messages from one BBC micro:bit to many other BBC micro:bits via the
    radio

    - Using radio to separate BBC micro:bits, sending messages only to specific groups


    ONE OF the most powerful features of the BBC micro:bit is its built-in radio module.
    Built into its processor, a small black chip on the back of the board, the radio
    might not look like much, but it''s extremely powerful. Using the radio, you can
    link two BBC micro:bits for wire-communication or have groups dozens of BBC micro:bits
    sharing data.


    Best of all, the BBC micro:bit comes with its radio ready to run straight out
    of the box. There''s no need to connect an external antenna, and the radio frequencies
    used are licensed for free use around the world. There''s nothing to stop you
    from making your next project wireless wireless.


    # ## BBC micro:bit:bit Radio


    The BBC micro:bit''s radio module is built into the processor, a small black chip
    found on the back of the board to the left side, with the ''PROCESSOR'' label
    on the silksreen layer (see 8-1). The module itself isn''t labelled, as it is
    integrated into the


    The Official BBC micro:bit® User Guide, First Edition., Gareth Halfface.

    © 2018 John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.'
