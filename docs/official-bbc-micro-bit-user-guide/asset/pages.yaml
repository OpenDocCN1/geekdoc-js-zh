  md: '# About Flash Memory


    To understand how the BBC micro:bit stores its programs, it''s necessary to know
    a little about the different types of memory a computer has: *volatile memory*
    and *non-volatile memory.


    Volatile memory is a temporary storage area, akin to keeping something in your
    mind by repeating it over and again under your breath. It needs constant refreshing
    and stores information only as long as the computer—or, in this case, BBC micro:bit—has
    memory. Remove the power, and the contents of the memory are gone forever.


    Non-volatile memory, by contrast, is more permanent, like writing something in
    a notebook. Non-volatile memory doesn''t need to be constantly refreshed and stores
    its contents even when power is disconnected from the computer. Just like a notebook,
    however, non-volatile memory is slower to store new data and to find the data
    you''ve already stored.


    When you flash a program onto the BBC micro:bit, you''re loading it into a type
    of non-volatile storage called *flash memory*. Also known as *program memory*,
    for obvious reasons, anything stored in this area is available to the BBC micro:bit
    whenever it is powered on; that''s when you disconnect the BBC microbit from your
    computer and reconnect it in the future, it''ll automatically run the last program
    you had loaded. When the process of loading a program onto the micro:bit flashing
    the program is running, it is using a type of volatile memory known as *random
    access memory* (RAM). This means that anything you do in your program, such as
    counting the number of times a button is pressed, will be forgotten if you reset
    the BBC microbit or reinsert its power cable.


    The process of flashing a program onto the BBC micro:bit is as simple as dragging
    a file to the MICROBIT drive, as demonstrated earlier in this chapter—no matter
    how scary the phrase may sound!'
  merge: -1
