  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    To connect the BBC micro:bit to your computer, you''ll need a micro-USB cable.
    If you didn''t get one with your BBC micro:bit, you can use almost any good-quality
    cable. A cable that came with a tablet or smartphone will usually work, as will
    a low-cost cable purchased online or from a high-street shop. The only exception
    is so-called ''charge only'' cables, designed exclusively for use with chargers
    and battery packs. These lack wires going to the data pins on the USB port and
    it seems to power on, but you don''t see a removable drive (named MICROBIT) appear,
    as described later in this chapter. If this happens, you''ll need to find a different
    cable with the data pins properly wired. You''ll also need a USB Type A port on
    your computer. On a laptop, these ports are usually found at the side (see Figure
    3-1); on a desktop computer, a small number of ports are usually found at the
    back amongst the other cables.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_43_0.png)


    FIGURE 3-1: A USB Type A port


    If you have a computer with only USB Type C ports available (see Figure 3-2),
    you''ll need an adaptor which converts the USB Type C port to the more common
    USB Type A standard. Such adaptors are commonly supplied with the computer, but
    if not a search for ''USB Type C to Type A'' at an online store will provide low-cost
    options that work fine with the BBC micro:bit.'
