    # Conditional Statements


    Loops aren''t the only blocks which conditions can be attached. A powerful programming
    tool is the ''if, then, else'' conditional flow. Using an ''if, then, else'',
    you can test if a condition is true and then run a particular set of blocks, or
    run a different set of blocks if the condition is false. Unlike a loop, a conditional
    statement doesn''t loop: whatever blocks run as a result of the condition, they''ll
    only run once unless you place them inside a loop.


    Click on the Logic category of the Blocks toolbox, click on the [if true then
    else] block, and drag it. This allows you to create two lists of blocks: first,
    run next to true, run next if the condition is true; second, next to else, run
    only if the condition is false. There''s a simpler one, the [if true then] block,
    if the condition is false in an [if true then] block, then simply moves to the
    next block in the list.


    Click on the Game category of the Blocks toolbox, click on the [item touching
    ?] block, and drag it to the next of the [if true then else] block. Click on the
    word then and choose from the list of variables that appears. Click the Variable
