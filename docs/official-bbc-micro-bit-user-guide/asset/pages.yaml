  md: '# Loops


    Move cursor to the end of Line 1, and then press the Enter key to move Line 2
    down to Line 3 and create a new, blank Line 2. With your cursor at the start of
    the new Line 2, type the following:


    ```

    while True:

    ```


    This creates a means of parts of your program you want to repeat, but at the moment
    Python doesn''t understand which parts you actually want to repeat. To fix that,
    move your cursor to the start of Line 3 and press the space four times to insert
    squares. When you''re finished, the line will be four spaces inward compared to
    Lines 1 and 2.


    This is known as indentation, and it is a way to see how lines of code in a program
    nest within each other. Indentation is usually handled automatically by the Python
    Editor when required, but not when editing lines of code. In many other languages,
    indentation exists only to make the code easier for the programmer to read—the
    code could be entirely flat against the left edge of the program listing and still
    work perfectly—but Python indentation is a requirement. The level of indentation
    on each line of code shows Python where it belongs. If Python is expecting indentations
    and there aren''t any, the program won''t run properly; equally, if there are
    indentations there shouldn''t be, the program won''t work either.


    With your code properly indented, it should now look like this:


    ```

    from microbit import *

    while True:

    display.scroll(''Hello, World!'')

    ```


    Find the Download button to download your modified program. Then find it in your
    Downloads folder and drag it to the MICROBIT drive to flash. When the flashing
    finishes, you have seen "Hello, World!" message, but this time it repeats forever
    (see Figure 7–5)—or at least until you unplug the BBC microbit.


    |1 microbit import *

    2 while True:

    3 display.scroll(Hello, World!'')


