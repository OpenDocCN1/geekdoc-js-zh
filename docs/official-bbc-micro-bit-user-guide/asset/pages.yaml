  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_254_0.png)


    FIGURE 12-10: Sewing the second square-wave pattern


    # # Mounting the BBC micro:bit


    The BBC micro:bit needs to be mounted to the hat, and you can use the lengths
    of thread hanging from the hat to do so while also making the electrical connections
    needed for the rain sensor. Place the BBC micro:bit upside down under the peak
    of the cap so that the LEDs are facing inward toward the wearer and the input-output
    pins are touching the peak. Holding it in place, position the BBC micro:bit so
    that the conductive thread you currently have threaded in the needle is touching
    the GND pin. Then begin sewing loops through the hole of the GND pin and the peak
    of the cap to hold it in place (see Figure 12-11) while taking care not to allow
    the thread to touch the other length of thread.


    When you have finished, create a final loop and pass the thread through its own
    loop before pulling it tight to secure it, and then thread the needle and cut
    off any excess thread. Retread the needle using the remaining length of thread,
    and do the same to Pin 0 on the other side of the BBC micro:bit before again securing
    it in place and cutting off the excess.'
