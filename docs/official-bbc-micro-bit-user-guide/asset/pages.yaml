    # # Program 7: The Fruit Catcher Game


    The programs in this chapter have been relatively simple, doing only one thing
    at a time, as a means of introducing some of the base concepts you need to know
    when programming the BBC microbit in Python. This final program, though, is considerably
    more complex: a game which has the player—in the form of a single glowing pixel
    at the bottom of the display—attempt to catch ever-faster falling fruit—another
    pixel, starting at the top of the display and falling downwards—before it hits
    the bottom of the display.


    The Fruit Catcher game is relatively simple, but it''s still quite a hefty program.
    If you''re working through this chapter nonstop, now might be a good time to take
