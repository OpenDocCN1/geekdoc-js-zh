  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    Some breakout boards provide access to all or most of the smaller pins on the
    BBC micro:bit, the ScienceScope version concentrates only on the general-purpose
    input-output (GPIO) pins. Besides breaking out the large Pins 0 through 2, ScienceScope''s
    board provides easy access to the analogue-to-digital Pins 3, 4, and 10, and the
    digital-only Pins 13, 14, 15, 16, 19, and 20.


    The ScienceScope board also includes four linked outputs for 3.3V power and GND
    connectivity, with a dedicated power supply input for powering the micro:bit and
    its power connectors. This board brings greater scope for powering higher-current
    devices, such as ultra-bright LEDs, that others rely purely on the micro:bit''s
    internal power supply.


    You can find more information on the ScienceScope Micro:bit Breakout Board at
    sciences.uk.


    # Proto-Pic Bread:Bit


    The Proto-Pic Bread:bit board (see Figure 11-3) is designed for use with a solderless
    breadboard, which is not included in the package. Rather than connecting wires
    directly to the breakout board, the Bread:Bit is inserted into a solderless breadboard
    and connections made through that. For anyone looking to build more complicated
    projects, this makes for a more stable build with fewer trailing wires and can
    even be soldered directly to stripboard to build a permanent add-on circuit from
    the micro:bit can be easily removed and reconstructed.


    The Bread:Bit provides connections for all 25 of the pins on the micro:bit, making
    it suitable for any project. Each pin is a single connection on the breadboard,
    but the 3V and GND pins. The board is provided with the edge connector soldered
    into place, but the 2.54mm pin headers left off; for an extra fee, it''s possible
    to build a version with the pin headers already soldered into place.


    You can find more information on the Proto-Pic Bread:Bit at proto-pic.co.uk.


    # Proto-Pic Exhi:Bit


    The second prototyping board design from Proto-Pic, the Exhi:Bit (see Figure 11-4),
    is designed to be fully comprehensive. Where the Bread:Bit is designed to be used
    with an optional solderless breadboard, the Exhi:Bit comes with its own, which
    can be slotted into the middle of the board. For more permanent projects, the
    central area also includes a stripboard-like prototyping area onto which you can
    solder your own components.'
