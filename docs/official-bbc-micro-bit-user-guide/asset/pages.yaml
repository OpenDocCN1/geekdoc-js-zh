  md: '# CHAPTER 8 THE WIRELESS BBC MICRO:BIT


    # 171


    # Testing the Group Feature


    Connect all three BBC micro:bits to power, either via the micro-USB port to the
    battery connector. By pressing Button A on each in turn. You see the same effect
    as in Program 2, with the message from transmitting BBC micro:bit being received
    and displayed on both of the other BBC microbits. Press Button A on BBC micro:bit
    C, and you see the same thing that happen.


    Now press B on BBC micro:bit C, wait for the message confirming that the radio
    has been switched, and press Button A on BBC micro:bit A. This time you see something
    different: the message Hello from A scrolls across the display of BBC micro:bit,
    but not BBC micro:bit C. This is because the three BBC microbits are split across
    different groups: BBC microbits A and B are in group one, while BBC micro:bit
    C is on its own group. You can confirm this in the other direction: press Button
    A on BBC micro:bit C again, and no message appears BBC micro:bit C is in a group
    all by itself with nothing to receive the message it has transmitted. Remember
    that changing groups doesn''t alter the radio frequency; all the BBC microbits
    are still technically receiving the radio signals sent by BBC micro:bit C, but
    because it is in a different radio group the messages are ignored.


    Figure 8-9 demonstrates what''s happening. A three-BBC micro:bit network is now
    two networks: one with two BBC microbits it and the other with one BBC micro:bit
    in it. The lines of communication between BBC micro:bit C and the other two have
    been cut. The arrow in Figure 8-9 indicates possible directions of communication:
    BBC micro:bit A and BBC micro:bit B are free to act on each of their signals,
    but anything sent to or from BBC micro:bit C will be ignored.


    Press Button B on BBC micro:bit A now, followed by Button A when the confirmation
    message has stopped scrolling. Now you see the message Hello from A: scrolling
    across BBC micro:bit C instead of BBC micro:bit B, both BBC microbits A and BBC
    micro:bit C are now in group two (see Figure 8-10). As before, the arrow indicates
    possible directions of communication: BBC micro:bit A and BBC micro:bit C are
    now free to communicate, as they are in the same radio group, whereas BBC micro:bit
    B—left behind as the only member of the original radio group—is cut off.


    BBC micro:bit B, meanwhile, is still in the original group, now entirely on its
    own. Press Button B on BBC micro:bit and it joins the other groups in two: pressing
    Button A on any of the BBC micro:bits shows the message across both of the other
    BBC micro:bits (see Figure 8-11). As all three BBC microbits are now in the same
    group, BBC micro:bit is free to communicate with any other BBC micro:bit. A signal
    sent from BBC micro:bit will be received and acted upon by BBC micro:bits B and
    C.'
