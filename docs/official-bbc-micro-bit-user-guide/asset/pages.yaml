  md: '# CHAPTER 13 ADDITIONAL RESOURCES


    The lesson plan booklet covers six introductory lessons, beginning with a basic
    introduction to the hardware as you find in Chapter 1, and working through increasingly
    complex projects culminating in an independent project to build a step counter
    powered by the BBC micro-bit''s accelerometer. Sample code, written in the child-friendly
    Block Editor, is provided at every step. All the materials are licensed as Creative
    Commons Attribution Non-Commercial Share Alike 4.0, allowing for their reproduction
    for teaching purposes but not for commercial reuse.


    You can find these resources at mb4ps.co.uk/resources.


    # TES Magazine


    Formerly known as the Times Educational Supplement, TES Magazine runs a website
    where teachers upload resources, ranging from lesson plans to colour-posters and
    ''cheat sheets'' for reference (see Figure 13-6).


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_264_0.png)


    FIGURE 13-6: Teaching resources from TES Magazine


    While membership to the TES website is free, not all the resources are. The magazine
    runs a resources marketplace of sorts, and contributors can choose a fee to associate
    with their materials. These fees are typically small—around £2–£5—and many contributors
    make their materials available free of charge, meaning its a worthwhile resource
    for those operating their classrooms on a strictly restricted budget.


    You can find these resources at www.tes.com/resources.'
