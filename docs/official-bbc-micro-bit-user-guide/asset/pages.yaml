  md: '# 30 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    Traditionally, flashing a microcontroller on a board like the BBC micro:bit requires
    specialist software that has to be installed on every computer on which you want
    to program. The BBC micro:bit, though, is significantly simpler: when you have
    a program to load, simply drag it from its folder on your computer to the BBC
    micro:bit, and it will automatically load itself into memory.


    Connect the micro-USB end of your cable to your BBC micro:bit and the larger USB
    Type A end of your cable to your computer now. After a few seconds, it will appear
    as a MICROBIT drive (see Figure 3-3). At a glance it looks like any flash drive
    or external hard drive you may have used before and shows two files: DETAILS.TXT
    and MICROBIT.HTM. The first file contains technical details about the firmware
    running on your micro:bit; the second provides a handy link to the micro:bit website.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_45_0.png)


    FIGURE 3-3: The BBC micro:bit as a removable drive


    If you try to delete or edit either of these files, you''ll be protected against
    modification. This is because the BBC micro:bit isn''t a true removable disk like
    a flash drive; instead, you''re seeing an interface between your computer and
    the firmware. If you try to copy a file from your computer—a picture, say, or
    a word document—to the BBC micro:bit, it will have disappeared the next time you
    put it in without affecting the smallest bit of difference to the way BBC micro:bit
    works.


    The only files which the BBC micro:bit will not ignore when copied to the MICROBIT
    drive come in the form of programs you''ve written, which are read by the BBC
    micro:bit and stored in flash memory to replace the currently-loaded program.
    These programs aren''t like the programs you''d run on your computer that they''re
    not executable programs; instead, they''re'
  merge: -1
