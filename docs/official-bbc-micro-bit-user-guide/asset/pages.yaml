  md: '# Code Clubs


    A non-profit organisation founded in 2012 and brought under the umbrella of the
    Raspberry Pi Foundation in 2015, Code Club aims to support extracurricular education
    through a network of volunteers and educators who run coding clubs for children
    between 9 and 11 in more than 80 countries and 15 languages (see Figure 13-7).
    While the Code Club project itself supports a range of languages and hardware,
    many clubs have adopted the BBC-microbit for introducing coding concepts.


    If you''re interested in attending a Code Club, you can find your nearest at www.codeclub.org/about.
    If there aren''t any nearby consider setting up one. A volunteer-driven organisation,
    Code Clubs are entirely dependent on people finding a gap and filling it—and don''t
    need to be an expert yourself, thanks to a wealth of resources and the support
    of the Code Club community around you.


    If you''d rather look through the Code resources in the comfort of your own home,
    or use them in a more formal educational environment, you can find them at www.codeclub
    projects. All resources are free, licensed for noncommercial use


    As your skills improve, you can easily give back to the Code Club community you
    so wish. As you work through the projects, either at a Code Club or on your own,
    you''re given the opportunity to provide feedback or suggest amendments. When
    your skills are at their peak, you can even submit your projects for inclusion—and
    if you are multilingual, you can help by translating existing projects and resources
    for international use.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_265_0.png)


    Figure 13-7: Code Club website'
