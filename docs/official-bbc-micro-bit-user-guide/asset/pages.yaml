  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    The Raspberry Pi runs a version of the GNU/Linux operating system dubbed Raspbian,
    which includes programming and other educational tools preloaded. The techniques
    described in this chapter can also be used on any other computer featuring the
    same tools, including your existing desktop or laptop. The easiest way to achieve
    this is to download run Debian+Pixel, a GNU/Linux distribution for desktop and
    laptop computers from the Raspberry Pi Foundation. Running this, your existing
    computer will be able to do everything in this chapter just as though it were
    a Raspberry Pi.


    More information on Debian+Pixel, which is available to download free of charge
    and is compatible with most computers from the last decade or so, can be found
    on raspberrypi.org/blog/pixel-pc-mac.


    # About the Raspberry Pi


    Released in February 2012, the Raspberry Pi was an immediate success. Offering
    similar capabilities to a full-size desktop or laptop computer in a footprint
    no larger than a credit card, the Raspberry Pi has found a home in education and
    tinkerers labs throughout the world, and it recently took its place in the history
    books as best-selling computer ever.


    The Raspberry Pi has a couple of major advantages over a traditional desktop computer,
    alongside its pocket-friendly size: it''s cheap, costing no more than a single
    videogame or a couple of new-release films in its most expensive incarnation,
    and it features a 40-pin general-purpose input-output (GPIO) header for communicating
    with external hardware (see Figure 9-1)—much like the BBC microbit''s 25-pin edge
    connector.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_187_0.png)


    FIGURE 9-1: A Raspberry Pi 3 microcomputer'
  merge: -1
  pgno: 187
