    # Greetings from the BBC micro:bit


    Fresh from the box, the BBC micro:bit comes preloaded with a sample program which
    walks you through its various capabilities, including using Button A and B and
    the accelerometer. This runs whenever the BBC micro:bit is powered via USB or
    battery, and it acts as a great introduction to the platform.


    If your BBC micro:bit has been used before and has been loaded with a different
    program, the new program will run instead of the factory-loaded sample program.
    If it does, you can skip the remainder of this chapter and move to Chapter 3.
    If you or someone else has replaced the sample program and you want to load it
    back again, you can download a copy from support.microbit.org searching for ''first
    experience demo program''. You will learn how to load this onto the BBC micro:bit
    in Chapter 3.


    The program demonstrates the capabilities of the BBC micro:bit''s LED display,
    tests that both buttons are working, and shows how you can use the accelerometer
    as a more complex input. At the end of its run, which is detailed in full later
    in this section, it displays an attractive animation; if you''d like to start
    the program again, you can just press the Reset button on the back of the BBC
    micro:bit.'
