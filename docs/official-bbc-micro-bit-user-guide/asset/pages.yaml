  md: '# CHAPTER 4 PROGRAMMING LANGUAGES


    # 45


    partially the other way around. If you''ve used features available in JavaScript
    that aren''t available in JavaScript Blocks, such as functions, they''ll appear
    as grey blocks you can move and delete but not edit. Even one-way translation
    from JavaScript Blocks to JavaScript makes it the obvious choice for progressing
    from a visual programming language to a more traditional one.


    Another advantage of the JavaScript Editor is that it retains the Blocks toolbox
    of JavaScript Blocks. Clicking on an instruction block in JavaScript Blocks puts
    a block within the visual editor for you to click and drag around, clicking on
    the same instruction block in JavaScript inserts a copy of the instruction—complete
    with any gaps you might need to fill in, with the numbers you want to compare
    or the message you want to print—on your current line.


    Some features available in JavaScript are not available in JavaScript Blocks,
    however. When writing more complex programs, JavaScript gives you the ability
    to create subroutines and functions—a capability Blocks presently lacks—although
    only by hand rather than using the Blocks toolbox the language shares with JavaScript
    Blocks.


    JavaScript was originally implemented as an interpreted language, but the BBC
    micro:bit uses it as a compiled language. When you click the Download button in
    JavaScript (or JavaScript Blocks) your program is translated to machine code and
    compiled into a BBC micro:bit can run once flashed onto its memory.


    # Python


    Created by Guido de Rossum and first released in 1991, Python is a hugely popular
    programming language for both education and professional development. Code written
    in Python can be more readable to the inexperienced than the same code written
    in JavaScript, thanks to the use of white space to indicate blocks of code rather
    than curly braces (see Figure 4-3). Technically, the Python available for the
    BBC micro:bit is variant designed specifically for use with microcontrollers and
    more properly called MicroPython, although the underlying language itself is still
    Python.


    Unlike JavaScript, there is currently no ''Blocks'' variant of Python. Programs
    are entered into the editor old-fashioned way, typed out by hand using a reference
    guide for the instructions—or, when you''re experienced enough, entirely from
    memory—with a Snippets menu for inserting the most common code segments automatically.
    Although this can make the Python Editor seem forbidding compared to the JavaScript
    Editor, the language itself is designed to be accessible and easy to read and
    write with a minimum of programming experience.'
