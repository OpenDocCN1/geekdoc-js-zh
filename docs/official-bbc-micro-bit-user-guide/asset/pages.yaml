  md: '# # Chapter 4

    Programming Languages


    In this chapter


    +   - An overview of programming languages and their necessity

    - A look at the three main programming languages for the BBC micro-bit: JavaScript
    Blocks, JavaScript, and MicroPython

    - A guide to choosing a programming language


    **TO THE** most from your BBC micro-bit, you''re going to have to learn to write
    your own programs. Before you can jump into programming the device, however, you
    have a decision to make: which of the three main programming languages—JavaScript
    Blocks, JavaScript, and Python—to use.


    # About Programming Languages


    Computers are surprisingly simple devices. At their heart, a computer is little
    more than a series of switches which can be either or off. While your house might
    have a dozen switches for lights, a computer has billions upon billions of switches
    which can do incredible things when coming in interesting ways.


    Before a computer can do anything, though, it needs to be programmed. When you
    turned your BBC micro-bit and ran the introductory program in Chapter 2, ''Getting
    Started with the BBC micro-bit'', you were running a program someone had previously
    written and loaded onto your micro:bit. Without that program, there would have
    been no smart little animation or friendly messages; the BBC micro-bit would have
    simply nothing.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    At its lowest level, a computer''s processor is given a series of instructions
    in machine code. This is a symbolic language filled with short instructions like
    ADD, MOV, BNE, and it works on locations in the processor''s memory called registers.
    While it is entirely possible to write complex programs in machine code, it can
    get confusing, which is higher-level programming languages were invented.


    These languages sit at a level above machine code. They are much easier for people
    to understand and write with friendly instructions like ''print'' to do what might
    take a machine code program dozens of instructions to complete. They''re harder
    for the computer to understand, though, and must be translated into machine code
    before run—like how a document in French would need to be translated before it
    would be accessible to someone who could only read English.


    If each line of your program is run as-is on the BBC micro-bit, without needing
    to be translated into machine code first, the language is known as interpreted
    and the equivalent of having an interpreter translating foreign speech for you
    as it happens. If the translation to machine code happens all at once you have
    finished writing your program, it is known as a compiled language and is the equivalent
    of having an entire written document translated into your language before you
    start to read it.


    Sometimes the lines between interpreted and compiled languages are blurred. The
    languages used on the BBC micro-bit can be either interpreted or compiled, but
    they are typically compiled once you write them in an editor and the compiled
    program is flashed onto the BBC micro-bit (see Chapter 3, Programming the BBC
    micro-bit). In some instances, you might use the BBC microbit as an interpreter,
    as in Chapter 9, ''The BBC micro-bit and the Raspberry Pi''.


    # The Three Main BBC micro:bit Languages


    There are hundreds of programming languages, many specialised for a particular
    purpose, such as distributing a complex program over many different processors
    or writing graphical programs and games. For the BBC micro:bit, though, there
    are three ''core'' languages for which official browser-based editors are available:


    +   - JavaScript Blocks

    - JavaScript

    - Python'
