  md: '# CHAPTER 9 THE BBC MICRO:BIT AND THE RASPBERRY PI


    Designed with the needs of beginners in Mu, Mu makes it as easy as possible to
    write programs for the BBC micro:bit. Any code which has been written in or for
    the browser-based MicroPython editor works unchanged in Mu, the menu across the
    top offers functionality not available in the browser editor: Flash and Repl.


    Note, that some functions—including support for the BBC micro:bit''s radio, as
    described in Chapter 8—may not be available in the version of Mu available in
    Raspberry. If your program runs on any of these functions, indicated by a syntax
    error displayed in Mu the program works fine through the browser-based Python
    Editor, then you will need to use the Python Editor (at python.org) or try the
    latest version of Mu codewith.mu.


    When using Mu, clicking the Flash button after saving your program takes care
    of loading it onto the BBC micro:bit. Instead of having to open your file, find
    the saved program, and drag it to the MICRO drive, you simply installed onto the
    BBC micro:bit. If you change your program and want to update the BBC micro:bit,
    simply click the Save button and the Flash button again; you can repeat this many
    times as you like.


    Clicking the Repl button opens an interactive shell, known as a Read-Eval-Print-Loop
    (REPL), which allows you to type MicroPython code to be run directly on the BBC
    micro:bit (see Figure 9-4). Instead of writing a list of instructions which the
    BBC micro:bit runs one at a time, you can type a single instruction and have it
    immediately run on the BBC micro:bit—a time-saving way of testing new inputs and
    features without having to go through the process of writing a full program, saving
    it, and flashing it to the BBC micro:bit.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_190_0.png)


    FIGURE 9-4: The Repl interactive shell in Mu'
