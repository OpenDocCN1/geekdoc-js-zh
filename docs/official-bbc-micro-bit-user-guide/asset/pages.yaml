    In programming, this is a `loop`. When the program reaches the end of its instructions—in
    this case, it has finished scrolling the message from the [show string "Hello,
    World!"] block—returns to the beginning of the loop and starts over again. As
    the name implies, the [forever] block will loop forever; in programming, this
