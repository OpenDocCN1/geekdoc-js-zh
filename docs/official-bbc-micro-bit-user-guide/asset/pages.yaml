  md: '# Program 1: ‘Hello, World!’


    Hello, World! is the traditional first program for any language. It''s basic by
    design but offers a first glimpse of a given language is like to program with
    the bonus of a quick payoff in the form of a message proving that your program
    is alive and well.


    Start by opening your browser and going to python.microbit.org to load the Python
    Editor. The Python Editor loads with a default program already typed in, as an
    introduction. Although this program is effectively an ‘Hello, World!’ program,
    start by deleting all the text currently in the program listing to begin with
    a completely blank slate. The quickest way to do this is to press Ctrl+A on the
    keyboard to select all the text, and then press either the Backspace or the Delete
    key.


    Hello, World! is a simple program that requires two lines of code. The first is
    required by all micro:bit Python programs, regardless of what the program is designed
    to, and you use the same line in every program in this chapter. With all text
    deleted from the program listing and your cursor at the start of the new-blank
    Line 1, type the following:


    ```

    from microbit import *

    ```


    This is known as an import instruction; it tells Python that you will be using
    instructions found in the library called microbit. A Python library contains a
    collection of pre-written code which is made available as functions, and the microbit
    library''s functions revolve around you using the BBC micro:bit in your program.
    Without this line, which tells Python to add all the instructions from the microbit
    library into your program ready for you, you wouldn''t be able to use the BBC
    microbit''s screen, sensors, input-output pins, or any other feature.


    The second line of your program is the one that actually does the work of printing
    out the "Hello, World!" message to the BBC micro:bit''s display. With your cursor
    at the end of Line 1, press Enter to insert a new, blank Line 2 and type the following:


    ```

    display.scroll(''Hello, World!'')

    ```


    This line tells Python that you are using the scroll instruction from the display
    category of instructions and that you are passing the message "Hello, World!"
    (see Figure 7-2). As the name suggests, this instruction takes the message you
    have written and scrolls across the BBC micro:bit''s display for you to read.'
