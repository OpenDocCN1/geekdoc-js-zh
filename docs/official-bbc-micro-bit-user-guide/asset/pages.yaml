  md: '# 216


    # THE OFFICIAL BBC MICRO:BIT USER GUIDE


    This program again uses an infinite loop to prevent it from stopping as soon as
    a single value has been read.


    ```

    potValue = pin2.read_analog()

    ```


    This creates a variable called potValue and then takes an analogue reading from
    Pin 2 and stores it. The output of a read_analog instruction is always a number
    between 0 and 1023, where 0 represents off or OV and 1023 represents fully on
    or 3V.


    ```

    display.scroll(str(potValue))

    ```


    The value read in the line above is now printed to the display using the display.scroll
    instruction. Because the reading is an integer data type, however, it has to first
    be converted to a string ready for printing. The str instruction handles this.


    Unlike earlier programs, there''s no need for a delay; printing the value to the
    BBC micro:bit''s display pauses the program until it is complete, introducing
    a natural delay and giving you a chance to read the numbers.


    With these circuits under your belt, it''s time to flex your skills. Try connecting
    the button, the LED, and the potentiometer to the BBC micro:bit at the same time,
    reading from the potentiometer and using that information to control the brightness
    of the LED and the button to turn it on and off. Once you''ve mastered it, you''re
    well on your way to building your own circuits which can extend the BBC micro:bit''s
    capabilities in all kinds of ways.'
