    # Practical Example: A CPU Monitor


    A good example of how the BBC microbit can be put to use with your Raspberry Pi
    is to turn its display into a graph of the Pi''s CPU load—a measure of how the
    processor is working. Sat at the desktop, see short bars on the graph; play or
    load a big web, and the bars shoot up as the processor gets to work.


    This sample project uses the MicroPython Repl console, so if you are running a
    different program on your BBC microbit, you need to flash a copy by clicking Download
    on an empty MicroPython program in the editor and dragging it to the MICROBIT
    or clicking the Save and Flash buttons in Mu.


    Before writing the CPU monitoring program itself, you need to install a new Python
    library called psutil (process utilities). To do so, load the terminal by clicking
    on the Terminal icon on the top menu bar or its entry in the Accessories submenu
    of the Raspberry menu, and type the following command:


    ```

    sudo apt-get -y install python-psutil

    ```'
