    continuously with no delay or gap in the number, it begins printing the temperature
    followed by the word Celsius with a space between the two—which is the reason
    for having a space when you typed Celsius in Line 3.


    If you''re running your program on a physical BBC microbit, touch a metal surface
    to discharge any static electricity you are holding (see Chapter 2, ''Getting
    Started with the BBC microbit''). Then carefully and place the tip of your finger
    over the small square labelled PROCESSOR on the back of the BBC microbit. After
