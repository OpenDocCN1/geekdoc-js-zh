  md: '# # Chapter 11

    Extending the BBC micro:bit


    In this chapter


    +   - Extending the BBC micro:bit with breakout boards

    - The BBC micro:bit and robotics: off-the-shelf solutions to building a BBC micro:bit-bit-powered
    robot

    - Other notable BBC micro:bit add-ons


    **THE BBC MICRO:BIT** is a powerful device in its own right, but it really comes
    into its own when it''s paired with hardware that expands its capabilities. From
    simple breakout boards which provide easy access to the 20 pins spaced along its
    edge connector to kits for building your own autonomous robots, this chapter introduces
    some of the available for building more complex projects.


    > Only use add-boards and devices which are being compatible with the BBC micro:bit.
    Microcontrollers use a range of different voltages, and hardware made for a microcontroller
    running at 5V will best fail to work properly with the 3V BBC micro:bit or at
    worst damage your BBC micro:bit.


    # ## Extending via Breakout Boards


    The large pins on the BBC micro:bit''s edge connector are enough to build small
    projects, but eventually you''ll find yourself needing more. A breakout board
    provides easy access to the smaller pins on the edge connector, multiplying the
    amount of hardware you can add while providing access to the more advanced bus
    types.


    *The Official BBC micro:bit* User Guide*, First Edition., Gareth Halfiface.

    © 2018 by John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.'
  merge: -1
