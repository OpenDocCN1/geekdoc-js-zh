    > TIP If you''re having difficulty getting the concept of radio groups clear in
    your head, imagine each group is a room. Two people talking in the living room
    can find each other, but the person in the bedroom has no idea what they are saying.
    If one person moves from the living room to the bedroom, the two people now in
    the bedroom can talk but the person left in the living room can''t hear them.
    Only people in the same room can hold a conversation, just as BBC micro:bits in
    the same radio group can form a radio network.


    With 256 groups at your disposal, it''s possible to set up extremely dense networks
    with hundreds of BBC micro:bits and never run into problems with messages going
    somewhere they shouldn''t.


