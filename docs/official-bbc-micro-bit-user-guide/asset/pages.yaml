    Code tab.


    +   **The Share button**Located next to the Projects menu and shaped like a circle
    with two circles attached on sticks, use this button to publish and share a program
    you created in the JavaScript Editor.


    +   **The Editor toggle**Looking like a jigsaw piece next to some lines of writing
    and located in the middle of the top menu bar, use this to toggle between JavaScript
    and JavaScript blocks. The former mode will be used throughout this chapter; the
