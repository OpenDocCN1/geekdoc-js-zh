    word and the ? symbol of the [player touching] block?, and then click the word
    to change it to the fruit variable. The final block should read [player touching
    fruit].


    This [player touching fruit?] block is the test for the condition; it checks whether
    the player sprite, created at the start of the game, is touching the fruit sprite
    when the fruit sprite has reached the bottom of the screen. If the player is touching
