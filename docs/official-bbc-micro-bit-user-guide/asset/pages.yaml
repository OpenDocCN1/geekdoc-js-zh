  md: '# 238 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    the needle without help. Needle readers are readily available from craft and fabric
    shops, often in a kit with needles.


    +   - **A thimble**—As with the needle threader, you don''t strictly need a thimble,
    but if you''re working with tougher fabric or are inexperienced in sewing, it
    makes life a lot easier. Usually made of metal or ceramic, the thimble goes over
    your thumb or finger and prevents you from accidentally pricking yourself with
    the needle as it passes through the fabric.


    +   - **Scissors**—You need to be able to cut lengths of thread to size, and for
    that you need a small sharp pair of scissors. Try to keep a dedicated pair for
    that task. Conductive thread is made of metal and can easily blunt or dented in
    scissors blades, having a pair only for cutting conductive thread stops you having
    issues using them to cut anything else afterward.


    If you''ve sewn with traditional cotton thread before, using conductive thread
    should be immediately familiar, and you can skip ahead to the practical project
    later in this chapter. If not, follow the guide to get started.


    Start by cutting a length of conductive thread from the spool with your scissors.
    Always err on the side of having excess thread left over your length after you''ve
    finished, and remember that you may be sewing in zig-zag patterns, which increases
    the amount of thread you compare to the distance it covers on your fabric.


    > If you''re just practising and don''t want to waste your conductive thread,
    buy a spool of cheap cotton thread of the same thickness. Although it doesn''t
    conduct electricity, it allows you to practice sewing without wasting conductive
    thread.


    Take the opposite end of your length of thread to the one you just cut and tie
    a knot in it. This knot stops the thread from being pulled through the hole the
    needle makes as you begin sewing, so it needs to be reasonably large; looping
    the thread through the knot several times before tightening it to increase its
    size (see Figure 12-5).


    Take the end of the conductive thread you cut and pass it through the eye of the
    needle, pulling a short length to hold (see Figure 12-6). Conductive thread frays
    quickly, if you find it difficult to thread through the needle, consider making
    a fresh cut, folding the thread and passing the folded portion through the needle
    instead, or using a needle threader to make the process easier.


    You''re now free to begin sewing. Placing a thimble on the finger or thumb on
    the other side of the fabric, push the needle carefully through. When the needle
    is around halfway through, switch to the other side of the fabric and begin pulling
    until the needle is all the way through and is pulling the conductive thread through
    the fabric.'
