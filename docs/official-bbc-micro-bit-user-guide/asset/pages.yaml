  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    All electronics are sensitive to what is known as electrostatic discharge (ESD).
    If you''ve walked on a thick carpet on a humid day and touched a metal door knob,
    you have experienced ESD for yourself in the form of an audible ''crack'' and
    a bright spark arcing from hand to the metal surface. ESD is a minor annoyance
    to humans, but to sensitive electronics it can be fatal.


    To make sure that your BBC micro:bit remains safe from damage, take a few precautions
    against ESD. Start by always touching a metal surface before picking up the BBC
    micro:bit so if you have built up a static charge it discharges into something
    other than the BBC micro:bit. When holding the BBC micro:bit, try to hold it by
    the sides rather than by the copper-coloured strip along the bottom, and keep
    your fingers away from the small black components on the back of the board.


    # Powering the BBC micro:bit


    Like any electronic device, the BBC micro:bit needs electricity to operate. It
    may be made of several clever components, but it still needs a power source before
    any of them will do anything.


    The most common way to power the BBC micro:bit is via its micro-USB port, or by
    connecting two insert 1.5 V AAA or AA batteries into a battery holder which can
    be connected to the BBC micro:bit''s secondary power input.


    > The micro:bit can be powered by three ways: connecting any 3V power supply to
    the pins marked ''3V'' and ''GND'' on its edge connector. Doing so, bypasses protections
    against short-circuiting and supplying too high a voltage to the BBC micro:bit,
    and can result in damage to the micro:bit if its clips shift during use. For more
    information on using the 3V pin, see Chapter 10, ''Building Circuits''.


    # USB Power


