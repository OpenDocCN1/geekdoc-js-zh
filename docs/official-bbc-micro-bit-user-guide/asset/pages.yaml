  md: '# Introduction


    **EDUCATIONAL COMPUTING HAS** a long and storied history, beginning with the adoption
    of mechanical calculators to aid with mathematics classes through to the early
    days of microcomputing with initiatives like the BBC Computer Literacy Project
    in the 1980s. As the cost of computers came down and their capabilities increased,
    schools around the world rapidly went from a single shared computer to entire
    rooms filled with computers, integrating them into languages and history to engineering
    and art.


    Today many homes have a computer of their own, or in some cases more than one.
    While access to computers has increased, actually operating them brings with it
    a sense of being disconnected from their inner workings. The BBC Micro, the 1980s
    microcomputer designed by Acorn Computers at the heart of the BBC Computer Literacy
    Project, loaded straight into a text-based programming language known as the Beginner’s
    All-Purpose Symbolic Instruction Code (BASIC) and invited experimentation; today,
    the majority of computers load into a graphical user interface (GUI) which emphasises
    the use of pre-written programs over creating your own.


    The BBC microbit is designed to bring back the days of learning to write your
    code on a low-cost, easily-understood platform. Designed to sit at the heart of
    an international computer literacy programme directly inspired by the BBC’s original
    Computer Literacy Project, the BBC microbit is an affordable microcontroller on
    which you can run your programs to do everything from spell your name or play
    a game to turn lights on and off or communicate via radio.


    Schools around the world have begun to adopt the BBC microbit in their curricula,
    but it’s by many exclusively for structured educational use. The device’s accessible
    nature means it can be used to teach programming and concepts to children of any
    age, its robustness and small size mean it’s extremely portable and well-suited
    to wearable projects, and its surprising power and flexibility mean you’re unlikely
    to find yourself restricted by its capabilities when you are using it at the heart
    of more complex projects.


    # Who This Book Is For


    This book is written for anyone interested in working with the BBC microbit. You
    don’t need pre-existing knowledge of computers, electronics, or programming to
    be able to pick up a BBC microbit and get started.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'All you need to get the most from this book is the ability to read and a willingness
    to learn. If you''ve used computers before, you''ll find that you are able to
    skim through some of the early chapters on general concepts. If you''ve used other
    microcontroller-based development boards, you can skip more. If you''ve written
    your own computer programs, then you''ll find programming for the BBC micro:bit
    immediately familiar. And if you know your way around an electrical circuit, the
    later chapters should hold few surprises.


    Whether you''re an existing user of the BBC micro:bit or a complete newcomer,
    this book aims to get you started on your journey with a minimum of fuss and maximum
    enjoyment.


    # What This Book Covers


    The march of technology is constant, and the BBC micro:bit is no exception. This
    book has been written based on the most recent version of the BBC micro:bit hardware,
    revision 1.3b, but it is entirely applicable to all versions going back to the
    first prototype versions for schools for testing purposes. Equally, it will remain
    applicable to all future revisions thanks the steering work of the Micro:bit Educational
    Foundation, which has been instrumental in the development of this book.


    The software for the BBC micro:bit is, with the hardware, under constant development.
    References to the software in this book are accurate at the time of writing, and
    all screen-shots and related materials have been captured on the very latest software
    versions. Over time, small changes may be made to the way the software looks,
    but the way it works will remain the same.


    This is especially important for the programs contained within this book. The
    languages available for the BBC microbit will expand over time and gain additional
    features, the existing features will always be available. A program taken from
    this book today will still be usable with the BBC micro:bit years down the line.


    # How This Book Is Structured


    Part I, ''An Introduction to the BBC micro:bit'', offers a guide to the hardware
    and how it works, step-by-step instructions on unpacking your BBC micro:bit and
    exploring its sample program, and connecting the BBC micro:bit to your computer
    so you can load a program of your own. This section also contains a number of
    tips on working with the BBC micro:bit, including how to handle it to protect
    it against possible damage. Even if you''ve already worked with a BBC micro:bit,
    reading this section is well advised.'
