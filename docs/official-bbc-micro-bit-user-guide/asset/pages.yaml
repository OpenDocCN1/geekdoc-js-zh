    If you press the SHAKE button on the simulator, you will briefly see the surprised
    icon before the asleep icon takes over. If you continuously press the SHAKE button—the
    simulator equivalent of continuously shaking the BBC micro:bit without stopping—the
    ‘face’ will change from the surprised icon to the asleep icon and back again over
    and over relatively quickly. That''s not very realistic; it takes time to get
    back to sleep when you''ve shaken awake!


    To fix this, you''re going to need to add a delay between the two [show icon]
    blocks. A delay exactly what its name suggests: it pauses the program for a set
