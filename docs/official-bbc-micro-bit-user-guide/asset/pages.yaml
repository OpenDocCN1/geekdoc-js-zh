    Variables are a new concept. Like the name suggests, a variable is something that
    changes as the program is run. A variable can be almost anything: a number, a
    string of text, even the data required to draw a picture on the screen. The variable
    itself has two main properties: name, and its data. In the case of the variable
    you''ve created, the variable name is touches, and its data. The first let instruction
    creates the variable and initialises it. A variable must always be initialised
    before it is used, which is why the library import doing. So creates a global
    variable, one that can be used by any other part of the program; making the touches
    = 0 else in the program creates a local variable accessible only during part of
    the program—instance, while a True : loop.


    > Variable names should always be as descriptive as possible, so their purpose
    within the program obvious. There are restrictions on the names you can use, You
    can''t use a name that is reserved for an instruction in the programming language
    you''re using, typically can''t begin with a number, and they can''t contain spaces
    or other symbols. To make variables with multword names clearer without read spaces,
    it''s common practice to use ‘camel case’: ‘Number of Fish’, for example, becomes
    ‘numberFish’ in camel case; Age of User’ becomes ‘ageOf’. Camel case itself is
    often written as ‘camelCase’ to make its use more obvious.'
