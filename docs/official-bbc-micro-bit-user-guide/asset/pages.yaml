  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    As your skills grow and you look to build bigger and more complex projects, you
    may find you additional tools, such as tweezers, a work stand (also known as helping
    hands), or tools for removing rather than applying solder. You may also find a
    break-out-board, which makes it easier to use the BBC microbit with a breadboard
    or storyboard, a useful accessory; more information on these can be found in Chapter
    11, ''Extending the BBC Microbit''.


    For now, you can begin learning with the parts from the first list.


    # The Input-Output Pins


    The edge connector on the BBC microbit takes the form of copper pads which are
    connected to the processor via electrical traces on the circuit board (see Figure
    10-1). Although they''re flat, it is traditional to refer to these pins as pins
    as they connect to the pins of the processor.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_207_0.png)


    FIGURE 10-1: The BBC microbit edge connector


    There are 25 pins in total, split into five large pins and 20 smaller pins. The
    large pins are labelled with the numbers 0, 1, and 2, for the three general-purpose-input-output
    pins, 3V for the positive voltage pin which provides power to your circuit, and
    GND for the ground, or negative, pin (see Figure 10-2). The smaller pins aren''t
    labelled, but they are referred to using the numbers 3 through 22 to avoid mixing
    them up with the three larger pins.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '![](img/a8e06f84ec80226aea02c25f7c99ab0e_208_0.png)


    > Always remember that the BBC micro:bit is a sensitive electronic device. Never
    connect or disconnect hardware from its pins when the power is on, and always
    check and double-check connections before connecting power. While it''s designed
    to be robust, the BBC micro:bit can be damaged if wired incorrectly.


    # # The Large Pins


    The large pins are clearly labelled on the top of the BBC micro:bit board and
    split into a group of three general-purpose input-output pins to the left and
    the two power pins to the right (see Figure 10-3).


    The three pins labelled 0, 1, and 2 can be used as inputs or outputs depending
    on what hardware you''re connecting to the BBC micro:bit. An LED, for example,
    is an output device and can be made to light up when connected to one of the three
    numbered pins; a button or switch is an input device, and the BBC micro:bit can
    be programmed to respond when it is connected to another of the pins—just like
    the on-board Button A and Button B.


    The large pins are always available for you to use in your programs and do not
    interfere with any of the on-board switches, LEDs, or other hardware. You can
    use them to add additional inputs or outputs, such as adding a small speaker,
    more LEDs, or extra buttons.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_209_0.png)


    FIGURE 1-3: The BBC micro:bit''s large pins


    Each of the numbered large pins is connected to a shared analogue to digital converter
    (ADC), a part of the processor that allows it to read more than the usual on-off
    0-1 binary of a switch. When it is connected to hardware that provides an analogue
    signal, like a light sensor or a microphone, you can read smooth changes in the
    input—great for projects such as room alarms or sound-sensitive lighting. You
    can find out more about using the ADC feature later in this chapter.


    The remaining two large pins are connected to the BBC micro:bit''s power supply.
    The pin marked 3V is also known as the positive pin and can be used to power your
    circuits; the pin marked GND is the ground, negative, pin, and it completes the
    circuit.


    All five of the large pins are designed to be used with wires connected to crocodile
    clips or 4mm banana plugs. When using banana plugs, simply insert them into the
    hole on the relevant pin. If you''re using crocodile clips, you need to be careful
    that you don''t sit the clip over the smaller pins next to each large pin and
    they don''t shift and slide while you''re using the BBC micro:bit. The easiest
    way to do this is to insert the clips so they are sticking vertically out of the
    BBC micro:bit (see Figure 10-4), which stops them from touching other pins while
    making them more secure against being knocked or accidentally disconnected.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '![](img/a8e06f84ec80226aea02c25f7c99ab0e_210_0.png)


    Whatever method you use to wire hardware to the BBC micro:bit, always check your
    connections before powering it on. Be especially careful with the 3V and GND pins;
    connect-ing these together without any hardware between them could result in a
    short circuit which could permanently damage the BBC micro:bit.


    # The Small Pins


    As well as the five large pins, the BBC micro:bit has 20 additional smaller pins
    on its edge connector (see Figure 10-5). These pins are designed for use with
    crocodile clips or banana plugs, but instead provide the option to add hardware
    to the micro:bit using a female edge connector. Add-devices using these smaller
    pins are available from third-party compa-nies and range from break-out boards
    which make it possible to use the additional pins with a breadboard to roost which
    the BBC micro:bit as its ''brain''. More information on some of these add-ons
    can be found in Chapter 11.


    Unlike the large pins, many of the BBC micro:bit''s smaller pins are shared with
    on-board hardware. Pin 3, for example, is also used to control the first column
    of the BBC micro:bit''s LED display; Pin 11, meanwhile, is connected to Button
    B. This doesn''t stop you from using most of these pins in your own circuits,
    but it does mean that you can''t use the correspond-ing on-board device at the
    same time—and in the case of the LEDs, you may find some'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 200 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    light or switch off when you''re not expecting them to! To avoid this, you can
    disable the disply using the [led enable false] block in JavaScript Blocks, led.enable(false)
    instruction in JavaScript, and the display.off () instruction in Python.


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_211_0.png)


    The small pins provide extra general-purpose input-output connections for more
    complex projects, with three of the pins (Pin 3, Pin 4, and Pin 10) connected
    to the same ADC converter as the large pins. Some of these pins share functionality,
    with Pins 3 through 16, 19, and 20 being available for software control as general-purpose
    input-output pins. Additionally, some of the pins provide a means to communicate
    with more hardware through three busses: Serial Peripheral Interface (SPI), Inter-Integrated
    Circuit (IC), and Universal Asynchronous Receiver/Transmitter (UART).


    Finally, the pins at either side of the two power pins—3V and GND—are also power
    pins. By surrounding each large power pin with two smaller power pins, the chances
    of accidentally shortening the power pin to a general-purpose pin and damaging
    the BBC micro:bit are reduced—if you''re using crocodile clips, it''s still possible
    to do so, always check your connections.


    +   TIP Full details on the large and small pins and the functions available on
    each can be found in Appendix D, "Pin-Out Listing".'
