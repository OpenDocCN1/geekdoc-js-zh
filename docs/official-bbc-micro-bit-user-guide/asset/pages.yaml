  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    The Teach page links to internal and third-party resources designed specifically
    with the needs of teachers in mind. Some are linked to other resources designed
    to keep students entertained—such as lesson plans which tie into BBC and Children’s
    BBC like the teen drama Wolfbird or the classic Dr. Who—while others stand alone.


    Many projects listed on the site with full lesson plans, including teachers''
    notes and ready-written and compiled program which can be flashed onto any BBC
    micro-bit. You''ll also find sample projects which link directly to a specific
    curriculum, such as the Key Stage 3 (KS3) Program of Study for Computing using
    the United Kingdom.


    # Third-Party Teaching Resources


    While the Micro:bit Educational Foundation should be your first stop for teaching
    and training-materials, it is far the only place you can find useful information.
    The BBC microbit has been adopted by organisations around the world, and many
    have developed publicly-available resources to support the project.


    When browsing through third-party resources, you are likely to come across some
    which have been written with other versions of the BBC microbit''s editors in
    mind. Developed by partners in the BBC microbit project and from which the current
    editors evolved, these older versions are called Microsoft Blocks, Touch-Develop,
    and CodeJumps JavaScript. While these older editors are still available from the
    Let''s Code section of the Micro:bit Educational Foundation website at the time,
    they are being phased out in favour of the new, more powerful editors detailed
    in this book.


    Programs in Microsoft Blocks and Touch Development can be loaded into the new
    editor and will be automatically converted to the latest version. Be aware, that
    screenshots and documentation with these programs will not match what you see
    in the new editor.


    # The Institution of Engineering and Technology


    The Faraday educational arm of the Institution of Engineering and Technology (IET)
    has released a range of resources for the BBC microbit, including full lesson
    plans everything from a prototype energy-saving LED lighting system to a heart-rate
    monitor (see Figure 13-3). Designed primarily for the 11–14 age range, each lesson
    comes with an overview document, activity sheet, presentation, and student handout—and
    they''re all provided entirely of charge.


    The IET has provided more detailed case studies from industry demonstrating how
    the BBC micro:bit can be used to prototype and simulate real-world electronic
    projects from rockets to Mars to sports timing. These case studies come with a
    full booklet, sample program code, and a supporting video.'
