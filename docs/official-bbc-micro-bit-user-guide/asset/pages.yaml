  md: '# CHAPTER 13 ADDITIONAL RESOURCES


    # 253


    ![](img/a8e06f84ec80226aea02c25f7c99ab0e_262_0.png)


    micro:bit

    The micro:bit is a powerful teaching and learning tool that helps younger children
    to start learning coding and programming, and as a springboard for further learning
    and more advanced products such as Raspberry Pi, it is also a great resource for
    using in lessons across the curriculum including science, math, D&T, art and music.


    What is the micro:bit?

    The micro:bit is a pocket-sized computer that can be used, customized and controlled
    to bring digital ideas, games and apps to life. Starting at just £15, it is designed
    to be fun and easy to use. It can be programmed and carried anywhere, making learning
    accessible at school, at home and on the go - with everything that is needed for
    imagination and creativity! It''s incredible


    FIGURE 13-3: Resources from the IET


    You can find these resources at faraway-secondary.theiet.org/stem-activities/microbit/.


    # Computing At School


    Part of BCS, the Chartered Institute for IT, Computing At School (CAS) has developed
    a range of materials to support the use of the micro:bit in education (see Figure
    13-4). Like the IET''s, the majority are aimed at the 11-14 age range, and are
    made available free of charge to members and nonmembers alike.


    The CAS lessons cover the most common languages for the micro:bit, with a slight
    bias towards Python. Individual lessons and full schemes of work are available,
    and each is licensed under the permissive Creative Commons Attribution-Share Alike
    3.0 licence, making them free for reproduction and reuse. The same site also offers
