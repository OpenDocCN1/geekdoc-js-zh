  md: '# CHAPTER 4 PROGRAMMING LANGUAGES


    Table 4.1 Comparing the BBC micro:bit Languages


    | Feature | JavaScript Blocks | JavaScript | Python |

    |---|---|---|---|n| Browser-Based Editor | Yes | Yes | Yes |

    | Cross-Platform | Yes | Yes | Yes |

    | Free | Yes | Yes | Yes |

    | Learning Materials Available | Yes | Yes | Yes |

    | Visual Environment | Yes | Yes | Yes |

    | Integrated Instruction Reference | Yes | Yes | Partial |

    | Official Micro-bit Simulator | Yes | Yes | No |

    | Functions and Subroutines | Partial | Yes | Yes |

    | Built-In Event Handling | Yes | Yes | No |

    | Integrated Compiler | Yes | Yes | Yes |

    | Interactive Shell | No | No | Yes |


    These features are explained next.


    +   - **Browser-Editor**—Whether a language has an editor you can run in the web
    browser of any computer, without need to install software on the computer.

    - **Cross-Platform**—Whether a language''s editor and compiler can be used on
    any computer, regardless of its operating system.

    - **Free**—Whether it costs any money to use a language, or whether the editor
    or compiler needs to be purchased before it can be used.

    - **Learning Materials Available**—Whether a language has readily learning materials,
    for both personal and for classroom use.

    - **Integrated Instruction Reference**—Whether a language has a list of the most
    common instructions available directly within the editor as a reference guide.
    A ''no'' in this row does not indicate that guides are not available separately.

    - **BBC micro:bit Simulator**—Whether a language has a BBC micro:bit simulator
    built into its editor, allowing you to quickly test your program without having
    to compile, download, and flash it onto your micro:bit.

    - **Functions and Subroutines**—Whether a language has the ability to create functions
    and subroutines, small programs-within-programs that can be called multiple times
    from the main program to reduce the complexity of the program and save time otherwise
    spent writing duplicated code.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# THE OFFICIAL BBC MICRO:BIT USER GUIDE


    +   **Built-In Event Handling**—Whether a language has the ability to monitor
    for events happening outside the main program loop, such as button presses, interrupt
    the flow of the program to run a separate piece of code when such events are triggered.


    +   **Integrated Compiler**—Whether a language has a compiler built into its editor
    or requires you to download the program and compile it in a separate program.


    +   **Interactive Shell**—Whether a language has the ability to run on the BBC
    micro:bit as an interactive shell, interpreting your commands as you type them,
    regardless of whether functionality is exposed in the language’s browser-based
    code editor.


    # Choosing a Programming Language


    A programming language is, for most, a personal choice. If you''re using your
    BBC micro:bit at school or at a coding club, the choice may have already been
    made for you. Lesson plans, sample programs, and other materials based on one
    of the aforementioned languages will have been prepared for you, and to avoid
    confusion, it''s best to use the same language when you''re experimenting at home
    as.


    For younger or less experienced users, JavaScript Blocks is the obvious choice.
    Its highly-visual programming environment with colour-coded instruction blocks,
    jigsaw-drag-and-drop functionality, and always-hand references mean it is as simple
    as possible to get started. It is also a great language for those who wish to
    minimise the amount of typing they have to do and reduce errors like misspelling
    or forgetting to close a loop.


    JavaScript, whilst, is the logical next step for anyone who has been honing their
    skills on JavaScript Blocks. The instructions are identical to JavaScript Blocks,
    just presented in a different format, making it familiar, while the presence of
    the Blocks toolbox in the JavaScript Editor provides a quick reference and acts
    as a shortcut to minimise typing.


    Finally, Python will be the first choice for anyone who has been working with
    the language on other platforms. The core concepts within Python for the BBC micro:bit
    are not different to Python running on a Raspberry Pi or a desktop or laptop computer,
    although the BBC microbit has a number of unique instructions for handling its
    sensors and screen. It is also a great choice if you are looking to link the BBC
    micro:bit up to another computer, allowing you to write both sides of the program
    in a single language, as demonstrated in Chapter 9.


    The important thing to remember, though, is that all the languages are equally
    functional. Given enough time and experience, you can create the same program
    in any of the three languages, something you''ll see demonstrated in the following
    language-specific chapters.'
