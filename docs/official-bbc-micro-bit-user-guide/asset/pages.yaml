  md: '# CHAPTER 9 THE BBC MICRO:BIT AND THE RASPBERRY PI


    There are several models of Raspberry Pi, all of which are compatible with the
    BBC microbit. The smallest and cheapest, the Raspberry Pi Zero and wireless-equipped
    Raspberry Pi Zero require a USB On-The-Go (OTG) adaptor to connect to the BBC
    microbit''s USB port; the larger models, including the compact Raspberry Pi A+,
    Raspberry Pi 2, and powerful Raspberry Pi 3, can connect with no additional hardware
    beyond the micro-USB cable you use with your desktop or laptop.


    To continue with this, set up your Raspberry Pi with the latest Raspian operating
    system and power it on. If you''re using a Raspberry Pi Zero, Raspberry Pi Zero
    W, or Raspberry Pi A+, you need a USB hub so you have space for your keyboard,
    mouse, and the BBC microbit''s USB cable; if you''re using the Raspberry Pi Model
    B+, Raspberry Pi 2, or Raspberry Pi 3, make sure you have one of four USB ports
    free for the BBC microbit.


    # Connecting the Raspberry Pi to the BBC microbit:


    The Raspberry Pi is a fully-functional microcomputer that is capable—given enough
    time and resources—of doing anything its equivalents can. Connecting the BBC microbit
    to the Raspberry Pi, then, is no different from connecting it to a Windows, macOS,
    or Linux PC, as described in Chapter 3, ''Programming the BBC microbit''.


    With the Raspberry Pi switched on and the desktop visible, connect a micro-USB
    cable to one of the Raspberry Pi''s free ports. If you''re using a model with
    only one port, you need to use a USB hub so you have room for the keyboard and
    mouse. Connect the other end to the BBC microbit''s micro-USB port, and after
    a few seconds, a dialog box opening the microbit''s removable drive in the File
    Manager will load (see Figure 9-2). You can click the OK button to open the drive
    and drag an existing hex file to, or you can click Cancel to close the dialog
    without launching the file manager.


    If you want to program the BBC microbit using the Raspberry Pi, you can load the
    Chromium browser from the Raspberry Menu at the upper left of the screen, visit
    microbit.org, and begin programming as described in Chapter 3. Everything works
    exactly as it does on your desktop or laptop, and the programs download only need
    to be dragged and dropped.


    An alternative to the programming tools in your browser is to use Mu, which is
    designed specifically for programming the BBC microbit using the MicroPython language,
    and comes with tools to make that process easier. Mu, however, may not be installed
    by default, depending on the version of Raspian you are using. To install it,
    make sure your Pi is connected to the Internet, open the top menu or from the
    Accessories submenu of the Raspberry Pi icon at the top left of the screen, and
    type the following command:


    ```

    sudo apt-get update && sudo apt-get -y install mu

    ```'
