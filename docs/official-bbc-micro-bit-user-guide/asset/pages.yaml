  md: '# CHAPTER 5 JAVASCRIPT BLOCKS


    Click on Button A in the simulator—or press the physical button if you''re running
    the program on a real BBC micro:bit—and the happy face will appear as before.
    Click Button B, though, and you''ll get a sad face. Your program can read both
    and run different blocks depending on which is pressed.


    There''s a third option for reading buttons, too: reading both at the same time.
    If you click either the (on button A pressed) block or (on button B pressed) block
    and change them, you''ll see the A+B. An [on button A+B pressed] block will run
