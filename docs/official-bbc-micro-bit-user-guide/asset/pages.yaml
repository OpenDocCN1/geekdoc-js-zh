  md: '# 212 THE OFFICIAL BBC MICRO:BIT USER GUIDE


    Double-check your wiring, and then connect the BBC micro:bit to your computer
    with the micro-USB cable. Click the Download button to download your program,
    and then drag the file to the MICROBIT drive to install and run it. After a few
    seconds, the LED should smoothly pulsing from dark to bright and back again.


    Step by step, the program does the following:


    ```

    from microbit import *

    ```


    As follows, this line imports the instructions you need to communicate with the
    BBC micro:bit.


    ```

    while True:

    ```


    This begins the infinite loop, so the program doesn''t finish when it comes to
    the final instruction.


    ```

    pin1.set_analog_period(1)

    ```


    This line tells the micro:bit to set the period of the pulse-width modulation
    signal to one millisecond. The period controls how long cycle of the pulse-width
    modulation cycle lasts: the longer the period, the longer the LED spends in its
    on and off states. Too long, and you see a visible flicker, while a period of
    one millisecond should give the appearance of the LED constantly lit but at different
    brightnesses.


    ```

    for brightnessValue in range(0,1024,1):

    ```


    This instruction begins a different type of loop. Rather than infinite, this for
    has a defined stopping point: when the output of the range ends. The range instruction
    takes three inputs: the number should start at, the number should stop before,
    and the amount should count each time. In this, it''s starting at 0, stopping
    puts values before reaching 1024, and each count adds 1 to the number; in other
    words, it puts values from 0 to 1023 in the variable brightnessValue.


    ```

    pin1.write_analog(brightnessValue)

    ```


    This line uses the write_analog instruction to write a value to Pin 1, but where
    the write_digital instruction only accepts 0 or 1, the write_analog instruction
    accepts any value from 0 to 1023. Rather than writing the value directly, this
    line uses the value stored in the brightnessValue variable.'
