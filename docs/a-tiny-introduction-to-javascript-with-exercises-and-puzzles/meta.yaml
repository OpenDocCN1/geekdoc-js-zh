- md: "## Chapter 8: More Decision Making\n\n    Combining two conditions (using 'and')\n\
    \    Combining two conditions (using 'or')\n    Try it yourself! Predict the Future\n\
    \    The switch statement\n    Try it yourself! The Goblin Dice Gambler\n\n##\
    \ Chapter 9: Repeating Yourself with Loops\n\n    The simplest possible loop\n\
    \    A loop that counts\n    Try it yourself! Predict the Future\n    Try it yourself!\
    \ Put It In Reverse\n    Putting the condition at the end\n    A loop without\
    \ a counter\n    Try it yourself! Million Dollar Pizza\n    Try it yourself! Million\
    \ Dollar Pizza II\n    Optional For, a loop with a built-in counter\n\n## Chapter\
    \ 10: Organizing with Functions\n\n    Adding new functions\n    Calling a function\n\
    \    Try it yourself! Follow the Function Trail\n    Functions that get data\n\
    \    Using multiple parameters\n    Try it yourself! Alien Language Translator\n\
    \n## Chapter 11: Functions that Answer Questions\n\n    Functions that give answers\n\
    \    Try it yourself! Predict the Future\n    Try it yourself! Alien Language\
    \ Translator II\n\n## Chapter 12: Getting More Serious with Math\n\n- Math shortcuts\n\
    - Try it yourself! Predict the Future\n- The wacky mistake JavaScript makes with\
    \ decimals\n- Try it yourself! The Broken Dime Adder\n- Peeking into the Math\
    \ object\n- Try it yourself! How Big Is this Cake?\n- Rounding numbers\n- Try\
    \ it yourself! How Big Is this Cake? (II)\n\n## Chapter 13: The Magic of Random\
    \ Numbers\n\n- Random and pseudo-random\n- Generating random numbers\n- Try it\
    \ yourself! Number Guesser of Doom\n- Try it yourself! Ice, Dagger, Lava\n- What\
    \ Comes Next\n\n# Welcome\n\nThese days, you can't turn around twice without someone\
    \ trying to teach you how to code. The world is full of websites, courses, books,\
    \ and games that promise to introduce you to the magical art of computer programming.\n\
    \nSo why did I write my own book?\n\nWhen my daughters started learning to code,\
    \ I discovered that most tutorials were as dry as dust. If you wanted something\
    \ more fun, you could play a coding game and write commands to move a character\
    \ around a maze (like a princess, a zombie, a turtle, whatever). But unlike real\
    \ programming, there was no chance to be creative. There was no freedom. There\
    \ was no invitation to build *your own* programs.\n\nI wanted something different.\
    \ Something...\n\n- **Hands-on.** If you want to learn a new skill, you need to\
    \ practice. Otherwise, it's just a bunch of theory swimming around in your head.\n\
    - **Friendly for beginners.** If you're a beginner, it's not enough to learn the\
    \ basics of a programming language like JavaScript. You also need to learn the\
    \ concepts of programming at the same time.\n- **No setup required.** The world\
    \ is full of amazing frameworks, tools, and code editors. But who wants to install\
    \ a bunch of software before you even get started?\n- **Tiny.** I'm a programming\
    \ nerd, so I *like* talking about things like Big O notation. But no one needs\
    \ to be buried in theory at the start of their journey. In this book, every chapter\
    \ is a bite-sized lesson that you can usually finish in one sitting.\n- **Kinda\
    \ fun.** Not everyone has the motivation to learn from an old-fashioned textbook.\
    \ But who doesn't want to play dice with a cheating goblin?\n\nSo I decided to\
    \ make something of my own. Then I unleashed it on my family. This is the result\
    \ of those experiments.\n\n# What you need to use this guide\n\nYou need a computer.\
    \ Any type will do. (Please don't try to learn to program on a smartphone.) You\
    \ don't need to install any software, because you're going to write all your examples\
    \ using the free CodePen website.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_11_0.png)\n\
    \nYou do need to know a little bit about HTML. Web pages are written in HTML,\
    \ and JavaScript lives in web pages. Most JavaScript code spends a lot of time\
    \ interacting with a web page—for example, changing text on a page, reacting when\
    \ buttons are clicked, and so on.\n\nTrying to learn both JavaScript and HTML\
    \ at once is a bit of a headache. But if you've never played around with HTML\
    \ before, we have a solution. You can learn just enough to get by from the very\
    \ short tutorial *Messing Up the Web* (available at [http://tiny.cc/webmess](http://tiny.cc/webmess)).\
    \ Complete that before you start this guide.\n\n# Why JavaScript?\n\nJavaScript\
    \ is a great first language for people learning to code. It's not because JavaScript\
    \ is a great teaching language (it mostly isn't). It's because JavaScript is *everywhere*—on\
    \ every operating system, every browser, and almost every electronic device that's\
    \ more complicated than a toaster.\n\nThat means you can effortlessly share your\
    \ JavaScript programs with friends. Unlike all the rest of computing history,\
    \ there's no downloading, installing, or configuring. And it doesn't hurt that\
    \ JavaScript syntax is similar to many other professional languages, like Java\
    \ and C#. That means the effort you spend to learn JavaScript is never wasted."
  mdcn: "\n## 第八章：更多决策技巧\n\n    组合两个条件（使用“且”）\n    组合两个条件（使用“或”）\n    动手试试！预测未来\n\
    \    switch 语句\n    动手试试！地精骰子赌局\n\n## 第九章：用循环重复执行\n\n    最简单的循环\n    一个能计数的循环\n\
    \    动手试试！预测未来\n    动手试试！倒带播放\n    把条件放在循环末尾\n    没有计数器的循环\n    动手试试！百万美元披萨\n\
    \    动手试试！百万美元披萨 II\n    可选的 For 循环：内置计数器的循环\n\n## 第十章：用函数组织代码\n\n    添加新函数\n\
    \    调用一个函数\n    动手试试！追踪函数足迹\n    获取数据的函数\n    使用多个参数\n    动手试试！外星语言翻译器\n\n##\
    \ 第十一章：回答问题的函数\n\n    返回答案的函数\n    动手试试！预测未来\n    动手试试！外星语言翻译器 II\n\n## 第十二章：数学运算进阶\n\
    \n- 数学快捷方式\n- 动手试试！预测未来\n- JavaScript 在处理小数时会犯的荒谬错误\n- 动手试试！坏掉的硬币加法器\n- 探索 Math\
    \ 对象\n- 动手试试！这个蛋糕有多大？\n- 数字的四舍五入\n- 动手试试！这个蛋糕有多大？（II）\n\n## 第十三章：随机数的魔力\n\n- 随机数与伪随机数\n\
    - 生成随机数\n- 动手试试！数字猜猜猜之末日版\n- 动手试试！冰、匕首、岩浆\n- 接下来是什么\n\n# 欢迎\n\n如今，你随便一转身，就会有人试图教你如何编程。这个世界充斥着网站、课程、书籍和游戏，它们都承诺将带你进入计算机编程的神奇艺术殿堂。\n\
    \n那么，为什么我还要写自己的书呢？\n\n当我的女儿们开始学习编程时，我发现大多数教程都枯燥得要命。如果你想要更有趣的东西，可以去玩编程游戏，输入命令来移动迷宫中的角色（比如公主、僵尸、乌龟，随便什么都行）。但与真正的编程不同，那里没有创造的机会，没有自由，也没有邀请你去构建*你自己的*程序。\n\
    \n我想要些不一样的东西。一些……\n\n- **动手实践。** 如果你想学习一项新技能，就需要不断练习。否则，它就只是一堆在你脑子里漂浮的理论。\n- **对初学者友好。**\
    \ 如果你是初学者，只学习像 JavaScript 这样的编程语言基础知识是不够的。你还需要同时学习编程的概念。\n- **无需安装。** 这个世界充满了令人惊叹的框架、工具和代码编辑器。但谁愿意在开始之前就安装一大堆软件呢？\n\
    - **短小精悍。** 我是个编程迷，所以我*喜欢*讨论像大 O 表示法这样的东西。但在你刚开始学习时，没人需要被理论淹没。在这本书中，每一章都是一小段课程，通常你坐下来一次就能学完。\n\
    - **有点意思。** 不是每个人都有动力去啃一本老式的教科书。但谁不想和一个作弊的地精掷骰子玩呢？\n\n所以我决定自己动手做一些东西，然后把它用在我的家人身上。这就是那些实验的结果。\n\
    \n# 使用本指南你需要什么\n\n你需要一台电脑。任何类型都可以。（请不要试图用智能手机学习编程。）你不需要安装任何软件，因为所有示例都将在免费的 CodePen\
    \ 网站上编写。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_11_0.png)\n\n你确实需要对 HTML\
    \ 有一点了解。网页是用 HTML 编写的，而 JavaScript 就存在于网页之中。大多数 JavaScript 代码都花很多时间与网页进行交互——例如，更改页面上的文本，响应按钮点击等等。\n\
    \n同时尝试学习 JavaScript 和 HTML 会有点让人头疼。但如果你以前从未接触过 HTML，我们有一个解决方案。你可以通过一个非常简短的教程 *Messing\
    \ Up the Web*（可从 [http://tiny.cc/webmess](http://tiny.cc/webmess) 获取）来学习足够的 HTML\
    \ 知识。在开始本指南之前，请先完成那个教程。\n\n# 为什么选择 JavaScript？\n\n对于学习编程的人来说，JavaScript 是一门极好的入门语言。这并不是因为\
