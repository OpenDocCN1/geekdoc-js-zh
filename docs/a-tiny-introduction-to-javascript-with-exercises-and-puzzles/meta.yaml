  md: "The switch statement is a more limited version of if. It only works if you\
    \ want to examine just one variable. For example, if you plan to ask the question\
    \ “what day of the week is it today?” and you want to write conditional code for\
    \ each day, the switch statement works great. But if you want to compare different\
    \ combinations of variables, as in the previous example, switch isn’t much help.\n\
    \n> NOTE There’s nothing that switch can do that if can’t do. So why bother to\
    \ use switch? It’s really a matter of your own taste, but if switch works for\
    \ you, you’ll usually get shorter, tidier code than you would with if.\n\nTo use\
    \ switch, you start by presenting the variable you want to examine, like this:\n\
    \n```\nswitch (dayOfTheWeek) {\n```\n\nNow you write conditional code for the\
    \ different values. Each one of these is a separate case, and you identify them\
    \ with the case keyword.\n\n```\ncase \"Saturday\":\n```\n\nIn the dayOfTheWeek\
    \ example, you’re expecting one of seven different day names. Each value is in\
    \ quotation marks because it’s a string. If you use switch with a variable that\
    \ holds a number, you wouldn’t use quotation marks.\n\nAfter you write case and\
    \ put the value you’re looking for (like “Saturday” or 478), you add a colon :\
    \ to start your conditional code.\n\n```\ncase \"Saturday\":\n  alert(\"It's Saturday.\
    \ Time to write some JavaScript!\");\n```"
