  md: 'Chapter 1


    # What JavaScript Looks Like


    You''re about to spend a lot of time looking at code. To help you find your way
    around, you need to get more familiar with the way JavaScript code is written.


    These arcane rules are known to JavaScript wizards as *syntax*. Once you know
    some of the rules of JavaScript syntax, code will start looking a lot more like
    magic instructions and a lot less like complete gibberish.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_0.png)


    # Statements


    When you look at a chunk of JavaScript code, you''ll see a sequence of *statements*—basically,
    commands that tell your web browser to do something. Here''s one now:


    ```

    alert("Hi there!");

    ```


    The alert() command is simple. It shows a small pop-up window with whatever message
    you want. (You put the message—like *Hi there!*—in quotation marks.) An alert
    box isn''t the most polite way to get attention, but it works.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_1.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: "If you're completely new to JavaScript, you won't understand exactly how this\
    \ command works, and that's OK. But you should notice that this command has a\
    \ semicolon ( ; ) at the end. Although semicolons aren't absolutely required in\
    \ JavaScript, serious programmers always use them. They show where each code statement\
    \ stops.\n\nIf you run out of room to comfortably fit a statement on one line,\
    \ you can split it pretty much wherever you want, as long as you remember to end\
    \ with the semicolon. Here's an example that shows the same message as before,\
    \ but now puts the statement on two lines:\n\n```\nalert(\n\"Hi there!\");\n```\n\
    \nYou can also add spaces to arrange your code:\n\n```\nalert(\n    \"Hi there!\"\
    );\n```\n\nIt's still the same command. JavaScript ignores extra spaces, just\
    \ like it ignores line breaks.\n\nOf course, you can't do much with just one statement.\
    \ Even a small program has a series of statements, one after the other. When a\
    \ piece of JavaScript code is running, the browser goes through the statements\
    \ one by one, triggering each command in order."
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Comments


    Statements that start with two forward slashes // are comments. JavaScript ignores
    all comments.


    ```

    // I don''t do anything at all!

    ```


    You can add comments wherever you want. Often, you use a comment to explain what''s
    about to happen in the next code statement:


    ```

    // Show a message.

    alert("Hi there!");

    ```


    You can also use comments to point out an important section of code. Many of the
    tutorials in this guide have comments that tell you where to pay attention or
    what you need to change:


    ```

    // This is where things go wrong.

    ```


    You can also put the comment slashes in front of a code statement to temporarily
    turn it off. For example, this alert() command won''t do anything because it''s
    been changed into a comment:


    ```

    //alert("Hi there!");

    ```


    This trick is called *commenting out* code. You might use it instead of deleting
    a line of code if you think you''ll need the code later.


    > **TIP** In CodePen (and most other code editors), comments are shown in a different
    color than statements. That makes it easier to spot the code.'
  merge: -1
  pgno: 26
- img_proc: true
  md: "# # Blocks and functions\n\nJavaScript uses curly brackets, called *braces*,\
    \ to group together sections of code that have one or more statements. Each section\
    \ starts with an opening brace:\n\n```\n{\n```\n\nAnd ends with a closing brace:\n\
    \n```\n}\n```\n\n(If you're hunting for these symbols on the keyboard, you can\
    \ usually get them by holding down **Shift** and typing the square **[ ]** brackets,\
    \ which are just to the right of the **P** key.)\n\nAs you learn JavaScript, you'll\
    \ see these braces used in different places. The first place you'll see them is\
    \ in *functions*. You can think of a function as a small section of code that\
    \ does one task. You can recognize a function because it starts with the word\
    \ `function`. Here's a simple example:\n\n```\nfunction showMessage() {\n    alert(\"\
    Hi there!\");\n}\n```\n\nEvery function has a name, which appears after the word\
    \ `function` and before the parentheses (). The person who creates the function\
    \ chooses the name. This function is named `showMessage`, and it contains just\
    \ one statement."
  merge: -1
  pgno: 27
- img_proc: true
  md: "Here's a slightly longer version of the showMessage() function. It holds two\
    \ comments and two statements:\n\n```\nfunction showMessage() {\n  // Show the\
    \ first message.\n  alert(\"Hi there!\");\n\n  // After you click OK, you get\
    \ to see this bonus message.\n  alert(\"It's me again!\");\n}\n```\n\nHere's exactly\
    \ what happens when the code in this function runs:\n\n+   1. JavaScript skips\
    \ over the first comment (`// Show the first ...`)\n2. The alert() function shows\
    \ the first message in an alert box.\n3. Now the code stops. It's waiting for\
    \ someone to close the alert box.\n4. When you click **OK**, JavaScript carries\
    \ on.\n5. JavaScript skips over the second comment (`// After you click ...`)\n\
    6. The alert() function shows the second message.\n7. When you click **OK**, JavaScript\
    \ carries on and the function ends. That's all for now.\n\nThere are a few other\
    \ details you might notice here. For example, every line in this function is indented\
    \ with two empty spaces. These spaces are totally optional, but it's one of the\
    \ many ways that people make code easier to read and understand. And making code\
    \ easier to understand becomes a Very Big Deal as your programs get more complex.\n\
    \n> **NOTE** For now, every code statement you write belongs inside a function.\
    \ Don't put code above a function block, after a function block, or between two\
    \ function blocks. (You can put comments there, though.)"
  merge: -1
  pgno: 28
