    ```


    Now we can simplify it a little:


    ```

    randomNumber = Math.floor(Math.random() * 6) + 1;

    ```


    This calculation uses two new Math functions: Math.random() and Math.floor().


    Math.floor() is a specialized rounding function that always rounds down, cutting
    off the decimal portion of a number. For example, if you use Math.floor() on the
    number 4.839424982, it becomes 4. (JavaScript also has a matching Math.ceil()
    function that always rounds up.)


    You don’t need to understand how this statement works its magic in order to use
    it. But if you want to know what’s going on, let’s take a second look at the final
    formula:


    ```

    randomNumber = Math.floor(Math.random() * 6) + 1;

    ```


    Here’s a step by step breakdown of what JavaScript does when it runs this statement:


    +   1. Math.random() gets a random value that’s more than 0 and less than 1.

    2. You multiply that by 6, turning it into a random number that’s more than 0
    and less than 6. However, the decimal part is still there, so you’ll have a number
    like 4.839424982.

    3. Math.floor() chops off the decimals and leaves you with a whole number. That
    number could be 0, 1, 2, 3, 4, or 5.

    4. You add 1 to shift your range of numbers up one place. Now you’ve got a whole
    number from 1 to 6, which is exactly what you want!'
