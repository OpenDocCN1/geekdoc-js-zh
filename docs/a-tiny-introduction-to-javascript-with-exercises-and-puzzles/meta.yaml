  md: 'Chapter 13


    # The Magic of Random Numbers


    If you''ve ever rolled a pair of dice, flipped a coin, a picked a piece of paper
    out of a hat (with your eyes closed!) you understand the idea of randomness. When
    you play these simple games, the result is up to chance. You can''t predict what
    will happen.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_142_0.png)


    In programming, you get the same effect using random numbers. Random numbers let
    you simulate games of chance, like rolling dice and drawing cards. You can also
    use them to control other types of games—say, to decide who wins a battle between
    a dragon and an ogre, to generate a random map (for example, in Minecraft), or
    to cook up a random insult out of a list of adjectives.


    In this lesson, you''ll use random numbers to make two basic games.


    # Random and pseudo-random


    Being random isn''t easy for a computer. (It''s about as difficult as getting
    a robot to laugh.) When you ask a computer to give you a random number, it actually
    follows some kind of not-so-random formula to create a "fake" random number (technically
    called a *pseudo-random* number). For example, it might look at the computer clock,
    take the millisecond at that exact moment, and feed it into some sort of mathematical
    formula.


    One benefit of this approach is that your computer can pick fake random numbers
    pretty quickly. And in your program, the numbers still *seem* completely random,
    because you never know what number your computer will pick. But if'
  merge: -1
