    \ This allows you to send the text you want to translate to the function. If you\
    \ do this correctly, `convertEnglishToAlien()` will show the super-weird translation\
    \ in an alert box. Try it out!\n\nIn the next chapter, you'll get to use an even\
    \ better alien translation function.\n\n## Chapter 11\n\n# Functions that Answer\
    \ Questions\n\nIn the last chapter, you saw how functions are like building blocks.\
    \ You (or someone else) writes them. Then you call your functions into action\
    \ whenever you need them.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_126_0.png)\n\
    \nNow it's time to build smarter functions that can give you information. With\
    \ their help, you can organize your code and even reuse the best stuff in different\
    \ programs.\n\n## Functions that give answers\n\nOne common job for a function\
    \ is to give you a piece of information. For example, you might call a function\
    \ that performs a special calculation and gives you the answer. The information\
    \ that the function sends back to you is called a *return value*.\n\nEvery function\
    \ can have one return value. You use the `return` command to provide the return\
    \ value. For example, if you want your function to send the number 10 back, you\
    \ could add this statement to your function:\n\n```\nreturn 10;\n```\n\nBut there's\
    \ a catch. As soon as you use `return`, the function ends. JavaScript doesn't\
    \ run the rest of the function's code (if there is any).\n\nHere's a more realistic\
    \ example. The `addTwoNumbers()` function takes two numbers (through parameters)\
    \ adds them, and then returns the result.\n\n```\nfunction addTwoNumbers(firstNumber,\
    \ secondNumber) {\n    let sum = firstNumber + secondNumber;\n    return sum;\n\
    }\n```\n\nClearly, you don't actually *need* a function to do this job, but the\
    \ concept is the same if you make a more sophisticated function. For example,\
    \ here's a version of `addTwoNumbers()` that adds a little frill. If you give\
    \ it numbers in strings (like \"3\" and \"5\") it still works, because it translates\
    \ the text to real numbers:\n\n```\nfunction addTwoNumbers(firstNumber, secondNumber)\
    \ {\n    let sum = Number(firstNumber) + Number(secondNumber);\n    return sum;\n\
    }\n```\n\nIn the next chapter you'll use the `Math` object, which has lots of\
    \ functions that give you answers. For example, `Math.sqrt()` function to get\
    \ the square root of a number.\n\nSo how do you use a function that has a return\
    \ value? You could just call it normally:\n\n```\naddTwoNumbers(42, 6);\n```\n\
    \nBut if you do this, you'll never see the return value. For some functions, that\
    \ might make sense, but for `addTwoNumbers()` it defeats the purpose. If you want\
    \ to store the return value in a variable, you need to assign it using the equal\
    \ sign. Here's an example:\n\n```\nlet sum;\nsum = addTwoNumbers(42, 6);\n// Now\
    \ sum holds the value 48.\n```\n\nWhen JavaScript runs this statement, it calls\
    \ `addTwoNumbers()`, sends the two parameters (42 and 6), gets the result, and\
    \ finally copies that sum into the `sum` variable.\n\n# # Try it yourself!\n\n\
    ▶ Predict the Future (Challenge Level: Easy)\n\nhttps://codepen.io/prosetech/pen/mdEaIJq\n\
    \nYou can use a return value anywhere you would ordinarily put a variable. For\
    \ example, you could use it in a calculation:\n\n```\nresult = addTwoNumbers(42,\
    \ 6) + 10;\n```\n\nWhat will result be after this statement? If you're uncertain,\
    \ check your answer with the sample page.\n\nYou can also use a return value in\
    \ a condition:\n\n```\nif (addTwoNumbers(4, 6) > 10) {\n}\n```\n\nWill this be\
    \ true?\n\nYou can even use a result value as a parameter to another function\
    \ call:\n\n```\nalert(addTwoNumbers(450, 1));\n```\n\nWhat do you expect to see\
    \ when you run this code?\n\n# # Try it yourself!\n\n▶ **Alien Language Translator\
    \ II (Challenge Level: Hard)**\n\n[https://codepen.io/prosetech/pen/MWedawx](https://codepen.io/prosetech/pen/MWedawx)\n\
    \nIn the first version of the Alien Language Translator exercise, you learned\
    \ to call the `convertEnglishToAlien()` function and send it two parameters. But\
    \ there's a tiny flaw.\n\nRight now, the `convertEnglishToAlien()` function takes\
    \ your message, performs its alien-language conversion, and shows the result in\
    \ an alert box. But what if you want to do something else with your alien message?\
    \ Maybe you want to show it on the page, or pass it to another function.\n\nA\
    \ perfect version of `convertEnglishToAlien()` would let you decide. It would\
    \ stick to its one job: translating English to alien. You'd send it some information\
    \ (through parameters), it would send you back the result (through the return\
    \ value), and *then* your code would decide what to do with the message.\n\nThis\
    \ is your new job—change the `convertEnglishToAlien()` to use a return value.\
    \ Here's what you need to do:\n\n-   1. Remove the code that shows `scrambledMessage`\
    \ in an alert box.\n-   2. Add a statement at the end of `convertEnglishToAlien()`\
    \ that returns `scrambledMessage` using the `return` keyword.\n-   3. Now change\
    \ the code that calls `convertEnglishToAlien()` so that it takes the return value\
    \ and assigns it to a new variable (call it something like `translation`).\n-\
    \   4. Finally, add some new code to show the translation on the page. Remember,\
    \ this code doesn't go in the `convertEnglishToAlien()` function. Instead, you\
    \ use it right *after* you call `convertEnglishToAlien()`, when you get the return\
    \ value. (In the sample code, you'll see the logic is already partly there, and\
    \ it's marked with a comment.)\n\nOnce you've solved this problem, there's another\
    \ improvement you can make to the Alien Language Translator.\n\nSo far, you've\
    \ been changing the code for the **Translate To Alien** button. But this exercise\
    \ also has a **Translate To English** button and a matching function called `convertAlienToEnglish()`.\
    \ Right now, the **Translate To English** button does nothing. You need to write\
    \ the code that gets the text from the alien text box, passes it to `convertAlienToEnglish()`,\
    \ and then shows the result in the English text box. You'll need to write this\
    \ code yourself, but it's very similar to the code for the **Translate To Alien**\
    \ button.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_130_0.png)\n\nAs a bonus,\
    \ if you finish the job successfully, you'll be able to decode the alien's mysterious\
    \ first words.\n\n## Chapter 12\n\n# Getting More Serious with Math\n\nYou already\
    \ know how to do basic calculations with numbers, like addition and subtraction.\
    \ But as your programs get more ambitious, you'll need more math skills.\n\nFor\
    \ example, if your code works with decimal values, you need to know how to round\
    \ them to the right size before you show them in a page. Or maybe you want to\
    \ perform calculations with exponents and square roots, use trigonometric identities\
    \ (like sine, cosine, and tangent), or use the mathematical constant pi (π). JavaScript\
    \ has built-in features for all of this mathematical wizardry.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_132_0.png)\n\
    \n## Math shortcuts\n\nOne of the most common mathematical operations in a program\
    \ is changing a variable. Here's an example:\n\n```\ncounter = counter + 1;\n\
    ```\n\nAs you can probably tell, this statement takes the counter variable, adds\
    \ 1, and assigns that as the new counter variable.\n\nThis sort of operation is\
    \ so popular that JavaScript gives you a shortcut with the += operator:\n\n```\n\
    counter += 1;\n```\n\nDid you catch that? The += operator tells JavaScript to\
    \ take the variable on the right side of your statement (in this example, that's\
    \ 1), and add it to whatever variable is on the left.\n\nThis trick also works\
    \ if you want to paste a bit of text onto the end of a string:\n\n```\nlet message\
    \ = \"Let's eat\";\nmessage += \"  some pancakes\";\n\n// Now message holds the\
    \ text \"Let's eat some pancakes.\"\n```\n\nJavaScript has similar shortcuts for\
    \ subtraction, multiplication, and division.\nThey all work the same, but the\
    \ + part of the += operator is replaced with the type\nof mathematical operation\
    \ you want to do:\n\n```\nlet counter = 12;\n\ncounter -= 2;\n// (Now counter\
    \ = 12 - 2, which is 10.)\n\ncounter /= 5;\n// (Now counter = 10 / 5, which is\
    \ 2.)\n\ncounter *= 3;\n// (Now counter is 6. You know why.)\n```\n\nThere's really\
    \ nothing special about using a shortcut like += instead of writing\nout a full\
    \ statement with = and +. But it does let lazy programmers save a few\nkeystrokes.\
    \ You don't *need* to use it, but you'll see it in other people's programs."
  mdcn: "\n`convertEnglishToAlien()` 函数使用一个名为 `message` 的参数。这样你就可以将要翻译的文本发送给该函数。如果你操作正确，`convertEnglishToAlien()`\
    \ 会将超级怪异的翻译结果显示在提示框中。试试看吧！\n\n在下一章中，你将使用一个更好的外星语翻译函数。\n\n## 第11章\n\n# 回答问题的函数\n\
    \n在上一章中，你了解了函数就像建筑积木。你（或其他人）编写它们。然后当你需要时，就可以调用你的函数。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_126_0.png)\n\
    \n现在是时候构建更智能的函数，让它们能为你提供信息了。借助它们，你可以组织代码，甚至在不同的程序中重用最好的部分。\n\n## 提供答案的函数\n\n函数的一项常见工作是为你提供一条信息。例如，你可能会调用一个执行特殊计算并给你答案的函数。函数发送回给你的信息称为\
    \ *返回值*。\n\n每个函数可以有一个返回值。你使用 `return` 命令来提供返回值。例如，如果你想让你的函数发送数字10回来，你可以在你的函数中添加这条语句：\n\
    \n```\nreturn 10;\n```\n\n但有一个问题。一旦你使用 `return`，函数就结束了。JavaScript 不会运行函数其余的代码（如果有的话）。\n\
    \n这里有一个更实际的例子。`addTwoNumbers()` 函数接受两个数字（通过参数），将它们相加，然后返回结果。\n\n```\nfunction\
    \ addTwoNumbers(firstNumber, secondNumber) {\n    let sum = firstNumber + secondNumber;\n\
    \    return sum;\n}\n```\n\n显然，你实际上并*需要*一个函数来完成这项工作，但如果你制作一个更复杂的函数，概念是相同的。例如，这是\
    \ `addTwoNumbers()` 的一个添加了点花样的版本。如果你给它字符串形式的数字（比如 \"3\" 和 \"5\"），它仍然有效，因为它会将文本转换为真正的数字：\n\
    \n```\nfunction addTwoNumbers(firstNumber, secondNumber) {\n    let sum = Number(firstNumber)\
    \ + Number(secondNumber);\n    return sum;\n}\n```\n\n在下一章中，你将使用 `Math` 对象，它有许多能给你答案的函数。例如，`Math.sqrt()`\
    \ 函数可以获取一个数字的平方根。\n\n那么，如何使用一个有返回值的函数呢？你可以像平常一样调用它：\n\n```\naddTwoNumbers(42,\
    \ 6);\n```\n\n但如果你这样做，你将永远看不到返回值。对于某些函数，这可能有意义，但对于 `addTwoNumbers()` 来说，这违背了其目的。如果你想将返回值存储在一个变量中，你需要使用等号进行赋值。这是一个例子：\n\
    \n```\nlet sum;\nsum = addTwoNumbers(42, 6);\n// 现在 sum 的值是 48。\n```\n\n当 JavaScript\
    \ 运行这条语句时，它会调用 `addTwoNumbers()`，发送两个参数（42 和 6），获取结果，最后将和复制到 `sum` 变量中。\n\n# #\
    \ 自己试试！\n\n▶ 预测未来（挑战等级：简单）\n\nhttps://codepen.io/prosetech/pen/mdEaIJq\n\n你可以在通常放置变量的任何地方使用返回值。例如，你可以在计算中使用它：\n\
    \n```\nresult = addTwoNumbers(42, 6) + 10;\n```\n\n执行这条语句后，`result` 的值会是多少？如果你不确定，请在示例页面上检查你的答案。\n\
    \n你也可以在条件中使用返回值：\n\n```\nif (addTwoNumbers(4, 6) > 10) {\n}\n```\n\n这个条件会成立吗？\n\
    \n你甚至可以将返回值作为另一个函数调用的参数：\n\n```\nalert(addTwoNumbers(450, 1));\n```\n\n运行这段代码时，你期望看到什么？\n\
    \n# # 自己试试！\n\n▶ **外星语翻译器 II（挑战等级：困难）**\n\n[https://codepen.io/prosetech/pen/MWedawx](https://codepen.io/prosetech/pen/MWedawx)\n\
    \n在外星语翻译器的第一个版本中，你学会了调用 `convertEnglishToAlien()` 函数并发送两个参数。但有一个小缺陷。\n\n目前，`convertEnglishToAlien()`\
    \ 函数接收你的消息，执行其外星语转换，并在提示框中显示结果。但如果你的外星消息想用于其他用途呢？也许你想在页面上显示它，或者传递给另一个函数。\n\n一个完美的\
    \ `convertEnglishToAlien()` 版本会让你来决定。它会专注于自己的任务：将英语翻译成外星语。你会向它发送一些信息（通过参数），它会将结果发送回来（通过返回值），*然后*你的代码会决定如何处理这条消息。\n\
    \n这是你的新任务——修改 `convertEnglishToAlien()` 以使用返回值。你需要做以下事情：\n\n-   1. 删除在提示框中显示 `scrambledMessage`\
    \ 的代码。\n-   2. 在 `convertEnglishToAlien()` 的末尾添加一条使用 `return` 关键字返回 `scrambledMessage`\
    \ 的语句。\n-   3. 现在修改调用 `convertEnglishToAlien()` 的代码，使其获取返回值并赋值给一个新变量（可以命名为 `translation`\
    \ 之类的）。\n-   4. 最后，添加一些新代码在页面上显示翻译结果。记住，这段代码不在 `convertEnglishToAlien()` 函数内部。而是在调用\
    \ `convertEnglishToAlien()` 之后，当你获得返回值时使用它。（在示例代码中，你会看到逻辑已经部分存在，并用注释标记出来了。）\n\n\
    一旦你解决了这个问题，你还可以对外星语翻译器进行另一个改进。\n\n到目前为止，你一直在修改 **Translate To Alien** 按钮的代码。但这个练习还有一个\
    \ **Translate To English** 按钮和一个匹配的函数叫做 `convertAlienToEnglish()`。目前，**Translate\
    \ To English** 按钮什么都不做。你需要编写代码，从外星语文本框中获取文本，将其传递给 `convertAlienToEnglish()`，然后在英语文本框中显示结果。你需要自己编写这段代码，但它与\
    \ **Translate To Alien** 按钮的代码非常相似。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_130_0.png)\n\
    \n作为奖励，如果你成功完成任务，你将能够解码外星人神秘的第一句话。\n\n## 第12章\n\n# 认真对待数学\n\n你已经知道如何用数字进行基本计算，比如加法和减法。但随着你的程序变得更加雄心勃勃，你将需要更多的数学技能。\n\
    \n例如，如果你的代码处理十进制值，你需要知道如何在将它们显示在页面之前将其四舍五入到合适的大小。或者你想使用指数和平方根进行计算，使用三角函数（如正弦、余弦和正切），或者使用数学常数圆周率\
    \ (π)。JavaScript 内置了所有这些数学魔法的功能。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_132_0.png)\n\
    \n## 数学捷径\n\n程序中最常见的数学操作之一是改变一个变量。这是一个例子：\n\n```\ncounter = counter + 1;\n```\n\
    \n正如你可能看到的，这条语句获取 `counter` 变量，加上 1，并将结果赋值给新的 `counter` 变量。\n\n这种操作非常流行，所以 JavaScript\
    \ 使用 `+=` 运算符为你提供了一个捷径：\n\n```\ncounter += 1;\n```\n\n你注意到了吗？`+=` 运算符告诉 JavaScript\
    \ 获取语句右侧的变量（在这个例子中是 1），并将其加到左侧的任何变量上。\n\n如果你想在字符串末尾附加一些文本，这个技巧也适用：\n\n```\nlet\
    \ message = \"Let's eat\";\nmessage += \"  some pancakes\";\n\n// 现在 message 的值是\
    \ \"Let's eat some pancakes.\"\n```\n\nJavaScript 对于减法、乘法和除法有类似的捷径。\n它们的工作方式相同，只是\
    \ `+=` 运算符中的 `+` 部分被替换为你想要进行的数学运算类型：\n\n```\nlet counter = 12;\n\ncounter -= 2;\n\
    // （现在 counter = 12 - 2，即 10。）\n\ncounter /= 5;\n// （现在 counter = 10 / 5，即 2。）\n\
    \ncounter *= 3;\n// （现在 counter = 6。你知道为什么。）\n```\n\n使用像 `+=` 这样的捷径与使用 `=` 和 `+`\
    \ 编写完整语句相比，实际上没有什么特别之处。但它确实让懒惰的程序员节省了几次按键。你*不*需要使用它，但你会在其他人的程序中看到它。\n"
