    A new alien race has arrived on planet Earth. They appear to be friendly, but
    understanding each other is difficult. You think you can make yourself understood,
    but you’re going to need a JavaScript function to help you communicate.


    # PLEASE SPEAK TO ME IN MY LANGUAGE


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_124_0.png)


    Message to translate: [This is a test message.]


    [Translate the Message]


    Your first job is to translate an ordinary string of text into alien language.
    You type your message into the text box. Then, when you click the button, it’s
    time to translate it.


    Right now, clicking the button calls the speakToAlien() function, which doesn’t
    do anything (because there’s no code in it). Your job is to get the text out of
    the text box, and then translate it.


    Getting the text is easy, if you remember how. First, check the HTML to find out
    what id the text box uses (in this example, it’s message). Then, create a variable
    and use the trusty document.getElementById() function, like this:


    ```

    let messageToTranslate;

    messageToTranslate = document.getElementById("message").value;

    ```


    Once you have the text, you need to convert it to alien language. But you don’t
    need to translate it on your own. Instead, there’s *another*, already written
    function in this page called convertEnglishToAlien() that can do the job.'
