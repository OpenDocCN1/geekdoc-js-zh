    \ 框的顶部），位于所有函数之上。\n\n这个例子中的代码（使用全局 `welcomeMessage` 变量）仍然与早期版本（使用局部 `welcomeMessage`\
    \ 变量）的工作方式相同。但在稍复杂的例子中，情况会迅速改变，就像你接下来将看到的示例。\n\n## 不同函数共享同一个变量\n\n以下是全局变量和局部变量之间两个区别的快速回顾：\n\
    \n-   局部变量存活到函数结束。全局变量存活到程序结束——比如说，当你关闭浏览器（或在 CodePen 中编辑代码时）。\n-   局部变量只能在一个函数中使用。但你可以在\
    \ *每个* 函数中使用全局变量。\n\n第二个概念叫做 *作用域*，这就是我们接下来要探索的。\n\n到目前为止，你已经看过很多只有一个按钮和一个函数的例子。但大多数\
