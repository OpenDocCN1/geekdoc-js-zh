    ## The wacky mistake JavaScript makes with decimals


    It’s time for some bad news. Computers have a weird way of dealing with decimal
    values.


    You already learned that JavaScript numbers are very flexible. You can use a number
    variable to store an integer (like -342) or something bigger (like 8093411059)
    or more precise (like 0.00000345908). This is called a *floating point* number,
    because the decimal “floats” around to make numbers as big or small as you need.


    Computers have quick and efficient ways to store floating point numbers and perform
    calculations with them. However, there’s a catch. Certain decimal values aren’t
    stored with perfect precision. As a result, you can get bizarre rounding errors
    in your calculations. The rounding errors are very tiny, but they can still make
    a mess.


    To see the problem, try the Dime Adder example at https://codepen.io/prosetech/pen/JjGVBVa.
    Each time you click, it adds $0.10 to a running total that’s shown in the page.
    This works for the first couple of clicks, but when you expect to get to $0.30,
    you’ll instead get the number 0.30000000000000004. Add some more dimes, and things
    go back to normal—until you’ll reach 0.7999999999999999 when you should have $0.80
    cents. Clearly something is wrong.


    **Your change purse holds: $0.30000000000000004**


    [Add a Dime]


    The problem is that some decimal values can’t be translated exactly into floating
    point numbers. (It’s similar to the problem you face if you try to write 1/3 as
    a decimal value. You can write 0.33333 with as many 3s as fit on your sheet of
    paper, but it’s still not a perfect representation of a third.)


    This problem isn’t just with JavaScript. It happens with floating point numbers
    in every programming language. The difference is that some languages have decimal
    data types that are designed to avoid this problem. JavaScript doesn’t, so it’s
    up to you to correct the mistake.


    How do you fix it? If you’re writing a program that uses scientific calculations
    with lots of decimal places, there’s no need to change anything. But if you’re
    writing a program that uses exact amounts of money, it’s confusing to see tiny
    fractions of a penny.


    There are two solutions. You could use rounding, which you’ll learn how to do
    in a moment. That way you can snip off any extra decimal bit that doesn’t make
    sense. But an easier approach is to avoid having decimal values at all. So instead
    of keeping track of an amount of dollars (like $4.30), count the total number
    of cents (like 430).


    ## Try it yourself!


    ▶ The Broken Dime Adder (Challenge Level: Medium)


    https://codepen.io/prosetech/pen/JjGVBVa


    It’s confusing when you see tiny rounding errors in money amounts. Try this program,
    and confirm that the problem exists once you add a few pennies. Then, fix the
    issue by replacing the `dollars` variable with a `cents` variable that counts
    the total number of pennies (and doesn’t need decimals). Remember to change your
    number of cents back to a number of dollars before you show it in the page.


    ## Peeking into the Math object


    If you own an ordinary scientific calculator, you know it doesn’t just add, subtract,
    multiply, and divide. There are plenty more features crammed into special buttons.
    JavaScript is like that, too. The basic math functions are built into the JavaScript
    language with the operators you''ve already learned about (+-*/^). But when you
    need more calculating power, you turn to a special feature called the Math object.


    The Math object bundles together a bunch of functions that do specialized math
    calculations. You can take a peek at all them when you''re writing code. Type
    Math, followed by the period (.), and you''ll see a list of everything the Math
    object offers.


    All of these functions take one or more parameters, and give you the result as
    a return value.


    For example, if you want to calculate the square root of a number, you can use
    the Math.sqrt() function. (Here, Math is the object and sqrt() is one of its functions.)


    ```

    let number = 9;

    number = Math.sqrt(number);


    // Now number holds 3 (because that''s the square root of 9).

    ```


    The Math object isn''t just about square roots. If you want to calculate the tangent
    of an angle (important in high school trigonometry, and in games where projectiles
    fly through the air), you can use Math.tan(). And so on.


    ## Try it yourself!


    ▶ How Big Is this Cake? (Challenge Level: Medium)


    https://codepen.io/prosetech/pen/QWyRYjQ


    Few problems are as important as the one you’ll tackle in this challenge—measuring
    exactly how big a cake you’re about to eat.


    If you remember a bit of geometry, you might know how to calculate the area of
    a shape. For a simple rectangle, you need to multiply its length and width. For
    a circle, you perform a similar but more complex calculation that looks like this:


    ```

    π (d/2)²

    ```


    In this equation, *d* is the diameter of the circle and *pi* (π) is the magic
    mathematical constant that starts with 3.14 and continues on forever. But you
    don’t need to remember the digits of *pi* yourself, because the `Math` object
    has a built-in variable that stores it for you.


    Take a moment to see if you can find *pi* in the `Math` object. Then use it to
    calculate the area of your cake. You need to write a statement that divides the
    diameter by 2, squares the result, and then multiplies that by *pi*. You can do
    it all in one line of code, or you can break it down into a separate steps if
    you think that’s easier. Remember that you need to use the `**` operator for exponents
    (`4**2` means 4²).


    **NOTE** `Math.PI` acts like a variable. That means you don’t need to use parentheses
    like you do when you use one of the built-in `Math` functions.


    ## Rounding numbers


    If someone asks you how big your cake is, it’s reasonable to say 8 inches. It’s
    less helpful if you tell them 8.045840982 inches. But JavaScript is like that.


    In your code, it doesn’t matter if numbers have a long decimal portion, like 8.045840982.
    You can keep using it in calculations like any other value in a variable. But
    if you want to *show* your number somewhere, like in an alter box or on the web
    page, you’ll probably want to trim it down to a tidier size.


    The `Math` object has a `round()` function that can do the job. Here it is chopping
    all the decimals off a number:


    ```

    let longNumber = 4.349;

    let roundedNumber = Math.round(longNumber);


    // Now roundedNumber is 4

    ```


    The `round()` function always rounds to the nearest whole number. So 4.349 becomes
    4 and 4.931 becomes 5. But what if you want to round to a different digit?


    For example, let’s say you want to keep exactly two decimal digits, so 4.349 becomes
    4.35. You might expect that the `round()` function could do this for you, but
    it’s not that helpful. You need to work for it.


    In this situation, you need to juggle your number around with a bit of multiplication
    and division. Here’s a demonstration:


    ```

    let longNumber = 4.349;


    // Move the decimal to the right two places.

    longNumber = longNumber * 100          // longNumber=434.9


    // Round the number.

    let roundedNumber = Math.round(longNumber);   // roundedNumber=435


    // Move the decimal back where it was before.

    roundedNumber = roundedNumber / 100       // roundedNumber=4.35

    ```


    This example moves the decimal to the right place, rounds the number, and then
    moves the decimal back where it was before. Once you get used to this pattern,
    you can combine it all it a single statement:


    ```

    let longNumber = 4.349;

    let roundedNumber = Math.round(longNumber*100) / 100;

    ```'
