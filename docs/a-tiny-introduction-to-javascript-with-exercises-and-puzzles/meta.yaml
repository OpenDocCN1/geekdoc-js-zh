    \ In other words, after a number of years the mob boss comes to collect. If you\
    \ don’t have enough money by this point, you lose.\n\nHere’s how to build this\
    \ solution:\n\n- 1. You need a new condition that ends the loop when a certain\
    \ number of years has passed (say, 30).\n- 2. Join the new condition to your first\
    \ condition with the && symbol (meaning and, as described in Chapter 8). That\
    \ way your loop keeps going as long as you need more money, *and* you haven’t\
    \ reached the deadline.\n- 3. After the loop ends, use an if block to figure out\
    \ what happened. Check if you have enough money. If not, you must have hit the\
    \ deadline, so show a different message.\n\nThe full solution is in the example\
    \ project, if you need it.\n\n## Optional: For, a loop with a built-in counter\n\
    \nIf you haven’t had quite enough loop-y goodness yet, JavaScript has another\
    \ tool for you. It’s called the for loop.\n\nA for loop is basically a loop with\
    \ a built-in counter. If that’s what you need, you’ll find that for is more compact\
    \ than while, though it doesn’t add any new features.\n\nHere’s an example. You\
    \ probably remember this loop of messages from the first exercise in this chapter:\n\
    \n```\nlet counter = 0;\n\nwhile (counter < 10) {\n  counter = counter + 1;\n\
    \  alert(counter);\n}\n```\n\nWith a for loop, it looks like this:\n\n```\nfor\
    \ (let counter = 0; counter < 10; counter++) {\n  alert(counter);\n}\n```\n\n\
    After the word for is a set of parentheses with three important details, separated\
    \ by semicolons. The first part creates the counter:\n\n```\nfor (let counter\
    \ = 0;\n```\n\nThe second part sets the condition that’s tested before each pass:\n\
    \n```\nfor (let counter = 0; counter < 10;\n```\n\nAnd the third part changes\
    \ the counter, in this case by adding 1 to it using the ++ operator:\n\n```\n\
    for (let counter = 0; counter < 10; counter++)\n```\n\nWhen you use a for loop,\
    \ it’s obvious that the variable in your parentheses is the counter. So, rather\
    \ than name it counter, lazy programmers usually give it a much shorter name.\
    \ Traditionally, they choose i, although the exact name doesn’t matter:\n\n```\n\
    for (let i = 0; i < 10; i++) {\n  alert(counter);\n}\n```\n\nAnything you can\
    \ do with for you can also do with while. But in real life, when people need a\
    \ counter they almost always use a for loop.\n\n## Chapter 10: Organizing with\
    \ Functions\n\nThere’s a pattern in all the examples you’ve seen so far. You click\
    \ a button, and a function springs into action. Every once in a while you add\
    \ *another* button to your page, and then you use another function to deal with\
    \ its clicks.\n\nAs your programs become more complicated, it’s important to organize\
    \ your code. One of the ways to do that is by making more functions, and breaking\
    \ your logic down into smaller pieces.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_116_0.png)\n\
    \n### Adding new functions\n\nMost of the programs you’ve seen so far have had\
    \ just one function, which runs when you click a button. But there’s nothing stopping\
    \ you from making more.\n\nTo add a function, all you need is the `function` keyword,\
    \ followed by the function’s name, empty parentheses `()`, and a set of braces\
    \ `{ }`.\n\n```\nfunction doSomething() {\n}\n```\n\nFunction names follow the\
    \ same rules as variable names, which don’t allow spaces and special characters\
    \ (other than underscores `_` and dashes `-`). Usually, the first letter of a\
    \ function name is lowercase. And it’s never OK to give two functions the same\
    \ name.\n\nCheck out this example with three functions:\n\n```\nfunction doSomething()\
    \ {\n    // There's nothing going in here right now.\n}\n\nfunction showMessage()\
    \ {\n    alert(\"Greetings from the showMessage() function.\");\n}\n\nfunction\
    \ showAnotherMessage() {\n    alert(\"Welcome to the showAnotherMessage() function.\"\
    );\n}\n```\n\nYou can put functions in any order you want. The order you write\
    \ them has no effect on the order that they’re used in your program. But it’s\
    \ important to always remember your braces. A common mistake is forgetting to\
    \ end a function with a closing `}`, so that two functions blend together in a\
    \ pile-up of code that JavaScript can’t understand.\n\n### Calling a function\n\
    \nYou already know that you can connect an event to a function. To do that, you\
    \ set an event attribute in your HTML. For example, if you want to handle the\
    \ onclick event of a button, you might set it like this:\n\n```\n<button onclick=\"\
    doSomething()\">Click Me</button>\n```\n\nThis works because `doSomething()` is\
    \ actually a valid line of JavaScript. So when the onclick event happens, all\
    \ it needs to do is run this statement, which calls the `doSomething()` function.\n\
    \nIf you understand that, it will come as no surprise to find out that you can\
    \ call a function in your own code using the same technique.\n\nFor example, check\
    \ out this revised version of the `doSomething()` function, which calls *another*\
    \ function:"
  mdcn: "\n## 没有计数器的循环\n\n到目前为止，你已经看到了几个使用计数器的循环示例。带计数器的循环会跟踪它们重复的次数，并在恰当时刻终止循环。\n\
    \n但有时你并不知道循环应该执行多少次。例如，也许你正在使用循环创建动画，希望经过一段时间后停止。或者你正在使用循环运行一个游戏，当有人达到特定分数时游戏结束。又或者你正在执行一系列计算，直到找到某个特定值才会停止。在这些情况下，你需要为循环编写不同类型的条件。\n\
    \n为了启发你的思考，这里有一个游戏中代码如何工作的粗略示例，省略了所有杂乱的细节：\n\n```\ndo {\n\n    // (在此处进行一轮游戏……)\n\
    \n    // (在此处增加获胜者的分数……)\n\n    // 使用条件，当有人获得50分时停止。\n\n} while (playerOneScore\
    \ < 50 && playerTwoScore < 50);\n\n// 好耶，我们有赢家了！\n// 如果你执行到这里，说明有人已经得到50分或更多。\n\
    // 现在你可以用if语句块来判断谁赢了。\n```\n\n准备好尝试一些实际代码了吗？试试下一个练习，在那里你将使用循环让自己成为百万富翁。\n\n##\
    \ 亲自试试！\n\n> **百万美元披萨（挑战等级：中等）**\n\n[https://codepen.io/prosetech/pen/XWKlQYz](https://codepen.io/prosetech/pen/XWKlQYz)\n\
    \n你是不是讨厌这种事情发生？你借了50万美元来开一家披萨店。（梦想，对吧？）但你能在此之前还清贷款吗？\n\n还有一件事。这笔钱（50万美元现金）来自一位心情不太好的黑帮老大……\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_111_0.png)\n\n要解决这个问题，你需要一个循环，每年计算你欠的钱和你赚的钱。如果你攒够了钱来偿还债务，你就可以结束循环，还清贷款，然后驶向夕阳。\n\
    \n以下是计算方法。你每年需支付2%的利息。你可以用它来计算欠款金额：\n\n```\namountOwed = amountOwed * 1.02;\n\
    ```\n\n所以如果`amountOwed`初始为500000，第一年后会增长到510000。以此类推。\n\n但与此同时，你的披萨店也在赚钱，每年能赚到可观的32,000美元。你可以用这样的公式来追踪你不断增长的存款：\n\
    \n```\namountEarned = amountEarned + 32000;\n```\n\n循环的每一次遍历代表一年的时间流逝。在循环结束时，你必须使用一个条件来测试你赚的钱是否足够还清欠款。如果够了，就结束循环，并告诉我们花了多少年。很简单，对吧？\n\
    \n> **提示** 你的条件需要比较`amountOwed`和`amountEarned`。你需要在循环中跟踪年份数（每次循环运行时加1），但循环条件中并不使用年份变量。\n\
    \n## 亲自试试！\n\n## 百万美元披萨 II（挑战等级：困难）\n\nhttps://codepen.io/prosetech/pen/NWrBZWg\n\
    \n如果你想炫耀，这里有一个基于“百万美元披萨”第一版的另一个挑战。\n\n首先，尝试使用不同的金额或利息运行原始程序（你在上个练习中编写的那个）。玩一会儿，你会注意到一个大问题。如果你欠款金额的增长速度比你赚钱的速度快，你编写的循环就会变成一个无限循环。这是因为无论你花多少个世纪，都无法还清贷款。但计算机可能会忽略这样明显的事实，你的页面就会因为试图拯救你的商店而永远循环，导致页面卡住。\n\
    \n你的下一个挑战是调整代码以设置一个超时时间。换句话说，过了若干年后，黑帮老大就会来收钱。如果到那时你没有足够的钱，你就输了。\n\n以下是构建此解决方案的方法：\n\
    \n- 1. 你需要一个新的条件，当达到一定年数（比如30年）时结束循环。\n- 2. 使用&&符号（即“与”，如第8章所述）将新条件与第一个条件连接起来。这样，只要你还缺钱*并且*还没到截止日期，你的循环就会继续运行。\n\
    - 3. 循环结束后，使用if语句块来判断发生了什么。检查你是否有足够的钱。如果没有，那一定是到了截止日期，所以显示不同的消息。\n\n如果需要，完整解决方案在示例项目中。\n\
    \n## 可选：for，一个内置计数器的循环\n\n如果你对循环的用法还不够过瘾，JavaScript还有另一个工具给你。它叫做for循环。\n\nfor循环基本上是一个内置计数器的循环。如果那是你需要的，你会发现for比while更紧凑，尽管它没有增加任何新功能。\n\
    \n这是一个例子。你可能还记得本章第一个练习中的这个消息循环：\n\n```\nlet counter = 0;\n\nwhile (counter < 10)\
    \ {\n  counter = counter + 1;\n  alert(counter);\n}\n```\n\n使用for循环，它看起来像这样：\n\
    \n```\nfor (let counter = 0; counter < 10; counter++) {\n  alert(counter);\n}\n\
    ```\n\n在`for`这个词后面是一组括号，包含三个重要的部分，用分号分隔。第一部分创建计数器：\n\n```\nfor (let counter =\
    \ 0;\n```\n\n第二部分设置每次遍历前测试的条件：\n\n```\nfor (let counter = 0; counter < 10;\n```\n\
    \n第三部分修改计数器，在本例中是使用++运算符将其加1：\n\n```\nfor (let counter = 0; counter < 10; counter++)\n\
    ```\n\n当你使用for循环时，很明显括号里的变量就是计数器。所以，与其将其命名为`counter`，懒惰的程序员通常会给它一个短得多的名字。传统上，他们选择`i`，尽管确切的名字并不重要：\n\
    \n```\nfor (let i = 0; i < 10; i++) {\n  alert(counter);\n}\n```\n\n你能用for做的任何事情，也可以用while完成。但在现实生活中，当人们需要一个计数器时，他们几乎总是使用for循环。\n\
    \n## 第10章：用函数组织代码\n\n在你目前看到的所有示例中，都存在一个模式。你点击一个按钮，一个函数就会被激活。偶尔你给页面添加*另一个*按钮，然后使用另一个函数来处理它的点击事件。\n\
    \n随着你的程序变得越来越复杂，组织你的代码变得非常重要。其中一种方法就是创建更多函数，将你的逻辑分解成更小的部分。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_116_0.png)\n\
    \n### 添加新函数\n\n到目前为止，你看到的大多数程序都只有一个函数，当你点击按钮时运行。但没有什么能阻止你创建更多。\n\n要添加一个函数，你只需要`function`关键字，后跟函数名、空括号`()`和一组花括号`{\
    \ }`。\n\n```\nfunction doSomething() {\n}\n```\n\n函数名遵循与变量名相同的规则，不允许使用空格和特殊字符（除了下划线`_`和短横线`-`）。通常，函数名的首字母是小写的。并且永远不能给两个函数起相同的名字。\n\
    \n看看这个包含三个函数的例子：\n\n```\nfunction doSomething() {\n    // 这里现在什么都没有。\n}\n\nfunction\
    \ showMessage() {\n    alert(\"Greetings from the showMessage() function.\");\n\
    }\n\nfunction showAnotherMessage() {\n    alert(\"Welcome to the showAnotherMessage()\
    \ function.\");\n}\n```\n\n你可以按任何顺序放置函数。你编写它们的顺序对它们在程序中使用的顺序没有影响。但始终记住你的花括号很重要。一个常见的错误是忘记用闭合的`}`来结束函数，导致两个函数混在一起，JavaScript无法理解的一堆代码。\n\
    \n### 调用函数\n\n你已经知道可以将事件连接到一个函数。为此，你在HTML中设置一个事件属性。例如，如果你想处理按钮的onclick事件，你可能会这样设置：\n\
    \n```\n<button onclick=\"doSomething()\">Click Me</button>\n```\n\n这之所以有效，是因为`doSomething()`实际上是一行有效的JavaScript。所以当onclick事件发生时，它需要做的就是运行这条语句，它会调用`doSomething()`函数。\n\
    \n如果你理解了这一点，那么发现你可以使用同样的技术在你自己的代码中调用函数也就不足为奇了。\n\n例如，看看这个修改过的`doSomething()`函数版本，它调用了*另一个*函数：\n"
