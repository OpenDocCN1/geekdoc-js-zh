    \ click a button! But before you can take control of your variables and store\
    \ information for the long term, you need to understand a bit more about how they\
    \ live… and when they die.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_74_0.png)\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_74_1.png)\n\n# Local variables\n\n\
    When you define a variable inside a function, it’s called a *local variable*.\
    \ It lives until the function ends. Here’s an example with a string called `welcomeMessage`:\n\
    \n```\nfunction sayHello() {\n  let welcomeMessage = \"Hi, fancy pants\";\n\n\
    \  alert(welcomeMessage);\n}\n```\n\nOnce the code runs and the `sayHello()` function\
    \ ends, the `welcomeMessage` is thrown away, along with whatever information is\
    \ inside the variable. There’s no way to get that information back.\n\nIn a program,\
    \ the same piece of code can run many times. For example, maybe the `sayHello()`\
    \ function is attached to the `onclick` event of a button. In that case, every\
    \ time you click the button this happens:\n\n75"
  - '[PAGE 75]


    +   1. The `sayHello()` function starts.

    2. It creates a new, blank copy of the `welcomeMessage` variable.

    3. It puts the “Hi, fancy pants text” inside the `welcomeMessage` variable.

    4. It uses `alert()` to show the message.

    5. The `sayHello()` function ends, and the `welcomeMessage` function variable
    disappears again, taking its contents with it.


    Clearly, you can’t use `welcomeMessage` to store information for a longer time,
    because the variable only lives for a few seconds. This isn’t a problem in this
    example, because `welcomeMessage` never changes. But there is *another* way.


    # Global variables


    Sometimes you have a piece of information that you want to keep around for longer,
    maybe even as long as your program is running.


    > NOTE In a web page, “as long as the program is running” means as long as the
    web page is open in the browser. As soon as you close the browser tab or go to
    a different page, your program is over. (In CodePen, there''s one more rule—when
    you edit your example, the program restarts.)


    To store data for a longer period of time, you need to use a *global variable*.
    Local variables stay in one *location* (the function where you create them). Global
    variables are available everywhere in your code.


    To define a global variable you use the same `let` keyword, but you put it in
    a different place. Instead of creating your variable inside a function, you declare
    it *outside* of your function.'
  - "[PAGE 76]\n\nHere’s an example:\n\n```\nlet welcomeMessage = \"Hi, fancy pants\"\
    ;\n\nfunction sayHello() {\n    alert(welcomeMessage);\n}\n```\n\nYou might be\
    \ suspicious of this code if you remember the rule from Chapter 1 (don’t put code\
    \ outside a function). But code that creates variables is acceptable. It runs\
    \ right away, and sets everything up for your functions to use.\n\n> **TIP** You\
    \ can put your variables before the functions that use them—or anywhere you want,\
    \ really. But usually, the simplest way to organize your code is to put all your\
    \ global variables at the beginning of the code file (at the top of the JavaScript\
    \ box), above all your functions.\n\nThis code in this example (with the global\
    \ `welcomeMessage` variable) still works the same as the earlier version (with\
    \ the local `welcomeMessage` variable). But that quickly changes in slightly more\
    \ complicated examples, like the ones you’ll see next.\n\n# Sharing the same variable\
    \ with different functions\n\nHere’s a quick recap of the two differences between\
    \ global variables and a local variables:\n\n+   - Local variables live until\
    \ the function ends. Global variables live until the program ends—say, when you\
    \ close the browser (or edit your code in CodePen).\n- Local variables can only\
    \ be used in one function. But you can use global variables in *every* function.\n\
    \nThe second concept is called *scope*, and it’s the one we’ll explore next."
