  md: "# Chapter 9\n\n# Repeating Yourself with Loops\n\nComputers never get tired.\
    \ If you give them a job, they keep at it until it's done. If you want to calculate\
    \ a formula, they don't care whether it's once or a thousand times in a row. And\
    \ in this chapter, you'll see just how easy it is to make your code do something\
    \ a thousand times in row. All you need is a loop.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_104_0.png)\n\
    \n# The simplest possible loop\n\nJavaScript has several different types of loops.\
    \ All of them share one thing in common—you put the code you want to repeat in\
    \ between braces { }.\n\nHere's a simple example with something called a while\
    \ loop:\n\n```\n// Don't try this at home.\nwhile (true) {\n\n    alert(\"Welcome\
    \ to Groundhog Day.\");\n\n}\n```\n\nThe while keyword starts the loop:\n\n```\n\
    while\n```\n\nImmediately after that are the parentheses () where you put a condition.\
    \ The condition tells the loop when to end.\n\n```\nwhile ()\n```"
  merge: -1
  pgno: 104
- img_proc: true
  md: 'In this example, the condition is just true, which means the loop never ends.


    ```

    while (true)

    ```


    After the condition are the braces { } that hold the code you want to repeat.


    ```

    while (true) {

    }

    ```


    So what does JavaScript do when it meets a loop like this? Here''s a breakdown:


    +   1. JavaScript checks the loop condition.

    2. If the condition evaluates to true, JavaScript starts the code in the loop.

    3. JavaScript runs all the code statements in the braces from top to bottom. In
    this example, there''s just one code statement in the loop. It shows an alert
    box with a message about Groundhog Day.

    4. JavaScript returns to the first step and starts the process over.


    As long as the condition is true, JavaScript keeps re-running the code in the
    loop. In this example, the condition stays true *forever*, which means a new alert
    box appears every time you close the last one. (But remember, the alert() command
    pauses your code until you click OK. That means you''ll never see more than one
    alert box box pop up at the same time.)


    This never-ending sequence of alert boxes lasts until you end the program by closing
    the browser tab or refreshing the page.


    # A loop that counts


    A loop that carries on forever is called an *infinite loop*. In a real program,
    you would never create an infinite loop on purpose. Instead, you''d use a condition
    that eventually turns false, ending the loop and letting JavaScript continue to
    the rest of your code.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The simplest approach is to make a loop that runs an exact number of times.
    You decide how many times the loop should repeat its code, and you use a variable
    to enforce it.


    For example, you might create a variable named counter:


    ```

    let counter = 0;

    ```


    It’s important that you create this variable *before* the loop, not *inside* the
    loop.


    You use your counter to keep track of what’s happening. Each time the loop runs
    its code, you add one to your counter. Basically, you’re counting the number of
    times the loop repeats.


    The counting code goes in the loop:


    ```

    counter = counter + 1;

    ```


    The final ingredient is a condition that tells the loop when to stop. For example,
    you might tell JavaScript to repeat the loop while the counter is less than 10:


    ```

    while (counter < 10)

    ```


    When a loop ends, JavaScript continues to run whatever code is after the loop.


    Proper counting is important. People sometimes get tripped by the fact that most
    counters start at 0, or they’re not sure whether to use < or <=. But you don’t
    need to take my word on it. Try this next example to see for yourself how many
    times a loop repeats.'
  merge: -1
  pgno: 106
- img_proc: true
  md: "# Try it yourself!\n\n> Predict the Future (Challenge Level: Easy)\n\nhttps://codepen.io/prosetech/pen/qBNygyg\n\
    \nHere’s a loop that shows alert boxes. It creates a variable named counter to\
    \ keep track of how many times it goes around the loop:\n\n```\nlet counter =\
    \ 0;\n\nwhile (counter < 10) {\n    counter = counter + 1;\n    alert(counter);\n\
    }\n```\n\nYour challenge is to run the code in your brain. Go line by line, one\
    \ loop at a time, to figure out what’s going to happen. What sequence of alert\
    \ boxes will you see before the code ends?\n\nNow try changing the < to <=. What\
    \ changes?\n\n# Try it yourself!\n\n> Put It In Reverse (Challenge Level: Medium)\n\
    \nhttps://codepen.io/prosetech/pen/qBNygyg\n\nThe most common type of counter\
    \ is one that starts at 0 and continues upward. But JavaScript doesn’t limit you.\
    \ For example, you could make a counter that increases by fives. Or, you could\
    \ create a counter that counts down from a maximum value."
