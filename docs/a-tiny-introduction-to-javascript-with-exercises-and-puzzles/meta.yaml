  md: '# # What comes after CodePen


    Of course, just because you start in CodePen doesn’t mean you have to stay there.
    Eventually you can take the code you’ve written, save it on your computer, and
    use a professional (but still free) editor like Visual Studio Code.


    When you’re ready to take this road, CodePen has an export feature that can help
