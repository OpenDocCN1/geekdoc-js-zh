    > 注意 查找注释 // FIX THIS PART 以找到你需要修改的礼物交换代码。此示例中还有一些使用网页上文本框的代码，但我们还没有讲到那个技术。


    问题很简单就能找到。礼物交换中的第一条语句将一个礼物盒（久保的）的内容复制到了另一个礼物盒（毛的）中。从这以后，两个盒子里的礼物就 *一样* 了。这意味着没有办法再找回毛原来礼物盒里的东西了。


    > **提示** 要解决这个问题，你需要创建第三个变量来帮助你。这个变量可以在你进行交换的第一部分时，暂时存放毛的礼物。


    还是觉得难？我们告诉过你它可能很棘手。以下是解决这个问题的具体步骤分解：


    1. 创建一个新变量。这就是那个额外的盒子。

    2. 将一个礼物盒中的值复制到额外的盒子中。从哪个盒子开始并不重要，但我们决定把毛的礼物移到额外的盒子里。

