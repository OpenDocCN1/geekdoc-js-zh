  md: '# Try it yourself!


    ▶ **Ice, Dagger, Lava (Challenge Level: Tricky)**


    https://codepen.io/prosetech/pen/rNeByow


    If you’ve ever played rock, paper, scissors, you’ll have no trouble understanding
    the number one gaming hit in the goblin kingdom: *Ice, Dagger, Lava*. In each
    round, you and your opponent choose to use ice, a dagger, or the lava of an erupting
    volcano. Here’s how you decide who wins:


    +   1. Lava melts the dagger. (Winner: lava)

    2. Dagger breaks the ice. (Winner: dagger)

    3. Ice hardens lava into stone. (Winner: ice)


    If you both choose the same attack, no one wins.


    **Let’s play.**


    **Make your choice NOW!**


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_147_0.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: "The *Ice, Dagger, Lava* code is already set up with most of what you need.\
    \ You click one of three pictures to choose your attack. Then, the `playIceDaggerOrLava()`\
    \ function decides who wins. Your job is to write the code for that function.\n\
    \nYour opponent is a computer goblin, who chooses an attack at random. Choosing\
    \ between three options is the same as choosing a random number from 1 to 3. For\
    \ example, you could ice is 1, dagger is 2, and lava is 3. To make that system\
    \ easier to remember, the code use three constants:\n\n```\nconst ice = 1;\nconst\
    \ dagger = 2;\nconst lava = 3;\n```\n\nRemember, constants are just variables\
    \ that never change.\n\nThe button clicking code is already there. For example,\
    \ if you click the ice picture this is what happens:\n\n```\nfunction pickIce()\
    \ {\n  playIceDaggerOrLava(ice);\n}\n```\n\nCalling `playIceDaggerOrLava(ice)`\
    \ is the same as `playIceDaggerOrLava(1)`. But if you use the constant names in\
    \ your code instead of the magic numbers, your code is easier to understand, and\
    \ you’re less likely to mix up a number.\n\nNow it’s time for your contribution.\
    \ You need to write the code in `playIceDaggerOrLava()`. First, you need to pick\
    \ a random number from 1 to 3, representing ice, dagger, or lava. That’s the easy\
    \ part.\n\nNow you need to write an **if** block that figures out who wins. This\
    \ part is tricky because there are many ways to win and many ways to lose. The\
    \ best approach is to use a two-part strategy. First, you figure out whether it’s\
    \ a win or a loss, and *then* you decide what to do about it."
