    ```


    The `round()` function always rounds to the nearest whole number. So 4.349 becomes
    4 and 4.931 becomes 5. But what if you want to round to a different digit?


    For example, let’s say you want to keep exactly two decimal digits, so 4.349 becomes
    4.35. You might expect that the `round()` function could do this for you, but
    it’s not that helpful. You need to work for it.


    In this situation, you need to juggle your number around with a bit of multiplication
    and division. Here’s a demonstration:


    ```

    let longNumber = 4.349;


    // Move the decimal to the right two places.

    longNumber = longNumber * 100          // longNumber=434.9


    // Round the number.

    let roundedNumber = math.Round(longNumber);   // roundedNumber=435


    // Move the decimal back where it was before.

    roundedNumber = roundedNumber / 100       // rounderNumber=4.35

    ```


    This example moves the decimal to the right place, rounds the number, and then
    moves the decimal back where it was before. Once you get used to this pattern,
    you can combine it all it a single statement:


    ```

    let longNumber = 4.349;

    let roundedNumber = math.Round(longNumber*100) / 100;

    ```'
