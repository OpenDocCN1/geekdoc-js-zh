- md: '# Why CodePen?


    CodePen is one of several free JavaScript playgrounds that you can use in your
    browser. With CodePen, you can write JavaScript code, test it, and save it for
    later, without needing to set anything up. And all the pieces of your solution—the
    HTML that creates the page, the CSS that makes it look good, and the JavaScript
    that powers it—are brought together in one place. There’s no need to juggle separate
    files.


    This guide uses CodePen for all its exercises. Usually, you’ll start with a project
    that’s already built, and then change it. Maybe you’ll need to make an enhancement
    or fix a problem. And when you’re finished, you can show your work to other people
    just by sending them a link.


    # What if I’m actually an adult?


    Take comfort, it’s not all bad. But if the question is “Can I use this book even
    if I’m not a kid?” then the answer is easy—yes!


    However, this book assumes you’re learning JavaScript and programming for the
    first time. If you already know a bit about programming, you’ll probably prefer
    a guide that focuses on the JavaScript language without re-introducing the concepts
    you already know.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_12_0.png)


    # About me


    I''ve written dozens of computer books for publishers like O''Reilly, Apress,
    No Starch, and McGraw Hill. Some of them are still helpfully propping open doors
    in my house.


    These days I spend most of my time experimenting with weird projects and writing
    about the art of software building on Young Coder (http://medium.com/young-coder).
    Follow me there, or on Twitter (http://twitter.com/prosetech), or go to my website
    if you''re curious about the things I''ve written in the past (http://prosetech.com).


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_13_0.png)


    # How can I support the Tiny Introductions project?


    Please enjoy this book guilt-free! Share it with your family! Give it to your
    friends! There''s no limit, so long as you don''t change it or pass it off as
    your own work.


    If you find mistakes, please let me know. I greatly benefit from people pointing
    out problems I''ve missed, so they don''t frustrate other readers. Send me your
    complaints, comments, questions, and suggestions to matthew@prosetech.com. What
    worked? What''s still keeping you up at night? Don''t be shy!


    If you feel particularly enthusiastic about the Tiny Introductions project, and
    you want to say thanks (or just encourage me to write more books in the series),
    you can buy your own copy of A Tiny Introduction to JavaScript. It''s available
    in print from Amazon (in which case I get a teeny portion of the proceeds) or
    in a pay-what-you-can PDF form on Gumroad. Thanks a bunch!


    ## Chapter Zero


    # CodePen: Your New Home


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_14_0.png)


    All the work you''ll do in this guide happens in CodePen. So before you get started,
    it''s time to check out your new home.


    CodePen is a JavaScript *playground*. That means it''s a place where you can write
    web pages and try them out. CodePen isn''t the only JavaScript playground, but
    it''s my favorite. It''s easy to use. You can start with someone else''s example,
    change it, and save it to your own account. And all the basic features are free.


    # Signing up on CodePen


    You don''t need an account to use CodePen. But having an account is a good idea,
    because it allows you to save your work. CodePen accounts are free (although you
    can pay for a pro account with extra features).


    To create a CodePen account, go to [http://codepen.io](http://codepen.io) and
    click the **Sign Up** button. You need to give your email address, choose a password,
    and pick a CodePen name. You know, the usual stuff. Or, you can register with
    a social media account that you already use, like Twitter or Facebook.


    # Looking at an example on CodePen


    In this guide, you get links that take you to each example. Try it out now, by
    visiting *The Most Wonderful Button in the World*:


    [https://codepen.io/prosetech/pen/PoNqRbq](https://codepen.io/prosetech/pen/PoNqRbq)


    If you''re reading this guide in a browser, here''s a useful trick. Hold down
    the **Ctrl** key when you click the link. That way the example opens in a new
    tab, and doesn''t take you away from what you''re reading right here, in this
    tab.


    > **NOTE** If you''re reading this book on paper, you obviously can''t click the
    links. To save yourself some typing, visit [http://prosetech.com/tiny](http://prosetech.com/tiny),
    where there''s a list of all the examples, organized by chapter.


    When you go to an example in CodePen, you''ll see a window that''s split into
    several parts.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_15_0.png)


    There are four boxes in the CodePen window:


    - **HTML.** That’s the content of your web page (the elements and text).

    - **CSS.** These are the styles that set how your web page looks.

    - **JavaScript.** This is the code you’re going to learn to write. You’ll spend
    a lot of time in this box.

    - **Preview.** This is what the actual page you’re building looks like (so far).


    Usually, the HTML, CSS, and JavaScript sections are arranged on the top, and the
    preview is underneath.


    If your browser window is too small, CodePen rearranges itself to put the preview
    on the right side, and combines the HTML, CSS, and JavaScript sections on the
    left.


    You can start changing a CodePen example right away. Try it out with *The Most
    Wonderful Button in the World*. Click in the HTML box, and change the text on
    the button. (Right now, it’s “The most beautiful button in the world?”) A moment
    after your change, the preview will update itself. If you’re noticing a delay,
    you can always click the preview section to hurry it up.


    > **NOTE** Remember, if you don’t know anything about HTML and you aren’t comfortable
    editing it yet, you can read the *Messing Up the Web* tutorial to get started
    ([http://tiny.cc/webmess](http://tiny.cc/webmess)).


    # Hiding the CSS


    CSS (Cascading Style Sheets) is the standard you use to format the appearance
    of a web page. All the examples you’ll see in this guide have some formatting.
    But if you don’t want to be distracted by that information (and you want more
    space to read your JavaScript code), you can temporarily hide the CSS section
    on CodePen.


    To do that, click the tiny down-arrow button at the top of the CSS box and choose
    **Minimize CSS Editor**.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_17_0.png)


    You can hide the other CodePen boxes, too, but you won’t want to. You need to
    keep the HTML and JavaScript handy in order to finish each example.


    # Seeing a bigger preview


    Sometimes CodePen tries to cram too much stuff into your web browser window. The
    web page preview (at the bottom) can be particularly awkward. It’s not very tall,
    so you might need to scroll up and down to see the whole preview.


    To improve this situation, you can resize different parts of the CodePen window.
    The trick is to click in between the boxes, on the black bars that separate each
    section. Then you can drag them to make a section smaller or bigger.


    Sometimes, no matter what you do, you can’t fit everything in at once. In this
    case, it’s time to switch views using the **Change View** button (at the top right
    of the CodePen window). Click it and choose another option to take a different
    look at your example. Click **Full Page View** to temporarily expand the web page
    preview so it fills the whole window. Or, choose one of the other box arrangements
    under the **Editor Layout** heading to put the preview window on the side.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_18_0.png)


    When you''re in full page view, you can''t see the other stuff, like your HTML
    and JavaScript. When it''s time to switch back to normal so you can edit your
    example, click the **Change View** button again and choose **Editor View**. You''ll
    get used to jumping back and forth in no time.


    # Forking an example


    When you go to an example like *The Most Wonderful Button in the World*, you''re
    seeing the version I created. You can make changes, but your changes are temporary.
    They won''t replace my version.


    Often, you''ll want to save your work. Maybe you want to look at it later. Or
    maybe you''re in the middle of a big change. Maybe you want to show it to someone
    else. In all of these cases, the solution is to *fork* the example, which means
    to create your own copy. (The word “fork” comes from a fork in the road—a place
    where the path splits. You''re going to split the code and take your own path.)


    To fork an example, you need to have a CodePen account. Assuming you have one,
    all you need to do is click the **Fork** button at the bottom of the window. The
    example is now yours to change however you want and save for the future.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_19_0.png)


    The very tiny Fork button.'
  mdcn: '

    # 为何选择 CodePen？


    CodePen 是一个你可以在浏览器中使用的免费 JavaScript 沙盒之一。通过 CodePen，你可以编写 JavaScript 代码、进行测试并保存以备后用，无需进行任何设置。你解决方案的所有部分——创建页面的
    HTML、使其美观的 CSS 以及驱动它的 JavaScript——都汇聚在一处。无需费心管理单独的文件。


    本指南的所有练习都将使用 CodePen。通常，你会从一个已经构建好的项目开始，然后修改它。也许你需要进行功能增强或修复问题。完成后，你只需发送一个链接，就可以向他人展示你的作品。


    # 如果我其实是个成年人怎么办？


    请放心，情况并非全是坏处。但如果问题是“即使我不是孩子，我能用这本书吗？”那么答案很简单——是的！


    不过，本书假设你是初次学习 JavaScript 和编程。如果你已经对编程有所了解，你可能更喜欢一本专注于 JavaScript 语言本身，而不会重新介绍你已知概念的指南。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_12_0.png)


    # 关于我


    我曾为 O''Reilly、Apress、No Starch 和 McGraw Hill 等出版社撰写过数十本计算机书籍。其中一些至今仍在我家发挥着顶门的作用。


    如今，我大部分时间都在尝试各种有趣的项目，并在 Young Coder (http://medium.com/young-coder) 上撰写关于软件构建艺术的文章。欢迎在那里或
    Twitter (http://twitter.com/prosetech) 上关注我，或者访问我的网站，如果你对我过去写的东西感兴趣的话 (http://prosetech.com)。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_13_0.png)


    # 如何支持“微简介”项目？


    请无负担地享受这本书吧！与家人分享它！把它送给朋友！只要你不更改它或将它冒充为你自己的作品，分享是不受限制的。


    如果你发现错误，请告诉我。指出我遗漏的问题对我帮助很大，这样它们就不会困扰其他读者。请将你的投诉、评论、问题和建议发送到 matthew@prosetech.com。什么内容有效？什么问题仍然让你夜不能寐？请尽管开口！


    如果你对“微简介”项目特别热衷，并想表示感谢（或只是鼓励我撰写更多系列书籍），你可以购买一本《JavaScript 微简介》。它在 Amazon 上有印刷版可购（那样我会获得一小部分收益），或者在
    Gumroad 上提供可自由付费的 PDF 版本。非常感谢！


    ## 第零章


    # CodePen：你的新家


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_14_0.png)


    本指南中你所有的操作都将在 CodePen 中进行。所以在开始之前，是时候熟悉你的新家了。


    CodePen 是一个 JavaScript *沙盒*。这意味着你可以在其中编写网页并进行测试。CodePen 并非唯一的 JavaScript 沙盒，但它是我最喜爱的一个。它易于使用。你可以从他人的示例开始，修改它，然后将其保存到你自己的账户中。所有基本功能都是免费的。


    # 在 CodePen 上注册


    你无需账户即可使用 CodePen。但拥有账户是个好主意，因为它可以让你保存作品。CodePen 账户是免费的（尽管你可以付费购买具有额外功能的专业账户）。


    要创建 CodePen 账户，请访问 [http://codepen.io](http://codepen.io) 并点击 **Sign Up** 按钮。你需要提供电子邮件地址、选择密码并选取一个
    CodePen 名称。你知道的，就是那些常规信息。或者，你可以使用你已有的社交媒体账户进行注册，比如 Twitter 或 Facebook。


    # 在 CodePen 上查看示例


    在本指南中，你会收到指向每个示例的链接。现在就通过访问 *世界上最美妙的按钮* 来试一试吧：


    [https://codepen.io/prosetech/pen/PoNqRbq](https://codepen.io/prosetech/pen/PoNqRbq)


    如果你正在浏览器中阅读本指南，这里有一个有用的技巧。点击链接时按住 **Ctrl** 键。这样示例会在新标签页中打开，不会让你离开当前正在阅读的这个标签页。


    > **注意** 如果你正在纸质书上阅读这本书，你显然无法点击链接。为了省去一些输入，可以访问 [http://prosetech.com/tiny](http://prosetech.com/tiny)，那里有一个按章节组织的所有示例列表。


    当你在 CodePen 中打开一个示例时，你会看到一个被分成几个部分的窗口。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_15_0.png)


    CodePen 窗口中有四个区域：


    - **HTML。** 这是你的网页内容（元素和文本）。

    - **CSS。** 这些是设定网页外观的样式。

    - **JavaScript。** 这是你将要学习编写的代码。你会在这个区域花费大量时间。

    - **预览。** 这是你正在构建的页面的实际样子（目前为止）。


    通常，HTML、CSS 和 JavaScript 部分排列在顶部，而预览则位于下方。


    如果你的浏览器窗口太小，CodePen 会重新排列自身，将预览放在右侧，并将 HTML、CSS 和 JavaScript 部分合并到左侧。


    你可以立即开始修改 CodePen 示例。就用 *世界上最美妙的按钮* 来试试吧。在 HTML 区域中点击，更改按钮上的文本。（现在它写着“世界上最美的按钮？”）你的更改后，预览会立即更新。如果你注意到延迟，随时可以点击预览区域来加快更新。


    > **注意** 记住，如果你对 HTML 一无所知，还不太习惯编辑它，你可以阅读《弄乱网页》教程来入门 ([http://tiny.cc/webmess](http://tiny.cc/webmess))。


    # 隐藏 CSS


    CSS（层叠样式表）是用于格式化网页外观的标准。你在本指南中看到的所有示例都有一些格式。但如果你不想被这些信息分心（并且想留出更多空间来阅读 JavaScript
    代码），你可以暂时在 CodePen 中隐藏 CSS 部分。


    为此，请点击 CSS 区域顶部的小下箭头按钮，然后选择 **Minimize CSS Editor**。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_17_0.png)


    你也可以隐藏其他 CodePen 区域，但你可能不会想这样做。你需要保持 HTML 和 JavaScript 熟手以便完成每个示例。


    # 查看更大的预览


    有时 CodePen 试图在你的浏览器窗口中塞入太多东西。网页预览（在底部）可能特别不方便。它不是很高，所以你可能需要上下滚动才能看到整个预览。


    为了改善这种情况，你可以调整 CodePen 窗口的不同部分。诀窍是在分隔每个区域的黑色条之间的区域点击。然后你可以拖动它们来使某个区域变小或变大。


    有时，无论你怎么做，都无法一次容纳所有内容。在这种情况下，是时候使用 **Change View** 按钮（位于 CodePen 窗口右上角）来切换视图了。点击它并选择另一个选项，以不同的方式查看你的示例。点击
    **Full Page View** 可以暂时展开网页预览，使其填满整个窗口。或者，在 **Editor Layout** 标题下选择其他框布局之一，将预览窗口放在侧面。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_18_0.png)


    当你处于全页视图时，你看不到其他内容，比如你的 HTML 和 JavaScript。当需要切换回正常模式以便编辑示例时，再次点击 **Change View**
    按钮并选择 **Editor View**。你很快就会习惯来回切换。


    # 分叉示例


    当你访问像 *世界上最美妙的按钮* 这样的示例时，你看到的是我创建的版本。你可以进行更改，但你的更改是临时的。它们不会替换我的版本。


    通常，你会想保存你的作品。也许你想稍后查看它。或者你可能正在进行一个大改动。也许你想把它展示给别人。在所有这些情况下，解决方案是*分叉*这个示例，这意味着创建你自己的副本。（“fork”一词源自道路的分叉口——路径分开的地方。你将把代码分开，走上自己的道路。）


    要分叉一个示例，你需要有一个 CodePen 账户。假设你已经有了，你所要做的就是点击窗口底部的 **Fork** 按钮。现在这个示例就归你了，你可以随意修改并为未来保存。


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_19_0.png)


    非常小的分叉按钮。

