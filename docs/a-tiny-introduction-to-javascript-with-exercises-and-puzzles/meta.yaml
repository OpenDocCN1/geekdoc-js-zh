  md: '# Chapter 10


    # Organizing with Functions


    There''s a pattern in all the examples you''ve seen so far. You click a button,
    and a function springs into action. Every once in a while you add *another* button
    to your page, and then you use another function to deal with its clicks.


    As your programs become more complicated, it''s important to organize your code.
    One of the ways to do that is by making more functions, and breaking your logic
    down into smaller pieces.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_116_0.png)


    # Adding new functions


    Most of the programs you''ve seen so far have had just one function, which runs
    when you click a button. But there''s nothing stopping you from making more.


    To add a function, all you need is the `function` keyword, followed by the function''s
    name, empty parentheses `()`, and a set of braces `{ }`.


    ```

    function doSomething() {

    }

    ```


    Function names follow the same rules as variables names, which don''t allow spaces
    and special characters (other than underscores `_` and dashes `–`). Usually, the
    first letter of a function name is lowercase. And it''s never OK to give two functions
    the same name.'
  merge: -1
  pgno: 116
- img_proc: true
  md: "Check out this example with three functions:\n\n```\nfunction doSomething()\
    \ {\n    // There's nothing going in here right now.\n}\n\nfunction showMessage()\
    \ {\n    alert(\"Greetings from the showMessage() function.\");\n}\n\nfunction\
    \ showAnotherMessage() {\n    alert(\"Welcome to the showAnotherMessage() function.\"\
    );\n}\n```\n\nYou can put functions in any order you want. The order you write\
    \ them has no effect on the order that they're used in your program. But it's\
    \ important to always remember your braces. A common mistake is forgetting to\
    \ end a function with a closing }, so that two functions blend together in a pile-up\
    \ of code that JavaScript can't understand.\n\n# Calling a function\n\nYou already\
    \ know that you can connect an event to a function. To do that, you set an event\
    \ attribute in your HTML. For example, if you want to handle the onclick event\
    \ of a button, you might set it like this:\n\n```\n<button onclick=\"doSomething()\"\
    >Click Me</button>\n```\n\nThis works because doSomething() is actually a valid\
    \ line of JavaScript. So when the onclick event happens, all it needs to do is\
    \ run this statement, which calls the doSomething() function.\n\nIf you understand\
    \ that, it will come as no surprise to find out that you can call a function in\
    \ your own code using the same technique.\n\nFor example, check out this revised\
    \ version of the doSomething() function, which calls *another* function:"
  merge: -1
  pgno: 117
- img_proc: true
  md: "```\nfunction doSomething() {\n  showMessage();\n}\n```\n\nNow when someone\
    \ clicks the **Click Me** button, it triggers the `doSomething()` function, and\
    \ the `doSomething()` function calls the `showMessage()` function. The `showMessage()`\
    \ function uses `alert()` to show a message letting you know what’s going on.\n\
    \nThis process is known as *calling* a function. Here’s what happens when you\
    \ click the **Click Me** button:\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_118_0.png)\n\
    \nIt’s easy to recognize when code is calling a function, because there are always\
    \ a pair of `()` parentheses after the function name. You can’t call the `showMessage()`\
    \ function like this:\n\n```\nshowMessage;    // What does it even mean?\n```\n\
    \nYou call a function whenever you want. You can even call more than one in a\
    \ row:\n\n```\nfunction doSomething() {\n```"
  merge: -1
  pgno: 118
- img_proc: true
  md: "```\nshowMessage();\nshowAnotherMessage();\n}\n```\n\nWhen you call a function,\
    \ JavaScript lets that function do all its work before it carries on. In this\
    \ example, that means JavaScript runs all the code in `showMessage()`, and then\
    \ runs the code in `showAnotherMessage()`.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_119_0.png)\n\
    \nIf calling more than one function in a row isn’t exciting enough, you can also\
    \ make a function that calls another function, which can then call another function,\
    \ and so on. This isn’t as complicated as it sounds. In a well-designed program,\
    \ every function does one separate task, and the function name usually tells you\
    \ what that task is.\n\nImagine you read code like this:\n\n```\nfunction doSomething()\
    \ {\n  checkPassword();\n  saveOrder();\n  goToCheckoutPage();\n}\n```\n\nIt’s\
    \ pretty clear what the `doSomething()` function is accomplishing, even without\
    \ digging in to all the code in the other three functions it calls."
