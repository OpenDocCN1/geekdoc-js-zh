    \n显然，你不能使用 `welcomeMessage` 来存储更长时间的信息，因为该变量只存活几秒钟。在这个例子中这不是问题，因为 `welcomeMessage`\
    \ 从未改变。但还有 *另一种* 方式。\n\n## 全局变量\n\n有时你有一段信息需要保留更长时间，甚至可能只要程序在运行就一直保留。\n\n> **注意**\
