- img_proc: true
  md: "The easiest way to understand how this work is to look at a couple of examples.\
    \ First, consider this code, which has two separate conditions:\n\n```\nif (moneyInWallet\
    \ > 0) {\n    alert(\"You are carrying some money.\");\n}\n\nif (moneyInBank >\
    \ 0) {\n    alert(\"You have money in the bank.\");\n}\n```\n\nThis code has several\
    \ possible outcomes.\n\n+   - If you are totally broke (no money anywhere), you\
    \ won’t see any alert messages.\n- If you have money in both your wallet and the\
    \ bank, you’ll get two messages.\n- If you have money in just one place (wallet\
    \ or bank), you’ll get one message.\n\nBut when you use else if, you can link\
    \ your conditions, like this:\n\n```\nif (moneyInWallet > 0) {\n    alert(\"You\
    \ can buy something!\");\n}\nelse if (moneyInBank > 0) {\n    alert(\"You can\
    \ buy something, if you go to the bank first.\");\n}\nelse {\n    alert(\"Maybe\
    \ ask your parents for some bills?\");\n}\n```\n\nWhen JavaScript runs this code,\
    \ it checks the conditions in order. As soon as it finds a condition that’s true,\
    \ it runs the code in the corresponding block. It then skips over all the other\
    \ else statements, going right to the closing } at the end."
