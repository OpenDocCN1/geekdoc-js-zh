  md: 'There are many different ways to solve this problem. Some are shorter than
    others, and some look more complicated. One option is to use a variable to store
    the result:


    ```

    let result;

    ```


    If it’s a win, you something in result (like the number 1). If it’s a loss, you
    store a different value. After you’ve tried all the different ice, dagger, lava
    combinations, you can check result to decide what to do next.


    The last step is the easier part. If the player won, show a happy win message.
    If not, show something less kind.


    There are lots of ways to make this example even better. Why not use a couple
    of variables to keep track of how many games you win and lose? You can then show
    than information somewhere else on the page, and even use it to calculate a win
    percentage.'
