    counter *=3;

    // (Now counter is 6. You know why.)

    ```


    There''s really nothing special about using a shortcut like += instead of writing

    out a full statement with = and +. But it does let lazy programmers save a few

    keystrokes. You don''t *need* to use it, but you''ll see it in other people''s
    programs.'
