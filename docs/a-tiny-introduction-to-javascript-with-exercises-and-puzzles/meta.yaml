  md: '# The secret of the braces


    I have a confession to make. Earlier, I said that local variables live until the
    function ends. That’s true, but it’s not the whole story.


    Technically, local variables live in the block that contains them. As you might
    remember from Chapter 1, a block is a common structure in JavaScript code. It’s
    any section of code that fits between two braces { }.


    So far, all the braces you’ve seen have been for functions. However, in the upcoming
    chapters you’re going to learn that you also use braces to group together code
    for different reasons. For example, you use braces to repeat code in a loop, or
    make it conditional. If you create a variable inside one of these sections, it
    doesn’t live for the whole function. It only lives until that *block* is finished.


    This will all make more sense when you see examples of the other ways we use braces.
    But here’s a cheat rule that always works—when you create a local variable, it
    will disappear from existence when you reach the next } closing brace.


    # Wise advice about global variables


    The more global variables you use, the more difficult it is to figure out what’s
    going on in your code. Imagine you see a new JavaScript program for the first
    time, and it has a bunch of global variables. How do you know which functions
    use which variables? There’s no way to be sure without reading all the code, and
    that means there’s plenty of room to make a mistake.


    To make your code as simple as possible, and to reduce the chance of making mistakes
    in the future, you should use global variables only when you need them to share
    information.


    Sometimes, you might notice in your program that different functions are using
    the same local variables for the same tasks. For example, maybe you have three'
  merge: -1
