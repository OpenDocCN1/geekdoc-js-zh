    # # Really easy “math” with text


    You obviously can’t add and subtract letters. But JavaScript lets you do something
    just as useful. You can join together two separate strings to make a new one.
    To do that, you use the + operator, just like you do when you’re adding numbers.
    Here’s an example:


    ```

    let firstName = "Elphaba";

    let lastName = "Smith";


    let fullName = firstName + lastName;

    ```


    At the end of the code, the `fullName` variable has the combined text “ElphabaSmith”
    in it. Yep, what you really need there is an extra space. Here’s a better attempt:


    ```

    fullName = firstName + " " + lastName;

    ```


    This joins together three strings: the first name, an extra space, and then the
    last name. The result (“Elphaba Smith”) goes in the `fullName` variable.


    This operation is called string *concatenation*, and it’s useful in plenty of
    situations. For example, you can use it right now to make better, more detailed
    messages for your alert boxes. Here’s an example:


    ```

    let message = "It''s so nice to meet you " + personName;

