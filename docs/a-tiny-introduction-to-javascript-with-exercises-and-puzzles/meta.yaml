  - '[PAGE 12]


    # Why CodePen?


    CodePen is one of several free JavaScript playgrounds that you can use in your
    browser. With CodePen, you can write JavaScript code, test it, and save it for
    later, without needing to set anything up. And all the pieces of your solution—the
    HTML that creates the page, the CSS that makes it look good, and the JavaScript
    that powers it—are brought together in one place. There’s no need to juggle separate
    files.


    This guide uses CodePen for all its exercises. Usually, you’ll start with a project
    that’s already built, and then change it. Maybe you’ll need to make an enhancement
    or fix a problem. And when you’re finished, you can show your work to other people
    just by sending them a link.


    # What if I’m actually an adult?


    Take comfort, it’s not all bad. But if the question is “Can I use this book even
    if I’m not a kid?” then the answer is easy—yes!


    However, this book assumes you’re learning JavaScript and programming for the
    first time. If you already know a bit about programming, you’ll probably prefer
    a guide that focuses on the JavaScript language without re-introducing the concepts
    you already know.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_12_0.png)'
