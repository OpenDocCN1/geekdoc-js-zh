    # The secret of the braces


    I have a confession to make. Earlier, I said that local variables live until the
    function ends. That’s true, but it’s not the whole story.


    Technically, local variables live in the block that contains them. As you might
    remember from Chapter 1, a block is a common structure in JavaScript code. It’s
    any section of code that fits between two braces { }.


    So far, all the braces you’ve seen have been for functions. However, in the upcoming
    chapters you’re going to learn that you also use braces to group together code
    for different reasons. For example, you use braces to repeat code in a loop, or
    make it conditional. If you create a variable inside one of these sections, it
    doesn’t live for the whole function. It only lives until that *block* is finished.


    This will all make more sense when you see examples of the other ways we use braces.
    But here’s a cheat rule that always works—when you create a local variable, it
    will disappear from existence when you reach the next } closing brace.


    # Wise advice about global variables


    The more global variables you use, the more difficult it is to figure out what’s
    going on in your code. Imagine you see a new JavaScript program for the first
    time, and it has a bunch of global variables. How do you know which functions
    use which variables? There’s no way to be sure without reading all the code, and
    that means there’s plenty of room to make a mistake.


    To make your code as simple as possible, and to reduce the chance of making mistakes
    in the future, you should use global variables only when you need them to share
    information.


    Sometimes, you might notice in your program that different functions are using
    the same local variables for the same tasks. For example, maybe you have three'
  - '[PAGE 81]


    functions and each one creates its own local `welcomeMessage` variable. It might
    occur to you that you could replace these three local variables with one global
    `welcomeMessage` variable. Don''t do it! It''s always better to make your functions
    as independent as possible.'
  - '[PAGE 82]


    # # Making Decisions


    So far your programs have been a little short in the brains department. The key
    ingredient they’re missing is the ability to *make decisions*—in other words,
    to evaluate information and then set a course.


    To add this ability, you need to learn a programming concept called *conditional
    logic*. It’s the art of asking questions, and then choosing what to do.


    # ## Introducing conditions


    A condition is a question that has two possible answers: true or false.


    For example, look at this condition with two variables:


    ```

    a > b

    ```


    This condition makes a simple claim: *a is greater than b*. If `a` holds the number
    12, and `b` holds the number 3, this condition is true. But if `a` holds the number
    3, and `b` holds the number 12, this condition is false. (This condition assumes
    that `a` and `b` are numbers. If they aren’t, this condition doesn’t make sense.)


    Here’s another example of a condition:


    ```

    a == b

    ```


    This condition asks *does a equal b*? In this case, it doesn’t matter what type
    of data the variable `a` holds—it could be a number or a piece of text. The important
    part is that the variable `b` has exactly the same content as `a`. So if they
    both hold the same number (like 42) or a matching piece of text (like “blunderstone”),
    the condition is true.'
  - "[PAGE 83]\n\nYou might be wondering why there are two equal signs (==). That’s\
    \ just the way JavaScript works, because it wants to distinguish between = (which\
    \ you use to set a variable) and == (which you use to compare values in a condition).\
    \ Some other programming languages use the ordinary = for both uses.\n\n# The\
    \ if statement\n\nTo get a condition to actually do something, you need to pair\
    \ it with the `if` keyword. Here’s an example:\n\n```\nif (a > b) {\n  // (Do\
    \ something here.)\n}\n```\n\nThe `if` statement tells JavaScript to look at a\
    \ condition and run a piece of code if the condition is true. Here’s how it breaks\
    \ down:\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_83_0.png)"
  - "[PAGE 84]\n\nRemember, a condition can only have two possible outcomes:\n\n+\
    \   - If the condition is true (in this example, a is greater than b), JavaScript\
    \ runs the code between the two braces.\n- If the condition is false (a is less\
    \ than or equal to b), JavaScript skips over the code in the braces and carries\
    \ on.\n\nYou can put as many lines of code as you want in between the braces.\
    \ They all become part of the same conditional block. If you only need a single\
    \ code statement in your conditional block, you can remove the braces. But we\
    \ recommend always keeping the braces to make your code clearer.\n\nCan you tell\
    \ what happens in this next example?\n\n```\nalert(\"Hi\");\n\nif (a == b) {\n\
    \    alert(\"They match\");\n}\n\nalert(\"Bye\");\n```\n\nThe condition in this\
    \ example checks if two variables have the same value. If they do, you'll get\
    \ a sequence of alert boxes (*Hi*, then *They match*, and finally *Bye*). If a\
    \ and b hold different variables, you still get the *Hi* and *Bye* boxes, but\
    \ the code in the if block is skipped.\n\nWhen you write an `if` block, make sure\
    \ to remember the parentheses around your condition, or it won't work. Here's\
    \ a common mistake:\n\n```\n// Where are my parentheses?\nif a == b {\n```"
  - "[PAGE 85]\n\nAnd don't make this mistake:\n\n```\n// This is the wrong equal\
    \ sign.\nif (a = b) {\n```\n\nA single equal sign is only good for *setting* variables.\
    \ So this code actually copies the value from `b` into `a`, which definitely isn't\
    \ what you want.\n\n# More logical operators\n\nThe symbols `<` and `>` and `==`\
    \ are called *logical operators*, because you use them to compare values in a\
    \ condition. They are the most common logical operators, but there are still a\
    \ few more to learn.\n\nInstead of asking if two variables are equal, you can\
    \ ask if they are *not equal*. This is exactly the opposite question. You do this\
    \ by changing the `==` in your condition to `!=`\n\n```\nif (a != b) {\n    alert(\"\
    Nope, no match\");\n}\n```\n\nThis condition asks \"do these variables have different\
    \ values?\" If they do, the condition is true and the alert box appears. Otherwise,\
    \ there's no message.\n\nYou can also use the `>=` (greater than or equal) and\
    \ `<=` (less than or equal) operators, which work like `>` and `<` except they\
