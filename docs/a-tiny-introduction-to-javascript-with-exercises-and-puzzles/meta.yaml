    \ Me** button:\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_118_0.png)\n\nIt’s\
    \ easy to recognize when code is calling a function, because there are always\
    \ a pair of `()` parentheses after the function name. You can’t call the `showMessage()`\
    \ function like this:\n\n```\nshowMessage;    // What does it even mean?\n```\n\
    \nYou call a function whenever you want. You can even call more than one in a\
    \ row:\n\n```\nfunction doSomething() {\n  showMessage();\n  showAnotherMessage();\n\
    }\n```\n\nWhen you call a function, JavaScript lets that function do all its work\
    \ before it carries on. In this example, that means JavaScript runs all the code\
    \ in `showMessage()`, and then runs the code in `showAnotherMessage()`.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_119_0.png)\n\
    \nIf calling more than one function in a row isn’t exciting enough, you can also\
    \ make a function that calls another function, which can then call another function,\
    \ and so on. This isn’t as complicated as it sounds. In a well-designed program,\
    \ every function does one separate task, and the function name usually tells you\
    \ what that task is.\n\nImagine you read code like this:\n\n```\nfunction doSomething()\
    \ {\n  checkPassword();\n  saveOrder();\n  goToCheckoutPage();\n}\n```\n\nIt’s\
    \ pretty clear what the `doSomething()` function is accomplishing, even without\
    \ digging in to all the code in the other three functions it calls.\n\n## Try\
    \ it yourself!\n\n> ▶ Follow the Function Trail (Challenge Level: Easy)\n\nhttps://codepen.io/prosetech/pen/WNrYyYR\n\
    \nIn a real program, you’ll find piles of functions. When the program is running,\
    \ JavaScript jumps from one to another, and you’ll need to be able to follow along.\n\
    \nThis exercise gives you the chance to think like an engine by following a trail\
    \ of function calls. Start by looking at the code (but don’t run it). The program\
    \ has two buttons, and each one calls a different combination of the same functions.\
    \ On a piece of paper, write down the order of messages that you expect to see\
    \ for each button. It’s trickier than it seems, because some functions call other\
    \ functions, and so on. Then, run the program to see if you’re right.\n\nThe point\
    \ of this exercise is just to see how functions work. In real life, your functions\
    \ aren’t one-liners showing messages. But once you know how to call a super-short\
    \ function, you know how to call a longer one, because they work exactly the same.\n\
    \nAlso, checking the assumptions you have about your code is a Programmer Life\
    \ Skill. Often, weird errors happen because your code isn’t doing what you think\
    \ it’s doing.\n\nHere’s a final test you might want to try. What happens if you\
    \ call a function that calls itself? Or if function A() calls B() which then calls\
    \ A()?\n\n## Functions that get data\n\nAs you’ve already seen, every time you\
    \ call a function you put a set of parentheses ( ) after the function name. These\
    \ aren’t just for decoration. They also allow you to send one or more pieces of\
    \ data to a function. Each piece of data is called a *parameter*.\n\nIn order\
    \ for this technique to work, your function must be designed to accept parameters.\
    \ Plenty of functions are. One example is the alert() function that you’ve used\
    \ many times. You send the message you want it to show using a string:\n\n```\n\
    alert(\"Hello from the alert function.\");\n```\n\nTo make a function that accepts\
    \ parameters, you need to declare them. For example, look at this simple no-parameter\
    \ version of the showMessage() function:\n\n```\nfunction showMessage() {\n  \
    \  alert(\"Greetings from the showMessage() function.\");\n}\n```\n\nTo add a\
    \ parameter, you put it in between the parentheses after the function name:\n\n\
    ```\nfunction showMessage(guestName) {\n    alert(\"Greetings from the showMessage()\
    \ function.\");\n}\n```\n\nAdding a parameter is just like defining a variable.\
    \ In fact, the guestName parameter *is* a variable—it’s a container that will\
    \ hold the data that gets sent to the showMessage() function. The only difference\
    \ is that you don’t use the let keyword.\n\nNow, when you call showMessage() somewhere\
    \ else in your program, you can supply the guestName data:\n\n```\nfunction doSomething()\
    \ {\n    showMessage(\"Alexa\");\n}\n```\n\nThis example sends a string containing\
    \ “Alexa” to showMessage(). If you have a variable that holds a string, that’s\
    \ just as good:\n\n```\nfunction doSomething() {\n  let name = \"Alexa\";\n  showMessage(name);\n\
    }\n```\n\nOf course, you need to know what type of data the function wants. Is\
    \ it a number? A string? Are there values that aren't allowed? This is a topic\
    \ that gets much more important when you start making bigger programs and working\
    \ with other programmers. Often you can put comments before the function declaration\
    \ to explain these details. But that's a conversation for a later time.\n\nThere's\
    \ still something missing in this example. Right now, the doSomething() function\
    \ sends the string to the showMessage() function, which successfully receives\
    \ it and puts it in the guestName variable. But the showMessage() function doesn't\
    \ actually use this bit of information. That's easy to change:\n\n```\n// showMessage()\
    \ shows a personalized message in an alert box.\n// guestName is the name of the\
    \ person using the program.\nfunction showMessage(guestName) {\n  alert(\"Greetings,\
    \ \" + guestName +\n    \", from the showMessage() function.\");\n}\n```\n\nNow,\
    \ if you call this slightly enhanced function with the name “Alexa” you'll get\
    \ the message “Greetings, Alexa, from the showMessage() function.”\n\n## Using\
    \ multiple parameters\n\nThe trusty alert() function takes just a single parameter,\
    \ and so does the revised showMessage() function you just saw. But if you want\
    \ to make a function that has two parameters, it's easy. You just need to add\
    \ two parameter names and separate them with a comma:\n\n```\nfunction showMessage(firstName,\
    \ lastName) {\n  alert(\"Hello Dr. \" + lastName + \". Can I call you \" +\n \
    \   firstName + \"?\");\n}\n```\n\nNow when you call this version of the `showMessage()`\
    \ function, you supply two pieces of information:\n\n```\nshowMessage(\"Alexa\"\
    , \"Chen\");\n```\n\nWhat message will the `showMessage()` function show?\n\n\
    You can keep adding as many commas and parameters as you want. Just remember that\
    \ order is important. The order that you list your parameters in the function\
    \ declaration is the same order you need to follow when you call the function.\n\
    \n```\nshowMessage(\"Alexa\", \"Chen\");\n\nfunction showMessage(firstName, lastName)\
    \ {\n  alert(\"Hello Dr. \" + lastName + \". Can I call you \" + firstName + \"\
    ?\");\n}\n```\n\n## Try it yourself!\n\n▶ Alien Language Translator (Challenge\
    \ Level: Medium)\n\nhttps://codepen.io/prosetech/pen/rNLQmgw\n\nA new alien race\
    \ has arrived on planet Earth. They appear to be friendly, but understanding each\
    \ other is difficult. You think you can make yourself understood, but you’re going\
    \ to need a JavaScript function to help you communicate.\n\n## PLEASE SPEAK TO\
    \ ME IN MY LANGUAGE\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_124_0.png)\n\n\
    Message to translate: [This is a test message.]\n\n[Translate the Message]\n\n\
    Your first job is to translate an ordinary string of text into alien language.\
    \ You type your message into the text box. Then, when you click the button, it’s\
    \ time to translate it.\n\nRight now, clicking the button calls the speakToAlien()\
    \ function, which doesn’t do anything (because there’s no code in it). Your job\
    \ is to get the text out of the text box, and then translate it.\n\nGetting the\
    \ text is easy, if you remember how. First, check the HTML to find out what id\
    \ the text box uses (in this example, it’s message). Then, create a variable and\
    \ use the trusty document.getElementById() function, like this:\n\n```\nlet messageToTranslate;\n\
    messageToTranslate = document.getElementById(\"message\").value;\n```\n\nOnce\
    \ you have the text, you need to convert it to alien language. But you don’t need\
    \ to translate it on your own. Instead, there’s *another*, already written function\
    \ in this page called convertEnglishToAlien() that can do the job."
