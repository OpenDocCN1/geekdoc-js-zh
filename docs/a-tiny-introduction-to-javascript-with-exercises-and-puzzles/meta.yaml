  - '[PAGE 24]


    Chapter 1


    # What JavaScript Looks Like


    You''re about to spend a lot of time looking at code. To help you find your way
    around, you need to get more familiar with the way JavaScript code is written.


    These arcane rules are known to JavaScript wizards as *syntax*. Once you know
    some of the rules of JavaScript syntax, code will start looking a lot more like
    magic instructions and a lot less like complete gibberish.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_0.png)


    # Statements


    When you look at a chunk of JavaScript code, you''ll see a sequence of *statements*—basically,
    commands that tell your web browser to do something. Here''s one now:


    ```

    alert("Hi there!");

    ```


    The alert() command is simple. It shows a small pop-up window with whatever message
    you want. (You put the message—like *Hi there!*—in quotation marks.) An alert
    box isn''t the most polite way to get attention, but it works.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_1.png)'
  - "[PAGE 25]\n\nIf you're completely new to JavaScript, you won't understand exactly\
    \ how this command works, and that's OK. But you should notice that this command\
    \ has a semicolon ( ; ) at the end. Although semicolons aren't absolutely required\
    \ in JavaScript, serious programmers always use them. They show where each code\
    \ statement stops.\n\nIf you run out of room to comfortably fit a statement on\
    \ one line, you can split it pretty much wherever you want, as long as you remember\
    \ to end with the semicolon. Here's an example that shows the same message as\
    \ before, but now puts the statement on two lines:\n\n```\nalert(\n\"Hi there!\"\
    );\n```\n\nYou can also add spaces to arrange your code:\n\n```\nalert(\n    \"\
    Hi there!\");\n```\n\nIt's still the same command. JavaScript ignores extra spaces,\
    \ just like it ignores line breaks.\n\nOf course, you can't do much with just\
    \ one statement. Even a small program has a series of statements, one after the\
    \ other. When a piece of JavaScript code is running, the browser goes through\
    \ the statements one by one, triggering each command in order."
  - '[PAGE 26]


    # Comments


    Statements that start with two forward slashes // are comments. JavaScript ignores
    all comments.


    ```

    // I don''t do anything at all!

    ```


    You can add comments wherever you want. Often, you use a comment to explain what''s
    about to happen in the next code statement:


    ```

    // Show a message.

    alert("Hi there!");

    ```


    You can also use comments to point out an important section of code. Many of the
    tutorials in this guide have comments that tell you where to pay attention or
    what you need to change:


    ```

    // This is where things go wrong.

    ```


    You can also put the comment slashes in front of a code statement to temporarily
    turn it off. For example, this alert() command won''t do anything because it''s
    been changed into a comment:


    ```

    //alert("Hi there!");

    ```


    This trick is called *commenting out* code. You might use it instead of deleting
    a line of code if you think you''ll need the code later.


    > **TIP** In CodePen (and most other code editors), comments are shown in a different
    color than statements. That makes it easier to spot the code.'
  - "[PAGE 27]\n\n# # Blocks and functions\n\nJavaScript uses curly brackets, called\
    \ *braces*, to group together sections of code that have one or more statements.\
    \ Each section starts with an opening brace:\n\n```\n{\n```\n\nAnd ends with a\
    \ closing brace:\n\n```\n}\n```\n\n(If you're hunting for these symbols on the\
    \ keyboard, you can usually get them by holding down **Shift** and typing the\
    \ square **[ ]** brackets, which are just to the right of the **P** key.)\n\n\
    As you learn JavaScript, you'll see these braces used in different places. The\
    \ first place you'll see them is in *functions*. You can think of a function as\
    \ a small section of code that does one task. You can recognize a function because\
    \ it starts with the word `function`. Here's a simple example:\n\n```\nfunction\
    \ showMessage() {\n    alert(\"Hi there!\");\n}\n```\n\nEvery function has a name,\
    \ which appears after the word `function` and before the parentheses (). The person\
    \ who creates the function chooses the name. This function is named `showMessage`,\
    \ and it contains just one statement."
  - "[PAGE 28]\n\nHere's a slightly longer version of the showMessage() function.\
    \ It holds two comments and two statements:\n\n```\nfunction showMessage() {\n\
    \  // Show the first message.\n  alert(\"Hi there!\");\n\n  // After you click\
    \ OK, you get to see this bonus message.\n  alert(\"It's me again!\");\n}\n```\n\
    \nHere's exactly what happens when the code in this function runs:\n\n+   1. JavaScript\
    \ skips over the first comment (`// Show the first ...`)\n2. The alert() function\
    \ shows the first message in an alert box.\n3. Now the code stops. It's waiting\
    \ for someone to close the alert box.\n4. When you click **OK**, JavaScript carries\
    \ on.\n5. JavaScript skips over the second comment (`// After you click ...`)\n\
    6. The alert() function shows the second message.\n7. When you click **OK**, JavaScript\
    \ carries on and the function ends. That's all for now.\n\nThere are a few other\
    \ details you might notice here. For example, every line in this function is indented\
    \ with two empty spaces. These spaces are totally optional, but it's one of the\
    \ many ways that people make code easier to read and understand. And making code\
    \ easier to understand becomes a Very Big Deal as your programs get more complex.\n\
    \n> **NOTE** For now, every code statement you write belongs inside a function.\
    \ Don't put code above a function block, after a function block, or between two\
    \ function blocks. (You can put comments there, though.)"
- md: "## Try it yourself!\n\n> ▶ Hello, Wizard? (Challenge Level: Easy)\n\n[https://codepen.io/prosetech/pen/wvMjPbM](https://codepen.io/prosetech/pen/wvMjPbM)\n\
    \nIt’s a common tradition to start learning a new programming language with something\
    \ called a *Hello World* program. All a *Hello World* program does is display\
    \ a message. It proves that your code is working—and that’s it.\n\nThe *Hello,\
    \ Wizard?* example is a slight variation on this idea. Right now, it shows a rather\
    \ unpleasant message when you click the **Greet Me** button.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_29_0.png)\n\
    \nHere’s what you need to do to correct it:\n\n- Find the `showMessage()` function.\
    \ That’s the code that runs when you click the button. It’s also the only code\
    \ in this example.\n- Deactivate the rude message by adding the comment slashes\
    \ `//` in the right place. In other words, you’re going to turn the bad `alert()`\
    \ command into a harmless comment.\n- Find the friendly message that's in the\
    \ code. Right now it's commented out, so JavaScript ignores it. Remove the comment\
    \ slashes to bring it back to life.\n\n> TIP Remember, you can change the size\
    \ of the JavaScript box in CodePen so you can see your code more easily. Just\
    \ click the left edge of the JavaScript box and drag it over more to the left.\
    \ When the JavaScript box is small, CodePen wraps long code statements and long\
    \ comments over multiple lines.\n\n## Optional Really big comments\n\nJavaScript\
    \ has another type of comment, called a *multiline comment*. It starts with `/*`\
    \ and has `*/` at the end. These comment markers have a special power. You can\
    \ put them as far apart as you want. Everything in between becomes part of one\
    \ massive comment.\n\n```\n/* Everything\nin between\nthe start and\nthe end marker\n\
    is part of one large comment.\n*/\n```\n\nMultiline comments are useful if you\
    \ want to temporarily deactivate a big section of code, or if you have a lot of\
    \ information you want to write about your program in one place.\n\nTo try out\
    \ a multiline comment, go back to the *Hello, Wizard!* example and remove the\
    \ comment slashes (`//`) in front of both `alert()` statements. Now, using just\
    \ one `/*` marker and one `*/` marker, disable both alert boxes. You'll know you\
    \ were successful if you click the button and nothing happens. Remember, CodePen\
    \ changes the text color so you can see where your comments are!\n\n## Chapter\
    \ 2\n\n## How Events Work\n\nOne of the tricky things about learning JavaScript\
    \ is that it's all tied up with web pages. In order to get even the simplest program\
    \ to run, you need to know a bit about HTML and how an HTML element can trigger\
    \ something called an *event*. Let's investigate.\n\n## A really quick HTML review\n\
    \nIf you know HTML, you know that every web page is made out of elements. For\
    \ example, the `<p>` element is for paragraphs, the `<img>` element is for pictures,\
    \ the `<h1>` element is for big headings, the `<button>` element is for buttons,\
    \ and so on.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_32_0.png)\n\nWhen you\
    \ write a web page, all these elements seem like ordinary pieces of your web page\
    \ that never change. But in the eyes of JavaScript, they’re a lot more interesting.\
    \ Each element pays attention to what you’re doing. If you move your mouse over\
    \ a picture, click a button, or start typing in a text box, JavaScript notices.\n\
    \nThis is where events come into the picture.\n\n## How events work\n\nJavaScript\
    \ uses events to tell your code when something happens. For example, if you want\
    \ to know when someone clicks a button, you can pay attention to an event JavaScript\
    \ calls `onclick`.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_33_0.png)\n\nIn\
    \ other words, events are the glue that connects HTML elements to your code. So\
    \ how do you use them? You need to have three ingredients:\n\n1. You need to have\
    \ an element that *triggers* the event. For example, if you want your code to\
    \ run when someone clicks a button, you need a `<button>` element.\n2. The code\
    \ you want to run needs to be in a function, like the `showMessage()` function\
    \ you saw earlier.\n3. You need to connect the element to the function. You do\
    \ this by adding a special event attribute to your element. That’s the secret\
    \ sauce.\n\nFor example, imagine you have a button like this in your HTML:\n\n\
    ```\n<button>Click Me</button>\n```\n\nThis is an ordinary button that says \"\
    Click Me\" on it.\n\nYou want it to do something. So you write a JavaScript function\
    \ that has some code, like this:\n\n```\nfunction showMessage() {\n  alert(\"\
    You clicked me.\");\n}\n```\n\nNow you connect the two pieces together. If you\
    \ want to pay attention to the onclick event, you add an onclick attribute to\
    \ the button, like so:\n\n```\n<button onclick>Click Me</button>\n```\n\nBut that's\
    \ still not enough! You also need to tell JavaScript which function to run. So\
    \ if your function is named showMessage(), you write this:\n\n```\n<button onclick=\"\
    showMessage()\">Click Me</button>\n```\n\nHere's the computereese-to-human-language\
    \ translation of what this tells JavaScript: \"Pay attention to the onclick event.\
    \ When it happens, run the code in the showMessage function.\"\n\n> **NOTE** This\
    \ part needs to be perfect. You need to match the spelling and capitalization\
    \ of your function name exactly, and you need to include the empty set of parentheses\
    \ after the function name. (That's your way of telling JavaScript \"this here\
    \ is a function.\")\n\n## Try it yourself!\n\n▶ **The Staggering Page of Heartbreaking\
    \ Events (Challenge Level: Easy)**\n\nhttps://codepen.io/prosetech/pen/eYZZarw\n\
    \nThe *Staggering Page of Heartbreaking Events* has a single button. Click it,\
    \ and something should happen.\n\nOnly right now, nothing does. The code you need\
    \ is there, in a function named `doThatThing()`. The problem is that the button\
    \ isn’t connected. Can you fix it using the skills you picked up in this lesson?\
    \ If you get it right, you’ll see a message when you click the button.\n\n> **HINT**\
    \ To connect your button, you need to add the `onclick` attribute to the `<button>`\
    \ element, and you need to set it to the `doThatThing()` function.\n\nGive it\
    \ a try. Is it exciting? Not really! But once you have this basic setup, it opens\
    \ a lot of new doorways for your exploration. One challenge you can try is to\
    \ make it so that clicking the `<h1>` element (the heading) triggers the code\
    \ that shows the alert box. To do this, you need to add the `onclick` event to\
    \ the `<h1>` element instead of the `<button>` element.\n\n## Try it yourself!\n\
    \n▶ **The Broken Button (Challenge Level: Easy)**\n\n[https://codepen.io/prosetech/pen/xxVVNBV](https://codepen.io/prosetech/pen/xxVVNBV)\n\
    \nThe *Broken Button* gives you a slightly different version of the button event\
    \ challenge. The **Click Me** button in this example is wired up to the doSomethingAmazing()\
    \ function, but something’s wrong. When you click the button, nothing happens.\
    \ CodePen doesn’t even show a tiny red error icon to tell you there’s a problem.\
    \ What went wrong?\n\nTake a moment to investigate the web page HTML and the JavaScript\
    \ code. Remember that computers don’t tolerate small mistakes. If you still can’t\
    \ find the problem, read on for the answer.\n\nThe mistake is in the HTML. The\
    \ `onclick` attribute is there, and the function name is correct. But it’s missing\
    \ the parentheses after the function name. Without that, JavaScript won’t recognize\
    \ that you're trying to use a function.\n\nWhen you’re making a program (in JavaScript\
    \ or any programming language), even a minor typo makes the difference between\
    \ working code and broken code. If there’s a mistake in your JavaScript, the web\
    \ browser quietly gives up as soon as it reaches the problem. Programming problems\
    \ are often easy to fix—the trouble is finding them.\n\n## Chapter 3\n\n## Storing\
    \ Information in Variables\n\nEvery program—small or big—needs to keep track of\
    \ information. What’s the user’s name? What’s the price of those socks you’re\
    \ selling? How many zombies are attacking the player every minute?\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_38_0.png)\n\
    \nTo store a piece of information, you use a *variable*.\n\n## Declaring a variable\n\
    \nA variable is a container with a name. You get to pick the name when you create\
    \ the variable. This is called *declaring* the variable. Once you’ve declared\
    \ it, you can put what you want inside it.\n\nThe simplest way to declare a variable\
    \ is with JavaScript’s `let` keyword, like this:\n\n```\nlet NumberOfZombies;\n\
    ```\n\nThis creates a variable called `NumberOfZombies`. Notice that you can’t\
    \ put spaces in a variable name, but you can use capital letters to make a variable\
    \ name *look* like it has more than one word in it. Just remember that JavaScript\
    \ pays attention to capitalization, so `NumberOfZombies` and `numberOfZombies`\
    \ are actually two completely different names. That also means they’re two completely\
    \ separate containers for storing information."
  mdcn: "\n## 亲手试试！\n\n> ▶ 你好，巫师？（挑战等级：简单）\n\n[https://codepen.io/prosetech/pen/wvMjPbM](https://codepen.io/prosetech/pen/wvMjPbM)\n\
    \n以所谓的 *Hello World* 程序开始学习一门新的编程语言是常见的传统。*Hello World* 程序所做的事情就是显示一条消息。它证明了你的代码在运行——仅此而已。\n\
    \n*你好，巫师？* 这个例子是这个想法的一个小变体。目前，当你点击 **向我问好** 按钮时，它会显示一条相当不友好的消息。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_29_0.png)\n\
    \n你需要做以下事情来纠正它：\n\n- 找到 `showMessage()` 函数。这就是当你点击按钮时运行的代码。它也是这个例子中唯一的代码。\n- 在正确的位置添加注释斜杠\
    \ `//` 来禁用那条粗鲁的消息。换句话说，你要将那个糟糕的 `alert()` 命令变成一个无害的注释。\n- 找到代码中那条友好的消息。目前它被注释掉了，所以\
    \ JavaScript 忽略了它。移除注释斜杠来让它重新生效。\n\n> 提示 记住，你可以在 CodePen 中调整 JavaScript 框的大小，以便更容易地查看你的代码。只需点击\
    \ JavaScript 框的左边缘并向左拖动即可。当 JavaScript 框较小时，CodePen 会将长代码语句和长注释换行显示。\n\n## 可选\
    \ 真正长的注释\n\nJavaScript 还有另一种类型的注释，称为 *多行注释*。它以 `/*` 开始，以 `*/` 结束。这些注释标记有一种特殊的能力。你可以将它们放在任意远的位置。它们之间的所有内容都成为一个巨大注释的一部分。\n\
    \n```\n/* 在开始和结束标记之间的一切都属于一个大注释。\n*/\n```\n\n如果你想要临时禁用一大段代码，或者你想在一个地方写下大量关于程序的信息，多行注释就非常有用。\n\
    \n要尝试多行注释，回到 *你好，巫师！* 例子，并移除两个 `alert()` 语句前的注释斜杠（`//`）。现在，只用一个 `/*` 标记和一个 `*/`\
    \ 标记来禁用两个警告框。如果你点击按钮什么也没发生，你就知道你成功了。记住，CodePen 会改变文本颜色，这样你就能看到你的注释在哪里了！\n\n##\
    \ 第 2 章\n\n## 事件如何工作\n\n学习 JavaScript 的棘手之处之一在于它完全与网页绑定在一起。即使要让最简单的程序运行，你也需要了解一些\
    \ HTML 以及 HTML 元素如何触发所谓的 *事件*。让我们来研究一下。\n\n## 极简 HTML 复习\n\n如果你了解 HTML，你就知道每个网页都是由元素组成的。例如，`<p>`\
    \ 元素用于段落，`<img>` 元素用于图片，`<h1>` 元素用于大标题，`<button>` 元素用于按钮，等等。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_32_0.png)\n\
    \n当你编写网页时，所有这些元素似乎都是你网页中永不改变的普通部分。但在 JavaScript 的眼中，它们要有趣得多。每个元素都在关注你正在做的事情。如果你将鼠标移到图片上，点击一个按钮，或者开始在文本框中输入，JavaScript\
