  md: '+   Find the friendly message that''s in the code. Right now it''s commented
    out, so JavaScript ignores it. Remove the comment slashes to bring it back to
    life.


    > TIP Remember, you can change the size of the JavaScript box in CodePen so you
    can see your code more easily. Just click the left edge of the JavaScript box
    and drag it over more to the left. When the JavaScript box is small, CodePen wraps
    long code statements and long comments over multiple lines.


    # Optional Really big comments


    JavaScript has another type of comment, called a *multiline comment*. It starts
    with `/*` and has `*/` at the end. These comment markers have a special power.
    You can put them as far apart as you want. Everything in between becomes part
    of one massive comment.


    ```

    /* Everything

    in between

    the start and

    the end marker

    is part of one large comment.

    */

    ```


    Multiline comments are useful if you want to temporarily deactivate a big section
    of code, or if you have a lot of information you want to write about your program
    in one place.


    To try out a multiline comment, go back to the *Hello, Wizard!* example and remove
    the comment slashes (`//`) in front of both `alert()` statements. Now, using just
    one `/*` marker and one `*/` marker, disable both alert boxes. You''ll know you
    were successful if you click the button and nothing happens. Remember, CodePen
    changes the text color so you can see where your comments are!'
