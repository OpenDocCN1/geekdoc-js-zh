- img_proc: true
  md: "Your next challenge is to revisit the ordinary loop you saw in the previous\
    \ exercise, and switch it around. Make it count down from 10. However, make sure\
    \ you see the same number of alert boxes as you did before. (Obviously, the order\
    \ of the alert boxes is going to be reversed.)\n\nThere's more than one way to\
    \ solve this problem, but all the solutions are similar.\n\n> **HINT** There are\
    \ two changes you need to make a count-down loop. You need to change the statement\
    \ that changes the counter. Instead of increasing it by 1, you need to *reduce*\
    \ it by 1. You also need to change your condition so that it keeps going while\
    \ the counter is above 0.\n\n# Putting the condition at the end\n\nMost programming\
    \ languages have more than one type of loop, and JavaScript is no exception. You've\
    \ just learned about the `while` loop, which makes this the perfect time to tell\
    \ you about the very similar, but slightly rearranged, `do while` loop.\n\nHere's\
    \ the `do while` version of the 1-to-10 counting loop you saw before:\n\n```\n\
    let counter = 0;\n\ndo {\n    counter = counter + 1;\n    alert(counter);\n} while\
    \ (counter < 10);\n```\n\nAs you can see, the `do while` loop puts the condition\
    \ at the *end* of the loop. It also adds a semicolon (;) after the condition,\
    \ which is another weird detail you just need to remember."
  merge: -1
  pgno: 108
- img_proc: true
  md: "Although the `do while` loop looks a little different than the earlier example,\
    \ it has the same effect. That probably makes you wonder—why is there another\
    \ way to code the same loop? The answer is that sometimes the `do while` loop\
    \ *does* have a different result than the `while` loop. Here’s why.\n\nWhen you\
    \ use `do while`, JavaScript runs your code and checks the condition *at the end*\
    \ of each loop. That means that no matter what condition you use, your loop code\
    \ runs at least once. Compare that to the ordinary `while` loop, which checks\
    \ its condition up front. If the condition starts out false, the `while` loop\
    \ skips over the loop completely. It doesn’t even run it once.\n\nHere’s a demonstration\
    \ of the difference:\n\n```\nlet data = 0;\n\nwhile (data == 1) {\n  // This code\
    \ never runs, because\n  // the condition starts out false.\n}\n\ndo {\n  // This\
    \ code runs one time, even though\n  // the condition is false.\n} while (data\
    \ == 1);\n```\n\nThe difference is easy to see—but what’s the point?\n\nIt turns\
    \ out that sometimes it’s more convenient to use the `do while` structure in loops\
    \ that don’t have counters. You’ll see an example in the Million Dollar Pizza\
    \ exercise later in this chapter."
  merge: -1
