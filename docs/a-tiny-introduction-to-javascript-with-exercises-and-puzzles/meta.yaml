    Here’s a quick review of all the logical operators, with an example for each one:


    | Operator | Name | Example Condition | Result When a=10 |

    | :--- | :--- | :--- | :--- |

    | == | Equal to | (a == 10) | true |

    | != | Not equal to | (a != 10) | false |

    | < | Less than | (a < 10) | false |

    | <= | Less than or equal | (a <= 10) | true |

    | > | Greater than | (a > 10) | false |

    | >= | Greater than or equal | (a >= 10) | true |

    | === | Equal in value and type (so no variable conversion allowed) | (a === "10")
    | false |

    | !== | Not the same value or not the same type | (a !== "10") | true |


    The `===` and `!==` are two more specialized operators. They’re included to give
    you the complete list, but you won’t use them anytime soon.


    > **NOTE** You already know that <= is a combination of < and = that means *less
    than or equal*. You might think you could write it the other way around, with
    the equal sign first, like =<. But JavaScript doesn’t recognize it that way, and
    you’ll get an error if you try.'
