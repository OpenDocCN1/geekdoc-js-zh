  md: '# # The wacky mistake JavaScript makes with decimals


    It’s time for some bad news. Computers have a weird way of dealing with decimal
    values.


    You already learned that JavaScript numbers are very flexible. You can use a number
    variable to store an integer (like -342) or something bigger (like 8093411059)
    or more precise (like 0.00000345908). This is called a *floating point* number,
    because the decimal “floats” around to make numbers as big or small as you need.


    Computers have quick and efficient ways to store floating point numbers and perform
    calculations with them. However, there’s a catch. Certain decimal values aren’t
    stored with perfect precision. As a result, you can get bizarre rounding errors
    in your calculations. The rounding errors are very tiny, but they can still make
    a mess.


    To see the problem, try the Dime Adder example at [https://codepen.io/prosetech/pen/JjGVBVa](https://codepen.io/prosetech/pen/JjGVBVa).
    Each time you click, it adds $0.10 to a running total that’s shown in the page.
    This works for the first couple of clicks, but when you expect to get to $0.30,
    you’ll instead get the number 0.30000000000000004. Add some more dimes, and things
    go back to normal—until you’ll reach 0.7999999999999999 when you should have $0.80
    cents. Clearly something is wrong.


    **Your change purse holds: $0.30000000000000004**


    [Add a Dime]


    The problem is that some decimal values can’t be translated exactly into floating
    point numbers. (It’s similar to the problem you face if you try to write 1/3 as
    a decimal value. You can write 0.33333 with as many 3s as fit on your sheet of
    paper, but it’s still not a perfect representation of a third.)'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'This problem isn’t just with JavaScript. It happens with floating point numbers
    in every programming language. The difference is that some languages have decimal
    data types that are designed to avoid this problem. JavaScript doesn’t, so it’s
    up to you to correct the mistake.


    How do you fix it? If you’re writing a program that uses scientific calculations
    with lots of decimal places, there’s no need to change anything. But if you’re
    writing a program that uses exact amounts of money, it’s confusing to see tiny
    fractions of a penny.


    There are two solutions. You could use rounding, which you’ll learn how to do
    in a moment. That way you can snip off any extra decimal bit that doesn’t make
    sense. But an easier approach is to avoid having decimal values at all. So instead
    of keeping track of an amount of dollars (like $4.30), count the total number
    of cents (like 430).


