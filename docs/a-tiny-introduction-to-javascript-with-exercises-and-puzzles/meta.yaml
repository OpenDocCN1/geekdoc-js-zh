    Here’s what you need to do to correct it:


    +   - Find the `showMessage()` function. That’s the code that runs when you click
    the button. It’s also the only code in this example.

    - Deactivate the rude message by adding the comment slashes `//` in the right
    place. In other words, you’re going to turn the bad `alert()` command into a harmless
    comment.'
