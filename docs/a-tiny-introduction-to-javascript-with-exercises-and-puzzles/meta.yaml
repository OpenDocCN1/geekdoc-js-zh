    # Chapter 12


    # Getting More Serious with Math


    You already know how to do basic calculations with numbers, like addition and
    subtraction. But as your programs get more ambitious, you''ll need more math skills.


    For example, if your code works with decimal values, you need to know how to round
    them to the right size before you show them in a page. Or maybe you want to perform
    calculations with exponents and square roots, use trigonometric identities (like
    sine, cosine, and tangent), or use the mathematical constant pi (π). JavaScript
    has built-in features for all of this mathematical wizardry.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_132_0.png)


    # Math shortcuts


    One of the most common mathematical operations in a program is changing a variable.
    Here’s an example:


    ```

    counter = counter + 1;

    ```


    As you can probably tell, this statement takes the counter variable, adds 1, and
    assigns that as the new counter variable.


    This sort of operation is so popular that JavaScript gives you a shortcut with
    the += operator:


    ```

    counter += 1;

    ```


    Did you catch that? The += operator tells JavaScript to take the variable on the
    right side of your statement (in this example, that''s 1), and add it to whatever
    variable is on the left.'
  - '[PAGE 133]


    This trick also works if you want to paste a bit of text onto the end of a string:


    ```

    let message = "Let''s eat";

    message += "  some panckes";


    // Now message holds the text "Let''s eat some pancakes."

    ```


    JavaScript has similar shortcuts for subtraction, multiplication, and division.

    They all work the same, but the + part of the += operator is replaced with the
    type

    of mathematical operation you want to do:


    ```

    let counter = 12;


    counter -= 2;

    // (Now counter =12-2, which is 10.)


    counter /= 5;

    // (Now counter =10/5, which is 2.)


    counter *=3;

    // (Now counter is 6. You know why.)

    ```


    There''s really nothing special about using a shortcut like += instead of writing

    out a full statement with = and +. But it does let lazy programmers save a few

    keystrokes. You don''t *need* to use it, but you''ll see it in other people''s
    programs.'
