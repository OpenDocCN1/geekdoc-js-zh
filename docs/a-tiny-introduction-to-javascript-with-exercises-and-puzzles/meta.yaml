  mdcn: "\n# JavaScript入门小课堂：包含练习与谜题（以及忍者）\n\n作者：马修·麦克唐纳\n\n版权所有 © 2020 马修·麦克唐纳。保留所有权利。\n\
    \n未经出版商明确书面许可，不得以任何方式复制或使用本书的任何部分。\n\n由ProseTech出版公司出版，位于加拿大多伦多省安大略省\n\n了解更多关于我们的出版项目，请访问\
    \ [http://prosetech.com](http://prosetech.com)\n\n如需联系作者，请发送邮件至 [matthew@prosetech.com](mailto:matthew@prosetech.com)\n\
    \n2020年11月：第一版\n\nISBN-13: 978-1-7753737-6-6\n\n## 目录\n\n- 欢迎\n- 本指南使用条件\n- 为何选择JavaScript？\n\
    - 为何使用CodePen？\n- 如果我真的是成年人怎么办？\n- 关于我\n- 如何支持“入门小课堂”项目？\n- 第零章：CodePen——你的新家\n\
    \  - 在CodePen上注册\n  - 查看CodePen上的示例\n  - 隐藏CSS\n  - 查看更大的预览\n  - 分叉示例\n  - 开启自动补全\n\
    \  - CodePen之后学什么\n- 第一章：JavaScript长什么样\n  - 语句\n  - 注释\n  - 代码块与函数\n  - 动手试试！你好，巫师\n\
    \  - 可选阅读：超大号注释\n- 第二章：事件是如何工作的\n  - HTML快速回顾\n  - 事件的工作原理\n  - 动手试试！令人心碎的震撼事件页面\n\
    \  - 动手试试！坏掉的按钮\n- 第三章：在变量中存储信息\n  - 声明变量\n  - 给变量赋值\n  - 使用数字与文本\n  - 动手试试！预测未来\n\
    \  - 可选阅读：在字符串中插入引号\n  - 好的变量命名\n  - 动手试试！你好，忍者\n  - 不存在的变量\n  - 动手试试！找出冒名顶替者\n\
    \  - 可选阅读：使用TypeScript进行错误检查\n  - 复制变量\n  - 动手试试！礼物交换机\n- 第四章：改变变量\n  - 简单的数学运算\n\
    \  - 稍复杂的数学运算\n  - 动手试试！袖珍计算器\n  - 使用变量进行计算\n  - 动手试试！袖珍计算器 II\n  - 计算无处不在\n \
    \ - 超简单的文本“数学”\n  - 混合数字与文本\n  - 动手试试！坚不可摧的爱丽丝\n  - 可选阅读：永不改变的变量\n- 第五章：与页面交互\n\
    \  - 认识DOM\n  - 从文本框中获取信息\n  - 动手试试！国王的问候\n  - 将字符串转换为数字\n  - 动手试试！坏掉的加法器\n  -\
    \ 在页面中显示消息\n  - 动手试试！国王的问候 重启版\n  - 可选阅读：更换图片\n- 第六章：变量的生命周期\n  - 局部变量\n  - 全局变量\n\
    \  - 在不同函数间共享同一变量\n  - 动手试试！友善的愤怒食人魔\n  - 动手试试！坏掉的糖果豆计数器\n  - 花括号的秘密\n  - 关于全局变量的明智建议\n\
    - 第七章：做出决策\n  - 认识条件\n  - if语句\n  - 更多逻辑运算符\n  - 动手试试！一碗豆子\n  - else代码块\n  - 动手试试！改良版一碗豆子\n\
    \  - 具有无限可能的条件逻辑\n  - 动手试试！预测未来\n"
