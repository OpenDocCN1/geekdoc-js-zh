    \n```\nfunction doSomething() {\n  let name = \"Alexa\";\n  showMessage(name);\n\
    }\n```\n\n当然，你需要知道函数需要什么类型的数据。是数字吗？字符串吗？是否有不允许的值？这是一个在你开始制作更大的程序和与其他程序员合作时变得更加重要的话题。通常，你可以在函数声明之前添加注释来解释这些细节。但那是以后的话题。\n\
    \n这个例子中还缺少一些东西。现在，doSomething()函数将字符串发送给showMessage()函数，后者成功接收并将其放入guestName变量中。但showMessage()函数并没有真正使用这段信息。这很容易改变：\n\
    \n```\n// showMessage() 在警告框中显示一条个性化的消息。\n// guestName 是使用程序的人的姓名。\nfunction showMessage(guestName)\
    \ {\n  alert(\"Greetings, \" + guestName +\n    \", from the showMessage() function.\"\
    );\n}\n```\n\n现在，如果你用名字“Alexa”调用这个增强后的函数，你会得到消息“Greetings, Alexa, from the showMessage()\
    \ function.”\n\n## 使用多个参数\n\n可靠的alert()函数只接受一个参数，你刚刚看到的修改版showMessage()函数也是如此。但如果你想制作一个有两个参数的函数，这很容易。你只需要添加两个参数名，并用逗号分隔它们：\n\
    \n```\nfunction showMessage(firstName, lastName) {\n  alert(\"Hello Dr. \" + lastName\
    \ + \". Can I call you \" +\n    firstName + \"?\");\n}\n```\n\n现在当你调用这个版本的`showMessage()`函数时，你需要提供两段信息：\n\
