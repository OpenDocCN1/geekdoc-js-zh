    \ *友好的愤怒食人魔*。\n\n# 第六章：变量的生命周期\n\n创建一个变量并立即使用它很容易。但如果你想创建一个变量，向其中放入一些内容，并确保在下一次有人点击按钮时它仍然存在呢？\n\
    \n保持变量存活是编程中的一项重要技术。想象一下，如果你试图构建一个游戏，但每次点击按钮时所有变量都会重置自己！但在你能够控制变量并长期存储信息之前，你需要更多地了解它们如何存在……以及何时消亡。\n\
    \n## 局部变量\n\n当你在函数内部定义一个变量时，它被称为 *局部变量*。它一直存活到函数结束。这是一个名为 `welcomeMessage` 的字符串的示例：\n\
