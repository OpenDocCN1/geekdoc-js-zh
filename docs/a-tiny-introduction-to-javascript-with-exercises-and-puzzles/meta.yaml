    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_111_0.png)\n\nTo figure this out, you\
    \ need a loop that will calculate the money you owe, and the money you’re making,\
    \ every year. If you save up enough to pay your debt, you can end the loop, pay\
    \ back the loan, and ride off into the sunset.\n\nHere’s how the calculations\
    \ work. Every year you’re charged 2% interest. You can use that to calculate how\
    \ much you owe:\n\n```\namountOwed = amountOwed * 1.02;\n```\n\nSo if the `amountOwed`\
    \ starts at 500000, after the first year it grows to 510000. And so on.\n\nBut\
    \ at the same time, your pizza shop is making money, to the respectable amount\
