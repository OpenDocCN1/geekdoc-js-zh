  md: '# Chapter 5


    # Interacting with the Page


    JavaScript was born inside a web page. People got tired of staring at ordinary
    HTML pages and someone said “Let’s add a programming language to make things less
    boring!”


    You’ve already seen how web pages run your code using events (like button clicks).
    But that’s not the only way that JavaScript and HTML interact. Your code can *read*
    the information that’s in the page and even *change* the page.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_64_0.png)


    # Introducing the DOM


    JavaScript has a powerful built-in feature. It examines your web page, finds every
    HTML element, and automatically creates matching objects. (Objects are a special
    type of programming ingredient that you can use in your code.) For example, if
    you have a page with a paragraph and a button, JavaScript automatically creates
    a paragraph object and a button object. This feature is called DOM, for *Document
    Object Model*.


    You use these DOM objects to interact with the page. For example, you can find
    out what text is in a text box, or change a picture, or write a message on the
    page. You’ll learn how to do all these tasks in this chapter.'
