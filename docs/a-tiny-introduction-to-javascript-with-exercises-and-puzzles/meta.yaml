    # # Welcome


    These days, you can''t turn around twice without someone trying to teach you how
    to code. The world is full of websites, courses, books, and games that promise
    to introduce you to the magical art of computer programming.


    So why did I write my own book?


    When my daughters started learning to code, I discovered that most tutorials were
    as dry as dust. If you wanted something more fun, you could play a coding game
    and write commands to move a character around a maze (like a princess, a zombie,
    a turtle, whatever). But unlike real programming, there was no chance to be creative.
    There was no freedom. There was no invitation to build *your own* programs.


    I wanted something different. Something...


    +   - **Hands-on.** If you want to learn a new skill, you need to practice. Otherwise,
    it''s just a bunch of theory swimming around in your head.

    - **Friendly for beginners.** If you''re a beginner, it''s not enough to learn
    the basics of a programming language like JavaScript. You also need to learn the
    concepts of programming at the same time.

    - **No setup required.** The world is full of amazing frameworks, tools, and code
    editors. But who wants to install a bunch of software before you even get started?

    - **Tiny.** I''m a programming nerd, so I *like* talking about things like Big
    O notation. But no one needs to be buried in theory at the start of their journey.
    In this book, every chapter is a bite-sized lesson that you can usually finish
    in one sitting.

    - **Kinda fun.** Not everyone has the motivation to learn from an old-fashioned
    textbook. But who doesn''t want to play dice with a cheating goblin?


    So I decided to make something of my own. Then I unleashed it on my family.'
  - '[PAGE 11]


    This is the result of those experiments.


    # What you need to use this guide


    You need a computer. Any type will do. (Please don’t try to learn to program on
    a smartphone.) You don’t need to install any software, because you’re going to
    write all your examples using the free CodePen website.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_11_0.png)


    You do need to know a little bit about HTML. Web pages are written in HTML, and
    JavaScript lives in web pages. Most JavaScript code spends a lot of time interacting
    with a web page—for example, changing text on a page, reacting when buttons are
    clicked, and so on.


    Trying to learn both JavaScript and HTML at once is a bit of a headache. But if
    you’ve never played around with HTML before, we have a solution. You can learn
    just enough to get by from the very short tutorial *Messing Up the Web* (available
    at [http://tiny.cc/webmess](http://tiny.cc/webmess)). Complete that before you
    start this guide.


    # Why JavaScript?


    JavaScript is a great first language for people learning to code. It’s not because
    JavaScript is a great teaching language (it mostly isn’t). It’s because JavaScript
    is *everywhere*—on every operating system, every browser, and almost every electronic
    device that’s more complicated than a toaster.


    That means you can effortlessly share your JavaScript programs with friends. Unlike
    all the rest of computing history, there’s no downloading, installing, or configuring.
    And it doesn’t hurt that JavaScript syntax is similar to many other professional
    languages, like Java and C#. That means the effort you spend to learn JavaScript
    is never wasted.


