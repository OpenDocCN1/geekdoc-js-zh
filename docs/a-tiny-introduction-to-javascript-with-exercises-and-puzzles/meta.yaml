- md: "## Logical Operators\n\nHere’s a quick review of all the logical operators,\
    \ with an example for each one:\n\n| Operator | Name | Example Condition | Result\
    \ When a=10 |\n| :--- | :--- | :--- | :--- |\n| == | Equal to | (a == 10) | true\
    \ |\n| != | Not equal to | (a != 10) | false |\n| < | Less than | (a < 10) | false\
    \ |\n| <= | Less than or equal | (a <= 10) | true |\n| > | Greater than | (a >\
    \ 10) | false |\n| >= | Greater than or equal | (a >= 10) | true |\n| === | Equal\
    \ in value and type (so no variable conversion allowed) | (a === \"10\") | false\
    \ |\n| !== | Not the same value or not the same type | (a !== \"10\") | true |\n\
    \nThe `===` and `!==` are two more specialized operators. They’re included to\
    \ give you the complete list, but you won’t use them anytime soon.\n\n> **NOTE**\
    \ You already know that <= is a combination of < and = that means *less than or\
    \ equal*. You might think you could write it the other way around, with the equal\
    \ sign first, like =<. But JavaScript doesn’t recognize it that way, and you’ll\
    \ get an error if you try.\n\n## Try it yourself!\n\n▶ **The Bowl of Beans (Challenge\
    \ Level: Medium)**\n\n[https://codepen.io/prosetech/pen/OJMrEXq](https://codepen.io/prosetech/pen/OJMrEXq)\n\
    \nWho doesn’t enjoy a bowl of jellybeans?\n\n![A bowl of jellybeans](img/ca187fcf58ff903e6e3e0367ce7a0d62_87_0.png)\n\
    \nYou have 19 jellybeans left.\n\n- Eat One\n- Fill Bowl\n\nThis example lets\
    \ you take jellybeans out of your bowl one at a time, or fill the bowl back up\
    \ (by clicking buttons, of course). The code keeps track of how many jellybeans\
    \ are in the bowl. But there’s a problem. No one stops you from taking a jellybean,\
    \ even if there are none left. That leads to an embarrassing problem—run the program\
    \ long enough, and you’ll have a negative number of jellybeans in the bowl.\n\n\
    To avoid this problem, you need to add an `if` block. The idea is that you should\
    \ only allow a bean to be taken from the bowl if there’s at least one remaining.\
    \ Otherwise, don’t do anything.\n\n> HINT If you're stuck, start by writing the\
    \ condition you want to test. How do you know if the bowl is empty? You could\
    \ use the condition `jellybeanCount >= 1`, which checks if there is one or more\
    \ beans in the bowl. Or, you could use the condition `jellybeanCount != 0`, meaning\
    \ the bowl has *not* dwindled down to 0 jellybeans. Either way, use that condition\
    \ with an `if` block, and put the code for eating the jellybean inside.\n\nKeep\
    \ this program around. You're going to come back to it in a moment.\n\n## The\
    \ else block\n\nThe `if` statement has a trusty companion called `else`. If you\
    \ use `if` to set up a conditional block of code, you can use `else` to tell your\
    \ program what to do if the condition *doesn't* match.\n\nThe easiest way to understand\
    \ `if` and `else` is with an example:\n\n```javascript\nif (a == b) {\n    alert(\"\
    They match\");\n}\nelse {\n    alert(\"They don't match\");\n}\n```\n\nYour program\
    \ can take *only one* path through an `if else` block. In this example, if the\
    \ first condition matches, you get the first alert box message. If it doesn't,\
    \ you get the second alert box message. There's no way to see both messages, and\
    \ there's no way to skip them both either.\n\nThis kind of arrangement looks complicated,\
    \ but it's very useful. It allows your code to choose between different outcomes,\
    \ which is important when you're examining information or playing a game of chance.\n\
    \n> **NOTE** Before, you used braces for one thing—functions. Now you’re using\
    \ them for functions and conditional logic. Make sure you remember to put braces\
    \ at the beginning and end of each block of conditional logic, and at the beginning\
    \ and end of your entire function. It’s fairly common to forget a brace, at which\
    \ point your code will stop working. To help spot the problem, use indenting in\
    \ your blocks.\n\n## Try it yourself!\n\n▶ **The Bowl of Beans Improved (Challenge\
    \ Level: Easy)**\n\nhttps://codepen.io/prosetech/pen/OJMrEXq\n\nYou can improve\
    \ the Bowl of Beans example by adding an `else` statement. Right now, there’s\
    \ a single all-or-nothing test that checks if the bowl is empty. But here’s a\
    \ better way to serve the jellybeans:\n\n- If there are beans in the bowl, dish\
    \ one out (as usual).\n- If there are no beans left in the bowl, show an alert\
    \ box explaining the problem.\n\n## Conditional logic with unlimited possibilities\n\
    \nFirst you started with one conditional block. Then you used `else` to combine\
    \ two blocks. Now you’ll learn a technique that lets you stack an unlimited number\
    \ of conditions, one after the other.\n\nThe secret is a combination called `else\
    \ if`. You use `else if` to consider another condition. But here’s the trick:\
    \ `else if` only checks its condition if the previous condition didn’t match.\n\
    \nThe easiest way to understand how this works is to look at a couple of examples.\
    \ First, consider this code, which has two separate conditions:\n\n```javascript\n\
    if (moneyInWallet > 0) {\n    alert(\"You are carrying some money.\");\n}\n\n\
    if (moneyInBank > 0) {\n    alert(\"You have money in the bank.\");\n}\n```\n\n\
    This code has several possible outcomes.\n\n- If you are totally broke (no money\
    \ anywhere), you won’t see any alert messages.\n- If you have money in both your\
    \ wallet and the bank, you’ll get two messages.\n- If you have money in just one\
    \ place (wallet or bank), you’ll get one message.\n\nBut when you use `else if`,\
    \ you can link your conditions, like this:\n\n```javascript\nif (moneyInWallet\
    \ > 0) {\n    alert(\"You can buy something!\");\n}\nelse if (moneyInBank > 0)\
    \ {\n    alert(\"You can buy something, if you go to the bank first.\");\n}\n\
    else {\n    alert(\"Maybe ask your parents for some bills?\");\n}\n```\n\nWhen\
    \ JavaScript runs this code, it checks the conditions in order. As soon as it\
    \ finds a condition that’s true, it runs the code in the corresponding block.\
    \ It then skips over all the other `else` statements, going right to the closing\
    \ `}` at the end.\n\nThis system means you always see exactly one message in this\
    \ example:\n\n- If you have money in your wallet, you get the first message.\n\
    - If you have no money in your wallet, but you do have money in the bank, you\
    \ get the second message.\n- If you have no money anywhere, you get the third\
    \ message.\n\nYou can use as many `else if` blocks as you want. Their conditions\
    \ can use the same variables or different variables (like in the wallet and bank\
    \ example). Just remember that as soon as one condition matches, the others are\
    \ ignored.\n\nYou don't need to have a final `else` block at the end. But if you\
    \ do, that code runs if none of the other conditions match.\n\n## Try it yourself!\n\
    \n▶ Predict the Future (Challenge Level: Easy)\n\nhttps://codepen.io/prosetech/pen/mdVvdxV\n\
    \nTake a look at this block of conditional logic, which has three separate conditions\
    \ and a final `else`.\n\n```javascript\nif (a == b) {\n  alert(\"They match\"\
    );\n}\nelse if (a < b) {\n  alert(\"A is smaller than B\");\n}\nelse if (a > b)\
    \ {\n  alert(\"A is bigger than B\");\n}\nelse {\n  alert(\"I can't compare them.\
    \ They aren't numbers.\");\n}\n```\n\nYour goal is to run the code in your mind.\
    \ Try to predict what will happen for the following values of `a` and `b`:\n\n\
    | Value of a | Value of b | Result |\n|---|---|---|\n| 42 | 5 | |\n| 239.12 |\
    \ 239.12 | |\n| 0 | 100.5 | |\n| 4 | “dog” | |\n\nOnce you’ve made your predictions,\
    \ try out the actual program and see if you’re right. If not, what was your mistake?\n\
    \n## Try it yourself!\n\n▶ Beans Ain't Free (Challenge Level: Hard)\n\nhttps://codepen.io/prosetech/pen/jOWXKwb\n\
    \nHere's a more advanced version of the jellybean bowl counter. Now the code keeps\
    \ track of two changing numbers: the amount of jellybeans in the bowl (`jellybeanCount`)\
    \ and the amount of money you have (`moneyInWallet`). And whenever you fill the\
    \ bowl, the jellybean cost is deducted from your wallet automatically.\n\nThe\
    \ problem is that there's no code to check that you actually have the money you're\
    \ spending. That means a few too many button clicks can put you deep into debt,\
    \ with a negative amount of money. Jellybeans may be good, but they aren't worth\
    \ a lifetime of financial hardship.\n\nTo fix this code, change it so it does\
    \ this when you click the **Fill Bowl** button:\n\n1. Check if your bowl is full.\
    \ If it is, no more beans will fit anyway, so show a message explaining the problem.\n\
    2. If your bowl has room, see if you have money to fill the bowl. If you don't,\
    \ show a message explaining *that* problem.\n3. If the bowl has room and you have\
    \ money, fill the bowl up to the maximum 20 jellybeans and deduct the usual fee.\n\
    \n> **HINT** To solve this puzzle, you need to create a multipart `if` block in\
    \ the `fillBowl()` function. First check if condition 1 from the list above fails\
    \ (or 2, because the order doesn't matter). Then, use an `else if` to go ahead\
    \ and check if the other condition fails. Finally, use an `else` to tell the program\
    \ what to do if neither condition failed. (This is where you put the current code\
    \ that buys more beans.)"
  mdcn: "\n## 逻辑运算符\n\n以下是所有逻辑运算符的快速回顾，每个都附有示例：\n\n| 运算符 | 名称 | 示例条件 | 当 a=10 时的结果\
    \ |\n| :--- | :--- | :--- | :--- |\n| == | 等于 | (a == 10) | true |\n| != | 不等于\
    \ | (a != 10) | false |\n| < | 小于 | (a < 10) | false |\n| <= | 小于或等于 | (a <= 10)\
    \ | true |\n| > | 大于 | (a > 10) | false |\n| >= | 大于或等于 | (a >= 10) | true |\n\
    | === | 值和类型都相等（不允许变量转换） | (a === \"10\") | false |\n| !== | 值或类型不相等 | (a !==\
    \ \"10\") | true |\n\n`===` 和 `!==` 是两个更专门的运算符。它们被包含进来是为了给你完整的列表，但你暂时不会用到它们。\n\
    \n> **注意** 你已经知道 `<=` 是 `<` 和 `=` 的组合，表示*小于或等于*。你可能认为可以反过来写，把等号放在前面，比如 `=<`。但\
    \ JavaScript 不这样识别，如果你尝试，会得到一个错误。\n\n## 自己动手试试！\n\n▶ **一碗豆子（挑战难度：中等）**\n\n[https://codepen.io/prosetech/pen/OJMrEXq](https://codepen.io/prosetech/pen/OJMrEXq)\n\
    \n谁会不喜欢一碗果冻豆呢？\n\n![一碗果冻豆](img/ca187fcf58ff903e6e3e0367ce7a0d62_87_0.png)\n\n\
    你还剩下 19 颗果冻豆。\n\n- 吃一颗\n- 装满碗\n\n这个示例允许你从碗中一颗一颗地取出果冻豆，或者（当然是通过点击按钮）把碗重新装满。代码会追踪碗里有多少颗果冻豆。但有个问题：没人阻止你在豆子已经没有的时候再拿一颗。这会导致一个尴尬的问题——运行程序足够久，你的碗里会出现负数颗果冻豆。\n\
    \n为了避免这个问题，你需要添加一个 `if` 代码块。思路是：只有当碗里至少还有一颗豆子时，才允许取出一颗。否则，什么也不做。\n\n> **提示** 如果你卡住了，首先写下你想要测试的条件。你怎么知道碗是空的？你可以使用条件\
    \ `jellybeanCount >= 1`，它检查碗里是否有一颗或更多豆子。或者，你可以使用条件 `jellybeanCount != 0`，意思是碗*没有*减少到\
    \ 0 颗果冻豆。无论哪种方式，将该条件与一个 `if` 代码块一起使用，并将吃豆子的代码放在里面。\n\n把这段程序留好。你很快会用到它。\n\n## else\
    \ 代码块\n\n`if` 语句有一个可靠的伙伴叫做 `else`。如果你使用 `if` 来设置一个条件代码块，你可以使用 `else` 来告诉程序当条件*不*匹配时该做什么。\n\
    \n理解 `if` 和 `else` 最简单的方法是看一个例子：\n\n```javascript\nif (a == b) {\n    alert(\"\
    They match\");\n}\nelse {\n    alert(\"They don't match\");\n}\n```\n\n你的程序在 `if\
    \ else` 代码块中只能走*一条*路径。在这个例子中，如果第一个条件匹配，你会得到第一个警报框消息。如果不匹配，你会得到第二个警报框消息。不可能同时看到两条消息，也不可能同时跳过它们。\n\
    \n这种安排看起来很复杂，但它非常有用。它允许你的代码在不同的结果之间进行选择，这在检查信息或玩概率游戏时很重要。\n\n> **注意** 之前，你用大括号做一件事——函数。现在你用它们来做函数和条件逻辑。确保你记住在每块条件逻辑的开头和结尾放置大括号，以及在整个函数的开头和结尾放置大括号。忘记一个大括号相当常见，那时你的代码就会停止工作。为了帮助发现问题，请在代码块中使用缩进。\n\
    \n## 自己动手试试！\n\n▶ **改进的一碗豆子（挑战难度：简单）**\n\nhttps://codepen.io/prosetech/pen/OJMrEXq\n\
    \n你可以通过添加一个 `else` 语句来改进“一碗豆子”示例。目前，有一个非此即彼的测试来检查碗是否为空。但这里有一个更好的方法来分配果冻豆：\n\n\
    - 如果碗里有豆子，就分一颗出来（像往常一样）。\n- 如果碗里没有豆子了，就显示一个警报框说明问题。\n\n## 无限可能的条件逻辑\n\n首先你从一个条件代码块开始。然后你用\
    \ `else` 来组合两个代码块。现在你将学习一种技术，让你可以堆叠无限数量的条件，一个接一个。\n\n秘诀是一个叫做 `else if` 的组合。你用\
    \ `else if` 来考虑另一个条件。但这里的诀窍是：`else if` 只有在之前的条件不匹配时才会检查它的条件。\n\n理解其工作原理最简单的方法是看几个例子。首先，考虑这段有两个独立条件的代码：\n\
    \n```javascript\nif (moneyInWallet > 0) {\n    alert(\"You are carrying some money.\"\
    );\n}\n\nif (moneyInBank > 0) {\n    alert(\"You have money in the bank.\");\n\
    }\n```\n\n这段代码有几种可能的结果。\n\n- 如果你完全破产（任何地方都没有钱），你不会看到任何警报消息。\n- 如果你的钱包和银行里都有钱，你会得到两条消息。\n\
    - 如果你只有一个地方有钱（钱包或银行），你会得到一条消息。\n\n但是当你使用 `else if` 时，你可以链接你的条件，像这样：\n\n```javascript\n\
    if (moneyInWallet > 0) {\n    alert(\"You can buy something!\");\n}\nelse if (moneyInBank\
    \ > 0) {\n    alert(\"You can buy something, if you go to the bank first.\");\n\
    }\nelse {\n    alert(\"Maybe ask your parents for some bills?\");\n}\n```\n\n\
    当 JavaScript 运行这段代码时，它按顺序检查条件。一旦找到一个为真的条件，它就运行相应代码块中的代码。然后它跳过所有其他的 `else` 语句，直接到最后的\
    \ `}`。\n\n这个系统意味着在这个例子中你总会看到恰好一条消息：\n\n- 如果你的钱包里有钱，你会得到第一条消息。\n- 如果你的钱包里没钱，但银行里有钱，你会得到第二条消息。\n\
    - 如果你任何地方都没有钱，你会得到第三条消息。\n\n你可以根据需要使用任意多的 `else if` 代码块。它们的条件可以使用相同的变量或不同的变量（如钱包和银行的例子）。只需记住，一旦一个条件匹配，其他的条件就会被忽略。\n\
    \n你不需要在最后有一个最终的 `else` 代码块。但如果有的话，当其他所有条件都不匹配时，那段代码会运行。\n\n## 自己动手试试！\n\n▶ 预测未来（挑战难度：简单）\n\
    \nhttps://codepen.io/prosetech/pen/mdVvdxV\n\n看看这段条件逻辑代码，它有三个独立的条件和一个最终的 `else`。\n\
    \n```javascript\nif (a == b) {\n  alert(\"They match\");\n}\nelse if (a < b) {\n\
    \  alert(\"A is smaller than B\");\n}\nelse if (a > b) {\n  alert(\"A is bigger\
    \ than B\");\n}\nelse {\n  alert(\"I can't compare them. They aren't numbers.\"\
    );\n}\n```\n\n你的目标是在脑子里运行代码。尝试预测当 `a` 和 `b` 取以下值时会发生什么：\n\n| a 的值 | b 的值 | 结果\
    \ |\n|---|---|---|\n| 42 | 5 | |\n| 239.12 | 239.12 | |\n| 0 | 100.5 | |\n| 4\
    \ | “dog” | |\n\n一旦你做出了预测，尝试运行实际的程序，看看你是否正确。如果不正确，你的错误是什么？\n\n## 自己动手试试！\n\n▶\
    \ 豆子非免费（挑战难度：高）\n\nhttps://codepen.io/prosetech/pen/jOWXKwb\n\n这是果冻豆碗计数器的一个更高级版本。现在代码追踪两个变化的数字：碗中的果冻豆数量（`jellybeanCount`）和你拥有的金钱数量（`moneyInWallet`）。每当你装满碗时，果冻豆的成本会自动从你的钱包中扣除。\n\
    \n问题在于没有代码来检查你是否确实有你要花的钱。这意味着太多的按钮点击会让你深陷债务，出现负数金额。果冻豆可能很好，但它们不值得一生的财务困难。\n\n\
    要修复这段代码，请将其修改为当你点击 **Fill Bowl** 按钮时执行以下操作：\n\n1. 检查你的碗是否已满。如果满了，无论如何也装不下更多豆子了，所以显示一条消息解释问题。\n\
    2. 如果你的碗有空间，看看你是否有钱装满碗。如果你没有，显示一条消息解释*那个*问题。\n3. 如果碗有空间并且你有钱，将碗装满至最多 20 颗果冻豆，并扣除通常的费用。\n\
    \n> **提示** 要解决这个难题，你需要在 `fillBowl()` 函数中创建一个多部分的 `if` 代码块。首先检查上面列表中的条件 1 是否失败（或者条件\
    \ 2，因为顺序无关紧要）。然后，使用一个 `else if` 来检查另一个条件是否失败。最后，使用一个 `else` 来告诉程序如果两个条件都没有失败该怎么做。（这就是你放置当前购买更多豆子代码的地方。）\n"
