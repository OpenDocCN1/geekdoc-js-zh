- md: "When you fork an example, your name appears under the example name, which shows\
    \ that you're the owner of this new copy. You can also rename the example, if\
    \ you want. (To do that, click the pencil icon next to the name.)\n\nMore importantly,\
    \ your new copy also gets a new web address.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_20_0.png)\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_20_1.png)\n\nYou use the new address\
    \ whenever you need to see your version of the example. You can see all the examples\
    \ you've saved (they're called *pens*) in your CodePen dashboard at [https://codepen.io/dashboard](https://codepen.io/dashboard).\n\
    \nForking isn't the only way to make an example. You can also start writing an\
    \ example from scratch. You might do this to follow along with some of the lessons\
    \ in this guide, or just try out your own random ideas. To create a new, blank\
    \ example, click the person picture in the top-right corner of the CodePen site\
    \ and choose **New Pen**.\n\n## Turning on autocomplete\n\nCodePen has a nifty\
    \ feature called *autocomplete* that can give you suggestions while you type.\
    \ For example, CodePen's autocomplete can suggest the name of certain code ingredients.\
    \ (This will make more sense once you start learning JavaScript.)\n\nThe only\
    \ problem with autocomplete is that you need to turn it on yourself. You should\
    \ definitely do that before you get started learning JavaScript. Here's how:\n\
    \n1. Click the tiny person picture in the top-right corner of the CodePen site.\n\
    2. Click **Settings**.\n3. Scroll down the page until you find the **Editor Options**\
    \ box.\n4. Make sure the **Autocomplete** setting is checked.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_21_0.png)\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_21_1.png)\n\n## What comes after CodePen\n\
    \nOf course, just because you start in CodePen doesn't mean you have to stay there.\
    \ Eventually you can take the code you've written, save it on your computer, and\
    \ use a professional (but still free) editor like Visual Studio Code.\n\nWhen\
    \ you're ready to take this road, CodePen has an export feature that can help\
    \ you out. Here's how to use it:\n\n1. Click the **Export** button. (It's in the\
    \ bottom-right corner of the window, near the tiny **Fork** button.)\n2. Click\
    \ **Export .zip** to create a zipped-up package with all the files you need (that\
    \ includes the HTML, CSS, and JavaScript).\n3. Click **Download .zip** to copy\
    \ the ZIP file to your computer. Now you can open it, get the files, and edit\
    \ them in a different editor.\n\nBut there's plenty of time for all that later.\
    \ Right now, CodePen is the perfect place to get started with JavaScript.\n\n\
    Chapter 1\n\n# What JavaScript Looks Like\n\nYou're about to spend a lot of time\
    \ looking at code. To help you find your way around, you need to get more familiar\
    \ with the way JavaScript code is written.\n\nThese arcane rules are known to\
    \ JavaScript wizards as *syntax*. Once you know some of the rules of JavaScript\
    \ syntax, code will start looking a lot more like magic instructions and a lot\
    \ less like complete gibberish.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_0.png)\n\
    \n## Statements\n\nWhen you look at a chunk of JavaScript code, you'll see a sequence\
    \ of *statements*—basically, commands that tell your web browser to do something.\
    \ Here's one now:\n\n```\nalert(\"Hi there!\");\n```\n\nThe alert() command is\
    \ simple. It shows a small pop-up window with whatever message you want. (You\
    \ put the message—like *Hi there!*—in quotation marks.) An alert box isn't the\
    \ most polite way to get attention, but it works.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_1.png)\n\
    \nIf you're completely new to JavaScript, you won't understand exactly how this\
    \ command works, and that's OK. But you should notice that this command has a\
    \ semicolon ( ; ) at the end. Although semicolons aren't absolutely required in\
    \ JavaScript, serious programmers always use them. They show where each code statement\
    \ stops.\n\nIf you run out of room to comfortably fit a statement on one line,\
    \ you can split it pretty much wherever you want, as long as you remember to end\
    \ with the semicolon. Here's an example that shows the same message as before,\
    \ but now puts the statement on two lines:\n\n```\nalert(\n\"Hi there!\");\n```\n\
    \nYou can also add spaces to arrange your code:\n\n```\nalert(\n    \"Hi there!\"\
    );\n```\n\nIt's still the same command. JavaScript ignores extra spaces, just\
    \ like it ignores line breaks.\n\nOf course, you can't do much with just one statement.\
    \ Even a small program has a series of statements, one after the other. When a\
    \ piece of JavaScript code is running, the browser goes through the statements\
    \ one by one, triggering each command in order.\n\n## Comments\n\nStatements that\
    \ start with two forward slashes // are comments. JavaScript ignores all comments.\n\
    \n```\n// I don't do anything at all!\n```\n\nYou can add comments wherever you\
    \ want. Often, you use a comment to explain what's about to happen in the next\
    \ code statement:\n\n```\n// Show a message.\nalert(\"Hi there!\");\n```\n\nYou\
    \ can also use comments to point out an important section of code. Many of the\
    \ tutorials in this guide have comments that tell you where to pay attention or\
    \ what you need to change:\n\n```\n// This is where things go wrong.\n```\n\n\
    You can also put the comment slashes in front of a code statement to temporarily\
    \ turn it off. For example, this alert() command won't do anything because it's\
    \ been changed into a comment:\n\n```\n//alert(\"Hi there!\");\n```\n\nThis trick\
    \ is called *commenting out* code. You might use it instead of deleting a line\
    \ of code if you think you'll need the code later.\n\n> **TIP** In CodePen (and\
    \ most other code editors), comments are shown in a different color than statements.\
    \ That makes it easier to spot the code.\n\n## Blocks and functions\n\nJavaScript\
    \ uses curly brackets, called *braces*, to group together sections of code that\
    \ have one or more statements. Each section starts with an opening brace:\n\n\
    ```\n{\n```\n\nAnd ends with a closing brace:\n\n```\n}\n```\n\n(If you're hunting\
    \ for these symbols on the keyboard, you can usually get them by holding down\
    \ **Shift** and typing the square **[ ]** brackets, which are just to the right\
    \ of the **P** key.)\n\nAs you learn JavaScript, you'll see these braces used\
    \ in different places. The first place you'll see them is in *functions*. You\
    \ can think of a function as a small section of code that does one task. You can\
    \ recognize a function because it starts with the word `function`. Here's a simple\
    \ example:\n\n```\nfunction showMessage() {\n    alert(\"Hi there!\");\n}\n```\n\
    \nEvery function has a name, which appears after the word `function` and before\
    \ the parentheses (). The person who creates the function chooses the name. This\
    \ function is named `showMessage`, and it contains just one statement.\n\nHere's\
    \ a slightly longer version of the showMessage() function. It holds two comments\
    \ and two statements:\n\n```\nfunction showMessage() {\n  // Show the first message.\n\
    \  alert(\"Hi there!\");\n\n  // After you click OK, you get to see this bonus\
    \ message.\n  alert(\"It's me again!\");\n}\n```\n\nHere's exactly what happens\
    \ when the code in this function runs:\n\n1. JavaScript skips over the first comment\
    \ (`// Show the first ...`)\n2. The alert() function shows the first message in\
    \ an alert box.\n3. Now the code stops. It's waiting for someone to close the\
    \ alert box.\n4. When you click **OK**, JavaScript carries on.\n5. JavaScript\
    \ skips over the second comment (`// After you click ...`)\n6. The alert() function\
    \ shows the second message.\n7. When you click **OK**, JavaScript carries on and\
    \ the function ends. That's all for now.\n\nThere are a few other details you\
    \ might notice here. For example, every line in this function is indented with\
    \ two empty spaces. These spaces are totally optional, but it's one of the many\
    \ ways that people make code easier to read and understand. And making code easier\
    \ to understand becomes a Very Big Deal as your programs get more complex.\n\n\
    > **NOTE** For now, every code statement you write belongs inside a function.\
    \ Don't put code above a function block, after a function block, or between two\
    \ function blocks. (You can put comments there, though.)"
  mdcn: "\n当你 Fork 一个示例时，你的名字会出现在示例名称下方，表明你是这个新副本的所有者。你也可以根据需要重命名该示例。（要重命名，请点击名称旁边的铅笔图标。）\n\
    \n更重要的是，你的新副本也会获得一个新的网络地址。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_20_0.png)\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_20_1.png)\n\n当你需要查看自己的示例版本时，就使用这个新地址。你可以在\
    \ CodePen 的仪表盘中查看所有保存的示例（它们被称为 *pens*），地址是 [https://codepen.io/dashboard](https://codepen.io/dashboard)。\n\
    \nFork 并不是制作示例的唯一方式。你也可以从头开始编写一个示例。你可能这样做是为了跟随本指南中的某些课程，或者只是为了尝试你自己的随机想法。要创建一个新的空白示例，请点击\
    \ CodePen 网站右上角的个人头像图片，然后选择 **New Pen**。\n\n## 开启自动补全功能\n\nCodePen 有一个很棒的 *自动补全*\
    \ 功能，可以在你输入时提供建议。例如，CodePen 的自动补全可以建议某些代码成分的名称。（一旦你开始学习 JavaScript，这就会更有意义。）\n\
    \n自动补全的唯一问题是，你需要自己手动开启它。你肯定应该在开始学习 JavaScript 之前就做好这件事。以下是方法：\n\n1.  点击 CodePen\
    \ 网站右上角的小人物头像图片。\n2.  点击 **Settings**（设置）。\n3.  向下滚动页面，直到找到 **Editor Options**（编辑器选项）框。\n\
    4.  确保 **Autocomplete**（自动补全）设置已勾选。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_21_0.png)\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_21_1.png)\n\n## CodePen 之后是什么\n\n当然，从\
    \ CodePen 开始并不意味着你必须一直待在 CodePen。最终，你可以将编写的代码保存在电脑上，并使用专业的（但仍然是免费的）编辑器，如 Visual\
    \ Studio Code。\n\n当你准备好走这条路时，CodePen 有一个导出功能可以帮到你。以下是使用方法：\n\n1.  点击 **Export**（导出）按钮。（它在窗口的右下角，靠近微小的\
    \ **Fork** 按钮。）\n2.  点击 **Export .zip**（导出为 .zip）以创建一个包含你所需所有文件（包括 HTML、CSS 和\
    \ JavaScript）的压缩包。\n3.  点击 **Download .zip**（下载 .zip）将 ZIP 文件复制到你的计算机。现在你可以打开它，获取文件，并在不同的编辑器中进行编辑。\n\
    \n但现在不用着急，有的是时间做这些。目前，CodePen 是开始学习 JavaScript 的完美场所。\n\n第一章\n\n# JavaScript 长什么样\n\
    \n你即将花大量时间查看代码。为了帮助你理清思路，你需要更熟悉 JavaScript 代码的编写方式。\n\n这些神秘的规则被 JavaScript 向导们称为\
    \ *语法*。一旦你了解了一些 JavaScript 语法规则，代码就会开始看起来更像魔法指令，而不再像天书了。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_0.png)\n\
    \n## 语句\n\n当你看到一段 JavaScript 代码时，你会看到一系列 *语句* ——基本上，就是告诉你的网页浏览器做某事的命令。这里有一个：\n\
    \n```\nalert(\"Hi there!\");\n```\n\nalert() 命令很简单。它显示一个带有你想要的任何消息的小弹出窗口。（你将消息——例如\
    \ *Hi there!* ——放在引号内。）弹出框不是获取注意力的最礼貌方式，但它很管用。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_24_1.png)\n\
    \n如果你是 JavaScript 的初学者，你不会完全理解这个命令是如何工作的，这没关系。但你应该注意，这个命令末尾有一个分号（ ; ）。虽然 JavaScript\
    \ 中并非绝对需要分号，但认真的程序员总会使用它们。它们标明了每个代码语句的结束。\n\n如果你没有足够的空间将一个语句舒适地放在一行中，你几乎可以在任何地方拆分它，只要记得以分号结尾。这里有一个例子，显示了与之前相同的消息，但现在将语句分成了两行：\n\
    \n```\nalert(\n\"Hi there!\");\n```\n\n你还可以添加空格来排列代码：\n\n```\nalert(\n    \"Hi\
    \ there!\");\n```\n\n这仍然是同一个命令。JavaScript 会忽略额外的空格，就像它忽略换行符一样。\n\n当然，只用一个语句做不了什么。即使是一个小程序也包含一系列语句，一个接一个。当一段\
    \ JavaScript 代码运行时，浏览器会逐一处理这些语句，按顺序触发每个命令。\n\n## 注释\n\n以两个正斜杠 // 开头的语句是注释。JavaScript\
    \ 会忽略所有注释。\n\n```\n// I don't do anything at all!\n```\n\n你可以在任何地方添加注释。通常，你使用注释来解释下一个代码语句将要发生的事情：\n\
    \n```\n// Show a message.\nalert(\"Hi there!\");\n```\n\n你也可以使用注释来指出代码的重要部分。本指南中的许多教程都有注释，告诉你需要注意哪里或需要更改什么：\n\
    \n```\n// This is where things go wrong.\n```\n\n你也可以将注释斜杠放在代码语句前面，以暂时将其关闭。例如，这个\
    \ alert() 命令不会执行任何操作，因为它已被更改为注释：\n\n```\n//alert(\"Hi there!\");\n```\n\n这个技巧被称为\
    \ *注释掉* 代码。如果你认为以后会需要这段代码，可以使用它来代替删除一行代码。\n\n> **提示** 在 CodePen（以及大多数其他代码编辑器）中，注释的显示颜色与语句不同。这使得更容易发现代码。\n\
    \n## 块和函数\n\nJavaScript 使用花括号，称为 *大括号*，来将包含一个或多个语句的代码段组合在一起。每个部分以一个左大括号开始：\n\n\
    ```\n{\n```\n\n以一个右大括号结束：\n\n```\n}\n```\n\n（如果你在键盘上找不到这些符号，通常可以通过按住 **Shift**\
    \ 键并输入方括号 **[ ]** 来得到它们，它们就在 **P** 键的右边。）\n\n在学习 JavaScript 的过程中，你会看到这些大括号用在不同的地方。你首先看到它们的地方是在\
    \ *函数* 中。你可以将函数视为完成一项任务的小段代码。你可以通过它以 `function` 这个词开头来识别一个函数。这里有一个简单的例子：\n\n```\n\
    function showMessage() {\n    alert(\"Hi there!\");\n}\n```\n\n每个函数都有一个名称，它出现在\
    \ `function` 一词之后，括号 () 之前。创建函数的人选择名称。这个函数名为 `showMessage`，它只包含一个语句。\n\n这是 showMessage()\
    \ 函数的一个稍长版本。它包含两个注释和两个语句：\n\n```\nfunction showMessage() {\n  // Show the first\
    \ message.\n  alert(\"Hi there!\");\n\n  // After you click OK, you get to see\
    \ this bonus message.\n  alert(\"It's me again!\");\n}\n```\n\n当这个函数中的代码运行时，具体发生的事情如下：\n\
    \n1.  JavaScript 跳过第一个注释（`// Show the first ...`）\n2.  alert() 函数在弹出框中显示第一条消息。\n\
    3.  现在代码停止。它正在等待有人关闭弹出框。\n4.  当你点击 **OK** 时，JavaScript 继续执行。\n5.  JavaScript 跳过第二个注释（`//\
    \ After you click ...`）\n6.  alert() 函数显示第二条消息。\n7.  当你点击 **OK** 时，JavaScript\
    \ 继续执行，函数结束。目前就这些。\n\n你可能还会注意到一些其他细节。例如，这个函数中的每一行都缩进了两个空格。这些空格完全是可选的，但它们是人们使代码更易于阅读和理解的众多方式之一。随着你的程序变得更加复杂，使代码更易于理解变得至关重要。\n\
    \n> **注意** 目前，你编写的每个代码语句都属于一个函数内部。不要将代码放在函数块的上方、函数块之后或两个函数块之间。（不过，你可以把注释放在那里。）\n"
