    This problem isn’t just with JavaScript. It happens with floating point numbers
    in every programming language. The difference is that some languages have decimal
    data types that are designed to avoid this problem. JavaScript doesn’t, so it’s
    up to you to correct the mistake.


    How do you fix it? If you’re writing a program that uses scientific calculations
    with lots of decimal places, there’s no need to change anything. But if you’re
    writing a program that uses exact amounts of money, it’s confusing to see tiny
    fractions of a penny.


    There are two solutions. You could use rounding, which you’ll learn how to do
    in a moment. That way you can snip off any extra decimal bit that doesn’t make
    sense. But an easier approach is to avoid having decimal values at all. So instead
    of keeping track of an amount of dollars (like $4.30), count the total number
    of cents (like 430).


