    \ {\n  showMessage();\n  showAnotherMessage();\n}\n```\n\n当你调用一个函数时，JavaScript会先让该函数完成所有工作，然后才继续执行。在这个例子中，这意味着JavaScript会运行`showMessage()`中的所有代码，然后运行`showAnotherMessage()`中的代码。\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_119_0.png)\n\n如果连续调用多个函数还不够有趣，你还可以创建一个调用另一个函数的函数，而后者又可以调用另一个函数，依此类推。这并不像听起来那么复杂。在一个设计良好的程序中，每个函数只执行一项独立的任务，而函数名通常会告诉你这个任务是什么。\n\
    \n想象你读到这样的代码：\n\n```\nfunction doSomething() {\n  checkPassword();\n  saveOrder();\n\
