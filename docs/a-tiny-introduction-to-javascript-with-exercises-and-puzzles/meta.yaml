    你可以继续添加任意多个逗号和参数。只需记住顺序很重要。你在函数声明中列出参数的顺序，与调用函数时需要遵循的顺序相同。\n\n```\nshowMessage(\"\
    Alexa\", \"Chen\");\n\nfunction showMessage(firstName, lastName) {\n  alert(\"\
