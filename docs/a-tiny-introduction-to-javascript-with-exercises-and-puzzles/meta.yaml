- img_proc: true
  md: "# # A loop without a counter\n\nSo far, you’ve seen a few examples of loops\
    \ that use counters. Loops with counters keep track of how many times they repeat,\
    \ and they pull the plug at just the right time.\n\nBut sometimes you don’t know\
    \ exactly how many times your loop should loop. For example, maybe you’re using\
    \ a loop to create an animation, and you want to stop after a certain amount of\
    \ time. Or maybe you’re using a loop to run a game, which ends when someone reaches\
    \ a certain amount of points. Or perhaps you’re performing a series of calculations,\
    \ and you’re not going to stop until you find a certain value. In cases like these,\
    \ you need to write a different type of condition for your loop.\n\nJust to get\
    \ you thinking, here’s a rough example of how the code in a game might work, with\
    \ all the messy details left out:\n\n```\ndo {\n\n    // (Play one round of the\
    \ game here ...)\n\n    // (Increase the score of the winner here ...)\n\n   \
    \ // Use the condition to stop when someone gets 50 points.\n\n} while (playerOneScore\
    \ < 50 && playerTwoScore < 50);\n\n// Yippee, we have a winner!\n// If you reach\
    \ this point, someone has 50 points or more.\n// Now you can use an if block to\
    \ find out who won.\n```\n\nReady to take on some actual code? Try the next exercise,\
    \ where you get to use a loop to make yourself a million dollars."
