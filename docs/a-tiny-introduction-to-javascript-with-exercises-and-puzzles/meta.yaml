  md: 'There are four boxes in the CodePen window:


    +   - **HTML.** That’s the content of your web page (the elements and text).

    - **CSS.** These are the styles that set how your web page looks.

    - **JavaScript.** This is the code you’re going to learn to write. You’ll spend
    a lot of time in this box.

    - **Preview.** This is what the actual page you’re building looks like (so far).


    Usually, the HTML, CSS, and JavaScript sections are arranged on the top, and the
    preview is underneath.


    If your browser window is too small, CodePen rearranges itself to put the preview
    on the right side, and combines the HTML, CSS, and JavaScript sections on the
    left.


    You can start changing a CodePen example right away. Try it out with *The Most
    Wonderful Button in the World*. Click in the HTML box, and change the text on
    the button. (Right now, it’s “The most beautiful button in the world?”) A moment
    after your change, the preview will update itself. If you’re noticing a delay,
    you can always click the preview section to hurry it up.


    > **NOTE** Remember, if you don’t know anything about HTML and you aren’t comfortable
    editing it yet, you can read the *Messing Up the Web* tutorial to get started
    ([http://tiny.cc/webmess](http://tiny.cc/webmess)).'
