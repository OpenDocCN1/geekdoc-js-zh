  - "[PAGE 94]\n\nChapter 8\n\n# More Decision Making\n\nThe `if` and `else` keywords\
    \ give you everything you need to make decisions in your code. But sometimes conditional\
    \ logic can get messy. You decide to check one variable, then another, and the\
    \ next thing you know your code is buried somewhere in a wall of braces { }.\n\
    \n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_94_0.png)\n\nDon't panic. You can learn\
    \ to write code that makes decisions but keeps the confusion under control. Here\
    \ are some tools that can help.\n\n# Combining two conditions (using ‘and’)\n\n\
    A conditional block of code is like any other block of code. Inside it, you can\
    \ create variables, show alert boxes, and interact with the page. You can even\
    \ put one `if` block inside *another* `if` block, like this:\n\n```\n// I don't\
    \ want to spend more than $10 for a pineapple.\nif (costOfPineapples <= 9.99)\
    \ {\n\n    // But wait, do I even have enough money?\n    if (moneyInWallet >=\
    \ costOfPineapples) {\n        // Everything checks out. Time to buy one.\n  \
    \  }\n\n}\n```\n\nThis example begins by checking the cost of pineapples. If it's\
    \ more than $9.99, the program skips over the entire conditional block and the\
    \ example is finished. But if it's less than $9.99, the program enters the conditional\
    \ block, where it performs a *second* test. This test checks if you have enough\
    \ money to buy the fruit you want. If that's also true, the program enters the\
    \ second conditional block.\n\n95"
  - "[PAGE 95]\n\nThis example works fine, but there’s another, more compact way to\
    \ write the same example. It looks like this:\n\n```\nif (costOfPineapples <=\
    \ 9.99 && moneyInWallet >= costOfPineapples {\n\n    // Everything checks out.\
    \ Time to buy one.\n\n}\n```\n\nNow both conditions are fused together into one\
    \ test, using the && symbol, which means *and*. In other words, the code in this\
    \ block only happens if the cost of pineapples is low enough *and* if you have\
    \ sufficient money.\n\nSo is this example better than the first version? It depends.\
    \ If you want to write some code that runs if pineapples are cheap, *no matter\
    \ what’s in your wallet*, then you need to use the first approach. (For example,\
    \ maybe you want to tell someone about the low price, and then make your decision\
    \ about whether to buy any.) But if you only need code that runs when both conditions\
    \ are true (cheap pineapples *and* full wallet), then using && makes your code\
    \ more compact and easier to read.\n\n> **NOTE** You might wonder why JavaScript\
    \ uses the && symbol to mean *and*. The truth is that this is just the way that\
    \ the JavaScript language is designed. It matches other finicky-syntax languages\
    \ like C, C#, and Java. But some other languages, like Visual Basic and Python,\
    \ use the actual word *and* instead of a symbol. (If you’re having trouble finding\
    \ the & key on your keyboard, hold down **Shift** and press 7.)"
  - "[PAGE 96]\n\nYou can and use && to combine even more than two conditions. In\
    \ fact, you can combine as many as you want, just keep adding && to the end, followed\
    \ by your new condition. Just remember to keep it all in between the parentheses.\n\
    \n```\nif (a != 0 && b !=0 && a > b && b < c) {\n    // a is not 0, b is not 0,\
    \ a is greater than b,\n    // and b is less than c.\n}\n```\n\n# Combining two\
    \ conditions (using 'or')\n\nWhen you use && you ask *Are both these conditions\
    \ true?* You can also ask *Is at least one of these conditions true?* For that\
    \ you need the || symbol, which means *or*.\n\n```\nif (costOfPineapples < 9.99\
    \ || costOfMangoes < 0.99) {\n    // As long as one of these fruits is cheap enough,\n\
    \    // it's worth a trip to the store.\n}\n```\n\nWhen you use ||, just one of\
    \ your conditions needs to be true to run the conditional block.\n\nDon't confuse\
    \ | with an L or I character. Technically, | is the pipe symbol. On most keyboards\
    \ you type it by holding down **Shift** and typing the backslash \\ (which you'll\
    \ find under the backspace key somewhere to the right)."
  - "[PAGE 97]\n\nHere's a table that summarizes how conditions are combined with\
    \ *and* and *or*:\n\n| Operator | If the first condition is... | And the second\
    \ condition is... | Result |\n| :--- | :--- | :--- | :--- |\n| **&&** | true |\
    \ true | true |\n| | true | false | false |\n| | false | true | false |\n| | false\
    \ | false | false |\n| **||** | true | true | true |\n| | true | false | true\
    \ |\n| | false | true | true |\n| | false | false | false |\n\n# # Try it yourself!\n\
    \n▶ **Predict the Future (Challenge Level: Medium)**\n\n[https://codepen.io/prosetech/pen/WNrmQzR](https://codepen.io/prosetech/pen/WNrmQzR)\n\
    \nIt's time to turn yourself into the JavaScript engine and run some mental code.\
    \ Take a look at this block of conditional logic, which uses `&&` and `||`. It's\
    \ a little trickier than it seems.\n\n```\nif (a == b && a > 0) {\n  alert(\"\
    You reached door 1\");\n}\nelse if (a != 0) {\n  alert(\"You reached door 2\"\
    );\n}\n```"
  - "[PAGE 98]\n\n```\nelse if (a > b || b == 0) {\n    alert(\"You reached door 3\"\
    );\n}\nelse {\n    alert(\"You reached door 4\");\n}\n```\n\nTry to predict what\
    \ will happen for the following values of a and b.\n\n| Value of a | Value of\
    \ b | Result (what message you see) |\n| :--- | :--- | :--- |\n| 42 | 5 | |\n\
    | 5 | 5 | |\n| 0 | 0 | |\n| 0 | 42 | |\n\nOnce you’ve made your predictions, try\
    \ out the actual program and see if you’re right. Did you remember the rule of\
    \ else if—you only get the *first* matching condition? That means you’ll only\
    \ see one alert box.\n\nThis example is designed to exercise your brain. When\
    \ you write conditional logic, it shouldn’t look like this. Instead, you should\
    \ take the effort to make your conditions clear and predictable. If it’s simpler\
    \ to split your conditions apart and write more if blocks, do that.\n\n# The switch\
    \ statement\n\nWhen you use the if statement, your code can become a bit long-winded.\
    \ JavaScript has another way to write conditional logic that’s more compact. It’s\
    \ the switch statement."
  - "[PAGE 99]\n\nThe switch statement is a more limited version of if. It only works\
    \ if you want to examine just one variable. For example, if you plan to ask the\
    \ question “what day of the week is it today?” and you want to write conditional\
    \ code for each day, the switch statement works great. But if you want to compare\
    \ different combinations of variables, as in the previous example, switch isn’t\
    \ much help.\n\n> NOTE There’s nothing that switch can do that if can’t do. So\
    \ why bother to use switch? It’s really a matter of your own taste, but if switch\
    \ works for you, you’ll usually get shorter, tidier code than you would with if.\n\
    \nTo use switch, you start by presenting the variable you want to examine, like\
    \ this:\n\n```\nswitch (dayOfTheWeek) {\n```\n\nNow you write conditional code\
    \ for the different values. Each one of these is a separate case, and you identify\
    \ them with the case keyword.\n\n```\ncase \"Saturday\":\n```\n\nIn the dayOfTheWeek\
    \ example, you’re expecting one of seven different day names. Each value is in\
    \ quotation marks because it’s a string. If you use switch with a variable that\
    \ holds a number, you wouldn’t use quotation marks.\n\nAfter you write case and\
    \ put the value you’re looking for (like “Saturday” or 478), you add a colon :\
    \ to start your conditional code.\n\n```\ncase \"Saturday\":\n  alert(\"It's Saturday.\
    \ Time to write some JavaScript!\");\n```"
  - "[PAGE 100]\n\nYou can write as many lines of code as you want for each case,\
    \ but you need to write break at the end.\n\n```\ncase \"Saturday\":\n  alert(\"\
    It's Saturday. Time to write some JavaScript!\");\n  break;\n```\n\nThis is different\
    \ than JavaScript's usual way of organizing things. Instead of putting your conditional\
    \ code between braces, you start it with : and end it with break.\n\nYou can also\
    \ write one bit of code that deals with several cases. To do that, you stack the\
    \ cases on top of each other, like this:\n\n```\ncase \"Tuesday\":\ncase \"Wednesday\"\
    :\ncase \"Thursday\":\n  alert(\"It's the middle of the week. Keep waiting\");\n\
    \  break;\n```\n\nHere's the complete days of the week example with switch:\n\n\
    ```\nswitch (dayOfTheWeek) {\n  case \"Saturday\":\n    alert(\"It's Saturday.\
    \ Time to write some JavaScript!\");\n    break;\n  case \"Sunday\":\n    alert(\"\
    It's Sunday. Last day to write some JavaScript!\");\n    break;\n  case \"Tuesday\"\
    :\n  case \"Wednesday\":\n  case \"Thursday\":\n    alert(\"It's the middle of\
    \ the week. Keep waiting.\");\n    break;\n  case \"Friday\":\n    alert(\"Almost\
    \ there...\");\n    break;\n}\n```"
- md: "## Try it yourself!\n\n### The Goblin Dice Gambler (Challenge Level: Medium)\n\
    \nhttps://codepen.io/prosetech/pen/pogGGOg\n\nDid we convince you that using `switch`\
    \ can be faster than using `if`? In this exercise, you'll get to see the difference\
    \ for yourself. You're going to take a prewritten game about a gambling goblin\
    \ and rewrite its `if` block to use `switch` instead.\n\nYou can't beat *me* at\
    \ a game of chance!\n\nRoll 'Em Good!\n\nTry Again\n\nYou lost $150. You now have\
    \ $4.\n\nBefore you get started, take a moment to figure out how the code is organized.\
    \ You'll find more than one conditional block in this example. The first section\
    \ of conditional code checks the number that you rolled. This is the part you\
    \ need to change. (The other section of conditional code figures out if you've\
    \ won or lost the game.)\n\nOnce you've finished your work, you can enjoy the\
    \ rest of the program. Who knows, maybe you'll even make a few changes of your\
    \ own!\n\nIf you look closely, you’ll find a couple of tricks you haven’t seen\
    \ before.\n\nFirst, the code “rolls” the dice by getting a random number. That\
    \ needs the help of a special object called Math, and you’ll learn all about it\
    \ in Chapter 13.\n\nSecond, the code sets the dice picture to match the number\
    \ you rolled using a variation of the picture-changing trick from Chapter 5. For\
    \ example, if you roll a 3, the code turns that number into the picture file *dice3.png*.\
    \ Put that in an <img> element, and you get the picture that shows the dice roll.\
    \ Not too shabby!\n\n## Chapter 9\n## Repeating Yourself with Loops\n\nComputers\
    \ never get tired. If you give them a job, they keep at it until it's done. If\
    \ you want to calculate a formula, they don't care whether it's once or a thousand\
    \ times in a row. And in this chapter, you'll see just how easy it is to make\
    \ your code do something a thousand times in row. All you need is a loop.\n\n\
    ## The simplest possible loop\n\nJavaScript has several different types of loops.\
    \ All of them share one thing in common—you put the code you want to repeat in\
    \ between braces { }.\n\nHere's a simple example with something called a while\
    \ loop:\n\n```\n// Don't try this at home.\nwhile (true) {\n\n    alert(\"Welcome\
    \ to Groundhog Day.\");\n\n}\n```\n\nThe while keyword starts the loop:\n\n```\n\
    while\n```\n\nImmediately after that are the parentheses () where you put a condition.\
    \ The condition tells the loop when to end.\n\n```\nwhile ()\n```\n\nIn this example,\
    \ the condition is just true, which means the loop never ends.\n\n```\nwhile (true)\n\
    ```\n\nAfter the condition are the braces { } that hold the code you want to repeat.\n\
    \n```\nwhile (true) {\n}\n```\n\nSo what does JavaScript do when it meets a loop\
    \ like this? Here's a breakdown:\n\n1.  JavaScript checks the loop condition.\n\
    2.  If the condition evaluates to true, JavaScript starts the code in the loop.\n\
    3.  JavaScript runs all the code statements in the braces from top to bottom.\
    \ In this example, there's just one code statement in the loop. It shows an alert\
    \ box with a message about Groundhog Day.\n4.  JavaScript returns to the first\
    \ step and starts the process over.\n\nAs long as the condition is true, JavaScript\
    \ keeps re-running the code in the loop. In this example, the condition stays\
    \ true *forever*, which means a new alert box appears every time you close the\
    \ last one. (But remember, the alert() command pauses your code until you click\
    \ OK. That means you'll never see more than one alert box pop up at the same time.)\n\
    \nThis never-ending sequence of alert boxes lasts until you end the program by\
    \ closing the browser tab or refreshing the page.\n\n## A loop that counts\n\n\
    A loop that carries on forever is called an *infinite loop*. In a real program,\
    \ you would never create an infinite loop on purpose. Instead, you'd use a condition\
    \ that eventually turns false, ending the loop and letting JavaScript continue\
    \ to the rest of your code.\n\nThe simplest approach is to make a loop that runs\
    \ an exact number of times. You decide how many times the loop should repeat its\
    \ code, and you use a variable to enforce it.\n\nFor example, you might create\
    \ a variable named counter:\n\n```\nlet counter = 0;\n```\n\nIt’s important that\
    \ you create this variable *before* the loop, not *inside* the loop.\n\nYou use\
    \ your counter to keep track of what’s happening. Each time the loop runs its\
    \ code, you add one to your counter. Basically, you’re counting the number of\
    \ times the loop repeats.\n\nThe counting code goes in the loop:\n\n```\ncounter\
    \ = counter + 1;\n```\n\nThe final ingredient is a condition that tells the loop\
    \ when to stop. For example, you might tell JavaScript to repeat the loop while\
    \ the counter is less than 10:\n\n```\nwhile (counter < 10)\n```\n\nWhen a loop\
    \ ends, JavaScript continues to run whatever code is after the loop.\n\nProper\
    \ counting is important. People sometimes get tripped by the fact that most counters\
    \ start at 0, or they’re not sure whether to use < or <=. But you don’t need to\
    \ take my word on it. Try this next example to see for yourself how many times\
    \ a loop repeats.\n\n## Try it yourself!\n\n> Predict the Future (Challenge Level:\
    \ Easy)\n\nhttps://codepen.io/prosetech/pen/qBNygyg\n\nHere’s a loop that shows\
    \ alert boxes. It creates a variable named counter to keep track of how many times\
    \ it goes around the loop:\n\n```\nlet counter = 0;\n\nwhile (counter < 10) {\n\
    \    counter = counter + 1;\n    alert(counter);\n}\n```\n\nYour challenge is\
    \ to run the code in your brain. Go line by line, one loop at a time, to figure\
    \ out what’s going to happen. What sequence of alert boxes will you see before\
    \ the code ends?\n\nNow try changing the < to <=. What changes?\n\n## Try it yourself!\n\
    \n> Put It In Reverse (Challenge Level: Medium)\n\nhttps://codepen.io/prosetech/pen/qBNygyg\n\
    \nThe most common type of counter is one that starts at 0 and continues upward.\
    \ But JavaScript doesn’t limit you. For example, you could make a counter that\
    \ increases by fives. Or, you could create a counter that counts down from a maximum\
    \ value.\n\nYour next challenge is to revisit the ordinary loop you saw in the\
    \ previous exercise, and switch it around. Make it count down from 10. However,\
    \ make sure you see the same number of alert boxes as you did before. (Obviously,\
    \ the order of the alert boxes is going to be reversed.)\n\nThere's more than\
    \ one way to solve this problem, but all the solutions are similar.\n\n> **HINT**\
    \ There are two changes you need to make a count-down loop. You need to change\
    \ the statement that changes the counter. Instead of increasing it by 1, you need\
    \ to *reduce* it by 1. You also need to change your condition so that it keeps\
    \ going while the counter is above 0.\n\n## Putting the condition at the end\n\
    \nMost programming languages have more than one type of loop, and JavaScript is\
    \ no exception. You've just learned about the `while` loop, which makes this the\
    \ perfect time to tell you about the very similar, but slightly rearranged, `do\
    \ while` loop.\n\nHere's the `do while` version of the 1-to-10 counting loop you\
    \ saw before:\n\n```\nlet counter = 0;\n\ndo {\n    counter = counter + 1;\n \
    \   alert(counter);\n} while (counter < 10);\n```\n\nAs you can see, the `do while`\
    \ loop puts the condition at the *end* of the loop. It also adds a semicolon (;)\
    \ after the condition, which is another weird detail you just need to remember.\n\
    \nAlthough the `do while` loop looks a little different than the earlier example,\
    \ it has the same effect. That probably makes you wonder—why is there another\
    \ way to code the same loop? The answer is that sometimes the `do while` loop\
    \ *does* have a different result than the `while` loop. Here’s why.\n\nWhen you\
