    # # Chapter 2

    ## How Events Work


    One of the tricky things about learning JavaScript is that it''s all tied up with
    web pages. In order to get even the simplest program to run, you need to know
    a bit about HTML and how an HTML element can trigger something called an *event*.
    Let''s investigate.


    # ## A really quick HTML review


    If you know HTML, you know that every web page is made out of elements. For example,
    the `<p>` element is for paragraphs, the `<img>` element is for pictures, the
    `<h1>` element is for big headings, the `<button>` element is for buttons, and
    so on.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_32_0.png)'
  - '[PAGE 33]


    When you write a web page, all these elements seem like ordinary pieces of your
    web page that never change. But in the eyes of JavaScript, they’re a lot more
    interesting. Each element pays attention to what you’re doing. If you move your
    mouse over a picture, click a button, or start typing in a text box, JavaScript
    notices.


    This is where events come into the picture.


    # How events work


    JavaScript uses events to tell your code when something happens. For example,
    if you want to know when someone clicks a button, you can pay attention to an
    event JavaScript calls `onclick`.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_33_0.png)


    In other words, events are the glue that connects HTML elements to your code.
    So how do you use them? You need to have three ingredients:


    +   1. You need to have an element that *triggers* the event. For example, if
    you want your code to run when someone clicks a button, you need a <button> element.

    2. The code you want to run needs to be in a function, like the `showMessage()`
    function you saw earlier.

    3. You need to connect the element to the function. You do this by adding a special
    event attribute to your element. That’s the secret sauce.'
