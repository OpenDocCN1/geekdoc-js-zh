    \n这个练习的目的只是为了了解函数是如何工作的。在现实生活中，你的函数不会是只显示消息的一行代码。但一旦你知道如何调用一个超级短的函数，你就知道如何调用一个更长的函数，因为它们的工作原理完全相同。\n\
    \n另外，验证你对代码的假设是一项程序员必备技能。奇怪的错误常常发生，因为你的代码并没有按照你认为的方式在运行。\n\n最后，你可能想试试这个测试。如果你调用一个调用自身的函数会发生什么？或者如果函数A()调用B()，而B()又调用A()呢？\n\
    \n## 获取数据的函数\n\n正如你已经看到的，每次调用函数时，你都会在函数名后加上一对括号（）。它们不仅仅是为了装饰。它们还允许你向函数发送一个或多个数据块。每个数据块被称为一个*参数*。\n\
    \n为了让这项技术起作用，你的函数必须设计为接受参数。很多函数都是如此。一个例子就是你已经使用了很多次的alert()函数。你用字符串发送你想要显示的消息：\n\
    \n```\nalert(\"Hello from the alert function.\");\n```\n\n要创建一个接受参数的函数，你需要声明它们。例如，看看这个不带参数的showMessage()函数的简单版本：\n\
    \n```\nfunction showMessage() {\n    alert(\"Greetings from the showMessage()\
    \ function.\");\n}\n```\n\n要添加一个参数，你需要把它放在函数名后的括号之间：\n\n```\nfunction showMessage(guestName)\
    \ {\n    alert(\"Greetings from the showMessage() function.\");\n}\n```\n\n添加参数就像定义一个变量。事实上，guestName参数*就是*一个变量——它是一个容器，将保存发送给showMessage()函数的数据。唯一的区别是你不使用let关键字。\n\
    \n现在，当你在程序的其他地方调用showMessage()时，你可以提供guestName数据：\n\n```\nfunction doSomething()\
