    # Copying variables


    You''ve already seen how you can put a value in a variable. But that''s only the
    beginning. You can also copy a value from one variable to another. Here''s an
    example:


    ```

    let myFavoriteColor = "green";

    let yourFavoriteColor = "orange";


    yourFavoriteColor = myFavoriteColor;


    // What is your favorite color now?

