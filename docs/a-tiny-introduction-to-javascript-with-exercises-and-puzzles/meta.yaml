    text.


    Once you get to this point, try out the example and make sure it works. When everything
    is in place, it’s time to finish your example with some important extra details:


    +   1. Keep track of the number of guesses using the global `numberOfGuesses`
    variable.

    2. After a wrong guess, check if you’ve reached the maximum number of guesses
    (4). If you have, show a “game over” message (and tell the guesser what the number
    was).

    3. After every guess, say how many guesses are left. You can add this information
    to the end of the message you show.

    4. After losing the game, reset `numberOfGuesses` to 0, and pick a new random
    number. You don’t need to write your random logic again—instead, just call the
    `pickNumber()` function.


    If you complete all these tasks, you will have a truly epic number guessing game.'
