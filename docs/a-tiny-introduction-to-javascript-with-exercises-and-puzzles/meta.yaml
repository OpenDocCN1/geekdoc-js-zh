    Chapter 3


    # Storing Information in Variables


    Every program—small or big—needs to keep track of information. What’s the user’s
    name? What’s the price of those socks you’re selling? How many zombies are attacking
    the player every minute?


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_38_0.png)


    To store a piece of information, you use a *variable*.


    # Declaring a variable


    A variable is a container with a name. You get to pick the name when you create
    the variable. This is called *declaring* the variable. Once you’ve declared it,
    you can put what you want inside it.


    The simplest way to declare a variable is with JavaScript’s `let` keyword, like
    this:


    ```

    let NumberOfZombies;

    ```


    This creates a variable called `NumberOfZombies`. Notice that you can’t put spaces
    in a variable name, but you can use capital letters to make a variable name *look*
    like it has more than one word in it. Just remember that JavaScript pays attention
    to capitalization, so `NumberOfZombies` and `numberOfZombies` are actually two
    completely different names. That also means they’re two completely separate containers
    for storing information.'
- md: '## Putting a value in a variable


    To put information in a variable, you use the equal sign. Here’s an example that
    creates a variable named `age` and puts the number 12 into it. This is called
    *assigning* a value.


    ```

    let age;

    age = 12;

    ```


    You can think of the equal sign as being like an arrow that takes a value (from
    the right side) and stuffs it into a variable (on the left side of your statement).


    ```

    age ← 12

    ```


    You can even create a variable with `let` and assign in the same line, like this:


    ```

    let age = 12;

    ```


    Every variable can hold exactly one value. When you assign a value to a variable,
    you replace whatever was there before. Look at this example:


    ```

    let mysteryNumber = 5;

    mysteryNumber = 1;

    mysteryNumber = 15;

    mysteryNumber = 20;

    ```


    What’s inside the `mysteryNumber` variable when this code ends? Why, it’s the
    number 20, of course. All the other numbers were tossed out when they were replaced.


    > NOTE Remember, you only declare a variable once (with `let`). But you can assign
    a value to your variable as often as you want. The same is true of buckets—buy
    a bucket once, and you can change what’s inside anytime.


    ## Using numbers and text


    JavaScript understands many different types of information. The two most basic
    types are numbers and text.


    Let’s take a look at three different variables that hold three different numbers:


    ```

    let ageOfDad = 42;

    let costOfSocks = 24.99;

    let temperatureInSiberia = -30;

    ```


    Notice that you can use negative numbers and decimal values. You don’t use units
    or other symbols (like $ signs, commas, or the % percent symbol).


    Now here’s a variable that holds a piece of text:


    ```

    let messageToMyEnemy = "Despair! You have coded your last variable!";

    ```


    The text (in this case, *Despair! You have coded your last variable!*) is called
    a *string*. A string could have a single letter in it, some random words, or a
    whole paragraph.


    When you create a string, you use quotation marks to show where your text starts
    and where it ends. You can put as much text as you want in between the quotation
    marks.


    > NOTE You might wonder how you tell the difference between variables that have
    numbers in them and variables that have strings in them. The answer is, you don’t.
    You just need to remember what you’re doing and be consistent. (Other programming
    languages are more strict, and force you to say what type of data belongs in each
    variable you create. That strictness can help programmers avoid painful mistakes.)


    ## Try it yourself!


    ▶ **Predict the Future (Challenge Level: Easy)**


    [https://codepen.io/prosetech/pen/KKzgzWQ](https://codepen.io/prosetech/pen/KKzgzWQ)


    You can use a variable in any place that you''d type an ordinary number or piece
    of text. For example, you''ve already used the alert() function like this:


    ```

    alert("Welcome.");

    ```


    In this example, the text "Welcome" is an ordinary value—also known as a literal
    value (because it''s literally what it says it is). But you can also use alert()
    with a variable, like this:


    ```

    let welcomeMessage = "I am not at all happy to see you.";

    alert(welcomeMessage);


    welcomeMessage = "Please leave.";

    alert(welcomeMessage);

    ```


    Here''s a question: what will these two alert boxes say? If you guessed they''ll
    both show "welcomeMessage", you''d better try out the example for yourself.


    ## Optional Putting quotation marks in a string


    Quotation marks show the beginning and end of every text value. But what happens
    if you want to put an actual quotation mark inside your string? For example, what
    if you want to have a string that holds the text The movie "Titanic" is my favorite?


    This won''t work:


    ```

    let favoriteMovie = "The movie "Titanic" is my favorite";

    ```


    The problem is JavaScript assumes that the quotation mark just before the world
    *Titanic* is ending the string, making it just *The movie*.


    The solution is to write \\" instead of just " when you want to include a quotation
    mark inside your string. The backwards slash is a sort of secret code that gets
    JavaScript’s attention. You can find it above the **Enter** key on most keyboards.


    Here’s the corrected example:


    ```

    let favoriteMovie = "The movie \"Titanic\" is my favorite";

    ```


    This works, but now there’s another potential problem. What happens if you want
    to create a string with a backwards slash in it? JavaScript assumes a backward
    slash is the start of a secret code, so you’re right back at the same problem
    you started with. Fortunately, there’s an escape hatch. Use two backslashes in
    a row, like \\\\. Weirdly enough, that’s a special JavaScript code that means
    “insert one backslash.”


    ## Good variable names


    Plenty of disasters happen because programmers pick bad or lazy names for their
    variables. For example, you might be tempted to use `Number` or `num` instead
    of `numberOfZombies`. If you do, your code will still work, but it will be much
    harder for other people to understand it. (It might also be harder for *you* to
    understand if you forget about it for a few months and then look at it later.)


    It’s also important to be as consistent as possible. There are many different
    ways to name the same variable. For example, `AgeOfPetDog`, `ageOfPetDog`, `DogAge`,
    `age`, and `DogAgeInYears` are different names for the same information.


    In this book, the variable and function names usually start with a lowercase letter.
    This is the most common style in JavaScript, but it’s not universal. If you’re
    working with a team of programmers, you might have different naming guidelines
    you need to follow. Otherwise, it’s up to you to keep things tidy.


    ## Try it yourself!


    ▶ **Hello, Ninja! (Challenge Level: Easy)**


    [https://codepen.io/prosetech/pen/rNeMewQ](https://codepen.io/prosetech/pen/rNeMewQ)


    The *Hello, Ninja!* program is as boring as you can get. It shows a message when
    you click a button. But right now it doesn''t use any variables. You''re going
    to change that.


    Here''s what you need to do:


    - Declare a variable for the greeting message (let''s call it `ninjaMessage`).

    - Put the greeting message in the variable.

    - Use your variable when you call `alert()`.


    The program will still work in exactly the same way when you''re finished. The
    goal of this example is for you to get a little bit of practice using variables
    before you go deeper.


    Can you use a variable that doesn''t exist? That depends.


    This is the right way to use a variable:


    ## Variables that don''t exist


    ```

    let welcomeText;

    welcomeText = "Hello there.";

    ```


    You can also combine *declaring* the variable and *assigning* the variable in
    one statement. So this code is equally as good:


    ```

    let welcomeText = "Hello there.";

    ```


    But this, on its own, is not good:


    ```

    welcomeText = "Hello there.";

    ```


    The problem is simple: It''s never OK to use a variable without declaring it first
    with the `let` keyword.


    Here''s where things get a little weird. When JavaScript was first created, no
    one knew it was going to become so popular and important. JavaScript was built
    to be casual and tolerate some sloppiness. So if you try to use a variable that
    you haven''t created, JavaScript creates it for you *automatically*. Nice, right?


    Not nice.


    The problem is that automatically creating variables sets you up to make all kinds
    of mistakes that can break your code. Like when you use a variable named `welcomeText`
    in one part of your program, and you use a variable named `WelcomeText` somewhere
    else, without realizing you''ve accidentally created two separate variables that
    have different information in them. Yikes!


    To really understand this problem, you need to take a closer look in the next
    exercise.


    ## Try it yourself!


    ▶ **Find the Impostor (Challenge Level: Medium)**


    [https://codepen.io/prosetech/pen/yLOaOxR](https://codepen.io/prosetech/pen/yLOaOxR)


    In the *Find the Impostor* example, there are three friendly ninjas ready to greet
    you, each with its own button. But before you click anything, check out the code,
    because all is not as it seems.


    Variable names can use letters, numbers (just not at the beginning), the underscore
    _ character, and the dash - character. But for simplicity’s sake, you should probably
    stick to just using letters, like most other programmers.


    You might wonder why JavaScript’s variable-creation keyword is named `let`. The
    short answer is that `let` is borrowed from mathematical notation, where people
    say “let this variable have this value.” (Also, the `var` keyword was already
    used in old-fashioned JavaScript. It does the same thing as `let`, but has some
    weird quirks, so these days people much prefer to use `let` instead.) You can
    think of `let` as your personal command, a way of saying “let this variable be
    summoned to do my bidding!”'
