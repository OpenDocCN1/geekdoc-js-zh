    here’s a better way to serve the jellybeans:


    +   - If there are beans in the bowl, dish one out (as usual).

    - If there are no beans left in the bowl, show an alert box explaining the problem.


    # Conditional logic with unlimited possibilities


    First you started with one conditional block. Then you used `else` to combine
    two blocks. Now you’ll learn a technique that lets you stack an unlimited number
    of conditions, one after the other.


    The secret is a combination called `else if`. You use `else if` to consider another
    condition. But here’s the trick: `else if` only checks its condition if the previous
    condition didn’t match.'
