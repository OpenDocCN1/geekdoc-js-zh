    \ the loop runs), but you don’t use the years variable in the loop condition.\n\
    \n## Try it yourself!\n\n## Million Dollar Pizza II (Challenge Level: Hard)\n\n\
    https://codepen.io/prosetech/pen/NWrBZWg\n\nIf you want to show off, here’s another\
    \ challenge that builds on the first version of Million Dollar Pizza.\n\nFirst,\
    \ try the original program (the one you wrote in the last exercise) using different\
    \ amounts of money or interest. Play around long enough, and you’ll notice a big\
    \ problem. If the amount you owe is growing faster than the amount you make, the\
    \ loop you wrote becomes an infinite loop. That’s because there’s no way to pay\
