  md: '# # Chapter 2

    ## How Events Work


    One of the tricky things about learning JavaScript is that it''s all tied up with
    web pages. In order to get even the simplest program to run, you need to know
    a bit about HTML and how an HTML element can trigger something called an *event*.
    Let''s investigate.


    # ## A really quick HTML review


    If you know HTML, you know that every web page is made out of elements. For example,
    the `<p>` element is for paragraphs, the `<img>` element is for pictures, the
    `<h1>` element is for big headings, the `<button>` element is for buttons, and
    so on.


