    slash is the start of a secret code, so you’re right back at the same problem
    you started with. Fortunately, there’s an escape hatch. Use two backslashes in
    a row, like \\\\. Weirdly enough, that’s a special JavaScript code that means
    “insert one backslash.”


    # Good variable names


