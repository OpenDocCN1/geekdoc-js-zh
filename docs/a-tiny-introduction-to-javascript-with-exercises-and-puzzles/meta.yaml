- md: "## More Decision Making\n\nThe `if` and `else` keywords give you everything\
    \ you need to make decisions in your code. But sometimes conditional logic can\
    \ get messy. You decide to check one variable, then another, and the next thing\
    \ you know your code is buried somewhere in a wall of braces { }.\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_94_0.png)\n\
    \nDon't panic. You can learn to write code that makes decisions but keeps the\
    \ confusion under control. Here are some tools that can help.\n\n## Combining\
    \ two conditions (using ‘and’)\n\nA conditional block of code is like any other\
    \ block of code. Inside it, you can create variables, show alert boxes, and interact\
    \ with the page. You can even put one `if` block inside *another* `if` block,\
    \ like this:\n\n```\n// I don't want to spend more than $10 for a pineapple.\n\
    if (costOfPineapples <= 9.99) {\n\n    // But wait, do I even have enough money?\n\
    \    if (moneyInWallet >= costOfPineapples) {\n        // Everything checks out.\
    \ Time to buy one.\n    }\n\n}\n```\n\nThis example begins by checking the cost\
    \ of pineapples. If it's more than $9.99, the program skips over the entire conditional\
    \ block and the example is finished. But if it's less than $9.99, the program\
    \ enters the conditional block, where it performs a *second* test. This test checks\
    \ if you have enough money to buy the fruit you want. If that's also true, the\
    \ program enters the second conditional block.\n\nThis example works fine, but\
    \ there’s another, more compact way to write the same example. It looks like this:\n\
    \n```\nif (costOfPineapples <= 9.99 && moneyInWallet >= costOfPineapples) {\n\n\
    \    // Everything checks out. Time to buy one.\n\n}\n```\n\nNow both conditions\
    \ are fused together into one test, using the && symbol, which means *and*. In\
    \ other words, the code in this block only happens if the cost of pineapples is\
    \ low enough *and* if you have sufficient money.\n\nSo is this example better\
    \ than the first version? It depends. If you want to write some code that runs\
    \ if pineapples are cheap, *no matter what’s in your wallet*, then you need to\
    \ use the first approach. (For example, maybe you want to tell someone about the\
    \ low price, and then make your decision about whether to buy any.) But if you\
    \ only need code that runs when both conditions are true (cheap pineapples *and*\
    \ full wallet), then using && makes your code more compact and easier to read.\n\
    \n> **NOTE** You might wonder why JavaScript uses the && symbol to mean *and*.\
    \ The truth is that this is just the way that the JavaScript language is designed.\
    \ It matches other finicky-syntax languages like C, C#, and Java. But some other\
    \ languages, like Visual Basic and Python, use the actual word *and* instead of\
    \ a symbol. (If you’re having trouble finding the & key on your keyboard, hold\
    \ down **Shift** and press 7.)\n\nYou can use && to combine even more than two\
    \ conditions. In fact, you can combine as many as you want, just keep adding &&\
    \ to the end, followed by your new condition. Just remember to keep it all in\
    \ between the parentheses.\n\n```\nif (a != 0 && b != 0 && a > b && b < c) {\n\
    \    // a is not 0, b is not 0, a is greater than b,\n    // and b is less than\
    \ c.\n}\n```\n\n## Combining two conditions (using 'or')\n\nWhen you use && you\
    \ ask *Are both these conditions true?* You can also ask *Is at least one of these\
    \ conditions true?* For that you need the || symbol, which means *or*.\n\n```\n\
    if (costOfPineapples < 9.99 || costOfMangoes < 0.99) {\n    // As long as one\
    \ of these fruits is cheap enough,\n    // it's worth a trip to the store.\n}\n\
    ```\n\nWhen you use ||, just one of your conditions needs to be true to run the\
    \ conditional block.\n\nDon't confuse | with an L or I character. Technically,\
    \ | is the pipe symbol. On most keyboards you type it by holding down **Shift**\
    \ and typing the backslash \\ (which you'll find under the backspace key somewhere\
    \ to the right).\n\nHere's a table that summarizes how conditions are combined\
    \ with *and* and *or*:\n\n| Operator | If the first condition is... | And the\
    \ second condition is... | Result |\n| :--- | :--- | :--- | :--- |\n| **&&** |\
    \ true | true | true |\n| | true | false | false |\n| | false | true | false |\n\
    | | false | false | false |\n| **\\|\\|** | true | true | true |\n| | true | false\
    \ | true |\n| | false | true | true |\n| | false | false | false |\n\n## Try it\
    \ yourself!\n\n### ▶ **Predict the Future (Challenge Level: Medium)**\n\n[https://codepen.io/prosetech/pen/WNrmQzR](https://codepen.io/prosetech/pen/WNrmQzR)\n\
    \nIt's time to turn yourself into the JavaScript engine and run some mental code.\
    \ Take a look at this block of conditional logic, which uses `&&` and `||`. It's\
    \ a little trickier than it seems.\n\n```\nif (a == b && a > 0) {\n  alert(\"\
    You reached door 1\");\n}\nelse if (a != 0) {\n  alert(\"You reached door 2\"\
    );\n}\nelse if (a > b || b == 0) {\n    alert(\"You reached door 3\");\n}\nelse\
    \ {\n    alert(\"You reached door 4\");\n}\n```\n\nTry to predict what will happen\
    \ for the following values of a and b.\n\n| Value of a | Value of b | Result (what\
    \ message you see) |\n| :--- | :--- | :--- |\n| 42 | 5 | |\n| 5 | 5 | |\n| 0 |\
    \ 0 | |\n| 0 | 42 | |\n\nOnce you’ve made your predictions, try out the actual\
    \ program and see if you’re right. Did you remember the rule of else if—you only\
    \ get the *first* matching condition? That means you’ll only see one alert box.\n\
    \nThis example is designed to exercise your brain. When you write conditional\
    \ logic, it shouldn’t look like this. Instead, you should take the effort to make\
    \ your conditions clear and predictable. If it’s simpler to split your conditions\
    \ apart and write more if blocks, do that.\n\n## The switch statement\n\nWhen\
    \ you use the if statement, your code can become a bit long-winded. JavaScript\
    \ has another way to write conditional logic that’s more compact. It’s the switch\
    \ statement.\n\nThe switch statement is a more limited version of if. It only\
    \ works if you want to examine just one variable. For example, if you plan to\
    \ ask the question “what day of the week is it today?” and you want to write conditional\
    \ code for each day, the switch statement works great. But if you want to compare\
    \ different combinations of variables, as in the previous example, switch isn’t\
    \ much help.\n\n> **NOTE** There’s nothing that switch can do that if can’t do.\
    \ So why bother to use switch? It’s really a matter of your own taste, but if\
    \ switch works for you, you’ll usually get shorter, tidier code than you would\
    \ with if.\n\nTo use switch, you start by presenting the variable you want to\
    \ examine, like this:\n\n```\nswitch (dayOfTheWeek) {\n```\n\nNow you write conditional\
    \ code for the different values. Each one of these is a separate case, and you\
    \ identify them with the case keyword.\n\n```\ncase \"Saturday\":\n```\n\nIn the\
    \ dayOfTheWeek example, you’re expecting one of seven different day names. Each\
    \ value is in quotation marks because it’s a string. If you use switch with a\
    \ variable that holds a number, you wouldn’t use quotation marks.\n\nAfter you\
    \ write case and put the value you’re looking for (like “Saturday” or 478), you\
    \ add a colon : to start your conditional code.\n\n```\ncase \"Saturday\":\n \
    \ alert(\"It's Saturday. Time to write some JavaScript!\");\n```\n\nYou can write\
    \ as many lines of code as you want for each case, but you need to write break\
    \ at the end.\n\n```\ncase \"Saturday\":\n  alert(\"It's Saturday. Time to write\
    \ some JavaScript!\");\n  break;\n```\n\nThis is different than JavaScript's usual\
    \ way of organizing things. Instead of putting your conditional code between braces,\
    \ you start it with : and end it with break.\n\nYou can also write one bit of\
    \ code that deals with several cases. To do that, you stack the cases on top of\
    \ each other, like this:\n\n```\ncase \"Tuesday\":\ncase \"Wednesday\":\ncase\
    \ \"Thursday\":\n  alert(\"It's the middle of the week. Keep waiting\");\n  break;\n\
    ```\n\nHere's the complete days of the week example with switch:\n\n```\nswitch\
    \ (dayOfTheWeek) {\n  case \"Saturday\":\n    alert(\"It's Saturday. Time to write\
    \ some JavaScript!\");\n    break;\n  case \"Sunday\":\n    alert(\"It's Sunday.\
    \ Last day to write some JavaScript!\");\n    break;\n  case \"Tuesday\":\n  case\
    \ \"Wednesday\":\n  case \"Thursday\":\n    alert(\"It's the middle of the week.\
    \ Keep waiting.\");\n    break;\n  case \"Friday\":\n    alert(\"Almost there...\"\
    );\n    break;\n}\n```"
  mdcn: "\n## 更多决策技巧\n\n`if` 和 `else` 关键字为你提供了在代码中做出决策所需的一切。但有时条件逻辑可能会变得混乱。你决定检查一个变量，然后是另一个，结果不知不觉中，你的代码就淹没在一堵大括号\
    \ `{ }` 的墙里。\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_94_0.png)\n\n别慌。你可以学会编写既能让代码做出决策，又能控制混乱的代码。这里有一些可以提供帮助的工具。\n\
    \n## 合并两个条件（使用 'and'）\n\n一个条件代码块就像任何其他代码块一样。在其中，你可以创建变量、显示警告框以及与页面交互。你甚至可以将一个\
    \ `if` 块放在*另一个* `if` 块内部，像这样：\n\n```\n// I don't want to spend more than $10 for\
    \ a pineapple.\nif (costOfPineapples <= 9.99) {\n\n    // But wait, do I even\
    \ have enough money?\n    if (moneyInWallet >= costOfPineapples) {\n        //\
    \ Everything checks out. Time to buy one.\n    }\n\n}\n```\n\n这个例子首先检查菠萝的价格。如果价格超过\
    \ 9.99 美元，程序会跳过整个条件块，示例结束。但如果价格低于 9.99 美元，程序会进入条件块，并在那里执行*第二次*测试。这次测试检查你是否有足够的钱来购买你想要的水果。如果这也成立，程序会进入第二个条件块。\n\
    \n这个例子工作正常，但还有另一种更简洁的方式来编写相同的例子。它看起来像这样：\n\n```\nif (costOfPineapples <= 9.99\
    \ && moneyInWallet >= costOfPineapples) {\n\n    // Everything checks out. Time\
    \ to buy one.\n\n}\n```\n\n现在，两个条件通过 && 符号融合成一个测试，这个符号表示 *and*。换句话说，只有当菠萝的价格足够低*并且*你有足够的钱时，这个代码块中的代码才会执行。\n\
    \n那么这个例子比第一个版本更好吗？这取决于情况。如果你想编写一些代码，只要菠萝便宜就运行，*无论你钱包里有什么*，那么你需要使用第一种方法。（例如，也许你想告诉某人低价信息，然后再决定是否购买。）但如果你只需要在两个条件都成立时（菠萝便宜*并且*钱包满满）运行的代码，那么使用\
    \ && 可以让你的代码更紧凑、更易读。\n\n> **注意** 你可能想知道为什么 JavaScript 使用 && 符号来表示 *and*。事实是，这仅仅是\
    \ JavaScript 语言的设计方式。它与其他对语法要求严格的语言（如 C、C# 和 Java）相匹配。但其他一些语言，如 Visual Basic 和\
    \ Python，使用的是实际的单词 *and* 而不是符号。（如果你在键盘上找不到 & 键，可以按住 **Shift** 键并按 7。）\n\n你可以使用\
    \ && 来组合两个以上的条件。事实上，你可以组合任意多个条件，只需在末尾不断添加 &&，后跟你的新条件。只需记住将所有内容都放在括号内。\n\n```\n\
    if (a != 0 && b != 0 && a > b && b < c) {\n    // a is not 0, b is not 0, a is\
    \ greater than b,\n    // and b is less than c.\n}\n```\n\n## 合并两个条件（使用 'or'）\n\
    \n当你使用 && 时，你是在问 *这两个条件都为真吗？* 你也可以问 *这些条件中至少有一个为真吗？* 这需要用到 || 符号，它表示 *or*。\n\n\
    ```\nif (costOfPineapples < 9.99 || costOfMangoes < 0.99) {\n    // As long as\
    \ one of these fruits is cheap enough,\n    // it's worth a trip to the store.\n\
    }\n```\n\n当你使用 || 时，只需要其中一个条件为真，就会运行条件块。\n\n不要把 | 和字母 L 或 I 混淆。技术上说，| 是管道符号。在大多数键盘上，你可以按住\
    \ **Shift** 键并输入反斜杠 \\（在退格键下方靠右的位置）来输入它。\n\n下表总结了如何用 *and* 和 *or* 组合条件：\n\n| 运算符\
    \ | 如果第一个条件是... | 并且第二个条件是... | 结果 |\n| :--- | :--- | :--- | :--- |\n| **&&**\
    \ | true | true | true |\n| | true | false | false |\n| | false | true | false\
    \ |\n| | false | false | false |\n| **\\|\\|** | true | true | true |\n| | true\
    \ | false | true |\n| | false | true | true |\n| | false | false | false |\n\n\
    ## 亲自试试看！\n\n### ▶ **预测未来（挑战难度：中等）**\n\n[https://codepen.io/prosetech/pen/WNrmQzR](https://codepen.io/prosetech/pen/WNrmQzR)\n\
    \n是时候把自己变成 JavaScript 引擎，在脑海中运行一些代码了。看看这段使用 `&&` 和 `||` 的条件逻辑代码块。它比看起来要复杂一些。\n\
    \n```\nif (a == b && a > 0) {\n  alert(\"You reached door 1\");\n}\nelse if (a\
    \ != 0) {\n  alert(\"You reached door 2\");\n}\nelse if (a > b || b == 0) {\n\
    \    alert(\"You reached door 3\");\n}\nelse {\n    alert(\"You reached door 4\"\
    );\n}\n```\n\n尝试预测当 a 和 b 为以下值时会发生什么。\n\n| a 的值 | b 的值 | 结果（你看到的消息） |\n| :---\
    \ | :--- | :--- |\n| 42 | 5 | |\n| 5 | 5 | |\n| 0 | 0 | |\n| 0 | 42 | |\n\n一旦你做出了预测，试着运行实际程序，看看你是否正确。你还记得\
    \ else if 的规则吗——你只会得到*第一个*匹配的条件？这意味着你只会看到一个警告框。\n\n这个例子旨在锻炼你的大脑。当你编写条件逻辑时，不应该看起来像这样。相反，你应该努力让你的条件清晰可预测。如果把条件拆开来写更多的\
    \ if 块更简单，那就这样做。\n\n## switch 语句\n\n当你使用 if 语句时，你的代码可能会变得有点冗长。JavaScript 有另一种编写条件逻辑的方式，更简洁。这就是\
    \ switch 语句。\n\nswitch 语句是 if 的一个功能更有限的版本。它只在你想检查单个变量时有效。例如，如果你计划问“今天星期几？”这个问题，并且想为每一天编写条件代码，那么\
    \ switch 语句就非常适用。但如果你想比较不同的变量组合，就像前面的例子那样，switch 就没多大帮助了。\n\n> **注意** switch 能做的事情，if\
    \ 都能做。那为什么还要使用 switch 呢？这其实是个个人品味的问题，但如果 switch 适合你，通常你得到的代码会比使用 if 更简短、更整洁。\n\
    \n要使用 switch，你首先要给出你想检查的变量，像这样：\n\n```\nswitch (dayOfTheWeek) {\n```\n\n现在你为不同的值编写条件代码。每一个都是一个单独的\
    \ case，你用 case 关键字来标识它们。\n\n```\ncase \"Saturday\":\n```\n\n在 dayOfTheWeek 的例子中，你期望七种不同的星期名称中的一个。每个值都用引号括起来，因为它是一个字符串。如果你对一个存储数字的变量使用\
    \ switch，就不需要引号。\n\n在你写好 case 并放入你要查找的值（比如 “Saturday” 或 478）之后，你需要添加一个冒号 : 来开始你的条件代码。\n\
    \n```\ncase \"Saturday\":\n  alert(\"It's Saturday. Time to write some JavaScript!\"\
    );\n```\n\n你可以为每个 case 编写任意多行代码，但你需要在末尾写上 break。\n\n```\ncase \"Saturday\":\n\
    \  alert(\"It's Saturday. Time to write some JavaScript!\");\n  break;\n```\n\n\
    这与 JavaScript 通常的组织方式不同。你不是把条件代码放在大括号之间，而是用 : 开始它，用 break 结束它。\n\n你也可以编写一段处理多个\
    \ case 的代码。为此，你将这些 case 堆叠在一起，像这样：\n\n```\ncase \"Tuesday\":\ncase \"Wednesday\"\
    :\ncase \"Thursday\":\n  alert(\"It's the middle of the week. Keep waiting\");\n\
    \  break;\n```\n\n下面是使用 switch 的完整的星期示例：\n\n```\nswitch (dayOfTheWeek) {\n  case\
    \ \"Saturday\":\n    alert(\"It's Saturday. Time to write some JavaScript!\");\n\
    \    break;\n  case \"Sunday\":\n    alert(\"It's Sunday. Last day to write some\
    \ JavaScript!\");\n    break;\n  case \"Tuesday\":\n  case \"Wednesday\":\n  case\
    \ \"Thursday\":\n    alert(\"It's the middle of the week. Keep waiting.\");\n\
    \    break;\n  case \"Friday\":\n    alert(\"Almost there...\");\n    break;\n\
    }\n```\n"
