    \ function that has some code, like this:\n\n```\nfunction showMessage() {\n \
    \ alert(\"You clicked me.\");\n}\n```\n\nNow you connect the two pieces together.\
    \ If you want to pay attention to the onclick event, you add an onclick attribute\
    \ to the button, like so:\n\n```\n<button onclick>Click Me</button>\n```\n\nBut\
    \ that's still not enough! You also need to tell JavaScript which function to\
    \ run. So if your function is named showMessage(), you write this:\n\n```\n<button\
    \ onclick=\"showMessage()\">Click Me</button>\n```\n\nHere's the computereese-to-human-language\
