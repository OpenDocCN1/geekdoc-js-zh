    you play these simple games, the result is up to chance. You can''t predict what
    will happen.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_142_0.png)


    In programming, you get the same effect using random numbers. Random numbers let
    you simulate games of chance, like rolling dice and drawing cards. You can also
    use them to control other types of games—say, to decide who wins a battle between
    a dragon and an ogre, to generate a random map (for example, in Minecraft), or
    to cook up a random insult out of a list of adjectives.


    In this lesson, you''ll use random numbers to make two basic games.


    # Random and pseudo-random


    Being random isn''t easy for a computer. (It''s about as difficult as getting
    a robot to laugh.) When you ask a computer to give you a random number, it actually
    follows some kind of not-so-random formula to create a "fake" random number (technically
    called a *pseudo-random* number). For example, it might look at the computer clock,
    take the millisecond at that exact moment, and feed it into some sort of mathematical
    formula.


    One benefit of this approach is that your computer can pick fake random numbers
    pretty quickly. And in your program, the numbers still *seem* completely random,
    because you never know what number your computer will pick. But if'
  - '[PAGE 143]


    you''re trying to use a random number in computer security—for example, to encode
    sensitive information or to pick the winner in the next megamillion dollar lottery—this
    is a problem. Hackers can figure out how you''re generating your fake random numbers,
    guess them, and crack open your data (or give themselves winning loto tickets).


    Fortunately, you don''t need to worry about that if you''re building an ordinary
    game in JavaScript.


    # Generating random numbers


    Like most programming languages, JavaScript has a way to create a random number.
    You use the `Math.random()` function:


    ```

    let randomNumber = Math.random();

    alert("You random number is " + randomNumber);

    ```


    If you run this code, you''ll find that the random number probably isn''t what
    you expect. Maybe you want a random number between 1 and 6 (representing the roll
    of a dice). What you actually get is a massive fractional value that''s more than
    0 but less than 1, like this:


    0.43085308054


    It''s random, but not very helpful. It''s up to you to take this fractional value
    and convert it to a number in the range you want.


    Here''s the good news. There''s a formula you can use to pick a random whole number.
    The formula looks like this:


    ```

    randomNumber = Math.floor(Math.random() * (max - min + 1) ) + min;

    ```


    It looks complicated at first, but it breaks down easily. First, you need to understand
    all the ingredients. The `min` is the minimum number you allow, and'
  - '[PAGE 144]


    max is the maximum number. So if you’re trying to pick a number between 1 and
    6, the formula becomes:


    ```

    randomNumber = Math.floor(Math.random() * (6 - 1 + 1) ) + 1;

    ```


    Now we can simplify it a little:


    ```

    randomNumber = Math.floor(Math.random() * 6) + 1;

    ```


    This calculation uses two new Math functions: Math.random() and Math.floor().


    Math.floor() is a specialized rounding function that always rounds down, cutting
    off the decimal portion of a number. For example, if you use Math.floor() on the
    number 4.839424982, it becomes 4. (JavaScript also has a matching Math.ceil()
    function that always rounds up.)


    You don’t need to understand how this statement works its magic in order to use
    it. But if you want to know what’s going on, let’s take a second look at the final
    formula:


    ```

    randomNumber = Math.floor(Math.random() * 6) + 1;

    ```


    Here’s a step by step breakdown of what JavaScript does when it runs this statement:


    +   1. Math.random() gets a random value that’s more than 0 and less than 1.

    2. You multiply that by 6, turning it into a random number that’s more than 0
    and less than 6. However, the decimal part is still there, so you’ll have a number
    like 4.839424982.

    3. Math.floor() chops off the decimals and leaves you with a whole number. That
    number could be 0, 1, 2, 3, 4, or 5.

    4. You add 1 to shift your range of numbers up one place. Now you’ve got a whole
    number from 1 to 6, which is exactly what you want!'
  - '[PAGE 145]


    # # Try it yourself!


    ▶ Number Guesser of Doom (Challenge Level: Medium)


    [https://codepen.io/prosetech/pen/JjXPWIr](https://codepen.io/prosetech/pen/JjXPWIr)


    In this exercise you need to complete the number guesser game. You have all the
    concepts you need, but there are quite a few details to fill in.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_145_0.png)


    First, look at the code. You''ll see two global variables at the top:


    ```

    let secretNumber;

    let numberOfGuesses = 0;

    ```


    Your first job is to pick a secret number between 1 and 10. You want to pick this
    number once, store it in `secretNumber`, and keep the same number for all your
    guesses.


    The best time to pick the secret number is when the page first loads. To do that,
    you can write a function that reacts to the `onload` event. The number guesser
    already has function connect to the `onload` event of the `<body>` element:


    ```

    <body onload="pickNumber()">

    ```'
  - '[PAGE 146]


    Right now, there’s no code in the `pickNumber()` function. Your first job is to
    pick a random number here using `Math.random()`, and store it in `secretNumber`
    for later.


    Once you’ve got the number picking under control, the next job is to handle the
    guesses. To guess, you fill a number in the text box and click the **Guess** button.
    This triggers the `guess()` function.


    The `guess()` function already has the code to get grab the guess out of the text
    box. Now you need to use conditional logic to test if the guess matches the secret
    number. You can then show a congratulations message (for success), or a taunting
    insult (for failure). You can show your message on the page—in fact, the code
    is already there. All you need to do is set the `message` variable with the right
    text.


    Once you get to this point, try out the example and make sure it works. When everything
    is in place, it’s time to finish your example with some important extra details:


    +   1. Keep track of the number of guesses using the global `numberOfGuesses`
    variable.

    2. After a wrong guess, check if you’ve reached the maximum number of guesses
    (4). If you have, show a “game over” message (and tell the guesser what the number
    was).

    3. After every guess, say how many guesses are left. You can add this information
    to the end of the message you show.

    4. After losing the game, reset `numberOfGuesses` to 0, and pick a new random
    number. You don’t need to write your random logic again—instead, just call the
    `pickNumber()` function.


    If you complete all these tasks, you will have a truly epic number guessing game.'
  - '[PAGE 147]


    # Try it yourself!


    ▶ **Ice, Dagger, Lava (Challenge Level: Tricky)**


    https://codepen.io/prosetech/pen/rNeByow


    If you’ve ever played rock, paper, scissors, you’ll have no trouble understanding
    the number one gaming hit in the goblin kingdom: *Ice, Dagger, Lava*. In each
    round, you and your opponent choose to use ice, a dagger, or the lava of an erupting
    volcano. Here’s how you decide who wins:


    +   1. Lava melts the dagger. (Winner: lava)

    2. Dagger breaks the ice. (Winner: dagger)

    3. Ice hardens lava into stone. (Winner: ice)


    If you both choose the same attack, no one wins.


    **Let’s play.**


    **Make your choice NOW!**


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_147_0.png)'
- md: "The *Ice, Dagger, Lava* code is already set up with most of what you need.\
    \ You click one of three pictures to choose your attack. Then, the `playIceDaggerOrLava()`\
    \ function decides who wins. Your job is to write the code for that function.\n\
    \nYour opponent is a computer goblin, who chooses an attack at random. Choosing\
    \ between three options is the same as choosing a random number from 1 to 3. For\
    \ example, you could assign ice as 1, dagger as 2, and lava as 3. To make that\
    \ system easier to remember, the code uses three constants:\n\n```\nconst ice\
    \ = 1;\nconst dagger = 2;\nconst lava = 3;\n```\n\nRemember, constants are just\
    \ variables that never change.\n\nThe button clicking code is already there. For\
    \ example, if you click the ice picture this is what happens:\n\n```\nfunction\
    \ pickIce() {\n  playIceDaggerOrLava(ice);\n}\n```\n\nCalling `playIceDaggerOrLava(ice)`\
    \ is the same as `playIceDaggerOrLava(1)`. But if you use the constant names in\
    \ your code instead of the magic numbers, your code is easier to understand, and\
    \ you’re less likely to mix up a number.\n\nNow it’s time for your contribution.\
    \ You need to write the code in `playIceDaggerOrLava()`. First, you need to pick\
    \ a random number from 1 to 3, representing ice, dagger, or lava. That’s the easy\
    \ part.\n\nNow you need to write an **if** block that figures out who wins. This\
    \ part is tricky because there are many ways to win and many ways to lose. The\
    \ best approach is to use a two-part strategy. First, you figure out whether it’s\
    \ a win or a loss, and *then* you decide what to do about it.\n\nThere are many\
    \ different ways to solve this problem. Some are shorter than others, and some\
    \ look more complicated. One option is to use a variable to store the result:\n\
    \n```\nlet result;\n```\n\nIf it’s a win, you store something in result (like\
    \ the number 1). If it’s a loss, you store a different value. After you’ve tried\
    \ all the different ice, dagger, lava combinations, you can check result to decide\
    \ what to do next.\n\nThe last step is the easier part. If the player won, show\
    \ a happy win message. If not, show something less kind.\n\nThere are lots of\
    \ ways to make this example even better. Why not use a couple of variables to\
    \ keep track of how many games you win and lose? You can then show that information\
    \ somewhere else on the page, and even use it to calculate a win percentage.\n\
    \n## What Comes Next\n\nIf you liked this introduction to JavaScript, the journey\
    \ doesn’t need to end here. We’ve got a sequel planned for the future.\n\nMeet\
    \ *A Tiny Introduction to Object-Oriented JavaScript*. It takes you on a new adventure—learning\
    \ to build your own objects. What’s an object, you ask? It’s nothing less than\
    \ one of the most practical programming tools ever invented, and something you’ll\
    \ use in plenty of other programming languages.\n\nTo find out when new books\
    \ are released (and when there’s updated content for this book), sign up for Tiny\
    \ Introductions news at [http://tiny.cc/tinyintro](http://tiny.cc/tinyintro).\
    \ You can also follow me on Twitter ([http://twitter.com/prosetech](http://twitter.com/prosetech)),\
    \ or just say hi at [matthew@prosetech.com](mailto:matthew@prosetech.com)!\n\n\
    Until then, happy travels,\n\nMatthew\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_150_0.png)"
  mdcn: "\n*冰、匕首、熔岩*代码已经预设好了大部分你需要的内容。你点击三张图片中的一张来选择你的攻击方式。然后，`playIceDaggerOrLava()`函数会决定谁赢。你的任务就是编写这个函数的代码。\n\
    \n你的对手是一个电脑地精，它会随机选择攻击方式。在三个选项中选择，等同于从1到3中随机抽取一个数字。例如，你可以将冰设为1，匕首设为2，熔岩设为3。为了让这个系统更容易记住，代码使用了三个常量：\n\
    \n```\nconst ice = 1;\nconst dagger = 2;\nconst lava = 3;\n```\n\n记住，常量就是永远不会改变的变量。\n\
    \n按钮点击的代码已经存在。例如，如果你点击冰图片，就会发生以下情况：\n\n```\nfunction pickIce() {\n  playIceDaggerOrLava(ice);\n\
    }\n```\n\n调用`playIceDaggerOrLava(ice)`就等同于调用`playIceDaggerOrLava(1)`。但如果你在代码中使用常量名而不是魔法数字，你的代码会更容易理解，也更不容易混淆数字。\n\
    \n现在轮到你的贡献了。你需要在`playIceDaggerOrLava()`中编写代码。首先，你需要从1到3中抽取一个随机数字，代表冰、匕首或熔岩。这是简单的部分。\n\
    \n现在你需要编写一个**if**语句块来判断谁赢了。这部分很棘手，因为有很多种赢法和输法。最好的方法是采用两步策略。首先，你判断是赢还是输，*然后*你决定对此做些什么。\n\
    \n解决这个问题有很多不同的方法。有些比其他的更简短，有些看起来更复杂。一个选择是使用一个变量来存储结果：\n\n```\nlet result;\n```\n\
    \n如果赢了，你在`result`中存储某个值（比如数字1）。如果输了，你存储一个不同的值。在你尝试了所有不同的冰、匕首、熔岩组合之后，你可以检查`result`来决定下一步做什么。\n\
    \n最后一步是更简单的部分。如果玩家赢了，显示一个愉快的胜利信息。如果没有，就显示一些不那么友好的信息。\n\n有很多方法可以让这个示例变得更好。何不用几个变量来跟踪你赢了多少局、输了多少局呢？然后你可以在页面的其他地方显示这些信息，甚至可以用它来计算胜率。\n\
    \n## 接下来是什么\n\n如果你喜欢这个JavaScript入门介绍，旅程并不需要在这里结束。我们计划了续集。\n\n隆重介绍*《面向对象JavaScript极简入门》*。它将带你踏上新的冒险——学习构建你自己的对象。你可能会问，什么是对象？它不亚于有史以来最实用的编程工具之一，也是你会在许多其他编程语言中用到的东西。\n\
    \n要了解新书发布的时间（以及这本书的更新内容），请在[http://tiny.cc/tinyintro](http://tiny.cc/tinyintro)注册订阅Tiny\
    \ Introductions新闻。你也可以在Twitter上关注我（[http://twitter.com/prosetech](http://twitter.com/prosetech)），或者直接通过[matthew@prosetech.com](mailto:matthew@prosetech.com)向我打招呼！\n\
    \n祝你旅途愉快，\n\n马修\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_150_0.png)\n"
