    Chapter 4


    # Changing Variables


    Variables are called variables because their contents vary. In other words, you
    can change what’s stored inside a variable as often as you want. You can rearrange
    bits of text, count things that happen, and perform mathematical calculations.
    These kinds of operations are the first step to making your code more intelligent.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_52_0.png)


    # Really easy math


    There are lots of ways to change the value that’s stored in a variable. If your
    variable is a number, you can use simple math.


    For example, take a look at the plus + operator. It lets you add two numbers together:


    ```

    age = 12 + 9;

    ```


    When you run this code, JavaScript starts by doing all the math on the right side
    of the equal sign. In this example, that means it adds 12 and 9 to get the result
    (21). Then it takes that result and puts it in the age variable.


    ```

    age ← 21

    ```


    Of course, you can also subtract number with the – operator:


    ```

    age = 400 – 9;


    // Now age holds the number 391.

    ```'
  - '[PAGE 53]


    Both these examples have extra spaces to make the code easier to read. But if
    you want, you can cram everything closer together:


    ```

    age=400-9;

    ```


    # Slightly fancier math


    The + and - signs are called *operators*. JavaScript also recognizes:


    +   - * operator for multiplication (3×2 is 3*2 in JavaScript)

    - / operator for division (6÷2 is 6/2 in JavaScript)

    - ** operator for exponents (6² is 6**2 in JavaScript)


    You can also control the order that JavaScript performs its calculations with
    brackets ( ). Ordinarily, JavaScript follows the traditional order of operations,
    which means it calculates exponents first, then does multiplication and division,
    and ends with addition and subtraction. So if you have a statement like this:


    ```

    total = 2+6/2;

    ```


    JavaScript performs the 6/2 part first (it’s 3), then adds 2 and 3 to get 5. Compare
    that to this version with parentheses:


    ```

    total = (2+6)/2;

    ```


    Now JavaScript adds (2+6) first to get 8, and divides that by 2 to end up with
    4.


    If you want to do anything more complex—like rounding numbers, or calculating
    exponents—you need to use JavaScript’s Math object, which you’ll explore in later
    lessons.'
- md: '## Try it yourself!


    ### Pocket Calculator (Challenge Level: Easy)


    https://codepen.io/prosetech/pen/dyGqNGO


    Here''s a question. If you drive 50 mph (miles per hour) for three hours, how
    far do you get? But wait—don''t answer this question yourself. Instead, write
    a statement in the Pocket Calculator program that calculates the result and puts
    it in the variable named `distanceTraveled`.


    When you''ve your calculation in code, run the program. You should see an alert
    box pop up with the right number. (If you get 50 miles in an hour, in 3 hours
    you go 3×50, or 150 miles.) You can try your calculation with different numbers
    to see how the result changes.


    ## Calculations with variables


    Here''s a useful technique: you can use a variable *in* your calculation. For
    example, let''s say you set your age to a starting number:


    ```

    age = 16;

    ```


    Now you want to increase your age by one year. To do that, you take the current
    value of the age variable and add 1 to it:


    ```

    age = age + 1;

    // Now age holds the number 17.

    ```


    Here''s how this works. When JavaScript sees a statement like this:


    ```

    age = age + 1;

    ```


    It starts by replacing all the variables on the right side with their current
    values. So the statement becomes this:


    ```

    age ← 16 + 1

    ```


    Finally, JavaScript adds up right side (getting 17), and then stuffs that back
    in the age variable.


    Here''s another example that uses division to find your equivalent age in dog
    years:


    ```

    ageInDogYears = age/7

    ```


    So if the age variable is 17, JavaScript evaluates this:


    ```

    ageInDogYears ← 17/7

    ```


    And after doing the division of 17÷7, it stores the result, which works out to
    roughly 2.4 years:


    ```

    ageInDogYears ← 2.428571428571429

    ```


    > TIP There''s no limit to how many variables you can use in your calculation.
    But sometimes a calculation looks so complex as a single statement that it''s
    easier to split it up into several steps.


    ## Try it yourself!


    ### Pocket Calculator II (Challenge Level: Medium)


    https://codepen.io/prosetech/pen/dyGqNGO


    In this exercise you''re going to perform exactly the same calculation you did
    in the original *Pocket Calculator* example, except now you''re going to use variables.
    Create a `speed` variable and a `time` variable. Set them both to the proper values
    (50 for `speed` and 3 for `time`). Then, calculate `distanceTraveled` using the
    `speed` and `time` variables.


    It may seem like a pointless change—after all, your program is still going to
    do the same thing. But once you start using variables you open up new possibilities.
    For example, instead of setting your values by typing them into the code, maybe
    you''ll get them from some text boxes on the web page.


    And using variables with good names can make it easier to understand a complex
    formula. Compare this:


    ```

    distanceTraveled = time*speed;

    ```


    To this:


    ```

    distanceTraveled = 3*50;

    ```


    Before you move on, try getting a little fancier with the *Pocket Calculator*
    example. Create a second variable, named `enemyDistanceTraveled`. Calculate the
    enemy''s distance, assuming they drive for the same amount of time but at 80 miles
    an hour. Then, calculate how far they are ahead, and put that in a variable named
    `gapDistance`. Finally, show the `gapDistance` in a second alert box.


    ## Calculations can go anywhere


    Here''s an interesting fact. Anywhere you put a variable, you can also put a calculation.


    What does this mean? Think about the `alert()` function. You''re used to calling
    it like this:


    ```

    alert("Hi there");

    ```


    Or with a variable, like this:


    ```

    alert(distanceTraveled);

    ```


    But you can also call it with a calculation, like this:


    ```

    alert(3*50);

    ```


    When you do that, JavaScript performs all your operations first. In this example,
    that means it calculates 3×50 to get 150, and then it passes 150 to the `alert()`
    function, which shows 150 in the alert box.


    As always, your mission is to write code that makes sense. If your code seems
    clearer when you do everything step by step, stick to that approach. But if your
    code is getting a bit cluttered up with extra variables, this kind of shortcut
    can help.


    ## Really easy “math” with text


    You obviously can''t add and subtract letters. But JavaScript lets you do something
    just as useful. You can join together two separate strings to make a new one.
    To do that, you use the + operator, just like you do when you''re adding numbers.
    Here''s an example:


    ```

    let firstName = "Elphaba";

    let lastName = "Smith";


    let fullName = firstName + lastName;

    ```


    At the end of the code, the `fullName` variable has the combined text “ElphabaSmith”
    in it. Yep, what you really need there is an extra space. Here''s a better attempt:


    ```

    fullName = firstName + " " + lastName;

    ```


    This joins together three strings: the first name, an extra space, and then the
    last name. The result (“Elphaba Smith”) goes in the `fullName` variable.


    This operation is called string *concatenation*, and it''s useful in plenty of
    situations. For example, you can use it right now to make better, more detailed
    messages for your alert boxes. Here''s an example:


    ```

    let message = "It''s so nice to meet you " + personName;

    ```


    This only works if you put person''s name in the `personName` variable. (You''ll
    do that sort of thing in plenty of future exercises.) The result is a nice, personalized
    welcome greeting, like “It''s so nice to meet you Leopold”.


    ## Adding numbers and text together


    Here''s an interesting dilemma. You know that if you add two numbers, JavaScript
    sums them up. And you also know that if you add two pieces of text (with the same
    + operator), JavaScript joins them to make one long piece of text. But what happens
    if you try to add a number to piece of text?


    ```

    let number = 2;

    let text = "4";


    let combination = number + text;

    ```


    In many other programming languages, this causes an error, because it doesn''t
    make sense. But JavaScript is very tolerant. It assumes that you want to convert
    your number into a piece of text (from 2 into “2”). Then it does its text joining.
    The result is the longer string (“24”).


    Weird as this seems, it''s really the only approach JavaScript can take. JavaScript
    doesn''t try to convert your string to a number, because that might not work,
    depending on what''s in the string. (For example, maybe your string holds a word
    or a sentence instead of a number. That won''t make sense!) But converting a number
    into text *never* fails.


    > **NOTE** If you want to turn a string (like “4”) into a number (like 4) so you
    can do calculation with it, you need to perform a conversion with the handy `Number()`
    function. You''ll learn that trick in Chapter 5.


    ## Try it yourself!


    ### Alice the Unshakeable (Challenge Level: Tricky)


    https://codepen.io/prosetech/pen/YzwjZoz


    Meet Alice. She''s very talkative. Once click of the **Talk to Me** button, and
    she''ll tell you her life story, one alert box at a time.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_60_0.png)


    But Alice wants a new name. (The reason is complicated. Maybe she''ll explain
    it in her story.) Simple, right? All you need to do is find the right strings
    in the code, and change every occurrence of the word “Alice” to something else.


    But wait. This challenge is a bit harder. Alice''s new name is in a variable called
    `newName`. (You''re going to get the new name from a text box that''s on the page,
    but you don''t need to worry about that part, because it''s already working.)


    To fix Alice''s story, you need to use string joining and the `newName` variable.
    Every time she says “Alice” you need to add the `newName` variable instead. Use
    the + operator and pay careful attention to where you put your quotation marks!


    If you''ve coded it right, here''s a simple test. Change Alice''s new name in
    the text box and click the **Talk to Me** button. Now Alice''s story will automatically
    use whatever name is in the text box. Neat!


    If you''re having trouble figuring out this exercise, here''s a line of code that
    demonstrates the approach you need to take:


    ```

    alert("My name is " + newName);

    ```


    And if you''re still stuck, just click the solution link to see the whole answer.


    Once you''re finished, it''s time to reflect. Not only did you learn to use string
    concatenation in this exercise, you also saw how a program can get text out of
    a text box. You''ll learn how that trick works in the next chapter.


    ## Optional Variables that never change


    So far, every time you''ve needed a variable you''ve used the trusty `let` keyword
    to create it. But there''s another choice. You can use `const` to create a *constant*.
    That''s a variable that you''re not allowed to change. You set it once, when you
    create it, and it stays that way until the function ends.


    Here''s an example that creates three constants:


    ```

    const firstName = "Elphaba";

    const lastName = "Smith";


    const fullName = firstName + lastName;


    // From this point on, you can''t change firstName, lastName,

    // or fullName.


    // This causes an error.

    lastName = "Singh";

    ```'
