  md: "# Optional For, a loop with a built-in counter\n\nIf you haven't had quite\
    \ enough loop-y goodness yet, JavaScript has another tool for you. It's called\
    \ the for loop.\n\nA for loop is basically a loop with a built-in counter. If\
    \ that's what you need, you'll find that for is more compact than while, though\
    \ it doesn't add any new features.\n\nHere's an example. You probably remember\
    \ this loop of messages from the first exercise in this chapter:\n\n```\nlet counter\
    \ = 0;\n\nwhile (counter < 10) {\n  counter = counter + 1;\n  alert(counter);\n\
    }\n```\n\nWith a for loop, it looks like this:\n\n```\nfor (let counter = 0; counter\
    \ < 10; counter++) {\n  alert(counter);\n}\n```\n\nAfter the word for is a set\
    \ of parentheses with three important details, separated by semicolons. The first\
    \ part creates the counter:\n\n```\nfor (let counter = 0;\n```\n\nThe second part\
    \ sets the condition that's tested before each pass:\n\n```\nfor (let counter\
    \ = 0; counter < 10;\n```\n\nAnd the third part changes the counter, in this case\
    \ by adding 1 to it using the ++ operator:\n\n```\nfor (let counter = 0; counter\
    \ < 10; counter++)\n```"
  merge: -1
  pgno: 114
- img_proc: true
  md: "When you use a for loop, it's obvious that the variable in your parentheses\
    \ is the counter. So, rather than name it counter, lazy programmers usually give\
    \ it a much shorter name. Traditionally, they choose i, although the exact name\
    \ doesn't matter:\n\n```\nfor (let i = 0; i < 10; i++) {\n  alert(counter);\n\
    }\n```\n\nAnything you can do with for you can also do with while, But in real\
    \ life, when people need a counter they almost always use a for loop."
