  md: '# Try it yourself!


    > ▶ Hello, Wizard? (Challenge Level: Easy)


    [https://codepen.io/prosetech/pen/wvMjPbM](https://codepen.io/prosetech/pen/wvMjPbM)


    It’s a common tradition to start learning a new programming language with something
    called a *Hello World* program. All a *Hello World* program does is display a
    message. It proves that your code is working—and that’s it.


    The *Hello, Wizard?* example is a slight variation on this idea. Right now, it
