    Chapter Zero


    # CodePen: Your New Home


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_14_0.png)


    All the work you''ll do in this guide happens in CodePen. So before you get started,
    it''s time to check out your new home.


    CodePen is a JavaScript *playground*. That means it''s a place where you can write
    web pages and try them out. CodePen isn''t the only JavaScript playground, but
    it''s my favorite. It''s easy to use. You can start with someone else''s example,
    change it, and save it to your own account. And all the basic features are free.


    # Signing up on CodePen


    You don''t need an account to use CodePen. But having an account is a good idea,
    because it allows you to save your work. CodePen accounts are free (although you
    can pay for a pro account with extra features).


    To create a CodePen account, go to [http://codepen.io](http://codepen.io) and
    click the **Sign Up** button. You need to give your email address, choose a password,
    and pick a CodePen name. You know, the usual stuff. Or, you can register with
    a social media account that you already use, like Twitter or Facebook.


    # Looking at an example on CodePen


    In this guide, you get links that take you to each example. Try it out now, by
    visiting *The Most Wonderful Button in the World*:


    [https://codepen.io/prosetech/pen/PoNqRbq](https://codepen.io/prosetech/pen/PoNqRbq)'
