    To figure this out, you need a loop that will calculate the money you owe, and
    the money you’re making, every year. If you save up enough to pay your debt, you
    can end the loop, pay back the loan, and ride off into the sunset.


    Here’s how the calculations work. Every year you’re charged 2% interest. You can
    use that to calculate how much you owe:


    ```

    amountOwed = amountOwed * 1.02;

    ```


    So if the `amountOwed` starts at 500000, after the first year it grows to 510000.
    And so on.


    But at the same time, your pizza shop is making money, to the respectable amount
    of $32,000 per year. You can track your growing savings using a formula like this:


    ```

    amountEarned = amountEarned + 32000;

    ```


    Each pass through the loop represents one year of time passing. At the end of
    the loop, you must use a condition to test if you’ve earned enough to pay off
    the amount owned. If you have, end the loop, and tell us how many years it took.
    Easy, right?


    > **HINT** Your condition needs to compare `amountOwed` to `amountEarned`, You
    need to keep track of the number of years in the loop (by adding 1 each time the
    loop runs), but you don’t use the years variable in the loop condition.'
