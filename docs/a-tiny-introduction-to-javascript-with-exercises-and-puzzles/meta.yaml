- md: "# Try it yourself!\n\n## The Friendly Angry Ogre (Challenge Level: Medium)\n\
    \nhttps://codepen.io/prosetech/pen/mdVzpNg\n\nIn this example you start out with\
    \ three buttons (Become Nice, Become Mean, and Say Hello). There’s also a tiny\
    \ bit of code that changes the picture to match the ogre’s mood.\n\nThe part that’s\
    \ missing is the message you’re going to show. To make this example work, you\
    \ need to set the right message, depending on the ogre’s mood. Then you need to\
    \ show this message at the right time.\n\nHere’s what you need to do:\n\n- 1.\
    \ Create the `welcomeMessage` variable. Remember, it needs to be a global variable,\
    \ and you only need to define it once.\n- 2. Add the code that sets `welcomeMessage`\
    \ when **Become Nice** or **Become Mean** is clicked. You need two different messages,\
    \ depending on what mood you’ve put the ogre in.\n- 3. Add the code to `sayHello()`\
    \ that shows the message.\n\nWhat happens if you click **Say Hello** without clicking\
    \ **Become Mean** or **Become Nice** first? Can you give `welcomeMessage` a starting\
    \ value so this doesn’t happen? (A good starting value for an ogre with no mood\
    \ is a message like “I just don’t know how to behave.”)\n\n## The Broken Jellybean\
    \ Counter (Challenge Level: Medium)\n\n[https://codepen.io/prosetech/pen/PoZyQPo](https://codepen.io/prosetech/pen/PoZyQPo)\n\
    \nIf there's one thing programmers like to do, it's counting things. (If there\
    \ are two things programmers like to do, it's counting things and eating jellybeans.)\
    \ That makes this next example the perfect bit of practice.\n\nThe Broken Jellybean\
    \ Counter lets you eat as many jellybeans as you want—just click a button each\
    \ time you want to eat one. It counts the number of jellybeans you've eaten so\
    \ far.\n\n[ Eat Jelly Bean ] [ Reset the Counter ]\n\nYou've eaten 0 jellybeans.\n\
    \nUnfortunately, there are two disastrous mistakes in the program. Can you fix\
    \ them?\n\n> **HINT** Right now, the bean counter uses local variables. But you\
    \ need to turn beanCount into a global variable, so you can use it everywhere.\
    \ Make that change, and you're well on your way to solving the problem.\n\n##\
    \ The secret of the braces\n\nI have a confession to make. Earlier, I said that\
    \ local variables live until the function ends. That’s true, but it’s not the\
    \ whole story.\n\nTechnically, local variables live in the block that contains\
    \ them. As you might remember from Chapter 1, a block is a common structure in\
    \ JavaScript code. It’s any section of code that fits between two braces { }.\n\
    \nSo far, all the braces you’ve seen have been for functions. However, in the\
    \ upcoming chapters you’re going to learn that you also use braces to group together\
    \ code for different reasons. For example, you use braces to repeat code in a\
    \ loop, or make it conditional. If you create a variable inside one of these sections,\
    \ it doesn’t live for the whole function. It only lives until that *block* is\
    \ finished.\n\nThis will all make more sense when you see examples of the other\
    \ ways we use braces. But here’s a cheat rule that always works—when you create\
    \ a local variable, it will disappear from existence when you reach the next }\
    \ closing brace.\n\n## Wise advice about global variables\n\nThe more global variables\
    \ you use, the more difficult it is to figure out what’s going on in your code.\
    \ Imagine you see a new JavaScript program for the first time, and it has a bunch\
    \ of global variables. How do you know which functions use which variables? There’s\
    \ no way to be sure without reading all the code, and that means there’s plenty\
    \ of room to make a mistake.\n\nTo make your code as simple as possible, and to\
    \ reduce the chance of making mistakes in the future, you should use global variables\
    \ only when you need them to share information.\n\nSometimes, you might notice\
    \ in your program that different functions are using the same local variables\
    \ for the same tasks. For example, maybe you have three functions and each one\
    \ creates its own local `welcomeMessage` variable. It might occur to you that\
    \ you could replace these three local variables with one global `welcomeMessage`\
    \ variable. Don't do it! It's always better to make your functions as independent\
    \ as possible.\n\n# Making Decisions\n\nSo far your programs have been a little\
    \ short in the brains department. The key ingredient they’re missing is the ability\
    \ to *make decisions*—in other words, to evaluate information and then set a course.\n\
    \nTo add this ability, you need to learn a programming concept called *conditional\
    \ logic*. It’s the art of asking questions, and then choosing what to do.\n\n\
    ## Introducing conditions\n\nA condition is a question that has two possible answers:\
    \ true or false.\n\nFor example, look at this condition with two variables:\n\n\
    ```\na > b\n```\n\nThis condition makes a simple claim: *a is greater than b*.\
    \ If `a` holds the number 12, and `b` holds the number 3, this condition is true.\
    \ But if `a` holds the number 3, and `b` holds the number 12, this condition is\
    \ false. (This condition assumes that `a` and `b` are numbers. If they aren’t,\
    \ this condition doesn’t make sense.)\n\nHere’s another example of a condition:\n\
    \n```\na == b\n```\n\nThis condition asks *does a equal b*? In this case, it doesn’t\
    \ matter what type of data the variable `a` holds—it could be a number or a piece\
    \ of text. The important part is that the variable `b` has exactly the same content\
    \ as `a`. So if they both hold the same number (like 42) or a matching piece of\
    \ text (like “blunderstone”), the condition is true.\n\nYou might be wondering\
    \ why there are two equal signs (==). That’s just the way JavaScript works, because\
    \ it wants to distinguish between = (which you use to set a variable) and == (which\
    \ you use to compare values in a condition). Some other programming languages\
    \ use the ordinary = for both uses.\n\n## The if statement\n\nTo get a condition\
    \ to actually do something, you need to pair it with the `if` keyword. Here’s\
    \ an example:\n\n```\nif (a > b) {\n  // (Do something here.)\n}\n```\n\nThe `if`\
    \ statement tells JavaScript to look at a condition and run a piece of code if\
    \ the condition is true. Here’s how it breaks down:\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_83_0.png)\n\
    \nRemember, a condition can only have two possible outcomes:\n\n- If the condition\
    \ is true (in this example, a is greater than b), JavaScript runs the code between\
    \ the two braces.\n- If the condition is false (a is less than or equal to b),\
    \ JavaScript skips over the code in the braces and carries on.\n\nYou can put\
    \ as many lines of code as you want in between the braces. They all become part\
    \ of the same conditional block. If you only need a single code statement in your\
    \ conditional block, you can remove the braces. But we recommend always keeping\
    \ the braces to make your code clearer.\n\nCan you tell what happens in this next\
    \ example?\n\n```\nalert(\"Hi\");\n\nif (a == b) {\n    alert(\"They match\");\n\
    }\n\nalert(\"Bye\");\n```\n\nThe condition in this example checks if two variables\
    \ have the same value. If they do, you'll get a sequence of alert boxes (*Hi*,\
    \ then *They match*, and finally *Bye*). If a and b hold different variables,\
    \ you still get the *Hi* and *Bye* boxes, but the code in the if block is skipped.\n\
    \nWhen you write an `if` block, make sure to remember the parentheses around your\
    \ condition, or it won't work. Here's a common mistake:\n\n```\n// Where are my\
    \ parentheses?\nif a == b {\n```\n\nAnd don't make this mistake:\n\n```\n// This\
    \ is the wrong equal sign.\nif (a = b) {\n```\n\nA single equal sign is only good\
    \ for *setting* variables. So this code actually copies the value from `b` into\
    \ `a`, which definitely isn't what you want.\n\n## More logical operators\n\n\
    The symbols `<` and `>` and `==` are called *logical operators*, because you use\
    \ them to compare values in a condition. They are the most common logical operators,\
    \ but there are still a few more to learn.\n\nInstead of asking if two variables\
    \ are equal, you can ask if they are *not equal*. This is exactly the opposite\
    \ question. You do this by changing the `==` in your condition to `!=`\n\n```\n\
    if (a != b) {\n    alert(\"Nope, no match\");\n}\n```\n\nThis condition asks \"\
    do these variables have different values?\" If they do, the condition is true\
    \ and the alert box appears. Otherwise, there's no message.\n\nYou can also use\
    \ the `>=` (greater than or equal) and `<=` (less than or equal) operators, which\
    \ work like `>` and `<` except they are also true when your two numbers are the\
    \ same."
  mdcn: "\n# 亲手试试看！\n\n## 友好的愤怒食人魔（挑战等级：中等）\n\nhttps://codepen.io/prosetech/pen/mdVzpNg\n\
    \n在这个示例中，你开始时有三个按钮（变得友善、变得刻薄、打招呼）。还有一小段代码会根据食人魔的心情改变图片。\n\n缺失的部分是你将要显示的信息。要使这个示例正常工作，你需要根据食人魔的心情设置正确的信息。然后你需要在正确的时间显示这条信息。\n\
    \n你需要做以下几点：\n\n- 1. 创建 `welcomeMessage` 变量。记住，它需要是一个全局变量，而且你只需要定义一次。\n- 2. 添加在点击\
    \ **变得友善** 或 **变得刻薄** 时设置 `welcomeMessage` 的代码。你需要两条不同的信息，取决于你让食人魔处于什么心情。\n- 3.\
    \ 在 `sayHello()` 函数中添加显示信息的代码。\n\n如果你不先点击 **变得刻薄** 或 **变得友善**，而是直接点击 **打招呼** 会发生什么？你能给\
    \ `welcomeMessage` 一个初始值来避免这种情况吗？（对于一个没有心情的食人魔来说，一个好的初始值是类似“我真不知道该如何表现。”这样的信息。）\n\
    \n## 坏掉的果冻豆计数器（挑战等级：中等）\n\n[https://codepen.io/prosetech/pen/PoZyQPo](https://codepen.io/prosetech/pen/PoZyQPo)\n\
    \n如果说程序员喜欢做的一件事，那就是计数。（如果说程序员喜欢做的两件事，那就是计数和吃果冻豆。）这使得下一个示例成为绝佳的练习。\n\n坏掉的果冻豆计数器让你想吃多少果冻豆就吃多少——每次想吃的时候点一下按钮即可。它会计算你迄今为止吃掉的果冻豆数量。\n\
    \n[ 吃一颗果豆 ] [ 重置计数器 ]\n\n你吃了 0 颗果豆。\n\n不幸的是，程序中有两个灾难性的错误。你能修复它们吗？\n\n> **提示**\
    \ 现在，豆子计数器使用的是局部变量。但你需要将 `beanCount` 变成一个全局变量，这样你才能在任何地方使用它。做出这个改变，你就朝着解决问题迈进了一大步。\n\
    \n## 花括号的秘密\n\n我有一个坦白要说。之前，我说过局部变量存在于函数结束为止。这是事实，但并非全部。\n\n从技术上讲，局部变量存在于包含它们的代码块中。你可能还记得第\
    \ 1 章的内容，代码块是 JavaScript 代码中的一种常见结构。它是任何位于一对花括号 { } 之间的代码段。\n\n到目前为止，你看到的所有花括号都是用于函数的。然而，在接下来的章节中，你将了解到你也使用花括号来出于不同的目的对代码进行分组。例如，你使用花括号在循环中重复代码，或者使其具有条件性。如果你在这些部分中的任何一个内部创建一个变量，它不会在整个函数生命周期内存在。它只存在于该*代码块*完成之前。\n\
    \n当你看到我们使用花括号的其他方式的示例时，这一切都会变得更加清晰。但这里有一个总是有效的速成规则——当你创建一个局部变量时，当你到达下一个闭合花括号 `}`\
    \ 时，它就会从存在中消失。\n\n## 关于全局变量的明智建议\n\n你使用的全局变量越多，就越难弄清楚代码中正在发生什么。想象一下你第一次看到一个新的\
    \ JavaScript 程序，它有一堆全局变量。你怎么知道哪些函数使用哪些变量？不阅读所有代码就无法确定，这意味着有很大的犯错空间。\n\n为了使你的代码尽可能简单，并减少未来犯错的机会，你应该只在需要共享信息时才使用全局变量。\n\
    \n有时，你可能会在程序中注意到不同的函数正在使用相同的局部变量来执行相同的任务。例如，也许你有三个函数，每个函数都创建自己的局部 `welcomeMessage`\
    \ 变量。你可能会想到可以用一个全局 `welcomeMessage` 变量来替换这三个局部变量。不要这样做！最好让你的函数尽可能独立。\n\n# 做出决策\n\
    \n到目前为止，你的程序在智力方面有点欠缺。它们缺少的关键成分是*做出决策*的能力——换句话说，就是评估信息然后设定路线的能力。\n\n要添加这个能力，你需要学习一个称为*条件逻辑*的编程概念。这是提问的艺术，然后选择做什么。\n\
    \n## 介绍条件\n\n条件是一个有两种可能答案的问题：真或假。\n\n例如，看看这个包含两个变量的条件：\n\n```\na > b\n```\n\n\
    这个条件提出了一个简单的主张：*a 大于 b*。如果 `a` 存储数字 12，`b` 存储数字 3，这个条件为真。但如果 `a` 存储数字 3，`b` 存储数字\
    \ 12，这个条件为假。（这个条件假设 `a` 和 `b` 是数字。如果它们不是，这个条件就没有意义。）\n\n这里是另一个条件示例：\n\n```\na\
    \ == b\n```\n\n这个条件询问 *a 是否等于 b*？在这种情况下，变量 `a` 持有什么类型的数据并不重要——它可以是一个数字或一段文本。重要的是变量\
    \ `b` 的内容与 `a` 完全相同。所以如果它们都存储相同的数字（比如 42）或匹配的文本（比如“blunderstone”），条件就为真。\n\n你可能想知道为什么有两个等号（==）。这正是\
    \ JavaScript 的工作方式，因为它想要区分 =（用于设置变量）和 ==（用于在条件中比较值）。其他一些编程语言对这两种用途都使用普通的 =。\n\n\
    ## if 语句\n\n要让条件实际做点什么，你需要将它与 `if` 关键字配对。这是一个例子：\n\n```\nif (a > b) {\n  // （在这里做点什么。）\n\
    }\n```\n\n`if` 语句告诉 JavaScript 查看一个条件，并在条件为真时运行一段代码。以下是它的分解：\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_83_0.png)\n\
    \n记住，条件只能有两种可能的结果：\n\n- 如果条件为真（在这个例子中，a 大于 b），JavaScript 会运行两个花括号之间的代码。\n- 如果条件为假（a\
    \ 小于或等于 b），JavaScript 会跳过花括号中的代码并继续执行。\n\n你可以在花括号之间放入任意多行代码。它们都成为同一个条件块的一部分。如果你只需要在条件块中放一条代码语句，可以去掉花括号。但我们建议始终保留花括号，以使你的代码更清晰。\n\
    \n你能看出下面这个例子中会发生什么吗？\n\n```\nalert(\"Hi\");\n\nif (a == b) {\n    alert(\"They\
    \ match\");\n}\n\nalert(\"Bye\");\n```\n\n这个例子中的条件检查两个变量是否具有相同的值。如果是，你将得到一系列警告框（*Hi*，然后是\
    \ *They match*，最后是 *Bye*）。如果 a 和 b 存储不同的值，你仍然会得到 *Hi* 和 *Bye* 框，但 if 块中的代码会被跳过。\n\
    \n当你写一个 `if` 块时，一定要记住条件周围的括号，否则它将不起作用。这是一个常见的错误：\n\n```\n// 我的括号在哪儿？\nif a ==\
    \ b {\n```\n\n也不要犯这个错误：\n\n```\n// 这是错误的等号。\nif (a = b) {\n```\n\n单个等号只适用于*设置*变量。所以这段代码实际上是将\
    \ `b` 的值复制到 `a`，这绝对不是你想要的。\n\n## 更多的逻辑运算符\n\n符号 `<` 和 `>` 和 `==` 被称为*逻辑运算符*，因为你在条件中使用它们来比较值。它们是最常见的逻辑运算符，但还有一些需要学习。\n\
    \n除了询问两个变量是否相等，你还可以询问它们是否*不相等*。这恰好是相反的问题。你通过将条件中的 `==` 改为 `!=` 来做到这一点。\n\n```\n\
    if (a != b) {\n    alert(\"Nope, no match\");\n}\n```\n\n这个条件问“这些变量具有不同的值吗？”如果它们不同，条件为真，警告框出现。否则，没有消息。\n\
    \n你还可以使用 `>=`（大于或等于）和 `<=`（小于或等于）运算符，它们的工作方式与 `>` 和 `<` 类似，只是当两个数字相同时，它们也为真。\n"
