  md: '# # Making Decisions


    So far your programs have been a little short in the brains department. The key
    ingredient they’re missing is the ability to *make decisions*—in other words,
    to evaluate information and then set a course.


    To add this ability, you need to learn a programming concept called *conditional
    logic*. It’s the art of asking questions, and then choosing what to do.


    # ## Introducing conditions


    A condition is a question that has two possible answers: true or false.


    For example, look at this condition with two variables:


    ```

    a > b

    ```


    This condition makes a simple claim: *a is greater than b*. If `a` holds the number
    12, and `b` holds the number 3, this condition is true. But if `a` holds the number
    3, and `b` holds the number 12, this condition is false. (This condition assumes
    that `a` and `b` are numbers. If they aren’t, this condition doesn’t make sense.)


    Here’s another example of a condition:


    ```

    a == b

    ```


    This condition asks *does a equal b*? In this case, it doesn’t matter what type
    of data the variable `a` holds—it could be a number or a piece of text. The important
    part is that the variable `b` has exactly the same content as `a`. So if they
    both hold the same number (like 42) or a matching piece of text (like “blunderstone”),
    the condition is true.'
  merge: -1
  pgno: 82
- img_proc: true
  md: "You might be wondering why there are two equal signs (==). That’s just the\
    \ way JavaScript works, because it wants to distinguish between = (which you use\
    \ to set a variable) and == (which you use to compare values in a condition).\
    \ Some other programming languages use the ordinary = for both uses.\n\n# The\
    \ if statement\n\nTo get a condition to actually do something, you need to pair\
    \ it with the `if` keyword. Here’s an example:\n\n```\nif (a > b) {\n  // (Do\
    \ something here.)\n}\n```\n\nThe `if` statement tells JavaScript to look at a\
    \ condition and run a piece of code if the condition is true. Here’s how it breaks\
    \ down:\n\n![](img/ca187fcf58ff903e6e3e0367ce7a0d62_83_0.png)"
  merge: -1
  pgno: 83
- img_proc: true
  md: "Remember, a condition can only have two possible outcomes:\n\n+   - If the\
    \ condition is true (in this example, a is greater than b), JavaScript runs the\
    \ code between the two braces.\n- If the condition is false (a is less than or\
    \ equal to b), JavaScript skips over the code in the braces and carries on.\n\n\
    You can put as many lines of code as you want in between the braces. They all\
    \ become part of the same conditional block. If you only need a single code statement\
    \ in your conditional block, you can remove the braces. But we recommend always\
    \ keeping the braces to make your code clearer.\n\nCan you tell what happens in\
    \ this next example?\n\n```\nalert(\"Hi\");\n\nif (a == b) {\n    alert(\"They\
    \ match\");\n}\n\nalert(\"Bye\");\n```\n\nThe condition in this example checks\
    \ if two variables have the same value. If they do, you'll get a sequence of alert\
    \ boxes (*Hi*, then *They match*, and finally *Bye*). If a and b hold different\
    \ variables, you still get the *Hi* and *Bye* boxes, but the code in the if block\
    \ is skipped.\n\nWhen you write an `if` block, make sure to remember the parentheses\
    \ around your condition, or it won't work. Here's a common mistake:\n\n```\n//\
    \ Where are my parentheses?\nif a == b {\n```"
  merge: -1
