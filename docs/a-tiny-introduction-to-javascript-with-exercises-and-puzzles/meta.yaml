    HTML pages and someone said “Let’s add a programming language to make things less
    boring!”


    You’ve already seen how web pages run your code using events (like button clicks).
    But that’s not the only way that JavaScript and HTML interact. Your code can *read*
    the information that’s in the page and even *change* the page.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_64_0.png)


    ## Introducing the DOM


    JavaScript has a powerful built-in feature. It examines your web page, finds every
    HTML element, and automatically creates matching objects. (Objects are a special
    type of programming ingredient that you can use in your code.) For example, if
    you have a page with a paragraph and a button, JavaScript automatically creates
    a paragraph object and a button object. This feature is called DOM, for *Document
    Object Model*.


    You use these DOM objects to interact with the page. For example, you can find
    out what text is in a text box, or change a picture, or write a message on the
    page. You’ll learn how to do all these tasks in this chapter.


    ## Getting information out of a text box


    In many programs, you type information into a text box, and the program does something
    with that information. You''ve seen this technique in earlier exercises like *Alice
    the Unshakeable*.


    You may already know that you make a text box using the `<input type="text">`
    element. Here''s an example:


    ```

    Put your name here: <input type="text">

    ```


    That text box looks like this:


    **Put your name here:** <input type="text">


    Now let''s say you type something in the text box. How does your code get that
    information?


    First, you need to give your text box a unique name. This name is called an `id`.
    Here''s a text box named `nameBox`:


    ```

    Put your name here: <input type="text" id="nameBox">

    ```


    The `id` doesn''t change how your page looks. But it gives your code a way to
    find the JavaScript object for your text box, and grab hold of it. And once you
    have the object, you can do a whole lot more—including getting the text that''s
    inside the text box.


    Here''s the magic JavaScript command that pulls this off. It finds the text box
    and copies its text into a variable called `firstName`.


    ```

    let firstName;

    firstName = document.getElementById("nameBox").value;

    ```


    The first statement is obvious (it creates the `firstName` variable). But the
    second statement needs some explanation.


    Let’s break it down into pieces:


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_66_0.png)


    1. `document` isn’t a JavaScript command. It’s an object that represents the entire
    web page document. That means that `document` is a container that holds all the
    objects on your page, including the text box.

    2. `getElementById()` is a function that’s built into the document object. You
    use this function to search for an object with a specific id. The dot ties the
    `getElementById()` function to the document object.

    3. `nameBox` is the id that you’re looking for. The specific name doesn''t matter,
    but it must match the name you wrote in your HTML exactly, with the same capitalization.

    4. If you get all these bits right, the `getElementById()` function finds the
    object for your text box. The final step in this statement is to get one piece
    of information out of the text box object—in this case, that’s the `value`, which
    holds its text.


    The `getElementById()` function is picky. First, you need to make sure you have
    perfect capitalization when you call it. If you have autocomplete turned on in
    CodePen (as described in Chapter Zero), it will help you out by listing the functions
    of the document object as you type. If you see the match you want, just click
    it.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_67_0.png)


    As you can see, the document object has many more functions that can help you
    find objects in your web page. But you don''t need to learn those right now.


    When you use `document.getElementById()`, you need to make sure you type the id
    exactly right. If you make a mistake, you won''t get the text box object you want.
    Instead, you''ll get an empty value called `null`. And when you try to take the
    next step and get the value of `null`, you''ll get a weird error like this:


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_67_1.png)


    As you spend more time with JavaScript, you''ll learn to recognize null errors
    and you''ll remember to check your variables and id names.


    > TIP One way to avoid this sort of problem is to copy your id from the HTML box
    and paste it into your code in the JavaScript box. That way, you don’t have a
    chance to make a mistake.


    ## Try it yourself!


    - A Greeting from the King (Challenge Level: Medium)


    [https://codepen.io/prosetech/pen/LYGMEQy](https://codepen.io/prosetech/pen/LYGMEQy)


    This example has three text boxes for you to fill in.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_68_0.png)


    The program’s task is to grab this information (name, age, and special talent),
    and put it together to make a custom greeting from the king. (For example, if
    someone fills in Wendy, 20, and hiding in bathtubs, the greeting might be “Greetings,
    my fine squire Wendy. I’ve heard you are already a master at hiding in bathtubs
    at the ripe age of 20.”)


    Here''s what you need to do to get this example working:


    1. Give your text boxes id names so your code can find them.

    2. Use the magic `document.getElementById()` command to get the value of each
    text box, and put it in three separate variables.

    3. Use the `+` operator to build the greeting message.

    4. Show the completed message with `alert()`.


    Once you''ve finished this example, make sure you keep it around (or fork it to
    save it in your CodePen account). That''s because you''ll come back to it to make
    changes a little later.


    ## Converting strings to numbers


    Everything in a text box is treated like it''s text. Even if you type in a number
    like 43298, to JavaScript it looks like a string with five characters that just
    happen to be digits.


    Sometimes, this is a problem. For example, if you want to pull a number out of
    a text box and perform a calculation with it, it won''t work. Remember, you can''t
    do math with text!


    The solution is to convert your string to a proper number variable. There are
    a few different ways to do this in JavaScript, but the most straightforward is
    to use a function called `Number()`. Here''s how it works:


    ```javascript

    let someText = "42";

    let myNumber = Number(someText);


    // You can''t do math with someText, but you can do math with myNumber.

    ```


    In this example, the first statement creates a variable (`someText`) that holds
    "42" as a string. The second statement converts it to a number (42), and puts
    it in a second variable (`myNumber`).


    It''s important to realize that `Number()` only works if you have a sequence of
    ordinary digits. If you have something else in your string, like a comma ("42,000"),
    a dollar sign ("$4.14"), or some words ("84 kites"), `Number()` can''t convert
    it. Instead, JavaScript sets your variable to `NaN`, which is a useless JavaScript
    codeword that means "not a number."


