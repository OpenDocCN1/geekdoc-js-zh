    `cents` 变量来修复这个问题（这个变量不需要小数）。记得在将数字显示在页面上之前，把美分数量换算回美元数量。


    ## 探索 Math 对象


    如果你有一台普通的科学计算器，你知道它不仅仅能做加、减、乘、除。很多功能都挤在特殊的按钮里。JavaScript 也是这样。基本的数学函数已经内置于 JavaScript
    语言中，并使用你已经学过的运算符（`+ - * / ^`）。但当你需要更多计算能力时，就需要求助于一个叫做 `Math` 对象的特殊功能。


    `Math` 对象将一系列执行专业数学计算的函数打包在一起。在编写代码时，你可以查看所有这些函数。输入 `Math`，后面跟一个点（`.`），你就会看到 `Math`
    对象提供的所有功能列表。


    所有这些函数都接受一个或多个参数，并以返回值的形式给你结果。


    例如，如果你想计算一个数的平方根，可以使用 `Math.sqrt()` 函数。（这里，`Math` 是对象，`sqrt()` 是它的函数之一。）


    ```

    let number = 9;

    number = Math.sqrt(number);


    // 现在 number 的值是 3（因为 9 的平方根是 3）。

    ```


    `Math` 对象不仅仅关于平方根。如果你想计算一个角的正切值（在高中三角函数中很重要，也用于计算空中抛射物的游戏），你可以使用 `Math.tan()`。依此类推。


    ## 亲自试试看！


    ▶ 这个蛋糕有多大？（挑战等级：中等）


    https://codepen.io/prosetech/pen/QWyRYjQ


    很少有问题比你在这个挑战中要解决的问题更重要——准确测量你即将吃掉的蛋糕有多大。


    如果你还记得一点几何知识，你可能知道如何计算一个形状的面积。对于一个简单的矩形，你需要用它的长乘以宽。对于一个圆形，你需要进行一个类似但更复杂的计算，看起来像这样：


    ```

    π (d/2)²

    ```


    在这个等式中，*d* 是圆的直径，*pi* (π) 是一个神奇的数学常数，它从 3.14 开始并无限延续下去。但你不需要记住 *pi* 的每一位数字，因为
    `Math` 对象有一个内置变量已经为你存储好了它。


    花点时间看看你是否能在 `Math` 对象中找到 *pi*。然后用它来计算你的蛋糕的面积。你需要编写一条语句，将直径除以 2，对结果求平方，然后再乘以 *pi*。你可以在一行代码中完成所有这些，或者如果你觉得更容易，可以分解成单独的步骤。记住，你需要使用
    `**` 运算符来进行指数运算（`4**2` 表示 4²）。


    **注意** `Math.PI` 的行为就像一个变量。这意味着你不需要像使用其他内置 `Math` 函数那样使用括号。


    ## 数字舍入


    如果有人问你的蛋糕有多大，说 8 英寸是合理的。但如果你告诉他们是 8.045840982 英寸，就没那么有帮助了。但 JavaScript 就是这样。


    在你的代码中，如果数字有一个很长的小数部分，比如 8.045840982，这并不重要。你可以像使用变量中的任何其他值一样继续使用它进行计算。但如果你想在某处*显示*你的数字，比如在一个警告框或网页上，你可能希望把它修剪成一个更整洁的大小。


    `Math` 对象有一个 `round()` 函数可以完成这项工作。下面它演示了如何去掉数字的所有小数部分：


    ```

    let longNumber = 4.349;

    let roundedNumber = Math.round(longNumber);


    // 现在 roundedNumber 是 4

    ```


    `round()` 函数总是四舍五入到最接近的整数。所以 4.349 变成 4，而 4.931 变成 5。但如果你想舍入到不同的位数呢？


    例如，假设你想保留正好两位小数，这样 4.349 就会变成 4.35。你可能期望 `round()` 函数能为你做到这一点，但它没那么有帮助。你需要自己动手。


    在这种情况下，你需要用一些乘法和除法来调整你的数字。下面是一个演示：


    ```

    let longNumber = 4.349;


    // 将小数点向右移动两位。

    longNumber = longNumber * 100          // longNumber=434.9


    // 对数字进行舍入。

    let roundedNumber = Math.round(longNumber);   // roundedNumber=435


    // 将小数点移回原来的位置。

    roundedNumber = roundedNumber / 100       // roundedNumber=4.35

    ```


    这个例子将小数点移动到正确的位置，对数字进行舍入，然后将小数点移回原来的位置。一旦你习惯了这种模式，你可以在一条语句中完成所有这些操作：


    ```

    let longNumber = 4.349;

    let roundedNumber = Math.round(longNumber*100) / 100;

    ```

