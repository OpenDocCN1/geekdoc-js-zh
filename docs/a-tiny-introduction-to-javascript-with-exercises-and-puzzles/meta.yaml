    What’s inside the `mysteryNumber` variable when this code ends? Why, it’s the
    number 20, of course. All the other numbers were tossed out when they were replaced.


    > NOTE Remember, you only declare a variable once (with `let`). But you can assign
    a value to your variable as often as you want. The same is true of buckets—buy
    a bucket once, and you can change what’s inside anytime.'
