- img_proc: true
  md: "And don't make this mistake:\n\n```\n// This is the wrong equal sign.\nif (a\
    \ = b) {\n```\n\nA single equal sign is only good for *setting* variables. So\
    \ this code actually copies the value from `b` into `a`, which definitely isn't\
    \ what you want.\n\n# More logical operators\n\nThe symbols `<` and `>` and `==`\
    \ are called *logical operators*, because you use them to compare values in a\
    \ condition. They are the most common logical operators, but there are still a\
    \ few more to learn.\n\nInstead of asking if two variables are equal, you can\
    \ ask if they are *not equal*. This is exactly the opposite question. You do this\
    \ by changing the `==` in your condition to `!=`\n\n```\nif (a != b) {\n    alert(\"\
    Nope, no match\");\n}\n```\n\nThis condition asks \"do these variables have different\
    \ values?\" If they do, the condition is true and the alert box appears. Otherwise,\
    \ there's no message.\n\nYou can also use the `>=` (greater than or equal) and\
    \ `<=` (less than or equal) operators, which work like `>` and `<` except they\
    \ are also true when your two numbers are the same."
  merge: -1
