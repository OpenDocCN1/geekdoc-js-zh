    If you run this code, you''ll find that the random number probably isn''t what
    you expect. Maybe you want a random number between 1 and 6 (representing the roll
    of a dice). What you actually get is a massive fractional value that''s more than
    0 but less than 1, like this:


    0.43085308054


    It''s random, but not very helpful. It''s up to you to take this fractional value
    and convert it to a number in the range you want.


    Here''s the good news. There''s a formula you can use to pick a random whole number.
    The formula looks like this:


    ```

    randomNumber = Math.floor(Math.random() * (max - min + 1) ) + min;

    ```


