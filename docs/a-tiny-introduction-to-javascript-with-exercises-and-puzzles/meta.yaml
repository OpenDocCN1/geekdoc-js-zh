    \n# Chapter 6: The Lifetime of a Variable\n\nIt’s easy to create a variable and\
    \ use it right away. But what if you want to create a variable, put something\
    \ in it, and make sure it’s still around the *next* time someone clicks a button?\n\
    \nKeeping variables alive is an important technique in programming. Imagine trying\
    \ to build a game if every variable resets itself each time you click a button!\
    \ But before you can take control of your variables and store information for\
    \ the long term, you need to understand a bit more about how they live… and when\
    \ they die.\n\n## Local variables\n\nWhen you define a variable inside a function,\
    \ it’s called a *local variable*. It lives until the function ends. Here’s an\
    \ example with a string called `welcomeMessage`:\n\n```javascript\nfunction sayHello()\
    \ {\n  let welcomeMessage = \"Hi, fancy pants\";\n  alert(welcomeMessage);\n}\n\
    ```\n\nOnce the code runs and the `sayHello()` function ends, the `welcomeMessage`\
    \ is thrown away, along with whatever information is inside the variable. There’s\
    \ no way to get that information back.\n\nIn a program, the same piece of code\
    \ can run many times. For example, maybe the `sayHello()` function is attached\
    \ to the `onclick` event of a button. In that case, every time you click the button\
    \ this happens:\n\n1.  The `sayHello()` function starts.\n2.  It creates a new,\
    \ blank copy of the `welcomeMessage` variable.\n3.  It puts the “Hi, fancy pants”\
    \ text inside the `welcomeMessage` variable.\n4.  It uses `alert()` to show the\
    \ message.\n5.  The `sayHello()` function ends, and the `welcomeMessage` function\
    \ variable disappears again, taking its contents with it.\n\nClearly, you can’t\
    \ use `welcomeMessage` to store information for a longer time, because the variable\
    \ only lives for a few seconds. This isn’t a problem in this example, because\
    \ `welcomeMessage` never changes. But there is *another* way.\n\n## Global variables\n\
    \nSometimes you have a piece of information that you want to keep around for longer,\
    \ maybe even as long as your program is running.\n\n> **NOTE** In a web page,\
    \ “as long as the program is running” means as long as the web page is open in\
    \ the browser. As soon as you close the browser tab or go to a different page,\
    \ your program is over. (In CodePen, there's one more rule—when you edit your\
    \ example, the program restarts.)\n\nTo store data for a longer period of time,\
    \ you need to use a *global variable*. Local variables stay in one *location*\
    \ (the function where you create them). Global variables are available everywhere\
    \ in your code.\n\nTo define a global variable you use the same `let` keyword,\
    \ but you put it in a different place. Instead of creating your variable inside\
    \ a function, you declare it *outside* of your function.\n\nHere’s an example:\n\
    \n```javascript\nlet welcomeMessage = \"Hi, fancy pants\";\n\nfunction sayHello()\
    \ {\n    alert(welcomeMessage);\n}\n```\n\nYou might be suspicious of this code\
    \ if you remember the rule from Chapter 1 (don’t put code outside a function).\
    \ But code that creates variables is acceptable. It runs right away, and sets\
    \ everything up for your functions to use.\n\n> **TIP** You can put your variables\
    \ before the functions that use them—or anywhere you want, really. But usually,\
    \ the simplest way to organize your code is to put all your global variables at\
    \ the beginning of the code file (at the top of the JavaScript box), above all\
    \ your functions.\n\nThis code in this example (with the global `welcomeMessage`\
    \ variable) still works the same as the earlier version (with the local `welcomeMessage`\
    \ variable). But that quickly changes in slightly more complicated examples, like\
    \ the ones you’ll see next.\n\n## Sharing the same variable with different functions\n\
    \nHere’s a quick recap of the two differences between global variables and local\
    \ variables:\n\n-   Local variables live until the function ends. Global variables\
    \ live until the program ends—say, when you close the browser (or edit your code\
    \ in CodePen).\n-   Local variables can only be used in one function. But you\
    \ can use global variables in *every* function.\n\nThe second concept is called\
    \ *scope*, and it’s the one we’ll explore next.\n\nSo far, you’ve been looking\
    \ at a lot of examples with just one button and one function. But most JavaScript\
    \ programs will have a bunch of functions that run when different things happen.\
    \ For example, imagine you have a three-button program like this:\n\n-   Become\
    \ Nice\n-   Become Mean\n-   Say Hello\n\nWhen you click **Become Nice**, it sets\
    \ `welcomeMessage` to something nice:\n\n```javascript\nfunction beNice() {\n\
    \  welcomeMessage = \"I'm so delighted you could join me for tea.\";\n}\n```\n\
    \nWhen you click **Become Mean**, it sets `welcomeMessage` to something else:\n\
    \n```javascript\nfunction beMean() {\n  welcomeMessage = \"I plan to eat you and\
    \ your pet goldfish.\";\n}\n```\n\nWhen you click **Say Hello**, you get whatever\
    \ greeting you last chose:\n\n```javascript\nfunction sayHello() {\n  alert(welcomeMessage);\n\
    }\n```\n\nIn the next exercise, you can try creating this example."
