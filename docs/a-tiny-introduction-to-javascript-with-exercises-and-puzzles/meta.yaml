    if you''re curious about the things I''ve written in the past (http://prosetech.com).


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_13_0.png)


    # How can I support the Tiny Introductions project?


    Please enjoy this book guilt-free! Share it with your family! Give it to your
    friends! There''s no limit, so long as you don''t change it or pass it off as
    your own work.


    If you find mistakes, please let me know. I greatly benefit from people pointing
    out problems I''ve missed, so they don''t frustrate other readers. Send me your
    complaints, comments, questions, and suggestions to matthew@prosetech.com. What
    worked? What''s still keeping you up at night? Don''t be shy!


    If you feel particularly enthusiastic about the Tiny Introductions project, and
    you want to say thanks (or just encourage me to write more books in the series),
