  md: '# Try it yourself!


    > ▶ Follow the Function Trail (Challenge Level: Easy)


    https://codepen.io/prosetech/pen/WNrYyYR


    In a real program, you’ll find piles of functions. When the program is running,
    JavaScript jumps from one to another, and you’ll need to be able to follow along.


    This exercise gives you the chance to think like engine by following a trail of
    function calls. Start by looking at the code (but don’t run it). The program has
    two buttons, and each one calls a different combination of the same functions.
    On a piece of paper, write down the order of messages that you expect to see for
    each button. It’s trickier than it seems, because some functions call other functions,
    and so on. Then, run the program to see if you’re right.


    The point of this exercise is just to see how functions work. In real life, your
    functions aren’t one-liners showing messages. But once you know how to call a
    super-short function, you know how to call a longer one, because they work exactly
    the same.


    Also, checking the assumptions you have about your code is a Programmer Life Skill.
    Often, weird errors happen because your code isn’t doing what you think it’s doing.


    Here’s a final test you might want to try. What happens if you call a function
    that calls itself? Or if function A( ) calls B( ) which then calls A( )?


    # Functions that get data


    As you’ve already seen, every time you call a function you put a set of parentheses
    ( ) after the function name. These aren’t just for decoration. They also allow
    you to send one or more pieces of data to a function. Each piece of data is called
    a *parameter*.'
  merge: -1
  pgno: 120
- img_proc: true
  md: "In order for this technique to work, your function must be designed to accept\
    \ parameters. Plenty of functions are. One example is the alert() function that\
    \ you’ve used many times. You send the message you want it to show using a string:\n\
    \n```\nalert(\"Hello from the alert function.\");\n```\n\nTo make a function that\
    \ accepts parameters, you need to declare them. For example, look at this simple\
    \ no-parameter version of the showMessage() function:\n\n```\nfunction showMessage()\
    \ {\n    alert(\"Greetings from the showMessage() function.\");\n}\n```\n\nTo\
    \ add a parameter, you put it in between the parentheses after the function name:\n\
    \n```\nfunction showMessage(guestName) {\n    alert(\"Greetings from the showMessage()\
    \ function.\");\n}\n```\n\nAdding a parameter is just like defining a variable.\
