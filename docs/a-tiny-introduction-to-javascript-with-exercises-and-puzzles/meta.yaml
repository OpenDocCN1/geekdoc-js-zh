    # Chapter 4: Changing Variables


    Variables are called variables because their contents vary. In other words, you
    can change what’s stored inside a variable as often as you want. You can rearrange
    bits of text, count things that happen, and perform mathematical calculations.
    These kinds of operations are the first step to making your code more intelligent.


    ![](img/ca187fcf58ff903e6e3e0367ce7a0d62_52_0.png)


    ## Really easy math


    There are lots of ways to change the value that’s stored in a variable. If your
    variable is a number, you can use simple math.


    For example, take a look at the plus + operator. It lets you add two numbers together:


    ```

    age = 12 + 9;

    ```


    When you run this code, JavaScript starts by doing all the math on the right side
    of the equal sign. In this example, that means it adds 12 and 9 to get the result
    (21). Then it takes that result and puts it in the age variable.


    ```

    age ← 21

    ```


    Of course, you can also subtract a number with the – operator:


    ```

    age = 400 – 9;


    // Now age holds the number 391.

    ```


    Both these examples have extra spaces to make the code easier to read. But if
    you want, you can cram everything closer together:


    ```

    age=400-9;

    ```


    ## Slightly fancier math


    The + and - signs are called *operators*. JavaScript also recognizes:


    - * operator for multiplication (3×2 is 3*2 in JavaScript)

    - / operator for division (6÷2 is 6/2 in JavaScript)

    - ** operator for exponents (6² is 6**2 in JavaScript)


    You can also control the order that JavaScript performs its calculations with
    brackets ( ). Ordinarily, JavaScript follows the traditional order of operations,
    which means it calculates exponents first, then does multiplication and division,
    and ends with addition and subtraction. So if you have a statement like this:


    ```

    total = 2+6/2;

    ```


    JavaScript performs the 6/2 part first (it’s 3), then adds 2 and 3 to get 5. Compare
    that to this version with parentheses:


    ```

    total = (2+6)/2;

    ```


    Now JavaScript adds (2+6) first to get 8, and divides that by 2 to end up with
    4.


    If you want to do anything more complex—like rounding numbers, or calculating
    exponents—you need to use JavaScript’s Math object, which you’ll explore in later
    lessons.'
