    ## JavaScript 在处理小数时的古怪错误


    现在要说个坏消息了。计算机处理小数的方式有点奇怪。


    你已经知道 JavaScript 的数字非常灵活。你可以用一个数字变量来存储一个整数（比如 -342），或者一个更大的数（比如 8093411059），或者一个更精确的数（比如
    0.00000345908）。这被称为*浮点数*，因为小数点可以“浮动”，从而表示你需要的任何大小或小数位数的数字。


    计算机有快速高效的方法来存储浮点数并进行计算。然而，这里有个问题。某些小数的值无法被精确地存储。因此，你的计算中可能会出现奇怪的舍入误差。这些舍入误差非常小，但仍然会造成混乱。


    要看到这个问题，可以试试这个“加一角硬币”的示例：https://codepen.io/prosetech/pen/JjGVBVa。每次你点击，它都会在页面显示的总额上加
    $0.10。这在前几次点击时工作正常，但当你期望达到 $0.30 时，你却会得到数字 0.30000000000000004。再加一些硬币，一切又恢复正常——直到你达到
    0.7999999999999999，而你本应有 $0.80。显然有些地方不对劲。


    **你的零钱袋里有：$0.30000000000000004**


    [添加一角硬币]


    问题在于，某些小数的值无法精确地转换为浮点数。（这类似于你试图将 1/3 写成小数时遇到的问题。你可以在纸上写出尽可能多的 0.33333，但它仍然不能完美地表示三分之一。）


    这个问题不仅限于 JavaScript。它在每种编程语言的浮点数处理中都会发生。区别在于，有些语言提供了十进制数据类型来专门避免这个问题。JavaScript
    没有，所以你需要自己来修正这个错误。


    如何修复它呢？如果你正在编写一个涉及大量小数位的科学计算程序，那么不需要做任何改变。但如果你编写的是一个涉及精确金额的程序，看到几分钱的微小误差会让人很困惑。


    有两个解决方案。你可以使用舍入，你马上就会学到如何做。这样你就可以去掉任何没有意义的额外小数位。但更简单的方法是完全避免使用小数。因此，不要跟踪美元金额（比如
    $4.30），而是计算总共有多少美分（比如 430）。


