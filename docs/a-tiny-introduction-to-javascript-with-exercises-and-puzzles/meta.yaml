    message += "  some panckes";


    // Now message holds the text "Let''s eat some pancakes."

    ```


    JavaScript has similar shortcuts for subtraction, multiplication, and division.

    They all work the same, but the + part of the += operator is replaced with the
    type

    of mathematical operation you want to do:


    ```

    let counter = 12;


