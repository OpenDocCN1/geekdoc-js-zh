    ![](img/ca187fcf58ff903e6e3e0367ce7a0d64_145_0.png)


    First, look at the code. You''ll see two global variables at the top:


    ```

    let secretNumber;

    let numberOfGuesses = 0;

    ```


    Your first job is to pick a secret number between 1 and 10. You want to pick this
