    ## Review


    Congratulations on finishing Advanced Objects! Let’s review the concepts covered
    in this lesson:


    - The object that a method belongs to is called the calling object.

    - The `this` keyword refers the calling object and can be used to access properties
    of the calling object.

    - Methods do not automatically have access to other internal properties of the
    calling object.

    - The value of `this` depends on where the `this` is being accessed from.

    - We cannot use arrow functions as methods if we want to access other internal
    properties.

    - JavaScript objects do not have built-in privacy, rather there are conventions
    to follow to notify other developers about the intent of the code.

    - The usage of an underscore before a property name means that the original developer
    did not intend for that property to be directly changed.

    - Setters and getter methods allow for more detailed ways of accessing and assigning
    properties.

    - Factory functions allow us to create object instances quickly and repeatedly.

    - There are different ways to use object destructuring: one way is the property
    value shorthand and another is destructured assignment.

    - As with any concept, it is a good skill to learn how to use the documentation
    with objects!


    ## Introduction to Classes


    JavaScript is an object-oriented programming (OOP) language we can use to model
    real-world items. In this lesson, you will learn how to make classes.


    Classes are a tool that developers use to quickly produce similar objects.


    Take, for example, an object representing a dog named `halley`. This dog’s name
    (a key) is "Halley" (a value) and has an `age` (another key) of `3` (another value).
    We create the `halley` object below:


    ![](Images/image04857.jpeg)


    Now, imagine you own a dog daycare and want to create a catalog of all the dogs
    who belong to the daycare. Instead of using the syntax above for every dog that
    joins the daycare, we can create a `Dog` class that serves as a template for creating
    new `Dog` objects. For each new dog, you can provide a value for their name.


    As you can see, classes are a great way to reduce duplicate code and debugging
    time.


    After we lay the foundation for classes in the first few exercises, we will introduce
    inheritance and static methods — two features that will make your code more efficient
    and meaningful.


    ### Instructions 1.


    In the next exercise, you will learn about classes in greater detail. Before you
    do, take a moment to study the class in `main.js`.


    Spend some time identifying the similarities and differences between the `Dog`
    class in `main.js` and the code we used to create our `halley` object in the instructions
    above.


    Checkpoint 2 Passed


    ### 2.


    Copy the class instantiation, method call, and `console.log()` statements below
    into `main.js`.


    ![](Images/image04858.jpeg)


    What do you expect to see when you run this code?


    ![](Images/image04859.jpeg)

    ![](Images/image04860.jpeg)


    ### Constructor


    In the last exercise, you created a class and used it to produce a Dog object.
    Although you may see similarities between class and object, there is one important
    method that sets them apart. It’s called `constructor`.


    ![](Images/image0461.jpeg)


    - `Dog` is the name of the class. By convention, we capitalize class names.

    - JavaScript calls the `constructor()` method every time it creates new instance.

    - In the context of a class, `this` refers to an instance.

    - Inside the `constructor()` method, we use `this` to set the `name` property
    to the `name` argument.


    In the next exercise, you will learn how to create instances.


    ![](Images/image0482.jpeg)


    1. Create an empty class named `Surgeon`.


    Checkpoint 2 Passed


    Stuck? Get a hint


    2. Inside the `Surgeon` class, create a `constructor()` method that accepts two
    parameters: `name` and `department`.


    Checkpoint 3 Passed


    Stuck? Get a hint


    3. Inside the `Surgeon` constructor(), create `name` and `department` properties
    and set them equal to parameters.


    ![](Images/image0483.jpeg)


    ### Instance


    Now, we’re ready to create class instances. An instance is an object that contains
    property names and methods of a class, but with unique property values. Let’s
    look at our `Dog` class example.


    ![](Images/image0484.jpeg)

    ![](Images/image0485.jpeg)


    Below our class, we use the `new` keyword to create an instance of


    ![](Images/image0486.jpeg)


    - We create a new variable named `halley` that will store an instance of our `Dog`
    class.

    - We use the `new` keyword to generate a new instance of the `Dog` class. The
    `new` keyword calls the `constructor()`, runs the code inside it, and then returns
    the new instance.

    - We pass the ''Halley'' string to the `Dog` constructor, which sets the `name`
    property to ''Halley''.

    - Finally, we log the value saved to the `name` key in our `halley` object, which
    logs ''Halley'' to the console.


    Now you know how to create instances. In the next exercise, you will learn how
    to add getters, setters, and methods.


