    \ when you’re ready to move on to the next step.\n\n**Checkpoint 2 Passed\n\n\
    Stuck? Get a hint\n\n### 2.\n\nFill in the body of the `announceDinner()` function\
    \ so that it has the same functionality as `nativePromiseDinner()`. It should\
    \ wait for the promise returned from `brainstormDinner()` to resolve, and then\
    \ log a string to the `console` in the same format as did `nativePromiseDinner()`.\
    \ You’ll need to use the `await` operator inside your function.\n\nWhen you’re\
    \ ready, check your work to move on to the next step.\n\n**Checkpoint 3 Passed\n\
    \nStuck? Get a hint\n\n### 3.\n\nAt the bottom of `app.js`, beneath the function\
    \ declaration, invoke the `announceDinner()` function.\n\n**Checkpoint 4 Passed\n\
    \nStuck? Get a hint\n\n### 4.\n\n![](Images/image05010.jpeg)In the terminal type\
    \ `node app.js` and press to execute your code.\n\n![](Images/image05011.jpeg)\n\
    \n Writing Async Functions\n\nWe’ve seen that the `await` keyword halts the execution\
    \ of an `async` function until a promise is no longer pending. Don’t forget the\
    \ `await` keyword! It may seem obvious, but this can be a tricky mistake to catch\
    \ because our function will still run— it just won’t have the desired results.\n\
    \nWe’re going to explore this using the following function, which returns a promise\
    \ that resolves to 'Yay, I resolved!' after a 1 second delay:\n\n![](Images/image05012.jpeg)\n\
    \nNow we’ll write two async functions which invoke `myPromise()`:\n\n![](Images/image05013.jpeg)\n\
    \nIn the first async function, `noAwait()`, we left off the `await` keyword before\
    \ `myPromise()`. In the second, `yesAwait()`, we included it.\n\nThe `noAwait()`\
    \ function logs `Promise { <pending> }` to the console. Without the `await` keyword,\
    \ the function execution wasn’t paused.\n\nThe `console.log()` on the following\
    \ line was executed before the promise had resolved.\n\nRemember that the `await`\
    \ operator returns the resolved value of a promise. When used properly in `yesAwait()`,\
    \ the variable `value` was assigned the resolved value of the `myPromise()` promise,\
    \ whereas in `noAwait()`, `value` was assigned the promise object itself.\n\n\
    #### Instructions 1.\n\nTake a look at the provided code. We required in the `shopForBeans()`\
    \ function from `library.js` which returns a promise with a resolved value of\
    \ a string representing a type of bean, eg. ‘kidney’.\n\nNext, we declared the\
    \ `getBeans()` function. Let’s summarize its intended functionality:\n\n* Log\
    \ '1. Heading to the store to buy beans...' to the `console`.\n* Capture the resolved\
    \ value of the promise returned when we invoke `shopForBeans()`.\n* The promise\
    \ returned from `shopForBeans()` prints a string in the format '2. I bought [the\
    \ resolved type of beans] beans because they were on sale.'\n* Finally, the function\
    \ prints a string in the format '3. Great! I'm making [the bean type] beans for\
