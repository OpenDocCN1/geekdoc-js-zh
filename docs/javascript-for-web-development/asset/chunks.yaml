    Stuck? Get a hint


    #### 3

    Take a moment to predict the output of this program.


    ![](Images/image04958.jpeg) Whenever you’re ready, type `node app.js` in the terminal
    and hit enter. See if the program’s output in the terminal lines up with what
    you expected.


    ![](Images/image04959.jpeg)


    ### Consuming Promises


    The initial state of an asynchronous promise is `pending`, but we have a guarantee
    that it will settle. How do we tell the computer what should happen then? Promise
    objects come with an aptly named `.then()` method. It allows us to say, “I have
    a promise, when it settles, then here’s what I want to happen…”


    In the case of our dishwasher promise, the dishwasher will run then:


    * If our promise rejects, this means we have dirty dishes, and we’ll add soap
    and run the dishwasher again.

    * If our promise fulfills, this means we have clean dishes, and we’ll put the
    dishes away.


    `.then()` is a higher-order function— it takes two callback functions as arguments.
    We refer to these callbacks as handlers. When the promise settles, the appropriate
    `handler` will be invoked with that settled value.


    * The first handler, sometimes called `onFulfilled`, is a success handler, and
    it should contain the logic for the promise resolving.

    * The second handler, sometimes called `onRejected`, is a failure handler, and
    it should contain the logic for the promise rejecting.


    We can invoke `.then()` with one, both, or neither handler! This allows for flexibility,
    but it can also make for tricky debugging. If the appropriate handler is not provided,
    instead of throwing an error, `.then()` will just return a promise with the same
    settled value as the promise it was called on. One important feature of `.then()`
    is that it always returns a promise. We’ll return to this in more detail in a
    later exercise and explore why it’s so important.


    #### Success and Failure Callback Functions


    To handle a “successful” promise, or a promise that resolved, we invoke `.then()`
    on the promise, passing in a success handler callback function:


    ![](Images/image04960.jpeg)


    Let’s break down what’s happening in the example code:


    * `prom` is a promise which will resolve to ''Yay!''.

    * We define a function, `handleSuccess()`, which prints the argument passed to
    it.

    * We invoke `prom`‘s `.then()` function passing in our `handleSuccess()` function.

    * Since `prom` resolves, `handleSuccess()` is invoked with `prom`‘s resolved value,
    ''Yay'', so ''Yay'' is logged to the console.


    With typical promise consumption, we won’t know whether a promise will resolve
    or reject, so we’ll need to provide the logic for either case. We can pass both
    a success callback and a failure callback to `.then()`.


    ![](Images/image04961.jpeg)


    Let’s break down what’s happening in the example code:


    * `prom` is a promise which will randomly either resolve with ''Yay!'' or reject
    with ''Ohhh noooo!''.

    * ![](Images/image04962.jpeg)We pass two handler functions to `.then()`. The first
    will be invoked with ''Yay!'' if the promise resolves, and the second will be
    invoked with ''Ohhh noooo!'' if the promise rejects.


    Note: The success callback is sometimes called the “success handler function”
    or the `onFulfilled` function. The failure callback is sometimes called the “failure
    handler function” or the `onRejected` function.


    Let’s write some success and failure callbacks!


    ![](Images/image04963.jpeg)


    #### 1

    Take a look at the provided code in `app.js`. We use `require()` to include the
    function `checkInventory()` from `library.js`. It builds on the logic of:


    * `checkInventory()` takes an `order` and returns a promise.

    * If every item is in stock, promise resolves with "Thank you. order was successful."

    * Otherwise, the promise rejects with "We''re sorry. order could not be completed".


    We used `setTimeout()` to ensure that promise settles asynchronously. If you’d
    like, look at `library.js`. Press “Check” when you’re ready.


    Checkpoint 2 Passed

    ![](Images/image04964.jpeg)


    2

    Write a function, `handleSuccess()`. You’ll use this function later as success
    handler. Since `prom` resolves, `handleSuccess()` is invoked with `prom`‘s resolved
    value, ''Yay'', so ''Yay'' is logged to the console.


    Checkpoint 3 Passed

    Stuck? Get a hint


    #### 3

    Write a function, `handleFailure()`. You’ll use this function later as failure
    handler. Since `prom` rejects, `handleFailure()` is invoked with `prom`‘s rejected
    value, ''Ohhh noooo!'', so ''Ohhh noooo!'' is logged to the console.


    Checkpoint 4 Passed

    Stuck? Get a hint


    #### 4

    Invoke `checkInventory()` with `order`. This will return a promise. Attach `.then()`
    to this. Pass into `.then()` the two handlers you wrote.


    Checkpoint 5 Passed

    Stuck? Get a hint


    #### 5

    Type `node app.js` in the terminal and hit enter.

    ![](Images/image04965.jpeg)


    ### Using catch with Promises


    One way to write cleaner code is to follow a principle called separation of concerns.
    Separation of concerns means organizing code into distinct sections each handling
    a specific task. It enables us to quickly navigate code and know where to look
    if something isn’t working.


    Remember, `.then()` will return a promise with the same settled value as the promise
    it was called on if no appropriate handler was provided. This implementation allows
    us to separate our resolved logic from our rejected logic. Instead of passing
    both handlers into one `.then()`, we can chain a second `.then()` with a failure
    handler to a first `.then()` with a success handler and both cases will be handled.


    ![](Images/image04967.jpeg)


    Since JavaScript doesn’t mind whitespace, we follow a common convention of putting
    each part of this chain on a new line to make it easier to read. To create even
    more readable code, we can use a different promise function: `.catch()`.


    The `.catch()` function takes only one argument, `onRejected`. In the case of
    a rejected promise, this failure handler will be invoked with the reason for rejection.
    Using `.catch()` accomplishes the same thing as using `.then()` with only a failure
    handler. Let’s look at an example using `.catch()`:


    Let’s break down what’s happening:


    * `prom` is a promise which randomly resolve with ''Yay!'' or reject with ''Ohhh
    noooo!''.

    * We pass a success handler to `.then()` and a failure handler to `.catch()`.

    * If the promise resolves, `.then()`‘s success handler will be invoked with ''Yay!''.

    ![](Images/image04968.jpeg)

