- fmt: "\nThere are a few general rules for naming variables:\n\n- Variable names\
    \ cannot start with numbers.\n- Variable names are case sensitive, so `myName`\
    \ and `myname` would be different variables. It is bad practice to create two\
    \ variables that have the same name using different cases.\n- Variable names cannot\
    \ be the same as keywords. For a comprehensive list of keywords check out [MDN’s\
    \ keyword](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords)\
    \ [documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords).\n\
    \nNote: In the next exercises, we will learn why ES6’s `let` and `const` are the\
    \ preferred variable keywords by many programmers. Because there is still a ton\
    \ of code written prior to ES6, it’s helpful to be familiar with the pre-ES6 `var`\
    \ keyword.\n\nIf you want to learn more about `var` and the quirks associated\
    \ with it, check out the [MDN var documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var).\n\
    \n![](Images/image04581.jpeg)\n\n### Exercises \n\n1. Declare a variable named\
    \ `favoriteFood` using the `var` keyword and assign to it the string 'pizza'.\n\
