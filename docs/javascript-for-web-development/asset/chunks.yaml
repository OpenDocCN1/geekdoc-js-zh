    # Handling Errors


    When `.catch()` is used with a long promise chain, there is no indication of where
    in the chain the error was thrown. This can make debugging challenging.


    With `async...await`, we use `try...catch` statements for error handling. By using
    this syntax, not only are we able to handle errors in the same way we do with
    synchronous code, but we can also catch both synchronous and asynchronous errors.
    This makes for easier debugging!


    ![](Images/image05020.jpeg)


    promise’s functions return promises we can still use native with an `async` function


    ![](Images/image05021.jpeg)


    ![](Images/image05022.jpeg)


    This is sometimes used in the global scope to catch final errors in complex code.


