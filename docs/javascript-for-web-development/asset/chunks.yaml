    ## Review


    Awesome work getting the hang of the `async...await` syntax! Let’s review what
    you’ve learned:


    - `async...await` is syntactic sugar built on native JavaScript promises and generators.

    - We declare an `async` function with the keyword `async`.

    - Inside an `async` function we use the `await` operator to pause execution of
    our function until an asynchronous action completes and the awaited promise is
    no longer pending.

    - `await` returns the resolved value of the awaited promise.

    - We can write multiple `await` statements to produce code that reads like synchronous
    code.

    - We use `try...catch` statements within our `async` functions for error handling.

    - We should still take advantage of concurrency by writing `async` functions that
    allow asynchronous actions to happen in concurrently whenever possible.


    ## Introduction to Requests


    Have you ever wondered what happens after you click a “Submit” button on a web
    page? For instance, if you are submitting information, where does the information
    go? How is the information processed? The answer to the previous questions revolves
    around HTTP requests.


    There are many types of HTTP requests. The four most commonly used types of HTTP
    requests are `GET`, `POST`, `PUT`, and `DELETE`. In this lesson, we’ll cover `GET`
    and `POST` requests. If you want to learn more about the different HTTP requests,
    we recommend the following documentation:


    - [Mozilla Developer Network: HTTP methods](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods)


    With a `GET` request, we’re retrieving, or getting, information from some source
    (usually a website). For a `POST` request, we’re posting information to a source
    that will process the information and send it back.


    In this lesson, we will explain how to make `GET` and `POST` requests by using
    JavaScript’s `XHR` object. We’ll also incorporate query strings into our requests.


    We’ll use the Datamuse API for `GET` requests and the Rebrandly URL Shortener
    API for `POST` requests. To complete the exercise on `POST`, make sure you create
    a Rebrandly API Key by following the instructions in the article below:


    - [Codecademy Articles: Rebrandly URL Shortener API](https://www.codecademy.com/articles/rebrandly-signup)


    ## Instructions


    Click the button on the web page to see what the code in `main.js` does.


    You’ll see JSON being displayed on the page. JSON, JavaScript Object Notation,
    will be the format in which our data is sent to us. That button you click produces
    a `GET` request. That’s right, you’ve just made a `GET` request!


    ## HTTP Requests


    One of JavaScript’s greatest assets is its non-blocking properties, or that it
    is an asynchronous language.


    Websites, like newspaper websites, take advantage of these non-blocking properties
    to provide a better user experience. Generally, a site’s code is written so that
    users don’t have to wait for a giant image to load before being allowed to read
    the actual article—rather, that text is rendered first and then the image can
    load in the background.


    JavaScript uses an event loop to handle asynchronous function calls. When a program
    is run, function calls are made and added to a stack. The functions that make
    requests that need to wait for servers to respond then get sent to a separate
    queue. Once the stack has cleared, then the functions in the queue are executed.


    Web developers use the event loop to create a smoother browsing experience by
    deciding when to call functions and how to handle asynchronous events. We’ll be
    exploring one system of technologies called Asynchronous JavaScript and XML, or
    AJAX.


    To read more about the event loop, read the MDN documentation:


    - [MDN Documentation: Event Loop](https://developer.mozilla.org/en-US/docs/Web/JavaScript/EventLoop)


    ### Instructions 1.


