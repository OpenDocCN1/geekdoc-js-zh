    but this isn’t very realistic!


    This time we’ve required in a function, `cookBeanSouffle()` which returns a promise
    that resolves or rejects randomly. When it resolves, the promise resolves with
    a value of ''Bean Souffle'' and, when it rejects, it rejects with a value of ''Dinner
    is ruined!''. If you’re interested, you can see how the function works by looking
    in the `library.js` file.


    Press “Check Work” when you’re ready to move on to the next step.


