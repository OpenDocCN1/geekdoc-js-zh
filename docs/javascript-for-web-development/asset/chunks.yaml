    让我们双检查一下，如果在函数内部使用内置方法变异数组会发生什么。


    ![](img/image04699.jpeg)在命名语句下方，定义另一个接收参数 `newArr` 的函数。在函数体内部对 `newArr` 调用 `.pop()`。


    检查点 3 通过

    卡住了？获取提示


    ### 3.


    使用参数 `concept` 调用 `removeElement()`。


    检查点 4 通过

