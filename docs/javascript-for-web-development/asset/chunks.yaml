    ## 继承 III


    我们将 `Cat` 和 `Dog`类的共享属性和方法抽象到一个名为 `Animal` 的父类（见下文）。


    ![](img/image04887.jpeg)


    现在我们已经在父类 `Animal` 中有了这些共享属性和方法，我们可以将它们扩展到子类 `Cat`。


    ![](img/image04888.jpeg)

    ![](img/image04889.jpeg)在上面的示例中，我们创建了一个名为 `Animal` 的新类。让我们特别关注我们的新关键字：`extends`
    和 `super`。


    这扩展


    - `extends` 关键字使得动物类的方法在猫类内部可用。

    - 当你创建一个新的 `Cat` 对象时调用的 `constructor` 接受两个参数：`name` 和 `usesLitter`。

    - `super` 关键字调用父类的构造函数。在这种情况下，`super(name)` 将 `Cat` 类的 `name` 参数传递给 `Animal` 类的
    `constructor`。当 `Animal` 构造函数运行时，它会为新的 `Cat` 实例设置 `this._name = name;`。


