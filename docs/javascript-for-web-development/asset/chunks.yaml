  trans: "\n\n现在让我们用 JavaScript 编写这个列表，将其作为一个数组：\n\n![](img/image04674.jpeg)\n\n数组是\
    \ JavaScript 创建列表的方式。数组可以存储任何数据类型（包括字符串、数字和布尔值）。与列表一样，数组是有序的，这意味着每个项目都有一个数字编号的位置。\n\
    \n这里是我们将要涵盖的概念数组：\n\n![](img/image04675.jpeg)\n\n在本节结束时，你将又掌握了一项可以帮助你管理数据块的工具！\n\
    \n![](img/image04676.jpeg)\n\n运行代码查看控制台输出了什么内容。\n\n![](img/image04677.jpeg)\n\n\
    ## 创建数组\n\n创建数组的一种方法是使用数组字面量（array literal）。数组字面量通过将项目包裹在方括号 `[]` 中来创建一个数组。记得上一个练习，数组可以存储任何数据类型——我们可以拥有一个包含所有相同数据类型的数组，也可以拥有一个包含不同数据类型的数组。\n\
    \n让我们仔细观察数组示例中的语法：\n\n*   数组由方括号 `[]` 及其内部的内容表示。\n*   数组内部的每个内容项被称为“元素”（element）。\n\
    *   数组内部有三个不同的元素。\n*   数组中的每个元素都是不同的数据类型。\n\n我们还可以将数组保存到变量中。你可能注意到我们在上一个练习中这样做了：\n\
    \n![](img/image04678.jpeg)\n\n让我们通过创建自己的数组来练习一下。\n\n### 指南 1\n1. 使用 `const` 声明一个名为\
    \ `hobbies` 的变量，并将其设置为一个包含三个字符串的数组。\n   * 检查点 2 已通过\n   * 住了住了？获取提示*\n2. 使用 `console.log()`\
    \ 将 `hobbies` 打印到控制台。\n\n![](img/image04679.jpeg)\n\n## 访问元素\n\n数组中的每个元素都有一个数字编号的位置，称为“索引”（index）。我们可以使用索引来访问单个项目，这类似于根据项目的位置引用列表中的项目。\n\
    \n![](img/image04568.jpeg) JavaScript 中的数组是零索引的，这意味着位置从 `0` 开始计数，而不是从 `1`。因此，数组中的第一个项目位于位置\
    \ `0`。让我们看看如何访问数组中的元素：\n\n在上面的代码段中：\n\n*   `cities` 是一个拥有三个元素的数组。\n*   我们正在使用括号表示法\
    \ `[]`，在数组名后加上索引来访问元素。\n*   `cities[0]` 将访问数组 `cities` 中索引为 `0` 的元素。你可以将 `cities[0]`\
    \ 视为访问存储字符串 'New York' 的内存空间。\n\n你也可以使用括号表示法和索引访问字符串中的单个字符。例如，你可以写道：\n\n![](img/image04680.jpeg)\n\
    \n控制台将显示 `W`，因为它是索引为 `6` 的字符。\n\n### 指南 1\n1. 数组中的单个元素也可以存储到变量中。\n   创建一个名为 `listItem`\
    \ 的变量，并使用方括号表示法（[]`）将其设置为 `famousSayings` 数组中的第一个项目。\n   然后使用 `console.log()`\
    \ 将 `listItem` 变量打印到控制台。\n   * 检查点 2 已通过\n   * 住了住了？获取提示*\n2. 现在，使用括号表示法访问 `famousSayings`\
    \ 数组中的第三个元素，并使用 `console.log()` 打印。\n   在打印元素之前，不要将其保存到新变量中。\n\n![](img/image04681.jpeg)\n\
    ![](img/image04682.jpeg)\n\n## 更新元素\n\n在上一个练习中，你学习了如何使用索引访问数组或字符串内部的元素。一旦访问了数组中的元素，你更新它的值。\n\
    \n![](img/image04683.jpeg) 在上面的示例中，`seasons` 数组包含了四个季节的名字。\n\n然而，我们决定更倾向于说 'Autumn'而不是\
    \ 'Fall'。\n\n`seasons[3] = 'Autumn';` 这一行告诉程序将 `seasons` 数组中索引为 `3` 的项目更改为 'Autumn'，而不是原来的内容。\n\
    \n### 指南 1\n1. 将 `groceryList` 数组的第二个元素更改为 'avocados'。\n\n![](img/image04684.jpeg)\n\
    \n## 使用 let 和 const 的数组\n\n你可能记得可以使用 `let` 和 `const` 关键字声明变量。使用 `let` 声明的变量可以重新赋值。\n\
    \n使用 `const` 关键字声明的变量不能重新赋值。然而，用 `const` 声明的数组中的元素仍然是可变的（mutable）。这意味着我们可以更改 `const`\
    \ 数组的内容，但不能重新赋值一个新数组或不同的值。\n\n下面的指令将更清楚地说明这一概念。在完成步骤时，请注意 `condiments` 数组和 `utensils`\
    \ 数组之间的相似之处和之处。\n\n### 指南 1\n1. 在两个现有数组下方，将 `condiments` 中索引 `0` 的元素重新赋值为 'Mayo'。\n\
    \   将更新后的数组 `condiments` 打印到控制台。\n   * 检查点 2 已通过\n   * 住了住了？获取提示*\n2. 在第一步代码下方，将\
    \ `condiments` 重新赋值为包含单个字符串 `['Mayo']` 的新数组。\n   将结果打印到控制台。\n   注意，你可以重新赋值数组中的元素，并为使用\
    \ `let` 关键字声明的变量重新赋值整个新数组。\n   * 检查点 3 已通过\n   * 住了住了？获取提示*\n3. 在第二步代码下方，将 `utensils`\
    \ 数组的最后一个项目重新赋值为 'Spoon'。\n   将更新后的数组打印到控制台。\n\n![](img/image04685.jpeg)\n![](img/image04686.jpeg)\n\
    \n## .length 属性\n\n数组的内置属性之一是数组中的 `items`。我们访问字符串。查看下面的示例：\n\n并且它返回 `length` 属性的数量，就像我们所做的那样\n\
    \n![](img/image04687.jpeg) 在上面的示例中，我们使用以下步骤将内容打印到控制台：\n\n*   ![](img/image04688.jpeg)![](img/image04689.jpeg)\
    \ 我们使用点符号表示法（dot notation），在数组后连接点和属性名，来访问数组中的字符串。\n*   然后我们将 `n` 数组的 `length`\
    \ 属性打印到控制台。\n*   由于 `console.log()`有两个元素，所以会打印 `2`。\n\n当我们想知道数组中有多少元素时，我们访问 `.length`\
    \ 属性。\n\n### 指南 1\n1. 找到 `objectives` 数组的长度并将其打印到控制台。\n\n![](img/image04690.jpeg)\n\
    \n## .push() 方法\n\n让我们学习一些让操作数组变得更简单的 JavaScript 内置方法。这些方法专门为数组调用，以使常见任务（如添加和删除元素）变得简单。\n\
    \n`.push()` 方法允许我们向数组末尾添加项目。这里是它的使用方法示例：\n\n![](img/image04691.jpeg)\n\n那么，`.push()`\
    \ 是如何工作的？\n\n*   我们通过点符号表示法访问 `push` 方法，通过点将 `push` 连接到 `itemTracker`。\n*   然后我们像调用函数一样调用它。这是因为\
    \ `.push()` 是一个函数，JavaScript 允许我们直接在数组上使用。\n*   `.push()` 可以接受单个参数或多个多个参数。在这种情况下，我们向\
    \ `itemTracker` 添加了两个元素：'item 3' 和 'item 4'。\n*   注意 `.push()` 改变（或修改了）`itemTracker`。\n\
    \n如果你正在寻找一种通过添加元素来改变数组的方法，那么 `.push()` 就是你需要的方法！\n\n### 指南\n1. 使用 `.push()` 向\
    \ `![](img/image04692.jpeg)数组 添加两个元素。\n2. 使用 `console.log` 打印你的 `chores` 数组以确保你的项目已添加。\n\
    \n![](img/image04693.jpeg)\n\n## .pop() 方法\n\n另一个数组方法 `.pop()` 会移除数组的最后一个项目。\n\
    \n![](img/image04694.jpeg)\n\n*   在上面的示例中，对 `newItemTracker` 数组调用 `.pop()` 从末尾移除了\
    \ `item 2`。\n\n"
- fmt: '

    * `.pop()` does not take any arguments, it simply removes the last element of
    `newItemTracker`.

    * `.pop()` returns the value of the last element. In the example, we store the
    returned value in a variable `removed` to be used for later.

    * `.pop()` is a method that mutates the initial array.


    When you need to mutate an array by removing the last element, use `.pop()`.


    ### Instructions 1.


    ![](Images/image04695.jpeg)Use the method to remove the last element from `chores`.


    Checkpoint 2 Passed

    Stuck? Get a hint


    ### 2.


    In a line after you called `chores.pop()`, log `chores` to the console to make
    sure it worked.


    ![](Images/image04696.jpeg)


    ## More Array Methods


    There are many more array methods than just `.push()` and `.pop()`. You can read
    about all of the array methods that exist on the [Mozilla Developer](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    [Network (MDN) array documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array).


    `.pop()` and `.push()` mutate the array on which they’re called. However, there
    are times that we don’t want to mutate the original array and we can use non-mutating
    array methods. Be sure to check MDN to understand the behavior of the method you
    are using.


    Some arrays methods that are available to JavaScript developers include: `.join()`,
    `.slice()`, `.splice()`, `.shift()`, `.unshift()`, and `.concat()` amongst many
    others. Using these built-in methods make it easier to do some common tasks when
    working with arrays.


    Below, we will explore some methods that we have not learned yet. We will use
    these methods to edit a grocery list. As you complete the steps, you can consult
    the MDN documentation to learn what each method does!


