    # 处理独立的 Promise


    记住 `await` 会暂停我们 `async` 函数的执行。这允许我们方便地编写同步风格的代码来处理相互依赖的 promise。但如果我们的 `async`
    函数包含多个在执行时并不依赖彼此结果的 promise 呢？


    ![](img/image05027.jpeg)


    在 `waiting()` 函数中，我们暂停函数，直到第一个 promise 解析，然后我们构建第二个 promise。一旦它解析，我们将两个解析值都打印到控制台。


    在我们的 `concurrent()` 函数中，两个 promise 都是在不使用 `await` 的情况下构建的。我们 `await` 它们的每一个解析，并将它们打印到控制台。


    通过我们的 `concurrent()` 函数，两个 promise 的异步操作可以同时运行。如果可能，我们希望尽快开始每个异步操作！在我们的 `async`
    函数内部，我们仍然应该利用并发性，即同时执行异步操作的能力。


    注意：如果我们有多个想要完全并行执行的真正独立的 promise，我们必须使用单独的 `.then()` 函数，并避免使用 `await` 暂停我们的执行。


