    注意，当我们使用 `console.log()` 时，计算机会计算括号内的表达式并将结果打印到控制台上。如果我们想打印字符 `3 + 4`，我们需要将它们括在引号中并作为字符串打印。


    ![](img/image04570.jpeg)


    取余运算符（有时称为模运算）返回右侧数字在尽可能整除左侧数字后剩余的数字。例如：`11 % 3` 等于 `2`，因为 `3` 可以完全整除 `11` 三次，留下
    `2` 作为余数。


    ### 指令


    1.

    在 `console.log()` 中，给你的年龄加上 `3.5`。

    这是当我们开始派遣人类去火星居住时，你将拥有的年龄。

    检查点 2 已通过

    卡住了？获取提示


    2.

    在新的一行中写另一个 `console.log()`。在括号内，获取当前年份并减去 `1969`。

    答案是自 `1969` 年登月登陆以来经过的年数。

    检查点 3 已通过

    卡住了？获取提示


    3.

    创建另一个 `console.log()`。在括号内用 `65` 除以 `240`。

    检查点 4 已通过

    卡住了？获取提示


    4.

    创建最后一个 `console.log()`。在括号内，将 `0.2708` 乘以 `100`。

    这是太阳中由氦元素组成的百分比。假设我们可以站在太阳上，我们的声音听起来都会像花栗鼠！

    ![](img/image04571.jpeg)


    ### 字符串拼接


    ![](img/image04568.jpeg)运算符不仅用于数字！当 `+` 运算符用于两个字符串时，它会将右侧字符串附加到左侧字符串之后：


    ![](img/image04572.jpeg)


    这种将一个字符串附加另一个字符串的过程被称为拼接。


    注意在第三个例子中，我们必须确保在第一个字符串的末尾包含一个空格。计算机会精确地连接字符串，因此我们需要确保在两个字符串之间包含我们想要的空格。


    ![](img/image04573.jpeg)


    就像普通数学一样，我们可以组合或链联我们的操作以获得最终结果：


    ![](img/image04574.jpeg)


    1.

    ![](img/image04575.jpeg)在字符串语句中，将它们与 `''World''` 拼接在一起。

    注意：你应该精确地拼接这两个字符串（不要引入任何额外的字符）。

    检查点 2 已通过

    卡住了？获取提示


    2.

    我们上次漏掉了空格。创建第二个 `console.log()` 语句，在其中拼接字符串 `''Hello''` 和 `''World''`，但这次要确保在两个单词之间也包含一个空格（`''
    ''`）。


    ![](img/image04576.jpeg)


    ### 属性


    当你向 JavaScript 程序引入新的新数据时，浏览器将其保存为该数据类型的实例。每个字符串实例都有一个名为 `length` 的属性，用于存储该字符串中的字符数量。


    你可以通过在字符串后加上句号和属性名称来获取属性信息：


    ```javascript

    console.log(''Hello''.length);  // 打印 5

    ```


    `.` 是另一个运算符！我们称之为点运算符。


    在上面的示例中，保存到 `length` 属性的值是从字符串实例 `''Hello''` 中获取的。程序向控制台打印 `5`，因为 `Hello` 包含五个字符。


    ### 指令


    1.

    使用 `.length` 属性向控制台记录以下字符串的字符数量：

    `''Teaching the world how to code''`


    ```javascript

    console.log(''Teaching the world how to code''.length);

    ```

    检查点 2 已通过

    卡住了？获取提示


    2.

    在 `app.js` 的第二个 `console.log()` 语句中，我们有一个字符串 `'' Remove whitespace ''`，它在单词 `''Remove
    whitespace''` 前都有空格。


    如果我们浏览 [JavaScript 字符串文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/prototype)，发现几个内置字符串方法，每个方法实现不同的目标。对我们来说理想的方法是
    `.trim()`。


    使用该方法移除第二个 `console.log()` 语句中字符串开头和结尾的空格。


    ![](img/image04578.jpeg)


    ### 变量


    在编程中，变量是值的容器。你可以将变量视为存储在计算机内存中的信息小容器。存储在变量中的信息（例如用户名、账户号码甚至个性化问候语）可以在内存中找到。


    变量还提供了一种使用描述性名称标记数据的方法，以便读者和我们自己能更清楚地理解程序。


    简而言之，变量在内存中标记并存储数据。你可以对变量的操作只有：


    1. 创建一个具有描述性名称的变量。

    2. 存储或更新存储在变量中的信息。

    3. 引用或“获取”存储在变量中的信息。


    重要的是变量不是值；它们包含值并用名称表示它们。观察带有彩色框的图表。每个框代表变量；值由内容表示，名称由标签表示。


    在本节中，我们将介绍如何使用 `var`、`let` 和 `const` 关键字来创建变量。


    ![](img/image04579.jpeg)


    ### 创建变量：var


    2015 年 JavaScript ES6 版本引入了许多变化。其中最大的变化之一是两个新关键字 `let` 和 `const`，用于创建或声明变量。在 ES6
    之前，程序员只能使用 `var` 关键字来声明变量。


    ![](img/image04580.jpeg)


    让我们考虑上面的例子：


    1. `var` 是 variable 的缩写，是一个 JavaScript 关键字，用于创建或声明新变量。

    2. `myName` 是变量名。这种大小写结合的方式是 JavaScript 中的一种标准约定，称为驼峰命名法（camel casing）。在驼峰命名法中，将单词组合为一个，第一个单词小写，随后的每个单词的首字母都要大写（例如
    `camelCaseEverything`）。

    3. `=` 是赋值运算符。它将值 `''Arya''` 赋值给变量 `myName`。

    4. `''Arya''` 是赋值 (=) 给变量 `myName` 的值。你也可以说变量 `myName` 使用值 `''Arya''` 初始化了。

    5. 变量声明完毕后，通过引用变量名 `console.log(myName)` 将字符串值 `''Arya''` 打印到控制台。


