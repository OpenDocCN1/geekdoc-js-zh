    假设我们想在 JavaScript 中创建一个对象来代表怪兽。有许多不同类型的怪物，我们可以逐个创建每个怪物，但也可以使用工厂函数（factory function）来让工作变得更轻松。为了实现这个创建多个怪物对象的“邪恶计划”，我们可以使用一个带有参数的工厂函数：


    ![](img/image04837.jpeg)


    ![](img/image04838.jpeg)

    在上面的函数中，它有四个参数并返回一个包含以下属性的对象：`name`、`age`、`energySource` 和 `scare()`。要创建一个代表特定怪物（如幽灵）的对象，我们可以传入必要的参数调用
    `monsterFactory`并将返回值赋值给变量：


    ![](img/image04839.jpeg)


    现在，我们通过传入必要的参数调用 `monsterFactory()` 得到了一个 `ghost` 对象。有了了 `monsterFactory`，我们就不需要在每次需要新怪物时都创建一个对象字面量了。相反，我们可以传入必要的参数调用
    `monsterFactory` 函数，让它通过制造怪物来接管世界！


    ### 指南 1.

    不要像我们之前那样逐个制作机器人，让我们写一个工厂函数来随心所欲地制作机器人吧！


    创建一个名为 `robotFactory` 的工厂函数，包含两个参数 `model` 和 `mobile`。让函数返回一个对象。在对象中添加一个名为 `model`
    的键，值为 `model` 参数的值。再添加一个名为 `mobile` 的属性，值为 `mobile` 参数的值。


    然后添加一个名为 `beep` 的方法，且不需要参数，该方法将在控制台打印 ''Beep Boop''。


    **检查点 2 通过**


    *卡住了？获取提示*


    ### 2.

    通过声明一个名为 ![](img/image04840.jpeg)`tinCan` 的变量来使用你的工厂函数。


    给 `tinCan` 赋值调用 `robotFactory` 的结果，第一个参数为 ''P-500''，第二个参数为 `true`。


    **检查点 3 通过**


    ### 3.

    现在让我们检查 `tinCan` 能做什么！在 `tinCan` 上调用 `.beep()`。


    你应该能看到控制台打印出 ''Beep Boop''，这意味着工厂函数生成了一个机器人对象！尝试操作 `tinCan` 来检查其他属性！


    ![](img/image04841.jpeg)


    ## 属性值简写

    ES6 引入了一些将属性赋值给变量的新快捷方法，被称为解构（destructuring）。


    在上一个练习中，我们创建了一个帮助我们创建对象的工厂函数。我们必须为每个属性分配一个键和一个值，即使键的名称与分配给它的参数名称相同。为了提醒自己，这里是工厂函数的简化版本：


    ![](img/image04842.jpeg)


    想象一下如果我们必须包含更多属性，那个过程将很快变得繁琐！但我们可以使用一种名为“属性值简写”（property value shorthand）的解构技术来减少击字次数。下面的示例效果与上面的示例完全相同：


    ![](img/image04843.jpeg)


    注意，我们不需要在属性赋值时重复编写代码了！


    ### 指南 1.

    使用属性值简写重构 `main.js` 中的工厂函数。


    （注：提供的文本包含重复的指令部分；为了清晰起见，已对其进行了合并。）


    ![](img/image04844.jpeg)

    ![](img/image04845.jpeg)

    ![](img/image04846.jpeg)

    ![](img/image04847.jpeg)

    ![](img/image04848.jpeg)

