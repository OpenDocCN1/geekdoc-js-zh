    的失败处理程序将带有该拒绝原因调用。


    让我们练习编写 `.catch()` 函数。


    ### 指令


    #### 1

    我们将重构上一个练习的功能，但这次我们将使用 `.catch()`！首先使用 `order` 运行 `checkInventory()` 函数。请记住，该函数将返回一个
    promise。


