    \  browsers recognize.\n\nThis has become a widespread concern for web developers\
    \ since Ecma  International, the organization responsible for standardizing JavaScript,\
    \  released a new version of it in 2015, called ECMAScript2015, commonly  referred\
    \ to as ES6\\. Note, the 6 refers to the version of JavaScript and is not  related\
    \  to the year it was released (the  previous version was ES5).\n\nUpon release,\
    \ web developers quickly adopted the new ES6 syntax, as it  improved readability\
    \ and efficiency. However, ES6 was not supported by  most  web  browsers,  so\
    \  developers  ran  into  browser  compatibility  issues.\n\nIn this lesson, you\
    \ will learn about two important tools for addressing  browser  compatibility\
