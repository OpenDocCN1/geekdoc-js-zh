    ## caniuse.com I


    自从 Ecma 发布 ECMAScript2015 (ES6)以来，软件公司逐渐增加了对 ES6 特性和语法的支持。虽然大多数新浏览器版本支持大部分 ES6
    库，但仍然存在一些兼容性问题：


    * 部分用户尚未更新到支持 ES6 的最新网络浏览器版本。

    * 少数 ES6 特性（如模块）仍未被大多数浏览器支持。


    由于公司逐渐添加对 ES6 特性的支持，因此了解按特性查询浏览器支持情况对你来说很重要。[caniuse.com](http://caniuse.com/)
    网站是查找浏览器兼容性信息的最佳资源。


    在 caniuse 中，你可以输入 ES6 特性（如 `let`），查看识别它的浏览器百分比。你还可以看到每个主流网络浏览器（Chrome、Safari、Edge
    等）何时添加了该关键字的支持。


    ## caniuse.com II


    现在，轮你对 [caniuse.com](http://caniuse.com/) 进行练习了。在新标签页中打开 `caniuse.com` 并完成以下任务。


    ### 任务 1


