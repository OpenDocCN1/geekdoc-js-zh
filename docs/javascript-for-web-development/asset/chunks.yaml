  raw: "![](Images/image04665.jpeg)function, use  console.log()  to  log the  value\n\
    \nof  callMyNightSky()  to  the  console.\n\nYou’ll notice that the function block\
    \ for  callMyNightSky()  is able to  access the  global variables freely since\
    \ the variables are available to all lines of code in  the file.\n\n![](Images/image04666.jpeg)\n\
    \nBlock  Scope\n\nThe next context we’ll cover is block scope. When a variable\
    \ is defined inside  a block, it is only accessible to the code within the curly\
    \ braces  {}. We say  that variable has block scope because it is only accessible\
    \ to the lines of  code  within that block.\n\nVariables that are declared with\
    \ block scope are known as local  variables because they are only available to\
    \ the code that is part of the  same block.\n\nBlock  scope works like  this:\n\
    \n![](Images/image04667.jpeg)\n\nYou’ll  notice:\n\n*   We  define  a  function\
    \  logSkyColor().\n\n*   Within  the  function, the  color  variable is only available\
    \  within the curly  braces  of the function.\n\n*   If we try to log the same\
    \ variable outside the function, throws  a  ReferenceError.\n\nInstructions  1.\n\
    \nIn  main.js,  define  a  function  logVisibleLightWaves().\n\n Checkpoint 2\
    \ Passed\n\nStuck?  Get a hint\n\n2.\n\nWithin the logVisibleLightWaves()  function,\
    \ using  const, create a  variable lightWaves  and set it equal to  'Moonlight'.\n\
    \n Checkpoint 3 Passed\n\n3.\n\nWithin the logVisibleLightWaves()  function, beneath\
    \ the  lightWaves  variable,  add a  console.log()  statement that  will  log\
    \  the value  of  the  lightWaves  variable  when  the function runs.\n\n Checkpoint\
    \ 4 Passed\n\nStuck?  Get a hint\n\n4.\n\nCall  the  logVisibleLightWaves()  function\
    \ from outside the function.\n\n Checkpoint 5 Passed\n\nStuck?  Get a hint\n\n\
    5.\n\nBeneath  the  function call, log  the value of  lightWaves  to  the console\
    \ from  outside  the function.\n\nYou’ll  notice that it  logs a  ReferenceError\
    \  since the  variable is tied to  the  block  scope of the function!\n\n![](Images/image04668.jpeg)\n\
    \nScope  Pollution\n\nIt may seem like a great idea to always make your variables\
    \ accessible, but  having  too many  global variables can  cause problems in \
    \ a program.\n\nWhen you declare global variables, they go to the global namespace.\
    \ The  global namespace allows the variables to be accessible from anywhere in\
    \  the program. These variables remain there until the program finishes which\
    \  means  our global namespace can fill up really  quickly.\n\nScope pollution\
    \ is when we have too many global variables that exist in the  global  namespace,\
    \  or  when we reuse  variables across different  scopes.\n\nScope pollution makes\
    \ it difficult to keep track of our different variables  and sets us up for potential\
    \ accidents. For example, globally scoped  variables can collide with other variables\
    \ that are more locally scoped,  causing  unexpected behavior  in our code.\n\n\
    Let’s look at an example of scope pollution in practice so we know how to  avoid\
    \ it:\n\n![](Images/image04669.jpeg)\n\nYou’ll  notice:\n\n*   We  have  a variable\
    \  num.\n\n*   Inside the function body of  logNum(), we want to declare a new\
    \  variable but forgot to use the  let  keyword.\n\n*   When we call  logNum(),\
    \  num  gets reassigned  to  100.\n\n*   The  reassignment inside  logNum()  affects\
    \  the  global variable  num.\n\n*   Even though the reassignment is allowed and\
    \ we won’t get an error,  if we decided to use  num  later, we’ll unknowingly\
    \ use the new value  of  num.\n\nWhile it’s important to know what global scope\
    \ is, it’s best practice to not  define  variables in  the global scope.\n\nInstructions\n\
    \n1.\n\nLet’s see what happens if we create a variable that overwrites a global\
    \  variable.\n\nInside  the  callMyNightSky()  function,  on the  very  first\
    \ line  of the  function  body, assign the variable  stars  to  'Sirius'  as such:\n\
    \n![](Images/image04670.jpeg)\n\n Checkpoint 2 Passed\n\n2.\n\nOutside  the  function,\
    \ under the current  console.log()  statement,  add  another  console.log()  statement\
    \ to  log  stars  to the  console.\n\nYou’ll notice that the global variable \
    \ stars  was reassigned to  'Sirius'. In  other words, we  changed  the value\
    \ of  the global  stars  variable but it’s  not  easy to read what exactly happened.\
    \ This is bad practice in code  maintainability  and  could  impact our  program\
    \  in ways we  do not intend.\n\n![](Images/image04671.jpeg)\n\nPractice  Good\
    \ Scoping\n\nGiven the challenges with global variables and scope pollution, we\
    \ should  follow best practices for scoping our variables as tightly as possible\
    \ using  block scope.\n\nTightly scoping your variables will greatly improve your\
    \ code in several  ways:\n\n*   It will make your code more legible since the\
    \ blocks will organize  your  code into discrete  sections.\n\n*   It makes your\
    \ code more understandable since it clarifies which  variables are associated\
    \ with different parts of the program rather  than  having to keep track of them\
    \ line after line!\n\n*   It’s  easier to  maintain your code,  since your  code\
    \ will be  modular.\n\n*   It will save memory in your code because it will cease\
    \ to exist after  the block  finishes running.\n\nHere’s another example of how\
    \ to use block scope, as defined within  an  if  block:\n\n![](Images/image04672.jpeg)\n\
    \nHere,  you’ll notice:\n\n*   We  create a  variable  dusk  inside the  logSkyColor()\
    \  function.\n\n*   After  the  if  statement, we  define a new code block  with\
    \ the  {}  braces.  Here we assign a new value to the variable  color  if the\
    \  if  statement is  truthy.\n\n*   Within the  if  block, the  color  variable\
    \ holds the value  'pink', though  outside  the  if  block, in the function body,\
    \ the  color  variable holds the  value  'blue'.\n\n*   While we use block scope,\
    \ we still pollute our namespace by reusing  the same variable name twice. A better\
    \ practice would be to rename  the  variable inside  the block.\n\nBlock scope\
    \ is a powerful tool in JavaScript, since it allows us to define  variables with\
    \ precision, and not pollute the global namespace. If a variable  does  not need\
    \ to exist outside a block— it shouldn’t!\n\nInstructions\n\n1.\n\nInside  the\
    \  function body  of  logVisibleLightWaves(), beneath the  region  variable  and\
    \ before the  provided  console.log()  statement, create an  if  statement that\
    \  checks if the  region  is the  'The  Arctic'.\n\n Checkpoint 2 Passed\n\nStuck?\
    \  Get a hint\n\n2.\n\nInside  the  if  block,  define a new  let  variable  lightWaves\
    \  and set it equal  to  'Northern Lights'.\n\n Checkpoint 3 Passed\n\n3.\n\n\
    Beneath  the  variable in the  if  block, use  console.log()  to log the value\
    \ of the  block variable inside the  if  block.\n\nRun  your  code and  notice\
