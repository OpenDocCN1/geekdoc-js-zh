    ### 什么是条件语句？


    在生活中，我们根据情况做决定。考虑一个像睡觉这样平凡的日常决定——如果我们累了，我们就睡觉；否则，我们就起床开始新的一天。


    这些 if-else 决策可以通过创建条件语句在代码中进行建模。条件语句检查特定的条件，并根据条件执行任务。


    在本节中，我们将探索程序如何通过评估条件来做出决策，并在我们的代码中引入逻辑！


    我们将涵盖以下概念：


    * `if`、`else if` 和 `else` 语句

    * 比较运算符

    * 逻辑运算符

    * 真值（truthy）与假值（falsy）

    * 三元运算符

    * switch 语句


    所以，如果你准备好学习这些概念，请进入下一节——否则，请阅读这些概念，观察图表，并为本节做好准备！


