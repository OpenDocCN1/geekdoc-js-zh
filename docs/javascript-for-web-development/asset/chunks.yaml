    \  the  method  call,  log  the  value  saved  to  the  remainingVacationDays\
    \  property  in  nurseOlynyk.\n\n![](Images/image04895.jpeg)\n\n![](Images/image04896.jpeg)\n\
    \nInheritance  V\n\nIn addition to the inherited features, child classes can contain\
    \ their own  properties,  getters,  setters, and  methods.\n\nBelow,  we  will\
    \  add a  usesLitter  getter.  The syntax for  creating  getters,  setters,  and\
    \ methods is the  same as it is in  any other class.\n\n![](Images/image04897.jpeg)\n\
    \nIn  the  example  above, we  create a  usesLitter  getter in the  Cat  class\
    \ that  returns  the value saved  to  _usesLitter.\n\nCompare the  Cat  class\
    \ above to the one  we  created  without  inheritance:\n\n![](Images/image04898.jpeg)class\
    \  Cat  {\n\nconstructor(name, usesLitter) {  this._name = name;  this._usesLitter\
    \ = usesLitter;  this._behavior  = 0;\n\n}\n\nget  name()  {\n\nreturn  this._name;\n\
    \n}\n\nget  usesLitter()  {\n\nreturn  this._usesLitter;\n\n}\n\nget  behavior()\
    \  {\n\nreturn  this._behavior;\n\n}\n\nincrementBehavior() {  this._behavior++;\n\
    \n}\n\n}\n\nWe  decreased the number of lines required  to create  the  Cat  class\
    \ by  about  half. Yes, it did require an extra class (Animal), making the reduction\
    \ in the  size of our Cat  class seem moot. However, the benefits (time saved,\
    \  readability, efficiency) of inheritance grow as the number and size of your\
    \  subclasses  increase.\n\nOne benefit is that when you need to change a method\
    \ or property that  multiple classes share, you can change the parent class, instead\
    \ of each  subclass.\n\nBefore we move past inheritance, take a moment to see\
    \ how we would  create  an additional subclass, called  Dog.\n\n![](Images/image04899.jpeg)\n\
    \nThis Dog  class has access to the same properties, getters, setters, and  methods\
    \  as  the  Dog  class  we made without inheritance,  and is a quarter  the  size.\n\
    \nNow that we’ve abstracted animal daycare features, it’s easy to see how you\
    \  can  extend  Animal  to  support other  classes,  like  Rabbit,  Bird  or even\
    \  Snake.\n\nInstructions  1.\n\nUse the properties and methods below to help\
    \ you complete the tasks that  follow.\n\nNurse\n\n• Properties:  _name,  _remainingVacationDays\
    \  (set  to  20  inside  the  constructor()),  _certifications\n\n• Methods: \
    \ .takeVacationDays(),  .addCertification()\n\nUnder the Nurse  constructor(),\
    \ add a getter that returns the value saved to  the  Nurse  instance’s  _certifications.\n\
    \n Checkpoint 2 Passed\n\n2.\n\nAdd  a method called  addCertification  under\
    \ the  certifications  getter.\n\nThe method should accept one input (newCertification).\
    \ Inside the method,  use  the [push](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/push?v=example)\
    \ method to add the  newCertification  value to the\n\nnurse’s  certifications\
    \  array.\n\n Checkpoint 3 Passed\n\nStuck?  Get a hint\n\n3.\n\nAt  the bottom\
    \  of  main.js call  the  .addCertification()  method  on  nurseOlynyk  with a\
    \  parameter of  'Genetics'.\n\n Checkpoint 4 Passed\n\n4.\n\nLog the  value saved\
    \  to the  certifications  property of  nurseOlynyk.\n\n![](Images/image04900.jpeg)class\
    \ HospitalEmployee {  constructor(name)  {\n\nthis._name = name;  this._remainingVacationDays\
    \  =  20;\n\n}\n\nget  name()  {\n\nreturn  this._name;\n\n}\n\nget  remainingVacationDays()\
    \  {\n\nreturn  this._remainingVacationDays;\n\n}\n\ntakeVacationDays(daysOff)\
    \ {  this._remainingVacationDays  -=  daysOff;\n\n}\n\n}\n\nclass Nurse extends\
    \ HospitalEmployee {  constructor(name,  certifications)  {\n\nsuper(name);\n\n\
    this._certifications  =  certifications;\n\n}\n\nget  certifications()  {\n\n\
    return  this._certifications;\n\n}\n\naddCertification(newCertification) {  this._certifications.push(newCertification);\n\
    \n}\n\n}\n\nconst nurseOlynyk = new Nurse('Olynyk', ['Trauma','Pediatrics']);\
    \  nurseOlynyk.takeVacationDays(5);  console.log(nurseOlynyk.remainingVacationDays);\
    \  nurseOlynyk.addCertification('Genetics');\n\nconsole.log(nurseOlynyk.certifications);"
