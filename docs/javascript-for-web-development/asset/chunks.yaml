    ![](Images/cover05089.jpeg)


    # What is JavaScript?


    Last year, millions of learners from our community started with JavaScript. Why?
    JavaScript is primarily known as the language of most modern web browsers, and
    its early quirks gave it a bit of a bad reputation. However, the language has
    continued to evolve and improve. JavaScript is a powerful, flexible, and fast
    programming language now being used for increasingly complex web development and
    beyond!


    Since JavaScript remains at the core of web development, it’s often the first
    language learned by self-taught coders eager to learn and build. We’re excited
    for what you’ll be able to create with the JavaScript foundation you gain here.
    JavaScript powers the dynamic behavior on most websites, including this one.


    In this lesson, you will learn introductory coding concepts including data types
    and built-in objects—essential knowledge for all aspiring developers. Make sure
    to take notes and pace yourself. This foundation will set you up for understanding
    the more complex concepts you’ll encounter later.


    ![](Images/image04554.jpeg)


    ## Console


    The console is a panel that displays important messages, like errors, for developers.
    Much of the work the computer does with our code is invisible to us by default.
    If we want to see things appear on our screen, we can print, or log, to our console
    directly.


    In JavaScript, the `console` keyword refers to an object, a collection of data
    and actions, that we can use in our code. Keywords are words that are built into
    the JavaScript language, so the computer will recognize them and treats them specially.


    One action, or method, that is built into the `console` object is the `.log()`
    method. When we write `console.log()` what we put inside the parentheses will
    get printed, or logged, to the console.


    It’s going to be very useful for us to print values to the console, so we can
    see the work that we’re doing.


    ```javascript

    console.log(5);

    ```

    This example logs 5 to the console. The semicolon denotes the end of the line,
    or statement. Although in JavaScript your code will usually run as intended without
    a semicolon, we recommend learning the habit of ending each statement with a semicolon
    so you never leave one out in the few instances when they are required.


    You’ll see later on that we can use `console.log()` to print different kinds of
    data.


    ### Instructions 1.

    1. Use the `console.log` code in the editor to log your age to the console.

    2. Run your code when you are ready to see the result.


    Checkpoint 2 Passed

    Stuck? Get a hint


    ### Instructions 2.

    1. On the next line, write another `console.log` to print out a different number
    representing the number of weeks you’ve been programming.


    ![](Images/image04555.jpeg)


    ## Comments


    Programming is often highly collaborative. In addition, our own code can quickly
    become difficult to understand when we return to it— sometimes only an hour later!
    For these reasons, it’s often useful to leave notes in our code for other developers
    or ourselves.


    As we write JavaScript, we can write comments in our code that the computer will
    ignore as our program runs. These comments exist just for human readers. Comments
    can explain what the code is doing, leave instructions for developers using the
    code, or add any other useful annotations.


    There are two types of code comments in JavaScript:


    1. A single line comment will comment out a single line and is denoted with two
    forward slashes `//` preceding it.


    ![](Images/image04556.jpeg)


    You can also use a single line comment to comment after a line of code:


    ```javascript

    console.log(5); // Prints 5

    ```


    2. A multi-line comment will comment out multiple lines and is denoted with `/*`
    to begin the comment, and `*/` to end the comment.


    ![](Images/image04557.jpeg)


    You can also use this syntax to comment something out in the middle of a line
    of code:


    ```javascript

    console.log(/*IGNORED!*/ 5); // Still just prints 5

    ```


    ### Instructions 1.

    1. Let’s practice adding some code comments.

    2. To the right, we’ve provided you with the beginning of the book Catch-22 by
    Joseph Heller.

    3. On line 1, write a single line comment that says Opening line.


    ![](Images/image04558.jpeg)


    ### Instructions 2.

    1. Single line comments are great for adding context to your code. Multi-line
    comments are often best suited to prevent a block of code from running. However,
    both types of comments can be used for either purpose.

    2. Use a multi-line comment so that the bottom 6 `console.log()` statements are
    all commented out.


    ![](Images/image04559.jpeg)

    ![](Images/image04560.jpeg)


    ## Data Types


    Data types are the classifications we give to the different kinds of data that
    we use in programming. In JavaScript, there are seven fundamental data types:


    * **Number**: Any number, including numbers with decimals: 4, 8, 151, 23.42.

    * **String**: Any grouping of characters on your keyboard (letters, numbers, spaces,
    symbols, etc.) surrounded by single quotes: ''...'' or double quotes "..." . Though
    we prefer single quotes. Some people like to think of string as a fancy word for
    text.

    * **Boolean**: This data type only has two possible values—either `true` or `false`
    (without quotes). It’s helpful to think of booleans as on and off switches or
    as the answers to a “yes” or “no” question.

    * **Null**: This data type represents the intentional absence of a value, and
    is represented by the keyword `null` (without quotes).

    * **Undefined**: This data type is denoted by the keyword `undefined` (without
    quotes). It also represents the absence of a value though it has a different use
    than `null`.

    * **Symbol**: A newer feature to the language, symbols are unique identifiers,
    useful in more complex coding. No need to worry about these for now.

    * **Object**: Collections of related data.


    The first 6 of those types are considered primitive data types. They are the most
    basic data types in the language. Objects are more complex, and you’ll learn much
    more about them as you progress through JavaScript. At first, seven types may
    not seem like that many, but soon you’ll observe the world opens with possibilities
    once you start leveraging each one. As you learn more about objects, you’ll be
    able to create complex collections of data.


    But before we do that, let’s get comfortable with strings and numbers!


    ![](Images/image04561.jpeg)


    In the example above, we first printed a string. Our `string` isn’\u219t just
    a single word; it includes both capital and lowercase letters, spaces, and punctuation.


    Next, we printed the number 40, notice we did not use quotes.


    ![](Images/image04562.jpeg)

    ![](Images/image04563.jpeg)


    ### Instructions 1.

    1. On line 1, log the string.


    Checkpoint 2 Passed

    Stuck? Get a hint


    ### Instructions 2.

    1. On line 2, log the number.


    Checkpoint 3 Passed

    Stuck? Get a hint


    ### Instructions 3.

    1. On line 3, print


    Checkpoint 4 Passed

    Stuck? Get a hint


    ### Instructions 4.

    1. On line 4, print the number 20.49 to the console.


    ![](Images/image04566.jpeg)


    ## Arithmetic Operators


    Basic arithmetic often comes in handy when programming.


    An operator is a character that performs a task in our code. JavaScript has several
    built-in arithmetic operators, that allow us to perform mathematical calculations
    on numbers. These include the following operators and their corresponding symbols:


    1. Add: `+`

    2. Subtract: `-`

    3. Multiply: `*`

    4. Divide: `/`

    5. Remainder: `%`


    The first four work how you might guess:


    ```javascript

    console.log(3 + 4); // Prints 7

    console.log(5 - 1); // Prints 4

    console.log(4 * 2); // Prints 8

    console.log(9 / 3); // Prints 3

    ```

