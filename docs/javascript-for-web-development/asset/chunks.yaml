- fmt: "\n# 7. Writing GET and POST requests with XHR objects and vanilla JavaScript\n\
    requires constructing the XHR object using `new`, setting the `responseType`,\
    \ creating a function that will handle the response object, and opening and sending\
    \ the request.\n\n# 8. To add a query string to a URL endpoint you can use `?`\
    \ and include a parameter.\n\n# 9. To provide additional parameters, use `&` and\
    \ then include a key-value pair, joined by `=`.\n\n# 10. Determining how to correctly\
    \ write the requests and how to properly implement them requires carefully reading\
    \ the documentation of the API with which you’re working.\n\n![](Images/image05056.jpeg)\n\
    \n![](Images/image05057.jpeg)\n```javascript\nwhile(responseField.firstChild){\n\
    \  responseField.removeChild(responseField.firstChild);\n};\n\ngetSuggestions();\n\
    \n};\n\nsubmit.addEventListener('click', displaySuggestions);\n\n// information\
    \ to reach Rebrandly API\nconst apiKey = '<Your API Key>';\n\nconst rebrandlyUrl\
    \ = 'https://api.rebrandly.com/v1/links';\n\n// element selector\nconst shortenButton\
    \ = document.querySelector('#shorten');\n\n// AJAX functions\nconst shortenUrl\
    \ = () => {\n  const urlToShorten = inputField.value;\n  const data = JSON.stringify({destination:\
    \ urlToShorten});\n  const xhr = new XMLHttpRequest();\n  xhr.responseType = 'json';\n\
    \n  xhr.onreadystatechange = () => {\n    if (xhr.readyState === XMLHttpRequest.DONE)\
    \ {\n      renderByteResponse(xhr.response);\n    }\n  };\n\n  xhr.open('POST',\
    \ rebrandlyUrl);\n  xhr.setRequestHeader('Content-type', 'application/json');\n\
    \  xhr.setRequestHeader('apikey', apiKey);\n  xhr.send(data);\n}\n\n// Clear page\
    \ and call AJAX functions\nconst displayShortUrl = (event) => {\n  event.preventDefault();\n\
    \  while(responseField.firstChild){\n```\n![](Images/image05058.jpeg)\n\n# Introduction\
    \ to Requests with ES6\nIn the previous lesson, we spent a lot of time dealing\
    \ with asynchronous data (remember AJAX/ Asynchronous JavaScript And XML?). Many\
    \ of our web page interactions rely on asynchronous events, so managing these\
    \ events is essential to good web development.\n\nTo make asynchronous event handling\
    \ easier, promises were introduced in JavaScript in ES6:\n\n* [Mozilla Development\
    \ Network: Promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)\n\
    \nA promise is an object that handles asynchronous data. A promise has three states:\n\
    \n* `pending`: when a promise is created or waiting for data.\n* `fulfilled`:\
    \ the asynchronous operation was handled successfully.\n* `rejected`: the asynchronous\
    \ operation was unsuccessful.\n\nThe great thing about promises is that once a\
    \ promise is fulfilled or rejected, you can chain an additional method to the\
    \ original promise.\n\n![](Images/image05059.jpeg)\nIn this lesson, we will explain\
    \ how to use requests. Then, we will simplify requests using `async/await`, which\
    \ uses promises to handle.\n\nWe’ll use the Datamuse API for GET requests and\
    \ Rebrandly URL Shortener API for POST requests.\n\n## fetch() GET Requests I\n\
    The first type of requests we’re going to tackle are GET requests using `fetch()`.\n\
    \n* [MDN: Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API).\
    \ The `fetch()` function:\n\n* Creates a request object that contains relevant\
    \ information that an API needs.\n* Sends that request object to the API endpoint\
    \ provided.\n* Returns a promise that ultimately resolves to a response object,\
    \ which contains the status of the promise with information the API sent back.\n\
    \nIn the next exercise we’ll go over the boilerplate code for using `fetch()`\
    \ and walk through what each step does!\n\n![](Images/image05060.jpeg)\n\n## fetch()\
    \ GET Requests II\nWe are going to reconstruct the boilerplate code necessary\
    \ to create a GET request using the `fetch()` function step-by-step.\n\nFeel free\
    \ to refer to the `fetch()` GET diagram at any point while completing this exercise:\n\
    \n* [fetch() GET diagram](https://content.codecademy.com/courses/intermediate-javascript-requests/diagrams/fetch%20GET%20diagram.svg)\n\
    \n### Instructions\n1. First, call the `fetch()` function and pass it this URL\
    \ as a string:\n`https://api-to-call.com/endpoint`\n\nThis first argument determines\
    \ the endpoint of the request.\n\n**Checkpoint 2 Passed**\n*Stuck? Get a hint*\n\
    \n2. Chain a `.then()` method to the end of the `fetch()` function and pass it\
    \ the success callback arrow function as its first argument. The success callback\
    \ function takes one parameter, `response`.\n\n`.then()` will fire only after\
    \ the promise status of `fetch()` has been resolved.\n\n**Checkpoint 3 Passed**\n\
    *Stuck? Get a hint*\n\n3. Inside of the `response` callback function, check the\
    \ `ok` property of `response` inside of a conditional statement. In the code block\
    \ of the conditional statement, return `response.json()`.\n\nThe reason we’re\
    \ testing the `ok` property of the response object is that it will be a Boolean\
    \ value. If there were no errors `response.ok` will be `true` and then your code\
    \ will return `response.json()`.\n\n**Checkpoint 4 Passed**\n*Stuck? Get a hint*\n\
    \n4. Below the curly braces of the conditional statement, create a new error with\
    \ this code:\n`throw new Error('Request failed!');`\n\nYour code will throw this\
    \ error when `response.ok` is falsy.\n\n**Checkpoint 5 Passed**\n*Stuck? Get a\
    \ hint*\n\n5. Add a second argument to `.then()`, it will be an arrow function\
