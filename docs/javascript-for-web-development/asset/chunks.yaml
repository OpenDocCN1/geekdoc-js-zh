    #### 链式调用多个 Promise


    我们在异步编程中常见的通一种模式是：多个操作之间相互依赖执行，或者必须按照特定的顺序执行。我们可能会向数据库发送一个请求，并使用返回的数据来发送另一个请求，依此类推！让我们用另一个洗衣服的例子来说解释这一点：


    我们把脏衣服放入洗衣机中。如果衣服洗干净了，我们就想把它们放入烘干机。烘干机运行后，如果衣服干了，我们就可以把它们折好并收起来。


    这种将 Promise 链在一起的过程被称为组合（composition）。Promise 在设计时就考虑了组合！这里有一个简单的 Promise 链代码：


    ![](img/image04977.jpeg)


    让我们分析一下示例中发生了什么：


    * 我们调用了一个函数 `firstPromiseFunction()`，它返回一个 promise。

    * 我们调用了 `.then()`，并使用匿名函数作为成功处理函数。

    * 在成功处理函数内部，我们返回了一个新的 promise——即调用第二个函数 `secondPromiseFunction()` 的结果，参数是第一个 promise
    的解析值（resolved value）。

    * 我们调用了第二个 `.then()` 来处理第二个 promise 状态的逻辑。

    * 在该 `.then()` 内部，我们有一个成功处理函数，它会将第二个 promise 的解析值打印到控制台。


    为了让我们的链能够正常工作，我们必须返回 `secondPromiseFunction(firstResolveVal)`。这确保了第一个 `.then()`
    的返回值是我们的第二个 promise，而不是返回一个与初始 promise 状态相同的新 promise（这是默认行为）。


    让我们来写一些 Promise 链吧！


