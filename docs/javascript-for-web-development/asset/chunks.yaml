  trans: "\n在我们将 Babel 添加到项目目录之前，需要运行 `npm init`。`npm init` 命令会在根目录下创建一个 `package.json`\
    \ 文件。\n\n`package.json` 文件包含了有关当前 JavaScript 项目的信息。其中包含的部分信息包括：\n\n*   元数据 — 这包括项目标题、描述、作者等。\n\
    *   项目所需的 node 包列表 — 如果其他开发者想要运行你的项目，`npm` 会在 `package.json` 内部查找并下载此列表中的包。\n\
    *   命令行脚本的键值对 — 你可以使用 `npm` 运行这些简写脚本来执行某些进程。在稍后的练习中，我们将添加一个运行 Babel 并将 ES6  转译为\
    \ ES5 的脚本。\n\n如果你在电脑上安装了 Node，可以通过在终端中输入 `npm init` 来创建一个 `package.json` 文件。\n\
    \n终端会提示你填写项目元数据的字段（名称、描述等）。\n\n你并不需要回答这些提示，但我们建议至少要添加你自己的标题和描述。如果你不想填写某个字段，可以按回车键。`npm`\
    \ 在创建 `package.json` 文件时，将使用默认值填充这些字段或将它们留空。\n\n运行 `npm init` 后，你的目录结构将包含以下文件和文件夹：\n\
    \n![](img/image04926.jpeg)\n\n`npm` 将 `package.json` 文件添加到与 `src` 目录相同的层级。\n\n\
    ### 指令\n\n1. 在终端中运行 `ls` 查看当前目录的文件结构。\n   **检查点 2 通过**\n\n2. 使用 `npm` 创建一个新的 `package.json`\
    \ 文件。我们建议你将 `name` 和 `description` 属性设置为以下值：\n*   `name` — `learning-babel`\n\
    *   `description` — `Use Babel to transpile JavaScript ES6 to ES5`\n\n在终端中输入 `ls`\
    \ 以查看当前目录的文件结构。注意到新增了 `package.json`。\n\n```\nnpm init\n```\n\n在上一个练习中，你通过终端中书写了一条命令来将\
    \ ES6 代码转译为 ES5。在接下来的五个练习中，你将学习如何设置一个 JavaScript 项目，以便当你从 JavaScript 项目根目录运行 `npm\
    \ run build` 时，它可以转译代码。\n\n第一步是将你的 ES6 JavaScript 文件放在名为 `src` 的目录中。从根目录来看，ES6\
    \ 文件的路径为 `./src/main.js`\n\n初始 JavaScript 项目的文件结构如下：\n\n![](img/image04927.jpeg)\n\
    \n在安装 Babel 之前，我们需要配置项目以使用 [node](https://docs.npmjs.com/getting-started/what-is-npm)\
    \ [包管理器 (npm)](https://docs.npmjs.com/getting-started/what-is-npm)。开发者使用 `npm`\
    \ 来访问和管理 Node 包。Node 包是包含其他开发者编写的 JavaScript 代码的目录。你可以使用这些包来减少重复工作并避免错误。\n"
- fmt: "\nWe use the `npm install` command to install new Node packages locally. The\
    \ `install` command creates a folder called `node_modules` and copies the package\
    \ files to it. The `install` command also installs all of the dependencies for\
    \ the given package.\n\nTo install Babel, we need to `npm install` two packages,\
    \ `babel-cli` and `babel-preset-env`. However, `npm` installs over one hundred\
    \ other packages that are dependencies for Babel to run properly.\n\nWe install\
    \ Babel with the following two commands:\n\n![](Images/image04931.jpeg)![](Images/image04932.jpeg)package\
    \ includes command line Babel tools, and the package has the code that maps any\
    \ JavaScript feature, ES6 and above (ES6+), to ES5.\n\n![](Images/image04933.jpeg)The\
    \ `--save-dev` flag instructs npm to add each package to a property in `package.json`.\
    \ Once the project’s dependencies are listed in `devDependencies`, other developers\
    \ can run your project without installing each package separately. Instead, they\
    \ can simply run `npm install` — it instructs `npm` to look inside `package.json`\
    \ and download all of the packages listed in `devDependencies`.\n\nOnce you `npm\
    \ install` packages, you can find the Babel packages and all their dependencies\
    \ in the `node_modules` folder. The new directory structure contains the following:\n\
    \n![](Images/image04934.jpeg)\n\nThe `...` in the file structure above is a placeholder\
    \ for 100+ packages that `npm` installed.\n\n### Instructions\n\n1. Enter `ls`\
    \ into the terminal to view the current directory’s file structure.\n   Checkpoint\
    \ 2 Passed\n\n2. Use `npm` with the `-D` flag to install the Babel command line\
    \ package and add it to the `devDependencies` property in `package.json`.\n  \
    \ Checkpoint 3 Passed\n\n3. Use `npm` with the `-D` flag to install the Babel\
    \ preset environment package and add it to the `devDependencies` property in `package.json`.\n\
    \   Enter `ls` into the terminal to see the file structure of your current directory.\
    \ Notice the addition of `node_modules`.\n\nYou can also see the new folder by\
    \ clicking on the file navigation button above the text editor.\n\n### .babelrc\n\
    \nNow that you’ve downloaded the Babel packages, you need specify the version\
    \ of the source JavaScript code.\n\nYou can specify the initial JavaScript version\
    \ inside of a file named `.babelrc`. In your root directory, you can run `touch\
    \ .babelrc` to create this file.\n\nYour project directory contains the following\
    \ folders and files:\n\n![](Images/image04935.jpeg)\n\nInside `.babelrc` you need\
    \ to define the preset for your source JavaScript file. The preset specifies the\
    \ version of your initial JavaScript file.\n\nUsually, you want to transpile JavaScript\
    \ code from versions ES6 and later (ES6+) to ES5. From this point on, we will\
    \ refer to our source code as ES6+, because Ecma introduces new syntax with each\
    \ new version of JavaScript.\n\nTo specify that we are transpiling code from an\
    \ ES6+ source, we have to add the following JavaScript object into `.babelrc`:\n\
    \n![](Images/image04936.jpeg)\n\nWhen you run Babel, it looks in `.babelrc` to\
    \ determine the version of the initial JavaScript file. In this case, `[\"env\"\
    ]` instructs Babel to transpile any code from versions ES6 and later.\n\n### Instructions\n\
    \n1. In the root directory, use `touch` to create a new `.babelrc` file.\n   Checkpoint\
    \ 2 Passed\n\n2. Open the `.babelrc` file and add an object that specifies the\
    \ preset to `\"env\"`. Run the code once you’ve added the object.\n\n### Babel\
    \ Source Lib\n\nThere’s one last step before we can transpile our code. We need\
    \ to specify a script in `package.json` that initiates the ES6+ to ES5 transpilation.\n\
    \nInside of the `package.json` file, there is a property named `\"scripts\"` that\
    \ holds an object for specifying command line shortcuts. It looks like this:\n\
    \n![](Images/image04937.jpeg)\n\nIn the code above, the `\"scripts\"` property\
    \ contains an object with one property called `\"test\"`. Below the `\"test\"\
    ` property, we will add a script that runs Babel like this:\n\n![](Images/image04938.jpeg)\n\
    \nIn the `\"scripts\"` object above, we add a property called `\"build\"`. The\
    \ property’s value, `\"babel src -d lib\"`, is a command line method that transpiles\
    \ ES6+ code to ES5. Let’s consider each argument in the method call:\n\n![](Images/image04939.jpeg)\n\
    • `babel`: The Babel command call responsible for transpiling code.\n\n![](Images/image04940.jpeg)\n\
    • `src`: Instructs Babel to transpile all JavaScript code inside the `src` directory.\n\
    • `-d`: Instructs Babel to write the transpiled code to a directory.\n• `lib`:\
    \ Babel writes the transpiled code to a directory called `lib`.\n\nIn the next\
    \ exercise, we’ll run `babel src -d lib` method to transpile our ES6+ code.\n\n\
    ### Instructions\n\n1. In `package.json`, add a script called `\"build\"`.\n \
    \  When run, the `\"build\"` script should use Babel to transpile JavaScript code\
    \ inside of the `src` folder and write it to a folder called `lib`.\n   Don’t\
    \ forget to add a comma after the `\"test\"` script.\n\n![](Images/image04941.jpeg)\n\
    \n### Build\n\nWe’re ready to transpile our code! In the last exercise, we wrote\
    \ the following script in `package.json`:\n\n`\"build\": \"babel src -d lib\"\
    `\n\nNow, we need to call `\"build\"` from the command line to transpile and write\
    \ ES5 code to a directory called `lib`.\n\nFrom the command line, we type:\n\n\
    `npm run build`\n\nThe command above runs the `build` script in `package.json`.\n\
    \nBabel writes the ES5 code to a file named `main.js` (it’s always the same name\
    \ as the original file), inside of a folder called `lib`. The resulting directory\
    \ structure is:\n\n![](Images/image04942.jpeg)\n\nNotice, the directory contains\
    \ a new folder named `lib`, with one file, called `main.js`.\n\nThe `npm run build`\
    \ command will transpile all JavaScript files inside of the `src` folder. This\
    \ is helpful as you build larger JavaScript projects — regardless of the number\
    \ of JavaScript files, you only need to run one command (`npm run build`) to transpile\
    \ all of your code.\n\n### Instructions\n\n1. Transpile the ES6+ code to `lib`\
    \ using the `build` command.\n   Once you’ve done this, navigate to the new `lib`\
    \ folder and open `main.js`.\n\n### Review\n\nIn this lesson, you learned about\
    \ browser compatibility and transpilation. Let’s review the key concepts:\n\n\
    • ES5 — The old JavaScript version that is supported by all modern web browsers.\n\
    • ES6 — The new(er) JavaScript version that is not supported by all modern web\
    \ browsers. The syntax is more readable, similar to other programming languages,\
    \ and addresses the source of common bugs in ES5.\n• caniuse.com — a website you\
    \ can use to look up HTML, CSS, and JavaScript compatibility information.\n• Babel\
    \ — A JavaScript package that transpiles ES6+ code to ES5.\n• npm init — A terminal\
    \ command that creates a `package.json` file.\n• package.json — A file that contains\
    \ information about a JavaScript project.\n• npm install — A command that installs\
    \ Node packages.\n• babel-cli — A Node package that contains command line tools\
    \ for Babel.\n• babel-preset-env — A Node package that contains ES6+ to ES5 syntax\
    \ mapping information.\n• .babelrc — A file that specifies the version of the\
    \ JavaScript source code.\n• \"build\" script — A package.json script that you\
    \ use to translate ES6+ code to ES5.\n• npm run build — A command that runs the\
    \ build script and transpiles ES6+ code to ES5.\n"
