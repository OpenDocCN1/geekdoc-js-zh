  trans: "\n\n变量命名有几条通用规则：\n\n- 变量名不能以数字开头。\n- 变量名是区分大小写，因此 `myName` 和 `myname` 是不同的变量。创建两个大小写不同但名称相同的变量是一个坏习惯。\n\
    - 变量名不能与关键字相同。要查看完整的关键字列表，请参考 [MDN 关键字](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords)\
    \ [文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords)。\n\
    \n注意：在接下来的练习中，我们将学习为什么许多程序员倾向于使用 ES6 的 `let` 和 `const` 作为变量关键字。因为仍然有大量代码是在 ES6\
    \ 之前写的，所以熟悉 ES6 之前的 `var` 关键字是有帮助的。\n\n如果你想了解更多关于 `var` 及其特殊特性，请查看 [MDN var 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var)。\n\
    \n![](img/image04581.jpeg)\n\n### 练习\n\n1. 使用 `var` 关键字声明一个名为 `favoriteFood` 的变量，并为其赋值字符串\
    \ 'pizza'。\n   - Checkpoint 2 Passed\n   - Stuck? Get a hint\n\n2. 使用 `var` 关键字声明一个名为\
    \ `numOfSlices` 的变量，并为其赋值数字 8。\n   - Checkpoint 3 Passed\n   - Stuck? Get a hint\n\
    \n3. 在 `numOfSlices` 变量下方，使用 `console.log()` 输出存储在 `favoriteFood` 中的值。\n   在下一行，使用\
    \ `console.log()` 输出存储在 `numOfSlices` 中的值。\n   ![](img/image04582.jpeg)\n\n##\
    \ 创建变量：let\n\n正如上一个练习提到的，`let` 关键字是在 ES6 中引入的。`let` 关键字表示该变量可以重新赋予不同的值。看示例：\n\n\
    ![](img/image04583.jpeg)\n\n在使用 `let`（甚至是 `var`）我们需要我们需要的另一个概念是，我们可以声明变量而不给其赋值。在这种情况下，变量将自动初始化为值\
    \ `undefined`：\n\n![](img/image04584.jpeg)\n\n注意上面的示例：\n- 如果我们不对使用 `let` 关键字声明的变量赋值，它会自动具有值\
    \ `undefined`。\n- 我们可以重新为变量赋值。\n\n### 指令\n\n1. 创建一个名为 `changeMe` 的 `let` 变量，并设置为布尔值\
    \ `true`。\n   - Checkpoint 2 Passed\n   - Stuck? Get a hint\n\n2. 在声明 `changeMe`\
    \ 的之后，将 `changeMe` 的值设置为布尔值 `false`。\n   为了检查 `changeMe` 是否被重新赋值，将存储在 `changeMe`\
    \ 中的值打印到控制台。\n   ![](img/image04585.jpeg)\n\n## 创建变量：const\n\n`const` 关键字也是在 ES6\
    \ 中引入的，是 constant 一词的写。与 `var` 和 `let` 一样，你可以在 `const` 变量中存储任何值。声明 `const` 变量并赋值的方法与\
    \ `let` 和 `var` 相同。看以下示例：\n\n![](img/image04586.jpeg)\n\n然而，`const` 变量不能重新赋值，因为它是常量。如果你尝试重新给\
    \ `const` 变量赋值，将得到 `TypeError`。\n\n常量变量在声明时必须赋值。如果你尝试在不赋值的情况下声明 `const` 变量，将得到\
    \ `SyntaxError`。\n\n如果你在犹豫使用哪个关键字（`let` 还是 `const`），请考虑你之后是否需要重新变量赋值。如果确实需要重新赋值，使用\
    \ `let`，否则使用 `const`。\n\n### 指令\n\n1. 创建一个名为 `entree` 的常量变量，并设置为字符串 'Enchiladas'。\n\
    \   - Checkpoint 2 Passed\n   - Stuck? Get a hint\n\n2. 为了检查你已将 'Enchiladas' 的值保存到\
    \ `entree`，将 `entree` 的值打印到控制台。\n   - Checkpoint 3 Passed\n   - Stuck? Get a hint\n\
    \n3. 太棒了，让我们尝试重新给常量赋值会发生什么。将以下代码粘贴到程序的末尾。\n\n```\nentree = 'Tacos'\n```\n\n当你运行代码时，这段代码会抛出以下错误：\n\
    ```\nTypeError: Assignment to constant variable.\n```\n\n在你清除此检查点后，如果你想查看 `const`\
    \ 的另一个特殊特性，请打开提示！\n![](img/image04587.jpeg)\n\n## 数学赋值运算符\n\n让我们考虑如何使用变量和数学运算符来计算新值并将它们赋值给变量。看下面的示例：\n\
    \n| `let w = 4; w = w + 1;console.log(w); // 输出: 5` | 在上面的示例中，我们创建了变量 `w` 并为其赋值数字\
    \ 4。下一行 `w = w + 1` 将 `w` 的值从 4 增加到 5。 |\n\n我们在对 `w` 执行某些数学操作后，重新赋值的另一种方法是使用内置的数学赋值运算符。我们可以重写上面的代码为：\n\
    \n![](img/image04588.jpeg)\n\n在第二个示例中，我们使用 `+=` 赋值运算符重新给 `w` 赋值。我们使用右侧的数字对第一个运算符\
    \ `+` 进行数学运算，然后将结果重新赋值给 `w`。\n\n我们还可以使用其他数学赋值运算符：`-=`、`*=` 和 `/=`，它们的工作方式类似。\n\
    \n![](img/image04589.jpeg)\n\n让我们练习使用这些数学赋值运算符！\n\n### 指令\n\n1. 使用 `+=` 数学赋值运算符将\
    \ `levelUp` 中存储的值增加 5。\n   - Checkpoint 2 Passed\n   - Stuck? Get a hint\n\n2.\
    \ ![](img/image04590.jpeg) 使用 `-=` 数学赋值运算符将存储的值减少 100。\n   - Checkpoint 3 Passed\n\
    \   - Stuck? Get a hint\n\n3. 使用 `*=` 数学赋值运算符将 `multiplyMe` 中存储的值乘以 11。\n   -\
    \ Checkpoint 4 Passed\n   - Stuck? Get a hint\n\n4. 使用 `/=` 数学赋值运算符将 `quarterMe`\
    \ 中存储的值除以 4。\n   ![](img/image04591.jpeg)\n\n## 递增递减运算符\n\n其他数学赋值运算符包括自增运算符 `++`\
    \ 和自减运算符 `--`。\n\n![](img/image04592.jpeg) 自增运算符会将变量的值加 1。自减运算符会将变量的值减 1。例如：变量的值被更新并赋值为该值的新值。\n\
    \n### 指令\n\n1. 使用自增运算符增加 `gainedDollar` 的值。\n   - Checkpoint 2 Passed\n   - Stuck?\
    \ Get a hint\n\n2. 使用自减运算符减少 `lostDollar` 的值。\n   ![](img/image04593.jpeg)\n\n\
    ## 变量的字符串拼接\n\n在之前的练习中，我们将字符串赋值给变量。现在，让我们来看看如何在变量中连接（或拼接）字符串。\n\n`+` 运算符可以组合两个字符串值，即使这些值存储在变量中：\n\
    \n![](img/image04594.jpeg)\n\n在上面的示例中，我们将值 'armadillo' 赋值给变量 `myPet`。在第二行中，使用\
    \ `+` 运算符组合三个字符串：'I own a pet'、存储在 `myPet` 中的值以及 '.'。我们将此拼接的结果打印到控制台，如下：\n\n![](img/image04595.jpeg)\n\
    \n### 指令\n\n1. 创建一个名为 `favoriteAnimal` 的变量，并将其设置为你最喜欢的动物。\n   - Checkpoint 2 Passed\n\
    \   - Stuck? Get a hint\n\n2. 使用 `console.log()` 向控制台打印 'My favorite animal: ANIMAL'。使用字符串拼接，使\
    \ `ANIMAL` 被替换为 `favoriteAnimal` 变量中的值。\n   ![](img/image04596.jpeg)\n\n## 字符串插值\n\
    \n在 ES6 版本的 JavaScript 中，我们可以使用模板字面量（template literals）将变量插入或插值字符串。看以下示例，它使用了模板字面量将字符串连接在一起：\n\
    \n![](img/image04597.jpeg)\n\n"
