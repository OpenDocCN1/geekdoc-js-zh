  raw: "We can use either dot notation,  ., or bracket notation,  [], and the  assignment\
    \ operator,  =  to  add new  key-value  pairs to an object  or  change  an  existing\
    \ property.\n\nOne  of  two  things can  happen with  property assignment:\n\n\
    • If the property already exists on the object, whatever value it held  before\
    \  will be replaced with the  newly assigned  value.\n\n• If there was no property\
    \ with that name, a new property will be  added  to the object.\n\nIt’s important\
    \ to know that although we can’t reassign an object declared  with  const, we\
    \ can still mutate it, meaning we can add new properties and  change  the properties\
    \ that are there.\n\n![](Images/image04789.jpeg)\n\nYou  can delete a  property\
    \ from an object  with the  delete  operator.\n\n![](Images/image04790.jpeg)\n\
    \n1.\n\nReassign the  color  property of  the  spaceship  object to have  a value\
    \  of  'glorious gold'\n\n Checkpoint 2 Passed\n\nStuck?  Get a hint\n\n2.\n\n\
    Without  changing  lines  1 - 6,  add a  numEngines  property with  a  numeric\
    \  value between 1 and 10 to the  spaceship  object.\n\n Checkpoint 3 Passed\n\
    \nStuck?  Get a hint\n\n3.\n\n![](Images/image04791.jpeg)Use  theoperator to remove\
    \  the  'Secret  Mission'  property  from\n\nthe  spaceship  object.\n\n![](Images/image04792.jpeg)\n\
    \nMethods\n\nWhen the data stored on an object is a function we call that a method.\
    \ A  property  is what an  object has,  while a  method is what  an object does.\n\
    \nDo object methods seem familiar? That’s because you’ve been using them  all\
    \ along! For example  console  is a global javascript object and  .log()  is a\
    \  method  on  that  object.  Math  is also  a global javascript object and  .floor()\
    \  is  a  method on it.\n\nWe can include methods in our object literals by creating\
    \ ordinary, comma-  separated key-value pairs. The key serves as our method’s\
    \ name, while the  value  is an anonymous function expression.\n\n![](Images/image04793.jpeg)\n\
    \n![](Images/image04794.jpeg)\n\nWith  the new  method syntax introduced  in ES6\
    \  we can omit  the colon  and\n\nthe  function  keyword.\n\n![](Images/image04795.jpeg)\n\
    \nObject methods are invoked by appending the object’s name with the dot  operator\
    \  followed by the method  name and parentheses:\n\n![](Images/image04796.jpeg)\n\
    \n1.\n\nBelow  the retreatMessage  variable  in the code  editor, create\n\nan\
    \  alienShip  object. It  should contain a  method  .retreat()  which  will  console.log()\
    \  the  retreatMessage.\n\n Checkpoint 2 Passed\n\nStuck?  Get a hint\n\n2.\n\n\
    Add another method to your object literal. This method,  .takeOff(),  should \
    \ console.log()  the  string  'Spim...  Borp...  Glix...  Blastoff!'.\n\n Checkpoint\
    \ 3 Passed\n\nStuck?  Get a hint\n\n3.\n\nInvoke your  two methods: first  .retreat()\
    \  then  .takeOff().\n\n![](Images/image04797.jpeg)\n\n![](Images/image04798.jpeg)\n\
    \nNested  Objects\n\nIn application code, objects are often nested— an object\
    \ might have  another object as a property which in turn could have a property\
    \ that’s an  array  of  even more objects!\n\nIn our spaceship  object, we want\
    \ a  crew  object. This will contain all the crew  members  who do important work\
    \ on  the craft. Each of those  crew  members  are objects themselves. They have\
    \ properties like  name, and  degree, and they  each have unique methods based\
    \ on their roles. We can also nest other  objects in the  spaceship  such as a\
    \  telescope  or nest details about the  spaceship’s computers inside  a parent\
    \  nanoelectronics  object.\n\n![](Images/image04799.jpeg)\n\n![](Images/image04800.jpeg)\n\
    \nWe  can  chain operators  to access nested  properties. We’ll have  to  pay\n\
    \nattention to which operator makes sense to use in each layer. It can be  helpful\
    \ to pretend you are the computer and evaluate each expression from  left  to\
    \ right  so that  each operation  starts to  feel a  little more manageable.\n\
    \n![](Images/image04801.jpeg)\n\nIn  the preceding  code:\n\n• First the computer\
    \ evaluates  spaceship.nanoelectronics, which results  in  an object  containing\
    \ the  back-up  and  computer  objects.\n\n• We  accessed the  back-up  object\
    \  by  appending  ['back-up'].\n\n• The  back-up  object has  a  battery  property,\
    \ accessed\n\nwith .battery  which  returned  the value stored there:  'Lithium'\n\
    \nInstructions  1.\n\nCreate  a  variable capFave  and assign the  captain‘s \
    \ favorite food  (the  element  in the 0th index of her  'favorite foods'  array)\
    \ to it. Make sure to use  bracket and  dot notation  to  get the value  of the\
    \  food through nested  access  (don’t  just copy the value into  the variable!)\n\
    \n Checkpoint 2 Passed\n\nStuck?  Get a hint\n\n2.\n\nRight  now the  passengers\
    \  property has a  value of  null. Instead, assign as its  value  an  array  of\
    \ objects. These  objects should  represent the  spaceship‘s\n\npassengers as\
    \ individual objects. Make at least one passenger object in the  array  that has\
    \ at least one key-value pair  on it.\n\n Checkpoint 3 Passed\n\nStuck?  Get a\
    \ hint\n\n3.\n\nCreate a variable  firstPassenger  and assign the first passenger\
    \ as its value  (the element in the 0th index of the  spaceship.passengers  array\
    \ you just  made). Make sure to use bracket and dot notation to get the passenger\
    \  object  through  nested  access  (don’t  just  copy  the  object  into  the\
    \  variable!)\n\n![](Images/image04802.jpeg)\n\n![](Images/image04803.jpeg)\n\n\
    Pass  By  Reference\n\nObjects are passed by reference. This means when we pass\
    \ a variable  assigned to an object into a function as an argument, the computer\
    \  interprets the parameter name as pointing to the space in memory holding  that\
    \ object. As a result, functions which change object properties actually  mutate\
    \  the object permanently  (even when the object  is assigned to\n\na  const \
    \ variable).\n\n![](Images/image04804.jpeg)\n\nOur function  paintIt()  permanently\
    \ changed  the  color of\n\nour spaceship  object. However,  reassignment of \
    \ the  spaceship  variable  wouldn’t  work in the same  way:\n\n![](Images/image04805.jpeg)\n\
    \n![](Images/image04806.jpeg)\n\nLet’s  look at  what  happened in the code  example:\n\
    \n• ![](Images/image04807.jpeg)We  declared thisobject  with  let.  This allowed\
    \  us to  reassign\n\nit  to  a  new  object  with  identified  and  'transport\
    \  type'  properties  with  no problems.\n\n• When we tried the same thing using\
    \ a function designed to reassign  the object passed into it, the reassignment\
    \ didn’t stick (even though  calling  console.log()  on the object produced the\
    \ expected result).\n\n• When we  passed  spaceship  into that function,  obj\
    \  became a  reference  to  the memory  location of the  spaceship  object, but\
    \ not  to\n\nthe  spaceship  variable.  This is  because  the  obj  parameter\
    \ of\n\nthe tryReassignment()  function is a variable in its own right. The body\
    \  of  tryReassignment()  has  no  knowledge  of  the  spaceship  variable  at\
    \  all!\n\n• When we did the reassignment in the body of  tryReassignment(), \
    \ the  obj  variable came to refer to the memory location of the  object  {'identified'\
    \ : false, 'transport type' : 'flying'}, while  the  spaceship  variable was completely\
    \ unchanged from its earlier  value.\n\nInstructions  1.\n\nWrite  a function\
    \  greenEnergy()  that has an  object as a parameter and sets  that object’s \
    \ 'Fuel  Type'  property  to  'avocado oil'.\n\n Checkpoint 2 Passed\n\nStuck?\
    \  Get a hint\n\n2.\n\nWrite  a  function  remotelyDisable()  that has  an  object\
    \  as  a parameter  and  sets  (or reassigns) that object’s  disabled  property\
    \ to  true.\n\n Checkpoint 3 Passed\n\nStuck?  Get a hint\n\n3.\n\nCall  your\
    \  two  functions  with  the  spaceship  object  in  the  code  editor,  then\
    \  console.log()  the  spaceship  object to  confirm  those  properties  were\
    \  changed/added.\n\n![](Images/image04808.jpeg)\n\nLooping  Through  Objects"
