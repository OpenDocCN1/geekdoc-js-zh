    # 使用 Promise.all()


    当正确处理时，promise 组合是处理异步操作相互依赖或执行顺序重要的情况的一种棒方法。如果我们正在处理多个 promise，但不在乎顺序呢？让我们再次从打扫卫生的角度考虑。


    为了让我们认为房子是整洁的，我们需要衣服晾干、倒空垃圾桶以及运行洗碗机。我们需要完成所有这些任务，但不需要任何特定的顺序。此外，由于它们都是异步执行的，它们实际上应该都同时发生！


    为了使效率最大化，我们应该使用并发，即让多个异步操作同时进行。通过 promise，我们可以使用 `Promise.all()` 函数来实现这一点。


    `Promise.all()` 接受一个 promise 数组作为参数并返回单个 promise。该单个 promise 将以两种方式之一稳定：


    * 如果参数数组中的每个 promise 都解析（resolve），`Promise.all()` 返回的单个 promise 将解析为一个包含参数数组中每个
    promise 解析值的数组。

    * 如果参数数组中的任何 promise 被拒绝（reject），`Promise.all()` 返回的单个 promise 将立即以该 promise 被拒绝的原因被拒绝。这种行为有时被称为快速失败（failing
    fast）。


    来看一个代码示例：


    ![](img/image04989.jpeg)


    让我们分析一下发生了什么：


    * 我们声明了 `myPromises` 并赋值为调用 `Promise.all()`。

    * 我们调用 `Promise.all()` 并传入一个包含三个 promise 的数组——这些函数的返回值。

    * 我们调用了带有成功处理函数的 `.then()`，如果每个 promise 都成功解析，它将打印解析值数组。

    * 我们调用了带有失败处理函数的 `.catch()`，如果任何 promise 被拒绝，它将打印第一个拒绝消息。


    # 指令


    1.


    我们的业务经营得非常好，库存快用完了。我们想联系一些分销商，看看他们是否有我们需要的物品。我们只想进行一次补货订单，因此只有在所有物品可用时我们才想要下单。


    查看提供的代码。我们在一个函数中要求：`checkAvailability()`。


    `checkAvailability()` 期望两个字符串参数：物品和分销商。它返回一个 promise。该函数模拟检查指定的分销商是否有指定的物品。80%
    的时间它会带上物品解析 promise，20% 的时间它会带上表示物品不可用的错误消息拒绝拒绝 promise。


    我们还提供了两个函数，将作为成功和失败处理函数。


    如果你愿意，可以查看 `library.js` 文件查看这些函数是如何工作的。准备好进入下一个检查点时按下“检查工作”。


