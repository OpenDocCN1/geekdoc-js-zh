    在我们向项目目录添加 `Babel` 之前，我们需要运行 `npm init`。`npm init` 命令会在根目录下创建一个 `package.json`
    文件。


    `package.json` 文件包含了有关当前 JavaScript 项目的信息。其中包含部分信息包括：


    - 元数据 —— 这包括项目标题、描述、作者等。

    - 项目所需的 node 包列表 —— 如果其他开发者想要运行你的项目，`npm` 会查看 `package.json` 内部并下载此列表中的包。

    - 命令行脚本的键值对 —— 你可以使用 `npm` 运行这些简写脚本来执行某些过程。在稍后的练习中，我们将添加一个运行 `Babel` 并将 ES6 转译为
    ES5 的脚本。


    如果你电脑上安装了 Node，你可以在终端中输入 `npm init` 来创建一个 `package.json` 文件。


    终端会提示你填写项目元数据的字段（名称、描述等）。


    你并不需要回答这些提示，但我们建议至少添加你自己的标题和描述。如果你不想填写某个字段，可以按按回车键。`npm` 在创建 `package.json` 文件时，将使用默认值填充这些字段或将其留空。


