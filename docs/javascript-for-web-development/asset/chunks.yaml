    # Static Methods


    Sometimes you will want a class to have methods that aren’t available in individual
    instances, but that you can call directly from the class.


    Take the `Date` class, for example — you can both create `Date` instances to represent
    whatever date you want, and call static methods, like `Date.now()` which returns
    the current date, directly from the class.


    The `.now()` method is static, so you can call it directly from the class, but
    not from an instance of the class.


    Let’s see how to use the `static` keyword to create a static method called `generateName`
    method in our `Animal` class:


    ![](Images/image04901.jpeg)


    In the example above, we create a static method ![](Images/image04902.jpeg) called
    `.generateName()` that returns a random name when it’s called. Because of the
    static keyword, we can only access `.generateName()` by appending it to the `Animal`
    class.


    We call the `.generateName()` method with the following syntax:


    ```

    console.log(Animal.generateName());  // returns a name

    ```


    You cannot access the `.generateName()` method from instances of the `Animal`
    class or instances of its subclasses (See below).


    ![](Images/image04903.jpeg)


    The example above will result in an error, because you cannot call static methods
    (`.generateName()`) on an instance (`tyson`).


    ### Instructions 1


    Inside of your `HospitalEmployee` class, create a static method called `generatePassword`.
    When it’s called, this method should return a random integer between zero and
    10,000.


    ![](Images/image04904.jpeg)

    ![](Images/image04905.jpeg)


    ## Review: Classes


    Way to go! Let’s review what you learned.


    * Classes are templates for objects.

    * Javascript calls a constructor method when we create a new instance of a class.

    * Inheritance is when we create a parent class with properties and methods that
    we can extend to child classes.

    * We use the `extends` keyword to create a subclass.

    * The `super` keyword calls the `constructor()` of a parent class.

    * Static methods are called on the class, but not on instances of the class.


    # BROWSER COMPATIBILITY AND TRANSPILATION


    ## Introduction


    You’re probably prompted to update your web browser every few months. Do you know
    why? A few reasons include addressing security vulnerabilities, adding features,
    and supporting new HTML, CSS, and JavaScript syntax.


    The reasons above imply there is a period before a software update is released
    when there are security vulnerabilities and unsupported language syntax.


    This lesson focuses on the latter. Specifically, how developers address the gap
    between the new JavaScript syntax that they use and the JavaScript syntax that
    web browsers recognize.


    This has become a widespread concern for web developers since Ecma International,
    the organization responsible for standardizing JavaScript, released a new version
    of it in 2015, called ECMAScript2015, commonly referred to as `ES6`. Note, the
    6 refers to the version of JavaScript and is not related to the year it was released
    (the previous version was ES5).


    Upon release, web developers quickly adopted the new ES6 syntax, as it improved
    readability and efficiency. However, ES6 was not supported by most web browsers,
    so developers ran into browser compatibility issues.


    In this lesson, you will learn about two important tools for addressing browser
    compatibility issues.


    * `caniuse.com` — A website that provides data on web browser compatibility for
    HTML, CSS, and JavaScript features. You will learn how to use it to look up ES6
    feature support.

    * `Babel` — A Javascript library that you can use to convert new, unsupported
    JavaScript (ES6), into an older version (ES5) that is recognized by most modern
    browsers.


    Let’s get started by running ES6 JavaScript on a fake old web browser version.


    ### Instructions 1


    1. Copy the following code into `main.js`. The code includes three features of
    ES6 syntax: `const`, `let`, and ES6 string interpolation.


    ![](Images/image04906.jpeg)


    ### Output


    ![](Images/image04907.jpeg)


    ## caniuse.com I


    Since Ecma’s release of ECMAScript2015 (ES6), software companies have slowly added
    support for ES6 features and syntax. While most new browser versions support the
    majority of the ES6 library, there are still a couple sources of compatibility
    issues:


    * Some users have not updated to the latest, ES6 supported web browser version.

    * A few ES6 features, like modules, are still not supported by most web browsers.


    Because companies add support for ES6 features gradually, it’s important for you
    to know how to look up browser support on a feature-by-feature basis. The website
    [caniuse.com](http://caniuse.com/) is the best resource for finding browser compatibility
    information.


    In caniuse, you can enter an ES6 feature, like `let`, and see the percentage of
    browsers that recognize it. You can also see when each major web browser (Chrome,
    Safari, Edge, etc.) added support for the keyword.


    ## caniuse.com II


    Now, it’s your turn to get some practice with [caniuse.com](http://caniuse.com/).
    In a new tab, open `caniuse.com` and complete the tasks below.


    ### Instructions 1


    1. Look up the percentage of browsers that support JavaScript ES5. Save the value,
    as a number, to the variable `esFivePercentageSupport`.


    Checkpoint 2 Passed


    Stuck? Get a hint


    2. Look up the percentage of browsers that support “Template Literals”, a feature
    that was introduced in ES6. Save the value, as a number, to the variable `esTemplateLiterals`.


    ![](Images/image04908.jpeg)


    ## Why ES6?


    Before we learn how to set up a JavaScript project that converts ES6 to ES5, it’s
    worth understanding a few of the reasons Ecma made such updates.


    The version of JavaScript that preceded ES6 is called ES5. Three reasons for the
    ES6 updates are listed below:


    * Readability and economy of code — The new syntax is often easier to understand
    (more readable) and requires fewer characters to create the same functionality
    (economy of code).

    * Addresses sources of ES5 bugs — Some ES5 syntax led to common bugs. With ES6,
    Ecma introduced syntax that mitigates some of the most common pitfalls.

    * A similarity to other programming languages — JavaScript ES6 is syntactically
    more similar to object-oriented languages. This leads to less friction when experienced,
    non-JavaScript developers want to learn JavaScript.


    Because ES6 addressed the above issues, Ecma knew that adoption by web developers
    would occur quickly, while web browser support lagged.


    To limit the impact of ES6 browser compatibility issues, Ecma made the new syntax
    backwards compatible, which means you can map JavaScript ES6 code to ES5.


    ### Instructions 1


    1. In these tasks, you will manually change the code in `main.js` to ES5 syntax.


    The `let` and `const` keywords were introduced in ES6. Before that, we declared
    all variables with the `var` keyword.


    Change the `let` and `const` keywords in `main.js` to `var`.


    ![](Images/image04909.jpeg)![](Images/image04910.jpeg)


    Checkpoint 2 Passed


    Stuck? Get a hint


    2. The following line of code is written with ES6 string interpolation:


    ![](Images/image04911.jpeg)


    In ES5, we used plus signs (+) to interpolate variables into strings. In `main.js`,
    use ES5 string interpolation to set `carbonara` to the same string as above.


    ## Transpilation With Babel


    In the last exercise, you manually converted ES6 code to ES5. Although manual
    conversion only took you a few minutes, it is unsustainable as the size of the
    JavaScript file increases.


    Because ES6 is predictably backwards compatible, a collection of JavaScript programmers
