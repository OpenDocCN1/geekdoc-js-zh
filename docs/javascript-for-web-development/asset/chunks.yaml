    `GET` 请求。没错，你刚刚完成了一个 `GET` 请求！


    ## HTTP 请求


    JavaScript 最大的资产之一是它的非阻塞属性，或者说它是一种异步语言。


    网站（如新闻网站）利用这些非阻塞属性来提供更好的用户体验。通常，网站代码的编写方式使得用户不需要等待巨大的图片加载完成就可以阅读文章——相反，文本会先渲染，然后图片可以在后台加载。


    JavaScript 使用事件循环（event loop）来处理异步函数调用。当程序运行时，函数调用被创建并添加到栈中。那些需要等待服务器响应的请求会被发送到一个单独的队列中。一旦栈清空，队列中的函数就会被执行。


    Web 开发者使用事件循环来决定何时调用函数以及如何处理异步事件，从而创建更顺畅的浏览体验。我们将探索一套被称为异步 JavaScript 和 XML（或
    AJAX）的技术系统。


    要阅读更多关于事件循环的内容，请阅读 MDN 文档：


    - [MDN Documentation: Event Loop](https://developer.mozilla.org/en-US/docs/Web/JavaScript/EventLoop)


