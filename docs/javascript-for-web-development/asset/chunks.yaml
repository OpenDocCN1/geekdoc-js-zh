    # Review Arrays


    Nice work! In this lesson, we learned these concepts regarding arrays:


    - Arrays are lists that store data in JavaScript.

    - Arrays are created with brackets `[]`.

    - Each item inside of an array is at a numbered position, or index, starting at
    0.

    - We can access one item in an array using its index, with syntax like: `myArray[0]`.

    - We can also change an item in an array using its index, with syntax like `myArray[0]
    = ''new string''`.

    - Arrays have a `length` property, which allows you to see how many items are
    in an array.

    - Arrays have their own methods, including `.push()` and `.pop()`, which add and
    remove items from an array, respectively.

    - Arrays have many methods that perform different tasks, such as `.slice()` and
    `.shift()`, you can find documentation at the [Mozilla](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    [Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    website.

    - Some built-in methods are mutating, meaning the method will change the array,
    while others are not mutating. You can always check the documentation.

    - Variables that contain arrays can be declared with `let` or `const`. Even when
    declared with `const`, arrays are still mutable. However, a variable declared
    with `const` cannot be reassigned.

    - Arrays mutated inside of a function will keep that change even outside the function.

    - Arrays can be nested inside other arrays.

    - To access elements in nested arrays chain indices using bracket notation.


    Learning how to work with and manipulate arrays will help you work with chunks
    of data!


    # Loops


    A loop is a programming tool that repeats a set of instructions until a specified
    condition, called a stopping condition is reached. As a programmer, you’ll find
    that you rely on loops all the time! You’ll hear the generic term iterate when
    referring to loops; iterate simply means “to repeat”.


    When we need to reuse a task in our code, we often bundle that action in a function.
    Similarly, when we see that a process has to repeat multiple times in a row, we
    write a loop. Loops allow us to create efficient code that automates processes
    to make scalable, manageable programs.


    As illustrated in the diagram, loops iterate or repeat an action until a specific
    condition is met. When the condition is met, the loop stops and the computer moves
    on to the next part of the program.


    ![](Images/image04706.jpeg)


    ## Repeating Tasks Manually


    Before we write our own loops let’s take a moment to develop an appreciation for
    loops. The best way to do that is by showing you how cumbersome it would be if
    a repeated task required you to type out the same code every single time.


    ### Instructions


    1. Create the variable `vacationSpots`, and assign its value to an array of three
    strings naming places you’d like to visit.

    *Checkpoint 2 Passed*

    *Stuck? Get a hint*


    2. Next, `console.log()` each item in `vacationSpots`. Since we don’t know loops
    yet, we have to `console.log()` each element in the array separately.

    *Checkpoint 3 Passed*

    *Stuck? Get a hint*


    3. Nice work! Now imagine that the vacation list had 100 places on it—logging
    each array element to the console by hand would be a tedious task! In the next
    exercise, we will learn how to make things more efficient with `for` loops.


    ![](Images/image04707.jpeg)


    # The For Loop


    Instead of writing out the same code over and over, loops allow us to tell computers
    to repeat a given block of code on its own. One way to give computers these instructions
    is with a `for` loop.


    The typical `for` loop includes an iterator variable that usually appears in all
    three expressions. The iterator variable is initialized, checked against the stopping
    condition, and assigned a new value on each loop iteration.


    Iterator variables can have any name, but it’s best practice to use a descriptive
    variable name.


    A `for` loop contains three expressions separated by `;` inside the parentheses:


    1. an initialization starts the loop and can also be used to declare the iterator
    variable.

    2. a stopping condition is the condition that the iterator variable is evaluated
    against—if the condition evaluates to `true` the code block will run, and if it
    evaluates to `false` the code will stop.

    3. an iteration statement is used to update the iterator variable on each loop.


    The `for` loop syntax looks like this:


    ![](Images/image04708.jpeg)


    In this example, the output would be the following:


    ![](Images/image04709.jpeg)


    Let’s break down the example:


    - The initialization is `let counter = 0`, so the loop will start counting at
    0.

    - The stopping condition is `counter < 4`, meaning the loop will run as long as
    the iterator variable, `counter`, is less than 4.

    - The iteration statement is `counter++`. This means after each loop, the value
    of `counter` will increase by 1. For the first iteration `counter` will equal
    0, for the second iteration `counter` will equal 1, and so on.

    - The code block is inside of the curly braces, `console.log(counter)`, will execute
    until the condition evaluates to `false`. The condition will be `false` when `counter`
    is greater than or equal to 4—the point that the condition becomes false is sometimes
    called the stop condition.


    This `for` loop makes it possible to write 0, 1, 2, and 3 programmatically.


    ### Instructions


    1. Now, make your own! Create a program that loops from 5 to 10 and logs each
    number to the console.


    ![](Images/image04710.jpeg)

    ![](Images/image04711.jpeg)


    # Looping in Reverse


    What if we want the `for` loop to log 3, 2, 1, and then 0? With simple modifications
    to the expressions, we can make our loop run backward!


    To run a backward `for` loop, we must:


    - Set the iterator variable to the highest desired value in the initialization
    expression.

    - Set the stopping condition for when the iterator variable is less than the desired
    amount.

    - The iterator should decrease in intervals after each iteration.


    ### Instructions


    1. Make a `for` loop that loops backwards printing 3 to 0 to the console. Use
    the `>=` comparison operator in your stopping condition and the `--` operator
    in your iteration statement.


    ![](Images/image04712.jpeg)


    # Looping through Arrays


    `for` loops are very handy for iterating over data structures. For example, we
    can use a `for` loop to perform the same operation on each element on an array.
    Arrays hold lists of data, like customer names or product information. Imagine
    we owned a store and wanted to increase the price of every product in our catalog.
    That could be a lot of repeating code, but by using a `for` loop to iterate through
    the array we could accomplish this task easily.


    To loop through each element in an array, a `for` loop should use the array’s
    `.length` property in its condition.


    Check out the example below to see how `for` loops iterate on arrays:


    ![](Images/image04713.jpeg)


    This example would give you the following output:


    ![](Images/image04714.jpeg)


    In the loop above, we’ve named our iterator variable `i`. This is a variable naming
    convention you’ll see in a lot of loops. When we use `i` to iterate through arrays
    we can think of it as being short-hand for the word index. Notice how our stopping
    condition checks that `i` is less than `animals.length`. Remember that arrays
    are zero-indexed, the index of the last element of an array is equivalent to the
    length of that array minus 1. If we tried to access an element at the index of
    `animals.length` we will have gone too far!


    With `for` loops, it’s easier for us to work with elements in arrays.


    ### Instructions


    1. Write a `for` loop that iterates through our `vacationSpots` array using `i`
    as the iterator variable.

