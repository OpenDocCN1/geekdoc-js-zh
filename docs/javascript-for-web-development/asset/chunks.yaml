    \ functions.\n\n• The  second  version uses  native  promise syntax\n\n• The \
    \ third  version  uses  async...await.\n\n![](Images/image04995.jpeg)Don’t worry\
    \ about understanding the  async...await  syntax— that’s what  you’ll learn  in\
    \  this lesson!  If you haven’t  already, type  node app.js  into  the  terminal\
    \ and press  enter. Then, press “Check Work”.\n\n![](Images/image04996.jpeg)\n\
    \n![](Images/image04997.jpeg)\n\n![](Images/image04998.jpeg)\n\n![](Images/image04999.jpeg)}\n\
    \nreadFiles();\n\nconst  fs  =  require('fs');\n\nconst  promisifiedReadfile \
    \ =  require('./promisifiedReadfile');\n\n// Here we use fs.readfile() and callback\
    \ functions:  fs.readFile('./file.txt',  'utf-8',  (err,  data)  =>  {\n\nif \
    \ (err)  throw  err;\n\nlet  firstSentence  =  data;\n\nfs.readFile('./file2.txt',\
    \  'utf-8', (err, data) => {  if  (err) throw  err;\n\nlet secondSentence = data;\
    \  console.log(firstSentence,  secondSentence);\n\n});\n\n});\n\n// Here we use\
    \ native promises with our \"promisified\" version of readfile:  let  firstSentence;\n\
    \npromisifiedReadfile('./file.txt',  'utf-8')\n\n.then((data) => {  firstSentence\
    \  =  data;\n\nreturn  promisifiedReadfile('./file2.txt',  'utf-8');\n\n})\n\n\
    .then((data)  =>  {\n\nlet secondSentence = data;  console.log(firstSentence,\
    \  secondSentence)\n\n})\n\n.catch((err)  =>  {console.log(err)});\n\n// Here\
    \ we use promisifiedReadfile() again but instead of using the native pro  mise\
    \  .then() syntax,  we  declare  and  invoke  an  async/await  function:\n\nasync\
    \  function  readFiles()  {\n\nlet firstSentence = await promisifiedReadfile('./file.txt',\
    \ 'utf-8');  let secondSentence = await promisifiedReadfile('./file2.txt', 'utf-8');\
    \  console.log(firstSentence,  secondSentence);\n\n}\n\n![](Images/image05000.jpeg)\n\
    \nThe  async  Keyword\n\nThe async  keyword is used to write functions that handle\
