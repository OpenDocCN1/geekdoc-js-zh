    ![](img/cover05089.jpeg)


    # 什么是 JavaScript？


    去年，我们社区的数百万学习者开始学习 JavaScript。为什么呢？JavaScript 主要被认为是大多数现代网络浏览器的语言，它早期的某些特性让它的声誉稍差。然而，这门语言一直在不断进化和改进。JavaScript
    现在是一门强大、灵活且快速的编程语言，正被用于日益复杂的 Web 开发及其他领域！


    由于 JavaScript 仍然是 Web 开发的核心，它通常是渴望学习和构建一切的自学编程者学习的第一门语言。我们非常期待你利用在这里获得的 JavaScript
    基础所创造出精彩的内容。JavaScript 驱动了大多数网站（包括本网站）的动态行为。


    在本节中，你将学习入门编程概念，包括数据类型和内置对象——这是所有职业开发人员必不可少的知识。请务必做好笔记并掌握节奏。这个基础将帮助你理解稍后会遇到的更复杂的概念。


    ![](img/image04554.jpeg)


    ## 控制台 (Console)


    控制台是一个为开发者显示重要信息（如错误）的面板。默认情况下，计算机对我们代码执行的大部分工作对我们来说是不可见的。如果我们想让屏幕上显示某些内容，可以直接向控制台打印（print）或记录（log）。


    在 JavaScript 中，`console` 关键字指的是一个对象，它是数据和动作的集合，我们可以在代码中使用它。关键字是 JavaScript 语言内置的单词，因此计算机会识别它们并对其进行特殊处理。


    `console` 对象中内置的一个动作（或方法）是 `.log()` 方法。当我们写 `console.log()` 时，我们放在括号内的内容将被打印或记录到控制台中。


    将值打印到控制台对我们非常有用，这样我们就可以看到自己正在工作。


    ```javascript

    console.log(5);

    ```

    这个示例向控制台记录了 5。分号 `;` 表示行或语句的结束。虽然在 JavaScript 中，你的代码通常会按预期运行而不需要分号，但我们建议养成在每个语句末尾加上分号的习惯，以免在少数需要分号的实例遗漏它们。


    你稍后会看到可以使用 `console.log()` 来打印不同类型的数据。


    ### 任务 1.

    1. 使用编辑器中的 `console.log` 代码将你的年龄记录到控制台中。

    2. 准备好查看结果后运行你的代码。


