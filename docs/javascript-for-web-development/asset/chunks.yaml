  trans: "\n\n![](img/image04665.jpeg) `function`, 使用 `console.log()` 将 `callMyNightSky()`\
    \ 的值打印到控制台。\n\n你会发现 `callMyNightSky()` 的函数块可以自由访问全局变量，因为这些变量在文件中的所有代码行都是可用的。\n\
    \n![](img/image04666.jpeg)\n\n# 块作用域 (Block Scope)\n\n我们将涵盖的范围是块作用域。当变量在块内部定义时，它只对大括号\
    \ `{}` 内部的代码可见。我们说该变量具有块作用域，因为它只对该块内的代码可见。\n\n使用块作用域声明的变量被称为局部变量，因为它们只对同一个块的代码可用。\n\
    \n块作用域的工作机制如下：\n\n![](img/image04667.jpeg)\n\n你会注意到：\n\n*   我们定义了一个函数 `logSkyColor()`。\n\
    *   在函数内部，`color` 变量只在函数的大括号内可用。\n*   如果我们尝试在函数外部打印同一个变量，将抛出 `ReferenceError`。\n\
    \n## 指令 1\n\n1. 在 `main.js` 中，定义一个函数 `logVisibleLightWaves()`。\n   Checkpoint\
    \ 2 已通过\n   卡住了？获取提示\n\n2. 在 `logVisibleLightWaves()` 函数内部，使用 `const` 创建变量 `lightWaves`\
    \ 并将其赋值为 `'Moonlight'`。\n   Checkpoint 3 已通过\n\n3. 在 `logVisibleLightWaves()`\
    \ 函数内部，`lightWaves` 变量下方添加一个 `console.log()` 语句，在函数运行时打印 `lightWaves` 变量的值。\n\
    \   Checkpoint 4 已通过\n   卡住了？获取提示\n\n4. 在函数外部调用 `logVisibleLightWaves()` 函数。\n\
    \   Checkpoint 5 已通过\n   卡住了？获取提示\n\n5. 在函数调用下方，从函数外部向控制台打印 `lightWaves` 的值。\n\
    \n你会发现它打印了 `ReferenceError`，因为该变量绑定在函数的块作用域上！\n\n![](img/image04668.jpeg)\n\n\
    # 作用域污染 (Scope Pollution)\n\n始终让你的变量变得可访问似乎是一个好主意，但在程序中拥有过全局变量可能会导致问题。\n\n当你声明全局变量时，它们会进入全局命名空间。全局命名空间允许变量从程序的任何地方被访问。这些变量一直存在那里直到程序结束，这意味着我们的全局命名空间可能会很快填满。\n\
    \n作用域污染是指全局命名空间中存在过多的全局变量，或者我们在不同作用域之间重复使用变量。\n\n作用域污染使得难以追踪不同的变量，并为潜在的事故埋下隐患。例如，全局作用域变量可能与局部作用域更小的变量发生冲突，导致代码出现意外行为。\n\
    \n让我们来看一个作用域污染的实践示例，以便知道如何避免它：\n\n![](img/image04669.jpeg)\n\n你会注意到：\n\n*   我们有一个变量\
    \ `num`。\n*   在 `logNum()` 的函数体内，我们想声明一个新变量，但忘记使用 `let` 关键字。\n*   当我们调用 `logNum()`\
    \ 时，`num` 被重新赋值为 `100`。\n*   `logNum()` 内部的重新赋值影响了全局变量 `num`。\n*   尽管重新赋值是被允许的且我们不会报错，但如果我们之后决定使用\
    \ `num`，我们将在不经意的情况下使用 `num` 的新值。\n\n虽然了解全局作用域非常重要，但最佳实践不在全局作用域中定义变量。\n\n## 指令\n\
    \n1. 让我们看看创建一个覆盖全局变量的变量会发生什么。在 `callMyNightSky()` 函数内部，在函数体的第一行，将变量 `stars` 赋值为\
    \ `'Sirius'`，如下：\n\n![](img/image04670.jpeg)\n   Checkpoint 2 已通过\n\n2. 在函数外部，在当前\
    \ `console.log()` 语句下方，添加另一个 `console.log()` 语句将 `stars` 打印到控制台。\n\n你会发现全局变量 `stars`\
    \ 被重新赋值为 `'Sirius'`。换句话说，我们改变了全局 `stars` 变量的值，但很难看出到底发生了什么。这在代码可维护性方面是糟糕的做法，并可能以我们无意的方式影响程序。\n\
    \n![](img/image04671.jpeg)\n\n# 实践良好的作用域化\n\n考虑到全局变量和作用域污染的挑战，我们应该遵循最佳实践，使用块作用域尽可能紧缩变量的作用域。\n\
    \n紧缩变量的作用域将从以下几个方面极大改进你的代码：\n\n*   它将使你的代码更易读，因为块会将你的代码组织成离散的部分。\n*   它让你的代码更易理解，因为它明确了哪些变量与程序的不同部分相关，而不是——\n\
    *   它将节省内存，因为变量只在块执行时存在。\n\n这里是另一个示例：\n\n![](img/image04672.jpeg)\n\n你会注意到：\n\n\
    *   我们在 `if` 语句内部创建了一个变量。\n*   在 `if` 语句之后，该变量不可用。\n*   在 `if` 块内部，该变量有一个值。\n\n\
    块作用域是 JavaScript 中一个强大的工具，因为它允许我们不污染命名空间。\n\n## 指令\n\n1. 在 `logVisibleLightWaves()`\
    \ 函数体内部，`region` 变量下方、提供的 `console.log()` 语句之前，创建一个 `if` 语句检查 `region` 是否为 `'Arctic'`。\n\
    \   Checkpoint 2 已通过\n   卡住了？获取提示\n\n2. 在 `if` 块内部，定义一个 `let` 变量 `lightWaves`\
    \ 并将其赋值为 `'Northern Lights'`。\n   Checkpoint 3 已通过\n\n3. 在 `if` 块内部，使用 `console.log()`\
    \ 打印 `lightWaves` 的值。\n\n运行你的代码并注意输出。在 `if` 块内部，变量可以工作。\n\n# 复习：作用域 (Scope)\n\n\
    在本节中，你学习了作用域以及它如何影响不同变量的可访问性。\n\n让我们回顾以下术语：\n\n*   作用域 (Scope) 是编程中的一个概念，某些变量从程序的其他部分可见/不可见。\n\
    *   块 (Blocks) 是存在于大括号 `{}` 内的语句。\n*   全局作用域 (Global scope) 指程序每个部分都可以访问的上下文。\n\
    *   全局变量 (Global variables) 是存在于全局作用域内的变量。\n*   块作用域 (Block scope) 指变量仅在其定义的块内可见的上下文。\n\
    *   局部变量 (Local variables) 是存在于块作用域内的变量。\n*   全局命名空间 (Global namespace) 是代码中包含全局范围信息的空间。\n\
    *   作用域污染 (Scope pollution) 指命名空间中存在过多变量或变量名被重复使用。\n\n# 数组 (Arrays)\n\n组织和存储数据是编程的基础概念。\n\
    \n在现实生活中组织数据的一种方式是制作列表。让我们在这里创建一个：\n\n新年愿望：\n\n1. 坚持写日记\n2. 去上鹰隼术课\n3. 学习杂耍\n\n"
- fmt: "\nLet’s now write this list in JavaScript, as an array:\n\n![](Images/image04674.jpeg)\n\
    \nArrays are JavaScript’s way of making lists. Arrays can store any data types\
    \ (including strings, numbers, and booleans). Like lists, arrays are ordered,\
    \ meaning each item has a numbered position.\n\nHere’s an array of the concepts\
    \ we’ll cover:\n\n![](Images/image04675.jpeg)\n\nBy the end of this lesson you’ll\
    \ have another tool under your belt that helps you manage chunks of data!\n\n\
    ![](Images/image04676.jpeg)\n\nRun the code to see what is logged to the console.\n\
    \n![](Images/image04677.jpeg)\n\n## Create an Array\n\nOne way we can create an\
    \ array is to use an array literal. An array literal creates an array by wrapping\
    \ items in square brackets `[]`. Remember from the previous exercise, arrays can\
    \ store any data type — we can have an array that holds all the same data types\
    \ or an array that holds different data types.\n\nLet’s take a closer look at\
    \ the syntax in the array example:\n\n*   The array is represented by the square\
    \ brackets `[]` and the content inside.\n*   Each content item inside an array\
    \ is called an element.\n*   There are three different elements inside the array.\n\
    *   Each element inside the array is a different data type.\n\nWe can also save\
    \ an array to a variable. You may have noticed we did this in the previous exercise:\n\
    \n![](Images/image04678.jpeg)\n\nLet’s practice by making an array of our own.\n\
    \n### Instructions 1\n1. Declare a variable using `const` named `hobbies` and\
    \ set it equal to an array with three strings inside of it.\n   * Checkpoint 2\
    \ Passed\n   * Stuck? Get a hint*\n2. Use `console.log()` to print `hobbies` to\
    \ the console.\n\n![](Images/image04679.jpeg)\n\n## Accessing Elements\n\nEach\
    \ element in an array has a numbered position known as its index. We can access\
    \ individual items using their index, which is similar to referencing an item\
    \ in a list based on the item’s position.\n\n![](Images/image04568.jpeg) Arrays\
    \ in JavaScript are zero-indexed, meaning the positions start counting from `0`\
    \ rather than `1`. Therefore, the first item in an array will be at position `0`.\
    \ Let’s see how we could access an element in an array:\n\nIn the code snippet\
    \ above:\n\n*   `cities` is an array that has three elements.\n*   We’re using\
    \ bracket notation, `[]` with the index after the name of the array to access\
    \ the element.\n*   `cities[0]` will access the element at index `0` in the array\
    \ `cities`. You can think of `cities[0]` as accessing the space in memory that\
    \ holds the string 'New York'.\n\nYou can also access individual characters in\
    \ a string using bracket notation and the index. For instance, you can write:\n\
    \n![](Images/image04680.jpeg)\n\nThe console will display `W` since it is the\
    \ character that is at index `6`.\n\n### Instructions 1\n1. Individual elements\
    \ in arrays can also be stored to variables.\n   Create a variable named `listItem`\
    \ and set it equal to the first item in the `famousSayings` array using square\
    \ bracket notation (`[]`).\n   Then use `console.log()` to print the `listItem`\
    \ variable to the console.\n   * Checkpoint 2 Passed\n   * Stuck? Get a hint*\n\
    2. Now, `console.log()` the third element in the `famousSayings` array using bracket\
    \ notation to access the element.\n   Do not save the element to a new variable\
    \ before you log it.\n\n![](Images/image04681.jpeg)\n![](Images/image04682.jpeg)\n\
    \n## Update Elements\n\nIn the previous exercise, you learned how to access elements\
    \ inside an array or a string by using an index. Once you have access to an element\
    \ in an array, you can update its value.\n\n![](Images/image04683.jpeg) In the\
    \ example above, the `seasons` array contained the names of the four.\n\nHowever,\
    \ we decided that we preferred to say 'Autumn' instead of 'Fall'.\n\nThe line,\
    \ `seasons[3] = 'Autumn';` tells our program to change the item at index `3` of\
    \ the `seasons` array to be 'Autumn' instead of what is already there.\n\n###\
    \ Instructions 1\n1. Change the second element of the array `groceryList` to 'avocados'.\n\
    \n![](Images/image04684.jpeg)\n\n## Arrays with let and const\n\nYou may recall\
