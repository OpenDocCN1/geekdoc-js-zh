  trans: "\n\n在 `for` 循环块内部，使用 `console.log()` 打印 `vacationSpots` 数组中字符串 `'I would\
    \ love to visit '` 之后的每个元素。例如，循环的第一轮应该在控制台打印 `'I would love to visit Bali'`。\n\
    \n![](img/image04715.jpeg)\n\n![](img/image04716.jpeg)\n\n## 嵌套循环\n\n当一个循环运行另一个循环内部时，我们称之为嵌套循环。嵌套\
    \ `for` 循环的一个用途是比较两个数组中的元素。对于外部 `for` 循环的每一轮，内部 `for` 循环都会完整运行。\n\n让我们来看一个嵌套 `for`\
    \ 循环的示例：\n\n![](img/image04717.jpeg)\n\n让我们思考一下示例嵌套循环中发生了什么。对于外层数组 `myArray` 中的每一个元素，内部循环都会完整运行，将外层数组的当前元素\
    \ `myArray[i]` 与内部数组中的每个元素 `yourArray[j]` 进行比较。当找到匹配项时，它会在控制台打印一个字符串。\n\n现在轮到你来编写嵌套循环了！\n\
    \n### 指示\n\n1. 想象你是一个社交媒体平台的大牛程序员！你被指派构建一个共同粉丝程序的原型。你需要从两个模拟用户处获取两个“朋友”数组，以便提取在两个列表中都存在的粉丝的名称。创建一个名为\
    \ `bobsFollowers` 的变量，并将其设置为包含四个字符串的数组，代表 Bob 的朋友的名字。\n    Checkpoint 2 Passed\n\
    \n2. 创建一个名为 `tinasFollowers` 的变量，并将其设置为包含三个字符串的数组，代表 Tina 的朋友的名字。确保其中恰好有两个与 `bobsFollowers`\
    \ 数组中的两个朋友相同。\n    Checkpoint 3 Passed\n\n3. 创建第三个名为 `mutualFollowers` 的变量，并将其设置为空空数组。\n\
    \    Checkpoint 4 Passed\n\n4. 创建一个嵌套循环，以 `bobsFollowers` 为外层循环数组，以 `tinasFollowers`\
    \ 为内循环数组。如果外层循环的当前元素与内循环的当前元素相同，则将该元素推入 `mutualFollowers` 数组中。\n\n![](img/image04718.jpeg)\n\
    \n## While 循环\n\n你做得很棒！我们将教你另一种循环：`while` 循环。首先，让我们把 `for` 循环转换为 `while` 循环：\n\
    \n![](img/image04719.jpeg)\n\n![](img/image04720.jpeg)让我们分解一下我们循环语法的含义：\n\n![](img/image04721.jpeg)\n\
    * 我们的变量在循环之前声明。由于它在全局作用域中，我们可以在循环中访问它。\n* 我们使用关键字 `while` 开始循环，后面紧跟我们的停止条件（或测试条件）。这将在循环的每一轮之前进行评估。只要条件评估为\
    \ `true`，代码块就会继续运行。一旦评估为 `false`，循环将停止。\n* 接下来，是我们的循环代码块，它向控制台打印 `counterTwo`\
    \ 并增加 `counterTwo`。\n\n如果我们不在代码块内部增加 `counterTwo` 会发生什么呢？如果不包含此项，`counterTwo`\
    \ 将始终保持其初始值 `1`。这意味着测试条件 `counterTwo < 4` 将始终评估为 `true`，我们的循环将永远不会停止运行！这被称为**死循环**，是我们总是想要避免的。死循环可能会占用你计算机所有的处理能力，可能导致电脑死机。\n\
    \n所以你可能会问什么时候使用 `while` 循环！当我们知道循环应该运行多少次时，`for` 循环的语法是理想的，但我们并不总是提前知道。把吃饭想象成一个\
    \ `while` 循环：当你开始吃时，你不知道吃饱具体需要多少口。相反地，你会在饥饿时一直吃。在希望循环执行不确定次数的情况下，`while` 循环是最佳选择。\n\
    \n### 指示\n\n1. 在 `cards` 数组下方，使用 `let` 关键字声明变量 `currentCard`，但不要给它赋值。\n    Checkpoint\
    \ 2 Passed\n\n卡住了？获取提示\n\n2. 创建一个 `while` 循环，其条件检查 `currentCard` 的值是否为 `'spade'`。在你的\
    \ `while` 循环代码块内部，添加以下代码行：\n\n```\ncurrentCard = cards[Math.floor(Math.random()\
    \ * 4)];\n```\n`Math.floor(Math.random() * 4)` 将给我们一个 0 到 3 之间的随机数。我们将使用这个数字作为\
    \ `cards` 数组的索引，并将数组中一个随机元素的值赋值给 `currentCard`。\n    Checkpoint 3 Passed\n\n卡住了？获取提示\n\
    \n3. 太棒了！你的循环正在运行，但你看不出来因为它没有任何输出。让我们在 `while` 块中添加一个 `console.log()` 语句。在块内部，在你为\
    \ `currentCard` 分配新值后，将 `currentCard` 打印到控制台。\n\n为了好玩，你可以运行几次代码看看输出如何变化！\n\n![](img/image04722.jpeg)\n\
    \n## do...While 语句\n\n在某些情况下，你希望一段代码至少运行一次，然后在初始运行后根据特定条件进行循环。这就是 `do...while`\
    \ 语句大显用场的地方。\n\n`do...while` 表示执行一次任务，直到指定的条件不再满足为止一直保持执行。`do...while` 的语法如下：\n\
    \n![](img/image04723.jpeg)\n在这个示例中，代码块通过将变量 `i` 的字符串附加到 `countString` 变量中来修改它。首先，执行一次代码块。然后评估条件。如果条件评估为\
    \ `true`，则块将再次执行。当条件评估为 `false` 时，循环停止。\n\n注意 `while` 和 `do...while` 是不同的！与 `while`\
    \ 循环不同，`do...while` 至少运行一次。\n\n![](img/image04724.jpeg)\n\n1. 我们想让程序模拟制作蛋糕的过程。。根据配方，需要的糖杯数不同。创建变量\
    \ `cupsSugarNeeded` 并为其赋值一个数字。糖必须一次一次加入面糊中。声明变量 `cupsAdded` 并将其赋值为 0。\n    Checkpoint\
    \ 2 Passed\n\n2. 我们喜欢甜食，所以即使 `cupsSugarNeeded` 为 0，我们也想向面糊中添加至少一杯糖。创建一个 `do...while`\
    \ 循环，当 `cupsAdded` 小于 `cupsSugarNeeded` 时，让 `cupsAdded` 加 1。\n\n![](img/image04725.jpeg)\n\
    \n## break 关键字\n\n想象我们正在领养一只狗。我们计划每年都去一次收容所，然后放弃。但如果我们在第 65 天遇到了梦想中的狗呢？我们不想仅仅因为原始计划是去一整年，就在接下来的\
    \ 300 天里继续去收容所。在代码中，当我们希望在循环编写的原始停止条件尚未满足的情况下停止循环继续执行时，可以使用关键字 `break`。\n\n`break`\
