  trans: "\n\n# 循环\n\n循环是在满足特定条件之前重复执行代码块的编程工具。我们学习了如何使用数字索引来遍历数组，但对象中的键值对是无序的！[JavaScript\
    \ 已经](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\
    \ [通过 for...in 语法为我们提供了另一种遍历遍历对象的替代方案，即使用](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\
    \ [for...in 语法](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)。\n\
    \n`for...in` 将为对象中的每个属性执行特定的代码块。\n\n![](img/image0480.jpeg)\n\n```javascript\n\
    let spaceship = {\n  crew: {\n    captain: {\n      name: 'Lily',\n      degree:\
    \ 'Computer Engineering',\n      cheerTeam() { console.log('You got this!') }\n\
    \    },\n    'chief officer': {\n      name: 'Dan',\n      degree: 'Aerospace\
    \ Engineering',\n      agree() { console.log('I agree, captain!') }\n    },\n\
    \    medic: {\n      name: 'Clementine',\n      degree: 'Physics',\n      announce()\
    \ { console.log(`Jets on!`) }\n    },\n    translator: {\n      name: 'Shauna',\n\
    \      degree: 'Conservation Science',\n      powerFuel() { console.log('The tank\
    \ is full!') }\n    }\n  }\n};\n\n// for...in\nfor (let crewMember in spaceship.crew)\
    \ {\n  console.log(`${crewMember}: ${spaceship.crew[crewMember].name}`);\n}\n\
    ```\n\n我们的 `for...in` 将遍历 `spaceship.crew` 对象的每一个元素。在每次迭代中，变量 `crewMember` 会被设置为\
    \ `spaceship.crew` 的键之一，使我们能够打印出船员的角色和姓名列表。\n\n### 指示\n\n1. 使用 `for...in` 遍历代码编辑器中的\
    \ `spaceship.crew` 对象，并使用 `console.log()` 打印如下格式的船员角色和姓名列表：`'[船员角色]: [船员姓名]'`，例如\
    \ `'chief officer: Dan'`。\n\n**通过检查点 2**\n*卡住了？获取提示*\n\n2. 使用 `for...in` 遍历代码编辑器中的\
    \ `spaceship.crew` 对象，并使用 `console.log()` 打印如下格式的船员姓名和专业列表：`'[船员姓名]: [船员专业]'`，即\
    \ `'Lily: Computer Engineering'`。\n\n![](img/image04810.jpeg)\n![](img/image04811.jpeg)\n\
    \n# 复习\n\n干得好！你已经在理解 JavaScript 对象机制的正确道路上了。通过构建自己的对象，你将更好地理解 JavaScript 内置对象的工作原理。你也可以开始想象将代码组织成对象，并在代码中模拟现实世界的事。\n\
    \n让我们复习一下本课学到的：\n\n* 对象存储键值对的集合。\n* 每个键值对都是一个属性——当属性是一个函数时，它被称为方法。\n* 对象字面量由花括号括起的逗号分隔的键值对组成。\n\
    * 你可以使用点符号表示（dot notation）或中括号表示（bracket notation）访问、添加或编辑对象中的属性。\n* 我们可以使用键值语法配合匿名函数表达式作为值，或者使用新的\
    \ ES6 方法语法来为对象字面量添加方法。\n* 我们可以通过链式操作符遍历复杂的嵌套对象。\n* 对象是可变的——即使使用 `const` 声明对象，我们也可以更改它们的属性。\n\
    * 对象是按引用传递的——当我们对传入函数的对象进行更改时，这些更改是永久的。\n* 我们可以使用 `For...in` 语法遍历对象。\n\n# 进阶对象介绍\n\
    \n记住，JavaScript 中的对象是存储数据和功能的容器。在本节中，我们将基于创建对象的基础知识，探索一些进阶概念。\n\n那么，如果没有异议，让我们学习更多关于对象的知识！在本节中，我们将涵盖以下主题：\n\
    \n* 如何使用 `this` 关键字。\n* 在 JavaScript 方法中实现私有性。\n* 在对象中定义 `getters`（get 器）和 `setters`（赋值）。\n\
    * 创建工厂函数。\n* 使用解构技术。\n\n![](img/image04812.jpeg)\n![](img/image04813.jpeg)\n\n\
    ## this 关键字\n\n![](img/image04814.jpeg)\n对象是相关数据和功能的集合。我们将这些功能存储在对象的方法中：方法\n\n\
    ![](img/image04815.jpeg)\ngoat 上的方法。我们可以调用\n\n```javascript\ngoat.makeSound();\
    \ // 打印 baaa\n```\n\n太棒了，我们有了一个可以在控制台打印 baaa 的羊对象。一切看起来都运行正常。如果我们想给羊对象添加一个名为 `.diet()`\
    \ 的新方法呢？\n\n![](img/image04816.jpeg)\n![](img/image04817.jpeg)\n这太奇怪了，为什么是 undefined？这是因为在\
    \ `diet()` 的作用域内，我们无法访问 `goat`。这就是 `this` 关键字大显身手的地方。如果我们使用 `this`，那么 `diet()`\
    \ 就是调用对象。\n\n```javascript\ngoat.diet();\n```\n\n### 指示\n\n1. 让我们练习一下 `this`。在\
    \ `main.js` 中有一个对象，添加一个属性 `model` 并将其赋值为 `robot`。再添加另一个属性 `energyLevel` 并将其赋值为\
    \ `100`。\n\n**通过检查点 2**\n*卡住了？获取提示*\n\n2. ![](img/image04819.jpeg)\n在对象内部，添加一个名为\
    \ `provideInfo` 的方法。在 `provideInfo()` 的体内，使用插值返回以下字符串：`I am ${model} and my current\
    \ level is ${energyLevel}`。将 `model` 和 `energyLevel` 替换为调用对象的属性。\n\n**通过检查点 3**\n\
    *卡住了？获取提示*\n\n3. 现在检查 `provideInfo()` 是否可以访问内部属性。打印对 `robot` 调用 `provideInfo()`\
    \ 的结果。\n\n```javascript\nrobot.provideInfo();\n```\n\n## 箭头函数与 this\n\n我们在上一个练习中看到，对于方法，调用对象就是方法所属的对象。如果我们在方法中使用\
    \ `this` 关键字，那么 `this` 的值就是调用对象。然而，当我们开始使用箭头函数作为方法时，情况就会变得复杂一些。看下面的示例：\n\n![](img/image04821.jpeg)\n\
    ![](img/image04822.jpeg)\n在注释中，你可以看到它会打印 undefined。那么发生了什么？注意 `diet()` 是使用箭头函数定义的。箭头函数本质上会绑定（或固定）一个已经定义的\
    \ `this` 值到函数本身，而该不是调用对象。在上面的代码段中，`this` 的值是全局对象（或存在于全局作用域中的对象），它没有 `dietType`\
    \ 属性，因此返回 undefined。\n\n要了解更多关于箭头函数或全局对象的知识，请查阅 MDN 关于[全局对象](https://developer.mozilla.org/en-US/docs/Glossary/Global_object)\
    \ 和[箭头函数](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions)\
    \ 的文档。\n\n上述示例的关键结论是：在方法中使用 `this` 时，要避免使用箭头函数。\n\n### 指示\n\n1. 目前 `checkEnergy()`\
    \ 方法没有产生正确的输出，因为它使用了箭头函数语法。重构或更改该方法以使用函数表达式。你可以使用长格式或简写格式编写该函数。\n\n"
- fmt: "\nAfter refactoring the method, notice that `.checkEnergy()` has access to\
    \ the other internal properties of the `robot` object.\n\n![](Images/image04823.jpeg)\n\
    \n![](Images/image04824.jpeg)\n\n## Privacy\n\nAccessing and updating properties\
    \ is fundamental in working with objects. However, there are cases in which we\
    \ don’t want other code simply accessing and updating an object’s properties.\
    \ When discussing privacy in objects, we define it as the idea that only certain\
    \ properties should be mutable or able to change in value.\n\n![](Images/image04825.jpeg)![](Images/image04825.jpeg)Certain\
    \ languages have privacy built-in for objects, but JavaScript does not have this\
    \ feature. Rather, JavaScript developers follow naming conventions that signal\
    \ to other developers how to interact with a property. One common convention is\
    \ to place an underscore `_` before the name of a property to mean that the property\
    \ should not be altered. Here’s an example of using `_` to prepend a property.\n\
    \n![](Images/image04826.jpeg)\n```javascript\nconst bankAccount = {\n  _amount:\
    \ 1000\n}\n```\n\nIn the example above, the `_amount` is not intended to be directly\
    \ manipulated.\n\nEven so, it is still possible to reassign `_amount`:\n\n```javascript\n\
    bankAccount._amount = 1000000;\n```\n\nIn later exercises, we’ll cover the use\
    \ of methods called getters and setters. Both methods are used to respect the\
    \ intention of properties prepended, or began, with `_`. Getters can return the\
    \ value of internal properties and setters can safely reassign property values.\
    \ For now, let’s see what happens if we can change properties that don’t have\
    \ setters or getters.\n\n### Instructions 1\n\n1. Below the `robot` object, reassign\
    \ the `_energyLevel` property to `'high'`.\n\nCheckpoint 2 Passed\nStuck? Get\
    \ a hint\n\n\n\n2. Now take a look at the new `recharge` method in `robot`. `.recharge()`\
    \ will add 30 to `_energyLevel`.\n\nWhat will happen now that `_energyLevel` isn’t\
    \ a number? Call `.recharge()` on `robot` to find out.\n\nNotice that a funky\
    \ string is printed to the console! This is known as a side-effect of type-coercion.\
    \ No need to worry about what this means for now, but it’s important to understand\
    \ that you can cause unwanted side-effects when mutating objects and their properties.\n\
    \n![](Images/image04827.jpeg)\n\n## Getters\n\nGetters are methods that get and\
    \ return the internal properties of an object. But they can do more than just\
    \ retrieve the value of a property! Let’s take a look at a getter method:\n\n\
    ![](Images/image04828.jpeg)\n\n![](Images/image04829.jpeg)\n\nNotice that in the\
    \ getter method above:\n\n![](Images/image04830.jpeg)\n* We use the `get` keyword\
    \ followed by a function.\n* We use an `if` conditional to check if both and `_lastName`\
    \ exist (by making sure they both return truthy values) and then return a different\
    \ value depending on the result.\n* We can access the calling object’s internal\
    \ properties using `this`.\n\nIn `fullName`, we’re accessing both `this._firstName`\
    \ and `this._lastName`.\n* In the last line we call `fullName` on `person`. In\
    \ general, getter methods do not need to be called with a set of parentheses.\
    \ Syntactically, it looks like we’re accessing a property.\n\nNow that we’ve gone\
    \ over syntax, let’s discuss some notable advantages of using getter methods:\n\
    \n* Getters can perform an action on the data when getting a property.\n* Getters\
    \ can return different values using conditionals.\n* In a getter, we can access\
    \ the properties of the calling object using `this`.\n* The functionality of our\
    \ code is easier for other developers to understand.\n\nAnother thing to keep\
    \ in mind when using getter (and setter) methods is that properties cannot share\
    \ the same name as the getter/setter function. If we do so, then calling the method\
    \ will result in an infinite call stack error.\n\nOne workaround is to add an\
    \ underscore before the property name like we did in the example above.\n\nGreat,\
    \ let’s go getter!\n\n### Instructions 1\n\n1. In `robot`, create a getter method\
    \ named `energyLevel` using the `get` keyword. Leave function body blank for now.\n\
    \nCheckpoint 2 Passed\nStuck? Get a hint\n\n2. Inside the getter method, add an\
    \ `if` statement to check if `this._energyLevel` is a number using the `typeof`\
    \ operator. If that condition is truthy, return `'My current energy level is ENERGYLEVEL'`.\n\
    \nReplace `ENERGYLEVEL` with the value of `this._energyLevel`.\nMake sure you\
    \ return the string and not logging it to the console.\n\nCheckpoint 3 Passed\n\
    Stuck? Get a hint\n\n3. If `this._energyLevel` isn’t a number, it could be that\
    \ the `energyLevel` property was altered. Let’s add a default return. Add an `else`\
    \ that returns `'System cannot retrieve level'`.\n\nCheckpoint 4 Passed\nStuck?\
    \ Get a hint\n\n4. Log the result of calling the getter method `energyLevel` on\
    \ `robot` to the console.\n\nCheckpoint 5 (implied)\n\n## Setters\n\nAlong with\
    \ getter methods, we can also create setter methods which reassign values of an\
    \ object. Let’s see an example of a setter:\n\n![](Images/image04830.jpeg)\n\n\
    Notice that in the above:\n* We can perform a check for what value is assigned\
    \ to `this._age`.\n* When we use the setter method, only values that are numbers\
    \ reassign `this._age`.\n* There are different outputs depending on what is used\
    \ to set.\n\nSetter methods like `age` do not need to be called with a set of\
    \ parentheses. Syntactically, it looks like we’re reassigning the value of a property.\n\
    \nNonetheless, even with a setter method, it is still possible to directly reassign\
    \ properties. For example, in the example above, we can still set `._age` directly:\n\
    \n![](Images/image0485.jpeg)\n\n1. Currently, in `robot` there is a getter method\
    \ for `numOfSensors` but no setter method! What if we need to add or remove sensors?\
    \ Let’s fix that. Add a setter method named `numOfSensors` using the `set` keyword.\
    \ Provide a parameter `num`. Leave the function body empty for now.\n\nCheckpoint\
    \ 2 Passed (implied)\n\n2. There are a couple of things we should do in the setter\
    \ method:\n* Add a check to see if `num` is a number using the `typeof` operator.\n\
    * `num` should also be greater than or equal to 0.\n* If both conditions are met,\
    \ reassign `this._numOfSensors` to `num`.\n\nCheckpoint 3 Passed (implied)\n\n\
    3. Now add an `else` that logs `'Pass in a number that is greater than or equal\
    \ to 0'` to the console.\n\nCheckpoint 4 Passed\n\n4. Use the `numOfSensors` setter\
    \ method on `robot` to assign `_numOfSensors` to 100.\n\nCheckpoint 5 Passed\n\
    \n## Factory Functions\n\nSo far we’ve been creating objects individually, but\
    \ there are times where we  weant to create many instances of an object quickly.\
    \ Here’s where factory functions come in. A real world factory manufactures multiple\
    \ copies of an item quickly and on a massive scale. A factory function is a function\
    \ that returns an object and can be reused to make multiple object instances.\n\
    \nFactory functions can also have parameters allowing us to customize the object\
    \ that gets returned.\n"
  raw: "After refactoring  the  method, notice  that  .checkEnergy()  has  access\
    \  to  the  other internal properties of the  robot  object.\n\n![](Images/image04823.jpeg)\n\
    \n![](Images/image04824.jpeg)\n\nPrivacy\n\nAccessing and updating properties\
    \ is fundamental in working with objects.  However, there are cases in which we\
    \ don’t want other code simply  accessing and updating an object’s properties.\
    \ When discussing privacy in  objects, we define it as the idea that only certain\
    \ properties should be  mutable  or  able to change in value.\n\n![](Images/image04825.jpeg)![](Images/image04825.jpeg)Certain\
    \ languages have privacy built-in for objects, but JavaScript does not  have this\
    \ feature. Rather, JavaScript developers follow naming conventions  that signal\
    \ to other developers how to interact with a property. One  common convention\
    \ is to place an underscore  _  before the name of a  property to mean that the\
    \ property should not be altered. Here’s an  example of using  _  to  prepend\
    \ a  property.\n\n![](Images/image04826.jpeg)const  bankAccount  =  {\n\n_amount:\
    \  1000\n\n}\n\nIn  the  example  above, the  _amount  is  not intended  to be\
    \ directly  manipulated.\n\nEven  so, it is  still possible to  reassign  _amount:\n\
    \nbankAccount._amount  =  1000000;\n\nIn later exercises, we’ll cover the use\
    \ of methods called getters and setters.  Both methods are used to respect the\
    \ intention of properties prepended, or  began, with  _. Getters can return the\
    \ value of internal properties and setters  can safely reassign property values.\
    \ For now, let’s see what happens if we  can  change properties that  don’t have\
    \ setters or getters.\n\nInstructions  1.\n\nBelow  the robot  object, reassign\
    \ the  _energyLevel  property to  'high'.\n\n Checkpoint 2 Passed\n\nStuck?  Get\
