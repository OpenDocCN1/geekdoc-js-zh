    # Await Promise.all()


    当我们有多个可以同时执行的 promise 时，利用并发性的另一种方法是 `await` 一个 `Promise.all()`。


    我们可以将 promise 数组作为参数传递给 `Promise.all()`，它将返回单个 promise。当参数数组中的所有 promise 都解析后，该
    promise 将被解析。该 promise 的解析值将是一个包含参数数组中每个 promise 解析值的数组。


    ![](img/image05030.jpeg)


    在上面的示例中，我们 `await` `Promise.all()` 的解析。


    此 `Promise.all()` 调用时传入了一个包含四个 promise（从引入的函数返回）的参数数组。接下来，我们遍历 `resultArray`，并将每个项目打印到控制台。`resultArray`
    中的第一个元素是 `asyncTask1()` promise 的解析值，第二个是 `asyncTask2()` promise 的值，依此类推。


    `Promise.all()` 允许我们利用异步性——四个异步任务中的每一个都可以并发处理。`Promise.all()` 还有一个快速失败的优点，意味着一旦其中任何一个被拒绝，它将不会等待其他异步操作完成。一旦数组中的第一个
    promise 被拒绝，`Promise.all()` 返回的 promise 将以该原因被拒绝。与处理原生 promise 时一样，如果需要多个异步任务，但它们在执行之前不需要等待任何其他任务，`Promise.all()`
    是一个很好的选择。


