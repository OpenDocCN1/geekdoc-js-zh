    ### 3.

    Add a break inside your loop’s block that breaks out of the loop if the element
    at the current index in the `rapperArray` is ''Notorious B.I.G.''.


    ![](Images/image04733.jpeg)

    ![](Images/image04734.jpeg)


    ## Review

    Great job! In this lesson, we learned how to write cleaner code with loops. You
    now know:


    ![](Images/image04735.jpeg)

    - Loops perform repetitive actions so we don’t have to code that process manually
    every time.

    - How to write

    - How to use a loops with an iterator variable that increments or decrements loop
    to iterate through an array

    - A nested `for` loop is a loop inside another loop

    - `while` loops allow for different types of stopping conditions

    - Stopping conditions are crucial for avoiding infinite loops.

    - `do...while` loops run code at least once——only checking the stopping condition
    after the first execution

    - The `break` keyword allows programs to leave a loop during the execution of
    its block.


    ## Introduction

    We are often unaware of the number of assumptions we make when we communicate
    with other people in our native languages. If we told you to “count to three,”
    we would expect you to say or think the numbers one, two and three. We assumed
    you would know to start with “one” and end with “three”. With programming, we’re
    faced with needing to be more explicit with our directions to the computer. Here’s
    how we might tell the computer to “count to three”:


    ![](Images/image04736.jpeg)


    When we speak to other humans, we share a vocabulary that gives us quick ways
    to communicate complicated concepts. When we say “bake”, it calls to mind a familiar
    subroutine—preheating an oven, putting something into an oven for a set amount
    of time, and finally removing it. This allows us to abstract away a lot of the
    details and communicate key concepts more concisely. Instead of listing all those
    details, we can say, “We baked a cake,” and still impart all that meaning to you.


    In programming, we can accomplish “abstraction” by writing functions. In addition
    to allowing us to reuse our code, functions help to make clear, readable programs.
    If you encountered `countToThree()` in a program, you might be able to quickly
    guess what the function did without having to stop and read the function’s body.


    We’re also going to learn about another way to add a level of abstraction to our
    programming: higher-order functions. Higher-order functions are functions that
    accept other functions as arguments and/or return functions as output. This enables
    us to build abstractions on other abstractions, just like “We hosted a birthday
    party” is an abstraction that may build on the abstraction “We made a cake.”


    In summary, using more abstraction in our code allows us to write more modular
    code which is easier to read and debug.


    ## Functions as Data

    JavaScript functions behave like any other data type in the language; we can assign
    functions to variables, and we can reassign them to new variables.


    Below, we have an annoyingly long function name that hurts the readability of
    any code in which it’s used. Let’s pretend this function does important work and
    needs to be called repeatedly!


    ![](Images/image04737.jpeg)


    What if we wanted to rename this function without sacrificing the source code?
    We can re-assign the function to a variable with a suitably short name:


    ![](Images/image04738.jpeg)

    is a variable that holds a reference to our original function. If we could look
    up the address in memory of `busy` and the address in memory of `announceThatIAmDoingImportantWork`
    they would point to the same place. Our new `busy()` function can be invoked with
    parentheses as if that was the name we originally gave our function.


    Notice how we assign `announceThatIAmDoingImportantWork` without parentheses as
    the value to the `busy` variable. We want to assign the value of the function
    itself, not the value it returns when invoked.


    In JavaScript, functions are first class objects. This means that, like other
    objects you’ve encountered, JavaScript functions can have properties and methods.


    Since functions are a type of object, they have properties such as `.length` and
    `.name` and methods such as `.toString()`. You can see more about the methods
    and properties of functions [in the documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function).


    ### Practice

    Functions are special because we can invoke them, but we can still treat them
    like any other type of data. Let’s get some practice doing that!


    **Instructions 1.**

    We’ve defined a function with a very long name: `checkThatTwoPlusTwoEqualsFourAMillionTimes`.
    This function takes a long time to execute. It checks whether `2 + 2 = 4`, but
    it does it a million times (just to be really sure!). Create a shorter-named variable,
    `is2p2` that will be easier to work with, and assign `checkThatTwoPlusTwoEqualsFourAMillionTimes`
    as its value.


    Checkpoint 2 Passed


    Stuck? Get a hint


    **2.**

    Invoke your


    ![](Images/image04739.jpeg)

    function


    Checkpoint 3 Passed


    Stuck? Get a hint


    **3.**

    ![](Images/image04740.jpeg)Hmmm, if we forgot the original name of our function,
    is there a way we could figure it out? Use `console.log()` the `name` property
    of the function we assigned to `is2p2`. Check out [the documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function)
    if you need a hint.


    ![](Images/image04741.jpeg)


    ## Functions as Parameters

    Since functions can behave like any other type of data in JavaScript, it might
    not surprise you to learn that we can also pass functions (into other functions)
    as parameters. A higher-order function is a function that either accepts functions
    as parameters, returns a function, or both! We call the functions that get passed
    in callback functions because they get called during the execution of the higher-order
    function.


    When we pass a function in as argument to another function, we don’t invoke it.
    Invoking the function would evaluate to the return value of that function. With
    callbacks, we pass in the function itself by typing the function name without
    the parentheses (that would evaluate to the result of calling the function):


    ![](Images/image0742.jpeg)


    We wrote a higher-order function, `timeFuncRuntime()`. It takes in a function
    as an argument, saves a starting time, invokes the callback function, records
    the time after the function was called, and returns the time the function took
    to run by subtracting the starting time from the ending time.


    This higher-order function could be used with any callback function which makes
    it a potentially powerful piece of code.


    We then invoked `timeFuncRuntime()` first with the `addOneToOne()` function -
    note how we passed in `addOneToOne` and did not invoke it.


    ![](Images/image0743.jpeg)


    In this example, we invoked `timeFuncRuntime()` with an anonymous function that
    counts backwards from 10. Anonymous functions can be arguments too!


    **Instructions 1.**

    Save a variable, `time2p2`. Assign as its value the result of invoking the `timeFuncRuntime()`
    function with the `checkThatTwoPlusTwoEqualsFourAMillionTimes()` function.

