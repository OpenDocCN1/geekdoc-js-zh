    ## 复习


    太棒了，掌握了 `async...await` 语法！让我们复习一下学到的：


    - `async...await` 是基于原生 JavaScript promise 和生成器的语法糖。

    - 我们使用关键字 `async` 声明一个 `async` 函数。

    - 在 `async` 函数内部，我们使用 `await` 运算符暂停函数的执行，直到异步操作完成且被等待的 promise 不再处于等待状态。

    - `await` 返回被等待的 promise 的解析值。

    - 我们可以编写多个 `await` 语句，使代码读起来像同步代码。

    - 我们在 `async` 函数中使用 `try...catch` 语句进行错误处理。

    - 我们仍然应该通过编写 `async` 函数来利用并发性，尽可能让异步操作并发发生。


    ## 请求简介


    你是否想过点击网页上的“提交（Submit）”按钮后会发生什么？例如，如果你正在提交信息，信息会去向哪里？信息是如何处理的？上述问题的答案围绕着 HTTP
    请求。


    HTTP 请求有许多类型。最常用的四种 HTTP 请求是 `GET`、`POST`、`PUT` 和 `DELETE`。在本节中，我们将涵盖 `GET` 和
    `POST` 请求。如果你想了解更多不同的 HTTP 请求，我们推荐以下文档：


    - [Mozilla Developer Network: HTTP methods](https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods)


    通过 `GET` 请求，我们从某些源（通常是网站）检索或获取信息。对于 `POST` 请求，我们将信息发送到一个会处理信息并将其传回的源。


    在本节中，我们将解释如何使用 JavaScript 的 `XHR` 对象发送 `GET` 和 `POST` 请求。我们还将请求中包含查询字符串。


    我们将使用 Datamuse API 进行 `GET` 请求，使用 Rebrandly URL 缩短器 API 进行 `POST` 请求。要完成关于 `POST`
    的练习，请确保按照下方文章中的说明创建一个 Rebrandly API Key：


    - [Codecademy Articles: Rebrandly URL Shortener API](https://www.codecademy.com/articles/rebrandly-signup)


