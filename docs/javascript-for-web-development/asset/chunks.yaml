    2. Without changing lines 1 - 6, add a `numEngines` property with a numeric value
    between 1 and 10 to the `spaceship` object.

    Checkpoint 3 Passed

    *Stuck? Get a hint


    3. ![](Images/image04791.jpeg) Use the `delete` operator to remove the `''Secret
    Mission''` property from the `spaceship` object.

    ![](Images/image04792.jpeg)


    ## Methods


    When the data stored on an object is a function we call that a method. A property
    is what an object has, while a method is what an object does.


    Do object methods seem familiar? That’s because you’ve been using them all along!
    For example `console` is a global javascript object and `.log()` is a method on
    that object. `Math` is also a global javascript object and `.floor()` is a method
    on it.


    We can include methods in our object literals by creating ordinary, comma-separated
    key-value pairs. The key serves as our method’s name, while the value is an anonymous
    function expression.


    ![](Images/image04793.jpeg)

    ![](Images/image04794.jpeg)


    With the new method syntax introduced in ES6 we can omit the colon and the `function`
    keyword.


    ![](Images/image04795.jpeg)


    Object methods are invoked by appending the object’s name with the dot operator
    followed by the method name and parentheses:


    ![](Images/image04796.jpeg)


    1. Below the `retreatMessage` variable in the code editor, create an `alienShip`
    object. It should contain a method `.retreat()` which will `console.log()` the
    `retreatMessage`.

    Checkpoint 2 Passed

    *Stuck? Get a hint


    2. Add another method to your object literal. This method, `.takeOff()`, should
    `console.log()` the string `''Spim... Borp... Glix... Blastoff!''`.

    Checkpoint 3 Passed

    *Stuck? Get a hint


    3. Invoke your two methods: first `.retreat()` then `.takeOff()`.

    ![](Images/image04797.jpeg)

    ![](Images/image04798.jpeg)


    ## Nested Objects


    In application code, objects are often nested— an object might have another object
    as a property which in turn could have a property that’s an array of even more
    objects!


    In our `spaceship` object, we want a `crew` object. This will contain all the
    crew members who do important work on the craft. Each of those crew members are
    objects themselves. They have properties like `name`, and `degree`, and they each
    have unique methods based on their roles. We can also nest other objects in the
    `spaceship` such as a `telescope` or nest details about the `spaceship’s` computers
    inside a parent `nanoelectronics` object.


    ![](Images/image04799.jpeg)

    ![](Images/image04800.jpeg)


    We can chain operators to access nested properties. We’ll have to pay attention
    to which operator makes sense to use in each layer. It can be helpful to pretend
    you are the computer and evaluate each expression from left to right so that each
    operation starts to feel a little more manageable.


    ![](Images/image04801.jpeg)


    In the preceding code:


    * First the computer evaluates `spaceship.nanoelectronics`, which results in an
    object containing the `back-up` and `computer` objects.

    * We accessed the `back-up` object by appending `[''back-up'']`.

    * The `back-up` object has a `battery` property, accessed with `.battery` which
    returned the value stored there: `''Lithium''`.


