  trans: "\n\n- 如果条件求值为为假，则执行第二个表达式。\n\n与 `if...else` 语句一样，三元运算符也可用于求值为真或为假的条件。\n\n\
    ### 指令\n\n1.\n重构或编辑第一个 `if...else` 块，以使用三元运算符。\n\n检查点 2 通过\n卡住了？获取提示\n\n2.\n重构第二个\
    \ `if...else` 块，以使用三元运算符。\n\n检查点 3 通过\n卡住了？获取提示\n\n3.\n重构第三个 `if...else` 块，以使用三元运算符。\n\
    \n![](img/image04625.jpeg)\n\n## Else If 语句\n\n我们可以通过 `else if` 语句向 `if...else`\
    \ 语句中添加更多条件。\n\n`else if` 语句允许出现两种以上的可能结果。你可以根据需要添加尽可能多个 `else if` 语句，构建更复杂的条件判断！\n\
    \n`else if` 语句始终位于 `if` 语句之后、`else` 语句之前。`else if` 语句也接受一个条件。让我们来看下语法：\n\n![](img/image04626.jpeg)\n\
    \n`else if` 语句允许你拥有多个可能的结果。`if/else if/else` 语句从上到下读取，因此从上到下第一个求值为真的条件就是会被执行的代码块。\n\
    \n在上面的示例中，由于 `stopLight === 'red'` 求值为假，而 `stopLight === 'yellow'` 求值为真，因此执行第一个\
    \ `else if` 语句内部的代码。其余条件将不再被求值。如果没有一个条件求值为真，则将执行 `else` 语句中的代码。\n\n### 指令\n\n\
    1.\n让我们创建一个追踪环境随季节变化的程序。编写一个条件语句来实现这一功能！\n\n在 `main.js` 中已经有一个 `if...else` 语句了。让我们添加一个\
    \ `else if` 语句，检查 `season` 是否等于 `'winter'`。\n\n在 ``else if` 语句的代码块内部，添加一个 `console.log()`，打印字符串\
    \ `'It\\'s winter! Everything is covered in snow.'`。\n\n检查点 2 通过\n卡住了？获取提示\n\n\
    2.\n添加另一个 `else if` 语句，检查 `season` 是否等于 `'fall'`。    在你刚刚创建的 `else if` 语句代码块内部，添加一个\
    \ `console.log()`，打印字符串 `'It\\'s fall! Leaves are falling!'`。\n\n检查点 3 通过\n卡住了？获取提示\n\
    \n3.\n添加最后一个 `else if` 语句，检查 `season` 是否等于 `'summer'`。\n\n在你刚刚创建的 `else if` 语句代码块内部，添加一个\
    \ `console.log()`，打印字符串 `'It\\'s sunny and warm because it\\'s summer!'`。\n\n\
    ```javascript\nlet season = 'summer';\n```\n\n![](img/image04627.jpeg)\n\n## switch\
    \ 关键字\n\n如果我们需要检查多个条件，`else if` 语句是一个非常棒的工具。在编程中，我们经常发现需要检查多个值，并对每个值进行不同的处理。例如：\n\
    \n![](img/image04628.jpeg)\n\n在上面的代码中，我们有一系列条件来检查值是否匹配 `groceryItem` 变量。我们的代码运行正常，但想象一下如果我们需要检查\
    \ 100 个不同的值呢！要写那么多 `else if` 语句听起来是件痛苦的事！\n\n`switch` 语句提供了一种更易读、易写的替代语法。`switch`\
    \ 语句如下所示：\n\n![](img/image04629.jpeg)\n\n![](img/image04630.jpeg)\n\n- `switch`\
    \ 关键字启动语句，后面跟着 `( ... )`，其中包含每个 `case` 将要比较的值。在示例中，`switch` 语句的值或表达式是 `groceryItem`。\n\
    - 在块 `{ ... }` 内部有多个 `cases`。`case` 关键字检查表达式是否匹配其后的指定值。第一个 `case` 之后的值是 `'tomato'`。如果\
    \ `groceryItem` 的值等于 `'tomato'`，则该 case 的 `console.log()` 就会运行。\n- `groceryItem`\
    \ 的值为 `'papaya'`，因此运行第三个 `case`——向控制台打印“Papayas are $1.29”。\n- `break` 关键字告诉计算机退出该块，不再执行任何其他代码，或检查代码块内的任何其他\
    \ `case`。注意：如果没有 `break` 关键字，第一个匹配的 `case` 将运行，但随后的每个 `case` 无论是否匹配都会运行——包括 `default`。这种行为与只执行一个代码块的\
    \ `if/else` 条件语句不同。\n- 在每个 `switch` 语句的末尾都有一个 `default` 语句。如果没有任何 `cases` 为真，则将执行\
    \ `default` 语句中的代码。\n\n### 指令\n\n1.\n让我们写一个 `switch` 语句来决定给运动员颁什么奖牌。\n\n`athleteFinalPosition`\
    \ 已经在 `main.js` 顶部定义。所以从写一个以 `athleteFinalPosition` 为表达式的 `switch` 语句开始。\n\nCheckpoint\
    \ 2 通过\n卡住了？获取提示\n\n2.\n在 `switch` 语句内部添加三个 `cases`：\n- 第一个 `case` 检查值 `'first\
    \ place'`\n    - 如果表达式的值匹配 case 的值，则 `console.log()` 字符串 `'You get the gold medal!'`\n\
    - 第二个 `case` 检查值 `'second place'`\n    - 如果表达式的值匹配 case 的值，则 `console.log()` 字符串\
    \ `'You get the silver medal!'`\n- 第三个 `case` 检查值 `'third place'`\n    - 如果表达式的值匹配\
    \ case 的值，则 `console.log()` 字符串 `'You get the bronze medal!'`\n\n记得在每个 `console.log()`\
    \ 之后添加一个 `break`。\n\nCheckpoint 3 通过\n卡住了？获取提示\n\n3.\n现在，在 `switch` 的末尾添加一个 `default`\
    \ 语句，使用 `console.log()` 打印 `'No medal awarded.'`。\n\n如果 `athleteFinalPosition`\
    \ 不等于任何 `cases` 中的值，则控制台打印字符串 `'No medal awarded.'`。\n\n记得在 `default` case 的末尾添加\
    \ `break` 关键字。\n\n![](img/image04631.jpeg)\n\n## 复习\n\n干得好！这里是关于条件判断的一些主要概念：\n\
    \n- `if` 语句检查条件，如果该条件求值为真，则执行任务。\n- `if...else` 语句进行二元决策，并根据条件执行不同的代码块。\n- 我们可以使用\
    \ `else if` 语句添加更多条件。\n- 比较运算符 `<`, `>`, `<=`, `>=`, `===` 和 `!==` 可以比较两个值。\n\
    - 逻辑与运算符 `&&`（或“and”）检查提供的两个表达式是否都为真。\n- 逻辑或运算符 `||`（或“or”）检查提供的表达式中是否有一个为真。\n\
    - 感叹号运算符 `!` 切换值的真值和假值。\n- 三元运算符是简化简洁 `if...else` 语句的简写。\n- `switch` 语句可以简化编写多个\
    \ `else if` 语句的流程。`break` 关键字在 `switch` 语句中停止对剩余 `cases` 的检查和执行。\n\n指令\n\n在 `main.js`\
    \ 中，练习在本课中学的技能。\n\n"
- fmt: "\nIn programming, we often use code to perform a specific task multiple times.\
    \ Instead of rewriting the same code, we can group a block of code together and\
    \ associate it with one task, then we can reuse that block of code whenever we\
    \ need to perform the task again. We achieve this by creating a function. A function\
    \ is a reusable block of code that groups together a sequence of statements to\
    \ perform a specific task.\n\nIn this lesson, you will learn how to create and\
    \ use functions, and how they can be used to create clearer and more concise code.\n\
    \n## Function Declarations\n\nIn JavaScript, there are many ways to create a function.\
    \ One way to create a function is by using a function declaration. Just like how\
    \ a variable declaration binds a value to a variable name, a function declaration\
    \ binds a function to a name, or an identifier. Take a look at the anatomy of\
    \ a function declaration below:\n\nA function declaration consists of:\n\n*  \
    \ The `function` keyword.\n*   The name of the function, or its identifier, followed\
    \ by parentheses `()`\n*   A function body, or the block of statements required\
    \ to perform a specific task, enclosed in the function’s curly brackets, `{ }`.\n\
    \nA function declaration is a function that is bound to an identifier, or name.\
    \ In the next exercise we’ll go over how to run the code inside the function body.\n\
    \nWe should also be aware of the hoisting feature in JavaScript which allows access\
    \ to function declarations before they’re defined.\n\nTake a look at example of\
    \ hoisting:\n\n![](Images/image04634.jpeg)\n\nNotice how hoisting allowed `greetWorld()`\
    \ to be called before the `greetWorld()` function was defined! Since hoisting\
    \ isn’t considered good practice, we simply want you to be aware of this feature.\n\
    \nIf you want to read more about hoisting, check out [MDN documentation](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting)\
    \ [on hoisting](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting).\n\
    \n### Instructions \n\n1. Let’s create a function that prints a reminder to the\
    \ console. Using a function declaration, create a function called `getReminder()`.\n\
    \nCheckpoint 2 Passed\nStuck? Get a hint\n\n2. In the function body of `getReminder()`,\
    \ log the following reminder to the console: `'Water the plants.'`\n\nCheckpoint\
    \ 3 Passed\nStuck? Get a hint\n\n3. Let’s create another function that prints\
    \ a useful Spanish travel phrase to the console. Using a function declaration,\
    \ create a function called `greetInSpanish()`.\n\nCheckpoint 4 Passed\nStuck?\
    \ Get a hint\n\n4. Add code to the function body of `greetInSpanish()`:\n*   In\
    \ the function body `console.log()` the following Spanish phrase to the console:\
    \ `'Buenas Tardes.'`\n\n![](Images/image04635.jpeg)\n\n## Calling a Function\n\
    \nAs we saw in previous exercises, a function declaration binds a function to\
    \ an identifier. However, a function declaration does not ask the code inside\
    \ the function body to run, it just declares the existence of the function. The\
    \ code inside a function body runs, or executes, only when the function is called.\n\
    \nTo call a function in your code, you type the function name followed by parentheses\
    \ `()`. This function call executes the function body, or all of the statements\
    \ between the curly braces in the function declaration. We can call the same function\
    \ as many times as needed. Let’s practice calling functions in our code.\n\n![](Images/image04636.jpeg)\n\
    \n1. Imagine that you manage an online store. When a customer places an order,\
    \ you send them a thank you note. Let’s create a function to complete this task:\n\
    *   ![](Images/image04637.jpeg)Define a function called `sayThanks()` as a function\
    \ declaration.\n*   In the function body of `sayThanks()`, add code such that\
    \ the function writes the following thank you message to the console when called:\
    \ `'Thank you for your purchase! We appreciate your business.'`\n\nCheckpoint\
    \ 2 Passed\nStuck? Get a hint\n\n2. Call `sayThanks()` to view the thank you message\
    \ in the console.\n\nCheckpoint 3 Passed\nStuck? Get a hint\n\n3. Functions can\
    \ be called as many times as you need them. Imagine that three customers placed\
    \ an order and you wanted to send each of them a thank you message. Update your\
    \ code to call `sayThanks()` three times.\n\n![](Images/image04638.jpeg)\n\n##\
    \ Parameters and Arguments\n\nSo far, the functions we’ve created execute a task\
    \ without an input. However, some functions can take inputs and use the inputs\
    \ to perform a task. When declaring a function, we can specify its parameters.\
    \ Parameters allow functions to accept input(s) and perform a task using the input(s).\
    \ We use parameters as placeholders for information that will be passed to the\
    \ function when it is called.\n\nLet’s observe how to specify parameters in our\
    \ function declaration:\n\nIn the diagram above, `calculateArea()` computes the\
    \ area of a rectangle, based on two inputs, `width` and `height`. The parameters\
    \ are specified between the parenthesis as `width` and `height`, and inside the\
    \ function body, they act just like regular variables. `width` and `height` act\
    \ as placeholders for values that will be multiplied together.\n\nWhen calling\
    \ a function that has parameters, we specify the values in the parentheses that\
    \ follow the function name. The values that are passed to the function when it\
    \ is called are called arguments. Arguments can be passed to the function as values\
    \ or variables.\n\nIn the function call above, the number `10` is passed as the\
    \ `width` and `6` is passed as `height`. Notice that the order in which arguments\
    \ are passed and assigned follows the order that the parameters are declared.\
    \ The variables `rectWidth` and `rectHeight` are initialized with the values for\
    \ the height and width of a rectangle before being used in the function call.\n\
    \nBy using parameters, `calculateArea()` can be reused to compute the area of\
    \ any rectangle! Functions are a powerful tool in computer programming so let’s\
    \ practice creating and calling functions with parameters.\n\n### Instructions\n\
    \n1. The `sayThanks()` function works well, but let’s add the customer’s name\
    \ in the message. Add a parameter called `name` to the function declaration for\
    \ `sayThanks()`.\n\nCheckpoint 2 Passed\nStuck? Get a hint\n\n2. With `name` as\
    \ a parameter, it can be used as a variable in the function body of `sayThanks()`.\
    \ Using `name` and string concatenation, change the thank you message into the\
    \ following:\n\n![](Images/image0439.jpeg)\nCopy and paste the above message into\
    \ your code.\n\nCheckpoint 3 Passed\nStuck? Get a hint\n\n3. A customer named\
    \ Cole just purchased something from your online store. Call `sayThanks()` and\
    \ pass `'Cole'` as an argument to send Cole a personalized thank you message.\n\
    \n![](Images/image0440.jpeg)\n\n## Default Parameters\n\nOne of the features added\
    \ in ES6 is the ability to use default parameters. Default parameters allow parameters\
    \ to have a predetermined value in case there is no argument passed into the function\
    \ or if the argument is undefined when called.\n\nTake a look at the code snippet\
    \ below that uses a default parameter:\n\n![](Images/image0441.jpeg)\n\n*   In\
    \ the example above, we used the `=` operator to assign the ![](Images/image0458.jpeg)parameter\
    \ `name` a default value of `'stranger'`. This is useful to have in case we ever\
    \ want to include a non-personalized default greeting!\n*   When the code calls\
    \ `greeting('Nick')` the value of the argument is passed in and, `'Nick'`, will\
    \ override the default parameter of `'stranger'` to log `'Hello, Nick!'` to the\
    \ console.\n*   When there isn’t an argument passed into `greeting()`, the default\
    \ value of `'stranger'` is used, and `'Hello, stranger!'` is logged to the console.\n\
    \nBy using a default parameter, we account for situations when an argument isn’t\
    \ passed into a function that is expecting an argument.\n"
