- fmt: "\n`10 < 12` // Evaluates to true It can be helpful to think of comparison\
    \ statements as questions. When the answer is “yes”, the statement evaluates to\
    \ `true`, and when the answer is “no”, the statement evaluates to `false`. The\
    \ code above would be asking: is `10` less than `12`? Yes! So `10 < 12` evaluates\
    \ to `true`.\n\nWe can also use comparison operators on different data types like\
    \ strings:\n\n`'apples' === 'oranges'` // false In the example above, we’re using\
    \ the identity operator (`===`) to check if the string `'apples'` is the same\
    \ as the string `'oranges'`. Since the two strings are not the same, the comparison\
    \ statement evaluates to `false`.\n\nAll comparison statements evaluate to either\
