    \n![](img/image04934.jpeg)\n\n文件结构中的 `...` 是 `npm` 安装的 100 多个包的占位符。\n\n### Instructions\n\
    \n1. 在终端中输入 `ls` 以查看当前目录的文件结构。\n   Checkpoint 2 Passed\n\n2. 使用带有 `-D` 标志的 `npm`\
    \ 安装 Babel 命令行包，并将其添加到 `package.json` 中的 `devDependencies` 属性中。\n   Checkpoint\
    \ 3 Passed\n\n3. 使用带有 `-D` 标志的 `npm` 安装 Babel 环境预设包，并将其添加到 `package.json` 中的 `devDependencies`\
    \ 属性中。在终端输入 `ls` 查看当前目录的文件结构。注意增加了 `node_modules`。\n\n你也可以通过点击文本编辑器上方的文件导航按钮查看新文件夹。\n\
    \n### .babelrc\n\n现在你已经下载了 Babel 包，你需要指定源 JavaScript 代码的版本。\n\n你可以在名为 `.babelrc`\
    \ 的文件中指定初始 JavaScript 版本。在根目录下，你可以运行 `touch .babelrc` 来创建此文件。\n\n你的项目目录包含以下文件夹和文件：\n\
    \n![](img/image04935.jpeg)\n\n在 `.babelrc` 中，你需要为你的源 JavaScript 文件定义预设。预设指定了初始\
    \ JavaScript 文件的版本。\n\n通常，你希望将 ES6 及以后版本（ES6+）的 JavaScript 代码编译为 ES5。从现在起，我们将源代码称为\
    \ ES6+，因为 Ecma 在 JavaScript 的每个新版本中都会引入新语法。\n\n为了指定我们正在从 ES6+ 源编译代码，我们必须在 `.babelrc`\
    \ 中添加以下 JavaScript 对象：\n\n![](img/image04936.jpeg)\n\n当你运行 Babel 时，它会查找 `.babelrc`\
    \ 以确定初始 JavaScript 文件的版本。在这种情况下，`[\"env\"]` 指示 Babel 编译 ES6 及以后版本的任何代码。\n\n###\
    \ Instructions\n\n1. 在根目录下，使用 `touch` 创建一个新的 `.babelrc` 文件。\n   Checkpoint 2 Passed\n\
    \n2. 打开 `.babelrc` 文件并添加一个指定预设为 `\"env\"` 的对象。添加对象后运行代码。\n\n### Babel Source Lib\n\
    \n在我们可以编译代码之前还有最后一步。我们需要在 `package.json` 中指定一个启动 ES6+ 到 ES5 编译的脚本。\n\n在 `package.json`\
    \ 文件内部，有一个名为 `\"scripts\"` 的属性，它包含一个指定命令行快捷方式的对象。它看起来如下：\n\n![](img/image04937.jpeg)\n\
    \n在上面的代码中，`\"scripts\"` 属性包含一个有一个 `\"test\"` 属性的对象。在 `\"test\"` 属性下方，我们将添加一个如下所示运行\
    \ Babel 的脚本：\n\n![](img/image04938.jpeg)\n\n在上面的 `\"scripts\"` 对象中，我们添加了一个名为 `\"\
    build\"` 的属性。该属性的值 `\"babel src -d lib\"` 是一个将 ES6+ 代码编译为 ES5 的命令行方法。让我们考虑方法调用中的每个参数：\n\
    \n![](img/image04939.jpeg)\n• `babel`: 负责编译代码的 Babel 命令调用。\n\n![](img/image04940.jpeg)\n\
    • `src`: 指示 Babel 编译 `src` 目录内所有的 JavaScript 代码。\n• `-d`: 指示 Babel 将编译后的代码写入目录。\n\
    • `lib`: Babel 将编译后的代码写入名为 `lib` 的目录。\n\n在下一个练习中，我们将运行 `babel src -d lib` 方法来编译我们的\
    \ ES6+ 代码。\n\n### Instructions\n\n1. 在 `package.json` 中添加一个名为 `\"build\"` 的脚本。\n\
    \   运行时，`\"build\"` 脚本应该使用 Babel 编译 `src` 文件夹内的 JavaScript 代码并将其写入名为 `lib` 的文件夹。\n\
    \   别忘记在 `\"test\"` 脚本后添加一个逗号。\n\n![](img/image04941.jpeg)\n\n### Build\n\n我们准备好编译代码了！在上一个练习中，我们在\
    \ `package.json` 中写了以下脚本：\n\n`\"build\": \"babel src -d lib\"`\n\n现在，我们需要从命令行调用\
    \ `\"build\"` 以编译 ES5 代码到名为 `lib` 的目录。\n\n从命令行输入：\n\n`npm run build`\n\n上述命令运行了\
    \ `package.json` 中的 `build` 脚本。\n\nBabel 将 ES5 代码写入名为 `main.js` 的文件（文件名与源文件相同），位于\
    \ `lib` 文件夹中。生成的目录结构如下：\n\n![](img/image0492.jpeg)\n\n注意，目录包含一个名为 `lib` 的新文件夹，其中有一个文件\
    \ `main.js`。\n\n`npm run build` 命令将编译 `src` 文件夹中所有的 JavaScript 文件。这对构建大型 JavaScript\
    \ 项目非常有用——你只需要运行一个命令 (`npm run build`) 来编译所有代码。\n\n### Instructions\n\n1. 使用 `build`\
    \ 命令将 ES6+ 代码编译到 `lib`。\n   完成后，进入新的 `lib` 文件夹并打开 `main.js`。\n\n### Review\n\n\
    在本节中，你学习了浏览器兼容性和编译。让我们回顾一下关键概念：\n\n• ES5 — 所有现代浏览器都支持的旧 JavaScript 版本。\n• ES6\
    \ — 并非所有现代浏览器都支持的新 JavaScript 版本。它的语法更易读，类似于其他语言，并解决了 ES5 中常见的 bug 问题。\n• caniuse.com\
    \ —— 你可以使用它来查找 HTML、CSS 和 JavaScript 的兼容性信息。\n• Babel — 将 ES6+ 代码编译为 ES5 的 JavaScript\
    \ 包。\n• npm init — 创建 `package.json` 文件的终端命令。\n• package.json — 包含 JavaScript\
    \ 项目信息的文件。\n• npm install — 安装 Node 包的命令。\n• babel-cli — 包含 Babel 命令行工具的 Node\
    \ 包。\n• babel-preset-env — 包含 ES6+ 到 ES5 语法映射信息的 Node 包。\n• .babelrc — 指定 JavaScript\
    \ 版本的文件。\n• \"build\" 脚本 — 用于将 ES6+ 代码编译为 ES5 的 package.json 脚本。\n• npm run build\
    \ — 运行 build 脚本并将 ES6+ 代码编译为 ES5 的命令。\n\n"
- fmt: "\nThere are countless examples of asynchronicity in our everyday lives. Cleaning\
    \ our house, for example, involves asynchronous operations such as a dishwasher\
    \ washing our dishes or a washing machine washing our clothes. While we wait on\
    \ the completion of those operations, we’re free to do other chores.\n\nSimilarly,\
    \ web development makes use of asynchronous operations. Operations like making\
    \ a network request or querying a database can be time-consuming, but `JavaScript`\
    \ allows us to execute other tasks while awaiting their completion.\n\nThis lesson\
    \ will teach you how modern JavaScript handles asynchronicity using the `Promise`\
    \ object, introduced with ES6. Let’s get started!\n\n# What is a Promise?\n\n\
    Promises are objects that represent the eventual outcome of an asynchronous operation.\
    \ A `Promise` object can be in one of three states:\n\n- `Pending`: The initial\
    \ state— the operation has not completed yet.\n- `Fulfilled`: The operation has\
    \ completed successfully and the promise now has a resolved value. For example,\
    \ a request’s promise might resolve with a `JSON` object as its value.\n- `Rejected`:\
    \ The operation has failed and the promise has a reason for the failure. This\
    \ reason is usually an `Error` of some kind.\n\nWe refer to a promise as settled\
    \ if it is no longer pending— it is either fulfilled or rejected. Let’s think\
    \ of a dishwasher as having the states of a promise:\n\n- `Pending`: The dishwasher\
    \ is running but has not completed the washing cycle.\n- `Fulfilled`: The dishwasher\
    \ has completed the washing cycle and is full of clean dishes.\n- `Rejected`:\
    \ The dishwasher encountered a problem (it didn’t receive soap!) and returns unclean\
    \ dishes.\n\nIf our dishwashing promise is fulfilled, we’ll be able to perform\
    \ related tasks, such as unloading the clean dishes from the dishwasher. If it’s\
    \ rejected, we can take alternate steps, such as running it again with soap or\
    \ washing the dishes by hand.\n\nAll promises eventually settle, enabling us to\
    \ write logic for what to do if the promise fulfills or if it rejects.\n\n# Constructing\
    \ a Promise Object\n\nLet’s construct a promise! To create a new `Promise` object,\
    \ we use the `new` keyword and the `Promise` constructor method:\n\n![](Images/image04943.jpeg)\n\
    \nThe `Promise` constructor method takes a function parameter called the executor\
    \ function which runs automatically when the constructor is called. The executor\
    \ function generally starts an asynchronous operation and dictates how the promise\
    \ should be settled.\n\nThe executor function has two function parameters, usually\
    \ referred to as the `resolve()` and `reject()` functions. The `resolve()` and\
    \ `reject()` functions aren’t defined by the programmer. When the `Promise` constructor\
    \ runs, `JavaScript` will pass its own `resolve()` and `reject()` functions into\
    \ the executor function.\n\n- `resolve` is a function with one argument. Under\
    \ the hood, if invoked, `resolve()` will change the promise’s status from `pending`\
    \ to `fulfilled`, and the promise’s resolved value will be set to the argument\
    \ passed into `resolve()`.\n- `reject` is a function that takes a reason or error\
    \ as an argument. Under the hood, if invoked, `reject()` will change the promise’s\
    \ status from `pending` to `rejected`, and the promise’s rejection reason will\
    \ be set to the argument passed into `reject()`.\n\nLet’s look at an example executor\
    \ function in a `Promise` constructor:\n\n![](Images/image04944.jpeg)\n\n![](Images/image04945.jpeg)\n\
    \nLet’s break down what’s happening above:\n\n![](Images/image04946.jpeg)![](Images/image04947.jpeg)We\
    \ declare a variable\n\n- the `executor` is constructed using `constructor` method.\n\
    - which is as parameters:\n- `myFirstPromise` is passed to the constructor and\
    \ has two functions `resolve` and `reject`.\n- If `someCondition` evaluates to\
    \ `true`, we invoke `resolve()` with the string `'I resolved!'`.\n- If not, we\
    \ invoke `reject()` with the string `'I rejected!'`.\n\nIn our example, `myFirstPromise`\
    \ resolves or rejects based on a simple condition, but in practice, promises settle\
    \ based on the results of asynchronous operations. For example, a database request\
    \ may fulfill with the data from a query or reject with an error thrown. In this\
    \ exercise, we’ll construct promises which resolve synchronously to more easily\
    \ understand how they work.\n\n## Instructions\n\n1. You’ll be writing your code\
    \ in the code-editor, but we won’t be running it until the final step. To check\
    \ your code for a step, you can press the “Check Work” button.\n\nWe’re going\
    \ to create a promise representing ordering sunglasses from an online store. First,\
    \ create the function, `myExecutor()`. Later on, you’ll pass this function into\
    \ the `Promise` constructor.\n\n`myExecutor()` should:\n- Have two parameters:\
    \ `resolve` and `reject`\n- Check if the `sunglasses` property on the `inventory`\
    \ object has a value greater than zero\n- If it does, `myExecutor()` should invoke\
    \ `resolve()` with the string `'Sunglasses order processed.'`\n- ![](Images/image04948.jpeg)If\
    \ it does not, should invoke `reject()` with the string `'That item is sold out.'`\n\
    \nWhen you’re ready, press the “Check Work” button.\nCheckpoint 2 Passed\n\n2.\
    \ Create a function, `orderSunglasses()`. This function should have no parameters.\
    \ It should return a new promise constructed by passing your `myExecutor()` function\
    \ into the `Promise` constructor.\nCheckpoint 3 Passed\n\n3. Create a variable\
    \ `orderPromise` assigned to the returned value of your `orderSunglasses()` function.\n\
    Checkpoint 4 Passed\n\n4. At the bottom of your `app.js` file, log `orderPromise`\
    \ to the console.\nCheckpoint 5 Passed\n\n5. ![](Images/image04949.jpeg)In this\
    \ exercise and throughout the lesson, we’ll provide you with a bash terminal to\
    \ execute your code. To run the `app.js` program, you’ll type `node` ![](Images/image04950.jpeg)`app.js`\
    \ in the terminal and hit enter (or return). You’ll be able to see the output\
    \ of the program in the terminal\n ![](Images/image04951.jpeg)Let’s try it! Type\
    \ `node app.js` in the terminal and hit enter.\n\nIf you’d like, you can see an\
    \ alternate output by changing the `sunglasses` property in the `inventory` object\
    \ to `0` and executing `app.js` from the terminal again.\n\nWhen you’re ready\
    \ to move on, press the “Check Work” button.\n![](Images/image04952.jpeg)\n![](Images/image04953.jpeg)\n\
    \n# The Node setTimeout() Function\n\nKnowing how to construct a promise is useful,\
    \ but most of the time, knowing how to consume, or use, promises will be key.\
    \ Rather than constructing promises, you’ll be handling `Promise` objects returned\
    \ to you as the result of an asynchronous operation. These promises will start\
    \ off `pending` but settle eventually.\n\nMoving forward, we’ll be simulating\
    \ this by providing you with functions that return promises which settle after\
    \ some time. To accomplish this, we’ll be using `setTimeout()`. `setTimeout()`\
    \ is a Node API (a comparable API is provided by web browsers) that uses callback\
    \ functions to schedule tasks to be performed after a delay. `setTimeout()` has\
    \ two parameters: a callback function and a delay in milliseconds.\n\n![](Images/image04954.jpeg)\n\
    \nHere, we invoke `setTimeout()` with the callback function `delayedHello()` and\
    \ `2000`. In at least two seconds `delayedHello()` will be invoked. But why is\
    \ it “at least” two seconds and not exactly two seconds?\n\nThis delay is performed\
    \ asynchronously—the rest of our program won’t stop executing during the delay.\
    \ Asynchronous JavaScript uses something called the event-loop. After two seconds,\
    \ `delayedHello()` is added to a line of code waiting to be run. Before it can\
    \ run, any synchronous code from the program will run. Next, any code in front\
    \ of it in the line will run. This means it might be more than two seconds before\
    \ `delayedHello()` is actually executed.\n"
