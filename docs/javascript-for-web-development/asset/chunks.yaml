    ## 继承 I


    ![](img/image04878.jpeg)想象我们的狗狗日日中心非常成功，以至于我们决定扩大业务开设猫咪日日中心。在日日中心开放之前，我们需要创建一个
    `Cat` 类，以便能够快速生成 `Cat` 实例。我们知道 `Cat` 类中的属性（`name`, `behavior`）与我们 `Dog` 类中的属性相似，不过它们会有一些不同，因为猫显然不是狗。


    假设我们的 `Cat` 类如下：


    ![](img/image04879.jpeg)


    在上面的示例中，我们创建了一个 `Cat` 类。它与之前练习中的 `Dog` 类共享几个属性（`_name` 和 `_behavior`）和一个方法（`.incrementBehavior()`）。`Cat`
    类还包含一个额外的属性（`_usesLitter`），它存储一个布尔值，指示猫是否可以使用猫砂。


    当多个类共享属性或方法时，它们就成为了继承的候选者——开发者用来减少代码代码的工具。


    通过继承，你可以创建一个父类（也称为超类），它包含多个子类（也称为子类）共享的属性和方法。子类继承父类的属性和方法。


    让我们将 `Cat` 和 `Dog` 类中的共享属性和方法抽象到一个名为 `Animal` 的父类。


    ![](img/image04880.jpeg)


    在上面的示例中，`Animal` 类包含了 `Cat` 和 `Dog` 类共享的属性和方法（`name`, `behavior`, `.incrementBehavior()`）。


    右侧的图显示了我们想要在 `Animal`、`Cat` 和 `Dog` 类之间建立的关系。


    ![](img/image04881.jpeg)


