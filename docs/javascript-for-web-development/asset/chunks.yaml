  trans: "\n\n我们有时想要找到数组中元素的位置。这就是 `.findIndex()` 方法大显身手的地方！在数组上调用 `.findIndex()`\
    \ 将返回回调函数评估结果为 `true` 的第一个元素的索引。\n\n![](img/image04761.jpeg)\n\n* `jumbledNums`\
    \ 是一个包含数字元素的数组。\n* `const lessThanTen` 声明了一个新变量，用于存储调用 `.findIndex()` 后返回的索引值。\n\
    * 回调函数是一个箭头函数，它有一个参数 `num`。\n\n`jumbledNums` 数组中的每个元素都将作为参数传递给此函数。\n\n* `num <\
    \ 10` 是检查元素的条件。`.findIndex()` 将返回第一个满足该条件评估结果为 `true` 的元素的索引。\n\n让我们来看看 `lessThanTen`\
    \ 的求值结果是什么：\n\n```javascript\nconsole.log(lessThanTen); // 输出: 3\n```\n\n如果我们检查索引为\
    \ 3 的元素是什么：\n\n```javascript\nconsole.log(jumbledNums[3]); // 输出: 5\n```\n\n太棒了，索引\
    \ 3 的元素是数字 5。这是合理的，因为 5 是第一个小于 10 的元素。\n\n如果数组中没有一个元素满足回调函数中的条件，`.findIndex()`\
    \ 将返回 `-1`。\n\n![](img/image04762.jpeg)\n![](img/image04763.jpeg)\n\n### 调用\n\n\
    在 `animals` 数组上调用 ![](img/image04764.jpeg) 以找到值为 'elephant' 的元素的索引，并将返回的值保存到名为\
    \ `foundAnimal` 的 `const` 变量中。\n\n**通过检查点 2**\n卡住了？获取提示\n\n2. 让我们看看能否找到第一个以字母\
    \ 's' 开头的动物的索引。在 `animals` 数组上调用 `.findIndex()` 返回第一个以 's' 开头的元素的索引。将返回的值赋值给名为\
    \ `startsWithS` 的 `const` 变量。\n\n![](img/image04765.jpeg)\n\n### .reduce() 方法\n\
    \n另一个常用的迭代方法是 `.reduce()`。`.reduce()` 方法在遍历数组元素后返回一个单一值，从而简化数组。看下方的示例：\n\n![](img/image04766.jpeg)\n\
    ![](img/image04767.jpeg)\n![](img/image04768.jpeg) 这里是 `numbers` 数组的值：\n\n| 迭代\
    \ | accumulator | currentValue | return value |\n| :--- | :--- | :--- | :--- |\n\
    | 第一次 | 1 | 2 | 3 |\n| 第二 | 3 | 4 | 7 |\n| 第三次 | 7 | 10 | 17 |\n\n现在我们来看上面示例中\
    \ `.reduce()` 的用法：\n\n* `numbers` 是一个包含数字的数组。\n* `summedNums` 是一个变量，存储在 `numbers`\
    \ 上调用 `.reduce()` 的返回值。\n* `numbers.reduce()` 在 `numbers` 数组上调用 `.reduce()` 方法，并接受一个回调函数作为参数。\n\
    * 回调函数有两个参数：`accumulator` 和 `currentValue`。`accumulator` 的值从数组第一个元素的值开始，`currentValue`\
    \ 从第二个元素开始。要查看 `accumulator` 和 `currentValue` 值的变化，请查看上面的图表。\n* 随着 `.reduce()`\
    \ 遍历数组，回调函数的返回值将成为下一次迭代的 `accumulator` 值，而 `currentValue` 则获取循环过程中当前元素的值。\n\n\
    `.reduce()` 方法还可以接收一个可选的第二个参数，用于为 `accumulator` 设置初始值（记住，第一个参数是回调函数！）。例如：\n\n\
    ![](img/image04769.jpeg)\n![](img/image04770.jpeg)\n\n这是一个考虑了第二个参数为 100 的更新图表：\n\
    \n| 迭代次数 | accumulator | currentVal | return value |\n| :--- | :--- | :--- | :---\
    \ |\n| 第一次 | 100 | 1 | 101 |\n| 第二 | 101 | 2 | 103 |\n| 第三次 | 103 | 4 | 107 |\n\
    | 第四次 | 107 | 10 | 117 |\n\n### 指令\n\n1. 让我们练习调用 `.reduce()` 并使用 `console.log()`\
    \ 在 `.reduce()` 遍历数组时检查值。在 `main.js` 中，有一个数字数组 `newNumbers`。\n\n开始之前，使用 `const`\
    \ 关键字声明一个名为 `newSum` 的新变量。将调用 `newNumbers.reduce()` 的结果赋值给 `newSum`。你还会看到 `TypeError:\
    \ undefined is not a function`，但我们会修复它。\n\n**通过检查点 2**\n卡住了？获取提示\n\n2. 为 `.reduce()`\
    \ 提供一个回调函数。该回调有两个参数。第一个参数是 `accumulator`，第二个是 `currentValue`。\n\n**通过检查点 3**\n\
    卡住了？获取提示\n\n3. 为了在遍历数组时检查值，在回调体中添加三个语句：\n* `console.log('The value of accumulator:',\
    \ accumulator);`\n* `console.log('The value of currentValue:', currentValue);`\n\
    * `return accumulator;`\n\n**通过检查点 4**\n卡住了？获取提示\n\n![](img/image04771.jpeg)\n\
    \n4. 在 `main.js` 的最后一行，有这段代码：\n```javascript\nnewNumbers.reduce((accumulator,\
    \ currentValue) => {\n  // ...\n})\n```\n完成括号之间的代码，以检查每个元素是否超过 5 个字符。在运行代码之前，确保取消程序最后行的注释（删除行前的\
    \ `//`）。\n\n**通过检查点 5**\n\n"
