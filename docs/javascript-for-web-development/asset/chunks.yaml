    #### 消费 Promise (Consuming Promises)


    异步 promise 的初始状态是 `pending`，但我们保证会进入最终状态（settle）。我们如何告诉计算机之后应该发生什么呢？Promise 对象带有一个命名恰当的
    `.then()` 方法。它允许我们说：“有一个 promise，当它定时后，这就是我想发生的事情……”


    在我们洗碗机 promise 的案例中，洗碗机将在那时运行：


    * 如果我们的 promise 被拒绝（reject），意味着我们有脏碗，我们会添加洗洁剂再次运行洗碗机。

    * 如果我们的 promise 成功（fulfill），意味着我们有干净的碗，我们会把碗收好。


    `.then()` 是高阶函数——它接受两个回调函数作为参数。我们将这些回调函数称为处理器（handlers）。当 promise 状态定时，相应的 `handler`
    将带有该状态的值被调用。


    * 第一个处理器（有时称为 `onFulfilled`）是成功处理器，它应该包含 promise 解析的逻辑。

    * 第二个处理器（有时称为 `onRejected`）是失败处理器，它应该包含 promise 被拒绝的逻辑。


    我们可以带一个、两个或两个都不带处理器来调用 `.then()`！这提供了灵活性，但也可能导致调试变得复杂。如果未提供相应的处理器，`.then()` 不会抛出错误，而是返回一个与被调用的
    promise 具有相同状态值的 promise。`.then()` 的一个重要特性是它总是返回一个 promise。我们将在稍后的练习中详细地回到这一点，并探索它为什么如此重要。


    #### 成功和失败回调函数


    为了处理一个“成功的”promise，或一个已解析（resolved）的 promise，我们在 promise 上调用 `.then()`，并传入一个成功处理器回调函数：


    ![](img/image04960.jpeg)


    让我们拆解一下示例代码中发生什么：


    * `prom` 是一个 promise，它将解析为 ''Yay!''。

    * 我们定义了一个函数 `handleSuccess()`，它打印传递给它的参数。

    * 我们调用 `prom` 的 `.then()` 函数，并传入我们的 `handleSuccess()` 函数。

    * 由于 `prom` 解析了，`handleSuccess()` 被带有 `prom` 的解析值 ''Yay'' 调用，因此 ''Yay'' 被打印到控制台。


    在典型的 promise 消费中，我们不知道 promise 会解析还是拒绝，因此我们需要为这两种情况提供逻辑。我们可以同时向 `.then()` 传递一个成功回调和一个失败回调。


    ![](img/image04961.jpeg)


    让我们拆解一下示例代码中发生什么：


    * `prom` 是一个 promise，它会随机解析为 ''Yay!'' 或拒绝为 ''Ohhh noooo!''。

    * ![](img/image04962.jpeg)我们向 `.then()` 传递了两个处理器函数。如果 promise 解析，第一个将带有 ''Yay!''
    调用；如果 promise 被拒绝，第二个将带有 ''Ohhh noooo!'' 调用。


    注意：成功回调有时被称为“成功处理器函数”或 `onFulfilled` 函数。失败回调有时被称为“失败处理器函数”或 `onRejected` 函数。


    让我们来写一些成功和失败回调吧！


    ![](img/image04963.jpeg)


    #### 1

    查看 `app.js` 中提供的代码。我们使用 `require()` 从 `library.js` 引入函数 `checkInventory()`。它基于以下逻辑构建：


    * `checkInventory()` 接收一个 `order` 并返回一个 promise。

    * 如果每个物品都有货，promise 解析为 "Thank you. order was successful."。

    * 否则，promise 被拒绝为 "We''re sorry. order could not be completed"。


    我们使用了 `setTimeout()` 来确保 promise 是异步定时的。如果你愿意，可以查看 `library.js`。准备好后按“Check”。


    检查点 2 通过

    ![](img/image04964.jpeg)


    2

    编写一个函数 `handleSuccess()`。你稍后将使用此函数作为成功处理器。由于 `prom` 解析了，`handleSuccess()` 被带有
    `prom` 的解析值 ''Yay'' 调用，因此 ''Yay'' 被打印到控制台。


    检查点 3 通过

    卡住了？获取提示


    #### 3

    编写一个函数 `handleFailure()`。你稍后将使用此函数作为失败处理器。由于 `prom` 被拒绝，`handleFailure()` 被带有
    `prom` 的拒绝值 ''Ohhh noooo!'' 调用，因此 ''Ohhh noooo!'' 被打印到控制台。


    检查点 4 通过

    卡住了？获取提示


    #### 4

    带有 `order` 调用 `checkInventory()`。这将返回一个 promise。在此基础上附加 `.then()`。向 `.then()`
    传入你写的两个处理器。


