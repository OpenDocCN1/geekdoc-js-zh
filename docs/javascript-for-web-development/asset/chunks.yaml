    Let’s look at how we’ll be using `setTimeout()` to construct asynchronous promises:


    ![](Images/image04955.jpeg)


    In the example code, we invoked `returnPromiseFunction()` which returned a promise.
    We assigned that promise to the variable `prom`. Similar to the asynchronous promises
    you may encounter in production, `prom` will initially have a status of `pending`.


    Let’s explore `setTimeout()` a bit more.


    ### Instructions


    #### 1

    Create a function using `usingSTO()`. Your `usingSTO()` function should have no
    parameters. Inside the function body, it should print a string to the console.
    This can be any string you want (as long as it’s not either “This is the first
    line of synchronous code.” or “This is the last line of synchronous code.”


    Check your work to move on to the next step.


