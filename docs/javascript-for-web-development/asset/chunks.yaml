    在调用 `removeElement(concept)` 后，通过输出它来检查 `concept` 的值。


    注意，在两种情况下，数组的更改都在函数外部保留了！


    ![](img/image04700.jpeg)


    ## 嵌套数组


    之前我们提到数组可以存储其他数组。当一个数组包含另一个数组时，它被称为嵌套数组。查看下面的示例：


    ```

    const nestedArr = [[1], [2, 3]];

    ```


    要访问嵌套数组，我们可以使用带有索引值的括号符号，就像我们访问任何其他元素一样：


    ![](img/image04701.jpeg)


    注意我们获取了索引为 1 的元素，即数组 `[2, 3]`。然后如果我们想访问嵌套数组内部的元素，可以链式或添加更多带有索引值的括号符号。


    ![](img/image04702.jpeg)


    在第二个 `console.log()` 语句中，我们有两个链接到 `nestedArr` 上的括号符号。我们知道 `nestedArr[1]` 是数组 `[2,
    3]`。然后为了获取该数组的第一个元素，我们使用 `nestedArr[1][0]`，并得到了值 2。


    ### 指示 1.


    让我们创建一个嵌套数组！创建一个变量 `numberClusters`。将其值赋值为一个包含三个数组元素的数组。


    *   第一个数组元素应该包含元素 1 和 2。

    *   第二个数组元素应该包含元素 3 和 4。

    *   第三个数组元素应该包含元素 5 和 6。


    检查点 2 通过

    卡住了？获取提示


