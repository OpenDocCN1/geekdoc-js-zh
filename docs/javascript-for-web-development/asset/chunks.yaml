    want to make one restocking order, so we’ll only want to place the order if all
    of the items are available.


    Take a look at the provided code. We require in one function: `checkAvailability()`.


    `checkAvailability()` expects two string arguments: an item and a distributor.
    It returns a promise. The function simulates checking that the given distributor
    has a given item. 80% of the time it will resolve the promise with the item, and
    20% of the time it will reject the promise with an error message stating that
    the item isn’t available.


    We also provided two functions which will serve as success and failure handlers.


    If you’d like, look at the `library.js` file to see how these functions work.
    Press “Check Work” when you’re ready to move on to the next checkpoint.


