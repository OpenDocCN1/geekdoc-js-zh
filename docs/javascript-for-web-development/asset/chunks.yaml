    \  ES6  code to  ES5.  In  the next five exercises you  will learn how  to setup\
    \  a\n\nJavaScript project that transpiles code when you run  npm run build  from\
    \ the  root  directory of a JavaScript project.\n\nThe first step is to place\
    \ your ES6 JavaScript file in a directory called src.  From  your  root directory,\
    \  the path  to the ES6 file is ./src/main.js\n\nThe  initial  JavaScript project\
    \  file structure  is:\n\n![](Images/image04929.jpeg)\n\nBefore we install Babel,\
    \ we need to setup our project to use the [node](https://docs.npmjs.com/getting-started/what-is-npm)\
    \  [package manager (npm)](https://docs.npmjs.com/getting-started/what-is-npm).\
    \ Developers use npm to access and manage Node  packages. Node packages are directories\
    \ that contain JavaScript code  written by other developers. You can use these\
    \ packages to reduce  duplication  of  work and avoid bugs.\n\nBefore we can add\
    \ Babel to our project directory, we need to run  npm init.  The  npm  init  command\
    \  creates a package.json  file in  the root directory.\n\nA package.json file\
    \ contains information about the current JavaScript  project.  Some of this information\
    \ includes:\n\n• Metadata — This includes a project title, description, authors,\
    \ and  more.\n\n• A list of node packages required for the project — If another\
    \  developer  wants to  run your  project,  npm looks\n\ninside  package.json\
    \  and  downloads the  packages in  this list.\n\n• Key-value pairs for command\
    \ line scripts — You can use npm to run  these shorthand scripts to perform some\
    \ process. In a later exercise,  we  will add a  script that runs  Babel and transpiles\
    \ ES6  to ES5.\n\nIf you have Node installed on your computer, you can create\
    \  a  package.json  file by  typing  npm init  into  the  terminal.\n\nThe terminal\
    \ prompts you to fill in fields for the project’s metadata (name,  description,\
    \  etc.)\n\nYou are not required to answer the prompts, though we recommend at\
    \  minimum,  you  add  your  own  title  and  description.  If  you  don’t  want\
    \  to  fill  in\n\na field, you can press enter. npm will leave fill these fields\
    \ with default  values  or leave  them empty when  it creates the  package.json\
    \  file.\n\nAfter you run  npm  init  your  directory structure will  contain\
    \ the following  files  and folders:\n\n![](Images/image04930.jpeg)\n\nnpm  adds\
    \ the  package.json  file  to the same level as  the src  directory.\n\nInstructions\
    \  1.\n\nRun  ls  in the terminal to see the  file structure of  your current\
    \ directory.\n\n Checkpoint 2 Passed\n\n2.\n\nUse npm to create a new package.json\
    \ file. We recommend you set  the  name  and  description  properties to the following\
    \  values:\n\n• name  —  learning-babel\n\n• description  —  Use  Babel to  transpile\
    \ JavaScript  ES6  to ES5\n\nEnter ls  into  the  terminal to  see the file  structure\
    \ of  your current directory.  Notice  the  addition of package.json.\n\nInstall\
    \  Node Packages"
