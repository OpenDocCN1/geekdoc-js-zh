    Let’s practice creating functions that use default parameters.


    ## Instructions 1


    The function `makeShoppingList()` creates a shopping list based on the items that
    are passed to the function as arguments.


    Imagine that you always purchase milk, bread, and eggs every time you go shopping
    for groceries. To make creating a grocery list easier, let’s assign default values
    to the parameters in `makeShoppingList()`.


    Change the parameters of `makeShoppingList()` into default parameters:


    *   Assign `''milk''` as the default value of `item1`.

    *   Assign `''bread''` as the default value of `item2`.

    *   Assign `''eggs''` as the default value of `item3`.


    ![](Images/image04642.jpeg)

    ![](Images/image04643.jpeg)


    ## Return


    When a function is called, the computer will run through the function’s code and
    evaluate the result of calling the function. By default that resulting value is
    `undefined`.


    ![](Images/image04644.jpeg)


    In the code example, we defined our function to calculate the area of a `width`
    and `height` parameter. Then `rectangleArea()` is invoked with the arguments `5`
    and `7`. But when we went to print the results we got `undefined`. Did we write
    our function wrong? No! In fact, the function worked fine, and the computer did
    calculate the area as `35`, but we didn’t capture it. So how can we do that? With
    the keyword `return`!


    To pass back information from the function call, we use a `return` statement.
    To create a `return` statement, we use the `return` keyword followed by the value
    that we wish to return. Like we saw above, if the value is omitted, `undefined`
    is returned instead.


    When a `return` statement is used in a function body, the execution of the function
    is stopped and the code that follows it will not be executed. Look at the example
    below:


    ![](Images/image04645.jpeg)

    ![](Images/image04646.jpeg)![](Images/image04647.jpeg) If an argument for ororis
    is less than `0`, then `rectangleArea()` will return `''You need positive integers
    to calculate area!''`. The second `return` statement `width * height` will not
    run.


    The `return` keyword is powerful because it allows functions to produce an output.
    We can then save the output to a variable for later use.


    ## Instructions 1


    Imagine if we needed to order monitors for everyone in an office and this office
    is conveniently arranged in a grid shape. We could use a function to help us calculate
    the number of monitors needed!


    Declare a function `monitorCount()` that has two parameters. The first parameter
    is `rows` and the second parameter is `columns`.


    **Checkpoint 2 Passed**

    Stuck? Get a hint


    2.

    Let’s compute the number of monitors by multiplying `rows` and `columns` and then
    returning the value.


    In the function body of the function you just wrote, use the `return` keyword
    to return `rows * columns`.


    **Checkpoint 3 Passed**

    Stuck? Get a hint


    3.

    Now that the function is defined, we can compute the number of monitors needed.
    Let’s say that the office has 5 rows and 4 columns.


    Declare a variable named `numOfMonitors` using the `const` keyword and assign
    `numOfMonitors` the value of invoking `monitorCount()` with the arguments `5`
    and `4`.


    **Checkpoint 4 Passed**

    Stuck? Get a hint


    4.

    To check that the function worked properly, log `numOfMonitors` to the `console`.


    ![](Images/image04648.jpeg)


    ## Helper Functions


    We can also use the return value of a function inside another function. These
    functions being called within another function are often referred to as helper
    functions. Since each function is carrying out a specific task, it makes our code
    easier to read and debug if necessary.


    If we wanted to define a function that converts the temperature from `Celsius`
    to `Fahrenheit`, we could write two functions like:


    ![](Images/image04649.jpeg)


    In the example above:


    *   `getFahrenheit()` is called and `15` is passed as an argument.

    *   The code block inside of `getFahrenheit()` calls `multiplyByNineFifths()`
    and passes `15` as an argument.

    *   `multiplyByNineFifths()` takes the argument of `15` for the `number` parameter.

    *   The code block inside of `multiplyByNineFifths()` function multiplies `15`
    by `(9/5)`, which evaluates to `27`.

    *   `27` is returned back to the function call in `getFahrenheit()`.

    *   `getFahrenheit()` continues to execute. It adds `32` to `27`, which evaluates
    to `59`.

    *   Finally, `59` is returned back to the function call `getFahrenheit(15)`.


    The `return` keyword is powerful because it allows functions to produce an output.
    We can then save the output to a variable for later use.


    ## Function Expressions


    Another way to define a function is to use a function expression. To define a
    function inside an expression, we can use the `function` keyword. In a function
    expression, the name is usually omitted. A function with no name is called an
    anonymous function. A function expression is often stored in a variable in order
    to refer to it.


    Consider the following function expression:


    To declare a function expression:

    1. Declare a variable to make the variable’s name be the name, or identifier,
    of your function. Since the release of ES6, it is common practice to use `const`
    as the keyword to declare the variable.

    2. Assign as that variable’s value an anonymous function created by using the
    `function` keyword followed by a set of parentheses with possible parameters.
    Then a set of curly braces that contain the function body.


    To invoke a function expression, write the name of the variable in which the function
    is stored followed by parentheses enclosing any arguments being passed into the
    function `variableName(argument1, argument2)`. Unlike function declarations, function
    expressions are not hoisted so they cannot be called before they are defined.


    Let’s define a new function using a function expression.


    ## Instructions 1


    Let’s say we have a plant that we need to water once a week on Wednesdays. We
    could define a function expression to help us check the day of the week and the
    plant needs to be watered:


    *   Create a variable named `plantNeedsWater` using the `const` variable keyword.

    *   Assign an anonymous function that takes in a parameter `day` to `plantNeedsWater`.


    **Checkpoint 2 Passed**

    Stuck? Get a hint


    2.

    Now we need to add some code to the function body of `plantNeedsWater()`:

    *   In the function body add an `if` conditional that checks `day === ''Wednesday''`.

    *   If the conditional is truthy, inside the `if` code block, use the `return`
    keyword to return `true`.


    **Checkpoint 3 Passed**

    Stuck? Get a hint

