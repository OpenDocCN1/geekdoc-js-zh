    \nlike  Date.now()  which  returns  the current  date,  directly  from the  class.\n\
    \nThe  .now()  method is static,  so you can call it  directly from the class,\
    \ but  not  from  an instance of the class.\n\nLet’s  see  how to  use the  static\
    \  keyword to create  a static method  called  generateName  method in our  Animal\
    \  class:\n\n![](Images/image04901.jpeg)\n\nIn  the example above, we  create\
