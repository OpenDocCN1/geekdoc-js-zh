- fmt: "\n- If the condition evaluates to false, the second expression executes.\n\
    \nLike `if...else` statements, ternary operators can be used for conditions which\
    \ evaluate to true or false.\n\n### Instructions\n\n1.\nRefactor, or edit, the\
    \ first `if...else` block to use a ternary operator.\n\nCheckpoint 2 Passed\n\
    Stuck? Get a hint\n\n2.\nRefactor the second `if...else` block to use a ternary\
    \ operator.\n\nCheckpoint 3 Passed\nStuck? Get a hint\n\n3.\nRefactor the third\
    \ `if...else` block to use a ternary operator.\n\n![](Images/image04625.jpeg)\n\
    \n## Else If Statements\n\nWe can add more conditions to our `if...else` with\
    \ an `else if` statement.\n\nThe `else if` statement allows for more than two\
    \ possible outcomes. You can add as many `else if` statements as you’d like, to\
    \ make more complex conditionals!\n\nThe `else if` statement always comes after\
    \ the `if` statement and before the `else` statement. The `else if` statement\
    \ also takes a condition. Let’s take a look at the syntax:\n\n![](Images/image04626.jpeg)\n\
    \nThe `else if` statements allow you to have multiple possible outcomes. `if/else\
    \ if/else` statements are read from top to bottom, so the first condition that\
    \ evaluates to true from the top to bottom is the block that gets executed.\n\n\
    In the example above, since `stopLight === 'red'` evaluates to false and `stopLight\
    \ === 'yellow'` evaluates to true, the code inside the first `else if` statement\
    \ is executed. The rest of the conditions are not evaluated. If none of the conditions\
    \ evaluated to true, then the code in the `else` statement would have executed.\n\
    \n### Instructions\n\n1.\nLet’s create a program that keeps track of the way the\
    \ environment changes with the seasons. Write a conditional statement to make\
    \ this happen!\n\nIn `main.js` there is already an `if...else` statement in place.\
    \ Let’s add an `else if` statement that checks if `season` is equal to `'winter'`.\n\
    \nInside the code block of the `else if` statement, add a `console.log()` that\
    \ prints the string `'It\\'s winter! Everything is covered in snow.'`.\n\nCheckpoint\
    \ 2 Passed\nStuck? Get a hint\n\n2.\nAdd another `else if` statement that checks\
    \ if `season` is equal to `'fall'`.\n\nInside the code block of the `else if`\
    \ statement you just created, add a `console.log()` that prints the string `'It\\\
    's fall! Leaves are falling!'`.\n\nCheckpoint 3 Passed\nStuck? Get a hint\n\n\
    3.\nAdd a final `else if` statement that checks if `season` is equal to `'summer'`.\n\
    \nInside the code block of the `else if` statement you just created, add a `console.log()`\
    \ that prints the string `'It\\'s sunny and warm because it\\'s summer!'`.\n\n\
    ```javascript\nlet season = 'summer';\n```\n\n![](Images/image04627.jpeg)\n\n\
    ## The switch keyword\n\n`else if` statements are a great tool if we need to check\
    \ multiple conditions. In programming, we often find ourselves needing to check\
    \ multiple values and handling each of them differently. For example:\n\n![](Images/image04628.jpeg)\n\
    \nIn the code above, we have a series of conditions checking for a value that\
    \ matches a `groceryItem` variable. Our code works fine, but imagine if we needed\
    \ to check 100 different values! Having to write that many `else if` statements\
    \ sounds like a pain!\n\nA `switch` statement provides an alternative syntax that\
    \ is easier to read and write. A `switch` statement looks like this:\n\n![](Images/image04629.jpeg)\n\
    \n![](Images/image04630.jpeg)\n\n- The `switch` keyword initiates the statement\
    \ and is followed by `( ... )`, which contains the value that each `case` will\
    \ compare. In the example, the value or expression of the `switch` statement is\
    \ `groceryItem`.\n- Inside the block, `{ ... }`, there are multiple `cases`. The\
    \ `case` keyword checks if the expression matches the specified value that comes\
    \ after it. The value following the first `case` is `'tomato'`. If the value of\
    \ `groceryItem` equalled `'tomato'`, that case’s `console.log()` would run.\n\
    - The value of `groceryItem` is `'papaya'`, so the third `case` runs—Papayas are\
    \ $1.29 is logged to the console.\n- The `break` keyword tells the computer to\
    \ exit the block and not execute any more code or check any other cases inside\
    \ the code block. Note: Without `break` keywords, the first matching case will\
    \ run, but so will every subsequent case regardless of whether or not it matches—including\
    \ the default. This behavior is different from `if/else` conditional statements\
    \ that execute only one block of code.\n- At the end of each `switch` statement,\
    \ there is a `default` statement. If none of the `cases` are true, then the code\
    \ in the `default` statement will run.\n\n### Instructions\n\n1.\nLet’s write\
    \ a `switch` statement to decide what medal to award an athlete.\n\n`athleteFinalPosition`\
    \ is already defined at the top of `main.js`. So start by writing a `switch` statement\
    \ with `athleteFinalPosition` as its expression.\n\nCheckpoint 2 Passed\nStuck?\
    \ Get a hint\n\n2.\nInside the `switch` statement, add three `cases`:\n- The first\
    \ `case` checks for the value `'first place'`\n    - If the expression’s value\
    \ matches the value of the case then `console.log()` the string `'You get the\
    \ gold medal!'`\n- The second `case` checks for the value `'second place'`\n \
    \   - If the expression’s value matches the value of the case then `console.log()`\
    \ the string `'You get the silver medal!'`\n- The third `case` checks for the\
    \ value `'third place'`\n    - If the expression’s value matches the value of\
    \ the case then `console.log()` the string `'You get the bronze medal!'`\n\nRemember\
    \ to add a `break` after each `console.log()`.\n\nCheckpoint 3 Passed\nStuck?\
    \ Get a hint\n\n3.\nNow, add a `default` statement at the end of the `switch`\
    \ that uses `console.log()` to print `'No medal awarded.'`.\n\nIf `athleteFinalPosition`\
    \ does not equal any value of our `cases`, then the string `'No medal awarded.'`\
    \ is logged to the console.\n\nRemember to add the `break` keyword at the end\
    \ of the `default` case.\n\n![](Images/image04631.jpeg)\n\n}## Review\n\nWay to\
    \ go! Here are some of the major concepts for conditionals:\n\n- An `if` statement\
    \ checks a condition and will execute a task if that condition evaluates to true.\n\
    - `if...else` statements make binary decisions and execute different code blocks\
    \ based on a condition.\n- We can add more conditions using `else if` statements.\n\
    - Comparison operators, `<`, `>`, `<= `>=`, `===`, and `!==` can compare two values.\n\
    - The logical and operator, `&&`, or \"and\", checks if both provided expressions\
    \ are truthy.\n- The logical operator `||`, or \"or\", checks if either provided\
    \ expression is truthy.\n- The bang operator, `!`, switches the truthiness and\
    \ falsiness of a value.\n- The ternary operator is shorthand to simplify concise\
    \ `if...else` statements.\n- A `switch` statement can be used to simplify the\
    \ process of writing multiple `else if` statements. The `break` keyword stops\
    \ the remaining cases from being checked and executed in a `switch` statement.\n\
    \nInstructions\n\nIn `main.js`, practice the skills you learned in this lesson.\n"
