    Checkpoint 3 Passed

    *Stuck? Get a hint


    3. Create a variable `firstPassenger` and assign the first passenger as its value
    (the element in the 0th index of the `spaceship.passengers` array you just made).
    Make sure to use bracket and dot notation to get the passenger object through
    nested access (don’t just copy the object into the variable!)

    ![](Images/image04802.jpeg)

    ![](Images/image04803.jpeg)


    ## Pass By Reference


    Objects are passed by reference. This means when we pass a variable assigned to
    an object into a function as an argument, the computer interprets the parameter
    as pointing to the space holding that object. As a result, functions which change
    object properties actually mutate the object permanently (even when the object
    is assigned to a `const` variable).


    ![](Images/image04804.jpeg)


    Our function `paintIt()` permanently changed the color our spaceship. However,
    reassignment of the spaceship variable wouldn’t work in the same way:


    ![](Images/image04805.jpeg)

    ![](Images/image04806.jpeg)


    Let’s look at what happened in the code example:


    * ![](Images/image04807.jpeg)We declared with `let`. This allowed us to reassign
    it to a new object with `identified` and `''transport type''` properties with
    no problems.

    * When we tried the same thing using a function designed to reassign the object
    passed into it, the reassignment didn’t stick (even though calling `console.log()`
    on the object produced the expected result).

    * When we passed `spaceship` into that function, `obj` became a reference to the
    memory location of the object, but not to the `spaceship` variable. This is because
    the `obj` parameter of the `tryReassignment()` function is a variable in its own
    right.

    * When we did the reassignment in the body of `tryReassignment()`, the `obj` variable
    came to refer to the memory location of the object `{''identified'': false, ''transport
    type'': ''flying''}`, while the `spaceship` variable was completely unchanged
    from its earlier value.


    ### Instructions


    1. Write a function `greenEnergy()` that has an object as a parameter and sets
    that object’s `''Fuel Type''` property to `''avocado oil''`.

    Checkpoint 2 Passed

    *Stuck? Get a hint


    2. Write a function `remotelyDisable()` that has an object as a parameter and
    sets (or reassigns) that object’s `disabled` property to `true`.

    Checkpoint 3 Passed

    *Stuck? Get a hint


    3. Call your two functions with the `spaceship` object in the code editor, then
    `console.log()` the `spaceship` object to confirm those properties were changed/added.


    ![](Images/image04808.jpeg)


