  trans: "\n\n在不是“Wednesday”的日子，`plantNeedsWater()` 应该返回 `false`：\n\n*   在 `if` 语句之后添加一个\
    \ `else` 语句。\n*   在 `else` 语句内部使用 `return` 关键字返回 `false`。\n\n检查点 4 通过\n\n卡住了？获取提示\n\
    \n### 4.\n调用 `plantNeedsWater()` 并传入 'Tuesday' 作为参数。\n\n检查点 5 通过\n\n卡住了？获取提示\n\
    \n### 5.\n让我们检查一下 `plantNeedsWater()` 是否返回了预期的值。\n\n在控制台打印 `plantNeedsWater('Tuesday')`。如果运行正常，你应该会在控制台看到输出\
    \ `false`。\n\n![](img/image04653.jpeg)\n![](img/image04654.jpeg)\n\n## 箭头函数 (row)\n\
    \nES6 引入了箭头函数语法，这是一种通过特殊的“胖箭头” `() =>` 符号编写函数的更短方式。\n\n箭头函数消除了每次需要创建函数时输入 `function`\
    \ 关键字的麻烦。相反，你首先在 `()` 中包含参数，然后添加一个指向由 `{}` 包围的函数体的箭头 `=>`，如下：\n\n![](img/image04655.jpeg)\n\
    \n熟悉函数的多种编写方式非常重要，因为在阅读其他 JavaScript 代码时会遇到每一种方式。\n\n### 指令 1.\n将 `plantNeedsWater()`\
    \ 改为箭头函数语法。\n\n![](img/image04656.jpeg)\n\n```\n};\n```\n\n## 简洁体箭头函数 (Concise\
    \ Body Arrow Functions)\n\nJavaScript 还提供了几种重构箭头函数语法的方法。函数最精简的形式被称为简洁体 (concise\
    \ body)。我们将在下面探索这些技术：\n\n1. 只有一个参数的函数不需要将参数封装在括号中。然而，如果函数有零个或多个参数，则需要括号。\n2. 由单行块组成的函数体不需要大括号。如果没有大括号，该行求值的结果将自动返回。块的内容应紧跟箭头\
    \ `=>` 之后，并且可以移除 `return` 关键字。这被称为隐式返回 (implicit return)。\n\n所以，如果我们有一个函数：\n\n\
    ![](img/image04657.jpeg)\n\n我们可以将函数重构为：\n\n```javascript\nconst squareNum = num\
    \ => num * num;\n```\n\n注意以下变化：\n\n* 删除了 `num` 周围的括号，因为它只有一个参数。\n* 删除了大括号 `{}`，因为函数由一个单行块组成。\n\
    * 删除了 `return` 关键字，因为函数由一个单行块组成。\n\n### 指令 1. \n![](img/image04658.jpeg) 让我们将其重构为简洁体。注意我们已经将\
    \ `if/else` 语句转换为三元运算符，使代码只有单行。\n\n```javascript\nconst plantNeedsWater = day\
    \ => day === 'Wednesday' ? true : false;\n```\n\n## 复习函数 (Review Functions)\n\n\
    为自己拍个掌吧，你刚刚掌握了函数！在本节中，我们涵盖了关于函数的一些重要概念：\n\n*   函数是一个可重用的代码块，它将一组语句组合以执行特定任务。\n\
    *   函数声明 (function declaration)：\n*   参数 (parameter) 是函数块内部的命名变量，在函数调用时会被赋予传入参数的值：\n\
    *   在代码中调用函数：\n*   ES6 通过默认参数 (default parameters) 引入了处理任意参数的新方法，允许我们在没有向函数传递参数的情况下为参数分配默认值。\n\
    *   要从函数返回值，我们使用 `return` 语句。\n*   使用函数表达式 (function expressions) 定义函数：\n*   使用函数表达式定义函数：\n\
    \n意识到函数表达式、箭头函数和声明之间的区别是非常重要的。\n\n可以使用箭头符号来定义函数。了解函数类型是有好处的\n\n## 作用域 (Scope)\n\
    \n作用域是我们变量声明的上下文。我们考虑作用域是因为它定义了变量可以在哪里被引用。\n\n在全局作用域 (global scope) 中，变量在块之外声明。这些变量被称为全局变量。由于全局变量没有绑定在块内部，程序的任何代码都可以访问它们。\n\
    \n让我们来看全局作用域的例子：\n\n![](img/image0463.jpeg)\n\n* 尽管 `color` 变量定义在块之外，但在函数块中也可以访问，赋予了它全局作用域。\n\
    * 反之，`color` 可以在 `returnSkyColor` 函数内部访问。\n\n让我们处理全局变量，看看数据如何从程序的任何地方进行访问。\n\n\
    ## 块与作用域 (Blocks and Scope)\n\n在讨论作用域之前，我们首先需要讨论块 (blocks)。我们已经在函数和 `if` 语句中使用过块。块是一组\
    \ `{}`，帮助我们将一个或多个语句组合在一起。\n\n注意函数体实际上是一个块：![](img/image0465.jpeg)\n\n在下一个练习中，我们将看到块是如何定义作用域的。\n\
    \n"
- fmt: "\n![](Images/image04665.jpeg) `function`, use `console.log()` to log the value\
    \ of `callMyNightSky()` to the console.\n\nYou’ll notice that the function block\
    \ for `callMyNightSky()` is able to access the global variables freely since the\
    \ variables are available to all lines of code in the file.\n\n![](Images/image04666.jpeg)\n\
    \n# Block Scope\n\nThe next context we’ll cover is block scope. When a variable\
    \ is defined inside a block, it is only accessible to the code within the curly\
    \ braces `{}`. We say that variable has block scope because it is only accessible\
    \ to the lines of code within that block.\n\nVariables that are declared with\
    \ block scope are known as local variables because they are only available to\
    \ the code that is part of the same block.\n\nBlock scope works like this:\n\n\
    ![](Images/image04667.jpeg)\n\nYou’ll notice:\n\n*   We define a function `logSkyColor()`.\n\
    *   Within the function, the `color` variable is only available within the curly\
    \ braces of the function.\n*   If we try to log the same variable outside the\
    \ function, throws a `ReferenceError`.\n\n## Instructions 1\n\n1. In `main.js`,\
    \ define a function `logVisibleLightWaves()`.\n   Checkpoint 2 Passed\n   Stuck?\
    \ Get a hint\n\n2. Within the `logVisibleLightWaves()` function, using `const`,\
    \ create a variable `lightWaves` and set it equal to `'Moonlight'`.\n   Checkpoint\
    \ 3 Passed\n\n3. Within the `logVisibleLightWaves()` function, beneath the `lightWaves`\
    \ variable, add a `console.log()` statement that will log the value of the `lightWaves`\
    \ variable when the function runs.\n   Checkpoint 4 Passed\n   Stuck? Get a hint\n\
    \n4. Call the `logVisibleLightWaves()` function from outside the function.\n \
    \  Checkpoint 5 Passed\n   Stuck? Get a hint\n\n5. Beneath the function call,\
    \ log the value of `lightWaves` to the console from outside the function.\n\n\
    You’ll notice that it logs a `ReferenceError` since the variable is tied to the\
    \ block scope of the function!\n\n![](Images/image04668.jpeg)\n\n# Scope Pollution\n\
    \nIt may seem like a great idea to always make your variables accessible, but\
    \ having too many global variables can cause problems in a program.\n\nWhen you\
    \ declare global variables, they go to the global namespace. The global namespace\
    \ allows the variables to be accessible from anywhere in the program. These variables\
    \ remain there until the program finishes which means our global namespace can\
    \ fill up really quickly.\n\nScope pollution is when we have too many global variables\
    \ that exist in the global namespace, or when we reuse variables across different\
    \ scopes.\n\nScope pollution makes it difficult to keep track of our different\
    \ variables and sets us up for potential accidents. For example, globally scoped\
    \ variables can collide with other variables that are more locally scoped, causing\
    \ unexpected behavior in our code.\n\nLet’s look at an example of scope pollution\
    \ in practice so we know how to avoid it:\n\n![](Images/image04669.jpeg)\n\nYou’ll\
    \ notice:\n\n*   We have a variable `num`.\n*   Inside the function body of `logNum()`,\
    \ we want to declare a new variable but forgot to use the `let` keyword.\n*  \
    \ When we call `logNum()`, `num` gets reassigned to `100`.\n*   The reassignment\
    \ inside `logNum()` affects the global variable `num`.\n*   Even though the reassignment\
    \ is allowed and we won’t get an error, if we decided to use `num` later, we’ll\
    \ unknowingly use the new value of `num`.\n\nWhile it’s important to know what\
    \ global scope is, it’s best practice to not define variables in the global scope.\n\
    \n## Instructions\n\n1. Let’s see what happens if we create a variable that overwrites\
    \ a global variable. Inside the `callMyNightSky()` function, on the very first\
    \ line of the function body, assign the variable `stars` to `'Sirius'` as such:\n\
    \n![](Images/image04670.jpeg)\n   Checkpoint 2 Passed\n\n2. Outside the function,\
