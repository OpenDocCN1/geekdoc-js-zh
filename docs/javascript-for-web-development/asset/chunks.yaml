  trans: "\n编写一个高阶函数 `checkConsistentOutput()`。该函数应该有两个参数：一个函数和一个值。它应该调用两次参数 `function`\
    \ 并传入 `value`。如果回调函数两次产生相同的结果，则它应该返回函数调用的结果；否则，它应该返回字符串 'This function returned\
    \ inconsistent results'。\n\n检查点 3 已通过\n\n卡住了？获取提示\n\n### 3. \n\n使用我们写的 `addTwo()`\
    \ 函数和数字作为参数，调用你的 `checkConsistentOutput()`。\n\n![](img/image04744.jpeg)\n\n![](img/image04745.jpeg)\n\
    \n## 复习\n\n干得好！通过将函数视为数据并学习高阶函数，你已经在编写清洁、模块化的代码以及利用 JavaScript 的灵活性方面迈出了重要一步。\n\
    \n让我们回顾一下本节学到的：\n\n• 抽象允许我们以一种易于人类读者复用、调试和理解的方式编写复杂的代码\n• 我们可以像处理任何其他类型的数据一样处理函数，包括将其重新赋值给新变量\n\
    • JavaScript 函数是一等类对象，因此它们像像其他对象一样拥有属性和方法\n• 函数可以作为参数传递给其他函数\n• 高阶函数是指一个接受函数作为参数、返回一个函数或两者兼具的函数\n\
    \n## 迭代器简介\n\n假设你有一份购物清单，你想知道列表上的每个项目是什么。你必须扫描每一行并检查该项目。\n\n这项常见任务与我们想要遍历或循环数组时需要做的事情相似。我们可以使用的工具之一是\
    \ `for` 循环。\n\n然而，我们也可以访问内置的数组方法，这些方法让循环变得更容易。\n\n帮助我们迭代的 JavaScript 内置数组方法被称为迭代方法，有时称为迭代器。迭代器是在数组上调用的方法，用于操作元素并返回值。\n\
    \n在本节中，你将学习这些方法的语法、返回值、如何使用文档来理解它们，以及如何为特定任务选择正确的迭代方法。\n\n### 指令\n\n检查 `main.js`\
    \ 中的代码。注意在数组上调用的不同方法：\n\n• `.forEach()`\n• `.map()`\n• `.filter()`\n\n运行代码查看输出！\n\
    \n![](img/image04746.jpeg)\n\n![](img/image04747.jpeg)\n\n### .forEach() 方法\n\n\
    我们将学习的第一个迭代方法是 `.forEach()`。顾名其实名，`.forEach()` 将为数组的每个元素执行相同的代码。\n\n上面的代码将在控制台中打印出一份格式良好的杂货列表。让我们探索调用\
    \ `.forEach()` 的语法。\n\n• `groceries.forEach()` 调用了 `groceries` 数组上的 `forEach`\
    \ 方法。\n• `.forEach()` 接受一个回调函数作为参数。记住，回调函数是作为参数传递给另一个函数。\n• `.forEach()` 遍历数组并为每个元素执行回调函数。在每次执行期间，当前元素将作为参数传递给回调函数。\n\
    • `.forEach()` 的返回值始终是 `undefined`。\n\n另一种为 `.forEach()` 传递回调函数的方法是使用箭头函数语法。\n\
    \n```javascript\ngroceries.forEach(groceryItem => console.log(groceryItem));\n\
    ```\n\n我们也可以预先定义一个函数作为回调函数。\n\n![](img/image04748.jpeg)\n\n![](img/image04749.jpeg)\n\
    \n上面的示例使用了函数声明，但你也可以使用函数表达式或箭头函数。这三个代码段的作用是相同的。在每个数组迭代方法中，我们都可以使用这三个示例中的任何一个将回调函数作为参数提供给迭代器。意识到在迭代器中传递回调函数作为参数的不同方式是有好的，因为开发者有不同的风格偏好。尽管如此，由于\
    \ ES6 的广泛采用，我们将在后的练习中使用箭头函数语法。\n\n### 指令 1.\n\n遍历 `fruits` 数组，并在控制台打印 \"I want\
    \ to eat \" 加上每个水果的名字。例如，I want to eat a mango。\n\n你可以使用你喜欢的任何形式的回调。\n\n![](img/image04750.jpeg)\n\
    \n### .map() 方法\n\n我们将涵盖的第二个迭代器是 `.map()`。当在数组上调用 `.map()` 时，它接受一个回调函数作为参数并返回一个新数组！看一眼调用\
    \ `.map()` 的示例：\n\n![](img/image04751.jpeg)\n\n![](img/image04752.jpeg)\n\n它的工作方式与\
    \ `.forEach()` 类似——主要区别是 `.map()` 返回一个新的数组。\n\n在上面的示例中：\n\n• `numbers` 是一个数字数组。\n\
    • `bigNumbers` 将存储在 `numbers` 上调用 `.map()` 的返回值。\n• `numbers.map` 将遍历 `numbers`\
    \ 数组中的每个元素并将元素传递给回调函数。\n• `return number * 10` 是我们希望对数组中的每个元素执行的代码。这会将 `numbers`\
    \ 数组中的每个值乘以 10 并保存到新数组。\n\n如果我们查看 `numbers` 和 `bigNumbers`：\n\n![](img/image04753.jpeg)\n\
    \n注意 `numbers` 中的元素没有被修改，而 `bigNumbers` 是一个新数组。\n\n### 指令 1.\n\n在 `animals` 数组下方、`console.log(secretMessage.join(''));`\
    \ 行之前添加你的代码。\n\n使用 `.map()` 创建一个新的数组，包含 `animals` 数组中每个字符串的第一个字符。将新数组保存到名为 `secretMessage`\
    \ 的 `const` 变量中。\n\n检查点 2 已通过\n\n卡住了？获取提示\n\n2.\n\n使用 `.map()` 将 `bigNumbers`\
    \ 中的所有数字除以 100。将返回值保存到用 `const` 声明的变量 `smallNumbers` 中。\n\n![](img/image04754.jpeg)\n\
    \n### .filter() 方法\n\n另一个实用的迭代方法是 `.filter()`。与 `.map()` 类似，`.filter()` 返回一个新的数组。然而，`.filter()`\
    \ 返回从原始数组中过滤掉某些元素后的元素数组。`.filter()` 方法的回调函数应该根据传递它的元素返回 `true` 或 `false`。导致回调函数返回\
    \ `true` 的元素会被添加到新数组中。看下面的示例：\n\n![](img/image04755.jpeg)\n\n• ![](img/image04756.jpeg)\
    \ `words` 是一个包含字符串元素的数组。\n• `const shortWords=` 声明了一个新变量，将存储调用 `.filter()` 返回的数组。\n\
    • 回调函数是一个箭头函数，有一个参数 `word`。`words` 数组中的每个元素将作为参数传递给此函数。\n• ![](img/image04757.jpeg)\
    \ 是回调函数中的条件。`words` 数组中任何长度少于 6 字符的单词将被添加到 `shortWords` 数组中。\n\n让我们也检查 `words`\
    \ 和 `shortWords` 的值：\n\n![](img/image04758.jpeg)\n\n观察 `words` 如何没有被改变（即修改），而\
    \ `shortWords` 是一个新数组。\n\n### 指令 1.\n\n在 `randomNumbers` 上调用 `.filter()` 方法，返回小于\
    \ 250 的值。将它们保存到一个名为 `smallNumbers` 的新数组（用 `const` 声明）。\n\n2.\n\n现在让我们处理字符串数组。在\
    \ `favoriteWords` 数组上调用 `.filter()`，返回长度大于 7 个字符的元素。将返回的数组保存到一个名为 `longFavoriteWords`\
    \ 的 `const` 变量中。\n\n![](img/image04759.jpeg)\n\n![](img/image04760.jpeg)\n\n.findIndex()\
    \ 方法\n"
- fmt: "\nWe sometimes want to find the location of an element in an array. That’s\
    \ where the `.findIndex()` method comes in! Calling `.findIndex()` on an array\
    \ will return the index of the first element that evaluates to `true` in the callback\
    \ function.\n\n![](Images/image04761.jpeg)\n\n* `jumbledNums` is an array that\
    \ contains elements that are numbers.\n* `const lessThanTen` declares a new variable\
    \ that stores the returned index number from invoking `.findIndex()`.\n* The callback\
    \ function is an arrow function has a single parameter, `num`.\n\nEach element\
    \ in the `jumbledNums` array will be passed to this function as an argument.\n\
    \n* `num < 10` is the condition that elements are checked against. `.findIndex()`\
    \ will return the index of the first element which evaluates to `true` for that\
    \ condition.\n\nLet’s take a look at what `lessThanTen` evaluates to:\n\n```javascript\n\
    console.log(lessThanTen); // Output: 3\n```\n\nIf we check what element has index\
    \ of 3:\n\n```javascript\nconsole.log(jumbledNums[3]); // Output: 5\n```\n\nGreat,\
    \ the element in index 3 is the number 5. This makes sense since 5 is the first\
    \ element that is less than 10.\n\nIf there isn’t a single element in the array\
    \ that satisfies the condition in the callback, then `.findIndex()` will return\
    \ `-1`.\n\n![](Images/image04762.jpeg)\n![](Images/image04763.jpeg)\n\n### Invoke\n\
    \nInvoke ![](Images/image04764.jpeg) on the `animals` array to find the index\
    \ of the element that has the value 'elephant' and save the returned value to\
    \ a `const` variable named `foundAnimal`.\n\n**Checkpoint 2 Passed**\nStuck? Get\
    \ a hint\n\n2. Let’s see if we can find the index of the first animal that starts\
    \ with the letter 's'. Call `.findIndex()` on the `animals` array return the index\
    \ of the first element that starts with 's'. Assign the returned value to a `const`\
    \ variable named `startsWithS`.\n\n![](Images/image04765.jpeg)\n\n### The .reduce()\
    \ Method\n\nAnother widely used iteration method is `.reduce()`. The `.reduce()`\
    \ method returns a single value after iterating through the elements of an array,\
    \ thereby reducing the array. Take a look at the example below:\n\n![](Images/image04766.jpeg)\n\
    ![](Images/image04767.jpeg)\n![](Images/image04768.jpeg) Here are the values of\
    \ the `numbers` array:\n\n| Iteration | accumulator | currentValue | return value\
    \ |\n| :--- | :--- | :--- | :--- |\n| First | 1 | 2 | 3 |\n| Second | 3 | 4 |\
    \ 7 |\n| Third | 7 | 10 | 17 |\n\nNow let’s go over the use of `.reduce()` from\
    \ the example above:\n\n* `numbers` is an array that contains numbers.\n* `summedNums`\
    \ is a variable that stores the returned value of invoking `.reduce()` on `numbers`.\n\
    * `numbers.reduce()` calls the `.reduce()` method on the `numbers` array and takes\
    \ in a callback function as argument.\n* The callback function has two parameters,\
    \ `accumulator` and `currentValue`. The value of `accumulator` starts off as the\
    \ value of the first element in the array and the `currentValue` starts as the\
    \ second element. To see the value of `accumulator` and `currentValue` change,\
    \ review the chart above.\n* As `.reduce()` iterates through the array, the return\
    \ value of the callback function becomes the `accumulator` value for the next\
    \ iteration, `currentValue` takes on the value of the current element in the looping\
    \ process.\n\nThe `.reduce()` method can also take an optional second parameter\
    \ to set an initial value for `accumulator` (remember, the first argument is the\
    \ callback function!). For instance:\n\n![](Images/image04769.jpeg)\n![](Images/image04770.jpeg)\n\
    \nHere’s an updated chart that accounts for the second argument of 100:\n\n| Iteration\
    \ # | accumulator | currentVal | return value |\n| :--- | :--- | :--- | :--- |\n\
    | First | 100 | 1 | 101 |\n| Second | 101 | 2 | 103 |\n| Third | 103 | 4 | 107\
    \ |\n| Fourth | 107 | 10 | 117 |\n\n### Instructions\n\n1. Let’s practice calling\
    \ `.reduce()` and using `console.log()` to check the values as `.reduce()` iterates\
    \ through the array. In `main.js`, there is an array of numbers, `newNumbers`.\n\
    \nTo start, declare a new variable named `newSum` using the `const` keyword. Assign\
    \ to `newSum` the value of calling `.reduce()` on `newNumbers`. You’ll also see\
    \ a `TypeError: undefined is not a function` but we’ll fix that.\n\n**Checkpoint\
    \ 2 Passed**\nStuck? Get a hint\n\n2. Provide `.reduce()` with a callback function.\
    \ The callback has two parameters. The first parameter is `accumulator` and the\
    \ second is `currentValue`.\n\n**Checkpoint 3 Passed**\nStuck? Get a hint\n\n\
    3. To check the value as we iterate through the array, add three statements to\
    \ the callback body:\n* `console.log('The value of accumulator:', accumulator);`\n\
    * `console.log('The value of currentValue:', currentValue);`\n* `return accumulator;`\n\
    \n**Checkpoint 4 Passed**\nStuck? Get a hint\n\n![](Images/image04771.jpeg)\n\n\
    4. In the last line of `main.js`, there is this code:\n```javascript\nnewNumbers.reduce((accumulator,\
    \ currentValue) => {\n  // ...\n})\n```\nComplete the code between the parentheses\
    \ to check if every element has more than 5 characters. Make sure to uncomment\
    \ (delete the `//` before) the last line of the program before you run the code.\n\
    \n**Checkpoint 5 Passed**\n"
