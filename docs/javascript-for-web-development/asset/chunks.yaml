    \  will  add 30  to  _energyLevel.\n\nWhat  will  happen  now that  _energyLevel\
    \  isn’t  a  number?  Call  .recharge()  on  robot  to  find  out.\n\nNotice that\
    \ a funky string is printed to the console! This is known as a side-  effect of\
    \ type-coercion. No need to worry about what this means for now,  but it’s important\
    \ to understand that you can cause unwanted side-effects  when  mutating objects\
    \ and  their properties.\n\n![](Images/image04827.jpeg)\n\nGetters\n\nGetters\
    \ are methods that get and return the internal properties of an object.  But they\
    \ can do more than just retrieve the value of a property! Let’s take a  look \
    \ at a  getter  method:\n\n![](Images/image04828.jpeg)\n\n![](Images/image04829.jpeg)\n\
    \nNotice  that in  the getter  method above:\n\n![](Images/image04830.jpeg)• We\
    \  use  the\n\n• We use an  both\n\nkeyword followed by a function.  conditional\
    \  to check if\n\nand  _lastName  exist (by making  sure  they  both return\n\n\
    truthy values) and then return a different value depending on the  result.\n\n\
    • We  can access  the calling object’s  internal properties using  this.\n\nIn\
    \  fullName, we’re  accessing  both  this._firstName  and  this._lastName.\n\n\
    • In  the  last  line we  call  fullName  on  person. In  general, getter methods\
    \  do not need to be called with a set of parentheses. Syntactically, it  looks\
    \  like we’re accessing a property.\n\nNow that we’ve gone over syntax, let’s\
    \ discuss some notable advantages of  using  getter  methods:\n\n• Getters  can\
    \  perform an  action on  the data  when getting  a  property.\n\n• Getters  can\
    \  return different  values  using conditionals.\n\n• In a getter, we can access\
    \ the properties of the calling object  using  this.\n\n• The functionality of\
    \ our code is easier for other developers to  understand.\n\nAnother thing to\
    \ keep in mind when using getter (and setter) methods is  that properties cannot\
    \ share the same name as the getter/setter function. If  we  do so,  then calling\
    \  the  method will result in  an infinite call stack  error.\n\nOne workaround\
    \ is to add an underscore before the property name like we  did  in the  example\
    \ above.\n\nGreat,  let’s  go getter!\n\nInstructions  1.\n\nIn  robot,  create\
    \  a getter  method  named  energyLevel  using the  get  keyword.  Leave  function\
    \ body  blank for now.\n\n Checkpoint 2 Passed\n\nStuck?  Get a hint\n\n2.\n\n\
    Inside the getter method, add an  if  statement to check\n\nif  this._energyLevel\
    \  is  a  number using  the  typeof  operator. If  that  condition  is  truthy,\
    \  return  'My  current energy  level  is ENERGYLEVEL'.\n\nReplace  ENERGYLEVEL\
    \  with  the  value of  this._energyLevel.\n\nMake  sure  you  return the  string\
    \  and not  logging it  to the  console.\n\n Checkpoint 3 Passed\n\nStuck?  Get\
    \ a hint\n\n3.\n\nIf  this._energyLevel  isn’t  a  number  it  could  be  that\n\
    \nthe  _energyLevel  property  was  altered. Let’s  add a default  return  statement\
    \  for  when such a scenario arises.\n\nAdd  an  else  statement  that returns\
    \  'System  malfunction: cannot  retrieve  energy  level'.\n\n Checkpoint 4 Passed\n\
    \nStuck?  Get a hint\n\n4.\n\nLog the  result  of calling  the getter method \
    \ energyLevel  on  robot  to  the  console.\n\nNotice that the method will return\
    \ a formatted response rather than just  accessing  a property!\n\n![](Images/image04831.jpeg)\n\
    \n![](Images/image04832.jpeg)\n\nSetters\n\nAlong with getter methods, we can\
    \ also create setter methods which  reassign values of existing properties within\
    \ an object. Let’s see an example  of a setter  method:\n\n![](Images/image04833.jpeg)\n\
    \nNotice  that in  the example above:\n\n• We can perform a check for what value\
