  trans: "\n\n-   为了利用并发性，我们可以使用 `Promise.all()`。\n\n# ASYNC AWAIT（异步等待）\n\n## 简介\n\
    \n在 Web 开发中，我们经常需要处理异步操作——即我们可以在等待这些操作的同时继续执行其他任务的操作。我们会向网络、数据库或任何类似的操作发送请求。JavaScript\
    \ 是非阻塞的：它在等待时不会停止代码执行，而是使用一个[事件循环](https://youtu.be/8aGhZQkoFbQ)，允许它在等待这些异步操作完成的同时，高效地执行其他任务。\n\
    \n最初，JavaScript 使用回调函数来处理异步操作。回调函数的问题在于它们会鼓励复杂的嵌套代码，这些代码很快变得难以阅读、调试和扩展。通过 ES6，JavaScript\
    \ 集成了原生的 [promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)，允许我们编写可读性显著许多代码。JavaScript\
    \ 正在不断改进，而 [ES8](https://en.wikipedia.org/wiki/ECMAScript#8th_Edition_-_ECMAScript_2017)\
    \ 为处理异步操作提供了一种新语法：async...await。`async...await` 语法允许我们编写读起来类似于传统的同步命令式程序的异步代码。\n\
    \n`async...await` 语法是[语法糖](https://en.wikipedia.org/wiki/Syntactic_sugar)——它并没有为语言引入新功能，而是引入了使用\
    \ promises 和 [generators](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator)\
    \ 的新语法。这两者已经内置在语言中了。尽管如此，`async...await` 极大地提高了我们代码的可读性和扩展性。让我们学习如何使用它吧！\n\n##\
    \ Instructions 1\n\n![](img/image04993.jpeg)在本节中，你将获得一个代码编辑器来编写代码以及一个 bash 终端来执行代码。要运行你的程序，你需要在终端中输入\
    \ `node` ![](img/image04994.jpeg)app.js 并按回车。你将点击“Check Work”按钮提交代码进行评估。\n\n查看我们提供的代码。它展示了完成相同任务的三种方法：按照指定的顺序读取并打印两个文件的内容：\n\
    \n* 第一版本使用回调函数。\n* 第二版本使用原生的 promise 语法。\n* 第三版本使用 `async...await`。\n\n![](img/image04995.jpeg)不要担心理解\
    \ `async...await` 语法——那是你在本节中要学的！如果你还没有操作，请在终端输入 `node app.js` 并按回车。然后点击“Check\
    \ Work”。\n\n![](img/image04996.jpeg) ![](img/image04997.jpeg) ![](img/image04998.jpeg)\
    \ ![](img/image04999.jpeg)\n\n```javascript\nreadFiles();\n\nconst fs = require('fs');\n\
    \nconst promisifiedReadfile = require('./promisifiedReadfile');\n\n// 这里我们使用 fs.readFile()\
    \ 和回调函数: \nfs.readFile('./file.txt', 'utf-8', (err, data) => {\n  if (err) throw\
    \ err;\n  let firstSentence = data;\n  fs.readFile('./file2.txt', 'utf-8', (err,\
    \ data) => {\n    if (err) throw err;\n    let secondSentence = data;\n    console.log(firstSentence,\
    \ secondSentence);\n  });\n});\n\n// 这里我们使用原生 promises 和我们“承诺化”后的 readfile 版本:\n\
    let firstSentence;\n\npromisifiedReadfile('./file.txt', 'utf-8')\n  .then((data)\
    \ => {\n    firstSentence = data;\n    return promisifiedReadfile('./file2.txt',\
    \ 'utf-8');\n  })\n  .then((data) => {\n    let secondSentence = data;\n    console.log(firstSentence,\
    \ secondSentence)\n  })\n  .catch((err) => {\n    console.log(err)\n  });\n\n\
    // 这里我们再次使用 promisifiedReadfile()，但不是使用原生的 promise .then() 语法\n// 而是声明并调用了一个 async/await\
    \ 函数：\nasync function readFiles() {\n  let firstSentence = await promisifiedReadfile('./file.txt',\
    \ 'utf-8');\n  let secondSentence = await promisifiedReadfile('./file2.txt', 'utf-8');\n\
    \  console.log(firstSentence, secondSentence);\n}\n```\n\n![](img/image05000.jpeg)\n\
    \n## The async Keyword\n\n`async` 关键字用于编写处理异步操作的函数。我们将异步逻辑封装在一个带有 `async` 关键字的函数内部。然后，调用该函数。\n\
    \n![](img/image05001.jpeg)\n\n在本节中我们将一直使用 `async` 函数声明，但我们也可以创建 `async` 函数表达式：\n\
    \n![](img/image05002.jpeg)\n\n`async` 函数总是返回一个 promise。这意味着我们可以在 `async` 函数中使用传统的\
    \ promise 语法，如 `.then()` 和 `.catch`。一个 `async` 函数将以三种方式之一返回：\n\n* 如果函数没有返回任何内容，它将返回一个解析值为\
    \ `undefined` 的 promise。\n* 如果从函数返回了一个非 promise 的值，它将返回一个解析为该值的 promise。\n* 如果从函数返回了一个\
    \ promise，它将直接返回该 promise。\n\n![](img/image05003.jpeg) ![](img/image04825.jpeg)![](img/image04825.jpeg)当我们调用时解析为\
    \ 5 的值时，实际返回了什么。\n\n让我们写一个 `async` 函数吧！\n\n在函数体内部，是一个带有...的 promise\n\n![](img/image05004.jpeg)\n\
    \n## Instructions 1\n\n1. 我们提供了一个函数 `withConstructor()`，它接收一个数字。如果数字为 0，它将返回一个解析为字符串\
    \ `'zero'` 的 promise。如果数字不是 0，它将返回一个解析为字符串 `'not zero'` 的 promise。花点时间理解这个函数以及后续的代码。\n\
    \n![](img/image05005.jpeg)当你准备好运行它时，在终端输入 `node app.js` 并按回车。\n\nCheckpoint 2\
    \ Passed.\n\n2. 编写一个 `async` 函数 `withAsync()`，重现 `withConstructor()` 的功能。虽然你的函数会返回一个\
    \ promise，但你不应该使用 `new` 关键字来构造 promise。相反，它应该依赖于 `async` 函数会自动返回 promise 这一事实。\n\
    \n准备好后，检查你的工作以进入下一步。\n\nCheckpoint 3 Passed.\n\n卡住了？获取提示。\n\n3. ![](img/image05006.jpeg)现在测试你的代码！取消我们在\
    \ `app.js` 底部编写的代码的注释。在终端中，输入 `node app.js` 并按回车执行\n\n![](img/image05007.jpeg)\
    \ ![](img/image05008.jpeg)\n\n## The await 运算符\n\n在上一个练习中，我们涵盖了 `async` 关键字。它本身没做什么；`async`\
    \ 函数几乎总是与函数体内部的 `await` 关键字配合。\n\n`await` 关键字只能在 `async` 函数内部使用。`await` 是一个运算符：它返回\
    \ promise 的解析值。由于 promise 的解析需要不确定的时间，`await` 会停止（暂停）我们异步函数的执行，直到给定的 promise 解析完成。\n\
    \n在大多数情况下，我们处理的是从函数返回的 promise。通常，这些函数通过库提供，在本节中，我们将提供它们。我们可以在 async 函数内部 `await`\
    \ 它所返回的 promise 的解析。在下面的示例中，`myPromise()` 是一个返回 promise 的函数，该 promise 将解析为字符串\
    \ \"I am resolved now!\"。\n\n![](img/image05009.jpeg)\n\n在我们的异步函数 `asyncFuncExample()`\
    \ 中，我们使用 `await` 暂停执行，直到 `myPromise()` 解析完成，并将其解析值赋值给变量 `resolvedValue`。然后我们在控制台中打印\
    \ `resolvedValue`。我们能够以一种类似于同步代码的方式来处理 promise 的逻辑。\n\n## Instructions 1\n\n在提供的代码中，我们在函数中引入了\
    \ `brainstormDinner()`。该函数不接受参数，并返回一个新的解析值为代表晚餐的字符串的 promise。（你可以导航到 `library.js`\
    \ 文件查看该函数的代码。）\n\n"
