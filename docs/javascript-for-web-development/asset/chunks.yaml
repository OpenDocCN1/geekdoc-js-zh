  trans: "\n\n查看 `app.js` 中的 `nativePromiseDinner()` 函数。花一点时间理解此函数并预测其预期的结果。在下一步中，你将使用\
    \ `async...await` 而不是原生承诺（promises）来重新实现它的功能。\n\n不需要执行 `nativePromiseDinner()`\
    \ 函数，但如果你想执行，可以查看提示以获取指导。准备好进入下一步时，点击“Check Work（检查作业）”。\n\n**检查点 2 已通过**\n\n\
    卡住了？获取提示\n\n### 2.\n\n填充 `announceDinner()` 函数的函数体，使其具有与 `nativePromiseDinner()`\
    \ 相同的功能。它应该等待 `brainstormDinner()` 返回的 promise 解决（resolve），然后向 `console` 打印一个与\
    \ `nativePromiseDinner()` 格式相同的字符串。你需要在函数内部使用 `await` 算符。\n\n准备就绪后，检查你的工作以进入下一步。\n\
    \n**检查点 3 已通过**\n\n卡住了？获取提示\n\n### 3.\n\n在 `app.js` 的底部、函数声明下方，调用 `announceDinner()`\
    \ 函数。\n\n**检查点 4 已通过**\n\n卡住了？获取提示\n\n### 4.\n\n![](img/image05010.jpeg)在终端输入\
    \ `node app.js` 并按回车执行你的代码。\n\n![](img/image05011.jpeg)\n\n 编写异步函数\n\n我们已经看到 `await`\
    \ 关键字会停止 `async` 函数的执行，直到 promise 不处于等待状态（pending）。不要忘记 `await` 关键字！这看起来可能显而易见，但这是一个很难发现的错误，因为我们的函数仍然运行——只是没有预期的结果。\n\
    \n我们将使用以下函数来探索这一点，该函数返回一个在延迟 1 秒后后解决为 'Yay, I resolved!' 的 promise：\n\n![](img/image05012.jpeg)\n\
    \n现在我们将编写两个调用 `myPromise()` 的异步函数：\n\n![](img/image05013.jpeg)\n\n在第一个异步函数 `noAwait()`\
    \ 中，我们在 `myPromise()` 之前漏掉了 `await` 关键字。在第二个函数 `yesAwait()` 中，我们包含了它。\n\n`noAwait()`\
    \ 函数向控制台输输了 `Promise { <pending> }`。由于没有 `await` 关键字，函数执行没有暂停。\n\n下一行的 `console.log()`\
    \ 在 promise 解决之前就被执行了。\n\n记住 `await` 算符返回 promise 的解决值。当在 `yesAwait()` 中正确使用时，变量\
    \ `value` 被赋值为 `myPromise()` promise 的解决值，而在 `noAwait()` 中，`value` 被赋值为 promise\
    \ 对象本身。\n\n#### 指南 1.\n\n查看提供的代码。我们从 `library.js` 引入了 `shopForBeans()` 函数，该函数返回一个\
    \ promise，其解决值为代表豆的类型的字符串，例如‘kidney’（红豆）。\n\n接下来，我们声明了 `getBeans()` 函数。让我们总结一下它的预期功能：\n\
    \n* 向 `console` 打印 '1. Heading to the store to buy beans...'。\n* 捕获调用 `shopForBeans()`\
    \ 时返回的 promise 的解决值。\n* `shopForBeans()` 返回的 promise 会打印一个格式为 '2. I bought [the\
    \ resolved type of beans] beans because they were on sale.' 的字符串。\n* 最后，函数向 `console`\
    \ 打印一个格式为 '3. Great! I'm making [the bean type] beans for dinner tonight!' 的字符串。\n\
    \n在终端中执行 `app.js` 以查看 `getBeans()` 是否按预期工作。\n\n**检查点 2 已通过**\n\n卡住了？获取提示\n\n###\
    \ 2.\n\n噢噢，`getBeans()` 正向 `console` 打印 '3. Great! I'm making [object Promise]\
    \ beans for dinner tonight!'。花一点时间理解为什么发生这种情况，然后重构 `getBeans()` 使其按预期工作。准备好进入下一步时，检查你的工作。\n\
    \n**检查点 3 已通过**\n\n卡住了？获取提示\n\n### 3.\n\n为了测试代码现在是否正常运行，再次在终端中执行 `app.js`。\n\n\
    ![](img/image05014.jpeg)\n\n![](img/image05015.jpeg)\n\n#### 处理依赖性 promise\n\n\
    `async...await` 的真正之处在于当我们有一系列相互依赖的异步操作时。例如，我们可能会根据数据库查询来发送网络请求。在这种情况下，我们需要等待获取数据库结果后才能发送网络请求。使用原生\
    \ promise 语法，我们使用 `.then()` 函数链，并确保每个函数都正确返回：\n\n![](img/image05016.jpeg) 让我们分析一下\
    \ `nativeVersion()` 中发生了什么：\n\n* 在函数内部我们使用了两个函数：`returnsPromise()` 和 `returnsPromise()`。\n\
    * 我们调用 `returnsPromise()` 并使用 `.then()` 确保第一个 promise 解决。\n* 在 `.then()` 的回调函数中，我们打印第一个\
    \ promise 的解决值 `firstValue`，然后执行 `returnsPromise(firstValue)`。\n\n017.jpeg) 让我们分析一下我们的\
    \ `asyncVersion()` 中发生了什么：\n\n* 我们将函数标记为 `async`。\n* 在函数内部，我们创建一个变量 `firstValue`\
    \ 并将其赋值为 `await returnsPromise()`。这意味着 `firstValue` 被赋值为 promise 的解决值。\n* 接下来，我们打印\
    \ `firstValue`。\n* 然后，我们创建一个变量 `secondValue` 并将其赋值为 `await returnsPromise(firstValue)`。因此，`secondValue`\
    \ 被赋值为 promise 的解决值。\n* 最后，我们打印 `secondValue`。\n\n虽然 `async...await` 语法可以节省一些输入工作，但长度的减少并不是重点。鉴于这两个版本的函数，`async`\
    \ 版本更接近同步代码，这有助于开发者维护和调试他们的代码。\n\n#### 指南 1.\n\n查看提供的代码。我们引入了三个函数：`shopForBeans()`、`soakTheBeans()`\
    \ 和 `cookTheBeans()`。这些函数每个返回一个 promise。\n\n* `shopForBeans()` 不接受参数，并返回一个解决为豆的类型字符串的\
    \ promise。\n* `soakTheBeans()` 接受一个豆类型字符串作为参数，并返回一个指示豆子是否变软的 promise。\n* `cookTheBeans()`\
    \ 接受一个布尔值作为参数，如果该值为 true，则返回一个解决为宣布晚餐已就好的字符串的 promise。\n\n如果你愿意，可以查看 `library.js`\
    \ 文件以了解这些函数是如何工作的。点击“Check Work”进入下一步。\n\n**检查点 2 已通过**\n\n### 2.\n\n在接下来的检查点中，你将创建一个\
    \ `async` 函数来处理我们刚刚介绍的三个依赖 promise。它将模拟买豆、浸泡然后煮豆。要开始的话，声明一个 `async` 函数 `makeBeans()`。你现在可以保持函数体为空。\n\
    \n检查你的工作以进入下一步。\n\n**检查点 3 已通过**\n\n### 3.\n\n在函数内部，声明一个变量 `type`，将其赋值为 `shopForBeans()`\
    \ 的解决值。这必须在一个语句中完成。\n\n**检查点 4 已通过**\n\n卡住了？获取提示\n\n### 4.\n\n接下来在函数内部，声明一个变量\
    \ `isSoft`，将其赋值为 `soakTheBeans()` 的解决值。不要忘记：`soakTheBeans()` 函数需要一个参数。确保将预期值传递给\
    \ `soakTheBeans()`。\n\n**检查点 5 已通过**\n\n卡住了？获取提示\n\n5.\n\n"
