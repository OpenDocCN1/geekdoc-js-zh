  trans: "\n\n在我们的日常生活中，处处都是异步的例子。例如，打扫房屋涉及异步操作，如洗碗机在洗碗或洗衣机在洗衣服。当我们等待这些操作完成时，我们可以去处理其他家务。\n\
    \n同样，Web 开发也利用了异步操作。像发送网络请求或查询数据库等操作可能非常耗时，但 `JavaScript` 允许我们在等待它们完成的同时执行其他任务。\n\
    \n本课程将教你现代 JavaScript 如何使用 ES6 引入的 `Promise` 对象来处理异步问题。让我们开始吧！\n\n# 什么是 Promise？\n\
    \nPromise 是代表异步操作最终结果的对象。一个 `Promise` 对象可以处于三种状态之一：\n\n- `Pending`（等待中）：初始状态——操作尚未完成。\n\
    - `Fulfilled`（已履行）：操作成功完成，Promise 现在有了一个解析的值。例如，一个请求的 Promise 可能以一个 `JSON` 对象作为其值解析。\n\
    - `Rejected`（已拒绝）：操作失败，Promise 有失败的原因。这个原因通常是某种类型的 `Error`。\n\n如果 Promise 不再处于\
    \ `pending` 状态，我们称它为 `settled`（已就决）——它要么已履行，要么已拒绝。让我们把洗碗机想象成 Promise 的状态：\n\n\
    - `Pending`：洗碗机正在运行，但尚未完成清洗周期。\n- `Fulfilled`：洗碗机已完成清洗周期，里面满了干净的碗筷。\n- `Rejected`：洗碗机遇到了问题（没有收到洗洁剂！）并返回了不干净的碗筷。\n\
    \n如果我们的洗碗 Promise 被履行了，我们就可以执行相关任务，例如从洗碗机取出干净的碗筷。如果它被拒绝了，我们可以采取替代措施，例如加入洗洁剂重新运行或手动洗碗。\n\
    \n所有的 Promise 最终都会进入就决状态，这使我们能够编写当 Promise 履行或拒绝时应该执行的逻辑。\n\n# 构建 Promise 对象\n\
    \n让我们创建一个 Promise 吧！要创建一个新的 `Promise` 对象，我们使用 `new` 关键字和 `Promise` 构造方法：\n\n![](img/image04943.jpeg)\n\
    \n`Promise` 构造方法接受一个函数参数，称为执行器（executor function），它在构造函数被调用时自动运行。执行器通常会启动一个异步操作，并决定\
    \ Promise 应该如何就决。\n\n执行器函数有两个函数参数，通常称为 `resolve()` 和 `reject()` 函数。`resolve()`\
    \ 和 `reject()` 函数并不是由程序员定义的。当 `Promise` 构造函数运行时，`JavaScript` 会将它自己的 `resolve()`\
    \ 和 `reject()` 函数传递给执行器函数。\n\n- `resolve` 是一个有一个参数的函数。在底层，如果被调用，`resolve()` 将将\
    \ Promise 的状态从 `pending` 变为 `fulfilled`，并且 Promise 的解析值将被设置为传入 `resolve()` 的参数。\n\
    - `reject` 是一个接受原因或错误作为参数的函数。在底层，如果被调用，`reject()` 将将 Promise 的状态从 `pending` 变为\
    \ `rejected`，并且 Promise 的拒绝原因将被设置为传入 `reject()` 的参数。\n\n让我们看一个 `Promise` 构造函数中的示例执行器函数：\n\
    \n![](img/image04944.jpeg)\n\n![](img/image04945.jpeg)\n\n让我们拆解一下上述的内容：\n\n![](img/image04946.jpeg)![](img/image04947.jpeg)我们声明了一个变量\n\
    \n- `executor` 是使用 `constructor` 方法构建的。\n- 其参数为：\n- `myFirstPromise` 被传递给构造函数，并有两个函数\
    \ `resolve` 和 `reject`。\n- 如果 `someCondition` 结果为 `true`，我们调用带有字符串 `'I resolved!'`\
    \ 的 `resolve()`。\n- 否则，我们调用带有字符串 `'I rejected!'` 的 `reject()`。\n\n在示例中，`myFirstPromise`\
    \ 根据一个简单的条件进行解析或拒绝，但在实践中，Promise 是根据异步操作的结果就决的。例如，数据库请求可能会根据查询数据而履行，或根据抛出的错误而拒绝。在本次练习中，我们将构建同步解析的\
    \ Promise，以便更容易理解它们的工作原理。\n\n## 说明\n\n1. 你将在代码编辑器中编写代码，但在最后一步之前我们不会运行它。要检查某一步的代码，你可以点击“Check\
    \ Work”按钮。\n\n我们将创建一个代表从在线商店订购太阳镜的 Promise。首先，创建函数 `myExecutor()`。稍后，你把此函数传递给\
    \ `Promise` 构造函数。\n\n`myExecutor()` 应该：\n- 有两个参数：`resolve` 和 `reject`\n- 检查 `inventory`\
    \ 对象上的 `sunglasses` 属性值是否大于零\n- 如果是，`myExecutor()` 应该调用带有字符串 `'Sunglasses order\
    \ processed.'` 的 `resolve()`\n- ![](img/image04948.jpeg)如果，应该调用带有字符串 `'That item\
    \ is sold out.'` 的 `reject()`\n\n当你准备好后，点击“Check Work”按钮。\nCheckpoint 2 Passed\n\
    \n2. 创建函数 `orderSunglasses()`。该函数不应有任何参数。它应该通过将你的 `myExecutor()` 函数传递给 `Promise`\
    \ 构造函数来返回一个新的 promise。\nCheckpoint 3 Passed\n\n3. 创建变量 `orderPromise` 并赋值为 `orderSunglasses()`\
    \ 函数的返回值。\nCheckpoint 4 Passed\n\n4. 在 `app.js` 文件的底部，将 `orderPromise` 打印到控制台。\n\
    Checkpoint 5 Passed\n\n5. ![](img/image04949.jpeg)在本练习和整个课程中，我们将为你提供一个 bash 终端来执行代码。要运行\
    \ `app.js` 程序，你将在终端输入 `node` ![](img/image04950.jpeg)`app.js` 并按回车（或 Return）。你将在终端看到程序的输出\n\
    \ ![](img/image04951.jpeg)让我们试试吧！在终端输入 `node app.js` 并按回车。\n\n如果你愿意，可以通过将 `inventory`\
    \ 对象中的 `sunglasses` 属性改为 `0` 并再次从终端执行 `app.js` 来查看另一种输出。\n\n当你准备好继续时，点击“Check\
    \ Work”按钮。\n![](img/image04952.jpeg)\n![](img/image04953.jpeg)\n\n# Node setTimeout()\
    \ 函数\n\n知道如何构建 Promise 是很有用的，但大多数时候，知道如何消费或使用 Promise 才是关键。与其构建 Promise，不如你将处理作为异步操作结果返回给你的\
    \ `Promise` 对象。这些 Promise 将从 `pending` 状态开始，但最终会就决。\n\n接下来，我们将通过提供返回一段时间后就决的 Promise\
    \ 的函数来模拟这一点。为了实现这一点，我们将使用 `setTimeout()`。`setTimeout()` 是一个 Node API（Web 浏览器提供了类似的\
    \ API），它使用回调函数来调度在延迟后执行的任务。`setTimeout()` 有两个参数：回调函数和一个以毫秒为单位的延迟。\n\n![](img/image04954.jpeg)\n\
    \n在这里，我们带有回调函数 `delayedHello()` 和 `2000` 调用 `setTimeout()`。在至少两秒后，`delayedHello()`\
    \ 将调用。但为什么是“至少”两秒而不是恰好两秒呢？\n\n这种延迟是异步执行的——我们的程序在延迟期间不会停止执行。异步 JavaScript 使用称为事件循环（event-loop）的机制。两秒后，`delayedHello()`\
    \ 被添加到代码队列。在它运行之前，程序中的任何同步代码都会先运行。接着，队列中它前面的任何代码都会运行。这意味着在实际执行 `delayedHello()`\
    \ 可能已经过了两秒。\n\n"
