    We can use either dot notation, `.`, or bracket notation, `[]`, and the assignment
    operator, `=`, to add new key-value pairs to an object or change an existing property.


    One of two things can happen with property assignment:


    * If the property already exists on the object, whatever value it held before
    will be replaced with the newly assigned value.

    * If there was no property with that name, a new property will be added to the
    object.


    It’s important to know that although we can’t reassign an object declared with
    `const`, we can still mutate it, meaning we can add new properties and change
    the properties that are there.


    ![](Images/image04789.jpeg)


    You can delete a property from an object with the `delete` operator.


    ![](Images/image04790.jpeg)


    ### Exercises


    1. Reassign the `color` property of the `spaceship` object to have a value of
    `''glorious gold''`.

