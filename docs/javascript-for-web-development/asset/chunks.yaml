    \ returns a function, or both\n\n## Introduction to Iterators\n\nImagine you had\
    \ a grocery list and you wanted to know what each item on the list was. You’d\
    \ have to scan through each row and check for the item.\n\nThis common task is\
    \ similar to what we have to do when we want to iterate over, or loop through,\
    \ an array. One tool at our disposal is the `for` loop.\n\nHowever, we also have\
    \ access to built-in array methods which make looping easier.\n\nThe built-in\
    \ JavaScript array methods that help us iterate are called iteration methods,\
    \ at times referred to as iterators. Iterators are methods called on arrays to\
    \ manipulate elements and return values.\n\nIn this lesson, you will learn the\
    \ syntax for these methods, their return values, how to use the documentation\
    \ to understand them, and how to choose the right iterator method for a given\
    \ task.\n\n### Instructions\n\nInspect the code in `main.js`. Notice the different\
    \ methods being called on the arrays:\n\n• `.forEach()`\n• `.map()`\n• `.filter()`\n\
    \nRun the code to see the output!\n\n![](Images/image04746.jpeg)\n\n![](Images/image04747.jpeg)\n\
    \n### The .forEach() Method\n\nThe first iteration method that we’re going to\
    \ learn is `.forEach()`. Aptly named, `.forEach()` will execute the same code\
    \ for each element of an array.\n\nThe code above will log a nicely formatted\
    \ list of the groceries to the console. Let’s explore the syntax of invoking `.forEach()`.\n\
    \n• `groceries.forEach()` calls the `forEach` method on the `groceries` array.\n\
    • `.forEach()` takes an argument of callback function. Remember, a callback function\
    \ is a function passed as an argument into another function.\n• `.forEach()` loops\
    \ through the array and executes the callback function for each element. During\
    \ each execution, the current element is passed as an argument to the callback\
    \ function.\n• The return value for `.forEach()` will always be `undefined`.\n\
    \nAnother way to pass a callback for `.forEach()` is to use arrow function syntax.\n\
    \n```javascript\ngroceries.forEach(groceryItem => console.log(groceryItem));\n\
    ```\n\nWe can also define a function beforehand to be used as the callback function.\n\
    \n![](Images/image04748.jpeg)\n\n![](Images/image04749.jpeg)\n\nThe above example\
    \ uses a function declaration but you can also use a function expression or arrow\
    \ function as well. All three code snippets do the same thing. In each array iteration\
    \ method, we can use any of the three examples to supply a callback function as\
    \ an argument to the iterator. It’s good to be aware of the different ways to\
    \ pass in callback functions as arguments in iterators because developers have\
    \ different stylistic preferences. Nonetheless, due to the strong adoption of\
    \ ES6, we will be using arrow function syntax in the later exercises.\n\n### Instructions\
    \ 1.\n\nIterate over the `fruits` array to log \"I want to eat \" plus the name\
    \ of each fruit to the console. For example, I want to eat a mango.\n\nYou may\
    \ use any form of callback you prefer.\n\n![](Images/image04750.jpeg)\n\n### The\
    \ .map() Method\n\nThe second iterator we’re going to cover is `.map()`. When\
    \ `.map()` is called on an array, it takes an argument of a callback function\
    \ and returns a new array! Take a look at an example of calling `.map()`:\n\n\
    ![](Images/image04751.jpeg)\n\n![](Images/image04752.jpeg)\n\nworks in a similar\
    \ manner to `.forEach()`— the major difference is that `.map()` returns a new\
    \ array.\n\nIn the example above:\n\n• `numbers` is an array of numbers.\n• `bigNumbers`\
    \ will store the return value of calling `.map()` on `numbers`.\n• `numbers.map`\
    \ will iterate through each element in the `numbers` array and pass the element\
    \ into the callback function.\n• `return number * 10` is the code we wish to execute\
    \ upon each element in the array. This will save each value from the `numbers`\
    \ array, multiplied by 10, to a new array.\n\nIf we take a look at `numbers` and\
    \ `bigNumbers`:\n\n![](Images/image04753.jpeg)\n\nNotice that the elements in\
    \ `numbers` were not altered and `bigNumbers` is a new array.\n\n### Instructions\
    \ 1.\n\nAdd your code under the `animals` array and before the line `console.log(secretMessage.join(''));`.\n\
    \nUse `.map()` to create a new array that contains the first character of each\
    \ string in the `animals` array. Save the new array to a `const` variable named\
    \ `secretMessage`.\n\nCheckpoint 2 Passed\n\nStuck? Get a hint\n\n2.\n\nUse `.map()`\
    \ to divide all the numbers in `bigNumbers` by 100. Save the returned values to\
    \ a variable declared with `const` called `smallNumbers`.\n\n![](Images/image04754.jpeg)\n\
    \n### The .filter() Method\n\nAnother useful iterator method is `.filter()`. Like\
    \ `.map()`, `.filter()` returns a new array. However, `.filter()` returns an array\
    \ of elements after filtering out certain elements from the original array. The\
    \ callback function for the `.filter()` method should return `true` or `false`\
    \ depending on the element that is passed to it. The elements that cause the callback\
    \ function to return `true` are added to the new array. Take a look at the following\
    \ example:\n\n![](Images/image04755.jpeg)\n\n• ![](Images/image04756.jpeg) `words`\
    \ is an array that contains string elements.\n• `const shortWords=` declares a\
    \ new variable that will store the returned array from invoking `.filter()`.\n\
    • The callback function is an arrow function has a single parameter, `word`. Each\
    \ element in the `words` array will be passed to this function as an argument.\n\
    • ![](Images/image04757.jpeg) is the condition in the callback function. Any word\
    \ from the `words` array that has fewer than 6 characters will be added to the\
    \ `shortWords` array.\n\nLet’s also check the values of `words` and `shortWords`:\n\
    \n![](Images/image04758.jpeg)\n\nObserve how `words` was not mutated, i.e. changed,\
    \ and `shortWords` is a new array.\n\n### Instructions 1.\n\nCall the `.filter()`\
    \ method on `randomNumbers` to return values that are less than 250. Save them\
    \ to a new array called `smallNumbers`, declared with `const`.\n\n2.\n\nNow let’s\
    \ work with an array of strings. Invoke `.filter()` on the `favoriteWords` array\
    \ to return elements that have more than 7 characters. Save the returned array\
    \ to a `const` variable named `longFavoriteWords`.\n\n![](Images/image04759.jpeg)\n\
    \n![](Images/image04760.jpeg)\n\nThe .findIndex() Method\n"
