    `10 < 12` // 结果为 true。将比较语句视为问题可能会很有帮助。当答案为“是”时，语句求值为 `true`；当答案为“否”时，语句求值为 `false`。上面的代码是在提问：`10`
    是否小于 `12`？是的！所以 `10 < 12` 的求值结果为 `true`。


    我们也可以对不同的数据类型（如字符串）使用比较运算符：


    `''apples'' === ''oranges''` // false 在上面的示例中，我们正在使用标识运算符（`===`）来检查字符串 `''apples''`
    是否与字符串 `''oranges''` 。由于这两个字符串不同，因此比较语句求值为 `false`。


    所有比较语句的求值均为 `true` 或 `false`，它们由以下部分组成：


    *   两个将进行比较的值。

    *   一个分隔这些值并相应进行比较的运算符（>`, `<`, `<=`, `>=`, `===`, `!==`）。


    让我们练习使用这些比较运算符吧！


    ### 指令 1.


    使用 `let` 创建一个名为 `hungerLevel` 的变量，并将其赋值为 `7`。


