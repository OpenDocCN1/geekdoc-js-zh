    # 静态方法


    有时，你希望一个类拥有一些在单个实例中不可用的方法，但你可以直接从类调用它们。


    以 `Date` 类为例——你既可以创建 `Date` 实例来表示你想要的任何日期，也可以直接从类中调用静态方法，例如返回当前日期的 `Date.now()`。


    `.now()` 方法是静态的，因此你可以直接从类中调用它，但不能从类的实例中调用。


    让我们看看如何使用 `static` 关键字在我们的 `Animal` 类中创建一个名为 `generateName` 的静态方法：


    ![](img/image04901.jpeg)


    在上面的示例中，我们创建了一个静态方法 ![](img/image04902.jpeg) 名称 `.generateName()`，它在被调用时会返回一个随机名称。由于
    `static` 关键字，我们只能通过附加到 `Animal` 类来访问 `.generateName()`。


    我们使用以下语法调用 `.generateName()` 方法：


    ```

    console.log(Animal.generateName());  // 返回一个名称

    ```


    你无法从 `Animal` 类实例或其子类的实例访问 `.generateName()` 方法（见下文）。


    ![](img/image04903.jpeg)


    上面的示例将导致错误，因为你不能在实例 (`tyson`) 上调用静态方法 (`.generateName()`)。


    ###  1


    在你的 `HospitalEmployee` 类内部，创建一个名为 `generatePassword` 的静态方法。当被调用时，该方法应该返回一个 0 到
    10,000 之间的随机整数。


    ![](img/image04904.jpeg)

    ![](img/image04905.jpeg)


    ## 复习：类


    做得好！让我们回顾一下你学到的。


    * 类是对象的模板。

    * 当我们创建一个类的类的实例时，Javascript 会调用构造方法。

    * 继承是指我们创建一个带有属性和方法的父类，并将其扩展到子类中。

    * 我们使用 `extends` 关键字来创建子类。

    * `super` 关键字调用父类的 `constructor()`。

    * 静态方法在类上调用，而不是在类的实例上调用。


    # 浏览器兼容性与编译


    ## 引言


    你可能每隔几个月就会被提示更新网络浏览器。你知道为什么吗？原因包括修复安全漏洞、添加新功能以及支持新的 HTML、CSS 和 JavaScript 语法。


    上述原因意味着，在软件更新发布之前，有一段时间内存在安全漏洞和不支持的语言语法。


    本节重点关注后者。具体来说，就是开发者如何解决他们使用的新 JavaScript 语法与网络浏览器识别的 JavaScript 语法之间的差异。


    自从负责 JavaScript 标准化的组织 Ecma International 在 2015 年发布了其新版本——即 ECMAScript2015（通常称为
    `ES6`）以来，这已成为 Web 开发者广泛关注的问题。注意，6 指的是 JavaScript 的版本，与它的发布年份无关（上一个版本是 ES5）。


    发布后，Web 开发者迅速采用了新的 ES6 语法，因为它提高了可读性和效率。然而，大多数网络浏览器并不支持 ES6，因此开发者遇到了浏览器兼容性问题。


    在本节课程中，你将学习解决浏览器兼容性问题的两个重要工具。


    * `caniuse.com` — 一个提供 HTML、CSS 和 JavaScript 特性浏览器兼容性数据的网站。你将学习如何使用它来查询 ES6 特性的支持情况。

    * `Babel` — 一个 JavaScript 库，你可以用它将新的不支持的 JavaScript (ES6) 转换为大多数现代浏览器都能识别的旧版本
    (ES5)。


    让我们从在一个假的旧版网络浏览器上运行 ES6 JavaScript 开始。


    ### 任务 1


    1. 将以下代码复制到 `main.js`。该代码包含了三个 ES6 语法特性：`const`、`let` 和 ES6 字符串插值。


    ![](img/image04906.jpeg)


