    Let’s say we wanted to create an object to represent monsters in JavaScript. There
    are many different types of monsters and we could go about making each monster
    individually but we can also use a factory function to make our lives easier.
    To achieve this diabolical plan of creating multiple monsters objects, we can
    use a factory function that has parameters:


    ![](Images/image04837.jpeg)


    ![](Images/image04838.jpeg)

    In the function above, it has four parameters and returns an object that has the
    properties: `name`, `age`, `energySource`, and `scare()`. To make an object that
    represents a specific monster like a ghost, we can call `monsterFactory` with
    the necessary arguments and assign the return value to a variable:


    ![](Images/image04839.jpeg)


    Now we have a `ghost` object as a result of calling `monsterFactory()` with the
    needed arguments. With `monsterFactory` in place, we don’t have to create an object
    literal every time we need a new monster. Instead, we can invoke the `monsterFactory`
    function with the necessary arguments to take over the world make a monster for
    us!


    ### Instructions 1.

    Instead of making individual robots like we’ve been doing, let’s make a factory
    function to make robots as we please!


    Create a factory function named `robotFactory` that has two parameters `model`
    and `mobile`. Make the function return an object. In the object, add a key of
    `model` with the value of the `model` parameter. Add another property that has
    a key of `mobile` with a value of the `mobile` parameter.


    Then add a method named `beep` without a parameter that will log ''Beep Boop''
    to the console.


    **Checkpoint 2 Passed**


    *Stuck? Get a hint*


    ### 2.

    Use your factory function by declaring a ![](Images/image04840.jpeg)variable`
    named `tinCan`.


    Assign to `tinCan` the value of calling `robotFactory` with the first argument
    of ''P-500'' and the second argument of `true`.


    **Checkpoint 3 Passed**


    ### 3.

    Let’s now check what `tinCan` can do! Call `.beep()` on `tinCan`.


    You should see ''Beep Boop'' printed to the console which means the factory function
    produced a robot object! Play around with `tinCan` to check the other properties!


    ![](Images/image04841.jpeg)


    ## Property Value Shorthand

    ES6 introduced some new shortcuts for assigning properties to variables known
    as destructuring.


    In the previous exercise, we created a factory function that helped us create
    objects. We had to assign each property a key and value even though the key name
    was the same as the parameter name we assigned to it. To remind ourselves, here’s
    a truncated version of the factory function:


    ![](Images/image04842.jpeg)


    Imagine if we had to include more properties, that process would quickly become
    tedious! But we can use a destructuring technique, called property value shorthand,
    to save ourselves some keystrokes. The example below works exactly like the example
    above:


    ![](Images/image04843.jpeg)


    Notice that we don’t have to repeat ourselves for property assignments!


    ### Instructions 1.

    Use the property value shorthand and refactor the factory function in `main.js`.


    *(Note: The provided text contained repetitive sections of the same instructions;
    these have been consolidated for clarity.)*


    ![](Images/image04844.jpeg)

    ![](Images/image04845.jpeg)

    ![](Images/image04846.jpeg)

    ![](Images/image04847.jpeg)

    ![](Images/image04848.jpeg)

    ![](Images/image04849.jpeg)


    ## Destructured Assignment

    We often want to extract key-value pairs from objects and save them as variables.
    Take for example the following object:


    ![](Images/image04850.jpeg)

    ![](Images/image04851.jpeg)

    If we wanted to extract the following code property as a variable, we could using:


    ![](Images/image04852.jpeg)


    However, we can also take advantage of a destructuring technique called destructured
    assignment to save ourselves some keystrokes. In destructured assignment we create
    a variable with the name of an object’s key that is wrapped in curly braces `{
    }` and assign to it the object. Take a look at the example below:


    ![](Images/image04853.jpeg)


    ### Instructions 1.

    Use destructured assignment to create a `const` variable named `functionality`
    that extracts the `functionality` property of `robot`. If you need a reminder
    on how to use destructured assignment, review the example in the narrative or
    check the hint.


    **Checkpoint 2 Passed**


    *Stuck? Get a hint*


    ### 2.

    Since `functionality` is referencing `robot.functionality` we can call the methods
    available to `robot.functionality` simply through `functionality`. Take advantage
    of this shortcut and call `.beep()` on `functionality`.


    ![](Images/image04855.jpeg)


    ## Built-in Object Methods

    In the previous exercises we’ve been creating instances of objects that have their
    own methods. But, we can also take advantage of built-in methods for Objects!


    For example, we have access to object instance methods like: `.hasOwnProperty()`,
    `.valueOf()`, and many more! Practice your documentation reading skills and check
    out: MDN’s object instance documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#Methods).


    There are also useful `Object` class methods such as `Object.assign()`, `Object.entries()`,
    and `Object.keys()` just to name a few. For a comprehensive list, browse: [MDN’s
    object instance documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#Methods_of_the_Object_constructor).


    Let’s get acquainted with some of these methods and their documentation.


    Note: You will see errors as you work through this exercise, but by the end the
    errors will be fixed!


