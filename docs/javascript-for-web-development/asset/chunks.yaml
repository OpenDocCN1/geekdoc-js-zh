    \ = () => {\n    if (xhr.readyState === XMLHttpRequest.DONE) {\n      renderByteResponse(xhr.response);\n\
    \    }\n  };\n\n  xhr.open('POST', rebrandlyUrl);\n  xhr.setRequestHeader('Content-type',\
    \ 'application/json');\n  xhr.setRequestHeader('apikey', apiKey);\n  xhr.send(data);\n\
    }\n\n// 清除页面并调用 AJAX 函数\nconst displayShortUrl = (event) => {\n  event.preventDefault();\n\
    \  while(responseField.firstChild){\n```\n![](img/image05058.jpeg)\n\n# ES6 请求简介\n\
    在上一一个节中，我们花费了大量时间处理异步数据（还记得 AJAX/异步 JavaScript 和 XML 吗？？我们的许多网页交互依赖于异步事件，因此管理这些事件对于良好的\
    \ Web 开发至关重要。\n\n为了让异步事件处理变得更容易，JavaScript 在 ES6 中引入了 Promise：\n\n* [Mozilla 开发者网络：Promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)\n\
    \nPromise 是一个处理异步数据的对象。Promise 有三种状态：\n\n* `pending`（等待中）：当 Promise 被创建或等待数据时。\n\
    * `fulfilled`（已完成）：异步操作成功处理。\n* `rejected`（已拒绝）：异步操作失败。\n\nPromise 的强大之处在于，一旦\
    \ Promise 完成或拒绝，你就可以在原始 Promise 上链调用额外的方法。\n\n![](img/image05059.jpeg)\n在本节中，我们将解释如何使用请求。然后，我们将使用\
    \ `async/await` 简化请求，它是使用 Promise 来处理的。\n\n我们将使用 Datamuse API 进行 GET 请求，使用 Rebrandly\
    \ URL 短缩器 API 进行 POST 请求。\n\n## fetch() GET 请求 I\n我们将处理的第一类请求是使用 `fetch()` 发的\
    \ GET 请求。\n\n* [MDN: Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)。`fetch()`\
    \ 函数：\n\n* 创建一个包含 API 所需相关信息的请求对象。\n* 将该请求对象发送到提供的 API 端点。\n* 返回一个 Promise，该 Promise\
    \ 最终解析为响应对象，该对象包含 Promise 的状态以及 API 发回的信息。\n\n在接下来的练习中，我们将回顾使用 `fetch()` 的模板代码，并逐步讲解每一步的作用！\n\
    \n![](img/image05060.jpeg)\n\n## fetch() GET 请求 II\n我们将逐步重构使用 `fetch()` 函数创建 GET\
    \ 请求 所需的模板代码。\n\n在完成此练习期间，任何时候都可以随时查阅 `fetch()` GET 图表：\n\n* [fetch() GET 图表](https://content.codecademy.com/courses/intermediate-javascript-requests/diagrams/fetch%20GET%20diagram.svg)\n\
    \n### 指令\n1. 首先，调用 `fetch()` 函数并将此 URL 作为字符串传递给它：\n`https://api-to-call.com/endpoint`\n\
    \n此第一个参数决定了请求的端点。\n\n**检查点 2 通过**\n*卡住了？获取提示*\n\n2. 在 `fetch()` 函数的末尾链式 `.then()`\
    \ 方法，并将成功回调箭头函数作为其第一个参数传递。成功回调函数接收一个参数，`response`。\n\n`.then()` 只会在 `fetch()`\
    \ 的 Promise 状态被解析后触发。\n\n**检查点 3 通过**\n*卡住了？获取提示*\n\n3. 在 `response` 回调函数内部，在条件语句中检查\
    \ `response` 的 `ok` 属性。在条件语句的代码块中，返回 `response.json()`。\n\n我们测试响应对象的 `ok` 属性是因为它是一个布尔值。如果没有错误，`response.ok`\
    \ 将为 `true`，然后你的代码将返回 `response.json()`。\n\n**检查点 4 通过**\n*卡住了？获取提示*\n\n4. 在条件语句的大括号下方，使用此代码创建一个新错误：\n\
    `throw new Error('Request failed!');`\n\n当 `response.ok` 为假值时，你的代码将抛出此错误。\n\n\
    **检查点 5 通过**\n*卡住了？获取提示*\n\n5. 为 `.then()` 添加第二个参数，它将是一个处理我们失败的箭头函数。用逗号将第一个回调函数与第二个分开。第二个回调函数接收单个参数\
    \ `networkError`。\n\n在第二个回调函数的代码块中，向控制台打印 `networkError.message`。\n\n**检查点 6 通过**\n\
    *卡住了？获取提示*\n\n6. 在第一个 `.then()` 方法的末尾链式添加另一个 `.then()` 方法。向新的 `.then()` 方法传递一个回调函数，该函数接收\
    \ `jsonResponse` 作为参数并返回 `jsonResponse`。\n\n在之前的 `.then()` 方法完成之前，第二个 `.then()`\
    \ 的回调不会运行。如果之前抛出了错误，它将不会运行。\n\n![](img/image05061.jpeg)\n\n## fetch() GET 请求 III\n\
    在上一个练习中，你使用 `fetch()` 和 `.then()` 写了 GET 请求的模板代码。在本练习中，你将使用该代码并进行操作，以访问 Datamuse\
    \ API 并在浏览器中渲染信息。\n\n* [Datamuse API](https://www.datuse.com/api/)\n\n如果请求成功，你将获得一个与输入框中输入的单词相同的数组。\n\
    \n在完成每一步时，你可能会遇到错误。这是因为有时我们将单个步骤拆分为一个或多个步骤，以便于理解。\n\n### 指令\n1. 在 main.js 顶部，创建一个名为\
    \ `url` 的 `const`。将以下 URL 作为字符串赋值给 `url`：\n![](img/image05062.jpeg)\n*卡住了？获取提示*\n\
    \n2. 在 `url` 下方，创建另一个命名为 `queryParams`。将其赋值为 `'?sl='`。\n\n`queryParams` 将是查询字符串的开头，并将搜索缩小到类似于你的单词。\n\
    \n**检查点 3 通过**\n\n3. 在 `getSuggestions()` 函数内部，创建一个名为 `wordQuery` 的 `const` 并将其赋值为\
    \ `inputField.value`。\n\n你需要 `wordQuery` 来存储输入框中的值。\n\n在练习的剩余部分，你将在 `getSuggestions()`\
    \ 中工作。\n\n**检查点 4 通过**\n*卡住了？获取提示*\n\n4. 现在是为 URL 添加带有所有参数的查询字符串了。\n\n创建另一个名为\
    \ `endpoint` 的 `const`，将其赋值为 `url`、`queryParams` 和 `wordQuery` 按顺序拼接的字符串。\n\n\
    **检查点 5 通过**\n*卡住了？获取提示*\n\n"
