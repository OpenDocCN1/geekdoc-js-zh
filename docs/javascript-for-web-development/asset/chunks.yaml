    卡住了？获取提示


    #### 4

    ![](img/image04970.jpeg)我们将太阳镜的库存设为 0，因此订单不应该通过。让我们确保代码产生预期的结果。在终端中输入 `node app.js`
    并按回车。


    ![](img/image04971.jpeg)


    ### 链式调用多个 Promise


    异步编程中常见的常见模式之一是多个相互依赖执行的操作，或者必须按照特定顺序执行的操作。我们可能会向数据库发送一个请求，并使用返回的数据来发送另一个请求，依此类推！让我们用另一个清理示例——洗衣服来说明这一点：


    我们把脏衣服放入洗衣机。如果衣服洗干净了，我们就想把它们放入烘干机。干燥机运行后，如果衣服干了，我们就可以折叠并收起来。


    这种将 promise 链在一起的过程被称为组合（composition）。Promise 的设计就考虑了组合！这里有一段简单的 promise 链：


    ![](img/image04972.jpeg)


    让我们分析一下示例中发生了什么：


    • 我们调用了一个返回 promise 的函数 `firstPromiseFunction()`。

    • 我们调用了 `.then()` 并传入匿名函数作为成功处理函数。

    • 在成功处理函数内部，我们返回了一个新的 promise——调用第二个函数 `secondPromiseFunction()` 的结果，传入第一个 promise
    的解析值。

    • 我们调用第二个 `.then()` 来处理第二个 promise 状态改变（settling）的逻辑。

    • 在该 `.then()` 内部，我们有一个成功处理函数，它会将第二个 promise 的解析值打印到控制台。


    为了让我们的链正常工作，我们必须返回 `secondPromiseFunction(firstResolveVal)`。这确保了第一个 `.then()`
    的返回值是我们的第二个 promise，而不是默认返回一个与初始值具有相同状态值的新 promise。


    让我们来写一些 promise 链吧！


    ### 指令


    #### 1

    查看提供的代码。我们引入了三个函数：`checkInventory()`、`processPayment()` 和 `shipOrder()`。这些函数每个都返回一个
    promise。


    `checkInventory()` 接收一个 `order` 参数并返回一个 promise。如果库存中有足够的物品来订单，该 promise 将解析为一个数组。解析值数组中的第一个元素将是相同的
    `order`，第二个元素将是订单的总费用（数字类型）。


    `processPayment()` 接收一个数组参数，其中第一个元素是 `order`，第二个元素是购买总额。该函数返回一个 promise。如果与订单相关的礼品卡余额足够，它将解析为一个数组。解析值数组中的第一个元素将是相同的
