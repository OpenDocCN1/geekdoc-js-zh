    ![](Images/image04716.jpeg)


    ## Nested Loops


    When we have a loop running inside another loop, we call that a nested loop. One
    use for a nested `for` loop is to compare the elements in two arrays. For each
    round of the outer `for` loop, the inner `for` loop will run completely.


    Let’s look at an example of a nested `for` loop:


    ![](Images/image04717.jpeg)


    Let’s think about what’s happening in the nested loop in our example. For each
    element in the outer loop array, `myArray`, the inner loop will run in its entirety
    comparing the current element from the outer array, `myArray[i]`, to each element
    in the inner array, `yourArray[j]`. When it finds a match, it prints a string
    to the console.


    Now it’s your turn to write a nested loop!


    ### Instructions


    1. Imagine you’re a big-wig programmer for a social media platform! You have been
    tasked with building a prototype for a mutual followers program. You’ll need two
    arrays of “friends” from two mock users so that you can extract the names of the
    followers who exist in both lists. Make a variable called `bobsFollowers` and
    set it equal to an array with four strings representing the names of Bob’s friends.

    Checkpoint 2 Passed


    2. Make a variable called `tinasFollowers` and set it equal to an array with three
    strings representing the names of Tina’s friends. Make exactly two of these the
    same as two of the friends in the `bobsFollowers` array.

    Checkpoint 3 Passed


    3. Create a third variable named `mutualFollowers` and set it to an empty array.

    Checkpoint 4 Passed


    4. Create a nested loop that iterates through `bobsFollowers` as the array for
    the outer loop and `tinasFollowers` as the array for the inner loop. If the current
    element from the outer loop is the same as the current element from the inner
    loop, push that element into the `mutualFollowers` array.


    ![](Images/image04718.jpeg)


    ## The While Loop


    You’re doing great! We’re going to teach you about a different type of loop: the
    `while` loop. To start, let’s convert a `for` loop into a `while` loop:


    ![](Images/image04719.jpeg)


    ![](Images/image04720.jpeg)Let’s break down what’s happening with our loop syntax:


    ![](Images/image04721.jpeg)

    * The inside our variable is declared before the loop. We can access it loop since
    it’s in the global scope.

    * We start our loop with the keyword `while` followed by our stopping condition,
    or test condition. This will be evaluated before each round of the loop. While
    the condition evaluates to `true`, the block will continue to run. Once it evaluates
    to `false` the loop will stop.

    * Next, we have our loop’s code block which prints `counterTwo` to the console
    and increments `counterTwo`.


    What would happen if we didn’t increment `counterTwo` inside our block? If we
    didn’t include this, `counterTwo` would always have its initial value, `1`. That
    would mean the testing condition `counterTwo < 4` would always evaluate to true
    and our loop would never stop running! This is called an infinite loop and it’s
    something we always want to avoid. Infinite loops can take up all of your computer’s
    processing power potentially freezing your computer.


    So you may be wondering when to use a `while` loop! The syntax of a `for` loop
    is ideal when we know how many times the loop should run, but we don’t always
    know this in advance. Think of eating like a `while` loop: when you start taking
    bites, you don’t know the exact number you’ll need to become full. Rather you’ll
    eat while you’re hungry. In situations when we want a loop to execute an undetermined
    number of times, `while` loops are the best choice.


    ### Instructions


    1. Below the `cards` array, declare a variable, `currentCard`, with the `let`
    keyword but don’t assign it a value.

    Checkpoint 2 Passed


    Stuck? Get a hint


    2. Create a `while` loop with a condition that checks if the `currentCard` does
    not have that value `''spade''`. Inside the block of your `while` loop, add the
    following line of code:


    ```

    currentCard = cards[Math.floor(Math.random() * 4)];

    ```

    `Math.floor(Math.random() * 4)` will give us a random number from 0 to 3. We’ll
    use this number to index the `cards` array, and assign the value of `currentCard`
    to a random element from that array.

    Checkpoint 3 Passed


    Stuck? Get a hint


    3. Awesome! Your loop is running, but you can’t tell because it doesn’t output
    anything. Let’s add a `console.log()` statement to our `while` block. Inside the
    block, after you assign `currentCard` a new value, log `currentCard` to the console.


    For fun you can run your code a few times and see how the output changes!


    ![](Images/image04722.jpeg)


    ## Do...While Statements


    In some cases, you want a piece of code to run at least once and then loop based
    on a specific condition after its initial run. This is where the `do...while`
    statement comes in.


    A `do...while` statement says to do task once and then keep it until a specified
    condition no longer met. The syntax for `do...while` looks like this:


    ![](Images/image04723.jpeg)

    In this example, the code block makes changes to `countString` variable by appending
    the string form the `i` variable to it. First, the code block is executed once.
    Then the condition is evaluated. If the condition evaluates to `true`, the block
    will execute again. The looping stops when the condition evaluates to `false`.


    Note that `while` and `do...while` are different! Unlike the `while` loop, `do...while`
    will run at least once.


    ![](Images/image04724.jpeg)


    1. We’d like a program to simulate part of the cake-baking process. Depending
    on the recipe, a different number of cups of sugar is required. Create the variable
    `cupsSugarNeeded`, and assign it a number. The cups of sugar must be added to
    the batter one at a time. Declare the variable `cupsAdded` and assign it the value
    0.

    Checkpoint 2 Passed


    2. We have a sweet tooth, so we want to add at least one cup of sugar to the batter
    even if `cupsSugarNeeded` is 0. Create a `do...while` loop which increments `cupsAdded`
    by one while `cupsAdded` is less `cupsSugarNeeded`.


    ![](Images/image04725.jpeg)


    ## The break Keyword


    Imagine we’re looking to adopt a dog. We plan to go to the shelter every day for
    a year and then give up. But what if we meet our dream dog on day 65? We don’t
    want to keep going to the shelter for the next 300 days just because our original
    plan was to go for a whole year. In our code, when we want to stop a loop from
    continuing to execute though the original stopping condition we wrote for our
    loop hasn’t been met, we can use the keyword `break`.


    The `break` keyword allows programs to “break” out of the loop from within the
    loop’s block.


    Let’s check out the syntax of a `break` keyword:


    ![](Images/image04726.jpeg)


    ![](Images/image04727.jpeg)


    This is the output for the above code:


    ![](Images/image04728.jpeg)

    statements can be especially helpful when we’re looping through large data structures!
    With breaks, we can add test conditions besides the stopping condition, and exit
    the loop when they’re met.


