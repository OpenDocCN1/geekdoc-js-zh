    ## 解构赋值

    我们经常想从对象中提取键值对并将它们保存为变量。例如以下对象：


    ![](img/image04850.jpeg)

    ![](img/image04851.jpeg)

    如果我们想将 `code` 属性提取为变量，可以使用：


    ![](img/image04852.jpeg)


    然而，我们也可以利用名为“解构赋值”（destructured assignment）的解构技术来减少击字次数。在解构赋值中，我们用大括号 `{ }` 包裹一个与对象键同名的变量，并将对象赋值给它。看看下面的示例：


    ![](img/image04853.jpeg)


    ### 指南 1.

    使用解构赋值创建一个名为 `functionality` 的 `const` 变量，用于提取 `robot` 的 `functionality` 属性。如果你需要提醒如何使用解构赋值，可以回顾正文中的示例或查看提示。


    **检查点 2 通过**


    *卡住了？获取提示*


    ### 2.

    由于 `functionality` 引用了 `robot.functionality`，我们只需通过 `functionality` 调用 `robot.functionality`
    可用的方法。利用这个快捷方式并在 `functionality` 上调用 `.beep()`。


    ![](img/image04855.jpeg)


    ## 内置对象方法

    在之前的练习中，我们创建了拥有自己的方法的实例。但我们也可以利用 Object 的内置方法！


    例如，我们可以访问对象实例方法，如：`.hasOwnProperty()`、`.valueOf()` 等！练习你的文档阅读能力并查看：[MDN 对象实例文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#Methods)。


    还有非常有用的 `Object` 类方法，例如 `Object.assign()`、`Object.entries()` 和 `Object.keys()`。要查看完整列表，请浏览：[MDN
    对象实例文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object#Methods_of_the_Object_constructor)。


    让我们熟悉一下这些方法及其及其文档。


    注意：在完成此练习时你会看到错误，但在结束时这些错误将得到修复！


