    # 复习数组


    做得好！在本节中，我们学习了这些关于数组的概念：


    - 数组是 JavaScript 中存储数据的列表。

    - 数组使用中括号 `[]` 创建。

    - 数组中的每个项都有一个数字编号的位置，或索引（index），从 0 开始。

    - 我们可以使用索引访问数组中的某一项，语法如：`myArray[0]`。

    - 我们也可以使用索引更改数组中的某一项，语法如 `myArray[0] = ''new string''`。

    - 数组具有 `length` 属性，它允许你查看数组中有多少个项。

    - 数组有自己的方法，包括 `.push()` 和 `.pop()`，它们分别用于向数组中添加和移除项。

    - 数组有许多执行不同任务的方法，例如 `.slice()` 和 `.shift()`，你可以在 [Mozilla](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    [开发者网络](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    网站找到文档。

    - 一些内置方法是变性的（mutating），这意味着该方法会改变数组，而另一些则变变。你可以随时查看文档。

    - 包含数组的变量可以使用 `let` 或 `const` 声明。即使用 `const` 声明，数组仍然是可变的。但是，用 `const` 声明的变量不能重新赋值。

    - 在函数内部改变的数组在函数外部也会保留该更改。

    - 数组可以嵌套在其他数组中。

    - 要访问嵌套数组中的元素，请使用括号表示法进行链式索引。


    学习如何处理和操作数组将帮助你处理数据块！


    # 循环


    循环是一种编程工具，它会重复执行一组指令，直到达到指定的条件（称为停止条件）。作为一名程序员，你会发现你一直在依赖循环！在谈论循环时，你会听到一个通用术语“迭代（iterate）”。迭代
    仅仅的意思就是“重复”。


    当我们需要在代码中重用某项任务时，通常会将该操作封装在一个函数中。同样，当我们看到某个过程必须连续重复多次时，我们就会写一个循环。循环允许我们创建高效的代码，通过自动化流程来构建可扩展、易于管理的程序。


    如图所示，循环会迭代或重复某个操作，直到满足特定条件。当条件满足时，循环停止，计算机将进入程序的下一个部分。


    ![](img/image04706.jpeg)


    ## 手动重复任务


    在我们编写自己的循环之前，让我们花一点时间对循环有一个基本的理解。最好的方法就是向你展示，如果一个重复的任务需要你每次都输入相同的代码，那将是繁琐。


    ### 指南


    1. 创建变量 `vacationSpots`，并将其值赋值为一个包含三个字符串的数组，这些字符串是你想要去的地方。

    *检查点 2 已通过*

    *卡住了？获取提示*


    2. 接下来，使用 `console.log()` 输出 `vacationSpots` 中的每个项。由于我们还不知道循环，我们必须单独 `console.log()`
    数组中的每个元素。

    *检查点 3 已通过*

    *卡住了？获取提示*


    3. 做得好！现在想象一下假期清单上有 100 个地方——手动将每个数组元素日志记录到控制台将是一项枯燥的任务！在下一个练习中，我们将学习如何使用 `for`
    循环让事情更高效。


    ![](img/image04707.jpeg)


    # For 循环


    与其反复不断地编写相同的代码，循环允许我们告诉计算机自动重复给定的代码块。给计算机提供这些指令的方法之一是使用 `for` 循环。


    典型的 `for` 循环包含一个迭代变量，该变量通常出现在三个表达式中。迭代变量被初始化、与停止条件进行检查，并在每次循环迭代时分配一个新值。


    迭代变量可以有任何名称，但最佳实践是使用描述性的变量名。


    `for` 循环在括号内包含三个用 `;` 分隔的表达式：


    1. **初始化**启动循环，也可以用于声明迭代变量。

    2. **停止条件**是对迭代变量进行求值的的条件——如果条件求结果为 `true`，则代码块将运行；如果求值为 `false`，则代码将停止。

    3. **迭代语句**用于在每次循环中更新迭代变量。


    `for` 循环的语法如下：


    ![](img/image04708.jpeg)


    在这个示例中，输出将是：


    ![](img/image04709.jpeg)


    让我们拆解这个示例：


    - 初始化是 `let counter = 0`，所以循环将从 0 开始计数。

    - 停止条件是 `counter < 4`，意味着只要迭代变量 `counter` 小于 4，循环就会运行。

    - 迭代语句是 `counter++`。这意味着在每次循环之后，`counter` 的值将增加 1。第一次迭代时 `counter` 等于 0，第二次迭代
    `counter` 等于 1，依此类推。

    - 代码块位于大括号内部，`console.log(counter)` 将执行，直到条件求结果为 `false`。当 `counter` 大于或等于 4 时，条件将为
    `false`——条件变为 `false` 的点有时被称为停止条件。


    这个 `for` 循环使得通过程序编写 0, 1, 2 和 3 成为可能。


    ### 指南


    1. 现在，写你自己的吧！创建一个从 5 循环到 10 的程序，并将每个数字记录到控制台。


    ![](img/image04710.jpeg)

    ![](img/image04711.jpeg)


    # 反向循环


    如果我们想让 `for` 循环记录 3, 2, 1 然后是 0 呢？通过对表达式进行简单修改，我们可以让循环反向运行！


    运行反向 `for` 循环，我们必须：


    - 在初始化表达式中将迭代变量设置为最高值。

    - 设置停止条件，当迭代变量小于所需的数量。

    - 迭代器在每次迭代后应该递减。


    ### 指南


    1. 写一个 `for` 循环，反向打印 3 到 0 到控制台。在你的停止条件中使用 `>=` 比较运算符，并在迭代语句中使用 `--` 运算符。


    ![](img/image04712.jpeg)


    # 遍历数组


    `for` 循环对于遍历数据结构非常有用。例如，我们可以使用 `for` 循环对数组中的每个元素执行相同的操作。数组存储数据列表，例如客户名称或产品信息。假设我们拥有一家商店，想要增加目录中每个产品的价格。这可能需要大量重复的代码，但通过使用
    `for` 循环遍历数组，我们可以轻松地完成这项任务。


    要遍历数组中的每个元素，`for` 循环应该在条件中使用数组的 `.length` 属性。


    查看下面的示例了解 `for` 循环如何遍历数组：


    ![](img/image04713.jpeg)


    这个示例将给你以下输出：


    ![](img/image04714.jpeg)


    在上面的循环中，我们将迭代变量命名为 `i`。这是你在很多循环中都会看到的变量命名规范。当我们使用 `i` 遍历数组时，可以将其理解为单词 index（索引）的缩写。注意我们的停止条件检查
    `i` 是否小于 `animals.length`。记住数组是从 0 开始索引的，最后一个元素的索引相当于数组的长度减 1。如果我们尝试访问索引为 `animals.length`
    的元素，我们就走得太远了！


    有了 `for` 循环，我们更容易处理数组元素。


    ### 指南


    1. 编写一个 `for` 循环遍历我们的 `vacationSpots` 数组，并使用 `i` 作为迭代变量。


