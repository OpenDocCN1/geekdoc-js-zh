  trans: "\n\n重构方法后，注意 `.checkEnergy()` 可以访问 `robot` 对象的其他内部属性。\n\n![](img/image04823.jpeg)\n\
    \n![](img/image04824.jpeg)\n\n## 私有性\n\n在处理对象时，访问和更新属性是基础。然而，某些情况下，我们不希望其他代码简单访问并更新对象的属性。在讨论对象的私有性时，我们将其定义为只有某些属性应该是可变的或能够更改值的。\n\
    \n![](img/image04825.jpeg)![](img/image04825.jpeg)某些语言内置了对象的私有性，但 JavaScript 并没有这一功能。相反，JavaScript\
    \ 开发者遵循命名约定，向其他开发者指示如何与属性交互。一种常见的约定是在属性名称前放置下划线 `_`，表示该属性不应被修改。这里有一个使用 `_` 作为属性前缀的示例。\n\
    \n![](img/image04826.jpeg)\n```javascript\nconst bankAccount = {\n  _amount: 1000\n\
    }\n```\n\n在上面的示例中，`_amount` 并不打算被直接操作。\n\n尽管如此，仍然可以重新分配 `_amount`：\n\n```javascript\n\
    bankAccount._amount = 1000000;\n```\n\n在稍后的练习中，我们将涵盖称为 getter（获取器）和 setter（存器）的方法。这两种方法都用于尊重以\
    \ `_` 开头的属性的意图。Getter 可以返回内部属性的值，setter 可以安全地重新分配属性值。现在，让我们看看如果我们更改没有 getter 或\
    \ setter 的属性会发生什么。\n\n### 指令 1\n\n1. 在 `robot` 对象下方，将 `_energyLevel` 属性重新赋值为 `'high'`。\n\
    \nCheckpoint 2 Passed\n卡住了？获取提示\n\n2. 现在查看 `robot` 中新的 `recharge` 方法。`.recharge()`\
    \ 会给 `_energyLevel` 增加 30。\n\n现在 `_energyLevel` 不是一个数字时会发生什么？在 `robot` 上调用 `.recharge()`\
    \ 来查找结果。\n\n注意控制台上打印了一个奇怪的字符串！这被称为类型转换的副作用。目前不需要担心这意味着什么，但理解这一点很重要：在修改对象及其属性时，可能会引起意外的副作用。\n\
    \n![](img/image04827.jpeg)\n\n## Getters\n\nGetter 是获取并返回对象内部属性的方法。但它们的功能不仅仅是检索属性值！让我们来看一个\
    \ getter 方法：\n\n![](img/image04828.jpeg)\n\n![](img/image04829.jpeg)\n\n注意上面的\
    \ getter 方法中：\n\n![](img/image04830.jpeg)\n* 我们使用 `get` 关键字后跟一个函数。\n* 我们使用 `if`\
    \ 条件判断检查 `_firstName` 和 `_lastName` 是否都存在（通过确保它们都返回真值），然后根据结果返回不同的值。\n* 我们可以使用\
    \ `this` 访问调用对象的内部属性。\n\n在 `fullName` 中，我们同时访问了 `this._firstName` 和 `this._lastName`。\n\
    * 在最后一行，我们在 `person` 上调用了 `fullName`。通常情况下，getter 方法不需要带括号调用。在语法上，它看起来像是在访问一个属性。\n\
    \n既然我们已经过了语法，让我们讨论一下使用 getter 方法的一些显著优势：\n\n* Getter 在获取属性时可以对数据执行操作。\n* Getter\
    \ 可以使用条件判断返回不同的值。\n* 在 getter 中，我们可以使用 `this` 访问调用对象的属性。\n* 我们代码的功能更容易让其他开发者理解。\n\
    \n使用 getter（以及 setter）方法时需要记住的另一点是，属性不能与 getter/setter 函数同名。如果这样做，调用方法将导致无限递归栈错误。\n\
    \n一种解决方法是在属性名称之前像上面示例中那样添加下划线。\n\n太棒了，开始 getter 吧！\n\n### 指令 1\n\n1. 在 `robot`\
    \ 中，使用 `get` 关键字创建一个名为 `energyLevel` 的 getter 方法。暂时保持函数体为空。\n\nCheckpoint 2 Passed\n\
    卡住了？获取提示\n\n2. 在 getter 方法内部，添加一个 `if` 语句使用 `typeof` 运算符检查 `this._energyLevel`\
    \ 是否为数字。如果该条件为真，则返回 `'My current energy level is ENERGYLEVEL'`。\n\n将 `ENERGYLEVEL`\
    \ 替换为 `this._energyLevel` 的值。\n确保返回的是字符串，而不是将其打印到控制台。\n\nCheckpoint 3 Passed\n\
    卡住了？获取提示\n\n3. 如果 `this._energyLevel` 不是数字，可能是 `energyLevel` 属性被修改了。让我们添加一个默认返回。添加一个\
    \ `else` 返回 `'System cannot retrieve level'`。\n\nCheckpoint 4 Passed\n卡住了？获取提示\n\
    \n4. 在 `robot` 上调用 getter 方法 `energyLevel` 并将结果打印到控制台。\n\nCheckpoint 5 (implied)\n\
    \n## Setters\n\n除了 getter 方法，我们还可以创建 setter 方法来重新分配对象的值。让我们来看一个 setter 的示例：\n\n\
    ![](img/image04830.jpeg)\n\n注意上面的代码：\n* 我们可以对给 `this._age` 的值进行检查。\n* 当我们使用 setter\
    \ 方法时，只有数字值会重新赋值 `this._age`。\n* 根据设置的内容，会有不同的输出。\n\n像 `age` 这样的 setter 方法不需要带括号调用。在语法上，它看起来像是在重新赋值属性的值。\n\
    \n尽管如此即使有了 setter 方法，仍然可以直接重新赋值属性。例如，在上面的示例中，我们仍然可以直接设置 `._age`：\n\n![](img/image0485.jpeg)\n\
    \n1. 目前，`robot` 中有一个 `numOfSensors` 的 getter 方法，但没有 setter 方法！如果我们需要添加或删除传感器怎么办？让我们修复这个问题。使用\
    \ `set` 关键字添加名为 `numOfSensors` 的 setter 方法。提供一个参数 `num`。暂时保持函数体为空。\n\nCheckpoint\
    \ 2 Passed (implied)\n\n2. 在 setter 方法中，我们需要做几件事：\n* 使用 `typeof` 运算符检查 `num` 是否为数字。\n\
    * `num` 还应该大于或等于 0。\n* 如果两个条件都满足，将 `this._numOfSensors` 重新赋值为 `num`。\n\nCheckpoint\
    \ 3 Passed (implied)\n\n3. 现在添加一个 `else`，向控制台打印 `'Pass in a number that is greater\
    \ than or equal to 0'`。\n\nCheckpoint 4 Passed\n\n4. 使用 `robot` 上的 `numOfSensors`\
    \ setter 方法将 `_numOfSensors` 赋值为 10。\n\nCheckpoint 5 Passed\n\n## 工厂函数\n\n到目前为止，我们都是逐个创建对象，但有时我们需要快速创建许多对象的实例。这就是工厂函数（Factory\
    \ Functions）大显身场的地方。现实中的工厂能够快速、大规模地生产物品的副本。工厂函数是一个返回对象的函数，并可以重复用以创建多个对象实例。\n\n\
    工厂函数还可以拥有参数，允许我们自定义所返回的对象。\n\n"
