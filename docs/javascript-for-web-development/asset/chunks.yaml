    ### Review Variables


    Nice work! This lesson introduced you to variables, a powerful concept you will
    use in all your future programming endeavors.


    Let’s review what we learned:


    * Variables hold reusable data in a program and associate it with a name.

    * Variables are stored in memory.

    * The `var` keyword is used in pre-ES6 versions of JS.

    * `let` is the preferred way to declare a variable when it can be reassigned,
    and `const` is the preferred way to declare a variable with a constant value.

    * Variables that have not been initialized store the primitive data type `undefined`.

    * Mathematical assignment operators make it easy to calculate a new value and
    assign it to the same variable.

    * The `+` operator is used to concatenate strings including string values held
    in variables.

    * In ES6, template literals use backticks ` ` and `${}` to interpolate values
    into a string.

    * The `typeof` keyword returns the data type (as a string) of a value.


    ### What are Conditional Statements?


    In life, we make decisions based on circumstances. Think of an everyday decision
    as mundane as falling asleep — if we are tired, we go to bed, otherwise, we wake
    up and start our day.


    These if-else decisions can be modeled in code by creating conditional statements.
    A conditional statement checks a specific condition(s) and performs a task based
    on the condition(s).


    In this lesson, we will explore how programs make decisions by evaluating conditions
    and introduce logic into our code!


    We’ll be covering the following concepts:


    * `if`, `else if`, and `else` statements

    * comparison operators

    * logical operators

    * truthy vs falsy values

    * ternary operators

    * switch statement


    So if you’re ready to learn these concepts go to the next lesson— else, read over
    the concepts, observe the diagram, and prepare yourself for this lesson!


    #### Instructions


    Check out the diagram to see how conditionals allow us to create decision-making
    technology.


    ![](Images/image04606.jpeg)


    ### If Statement


    We often perform a task based on a condition. For example, if the weather is nice
    today, then we will go outside. If the alarm clock rings, then we’ll shut it off.
    If we’re tired, then we’ll go to sleep.


    In programming, we can also perform a task based on a condition using an `if`
    statement:


    ![](Images/image04607.jpeg)


    Notice in the example above, we have an `if` statement. The `if` statement is
    composed of:


    * The `if` keyword followed by a set of parentheses `()` which is followed by
    a code block, or block statement, indicated by a set of curly braces `{}`.

    * Inside the parentheses `()`, a condition is provided that evaluates to `true`
    or `false`.

    * If the condition evaluates to `true`, the code inside the curly braces `{}`
    runs, or executes.

    * If the condition evaluates to `false`, the block won’t execute. Let’s make an
    `if` statement.


