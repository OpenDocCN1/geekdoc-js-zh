    # 三元运算符


    本着使用简化语法的精神，我们可以使用三元运算符来简化 `if...else` 语句。


    看看这个 `if...else` 语句示例：


    ![](img/image04623.jpeg)


    我们可以使用三元运算符来实现相同的功能：


    ![](img/image04624.jpeg)


    在上面的示例中：


    *   条件 `isNightTime`位于 `?` 之前。

    *   两个表达式跟在 `?` 后面并用冒号 `:` 分隔。

    *   如果条件求值为 `true`，则执行第一个表达式。


