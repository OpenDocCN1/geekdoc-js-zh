  trans: '


    让我们练习创建使用默认参数的函数。


    ## 指南 1


    `makeShoppingList()` 函数根据作为参数传递给函数的项目创建一个购物列表。


    想象一下，你每次去买杂货时都会购买牛奶、面包和鸡蛋。为了让创建购物清单变得更简单，让我们为 `makeShoppingList()` 中的参数分配默认值。


    将 `makeShoppingList()` 的参数改为默认参数：


    *   将 `''milk''` 分配 `item1` 的默认值。

    *   将 `''bread''` 分配 `item2` 的默认值。

    *   将 `''eggs''` 分配 `item3` 的默认值。


    ![](img/image04642.jpeg)

    ![](img/image04643.jpeg)


    ## 返回 (Return)


    当调用一个函数时，计算机将运行函数的代码并评估调用函数的结果。默认情况下，该结果值为 `undefined`。


    ![](img/image04644.jpeg)


    在代码示例中，我们定义了一个函数来计算 `width` 和 `height` 参数的面积。然后使用参数 `5` 和 `7` 调用了 `rectangleArea()`。但当我们去打印结果时，我们得到了
    `undefined`。是我们写错函数了吗？没有！事实上，函数运行正常，计算机确实计算了面积为 `35`，但我们没有捕获它。那么我们怎么做呢？使用 `return`
    关键字！


    为了从函数调用传回信息，我们使用 `return` 语句。要创建一个 `return` 语句，我们使用 `return` 关键字，加上想要返回的值。正如我们在上面看到的，如果省略该值，则会返回
    `undefined`。


    当在函数体中使用 `return` 语句时，函数的执行将停止，随后的代码将不会执行。看下面的示例：


    ![](img/image04645.jpeg)

    ![](img/image04646.jpeg)![](img/image04647.jpeg) 如果 ororis 的参数小于 `0`，则 `rectangleArea()`
    将返回 `''You need positive integers to calculate area!''`。第二个 `return` 语句 `width
    * height` 将不会运行。


    `return` 关键字是强大的，因为它允许函数产生输出。我们可以将输出保存到变量中供以后使用。


    ## 指南 1


    想象一下我们需要为办公室里的每个人订购显示器，而这个办公室方便地排列成网格状。我们可以使用函数来帮助计算所需的显示器数量！


    声明一个带有两个参数的函数 `monitorCount()`。第一个参数是 `rows`，第二个参数是 `columns`。


    **检查点 2 已通过**

    卡住了？获取提示


    2.

    让我们通过将 `rows` 和 `columns` 相乘来计算显示器的数量并返回该值。


    在你刚刚编写的函数体中，使用 `return` 关键字返回 `rows * columns`。


    **检查点 3 已通过**

    卡住了？获取提示


    3.

    现在函数已经定义好了，我们可以计算所需的显示器数量。假设办公室有 5 行 4 列。


    使用 `const` 关键字声明一个名为 `numOfMonitors` 的变量，并将使用参数 `5` 和 `4` 调用 `monitorCount()`
    的结果赋值给 `numOfMonitors`。


    **检查点 4 已通过**

    卡住了？获取提示


    4.

    为了检查函数是否正常工作，在 `console` 中记录 `numOfMonitors`。


    ![](img/image04648.jpeg)


    ## 辅助函数 (Helper Functions)


    我们也可以在另一个函数内部使用函数的返回值。在另一个函数内部调用的函数通常被称为辅助函数。由于每个函数都在执行特定任务，这使得我们的代码更容易阅读，并在需要时更容易调试。


    如果我们想定义一个将温度从摄氏（Celsius）转换为华氏（Fahrenheit）的函数，我们可以写两个函数：


    ![](img/image04649.jpeg)


    在上面的示例中：


    *   调用 `getFahrenheit()` 并传入 `15` 作为参数。

    *   `getFahrenheit()` 内部的代码块调用 `multiplyByNineFifths()` 并传入 `15` 作为参数。

    *   `multiplyByNineFifths()` 接收参数 `15` 作为 `number` 参数。

    *   `multiplyByNineFifths()` 函数内部块将 `15` 乘以 `(9/5)`，结果为 `27`。

    *   `27` 返回给 `getFahrenheit()` 中的函数调用。

    *   `getFahrenheit()` 继续执行。它将 `27` 加上 `32`，结果为 `59`。

    *   最后，`59` 返回给函数调用 `getFahrenheit(15)`。


    `return` 关键字是强大的，因为它允许函数产生输出。我们可以将输出保存到变量中供以后使用。


    ## 函数表达式 (Function Expressions)


    定义函数的另一种方法是使用函数表达式。要在表达式内部定义函数，我们可以使用 `function` 关键字。在函数表达式中，名称通常会被省略。没有名称的函数被称为匿名函数。函数表达式通常存储在变量中以便引用。


    考虑以下函数表达式：


    要声明函数表达式：

    1. 声明一个变量，使该变量名称成为函数的名称或标识符。自 ES6 发布以来，使用 `const` 作为关键字来声明变量是一种常见做法。

    2. 将一个通过使用 `function` 关键字加上一组带有可能参数的括号创建的匿名函数赋值为该变量的值。然后是跟一个包含函数体的大括号。


    要调用函数表达式，编写存储该函数的变量名，后跟一个括了任何传入函数参数的括号 `variableName(argument1, argument2)`。与函数声明不同，函数表达式不会被提升（hoisted），因此它们在定义之前无法被调用。


    让我们使用函数表达式定义一个新函数。


