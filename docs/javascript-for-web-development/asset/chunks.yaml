    \ that are numbers will  reassign  this._age\n\n• There are different outputs\
    \ depending on what values are used to  reassign  this._age.\n\nThen  to  use\
    \ the setter method:\n\n![](Images/image04834.jpeg)\n\nSetter methods like  age\
