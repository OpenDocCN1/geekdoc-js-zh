    ## 复习


    恭喜完成高级对象课程！让我们回顾一下本课涵盖的概念：


    - 方法所属的对象被称为调用对象（calling object）。

    - `this` 关键字指向调用对象，并可访问调用对象的属性。

    - 方法不会自动访问调用对象的其他内部属性。

    - `this` 的值取决于从何处访问 `this`。

    - 如果我们想要访问其他内部属性，就不能将箭头函数用方法。

    - JavaScript 对象没有内置私有性，而是有一套约定来告知其他开发者代码的意图。

    - 属性名称前的下划线表示原始开发者并不打算让该属性被直接修改。

    - Setter（set 器）和 getter（访问）方法提供了更详细的访问和分配属性的方法。

    - 工厂函数（Factory functions）允许我们快速且重复地创建对象实例。

    - 使用对象解构有多种方法：一种是属性值简写，另一种是解构赋值。

    - 与任何概念一样，学习如何配合对象使用文档是一项良好的技能！


    ## 类介绍


    JavaScript 是一种面向对象的编程（OOP）语言，我们可以用它来模拟现实世界的物品。在本节中，你将学习如何创建类（classes）。


    类是开发者用来快速生成相似对象的工具。


