    \ are similar advantages to using setter methods  that include checking input,\
    \ performing actions on properties, and  displaying  a clear  intention for  how\
    \ the  object is supposed to be  used.\n\nNonetheless, even with a setter method,\
    \ it is still possible to directly  reassign properties. For example, in the example\
    \ above, we can still  set  ._age  directly:\n\n![](Images/image04835.jpeg)\n\n\
    1.\n\nCurrently, in  robot  there is a  getter  method  for  numOfSensors  but\
    \ no  setter  method! What if we need to add or remove some sensors? Let’s fix\
    \ that  problem.\n\nAdd  a setter method named  numOfSensors  using  the  set\
    \  keyword. Provide a  parameter  of  num. Leave the function body  empty for\
    \ now.\n\n Checkpoint 2 Passed\n\nStuck?  Get a hint\n\n2.\n\nThere  are a  couple\
    \  of things we should  do in the setter  method:\n\n• Add  a  check  to see \
    \ if  num  is a number using  the  typeof  operator.\n\n• num  should also be\
    \ greater  than or  equal to  0.\n\n• If  both conditions are  met,  reassign\
    \  this._numOfSensors  to  num.\n\n Checkpoint 3 Passed\n\nStuck?  Get a hint\n\
    \n3.\n\nNow  add  an  else  that logs  'Pass  in a  number  that is greater  than\
    \ or  equal  to  0'  to  the  console.\n\n Checkpoint 4 Passed\n\nStuck?  Get\
    \ a hint\n\n4.\n\nUse  the  numOfSensors  setter  method  on  robot  to assign\
    \  _numOfSensors  to  100.\n\n Checkpoint 5 Passed\n\nStuck?  Get a hint\n\n5.\n\
    \nTo  check  that the  setter  method worked,  console.log()  robot.numOfSensors.\n\
    \n![](Images/image04836.jpeg)\n\nFactory  Functions\n\nSo far we’ve been creating\
    \ objects individually, but there are times where  we want to create many instances\
    \ of an object quickly. Here’s where factory  functions come in. A real world\
