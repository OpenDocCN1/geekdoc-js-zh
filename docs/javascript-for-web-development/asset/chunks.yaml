    # async GET Requests II


    We are going to walk through and recreate the boilerplate code necessary to create
    a GET request using the `async` and `await`.


    Here are some key points to keep in mind as we walk through the code:


    • Using an `async` function that will return a promise.

    • `await` can only be used in an `async` function. `await` allows a program to
    run while waiting for a promise to resolve.

    • In a `try...catch` statement, code in the `try` block will be run and in the
    event of an exception/error, the code in the `catch` statement will run.


    Feel free to refer to the async/await GET diagram at any point while completing
    this exercise:


    • [async/await GET diagram](https://content.codecademy.com/courses/intermediate-javascript-requests/diagrams/async%20await%20GET%20diagram.svg)


