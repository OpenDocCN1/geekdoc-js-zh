  trans: "\n\n在编程中，我们经常使用代码来多次执行特定的任务。与其重复编写相同的代码，我们可以将一组代码分组并将其与某个任务关联，这样每当我们需要再次执行该任务时，就可以重用这块代码。我们通过创建函数来实现这一目标。函数是一个可重用的代码块，它将一组语句组合在一起以执行特定任务。\n\
    \n在本节中，你将学习如何创建和使用函数，以及如何利用它们来创建更清晰、更简洁的代码。\n\n## 函数声明\n\n在 JavaScript 中，有许多创建函数的方法。一种方法是使用函数声明。就像变量声明将值绑定到变量名一样，函数声明将函数绑定到一个名称（或标识符）上。请看下方的函数声明结构：\n\
    \n一个函数声明由以下部分组成：\n\n*   `function` 关键字。\n*   函数名（或其标识符），后面跟着圆括号 `()`。\n*   函数体，即执行特定任务所需的语句块，被封装在函数的大括号\
    \ `{ }` 之中。\n\n函数声明是绑定到标识符或名称的函数。在下一个练习中，我们将介绍如何运行函数体内部的代码。\n\n我们还应该注意到 JavaScript\
    \ 中的**提升（hoisting）**特性，它允许在定义函数声明之前访问它们。\n\n看看这个提升的示例：\n\n![](img/image04634.jpeg)\n\
    \n注意看提升是如何允许在定义 `greetWorld()` 函数之前对其调用的！由于提升不被认为是良好实践，我们只是想让你了解这一特性。\n\n如果你想阅读更多关于提升的知识，请查看\
    \ [MDN 文档](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting) 中的[关于提升的内容](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting)。\n\
    \n### 指南 \n\n1.  让我们创建一个在控制台打印提醒信息的函数。使用函数声明，创建一个名为 `getReminder()` 的函数。\n\n检查点\
    \ 2 已通过\n卡住了？获取提示\n\n2.  在 `getReminder()` 的函数体中，向控制台记录以下提醒：`'Water the plants.'`\n\
    \n检查点 3 已通过\n卡住了？获取提示\n\n3.  让我们创建另一个函数，在控制台打印一句实用的西班牙语旅游短语。使用函数声明，创建一个名为 `greetInSpanish()`\
    \ 的函数。\n\n检查点 4 已通过\n卡住了？获取提示\n\n4.  向 `greetInSpanish()` 的函数体添加代码：\n*   在函数体内部通过\
    \ `console.log()` 向控制台记录以下西班牙语短语：`'Buenas Tardes.'`\n\n![](img/image04635.jpeg)\n\
    \n## 调用函数\n\n正如我们在之前的练习中看到的，函数声明将函数绑定到标识符。然而，函数声明并不会要求函数体内的代码运行，它只是声明了函数的存在。只有在函数被调用时，函数体内的代码才会运行或执行。\n\
    \n要在代码中调用函数，你输入函数名并在后面加上圆括号 `()`。这种函数调用会执行函数体，即函数声明中大括号之间的所有语句。我们可以根据需要多次调用同一个函数。让我们在代码中练习调用函数吧。\n\
    \n![](img/image04636.jpeg)\n\n1.  想象你经营着一家在线商店。当客户下单时，你会给他们发送一封感谢信。让我们创建一个函数来完成这项任务：\n\
    *   ![](img/image04637.jpeg) 使用函数声明定义一个名为 `sayThanks()` 的函数。\n*   在 `sayThanks()`\
    \ 的函数体中添加代码，使得函数在被调用时向控制台写入以下感谢信息：`'Thank you for your purchase! We appreciate\
    \ your business.'`\n\n检查点 2 已通过\n卡住了？获取提示\n\n2.  调用 `sayThanks()` 在控制台查看感谢信息。\n\
    \n检查点 3 已通过\n卡住了？获取提示\n\n3.  函数可以根据需要调用任意次数。想象有三位客户下了订单，你想给他们每人发送一条感谢信息。更新你的代码以调用三次\
    \ `sayThanks()`。\n\n![](img/image04638.jpeg)\n\n## 参数和参数\n\n到目前为止，我们创建的函数在没有输入的情况下执行任务。然而，某些函数可以接受输入并使用这些输入来执行任务。在声明函数时，我们可以指定它的**参数（parameters）**。参数允许函数接受输入并使用输入完成任务。我们使用参数作为占位符，表示在被调用时将传递给函数的信息。\n\
    \n让我们观察如何在函数声明中指定参数：\n\n在上面的图中，`calculateArea()` 根据两个输入 `width`（宽度）和 `height`（高度）计算矩形的面积。参数在圆括号之间指定为\
    \ `width` 和 `height`，在函数体内部，它们的作用就像普通变量。`width` 和 `height` 作为待相乘值的占位符。\n\n在调用带有参数的函数时，我们在函数名后的圆括号中指定值。在被调用时传递给函数的值被称为**参数（arguments）**。参数可以以值或变量的形式传递给函数。\n\
    \n在上面的函数调用中，数字 `10` 被传递为 `width`，`6` 被传递为 `height`。注意，参数传递和赋值的顺序遵循参数声明的顺序。变量 `rectWidth`\
    \ 和 `rectHeight` 在用于函数调用之前已用矩形的高度和宽度值进行了初始化。\n\n通过使用参数，`calculateArea()` 可以被重用来计算任何矩形的面积！函数是计算机编程中强大的工具，所以让我们练习创建和调用带参数的函数。\n\
    \n### 指南\n\n1.  `sayThanks()` 函数运行良好，但让我们在信息中加入客户的名字。为 `sayThanks()` 的函数声明添加一个名为\
    \ `name` 的参数。\n\n检查点 2 已通过\n卡住了？获取提示\n\n2.  使用 `name` 作为参数，它可以在 `sayThanks()`\
    \ 的函数体内作为变量使用。使用 `name` 和字符串拼接，将感谢信息更改为如下：\n\n![](img/image0439.jpeg)\n复制并粘贴上述消息到你的代码中。\n\
    \n检查点 3 已通过\n卡住了？获取提示\n\n3.  一位名叫 Cole 的客户刚在你的在线商店购买了东西。调用 `sayThanks()` 并传递 `'Cole'`\
    \ 作为参数，给 Cole 发送个性化的感谢信息。\n\n![](img/image0440.jpeg)\n\n## 默认参数\n\nES6 添加的功能之一是使用**默认参数（default\
    \ parameters）**的能力。默认参数允许参数在没有传递到函数或调用时参数为 `undefined` 的情况下具有一个预定的值。\n\n看看下面使用默认参数的代码片段：\n\
    \n![](img/image0441.jpeg)\n\n*   在上面的示例中，我们使用 `=` 运算符为 ![](img/image0458.jpeg)参数\
    \ `name` 分配了默认值 `'stranger'`。这在我们可能想要包含一个非个性化的默认问候时非常有用！\n*   当代码调用 `greeting('Nick')`\
    \ 时，参数的值被传进来，`'Nick'` 将覆盖默认参数 `'stranger'`，从而在控制台记录 `'Hello, Nick!'`。\n*   当没有参数传递到\
    \ `greeting()` 时，将使用默认值 `'stranger'`，并在控制台记录 `'Hello, stranger!'`。\n\n通过使用默认参数，我们考虑了向期望参数的函数未传递参数的情况。\n\
    \n"
