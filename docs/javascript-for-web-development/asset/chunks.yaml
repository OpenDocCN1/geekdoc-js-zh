  trans: '

    转译（Transpilation）是将一种编程语言转换为另一种语言的过程。


    在本节剩余的练习中，你将学习如何使用 `Babel` 将新的、易于编写的 JavaScript 版本 (ES6) 转译为旧的、浏览器 JavaScript
    版本 (ES5)。


    在下面的指令中，你将把 JavaScript ES6 代码传递给 `Babel`，它将其译为 `ES5` 并写入 `lib` 目录下的文件中。


    ![](img/image04913.jpeg)


    ### 1.


    在终端窗口中输入：


    ![](img/image04914.jpeg)


    这安装了两个所需的 `Babel` 包之一。


    ![](img/image04915.jpeg) 检查点 2 通过


    ### 2.


    在终端窗口中输入：


    ![](img/image04916.jpeg)


    这安装了两个所需的 `Babel` 包中的第二个。


    ![](img/image04915.jpeg) 检查点 3 通过


    ### 3.


    在终端中输入 `npm run build` 并按回车。你可以在 `./lib/main.js` 中查看 ES5 代码。


    你可能需要刷新才能看到新的 `lib` 目录。


    ![](img/image04917.jpeg)


    ```bash

    npm init

    ```


    在上在上练习中，你在终端中写了一条命令将 ES6 代码转译为 ES5。在接下来的五个练习中，你将学习如何设置一个 JavaScript 项目，以便在 JavaScript
    项目根目录下运行 `npm run build` 时能够自动转译代码。


    第一步是将你的 ES6 JavaScript 文件放在名为 `src` 的目录中。从根目录来看，ES6 文件的路径为 `./src/main.js`。


    初始的 JavaScript 项目文件结构如下：


    ![](img/image04918.jpeg)


    在我们安装 `Babel` 之前，我们需要配置项目使用 [node](https://docs.npmjs.com/getting-started/what-is-npm)
    [包管理器 (npm)](https://docs.npmjs.com/getting-started/what-is-npm)。开发者使用 `npm` 来访问和管理
    Node 包。Node 包是包含其他开发者编写的 JavaScript 代码的目录。你可以使用这些包来减少重复工作并避免错误。


    在我们向项目目录添加 `Babel` 之前，我们需要运行 `npm init`。`npm init` 命令会在根目录下创建一个 `package.json`
    文件。


    `package.json` 文件包含了有关当前 JavaScript 项目的信息。其中包含部分信息包括：


    - 元数据 —— 这包括项目标题、描述、作者等。

    - 项目所需的 node 包列表 —— 如果其他开发者想要运行你的项目，`npm` 会查看 `package.json` 内部并下载此列表中的包。

    - 命令行脚本的键值对 —— 你可以使用 `npm` 运行这些简写脚本来执行某些过程。在稍后的练习中，我们将添加一个运行 `Babel` 并将 ES6 转译为
    ES5 的脚本。


    如果你电脑上安装了 Node，你可以在终端中输入 `npm init` 来创建一个 `package.json` 文件。


    终端会提示你填写项目元数据的字段（名称、描述等）。


    你并不需要回答这些提示，但我们建议至少添加你自己的标题和描述。如果你不想填写某个字段，可以按按回车键。`npm` 在创建 `package.json` 文件时，将使用默认值填充这些字段或将其留空。


    运行 `npm init` 后，你的目录结构将包含以下文件和文件夹：


    ![](img/image04919.jpeg)


    `npm` 将 `package.json` 文件添加到与 `src` 目录相同的级别。


    ### 指令 1.


    在终端中运行 `ls` 查看当前目录的文件结构。


    检查点 2 通过


    ### 2.


    使用 `npm` 创建一个新的 `package.json` 文件。我们建议你将 `name` 和 `description` 属性设置为以下值：


    - `name` — `learning-babel`

    - `description` — `Use Babel to transpile JavaScript ES6 to ES5`


    在终端中输入 `ls` 查看当前目录的文件结构。注意到 `package.json` 的添加。


    ```bash

    npm init

    ```


    在上在上练习中，你在终端中写了一条命令将 ES6 代码转译为 ES5。在接下来的五个练习中，你将学习如何设置一个 JavaScript 项目，以便在 JavaScript
    项目根目录下运行 `npm run build` 时能够自动转译代码。


