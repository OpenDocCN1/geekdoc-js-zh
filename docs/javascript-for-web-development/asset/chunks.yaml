    We’ve abstracted the shared properties and methods of our `Cat` and `Dog` classes
    into a parent class called `Animal` (See below).


    ![](Images/image04887.jpeg)


    Now that we have these shared properties and methods in the parent `Animal` class,
    we can extend them to the subclass, `Cat`.


    ![](Images/image04888.jpeg)

    ![](Images/image04889.jpeg)In the example above, we create a new class named the
    `Animal` class. Let’s pay special attention to our new keywords: `extends` and
    `super`.


    that extends


    - The `extends` keyword makes the methods of the animal class available inside
    the cat class.

    - The `constructor`, called when you create a new `Cat` object, accepts two arguments,
    `name` and `usesLitter`.

    - The `super` keyword calls the constructor of the parent class. In this case,
    `super(name)` passes the `name` argument of the `Cat` class to the `constructor`
    of the `Animal` class. When the `Animal` constructor runs, it sets `this._name
    = name;` for new `Cat` instances.

