    假设我们有一盆植物，需要每周周三浇一次水。我们可以定义一个函数表达式来帮助检查星期几以及植物是否需要水：


    *   使用 `const` 变量关键字创建一个名为 `plantNeedsWater` 的变量。

    *   将一个接收参数 `day` 的匿名函数赋值给 `plantNeedsWater`。


