    Note that when we `console.log()` the computer will evaluate the expression inside
    the parentheses and print that result to the console. If we wanted to print the
    characters `3 + 4`, we would wrap them in quotes and print them as a string.


    ![](Images/image04570.jpeg)


    The remainder operator, sometimes called modulo, returns the number that remains
    after the right-hand number divides into the left-hand number as many times as
    it evenly can: `11 % 3` equals `2` because `3` fits into `11` three times, leaving
    `2` as the remainder.


    ### Instructions


    1.

    Inside a `console.log()`, add `3.5` to your age.

    This is the age you’ll be when we start sending people to live on Mars.

    Checkpoint 2 Passed

    Stuck? Get a hint


    2.

    On a new line write another `console.log()`. Inside the parentheses, take the
    current year and subtract `1969`.

    The answer is how many years it’s been since the `1969` moon landing.

    Checkpoint 3 Passed

    Stuck? Get a hint


    3.

    Create another `console.log()`. Inside the parentheses divide `65` by `240`.

    Checkpoint 4 Passed

    Stuck? Get a hint


    4.

    Create one last `console.log()`. Inside the parentheses, multiply `0.2708` by
    `100`.

    That’s the percent of the sun that is made up of helium. Assuming we could stand
    on the sun, we’d all sound like chipmunks!

    ![](Images/image04571.jpeg)


    ### String Concatenation


    ![](Images/image04568.jpeg)Operators aren’t just for numbers! When a `+` operator
    is used on two strings, it appends the right string to the left string:


    ![](Images/image04572.jpeg)


    This process of appending one string to another is called concatenation.


    Notice in the third example we had to make sure to include a space at the end
    of the first string. The computer will join the strings exactly, so we needed
    to make sure to include the space we wanted between the two strings.


    ![](Images/image04573.jpeg)


    Just like regular math, we can combine, or chain, our operations to get a final
    result:


    ![](Images/image04574.jpeg)


    1.

    ![](Images/image04575.jpeg)Inside a strings statement, concatenate the two and
    `''World''`.

    Note: You should concatenate the two strings exactly (without introducing any
    additional characters).

    Checkpoint 2 Passed

    Stuck? Get a hint


    2.

    We left off the space last time. Create a second `console.log()` statement in
    which you concatenate the strings `''Hello''` and `''World''`, but this time make
    sure to also include a space (`'' ''`) between the two words.


    ![](Images/image04576.jpeg)


    ### Properties


    When you introduce a new piece of data into a JavaScript program, the browser
    saves it as an instance of the data type. Every string instance has a property
    called `length` that stores the number of characters in that string.


    You can retrieve property information by appending the string with a period and
    the property name:


    ```javascript

    console.log(''Hello''.length);  // Prints 5

    ```


    The `.` is another operator! We call it the dot operator.


    In the example above, the value saved to the `length` property is retrieved from
    the instance of the string, `''Hello''`. The program prints `5` to the console,
    because `Hello` has five characters in it.


    ### Instructions


    1.

    Use the `.length` property to log the number of characters in the following string
    to the console:

    `''Teaching the world how to code''`


    ```javascript

    console.log(''Teaching the world how to code''.length);

    ```

    Checkpoint 2 Passed

    Stuck? Get a hint


    2.

    In the second `console.log()` statement in `app.js`, we have a string `'' Remove
    whitespace ''` which has spaces before and after the words `''Remove whitespace''`.


    If we browse the [JavaScript string documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/prototype),
    we find several built-in string methods that each accomplish a different goal.
    The one method that seems ideal for us is `.trim()`.


    Use the method to remove the whitespace at the beginning and end of the string
    in the second `console.log()` statement.


    ![](Images/image04578.jpeg)


    ### Variables


    In programming, a variable is a container for a value. You can think of variables
    as little containers for information that live in a computer’s memory. Information
    stored in variables, such as a username, account number, or even personalized
    greeting can then be found in memory.


    Variables also provide a way of labeling data with a descriptive name, so our
    programs can be understood more clearly by the reader and ourselves.


    In short, variables label and store data in memory. There are only a few things
    you can do with variables:


    1. Create a variable with a descriptive name.

    2. Store or update information stored in a variable.

    3. Reference or “get” information stored in a variable.


    It is important to distinguish that variables are not values; they contain values
    and represent them with a name. Observe the diagram with the colored boxes. Each
    box represents variables; the values are represented by the content, and the name
    is represented with the label.


    In this lesson, we will cover how to use the `var`, `let`, and `const` keywords
    to create variables.


    ![](Images/image04579.jpeg)


    ### Create a Variable: var


    There were a lot of changes introduced in the ES6 version of JavaScript in 2015.
    One of the biggest changes was two new keywords, `let` and `const`, to create,
    or declare, variables. Prior to the ES6, programmers could only use the `var`
    keyword to declare variables.


    ![](Images/image04580.jpeg)


    Let’s consider the example above:


    1. `var`, short for variable, is a JavaScript keyword that creates, or declares,
    a new variable.

    2. `myName` is the variable’s name. Capitalizing in this way is a standard convention
    in JavaScript called camel casing. In camel casing you group words into one, the
    first word is lowercase, then every word that follows will have its first letter
    uppercased. (e.g. `camelCaseEverything`).

    3. `=` is the assignment operator. It assigns the value `''Arya''` to the variable
    `myName`.

    4. `''Arya''` is the value assigned (=) to the variable `myName`. You can also
    say that the `myName` variable is initialized with a value of `''Arya''`.

    5. After the variable is declared, the string value `''Arya''` is printed to the
    console by referencing the variable name: `console.log(myName)`.

