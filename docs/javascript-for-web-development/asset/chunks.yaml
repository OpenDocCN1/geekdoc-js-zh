- fmt: "\n- To take advantage of concurrency, we can use `Promise.all()`.\n\n# ASYNC\
    \ AWAIT\n\n## Introduction\n\nOften in web development, we need to handle asynchronous\
    \ actions—actions we can wait on while moving on to other tasks. We make requests\
    \ to networks, databases, or any number of similar operations. JavaScript is non-blocking:\
    \ instead of stopping the execution of code while it waits, JavaScript uses an\
    \ [event-loop](https://youtu.be/8aGhZQkoFbQ) which allows it to efficiently execute\
    \ other tasks while it awaits the completion of these asynchronous actions.\n\n\
    Originally, JavaScript used callback functions to handle asynchronous actions.\
    \ The problem with callbacks is that they encourage complexly nested code which\
    \ quickly becomes difficult to read, debug, and scale. With ES6, JavaScript integrated\
    \ native [promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)\
    \ which allow us to write significantly more readable code. JavaScript is continually\
    \ improving, and [ES8](https://en.wikipedia.org/wiki/ECMAScript#8th_Edition_-_ECMAScript_2017)\
    \ provides a new syntax for handling our asynchronous action, async...await. The\
    \ `async...await` syntax allows us to write asynchronous code that reads similarly\
    \ to traditional synchronous, imperative programs.\n\nThe `async...await` syntax\
    \ is [syntactic sugar](https://en.wikipedia.org/wiki/Syntactic_sugar)— it doesn’t\
    \ introduce new functionality into the language, but rather introduces a new syntax\
    \ for using promises and [generators](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator).\
    \ Both of these were already built in to the language. Despite this, `async...await`\
    \ powerfully improves the readability and scalability of our code. Let’s learn\
    \ how to use it!\n\n## Instructions 1\n\n![](Images/image04993.jpeg)In this lesson,\
    \ you’ll be given a code-editor to write your code and a bash terminal to execute\
    \ your code. To execute your program, you’ll type `node` ![](Images/image04994.jpeg)app.js`\
    \ in the terminal and hit(or return). You’ll press the “Check Work” button to\
    \ submit your code for evaluation.\n\nCheck out the code we provided. It shows\
    \ three ways of accomplishing the same task: reading and printing from two files\
    \ in a specified order:\n\n* The first version uses callback functions.\n* The\
    \ second version uses native promise syntax.\n* The third version uses `async...await`.\n\
    \n![](Images/image04995.jpeg)Don’t worry about understanding the `async...await`\
    \ syntax— that’s what you’ll learn in this lesson! If you haven’t already, type\
    \ `node app.js` into the terminal and press enter. Then, press “Check Work”.\n\
    \n![](Images/image04996.jpeg) ![](Images/image04997.jpeg) ![](Images/image04998.jpeg)\
    \ ![](Images/image04999.jpeg)\n\n```javascript\nreadFiles();\n\nconst fs = require('fs');\n\
    \nconst promisifiedReadfile = require('./promisifiedReadfile');\n\n// Here we\
    \ use fs.readFile() and callback functions: \nfs.readFile('./file.txt', 'utf-8',\
    \ (err, data) => {\n  if (err) throw err;\n  let firstSentence = data;\n  fs.readFile('./file2.txt',\
    \ 'utf-8', (err, data) => {\n    if (err) throw err;\n    let secondSentence =\
    \ data;\n    console.log(firstSentence, secondSentence);\n  });\n});\n\n// Here\
    \ we use native promises with our \"promisified\" version of readfile:\nlet firstSentence;\n\
    \npromisifiedReadfile('./file.txt', 'utf-8')\n  .then((data) => {\n    firstSentence\
    \ = data;\n    return promisifiedReadfile('./file2.txt', 'utf-8');\n  })\n  .then((data)\
    \ => {\n    let secondSentence = data;\n    console.log(firstSentence, secondSentence)\n\
    \  })\n  .catch((err) => {\n    console.log(err)\n  });\n\n// Here we use promisifiedReadfile()\
    \ again but instead of using the native promise .then() syntax,\n// we declare\
    \ and invoke an async/await function:\nasync function readFiles() {\n  let firstSentence\
    \ = await promisifiedReadfile('./file.txt', 'utf-8');\n  let secondSentence =\
    \ await promisifiedReadfile('./file2.txt', 'utf-8');\n  console.log(firstSentence,\
    \ secondSentence);\n}\n```\n\n![](Images/image05000.jpeg)\n\n## The async Keyword\n\
    \nThe `async` keyword is used to write functions that handle asynchronous actions.\
    \ We wrap our asynchronous logic inside a function prepended with the `async`\
    \ keyword. Then, we invoke that function.\n\n![](Images/image05001.jpeg)\n\nWe’ll\
    \ be using `async` function declarations throughout this lesson, but we can also\
    \ create `async` function expressions:\n\n![](Images/image05002.jpeg)\n\n`async`\
    \ functions always return a promise. This means we can use traditional promise\
    \ syntax, like `.then()` and `.catch` with our `async` functions. An `async` function\
    \ will return in one of three ways:\n\n* If there’s nothing returned from the\
    \ function, it will return a promise with a resolved value of `undefined`.\n*\
    \ If there’s a non-promise value returned from the function, it will return a\
