    Earlier we mentioned that arrays can store other arrays. When an array contains
    another array it is known as a nested array. Examine the example below:


    ```

    const nestedArr = [[1], [2, 3]];

    ```


    To access the nested arrays we can use bracket notation with the index value,
    just like we did to access any other element:


    ![](Images/image04701.jpeg)


    Notice that grab the element in index 1 which is the array [2, 3]. Then if we
    wanted to access the elements within the nested array we can chain, or add on,
    more bracket notation with index values.


