    Create an instance of the `Surgeon` class — set the `name` to ''Francisco Romero''
    and `department` to ''Cardiovascular''. Save the instance to a constant variable
    named `surgeonRomero`.


    Checkpoint 2 Passed


    Stuck? Get a hint


