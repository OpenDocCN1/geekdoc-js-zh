    我们经常根据条件执行任务。例如，如果今天天气不错，我们就会出去。如果闹钟响了，我们就把它关掉。如果我们累了，我们就会睡觉。


    在编程中，我们也可以使用 `if` 语句根据条件执行任务：


    ![](img/image04607.jpeg)


    注意上面的示例，我们有一个 `if` 语句。`if` 语句由以下部分组成：


    * `if` 关键字后面跟着一组括号 `()`，后面是一个代码块或块语句，由一组大括号 `{}` 表示。

    * 在括号 `()` 内部，提供了一个评估结果为 `true` 或 `false` 的条件。

    * 如果条件评估为 `true`，大括号 `{}` 内部的代码将运行或执行。

    * 如果条件评估为 `false`，该块将不会执行。让我们写一个 `if` 语句。


