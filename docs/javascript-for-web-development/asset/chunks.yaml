    \ to `entree`, log the value of `entree` to the console.\n   - Checkpoint 3 Passed\n\
    \   - Stuck? Get a hint\n\n3. Great, let’s see what happens if you try to reassign\
    \ a constant variable. Paste the following code to the bottom of your program.\n\
    \n```\nentree = 'Tacos'\n```\n\nThis code throws the following error when you\
    \ run your code:\n```\nTypeError: Assignment to constant variable.\n```\n\nAfter\
    \ you clear this checkpoint, if you want to see about another quirk of `const`\
    \ in action open the hint!\n![](Images/image04587.jpeg)\n\n## Mathematical Assignment\
    \ Operators\n\nLet’s consider how we can use variables and math operators to calculate\
    \ new values and assign them to a variable. Check out the example below:\n\n|\
    \ `let w = 4; w = w + 1;console.log(w); // Output: 5` || In the example above,\
    \ we created the variable `w` with the number 4 assigned to it. The following\
    \ line, `w = w + 1`, increases the value of `w` from 4 to 5. |\n\nAnother way\
    \ we could have reassigned `w` after performing some mathematical operation on\
    \ it is to use built-in mathematical assignment operators. We could re-write the\
    \ code above to be:\n\n![](Images/image04588.jpeg)\n\nIn the second example, we\
    \ used the `+=` assignment operator to reassign `w`. We’re performing the mathematical\
    \ operation of the first operator `+` using the number to the right, then reassinging\
    \ `w` to the computed value.\n\nWe also have access to other mathematical assignment\
    \ operators: `-=`, `*=`, and `/=` which work in a similar fashion.\n\n![](Images/image04589.jpeg)\n\
    \nLet’s practice using these mathematical assignment operators!\n\n### Instructions\n\
    \n1. Use the `+=` mathematical assignment operator to increase the value stored\
    \ in `levelUp` by 5.\n   - Checkpoint 2 Passed\n   - Stuck? Get a hint\n\n2. ![](Images/image04590.jpeg)\
    \ Use the `-=` mathematical assignment operator to decrease the value stored by\
    \ 100.\n   - Checkpoint 3 Passed\n   - Stuck? Get a hint\n\n3. Use the `*=` mathematical\
    \ assignment operator to multiply the value stored in `multiplyMe` by 11.\n  \
    \ - Checkpoint 4 Passed\n   - Stuck? Get a hint\n\n4. Use the `/=` mathematical\
    \ assignment operator to divide the value stored in `quarterMe` by 4.\n   ![](Images/image04591.jpeg)\n\
    \n## The Increment and Decrement Operator\n\nOther mathematical assignment operators\
