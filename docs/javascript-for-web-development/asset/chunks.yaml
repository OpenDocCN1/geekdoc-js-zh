    使用比较运算符编写一个 `if...else` 语句。条件应该检查 `hungerLevel` 是否大于 `7`。如果是，则条件语句应该打印 `''Time
    to eat!''`。否则，它应该打印 `''We can eat later!''`。


    在按下运行后，通过使用不同的运算符（如 `<=`, `>=`, `>`, 和 `<`）调整 `hungerLevel` 的比较来尝试不同的条件。


    ```javascript

    let hungerLevel = 7;

    ```


    ![](img/image04611.jpeg)


    # 逻辑运算符


    处理条件语句意味着我们将使用布尔值，即 `true` 或 `false` 值。在 JavaScript 中，有可以与布尔值工作的运算符，被称为逻辑运算符。我们可以使用逻辑运算符为我们的条件语句添加更复杂的逻辑。共有三种逻辑运算符：


    *   与运算符（`&&`）

    *   或运算符（`||`）

    *   ![](img/image04612.jpeg) 非，也称为感叹号运算符（`!`）


    当我们使用 `&&` 运算符时，我们正在检查两件事是否都为 `true`：


    当使用 `&&` 运算符时，两个条件都必须求值为 `true`，整个条件才会求值为 `true` 并执行。否则，如果任一条件为 `false`，`&&` 条件将求值为
    `false` 并执行 `else` 块。


    如果我们只关心其中一个条件是否为 `true`，可以使用 `||` 运算符：


    ![](img/image04613.jpeg)


    当使用 `||` 运算符时，只需其中一个条件求值为 `true`，整个语句就会求值为 `true`。在上面的代码示例中，如果 `day === ''Saturday''`
    或 `day === ''Sunday''` 任一个求值为 `true`，`if` 条件将求值为 `true`，其代码块将执行。如果 `||` 语句中的第一个条件求值为
    `true`，则甚至不会检查第二个条件。只有当 `day === ''Saturday''` 求值为 `false` 时，才会评估 `day === ''Sunday''`。上面
    `else` 语句中的代码只有在两个比较都求值为 `false` 时才会执行。


    `!` 非运算符会反转或否定布尔值的值：


    ![](img/image04614.jpeg)


    本质上，`!` 运算符将取一个 `true` 值并返回 `false`，或者取一个 `false` 值并返回 `true`。


    逻辑运算符经常用于条件语句，为我们的代码添加另一层逻辑。


    ### 指令 1.


    在 `main.js` 中有两个变量 `mood` 和 `tirednessLevel`。


    让我们创建一个 `if...else` 语句，检查 `mood` 是否为 `''sleepy''` 且 `tirednessLevel` 是否大于 `8`。


    如果两个条件都求值为 `true`，则通过 `console.log()` 输出字符串 `''time to sleep''`。否则，我们应该 `console.log()`
    `''not bed time yet''`。


    在按下“运行”后，尝试使用 `||` 运算符和 `!` 运算符！如果用 `!` 否定整个语句的值并用 `||` 替换 `&&`，会发生什么？


    ![](img/image04615.jpeg)


    # 真值与假值 (Truthy and Falsy)


    让我们考虑非布尔数据类型（如字符串或数字）在条件内部检查时是如何被求值的。


    有时，你想检查一个变量是否存在，并不一定要求它等于某个特定值——你只需检查该变量是否已赋值。


    这里有一个示例：


    ![](img/image04616.jpeg) 语句中的代码块将运行，因为 `myVariable` 具有 Images/image04617.jpeg)一个真值（truthy
    value）；尽管 `myVariable` 的值并非显式的 `true`，但在布尔或条件上下文中，它求值为 `true`，因为它被赋值了一个非假值。


    那么，哪些值是假值（falsy）——即在作为条件检查时求值为 `false`？假值列表包括：


    *   `0`

    *   空字符串，如 `""` 或 `''''`

    *   `null` 表示完全没有值

    *   `undefined` 表示声明的变量缺少值

    *   `NaN`，或不是数字。这里有一个数字的示例：


    ![](img/image04618.jpeg)


    该条件求值为 `false`，是因为 `numberOfApp` 的值为 `0`。由于 `0` 是假值，`else` 语句中的代码块将运行。


    ### 指令 1.


    更改 `wordCount` 的值使其成为真值。该值仍应该是一个数字。


    在你进行此更改并运行代码后，控制台应打印 ''Great! You''ve started your work!''。


    检查点 2 通过


    卡住了？获取提示


    ### 指令 2.


    更改 `favoritePhrase` 的值，使其仍然是字符串但表现为假值。


    在你进行此更改并运行代码后，控制台应打印 ''This string is definitely empty.''。


    ![](img/image04619.jpeg)


    # 真值与假值的赋值


    真值和假值的求值开启了一个代码简写的可能世界！


    假设你有一个网站，想要获取用户的用户名来制作个性化的问候。有时，用户没有账户，导致 `username` 变量为假值。下面的代码检查 `username`
    是否定义，如果未定义则分配一个默认字符串：


    ![](img/image04620.jpeg)


    如果你结合你对逻辑运算符的知识，可以使用上述代码的简写。在布尔条件中，如果你在赋值中使用 `||` 运算符，JavaScript 会将真值分配给变量：


    ```javascript

    let defaultName = username || ''Stranger'';

    ```


    因为 `||` 语句首先检查左侧的条件，如果 `username` 是真值，变量 `defaultName` 将分配 `username` 的实际值；如果
    `username` 是假值，则将被分配 `''Stranger''`。这个概念也被称为短路值（short-circuit evaluation）。


    ### 指令 1.


