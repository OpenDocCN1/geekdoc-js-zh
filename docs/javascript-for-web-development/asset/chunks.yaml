    * `checkSunglasses` 应该赋值为调用 `checkAvailability()` 的返回值，第一个参数为 ''sunglasses''，第二个参数为
    ''Favorite Supply Co.''。

    * `checkPants` 应该赋值为调用 `checkAvailability()` 的返回值，第一个参数为 ''pants''，第二个参数为 ''Favorite
    Supply Co.''。

    * `checkBags` 应该赋值为调用 `checkAvailability()` 的返回值，第一个参数为 ''bags''，第二个参数为 ''Favorite
    Supply Co.''。


    检查点 3 已通过


    3.


    ![](img/image04990.jpeg)使用一个包含 `checkSunglasses`、`checkPants` 和 `checkBags` 的数组调用
    `Promise.all()`。


    检查点 4 已通过


    卡住了？获取提示


    4.


    为 `Promise.all()` 返回的 promise 链式调用 `.then()`。你应该传入 `onFulfill` 作为成功处理函数。


    检查点 5 已通过


    卡住了？获取提示


    5.


    在链中添加一个 `.catch()`。你应该传入 `onReject` 作为失败处理函数。


