    ## 算术运算符 (Arithmetic Operators)


    基础算术在编程时通常非常有用。


    运算符是执行代码中执行任务的字符。JavaScript 有几种内置的算术运算符，允许我们对数字进行数学计算。这些包括以下运算符及其对应的符号：


    1. 加法：`+`

    2. 减法：`-`

    3. 乘法：`*`

    4. 除法：`/`

    5. 取余：`%`


    前四个的工作方式正如你想象的那样：


    ```javascript

    console.log(3 + 4); // 打印 7

    console.log(5 - 1); // 打印 4

    console.log(4 * 2); // 打印 8

    console.log(9 / 3); // 打印 3

    ```


