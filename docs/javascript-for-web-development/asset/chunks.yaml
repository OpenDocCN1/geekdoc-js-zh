    \ = 'https://api.rebrandly.com/v1/links';\n\n// 元素选择器\nconst shortenButton = document.querySelector('#shorten');\n\
    \n// AJAX 函数\nconst shortenUrl = () => {\n  const urlToShorten = inputField.value;\n\
    \  const data = JSON.stringify({destination: urlToShorten});\n  const xhr = new\
