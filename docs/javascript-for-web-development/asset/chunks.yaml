    ![](Images/image04778.jpeg)


    ## Review

    Awesome job on clearing the iterators lesson! You have learned a number of useful
    methods in this lesson as well as how to use the JavaScript documentation from
    the Mozilla Developer Network to discover and understand additional methods. Let’s
    review!


    * `.forEach()` is used to execute the same code on every element in an array but
    does not change the array and returns `undefined`.

    * `.map()` executes the same code on every element in an array and returns a new
    array with the updated elements.

    * `.filter()` checks every element in an array to see if it meets certain criteria
    and returns a new array with the elements that return truthy for the criteria.

    * `.findIndex()` returns the index of the first element of an array which satisfies
    a condition in the callback function. It returns `-1` if none of the elements
    in the array satisfies the condition.

    * `.reduce()` iterates through an array and takes the values of the elements and
    returns a single value.

    * All iterator methods takes a callback function that can be pre-defined, or a
    function expression, or an arrow function.

    * You can visit the [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)
    to learn more about iterator methods (and all other parts of JavaScript!).


    ## Introduction to Objects

    It’s time to learn more about the basic structure that permeates nearly every
    aspect of JavaScript programming: objects.


    You’re probably already more comfortable with objects than you think, because
    JavaScript loves objects! Many components of the language are actually objects
    under the hood, and even the parts that aren’t— like strings or numbers—can still
    act like objects in some instances.


    There are only seven fundamental data types in JavaScript, and six of those are
    the primitive data types: `string`, `number`, `boolean`, `null`, `undefined`,
    and `symbol`. With the seventh type, objects, we open our code to more complex
    possibilities. We can use JavaScript objects to model real-world things, like
    a basketball, or we can use objects to build the data structures that make the
    web possible.


    At their core, JavaScript objects are containers storing related data and functionality,
    but that deceptively simple task is extremely powerful in practice. You’ve been
    using the power of objects all along, but now it’s time to understand the mechanics
    of objects and start making your own!


    ### Creating Object Literals

    Objects can be assigned to variables just like any JavaScript type. We use curly
    braces, `{}`, to designate an object literal:


    ```javascript

    let spaceship = {}; // spaceship is an empty object

    ```

    We fill an object with unordered data. This data is organized into key-value pairs.
    A key is like a variable name that points to a location in memory that holds a
    value. A key’s value can be of any data type in the language including functions
    or other objects. We make a key-value pair by writing the key’s name, or identifier,
    followed by a colon and then the value. We separate each key-value pair in an
    object literal with a comma (`,`). Keys are strings, but when we have a key that
    does not have any special characters in it, JavaScript allows us to omit the quotation
    marks:


    ![](Images/image04779.jpeg) and `color`. `''Fuel Type''` has quotation marks because
    it contains a space character.


    Let’s make some objects!


    #### Instructions 1.

    The `spaceship` we have so far looks good but, unfortunately, is not very fast
    at hyperspace travel due to having an inferior fuel source. Make a new spaceship
    object named `fasterShip` with the same `color` as `spaceship` but with a `Fuel
    Type` equal to `''Turbo Fuel''`.


    ![](Images/image04780.jpeg)


    ### Accessing Properties

    There are two ways we can access an object’s property. Let’s explore the first
    way— dot notation, `.`.


    You’ve used dot notation to access the properties and methods of built-in objects
    and data instances:


    ```javascript

    ''hello''.length; // Returns 5

    ```

    With property dot notation, we write the object’s name, followed by the dot operator
    and then the property name (key):


    ![](Images/image04781.jpeg)

    ![](Images/image04782.jpeg)


    If we try to access a property that does not exist on that object, `undefined`
    will be returned.


    ```javascript

    spaceship.favoriteIcecream; // Returns undefined

    ```

    Let’s get some more practice using dot notation on an object!


    #### Instructions 1.

    Let’s use the dot operator to access the value of `numCrew` from the `spaceship`
    object in the code editor. Create a variable `crewCount` and assign the `spaceship`’s
    `numCrew` property to it.


    Checkpoint 2 Passed


    Stuck? Get a hint


    #### 2.

    Again using the dot operator, create a variable `planetArray` and assign the `spaceship`’s
    `flightPath` property to it.


    ![](Images/image04783.jpeg)


    ### Bracket Notation

    The second way to access a key’s value is by using bracket notation, `[]`. You’ve
    used bracket notation when indexing an array:


    ```javascript

    [''A'', ''B'', ''C''][0]; // Returns ''A''

    ```

    To use bracket notation to access an object’s property, we pass in the property
    name (key) as a string. We must use bracket notation when accessing keys that
    have numbers, spaces, or special characters in them. Without bracket notation
    in these situations, our code would throw an error.


    ![](Images/image04784.jpeg)


    With bracket notation you can also use a variable inside the brackets to select
    the keys of an object. This can be especially helpful when working with functions:


    ![](Images/image04785.jpeg)

    If we tried to write our `returnAnyProp()` function with dot notation (`objectName.propName`)
    the computer would look for a key of `''propName''` on our object and not the
    value of the `propName` parameter.


    Let’s get some practice using bracket notation to access properties!


    #### Instructions 1.

    ![](Images/image04786.jpeg)![](Images/image04787.jpeg)Let’s use bracket notation
    to access the value from the object in the code editor. Create a variable and
    assign the `spaceship`’s `''Active Mission''` property to it.


    Checkpoint 2 Passed


    Stuck? Get a hint


    #### 2.

    Using bracket notation and the `propName` variable provided, `console.log()` the
    value of the `''Active Mission''` property.


    ![](Images/image04788.jpeg)


    ### Property Assignment

    Once we’ve defined an object, we’re not stuck with all the properties we wrote.
    Objects are mutable meaning we can update them after we create them!

