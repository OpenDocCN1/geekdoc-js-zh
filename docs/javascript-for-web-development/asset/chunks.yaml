    #### 使用 catch 处理 Promises


    编写整洁代码的一种方法是遵循“关注点分离”（separation of concerns）的原则。关注点分离意味着将代码组织成不同的部分，每个部分处理特定的特定任务。它使我们能够快速导航代码，并在出现问题时知道该去哪里寻找。


    记住，如果没有提供相应的处理器，`.then()` 将返回一个与被调用的 promise 具有相同状态值的 promise。这种实现允许我们将解析逻辑与拒绝逻辑分离开来。与其向一个
    `.then()` 传递两个处理器，我们可以链式调用：一个带有失败处理器的第二个 `.then()` 在带有成功处理器的第一个 `.then()` 之后，这样两种情况都会被处理。


    ![](img/image04967.jpeg)


    由于 JavaScript 不介意空格，我们遵循常见的惯例，将此链的每个部分放在新行上，以便于阅读。为了创建更具读性的代码，我们可以使用不同的 promise
    函数：`.catch()`。


    `.catch()` 函数只接受一个参数 `onRejected`。在 promise 被拒绝的情况下，这个失败处理器将带有拒绝的原因被调用。使用 `.catch()`
    达到与使用只带有一个失败处理器的 `.then()` 相同。让我们来看一个使用 `.catch()` 的示例：


    让我们拆解一下发生什么：


    * `prom` 是一个 promise，它会随机解析为 ''Yay!'' 或拒绝为 ''Ohhh noooo!''。

    * 我们向 `.then()` 传递一个成功处理器，向 `.catch()` 传递一个失败处理器。

    * 如果 promise 解析，`.then()` 的成功处理器将带有 ''Yay!'' 调用。

    ![](img/image04968.jpeg)


