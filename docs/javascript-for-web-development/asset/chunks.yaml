    1. Create a new `const` called `xhr`. Create an object using the `new` operator,
    and save it in it. The `XMLHttpRequest` object is used in JavaScript to interact
    with servers.

    *Checkpoint 2 Passed*

    *Stuck? Get a hint*


    2. Next, save the following URL to a `const` called `url`. Make sure the URL is
    wrapped in quotes so that it is a string.

    `https://api-to-call.com/endpoint`

    The URL will direct the request to the correct server.

    *Checkpoint 3 Passed*


    3. Create a new `const` called `data`, and save this line of code to it:

    ```

    JSON.stringify({id: ''200''});

    ```

    `JSON.stringify()` will convert a value to a JSON string. By converting the value
    to a string, we can then send the data to a server.

    *Checkpoint 4 Passed*


    4. Set the `responseType` property of the `xhr` object to be ''json''.

    *Checkpoint 5 Passed*

    *Stuck? Get a hint*


    5. Set the `xhr.onreadystatechange` event handler equal to an anonymous arrow
    function. Leave the function empty until the next step.

    `.onreadystatechange` will contain the event handler that will be called when
    `xhr`’s state changes.

    *Checkpoint 6 Passed*

    *Stuck? Get a hint*


    6. In the code block of the function you created in the previous step, add a conditional
    statement that checks to see if the `readyState` of `xhr` is equal to `XMLHttpRequest.DONE`.

    *Checkpoint 7 Passed*

    *Stuck? Get a hint*


    7. In the code block of the conditional statement, return the `response` property
    of `xhr`. The `response` property will contain the data that we’re getting back
    from the POST request.

    *Checkpoint 8 Passed*

    *Stuck? Get a hint*


    8. Below the function you created in the previous two steps, call the `.open()`
    method on the `xhr` object and pass it ''POST'' and `url` as arguments.

    `.open()` creates a new request and the arguments passed in determine what type
    of request is being made and where it’s being made to.

    *Checkpoint 9 Passed*

    *Stuck? Get a hint*


    9. On the following line, call the `.send()` method on the `xhr` object and pass
    `data` as an argument.

    `.send()` will send the request to the server.


    Nice work! You’ve written the boilerplate code for an AJAX POST request using
    an `XMLHttpRequest` object.


    ![](Images/image05049.jpeg)


    ## XHR Post Requests III


    Reminder: If you haven’t already signed up for an API Key from Rebrandly, please
    read our [Rebrandly URL Shortner API](https://www.codecademy.com/articles/rebrandly-signup)
    article. Keep in mind, while it’s ok to use your API key in these exercises, you
    should not share your key with anyone (not even if asking a question in the forums)!


    In this exercise, you’ll be making a POST request to the Rebrandly API to shorten
    a URL.


    Get ready! You’re now going to incorporate the previous lesson’s boilerplate code
    into making an actual POST request! If you reset the exercise at any point, you
    will have to paste in your API key again at the top.


    ![](Images/image05050.jpeg)


    1. Copy your Rebrandly API Key, and assign it to the `const` `apiKey` at the top
    of your code.

    *Checkpoint 2 Passed*


    2. Within the code block of `shortenUrl()`, create a `const` called `urlToShorten`,
    and save `inputField.value` to it. `urlToShorten` will now save the value of the
    input field.

    *Note: for the remainder of this exercise’s instructions we will be working inside
    the code block of `shortenUrl()`!*

    *Checkpoint 3 Passed*

    *Stuck? Get a hint*


    3. Create a `const` called `data`, and save the following code to it:

    ```

    JSON.stringify({destination: urlToShorten});

    ```

    We’re including this information because the API expects to see an object with
    a key `destination` that has a value of a URL.

    *Checkpoint 4 Passed*

    *Stuck? Get a hint*


    4. Create a new `XMLHttpRequest` object using the `new` operator, and save it
    to a `const` called `xhr`.

    *Checkpoint 5 Passed*

    *Stuck? Get a hint*


    5. Set the `responseType` property of the `xhr` object to be ''json''.

    *Checkpoint 6 Passed*

    *Stuck? Get a hint*


    6. Save an empty anonymous arrow function to the `onreadystatechange` event handler
    of the `xhr` object. This function will not take in any parameters. Inside the
    anonymous function’s code block, include the following code inside its code block:

    ![](Images/image05051.jpeg)

    The `renderRawResponse` function can be viewed at `public/helperFunctions.js`.

    *Checkpoint 7 Passed*

    *Stuck? Get a hint*


    7. Below the anonymous function you just created, call the `.open()` method on
    `xhr`, and pass it ''POST'' and `url` as respective arguments.

    *Checkpoint 8 Passed*

    *Stuck? Get a hint*


    8. To access the Rebrandly API, we need a header with two key-value pairs. In
    the header, you must include values for ''Content-type'' and an ''apikey''. To
    set the header, we have to include the following code below our `.open()` method.

    ![](Images/image05052.jpeg)

    *Checkpoint 9 Passed*

    *Stuck? Get a hint*


    9. On `xhr`, call the `.send()` method, and pass it `data` as an argument.

    *Checkpoint 10 Passed*

    *Stuck? Get a hint*


    10. Enter this URL into the input field, and click the shorten button in the web
    page.

