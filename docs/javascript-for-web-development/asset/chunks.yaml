    \ `numOfSlices` using the `var` keyword and assign to it the number 8.\n   - Checkpoint\
    \ 3 Passed\n   - Stuck? Get a hint\n\n3. Under the `numOfSlices` variable, use\
    \ `console.log()` to print the value saved to `favoriteFood`.\n   On the following\
    \ line, use `console.log()` to print the value saved to `numOfSlices`.\n   ![](Images/image04582.jpeg)\n\
    \n## Create a Variable: let\n\nAs mentioned in the previous exercise, the `let`\
    \ keyword was introduced in ES6. The `let` keyword signals that the variable can\
    \ be reassigned a different value. Take a look at the example:\n\n![](Images/image04583.jpeg)\n\
    \nAnother concept that we should be aware of when using `let` (and even `var`)\
    \ is that we can declare a variable without assigning the variable a value. In\
    \ such a case, the variable will be automatically initialized with a value of\
    \ `undefined`:\n\n![](Images/image04584.jpeg)\n\nNotice in the example above:\n\
    - If we don’t assign a value to a variable declared using the `let` keyword, it\
    \ automatically has a value of `undefined`.\n- We can reassign the value of the\
    \ variable.\n\n### Instructions\n\n1. Create a `let` variable called `changeMe`\
    \ and set it equal to the boolean `true`.\n   - Checkpoint 2 Passed\n   - Stuck?\
    \ Get a hint\n\n2. On the line after `changeMe` is declared, set the value of\
    \ `changeMe` to be the boolean `false`.\n   To check if `changeMe` was reassigned,\
    \ log the value saved to `changeMe` to the console.\n   ![](Images/image04585.jpeg)\n\
    \n## Create a Variable: const\n\nThe `const` keyword was also introduced in ES6,\
    \ and is short for the word constant. Just like with `var` and `let` you can store\
    \ any value in a `const` variable. The way you declare a `const` variable and\
    \ assign a value to it follows the same structure as `let` and `var`. Take a look\
    \ at the following example:\n\n![](Images/image04586.jpeg)\n\nHowever, a `const`\
    \ variable cannot be reassigned because it is constant. If you try to reassign\
    \ a `const` variable, you’ll get a `TypeError`.\n\nConstant variables must be\
    \ assigned a value when declared. If you try to declare a `const` variable without\
    \ a value, you’ll get a `SyntaxError`.\n\nIf you’re trying to decide between which\
    \ keyword to use, `let` or `const`, think about whether you’ll need to reassign\
    \ the variable later on. If you do need to reassign the variable use `let`, otherwise,\
    \ use `const`.\n\n### Instructions\n\n1. Create a constant variable named `entree`\
    \ and set it to equal to the string 'Enchiladas'.\n   - Checkpoint 2 Passed\n\
