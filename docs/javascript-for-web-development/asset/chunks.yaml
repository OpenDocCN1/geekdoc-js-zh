  trans: "\n\n我们使用 `npm install` 命令在本地安装新的 Node 包。`install` 命令会创建一个名为 `node_modules`\
    \ 的文件夹，并将包文件复制到其中。`install` 命令还会安装指定包的所有依赖项。\n\n要安装 Babel，我们需要 `npm install` 两个包：`babel-cli`\
    \ 和 `babel-preset-env`。然而，`npm` 还会安装一个多多个作为 Babel 正常运行所需依赖的其它包。\n\n我们通过以下两个命令安装\
    \ Babel：\n\n![](img/image04931.jpeg)![](img/image04932.jpeg) 该包包含了 Babel 命令行工具，且该包拥有将任何\
    \ JavaScript 特性、ES6 及以上版本（ES6+）映射到 ES5 的代码。\n\n![](img/image04933.jpeg) `--save-dev`\
    \ 标志指示 npm 将每个包添加到 `package.json` 中的一个属性中。一旦项目的依赖项列在 `devDependencies` 中，其他开发者就可以在无需单独安装每个包的情况下运行你的项目。相反，他们只需要运行\
    \ `npm install` —— 它会指示 `npm` 检查 `package.json` 并下载 `devDependencies` 中列出的所有包。\n\
