- fmt: "\n• `usesLitter` is a new property that is unique to the `Cat` class, so we\
    \ set it in the `Cat` constructor.\n\nNotice, we call `super` on the first line\
    \ of our `constructor()`, then set the `usesLitter` property on the second line.\
    \ In a `constructor()`, you must always call the `super` method before you can\
    \ use the `this` keyword — if you do not, JavaScript will throw a reference error.\
    \ To avoid reference errors, it is best practice to call `super` on the first\
    \ line of subclass `constructors`.\n\nBelow, we create a new `Cat` instance and\
    \ call its name with the same syntax as we did with the `Dog` class:\n\n![](Images/image04890.jpeg)\n\
    \nIn the example above, we create a new instance the `Cat` class, named `bryceCat`.\
    \ We pass it `'Bryce'` and `false` for our `name` and `usesLitter` arguments.\
    \ When we call `console.log(bryceCat._name)` our program prints, `Bryce`.\n\n\
    In the example above, we abandoned best practices by calling our `_name` property\
    \ directly. In the next exercise, we’ll address this by calling an inherited getter\
    \ method for our `name` property.\n\n### Instructions 1\n\n1. ![](Images/image04891.jpeg)\
    \ In this exercise, you will begin to create the class as a child of the `HospitalEmployee`\
    \ class. Remember the `Nurse` class has the following properties and methods:\n\
    \nNurse:\n• Properties: `_name`, `_remainingVacationDays` (set to 20 inside `constructor()`),\
    \ `_certifications`\n• Methods: `.takeVacationDays()`, `.addCertification()`\n\
    \nUnder `HospitalEmployee`, create an empty class named `Nurse` that extends `HospitalEmployee`.\n\
    Checkpoint 2 Passed (Stuck? Get a hint)\n\n2. Inside the `Nurse` class, create\
    \ a `constructor()` that accepts two arguments. Use the list of properties above\
    \ to name these arguments.\nCheck the Hint if you need help.\nCheckpoint 3 Passed\
    \ (Stuck? Get a hint)\n\n3. In the `Nurse` constructor, call the parent’s constructor\
    \ method and pass the appropriate value(s).\nCheckpoint 4 Passed (Stuck? Get a\
    \ hint)\n\n4. Inside of the `Nurse` constructor, and under `super`, set `_certifications`.\n\
    Checkpoint 5 Passed\n\n5. Under the `Nurse` class, create a new instance of `Nurse`\
    \ and save it to a constant variable named `nurseOlynyk`. Pass in the following\
    \ values for each property:\n• name: `'Olynyk'`\n• certifications: `['Trauma',\
    \ 'Pediatrics']`\n![](Images/image04892.jpeg)\n\n## Inheritance IV\n\nNow that\
    \ we know how to create an object that inherits properties from a parent class\
    \ let’s turn our attention to methods.\n\nWhen we call `extends` in a class declaration,\
    \ all of the parent methods are available to the child class.\n\nBelow, we extend\
    \ our `Animal` class to a `Cat` subclass.\n\n![](Images/image04893.jpeg)In the\
    \ example above, our class extends `Animal`. As a result, the `Cat` class has\
    \ access to the `Animal` getters and the `.incrementBehavior()` method.\n\nAlso\
    \ in the code above, we create a `Cat` instance named `bryceCat`. Because `bryceCat`\
    \ has access to the `name` getter, the code below logs `'Bryce'` to the console.\n\
    \n```\nconsole.log(bryceCat.name);\n```\nSince the `extends` keyword brings all\
    \ of the parent’s getters and methods into the child class, `bryceCat.name` accesses\
    \ the `name` getter and returns the value saved to the `name` property.\n\nNow\
    \ consider a more involved example and try to answer the following question: What\
    \ will the code below log to the console?\n\n![](Images/image04894.jpeg)\n\nThe\
    \ correct answer is 1. But why?\n\n• The `Cat` class inherits the `_behavior`\
    \ property, `behavior` getter, and the `.incrementBehavior()` method from the\
    \ `Animal` class.\n• When we created the `bryceCat` instance, the `Animal` constructor\
    \ set the `_behavior` property to zero.\n• The first line of code calls the inherited\
    \ `.incrementBehavior()` method, which increases the `bryceCat _behavior` value\
    \ from zero to one.\n• The second line of code calls the `behavior` getter and\
    \ logs the value saved to `_behavior` (1).\n\n### Instructions 1\n\n1. Call `.takeVacationDays()`\
    \ with an input of 5 on your `nurseOlynyk` instance.\nCheckpoint 2 Passed\n\n\
    2. Under the method call, log the value saved to the `remainingVacationDays` property\
    \ in `nurseOlynyk`.\n![](Images/image04895.jpeg)\n![](Images/image04896.jpeg)\n\
    \n## Inheritance V\n\nIn addition to the inherited features, child classes can\
    \ contain their own properties, getters, setters, and methods.\n\nBelow, we will\
    \ add a `usesLitter` getter. The syntax for creating getters, setters, and methods\
    \ is the same as it is in any other class.\n\n![](Images/image04897.jpeg)\n\n\
    In the example above, we create a `usesLitter` getter in the `Cat` class that\
    \ returns the value saved to `_usesLitter`.\n\nCompare the `Cat` class above to\
    \ the one we created without inheritance:\n\n![](Images/image04898.jpeg)\n```\n\
    class Cat {\n  constructor(name, usesLitter) {\n    this._name = name;\n    this._usesLitter\
    \ = usesLitter;\n    this._behavior = 0;\n  }\n\n  get name() {\n    return this._name;\n\
    \  }\n\n  get usesLitter() {\n    return this._usesLitter;\n  }\n\n  get behavior()\
    \ {\n    return this._behavior;\n  }\n\n  incrementBehavior() {\n    this._behavior++;\n\
    \  }\n}\n```\n\nWe decreased the number of lines required to create the `Cat`\
    \ class by about half. Yes, it did require an extra class (`Animal`), making the\
    \ reduction in the size of our `Cat` class seem moot. However, the benefits (time\
    \ saved, readability, efficiency) of inheritance grow as the number and size of\
    \ your subclasses increase.\n\nOne benefit is that when you need to change a method\
    \ or property that multiple classes share, you can change the parent class, instead\
    \ of each subclass.\n\nBefore we move past inheritance, take a moment to see how\
    \ we would create an additional subclass, called `Dog`.\n\n![](Images/image04899.jpeg)\n\
    \nThis `Dog` class has access to the same properties, getters, setters, and methods\
    \ as the `Dog` class we made without inheritance, and is a quarter the size.\n\
    \nNow that we’ve abstracted animal daycare features, it’s easy to see how you\
    \ can extend `Animal` to support other classes, like `Rabbit`, `Bird` or even\
    \ `Snake`.\n\n### Instructions 1\n\n1. Use the properties and methods below to\
    \ help you complete the tasks that follow.\n\nNurse:\n• Properties: `_name`, `_remainingVacationDays`\
    \ (set to 20 inside `constructor()`), `_certifications`\n• Methods: `.takeVacationDays()`,\
    \ `.addCertification()`\n\nUnder the `Nurse` constructor()`, add a getter that\
    \ returns the value saved to the `Nurse` instance’s `_certifications`.\nCheckpoint\
    \ 2 Passed\n\n2. Add a method called `addCertification` under the `certifications`\
    \ getter. The method should accept one input (`newCertification`). Inside the\
    \ method, use the [`push`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/push?v=example)\
    \ method to add the `newCertification` value to the nurse’s `certifications` array.\n\
    Checkpoint 3 Passed (Stuck? Get a hint)\n\n3. At the bottom of `main.js` call\
    \ the `.addCertification()` method on `nurseOlynyk` with a parameter of `'Genetics'`.\n\
    Checkpoint 4 Passed\n\n4. Log the value saved to the `certifications` property\
    \ of `nurseOlynyk`.\n\n![](Images/image04900.jpeg)\n```\nclass HospitalEmployee\
    \ {\n  constructor(name) {\n    this._name = name;\n    this._remainingVacationDays\
    \ = 20;\n  }\n\n  get name() {\n    return this._name;\n  }\n\n  get remainingVacationDays()\
    \ {\n    return this._remainingVacationDays;\n  }\n\n  takeVacationDays(daysOff)\
    \ {\n    this._remainingVacationDays -= daysOff;\n  }\n}\n\nclass Nurse extends\
    \ HospitalEmployee {\n  constructor(name, certifications) {\n    super(name);\n\
    \    this._certifications = certifications;\n  }\n\n  get certifications() {\n\
    \    return this._certifications;\n  }\n\n  addCertification(newCertification)\
    \ {\n    this._certifications.push(newCertification);\n  }\n}\n\nconst nurseOlynyk\
    \ = new Nurse('Olynyk', ['Trauma','Pediatrics']);\nnurseOlynyk.takeVacationDays(5);\n\
    console.log(nurseOlynyk.remainingVacationDays);\nnurseOlynyk.addCertification('Genetics');\n\
    console.log(nurseOlynyk.certifications);\n```\n"
