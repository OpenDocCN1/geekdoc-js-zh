    2. 查询支持“模板字符串”（ES6 引入的一项特性）的浏览器百分比。将该值以数字形式保存到变量 `esTemplateLiterals`。


    ![](img/image04908.jpeg)


    ## 为什么选择 ES6？


    在我们学习如何设置可以将 ES6 转换为 ES5 的 JavaScript 项目之前，了解 Ecma 进行此类更新的几个原因是有。


    ES6 之前的 JavaScript 版本被称为 ES5。ES6 更新的三个原因如下：


    * 代码的可读性和经济性 — 新语法通常更容易理解（可读性更高），并且创建相同功能所需的字符更少（代码的经济性）。

    * 解决 ES5 的错误来源 — 某些 ES5 语法会导致常见错误。通过 ES6，Ecma 引入了缓解一些最常见陷阱的语法。

    * 与或其他语言的相似性 — JavaScript ES6 在语法上更类似于面向对象的语言。这使得经验丰富的非 JavaScript 开发者在学习 JavaScript
    时阻力更小。


    由于 ES6 解决了上述问题，Ecma 知道 Web 开发者会迅速采用它，而网络浏览器的支持会滞后。


    为了限制 ES6 浏览器兼容性问题的影响，Ecma 使新语法向后兼容，这意味着你可以将 JavaScript ES6 代码映射到 ES5。


    ### 任务 1


    1. 在这些任务中，你将手动将 `main.js` 中的代码更改为 ES5 语法。


    `let` 和 `const` 关键字是在 ES6 中引入的。在此之前，我们使用 `var` 关键字声明所有变量。将 `main.js` 中的 `let`
    和 `const` 关键字更改为 `var`。


    ![](img/image04909.jpeg)![](img/image04910.jpeg)


    检查通过


    卡住了？获取提示


    2. 下行代码使用 ES6 字符串插值编写：


    ![](img/image04911.jpeg)


    在 ES5 中，我们使用加号 (+) 将变量插到字符串中。在 `main.js` 中，使用 ES5 字符串插值将 `carbonara` 设置为与上方相同的字符串。


    ## 使用 Babel 进行编译


    在上练习中，你手动将 ES6 代码转换为 ES5。虽然手动转换只需要几分钟，但随着 JavaScript 文件大小的增大，这种做法是不可持续的。


    由于 ES6 是向后兼容的，一组 JavaScript 程序员开发了一个名为 Babel 的 JavaScript 库，可以将 ES6 JavaScript
    编译为 ES5。


