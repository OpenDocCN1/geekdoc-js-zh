  trans: "\n\n我们可以使用点符号 `.` 或中括号符号 `[]` 配合赋值运算符 `=` 来向对象添加新的键值对或更改现有的属性。\n\n属性赋值时会发生以下两种情况之一：\n\
    \n* 如果该属性在对象上已经存在，它之前持有的任何值都将被新赋值的值替换。\n* 如果没有该名的属性，则将向对象添加一个新属性。\n\n需要知道的一点是，虽然我们不能重新赋值用\
    \ `const` 声明的对象，但我们仍然可以对其进行变异（mutate），这意味着我们可以添加新属性并修改已有的属性。\n\n![](img/image04789.jpeg)\n\
    \n你可以使用 `delete` 操作符从对象中删除属性。\n\n![](img/image04790.jpeg)\n\n### 练习\n\n1. 重新赋值\
    \ `spaceship` 对象的 `color` 属性，使其值为 `'glorious gold'`。\nCheckpoint 2 Passed\n*卡住了？获取提示*\n\
    \n2. 在不改变第 1-6 行的情况下，为 `spaceship` 对象添加一个数值在 1 到 10 之间的 `numEngines` 属性。\nCheckpoint\
    \ 3 Passed\n*卡住了？获取提示*\n\n3. ![](img/image04791.jpeg) 使用 `delete` 操作符从 `spaceship`\
    \ 对象中删除 `'Secret Mission'` 属性。\n![](img/image04792.jpeg)\n\n## 方法\n\n当存储在对象上的数据是一个函数时，我们称之为方法（method）。属性是对象拥有的东西，而方法是对象所做的事情。\n\
    \n对象方法看起来很熟悉吗？那是因为你一直都在使用它们！例如，`console` 是一个全局 javascript 对象，`.log()` 是该对象上的一个方法。`Math`\
    \ 也是一个全局 javascript 对象，`.floor()` 是它上面的一个方法。\n\n我们可以通过创建普通的、用逗号分隔的键值对来在对象字面量中包含方法。键作为我们方法的名称，而值是一个匿名函数表达式。\n\
    \n![](img/image04793.jpeg)\n![](img/image04794.jpeg)\n\n使用 ES6 引入的新方法语法，我们可以省略冒号和\
    \ `function` 关键字。\n\n![](img/image04795.jpeg)\n\n对象方法的调用方式是在对象名称后加上点操作符，然后是方法名和括号：\n\
    \n![](img/image04796.jpeg)\n\n1. 在代码编辑器器的 `retreatMessage` 变量下方创建一个 `alienShip`\
    \ 对象。它应该包含一个方法 `.retreat()`，该方法将 `console.log()` `retreatMessage`。\nCheckpoint\
    \ 2 Passed\n*卡住了？获取提示*\n\n2. 在你的对象字面量中添加另一个方法。这个方法 `.takeOff()` 应该 `console.log()`\
    \ 字符串 `'Spim... Borp... Glix... Blastoff!'`。\nCheckpoint 3 Passed\n*卡住了？获取提示*\n\
    \n3. 调用你的两个方法：先调用 `.retreat()` 后调用 `.takeOff()`。\n![](img/image04797.jpeg)\n![](img/image04798.jpeg)\n\
    \n## 嵌套对象\n\n在应用程序中，对象通常是嵌套的——一个对象可能有另一个对象作为属性，而该对象又可能有一个包含更多对象的数组作为属性！\n\n在我们\
    \ `spaceship` 对象中，我们需要一个 `crew` 对象。它将包含所有在飞行器上执行重要工作的船员。每一个船员本身都是对象。他们拥有像 `name`\
    \ 和 `degree` 这样的属性，并且根据他们的角色拥有独特的方法。我们还可以在 `spaceship` 中嵌套其他对象，例如 `telescope`，或者将\
    \ `spaceship` 计算机的细节嵌套在一个父对象 `nanoelectronics` 中。\n\n![](img/image04799.jpeg)\n\
    ![](img/image04800.jpeg)\n\n我们可以链用操作符来访问嵌套属性。我们需要注意在每一层中使用哪个操作符是合理的。假装自己是计算机并从左到右评估每个表达式会有帮助，这样每个操作都会感觉更容易管理。\n\
    \n![](img/image04801.jpeg)\n\n在前面的代码中：\n\n* 首先，计算机评估 `spaceship.nanoelectronics`，结果是一个包含\
    \ `back-up` 和 `computer` 对象的对象。\n* 我们通过附加 `['back-up']` 访问了 `back-up` 对象。\n* `back-up`\
    \ 对象有一个 `battery` 属性，通过 `.battery` 访问返回了存储在那的值：`'Lithium'`。\n\n### 指令\n\n1. 创建变量\
    \ `capFave`，并将船长的喜爱食物（她的 `'favorite foods'` 数组中索引为 0 的元素）赋值给它。确保使用中括号和点表示法通过嵌套访问获取食物的值（不要直接将值复制到变量中！）\n\
    Checkpoint 2 Passed\n*卡住了？获取提示*\n\n2. 现在 `passengers` 属性的值为 `null`。相反，赋值一个对象数组作为其值。这些对象应该作为独立对象代表\
    \ `spaceship` 的乘客。在数组中至少创建一个乘客对象，使其包含至少一个键值对。\nCheckpoint 3 Passed\n*卡住了？获取提示*\n\
    \n3. 创建变量 `firstPassenger`，并将第一个乘客赋值为值（你刚刚创建的 `spaceship.passengers` 数组中索引为 0\
    \ 的元素）。确保使用中括号和点表示法通过嵌套访问获取乘客对象（不要直接将对象复制到变量中！）\n![](img/image04802.jpeg)\n![](img/image04803.jpeg)\n\
    \n## 引用传递\n\n对象是通过引用传递的。这意味着当我们把赋值给对象的变量作为参数传递给函数时，计算机将参数解释为指向存放对象的空间。因此，更改对象属性的函数实际上会永久地改变该对象（即使对象被赋值给\
    \ `const` 变量）。\n\n![](img/image04804.jpeg)\n\n我们的函数 `paintIt()` 永久地改变了我们飞器的颜色。然而，重新赋值\
    \ `spaceship` 变量不会产生同样的效果：\n\n![](img/image04805.jpeg)\n![](img/image04806.jpeg)\n\
    \n让我们看看代码示例中发生了什么：\n\n* ![](img/image04807.jpeg) 我们使用 `let` 声明。这允许我们无问题地将其重新赋值为一个具有\
    \ `identified` 和 `'transport type'` 属性的新对象。\n* 当我们尝试使用设计用于重新赋值传入对象的函数执行相同操作时，重新赋值并没有生效（尽管对对象调用\
    \ `console.log()` 得到了预期的结果）。\n* 当我们将 `spaceship` 传入该函数时，`obj` 变成了对象内存位置的引用，而不是\
    \ `spaceship` 变量。因为 `tryReassignment()` 函数的参数 `obj` 本身就是一个变量。\n* 当我们在 `tryReassignment()`\
    \ 内部进行重新赋值时，`obj` 变量指向了对象 `{'identified': false, 'transport type': 'flying'}`\
    \ 的内存位置，而 `spaceship` 变量的值则完全没有变化。\n\n### 指令\n\n1. 编写一个函数 `greenEnergy()`，接收一个对象作为参数，并将该对象的\
    \ `'Fuel Type'` 属性设置为 `'avocado oil'`。\nCheckpoint 2 Passed\n*卡住了？获取提示*\n\n2.\
    \ 编写一个函数 `remotelyDisable()`，接收一个对象作为参数，并设置（或重新赋值）该对象的 `disabled` 属性为 `true`。\n\
    \ 3 Passed\n*卡住了？获取提示*\n\n3. 在代码编辑器中使用 `spaceship` 对象调用你的两个函数，然后 `console.log()`\
    \ `spaceship` 对象以确认这些属性已更改或添加。\n\n"
- fmt: "\n# Loops\n\nLoops are programming tools that repeat a block of code until\
    \ a condition is met. We learned how to iterate through arrays using their numerical\
    \ indexing, but the key-value pairs in objects aren’t ordered! [JavaScript has](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\
    \ given us alternative solution for iterating through objects with](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\
    \ [the for...in syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in).\n\
    \n`for...in` will execute a given block of code for each property in an object.\n\
    \n![](Images/image0480.jpeg)\n\n```javascript\nlet spaceship = {\n  crew: {\n\
    \    captain: {\n      name: 'Lily',\n      degree: 'Computer Engineering',\n\
    \      cheerTeam() { console.log('You got this!') }\n    },\n    'chief officer':\
    \ {\n      name: 'Dan',\n      degree: 'Aerospace Engineering',\n      agree()\
    \ { console.log('I agree, captain!') }\n    },\n    medic: {\n      name: 'Clementine',\n\
    \      degree: 'Physics',\n      announce() { console.log(`Jets on!`) }\n    },\n\
    \    translator: {\n      name: 'Shauna',\n      degree: 'Conservation Science',\n\
    \      powerFuel() { console.log('The tank is full!') }\n    }\n  }\n};\n\n//\
    \ for...in\nfor (let crewMember in spaceship.crew) {\n  console.log(`${crewMember}:\
    \ ${spaceship.crew[crewMember].name}`);\n}\n```\n\nOur `for...in` will iterate\
    \ through each element of the `spaceship.crew` object. In each iteration, the\
    \ variable `crewMember` is set to one of `spaceship.crew`’s keys, enabling us\
    \ to log a list of crew members’ role and name.\n\n### Instructions\n\n1. Using\
    \ `for...in`, iterate through the `spaceship.crew` object in the code editor and\
    \ `console.log()` a list of crew roles and names in the following format: `'[crew\
    \ member's role]: [crew member's name]'`, e.g., `'chief officer: Dan'`.\n\n**Checkpoint\
    \ 2 Passed**\n*Stuck? Get a hint*\n\n2. Using `for...in`, iterate through the\
    \ `spaceship.crew` object in the code editor and `console.log()` a list of crew\
    \ names and degrees in the following format: `'[crew member's name]: [crew member's\
    \ degree]'`, i.e., `'Lily: Computer Engineering'`.\n\n![](Images/image04810.jpeg)\n\
    ![](Images/image04811.jpeg)\n\n# Review\n\nWay to go! You’re well on your way\
    \ to understanding the mechanics of objects in JavaScript. By building your own\
    \ objects, you will have a better understanding of how JavaScript built-in objects\
    \ work as well. You can also start imagining organizing your code into objects\
    \ and modeling real world things in code.\n\nLet’s review what we learned in this\
    \ lesson:\n\n* Objects store collections of key-value pairs.\n* Each key-value\
    \ pair is a property—when a property is a function it is known as a method.\n\
    * An object literal is composed of comma-separated key-value pairs surrounded\
    \ by curly braces.\n* You can access, add or edit a property within an object\
    \ by using dot notation or bracket notation.\n* We can add methods to our object\
    \ literals using key-value syntax with anonymous function expressions as values\
    \ or by using the new ES6 method syntax.\n* We can navigate complex, nested objects\
    \ by chaining operators.\n* Objects are mutable—we can change their properties\
    \ even when they’re declared with `const`.\n* Objects are passed by reference—\
    \ when we make changes to an object passed into a function, those changes are\
    \ permanent.\n* We can iterate through objects using the `For...in` syntax.\n\n\
    # Advanced Objects Introduction\n\nRemember, objects in JavaScript are containers\
    \ that store data and functionality. In this lesson, we will build upon the fundamentals\
    \ of creating objects and explore some advanced concepts.\n\nSo if there are no\
    \ objections, let’s learn more about objects! In this lesson we will cover these\
    \ topics:\n\n* how to use the `this` keyword.\n* conveying privacy in JavaScript\
    \ methods.\n* defining `getters` and `setters` in objects.\n* creating factory\
    \ functions.\n* using destructuring techniques.\n\n![](Images/image04812.jpeg)\n\
    ![](Images/image04813.jpeg)\n\n## The this Keyword\n\n![](Images/image04814.jpeg)\n\
    Objects are collections of related data and functionality. We store that functionality\
    \ in methods on our objects: the method\n\n![](Images/image04815.jpeg)\nmethod\
    \ on goat. We can invoke\n\n```javascript\ngoat.makeSound(); // Prints baaa\n\
    ```\n\nNice, we have a goat object that can print baaa to the console. Everything\
    \ seems to be working fine. What if we wanted to add a new method to our goat\
    \ object called `.diet()`?\n\n![](Images/image04816.jpeg)\n![](Images/image04817.jpeg)\n\
    That’s strange, why is undefined? That’s because inside the scope of `diet()`,\
    \ we don’t have access to the goat. Here’s where the `this` keyword comes to the\
    \ rescue. If we use `this`, the `diet()` is the calling object.\n\n```javascript\n\
    goat.diet();\n```\n\n### Instructions\n\n1. Let’s practice `this`. In `main.js`\
    \ there is an object, add a property `model` and assign to it `robot`. Add another\
    \ property `energyLevel` and assign to it `100`.\n\n**Checkpoint 2 Passed**\n\
    *Stuck? Get a hint*\n\n2. ![](Images/image04819.jpeg)\nInside the object, add\
    \ a method named `provideInfo`. Inside the body of `provideInfo()`, return the\
    \ following string using interpolation: `I am ${model} and my current level is\
    \ ${energyLevel}`. Replace `model` and `energyLevel` with the calling object’s\
    \ property.\n\n**Checkpoint 3 Passed**\n*Stuck? Get a hint*\n\n3. Now to check\
    \ `provideInfo()` has access to internal properties. Log the result of calling\
    \ `provideInfo()` on `robot`.\n\n```javascript\nrobot.provideInfo();\n```\n\n\
    ## Arrow Functions and this\n\nWe saw in the previous exercise that for a method,\
    \ the calling object is the object the method belongs to. If we use the `this`\
    \ keyword in a method then the value of `this` is the calling object. However,\
    \ it becomes a bit more complicated when we start using arrow functions for methods.\
    \ Take a look at the example below:\n\n![](Images/image04821.jpeg)\n![](Images/image04822.jpeg)\n\
    In the comment, you can see that would log undefined. So what happened? Notice\
    \ that in the `diet()` is defined using an arrow function. Arrow functions inherently\
    \ bind, or tie, an already defined `this` value to the function itself that is\
    \ NOT the calling object. In the code snippet above, the value of `this` is the\
    \ global object, or an object that exists in the global scope, which doesn’t have\
    \ a `dietType` property and therefore returns undefined.\n\nTo read more about\
    \ either arrow functions or the global object check out the MDN documentation\
    \ of [the global object](https://developer.mozilla.org/en-US/docs/Glossary/Global_object)\
    \ and [arrow functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions).\n\
    \nThe key takeaway from the example above is to avoid using arrow functions when\
    \ using `this` in a method\n\n### Instructions\n\n1. Currently the `checkEnergy()`\
    \ method is not producing the correct output because it is using arrow function\
    \ syntax. Refactor, or change, the method to use a function expression. You can\
    \ write the function using either longhand or shorthand format.\n"
  raw: "Loops are programming tools that repeat a block of code until a condition\
    \  is met. We learned how to iterate through arrays using their numerical  indexing,\
    \ but the key-value pairs in objects aren’t ordered! [JavaScript has](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\
    \  [given  us alternative solution for iterating through objects  with](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in)\n\
    \n[the for...in  syntax](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...in).\n\
    \nfor...in  will execute a given block of code for  each property  in an object.\n\
    \n![](Images/image04809.jpeg)let spaceship = {  crew:  {\n\ncaptain:  {  name:\
    \  'Lily',\n\ndegree:  'Computer  Engineering',\n\ncheerTeam()  {  console.log('You\
    \  got  this!')  }\n\n},\n\n'chief officer': {  name:  'Dan',\n\ndegree:  'Aerospace\
    \  Engineering',\n\nagree()  {  console.log('I  agree,  captain!')  }\n\n},\n\n\
    medic:  {\n\nname: 'Clementine',  degree:  'Physics',\n\nannounce() { console.log(`Jets\
    \ on!`) } },  translator:  {\n\nname:  'Shauna',\n\ndegree:  'Conservation  Science',\n\
    \npowerFuel()  {  console.log('The  tank  is  full!')  }\n\n}\n\n}\n\n};\n\n//\
    \  for...in\n\nfor (let crewMember in spaceship.crew) {  console.log(`${crewMember}:\n\
    \n${spaceship.crew[crewMember].name}`);\n\n}\n\nOur for...in  will iterate through\
    \ each element  of the  spaceship.crew  object.  In each iteration, the variable\
    \  crewMember  is set to one of  spaceship.crew‘s  keys,  enabling us to log \
    \ a list of  crew members’  role and  name.\n\nInstructions  1.\n\nUsing  for...in,\
    \  iterate  through  the  spaceship.crew  object in the code  editor  and console.log()\
    \  a  list of crew  roles and  names  in the  following\n\nformat:  '[crew member's\
    \ role]: [crew member's name]', e.g.,'chief officer:  Dan'.\n\n Checkpoint 2 Passed\n\
    \nStuck?  Get a hint\n\n2.\n\nUsing  for...in,  iterate  through  the  spaceship.crew\
    \  object in the code  editor  and  console.log()  a  list  of  crew  names  and\
    \  degrees  in  the  following  format:  '[crew member's name]: [crew member's\
    \ degree]', i.e.,'Lily: Computer  Engineering'.\n\n![](Images/image04810.jpeg)\n\
    \n![](Images/image04811.jpeg)\n\nReview\n\nWay to go! You’re well on your way\
    \ to understanding the mechanics of objects in  JavaScript. By building your own\
    \ objects, you will have a better understanding of how  JavaScript built-in objects\
    \ work as well. You can also start imagining organizing your  code  into  objects\
    \ and modeling real world things in code.\n\nLet’s  review  what we  learned in\
    \  this lesson:\n\n• Objects  store  collections  of  key-value  pairs.\n\n• Each\
    \ key-value pair is a property—when a property is a function it is known as  a\
    \ method.\n\n• An object literal is composed of comma-separated key-value pairs\
    \ surrounded  by  curly braces.\n\n• You can access, add or edit a property within\
    \ an object by using dot notation  or  bracket notation.\n\n• We can add methods\
    \ to our object literals using key-value syntax with  anonymous function expressions\
    \ as values or by using the new ES6 method  syntax.\n\n• We  can navigate  complex,\
    \  nested  objects by  chaining  operators.\n\n• Objects are mutable—we can change\
    \ their properties even when they’re  declared  with  const.\n\n• Objects are\
    \ passed by reference— when we make changes to an object  passed  into a function,\
    \ those changes are permanent.\n\n• We  can  iterate  through objects  using the\
    \  For...in  syntax.\n\nAdvanced  Objects  Introduction\n\nRemember, objects in\
    \ JavaScript are containers that store data and functionality. In  this lesson,\
    \ we will build upon the fundamentals of creating objects and explore  some  advanced\
    \  concepts.\n\nSo if there are no objections, let’s learn more about objects!\
    \  In  this lesson we will cover these topics:\n\n• how to use the  this  keyword.\n\
    \n• conveying  privacy  in  JavaScript methods.\n\n• defining  getters  and  setters\
    \  in objects.\n\n• creating  factory  functions.\n\n• using  destructuring  techniques.\n\
    \n![](Images/image04812.jpeg)\n\n![](Images/image04813.jpeg)\n\nThe  this Keyword\n\
    \n![](Images/image04814.jpeg)Objects are collections of related data and functionality.\
    \ We store that  functionality  in  methods on our objects:\n\nthe\n\n![](Images/image04815.jpeg)method\
    \  on  goat.\n\nmethod.  We can invoke\n\ngoat.makeSound();  //  Prints  baaa\
    \   Nice, we have a  goat  object that can print  baaa  to the console. Everything\
    \  seems  to be working  fine.  What if we  wanted  to add  a  new method to\n\
    \nour goat  object  called  .diet()  that prints  the  goat‘s  dietType?\n\n![](Images/image04816.jpeg)\n\
    \n![](Images/image04817.jpeg)That’s  strange,  why isnot  defined even  though\
    \  it’s a  property\n\nof  goat?  That’s  because  inside the scope  of  the \
    \ .diet()  method, we  don’t  automatically have access to  other  properties\
    \ of the  goat  object.\n\nHere’s  where  the this  keyword comes to the rescue.\
    \ If  we change  the  .diet()  method to use the  this,  the  .diet()  works!\
    \ :\n\n![](Images/image04818.jpeg)\n\nThe  this  keyword  references  the  calling\
    \ object which  provides access  to  the  calling  object’s properties. In the\
    \  example above, the  calling  object\n\nis  goat  and  by  using  this  we’re\
    \ accessing the  goat  object itself, and then  the  dietType  property of  goat\
    \  by using  property dot notation.\n\nLet’s get  comfortable using the  this\
    \  keyword  in a  method.\n\nInstructions  1.\n\nLet’s  create a  new object \
    \ to  practice  using  this.\n\nIn  main.js there is  an object  robot,  add \
    \ a  property of  model  and  assign to  it  a  value  of '1E78V2'. Add  another\
    \  property,  energyLevel  and assign to it a value  of  100.\n\n Checkpoint 2\
    \ Passed\n\nStuck?  Get a hint\n\n2.\n\n![](Images/image04819.jpeg)Inside  theobject,\
    \  add  a  method  named  provideInfo.  Inside the  body\n\nof  provideInfo(),\
    \  return  the  following  string  by  using  interpolation:\n\nI  am  MODEL \
    \ and  my  current energy  level  is  ENERGYLEVEL.\n\nReplace  ‘MODEL’  and ‘ENERGYLEVEL’\
    \  with the  calling\n\nobject’s  model  and  energyLevel  property. Remember,\
    \ to get  the access to  the  calling  object’s properties inside a  method, you\
    \ have to use\n\nthe  this  keyword!\n\n Checkpoint 3 Passed\n\nStuck?  Get a\
    \ hint\n\n3.\n\nNow  to  check  .provideInfo()  has  access to  the internal \
    \ properties  of  robot.  Log the result of calling  .provideInfo()  method on\
    \  robot  to the console.\n\n![](Images/image04820.jpeg)\n\nArrow  Functions and\
    \  this\n\nWe saw in the previous exercise that for a method, the calling object\
    \ is the  object  the  method  belongs  to. If we  use the  this  keyword  in\
    \ a method  then  the value of  this  is the calling object. However, it becomes\
    \ a bit more  complicated when we start using arrow functions for methods. Take\
    \ a look  at  the example below:\n\n![](Images/image04821.jpeg)\n\n![](Images/image04822.jpeg)In\
    \  the comment,  you can see  thatwould log  undefined. So  what\n\nhappened?\
    \ Notice that  in the  .diet()  is defined  using an arrow function.\n\nArrow\
    \ functions inherently bind, or tie, an already defined  this  value to the  function\
    \ itself that is NOT the calling object. In the code snippet above, the  value\
    \  of this  is  the  global  object,  or an object  that exists in the global\
    \ scope,  which  doesn’t have a  dietType  property  and therefore returns  undefined.\n\
    \nTo read more about either arrow functions or the global object check out  the\
    \  MDN documentation of  [the global object](https://developer.mozilla.org/en-US/docs/Glossary/Global_object)\
    \ and [arrow functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions).\n\
    \nThe key takeaway from the example above is to avoid using arrow functions  when\
    \ using  this  in a  method!\n\nInstructions  1.\n\nCurrently  the  .checkEnergy()\
    \  method  is  not  producing  the correct output  because  it is using arrow\
    \ function  syntax.\n\nRefactor, or change, the method to use a function expression.\
    \ You can write  the  function using  either longhand or shorthand format."
