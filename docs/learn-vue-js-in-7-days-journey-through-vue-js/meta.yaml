    **Hello {{ get_full_name() }}, Greeting from Learn VueJS in 7 days.**


    We have taken two data properties to hold the user inputs and associated them
    with the input texts.


    first_name


    last_name


    The method getfullname in the Vue object, concatenates both the variables along
    with an additional space in between them and returns the full name, which gets
    printed on screen in the greet message. We have used v-show directive, so that
    it won’t render the greeting message when there is no first name and last name
    specified in the screen.


    It works !!


    So, what are the drawbacks here?


    It would be memory consuming. When we call this method to show the greeting message,
    it will try creating the full stack and allocate memory to it. So, each time we
    make changes in the firstname or lastname data attribute, it will call that method,
    which results a lot of memory allocation to same method for each instance.


    Imagine the scenario, a method involving more calculations and/or processing would
    lower down the performance of the app as well as consumes more memory.


    Let''s talk about the solution


    We can use the computed property to address this problem. Unlike the method approach
    above, computed property will cache the result. It won’t get refreshed, unless
    the dependent v-models get changed.


    ```

