    \       }\n\n            else{\n\n                alert(\"Customer Number is Valid\"\
    );\n            }\n        }\n    },\n\n    created: function(){\n\n        alert(\"\
    Component created\");\n\n    }\n}\n```\n\n从代码中可以看到，我们使用了两个警告提示来检查执行顺序。当我们在浏览器中运行时，混入中的警告信息会首先显示，然后才是组件中的警告。\n\
    \n## 混入中的合并\n\n如前所学，混入会与组件合并。这也意味着混入中的数据对象也会与组件的数据对象合并。\n\n```\nexport const DataMergerMixin\
    \ = {\n\n    data: function(){\n\n        return{\n\n            message : \"\
    Message from mixin\"\n\n        }\n\n    }\n\n}\n```\n\n我们将在组件中定义一些数据。\n\n```\n\
    \        {{ $data }}\n```\n\n`{{ $data }}` 的结果将是两个数据对象的组合。\n\n```\n{ \"component_message\"\
    : \"This is a component message\", \"message\": \"Message from mixin\" }\n```\n\
    \n需要注意的是，如果混入和组件中的数据变量名相同，那么组件的数据变量将被打印出来。让我们将组件中的 `component_message` 变量重命名为\
    \ `message`。\n\n```\n        {{ $data }}\n```\n\n现在，混入和组件中的数据变量名相同。因此，输出将被组件覆盖。\n\
    \n```\n{ \"message\": \"This is a component message\" }\n```\n\n## 函数冲突\n\n与数据变量冲突类似，当组件和混入中的函数发生冲突时，组件中的函数会覆盖混入中的函数。\n\
    \n## 全局混入\n\n在全局作用域中定义的混入可以被所有组件访问。在通过 CLI 构建的 Vue 应用中，我们可以在 `main.js` 中定义一个混入。\n\
    \n```\nVue.mixin({\n\n  methods: {\n\n    showAppInfo: function () {\n\n     \
    \ alert(\"Learn Vue In 7 Days\")\n\n    }\n\n  }\n\n})\n```\n\n我们添加了一个名为 `showAppInfo`\
    \ 的方法，用于显示应用信息。该方法应该可以被所有组件全局访问。\n\n## 自定义指令\n\n我们已经学习了很多 Vue 中以 `v-` 为前缀的指令。例如\
    \ `v-model`、`v-if` 等，这些都是 Vue 支持的内置指令。\n\n现在，让我们创建我们自己的自定义指令。顾名思义，自定义指令将以自定义的方式工作。\n\
    \n## 创建自定义指令\n\n要创建自定义指令，我们需要使用 Vue 对象。指令将被添加到应用的 Vue 对象上。\n\n```\nVue.directive('campaign\
    \ name',\n\n  function(el, binding, vnode) {\n\n})\n```\n\n该函数接受以下参数来处理用户和数据：\n\
    \n- `el`：代表元素。它返回指令所关联的 DOM 对象。\n- `binding`：包含有关参数、格式化器等信息。\n- `vnode`：用于跟踪父\
    \ DOM 元素。\n\n让我们创建我们的第一个自定义指令。我们使用 Vue CLI 环境来编写代码。我们将把指令添加到 `main.js` 中并访问它们。\n\
    \n```\nVue.directive('highlight',\n\n  function(el, binding, vnode) {\n\n    el.style.fontSize\
    \ = '50px';\n\n    el.style.fontWeight = 'bold';\n\n  }\n\n)\n```\n\n如上代码所示，我们创建了一个名为\
    \ `highlight` 的新自定义指令。它将设置其绑定的 DOM 元素的字体大小和字体粗细。\n\n## 自定义指令演示\n\n`highlight`\
    \ 指令将用于带有 `v-` 前缀的 HTML 元素。这里，我们将自定义指令添加到了 DOM 元素上。因此，格式化将应用于该元素。\n\n## 自定义指令演示\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_53_0.png)\n\n图 6.2：浏览器控制台显示添加到元素的自定义指令\n\
    \n当渲染到屏幕上时，指令会在运行时对 DOM 元素应用更改。\n\n## 向自定义指令传递值\n\n在前面的例子中，我们创建了一个不接受外部值的自定义指令。它为\
    \ HTML 元素设置了固定的格式。我们也可以向自定义指令传递值。根据传递的值，自定义指令也可以应用格式。\n\n```\nVue.directive('notify',\n\
    \n    function(el, binding, vnode) {\n\n        var colour = (binding.value !=\
    \ undefined && binding.value != \"\") ? binding.value : \"red\";\n\n        el.style.fontSize\
    \ = '15px';\n\n        el.style.fontWeight = 'bold';\n\n        el.style.color\
    \ = colour;\n\n        el.style.backgroundColor='#ffcccc';\n\n    }\n\n)\n```\n\
    \n在上面的代码中，我们创建了一个名为 `notify` 的自定义指令。我们可以从外部传递值来设置 DOM 元素的格式。\n\n在这个例子中，我们为 DOM\
    \ 元素应用了除颜色以外的固定格式。颜色则接收来自用户的动态值。这里设置的默认颜色是红色。如果没有指定颜色，元素颜色将是红色，否则将使用用户输入的颜色。\n\
    \n你已成功进入演示页面\n\n我们从 HTML 向指令传递了颜色值。该值需要在等号 `=` 之后的双引号内传递。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_54_0.png)\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_54_1.png)\n\n图 6.3：显示通过向自定义指令传值应用的样式的截图\n\
    \n在浏览器中，它会根据用户输入的自定义颜色以及其他固定格式进行渲染。\n\n## 向自定义指令传递参数\n\n与传递值类似，我们也可以向自定义指令传递参数。要传递参数，我们需要使用冒号\
    \ `:` 代替等号。\n\n- 低流量\n- 中等流量\n- 高流量\n\n我们定义了一个带有不同延迟的交通灯系统示例。根据参数（`Low`/`Moderate`/`High`），交通信号将相应地运行。\n\
    \n如上所示，我们使用冒号 `:` 将参数传递到自定义指令中。根据参数，它将改变元素样式以在网页中执行相应操作。\n\n```\nVue.directive('traffic',\
    \ function(el, binding, vnode){\n    var intervalObj;\n    var interval = 5000;\n\
    \    switch(binding.arg){\n        case \"low\":\n            interval = 5000;\n\
    \            break;\n        case \"moderate\":\n            interval = 10000;\n\
    \            break;\n        case \"high\":\n            interval = 20000;\n \
    \   }\n});\n```\n"
