  - "[PAGE 27]\n\n# What is component?\n\nComponents are the vue instances which can\
    \ be reused to perform certain task. They can be reused in multiple places by\
    \ just instantiating the same.\n\nWe will design our first component\n\nWe will\
    \ see how really a component gets designed. We will also see the way to render\
    \ a component in page.\n\nTo start, first, let's design a component to render\
    \ a text box along with a label on screen. We will reuse the same to render multiple.\n\
    \n```\n<!DOCTYPE html >\n<html>\n<head>\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1, shrink-to-fit=no\">\n    <link rel=\"stylesheet\"\
    \ href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-GJzZqFGwb1QTTN6wy59FF1Bu1Gj6Sa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS\"\
    \ crossorigin=\"anonymous\">\n    <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    <style>\n        .full-width{\n            width: 100%;\n    \
    \        height: 90%;\n        }\n    </style>\n</head>\n<body>\n    <div id=\"\
    app_div\">\n        <custom_text></custom_text>\n    </div>\n    <script>\n  \
    \      Vue.component('custom_text', {\n            template: '<fieldset class=\"\
    container\"><div class=\"row\"> <div class=\"col-2\">Custom Text</div> <div class=\"\
    col-6\"><input type=\"text\" class=\"full-width\" /></div> </div> </fieldset>'\n\
    \        });\n        var app = new Vue({\n            el: \"#app_div\",\n   \
    \     });\n    </script>\n</body>\n</html>\n```\n\nUnlike previous chapters, in\
    \ the above code, we can see Vue.component block. It defines a component.\n\n\
    ![](img/2c298ca86478005a0a21c9796cebbd15_27_0.png)\n\nFigure 4.3: Vue component\
    \ body description\n\nAs shown in the image, we can define the component name\
    \ that needs to be used to render the component on screen. The component body\
    \ gets defined in the template part.\n\nWe just need to use the component name\
    \ as a tag to render the same on screen."
  - "[PAGE 28]\n\n<custom_text></custom_text>\n\nWe will get the following output\
    \ on screen by rendering the page in a browser.\n\n**Custom Text** [Input Field]\n\
    \nRender the same component on screen; we just need to keep repeating the tags.\
    \ Wherever it found the same tag inside a Vue element, it will keep rendering\
    \ the controls as above.\n\nExtend the template\n\nIt is just a text box inside\
    \ a fieldset. Now, let's add another fieldset with another text box so that whenever\
    \ we use the same tag, it will render two text boxes at a time.\n\nWe will make\
    \ this more meaningful now. Instead of the customtext , we will make it customaddress\
    \ . Also, we will change the Custom Text label to Address Line 1 .\n\nThe changes\
    \ must go into the template section. So, I have appended a new fieldset with the\
    \ existing one so that it will render two text boxes, one after the other.\n\n\
    ```\n<body>\n  <div id=\"app_div\">\n    <custom_address></custom_address>\n \
    \ </div>\n  <script>\n    Vue.component('custom_address', {\n      template: `<fieldset\
    \ class=\"container\"><div class=\"row\"> <div class=\"col-2\">Address Line 1</div>\
    \ <div class=\"col-6\"><input type=\"text\" class=\"full-width\" /></div> </div></fieldset>\
    \ <fieldset class=\"container\"><div class=\"row\"> <div class=\"col-2\">Address\
    \ Line 2</div> <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    /></div> </div></fieldset>`\n    });\n    var app = new Vue({\n      el: \"#app_div\"\
    ,\n    });\n  </script>\n</body>\n```\n\n![](img/2c298ca86478005a0a21c9796cebbd15_28_0.png)\n\
    \nWe will render the same in the browser to see the output. Ahh.. but we ended\
    \ with an error as follows:\n\n![](img/2c298ca86478005a0a21c9796cebbd15_28_1.png)\n\
    \nIt clearly states that the component template should contain exactly one root\
    \ element. If we use v-if then we need to chain it with v-else-if too, to maintain\
    \ the single root. Since we have used two fieldsets one after the other, we are\
    \ deviating from the rule. So, we need to add another root element to see, if\
    \ that works.\n\nLet's surround the fieldsets with a <div> element so that we\
    \ can follow the single root element rule of Vue component."
