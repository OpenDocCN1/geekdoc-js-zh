- md: "Array Component Example\n\nOne example ArrayComponent might look like the following.\n\
    \n## The numbers are {{ numberArray }}!\n\nThe data function is responsible to\
    \ make the Vue app reactive. So, any change to the data property will trigger\
    \ a rerender of the view if the property is being used.\n\nNow let's go another\
    \ step and try to manipulate this array from another component. Basically, we\
    \ are trying to access or update this property from other components while asking\
    \ all components to take the fresh data. When you start to operate on data properties\
    \ which are reactive in nature from different components, the state of the data\
    \ becomes very very important. That is where our topic of discussion comes into\
    \ picture.\n\nThese data properties when shared across multiple components can\
    \ be called component level data or application level data.\n\n### Parent to Child\
    \ Component data passing using Props\n\nTo start with, let's try to pass data\
    \ from one component to other using props.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_71_0.png)\n\
    \nFigure 7.4: Pictorial representation of Parent to Child Communication using\
    \ Props\n\nA parent component can be like:\n\nThe important thing to notice here\
    \ is by which we are trying to pass the data to the ChildComponent. Let's see\
    \ the code of ChildComponent.\n\n## The numbers are {{ numberArray }}!\n\nTo catch\
    \ the property, we declared that as an Array in ChildComponent and rendered it\
    \ inside a template. Output is shown below.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_72_0.png)\n\
    \nFigure 7.5: Output of Parent to Child Communication using Props\n\n### Child\
    \ to Parent Component data update using Custom Events\n\nNow that we did this,\
    \ let's try to go in the opposite way. From Child to Parent. Props can't be used\
    \ here as that is uni-directional approach. Vue Custom Events comes to our rescue\
    \ where we can notify the Parent about a change to the array.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_72_1.png)\n\
    \nFigure 7.6: Pictorial representation of Parent and Child Communication using\
    \ Props and Custom Events\n\nAdding a number to the array from Child is something\
    \ which we can try quickly.\n\n## The numbers are {{ numberArray }}!\n\nAdd new\
    \ number\n\nThere is a textbox which binds the captured input to number data property.\n\
    \nNotice the button which has a click event that emits add-number custom event\
    \ with the captured number value (converted to number using Number()) from the\
    \ textbox above it. We need to have a listener for this custom event on Parent\
    \ so that we can add the number entered into the numberArray.\n\nYou can see the\
    \ listener pushes the number into the array. Refer the screenshot below.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_72_2.png)\n\
    \nFigure 7.7: Output of Parent and Child Communication using Props and Custom\
    \ Events\n\nThus, we completed exploring two techniques to communicate between\
    \ Parent Child using property and custom events. But how to communicate between\
    \ two child components? That is the next thing we will learn.\n\nWhen we say communication\
    \ between two child components, that means we are talking about two isolated components\
    \ with absolutely no dependency on each other. While using custom events, one\
    \ component became parent as it rendered another component as a child. That is\
    \ the mandatory condition with custom events. Therefore, in the case of isolated\
    \ components, we can't use custom events.\n\nThere are few methods which we can\
    \ use to manage state between independent components.\n\n- EventBus\n- Global\
    \ Store\n- Vuex\n- EventBus\n\nEventBus helps to implement a publish and subscribe\
    \ pattern. By the help of EventBus, we can easily work with custom event communication\
    \ between components. Although we learnt that independent components can't communicate\
    \ through custom events, however, EventBus is something global in nature which\
    \ manages the communication. Let's get started.\n\nAdd a js file named as event-bus.js\
    \ with the following code to instantiate.\n\n```js\nimport Vue from 'vue';\n\n\
    export const EventBus = new Vue();\n```\n\nNow we need to add two new isolated\
    \ components, one which can add numbers to the array and the other which would\
    \ display the results.\n\nAddNumber.vue would look like below:\n\n![](img/2c298ca86478005a0a21c9796cebbd15_73_0.png)\n\
    \nBasically we have added a method addNumber() which emits the add-number event\
    \ using the EventBus instance with data number which is bound with the textbox.\n\
    \nNow it's just a matter of listening to the add-number event emitted by EventBus.\
    \ Let's add the component which would show us the numbers.\n\n## {{ numbers }}\n\
    \nNotice the EventBus listener event EventBus.$on(\"add-number\", number => {...});\
    \ that is responsible to listen to the emitted event for adding a number.\n\n\
    When you include both these AddNumber.vue and ShowNumbers.vue in App.vue and implement\
    \ them inside template, it would look like below.\n\nSo, the basic operation can\
    \ be shown in the following diagram.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_74_0.png)\n\
    \nFigure 7.8: Pictorial representation of Child to Child Communication using EventBus\n\
    \nNow run the app and see it working on browser.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_74_1.png)\n\
    \nFigure 7.9: Output of Child Components Interaction through EventBus\n\nAccording\
    \ to our example, EventBus seems very easy to setup and implement in the app.\
    \ However, it comes with disadvantages which can't be ignored in a prod ready\
    \ application with a lot of components.\n\nThe reason, it will fail to meet the\
    \ expectations is due to the emission of events through EventBus. As the app grows\
    \ and more components are added, it becomes difficult to keep track of the events\
    \ emitted and thus, maintenance is a pain in this technique.\n\n## Global Store\n\
    \nIt's something very common and obvious pattern to handle application data. Technique\
    \ involves creating a store which stores the data required including the methods\
    \ to manage the state of the application.\n\nLet's add one store named as store.js.\n\
    \n```js\nexport const store = {\n  state: {\n    numberArray: [500, 250, 390]\n\
    \  },\n  addNumber(newNumber) {\n    this.state.numberArray.push(newNumber);\n\
    \  }\n};\n```\n\nThe store contains the numberArray inside the state object and\
    \ addNumber method which pushes a new number to the state.numberArray. Now we\
    \ need to use this store in our components where we would add and show the array.\n\
    \n```vue\n<template>\n  <div>\n    <input v-model=\"newNumber\" type=\"number\"\
    >\n    <button @click=\"addNumber\">Add new number</button>\n  </div>\n</template>\n\
    \n<script>\nimport { store } from './store';\n\nexport default {\n  data() {\n\
    \    return {\n      newNumber: 0\n    };\n  },\n  methods: {\n    addNumber()\
    \ {\n      store.addNumber(this.newNumber);\n    }\n  }\n};\n</script>\n```\n\n\
    Simple, isn't it. We referred the store.js inside this component and inside addNumber\
    \ method we are calling the associated method using the store object.\n\nLikewise\
    \ let's add the display method.\n\n```vue\n<template>\n  <div>\n    <h1>{{ storeState.numberArray\
    \ }}</h1>\n  </div>\n</template>\n\n<script>\nimport { store } from './store';\n\
    \nexport default {\n  computed: {\n    storeState() {\n      return store.state;\n\
    \    }\n  }\n};\n</script>\n```\n\nWe are just displaying the numberArray from\
    \ the store object. Works like a charm due to the reactivity nature of Vue! When\
    \ numberArray is updated, it is automatically getting reflected on the other components\
    \ using that. Here is the output.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_75_0.png)\n\
    \nFigure 7.10: Output of Independent Component Interaction through Global Store\n\
    \nHere is the pictorial representation.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_75_1.png)\n\
    \nFigure 7.11: Pictorial representation of Independent Component Interaction through\
    \ Global Store\n\nFew things to note here before we move forward.\n\nAddNumber:\
    \ directly updates the data by invoking store method. This can be tagged as Store\
    \ Action.\n\nMethod inside Store: changes the state of the data, which can be\
    \ defined as Store Mutation.\n\nShowNumbers: just gets the store data and displays,\
