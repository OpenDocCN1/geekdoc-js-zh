  md: "Like other model attributes, we can make watchers watch to the computed property\
    \ as well. It can track the changes in the computed property and behave as per\
    \ the codes written in it.\n\nWe will extend the same temperature meter. We will\
    \ add Fahrenheit conversion of the Celsius.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_24_0.png)\n\
    \nFigure 3.15: Celsius to Fahrenheit conversion calculator\n\nWe have added a\
    \ new computed property called ftemperature , to calculate the Fahrenheit from\
    \ the Celsius. Watcher will be added to the same computed property to watch the\
    \ changes in the values. As soon as the value in the Celsius text box gets changed,\
    \ it gets the computed property calculated for the Fahrenheit. This change will\
    \ get observed by the watcher and executes the code written inside.\n\n```\n<script>\n\
    \    var app = new Vue({\n        el: “#app_div”,\n        data: {\n         \
    \   temperature: 98.6,\n            temp_message: “”,\n            f_message:\
    \ “”\n        },\n        computed: {\n            ftemperature: function(){\n\
    \                return (this.temperature * 9/5) + 32;\n            }\n      \
    \  },\n        watch: {\n            temperature: function(newValue, oldValue){\n\
    \                if(newValue < oldValue){\n                    this.temp_message\
    \ = “Your temperature is dropping.”;\n                }\n                else\
    \ if(newValue > oldValue){\n                    this.temp_message = “Your temperature\
    \ is rising.”;\n                }\n                else{\n                   \
    \ this.temp_message = “Your temperature is still unchanged.”;\n              \
    \  }\n            },\n            ftemperature: function(newValue, oldValue){\n\
    \                this.f_message = “Temperature changed from “ + oldValue + “ fahrenheit\
    \ to “ + newValue + “ fahrenheit”;\n            }\n        }\n    });\n</script>\n\
    ```\n\nSo the change of the Celsius value will compute the Fahrenheit value and\
    \ get stored in the ftemperature ."
