    In this chapter, we have covered how mixins helps in defining common logic and
    get merged with the components. We have also learnt the way to define custom directives
    to manage the formatting and display in the UI components. Also, we have learnt
    the filters and plugins.


    We will learn the way to develop single page website using the state management.
    We will cover the state management in the next chapter.


    DAY 7


    # Single Page Application


    In the previous chapter, we discovered some ways to build reusable distributed
    functionalities for our Vue applications.


    Routing and State Management play an important role while designing Single Page
    Applications (SPA). In this chapter, we will look into ways to implement these
    concepts in our Vue app.


    HTML5 History mode would help us creating routes for SPAs that creates an easy
    path way for the user to go back and forth between pages dynamically without page
    load.


    We will learn few principles with proper illustrations for State Management in
    Vue apps. Parent Child component interaction using props and custom events followed
    by state management techniques with EventBus and Global Store is what we are going
    to explore.


    Last, but not the least, the Vuex library, which is a robust way to manage the
    application state will take your attention to the next level of app development
    with Vue.


    Of course, we will take a brief look at the differences between these state management
    techniques to decide which one to go for.


    Following are the topics we will cover:


    +   - Creating a route

    - Using the routes

    - Basics of how state management works

    - State management implementation using EventBus, Global Store and Vuex


    # What is a Route


    Routing is a technique by which the requests coming to your website or webservices
    are guided through to the destination meaning the code which would handle them.
    Suppose you type http://www.example.com/about on the browser url box, which should
    point to your About.html or something else. Defining that particular rule is called
    Routing.


    In a Single Page Application (SPA), Routing is the key as you really don''t want
    your page to reload for another request. Traditional applications behave in such
    a way that when you click on a hyperlink, it would go to server and come with
    a html page. However, in SPA, the page loads one time and when you request for
    something by your actions on the page (like clicking a link or button), it dynamically
    changes the content as per the request to load new content/page.'
- md: "## Creating a Route\n\nAs Vue is component based, let's first design few components\
    \ for different pages like Home, About and Contact.\n\n**Home.vue**\n\n```\n#\
    \ This is Home Page!\n```\n\n**Contact.vue**\n\n```\n# This is Contact Page!\n\
    ```\n\n**About.vue**\n\n```\n# This is About Page!\n```\n\nNow we need to build\
    \ a mechanism to tie up all these together to a method so that we can access the\
    \ pages as urls like www.example.com/home , www.example.com/about , www.example.com/contact\
    \ .\n\nFor that, let's define a route object for all the pages.\n\n```\nimport\
    \ Home from \"./Home\";\nimport About from \"./About\";\nimport Contact from \"\
    ./Contact\";\n\nconst routes = {\n    \"/\": Home,\n    \"/home\": Home,\n   \
    \ \"/about\": About,\n    \"/contact\": Contact\n};\n```\n\nSimple, isn't it!\
    \ Basically, we are asking to map the routes to their respective pages. Notice\
    \ that we have assigned / and /home to Home.vue as it is obvious.\n\nHowever,\
    \ this is not all. We still have not done anything with the routes object. If\
    \ you think logically, when a request comes for a particular page say /about,\
    \ we have to somehow load About.vue. Below is the code for that where we are fetching\
    \ window.location.pathname and using that to retrieve the component name from\
    \ the routes object.\n\n```\nexport default {\n  data() {\n    return { current:\
    \ window.location.pathname };\n  },\n  computed: {\n    routedComponent() {\n\
    \      return routes[this.current];\n    }\n  }\n};\n```\n\nAfter this, we need\
    \ to have a template which would load the component we retrieved. To do that,\
    \ let's add the following code using :is directive with the computed data routedComponent.\n\
    \nNow, putting it all together we can save all these code in another component\
    \ called AppRouter.vue.\n\n## Using the Routes\n\nEverything is ready except the\
    \ App.vue which would give life to this AppRouter component. Add the following\
    \ code inside App.vue.\n\n```\nimport AppRouter from \"./components/AppRouter.vue\"\
    ;\n\nexport default {\n  components: {\n    AppRouter\n  }\n};\n```\n\nNOTE: App.vue\
    \ is present inside root folder, but all other components discussed above are\
    \ placed inside the \"components\" folder.\n\nLet's run the app by npm run serve\
    \ command and see if this works.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_66_0.png)\n\
    \nInteresting! No output. That is obvious because we have not yet included the\
    \ AppRouter component inside App.vue.\n\nNow run it again, it would display the\
    \ following output!\n\n![](img/2c298ca86478005a0a21c9796cebbd15_67_0.png)\n\n\
    Figure 7.2: Simple Routing Example\n\nHere we can see four outputs shown in the\
    \ picture side by side. Have a close look on the Urls. Localhost:8080 and localhost:8080/home\
    \ loads the same page Home.vue. That is what we wanted as declared in the routes\
    \ object. About and Contact components are also loaded for localhost:8080/about\
    \ and localhost:8080/contact respectively.\n\nOn a fully featured production app,\
    \ however, the pages are linked to each other. Meaning, links are present to navigate\
    \ from one page to another. Something like below:\n\n![](img/2c298ca86478005a0a21c9796cebbd15_67_1.png)\n\
    \nFigure 7.3: Routing with Navigation Links\n\nFor this, we can add one unordered\
    \ list with the routes inside App.vue.\n\n- Home\n- About\n- Contact\n\nHere loadPage\
    \ is a method which would load the route into window.location.\n\n```\nexport\
    \ default {\n  components: {\n    AppRouter\n  },\n  methods: {\n    loadPage(route)\
    \ {\n      window.location = route;\n    }\n  }\n};\n```\n\nWith this code in\
    \ place, we can see the above output with links on each page, which loads the\
    \ particular component as requested on the url passed.\n\nWhatever we discussed\
    \ so far works for normal loading of pages, that means when you click the link,\
    \ the page reloads and content changes. However, in case of SPA, the page dynamically\
    \ loads the contents without reloading. That is what we will learn in the next\
    \ content.\n\n## Routing in SPA\n\nWith some more changes to the code above, we\
    \ can achieve routing for one SPA app. Basically, the page should not reload.\
    \ HTML5 History Mode would help us manage the history of pages. Let's get started.\n\
    \nThe History API has different methods which we can use. The pushState method\
    \ would replace the window.location and does not perform a reload. Let's update\
    \ the App.vue to implement pushState method.\n\n```\nloadPage(route) {\n  //window.location\
    \ = route;\n  history.pushState(null, null, route)\n}\n```\n\nLet's not focus\
    \ on the first two parameters for now. Third parameter is for the route, which\
    \ we passed.\n\nThe next step is to react to the route changes. If you remember,\
    \ AppRouter component helps us to render the actual page. That means routedComponent\
    \ computed property should be updated, which implies an update to this.current\
    \ variable. We will see how that is done in a while. But before that, let's modularize\
    \ the history related operations. Name it as history.js.\n\nFirst add the push\
    \ method.\n\n```\nexport const push = route => {\n  window.history.pushState(null,\
    \ null, route);\n};\n```\n\nHistory would also listen to changes in the route,\
    \ for that, we need to implement a method called listen that stores the callback\
    \ methods in a listeners array.\n\n```\nconst listeners = [];\n\nexport const\
    \ push = route => {\n  window.history.pushState(null, null, route);\n};\n\nexport\
    \ const listen = fn => {\n  listeners.push(fn);\n};\n```\n\nNow the push method\
    \ should take the responsibility to notify by iterating the listeners and call\
    \ the callback functions passing the route as a parameter.\n\n```\nexport const\
    \ push = route => {\n  const previousRoute = window.location.pathname;\n  window.history.pushState(null,\
    \ null, route);\n  listeners.forEach(listener => listener(route, previousRoute));\n\
    };\n```\n\nAs we are done with the history module, let's start using that inside\
    \ the App.vue.\n\n```\nimport AppRouter from \"./components/AppRouter.vue\";\n\
    import { push } from \"./history\";\nexport default {\n  components: {\n    AppRouter\n\
    \  },\n  methods: {\n    loadPage(route) {\n      //window.location = route;\n\
    \      //history.pushState(null, null, route)\n      push(route);\n    }\n  }\n\
    };\n```\n\nInstead of using history.pushState method, now we are using calling\
    \ push method directly which is residing inside history.js.\n\nWe have more work\
    \ to do. The AppRouter component should know about the change in the route when\
    \ we navigate between pages. And that is because there is a this.current variable\
    \ which stores the current route.\n\n```\n// Other codes here...\nimport { listen\
    \ } from \"../history\";\nexport default {\n  created() {\n    listen((route,\
    \ previousRoute) => {\n      this.current = route\n    })\n  }\n  // More codes...\n\
    };\n```\n\nThe listen method is called inside created hook because we need to\
    \ set the listener mechanism once. That is because everything else automatically\
    \ works next time when you call push for subsequent requests. If you see the push\
    \ method inside the AppRouter, that actually calls the method registered into\
    \ the listener array.\n\nNow, if you run the app, it will change the route and\
    \ page content on button clicks. However, if you click on browser back and forward\
    \ buttons, it won't work.\n\nTo complete the SPA routing, we need to add another\
    \ small chunk of code inside AppRouter and the complete code looks like below:\n\
    \n```\nexport default {\n  created() {\n    listen((route, previousRoute) => {\n\
    \      debugger;\n      this.current = route\n    });\n    window.addEventListener(\n\
    \      \"popstate\",\n      event => (this.current = window.location.pathname)\n\
    \    );\n  },\n  data() {\n    return { current: window.location.pathname };\n\
    \  },\n  computed: {\n    routedComponent() {\n      return routes[this.current];\n\
    \    }\n  }\n};\n```\n\nSo, the popstate method is called when we click back and\
    \ forward button of browser, thereby setting up the this.current value.\n\nThus,\
    \ we completed the SPA routing with Vue. You can find the codes in Github. Try\
    \ it and see that you can see the page contents dynamically without page load,\
    \ when you click on the buttons on the page or browser back and forward buttons.\n\
    \n## State Management\n\nComponents are the building blocks of Vue application.\
    \ It's important how the application shows us updated data every time a change\
    \ occurs. That means the data update should ensure integrity among the components.\n\
    \nLet's go through a step by step example to understand how we can manage state\
    \ for the data in a vue js app."
