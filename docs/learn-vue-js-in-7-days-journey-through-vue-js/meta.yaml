    # Hello from JSX


    ![](img/2c298ca86478005a0a21c9796cebbd15_84_0.png)


    Figure 8.5: Rendered HTML using JSX


    In the console window, we can mark the hierarchy of the elements and the string
    as defined in the script.


    Display the props


    As a component, we can have props defined in it. The props are the ones which
    gets the values from the parent. If we look into the code snippet, we can mark
    the text display format difference. Here instead of the mustache representation,
    we are using the {} (single curly braces) to render the text on screen.


    Let''s extend the current example and add components into it. Here, we will import
    the component that we have already created in this chapter.


    We have imported the HelloWorld component here and added that to the page.


    ![](img/2c298ca86478005a0a21c9796cebbd15_84_1.png)


    Figure 8.6: Render component UI using JSX


    We can use with slots, formatters, and many more, which is beyond the scope of
    this topic. We have covered, how to use JSX and how it works with Vue.


    # Comparing Vue


    Vue is a progressive Javascript framework built on top of Javascript. It uses
    virtual DOM to update the elements and render them on the browser. Like Vue, there
    are several other pretty similar frameworks present. They can also work like vue.
    Many times, we need to decide while choosing a framework for an application development.
    So, to choose we need to compare between them. We will compare with some popular
    frameworks with vue.


    # React vs Vue


    React is also one of the most popular Javascript framework being used for application
    development. Like vue, it also uses virtual DOM to update and render the elements
    in the browser. React also has the component based development capability similar
    to Vue.


    # Component template designing'
  - '[PAGE 85]


    Component tree rendering


    CSS file structured


    Data mutation


    There is more difference in the syntaxes and semantics of both the frameworks.
    The handing of variables, handling of events, dealing with child/parent components,
    and so on. differs between React and Vue. But they are mostly on the coding syntaxes,
    which we cannot cover all. We have covered most basic conceptual differences above.


    Angular vs Vue


    The formerly and popularly known Angular 2 (current version is 6, which writing
    of this book) is being referred as Angular here. It is completely different than
    the AngularJS. We will compare Angular here with Vue.


    Learning curve


    Performance


    Performance wise both Angular and Vue looks very much similar. Angular uses mostly
    Ahead of Time compilation to product the end output size considerably small. However,
    Vue also produces smaller sizes too.


    Conceptual differences


    Javascript frameworks are not limited to only to the above. We have only made
    a comparison between the popular frameworks. Since the above comparison is mostly
    developer centric, it would help the developers to take mostly the correct decision
    to choose one technology over the other while starting up with any project.


    ![](img/2c298ca86478005a0a21c9796cebbd15_85_0.png)


    In this chapter, we have covered the alternative ways to design the Vue template.
    We have only covered a basic part of it. We also saw a comparison of couple of
    frameworks with VueJs.


    When we say, we are ending up with this learning, we mean, the reader must have
    an idea of how Vue works as an framework. Starting from the life cycle hook to
    components, would give a fare idea of VueJS framework to work with it. We have
    also learnt a very useful way of creating reusable elements such as components,
    plugins, filters, directives, and so on. The state management example will also
    help the developer to visualize the application design way.


    Certainly, it is not possible to cover everything and every knowledge about a
    framework in a single book. This book would be quick reference for the developers
    while working in the real environment.'
