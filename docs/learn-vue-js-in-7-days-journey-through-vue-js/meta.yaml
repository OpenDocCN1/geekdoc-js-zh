    ## 轻量级


    它是一个轻量级的 JavaScript 库，一旦添加到项目中即可生效。它主要遵循 ViewModel 模式与视图层进行通信。视图层主要通过 HTML 和 CSS
    设计。


    ## 渐进式


    如前所述，它主要作用于 UI 中的视图层。通过将模板模型与数据模型绑定，它被实现为 HTML UI 的额外标记。


    ## 虚拟 DOM


    DOM 是 Document Object Model（文档对象模型）的缩写。我们在浏览器中看到的 HTML DOM 具有树状结构。为了在浏览器中对 UI
    进行更改，我们需要从 DOM 树中找到对应的 DOM 元素并对其进行修改。我们主要使用 `document.getElementById` 来查找元素。这是一个内存消耗较大的过程，会导致页面运行变慢。


    虚拟 DOM 是一种将 DOM 树绑定到 JavaScript 对象树的技术。这个 JavaScript 对象树并非真正的 DOM；它是 HTML DOM
    在 UI 上的虚拟表示。因此，任何对与 DOM 元素绑定的 JavaScript 对象属性节点的更改，都会反映在屏幕 UI 上。这种方式不会消耗大量内存。Vue
    中对虚拟 DOM 的实现基于 snabbdom（https://github.com/snabbdom/snabbdom）。


    ## 基于 HTML 的模板


    模板有助于创建可复用的 UI 组件。Vue 对象允许在对象内部使用 HTML 代码来定义模板，这有助于创建可复用的组件，并为现有的 HTML 添加了高级功能。


    ## 响应式视图组件


    Vue 支持双向绑定技术。数据模型与模板模型绑定，当数据模型中的数据发生变化时，会反映在 UI 上，反之亦然。


    ## 单页应用


    单页应用（SPA）是一种 Web 应用程序，它主要通过在同一页面动态写入内容来渲染和重新渲染，而不是根据用户操作加载多个不同内容的页面。Vue 可用于开发
    SPA，也可用于多页应用。


    ## 让我们搭建 Vue.js


    我们现在需要搭建 Vue，以便在项目中使用它。因此，在继续安装之前，我们先看看将 Vue.js 添加到项目中的几种方式。


    ### 下载并引用方法


    如前所述，Vue 是一个轻量级的 JS 库。该库可以直接下载，并通过 `<script>` 标签添加到项目中。


    这段代码只是展示如何在 NPM 安装后使用 Vue.js 库。代码中的粗体行表示 Vue 的引用。我们将在后续主题中详细讲解这段代码。这里引用的 Vue.js
    文件是 Vue 的开发版本，这样开发者在开发过程中可以获取警告和调试信息。但在将其发布到生产环境之前，我们需要将引用更改为 `vue.min.js`。


    ## 让我们让 Vue 动起来


    我们将开始把 Vue 添加到一个 HTML 页面，并在浏览器中查看效果。我们将使用 CDN 链接将 Vue.js 包含到页面中。


    让我们创建一个文档并将其命名为 `index.html`。在 `index.html` 中，我们将添加以下代码来查看 Vue 的实际效果。


    ```

    {{ hello_msg }}

    ```


    现在，让我们在浏览器中查看 `index.html` 文件。


    ![图 1.3：在 Web 浏览器中显示 index.html](img/2c298ca86478005a0a21c9796cebbd15_11_0.png)


    正如我们通过左侧的检查工具在浏览器中看到的，我们的消息正在 `div` 内部显示。


    ### 让我们分析 index.html 代码


    **添加 Vue.js 引用**


    代码包含了用于输入名字和姓氏的输入字段，以及一个问候消息，该消息使用了一个计算属性 `get_full_name()` 来显示组合后的姓名。


    我们使用了两个数据属性来保存用户的输入，并将它们与输入文本关联起来。


    - `first_name`

    - `last_name`


    Vue 对象中的方法 `get_full_name` 将两个变量连接起来，中间加上一个空格，并返回全名，该全名随后显示在屏幕上的问候消息中。我们使用了 `v-show`
    指令，这样当屏幕上没有指定名字和姓氏时，就不会渲染问候消息。


    它有效！！


    那么，这里的缺点是什么？


    这将是内存消耗大的。当我们调用这个方法来显示问候消息时，它会尝试创建完整的调用栈并为其分配内存。因此，每次我们对 `firstname` 或 `lastname`
    数据属性进行更改时，都会调用该方法，这导致每次实例化时都为同一个方法分配大量内存。


    想象一下这种情况：一个涉及更多计算和/或处理的方法会降低应用程序的性能，并消耗更多内存。


    ### 让我们来谈谈解决方案


    我们可以使用计算属性来解决这个问题。与上面的方法方式不同，计算属性会缓存结果。除非依赖的 v-model 发生变化，否则它不会刷新。


    ```html

    1  <!DOCTYPE html>

    2  <html>

    3      <head>

    4          <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

    5          <style>

    6              input[type=text]{

    7                  width: 50%;

    8                  height: 30px;

    9                  font-size: 20px;

    10             }

    11         </style>

    12     </head>

    13     <body>

    14         <div id="app_div">

    15             <input type="text" v-model="first_name" placeHolder="First name"/>
    <br>

    16             <input type="text" v-model="last_name" placeHolder="Last name"/>     <br><br/>

    17             <b v-show="full_name != ''''">Hello {{ full_name }} Greeting from
    Learn VueJS in 7 days.</b>

    18         </div>

    19         <script>

    20             var app = new Vue({

    21                 el: "#app_div",

    22                 data: {

    23                     first_name: '''',

    24                     last_name: '''',

    25                 },

    26                 computed: {

    27                     full_name : function(){

    28                         return this.first_name + '' '' + this.last_name;

    29                     },

    30                 }

    31             });

    32         </script>

    33     </body>

    34 </html>

    ```


    **图 3.2：使用计算属性的代码**


    现在我们已经重构了现有代码。我们主要做了两件事。


    1.  我们移除了 `methods` 属性并添加了 `computed` 属性。

    2.  与方法不同，在页面中使用计算属性时不需要括号。


    ### 为什么这是解决方案？


    计算属性是被缓存的。因此，当两个模型变量（即 `firstname` 和 `lastname`）首次获得输入时，计算属性会获取其值。此后，它会被缓存，直到模型变量获得新值。


    使用计算属性的优点如下：


    -   它被缓存。

    -   除非依赖的模型发生变化，否则值不会改变。

    -   可以从缓存中快速获取。

    -   比方法执行得更快。


    ### 计算属性与方法


    计算属性和方法之间最基本也是最大的区别在于它们被使用时的执行方式。换句话说，方法每次被调用时都会执行，而计算属性除非依赖项发生变化，否则会使用缓存。


    ### 让我们用时间戳值试试


    让我们创建一个方法和一个计算属性。它们每一个都应该返回当前时间戳，这样我们就可以标记值之间的差异。


    ![图 3.3：带时间戳的方法与计算属性的输出比较](img/2c298ca86478005a0a21c9796cebbd15_13_0.png)


    在上图中，我们展示了程序的输出。上面的是方法调用的结果，下面的是计算属性的结果。


    方法部分中的时间戳值有差异，尽管我们调用的是同一个方法。这意味着，同一个方法被反复调用以获取值。但在计算属性部分，值将始终与第一次调用时的值相同，因为它从缓存中获取值。在第一次调用时，生成的值（在这种情况下是当前时间戳）被存储在缓存中。后续调用时，该值仅从缓存中获取并显示，除非页面被刷新。刷新时，它会更改计算属性的值，因为此计算属性依赖于时间戳。


    多次刷新屏幕后，我们可以看到方法的值可能相同也可能不同，这取决于执行时间。但计算属性的值将始终相同。

    '
