    \                        this.liter = val/1000;\n                        this.mliter\
    \ = val;\n                    },\n                },\n            });\n      \
    \  </script> </body>\n</html>\n```\n\n# Watchers more in use\n\nIn the reactive\
    \ environment, watchers play a great role as it keeps watching the properties,\
    \ it can react as per the action defined.\n\nWatcher not only keeps watching the\
    \ property, it also keeps track of the old and new values of the attributes. It\
    \ caches the current value. Upon change, watcher returns the value as old value\
    \ and the changed value as the new value. Again caches the new value as the current\
    \ value.\n\nAs shown in the previous example, watchers get defined under the watch\
    \ hook of the vue object. As a thumb rule, the watcher names must be same as the\
    \ name of the attribute to be watched."
- md: "## Watchers\n\nWe have used a watch property here to capture the body temperature,\
    \ which is initialized to 98.6. User enters the current body temperature. Depending\
    \ upon the old and new values it will display the message.\n\n```javascript\n\
    watch: {\n    temperature: function(newValue, oldValue){\n        if(newValue\
    \ < oldValue){\n            this.temp_message = \"Your temperature is dropping.\"\
    ;\n        }\n        else if(newValue > oldValue){\n            this.temp_message\
    \ = \"Your temperature is rising.\";\n        }\n        else{\n            this.temp_message\
    \ = \"Your temperature is still unchanged.\";\n        }\n    }\n},\n```\n\nWe\
    \ have attached the watcher with the temperature model variable. If the newValue\
    \ of the temperature is less than the oldValue, then it will display the message\
    \ \"Your temperature is dropping\". The output message gets assigned to the temp_message\
    \ model variable.\n\nIf newValue is greater than the oldValue, then the message\
    \ would be \"Your temperature is rising\".\n\nIf they both remain same, then the\
    \ user would see the message as \"Your temperature is still unchanged\".\n\n###\
    \ How it works?\n\nUser enters the temperature value in the text box. As soon\
    \ as the value gets changed in the text box, it changes the value of the temperature\
    \ model variable. Since the watcher is applied on the temperature, it starts executing\
    \ the code block written in the watch.\n\n```html\n<!DOCTYPE html >\n<html>\n\
    \    <head>\n        <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    </head>\n    <body>\n        <div id=\"app_div\">\n          \
    \  <fieldset style=\"width: 50%; padding: 5%\">\n                <legend style=\"\
    font-weight: bold\">Temperature</legend>\n                <table>\n          \
    \          <tr>\n                        <td><h1>Enter your body temperature\n\
    \                        </h1></td>\n                    </tr>\n             \
    \       <tr>\n                        <td><input type=\"text\"\n             \
    \           v-model=\"temperature\"/> </td>\n                    </tr>\n     \
    \               <tr>\n                        <td><span>{{ temp_message }}</span></td>\n\
    \                    </tr>\n                </table>\n            </fieldset>\n\
    \        </div>\n        <script>\n            var app = new Vue({\n         \
    \       el: \"#app_div\",\n                data: {\n                    temperature:\
    \ 98.6,\n                    temp_message: \"\",\n                },\n       \
    \         watch: {\n                    temperature: function(newValue, oldValue){\n\
    \                        if(newValue < oldValue){\n                          \
    \  this.temp_message = \"Your temperature is dropping.\";\n                  \
    \      }\n                        else if(newValue > oldValue){\n            \
    \                this.temp_message = \"Your temperature is rising.\";\n      \
    \                  }\n                        else{\n                        \
    \    this.temp_message = \"Your temperature is still unchanged.\";\n         \
    \               }\n                    }\n                },\n            });\n\
    \        </script>\n    </body>\n</html>\n```\n\n### Watcher on computed property\n\
    \nComputed properties are also like other model attributes, which can hold values\
    \ with some extra computed capability. As discussed earlier, we can also do get\
    \ and set values in it.\n\nNow the obvious question we have, can we apply watcher\
    \ on the computed property? The answer is a big YES.\n\nLike other model attributes,\
    \ we can make watchers watch to the computed property as well. It can track the\
    \ changes in the computed property and behave as per the codes written in it.\n\
    \nWe will extend the same temperature meter. We will add Fahrenheit conversion\
    \ of the Celsius.\n\nWe have added a new computed property called ftemperature,\
    \ to calculate the Fahrenheit from the Celsius. Watcher will be added to the same\
    \ computed property to watch the changes in the values. As soon as the value in\
    \ the Celsius text box gets changed, it gets the computed property calculated\
    \ for the Fahrenheit. This change will get observed by the watcher and executes\
    \ the code written inside.\n\n```javascript\n<script>\n    var app = new Vue({\n\
    \        el: \"#app_div\",\n        data: {\n            temperature: 98.6,\n\
    \            temp_message: \"\",\n            f_message: \"\"\n        },\n  \
    \      computed: {\n            ftemperature: function(){\n                return\
    \ (this.temperature * 9/5) + 32;\n            }\n        },\n        watch: {\n\
    \            temperature: function(newValue, oldValue){\n                if(newValue\
    \ < oldValue){\n                    this.temp_message = \"Your temperature is\
    \ dropping.\";\n                }\n                else if(newValue > oldValue){\n\
    \                    this.temp_message = \"Your temperature is rising.\";\n  \
    \              }\n                else{\n                    this.temp_message\
    \ = \"Your temperature is still unchanged.\";\n                }\n           \
    \ },\n            ftemperature: function(newValue, oldValue){\n              \
    \  this.f_message = \"Temperature changed from \" + oldValue + \" fahrenheit to\
    \ \" + newValue + \" fahrenheit\";\n            }\n        }\n    });\n</script>\n\
    ```\n\nSo the change of the Celsius value will compute the Fahrenheit value and\
    \ get stored in the ftemperature.\n\nWith this change, it is obvious that, both\
    \ Celsius and Fahrenheit value will get the change effect. The same effect will\
    \ be watched by the watcher and the code block inside both the watch properties\
    \ i.e. temperature and ftemperature to display the message gets executed.\n\n\
    In this chapter, we have covered the computed property and the watchers. We discussed\
    \ how the computed properties work from caches which are different than a normal\
    \ method call. Method gets called on each call, whereas computed properties gets\
    \ called from the cache unless there is a change in the dependent model variables.\
    \ We have also seen the way to use get and set with the computed properties.\n\
    \nWe discussed VueJS watchers are also very useful tool to watch any property\
    \ to handle the live changes. Watchers also return the old and new values on change\
    \ of the value. We can also apply watchers on the computed properties as well.\n\
    \nIn the next chapter, we will discuss on the basics of VueJS components, registering\
    \ the components and defining the component properties. Components are the re-usable\
    \ entities supported by Vue.\n\n## DAY 4: Components\n\nIn the previous chapter,\
    \ we learnt the way to create computed property. We also explored the way to apply\
    \ get and set in the computed property. The comparison between method and computed\
    \ property helped us to know the advantages of the computed properties.\n\nWe\
    \ also made our hands dirty with the watchers. We also learnt getting the old\
    \ and current value of a control using the watcher.\n\nIn this chapter, we will\
    \ cover the basics of components. We will see, why we need a component, how we\
    \ can create, register and use a component. We will also define props with the\
    \ component to see how they really function.\n\n### Use controls repeatedly\n\n\
    We keep using inputs to get the user data from the user. Same kind of fields need\
    \ to be reused in many places in our project. Let’s consider an ecommerce application,\
    \ which uses the addresses in many place. We need addresses for contact, billing,\
    \ shipping, and so on.\n\nThe same user input controls need to use multiple times\
    \ in a repeated manner to collect the data. So, we need to copy and paste the\
    \ same set of inputs each time we need to collect the address data from the user.\n\
    \n```html\n<fieldset class=\"container\">\n    <legend>Contact address</legend>\n\
    \    <div class=\"row\">\n        <div class=\"col-2\">Address Line 1</div>\n\
    \        <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"\
    contact_address_line1\" /></div>\n    </div>\n    <div class=\"row\">\n      \
    \  <div class=\"col-2\">Address Line 2</div>\n        <div class=\"col-6\"><input\
    \ type=\"text\" class=\"full-width\" v-model=\"contact_address_line2\" /></div>\n\
    \    </div>\n    <div class=\"row\">\n        <div class=\"col-2\">City</div>\n\
    \        <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"\
    contact_city\" /></div>\n    </div>\n    <div class=\"row\">\n        <div class=\"\
    col-2\">State</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"contact_state\" /></div>\n    </div>\n    <div class=\"\
    row\">\n        <div class=\"col-2\">Pin code</div>\n        <div class=\"col-6\"\
    ><input type=\"text\" class=\"full-width\" v-model=\"contact_pincode\" /></div>\n\
    \    </div>\n</fieldset>\n<fieldset class=\"container\">\n    <legend>Shipping\
    \ address</legend>\n    <div class=\"row\">\n        <div class=\"col-2\">Address\
    \ Line 1</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    \ v-model=\"shipping_address_line1\" /></div>\n    </div>\n    <div class=\"row\"\
    >\n        <div class=\"col-2\">Address Line 2</div>\n        <div class=\"col-6\"\
    ><input type=\"text\" class=\"full-width\" v-model=\"shipping_address_line2\"\
    \ /></div>\n    </div>\n    <div class=\"row\">\n        <div class=\"col-2\"\
    >City</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    \ v-model=\"shipping_city\" /></div>\n    </div>\n    <div class=\"row\">\n  \
    \      <div class=\"col-2\">State</div>\n        <div class=\"col-6\"><input type=\"\
    text\" class=\"full-width\" v-model=\"shipping_state\" /></div>\n    </div>\n\
    \    <div class=\"row\">\n        <div class=\"col-2\">Pin code</div>\n      \
    \  <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"shipping_pincode\"\
    \ /></div>\n    </div>\n</fieldset>\n```\n\nNot only copy and paste the same control,\
    \ we also need to have repeated set of model variables for each of the controls.\
    \ As shown in the image, same address_line1 needs to be defined for the contact,\
    \ shipping, billing addresses, and so on. This creates a lot of repeated codes\
    \ and reduces the readability which puts the code maintenance in risk situation.\n\
    \n### How to avoid such situations?\n\nComponent is the answer here. We need to\
    \ have components to avoid these repetitions in code."
  mdcn: "\n## 侦听器\n\n我们在这里使用了一个 `watch` 属性来捕获体温，其初始值为 98.6。用户输入当前体温。系统将根据新旧值来显示相应的消息。\n\
    \n```javascript\nwatch: {\n    temperature: function(newValue, oldValue){\n  \
    \      if(newValue < oldValue){\n            this.temp_message = \"Your temperature\
    \ is dropping.\";\n        }\n        else if(newValue > oldValue){\n        \
    \    this.temp_message = \"Your temperature is rising.\";\n        }\n       \
    \ else{\n            this.temp_message = \"Your temperature is still unchanged.\"\
    ;\n        }\n    }\n},\n```\n\n我们将侦听器附加到 `temperature` 模型变量上。如果温度的新值小于旧值，则会显示消息“Your\
