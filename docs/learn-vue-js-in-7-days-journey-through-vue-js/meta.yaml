    DAY 5


    # Components in Depth


    In the previous chapter, we learnt the way to create the components. Reusability
    and maintainability is the key to use the components. It helps us segregating
    our work in multiple small pieces. We also explored the way to use components
    in another component. The passing mechanism also helped us to pass data between
    the components.


    In this chapter, we will dive deep into the components. We will visit deeper with
    the props. We will define the types, apply validations, and so on. Also, we will
    play more with the components and learn how slot is going to help us.


    # Diving in the props


    As we have discussed in our previous chapter, props are the ways to pass the data
    to and from the components. It helps data communication between the parent and
    children components.


    In this chapter, we will look more into the implementation of the prop validations.


    # Props type validation


    We can apply the validation on the props while defining them. The child component
    has the full rights to decide what to accept and what not. So, prop block can
    specify the type of the property.


    Let''s create a vue component, which will accept the numeric values only. Also,
    we can mark it as required. So that whenever the component tag gets used, it will
    be needing the property value.


    ```

    Number is {{ NumValue}}

    ```


    We have defined a property called NumValue and specified the type of value it
    accepts. In order to check, how it works, we need to pass the value into the component.


    We have passed the number value into the component and it is rendering correctly
    on the screen.'
