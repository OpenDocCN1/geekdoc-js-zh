    # DAY 1


    # Introduction


    In this chapter, we will go through an introduction of Vue.js. We will also go
    through the Vue ecosystem to setup the environment. We will also cover a brief
    description on the installation process, devtools and vue CLI for project scaffolding,
    and so on in this chapter.


    As we know, JavaScript is a scripting language being interpreted by the browser,
    with the help of embedded JavaScript engines such as V8, Rhino, and so on. V8
    is the most widely used JS engine in the modern web browsers. JavaScript plays
    a vital role in the world of web development by executing the user request in
    the client end and reducing the client-server request response roundtrip, which
    enhances the user experience and performance.


    Vue is a UI based framework built on top of JavaScript. It works on the UI layer
    of the web applications.


    # Before I start with Vue.js


    Since it is a JavaScript based framework, it mainly operates on the UI layer,
    it requires for the developers to know the basics of JavaScript, HTML, and CSS
    so that the user can implement Vue.js in the project to see it in action.


    In this book, we will keep using the Vue.js along with the normal JavaScript.


    # Vue.js


    Vue.js is an open source progressive JavaScript framework. It is originally invented
    by Evan You, one of the ex-Google employee. He has worked in MeteroJS project
    as well. Although graduated from Arts, he is in touch with development. He got
    a chance to work with Angular during his Google days. He then started working
    in his own project and the first Vue.js version was pushed to Git in February
    2014, which arguably seems to as an improvement over Angular.


    Vue.js has some key characteristics which make it popular and adoptable.'
- md: '## Light weight


    It is a lightweight JavaScript library which comes into action as soon as it’s
    added to the project. It mainly follows a ViewModel pattern to communicate with
    the view layer. The view layer is mainly designed with HTML and CSS.


    ## Progressive


    As mentioned earlier, it basically works on the View layer in the UI. It is implemented
    as an additional markup to the HTML UI by binding the template model with data
    model.


    ## Virtual DOM


    DOM is the abbreviation for Document Object Model. The HTML DOM in the browser
    we see has a tree-like structure. In order to make changes in the UI in the browser,
    we need to make changes to the DOM element by finding that from the DOM tree.
    Mostly we use `document.getElementById` to find the element. This is a memory-expensive
    process which makes the page perform slower.


    Virtual DOM is a technique to bind the DOM tree to the JavaScript object tree.
    The JavaScript object tree is not the actual DOM; it is a virtual representation
    of the HTML DOM on UI. So, any changes to any of the JavaScript object attribute
    nodes which bind with a DOM element will get reflected on screen UI. This would
    NOT be a memory-expensive way. The implementation of Virtual DOM in Vue is based
    on snabbdom ( https://github.com/snabbdom/snabbdom ).


    ## HTML based template


    Templates help in creating re-usable UI components. A Vue object allows defining
    the templates by using the HTML code within the object itself, which helps in
    creating the reusable components as well as it adds advancement to the existing
    HTML.


    ## Reactive view components


    Vue supports the two-way binding technique. The data model is bound to the template
    model which reflects on UI when changes are made to the data in the data model
    and vice versa.


    ## Single Page Application


    Single-page applications (SPA) are the kind of web application which basically
    renders and re-renders by dynamically writing contents in the same page rather
    than loading multiple pages for the contents depending upon the user actions.
    Vue can be used to develop SPA. It can also be used in multi-page applications
    as well.


    ## Let''s setup Vue.js


    We need to set up Vue now in order to use it in our project. So, before we proceed
    and install it in the project, let''s first check the number of ways we can add
    Vue.js to our project.


    ### Download and reference method


    As mentioned earlier, Vue is a lightweight JS library. This library can be directly
    downloaded and added to the project by using a `<script>` tag.


    This code is just to show how we can use the Vue.js library after NPM install.
    The bold line in the code indicates the Vue reference. We will traverse through
    the code in later topics. The Vue.js file referenced here is the development version
    of the Vue, so that the developer can get the warning and debug messages during
    the development. But before pushing this to the production, we need to change
    the reference to `vue.min.js`.


    ## Let''s put Vue into action


    We will start putting Vue into an HTML page and see the effect in the browser.
    We will use the CDN links to include Vue.js into the page.


    Let''s create a document and name it as `index.html`. In the `index.html`, we
    will add the following code to see Vue in action.


    ```

    {{ hello_msg }}

    ```


    Now, let''s view the `index.html` file in the browser.


    ![Figure 1.3: Showing index.html in the web browser](img/2c298ca86478005a0a21c9796cebbd15_11_0.png)


    As we can see in the browser through the inspection tool in the left, our message
    is getting displayed inside the `div`.


    ### Let''s analyze the index.html code


    **Add Vue.js reference**


    The code includes the first name and last name input fields and a greeting message
    that uses a computed property `get_full_name()` to display a combined name.


    We have taken two data properties to hold the user inputs and associated them
    with the input texts.


    - `first_name`

    - `last_name`


    The method `get_full_name` in the Vue object concatenates both the variables along
    with an additional space in between them and returns the full name, which gets
    printed on screen in the greet message. We have used `v-show` directive so that
    it won’t render the greeting message when there is no first name and last name
    specified on the screen.


    It works!!


    So, what are the drawbacks here?


    It would be memory-consuming. When we call this method to show the greeting message,
    it will try creating the full stack and allocate memory to it. So, each time we
    make changes in the `firstname` or `lastname` data attribute, it will call that
    method, which results in a lot of memory allocation to the same method for each
    instance.


    Imagine the scenario: a method involving more calculations and/or processing would
    lower down the performance of the app as well as consume more memory.


    ### Let''s talk about the solution


    We can use the computed property to address this problem. Unlike the method approach
    above, the computed property will cache the result. It won’t get refreshed unless
    the dependent v-models get changed.


    ```html

    1  <!DOCTYPE html>

    2  <html>

    3      <head>

    4          <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

    5          <style>

    6              input[type=text]{

    7                  width: 50%;

    8                  height: 30px;

    9                  font-size: 20px;

    10             }

    11         </style>

    12     </head>

    13     <body>

    14         <div id="app_div">

    15             <input type="text" v-model="first_name" placeHolder="First name"/>
    <br>

    16             <input type="text" v-model="last_name" placeHolder="Last name"/>     <br><br/>

    17             <b v-show="full_name != ''''">Hello {{ full_name }} Greeting from
    Learn VueJS in 7 days.</b>

    18         </div>

    19         <script>

    20             var app = new Vue({

    21                 el: "#app_div",

    22                 data: {

    23                     first_name: '''',

    24                     last_name: '''',

    25                 },

    26                 computed: {

    27                     full_name : function(){

    28                         return this.first_name + '' '' + this.last_name;

    29                     },

    30                 }

    31             });

    32         </script>

    33     </body>

    34 </html>

    ```


    **Figure 3.2: Code using computed property**


    Now we have refactored the existing code. Mainly we did two things.


    1.  We have removed the `methods` attribute and added the `computed` attribute.

    2.  We don''t need the parenthesis for using the computed attribute in the page
    unlike the method.


    ### How will this be the solution?


    Computed properties get cached. So, when for the first time both the model variables
    i.e. `firstname` and `lastname` get some input, the computed property gets its
    value. It gets cached after that until the model variables get a new value.


    The advantage of using the computed property is as follows:


    -   It gets cached.

    -   No changes to the value until the dependent models get changed.

    -   It is ready to use from the cache.

    -   Performs faster than the methods.


    ### Computed Property versus Method


    The basic and the biggest difference between the computed property and method
    is their execution upon usage. In other words, methods get executed each time
    they are called, whereas the computed property uses the cache unless the dependency
    gets changed.


    ### Let''s try with a timestamp value


    Let''s create a method and a computed property. Each of them should return the
    current timestamp so that we can mark the difference between the values.


    ![Figure 3.3: Output comparison between the method and computed property with
    timestamp](img/2c298ca86478005a0a21c9796cebbd15_13_0.png)


    In the above image, we have shown the output of our program. The top ones are
    the result from the method calls and the bottom ones are from the computed property.


    The timestamps in the method section have differences in the values, although
    we are calling the same method. That means, the same method is getting called
    again and again to get the value. But in the computed property section, values
    will always be the same as the value with the first call, as it fetches the value
    from the cache. In the first call, the generated value i.e. the current timestamp
    in this case, gets stored in the cache. Upon subsequent calls, the value only
    gets fetched and displayed from cache unless the page gets refreshed. On refresh,
    it changes the value of the computed property, as this computed property depends
    on the timestamp.


    With multiple refreshes of the screen, we can see the method values may be same
    or different, depending upon the execution time. But the computed property value
    will always be the same.'
