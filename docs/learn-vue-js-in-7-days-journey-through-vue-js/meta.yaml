  md: "```\n<!DOCTYPE html >\n<html>\n    <head>\n        <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    </head>\n    <body>\n        <div id=\"app_div\">\n          \
    \  <fieldset style=\"width: 20%; padding: 5%\">\n                <legend style=\"\
    font-weight: bold\">Liter conversion calculator</legend>\n                <table>\n\
    \                    <tr>\n                        <td><h1>Liter</h1></td>\n \
    \                       <td></td>\n                        <td><h1>Milliliter</h1></td>\n\
    \                    </tr>\n                    <tr>\n                       \
    \ <td><input type=\"text\" v-model=\"liter\"/></td>\n                        <td>\
    \ = </td>\n                        <td><input type=\"text\" v-model=\"mliter\"\
    /></td>\n                    </tr>\n                </table>\n            </fieldset>\n\
    \        </div>\n        <script>\n            var app = new Vue({\n         \
    \       el: \"#app_div\",\n                data: {\n                    liter:\
    \ 0,\n                    mliter: 0\n                },\n                watch:\
    \ {\n\n                    liter: function(val){\n                        this.liter\
    \ = val;\n                        this.mliter = val *1000;\n                 \
    \   },\n                    mliter: function(val){\n                        this.liter\
    \ = val/1000;\n                        this.mliter = val;\n                  \
    \  },\n                },\n            });\n        </script> </body>\n</html>\n\
    ```\n\n# Watchers more in use\n\nIn the reactive environment, watchers play a\
    \ great role as it keeps watching the properties, it can react as per the action\
    \ defined.\n\nWatcher not only keeps watching the property, it also keeps track\
    \ of the old and new values of the attributes. It caches the current value. Upon\
    \ change, watcher returns the value as old value and the changed value as the\
    \ new value. Again caches the new value as the current value.\n\nAs shown in the\
    \ previous example, watchers get defined under the watch hook of the vue object.\
    \ As a thumb rule, the watcher names must be same as the name of the attribute\
    \ to be watched."
