    \nFigure 7.12: Pictorial representation of Vuex\n\nNote: Facebook introduced Flux,\
    \ which is actually a design pattern. This design pattern supports one-way data\
    \ pipeline between four parts named as Action, Dispatcher, Store and View. Pictorial\
    \ representation would look like below:\n\nLet's start by creating the store (store.js)\
    \ using Vuex.\n\n```\nexport default new Vuex.Store({\n  state,\n  mutations,\n\
    \  actions,\n  getters\n});\n```\n\nIf you remember the important points in the\
    \ last section, Vuex uses the similar structure. Let's define one by one.\n\n\
    The State is nothing but the conttainer of data which will be shared within the\
