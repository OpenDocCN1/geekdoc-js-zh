  md: 'We discovered all the techniques to manage the state of application data. However,
    you can select any of these according to your requirements by analysing the pros
    and cons.


    # EventBus


    EventBus is very easy to set up and work, but comes with the disadvantage of no
    such possible way to keep track of the changes. As application grows with more
    components, it becomes difficult to know who is consuming the Bus to do what.


    # Global Store


    It is something centralized and easy to understand as well as implement. However,
    the concept does not have explicit definitions to for the store and state changes.


    # Vuex


    The most efficient way to manage state in Vue application. Also has integration
    with Vue dev tools. However, you need a little bit of understanding of Flux architecture.


    Remember that Vuex is not the only library who can manage state in Vue apps. There
    are other libraries who can do the job like redux-vue ( https://github.com/nadimtuhin/redux-vue
    ) and vuejs-redux ( https://github.com/titouancreach/vuejs-redux ) .


    ![](img/2c298ca86478005a0a21c9796cebbd15_80_0.png)


    In this chapter, we learnt few important advance concepts of Vue. Routes in Vue
    play an important role for loading the pages dynamically as we use it for Single
    Page Applications. We understood the concept of Routing and how to implement in
    a SPA.


    Different State Management principles is what we learnt next with appropriate
    examples. Data transfer between parent and child components can be done using
    props and custom events. However, when it comes to communicate between isolated
    components with zero coupling, then EventBus, Global Store and Vuex come into
    the picture.


    EventBus provides us an convinent way to implement publish and subscribe pattern
    for the custom events so that components can emit events which can be listened
    by any component with the help of EventBus object.


    Global Store is just an object which stores the data as well as the event responsible
    to update the data. The components can refer to this store object to either get
    the data ot update the data, thus managing the state.


    The most efficient way we discovered was Vuex which provides us well defined structure
    to build the store for Mutation, Actions and Getters. Vue dev tools has an inbuilt
    integration with Vuex for keeping track of the mutations.


    In the appendix section coming after this page, we will find differences with
    other frameworks in the market that would not only help you to compare the features
    but also guide you towards what best suits for you and your career. Some alternative
    ways to define templates is something we will also explore.


    # Appendix


    With Day-7 we have concluded the VueJS learning. We have travelled all the way
    from normal view page designing with Vuejs to the components design. We also learnt
    the way to create components, making them reusable, adding more feature and formats
    to them using the mixins, filters, and so on. Also, we have covered the routing
    and state management, which will help the readers as a steppingstone towards the
    Vuejs app development.


    In this topic, we will discuss the alternatives and possibilities using VueJs.
    None of the items would be cover in detail. Reader can choose to skip this topic.


    We will showcase an alternate way of template designing by using the render functions
    and JSX. At the end, we will see a quick comparison view of the frameworks with
    Vuejs.'
