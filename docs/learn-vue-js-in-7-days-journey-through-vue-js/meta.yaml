  md: 'Light weight


    It is light weight JavaScript library which comes into action, as soon as it’s
    added to the project. It mainly follows a ViewModel pattern to communicate with
    the view layer. The view layer is mainly designed with HTML and CSS.


    Progressive


    As mentioned earlier, it basically works on the View layer in the UI. It is implemented
    as an additional markup to the HTML UI by binding the template model with data
    model.


    Virtual DOM


    DOM is the abbreviation for Document Object Model. The HTML DOM in the browser
    we see, has a tree like structure. In order to make changes in the UI in the browser,
    we need to make changes to the DOM element by finding that from the DOM tree.
    Mostly we use document.getElementById to find the element. This is a memory expensive
    process which makes the page perform slower.


    Virtual DOM is a technique to bind the DOM tree to the JavaScript object tree.
    The JavaScript object tree is not the actual DOM, it is a virtual representation
    of the HTML DOM on UI. So, any changes to any of the JavaScript object attribute
    node which binds with a DOM element will get reflected on screen UI. This would
    NOT be a memory expensive way. Implementation of Virtual DOM in Vue, based on
    snabbdom ( https://github.com/snabbdom/snabbdom ) .


    HTML based template


    Template helps in creating re-usable UI components. Vue object allows defining
    the templates by using the HTML code within the object itself, which helps in
    creating the reusable components as well as it adds advancement to the existing
    HTML.


    Reactive view components


    Vue supports the two-way binding technique. The data model is bind to the template
    model which reflects on UI, when changes made to the data in the data model and
    vice versa.


    Single Page Application


    Single page applications (SPA) are the kind of web application which basically
    renders and re-renders by dynamically writing contents in the same page than loading
    multiple pages for the contents depending upon the user actions. Vue can be used
    to develop SPA. It can also be used in multi-page applications as well.


