    ## DAY 1


    ### Introduction


    In this chapter, we will go through an introduction of Vue.js. We will also go
    through the Vue ecosystem to setup the environment. We will also cover a brief
    description on the installation process, devtools and vue CLI for project scaffolding,
    and so on in this chapter.


    As we know, JavaScript is a scripting language being interpreted by the browser,
    with the help of embedded JavaScript engines such as V8, Rhino, and so on. V8
    is the most widely used JS engine in the modern web browsers. JavaScript plays
    a vital role in the world of web development by executing the user request in
    the client end and reducing the client-server request response roundtrip, which
    enhances the user experience and performance.


    Vue is a UI based framework built on top of JavaScript. It works on the UI layer
    of the web applications.


    ### Before I start with Vue.js


    Since it is a JavaScript based framework, it mainly operates on the UI layer,
    it requires for the developers to know the basics of JavaScript, HTML, and CSS
    so that the user can implement Vue.js in the project to see it in action.


    In this book, we will keep using the Vue.js along with the normal JavaScript.


    ### Vue.js


    Vue.js is an open source progressive JavaScript framework. It is originally invented
    by Evan You, one of the ex-Google employee. He has worked in MeteroJS project
    as well. Although graduated from Arts, he is in touch with development. He got
    a chance to work with Angular during his Google days. He then started working
    in his own project and the first Vue.js version was pushed to Git in February
    2014, which arguably seems to as an improvement over Angular.


    Vue.js has some key characteristics which make it popular and adoptable.'
