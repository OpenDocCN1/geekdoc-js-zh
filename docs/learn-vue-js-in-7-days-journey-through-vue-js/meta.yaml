    Delhi-110002 and Printed at Repro India Ltd, Mumbai


    ## About the Authors


    ## Nirmal Hota


    He is a software developer and mentor. He loves to learn and work in different
    technologies. He has worked in various Microsoft Technologies such as C#, VB,
    ASP.net, Dynamics CRM, Commerce server and so on. Also worth mentioning his expertise
    in open source and mobile application technologies like Ruby on Rails, Phonegap,
    Titanium, Xamarin and so on. He loves to explore different Javascript based platforms
    including Angular, React and Vue.


    He is also a Microsoft Certified Technology Specialist (MCTS) in Asp.Net and Dynamics
    CRM. In addition to that, he has also a Titanium Certified Application Developer
    (TCAD) and an Agile Scrum Master too.


    Apart from developing software, he spends his time in tech community activities,
    blogging and creating screencast videos also. For his tech blogging activities
    and writing skills DZone has also recognised him as a Most Valuable Blogger. Utkal
    Techies Forum (UTF) and TechBhubaneswar are among two leading technical community
    in Odisha, India. In those communities, Nirmal is very much involved as a core
    group member. He also does a lot of tech speaking in various technologies in various
    conferences, schools, colleges and universities within India and abroad. India
    mentor has also featured him on their website to recognise his activity towards
    mentoring the community.


    His Linkedin:

    linkedin.com/in/nirmalhota


    His Websites

    nirmalhota.com


    ## Tadit Dash


    He is a software engineer by profession. As a software engineer, he usually works
    for eight to nine hours daily. Besides his daily work, he contributes to both
    online and offline communities. He co-founded the first Technical Community in
    his state named Utkal Techies Forum Odisha, which is devoted to spreading awareness
    of the newest trends in technology among techies.


    He writes articles and blogs, and creates demos and videos for fellow programmers.
    Answering questions on online forums and social channels is the activity he enjoys
    the most.


    Due to his exceptional contribution to the technical community, Microsoft has
    awarded him with the Microsoft Most Valuable Professional accolade from 2014 till
    2018. CodeProject has awarded him the CodeProject MVP accolade (the first from
    Odisha and three times in a row for the years 2014, 2015, and 2016). For his constant
    mentorship, IndiaMentor featured him as a Young Mentor on their site.


    He was recognized by DZone and awarded the Most Valuable Blogger accolade.

    Motivating students in his sessions is something he is popular for. He is a regular
    technical and motivational speaker. He has spoken in many local events organized
    by different communities. He was a featured speaker in DevTechDay Nepal.


    The following two books he co-authored got Bestseller ranks on Amazon and were
    featured on Book Authority''s “Best ASP.NET Books of All Time”.


    - Dependency Injection in .NET Core 2.0

    - Building RESTful Web services using .NET Core


    You can reach him on Facebook, Twitter and Instagram at @taditdash.


    His Linkedin:

    linkedin.com/in/taditdash

    His Websites

    taditdash.wordpress.com

    taditdash.co.in


    ## Dr. Vishal Jain


    He is currently working as Associate Professor with Bharati Vidyapeeth''s Institute
    of Computer Applications and Management (BVICAM), New Delhi Affiliated to GGSIPU
    and Accredited by AICTE, since July, 2017 to till date. Dr. Vishal Jain has completed
    Ph.D (Computer Science and Engineering) from Lingaya''s University, Faridabad,
    Haryana, M.Tech (Computer Science and Engineering) from University School of Information
    Technology (USIT), Guru Gobind Singh Indraprastha University, MBA (HR) from Shobhit
    University, Meerut, MCA from Sikkim Manipal University, Sikkim. In additional
    qualification he has obtained DOEACC ''A'' Level and DOEACC ''O'' Level, Post
    Graduate Diploma in Computer Software Training from A.M Informatics, Advance Diploma
    in Computer Software Training from ET&T, Delhi, Diploma in Business Management
    from All India Institute of Management Studies, Chennai, Diploma in Programming
    from Oxford Computer Education, Delhi, Microsoft Certified Professional Cleared
    Two Modules 070-210, 070-215 (MCP) and Cisco Certified Network Administrator (CCNA).
    He has received Young Active Member award for the year 2012 – 13 from Computer
    Society of India. Dr. Vishal Jain has worked as a Delhi State Students'' Coordinator,
    Delhi Chapter, Computer Society of India (2014 – 2016). His research area includes
    Semantic Web, Ontology Engineering, Cloud Computing, Big Data Analytics and Adhoc
    Networks.


    His Linkedin:


    linkedin.com/in/vishaljain83


    His Website


    vishaljain.webs.com


    ## Acknowledgements


    This book is a reality today because of the blessing and encouragement of my parents
    (Mr. Niranjan Hota and Mrs. Bishnupriya Hota). Spending time to write a book after
    a full day of office work was a big challenge and my family around me kept me
    motivated continuously to achieve the same.


    I am very much thankful to my Wife (Subhshree Hota), my brother (Nikhil Hota),
    my sisters (Silu and Milu), my brother in laws (Dilip and Shakti) and loving kids
    (Gagu, Tatu and Kitu) for the love and support.


    My heartiest thanks and respect to Mr. Santanu Mohapatra, my guru, who has enlightened
    the spark of knowledge in me. I am also thankful to Mr. Gaurav Aroraa, the renowned
    author and mentor, for his uncountable support and love towards me. Also my thanks
    and respect to Dr. Vishal Jain, the co-author of this book for his guidance during
    this period.


    Thank you Mr Tadit Dash, co-author, colleague and my little bro, for pulling up
    the best out of me. I would also like to thank Suvendu Sekhar Giri, Surya Narayan
    Barik, Pravasini Sahu, Suraj Sahu, Ramesh Barik, Sourav Nanda, and UTF for helping
    me to explore myself.


    Thank you very much to my colleagues, Mr. Kiran Kumar Singh and Debendra Nandi
    for teaching me various approaches to deal with challenges. Finally a huge thanks
    to BPB publications for making all these into reality.


    – Nirmal Hota


    I would like to dedicate this book to my grand father late Ganeswar Tripathy.


    My grandmother Santipriya Tripathy, father Dr. Gobinda Chandra Dash, mother Mrs.
    Sasmita Tripathy and brother Tworit Dash made sure that I am high on energy (with
    healthy food) and confidence all the time during the writing. My uncles Mr. Anil
    Tripathy, Mr. Aswin Tripathy and Mr. Amiya Tripathy always guide me to shape the
    approach to my new challenges. Mrs. Sujata Tripathy, who takes care of me like
    my mother and Mr. Debendra Rath, my uncle never miss any opportunity to discuss
    ideas to strengthen my thoughts so that I deliver the best.'
