    \ unnecessary updates by comparing the binding's current and old values (see below\
    \ on hook arguments).\n- **componentUpdate**: Called after the containing component's\
    \ VNode and the VNodes of its children have updated.\n- **unbind**: Called only\
    \ once, when the directive is unbound from the element.\n\nThe most popular hooks\
    \ are bind and inserted.\n\n```\nVue.directive(\"custom-hook\", {\n\n    bind(el)\
    \ {\n\n        el.style.color = \"red\";\n```"
