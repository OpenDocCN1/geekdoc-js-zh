    ## Scoped Slot


    Sometimes we may need to deal with the situations, where the objects need to be
    passed from child to parent to inject the slot content.


    Let''s take an example, where the parent slot needs to inject a country capital
    into the slot content of the child. This is quite easy, if the country object
    is present in the parent. But if the object is in the child end, and we need to
    push the content from the parent.


    ```

    <slot v-bind:country="country">

    </slot>

    ```


    We need to use the `v-bind` technique here to send the object from child to parent
    component.


    The country object is bound to the slot with `v-bind`. This is called Slot Props.
    Slot props can now be accessed in the parent end along with same values.


    ```

    {{ childslotprop.country.capital }}

    ```


    We have used the slot prop attribute to receive the country object from the child.
    We can use any variable as the slot prop to receive the slot object.


    If the value from parent needs to be pushed into only one slot, then we may follow
    the abbreviated approach as follows.


    ```

    <ScopedSlot v-slot="childslotprop"> {{ childslotprop.country.capital }} </ScopedSlot>

    ```


    Consider there are multiple slots that need the value to be pushed, we may also
    follow the template approach.


    We have defined two named slots and a default slot to get the content from the
    parent. In the default slot, we have passed the country object using `v-bind`.


    Parent will push the content into the header and footer slots using the named
    slots and the default slot will get the values using the slot props.


