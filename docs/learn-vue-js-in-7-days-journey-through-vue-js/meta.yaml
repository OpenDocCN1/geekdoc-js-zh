    \        font-size: larger;\n    }\n</style>\n```\n\n### 处理父组件中的子组件事件\n\n到目前为止，我们已经看到了数据是如何从子组件传递到父组件以及反向传递的。但数据传递并非故事的全部。在现实世界中，我们还必须在父组件中处理子组件事件。\n\
    \n要将事件从子组件传递到父组件，我们需要使用定义的关键字 $emit。顾名思义，它将事件从子组件发出到父组件。父组件必须在其端处理该事件以产生效果。\n\n\
    让我们创建另一个 vue 组件并命名为 AddressWithPinCheck.vue。我们将在这里添加一个邮政编码输入框，以便它接受用户输入的邮政编码。此外，我们还将添加一个按钮。点击该按钮时，它将验证邮政编码。\n\
    \n```html\n<fieldset class=\"container\">\n    <div class=\"row\">\n        <div\
    \ class=\"col-2\">Pin Code</div>\n        <div class=\"col-6\">\n            <input\
    \ type=\"text\" class=\"full-width\" v-model=\"pin_code\"/>\n            <button\
    \ v-on:click= \"$emit('validate_pin', pin_code)\">Validate</button>\n        </div>\n\
    \    </div>\n</fieldset>\n...\n```\n\n**图 4.30：使用 $emit 验证邮政编码**\n\n除了 \"$emit('validate_pin',\
    \ pin_code)\" 语句外，其他一切看起来都很熟悉。这条语句向父组件发出 validate_pin 事件。现在，父组件必须处理该事件才能得到预期结果。\n\
    \n在这种情况下，这个组件发出 validate_pin 事件，父组件将实现来显示消息。\n"
