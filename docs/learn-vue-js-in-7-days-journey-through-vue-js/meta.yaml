    ![](img/2c298ca86478005a0a21c9796cebbd15_25_1.png)


    In this chapter, we have covered the computed property and the watchers. We discussed
    how the computed properties work from caches which are different than a normal
    method call. Method gets called on each call, whereas computed properties gets
    called from the cache unless there is a change in the dependent model variables.
    We have also seen the way to use get and set with the computed properties.


    We discussed VueJS watchers are also very useful tool to watch any property to
    handle the live changes. Watchers also return the old and new values on change
    of the value. We can also apply watchers on the computed properties as well.


    In the next chapter, we will discuss on the basics of VueJS components, registering
    the components and defining the component properties. Components are the re-usable
    entities supported by Vue.


    DAY 4


    Components


    In the previous chapter, we learnt the way to create computed property. We also
    explored the way to apply get and set in the computed property. The comparison
    between method and computed property helped us to know the advantages of the computed
    properties.


    We also made our hands our dirty with the watchers. We also learnt getting the
    old and current value of a control using the watcher.


    In this chapter, we will cover the basics of components. We will see, why we need
    a component, how we can create, register and use a component. We will also define
    props with the component to see how they really function.


    Use controls repeatedly


    We keep using inputs to get the user data from the user. Same kind of fields need
    to be reused in many places in our project. Let’s consider an ecommerce application,
    which uses the addresses in many place. We need addresses for contact, billing,
    shipping, and so on.'
