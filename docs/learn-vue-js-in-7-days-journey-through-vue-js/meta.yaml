    \            this.temp_message = \"Your temperature is still unchanged.\";\n \
    \                       }\n                    }\n                },\n       \
    \     });\n        </script>\n    </body>\n</html>\n```\n\n### 在计算属性上应用侦听器\n\n\
    计算属性也像其他模型属性一样，可以存储值，并具备一些额外的计算能力。正如之前讨论的，我们也可以在其中获取和设置值。\n\n现在一个显而易见的问题是：我们可以在计算属性上应用侦听器吗？答案是肯定的。\n\
    \n像其他模型属性一样，我们也可以让侦听器监视计算属性。它可以跟踪计算属性中的变化，并根据其中编写的代码进行响应。\n\n我们将扩展同一个温度计示例，添加将摄氏度转换为华氏度的功能。\n\
    \n我们添加了一个名为 `ftemperature` 的新计算属性，用于根据摄氏度计算华氏度。我们将为这个计算属性添加侦听器，以监视值的变化。一旦摄氏度文本框中的值发生变化，就会计算出华氏度的计算属性。侦听器将观察到这个变化，并执行其内部编写的代码。\n\
    \n```javascript\n<script>\n    var app = new Vue({\n        el: \"#app_div\",\n\
    \        data: {\n            temperature: 98.6,\n            temp_message: \"\
    \",\n            f_message: \"\"\n        },\n        computed: {\n          \
    \  ftemperature: function(){\n                return (this.temperature * 9/5)\
    \ + 32;\n            }\n        },\n        watch: {\n            temperature:\
    \ function(newValue, oldValue){\n                if(newValue < oldValue){\n  \
    \                  this.temp_message = \"Your temperature is dropping.\";\n  \
    \              }\n                else if(newValue > oldValue){\n            \
    \        this.temp_message = \"Your temperature is rising.\";\n              \
    \  }\n                else{\n                    this.temp_message = \"Your temperature\
    \ is still unchanged.\";\n                }\n            },\n            ftemperature:\
    \ function(newValue, oldValue){\n                this.f_message = \"Temperature\
    \ changed from \" + oldValue + \" fahrenheit to \" + newValue + \" fahrenheit\"\
    ;\n            }\n        }\n    });\n</script>\n```\n\n因此，摄氏值的变化将计算出华氏值，并存储在\
    \ `ftemperature` 中。\n\n有了这个变化，很明显，摄氏度和华氏度值都会受到变化的影响。侦听器将监视到这种效果，并执行两个 `watch`\
    \ 属性（即 `temperature` 和 `ftemperature`）内部的代码块，以显示消息。\n\n在本章中，我们涵盖了计算属性和侦听器。我们讨论了计算属性如何从缓存中工作，这与普通方法调用不同。方法在每次调用时都会执行，而计算属性从缓存中获取值，除非依赖的模型变量发生了变化。我们还了解了如何在计算属性中使用\
    \ `get` 和 `set`。\n\n我们讨论了 VueJS 的侦听器，它也是非常有用的工具，可以监视任何属性以处理实时变化。侦听器在值发生变化时也会返回新旧值。我们也可以在计算属性上应用侦听器。\n\
    \n在下一章中，我们将讨论 VueJS 组件的基础知识，包括注册组件和定义组件属性。组件是 Vue 支持的可重用实体。\n\n## 第四天：组件\n\n在上一章中，我们学习了创建计算属性的方法。我们还探索了如何在计算属性中应用\
    \ `get` 和 `set`。方法与计算属性的比较帮助我们了解了计算属性的优势。\n\n我们还实践了侦听器。我们学习了如何使用侦听器获取控件的新旧值。\n\
    \n在本章中，我们将涵盖组件的基础知识。我们将了解为什么需要组件，如何创建、注册和使用组件。我们还将定义组件的 props，以了解它们实际是如何工作的。\n\
    \n### 重复使用控件\n\n我们一直使用输入控件从用户那里获取数据。同类字段需要在项目中的许多地方重复使用。以一个电子商务应用程序为例，它需要在多个地方使用地址。我们需要用于联系、账单、收货等地址。\n\
    \n相同用户输入控件需要以重复的方式多次使用来收集数据。因此，每次我们需要从用户那里收集地址数据时，都需要复制并粘贴相同的一组输入控件。\n\n```html\n\
    <fieldset class=\"container\">\n    <legend>Contact address</legend>\n    <div\
