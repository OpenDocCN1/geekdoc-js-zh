    \ () {\n\n      alert(\"Learn Vue In 7 Days\")\n\n    }\n\n  }\n\n})\n```\n\n\
    We have added a method named as showAppInfo, to show the application information.\
    \ This should be globally accessible to all the components.\n\n# Custom Directives\n\
    \nWe have learnt many directives in Vue having v- as a prefix. Directives like\
    \ v-model, v-if, and so on. we have learnt are the supported directives by Vue.\n\
    \nNow, let's create our own custom directives. As the name suggests, the custom\
    \ directives will behave in a custom way.\n\n# Creating custom directives\n\n\
    To create the custom directive, we need to use the Vue object. Directives will\
    \ be added to the Vue object of the application.\n\n```\nVue.directive('campaign\
    \ name',\n\n  function(el, binding, vnode) {\n\n})\n```\n\nIn the function, it\
    \ accepts the following parameters to deal with the user and data.\n\nel : This\
    \ stands for element. It returns the DOM object with which the directive is associated\
    \ with.\n\nbinding : It contains the information about the params, formatters,\
    \ and so on.\n\nvnode : vnode keeps the track of the parent DOM element.\n\nLet's\
    \ create our first custom directives. We are using the Vue CLI environment to\
    \ write the code. We will add the directive to main.js and keep accessing them.\n\
    \n```\nVue.directive('highlight',\n\n  function(el, binding, vnode) {\n\n    el.style.fontSize\
    \ = '50px';\n\n    el.style.fontWeight = 'bold';\n\n  }\n\n)\n```\n\nAs shown\
    \ in the above code, we have created a new custom directive as highlight . It\
    \ will set the font size and the font weight of the DOM element it will get bind\
    \ to.\n\n# Custom directive demo"
  - "[PAGE 53]\n\nThe highlight directive will be used in the HTML element with a\
    \ v- prefix. Here, we have added the custom directive to the DOM element. So that\
    \ the formatting will be applied to that element now.\n\n# Custom directive demo\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_53_0.png)\n\nFigure 6.2: Browser console\
    \ showing custom directive added to the element\n\nWhen gets rendered on screen,\
    \ the directives apply the changes on the DOM element in runtime.\n\n# Passing\
    \ values to custom directives\n\nIn the previous example, we have created the\
    \ custom directive, which accepts no value from the external source. It sets the\
    \ fixed formatting to the HTML element. We can also pass values into the custom\
    \ directives. Based on those passed values, custom directives can also apply formatting.\n\
    \n```\nVue.directive('notify',\n\n    function(el, binding, vnode) {\n\n     \
    \   var colour = (binding.value != undefined && binding.\n\n        value != \"\
    \") ? binding.value : \"red\";\n\n        el.style.fontSize = '15px';\n\n    \
    \    el.style.fontWeight = 'bold';\n\n        el.style.color = colour;\n\n   \
    \     el.style.backgroundColor='#ffcccc';\n\n    }\n\n)\n\n```\n\nIn the code\
    \ above, we have created a custom directive named as notify . We can pass values\
    \ from outside to set the formatting of the DOM element.\n\nIn this example, we\
    \ have applied the fixed formatting to the DOM element excluding the color. Then\
    \ color receives the dynamic values from the user. The default color set here\
