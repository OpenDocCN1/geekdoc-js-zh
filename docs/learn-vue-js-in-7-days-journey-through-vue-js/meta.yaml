    \     width: 100%;\n        height: 41px;\n        font-size: larger;\n    }\n\
    </style>\n```\n\n# Handle child component event in parent\n\nTill now, we can\
    \ see how the data is being passed from child component to the parent component\
    \ and vice versa. But the data passing is not the end of the story. In a real\
    \ world we must need to handle the child events in the parent too.\n\nTo pass\
    \ the event from child to parent, we need to use the defined key word $emit .\
    \ As the name suggests, it emits the event from child to parent. Parent must handle\
    \ the event in its end to mark the effect.\n\nLet’s create another vue component\
    \ and name it as AddressWithPinCheck .vue. We will add the pin code input here,\
    \ so that it will accept the pin code from the user. In addition to that, we will\
    \ add a button. On click of the button, it will validate the pin code.\n\n```\n\
    <fieldset class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
    col-2\">Pin Code</div>\n        <div class=\"col-6\">\n            <input type=\"\
    text\" class=\"full-width\" v-model=\"pin_code\"/>\n            <button v-on:click=\
    \ \"$emit('validate_pin', pin_code)\">Validate</button>\n        </div>\n    </div>\n\
    </fieldset>\n...\n```\n\nFigure 4.30: Using $emit to validate pincode\n\nEverything\
    \ looks familiar to us, apart from \"$emit('validatepin', pincode)\" statement.\
    \ This statement emits the validate_pin event to parent. Now, parent has to handle\
    \ the event in order to get the desired result.\n\nIn this case, this component\
    \ emits the validate_pin and the parent will implement to show the message."
- md: "```vue\n<template>\n  <div id=\"app\">\n    <img alt=\"Vue logo\" src=\"./assets/logo.png\"\
    >\n    <AddressWithPinCheck v-on:validate_pin=\"validate_pin\"></AddressWithPinCheck>\n\
    \  </div>\n</template>\n\n<script>\nimport AddressWithPinCheck from './components/AddressWithPinCheck.vue'\n\
    \nexport default {\n  name: 'app',\n  components: {\n    AddressWithPinCheck,\n\
    \  },\n  methods: {\n    validate_pin: function(pinCode){\n      var pat1=/^\\\
    d{6}$/;\n      if(pinCode!=\"\"){\n        if(pat1.test(pinCode)){\n         \
    \ alert(pinCode + \" is a valid pincode.\");\n        }\n        else{\n     \
    \     alert(pinCode + \" is invalid. Please check again.\");\n        }\n    \
    \  }\n      else{\n        alert(\"Pincode should not be blank\");\n      }\n\
    \    }\n  }\n}\n</script>\n\n<style>\n#app {\n  font-family: 'Avenir', Helvetica,\
    \ Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing:\
    \ grayscale;\n  text-align: center;\n  color: #2c3e50;\n  margin-top: 60px;\n\
    \  max-width: 40%;\n}\n</style>\n```\n\nIn the above code, we have noticed two\
    \ things. One is, the way component tag is used and the other one is how the event\
    \ is handled.\n\nIn this statement, we are using the component and along with\
    \ the component user is handling the event emitted by the component. `validatepin`\
    \ is the event emitted by the component, which is in `v-on`. To make this event\
    \ work, we have defined a custom method `validatepin`. This event name must not\
    \ be the same as the event name. We can take any custom name.\n\n![img/2c298ca86478005a0a21c9796cebbd15_37_0.png](img/2c298ca86478005a0a21c9796cebbd15_37_0.png)\n\
    \nWe have learned the basics of a component. The reusability is the key to use\
    \ the component. It helps us to reduce the writing of same code repeatedly. We\
    \ can define properties of components to accept data from the page as well as\
    \ parent component. We also learnt how the validation and type can be mentioned\
    \ for the properties, so that properties get the valid values as per the spec\
    \ defined. Also, the string template is better to replace with the `.vue` files,\
    \ which would help in writing better managed HTML codes. Event can be handled\
    \ in parent which is emitted from children and data can be passed through it.\
    \ `$emit` is the key to expose event from child to parent.\n\nIn the next chapter,\
    \ we will learn how to work more with the components. We will also learn how to\
    \ establish the communication back from child component to the parent components.\
    \ We will see how we can create and use the custom events. We will also learn\
    \ the dynamic components, async components, and so on. In this chapter, we will\
    \ also cover the slot and how useful they are.\n\nDAY 5\n\n## Components in Depth\n\
    \nIn the previous chapter, we learnt the way to create the components. Reusability\
    \ and maintainability is the key to use the components. It helps us segregating\
    \ our work in multiple small pieces. We also explored the way to use components\
    \ in another component. The passing mechanism also helped us to pass data between\
    \ the components.\n\nIn this chapter, we will dive deep into the components. We\
    \ will visit deeper with the props. We will define the types, apply validations,\
    \ and so on. Also, we will play more with the components and learn how slot is\
    \ going to help us.\n\n## Diving in the props\n\nAs we have discussed in our previous\
    \ chapter, props are the ways to pass the data to and from the components. It\
    \ helps data communication between the parent and children components.\n\nIn this\
    \ chapter, we will look more into the implementation of the prop validations.\n\
    \n## Props type validation\n\nWe can apply the validation on the props while defining\
    \ them. The child component has the full rights to decide what to accept and what\
    \ not. So, prop block can specify the type of the property.\n\nLet's create a\
    \ vue component, which will accept the numeric values only. Also, we can mark\
    \ it as required. So that whenever the component tag gets used, it will be needing\
    \ the property value.\n\n```\nNumber is {{ NumValue}}\n```\n\nWe have defined\
    \ a property called `NumValue` and specified the type of value it accepts. In\
    \ order to check how it works, we need to pass the value into the component.\n\
    \nWe have passed the number value into the component and it is rendering correctly\
    \ on the screen.\n\n![img/2c298ca86478005a0a21c9796cebbd15_39_0.png](img/2c298ca86478005a0a21c9796cebbd15_39_0.png)\n\
    \n![img/2c298ca86478005a0a21c9796cebbd15_39_1.png](img/2c298ca86478005a0a21c9796cebbd15_39_1.png)\n\
    \nFigure 5.1: Displaying the numeric value passed to prop\n\nWe can do a little\
    \ experiment by adding the string value instead of the number. Let's add a string\
    \ instead of a number in the `NumValue` prop of the tag.\n\n```\n<!-- Code block\
    \ (empty or minimal in source) -->\n```\n\nIf we switch back to the browser screen,\
    \ although it is rendered on screen but there must be an error in console. Now,\
    \ let's notice the console in dev tools. The console clearly displays the error\
    \ there.\n\n![img/2c298ca86478005a0a21c9796cebbd15_39_2.png](img/2c298ca86478005a0a21c9796cebbd15_39_2.png)\n\
    \nFigure 5.2: Error when non-numeric values passed\n\nThe error clearly says that\
    \ the value is invalid. So, we can conclude from the above experiment that the\
    \ values get accepted as per the type defined. It gets resolved, if we change\
    \ the prop value from `String` to `Number`.\n\nThe default value for the prop\
    \ is `Any`. Not setting any type OR setting the type to `null` would accept any\
    \ type of data.\n\nSupported types in a property are:\n\n### Passing an Array\
    \ to property\n\nLike `String`, `Number`, and `Boolean` we can also pass arrays\
    \ to the properties. We will pass a static array to the component and iterate\
    \ through it to print the elements on screen.\n\nAlthough, we pass static array\
    \ but we will use `v-bind`. So that browser treats it is as JavaScript expression\
    \ than a string.\n\n```vue\n<template>\n  <ul>\n    <li v-for=\"alphabet in alphabets\"\
    \ :key=\"alphabet\">{{ alphabet }}</li>\n  </ul>\n</template>\n\n<script>\nexport\
    \ default {\n  props: {\n    alphabets: {\n      type: Array,\n      required:\
    \ true\n    }\n  }\n}\n</script>\n```\n\nIn this component code snippet, we can\
    \ see the `alphabets` prop. We are using the type here as the `Array`. We will\
    \ iterate in the same array to display the array element in the `li` tag.\n\n\
    The following code snippet demonstrates how we can create the array and pass the\
    \ same to the component property:\n\n```vue\n<template>\n  <div>\n    <ul>\n \
    \     <li v-for=\"alphabet in alphabets\" :key=\"alphabet\">{{ alphabet }}</li>\n\
    \    </ul>\n  </div>\n</template>\n\n<script>\nexport default {\n  props: {\n\
    \    alphabets: {\n      type: Array,\n      required: true\n    }\n  }\n}\n</script>\n\
    ```\n\n### Passing Object to property\n\nWe can also pass objects to the properties.\
    \ We have seen in this chapter, we can pass string, number, Boolean and arrays.\
    \ We can also pass the object into the property so that they can be processed\
    \ by the component.\n\n```vue\n<template>\n  <div>\n    <div><strong>Country :\
    \ {{ countryDetails.name }}</strong></div>\n    <div>Capital City : {{ countryDetails.capital_name\
    \ }}</div>\n    <div>Population : {{ countryDetails.population }}</div>\n    <div>Dialing\
    \ code : {{ countryDetails.dialing_code }}</div>\n  </div>\n</template>\n\n<script>\n\
    export default {\n  props: {\n    countryDetails: {\n      type: Object,\n   \
    \   required: true\n    }\n  }\n}\n</script>\n```\n\nAs shown in the above code\
    \ snippet, we have mentioned the type of the prop as `Object`. So, whenever we\
    \ consume the properties, we need to pass the object type value.\n\nWe have created\
    \ a JSON object containing the attributes and passed into the property. The component\
    \ is implemented in a way to extract the values from the object and print that\
    \ on screen.\n\n### Property with multiple types\n\nOne property can be of multiple\
    \ types as well. Let's take an example property. Set `String` and `Number` as\
    \ type assignments to it.\n\n```vue\n<template>\n  <div>My Value is : {{ MyValue\
    \ }}</div>\n</template>\n\n<script>\nexport default {\n  props: {\n    MyValue:\
    \ {\n      type: [String, Number]\n    }\n  }\n}\n</script>\n```\n\nNow, let's\
    \ validate three use cases here. First, we will assign a `Number` and check, if\
    \ any error. We will check in the inspect window console. No errors! working fine.\n\
    \nNow, let's assign a string value to ensure it is causing no errors in the console.\n\
    \nSo, all the above works fine without any error. Let's check if really the multi\
    \ type works? We will assign an object now. Then we will watch out the console\
    \ to see, if any error.\n\nAlthough we can see the output on screen, let's check\
    \ the console window. It has the warning there.\n\n![img/2c298ca86478005a0a21c9796cebbd15_41_0.png](img/2c298ca86478005a0a21c9796cebbd15_41_0.png)\n\
    \nFigure 5.3: Browser console error showing the prop type check failed\n\nThe\
    \ warning clearly says, it expects the `Number` or `String` but, got an object.\n\
    \n## Making the property mandatory\n\nTo make the property mandatory with the\
    \ component, we can add an additional attribute called `required`.\n\n```vue\n\
    <template>\n  <div>Number is {{ NumValue }}</div>\n</template>\n\n<script>\nexport\
    \ default {\n  props: {\n    NumValue: {\n      type: Number,\n      required:\
    \ true\n    }\n  }\n}\n</script>\n```\n\nNow we have marked the `NumValue` as\
    \ required. We will instantiate the component in the HTML without the `NumValue`\
    \ property.\n\n```vue\n<my-component></my-component>\n```\n\nWe have used the\
    \ `my-component` tag without the `NumValue` property. Let's check the console.\n\
    \n![img/2c298ca86478005a0a21c9796cebbd15_41_1.png](img/2c298ca86478005a0a21c9796cebbd15_41_1.png)\n\
    \nFigure 5.4: Displaying error for missing prop value\n\nThe prop missing warning\
    \ is there in the console. It indicates, if the \"required\" param is set to \"\
    true\", then it will look for the prop as and when the component gets instantiated.\n\
    \n## Custom validation in property\n\nApart from the fixed type validations, we\
    \ can also add custom validators to the props. We can do that using the \"validator\"\
    \ level in the prop. It accepts the custom defined function, which can validate\
    \ the prop values.\n\n```vue\n<template>\n  <div>My Value is : {{ MyValue }}</div>\n\
    </template>\n\n<script>\nexport default {\n  props: {\n    MyValue: {\n      type:\
    \ Number,\n      validator: function (value) {\n        return value > 0;\n  \
    \    }\n    }\n  }\n}\n</script>\n```\n\nIn this validator, we have added a function\
