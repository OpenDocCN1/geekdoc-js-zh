    Filters


    Filters are the options to apply additional formatting upon the data in runtime.
    We can apply filters using the | (pipe) symbol in data. There are two ways we
    can apply filters.


    Mustache interpolation:


    ```

    {{ message | reverse}}

    ```


    v-bind expression:


    ```

    v-bind:id = recordid | formatfilter

    ```


    Let’s create a custom filter to reverse the data. We will define the filter inside
    a component. We will create a new component and add this in it.


    ```

    {{ message | reverse }}

    ```


    We have used the filters section to define the filter method.


    Point to note here, in the filter function we have accepted a value parameter.
    But have not passed any value when we have called the same filter inside the mustache
    interpolation of the template. Because, it accepts the data result as the default
    input to the value parameter. So, whenever we have added a filter, it accepts
    the data as the value parameter.


    In the above example, we have used the message as a data variable and added a
    fixed string into it as “Learn”. In the reverse filter, we have reversed the message
    data.


    ![](img/2c298ca86478005a0a21c9796cebbd15_57_0.png)


    Figure 6.6: filter applied on string


    Multiple parameters in filters


    We can also pass multiple parameters into a filter. In the above example, we have
    only one parameter as value. But we can also pass multiple'
  - '[PAGE 58]


    parameters into a filter.


    In order to see how multiple params work, we will create another filter to append
    a fixed string to the data value.


    ```

    {{ message | append_string(" - It is actually fun.") }}

    ```


    In this filter function, we have two params value and fixedString. We can notice,
    in the template, we have only passed value for one parameter i.e the second parameter.


    As stated above, the data value automatically gets set as the first parameter
    to the filter function. So, we need to pass the second param only.


    ![](img/2c298ca86478005a0a21c9796cebbd15_58_0.png)


    **Learn - It is actually fun.**


    Figure 6.7: Applying multiple params in filter on a string


    Chain of filters


    We can apply multiple filters to one data too. They work in sequence. That means,
    the data value or the result of the last filter would be the input value of the
    next filter.


    We will use the above example to reverse the data, capitalize the reversed data
    and append the static string to it.


    ```

    {{ message | reverse | capitalize | append_string(" - This string is reversed.")
    }}

    ```


    We have defined three (reverse, capitalize, and appendstring) filters and used
    in the interpolation. As per the sequence of the filters, message is the input
    value of the reverse filter. The result of the reverse filter would be the input
    of the capitalize filter and the result of this filter would be the input of the
    appendstring filter.


    So, it first reverse the string. Then makes the reversed string capitalize. Then
    adds a fixed string to the reversed and capitalized string.


    ![](img/2c298ca86478005a0a21c9796cebbd15_58_1.png)


    **Nrael - This string is reversed.**


    Figure 6.8: Chain of filters applied on a string


