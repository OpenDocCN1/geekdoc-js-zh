    \    </script>\n  </body>\n</html>\n```\n\n### Dealing with data part\n\nWe have\
    \ setup the text boxes. Now, we need to add value to the same. As we have seen\
    \ before, in order to get the values from the text boxes, we need to have model\
    \ variables assigned to the text boxes.\n\nLet's extend the above example.\n\n\
    ```\n<script>\n  Vue.component('custom_address', {\n    data: function(){\n  \
    \    return {\n        address_line1: \"\",\n        address_line2: \"\"\n   \
    \   }\n    },\n    template: '<div><fieldset class=\"container\"><div class=\"\
    row\"> <div class=\"col-2\">Address Line 1</div> <div class=\"col-6\"><input type=\"\
    text\" class=\"full-width\" v-model=\"address_line1\"/></div> </div> </fieldset>\
    \ <fieldset class=\"container\"><div class=\"row\"> <div class=\"col-2\">Address\
    \ Line 2</div> <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    \ v-model=\"address_line2\"/></div> </div> </fieldset></div>'\n  });\n  var app\
    \ = new Vue({\n    el: \"#app_div\",\n  });\n</script>\n```\n\nFigure 4.8: Adding\
    \ data to the component\n\nWe will use two model variables here for the input\
    \ texts. Model variables must be added to the data section. We will render the\
    \ above example in browser.\n\n| Address Line 1 | [Input Box] |\n| Address Line\
    \ 2 | [Input Box] |\n\nWe can see it is rendering correctly in the browser. Now,\
    \ we need to check if the Vue component is getting value from the input boxes.\
    \ In order to check the same, we need to use the Vue chrome extension.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_31_0.png)\n\
    \nThe strange part is no model variables here. No data is also getting populated\
    \ in it. So, we need to check the console to check if there is any error in it.\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_31_1.png)\n\nConsole tab has the error,\
    \ which states that the data should be a function that returns a pre-instance\
    \ value in component definitions. We need to change the data section. It should\
    \ not only contain the model variables. It should represent a function, which\
    \ returns the model variable.\n\nSince components are the reusable entities, they\
    \ need to be instantiated separately to get separately rendered in screen. Each\
    \ instance will have their own set of data variables. So, making the data as a\
    \ function would solve the purpose. With each instance data variable would be\
    \ instantiated separately.\n\n```\n<script>\n    Vue.component('custom_address',\
    \ {\n        data: function(){\n            return {\n                address_line1:\
    \ \"\",\n                address_line2: \"\"\n            }\n        },\n    \
    \    template: '<div><fieldset class=\"container\"><div class=\"row\"> <div class=\"\
    col-2\">Address Line 1</div> <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"address_line1\"/></div> </div> </fieldset> <fieldset class=\"\
    container\"><div class=\"row\"> <div class=\"col-2\">Address Line 2</div> <div\
    \ class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"address_line2\"\
    /></div> </div> </fieldset> </div>'\n    });\n    var app = new Vue({\n      \
    \  el: \"#app_div\",\n    });\n</script>\n```\n\nFigure 4.11: Component with data\
    \ in function format\n\nLet's render the code with the instance and see how Vue\
    \ component object is reacting on the screen.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_31_2.png)"
  mdcn: "\n## 什么是组件？\n\n组件是可以被重复使用以执行特定任务的 Vue 实例。只需实例化同一个组件，就可以在多个地方复用它。\n\n我们将设计我们的第一个组件。\n\
    \n我们将看到一个组件实际上是如何被设计出来的。我们还将了解如何在页面中渲染一个组件。\n\n首先，让我们设计一个组件，在屏幕上渲染一个文本框及其标签。我们将重复使用同一个组件来渲染多个文本框。\n\
    \n```\n<!DOCTYPE html >\n<html>\n<head>\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1, shrink-to-fit=no\">\n    <link rel=\"stylesheet\"\
    \ href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-GJzZqFGwb1QTTN6wy59FF1Bu1Gj6Sa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS\"\
    \ crossorigin=\"anonymous\">\n    <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    <style>\n        .full-width{\n            width: 100%;\n    \
    \        height: 90%;\n        }\n    </style>\n</head>\n<body>\n    <div id=\"\
    app_div\">\n        <custom_text></custom_text>\n    </div>\n    <script>\n  \
    \      Vue.component('custom_text', {\n            template: '<fieldset class=\"\
    container\"><div class=\"row\"> <div class=\"col-2\">Custom Text</div> <div class=\"\
    col-6\"><input type=\"text\" class=\"full-width\" /></div> </div> </fieldset>'\n\
    \        });\n        var app = new Vue({\n            el: \"#app_div\",\n   \
    \     });\n    </script>\n</body>\n</html>\n```\n\n与之前的章节不同，在上面的代码中，我们看到了 `Vue.component`\
    \ 块。它定义了一个组件。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_27_0.png)\n\n图 4.3：Vue\
    \ 组件主体描述\n\n如图所示，我们可以定义用于在屏幕上渲染组件的组件名称。组件主体在 `template` 部分中定义。\n\n我们只需使用组件名称作为标签，就可以在屏幕上渲染它。\n\
    \n<custom_text></custom_text>\n\n在浏览器中渲染页面后，我们将得到以下输出。\n\n**自定义文本** [输入框]\n\n\
    要在屏幕上渲染相同的组件，我们只需要不断重复这些标签。只要 Vue 元素内部找到相同的标签，它就会持续渲染上述控件。\n\n### 扩展模板\n\n目前它只是一个包含文本框的\
    \ fieldset。现在，让我们再添加一个包含另一个文本框的 fieldset，这样每当我们使用相同的标签时，它就会同时渲染两个文本框。\n\n我们将使这个组件更有意义。不再使用\
    \ `customtext`，我们将其改为 `customaddress`。同时，我们将把 \"Custom Text\" 标签改为 \"地址行 1\"。\n\
    \n更改必须在 `template` 部分中进行。因此，我向现有的 fieldset 中添加了一个新的 fieldset，以便它会依次渲染两个文本框。\n\n\
    ```\n<body>\n  <div id=\"app_div\">\n    <custom_address></custom_address>\n \
    \ </div>\n  <script>\n    Vue.component('custom_address', {\n      template: `<fieldset\
    \ class=\"container\"><div class=\"row\"> <div class=\"col-2\">Address Line 1</div>\
    \ <div class=\"col-6\"><input type=\"text\" class=\"full-width\" /></div> </div></fieldset>\
    \ <fieldset class=\"container\"><div class=\"row\"> <div class=\"col-2\">Address\
    \ Line 2</div> <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    /></div> </div></fieldset>`\n    });\n    var app = new Vue({\n      el: \"#app_div\"\
    ,\n    });\n  </script>\n</body>\n```\n\n![](img/2c298ca86478005a0a21c9796cebbd15_28_0.png)\n\
    \n我们将在浏览器中渲染相同的代码以查看输出。啊... 但是我们得到了如下所示的错误：\n\n![](img/2c298ca86478005a0a21c9796cebbd15_28_1.png)\n\
    \n它明确指出，组件模板应该只包含一个根元素。如果我们使用 `v-if`，那么也需要用 `v-else-if` 来链接，以保持单一根元素。由于我们连续使用了两个\
    \ fieldset，我们偏离了规则。所以，我们需要添加另一个根元素来看看是否有效。\n\n让我们用一个 `<div>` 元素包裹这些 fieldset，这样我们就可以遵循\
    \ Vue 组件的单根元素规则。\n\n```\ntemplate: '<div><fieldset class=\"container\"><div class=\"\
    row\"> <div class=\"col-2\">Address Line 1</div> <div class=\"col-6\"><input type=\"\
    text\" class=\"full-width\" /></div> </div> </fieldset> <fieldset class=\"container\"\
    ><div class=\"row\"> <div class=\"col-2\">Address Line 2</div> <div class=\"col-6\"\
    ><input type=\"text\" class=\"full-width\" /></div> </div> </fieldset></div>'\n\
    ```\n\n图 4.6：用 `<div>` 标签包裹 HTML\n\n如上图所示，`<div>` 元素作为单一根元素被添加到了模板中。\n\n### 教训\n\
    \nVue 组件模板应该只有一个根元素。如果我们使用 `v-if`，那么我们必须也使用 `v-else` 来链接元素，以保持它们在一个根元素内。\n\n当我们使用该标签时，它会在屏幕上渲染两个文本框。\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_29_0.png)\n\n图 4.7：组件输出\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, shrink-to-fit=no\">\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css\"\
    \n      integrity=\"sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0Dg\" crossorigin=\"\
    anonymous\">\n    <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    <style>\n      .full-width{\n        width: 100%;\n        height:\
    \ 90%;\n      }\n    </style>\n  </head>\n  <body>\n    <div id=\"app_div\">\n\
    \      <custom_address></custom_address>\n    </div>\n    <script>\n      Vue.component('custom_address',\
    \ {\n        template: '<div><fieldset class=\"container\"><div class=\"row\"\
    > <div class=\"col-2\">Address Line 1</div> <div class=\"col-6\"><input type=\"\
    text\" class=\"full-width\" /></div> </div> </fieldset> <fieldset class=\"container\"\
    ><div class=\"row\"> <div class=\"col-2\">Address Line 2</div> <div class=\"col-6\"\
    ><input type=\"text\" class=\"full-width\" /></div> </div> </fieldset></div>'\n\
    \      });\n      var app = new Vue({\n        el: \"#app_div\",\n      });\n\
    \    </script>\n  </body>\n</html>\n```\n\n### 处理数据部分\n\n我们已经设置了文本框。现在，我们需要为它们添加值。正如我们之前所看到的，为了从文本框中获取值，我们需要为文本框分配模型变量。\n\
    \n让我们扩展上面的例子。\n\n```\n<script>\n  Vue.component('custom_address', {\n    data:\
    \ function(){\n      return {\n        address_line1: \"\",\n        address_line2:\
    \ \"\"\n      }\n    },\n    template: '<div><fieldset class=\"container\"><div\
    \ class=\"row\"> <div class=\"col-2\">Address Line 1</div> <div class=\"col-6\"\
    ><input type=\"text\" class=\"full-width\" v-model=\"address_line1\"/></div> </div>\
    \ </fieldset> <fieldset class=\"container\"><div class=\"row\"> <div class=\"\
    col-2\">Address Line 2</div> <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"address_line2\"/></div> </div> </fieldset></div>'\n  });\n\
    \  var app = new Vue({\n    el: \"#app_div\",\n  });\n</script>\n```\n\n图 4.8：向组件添加数据\n\
    \n这里我们将使用两个模型变量来绑定输入文本。模型变量必须添加到 `data` 部分。我们将在浏览器中渲染上面的例子。\n\n| 地址行 1 | [输入框]\
    \ |\n| 地址行 2 | [输入框] |\n\n我们可以看到它在浏览器中正确渲染。现在，我们需要检查 Vue 组件是否从输入框中获取了值。为了检查这一点，我们需要使用\
    \ Vue Chrome 扩展。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_31_0.png)\n\n奇怪的是，这里没有模型变量。也没有数据填充到其中。因此，我们需要检查控制台，看看是否有任何错误。\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_31_1.png)\n\n控制台选项卡有错误，它指出在组件定义中，`data`\
    \ 应该是一个返回预实例值的函数。我们需要更改 `data` 部分。它不应该只包含模型变量，它应该是一个返回模型变量的函数。\n\n由于组件是可重用的实体，它们需要被单独实例化才能在屏幕上分别渲染。每个实例都将拥有自己的一组数据变量。因此，将\
    \ `data` 设为一个函数就能解决这个问题。每个实例的数据变量都将被单独实例化。\n\n```\n<script>\n    Vue.component('custom_address',\
    \ {\n        data: function(){\n            return {\n                address_line1:\
    \ \"\",\n                address_line2: \"\"\n            }\n        },\n    \
    \    template: '<div><fieldset class=\"container\"><div class=\"row\"> <div class=\"\
    col-2\">Address Line 1</div> <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"address_line1\"/></div> </div> </fieldset> <fieldset class=\"\
    container\"><div class=\"row\"> <div class=\"col-2\">Address Line 2</div> <div\
    \ class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"address_line2\"\
    /></div> </div> </fieldset> </div>'\n    });\n    var app = new Vue({\n      \
    \  el: \"#app_div\",\n    });\n</script>\n```\n\n图 4.11：以函数格式包含数据的组件\n\n让我们用实例渲染代码，看看\
    \ Vue 组件对象在屏幕上的反应。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_31_2.png)\n"
