    Figure 8.3: UI using render function


    Here is the output which shows the output of the tree structured createElement
    method.


    JSX


    It is actually a short form standing for Javascript Expressions. This approach
    of writing code in Javascript and XML styled representation, invented by the FaceBook
    engineering team. This approach is mostly used in ReactJS. Vue also supports JSX.
    We can use it to create the component templates.


    It is more readable and maintainable than the render functions. These would be
    the XML tag-like writing inside the Javascript functions.


    Note: To compile the vue JSX code, we need to add the babel plugin to use JSX
    with vue.


    Component using JSX


    We will create a sample component using JSX to display a simple message on screen.


    As we can see in the above code snippet, we have used the same render function
    to create the templates. The tags are added and returned to the view from the
    render function.


    > Aliasing **createElement** to **h** is a common convention you''ll see in the
    Vue ecosystem and is actually required for JSX. Starting with **version 3.4.0**
    of the Babel plugin for Vue, we automatically inject **const h = this.$createElement**
    in any method and getter (not functions or arrow functions), declared in ES2015
    syntax that has JSX, so you can drop the **(h)** parameter. With prior versions
    of the plugin, your app would throw an error if **h** was not available in the
    scope.


    Image source : https://vuejs.org/v2/guide/


    Figure 8.4: As per the official document, createElement replaced with h


    It will normally display the string on screen.'
