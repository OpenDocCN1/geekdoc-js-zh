- md: "## 4.12 使用 Vue Devtools 浏览渲染后的 Vue 对象\n\n我们可以看到与组件关联的实例变量。为了更清晰地看到这一点，让我们在屏幕上再添加一个组件。这样我们就能了解数据变量在不同组件实例中的行为。\n\
    \n```\n<div id=\"app_div\">\n    <custom_address></custom_address>\n    <hr/>\n\
    \    <custom_address></custom_address>\n</div>\n```\n\n**图 4.13：在其他组件中使用组件**\n\
    \n我们添加了两个组件，并用一条水平线隔开。它将在屏幕上相应地渲染。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_32_0.png)\n\
    \nVue 扩展选项卡将显示组件及其模型变量。在一个组件中输入的值不会覆盖另一个组件中的数据变量。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_32_1.png)\n\
    \n**图 4.14：包含数据元素的自定义地址组件**\n\n![](img/2c298ca86478005a0a21c9796cebbd15_32_2.png)\n\
    \n**图 4.15：另一个使用自定义地址且拥有独立数据元素的组件**\n\n比较上面的两张图片，我们可以看到第一个组件的 addressLine1 有值，然而第二个组件中相同的\
    \ addressLine1 没有值。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\">\n\
    \    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS\"\
    \ crossorigin=\"anonymous\">\n    <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    <style>\n        .full-width{\n            width: 100%;\n    \
    \        height: 90%;\n        }\n    </style>\n</head>\n<body>\n    <div id=\"\
    app_div\">\n        <custom_address></custom_address>\n        <hr/>\n       \
    \ <custom_address></custom_address>\n    </div>\n    <script>\n        Vue.component('custom_address',\
    \ {\n            data: function(){\n                return {\n               \
    \     address_line1: \"\",\n                    address_line2: \"\"\n        \
    \        }\n            },\n            template: `<div>\n                <fieldset\
    \ class=\"container\">\n                    <div class=\"row\">\n            \
    \            <div class=\"col-2\">Address Line 1</div>\n                     \
    \   <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"\
    address_line1\"/></div>\n                    </div>\n                </fieldset>\n\
    \                <fieldset class=\"container\">\n                    <div class=\"\
    row\">\n                        <div class=\"col-2\">Address Line 2</div>\n  \
    \                      <div class=\"col-6\"><input type=\"text\" class=\"full-width\"\
    \ v-model=\"address_line2\"/></div>\n                    </div>\n            \
    \    </fieldset>\n            </div>`\n        });\n        var app = new Vue({\n\
    \            el: \"#app_div\",\n        });\n    </script>\n</body>\n</html>\n\
    ```\n\n模板字符串看起来很奇怪！\n\n模板字符串看起来非常奇怪。想象一个包含多个文本框、下拉菜单、复选框和按钮的模板。将它们放在字符串里本身不是问题。问题出现在维护阶段。维护应用程序的成本会非常高。我们可能需要使用某种外部工具或其他方法来理解模板字符串。\n\
    \n所以，现在我们应该思考一些其他的方法，来帮助我们以更好、更组织化的方式编写模板字符串，以便未来能保持同样的效率。Vue CLI 就是答案。\n\n让我们使用\
    \ CLI 创建一个新组件。我们将在接下来的部分分析它的不同部分。\n\n要设置并运行 Vue CLI，请参考第一天的内容。\n\n所以，我们现在将创建一个新的\
    \ CLI 项目并向其中添加组件。让我们一步步来完成。\n\n```\n$ vue create learnin7days\n$ cd learnin7days\n\
    $ npm run serve\n```\n\n根据上述命令，我们已经设置了项目，导航到了目录，并运行了服务器。我们将得到以下输出：\n\n![](img/2c298ca86478005a0a21c9796cebbd15_34_0.png)\n\
    \n**图 4.16：服务器成功运行**\n\n我们可以在网络浏览器中使用上面指定的链接 http://localhost:8081 查看输出。如果我们查看新创建项目的文件夹结构，会发现我们使用的是\
    \ .vue 文件。这些文件包含了组件代码。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_34_1.png)\n\
    \n**图 4.17：Vue CLI 项目**\n\n生成的 HelloWorld.vue 组件包含易于维护的代码。如果我们查看它，会发现模板在这里不再是一个字符串了。\n\
    \n```\n<template>\n  <div class=\"hello\">\n    <h1>{{ msg }}</h1>\n    <p>\n\
    \      For a guide and recipes on how to configure / customize this project,<br>\n\
    \      check out the\n      <a href=\"https://cli.vuejs.org\" target=\"_blank\"\
    \ rel=\"noopener\">vue-cli documentation</a>.\n    </p>\n    <h3>Installed CLI\
    \ Plugins</h3>\n    <ul>\n      <li><a href=\"https://github.com/vuejs/vue-cli/tree/dev/packages/%40vue/cli-plugin-babel\"\
    \ target=\"_blank\" rel=\"noopener\">babel</a></li>\n      <li><a href=\"https://github.com/vuejs/vue-cli/tree/dev/packages/%40vue/cli-plugin-eslint\"\
    \ target=\"_blank\" rel=\"noopener\">eslint</a></li>\n    </ul>\n    <h3>Essential\
    \ Links</h3>\n    <ul>\n      <li><a href=\"https://vuejs.org\" target=\"_blank\"\
    \ rel=\"noopener\">Core Docs</a></li>\n      <li><a href=\"https://forum.vuejs.org\"\
    \ target=\"_blank\" rel=\"noopener\">Forum</a></li>\n      <li><a href=\"https://chat.vuejs.org\"\
    \ target=\"_blank\" rel=\"noopener\">Community Chat</a></li>\n      <li><a href=\"\
    https://twitter.com/vuejs\" target=\"_blank\" rel=\"noopener\">Twitter</a></li>\n\
    \      <li><a href=\"https://news.vuejs.org\" target=\"_blank\" rel=\"noopener\"\
    >News</a></li>\n    </ul>\n    <h3>Ecosystem</h3>\n    <ul>\n      <li><a href=\"\
    https://router.vuejs.org\" target=\"_blank\" rel=\"noopener\">vue-router</a></li>\n\
    \      <li><a href=\"https://vuex.vuejs.org\" target=\"_blank\" rel=\"noopener\"\
    >vuex</a></li>\n      <li><a href=\"https://github.com/vuejs/vue-devtools#vue-devtools\"\
    \ target=\"_blank\" rel=\"noopener\">vue-devtools</a></li>\n      <li><a href=\"\
    https://vue-loader.vuejs.org\" target=\"_blank\" rel=\"noopener\">vue-loader</a></li>\n\
    \      <li><a href=\"https://github.com/vuejs/awesome-vue\" target=\"_blank\"\
    \ rel=\"noopener\">awesome-vue</a></li>\n    </ul>\n  </div>\n</template>\n\n\
    <script>\nexport default {\n  name: 'HelloWorld',\n  props: {\n    msg: String\n\
    \  }\n}\n</script>\n```\n\n**图 4.18：使用模板创建的默认组件代码**\n\n可以使用编辑器/IDE，例如 Brackets\
    \ (http://brackets.io/)、VS Code (https://code.visualstudio.com/)、Sublime (https://www.sublimetext.com/)\
    \ 等来打开和编辑项目。编辑器列表很长；不限于上面这些。你可以找到任何你习惯的编辑器来使用。我们将使用 vue CLI 创建相同的地址组件。\n\n正如我们之前所见，.vue\
    \ 文件（即组件文件）都存储在 /components 文件夹中。因此，我们将在 /components 文件夹中添加一个名为 Address.vue 的新文件。然后，让我们向该文件中添加以下代码。\n\
    \n代码在 <template> 标签中包含模板字符串。组件的名称可以在 <script> 标签内定义。\n\n在这个 UserInfo 组件中，我们有一个\
    \ <span> 标签来在屏幕上显示所选用户。这个 <span> 标签从 usrInfo 属性获取其数据。\n\n现在我们可以检查 User 组件，看看数据是如何传递给\
    \ UserInfo（这里是子组件）的。\n\n```html\n<template>\n  <div>\n    <select class=\"full-width\"\
    \ v-model=\"selectedUser\">\n      <option v-for=\"user in users\" :key=\"user\"\
    > {{ user }} </option>\n    </select>\n    <UserInfo :usrInfo = \"selectedUser\"\
    ></UserInfo>\n  </div>\n</template>\n```\n\n**图 4.29：展示 UserInfo 子组件的用法**\n\n\
    在模板中，它使用了 UserInfo 标签，并将值传递给 usrInfo 属性，该属性是在 UserInfo 组件中定义的。这样 UserInfo 组件就能从属性中获取数据并在\
    \ <span> 标签中显示数据。User 组件的完整代码将如下所示：\n\n```html\n<template>\n    <div>\n      \
    \  <select class=\"full-width\" v-model='selectedUser'>\n            <option v-for=\"\
    user in users\" :key=\"user\"> {{ user }} </option>\n        </select>\n     \
    \   <UserInfo :usrInfo = 'selectedUser'></UserInfo>\n    </div>\n</template>\n\
    <script>\nimport UserInfo from './UserInfo.vue'\n\nexport default {\n    name:\
    \ 'Users',\n    data: function(){\n        return {\n            users: ['Dr.\
    \ Vishal Jain', 'Nirmal Hota', 'Tadit Dash'],\n            selectedUser: ''\n\
    \        }\n    },\n    components: {\n        UserInfo\n    }\n}\n</script>\n\
    <style scoped>\n    .full-width{\n        width: 100%;\n        height: 41px;\n\
    \        font-size: larger;\n    }\n</style>\n```\n\n### 处理父组件中的子组件事件\n\n到目前为止，我们已经看到了数据是如何从子组件传递到父组件以及反向传递的。但数据传递并非故事的全部。在现实世界中，我们还必须在父组件中处理子组件事件。\n\
    \n要将事件从子组件传递到父组件，我们需要使用定义的关键字 $emit。顾名思义，它将事件从子组件发出到父组件。父组件必须在其端处理该事件以产生效果。\n\n\
    让我们创建另一个 vue 组件并命名为 AddressWithPinCheck.vue。我们将在这里添加一个邮政编码输入框，以便它接受用户输入的邮政编码。此外，我们还将添加一个按钮。点击该按钮时，它将验证邮政编码。\n\
    \n```html\n<fieldset class=\"container\">\n    <div class=\"row\">\n        <div\
    \ class=\"col-2\">Pin Code</div>\n        <div class=\"col-6\">\n            <input\
    \ type=\"text\" class=\"full-width\" v-model=\"pin_code\"/>\n            <button\
    \ v-on:click= \"$emit('validate_pin', pin_code)\">Validate</button>\n        </div>\n\
    \    </div>\n</fieldset>\n...\n```\n\n**图 4.30：使用 $emit 验证邮政编码**\n\n除了 \"$emit('validate_pin',\
    \ pin_code)\" 语句外，其他一切看起来都很熟悉。这条语句向父组件发出 validate_pin 事件。现在，父组件必须处理该事件才能得到预期结果。\n\
    \n在这种情况下，这个组件发出 validate_pin 事件，父组件将实现来显示消息。"
