    ## Slots


    Slots are a way to inject the parent component contents into the child components.
    We may argue that we can use the props for the same, but think of a textual content
    of some lines, and so on. They are not the feasible ones to be shared using props.


    ## Using Slot


    To use slot mechanism, we need to use the `<slot>` tag. This tag enables Vue to
    inject the parent component contents into the child component.


    ## Use Slot to inject content


    Let''s create a new Vue component with the `<slot>` tag. We will use the Vue component
    in our parent component to check how it works. Let''s name the component as the
    `BasicSlot`. Vue along with the following code added to it.


    This is the child component which we will use to demonstrate the slot way of working.


