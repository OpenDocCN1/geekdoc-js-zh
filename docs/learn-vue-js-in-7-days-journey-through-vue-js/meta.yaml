    > <div class=\"col-2\">Address Line 2</div> <div class=\"col-6\"><input type=\"\
    text\" class=\"full-width\" /></div> </div> </fieldset></div>'\n```\n\nFigure\
    \ 4.6: Surround the HTML with a `<div>` tag\n\nAs we can see in the image above,\
