  - '[PAGE 13]


    Figure 3.2: Code using computed property


    Now we have refactored the existing code. Mainly we did two things.


    We have removed the method attribute and added the computed attribute.


    We don''t need the parenthesis for using the computed attribute in the page unlike
    the method.


    How this will be the solution?


    Computed properties get cached. So, when for the first time both the model variables
    i.e. firstname and lastname get some input, the computed property gets its value.
    It gets cached after that until the model variables gets a new value.


    The advantage of using the computed property is as follows,


    +   - It gets cached

    - No changes to the value until the depended models get changed

    - It is ready to use from the cache

    - Performs faster than the methods


    Computed Property versus Method


    The basic and the biggest difference between the computed property and method
    is their execution upon usage. In other words, methods get executed each time
    it is called, whereas the computed property uses the cache unless the dependency
    gets changed.


    Let''s try with a timestamp value


    Let''s create a method and computed property. Each of them should return the current
    timestamp so that we can mark the difference between the values.


    ![](img/2c298ca86478005a0a21c9796cebbd15_13_0.png)


    Figure 3.3: Output comparison between the method and computed property with timestamp


    In the above image, we have shown the output of our program. The up ones are the
    result from the method calls and the lower ones are from computed property.


    The timestamps in the method section has the difference in the values, although
    we are calling the same method. That means, the same method is getting called
    again and again to get the value. But in the computed property section values
    will always be same as the value with the first call, as it fetches the value
    from the cache. In the first call, the generate value i.e. Current timestamp in
    this case, gets stored in the cache. Upon subsequent calls, the value only gets
    fetched and displayed from cache unless the page gets refreshed. On refresh, it
    changes the value of the computed property, as this computed property depends
    on the timestamps.


    With multiple refresh of the screen, we can see the method values may be same
    or different, depending upon the execution time. But the computed property value
    will always be the same.'
- md: "## Call from Method\n\n{{ nowMethod() }}\n\n{{ nowMethod() }}\n\n{{ nowMethod()\
    \ }}\n\n## Call from Computed\n\n{{ nowComputed }}\n\n{{ nowComputed }}\n\n{{\
    \ nowComputed }}\n\nGetters and setters in the computed property\n\nThe computed\
    \ property looks like a normal attribute in the HTML page. Then the natural question\
    \ that arises in our thoughts, is it possible to use getters and setters with\
    \ computed property?\n\nThe answer is YES.\n\nWe can define the getters and setters\
    \ for the computed properties as well.\n\n### Getter\n\nWhen we say, return the\
    \ value to the computed property, it works on the getter so that we can retrieve\
    \ the value from the particular computed property.\n\nLet's try this\n\nWe will\
    \ take the same example as above; we will only need to show our user if the value\
    \ is Manually Edited or Automatically Combined.\n\n![Getter example to show strings\
    \ combined automatically](img/2c298ca86478005a0a21c9796cebbd15_15_0.png)\n\nFigure\
    \ 3.4: Getter example to show strings combined automatically\n\nIn this UI, the\
    \ first name and last name are combined to create the full name. As mentioned\
    \ in the last example, we have used the full_name as a computed property and hold\
    \ the combined value to display the same on screen. As mentioned earlier, this\
    \ combination of value is being returned by the getter method.\n\nAs marked in\
    \ the red rectangle in the above image, it says Automatically Combined .\n\n###\
    \ Setter\n\nNow, let's use the setter method and we will notify the user, if the\
    \ value is manually edited. In other words, if the full name directly gets changed\
    \ by the user, it will display the message that the value is Manually Edited .\n\
    \nLet's try this\n\nIn the same example, we will show the message as manually\
    \ edited as shown in the following image within the red rectangle.\n\n![Setter\
    \ example to show string edited manually](img/2c298ca86478005a0a21c9796cebbd15_15_1.png)\n\
    \nFigure 3.5: Setter example to show string edited manually\n\n### Explain the\
    \ UI Elements\n\nIn the above screens (both Getter and Setter UI), we have taken\
    \ three inputs for firstname, lastname and fullname (the computed property). The\
    \ only difference between the first two input boxes and the last input box is,\
    \ in the last input box, i.e. the fullname input box, we have applied the styles\
    \ to reduce its width and remove its border.\n\n```\nstyle=\"width: 110px; border:\
    \ 0px;\"\n```\n\nLet's look into that piece of code\n\n```\ncomputed: {\n    full_name\
    \ : {\n        get: function(){\n            this.is_combined = true;\n      \
    \      return this.firstname + ' ' + this.lastname;\n        },\n        set:\
    \ function(value){\n            this.is_combined = false;\n        }\n    }\n\
    }\n```\n\nAs shown in the image, we have defined the get and set methods for the\
    \ full_name computed property.\n\nIn the get method, we did following:\n\n- We\
    \ have returned the combined value of the *firstname* and *lastname* to create\
    \ the computed attribute\n- Set the *is_combined* variable to true\n\nIn the set\
    \ method, we did following\n\n- Set the *is_combined* variable to false\n\nWhenever\
    \ the get method gets called to display the value, it will set the *is_combined*\
    \ to true by showing the Automatically Combined message to the user and sets false\
    \ when set method is called by showing the Manually edited message.\n\nHere, set\
    \ method will be called as soon as we edit the full_name in the input box specified.\n\
    \nThe full view of the code looks like the following:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n\t<head>\n\t\t<script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n\t\t<style>\n\t\t\tinput[type=text]{\n\t\t\t\twidth: 50%;\n\t\t\t\t\
    height: 30px;\n\t\t\t\tfont-size: 20px;\n\t\t\t};\n\t\t</style>\n\t</head>\n\t\
    <body>\n\t\t<div id=\"app_div\">\n\t\t\t\t\t<input type=\"text\" v-model=\"first_name\"\
    \n\t\t\t\t\tplaceHolder=\"First name\"/> <br>\n\t\t\t\t\t<input type=\"text\"\
    \ v-model=\"last_name\"\n\t\t\t\t\tplaceHolder=\"Last name\"/> <br/><br/>\n\t\t\
    Hello <input type=\"text\" v-model=\"full_name\"\n\t\tplaceHolder=\"Full name\"\
    \ style=\"width: 110px; border:\n\t\t0px;\"/>, Greeting from Learn VueJS in 7\
    \ days\n\t\t<br/><br/>\n\t\t\t<b>{{ is_combined ? \"Automatically Combined\":\n\
    \t\t\"Manually edited\" }}</b>\n\t\t\t</div>\n\t\t\t<script>\n\t\t\t\tvar app\
    \ = new Vue({\n\t\t\t\t\tel: \"#app_div\",\n\t\t\t\t\tdata: {\n\t\t\t\t\t\tfirst_name:\
    \ 'Nirmal',\n\t\t\t\t\t\tlast_name: 'Hota',\n\t\t\t\tis_combined: true\n\t\t\t\
    \t},\n\t\t\t\tcomputed: {\n\t\t\t\t\tfull_name : {\n\t\t\t\tget: function(){\n\
    \t\t\t\t\tthis.is_combined = true;\n\t\t\t\t\treturn this.first_name + ' ' + this.\n\
    \t\t\t\t\tlast_name;\n\t\t\t\t\t},\n\t\t\t\t\tset: function(value){\n\t\t\t\t\t\
    \tthis.is_combined = false;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t});\n\t\t</script>\n\
    \t</body>\n</html>\n```\n\n### Watched property\n\nWatched property is used to\
    \ watch the variable changes and execute the code blocks written underneath.\n\
    \nLet's take an example\n\nWe will build a liter conversion calculator. As a part\
    \ of the liter conversion calculator, we will take an input text, which will take\
    \ the number of liters as input. As soon as the user enters the value, the milliliter\
    \ conversion of the same will get calculated and displayed in the input box next\
    \ to it. User will also get the liter conversion of the milliliter when enters\
    \ the milliliter value in the input box.\n\nHow the output looks like\n\n![Liter\
    \ conversion calculator](img/2c298ca86478005a0a21c9796cebbd15_18_0.png)\n\nFigure\
    \ 3.6: Liter conversion calculator\n\nAs shown in the screenshot, liter value\
    \ entered in the Liter text box will display the Milliliter equivalent of the\
    \ same and vice versa.\n\n![Liter conversion calculator with values](img/2c298ca86478005a0a21c9796cebbd15_18_1.png)\n\
    \nFigure 3.7: Liter conversion calculator with values\n\nAs shown in the screenshot,\
    \ we have entered the liter value and milliliter value is also getting changed\
    \ immediately.\n\n![Liter conversion calculator with values](img/2c298ca86478005a0a21c9796cebbd15_18_2.png)\n\
    \nFigure 3.8: Liter conversion calculator with values\n\nSimilarly, enter values\
    \ in the milliliter input, calculate and displays the liter value immediately.\n\
    \n### Explain the code\n\nIn the HTML part, we have used the table layout design\
    \ structure for our convention. Div layout can be used to prepare the tabular\
    \ structure of inputs.\n\nVueJS supports watch label to define the watched properties.\
    \ Since we need to accept the inputs, then we need to define the model variables\
    \ to get the data in it. So, we have defined two model variables liter and milliliter,\
    \ inside the data block. The same variables are used in the input fields in the\
    \ v-model attribute to accept the input values in them.\n\n![Defining watchers](img/2c298ca86478005a0a21c9796cebbd15_19_0.png)\n\
    \nFigure 3.9: Defining watchers\n\nNow, we need to add the watch to the same attributes,\
    \ so that we can see the value changes, and execute the code blocks immediately.\
    \ In order to add the watch to the same model variables, we need to use the same\
    \ variable names to define the watch.\n\nWatch properties code block fires as\
    \ soon as the change happens or the conditions met, as defined in the watch label\
    \ block. It keeps watching the v-model variable to take the effect of the change.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <head>\n        <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    </head>\n    <body>\n        <div id=\"app_div\">\n          \
    \  <fieldset style=\"width: 20%; padding: 5%\">\n                <legend style=\"\
    font-weight: bold\">Liter conversion calculator</legend>\n                <table>\n\
    \                    <tr>\n                        <td><h1>Liter</h1></td>\n \
    \                       <td></td>\n                        <td><h1>Milliliter</h1></td>\n\
    \                    </tr>\n                    <tr>\n                       \
    \ <td><input type=\"text\" v-model=\"liter\"/></td>\n                        <td>\
    \ = </td>\n                        <td><input type=\"text\" v-model=\"mliter\"\
    /></td>\n                    </tr>\n                </table>\n            </fieldset>\n\
    \        </div>\n        <script>\n            var app = new Vue({\n         \
    \       el: \"#app_div\",\n                data: {\n                    liter:\
    \ 0,\n                    mliter: 0\n                },\n                watch:\
    \ {\n                    liter: function(val){\n                        this.liter\
    \ = val;\n                        this.mliter = val * 1000;\n                \
    \    },\n                    mliter: function(val){\n                        this.liter\
    \ = val / 1000;\n                        this.mliter = val;\n                \
    \    },\n                },\n            });\n        </script>\n    </body>\n\
    </html>\n```\n\n### Watchers more in use\n\nIn the reactive environment, watchers\
    \ play a great role as it keeps watching the properties, it can react as per the\
    \ action defined.\n\nWatcher not only keeps watching the property, it also keeps\
    \ track of the old and new values of the attributes. It caches the current value.\
    \ Upon change, watcher returns the value as old value and the changed value as\
    \ the new value. Again caches the new value as the current value.\n\nAs shown\
    \ in the previous example, watchers get defined under the watch hook of the vue\
    \ object. As a thumb rule, the watcher names must be same as the name of the attribute\
    \ to be watched."
  mdcn: "\n## 方法调用\n\n{{ nowMethod() }}\n\n{{ nowMethod() }}\n\n{{ nowMethod() }}\n\
    \n## 计算属性调用\n\n{{ nowComputed }}\n\n{{ nowComputed }}\n\n{{ nowComputed }}\n\n\
    计算属性中的获取器和设置器\n\n计算属性在HTML页面中看起来就像一个普通的属性。那么我们头脑中自然会产生一个问题：计算属性能否与获取器和设置器一起使用？\n\
    \n答案是肯定的。\n\n我们也可以为计算属性定义获取器和设置器。\n\n### 获取器\n\n当我们说，向计算属性返回值时，它作用于获取器，这样我们就可以从特定的计算属性中检索值。\n\
    \n让我们来尝试一下\n\n我们将沿用上面的例子；我们只需要向用户展示该值是**手动编辑**还是**自动组合**。\n\n![获取器示例：显示自动组合的字符串](img/2c298ca86478005a0a21c9796cebbd15_15_0.png)\n\
    \n图 3.4: 获取器示例：显示自动组合的字符串\n\n在这个用户界面中，名和姓被组合起来创建全名。如上一个例子所述，我们已将`full_name`作为计算属性，并保存组合后的值以显示在屏幕上。如前所述，这个值的组合是由获取器方法返回的。\n\
    \n如上图中红色矩形框所示，它显示“自动组合”。\n\n### 设置器\n\n现在，让我们使用设置器方法，如果值被手动编辑，我们将通知用户。换句话说，如果用户直接更改了全名，它将显示“值已手动编辑”的消息。\n\
    \n让我们来尝试一下\n\n在同一个例子中，我们将在红色矩形框内显示“已手动编辑”的消息，如下图所示。\n\n![设置器示例：显示手动编辑的字符串](img/2c298ca86478005a0a21c9796cebbd15_15_1.png)\n\
    \n图 3.5: 设置器示例：显示手动编辑的字符串\n\n### 解释UI元素\n\n在上面的屏幕中（获取器和设置器界面），我们为名、姓和全名（计算属性）设置了三个输入框。前两个输入框和最后一个输入框之间的唯一区别是，在最后一个输入框（即全名输入框）中，我们应用了样式来减小其宽度并移除其边框。\n\
    \n```\nstyle=\"width: 110px; border: 0px;\"\n```\n\n让我们看一下那段代码\n\n```\ncomputed:\
    \ {\n    full_name : {\n        get: function(){\n            this.is_combined\
    \ = true;\n            return this.firstname + ' ' + this.lastname;\n        },\n\
    \        set: function(value){\n            this.is_combined = false;\n      \
    \  }\n    }\n}\n```\n\n如图所示，我们为`full_name`计算属性定义了`get`和`set`方法。\n\n在`get`方法中，我们做了以下操作：\n\
    \n- 我们返回了*名*和*姓*的组合值，以创建计算属性\n- 将`is_combined`变量设置为true\n\n在`set`方法中，我们做了以下操作：\n\
    \n- 将`is_combined`变量设置为false\n\n每当调用`get`方法来显示值时，它会将`is_combined`设置为true，并向用户显示“自动组合”消息；当调用`set`方法时，它会将其设置为false，并显示“已手动编辑”消息。\n\
    \n在这里，只要我们编辑指定输入框中的`full_name`，`set`方法就会被调用。\n\n代码的完整视图如下所示：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n\t<head>\n\t\t<script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n\t\t<style>\n\t\t\tinput[type=text]{\n\t\t\t\twidth: 50%;\n\t\t\t\t\
    height: 30px;\n\t\t\t\tfont-size: 20px;\n\t\t\t};\n\t\t</style>\n\t</head>\n\t\
    <body>\n\t\t<div id=\"app_div\">\n\t\t\t\t\t<input type=\"text\" v-model=\"first_name\"\
    \n\t\t\t\t\tplaceHolder=\"First name\"/> <br>\n\t\t\t\t\t<input type=\"text\"\
    \ v-model=\"last_name\"\n\t\t\t\t\tplaceHolder=\"Last name\"/> <br/><br/>\n\t\t\
    Hello <input type=\"text\" v-model=\"full_name\"\n\t\tplaceHolder=\"Full name\"\
    \ style=\"width: 110px; border:\n\t\t0px;\"/>, Greeting from Learn VueJS in 7\
    \ days\n\t\t<br/><br/>\n\t\t\t<b>{{ is_combined ? \"Automatically Combined\":\n\
    \t\t\"Manually edited\" }}</b>\n\t\t\t</div>\n\t\t\t<script>\n\t\t\t\tvar app\
    \ = new Vue({\n\t\t\t\t\tel: \"#app_div\",\n\t\t\t\t\tdata: {\n\t\t\t\t\t\tfirst_name:\
    \ 'Nirmal',\n\t\t\t\t\t\tlast_name: 'Hota',\n\t\t\t\tis_combined: true\n\t\t\t\
    \t},\n\t\t\t\tcomputed: {\n\t\t\t\t\tfull_name : {\n\t\t\t\tget: function(){\n\
    \t\t\t\t\tthis.is_combined = true;\n\t\t\t\t\treturn this.first_name + ' ' + this.\n\
    \t\t\t\t\tlast_name;\n\t\t\t\t\t},\n\t\t\t\t\tset: function(value){\n\t\t\t\t\t\
    \tthis.is_combined = false;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t});\n\t\t</script>\n\
    \t</body>\n</html>\n```\n\n### 侦听属性\n\n侦听属性用于监视变量的变化，并执行其下方编写的代码块。\n\n让我们举个例子\n\
    \n我们将构建一个升转换计算器。作为升转换计算器的一部分，我们将接受一个文本输入，该输入将升数作为输入。一旦用户输入值，该值的毫升转换就会被计算出来，并显示在旁边的输入框中。当用户在输入框中输入毫升值时，用户也会获得毫升的升转换结果。\n\
    \n输出效果如何\n\n![升转换计算器](img/2c298ca86478005a0a21c9796cebbd15_18_0.png)\n\n图 3.6:\
    \ 升转换计算器\n\n如截图所示，在“升”文本框中输入的升值将显示其等效的毫升值，反之亦然。\n\n![带有数值的升转换计算器](img/2c298ca86478005a0a21c9796cebbd15_18_1.png)\n\
    \n图 3.7: 带有数值的升转换计算器\n\n如截图所示，我们输入了升值，毫升值也立即发生了变化。\n\n![带有数值的升转换计算器](img/2c298ca86478005a0a21c9796cebbd15_18_2.png)\n\
    \n图 3.8: 带有数值的升转换计算器\n\n同样，在毫升输入框中输入值，也会立即计算并显示升值。\n\n### 解释代码\n\n在HTML部分，我们按照惯例使用了表格布局设计结构。Div布局也可用于创建输入的表格结构。\n\
    \nVueJS支持使用`watch`标签来定义侦听属性。由于我们需要接受输入，然后我们需要定义模型变量来获取数据。因此，我们在`data`块中定义了两个模型变量`liter`和`mliter`。相同的变量在输入字段的`v-model`属性中使用，以接受其中的输入值。\n\
    \n![定义侦听器](img/2c298ca86478005a0a21c9796cebbd15_19_0.png)\n\n图 3.9: 定义侦听器\n\n\
    现在，我们需要为相同的属性添加侦听，这样我们才能看到值的变化，并立即执行代码块。为了给相同的模型变量添加侦听，我们需要使用相同的变量名来定义侦听。\n\n\
    侦听属性代码块会在更改发生或满足`watch`标签块中定义的条件时立即触发。它持续监视`v-model`变量以使更改生效。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n    <head>\n        <script src=\"https://cdn.jsdelivr.net/npm/vue/dist/vue.js\"\
    ></script>\n    </head>\n    <body>\n        <div id=\"app_div\">\n          \
    \  <fieldset style=\"width: 20%; padding: 5%\">\n                <legend style=\"\
    font-weight: bold\">Liter conversion calculator</legend>\n                <table>\n\
    \                    <tr>\n                        <td><h1>Liter</h1></td>\n \
    \                       <td></td>\n                        <td><h1>Milliliter</h1></td>\n\
    \                    </tr>\n                    <tr>\n                       \
    \ <td><input type=\"text\" v-model=\"liter\"/></td>\n                        <td>\
    \ = </td>\n                        <td><input type=\"text\" v-model=\"mliter\"\
    /></td>\n                    </tr>\n                </table>\n            </fieldset>\n\
    \        </div>\n        <script>\n            var app = new Vue({\n         \
    \       el: \"#app_div\",\n                data: {\n                    liter:\
    \ 0,\n                    mliter: 0\n                },\n                watch:\
    \ {\n                    liter: function(val){\n                        this.liter\
    \ = val;\n                        this.mliter = val * 1000;\n                \
    \    },\n                    mliter: function(val){\n                        this.liter\
    \ = val / 1000;\n                        this.mliter = val;\n                \
    \    },\n                },\n            });\n        </script>\n    </body>\n\
    </html>\n```\n\n### 侦听器的更多应用\n\n在响应式环境中，侦听器扮演着重要的角色，因为它持续监视属性，并可以根据定义的动作做出反应。\n\
    \n侦听器不仅持续监视属性，还跟踪属性的旧值和新值。它缓存当前值。当发生变化时，侦听器将旧值作为旧值返回，将更改后的值作为新值返回。然后再次将新值缓存为当前值。\n\
    \n如前面的示例所示，侦听器定义在vue对象的`watch`钩子下。作为经验法则，侦听器的名称必须与要监视的属性的名称相同。\n"
