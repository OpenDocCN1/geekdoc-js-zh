    As the name suggest, it gets mixed with the components. It makes reusable functionality
    work by mixing its content into the component.


    Let''s assume, we have multiple components and they share some common functionality.
    So in order to accommodate it, we need to merge the component with each other.
    So that we can only expose one component without creating repetitive code. But
    there is another issue with this approach, if we merge the components into one
    then both components will get some extra functionalities which are not really
    needed for them.


