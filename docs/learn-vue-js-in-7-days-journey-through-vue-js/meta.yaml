    \nprop的默认值是`Any`。不设置任何类型或将类型设置为`null`将接受任何类型的数据。\n\n属性支持的类型是：\n\n### 向属性传递数组\n\
    \n与`String`、`Number`和`Boolean`一样，我们也可以向属性传递数组。我们将传递一个静态数组给组件，并遍历它以在屏幕上打印元素。\n\n\
