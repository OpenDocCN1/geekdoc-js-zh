    \ `${slicedHTML}... `;\n                    el.appendChild(readMoreLink);\n  \
    \              }\n                readMoreLink.addEventListener('click', showAllText);\n\
    \                readLessLink.addEventListener('click', showLimitedText);\n  \
    \              showLimitedText();\n            }\n        })\n    },\n};\n\nexport\
    \ default ExpandSqueeze;\n```\n\n最后，调用了 `showLimitedText`，以便我们看到有限的文本。以下截图证明了所述内容，它将文本限制为我在段落声明时提到的\
    \ 70 个字符。\n\n![图 6.11：ExpandSqueeze 插件输出](img/2c298ca86478005a0a21c9796cebbd15_64_0.png)\n\
    \n当你点击 “Read more...” 时，它会显示所有文本并附加 “Read less...” 链接。\n\n![图 6.12：点击 Read more...\
    \ 后的 ExpandSqueeze 插件输出](img/2c298ca86478005a0a21c9796cebbd15_64_1.png)\n\n在本章中，我们介绍了混入如何帮助定义公共逻辑并与组件合并。我们还学习了定义自定义指令以管理\
    \ UI 组件中的格式和显示的方法。此外，我们还学习了过滤器和插件。\n\n我们将学习使用状态管理开发单页网站的方法。我们将在下一章介绍状态管理。\n\n\
    ## 第 7 天\n\n# 单页应用\n\n在上一章中，我们探索了一些为我们的 Vue 应用构建可复用分布式功能的方法。\n\n路由和状态管理在设计单页应用时扮演着重要角色。在本章中，我们将探讨在我们的\
    \ Vue 应用中实现这些概念的方法。\n\nHTML5 History 模式将帮助我们为 SPA 创建路由，为用户动态地在页面之间来回切换提供了一条便捷的路径，而无需重新加载页面。\n\
    \n我们将通过适当的插图来学习 Vue 应用状态管理的一些原则。我们将探索使用 props 和自定义事件进行父子组件交互，然后是使用 EventBus 和全局存储的状态管理技术。\n\
    \n最后但同样重要的是，Vuex 库，这是一种强大的应用状态管理方式，它将把你的 Vue 应用开发提升到一个新的水平。\n\n当然，我们将简要地看看这些状态管理技术之间的区别，以决定采用哪种。\n\
    \n以下是我们将涵盖的主题：\n- 创建路由\n- 使用路由\n- 状态管理如何工作的基础\n- 使用 EventBus、全局存储和 Vuex 的状态管理实现\n\
    \n# 什么是路由\n\n路由是一种技术，通过它，访问你网站或 Web 服务的请求被引导到目的地，即处理它们的代码。假设你在浏览器 URL 框中输入 `http://www.example.com/about`，它应该指向你的\
    \ `About.html` 或其他内容。定义那个特定规则的过程就称为路由。\n\n在单页应用中，路由是关键，因为你真的不希望页面为另一个请求而重新加载。传统应用的行为方式是，当你点击一个超链接时，它会去服务器并返回一个\
    \ HTML 页面。然而，在 SPA 中，页面只加载一次，当你通过页面上的操作（如点击链接或按钮）请求某些内容时，它会根据请求动态地更改内容以加载新的内容/页面。\n"
