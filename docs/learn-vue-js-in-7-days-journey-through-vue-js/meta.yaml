    \ else the user input will be used as the color.\n\nYou have successfully landed\
    \ in demo page"
  - "[PAGE 54]\n\nWe have passed the color value from the HTML to the directive. The\
    \ value needs to be passed after the \"=\" sign within double quotes.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_54_0.png)\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_54_1.png)\n\nFigure 6.3: Showing the\
    \ screenshot of styles applied by passing the value in custom directory\n\nIn\
    \ the browser, it renders with the custom color, as input by the user along with\
    \ the other fixed formatting.\n\n# Arguments passing to custom directives\n\n\
    Like value passing, we can also pass arguments into the custom directives. To\
    \ pass the arguments, we need to use : (colon) instead of the equal sign.\n\n\
    +   - Low Traffic\n- Moderate Traffic\n- High Traffic\n\nWe have defined a dummy\
    \ traffic light system with different amount of delays. Based on the arguments\
    \ (Low/Moderate/High) the traffic signal will behave accordingly.\n\nAs seen in\
    \ the above code, we have passed the arguments into the custom directives using\
    \ : (colon). Depending upon the argument, it will change the element style to\
    \ perform in the web page.\n\n```\nVue.directive('traffic', function(el, binding,\
    \ vnode){\n    var intervalObj;\n    var interval = 5000;\n    switch(binding.arg){\n\
    \        case \"low\":\n            interval = 5000;\n            break;\n   \
    \     case \"moderate\":\n            interval = 10000;\n            break;\n\
    \        case \"high\":\n            interval = 20000;\n    }\n});\n```"
- md: "The arguments here are placed in a switch-case. Depending upon the argument\
    \ passed, it will perform the task accordingly. To illustrate it, we have kept\
    \ an interval of 5 seconds, 10 seconds, and 20 seconds for the low, moderate,\
    \ and high respectively to change the signal color.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_55_0.png)\n\
    \nFigure 6.4: Traffic light application implementing arguments passed to custom\
    \ directive\n\n## Passing Modifiers to Custom Directives\n\nWe can pass modifiers\
    \ into the custom directives. Unlike the above, it will be passed using the .\
    \ (dot).\n\n```html\n<div v-markText.underline.makeCapital>Mark the text</div>\n\
    ```\n\nIn the above HTML, we have passed multiple modifiers into the custom directive\
    \ `v-markText`. The formatting will be done, depending upon the order it appears.\n\
    \n```javascript\nVue.directive('markText', function(el, binding) {\n    if(binding.modifiers.underline){\n\
    \        el.style.textDecoration = \"underline\";\n    }\n    if(binding.modifiers.makeCapital){\n\
    \        el.style.textTransform = \"uppercase\";\n    }\n    if(binding.modifiers.makeHeading){\n\
    \        el.style.fontSize = '50px';\n        el.style.fontWeight = 'bold';\n\
    \    }\n    if(binding.modifiers.highlight){\n        el.style.backgroundColor\
    \ = \"yellow\";\n    }\n})\n```\n\nThe text gets formatted depending upon the\
    \ formatters specified in the custom directive.\n\n## Hooks in custom directives\n\
    \nCustom directives also support hooks. This should not be confused with the vue\
    \ hooks.\n\nFollowing is the list of hooks (As per the Vue official documents\
    \ https://vuejs.org/v2/guide/custom-directive.html#Hook-Functions) supported by\
    \ custom directives and their descriptions.\n\n-   **bind**: Called only once,\
    \ when the directive is first bound to the element. This is where you can do one-time\
    \ setup work.\n-   **inserted**: Called when the bound element has been inserted\
    \ into its parent node (this only guarantees parent node presence, not necessarily\
    \ in-document).\n-   **update**: Called after the containing component's VNode\
    \ has updated, but possibly before its children have updated. The directive's\
    \ value may or may not have changed, but you can skip unnecessary updates by comparing\
    \ the binding's current and old values (see below on hook arguments).\n-   **componentUpdate**:\
    \ Called after the containing component's VNode and the VNodes of its children\
    \ have updated.\n-   **unbind**: Called only once, when the directive is unbound\
    \ from the element.\n\nThe most popular hooks are `bind` and `inserted`.\n\n```javascript\n\
    Vue.directive(\"custom-hook\", {\n    bind(el) {\n        el.style.color = \"\
    red\";\n        console.log(\"Bind\");\n    },\n    inserted(el) {\n        el.style.color\
    \ = \"blue\";\n        console.log(\"Inserted\");\n    }\n});\n```\n\nSince we\
    \ are referring to a single element here, we can only see the color changed to\
    \ blue only. Since the inserted hook gets executed after bind, the red color won’t\
    \ be visible. But certainly, we can see the sequence of the hooks executed in\
    \ the console window.\n\n## Filters\n\nFilters are the options to apply additional\
    \ formatting upon the data in runtime. We can apply filters using the | (pipe)\
    \ symbol in data. There are two ways we can apply filters.\n\nMustache interpolation:\n\
    \n```html\n{{ message | reverse}}\n```\n\nv-bind expression:\n\n```html\n<div\
    \ v-bind:id=\"recordid | formatfilter\"></div>\n```\n\nLet’s create a custom filter\
    \ to reverse the data. We will define the filter inside a component. We will create\
    \ a new component and add this in it.\n\n```html\n{{ message | reverse }}\n```\n\
    \nWe have used the filters section to define the filter method.\n\nPoint to note\
    \ here, in the filter function we have accepted a value parameter. But have not\
    \ passed any value when we have called the same filter inside the mustache interpolation\
    \ of the template. Because, it accepts the data result as the default input to\
    \ the value parameter. So, whenever we have added a filter, it accepts the data\
    \ as the value parameter.\n\nIn the above example, we have used the `message`\
    \ as a data variable and added a fixed string into it as “Learn”. In the reverse\
    \ filter, we have reversed the message data.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_57_0.png)\n\
    \nFigure 6.6: filter applied on string\n\n### Multiple parameters in filters\n\
    \nWe can also pass multiple parameters into a filter. In the above example, we\
    \ have only one parameter as value. But we can also pass multiple parameters into\
    \ a filter.\n\nIn order to see how multiple params work, we will create another\
    \ filter to append a fixed string to the data value.\n\n```html\n{{ message |\
    \ append_string(\" - It is actually fun.\") }}\n```\n\nIn this filter function,\
    \ we have two params `value` and `fixedString`. We can notice, in the template,\
    \ we have only passed value for one parameter i.e the second parameter.\n\nAs\
    \ stated above, the data value automatically gets set as the first parameter to\
    \ the filter function. So, we need to pass the second param only.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_58_0.png)\n\
    \n**Learn - It is actually fun.**\n\nFigure 6.7: Applying multiple params in filter\
    \ on a string\n\n### Chain of filters\n\nWe can apply multiple filters to one\
    \ data too. They work in sequence. That means, the data value or the result of\
    \ the last filter would be the input value of the next filter.\n\nWe will use\
    \ the above example to reverse the data, capitalize the reversed data and append\
    \ the static string to it.\n\n```html\n{{ message | reverse | capitalize | append_string(\"\
    \ - This string is reversed.\") }}\n```\n\nWe have defined three (`reverse`, `capitalize`,\
    \ and `append_string`) filters and used in the interpolation. As per the sequence\
    \ of the filters, `message` is the input value of the `reverse` filter. The result\
    \ of the `reverse` filter would be the input of the `capitalize` filter and the\
    \ result of this filter would be the input of the `append_string` filter.\n\n\
    So, it first reverse the string. Then makes the reversed string capitalize. Then\
    \ adds a fixed string to the reversed and capitalized string.\n\n![](img/2c298ca86478005a0a21c9796cebbd15_58_1.png)\n\
    \n**Nrael - This string is reversed.**\n\nFigure 6.8: Chain of filters applied\
    \ on a string\n\n### Global filter\n\nIn the above examples, we have defined the\
    \ filters inside the component. So, they can only be accessed inside the component\
    \ only. We can also declare the global filters, which gets associated with the\
    \ Vue object.\n\nLet's create the same reverse filter globally to make it accessible\
    \ throughout the application. We can define the same globally. If we are using\
    \ Vue CLI, then `main.js` is one of the best suited places to define the same.\n\
    \n```javascript\nVue.filter('reverse', function(value) {\n    value = value.toString()\n\
    \    var revString = \"\"\n    for(var i=0; i<=value.length-1; i++){\n       \
    \ revString = value.charAt(i) + revString\n    }\n    return revString\n})\n```\n\
    \nAs we can see in the preceding code, to make it global we need to add the filter\
    \ to the Vue object.\n\n## Plugin\n\nWhen you want to have some global functionality\
    \ packaged together into one file and can be referenced anywhere in your project,\
    \ you should definitely use a Plugin.\n\njQuery is a very good example of Plugin,\
    \ moreover, we can easily create a Plugin with Vue. You can use all Vue concepts\
    \ inside the Plugin to build it. Components, Mixins, Filters, and so on can go\
    \ inside the Plugin to make it more effective and reusable for different apps.\n\
    \nPlugin is a good way to keep your Vue components clear and small. The biggest\
    \ advantage is, you can package and share with the world or within your company\
    \ for all developers to consume it in their apps.\n\nWriting plugin is not difficult.\
    \ Here is the skeleton of a plugin. It's just a JavaScript object with an `install`\
    \ method.\n\n```javascript\nMyPlugin.install = (Vue, options) => {\n    // Plugin\
    \ functionality.\n}\n```\n\nThis `install` method takes two params, `Vue` and\
    \ `options`. These options are used to customize the plugin usage to fit specific\
    \ needs. We will gradually see how to work with these params.\n\nLet's start with\
    \ a simple one. After creating a project through Vue CLI, add the following code\
    \ inside a file, for example `myPlugin.js`.\n\n```javascript\nexport default {\n\
    \    name: 'myPlugin',\n    install: function (Vue, options) {\n        console.log(\"\
    Install started\");\n        // 1. add global method or property\n        Vue.prototype.$myGlobalMethod\
    \ = function () {\n            // some logic ...\n            console.log(\"Global\
    \ Method called!\");\n        }\n    }\n}\n```"
  mdcn: "\n此处的参数被放置在一个 `switch-case` 结构中。根据传入的参数，它将执行相应的任务。为了说明这一点，我们为低、中、高分别设置了 5\
    \ 秒、10 秒和 20 秒的间隔，以改变信号灯颜色。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_55_0.png)\n\
    \n图 6.4：实现向自定义指令传递参数的交通信号灯应用\n\n## 向自定义指令传递修饰符\n\n我们可以向自定义指令传递修饰符。与上面不同，修饰符将使用\
    \ `.`（点）进行传递。\n\n```html\n<div v-markText.underline.makeCapital>Mark the text</div>\n\
    ```\n\n在上面的 HTML 中，我们向自定义指令 `v-markText` 传递了多个修饰符。格式化将根据修饰符出现的顺序进行。\n\n```javascript\n\
    Vue.directive('markText', function(el, binding) {\n    if(binding.modifiers.underline){\n\
    \        el.style.textDecoration = \"underline\";\n    }\n    if(binding.modifiers.makeCapital){\n\
    \        el.style.textTransform = \"uppercase\";\n    }\n    if(binding.modifiers.makeHeading){\n\
    \        el.style.fontSize = '50px';\n        el.style.fontWeight = 'bold';\n\
    \    }\n    if(binding.modifiers.highlight){\n        el.style.backgroundColor\
    \ = \"yellow\";\n    }\n})\n```\n\n文本将根据自定义指令中指定的修饰符进行格式化。\n\n## 自定义指令中的钩子\n\n\
    自定义指令也支持钩子。这不应与 Vue 的钩子混淆。\n\n以下是自定义指令支持的钩子列表（根据 Vue 官方文档 https://vuejs.org/v2/guide/custom-directive.html#Hook-Functions\
    \ ）及其描述。\n\n-   **bind**：仅在指令首次绑定到元素时调用一次。这是你可以执行一次性设置工作的地方。\n-   **inserted**：当绑定元素已插入其父节点时调用（这仅保证父节点存在，但不一定在文档中）。\n\
    -   **update**：在包含组件的 VNode 更新后调用，但可能在其子节点更新之前。指令的值可能已更改也可能未更改，但你可以通过比较绑定的当前值和旧值来跳过不必要的更新（请参见下面的钩子参数部分）。\n\
    -   **componentUpdate**：在包含组件的 VNode 及其子节点的 VNode 更新后调用。\n-   **unbind**：仅在指令从元素解绑时调用一次。\n\
    \n最受欢迎的钩子是 `bind` 和 `inserted`。\n\n```javascript\nVue.directive(\"custom-hook\"\
    , {\n    bind(el) {\n        el.style.color = \"red\";\n        console.log(\"\
    Bind\");\n    },\n    inserted(el) {\n        el.style.color = \"blue\";\n   \
    \     console.log(\"Inserted\");\n    }\n});\n```\n\n由于我们这里引用的是单个元素，所以只能看到颜色变为蓝色。因为\
    \ `inserted` 钩子在 `bind` 之后执行，所以红色不会显示出来。但是，我们肯定可以在控制台窗口中看到钩子执行的顺序。\n\n## 过滤器\n\
    \n过滤器是在运行时对数据应用额外格式化的选项。我们可以在数据中使用 `|`（管道）符号应用过滤器。有两种应用过滤器的方法。\n\nMustache 插值：\n\
    \n```html\n{{ message | reverse}}\n```\n\nv-bind 表达式：\n\n```html\n<div v-bind:id=\"\
    recordid | formatfilter\"></div>\n```\n\n让我们创建一个自定义过滤器来反转数据。我们将在一个组件内部定义该过滤器。我们将创建一个新组件并将此过滤器添加到其中。\n\
    \n```html\n{{ message | reverse }}\n```\n\n我们使用了 `filters` 部分来定义过滤器方法。\n\n这里需要注意的一点是，在过滤器函数中我们接受了一个\
    \ `value` 参数。但在模板的 mustache 插值中调用同一个过滤器时，我们没有传递任何值。因为它默认接受数据结果作为 `value` 参数的输入。所以，每当我们添加一个过滤器时，它都接受数据作为\
    \ `value` 参数。\n\n在上面的例子中，我们使用了 `message` 作为数据变量，并向其添加了一个固定字符串 “Learn”。在 `reverse`\
    \ 过滤器中，我们反转了 `message` 数据。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_57_0.png)\n\
    \n图 6.6：应用于字符串的过滤器\n\n### 过滤器中的多个参数\n\n我们还可以向过滤器传递多个参数。在上面的例子中，我们只有一个参数 `value`。但我们也可以向过滤器传递多个参数。\n\
    \n为了了解多个参数如何工作，我们将创建另一个过滤器，将一个固定字符串附加到数据值。\n\n```html\n{{ message | append_string(\"\
    \ - It is actually fun.\") }}\n```\n\n在这个过滤器函数中，我们有两个参数 `value` 和 `fixedString`。我们可以注意到，在模板中，我们只传递了一个参数的值，即第二个参数。\n\
    \n如上所述，数据值会自动设置为过滤器函数的第一个参数。因此，我们只需要传递第二个参数。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_58_0.png)\n\
    \n**Learn - It is actually fun.**\n\n图 6.7：在字符串过滤器上应用多个参数\n\n### 过滤器链\n\n我们也可以对一个数据应用多个过滤器。它们按顺序工作。这意味着，数据值或上一个过滤器的结果将是下一个过滤器的输入值。\n\
    \n我们将使用上面的例子来反转数据，将反转后的数据首字母大写，并附加一个静态字符串。\n\n```html\n{{ message | reverse |\
    \ capitalize | append_string(\" - This string is reversed.\") }}\n```\n\n我们定义了三个过滤器（`reverse`、`capitalize`\
    \ 和 `append_string`）并在插值中使用。根据过滤器的顺序，`message` 是 `reverse` 过滤器的输入值。`reverse` 过滤器的结果将是\
    \ `capitalize` 过滤器的输入，而这个过滤器的结果将是 `append_string` 过滤器的输入。\n\n因此，它首先反转字符串。然后将反转后的字符串首字母大写。最后向反转并首字母大写的字符串添加一个固定字符串。\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_58_1.png)\n\n**Nrael - This string\
    \ is reversed.**\n\n图 6.8：应用于字符串的过滤器链\n\n### 全局过滤器\n\n在上面的例子中，我们在组件内部定义了过滤器。因此，它们只能在组件内部访问。我们也可以声明全局过滤器，这些过滤器与\
    \ Vue 对象相关联。\n\n让我们全局创建相同的 `reverse` 过滤器，使其在整个应用程序中可访问。我们可以全局定义它。如果我们使用 Vue CLI，那么\
    \ `main.js` 是定义它的最佳位置之一。\n\n```javascript\nVue.filter('reverse', function(value)\
    \ {\n    value = value.toString()\n    var revString = \"\"\n    for(var i=0;\
    \ i<=value.length-1; i++){\n        revString = value.charAt(i) + revString\n\
    \    }\n    return revString\n})\n```\n\n正如我们在前面的代码中看到的，要使其全局化，我们需要将过滤器添加到 Vue\
    \ 对象。\n\n## 插件\n\n当你希望将一些全局功能打包到一个文件中，并且可以在项目中的任何地方引用时，你肯定应该使用插件。\n\njQuery 是插件的一个很好的例子，此外，我们可以轻松地使用\
    \ Vue 创建插件。你可以在插件内部使用所有 Vue 概念来构建它。组件、混入、过滤器等都可以放入插件中，使其对不同的应用程序更加有效和可重用。\n\n\
    插件是保持你的 Vue 组件清晰和小巧的好方法。最大的优点是，你可以打包并与世界或公司内的所有开发者共享，以便他们在自己的应用中使用它。\n\n编写插件并不困难。这是一个插件的框架。它只是一个带有\
    \ `install` 方法的 JavaScript 对象。\n\n```javascript\nMyPlugin.install = (Vue, options)\
    \ => {\n    // Plugin functionality.\n}\n```\n\n这个 `install` 方法接受两个参数 `Vue` 和\
    \ `options`。这些选项用于自定义插件的使用以适应特定需求。我们将逐步了解如何使用这些参数。\n\n让我们从一个简单的开始。通过 Vue CLI 创建一个项目后，在一个文件（例如\
    \ `myPlugin.js`）中添加以下代码。\n\n```javascript\nexport default {\n    name: 'myPlugin',\n\
    \    install: function (Vue, options) {\n        console.log(\"Install started\"\
    );\n        // 1. add global method or property\n        Vue.prototype.$myGlobalMethod\
    \ = function () {\n            // some logic ...\n            console.log(\"Global\
    \ Method called!\");\n        }\n    }\n}\n```\n"
