    \ \"components\" 文件夹中。\n\n让我们通过 `npm run serve` 命令运行应用程序，看看是否有效。\n\n![](img/2c298ca86478005a0a21c9796cebbd15_66_0.png)\n\
    \n有趣！没有输出。这是显而易见的，因为我们还没有在 `App.vue` 中包含 `AppRouter` 组件。\n\n现在再次运行它，它将显示以下输出！\n\
    \n![](img/2c298ca86478005a0a21c9796cebbd15_67_0.png)\n\n图 7.2：简单路由示例\n\n在这里我们可以看到图片中并排显示的四个输出。仔细看看这些\
    \ URL。`Localhost:8080` 和 `localhost:8080/home` 加载的是同一个页面 `Home.vue`。这正是我们在路由对象中声明的那样。`About`\
    \ 和 `Contact` 组件也分别为 `localhost:8080/about` 和 `localhost:8080/contact` 加载。\n\n\
    然而，在一个功能齐全的生产应用中，页面是相互链接的。也就是说，存在用于从一个页面导航到另一个页面的链接。如下所示：\n\n![](img/2c298ca86478005a0a21c9796cebbd15_67_1.png)\n\
    \n图 7.3：带有导航链接的路由\n\n为此，我们可以在 `App.vue` 中添加一个包含路由的无序列表。\n\n- 首页\n- 关于\n- 联系\n\n\
    这里的 `loadPage` 是一个方法，它会将路由加载到 `window.location` 中。\n\n```\nexport default {\n\
    \  components: {\n    AppRouter\n  },\n  methods: {\n    loadPage(route) {\n \
    \     window.location = route;\n    }\n  }\n};\n```\n\n有了这段代码，我们可以看到上面的输出，每个页面上都有链接，这些链接会根据请求的\
    \ URL 加载特定的组件。\n\n到目前为止我们讨论的一切都适用于页面的常规加载，也就是说，当你点击链接时，页面会重新加载，内容会发生变化。然而，在 SPA\
    \ 的情况下，页面会动态加载内容而无需重新加载。这正是我们将在下一个内容中学习的内容。\n\n## SPA 中的路由\n\n通过对上面的代码进行一些更改，我们可以为单页应用实现路由。基本上，页面不应该重新加载。HTML5\
    \ History 模式将帮助我们管理页面历史。让我们开始吧。\n\nHistory API 有不同的方法可供我们使用。`pushState` 方法将替换\
    \ `window.location` 并且不会执行重新加载。让我们更新 `App.vue` 以实现 `pushState` 方法。\n\n```\nloadPage(route)\
    \ {\n  //window.location = route;\n  history.pushState(null, null, route)\n}\n\
    ```\n\n现在让我们先不关注前两个参数。第三个参数是传递的路由。\n\n下一步是对路由变化做出反应。如果你还记得，`AppRouter` 组件帮助我们渲染实际页面。这意味着\
    \ `routedComponent` 计算属性应该更新，这也就意味着需要更新 `this.current` 变量。我们一会儿会看到这是如何完成的。但在此之前，让我们将历史相关的操作模块化。将其命名为\
    \ `history.js`。\n\n首先添加 `push` 方法。\n\n```\nexport const push = route => {\n  window.history.pushState(null,\
    \ null, route);\n};\n```\n\nHistory 还需要监听路由的变化，为此，我们需要实现一个名为 `listen` 的方法，该方法将回调函数存储在一个\
    \ `listeners` 数组中。\n\n```\nconst listeners = [];\n\nexport const push = route\
    \ => {\n  window.history.pushState(null, null, route);\n};\n\nexport const listen\
    \ = fn => {\n  listeners.push(fn);\n};\n```\n\n现在，`push` 方法应该承担通知的责任，通过迭代 `listeners`\
    \ 并调用回调函数，将路由作为参数传递。\n\n```\nexport const push = route => {\n  const previousRoute\
    \ = window.location.pathname;\n  window.history.pushState(null, null, route);\n\
    \  listeners.forEach(listener => listener(route, previousRoute));\n};\n```\n\n\
    我们已经完成了 history 模块，让我们开始在 `App.vue` 中使用它。\n\n```\nimport AppRouter from \"./components/AppRouter.vue\"\
    ;\nimport { push } from \"./history\";\nexport default {\n  components: {\n  \
    \  AppRouter\n  },\n  methods: {\n    loadPage(route) {\n      //window.location\
    \ = route;\n      //history.pushState(null, null, route)\n      push(route);\n\
    \    }\n  }\n};\n```\n\n我们现在不再直接使用 `history.pushState` 方法，而是直接调用位于 `history.js`\
    \ 内的 `push` 方法。\n\n我们还有更多的工作要做。当我们在页面之间导航时，`AppRouter` 组件应该知道路由的变化。这是因为有一个 `this.current`\
    \ 变量存储着当前路由。\n\n```\n// 其他代码在这里...\nimport { listen } from \"../history\";\nexport\
    \ default {\n  created() {\n    listen((route, previousRoute) => {\n      this.current\
    \ = route\n    })\n  }\n  // 更多代码...\n};\n```\n\n在 `created` 钩子中调用 `listen` 方法是因为我们需要一次设置监听机制。这是因为下次为后续请求调用\
    \ `push` 时，其他一切都会自动工作。如果你看 `AppRouter` 内部的 `push` 方法，它实际上调用了注册到监听器数组中的方法。\n\n\
    现在，如果你运行应用程序，它会在按钮点击时更改路由和页面内容。但是，如果你点击浏览器的后退和前进按钮，它将不会起作用。\n\n为了完成 SPA 路由，我们需要在\
    \ `AppRouter` 中添加另一小段代码，完整的代码如下所示：\n\n```\nexport default {\n  created() {\n \
    \   listen((route, previousRoute) => {\n      debugger;\n      this.current =\
    \ route\n    });\n    window.addEventListener(\n      \"popstate\",\n      event\
    \ => (this.current = window.location.pathname)\n    );\n  },\n  data() {\n   \
    \ return { current: window.location.pathname };\n  },\n  computed: {\n    routedComponent()\
    \ {\n      return routes[this.current];\n    }\n  }\n};\n```\n\n因此，当我们点击浏览器的后退和前进按钮时，会调用\
    \ `popstate` 方法，从而设置 `this.current` 的值。\n\n这样，我们就完成了使用 Vue 的 SPA 路由。你可以在 Github\
    \ 上找到代码。尝试一下，看看当你点击页面上的按钮或浏览器的后退和前进按钮时，你是否可以看到页面内容动态更新而无需页面加载。\n\n## 状态管理\n\n\
    组件是 Vue 应用程序的基本构建块。应用程序每次在发生变化时如何向我们显示更新后的数据，这一点很重要。这意味着数据更新应确保组件之间的完整性。\n\n让我们通过一个逐步示例来了解如何在\
    \ Vue JS 应用程序中管理数据状态。\n"
