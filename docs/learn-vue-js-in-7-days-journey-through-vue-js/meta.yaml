    Let''s assume, we have multiple components and they share some common functionality.
    So in order to accommodate it, we need to merge the component with each other.
    So that we can only expose one component without creating repetitive code. But
    the there is another issue with this approach, if we merge the components into
    one then both components will get some extra functionalities which are not really
    needed for them.


    To solve this kind of problem, we can take the help from Mixin. We can put those
    common functionalities in a mixin and use the same mixin in both the components.
    In this way, we don''t need to merge the components.


    In the below example, we will have two components with email validation in common.
    We will wrap that common functionality in a mixin. We will mix that mixin in both
    the components so that they can avail the email validation in both.


    In this example, we will create a mixin called EmailValidationMixin . We can follow
    a separate folder structure for the same.


    ![](img/2c298ca86478005a0a21c9796cebbd15_47_0.png)


    The folder structure is not mandatory. For the shake of increase in readability
    and maintainability we have placed the same in a separate folder.


    The mixin is a JavaScript file, which contains code for mixin.


