    \ Store Getter .\n\nThus, the whole flow can be described as an Action triggers\
    \ a Mutation . Then Mutation mutates the state of data which then affects the\
    \ View and Components because Getters are used to retrieve the data from Store.\n\
    \nThe reason we discussed the above is because we are going to use them in the\
