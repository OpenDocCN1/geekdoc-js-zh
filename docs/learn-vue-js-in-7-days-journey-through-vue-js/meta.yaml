    \    </div>\n    <div class=\"row\">\n        <div class=\"col-2\">State</div>\n\
    \        <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"\
    contact_state\" /></div>\n    </div>\n    <div class=\"row\">\n        <div class=\"\
    col-2\">Pin code</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"contact_pincode\" /></div>\n    </div>\n</fieldset>\n<fieldset\
    \ class=\"container\">\n    <legend>Shipping address</legend>\n    <div class=\"\
    row\">\n        <div class=\"col-2\">Address Line 1</div>\n        <div class=\"\
    col-6\"><input type=\"text\" class=\"full-width\" v-model=\"shipping_address_line1\"\
    \ /></div>\n    </div>\n    <div class=\"row\">\n        <div class=\"col-2\"\
    >Address Line 2</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"shipping_address_line2\" /></div>\n    </div>\n    <div\
    \ class=\"row\">\n        <div class=\"col-2\">City</div>\n        <div class=\"\
    col-6\"><input type=\"text\" class=\"full-width\" v-model=\"shipping_city\" /></div>\n\
    \    </div>\n    <div class=\"row\">\n        <div class=\"col-2\">State</div>\n\
    \        <div class=\"col-6\"><input type=\"text\" class=\"full-width\" v-model=\"\
    shipping_state\" /></div>\n    </div>\n    <div class=\"row\">\n        <div class=\"\
    col-2\">Pin code</div>\n        <div class=\"col-6\"><input type=\"text\" class=\"\
    full-width\" v-model=\"shipping_pincode\" /></div>\n    </div>\n</fieldset>\n\
    ```\n\n不仅需要复制和粘贴相同的控件，我们还需要为每个控件设置重复的模型变量集。如图所示，相同的 `address_line1` 需要为联系地址、收货地址、账单地址等分别定义。这会产生大量重复代码，降低可读性，使代码维护处于风险之中。\n\
    \n### 如何避免这种情况？\n\n组件就是答案。我们需要组件来避免代码中的这些重复。\n"
