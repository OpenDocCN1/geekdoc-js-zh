    ## 关于作者


    ## 尼尔马尔·霍塔


    他是一名软件开发人员和导师。他热爱学习并从事不同技术领域的工作。他曾参与过多种微软技术的开发，如C#、VB、ASP.net、Dynamics CRM、Commerce
    Server等。同样值得一提的是他在开源和移动应用技术方面的专长，如Ruby on Rails、Phonegap、TypeScript、Xamarin等。他热衷于探索基于JavaScript的各种平台，包括Angular、React和Vue。


    他还是一名微软认证技术专家（MCTS），认证领域为Asp.Net和Dynamics CRM。此外，他还是一名钛金认证应用开发者（TCAD）和敏捷Scrum大师。


    除了开发软件，他将时间投入到技术社区活动、博客和制作屏幕录制视频中。因其技术博客活动和写作技巧，DZone也认可他为最具价值博主。乌特卡尔技术爱好者论坛（UTF）和TechBhubaneswar是印度奥里萨邦两个领先的技术社区。在这些社区中，尼尔马尔作为核心小组成员积极参与。他还在印度国内外的各种会议、学校、学院和大学进行各种技术主题的演讲。India
    Mentor也在其网站上介绍他，以表彰他为社区提供指导的活动。


    他的领英：

    linkedin.com/in/nirmalhota


    他的网站

    nirmalhota.com


    ## 塔迪特·达什


    他是一名职业软件工程师。作为一名软件工程师，他通常每天工作八到九个小时。除了日常工作，他还为线上和线下社区做贡献。他共同创立了他所在州的第一个技术社区——乌特卡尔技术爱好者论坛奥里萨分会，该社区致力于向技术人员普及最新的技术趋势。


    他为程序员同行撰写文章和博客，并制作演示和视频。回答在线论坛和社交渠道上的问题是他最喜欢的活动。


    由于他对技术社区的杰出贡献，微软在2014年至2018年期间授予他微软最有价值专家称号。CodeProject授予他CodeProject MVP称号（奥里萨邦首位，2014、2015和2016年连续三年获得）。因其持续的指导工作，IndiaMentor在其网站上将他介绍为青年导师。


    他也获得了DZone的认可，并被授予最具价值博主称号。

    在他的课程中激励学生是他广为人知的一点。他是一位常规的技术和励志演讲者。他曾多次在不同社区组织的各种本地活动中演讲。他曾是尼泊尔DevTechDay的特邀演讲者。


    他合著的以下两本书在亚马逊上获得了畅销书排名，并入选了Book Authority的“有史以来最佳ASP.NET书籍”。


    - .NET Core 2.0依赖注入

    - 使用.NET Core构建RESTful Web服务


    您可以在Facebook、Twitter和Instagram上通过账号@taditdash联系他。


    他的领英：

    linkedin.com/in/taditdash

    他的网站

    taditdash.wordpress.com

    taditdash.co.in


    ## 维沙尔·贾恩博士


    自2017年7月至今，他一直担任新德里GGSIPU附属、AICTE认证的巴拉蒂维迪亚佩斯计算机应用与管理研究所（BVICAM）的副教授。维沙尔·贾恩博士已获得哈里亚纳邦法里达巴德林加亚大学计算机科学与工程博士学位、古鲁戈宾德·辛德拉德拉普拉沙迪大学大学信息技术学院（USIT）计算机科学与工程硕士学位、密鲁特肖比特大学人力资源管理硕士学位、锡金锡金曼尼帕尔大学计算机应用硕士学位。此外，他还获得了DOEACC
    "A"级和DOEACC "O"级认证、A.M Informatics计算机软件培训研究生文凭、ET&T（德里）计算机软件培训高级文凭、金奈全印度管理研究学院商业管理文凭、牛津计算机教育（德里）编程文凭、微软认证专家（通过070-210、070-215两个模块）和思科认证网络管理员（CCNA）。他于2012-13年度获得了印度计算机协会颁发的青年活跃会员奖。维沙尔·贾恩博士曾担任印度计算机协会德里分会德里州学生协调员（2014-2016年）。他的研究领域包括语义网、本体工程、云计算、大数据分析和自组织网络。


    他的领英：


    linkedin.com/in/vishaljain83


    他的网站


    vishaljain.webs.com


    ## 致谢


    本书之所以能成为现实，是由于我父母（尼兰詹·霍塔先生和比什努普里亚·霍塔女士）的祝福和鼓励。在全职工作一天后花时间写书是一个巨大的挑战，而我身边的家人不断地激励我实现这一目标。


    我非常感谢我的妻子（苏布什里·霍塔）、我的兄弟（尼克尔·霍塔）、我的姐妹们（西卢和米卢）、我的姐夫们（迪利普和沙克蒂）以及可爱的孩子们（加古、塔图和基图）的爱与支持。


    我衷心感谢并尊敬我的导师桑塔努·莫哈帕特拉先生，是他点燃了我知识的火花。我也感谢著名作家和导师高拉夫·阿罗拉先生，感谢他对我无数的支持和关爱。同时，我向本书的合著者维沙尔·贾恩博士表示感谢和敬意，感谢他在这一时期的指导。


    感谢合著者、同事和我的小兄弟塔迪特·达什，是您激发了我的最佳状态。我还要感谢苏文杜·谢卡尔·吉里、苏里亚·纳拉扬·巴里克、普拉瓦西尼·萨胡、苏拉杰·萨胡、拉梅什·巴里克、索拉夫·南达和UTF，感谢他们帮助我发掘自我。


    非常感谢我的同事基兰·库马尔·辛格先生和德本德拉·南迪，感谢他们教我应对各种挑战的不同方法。最后，非常感谢BPB出版社将这一切变为现实。


    – 尼尔马尔·霍塔


    我想将这本书献给我已故的祖父加内什瓦尔·特里帕蒂。


    我的祖母桑蒂普里亚·特里帕蒂、父亲戈宾达·钱德拉·达什博士、母亲萨斯米塔·特里帕蒂女士和兄弟特沃里特·达什确保我在写作期间始终保持充沛的精力（健康的饮食）和信心。我的叔叔阿尼尔·特里帕蒂先生、阿斯温·特里帕蒂先生和阿米亚·特里帕蒂先生总是指导我制定应对新挑战的方法。苏贾塔·特里帕蒂女士像母亲一样照顾我，而我的叔叔德本德拉·拉特先生从不错过任何机会与我讨论想法，以强化我的思考，从而让我交付最佳成果。

    '
