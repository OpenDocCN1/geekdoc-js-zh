    \ hook gets implemented in the mixin. Also, the same hook implemented in the component.\
    \ In this situation, Mixin wins the race. The hook defined in the mixin gets invoked\
    \ first, followed by the hook in the component.\n\n```\nexport const EmailValidatorMixin\
    \ = {\n\n    created: function(){\n\n        alert(\"Mixin created\");\n\n   \
    \ },\n}\n```\n\n```\nmethods: {\n\n    validate_email: function(email){\n\n  \
    \      if(email == \"\"){\n\n            alert(\"Please enter email\");\n\n  \
    \          return false;\n        }\n\n        var mailformat = /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\\\
    .[A-Z]{2,4}$/igm;\n\n        if (mailformat.test(email)){\n\n            alert(\"\
    Email is Valid\");\n\n        }\n\n        else{\n\n            alert(\"Invalid\
    \ email\");\n\n        }\n\n    }\n\n}\n}\n}\n```\n\nAs shown in the example,\
    \ we have added an alert in the created hook of the mixin. Now, let's add the\
    \ same in one of our component to test it.\n\n```\nimport {EmailValidatorMixin}\
    \ from '../mixins/EmailValidator.js'\n\nexport default {\n\n    name: \"CustomerValidation\"\
    ,\n\n    data() {\n\n        return{\n\n            cust_email: \"\",\n\n    \
    \        cust_num: \"\"\n\n        }\n\n    },\n\n    mixins: [EmailValidatorMixin],\n\
    \n    methods: {\n\n        validate_customer: function(){\n\n            if(this.cust_num\
    \ == \"\"){\n\n                alert(\"Please enter Customer Number\");\n\n  \
    \              return false;\n            }\n\n            if(this.cust_num.indexOf(\"\
    CN\") == -1){\n\n                alert(\"Invalid Customer Number\");\n\n     \
    \       }\n\n            else{\n\n                alert(\"Customer Number is Valid\"\
    );\n            }\n        }\n    },\n\n    created: function(){\n\n        alert(\"\
    Component created\");\n\n    }\n}\n```\n\nAs seen in the code we have use two\
    \ alerts to check the execution sequence. When we run it in the browser, the alert\
    \ message in the mixin is displayed first, and then the alert in the component.\n\
    \n## Merging in mixins\n\nAs learnt previously, mixin gets merged with the component.\
    \ That also means, the data object in the mixin also gets merged with the components\
    \ too.\n\n```\nexport const DataMergerMixin = {\n\n    data: function(){\n\n \
    \       return{\n\n            message : \"Message from mixin\"\n\n        }\n\
    \n    }\n\n}\n```\n\nWe will define some data in the components.\n\n```\n    \
    \    {{ $data }}\n```\n\nThe result of {{ $data }} would be the combination of\
    \ both data object.\n\n```\n{ \"component_message\": \"This is a component message\"\
    , \"message\": \"Message from mixin\" }\n```\n\nPoint to note here, if the data\
    \ variable names would be same in both mixin and the components, then the data\
    \ variable of the component will only get printed. Let's rename the component_message\
    \ variable in the components as message.\n\n```\n        {{ $data }}\n```\n\n\
    Now, both the data variable in mixin and component are same. So, the output will\
    \ be overridden by the component.\n\n```\n{ \"message\": \"This is a component\
    \ message\" }\n```\n\n## Conflicting functions\n\nLike conflicting data variables,\
    \ in case of the conflicting functions between the component and mixin, the function\
    \ in component overrides the value.\n\n## Global Mixin\n\nMixin defined in the\
    \ global scope will be accessible to all the components. In a CLI built vue application,\
    \ we can define a mixin in the main.js.\n\n```\nVue.mixin({\n\n  methods: {\n\n\
    \    showAppInfo: function () {\n\n      alert(\"Learn Vue In 7 Days\")\n\n  \
    \  }\n\n  }\n\n})\n```\n\nWe have added a method named as showAppInfo, to show\
    \ the application information. This should be globally accessible to all the components.\n\
    \n## Custom Directives\n\nWe have learnt many directives in Vue having v- as a\
    \ prefix. Directives like v-model, v-if, and so on we have learnt are the supported\
    \ directives by Vue.\n\nNow, let's create our own custom directives. As the name\
    \ suggests, the custom directives will behave in a custom way.\n\n## Creating\
    \ custom directives\n\nTo create the custom directive, we need to use the Vue\
    \ object. Directives will be added to the Vue object of the application.\n\n```\n\
    Vue.directive('campaign name',\n\n  function(el, binding, vnode) {\n\n})\n```\n\
    \nIn the function, it accepts the following parameters to deal with the user and\
    \ data.\n\n- el : This stands for element. It returns the DOM object with which\
    \ the directive is associated with.\n- binding : It contains the information about\
    \ the params, formatters, and so on.\n- vnode : vnode keeps the track of the parent\
    \ DOM element.\n\nLet's create our first custom directives. We are using the Vue\
    \ CLI environment to write the code. We will add the directive to main.js and\
    \ keep accessing them.\n\n```\nVue.directive('highlight',\n\n  function(el, binding,\
    \ vnode) {\n\n    el.style.fontSize = '50px';\n\n    el.style.fontWeight = 'bold';\n\
    \n  }\n\n)\n```\n\nAs shown in the above code, we have created a new custom directive\
    \ as highlight. It will set the font size and the font weight of the DOM element\
    \ it will get bind to.\n\n## Custom directive demo\n\nThe highlight directive\
    \ will be used in the HTML element with a v- prefix. Here, we have added the custom\
    \ directive to the DOM element. So that the formatting will be applied to that\
    \ element now.\n\n## Custom directive demo\n\n![](img/2c298ca86478005a0a21c9796cebbd15_53_0.png)\n\
    \nFigure 6.2: Browser console showing custom directive added to the element\n\n\
    When gets rendered on screen, the directives apply the changes on the DOM element\
    \ in runtime.\n\n## Passing values to custom directives\n\nIn the previous example,\
    \ we have created the custom directive, which accepts no value from the external\
    \ source. It sets the fixed formatting to the HTML element. We can also pass values\
    \ into the custom directives. Based on those passed values, custom directives\
    \ can also apply formatting.\n\n```\nVue.directive('notify',\n\n    function(el,\
    \ binding, vnode) {\n\n        var colour = (binding.value != undefined && binding.value\
    \ != \"\") ? binding.value : \"red\";\n\n        el.style.fontSize = '15px';\n\
    \n        el.style.fontWeight = 'bold';\n\n        el.style.color = colour;\n\n\
    \        el.style.backgroundColor='#ffcccc';\n\n    }\n\n)\n```\n\nIn the code\
    \ above, we have created a custom directive named as notify. We can pass values\
    \ from outside to set the formatting of the DOM element.\n\nIn this example, we\
    \ have applied the fixed formatting to the DOM element excluding the color. Then\
    \ color receives the dynamic values from the user. The default color set here\
    \ is, red. If no colors are available then the color of the element will be red,\
    \ else the user input will be used as the color.\n\nYou have successfully landed\
    \ in demo page\n\nWe have passed the color value from the HTML to the directive.\
    \ The value needs to be passed after the \"=\" sign within double quotes.\n\n\
    ![](img/2c298ca86478005a0a21c9796cebbd15_54_0.png)\n\n![](img/2c298ca86478005a0a21c9796cebbd15_54_1.png)\n\
    \nFigure 6.3: Showing the screenshot of styles applied by passing the value in\
    \ custom directory\n\nIn the browser, it renders with the custom color, as input\
    \ by the user along with the other fixed formatting.\n\n## Arguments passing to\
    \ custom directives\n\nLike value passing, we can also pass arguments into the\
    \ custom directives. To pass the arguments, we need to use : (colon) instead of\
    \ the equal sign.\n\n- Low Traffic\n- Moderate Traffic\n- High Traffic\n\nWe have\
    \ defined a dummy traffic light system with different amount of delays. Based\
    \ on the arguments (Low/Moderate/High) the traffic signal will behave accordingly.\n\
    \nAs seen in the above code, we have passed the arguments into the custom directives\
    \ using : (colon). Depending upon the argument, it will change the element style\
    \ to perform in the web page.\n\n```\nVue.directive('traffic', function(el, binding,\
    \ vnode){\n    var intervalObj;\n    var interval = 5000;\n    switch(binding.arg){\n\
    \        case \"low\":\n            interval = 5000;\n            break;\n   \
    \     case \"moderate\":\n            interval = 10000;\n            break;\n\
    \        case \"high\":\n            interval = 20000;\n    }\n});\n```"
  mdcn: "\n## 混入中的生命周期钩子\n\n让我们考虑一种情况，当生命周期钩子在混入中实现时，同时该钩子也在组件中实现。在这种情况下，混入会赢得这场竞争。混入中定义的钩子会首先被调用，然后才是组件中的钩子。\n\
    \n```\nexport const EmailValidatorMixin = {\n\n    created: function(){\n\n  \
