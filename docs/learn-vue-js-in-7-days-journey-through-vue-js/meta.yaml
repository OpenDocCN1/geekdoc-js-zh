  - "[PAGE 59]\n\nIn the above examples, we have defined the filters inside the component.\
    \ So, they can only be accessed inside the component only. We can also declare\
    \ the global filters, which gets associated with the Vue object.\n\nLet's create\
    \ the same reverse filter globally to make it accessible throughout the application.\
    \ We can define the same globally. If we are using Vue CLI, then main.js is one\
    \ of the best suited places to define the same.\n\n```\nVue.filter('reverse',\
    \ function(value) {\n\n  value = value.toString()\n\n  var revString = \"\"\n\n\
    \  for(var i=0; i<=value.length-1; i++){\n\n    revString = value.charAt(i) +\
    \ revString\n\n  }\n\n  return revString\n\n})\n```\n\nAs we can see in the preceding\
    \ code, to make it global we need to add the filter to the Vue object.\n\n# Plugin\n\
    \nWhen you want to have some global functionality packaged together into one file\
    \ and can be referenced anywhere in your project, you should definitely use a\
    \ Plugin.\n\njQuery is a very good example of Plugin, moreover, we can easily\
    \ create a Plugin with Vue. You can use all Vue concepts inside the Plugin to\
    \ build it. Components, Mixins, Filters, and so on can go inside the Plugin to\
    \ make it more effective and reusable for different apps.\n\nPlugin is a good\
    \ way to keep your Vue components clear and small. The biggest advantage is, you\
    \ can package and share with the world or within your company for all developers\
    \ to consume it in their apps.\n\nWriting plugin is not difficult. Here is the\
    \ skeleton of a plugin. It's just a JavaScript object with an install method.\n\
    \n```\nMyPlugin.install = (Vue, options) => {\n\n    // Plugin functionality.\n\
    \n}\n```\n\nThis install method takes two params, Vue and options. These options\
    \ are used to customize the plugin usage to fit specific needs. We will gradually\
    \ see how to work with these params.\n\nLet's start with a simple one. After creating\
    \ a project through Vue CLI, add the following code inside a file, for example\
    \ myPlugin.js .\n\n```\nexport default {\n\n  name: 'myPlugin',\n\n  install:\
    \ function (Vue, options) {\n\n    console.log(\"Install started\");\n\n    //\
    \ 1. add global method or property\n\n    Vue.prototype.$myGlobalMethod = function\
    \ () {\n\n      // some logic ...\n\n      console.log(\"Global Method called!\"\
    );\n\n    }\n\n  }\n\n}\n```"
- md: "As you see, it has install function which is mandatory. When you refer this\
    \ plugin in code, it would call this install function and execute everything inside\
    \ it. In our example, we have declared one prototype method named as $myGlobalMethod,\
    \ which simply logs to console.\n\nNote: $ can be added just for naming convention\
    \ for a global property/method.\n\nTo add this plugin to the project, we need\
    \ to update main.js as follows.\n\n```javascript\nimport Vue from 'vue'\nimport\
    \ App from './App.vue'\nimport MyPlugin from './plugins/myPlugin.js'\n\nVue.use(MyPlugin)\n\
    \nVue.config.productionTip = false\n\nnew Vue({\n  render: h => h(App),\n}).$mount('#app')\n\
    ```\n\nThe two highlighted lines are important. One tells Vue where the plugin\
    \ file is. I have kept it inside the plugins folder, so the code `import MyPlugin\
    \ from './plugins/myPlugin.js'` imports it from there. Next line registers the\
    \ plugin for the project using the `Vue.use()` global method. These are mandatory.\n\
    \nNext step is to do something with the plugin. As we have a global method inside\
    \ that, let's try to invoke that from a button. Quickly move to App.vue and add\
    \ a button with a click event.\n\nAnd of course, we need to define the `invokePluginMethod`\
    \ something like the following:\n\n```javascript\nexport default {\n  name: 'app',\n\
    \  components: {\n    HelloWorld\n  },\n  methods: {\n    invokePluginMethod:\
    \ function() {\n      this.$myGlobalMethod()\n    }\n  }\n}\n```\n\nThe code `this.$myGlobalMethod()`\
    \ actually invokes the method inside the plugin.\n\nNow, let's run and see what\
    \ happens!\n\n![Figure 6.9: Console Result for Plugin Install Started](img/2c298ca86478005a0a21c9796cebbd15_61_0.png)\n\
    \nI have opened the console at the bottom. You can see the message \"Install started\"\
    . This message was added inside the install function of the myPlugin.\n\nNext\
    \ step is to click the button \"Click Me\". As soon as you do that, you would\
    \ see a message on console saying, \"Global Method called!\". Take a look at the\
    \ following screenshot:\n\n![Figure 6.10: Console Result for Plugin Global Method\
    \ Invoke](img/2c298ca86478005a0a21c9796cebbd15_61_1.png)\n\nGenerally, plugins\
    \ are configurable. If you see the declaration, it contains a parameter in install\
    \ method, which we can pass like the following as an object.\n\n```javascript\n\
    Vue.use(MyPlugin, { delaySeconds: 4 })\n```\n\nAnd this can be used to configure\
    \ the plugin and do operations accordingly. Suppose, we want to delay the console\
    \ log using this value. We can do like the following:\n\n```javascript\nVue.prototype.$myGlobalMethod\
    \ = function () {\n    setTimeout(() => {\n        console.log(\"Global Method\
    \ called!\");\n    }, options.delaySeconds * 1000);\n}\n```\n\nHere, `options`\
    \ are the parameter to install method.\n\nPlugins are much more than adding global\
    \ methods. We can include mixins, components, directives, and so on. Let's add\
    \ one directive to show a text as \"Read more\" and \"Read less\".\n\nSo, we would\
    \ add one html paragraph element with the directive to indicate how many characters\
    \ we would like to show. And then after those characters, \"Read more...\" is\
    \ shown. The paragraph would look like:\n\n```html\n<p v-max-character-length=\"\
    70\">{{ feedbackText }}</p>\n```\n\nThe directive is `max-character-length` which\
    \ takes a value of 70. So, after 70 characters, we will show \"Read more...\"\
    . Let's design the directive inside the plugin.\n\nBasically, the structure would\
    \ look something like the following:\n\n```javascript\nconst ExpandSqueeze = {\n\
    \    install(Vue, options) {\n        Vue.directive('max-character-length', {\n\
    \            bind(el, binding, vnode, oldVnode) {\n                // Add logic\
    \ to show \"Read more...\" and \"Read less...\".\n            }\n        })\n\
    \    },\n};\n\nexport default ExpandSqueeze;\n```\n\nNow inside the `bind` event,\
    \ we need to create two anchor elements and with text as required. Also, we have\
    \ underlined and added cursor as pointer. Following is the clear code:\n\n```javascript\n\
    const readMoreLink = document.createElement('a');\nreadMoreLink.innerHTML = 'Read\
    \ more...';\nreadMoreLink.style.textDecoration = 'underline';\nreadMoreLink.style.cursor\
    \ = 'pointer';\n\nconst readLessLink = document.createElement('a');\nreadLessLink.innerHTML\
    \ = 'Read less...';\nreadLessLink.style.textDecoration = 'underline';\nreadLessLink.style.cursor\
    \ = 'pointer';\n```\n\nNext is to attach two events to these elements so that\
    \ when we click \"Read more...\", it shows all text and displays \"Read less...\"\
    \ and vice versa.\n\n```javascript\nreadMoreLink.addEventListener('click', showAllText);\n\
    readLessLink.addEventListener('click', showLimitedText);\n```\n\nThe events would\
    \ work as follows.\n\n```javascript\nconst showAllText = () => {\n    el.innerHTML\
    \ = `${currentHTML} `;\n    el.appendChild(readLessLink);\n}\n\nconst showLimitedText\
    \ = () => {\n    el.innerHTML = `${slicedHTML}... `;\n    el.appendChild(readMoreLink);\n\
    }\n```\n\n`showAllText` shows all the text with \"Read less...\" link and `showLimitedText`\
    \ shows limited text with \"Read more...\" link.\n\nPutting it together would\
    \ look something like the following:\n\n```javascript\nconst ExpandSqueeze = {\n\
    \    install(Vue, options) {\n        Vue.directive('max-character-length', {\n\
    \            bind(el, binding, vnode, oldVnode) {\n                const maxLimit\
    \ = binding.value || 100;\n                const currentHTML = el.innerHTML;\n\
    \                const slicedHTML = currentHTML.slice(0, maxLimit);\n        \
    \        const readMoreLink = document.createElement('a');\n                readMoreLink.innerHTML\
    \ = 'Read more...';\n                readMoreLink.style.textDecoration = 'underline';\n\
    \                readMoreLink.style.cursor = 'pointer';\n                const\
    \ readLessLink = document.createElement('a');\n                readLessLink.innerHTML\
    \ = 'Read less...';\n                readLessLink.style.textDecoration = 'underline';\n\
    \                readLessLink.style.cursor = 'pointer';\n                const\
    \ showAllText = () => {\n                    el.innerHTML = `${currentHTML} `;\n\
    \                    el.appendChild(readLessLink);\n                }\n      \
    \          const showLimitedText = () => {\n                    el.innerHTML =\
    \ `${slicedHTML}... `;\n                    el.appendChild(readMoreLink);\n  \
    \              }\n                readMoreLink.addEventListener('click', showAllText);\n\
    \                readLessLink.addEventListener('click', showLimitedText);\n  \
    \              showLimitedText();\n            }\n        })\n    },\n};\n\nexport\
    \ default ExpandSqueeze;\n```\n\nAt the end, `showLimitedText` is called so that\
    \ we see limited text. Following screenshot proves what is said, which limits\
    \ the text to 70 characters as I mentioned during the paragraph declaration.\n\
    \n![Figure 6.11: ExpandSqueeze Plugin Output](img/2c298ca86478005a0a21c9796cebbd15_64_0.png)\n\
    \nWhen you click \"Read more...\", it shows all the text appended with \"Read\
    \ less...\" link.\n\n![Figure 6.12: ExpandSqueeze Plugin Output after clicking\
    \ Read more...](img/2c298ca86478005a0a21c9796cebbd15_64_1.png)\n\nIn this chapter,\
    \ we have covered how mixins helps in defining common logic and get merged with\
    \ the components. We have also learnt the way to define custom directives to manage\
    \ the formatting and display in the UI components. Also, we have learnt the filters\
    \ and plugins.\n\nWe will learn the way to develop single page website using the\
    \ state management. We will cover the state management in the next chapter.\n\n\
    ## DAY 7\n\n# Single Page Application\n\nIn the previous chapter, we discovered\
    \ some ways to build reusable distributed functionalities for our Vue applications.\n\
    \nRouting and State Management play an important role while designing Single Page\
    \ Applications (SPA). In this chapter, we will look into ways to implement these\
    \ concepts in our Vue app.\n\nHTML5 History mode would help us creating routes\
    \ for SPAs that creates an easy path way for the user to go back and forth between\
    \ pages dynamically without page load.\n\nWe will learn few principles with proper\
    \ illustrations for State Management in Vue apps. Parent Child component interaction\
    \ using props and custom events followed by state management techniques with EventBus\
    \ and Global Store is what we are going to explore.\n\nLast, but not the least,\
    \ the Vuex library, which is a robust way to manage the application state will\
    \ take your attention to the next level of app development with Vue.\n\nOf course,\
    \ we will take a brief look at the differences between these state management\
    \ techniques to decide which one to go for.\n\nFollowing are the topics we will\
    \ cover:\n- Creating a route\n- Using the routes\n- Basics of how state management\
    \ works\n- State management implementation using EventBus, Global Store and Vuex\n\
    \n# What is a Route\n\nRouting is a technique by which the requests coming to\
    \ your website or webservices are guided through to the destination meaning the\
    \ code which would handle them. Suppose you type `http://www.example.com/about`\
    \ on the browser url box, which should point to your `About.html` or something\
    \ else. Defining that particular rule is called Routing.\n\nIn a Single Page Application\
    \ (SPA), Routing is the key as you really don't want your page to reload for another\
    \ request. Traditional applications behave in such a way that when you click on\
    \ a hyperlink, it would go to server and come with a html page. However, in SPA,\
    \ the page loads one time and when you request for something by your actions on\
    \ the page (like clicking a link or button), it dynamically changes the content\
    \ as per the request to load new content/page."
