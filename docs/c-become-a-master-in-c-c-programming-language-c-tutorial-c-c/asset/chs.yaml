- "# C#：精通C# (C#编程语言, C#教程, C#编码, .NET, Visual Studio, C#运算符, Python, PowerShell,\
  \ JavaScript)\n\n\n# 引言\n\n恭喜您下载了《*C#*》一书，感谢您这样做。\n\n接下来的章节将讨论您需要了解的关于 C# 的所有内容。当您读完本书时，您应该能够使用\
  \ C# 编写程序，并以该语言应有的水平与计算机进行交互。\n\nC# 将与其他 C 语言类似，但您会意识到存在一些差异，使其成为一种独特的语言。\n\n市面上有很多关于这个主题的书籍，再次感谢您选择这一本！我们已尽一切努力确保本书包含尽可能多的有用信息，请尽情享受阅读！\n\
  \n# 第一章：C# 概述\n\n当您开始使用 C# 时，您会注意到它是一种面向对象的语言，由微软公司创建，并随后获得了 ECMA（欧洲计算机制造商协会）和 ISO（国际标准化组织）的批准。\n\
  \n安德斯·海尔斯伯格开发了这种语言，同时他的团队也在开发与之配套的 .Net 框架。它被设计用于 CLI（公共语言基础结构），这将向您展示可执行的代码以及运行时环境，使您能够在各种平台和架构上使用高级别功能。\n\
  \n使 C# 成为一种广泛使用的语言的一些原因如下：\n\n1.  您可以将其作为 .Net 框架的一部分使用\n2.  它是一种通用编程语言\n3.  您可以在多种平台上使用它\n\
  4.  它是一种面向对象的程序\n5.  它将生成高效的程序\n6.  它面向组件\n7.  该语言结构清晰且易于学习\n\n虽然 C# 可能看起来只是 C 编程语言的另一种变体，但它实际上更像\
  \ Java 而非 C，因为它是一种被全球程序员使用的程序。\n\n程序员认为重要的一些特性包括：\n\n1.  可与 Windows 集成\n2.  布尔条件\n\
  3.  LINQ 和 Lambda 表达式\n4.  自动垃圾回收\n5.  简化的多线程\n6.  标准库\n7.  条件编译\n8.  程序集变体\n9.\
  \  索引器\n10. 属性和事件\n11. 易于使用的泛型\n12. 委托和事件管理\n\n# 第二章：C# 的历史\n\n在 .Net 框架开发过程中，类库是使用一种称为“简单托管\
  \ C”（Simple Managed C）的系统中的托管代码编译器编写的。直到 1999 年 1 月，海尔斯伯格才组建了一个团队，开发了一种新语言，简称为 Cool，但实际上它是“类似\
  \ C 的面向对象语言”（C like Object Oriented Language）。当时微软曾考虑将 Cool 作为该项目的最终名称，但由于版权原因未能实现。\n\
  \n2000 年，在专业开发者大会上，.Net 项目被公之于众，该语言被赋予了新名称 C#，类库被命名为 ASP.Net，而运行时则被移植到了该语言中。\n\n\
  C# 语言的首席设计师同时也是微软的首席架构师，他曾参与创建 Turbo Pascal、Embarcadero Delphi（曾用名 CodeGear Delphi、Inprise\
  \ Delphi 和 Borland Delphi）的设计，并参与了 Visual J++ 的工作。在采访和撰写的论文中，海尔斯伯格表示，大多数编程语言中存在的缺陷正是推动公共语言运行时基础设计的动力，进而推动了该语言本身的设计。\n\
  \n\n\n1994 年，詹姆斯·高斯林创造了 Java 语言，而太阳微系统公司的联合创始人比尔·乔伊表示，C#只是对 Java 语言的模仿。他甚至进一步说：“C#就像是去掉了可靠性、生产力和安全性的\
  \ Java。”克雷夫特和朗格回应道：“Java 和 C#几乎是相同的编程语言。无聊的重复，缺乏创新。几乎没有人会声称 Java 或 C#是改变了我们编写程序方式的革命性编程语言。而且，C#从\
  \ Java 借鉴了很多，反之亦然。现在 C#支持装箱和拆箱，我们 Java 中也将有非常类似的功能。”\n\n后来在 2000 年，海尔斯伯格站出来说：“C#不是\
  \ Java 的克隆，它在设计上更接近 C++。”\n\n自 2005 年版本 2.0 发布以来，C#和 Java 走上了不同的发展轨迹，这使得它们之间的相似性降低。最大的区别之一是泛型被添加到这两种语言中，这使它们彼此不同。C#使用具体化来提供一流的泛型对象，这些对象能够在类加载时生成的代码中被其他类使用。除此之外，C#还具有一些特性，使其成为一种函数式编程语言，可与\
  \ C# 3.0 版本发布的 LINQ 扩展一起使用。\n\n以下是 C#每个版本发布时添加的功能。\n\n## 版本 2.0\n\n1. 委托推断\n2. 泛型\n\
  3. 静态类\n4. 分部类\n5. 委托的协变和逆变\n6. 匿名方法\n7. 方法组转换\n8. 迭代器\n9. Getter/Setter 单独可访问性\n\
  10. 可空类型\n\n## 版本 3.0\n\n1. 分部方法\n2. 隐式类型局部变量\n3. 表达式树\n4. 对象和集合初始化器\n5. Lambda\
  \ 表达式\n6. 自动实现的属性\n7. 查询表达式\n8. 匿名类\n9. 扩展方法\n\n## 版本 4.0\n\n1. 嵌入式互操作类\n2. 动态绑定\n\
  3. 泛型协变和逆变\n4. 命名参数和可选参数\n\n## 版本 5.0\n\n1. 调用方信息特性\n2. 异步方法\n\n## 版本 6.0\n\n1.\
  \ 字典初始化器\n2. 编译器即服务\n3. nameof 运算符\n4. 将静态类成员导入命名空间\n5. 字符串插值\n6. 异常筛选器\n7. null\
  \ 传播器\n8. 在 catch/finally 块中使用 await\n9. 表达式体成员\n10. 自动属性初始化器\n11. 仅 getter 属性的默认值\n\
  \n## 版本 7.0\n\n1. 表达式体 getter 和 setter\n2. out 变量\n3. 表达式体构造函数和终结器\n4. 模式匹配\n5.\
  \ 通用异步返回类型\n6. 元组\n7. 引用返回和局部变量\n8. 解构\n9. 二进制文本\n10. 局部函数\n11. 数字分隔符\n\n## 版本 7.1\n\
  \n1. 默认表达式\n2. 异步 Main 方法\n\n# 第三章\n\n![](img/00001.jpeg)\n\n## C# 环境\n\n.NET 是一个运行在自身平台上的框架，它将帮助你编写\
  \ Windows 应用程序、Web 服务和 Web 应用程序。由于该框架设计为几乎可以与任何编程语言一起使用，因此其应用程序将能够在多个平台上运行。每种语言都可以选择访问该框架，以便它们能够相互通信。\n\
  \n.NET 框架附带一个包含大量代码的库，你可以将其与 C# 一起使用。.NET 框架的一些组件包括：\n\n1. LINQ\n2. CLR（公共语言运行时）\n\
  3. WCF（Windows Communication Foundation）\n4. .NET 框架类库\n5. Windows Presentation\
  \ Foundation\n6. 公共语言规范\n7. WF（Windows Workflow Foundation）\n8. 公共类型系统\n9. ADO.NET\n\
  10. 元数据和程序集\n11. ASP.NET 和 ASP.NET AJAX\n12. Windows 窗体\n\n每个组件将执行不同的任务，你可以通过使用该组件或查看\
  \ Microsoft 提供的文档来了解它们。\n\n### 集成开发环境\n\n除了 C# 之外，你还可以使用更多的开发工具，这些工具包括：\n\n1. Visual\
  \ Web 创建器\n2. VS（Visual Studio 2010）\n3. VCE（Visual C# 2010 Express）\n\nWeb 创建器和\
  \ VCE 可以在 Microsoft 官方网站上找到。使用这些工具时，你将能够编写几乎任何类型的 C# 程序。你还可以选择使用基本文本编辑器（如记事本）编写源代码文件，然后通过命令提示符（它是\
  \ .NET 框架的一部分）将代码编译成程序集。\n\nVCE 和 Web 创建器是比 Visual Studio 更小的版本，并且具有与 Visual Studio\
  \ 相同的外观。\n\n在安装 Visual Studio 的 Express 版本时，你需要有稳定的网络连接。\n\n### 在 Linux 和 Mac 上编写程序\n\
  \n由于 .NET 框架是 Windows 系统软件功能，因此在使用其他系统软件时，你还可以使用其他版本。Mono 是 .NET 框架的一个变体，它可与 C#\
  \ 编译器一起使用，并能在多种不同的系统软件上运行，例如 Linux 和 Mac OS。\n\nMono 的整个目的是能够运行为 Microsoft .NET\
  \ 构建的应用程序，以便它们能够与为其他系统软件（如 Android、iOS、Linux 和 Unix）开发的工具一起工作。\n\n# 第四章\n\n![](img/00001.jpeg)\n\
  \n## C# 的程序结构\n\n在你能够学习构建 C# 程序需要什么之前，你必须先了解该编程语言是如何构建的。\n\n程序中有某些部分对于确保你在创建 C#\
  \ 程序时添加它们是至关重要的。\n\n1. 注释\n2. 命名空间声明\n3. 语句和表达式\n4. 类\n5. Main 方法\n6. 类方法\n7. 类属性\n\
  \n**示例**\n\n```\nusing System;\n\nnamespace HelloOuterSpaceApplication\n\n{\n\n\
  class HelloOuterSpace\n\n{\n\nstatic void Main(string[] args)\n\n{\n\n/* 你的第一个 C#\
  \ 程序 */\n\nConsole.WriteLine(\"Hello outer space\");\n\nConsole.ReadKey();\n\n}\n\
  \n}\n\n}\n```\n\n一旦代码被执行，你将得到结果“Hello outer space”。\n\n程序中的第一行是代码的 `using System`\
  \ 部分。`using` 关键字用于将系统的命名空间包含到程序中。大多数 C# 程序使用多个 `using` 语句。\n\n你的命名空间声明是你所使用的类的集合。你的应用程序的名称将是该应用程序的类。\n\
  \n你的类声明将包含程序最终要使用的所有数据和定义。类将包含多个方法，这些方法最终将定义类的行为。但是，示例中使用的类只有一个名为 `Main` 的方法。\n\n\
  你的 `Main` 方法是所有 C# 程序的入口点。该方法将指明类何时被执行。\n\n星号和斜杠之间的内容将被编译器忽略，因为它们是程序中的注释。\n\n你的\
  \ `Main` 方法将告诉你语句将遵循什么行为。\n\n`WriteLine` 是 `Console` 类在命名空间中拼写时使用的方法。这个语句将导致你的结果显示在你面前的屏幕上。\n\
  \n\n\n\n\n# 第五章\n\n![](img/00001.jpeg)\n\n## C# 语法\n\n由于 C# 是一种面向对象的编程语言，你将需要使用对象来与其他对象交互，从而创建动作。这些动作在使用时会产生方法。相同的对象将拥有类，或者属于同一个类。\n\
  \n以矩形为例。长度和宽度是矩形的属性。根据矩形的设计，这些属性接受相应的值，同时计算面积并显示详细信息。\n\n**示例：**\n\n```\nUsing system;\n\
  \nNamespace circle application\n\n{\n\nClass circle\n\n{\n\n// variables\n\nDouble\
  \ width;\n\nDouble circumference\n\nOpen void accept details ()\n\n{\n\nWidth =\
  \ 3. 4\n\nCircumference = 3.2\n\n}\n\nOpen double ()\n\n{\n\nReturn width * circumference\n\
  \n}\n\nOpen void display ()\n\n{\n\nConsole. WriteLine (“width: {0}”, width);\n\n\
  Console. WriteLine (circumference: {0}, circumference);\n\n}\n\n}\n\nClass perform\
  \ circle\n\n{\n\nStatic void main (string [] para)\n\n{\n\nCircle c = new circle\
  \ ();\n\nC accept details ();\n\nC. display ();\n\nConsole. ReadiLine ();\n\n}\n\
  \n}\n\n}\n```\n\n对于上面所示的示例，你将得到圆的测量值。\n\n**Using**\n\n在 C# 中，你的第一条语句始终是 `using system;`\n\
  \n关键字 `using` 用于 C# 中的命名空间。\n\n**Class**\n\n当你声明类时，将使用此关键字。\n\n**注释**\n\n当你需要解释所创建的代码时，可以使用注释。C#\
  \ 编译器会忽略你添加的任何注释。多行注释以 `/*` 开头，以 `*/` 结尾。\n\n单行注释使用一组双斜杠。\n\n**成员变量**\n\n这些变量是类成员的属性。使用时可以存储数据。\n\
  \n**成员函数**\n\n成员函数是执行任务的语句。类的这些函数通常在类内部声明。\n\n**实例化类**\n\n类将在脚本的 `main` 方法中包含类的名称。\n\
  \n**标识符**\n\n标识符是你用来标识类、变量和函数的单词。在 C# 中创建标识符有三条规则。\n\n1. 不能使用 C# 中的关键字。\n2. 必须以字母开头，后面可以跟其他字母、数字或下划线。但不能以数字开头。\n\
  3. 不能使用任何特殊字符，但下划线除外。\n\n**C# 中的关键字**\n\n关键字是 C# 编译器保留的单词。这些关键字被设置为不能用作标识符。但是，如果你想将这些单词用作标识符，可以在单词前使用\
  \ at 符号（`@`），使其在 C# 中有效。\n\nC# 中的标识符在代码中具有特殊含义，因此有些被称为上下文关键字。\n\n**保留关键字**\n\n1.\
  \ `abstract`\n2. `catch`\n3. `default`\n4. `explicit`\n5. `foreach`\n6. `interface`\n\
  7. `null`\n8. `private`\n9. `sealed`\n10. `switch`\n11. `ulong`\n12. `volatile`\n\
  13. `while`\n14. `unchecked`\n15. `this`\n16. `short`\n17. `protected`\n18. `object`\n\
  19. `internal`\n20. `goto`\n21. `extern`\n22. `delegate`\n23. `char`\n24. `as`\n\
  25. `base`\n26. `checked`\n27. `do`\n28. `false`\n29. `if`\n30. `is`\n31. `operator`\n\
  32. `open`\n33. `sizeof`\n34. `throw`\n35. `unsafe`\n36. `ushort`\n37. `true`\n\
  38. `stackalloc`\n39. `readonly`\n40. `out`\n41. `lock`\n42. `implicit`\n43. `finally`\n\
  44. `double`\n45. `class`\n46. `bool`\n47. `break`\n48. `const`\n49. `else`\n50.\
  \ `fixed`\n51. `in`\n52. `long`\n53. `out`\n54. `ref`\n55. `static`\n56. `try`\n\
  57. `using`\n58. `virtual`\n59. `classof`\n60. `string`\n61. `return`\n62. `override`\n\
  63. `namespace`\n64. `in`\n65. `float`\n66. `enum`\n67. `continue`\n68. `byte`\n\
  69. `case`\n70. `decimal`\n71. `event`\n72. `for`\n73. `int`\n74. `new`\n75. `params`\n\
  76. `sbyte`\n77. `struct`\n78. `uint`\n79. `void`\n\n**上下文关键字**\n\n1. `partial`\n\
  2. `get`\n3. `from`\n4. `orderby`\n5. `let`\n6. `dynamic`\n7. `set`\n8. `join`\n\
  9. `descending`\n10. `ascending`\n11. `into`\n12. `select`\n13. `remove`\n14. `group`\n\
  15. `alias`\n16. `partial`\n17. `global`\n18. `add`\n\n# 第六章\n\n![](img/00001.jpeg)\n\
  \n## 数据类型\n\nC# 中有三种不同的数据类型。\n\n1. 指针类型\n2. 值类型\n3. 引用类型\n\n### 值类型\n\n值类型是直接赋值的变量。它们派生自\
  \ `System.ValueType`。\n\n值类型直接包含数据，例如 `char`、`int` 和 `float`。当声明 `int` 类型时，系统会为其分配空间。\n\
  \n**值类型：**\n\n1. `bool`：布尔值\n2. `byte`：8 位无符号整数\n3. `char`：16 位 Unicode 字符\n4. `decimal`：128\
  \ 位精确十进制值，最多 29 个有效数字\n5. `double`：64 位双精度浮点类型\n6. `float`：32 位单精度浮点类型\n7. `int`：32\
  \ 位有符号整数\n8. `long`：64 位有符号整数\n9. `sbyte`：8 位有符号整数\n10. `short`：16 位有符号整数\n11. `uint`：32\
  \ 位无符号整数\n12. `ulong`：64 位无符号整数\n13. `ushort`：16 位无符号整数\n\n变量的确切大小取决于所使用的平台，可以通过\
  \ `sizeof` 方法获知。该表达式将返回对象存储空间的大小（以字节为单位）。\n\n**语法**\n\n```\nUsing system;\n\nNamespace\
  \ dataclass application\n\n{\n\nClass program\n\n{\n\nStatic void main (string []\
  \ args)\n\n{\n\nConsole. Write line (size of int: {0}, Sizeof (int));\n\nConsole.\
  \ ReadiLine ()\n\n}\n\n}\n\n}\n```\n\n### 引用类型\n\n\n\n\n你实际上不会在引用类变量中存储任何数据。基本上，你只是引用程序内存中的一个位置。当你使用多个变量时，引用类将指向这些类所在的位置。如果该位置的数据被某个变量修改，那么另一个变量将自动反映这一变化。\n\
  \n### 对象类\n\n该类将成为你在 C# 中遇到的所有数据类的基类。CTS（通用类型系统）在使用该系统时会使用别名 `Object` 类。只要该类由程序预定义或由用户定义，这个\
  \ `Object` 类就可以被赋值为本章将要讨论的其他类的值。在你可以赋值之前，需要先进行转换。\n\n当 `Object` 类被转换时，这一过程称为装箱（boxing）；而当它被转换为值类型时，则称为拆箱（unboxing）。\n\
  \n### 动态类型\n\n任何类的任何值都可以存储在 `dynamic` 类中。你需要在运行时检查这些变量类，因为它们的类型检查发生在运行时。`dynamic`\
  \ 类与 `object` 类类似，但 `object` 类的类型检查发生在编译时。\n\n**语法**\n\n```\nDynamic <variable_name>\
  \ = value;\n```\n\n### 字符串类\n\n该类允许你将任何字符串值赋给任何变量。`string` 类在系统中包含一个别名 `String`\
  \ 类。该类也派生自 `object` 类。你会注意到，`string` 类的值是通过字符串字面量来赋值的，字符串字面量有两种形式：带引号的和 @ 引号的。\n\
  \n用户定义的引用类被称为 `interface`、`delegate` 和 `class`。\n\n### 指针类\n\n指针变量将存储其他类的内存地址。这些指针具有与其他\
  \ C 语言中指针相同的功能。\n\n**语法**\n\n```\nClass * identifier;\n```\n\n# 第七章\n\n![](img/00001.jpeg)\n\
  \n## C# 中的类型转换\n\nC# 类型转换是将一种数据类型转换为另一种数据类型的行为。你可能也听说过这种转换称为类型强制转换。你会发现有两种不同的转换类型。\n\
  \n1. 隐式转换：在此类转换下，C# 会以与正在转换的类相同的方式执行转换。例如，当转换从最小到最大时，会使派生类转换为基类。\n\n2. 显式转换：显式转换由用户在使用预定义函数时完成。这些转换需要强制转换运算符。\n\
  \n**语法**\n\n```\nusing System;\n\nnamespace TypeClassConversionApplication\n{\n\
  \    class ExplicitConversion\n    {\n        static void Main(string[] args)\n\
  \        {\n            double d = 5673.74;\n            int i;\n\n            //\
  \ cast double to int.\n            i = (int)d;\n\n            Console.WriteLine(i);\n\
  \            Console.ReadKey();\n        }\n    }\n}\n```\n\n### 转换方法\n\n1. `ToBoolean`：将转换为布尔类\n\
  2. `ToByte`：将转换为字节\n3. `ToChar`：将转换为单个 Unicode 字符中的字符\n4. `ToDateTime`：将转换你的日期和时间结构\n\
  5. `ToDecimal`：将浮点数或整数转换为十进制类\n6. `ToDouble`：将类转换为双精度类\n7. `ToInt16`：将类转换为 16 位整数\n\
  8. `ToInt32`：将类转换为 32 位整数\n9. `ToInt64`：将类转换为 64 位整数\n10. `ToSByte`：将你的类转换为有符号字节类\n\
  11. `ToSingle`：将类转换为浮点数，但数值较小\n12. `ToString`：将你的类转换为字符串\n13. `ToType`：将你的类转换为指定的类\n\
  14. `ToUInt16`：你将得到一个无符号整数类\n15. `ToUInt32`：你将得到一个无符号长整型类\n16. `ToUInt64`：你将得到一个无符号大整数\n\
  \n**示例：**\n\n```\nusing System;\n\nnamespace ClassConversionApplication\n{\n   \
  \ class StringConversion\n    {\n        static void Main(string[] args)\n     \
  \   {\n            int i = 75;\n            float f = 53.005f;\n            double\
  \ d = 2345.7652;\n            bool b = true;\n\n            Console.WriteLine(i.ToString());\n\
  \            Console.WriteLine(f.ToString());\n            Console.WriteLine(d.ToString());\n\
  \            Console.WriteLine(b.ToString());\n\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n\n# 第八章\n\n![](img/00001.jpeg)\n\n## C# 中的变量\n\n变量本质上只是存储区域中的一个名称，用于操作数据。每个变量都包含特定的类，该类决定了变量内存的大小和布局。每个内存区域都有一系列可以存储的值，以及一组可以应用于每个变量的操作。\n\
  \nC# 提供的一些基本值类型包括：\n\n1. 整型类：`char`、`ulong`、`long`、`uint`、`int`、`ushort`、`short`、`byte`、`sbyte`\n\
  2. 浮点型：`double` 和 `float`\n3. 十进制类：`decimal`\n4. 布尔型：`true`、`false`、赋值\n5. 可空类型：`Nullable`\n\
  \nC# 允许你使用 `class` 和 `enum` 等变量来定义值类型。\n\n### 定义变量\n\n**语法**\n\n```\n<data_class>\
  \ <variable_lists>;\n```\n\n数据类型必须是有效的 C# 数据类型。变量列表必须至少包含一个标识符，多个标识符之间用逗号分隔。\n\n\
  **变量定义：**\n\n```\nint i, j, k;\nchar c, ch;\nfloat f, salary;\ndouble d;\n```\n\n\
  **初始化变量**\n\n初始化变量时，需要有一个等号，后面跟着一个常量表达式。\n\n**语法**\n\n```\nvariable_name = value;\n\
  ```\n\n你可以在声明变量的同时进行初始化。初始化器由一个等号和后面的常量表达式组成。\n\n**语法**\n\n```\n<data_class> <variable_name>\
  \ = value;\n```\n\n**示例**\n\n```\nint d = 3, f = 5; /* 初始化 d 和 f。 */\nbyte z = 22;\
  \ /* 初始化 z。 */\ndouble pi = 3.14159; /* 声明 pi 的近似值。 */\nchar x = 'x'; /* 变量 x 的值为\
  \ 'x'。 */\n```\n\n你需要以正确的方式初始化变量，否则程序会给出你意想不到的结果。\n\n**示例**\n\n```\nusing System;\n\
  \nnamespace VariableDefinition\n{\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            short a;\n            int b ;\n  \
  \          double c;\n\n            /* 实际初始化 */\n            a = 10;\n         \
  \   b = 20;\n            c = a + b;\n\n            Console.WriteLine(\"a = {0},\
  \ b = {1}, c = {2}\", a, b, c);\n            Console.ReadLine();\n        }\n  \
  \  }\n}\n```\n\n**接受用户输入**\n\n你的 `Console` 类位于 `System` 命名空间中，它提供了一个名为 `ReadLine()`\
  \ 的函数，用于接受用户输入并将其存储为变量。\n\n**示例**\n\n```\nint num;\nnum = Convert.ToInt32(Console.ReadLine());\n\
  ```\n\n你的 `Convert.ToInt32()` 函数会获取数据并将其转换，以便程序能够读取。\n\n### 左值和右值表达式\n\n在 C# 中，你会遇到两种不同的表达式：\n\
  \n1. 右值：该表达式出现在赋值操作的右侧，而不是左侧。\n2. 左值：该表达式可以出现在赋值操作的左侧或右侧。\n\n左值变量可以出现在赋值操作的左侧。数值字面量是右值，这就是为什么它们不能被赋值，因此不能出现在赋值操作的左侧。\n\
  \n# 第九章\n\n![](img/00001.jpeg)\n\n## C# 常量和字面量\n\n\n\n\n\n你的常量将指向一个固定值，在程序执行代码期间该值无法更改。这些固定值被称为字面量。常量可以是任何数据类型，例如整数或字符。你也可以使用枚举常量。\n\
  \n除了值在定义后无法更改之外，你可以像对待普通变量一样对待常量。\n\n### 整数字面量\n\n整数字面量可以是十进制或十六进制等形式。前缀会告诉你基数或进制。当使用十六进制时，前缀是\
  \ `0x` 或 `0X`，但十进制没有前缀标识。\n\n整数字面量还可以使用 `U` 和 `L` 作为后缀，分别表示无符号和长整型。后缀可以是大写或小写，具体取决于顺序。\n\
  \n**示例**\n\n```\n85 /* 十进制 */\n0x4b /* 十六进制 */\n30 /* int */\n30u /* unsigned int\
  \ */\n30l /* long */\n30ul /* unsigned long */\n```\n\n### 浮点字面量\n\n浮点字面量由四部分组成：指数、小数部分、整数部分、小数点。你也可以用指数形式或十进制形式来表示这些字面量。\n\
  \n**示例**\n\n```\n3.14159 /* 合法 */\n314159E-5F /* 合法 */\n510E /* 非法：指数不完整 */\n210f\
  \ /* 非法：没有小数或指数 */\n.e55 /* 非法：缺少整数或小数部分 */\n```\n\n使用十进制形式时，需要确保包含小数点、指数或两者都包含。对于指数形式，你需要包含整数部分、小数部分，或者如果你愿意，可以两者都包含。对于有符号指数，使用\
  \ `e` 或 `E`。\n\n### 字符常量\n\n字符字面量由一组单引号包围，并存储在 `char` 类型中。这些字面量可以是普通字符，甚至是转义序列，你甚至可能看到一些通用字符。\n\
  \n在 C# 中使用的一些字符前面会带有反斜杠，这意味着它们具有特殊含义，并且会以不同的方式表示。\n\n转义序列如下：\n\n1. `\\xhh`：十六进制，多位数字\n\
  2. `\\\\`：`\\` 字符\n3. `\\v`：垂直制表符\n4. `\\'`：`'` 字符\n5. `\\t`：水平制表符\n6. `\\\"`：`\"\
  ` 字符\n7. `\\r`：回车\n8. `\\?`：`?` 字符\n9. `\\n`：换行\n10. `\\a`：警报\n11. `\\f`：换页\n12.\
  \ `\\b`：退格\n\n**示例**\n\n```\nusing System;\n\nnamespace EscapeChar\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   Console.WriteLine(\"Hello\\tWorld\\n\\n\");\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n\n### 字符串字面量\n\n字符串字面量或常量由双引号包围，或者包含 at 符号（`@`）。这些字符串包含一系列字符，看起来与字符字面量类似。\n\
  \n长行可以通过使用字符串字面量拆分为多行，只要使用空白字符进行分隔即可。\n\n**示例**\n\n```\n\"hello, dear\"\n\"hello,\
  \ \\\ndear\"\n\"hello, \" \"d\" \"ear\"\n@\"hello dear\"\n```\n\n### 定义常量\n\n常量通过使用\
  \ `const` 关键字来定义。\n\n**语法**\n\n```\nconst <数据类型> <常量名> = 值;\n```\n\n**示例**\n\n```\n\
  using System;\n\nnamespace DeclaringConstants\n{\n    class Program\n    {\n   \
  \     static void Main(string[] args)\n        {\n            const double pi =\
  \ 3.14159;\n            // 常量声明\n            double r;\n            Console.WriteLine(\"\
  Enter Radius: \");\n            r = Convert.ToDouble(Console.ReadLine());\n    \
  \        double areaCircle = pi * r * r;\n            Console.WriteLine(\"Radius:\
  \ {0}, Area: {1}\", r, areaCircle);\n            Console.ReadLine();\n        }\n\
  \    }\n}\n```\n\n# 第十章\n\n![](img/00001.jpeg)\n\n## C# 运算符\n\n运算符是告诉编译器在数学或逻辑表达式中执行何种操作的符号。C#\
  \ 内置了多种运算符，例如：\n\n1. 杂项\n2. 算术\n3. 赋值\n4. 关系\n5. 位运算\n6. 逻辑\n\n### 算术运算符\n\n1. 加法（`+`）\n\
  2. 减法（`-`）\n3. 乘法（`*`）\n4. 除法（`/`）\n5. 取模（`%`）\n6. 自增（`++`）\n7. 自减（`--`）\n\n###\
  \ 关系运算符\n\n1. 值是否相等？（`==`）\n2. 值是否不相等（`!=`）\n3. 大于（`>`）\n4. 小于（`<`）\n5. 大于等于（`>=`）\n\
  6. 小于等于（`<=`）\n\n### 逻辑运算符\n\n1. 逻辑与（`&&`）\n2. 逻辑或（`||`）\n3. 逻辑非（`!`）\n\n### 位运算符\n\
  \n1. 按位与（`&`）\n2. 按位或（`|`）\n3. 按位异或（`^`）\n4. 按位取反（`~`）\n5. 左移（`<<`）\n6. 右移（`>>`）\n\
  \n### 赋值运算符\n\n1. 赋值（`=`）\n2. 加后赋值（`+=`）\n3. 减后赋值（`-=`）\n4. 乘后赋值（`*=`）\n5. 除后赋值（`/=`）\n\
  6. 取模后赋值（`%=`）\n7. 左移后赋值（`<<=`）\n8. 右移后赋值（`>>=`）\n9. 按位与后赋值（`&=`）\n10. 按位异或后赋值（`^=`）\n\
  11. 按位或后赋值（`|=`）\n\n### 杂项运算符\n\n1. `sizeof()`\n2. `classof()`\n3. 变量地址（`&`）\n4.\
  \ 指向变量的指针（`*`）\n5. 条件表达式（`? :`）\n6. 对象类型判断（`is`）\n7. 若转换失败则不引发异常（`as`）\n\n### 运算符优先级\n\
  \nC# 中的优先级告诉你哪一组项会先被求值。某些运算符的优先级高于其他运算符，例如乘法的优先级高于加法。\n\n以下是 C# 的优先级顺序：\n\n1. 后缀：`()`、`[]`、`.`、`++`、`--`\n\
  2. 一元：`+`、`-`、`!`、`~`、`++`、`--`、`(类型)*`、`&`、`sizeof`\n3. 乘法：`*`、`/`、`%`\n4. 加法：`+`、`-`\n\
  5. 移位：`<<`、`>>`\n6. 关系：`<`、`<=`、`>`、`>=`\n7. 相等：`==`、`!=`\n8. 按位与：`&`\n9. 按位异或：`^`\n\
  10. 按位或：`|`\n11. 逻辑与：`&&`\n12. 逻辑或：`||`\n13. 条件：`?:`\n14. 赋值：`=`、`+=`、`-=`、`^=`、`/=`、`%=`、`=>`、`>=`、`<<=`、`&=`、`^=`、`|=`\n\
  15. 逗号：`,`\n\n# 第十一章\n\n![](img/00001.jpeg)\n\n## C# 中的决策\n\n你将使用 C# 中的决策来了解程序如何工作。决策结构意味着你需要告诉程序需要评估和测试哪个条件，以及在条件为真或假时需要执行的任何语句。\n\
  \n### 决策语句\n\n1. `if` 语句：包含一个布尔表达式\n2. `if-else` 语句：一个 `if` 语句后跟一个 `else` 语句\n3.\
  \ 嵌套语句：一个语句嵌套在另一个语句内部\n4. `switch` 语句：该语句允许对变量进行相等性测试\n5. 嵌套 `switch` 语句：一个 `switch`\
  \ 语句放在另一个 `switch` 语句内部\n\n**`? :` 运算符**\n\n该运算符可用于替代 `if-else` 语句。\n\n**语法**\n\n\
  ```\n表达式 1 ? 表达式 2 : 表达式 3 ;\n```\n\n该表达式的值取决于 `表达式 1` 的求值结果：如果为真，则 `表达式 2` 被求值并成为问号的值；但如果\
  \ `表达式 1` 为假，则 `表达式 3` 被求值并成为该表达式的值。\n\n# 第十二章\n\n![](img/00001.jpeg)\n\n## 循环\n\
  \n在某些情况下，你会发现需要连续多次执行特定的代码块。语句将按照编写的顺序执行。\n\n大多数编程语言都会提供控制结构，使你能够处理更复杂的执行路径。循环允许语句连续多次执行，而无需反复调用需要执行的语句。\n\
  \n1. `while` 循环：如果条件为真，则重复执行所选语句。\n2. `for` 循环：语句会被执行并简化，以便管理循环变量。\n\n\n\n\n\n###\
  \ 3. do while 循环：条件将在循环体的末尾进行测试。\n\n### 4. 嵌套循环：就像其他嵌套语句一样，这是一个循环嵌套在另一个循环内部。\n\n\
  ### 循环控制语句\n\n控制语句将改变循环的正常执行方式。每当执行离开作用域时，任何自动对象都将被销毁。\n\n1. `Break` 语句：循环或 `switch`\
  \ 语句将被终止，同时执行循环或 `switch` 之后的语句。\n\n2. `Continue` 语句：循环将跳过其所有主体，并在再次迭代之前测试条件。\n\n\
  ### 无限循环\n\n当循环的条件永远不会被判定为假时，循环就属于这一类。`for` 循环通常是属于这一类的循环。由于三个表达式都不是必需的，你可以通过将条件表达式留空来造成无限循环。\n\
  \n**示例**\n\n```csharp\nusing System;\n\nnamespace Loops\n\n{\n\nclass Program\n\n\
  {\n\nstatic void Main(string[] args)\n\n{\n\nfor (; ; )\n\n{\n\nConsole. WriteLine(\"\
  Hey! I am Trapped\");\n\n}\n\n}\n\n}\n\n}\n```\n\n当条件表达式不存在时，它将被假定为真。你可能需要初始化增量表达式。然而，许多程序员使用\
  \ `for ( ; ; )` 来构造无限循环。\n\n# 第十三章\n\n![](img/00001.jpeg)\n\n## C# 中的封装\n\n你可以将封装定义为将一个或多个项目封装在逻辑或物理包中的过程。封装是在面向对象的编程语言中完成的，这种方法最终会阻止对实现细节的访问。\n\
  \n抽象和封装是你只能在面向对象编程中找到的特性。然而，抽象将代码中的相关信息转化为代码的可见部分，而封装则允许程序员在代码中实现他们想要的抽象级别。\n\n\
  有一些访问说明符可以实现封装。访问说明符将定义作用域以及类成员的可见性。以下是 C# 支持的说明符。\n\n1. `Protected internal`\n\n\
  2. `Open`\n\n3. `Internal`\n\n4. `Private`\n\n5. `Protected`\n\n### OPEN\n\n这些说明符将使类能够展示其成员变量和函数，以便其他对象和函数可以看到它们。当一个成员是\
  \ `Open` 时，它可以从外部访问。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\
  \n{\n\nclass Rectangle\n\n{\n\n//member variables\n\nOpen double length;\n\nOpen\
  \ double width;\n\nOpen double GetArea()\n\n{\n\nreturn length * width;\n\n}\n\n\
  Open void Display()\n\n{\n\nConsole. WriteLine(\"Length: {0}\", length);\n\nConsole.\
  \ WriteLine(\"Width: {0}\", width);\n\nConsole. WriteLine(\"Area: {0}\", GetArea());\n\
  \n}\n\n}//end class Rectangle\n\nclass PerformRectangle\n\n{\n\nstatic void Main(string[]\
  \ args)\n\n{\n\nRectangle r = new Rectangle();\n\nr.length = 4.5;\n\nr.width = 3.5;\n\
  \nr.Display();\n\nConsole.ReadLine();\n\n}\n\n}\n\n}\n```\n\n在这个示例中，你可以看到成员变量 `length`\
  \ 和 `width` 是 `Open` 的，因此可以通过使用类名从你的函数中访问它们。你的成员函数只能直接访问变量，而不需要使用任何类实例。它们也通过使用 `main()`\
  \ 函数被声明为 `Open`。\n\n### PRIVATE\n\n`Private` 说明符将使类能够隐藏其成员变量和函数，使其不被代码中的其他内容访问。只有在同一个类中的函数才能访问私有成员。甚至会出现类无法访问私有成员的情况。\n\
  \n**示例**\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\n{\n\n\
  class Rectangle\n\n{\n\n//member variables\n\nprivate double length;\n\nprivate\
  \ double width;\n\nOpen void Acceptdetails()\n\n{\n\nConsole. WriteLine(\"Enter\
  \ Length: \");\n\nlength = Convert.ToDouble(Console.ReadLine());\n\nConsole. WriteLine(\"\
  Enter Width: \");\n\nwidth = Convert.ToDouble(Console.ReadLine());\n\n}\n\nOpen\
  \ double GetArea()\n\n{\n\nreturn length * width;\n\n}\n\nOpen void Display()\n\n\
  {\n\nConsole. WriteLine(\"Length: {0}\", length);\n\nConsole. WriteLine(\"Width:\
  \ {0}\", width);\n\nConsole. WriteLine(\"Area: {0}\", GetArea());\n\n}\n\n}//end\
  \ class Rectangle\n\nclass PerformRectangle\n\n{\n\nstatic void Main(string[] args)\n\
  \n{\n\nRectangle r = new Rectangle();\n\nr.Acceptdetails();\n\nr.Display();\n\n\
  Console.ReadLine();\n\n}\n\n}\n\n}\n```\n\n在上面的示例中，成员变量被声明为私有，因此函数无法访问它们。然而，成员函数会显示这些变量。由于成员函数是开放的，因此可以通过使用类名的实例从主函数中访问它们。\n\
  \n### 受保护的访问说明符\n\n该说明符将允许子类访问其基类中的成员变量和函数。这在处理继承时非常有用。\n\n### 内部访问说明符\n\n`internal`\
  \ 访问说明符将允许成员函数和变量暴露给你正在处理的程序集中的其他函数和对象。因此，只要成员定义所在的应用程序中定义了任何类或方法，你就可以访问它们。\n\n\
  **示例**\n\n```csharp\nusing System;\n\nnamespace RectangleApplication\n\n{\n\nclass\
  \ Rectangle\n\n{\n\n//member variables\n\ninternal double length;\n\ninternal double\
  \ width;\n\ndouble GetArea()\n\n{\n\nreturn length * width;\n\n}\n\nOpen void Display()\n\
  \n{\n\nConsole. WriteLine(\"Length: {0}\", length);\n\nConsole. WriteLine(\"Width:\
  \ {0}\", width);\n\nConsole. WriteLine(\"Area: {0}\", GetArea());\n\n}\n\n}//end\
  \ class Rectangle\n\nclass PerformRectangle\n\n{\n\nstatic void Main(string[] args)\n\
  \n{\n\nRectangle r = new Rectangle();\n\nr.length = 4.5;\n\nr.width = 3.5;\n\nr.Display();\n\
  \nConsole.ReadLine();\n\n}\n\n}\n\n}\n```\n\n这个示例表明，成员函数没有用提供访问权限的说明符声明。因此，类成员的默认访问说明符没有被提及，因为它实际上是私有的。\n\
  \n### 受保护的内部访问说明符\n\n该说明符将隐藏类的成员变量和函数，使其不被其他类对象和函数访问，但同一应用程序中的子类除外。你将在实现继承时使用此方法。\n\
  \n# 第十四章\n\n![](img/00001.jpeg)\n\n## C# 中使用的方法\n\n方法是用于执行任务的一组语句。C# 中的每个程序都有一个名为\
  \ `main` 的类方法。\n\n要使用一个方法，你必须：\n\n1. 定义你的方法\n\n2. 调用你的方法\n\n### 定义方法\n\n每当定义一个方法时，你必须声明结构的元素。\n\
  \n**语法**\n\n```csharp\n<access specifier> <return class> <method name> (parameter\
  \ list)\n\n{\n\nMethod body\n\n}\n```\n\n方法的一些元素包括：\n\n1. 访问说明符：变量的可见性将由另一个类决定。\n\
  \n2. 返回类：该方法将返回一个值。这个返回类将是返回给你的值的数据类。如果方法不返回值，那么返回类将是 `void`。\n\n3. 方法名：方法名是区分大小写的标识符。它不会与类中声明的其他标识符相同。\n\
  \n4. 参数列表：在括号之间，参数将用于向正在使用的方法传递和获取数据。参数指的是方法所使用的参数的顺序、数量和类。参数不是必须使用的。\n\n\n\n\n\n\
  5. 方法体：你的指令将放在这里，你需要这些指令来完成需要执行的步骤。\n\n**示例**\n\n```csharp\nclass NumberManipulator\n\
  {\n   Open int FindMax(int num1, int num2)\n   {\n      /* 局部变量声明 */\n      int\
  \ result;\n\n      if (num1 > num2)\n         result = num1;\n      else\n     \
  \    result = num2;\n      return result;\n   }\n   ...\n}\n```\n\n### 调用方法\n\n\
  通过使用你想要调用的方法名称来调用方法。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace CalculatorApplication\n\
  {\n   class NumberManipulator\n   {\n      Open int FindMax(int num1, int num2)\n\
  \      {\n         /* 局部变量声明 */\n         int result;\n\n         if (num1 > num2)\n\
  \            result = num1;\n         else\n            result = num2;\n       \
  \  return result;\n      }\n\n      static void Main(string[] args)\n      {\n \
  \        /* 局部变量定义 */\n         int a = 100;\n         int b = 200;\n         int\
  \ ret;\n\n         NumberManipulator n = new NumberManipulator();\n\n         //\
  \ 调用 FindMax 方法\n         ret = n.FindMax(a, b);\n         Console.WriteLine(\"\
  最大值是：{0}\", ret );\n         Console.ReadLine();\n      }\n   }\n}\n```\n\n你也可以选择从其他类中调用\
  \ Open 方法，这些方法将在该类的实例中使用。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace CalculatorApplication\n\
  {\n   class NumberManipulator\n   {\n      Open int FindMax(int num1, int num2)\n\
  \      {\n         /* 局部变量声明 */\n         int result;\n\n         if(num1 > num2)\n\
  \            result = num1;\n         else\n            result = num2;\n       \
  \  return result;\n      }\n   }\n\n   class Test\n   {\n      static void Main(string[]\
  \ args)\n      {\n         /* 局部变量定义 */\n         int a = 100;\n         int b =\
  \ 200;\n         int ret;\n\n         NumberManipulator n = new NumberManipulator();\n\
  \n         // 调用 FindMax 方法\n         ret = n.FindMax(a, b);\n         Console.WriteLine(\"\
  最大值是：{0}\", ret );\n         Console.ReadLine();\n      }\n   }\n}\n```\n\n### 递归方法调用\n\
  \n这种方法是对自身的调用，被称为递归。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace CalculatorApplication\n\
  {\n   class NumberManipulator\n   {\n      Open int factorial(int num)\n      {\n\
  \         /* 局部变量声明 */\n         int result;\n\n         if (num == 1)\n       \
  \  {\n            return 1;\n         }\n         else\n         {\n           \
  \ result = factorial(num - 1) * num;\n            return result;\n         }\n \
  \     }\n\n      static void Main(string[] args)\n      {\n         NumberManipulator\
  \ n = new NumberManipulator();\n\n         // 调用 factorial 方法\n         Console.WriteLine(\"\
  6 的阶乘是：{0}\", n.factorial(6));\n         Console.WriteLine(\"7 的阶乘是：{0}\", n.factorial(7));\n\
  \         Console.WriteLine(\"8 的阶乘是：{0}\", n.factorial(8));\n         Console.ReadLine();\n\
  \      }\n   }\n}\n```\n\n### 向方法传递参数\n\n每当调用参数时，你必须将参数传递给方法。至少有以下三种方式可以传递参数。\n\n\
  1. 值参数：值参数会将实参的值复制到函数的形参中。这样做之后，对参数所做的任何更改都不会影响实参。\n\n2. 引用参数：你的引用将被复制到实参的内存位置，并传递给形参。这最终意味着你对参数所做的更改将影响实参。\n\
  \n3. 输出参数：你将获得多个返回值。\n\n# 第十五章\n\n![](img/00001.jpeg)\n\n## C# 中的可空类型\n\n可空类型是一种特殊的数据类型，它可以将正常范围的值赋为\
  \ null。\n\n你可以存储从 -2,147,483,648 到 2,147,483,647 的任何值，或者 null。你也可以分配具有 true、false\
  \ 或 null 输出的值。\n\n**语法**\n\n`<数据类型> ? <变量名> = null;`\n\n**示例**\n\n```csharp\nusing\
  \ System;\n\nnamespace CalculatorApplication\n{\n   class NullablesAtShow\n   {\n\
  \      static void Main(string[] args)\n      {\n         int? num1 = null;\n  \
  \       int? num2 = 45;\n         double? num3 = new double?();\n         double?\
  \ num4 = 3.14157;\n         bool? boolval = new bool?();\n\n         // 显示值\n  \
  \       Console.WriteLine(\"可空类型显示：{0}, {1}, {2}, {3}\", num1, num2, num3, num4);\n\
  \         Console.WriteLine(\"可空布尔值：{0}\", boolval);\n         Console.ReadLine();\n\
  \      }\n   }\n}\n```\n\n### 空合并运算符（??）\n\n当使用可空值类型和引用类型时，会用到空合并运算符。你将使用空合并运算符将一个操作数转换为另一个可空值类型操作数的类型，前提是这种转换是可行的。\n\
  \n如果你的第一个操作数的值为 null，那么当运算符返回第二个操作数的值时，它将返回第一个操作数的值。\n\n**示例**\n\n```csharp\nusing\
  \ System;\n\nnamespace CalculatorApplication\n{\n   class NullablesAtShow\n   {\n\
  \      static void Main(string[] args)\n      {\n         double? num1 = null;\n\
  \         double? num2 = 3.14157;\n         double num3;\n\n         num3 = num1\
  \ ?? 5.34;\n         Console.WriteLine(\"num3 的值：{0}\", num3);\n\n         num3\
  \ = num2 ?? 5.34;\n         Console.WriteLine(\"num3 的值：{0}\", num3);\n\n      \
  \   Console.ReadLine();\n      }\n   }\n}\n```\n\n# 第十六章\n\n![](img/00001.jpeg)\n\
  \n## C# 中的数组\n\n数组用于存储固定大小的顺序集合，这些集合由对象或数据类型组成。数组可用于存储一组数据，这些数据作为数组比作为其他数据类型更有用。它还使得数据存储在连续的内存位置中。\n\
  \n与其声明单个变量，不如将数组中的一个变量声明为数字，并使用方括号来表示单个变量。你的变量将有一个索引位置，在尝试访问该元素时将使用该索引。\n\n数组由连续的内存位置组成，其中最低地址对应第一个元素。\n\
  \n### 声明数组\n\n**语法**\n\n`数据类型 [] 数组名;`\n\n1. 数据类型告诉你数组中元素的类型。\n\n2. 方括号告诉你数组的秩。秩将告诉你数组的大小。\n\
  \n3. 数组名显然告诉你正在处理的数组的名称。\n\n**示例**\n\n`double [ ] hello ;`\n\n### 初始化数组\n\n声明数组时，你不会在程序的内存中初始化数组。当数组变量被初始化时，你可以为数组赋值。\n\
  \n数组被称为引用类型，这意味着你需要使用 `new` 关键字来创建将在数组中发生的实例。\n\n**示例：**\n\n`double [ ] hello =\
  \ new double [ 39 ]`\n\n### 为数组赋值\n\n可以通过使用索引号为单个数组元素赋值。你也可以在声明时分配需要分配给数组的值。还可以选择手动创建和初始化数组。\n\
  \n另一种为数组赋值的方法是省略数组的大小。或者，你可以将数组中的变量复制到另一个目标数组变量中。这样做时，目标和源指针将位于内存中的同一位置。\n\n创建数组时，C#\
  \ 编译器会将数组的每个元素初始化为一个默认值，该值基于你正在处理的数组类型。\n\n### 访问数组元素\n\n元素将通过索引访问。你将通过将元素的索引放在数组名称后面的一组方括号内来实现这一点。\n\
  \n**示例：**\n\n```csharp\nusing System;\n\nnamespace ArrayApplication\n{\n   class\
  \ MyArray\n   {\n      static void Main(string[] args)\n      {\n         int []\
  \ n = new int[10]; /* n 是一个包含 10 个整数的数组 */\n         int i,j;\n\n         /* 初始化数组\
  \ n 的元素 */\n         for ( i = 0; i < 10; i++ )\n         {\n            n[ i ]\
  \ = i + 100;\n         }\n\n         /* 输出每个数组元素的值 */\n         for (j = 0; j <\
  \ 10; j++ )\n         {\n            Console.WriteLine(\"元素[{0}] = {1}\", j, n[j]);\n\
  \         }\n         Console.ReadKey();\n      }\n   }\n}\n```\n\n### For Each\
  \ 循环\n\nFor Each 语句用于遍历数组。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace ArrayApplication\n\
  {\n   class MyArray\n   {\n      static void Main(string[] args)\n      {\n```\n\
  \n\n\n\n\n```csharp\nint [] n = new int[10]; /* n 是一个包含 10 个整数的数组 */\n\n/* 初始化数组\
  \ n 的元素 */\n\nfor ( int i = 0; i < 10; i++ )\n{\n    n[i] = i + 100;\n}\n\n/* 输出每个数组元素的值\
  \ */\n\nforeach (int j in n )\n{\n    int i = j-100;\n    Console. WriteLine(\"\
  Element[{0}] = {1}\", i, j);\n}\n\nConsole.ReadKey();\n}\n}\n}\n```\n\n### 数组\n\n\
  1. 多维数组\n2. 交错数组\n3. 将数组传递给函数\n4. 参数数组\n5. 数组类\n\n# 第十七章\n\n![](img/00001.jpeg)\n\
  \n## C# 中的字符串\n\n使用 C#，你可以将字符串当作数组来使用。但更常见的做法是使用 `string` 关键字来声明字符串变量。`string` 关键字是\
