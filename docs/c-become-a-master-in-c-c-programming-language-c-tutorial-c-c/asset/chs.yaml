  \n## C# 结构体\n\n在 C# 中，数据类有值类型，它们可以帮助你创建单个变量来保存与该数据类相关的任何数据。`struct` 关键字用于创建结构体。\n\
  \n结构体用于表示记录。\n\n### 定义结构体\n\n要定义结构体，你需要使用 `struct` 语句。该语句用于在程序中定义包含多个成员的新数据类。\n\n\
  #### 示例\n\n```csharp\nusing System;\n\nstruct Books\n{\n    Open string title;\n\
  \    Open string author;\n    Open string subject;\n    Open int book_id;\n};\n\n\
  Open class testStructure\n{\n    Open static void Main(string[] args)\n    {\n \
  \       Books Book1; /* 声明 Book1 为 Books 类型 */\n        Books Book2; /* 声明 Book2\
  \ 为 Books 类型 */\n\n        /* book 1 规格 */\n        Book1.title = \"C Programming\"\
  ;\n        Book1.author = \"Nuha Ali\";\n        Book1.subject = \"C Programming\
  \ Tutorial\";\n        Book1.book_id = 6495407;\n\n        /* book 2 规格 */\n   \
  \     Book2.title = \"Telecom Billing\";\n        Book2.author = \"Zara Ali\";\n\
  \        Book2.subject = \"Telecom Billing Tutorial\";\n        Book2.book_id =\
  \ 6495700;\n\n        /* 打印 Book1 信息 */\n        Console. WriteLine( \"Book 1 title\
  \ : {0}\", Book1.title);\n        Console. WriteLine(\"Book 1 author : {0}\", Book1.author);\n\
  \        Console. WriteLine(\"Book 1 subject : {0}\", Book1.subject);\n        Console.\
  \ WriteLine(\"Book 1 book_id :{0}\", Book1.book_id);\n\n        /* 打印 Book2 信息 */\n\
  \        Console. WriteLine(\"Book 2 title : {0}\", Book2.title);\n        Console.\
  \ WriteLine(\"Book 2 author : {0}\", Book2.author);\n        Console. WriteLine(\"\
  Book 2 subject : {0}\", Book2.subject);\n        Console. WriteLine(\"Book 2 book_id\
  \ : {0}\", Book2.book_id);\n\n        Console.ReadKey();\n    }\n}\n```\n\n### C#\
  \ 结构体的特性\n\n既然你已经有了上面示例中创建的结构体，你会意识到它们与其他 C 编程语言中的结构体不同。C# 为其结构体提供了以下特性：\n\n1. 结构体可以包含方法、字段、属性、事件、运算符方法和索引器。\n\
  2. 结构体可以包含构造函数，但不能包含析构函数。\n3. 禁止继承。\n4. 不能将结构体用作任何其他结构体或类的基类。\n5. 结构体至少要实现一个接口。\n\
  \n\n\n\n\n6. 结构成员不允许被指定为 `protected`、`virtual` 或 `abstract`。\n\n7. 每当使用 `new` 运算符创建结构对象时，你将创建该对象及其对应的构造函数。\n\
  \n8. 如果未使用 `new` 运算符，则在字段初始化之前，该字段将保持未赋值状态。\n\n### 类与结构\n\n在 C# 中，结构与类之间至少存在三个区别：\n\
  \n1. 结构不允许拥有默认构造函数。\n2. 类使用引用类型，而结构使用值类型。\n3. 结构不能使用继承。\n\n**示例**\n\n```csharp\n\
  using System;\n\nstruct Books\n{\n    private string title;\n    private string\
  \ author;\n    private string subject;\n    private int book_id;\n\n    Open void\
  \ getValues(string t, string a, string s, int id)\n    {\n        title = t;\n \
  \       author = a;\n        subject = s;\n        book_id = id;\n    }\n\n    Open\
  \ void display()\n    {\n        Console.WriteLine(\"Title : {0}\", title);\n  \
  \      Console.WriteLine(\"Author : {0}\", author);\n        Console.WriteLine(\"\
  Subject : {0}\", subject);\n        Console.WriteLine(\"Book_id :{0}\", book_id);\n\
  \    }\n};\n\nOpen class testStructure\n{\n    Open static void Main(string[] args)\n\
  \    {\n        Books Book1 = new Books(); /* 声明 Book1 为 Books 类型 */\n        Books\
  \ Book2 = new Books(); /* 声明 Book2 为 Books 类型 */\n\n        /* book 1 规格 */\n  \
  \      Book1.getValues(\"C Programming\",\n            \"Nuha Ali\", \"C Programming\
  \ Tutorial\", 6495407);\n\n        /* book 2 规格 */\n        Book2.getValues(\"Telecom\
  \ Billing\",\n            \"Zara Ali\", \"Telecom Billing Tutorial\", 6495700);\n\
  \n        /* 打印 Book1 信息 */\n        Book1.display();\n\n        /* 打印 Book2 信息\
  \ */\n        Book2.display();\n\n        Console.ReadKey();\n    }\n}\n```\n\n\
  # 第十九章\n\n![](img/00001.jpeg)\n\n## C# 中的枚举\n\n枚举用于命名一组整数常量。这些枚举类型通过 `enum` 关键字进行声明。\n\
  \nC# 中的枚举属于值类型。最终，枚举将持有自身的值，并且不会继承或传递继承。\n\n### 声明枚举变量\n\n**语法**\n\n```csharp\n\
  Enum <enum_name>\n{\n    Enumeration list\n};\n```\n\n1. `enum_name` 是所使用的枚举类型。\n\
  2. 枚举列表是一个由逗号分隔的标识符列表。\n\n枚举列表中的每个符号都代表一个特定的整数。较大的值会排在前面。默认情况下，第一个枚举符号为 0。\n\n示例：`enum\
  \ num { 1, 2, 3, 4, 5, 6 };`\n\n**枚举变量示例**\n\n```csharp\nusing System;\n\nnamespace\
  \ EnumApplication\n{\n    class EnumProgram\n    {\n        enum Days { Sun, Mon,\
  \ Tue, Wed, Thu, Fri, Sat };\n\n        static void Main(string[] args)\n      \
  \  {\n            int WeekdayStart = (int)Days.Mon;\n            int WeekdayEnd\
  \ = (int)Days.Fri;\n\n            Console.WriteLine(\"Monday: {0}\", WeekdayStart);\n\
  \            Console.WriteLine(\"Friday: {0}\", WeekdayEnd);\n\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\n## C# 中的类\n\n当定义一个类时，你实际上是在为该数据类型定义一个蓝图。你并没有真正定义任何数据，而是定义了该类名称的含义。这意味着它将包含该类中的对象以及操作将执行的内容。类中的方法和变量被称为类的成员。\n\
  \n### 定义类\n\n类定义以关键字 `class` 开头，后跟类名。类体由一对花括号括起来。\n\n**示例**\n\n```csharp\n<access\
  \ specifier> class class_name\n{\n    // 成员变量\n    <access specifier> <data class>\
  \ variable1;\n    <access specifier> <data class> variable2;\n    ...\n    <access\
  \ specifier> <data class> variableN;\n\n    // 成员方法\n    <access specifier> <return\
  \ class> method1(parameter_list)\n    {\n        // 方法体\n    }\n    <access specifier>\
  \ <return class> method2(parameter_list)\n    {\n        // 方法体\n    }\n    ...\n\
  \    <access specifier> <return class> methodN(parameter_list)\n    {\n        //\
  \ 方法体\n    }\n}\n```\n\n请记住：\n\n1. 要按特定访问规则访问说明符，你需要访问成员和类。如果未指定任何内容，则使用默认值，即内部类。成员的默认访问级别是私有。\n\
  2. 需要指定数据类型，即你正在使用的变量类型以及返回类型，以便在需要时按预期返回数据类型方法。\n3. 要访问类成员，需要使用点运算符。\n4. 点运算符链接将告诉你对象名称和成员名称。\n\
  \n**示例**\n\n```csharp\nusing System;\n\nnamespace BoxApplication\n{\n    class Box\n\
  \    {\n        Open double length;   // 盒子的长度\n        Open double breadth;  //\
  \ 盒子的宽度\n        Open double height;   // 盒子的高度\n    }\n\n    class Boxtester\n\
  \    {\n        static void Main(string[] args)\n        {\n            Box Box1\
  \ = new Box();   // 声明 Box1 为 Box 类型\n            Box Box2 = new Box();   // 声明\
  \ Box2 为 Box 类型\n            double volume = 0.0;    // 在此存储盒子的体积\n\n          \
  \  // box 1 规格\n            Box1.height = 5.0;\n            Box1.length = 6.0;\n\
  \            Box1.breadth = 7.0;\n\n            // box 2 规格\n            Box2.height\
  \ = 10.0;\n            Box2.length = 12.0;\n            Box2.breadth = 13.0;\n\n\
  \            // box 1 的体积\n            volume = Box1.height * Box1.length * Box1.breadth;\n\
  \            Console.WriteLine(\"Volume of Box1 : {0}\", volume);\n\n          \
  \  // box 2 的体积\n            volume = Box2.height * Box2.length * Box2.breadth;\n\
  \            Console.WriteLine(\"Volume of Box2 : {0}\", volume);\n\n          \
  \  Console.ReadKey();\n        }\n    }\n}\n```\n\n### 成员函数与封装\n\n成员函数是类的一部分，在类定义内部拥有自己的定义和原型，类似于其他变量。这些函数操作类的对象，成员可以访问该对象所属类的所有成员。\n\
  \n成员变量被称为属性，通常保持私有以实现封装。正是这些变量可以通过 `Open` 函数进行访问。\n\n**示例**\n\n```csharp\nusing\
  \ System;\n\nnamespace BoxApplication\n{\n    class Box\n    {\n        private\
  \ double length;   // 盒子的长度\n        private double breadth;  // 盒子的宽度\n       \
  \ private double height;   // 盒子的高度\n\n        Open void setLength(double len)\n\
  \        {\n            length = len;\n        }\n\n        Open void setBreadth(double\
  \ bre)\n        {\n            breadth = bre;\n        }\n\n        Open void setHeight(double\
  \ hei)\n        {\n            height = hei;\n        }\n\n        Open double getVolume()\n\
  \        {\n            return length * breadth * height;\n        }\n    }\n\n\
  \    class Boxtester\n    {\n        static void Main(string[] args)\n        {\n\
  \            Box Box1 = new Box();   // 声明 Box1 为 Box 类型\n            Box Box2 =\
  \ new Box();\n            double volume;\n\n            // 声明 Box2 为 Box 类型\n\n\
  \            // box 1 规格\n            Box1.setLength(6.0);\n            Box1.setBreadth(7.0);\n\
  \            Box1.setHeight(5.0);\n\n            // box 2 规格\n            Box2.setLength(12.0);\n\
  \            Box2.setBreadth(13.0);\n            Box2.setHeight(10.0);\n\n     \
  \       // box 1 的体积\n            volume = Box1.getVolume();\n            Console.WriteLine(\"\
  Volume of Box1 : {0}\", volume);\n\n            // box 2 的体积\n            volume\
  \ = Box2.getVolume();\n            Console.WriteLine(\"Volume of Box2 : {0}\", volume);\n\
  \n            Console.ReadKey();\n        }\n    }\n}\n```\n\n### 构造函数\n\n类的构造函数是该类的特殊函数，当你在该类中创建新对象时，它们会按需执行。\n\
  \n构造函数与类名相同，但没有返回类型。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace LineApplication\n\
  {\n    class Line\n    {\n        private double length;   // 线的长度\n\n        Open\
  \ Line()\n        {\n            Console.WriteLine(\"Object is being created\");\n\
  \        }\n\n        Open void setLength(double len)\n        {\n            length\
  \ = len;\n        }\n\n        Open double getLength()\n        {\n            return\
  \ length;\n        }\n\n        static void Main(string[] args)\n        {\n   \
  \         Line line = new Line();\n\n            // 设置线的长度\n            line.setLength(6.0);\n\
  \            Console.WriteLine(\"Length of line : {0}\", line.getLength());\n\n\
  \            Console.ReadKey();\n        }\n    }\n}\n```\n\n\n\n\n\n默认构造函数不会提供任何参数，但如果你需要一个可以带参数的构造函数，则存在一些称为参数化构造函数的参数，它们有助于在创建对象时为其赋予初始值。\n\
  \n**示例**\n\n```\nusing System;\n\nnamespace LineApplication\n\n{\n\nclass Line\n\
  \n{\n\nprivate double length; // Length of a line\n\nOpen Line(double len) //Parameterized\
  \ constructor\n\n{\n\nConsole. WriteLine(\"Object is being created, length = {0}\"\
  , len);\n\nlength = len;\n\n}\n\nOpen void setLength( double len )\n\n{\n\nlength\
  \ = len;\n\n}\n\nOpen double getLength()\n\n{\n\nreturn length;\n\n}\n\nstatic void\
  \ Main(string[] args)\n\n{\n\nLine line = new Line(10.0);\n\nConsole. WriteLine(\"\
  Length of line : {0}\", line.getLength());\n\n// set line length\n\nline.setLength(6.0);\n\
  \nConsole. WriteLine(\"Length of line : {0}\", line.getLength());\n\nConsole.ReadKey();\n\
  \n}\n\n}\n\n}\n```\n\n### 析构函数\n\n析构函数也是一种特殊函数，当某个类超出其作用域时会被执行。析构函数与类同名，但前面会有一个波浪号（~），并且不能有任何参数或返回值。\n\
  \n当你需要在退出程序前释放内存时，析构函数会很有用，但析构函数不能被继承或重载。\n\n**示例**\n\n```\nusing System;\n\nnamespace\
  \ LineApplication\n\n{\n\nclass Line\n\n{\n\nprivate double length; // Length of\
  \ a line\n\nOpen Line() // constructor\n\n{\n\nConsole. WriteLine(\"Object is being\
  \ created\");\n\n}\n\n~Line() //destructor\n\n{\n\nConsole. WriteLine(\"Object is\
  \ being deleted\");\n\n}\n\nOpen void setLength( double len )\n\n{\n\nlength = len;\n\
  \n}\n\nOpen double getLength()\n\n{\n\nreturn length;\n\n}\n\nstatic void Main(string[]\
  \ args)\n\n{\n\nLine line = new Line();\n\n// set line length\n\nline.setLength(6.0);\n\
  \nConsole. WriteLine(\"Length of line : {0}\", line.getLength());\n\n}\n\n}\n\n\
  }\n```\n\n# 结语\n\n![](img/00001.jpeg)\n\n感谢您坚持读完了《C#》的全文，希望它内容丰富，并能为您提供实现目标所需的一切工具，无论目标是什么。\n\
