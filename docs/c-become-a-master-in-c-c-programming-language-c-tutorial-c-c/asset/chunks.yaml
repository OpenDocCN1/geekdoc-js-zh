    ## MEMBER FUNCTIONS AND ENCAPSULATION


    The member functions are part of a class with its own definition and protoclass
    inside the class definition which will be similar to other variables. These functions
    operate the objects of a class where the member can access all the members of
    the class of that object.


    The member variables are known as attributes that will be kept private for implementing
    encapsulation. It is these variables that will have access to the Open functions.


    **Example**


