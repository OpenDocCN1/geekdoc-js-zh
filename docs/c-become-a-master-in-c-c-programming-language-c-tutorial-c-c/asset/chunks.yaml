    # INTRODUCTION


    Congratulations on downloading *C#* and thank you for doing so.


    The following chapters will discuss everything you need to know about C#. By the
    time that you finish this book, you should be able to use C# to write programs
    and interact with a computer on the proper level for that language.


    C# is going to be similar to other C languages, but you are going to realize that
    there are some differences that make it its own unique language.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # Chapter One: An Overview of C#


    Whenever you begin to use C#, you are going to notice that it is a language that
    is object oriented that was created by the Microsoft company and then approved
    by the ECMA (European Computer Manufacturers Association) as well as the ISO (International
    Standards Organization).


    Anders Hejlsberg developed the language while his team worked on developing the
    .Net framework that goes with it. It was designed to be used with CLI (Common
    Language Infrastructures) which are going to show you the code that can be performed
    along with the runtime environment that is going to allow for you to use an elevated
    level on various platform and architectures.


    Some of the reasons that make C# a widely used language are:


    1. You can use it as part of the .Net framework

    2. It is a general-purpose programming language

    3. You can use it across a variety of platforms

    4. It is an object-oriented program

    5. It is going to produce programs that are efficient

    6. It is component oriented

    7. The language is structured and easy to learn


    While it may seem that C# is nothing more than another variation of the C programming
    language, it is going to resemble Java more than it will C due to the fact that
    it is a program that is used by programmers all over the world.


    Some of the features that programmers find important are:


    1. It can be integrated with Windows

    2. Boolean conditions

    3. Expressions for LINQ and Lambda

    4. Automatic garbage collection

    5. Multithreading made simple

    6. Standard library

    7. Conditional compilation

    8. Assembly variations

    9. Indexers

    10. Properties and events

    11. Easy to use Generics

    12. Delegates and event management


    # Chapter Two: The History of C#


    Whenever the .Net framework was being developed, the class libraries were written
    with managed code compilers in a system known as Simple Managed C. it was not
    until January of 99 that Hejlsberg builds a team that built the new language which
    was called Cool for short but was really C like Object Oriented Language. It was
    then that Microsoft had thought about using Cool as the final name for their project,
    however, did not due to copyright reasons.


    The .Net project was announced to the Open in 2000 at the Professional Developers
    Conference that the language with the new name of C# and the class libraries were
    given the name ASP. Net while runtime was ported into the language.


    The principal designer of the C# language was also the head architect at Microsoft
    and had been involved in creating the design for Turbo Pascal, Embarcadero Delphi
    which used to be known as CodeGear Delphi Inpris Delphi and BorlandDelphi as well
    as working with Visual J++. When sitting through interviews and papers that were
    written, Hejlsberg said that the flaws that could be found in most of the programming
    languages would be what drove the fundamentals for the Common Language Runtime
    which then drove the design for the language itself.

