  trans: "\n你实际上不会在引用类变量中存储任何数据。基本上，你只是引用程序内存中的一个位置。当你使用多个变量时，引用类将指向这些类所在的位置。如果该位置的数据被某个变量修改，那么另一个变量将自动反映这一变化。\n\
    \n### 对象类\n\n该类将成为你在 C# 中遇到的所有数据类的基类。CTS（通用类型系统）在使用该系统时会使用别名 `Object` 类。只要该类由程序预定义或由用户定义，这个\
    \ `Object` 类就可以被赋值为本章将要讨论的其他类的值。在你可以赋值之前，需要先进行转换。\n\n当 `Object` 类被转换时，这一过程称为装箱（boxing）；而当它被转换为值类型时，则称为拆箱（unboxing）。\n\
    \n### 动态类型\n\n任何类的任何值都可以存储在 `dynamic` 类中。你需要在运行时检查这些变量类，因为它们的类型检查发生在运行时。`dynamic`\
    \ 类与 `object` 类类似，但 `object` 类的类型检查发生在编译时。\n\n**语法**\n\n```\nDynamic <variable_name>\
    \ = value;\n```\n\n### 字符串类\n\n该类允许你将任何字符串值赋给任何变量。`string` 类在系统中包含一个别名 `String`\
    \ 类。该类也派生自 `object` 类。你会注意到，`string` 类的值是通过字符串字面量来赋值的，字符串字面量有两种形式：带引号的和 @ 引号的。\n\
    \n用户定义的引用类被称为 `interface`、`delegate` 和 `class`。\n\n### 指针类\n\n指针变量将存储其他类的内存地址。这些指针具有与其他\
    \ C 语言中指针相同的功能。\n\n**语法**\n\n```\nClass * identifier;\n```\n\n# 第七章\n\n![](img/00001.jpeg)\n\
    \n## C# 中的类型转换\n\nC# 类型转换是将一种数据类型转换为另一种数据类型的行为。你可能也听说过这种转换称为类型强制转换。你会发现有两种不同的转换类型。\n\
    \n1. 隐式转换：在此类转换下，C# 会以与正在转换的类相同的方式执行转换。例如，当转换从最小到最大时，会使派生类转换为基类。\n\n2. 显式转换：显式转换由用户在使用预定义函数时完成。这些转换需要强制转换运算符。\n\
    \n**语法**\n\n```\nusing System;\n\nnamespace TypeClassConversionApplication\n{\n\
    \    class ExplicitConversion\n    {\n        static void Main(string[] args)\n\
    \        {\n            double d = 5673.74;\n            int i;\n\n          \
    \  // cast double to int.\n            i = (int)d;\n\n            Console.WriteLine(i);\n\
    \            Console.ReadKey();\n        }\n    }\n}\n```\n\n### 转换方法\n\n1. `ToBoolean`：将转换为布尔类\n\
    2. `ToByte`：将转换为字节\n3. `ToChar`：将转换为单个 Unicode 字符中的字符\n4. `ToDateTime`：将转换你的日期和时间结构\n\
    5. `ToDecimal`：将浮点数或整数转换为十进制类\n6. `ToDouble`：将类转换为双精度类\n7. `ToInt16`：将类转换为 16\
    \ 位整数\n8. `ToInt32`：将类转换为 32 位整数\n9. `ToInt64`：将类转换为 64 位整数\n10. `ToSByte`：将你的类转换为有符号字节类\n\
    11. `ToSingle`：将类转换为浮点数，但数值较小\n12. `ToString`：将你的类转换为字符串\n13. `ToType`：将你的类转换为指定的类\n\
    14. `ToUInt16`：你将得到一个无符号整数类\n15. `ToUInt32`：你将得到一个无符号长整型类\n16. `ToUInt64`：你将得到一个无符号大整数\n\
    \n**示例：**\n\n```\nusing System;\n\nnamespace ClassConversionApplication\n{\n \
    \   class StringConversion\n    {\n        static void Main(string[] args)\n \
    \       {\n            int i = 75;\n            float f = 53.005f;\n         \
    \   double d = 2345.7652;\n            bool b = true;\n\n            Console.WriteLine(i.ToString());\n\
    \            Console.WriteLine(f.ToString());\n            Console.WriteLine(d.ToString());\n\
    \            Console.WriteLine(b.ToString());\n\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n# 第八章\n\n![](img/00001.jpeg)\n\n## C# 中的变量\n\n变量本质上只是存储区域中的一个名称，用于操作数据。每个变量都包含特定的类，该类决定了变量内存的大小和布局。每个内存区域都有一系列可以存储的值，以及一组可以应用于每个变量的操作。\n\
    \nC# 提供的一些基本值类型包括：\n\n1. 整型类：`char`、`ulong`、`long`、`uint`、`int`、`ushort`、`short`、`byte`、`sbyte`\n\
    2. 浮点型：`double` 和 `float`\n3. 十进制类：`decimal`\n4. 布尔型：`true`、`false`、赋值\n5. 可空类型：`Nullable`\n\
    \nC# 允许你使用 `class` 和 `enum` 等变量来定义值类型。\n\n### 定义变量\n\n**语法**\n\n```\n<data_class>\
    \ <variable_lists>;\n```\n\n数据类型必须是有效的 C# 数据类型。变量列表必须至少包含一个标识符，多个标识符之间用逗号分隔。\n\
    \n**变量定义：**\n\n```\nint i, j, k;\nchar c, ch;\nfloat f, salary;\ndouble d;\n```\n\
    \n**初始化变量**\n\n初始化变量时，需要有一个等号，后面跟着一个常量表达式。\n\n**语法**\n\n```\nvariable_name = value;\n\
    ```\n\n你可以在声明变量的同时进行初始化。初始化器由一个等号和后面的常量表达式组成。\n\n**语法**\n\n```\n<data_class> <variable_name>\
    \ = value;\n```\n\n**示例**\n\n```\nint d = 3, f = 5; /* 初始化 d 和 f。 */\nbyte z =\
    \ 22; /* 初始化 z。 */\ndouble pi = 3.14159; /* 声明 pi 的近似值。 */\nchar x = 'x'; /* 变量\
    \ x 的值为 'x'。 */\n```\n\n你需要以正确的方式初始化变量，否则程序会给出你意想不到的结果。\n\n**示例**\n\n```\nusing\
    \ System;\n\nnamespace VariableDefinition\n{\n    class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n            short a;\n       \
    \     int b ;\n            double c;\n\n            /* 实际初始化 */\n            a\
    \ = 10;\n            b = 20;\n            c = a + b;\n\n            Console.WriteLine(\"\
    a = {0}, b = {1}, c = {2}\", a, b, c);\n            Console.ReadLine();\n    \
    \    }\n    }\n}\n```\n\n**接受用户输入**\n\n你的 `Console` 类位于 `System` 命名空间中，它提供了一个名为\
    \ `ReadLine()` 的函数，用于接受用户输入并将其存储为变量。\n\n**示例**\n\n```\nint num;\nnum = Convert.ToInt32(Console.ReadLine());\n\
    ```\n\n你的 `Convert.ToInt32()` 函数会获取数据并将其转换，以便程序能够读取。\n\n### 左值和右值表达式\n\n在 C# 中，你会遇到两种不同的表达式：\n\
    \n1. 右值：该表达式出现在赋值操作的右侧，而不是左侧。\n2. 左值：该表达式可以出现在赋值操作的左侧或右侧。\n\n左值变量可以出现在赋值操作的左侧。数值字面量是右值，这就是为什么它们不能被赋值，因此不能出现在赋值操作的左侧。\n\
    \n# 第九章\n\n![](img/00001.jpeg)\n\n## C# 常量和字面量\n\n"
- fmt: "\nYour constant is going to refer to a value that is fixed and cannot be altered\
    \ while the program is performing code. The values that are fixed are going to\
    \ be known as literals. A constant is going to be any data class such as an integer\
    \ or a character. You can also have enumeration constants as well.\n\nYou are\
    \ going to treat your constant like a regular variable except for the fact that\
    \ your values are not going to be able to be changed after they have been defined.\n\
    \n## INTEGER LITERALS\n\nInteger literals are going to be things such as decimals\
    \ or hexadecimals. The prefix is going to tell you the base or radix. It is going\
    \ to either be `0x` or `0X` when you are working with hexadecimal, but there is\
    \ not going to be a prefix id for the decimals.\n\nYour integer literals can also\
    \ use `U` and `L` for the suffix for those that are unsigned and long. The suffix\
    \ will either be capitalized or lowercase depending on the order.\n\n**Example**\n\
    \n```\n85 /* decimal */\n0x4b /* hexadecimal */\n30 /* int */\n30u /* unsigned\
    \ int */\n30l /* long */\n30ul /* unsigned long */\n```\n\n## FLOATING POINT LITERALS\n\
    \nThe floating point literals will be composed of four parts: exponent, fractional,\
    \ integer, decimal. You are also going to be able to represent these literals\
    \ in the exponential form or their decimal form.\n\n**Example**\n\n```\n3.14159\
    \ /* Legal */\n314159E-5F /* Legal */\n510E /* Illegal: incomplete exponent */\n\
    210f /* Illegal: no decimal or exponent */\n.e55 /* Illegal: missing integer or\
    \ fraction */\n```\n\nWhen working with the decimal form you need to ensure that\
    \ you include the decimal point, the exponent, or even both. For the exponential\
    \ form you will need to include the integer part, the fractional part, or if you\
    \ choose to, you can do both. For signed exponents, you are going to use `e` or\
    \ `E`.\n\n## CHARACTER CONSTANTS\n\nThe character literals are going to be surrounded\
    \ by a set of single quotes and are going to be stored in a `char` class. These\
    \ literals are going to be plain characters or even escape sequences, you may\
    \ even see some that are universal characters.\n\nSome characters that are used\
    \ in C# are going to be preceded by backslashes which mean that they have a special\
    \ meaning and are going to represented differently.\n\nEscape sequences are:\n\
    \n1. `\\xhh`: hexadecimal with multiple digits\n2. `\\\\`: `\\` character\n3.\
    \ `\\v`: vertical tab\n4. `\\'`: `'` character\n5. `\\t`: horizontal tab\n6. `\\\
    \"`: `\"` character\n7. `\\r`: carriage return\n8. `\\?`: `?` character\n9. `\\\
    n`: newline\n10. `\\a`: alerts\n11. `\\f`: form feed\n12. `\\b`: backspace\n\n\
    **Example**\n\n```\nusing System;\n\nnamespace EscapeChar\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Hello\\tWorld\\n\\n\");\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\n## STRING LITERALS\n\nA string literal or constant is going to be surrounded\
    \ by double quotes, or contain an at symbol (`@`). These strings are going to\
    \ be full of characters that are going to look similar to the character literals.\n\
    \nLong lines can be broken up into multiple lines through the use of string literals\
    \ as long as whitespaces are used for the separation process.\n\n**Example**\n\
    \n```\n\"hello, dear\"\n\"hello, \\\ndear\"\n\"hello, \" \"d\" \"ear\"\n@\"hello\
    \ dear\"\n```\n\n## DEFINING CONSTANTS\n\nA constant is going to be defined by\
    \ using the `const` keyword.\n\n**Syntax**\n\n```\nconst <data_class> <constant_name>\
    \ = value;\n```\n\n**Example**\n\n```\nusing System;\n\nnamespace DeclaringConstants\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            const double pi = 3.14159;\n            // constant declaration\n\
    \            double r;\n            Console.WriteLine(\"Enter Radius: \");\n \
    \           r = Convert.ToDouble(Console.ReadLine());\n            double areaCircle\
    \ = pi * r * r;\n            Console.WriteLine(\"Radius: {0}, Area: {1}\", r,\
    \ areaCircle);\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n\
    # CHAPTER TEN\n\n![](images/00001.jpeg)\n\n# C# OPERATORS\n\nThe operators are\
    \ going to be the symbols that inform the compiler what action to perform in mathematical\
    \ or logical expressions. There are operators that are built into C# such as:\n\
    \n1. Misc\n2. Arithmetic\n3. Assignment\n4. Relational\n5. Bitwise\n6. Logical\n\
    \n## ARITHMETIC OPERATORS\n\n1. Addition (`+`)\n2. Subtraction (`-`)\n3. Multiplication\
    \ (`*`)\n4. Division (`/`)\n5. Modulus (`%`)\n6. Increases by one (`++`)\n7. Decreases\
    \ by one (`--`)\n\n## RELATIONAL\n\n1. Is the value true? (`==`)\n2. Are the values\
    \ equal (`!=`)\n3. Greater than (`>`)\n4. Less than (`<`)\n5. Greater than or\
    \ equal to (`>=`)\n6. Less than or equal to (`<=`)\n\n## LOGICAL\n\n1. Logical\
    \ and (`&&`)\n2. Logical or (`||`)\n3. Logical not (`!`)\n\n## Bitwise\n\n1. Binary\
    \ and (`&`)\n2. Binary or (`|`)\n3. Binary XOR (`^`)\n4. Binary ones (`~`)\n5.\
    \ Binary left shift (`<<`)\n6. Binary right shift (`>>`)\n\n## ASSIGNMENT\n\n\
    1. Assigning values (`=`)\n2. And assignment (`+=`)\n3. Subtract and assign (`-=`)\n\
    4. Multiple and assign (`*=`)\n5. Divide and assign (`/=`)\n6. Modulus and assign\
    \ (`%=`)\n7. Left shift and assign (`<<=`)\n8. Right shift and assign (`>>=`)\n\
    9. Bitwise and assign (`&=`)\n10. Bitwise exclusive or and assign (`^=`)\n11.\
    \ Bitwise inclusive or and assign (`|=`)\n\n## MISC\n\n1. `sizeof()`\n2. `classof()`\n\
    3. Variable address (`&`)\n4. Pointer to variables (`*`)\n5. Conditional expression\
    \ (`? :`)\n6. Object class determination (`is`)\n7. Does not rise expectation\
    \ if cast falls (`as`)\n\n## OPERATOR PRECEDENCE\n\nThe precedence in C# is going\
    \ to tell you what group of terms is going to be evaluated first. There are certain\
    \ operators that have a higher precedence than others such as multiplication is\
    \ going to be higher than addition.\n\nHere at the precedence for C#\n\n1. Postfix:\
    \ `()`, `[]`, `.`, `++`, `--`\n2. Unary: `+`, `-`, `!`, `~`, `++`, `--`, `(class)*`,\
    \ `&`, `sizeof`\n3. Multiplicative: `*`, `/`, `%`\n4. Additive: `+`, `-`\n5. Shift:\
    \ `<<`, `>>`\n6. Relational: `<`, `<=`, `>`, `>=`\n7. Equality: `==`, `!=`\n8.\
    \ Bitwise and: `&`\n9. Bitwise XOR: `^`\n10. Bitwise or: `|`\n11. Logical and:\
    \ `&&`\n12. Logical or: `||`\n13. Conditional: `?:`\n14. Assignment: `=`, `+=`,\
    \ `-=`, `^=`, `/=`, `%=`, `=>`, `>=`, `<<=`, `&=`, `^=`, `|=`\n15. Comma: `,`\n\
    \n# CHAPTER ELEVEN\n\n![](images/00001.jpeg)\n\n# DECISION MAKING WITH C#\n\n\
    You are going to use decision making in C# to learn how a program is working.\
