    # C# STRUCTURES


    With C# there are value classes for the data classes that are going to help you
    make single variables that will hold any data that is related to that data class.
    The struct keyword is what you are going to use in order to create a structure.


    A structure is going to be used in representing records.


    ## DEFINING STRUCTURES


    In order to define a structure, you are going to use a struct statement. This
    statement is going to be used in defining a new data class that has more than
    one member inside of your program.


    **Example**


    using System;


    struct Books


    {


    Open string title;


    Open string author;


    Open string subject;


    Open int book_id;


    };


    Open class testStructure


    {


    Open static void Main(string[] args)


    {


    Books Book1; /* Declare Book1 of class Book */


    Books Book2; /* Declare Book2 of class Book */


    /* book 1 specification */


    Book1.title = "C Programming";


    Book1.author = "Nuha Ali";


    Book1.subject = "C Programming Tutorial";


    Book1.book_id = 6495407;


    /* book 2 specification */


    Book2.title = "Telecom Billing";


    Book2.author = "Zara Ali";


    Book2.subject = "Telecom Billing Tutorial";


    Book2.book_id = 6495700;


    /* print Book1 info */


    Console. WriteLine( "Book 1 title : {0}", Book1.title);


    Console. WriteLine("Book 1 author : {0}", Book1.author);


    Console. WriteLine("Book 1 subject : {0}", Book1.subject);


    Console. WriteLine("Book 1 book_id :{0}", Book1.book_id);


    /* print Book2 info */


    Console. WriteLine("Book 2 title : {0}", Book2.title);


    Console. WriteLine("Book 2 author : {0}", Book2.author);


    Console. WriteLine("Book 2 subject : {0}", Book2.subject);


    Console. WriteLine("Book 2 book_id : {0}", Book2.book_id);


    Console.ReadKey();


    }


    }


    ## FEATURES OF A C# STRUCTURE


    Since you already have the structure that was created in the example above, you
    are going to realize that they are different than structures that you find in
    other C programming languages. C# includes these features for their structures.


    1\. Structures are allowed to have methods, fields, properties, events, operator
    methods, and indexers.


    2\. These structures are allowed to have constructors but cannot have destructors.


    3\. Inheritance is forbidden.


    4\. You cannot use a base for any other structure or class


    5\. The structure is going to implement at least one interface'
