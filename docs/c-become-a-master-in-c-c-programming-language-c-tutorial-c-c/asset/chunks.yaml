    # C# 中的封装


    你可以将封装定义为将一个或多个项目封装在逻辑或物理包中的过程。封装是在面向对象的编程语言中完成的，这种方法最终会阻止对实现细节的访问。


    抽象和封装是你只能在面向对象编程中找到的特性。然而，抽象将代码中的相关信息转化为代码的可见部分，而封装则允许程序员在代码中实现他们想要的抽象级别。


    有一些访问说明符可以实现封装。访问说明符将定义作用域以及类成员的可见性。以下是 C# 支持的说明符。


    1. `Protected internal`


    2. `Open`


    3. `Internal`


    4. `Private`


    5. `Protected`


    ## OPEN


    这些说明符将使类能够展示其成员变量和函数，以便其他对象和函数可以看到它们。当一个成员是 `Open` 时，它可以从外部访问。


    **示例**


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle


    {


    //member variables


    Open double length;


    Open double width;


    Open double GetArea()


    {


    return length * width;


    }


    Open void Display()


    {


    Console. WriteLine("Length: {0}", length);


    Console. WriteLine("Width: {0}", width);


    Console. WriteLine("Area: {0}", GetArea());


    }


    }//end class Rectangle


    class PerformRectangle


    {


    static void Main(string[] args)


    {


    Rectangle r = new Rectangle();


    r.length = 4.5;


    r.width = 3.5;


    r.Display();


    Console.ReadLine();


    }


    }


    }

    ```


    在这个示例中，你可以看到成员变量 `length` 和 `width` 是 `Open` 的，因此可以通过使用类名从你的函数中访问它们。你的成员函数只能直接访问变量，而不需要使用任何类实例。它们也通过使用
    `main()` 函数被声明为 `Open`。


    ## PRIVATE


    `Private` 说明符将使类能够隐藏其成员变量和函数，使其不被代码中的其他内容访问。只有在同一个类中的函数才能访问私有成员。甚至会出现类无法访问私有成员的情况。


    **示例**


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle


    {


    //member variables


    private double length;


    private double width;


    Open void Acceptdetails()


    {


    Console. WriteLine("Enter Length: ");


    length = Convert.ToDouble(Console.ReadLine());


    Console. WriteLine("Enter Width: ");


    width = Convert.ToDouble(Console.ReadLine());


    }


    Open double GetArea()


    {


    return length * width;


    }


    Open void Display()


    {


    Console. WriteLine("Length: {0}", length);


    Console. WriteLine("Width: {0}", width);


    Console. WriteLine("Area: {0}", GetArea());


    }


    }//end class Rectangle


    class PerformRectangle


    {


    static void Main(string[] args)


    {


    Rectangle r = new Rectangle();


    r.Acceptdetails();


    r.Display();


    Console.ReadLine();


    }


    }


    }

    ```


    在上面的示例中，成员变量被声明为私有，因此函数无法访问它们。然而，成员函数会显示这些变量。由于成员函数是开放的，因此可以通过使用类名的实例从主函数中访问它们。


    ## 受保护的访问说明符


    该说明符将允许子类访问其基类中的成员变量和函数。这在处理继承时非常有用。


    ## 内部访问说明符


    `internal` 访问说明符将允许成员函数和变量暴露给你正在处理的程序集中的其他函数和对象。因此，只要成员定义所在的应用程序中定义了任何类或方法，你就可以访问它们。


    **示例**


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle


    {


    //member variables


    internal double length;


    internal double width;


    double GetArea()


    {


    return length * width;


    }


    Open void Display()


    {


    Console. WriteLine("Length: {0}", length);


    Console. WriteLine("Width: {0}", width);


    Console. WriteLine("Area: {0}", GetArea());


    }


    }//end class Rectangle


    class PerformRectangle


    {


    static void Main(string[] args)


    {


    Rectangle r = new Rectangle();


    r.length = 4.5;


    r.width = 3.5;


    r.Display();


    Console.ReadLine();


    }


    }


    }

    ```


    这个示例表明，成员函数没有用提供访问权限的说明符声明。因此，类成员的默认访问说明符没有被提及，因为它实际上是私有的。


    ## 受保护的内部访问说明符


    该说明符将隐藏类的成员变量和函数，使其不被其他类对象和函数访问，但同一应用程序中的子类除外。你将在实现继承时使用此方法。


