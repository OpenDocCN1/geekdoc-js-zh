- fmt: '

    In 94, James Gosling created the Java language, and Bill Joy who was the co-founder
    for Sun Microsystems said that C# was just an imitation of the Java language.
    He even went as far to say, “C# is sort of Java with reliability, productivity,
    ad security deleted.” Kreft and Langer came back saying that “Java and C# are
    almost identical programming languages. Boring repetition that lacks innovation.
    Hardly anybody will claim that Java or C# are revolutionary programming languages
    that changed the way we write programs. And, C# borrowed a lot from Java and vice
    versa. Now that C# supports boxing and unboxing, we will have a very similar feature
    in Java.”


    Later in 2000 Hejlsberg stepped up and said, “C# is not a Java clone and is much
    closer to C++ in its design.”


    Ever since variation 2.0 was released in 2005, C# and Java evolved on different
    trajectories which made them less similar than the other. One of the biggest differences
    was the addition of generics to the languages which made them different from each
    other. C# uses reification in order to offer first class generic objects that
    have the ability to be used in other classes as the code is generated to perform
    at class load time. Along with that, C# has features that make it to where it
    is a functional style programming language that works with the LINQ extensions
    that were released with variation 3.0 of C#.


    Here are the features that were added in each variation of C# as they were released.


    ## VARIATION 2.0


    1. Delegate inference

    2. Generics

    3. Static classes

    4. Partial classes

    5. Co and contravariance for delegates

    6. Anonymous methods

    7. Method group conversations

    8. Iterators

    9. Getter/ setter separate accessibility

    10. Nullable class


    ## VARIATION 3.0


    1. Partial methods

    2. Implicitly class local variables

    3. Expression trees

    4. Object and collection initializers

    5. Lambda expression

    6. Auto-implemented properties

    7. Query expressions

    8. Anonymous classes

    9. Extension methods


    ## VARIATION 4.0


    1. Embedded Interop classes

    2. Dynamic binding

    3. Generic co and contravariance

    4. Named and optional arguments


    ## VARIATION 5.0


    1. Caller info attributes

    2. Asynchronous methods


    ## VARIATION 6.0


    1. Dictionary initializer

    2. Compiler as a service

    3. Name of operator

    4. Import of static class members into namespace

    5. String interpolation

    6. Exception filters

    7. Null propagator

    8. Await in catch/ finally blocks

    9. Expression-bodied members

    10. Auto property initializers

    11. Default values for getter only properties


