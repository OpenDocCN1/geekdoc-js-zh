    # 引言


    恭喜您下载了《*C#*》一书，感谢您这样做。


    接下来的章节将讨论您需要了解的关于 C# 的所有内容。当您读完本书时，您应该能够使用 C# 编写程序，并以该语言应有的水平与计算机进行交互。


    C# 将与其他 C 语言类似，但您会意识到存在一些差异，使其成为一种独特的语言。


    市面上有很多关于这个主题的书籍，再次感谢您选择这一本！我们已尽一切努力确保本书包含尽可能多的有用信息，请尽情享受阅读！


    # 第一章：C# 概述


    当您开始使用 C# 时，您会注意到它是一种面向对象的语言，由微软公司创建，并随后获得了 ECMA（欧洲计算机制造商协会）和 ISO（国际标准化组织）的批准。


    安德斯·海尔斯伯格开发了这种语言，同时他的团队也在开发与之配套的 .Net 框架。它被设计用于 CLI（公共语言基础结构），这将向您展示可执行的代码以及运行时环境，使您能够在各种平台和架构上使用高级别功能。


    使 C# 成为一种广泛使用的语言的一些原因如下：


    1.  您可以将其作为 .Net 框架的一部分使用

    2.  它是一种通用编程语言

    3.  您可以在多种平台上使用它

    4.  它是一种面向对象的程序

    5.  它将生成高效的程序

    6.  它面向组件

    7.  该语言结构清晰且易于学习


    虽然 C# 可能看起来只是 C 编程语言的另一种变体，但它实际上更像 Java 而非 C，因为它是一种被全球程序员使用的程序。


    程序员认为重要的一些特性包括：


    1.  可与 Windows 集成

    2.  布尔条件

    3.  LINQ 和 Lambda 表达式

    4.  自动垃圾回收

    5.  简化的多线程

    6.  标准库

    7.  条件编译

    8.  程序集变体

    9.  索引器

    10. 属性和事件

    11. 易于使用的泛型

    12. 委托和事件管理


    # 第二章：C# 的历史


    在 .Net 框架开发过程中，类库是使用一种称为“简单托管 C”（Simple Managed C）的系统中的托管代码编译器编写的。直到 1999 年 1
    月，海尔斯伯格才组建了一个团队，开发了一种新语言，简称为 Cool，但实际上它是“类似 C 的面向对象语言”（C like Object Oriented
    Language）。当时微软曾考虑将 Cool 作为该项目的最终名称，但由于版权原因未能实现。


    2000 年，在专业开发者大会上，.Net 项目被公之于众，该语言被赋予了新名称 C#，类库被命名为 ASP.Net，而运行时则被移植到了该语言中。


    C# 语言的首席设计师同时也是微软的首席架构师，他曾参与创建 Turbo Pascal、Embarcadero Delphi（曾用名 CodeGear Delphi、Inprise
    Delphi 和 Borland Delphi）的设计，并参与了 Visual J++ 的工作。在采访和撰写的论文中，海尔斯伯格表示，大多数编程语言中存在的缺陷正是推动公共语言运行时基础设计的动力，进而推动了该语言本身的设计。

