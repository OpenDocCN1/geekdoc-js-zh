    ## 3. Do while loop: the condition is going to be tested at the end of the body
    for the loop.


    ## 4. Nested loop: just like other nested statements, this is going to be one
    loop inside of another.


    ## LOOP CONTROL STATEMENTS


    Control statements are going to change the way that a loop is performed from how
    it normally would be. Whenever the execution leaves the scope, any automatic object
    is going to be destroyed.


    1. `Break` statement: the loop or `switch` statement will be terminated while
    the statement that follows the loop or `switch` is carried out.


    2. `Continue` statement: the loop will skip all of its body and test the condition
    before it reiterates.


    ## INFINITE LOOP


    Loops are going to fall into this category when their condition is never found
    to be false. `for` loops are usually the ones that are going to fall into this
    category. Due to the fact that none of the three expressions are going to be required,
    you can cause an endless loop to occur by leaving the condition expression empty.


    **Example**


    ```csharp

    using System;


    namespace Loops


    {


    class Program


    {


    static void Main(string[] args)


    {


    for (; ; )


    {


    Console. WriteLine("Hey! I am Trapped");


    }


    }


    }


    }

    ```


    Whenever the conditional expression is not there, it is going to be assumed to
    be true. You may find that you have to initialize the increment expression. However,
    many programmers use `for ( ; ; )` to construct an infinite loop.


    # CHAPTER THIRTEEN


    ![](images/00001.jpeg)


    # ENCAPSULATION IN C#


    You will define encapsulation as the process of enclosing a single item or more
    inside of a logical or physical package. Encapsulation is done inside of programming
    languages that are object-oriented, and methodology ends up preventing the access
    to implementation details.


    Abstraction and encapsulation are going to be features that you can only find
    in object oriented programming. Abstraction, however, turns relevant information
    in the code into a visible piece of the code while encapsulation allows the programmer
    to implement the level of abstraction that they want in their code.


    There are access specifiers that are going to cause encapsulation to be implemented.
    Access specifiers are going to define the scope and how visible a class member
    is. These are the specifiers that C# supports.


    1. `Protected internal`


    2. `Open`


    3. `Internal`


    4. `Private`


    5. `Protected`


    ## OPEN


    These specifiers are going to enable the class to show the member variables and
    functions so that other objects and functions can see them. When a member is `Open`,
    it can be accessed from the outside.


    **Example**


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle


    {


    //member variables


    Open double length;


    Open double width;


    Open double GetArea()


    {


    return length * width;


    }


    Open void Display()


    {


    Console. WriteLine("Length: {0}", length);


    Console. WriteLine("Width: {0}", width);


    Console. WriteLine("Area: {0}", GetArea());


    }


    }//end class Rectangle


    class PerformRectangle


    {


    static void Main(string[] args)


    {


    Rectangle r = new Rectangle();


    r.length = 4.5;


    r.width = 3.5;


    r.Display();


    Console.ReadLine();


    }


    }


    }

    ```


    In this example, you can see that the member variable `length` and `width` are
    going to be `Open` so that they can be accessed from your function through the
    use of the class name. Your member functions are only going to have the ability
    to access the variables directly without using any of the class instances. They
    are also going to be declared as `Open` by using the `main()` function.


    ## PRIVATE


    `Private` specifiers are going to enable a class to hide the member variables
    and functions from other things in the code. The only functions that you find
    in the same class are going to have the ability to access the private members.
    There are even going to be instances where classes are not going to be able to
    access private members.


    **Example**


    ```csharp

    using System;


    namespace RectangleApplication


    {


    class Rectangle


    {


    //member variables


    private double length;


    private double width;


    Open void Acceptdetails()


    {


    Console. WriteLine("Enter Length: ");


