    1994 年，詹姆斯·高斯林创造了 Java 语言，而太阳微系统公司的联合创始人比尔·乔伊表示，C#只是对 Java 语言的模仿。他甚至进一步说：“C#就像是去掉了可靠性、生产力和安全性的
    Java。”克雷夫特和朗格回应道：“Java 和 C#几乎是相同的编程语言。无聊的重复，缺乏创新。几乎没有人会声称 Java 或 C#是改变了我们编写程序方式的革命性编程语言。而且，C#从
    Java 借鉴了很多，反之亦然。现在 C#支持装箱和拆箱，我们 Java 中也将有非常类似的功能。”


    后来在 2000 年，海尔斯伯格站出来说：“C#不是 Java 的克隆，它在设计上更接近 C++。”


    自 2005 年版本 2.0 发布以来，C#和 Java 走上了不同的发展轨迹，这使得它们之间的相似性降低。最大的区别之一是泛型被添加到这两种语言中，这使它们彼此不同。C#使用具体化来提供一流的泛型对象，这些对象能够在类加载时生成的代码中被其他类使用。除此之外，C#还具有一些特性，使其成为一种函数式编程语言，可与
    C# 3.0 版本发布的 LINQ 扩展一起使用。


    以下是 C#每个版本发布时添加的功能。


    ## 版本 2.0


    1. 委托推断

    2. 泛型

    3. 静态类

    4. 分部类

    5. 委托的协变和逆变

    6. 匿名方法

    7. 方法组转换

    8. 迭代器

    9. Getter/Setter 单独可访问性

    10. 可空类型


    ## 版本 3.0


    1. 分部方法

    2. 隐式类型局部变量

    3. 表达式树

    4. 对象和集合初始化器

    5. Lambda 表达式

    6. 自动实现的属性

    7. 查询表达式

    8. 匿名类

    9. 扩展方法


    ## 版本 4.0


    1. 嵌入式互操作类

    2. 动态绑定

    3. 泛型协变和逆变

    4. 命名参数和可选参数


    ## 版本 5.0


    1. 调用方信息特性

    2. 异步方法


    ## 版本 6.0


    1. 字典初始化器

    2. 编译器即服务

    3. nameof 运算符

    4. 将静态类成员导入命名空间

    5. 字符串插值

    6. 异常筛选器

    7. null 传播器

    8. 在 catch/finally 块中使用 await

    9. 表达式体成员

    10. 自动属性初始化器

    11. 仅 getter 属性的默认值


    ## 版本 7.0


    1. 表达式体 getter 和 setter

    2. out 变量

    3. 表达式体构造函数和终结器

    4. 模式匹配

    5. 通用异步返回类型

    6. 元组

    7. 引用返回和局部变量

    8. 解构

    9. 二进制文本

    10. 局部函数

    11. 数字分隔符


    ## 版本 7.1


    1. 默认表达式

    2. 异步 Main 方法


    # 第三章


    ![](img/00001.jpeg)


    ## C# 环境


    .NET 是一个运行在自身平台上的框架，它将帮助你编写 Windows 应用程序、Web 服务和 Web 应用程序。由于该框架设计为几乎可以与任何编程语言一起使用，因此其应用程序将能够在多个平台上运行。每种语言都可以选择访问该框架，以便它们能够相互通信。


    .NET 框架附带一个包含大量代码的库，你可以将其与 C# 一起使用。.NET 框架的一些组件包括：


    1. LINQ

    2. CLR（公共语言运行时）

    3. WCF（Windows Communication Foundation）

    4. .NET 框架类库

    5. Windows Presentation Foundation

    6. 公共语言规范

    7. WF（Windows Workflow Foundation）

    8. 公共类型系统

    9. ADO.NET

    10. 元数据和程序集

    11. ASP.NET 和 ASP.NET AJAX

    12. Windows 窗体


    每个组件将执行不同的任务，你可以通过使用该组件或查看 Microsoft 提供的文档来了解它们。


    ### 集成开发环境


    除了 C# 之外，你还可以使用更多的开发工具，这些工具包括：


    1. Visual Web 创建器

    2. VS（Visual Studio 2010）

    3. VCE（Visual C# 2010 Express）


    Web 创建器和 VCE 可以在 Microsoft 官方网站上找到。使用这些工具时，你将能够编写几乎任何类型的 C# 程序。你还可以选择使用基本文本编辑器（如记事本）编写源代码文件，然后通过命令提示符（它是
    .NET 框架的一部分）将代码编译成程序集。


    VCE 和 Web 创建器是比 Visual Studio 更小的版本，并且具有与 Visual Studio 相同的外观。


    在安装 Visual Studio 的 Express 版本时，你需要有稳定的网络连接。


    ### 在 Linux 和 Mac 上编写程序


    由于 .NET 框架是 Windows 系统软件功能，因此在使用其他系统软件时，你还可以使用其他版本。Mono 是 .NET 框架的一个变体，它可与 C#
    编译器一起使用，并能在多种不同的系统软件上运行，例如 Linux 和 Mac OS。


    Mono 的整个目的是能够运行为 Microsoft .NET 构建的应用程序，以便它们能够与为其他系统软件（如 Android、iOS、Linux 和 Unix）开发的工具一起工作。


    # 第四章


    ![](img/00001.jpeg)


    ## C# 的程序结构


    在你能够学习构建 C# 程序需要什么之前，你必须先了解该编程语言是如何构建的。


    程序中有某些部分对于确保你在创建 C# 程序时添加它们是至关重要的。


    1. 注释

    2. 命名空间声明

    3. 语句和表达式

    4. 类

    5. Main 方法

    6. 类方法

    7. 类属性


    **示例**


    ```

    using System;


    namespace HelloOuterSpaceApplication


    {


    class HelloOuterSpace


    {


    static void Main(string[] args)


    {


    /* 你的第一个 C# 程序 */


    Console.WriteLine("Hello outer space");


    Console.ReadKey();


    }


    }


    }

    ```


    一旦代码被执行，你将得到结果“Hello outer space”。


    程序中的第一行是代码的 `using System` 部分。`using` 关键字用于将系统的命名空间包含到程序中。大多数 C# 程序使用多个 `using`
    语句。


    你的命名空间声明是你所使用的类的集合。你的应用程序的名称将是该应用程序的类。


    你的类声明将包含程序最终要使用的所有数据和定义。类将包含多个方法，这些方法最终将定义类的行为。但是，示例中使用的类只有一个名为 `Main` 的方法。


    你的 `Main` 方法是所有 C# 程序的入口点。该方法将指明类何时被执行。


    星号和斜杠之间的内容将被编译器忽略，因为它们是程序中的注释。


    你的 `Main` 方法将告诉你语句将遵循什么行为。


    `WriteLine` 是 `Console` 类在命名空间中拼写时使用的方法。这个语句将导致你的结果显示在你面前的屏幕上。


