    # CLASSES YOU FIND IN C#


    When a class is defined, you are going to be defining a blueprint for that data
    class. You are not going to actually define any data, but it is going to define
    what the name of the class means. This means that it is going to contain the object
    in the class as well as what the operations are going to do. The methods and variables
    in your class are going to be known as the members of the class.


    ## DEFINING A CLASS


    Class definitions are going to start with the keyword of class and will be followed
    by the name of the class. Your class body is going to be enclosed by a pair of
    curly braces.


    **Example**


    <access specifier> class class_name


    {


    // member variables


    <access specifier> <data class> variable1;


    <access specifier> <data class> variable2;


    ...


    <access specifier> <data class> variableN;


    // member methods


    <access specifier> <return class> method1(parameter_list)


    {


    // method body


    }


    <access specifier> <return class> method2(parameter_list)


    {


    // method body


    }


    ...


    <access specifier> <return class> methodN(parameter_list)


    {


    // method body


    }


    }


    Keep in mind:


    1\. In order to access your specifiers by a particular access rule, you are going
    to have access to the members and the class. If you do not mention anything, then
    the default is going to be used which is the internal class. Default for the member
    is going to be private.


    2\. A data class needs to be specified by the class of variable that you are using
    as well as the return class so that the data class method is returned as you want
    it if you are using one.


