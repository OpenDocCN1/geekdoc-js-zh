  raw: 'You are not going to actually store any data in a variable with the reference
    class. Basically, you are just going to be referring to a location on the programs
    memory. When you use multiple variables, your reference class is going to refer
    to the location for those classes. Should the data that is in that location be
    modified by a variable, then another variable is going to automatically reflect
    the change.


    ## OBJECT CLASS


    This class is going to be the base class for every data class that you find in
    C#. The CTS (Common Class System) is going to use an alias when using the system.
    Object class. This object class is going to have the option of being assigned
    to values for other classes that are going to be discussed in this chapter as
    long as the class is predefined by the program or defined by the user. Before
    you have the option of assigning values, it is going to need to be converted.


    Whenever an object class is converted it is going to be known as boxing and when
    it is converted to a value class it will be called unboxing.


    ## DYNAMIC


    Any value for any class can be stored in the dynamic class. You will need to check
    these classes of variables as they take place at run time. A dynamic class is
    going to be similar to the object class however the class check is going to take
    place at compile time for the object class.


    Syntax


    Dynamic < variable_ name> = value;


    ## STRING CLASS


    This class will allow you to assign any value for a string to any variable. The
    string class is going to contain an alias in the system string class. This class
    is also derived from the object class. You will notice the value for the string
    class is going to be assigned through the use of a string literal which comes
    in two forms. Quoted and @quoted.


    The user defined reference classes are known as interface, delegate and class.


    ## POINTER CLASS


    The pointer variables are going to be storing the memory addresses for other classes.
    These pointers are going to have the same capabilities as the pointers in other
    C languages.


    **Syntax**


    Class * identifier;


    # CHAPTER SEVEN


    ![](images/00001.jpeg)


    # CLASS CONVERSION IN C#


    C# class conversion is going to be the act of converting a data class to another
    data class. You may also know these conversions as class casting. You will discover
    that there are two different classes of casting.


    1\. Implicit conversion: the class converted under this is going to be performed
    by C# in the same manner for the class that is being converted. Take for example
    when convariations are going from smallest to largest which will make your convariations
    derived class to base class.


    2\. Explicit conversion: explicit conversions are going to be done by users when
    they are working with predefined functions. These conversion will require cast
    operators.


    **Syntax**


    using System;


    namespace TypeClassConversionApplication


    {


    class ExplicitConversion


    {


    static void Main (string [] args)


    {


    double d = 5673.74;


    int i;


    // cast double to int.


    i = (int)d;


    Console.WriteLine(i);


    Console.ReadKey();


    }


    }


    }


    ## CONVERSION METHODS


    1\. Toboolean: a Boolean class will be converted


    2\. To byte: bytes will be converted


    3\. Tochar: characters in a single Unicode character will be converted.


    4\. Todatetime: your date and time structure will be converted


    5\. Todecimal: a floating point or integer is going to be converted into a decimal
    class.


    6\. Todouble: the class is going to be converted to a double class


    7\. Toint16: a class will be converted to a 16-bit integer


    8\. Toint32: a class will be converted to a 32-bit integer


    9\. Toin64: a class will be converted into a 64-bit integer


    10\. Tosbyte: your class will be converted into a signed byte class


    11\. Tosingle: a class will be converted to a floating-point number, but it will
    be small.


    12\. To string: your class will be converted to a string


    13\. To class: your class will be converted to a class that you specify.


    14\. Touint16: you will have an unsigned int class


    15\. Touint32: you will have an unsigned long class


    16\. Touint64: you will get an unsigned big integer.


    **Example:**


    using System;


    namespace ClassConversionApplication


    {


    class StringConversion


    {


    static void Main (string [] args)


    {


    int i = 75;


    float f = 53.005f;


    double d = 2345.7652;


    bool b = true;


    Console.WriteLine(i.ToString());


    Console.WriteLine(f.ToString());


    Console.WriteLine(d.ToString());


    Console.WriteLine(b.ToString());


    Console.ReadKey();


    }


    }


    }


    # CHAPTER EIGHT


    ![](images/00001.jpeg)


    # THE VARIABLES FOUND IN C#


    Variables are essentially nothing except a name that is going to be placed in
    a storage area in which it is going to be manipulated. Each variable is going
    to contain specific class where the size is going to be determined as well as
    the layout for the memory of the variable. Each memory is going to have a range
    of values that are going to be stored inside along with a set of operations that
    you can apply to every variable.


    Some of the basic value classes provided by C# are:


    1\. Integral class: char, ulong, long, uint, int, ushort, short, byte, sbyte


    2\. Floating point: double and float


    3\. Decimal class: decimal


    4\. Boolean: true, false, assigned


    5\. Nullable class: nullable


    C# makes it to where you are able to define value class with variables such as
    class and enum.


    ## DEFINING VARIABLES


    **Syntax**


    <data_class> <variable_lists>;


    The data class has to be part of the C# data class and has to be valid. Your variable
    list has to consist of at least one identifier which will be separated by a comma.


    **Variable definitions:**


    int i, j, k;


    char c, ch;


    float f, salary;


    double d;


    **Initializing Variables**


    when initializing variables, there is going to be an equals sign which will be
    followed by a constant expression.


    **Syntax**


    Variable_name = value;


    You can initialize variables inside their declarations. This initializer is going
    to have an equals sign followed by a constant expression


    **Syntax**


    <data_class> <variable_name> = value;


    **Example**


    int d = 3, f = 5; /* initializing d and f. */


    byte z = 22; /* initializes z. */


    double pi = 3.14159; /* declares an approximation of pi. */


    char x = ''x''; /* the variable x has the value ''x''. */


    You need to work on initializing variables the correct way or otherwise the program
    is going to give you results that you are not expecting.


    **Example**


    using System;


    namespace VariableDefinition


    {


    class Program


    {


    static void Main(string[] args)


    {


    short a;


    int b ;


    double c;


    /* actual initialization */


    a = 10;


    b = 20;


    c = a + b;


    Console. WriteLine("a = {0}, b = {1}, c = {2}", a, b, c);


    Console.ReadLine();


    }


    }


    }


    **Accepting values from the user**


    Your console class is going to be found in the system namespace which will then
    give you a function known as readline() which you are going to use for accepting
    the input that you get from your users and storing it as variables.


    **Example**


    int num;


    num = Convert.ToInt32(Console.ReadLine());


    your convert toint32 () function is going to take the data and convert it so that
    it can be read by the program.


    ## LVALUE AND RVALUE EXPRESSION


    There are two different expressions that you will find in C#


    1\. Rvalue: this expression is going to appear at the right but not the left side
    of your work.


    2\. Lvalue: this is going to appear to the left or right hand while working.


    The variables for the lvalues are going to make it to where they show up on the
    left side. The numeric literals are going to be the r values which explains why
    they are unable to assign therefore cannot appear on the left side of their brain.


