    ## PASSING PARAMETERS TO METHODS


    Whenever a parameter is called, you have to pass the parameter into the method.
    There are at least three ways that you are going to be able to pass the method.


    1\. Value parameter: the value parameter is going to copy the value of the argument
    into the formal parameter of the function. When this is done, any changes that
    are made to the parameter are not going to affect the argument.


    2\. Reference parameter: your reference is going to be copied over to the memory
    location for your argument into the formal parameter. This ultimately means that
    the changes you make to the parameters are going to affect your argument.


