    \ {0}\", WeekdayStart);\n            Console.WriteLine(\"Friday: {0}\", WeekdayEnd);\n\
    \n            Console.ReadKey();\n        }\n    }\n}\n```\n\n# 第二十章\n\n![](img/00001.jpeg)\n\
    \n# C# 中的类\n\n当定义一个类时，你实际上是在为该数据类型定义一个蓝图。你并没有真正定义任何数据，而是定义了该类名称的含义。这意味着它将包含该类中的对象以及操作将执行的内容。类中的方法和变量被称为类的成员。\n\
    \n## 定义类\n\n类定义以关键字 `class` 开头，后跟类名。类体由一对花括号括起来。\n\n**示例**\n\n```csharp\n<access\
    \ specifier> class class_name\n{\n    // 成员变量\n    <access specifier> <data class>\
    \ variable1;\n    <access specifier> <data class> variable2;\n    ...\n    <access\
    \ specifier> <data class> variableN;\n\n    // 成员方法\n    <access specifier> <return\
    \ class> method1(parameter_list)\n    {\n        // 方法体\n    }\n    <access specifier>\
    \ <return class> method2(parameter_list)\n    {\n        // 方法体\n    }\n    ...\n\
    \    <access specifier> <return class> methodN(parameter_list)\n    {\n      \
    \  // 方法体\n    }\n}\n```\n\n请记住：\n\n1. 要按特定访问规则访问说明符，你需要访问成员和类。如果未指定任何内容，则使用默认值，即内部类。成员的默认访问级别是私有。\n\
    2. 需要指定数据类型，即你正在使用的变量类型以及返回类型，以便在需要时按预期返回数据类型方法。\n3. 要访问类成员，需要使用点运算符。\n4. 点运算符链接将告诉你对象名称和成员名称。\n\
    \n**示例**\n\n```csharp\nusing System;\n\nnamespace BoxApplication\n{\n    class\
    \ Box\n    {\n        Open double length;   // 盒子的长度\n        Open double breadth;\
    \  // 盒子的宽度\n        Open double height;   // 盒子的高度\n    }\n\n    class Boxtester\n\
    \    {\n        static void Main(string[] args)\n        {\n            Box Box1\
    \ = new Box();   // 声明 Box1 为 Box 类型\n            Box Box2 = new Box();   // 声明\
    \ Box2 为 Box 类型\n            double volume = 0.0;    // 在此存储盒子的体积\n\n        \
    \    // box 1 规格\n            Box1.height = 5.0;\n            Box1.length = 6.0;\n\
    \            Box1.breadth = 7.0;\n\n            // box 2 规格\n            Box2.height\
    \ = 10.0;\n            Box2.length = 12.0;\n            Box2.breadth = 13.0;\n\
    \n            // box 1 的体积\n            volume = Box1.height * Box1.length * Box1.breadth;\n\
    \            Console.WriteLine(\"Volume of Box1 : {0}\", volume);\n\n        \
    \    // box 2 的体积\n            volume = Box2.height * Box2.length * Box2.breadth;\n\
    \            Console.WriteLine(\"Volume of Box2 : {0}\", volume);\n\n        \
    \    Console.ReadKey();\n        }\n    }\n}\n```\n\n## 成员函数与封装\n\n成员函数是类的一部分，在类定义内部拥有自己的定义和原型，类似于其他变量。这些函数操作类的对象，成员可以访问该对象所属类的所有成员。\n\
    \n成员变量被称为属性，通常保持私有以实现封装。正是这些变量可以通过 `Open` 函数进行访问。\n\n**示例**\n\n```csharp\nusing\
    \ System;\n\nnamespace BoxApplication\n{\n    class Box\n    {\n        private\
    \ double length;   // 盒子的长度\n        private double breadth;  // 盒子的宽度\n     \
    \   private double height;   // 盒子的高度\n\n        Open void setLength(double len)\n\
    \        {\n            length = len;\n        }\n\n        Open void setBreadth(double\
    \ bre)\n        {\n            breadth = bre;\n        }\n\n        Open void\
    \ setHeight(double hei)\n        {\n            height = hei;\n        }\n\n \
    \       Open double getVolume()\n        {\n            return length * breadth\
    \ * height;\n        }\n    }\n\n    class Boxtester\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Box Box1 = new Box();   // 声明 Box1\
    \ 为 Box 类型\n            Box Box2 = new Box();\n            double volume;\n\n\
    \            // 声明 Box2 为 Box 类型\n\n            // box 1 规格\n            Box1.setLength(6.0);\n\
    \            Box1.setBreadth(7.0);\n            Box1.setHeight(5.0);\n\n     \
    \       // box 2 规格\n            Box2.setLength(12.0);\n            Box2.setBreadth(13.0);\n\
    \            Box2.setHeight(10.0);\n\n            // box 1 的体积\n            volume\
    \ = Box1.getVolume();\n            Console.WriteLine(\"Volume of Box1 : {0}\"\
    , volume);\n\n            // box 2 的体积\n            volume = Box2.getVolume();\n\
    \            Console.WriteLine(\"Volume of Box2 : {0}\", volume);\n\n        \
    \    Console.ReadKey();\n        }\n    }\n}\n```\n\n## 构造函数\n\n类的构造函数是该类的特殊函数，当你在该类中创建新对象时，它们会按需执行。\n\
    \n构造函数与类名相同，但没有返回类型。\n\n**示例**\n\n```csharp\nusing System;\n\nnamespace LineApplication\n\
    {\n    class Line\n    {\n        private double length;   // 线的长度\n\n       \
    \ Open Line()\n        {\n            Console.WriteLine(\"Object is being created\"\
    );\n        }\n\n        Open void setLength(double len)\n        {\n        \
    \    length = len;\n        }\n\n        Open double getLength()\n        {\n\
    \            return length;\n        }\n\n        static void Main(string[] args)\n\
    \        {\n            Line line = new Line();\n\n            // 设置线的长度\n   \
    \         line.setLength(6.0);\n            Console.WriteLine(\"Length of line\
    \ : {0}\", line.getLength());\n\n            Console.ReadKey();\n        }\n \
    \   }\n}\n```\n\n"
