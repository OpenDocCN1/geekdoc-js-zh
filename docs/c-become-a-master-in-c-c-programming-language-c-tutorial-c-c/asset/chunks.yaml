    # STRINGS IN C#


    With C# you can use strings as arrays. But, one of the more common things to do
    is to use a string keyword in order to declare the string variable. String keywords
    are an alias for the system. String.


    ## CREATING STRING OBJECTS


    String objects can be created by:


    1\. Call a formatting method in order to convert a value or object to the string
    representation


    2\. Assigning a string literal to the string variable retrieving property or calling
    a method that is going to return a string


    3\. String class constructor


    4\. Using a string concatenation operator.


    **Example**


    using System;


    namespace StringApplication


    {


    class Program


    {


    static void Main(string[] args)


    {


    //from string literal and string concatenation


    string fname, lname;


    fname = "Rowan";


    lname = "Atkinson";


    string fullname = fname + lname;


    Console. WriteLine("Full Name: {0}", fullname);


    //by using string constructor


    char[] letters = { ''H'', ''e'', ''l'', ''l'',''o'' };


    string greetings = new string(letters);


    Console. WriteLine("Greetings: {0}", greetings);


    //methods returning string


    string[] sarray = { "Hello", "From", "Tutorials", "Point" };


    string message = String.Join(" ", sarray);


    Console. WriteLine("Message: {0}", message);


    //formatting method to convert a value


    DateTime waiting = new DateTime(2012, 10, 10, 17, 58, 1);


    string chat = String.Format("Message sent at {0:t} on {0:D}", waiting);


    Console. WriteLine("Message: {0}", chat);


    }


    }


    }


    ## PROPERTIES OF THE STRING CLASS


    1\. Chars: the char object will be obtained at a particular position in the string
    object


    2\. Length: the number of characters in your string object


