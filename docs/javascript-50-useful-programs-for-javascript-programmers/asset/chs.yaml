  <head>\n<title>密码强度</title>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=UTF-8\"/>\n</head>\n<body <br><center>\n<form name=\"myForm\">\n<label\
  \ for=\"pwd1\">密码</label>\n<input type=\"Password\" name=\"pwd1\" onBlur=\"valuate(this)\"\
  \ />\n<br><br>\n<label for=\"pwd2\">重复密码</label>\n<input type=\"password\" name=\"\
  pwd2\" />\n</form></center>\n<center><div id=\"showStrength\"></div></center>\n\
  <script type=\"text/javascript\">\nfunction valuate(pwd) {\nvar t=pwd.value;\nvar\
  \ id=getStrength(t);\nvar message=Array(4);\nmessage[0]=\"密码太短了！\";\nmessage[1]=\"\
  密码强度弱！\";\nmessage[2]=\"密码强度中等！\";\nmessage[3]=\"密码强度强！\";\nvar myColor=Array(4);\n\
  myColor[0]=\"black\";\nmyColor[1]=\"red\";\nmyColor[2]=\"orange\";\nmyColor[3]=\"\
  green\";\nvar setWidth=300;\nvar setHeight=15;\nvar PWD=document.getElementById(\"\
  showStrength\");\nPWD.style.fontSize=\"15px\";\nPWD.style.color=myColor[id];\nPWD.style.width=setWidth+\"\
  px\";\nPWD.style.height=setHeight+\"px\";\nPWD.style.lineHeight=setHeight+\"px\"\
  ;\nPWD.style.textIndent=\"0px\";\nPWD.innerHTML=\"强度: \" + message[id];\nfunction\
  \ getStrength(p){\nif(p.length < 4){\nreturn 0;\n}\nvar level = 0;\nif (p.match(/[a-z]/ig)){\n\
  level++;\n}\nif (p.match(/[0-9]/ig)){\nlevel++;\n}\nif (p.match(/[^a-z0-9]/ig)){\n\
  level++;\n}\nif (p.length < 6 && level > 0){\nlevel--;\n}\nreturn level\n}\n</script>\n\
  </body>\n</html\n```\n\n# 11. 打开硬盘\n\n![](img/00011.jpeg)\n\n## 源代码：\n\n```html\n\
