    # JavaScript and HTML Quiz


    ## Operator Precedence


    Which of the following is the correct operator precedence?


    1. `!` > `&&` > `||`

    2. `||` > `&&` > `!`

    3. `&&` > `!` > `||`

    4. `&&` > `||` > `!`


    ### Question 58


    The difference between “break” and “continue” is__ and __?


    1. Stop running program. Keep running program

    2. Keep running program. Stop running program

    3. Exit from looping. Enter next looping.

    4. Enter next looping. Exit from looping.


    ### Question 59


    In JavaScript, use__ keyword to declare a function.


    1. `fun`

    2. `method`

    3. `var`

    4. `function`


    ### Question 60


    In a HTML document, which JS command should appear first, function definition
    or function call?


    1. Function call appears before function definition.

    2. Function definition appears before function call.

    3. Function call appears inside function definition.

    4. Their sequence doesn’t matter.


    ### Question 61


    In JavaScript function, using  __ keyword can retrieve a result value to caller.


    1. regain

    2. `return`

    3. retrieve

    4. result


