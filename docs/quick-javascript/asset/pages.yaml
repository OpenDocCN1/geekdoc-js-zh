    # 3.9 BAD OPERATORS


    In his excellent book JavaScript: The Good Parts, Douglas Crockford made the case
    that there are features of JavaScript that should not be used. We mention a number
    of these, with brief explanations, in Table 3.3.


    When used as a prefix, ++ adds one to its operand before using the value of the
    operand in an expression. When used as a suffix, ++ uses the original value of
    the operand in the enclosing expression, and adds one to the operand afterward.
    Similar remarks hold for the -- operator. These operators should only be used
    as complete statements, as the increment part of a loop; other expressions are
    too confusing. For example, the statement x = x++ does nothing. As complete statements,
    x++ is at least as clear as x++ and doesn''t require many keystrokes.


    The bitwise operators (&, |, ^, ~, >>, <<) convert their operands to 32-bit integers—a
    data type that JavaScript supposedly does not have—perform the operation, and
    convert back. This works, but is slow.'
