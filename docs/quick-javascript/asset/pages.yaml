  md: '# 18 ■ Quick JavaScript


    Variables declared with let or const at the top level of the program, not within
    any block, are global to the program; they can be accessed anywhere.


    Variables and constants declared within a block have block scope. A block is a
    group of statements and/or expressions enclosed in braces, {...}. The scope of
    an identifier is that of the program in which the variable is visible and can
    be used.


    In other words, variables and constants declared in a block are visible and can
    be used only in the innermost block in which they are declared. Outside that block,
    these variables and constants do not exist; their names can be recycled for other
    uses.


    It is an error to attempt to get the value of a variable that has been declared
    but not yet given a value.


    # 2.5 VAR


    The modern way to declare a variable is with let. The older way, using var in
    place of let, or simply assigning a value to a variable, should be avoided. Variables
    declared the old way follow unusual, and generally undesirable, scope rules.


    +   - It is not an error to use var to declare the same variable more than once
    in the same scope.


    +   - The parameters to a function, and any variables declared with var inside
    that function, are local to the function. They may be used anywhere inside that
    function, even before the declaration. This is different from block scope.


    +   - If a value is assigned to a new variable without declaring the variable
    with let, var or const, that variable has global scope. It can be used anywhere
    in the program.


    +   - This can only be done in non-strict mode (sometimes called “sloppy mode”).'
