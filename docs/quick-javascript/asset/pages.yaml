  md: 'a digit. By convention, the names of variables, properties, functions, and
    methods should begin with a lowercase letter; names of constructors should begin
    with a capital letter. Names may be any length.


    Case is significant in JavaScript but not in HTML. Since JavaScript names are
    frequently used in HTML, this can lead to some strange errors if you are not careful
    about case.


    As in most other languages, you cannot use a reserved word as an identifier.


    # 3.3 DESTRUCTURING


    Destructuring is a way to assign the parts of an object or array into several
    different variables.


    As an example, we use the following object:


    ```

    let p = { givenName: "Sally",

    familyName: "Willis",

    occupation: "doctor" };

    ```


    We may wish to assign the parts of this object into separate variables, as


    ```

    let givenName = p.givenName;

    let familyName = p.familyName;

    let occupation = p.occupation;

    ```


    Destructuring is a shorter way to do exactly the same thing:


    ```

    let {givenName, familyName, occupation} = p;

    ```


    Property names need not to be given in order, and not every name has to be mentioned.
