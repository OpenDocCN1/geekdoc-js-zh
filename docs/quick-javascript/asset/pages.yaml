  md: 'Since console.log is intended primarily for debugging, most implementations
    will display the actual structure of the args, without using the toString method.


    The Console has a number of other methods, such as clear() and trace(). Implementation
    varies.


    +   document.write(args)


    +   This will write its arguments to the body of the HTML. If executed as the
    page is being loaded, it writes the arguments directly in that location. But if
    write is called after the body has been loaded (for example, from a function),
    the call replaces the entire HTML body; this is probably not what you want.


    +   document.writeln(args)


    +   This acts just like write, except that the method writes a newline after the
    last argument. Since HTML ignores newlines, this is fairly useless. To get a newline
    that isn’t ignored, write the string "<br>".


    The advantage of the alert and write methods is that they do not require you to
    have a console open in order to view results.'
