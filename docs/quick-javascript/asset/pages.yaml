  md: '# Afterword


    JavaScript was pressed into service by Netscape in 1995, during the "browser wars."
    It was initially named LiveScript, but the name was changed after only three months,
    probably because Java was quickly gaining in popularity. There is no real relationship
    between the two languages; the resemblance is because both languages borrowed
    heavily from C.


    Microsoft responded in 1996 with a knock-off version called JScript.


    Netscape submitted JavaScript to ECMA International, a standards organization,
    for standardization. Microsoft participated for a few years, then dropped its
    support. Subsequently, Firefox and Chrome gained a large enough market share to
    get Microsoft to rejoin the party. To make a long story short, standardization
    finally succeeded in 2009 with ECMAScript 5, and later with ECMAScript 6 in 2015.
