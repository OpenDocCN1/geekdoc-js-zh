  md: '# JavaScript


    # In More Detail


    JavaScript is a large, complex, and constantly evolving language. The preceding
    sections have been a whirlwind tour of its main features. What is missing, however,
    is anything about making interactive web pages—and that, after all, is the main
    reason to use JavaScript.


    If you are eager to jump to client-side JavaScript programming, you should now
    know enough to jump ahead to Chapter 4. If you prefer to deepen your knowledge
    of JavaScript, continue reading.


    # 3.1 STRICT MODE


    No language is perfect. JavaScript allows some things that, in retrospect, should
    not have been allowed. JavaScript now has a strict mode to disallow those features
    and to modify others. To turn strict mode on globally, put the string


    ```

    "use strict";

    ```


    as the first thing in a script; to turn strict mode on for just one function,
    put that string as the first line inside the function.'
