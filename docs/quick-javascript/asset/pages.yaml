  md: '# 2.2 DATA TYPES


    2.2.1 Primitives


    There are eight data types:


    +   * A number may be written with or without a decimal point, but all numbers
    are stored as double precision floating point.

    * A bigint is an integer with an arbitrarily large number of digits.

    * The two boolean values are written as true and false.

    * A string may be enclosed in either single quotes, double quotes, or backticks
    (''). There is no “character” type.

    * A symbol is a value that is guaranteed to be unique; no other value is equal
    to it. A symbol is created by calling Symbol() or Symbol(name), where name is
    a (not necessarily unique) value that may be helpful in debugging.

    * The undefined type has a single value, undefined. It is the value of a variable
    that has been declared but not yet given a value.

    * The null type has a single value, null, meaning the value does not exist.

    * An object is any more complicated data type. Functions, arrays, sets, maps,
    regular expressions, errors, and dates are all special types of object, as are
    user-defined objects.


    The type of a value can be determined by typeof, which can be used as either an
    operator, typeof x, or as a function, typeof(x). It will return, as a string,
    one of the type names given above (for example, "number").


    There are two exceptions to the above.


    +   * The value of typeof(null) is "object". This is generally regarded as an
    error in the design of the language.'
  merge: -1
  pgno: 26
