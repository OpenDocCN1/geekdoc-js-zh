  md: '# 158 ■ Appendix D: Regular Expressions


    # Table A.1


    | Expression | Meaning | Examples | Explanation |

    | --- | --- | --- | --- |

    | a literal character | That same character | M | The capital letter M |

    | XY | An X followed by a Y | cat | The three characters c at, in that order |

    | [XYZ] | Any one of the characters X, Y, or Z. | b[aeiou]g | One of the words
    bag, beg, big, bog, or bug |

    | [X-Y] | Any one character between X and Y, inclusive | [0-9][a-zA-Z] | Any decimal
    digit |

    | [X-Y] | Any one character not between X and Y, inclusive | ^[a-zA-Z] | Any non-letter
    |

    | X* | Zero or more occurrences of X | \s* | Any amount of whitespace |

    | X+ | One or more | \s+ | At least one whitespace character |

    | X? | An optional X | dogs? | Either dog or dogs |

    | X{n,m} | From n to m occurrences of X | his{2,4} | hiss or hisss hissss |

    | X{n,} | n or more occurrences of X | his{2,} | hiss or hisss hissss, and so
    on |

    | X{n} | Exactly n occurrences of X | his{2} | Hiss |

    | X|Y | Either X or Y | The (boy|girl) | The boy or The girl |

    | ^X | X at the beginning of the string | ^[A-Z] | An initial capital letter (the
    ^ itself matches the empty string) |'
