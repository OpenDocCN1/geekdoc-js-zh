    # 3.11.8 Prototypes


    Every object has a prototype, which is another object that “stands behind it,”
    or that it is “based on.” If not otherwise specified, an object’s prototype is
    Object.


    Here is our running example:


    ```

    let myCar = {make: "Subaru", year: 2018};

    ```


    If we call myCar.toString(), we get the string "[object Object]". While this isn''t
    very useful, it does show that myCar has a toString method. Where did it come
    from? It came from Object, which is a prototype for all objects.


    If we use a for/in loop to print myCar we will see its make and year, but will
    not see the toString property of its prototype. The for/in loop only loops through
    the direct properties of an object, not the properties inherited from its prototype.


    We can get the prototype of an object:


    ```

    let proto = Object.getPrototypeOf(myCar);

    ```'
