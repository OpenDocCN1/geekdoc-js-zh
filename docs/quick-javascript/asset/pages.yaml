    # 3.4.9 WeakMaps


    JavaScript uses automatic garbage collection: Space is allocated for objects when
    needed, and reclaimed when those objects become inaccessible. Objects become inaccessible
    when the program no longer has any way to refer to them.


    As a trivial example,


    ```

    let car = {make: "Suburu", year: 2018};

    car = {make: "Toyota", color: "white"};

    ```


    After the second assignment, there is no longer any way to access the object {make:
    "Suburu", year: 2018}, therefore it can be garbage collected.


    A WeakMap is like a Map—it matches keys to values. Here are the differences:


    +   * The constructor is WeakMap().

    * Only objects, not primitives, can be used as keys.

    * Only the methods get(key), set(key, value), has(key), and delete(value) are
    provided.

    * WeakMaps are not iterable, so you cannot use for/of them.


    A key that is in a Map can never be garbage collected; but a key in a WeakMap
    can be garbage collected (and the entry deleted from the WeakMap) if there are
    no other references to it.


    This last is the most important point. Objects that have only a temporary existence
    can be used as keys in a WeakMap, allowing garbage collection to do its job.'
