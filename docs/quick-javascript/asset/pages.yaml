    # 4.3 DOM OVERVIEW


    The HTML DOM (Document Object Model) represents everything on the HTML page as
    a tree of Nodes, even the HTML comments and every bit of whitespace. Everything
    in the DOM is accessible to JavaScript and can be changed, and every change made
    by JavaScript is reflected immediately in the page as shown to the user. This
    is far more power than needed for most applications.


    Figure 4.1 shows the main subclasses of Node, not the structure of the DOM tree.
    The root of the DOM tree is a Node named document, of type Document, and it has
    one child, an Element representing the <html> tag. The document node has properties
    head and tail, which give access to the entire tree of nodes.'
