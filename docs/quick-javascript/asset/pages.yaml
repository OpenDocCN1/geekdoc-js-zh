  md: 'The throw statement "throws" the exception to somewhere else, so as not to
    clutter the normal execution of the program with code to handle (hopefully rare)
    exceptional conditions. The purpose of the try/catch statement (described in Section
    2.9.5.4) is to catch a throw exception.


    The throw statement has the syntax:


    ```

    throw expression;

    ```


    where expression can be any type, but is typically an error number, an error message,
    or (as is the case with predefined exceptions), an object with name and message
    properties.


    What happens to the thrown exception?


    +   - If an exception occurs in the try portion of a try-catch-finally statement,
    the catch part handles the exception.

    - Otherwise, if an exception occurs in a function, the function will return immediately
    to the point at which the function was called. Execution continues as if the exception
    was thrown at that point (which may involve returning up another level in a nest
    of function calls).

    - Otherwise, if an exception occurs in top-level code, or hasn''t been handled
    by the time the exception reaches the top level, it is up to the system to do
    something about it. In an IDE, the exception will be reported to the programmer.
    In a browser, the exception will probably be ignored.


    # 2.9.5.4 Try-catch-finally statement


    The try-catch-finally statement is used to separate error handling from code that
    handles the "normal" case. This statement works exactly like the corresponding
    statement in Java, but with two minor syntactic differences.'
