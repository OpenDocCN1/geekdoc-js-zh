    JSON (JavaScript Object Notation) is a way of representing data as text. This
    is useful for storing the data on a file, or transmitting it to or from a server.
    JSON is human-readable and editable; it is quite similar to data in JavaScript.


    There are two methods:


    +   * JSON.stringify(value)—Converts a JavaScript value to a JSON string.

    * JSON.parse(string)—Converts a JSON string to a JSON object.


    Both JSON methods can be given additional parameters, not described here, to modify
    values as they are processed.


    Limitations:


