  md: '# JavaScript: In More Detail ■ 103


    A class may have any number of subclasses. A subclass builds upon (“extends”)
    its superclass by adding or replacing features.


    Here is a first example:


    ```

    class Person {} // extends Object


    class Customer extends Person {}

    ```


    When you ask JavaScript to create a new Customer, it starts by creating a new
    Object; then it adds to that object all the features of Person; finally, it adds
    all the features of Customer. In this way, an object of a class is built “on top
    of” an object of its superclass.


    Every class must have a constructor, and the constructor should begin by calling
    the constructor for its superclass, with super(args). This isn’t necessarily the
    first thing that must be done, but it must happen before any use of this is attempted.


