    # 3.8 OPERATOR NOTES


    The && operator means “and.” The || operator means “or."


    The logical operators && and || are short-circuit operators. That is, if the result
    is known from the first (left-hand) expression, the second (right-hand) expression
    is not evaluated. Because JavaScript has “truthy” and “falsy” values, the && and
    || operators don’t necessarily return true or false, but may mislead a truthy
    or false value.


    +   - expr1 && expr2—expr1 is falsy, the result is expr1, else the result is expr2.

    - expr1 || expr2—expr1 is truth, the result is expr1, else the result is expr2.


    Given a sequence of values connected with &&, the result is either the first falsy
    value encountered, or the final true value. Similarly, given a sequence of values
    connected with ||, the result is either the first true value encountered, or the
    final falsy value. This fact is sometimes used in a “clever” way; for example,
    the expression x || 5 has the value 5 if x is zero (or some other falsy value),
    otherwise it has the value of x.


    The various assignment operators are operators; that is, they have a value and
    may be embedded in a larger expression, for example, y = 3 + (x += 5).'
