  md: '# Introduction


    1.1 HELLO, WORLD!

    Traditionally, the first program to be written in a new language is one that prints
    out "Hello, World!" We will follow that tradition.


    The one line of JavaScript needed:


    ```

    alert("Hello, World!");

    ```


    To execute this code, we have several options.


    +   * Put it in a web page and run it in a browser.

    * Run it in an IDE (Integrated Development Environment).

    * Run it from an editor application.

    * Run it from an online JavaScript editor.


    1.2 JAVASCRIPT IN THE BROWSER


    If you save the following text in a file and then open the file in a browser,
    an alert dialog containing the text “Hello, World!” will appear.'
