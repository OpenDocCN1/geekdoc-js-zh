  md: '# 10 ■ Quick JavaScript


    The last comma, is sometimes called a *trailing comma*.


    Array indexing is zero-based; the first element of the above array is `ary[]`
    and the last is `ary.length - 1`.


    Arrays of higher dimension can be created simply by nesting array literals.


    ```

    let ary2d = [[11, 12], [21, 22]];

    ```


    After the above assignment, ary2d[1] is `[21, 22]` and ary2d[0] is 21.


    A less-often used form is `Array(values)`:


    ```

    let ary = new Array("cat", "dog", "mouse");

    ```


    This form is not generally recommended. One odd feature of it is if the argument
    is a single numeric value, `Array(n)`, the result is a *sparse array* of *n* locations,
    *not an* array containing the single value *n*.


    In a sparse array, no storage is allocated for the elements of the array until
    they have been assigned values; unassigned locations will appear to have the value
    `undefined`. A sparse array can be arbitrarily large (only the actual values in
    it contribute to its size), but it is slower to work with.


    The `length` property of an array is always one more than the largest index. Since
    an array may be sparse, `length` is not necessarily a count of the number of values
    in the array.


    Arrays can be created from *iterable types* (types that can be stepped through).


    +   *Array.from(set)* — Returns an array containing the elements of *set*.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# JavaScript: The Bare Minimum ■ 11


    +   - Array.from(string) — Returns an array of characters from string, each as
    a string.

    - Array.from(map) — Returns an array of [key, value] arrays.

    - Array.from(array) — Returns a (shallow) copy of array.


    Arrays may contain a mix of different types of values.


    # 2.2.5 Sets


    A set is a collection of values, such that (1) no value appears more than once,
    and (2) the order in which the values occur in the set is irrelevant.


