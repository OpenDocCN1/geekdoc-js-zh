  md: "For any type of object except a function, typeof will return \"object\". Applied\
    \ to a function, typeof will return \"function\".\n\n# 2.2.2 User-Defined Objects\n\
    \nAn object is a collection of named values, called its properties. You can define\
    \ an object by putting property: value pairs inside braces and later refer to\
    \ the values with the syntax object.property. For example,\n\n```\nlet friend\
    \ = { givenName: \"Anna\",\n  sname: \"Lang\" };\nalert(\"Hello, \" + friend.givenName);\n\
    ```\n\nIf the name of a property is stored in a variable or can be computed, it\
    \ can be accessed by the syntax object[expression], for example, friend[\"given\"\
    ] + \"Name\".\n\nThe test property in object, where property is given as a string,\
    \ will return true if and only if object has that property. A request for a property\
    \ that does not exist will get the value undefined.\n\n# 2.2.3 Built-In Object\
    \ Types\n\nJavaScript comes with a number of built-in, or predefined, object types.\
    \ Among these are arrays, sets, maps, dates, and regular expressions.\n\n# 2.2.4\
    \ Arrays\n\nAn array is an ordered collection of values. An array literal can\
    \ be defined by enclosing comma-separated values in square brackets,\n\n```\n\
    let ary = [\"cat\", \"dog\", \"mouse\"];\n```\n\nCommas can be used either between\
    \ or after values, so the above assignment is exactly equivalent to:\n\n```\n\
    let ary = [\"cat\", \"dog\", \"mouse\", ];\n```"
