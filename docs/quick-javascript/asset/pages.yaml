  md: '# 152 Appendix B: Higher-Order Methods


    +   - array.findIndex(f) — Finds and returns the first index of a value in array
    for which f returns a truthy value (or -1 if none is found).


    +   - array.map(f) — Applies f to each element of array, returning an array of
    the results. Holes, if any, are preserved.


    +   - array.flatMap(f) — Applies f to each element of array. If the resulting
    array is multidimensional, one level of nesting is removed, promoting all values
    to the next higher level.


    +   - array.filter(f) — Returns an array containing all and only those values
    of array for which f returns a truthy value.


    +   - array.reduce(f2, initial) — Given a f2 of two parameters, applies f2 to
    initial and the first element of array, then applies f2 to that result and the
    second element, and so on, resulting in a single value.


    +   - If array is empty, initial is returned.


    +   - If array is known to be nonempty, initial may be omitted.


    +   - For example, array(x, y) => x + y returns the sum of all the elements of
    array.


    +   - array.reduceRight(f2) — Like reduce, but works right to left instead of
    left to right.


    +   - array.some(f) — Returns true if array contains at least one element for
    which f returns a truthy value.


    +   - array.every(f) — Returns true if f returns a truthy value for every element
    of the array.'
