  md: 'Turning on strict mode makes the following things illegal:


    +   - Assigning to a variable that has not been declared with var, let, or const.

    - The with statement.

    - Defining a function within a conditional or a loop statement.

    - Using eval to create variables.

    - Using delete to delete a variable, object, function, or an undeletable property
    (such as prototype).

    - Modifying a read-only or get-only property.

    - Using eval, with, or any of the reserved keywords as variable names.

    - Writing a number with a leading 0 to make it octal, example, 077.

    - Octal escape sequences (other than "\u0") to represent the NUL character, which
    is still allowed).

    - Duplicate parameter names in a function, function foo(a, a).

    - Accessing the caller, callee, and arguments properties of functions.


    In strict mode, the keyword this inside a function refers to the object that called
    the function.


    **Caution:** Turning on strict mode within a function makes it illegal for that
    function to have default parameters, a rest parameter, or parameter destructuring.


    # 3.2 IDENTIFIERS


    Identifiers consist of letters (as defined by Unicode), digits, underscores, and/or
    dollar signs; the first character may not be'
