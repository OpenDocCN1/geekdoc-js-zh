    Strings of digits will be converted in the obvious way. Boolean true will be converted
    to 1, null and false to 0, and undefined to NaN.


    **Exception: The binary + operator is both addition and string concatenation,
    has priority; 2 + "2" is "22". The unary operator + will attempt to convert its
    operand to a number, so 2 + +"2" is 4.


    Any value in a boolean context (such as the condition of an if statement) will
    be treated as false if it is Ø, undefined, null, NaN, or the empty string. All
    other values, including "0", are considered to be true.


    When an array is converted to a string, the result is a string of comma-separated
    values; the brackets are omitted. Thus, a multidimensional array can readily be
    mistaken for a one-dimensional array.


