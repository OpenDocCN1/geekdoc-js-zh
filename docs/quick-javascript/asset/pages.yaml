    Reminder: An arrow function has the syntax (parameters) => expression.


    The sort method takes a function of two arguments that returns a negative, zero,
    or positive value if the first argument to that function is less than, equal to,
    or greater than the second argument, respectively.


    ```

    let nums = [12, 43, 115, 9, 65, 1001, 902];


    ums.sort((a, b) => a - b);

    // nums is [9, 12, 43, 65, 115, 902, 1001];


    ums.sort((a, b) => b - a);

    // nums is [1001, 902, 115, 65, 43, 12, 9];


    ums.sort((a, b) => a % 10 - b % 10);

    // nums is [1001, 902, 12, 43, 115, 65, 9];

    ```


    This last example sorts numbers according to their one’s digit number modulo 10.


    Higher-order methods can be used to replace many kinds of loops, resulting in
    shorter and more readable code. For example, the map method will apply a function
    to every element of an array, producing an array of results.


    ```

    a = [1, 2, 3, 4, 5];

    asq = a.map(e => e ** 2);

    // asq = [1, 4, 9, 16, 25];

