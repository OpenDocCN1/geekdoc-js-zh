  md: '# 4.4 GRAPHICAL USER INTERFACES


    A Graphical User Interface, GUI, is a means of allowing the program to interact
    with a user. It typically consists of familiar controls, or widgets, such as buttons,
    text boxes, checkboxes, menu items, and the like.


    GUIs can be used to create stand-alone programs, or they can be used to collect
    information to send back to a server (such as when ordering merchandise). A form
    is a container for widgets whose purpose is to collect information into a single
    bundle.


    # 4.4.1 Events


    GUI programs are different from other programs. Instead of continuous sequence
    of code from beginning to end, GUI programs are event-driven. When an “interesting”
    event occurs, some code is triggered to handle it. The code finishes, then nothing
    happens until another “interesting” event occurs.


    An “interesting” event is simply one that the programmer has written some code
    to handle. Events are happening all the time; practically anything that generates
    one or more events. The mouse moves over an HTML element? That’s an event. The
    mouse moves out of an HTML element? That’s another event. In fact, if the mouse
    moves out at all, that’s an event. There are over 70 kinds of events, all with
    names beginning with “on”, such as onclick.


    The key point is that events are happening all the time; the programmer doesn’t
    have to do anything to create them. If the user clicks a button, that’s an event
    (normally) should be handled. If the user clicks a word in a paragraph, probably
    that event should be ignored. The programmer gets to decide which events to handle.


