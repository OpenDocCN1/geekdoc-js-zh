    # 3.11 OBJECTS


    # 3.11.1 Definition of Objects


    JavaScript is an object-oriented language.


    In JavaScript, you can create objects without having to first define a class.
    This section is about objects; classes will be covered later.


    An object is a collection of named values (called properties or fields). Objects
    use dot notation, as in other object-oriented languages, but they behave more
    like hash tables (also called maps or dictionaries).


    You can write an object literal by enclosing key: value pairs in braces. For example:


    ```

