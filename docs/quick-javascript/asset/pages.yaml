    types. Unless you want the automatic conversion, these operators should be preferred.


    For objects (arrays, sets, etc.), the "equality" operators are actually tests
    of identity. That is, an object is "equal" only to itself, not to any other object.
    The comparison [1] == [1] is false because arrays are created, then compared.


