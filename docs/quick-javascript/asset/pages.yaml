  md: '# JavaScript


    # The Bare Minimum


    This chapter and Chapter 3 describe JavaScript simply as a language, without reference
    to Web programming. It is in two major parts:


    The Bare Minimum—This section is intended to get you started programming in JavaScript
    as quickly as possible. The best way to do that is to try things out as you go.


    In More Detail—This goes over the same material again, filling in a lot of the
    gaps. To some extent, it can also be used as a reference.


    # 2.1 COMMENTS


    ```

    // introduces a comment that extends to the end of the line.

    ```


    Multi-line comments start with /* and end with *.*


    Inside a comment, // and /* have no special meaning (so you cannot “nest” comments).
    Inside a quoted string or regular expression, // and /* do not start a comment.


    DOI: 10.12011/9781003359609-2'
