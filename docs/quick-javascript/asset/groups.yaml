    console.log(sym2.description);\n```\n\n将打印：\n\"secret\",\n\n## 3.4.5 数组 (Arrays)\n\
    \nJavaScript 中的数组没有固定大小；元素可以从数组的末端添加或删除。\n\n- `array.push(elems)`——在数组末尾添加 `elems`\
    \ 后，返回数组的新长度。\n- `array.pop()`——移除并返回数组的最后一个元素，并更新其长度。\n- `array.unshift(elems)`——在数组开头添加\
    \ `elems` 后，返回数组的新长度。\n- `array.shift()`——移除并返回数组的第一个元素，并更新数组的长度。\n\n`push` 和\
    \ `pop` 操作可以高效地实现栈 (stacks)。\n\n`push` 和 `shift` 对，或 `pop` 和 `shift` 对，可以实现队列\
