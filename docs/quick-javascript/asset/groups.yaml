    # Author


    I m David Matuszek, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963 and immediately got hooked.


    I taught my first computer classes in 1970 as a graduate student in computer science
    at the University of Texas at Austin. I eventually earned a PhD there, and I’ve
    been teaching ever since. Admittedly, I spent over a dozen years in industry,
    but even then I taught as adjunct for Villanova University.


    I finally escaped from industry and joined the Villanova full time for a few years,
    and then moved to the University of Pennsylvania, where I directed a master’s
    program (MCIT, Masters in Computer and Information Technology) for students coming
    into computer science from another discipline.


    Throughout my career, my main interests have been in artificial intelligence (AI)
    and programming languages. I’ve used a lot of programming languages.


    I retired in 2017, but I can’t stop teaching, so I’m writing a series of “quick
    start” books on programming and programming languages. I’ve also written two science
    fiction novels, Ice Jockey and All True Value, and I expect to write more. Check
    them out!'
- md: "\nIf you found this book useful, it would be wonderful if you would post a\
    \ review. Reviews, even critical ones, help to sell books.\n\nAnd, hey, if you're\
    \ a former student or colleague, drop me a note at david.matuszek@gmail.com. I'd\
    \ love to hear from you!\n\n# Preface\n\nIf you are a programmer who wants to\
    \ get started programming in JavaScript as quickly as possible, this book is for\
    \ you.\n\nIf you are hoping to learn JavaScript as your first programming language,\
    \ this book is not for you.\n\nIf you want a comprehensive encyclopedia of JavaScript,\
    \ this book is not for you. For that, let me recommend the excellent JavaScript:\
    \ The Definitive Guide (David Flanagan, O'Reilly).\n\n![](img/dceb5f233df6e2a0608a4b2bf2dfa341_16_0.png)\n\
    \n# Versions of JavaScript\n\nJavaScript is an evolving language. It is defined\
    \ by a series of standards known as ECMAScript by Ecma International.\n\nAs a\
    \ language, JavaScript looks much like Java or C++. Unlike these languages, the\
    \ original version of JavaScript is widely regarded as a hastily written, poorly\
    \ designed language. Because of this perception, other languages have been written\
    \ for use on HTML pages (CoffeeScript, Dart, etc.), but these must be compiled\
    \ to JavaScript in order to be used by browsers. JavaScript is the only language\
    \ understood by browsers.\n\nIn order to make significant changes to the JavaScript\
    \ language without breaking existing programs, ECMAScript 2015 introduced strict\
    \ mode. Strict mode eliminates or modifies the worst parts of JavaScript. All\
    \ new programming should be done in strict mode.\n\nTo invoke strict mode for\
    \ an entire program, put \"use strict\"; (complete with quotes) at the first line\
    \ of a program. To invoke strict mode for a single function, put that string as\
    \ the first line inside the function.\n\nThe primary use of JavaScript is to add\
    \ interactivity to web pages. Web pages are written in HTML, HyperText Markup\
    \ Language. This book is not about HTML, but it does cover the minimum necessary.\n\
    \nWhen running in a browser, JavaScript cannot do arbitrary file I/O, nor can\
    \ it communicate with web servers other than the one from which it came. This\
    \ is necessary for security; you do not want web pages to access your files without\
    \ your knowledge. Other environments, such as IDEs, may allow these operations.\n\
    \n# Introduction\n\n## 1.1 HELLO, WORLD!\n\nTraditionally, the first program to\
    \ be written in a new language is one that prints out \"Hello, World!\" We will\
    \ follow that tradition.\n\nThe one line of JavaScript needed:\n\n```\nalert(\"\
    Hello, World!\");\n```\n\nTo execute this code, we have several options.\n\n-\
    \ Put it in a web page and run it in a browser.\n- Run it in an IDE (Integrated\
    \ Development Environment).\n- Run it from an editor application.\n- Run it from\
    \ an online JavaScript editor.\n\n## 1.2 JAVASCRIPT IN THE BROWSER\n\nIf you save\
    \ the following text in a file and then open the file in a browser, an alert dialog\
    \ containing the text “Hello, World!” will appear.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Using JavaScript</title>\n</head>\n<body>\n  <script>\n\
    \    alert(\"Hello, World!\");\n  </script>\n</body>\n</html>\n```\n\n- The `<!DOCTYPE\
    \ html>` tag says that this is an HTML document.\n- The entire page is enclosed\
    \ in the “container” `<html>` down to `</html>`. Tags beginning with `</>` denote\
    \ the end of a container. In this example, only the `<!DOCTYPE` tag is not a container.\n\
    - The `<title>` tag contains the text that will be displayed in the header bar\
    \ of the page.\n- The HTML document is divided into two parts: the `<head>` contains\
    \ assorted information that is not displayed and the `<body>` contains the part\
    \ that is displayed.\n- The `<script>` tag contains the JavaScript code. Typically,\
    \ JavaScript functions are defined in `<script>` tags in the `<head>` and calls\
    \ to them are made in `<script>` tags or in \"event handlers\" in the `<body>`.\n\
    \n## 1.3 BROWSER CONSOLES\n\nTo run JavaScript, you can use any text editor to\
    \ include it in `<script>` tags in an HTML page, and load the page into any browser.\n\
    \nThis is not the best way to write programs. Browsers ignore errors; after all,\
    \ the user doesn’t want to see them. You, on the other hand, want to see them\
    \ and correct them. For this you need to open your browser’s console. A console\
    \ will display error messages (among other things).\n\nTo open the console:\n\n\
    - In most browsers: Press F12.\n- In Safari (Macintosh): Go to Preferences: Advanced\
    \ and check Show Develop menu in menu bar. Once this is done, use cmd-opt-C to\
    \ show the console.\n\nBrowser consoles have a number of features to assist in\
    \ programming and debugging. These vary and take some time to learn; they are\
    \ not covered in this book.\n\n## 1.4 RUNNING JAVASCRIPT\n\nThere are several\
    \ IDEs (Integrated Development Environments) that can be used for JavaScript.\
    \ **Visual Studio Code** is perhaps the most popular; it is cross-platform and\
    \ free. (Don't confuse this with **Visual Studio**, which is neither cross-platform\
    \ nor free.) **NetBeans** or **Eclipse** (with a suitable plugin) are other popular\
    \ IDEs.\n\nSublime Text (cross-platform) and Notepad++ (Windows) are examples.\
    \ Yet another alternative is to use an online editor; jsfiddle is one. Finally,\
    \ all major browsers have a developer mode so that code can be written and tested\
    \ directly.\n\n# Quick\n\n## 1.5 GETTING INPUT\n\nThere are two functions that\
    \ will ask for input from the user:\n\n- `result = prompt(prompt, default);`:\
    \ This displays the prompt in a dialog box, with a place for the user to enter\
    \ text. The second parameter is optional; if given, it will be shown in the text\
    \ field. The dialog box has two buttons: OK, to return the user’s entry as a string,\
    \ and Cancel, to return null.\n- `result = confirm(question);`: This displays\
    \ the question in a modal box with two buttons: OK, to return true, and Cancel,\
    \ to return false.\n\n## 1.6 PRODUCING OUTPUT\n\nThere are several functions to\
    \ display results of your code. For browser use, remember to put your function\
    \ calls inside `<script>...</script>` tags.\n\n```javascript\nalert(arg)\n```\n\
    \n- This is the simplest way to see a result. Calling alert with one argument\
    \ of any type will pop up a dialog box containing the given value. There are two\
    \ disadvantages: The dialog box is modal, which means it must be dismissed before\
    \ computation can continue; and you only get to see one message at a time.\n-\
    \ `console.log(args)`: If you have a console open, this method will display something\
    \ on it, but exactly what it displays is implementation dependent. It may display\
    \ the args separated by spaces or by newlines, or it may display only the first\
    \ argument. Try to see what it does in whatever console you prefer to use.\n\n\
    Since console.log is intended primarily for debugging, most implementations will\
    \ display the actual structure of the args, without using the toString method.\
    \ The Console has a number of other methods, such as clear() and trace(). \n\n\
    - `document.write(args)`: This will write its arguments to the body of the HTML.\
    \ If executed as the page is being loaded, it writes the arguments directly in\
    \ that location. But if write is called after the body has been loaded (for example,\
    \ from a function), the call replaces the entire HTML body; this is probably not\
    \ what you want.\n- `document.writeln(args)`: This acts just like write, except\
    \ that the method writes a newline after the last argument. Since HTML ignores\
    \ newlines, this is fairly useless. To get a newline that isn’t ignored, write\
    \ the string \"<br>\".\n\nThe advantage of the alert and write methods is that\
    \ they do not require you to have a console open in order to view results.\n"
  mdcn: "\n\n如果你觉得这本书有用，如果你能发表评论我将非常感谢。评论（即使是批评性的评论）也有助于书籍销售。\n\n而且，嘿，如果你是我的老学生或同事，请给\
    \ david.matuszek@gmail.com 给我发邮件。我很期待收到你的消息！\n\n# 前言\n\n如果你是一个想要尽快开始学习 JavaScript\
    \ 编程的程序员，这本书正是为你准备的。\n\n如果你希望将 JavaScript 作为你的第一门编程语言，这本书并不适合你。\n\n如果你想要一本全面的\
    \ JavaScript 百全书，这本书也不适合你。对于这一点，我建议向你推荐优秀的《JavaScript: The Definitive Guide》（David\
    \ Flanagan，O'Reilly 出）。\n\n![](img/dceb5f233df6e2a0608a4b2bf2dfa341_16_0.png)\n\
    \n# JavaScript 的版本\n\nJavaScript 是一种不断演进的语言。它由 Ecma 组织定义了一系列名为 ECMAScript 的标准。\n\
    \n作为一种语言，JavaScript 看起来非常像 Java 或 C++。与这些语言不同，JavaScript 的原始版本被广泛认为是一个草率写就、设计糟糕的语言。由于这种认知，人们编写了其他用于\
    \ HTML 页面的语言（如 CoffeeScript、Dart 等），但这些语言必须编译为 JavaScript 才能被浏览器使用。JavaScript\
    \ 是唯一被浏览器理解的语言。\n\n为了在不破坏现有程序的情况下对 JavaScript 语言进行重大更改，ECMAScript 2015 引入了严格模式（strict\
    \ mode）。严格模式消或修改了 JavaScript 中糟糕的部分。所有的编程都应该在严格模式下进行。\n\n要为整个程序启用严格模式，请在程序的第一行放置\
    \ \"use strict\";（包含引号）。为单个函数启用严格模式，请将该字符串放在函数内部的第一行。\n\nJavaScript 的主要用途是为网页添加交互性。网页是用\
    \ HTML（超文本标记语言）编写的。这本书不是关于 HTML 的，但它涵盖了最少必要的内容。\n\n在浏览器运行时，JavaScript 无法进行任意的文件\
    \ I/O，也无法与其来源服务器以外的 Web 服务器进行通信。这是出于安全考虑；你不希望网页在 fact不知情的情况下访问你的文件。其他环境（如 IDE）可能允许这些操作。\n\
    \n# 简介\n\n## 1.1 你好，世界！\n\n按照传统，在新语言中编写的第一个程序通常是打印“Hello, World!”。我们将遵循这一传统。\n\
    \n只需要这一行 JavaScript 代码：\n\n```javascript\nalert(\"Hello, World!\");\n```\n\n要执行这段代码，我们有几种选择。\n\
    \n- 将其放在网页中并在浏览器中运行。\n- 在 IDE（集成开发环境）中运行。\n- 从编辑器应用程序中运行。\n- 从在线 JavaScript 编辑器中运行。\n\
    \n## 1.2 浏览器中的 JavaScript\n\n如果你将以下文本保存到文件中，然后在浏览器中打开该文件，将会出现一个包含“Hello, World!”文本的警告对话框。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Using JavaScript</title>\n\
    </head>\n<body>\n  <script>\n    alert(\"Hello, World!\");\n  </script>\n</body>\n\
    </html>\n```\n\n- `<!DOCTYPE html>` 标签表示这是一个 HTML 文档。\n- 整个页面被包含在“容器” `<html>`\
    \ 到 `</html>` 之间。以 `</>` 开头的标签表示容器的结束。在这个例子中，只有 `<!DOCTYPE` 标签不是容器。\n- `<title>`\
    \ 标签包含将在页面标题栏中显示的文本。\n- HTML 文档分为两个部分：`<head>` 包含不显示的各种信息，`<body>` 包含显示的部分。\n\
    - `<script>` 标签包含 JavaScript 代码。通常，JavaScript 函数定义在 `<head>` 中的 `<script>` 标签中，并在\
    \ `<body>` 中的 `<script>` 标签或“事件处理器”中调用。\n\n## 1.3 浏览器控制台\n\n要运行 JavaScript，你可以使用任何文本编辑器将其包含\
    \ HTML 页面的 `<script>` 标签中，并将页面加载到任何浏览器中。\n\n这不是编写程序的最佳方式。浏览器会忽略错误；毕竟，用户不想看到它们。而你，想要看到并纠正它们。为了这一点，你需要打开浏览器的控制台。控制台会显示错误信息（以及其他内容）。\n\
    \n打开控制台：\n\n- 在大多数浏览器中：按 F12。\n- 在 Safari (Macintosh) 中：进入“设置：高级”，勾选“在菜单栏中显示开发菜单”。完成后，使用\
    \ cmd-opt-C 显示控制台。\n\n浏览器控制台有许多辅助编程和调试的功能。这些功能各异且需要一些时间来学习；本书未涵盖这些内容。\n\n## 1.4\
    \ 运行 JavaScript\n\n有几种 IDE（集成开发环境）可以用于 JavaScript。**Visual Studio Code** 可能是最流行的；它是跨平台的且免费的。（不要将其与\
    \ **Visual Studio** 混淆，后者既不是跨平台的免费。）**NetBeans** 或 **Eclipse**（带有合适的插件）是其他流行的\
    \ IDE。\n\nSublime Text（跨平台）和 Notepad++（Windows）是示例。另一种选择是使用在线编辑器；jsfiddle 就是之一。最后，所有主流浏览器都有开发者模式，以便可以直接编写和测试代码。\n\
    \n# 快速入门\n\n## 1.5 获取输入\n\n有两个函数可以获取用户的输入：\n\n- `result = prompt(prompt, default);`：它在对话框中显示提示，并提供输入文本的地方。第二个参数是可选的；如果给出，它将在文本字段显示。对话框有两个按钮：确定返回用户输入的字符串，取消返回\
    \ null。\n- `result = confirm(question);`：它在模态框中显示问题，有两个按钮：确定返回 true，取消返回 false。\n\
    \n## 1.6 输出结果\n\n有几个函数可以显示代码的结果。对于浏览器使用，请将你的函数调用放在 `<script>...</script>` 标签内部。\n\
    \n```javascript\nalert(arg)\n```\n\n- 这是查看结果最简单的方法。调用 alert 传入任何参数都会弹出一个包含给定值的对话框。有两个缺点：对话框是模态的，这意味着必须关闭它后才能继续计算；而且你一次只能看到消息。\n\
    - `console.log(args)`：如果你打开了控制台，此方法会在其上显示内容，但具体显示什么取决于实现。它可能会用空格或换行符分隔 args，也可能只显示第一个参数。尝试在你偏好的任何控制台中查看它的效果。\n\
    \n由于 `console.log` 主要设计用于调试，大多数实现会直接显示 args 的实际结构，而不使用 `toString` 方法。控制台 还有许多其他方法，如\
    \ `clear()` 和 `trace()`。\n\n- `document.write(args)`：它将它的参数写入 HTML 的主体中。如果在页面加载时执行，它会将参数直接写入该位置。但如果在正文加载后调用\
    \ write（例如，从函数中调用），该调用将替换整个 HTML 主体；这可能不是你想要的。\n- `document.writeln(args)`：它的作用与\
    \ write 相同，只是该方法在最后一个参数之后写入一个换行符。由于 HTML 忽略换行符，这几乎毫无用。要获得不被忽略的换行，请写入字符串 \"<br>\"\
    。\n\nalert 和 write 方法的优点是它们不需要打开控制台即可查看结果。\n\n"
