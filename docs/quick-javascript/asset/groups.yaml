  mdcn: "\n# 112 快速 JavaScript\n\n![](img/dceb5f233df6e2a0608a4b2bf2dfa341_130_0.png)\n\
    \n图 4.1 DOM 树。\n\n每个 HTML 标签都由一个 Element 表示。Element 拥有一个 `tagName`，它是 HTML 标签的名称。DOM\
    \ 都是全大写的：HTML、HEAD、BODY、TITLE、SCRIPT 等。Element 可能具有属性（Attributes，它是 Node 的另一个子类）。\n\
    \n> **注意：** Element 只是 Node 的一种类型，但由于它无处不在，以至于两者有时会被混淆。增加混淆的是，Element 是 Node 的子类，因此所有\
    \ Node 的属性和方法都可以用于 Element。\n\n由于节点处于树形结构中，因此有一些 Node 属性允许在树中移动：parentNode、firstChild、nextSibling、previousSibling\
    \ 和 lastChild。\n\n文本和注释由 Text 和 Comment 节点表示，因此它们不会出现在只返回 Element 的属性和方法中。例如，一个\
    \ Element 有一个 `child` 属性，它是所有子元素的集合，以及一个 `children` 属性，它是仅包含 Element 子元素的集合。\n\
    \n除了 HTML 描述的网页外，还有大量的*事件*在不断发生。每一次击键、每一次鼠标移动以及许多其他事情都会导致事件的发生。交互式 页面会“监听”并响应这些事件中的一小部分。\n\
    \n## 4.4 图形用户界面\n\n图形用户界面（GUI）是允许程序与用户交互的手段。它通常由熟悉的控件或部件（widgets）组成，例如按钮、文本框、复选框、菜单项等。\n\
    \nGUI 可以用于创建独立程序，也可以用于收集信息并发送回服务器（例如订购商品时）。表单（form）是部件的容器，其目的是将信息收集成一个包。\n\n###\
    \ 4.4.1 事件\n\nGUI 程序与其他程序不同。GUI 程序不是从头到尾的连续代码序列，而是事件驱动的。当一个“有趣”的事件发生时，会触发某些代码来处理它。代码执行完毕，在另一个“有趣”的事件发生之前，什么都不会发生。\n\
    \n“有趣”的事件是指程序员编写了某些代码来处理的事件。事件一直在发生；实际上，任何产生一个或多个事件的事情都是。鼠标悬在 HTML 元素上？那是一个事件。鼠标移出\
    \ HTML 元素？那是另一个事件。事实上，只要鼠标发生了移动，那就是一个事件。有 70 多种事件，所有名称都以“on”开头的，例如 `onclick`。\n\
    \n关键点在于事件一直在发生；程序员不需要做什么来创建它们。如果用户点击按钮，那就是（通常情况下）应该被处理的事件。如果用户点击段落中的一个单词，可能该事件应该被忽略。程序员决定处理哪些事件。\n\
    \n### 4.4.2 部件 (Widgets)\n\n部件是 GUI 元素。每个部件由 HTML 中的一个标签表示，并在 DOM 中由对应的 Element\
    \ 表示。典型的部件有按钮、文本字段、文本区域、复选框、单选按钮、滚动条以及许多类型。\n\n大多数 GUI 元素可以使用 `<input>` 标签配合 `type`\
    \ 属性编写。如果省略 `type`，则假设为文本；这是一个允许输入一行文本的框。\n\n以下是 `type` 的可能值：button, checkbox,\
    \ color, date, datetime-local, email, file, hidden, image, month, number, password,\
    \ radio, range, reset, search, submit, tel (telephone), text, time, url, week。\n\
    \n有少数部件拥有自己的标签，而不是作为 `type` 的值：button, fieldset, label, option, optgroup, output,\
    \ select。\n\n### 4.4.3 按钮\n\n按钮是活动元素：当用户点击按钮时，应该导致某些事情发生。此外，提供一个视觉提示表明某些操作已完成是礼貌的。例如，如果用户点击“保存”按钮来保存文件，但没有任何可见的变化发生，用户可能会感到沮丧并反复点击按钮。\n\
    \n创建按钮有两种方法：\n\n```html\n<input type=\"button\" value=\"Click me\"\nonclick=\"\
    alert('Hello')\">\n```\n\n```html\n<button onclick=\"alert('Hello')\">Click me\n\
    </button>\n```\n\n这些每一个都会在网页上显示为一个包含 \"Click me\" 字样的按钮。它们每一个在被点击时，都会带参数 'Hello'\
    \ 调用 `alert` 函数。`<button>` 标签需要一个结束标签；而 `<input>` 标签不需要。`<button>` 标签更新且更灵活；例如，它的\
    \ `innerHTML` 可以是一个图像（使用 `<img>` 标签），而不仅仅是文本。\n\n```html\n<button onclick=\"alert('Ouch!')\"\
    >\n  <img src=\"band-aid.png\"></button>\n```\n\n`onclick` 属性的值应该是一个包含 JavaScript\
    \ 代码的字符串，在按钮被点击时执行——这是一个事件处理器。通常，事件处理器是一个单一函数调用，因此任何实质性的 JavaScript 代码都可以保留在一个地方，而不是分散在整个\
    \ HTML 页面。在上面的示例中，该函数被称为 `alert` 函数。\n\n> **注意：** 事件处理器中的 JavaScript 代码必须是一个带引号的字符串。由于代码本身可能包含带引号的字符串，因此使用了两种引号。\n"
