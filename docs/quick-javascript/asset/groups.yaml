    JavaScript-Specific Statements.


    Note 1: While the traditional for statement is the same, the initialization part
    will, of course, use let rather than the type of the control variable.


    Note 2: The switch statement allows each case to specify an expression, not just
    a constant value.


    Here is a list of statements that are the same:


    +   * variable = expression;

    * expression;

    * { statements }

    * if (condition) {

