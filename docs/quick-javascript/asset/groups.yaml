    # JavaScript: In More Detail ■ 63


    Garbage collection can happen at unpredictable times. Consequently, the state
    of a WeakMap at any given time may be nondeterministic. The only allowable methods
    on a WeakMap are those for which this will not be an issue.


    # 3.4.10 Promises


    If you have a long-running task whose results are not needed immediately, such
    as a file transfer, you may wish to start it asynchronously while your code continues
    to do other things. A **promise** is code that runs asynchronously and “promises”
    to complete a task at some later time.


    The following assignment statement creates a Promise object, saves it in *promise*,
    and starts the *function* executing:


    ```

    let promise = new Promise(function);

    ```


    > **Caution:** Keep in mind the distinction between a function and a function
    call. If we define function f(){}, then f is the function itself, while f() is
    a call to that function. The argument to the Promise constructor must be a function.


    There are three ways a promise can terminate: By reporting “success,” by reporting
    “failure,” or by throwing an exception. To deal with this, the **function** used
    by the promise should have two parameters, each of which is also a function (sometimes
    called a *callback*). The promise code should call the first function to report
    success, or the second to report failure.


    It is often convenient to use **arrow functions** (described later) to write the
    callback functions of a promise. Like this:


    ```

    new Promise((onSuccess, onFailure) => {code});

    ```


    In this syntax, **code** is the (possibly long-running) code to be executed, **onSuccess**
    is a function to execute if **code** is successful,'
