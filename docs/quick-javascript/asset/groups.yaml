    of the <html> tag.

    - document.head — An HTMLHeadElement whose innerHTML is the text in the document''s
    <head>.

    - document.body — An HTMLBodyElement whose innerHTML is the text in the document''s
    <body>.

    - document.title — The document''s title, as a string.

    - document.URL — The document''s read-only URL as a string, including the protocol
    (such as http://).

    - document.bgColor — The background color of the document; may be changed by assignment.
    The assigned value should be a string such as "red", "#ff0000", or "#ff0000",
    not a JavaScript-style hexadecimal number.

    - document.fgColor — The foreground (text) color of the document, assignable in
    the same way as bgColor.


    The purpose of HTML has always been to describe the structure of a document, but
    from the beginning it had a number of features to'
