    # 3.4.2 Strings


    A string is a sequence of zero or more UTF-16 characters enclosed in single quotes
    (''hello''), double quotes ("hello"), or backticks (`hello`). UTF-32 is not supported.


    Quote marks of one type may be used within a string enclosed by a different type
    of quote mark, for example, "Don''t go.". Quote marks of the same type as the
    enclosing type must be escaped (see below).


    Strings enclosed in backticks are special. They may span several lines, and anywhere
    in the string that ${expression} occurs, the expression is evaluated and becomes
    part of the string. Strings like this are called template literals.


    There is no "character" data type. Some characters that cannot be written directly
    in a string can be "escaped," that is, specified by a backslash followed by a
    letter or hex number. Characters written in this way still count as single characters.


    Escaped characters are:


    +   - \0 NUL


    +   - \b backspace'
