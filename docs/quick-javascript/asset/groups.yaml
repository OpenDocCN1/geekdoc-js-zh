    # 60 Quick JavaScript


    Here are some ways to make a sparse array:


    +   Use the form `Array(length)` to create the array.

    Use delete `array[i]` to delete some existing element of `array`.

    Assign a value to `array[i]`, where `i > array.length`.

    Assigning a value to `array[array.length]` does not force the array to be sparse.

    Set the length property of an array to a larger value.

    If you set length to a smaller value, array elements at that index and beyond
    are discarded.

    Write a literal array using consecutive commas, for example, `["cat", "dog",,\,]`.

    The length of this array is five (not six); the last comma taken as a trailing
    comma.


    To better understand sparse arrays, it helps to remember that undefined is an
    actual value in JavaScript, and as such takes actual space in memory. But if we
    ask for the value in some location of a sparse array and get undefined, this could
    mean either (1) there is nothing in that location, or (2) the location really
    does contain the value undefined.


    This has some practical implications. The for/in loop will loop through all indices
    of an array, whether there is something at that location or not. The for/of loop
    will only loop through actual values (of which some may be undefined).


