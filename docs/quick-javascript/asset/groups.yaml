    \ 将是 100。\n\n## 3.11.10.4 类原型\n\n如前所述，你可以构造一个使用现有对象作为其原型的对象。\n\n```javascript\n\
    let newObj = Object.create(oldObj);\n```\n\n`newObj` 初始没有任何自己的属性，但稍后可以添加属性。任何查找\
    \ `newObj` 属性的尝试首先会在 `newObj` 自身查找，但如果那里没有，JavaScript 将在它的原型 `oldObj` 中查找。\n\n\
    方法 `Object.getPrototypeOf(newObj)` 将返回 `oldObj`，但也有一种旧的方法来访问原型 `__proto__`。在新代码中不应使用不可枚举的\
    \ `__proto__` 属性。\n\n类中也会发生类似的情况。\n\n```javascript\nclass Person {...}\nclass\
    \ Customer extends Person {...}\nlet Sally = new Customer(...);\n```\n\n# JavaScript:\
    \ 深入细节 ■ 107\n\n对象 `sally` 可以访问在 `Customer` 中声明的方法，以及在 `Person` 中声明的方法（除非它们被 `Customer`\
    \ 中同名的方法重写）。\n\n当你声明一个函数或创建一个带有构造函数的类时，该函数或类会获得一个命名非常误导的名为 `prototype` 的属性。该属性的值是一个包含函数名和定义的对象。\n\
    \n> 注意：不要将类的原型属性 `class.prototype` 与对象的原型 `obj.__proto__` 混淆。\n\n你可以通过给类的原型赋值来为该类的所有实例附加方法：\n\
    \n```javascript\nPerson.prototype.initial = function() {\n  return this.name[0];\n\
    }\n```\n\n方法 `initial` 将返回人名字的第一个字符（假设 `Person` 有一个 `name` 属性）。\n\n## 3.12 转译器与填充（Polyfills）\n\
    \nJavaScript 正在演进并（希望）变得更好。遗憾的是，旧版浏览器可能不支持某些最新特性。为了让 JavaScript 代码能够“随处”运行，可以采取两种不同的方法：\n\
    \n- 1. 仅使用随处运行的成熟特性。\n- 2. 使用转译器（transpilers）或填充函数（polyfills）。\n\n转译器会将较新的语法特性（例如\
    \ `??` 运算符）编译”为旧的或等价的语法。Babel 是一个著名的转译器。\n\n填充函数（polyfill）是一个函数或函数库，目前可能被包含也可能不包含。缺失的函数可以直接添加到代码中。可以从填充服务器加载填充函数库，尽管这会增加加载时间。关于使用哪种填充库存在更多争议，如果存在的话，`polyfill.io`\
    \ 是相当流行的。\n\n## 3.13 JSON\n\nJSON（JavaScript 对象表示）是一种将数据表示为文本的方法。这对于将数据存储在文件中或在服务器之间传输数据非常有用。JSON\
    \ 是人类可读可编辑的；它与 JavaScript 数据非常相似。\n\n有两个方法：\n\n- `JSON.stringify(value)`——将 JavaScript\
    \ 值转换为 JSON 字符串。\n- `JSON.parse(string)`——将 JSON 字符串转换为 JSON 对象。\n\n这两个 JSON 方法都可以接收额外的参数（此处未描述），以便在处理时修改值。\n\
    \n局限性：\n\n- 函数、符号、undefined、Infinity 和 NaN 无法在 JSON 中表示。它们被替换为 `null`。\n- 日期被转换为字符串，且不会自动转换回\
    \ `Date` 对象。\n- 不可枚举属性以及键为符号的属性会被忽略。\n\n如果默认表示方法不满意，可以给任何对象赋予一个 `toJSON()` 方法。\n\
    \n## 客户端\n\n如果默认表示方法不满意，可以给任何对象赋予一个 `toJSON()` 方法。\n\n## 基础 HTML\n\n如果默认表示方法不满意，可以给任何对象赋予一个\
    \ `toJSON()` 方法。\n\n## 4.2 在 HTML 中添加 JavaScript\n\n可以通过以下方式将 JavaScript 添加到 HTML\
    \ 页面：\n\n- 将 JavaScript 放在 `<script>...</script>` 标签内，位于 head 或 body 中任位置。\n-\
    \ 将 JavaScript 放在具有 `.js` 扩展名的独立文件中，并在 `head` 中通过 `<script src=\"URL.js\"></script>`\
    \ 加载。在这种情况下，`<script>` 标签内的任何代码将被忽略。\n- 将 JavaScript 写入 HTML“事件处理器”属性的值中。\n\n\
    ## 4.3 DOM 概述\n\nHTML DOM（文档对象模型）将 HTML 页面上的所有内容表示为节点树，甚至包括 HTML 注释和每个空白字符。DOM\
    \ 中的所有内容都可以被 JavaScript 访问和更改，并且 JavaScript 的每处更改都会立即反映在显示给用户的页面上。对于大多数应用程序来说，这种力量远超所需。\n\
    \n"
