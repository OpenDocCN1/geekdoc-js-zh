    - length — The number of characters in the text.

    - nodeName — The string "#text".

    - appendData(data) — Adds data to the end of the text.

    - insertData(offset, data) — Inserts data into the text at the given offset.

    - deleteData(offset, count) — Removes count characters from the text, starting
    at the given offset.

    - replaceData(offset, count, data) — Replace count characters starting at offset
    with data.

    - substringData(offset, count) — Returns count characters from the text, starting
    at offset.

    - remove() — Removes the node from the DOM tree.


