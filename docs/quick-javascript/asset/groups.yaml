    # 3.4 DATA TYPES


    # 3.4.1 Numbers


    A *number* may be written as an integer or as a real number. However written,
    numbers (other than bigints) are stored as double precision floating point numbers
    and follow the IEEE Standard for Floating-Point Arithmetic (IEEE 754).


    To improve readability, numbers may include underscores, for example, one million
    may be written as `1_000_000`.


    > **Caution:** The methods to convert strings to numbers (Number, parseInt, and
    parseFloat) cannot recognize underscores in numbers.


    There are some special predefined "numbers":


    +   * *NaN* (`"Not a Number"`) is the result of expressions such as 0/0 and `"one/"`
    two.


    +   * You can write this as Number.NaN, or just NaN.


    +   * Despite the name, *NaN* is a number, and typeof(NaN) will return "number".


    +   * Arithmetic involving NaN results in NaN.'
  - '[PAGE 72]


    # Quick JavaScript


    +   - Infinity is the result of expressions such as 1/0.

    - -Infinity is the result of expressions such as -1/0.

    - isFinite(x) will return false for -Infinity, Infinity, and NaN.

    - Number.MIN_VALUE is the smallest number that can be represented, approximately
    5e-324.

    - Number.EPSILON is approximately 2.220446049250313e-16. It is the smallest number
    that, added to one, gives a different result from one.

    - Number.MAX_VALUE is the largest number that can be represented, approximately
    1.7976931348623157e+308.

    - Number.MAX_SAFE_INTEGER is 9007199254740991 ; it is the largest integer that
    can be uniquely represented as a double precision floating number.

    - Number.MIN_SAFE_INTEGER is -9007199254740991.


    All of the above are considered to be numbers. No arithmetic expression will ever
    cause an exception.


    > Caution: The function NaN(value) returns true if value is NaN, but it also returns
    true for any value that cannot be converted to a number. To test if the value
    of variable v is NaN, use the test v != v. This works because NaN is the only
    value that is not equal to itself.


    Some additional methods are Number.isInteger(n), Number.isSafeInteger(n), and
    Number.isFinite(n).


    A bigint is an integer with an n suffix, for example, 123n. Bigints can have an
    arbitrary number of digits. All the usual numeric operations are available on
    bigints, except for unary plus: +123n is illegal.'
