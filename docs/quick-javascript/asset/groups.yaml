    ## 124 Quick JavaScript


    ### 4.4.10 Other Input Widgets


    Along with button, text, submit, and password, there are a number of values that
    the type attribute of an `<input>` tag can take. Recall that for `<input>`, all
    the needed information is in the start tag; no end `</input>` tag is used.


    Many of these widgets give no indication to the user what they are intended for,
    so they should always be accompanied by a label, preferably with one that includes
    the `for` attribute.


    - radio The widget `<input type="radio" id="id" name="group" value="value">` defines
    a radio button. Radio buttons are always used in groups, where every radio button
    has the same value for the name attribute. Selecting one radio button of a group
    deselects all the others in that group.


    - In a form, group.value is the the value of the selected radio button. If not
    in a form, the radio buttons must be checked individually.


    - If no radio button has been selected, the value of that group is the empty string.
    To start with one button checked, give it the checked flag.


    - checkbox The `<input type="checkbox" id="id">` is displayed as a small square
    that can be checked or unchecked, independently of any other checkboxes. The checked
    attribute (not the value attribute) of a checkbox will be true or false.


    - file The `<input type="file">` widget displays a rectangle containing the words
    "Choose File". When clicked, it brings up a file chooser. The file chosen is accessible
    as the value attribute of the field. If the widget contains the multiple flag,
    multiple files can be selected.


    - image The `<input type="image" src="path">` widget displays the indicated image.


    ## Client-Side JavaScript 125


    - color — `<input type="color">` widget displays a small rectangle containing
    a color (black, by default). Clicking it brings up a color chooser. The value
    attribute sets the initial color, which must be of the form #RRGGBB (six hex digits
    representing the amounts of red, green, and blue).


    - `<input type="hidden">` widget is not visible to, and cannot be modified by,
    the user.


    - When interaction with a server occurs in a sequence of pages, the server can
    collect information from one page and store it as attributes of a hidden widget
    in the next page. In this way, a server can maintain information for a given user
    across a series of transactions.


    - Hidden fields are not a security device. The underlying HTML of a page, including
    hidden fields, can be viewed in any browser.


    - `<input type="range">` displays a slider, to be used for choosing a number in
    a given range. The default attributes are min="0", max="100", step="1", and value="50".


    Each checkbox and radio button has an associated label immediately to its right.
    Checkboxes and radio buttons are small and a bit difficult to click on, as each
    should have a label with `for="id"` attribute.


    - `<label for="id">text</label>` — Clicking on the label is the same as clicking
    on the widget whose id is specified by its attribute.


    ## 4.4.11 Events


    User actions (typing something, moving the mouse, clicking the mouse, etc.) cause
    events to occur. One or more event handlers will be executed when certain events
    occur.


    Each form element ("widget") can have attributes that act as event handlers. For
    example, a button may be defined as follows:


    ```html

    <input type="button" onclick="save()" value="Save">

    ```


    `onclick` is an event handler that tells JavaScript what to do; in this case,
    call the save() function when the button is clicked. Event handlers should generally
    be implemented as function calls.


    Numerous events can occur, and not every widget can respond to every event. Browsers
    differ somewhat in what form elements will handle which events. This section describes
    the events and which form elements should be able to handle them.


    Event names are sometimes written in camelCase, for example `onClick` instead
    of `onclick`. This works because tags in HTML are case insensitive, but does not
    work in the quoted JavaScript, which is case sensitive.


    The following events can be handled in `<body>` or `<frame>` elements (a frame
    is a separate URL file that is loaded as a part of a page):


    - onload — the document or frame has completed loading. This can be used to execute
    a function to do any initialization.


    - onunload — the document or frame is unloaded. This can be used to perform any
    final cleanup actions.


    The following events can be handled by most elements.


    - onclick — the element is clicked. Buttons will almost always handle an onclick
    event. Most other widgets handle all the usual actions automatically for the given
    type of widget.


    ## Client-Side JavaScript 127


    - ondblclick — the element is clicked twice in succession.

    - onmousedown — one of the mouse buttons (or the keyboard equivalent) is pressed
    while over the widget. To distinguish which mouse button is pressed, use onmousedown
    instead of onclick. The value of event.button will be 0, 1, or 2 for the left,
    middle, and right mouse buttons, respectively.

    - onmouseup — the mouse button is released while over the widget. This event is
    usually ignored in favor of handling the onclick event.

    - onmouseover — the mouse is moved over the widget.

    - onmouseout — the mouse is moved away from the widget.

    - onmousemove — the mouse is moved.


    Modern devices may have touch screens or pens. The above onmouse events may be
    replaced with pointer events which work equally well with mouse and touch.


    The following events can be handled by `<body>` and `textarea`:


    - onkeypress — a key is pressed while the widget has focus.

    - onkeydown — a key is depressed while the widget has focus.

    - onkeyup — a key is released while the widget has focus.

    - onfocus — the widget gains focus.

    - onblur — the widget loses focus.

    - onchange — the value of the widget changes and it loses focus.


    ## 128 Quick JavaScript


    Client-Side JavaScript


    ### 4.4.12 Bubbling


    When an event happens on an element, the element can either handle it or ignore
    it. Either way, the element''s parent then gets a chance to handle the event,
    the parent''s parent, and so on, all the way up to the root (the global object).
    This process is called bubbling, and is generally desirable.


    For example if a button is clicked, and the button is in a form, and the form
    is in a document, and the document is in a window, any or all of these elements
    can do something in response to the button click.


    - event.target is the most deeply nested element, and the one that first has a
    chance to respond.

    - event.currentTarget is the one currently handling the event (it is equal to
    `this`).

    - event.stopPropagation() stops any further bubbling. Not generally recommended.

    - event.preventDefault() prevents default actions from occurring, such as form
    submission or following a link.


    For example, the following code displays a button which, when clicked, writes
    a message to console.log:


    ```html

    <input type="button" value="Wow!" id="bait" onclick="console.log(event.type +
    event.target.id)">

    ```


    ## 4.5 USING THE DOM


    ### 4.5.1 The Window Object


    It is easy to think of document as the root of the HTML tree. In a browser, document
    is actually a child of another node, window. It is not necessary to say `window.document`,
    because window is assumed by default.

