    # Client-Side JavaScript


    After a few introductory sections, the remainder of the book is divided into two
    parts: **Graphical User Interfaces**, which is all that many JavaScript programmers
    need, and **Using the DOM**, which describes the powerful understructure of web
    pages.


    # 4.1 ESSENTIAL HTML


    An HTML page is a text file, usually in Unicode, containing tags.


    Most **tags** are containers. They consist of a **start tag**, some **contents**,
    and an **end tag**. The contents are the `innerHTML` of the tag. The syntax is:


    ```

    <tagName> contents </tagName>

    ```


    Container tags can contain text and other tags, to any level.


    A few kinds of tags are **empty**, that is, not containers. For example, `<br>`
    is a line break, and `<hr>` is a horizontal rule. No end tag is needed. Such tags
    are sometimes written as `<tagName/>`.


    An HTML page consists of at least four tags:


    +   - A **document tag**, which identifies the file as HTML. It is not a container.


