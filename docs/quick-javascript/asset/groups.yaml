    # # Appendix B:

    Higher-Order Methods


    There are a number of built-in array methods that take a function as a parameter.
    Arrow functions are often used as arguments, though functions defined in other
    ways may be used. In the following, we use $f$ for a function that takes one argument
    and $f2$ for a function that takes two arguments.


    +   - array.sort(f2) — Sorts the array in place and also returns the sorted array.
    If $f2(x, y)$ returns a negative result, $x$ is considered to be less than $y$;
    if zero, if positive, $x$ is greater than $y$.

    - For example, a.sort((x, y) => x - y)) sorts the array in an ascending numeric
    order.

    - array.forEach(f) — Calls the function $f$ for each element of $array$. To be
    useful, $f$ should have side effects, since any values returned by $f$ are ignored.

    - array.find(f) — Finds and returns the first value in $array$ for which $f$ returns
    a truthy value (or undefined if none is found)'
