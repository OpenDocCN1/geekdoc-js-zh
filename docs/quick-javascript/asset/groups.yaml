    the value attribute is provided, it is used as the initial number displayed.


    +   - URL — A text field in which a URL can be entered. The field is automatically
    checked (when submitted) to ensure that the entry is a syntactically correct URL.


    +   - textarea — <textarea name="name" rows="nrows" cols="ncols"> widget provides
    a multiline text-entry area, consisting of nrows rows and wide enough to display
    ncols characters.


