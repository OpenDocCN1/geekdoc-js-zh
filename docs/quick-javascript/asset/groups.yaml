    2\"]`。\n\n在创建或向对象添加时也可以使用方括号。继续上面的示例，可以使用以下两种状态之一向 `car` 添加 `mileage` 属性，或者如果\
    \ `mileage` 已经是属性，则更新其值：\n\n```javascript\ncar.mileage = 25300;\ncar[\"mileage\"\
