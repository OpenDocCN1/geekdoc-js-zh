    a digit. By convention, the names of variables, properties, functions, and methods
    should begin with a lowercase letter; names of constructors should begin with
    a capital letter. Names may be any length.


    Case is significant in JavaScript but not in HTML. Since JavaScript names are
    frequently used in HTML, this can lead to some strange errors if you are not careful
    about case.


    As in most other languages, you cannot use a reserved word as an identifier.


    # 3.3 DESTRUCTURING


    Destructuring is a way to assign the parts of an object or array into several
    different variables.


    As an example, we use the following object:


    ```

    let p = { givenName: "Sally",

    familyName: "Willis",

    occupation: "doctor" };

    ```


    We may wish to assign the parts of this object into separate variables, as


    ```

    let givenName = p.givenName;

    let familyName = p.familyName;

    let occupation = p.occupation;

    ```


    Destructuring is a shorter way to do exactly the same thing:


    ```

    let {givenName, familyName, occupation} = p;

    ```


    Property names need not to be given in order, and not every name has to be mentioned.
    Property names that are not actually part of the object may be given; they will
    receive the value undefined.'
  - '[PAGE 70]


    To work with a similar object of the same type, say p2, you cannot use let again
    because variables may only be declared once.


    ```

    let {givenName, family, occupation} = p2;

    // SyntaxError: Identifier ''givenName'' has

    // already declared

    ```


    Neither can you simply omit the word let because starting with an open brace,
    {, indicates a block.


    ```

    {givenName, family, occupation} = p2;

    // SyntaxError: Unexpected token ''=''

    ```


    The solution is to enclose the entire statement, up to the semicolon, in parentheses.


    ```

    {{givenName, family, occupation} = p2};

    ```


    An object may be destructured into different variable names.


    ```

    let {familyName: name, occupation: occ} = p;

    // name = "Willis", occ = "doctor"

    ```


    Default values may be given, in the case the object lacks the given properties.


    ```

    {{givenName: name, country = "USA"} = p;

    // name = "Sally", country = "USA"

    ```


    Renaming and giving default values may be combined.


    ```

    {{givenName:name="Joe", age=40} = p;

    // name = "Sally", age = 40

    ```


    When a function is called, values are assigned to the parameters, and these act
    like assignment statements; therefore, destructuring may also be used in the parameter
    list.


    ```

    function f({familyName, occupation: occ, age=40, gender="male"}) {

    ```'
