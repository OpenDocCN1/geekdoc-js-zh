- md: "\n## 84 Quick JavaScript\n\n- The value of that property must be method named\
    \ next, which takes no arguments and returns an object with the fields value and\
    \ done.\n- If it is true, the iteration ends and value is ignored.\n\nThe syntax\
    \ for creating an iterator can get quite confusing. One simplification is to define\
    \ the required next() method as a generator, since generators are a kind of function\
    \ and return the required kind of value.\n\nAs an example, we define a range object:\n\
    \n```javascript\nlet range = {start:10, step: 5, end: 25};\n```\n\nNext we add\
    \ this to this iterator that will produce the values start, start+step, and so\
    \ on, but not including end.\n\n```javascript\nrange[Symbol.iterator] =\nfunction*\
    \ next() {\n  n = this.start;\n  while (n < this.end) {\n    yield n;\n    n +=\
    \ this.step;\n  }\n}\n```\n\nand test it:\n\n```javascript\nfor (let e of range)\
    \ {\n  console.log(e);\n}\n```\n\nThis gives the correct values 10, 15, and 20.\n\
    \nNotice the use of the word this. As mentioned earlier, when this is used in\
    \ a method (a function belonging to an object), it refers to the containing object.\n\
    \n## JavaScript: In More Detail 85\n\nIn the above, the iterator was added to\
    \ an existing object. It can also be added when an object is created.\n\n```javascript\n\
    {start:12, step: 5, end: 30, [Symbol.iterator]: function* next() {...} }\n```\n\
    \n## 3.11 OBJECTS\n\n### 3.11.1 Definition of Objects\n\nJavaScript is an object-oriented\
    \ language.\n\nIn JavaScript, you can create objects without having to first define\
    \ a class. This section is about objects; classes will be covered later.\n\nAn\
    \ object is a collection of named values (called properties or fields). Objects\
    \ use dot notation, as in other object-oriented languages, but they behave more\
    \ like hash tables (also called maps or dictionaries).\n\nYou can write an object\
    \ literal by enclosing key: value pairs in braces. For example:\n\n```javascript\n\
    let car = {make: \"Subaru\", year: 2018}\n```\n\nThis defines the object car with\
    \ the properties make and year. You can refer to the fields with dot notation.\
    \ For example, the statement\n\n```javascript\nconsole.log(car.make + \" \" +\
    \ car.year);\n```\n\nwill write \"Subaru 2018\" to the console. If you don't have\
    \ a console open, you won't see the result; in that case you may wish to use\n\
    \n```javascript\nalert(car.make + \" \" + car.year);\n```\n\ninstead.\n\n## 86\
    \ Quick JavaScript\n\nWe can add properties to an existing object:\n\n```javascript\n\
    car.mileage = 25041;\n```\n\nor delete them:\n\n```javascript\ndelete car.mileage;\n\
    ```\n\nProperty names (the \"key\" part of key: value) are always either strings\
    \ (which do not need to be quoted) or symbols. It may not look that way; the following\
    \ is legal:\n\n```javascript\nlet nums = {2: \"two\", 3.1416: \"pi\"}\n```\n\n\
    In this code, the keys are actually the strings \"2\" and \"3.1416\".\n\nThere\
    \ is a second way to access properties: You can use brackets [], instead of dot\
    \ notation. Instead of nums.2 or nums.3.1416, which are illegal syntax, you can\
    \ say nums[2] and nums[3.1416]. Any expression within the brackets will be evaluated\
    \ and the result converted to a string; so nums[5-3] is the same as nums[\"2\"\
    ].\n\nBrackets can also be used when creating or adding to an object. Continuing\
    \ the above example, either of the following two states could be used to add the\
    \ property mileage to car, or update the value of mileage if it is already a property:\n\
    \n```javascript\ncar.mileage = 25300;\ncar[\"mileage\"] = 25300;\n```\n\nWhen\
    \ creating an object, brackets can be used to compute the name of a property (the\
    \ key), the value, or both.\n\n```javascript\nlet property = \"make\";\nlet make\
    \ = \"Subaru\";\nlet age = 2;\ncar = {[property]: [make], year: 2020 - age};\n\
    ```\n\nIf you have some variables containing values and you want to create an\
    \ object with the same names and values, there is a very convenient shorthand\
    \ you can use. Writing just a variable name is the same as adding a property with\
    \ that name and the variable’s value. For example, if\n\n```javascript\nlet make\
    \ = \"Subaru\";\nlet year = 2018;\n```\n\nthen\n\n```javascript\nlet car = {make,\
    \ year}\n```\n\nshorthand for\n\n```javascript\nlet car = {make: \"Subaru\", year:\
    \ 2018}\n```\n\nTo test whether an object has a particular property, use the in\
    \ operator. For example, \"make\" in car returns true.\n\nYou can use the for/in\
    \ loop to step through all the properties of an object. The code\n\n```javascript\n\
    for (prop in car) {\n  console.log(prop + \" is \" + car[prop]);\n}\n```\n\nwill\
    \ display the following on the console:\n\n```\n\"make is Subaru\"\n\"year is\
    \ 2018\"\n```\n\n### 3.11.2 Creating Objects\n\nIn the previous section, we made\
    \ an object by writing literal, {make: \"Subaru\", year: 2018}, which we then\
    \ assigned to.\n\nAnother way to create an object is to first create a blank object\
    \ {}, then add properties:\n\n```javascript\nlet car = {};\ncar.make = \"Subaru\"\
    ;\ncar.year = 2018;\n```\n\nYet another way to create an object is to use the\
    \ constructor, then add properties to:\n\n```javascript\nlet car = Object();\n\
    car.make = \"Subaru\";\ncar.year = 2018;\n```\n\nAnother way to create an object\
    \ is to use a function, and returns this:\n\n```javascript\nfunction Car(make,\
    \ year) {\n  this.make = make;\n  this.year = year;\n}\nlet car = new Car(\"Subaru\"\
    , 2018);\n```\n\nThere is another way to create an object, using a function, and\
    \ it returns this:\n\n```javascript\nfunction Car(make, year) {\n  this.make =\
    \ make;\n  this.year = year;\n}\nlet car = new Car(\"Subaru\", 2018);\n```\n\n\
    JavaScript: In More Detail 89\n\nThe Object.create() method uses an existing object\
    \ as proto. The newly created object has no properties of its own; it is “transparent,”\
    \ in the sense that any attempt to read its properties will “see through it”\n\
    \n```javascript\nlet car2 = Object.create(car);\ncar2.make = \"VW\";\ncar2.color\
    \ = \"blue\";\n```\n\nFollowing these statements, car will be unchanged, but car2\
    \ will have \"VW\" as its make, \"blue\" as its color, and 2018 as its year.\n\
    \n### 3.11.3 Copying Objects\n\nAs is the case with most languages, a variable\
    \ holds only a small amount of information, such as a single number. Objects,\
    \ including arrays, sets, maps, and user-created objects, take up great deal room.\
    \ Consequently, what is actually “in” a variable is a reference (or pointer or\
