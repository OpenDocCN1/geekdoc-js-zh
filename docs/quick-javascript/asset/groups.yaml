    # Author


    I am David Matuszek, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963 and immediately got hooked.


    I taught my first computer classes in 1970 as a graduate student in computer science
    at the University of Texas at Austin. I eventually earned a PhD there, and I’ve
    been teaching ever since. Admittedly, I spent over a dozen years in industry,
    but even then I taught as adjunct for Villanova University.


    I finally escaped from industry and joined the Villanova full time for a few years,
    and then moved to the University of Pennsylvania, where I directed a master’s
    program (MCIT, Masters in Computer and Information Technology) for students coming
    into computer science from another discipline.


    Throughout my career, my main interests have been artificial intelligence (AI)
    and programming languages. I’ve used a lot of programming languages.


    I retired in 2017, but I can’t stop teaching, so I’m writing a series of “quick
    start” books on programming and programming languages. I’ve also written two science
    fiction novels, Ice Jockey and All True Value, and I expect to write more. Check
    them out!

