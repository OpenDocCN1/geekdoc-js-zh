    # 3.1 STRICT MODE


    No language is perfect. JavaScript allows some things that, in retrospect, should
    not have been allowed. JavaScript now has a strict mode to disallow those features
    and to modify others. To turn strict mode on globally, put the string


    ```

    "use strict";

    ```


    as the first thing in a script; to turn strict mode on for just one function,
    put that string as the first line inside the function.'
