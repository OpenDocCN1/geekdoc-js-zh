  - '[PAGE 17]


    # Versions of JavaScript


    JavaScript is an evolving language. It is defined by a series of standards known
    as ECMAScript by Ecma International.


    As a language, JavaScript looks much like Java or C++. Unlike these languages,
    the original version of JavaScript is widely regarded as a hastily written, poorly
    designed language. Because of this perception, other languages have been written
    for use on HTML pages (CoffeeScript, Dart, etc.), but these must be compiled to
    JavaScript in order to be used by browsers. JavaScript is the only language understood
    by browsers.


    In order to make significant changes to the JavaScript language without breaking
    existing programs, ECMAScript 2015 introduced strict mode. Strict mode eliminates
    or modifies the worst parts of JavaScript. All new programming should be done
    in strict mode.


    To invoke strict mode for an entire program, put "use strict"; (complete with
    quotes) at the first line of a program. To invoke strict mode for a single function,
    put that string as the first line inside the function.


    The primary use of JavaScript is to add interactivity to web pages. Web pages
    are written in HTML, HyperText Markup Language. This book is not about HTML, but
    it does cover the minimum necessary.'
  - '[PAGE 18]


    When running in a browser, JavaScript cannot do arbitrary file I/O, nor can it
    communicate with web servers other than the one from which it came. This is necessary
    for security; you do not want web pages to access your files without your knowledge.
    Other environments, such as IDEs, may allow these operations.'
