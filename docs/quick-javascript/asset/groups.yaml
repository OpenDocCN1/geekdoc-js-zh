    The Console has a number of other methods, such as clear() and trace(). Implementation
    varies.


    +   document.write(args)


    +   This will write its arguments to the body of the HTML. If executed as the
    page is being loaded, it writes the arguments directly in that location. But if
    write is called after the body has been loaded (for example, from a function),
    the call replaces the entire HTML body; this is probably not what you want.


    +   document.writeln(args)


    +   This acts just like write, except that the method writes a newline after the
    last argument. Since HTML ignores newlines, this is fairly useless. To get a newline
    that isn’t ignored, write the string "<br>".


    The advantage of the alert and write methods is that they do not require you to
    have a console open in order to view results.'
- md: "\n![](img/dceb5f233df6e2a0608a4b2bf2dfa341_24_0.png)\n\n# JavaScript\n\n# The\
    \ Bare Minimum\n\nThis chapter and Chapter 3 describe JavaScript simply as a language,\
    \ without reference to Web programming. It is in two major parts:\n\nThe Bare\
    \ Minimum—This section is intended to get you started programming in JavaScript\
    \ as quickly as possible. The best way to do that is to try things out as you\
    \ go.\n\nIn More Detail—This goes over the same material again, filling in a lot\
    \ of the gaps. To some extent, it can also be used as a reference.\n\n## 2.1 COMMENTS\n\
    \n```\n// introduces a comment that extends to the end of the line.\n```\n\nMulti-line\
    \ comments start with /* and end with **.\n\nInside a comment, // and /* have\
    \ no special meaning (so you cannot “nest” comments). Inside a quoted string or\
    \ regular expression, // and /* do not start a comment.\n\nDOI: 10.12011/9781003359609-2\n\
    \n## 2.2 DATA TYPES\n\n### 2.2.1 Primitives\n\nThere are eight data types:\n\n\
    - A number may be written with or without a decimal point, but all numbers are\
    \ stored as double precision floating point.\n- A bigint is an integer with an\
    \ arbitrarily large number of digits.\n- The two boolean values are written as\
    \ true and false.\n- A string may be enclosed in either single quotes, double\
    \ quotes, or backticks ('). There is no “character” type.\n- A symbol is a value\
    \ that is guaranteed to be unique; no other value is equal to it. A symbol is\
    \ created by calling Symbol() or Symbol(name), where name is a (not necessarily\
    \ unique) value that may be helpful in debugging.\n- The undefined type has a\
    \ single value, undefined. It is the value of a variable that has been declared\
    \ but not yet given a value.\n- The null type has a single value, null, meaning\
    \ the value does not exist.\n- An object is any more complicated data type. Functions,\
    \ arrays, sets, maps, regular expressions, errors, and dates are all special types\
    \ of object, as are user-defined objects.\n\nThe type of a value can be determined\
    \ by typeof, which can be used as either an operator, typeof x, or as a function,\
    \ typeof(x). It will return, as a string, one of the type names given above (for\
    \ example, \"number\").\n\nThere are two exceptions to the above.\n\n- The value\
    \ of typeof(null) is \"object\". This is generally regarded as an error in the\
    \ design of the language.\n\nFor any type of object except a function, typeof\
    \ will return \"object\". Applied to a function, typeof will return \"function\"\
    .\n\n### 2.2.2 User-Defined Objects\n\nAn object is a collection of named values,\
    \ called its properties. You can define an object by putting property: value pairs\
    \ inside braces and later refer to the values with the syntax object.property.\
    \ For example,\n\n```\nlet friend = { givenName: \"Anna\",\n  sname: \"Lang\"\
    \ };\nalert(\"Hello, \" + friend.givenName);\n```\n\nIf the name of a property\
    \ is stored in a variable or can be computed, it can be accessed by the syntax\
    \ object[expression], for example, friend[\"given\"] + \"Name\".\n\nThe test property\
    \ in object, where property is given as a string, will return true if and only\
    \ if object has that property. A request for a property that does not exist will\
    \ get the value undefined.\n\n### 2.2.3 Built-In Object Types\n\nJavaScript comes\
    \ with a number of built-in, or predefined, object types. Among these are arrays,\
    \ sets, maps, dates, and regular expressions.\n\n### 2.2.4 Arrays\n\nAn array\
    \ is an ordered collection of values. An array literal can be defined by enclosing\
    \ comma-separated values in square brackets,\n\n```\nlet ary = [\"cat\", \"dog\"\
    , \"mouse\"];\n```\n\nCommas can be used either between or after values, so the\
    \ above assignment is exactly equivalent to:\n\n```\nlet ary = [\"cat\", \"dog\"\
    , \"mouse\", ];\n```\n\nThe last comma, is sometimes called a *trailing comma*.\n\
    \nArray indexing is zero-based; the first element of the above array is `ary[]`\
    \ and the last is `ary.length - 1`.\n\nArrays of higher dimension can be created\
    \ simply by nesting array literals.\n\n```\nlet ary2d = [[11, 12], [21, 22]];\n\
    ```\n\nAfter the above assignment, ary2d[1] is `[21, 22]` and ary2d[0] is 21.\n\
    \nA less-often used form is `Array(values)`:\n\n```\nlet ary = new Array(\"cat\"\
    , \"dog\", \"mouse\");\n```\n\nThis form is not generally recommended. One odd\
    \ feature of it is if the argument is a single numeric value, `Array(n)`, the\
    \ result is a *sparse array* of *n* locations, *not an* array containing the single\
    \ value *n*.\n\nIn a sparse array, no storage is allocated for the elements of\
    \ the array until they have been assigned values; unassigned locations will appear\
    \ to have the value `undefined`. A sparse array can be arbitrarily large (only\
    \ the actual values in it contribute to its size), but it is slower to work with.\n\
    \nThe `length` property of an array is always one more than the largest index.\
    \ Since an array may be sparse, `length` is not necessarily a count.\n\n### 2.2.5\
    \ Sets\n\nA set is a collection of unique values. Operations are:\n\n- new Set(iter)\
    \ — Creates a new set from an iterable.\n- set.has(value) — Tests if value is\
    \ in the set.\n- set.add(value) — Adds value to set and returns the set itself.\n\
    - set.delete(value) — Removes value from set. Returns true if value existed, false\
    \ otherwise.\n- set.clear() — Removes all values from set.\n- set.size — Returns\
    \ the number of elements in set.\n\n### 2.2.6 Maps\n\nMaps are lookup tables.\
    \ Operations are:\n\n- new Map() — Creates a new, empty map.\n- new Map(iterable)\
    \ — Creates a map from an iterable. \n- map.has(key) — Tests if map contains key.\n\
    - map.set(key, value) — Sets the value associated with key and returns the map.\n\
    - map.get(key) — Returns value associated with key, or undefined if key is not\
    \ in map.\n- map.delete(key) — Removes key from map. Returns true if map was changed,\
    \ false otherwise.\n- map.clear() — Removes all values from map.\n- map.size —\
    \ Returns the number of key-value pairs.\n\n### 2.2.7 Dates\n\nJavaScript has\
    \ a Date object, which can be created in any of the following ways:\n\n- new Date()\
    \ — Returns the current date and time in the browser’s time zone.\n- new Date(ms)\
    \ — Returns the date that corresponds to the number of milliseconds since “epoch”\
    \ (January 1, 1970).\n- new Date(year, month, day, hours, minutes, seconds) —\
    \ Up to five arguments may be omitted from the right end.\n- new Date(string)\
    \ — Converts string into a Date, if possible, and returns it.\n\nTo access specific\
    \ components of a Date object, use the following methods:\n\n- date.getFullYear()\
    \ and date.setFullYear(year) — date.setFullYear may also be given month and day\
    \ arguments.\n- date.getMonth() and date.setMonth(n), where n is 0 (January) to\
    \ 11 (December).\n- date.getDate() and date.setDate(n), where n is 1 to 31.\n\
    - date.getHours() and date.setHours(n), where n is 0 to 23.\n- date.getMinutes()\
    \ and date.setMinutes(n), where n is 0 to 59.\n- date.getSeconds() and date.setSeconds(n),\
    \ where n is 0 to 59.\n"
