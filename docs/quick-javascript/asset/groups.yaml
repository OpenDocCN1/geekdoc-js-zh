    # 作者


    我是 David Matuszek，大多数学生都称我为“Dave 博士”。


    1963年我在打孔卡上写了第一个程序，并立刻迷上了其中。


    1970年，我作为德克萨斯大学奥斯汀分区的计算机科学研究生，教了我的第一门计算机课。我最终在那里获得了博士学位，从那以后一直教学。诚然，我在行业工作了十多年，即使那时也担任维拉尼亚大学的兼职教师。


    我终于离开了行业，在维拉尼亚大学工作了几年，然后搬到宾夕法尼亚大学，在那里我为其他学科进入计算机科学的学生指导了一个硕士项目（MCIT，计算机与技术硕士）。


    在我的职业生涯中，我的主要兴趣是人工智能（AI）和编程语言。我用过很多编程语言。


    我在2017年退休了，但我无法停止教学，所以我正在编写一系列关于编程和编程语言的“快速上手”书籍。我还写过两部科幻小说，《冰骑手》（Ice Jockey）和《真实价值》（All
    True Value），预计还会写更多。去看看它们吧！


