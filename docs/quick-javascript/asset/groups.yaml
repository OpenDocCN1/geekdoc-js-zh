    ### 4.4.10 其他输入控件


    除了按钮、文本、提交和密码之外，`<input>` 标签的 `type` 属性还可以取许多值。请记住，对于`<input>`，所有所需信息都在起始标签中；不需要使用结束标签
    `</input>`。


    这些控件中的许多项都没有向用户指示它们的用途，因此它们应该始终带有一个标签（label），最好是带有一个包含 `for` 属性的标签。


    - radio 控件 `<input type="radio" id="id" name="group" value="value">` 定义了一个单选框。单选框总是成组使用的，每个单选框的
    `name` 属性具有相同的值。选取组中的一个单选框会取消该组内所有框的选中。


    - 在表单中，`group.value` 是被选中单选框的值。如果不在表单中，必须单独检查单选框。


    - 如果没有选择任何单选框，该组的值为空字符串。若要默认选中一个按钮，请给它加上 `checked` 标记。


    - checkbox 控件 `<input type="checkbox" id="id">` 显示为一个一个小正方形，可以选中或取消选中，且与其他任何复选框无关。复选框的
    `checked` 属性（而不是 `value` 属性）为真或假。


    - file 控件 `<input type="file">` 显示一个包含“选择文件”字字的矩形。点击它时会弹出文件选择器。所选的文件可以通过字段的 `value`
    属性访问。如果控件包含 `multiple` 标记，可以选择多个文件。


    - image 控件 `<input type="image" src="path">` 显示指定的图像。


    ## 客户端 JavaScript 125


    - color — `<input type="color">` 控件显示一个包含颜色的的小矩形（默认为黑色）。点击它会弹出颜色选择器。`value` 属性设置初始颜色，其格式必须为
    #RRGGBB（六个十六进制数字表示红、绿、蓝的量）。


    - `<input type="hidden">` 控件用户不可见，也无法进行修改。


    - 当在系列页面中与服务器交互时，服务器可以从一个页面收集信息，并将其存储为下一个页面中隐藏控件的属性。通过这种方式，服务器可以在一系列事务中为给用户维护信息。


    - 隐藏字段不是安全设备。页面的底层 HTML（包括隐藏字段）可以在任何浏览器中查看。


    - `<input type="range">` 显示一个滑块，用于在给定范围内选择数字。默认属性为 `min="0"`、`max="100"`、`step="1"`
    和 `value="50"`。


    每个复选框和单选框紧邻右侧都有一个关联的标签。复选框和单选框较小且难以点击，因此每个都应该有一个带有 `for="id"` 属性的标签。


    - `<label for="id">text</label>` — 点击标签等同于点击其属性指定的 id 控件。


    ## 4.4.11 事件


    用户操作（输入内容、移动鼠标、点击鼠标等）会导致事件的发生。当某些事件发生时，将执行一个或多个事件处理器。


    每个表单元素（“控件”）都可以拥有可以作为事件处理器的属性。例如，一个按钮可以定义如下：


    ```html

    <input type="button" onclick="save()" value="Save">

    ```


    `onclick` 是一个事件处理器，告诉 JavaScript 应该做什么；在这种情况下，当点击按钮时调用 `save()` 函数。事件处理器通常应该实现为函数调用。


    会发生许多事件，并且并不是每个控件都能响应每个事件。不同的浏览器在表单元素将处理哪些事件方面有所不同。本节描述了这些事件以及哪些表单元素能够处理它们。


    事件名称有时以驼峰命名法编写，例如用 `onClick` 而不是 `onclick`。这之所以有效是因为 HTML 标签是不区分大小大小的，但在带引号的 JavaScript
    中，它是区分大小大小的。


    以下事件可以在 `<body>` 或 `<frame>` 元素中处理（帧是作为页面一部分加载的独立 URL 文件）：


    - onload — 文档或帧已完成加载。可以用于执行函数以进行任何初始化工作。


    - onunload — 文档或帧被卸载。这可以用于执行任何最后的清理工作。


    以下事件可以被大多数元素处理。


    - onclick — 元素被点击。按钮几乎总是会处理 onclick 事件。大多数其他控件会自动处理给定类型控件的所有常规操作。


    ## 客户端 JavaScript 127


    - ondblclick — 元素被连续点击两次。

    - onmousedown — 鼠标悬停在控件上时按下鼠标键之一（或键盘等）。要区分按下的是哪个鼠标键，请使用 `onmousedown` 而不是 `onclick`。`event.button`
    的值对于左键、中键和右键分别为 0、1 或 2。

    - onmouseup — 鼠标悬停在控件上时释放鼠标键。此事件通常被忽略，转而处理 onclick 事件。

    - onmouseover — 鼠标移动到控件上。

    - onmouseout — 鼠标移出控件。

    - onmousemove — 鼠标移动。


    现代设备可能带有触摸屏或手笔。上述 `onmouse` 事件可以用指针事件代替，指针事件在鼠标和触摸上效果同样良好。


    以下事件可以被 `<body>` 和 `<textarea>` 处理：


    - onkeypress — 控件获得焦点时按了按键。

    - onkeydown — 控件获得焦点时按下了按键。

    - onkeyup — 控件获得焦点时松开了按键。

    - onfocus — 控件获得焦点。

    - onblur — 控件失去焦点。

    - onchange — 控件的值改变并失去焦点。


    ## 128 快速 JavaScript


    客户端 JavaScript


    ### 4.4.12 冒泡


    当事件在元素上发生时，该元素既可以处理它，也可以忽略它。无论何种情况，元素的父元素都会获得机会处理该事件，然后是父元素的父，依此类推，一直直到根（全局对象）。这个过程被称为冒泡，通常是理想的。


    例如，如果按钮被点击，且该按钮在一个表单中，表单在文档中，而文档在窗口中，那么这些元素中的任何或所有元素都可以对按钮点击做出响应。


    - `event.target` 是嵌套最深的元素，也是第一个有机会响应的元素。

    - `event.currentTarget` 是当前正在处理事件的元素（它等于 `this`）。

    - `event.stopPropagation()` 停止任何进一步的冒泡。通常建议这样做。

    - `event.preventDefault()` 防止默认操作的发生，例如表单提交或跟随链接。


    例如，以下代码显示了一个按钮，点击时会向 `console.log` 写入消息：


    ```html

    <input type="button" value="Wow!" id="bait" onclick="console.log(event.type +
    event.target.id)">

    ```


    ## 4.5 使用 DOM


    ### 4.5.1 Window 对象


    很容易认为 document 是 HTML 树的根。在浏览器中，document 实际上是另一个节点 `window` 的子。没有必要说 `window.document`，因为默认假设为
    `window`。


