    # Quick JavaScript


    - date.getMilliseconds() and date.setMilliseconds(n), where n is 0 to 999.

    - date.getTime() and date.setTime(n), where n is milliseconds since epoch.

    - Date.now() also returns milliseconds since epoch but shorter than new Date.getTime().

    - date.getDay() returns 0 to 6, where 0 means Sunday (regardless of where you
    are, and despite ISO 8601 specification having Monday as the first day of the
    week).


    Internally, Dates are kept as milliseconds since epoch. This makes arithmetic
    on dates very easy because the arguments to the various methods are not limited
    to the same ranges as the get methods. For example,


    ```javascript

    let date = new Date();

    let day_of_month = date.getDate();

    date.setDate(day_of_month + 100);

    ```


    sets date to a Date exactly 100 days in the future, with the correct month and
    year.


    ## 2.2.8 Regular Expressions


    A regular expression, or regexp, defines a pattern to be applied to a string,
    to determine whether the pattern matches the string, or to search the string for
    substrings that match.


    Regular expressions are largely standardized, so all the most idiosyncratic patterns
    can be used in JavaScript. In this section, we assume a knowledge of regular expressions
    and only describe how to use them in JavaScript. For the reader unfamiliar with
    regular expressions, there is a brief discussion in Appendix D.


    A regular expression is written inside forward slashes, /[a-z]+/gi is the regular
    expression [a-z]+ with the global (g) and case-insensitive (i) flags. [a-z]+ will
    match any sequence of lowercase letters.


    Parentheses are used to group parts of the regular expression. Groups are numbered
    left to right, starting with 1; an easy way to find the number of a group is to
    count only the left (opening) parentheses. Group 0 is the entire matched part.
    For example, the pattern


    ```javascript

    a = "Call 1-800-555-1212 today!"

    b = "1-800-(\\d\\d)-(\\d\\d)"

    // 0 1 2

    c = a.match(b)

    ```


    The results will be


    ```javascript

    c[0] = "1-800-555-1212"

    c[1] = "555-1212"

    c[2] = "555"

    c[3] = "1212"

    ```


    The following methods can be used to apply regular expressions:


    - string.search(regexp) — Returns the index of the start of the first substring
    in string that matches regexp, or null if match is found. If the global modifier
    g is present, it is ignored.

    - string.replace(regexp, replacement) — Searches string for regexp and, if found,
    replaces it with replacement. If the global modifier g is present, the method
    replaces all occurrences of regexp with replacement.

    - If regexp contains parenthesized groups, then replacement may use $1 to represent
    the first group matched, $2 to represent the second group matched, and so on.

    - string.match(regexp) — Searches string for regexp and returns an array.

    - If the g flag is set, match returns array of matched substrings, or null if
    no matches are found.

    - If the g flag is not set, match returns an array whose first element is the
    (first) matched substring and whose remaining elements, if any, are substrings
    matched by each parenthesized group in regex. See the example at the beginning
    of this section.

    - string.matchAll(pattern) — With the g flag, matchAll returns an iterator for
    the substrings of string that matches pattern. This makes it convenient for use
    with a for/of loop.

    - string.split(regexp) — Returns an array of substrings of string, where each
    occurrence of regexp separates the strings in string.


    The following are methods of regexp rather than string.


    - regexp.exec(string) — Searches string for regexp and remembers its position
    in string.

    - This method is designed to be used in a loop. If the g flag is set, each call
    of exec will return the next matching substring, or null when no more remain.
    After a null is returned, the regex is reset and can be used again.

    - If the g flag is not set, exec behaves like match without the g flag set.

    - regexp.test(string) — Returns true if regexp matches somewhere in string, and
    null otherwise. The g flag is handled the same way that it is for exec.


    ## 2.3 IDENTIFIERS


    Identifiers consist of letters, digits, underscores, and/or dollar signs; the
    first character may not be a digit.


    By convention, variable and function names begin with a lowercase letter, while
    class names begin with a capital. The usual convention is to use "camel case"
    for multiword names, such as newUser. Constants are often written in all capital
    letters.


    Keywords (if, true, class, etc.) cannot be used as identifiers.


    ## 2.4 LET AND CONST


    JavaScript variables are untyped: Any variable can hold any type of value.


    Variables are declared with the keyword let, along with an optional initial value;
    for example, let x or let x = 5. More than one variable can be declared in a let
    statement, for example,


    ```javascript

    let x = 5, y = 3;

    ```


    Constants are declared with the keyword const and cannot be reassigned.


    ```javascript

    const PI = 3.14159;

    ```


    ## 2.5 VAR


    var is the older way to declare variables. Unlike let and const, variables declared
    with var are function-scoped rather than block-scoped. This can lead to unexpected
    behavior.


    ## 2.6 OPERATORS


    Here are the most common operators on numbers:


    - + add

    - subtract or unary minus

    * multiply

    / divide, giving a floating-point result

    - % remainder (modulus)

    - ** exponentiation


    Common operators on booleans:


    - && and

    - || or

    - ! not


    Comparison operators, giving a boolean result:


    - < less than

    - <= less than or equal to

    - == equal to

    - === strictly equal (equal and same type)

    - != not equal

    - !== strictly unequal (different types or values)

    - >= greater than or equal to

    - > greater than


    String concatenation:


    - + concatenate (join together) two strings, or a string and any other value.


    Assignment:


    - = assignment operator—can be used as an expression; the value of the expression
    is the value that is assigned.


    The ternary operator: In the expression *test ? valueTrue : valueFalse*, the *test*
    determines which of the two succeeding values are used.

