    # 4.5.2 The Document Object


    A document represents an HTML page.


    The name window refers to the window displaying the HTML; window.document refers
    to the HTML in that (or more accurately, the tree of Nodes representing HTML).
    Document properties and methods must be prefixed by document..


    The constructor new Document() will return a new HTML page, complete with an empty
    head and body.


