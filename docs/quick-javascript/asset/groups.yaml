    \ {\n  n = this.start;\n  while (n < this.end) {\n    yield n;\n    n += this.step;\n\
    \  }\n}\n```\n\n并对其进行测试：\n\n```javascript\nfor (let e of range) {\n  console.log(e);\n\
    }\n```\n\n这得出了正确的值 10，15 和 20。\n\n注意 `this` 单词的使用。正如前面提到的，当 `this` 在方法中（属于对象的函数）中使用时，它指的是包含该方法的对象。\n\
    \n## JavaScript: 详细细节 85\n\n在上面，迭代器被添加到了一个现有对象中。它也可以在创建对象时添加。\n\n```javascript\n\
