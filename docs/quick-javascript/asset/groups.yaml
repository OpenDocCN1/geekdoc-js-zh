    # 基础知识\n\n本章和第 3 章将 JavaScript 简单地描述为语言，不涉及 Web 编程。它分为两个大部分：\n\n基础知识（The Bare\
    \ Minimum）——此部分旨在让你尽可能地开始 JavaScript 编程。最好的方法是在边做边尝试。\n\n详细介绍（In More Detail）——这部分再次介绍了相同的内容，并填补了许多空白。在某种程度上，它也可以作为参考。\n\
    \n## 2.1 注释 (COMMENTS)\n\n```\n// 引入一个延伸到行尾的注释。\n```\n\n多行注释以 /* 开始，以 */ 结束。\n\
    \n在注释内部，// 和 /* 没有特殊含义（因此你不能“嵌套”注释）。在引号内的字符串或正则表达式中，// 和 /* 不会开始注释。\n\nDOI: 10.12011/9781003359609-2\n\
    \n## 2.2 数据类型 (DATA TYPES)\n\n### 2.2.1 原始类型 (Primitives)\n\n共有八种数据类型：\n\n- 数字（number）可以带有小数点写入，但所有数字都存储为双精度浮点数。\n\
    - 大整数（bigint）是具有任意长度的整数。\n- 两个布尔值写为 true 和 false。\n- 字符串（string）可以用单引号、双引号或反引号（'）括起来。没有“字符”类型。\n\
    - 符号（symbol）是一个保证唯一的值；没有其他值等于它。符号通过调用 `Symbol()` 或 `Symbol(name)` 创建，其中 name 是一个（不一定唯一的）值，可能对调试有所帮助。\n\
    - 未定义类型（undefined）有一个值 `undefined`。它是已声明但尚未赋值的变量的值。\n- 空类型（null）有一个值 `null`，意味着该值不存在。\n\
    - 对象（object）是任何更复杂的数据类型。函数、数组、集合、映射、正则表达式、错误和日期都是特殊类型的对象，用户定义的对象也是如此。\n\n值的类型可以通过\
    \ `typeof` 来确定，它可以既作为运算符 `typeof x` 使用，也可以作为函数 `typeof(x)` 使用。它将以字符串形式返回上述类型名称之一（例如，\"\
    number\"）。\n\n上述内容有两个例外。\n\n- `typeof(null)` 的值 \"object\"。这通常被认为是语言设计中的一个错误。\n\
    \n对于函数以外的任何类型的对象，`typeof` 将返回 \"object\"。应用于函数时，`typeof` 将返回 \"function\"。\n\n\
    ### 2.2.2 用户定义对象 (User-Defined Objects)\n\n对象是命名值的集合，称为其属性。你可以通过在大括号内放入属性:值 对来定义对象，稍后使用\
    \ `object.property` 语法引用这些值。例如：\n\n```\nlet friend = { givenName: \"Anna\",\n\
    \  sname: \"Lang\" };\nalert(\"Hello, \" + friend.givenName);\n```\n\n如果属性名存储在变量中或可以计算，则可以通过\
    \ `object[expression]` 语法访问，例如 `friend[\"given\"] + \"Name\"`。\n\n对象中的 `test`\
    \ 属性（其中属性以字符串形式给出）仅当且仅当对象拥有该属性时才会返回 true。请求不存在的属性将得到值 `undefined`。\n\n### 2.2.3\
    \ 内置对象类型 (Built-In Object Types)\n\nJavaScript 带有许多内置或预定义的对象类型。这些数组（arrays）、集合（sets）、映射（maps）、日期（dates）和正则表达式（regular\
    \ expressions）。\n\n### 2.2.4 数组 (Arrays)\n\n数组是值的有序集合。数组字面量可以通过在方括号内包含用逗号分隔的值来定义：\n\
    \n```\nlet ary = [\"cat\", \"dog\", \"mouse\"];\n```\n\n逗号可以用于值之间或值之后，因此上述赋值完全等于：\n\
    \n```\nlet ary = [\"cat\", \"dog\", \"mouse\", ];\n```\n\n最后一个逗号有时被称为*尾随逗号*（trailing\
    \ comma）。\n\n数组索引从 0 开始；上述数组的第一个元素是 `ary[0]`，最后一个是 `ary.length - 1`。\n\n高维数组可以通过简单嵌套数组字面量来创建。\n\
    \n```\nlet ary2d = [[11, 12], [21, 22]];\n```\n\n在上述赋值后，`ary2d[1]` 是 `[21, 22]`，`ary2d[0]`\
    \ 是 21。\n\n另一种不常用的形式是 `Array(values)`：\n\n```\nlet ary = new Array(\"cat\", \"\
    dog\", \"mouse\");\n```\n\n这种形式通常不被推荐。它的一个奇特性是，如果参数是单个数值值 `Array(n)`，结果是一个包含 *n*\
    \ 个位置的*稀疏数组*，*而不是*包含单个值 *n* 的数组。\n\n在稀疏数组中，在元素被赋值之前，不会为数组元素分配存储；未赋值的位置将显示为值 `undefined`。稀疏数组可以是任意大的（只有其中的实际值贡献于其大小），但处理起来较慢。\n\
    \n数组的 `length` 属性始终比最大索引大。由于数组可能是稀疏的，`length` 不一定是计数。\n\n### 2.2.5 集合 (Sets)\n\
    \n集合是唯一值的集合。操作有：\n\n- `new Set(iter)` — 从可迭代对象创建一个新集合。\n- `set.has(value)` — 测试值是否在集合中。\n\
    - `set.add(value)` — 将值添加到集合并返回集合本身。\n- `set.delete(value)` — 从集合中删除值。如果值存在则返回\
    \ true，否则返回 false。\n- `set.clear()` — 集合中的所有值。\n- `set.size` — 返回集合中的数量。\n\n###\
    \ 2.2.6 映射 (Maps)\n\n映射是查找表。操作有：\n\n- `new Map()` — 创建空映射。\n- `new Map(iterable)`\
    \ — 从可迭代对象创建一个映射。\n- `map.has(key)` — 测试映射是否包含键。\n- `map.set(key, value)` — 设置键关联的值并返回映射。\n\
    - `map.get(key)` — 返回键关联的值，如果键不在映射中则返回 undefined。\n- `map.delete(key)` — 从映射中删除键。如果映射发生变化则返回\
    \ true，否则返回 false。\n- `map.clear()` — 映射中的所有值。\n- `map.size` — 返回键值对的数量。\n\n###\
    \ 2.2.7 日期 (Dates)\n\nJavaScript 有一个 Date 对象，可以通过以下任何方式创建：\n\n- `new Date()` —\
    \ 返回浏览器时区的当前日期和时间。\n- `new Date(ms)` — 返回对应于纪元（1970年1月1日）毫秒数的日期。\n- `new Date(year,\
    \ month, day, hours, minutes, seconds)` — 可以从右侧省略五个参数。\n- `new Date(string)` —\
    \ 如果可能，将字符串转换为 Date 并返回。\n\n要访问 Date 对象的特定组件，使用以下方法：\n\n- `date.getFullYear()`\
    \ 和 `date.setFullYear(year)` — `date.setFullYear` 也可以给出月份和日期参数。\n- `date.getMonth()`\
    \ 和 `date.setMonth(n)`，其中 n 为 0（1月）到 11（12月）。\n- `date.getDate()` 和 `date.setDate(n)`，其中\
    \ n 为 1 到 31。\n- `date.getHours()` 和 `date.setHours(n)`，其中 n 为 0 到 23。\n- `date.getMinutes()`\
    \ 和 `date.setMinutes(n)`，其中 n 为 0 到 59。\n- `date.getSeconds()` 和 `date.setSeconds(n)`，其中\
    \ n 为 0 到 59。\n\n"
