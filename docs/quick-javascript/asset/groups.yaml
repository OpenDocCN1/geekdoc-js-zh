    \n## 3.11.10 Classes and Inheritance\n\n### 3.11.10.1 Classes\n\nA class describes\
    \ a category of objects. It is a blueprint, or recipe, for making objects of that\
    \ type. Classes are a relatively new addition to JavaScript, and are always in\
    \ strict mode. Classes are based on prototypes, and provide little if any advantage\
    \ over just using prototypes.\n\nHere is the template for a class:\n\n```javascript\n\
    class ClassName {\nfields;\nconstructor(arguments) {\ncode\n}\nset name(value)\
    \ {\nthis.someOtherName = value;\n}\nget name() {\nreturn this.someOtherName;\n\
    }\n```\n\n```javascript\nmethodName(arguments) {\n}\n}\n```\n\n**Reminder:** In\
    \ a method (a function belonging to an object), this refers to the containing\
