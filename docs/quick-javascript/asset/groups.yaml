    \ A simple example is computing the factorial function:\n\n```javascript\nlet\
    \ factorial = function(n) {\n  if (n == 0) return 1;\n  return n * factorial(n\
    \ - 1);\n};\n```\n\nThis example uses a named function literal. With this definition,\
    \ the name f can be used only within the function definition, while the name factorial\
    \ can be used both inside and outside the function.\n\n# JavaScript: In More Detail\
    \ ■ 79\n\nFunction properties are often a good alternative to global variables.\
    \ For example,\n\n```javascript\nnextInt.counter = 0;\nfunction nextInt() {\n\
    \  nextInt.counter += 1;\n  return nextInt.counter;\n}\n```\n\nThe first call\
    \ to nextInt will return 1, the second will return 2, and so on because the function\
    \ changes the value of its counter property. Also, note that functions are hoisted\
    \ (processed first), the assignment to a function property can occur lexically\
    \ before the function definition.\n\n## 3.10.5 Function Methods\n\nA method is\
    \ a function that belongs to an object. But functions themselves are objects,\
    \ and have methods. Consider:\n\n```javascript\nlet car = { make: \"Subaru\",\
    \ year: 2018,\nage(now) { return now - this.year; } }; \nlet fn = car.age;\n```\n\
    \nAt this point fn is the function, specifically the function age() {return year\
    \ - this.year}. It is no longer attached to an object, therefore it is no longer\
    \ a method. Unfortunately, it still refers to this, which has lost its attachment\
    \ to the original object.\n\nThere are three methods that can solve the problem\
    \ with this.\n\n- f.call(obj, arg1, ..., argN) — Calls the function or method\
    \ f with the given arguments, using obj as the value of this. If no object is\
    \ required, obj may be null.\n- fn.call(car, 2021) — Returns 3. Note that the\
    \ function fn can be applied to any object with a year property.\n\n# 80 ■ Quick\
    \ JavaScript\n\n- f.apply(obj, args) — Does the same as call, but expects an array\
    \ of arguments.\n- fn.apply(car, [2021]) — Returns 3.\n- let g = f.bind(obj, arg1,\
    \ ..., argN) — Returns a new function g that uses obj as the value of this, and\
    \ with the first N arguments filled.\n- let g = fn.bind(car) — Assigns to g a\
    \ function that expects an argument for the year parameter.\n- let h = bind(car,\
    \ 2021) — Assigns to h a function that expects no arguments and returns 3.\n\n\
    ## 3.10.6 Closures\n\nSuppose one function is defined inside another; call them\
    \ the “outer function” and the “inner function.” The outer function forms the\
    \ environment of the inner function, so the inner function can use the local variables\
    \ of the outer function. If the outer function returns, all its local variables\
    \ will (normally) be recycled.\n\nBut what if the inner function continues to\
    \ exist after the outer function vanishes? That can happen—the (previously) inner\
    \ function could be stored in a variable.\n"
  mdcn: "\n# JavaScript: 详细细节 ■ 77\n\n点号（dots）也可以反过来使用，放在函数的参数中。当在函数调用中放在数组之前时，数组中的值会被拆分成独立的参数。这对于接收任意数量参数的非常有用。\n\
    \n```javascript\nlet ary = [2, 7, 1, 3];\nlet m = Math.max(...ary);\n```\n\n像这样使用时，点号被称为展开（spread）。展开也可以应用于集合（set）和映射（map）。\n\
    \n展开可以用于创建数组的浅拷贝。\n\n```javascript\nlet ary2 = [...ary];\n```\n\n## 3.10.3 函数是数据\n\
    \n函数名后面如果没有跟着参数列表，则指的是函数本身。函数可以赋值给变量：\n\n```javascript\nfunction square(x) {\n\
    \  return x * x;\n}\n```\n\n```javascript\nlet square2 = square;\nlet result =\
    \ square2(5); // 25\n```\n\n```javascript\nlet myArray = new Array();\nmyArray[10]\
    \ = square;\nresult = myArray[10](7); // 49\n```\n\n函数可以被打印。调用 `square.toString()`\
    \ 将返回该函数的列表，就像它上面显示的那样。\n\n函数可以赋值给属性。赋值给属性的函数被称为方法（method）。在方法内部，`this` 指向调用，即持有该属性的对象。\n\
    \n函数可以作为参数传递给另一个函数：\n\n```javascript\nmyArray.sort(function(a,b) { return a -\
    \ b });\n```\n\n在这个示例中，`sort` 方法使用该函数来决定如何比较 `myArray` 的元素。\n\n## 3.10.4 函数是对象\n\
    \n函数是对象，而对象拥有属性。\n\n函数的 `length` 属性是定义中参数的数量。剩余参数（rest parameter，以 `...` 开头的参数）不包含在内。\n\
    \n函数的 `name` 属性自然是它的名字。JavaScript 在确定函数方面非常聪明。例如，给定定义：\n\n```javascript\nlet square\
    \ = (x) => x * x;\n```\n\n该函数被定义为一个匿名字面量函数，但赋值给变量 `square` 足以让 JavaScript 决定该函数名为\
    \ \"square\"。\n\n函数可以是递归的；也就是说它们可以调用自己。一个简单的例子是计算阶乘函数：\n\n```javascript\nlet factorial\
    \ = function(n) {\n  if (n == 0) return 1;\n  return n * factorial(n - 1);\n};\n\
    ```\n\n这个示例使用了具名函数字面量。使用此定义，名字 `f` 只能在函数定义内部使用，而名字 `factorial` 可以在函数内部外部使用。\n\n\
    # JavaScript: 详细细节 ■ 79\n\n函数属性通常是全局变量良好的替代方案。例如：\n\n```javascript\nnextInt.counter\
    \ = 0;\nfunction nextInt() {\n  nextInt.counter += 1;\n  return nextInt.counter;\n\
    }\n```\n\n第一次调用 `nextInt` 将返回 1，第二次返回 2，依此类推，因为函数改变了其计数器属性的值。另外，注意函数是提升的（先被处理），对函数属性的赋值可以在词法作用上发生在函数定义之前。\n\
    \n## 3.10.5 函数方法\n\n方法是属于对象的函数。但函数本身也是对象，并且拥有方法。考虑：\n\n```javascript\nlet car\
    \ = { make: \"Subaru\", year: 2018,\nage(now) { return now - this.year; } };\n\
    let fn = car.age;\n```\n\n此时 `fn` 是该函数，具体来说是函数 `age() {return year - this.year}`。它不再附加到对象上，因此它不再是一个方法。不幸的是，它仍然引用\
    \ `this`，而 `this` 已经失去了与原始对象的关联。\n\n有三种方法可以解决这个问题：\n\n- f.call(obj, arg1, ...,\
    \ argN) — 使用指定的参数调用函数或方法 f，并将 obj 为 `this` 的值。如果不需要对象，`obj` 可以为 `null`。\n- fn.call(car,\
    \ 2021) — 返回 3。注意函数 `fn` 可以应用于任何具有 `year` 属性的对象。\n\n# 80 ■ 快速 JavaScript\n\n-\
    \ f.apply(obj, args) — 与 `call` 相同，但期望接收一个参数数组。\n- fn.apply(car, [2021]) — 返回\
    \ 3。\n- let g = f.bind(obj, arg1, ..., argN) — 返回一个新函数 `g`，它使用 `obj` 作为 `this`\
    \ 的值，并填充了前 N 个参数。\n- let g = fn.bind(car) — 赋值给 `g` 一个期望 `year` 参数的函数。\n- let\
    \ h = bind(car, 2021) — 赋值给 `h` 一个不需要参数并返回 3 的函数。\n\n## 3.10.6 闭包\n\n假设一个函数定义在另一个函数内部；将它们称为“外部函数”和“内部函数”。外部函数构成了内部函数的环境，因此内部函数可以使用外部函数的局部变量。如果外部函数返回，所有的局部变量将（通常）被回收。\n\
    \n但如果内部函数在外部函数消失后继续存在呢？这可能发生——（之前的）内部函数可以存储在变量中。\n\n```javascript\nfunction makeCounter()\
    \ {\n  let count = 0;\n  return function inner() {\n    count++;\n    return count;\n\
    \  };\n}\nlet counter = makeCounter();\ncounter(); // 1\ncounter(); // 2\n```\n"
