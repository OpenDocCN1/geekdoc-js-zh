    \ JavaScript 特有语句分开描述的。\n\n注意 1：`if` 语句控制的是单个语句执行。\n注意 2：`switch` 语句允许每个 case\
    \ 指定一个表达式。\n\n以下是与其相同的语句列表：\n\n- `variable = expression;`\n- `expression;`\n-\
    \ `{ statements }`\n- `if (condition) {`\n    `statements`\n`}`\n- `if (condition)\
    \ {`\n    `statements`\n`} else {`\n    `statements`\n`}`\n- `while (condition)\
    \ {`\n    `statements`\n`}`\n- `for (initialization; condition; update) {`\n \
    \   `statements`\n`}`\n- `do {`\n    `statements`\n`} while (condition)`\n\n-\
    \ `switch (expression) {`\n  `case expression:`\n    `statements;`\n    `break;`\n\
    \  `case expression:`\n    `statements;`\n    `break;`\n  `...`\n  `default:`\n\
    \    `statements;`\n`}`\n\n- `label: statement;`\n- `break;`\n- `break label;`\n\
    - `continue;`\n- `continue label;`\n- `return value;`\n- `return;`\n- `//` //\
    \ 空语句\n\n#### 2.9.4.1 赋值语句\n\n赋值语句给变量一个值。例如，`x = 5;` 给 `x` 赋值 5。\n\n变量的值可以被改变。例如，赋值语句\
    \ `x = \"abc\";` 将给 `x` 赋值 \"abc\"。\n\n对于每个算术运算符 `op`，表达式 `variable op= expression`\
    \ 是 `variable = op expression` 的简写；例如，`x += 1;` 为 `x` 加 1。\n\n#### 2.9.4.2 表达式\n\
    \n任何表达式都可以作为语句使用；表达式的值会被丢弃。\n\n允许作为语句是因为它们可以副作用。例如，如果 `a` 是一个数组，`a.sort()` 会对数组排序。\n\
    \n返回结果但没有副作用的表达式可以作为语句，但它们没有任何作用。例如，作为语句使用 `2+2` 是合法的但没用的。\n\n#### 2.9.4.3 复合语句\n\
    \n复合语句（或块）是若干（可能为零）声明和语句，括在大括号 `{}` 中。复合语句本身被视为语句。\n\n控制语句（如 `if` 语句和循环）控制单个语句的执行。如果你想控制的不只是一个语句，必须将这些语句括在大括号中以使其成为（单一）复合语句。\n\
    \n函数或方法的主体必须是一个复合语句。异常：“箭头”函数，稍后讨论。\n\n良好的风格要求块内的语句相对于块的起始进行缩进。JavaScript 的通常缩进是两个空格。\n\
    \n"
