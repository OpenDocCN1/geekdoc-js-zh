    \ then read its value entry.\n\n```\n<input id='tx1' type=\"text\">\n<br>\n<input\
    \ type=\"button\"\nvalue=\"Look in text field\"\nonclick=\"alert('You entered:\
    \ ' + \ndocument.getElementById('tx1').value\">\n```\n\nThis works as you might\
    \ expect. Enter something in the text field, click the button, and it shows up\
    \ in an alert message.\n\nIn general, widgets should do nothing more complicated\
    \ than call a single function. The above code can be written more cleanly by putting\
    \ the function in the head of the document:\n\n```\n<script>\nfunction searchText(id)\
    \ {\n  var field = document.getElementById(id);\n  alert('You entered: ' + field.value);\n\
    }\n</script>\n```\n\nThe handler for the button can then be written as a simple\
    \ function call.\n\n```\n<input type=\"button\" value=\"Look in text field\"\n\
    onclick=\"searchText('tx1')\">\n```\n\n# 4.4.6 Buttons and Forms\n\nA common use\
    \ for JavaScript is to send information to a server. Usually there is more than\
    \ one piece of information: name, address, credit card number, and so on. To collect\
    \ multiple pieces of information into a single submission, a form is used."
- md: "\n# 118 ■ Quick JavaScript\n\nform is a container, with start tag <form> and\
    \ end tag </form>. The purpose is to contain various widgets, such as buttons\
    \ and text fields, but any valid HTML can also be included. By default, enclosing\
    \ HTML in a <form> does not make any visible difference on the screen.\n\nWe have\
    \ already described the standard button type, using either <button> or <input\
    \ type=\"button\">. There are two button types particularly relevant to forms.\
    \ Each has an old version (with <input>) and a newer form (with <button>). For\
    \ comparison, we show all three kinds of buttons here. First, the old way:\n\n\
    ```\n<input type=\"button\" value=\"Click me\">\n<input type=\"submit\" value=\"\
    Send it\">\n<input type=\"reset\" value=\"Forget it\">\n```\n\nThen, the new way:\n\
    \n```\n<button type=\"button\">Click me</button>\n<button type=\"submit\">Send\
    \ it</button>\n<button type=\"reset\">Forget it</button>\n```\n\nThe old way puts\
    \ the text of the button in a value property, so it can only be the text. The\
    \ new way puts it between <button> and </button>, so it can be almost anything.\n\
    \n- When a \"plain\" button (type=\"button\") is clicked, no default action occurs.\n\
    - A submit button has the default text Submit, and the default action of sending\
    \ all the information on the enclosing form to the server. (More on this shortly.)\n\
    - A reset button has the default text Reset, and the default action of clearing\
    \ everything on the form to its original values. This action tends to annoy users.\n\
    \n# Client-Side JavaScript ■ 119\n\n**Note:** A button without an explicit type\
    \ attribute behaves like type=\"button\" *except in a form*, where it behaves\
    \ like type=\"submit\" button.\n\nOne very convenient feature of forms is that\
    \ they define a scope. Any widget within a form can have a name property, and\
    \ this name can be used by other widgets in the same form. example:\n\n```\n<form>\n\
    <input name='tx1' type=\"text\">\n<input type=\"button\"\n  value=\"Look in text\
    \ field\"\n  onclick=\"alert('You entered: ' + tx1.value)\">\n</form>\n```\n\n\
    An id must be unique on the entire HTML page and can be accessed by calling getElementById(id)\
    \ from within scripts; a name should be unique within a form, and can be accessed\
    \ directly by other widgets in the same form. Any widget can have a name and id.\n\
    \nThere is seldom any need for more than one form on a page, so it referenced\
    \ by document.getElementsByTagName(\"form\")[0], or by its id if it has one. It\
    \ is possible to have more than one form on a page, but forms may not be nested;\
    \ is, you cannot have a form inside a form.\n\nA submit button within a form will,\
    \ when clicked, submit that form. Outside a form, a submit button can use the\
    \ attribute form=\"formId\" to submit the form with that id.\n\n**Caution:** If\
    \ a form has a submit button, pressing Enter in an input field of the form will\
    \ also submit the form.\n\n# Quick JavaScript\n\n## 4.4.7 Form Verification\n\n\
    When a user clicks a Submit button, it usually makes sense to check the information\
    \ in the form before sending it to the server. Not everything can be checked,\
    \ of course, but many things can. Have any required fields left blank? Are there\
    \ unexpected characters in numeric fields? Does a credit card number have the\
    \ right number of digits?\n\nIf a tag <input type=\"text\" ...> contains the attribute\
    \ required (with no value, just the word required), attempting to submit that\
    \ form will cause the text field to be checked to make sure it is not blank. If\
    \ it is blank, a small pop-up will appear next to the text field containing the\
    \ words \"Please fill in this\".\n\nA text field may have an attribute pattern=\"\
    regex to specify by a regular expression regex exactly what may be entered into\
    \ the text field; it will be checked when the Submit button is clicked. An erroneous\
    \ entry will be flagged with \"Please match the requested format.\" The regex\
    \ is given as a string, not bounded by slashes.\n\nA text field may have a placeholder=\"\
    text\" attribute; the text is displayed as a hint to the user about what should\
    \ be entered. The text will disappear when the user types into the field but appears\
    \ if the field becomes blank again.\n\nOne way to do arbitrary validation testing\
    \ is to put an onSubmit property in the <form> tag, with a value that has the\
    \ syntax return function_call(); for example,\n\n```\n<form onSubmit=\"return\
    \ validate()\">\nType a number:\n<input name='num' type=\"text\">\n<br>\n<input\
    \ type=\"submit\">\n</form>\n```\n\nIn this example, the function validate() will\
    \ be called when the submit button is clicked. If validation fails, the function\
    \ should call event.preventDefault(), otherwise the submission will occur. Either\
    \ way, it is appropriate to inform the user.\n\n## 4.4.8 Form Submission\n\nWhen\
    \ a form is submitted, the action attribute of the form tag tells the program\
    \ where to send the data, and the method attribute tells how to send the data.\n\
    \nA form tag may contain action=\"URL\" (Uniform Resource Locator) specifying\
    \ the URL to which the information is to be sent. If the action property is not\
    \ present, the URL of the page containing the form is used.\n\nThe most commonly\
    \ used values of the method attribute are \"get\" and \"post\".\n\n### 4.4.8.1\
    \ Get Requests\n\nA get request, <form method=\"get\"> is used to fetch data.\
    \ The data is appended to the URL, so it is visible in the browser history and\
    \ bookmarks. The amount of data is also limited by the maximum length of a URL.\n\
    \n### 4.4.8.2 Post Requests\n\nA post request, <form method=\"post\"> is used\
    \ to send data. The data is sent in the body of the request, so it is not visible\
    \ in the browser history or bookmarks. The amount of data is not limited by URL\
    \ length.\n\n### 4.4.8.3 Other Requests\n\nThere are a few other method types,\
    \ such as file which is used to upload files to the server.\n\n## 4.4.9 Additional\
    \ Text Widgets\n\nA number of other widgets besides <input type=\"text\"> allow\
    \ text input. All of the following except textarea are written as <input type=\"\
    .\n\n- password — All characters in the password field are displayed as bullets.\
    \ This difference affects only what the user sees; entered text is recorded and\
    \ can be accessed.\n- search — This is like <input type=\"text\"> but has a small\
    \ icon in the right end that can be clicked to select previous entries in the\
    \ field.\n- email — A text field in which an email address can be entered. The\
    \ entry is automatically checked (when submitted) to ensure that it contains the\
    \ @ character. If the widget contains the multiple flag, more than one email address\
    \ can be entered, separated by commas.\n- number — A text field in which an integer\
    \ can be entered. It is provided with up and down arrows for adding or subtracting\
    \ from the displayed number. If the value attribute is provided, it is used as\
    \ the initial number displayed.\n- URL — A text field in which a URL can be entered.\
    \ The field is automatically checked (when submitted) to ensure that the entry\
    \ is a syntactically correct URL.\n- textarea — <textarea name=\"name\" rows=\"\
    nrows\" cols=\"ncols\"> widget provides a multiline text-entry area, consisting\
    \ of nrows rows and wide enough to display ncols characters. A closing tag </textarea>\
    \ is required. Text between the opening and closing tags (the innerHTML) is what\
    \ is initially displayed in the text area. Text in the text area will be displayed\
    \ in a monospace font. If the name attribute is omitted, the data in the text\
    \ area will not be included when the form is submitted.\n\nAdditional input widgets\
    \ are available for choosing dates and times, but these are not yet supported\
    \ on all browsers.\n\n- date — For choosing a calendar date.\n- time — For choosing\
    \ a time of day.\n- datetime-local — For choosing a date and time.\n- week — For\
    \ choosing a week.\n"
  mdcn: "\n\n# 118 ■ 快速 JavaScript\n\nform 是一个容器，具有起始标签 `<form>` 和结束标签 `</form>`。其目的是包含各种小部件（widgets），例如按钮和文本字段，也可以包含任何有效的\
    \ HTML。默认情况下，将 HTML 封装在 `<form>` 中不会在屏幕上产生任何可见的差异。\n\n我们已经描述了标准的按钮类型，即使用 `<button>`\
    \ 或 `<input type=\"button\">`。有两种按钮类型与表单特别相关。每种类型都有一个旧版本（使用 `<input>`）和一个新版本（使用\
    \ `<button>`）。为了对比，我们在这里展示了所有三种类型的按钮。首先是旧方法：\n\n```\n<input type=\"button\" value=\"\
    Click me\">\n<input type=\"submit\" value=\"Send it\">\n<input type=\"reset\"\
    \ value=\"Forget it\">\n```\n\n然后，是新方法：\n\n```\n<button type=\"button\">Click\
    \ me</button>\n<button type=\"submit\">Send it</button>\n<button type=\"reset\"\
    >Forget it</button>\n```\n\n旧方法将按钮的文本放在 `value` 属性中，因此它只能是文本。新方法将其放在 `<button>`\
    \ 和 `</button>` 之间，因此它几乎可以是任何内容。\n\n- 当点击“普通”按钮（type=\"button\"）时，不会发生默认动作。\n\
    - 提交按钮（submit button）具有默认文本 Submit，其默认动作是将封装表单上的所有信息发送到服务器。（稍后将详细介绍。）\n- 重置按钮（reset\
    \ button）具有默认文本 Reset，其默认动作是将表单上的所有内容重置为原始值。此操作往往会让用户感到反感。\n\n# 客户端 JavaScript\
    \ ■ 119\n\n**注意：** 没有显式 type 属性的按钮行为类似于 `type=\"button\"`，*在表单内除外*，在表单内它的行为类似于\
    \ `type=\"submit\"` 按钮。\n\n表单的一个非常方便的功能是它们定义了一个范围。表单内的任何小部件都可以有一个 `name` 属性，这个名称可以被同一个表单中的其他小部件使用。例如：\n\
    \n```\n<form>\n<input name='tx1' type=\"text\">\n<input type=\"button\"\n  value=\"\
    Look in text field\"\n  onclick=\"alert('You entered: ' + tx1.value)\">\n</form>\n\
    ```\n\n`id` 在整个 HTML 页面上必须唯一的，可以通过在脚本中调用 `getElementById(id)` 来访问；`name` 在一个表单内应该是唯一的，并且可以通过同一个表单中的其他小部件直接访问。任何小部件都可以拥有\
    \ `name` 和 `id`。\n\n页面上很少需要多个表单，因此可以通过 `document.getElementsByTagName(\"form\"\
    )[0]` 引用它，或者如果有 id 的话通过其 id 引用。页面上可以有多个表单，但表单不能嵌套；也就是说，你不能在一个表单内部嵌套另一个表单。\n\n\
    表单内的提交按钮在点击时会提交该表单。在表单外部，提交按钮可以使用 `form=\"formId\"` 属性来提交该 id 的表单。\n\n**注意：**\
    \ 如果表单有一个提交按钮，在表单的输入字段中按回车也会提交表单。\n\n# 快速 JavaScript\n\n## 4.4.7 表单验证\n\n当用户点击提交按钮时，在将信息发送到服务器之前检查表单中的信息通常是有意义的。当然，不是所有内容都可以被检查，但很多内容是可以的。是否有必填字段被留空了？数字字段中是否有意外字符？信用卡号的位数是否正确？\n\
    \n如果标签 `<input type=\"text\" ...>` 包含 `required` 属性（没有值，只有 `required`get词），尝试提交该表单将会检查该文本字段以确保它不是空的。如果它是空的，文本字段旁边会弹出一个小弹出框，其中包含“Please\
    \ fill in this（请填写此内容）”字。\n\n文本字段可以有一个 `pattern=\"regex\"` 属性，用正则表达式 `regex` 来精确指定可以输入到文本字段的内容；它会在点击提交按钮时进行检查。错误的输入将被标记为“Please\
    \ match the requested format.（请匹配请求的格式。）”。正则表达式是以字符串形式给出的，不受斜杠限制。\n\n文本字段可以有一个\
    \ `placeholder=\"text\"` 属性；该文本将作为提示显示给用户应该输入什么。当用户在字段中输入时，该文本会消失，但如果字段再次为空，它就会显示。\n\
    \n进行任意验证测试的一种方法是在 `<form>` 标签中放置一个 `onSubmit` 属性，其值具有 `return function_call();`\
    \ 的语法，例如：\n\n```\n<form onSubmit=\"return validate()\">\nType a number:\n<input\
    \ name='num' type=\"text\">\n<br>\n<input type=\"submit\">\n</form>\n```\n\n在这个示例中，点击提交按钮时将调用函数\
    \ `validate()`。如果验证失败，函数应该调用 `event.preventDefault()`，否则将发生提交。无论哪种方式告知用户都是合适的。\n\
    \n## 4.4.8 表单提交\n\n当表单被提交时，表单标签的 `action` 属性告诉程序将数据发送到哪里，而 `method` 属性告诉如何发送数据。\n\
    \n`<form>` 标签可能包含 `action=\"URL\"`（统一资源定位符），指定要发送信息的 URL。如果 `action` 属性，则使用包含表单的页面\
    \ URL。\n\n`method` 属性最常用的值是 \"get\" 和 \"post\"。\n\n### 4.4.8.1 Get 请求\n\nget 请求，`<form\
    \ method=\"get\">` 用于获取数据。数据会被附加到 URL 中，因此在浏览器历史记录和书签中可见。数据量也受到 URL 最大长度的限制。\n\
    \n### 4.4.8.2 Post 请求\n\npost 请求，`<form method=\"post\">` 用于发送数据。数据在请求体中发送，因此不会出现在浏览器历史记录或书签中。数据量不受\
    \ URL 长度限制。\n\n### 4.4.8.3 其他请求\n\n还有其他方法类型，例如 `file`，用于向服务器上传文件。\n\n## 4.4.9\
    \ 其他文本小部件\n\n除了 `<input type=\"text\">` 之外，许多其他小部件允许文本输入。除了 textarea 之外，以下都写为：\n\
    \n- password — 密码字段中的所有字符都以圆点显示。这种区别只影响用户看到的；输入的文本会被记录并可以访问。\n- search — 这类似于\
    \ `<input type=\"text\">`，但在右端有一个图标，点击它可以选择字段中的条目。\n- email — 可以输入电子邮件地址的文本字段。在提交时会自动进行检查以确保它包含\
    \ @ 字符。如果小部件包含 `multiple` 标记，可以用逗号分隔输入多个电子邮件地址。\n- number — 可以输入整数的文本字段。它提供了向上下的箭头来增加或减少显示的数字。如果提供了\
    \ `value` 属性，它将用作初始显示的数字。\n- URL — 可以输入 URL 的文本字段。在提交时会自动进行检查以确保输入是语法正确的 URL。\n\
    - textarea — `<textarea name=\"name\" rows=\"nrows\" cols=\"ncols\">` 小部件提供了一个多行输入区域，由\
    \ nrows 行和足够显示 ncols 个字符的宽度组成。需要结束标签 `</textarea>`。起始结束标签之间的文本（innerHTML）是初始显示在文本区域的内容。文本区域中的文本将以等宽字体显示。如果省略了\
    \ `name` 属性，在提交表单时文本区域的数据将不会被包含在内。\n\n"
