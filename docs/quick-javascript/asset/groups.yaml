    \ `globalThis` 来引用全局对象。\n\n## 3.11.7 高阶函数 (Higher-Order Functions)\n\n高阶函数/方法是一个期望接收函数作为参数之一的函数或方法。数组有很多高阶方法。将用作参数的函数直接在方法调用中使用箭头符号进行定义是常见的做法。在本节中，我们提供了几个示例；更完整的列表在附录\
