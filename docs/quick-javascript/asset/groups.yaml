    that do not belong in an integer, such as a decimal point.

    * `parseFloat(string)`—Converts the initial characters of `string` into a number,
    if possible, otherwise returns NaN. parseFloat ignores any following characters
    that do not belong in a number.

    * `variable.toFixed(d)`—Converts the number in `variable` to a string with `d`
    digits after the decimal point.

    * `variable.toString(base)`—Converts the number in `variable` to a string representation
    of that number in the given base (2 to 36).


    For both `toFixed` and `toString`, if a literal is used in place of the `variable`,
    two dots are required—one as part of the number, the second to indicate a method
    call (for example, `123..123.0.toString(8)`).'
