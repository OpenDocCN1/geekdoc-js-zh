    # Client-Side JavaScript ■ 121


    In this example, the function validate() will be called when the submit button
    is clicked. If validation fails, the function should call event.preventDefault(),
    otherwise the submission will occur. Either way, it is appropriate to inform the
    user.


    # 4.4.8 Form Submission


    When a form is submitted, the action attribute of the form tag tells the program
    where to send the data, and the method attribute tells how to send the data.


    A form tag may contain action="URL" (Uniform Resource Locator) specifying the
    URL to which the information is to be sent. If the action property is not present,
    the URL of the page containing the form is used.


    The most commonly used values of the method attribute are "get" and "post".


    # 4.4.8.1 Get Requests


    A get request, <form method="get"> is a simple request for information. It should
    not be used when sending the data might change something on the server. For example,
    it should never be used to place orders.


    The form data is appended to the URL with the syntax ?name=value&name=value&...,
    for example, google.com/search?q=octopus. Because the information is visible in
    the URL and can remain in the browser history, a get request should never be used
    for sensitive information.


    If the method attribute is omitted, it defaults to get.


    URLs are limited to 2048 ASCII (not Unicode) characters, so this limits the amount
    of data that can be submitted. For larger amounts of information, post must be
    used.


    Get requests can be bookmarked.'
