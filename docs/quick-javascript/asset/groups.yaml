    \n```javascript\nlet newObj = Object.assign({}, oldObj);\n```\n\n`Object.assign`\
    \ 方法接收作为第一个参数的空对象 `{}`，并将第二个参数的所有属性复制到其中，返回结果。\n\nJavaScript: 详细细节 89\n\n`Object.create()`\
    \ 方法使用一个现有对象作为原型。新创建的对象没有它自己的属性；它是“透明的”，这意味着任何读取其属性的尝试都会“透视”它\n\n```javascript\n\
