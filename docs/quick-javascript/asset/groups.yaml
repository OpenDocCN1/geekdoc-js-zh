    \ will return oldObj, but there is also an older way to access the prototype.__proto__.\
    \ non-enumerable __proto__ property should not be used in new code.\n\nSomething\
    \ similar happens with classes.\n\n```javascript\nclass Person {...}\nclass Customer\
