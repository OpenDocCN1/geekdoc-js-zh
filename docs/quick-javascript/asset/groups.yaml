    ```


    A symbol is a unique identifier; it cannot be confused with any other identifier.
    Two symbols created with the same description are still different from each other.


    Objects have properties, and those properties can be modified or added to. Suppose
    you have an object that you did not created—it may be a built-in object, or from
    someone else’s code—and you want to add a property to it. The property is strictly
    for your own use; its existence should not affect anyone’s code. The solution
    is to use a symbol as the property name.


    Alternatively, suppose you have an object, and you want to add meta-information
    to the object—that is, information that is about the object, but isn’t part of
    the object. Again, use a symbol as the property name.


    Here is a short map of distances from the sun for various planets:


