    \n```javascript\nPerson.prototype.initial = function() {\n  return this.name[0];\n\
    }\n```\n\nThe method initial will return the first character of a person’s name\
    \ (assuming that Person has a name property).\n\n## 3.12 TRANSPSPILERS AND POLYFILLS\n\
    \nJavaScript evolves and (hopefully) gets better. Unfortunately, older browsers\
    \ may not support some of the newest features. In order for JavaScript code to\
    \ work “everywhere,” there are two different approaches that may be taken:\n\n\
    - 1. Use only well-established features that work everywhere.\n- 2. Use transpilers\
    \ or polyfills.\n\nA transpiler “compiles” newer syntactic features, such as the\
    \ ?? operator, into older or equivalent syntax. Babel is a well-known transpiler.\n\
    \nA polyfill is a function or a library of functions that may or may not be currently\
    \ included. A missing function can be added directly to the code. A library of\
    \ polyfills may be loaded from a polyfill server, although this increases load\
    \ time. There is more controversy about which polyfill library to use, if, but\
    \ polyfill.io is reasonably popular.\n\n## 3.13 JSON\n\nJSON (JavaScript Object\
    \ Notation) is a way of representing data as text. This is useful for storing\
    \ the data on a file, or transmitting it to or from a server. JSON is human-readable\
    \ and editable; it is quite similar to data in JavaScript.\n\nThere are two methods:\n\
    \n- JSON.stringify(value)—Converts a JavaScript value to a JSON string.\n- JSON.parse(string)—Converts\
    \ a JSON string to a JSON object.\n\nBoth JSON methods can be given additional\
    \ parameters, not described here, to modify values as they are processed.\n\n\
    Limitations:\n\n- Functions, symbols, undefined, Infinity, and NaN cannot be represented\
    \ in JSON. They are replaced by null.\n- Dates are converted to strings, and not\
    \ automatically converted back into Dates.\n- Non-enumerable properties, and properties\
    \ whose key is a symbol, are ignored.\n\nAny object can be given a toJSON() method\
    \ if the default representation is not satisfactory.\n\n## Client-Side\n\nAny\
    \ object can be given a toJSON() method if the default representation is not satisfactory.\n\
    \n## ESSENTIAL HTML\n\nAny object can be given a toJSON() method if the default\
    \ representation is not satisfactory.\n\n## 4.2 ADDING JAVCRIPT TO HTML\n\nJavaScript\
    \ can be added to an HTML page by:\n\n- Putting the JavaScript within <script>...</script>\
    \ tags, in either the head or the body.\n- Putting the JavaScript in a separate\
    \ file that has a .js extension, and loading it with <script src=\"URL.js\"></script>\
    \ in the head. In this case, any code within the <script> tags will be ignored.\n\
    - Writing the JavaScript as the value of an HTML “event handler” attribute.\n\n\
    ## 4.3 DOM OVERVIEW\n\nThe HTML DOM (Document Object Model) represents everything\
    \ on the HTML page as a tree of Nodes, even the HTML comments and every bit of\
    \ whitespace. Everything in the DOM is accessible to JavaScript and can be changed,\
    \ and every change made by JavaScript is reflected immediately in the page as\
    \ shown to the user. This is far more power than needed for most applications.\n"
