    # 快速编程系列


    # 快速 JavaScript


    ![](img/dceb5f233df6e2a0608a4b2bf2dfa341_0_0.png)


    # David Matuszek


    CRC Press

    Taylor & Francis Group

    CHAPMAN & HALL 出书


    # 快速 JavaScript


    你是一个想要快速上手 JavaScript 和 HTML DOM 的资深程序员吗？这本书就是是为你准备的。


    你需要关于 JavaScript 和/或 HTML DOM 的百科全书级知识吗？这本书不适合你。


    你是一个想要学习编程的初学者吗？这本书不适合你。事实上，这门语言也不适合你。去买一本写好的 Python 书吧。


    本书将让你以最快的速度学会 JavaScript 编程。此外，它将让你对文档对象模型（DOM）有一个基本的理解，这是表示网页的巨大数据结构。有了这些工具，你将能够构建交互式网页。


    如果你使用 C++ 或 Java 编程，你可以跳过书中的某些部分，因为 JavaScript 的语句是完全相同的。这些部分已有明确标记。


    JavaScript 是浏览器使用的语言——*唯一*的语言。要创建交互式网页，你需要同时了解 JavaScript 和 DOM。本书将带你入门。


