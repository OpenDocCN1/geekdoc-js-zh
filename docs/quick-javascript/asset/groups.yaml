    ## 2.2.8 正则表达式


    正则表达式（或 regexp）定义了一个应用于字符串的模式，用于确定该模式是否匹配字符串，或者在字符串中搜索匹配模式的子字符串。


    正则表达式在很大程度上是标准化的，因此所有最独特的模式都可以在 JavaScript 中使用。在本节，我们假设读者具备正则表达式的知识，仅描述如何在 JavaScript
    中使用它们。对于不熟悉正则表达式的读者，附录 D 有简短讨论。


    正则表达式写在正斜杠之间，`/[a-z]+/gi` 是带有全局 (g) 和不区分大小写 (i) 标志的正则表达式 `[a-z]+`。`[a-z]+` 将匹配任何小写字母序列。


    括号用于对正则表达式的部分分组。组从左到右编号，从 1 开始；找到组编号的简单方法是只计算左（左）括号的数量。组 0 是整个匹配部分。例如，该模式


    ```javascript

    a = "Call 1-800-555-1212 today!"

    b = "1-800-(\\d\\d)-(\\d\\d)"

    // 0 1 2

    c = a.match(b)

    ```


    结果将是：


    ```javascript

    c[0] = "1-800-555-1212"

    c[1] = "555-1212"

    c[2] = "555"

    c[3] = "1212"

    ```


    可以使用以下方法来应用正则表达式：


    - string.search(regexp) — 返回字符串中第一个匹配 `regexp` 的子字符串的索引，如果没有找到匹配则返回 null。如果存在全局修饰符
    g，则会被忽略。

    - string.replace(regexp, replacement) — 在字符串中搜索 `regexp`，如果找到，将其替换为 `replacement`。如果存在全局修饰符
    g，该方法将所有所有的 `regexp` 替换为 `replacement`。

    - 如果 `regexp` 包含括号组，则 `replacement` 可以使用 $1 表示第一个匹配的组，$2 表示第二个匹配的组，依此类推。

    - string.match(regexp) — 在字符串中搜索 `regexp` 并返回一个数组。

    - 如果设置了 g 标志，`match` 返回匹配的子字符串数组，如果没有找到匹配项则返回 null。

    - 如果未设置 g 标志，`match` 返回一个数组，其第一个元素是（第一个）匹配的子字符串，其余元素（如果有的话）是正则中每个括号组匹配的子字符串。参见本节开头的示例。

    - string.matchAll(pattern) — 带有 g 标志时，`matchAll` 返回一个匹配 `pattern` 的字符串子字符串的迭代器。这便于与
    `for/of` 循环使用。

    - string.split(regexp) — 返回字符串的子字符串数组，其中 `regexp` 的每次出现都会分割字符串中的字符串。


    以下是 `regexp` 的方法，而不是 `string` 的。


    - regexp.exec(string) — 在字符串中搜索 `regexp` 并记住它在字符串中的位置。

    - 该方法设计用于循环中。如果设置了 g 标志，每次调用 `exec` 都会返回下一个匹配的子字符串，在没有更多剩余项时返回 null。返回 null 后，正则表达式将重置并可以再次使用。

    - 如果未设置 g 标志，`exec` 的行为类似于未设置 g 标志的 `match`。

    - regexp.test(string) — 如果 `regexp` 匹配字符串中的某处则返回 true，否则返回 null。g 标志的处理方式与 `exec`
    相同。


    ## 2.3 标识符


    标识符由字母、数字、下划线和/或美元符号组成；第一个字符不能是数字。


    按照惯例，变量和函数名以小写字母开头，而类名以大写字母开头。通常的惯例多单词名称使用“驼峰命名法”（camel case），例如 `newUser`。常量通常全大写写。


    关键字（if, true, class 等）不能作为标识符。


    ## 2.4 LET 和 CONST


    JavaScript 变量是无类型的：任何变量都可以持有任何类型的值。


    使用关键字 `let` 声明变量，并带有可选的初始值；例如 `let x` 或 `let x = 5`。在一个 `let` 语句中可以声明多个变量，例如


    ```javascript

    let x = 5, y = 3;

    ```


    常量使用关键字 `const` 声明且不能重新赋值。


    ```javascript

    const PI = 3.14159;

    ```


    ## 2.5 VAR


    `var` 是声明变量的旧方法。与 `let` 和 `const` 不同，用 `var` 声明的变量是函数作用域而非块作用域。这可能会导致意外的行为。


