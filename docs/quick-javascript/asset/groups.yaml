    \n```javascript\nfor (let e in sun_dist) {\n  console.log(e = \" \" + sun_dist[e]);\n\
    }\n```\n\nwill print\nVenus = 108.2\nEarth = 149.6\nMars = 227.9\n\nWhen a string\
    \ is needed, for example for printing, JavaScript will automatically convert almost\
