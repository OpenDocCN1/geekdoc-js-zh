    # Appendix D: Regular Expressions ■ 159


    Table A.1 (Continued)


    | Expression | Meaning | Examples | Explanation |

    | --- | --- | --- | --- |

    | X$ | X at the end of the string | [\\.\?!$] | Ends with a period, question mark
    or exclamation point (the $ itself matches the empty string) |

    | \b | The empty string between a word character (\w) and a nonword character
    (\W) | \C\b | The word C, as in the language |

    | \B | An empty string that is not between a word character (\w) and a nonword
    character | un\B | The initial part of the words unhealthy, undulate, etc. |

    | (?=pat) | Look ahead make sure that the pattern pat will match next, but not
    count it in the matched part | \w+(?= ) | A word, provided it is followed by a
    space |

    | (!pat) | Look ahead make sure that the pattern pat will not match | \w+(?! )
    | A word, provided it is not followed by a hyphen |

    | (X) | Group the expression X into a single unit, and remember it matches | (\\/\*)
    | A //-style comment (keep for later reference) |

    | (:X) | Group the expression X into a single unit, but do not remember it matches
    | (:\\/\*) | A //-style comment (discard it) |


    Do not include extra spaces in regular expressions! A space is a literal character
    and a space in a regular expression requires a space in the string being searched.'
  - '[PAGE 178]


    A character class represents any one of the set of characters. There are several
    predefined character classes:


    +   - \w A word character; same as [a-zA-Z0-9_]


    +   - \W A nonword character; same as [^a-zA-Z0-9_]


    +   - \s A whitespace character


    +   - \S A non-whitespace character


    +   - \d A digit; same as [0-9]


    +   - \D A nondigit; same as [^0-9]


    +   - (A period, not escaped) Any character except a line terminator


    Other character classes can be described by using brackets. For example, the character
    class [aeiouAEIOU] could be used to recognize vowels.


    A regular expression may be followed immediately by a flag. Two important flags
    are g for “global,” meaning “do it everywhere,” and i for “case insensitive.”'
