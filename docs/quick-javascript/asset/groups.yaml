    ` 的结果是 \"22\"。一元运算符 `+` 将尝试将其操作数转换为数字，所以 `2 + +\"2\"` 的结果是 4。\n\n在布尔上下文中任何值（如\
    \ `if` 语句的条件），如果它是 `false`、`undefined`、`null`、`NaN` 或空字符串，将被被视为 `false`。所有其他值（包括\
