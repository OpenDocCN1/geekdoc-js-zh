    \"Symbol(mkm)\",\n\nIf a symbol is defined with a description, that description\
    \ is saved in a field named description. For example,\n\n```javascript\nconsole.log(sym2.description);\n\
    ```\n\nwill print\n\"secret\",\n\n## 3.4.5 Arrays\n\nArrays in JavaScript do not\
    \ have a fixed size; elements may be added to or removed from either end of the\
    \ array.\n\n- array.push(elems)—Returns the new length of array after adding elems\
