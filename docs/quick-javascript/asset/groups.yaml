    # 3.7 GOOD OPERATORS


    An expression is any JavaScript code that results in a value. Expressions may
    be as simple as a single constant or single variable.


    Operators with higher precedence (indicated by larger numbers) are performed before
    those with lower precedence. For example, in the expression 2 * 3 + 4 * 5, the
    multiplications are done before the addition because multiplication has higher
    precedence than addition. A number of things not thought of as operators, for
    example parentheses and array indexing, also have precedence.


    When operators have equal precedence, their associativity (“left to right” or
    “right to left”) determines which operations are done first. For example, subtraction
    is left associative, so 10 - 5 - 3 (10 - 5) - 3 rather than 10 - (5 - 3). Almost
    binary operators (except exponentiation) are left associative; the assignment
    operators are right associative, so a = b = c + 5 means a = (b = c + 5) rather
    than (a = b) = c + 5.


    Parentheses can be used to override the above rules and specify an explicit order
    of evaluation. Parentheses are also used to show the order of evaluation when
    it might not be obvious.'
