  - "[PAGE 100]\n\n# 82 Quick JavaScript\n\n# 3.10.7 Generators\n\nA generator is\
    \ a special kind of function that remembers where it is in the function, and when\
    \ used again, resumes from where it left off. This is useful for producing a (possibly\
    \ infinite) sequence of values.\n\nTo define a generator:\n\n+   * Begin with\
    \ function* rather than function.\n* Use yield value instead of return value.\
    \ When yield is executed, it returns an object {value: value, done: false}.\n\
    * The next use of the generator will resume execution right after the yield statement.\n\
    * Using a return statement, or reaching the end of the function, will terminate\
    \ the generator; the value returned is the object {value: undefined, done: true}.\n\
    \nTo use a generator:\n\n+   * Call the function defined with function*. This\
    \ returns a generator object, not a value computed by the generator.\n* Use the\
    \ generator object in a for/of loop (not for/in, which will do nothing); or\n\
    * Call the generator's next() method as many times as desired. This returns an\
    \ object as described above.\n* A generator can only be used once. Once a generator\
    \ is done, it's done. You can always make a new one, though.\n\nAs an example,\
    \ we will write a very simple generator that takes an argument and repeatedly\
    \ cuts it in half, rounding down to the nearest integer, until 1 is returned.\n\
    \n```\nfunction* half(n) {\n  yield n;\n```"
