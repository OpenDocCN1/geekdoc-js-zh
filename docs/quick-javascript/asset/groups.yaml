    # JavaScript: In More Detail ■ 55


    Bigints and (ordinary) numbers cannot be mixed in an arithmetic expression, but
    bigints and numbers can be compared (using <, <=, etc.). To convert between the
    two types, use BigInt(number) and Number(bigint).


    A hexadecimal literal begins with 0x or 0X. An octal literal begins with 0o or
    00.


    In strict mode, it is illegal to write a number with a leading zero (e.g. 0123),
    except for zero itself. In nonstrict mode, some implementations will treat such
