    \ \"[object Object]”，但它确实存在。\n\n你可以通过定义一个同名的新方法来重写一个方法。例如，我们可能会为 `Person` 类添加以下方法：\n\
    \n```javascript\ntoString() {\n  return \"My name is \" + this.name;\n}\n```\n\
    \n注意：在大多数浏览器中，`console.log(obj)` 方法并不使用 `toString`；相反，它会打印对象的结构。如果这不是你想要的，你可以显式地调用\
    \ `toString`，或者简单地向参数拼接一个空字符串，`console.log(obj + \"\")`。\n\n字段也可以被重写。然而，`this`\
