    - element.hasAttribute(name) — Returns true if `element` has the given attribute.

    - element.getAttribute(name) — Returns the value of the named attribute. If the
    named attribute does not exist, the value returned is null or the empty string,
    depending on the browser.

    - element.setAttribute(name, value) — Adds or updates the value of the named attribute.

    - element.removeAttribute(name) — Removes an attribute from the element.


    An Attr is a Node that represents the attributes of HTML tag. It has name and
    value properties.


    A document is a node, but not an element; this results in some duplication of
    code within the DOM. The following methods are identical to methods of document,
    but search within the element rather than the entire document:


    - element.getElementsByTagName(tagName)

    - element.getElementsByClassName(className)

    - element.querySelector(selector)

    - element.querySelectorAll(selector)


