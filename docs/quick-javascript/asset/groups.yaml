    ## 136 ■ Quick JavaScript


    - document.getElementsByClassName(className) — Returns an HTMLCollection of all
    the Elements that have the property class="className".


    **Note:** The class attribute of an HTML tag is used to apply a named CSS style
    to the HTML element.


    - document.querySelector(selector) — Returns the first element within the document
    that is matched by the CSS selector. The selector is given as a string.


    - document.querySelectorAll(selector) — Returns all elements within the document
    that are matched by the CSS selector. The selector is given as a string.


    Some selectors are:


    - tagName — To select all elements with the given tagName.

    - #id — To select the specific element with the given id.

    - .className — To select all elements with the attribute class="className". Notice
    the initial period.

    - tagName.className — To select all elements that have the given tagName and also
    have the attribute class="className".

    - * — To select all elements.

    - selector1, selector2 — To select all elements of type selector1 and all elements
    of type selector2.

    - selector1 > selector2 — To select all elements of type selector2 that are children
    of elements selected by selector1.

    - selector1 selector2 — To select all elements of type selector2 that are descendants
    (children, children of children, etc.) of elements selected by selector1.

    - selector1 ~ tagName — To select all elements of type selector2 that are subsequent
    (later) siblings of selector1 elements.


    - selector1 + selector2 — To select each element of type selector2 that immediately
    follows (is the next sibling of) selector1 elements.


    Some properties are returned as an HTMLCollection (list) of the corresponding
    elements. Individual elements can be accessed with brackets or with the index
    function, for example, document.forms[] or document.forms.item(0).


    - document.embeds — A list of the <object> elements.

    - document.forms — A list of all the <form> elements.

    - document.images — A list of all the <img> elements.

    - document.links — A list of all the hyperlinks (the <a> and <area> elements that
    have an href attribute).

    - document.scripts — A list of all the <script> elements.


    ## 4.5.2.3 Creating Nodes


    You already met the document methods for finding nodes. Here are some methods
    for creating nodes.


    - document.createElement(tagName) — Returns a new Element with the given tagName.

    - document.createAttribute(name) — Returns a new attribute with the given name.
    A value can be assigned to it later.

    - document.createComment(text) — Returns a new comment node with the given text.


    ## 138 ■ Quick JavaScript


    - document.createTextNode(text) — Returns a new Text node with the given text.

    - node.cloneNode(deep) — Returns a copy of node; if deep is true, all ancestors
    (the complete subtree of node) is also copied.


    Once nodes are created, they can be added to the document with Node methods.


    ## 4.5.3 Node Objects


    As noted earlier, everything on an HTML page is represented in the DOM, and accessible
    from the variable named document. The Document class is a subclass of the Node
    class. Other subclasses of Node are CharacterData, Element, and Attr.


    The hierarchy is large and complex. Fortunately, it is usually sufficient to think
    of the DOM as a tree of Nodes, most of which are Elements. Most useful is document.body,
    which is the root of the entire <body> subtree.


    ## 4.5.3.1 Node Properties


    Here are some of the properties of a Node:


    - parentNode, firstName, nextSibling, previousSibling, and lastChild are read-only
    properties that allow movement from one Node to another.

    - ownerDocument — The Document to which the Node belongs.

    - nodeType is an integer denoting the type of node. There are 12 types; 1 for
    elements, 2 for attributes, 3 for text, 9 for documents, and several others.


    Client-Side JavaScript ■ 139


    - children — a live HTMLCollection of all the child nodes of this node which are
    Elements. Other node types are not included.

    - childNodes — a live NodeList of all the child nodes of this node, regardless
    of type.

