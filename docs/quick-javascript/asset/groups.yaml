    \n## 2.9 语句\n\nJavaScript 中的许多语句与 Java 中的语句几乎相同。为了方便 Java 程序员，这些语句是与 JavaScript\
    \ 特有的语句分开分开描述的。\n\n### 2.9.1 分号\n\n每个 JavaScript 语句都应该以分号结束。如果你习惯在 Java 或 C 语言之一中编程，请继续按照你习惯的方式使用分号。\n\
