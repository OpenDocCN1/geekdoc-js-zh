  - '[PAGE 58]


    The throw statement "throws" the exception to somewhere else, so as not to clutter
    the normal execution of the program with code to handle (hopefully rare) exceptional
    conditions. The purpose of the try/catch statement (described in Section 2.9.5.4)
    is to catch a throw exception.


    The throw statement has the syntax:


    ```

    throw expression;

    ```


    where expression can be any type, but is typically an error number, an error message,
    or (as is the case with predefined exceptions), an object with name and message
    properties.


    What happens to the thrown exception?


    +   - If an exception occurs in the try portion of a try-catch-finally statement,
    the catch part handles the exception.

    - Otherwise, if an exception occurs in a function, the function will return immediately
    to the point at which the function was called. Execution continues as if the exception
    was thrown at that point (which may involve returning up another level in a nest
    of function calls).

    - Otherwise, if an exception occurs in top-level code, or hasn''t been handled
    by the time the exception reaches the top level, it is up to the system to do
    something about it. In an IDE, the exception will be reported to the programmer.
    In a browser, the exception will probably be ignored.


    # 2.9.5.4 Try-catch-finally statement


    The try-catch-finally statement is used to separate error handling from code that
    handles the "normal" case. This statement works exactly like the corresponding
    statement in Java, but with two minor syntactic differences.'
  - "[PAGE 59]\n\n# JavaScript: The Bare Minimum ■ 41\n\n+   - The try-catch-finally\
    \ statement can have only one catch clause.\n- The (variable) after the word catch\
    \ does not have a declared type, and may be omitted.\n\nIn more detail, here is\
    \ the syntax:\n\n```\ntry {\n  statements\ncatch (variable) {\n  statements\n\
    }\nfinally {\n  statements\n}\n```\n\nEither the catch part or the finally part,\
    \ but not both, may be omitted.\n\nExecution is as follows:\n\n+   1. The code\
    \ in the try block is executed.\n  - If no exception occurs, the catch block is\
    \ skipped.\n  - If an exception occurs, control goes immediately to the catch\
    \ part. The optional variable holds a value supplied by the exception; it is a\
    \ local variable of the catch part.\n\n+   2. Whether or not an exception occurred,\
    \ the finally part is executed.\n\nFor example, the following code will put up\
    \ an alert box containing the words \"I am an exception\":\n\n```\ntry {\n  throw\
    \ \"I am an exception\";\n```"
- md: "\n```javascript\ncatch (v) {\n  alert(v);\n}\n```\n\nMany things that would\
