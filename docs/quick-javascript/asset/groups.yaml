    \ `next()` 方法定义为生成器，因为生成器是函数的一种类型，并且返回所需类型的值。\n\n作为一个示例，我们定义了一个范围对象：\n\n```javascript\n\
    let range = {start:10, step: 5, end: 25};\n```\n\n接下来，我们将其添加到这个迭代器中，它将产生 `start`、`start+step`\
