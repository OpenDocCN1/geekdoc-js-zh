    # # Appendix D: Regular Expressions


    Although each language may add its own flourishes, basic regular expressions are
    quite standardized across regular languages. Inside a regular expression there
    may be the following:


    +   * **Literals** are characters that stand for themselves. Examples include
    letters, digits, and whitespace characters. The regular expression/cat/will try
    to match an occurrence of the word “cat.”

    * **Metacharacters** are characters that have special meaning in a regular expression.
    The metacharacters are: \ | ( ) { ^ $ * + . ?

    * **Escaped characters** are characters that are preceded by a backslash in order
    to use them as literals rather than metacharacters or because they are difficult
    to represent otherwise. For example, the question mark has a special meaning in
    a regular expression so if you want it to mean just the literal character, you
    have to escape it:\?


    Table A.1 lists the metacharacters and their meanings.'
