    # # Appendix A: Array Methods


    Although negative array indices are not allowed, array methods can use negative
    numbers as indices, with -1 denoting the last location, -2 the next to last, and
    so on.


    +   * `Array.from(iter)` — Creates and returns an array of values from an iterable
