    \n## 3.11 对象\n\n### 3.11.1 对象的定义\n\nJavaScript 是一种面向对象的语言。\n\n在 JavaScript 中，你可以创建对象而无需先定义类。这一节是关于对象的；类将在稍后介绍。\n\
