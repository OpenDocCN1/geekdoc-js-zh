    # Introduction ■ 3


    on the other hand, want to see them and correct them. For this you need to open
    your browser’s console. A console will display error messages (among other things).


    To open the console:


    +   - In most browsers: Press F12.

    - In Safari (Macintosh): Go to Preferences: Advanced and check Show Develop menu
    in menu bar. Once this is done, use cmd-opt-C to show the console.


    Browser consoles have a number of features to assist in programming and debugging.
    These vary and take some time to learn; they are not covered in this book.


    # 1.4 RUNNING JAVASCRIPT


    There are several IDEs (Integrated Development Environments) that can be used
    for JavaScript. **Visual Studio Code** is perhaps the most popular; it is cross-platform
    and free. (Don''t confuse this with **Visual Studio**, which is neither cross-platform
    nor free.) **NetBeans** or **Eclipse** (with a suitable plugin) are other popular
    IDEs.


    Some editors can be configured to run JavaScript on command. This can be a convenient
    way to run JavaScript programs that consist of a single file. **Sublime Text**
    (cross-platform) and **Notepad++** (Windows and Linux) are examples.


    Yet another alternative is to use an online JavaScript editor. a search for “JavaScript
    online” will find several of these: jsfiddle net is one I have used extensively.
    They differ in features, but most will display both output and console. Since
    they run in a browser, JavaScript code written there has limited ability to do
    file I/O.


    Finally, all the major browsers have a “developer mode” so that code can be written
