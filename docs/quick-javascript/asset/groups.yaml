    # 116 ■ Quick JavaScript


    There are two commonly used types of collection in the DOM. The getElementsByTagName
    method returns a live HTMLCollection of elements, while the childNodes property
    of a node is a live NodeList of nodes.


    Both types of collection have a length property, and both can be indexed by an
    array or (redundantly) by the item(index) method. The fact that these are “live”
    means they can be thought of as a window into the DOM, rather than a snapshot.
    The DOM tree is changed, for instance by insertion or deletion of nodes, the contents
    and length of these collections change correspondingly. All HTMLCollections are
    live, but some NodeLists are static—they don’t change as the DOM tree changes.


    The method Array.from(collection) returns a static array of values from the collection.


    # 4.4.5 Text Fields


    A text field is a passive element. Clicking on it or entering text into it should
    not cause anything to happen. Later actions, such as button clicks, can access
    and use the text that was entered.


    > Note: Technically, any element can be made active. You can put an onclick property
    in a text field, and it will work; but there is almost no situation in which this
    would be a good idea.


    For text-fields, there isn’t a <text> tag, just a variation of the <input> tag.


    ```

    <input type="text" size="12" value="Initial text">

    ```


    The size attribute is a measure of how many characters can be displayed in the
    text field; it defaults to 20. Any number of characters can be entered into a
    text field, regardless of how many are displayed at a time.'
