    # # Appendix C: String Methods


    Here are some of the more important methods on strings. Strings are immutable
    (cannot be modified), hence all string methods return a new string.


    +   - string.charAt(n) — Returns the nth character of a string. Same as string[n].


    +   - string.charCodeAt(n) — Returns the numeric Unicode value of the nth character
    of a string.


    +   - string0.concat(string1, ..., stringN) — Returns the concatenation (joining)
    of all the given strings.


    +   - string.fromCharCode(cL, ..., cN) — Creates a string from the numeric Unicode
    values.


    +   - string.includes(substr) — returns true if substr occurs as a substring of
    string, otherwise false.


    +   - string.includes(substr, start) — returns true if substr occurs as a substring
    of string starting at or after start, otherwise false.'
