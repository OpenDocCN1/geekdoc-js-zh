  - '[PAGE 45]


    # JavaScript: The Bare Minimum ■ 27


    is shorthand for


    variable = variable op expression;


    For example, x += 1; adds 1 to x.


    # 2.9.4.2 Expressions


    Any expression can be used as a statement; the value of the expression, if any,
    is discarded.


    Expressions are allowed to act as statements because they can have side effects.
    For example, if a is an array, a.sort() sorts the array.


    Expressions that return a result but do not have side effects can be used as statements,
    but they don''t do anything. For example, using 2+2 as a statement is legal but
    useless.


    This can lead to errors. If str is the string "Hello", the expression str.toUpperCase()
    returns the string "HELLO", and this can be assigned to a variable, but using
    str.toUpperCase() as a statement does nothing.


    # 2.9.4.3 Compound Statements


    A compound statement, or block, is some number (possibly zero) of declarations
    and statements, enclosed in braces, {}. A compound statement itself is considered
    to be a statement.


    Control statements, such as if statements and loops, control the execution of
    a single statement. If you want to control more than just one statement, you must
    enclose those statements in braces to make them into a (single) compound statement.


    The body of a function or method must always be a compound statement. Exception:
    “arrow” functions, to be discussed later.


    Good style dictates that statements within a block are indented relative to the
    start of the block. The usual indentation for JavaScript is two spaces.'
- md: "\n## 28 Quick JavaScript\n\n### 2.9.4.4 If Statements\n\nAn if statement tests\
    \ a condition. If the condition is true, the following statement (typically, a\
    \ compound statement) is executed. If the condition is not true, the if statement\
    \ does nothing. The syntax is:\n\n```\nif (condition) {\n  statements\n}\n```\n\
    \nFor example, the following if statement resets x to zero if it has become negative.\n\
    \n```\nif (x < 0) {\n  x = 0;\n}\n```\n\nAn if statement may also have an else\
    \ clause. If the condition is true, the statement following the condition is executed.\
    \ If the condition is not true, the statement following the word else is executed.\
    \ Both statements are typically compound statements. The syntax is:\n\n```\nif\
    \ (condition) {\n  some statements\n} else {\n  some other statements\n}\n```\n\
    \nFor example,\n\n```\nif (x % 2 == 0) {\n  x = x / 2;\n} else {\n  x = 3 * x\
    \ + 1;\n}\n```\n\nIf either part contains only a single (non-compound) statement,\
    \ the braces may be omitted. In this case, it is good style to put the single\
    \ statement on the same line as the if or the else.\n\n```\nif (x % 2 == 0) x\
    \ = x / 2;\nelse x = 3 * x + 1;\n```\n\n### 2.9.4.5 While Loops\n\nA while loop\
    \ is a loop with the test at the top. The syntax is:\n\n```\nwhile (condition)\
    \ {\n  statements\n}\n```\n\nFirst, the condition is tested; if it is false, nothing\
    \ more is done, and the loop exits without ever executing the statements. If the\
    \ condition is true, the statements are executed, then the entire loop (starting\
    \ with the test) is executed again.\n\nFor example, the approximate common log\
    \ (that is, log base ten) of a number x can be computed by:\n\n```\nlet log =\
    \ 0;\nwhile (x > 1) {\n  x = x / 10;\n  log = log + 1;\n}\n```\n\nThe braces indicate\
    \ a block of statements. If there is only one statement, the braces may be omitted;\
    \ however, it is good style to always include the braces.\n\nNormally, the statements\
    \ controlled by the loop must affect the condition being tested. In the above\
    \ example, x is compared to 1, and the controlled statements change the value\
    \ of x. If the controlled statements never make the condition false, then the\
    \ loop never exits, and the program “hangs” (stops responding). This is a kind\
    \ of error commonly, if inaccurately, called an infinite loop.\n\nTwo additional\
    \ statement types, break and continue, can also control the behavior of while\
    \ loops. These statements can be used with statement labels.\n\n### 2.9.4.6 Do-While\
    \ Loops\n\nA **do-while loop** is a loop with the test at the bottom, rather than\
    \ the usual test at the top. The syntax is:\n\n```\ndo {\n  statements\n} while\
    \ (condition);\n```\n\nFirst, the **statements** are executed, then the **condition**\
    \ is tested; if it is true, the entire loop is executed again. The loop exits\
    \ when the **condition** gives a false result.\n\nThis kind of loop is most often\
    \ used when the test doesn't make any sense until the loop body has been executed\
    \ at least once. For most purposes, the while loop is preferable.\n\nFor example,\
    \ suppose you want to choose a random number between 0 and 1000 that is divisible\
    \ by 7. You cannot test the number after you have chosen it, so do-while is appropriate.\n\
    \n```\nlet x;\ndo {\n  x = Math.round(1000 * Math.random());\n} while (x % 7 !=\
    \ 0);\n```\n\nAs with a while loop, an infinite loop will result if the exit condition\
    \ is never satisfied.\n\nThe do-while loop is a little harder to think about than\
    \ a while loop. Since we want a number that is divisible by 7, the loop has to\
    \ test that the number is not divisible by 7.\n\nUnlike other kinds of control\
    \ statements, the braces in a do-while are required, even if only a single statement\
    \ is in the loop.\n\nThe following code does not work:\n\n```\ndo {\n  let x =\
    \ Math.round(1000 * Math.random());\n} (x % 7 != 0); // error\n```\n\nVariables\
    \ declared within a block are local to that block. If the variable x is declared\
    \ within the braces of the do-while loop, it cannot be used in the condition,\
    \ which lies outside of the block.\n\nTwo additional statement types, break and\
    \ continue, can also control the behavior of do-while loops. These statements\
    \ can be used with statement labels.\n\n### 2.9.4.7 Traditional For Loops\n\n\
    A for loop is a loop with the test at the top. The syntax is:\n\n```\nfor (initialization;\
    \ condition; update) {\n  statements\n}\n```\n\nThe initialization is performed\
    \ first, and only once. After that, the condition is tested and, if true, the\
    \ statements are executed and the update is performed; then control returns to\
    \ the condition. In other words, the for loop behaves almost exactly like the\
    \ following while loop:\n\n```\ninitialization;\nwhile (condition) {\n  statements;\n\
    \  update;\n}\n```\n\nThe initialization may have one of the following:\n\n- Assignment\
    \ to a variable, for example let = 0.\n- A comma-separated list, for example i\
    \ = 0, j = 10.\n\nThe condition is one of the following:\n\n- An expression, for\
    \ example i < 10.\n- A boolean expression, for example i < 10.\n\nThe update is\
    \ one of the following:\n\n- An assignment, for example i++.\n- A comma-separated\
    \ list, for example i++, j--.\n\n### 2.9.4.8 Scope in Loops\n\nWhen the loop body\
    \ is a single statement, the braces are recommended but not required. In this\
    \ case, it is good style to write the entire loop on a single line\n\n```\nfor\
    \ (let variable = value; condition; update) statement;\n```\n\nThe scope of variable\
    \ is the entire statement, if the braces were present.\n\n### 2.9.4.9 Switch Statements\n\
    \nJust as the if statement provides a choice between two blocks of code, based\
    \ on a boolean value, the switch statement provides a choice between several blocks\
    \ of code, based on a value of any type.\n\nThe syntax is fairly complex:\n\n\
    ```\nswitch (expression) {\ncase expression:\n  statements;\n  break;\ncase expression:\n\
    \  statements;\n  break;\n...\ncase expression:\n  statements;\n  break;\ndefault:\n\
    \  statements;\n  break;\n}\n```\n\nOperation is as follows. The switch expression\
    \ is evaluated, and then compared against each expression in order. When a case\
    \ expression is found that is strictly equal to the switch expression, execution\
    \ begins with the following statements and continues until a break or a return\
    \ is encountered, or until the end of the switch statement.\n\n**Note:** The ===\
    \ operator is used for the equality test. This will return a true result only\
    \ if the two values are the same type as well as the same value.\n\nThe break\
    \ statement is not required at the end of each case; if it is omitted, control\
    \ will flow into the next group of statements. This is seldom what you want. On\
    \ the rare occasion that this is the desired behavior, it is best to include a\
    \ comment that the omission is intentional, otherwise you or someone else may\
    \ “correct” this apparent problem at some later date.\n\nOne case expression may\
    \ be followed immediately by another case expression with no intervening statements\
    \ (or break). If either expression matches the switch expression, the following\
    \ statements will be executed.\n\nThe default case is optional and usually should\
    \ come last. If no matching expression is found, the statements in the default\
    \ case are executed. If no matching expression is found and there is no default\
    \ case, the switch statement exits without doing anything.\n\nIt is good style\
    \ to always include a default case, even if you believe all possibilities have\
    \ been covered.\n\nThe statements may be any sequence of zero or more statements.\
    \ It is not necessary to use braces to group the statements (including the following\
    \ break statement) into a compound statement, although this is sometimes done.\n\
    \nHere is is example:\n\n```\nlet v = 123.0;\nlet kind;\n```"
  mdcn: "\n\n## 28 快速上手 JavaScript\n\n### 2.9.4.4 If 语句\n\nif 语句测试一个条件。如果条件为真，则执行后续的语句（通常是一个复合语句）。如果条件为假，则\
    \ if 语句不做任何操作。其语法如下：\n\n```\nif (condition) {\n  statements\n}\n```\n\n例如，以下 if\
    \ 语句会在 x 变为负数时将其重置为零。\n\n```\nif (x < 0) {\n  x = 0;\n}\n```\n\nif 语句还可以包含一个 `else`\
    \ 子句。如果条件为真，则执行条件之后的语句。如果条件为假，则执行 `else` 单词之后的语句。这两个语句通常都是复合语句。其语法如下：\n\n```javascript\n\
    if (condition) {\n  some statements\n} else {\n  some other statements\n}\n```\n\
    \n例如：\n\n```\nif (x % 2 == 0) {\n  x = x / 2;\n} else {\n  x = 3 * x + 1;\n}\n\
    ```\n\n如果任何部分只包含一条单一（非复合）语句，可以省略大括号。在这种情况下，良好的习惯是将单一语句与 `if` 或 `else` 放在同一行。\n\
    \n```\nif (x % 2 == 0) x = x / 2;\nelse x = 3 * x + 1;\n```\n\n### 2.9.4.5 While\
    \ 循环\n\nwhile 循环是一种在顶部进行测试的循环。其语法如下：\n\n```\nwhile (condition) {\n  statements\n\
    }\n```\n\n首先测试条件；如果条件为假，则不再进行任何操作，循环直接退出且从不执行语句。如果条件为真，则执行语句，然后再次执行整个循环（从测试开始）。\n\
    \n例如，可以通过以下方式计算数字 x 的近似常用对数（即以十为底的对数）：\n\n```\nlet log = 0;\nwhile (x > 1) {\n\
    \  x = x / 10;\n  log = log + 1;\n}\n```\n\n大括号表示一个语句块。如果只有一个语句，可以省略大括号；但良好的习惯是始终包含大括号。\n\
    \n通常，由循环控制的语句必须影响被测试的条件。在上面的示例中，x 与 1 进行比较，受控制语句改变了 x 的值。如果受控制语句从未让条件变为假，那么循环永远不会退出，程序将“挂起”（停止响应）。这是一种常见的（尽管说法不准确）称为无限循环的错误。\n\
    \n另外两种语句类型 `break` 和 `continue` 也可以控制 while 循环的行为。这些语句可以与语句标签配合。\n\n### 2.9.4.6\
    \ Do-While 循环\n\n**do-while 循环**是一种测试在底部的循环，而不是通常在顶部的测试。其语法如下：\n\n```\ndo {\n\
    \  statements\n} while (condition);\n```\n\n首先执行**语句**，然后测试**条件**；如果条件为真，则再次执行整个循环。当**条件**给出假结果时，循环退出。\n\
    \n这种循环最常用于在循环体至少执行一次之前，测试没有意义的情况。对于大多数用途，`while` 循环更优。\n\n例如，假设你想选择一个 0 到 1000\
    \ 之间且能被 7 整除的随机数。你无法在选择数字后对其进行测试，因此 `do-while` 是合适的。\n\n```\nlet x;\ndo {\n  x\
    \ = Math.round(1000 * Math.random());\n} while (x % 7 != 0);\n```\n\n与 `while`\
    \ 循环一样，如果退出条件永远无法满足，会导致无限循环。\n\n`do-while` 循环比 `while` 循环稍微难理解。由于我们需要一个能被 7 整除的数字，循环必须测试该数字不能被\
    \ 7 整除。\n\n与其他类型的控制语句不同，`do-while` 中的大括号是必须的，即使循环中只有一条语句。\n\n以下代码无法运行：\n\n```\n\
    do {\n  let x = Math.round(1000 * Math.random());\n} (x % 7 != 0); // error\n\
    ```\n\n在块内声明的变量对于该块是局部。如果变量 x 在 `do-while` 循环的大括号内声明，则不能在条件中使用，因为条件位于块之外。\n\n\
    另外两种语句类型 `break` 和 `continue` 也可以控制 `do-while` 循环的行为。这些语句可以与语句标签配合。\n\n### 2.9.4.7\
    \ 传统的 for 循环\n\n`for` 循环是一种在顶部进行测试的循环。其语法如下：\n\n```\nfor (initialization; condition;\
    \ update) {\n  statements\n}\n```\n\n初始化首先执行，且仅执行一次。之后，测试条件，如果为真，则执行语句并执行更新；然后控制权返回条件。换句话说，`for`\
    \ 循环的行为几乎与下面的 `while` 循环完全相同：\n\n```\ninitialization;\nwhile (condition) {\n \
    \ statements;\n  update;\n}\n```\n\n初始化可以包含以下之一：\n\n- 变量赋值，例如 `let i = 0`。\n-\
    \ 逗号分隔的列表，例如 `i = 0, j = 10`。\n\n条件是以下之一：\n\n- 表达式，例如 `i < 10`。\n- 布尔表达式，例如 `i\
    \ < 10`。\n\n更新是以下之一：\n\n- 赋值，例如 `i++`。\n- 逗号分隔的列表，例如 `i++, j--`。\n\n### 2.9.4.8\
    \ 循环中的作用域\n\n当循环体是单一语句时，建议使用大括号但并非强制。在这种情况下，良好的习惯是将整个循环写在同一行。\n\n```\nfor (let\
    \ variable = value; condition; update) statement;\n```\n\n如果存在大括号，变量的作用域是整个语句。\n\
    \n### 2.9.4.9 Switch 语句\n\n正如 `if` 语句根据布尔值在两个代码块之间进行选择，`switch` 语句根据任何类型的值在多个代码块之间进行选择。\n\
    \n语法相当复杂：\n\n```\nswitch (expression) {\ncase expression:\n  statements;\n  break;\n\
    case expression:\n  statements;\n  break;\n...\ncase expression:\n  statements;\n\
    \  break;\ndefault:\n  statements;\n  break;\n}\n```\n\n操作如下：求 switch switch表达式，然后与每个表达式进行比较。当发现与\
    \ switch 表达式严格相等的 case 表达式时，从其后的语句开始执行，直到遇到 `break` 或 `return`，或者到达 switch 语句的结束。\n\
    \n**注意：** 使用 `===` 进行相等测试。只有当两个值的类型和值都相同时，才会返回真结果。\n\n每个 case 结尾并不需要 `break` 语句；如果省略它，控制流将进入下一组语句。这通常不是你想要的。在极少数这种行为是预期的情况下，最好包含一条注释说明这种遗漏是有意为之的，否则你或其他人可能会在以后某个日期“纠正”这个看似错误的问题。\n\
    \n一个 case 表达式可以紧跟另一个 case 表达式，其间没有任何语句（或 `break`）。如果任一表达式匹配 switch 表达式，将执行其后的语句。\n\
    \n`default` 情况是可选的，且通常应该放在最后。如果没有找到匹配的表达式，则执行 `default` 情况中的语句。如果没有找到匹配的表达式且没有\
    \ `default` 情况，则 switch 语句将在不做任何操作的情况下退出。\n\n即使你认为已经涵盖了所有可能性，良好的习惯也是始终包含一个 `default`\
    \ 情况。\n\n语句可以是任意数量的语句序列。没有使用大括号将语句（包括随后的 break 语句）分组为复合语句，尽管有时会这样做。\n\n这是一个示例：\n\
    \n```\nlet v = 123.0;\nlet kind;\n```\n"
