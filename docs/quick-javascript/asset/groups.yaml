    # Client-Side JavaScript ■ 133


    ```

    <button onclick="cancel()">Cancel</button>

    <br>

    <p id="para"></p>

    ```


    When the HTML page is loaded, it shows a button labeled Google, a text field,
    and a second button labeled Cancel.


    When the first button is clicked, it calls the googleIT() function. That function
    calls display to find the Element with the id “para,” which is an initially empty
    paragraph, and sets to contain the text “Going to Google in 5 seconds.” Then the
    googleIT() function finds the text field with the id “search” and gets its text
    into a variable named term. Finally, googleIt sets a timer that will call the
    google function with the argument term after 5 seconds (5000 milliseconds).


    > Note: This will only work if the browser permits it, which depends on the browser''s
    settings.


    If the Cancel button is clicked within five seconds, the cancel method will erase
    the text in the paragraph whose id is "para", then cancel the timer (whose id
    has been saved in the global variable timer). Consequently, the timer event will
    not occur, and google() will not be called.


    If the Cancel button is not clicked, the google function will try to open a browser
    tab to google.com, with the search term passed to it as an argument, and will
    save the window id in a global variable win2.


    > Note: The ? appended to the URL provides information to the server as name=value
    pairs. Multiple name=value pairs are separated by ampersands (&). Google recognizes,
    among other names, q for “query.”'
