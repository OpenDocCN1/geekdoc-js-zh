    parsed as HTML, while replacing its textContent will result in the new text being
    displayed as written.


    ## 4.5.3.2 Node Methods


    Nodes can be added, replaced, or deleted. Here are some of the methods of a Node:


    - node.before(sibs) — Inserts sibs as siblings (children of the same node) just
    before node.

    - node.prepend(children) — Inserts children as children of node before any existing
    children.

    - node.append(children) — Inserts children as children of node after any existing
    children.

    - node.after(sibs) — Inserts sibs as siblings (children of the same node) just
    after node.

    - node.replaceWith(replacements) — Replaces node with some number of replacement
    nodes or strings.

    - node.remove() — Removes node.


    In the above, the arguments (sibs, children, replacements) may be one or more
    nodes or strings. Strings will be inserted as text nodes.


    Removing or replacing a node also removes or replaces all the descendants of that
    node.


    ## 4.5.4 Elements


    Every tag in an HTML page is represented by an Element object in the DOM tree,
    and every attribute in a tag is represented by an Attribute object in the DOM.
    Modifications to a DOM object are immediately reflected in the appearance of the
    HTML page.


    ## 4.5.4.1 Element Properties


    Here are some of the properties of an Element:


    - element.tagName — The read-only name of the tag, in uppercase (e.g. "HEAD")

    - element.innerHTML — The text between the start and end tag.

    - element.outerHTML — a string consisting of the start tag, the innerHTML, and
    the end tag.

    - element.attributes — a NamedNodeMap (see below) of the attributes of element.


    NamedNodeMap is a live collection of Attr objects. (Despite the name, this is
    the only kind of Node in a NamedNodeMap.) It is array-like, but it is not an array.
    It has length property, and can be indexed like an array.


    ## 4.5.4.2 Element Methods


    Here are some of the methods of:


    - element.hasAttributes() — Returns true if element has attributes.

    - element.getAttributeNames() — An array (possibly empty) of the names of the
    attributes.


