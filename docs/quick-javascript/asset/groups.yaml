    \ after adding elems to the beginning of array.\n- array.shift()—Removes and returns\
    \ the first element in array and updates the array's length.\n\nThe push and pop\
    \ operations may be used to implement stacks efficiently.\n\nThe pairs push and\
    \ shift, or pop or shift, may be used to implement queues; all four methods together\
    \ may be used to implement deques.\n\nBecause the unshift and shift methods actually\
    \ move the elements in the array, they are much less efficient than push and pop.\n\
    \nSeveral additional array methods are described in Appendix A.\n\n## 3.4.6 Sparse\
    \ Arrays\n\nIn most languages, arrays are dense: an array of size n takes up n\
    \ consecutive memory locations. Arrays in JavaScript may be either dense or sparse.\n\
    \nA sparse array is one in which only locations containing actual values take\
    \ up memory in the computer; all other locations appear to contain the special\
    \ value undefined. Sparse arrays occupy less memory but take more time to process.\n\
    \n## 60 Quick JavaScript\n\nHere are some ways to make a sparse array:\n\n- Use\
    \ the form `Array(length)` to create the array.\n- Use delete `array[i]` to delete\
    \ some existing element of `array`.\n- Assign a value to `array[i]`, where `i\
    \ > array.length`.\n- Assigning a value to `array[array.length]` does not force\
    \ the array to be sparse.\n- Set the length property of an array to a larger value.\n\
    - If you set length to a smaller value, array elements at that index and beyond\
    \ are discarded.\n- Write a literal array using consecutive commas, for example,\
    \ `[\"cat\", \"dog\",,,]`.\n- The length of this array is five (not six); the\
    \ last comma is taken as a trailing comma.\n\nTo better understand sparse arrays,\
    \ it helps to remember that undefined is an actual value in JavaScript, and as\
    \ such takes actual space in memory. But if we ask for the value in some location\
    \ of a sparse array and get undefined, this could mean either (1) there is nothing\
    \ in that location, or (2) the location really does contain the value undefined.\n\
    \nThis has some practical implications. The for/in loop will loop through all\
    \ indices of an array, whether there is something at that location or not. The\
    \ for/of loop will only loop through actual values (of which some may be undefined).\n\
    \nThe method `array.hasOwnProperty(i)` will return true if `array[i]` contains\
    \ an actual value, false if it doesn't.\n\n## 3.4.7 Sets\n\nJavaScript does not\
    \ supply the usual operations (union, intersection, symmetric difference).\n\n\
    ## 3.4.8 Maps\n\nIn many languages, it is undesirable to use objects as keys.\
    \ A WeakMap is like Map—it matches keys to values. Here are the differences:\n\
    \n- The constructor is WeakMap().\n- Only objects, not primitives, can be used\
    \ as keys.\n- Only the methods get(key), set(key, value), has(key), and delete(key)\
    \ are provided.\n- WeakMaps are not iterable, so you cannot use for/of them.\n\
    \n## 3.4.9 WeakMaps\n\nA key that has only temporary existence can be garbage\
    \ collected if there are no other references to it. This last is the most important\
    \ point.\n\n## 3.4.10 Promises\n\nIf you have a long-running task whose results\
    \ are not needed immediately, such as a file transfer, you may wish to start it\
    \ asynchronously while your code continues to do other things. A **promise** is\
    \ code that runs asynchronously and \"promises\" to complete a task at some later\
    \ time.\n\nThe following assignment statement creates a Promise object, saves\
    \ it in *promise*, and starts the *function* executing:\n\n```javascript\nlet\
    \ promise = new Promise(function);\n```\n\n> **Caution:** Keep in mind the distinction\
    \ between a function and a function call. If we define function f(){}, then f\
    \ is the function itself, while f() is a call to that function. The argument to\
    \ the Promise constructor must be a function.\n\nThere are three ways a promise\
    \ can terminate: By reporting \"success,\" by reporting \"failure,\" or by throwing\
    \ an exception. To deal with this, the **function** used by the promise should\
    \ have two parameters, each of which is also a function (sometimes called a callback*).\
    \ The promise code should call the first function to report success, or the second\
    \ to report failure.\n\nIt is often convenient to use **arrow functions** (described\
    \ later) to write the callback functions of a promise. Like this:\n\n```javascript\n\
    new Promise((onSuccess, onFailure) => {code});\n```\n\nIn this syntax, **code**\
    \ is the (possibly long-running) code to be executed, **onSuccess** is a function\
    \ to execute if **code** is successful,\n"
  mdcn: "\n\n# JavaScript: 详细细节 ■ 57\n\n* 0 和 0.0\n* 空字符串 \"\" 或 \"\"\n* undefined\n\
    * null\n* NaN\n\n虽然这个功能可能很方便，但它会降低代码的可读性。\n\n旧代码可能使用 `~n` 来进行测试；它等同于 `n != -1`。\n\
    \n## 3.4.4 符号 (Symbols)\n\n创建符号时可以带有描述，也可以不带：\n\n```javascript\nlet sym1 = Symbol();\n\
    let sym2 = Symbol(\"secret\");\n```\n\n符号是一个唯一的标识符；它不会与任何其他标识符混淆。使用相同描述创建的两个符号仍然是不同的。\n\
    \n对象拥有属性，这些属性可以被修改或添加。假设你有一个并非自己创建的对象——它可能是一个内置对象，或者来自他人的代码——而你想给它添加一个属性。该属性严格供你个人使用；它的存在不应该影响任何人的代码。解决方案是使用符号作为属性名。\n\
    \n或者，假设你有一个对象，你想向该对象添加元数据——即关于该对象的信息，但不是对象的一部分。同样，使用符号作为属性名。\n\n这里是各种行星到太阳距离的短表：\n\
    \n```javascript\nlet sun_dist = {\"Venus\": 108.2, \"Earth\": 149.6, \"Mars\"\
    : 227.9};\n```\n\n这些距离恰好以百万公里为单位，但这可能并不明显。让我们加上这个信息。\n\n```javascript\nlet unit\
    \ = Symbol(\"mkm\");\nsun_dist[unit] = \"millions of kilometers\";\n```\n\n我们可以通过请求\
    \ `sun_dist[unit]` 来恢复信息，但大多数代码对它是不可见的。特别是 `for/in` 循环会直接跳过它。\n\n```javascript\n\
    for (let e in sun_dist) {\n  console.log(e = \" \" + sun_dist[e]);\n}\n```\n\n\
    将打印：\nVenus = 108.2\nEarth = 149.6\nMars = 227.9\n\n当需要字符串时（例如打印），JavaScript 会自动将几乎任何内容转换为其字符串表示。它不会对符号这样做。要获取符号的字符串表示，你必须显式地调用\
