    \n对象的赋值不会创建新对象。执行序列 `a = [1]; b = a;` 后，测试 `a b` 将返回 `true`。这是因为 `a` 和 `b 现在是指向同一个对象的引用。通过\
    \ `a` 或 `b` 对对象进行的更改对另一个变量可见。\n\nJavaScript 没有内置对象的等性测试；要实现这一点，需要将对象拆解为原始组件。这需要大量的代码。underscore.js\
    \ 和 lodash.com 网站都为此目的及其他用途提供了大型且经过测试的库。\n\n## 2.8 转换\n\nJavaScript 自动执行大部分转换（也称为强制类型）。这里是一些需要注意的。\n\
    \n在原始类型上进行的任何算术操作都会导致它们转换为数字。数字字符串将以直观的方式转换。布尔值 `true` 将转换为 1，`null` 和 `false`\
