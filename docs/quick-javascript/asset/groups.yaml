    use it to get a car object by putting the keyword new in the function call.


    ```

    let car = new Car("Subaru", 2018);

    ```


    Putting new in front of a function call does two things. It creates a new local
    variable named inside this function, and it implicitly returns this as a result.


    A function used in this way acts as a constructor for objects. It is conventional
    to capitalize the first letter of a constructor (hence, Car rather than car).
    Constructors are used when it is desirable to define a number of similar objects,
    for example, a number of objects.


    > Note: By default, a constructor returns the newly created object. A different
    object, but not a primitive, may be explicitly returned by using the return statement.
    Attempting to return a primitive value has no effect.


    When an object is created by calling a constructor, the test object instanceof
    constructor (for example, car instanceof Car) will test whether the object was
    created using that constructor. This is in contrast to typeof(car), which will
    return the string "object".


    The Object.create(proto) method uses an existing object proto as the prototype.
    The newly created object has no properties of its own; it is “transparent,” in
    the sense that any attempt to read its properties will “see through it” and read
    the properties of the prototype.


    ```

    let car2 = Object.create(car);

    car2.make = "VW";

    car2.color = "blue";

    ```


    Following these statements, car2 will be unchanged, but car2 will have "VW" as
    its make, "blue" as its color, and 2018 as its year.'
  - '[PAGE 108]


    # 3.11.3 Copying Objects


    As is the case with most languages, a variable holds only a small amount of information,
    such as a single number. Objects, including arrays, sets, maps, and user-created
    objects, take up a great deal room. Consequently, what is actually “in” a variable
    is a reference (or pointer or machine address), specifying where to find the object.


    If obj1 is a variable whose value is an object, then the assignment obj2 = obj1
    copies the reference into obj2, not the object itself. The result is that obj1
    and obj2 both point to the same object. Any changes to that object are equally
    visible from both variables.


    There is no way in JavaScript to directly copy an object. However, there is a
    way to copy all the properties of an object, or even objects, into another object


    ```

    let newObj = Object.assign({}, oldObj);

    ```


    The Object.assign method takes an empty object {}, given as the first parameter,
    and copies all the properties of the second parameter into it, returning the result.


    In fact, the assign method is quite general. It can take any number of objects
    as parameters, and copy the properties of all succeeding objects into the first
    object. It also returns the first object as a result.


    ```

    Object.assign(newObj, oldObj1, ..., oldObjN);

    ```


    If there is a conflict, later values of a property overwrite earlier ones.


    This is a shallow copy: The keys and values of the properties copied, but if a
    value is itself an object, it is the reference to that object that is copied,
    not the object itself.'
- md: "\n## 3.11.4 Methods\n\nA method is a function attached to an object.\n\n```javascript\n\
    let now = new Date().getFullYear();\nlet car = { make: \"Subaru\",\nyear: 2018,\n\
    age: function() {\n  return now - this.year;\n}\n}\n```\n\nIn the above, new Date()\
    \ returns a Date object, and its method getFullYear() returns a four-digit number.\n\
    \nThe above car object has a property named year. It isn’t a variable; you can't\
    \ just say, you have to say which object it belongs to. The keyword this means\
    \ “this same object.\"\n\nA method inside an object literal can be abbreviated\
    \ by leaving out the colon and the word function. Within car, age could be defined\
    \ as follows:\n\n```javascript\nage() { return now - this.year; }\n```\n\nThe\
    \ parentheses after age are enough to indicate that it is a function.\n\n## 3.11.5\
    \ Optional Chaining\n\nObjects can contain references to other objects. For example,\
    \ a Customer object might have an address property, while an Address object might\
    \ have a number property.\n\n```javascript\nlet cust = {\n  name: \"Jones\",\n\
    \  address: { number: 29, street: \"main\" }\n}\n```\n\nWith this object you might\
    \ say cust.address.number. This is an example of chaining.\n\nSometimes information\
    \ is missing or incomplete. If either cust or cust.address is undefined or null,\
    \ then cust.address.number will result in an error.\n\nTo avoid this error, the\
    \ optional chaining operator ?. can be used. It converts errors into the undefined\
    \ value. Hence, cust?.address?.number will either work or it will return undefined,\
    \ but it won't cause an error.\n\nOptional chaining can also be used when:\n\n\
    - Using brackets to access a property: cust?.[\"address\"]\n- Indexing into an\
    \ array: ary?.[n],\n- Calling a possibly undefined method: cust.getOrder?.().\n\
    \  - This will result in an error if the cust.getOrder property exists but is\
    \ not a function.\n\n## 3.11.6 This\n\nYou keep using that word. I do not think\
    \ it means what you think it means.\n\n> William Goldman, The Princess Bride\n\
    \nIn JavaScript, the keyword this has a number of meanings. The first two given\
    \ below are the most common uses.\n\n- In a method (a function belonging to an\
    \ object), this refers to the containing object.\n- This is similar to the use\
    \ of this in Java or C++, or self in Python.\n\n- In a constructor (a function\
    \ called with new), this refers to the object under construction.\n- At the top\
    \ level of a program, this refers to the global object.\n- In a browser, the global\
    \ object is the Window object.\n- In a function:\n  - In strict mode, this refers\
    \ to the global object. In a browser, the global object is the Window object.\n\
    \  - In strict mode, this has the value undefined.\n- In a function inside a method,\
    \ this has the same meaning it does in a top-level function; it does not refer\
    \ to the object that owns the method.\n- In an arrow function, the meaning of\
    \ this is the same as it would be if it were in the surrounding context (not in\
    \ the arrow function).\n- In an event handler, this refers to the HTML element\
    \ that received the event.\n\nThe value of this is defined at run time, not at\
    \ compile time. For example, the word this in a function, where it initially has\
    \ the value undefined. Later, that function may be stored as a method of an object,\
    \ with the result that this refers to the object.\n\nThe global object isn't always\
    \ Window. In Node.js the global object is global, while in Web Workers it is itself.\
    \ For code that will work in any of these environments, use globalThis to refer\
    \ to the global object.\n\n## 3.11.7 Higher-Order Functions\n\nA higher-order\
    \ function/method is a function or method that expects a function as one of its\
    \ arguments. Arrays have a number of higher-order methods. It is common for a\
    \ function used as an argument to be defined directly in the method call, using\
    \ the arrow notation. In this section we provide a couple of examples; a more\
    \ complete list is in Appendix B.\n\nReminder: An arrow function has the syntax\
    \ (parameters) => expression.\n\nThe sort method takes a function of two arguments\
    \ that returns a negative, zero, or positive value if the first argument to that\
    \ function is less than, equal to, or greater than the second argument, respectively.\n\
    \n```javascript\nlet nums = [12, 43, 115, 9, 65, 1001, 902];\n\nnums.sort((a,\
    \ b) => a - b);\n// nums is [9, 12, 43, 65, 115, 902, 1001];\n\nnums.sort((a,\
    \ b) => b - a);\n// nums is [1001, 902, 115, 65, 43, 12, 9];\n\nnums.sort((a,\
    \ b) => a % 10 - b % 10);\n// nums is [1001, 902, 12, 43, 115, 65, 9];\n```\n\n\
    This last example sorts numbers according to their one’s digit number modulo 10.\n\
    \nHigher-order methods can be used to replace many kinds of loops, resulting in\
    \ shorter code. For example, the map method will apply a function to every element\
    \ of array, producing a new array. The filter method finds elements in an array.\
    \ The reduce method reduces an array to a single value.\n\n## 3.11.8 Prototypes\n\
    \nEvery object has a prototype. Where did it come from? It came from Object, which\
    \ is useful. When we ask for a property of an object, JavaScript first looks at\
    \ the object itself. If still not found, JavaScript looks in the prototype, and\
    \ so on all the way up to Object. Eventually the property will be found or undefined.\n\
    \nSetting a property of an object sets it on that object; it does not look at\
    \ its prototype. Getting a value from an object will look up to prototype if necessary,\
    \ but setting a value never does.\n\nHere is our example:\n\n```javascript\nlet\
    \ car = {\n  make: \"Subaru\",\n  year: 2018,\n  toString() { return this.year\
    \ + \" \" + this.make; }\n};\n```\n\nIf we set car.wheels = 4, the Car object\
    \ is unaffected. If we call car.toString(), we get \"2018 Subaru\". The toString\
    \ method came from the prototype.\n\nWe can get the prototype of object:\n\n```javascript\n\
    let proto = Object.getPrototypeOf(car);\n```\n\nWe can add features to it:\n\n\
