    以下是数字上最常用的运算符：


    - + 加

    - - 减或一元减

    * 乘

    / 除，产生浮点数结果

    - % 模（取模运算）

    - ** 幂


    布尔值上的常用运算符：


    - && 与

    - || 逻辑

    - ! 非


    比较运算符，产生布尔值结果：


    - < 小于

    - <= 小于等于

    - == 等于

    - === 严格相等（相等且类型相同）

    - != 不等于

    - !== 严格不等（类型或值不同）

    - >= 大于等于

    - > 大于


    字符串拼接：


    - + 连接两个字符串，或字符串与其他任何值。


    赋值：


    - = 赋值运算符—可以作为表达式使用；表达式的值是被赋值的值。


    三元运算符：在表达式 *test ? valueTrue : valueFalse* 中，*test* 决定了使用后续两个值中的哪一个。


