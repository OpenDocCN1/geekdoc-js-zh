    \ `push` 和 `pop` 低得多。\n\n附录 A 中描述了几个额外的数组方法。\n\n## 3.4.6 稀疏数组 (Sparse Arrays)\n\
    \n在大多数语言中，数组是稠密的：大小为 $n$ 的数组占用 $n$ 个连续的内存位置。JavaScript 中的数组可以是稠密的，也可以是稀疏的。\n\n\
    稀疏数组是指只有包含实际值的位置才占用计算机中的内存；所有其他位置似乎都包含特殊值 `undefined`。稀疏数组占用的内存较少，但处理需要更多时间。\n\
    \n## 60 快速上手 JavaScript\n\n这里是创建稀疏数组的几种方法：\n\n- 使用 `Array(length)` 形式创建数组。\n-\
    \ 使用 `delete array[i]` 删除 `array` 的某些现有元素。\n- 给 `array[i]` 赋值，其中 `i > array.length`。\n\
    - 这里的 `array[array.length]` 赋值并不会强制数组变为稀疏。\n- 将数组的 `length` 属性设置为一个较大的值。\n- 如果你将\
    \ `length` 设置为较小的值，该索引及之后的数组元素将被丢弃。\n- 使用连续的逗号编写字面量数组，例如 `[\"cat\", \"dog\",,,]`。\n\
    - 此数组的长度为五（而不是六）；最后一个逗号被视为末尾逗号。\n\n为了为了更好地理解稀疏数组，有助于记住 `undefined` 是 JavaScript\
    \ 中的一个实际值，因此在内存中占据了实际的空间。但如果我们请求稀疏数组中某个位置的值并得到 `undefined`，这可能意味着 (1) 该位置没有任何内容，或者\
    \ (2) 该位置确实包含值 `undefined`。\n\n这具有一些实际意义。`for/in` 循环将遍历数组的所有索引，无论该位置是否有内容。`for/of`\
    \ 循环将只遍历实际值（其中某些值可能是 `undefined`）。\n\n方法 `array.hasOwnProperty(i)` 在 `array[i]`\
    \ 包含实际值时将返回 `true`，否则返回 `false`。\n\n## 3.4.7 集合 (Sets)\n\nJavaScript 并不提供通常的操作（并集、交集、对称差）。\n\
    \n## 3.4.8 映射 (Maps)\n\n在许多语言中，使用对象作为键是不理想的。WeakMap 类似于 Map——它将键映射到值。以下是它们之间的区别：\n\
