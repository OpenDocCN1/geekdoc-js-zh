    operand to a number, so 2 + +"2" is 4.


    Any value in a boolean context (such as the condition of an if statement) will
    be treated as false if it is Ø, undefined, null, NaN, or the empty string. All
    other values, including "0", are considered to be true.


    When an array is converted to a string, the result is a string of comma-separated
    values; the brackets are omitted. Thus, a multidimensional array can readily be
    mistaken for a one-dimensional array.


    # 2.9 STATEMENTS


    Many statements in JavaScript are almost identical to those in Java. For the convenience
    of Java programmers, these statements are described separately from statements
    unique to JavaScript.


    # 2.9.1 Semicolons


    Every JavaScript statement should end with a semicolon. If you are used to programming
    in Java or one of the C languages, continue using semicolons the way you are used
    to.


    Although each statement should be terminated by a semicolon, JavaScript uses a
    tool called ASI (Automatic Semicolon Insertion),'
  - '[PAGE 41]


    # JavaScript: The Bare Minimum ■ 23


    which will, up to a point, put semicolons at the ends of lines where appropriate.
    If you miss a few semicolons it''s probably okay, but it''s unwise to depend on
    ASI to do this for you.


    When a group of statements is enclosed in braces, {}, this forms a compound statement
    (or block). A semicolon is not needed after the closing brace.


    If a statement needs to extend over two lines, separate it in a place where the
    first line cannot be understood as a complete statement. Good places to break
    a statement are after an operator or inside a parenthesized expression.


    If a line begins with an opening parenthesis, opening bracket, or arithmetic operator,
    it will be taken as a continuation of the previous line. If this is not your intent,
    end the previous line with a semicolon.


    Semicolons are required to separate two or more statements on the same line.


    # 2.9.2 Declarations


    Variables in JavaScript may hold any type of value, so their type is not a part
    of their declaration.


    +   * let x;

    * var y = 5; // old style - avoid

    * let z = 26;

    * let a = 5, b = 10, c;


    It is an error to declare a variable more than once (except with var).'
  - "[PAGE 42]\n\n# 2.9.3 Function Definitions\n\nA function is a block of code that\
    \ can be invoked (called). The most common way of declaring a function is with\
    \ this syntax:\n\n```\nfunction name (args) {\n  statements\n}\n```\n\nFunctions\
    \ in HTML should normally be defined in the <head> element to ensure that they\
    \ will be defined before they are needed. Functions may be recursive. Functions\
    \ may be nested within other functions.\n\nExample definition:\n\n```\nfunction\
    \ average(x, y) {\n  let sum = x + y; // x, y, and sum are local\n  return sum\
    \ / 2;\n```\n\nExample call:\n\n```\nlet avg = average(5, 10); // 7.5\n```\n\n\
    Any variables declared within the function body are local to the function. The\
    \ parameters are also local to the function.\n\nFunctions may access variables\
    \ in the environment in which the function occurs (unless there is a local variable\
    \ with the same name). All functions may access global variables. Functions declared\
    \ within another function may access the variables available at the point of declaration.\n\
    \nFunction definitions are hoisted. This simply means that all function definitions\
    \ are processed before any other code is executed that they need not lexically\
    \ occur before calls to them can be made."
