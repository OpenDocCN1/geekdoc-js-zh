    \n```javascript\nclass Car {\n  fuel = \"gasoline\"; // note: no \"let\"\n  constructor(make,\
    \ year) {\n    this.make = make;\n    this.year = year;\n  }\n}\n```\n\n```javascript\n\
    let myCar = new Car(\"Subaru\", 2018);\n```\n\nThe word calls the constructor.\
    \ Within the constructor, make and year refer to the arguments of the constructor,\
    \ while make and this.year are new fields belonging to the object being constructed.\
    \ The constructor can be used to create other Car objects with different values.\n\
    \n**Technical note:** An object created from a constructor gets a constructor\
    \ property, and that property has a name property, so myCar.constructor.name is\
    \ \"Car\".\n\nWith the above definitions, the fields fuel, make, and year of myCar\
    \ can be addressed directly, with myCar.fuel, myCar.make, and myCar.year. Sometimes,\
    \ to provide a bit more “protection,” a class can contain setters and getters.\
    \ These are methods with the special syntax\n\nset name(value) {...} and get name()\
    \ {..}\n\nA setter typically sets the value of a field. Setters are often used\
    \ to check the legality of a value before saving it. It may save the information\
    \ in a other form than the one provided to it (for example, miles may be converted\
    \ to kilometers).\n\nA getter typically returns the value of an object's field.\
    \ Alternatively, a getter may compute a value in some other way and return it,\
    \ for example, converting kilometers back to miles.\n\nTo use these setters and\
    \ getters, no change in the code is involved. If a field has a setter, any attempt\
    \ to change the value of a field (for example, myCar.make = \"VW\") will invoke\
    \ that setter. Any attempt to read the value of a field will invoke its getter.\n\
    \nWhen a setter is defined for a variable, every attempt to set the value of that\
    \ variable calls its setter. In particular, the following code would cause an\
    \ \"infinite\" recursion, as the setter calls itself.\n\n```javascript\nset make(value)\
    \ {\n  this.make = value; // bad!\n}\n```\n\nThe recursion can be avoided by saving\
    \ the variable under some other name. Since underscores are legal in variable\
    \ names, one convention is to make a new name by prepending an underscore. This\
    \ is only a convention; there is nothing special about underscores.\n\n## JavaScript:\
    \ In More Detail\n\n```javascript\nset make(value) {\n  this._make = value; //\
    \ okay\n}\n```\n\nThe new variable _make must be used throughout the class definition,\
    \ while the old variable make should be used outside the class definition.\n\n\
    Getters and setters should normally be defined in pairs. Variables with setters\
    \ should be stored under some other name, while variables without setters are\
    \ unaffected.\n\n**Caution:** While the use of a setter can protect against accidentally\
    \ changing a value, it is no protection against malicious users. With the above\
    \ setter for make, the information is actually stored in a variable _make, and\
    \ this variable is directly accessible.\n\nA **method** is a function belonging\
    \ to an object; and a class is a kind of object. Inside a class, a method is written\
    \ like a function, except that the word function is omitted.\n\nHere is an implementation\
    \ of a Car class:\n\n```javascript\nclass Car {\n  fuel = \"gasoline\"\n\n  constructor(make,\
    \ year) {\n    this._make = make;\n    this._year = year;\n  }\n\n  set make(arg)\
    \ { this._make = arg; }\n\n  get make() { return this._make; }\n\n  set year(arg)\
    \ {\n    if (arg < 1903 ||\n      arg > new Date().getFullYear()) {\n      alert(\"\
    Bad year: \" + arg);\n    }\n  } else {\n    this._year = arg;\n  }\n  }\n\n \
    \ get year() { return this._year; }\n\n  age() { // method\n    let now = new\
    \ Date().getFullYear();\n    return now - this._year;\n  }\n\n  toString() {\n\
    \    return this._year + \" \" + this._make;\n  }\n}\n```\n\nAn assignment to\
