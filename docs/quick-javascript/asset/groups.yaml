- md: "\n# JavaScript: In More Detail ■ 57\n\n* 0 and 0.0\n* The empty string, \"\"\
    \ or \"\"\n* undefined\n* null\n* NaN\n\nWhile this feature can be convenient,\
    \ it makes code less readable.\n\nOlder code may use ~n as a test; it is equivalent\
    \ to n != -1.\n\n## 3.4.4 Symbols\n\nA symbol can be created with or without a\
    \ description:\n\n```javascript\nlet sym1 = Symbol();\nlet sym2 = Symbol(\"secret\"\
    );\n```\n\nA symbol is a unique identifier; it cannot be confused with any other\
    \ identifier. Two symbols created with the same description are still different\
    \ from each other.\n\nObjects have properties, and those properties can be modified\
    \ or added to. Suppose you have an object that you did not create—it may be a\
    \ built-in object, or from someone else’s code—and you want to add a property\
    \ to it. The property is strictly for your own use; its existence should not affect\
    \ anyone’s code. The solution is to use a symbol as the property name.\n\nAlternatively,\
    \ suppose you have an object, and you want to add meta-information to the object—that\
    \ is, information that is about the object, but isn’t part of the object. Again,\
    \ use a symbol as the property name.\n\nHere is a short map of distances from\
    \ the sun for various planets:\n\n```javascript\nlet sun_dist = {\"Venus\": 108.2,\
    \ \"Earth\": 149.6, \"Mars\": 227.9};\n```\n\nThe distances happen to be in millions\
