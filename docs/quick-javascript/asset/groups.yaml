    # 122 ■ Quick JavaScript


    # 4.4.8.2 Post Requests


    A post request, <form method="post">, is typically used for everything except
    simple requests for information. Data is sent in the body of the request, not
    in the URL, so large amounts of data can be sent. In the body, it has the form
    name=value&name=value&... File uploads have a more complex structure.


    A post request is more secure than a get request because it is not visible in
    the URL, not cached, and does not remain in the browser''s history.


    # 4.4.8.3 Other Requests


    There are a few other method request types, such as head to request just the head
    of a page but not the body, and put to ask the server to store data.


    It is up to the server which method requests it will accept and process. For example,
    a server might accept get requests but not post requests.


    Code on the server-side coding may be written in almost any language. Server-side
    coding is beyond the scope of this book.


    # 4.4.9 Additional Text Widgets


    A number of other widgets besides <input type="text"> allow text input. All of
