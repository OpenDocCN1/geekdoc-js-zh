    # JavaScript: In More Detail ■ 65


    Here we make use of those functions:


    ```

    let promise = new Promise(doSomething);

    // other work

    promise.then(yes, no);

    console.log("END");

    ```


    Example results:


    +   "END"

    "no, 0.1825296233109224 is too low


    "END"

    "yes, 0.938714265780423"


    The result returned by then is a Promise. This allows returned by promises to
    be "chained", so that the value returned can be fed into another then. The following
    example will create a random number, multiply it by 100, then add 1000, and display
    the result.


    ```

    let promise2 = new Promise(

    someFun => return someFun(Math.random()));

    ).then(function(result) { return 100 * result; }

    ).then(function(result) { return 1000 + result; }

    ).then(function(result) { console.log(result); }

    ));

    ```


    The syntax does not allow extra arguments to be passed to a Promise; any additional
    information it needs must be taken from the environment.


    # 3.4.11 Conversions


    JavaScript performs most conversions (coercions) automatically. You can also do
    explicit conversions with the functions Number(x), String(x), Boolean(x), BigInt(x),
    parseInt(x, base), and parseFloat(x).'
