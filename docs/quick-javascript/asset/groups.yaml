    # JavaScript: In More Detail ■ 59


    # 3.4.5 Arrays


    Arrays in JavaScript do not have a fixed size; elements may be added to or removed
    from either end of the array.


    +   - array.push(elems)—Returns the new length of array after adding elems to
    the end.

    - array.pop()—Removes and returns the last element in array and updates its length.

    - array.unshift(elems)—Returns the new length of array after adding elems to the
    beginning of array.

    - array.shift()—Removes and returns the first element in array and updates the
    array''s length.


    The push and pop operations may be used to implement stacks efficiently.


    The pairs push and shift, or pop or shift, may be used to implement queues; all
    four methods together may be used to implement deques.


    Because the unshift and shift methods actually move the elements in the array,
    they are much less efficient than push and pop.


    Several additional array methods are described in Appendix A.


    # 3.4.6 Sparse Arrays


    In most languages, arrays are dense: an array of size n takes up n consecutive
    memory locations. Arrays in JavaScript may be either dense or sparse.


    A sparse array is one in which only locations containing actual values take up
    memory in the computer; all other locations appear to contain the special value
    undefined. Sparse arrays occupy less memory but take more time to process.'
