  - '[PAGE 168]


    # Appendix A: Array Methods


    +   - array.push(value1, ..., valueN) — Adds the values to the end of the array
    and returns the new length of the array.


    +   - array.shift() — Removes and returns the first value in the array. Remaining
    elements are all shifted down one place.


    +   - array.slice(start, end) — Returns a new array consisting of elements through
    end - 1 of the original array.


    +   - array.sort() — Sorts the array in place, in alphabetical (lexicographic)
    order; numbers are sorted according to their string representations, so 200 <
    5.


    +   - array.splice(start) — Removes all elements from index location to start
    of the array and returns them in a new array.


    +   - array.splice(start, count) — Removes count elements from the array, starting
    at index location start, and returns them in a new array.


    +   - array.splice(start, count, value1, ..., valueN) — Removes count elements
    from the array, starting at index location start, and replaces them with new elements
    value1, ..., valueN. The removed elements are returned in a new array.


    +   - array.toString() — Creates and returns a comma-separated list of the string
    representations of each element in the array. This method may not show brackets,
    so a higher-dimensional array will appear one-dimensional.


    +   - array.unshift(value1, ..., valueN) — Adds value1, ..., valueN to the beginning
    of the array; the return value is the new length of the array.


    The JavaScript methods Math.min and Math.max take each arbitrary number of arguments;
    they do not take arrays. However, the spread operator (...) will turn an array
    into a sequence of values, so Math.min(...array) and Math.max(...array) work fine.'
