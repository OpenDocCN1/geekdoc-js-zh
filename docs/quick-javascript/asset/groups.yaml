    \ 10); // 7.5\n```\n\n在函数体内部声明的变量是函数的局部变量。参数也是函数的局部变量。\n\n函数可以访问其所在环境中的变量（除非存在同名的局部变量）。所有函数都可以访问全局变量。在另一个函数内部定义的函数可以访问声明位点处可用的变量。\n\
    \n函数定义会被提升（hoisted）。这简单来说意味着在执行任何其他代码之前，都会处理所有的函数定义，因此它们不需要在调用之前词法上出现。\n\n###\
