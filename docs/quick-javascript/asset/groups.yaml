  mdcn: "\n\n# JavaScript: 基础知识 ■ 21\n\n如果你熟悉 Java，那么大多数 Java 运算符也可以在 JavaScript 中使用，包括所有的位操作运算符。位操作运算符会将其操作数转换为整数，并将结果转换回（浮点）数。\n\
