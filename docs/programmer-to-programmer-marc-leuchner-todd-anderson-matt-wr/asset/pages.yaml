    100%\" height=\"100%\"\n        alternatingColors=\"[#FFFFFF,#6F6F6F]\"\n    \
    \    dataProvider=\"_listData\"/>\n    </mx:Canvas>\n  <mx:ItemEditor id=\"itemEditor\"\
    \ width=\"60%\" height=\"100%\" />\n</mx:HDivBox>\n</mx:VBox>\n</mx:WindowedApplication>\n\
    ```\n\nSave the file as MiniSMS.com within your directory. This is the final piece\
    \ of the application. It ties together to make this beautiful thing. All the parts\
    \ that you created can now talk to each other and respond to their events.\n\n\
    When the application initializes, the settings.xml file is loaded by creating\
    \ an instance of the Settings class and calling the load method. After the settings\
    \ are loaded, the application determines whether it should show the user panel.\
    \ It will only appear if the application has previously validated his or her gateway\
    \ switch URL. It is when the gateway URL is validated that the application will\
    \ retrieve the data from the remote server. This is performed in the getData method\
    \ by using an instance of the XMLDataService class.\n\nWhen the data is loaded,\
    \ an instance of the ListDataService is used to create the dataProvider array\
    \ for dataList. At this point, it is free to edit the data by selecting an item\
    \ from the list and editing it within the range of the ItemEditor component. Lastly,\
    \ when the user has used to upload their changes, the application saves the new\
    \ XML data to the hard drive and begins the upload sequence by creating an instance\
    \ of the UploadService class. At this point, the only thing left to do is package\
    \ and deploy the application."
