  md: '# Chapter 4: Music Player


    Open a command prompt, navigate to the working directory for the music player,
    enter the following command, and press Enter:


    ```

    > axmmlc MusicPlayer.mxml

    ```


    With the command prompt pointing to the working directory, package the widget
    as an AIR installer by entering the following command and pressing Enter:


    ```

    > adt -package MusicPlayerMusicPlayer-app.xml MusicPlayer.swf settings.xml

    ```


    Now that the package is created, navigate to your working directory. If the widget
    packaged correctly, you should have a MusicPlayer.air file. Execute the MusicPlayer.air
    package in install the application on your hardware. After it is installed, open
    it, select your MP3 directory, hit Play, and enjoy!


    # Summary


    Now that you have created your own music player, you will never go back to iTunes.
    Regardless of whether or not this application is worthy of the audiophiles on
    the Internet, it is an excellent way to jump into terrific Flex and AIR concepts.


    This chapter covered how to use <Application instead of <WindowedApplication>.
    You looked how to search a directory using the File object and how to read data
    from the hard drive using FileStream.writeUTFBytes, and you took a brief look
    at how to manipulate and create custom components in both ActionScript 3 and MXML.


    It is hoped that by this point, you''re sitting in front of your computer rocking
    out to your favorite tunes. Of course, many features commonly found in music players
    weren''t added due to space limitations. However, you''re encouraged to use this
    application as a starting place and add some additional features. Here are some
    suggestions on where to go from:


    +   - Add the capability to search for any song within the player.

    - Add audio visualization using the SoundMixer.computeSpectrum method to spice
    up the display.

    - Add the capability to download the album art of the song you are playing.

    - Add the capability to drag and drop files into the player and have it automatically
    write them to the XML database.

    - Add the capability to create in-player playlists.

    - Add the capability to read and parse an iTunes music database XML file.


    As you can see, there is an endless supply of ideas for enhancing and extending
    the basic music player you created in this chapter. Above all, take your time
    and enjoy working to make your own AIR music player.'
