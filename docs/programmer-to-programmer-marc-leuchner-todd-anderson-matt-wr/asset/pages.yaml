    # Building the User Interface


    Now that the data for the airAMP music player is in and the supporting classes
    are set up, the next step is to build the view. All interface elements for the
    music player are divided among four MXML components. They consist of the settings
    panel, playback controls, playlist view, and bottom controls. This section discusses
    how to build each element.


    # SettingsPanel


    Because it is the first graphical element to be viewed by users, the SettingsPanel
    component is an excellent place to start. This component enables users to select
    their music directory and set their music preferences.


