  md: "# Chapter 9: Map Application\n\nThe ModeControls component displays RadioButton\
    \ controls to select the mode that the map application is working. As the mode\
    \ property is updated, even connected to the Internet, the user has dispatched\
    \ for all clients that need to know of a change. While the choice of mode and\
    \ depends on the isAvailability value being true. Within the creationComplete\
    \ event handler, the invalidateAvailability() function is bound to the isAvailable\
    \ property. Upon update of the isAvailable property, the invalidateAvailability()\
    \ method is invoked, which determines the mode based on resource availability\
    \ and the current mode:\n\n```\nprivate function invalidateAvailability(args*):\
    \ void\n  if(!_isAvailable && _mode == ModeType.ONLINE)\n    _mode = ModeType.OFFLINE;\n\
    \  else if (!_mode == ModeType.OFFLINE && _isAvailable )\n    _mode = _isAvailable\
    \ ? ModeType.ONLINE : ModeType.OFFLINE;\n```\n\nThe status of the online service\
    \ is monitored by any changes. The enablement of the component is determined by\
    \ the value of the isAvailability property as well as the view based on the current\
    \ state. The invalidateAvailability() method ensures that if a user was offline\
    \ previously and any change to the network resource is made, listening clients\
    \ are not notified of the mode property.\n\nWith the control that the ModeControls\
    \ provides for selection of mode, you can begin working on the view controls that\
    \ respond to the selected mode.\n\n# Displaying Locations\n\nAs opposed to looking\
    \ at a list of geographical points, the map application graphically presents locations\
    \ and enables users to reach destinations. The map is determined from user interaction\
    \ and a network resource, there are two map displays. While online, an HTML control\
    \ is available to communicate with one map API and renders graphics sent over\
    \ HTTP. When working offline, an image component displays graphs from saved state.\n\
    \n+   1. Create a new document and enter the following markup:\n\n```\n<xml version=\"\
    1.0\" encoding=\"utf-8?>\n<mx:Box xmlns:mx=\"http://www.adobe.com/2006/xmx\"\n\
    width=\"100%\" height=\"100%\"\nverticalAlign=\"middle\" horizontalAlign=\"center\"\
    \ndragEnter=\"onDragEnter(event);\"\ncreationComplete=\"onCreationComplete(event);\"\
    >\n\n<mx:Metadata>\n  [Event name=\"change\", type=\"flash.events.Event\"]\n \
    \ [Event name=\"complete\", type=\"flash.events.Event\"]\n  [Event name=\"prepared\"\
    , type=\"flash.events.Event\"]\n  [Event name=\"requestlocation\", type=\"flash.events.Event\"\
    ]\n```"
