  md: "# Chapter 2: Simple Text Editor\n\n# The View\n\nWithin your development directory\
    \ create a folder titled \"Simple Text Editor.\" This will be your working directory\
    \ for this program. Because this application is so simple, start with the view\
    \ just to get it out of the way:\n\n+   1. Open your editor, create a new document,\
    \ and enter the following:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <application xmlns=\"http://ns.adobe.com/application/1.0\">\n<id>com.adobe.acimr.simpletexteditor</id>\n\
    <name>SimpleTextEditor</name>\n<filename>SimpleTextEditor</filename>\n<version>1</version>\n\
    <initialWindow>\n <content>SimpleTextEditor.swf</content>\n <title>Text Editor</title>\n\
    </initialWindow>\n</application>\n```\n\n+   2. Save the file as SimpleTextEditor-app.xml\
