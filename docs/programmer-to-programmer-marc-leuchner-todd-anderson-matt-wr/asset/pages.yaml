  md: '# Chapter 10: Blogger Agent


    # Summary


    In this chapter you learned how to create an application that enables users to
    publish blog entries to save entries to a Blogger account. The application also
    enables users to save entries to be published later, perhaps they are not currently
    connected to the Internet. You accomplished this by learning how to utilize AIR''s
    SQLite API to create and use a local SQLite database. This database is used to
    store and manage blog accounts and blog entries to be published at a later time.
    In addition, you also learned how to utilize the EncryptedLocalStore class to
    safely store sensitive information on a user''s computer for later retrieval.


    This application utilizes the Blogger Data API, but that''s not to say it could
    not be modified to interface with other blogging services that have a public API.
    For instance, you could create a WordPressService class to post to your WordPress
    blog instead. If you wanted to get really creative, you could create a proxy class
    that enables you to publish one entry to more than one blog service at once. Think
    of all the possibilities!'
