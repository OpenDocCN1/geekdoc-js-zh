  md: '# Chapter 4: Music Player


    After the PopupManager creates the instance of the SettingsPanel, move the panel
    to the center of the application using the centerPopUp method of the PopupManager.
    Lastly, the init method of the SettingsPanel in order to set all of the default
    data, and return a reference to the pop-up SettingsPanel instance.


    # Closing the Settings Panel


    This method dispatches an Event.CANCEL and removes the SettingsPanel instance
    from the PopupManager using the removePopUp() method.


    # Browsing for a Directory


    This is called when the user clicks the Browse button. It adds an event listener
    to the File object that was instantiated in the init() method, listening for the
    Event.SELECT event, which will call OnSelect. Once a listener is added to the
    File object, you can call the browseDirectory of the File class. The browseDirectory
    opens a directory selection window. When a user selects a directory and clicks
    OK, an Event.SELECT event is dispatched containing a reference to the File object
    that was called.


    # onDirectorySelect()


    The DirectorySelect() method accepts an Event object as a parameter. It assigns
    the target of the event to the variable, results. Once results are declared, you
    can assign the nativePath property of it to _directoryPath. In this instance,
    nativePath returns the directory path chosen by the user._directoryPath is what
    is going to be written to the settings object in the data model. Lastly remove
    the listener from the File object, as you''re done browsing for the directory.


    # applyHandler


    When the user clicks the Apply button, applyHandler() is called. This method runs
    a try/catch and tests whether _dirTest, a File object, accept the _directoryPath
    as its nativePath. Unfortunately, there is no check for malformed directory paths
    outside of the model. nativePath is assigned the _directoryPath if it successfully
    passes; if not, an error is shown and the applyHandler is aborted.


    If nativePath is assigned, then the user determine whether the directory exists
    in the system. The data comes from the browseDirectory() method, then you would
    have a problem passing this. If it fails, you then call the applyHandler.


    If successful, call the defaultMusicDirectory and refreshOnStart properties of
    the Settings object in the data model. You create a new FileService instance that
    has an event listener listening for the FileService.FILE_WRITTEN event, which
    will access the fileWrittenMessageHandler. After the event listener is set, call
    the saveXMLToFileResource of the FileService class and pass the location of the
    settings file and an XML object that is generated by buildSettingsData.


    # Saving the Settings


    The buildSettingsData method returns an XML object containing the property values
    of the Settings object from the data model. This is passed to the FileService
    so it can be written to the settings.xml file in the user''s resource directory.


