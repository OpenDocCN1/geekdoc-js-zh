  md: "# Chapter 7: HTML and CSS Editor\n\n```\nlabel=\"Revert\" enabled=\"false\"\
    \nclick=\"mx:RevertBtnClick(event);\" />\n<mx:HBox>\n  <mx:CheckBox id=\"WrapBtn\"\
    \n    label=\"Word Wrap\" enabled=\"false\"\n    change=\"sourceText.wordWrap\
    \ = !sourceText.wordWrap\"//>\n  <mx:TextArea id=\"sourceText\"\n    width=\"\
    100%\" height=\"100%\" fontSize=\"14\"\n    fontFamily=\"Courier New\" wordWrap=\"\
    false\"/>\n</mx:HBox>\n</mx:Canvas>\n```\n\nSave the file as HTMLEditor.mxml in\
    \ the directory /aircmr/htmlcsseditor/ within your working directory.\n\nIt should\
    \ appear that the previous two steps set up the HTML editor component entirely.\
    \ Note some important functionality that it is specific to Adobe AIR within this\
    \ component—first, the component's update function:\n\n```\npublic function update(jsDoc:Object,\
    \ url:String):void {\n  var source = new URLLoader();\n  sourceLoader.addEventListener(Event.COMPLETE,\
    \ onFullSourceLoaded);\n  sourceLoader.load(new URLRequest(url) );\n\n  sourceText.text\
    \ = String.trim(jsDoc.body.innerHTML);\n\n  updateBtn.enabled = true;\n  revertBtn.enabled\
    \ = true;\n  wrapBtn.enabled = true;\n}\n```\n\nIn this function the source between\
    \ the <body> tag is extracted and placed into the editable text field and the\
    \ source is retrieved from the URL. The function requires two parameters: first\
    \ is a reference to an HTML page's JavaScript document object; second is the URL\
    \ of the page. Using the JavaScript document object, the function retrieves the\
    \ body.innerHTML property of the DOM. This property is a string containing all\
    \ the HTML within the <body> tag of the current page and because you cannot access\
    \ the full HTML source of a page via JavaScript, the URL as a second parameter\
    \ and a URLLoader is used to retrieve the full source.\n\nAlso therein is some\
    \ code that enables users to save the full source as an HTML file on their hard\
    \ drive. This could look very familiar to you if you have built the text editor\
    \ program from Chapter 2. The only difference is that the text is prepared by\
    \ replacing the original source with the edited source before saving to the file.\n\
    \nBeyond the AIR-specific functionality of this component, which has been covered\
    \ already, the remaining code should be somewhat self-explanatory. Notice that\
    \ the component dispatches two generic events in order to notify eventually when\
    \ the user wants to update the HTML or revert back to the original source. That\
    \ covers the important parts of the HTML editor, so it's time to move on to the\
    \ slightly more complicated CSS editor.\n\n212"
