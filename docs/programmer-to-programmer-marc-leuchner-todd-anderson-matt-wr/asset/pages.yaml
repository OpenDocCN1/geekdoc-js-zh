- img_proc: true
  md: '# Chapter 8: Weather Widget


    # Refresh Initial


    The refresh ComboBox component is assigned an array of predetermined intervals
    so the user doesn''t keep pinging Google''s server every seconds for weather information.
    When the user opens the SettingsWindow, the ComboBox instance is assigned a selectedIndex
    from the getSelectedIndex() method.


    # Temperature Toggle


    The temperature toggle is a label followed by two check boxes. The refreshWindow
    method first calls the toggleDegrees method and passes the settings useCelsius
    property. The toggleDegrees method is also called when the user selects or deselects
    one of the Checkbox components. It accepts a Boolean value if true, the Celsius
    CheckBox selected property true and the Fahrenheit CheckBox''s selected property
    false. The opposite happens if a value is false. Alternatively, you can use Flex''s
    RadioButtonGroup control of this dual Checkbox.


    # Always in Front


    The toggle for "Always in Front" is initially set when the refreshWindow method
    is called. When the Save button is clicked and the zip code validation method,
    the selected value of the CheckBox is passed to the alwaysInFront property of
    the SettingsVO object.


    # Saving the Settings


    The final function of the SettingsWindow is to save the settings to the settings.xml
    file when the Save is clicked. This is accomplished by the saveSettingsLocally
    method, which instantiates a new instance of XMLFileService. Once instantiated,
    an XMLFileService.FILE_WRITTEN event is listener and the saveXMLStorage method
    is called on the XMLFileService instance.


    The saveXMLStorage method accepts two arguments. The first is the location of
    the file you wish to write to. In this, the location of the settings.xml file
    is stored in WidgetDataModel.getInstance().settings.settingsXMLLocation. The second
    is the XML you wish to write. However, the application needs to parse the SettingsVO
    object into XML before sending to the XMLFileService, and this is done by the
    buildSettingsData method.


    The buildSettingsData method creates a new XML object with the name <settings>.
    Once the XML object is created, it assigns property value of the SettingsVO object
    to identical properties in the XML object. Boolean values are created using a
    ternary operation. If true, insert true into the XML; if false, then send an entry
    to the XML object. Once the XML object has been created and properly assigned,
    the method returns to the XMLFileService.


    When the file has been written to storage, a SettingsWindow.SAVE event is dispatched,
    telling the application that the settings have been changed and to act accordingly.


    # Cancel


    When the user clicks the Cancel button, an Event.CANCEL event is dispatched alerting
    the application to close the SettingsWindow with no changes made.


    Once the settings have been configured for the weather, you can load the weather
    data from Google and display the information after it is parsed. The next section
    takes a quick look at the weather viewer before showing the CurrentWeatherItem
    view.


    # 262'
