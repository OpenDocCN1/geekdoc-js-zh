  md: '# AIRVideoPlayer.mxml Explained


    AIRVideoPlayer instantiates the VideoPlayer components and acts as a controller
    between it and the AIR capabilities. It extends the <mx:WindowedApplication> container
    and controls the initially displayed height, width, and backgroundColor.


    # Implementing the VideoPlayer Component


    The AIRVideoPlayer instantiates the VideoPlayer component and assigns values and
    methods to the properties and events of the component:


    ```

    <ui:VideoPlayer

    id="VideoPlayer"

    width="100%" height="100%"

    resizeToVideo="true"

    metadataReceived="handleMetadata( event );"

    resizeToVideo="handleVideoPlayerResize( event );"

    />

    />

    ```


    Looking through the properties, the width and height are set to 100% in order
    for the player to take up all available window real estate. Likewise, the height
    and width affect the size of the AIRVideoPlayer when the videoResize event is
    dispatched. This is discussed in more detail later in this section.


    The public property resizeToVideo is set to true for the VideoPlayer to expand
    and contract the loaded video content.


    Once the metadataReceived event is dispatched, the handleMetadata method is accessed.
    In this case, the properties pertaining to the video file''s metadata can be set
    on the application level. For instance, the window title is set to name of the
    file it has been loaded:


    ```

    this.title = videoPlayer.source.split(''/'').pop();

    ```


    Although this could be assigned when the File object has been created, it is better
    to assign it after the video has been initialized.


    # Adding Drag and Drop Capabilities


    One excellent feature of AIR is the capability to drag and drop content from the
    desktop to the AIR application. In this situation, FLV and H264 files can be dropped
    into the AIR VideoPlayer automatically. This is attained by adding NativeDragEvent.NATIVE_DRAG_ENTER
    and NativeDragEvent.NATIVE_DRAG_DROP listeners to the handleAppCreationComplete
    method. This method is called after the application has finished instantiation.


    # Dragging


    When a user drags a video onto the AIR Video Player, the following method is called:


    ```

    private function onDragEnterHandler(event:NativeDragEvent):void

    {

    NativeDragManager.dropAction = NativeActions.LINK;

    NativeDragManager.acceptDragDrop(this);

    }

    ```


    439'
  merge: -1
  pgno: 461
- img_proc: true
  md: "# Chapter 12: AIR Video Player\n\nThis method references the NativeDragManager\
    \ assigns the dropAction property to link, meaning only a reference to the file\
    \ will be created, versus copying or moving the file to another directory location.\
    \ In addition, AIRVideoPlayer lets the NativeDragManager know that it is OK to\
    \ allow drag and drop by passing a reference of itself to the acceptDragMethod\
    \ of the NativeDragManager.\n\n# Dropping\n\nWhen the user drops a file onto the\
    \ AIRVideoPlayer, the onDragHandler handler is called. This method is passed a\
    \ NativeDragEvent that contains the reference for the dropped file. The reference\
    \ is located in the clipboard.container.\n\nThe method first ensures that the\
    \ clipboard has file information by calling the hasFormat method on the clipboard\
    \ container. The hasFormat method accepts a String. In this case, this method\
    \ is checking for a file format, the String ClipboardFormats.FILE_LIST_FORMAT\
    \ is parsed.\n\nOnce the clipboard information is determined to be file data,\
    \ the onDragHandler creates a new array and assigns it the data from the clipboard\
    \ using the clipboard.getData method.\n\n```\nvar fileArray:Array = \nevent.clipboard.getData(ClipboardFormats.FILE_LIST_FORMAT)\
    \ as Array;\n```\n\nIt loops through each File object in the Array and determines\
    \ whether the file extension is either an FLV or an acceptable H.264 encoded format\
    \ as MOV. If the file is an acceptable format, the NativePath is assigned to the\
    \ source property of the AIRVideoPlayer and loaded. If the user is running Mac\
    \ OS X, then the prefix:: to be added\n\n```\nvar prefix:String = (Capabilities.os.search(\"\
    Mac\")>=0) ? \"file://\" : \"\";\n```\n\n# Adding Context and Window Menus\n\n\
    Even though files through drag and drop is an acceptable way to open a video file,\
    \ the AIRVideoPlayer will need a more intuitive way to open it. In order to do\
    \ so, a NativeMenu object will be assigned to application.\n\n# Window and Application\
    \ Menus\n\nThere are actually two types of window menus, and are determined by\
    \ which operating system the user is on. For instance, OS X has one stationary\
    \ menu at the top of the screen, separate from the application window, whereas\
    \ Windows has a menu that resides within the application window. In the case of\
    \ the AIRVideoPlayer, this is decided in the handleAppCreationComplete method:\n\
    \n```\nif(NativeApplication.supportsMenu)\n  NativeApplication.nativeApplication.menu\
    \ = buildAppMenu();\nif(NativeWindow.supportsMenu)\n  stage.nativeWindow.menu\
    \ = buildAppMenu();\n```\n\nIf this application is running OS X, then NativeApplication.supportsMenu\
    \ will be true, whereas in Windows, NativeWindow.supportsMenu would be true. In\
    \ either case, the same menu set is assigned to either the nativeApplication (OS\
    \ X) or the nativeWindow (Windows)."
