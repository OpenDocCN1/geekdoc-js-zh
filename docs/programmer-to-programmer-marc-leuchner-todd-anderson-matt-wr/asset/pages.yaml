  md: "# Chapter 11: Slideshow Maker\n\n```\npublic static function getScreen():Rectangle\n\
    {\n    return Screen.mainScreen.bounds;\n}\n```\n\nThe Screen of the AIR API provides\
    \ access to system information. In this example, the Settings class returns the\
    \ main display screen from the static getSize method. In following with the examples\
    \ in this chapter, the getClientSize() value is used in scaling the method of\
    \ a SlideCanvas instance and the density for a slideshow presentation.\n\nAccess\
    \ to the file extensions for a slide and slideshow is gained through the getSlideExtension()\
    \ and getShowExtension() static methods. Both methods use the getExtensionType()\
    \ with the relative file type name:\n\n```\npublic static function getExtensionType(typeName:String)\n\
    {\n    var descriptor:XML = NativeApplication.nativeApplication.applicationDescriptor;\n\
    \    ns = new Namespace(descriptor.namespace));\n    default xmlNamespace = ns;\n\
    \    return descriptor.fileID(name = typeName).toString();\n}\n```\n\nThe contents\
    \ of the application descriptor file — which is in XML format and created in the\
    \ next section, \"Deploying the Application\" — is obtained from the applicationDescriptor\
    \ property of the NativeApplication Singleton. The NativeApplication instance\
    \ is created upon startup of the application and interacts with the operating\
    \ system GUI — the Explorer in Windows, and Finder in Mac OS. In the getExtensionType()\
    \ method of the default xml namespace directive sets the default Namespace to\
    \ use in the descriptor file with the namespace URI held in the descriptor XML.\
    \ The return value is that of the extension string relative to the file node value\
    \ that matches the supported argument.\n\nWith the Settings utility class serving\
    \ as a main access point for multiple clients who deal with screen bounds and\
    \ file types complete, you can get work on creating the application descriptor\
