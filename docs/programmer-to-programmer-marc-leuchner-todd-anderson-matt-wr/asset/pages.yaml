  md: '# Chapter 8: Weather Widget


    Begin by creating a new directory in your local development called WeatherWidget.
    This directory will be your working directory for this application.


    Next, create the package structure for this application by creating three new
    directories — com, aircmr, and weatherwidget — in your working directory. The
    weather widget package structure should look like follows: working directory/com/aircmr/weatherwidget.


    Lastly, download the configuring assets and icons directories from the WeatherWidget
    section of the accompanying website and place them in the root of the working
    directory. These files will be used throughout the development of the weather
    widget.


    Now that the directory structure has been set up, you can begin to build the Weather
    Widget application. The next section starts the development process by discussing
    where the data for the application is coming from and how the application will
    utilize it.


    # Handling Data


    In terms of functionality, widgets are, for the most, data driven. They reside
    on the user''s desktop and display some sort of data in a condensed form, both
    physically and functionally. For instance, the weather widget will be used to
    display a single or four-day forecast. There must be able to handle data for either
    situation. In addition to the weather data, the widget must also keep track of
    basic user preferences such as zip code.


    # XML


    All external data for the weather widget will be received as XML. This applies
    to both settings and weather information. The weather XML will be retrieved from
    Google through an HTTP request. The settings XML will be accessed through the
    FileStream class from the user''s applicationDirectory. Once received, the XML
    will be parsed into WeatherV0 and SettingsV0 objects by the XMLParserUtil class
    and added to the applications data model, WidgetDataModel. The following sections
    look at this process in detail.


    # Weather XML


    First, review the XML data from Google. Begin by opening a web browser and browsing
    to www.google.com/ig/api?weather=02139.


    More than you, your web browser will have parsed the text and image links from
    the XML. To view the XML, you may have to click View Source. The name of this
    option varies depending on your browser.


    If you will, be able to check the weather in Cambridge, Massachusetts (It is probably
    rainy and cold.) As previously mentioned, Google''s weather data is straightforward.
    A node encapsulates the weather information. Location information resides in the
    <forecast_information> node. The current weather information (for the day) is
    located in the <current_conditions> node. Following the current weather data is
    the four-day forecast, located in four <forecast_conditions> nodes. Look over
    this XML document and become familiar with it. In the ways which the weather widget
    utilizes this data is discussed in more detail throughout this chapter.


