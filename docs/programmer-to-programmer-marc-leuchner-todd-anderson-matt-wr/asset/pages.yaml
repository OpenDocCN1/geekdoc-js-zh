  md: "# Chapter 6: Image Viewer and Editor\n\nBinding to the availability of a supplied\
    \ ImageData object enables and disables the controlled controls and updates the\
    \ text property of the label corresponding to the name property of the ImageData\
    \ instance:\n\n```\n<mx:Label id=\"imageName\"\n  truncateToFit=\"true\"\n  maxWidth=\"\
    width - COMBO_WIDTH - 15\"\n  text=\"${ImageData.name}\"\n/>\n```\n\nThe rotation\
    \ controls, named rotateLeft and rotateRight, have click event handlers that rotates\
    \ the image display in degrees either direction. Along with the rotation controls\
    \ is an input-enabled ComboBox with fixed sizes to resize the image display in\
    \ the view:\n\n```\n<mx:Combo id=\"sizeCombo\"\n  width=\"${COMBO_WIDTH}\"\n \
    \ rowCount=\"6\"\n  styleName=\"scaleCombo\"\n  textAlign=\"left\"\n  editable=\"\
    true\"\n  selectedIndex=\"2\"\n  onScaleChange=\"onChange(event);\"\n  close=\"\
    onChange(event);\"\\n<mx:dataProvider>\n  <mx:Object label=\"25%\" />\n  <mx:Object\
    \ label=\"50%\" />\n  <mx:Object label=\"100%\" />\n  <mx:Object label=\"200%\"\
    \ />\n  <mx:Object label=\"500%\" />\n  <mx:Object label=\"1000%\" />\n</mx:dataProvider>\n\
    </mx:ComboBox/>\n```\n\nThe pre-fixed sizes increment from 25% to 1000%, with\
    \ a default selection of 100%; and with the editable property set to true, a user\
    \ can choose their size within range.\n\nThe HBox declared below theDisplay component\
    \ in ImageCanvas holds controls for navigating through the thumbnail browser in\
    \ the previous section. Each control, named previousButton and nextButton, call\
    \ for an update to the currentIndex property of the GalleryData-Manager instance.\
    \ Because a change to this property is listed for the ImageBrowser, these controls\
    \ allow you to navigate through thumbnails and select images for viewing without\
    \ specifically to click on a thumbnail.\n\nSandwiched between two controls is\
    \ the ImageDisplay component, the second snippet showed as ImageDisplay:\n\n```\n\
    <mx:HBox width=\"100%\" height=\"100%\"\n  paddingLeft=\"5\" paddingTop=\"5\"\
    \ paddingRight=\"5\"\n  <ui:ImageDisplay id=\"imageDisplay\" width=\"100%\" height=\"\
    100%\"\n    source=\"${ImageData.bitmap}\"\n/>\n</mx:HBox>\n```"
