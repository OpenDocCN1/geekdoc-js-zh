  md: '# Chapter 1: The Development Environment


    The filename elements reflect the name given to the application and is displayed
    as the value for “Application name” within the installer window. The optional
    programMenuFolder property in the descriptor file, the filename will also be displayed
    in the subpath of the Windows Start ⊞ Menu.


    The attribute is an application-defined designator and does not relate to the
    version of AIR. Its value is specified by the developer, and typically conforms
    to the standard MajorVersion.MinorVersion form. In this example, the version value
    is 0.1.


    The initialWindow element has several optional child elements pertaining to the
    properties applied to the initial application node. Properties, such as positioning
    and size, are applied as children of the initialWindow node, which have a default
    value and are considered optional. The title, systemChrome, transparent, and visible
    properties are all but included in this example with their default values because
    they are frequently used to customize the visual aspects of your application.
    The only requirement for initialWindow is the content. The value for content is
    the URL of the SWF file when you compile it.


    The name, description, installationFolder and programMenuFolder properties are
    all optional. The description value is displayed within the installation window.
    The name appears in the title of the installation window; it is the application
    name available in the uninstall panel and the name given to the installation folder.
    The installFolder element''s value specifies the location of the application within
    the directory of your operating system — C:\Program Files on Windows and HD name/Applications
    on Mac OS X. The programMenuFolder is the subpath displayed in the Windows Start
    ⇤ Menu, where the application can be found under the value of filename. This setting
    is ignored by any operating system other than Windows. The installFolder and programMenuFolder
    properties follow the same character restrictions as the file and folder naming
    conventions of your operating system.


    Many properties can be set in the application descriptor file that are specific
    to the operating system (such as associated file types) and the look and feel
    of your AIR application (such as icons). One is optional and will be discussed
    in applications throughout this book.


    The second snippet you saved as HelloWorld.xml is your main application file.
    This book does not cover the Flex language and XML markup, but it describes attributes
    and changes to the Application Interface (API) that pertains to AIR. A good first
    start is the WindowedApplication container:


    ```

    <xml:WindowedApplication

    xmlns="http://www.adobe.com/2006/xml"

    layout="vertical"

    windowComplete="clickHandler();">

    ```


    The WindowedApplication tag defines the container for the application. Those familiar
    with the Flex language are used to defining Application as their application container.
    In fact, WindowedApplication extends the Application component. It has extra attributes
    that can be set in the descriptor file and overridden with this tag, as well as
    specified events and styles until WindowedApplication. The windowComplete event
    is one such unique event, which is dispatched when the window''s initial layout
    is completed and made visible. The completeHandler() method within the <xml:Script>
    tag is the handler for this event. Currently, no operations are performed in this
    method, but one will be added when the ADL tool is discussed in the next section.'
