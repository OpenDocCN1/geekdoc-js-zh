    \n# PlaybackControls\n\nThe PlaybackControls component will represent the entire\
    \ user interface for playing, pausing, stopping, and advancing through a track.\
    \ To preserve layout, it extends the HBox component. In addition to the playback\
    \ buttons, it features an adjustable slider that represents the song's playback\
