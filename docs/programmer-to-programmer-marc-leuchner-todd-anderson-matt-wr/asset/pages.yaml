    2. Save the file as ImageViewer-app.xml in the root of your working directory
    along with the ImageViewer.xml file.


    This will serve as the application descriptor file. The element values from this
    snippet are somewhat generic and should be changed as you see it. When the application
    is installed, it will be named ImageViewer and be available in the AIRCMR folder
    of the application directory of your operating system.


    With the descriptor file in place, you are set to compile and package the Image
    Viewer and Editor AIR executable.


    # Compiling and Packaging


    Two files are needed to package an AIR application: the main SWF file and the
    XML application descriptor. In this section you will produce the SWF file using
    the command-line tools and package the AIR application.


    > If you don''t want to create your own, the graphic assets used in the examples
    can be found in the /assets folder of the code for examples on the accompanying
    website.


    +   1. Open a command prompt, navigate to the working directory for the Image
    Viewer and Editor, enter the following command, and press Enter:


    ```

    > axmlc ImageViewer.mxml

    ```


    > If you have purchased a certificate from a certificate authority, such as VerSign
    or Thwaite, then you may use that certificate and skip the following operation,
    rather create the self-signed certificate. To create a self-signed certificate
    within the working directory, enter the following command:


    ```

    > adt -certificate -cn ImageViewer 1024-RSA certificate.pfx

    ```


    +   2. With the command prompt pointing to the working directory, enter the following
    command to package the Image Viewer and Editor:


    ```

    > adt -package -storetype pkcs12 -keystore certificate.pfx ImageViewer.air ImageViewer-app.xml
    ImageViewer.swf

    ```


    You will be prompted to enter the password for the certificate. If you created
    a self-signed certificate from the second command, then enter "password." After
    running these commands, an ImageViewer.swf file, a certificate.pfx file, and the
    ImageViewer.air file are generated within your working directory.'
