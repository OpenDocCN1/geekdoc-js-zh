  md: "# Chapter 12: AIR Video Player\n\n```\n)\nelelse{\n  var exitFullScreen:NativeMenuItem\
    \ = menu.addItem(new\n    NativeMenuItem(\"EXIT FULLSCREEN\"), );\n  exitFullScreen.addEventListener(Event.SELECT,\
    \ handleExitFullScreen);\n```\n\nIf the application is in full-mode, then isNormal\
    \ will be false. Once this is determined, Enter Fullscreen or Exit Fullscreen\
    \ options are added accordingly. The result of the context menu is illustrated\
    \ in Figure 12-4 and can also be seen in Figure 12-6 in the following section.\n\
    \n![](img/ae8d13390b8907e42ae2ab60bd54e1f8_464_0.png)\n\nFigure 12-4\n\n# Supporting\
    \ Full-Screen and Resizing\n\nViewing a full-screen is almost a necessity in a\
    \ full-featured video player, as is the capability to resize the player to either\
    \ the set size of the loaded video or to a size specified by the user. Luckily,\
    \ three component files that make up the AIR Video Player are coded to accommodate\
    \ resizing.\n\n# Resizing\n\nResizing (without full-screen) happens in two places.\
    \ The first is declared in the resizing event dispatched by the WindowedApplication.\
    \ When resizing is dispatched, the method handleResizingApp is called. This method\
    \ uses the UIViewPlayer to the height and width of the window as the user drags\
    \ the window's size to a larger or smaller height and width, while the video's\
    \ aspect ratio is preserved unless UIViewPlayer.maintainAspectRatio is set to\
    \ false.\n\nThe second place is declared in the UIViewPlayer component instantiation\
    \ markup. The videoResize event is assigned by the handleVideoResize method. This\
    \ event is dispatched once the video's metadata has been retrieved. From there,\
    \ handleVideoPlayerResize adjusts the height and width of the UIViewPlayer. This\
    \ is illustrated in Figure 12-5.\n\n442"
