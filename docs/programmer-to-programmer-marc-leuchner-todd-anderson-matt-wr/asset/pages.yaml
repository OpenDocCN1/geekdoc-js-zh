  md: 'Lastly, the user should be able to scrub the video by moving the thumb on the
    slider. This is accomplished by the handleSliderThumbEvent method, which is called
    by the thumbPress and thumbRelease events. On release, whether the video was playing
    before the thumb was pressed. On release, the newPlayTime property is set to the
    value of the thumb marker and an event is dispatched to the VideoPlayer component,
    which updates the VideoDisplay component. If the video was playing before the
    thumb press, then the video resumes play.


    # ## On Scrubbing Updates


    The newPlayTime property is only updated on release for the reason why there is
    no fast-forward or rewind functionality to the video player. The Flex VideoDisplay
    component''s playbackTime can continuously receive new values. However, if the
    NetStream object of VideoDisplay is being updated, new values will be queued and
    executed in order. Therefore, if the newPlayTime value was updated when the user
    drags the thumb, the video would visually skip until it reaches the next newPlayTime
    in the queue.


    # ## Play, Pause, and Rewind


    The play button acts as both play and pause button, depending on whether the video
    is playing. When pressed, it calls the handlePlay method, which checks the playing
    property and dispatches either play or pause event


    ```

    dispatchEvent(new Event(playing ? VideoControls.PAUSE_VIDEO :

    VideoControls.PLAY_VIDEO));

    ```


    The rewind button calls the handleRewind method, which sets the newPlayTime property
    to zero.


    # ## VideoPlayer Explained


    Now that there is the VideoControls component, it can be instantiated by the VideoPlayer
    component along with the Flex VideoDisplay component. The VideoPlayer consists
    of the two components, nested in a VBox.


    The VideoDisplay and VideoControls interface directly with each other through
    other properties in events. For example, the videoControls property is bound to
    the playing property of the VideoDisplay. Likewise, when the volumeChange event
    is dispatched, the inline code sets the volume property of VideoDisplay is:


    ```

    <ui:VideoControls id="videoControls"

    playTime="videoDisplay.playTime"

    playTimeTotals="videoDisplay.totalTime"

    playing="videoDisplay.playing"

    playTimeChange="videoDisplay.playTime = videoControls.newPlayTime"

    volume="videoDisplay.volume">

    ```


    ```

    volumeChange=(videoDisplay.volume = videoControls.volume)*


    playVideo=(videoDisplay.play());

    pauseVideo=(videoDisplay.pause()); /

    ```


    This applies to the playTimeChange event thrown by the videoControls.'
