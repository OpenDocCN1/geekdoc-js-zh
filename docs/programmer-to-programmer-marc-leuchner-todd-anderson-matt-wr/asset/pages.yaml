  md: '# Chapter 4: Music Player


    The volumeController HSlider''s value property is bound to the BottomControls
    volume property. Likewise, when the thumb is moved, a CHANGE event is dispatched
    in which turn sets the volume property and dispatches an event, VOLUME_CHANGE,
    to the controller (or whatever class has listening). The following snippet shows
    the BottomControls instantiation in the application controller, the MusicPlayer.xml
    file:


    ```

    <ui:BottomControls id=''BottomControls''

    volumeChange="_soundManager.volume = BottomControls.volume*"

    volume="_soundManager.volume"

    settingsClick="_openSettingsPopup( event );"

    ```


    In this example, the Change event is assigned the inline code that changes the
    SoundManager''s volume property to the BottomControls volume property. This sets
    the volume of the SoundManager to the volume of the slider any time thumb is dragged.
    The value of the HSlider is bound to the volume property of the BottomControls
    class, which is bound to the volume property of the SoundManager, creating a bridge
    between the BottomControls volume slider and the volume of the sound that is playing
    through the application controller and SoundManager.


    # Brying It All Together


