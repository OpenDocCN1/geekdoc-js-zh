    \ are parsed by the XMLParserUtil and then entered into the ApplicationDataModel.\n\
    \n# ## How the Search Is Executed\n\nWhen queryDirectoryToList() is called by\
    \ the class that instantiated the FileSearch, a new File object is created with\
    \ the path property defining the directory to search. A listener is added to listen\
    \ for the FileListEvent.DIRECTORY_LISTING event. Once the listener is assigned,\
    \ getDirectoryListingAsync() method is called:\n\n```\n_file = new File (directoryName);\n\
    _file.addEventListener(FileListEvent.DIRECTORY_LISTING, queryDirectoryResults);\n\
    _file.getDirectoryListingAsync();\n```\n\ngetDirectoryListingAsync() returns an\
    \ array of File objects that represent the contents of the directory. After the\
    \ search has been completed, the FileListEvent is passed to the queryDirectoryResults()\
    \ method. The FileListEvent contains the array of File objects, which are accessed\
    \ through the event's files property.\n\nThe queryDirectoryResults() method loops\
    \ through the results array, checking whether the File represents a directory.\
    \ If it does, and you have allowed subdirectory searching, the File object is\
    \ added to the _subDirectoryQueryList array. If it doesn't, the method checks\
    \ the extension property of the File object to determine whether it matches the\
    \ desired query. If the search is successful, then the path to the file is added\
    \ to an XML object.\n\nAfter the file has been created, the queryDirectoryResults()\
    \ method contains subdirectories. If it does, then getDirectoryListingAsync()\
    \ is executed on the subdirectory object, recursively searching each subdirectory.\
    \ If _subDirectoryQueryList does not have any subdirectories, a FileSearchEvent\
    \ is dispatched as the FileSearchEvent.SEARCH_FINISHED. All search results are\
    \ stored in the searchResults property of the dispatched FileSearchEvent. The\
    \ next section discusses this object.\n\n# ## FileSearchEvent\n\nFileSearchEvent\
    \ is exclusively dispatched by the FileSearch service. It extends the Event class\
