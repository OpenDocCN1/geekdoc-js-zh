  md: "# Chapter 9: Map Application\n\nThe first snippet, saved as LocationDisplay.xml,\
    \ is the main view for displaying graphical locations and interfacing with DOM\
    \ objects and methods of the HTML control. Based on the mode property bound to\
    \ invalidateMode() method, to display the HTML or Image controls within the ViewStack\
    \ container is determined.\n\nWhen a user chooses to show the current location,\
    \ snapshots of the map graphics in the HTML control are saved and added to the\
    \ storage using using the bufferImage() method of the ImageFileBuffer. The path\
    \ is returned as the content value for a location, available on the LocationVO\
    \ object, which is bound to the source property of the Image control.\n\nTo set\
    \ destination markers, the drag-and-drop API of the framework is used by the dropCanvas\
    \ to recognize and respond to mouse gestures over the graphic display. The LocationData\
    \ component handles adding others to the markers, as well as their data to the\
    \ LocationDataManager Singleton.\n\nWithin the HTMLlocation setter, the location\
    \ property of the HTML control is updated. When working offline mode, the selected\
    \ view displays any saved graphics to a location. When online, the map graphics\
    \ are rendered by the Yahoo! Maps API. Communication to API is made from JavaScript\
    \ methods within an HTML document loaded by the HTML control. Dot-notation syntax\
    \ is used to access the JavaScript properties and methods available on an HTML\
    \ control through the window.currentAddress property of the LocationDataManager\
    \ is updated, the invalidateAddress() method of the LocationDisplay instance is\
    \ updated, and invoked, by the selector with the HTML Document Object Model (DOM)\
    \ is made.\n\n```\nmap.window.locationAddress(escape(data.currentAddress));\n\
    map.window.returnMarkers = onHTMLMarkers;\nmap.window.returnClean = onChangePrepared;\n\
    ```\n\nBeing able to communicate between ActionScript and JavaScript is an incredible\
    \ asset to the AIR API, and this snippet demonstrates that you can call JavaScript\
    \ methods directly and assign ActionScript to methods from JavaScript. With this\
    \ type of interaction, you can perform AJAX operations rendered directly in the\
    \ Flash Player! To fully grasp how the map application uses the Yahoo! Maps AJAX\
    \ API to display graphics and markers, create the HTML document that will be loaded\
    \ into the LocationDisplay component.\n\n# The HTML Document\n\nThe mx.controls.HTML\
    \ renders HTML content in an AIR application. The location property can be a URL\
    \ of an HTML document hosted on a server or a path on your file system. The map\
    \ application will be packaged with the HTML document, which will be copied over\
    \ and loaded from the application storage directory, and used to communicate with\
    \ the Yahoo! Maps AJAX API.\n\nCreate a new document and enter the following markup:\n\
    \n```\n<html>\n<head>\n  <style type=\"css\">\n    #mapContainer {\n    height:\
    \ 424px;\n    width: 424px;\n  }\n</style>\n```\n\n![](img/ae8d13390b8907e42ae2ab60bd54e1f8_331_0.png)"
