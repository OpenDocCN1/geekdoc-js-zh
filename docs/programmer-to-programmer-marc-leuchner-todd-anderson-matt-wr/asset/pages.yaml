  md: "# Chapter 7: HTML and CSS Editor\n\n# The CSS Editor\n\nAs mentioned previously,\
    \ the CSS editor is a bit more complicated than the HTML editor, but this purely\
    \ by choice. Sure, the CSS editor could just be a plain editable text area like\
    \ the HTML editor, but what fun would that be? Not to mention it will be a bit\
    \ easier to update the CSS on a per-style, per-property basis. In other words,\
    \ rather than update all the CSS at once using a long string, the CSS editor should\
    \ notify the application when either a style or a style's property has been edited.\
    \ In the end, the CSS editor should perform the following tasks:\n\n+   - Enable\
    \ users to view and edit all the styles of the current page.\n- Enable users to\
    \ view, edit, and delete the properties of any given style.\n- Enable users to\
    \ save the CSS source to their hard drive.\n- Notify the application when a user\
    \ has modified both a style and a style property.\n- Notify the application when\
    \ a user would like to revert back to the original source.\n\nThis is actually\
    \ quite similar to the HTML editor, the CSS will be managed a bit differently.\
    \ Specifically, rather than a plain text area, a Flex List component will be used\
    \ to display and manage the CSS styles, and a Flex DataGrid component will be\
    \ used to display and manage the properties of a selected style.\n\n# Managing\
    \ CSS Data\n\nBecause this content uses a more visual approach, it is necessary\
    \ to abstract the CSS data into something manageable in ActionScript. In the following\
    \ steps we will create two data classes that help organize the CSS information:\n\
    \n+   1. Open your editor and create a new document. Enter the following markup:\n\
    \n```\npackage com.aicmr.htmlcsseditor.data\n{\n    public class CSSStyle{\n \
    \       private var _stylesheetIndex:Number;\n        private var _cssRuleIndex:Number;\n\
    \        private var _selector:String;\n\n        [Bindable]\n        private\
    \ var _properties:Array;\n\n        public function CSSStyle(styleID:Number, cssRuleID:Number,\
    \ selector:String, properties:Array ) {\n            _stylesheetIndex = styleID;\n\
    \            _cssRuleIndex = cssRuleID;\n            _selector = selector;\n \
    \           _properties = properties;\n        }\n    }\n```\n\n213"
