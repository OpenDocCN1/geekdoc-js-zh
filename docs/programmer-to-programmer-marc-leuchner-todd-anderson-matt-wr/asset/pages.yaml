    _nativeWindow is in the <Application>''s onCreateComplete handler method. If _native
    Window.displayState equal to the MINIMIZED create a new NativeMenuItem labeled
    Show Widget, which handles the RestoreButton method. If the displayState is MAXIMIZED
    or NORMAL, create a NativeMenuItem instance labeled Hide Widget to Tray that will
    instead access the handleMinimizeButton. Minimizing and restoring is discussed
    in the next section.


    The final NativeMenuItem instance is labeled Exit and accesses the handleClose
    button. When called, the handleCloseButton method accesses the close() method
    on the _nativeWindow, exiting the application.


    Finally, the buildNativeMenu method checks NativeApplication.supportsSystemTrayIcon.
    If the weather is running in Microsoft Windows, this view will be true. If true,
    then the NativeMenu instance to the SystemTrayIcon. If false, then instead assign
    the NativeMenu to the DockIcon Menu. Once the NativeMenu has been assigned to
    the dock or system tray, it then to the context of the backgroundContainer instance.
    The contextMenu is the menu that appears when the user right-clicks on the widget.


    # Minimizing, Restoring, and Setting AlwaysInFront


    Minimizing and restoring the window is as easy as calling the minimize and restore
    methods of the NativeWindow instance. However, in Microsoft Windows, this will
    only minimize the application to the system taskbar. It would be helpful to have
    the application fully disappearing, leaving only the system tray. You can make
    the system taskbar instance by setting the visible property of the NativeWindow
    to false. Just be sure to set it to true when the window is restored; otherwise,
    the user will not be able to see the widget.


    The NativeWindow instance also has an alwaysInFront property that accesses a Boolean.
    This is anytime the settings have been changed. The value comes from WidgetDataModel.getInstance()
    .settings.alwaysInFront. This property controls whether or not the window resides
    in front of all open windows.


    The widget has a menu system and the ability to minimize, restore, and change
    view states. The next section discusses changing view states.


    # Animating the Views


    With the exception of the loader instance, when the view states are aligned to
    the stage, the visible property is set to false. Each view state is defined in
    the <mx:Application> class is changed, and the specified <mx:SetProperty> tags
    are accessed, changing the visibility of the view states and the height and width
    of the background Container. For example, setting currentState equal to WeatherWidget.FOURDAY_FORECAST
    will execute the following set of <mx:SetProperty> instances:


    ```

    <mx:Set name="WeatherWidget.FOURDAY_FORECAST">

    <mx:SetProperty target="loader" name="visible" value="false" />

    ```


