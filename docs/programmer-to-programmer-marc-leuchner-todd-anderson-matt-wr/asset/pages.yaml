  md: '# 12


    # # AIR Video Player


    The past ten years have seen many attempts at bringing video to the Internet.
    Both web-based and desktop-based applications have risen and fallen with usage
    trends, while a few competitors have stood their ground. However, with every new
    player, there is a new data format and another sector of people supporting only
    that technology. The result is a machine that has far too many applications that
    do the same thing. The latest release of Flash Player''s support of the H.264
    codec in combination with Flex 3 and AIR will, with any luck, push the Internet
    industry into using one video format.


    In this chapter, you will build a desktop video player that supports both FLV
    and H.264 video formats. It will have all the basic functionality of a desktop
    video player such as play, pause, rewind, full-screen support, volume, and timeline
    scrubbing controls. The intention of this chapter isn''t necessarily to create
    a video player with a lot of bells and whistles, but to familiarize you with the
    main features of the AIR API. It is hoped that this gives you some ideas for adding
    your own touch to this application.


    While building the video player, the following features in the AIR and Flex APIs
    are discussed:


    +   - Utilizing the Flex VideoDisplay component


    +   - Creating contextual and application menus


    +   - Accessing files from both a system browser window and drag-and-drop events


    +   - Switching between normal and full-screen display states


    The next section discusses the design of the video player.


    # ## Design


    The design of a video player may seem pretty intuitive, and for the most part
    it is. After all, with the success of a website like YouTube, you end up looking
    at a video player every time a friend or colleague sends you another humorous
    or absurd video. At this point, you probably have an idea of'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Chapter 12: AIR Video Player


    the core functionality, as such playback controls, and you could jump right into
    building the player. However, mixing in the AIR functionality while not cluttering
    your application may take some more planning.


    You could create one giant class that contains everything: the video display,
    the video controls, and the integration with AIR. However, you''ll probably want
    to reuse some of the functionality of the player at some point. Therefore, it
    would be better to have a standalone video player that can be used on and off
    the web, the one that you can initiate in a Flex <mx:Application> container or
    an AIR <mx:WindowApplication> container.


    The standalone video player will contain all of the core functionality for the
    AIR Video Player. This functionality will be separated into two separate classes,
    one for the video display and the other for the video controls. It will control
    its functionality such as the following:


    +   **Playback controls:** Every video player has, at a minimum, a play button
    and a rewind button. The play button will toggle between play and states, and
    will change the button''s graphical view (skin) accordingly. Along with the play,
    pause, and rewind controls, you will include a timeline scrubber for jumping to
    different sections of the video, a time indicator that tracks progress, and a
    volume controller.


    +   **Liquid layout:** One key feature of the AIR Video Player is the capability
    to display the video full-screen. To accommodate this, you will need to create
    a layout that adjusts with the size of the video. Instance, if the video expands
    from 300x250 to 640x480 or full-screen, the playback controls needs resize accordingly
    with the expanded display.


    +   **Webcam capture:** This isn''t necessarily needed, but it''s a simple and
    feature to add to the video player. Of course, feel free to exclude this if you
    do not have a webcam.


    After the video player has been created, you will instantiate it in the main <mx:WindowApplication>
    container. The main application component will feature all AIR functionality,
    including the following:


    +   **Drag and drop:** You will enable users to drag and drop FLV or H.264 encoded
    files into the AIR Video Player. Once the file is accepted, you will then pass
    the path to the video player component as its source.


    +   **Full-screen support:** The Flash Player supports a full-screen display state.
    This is especially useful for an application that uses the AIR Video Player and
    is easy to do. Enabling this feature will turn the user''s computer into a virtual
    cinema.


    +   **Context and window menus:** Outside of the drag-and-drop support, the other
    way to open a video is through the window menu. It is helpful to set up a basic
    context menu that offers playback controls during play and pause, along with the
    full-screen toggle.


    Now the basic design and functionality have been defined, you can begin building
    the AIR Video Player. The next section will help you set up the directory structure
    and gather the accompanying files.


    # Building the Directory Structure


    Before structuring how the video player is built, it is important to properly
    set up the directory structure for this chapter. By creating a new directory in
    your local development directory called VideoPlayer. This directory will be your
    working directory for this application.


