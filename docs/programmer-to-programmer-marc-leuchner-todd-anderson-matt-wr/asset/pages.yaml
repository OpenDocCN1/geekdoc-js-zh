  md: '# 9

    Map Application


    MapMap applications are prevalent in today''s online location-based activity.
    Whether you are looking for directions, locating the nearest hotels to your destination,
    or just seeing what it looks to be a bird flying over your town, you are requesting
    information from one of the various services online that can tell you what turn
    to make, where to stay, and where to land. Many of these services have a public
    API that application developers can use to integrate into their own applications.


    The application you will build in this chapter will enable you to search for locations
    using one online map API, add destination markers to locations, and view and edit
    saved destinations without regard to an available network resource. This program
    will continue to delve into the database API discussed in previous chapters and
    introduce you to bridging code between Action-Script and JavaScript in communicating
    with an online service.


    Before you begin building the application, you should consider what you expect
    from a desktop map application. In order to utilize an online service to retrieve
    map information, the following goals should be addressed:


    +   - Communication with an online API through JavaScript to search for locations
    and add destinations


    +   - Communication with a local database to save, view, and edit destination
    information


    The next section discusses how to achieve these goals.


    # Design


    The map application you will build deals primarily in communication — how you
    communicate with an online API to gather and manipulate data, and how you communicate
    with a local database to save and edit that data. How data is presented plays
    as a vital role as the data itself in'
