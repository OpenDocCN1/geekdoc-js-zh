  md: "# Chapter 6: Image Viewer and Editor\n\nCombining with what you have previously\
    \ done in this chapter with regard to managing data, the following addresses display\
    \ that data for browsing, viewing, and editing.\n\n# Browsing Opened Images\n\n\
    Along with displaying a list of available images to select for viewing, the thumbnail\
    \ browser also manages the load queue — ImageLoadQueue — adding files, instructing\
    \ it to load, and listening for each completion. As such, the browser will also\
    \ hold a control for importing all images found in a targeted directory:\n\n+\
    \   1. Open your favorite editor, create a new document, and edit the following\
    \ markup:\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\">\n<mx:Canvas xmlns:mx=\"\
    http://www.adobe.com/2006/mxnl\" creationComplete=\"onCreationComplete();\">\n\
    <mx:Style>\n  .browseControls {\n    background-color: #EEEEEE;\n  }\n</mx:Style>\n\
