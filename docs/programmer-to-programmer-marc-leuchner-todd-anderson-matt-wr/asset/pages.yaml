  md: "# Chapter 6: Image Viewer and Editor\n\nThe former snip, as ImageLoadqueue,\
    \ handles loading files sequentially. A client can add multiple File objects to\
    \ the queue to load and call the jLabel method to begin the process. Alternatively,\
    \ if the process is running, more files can be added if needed. Although the queue\
    \ holds an array of File objects, the files themselves are not buffered into a\
    \ FileStream for processing the data. Instead, the files are loaded using a Loader\
    \ instance that makes a request based on the url property of the instance:\n\n\
    ```\n_loader.load(new URLRequest(_file_url));\n```\n\nThe complete event handler\
    \ of the Loader creates a new ImageData object and dispatches an event of the\
    \ ImageLoaderEvent class that:\n\n```\nvar data:ImageData = new ImageData(_file.name,\
    \ _file.url,\n  (_loader.content as Bitmap).bitMap);\n  dispatchEvent(new ImageLoaderEvent(LOAD,\
    \ data));\n```\n\nAs each file is loaded and the load event is fired, it is determined\
    \ whether there are more files to be loaded or whether the queue has empty. If\
    \ there are no files left to load, then a \"complete\" event is dispatched from\
    \ ImageImageQueue to alert listeners that the load process finishes.\n\nYou may\
    \ notice that different types of files are processed during this queuing. Because\
    \ a text file (in the context of this application) would seem out of place when\
    \ viewing images, the ImageImageQueue runs a check on the extension of the file\
    \ it is requested to load. In so, a regular expression is used to ensure that\
    \ the file is an image in either JPG, JPEG, or PNG format:\n\n```\nprivate var\
    \ _filter:RegExp = /^\\S+\\.(jpg|jpeg|png)$/i;\n```\n\n역시 expression requires\
    \ a book in itself, but for the purposes of this example, it is enough to understand\
    \ that this action matches any file with a name followed by a dot and either of\
    \ the three image extensions, without regard to case. If the url property of a\
    \ File fails to meet this requirement, an invalid event is dispatched and the\
    \ queue moves forward in loading.\n\nAt this point, you have a mechanism for loading\
    \ image files, data objects to represent the file and its graphical data, and\
    \ a manager for all images for viewing and editing. It is time to start displaying\
    \ this data and dive into more aspects of the AIR API.\n\n# Building the User\
    \ Interface\n\nAt the beginning of this chapter was a brief discussion of the\
    \ visual display of the Image Viewer and Editor and user interaction. The main\
    \ class will handle most of the calls to load and save files, as well as the drag-and-drop\
    \ capabilities in the AIR API, and is discussed later in the section \"Bringing\
    \ It All Together.\\ Before diving into the data in saving the data, how the data\
    \ displayed needs to be addressed. There will be three interface views within\
    \ the application:\n\n+   - A thumbnail browser will hold all previously opened\
    \ image files and enable users to select a file to view.\n- An image display will\
    \ show the selected image and enable users to rotate and resize the image.\n-\
    \ An image editor panel will enable all users to manipulate the currently viewed\
    \ image."
