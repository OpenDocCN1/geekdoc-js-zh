  md: '# Summary


    This chapter covered how to open and save files from the user''s hard drive using
    both the file system API and the drag-and-drop API, all while creating an application
    to view and manipulate images. Your work with the file system API in the previous
    chapters has contributed to learning how to spawn a file browser dialog to select
    and open multiple files and save files based on file type.


    After looking at the NativeDataManager class, you learned how to use static methods
    and properties to perform drag-and-drop operations as well as handle NativeDragEvent
    dispatched from a targeted display object. In the discussion of saving images,
    you were introduced to the codecs available in the Flex 3.0 SDK and learned how
    ByteArray data is added to the file stream buffer using the File.writeBytes()
    method.


    In the next chapter you will continue to add to your understanding of AIR by learning
    about local databases as you create a Simple Calendar and Tracker.'
