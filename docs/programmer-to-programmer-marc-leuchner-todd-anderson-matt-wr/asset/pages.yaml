  md: "# Chapter 9: Map Application\n\nEach object implements the IDEntry interface\
    \ to encode and decode their string attributes to from a URL-encoded format.\n\
    \nThe LocationVO class holds information related to a location. The name property\
    \ relates to the information entered by a user, and the content property represents\
    \ the graphical content displayed.\n\nThe MarkerVO class holds information related\
    \ to a destination. The x and y properties represent the coordinates of the destination\
    \ on the screen. The jsid property pertains to the ID to a marker added through\
    \ the Yahoo! Maps AJAX API and the caption attribute is the user-inputted caption\
    \ relating to destination.\n\nThe id property on each of these objects is the\
    \ unique ID to an object when it has been entered into a database. Notice that\
    \ the ID on both data objects is defaulted to a value of -1 during instantiation.\
    \ The map application will use this value to determine whether the information\
    \ is a new entry to the database or represent an existing entry.\n\nThe LocationId\
    \ on MarkerVO is important. This value relates to the ID to a location held in\
    \ the database. In terms of database structure that we added later in this chapter,\
    \ each of these values — LocationVO and MarkerVO — relates to two separate tables\
    \ of data. By assigning a field in a destination relative to the unique ID to\
    \ a location, you can link locations using a relational database.\n\nIn the next\
    \ section we will create the overall model that will interact with edit and update\
    \ these location and destination objects.\n\n# The Data Model\n\nIn the previous\
    \ section, you created the information objects used to represent destinations-based\
    \ locations. In this section, you will create the model to access and update that.\
    \ Since the map application enables you to work without an Internet connection,\
    \ multiple views are needed to present information based on the availability of\
    \ a network resource. By registering event listeners in display classes to provide\
    \ updates from a common model, you can ensure that the data being displayed is\
    \ consistent. The display views are covered shortly, by the Map Application but\
    \ first you can get to work on the model.\n\nCreate a new document and enter the\
    \ following ActionScript:\n\n```\npackage com.aircmr.locator.data\n{\n    import\
    \ flash.events.EventDispatcher;\n\n    import mx.collections.ArrayCollection;\n\
    \n    @Bindable\n    public class LocatorDataManager extends EventDispatcher\n\
