  md: '# 11 Slideshow Maker


    Since the dawn of what is commonly referred to as the Projector Age, vacations
    and slideshows have gone hand in hand. While the popularity of taking pictures
    of the same object from different angles did not coincide with this period, being
    able to show them singled out and blown up. In this chapter you will build an
    AIR application that enables you to create individual slides and organize slideshows
    to capture those very special moments in a sequence. (While slideshows are fun
    to create, they are not always fun to be subjected to. The examples in this chapter
    do not present an algorithm for keeping people from wondering whether the slideshow
    will ever end.)


    The application will enable you to save your work on ovation-inspiring slideshow,
    to continue working either from the same computer at a later date or on another
    computer with the application installed. This program introduces invoking your
    application using associated file types as well as OS-level notifications. In
    continuing with your knowledge of the AIR file system API you will also learn
    how to serialize objects to a file.


    Along with creating individual slides and organizing the order of a slideshow,
    the application has multiple displays as they pertain to creating and presenting
    a slideshow. With this in mind, the Slideshow Maker will handle the following
    actions:


    +   - Switching between a workspace and presentation

    - Navigating through a slideshow presentation

    - Alerting a user to unsaved changes in a slideshow prior to closing the application


    The capability to save and open individual slides and slideshows is also a crucial
    part of the application and entails the following:


    +   - Opening and saving slideshows

    - Importing and exporting single slides

    - Invoking the application to open slide and slideshow files associated with the
    application


    The next section discusses the plan to achieve these goals.'
