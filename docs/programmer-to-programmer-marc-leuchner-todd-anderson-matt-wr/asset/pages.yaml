    \ instance. In this, the connection property is set to the local variable _connection,\
    \ which was created in the init function. Then the result handler for the statement\
    \ is set by the resultHandler parameter, and the text property is set by the query\
    \ parameter.\n\nThe statement is nearly ready to be executed; one more step is\
    \ necessary. As a precaution, the parameters of the statement are defined by modifying\
    \ the parameters property. This property serves as an associative array to which\
    \ you add values for the parameters specified in the statement's text property.\
    \ The array keys are the names of the parameters. Setting the parameters of the\
    \ statement in this manner is a defensive measure to prevent a malicious technique\
    \ known as SQL injection. In an SQL injection attack, a user attempts to insert\
    \ or her SQL statements through user-accessible locations. Finally, to execute\
    \ the statement, the execute method is called.\n\nMake the following changes and\
