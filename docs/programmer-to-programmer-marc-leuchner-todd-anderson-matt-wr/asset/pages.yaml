  md: '# Chapter 9: Map Application


    Save the file as Locator-app.xml in the root of your working directory along with
    the Locator.mxml and ymap.html files.


    This file will serve as the application descriptor file. The element values from
    this snippet are generic and can be changed as you see fit. When the Locator application
    is installed, the application directory will be found within the AIRM folder of
    the application directory of your operating system. When the database is created
    and the ymap.html file is copied over the application storage directory, they
    can be found in a folder named com.airm.Locator, which is the node value of the
    id element for the application descriptor file.


    With the descriptor file in place, you''re set to compile and package the AIR
    executable.


    # Compiling and Packaging


    Recall that two files are necessary to package an AIR application — the main SWF
    file and the XML application descriptor file. In this section you will produce
    the SWF file using the command-line tools and package the AIR application.


    The graphic asset marker_red.png is an embedded graphic in the Marker class and
    can be found in the assets folder included with the source code for chapter on
    the accompanying website, or you can create your own. If you are following the
    examples in this chapter, the graphic asset needs to reside in a folder named
    assets in order to compile the source.


    Open a command prompt, navigate to the working directory for the Locator map application,
    enter the following command, and press Enter:


    ```

    > amxmlc Locator.mxml

    ```


    If you have purchased a certificate from a certificate authority, such as VerSign
    or Thawte, then you can use that certificate, rather than create the self-signed
    certificate, and can skip the following operation. To create a self-signed certificate
    within the working directory, enter the following command:


    ```

    > adt -certificate -cn Locator 1024-RSA certificate.pfx

    ```


    With the command prompt pointing to the working directory, enter the following
    command to package the Locator application:


    ```

    > adt -package -storetype pkcs12 -keystore certificate.pfx Locator.air Locator-app.xml
    Locator.swf ymap.html

    ```


    You will be prompted to enter the password for the certificate. If you created
    a self-signed certificate from the second command, enter password. Running these
    commands, a Locator.swf file, a certificate.pfx file, and the Locator.air installer
    file are generated within your working directory.


    Once the installer has been created, navigate to your working directory and double-click
    the AIR installer to install and run the Locator. If all goes well, the application
    will launch and be ready to navigate to locations and start adding destination
    markers. Figure 9-1 shows what the application looks like online mode.


