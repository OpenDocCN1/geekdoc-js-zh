  md: '# Chapter 7: HTML and CSS Editor


    # Summary


    In this chapter you learned how to create an application that is essentially centered
    on AIR''s HTML component. You learned about the component''s native events, some
    of its properties, and most importantly, its domWindow property. Through this
    property you learned how to access the JavaScript DOM of the loaded HTML content
    and thus integrate JavaScript and ActionScript. This integration enabled your
    application to perform its most important functionality: to dynamically modify
    HTML and CSS content. Finally, you utilized some of the techniques that you learned
    in previous chapters to save simple text files to the user''s hard drive.


    In the next chapter you will again expand your experience with AIR and learn how
    to build a weather widget.'
