  md: "# Chapter 7: HTML and CSS Editor\n\n```\npublic var affectedStyle:CSSStyle;\n\
    public var affectedProperty:CSSProperty;\n\npublic function CSSDEitorEvent(type:String,\
    \ style:CSSStyle,\n prop:CSSStyleProperty = null)\n{\n    super( );\n    affectedStyle\
    \ = style;\n    affectedProperty = prop;\n}\n\n```\n\nSave the file as CSSEditorEvent.as\
    \ in the directory com/a/htmlcsseditor/events/ within your working directory.\n\
    \nThe CSSEditor class will be used by the MXML component (which will build shortly)\
    \ whenever a user adds or a style or property. The static properties of this class\
    \ describe the three types of events that the CSS editor dispatch. Each type of\
    \ event will require a slightly different action by the application shall, all\
    \ three events need nothing more than a reference to the modified style and/ property,\
    \ which can be accessed by the affectedStyle and affectedProperty properties\n\
    \nWith the data classes and custom event completed, it is now time to move to\
    \ the MXML component and make use of all this functionality.\n\n# User Interface\
    \ and Logic\n\nAgain, in comparison to the HTML editor, the CSS editor is a bit\
    \ more complicated, in terms of both its list and user interface. The meat and\
    \ potatoes of the UI in this case will be, as mentioned previously, a list component\
    \ for the list of styles and a DataGrid component for the list of properties of\
    \ the selected style. These are paired with a set of buttons that enables users\
    \ to modify the respective data. A few of these buttons will trigger a prompt,\
    \ specifically when the user wants to add a style or property, or view the full\
    \ CSS source.\n\nIn addition to the beefed-up UI, the logic is a bit longer as\
    \ well. This is because of instead reading a property within the DOM, the component\
    \ must parse the stylesheet data and convert it into the friendly objects you\
    \ created. As you will, this component is a great example of how to integrate\
    \ JavaScript with ActionScript.\n\n+   1. Open your editor and create a new document.\
    \ Enter the following markup:\n\n```\n<xml version=\"1.0\" encoding=\"utf-8?>\n\
    <mx:Panel xmlns=\"http://www.adobe.com/2006/mxml\"\nwidth=\"300\" height=\"120\"\
    \ title=\"Add Style\"\nborderColor=\"#EEEEAEA\" borderAlpha=\"1\">\n<mx:Script><![CDATA[\n\
    import com.aircmrl.htmlcsseditor.data.CSSStyle;\n```\n\n216"
