  md: '# # Chapter 11: Slideshow Maker


    # # Design


    Spawning operating system (OS) native windows enables to separate presentation
    layers on the desktop. In breaking from the mold of a web-based Flex application,
    an AIR application can present any number of native windows that are not confined
    to the visible bounds of the main application window. The Slideshow Maker uses
    the AIR API to present the workspace in the main application window from which
    you can launch a full-screen presentation and spawn notification of unsaved data
    prior to closing the workspace.


    Using the AIR file system API, you can create an object to buffer the of a filestream
    that is serialized using the ActionScript Messageing Format (AMF). AMF encodes
    objects to a binary format, and writing that data to a filestream outputs a copy
    on your hard drive. Built-in object types, such as Boolean and String, are automatically
    serialized.


    The custom data that you create for the Slideshow Maker will not be automatically
    serialized with their associated custom type. Though public properties of a built-in
    type can be serialized, properties of a custom type are not inherently serialized
    as As, you will register each data object with a class-alias in order to map the
    object read into the filestream to a custom type.


    The serialization of custom objects will be used to save files associated with
    individual slides and sets of slides. The Slideshow and slideshow files have unique
    extensions that will extend the Slideshow Maker as the default application. This
    enables you to open a slide or slideshow file in the Slideshow Maker whether not
    the application is currently running. This operation addresses the invocation
    of the previous section and involves handling an event from the Nativeapplication
    instance of the AIR application.


    The next section covers the data objects that the application serializes to a
    file and how the Slideshow Maker manages that data during an opened session.


    # # Handling Data


    A slideshow is just a series of slides, and each slide has its own data. As addressed
    in the previous section, the data objects will be serialized to files. You will
    expose public properties to be serialized along the object and mark some properties
    to not be serialized. Properties tagged to not be encoded along are considered
    session-related and are remembered only while the application is open.


    # # Creating Serializable Data Objects


    The slides you create in the Slideshow Maker application are relatively simple
    in that they present an image and a caption. The image held on the slide model
    is itself a serializable data object as well, and holds the graphical data pertaining
    to that slide. In this section you will create those two data objects.


    Within your development directory, create a folder titled SlidesMaker. This will
    be your working directory for the application. With that set, you can get to work:'
