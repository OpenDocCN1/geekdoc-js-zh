  md: '# Chapter 2: Simple Text Editor


    first real AIR application and learned a little about the AIR file system API.
    Specifically, this chapter covered the File and FileStream objects, and described
    a few methods associated with each. You also learned how to use these objects
    when reading and writing files to a user''s hard drive.


    Along with learning these file system basics, you also discovered how to gain
    some basic information about your users'' systems by accessing some static properties
    of the File class. This information included where the user''s documents directory
    resides, and the line-ending character sequence of the user''s operating system.


    Lastly, you learned how to access the operating system''s standard Open and Save
    dialog windows through the available methods of the File object. Not too shabby
    for your first AIR application. In the next chapter you will learn even more about
    the file system API, along with a few other great features of AIR, by creating
    a simple RSS reader.'
