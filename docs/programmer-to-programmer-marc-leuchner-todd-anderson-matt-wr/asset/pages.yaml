  md: "# Chapter 4: Music Player\n\nNow that you know what you're loading and to where\
    \ you're loading it, it's time to take a look at how\nload it. The next section\
    \ discusses the ApplicationDataModel class.\n\n# ApplicationDataModel\n\nThe ApplicationDataModel\
    \ class serves as a way to control all of the data being loaded into the applicli-\n\
    cation, and to ensure that you never have duplicate data. It is a Singleton, meaning\
    \ that it can only\nbe instantiated. If you try to call new ApplicationDataModel(),\
    \ the debugger throws an error.\nTherefore, you refer to the Application ApplicationDataModel\
    \ by calling its getInstance(). When you call\nApplicationDataModel.GetInstance(),\
    \ it returns a reference to the class. If this is the first time the method\n\
    has called, a new instance of the class is created and returned, but this is the\
    \ only time this instance\nis created.\n\nWhat is the benefit of a Singleton in\
    \ this situation? By only having one instance of the\nApplicationDataModel, you\
    \ can have complete access to the application data no matter where you are.\n\
    Any change in one class will affect all other classes. This is especially useful\
