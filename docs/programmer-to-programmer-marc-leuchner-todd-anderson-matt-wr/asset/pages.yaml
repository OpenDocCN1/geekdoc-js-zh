  md: '# Chapter 4: Music Player


    # Handling Time Stamps


    Another feature that be handy is the capability to display the trackPosition in
    terms of elapsed time. The trackPosition value is represented in seconds. Unfortunately,
    most video time stamps are represented as 01:30, meaning one minute and thirty
    seconds. In order to format the time in such a manner, use a DateFormatter.


    ```

    <mx:DateFormatter id="timeFormatter" formatString="NN:SS" />

    ```


    The DateFormatter will format the trackPosition into ''NN:SS'', which represents
    minute : second second. You can access this by calling the following:


    ```

    timeFormatter.format( new Date(trackPosition) )

    ```


    The Date class allows for a Date object to be sent through the format method.
    By passing a new Date object with the trackPosition value to the DateFormatter,
    the result is a String that looks like 01:30.


    The labels of HSlider are updated by setting the labels property to the Bindable_labelArray.
    When the trackPosition property is updated by the application controller, _labelArray
    is rewritten with two strings: timeLeft and timeElapsed. Both values are parsed
    in the NN:SS format using the DateFormatter. The effect is a display that is similar
    to the Apple iTunes progress display.


    # PlaylistView


