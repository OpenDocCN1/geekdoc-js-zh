  md: "```\npackage com.apolloir.htmlcsseditor.data\n{\n    public class CSSStyleProperty\
    \ {\n\n        private var _name:String;\n        private var _value:String;\n\
    \n        public function CSSStyleProperty(name:String, value:String = \\*) {\n\
    \            _name = name;\n            _value = value;\n        }\n\n       \
    \ public function getName():String { return _name; }\n        public function\
    \ getvalue():String { return _value; }\n        public function setvalue(v:String):void\
    \ { _value = v; }\n    }\n}\n```\n\n+   4. Save the file as CSSStyle.class in\
    \ the directory com/aircm/htmlcsseditor/data/ within your working directory.\n\
    \nIn steps 1 and 2, you created the CSSStyle class. The purpose of this class\
    \ is to abstract the relevant data of a CSS style for the application so it can\
    \ be managed within ActionScript. If you are not familiar with JavaScript or how\
    \ to access CSS information from the DOM, you might be wondering what the properties\
    \ in this class are. Briefly, stylesheet and cssRuleIndex references to the index\
    \ of their respective arrays within the DOM. This information will be especially\
    \ handy when the user modifies or adds a style or its properties in any way. Also\
    \ included in the class are some helpful methods for adding and deleting the properties\
    \ of a style, and for just getting the text of the property.\n\nIn steps 3 and\
    \ 4, you created the CSSStyleProperty class. This class simply represents a property\
    \ of a CSS style. Thus, a CSSStyle object also contains an array of CSSStyleProperty\
    \ objects. This array will eventually become the data provider for the aforementioned\
    \ DataGrid component.\n\nNow, because it is necessary for the editor to notify\
    \ the application when a user modifies or adds a style or property, a custom event\
    \ is needed. This event must contain information about the modified property or\
    \ style. Open your editor and create a new event. Enter the following markup:\n\
    \n```\npackage com.apolloir.htmlcsseditor.events\n{\n    import flash.events.Event;\n\
    \    import com.apolloir.htmlcsseditor.data.CSSStyle;\n    import com.apolloir.htmlcsseditor.data.CSSStyleProperty;\n\
    \n    public class CSSEditorEvent extends Event {\n        public static const\
    \ ADD_STYLE:String = \"addStyle\";\n        public static const CHANGE_PROPERTY:String\
    \ = \"changeProperty\";\n    }\n}\n```"
