  md: "# Chapter 4: Music Player\n\n# Copying Local Files\n\nFirst, it is important\
    \ to find out if and when the file exists. In the XMLFileService class, you are\
    \ checking to see whether the settings file resides in applicationStorageDirectory\
    \ using resolvePath() and the File class exists Boolean property:\n\n```\nvar\
    \ sourceFile:File = File.applicationStorageDirectory.resolvePath(fileName);\n\
    if (!sourceFile.exists) {\n    dispatchEvent(new Event(XMLFileService.FILE_NOT_FOUND));\n\
    \    return;\n}\n```\n\nWhen first run the music player, the settings.xml file\
    \ will not exist in their application directory. The class will instance a FILE_NOT_FOUND\
    \ event, and it is up to the controller, MusicPlayer.XML, to make the move. If\
    \ the file does not in the storage directory, then it needs to be created.\n\n\
    There is a settings.xml file that contains some basic data located in the application\
    \ directory. You can read the file from the application directory by referencing\
    \ the File class applicationDirectory property, instead of applicationStorageDirectory.\n\
    \nBecause of the features inside AIR, you will not be able to write back to the\
    \ application directory. This directory is used to store data and assets for which\
    \ you want read-only access. Writing restrictions are quite a problem because\
    \ the application needs to write the user's preferences to settings.xml. The XMLFileService\
    \ should copy the file from this directory to the storage directory when it is\
    \ not found in storage. The next time the application is instantiated, the settings.xml\
    \ file will be found. This is accomplished in the copyXMLFromDirectoryToStorage\
    \ method using the File class:\n\n```\nsourceFile.file = copyToAsync(resultFile,\
    \ true );\n```\n\nIn this case, sourceFile is contained in the application directory,\
    \ and resultFile is the path to the settings.xml file that will be written to\
    \ the storage directory. Because this method is asynchronous, listeners will monitor\
    \ whether the copy is successful or an error occurs. Should the copy be successful,\
    \ the XMLFileService will try to load the XML from the storage directory. After\
    \ the XML has been loaded, an instance of the XMLFileService is created.\n\n#\
    \ Writing XML Data to Files\n\nThe music player application stores the settings.xml\
    \ and musicdatabase.xml files in the storage directory. If the user has added\
    \ new settings, or a new query is fetched for, these files are rewritten. In terms\
    \ of the musicdatabase.xml file, if one does not exist, AIR will create one. In\
    \ either situation, the first thing that needs to happen is the declaration of\
    \ the encoding header:\n\n```\nvar xml_encoding:String = \"<?xml version='1.0'\
    \ encoding='utf-8'?>\";\n```\n\nThis string tells the XML how to be formed. However,\
    \ writing encoding='utf-8' does not mean anything if the file is not actually\
    \ written as a UTF-encoded document. To write a UTF encoded document, open a new\
    \ FileStream asynchronously and use the writeUTFBytes() method:"
