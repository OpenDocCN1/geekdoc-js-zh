  md: "In the previous six steps, you created the necessary data object classes. These\
    \ classes will serve as ActionScript representations of the information stored\
    \ in the database. The Blog and BlogEntry classes contain the necessary properties\
    \ that need to be transferred throughout the application. The property names should\
    \ be self-explanatory. The PublishqueueItem class will be used to parse a Blog\
    \ and a BlogEntry together when managing the publish queue.\n\n# Event Objects\n\
    \nThis application will use of one custom event class. Specifically, it will be\
    \ used by the DBService class to notify any listening objects of a few key events.\
    \ This custom event class is necessary because any actions performed on a local\
    \ SQLite database occur asynchronously. The event class enables the application\
    \ to send result data to any listening objects when the operation has completed.\n\
