  md: "# Opening and Saving from the File API\n\nThe first item in the initial VBox\
    \ container is a MenuBar with menu items for opening and saving a file:\n\n```\n\
    <mx:MenuBar id=\"menuBar\"\n  width=\"100%\"\n  labelField=\"@label\"\n  itemClick=\"\
    onMenuItem( event );\"\n  <mx:XMLList>\n    <menuitem label=\"File\">\n      <menuitem\
    \ label=\"MENU_OPEN\" />\n      <menuitem label=\"MENU_SAVE\" />\n      <menuitem\
    \ label=\"MENU_SAVE_AS\" />\n    </menuitem>\n  </mx:XMLList>\n</mx:MenuBar>\n\
    ```\n\nUpon selection of an item from the File drop-down, the appropriate action\
    \ is taken in the itemClick event handler of applicationComplete event handler\
    \ of the imageView. The _exportFile instance handles saving operations. When the\
    \ Option is selected, the _exportFile opens a file browser with multiple selection\
    \ turned on by calling the browseForMultiple()method).\n\n```\n_exportFile.browseForMultiple(\"\
    Select Files\", [IMG_FILTER]);\n```\n\nThe first parameter of browseForOpenFile()\
    \ is the title to be displayed in the file browser. The second parameter is an\
    \ array of FileFilter objects that indicate the files to be displayed in the file\
    \ browser. Because the Image Viewer and Editor works only with image formats,\
    \ only files with the extension of .jpg, .jpeg, or .png are allowed to be selected\
    \ and shown within the file browser.\n\nAlong with the Option select, there are\
    \ two options for saving images from the File menu. The first option saves the\
    \ data back to the originally opened file, and the second opens a file browser\
    \ to enable a user to save the image into a desired directory with a different\
    \ name:\n\n```\nprivate function saveImage(event):void\n{\n  if(_currentImage\
    \ == null) return;\n  _exportFile.url = _currentImage.url;\n  _exportFile.browseForSave(\"\
    Save File As...\");\n}\n```\n\nPrior to calling browseForSave(), the url property\
    \ on _exportFile is set to the url property of the currently displayed image.\
    \ This action opens the file browser dialog that enables a user to choose a desired\
    \ directory and/ rename the image. The parameter of browseForSave() on the File\
    \ class is the same as the first parameter of browseForOpenFile()and relates to\
    \ the title to be displayed in the file dialog."
