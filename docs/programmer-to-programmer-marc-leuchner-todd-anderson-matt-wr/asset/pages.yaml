    This method is called when either going into or coming out of full-mode. The display
    state can be detected by checking the value of stage.displayState against any
    of the public constants contained in the StageDisplayState class.


    If the stage.displayState is equal to StageDisplayState.FULL_SCREEN_INTERACTIVE,
    then the height and width properties of UIVideoPlayer are adjusted to fit the
    full screen. Additionally, the context menu is changed to enable the user to exit
    full screen, and the controls in the UIVideoPlayer are removed, as illustrated
    in Figure 12-6. Likewise, the interface and the size of UIVideoPlayer are restored
    if the stage.displayState is equal to StageDisplayState.NORMAL.


