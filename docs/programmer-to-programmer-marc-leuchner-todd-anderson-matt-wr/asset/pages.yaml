  md: "# Chapter 6: Image Viewer and Editor\n\nThe source of the ImageDisplay instance\
    \ is updated by a change to the supplied ImageData object, which occurs when a\
    \ new image is selected for viewing. Take a closer look into ImageDisplay to see\
    \ how that data is rendered:\n\n```\npublic function set source(bmp:BitmapData):void\n\
    {\n  _imgSource = bmp;\n  _rotation = 0;\n  _image.bitmapData = _imgSource;\n\
    \  doLayout();\n}\n```\n\nAn update to the source property resets the initial\
    \ rotation and bitmapData property of its Image child and makes a call to the\
    \ doLayout() method. The doLayout() method handles rendering of bitmap data with\
    \ regard to scale and rotation properties fromCanvas discussed earlier in this\
    \ section. The setter methods for these properties, scale and rotation, can doLayout()\
    \ as well:\n\n```\nprivate function doLayout(evt:Event = null):void\n  if(_imgSource\
    \ == null) return;\n  _image.rotation = _rotation;\n  _image.scaleY = _scale;\n\
    \n  var bounds:Rectangle = getImageBounds();\n  _image.x = bounds.x;\n  _image.y\
    \ = bounds.y;\n\n  _holder.width = _image.width;\n  _holder.height = _image.height;\n\
    \  _holder.x = Math.max(0, ( width - bounds.width ) / 2 );\n  _holder.y = Math.max(0,\
    \ ( height - bounds.height ) / 2 );\n\n  if(isVisible == false)\n    invalidateList();\n\
    ```\n\nThe doLayout() method handles the positioning of the scaled and rotated\
    \ image within the display. The positioning of the image and its parent—the private\
    \ _holder—base their coordinates on a Rectangle object returned from the getImageBounds()\
    \ method. The properties of Rectangle itself are based on rotation and scale values.\
    \ You may notice in the getImageBounds() method that the width and height of an\
    \ image at 90 and 270 degrees are determined by the bitwise operation EXCLUSIVE-OR(or\
    \ XOR). This operation is an easy way to swap image values of two variables without\
    \ creating a third value.\n\nAside from displaying the image with the bounds by\
    \ rotation and scale, ImageDisplay dispatches a dragCopy event. The dragCopy event\
    \ is fired from the mouseDown handler on the image holder. This is picked up from\
    \ the main application and triggers the operation that enables a user to drag\
    \ and save an image into a directory.\n\nUsing the Image Viewer and Editor to\
    \ drag an image into one directory into another directory is neat and all, but\
    \ it results in having the same image file in two locations. The section delves\
    \ into manipulating that image so that least space on the hard drive is worth\
    \ it."
