    # Summary


    This chapter covered monitoring the availability of an online service and presence,
    developing an application that runs in the background and is accessed through
    the native menus of the system tray or dock icon. Detecting the operating system
    using the supportsDock property of the NativeApplication class was introduced
    to determine the type of InteractiveIcon available for the application. The NativeMenu
    class was introduced and applied to the application to enable access to commands
    while the main application performs tasks in the background.


    While incorporating these techniques into developing a desktop RSS reader, you
    were also introduced to some additional features of the windowing API as they
    relate to the system properties and native window types. Using the lightweight
    NativeWindowType, an unobtrusive toaster-style alert is presented as new posts
    are received by the application, creating an enjoyable reading experience as you
    catch up on the latest news.


    You can take what you have learned from building the RSS reader and find another
    target or even fields. The concepts introduced in this chapter also apply to any
    number of other applications that are intended to run in the background and present
    users with application-specific windows.'
