    If you run the application with just the change states, the window would immediately
    resize and the four-day forecast would be displayed. It would be nice to add a
    little animation to it. Creating a <mx:Transition> instance will just do that.


    The <mx:Transition> is assigned from a state to a state value. In this, if the
    widget changes states, it should be animated. The nested <mx:Resize> instance
    sets the action that will be executed during the transition. It is assigned the
    backgroundContainer as a target with a duration of 350 milliseconds and a easeOutEasingFunction.
    Once the transition is finished, the backgroundContainer will animate to the new
    state as specified in the <mx:SetProperty> instance of the called <mx:State>.
    When the transition is finished, it calls the effectEnd method, which calls checkWidgetLocation
    method to ensure that the weather widget is on the desktop. The result is a wonderfully
    animated state.


    # Accessing the Data


    The weather widget has four sets with animations and menus. The last development
    step is loading the data model. The data model classes are set up and ready to
    go, you just have to access them. The ideal place to do this is in the onCreateComplete
    handler method which is called once the <MX:Applications> has completed the instantiation.


    First, create a reference to the WidgetDataModel and assign listener instances
    for the data events:


    ```

    _dataModelInstance = WidgetDataModel.getInstance();

    _dataModelInstance.settings.setXMLLocation = "settings.xml";

    _dataModelInstance.addEventListener(

    WidgetDataModel.SETTINGS_CHANGE , onSettingsChange);

    _dataModelInstance.addEventListener(

    WidgetDataModel.CURRENT_FORECAST_CHANGE , onWeatherFeed);

    ```


    The onSettingsChange method checks whether a code is specified. If it isn''t,
    the view state switches to WeatherWidget. If a code is specified, then onSettingsChange
    accesses the loadWeatherFeed() method. The settings methods are discussed in more
    detail later in this chapter.


    The getWeatherFeed method begins the interval timer, setting the currentState
    to the last state or to the default WeatherWidget.CURRENT_FORECAST state. It also
    sets the TrayIcon with the current temperature and sets the private _lastUpdated
    string to the current time stamp. It calls buildNative, which changes the NativeMenu
    to reflect the latest state and time stamp changes.


