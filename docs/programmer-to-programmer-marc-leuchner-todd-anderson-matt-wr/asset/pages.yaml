  md: "# Chapter 1: The Development Environment\n\nApache ANT (from here referred\
    \ to as ANT) is a Java tool that uses XML markup to describe tasks and dependencies\
    \ in automating the software build process. If you do not have ANT installed on\
    \ your computer, you will need to install it. Download the latest distribution\
    \ from http://apache.org/bin/download.cgi.\n\nInstall ANT in a directory that\
    \ makes sense with your workflow — for example, C:/ant on Windows. You will also\
    \ need to add a path to your ANT installation in Environment Variables.\n\nIf\
    \ you work on a Mac, you may already have ANT installed. Open a Terminal and type\
    \ > ant-version. If you are presented with a 'command not found' message, then\
    \ either you not have ANT installed on your machine or you do not have a path\
    \ to the installation /bin directory set. If this is the case, install ANT in\
    \ the /usr/local directory and perform the following steps.\n\nTo add a path to\
    \ your ANT installation on Windows, follow these steps:\n\n+   1. Click Start\
    \ > Control Panel > System.\n2. Select the Advanced tab from the menu.\n3. Click\
    \ Environment Variables.\n4. Within the Systems Variables grid, navigate to and\
    \ double-click on Path.\n5. In the Variable value, add a semicolon;) and then\
    \ the path to the /bin folder within your ANT installation directory. For the\
    \ purposes of this example, that is : C:\\ant\\bin.\n\nFollow these steps to add\
    \ your ANT installation on Mac:\n\n+   1. Open the terminal and type open -e profile.\n\
    2. Add a colon (:) and the path to the /bin folder within your ANT installation\
    \ directory. For the purposes of this example, that is : /usr/local/ant/bin.\n\
    \nRunning ANT from command line requires a build file within the directory in\
    \ which it is called. The ANT build file is an XML markup describing tasks and\
    \ dependencies for the build process. Properties can also be set in the build\
    \ file, using the $(property) construct within. A property file can also be set\
    \ in the build file to separate the property-value pairs from the build file.\n\
    \nCreate the build file as it relates to the Hello World application you built\
    \ in this chapter:\n\n+   1. Enter the following markup in any text editor:\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!--==================================================\n\
    <!-- AIR Application Build File (Ant) -->\n<!--==================================================-->\n\
    \n<project name=\"AIR Application\" default=\"main\" basedir=\">\n\n  <property\
    \ name=\"app.name\" value=\"HelloWorld\" />\n  <property name=\"desc.name\" value=\"\
    HelloWorld-app\" />\n```"
