  md: '# HTML and CSS Editor


    Now that you have a basic understanding of the Html component, it''s a good time
    to center around it, and a perfect program would be an HTML and CSS editor. As
    with the text editor from Chapter 2, it''s probably safe to assume that everyone
    has their own editor for both HTML and CSS. In an attempt to make this program
    unique, the application you will create in this chapter will allow the user to
    edit the HTML and CSS of any page, online or offline. Essentially, it will be
    a very basic web browser with the capability to edit the current page''s HTML
    and CSS source. Just think of the possibilities you''ll have with editing the
    source of your favorite web page without having to save all the assets to your
    computer.


    The main objective of this program is to illustrate how easy it is to manipulate
    the JavaScript Object Model (DOM) of any HTML page that is loaded into the AIR
    HTML component. Do not fret if your JavaScript scripts are up to snuff because
    all the code will look very familiar. Remember that ActionScript and JavaScript
    are both based on ECMAScript. The program will use the same techniques from Chapter
    2 to enable users to export the edited HTML and CSS, which are just plain text
    files, to hard drive.


    Specifically, the application will need to perform the following tasks:


    +   - Load and display an HTML page from a URL.

    - Load and display an HTML page from the user''s hard drive.

    - Display the HTML source within the <body> tag of the loaded page.

    - Display a selectable list of all the CSS styles from the loaded page.

    - Display a selectable list of all the properties of a particular style.

    - Enable users to edit the HTML source of the current page.

    - Enable users to add and edit styles for the current page.

    - Enable users to add, edit, and delete properties for a selected style.

    - Enable users to save the HTML and CSS source to their hard drive.

    - Enable users to revert back to the original source.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 7: HTML and CSS Editor


    Now that you have a nice list of actions the program should perform, it’s time
    to assess what you have at your disposal to achieve this particular functionality.


    # Design


    You''ve already learned a few things in previous chapters that should make this
    chapter relatively easy. Specifically, you''ve learned how to save text files
    to a user''s hard drive using the File and FileStream classes. You''ve also learned
    how to display HTML-formatted content using the AIR HTML component. In addition
    to these things, you will now learn how to use the HTML component''s dom property.
    This property will act as your gateway to the world of JavaScript, which in turn
    enable you to go wild with all the methods and properties it contains. In the
    end, this application will not only display the content and enable users to save
    it locally, will enable users to dynamically edit the content and update the display
    by accessing the appropriate JavaScript methods and properties directly inline
    with ActionScript.


    Based on the functionality requirements listed previously, the application will
    require the following


    +   - Application shell

    - HTML preview

    - HTML editor

    - CSS editor

    - Address bar


    On an abstract level, the application shell is going to manage the changes made
    in all the other components and update the HTML preview accordingly. It will also
    manage the display by utilizing a navigation system that users can easily switch
    between the preview, the HTML editor, and the CSS editor.


    Before you do anything, create within your development directory a folder “HTML+CSS
    Editor.” In previous chapters, this will be your working directory for this application.


    # The Address Bar


    The address bar is perhaps the simplest component of the application, and is thus
    a good place to start. This component will enable users to type in a website URL
    or browse their computer''s hard drive for an HTML document. The path or URL will
    then be used by an instance of AIR''s HTML component to update its location property.


    Open your editor and create a new document. Enter the following markup:


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <mx:Canvas xmlns:mxml="http://www.adobe.com/2006/mxml"

    width="800" height="42">

    <mx:Script><![CDATA[

    ```


