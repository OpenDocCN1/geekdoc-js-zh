  md: '# Chapter 11: Slideshow Maker


    ```

    <contentType>application/x-amf</contentType>

    </fileType>

    ```


    The elements of a <file> declaration represent the name, extension, description,
    and content-type associated with the file. In looking at the values associated
    with a slide file:


    +   - The <name> element represents the file type name that identifies the extension
    on the operating system. The format for this example is a dot-delimited reversed-DNS
    string with the file type at the end.

    - The <extension> element is the extension for the file without the preceding
    character. When the application is installed, files with this extension will be
    associated with the application.

    - The <description> element is the description of the file type. This will appear
    in the properties of a slide.

    - The <contentType> element specifies the MIME type for the file. Because the
    Slideshow Maker serializes objects to a file using AMF, application/x-amf is specified
    as the known content-type of the file.


    Files with extension .slide and .show will register the Slideshow Maker as the
    default system for handling when the application is installed. This enables you
    to export slides and slideshows from the workspace and open them with the Slideshow
    Maker by choosing File ➜ Open With and double-clicking on the file itself, unless
    the application is currently open or not — the invoke handler of the main application
    will handle that for you.


    In the next section, you will break out the command prompt and deploy the Slideshow
    Maker application for installation.


    # Compiling and Packaging


    Two files are necessary to package the Slideshow Maker AIR application — the main
    SWF file and the XML application descriptor file. In this section you will produce
    the SWF file and package the application using the command-line tools from the
    AIR SDK.


    Open a command prompt, navigate to the working directory for the Slideshow Maker
    map application, enter the following command, and press Enter:


    ```

    > amxml SlideshowMaker.xml

    ```


    If you have purchased a certificate from a certificate authority, such as VeriSign
    or Thawte, you may use that certificate, rather than create the self-signed certificate,
    and skip the following operation. To create a self-signed certificate within the
    working directory, the the following command:


    ```

    > adt -certificate -cn SlideshowMaker 1024-RSA certificate.pfx password

    ```'
