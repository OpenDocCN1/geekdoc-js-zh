  md: "# Chapter 12: AIR Video Player\n\n# Public Variables\n\nThe UIViewideoPlayer\
    \ has public variables that affect either the videoDisplay directly or the functionality\
    \ of the VideoPlayer component. These variables include the following:\n\n+  \
    \ - source: This property is set by the parent class instantiating the UIViewPlayer\
    \ component. Once set, the URL is passed to the source property of the VideoDisplay\
    \ component.\n- autoPlay: Like source, this property is passed directly to the\
    \ VideoDisplay component and affects whether the video automatically plays once\
    \ loaded.\n- autoRewind: Like source, this property is passed directly to the\
    \ VideoDisplay component and affects whether the video restarts once it has reached\
    \ the end of the video.\n- maintainAspectRatio: Like source, this property is\
    \ passed directly to the VideoDisplay component and affects the aspect ratio of\
    \ the video on resize.\n- resizeToVideo: If true, when the video has been loaded,\
    \ the VideoPlayer will resize to fit the height and width of the source. Otherwise,\
    \ the video will be resized to fit inside of the VideoPlayer.\n- showVideoControls:\
    \ The videoControls can be added and removed from the VideoPlayer by setting this\
    \ Boolean property. This property is used to turn the controls when the player\
    \ is full-screen.\n- playing: This property is set by the VideoDisplay component\
    \ and can be used to monitor whether the video is playing.\n\n# Handling Resizing\n\
    \nOne key feature of the VideoPlayer is its ability to resize based on either\
    \ the content or the setDoubleSize and setNormalSize methods. For instance, once\
    \ the source has been set and the VideoDisplay has received the metadata containing\
    \ height and width of the video, the handleMetadata method is called:\n\n```\n\
    private function handleMetadata(event: MetaDataEvent) : void {\n  if(_resizeToVideo)\
    \ {\n    width = event.info.width;\n    height = event.info.height + videoControls.height;\n\
    \n    dispatchEvent(new Event(\"videoResize\\));\n  }\n  dispatchEvent(event);\n\
    }\n```\n\nIn the preceding snippet, _resizeToVideo is true, then the width and\
    \ height of the VideoPlayer is set to the height and width of the video, and the\
    \ height of the videoControls is taken into account. Once set, the videoResize\
    \ event is thrown. Otherwise, the MetaDataEvent is dispatched and can be received\
    \ by the parent class.\n\nBecause VideoPlayer extends the VBox container class,\
    \ any resizing will keep the videoControls below the VideoDisplay component. As\
    \ the video resizes, so will the videoControls accordingly.\n\n432"
