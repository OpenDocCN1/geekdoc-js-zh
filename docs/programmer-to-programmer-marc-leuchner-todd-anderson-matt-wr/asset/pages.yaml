  md: "# Chapter 4: Music Player\n\nWith regard to an application built with the AIR\
    \ API, the main consideration when choosing over the other, is <mx:WindowApplication>\
    \ allows you to access the default window's controls, such as Close, Minimize,\
    \ and Restore. Having access to these controls also means that you can style the\
    \ system chrome for Macs and PCs. It allows you to click and draw the window around\
    \ and listen for its event; you are able to listen to events by the window's interface\
    \ and add effect quickly to these events, such as minimize and close. Likewise,\
    \ WindowApplication extends the Application Container, you have access to all\
    \ of the events, styles, and methods made available to you when building a Flex\
    \ application for the Web.\n\nThis sounds pretty ideal, except it also means you\
    \ are confined to a basic look and feel that is pretty standard to most applications.\
    \ This isn't a big deal, but music players generally differ from the norm.\n\n\
    In such cases, when you want a more control over the look and feel of your application,\
    \ use <mx:Application>. It provides a bit more control over the physical shape\
    \ of the application window (in this case, a rounded rectangle), you can adjust\
    \ the opacity of your application, and you can place the controls for the window\
    \ wherever you want. In addition to minimize, minimize, and close, you could create\
    \ your own functionality; that's up to you.\n\nHowever, all of the functionality\
    \ mentioned in the previous paragraph must be implemented, meaning you have to\
    \ create your own buttons, and you have to listen for a MouseEvent.MOUSE_DOWN\
    \ event that will be able to move the window around on screen.\n\n# Implementing\
    \ Constructor and Window Dragging Functionality\n\nStart with the <mx:Application>constructor.\
    \ Within the constructor, in addition to the namespace declarations and default\
    \ style attributes, assign the method to onCreateCompleteHandler to the creationComplete\
    \ event variable. Once the Application has been created, and its children have\
    \ been properly initialized and added to the Application's stage, it will fire\
    \ the creationComplete event, using the following method, which is nested in the\
    \ <mx:Script / > markup.\n\n```\nprivate function onCreateCompleteHandler(event:\
    \ Event):void {\n  _nativeWindow = stage.nativeWindow;\n  _nativeWindow.title\
    \ = TITLE;\n  _nativeWindow.width = 505;\n  _nativeWindow.height = 505;\n  stage.quality\
    \ = StageQuality.BEST;\n}\n```\n\nWhen this is invoked, you assign the private\
    \ variable _nativeWindow reference to the stage.nativeWindow. By assigning this\
    \ to _nativeWindow, you are making this private variable a reference to the native\
    \ desktop's window instance. On the onCreateCompleteHandler, you're also assigning\
    \ the title of the window, the width, and the height of the application."
  merge: -1
  pgno: 140
- img_proc: true
  md: "# Chapter 4: Music Player\n\nOnce _nativeWindow is assigned, you will be able\
    \ to interact with the application window directly. Of the window's interaction\
    \ is in the nested canvas container enabled topMenu. For instance, the Close button\
    \ enabled closeBtn has a handler named onCloseClickHandler assigned to the click\
    \ event. The onCloseClickHandler is a private method defined in the application's\
    \ <mx:Script>:\n\n```\nprivate function onClickClickHandler (event:MouseEvent)\
    \ :void {\n  _nativeWindow.close();\n}\n```\n\nThis is a straightforward piece\
    \ of code, but it works. After the user clicks Close, the onClickHandler will\
    \ access the close() method of the _nativeWindow reference, causing the application\
    \ to close.\n\nNext, take a look at the init() method defined in the application's\
    \ <mx:Script> tags. At first glance, there is a lot going on in this method. After\
    \ all, this method is called after the application has initialized, before the\
    \ createEvent is dispatched. Regardless, you are only interested in a snippet\
    \ of code for this. After the application is initialized, the topMenu container\
    \ should be added to the Application's stage. You only need a reference at this\
    \ point, so whether or not it has a createEvent event is irrelevant. You're going\
    \ to add a listener to the topMenu method that will listen for the MouseEvent.\
    \ MOUSE_DOWN event, at which point you'll call the mouseDownHandler method:\n\n\
    ```\ntopMenu.addEventListener(MouseEvent.MOUSE_DOWN, onMouseDownHandler);\n```\n\
    \nThe onMouseDownHandler invokes the startMove() of the _nativeWindow reference.\
    \ This enables users to click and drag the window around their desktop. You could\
    \ have applied MouseEvent to the <mx:canvas> container that wraps the whole application,\
    \ except it would nullify all mouse events on nested components, rendering the\
    \ application useless. However, enabling users to click on the top area is enough\
    \ functionality for this:\n\n```\nprivate function onMouseDownHandler(event:MouseEvent)\
    \ :void {\n  _nativeWindow.startMove();\n}\n```\n\nUsers can now close the application,\
    \ and are able to move the application around their desktop. If you wanted to,\
    \ you could also add minimize, maximize, restore, and resize functionality to\
    \ your application, just you did in the prior code. Please keep in mind that you\
    \ are using these methods as an alternative to using the default functionality\
    \ that is available through the <mx:WindowedApplication> container, although this\
    \ certainly does not restrict you from utilizing close(), startMove(), or any\
    \ other methods available in the NativeWindow class in any Flex/AIR application.\n\
    \nAt this point, if you were to compile the application, you should be able to\
    \ browse your hard drive and play some music. Figures 4-4 and 4-5 show the finalAMP\
    \ music player."
