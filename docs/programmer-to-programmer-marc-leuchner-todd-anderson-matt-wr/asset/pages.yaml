    # Compiling, Debugging, and Packaging


    In the previous section you created the necessary files for compiling. In this
    section you will use the command-line tools provided in the Flex 3 SDK to compile,
    preview, and package your AIR application.


    # Compiling


    To compile the AIR application, use the amxml compiler found in the /bin folder
    where you installed the Flex 3 SDK - for the purposes of this that is C:\flex_sdk_3\bin
    on Windows and /Applications/flex_sdk_3/bin on Mac OS. The amcompiler invokes
    the amxml compiler with an additional parameter to the air-config.xml file in
    the /frameworks of your installation directory. By compiling a Flex application
    using the amxml utility will load the flex-config.xml configuration. The difference
    between the two configurations is the addition of SWC files related to AIR, including
    framework.swf and ailobal.swf. Take a look at the air-config.xml file within the
    /frameworks folder of your SDK installation. The amcompiler defaults to using
    the air-config.xml, but you may also specify your own configuration file by using
    the -load-config option.


    To generate an SWF file, begin by opening a command prompt. Change the directory
    to the HelloWorld project directory - for this, that location is C:\Development\AIR\HelloWorld
    on Windows and /Development/AIR/HelloWorld on Mac.


    On Windows:


    ```

    amxml -load-config "C:\flex_sdk_3\frameworks\air-config.xml" -output HelloWorld.swf
    HelloWorld.mxml

    ```


    On Mac:


    ```

    amxml -load-config "/Applications/flex_sdk_3/frameworks/air-config.xml" -output
    HelloWorld.swf HelloWorld.mxml

    ```


    The air-config.xml points to the location where you have installed the Flex 3
    SDK. Compiling the application with amxml produces a SWF file and does not launch
    the application on your system. If you click on the SWF file created, you won''t
    see anything except the default background color. That''s because it is running
    in the Flash Player, your runtime. But the AIR will launch the application using
    the ADL executable file in this section, as well as package the application for
    installation using the ADT. To perform these operations, first you need to generate
    the SWF file of the application using the amxml.'
