    \ Untitled.txt\";\n    defaultFile = DocumentsDirectory.resolvePath(\"untitled.txt\"\
    );\n    textChanged = false;\n    application.addEventListener(Keyboard.KeyUp,\
    \ on);\n}\n```\n\nThis snippet does a little thing, at least in terms of using\
    \ AIR for the first time. The defaultFile is a reference to a file named untitled.txt\
    \ within the user's documents directory. The File class has several static variables\
    \ that come in handy when developing AIR applications. In this case, using the\
    \ static variable named DocumentsDirectory this variable is of type File and holds\
    \ a reference to the user's directory. On a Windows machine, it would most likely\
    \ refer to the folder /C:Users/User_Name/Documents, and on an OS machine it would\
    \ refer to the folder /Users/User_Name/Documents. You've also taken advantage\
    \ of the resolvePath method of a File object—specifically, DocumentsDirectory.\
    \ The resolvePath method creates a new File object with a path that is relative\
    \ to its owner. How (and when) is this fun?\n\nThe next couple lines are pretty\
    \ simple. First, textChanged is set to false because no text has been changed\
