    on your machine. If you are more comfortable using another tool for the build
    process, you are encouraged to do so. However, if you are interested in setting
    up a build process through ANT, the following section will show you how to


    You may find that running the Flash Debugger when you launch an application to
    debug code can present a time-consuming obstacle within your development. As the
    concept of a simple debug panel that communicates to an AIR application using
    the SqlConnection class of the API is debug The code for the simple debug panel
    and the ANT build file can be found in the code examples for this chapter on the
    accompanying website.


    # ANT Build


    A few chapters could easily be developed to ANT alone, but in keeping with AIR
    development, this section provides a brief overview of ANT build markup and not
    necessarily the intricate workings of the tool. Although this solution is presented
    to you for ease of development, this might not be your cup of tea. Thus, all examples
    within this book have been run using the command-line tools described previously
    in this chapter.'
