    ) {\n        newNode.songName = id3Information.songName;\n        newNode.artist\
    \ = id3Information.artist;\n        newNode.album = id3Information.album;\n  \
    \  }\n\n    return newNode;\n}\n```\n\nSave the file as MP3FileSearch.as in your\
    \ working directory at the /aircmir/musicplayer/services directory.\n\nThe only\
    \ method that needs to be customized is xmlNodeStructure(). If you look back at\
    \ the FileSearch class, it only creates a <fileItem> node with the name of the\
    \ file and path. It would be nice if airAMP could retrieve additional file data\
    \ such as the track's name, artist, and album title is displayed before the MP3\
    \ has been loaded. After all, until the point where you play the MP3, you are\
    \ just referencing the MP3 file on the drive, not loading it. This is done using\
    \ the ID3Parser utility. The next section discusses this in more detail.\n\nAfter\
    \ the XML node has been structured the way you want it, it is returned to the\
    \ querySearchResults() method of the FileSearch class and appended to the results\
    \ object (_xml).\n\nCurrently, the FileSearch class and associated classes are\
    \ set up for the returned MP3s. However, feel free to finagle the class by searching\
    \ by versus extension, and returning the results in different configurations.\
    \ Regardless of how this class is used in airAMP, it is an excellent class to\
    \ have in your code library.\n\n# ID3Parser\n\nThe ID3Parser is a small class\
    \ containing one static function: returnID3Information(). It is used to retrieve\
    \ the MP3 IDv1 (version 1) track information when the file has been located and\
    \ referenced on the hand data. Alternatively, you can run a Sound's ID3 information\
    \ after the MP3 has been loaded. In the case of airAMP, it would be nice to have\
    \ a complete list of the MP3's songs, artists, and album titles. If you were to\
    \ load every MP3 file into a Sound object at once, to retrieve this information,\
    \ the application would slow down to a crawl, if not crash. Using this parser\
    \ utility will prevent that from happening while retrieving the track information.\n\
    \nThis section does not cover ID3 information in detail or explain working with\
    \ binary data in detail. To learn more about both topics, Ben Stuck's \"Working\
    \ with Binary Data\" on the Adobe Labs website (http://labs.adobe.com/wiki/index.php/AIR:Articles:Working_with_Binary_Data)."
