  md: '# Chapter 9: Map Application


    retrieving and saving locations. This chapter''s introduction targeted some primary
    goals to consider prior to building the map application. The following list expands
    on those goals:


    +   - Communication with an online API using JavaScript to search for locations
    and add destinations — The online API that you will use in this chapter is the
    Yahoo! Maps AJAX API. In utilizing this service, you will be working with the
    HTML control and learn how to bridge your AIR application and JavaScript. Since
    this service relies on an Internet connection, communication with the Yahoo! Maps
    AJAX API will be limited to the availability of a network resource.

    - Communication with a local database to save, view and edit information — The
    map application will use the AIR database API to insert new entries as well as
    retrieve and update previously saved entries from a local database. Because saved
    entries are available from a local database, communication is not limited to a
    network resource and can be accessed without an Internet connection.


    Outlining these two goals brings light to the two distinct view modes in the map
    application. When a network resource is available, the option to switch between
    each view mode will be made available, enabling you to interface with an online
    map API and a local database — touching on both communication points discussed
    above. When no Internet connection is available, you will be limited to interact
    with the database only, enabling you to edit and add to any locations.


    The next section covers the value objects and overlaying data model that will
    be used by the map application to display and save destinations-locations.


    # Handling Data


    The map application will handle data going to and coming from two sources — an
    HTML document interfacing with an online API and a local database. It is important
    to consider that while the data interpreted by these two services may be different,
    the map application itself will operate with a single type of model. With this
    mind, your views won''t have to worry over how to deal with a certain type of
    data based on where it is retrieved or sent to.


    Interfacing with the Yahoo! Maps AJAX API and the local database will involve
    different controllers, but those controllers should know how to handle the same
    type of data to be interpreted between services and the map application. The next
    section addresses generalizing that data.


    # Value Objects


    There are specific types of data the map application will display: locations and
    destinations. As discussed previously, this data will be going to and coming from
    different sources. It is important that the map application can handle abstract
    data so that users, when viewing destination-locations, can find “place” without
    specifically knowing its coordinates on a map. As with most online map applications,
    visual markers are used to denote destinations on a specified location. As such,
    the AIR application handles two major types of data between both the online service
    and the database: locations and destination markers.


