    \ whether there is a settings.xml file that contains some data. However, this\
    \ file is located\nin the application directory. You can read the file from the\
    \ application directory by referencing the File\nclass applicationDirectory, instead\
    \ of storageDirectory. Because of the security features\n AIR, you will not be\
