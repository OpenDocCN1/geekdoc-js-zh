  md: '# Introduction


    # Source Code


    As you work through the examples in this book, you may choose to either type in
    all the code manually or use the source code files that accompany the book. All
    of the source code used in this book is available for download at www.wrox.com.
    Once at the site, simply locate the book''s title (either by using the Search
    box or by using one of the title lists) and click the Download Code link on the
    book''s detail page to obtain all the source code for the book.


    Because many books have similar titles, you may find it easiest to search by ISBN;
    this book''s ISBN is 978-0-470-18207-9.


    Once you download the code, decompress it with your favorite compression. Alternatively,
    you can go to the main Wrox code download page at www.wrox.com/dynamic/books/download.aspx
    to see the code available for this book and all other Wrox books.


    # Errata


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, such as a spelling mistake or a faulty piece of code, we
    would be very grateful for your feedback. By sending an errata, you may save another
    reader of frustration, and at the time you are helping us provide even higher
    quality information.


    To find the errata page for this book, go to www.wrox.com and locate the title
    using the Search box or one of the title lists. On the details page, click the
    Book Errata link. On this page you can view all errata that has been submitted
    for this book and posted by Wrox editors. A complete list, including links to
    each book''s errata, is also available at www.wrox.com/misc-pages/booklist.shtml.


    If you don''t "find" error on the Book Errata page, go to www.wrox.com/contact/techsupport.shtml
