  md: '# Chapter 1: The Development Environment


    On Windows:


    +   1. Open System from the Control Panel.

    2. Click the Advanced tab from the menu.

    3. Click on Environment Variables.

    4. Within the System variables grid, navigate to and double-click on Path.

    5. In the Variable Value field, if the last character is not a semicolon (;),
    add a semicolon and then the path to the /bin folder where your Flex SDK installation
    directory. For the purposes of this example, that would be ;C:\flex_sdk_3\bin.


    On Mac OS X:


    +   1. Open the Terminal and type > open -e.profile.

    2. If you do not have a PATH variable set, add to obtain the following line:

    export PATH:/Application/flex_sdk_2/bin/

    3. If you have a PATH variable set, add the path to the bin folder after first
    entering a colon (:) delimit the paths.


    You are ready to access the command-line tools directly. These tools require Java
    to be installed on your machine as well. You probably have Java installed; if
    not, download the JRE from http://java.sun.com and install it in a directory of
    your choice. To obtain the latest stable release, but note that all the code in
    this book—including the Apache Art build scheme—has been tested with Java 1.5+.
    Remember when you install the JRE, or remind yourself that it is already installed,
    as you may need it when you are ready to debug your Hello World application.


    # Command-Line Tools Overview


    Within the /bin folder of the Flex SDK installation are command-line tools that
    you use for debugging, deploying, and packing applications. The .exe files with
    the Flex logo icon (a black circle with the text fx) are the executable files
    included with the Flex package. The .bat files and ad.exe (with the AIR logo icon)
    are the executable files that come with the AIR.


    The mommic is the responsible compiler for generating Shockwave Flash (SWF) files
    of XML and ActionScript code. Its "sister”—the mommic.bat file uses the air-config.xml
    file found in the /framework folder to configure the compiler for AIR. Running
    momc uses the flex-config.xml file, also in the /framework folder. The mommic
    is invoked for both deploying and debugging the SWF file in your application installer.
    AIR installer files are created by the ADT build file (adt.bat) found in the /bin
    folder of your directory.


    In this context, term deploy refers to the creation of the SWF file that will
    be packed with your application. Using the mommic compiler with your main mommic
    file as an argument, a SWF file is generated. The SWF file, however, is not launched
    during this operation, and using the mommic compiler alone not enable you to preview
    the Flash movie running within the AIR runtime. Running the AIR Debug Launcher
    (ADL) will launch the SWF file generated by the mommic compiler.'
