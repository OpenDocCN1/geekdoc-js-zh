    # Summary


    This chapter delves deeper into working with the database engine included in Adobe
    AIR, introduced you to the HTML control and script bridging ActionScript and JavaScript,
    all while building a map application to navigate to locations while interfacing
    with the Yahoo! Maps AJAX API and the local database.


    From here, you can modify the map application to incorporate other online services,
    build your own mashups, and even serialize saved database entries to pass on to
    anyone else with the Locator installed on their machine. It''s a big world! Get
    out there and start finding new destinations.'
