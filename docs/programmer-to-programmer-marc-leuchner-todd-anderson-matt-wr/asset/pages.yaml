    The BloggerService class is designed to get a list of blogs and publish a blog
    entry. There are only three public methods in this class, two of which correspond
    to a method call to the Blogger Data API. Before any of those two methods may
    be called, the other method, setcredentials, must be called. Three parameters
    are required, the first two being the username and password of the user''s Blogger
    account. The third parameter, appID, is for when the application communicates
    with the Blogger Data API. When, this parameter is simply a string that represents
    your application, and is used by the Blogger Data API when authenticating a user.


    Note that this method does not authenticate the user right away, but stores the
    authentication information for later use. Authentication does not take place until
    the first method is called. Each method checks to see whether the user has been
    authenticated yet, and if not, to authenticate the user by calling the authenticate
    method. Once the user has been authenticated, the previously attempted method
    call is made. This process is meant to streamline the process of getting information
    from the Blogger Data API.


