  md: "# Chapter 7: HTML and CSS Editor\n\n# # Adding the Event Handlers\n\nEssentially,\
    \ the application will need to respond to the events of all the components. The\
    \ subsequent will not only make the components work in harmony, but some of them,\
    \ most importantly, make the necessary modifications to the DOM so that users\
    \ can view their changes to the HTML and CSS. Take a look at all the events that\
    \ the editor is concerned with:\n\n```\nprivate function onAppInit():void\n{\n\
    \    this.systemManager.stage.window.width = 1024;\n    this.systemManager.stage.window.height\
    \ = 768;\n\n    addressBar.addEventListener( Event.CHANGE, onChangeAddressBar\
    \ );\n\n    htmlEditor.addEventListener( Event.CHANGE, onHtmlEditorChange);\n\
    \    htmlEditor.addEventListener( Event.CANCEL, onChangeAddressBar );\n\n    cssEditor.addEventListener(\
    \ CSSEditor.ADD_STYLE, onCssAddStyle );\n    cssEditor.addEventListener( CSSEditor.CHANGE_PROPERTY,\
    \ onCssChangeProperty );\n    cssEditor.addEventListener( Event.CANCEL, onChangeAddressBar\
    \ );\n\n    htmlEditor.addEventListener( Event.LOCATION_CHANGE, onHtmlLocationChange);\n\
    \    htmlEditor.addEventListener( Event.COMPLETE, onHtmlLoadComplete );\n}\n```\n\
    \nThe onAppInit function handles the application's APPLICATION_COMPLETE event.\
    \ In other words, it is called when the application has been completely created\
    \ by the runtime. Aside from setting the width and height of the application's,\
    \ the event handlers of all the components are configured. You should first recognize\
    \ the use of the CSSEditor class that you created earlier in the chapter. In addition,\
    \ note the event handlers for each HTML component. The HTML component's LOCATION_CHANGE\
    \ event is fired when the application's location property has changed. The HTML\
    \ component reports to the editors in preparation for a new DOM. The HTML component's\
    \ COMPLETE event notifies the application when the last loading operation by setting\
    \ the location property completes. This event is important because it alerts the\
    \ application to the fact that a new DOM is present and can be accessed by the\
    \ editors. Now that you have an overview of all the events, it's time to go over\
    \ each event handler:\n\n```\nprivate function onChangeAddressBar( event: Event\
    \ ) :void\n{\n    html.location = addressBar.location;\n}\n```\n\nThe previous\
    \ snippet contains the onChangeAddressBar function, which handles the AddressBar\
    \ component's CHANGE event. The only action remaining here is to update the location\
    \ property of the HTML component:\n\n```\nprivate function onHtmlLocationChange(\
    \ event:Event ) :void\n{\n    addressBar.location = html.location;\n    htmlEditor.clear();\n\
    \    cssEditor.clear()\n}\n```\n\n234"
