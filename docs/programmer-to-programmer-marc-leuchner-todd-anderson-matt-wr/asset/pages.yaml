- img_proc: true
  md: '# 6 Image Viewer and Editor


    If you’re like most of you, you probably have dozens, if not hundreds of image
    files in various folders on your computer. You let these files freeload on your
    disk space because you know you will someday look at them again and maybe make
    a few adjustments. Looking at these images through a file browser can be an unrewarding
    experience. Perhaps if you had some type of photo displaying apparatus, you wouldn''t
    forget about these works of art.


    The image viewing application you build in this chapter will remind you of those
    precious moments and enable you to make adjustments to them. This program illustrates
    some important features of the AIR drag-and-drop API while continuing to delve
    into features available in the file system API discussed in the previous chapters.


    In addition to displaying a single image, the application can display a bank of
    imported image files, enabling users to navigate through multiple images and select
    only what is wanted. With this capability in mind, the Image Viewer and Editor
    will handle multiple ways for adding to this preview bank, including the following:


    +   - Importing all image files found in a chosen directory

    - Importing multiple image files from a single directory

    - Importing image files that have been dragged and dropped onto the application


    The capability to save edited image files is a crucial part of the application
    as well, and includes the following:


    +   - Overwriting an imported image file

    - Saving an image to a chosen directory

    - Saving an image by dragging it from the viewer into another


    The next section discusses the plan to achieve these goals.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Chapter 6: Image Viewer and Editor


    # Design


    In the previous chapters, you have already seen the power that the AIR file system
    API brings to a desktop application. Reading from and writing to a file using
    the FileStream class is fairly straightforward, as using a File object to browse
    for a file to buffer into the Stream. From the previous examples in this book,
    you have opened and saved various text formats for different purposes. The File
    class also makes available the opportunity to target multiple files to open —
    whether it is from a whole directory or multiple files from a spawned browser.


    The AIR API also offers another means through which you can bring into and save
    files from your application. Of course, this refers to the best features of the
    AIR API: drag-and-drop. Classes found in the flash.desktop package enable users
    to transfer data to your application and vice versa with the movement of the mouse.


    Saving images is relatively similar to the approach to saving text files. Specifically,
    a ByteArray object, rather than a String, is used to write the file stream. The
    FileStream method writeBytes accepts a ByteArray and offset and index length.
    The classes found in the mx.graphics.core package (PNGEncoder and JPEGEncoder)
    encode BitmapData into ByteArray objects for different image formats. In the developing
    architecture, the Image Viewer and Editor will load in image files, store their
    bitmap data, and, when prompted, buffer encoded data to a stream for saving images.


    This is all exciting stuff. The next section, "Handling Data," describes how to
    keep track of images and data as you go through the process of opening, manipulating,
    and eventually saving files.


    # Handling Data


    The Image Viewer and Editor will support viewing multiple image-file formats.
    The graphical data from each loaded file is presented in multiple views of the
    application. A thumbnail bank displays all previously opened files, and a canvas
    shows the currently selected file to be viewed and edited.


    That bitmap data from image files is received from requests to open multiple files
    from a single action — whether it is through a selection browser or dragging files
    onto the Image Viewer and Editor. Handling that data properly within the various
    processes of loading, manipulating, and saving will make for an enjoyable, speedy,
    and lightweight application.


    # The Data Object


    At the heart of the Image Viewer and Editor is the ability to view images. In
    this section you will create the class that acts as a representation of a graphical
    asset. The application will have multiple views that work with properties held
    on this data object, text or graphically, and this object will expose properties
    related to the original file and access to graphical data.


    Within your development directory, create a folder titled ImageView. This will
    be your working directory for the application. With that set, you can get to work.'
