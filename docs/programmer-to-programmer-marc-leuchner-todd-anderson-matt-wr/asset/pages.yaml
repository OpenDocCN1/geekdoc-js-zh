  md: '# Chapter 12: AIR Video Player


    # The Descriptor File


    The final file needed in the creation of your AIR Video Player is the application
    descriptor file. This XML file contains properties for the application, such as
    for the initial window settings, copyright, and title. It is packaged and distributed
    with the final deployable file.


    Create a new document and enter the following markup:


    ```

    <?xml version="1.0" encoding="UTF-8?>

    <application xmlns="http://ns.adobe.com/application/1.0">

    <id-com>com.aircmr.VideoPlayer</id>

    <filename>AIRVideoPlayer</filename>

    <version>0.1</version>

    <name>AIR Video Player</name>

    <description></description>

    <copyright>2008</copyright>


    <initialWindow>

    <title></title>

    <content>AIRVideoPlayer.swf</content>

    <systemChrome>standard</systemChrome>

    <transparent>false</transparent>

    <visible>true</visible>

    </initialWindow>


    <installFolder>AIRCMR/AIRVideoPlayer</installFolder>

    <programMenuFolder>AIRCMR</programMenuFolder>

    </application>

    ```


    Save the file as AIRVideoPlayer-app.xml in the root of your working directory
    along with the AIRVideoPlayer.mxml file.


    Once the descriptor is created, move on to compiling and packaging the application.


    # Compiling and Packaging


    The last step in creating the AIR Video Player is to compile and package it. Begin
    packaging your application by first compiling the AIRVideoPlayer.mxml file into
    a SWF.


    Open a command prompt, navigate to the working directory for the AIR Video Player,
    enter the following, and press Enter:


    ```

    > amxmlc AIRVideoPlayer.mxml

    ```


    With the command prompt still pointing to the working directory, package the widget
    as an AIR installer by entering the following and pressing Enter:


    ```

    > adt -package AIRVideoPlayer AIRVideoPlayer-app.xml AIRVideoPlayer.swf

    ```


    445'
