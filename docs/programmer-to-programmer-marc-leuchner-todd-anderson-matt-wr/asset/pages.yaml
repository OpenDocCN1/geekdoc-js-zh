  md: "# Chapter 2: Simple Text Editor\n\nSome of the components have been set to\
    \ make the application behave less like a web application and more like a desktop\
    \ application. You'll notice that the tabEnabled attribute of each component is\
    \ set to false. This has been done so a user cannot focus on either of the components\
    \ by pressing the Tab key. This was done detrimentally, if someone wanted to insert\
    \ a Character into their text file. Note also that the focusThickness of the TextArea\
    \ component has been set to 0. By default, the TextArea component will become\
    \ highlighted with a slight outer glow. In this case, it doesn't make sense to\
    \ have this, and you can't even see the entire glow when the component is stretched\
    \ to the edges of the window.\n\n# The Logic\n\nAs mentioned earlier, the program\
    \ should perform two basic tasks: saving and reading a text file. You might initially\
    \ assume that you'll need a way to browse the hard drive for files to open, and\
    \ browse it for a place to save file. Luckily, AIR provides a very easy method\
    \ for integrating with the user's operating system to perform such a task. You\
    \ won't have to create any special components; everything can be handled in just\
    \ one.\n\n# The Basics\n\nOpen SimpleTextEditor.xml in your editor if it is not\
    \ already. Make the following changes and additions to the markup:\n\n```\n<xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>n<mx:WindowApplication xmlns=\"http://www.adobe.com/2006/xmlml\"\
