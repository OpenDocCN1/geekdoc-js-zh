  md: '# Summary


    In this chapter you learned how to create a simple content management system application
    that manages an XML data set and its associated assets. More specifically, you
    learned how to upload files to a remote server using the upload method of the
    File class, and how to save XML files to the user''s hard drive within the application''s
    storage directory.


    You might be thinking that the content this application manages is very specific
    and uses a schema that doesn''t reflect the type of data you wish to manage. No
    problem — this application could be edited to accommodate your own situation.
    By making some simple changes to the ItemEditor and ItemData classes, you could
    easily change the schema for the data, and the application should, in theory,
    still work.


    In the next chapter, you will continue to expand your knowledge of, and experience
    with, AIR by learning how to build an image viewer.'
  merge: -1
