    \ in the project directory along HelloWorld-app.xml.\n\nThe first snippet, saved\
    \ as HelloWorld-app.xml, is the descriptor file for the HelloWorld application.\
    \ Although the descriptor is not needed to compile a SWF using the asmc compiler,\
    \ it is necessary for debugging and preview, as well as packaging the application\
    \ for installation. The descriptor file specifies properties associated with the\
    \ AIR connection. It contains values that will be displayed during installation,\
    \ and data to be displayed by the operating system after installation. The descriptor\
    \ file also allows you to customize the appearance of the AIR chrome — or visual\
    \ display within the <initialWindow> element. The properties defined in this example\
    \ are subset of those available. Many are optional and have been left out. Subsequent\
    \ chapters use them to pertain to the specific applications you will build.\n\n\
    The application tag is the root tag for the descriptor file. The xmlns attribute\
    \ is the URI reference for the AIR namespace. The last segment of the namespace\
    \ (1.0) is the runtime version used to run the AIR application. The value of the\
    \ id element must be unique — meaning no two applications installed on your machine\
    \ can share the same application ID. As such, best practice is to use a dotted-reference\
    \ DNS-style string as an identifier. Supported characters for id include 0–9,\
    \ a–z, A–Z, and hyphen. Special characters (aside from dot and hyphen), including\
    \ spaces, will throw an Invalid Application error upon launch of the AIR application.\
    \ For this example, the unique ID is given value com.aircmr.HelloWorld, as it\
    \ relates to the examples found in the code for this chapter on the accompanying\
    \ website."
