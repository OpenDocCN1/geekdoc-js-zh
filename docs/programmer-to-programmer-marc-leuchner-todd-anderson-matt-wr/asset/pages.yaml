    easingFunction="Quartic.easeOut"

    effectorEnds="checkWidgetLocation();" />

    </mx:Transition>

    </mx:transitions>


    <mx:Application>

    ```


    Save this document as WeatherWidget.xml in your working directory.


    The WeatherWidget is an <mx:Application> container that acts as both a controller
    and a view manager for the widget. It contains an <mx:Box> component called backgroundContainer
    that wraps the UI elements, an <mx:Script> tag writing the ActionScript, an <mx:state>
    array containing the different views, and an <mx:transitions> array containing
    the definition for the widget.


    # Going Homeless


    An AIR application, by default, is a subclass of a <mx:WindowApplication> container.
    It contains methods, properties, events, and styles that are present in creating
    an application that matches the operating system''s theme. The difference between
    <mx:WindowApplication> and <mx:Application> in an AIR application is that, with
    <mx:Application>, it is up to the developer to add and define the listeners that
    enable system commands such as close, minimize, maximize, or enable that you to
    drag a window. These events are predefined with default values in <mx:WindowApplication>.
    Given that the weather widget will have a look and feel of its own, the <mx:Application>
    class is used instead. In order to have a completely chromeless application, additional
    properties need to be set in the application descriptor file.


    The backgroundContainer <mx:Box> acts as the UI for the weather widget. It has
    a black, semi-transparent background, rounded corners, and a white-one pixel border.
    It includes an <mx:Canvas> container, which contains the UI elements as the does,
    the <ui:CurrentWebView>, <ui:DayForecastView>, and <ui:Settings>. All user interaction
    events are handled by backgroundContainer. To enable users to move the widget
    around their desktop, Therefore, you must add the events as follows:


    ```

    <mx:Box id="backgroundContainer"

    MouseDown="_nativeWindow.startMove();"

    MouseUp="checkWidgetLocation();">

    ```


    Note that the properties for the <mx:Box> instance are exposed in this example.
    On mouseDown, startMove instantiates the mouse handle for a NativeWindow instance.
    In this case, _nativeWindow is defined as SystemManager.SWFRoot(this).stage.nativeWindow
    in onCreate CompleteHandler. When the user releases the mouse after the move down,
    the checkWidgetLocation verifies whether the widget rests on the desktop or moves
    to the desktop it is not.


    278'
