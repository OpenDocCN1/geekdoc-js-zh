- img_proc: true
  md: "# Chapter 12: AIR Video Player\n\n![](img/ae8d13390b8907e42ae2ab60bd54e1f8_465_0.png)\n\
    \nFigure 12-5\n\n# Going Full-Screen\n\nThe toggles for full-screen were set up\
    \ in the section \"Adding Context and Window Menus.\" Users can enter full-screen\
    \ either from the View menu or by right-clicking on the player and selecting Enter\
    \ Full-Screen.\n\nTo enter full-screen mode, the method handleFullScreen is called,\
    \ which sets the stage.displayState to StageDisplayState.FULL_SCREEN_INTERACTIVE.\
    \ This effectively sets the application to full-screen.\n\nTo exit full-screen\
    \ mode, the method handleExitFullScreen is called, which sets the stage.displayState\
    \ to StageDisplayState.NORMAL. This effectively sets the application to the normal\
    \ state, which is the height and width of the application before entering full-screen.\n\
    \nThe application listens for the display state change by adding a listener to\
    \ the stage handleAppCreationComplete, which listens for FullScreenEvent.FULL_SCREEN.\
    \ Once this event is dispatched, the handleResizeFullScreen method is called:\
    \ \n\n```\nprivate function handleResizeFullScreen(event:FullScreenEvent) :void\
    \ {\n  if(stage.displayState == StageDisplayState.FULL_SCREEN_INTERACTIVE) {\n\
    \    videoPlayer.showVideoControls = false;\n    videoPlayer.width = this.width;\n\
    \  }\n```\n\n443"
