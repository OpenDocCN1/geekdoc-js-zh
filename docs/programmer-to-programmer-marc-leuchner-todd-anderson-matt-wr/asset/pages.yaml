  md: '# The Development Environment


    A reliable development environment will save you loads of time when you are ready
    to debug and deploy your applications. This chapter explains how to install and
    use command-line tools in building an AIR (Adobe Integrated Runtime) application.
    This chapter follows a slightly different format than the following chapters,
    as it introduces the development process in building applications in AIR, and
    provides an overview of common tools.


    The following section, "SDK Installation," explains where to download and how
    to install the Flex 3 SDK, which includes all required tools and APIs (Application
    Programming Interfaces) to build Flex and AIR applications. This section covers
    the basics of the development environment and provides a brief overview of the
    command-line tools that are used throughout the book to deploy AIR applications.


    The section "Building Your First Application" walks you through the process of
    building your first AIR application, focusing on how to use the command-line tools
    to deploy, debug, and package your application for installation.


