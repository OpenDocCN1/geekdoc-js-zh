  md: '# Chapter 4: Music Player


    # Deploying the Application


    The airAMP music player is nearing completion. The last step is to create a descriptor
    file and package everything as a deployable AIR file.


    # The Descriptor File


    The final file needed in the creation of the airAMP music player is the application
    descriptor file. This XML file contains properties for the application, such as
    the initial window settings, copyright, title, and icon URLs. It is packaged and
    distributed with the final deployable file.


    Create a new document and enter the following markup:


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <application xmlns="http://ns.adobe.com/air/application/1.0">

    <id-com>aircmr.MusicPlayer</id>

    <filename>MusicPlayer</filename>

    <version>0.1</version>

    <name>AIR Amp</name>

    <description></description>

    <copyright>2008</copyright>

    <initialWindow>

    <title></title>

    <content>MusicPlayer.swf</content>

    <systemChrome>none</systemChrome>

    <transparent>true</transparent>

    <visible>true</visible>

    </initialWindow>

    <installFolder>AIRcmR/MusicPlayer</installFolder>

    <programMenuFolder>AIRcmR/programMenuFolder</programMenuFolder>

    </application>

    ```


    Save the file as MusicPlayer-app.xml in the root of your working directory along
    with the MusicPlayer.mxml and settings.xml files.


    This will be the descriptor file for the music player. Because the application
    will have its own window design and interface, the <systemChrome> property is
    set to none, and <transparent> is set to true.


    Once the descriptor is created, move on compiling and packaging the application.


    # Compiling and Packaging


    The final step in creating the airAMP music player is to compile and package it.
    Once you have the MusicPlayer.mxml, MusicPlayer -app.xml, settings.xml, and the
    assets directory in your working directory, begin packaging the application by
    first compiling the MusicPlayer.mxml into a SWF.'
  merge: -1
