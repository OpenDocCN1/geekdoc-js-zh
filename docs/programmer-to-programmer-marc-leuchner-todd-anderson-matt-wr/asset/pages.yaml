  md: '# About the Authors


    **Marc Leuchner** is a Senior Flash Developer for the Boston-based advertising
    group Almighty. His roles and talents within the company primarily revolve around
    Flash development and interactive design. Over the years, he has worked with clients
    such as New Balance, ABC, Condé Nast, PUMA, BMW/Mini, Comcast, and GAP. Marc has
    a BFA in New Media/Design from the Rochester Institute of Technology. In his spare
    time, he writes with clients the technology blog www.nobien.net with co-author
    Matt Wright.


    **Todd Anderson** is a Senior Software Engineer for Infrared5. With over five
    years of developing for the Flash Platform in the areas of RIA and game development,
    Todd has delivered web and desktop solutions for the publishing and entertainment
    industries including McGraw-Hill, Thomson, Motorola, and Condé Nast. He runs www.custardbelly.com/blog,
    focusing on the development of the Flash Platform and game development.


    **Matthew Wright** is a Senior Flash Developer for ROKKAN, a full-service digital
    agency located in New York City. Since 2005 he has delivered mostly consumer experience
    Flash sites and applications for a wide array of clients, including Virgin America,
    the Coca-Cola Company, Atlantic Records, Time Warner, the NBA, and 2K Games. Prior
    to ROKKAN, he got his start at an interactive agency in Syracuse, called 2ndNature.
    It was here that he discovered his love for the Flash platform. Outside of work,
    Matthew contributes to a Flash and technology blog www.nobien.net, with friend,
    colleague, and co-author Marc Leuchner. He has also spoken at FlashForward. Matthew
    lives in Brooklyn, New York, with his beautiful girlfriend, Chewy.'
