  md: '# Introduction


    The release of Adobe Flex 3 featuring the AIR SDK (Software Development Kit) marks
    the latest advancement in the evolution of Adobe Flash technologies. The initial
    version of Flash (then FutureSplash) was a program capable of creating animations
    for the Web. With the later additions and revisions of the ActionScript language,
    Flash was transformed into a robust development that led to the creation of the
    Flex framework. The initial two versions of Flex have enabled developers to create
    rich applications independent of the Flash IDE and with some ease. Version 3 of
    Flex introduces the capability to create applications specifically for the Adobe
    AIR runtime, moving the Flash from web-based to desktop-based applications.


    With every release of a new Flash technology, there is a mountain of new learning
    material — books, videos, blogs entries, and so on. Adobe AIR and Flex 3 are no
    different. In fact, Adobe released public beta versions of their software, this
    effect is amplified. People are excited about the new features in Flex, especially
    its integration of the AIR SDK. This excitement has made it easier to find out
    how to use Adobe AIR, but what if you are past that and would like to start building
    applications? Similarly, some people learn by dissecting example applications.
    After all, excitement fuels the need to build something useful with Flex 3 and
    Adobe AIR. This book attempts to pass this excitement and knowledge to you.


    # Who This Book Is For


    This book was written with the Flex developer in mind — someone who has experience
    using Flex to build web applications will find the examples in this book easy
    to follow. However, if you are familiar with object-oriented ActionScript and
    have a basic knowledge of how Flex works, this book will also be helpful in learning
    Flex and ActionScript 3 by example.


    Those who are new to, or becoming more familiar with, the AIR SDK should review
    the first chapter, as it explains how a basic Flex/AIR project is developed, compiled,
    and deployed. If you feel better by example, Chapter 2 jumps into creating an
    application with some moderate techniques.


    The advanced user may want to jump right looking into the code base. All of the
    code for each example is available on the accompanying website. Feel free to get
    your feet wet with an application, and use this book as a reference or blueprint.


    Overall, each chapter in this book is set up to be self-contained. Therefore,
    feel free to skip around in any manner you choose. Each chapter was written with
    the intention of creating a foundation that you can extend, taking each application
    to new limits by customizing and making it your own. They are all built in that
    enable you to easily implement parts of the code base in projects outside of this
    publication. You are encouraged to select an example application, break it, fix
    it, add to, and learn from it.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    # What This Book Covers


    This book consists of 11 applications that demonstrate the features available
    in the Adobe AIR and Flex SDKs. Each chapter touches several key features, and
    collectively they cover most of the AIR SDK has to offer. By following along with
    the examples, you will create robust applications object-oriented concepts and
    practices.


    # How This Book Is Structured


    This book is structured to be read like an instructional reference for reusable
    applications. Each chapter contains code sets and snippets followed by brief explanations.
    All the applications have been created with the idea of extensibility, every example
    being treated as a foundation from which you can build a larger and better application.
    After all, this book was created for developers who may have an idea that don''t
    know how to start, or who need a way to quickly get a project off the ground.


    The structure of each chapter is as follows:


    +   - Introduction and overview: what AIR and Flex features will be

    - Design: the main technical concepts and goals of the application

    - Code and code explanation

    - Building and deployment: how to compile and package the application

    - Summary and modification recommendations


    The chapters of the book, the included application, and a brief list of AIR features
    are as follows:


    +   - Chapter 1, “The Development Environment,” provides an overview of setup
    and the command-line tool.

    - Chapter 2, “Simple Text Editor,” covers basic file system functionality, including
    browsing, reading, and writing files.

    - Chapter 3, “Simple RSS Reader,” covers occasional connectivity and toaster-stery
    alerts.

    - Chapter 4, “Music Player,” covers recursive search, browse, copy, read, write
    files, andless applications.

    - Chapter 5, “Mini CMS,” covers handling XML file uploads, writing files, and
    saving settings.

    - Chapter 6, “Image Viewer and Editor,” covers creating images, using the codecs
    available in the Flex 3 SDK, and native drag-and-drop operations.

    - Chapter 7, “HTML and CSS Editor,” covers editing the HTML and CSS of a loaded
    page, and HTML control, including JavaScript integration.

    - Chapter 8, “Weather Widget,” covers context menu, chromeless apps, customized
    icons, and system/drag interactivity.

    - Chapter 9, “Map Application,” covers communication with an online API using
    JavaScript in an HTML control, and communication with a local database.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    +   - Chapter 10, “Blogger Agent,” covers publishing posts to your Blogger account
    or saving them for publishing later when you are connected. Also covered are SQLite
    DB and LocalEncrypted-Store for storing sensitive information.


    +   - Chapter 11, “Slideshow Maker,” covers serialization of custom file types
    and the windowing API.


    +   - Chapter 12, “Video Player,” covers Flash 9 and AIR’s H.264 and FLV playback
    support, drag and drop, context and window menus, and full-screen video.


    Chapters recommended for those who are new to Flex 2, 3, 7, 8, and 12.


    # What You Need to Use This Book


    Because Adobe Flex 3 and AIR SDKs are open source, you only need to download the
    SDKs with compilers and a text editor. However, Flex Builder 3 is certainly recommended.
    Flex 3 and AIR are available for Windows, Mac OS X, and Linux platforms. Trial
    versions of Flex 3 and the open-source Flex 3 and AIR SDKs are available at www.adobe.com.
    If you are in need of a good ActionScript editor, try FlashDevelop, a free ActionScript
    editor, if you do not have Flex Builder or Eclipse (www.flashdevelop.org).


    # Conventions


    To help you get the most from the text and keep track of what’s happening, we’ve
    used a number of conventions throughout the book.


    | Boxes this one hold important, not-to-be-forgotten information that is directly
    relevant to the surrounding text. |


    Notes, tips, hints, tricks, and asides to the current discussion are offset and
    placed in italics like this.


    As for styles in the text:


    +   - New terms and important words are italicized when they are introduced.


    +   - Keyboard strokes are shown like this: Ctrl+A.


    +   - Filenames, URLs, and code are shown within the text like so: persistence.properties.


    +   - Code is presented in two different ways:


    A monospaced type with no highlighting is used for most code examples.


    | Gray highlighting is used to emphasize code that''s particularly important in
    the present context. |'
