  md: "# Building the Directory Structure\n\nBefore discussing how the music player\
    \ is built, it is important that the directory structure for this chapter is properly\
    \ set up:\n\n+   1. Begin creating a new directory in your local development directory\
    \ called \"MusicPlayer.\\ This directory will be your working directory for this\
    \ application.\n\n+   2. Create the package structure for this application by\
    \ creating directories — com, aircmr and musicplayer — in your working directory.\
    \ The music player package structure should look as follows: working directory/com/aircmr/musicplayer.\n\
    \n+   3. Download the assets from the MusicPlayer on the accompanying website\
    \ and place them in the root of the working directory. These files will be used\
    \ throughout the development of the music player.\n\nNow that the directory structure\
    \ has been set up, you can begin to build airAMP. The next section starts the\
    \ development process with a discussion of where the data for the application\
    \ is coming from and how the application will utilize it.\n\n# Handling Data\n\
    \nMost, if not all, software capable of playing MP3s has a playlist feature, and\
    \ airAMP will be no exception. If you think about playing in terms of data, it\
    \ is an array of references to music files on the user's drive. The music player\
    \ searches a specified directory and returns an XML list of locations to MP3 files.\
    \ This directory is specified in the user's settings. Both the settings and playlist\
    \ data are read and written to corresponding XML files contained in the application's\
    \ storage directory. The following sections describe these files.\n\n# External\
    \ XML\n\nBefore the music player can query a directory for MP3s, it first has\
    \ to load some settings information for the user to edit. All XML is accessed\
    \ through the XMLFileService class. Once loaded, it is parsed by the XMLParserUtil\
    \ class. Both classes are discussed later in this section. For now, by building\
    \ the player.\n\n# settings.xml\n\nOpen a text editor and edit the following code:\n\
    \n```\n<xml version='1.0' encoding='utf-8'>\n<settings>\n  <defaultMusicDirectory></></defaultMusicDirectory>\n\
    \  <refreshOnStartup>false</refreshOnStartup>\n  <musicDataBaseLocation>xml/musicdatabase.xml</musicDataBaseLocation>\n\
    </settings>\n```\n\nSave the file as settings.xml in the root of your working\
    \ directory."
