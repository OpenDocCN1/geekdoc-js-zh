    \ and bitmap filters of the\nActionScript API, you can build any type of image\
    \ editing tools.\n\nThe subject of image processing requires a book, if not a\
    \ library. It's up to you to build editors\nthat will enable you to take out red-eye,\
    \ squash faces, and add funny captions. Though it was tempting\nto include an\
    \ editor for the last of those suggestions, the editor tool you will build in\
