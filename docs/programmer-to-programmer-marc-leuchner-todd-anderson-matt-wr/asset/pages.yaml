    The first named currentFile, which is of type File, is created. A File object\
    \ represents a path to a folder or file. In this case, currentFile represents\
    \ a path to the current file the user has opened in the text editor. File objects\
    \ are wonderful because they can represent a path to a folder or file that does\
    \ not exist. In other words, it can represent a path to a folder or file you want\
    \ to create at later point. For instance, a named defaultFile, which is also of\
    \ type File, is also created. This variable will represent the default file that\
    \ the user is prompted to save if the user has not opened a text file.\n\nYou\
    \ also need a FileStream object, which is used to read and write data. Finally,\
    \ to prevent a user from discarding changes, you created a simple Boolean variable\
