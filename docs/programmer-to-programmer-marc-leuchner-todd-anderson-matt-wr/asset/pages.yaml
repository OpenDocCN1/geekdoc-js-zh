  md: '# Music Player


    Let''s face it: There are a lot of music players on the market. Programs such
    as Apple iTunes and Windows MediaPlayer control a large share of that market.
    Nevertheless, this does not mean isn''t room for another. Each existing player
    has features that make it stand out compared to others, but you might want a combination
    of features currently unavailable from any one player. This is your opportunity
    to create the next killer music app.


    In this chapter, you will create a music player called airAMP, named after one
    of the first widely used MP3 programs. The intention of this exercise is to create
    one with the basic flex features, which you can use to build a more robust, full-featured
    music player. airAMP will utilize the AIR API to search for MP3 files that will
    populate a playlist. It will write the playlist back to the user''s hard drive
    as an XML file. Additionally, it will leverage the AIR API''s capability to create
    an application that is moderately styled and chromeless.


    Through building this application, you will learn how to use several features
    within the Flex and AIR APIs, the following:


    +   - Utilizing the File class to select a directory

    - Recursively searching the directory and its subdirectories for a file type (MP3)

    - Utilizing the FileStream class to read and write to an XML file

    - Creating an application that does not rely on the AIR chrome-window controls

    - Loading, playing, and reading ID3 tags of MP3s using ActionScript


    The next section discusses the design concepts behind airAMP.


    # Design


    The features that you can build into a music player are seemingly endless. Although
    you could begin to write down everything that you think is the ideal music player,
    it is probably best to start with the basics, add a couple of minor thrills, and
    work up from there. However,'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Chapter 4: Music Player


    don''t abandon all of your great ideas — write them down and come back to them
    once the application is playing some times. Until then, begin considering how
    the airAMP player will work.


    The first thing to consider is where the music will come from. A traditional Flex
    music player for the Internet would be capable of receiving an XML file or receiving
    data MP3 URLs through a dynamic feed. However, the AIR API will enable you to
    play files off drive. Furthermore, AIR enables you to recursively search through
    directories. This feature will be an aid to quickly populate airAMP music. With
    this, the application will use the getDirectoryListingAsync() method found in
    the File class. The result will be a list of objects representing MP3s.


    When the search is complete and the results have been received, one way to prepare
    the data for playback-ready would be to create a Sound object for every entry
    returned and use the Sound object''s load() method using the nativePath property
    of the File. However, loading more than a couple of MP3s at once would slow down
    the system, if not crash the music player.


    The solution to this was to create a new value object for each entry. The value
    object would have information such as the file location, whether it has been loaded,
    and some basic track data such as music album title, song title, and artist title.
    Instead of all MP3s once, one MP3 will be executed at a time, and only when the
    object is referenced. To accomplish this, an application will store an ArrayCollection
    of value objects representing MP3 location.


    After the data has been populated, a sound manager class will be needed to access
    any MP3 in the data model. The sound manager will manage all functionality such
    as play, stop, next, previous, volume, and position. When the user selects a track
    from the list, the sound manager will load the corresponding MP3 and begin to
    play it, dispatching events that affect the application''s view.


    The airAMP music player''s view will have the following features:


    +   Playback controls: All playback controls will be grouped into a single component.
    This component will have buttons for previous, play, stop, and next. It will also
    feature an aid to display the artist''s name and the song title. Lastly, it will
    have a timeline scrubber created from the HSlider component. The HSlider component''s
    labels will be repurposed to show the running time for the sound.


    +   Playlist: All of the value objects representing MP3 will be executed in a
    modified DataGrid class. When the user selects an entry, the DataGrid will dispatch
    an event to the SoundManager class, which will get ready to play the selection.


    +   Settings panel: The settings panel gives a user to select the music directory
    on their hard drive. In addition to this, the music player will give the user
    option of either using the same database every the application is opened, or refreshing
    the database by querying the music directory.


    +   Custom appearance: The music player will look a little better than out-of-the-box
    apps. To accomplish this, it will have its own style sheet and custom buttons,
    and it will not use the native system window chrome. Although all of this is not
    necessary to the functionality of the application, a custom appearance always
    adds to the user experience.


    Now that the basic design and functionality have been defined, you can begin to
    set up the airAMP music player. In the next section, you will learn how to set
    up the directory structure and gather the accompanying files.'
