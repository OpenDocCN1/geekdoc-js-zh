  md: '# Chapter 8: Weather Widget


    No widget is complete without a custom icon. Included on the CD-ROM in this chapter''s
    directory are four icon files for the widget-16x16, 32x32, 48x48, and 128x128
    pixel icons. If you do not have these icon images, remove the icon URLs from the
    <icon> node set; otherwise, an error will be thrown when you package the AIR application.


    # Compiling and Packaging


    The final step in creating the weather widget is to compile and package it. If
    you are planning to add the icon files and haven''t yet, make sure you copy them
    to your working directory/icons folder before proceeding. You should also be sure
    to clear out the <zipCode> data in the settings.xml file if you edited the original
    file in your working directory (optional). Once you have the WeatherWidget.mxml,
    WeatherWidget-app.xml, settings.xml, and the assets/ directory available in your
    working directory, beginning the packaging by first compiling the WeatherWidget.mxml
    into a SWF.


    Open a command prompt, navigate to the working directory for the weather widget,
    enter the following command, and press Enter:


    ```

    > amxmlc WeatherWidget.mxml

    ```


    With the command prompt still pointing to the working directory, package the widget
    as an AIR installer by entering the following command and pressing Enter:


    ```

    > ad -package WeatherWidget WeatherWidget-app.xml WeatherWidget.swf settings.xml
    /icons/

    ```


    Once the package is created, navigate to your working directory. If the widget
    is packaged correctly, you should have a WeatherWidget.air file. Execute the WeatherWidget.air
    package in order to install the application on your hard drive. Once it is installed,
    open it, enter your zip code, and get the weather. In case you''re having a rainy
    day, or a blizzard, quickly switch to the day-view to see if your week will look
    up. If all else fails, type in a zip code that starts with 90 and see how the
    weather is in sunny California.


    # Summary


    In this chapter, you learned how to create a fully functional, feature-featured
    weather widget. The widget requests the user''s zip code, queries Google''s XML
    weather feed, and displays the current forecast or the four-day forecast. It features
    a minimal, chromeless design with multiple views and dynamic interaction with
    the system tray (or dock). Although this widget performs a very specific function,
    the concepts that you learned can be applied to building an even better widget.


    You can use this application as a stepping-stone to develop different widgets,
    or add to the existing set of features. It might be handy able to create multiple
    instances of the weather widget for someone who would like to monitor the weather
    in more than one location. The widget could query the National Weather Service
    and display weather warnings in the specified area. The branding of the weather
    widget can be changed so that it doesn''t display the weather at all; instead
    it might have an illustration that changes based on the weather data. Overall,
    you can use this application to leverage your ideas to create simplified, multi-platform,
    killer widgets.


    284'
