    one development directory to the next without the automation process, though it
    is recommended that you change any application-specific property values.


    # Simple Debug Panel


    If your debugging tasks are simply logging-trace-related and not relying on stepping
    through breakpoints or handling faults, you may find the time to open a separate
    command prompt to launch the Flash Debugger. Creating a simple debug panel to
    handle all your trace statements would be an excellent example of an AIR application
    that is quick to create and extremely handy when it comes to debug any of your
    other AIR applications.


    Take what you have learned from this chapter and make your own simple debug panel
    — in fact, one is available in the code examples for this chapter on the accompanying
    website. The source is included and you may modify the code as you see fit. One
    possible addition is a write-to-log feature if you are feeling adventurous. The
    DebugDebug application does not employ anything specific to the AIR API and uses
    LocalConnection to pass logging statements from your application to the debug
    panel running under the AIR runtime. The README file included in the directory
    outlines correct usage in your applications, as you need to add some class files
    to your projects in order for the debug panel to receive log statements.


    # Summary


    In this chapter you built your first AIR project, a simple Hello World application,
    and learned about the command-line tools provided in the AIR SDK installation.
    Also included in this chapter were time-saving solutions for building and debugging
    applications. In the following chapters you will build applications that are practical
    in real-world scenarios — and, it is hoped, you have some fun while doing so.'
