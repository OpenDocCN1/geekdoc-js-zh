  md: '# Chapter 1: The Development Environment


    To uninstall AIR application on Windows, follow these steps:


    +   1. Click Start Control Panel Add or Remove Programs.

    2. Within the entry list, scroll to the AIR application you wish to uninstall
    and click once to select it.

    3. Click the Remove button. Doing so will remove the installation directory from
    Program Files remove the Desktop and Start Menu shortcuts you have opted to create
    during the installation process.


    To uninstall an application on a Mac, you have to drag the installation folder
    to the Trash and then empty the Trash.


    Uninstalling the application removes the application directory and any ancillary
    files you opted to create through the installation window. Uninstalling with these
    processes does not, however, remove the application storage directory or any files
    created and associated with the application after.


    Good-bye, Hello World! You are now armed with the tools and knowledge to start
    building and distributing AIR applications. You have a structured development
    environment to make that process smoothly.


