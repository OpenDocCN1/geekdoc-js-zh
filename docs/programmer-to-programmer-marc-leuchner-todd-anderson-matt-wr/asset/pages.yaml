    Save the file as RSSReader.xml in the root of your working directory for the RSS
    Reader application.


    There is quite a bit going on in the RSSReader class, and it utilizes interesting
    parts of how the AIR API have that not been introduced in the previous chapters.
    To begin, look at how the application monitors user presence in the applicationComplete
    event handler of the <mx:WindowApplicationon>:


    ```

    NativeApplication.nativeApplication.addIdleThreshold = IDLE_THRESHOLD;

    NativeApplication.nativeApplication.addEventListener(

    Event.USER_ID, onUserId);

    NativeApplication.nativeApplication.addEventListener(

    Event.USER_PRESENT, onUserPresent);

    ```


    The applicationComplete event is dispatched after the application has been initialized
    and added to the display list. In the onComplete event handler, for events related
    to user presence detected by the flash.desktop.NativeApplication Singleton are
    established. The NativeApplication instance represents the AIR application and
    is created upon startup. The Idleproperty of NativeApplication, you can set the
    amount of time, in seconds, allowed to elapse without user input. After that time
    has elapsed, the application will dispatch an idle event whose handler is set
    here as the onun method. When presence is detected by the application, the onUserPresent
    event is invoked. These methods control the Timer object by polling the feed service.
    If a user is not present, requests are stopped, resuming when a user is detected
    by the application as being present.


    Also within the onComplete() method, the application establishes a air.net.URLMonitor
    instance to handle status events related to a network resource:


    ```

    _feedMonitor = new URLMonitor(new URLRequest(FEED), [200,202]);

    feedMonitor.addEventListener(Status.STATUS, onStatus);

    feedMonitor.start();

    ```


    The URLMonitor monitors the availability of a service. The first argument in the
    constructor for URLMonitor is the URL you wish to monitor. The RSS reader is requesting
    data from AXNA and the connection is established based on the HTTP status return—the
    second argument in the constructor. The available property of the URLMonitor,
    which is changed in the onChange() handler, changes the value of the isAvailable
    property of the RSSReader class. Through binding, when the isAvailable property
    has changed, the invalidateAvailability() method is invoked. The URLMonitor is
    instructed begin monitoring the service in the onComplete() method, but also in
    the event handler for onChanged on the <mx:WindowedApplication>.


    On the value of the isAvailable property, the application is instructed to start
    or resume polling the feed, and calls each of two methods that control the native
    menu for display in the Windows system tray or Mac OSX dock:


