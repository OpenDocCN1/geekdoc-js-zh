    # Deploying the Application


    It''s time to deploy the RSS application and start reading all the posts you may
    have missed from Adobe XML News Reader while you were following along with the
    examples in this chapter. In this section you will create the descriptor file
    and deploy the application for installation. The system chrome attributes to the
    main WindowApplication as invisible and not available from the system menu will
    be declared within the descriptor file, along with properties related to the application
    as it appears on a user''s computer.


    # The Descriptor File


    Open your text editor, create a new file, and enter the following markup:


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <application xmlns="http://ns.adobe.com/air/application/1.0">

    <id>com.aircm.RSSReader</id>

    <filename>RSSReader</filename>

    <version>0.1</version>

    <name>RSS Reader</name>

    <description>A Reader for RSS feeds</description>

    <copyright>2007</copyright>

    <initialWindow>

    ```'
