    \ pertains to the current element index of the slide being viewed while the application\
    \ is open, and is accessed from both the workspace and presentation displays.\
    \ The current index being prior to saving the slideshow has no relevance in the\
    \ example for this chapter, but you are free to manage the property as being transient\
    \ if you intend to use it — for instance, to take the user back to the last slide\
    \ viewed upon opening a slideshow.\n\nIn the next section you will build the visual\
