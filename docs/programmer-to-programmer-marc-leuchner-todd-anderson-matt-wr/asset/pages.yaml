  md: '# Simple RSS Reader


    Everyone tries to keep abreast of the latest news. As a newspaper is an aggregate
    of articles in print, a Really Simple Syndication (RSS) reader supplies you with
    information in a digital format. The RSS format is an XML markup delivering information
    about a feed, or collection of published articles, detailed through metadata elements.
    Online aggregators are notified of updates from multiple RSS feeds and facilitate
    staying up to date on what interests you from various sources.


    In this chapter, you will build a simple RSS reader that displays posts from the
    Adobe XML News Aggregator (AXNA), an aggregate of various topics, while the lowndown
    about the latest information on the Flash Platform. While doing so, you''ll uncover
    some jewels in the AIR API as they pertain to network connectivity, the system
    tray, and windows.


    Before you begin building the application, first consider what to expect from
    a desktop RSS reader. In general, the RSS reader should have the following qualities:


    +   - Be aware of network resources and user presence, and handle polling the
    RSS feed accordingly.

    - Unobtrively display posts as they are received from the RSS feed.

    - Present additional options pertaining to the application and RSS feed from the
    system tray.


    The next section discusses how to achieve these goals.


    # Design


    In the previous section, some primary goals were targeted for the RSS reader.
    Consuming an RSS feed and showing the lists of posts using the Flex framework
    is pretty straightforward, and you may have built an online feed reader already
    yourself. The RSS reader you will build in this chapter, however, will incorporate
    the capabilities of the AIR API, enabling you to bring that experience to the
    desktop. The following list expands on the goals for the application:


    +   - Be aware of network resources and user presence — The main focus of the
    RSS Reader application is to present the user with the most recent posts of a
    feed. The application will'
  merge: -1
  pgno: 69
- img_proc: true
  md: "# Chapter 3: Simple RSS Reader\n\ncontinually poll an RSS feed to retrieve\
    \ and present any new posts. When a user has lost connection to the Internet,\
    \ the application must know to stop any requests until the connection is restored.\
    \ The same understanding applies to a user's idleness while the application is\
    \ running. using the network monitoring classes and handling events of the AIR\
    \ API, you can ensure an enjoyable reading experience.\n\n+   - Obtrusively displays\
    \ posts as they are received from the feed — The RSS reader will present posts\
    \ in a toaster window. The presentation of a toaster window varies between operating\
    \ systems but generally refers to a display that appears above native windows\
    \ to show data pertaining to an. While using the windowing API of AIR, the RSS\
    \ reader will employ the same approach in presenting post in an unobtrusive manner\
    \ and present controls to move through the digest of the RSS feed or close the\
    \ window altogether.\n- Present options from the system tray — Unlike desktop\
    \ applications, a main window is present at all times in the z-order of native\
    \ windows on your screen, the RSS reader runs within the system of your operating\
    \ system and presents new posts as they are received from the service. As such,\
    \ using the native menu API of AIR, the application will present system tray options\
    \ that enable you to force a request, navigate to the feed in an Internet browser,\
    \ or quit the application.\n\nWith these points in mind, you can start building\
    \ the tools that address these requirements and create a desktop application that\
    \ will keep you informed of what is happening in the Flash Platform world.\n\n\
    The next section covers the value object that is used as the model to display\
    \ a single post within a toaster window from a list of posts received from the\
    \ feed service.\n\n# Handling Data\n\nAs the result from an RSS feed is received\
    \ by the application, data is parsed into a list of objects available for display\
    \ within the RSS reader. The display of each post is dependent on properties assigned\
    \ of a value object you will create in this section.\n\nWithin your development\
