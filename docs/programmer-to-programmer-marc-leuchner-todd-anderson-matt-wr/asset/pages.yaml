  md: '# Chapter 4: Music Player


    ![](img/ae8d13390b8907e42ae2ab60bd54e1f8_129_0.png)


    This application uses a stylesheet in the assets folder, along with some custom
    button skins. If you decide not to use these, comment out the styleName property
    of each button.


    # Button Controls


    The button controls for features such as play, pause, stop, forward, and next
    all in the same manner. When the user clicks one of the buttons, an event is dispatched
    to be listened by the SoundManager in the application controller. For instance,
    pressing Play button dispatches the PLAY_CLICK event, which tells the SoundManager
    that a song needs to play. The responsibility is to the SoundManager class to
    deal with that event effectively.


    # trackInfoDisplay


    One of the nested displays is the trackInfoDisplay. This group of displays information
    such playhead position, song duration, artist name, and song title.


    # Playhead Progress and Live Scrubbing


    One feature that many music players have is sort of progress bar that the user
    can drag (scrub) to change the playhead''s position in the song. In airAMP, this
    is represented by HSlider.


    The first challenge is to display the progress. This is accomplished by binding
    the value property of the HSlider component to the trackPosition property of PlaybackControls.
    The trackPosition property is updated by the SoundManager class. However, updating
    the value property will not make the HSlider move unless it is aware of the total
    duration of the song. This is set by binding the maximum property of HSlider to
    the trackLength property of PlaybackControls. The trackLength property is updated
    by the SoundManager through the application controller when a new song is loaded.
    Now that the HSlider''s track represents the length of the song, the thumb (the
    black triangular in figure 4-2) moves along track when the HSlider''s value is
    updated.


    The next challenge is to allow live scrubbing. Live scrubbing enables the position
    in the song to be updated when the user drags the thumb along. Because the thumb
    represents the position in the song, when the user moves it, the component needs
    to report the new time to the SoundManager. This is accomplished by utilizing
    the CHANGE event of HSlider. When the CHANGE event is dispatched, the newTrackPosition
    of the PlaybackControl is set to the thumb position. After that, the PlaybackControls
    component dispatches. The application controller then updates the playhead position
    in the SoundManager by calling the setPlayheadPosition() and passing the new value
    from the PlaybackControls. Lastly, the live dragging of HSlider must be set in
    order to enable clicking and dragging the thumb.'
