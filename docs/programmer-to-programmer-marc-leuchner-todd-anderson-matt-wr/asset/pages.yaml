    destinations-based

    locations. What is missing from the map application thus are user controls for
    navigating to and

    saving out those locations and destinations. Keeping in mind that available controls
    are also based on the

    current mode of the application — online or offline — get to work on the classes
    that will help you find

    where you want to go.'
