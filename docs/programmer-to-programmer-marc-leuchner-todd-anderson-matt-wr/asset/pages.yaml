  md: '# Chapter 2: Simple Text Editor


    The saveFile() function is when you''ll be taking the text from the TextArea component
    and writing that data to a file on the user''s hard drive. The first item of business
    in this function is a conditional that deals with whether or not the user has
    already opened a file. This was determined by whether the current variable is
    defined or not. If the variable is not null or undefined, then the file will be
    saved (using, or overwriting, the old file); if the variable is null, then the
    promptUserToSaveFile function (which will be called shortly) is to prompt the
    user to save the file on their hard drive.


    For example, the user has opened a file and made some changes, and wants to save
    the file. First, with the openFile() function, you need to check whether the fileStream
    is defined. If it is, then you call the FileStream''s close() method again (which
    is just to be safe). If you are past this condition, then you create a new File
    object; and in the openFile() function, providing it with the currentFile and
    the mode in which you want the FileStream to work. In this case, use the static
    property WRITE of the FileMode class to be writing data to the file. The openAsync
    method opens the FileStream object asynchronously.


    Next, add an event listener to fileStream to check for an I/O error during the
    file-writing process. Simply call the onError function when the IO_ERROR event
    is dispatched. It is hoped that this will never happen, but you can then tell
    the user whether they have a damaged disk section! This will prompt the user with
    a message saying something went wrong.


    Note that this file will not be able to be compiled until a few changes are made
    to it. However, the only thing left to do now is to take the text from the TextArea
    component and dump it into the file. This is as easy as calling the FileStream
    object''s writeUTFBytes() method and passing the string of text. The writeUTFBytes()
    method writes the bytes that represents the characters of the string into the
    file. It really doesn''t get easier than that!


