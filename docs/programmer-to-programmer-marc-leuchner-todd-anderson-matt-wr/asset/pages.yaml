    \ gesture:\n\n```\nprivate function onImageCanvasDrag(evt: Event):void {\n  _dragCopy\
    \ = true;\n  var transfer:Clipboard = new Clipboard();\n  transfer.setData(ClipboardFormats.FILE_LIST_FORMAT,\
    \ \n    getBitmapFile(_), false);\n\n  var thumb:BitmapData = BitmapUtil.generateThumbnail(\n\
    \    _currentImage.bitmapData,\n    DRAG_WIDTH, DRAG_HEIGHT,\n    true);\n\n \
    \ NativeDragManager.doAction(\"copy\");\n  NativeDragManager.doDrag(this, transfer,\
    \ getDragPoint(thumb));\n}\n```\n\nSimilar to the mx.managers.DragManager, which\
    \ enables you to drag data within a single Flex application, the flash.desktop.NativeDragManager\
    \ enables you to drag data from AIR applications and the operating system. The\
    \ transferable data created during the initialization of the gesture is a flash.desktop.Clipboard\
    \ object. A Clipboard instance acts as a container for a particular format. When\
    \ starting a native drag-and-drop action, the clipboard data is passed into the\
    \ state doDrag() method of the NativeDragManager.\n\nThe data set on the Clipboard\
    \ is a representation of what is transferred upon completion of the drag-and-drop\
    \ operation. When applying data to the Clipboard object, you specify the data\
    \ format, and a Boolean flag indicating whether the data should be serialized.\
    \ The Image Viewer and Editor enables you to edit images out of the application\
    \ and save them as image files. Since, the transfer format is an array of files,\
    \ you will only be able to drag one image at a time. Serialization of the data\
    \ will not happen and the data will not be available to dropped on another AIR\
    \ application.\n\nWhen a drag-and-drop gesture is made, the ImageView Editor creates\
    \ a temporary image and adds it to the clipboard, enabling users to transfer that\
    \ image as a file on their computer. Looking at the getFileFile()method, which\
    \ is called when placing data on the Clipboard object, the ImageViewer is writing\
    \ the bitmap data of the currently selected ImageData object to a temporary directory\
    \ created upon getFileFile:\n\n```\nprivate function getFileFile():File {\n  _tempFile\
    \ = _tempDir.resolvePath(_currentImage.name);\n\n  var fileStream:FileStream =\
    \ new FileStream();\n  fileStream.open(_tempFile, FileMode.WRITE);\n  fileStream.writeBytes(getEncodedBitmap(_currentImage.bitmapData));\n\
    \  fileStream.close();\n  return _tempFile;\n}\n```"
  merge: -1
  pgno: 219
- img_proc: true
  md: "# Chapter 6: Image Viewer and Editor\n\nThe data given to the file stream is\
    \ a ByteArray created using the JPEGEncoder and PNGEncoder codecs available in\
    \ the Flex 3 SDK. The getEncodedBitmap() method returns the appropriate encode\
    \ based on the fileExtension of the currently viewed ImageData object. That temporary\
    \ image file will be saved to the directory which the user has dragged, and is\
    \ removed from the temporary directory upon completion of the drop gesture. Upon\
    \ completion of being dragged from an AIR application to a directory, the dragComplete\
    \ event is fired.\n\n```\nprivate function onDragComplete(evt:NativeDragEvent):void\n\
    {\n    // copying to another location outside of application is complete...\n\
    \    _dragCopy = false;\n    // remove temp file;\n    if(_tempFile.exists) _tempFile.deleteFile();\n\
    \n```\n\nThe dragComplete(event) handler resets the drag flag to false and instructs\
    \ the temporary file to be removed using the deleteFile() method of the File class\
    \ after confirming its existence through the exists property. With being able\
    \ to drag and save image files, the Image Viewer and Editor is capable of handling\
    \ image files that are dragged onto the editor. Upon the application, listeners\
    \ for events coming from flash.desktop.NativeModuleManager are created to respond\
    \ to the drag-and-drop gestures. The dragEnter event handler specifies the application\
    \ as the drop target to receive any transferable data in the drag event:\n\n```\n\
    private function onDragEnter(evt:NativeDragEvent):void\n{\n    NativeManager.acceptDragDrop(this);\n\
    }\n\n```\n\nThe dragDrop handler receives the transferable data held on the flash.events.NativeDragEvent\
    \ instance and saves that data to the ImageBrowser:\n\n```\nprivate function onDragDrop(evt:NativeDragEvent):void\n\
    {\n    if(_dragCopy) return;\n    NativeDragManager.dropAction = \"copy\";\n \
    \   var files:Array = evt.clipboard.getData(\n        ClipboardFormats.FILE_LIST_FORMAT)\
    \ as Array;\n    browser.addFiles(files, dragOverCanvas(evt.localX, evt.localY));\n\
    }\n\n```\n\nWhen files are dragged onto the Image Viewer and Editor, the transferable\
    \ data from the NativeDragEvent is a list of File objects. A call to the addFiles()\
    \ method of ImageBrowser is made, supplying list of File objects and a flag indicating\
    \ whether the files were dropped on the ImageCanvas or elsewhere in the application.\
    \ A drop on the image canvas would initiate the selection of the last file in\
    \ the list once all the files have been loaded.\n\nThis section has described\
    \ how the drag-and-drop API is used by the Image Viewer and Editor, but what if\
    \ a user doesn't want to drag files in out? Opening and saving can be performed\
    \ by selecting from the File menu as well."
