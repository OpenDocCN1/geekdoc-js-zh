  md: "The method buildAppMenu creates the menu and returns a NativeMenu object:\n\
    \n```\nvar menu:NativeMenu = new NativeMenu();\nvar fileMenu:NativeMenuItem =\
    \ menu.addItem(new NativeMenuItem(\"File\"));\nfileMenu.submenu = buildFileMenu();\n\
    ```\n\nThe preceding snippet of code is taken from buildAppMenu. In this example,\
    \ a new NativeMenu object is created and a new NativeMenuItem named fileMenu is\
    \ added to it. If fileMenu has been added, the fileMenu submenu is assigned through\
    \ buildFileMenu, which returns a NativeMenu. The result is a menu titled File\
    \ that contains dropdown with options for Open Video and Close Player. The same\
    \ is applied to the View menu. Figure 12-3 illustrates the window menu running\
    \ in Windows.\n\n![](img/ae8d13390b8907e42ae2ab60bd54e1f8_463_0.png)\n\nFigure\
    \ 12-3\n\n# Context Menus\n\nContext menus are added to enable users to switch\
    \ between full-screen and normal window views. Basic play and functionality will\
    \ be added, as well as the fileMenu that was added in the last section. The context\
    \ menu is added to the application in the handleAppCreationComplete method:\n\n\
    ```\nthis.contextMenu = buildContextMenu();\n```\n\nThe buildContextMenu is set\
    \ up similarly to the buildAppMenu method and also returns a NativeMenu object.\
    \ A new NativeMenu object titled menu is created and the NativeMenuItems are assigned\
    \ to it. The only exception is when the application checks to determine whether\
    \ or not it is in full-screen:\n\n```\nif(isNormal) {\n    var fullScreen:NativeMenuItem\
    \ = menu.addItem(new\n    NativeMenuItem(\"ENTER FULLSCREEN\"));\n    fullScreen.addEventListener(\
    \ Event.SELECT , handleFullScreen );\",\n```"
