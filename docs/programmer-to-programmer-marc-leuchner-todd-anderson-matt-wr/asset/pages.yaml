  md: "# Chapter 9: Map Application\n\nThe third snippet, as queryVO and supplied\
    \ as the first argument for the addQuery() method, represents the queryVO objects\
    \ added to this managed query. Three attributes had on QueryVO are type, query\
    \ and itemClass which relate to the kind of query being made, the query string\
    \ to execute, and the class to map the result data, respectively. The SQLStatement\
    \ has the capability to map result data from a database to a specified class,\
    \ allowing you to work with data retrieved from the database without having to\
    \ parse and replace the property data manually. To map a specified class, use\
    \ the itemClass property of the SQLStatement. A reference to this class is passed\
    \ to the QueryVO object which is used for each query.\n\nAll query types to be\
    \ broadcast and that are related to destination-based locations are listed in\
    \ the DBResultSet event — as the second snippet. As SQL queries are completed,\
    \ the DBService dispatches DBResultSet instances with an event type matching that\
    \ of the property of the QueryVO instance. The result property of a DBResultSet\
    \ is the data returned from the SQL query.\n\nTake a look at one of the public\
    \ methods that adds a query to the queue to run:\n\n```\npublic function retrieveLocations():void\
    \ {\n    var sqlSelect:String = \"SELECT DISTINCT name FROM locations;\";\n  \
    \  addQuery(new QueryVO(DBResultSet.LOCATION_RETRIEVED_ALL, sqlSelect));\n}\n\
    ```\n\nThe retrieveLocations() method adds a new QueryVO object to the queue,\
    \ with the query value set to LOCATION_RETRIEVED_ALL constant on DBResultSet,\
    \ and the query value to a SQL statement that will select each name from records\
    \ held in the table locations in the database Locator.db upon initialization of\
    \ the DBService. Upon receiving a result from the executed SQL, a new DBResultSet\
    \ is dispatched, with the type given to the QueryVO and the result of the query:\n\
    \n```\nprivate function onQueryResult(evt:SQLEvent):void {\n    var resultSQLResult\
    \ = statement.getResult();\n    if (_currentQuery.type != FALL_THROUGH) {\n  \
    \      dispatchEvent(new DBResultSet(_currentQuery.type, result));\n    }\n  \
    \  executeNextQuery();\n}\n```\n\nUnfortunately, all the possible statements and\
    \ column types and constraints in SQLite, the SQL engine inside AIR, is too much\
    \ to cover in this chapter, and your encouraged to read the documentation available\
    \ from Adobe. However, short of covering all the statements by DBService relating\
    \ to storage and retrieval of location and destination data, the invalidate()\
    \ method is of notice.\n\nWithin the invalidate() method called from the constructor,\
    \ two tables are created, if not previously existent, in the local database using\
    \ the CREATE IF NOT EXISTS clause. These tables — locations and markers — will\
    \ store the location and destination data available to the application and used\
    \ in executing any subsequent queries on the database. Updates to the database\
    \ are performed in the public saveLocation() and saveMarker() methods using the\
    \ respective id properties of the LocationVO and MarkerVO to insert a new entry\
    \ or update an existing one."
