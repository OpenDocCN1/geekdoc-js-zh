    to time to debug or deploy, the system will be in place to handle all aspects
    of those things.


    For this development, you will need to download the Flex 3 SDK, which includes
    the AIR API and all the required command-line tools. The AIR SDK is also available
    for creating applications using HTML or AJAX, though the examples in this book
    are built in Flex.


    # SDK Installation


    This section explains how to download and install the Software Development Kits
    (SDKs) available from Adobe, as well as how to configure the setup to use the
    command-line tools found.


    # Flex 3 SDK


    Download the Flex 3 SDK from http://opensource.adobe.com/wiki/display/flexsdk/Flex+SDK.
    The one you download is a complete file flex_sdk_3 (or similar) which will be
    available within the directory to you downloaded the file. Case was the desktop.
    Unzip the contents of flex_sdk_3 to a directory whose location reflects how you
    want to organize files. For the purposes of the following examples, the Flex 3
    SDK was installed at: C:/flex_sdk_3 on Windows and /Applications/flex_sdk_3 on
    Mac X. If your installation directory is different, then change all to this reference
    directory to where you have installed the Flex.


    Add a path to your system properties to enable you to call various executables
    during our development process. The files you are primarily concerned with — since
    they relate to debugging and deploying — can be found in the /bin folder within
    the Flex SDK installation directory. The executables for the compilers are all
    Java programs, which can be found in the /lib folder within the directory. You
    have the option of adding the Java programs themselves to your CLPATH variable,
    but you may be accessing these native executables themselves — namely, ad_exe.exe,
    mxmlc.exe, and amxmlc.bat. In order to call these directly from the command line
    without having to provide the full path each time (such as C:/flex_sdk_3/bin/fd),
    add the /bin directory to the Path variable.


