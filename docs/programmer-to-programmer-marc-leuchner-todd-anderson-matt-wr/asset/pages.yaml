  md: '# 2


    # # Simple Text Editor


    With any new technology that has a file system API, you''re probably wondering
    how you would read and write files to your hard drive. There is probably no better
    way to learn this to write the most versatile program of all time: The Almighty
    Text Editor. Granted, everyone has their own favorite text editing program that
    they''ve been using for years, especially if you''re any sort of developer. The
    text editor you''ll develop in this chapter is by no means a program that will
    replace your existing text editor, but perhaps it will be the start of your own
    customized text editor that you extend with all the wonderful functionality that
    your current text editor is missing!


    This program illustrates a few important things about the AIR file system API.
    First you''re going to work with the `File` object to point to files on your hard
    drive. The chapter then covers how to use the `FileStream` and `FileMode` classes
    to read and write to a file (in this, case, text). Lastly, you will learn how
    to use the `ImageFilter` class to limit the types of files the user is allowed
    to open.


    # ## The Text Editor


    A text editor is one of the simplest programs you could write, especially within
    the Flex and AIR frameworks. The reason it is so simple is that it essentially
    performs only two tasks: open or read a file and save or write a file. Aside from
    those tasks, you will dress it up with a light interface and a few accessory methods
    so you can perform actions such as New Document and Save As. The view, or display,
    of the program is simply a menu that enables you to perform these methods, and
    an area in which to edit the text. It is really that simple.'
  merge: -1
