    A Marker object takes a data type of MarkerVO and displays the associated caption
    of that value

    object in a tooltip rollover. Assigning that caption value occurs within the Marker
    container,

    which is presented in a pop-up upon the addition of a new marker to the display
    of LocationDisplay.

    MarkerForm presents two options when adding a caption to a marker. If you choose
    to save

    caption to the marker, the value is updated and the Marker instance is kept on
    the display. If you choose

    to cancel, then the Marker is removed from the display.


    You have created the display classes to view locations and destinations, and in
