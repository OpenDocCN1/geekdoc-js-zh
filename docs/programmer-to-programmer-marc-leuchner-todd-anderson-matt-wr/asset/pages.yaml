  md: '# 10


    # Blogger Agent


    If you''ve ever wanted to write a blog entry when your computer wasn''t connected
    to the Internet, you wouldn''t be alone. Get around this situation, you''ve probably
    written your entry and saved it to some sort of text file for later posting. When
    your computer was connected to the Internet again, you probably logged into your
    blogging service, navigated to the compose entry page, opened your text file,
    and then copied and pasted the text into the form. That certainly doesn''t feel
    efficient. Surely there is a better way.


    Likely, most blogging services and blogging software offer some sort of web services
    that enable third-party services and applications to communicate with them. This
    chapter will utilize Google''s Blogger service (www.blogger.com). Blogger is a
    simple blogging service that has a very useful data API that enables third-party
    applications to retrieve and send various pieces of data through simple GET and
    POST requests. The application you will build in this chapter utilizes this service
    combined with functionality in Adobe AIR to avoid the inefficient process described
    in the previous paragraph. If you do not already have an account with Blogger,
    it would be best to create one before you begin this chapter.


    The following section discusses the design of the application. This includes the
    logistics of managing the data and the components that are necessary for the user
    interface. After design, you''ll get into the code and learn about the important
    classes and functions that tie everything together.


    # Design


    If you''ve ever worked with browser-based Flash content that attempts to communicate
    with servers other than the one your content is running on, doubt you have run
    into some security concerns. Normally, in order for a web service to allow blogging/plugin-based
    Flash content to access it, a cross-domain file (crossdomain.xml) must reside
    at the root level of the application''s domain. This would be an issue when developing
    an application such as the one in this chapter.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Chapter 10: Blogger Agent


    However, in contrast to browser-based Flash content, Adobe AIR content does not
    need a cross-domain file to be present in order to access it. In other words,
    you don''t have to worry about any security issues, and this application will
    take advantage of that fact.


    Additionally, it''s a good idea to make a list of items that your application
    aims to fulfill. The following list outlines the most important functionality
    of the Blogger Agent application:


    +   - Allow users to manage all of their Blogger accounts/blogs.

    - Allow users to compose and publish blog entries.

    - Allow users to add blog entries to a publish queue.

    - Allow users to preview their blog.

    - Display a list of saved accounts.

    - Display a list of queued blog entries.

    - Store account information in a local database.

    - Store queued blog entries in a local database.

    - Encrypt all saved accounts.


    These are the main features of the Blogger Agent application. The application
    is relatively simple and will utilize some great features available in Adobe AIR.
    In the following sections you will learn how to approach the application and the
    specific Adobe AIR features that will be utilized to create the functionality
    outlined above.


    # Managing Accounts


    This application will enable users to manage all of their blogs associated with
    any Blogger account. In order to achieve this, the Blogger Data API will be utilized
    to enable users to retrieve a list of blogs associated with their Blogger username
    and password. Users can choose a blog from the returned list and save the blog
    information to a local database.


    You will create a service class BloggerService to manage the communication between
    the Blogger Data API class. This class performs user authentication and retrieves
    the list of blogs for user''s credentials. Second, in order to save the blog information
    to the user''s hard drive for use, you will create another service class DBService.
    This class utilizes Adobe AIR''s native SQLite support to create and manage a
    small database. These two classes are illustrated in Figure 10-1.


    | blogger.com | Managing Class or Component | SQLite Database |

    | --- | --- | --- |

    | | BloggerService | DBService |


    Figure 10-1'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Chapter 10: Blogger Agent


    Within the database table titled blogs holds the necessary information about the
    blog and the user''s account. Additionally, this class utilizes the native AIR
    class called LocalEncryptedStore to store the user''s password in an encrypted
    state. The DBService class requires a custom event named DBServiceEvent. Lastly,
    you will create a simple object called Blog. This class serves as an Action-Script
    representation of the information stored in the SQLite database.


    # Managing Blog Entries


    In addition to managing accounts, users will be able to manage blog entries. Blog
    entries, composed of a title and body, will be allowed to be published immediately
    if the user is connected to the Internet, or if they will be saved in a queue
    after the user has reconnected. Publishing blog entries will be managed by the
    aforementioned BloggerService class. Furthermore, the DBService class, also previously
    mentioned, will take care of managing the saved entries. To represent a blog,
    you will create a simple object called BlogEntry. This class serves as an ActionScript
    representation of the information stored in the database.


    Lastly, in order to publish the saved entries in a queued manner, you will create
    two classes. The PublishQueueItem holds a reference to a BlogEntry object and
    the entry''s corresponding Blog object. The other class you will write is a service
    called QueueService. This class manages the subsequent publishing of all blog
    entries saved in the database.


    # Utility Classes


    This application will utilize two classes, the first being the NetworkConnection
    class. This class will utilize the Adobe AIR NativeApplication class to detect
    the user''s connection status has particular functionality. For example, users
    should not be able to publish a blog entry or start deactivating the publish queue
    if their computer is not connected to the Internet. The second utility class will
    be aid in formatting XML documents for the BloggerService class. The Blogger Data
    API services and exports XML documents using the standardized Atom 1.0 XML schema.
    Then, you will create a class called AtcmUtil to aid in the parsing and formatting
    of XML for the Blogger Data API.


    # User Interface


    The user interface is relatively simple for this application, composed of five
    components, including the main interface. The user has the choice of selecting
    different screens. Each screen enables the user to perform a different operation.
    The first screen is presented with the BlogManager component. This panel displays
    a list of all currently saved blogs, as shown in Figure 10-2. From this screen
    users can add a blog, which brings up the AddBlogPrompt component. This prompt
    is where users enter their username and password to retrieve a list of blogs.


    The second screen may be open the ComposeEntryPanel component. This screen includes
    a drop-down of available blogs to publish to and a form in to enter the blog entry.
    From this screen the user is also able to publish the entry or add it to the queue,
    as shown in Figure 10-3.'
