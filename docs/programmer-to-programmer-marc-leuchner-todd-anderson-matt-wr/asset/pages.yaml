    Save the file as RSSReader-app.xml in the root of your working directory along
    with the RSSReader.msxml file.


    This will serve as the application descriptor file. The elements declared within
    the <initialWindow> tag are important for hiding the main application window and
    allowing the system and dock icons to act as the access point for the RSS reader.
    The system chrome will not be drawn and made transparent and the RSS reader will
    be visible on the display.


    Along with the attributes set for the chrome of the RSS reader, when the application
    is installed it will be named RSSReader and be available in the AIRCMR folder
    of the application operating system.


    With the descriptor file in place, you are set to compile and package the RSS
    Reader AIR executable.


    # Compiling and Packaging


    Two files are necessary to package an AIR application: the main SWF file and the
    XML application descriptor file. In this section you will produce the SWF file
    using the command-line tools and package the AIR application.


    > The graphic assets used for the dock and system tray icon can be found on the
    CD-ROM, or you can create your own. If you are following along with the examples
    in this chapter, those graphic assets reside in a folder named assets in the working
    directory.


    Open a command prompt, navigate to the working directory of the RSS reader, enter
    the command, and press Enter:


    ```

    > xmlmvc RSSReader.msxml

    ```


    If you have purchased a certificate from a certificate authority, such as VerSign
    or Thawte, then you may use that certificate, rather than create the self-signed
    certificate, and skip the following operation. To create a self-signed certificate
    within the working directory, enter the following command:


    ```

    > adt -certificate -cn RSSReader 1024-RSA certificate.pfx

    ```


    With the command still pointing to the working directory, enter the following
    command to package the RSS application:


    ```

    > adt -package -storetype pkcs12 -keystore certificate.pfx RSSReader.air RSSReader-app.xml
    RSSReader.swf

    ```'
