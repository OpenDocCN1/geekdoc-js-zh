    # # Summary


    In this chapter, you have created a working Slideshow Maker while delving deeper
    into the AIR file system API as it pertains to serializing objects to a file.
    You have also learned to associate file types with an application from the application
    descriptor file, and spawn Window objects used for full-screen presentations and
    notification alerts.


    From here, you can set up keystroke commands that coincide with the menu commands
    for saving and viewing slideshows, and add more commands as you see fit. You can
    also add more properties to the Properties panel and extra controls to make more
    engaging slides.


    In the next chapter, you will continue to add to your toolbox of AIR knowledge
