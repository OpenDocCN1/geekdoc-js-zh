    # Displaying the SettingsPanel


    If you look back at the openSettingsPopup method of the MusicPlayer application
    class, you would see that the SettingsPanel component is initialized and show()
    is called. The show method is how mx:TitleWindow component is added to the DisplayList.
    This method, in turn calls createPopup() method of the PopUpManager class, which
    is wrapped in a SettingsPanel object in order to refer methods in the SettingsPanel,
    such as the init method.


    The PopUpManager class createPopup method accepts three parameters. The first
    is the location where the pop-up is displayed; in this case you''re passing a
    reference to the parent application. The second is the object you want to display;
    this just happens to be the SettingsPanel. The final parameter is a Boolean indicating
    the instance is a modal, meaning it will receive all focus until closed; set to
    true because this is the desired action, as you want to make sure that users can''t
    click on anything else while they''re in the Settings window.


