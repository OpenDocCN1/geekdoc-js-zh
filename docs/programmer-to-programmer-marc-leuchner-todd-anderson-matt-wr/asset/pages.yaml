  md: "# Chapter 9: Map Application\n\nWithin the click event handler for the Save\
    \ button, the LocationsControl class also dispatches a save to indicate that the\
    \ user has opted to save the current location and destinations:\n\n```\nprivate\
    \ function locationManagerSave():void {\n  // if we changed the name, mark for\
    \ new entry...\n  if(saveField.text != _data.location.name) {\n      _data.location.id\
    \ = -1;\n      _data.location.name = saveField.text;\n  }\n  dispatchEvent(new\
    \ Event(LocationControls.SAVE));\n}\n```\n\nLocations entered into the database\
    \ with a unique ID with the location, setting the id property on the current Location\
    \ object to a value of -1 will flag the data as not having been previously saved.\
    \ The statement in the locationManagerSave()handler checks whether the user has\
    \ been working with data received from the database and has chosen a new associative\
    \ name for that data — prompting a client who will communicate with the database\
    \ to add a new entry, rather than overriding any existing data.\n\nThe MarkerBank\
    \ component displays a Marker instance enabled to be dragged and dropped onto\
    \ any display object with drag-and-drop capability enabled — in the case of this\
    \ application, that is the display of the LocationDisplay component. Using the\
    \ MarkerBank component from this example currently displays a single marker with\
    \ generic graphics, which can be updated to handle additional markers that have\
    \ specific graphics based on destination types — such as places to eat or stay.\n\
    \nWith the appropriate value objects available and the view classes for interacting\
    \ with destinations-locations, in the next section you will create the main file,\
    \ which communicates with the local database, handles events coming from these\
    \ control views, and interfaces with the database service classes.\n\n# Bringing\
    \ It All Together\n\nYou have come a long way! The following examples you get\
    \ started on managing the events coming from the view classes you created in the\
    \ previous sections.\n\nCreate a new document and enter the following markup:\n\
    \n```\n<xml version=\"1.0\" encoding=\"utf-8?>\n<mx:WindowedApplication\nxmlns=\"\
