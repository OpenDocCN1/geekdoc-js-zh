  md: "# Chapter 9: Map Application\n\nNow that you have data objects to represent\
    \ locations and destinations, and a means to store data locally, it's time to\
    \ get to work on visually presenting this data. The next section discusses the\
    \ user interface that will enable you to access, manipulate, and save-destination\
    \ locations.\n\n# Building the User Interface\n\nThe user interface controls available\
    \ from the map application are based on the availability of a network resource.\
    \ You have the capability to work with online data, which is dependent on an Internet\
    \ connection, and the capability to work with saved data, which doesn't require\
    \ an Internet connection. As such, the map application has three views:\n\n+ \
    \  Mode control view — The mode control responds to the loss or gain of an Internet\
    \ connection and enables a user to choose whether to work with data stored locally\
    \ or coming from an online map API.\n\n+   Display view — The display view updates\
    \ its view based on the mode control. When a user opts or is forced to work offline,\
    \ the display will render any saved graphics and markers of a location. While\
    \ working online, the user can navigate and download graphics from the API presented\
    \ in the display view.\n\n+   Location control view — The location control updates\
    \ its interface controls based on the mode control and enables a user to add,\
    \ search, and edit locations.\n\nThe next section addresses the mode control from\
    \ this list of primary views that affects the display states of the location control\
    \ and map views.\n\n# Handling View Modes\n\nThe map application enables a user\
    \ to navigate locations and place markers. If an Internet connection is available,\
    \ locations can be accessed through an online service or saved data. If an Internet\
    \ connection is not present, then only the saved data is available. The main application\
    \ will create later in this chapter recognizes the option to connect to an online\
    \ service, so the classes you will create in this section reflect and present\
    \ the option to work with either (offline) data or online data:\n\n+   1. Open\
    \ the file com.aircmr.locator.ui create a new document and enter in the following\
    \ ActionScript:\n\n```\npublic class ModeType {\n    public static const ONLINE:String\
    \ = \"online\";\n    public static const OFLINE:String = \"offline\";\n}\n```\n\
    \n+   2. Save the file as ModeType.as in the directory com/aircmr/locator/ui in\
    \ your working directory.\n\n299"
