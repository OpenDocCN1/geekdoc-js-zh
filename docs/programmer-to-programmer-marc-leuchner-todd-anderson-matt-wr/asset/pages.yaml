    {\n    var data:ByteArray = new ByteArray();\n    data.writeUTFBytes(password);\n\
    \    EncryptedLocalStore.setItem(\"blog-* + blogID, data);\n}\n\nprivate function\
    \ unencryptPassword(blogID:int):String\n{\n    var passwordData:ByteArray = EncryptedLocalStore.getItem(\"\
    blog-* + blogID);\n    return passwordData.readUTFBytes(passwordData.bytesAvailable);\n\
    }\n```\n\nThese methods perform as you would expect. Specifically, in this application,\
    \ both functions utilize Air's EncryptedLocalStore class to encrypt and unencrypt\
    \ passwords. The EncryptedLocalStore class provides methods for setting and getting\
    \ objects in the encrypted local data store for an AIR application. Items in the\
    \ encrypted local data store are identified with a string, and all items are stored\
    \ as byte array. Anything stored in memory is only available to Adobe AIR application\
    \ connection. It is the perfect place for storing sensitive information such as\
    \ a user's Blogger password.\n\nHere, the blogID parameter in each function relates\
    \ the id column of the record table of the database. This ID is used to create\
    \ a string that names the item to store or retrieve from the encrypted local store.\
    \ To retrieve an, the static getItem method is used. This method requires a string\
    \ specifying the item to retrieve. The method will return a ByteArray object.\
    \ Using the byte array's readUTFBytes method, the password is extracted from the\
    \ byte information and returned as a useful String. To save an item, the static\
    \ setItem is called. Two parameters, a String and a ByteArray, are required to\
    \ save the data to the encrypted local store.\n\nThat covers main functionality\
    \ of the DBService. In the next section, you will create a class to manage the\
    \ publishing of blog entries in the publish queue.\n\n# The Queue Service Class\n\
    \nIn this section you will create the QueueService class. This is a relatively\
