    ![](img/ae8d13390b8907e42ae2ab60bd54e1f8_283_0.png)


    Figure 8-1


    The SettingsWindow is a Canvas component that has a nested VBox containing the
    options for Zip Code, Refresh Interval, Temperature Display, and Always in Front.
    When the component is displayed, a show event calls the private refreshWindow
    method, which updates the visual representations of the settings properties values.
    Otherwise, procedures are controlled through the user’s interactions.


    # Zip Code


    The zip code TextInput’s component is bound to the zip code property of the SettingsVO
    in the data model. When the user clicks the Save button, an instance of the Flex
    ZipCodeValidator component validates the zip code. If it is successful, then the
    method saveSettingsLocally is called. This method is discussed in more detail
    in the section "Saving the Settings"


    261'
