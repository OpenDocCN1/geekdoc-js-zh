  md: '# Chapter 12: AIR Video Player


    # Public Variables


    Before jumping into the interface is created, review the public variables that
    control the UIVideoControls component:


    +   - playheadTime: Once the video has started playing, the UIVideoPlayer component
    updates its property time the playhead has changed. When the variable is set,
    the handleVideoPlayheadUpdate method is accessed. This method changes the time
    and adjusts the marker on the video scrubber.


    +   - playheadTotal: Once the video has loaded, this is set. Use this to display
    how long the video is using the current playheadTime. This also acts as the maximum
    value for the timeline scrubber.


    +   - newPlayheadTime: Any time the user moves the marker on the video scrubber,
    or rewinds, you must update this value. By so, a playheadTimeChange event is triggered,
    telling the UIVideoPlayer that the video''s playheadTime must be updated.


    +   - volume: This value is updated by the volume controller and dispatches the
    volume event. Once the event is thrown, the volume is updated in the UIVideoPlayer.


    +   - playing: This Boolean is bound to the VideoDisplay component instantiated
    by the UIVideoPlayer. As the value changes from true to false, you use the styleName
    to match either a player icon or a pause icon.


    # Handling Timestamps


    The playheadTime is represented in minutes. Unfortunately, most video time are
    represented in minutes, so as 0:30 rather than 90 seconds. In order to format
    the time in such a manner, you will need a DateFormatter:


    ```

    <mx:Formatter id="time" formatString="NN:SS" />

    ```


    This DateFormatter will format the playheadTime into NN:SS, which represent minute
    : second. You access this by calling the following:


    ```

    timeFormatter.format(new Date(playheadTime * 1000 ))

    ```


    The Date class allows a Date object to be set through the format method. It multiplies
    the playheadTime by 1000 to convert to milliseconds, and then it passes the playheadTime
    in milliseconds to a new Date object. The result is a String that looks like 01:30.


    # Video Scrubber Controller


    Most video players have some sort of timeline controls. As the video''s time progresses,
    there is some graphical representation that can serve as a way to (scrub) positions
    in view. The HSlider component will work for the video scrubber. The scrubber
    is called the <mx:HSlider> markup with the ID scrubber.


    As the playheadTime is updated, the position of the HSlider''s value is updated,
    moving the thumb along the slider. This is handled in handleVideoPlayheadUpdate
    method. The maximum property of the Slider is bound to the playheadTimeTotal property;
    the thumb marker position on the slider will represent the position of playheadTime
    in relation to the playheadTimeTotal. This gives the user an accurate view of
    the video''s progress.


    430'
