    \ application specifies a file name with BloggerAgent, which is hard-coded as\
    \ a private static variable. After the database connection is opened, two database\
    \ tables are created. Created these tables: createBloggerTable and publishQueueTable,\
    \ respectively. These methods are called in a brief event chaining sequence once\
    \ the SQLConnection dispatches an OPEN event. Notice the specific SQLEvent and\
    \ SQLError events. These events will help you manage the connection. After the\
    \ OPEN event is dispatched, the onOpen event handler is handled.\n\nMake the following\
    \ changes and additions to the markup of the executeStatement function of the\
