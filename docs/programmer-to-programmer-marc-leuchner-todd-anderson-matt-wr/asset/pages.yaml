  md: '# Chapter 1: The Development Environment


    Within this directory — C:/Development/AIR or /Development/AIR — will reside your
    AIR project directories. From here on, this will be referred to as the ''development
    directory''.


    Your first project will create a simple Hello world. There is nothing special
    about this application and it will not involve much of the AIR API other than
    the Windowed container. It is intended to introduce you to compiling, debugging,
    and packaging your application.


    Within your development directory, create a folder named HelloWorld. You need
    at least two files in order to compile and deploy AIR applications:


    +   - A main file — This can be an MXAML (.xml) or ActionScript (.as) file.

    - An application descriptor file using the XML markup


    Most, if all of the examples found in this book have an MXAML file as the application''s
    main file. This is the file you will use as the main argument to the avenir compiler
    when it comes to compile. In the case of the Hello World application, this will
    be HelloWorld.xml.


    The naming convention for the project''s application descriptor file is used throughout
    this book the string -app allows you to name the file as you wish. In the case
    of the Hello World application, the application descriptor file is named HelloWorld-app.xml.
    The generated SWF and the application descriptor will be used to deploy and preview
    your application prior to packaging. To create an AIR installer, you will need
    a signed certificate, the generated SWF, the application descriptor file, and
    any ancillary files (such as graphics files).


    Because the Flex and AIR command-line tools are available within the SDK you installed,
    you are not reliant on an IDE and can continue development by firing up your favorite
    text editor.


    # Code and Code Explanation


    Open your favorite editor and create a new document. Then, complete the following
    steps:


    +   1. Enter the following markup (alternatively, you can find this example in
    the code files for this chapter on the accompanying website):


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <application xmlns="http://ns.adobe.com/air/application/1.0">

    <id>com.air.HelloWorld</id>

    <version>0.1</version>

    <filename>HelloWorld.xml</filename>

    <name>HelloWorld</name>

