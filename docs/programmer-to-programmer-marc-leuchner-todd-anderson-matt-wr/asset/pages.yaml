  md: '# Chapter 5: Mini CMS


    In order for the application to work properly within the context of your owner,
    modify the configuration variables at the beginning of the script:


    ```

    // Configuration

    $GLOBALS[''xmlDataURL''] = ''http://yourdomain.com/minicms/dataset.xml'';

    $GLOBALS[''xmlDataPath''] = ''/serverpath/minicms/dataset.xml'';

    $GLOBALS[''assetsFolderURL''] = ''http://yourdomain.com/minicms/assets/'';

    $GLOBALS[''assetsFolderPath''] = ''/serverpath/minicms/assets/'';

    ```


    The previous snippet contains the configuration variables for the gateway script.
    You''ll have to change these to work within the context of your server. URLs should
    be configured to match that of your domain name and internal folder. Paths should
    be configured using the physical path to the XML data file and assets folder.
    If you are unsure of the disk path, create a test script within the folder to
    which you upload the gateway script. Then the PHP function getcwd() within this
    script outputs the physical path of the current working directory—in other words,
    the directory in which the script resides. When it comes in time to upload this
    file to server, the server must have PHP installed and running on it. Additionally,
    the server must have permission to write to its hard drive.


    The remote gateway script is programmed to handle three actions: validation, data
    upload, and asset upload. The application specifies which action to perform by
    setting a query string variable named action. For instance, when a user attempts
    to validate the gateway URL, the application will take the user''s input and attach
    the validation query string. The URL that the application will attempt to load
    looks like this: http://yourdomain.com/minicms/gateway.php?action=validate.


    Regarding the validation process, note that the application relies on the gateway
    script to provide it with two variables:


    ```

    function handleValidate()

    {

    echo ''success&xmlDataURL=''$GLOBALS[''xmlDataURL''].''&assetsFolderURL=''$GLOBALS[''assetsFolderURL''];

    }

    ```


    Here, the handleValidate function outputs a message that the application will
    be able to read if the user enters a valid URL for the gateway script. The message
    will be parsed by the application to extract the XML to data file, and the URL
    to the assets folder.


    In the next section, you will learn how to create the necessary files to manage
    settings data.


    # Settings Model


    In order all components of this application to function properly, crucial information
    must be available to all classes and throughout the application. We will create
    two classes to accomplish this. First, the SettingsClass will utilize a Singleton
    pattern to serve as a repository for the important settings variables. Second,
    the SettingsService class will be in charge loading and saving of the settings,
    into the application and to the user''s hard drive for use. The settings will
    be saved in a simple XML file.


    In your development directory, create a folder titled Mini CMS. This will be your
    working directory for this program.


