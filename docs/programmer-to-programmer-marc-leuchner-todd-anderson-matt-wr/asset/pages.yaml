  md: "# ## Chapter 4: Music Player\n\nAfter a new FileSearch is instantiated, a FileSearchEvent.SEARCH_FINISHED\
    \ event is added to listen for the search results. The FileSearchEvent is discussed\
    \ in the following section. Once the listener is added, queryDirectoryToList()\
