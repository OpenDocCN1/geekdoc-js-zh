  md: 'The final step is to instantiate the data loading process by creating a new
    XMLFileService instance that will load the settings.xml file. This was discussed
    earlier in the chapter when the XMLFileService was introduced.


    # Deploying the Application


    If you tested the application at this point, it should execute, load the data,
    and animate to the current day''s weather view. The menus should be assigned and
    the tray icon should display. You are just finished with your weather widget.
    The last step is to package the application so it can be deployed. The next sections
    discussing the descriptor file and packaging the AIR application for deployment.


    # The Descriptor File


    The final file needed in the creation of your weather widget is the application
    descriptor file. This XML file contains properties for the application, such as
    the initial window settings, copyright, title, and icon URLs. It is packaged and
    distributed with the final deployable file.


    Create a new document and enter the following markup:


    ```

    <application xmlns="http://ns.adobe.com/air/application/1.0">

    <id>com.aircmr.WeatherWidget</id>

    <filename>WeatherWidget</filename>

    <version>0.0</version>

    <name>AIR WeatherWidget</name>

    <description></description>

    <copyright>2008</copyright>


    <initialWindow>

    <content>WeatherWidget.swf</content>

    <systemChrome>none</systemChrome>

    <transparent>true</transparent>

    <visible>true</visible>

    </initialWindow>


    <icon>

    <image16x16-icons/16x16.png</image16x16>

    <image32x32-icons/32x32.png</image32x32>

    <image48x48-icons/48x48.png</image48x48>

    <image128x128-icons/128x128.png</image128x128>

    </icon>


    <installFolder>AIRCMR/WeatherWidget</installFolder>

    <programMenuFolder>AIRCMR/programMenuFolder>

    </application>

    ```


    Save the file as WeatherWidget-app.xml in the root of your working directory along
    the WeatherWidget.mxml and settings.xml files.


    This file will be the descriptor file for the weather widget. The widget will
    have its own window design and interface, the <systemChrome> property is set to
    none, and <transparent> is set to true.'
