- img_proc: true
  md: '# Chapter 12: AIR Video Player


    Once the package is created, navigate to your video directory. If the video player
    packaged correctly, you should have an AIRVideoPlayer.air file. Execute the AIRVideoPlayer.air
    package in order to install the application on your hard drive. Once it is installed,
    drag and drop the video into your new video player, and enjoy the show.


    # Summary


    This chapter covered how to utilize the VideoDisplay component included in the
    Flex API in combination with other components and classes such as the HSlider
    and DataFormatter to create a fully video player component capable of playing
    FLV or H.264 encoded video. It introduced the idea of creating a liquid component
    layout that allows for resizing to video content width and height. Building the
    video player component, the chapter discussed how to create a player that can
    be used with or without the AIR SDK.


    Once the video player was created, you learned how to implement the component
    in an AIR application. The AIR Video Player uses the NativeMediaPlayer and NativeMenu
    to provide users access to playing videos. Lastly, you learned how to enable full-screen
    video support by setting the stage.displayState, and how to adjust the layout
    of the application accordingly. As a result of all these features, the AIR Video
    Player is capable of playing multiple formats and can be customized and distributed
    cross-platform.


    As stated earlier in this chapter, the intention of this player was not necessarily
    to create a video player with a lot of bells and whistles, but to create a good
    base for you to improve on. You could take this application and add features such
    as playlist support, custom skins, a custom slider (in place of the HSlider),
    multiple window support, controller effects such as fading in and out when full-screen,
    or anything else that you can think of. The video player is yours to utilize either
    in Flex or in AIR, it is left to you to perpetrate the next QuickTime killer app.'
