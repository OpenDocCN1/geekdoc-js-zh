  md: '# Weather Widget


    Widgets, or desktop applets you interact with, are everywhere. With programs such
    as Yahoo''s Konfabulator, Google''s Desktop Gadgets, Microsoft Vista''s Sidebar,
    and Apple''s Dashboard, widgets have grown in popularity. Every operating system
    has at least three different choices of widget engines. Operating across all platforms.
    Even if one particular widget is easy to program, you are still wondering whether
    the end-user has at least Microsoft Vista installed on their computer. The best
    option is to create the same widget for Microsoft Vista''s Sidebar and Apple''s
    Dashboard, except you''re left wondering about everyone running Windows XP. Given
    this conundrum, you might conclude that this niche market is a mess.


    You could create a widget using Adobe AIR API — after all, it this chapter is
    about. Why would you create a widget using AIR and not one of the other systems
    available for widgets? Because of the volume of AIR applications developed by
    large companies and independent developers, the probability of the end-user having
    Adobe AIR installed on their computer is pretty high. This can be said for Windows,
    OS X and Linux platforms. AIR allows you to develop a widget using a familiar
    set of tools (Flex, ActionScript, and the AIR API) and reach a larger audience
    with minimal effort.


    This chapter takes an in-depth look at creating a widget that retrieves the weather
    for a particular location. Although this is a fairly common type of widget, it
    serves as a base from which you can develop future widgets in AIR. This chapter
    discusses the Following/AIR concepts for building a widget:


    +   - Creating a "chromeless" application that is always in front of other applications


    +   - Utilizing minimize() and restore() commands to hide and show the application


    +   - Creating dynamic icons and menus for Microsoft Windows''s System Tray and
    Mac OS X''s dock'
  merge: -1
