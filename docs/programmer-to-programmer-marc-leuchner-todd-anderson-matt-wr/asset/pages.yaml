  md: '# Chapter 8: Weather Widget


    # Design


    A common problem in the computer industry is the perception that the viewable
    size of an application reflects its complexity. In other words, something such
    as a banner ad on the web is considered to be "simple" and therefore easy to create
    in a minimal amount of time. If you''re talking about a program such as Adobe
    Photoshop, then this perception is moderately accurate. However, simplicity does
    not always mean it will be easy. Even a simple application, such as a widget,
    can be complex.


    The weather widget is an example of a small fairly invoked application. Because
    it is supposed to be a functional ornament for the user''s desktop, the viewable
    size has to be small. However, it still needs to be able to store the user''s
    information; and at a minimum, it has to show today''s weather. Overall, the Weather
    application has the following features:


    +   - Multiple views: In order to keep the widget''s view compact, the current
    and four-day forecast will also have a loading screen that is displayed when the
    data is loading. There will also be a settings containing such as code entry,
    refresh interval, Celsius/Fahrenheit toggle, and "always in front"

    - Native system menu: In order to keep the widget''s view compact, the system
    menu will be hidden, and accessible as either a contextual menu (right-click on
    the widget) or a system tray (dock). It will have the options to exit the application,
    toggle between single and four-day forecasts, opens the settings view, and toggle
    between minimized and restored windows views.

    - Dynamic system tray (dock) icon: Users will be able to view the current temperature
    as an icon in either their system tray (Windows) or dock (OS X). As mentioned
    in the previous bullet point, when the user clicks on the dynamic icon, they will
    be presented with the menu for the widget. If the user minimizes the application
    in Microsoft Windows, the widget will be completely hidden, with the exception
    of the system tray icon, making the application will not be shown in the taskbar,
    but will be accessible through the system icon.


    Lastly, the data needs to be pulled from an external weather service. There are
    a few different options for weather services. This application will use Google''s
    publicly available weather feed, multi-day forecast set, which is because of its
    easily interpreted XML structure. Although this widget will be initially set up
    to use Google, the choice to continue to use it is up to you. The following are
    alternatives:


    +   - National Weather Service XML Web Service (www.weather.gov/xml)

    - Yahoo! Weather (http://developer.yahoo.com/weather)

    - AccuWeather.comRSSFeed (accuweather.com/rss-center.asp)


    # Building the Directory Structure


    Before discussing how the weather widget is built, it is important that the directory
    structure for this chapter is properly set up.


