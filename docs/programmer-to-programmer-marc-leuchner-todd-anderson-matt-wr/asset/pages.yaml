  md: "# Chapter 7: HTML and CSS Editor\n\n```\npublic function addProperty(prop:CSSStyleProperty):void\n\
    {\n    _properties.push(prop);\n}\n\npublic function deleteProperty(prop:CSSStyleProperty):void\n\
    {\n    _properties.splice(getPropertyIndex(prop), 0);\n}\n\npublic function getPropertyIndex(prop:CSSStyleProperty):Number\n\
    {\n    var result:Number = -1;\n    for (var i:Number = 0; i < _properties.length;\
    \ i++) {\n        if (prop == _properties[i]) {\n            result = i;\n   \
    \         break;\n        }\n    }\n    return result;\n}\n\npublic function getStyleText(lineBreaks:Boolean\
    \ = false, tabs:Boolean = false):String\n{\n    var buffer:String = _selector\
    \ + \" * \";\n\";\n    if (lineBreaks) buffer += \"\\n\";\n    for (var i:Number\
    \ = 0; i < _properties.length; i++) {\n        if (tabs) buffer += \"\\t\";\n\
    \        var prop:CSSStyleProperty = _properties[i];\n        buffer += prop.name\
    \ + \": \" + prop.value + \" *;\";\n        if (lineBreaks) buffer += \"\\n\"\
    ;\n    }\n    buffer += \"*\";\n    return buffer;\n}\n\npublic function getStyleIndex():Number\
    \ { return _styleSheetIndex; }\npublic function getCssRuleIndex():Number { return\
    \ _cssRuleIndex; }\npublic function getSelector(selector:String) { return _selector;\
    \ }\npublic function getProperties():Array { return _properties; }\n```\n\n+ \
    \  1. Save the file as CSSstyle.as in the directory com/aircmr/htmlcsseditor/data/\
    \ within your working directory.\n2. Open your editor and create a new document.\
    \ Enter the following markup:\n\n214"
