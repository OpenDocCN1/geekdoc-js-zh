  md: '# 5 Mini CMS


    Making a content management system (CMS) in AIR is a fantastic idea. What could
    be better than a cross-platform desktop application that enables you to manage
    remote content? OK, a lot of things are better, but in the context of AIR, the
    CMS is a pretty snazzy possibility. The application you will create in this chapter
    should give you a good start on creating a simple CMS application. You could approach
    the creation of a CMS in many different ways, but in this case the application
    is going to be kept rather simpler, as it is hoped that it serves as a stepping-stone
    for creating a CMS of your own that is specific to your needs.


    In this chapter, the application will enable you to manage a hypothetical XML
    data set and its associated assets. The data set that the application manages
    a simple list of article or journal entries. Each item in the list also contains
    an associated image file. The application will enable you to edit, add, and delete
    items from the list. After you editing the content, the application uploads the
    new data set and any images that you selected from your local hard disk to the
    remote storage area.


    The following sequence discusses the design of the application. This includes
    the logistics of managing data and the components that are necessary for the user
    interface. After design, you will get into the code and learn about the important
    classes and functions that will tie everything together.


    # Design


    As always, it''s a good idea to make a list of goals that your application should
    aim to fulfill. The Mini CMS application should enable users to do the following:


    +   - Configure the remote gateway URL.

    - Validate the remote gateway URL.

    - Download the remote XML data set and save it on their hard drive.

    - Display a selectable list of all the items in the data set.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 5: Mini CMS


    +   - Display the fields of a selected item in an editable form.

    - Add, edit, delete items from the list.

    - Edit the fields of a selected item.

    - Browse their hard drive for an asset file (image).

    - Save the changes of individual items.

    - Revert back to the original data.

    - Upload the edited XML data and set any locals to the remote storage area.


    The preceding list will give you a decent idea of what the application is going
    to need in terms of classes and the user interface. The first item on the list,
    concerning the gateway URL, may be a bit vague to you right now, but the following
    section explains each component of the application.


    # The Remote Gateway


    The remote gateway is a vital part of the application. It is a server-side script
    that handles communication between the application and the server. The script
    also stores the URL to the data file and the assets folders. The script can be
    written in a variety of scripting languages, including ASP, JSP, PHP, and Ruby,
    many others. In this chapter, the gateway script is written in PHP because it
    is widely available and often used in conjunction with Flash and Flex projects.
    In more, there are three actions that the gateway must handle:


    +   - URL validation

    - Data file upload

    - Asset file upload


    When users configure their application, especially when configuring the location
    of a remote item, it''s a good idea to ensure that they have entered the correct
    URL. Enabling users to validate what they have entered gives the application chance
    to grab the path to the data and assets folders. Without these variables, the
    application cannot function. After the user has validated the gateway URL, the
    application should be ready to download the data, enabling the user to edit to
    their heart''s content. Keep in mind that this script file will not be packaged
    with the application. It is your responsibility to upload the script, with the
    initial assets and data file, to a remote server in order for the application
    to function.


    # Settings Management


    After the user has validated the gateway URL and the remote settings, it''s a
    good idea to store that information for later use. Not only should the settings
    be available throughout other parts of the application, but they also be saved
    on the user''s computer so that users don''t have to reconfigure the application
    next time they launch it.


    To make the settings available throughout the application, you will create a data
    model using the almighty Singleton class pattern. The singleton pattern ensures
    that only one instance of a Settings object can be created within the entire application,
    ensuring that all components and objects in the application will be reading from
    the one and only source of settings information.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Chapter 5: Mini CMS


    To save the settings information so it will be available the next time the user
    uses the application, you will create a service class that loads and saves a simple
    XML file in the application''s storage directory. This class will be named SettingsService.


    # Data Management


    In addition to managing the settings data, you''ll also have to manage the main
    data set. The main data set is an XML file, once the settings have been validated,
    must be downloaded from the remote location and then saved into the application''s
    storage directory. To make this process familiar, you will create a service class
    XMLApiService. A Complete event will be dispatched when the XML has been completely
    loaded, as an Error event if there is a problem loading the data.


    When the data is available to the application, it needs to be parsed into objects
    that will for the display components. The edited data also needs to be serialized
    back into XML so it can be saved to a local file before uploading. Two classes
    will be created to handle this requirement. The first class is another service
    class, named ListDataService, which will handle the conversion of the data. The
    second class, named ItemData, is a generic object that will describe each item
    in the data set.


    # Uploading Files


    After the user has making changes to the data, the application needs to upload
    the data set and any local assets the user has chosen for any edited items. This
    will be yet another service class UploadService. This class enables you to add
    local files to a queue to upload. Events are dispatched when the upload process
    ends or encounters an error.


    # User Interface


    The user interface is relatively simple for this application. First you will create
    a component that enables the user to edit and validate the gateway URL. This component
    will be named SettingsPanel and behave as a pop-up. The SettingsPanel component,
    you will create a component that enables users to edit the data of an item from
    the data set. This component will contain fields that correspond to each property
    of an item from the data set. This component is named ItemEditor. Lastly, you
    will use a List component to present each item from the data set. Aside from a
    few buttons here and, there are the major interface components for the application.


    # Code and Code Explanation


    This section dives into the code defining the functionality of each class and
    component of the application. Throughout the remaining sessions, you will create
    each class and component required by the application. At the end, you will bring
    it all together by creating the main application file. However, within your development
    directory create a folder named Mini CMS. This will be your working directory
    for this application.


    # The Remote Gateway


    The remote gateway script is the cornerstone of this application. Fortunately,
    the script is extremely simple, and even if you don''t understand PHP, you can
    get the gist of what is happening after a first glance.


    125'
