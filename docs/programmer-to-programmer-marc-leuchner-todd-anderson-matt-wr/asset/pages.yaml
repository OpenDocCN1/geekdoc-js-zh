  md: "# Chapter 4: Music Player\n\nThe settings file is brief and to the point. The\
    \ <defaultDirectory> node will be the location of the user’s music directory.\
    \ It will be assigned once the user has selected a directory. The <refreshStartup>\
    \ node will be used to inform the application whether it should query the defaultMusicDirectory\
    \ for MP3s, or just use the data provided in the musicdatabase.xml file. The <musicDataBaseLocation>\
    \ node specifies location and name of the music database. This XML is described\
    \ in the next section.\n\n# musicdatabase.xml\n\nThe music database is not created\
    \ by hand, meaning you don’t have to create a new XML document called musicdatabase.xml\
    \ within a text editor. When the music player first writes the file XML to disk,\
    \ this XML file will be created. However, it’s helpful to see the data you are\
    \ reading and writing:\n\n```\n<database>\n  <fileItem>\n    <name></name>\n \
    \   <url></url>\n    <songName></songName>\n    <artist></artist>\n    <album></album>\n\
    \  </fileItem>\n</database>\n```\n\nThe music database is not more than a tree\
    \ of <fileItem> nodes. <fileItem> contains the saved properties for each track.\
    \ The XMLParserUtil parses each node into a TrackVO object, which represents a\
    \ single track in the playlist. The TrackVO object and supporting classes are\
    \ discussed in the following sections.\n\n# Data Objects\n\nThe application parses\
    \ the data being read and managed as two separate types of objects: SettingsVO\
    \ and TrackVO. Both objects are referenced and controlled by the ApplicationDataModel.\
    \ The application’s data model will be discussed momentarily. For first, take\
    \ a closer look at the data objects.\n\n# SettingsVO\n\nThe SettingsVO object\
    \ is a basic value object containing getters and setters for four properties that\
    \ you will access through the music player:\n\n+   - settingLocation (String):\
    \ The location of the settings file (most likely xml/settings.xml)\n- musicDatabaseLocation\
    \ (String): The name of the file to you want to save the database. This is relative\
    \ to the default AIR resource directory.\n- defaultMusicDirectory (String): The\
    \ location of the default music directory as specified by the user in the Settings\
    \ panel.\n- refreshOnStartup (Boolean): A true/false variable specified by the\
    \ user under the Settings panel that toggles the music player’s capability to\
    \ search for MP3s on application startup.\n\nCreate the SettingsVO by opening\
    \ a document and inserting the following code:"
