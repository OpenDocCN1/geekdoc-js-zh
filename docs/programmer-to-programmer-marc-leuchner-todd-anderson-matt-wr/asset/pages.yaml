  md: "# Chapter 2: Simple Text Editor\n\nThis is where the fun begins! Looking at\
    \ what you have just added, note that five new functions were included in the\
    \ application. These functions are the meat and potatoes of the application because\
    \ they perform all the hard stuff (and, it's not all that). Examine the first\
    \ function, openFile():\n\n```\nprivate function openFile():void {\n  if (fileStream\
    \ != null ) {\n    fileStream.close();\n  }\n\n  fileStream = new FileStream();\n\
    \  fileStream.addEventListener( Event.COMPLETE, onComplete);\n  fileStream.addEventListener(IOError.IO_ERROR,\
    \ onIOError);\n  fileStream.openAsync(currentFile,File.READ);\n}\n```\n\nThe openFile()\
    \ function will be opened. Before going anywhere, the first conditional statement\
    \ checks whether the fileStream object is defined. If it is defined, then the\
    \ close() method of the fileStream object is called to close the connection with\
    \ this file. This is merely a safeguard.\n\nOnce you pass this, the fileStream\
    \ object is recreated. The new instance is configured with two listeners. The\
    \ first event listener listens for a COMPLETE event of type Event. This event\
    \ is dispatched when all the data from the file has been read into the input buffer.\
    \ When this event is dispatched, the onComplete() function is called. It is examined\
    \ very shortly. The second event listener listens for an IO_ERROR event of type\
    \ IOError. An IOError is dispatched by the fileStream object whenever an error\
    \ causes a read or write operation to fail. And when this event is dispatched,\
    \ the onError() function simply alerts the user that something has gone wrong\
    \ while reading the file.\n\nAfter the listeners are all set up, the openAsync()\
    \ method of the fileStream object can be called. The openAsync() method requires\
    \ two parameters: a File object and a string that specifies the mode in which\
    \ you want the fileStream to behave — in this case, passing the currentFile variable\
    \ and using the public static READ from the File class to specify the mode. The\
    \ openAsync method opens the specified file asynchronously, which means that the\
    \ file's data is immediately read into the input buffer and the following code\
    \ will execute.\n\nThe openFile() function is now complete, it is time to get\
    \ to what you are want to write. Take a look at the onComplete() function that\
    \ is called when all of the file's data has been received by the input buffer:\n\
    \n```\nprivate function onComplete(event:Event):void {\n  var theText:String =\
    \ fileStream.readUTFBytes(fileStream.bytesAvailable);\n  var linePattern:RegExp\
    \ = new RegExp(File.lineEnding, \"\\n\");\n\n  fileTextArea.text = theText.replace(linePattern,\
    \ \"\\n\");\n}\n```"
