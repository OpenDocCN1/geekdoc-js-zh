    Artist\" width=\"150\" />\n<mx:DataGridColumn dataField=\"album\" headerText=\"\
    Album\" width=\"150\" />\n</mx:columns>\n</mx:DataGrid>\n```\n\nSave the file\
    \ as PlaylistView.toml in your working directory near the com/airmcr/musicplayer/ui\
    \ directory.\n\n# DataProvider\n\nThe trackCollection property of the ApplicationModel\
    \ is the PlaylistView's dataProvider. If you recall, the trackCollection is populated\
    \ by TrackVO objects representing the song data. The DataGrid is populated by\
    \ assigning each DataGridColumn dataField with a property in the TrackVO object.\
    \ For example, dataField=\"artist\" would display the TrackVO.artist property.\
    \ Each DataGrid then represents the supplied TrackVO. By calling the DataGrid.selectedItem,\
    \ you are referencing a TrackVO for the song.\n\n# Changing Tracks\n\nThe SoundManager\
    \ manages the PlaylistView for the selected track. This even when the user presses\
    \ the Play button and track is not selected. For instance, when the user clicks\
    \ the Play button, an event is sent to the controller to the SoundManager. If\
    \ the SoundManager's selectedTrack property is null, then the NO_SELECTED_TRACK\
    \ event is dispatched, in which turn calls the PlaylistView's playTrack(). At\
    \ this point, the playTrack() method sets the PlaylistView's selectedTrack by\
    \ the selectedItem in the supplied list. The PlaylistView dispatches a PLAY_SELECTED\
    \ event, telling the SoundManager that a song has been selected and needs to be\
    \ played.\n\nThis may seem a bit convoluted, but the controls are loosely coupled.\
    \ In other words, you could replace the SoundManager with any class that you wish\
    \ to control through the PlaylistView and you would only have to change the listeners\
    \ on the application controller level.\n\nIn later on, you will implement this\
    \ in the MusicPlayer.xml file. Figure 4-3 shows the PlaylistView component as\
    \ a playlist in the airAMP music player.\n\n# BottomControls\n\nThe last component\
    \ set for the airAMP music player is the BottomControls component. This component\
    \ extends the BottomBar component and is to be used with a Panel component. It\
    \ consists of three components: the settings window, the volume control HSlider,\
    \ and a Spacer to separate the two. You can view this component at the bottom\
    \ of Figure 4-3."
