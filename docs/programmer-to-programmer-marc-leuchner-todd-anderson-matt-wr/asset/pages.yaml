    The onCreate function is pretty. Immediately, the readUTFBytes() method of the
    fileStream object is called. This method will read the file''s array of bytes
    and return a string of characters that adhere to UTF-8 (8-bit Unicode/Transformation
    Format). The method requires one parameter specifying how many bytes should be
    read; because you know the entire file has been buffered, you can use the bytesAvailable
    property of the fileStream object. Now the temporary variable namedText is full
    of all sorts of characters.


    Now it''s time to convert the line-ending characters of the file into characters
    that will display new lines properly in the TextArea area. As you may know, line
    endings vary depending on operating system your application is running. Regular
    expressions are the best way to go about fixing this problem. When creating the
    new RegExp object, supply the first argument of the constructor with the public
    static lineEnding of the Class. This property will tell you the lineEnding sequence
    of the operating system your application is running on. A lifesaver! Now that
    you have the path, you can call the replace method and subsequently dump that
    into the text property of the TextArea component.


    Now that you have the text from the file displayed to the user, all that is left
    is some housekeeping. FirstChanged is false. The title property of the application
    is updated with the name of the file that user opened. Third, the fileStream object
    is closed. The application is now set up to open text files, so you can move on
    to the other essential piece of functionality the application needs: the saveFile()
    function is as follows:


