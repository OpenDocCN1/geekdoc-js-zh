  md: '# Chapter 8: Weather Widget


    The user can now move the widget around the desktop without having the system.
    However, they still cannot exit or minimize the widget. If this were left like
    it is, users would ultimately shut their computer down in frustration (although
    there are other ways to close an application). Either way, there should be a menu
    system that enables users to close the widget. The next section discusses adding
    menu to the weather widget.


    # Adding Menus and More Window Interaction


    This widget will be pretty useless without some way for users to minimize, restore,
    or even exit the application. You could add buttons to the widget to access the
    aforementioned functionality, adding a honking button to the facade of the widget
    will just clutter the edge of a minimal display. Early versions of the widget
    had a sliding tray containing the buttons, though it was decided that even a tray
    felt bulky. The solution to the problem was to create a `NativeMenu` instance
    and apply it to the `contextMenu` property of the widget and to the system tray
    icon (dock icon on OS X). Figures 8-6, 8-7, and 8-8 show the `NativeMenu` applied
    to the widget.


    ![](img/ae8d13390b8907e42ae2ab60bd54e1f8_301_0.png)


    Figure 8-6


    ![](img/ae8d13390b8907e42ae2ab60bd54e1f8_301_1.png)


    Figure 8-7


    Looking through Figures 8-6, 8-7, and 8-8, all menus are nearly identical. This
    is because there is only one instance of the `NativeMenu` class created and applied
    to the widget. Once the application has been created, `onCreationComplete` is
    accessed. The `onCreationComplete` in turn activates the `buildNativeMenus` method.
    This method is also called whenever new weather data has been loaded, or the widget''s
    current state has changed.


