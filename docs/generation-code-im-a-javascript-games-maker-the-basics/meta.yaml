- md: " ## STEP 4 – VIEW YOUR WORK\n\n⇒ Open your **Documents** folder and double-click\
    \ the **quiz.html** file. Your program should run in your web browser.\n\n⇒ Test\
    \ your page by answering correctly, then reloading your page and giving the wrong\
    \ answer.\n\n## STEP 5 – RANDOMISE!\n\n⇒ Change your code, in the following way,\
    \ so random numbers are picked for the question:\n\nMake a variable called a.\n\
    \nCreate a random number between 0 and 1.\n\n```\nvar a=Math.round(Math.random()*10);\n\
    ```\n\nRound to the nearest whole number. Multiply it by 10.\n\n```\n1  <script>\n\
    2    var a=Math.round(Math.random()*10);\n3    var b=Math.round(Math.random()*10);\n\
    4    answer=prompt(\"what is \"+a+\" x \"+b+\"?\");\n5    if(answer==a*b){\n6\
    \        alert(\"Correct!\")\n7    }\n8  </script>\n```\n\nUse the + sign to join\
    \ the string 'what is' to the value stored in the variable a.\n\nCheck to see\
    \ if the answer entered is the same as a multiplied by (*) b.\n\n## STEP 6 – SAVE\
    \ AND REFRESH\n\n⇒ Save your new code.\n\n⇒ Reload your browser to see the changes.\
    \ Each time you reload it you should get a new random question.\n\nEnjoy playing\
    \ your quiz!\n\n## CUSTOMISE\n\n- Change your code so it asks harder questions,\
    \ using bigger numbers.\n\n## KEY CONCEPT\n\n## VARIABLES\n\nVariables are part\
    \ of a program that stores information. Variables are given a name that is used\
    \ to point to a part of the computer's memory. A value is then stored in that\
    \ part of the memory. In this quiz, variables are used to store the random numbers\
    \ and the user's input.\n\n## IF STATEMENTS\n\nNormally, each line of code works\
    \ one after the other. An IF statement works differently. It checks if a particular\
    \ condition is true before running a certain piece of code.\n\n## RANDOM COLOURS\n\
    \nIn this activity we will make a simple program that randomly sets the colour\
    \ of the screen.\n\n## STEP 1 – PLANNING\n\n- Make a list of four colours to choose\
    \ from.\n- Start a timer that changes the colour every 1000 milliseconds (which\
    \ is every one second).\n- To change the colour:\n  - pick a random number from\
    \ 0 to 3\n  - use the random number to pick one of the colours\n  - set the background\
    \ colour to the chosen colour.\n- Make a special section of code called a function\
    \ that will follow the steps above to change the colour. By giving the function\
    \ a name – **changeColour()** – you will create a new command that will carry\
    \ out the steps whenever **changeColour()** is typed.\n\n## BRACKETS!\n\nSquare\
    \ brackets are used in JavaScript to show the start and end of a list. Coders\
    \ call this sort of list an array. If the array contains string (words or symbols),\
    \ each one needs double quote marks around it. Curly brackets are used to show\
    \ the start and end of a function.\n\n## STEP 2 – START A NEW HTML FILE\n\n- Start\
    \ your text editor, or click **File** > **New**.\n\n## STEP 3 – ENTER THIS CODE\n\
    \nType this code in very carefully, using exactly the same spelling, symbols and\
    \ upper case letters. Remember to use the US spelling of colour (color) within\
    \ a JavaScript style command, but the UK spelling of colour for the name of functions\
    \ (such as, **changeColour**) or variables.\n\n```\n<script>\ncolors=[\"red\"\
    ,\"green\",\"blue\",\"yellow\"];\nvar timer=window.setInterval(changeColour, 1000);\n\
    function changeColour(){\n  var n=Math.round(Math.random()*4);\n  document.body.style.backgroundColor=colors[n];\n\
    }\n</script>\n```\n\n| Line | Description |\n|---|---|\n| 1 | Start the script.\
    \ |\n| 2 | Make the list of colours. |\n| 3 | Create a timer that will run the\
    \ changeColour function every second. |\n| 4 | Define the changeColour function.\
    \ |\n| 5 | Create a variable called n and give it a random value from 0 to 3.\
    \ |\n| 6 | Set the background colour. |\n| 7 | End the function. |\n| 8 | End\
    \ the script. |\n\n## STEP 4 - SAVE YOUR CODE\n\n⇒ Click File > Save and type\
    \ **colours.html** as the filename. Make sure you save it in your **Documents**\
    \ folder.\n\n## STEP 5 - VIEW YOUR WORK\n\n⇒ Open your **Documents** folder. Double-click\
    \ the **colours.html** file. Your program should run in your web browser. The\
    \ screen should change colour every second.\n\n## STEP 6 - ARRANGE YOUR SCREEN\n\
    \nAs you start to develop more complex programs, you will need to see your code\
    \ and the browser at the same time. Many programmers set up their screen so their\
    \ code is on the left-hand side and their web page is shown on the right.\n\n\
    ⇒ Resize your text editor and browser windows so your screen looks like this:\n\
    \n\U0001F504 To see the effects of your changes, you need to reload the file,\
    \ by clicking the **Reload this page** icon.\n\nAfter you have made a change to\
    \ your code in the text editor, save your file.\n\n## CUSTOMISE\n\n- Add more\
    \ colours to the list. Make sure you put double quotation marks around each colour\
    \ word and separate them with a comma.\n- To pick an item from your new list,\
    \ you will need to change the random number chosen. Edit the number at the end\
    \ of line 5 to match the length of the list.\n- Change how often a new colour\
    \ is chosen by editing the end of line 3 (choosing a very low value will result\
    \ in flashing colours).\n\n> **KEY CONCEPT**\n\n**ARRAY**\nAn array is a list\
    \ of items stored as some data. Lists are similar to variables but they can store\
    \ multiple items of information. In our program, line 2 contains a list of colours.\n\
    \n**FUNCTION**\nA function is a section of code combining a number of commands.\
    \ The name of the function becomes a new command that runs the whole section.\
    \ Lines 4 to 7 contain the function definition.\n\n## ON THE MOVE\n\nTo start\
    \ coding our own games we need to use some new techniques. Firstly we need to\
    \ add images to the screen. We also need to be able to position the images in\
    \ particular places and then make the images move. To make all this work we will\
    \ use some HTML code, as well as the JavaScript.\n\n## STEP 1 – FIND A PICTURE\n\
    \nFirst of all, you need to find an image to use. It needs to be placed in the\
    \ same folder as your HTML file.\n\n- Go online and search for some clipart to\
    \ use (see page 31).\n\n- Right-click on your chosen image. We will use a ghost\
    \ image.\n- Click **Save Image As...**\n- Navigate to your **Documents** folder\
    \ then click **Save**.\n\n## STEP 2 – CHECK!\n\n- Open your **Documents** folder\
    \ and check the picture file is there. Depending on your browser and the image\
    \ it may be called **ghost.png** or **download.png**. If it is not there, go back\
    \ to step 1 and try again, making sure you select the **Documents** folder.\n\n\
    - Find your image and remember its exact filename.\n\n## STEP 3 – START A NEW\
    \ FILE\n\n- Carefully type this code into your text editor. We are going to use\
    \ some HTML code to set the background colour using the **\\<body\\>** tag. We\
    \ will add an image, using the **\\<img\\>** tag.\n\n```\n1  <html>\n2    <body\
    \ style=\"background-color:darkblue\">\n3      <img id=\"ghost\" style=\"position:absolute;\"\
    \ src=\"ghost.png\">\n4    </body>\n5  </html>\n```\n\nStart the HTML.\nSet the\
    \ background colour using the body tag.\nUse the filename for the image from step\
    \ 3.\nEnd the body tag.\nEnd the HTML.\n\n## THE HTML IMAGE TAG:\n\nThe id is\
    \ a name we give to the image.\n\nposition:absolute allows the image to be located\
    \ using co-ordinates.\n\n```\n<img id=\"ghost\" style=\"position:absolute;\" src=\"\
    ghost.png\">\n```\n\nWe add an image to the page.\n\nThe style attribute is used\
    \ to set things like the size and colour of an HTML element. Remember to add the\
    \ quotes.\n\nType the filename of the image into the src attribute.\n\n## STEP\
    \ 4 - SAVE YOUR FILE\n\n⇒ Click **File > Save** and type **ghost.html** as the\
    \ filename.\nMake sure you save it in your **Documents** folder.\n\n## STEP 5\
    \ - VIEW YOUR PAGE\n\n⇒ Open your **Documents** folder.\nDouble-click the file\
    \ and you should see it appear in your web page.\n\n## STEP 6 - MAKE IT MOVE!\n\
    \n⇒ We can use the timer technique from the colour TRANSFORM This problem involves\
    \ converting the color-changing program's timer method to move an image instead\
    \ of changing screen color. The ghost's position will update every second using\
    \ random coordinates.\n\n⇒ Add to your original code by inserting a `<script>`\
    \ section at line 5.\n\n```\nSublime Text\n\n1  <html>\n2    <body style=\"background-color:darkblue\"\
    >\n3      <img id=\"ghost\" style=\"position:absolute;\" src=\"ghost.png\">\n\
    4    </body>\n5    <script>\n6      var timer=window.setInterval(moveGhost, 1000);\n\
    7      function moveGhost(){\n8        document.getElementById(\"ghost\").style.left=Math.random()*900+\"\
    px\";\n9        document.getElementById(\"ghost').style.top=Math.random()*600+\"\
    px\";\n10     }\n11   </script>\n12 </html>\n```\n\n- Start the JavaScript section.\n\
    - Create a timer that runs the moveGhost function every 1000 milliseconds.\n-\
    \ Define the moveGhost function.\n- Move the ghost to a new random position by\
    \ setting its left and top style properties.\n- End the moveGhost function.\n\
    - End JavaScript.\n\n## KEY CONCEPT\n\n## CO-ORDINATES\n\nMove elements, such\
    \ as images, by setting their **left** and **top** style properties, or co-ordinates.\
    \ Add **px** on the end of the value to measure in pixels. The co-ordinates (0,0)\
    \ will always be in the top left of the browser. The maximum co-ordinates will\
    \ depend on the size of the browser window.\n\n## TAGS\n\nIn HTML, all elements\
    \ have an opening tag. Tags always start with < and end with >.\n\n## ATTRIBUTES\n\
    \nAttributes provide extra information about an HTML element, such as its size\
    \ and colour."
  mdcn: "\n## 步骤 4 – 查看你的作品\n\n⇒ 打开你的**文档**文件夹，然后双击**quiz.html**文件。你的程序应该会在网页浏览器中运行。\n\
    \n⇒ 通过正确回答问题来测试你的页面，然后重新加载页面并给出错误答案。\n\n## 步骤 5 – 随机化！\n\n⇒ 按以下方式修改你的代码，以便为题目随机选取数字：\n\
    \n创建一个名为 a 的变量。\n\n生成一个 0 到 1 之间的随机数。\n\n```\nvar a=Math.round(Math.random()*10);\n\
    ```\n\n四舍五入到最接近的整数。将其乘以 10。\n\n```\n1  <script>\n2    var a=Math.round(Math.random()*10);\n\
    3    var b=Math.round(Math.random()*10);\n4    answer=prompt(\"what is \"+a+\"\
    \ x \"+b+\"?\");\n5    if(answer==a*b){\n6        alert(\"Correct!\")\n7    }\n\
    8  </script>\n```\n\n使用 + 号将字符串 'what is' 与存储在变量 a 中的值连接起来。\n\n检查输入的答案是否等于 a 乘以\
    \ (*) b。\n\n## 步骤 6 – 保存并刷新\n\n⇒ 保存你的新代码。\n\n⇒ 重新加载你的浏览器以查看更改。每次重新加载时，你都应该会看到一个新随机题目。\n\
    \n尽情享受你的测验吧！\n\n## 自定义\n\n- 修改你的代码，使其提出更难的问题，使用更大的数字。\n\n## 核心概念\n\n## 变量\n\n\
    变量是程序中存储信息的部分。变量被赋予一个名称，用于指向计算机内存的某一部分。然后在该内存部分中存储一个值。在这个测验中，变量用于存储随机数和用户的输入。\n\
    \n## IF 语句\n\n通常，每一行代码都是一行接一行地执行。IF 语句则不同。它在运行某段代码之前，会先检查特定条件是否为真。\n\n## 随机颜色\n\
    \n在这个活动中，我们将制作一个简单的程序，随机设置屏幕的颜色。\n\n## 步骤 1 – 规划\n\n- 列出四种可供选择的颜色。\n- 启动一个计时器，每\
    \ 1000 毫秒（即每一秒）改变一次颜色。\n- 要改变颜色：\n  - 从 0 到 3 中随机选取一个数字\n  - 使用随机数字选取其中一种颜色\n\
    \  - 将背景颜色设置为所选颜色。\n- 创建一个称为函数的特殊代码段，它将按照上述步骤来改变颜色。通过给函数起名为**changeColour()**，你就创建了一个新命令，每当输入**changeColour()**时就会执行这些步骤。\n\
    \n## 括号！\n\n方括号在 JavaScript 中用于表示列表的开始和结束。程序员将这种列表称为数组。如果数组包含字符串（单词或符号），则每个都需要用双引号括起来。花括号用于表示函数的开始和结束。\n\
    \n## 步骤 2 – 开始一个新的 HTML 文件\n\n- 启动你的文本编辑器，或者点击**文件** > **新建**。\n\n## 步骤 3 – 输入此代码\n\
    \n非常仔细地输入这段代码，使用完全相同的拼写、符号和大写字母。记住在 JavaScript 样式命令中使用美式拼写 color，但在函数名称（如**changeColour**）或变量名称中使用英式拼写\
    \ colour。\n\n```\n<script>\ncolors=[\"red\",\"green\",\"blue\",\"yellow\"];\n\
    var timer=window.setInterval(changeColour, 1000);\nfunction changeColour(){\n\
    \  var n=Math.round(Math.random()*4);\n  document.body.style.backgroundColor=colors[n];\n\
    }\n</script>\n```\n\n| 行 | 说明 |\n|---|---|\n| 1 | 开始脚本。 |\n| 2 | 创建颜色列表。 |\n|\
    \ 3 | 创建一个计时器，每秒运行一次 changeColour 函数。 |\n| 4 | 定义 changeColour 函数。 |\n| 5 | 创建一个名为\
