  md: '# GLOSSARY


    ![](img/6c566f2daf5f64a5f69519309716a385_33_0.png)


    **ANIMATION** Making objects in your program move around.


    **ARRAY** A list of items stored as some data.


    **BROWSER** A program used to view web pages, such as Chrome or Internet Explorer.


    **BUG** An error in a program that stops it working properly.


    **DEBUG** To remove bugs (or errors) from a program.


    **ELEMENT** One of the objects making up a web page, such as a paragraph or image.


    **EVENT** Something that happens while the program is running, such as a mouse
    click or key press.


    **FUNCTION** A reusable section of code combining a number of commands.


    **HEXADECIMAL** A system of numbers using digits from 0 to 9, then A to F.


    **HTML (HYPERTEXT MARKUP LANGUAGE)** The language used to build web pages.


    **JAVASCRIPT** A programming language used to make web pages interactive or to
    build simple games.


    **PIXEL** A small dot on the screen. It can be used as a unit of measurement.


    **RANDOM NUMBER** A number picked by the computer that can''t be predicted.


    **REFRESH** To load a web page again in the browser, so changes to the page can
    be seen.


    **RGB** The system used to mix red, green and blue light to make any colour.


    **SELECTION** Using commands such as IF to run different parts of a program.


    **STRING** A type of data made of an ordered list of characters, such as ''Hello
    world!''.


    **SYNTAX** Using commands, brackets and other symbols correctly and in the right
    order.


    **TAGS** Special words in an HTML document surrounded by angle brackets <> defining
    an element.


    **TEXT EDITOR** A program used to create and change code.


    **TIMER** An object that runs a function after a specified delay, or at a regular
    interval.


    **VARIABLE** A value used to store information in a program that can change.


    > **BUGS & DEBUGGING**


    When you find your code isn''t working as expected, stop and look though each
    line of code you have put in. Think about what you want it to do, and what it
    is really telling the computer to do. If you are entering one of the programs
    in this book, check you have not missed a line. Here are some things debugging
    tips:


    - 🐛 Check you have spelt the commands correctly.

    - 🐛 Check you have used the correct case (capitals or lower case).

    - 🐛 Check you haven''t missed any quotes.

    - 🐛 Check you have closed tags correctly.

    - 🐛 If images aren''t showing, check filenames have been typed accurately.

    - 🐛 If images aren''t moving, check you have set **position:absolute**.

    - 🐛 Make sure you have used the correct style of brackets and other symbols.


    ![](img/6c566f2daf5f64a5f69519309716a385_33_1.png)


    <30>'
