    # # 16 MILLION COLOURS


    There are over 100 words that can be used to set colours. There is another more
    precise way to set colours, using a method that mixes together red, green and
    blue light. A number is given between 0 and 255 for the amount of red, green and
    blue in the colour, giving over 16 million combinations. This is called the RGB
    colour system.


    The code to show bright red is 255,0,0. The red value is 255, green is 0 and blue
    is 0. The RGB value is then converted into a special code, called **hexadecimal**,
    which uses the letters A to F instead of 10 to 15. The hexadecimal code for red
    is written #FF0000.


    | Colour | Red | Green | Blue | Hex code |

    | :--- | :--- | :--- | :--- | :--- |

    | Red | 255 | 0 | 0 | FF0000 |

