  - "[PAGE 30]\n\n**POSITIONING THE DOG AND BONE**\n\nThe dog's co-ordinates are stored\
    \ in **dogX** and **dogY**, and the bone's co-ordinates are in **boneX** and **boneY**.\n\
    \nTo make sure the dog has a chance to catch the bone, we will make each of them\
    \ move on an invisible grid. Each square in the grid will be 50 pixels wide and\
    \ 50 pixels high. To set the left position of the dog we therefore multiply **boneX**\
    \ by 50, and to set the top value we multiply **boneY** by 50.\n\nif **dogX**\
    \ is 2, and **dogY** is 3, then this is what would happen:\n\nThe dog is 2 * 50\
    \ = 100 pixels in from the left.\n\n![](img/6c566f2daf5f64a5f69519309716a385_30_0.png)\n\
    \nThe dog is 3 * 50 = 150 pixels down from the top.\n\n# STEP 6 – PRESS ANY KEY\n\
    \nWhen a key is pressed by the player, we need to move the dog left or right.\
    \ The direction moved depends on which key is pressed. We need to add a special\
    \ sort of variable called a parameter to our function, which will store information\
    \ about the key that has been pressed. Type (e) after the function name to add\
    \ the parameter. Each key on the keyboard has a specific code linked to it. The\
    \ left arrow has a code of 37, the right arrow's code is 39.The code for the key\
    \ pressed will be stored in **e.keyCode**.\n\n```\n15\tfunction handleKeys(e){\n\
    16\t\tif(e.keyCode==37){dogX--;}\n17\t\tif(e.keyCode==39){dogX++;}\n18\t\tsetLeft(\"\
    dog\", dogX*50);\n19\t\tsetTop(\"dog\", dogY*50);\n20\t}\n```\n\nDefine a function\
    \ called handleKeys. Information about the key press event will be put into the\
    \ variable called e.\n\nMake dogX go down by 1 (dogX-- means subtract 1 from the\
    \ value in dogX), if the code for the left arrow key has been sent.\n\nMake dogX\
    \ go up by 1 (dogX++ means add 1 to dogX), if the code for the right arrow key\
    \ has been passed to the function.\n\nSet the new position for the dog.\n\n# STEP\
    \ 7 – MOVE THE BONE\n\nThe bone gets moved by the timer every 200 milliseconds.\
    \ Although this means it only moves 5 times a second, it will look quite smooth\
    \ because we have used the **webkit-transition** property. The timer runs this\
    \ function.\n\n```\n21\tfunction moveBone(){\n22\t\tboneY=boneY+=1;\n23\t\tsetLeft(\"\
    bone\", boneX*50);\n24\t\tsetTop(\"bone\", boneY*50);\n25\t\tif(boneY>dogY+5){missedBone();}\n\
    26\t\tif((dogX==boneX) && (dogY==boneY)){caughtBone();}\n27\t}\n```\n\nDefine\
    \ the function.\n\nMake the boneY variable go up by one (you could type this code\
