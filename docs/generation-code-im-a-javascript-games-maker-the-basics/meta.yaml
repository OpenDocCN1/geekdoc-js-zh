    position:absolute; width:50px; top:500px;\nleft:300px; -webkit-transition: all\
    \ 0.2s;\" src=\"dog.png\">\n\n  <img id=\"bone\" style=\"position:absolute; width:50px;\
    \ top:0px;\nleft:0px; -webkit-transition: all 0.2s;\" src=\"bone.png\">\n\n  \
    \ <p id=\"scoreTB\" style=\"position:absolute; left:50px;\ncolor:yellow; font-size:28px;\
    \ font-family:Arial;\">Score: 0</p>\n\n    <p id=\"livesTB\" style=\"position:absolute;\
    \ right:50px;\ncolor:yellow; font-size:28px; font-family:Arial;\">Lives: 3</p>\n\
    \n</body>\n```\n\nSet the background colour.\n\nAdd the image of the dog and of\
    \ the bone. In each case, the src property must match the file you downloaded.\n\
    \nAdd a paragraph showing the score.\n\nShow the lives remaining. Note this is\
    \ set 50 pixels from the right edge.\n\n# STEP 4 – SAVE AND PREVIEW\n\n+   - Click\
    \ File and Save. Type catch.html as the filename.\n- Open your Documents folder.\
    \ Find the catch.html file and double-click it. The file should now load in your\
    \ browser. The images won't move yet (as there is no code telling them to), but\
    \ the page should look something like this:\n\n![](img/6c566f2daf5f64a5f69519309716a385_28_0.png)\n\
    \n# KEY CONCEPT\n\n# COLOUR GRADIENTS\n\nIn the games we have created so far,\
    \ we have set the background to be a solid colour. However, we can create some\
    \ great effects by using something called colour gradients. This means using two\
    \ colours and blending them together gradually. Experiment with the following\
    \ code from line 2:\n\nChange these\n\n```\n<body style=\"background: -webkit-linear-gradient(blue,\
    \ green);\">\n```\n\n```\n<body style=\"background: -webkit-linear-gradient(red,\
    \ yellow);\">\n```"
