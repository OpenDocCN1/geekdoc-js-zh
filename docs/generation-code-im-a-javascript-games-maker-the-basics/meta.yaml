  md: '# INTRODUCTION


    Learn how to code your own fun games using JavaScript. JavaScript is a language
    originally used to make web pages more interactive. It is now used to create online
    games that will run on both computers and mobile devices. Enjoy creating the simple
    projects in this book and you will be on your way to becoming a JavaScript expert!


    +   ⇒ If you are making your own web page, spend time drawing a diagram and planning
    it before you start. Try changing values if things don''t work, and don''t be
    afraid to start again – you will learn from it.

    ⇒ Practise debugging! Make a very simple web page and get a friend to change one
    line of code while you''re not looking. Can you fix it?

    ⇒ When things are working properly, stop and look through your code so you understand
    each line. Experiment and change your code, and try out different values. To be
    good at debugging, you need to understand what each line of your code does and
    how it works.


    You could use a plain text editor to create your code.


    ```

    mygame.html

    <script>

    alert(''Press any key to start'')

    </script>

    ```


    This will work fine but can be quite fiddly, as the software won''t give you any
    help.


    The best thing to use for the activities in this book is an offline HTML editor.
    This will support you as you type your code, but also give you the opportunity
    to learn the JavaScript code.

    There are two separate windows that you''ll be using:


    ```

    Sublime Text

    <script>

    var score=0;

    var seconds=0;

    function moveIt(){

    score++;

    ```


    The text editor to enter your JavaScript code.


    ![](img/6c566f2daf5f64a5f69519309716a385_6_0.png)


    The browser to view the program.


    There are many different browsers you can use. We recommend using Google Chrome
    for the activities in this book. Make sure you have the latest version installed
    on your computer before you start.

    You will also learn some HTML, as well as JavaScript, in this book. HTML is the
    language used to build web pages. JavaScript is the language that brings those
    pages to life!


    ![](img/6c566f2daf5f64a5f69519309716a385_6_1.png)'
  merge: -1
  pgno: 6
