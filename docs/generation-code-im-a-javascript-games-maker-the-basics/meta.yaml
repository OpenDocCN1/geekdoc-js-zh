  md: '# STEP 8 – MISSED IT


    If the dog hasn''t caught the bone then the player loses a life. We test for this
    in line 25, by comparing the y co-ordinates of both images. If the bone is more
    than 5 grid squares lower down than the dog, then it has missed it. When that
    happens this code needs to run:


    ```

    28 function missedBone(){

    29     boneY=0;

    30     boneX=randomNumber(2,16);

    31     lives--;

    32     document.getElementById("livesTB").innerText="Lives: "+lives;

    33     if(lives==0){gameOver();}

    34 }

    ```


    +   - Define the function.

    - Move the bone to the top.

    - Position it a random amount in from the left of the screen.

    - Lose a life.

    - Display how many lives are left.

    - Run the gameOver function, if there are no lives left.


    # STEP 9 – CAUGHT IT


    The code in line 26 checks to see if the bone and dog co-ordinates are equal.
    If they match, the following function runs:


    ```

    35 function caughtBone(){

    36     boneY=0;

    37     boneX=randomNumber(2,16);

    38     score++;

    39     document.getElementById("scoreTB").innerText="Score: "+score;

    40 }

    ```


    +   - Define the function.

    - Move the bone to the top.

    - Position the bone a random amount in from the left of the screen.

    - Increase the score by 1.

    - Show the score.


    # STEP 10 – THE END


    If the dog doesn''t catch the bone and there are no lives left, the game is over.
    Type in this function:


    ```

    41 function gameOver(){

    42     alert("Game Over! You scored: "+ score);

    43     location.reload();

    44 }

    ```


    +   - Define the function.

    - Show a message telling the player the game is over and showing their score.

    - Reload the page and make the game start again.


    # STEP 11 – CLOSING TAGS


    Finally, type in a closing script tag and a closing HTML tag to end the file.


    ```

    45 </script>

    46 </html>

    ```


    Save your file, reload the browser and enjoy your game!'
