- md: " GENERATION CODE\n\n## I'M A JAVASCRIPT GAMES MAKER: THE BASICS\n\n{ BUILD\
    \ 7 PROGRAMS }\n\n09 NOV 2017\n- 1 DEC 2017\n18 JAN 2018\n31 MAR 2018\n\nPlease\
    \ return or renew this item by the last date shown. You may return items to any\
    \ East Sussex Library. You may renew books by telephone or the internet.\n\n**0345\
    \ 60 80 195** for renewals\n**0345 60 80 196** for enquiries\n\n**Library and\
    \ Information Services**\n**eastsussex.gov.uk/libraries**\n\n## GENERATION CODE\n\
    \n## I'M A JAVASCRIPT GAMES MAKER: THE BASICS\n\nMax Wainwright\n\nwww.waylandbooks.co.uk\n\
    \n## CONTENTS\n\n- INTRODUCTION ....................... 3\n- GETTING STARTED ....................\
    \ 4\n- MATHS QUIZ ......................... 6\n- RANDOM COLOURS ....................\
    \ 8\n- ON THE MOVE ...................... 10\n- GET CLICKING ......................\
    \ 12\n- OCTOPUS CATCHER ................... 14\n- BALLOON POPPER ....................\
    \ 18\n- BONE CATCHER ...................... 24\n- GLOSSARY ..........................\
    \ 30\n- COMMAND LIST ...................... 31\n- INDEX .............................\
    \ 32\n\n## INTRODUCTION\n\nLearn how to code your own fun games using JavaScript.\
    \ JavaScript is a language originally used to make web pages more interactive.\
    \ It is now used to create online games that will run on both computers and mobile\
    \ devices. Enjoy creating the simple projects in this book and you will be on\
    \ your way to becoming a JavaScript expert!\n\n⇒ If you are making your own web\
    \ page, spend time drawing a diagram and planning it before you start. Try changing\
    \ values if things don't work, and don't be afraid to start again – you will learn\
    \ from it.\n\n⇒ Practise debugging! Make a very simple web page and get a friend\
    \ to change one line of code while you're not looking. Can you fix it?\n\n⇒ When\
    \ things are working properly, stop and look through your code so you understand\
    \ each line. Experiment and change your code, and try out different values. To\
    \ be good at debugging, you need to understand what each line of your code does\
    \ and how it works.\n\nYou could use a plain text editor to create your code.\n\
    \n```\nmygame.html\n<script>\nalert('Press any key to start')\n</script>\n```\n\
    \nThis will work fine but can be quite fiddly, as the software won't give you\
    \ any help.\n\nThe best thing to use for the activities in this book is an offline\
    \ HTML editor. This will support you as you type your code, but also give you\
    \ the opportunity to learn the JavaScript code.\n\nThere are two separate windows\
    \ that you'll be using:\n\n```\nSublime Text\n<script>\nvar score=0;\nvar seconds=0;\n\
    function moveIt(){\nscore++;\n```\n\nThe text editor to enter your JavaScript\
    \ code.\n\nThe browser to view the program.\n\nThere are many different browsers\
    \ you can use. We recommend using Google Chrome for the activities in this book.\
    \ Make sure you have the latest version installed on your computer before you\
    \ start.\n\nYou will also learn some HTML, as well as JavaScript, in this book.\
    \ HTML is the language used to build web pages. JavaScript is the language that\
    \ brings those pages to life!\n\n## GETTING STARTED\n\nYou need a text editor\
    \ to start coding in JavaScript. There will probably be a simple text editor already\
    \ on your computer, called Notepad (if you have Windows) or TextEdit (on a Mac).\
    \ This will be sufficient for you to get started, but it will be much easier to\
    \ create JavaScript if you download a more powerful text editor. In this book,\
    \ we will use a text editor called Sublime Text. There are many others you could\
    \ download, such as Brackets or Notepad++ – all of these are free for you to try\
    \ out.\n\n### STEP 1 – FIND THE SUBLIME TEXT WEBSITE\n\n- Open your web browser\
    \ and visit www.sublimetext.com\n\n### STEP 2 – START DOWNLOADING\n\n- Click the\
    \ **Download** button near the top of the web page.\n- Choose which version of\
    \ Sublime Text you need. If you are not sure, then ask an adult to help you find\
    \ the correct version: click the Apple menu, then **About** if you are using a\
    \ Mac. On a PC click the **Start** menu, select **System**, and click **About**.\n\
    \n| Download |\n| --- |\n| OS X (10.7 or later is required) |\n| Windows |\n|\
    \ Windows 64 bit |\n\n### STEP 3 – INSTALL THE SOFTWARE\n\n- Some web browsers\
    \ will then ask you to run the installation program. Choose **Run**.\n- If this\
    \ does not happen, don't panic. The installer file should have been downloaded\
    \ to your computer. Look in your **Downloads** folder for it. Double-click it\
    \ to start installing your new text editor. You should get a big white or grey\
    \ box giving you instructions on what to do next. Follow these instructions to\
    \ complete the installation.\n\n### STEP 4 – RUNNING SUBLIME TEXT\n\n**On a PC:**\n\
    ⇒ Click **Start > Programs > Sublime Text**. Or just click **Sublime Text** if\
    \ it appears in the **Recently added** section.\n\n**On a Mac:**\n⇒ Click **Finder**.\n\
    ⇒ Click **Applications**.\n⇒ Make a shortcut by dragging **Sublime Text** from\
    \ **Finder** on to your dock at the bottom of the **Desktop**.\n⇒ Click the **Sublime\
    \ Text** icon.\n\n### STEP 5 – SAY HELLO\n\n⇒ Carefully type this into lines 1,\
    \ 2 and 3 of your text editor.\n\n```\n1  <script>\n2    alert(\"Hello\")\n3 \
    \ </script>\n```\n\n**Sublime Text**\nMark the start of a JavaScript section.\n\
    Show a message box saying 'Hello'. The code will automatically indent.\nMark the\
    \ end of the JavaScript section.\n\n### STEP 6 – SAVE YOUR CODE\n\n⇒ Click **File\
    \ > Save**.\n⇒ Save to your **Documents** folder.\n⇒ Type **hello.html** as the\
    \ filename.\n\n### STEP 7 – VIEW YOUR PAGE\n\n⇒ Open your **Documents** folder.\n\
    ⇒ Find the **hello.html** file and double-click it.\n⇒ Your web page should now\
    \ load in your normal web browser.\n⇒ You should get a message saying 'Hello'.\n\
    \n## WHY USE JAVASCRIPT INSIDE HTML CODE?\n\nAlthough we are coding with JavaScript,\
    \ we need to put our file inside some HTML code to make it work. HTML stands for\
    \ HyperText Markup Language and is the language used to build web pages.\n\nHTML\
    \ is used to describe what objects, or elements, are shown on a web page. If you\
    \ are creating a simple game, you need to use HTML to add an image and some text\
    \ to show the score. However, HTML can't make the image move or the score change.\n\
    \nJavaScript is added to tell the image to move around when different keys are\
    \ pressed, or the mouse is clicked. It can also be used to display the score and\
    \ make it change. We need to use both HTML and JavaScript to make a more interesting\
    \ game. JavaScript was designed to be added to HTML pages to make them more interactive.\n\
    \nYou will learn about using different elements of HTML with JavaScript as you\
    \ work through the projects in this book.\n\n## MATHS QUIZ\n\nNow let's code a\
    \ simple maths quiz. This will be a chance for you to get to know JavaScript a\
    \ bit better. If you've done some coding before, you will be familiar with the\
    \ idea of variables and IF statements. We will look at how to use these concepts\
    \ in JavaScript.\n\n### STEP 1 – START YOUR TEXT EDITOR\n\n- **On a PC:**\n  -\
    \ Click Start > Programs > Sublime Text.\n- **On a Mac:**\n  - Click the Sublime\
    \ Text icon (see page 5 for help).\n\n### STEP 2 – ENTER THE CODE\n\nCarefully\
    \ type in your maths quiz questions. For the question 'What is 8 x 8?' (Answer:\
    \ 64), add the following code into your text editor for lines 1 to 6:\n\n```\n\
    <script>\n  answer=prompt(\"What is 8 x 8?\");\n  if(answer===64){\n    alert(\"\
    Correct!\");\n  }\n</script>\n```\n\nStart the script.\nAsk a question.\nIf the\
    \ answer is 64, then:\nShow a message box saying 'Correct!'.\nEnd the script.\n\
    \nIn JavaScript, the amount you indent your code won't affect how it works. However,\
    \ it will make it easier to read. Your text editor may also do this automatically.\
    \ Just as you end a sentence with a full stop, you should end JavaScript statements\
    \ with a semi-colon(;).\n\n### STEP 3 – SAVE YOUR CODE\n\n- Click File > Save\
    \ and type **quiz.html** as the filename.\n- Make sure you save it in your **Documents**\
    \ folder."
  mdcn: "\n GENERATION CODE\n\n## 我是JavaScript游戏制作初学者：基础知识\n\n{ 构建7个程序 }\n\n2017年11月09日\n\
    - 2017年12月01日\n2018年01月18日\n2018年03月31日\n\n请在所示最后日期前归还或续借。您可以将物品归还至任何东萨塞克斯图书馆。您可以通过电话或互联网续借图书。\n\
    \n**0345 60 80 195** 续借\n**0345 60 80 196** 咨询\n\n**图书馆与信息服务**\n**eastsussex.gov.uk/libraries**\n\
    \n## GENERATION CODE\n\n## 我是JavaScript游戏制作初学者：基础知识\n\nMax Wainwright\n\nwww.waylandbooks.co.uk\n\
    \n## 目录\n\n- 简介 ....................... 3\n- 开始 .................... 4\n- 数学测验\
    \ ......................... 6\n- 随机颜色 .................... 8\n- 动起来 ......................\
    \ 10\n- 点击起来 ...................... 12\n- 章鱼捕手 ................... 14\n- 气球爆破\
    \ .................... 18\n- 接骨头 ...................... 24\n- 词汇表 ..........................\
    \ 30\n- 命令列表 ...................... 31\n- 索引 ............................. 32\n\
    \n## 简介\n\n学习如何使用JavaScript编写自己的趣味游戏。JavaScript是一种最初用于让网页更具互动性的语言。现在它被用来创建可在电脑和移动设备上运行的在线游戏。享受创建本书中的简单项目，你将成为JavaScript专家的道路上迈进！\n\
    \n⇒ 如果你正在制作自己的网页，花点时间画个示意图并做好规划再开始。如果事情不顺利，尝试更改数值，不要害怕重新开始——你会从中学到东西。\n\n⇒ 练习调试！制作一个非常简单的网页，让朋友在您不注意时更改一行代码。您能修复它吗？\n\
    \n⇒ 当一切正常工作时，停下来逐行查看您的代码，确保您理解每一行。尝试修改您的代码，试验不同的数值。要擅长调试，您需要理解代码中每一行的作用及其工作原理。\n\
    \n您可以使用纯文本编辑器来创建代码。\n\n```\nmygame.html\n<script>\nalert('Press any key to start')\n\
    </script>\n```\n\n这可以正常工作，但可能相当繁琐，因为软件不会提供任何帮助。\n\n本书中最适合使用的工具是离线HTML编辑器。它将在您输入代码时提供支持，同时也有助您学习JavaScript代码。\n\
    \n您将使用两个独立的窗口：\n\n```\nSublime Text\n<script>\nvar score=0;\nvar seconds=0;\n\
    function moveIt(){\nscore++;\n```\n\n文本编辑器用于输入JavaScript代码。\n\n浏览器用于查看程序。\n\n\
    有许多不同的浏览器可供使用。我们建议使用Google Chrome来完成本书中的活动。开始前请确保您的计算机已安装最新版本。\n\n本书中您还将学习一些HTML以及JavaScript。HTML是用于构建网页的语言。JavaScript是让这些页面生动起来的语言！\n\
    \n## 开始\n\n您需要一个文本编辑器来开始编写JavaScript。您的计算机上可能已经有一个简单的文本编辑器，叫做记事本（如果您使用Windows）或TextEdit（在Mac上）。这足以让您入门，但下载一个更强大的文本编辑器会让JavaScript的创建更加容易。本书中，我们将使用一个名为Sublime\
    \ Text的文本编辑器。还有许多其他编辑器可供下载，例如Brackets或Notepad++——所有这些都可以免费试用。\n\n### 步骤 1 – 找到Sublime\
    \ Text网站\n\n- 打开网络浏览器并访问 www.sublimetext.com\n\n### 步骤 2 – 开始下载\n\n- 点击网页顶部附近的**下载**按钮。\n\
    - 选择您需要的Sublime Text版本。如果不确定，请让成年人帮您找到正确的版本：如果您使用Mac，点击Apple菜单，然后点击**关于本机**。在PC上点击**开始**菜单，选择**系统**，然后点击**关于**。\n\
    \n| 下载 |\n| --- |\n| OS X（需要10.7或更高版本） |\n| Windows |\n| Windows 64位 |\n\n###\
    \ 步骤 3 – 安装软件\n\n- 某些网络浏览器会要求您运行安装程序。选择**运行**。\n- 如果这没有发生，不要惊慌。安装程序文件应该已下载到您的计算机。在您的**下载**文件夹中查找它。双击它以开始安装新的文本编辑器。您应该会看到一个白色或灰色的大框，其中包含接下来操作的说明。按照这些说明完成安装。\n\
    \n### 步骤 4 – 运行Sublime Text\n\n**在PC上：**\n⇒ 点击**开始 > 程序 > Sublime Text**。或者如果它出现在**最近添加**部分，直接点击**Sublime\
    \ Text**。\n\n**在Mac上：**\n⇒ 点击**Finder**。\n⇒ 点击**应用程序**。\n⇒ 通过将**Finder**中的**Sublime\
    \ Text**拖到**桌面**底部的程序坞来创建快捷方式。\n⇒ 点击**Sublime Text**图标。\n\n### 步骤 5 – 说你好\n\n\
    ⇒ 仔细地将以下内容输入到文本编辑器的第1、2、3行中。\n\n```\n1  <script>\n2    alert(\"Hello\")\n3  </script>\n\
    ```\n\n**Sublime Text**\n标记JavaScript部分的开始。\n显示一个说出\"Hello\"的消息框。代码将自动缩进。\n标记JavaScript部分的结束。\n\
    \n### 步骤 6 – 保存您的代码\n\n⇒ 点击**文件 > 保存**。\n⇒ 保存到您的**文档**文件夹。\n⇒ 输入**hello.html**作为文件名。\n\
    \n### 步骤 7 – 查看您的页面\n\n⇒ 打开您的**文档**文件夹。\n⇒ 找到**hello.html**文件并双击它。\n⇒ 您的网页现在应该会在您常用的网络浏览器中加载。\n\
    ⇒ 您应该会看到一条显示\"Hello\"的消息。\n\n## 为什么要在HTML代码中使用JavaScript？\n\n虽然我们在用JavaScript编程，但我们需要将文件放在一些HTML代码中才能使其工作。HTML代表超文本标记语言，是用于构建网页的语言。\n\
    \nHTML用于描述网页上显示什么对象或元素。如果您正在创建一个简单的游戏，您需要使用HTML来添加图像和一些文本来显示分数。但是，HTML无法让图像移动或分数变化。\n\
    \n添加JavaScript是为了告诉图像在不同的按键被按下或鼠标被点击时移动。它还可以用来显示分数并使其发生变化。我们需要同时使用HTML和JavaScript来制作更有趣的游戏。JavaScript的设计初衷就是添加到HTML页面中以增强它们的互动性。\n\
    \n在本书的项目中，您将学习如何将HTML的不同元素与JavaScript结合使用。\n\n## 数学测验\n\n现在让我们编写一个简单的数学测验。这将是您进一步了解JavaScript的好机会。如果您以前做过一些编程，您应该熟悉变量和IF语句的概念。我们将看看如何在JavaScript中使用这些概念。\n\
    \n### 步骤 1 – 启动您的文本编辑器\n\n- **在PC上：**\n  - 点击开始 > 程序 > Sublime Text。\n- **在Mac上：**\n\
    \  - 点击Sublime Text图标（请参见第5页获取帮助）。\n\n### 步骤 2 – 输入代码\n\n仔细输入您的数学测验题目。对于问题\"8\
    \ x 8是多少？\"（答案：64），将以下代码添加到文本编辑器的第1至6行：\n\n```\n<script>\n  answer=prompt(\"What\
    \ is 8 x 8?\");\n  if(answer===64){\n    alert(\"Correct!\");\n  }\n</script>\n\
    ```\n\n开始脚本。\n提出一个问题。\n如果答案是64，则：\n显示一个写着\"Correct!\"的消息框。\n结束脚本。\n\n在JavaScript中，代码的缩进量不会影响其工作方式。然而，这会让代码更易读。您的文本编辑器也可能会自动执行此操作。正如您用句号结束句子一样，您应该用分号(;)结束JavaScript语句。\n\
    \n### 步骤 3 – 保存您的代码\n\n- 点击文件 > 保存并输入**quiz.html**作为文件名。\n- 确保将其保存在您的**文档**文件夹中。\n"
