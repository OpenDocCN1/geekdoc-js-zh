  md: '# ON THE MOVE


    To start coding our own games we need to use some new techniques. Firstly we need
    to add images to the screen. We also need to be able to position the images in
    particular places and then make the images move. To make all this work we will
    use some HTML code, as well as the JavaScript.


    # STEP 1 – FIND A PICTURE


    First of all, you need to find an image to use. It needs to be placed in the same
    folder as your HTML file.


    +   - Go online and search for some clipart to use (see page 31).


    ![](img/6c566f2daf5f64a5f69519309716a385_13_0.png)


    +   - Right-click on your chosen image. We will use a ghost image.

    - Click **Save Image As...**

    - Navigate to your **Documents** folder then click **Save**.


    # STEP 2 – CHECK!


    +   - Open your **Documents** folder and check the picture file is there. Depending
    on your browser and the image it may be called **ghost.png** or **download.png**.
    If it is not there, go back to step 1 and try again, making sure you select the
    **Documents** folder.


    ![](img/6c566f2daf5f64a5f69519309716a385_13_1.png)


    +   - Find your image and remember its exact filename.


    # STEP 3 – START A NEW FILE


    +   - Carefully type this code into your text editor. We are going to use some
    HTML code to set the background colour using the **\<body\>** tag. We will add
    an image, using the **\<img\>** tag.


    ```

    1  <html>

    2    <body style="background-color:darkblue">

    3      <img id="ghost" style="position:absolute;" src="ghost.png">

    4    </body>

    5  </html>

    ```


    Start the HTML.

    Set the background colour using the body tag.

    Use the filename for the image from step 3.

    End the body tag.

    End the HTML.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# THE HTML IMAGE TAG:


    The id is a name we give to the image.


    position:absolute allows the image to be located using co-ordinates.


    ```

    <img id="ghost" style="position:absolute;" src="ghost.png">

    ```


    We add an image to the page.


    The style attribute is used to set things like the size and colour of an HTML
    element. Remember to add the quotes.


    Type the filename of the image into the src attribute.


    # STEP 4 - SAVE YOUR FILE


    +   ⇒ Click **File > Save** and type **ghost.html** as the filename.

    Make sure you save it in your **Documents** folder.


    # STEP 5 - VIEW YOUR PAGE


    +   ⇒ Open your **Documents** folder.

    Double-click the file and you should see it appear in your web page.


    # STEP 6 - MAKE IT MOVE!


    ⇒ We can use the timer technique from the colour-changing program to make the
    image move. Instead of changing the screen colour, we will change the position
    of the ghost every second.


    ⇒ Add to your original code by inserting a `<script>` section at line 5.


    ```

    Sublime Text


    1  <html>

    2    <body style="background-color:darkblue">

    3      <img id="ghost" style="position:absolute;" src="ghost.png">

    4    </body>

    5    <script>

    6      var timer=window.setInterval(moveGhost, 1000);

    7      function moveGhost(){

    8        document.getElementById("ghost").style.left=Math.random()*900+"px";

    9        document.getElementById("ghost").style.top=Math.random()*600+"px";

    10     }

    11   </script>

    12 </html>

    ```


