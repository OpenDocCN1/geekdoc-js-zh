  - '[PAGE 14]


    # THE HTML IMAGE TAG:


    The id is a name we give to the image.


    position:absolute allows the image to be located using co-ordinates.


    ```

    <img id="ghost" style="position:absolute;" src="ghost.png">

    ```


    We add an image to the page.


    The style attribute is used to set things like the size and colour of an HTML
    element. Remember to add the quotes.


    Type the filename of the image into the src attribute.


    # STEP 4 - SAVE YOUR FILE


    +   ⇒ Click **File > Save** and type **ghost.html** as the filename.

    Make sure you save it in your **Documents** folder.


    # STEP 5 - VIEW YOUR PAGE


    +   ⇒ Open your **Documents** folder.

    Double-click the file and you should see it appear in your web page.


    # STEP 6 - MAKE IT MOVE!


    ⇒ We can use the timer technique from the colour-changing program to make the
    image move. Instead of changing the screen colour, we will change the position
    of the ghost every second.


    ⇒ Add to your original code by inserting a `<script>` section at line 5.


    ```

    Sublime Text


    1  <html>

    2    <body style="background-color:darkblue">

    3      <img id="ghost" style="position:absolute;" src="ghost.png">

    4    </body>

    5    <script>

    6      var timer=window.setInterval(moveGhost, 1000);

    7      function moveGhost(){

    8        document.getElementById("ghost").style.left=Math.random()*900+"px";

    9        document.getElementById("ghost").style.top=Math.random()*600+"px";

    10     }

    11   </script>

    12 </html>

    ```


    +   Start the JavaScript section.

    Create a timer that runs the moveGhost function every 1000 milliseconds.

    Define the moveGhost function.

    Move the ghost to a new random position by setting its left and top style properties.

    End the moveGhost function.

    End JavaScript.


    # KEY CONCEPT


    # CO-ORDINATES


    Move elements, such as images, by setting their **left** and **top** style properties,
    or co-ordinates. Add **px** on the end of the value to measure in pixels. The
    co-ordinates (0,0) will always be in the top left of the browser. The maximum
    co-ordinates will depend on the size of the browser window.


    # TAGS


    In HTML, all elements have an opening tag. Tags always start with < and end with
    >.


    # ATTRIBUTES


    Attributes provide extra information about an HTML element, such as its size and
    colour.'
- md: " ## GET CLICKING\n\nAll computer games need the player to interact with the\
    \ computer or device. To do this we need to use mouse and keyboard events. These\
    \ are special bits of code that 'listen' to the mouse or keyboard and wait for\
    \ certain things to happen, before running some other code.\n\n## EVENTS\n\nWe\
    \ can use the onclick event to make some code run when an image is clicked.\n\n\
    The event that the program is listening for.\n\n```\n<img id=\"ghost\" onclick=\"\
    hideMe()\" src=\"ghost.png\">\n```\n\nThe name of the function to run when the\
    \ event takes place.\n\nAs well as the onclick event there are lots of other events\
    \ including:\n\n- onmousedown → triggered the moment the mouse button is pressed\
    \ down.\n- onmousemove → triggered every time the mouse is moved over an element.\n\
    - onmouseup → triggered the moment the mouse button is released.\n- onkeydown\
    \ → triggered when keys on the keyboard are pressed.\n\n![](img/6c566f2daf5f64a5f69519309716a385_15_0.png)\n\
    \n## STEP 1 – START A NEW FILE\n\n→ Carefully add this code into your text editor.\n\
    \n```\n1 <html>\n2   <img id=\"ghost\" onclick=\"hideMe()\" src=\"ghost.png\"\
    >\n3   <script>\n4     function hideMe(){\n5       document.getElementById(\"\
    ghost\").style.display=\"none\";\n6     }\n7   </script>\n8 </html>\n```\n\nUse\
    \ the郴ghost picture from page 10. When it is clicked, run the function called\
    \ hideMe. Use the filename for the image from page 10. Define the function called\
    \ hideMe. Hide the ghost when the function is run. End the function.\n\n<12>\n\
    \n## STEP 2 – SAVE AND VIEW YOUR FILE\n\n- Click File > Save and type **events.html**\
    \ as the filename.\n- Make sure you save it in your **Documents** folder.\n- Open\
    \ your **Documents** folder. Double-click the **events.html** file. You should\
    \ see your image.\n- Click the image to make it disappear.\n\n![](img/6c566f2daf5f64a5f69519309716a385_16_0.png)\n\
    \n```\nHIDING HTML ELEMENTS\nSet the style.display property of an element to **none**\
    \ to make it disappear. Set it to **block** to make it appear again.\n\nSelect\
    \ the element to hide (the ghost), by using its ID (its name).\ndocument.getElementById(\"\
    ghost\").style.display=\"none\";\n\nThe value you are giving to the property.\n\
    The property you want to change.\n```\n\n## STEP 3 – RUNAWAY!\n\nWe are going\
    \ to use the **onmouseenter** event in the next example. This is triggered just\
    \ as the mouse is moved over an element. It doesn't wait for the mouse to be pressed.\
    \ When you move the mouse over the ghost, it will **jump** to a new random position.\n\
    \n- Edit your code from page 12.\n\nRemember to set **position:absolute**.\n\n\
    ```\nSublime Text\n1 <html>\n2  <img id=\"ghost\" style=\"position:absolute;\"\
    \ onmouseenter=\"runAway()\" src=\"ghost.png\">\n3  <script>\n4    function runAway(){\n\
    5      document.getElementById(\"ghost\").style.left=Math.random()*900+\"px\"\
    ;\n6      document.getElementById(\"ghost\").style.top=Math.random()*600+\"px\"\
    ;\n7    }\n8  </script>\n9 </html>\n```\n\nAs soon as someone tries to move the\
    \ mouse over the ghost it will run the function called runAway.\n\nDefine the\
    \ function called runAway.\nMove the ghost to a new random position by setting\
    \ its left and top style properties.\nEnd the function.\n\n## STEP 4 – SAVE AND\
    \ RELOAD\n\n- Save your code and then reload your browser to see the changes.\n\
    - Try to move your mouse over the ghost. Every time your mouse moves over it,\
    \ it should move away to a new position.\n\n![](img/6c566f2daf5f64a5f69519309716a385_16_1.png)\n\
    \n> Elements are the items that make up a web page, such as images. HTML uses\
    \ tags to identify elements. <img> is the start of an image tag.\n\n## OCTOPUS\
    \ CATCHER\n\nIn this game, the player will have to catch Otto the octopus as many\
    \ times as possible within 30 seconds. A timer will make Otto move every second.\
    \ An **onmousedown** event will be used to check when Otto is clicked. Variables\
    \ will be used to store the score and time left. The complete code for the game\
    \ is listed on page 17.\n\n## STEP 1 – PLANNING\n\nThe score is shown in an HTML\
    \ paragraph element.\n\nA timer will make Otto move every second.\n\nAn **onmousedown**\
    \ event is used to check when Otto is caught. (**onmousedown** will trigger before\
    \ the **onclick** event.)\n\nDocuments/otto.html\n\nScore: 7\n\nYou scored: 7\n\
    \nOK\n\n**var score**\n\n**var seconds**\n\nVariables count the score and how\
    \ long the game has been running.\n\nAfter 30 seconds the game ends and the score\
    \ is shown.\n\nClick OK to play again.\n\n## STEP 2 – FIND A PICTURE\n\n- Find\
    \ an image of an octopus to use. It needs to be saved into the same folder as\
    \ your HTML file.\n- Search for some clipart.\n- Right-click one image.\n- Click\
    \ **Save Image As...**\n- Navigate to your **Documents** folder then click **Save**.\n\
    \n## THE HTML PARAGRAPH TAG\n\nSet the style.display property of an element to\
    \ **none** to make it disappear. Set it to **block** to make it appear again.\n\
    \nWe are adding a paragraph to the page.\n\nThe ID is a name we give to the paragraph.\n\
    \n```\n<p id=\"scoreText\">Score: 0</p>\n```\n\nThe text we want shown in the\
    \ paragraph element is typed here: between the opening `<p>` tag and the closing\
    \ `</p>` tag.\n\nThis is called the closing tag – the end of the paragraph.\n\n\
    If we want to change the colour of the paragraph we can add a style attribute\
    \ the way that we have done with the body element, and set its colour property.\n\
    \n## STEP 3 – START A NEW FILE\n\nStart by typing in the HTML for the game, setting\
    \ out the body, image and a paragraph for the score.\n\n### Sublime Text\n\n```\n\
    <html>\n<body style=\"background-color:cyan\">\n  <img id=\"otto\" style=\"position:absolute;\
    \ -webkit-transition: all 0.5s;\" src=\"octopus.png\" width=\"100\" onmousedown=\"\
    caughtIt()\">\n  <p id=\"scoreText\">Score: 0</p>\n</body>\n```\n\nSet the background\
    \ colour.\n\nAdd the image from page 12. Make sure the src property matches the\
    \ name of the downloaded file.\n\nUse a paragraph to show the score.\n\n## KEY\
    \ CONCEPT\n\n### TRANSITION PROPERTIES\n\nThe ghost on page 10 moved around in\
    \ quite a jerky manner. We want this game to be a bit smoother. To make this happen\
    \ we will add a transition property. This means when any of Otto's properties\
    \ are altered they will change gradually over a specific amount of time, instead\
    \ of changing instantly. Here is the new style property used in line 3:\n\n-webkit-transition\
    \ is a property that is used to switch on gradual changes.\n\nAll of the style\
    \ properties will change gradually.\n\n```\n-webkit-transition: all 0.5s;\n```\n\
    \nThe changes will be spread over 0.5s (half a second).\n\n## STEP 4 – SAVE YOUR\
    \ CODE\n\nClick File > Save and type **otto.html** as the filename.\n\nMake sure\
    \ you save it in your Documents folder. Keep saving it every time you add a new\
    \ piece of code.\n\n## STEP 5 – BEGIN THE SCRIPT\n\nWe need to create our variables\
    \ and start a timer. Add this code:\n\n```\n<script>\nvar score=0;\nvar seconds=0;\n\
    var timer=window.setInterval(moveIt, 1000);\n```\n\nStart the script section.\n\
    \nSet the score variable to 0.\n\nSet the seconds variable to 0.\n\nAdd the timer,\
    \ which will run a function called *moveIt* every second. Although we 'declare'\
    \ it as a variable it is more like a clock. Giving it a name will mean we can\
    \ stop it later.\n\n## STEP 6 – MOVE IT!\n\nNext we need to type in the function\
    \ that moves Otto.\nThis is similar to the moveGhost function on page 11.\n\n\
    ```\nfunction moveIt(){\n    seconds++;\n    document.getElementById(\"otto').style.left=Math.random()*900+\"\
    px\";\n    document.getElementById(\"otto\").style.top=Math.random()*700+\"px\"\
    ;\n    if(seconds>30){\n        clearInterval(timer);\n        alert(\"You scored:\"\
    \ + score);\n        location.reload();\n    }\n}\n```\n\n- Define the function.\n\
    - Count the seconds.\n- Move Otto to a new random position.\n- If the time limit\
    \ is up:\n  - Stop the timer.\n  - Display a message box showing the score.\n\
    \  - After OK is pressed, reload the page to start a new game.\n- End the block\
    \ of code covered by the IF statement.\n- End the function.\n\n## STEP 7 – CAUGHT\
    \ IT!\n\nNow add the function caughtIt, which is run (or 'called') when Otto is\
    \ clicked.\n\n```\nfunction caughtIt(){\n    score++;\n    document.getElementById(\"\
    scoreText\").innerText=\"Score: \"+score;\n}\n</script>\n</html>\n```\n\n- Define\
    \ the function.\n- Increase the score by 1.\n- Change the score text. This is\
    \ done by setting the innerText property.\n- End the script.\n- End the HTML file.\n\
    \nSave your code, reload your browser, then play the game!\n\n## CUSTOMISE\n\n\
    - Change how long the game lasts.\n- Move Otto around more quickly by altering\
    \ the -webkit-transition value.\n- Use a different image file and change the background\
    \ colour to completely change the look of the game.\n\n![](img/6c566f2daf5f64a5f69519309716a385_19_0.png)"
  mdcn: "\n ## 开始点击\n\n所有电脑游戏都需要玩家与计算机或设备进行交互。为此，我们需要使用鼠标和键盘事件。这些是一些特殊的代码片段，可以“监听”鼠标或键盘，等待某些事情发生，然后再运行其他代码。\n\
    \n## 事件\n\n我们可以使用 onclick 事件，让代码在点击图片时运行。\n\n程序正在监听的事件。\n\n```\n<img id=\"ghost\"\
    \ onclick=\"hideMe()\" src=\"ghost.png\">\n```\n\n事件发生时将运行的函数名称。\n\n除了 onclick\
    \ 事件，还有许多其他事件，包括：\n\n- onmousedown → 鼠标按钮按下的瞬间触发。\n- onmousemove → 每次鼠标在元素上移动时触发。\n\
    - onmouseup → 鼠标按钮释放的瞬间触发。\n- onkeydown → 键盘上的按键被按下时触发。\n\n![](img/6c566f2daf5f64a5f69519309716a385_15_0.png)\n\
    \n## 步骤 1 – 创建新文件\n\n→ 仔细地将此代码添加到您的文本编辑器中。\n\n```\n1 <html>\n2   <img id=\"ghost\"\
    \ onclick=\"hideMe()\" src=\"ghost.png\">\n3   <script>\n4     function hideMe(){\n\
    5       document.getElementById(\"ghost\").style.display=\"none\";\n6     }\n\
    7   </script>\n8 </html>\n```\n\n使用第10页的幽灵图片。当点击它时，运行名为 hideMe 的函数。使用第10页的图片文件名。定义名为\
    \ hideMe 的函数。函数运行时隐藏幽灵。结束函数。\n\n<12>\n\n## 步骤 2 – 保存并查看您的文件\n\n- 点击 文件 > 保存，并输入\
    \ **events.html** 作为文件名。\n- 确保将其保存在 **文档** 文件夹中。\n- 打开 **文档** 文件夹。双击 **events.html**\
    \ 文件。您将看到您的图片。\n- 点击图片使其消失。\n\n![](img/6c566f2daf5f64a5f69519309716a385_16_0.png)\n\
    \n```\n隐藏 HTML 元素\n将元素的 style.display 属性设置为 **none** 使其消失。设置为 **block** 使其再次显示。\n\
    \n使用其 ID（名称）选择要隐藏的元素（幽灵）。\ndocument.getElementById(\"ghost\").style.display=\"\
    none\";\n\n您要给属性的值。\n您要更改的属性。\n```\n\n## 步骤 3 – 逃跑！\n\n我们将在下一个示例中使用 **onmouseenter**\
    \ 事件。这是在鼠标移动到元素上方时触发的。它不需要等待鼠标按下。当您将鼠标移到幽灵上方时，它会**跳转**到一个新的随机位置。\n\n- 编辑您第12页的代码。\n\
    \n记得设置 **position:absolute**。\n\n```\nSublime Text\n1 <html>\n2  <img id=\"ghost\"\
    \ style=\"position:absolute;\" onmouseenter=\"runAway()\" src=\"ghost.png\">\n\
    3  <script>\n4    function runAway(){\n5      document.getElementById(\"ghost\"\
