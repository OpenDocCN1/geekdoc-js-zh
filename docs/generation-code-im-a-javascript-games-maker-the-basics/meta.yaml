    ## 步骤 4 - 保存你的代码\n\n⇒ 点击 文件 > 保存，然后输入 **colours.html** 作为文件名。确保将其保存在你的**文档**文件夹中。\n\
    \n## 步骤 5 - 查看你的作品\n\n⇒ 打开你的**文档**文件夹。双击 **colours.html** 文件。你的程序应该会在网页浏览器中运行。屏幕应该每秒改变一次颜色。\n\
    \n## 步骤 6 - 排列你的屏幕\n\n当你开始开发更复杂的程序时，你需要同时查看你的代码和浏览器。许多程序员会将屏幕设置为代码在左侧，网页显示在右侧。\n\
    \n⇒ 调整你的文本编辑器和浏览器窗口大小，使你的屏幕看起来像这样：\n\n\U0001F504 要查看更改的效果，你需要重新加载文件，方法是点击**重新加载此页面**图标。\n\
    \n在文本编辑器中对代码进行更改后，保存你的文件。\n\n## 自定义\n\n- 在列表中添加更多颜色。确保在每个颜色单词周围加上双引号，并用逗号分隔。\n\
    - 要从新列表中选取项目，你需要更改所选的随机数。编辑第 5 行末尾的数字，使其与列表长度匹配。\n- 通过编辑第 3 行末尾的内容来更改选择新颜色的频率（选择非常低的值将导致颜色闪烁）。\n\
    \n> **核心概念**\n\n**数组**\n数组是作为某些数据存储的项目列表。列表类似于变量，但它们可以存储多个信息项。在我们的程序中，第 2 行包含一个颜色列表。\n\
    \n**函数**\n函数是结合多个命令的代码段。函数的名称成为一个新命令，运行整个部分。第 4 到 7 行包含函数定义。\n\n## 动起来\n\n要开始编写我们自己的游戏，我们需要使用一些新技术。首先，我们需要将图像添加到屏幕上。我们还需要能够将图像定位到特定位置，然后让图像移动。为了实现这一切，我们将使用一些\
    \ HTML 代码以及 JavaScript。\n\n## 步骤 1 – 找一张图片\n\n首先，你需要找到一张要使用的图片。它需要放在与你的 HTML 文件相同的文件夹中。\n\
    \n- 上网搜索一些可用的剪贴画（参见第 31 页）。\n\n- 右键点击你选择的图片。我们将使用一张幽灵图片。\n- 点击**图片另存为...**\n-\
    \ 导航到你的**文档**文件夹，然后点击**保存**。\n\n## 步骤 2 – 检查！\n\n- 打开你的**文档**文件夹，检查图片文件是否在那里。根据你的浏览器和图片，它可能被称为\
    \ **ghost.png** 或 **download.png**。如果它不在那里，返回步骤 1 重试，确保你选择的是**文档**文件夹。\n\n- 找到你的图片并记住它的确切文件名。\n\
    \n## 步骤 3 – 开始一个新文件\n\n- 仔细地将这段代码输入到你的文本编辑器中。我们将使用一些 HTML 代码，通过 **\\<body\\>**\
    \ 标签来设置背景颜色。我们将使用 **\\<img\\>** 标签添加一张图片。\n\n```\n1  <html>\n2    <body style=\"\
    background-color:darkblue\">\n3      <img id=\"ghost\" style=\"position:absolute;\"\
    \ src=\"ghost.png\">\n4    </body>\n5  </html>\n```\n\n开始 HTML。\n使用 body 标签设置背景颜色。\n\
    使用步骤 3 中的图片文件名。\n结束 body 标签。\n结束 HTML。\n\n## HTML 图片标签：\n\nid 是我们给图片起的名称。\n\n\
    position:absolute 允许使用坐标来定位图片。\n\n```\n<img id=\"ghost\" style=\"position:absolute;\"\
    \ src=\"ghost.png\">\n```\n\n我们在页面上添加一张图片。\n\nstyle 属性用于设置 HTML 元素的大小和颜色等内容。记得加上引号。\n\
    \n在 src 属性中输入图片的文件名。\n\n## 步骤 4 - 保存你的文件\n\n⇒ 点击**文件 > 保存**，然后输入 **ghost.html**\
    \ 作为文件名。\n确保将其保存在你的**文档**文件夹中。\n\n## 步骤 5 - 查看你的页面\n\n⇒ 打开你的**文档**文件夹。\n双击该文件，你应该能在网页上看到它。\n\
    \n## 步骤 6 - 让它动起来！\n\n⇒ 我们可以使用颜色变换程序中的计时器技术来移动图像，而不是改变屏幕颜色。幽灵的位置将使用随机坐标每秒更新一次。\n\
    \n⇒ 通过在第 5 行插入一个 `<script>` 部分来添加到你的原始代码中。\n\n```\nSublime Text\n\n1  <html>\n\
    2    <body style=\"background-color:darkblue\">\n3      <img id=\"ghost\" style=\"\
    position:absolute;\" src=\"ghost.png\">\n4    </body>\n5    <script>\n6      var\
    \ timer=window.setInterval(moveGhost, 1000);\n7      function moveGhost(){\n8\
    \        document.getElementById(\"ghost\").style.left=Math.random()*900+\"px\"\
    ;\n9        document.getElementById(\"ghost').style.top=Math.random()*600+\"px\"\
