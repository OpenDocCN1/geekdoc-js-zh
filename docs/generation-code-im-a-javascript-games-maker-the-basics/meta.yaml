  md: '# GET CLICKING


    All computer games need the player to interact with the computer or device. To
    do this we need to use mouse and keyboard events. These are special bits of code
    that ''listen'' to the mouse or keyboard and wait for certain things to happen,
    before running some other code.


    # EVENTS


    We can use the onclick event to make some code run when an image is clicked.


    The event that the program is listening for.


    ```

    <img id="ghost" onclick="hideMe()" src="ghost.png">

    ```


    The name of the function to run when the event takes place.


    As well as the onclick event there are lots of other events including:


    +   - onmousedown ⇨ triggered the moment the mouse button is pressed down.

    - onmousemove ⇨ triggered every time the mouse is moved over an element.

    - onmouseup ⇨ triggered the moment the mouse button is released.

    - onkeydown ⇨ triggered when keys on the keyboard are pressed.


    ![](img/6c566f2daf5f64a5f69519309716a385_15_0.png)


    # STEP 1 – START A NEW FILE


    ⇨ Carefully add this code into your text editor.


    ```

    1 <html>

    2   <img id="ghost" onclick="hideMe()" src="ghost.png">

    3   <script>

    4     function hideMe(){

    5       document.getElementById("ghost").style.display="none";

    6     }

    7   </script>

    8 </html>

    ```


    Use the ghost picture from page 10. When it is clicked, run the function called
    hideMe. Use the filename for the image from page 10. Define the function called
    hideMe. Hide the ghost when the function is run. End the function.


    <12>'
