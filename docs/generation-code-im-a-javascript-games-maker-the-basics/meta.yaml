    \ **免费使用、共享或修改**。\n\n### 样式属性\n\n- **position:absolute** – 允许通过更改 left 和 top 属性来移动元素。\n\
    - **left** – 设置元素（如图像）距离屏幕左侧有多远。\n- **top** – 设置元素距离屏幕顶部有多远。\n- **height** – 设置元素的高度，例如图像（如\
