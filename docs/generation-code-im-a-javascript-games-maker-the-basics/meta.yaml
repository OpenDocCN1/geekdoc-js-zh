    \ function, if the bone has been missed and has fallen below the dog.\n\nRun the\
    \ caughtBone function, if the bone has been caught by the dog and they both have\
    \ the same x and y co-ordinates."
- md: ' ## STEP 8 – MISSED IT


    If the dog hasn''t caught the bone then the player loses a life. We test for this
