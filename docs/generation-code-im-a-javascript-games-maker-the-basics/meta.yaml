  md: "# MATHS QUIZ\n\nNow let’s code a simple maths quiz. This will be a chance for\
    \ you to get to know JavaScript a bit better. If you’ve done some coding before,\
    \ you will be familiar with the idea of variables and IF statements. We will look\
    \ at how to use these concepts in JavaScript.\n\n![](img/6c566f2daf5f64a5f69519309716a385_9_0.png)\n\
    \n# STEP 1 – START YOUR TEXT EDITOR\n\n+   - **On a PC:**\n  - Click Start > Programs\
    \ > Sublime Text.\n- **On a Mac:**\n  - Click the Sublime Text icon (see page\
    \ 5 for help).\n\n# STEP 2 – ENTER THE CODE\n\nCarefully type in your maths quiz\
    \ questions. For the question 'What is 8 x 8?' (Answer: 64), add the following\
    \ code into your text editor for lines 1 to 6:\n\n```\n<script>\n  answer=prompt(\"\
    What is 8 x 8?\");\n  if(answer===64){\n    alert(\"Correct!\");\n  }\n</script>\n\
    ```\n\nStart the script.\nAsk a question.\nIf the answer is 64, then:\nShow a\
    \ message box saying 'Correct!'.\nEnd the script.\n\nIn JavaScript, the amount\
    \ you indent your code wont affect how it works. However, it will make it easier\
    \ to read. Your text editor may also do this automatically. Just as you end a\
    \ sentence with a full stop, you should end JavaScript statements with a semi-colon(;).\n\
    \n# STEP 3 – SAVE YOUR CODE\n\n+   - Click File > Save and type **quiz.html**\
    \ as the filename.\n- Make sure you save it in your **Documents** folder."
  merge: -1
  pgno: 9
- img_proc: true
  md: '# STEP 4 – VIEW YOUR WORK


    ⇒ Open your **Documents** folder and double-click the **quiz.html** file. Your
    program should run in your web browser.


    ⇒ Test your page by answering correctly, then reloading your page and giving the
    wrong answer.


    ![](img/6c566f2daf5f64a5f69519309716a385_10_0.png)


    # STEP 5 – RANDOMISE!


    ⇒ Change your code, in the following way, so random numbers are picked for the
    question:


    Make a variable called a.


    Create a random number between 0 and 1.


    ```

    var a=Math.round(Math.random()*10);

    ```


    Round to the nearest whole number. Multiply it by 10.


    ```

    1  <script>

    2    var a=Math.round(Math.random()*10);

    3    var b=Math.round(Math.random()*10);

    4    answer=prompt("what is "+a+" x "+b+"?");

    5    if(answer==a*b){

    6        alert("Correct!")

    7    }

    8  </script>

    ```


    Use the + sign to join the string ''what is'' to the value stored in the variable
    a.


    Check to see if the answer entered is the same as a multiplied by (*) b.


    # STEP 6 – SAVE AND REFRESH


    ⇒ Save your new code.


    ⇒ Reload your browser to see the changes. Each time you reload it you should get
    a new random question.


    Enjoy playing your quiz!


    # CUSTOMISE


    +   • Change your code so it asks harder questions, using bigger numbers.


    # KEY CONCEPT


    # VARIABLES


    Variables are part of a program that stores information. Variables are given a
    name that is used to point to a part of the computer''s memory. A value is then
    stored in that part of the memory. In this quiz, variables are used to store the
    random numbers and the user''s input.


    # IF STATEMENTS


    Normally, each line of code works one after the other. An IF statement works differently.
    It checks if a particular condition is true before running a certain piece of
    code.'
  merge: -1
  pgno: 10
- img_proc: true
  md: "# RANDOM COLOURS\n\nIn this activity we will make a simple program that randomly\
    \ sets the colour of the screen.\n\n# STEP 1 – PLANNING\n\n+   - Make a list of\
    \ four colours to choose from.\n- Start a timer that changes the colour every\
    \ 1000 milliseconds (which is every one second).\n- To change the colour:\n  -\
    \ pick a random number from 0 to 3\n  - use the random number to pick one of the\
    \ colours\n  - set the background colour to the chosen colour.\n- Make a special\
    \ section of code called a function that will follow the steps above to change\
    \ the colour. By giving the function a name – **changeColour()** – you will create\
    \ a new command that will carry out the steps whenever **changeColour()** is typed.\n\
    \n# BRACKETS!\n\nSquare brackets are used in JavaScript to show the start and\
    \ end of a list. Coders call this sort of list an array. If the array contains\
    \ string (words or symbols), each one needs double quote marks around it. Curly\
    \ brackets are used to show the start and end of a function.\n\n# STEP 2 – START\
    \ A NEW HTML FILE\n\n+   - Start your text editor, or click **File** > **New**.\n\
    \n# STEP 3 – ENTER THIS CODE\n\nType this code in very carefully, using exactly\
    \ the same spelling, symbols and upper case letters. Remember to use the US spelling\
    \ of colour (color) within a JavaScript style command, but the UK spelling of\
    \ colour for the name of functions (such as, **changeColour**) or variables.\n\
    \n```\n<script>\ncolors=[\"red\",\"green\",\"blue\",\"yellow\"];\nvar timer=window.setInterval(changeColour,\
    \ 1000);\nfunction changeColour(){\n  var n=Math.round(Math.random()*4);\n  document.body.style.backgroundColor=colors[n];\n\
    }\n</script>\n```\n\n| Line | Description |\n|---|---|\n| 1 | Start the script.\
    \ |\n| 2 | Make the list of colours. |\n| 3 | Create a timer that will run the\
    \ changeColour function every second. |\n| 4 | Define the changeColour function.\
    \ |\n| 5 | Create a variable called n and give it a random value from 0 to 3.\
    \ |\n| 6 | Set the background colour. |\n| 7 | End the function. |\n| 8 | End\
    \ the script. |"
  merge: -1
  pgno: 11
- img_proc: true
  md: '# STEP 4 - SAVE YOUR CODE


    ⇒ Click File > Save and type **colours.html** as the filename. Make sure you save
    it in your **Documents** folder.


    ![](img/6c566f2daf5f64a5f69519309716a385_12_0.png)


    # STEP 5 - VIEW YOUR WORK


    ⇒ Open your **Documents** folder. Double-click the **colours.html** file. Your
    program should run in your web browser. The screen should change colour every
    second.


    ![](img/6c566f2daf5f64a5f69519309716a385_12_1.png)


    # STEP 6 - ARRANGE YOUR SCREEN


    As you start to develop more complex programs, you will need to see your code
    and the browser at the same time. Many programmers set up their screen so their
    code is on the left-hand side and their web page is shown on the right.


    ⇒ Resize your text editor and browser windows so your screen looks like this:


    ![](img/6c566f2daf5f64a5f69519309716a385_12_2.png)


    🔄 To see the effects of your changes, you need to reload the file, by clicking
    the **Reload this page** icon.


    After you have made a change to your code in the text editor, save your file.


    # CUSTOMISE


    +   - Add more colours to the list. Make sure you put double quotation marks around
    each colour word and separate them with a comma.

    - To pick an item from your new list, you will need to change the random number
    chosen. Edit the number at the end of line 5 to match the length of the list.

    - Change how often a new colour is chosen by editing the end of line 3 (choosing
    a very low value will result in flashing colours).


    > **KEY CONCEPT**


    **ARRAY**

    An array is a list of items stored as some data. Lists are similar to variables
    but they can store multiple items of information. In our program, line 2 contains
    a list of colours.


    **FUNCTION**

    A function is a section of code combining a number of commands. The name of the
    function becomes a new command that runs the whole section. Lines 4 to 7 contain
    the function definition.'
  merge: -1
