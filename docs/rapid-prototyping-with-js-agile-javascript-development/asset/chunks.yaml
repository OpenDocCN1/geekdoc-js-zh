    \ a browser-based GUI to look up and manipulate the data and collections. More\
    \ information is available at [https://devcenter.heroku.com/articles/mongohq].\n\
    \n| ![information](images/leanpub_information.png) |  \n\n#### Note\n\nYou might\
    \ have to provide your credit card information to use MongoHQ even if you select\
    \ the free version. You should not be charged, though. |\n\nIn order to connect\
    \ to the database server, there is a database connection URL (a.k.a. MongoHQ URL/URI),\
    \ which is a way to transfer all of the necessary information to make a connection\
    \ to the database in one string.\n\nThe database connection string `MONGOHQ_URL`\
    \ has the following format:\n\n```\n1 mongodb://user:pass@server.mongohq.com/db_name\n\
    ```\n\nYou could either copy the MongoHQ URL string from the Heroku website (and\
    \ hard-code it) or get the string from the Node.js `process.env` object:\n\n```\n\
    1 process.env.MONGOHQ_URL;\n```\n\nor\n\n```\n1 var connectionUri = url.parse(process.env.MONGOHQ_URL);\n\
    ```\n\n| ![tip](images/leanpub_tip.png) |  \n\n#### Tip\n\nThe global object `process`\
    \ gives access to environment variables via `process.env`. Those variables conventionally\
