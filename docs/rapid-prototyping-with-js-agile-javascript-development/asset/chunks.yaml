- fmt: "\n# Summary: descriptions of different deployment approaches, final version\
    \ of Chat application and its deployment.\n\n> *“Debugging is twice as hard as\
    \ writing the code in the first place. Therefore, if you write the code as cleverly\
    \ as possible, you are, by definition, not smart enough to debug it.”* — [Brian\
    \ W. Kernighan](http://en.wikipedia.org/wiki/Brian_Kernighan)\n\nNow, it would\
    \ be good if we could put our front-end and back-end applications so they could\
    \ work together. There are a few ways to do it:\n\n*   Different domains (Heroku\
    \ apps) for front-end and back-end apps: make sure there are no cross-domain issues\
    \ by using `CORS` or `JSONP`. This approach is covered in detail later.\n*   Same\
    \ domain deployment: make sure `Node.js` process static resources and assets for\
    \ front-end application — not recommended for serious production applications.\n\
    \n## 7.1 Different Domain Deployment\n\nThis is, so far, the best practice for\
    \ the production environment. Back-end applications are usually deployed at the\
    \ `http://app.*` or `http://api.*` subdomains.\n\nOne way to make a different\
    \ domain deployment work is to overcome the same-domain limitation of AJAX technology\
    \ with `JSONP`:\n\n```\n1 var request = $.ajax({\n2   url: url,\n3   dataType:\
    \ \"jsonp\",\n4   data: {...},\n5   jsonpCallback: \"fetchData\",\n6   type: \"\
    GET\" \n7 });\n```\n\nThe other, and better, way to do it is to add the `OPTIONS`\
    \ method, and special headers, which are called `CORS`, to the `Node.js` server\
    \ app before the output:\n\n```javascript\n1   ...\n2   response.writeHead(200,{\n\
    3     'Access-Control-Allow-Origin': origin,\n4     'Content-Type':'text/plain',\n\
    5     'Content-Length':body.length\n6   });\n7   ...\n```\n\nor\n\n```javascript\n\
    1   ...\n2   res.writeHead(200, {\n3     'Access-Control-Allow-Origin', 'your-domain-name',\n\
    4     ...\n5   });\n6   ...\n```\n\nThe need for the `OPTIONS` method is outlined\
    \ in [HTTP access control (CORS)](https://developer.mozilla.org/en-US/docs/HTTP_access_control).\
    \ The `OPTIONS` request can be dealt with in the following manner:\n\n```javascript\n\
    \ 1   ...\n 2   if (request.method==\"OPTIONS\") {\n 3     response.writeHead(\"\
    204\", \"No Content\", {\n 4       \"Access-Control-Allow-Origin\": origin,\n\
    \ 5       \"Access-Control-Allow-Methods\": \n 6         \"GET, POST, PUT, DELETE,\
    \ OPTIONS\",\n 7       \"Access-Control-Allow-Headers\": \"content-type, accept\"\
    ,\n 8       \"Access-Control-Max-Age\": 10, // Seconds.\n 9       \"Content-Length\"\
    : 0\n10     });            \n11     response.end();\n12   };\n13   ...\n```\n\n\
    ## 7.2 Changing Endpoints\n\nOur front-end application used `Parse.com` as a replacement\
    \ for a back-end application. Now we can switch to our own back-end replacing\
    \ the endpoints (yes, it’s that painless!). The front-end app source code is in\
    \ the [rpjs/board](https://github.com/azat-co/rpjs/tree/master/board) GitHub folder.\n\
    \nIn the beginning of the `app.js` file, uncomment the first line for running\
    \ locally, or replace the `URL` values with your Heroku or Windows Azure back-end\
    \ application public URLs:\n\n```javascript\n1 // var URL = \"http://localhost:5000/\"\
    ;\n2 var URL =\"http://your-app-name.herokuapp.com/\"; \n```\n\nAs you can see,\
    \ most of the code in `app.js` and the folder structure remained intact with the\
    \ exception of replacing `Parse.com` models and collections with original `Backbone.js`\
    \ ones:\n\n```javascript\n1 Message = Backbone.Model.extend({\n2   url: URL +\
    \ \"messages/create.json\"\n3 })\n4 MessageBoard = Backbone.Collection.extend\
    \ ({\n5   model: Message,\n6   url: URL + \"messages/list.json\"\n7 });\n```\n\
    \nThose are the places where `Backbone.js` looks up for REST API URLs corresponding\
    \ to the specific collection and model.\n\nHere is the full source code of the\
    \ [rpjs/board/app.js](https://github.com/azat-co/rpjs/blob/master/board/app.js)\
    \ file:\n\n```javascript\n 1 /*\n  2 Rapid Prototyping with JS is a JavaScript\
    \ \n  3 and Node.js book that will teach you how to \n  4 build mobile and web\
    \ apps fast. — Read more at\n  5 http://rapidprototypingwithjs.com.\n  6 */\n\
    \  7 \n  8 // var URL = \"http://localhost:5000/\";\n  9 var URL = \"http://your-app-name.herokuapp.com/\"\
    ;\n 10 \n 11 require([\n 12   'libs/text!header.html',\n 13   'libs/text!home.html',\n\
    \ 14   'libs/text!footer.html'],\n 15 \n 16 function(\n 17 headerTpl,\n 18 homeTpl,\n\
    \ 19 footerTpl) {\n 20 \n 21   var ApplicationRouter = Backbone.Router.extend({\n\
    \ 22     routes: {\n 23       \"\": \"home\",\n 24       \"*actions\": \"home\"\
    \n 25     },\n 26     initialize: function() {\n 27       this.headerView = new\
    \ HeaderView();\n 28       this.headerView.render();\n 29       this.footerView\
    \ = new FooterView();\n 30       this.footerView.render();\n 31     },\n 32  \
    \   home: function() {\n 33       this.homeView = new HomeView();\n 34       this.homeView.render();\n\
    \ 35     }\n 36   });\n 37 \n 38   HeaderView = Backbone.View.extend({\n 39  \
    \   el: \"#header\",\n 40     templateFileName: \"header.html\",\n 41     template:\
    \ headerTpl,\n 42     initialize: function() {},\n 43     render: function() {\n\
    \ 44       $(this.el).html(_.template(this.template));\n 45     }\n 46   });\n\
    \ 47 \n 48   FooterView = Backbone.View.extend({\n 49     el: \"#footer\",\n 50\
    \     template: footerTpl,\n 51     render: function() {\n 52       this.el.html(_.template(this.template));\n\
    \ 53     }\n 54   });\n 55   Message = Backbone.Model.extend({\n 56     url: URL\
    \ + \"messages/create.json\"\n 57   })\n 58   MessageBoard = Backbone.Collection.extend({\n\
    \ 59     model: Message,\n 60     url: URL + \"messages/list.json\"\n 61   });\n\
    \ 62 \n 63   HomeView = Backbone.View.extend({\n 64     el: \"#content\",\n 65\
    \     template: homeTpl,\n 66     events: {\n 67       click #send\": \"saveMessage\"\
    \n 68     },\n 69 \n 70     initialize: function() {\n 71       this.collection\
    \ = new MessageBoard();\n 72       this.collection.bind(\"all\", this.render,\
    \ this);\n 73       this.collection.fetch();\n 74       this.collection.on(\"\
    add\", function(message) {\n 75         message.save(null, {\n 76           success:\
    \ function(message) {\n 77             console.log('saved ' + message);\n 78 \
    \          },\n 79           error: function(message) {\n 80             console.log('error');\n\
    \ 81           }\n 82         });\n 83         console.log('saved' + message);\n\
    \ 84       })\n 85     },\n 86     saveMessage: function() {\n 87       var newMessageForm\
    \ = $(\"#new-message\");\n 88       var username = newMessageForm.find('[name=\"\
    username\"]')\n 89         .attr('value');\n 90       var message = newMessageForm.find('[name=\"\
    message\"]')\n 91         .attr('value');\n 92       this.collection.add({\n 93\
    \         \"username\": username,\n 94         \"message\": message\n 95     \
    \  });\n 96     },\n 97     render: function() {\n 98       console.log(this.collection)\n\
    \ 99       $(this.el).html(_.template(\n 100         this.template, \n 101   \
    \      this.collection\n 102       ));\n 103     }\n 104   });\n 105 \n 106  \
    \ app = new ApplicationRouter();\n 107   Backbone.history.start();\n 108 });\n\
    ```\n\n## 7.3 Chat Application\n\nThe back-end Node.js application source code\
    \ is in the [rpjs/node](https://github.com/azat-co/rpjs/tree/master/node) GitHub\
    \ folder, which has this structure:\n\n```\n1 /node\n2 \t-web.js\n3 \t-Procfile\n\
    4 \t-package.json\n```\n\nHere is a source code of web.js, our Node.js application\
    \ implemented with CORS headers:\n"
