    \ operator `||` and assign a local host and port if environment variables are\
    \ undefined:\n\n```\n1 var port = process.env.PORT || 1337;\n2 var dbConnUrl =\
    \ process.env.MONGOHQ_URL || \n3   'mongodb://@127.0.0.1:27017';\n```\n\nHere\
    \ is out updated cross-environment ready `db.js` file:\n\n```\n 1 var url = require('url')\n\
    \ 2 var util = require('util');\n3 var mongodb = require ('mongodb');\n4 var Db\
