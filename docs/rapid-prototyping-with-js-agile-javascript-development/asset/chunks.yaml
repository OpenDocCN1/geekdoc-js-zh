    \ tests we can use the `$ mocha express.test.js` command.\n\n#### 8.7.2 Dependencies\n\
    \nIn this tutorial we’ll utilize [Mongoskin](https://github.com/kissjs/node-mongoskin),\
    \ a MongoDB library which is a better alternative to the plain good old [native\
    \ MongoDB driver for Node.js](https://github.com/mongodb/node-mongodb-native).\
    \ In additition Mongoskin is more light-weight than Mongoose and schema-less.\
    \ For more insight please check out [Mongoskin comparison blurb](https://github.com/kissjs/node-mongoskin#comparation).\n\
    \n[Express.js](http://expressjs.com/) is a wrapper for the core Node.js [HTTP\
    \ module](http://nodejs.org/api/http.html) objects. The Express.js framework is\
    \ build on top of [Connect](https://github.com/senchalabs/connect) middleware\
    \ and provided tons of convenience. Some people compare the framework to Ruby’s\
    \ Sinatra in terms of how it’s non-opinionated and configurable.\n\nIf you’ve\
