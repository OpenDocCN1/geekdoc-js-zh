    4       //在此处设置模型\n5       this.model = new Model();\n6     },\n7   ...\n```\n\
    \n太棒了，我们有了 `initialize` 函数。现在我们需要创建一个代表单个苹果的模型并设置事件监听器。我们将使用两种类型的事件：`change` 和\
