  trans: "\n\n### 3.10 部署到 Windows Azure\n\n你应该能够使用 Git 部署到 Windows Azure。\n\n1. 访问\
    \ Windows Azure 门户 `[`windows.azure.com/`](https://windows.azure.com/)`，使用你的 Live\
    \ ID 登录，如果还没有创建网站站点，请创建一个。通过提供用户名和密码来启用“设置 Git 发布”（这些信息应与你的 Live ID 凭据不同）。将你的\
    \ URL 复制到某处。\n\n2. 在想要发布或部署的项目文件夹中创建一个本地 Git 仓库：\n\n```\n1  $ git init\n```\n\n\
    3. 将所有文件添加到仓库并开始跟踪它们：\n\n```\n1  $ git add .\n```\n\n4. 提交首次提交：\n\n```\n1  $ git\
    \ commit -am \"initial commit\"\n```\n\n5. 将 Windows Azure 添加为远程 Git 仓库目标：\n\n\
    ```\n1  $ git remote add azure your-url-for-remote-repository\n```\n\n在我的情况下，该命令看起来像这样：\n\
    \n```\n1  $ git remote add \n```\n\n```\n1  > azure https://azatazure@azat.scm.azurewebsites.net/azat.git\n\
    ```\n\n6. 将你的本地 Git 仓库推送到远程 Windows Azure 仓库，这将部署文件和应用程序：\n\n```\n1  $ git push\
    \ azure master\n```\n\n与 GitHub 一样，当你以后更新文件时不需要重复前几个步骤，因为我们已经在项目文件夹根目录下以 `.git`\
    \ 文件夹的形式拥有本地 Git 仓库。\n\n### 3.11 部署到 Heroku\n\n唯一的主要区别是 Heroku 使用 Cedar Stack，它不支持静态项目，即纯\
    \ HTML 应用（例如我们的 Parse.com 测试应用程序或 Parse.com 版本的 Chat 应用程序）。我们可以使用一个“伪”PHP 项目来绕过这个限制。在项目文件夹中与\
    \ `index.html` 同级目录下创建一个 `index.php` 文件，内容如下：\n\n```\n1 <?php echo file_get_contents('index.html');\
    \ ?>\n```\n\n为了方便起见，`index.php` 文件已经包含在 `rpjs/rest` 中。\n\n在 Heroku 上使用 Cedar stack\
    \ 发布静态文件还有一种更简单的方法，这在文章 `[Static Sites on Heroku Cedar](http://kennethreitz.com/static-sites-on-heroku-cedar.html)`\
    \ 中有所描述。为了让 Cedar Stack 支持你的静态文件，你只需要在项目文件夹中输入并执行以下命令：\n\n```\n1 $ touch index.php\n\
    2 $ echo 'php_flag engine off' > .htaccess\n```\n\n或者，你也可以使用 Ruby Bamboo stack。在这种情况下，我们需要如下结构：\n\
    \n```\n1 -project folder\n2   -config.ru\n3   /public\n4     -index.html\n5  \
    \   -/css\n6     app.js\n7     ...\n```\n\n`index.html` 中指向 CSS 和其他资源的路径应该是相对路径的，例如‘css/style.css’。`config.ru`\
    \ 文件应该包含以下代码：\n\n```\n 1 use Rack::Static, \n 2   :urls => [\"/stylesheets\",\
    \ \"/images\"],\n 3   :root => \"public\"\n 4 \n 5 run lambda { |env|\n 6   [\n\
    \ 7     200, \n 8     {\n 9       'Content-Type'  => 'text/html', \n10       'Cache-Control'\
    \ => 'public, max-age=86400' \n11     },\n12     File.open('public/index.html',\
    \ File::RDONLY)\n13   ]\n14 }\n```\n\n更多详细信息，你可以参考 `[devcenter.heroku.com/articles/static-sites-on-heroku](https://devcenter.heroku.com/articles/static-sites-on-heroku)`。\n\
    \n一旦你准备了 Cedar stack 或 Bamboo 的所有支持文件，请按照以下步骤操作：\n\n1. 如果还没有，请创建一个本地 Git 仓库和 `.git`\
    \ 文件夹：\n\n```\n1  $ git init\n```\n\n2. 添加文件：\n\n```\n1  $ git add .\n```\n\n\
    3. 提交文件和更改：\n\n```\n1  $ git commit -m \"my first commit\"\n```\n\n4. 创建 Heroku\
    \ Cedar stack 应用程序并添加远程目标：\n\n```\n1  $ heroku create\n```\n\n如果一切顺利，它应该提示你远程已添加且应用已创建，并给你应用名称。\n\
    \n5. 查看远程类型并执行（可选）：\n\n```\n1  $ git remote show\n```\n\n6. 将代码推送到 Heroku：\n\n\
    ```\n1  $ git push heroku master\n```\n\n终端日志应该会告诉你部署是否顺利\n\n7. 要要在你的默认浏览器中打开应用，输入：\n\
    \n```\n1  $ heroku open\n```\n\n或者直接访问你的应用 URL，类似于“http://yourappname-NNNN.herokuapp.com”。\n\
    \n8. 要查看此应用的 Heroku 日志，输入：\n\n```\n1  $ heroku logs\n```\n\n要更新应用，请重复以下步骤：\n\n\
    ```\n1 git add -A\n2 git commit -m \"update\"\n3 git push heroku master\n```\n\
    \n## 4.js 简介\n\n### 3.12 更新与删除\n\n总结：我们将使用 Backbone.js 和模型-视图-控制器 (MVC) 架构构建一个典型的应用程序。\n\
    \n“Hello World”的源码可以在 `[github.com/azat-co/rpjs/backbone-world](https://github.com/azat-co/rpjs/backbone-world)`\
    \ 获取。\n\n#### 4.1 依赖\n\n下载以下库：\n\n* [`jQuery 1.9](http://code.jquery.com/jquery-1.9.0/)\n\
    * [`Underscore.js](http://underscorejs.org/)\n* [`Backbone.js](http://backbonejs.org/)\n\
    \n并如下在 `index.html` 文件中引入这些框架：\n\n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n\
    \ 4   <script src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"\
    ></script>\n 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script>\n 9\
    \     //TODO 写一些 JS 代码!（编写一些 JS 代码！）\n10   </script>\n 11 \n12 </head>\n13 <body>\n\
    14 </body>\n15 </html>\n```\n\n### 4.1 从零开始设置 Backbone.js\n\n让我们在 `<script>` 标签内部定义一个简单的\
    \ Backbone.js Router：\n\n```\n1   ...\n2   var router = Backbone.Router.extend({\n\
    3   });\n4   ...\n```\n\n然后在 `extend` 调用中设置一个特殊的 `routes` 属性：\n\n```\n1   var\
    \ router = Backbone.Router.extend({\n2     routes: {\n3     }\n4   });\n```\n\n\
    Backbone.js 的 `routes` 属性需要遵循以下格式：`'path/:param':'action'`，这将导致 `filename#path/param`\
    \ URL 触发 Router 对象中名为 **action** 的函数。现在，我们添加一个的 **home** 路由：\n\n```\n1   var router\
