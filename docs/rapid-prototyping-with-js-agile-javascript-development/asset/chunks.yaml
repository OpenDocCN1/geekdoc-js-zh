  trans: "\n\n*   HTML5 应用由 HTML、CSS 和 JavaScript 组成，通常使用 [Sencha Touch](http://www.sencha.com/products/touch/)、[Trigger.io](https://trigger.io/)、[JO](http://joapp.com/)\
    \ 等框架构建，然后使用 [PhoneGap](http://phonegap.com/) 封装成原生应用\n\n## 1.1.2 超文本标记语言\n\n\
    超文本标记语言（或 `HTML`）本身并不是一种编程语言。它是一组标记标签，用于描述内容并以结构化和格式化的方式呈现。HTML 标签由尖括号（`<>`）内部的\
    \ `tag name` 组成。大多数情况下，标签包围内容，结束标签在标签名称前有一个 `forward slash`（正斜杠）。\n\n在这个示例中，每行都是一个\
    \ HTML 元素：\n\n```\n1 <h2>HTML 概览</h2>\n2 <div>HTML 是一个 ...</div>\n3 <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\" />\n```\n\n一个 一个 HTML 文档本身是\
    \ `html` 标签的一个元素，所有其他元素都是该 `html` 标签的子元素：\n\n```\n 1 <!DOCTYPE html>\n 2 <html\
    \ lang=\"en\">\n 3   <head>\n 4     <link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"style.css\" />\n 5   </head>\n 6   <body>\n 7     <h2>HTML 概览</h2>\n\
    \ 8     <p>HTML 是一个 ...</p>\n 9   </body>\n10 </html>\n```\n\nHTML 有不同的种类和版本，例如\
    \ DHTML、XHTML 1.0、XHTML 1.1、XHTML 2、HTML 4、HTML 5。这篇文章很好地解释了这些差异——[误解标记：XHTML\
    \ 2/HTML 5 漫画](http://coding.smashingmagazine.com/2009/07/29/misunderstanding-markup-xhtml-2-comic-strip/)。\n\
    \n任何 HTML 元素都可以拥有属性。其中最重要的有：`class`、`id`、`style`、`data-name`、`onclick` 以及其他事件属性。\n\
    \n### class\n\nClass 属性定义了一个用于 CSS 样式设置或 DOM 操作的类，例如：\n\n```\n1 <p class=\"normal\"\
    >...</p>\n```\n\n### id\n\nId 属性定义了一个 ID，其目的与元素类相似，但必须是唯一的，例如：\n\n```\n1 <div\
    \ id=\"footer\">...</div>\n```\n\n### style\n\nStyle 属性定义了内联 CSS 来样式化元素，例如：\n\n\
    ```\n1 <font style=\"font-size:20px\">...</font>\n```\n\n### title\n\nTitle 属性指定了额外信息，这些信息通常由大多数浏览器在工具提示中显示，例如：\n\
    \n```\n1 <a title=\"对答案点赞\">...</a>\n```\n\n### data-name\n\nData-name 属性允许在 DOM\
    \ 中存储元数据，例如：\n\n```\n1 <tr data-token=\"fa10a70c-21ca-4e73-aaf5-d889c7263a0e\"\
    >...</tr>\n```\n\n### onclick\n\nOnclick 属性在点击事件发生时调用内联 JavaScript 代码，例如：\n\n\
    ```\n1 <input type=\"button\" onclick=\"validateForm();\">...</a>\n```\n\n###\
    \ onmouseover\n\nOnmouseover 属性与 `onclick` 类似，但用于鼠标悬停事件，例如：\n\n```\n1 <a onmouseover=\"\
    javascript: this.setAttribute('css','color:red')\">...</a>\n```\n\n其他用于内联 JavaScript\
    \ 代码的 HTML 元素属性有：\n\n*   `onfocus`: 当浏览器聚焦于元素时\n*   `onblur`: 当浏览器焦点离开元素时\n* \
    \  `onkeydown`: 当用户按下键盘键时\n*   `ondblclick`: 当用户双击鼠标时\n*   `onmousedown`: 当用户按下鼠标按钮时\n\
    *   `onmouseup`: 当用户释放鼠标按钮时\n*   `onmouseout`: 当用户鼠标移出元素区域时\n*   `oncontextmenu`:\
    \ 当用户弹出菜单时\n\n此类事件的完整列表和浏览器兼容表可以在[事件兼容性表](http://www.quirksmode.org/dom/events/index.html)。\n\
    \n我们将在 Twitter Bootstrap 框架中大量使用类（classes），而使用内联 CSS 和 JavaScript 代码通常是一个坏主意，因此我们将尝试避免这样做。然而，了解\
    \ JavaScript 事件的名称是有好处的，因为它们在 jQuery、Backbone.js 以及当然原生 JavaScript 中随处可见。要将属性列表转换为\
    \ JS 事件列表，只需删除前缀 `on`，例如 `onclick` 属性意味着 `click` 事件。\n\n更多信息请访问 [示例：捕获鼠标点击](https://developer.mozilla.org/en-US/docs/JavaScript/Getting_Started#Example:_Catching_a_mouse_click)、[Wikipedia](http://en.wikipedia.org/wiki/HTML)\
    \ 和 [w3schools](http://www.w3schools.com/html/html_intro.asp)。\n\n## 1.1.3 层叠样式表\n\
    \n层叠样式表（或 CSS）是一种格式化和呈现内容的方法。HTML 文档可以通过 `link` 标签包含外部样式表（如之前的示例所示），也可以直接在 `style`\
    \ 标签中包含 CSS 代码：\n\n```\n1 <style>\n2   body {\n 3     padding:60px; /* 简单的内边距\
    \ */\n 4   }\n 5 </style>\n```\n\nCSS 是 CSS 的升级，包含了新的方法，如圆角、边框和渐变。\n\n## 1.1.4\
    \ JavaScript\n\nJavaScript 始于 1995 年的 Netscape，最初名为 LiveScript。它与 Java 的关系就像仓鼠和火腿（ham）的关系一样。如今，JavaScript\
    \ 同时用于客户端和服务器端，也用于桌面应用程序。\n\n将 JS 代码放入 `script` 标签中是在 HTML 文档中使用 JavaScript 最简单的方法：\n\
    \n```\n1 <script>\n2   alert(\"Hello world!\");\n3   // 简单的警窗窗口\n4 </script>\n\
    ```\n\n请注意，将 HTML 和 JS 代码混合不是好主意，因此为了将它们分离，我们可以将代码移动到外部文件中，并通过设置 `script` 标签上的源属性\
    \ `src` 来包含它，例如：\n\n```\n<script src=\"js/app.js\"></script>\n```\n\n即使对于像这样包含外部源的空元素，闭合标签\
    \ `</script>` 也是强制性的。由于 JavaScript 的主导地位，`Type` 和 `language` 属性多年来在现代浏览器中已变为可选。\n\
    \n运行 JavaScript 的其他方法包括：\n\n*   上文已介绍的内联方法\n*   WebKit 浏览器开发者工具和 FireBug 控制台\n\
    *   交互式 Node.js 终端\n\nJavaScript 语言的优点之一是它是松类型的。这种松/弱类型（与 C 和 Java 等语言中的[强类型](http://en.wikipedia.org/wiki/Strong_typing)相比）使得\
    \ JavaScript 成为更好的原型设计语言。以下是一些主要的 JavaScript 对象/类类型（它们上并不是真正的类；对象继承自对象）：\n\n**Number\
    \ 原生类型**\n\n数值，例如：\n\n```\nvar num = 1;\n```\n\n**Number 对象**\n\n[Number](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Number)\
    \ 对象及其方法，例如：\n\n"
- fmt: "\n```\n1 var numObj = new Number(\"123\"); //Number object\n2 var num = numObj.valueOf();\
    \ //number primitive\n3 var numStr = numObj.toString(); //string representation\n\
    ```\n\n### String primitives\n\nSequences of characters inside of single or double\
    \ quotes, e.g.:\n\n```\n1 var str = \"some string\";\n2 var newStr = \"abcde\"\
    .substr(1,2);\n```\n\nFor convenience, JS automatically wraps string primitives\
    \ with `String` object methods, but [they are not quite the same](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/String#Distinction_between_string_primitives_and_String_objects).\n\
    \n### String object\n\nString object has a lot of useful methods, like `length`,\
    \ `match`, etc., for example:\n\n```\n1 var strObj = new String(\"abcde\");//String\
    \ object\n2 var str = strObj.valueOf(); //string primitive\n3 strObj.match(/ab/);\n\
    4 str.match(/ab/); //both call will work\n```\n\n### RegExp object\n\nRegular\
    \ Expressions or `RegExps` are patterns of characters used in finding matches,\
    \ replacing, testing of strings:\n\n```\n1 var pattern = /[A-Z]+/;\n2 str.match(/ab/);\
    \ \n```\n\n### Special Types\n\nWhen in doubt, you can always call `typeof obj`.\
    \ Here are some of the special types used in JS:\n\n* `NaN`\n* `null`\n* `undefined`\n\
    * `function`\n\n### Globals\n\nYou can call these methods from anywhere in your\
    \ code, because they are global methods:\n\n* `decodeURI`\n* `decodeURIComponent`\n\
    * `encodeURI`\n* `encodeURIComponent`\n* `eval`\n* `isFinite`\n* `isNaN`\n* `parseFloat`\n\
    * `parseInt`\n* `uneval`\n* `Infinity`\n* `Intl`\n\n### JSON\n\n`JSON` library\
    \ allows us to parse and serialize JavaScript objects, e.g.:\n\n```\n1 var obj\
    \ = JSON.parse('{a:1, b:\"hi\"}');\n2 var stringObj = JSON.stringify({a:1,b:\"\
    hi\"});\n```\n\n### Array object\n\n[Arrays](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array)\
    \ are zero-index-based lists. For example, to create an array:\n\n```\n1 var arr\
    \ = new Array();\n2 var arr = [\"apple\", \"orange\", 'kiwi\"];\n```\n\nThe `Array`\
    \ object has a lot of nice methods, like `indexOf`, `slice`, `join`. Make sure\
    \ that you’re familiar with them, because if used correctly, they’ll save a lot\
    \ of time.\n\n### Data Object\n\n```\n1 var obj = {name: \"Gala\", url:\"img/gala100x100.jpg\"\
    ,price:129}\n```\n\nor\n\n```\n1 var obj = new Object();\n```\n\nMore on inheritance\
    \ patterns below.\n\n### Boolean primitives and objects\n\nSame as with String\
    \ and Number, [Boolean](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Boolean)\
    \ can be a primitive and an object.\n\n```\n1 var bool1 = true;\n2 var bool2 =\
    \ false;\n3 var boolObj = new Boolean(false);\n```\n\n### Date object\n\n[Date](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Date)\
    \ objects allow us to work with dates and time, e.g.:\n\n```\n1 var timestamp\
    \ = Date.now(); // 1368407802561\n2 var d = new Date(); //Sun May 12 2013 18:17:11\
    \ GMT-0700 (PDT)\n```\n\n### Math object\n\nMathematical constants and [functions](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Math),\
    \ e.g.:\n\n```\n1 var x = Math.floor(3.4890);\n2 var ran = Math.round(Math.random()*100);\n\
    ```\n\n### Browser objects\n\nGives us access to browser and its properties like\
    \ URL, e.g.:\n\n```\n1 window.location.href = 'http://rapidprototypingwithjs.com';\n\
    2 console.log(\"test\");\n```\n\n### DOM objects\n\n```\n1 document.write(\"Hello\
    \ World\");\n2 var table = document.createElement('table');\n3 var main = document.getElementById('main');\n\
    ```\n\n| ![warning](images/leanpub_warning.png) |  \n\n### Warning\n\nJavaScript\
    \ supports numbers only up to 53-bit in size. Check out large numbers’ libraries\
    \ if you need to deal with numbers larger than that. |\n\nThe full references\
    \ of JavaScript and DOM objects are available at [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/JavaScript/Reference)\
    \ and [w3school](http://www.w3schools.com/jsref/default.asp).\n\nFor JS resources\
    \ such as ECMA specs, check out this list [JavaScript Language Resources](https://developer.mozilla.org/en-US/docs/JavaScript/Language_Resources).\
    \ As of this writing, the latest JavaScript specification is ECMA-262 Edition\
    \ 5.1: [PDF](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)\
    \ and [HTML](http://www.ecma-international.org/ecma-262/5).\n"
