    \nHere is one of the ways to dynamically create the *div* HTML element using jQuery:\n\
    \n```\n1 $(\"<div>\"); \n```\n\n### 3.9 Pushing to GitHub\n\nTo create a GitHub\
    \ repository, go to [github.com](http://github.com), log in and create a new repository.\
    \ There will be an SSH address; copy it. In your terminal window, navigate to\
    \ the project folder which you would like to push to GitHub.\n\n1.  Create a local\
    \ Git and *.git* folder in the root of the project folder:\n\n    ```\n    1 \
    \ $ git init\n    ```\n\n2.  Add all of the files to the repository and start\
    \ tracking them:\n\n    ```\n    1  $ git add .\n    ```\n\n3.  Make the first\
    \ commit:\n\n    ```\n    1  $ git commit -am \"initial commit\"\n    ```\n\n\
    4.  Add the GitHub remote destination:\n\n    ```\n    1  $ git remote add your-github-repo-ssh-url\n\
    \    ```\n\n    It might look something like this:\n\n    ```\n    1  $ git remote\
    \ add origin git@github.com:azat-co/simple-message-board.git\n    ```\n\n5.  Now\
    \ everything should be set to push your local Git repository to the remote destination\
    \ on GitHub with the following command:\n\n    ```\n    1  $ git push origin master\n\
    \    ```\n\n6.  You should be able to see your files at [github.com](http://github.com)\
    \ under your account and repository.\n\nLater, when you make changes to the file,\
    \ there is no need to repeat all of the steps above. Just execute:\n\n```\n1 \t\
    $ git add .\n2 \t$ git commit -am \"some message\"\n3 \t$ git push origin master\n\
    ```\n\nIf there are no new untracked files which you want to start tracking:\n\
    \n```\n1 \t$ git commit -am \"some message\"\n2 \t$ git push origin master\n```\n\
    \nTo include changes from individual files, run:\n\n```\n1 \t$ git commit filename\
    \ -m \"some message\"\n2 \t$ git push origin master\n```\n\nTo remove a file from\
    \ the Git repository:\n\n```\n1 \t$ git rm filename \n```\n\nFor more Git commands:\n\
    \n```\n1 \t$ git --help\n```\n\nDeploying applications with Windows Azure or Heroku\
    \ is as simple as pushing code/files to GitHub. The last three steps (#4-6) would\
    \ be substituted with a different remote destination (URL) and a different alias."
