    ### 5. Backbone.js 和 Parse.com


    **摘要**：演示了 Backbone.js 与 Parse.com 及其 JavaScript SDK 在修改后的聊天应用中的用法；建议的额外功能列表。


    > “Java 之于 JavaScript 就像汽车之于毯。” —— [Chris Heilmann](http://christianheilmann.com/)


    如果你编写过一些复杂的客户端应用，可能会发现维护 JavaScript 回调和 UI 事件的混乱代码是非常挑战性的。Backbone.js 提供了一种轻量且强大的方法，可以将你的逻辑组织成模型-视图-控制器（MVC）类型的结构。它还具有
    URL 路由、REST API 支持、事件监听器和触发器等非常棒的功能。有关更多信息以及从零构建 Backbone.js 应用的逐步示例，请参阅 *Intro
    to Backbone.js* 章节。


