  trans: "\n\n[Express.js](http://expressjs.com) 是一个流行的 node 框架，它使用中间件概念来增强应用程序的功能。[Derby](http://derbyjs.com)\
    \ 是一个新的复杂的模型-视图-控制器 ([MVC](http://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller))\
    \ 框架，设计用于配合 [Express](http://expressjs.com) 作为其中间件使用。Derby 还带有对 [Racer](https://github.com/codeparty/racer)\
    \ 数据同步引擎以及类似于 handlebars 的模板引擎的支持。\n\n## 安装 Derby\n\n让我们在不使用脚手架工具的情况下搭建一个基本的 Derby\
    \ 应用程序架构。通常，当人们刚开始学习一个新的全面的框架时，项目生成器会让他们感到困惑。这是一个最基础的“Hello World”应用程序教程，它仍然展示了\
    \ Derby 的骨架，并演示了带有 websocket 的实时模板（live-templates）。\n\n当然，我们需要 [Node.js](http://nodejs.org)\
    \ 和 [NPM](http://npmjs.org)，它们可以在 [nodejs.org](http://nodejs.org) 获取。全局安装 Derby，运行：\n\
    \n```\n1 $ npm install -g derby\n```\n\n检查安装情况：\n\n```\n1 $ derby -V\n```\n\n\
    我的版本（截至 2013 年 4 月）是 `0.3.15`。我们已经准备好创建我们的第一个应用了！\n\n## 文件结构\n\n这是项目的文件夹结构：\n\n\
    ```\n1 project/\n2   -package.json\n3   -index.js\n4   -derby-app.js\n5   views/\n\
    6     derby-app.html\n7   styles/\n8     derby-app.less\n```\n\n## 依赖项\n\n在 `package.json`\
    \ 文件中包含依赖和其他基本信息：\n\n```\n 1  {\n 2   \"name\": \"DerbyTutorial\",\n 3   \"description\"\
    : \"\",\n 4   \"version\": \"0.0.0\",\n 5   \"main\": \"./server.js\",\n 6   \"\
    dependencies\": {\n 7     \"derby\": \"*\",\n 8     \"express\": \"3.x\"\n 9 \
    \  },\n10   \"private\": true\n11 }\n```\n\n现在我们可以运行 `npm install`，这将我们的依赖项下载到\
    \ `node_modules` 文件夹中。\n\n## 视图\n\n视图必须位于 `views` 文件夹中，并且必须位于与你的 derby app JavaScript\
    \ 文件同名的文件夹下的 `index.html`（即 `views/derby-app/index.html`），或者位于与你的 derby app JS\
    \ 文件同名的文件中（即 `derby-app.html`）。\n\n在示例“Hello World”应用中，我们将使用 `<Body:>` 模板和 `{message}`\
    \ 变量。Derby 使用类似于 mustache 的语法进行响应式绑定。`index.html` 如下：\n\n```\n1 <Body:>\n2   <input\
    \ value=\"{message}\"><h1>{message}</h1>\n```\n\nStylus/LESS 文件也是如此；在我们的示例中，`index.css`\
    \ 只有一行：\n\n```\n1 h1 {\n2   color: blue;\n3 }\n```\n\n要了解更多关于这些优秀的 CSS 预处理器，请查看\
    \ [Stylus](http://learnboost.github.io/stylus/) 和 [LESS](http://lesscss.org/)\
    \ 的文档。\n\n## 主服务器\n\n`index.js` 是我们的主服务器文件，我们通过 `require()` 函数包含依赖项来启动它：\n\n```\n\
    1 var http = require('http'),\n2   express = require('express'),\n3   derby =\
    \ require('derby'),\n4   derbyApp = require('./derby-app');\n```\n\n最后一行是我们的 derby\
    \ 应用程序文件 `derby-app.js`。\n\n现在我们正在创建 Express.js 应用程序（v3.x 与 2.x 有显著差异）和 HTTP 服务器：\n\
    \n```\n1 var expressApp = new express(),\n2   server = http.createServer(expressApp);\n\
    ```\n\n[Derby](http://derbyjs.com) 使用 [Racer](https://github.com/codeparty/racer)\
    \ 数据同步库，我们这样创建它：\n\n```\n1 var store = derby.createStore({\n2   listen: server\n\
    3 });\n```\n\n为了从后端获取一些数据到前端，我们实例化模型对象：\n\n```\n1 var model = store.createModel();\n\
    ```\n\n重要的是我们需要将模型和路由作为中间件传递给 Express.js 应用。我们需要暴露 public 文件夹以便让 socket.io 正常工作。\n\
    \n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n3   use(express.static(__dirname\
    \ + '/public')).\n4   use(derbyApp.router()).\n5   use(expressApp.router);\n```\n\
    \n现在我们可以在端口 3001（或其他任何端口）上启动服务器：\n\n```\n1 server.listen(3001, function(){\n2\
    \   model.set('message', 'Hello World!');\n3 });\n```\n\n`index.js` 的完整代码：\n\n\
    ```\n1 var http = require('http'),\n2   express = require('express'),\n3   derby\
    \ = require('derby'),\n4   derbyApp = require('./derby-app');\n5 \n6 var expressApp\
    \ = new express(),\n7   server = http.createServer(expressApp);\n8 \n9 var store\
    \ = derby.createStore({\n10   listen: server\n11 });\n12 \n13 var model = store.createModel();\n\
    14 \n15 expressApp.\n16   use(store.modelMiddleware()).\n17   use(express.static(__dirname\
    \ + '/public')).\n18   use(derbyApp.router()).\n19   use(expressApp.router);\n\
    20 \n21 server.listen(3001, function(){\n22   model.set('message', 'Hello World!');\n\
    23 });\n```\n\n## Derby 应用\n\n[Derby](http://derbyjs.com) 使用 [Racer](https://github.com/codeparty/racer)\
    \ 数据同步库，我们这样创建它：\n\n```\n1 var store = derby.createStore({\n2   listen: server\n\
    3 });\n```\n\n为了从后端获取一些数据到前端，我们实例化模型对象：\n\n```\n1 var model = store.createModel();\n\
    ```\n\n重要的是我们需要将模型和路由作为中间件传递给 Express.js 应用。我们需要暴露 public 文件夹以便让 socket.io 正常工作。\n\
    \n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n3   use(express.static(__dirname\
    \ + '/public')).\n4   use(derbyApp.router()).\n5   use(expressApp.router);\n```\n\
    \n现在我们可以在端口 3001（或其他任何端口）上启动服务器：\n\n```\n1 server.listen(3001, function(){\n2\
    \   model.set('message', 'Hello World!');\n3 });\n```\n\n`derby-app.js` 的完整代码：\n\
    \n```\n1 derby = require('derby'),\n2   app = derby.createApp(module);\n3 \n4\
    \ app.get('/', function(page, model) {\n5   page.render();\n6   });\n7 });\n```\n\
    \n## 启动应用\n\n现在一切都准备就绪了。执行 `node .` 或 `node index.js` 并在浏览器访问 `localhost:3001`。你应该看到：\n\
    \n当然，静态数据不多，所以我们可以稍微修改应用，让前后端进行通信。\n\n在服务器文件 `index.js` 中，添加 `store.afterDb` 来监听\
    \ `message` 属性的事件：\n\n```\n1 server.listen(3001, function(){\n2   model.set('message',\
    \ 'Hello World!');\n3   store.afterDb('set','message', function(txn, doc, prevDoc,\
    \ done){\n4     console.log(txn)\n5     done();\n6   });\n7 });\n```\n\n修改后 `index.js`\
    \ 的完整代码：\n\n```\n1 var http = require('http'),\n2   express = require('express'),\n\
    3   derby = require('derby'),\n4   derbyApp = require('./derby-app');\n5 \n6 var\
    \ expressApp = new express(),\n7   server = http.createServer(expressApp);\n8\
    \ \n9 var store = derby.createStore({\n10   listen: server\n11 });\n12 \n13 var\
    \ model = store.createModel();\n14 \n15 expressApp.\n16   use(store.modelMiddleware()).\n\
    17   use(express.static(__dirname + '/public')).\n18   use(derbyApp.router()).\n\
    19   use(expressApp.router);\n20 \n21 server.listen(3001, function(){\n22   model.set('message',\
    \ 'Hello World!');\n23   store.afterDb('set','message', function(txn, doc, prevDoc,\
    \ done){\n24     console.log(txn)\n25     done();\n26   });\n27 });\n```\n\n"
