  trans: "\n\n3. 在 OS X 上，使用 `Command + Space`（又称为 Spotlight，请看下面的截图）查找终端应用程序。对于 Windows，你可以使用\
    \ [PuTTY](http://www.chiark.greenend.org.uk/~sgtatham/putty/) 或 [Cygwin](http://www.cygwin.com/)。![使用\
    \ Spotlight 查找并运行应用程序。](img/screenshots----spotlight.png)\n\n使用 Spotlight 查找并运行应用程序。\n\
    \n4. 在你的终端中输入以下命令，将 `John Doe` 和 `johndoe@example.com` 替换为你的名字和邮箱：\n\n```\n1 \
    \ $ git config --global user.name \"John Doe\"\t\t\t\t\n2  $ git config --global\
    \ user.email johndoe@example.com \n```\n\n5. 要检查安装情况，运行命令：\n\n```\n1  $ git version\n\
    ```\n\n6. 你应该在终端窗口中看到类似的内容（你的版本可能有所不同；在例子中是 1.8.3.2）：\n\n```\n1  git version 1.8.3.2\n\
    ```\n\n![配置并测试 Git 安装。](img/screenshots----git-configure.png)\n\n配置并测试 Git 安装。\n\
    \n生成 SSH 密钥并上传到 SaaS/PaaS 网站将在稍后介绍。\n\n### 2.1.5 本地 HTTP 服务器\n\n虽然可以在没有本地 HTTP\
    \ 服务器的情况下完成大部分前端开发，但在通过 HTTP 请求/AJAX 调用加载文件时需要它。此外，通常情况下使用本地 HTTP 服务器是一个良好的习惯。这样，你的开发环境就可以尽可能接近生产环境。你可能想要考虑对\
    \ Apache Web 服务器进行以下修改：\n\n* [MAMP](http://www.mamp.info/en/index.html): 适用于 Mac\
    \ OS X 的 Mac、Apache、MySQL、PHP 个人服务器\n* [MAMP Stack](http://bitnami.com/stack/mamp):\
    \ 由 BitNami 构建的包含 PHP、Apache、MySQL 和 phpMyAdmin 栈的 Mac 应用（[Apple App Store](https://itunes.apple.com/es/app/mamp-stack/id571310406?l=en)）\n\
    * [XAMPP](http://www.apachefriends.org/en/xampp.html): 包含 MySQL、PHP 和 Perl 的 Apache\
    \ 分发，适用于 Windows、Mac、Linux 和 Solaris。\n\n![MAMP Mac 主页。](img/screenshots----mamp.png)\n\
    \nMAMP Mac 主页。\n\nMAMP、MAMP Stack 和 XAMPP 拥有直观的图形用户界面 (GUI)，允许你更改配置和 hosts 设置。\n\
    \n| ![information](img/leanpub_information.png) |  \n\n### 注意\n\nNode.js 与许多其他后端技术一样，拥有用于开发的自己的服务器。\
    \ |\n\n### 2.1.6 数据库：MongoDB\n\n以下步骤更适用于基于 Max OS X/Linux 的系统，但通过某些修改也可以用于 Windows\
    \ 系统，即 `$PATH` 变量——第 3 步。下面我们描述了从官方包安装 MongoDB，因为我们发现这种方法更稳健且冲突更少。然而，还有许多[在 Mac\
    \ 上安装它的方法](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x/)，例如使用\
    \ Brew，以及在[其他系统](http://docs.mongodb.org/manual/installation/)上。\n\n1. 可以在 [`www.mongodb.org/downloads`](http://www.mongodb.org/downloads)\
    \ 下载 MongoDB。对于最新的 Apple 笔记本电脑（如 MacBook Air），选择 OS X 64-bit 版本。旧款 Mac 用户应该浏览链接\
    \ [`dl.mongodb.org/dl/osx/i386`](http://dl.mongodb.org/dl/osx/i386)。\n\n| ![tip](img/leanpub_tip.png)\
    \ |  \n\n### 提示\n\n要确定处理器的架构类型，请在命令行输入 `$uname -p`。 |\n\n1. 将包解压到你的 Web 开发文件夹（`~/*Documents/Development*`\
    \ 或其他位置）。如果你愿意，可以将 MongoDB 安装到 `/usr/local/mongodb` 文件夹。\n\n2. **可选**：如果你想在系统的任何地方访问\
    \ MongoDB 命令，你需要将 `mongodb` 路径添加到 `$PATH` 变量中。对于 Mac OS X，使用以下命令打开系统路径文件：\n\n\
    ```\n1  sudo vi /etc/paths\n```\n\n或者，如果你更喜欢使用 TextMate：\n\n```\n1  mate /etc/paths\
    \ \n```\n\n并将此行添加到 `/etc/paths` 文件中：\n\n```\n1  /usr/local/mongodb/bin\n```\n\n\
    3. 创建数据文件夹；默认情况下，MongoDB 使用 `/data/db`。请注意，这在新版本的 MongoDB 中可能会不同。要创建它，请在终端输入并执行以下命令：\n\
    \n```\n1  $ sudo mkdir -p /data/db\n2  $ sudo chown `id -u` /data/db\n```\n\n\
    ![MongoDB 初始化设置：创建数据目录。](img/screenshots----mongodb-data.png)\n\nMongoDB 初始化设置：创建数据目录。\n\
    \n如果你喜欢使用 `/data/db` 以外的路径，可以使用 `--dbpath` 选项对 `mongod`（MongoDB 主服务）进行指定。\n\n\
    4. 进入包含 `bin` 的文件夹。从那里输入以下：\n\n```\n1  $ ./mongod\n```\n\n![启动 MongoDB。](img/screenshots----start.png)\n\
    \n启动 MongoDB。\n\n5. 如果你看到\n\n```\n1  waiting for connections\n```\n\n这意味着服务器正在运行。关闭进程使用\
    \ `control + c`。如果你使用 `control + z`，它会将进程挂起（分离终端窗口）；在这种情况下，你可能会导致文件锁定，并且必须使用 kill\
    \ 命令或活动监视器手动删除锁定文件。在原生终端中使用 `command + .`。\n\n6. 在同一文件夹打开另一个终端并执行：\n\n```\n1 \
    \ $mongo\n```\n\n它应该显示类似的内容（我们使用的是 v0.6，但你的版本可能有所不同）：\n\n7. 然后输入并执行：\n\n```\n\
    1  > db.test.save({ a: 1 })\n2  > db.test.find()\n```\n\n如果你看到记录已保存，说明一切正常：\n\n\
    ![运行 MongoDB 客户端并存储。](img/screenshots----mongodb-console.png)\n\n运行 MongoDB 客户端并存储。\n\
    \n`find` 和 `save` 命令的作用正如你想象的那样。详细说明可以在 MongoDB 找到：[在 OS X 上安装 MongoDB](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x)。对于\
    \ Windows 用户，有一个很好的教程：[http://www.tuanle.com/blog/2011/10/installing/]。\n\n| ![information](img/leanpub_information.png)\
    \ |  \n\n### 注意\n\nMAMP 和 XAMPP 应用程序带有 MySQL——开源传统数据库，以及 phpMyAdmin——MySQL 数据库的网络界面。\
    \ |\n\n| ![information](img/leanpub_information.png) |  \n\n### 注意\n\n在 Max OS\
    \ X（以及大多数 Unix 系统）上，关闭进程使用 `control + c`。使用 `control + z`，它会将进程挂起（分离终端窗口）；在这种情况下，你可能会导致文件锁定，并且必须使用\
    \ kill 命令或活动监视器手动删除锁定文件。在原生终端中使用 `command + .` 是 `control + c` 的替代方案。 |\n\n###\
    \ 2.1.7 其他组件\n\n##### 2.1.7.1 Node.js 安装\n\n可以在 [`nodejs.org/#download`](http://nodejs.org/#download)\
    \ 获取下载（请看下面的截图）。安装非常简单，即下载存档，运行 `*.pkg` 包安装程序。要检查 Node.js 的安装情况，你可以输入并执行：\n\n\
    ```\n1 $ node -v\n```\n\n它应该显示类似的内容（我们使用的是 v0.8.1，但你的版本可能有所不同）：\n\n"
- fmt: "\nNode.js package already includes [Node Package Manager](https://npmjs.org)\
    \ (NPM). We’ll use `NPM` extensively to install Node.js modules.\n\n![Node.js\
    \ home page.](images/screenshots----node.png)\n\nNode.js home page.\n\n## 2.1.7.2\
    \ JS Libraries\n\nFront-end JavaScript libraries are downloaded and unpacked from\
    \ their respective websites. Those files are usually put in Development folder\
    \ (e.g., `~/Documents/Development`) for future use. Oftentimes, there is a choice\
    \ between minified production version (more on that in AMD and Require.js section\
    \ of the *Intro to Backbone.js* chapter) and extensively rich in comments development\
    \ one.\n\nAnother approach is to hot-link these scripts from CDNs such as [Google\
    \ Hosted Libraries](https://developers.google.com/speed/libraries/devguide), [CDNJS](http://cdnjs.com/),\
    \ [Microsoft Ajax Content Delivery Network](http://www.asp.net/ajaxlibrary/cdn.ashx)\
    \ and others. By doing so the apps will be faster for some users, but won’t work\
    \ locally at all without the Internet.\n\n*   `LESS` as a front-end interpreter\
    \ is available at [lesscss.org](http://lesscss.org/) — you could unpack it into\
    \ your development folder (`~/Documents/Development`) or any other.\n*   `Twitter\
    \ Bootstrap` is a CSS/LESS framework. It’s available at [twitter.github.com/bootstrap](http://twitter.github.com/bootstrap/).\n\
    *   `jQuery` is available at [jquery.com](http://jquery.com).\n*   `Backbone.js`\
    \ is available at [backbonejs.org](http://backbonejs.org).\n*   `Underscore.js`\
    \ is available at [underscorejs.org](http://underscorejs.org).\n*   `Require.js`\
    \ is available at [requirejs.org](http://requirejs.org).\n\n## 2.1.7.3 LESS App\n\
    \nThe `LESS App` is a Mac OS X application for “on-the-fly” compilation of LESS\
    \ to CSS. It’s available at [incident57.com/less](http://incident57.com/less/).\n\
    \n![LESS App for Mac home page.](images/screenshots----less.png)\n\nLESS App for\
    \ Mac home page.\n\n## 2.2 Cloud Setup\n\n### 2.2.1 SSH Keys\n\nSSH keys provide\
    \ a secure connection without the need to enter username and password every time.\
    \ For GitHub repositories, the latter approach is used with HTTPS URLs, e.g.,\
    \ `https://github.com/azat-co/rpjs.git`, and the former with SSH URLs, e.g., `git@github.com:azat-co/rpjs.git`.\n\
    \nTo generate SSH keys for GitHub on Mac OS X/Unix machines do the following:\n\
    \n1.  Check for existing SSH keys\n\n    ```\n    1  $ cd ~/.ssh\n    2  $ ls\
    \ -lah\n    ```\n\n2.  If you see some files like `id_rsa` (please refer to the\
    \ screenshot below for an example), you could delete them or backup into a separate\
    \ folder by using following commands:\n\n    ```\n    1  $ mkdir key_backup\n\
    \    2  $ cp id_rsa* key_backup\n    3  $ rm id_rsa*\n    ```\n\n3.  Now we can\
    \ generate a new SSH key pair using the `ssh-keygen` command, assuming we are\
    \ in `~/.ssh` folder:\n\n    ```\n    1  $ ssh-keygen -t rsa -C \"your_email@youremail.com\"\
    \n    ```\n\n4.  Answer the questions; it is better to keep the default name:\
    \ `id_rsa`. Then copy the content of the `id_rsa.pub` file to your clipboard:\n\
    \n    ```\n    1  $ pbcopy < ~/.ssh/id_rsa.pub\n    ```\n\n    ![Generating RSA\
    \ key for SSH and copying public key to clipboard.](images/screenshots----ssh-copy.png)\n\
    \n    Generating RSA key for SSH and copying public key to clipboard.\n\n5.  Or\
    \ alternatively, open `id_rsa.pub` file in the default editor:\n\n    ```\n  \
    \  1  $ open id_rsa.pub\n    ```\n\n6.  Or in TextMate:\n\n    ```\n    1  $ mate\
    \ id_rsa.pub \n    ```\n\n### 2.2.2 GitHub\n\n1.  After you have copied the public\
    \ key, go to [github.com](http://github.com), log in, go to your account settings,\
    \ select “SSH key” and add the new SSH key. Assign a name, e.g., the name of your\
    \ computer, and paste the value of your `public` key.\n\n2.  To check if you have\
    \ an SSH connection to GitHub, type and execute the following command in your\
    \ terminal:\n\n    ```\n    1  $ ssh -T git@github.com\n    ```\n\n    If you\
    \ see something like:\n\n    ```\n    1  Hi your-GitHub-username! You've successfully\
    \ authenticated, \n    2  but GitHub does not provide shell access.\n    ```\n\
    \n    then everything is set up.\n\n3.  While the first time connecting to GitHub,\
    \ you can receive “authenticity of host … can’t be established” warning. Please\
    \ don’t be confused with such a message — just proceed by answering ‘yes’ as shown\
    \ on the screenshot below.\n\n    ![Testing SSH connection to GitHub for the very\
    \ first time.](images/screenshots----github.png)\n\n    Testing SSH connection\
    \ to GitHub for the very first time.\n\n    If for some reason you have a different\
    \ message, please repeat steps 3-4 from the previous section on *SSH Keys*.\n\n\
