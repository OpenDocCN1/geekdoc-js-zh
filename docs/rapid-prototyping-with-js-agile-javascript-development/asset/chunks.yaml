    \ 由 Mozilla Developer Network 提供\n* [JavaScript Reference](https://developer.mozilla.org/en-US/docs/JavaScript/Reference)\
    \ 由 Mozilla Developer Network 提供\n* [Why Use Closure](http://howtonode.org/why-use-closure):\
