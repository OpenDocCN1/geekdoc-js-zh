    56        var p=0;\n57        for (j=i;j<list.length;j++) {\n58          if (counter[list[i]]<counter[list[j]])\
    \ {\n59            p=list[i];\n60            list[i]=list[j];\n61            list[j]=p;\n\
    62            maxC=i;\n63          }\n64        }     \n65      }\n66      //print\
    \ sorted\n67      //print nicely with number of repetition\n68      var str='';\n\
    69      for (i=0; i<list.length; i++){\n70        str+=counter[list[i]]+': '+list[i]+'\\\
    n';\n71      }\n72      $('#log').val(str);\n73      $('#info').html('Analyzed:\
    \ ' + list.length+ \n74        'word(s) form '+m.length + \n75        'tweet(s).');\n\
    76    }\n```\n\nTry launching it and see if it works with or without the local\
    \ HTTP server. **Hint**: It should not work without an HTTP server because of\
    \ its reliance on JSONP technology.\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThis example was built with Twitter API v1.0 and might not\
    \ work with Twitter API v1.1, which requires user authentication for REST API\
    \ calls. You can get the necessary keys at [dev.twitter.com](https://dev.twitter.com).\
    \ If you feel that there must be a working example please submit your feedback\
    \ to hi@rpjs.co. |\n\n### 3.6 Parse.com\n\n[Parse.com](http://parse.com) is a\
    \ service which can be a substitute for a database and a server. It started as\
    \ means to support mobile application development. Nevertheless, with REST API\
    \ and JavaScript SDK, Parse.com can be used in any web, and desktop, applications\
    \ for data storage (and much more), thus making it ideal for rapid prototyping.\n\
    \nGo to Parse.com and sign up for a free account. Create an application, and copy\
    \ the Application ID, REST API Key, and JavaScript Key. We’ll need these keys\
    \ to access our collection at Parse.com. Please note the “Data Browser” tab –\
    \ that’s where you can see you collections and items.\n\nWe’ll create a simple\
    \ application which will save values to the collections using Parse.com JavaScript\
    \ SDK. Our application will consist of an **index.html** file and a **app.js**\
    \ file. Here is the structure of our project folder:\n\n```\n1 /parse\n2   -index.html\n\
    3   -app.js\n```\n\nThe sample is available at the [rpjs/parse](https://github.com/azat-co/rpjs/tree/master/parse)\
    \ folder on GitHub, but you are encouraged to type your own code from scratch.\
    \ To start, create the **index.html** file:\n\n```\n1 <html lang=\"en\">\n2 <head>\n\
    ```\n\nInclude the minified jQuery library from Google CDN:\n\n```\n1   <script\
    \ \n2     type=\"text/javascript\" \n3     src=\n4     \"http://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js\"\
    >\n5   </script>\n```\n\nInclude the Parse.com library from Parse CDN location:\n\
    \n```\n1   <script \n2     src=\"http://www.parsecdn.com/js/parse-1.0.14.min.js\"\
    >\n3   </script> \n```\n\nInclude our **app.js** file:\n\n```\n1   <script type=\"\
    text/javascript\" src=\"app.js\"></script>   \n2 </head>\n3 <body>\n4 <!-- We'll\
    \ do something here -->\n5 </body>\n6 </html>\n```\n\nCreate the **app.js** file\
    \ and use the `$(document).ready` function to make sure that the DOM is ready\
    \ for manipulation:\n\n```\n1 $(document).ready(function() {\n```\n\nChange **parseApplicationId**\
    \ and **parseJavaScriptKey** to values from the Parse.com application dashboard:\n\
    \n```\n1   var parseApplicationId=\"\";\n2   var parseJavaScriptKey=\"\";\n```\n\
    \nSince we’ve included the Parse JavaScript SDK library, we now have access to\
    \ the global object `Parse`. We initialize a connection with the keys, and create\
    \ a reference to a **Test** collection:\n\n```\n1   Parse.initialize(parseApplicationId,\
    \ parseJavaScriptKey);\n2   var Test = Parse.Object.extend(\"Test\");\n3   var\
    \ test = new Test();\n```\n\nThis simple code will save an object with the keys\
    \ **name** and **text** to the Parse.com **Test** collection:\n\n```\n1   test.save({\n\
    2     name: \"John\", \n3     text: \"hi\"}, {\n```\n\nConveniently, the `save()`\
    \ method accepts the callback parameters `success` and `error` just like the `jQuery.ajax()`\
    \ function. To get a confirmation, we’ll just have to look at the browser console:\n\
    \n```\n1     success: function(object) {\n2       console.log(\"Parse.com object\
    \ is saved: \"+object);\n3      //alternatively you could use \n4      //alert(\"\
    Parse.com object is saved\");\n5     },\n```\n\nIt’s important to know why we\
    \ failed to save an object:\n\n```\n1     error: function(object) {\n2       console.log(\"\
    Error! Parse.com object is not saved: \"+object);\n3     }\n4   });\n5 })\n```\n\
    \nThe full source code of **index.html**:\n\n```\n 1 <html lang=\"en\">\n 2 <head>\n\
    \ 3   <script \n 4     type=\"text/javascript\" \n 5     src=\n 6     \"http://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js\"\
    >\n 7   </script>\n 8   <script \n 9     src=\"http://www.parsecdn.com/js/parse-1.0.14.min.js\"\
    >\n10   </script>   \n11   <script type=\"text/javascript\" src=\"app.js\"></script>\
    \   \n12 </head>\n13 <body>\n14 <!-- We'll do something here -->\n15 </body>\n\
    16 </html>\n```\n\nThe full source code of the **app.js** file:"
