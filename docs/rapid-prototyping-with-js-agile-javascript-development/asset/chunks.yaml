    \ 主市场\n\n### 3.4 LESS\n\nLESS 是一种动态样式表语言。有时，在这种情况下，多即是少](https://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less)。\n\
    \n浏览器无法解释 LESS 语法，因此 LESS 源代码必须通过以下三种方式之一编译为 CSS：\n\n1.  在浏览器中通过 [LESS JavaScript\
    \ 库](http://lesscss.googlecode.com/files/less-1.3.0.min.js)\n2.  在服务器端通过语言/框架，例如\
    \ Node.js 有 [LESS 模块](https://npmjs.org/package/less)\n3.  在你的 Mac OS X 本地通过 [LESS\
    \ App](http://incident57.com/less/)、[SimLESS](http://wearekiss.com/simpless) 或类似的应用程序\n\
    \n| ![warning](img/leanpub_warning.png) | |\n| :--- | :--- |\n| 警告 | 选项 1 用于开发环境尚可，但对于生产环境并非最优。\
    \ |\n\n#### 3.4.1 变量变量减少冗余并允许通过一个规范的位置快速更改值。我们知道在设计（和样式）中经常需要更改值！\n\nLESS 拥有变量、混合和运算符，使得开发者能够更快地复用\
    \ CSS 规则。\n\n```\n1 @color: #4D926F;\n2 #header {\n3   color: @color;\n4 }\n5\
    \ h2 {\n6   color: @color;\n7 }\n```\n\n等同于 CSS：\n\n"
- fmt: "\n```css\n1 #header {\n2   color: #4D926F;\n3 }\n4 h2 {\n5   color: #4D926F;\n\
    6 }\n```\n\n### 3.4.2 Mixins\n\nThis is the syntax for mixin, which acts like\
    \ a function:\n\n```less\n 1 .rounded-corners (@radius: 5px) {\n 2   border-radius:\
    \ @radius;\n 3   -webkit-border-radius: @radius;\n 4   -moz-border-radius: @radius;\n\
    \ 5 }\n 6 \n 7 #header {\n 8   .rounded-corners;\n 9 }\n10 #footer {\n11   .rounded-corners(10px);\n\
    12 }\n```\n\nConverts to this in CSS:\n\n```css\n 1 .rounded-corners (@radius:\
    \ 5px) {\n 2   border-radius: @radius;\n 3   -webkit-border-radius: @radius;\n\
    \ 4   -moz-border-radius: @radius;\n 5 }\n 6 \n 7 #header {\n 8   border-radius:\
    \ 5px;\n 9   -webkit-border-radius: 5px;\n10   -moz-border-radius: 5px;\n11 }\n\
    12 #footer {\n13   border-radius: 10px;\n14   -webkit-border-radius: 10px;\n15\
    \   -moz-border-radius: 10px;\n16 }\n```\n\nMixins can be used without parameters,\
    \ or with multiple parameters.\n\n### 3.4.3 Operations\n\nWith operations, we\
    \ can perform math functions on numbers, colors or variables.\n\nExample of an\
    \ operator in LESS:\n\n```less\n 1 @the-border: 1px;\n 2 @base-color: #111;\n\
    \ 3 @red:        #842210;\n 4 \n 5 #header {\n 6   color: @base-color * 3;\n 7\
    \   border-left: @the-border;\n 8   border-right: @the-border * 2;\n 9 }\n10 #footer\
    \ { \n11   color: @base-color + #003300;\n12   border-color: desaturate(@red,\
    \ 10%);\n13 }\n```\n\nThe above code compiles in this CSS:\n\n```css\n 1 @the-border:\
    \ 1px;\n 2 @base-color: #111;\n 3 @red:        #842210;\n 4 \n 5 #header {\n 6\
    \   color: #333333;\n 7   border-left: 1px;\n 8   border-right: 2px;\n 9 }\n10\
    \ #footer { \n11   color: #114411;\n12   border-color: #7d2717;\n13 }\n```\n\n\
    As you can see, LESS dramatically improves the reusability of plain CSS. Here\
    \ are some online tools for compilation:\n\n* [LESS2CSS](http://less2css.org/):\
    \ slick browser-based LESS to CSS converter built on Express.js\n* [lessphp](http://leafo.net/lessphp/):\
    \ online demo compiler\n* [Dopefly](http://www.dopefly.com/LESS-Converter/less-converter.html):\
    \ online LESS converter\n\nOther [LESS features](http://lesscss.org/#docs) include:\n\
    \n* Pattern-matching\n* Nested Rules\n* Functions\n* Namespaces\n* Scope\n* Comments\n\
    * Importing\n\n### 3.5 Example of using third-party API (Twitter) and jQuery\n\
