  trans: "\n\n# 总结：不同部署方法的说明、Chat 应用的最终版本及其部署。\n\n> *“调试比最初编写代码要困难一倍。因此，如果你编写代码时尽可能巧妙，那么从定义上来说，你就不够聪明去调试它。”*\
    \ — [Brian W. Kernighan](http://en.wikipedia.org/wiki/Brian_Kernighan)\n\n现在，如果我们能将前端和后端应用放在一起让它们协同工作，那就好了。有几种实现方法：\n\
    \n*   前端和后端应用使用不同的域名（Heroku 应用）：通过使用 `CORS` 或 `JSONP` 确保没有跨域问题。这种方法将在后文中进行详细介绍。\n\
    *   同域名部署：确保 `Node.js` 处理前端应用程序的静态资源和资产——不建议用于正式的生产环境应用。\n\n## 7.1 不同域名部署\n\n\
    到目前为止，这是生产环境的最佳实践。后端应用通常部署在 `http://app.*` 或 `http://api.*` 子域名下。\n\n实现跨域名部署的一种方法是使用\
    \ `JSONP` 克服 AJAX 技术的同源限制：\n\n```\n1 var request = $.ajax({\n2   url: url,\n3\
    \   dataType: \"jsonp\",\n4   data: {...},\n5   jsonpCallback: \"fetchData\",\n\
    6   type: \"GET\" \n7 });\n```\n\n另一种更好的方法是在输出之前，在 `Node.js` 服务器应用中添加 `OPTIONS`\
    \ 方法和特殊的请求头（这些称为 `CORS`）：\n\n```javascript\n1   ...\n2   response.writeHead(200,{\n\
    3     'Access-Control-Allow-Origin': origin,\n4     'Content-Type':'text/plain',\n\
    5     'Content-Length':body.length\n6   });\n7   ...\n```\n\n或者\n\n```javascript\n\
    1   ...\n2   res.writeHead(200, {\n3     'Access-Control-Allow-Origin', 'your-domain-name',\n\
    4     ...\n5   });\n6   ...\n```\n\n对 `OPTIONS` 方法的需求在 [HTTP 访问控制 (CORS)](https://developer.mozilla.org/en-US/docs/HTTP_access_control)\
    \ 中有所概述。`OPTIONS` 请求可以按照以下方式处理：\n\n```javascript\n 1   ...\n 2   if (request.method==\"\
    OPTIONS\") {\n 3     response.writeHead(\"204\", \"No Content\", {\n 4       \"\
    Access-Control-Allow-Origin\": origin,\n 5       \"Access-Control-Allow-Methods\"\
    : \n 6         \"GET, POST, PUT, DELETE, OPTIONS\",\n 7       \"Access-Control-Allow-Headers\"\
    : \"content-type, accept\",\n 8       \"Access-Control-Max-Age\": 10, // 秒。\n\
    \ 9       \"Content-Length\": 0\n10     });            \n11     response.end();\n\
    12   };\n13   ...\n```\n\n## 7.2 更改端点\n\n我们的前端应用之前使用 `Parse.com` 作为后端应用。现在我们可以切换到自己的后端（是的，这非常简单！）。前端应用的源码位于\
    \ [rpjs/board](https://github.com/azat-co/rpjs/tree/master/board) GitHub 文件夹中。\n\
    \n在 `app.js` 开头，取消第一行的注释以便在本地运行，或者将 `URL` 值替换为 Heroku 或 Windows Azure 后端应用的公共\
    \ URL：\n\n```javascript\n1 // var URL = \"http://localhost:5000/\";\n2 var URL\
    \ =\"http://your-app-name.herokuapp.com/\"; \n```\n\n如所示，`app.js` 中的大部分代码和文件夹结构保持完好，除了将\
