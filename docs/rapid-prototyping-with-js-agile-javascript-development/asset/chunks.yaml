    6 \n7 var db=new Db ('test', new Server(host,port, {}));\n```\n\n要实际打开连接：\n\n\
    ```\n1 db.open(function(e,c){\n2 \t//在此处对数据库进行操作\n3   // console.log (util.inspect(db));\n\
    4   console.log(db._state);\n5   db.close();\n6 });\n```\n\n这段代码段位于 [rpjs/db/db.js](https://github.com/azat-co/rpjs/blob/master/db/db.js)\
    \ 下。如果我们运行它，终端应该输出“connected”。当你不确定并需要检查对象的属性时，`util` 模块中有一个非常有用的方法：\n\n```\n\
    1 console.log(util.inspect(db));\n```\n\n### 6.4.3 Heroku  MongoDB: MongoHQ\n\n\
    在本地成功运行显示“connected”的应用程序后，是时候对其进行微调并部署到平台即服务（即 Heroku）了。\n\n我们建议使用 [MongoHQ add-on](https://addons.heroku.com/mongohq)，它是\
    \ [MongoHQ](https://www.mongohq.com/home) 技术的一部分。它提供了一个基于浏览器的 GUI 来查找和操作数据及集合。更多信息请访问\
    \ [`devcenter.heroku.com/articles/mongohq`](https://devcenter.heroku.com/articles/mongohq)。\n\
    \n| ![information](img/leanpub_information.png) |  \n\n#### 注意\n\n 即使你选择了免费版本，你可能也需要提供信用卡信息才能使用\
    \ MongoHQ。不过，你不应该被收取费用。 |\n\n为了连接到数据库服务器，有一个数据库连接 URL（也称为 MongoHQ URL/URI），这在一个字符串中传输所有连接数据库所需信息的方法。\n\
    \n数据库连接字符串 `MONGOHQ_URL` 具有以下格式：\n\n```\n1 mongodb://user:pass@server.mongohq.com/db_name\n\
    ```\n\n你可以从 Heroku 网站复制 MongoHQ URL 字符串（并硬编码），或者从 Node.js 的 `process.env` 对象获取该字符串：\n\
    \n```\n1 process.env.MONGOHQ_URL;\n```\n\n或者\n\n```\n1 var connectionUri = url.parse(process.env.MONGOHQ_URL);\n\
    ```\n\n| ![tip](img/leanpub_tip.png) |  \n\n#### 提示\n\n全局对象 `process` 通过 `process.env`\
    \ 访问环境变量。这些变量通常用于传递数据库主机名和端口、密码、API 密钥、端口号以及不应硬编码到主逻辑中的系统信息。\n\n为了让我们的代码在本地和 Heroku\
    \ 上都能运行，我们可以使用逻辑或运算符 `||`，并在环境变量未定义时分配本地主机和端口：\n\n```\n1 var port = process.env.PORT\
    \ || 1337;\n2 var dbConnUrl = process.env.MONGOHQ_URL || \n3   'mongodb://@127.0.0.1:27017';\n\
    ```\n\n这是我们更新后的跨环境可用 `db.js` 文件：\n\n```\n 1 var url = require('url')\n 2 var util\
    \ = require('util');\n3 var mongodb = require ('mongodb');\n4 var Db = mongodb.Db;\n\
    5 var Connection = mongodb.Connection;\n6 var Server = mongodb.Server;\n 7\n 8\
    \ var dbConnUrl = process.env.MONGOHQ_URL ||\n9 'mongodb://127.0.0.1:27017';\n\
    10 var host = url.parse(dbConnUrl).hostname;\n11 var port = new Number(url.parse(dbConnUrl).port);\n\
    12  \n13 var db=new Db ('test', new Server(host,port, {}));\n14 db.open(function(e,c){\n\
    15   // console.log (util.inspect(db));\n16   console.log(db._state);\n17 });\n\
    ```\n"
- fmt: "\nHere is the manual on how to use MongoDB from Node.js code: [mongodb.github.com/node-mongodb-native/api-articles/nodekoarticle1.html](http://mongodb.github.com/node-mongodb-native/api-articles/nodekoarticle1.html).\n\
    \nAnother approach is to use the MongoHQ Module, which is available at [github.com/MongoHQ/mongohq-nodejs](https://github.com/MongoHQ/mongohq-nodejs).\n\
    \nThis example illustrates a different use of the `mongodb` library by outputting\
    \ collections and a document count. The full source code from [rpjs/db/collections.js](https://github.com/azat-co/rpjs/blob/master/db/collections.js):\n\
    \n```\n 1 var mongodb = require('mongodb');\n 2 var url = require('url');\n 3\
    \ var log = console.log;\n 4 var dbUri = process.env.MONGOHQ_URL || 'mongodb://localhost:27017/test';\n\
    \ 5 \n 6 var connectionUri = url.parse(dbUri);\n 7 var dbName = connectionUri.pathname.replace(/^\\\
    //, '');\n 8 \n 9 mongodb.Db.connect(dbUri, function(error, client) {\n10   if\
    \ (error) throw error;\n11 \n12   client.collectionNames(function(error, names){\n\
    13     if(error) throw error;\n14 \n15     //output all collection names\n16 \
    \    log(\"Collections\");\n17     log(\"===========\");\n18     var lastCollection\
    \ = null;\n19     names.forEach(function(colData){\n20       var colName = colData.name.replace(dbName\
    \ + \".\", '')\n21       log(colName);\n22       lastCollection = colName;\n23\
    \     });\n24     if (!lastCollection) return;\n25     var collection = new mongodb.Collection(client,\
    \ lastCollection);\n26     log(\"\\nDocuments in \" + lastCollection);\n27   \
    \  var documents = collection.find({}, {limit:5});\n28 \n29     //output a count\
    \ of all documents found\n30     documents.count(function(error, count){\n31 \
    \      log(\"  \" + count + \" documents(s) found\");\n32       log(\"====================\"\
    );\n33 \n34       // output the first 5 documents\n35     documents.toArray(function(error,\
    \ docs) {\n36         if(error) throw error;\n37 \n38         docs.forEach(function(doc){\n\
    39           log(doc);\n40         });\n41      \n42         // close the connection\n\
    43         client.close();\n44       });\n45     });\n46   });\n47 });\n```\n\n\
    We’ve used a shortcut for `console.log()` with `var log = console.log;` and `return`\
    \ as a control flow via `if (!lastCollection) return;`.\n\n### 6.4.4 BSON\n\n\
    Binary JSON, or BSON, it is a special data type which MongoDB utilizes. It is\
    \ like to JSON in notation, but has support for additional more sophisticated\
    \ data types.\n\n| ![warning](images/leanpub_warning.png) |  \n\n### Warning\n\
    \nA word of caution about BSON: `ObjectId` in MongoDB is an equivalent to `ObjectID`\
    \ in MongoDB Native Node.js Driver, i.e., make sure to use the proper case. Otherwise\
    \ you’ll get an error. More on the types: [ObjectId in MongoDB](http://www.mongodb.org/display/DOCS/Object+IDs)\
    \ vs [Data Types in MongoDB Native Node.js Drier](https://github.com/mongodb/node-mongodb-native/#data-types).\
    \ Example of Node.js code with `mongodb.ObjectID()`: `collection.findOne({_id:\
    \ new ObjectID(idString)}, console.log) // ok`. On the other hand, in the MongoDB\
    \ shell, we employ: `db.messages.findOne({_id:ObjectId(idStr)});`.\n\n### 6.5\
    \ Chat: MongoDB Version\n\nWe should have everything set up for writing the Node.js\
    \ application which will work both locally and on Heroku. The source code is available\
    \ under [rpjs/mongo](https://github.com/azat-co/rpjs/tree/master/mongo). The structure\
    \ of the application is simple:\n\n```\n1 /mongo\n2   -web.js\n3   -Procfile\n\
    4   -package.json\n```\n\nThis is what `web.js` looks like; first we include our\
    \ libraries:\n\n```\n1 var http = require('http');\n2 var util = require('util');\n\
    3 var querystring = require('querystring');\n4 var mongo = require('mongodb');\n\
    ```\n\nThen put out a magic string to connect to MongoDB:\n\n```\n1 var host =\
    \ process.env.MONGOHQ_URL || \"mongodb://@127.0.0.1:27017/twitter-clone\";\n2\
    \ //MONGOHQ_URL=mongodb://user:pass@server.mongohq.com/db_name\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThe URI/URL format contains the optional database name in\
    \ which our collection will be stored. Feel free to change it to something else,\
    \ for example ‘rpjs’ or ‘test’. |\n\nWe put all the logic inside of an open connection\
    \ in the form of a callback function:\n\n```\n 1 mongo.connect(host, function(error,\
    \ db) {\n2   if (error) throw error;\n3 \n4   var collection = db.collection('messages');\n\
    5   var server = http.createServer(function(req, res) {\n6     if (req.method\
    \ === 'GET') {\n7       collection.find({}).toArray(function(error, docs) {\n\
    8         if (error) throw error;\n9         res.writeHead(200, {'Content-Type':\
    \ 'application/json'});\n10        res.end(JSON.stringify(docs));\n11      });\n\
    12    } else if (req.method === 'POST') {\n13      var body = '';\n14      req.on('data',\
    \ function(chunk) {\n15        body += chunk;\n16      });\n17      req.on('end',\
    \ function() {\n18        var data = querystring.parse(body);\n19        collection.insert(data,\
    \ function(error, result) {\n20          if (error) throw error;\n21         \
    \ res.writeHead(200, {'Content-Type': 'application/json'});\n22          res.end(JSON.stringify(result));\n\
    23        });\n24      });\n25    }\n26  });\n27 \n28  server.listen(port);\n\
    29 });\n30 });\n```\n"
