    >\n</script>\n```\n\nInclude the Parse.com library from CDN location:\n\n```html\n\
    <script\n  src=\"http://www.parsecdn.com/js/parse-1.0.14.min.js\">\n</script>\n\
    ```\n\nInclude our `app.js` file:\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"app.js\"></script>\n</head>\n<body>\n<!-- We'll do something here -->\n\
    </body>\n</html>\n```\n\nCreate the `app.js` file and use the `$(document).ready`\
    \ function to make sure that the DOM is ready for manipulation:\n\n```javascript\n\
    $(document).ready(function() {\n```\n\nChange `parseApplicationId` and `parseJavaScriptKey`\
