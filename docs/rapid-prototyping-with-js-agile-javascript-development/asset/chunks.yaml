  trans: "\n\n注意：如果你想连接到远程数据库，例如 [MongoHQ](https://www.mongohq.com/home) 实例，请将字符串替换为你的用户名、密码、主机和端口值。URI\
    \ 字符串的格式如下：`mongodb://[username:password@]host1[:port1][,host2[:port2],...[,hostN[:portN]]][/[database][?options]]`\n\
    \n`app.param()` 方法是另一个 Express.js 中间件。它基本上表示“每当请求处理器的 URL 模式出现此值时，执行某些操作”。在我们的情况下，当请求模式包含带有冒号前缀的字符串\
    \ `collectionName` 时，我们会选择特定的集合（稍后会在路由中看到）：\n\n```javascript\n1 app.param('collectionName',\
    \ \n2   function(req, res, next, collectionName) {\n3     req.collection = db.collection(collectionName)\n\
    4     return next()\n5   }\n6 )\n```\n\n为了用户友好，我们设置一个带消息的根路由：\n\n```javascript\n\
    1 app.get('/', function(req, res) {\n2   res.send('please select a collection,\
    \ e.g., /collections/messages')\n3 })\n```\n\n现在真正的工作开始了。以下是获取获取按 `_id` 排序并限制为\
    \ 10 条的项目列表的方法：\n\n```javascript\n 1 app.get('/collections/:collectionName', \n\
    2   function(req, res) {\n3     req.collection\n4       .find({},\n5         {limit:10,\
    \ sort: [['_id',-1]]}\n6       ).toArray(function(e, results){\n7         if (e)\
    \ return next(e)\n8         res.send(results)\n9       }\n10     )\n11   }\n12\
    \ )\n```\n\n你是否注意到 URL 模式参数中的 `:collectionName` 字符串了？这个和之前的 `app.param()` 中间件为我们提供了\
    \ `req.collection` 对象，它指向数据库中指定的集合。\n\n创建端点的对象稍微更容易理解，因为我们只需将整个负载传递给 MongoDB（方法即免费的\
    \ JSON REST API）：\n\n```javascript\n1 app.post('/collections/:collectionName',\
    \ function(req, res) {\n2   req.collection.insert(req.body, {}, function(e, results){\n\
    3     if (e) return next(e)\n4     res.send(results)\n5   })\n6 })\n```\n\n单个对象检索函数比\
    \ `find()` 快，但它们使用不同的接口（它们直接返回对象而不是游标），所以请注意这一点。此外，我们通过 Express.js 的魔术方法 `req.params.id`\
    \ 从路径的 `:id` 部分提取 ID：\n\n```javascript\n1 app.get('/collections/:collectionName/:id',\
    \ function(req, res) {\n2   req.collection.findOne({_id: req.collection.id(req.params.id)},\
    \ \n3     function(e, result){\n4       if (e) return next(e)\n5       res.send(result)\n\
    6     }\n7   )\n8 })\n```\n\nPUT 请求处理器变得更有趣了，因为 `update()` 不返回修改后的对象，而是返回受影响对象的计数。\n\
    \n此外，`{$set:req.body}` 是一个特殊的 MongoDB 运算符（运算符通常以美元符号开头），用于设置值。\n\n第二个参数 `{safe:true,\
    \ multi:false}` 是一个带有选项的对象，告诉 MongoDB 在运行回调函数之前等待执行完成，并且只处理一个（第一个）项目。\n\n```javascript\n\
    \ 1 app.put('/collections/:collectionName/:id', function(req, res) {\n2   req.collection.update({_id:\
    \ req.collection.id(req.params.id)}, \n3     {$set:req.body}, \n4     {safe:true,\
    \ multi:false}, \n5     function(e, result){\n6       if (e) return next(e)\n\
    7       res.send((result===1)?{msg:'success'}:{msg:'error'})\n8     }\n9   )\n\
    10 })\n```\n\n最后是 DELETE 方法，它也输出自定义的 JSON 消息：\n\n```javascript\n1 app.del('/collections/:collectionName/:id',\
    \ function(req, res) {\n2   req.collection.remove({_id: req.collection.id(req.params.id)},\
    \ 3     function(e, result){\n4       if (e) return next(e)\n5     res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    6     }\n7   )\n8 })\n```\n\n注意：`delete` 是 JavaScript 中的一个运算符，所以 Express.js 使用\
    \ `app.del` 代替。\n\n在这种情况下，实际在端口 3000 上启动服务器的最后一行是：\n\n```javascript\n1 app.listen(3000)\n\
    ```\n\n以防某些地方运行不正常，这里是 `express.js` 文件的完整代码：\n\n```javascript\n 1 var express\
    \ = require('express')\n2   , mongoskin = require('mongoskin')\n3 \n4 var app\
    \ = express()\n5 app.use(express.bodyParser())\n6 \n7 var db = mongoskin.db('localhost:27017/test',\
    \ {safe:true})\n8 app.param('collectionName', \n9   function(req, res, next, collectionName)\
    \ {\n10     req.collection = db.collection(collectionName)\n11     return next()\n\
    12   }\n13 )\n14 app.get('/', function(req, res) {\n15   res.send('please select\
    \ a collection, e.g., /collections/messages')\n16 })\n17 app.get('/collections/:collectionName',\
    \ \n18   function(req, res) {\n19     req.collection\n20       .find({},\n21 \
    \        {limit:10, sort: [['_id',-1]]}\n22       ).toArray(function(e, results){\n\
    23         if (e) return next(e)\n24         res.send(results)\n25       }\n26\
    \     )\n27   }\n28 )\n29 app.post('/collections/:collectionName', function(req,\
    \ res) {\n30   req.collection.insert(req.body, {}, function(e, results){\n31 \
    \    if (e) return next(e)\n32     res.send(results)\n33   })\n34 })\n35 app.get('/collections/:collectionName/:id',\
    \ function(req, res) {\n36   req.collection.findOne({_id: req.collection.id(req.params.id)},\
    \ \n37     function(e, result){\n38       if (e) return next(e)\n39       res.send(result)\n\
    40     }\n41   )\n42 })\n43 app.put('/collections/:collectionName/:id', function(req,\
    \ res) {\n44   req.collection.update({_id: req.collection.id(req.params.id)},\
    \ \n45     {$set:req.body}, \n46     {safe:true, multi:false}, \n47     function(e,\
    \ result){\n48       if (e) return next(e)\n49       res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    50     }\n51   )\n52 })\n53 app.del('/collections/:collectionName/:id', function(req,\
    \ res) {\n54   req.collection.remove({_id: req.collection.id(req.params.id)},\
    \ 55     function(e, result){\n56       if (e) return next(e)\n57     res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    58     }\n59   )\n60 })\n61 app.listen(3000)\n```\n\n"
- fmt: "\n[Express.js](http://expressjs.com) is a popular node framework which uses\
    \ the middleware concept to enhance the functionality of applications. [Derby](http://derbyjs.com)\
    \ is a new sophisticated Model View Controller ([MVC](http://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller))\
    \ framework which is designed to be used with [Express](http://expressjs.com)\
    \ as its middleware. Derby also comes with the support of [Racer](https://github.com/codeparty/racer),\
    \ data synchronization engine, and a handlebars-like template engine.\n\n## Derby\
    \ Installation\n\nLet’s set up a basic Derby application architecture without\
    \ the use of scaffolding. Usually project generators are confusing when people\
    \ just start to learn a new comprehensive framework. This is a bare minimum “Hello\
    \ World” application tutorial that still illustrates the Derby skeleton and demonstrates\
    \ live-templates with websockets.\n\nOf course, we’ll need [Node.js](http://nodejs.org)\
    \ and [NPM](http://npmjs.org), which can be obtained at [nodejs.org](http://nodejs.org).\
    \ To install Derby globally, run:\n\n```\n1 $ npm install -g derby\n```\n\nTo\
    \ check the installation:\n\n```\n1 $ derby -V\n```\n\nMy version, as of April\
    \ 2013, is `0.3.15`. We should be good to go to creating our first app!\n\n##\
    \ File Structure\n\nThis is the project folder structure:\n\n```\n1 project/\n\
    2   -package.json\n3   -index.js\n4   -derby-app.js\n5   views/\n6     derby-app.html\n\
    7   styles/\n8     derby-app.less\n```\n\n## Dependencies\n\nLet’s include dependencies\
    \ and other basic information in the `package.json` file:\n\n```\n 1  {\n 2  \
    \ \"name\": \"DerbyTutorial\",\n 3   \"description\": \"\",\n 4   \"version\"\
    : \"0.0.0\",\n 5   \"main\": \"./server.js\",\n 6   \"dependencies\": {\n 7  \
    \   \"derby\": \"*\",\n 8     \"express\": \"3.x\"\n 9   },\n10   \"private\"\
    : true\n11 }\n```\n\nNow we can run `npm install`, which will download our dependencies\
    \ into `node_modules` folder.\n\n## Views\n\nViews must be in the `views` folder,\
    \ and they must be either in `index.html` under a folder which has the same name\
    \ as your derby app JavaScript file, i.e., `views/derby-app/index.html`, or be\
    \ inside of a file which has the same name as your derby app JS file, i.e., `derby-app.html`.\n\
    \nIn this example, the “Hello World” app, we’ll use `<Body:>` template and `{message}`\
    \ variable. Derby uses mustache-like syntax for reactive binding. `index.html`\
    \ looks like this:\n\n```\n1 <Body:>\n2   <input value=\"{message}\"><h1>{message}</h1>\n\
    ```\n\nSame thing with Stylus/LESS files; in our example, `index.css` has just\
    \ one line:\n\n```\n1 h1 {\n2   color: blue;\n3 }\n```\n\nTo find out more about\
    \ those wonderful CSS preprocessors, check out the documentation at [Stylus](http://learnboost.github.io/stylus/)\
    \ and [LESS](http://lesscss.org/).\n\n## Main Server\n\n`index.js` is our main\
    \ server file, and we begin it with an inclusion of dependencies with the `require()`\
    \ function:\n\n```\n1 var http = require('http'),\n2   express = require('express'),\n\
    3   derby = require('derby'),\n4   derbyApp = require('./derby-app');\n```\n\n\
    The last line is our derby application file `derby-app.js`.\n\nNow we’re creating\
    \ the Express.js application (v3.x has significant differences between 2.x) and\
    \ an HTTP server:\n\n```\n1 var expressApp = new express(),\n2   server = http.createServer(expressApp);\n\
    ```\n\n[Derby](http://derbyjs.com) uses the [Racer](https://github.com/codeparty/racer)\
    \ data synchronization library, which we create like this:\n\n```\n1 var store\
    \ = derby.createStore({\n2   listen: server\n3 });\n```\n\nTo fetch some data\
    \ from back-end to the front-end, we instantiate the model object:\n\n```\n1 var\
    \ model = store.createModel();\n```\n\nMost importantly we need to pass the model\
    \ and routes as middlewares to the Express.js app. We need to expose the public\
    \ folder for socket.io to work properly.\n\n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n\
    3   use(express.static(__dirname + '/public')).\n4   use(derbyApp.router()).\n\
    5   use(expressApp.router);\n```\n\nNow we can start the server on port 3001 (or\
    \ any other):\n\n```\n1 server.listen(3001, function(){\n2   model.set('message',\
    \ 'Hello World!');\n3 });\n```\n\nFull code of `index.js`:\n\n```\n1 var http\
    \ = require('http'),\n2   express = require('express'),\n3   derby = require('derby'),\n\
    4   derbyApp = require('./derby-app');\n5 \n6 var expressApp = new express(),\n\
    7   server = http.createServer(expressApp);\n8 \n9 var store = derby.createStore({\n\
    10   listen: server\n11 });\n12 \n13 var model = store.createModel();\n14 \n15\
    \ expressApp.\n16   use(store.modelMiddleware()).\n17   use(express.static(__dirname\
    \ + '/public')).\n18   use(derbyApp.router()).\n19   use(expressApp.router);\n\
    20 \n21 server.listen(3001, function(){\n22   model.set('message', 'Hello World!');\n\
    23 });\n```\n\n## Derby Application\n\n[Derby](http://derbyjs.com) uses the [Racer](https://github.com/codeparty/racer)\
    \ data synchronization library, which we create like this:\n\n```\n1 var store\
    \ = derby.createStore({\n2   listen: server\n3 });\n```\n\nTo fetch some data\
    \ from back-end to the front-end, we instantiate the model object:\n\n```\n1 var\
    \ model = store.createModel();\n```\n\nMost importantly we need to pass the model\
    \ and routes as middlewares to the Express.js app. We need to expose the public\
    \ folder for socket.io to work properly.\n\n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n\
    3   use(express.static(__dirname + '/public')).\n4   use(derbyApp.router()).\n\
    5   use(expressApp.router);\n```\n\nNow we can start the server on port 3001 (or\
    \ any other):\n\n```\n1 server.listen(3001, function(){\n2   model.set('message',\
    \ 'Hello World!');\n3 });\n```\n\nFull code of `derby-app.js`:\n\n```\n1 var derby\
    \ = require('derby'),\n2   app = derby.createApp(module);\n3 \n4 app.get('/',\
    \ function(page, model) {\n5   page.render();\n6   });\n7 });\n```\n\n## Launching\
    \ Hello App\n\nNow everything should be ready to boot. Execute `node .` or `node\
    \ index.js` and open browser at `localhost:3001`. You should be able to see something\
    \ like:\n\n## Passing Values to Back-End\n\nOf course, the static data is not\
    \ much, so we can slightly modify our app to make back-end and front-end pieces\
    \ talk with each.\n\nIn the server file `index.js`, add `store.afterDb` to listen\
    \ to `set` events on the `message` attribute:\n\n```\n1 server.listen(3001, function(){\n\
    2   model.set('message', 'Hello World!');\n3   store.afterDb('set','message',\
    \ function(txn, doc, prevDoc, done){\n4     console.log(txn)\n5     done();\n\
    6   });\n7 });\n```\n\nFull code of `index.js` after modifications:\n\n```\n 1\
    \ var http = require('http'),\n 2   express = require('express'),\n 3   derby\
    \ = require('derby'),\n 4   derbyApp = require('./derby-app');\n 5 \n 6 var expressApp\
    \ = new express(),\n 7   server = http.createServer(expressApp);\n 8 \n 9 var\
    \ store = derby.createStore({\n10   listen: server\n 11 });\n 12 \n 13 var model\
    \ = store.createModel();\n 14 \n 15 expressApp.\n 16   use(store.modelMiddleware()).\n\
    \ 17   use(express.static(__dirname + '/public')).\n 18   use(derbyApp.router()).\n\
    \ 19   use(expressApp.router);\n 20 \n 21 server.listen(3001, function(){\n 22\
    \   model.set('message', 'Hello World!');\n 23   store.afterDb('set','message',\
    \ function(txn, doc, prevDoc, done){\n 24     console.log(txn)\n 25     done();\n\
    \ 26   });\n 27 });\n```\n"
  raw: "[Express.js](http://expressjs.com) is a popular node framework which uses\
    \ the middleware concept to enhance the functionality of applications. [Derby](http://derbyjs.com)\
    \ is a new sophisticated Model View Controller ([MVC](http://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller))\
    \ framework which is designed to be used with [Express](http://expressjs.com)\
    \ as its middleware. Derby also comes with the support of [Racer](https://github.com/codeparty/racer),\
    \ data synchronization engine, and a [Handlebars](https://github.com/wycats/handlebars.js/)-like\
    \ template engine, among [many other features](http://derbyjs.com/#features).\n\
    \n#### 8.8.2 Derby Installation\n\nLet’s set up a basic Derby application architecture\
    \ without the use of scaffolding. Usually project generators are confusing when\
    \ people just start to learn a new comprehensive framework. This is a bare minimum\
    \ “Hello World” application tutorial that still illustrates the Derby skeleton\
    \ and demonstrates live-templates with websockets.\n\nOf course, we’ll need [Node.js](http://nodejs.org)\
    \ and [NPM](http://npmjs.org), which can be obtained at [nodejs.org](http://nodejs.org).\
    \ To install Derby globally, run:\n\n```\n1 $ npm install -g derby\n```\n\nTo\
    \ check the installation:\n\n```\n1 $ derby -V\n```\n\nMy version, as of April\
    \ 2013, is 0.3.15\\. We should be good to go to creating our first app!\n\n####\
    \ 8.8.3 File Structure\n\nThis is the project folder structure:\n\n```\n1 project/\n\
    2   -package.json\n3   -index.js\n4   -derby-app.js\n5   views/\n6     derby-app.html\n\
    7   styles/\n8     derby-app.less\n```\n\n#### 8.8.4 Dependencies\n\nLet’s include\
    \ dependencies and other basic information in the **package.json** file:\n\n```\n\
    \ 1  {\n 2   \"name\": \"DerbyTutorial\",\n 3   \"description\": \"\",\n 4   \"\
    version\": \"0.0.0\",\n 5   \"main\": \"./server.js\",\n 6   \"dependencies\"\
    : {\n 7     \"derby\": \"*\",\n 8     \"express\": \"3.x\"\n 9   },\n10   \"private\"\
    : true\n11 }\n```\n\nNow we can run `npm install`, which will download our dependencies\
    \ into **node_modules** folder.\n\n#### 8.8.5 Views\n\nViews must be in the **views**\
    \ folder, and they must be either in **index.html** under a folder which has the\
    \ same name as your derby app JavaScript file, i.e., `views/derby-app/index.html`,\
    \ or be inside of a file which has the same name as your derby app JS file, i.e.,\
    \ **derby-app.html**.\n\nIn this example, the “Hello World” app, we’ll use `<Body:>`\
    \ template and `{message}` variable. Derby uses [mustach](http://mustache.github.io/)-handlebars-like\
    \ syntax for reactive binding. **index.html** looks like this:\n\n```\n1 <Body:>\n\
    2   <input value=\"{message}\"><h1>{message}</h1>\n```\n\nSame thing with Stylus/LESS\
    \ files; in our example, index.css has just one line:\n\n```\n1 h1 {\n2   color:\
    \ blue;\n3 }\n```\n\nTo find out more about those wonderful CSS preprocessors,\
    \ check out the documentation at [Stylus](http://learnboost.github.io/stylus/)\
    \ and [LESS](http://lesscss.org/).\n\n#### 8.8.6 Main Server\n\n**index.js** is\
    \ our main server file, and we begin it with an inclusion of dependencies with\
    \ the `require()` function:\n\n```\n1 var http = require('http'),\n2   express\
    \ = require('express'),\n3   derby = require('derby'),\n4   derbyApp = require('./derby-app');\n\
    ```\n\nThe last line is our derby application file **derby-app.js**.\n\nNow we’re\
    \ creating the Express.js application (v3.x has significant differences between\
    \ 2.x) and an HTTP server:\n\n```\n1 var expressApp = new express(),\n2   server\
    \ = http.createServer(expressApp);\n```\n\n[Derby](http://derbyjs.com) uses the\
    \ [Racer](https://github.com/codeparty/racer) data synchronization library, which\
    \ we create like this:\n\n```\n1 var store = derby.createStore({\n2   listen:\
    \ server\n3 });\n```\n\nTo fetch some data from back-end to the front-end, we\
    \ instantiate the model object:\n\n```\n1 var model = store.createModel();\n```\n\
    \nMost importantly we need to pass the model and routes as middlewares to the\
    \ Express.js app. We need to expose the public folder for socket.io to work properly.\n\
    \n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n3   use(express.static(__dirname\
    \ + '/public')).\n4   use(derbyApp.router()).\n5   use(expressApp.router);\n```\n\
    \nNow we can start the server on port 3001 (or any other):\n\n```\n1 server.listen(3001,\
    \ function(){\n2   model.set('message', 'Hello World!');\n3 });\n```\n\nFull code\
    \ of **index.js** file:\n\n```\n 1 var http = require('http'),\n 2   express =\
    \ require('express'),\n 3   derby = require('derby'),\n 4   derbyApp = require('./derby-app');\n\
    \ 5 \n 6 var expressApp = new express(),\n 7   server = http.createServer(expressApp);\n\
    \ 8 \n 9 var store = derby.createStore({\n10   listen: server\n11 });\n12 \n13\
    \ var model = store.createModel();\n14 \n15 expressApp.\n16   use(store.modelMiddleware()).\n\
    17   use(express.static(__dirname + '/public')).\n18   use(derbyApp.router()).\n\
    19   use(expressApp.router);\n20 \n21 server.listen(3001, function(){\n22   model.set('message',\
    \ 'Hello World!');\n23 });\n```\n\n#### 8.8.7 Derby Application\n\nFinally, the\
    \ Derby app file, which contains code for both a front-end and a back-end. Front-end\
    \ only code is inside of the `app.ready()` callback. To start, let’s require and\
    \ create an app. Derby uses unusual construction (not the same familiar good old\
    \ `module.exports = app`):\n\n```\n1 var derby = require('derby'),\n2   app =\
    \ derby.createApp(module);\n```\n\nTo make socket.io magic work, we need to subscribe\
    \ a model attribute to its visual representation — in other words, bind data and\
    \ view. We can do it in the root route, and this is how we define it (patter is\
    \ `/`, a.k.a. root):\n\n```\n1 app.get('/', function(page, model, params) {\n\
    2   model.subscribe('message', function() {\n3     page.render();  \n4   }); \
    \ \n5 });\n```\n\nFull code of **derby-app.js** file:\n\n```\n1 var derby = require('derby'),\n\
    2   app = derby.createApp(module);\n3 \n4 app.get('/', function(page, model, params)\
    \ {\n5   model.subscribe('message', function() {\n6     page.render();  \n7  \
    \ });  \n8 }); \n```\n\n#### 8.8.8 Launching Hello World App\n\nNow everything\
    \ should be ready to boot our server. Execute `node .` or `node index.js` and\
    \ open a browser at [localhost:3001](http://localhost:3001). You should be able\
    \ to see something like this:\n\n![Derby + Express.js Hello World App](images/webapplog-derby.png)\n\
    \nDerby + Express.js Hello World App\n\n#### 8.8.9 Passing Values to Back-End\n\
    \nOf course, the static data is not much, so we can slightly modify our app to\
    \ make back-end and front-end pieces talks with each other.\n\nIn the server file\
    \ **index.js**, add `store.afterDb` to listen to `set` events on the **message**\
    \ attribute:\n\n```\n1 server.listen(3001, function(){\n2   model.set('message',\
    \ 'Hello World!');\n3   store.afterDb('set','message', function(txn, doc, prevDoc,\
    \ done){\n4     console.log(txn)\n5     done();\n6   }); \n7 });\n```\n\nFull\
    \ code of **index.js** after modifications:\n\n```\n 1 var http = require('http'),\n\
    \ 2   express = require('express'),\n 3   derby = require('derby'),\n 4   derbyApp\
    \ = require('./derby-app');\n 5 \n 6 var expressApp = new express(),\n 7   server\
    \ = http.createServer(expressApp);\n 8 \n 9 var store = derby.createStore({\n\
    10   listen: server\n11 });\n12 \n13 var model = store.createModel();\n14 \n15\
    \ expressApp.\n16   use(store.modelMiddleware()).\n17   use(express.static(__dirname\
    \ + '/public')).\n18   use(derbyApp.router()).\n19   use(expressApp.router);\n\
    20 \n21 server.listen(3001, function(){\n22   model.set('message', 'Hello World!');\n\
    23   store.afterDb('set','message', function(txn, doc, prevDoc, done){\n24   \
    \  console.log(txn)\n25     done();\n26   });   \n27 });\n```\n\nIn the Derby\
    \ application file **derby-app.js**, add `model.on()` to `app.ready()`:\n\n```\n\
    1   app.ready(function(model){\n2 \t    model.on('set', 'message',function(path,\
    \ object){\n3 \t    console.log('message has been changed: '+ object);\n4 \t \
    \ })\n5   });\n```\n\nFull **derby-app.js** file after modifications:"
