    \ \n\n### Warning\n\nWe need to use the JavaScript SDK Key from the Parse.com\
    \ dashboard with this approach. For the jQuery example, we’ll be using the REST\
    \ API Key from the same webpage. If you get a 401 Unauthorized error from Parse.com,\
    \ that’s probably because you have a wrong API key. |\n\nIf everything was done\
    \ properly, you should be able to see the **Test** in Parse.com’s Data Browser\
    \ populated with values “John” and “hi”. Also, you should see the proper message\
    \ in your browser’s console in Developer Tools. Parse.com automatically creates\
    \ objectIDs and timestamps, which will be very useful in our Chat application.\n\
    \nParse.com also has thorough instructions for the ‘Hello World’ application which\
    \ are available at the Quick Start Guide sections for [new projects](https://parse.com/apps/quickstart#js/blank)\
    \ and [existing ones](https://parse.com/apps/quickstart#js/existing).\n\n### 3.7\
    \ Chat with Parse.com Overview\n\nThe Chat will consist of an input field, a list\
    \ of messages and a send button. We need to display a list of existing messages\
    \ and be able to submit new messages. We’ll use Parse.com as a back-end for now,\
    \ and later switch to Node.js with MongoDB.\n\nYou can get a free account at Parse.com.\
    \ The JavaScript Guide is available at [https://parse.com/docs/js_guide](https://parse.com/docs/js_guide)\
    \ and JavaScript API is available at [https://parse.com/docs/js/](https://parse.com/docs/js/).\n\
    \nAfter signing up for Parse.com, go to the dashboard and create a new app if\
    \ you haven’t done so already. Copy your newly created app’s Application ID and\
    \ JavaScript key and REST API Key. We’ll need it later. There are a few ways to\
    \ use [Parse.com](http://parse.com):\n\n*   REST API: We’re going to use this\
    \ approach with the jQuery example\n\n*   JavaScript SDK: We just used this approach\
    \ in our test example above, and we’ll use it in the Backbone.js example later\n\
    \nREST API is a more generic approach. Parse.com provides endpoints which we can\
    \ request with the `$.ajax()` method from jQuery library. Here is the description\
    \ of available URLs and methods: [parse.com/docs/rest](https://parse.com/docs/rest).\n\
    \n### 3.8 Chat with Parse.com: REST API and jQuery version\n\nThe full code is\
    \ available under the [rpjs/rest](https://github.com/azat-co/rpjs/tree/master/rest)\
    \ folder, but we encourage you to try to write your own application first.\n\n\
    We’ll use Parse.com’s REST API and jQuery. Parse.com supports different origin\
    \ domain AJAX calls, so we won’t need JSONP.\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nWhen you decide to deploy your back-end application, which\
    \ will act as a substitute for Parse.com, on a different domain you’ll need to\
    \ use either JSONP on the front-end or custom CORS headers on a back-end. This\
    \ topic will be covered later in the book. |\n\nRight now the structure of the\
    \ application should look like this:\n\n```\n1 index.html\n2   css/bootstrap.min.css\n\
    3   css/style.css\n4   js/app.js\n```\n\nLet’s create a visual representation\
    \ for the Chat app. What we want is just to display a list of messages with names\
    \ of users in chronological order. Therefore, a table will do just fine, and we\
    \ can dynamically create `<tr>` elements and keep inserting them as we get new\
    \ messages.\n\nCreate a simple HTML file **index.html** with the following content:\n\
    \n*   Inclusion of JS and CSS files\n\n*   Responsive structure with Twitter Boostrap\n\
    \n*   A table of messages\n\n*   A form for new messages\n\nLet’s start with the\
    \ **head** and dependencies. We’ll include CDN jQuery, local **app.js**, local\
    \ minified Twitter Boostrap and custom stylesheet **style.css**:\n\n```\n 1 <!DOCTYPE\
    \ html>\n 2 <html lang=\"en\">\n 3   <head>\n 4     <script \n 5       src=\n\
