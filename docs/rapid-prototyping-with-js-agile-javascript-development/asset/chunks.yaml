    \ and [Heroku: Node.js](https://devcenter.heroku.com/articles/nodejs).\n\n####\
    \ 2.2.5 Cloud9\n\nCloud9 is an in-browser IDE with which, by using your GitHub\
    \ or BitBucket account, you can browse your repositories, edit them and deploy\
    \ to Windows Azure or other services. No installations are needed; everything\
    \ works in the browser, pretty much like Google Docs.\n\n# II Front-End Prototyping\n\
    \n## 3 jQuery and Parse.com\n\n**Summary**: overview of main jQuery functions,\
    \ Twitter Bootstrap scaffolding, main LESS components; definitions of JSON, AJAX\
    \ and CORS; illustrations of JSONP calls on Twitter REST API example; explanations\
    \ on how to build Chat front-end only application with jQuery and Parse.com; step-by-step\
    \ instructions on deployment to Heroku and Windows Azure.\n\n> *“There are two\
    \ ways of constructing a software design: One way is to make it so simple that\
    \ there are obviously no deficiencies, and the other way is to make it so complicated\
    \ that there are no obvious deficiencies. The first method is far more difficult.”*\
    \ — [Tony Hoare](http://en.wikipedia.org/wiki/Charles_Antony_Richard_Hoare)\n\n\
    ### 3.1 Definitions\n\n#### 3.1.1 JavaScript Object Notation\n\nHere is the definition\
    \ of JavaScript Object Notation, or JSON, from [json.org](http://www.json.org/):\n\
    \n> JavaScript Object Notation, or JSON, is a lightweight data-interchange format.\
    \ It is easy for humans to read and write. It is easy for machines to parse and\
    \ generate. It is based on a subset of the JavaScript Programming Language, [Standard\
    \ ECMA-262 3rd Edition - December 1999](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf).\
    \ JSON is a text format that is completely language independent but uses conventions\
    \ that are familiar to programmers of the C-family of languages, including C,\
    \ C++, C#, Java, JavaScript, Perl, Python, and many others. These properties make\
    \ JSON an ideal data-interchange language.\n\nJSON has become a standard for transferring\
    \ data between different components of web/mobile applications and third-party\
    \ services. JSON is also widely used inside the applications as a format for configuration,\
    \ locales, translation files or any other data.\n\nTypical JSON object looks like\
    \ this:\n\n```\n1 {\n2   \"a\": \"value of a\",\n3   \"b\": \"value of b\"\n4\
    \ }\n```\n\nWe have an object with key-value pairs. Keys are on the left and values\
    \ are on the right side of colons (`:`). In Computer Science terminology, JSON\
    \ is equivalent to a hash table, a keyed list or an associative array (depending\
    \ on a particular language). The only big difference between JSON and JS object\
    \ literal notation (native JS objects) is that the former is more stringent and\
    \ requires double quotes (`\"`) for key identifiers and string values. Both types\
    \ can be serialized into a string representation with `JSON.stringify()` and deserialized\
    \ with `JSON.parse()` assuming we have a valid JSON object in a string format.\n\
    \nHowever, every member of an object can be an array, primitive, or another object;\
    \ for example:\n\n```\n 1   {\n 2     \"posts\": [{\n 3       \"title\": \"Get\
    \ your mind in shape!\",\n 4       \"votes\": 9,\n 5       \"comments\": [\"nice!\"\
    , \"good link\"]\n 6       }, {\n 7       \"title\": \"Yet another post\",\n 8\
    \       \"votes\":0,\n 9       \"comments\": []\n10       }\n11     ],\n12   \
    \  \"totalPost\":2,\n13     \"getData\": function () {\n14       return new Data().getDate();\n\
    15     }\n16   }\n```\n\nIn the above example, we have an object with the **posts**\
    \ property. The value of the **posts** property is an array of objects with each\
    \ one of them having **title**, **votes** and **comments** keys. The votes property\
    \ holds a number primitive, while comments is an array of strings. We also can\
    \ have function as values; in this case, key is called a method, i.e., `getData`.\n\
    \nJSON is much more flexible and compact than XML or other data formats as outlined\
    \ in this article — [JSON: The Fat-Free Alternative to XML](http://www.json.org/xml.html).\
    \ Conveniently, MongoDB uses a JSON-like format called [BSON](http://bsonspec.org/),\
    \ or Binary JSON. More on BSON later in the *Node.js and MongoDB* chapter.\n\n\
    #### 3.1.2 AJAX\n\nAJAX stands for Asynchronous JavaScript and XML, and is used\
    \ on a client-side (browser) to send and receive data from the server by utilizing\
    \ an **XMLHttpRequest** object in JavaScript language. Despite the name, the use\
    \ of XML is not required, and JSON is often used instead. That’s why developers\
    \ almost never say AJAX anymore. Keep in mind that HTTP requests could be made\
    \ synchronously, but it’s not a good practice to do so. The most typical example\
    \ of a sync request would be the **script** tag inclusion.\n\n#### 3.1.3 Cross-Domain\
    \ Calls\n\nFor security reasons, the initial implementation of a XMLHTTPRequest\
    \ object did not allow for cross-domain calls, i.e., when a client-side code and\
    \ a server-side one are on different domains. There are methods to work around\
    \ this issue.\n\nOne of them is to use [JSONP](http://en.wikipedia.org/wiki/JSONP)\
    \ — JSON with padding/prefix. It’s basically a dynamically, via DOM manipulation,\
    \ generated **script** tag. Script tags don’t fall into the same domain limitation.\
    \ The JSONP request includes a name of a callback function in a request query\
    \ string. For example, the `jQuery.ajax()` function automatically generates a\
    \ unique function name and appends it to the request (which is a one string broken\
    \ into multiple lines for readability):\n\n```\n1 https://graph.facebook.com/search\n\
    2   ?type=post\n3   &limit=20\n4   &q=Gatsby\n5   &callback=jQuery16207184716751798987_1368412972614&_=1368412984735\n\
    ```\n\nThe second approach is to use Cross-Origin Resource Sharing, or [CORS](http://www.w3.org/TR/cors/),\
    \ which is a better solution but it requires control over the server-side to modify\
    \ response headers. We’ll use this technique in the final version of the Chat\
    \ example application.\n\nExample of CORS server response header:\n\n```\n1 Access-Control-Allow-Origin:\
    \ *\n```\n\nMore about CORS: [Resources by Enable CORS](http://enable-cors.org/resources.html)\
    \ and [Using CORS by HTML5 Rocks Tutorials] (http://www.html5rocks.com/en/tutorials/cors/).\
    \ Test CORS requests at [test-cors.org](http://client.cors-api.appspot.com/client).\n\
    \n### 3.2 jQuery\n\nDuring the training we’ll be using jQuery ([http://jquery.com/](http://jquery.com/))\
    \ for DOM manipulations, HTTP Requests and JSONP calls. jQuery became a de facto\
    \ standard because of its $ object/function, which provides a simple yet efficient\
    \ way to access any HTML DOM element on a page by its ID, class, tag name, attribute\
    \ value, structure or by any combination of thereof. The syntax is very similar\
    \ to CSS, where we use `#` for id and `.` for class selection, e.g.:\n\n```\n\
    1 $(\"#main\").hide();\n2 $(\"p.large\").attr(\"style\",\"color:red\");\n3 $(\"\
    #main\").show().html(\"<div>new div</div>\");\n```\n\nHere is the list of most\
    \ commonly used jQuery API functions:\n\n*   **[find()](http://api.jquery.com/find)**:\
    \ Selects elements based on the provided selector string\n\n*   **[hide()](http://api.jquery.com/hide)**:\
    \ Hides an element if it was visible\n\n*   **[show()](http://api.jquery.com/show)**:\
    \ Shows an element if it was hidden\n\n*   **[html()](http://api.jquery.com/html)**:\
    \ Gets or sets an inner HTML of an element\n\n*   **[append()](http://api.jquery.com/append)**\
    \ Injects an element into the DOM after the selected element"
