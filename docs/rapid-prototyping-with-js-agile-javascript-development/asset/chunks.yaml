    The link to an individual item, e.g., `collections/index.html#apples/fuji`, also\
    \ should work independently, by typing it in the browser address bar.\n\n### 4.5\
    \ Refactoring\n\nAt this point you are probably wondering what is the benefit\
    \ of using the framework and still having multiple classes, objects and elements\
    \ with different functionalities in one *single* file. This was done for the purpose\
    \ of adhering to the *Keep it Simple Stupid* (KISS) principle.\n\nThe bigger your\
    \ application is, the more pain there is in unorganized code base. Let’s break\
    \ down our application into multiple files where each file will be one of these\
    \ types:\n\n*   view\n\n*   template\n\n*   router\n\n*   collection\n\n*   model\n\
    \nLet’s write these scripts to include tags into our **index.html** head — or\
    \ body, as noted previously:\n\n```\n1   <script src=\"apple-item.view.js\"></script>\n\
    2   <script src=\"apple-home.view.js\"></script>\n3   <script src=\"apple.view.js\"\
    ></script>\n4   <script src=\"apples.js\"></script>\n5   <script src=\"apple-app.js\"\
    ></script>\n```\n\nThe names don’t have to follow the convention of dashes and\
    \ dots, as long as it’s easy to tell what each file is supposed to do.\n\nNow,\
    \ let’s copy our objects/classes into the corresponding files.\n\nOur main **index.html**\
    \ file should look very minimalistic:\n\n```\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n\
    \ 4   <script src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"\
    ></script>\n 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script src=\"\
    apple-item.view.js\"></script>\n 9   <script src=\"apple-home.view.js\"></script>\n\
    10   <script src=\"apple.view.js\"></script>\n11   <script src=\"apples.js\"></script>\n\
    12   <script src=\"apple-app.js\"></script>\n13   \n14 </head>\n15 <body>\n16\
    \   <div></div>\n17 </body>\n18 </html>\n```\n\nThe other files just have the\
    \ code that corresponds to their filenames.\n\nThe content of **apple-item.view.js**:\n\
    \n```\n 1   var appleView = Backbone.View.extend({\n 2     initialize: function(){\n\
    \ 3       this.model = new (Backbone.Model.extend({}));\n 4       this.model.on('change',\
    \ this.render, this);\n 5       this.on('spinner',this.showSpinner, this);\n 6\
    \     },\n 7     template: _.template('<figure>\\\n 8               <img src=\"\
    <%= attributes.url %>\"/>\\\n 9               <figcaption><%= attributes.name\
    \ %></figcaption>\\\n10             </figure>'),\n11     templateSpinner: '<img\
    \ src=\"img/spinner.gif\" width=\"30\"/>',\n12 \n13     loadApple:function(appleName){\n\
    14       this.trigger('spinner');\n15       var view = this; \n16       //we'll\
    \ need to access that inside of a closure\n17       setTimeout(function(){ \n\
    18       //simulates real time lag when fetching \n19       //data from the remote\
    \ server\n20         view.model.set(view.collection.where({\n21           name:appleName\n\
    22         })[0].attributes);  \n23       },1000);\n24       \n25     },\n26 \n\
    27     render: function(appleName){\n28       var appleHtml = this.template(this.model);\n\
    29       $('body').html(appleHtml);\n30     },\n31     showSpinner: function(){\n\
    32       $('body').html(this.templateSpinner);        \n33     }\n34 \n35   });\n\
    ```\n\nThe **apple-home.view.js** file has the **homeView** object:"
