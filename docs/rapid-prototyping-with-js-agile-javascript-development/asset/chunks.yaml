    \       userid:userId\n69     }, callback);\n70   },\n71 \n72   restoreStories:\
    \ function(callback){\n73     restore('stories', {authorid:userId}, callback);\n\
    74   }\n75 \n76   }, function(e) {\n77   console.log();\n78   console.log('restoring\
    \ is completed!');\n79   process.exit(1);\n80 });\n```\n\n要启动它，请运行 `npm install`/`npm\
    \ update` 并更改硬编码的数据库值。\n\n## 8.3 在 Mocha 中使用 Mocha 进行 TDD\n\n### 8.3.1 谁需要测试驱动开发？\n\
    \n假设你需要在现有接口上实现一个复杂的功能，例如在评论上添加“点赞”按钮。如果没有测试，你必须手动创建一个用户、登录、创建一个帖子、创建另一个用户、用另一个用户登录并点赞帖子。很累吗？如果你需要重复\
    \ 10 次或 20 次才能发现并修复某个棘手的 Bug 呢？如果你的功能破坏了现有功能，但由于没有测试，你在发布六个月后才注意到呢？！\n\n不要浪费时间为一次性脚本编写测试，但请在主代码库中养成测试驱动开发的习惯。在开始花一点时间，你和你的团队以后将节省时间，并在发布新版本时充满信心。测试驱动开发真的是非常非常、非常好的事情。\n\
    \n### 8.3.2 快速上手指南\n\n遵循此快速指南，使用 [Mocha](http://visionmedia.github.com/mocha/)\
    \ 在 Node.js 中建立你的测试驱动开发流程。\n\n执行以下命令全局安装 [Mocha](http://visionmedia.github.com/mocha/)：\n\
    \n```\n$ sudo npm install -g mocha\n```\n\n我们还会使用两个库：来自 [LearnBoost](https://github.com/LearnBoost)\
    \ 的 [Superagent](https://github.com/visionmedia/superagent) 和 [expect.js](https://github.com/LearnBoost/expect.js/)。要安装它们，请在项目文件夹中运行如下\
    \ [NPM](https://npmjs.org/) 命令：\n\n```\n1 $ npm install superagent\n2 $ npm install\
    \ expect.js \n```\n\n打开一个 `.js` 扩展的新文件并输入：\n\n```\n1 var request = require('superagent');\n\
    2 var expect = require('expect.js');\n```\n\n到目前为止，我们包含了两个库。测试的结构如下：\n\n```\n\
    1 describe('suite', function(){\n2   it('test', function(done){\n3     done();\n\
    4   });\n5 });\n```\n\n"
- fmt: "\nWintersmith allows for different plugins for contents and templates, and\
    \ you can even [write your own plugins](https://github.com/jnordberg/wintersmith#content-plugins).\n\
    \n## 8.4.1 Getting Started with Wintersmith\n\nThere is a quick getting started\
    \ guide on [github.com/jnordberg/wintersmith](https://github.com/jnordberg/wintersmith).\n\
    \nTo install Wintersmith globally, run NPM with `-g` and `sudo`:\n\n```\n1 $ sudo\
    \ npm install wintersmith -g\n```\n\nThen run to use the default blog template:\n\
    \n```\n1 $ wintersmith new <path>\n```\n\nor for an empty site:\n\n```\n1 $ wintersmith\
    \ new <path> -template basic\n```\n\nor use a shortcut:\n\n```\n1 $ wintersmith\
    \ new <path> -T basic\n```\n\nSimilar to Ruby on Rails scaffolding, Wintersmith\
    \ will generate a basic skeleton with `contents` and `templates` folders. To preview\
    \ a website, run these commands:\n\n```\n1 $ cd <path>\n2 $ wintersmith preview\n\
    3 $ open http://localhost:8080\n```\n\nMost of the changes will be updates automatically\
    \ in the preview mode, except for the [config.json file](https://github.com/jnordberg/wintersmith#config).\n\
    \nImages, CSS, JavaScript and other files go into the `contents` folder. The Wintersmith\
    \ generator has the following logic:\n\n1. looks for `*.md` files in the contents\
    \ folder\n2. reads [metadata](https://github.com/jnordberg/wintersmith#the-page-plugin)\
    \ such as the template name\n3. processes `*.jade` [templates](https://github.com/jnordberg/wintersmith#templates)\
    \ per metadata in `*.md` files\n\nWhen you’re done with your static site, just\
    \ run:\n\n```\n1 $ wintersmith build\n```\n\n## 8.4.2 Other Static Site Generators\n\
    \nHere are some of the other Node.js static site generators:\n\n* [DocPad](https://github.com/bevry/docpad#readme)\n\
    * [Blacksmith](https://github.com/flatiron/blacksmith)\n* [Scotch](https://github.com/techwraith/scotch)\n\
    * [Wheat](https://github.com/creationix/wheat)\n* [Petrify](https://github.com/caolan/petrify)\n\
    \nA more detailed overview of these static site generators is available in the\
    \ post [Node.js Based Static Site Generators](http://blog.bmannconsulting.com/node-static-site-generators/).\n\
    \nFor other languages and frameworks like Rails and PHP, take a look at [Static\
    \ Site Generators by GitHub Watcher Count](https://gist.github.com/2254924) and\
    \ the “[mother of all site generator lists](http://nanoc.stoneship.org/docs/1-introduction/#similar-projects)”.\n\
    \n## 8.5 Intro to Express.js: Simple REST API app with Monk and MongoDB\n\n###\
    \ 8.5.1 REST API app with Express.js and Monk\n\nThis app is a start of a [mongoui](http://gitbhub.com/azat-co/mongoui)\
    \ — a phpMyAdmin counterpart for MongoDB written in Node.js. The goal is to provide\
    \ a module with a nice web admin user interface. It will be something like [Parse.com](http://parse.com),\
    \ [Firebase.com](http://firebase.com), [MongoHQ](http://mongohq.com) or [MongoLab](http://mongolab.com)\
    \ has, but without tying it to any particular service. Why do we have to type\
    \ `db.users.findOne({'_id':ObjectId('...')})` anytime we want to look up the user\
    \ information? The alternative [MongoHub](http://mongohub.todayclose.com/) Mac\
    \ app is nice (and free) but clunky to use and not web-based.\n\nRuby enthusiasts\
    \ like to compare Express to the [Sinatra](http://www.sinatrarb.com/) framework.\
    \ It’s similarly flexible in the way developers can build their apps. Application\
    \ routes are set up in a similar manner, i.e., `app.get('/products/:id', showProduct);`.\
    \ Currently Express.js is at version number 3.1\\. In addition to Express, we’ll\
    \ use the [Monk](https://github.com/LearnBoost/monk) module.\n\nWe’ll use [Node\
    \ Package Manager](http://npmjs.org), which usually comes with a Node.js installation.\
    \ If you don’t have it already, you can get it at [npmjs.org](http://npmjs.org).\n\
    \nCreate a new folder and NPM configuration file, `package.json`, in it with the\
    \ following content:\n\n```\n 1 {\n 2   \"name\": \"mongoui\",\n 3   \"version\"\
    : \"0.0.1\",\n 4   \"engines\": {\n 5     \"node\": \">= v0.6\"\n 6   },\n 7 \
    \  \"dependencies\": {\n 8     \"mongodb\":\"1.2.14\",\n 9     \"monk\": \"0.7.1\"\
    ,\n10     \"express\": \"3.1.0\"\n11   }\n12 }\n```\n\nNow run `npm install` to\
    \ download and install modules into the `node_module` folder. If everything went\
    \ okay you’ll see bunch of folders in `node_modules` folders. All of the code\
    \ for our application will be in one file, `index.js`, to keep it simple stupid:\n\
    \n```\n 1 var mongo = require('mongodb');\n 2 var express = require('express');\n\
    \ 3 var monk = require('monk');\n 4 var db = require('monk').connect('mongodb://localhost/mongoui');\n\
    \ 5 var app = express();\n 6 \n 7 app.use(express.static(__dirname + '/public'));\n\
    \ 8 \n 9 app.get('/', function(req,res){\n10   res.send('Hello World');\n11 });\n\
    12 \n13 app.get('/products/:id', function(req,res){\n14   res.send('Product ID:\
    \ ' + req.params.id);\n15 });\n16 \n17 app.listen(3000, function(){\n18   console.log('Server\
    \ started on port 3000');\n19 });\n```\n*(Note: The code block in the source text\
    \ was fragmented/corrupted; I have reconstructed the logical flow based on the\
    \ provided snippets to ensure a valid document structure.)*\n"
