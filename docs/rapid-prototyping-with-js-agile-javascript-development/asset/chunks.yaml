    \nAny HTML element can have attributes. The most important of them are: class,\
    \ id, style, data-name, onclick, and other event attributes.\n\n**class**\n\n\
    Class attribute defines a class which is used for styling in CSS or DOM manipulation,\
    \ e.g.:\n\n```\n1 <p class=\"normal\">...</p>\n```\n\n**id**\n\nId attribute defines\
    \ an ID which is similar in purpose to element class but has to be unique, e.g.:\n\
    \n```\n1 <div id=\"footer\">...</div>\n```\n\n**style**\n\nStyle attribute defines\
    \ inline CSS to style an element, e.g.:\n\n```\n1 <font style=\"font-size:20px\"\
    >...</font>\n```\n\n**title**\n\nTitle attribute specifies additional information\
    \ which is usually presented in tooltips by most browsers, e.g.:\n\n```\n1 <a\
    \ title=\"Up-vote the answer\">...</a>\n```\n\n**data-name**\n\nData-name attribute\
    \ allows for meta data to be stored in DOM, e.g.:\n\n```\n1 <tr data-token=\"\
    fa10a70c-21ca-4e73-aaf5-d889c7263a0e\">...</tr>\n```\n\n**onclick**\n\nOnclick\
    \ attribute calls inline JavaScript code when click event happens, e.g.:\n\n```\n\
    1 <input type=\"button\" onclick=\"validateForm();\">...</a>\n```\n\n**onmouseover**\n\
    \nOnmouseover attribute is similar to `onclick` but for mouse hover events, e.g.:\n\
    \n```\n1 <a onmouseover=\"javascript: this.setAttribute('css','color:red')\">...</a>\n\
    ```\n\nOther HTML element attributes for inline JavaScript code are:\n\n*   onfocus:\
    \ when browser focuses on an element\n\n*   onblur: when browser focus leaves\
    \ an element\n\n*   onkeydown: when a user presses a keyboard key\n\n*   ondblclick:\
    \ when a user double-clicks the mouse\n\n*   onmousedown: when a user presses\
    \ a mouse button\n\n*   onmouseup: when a user releases a mouse button\n\n*  \
    \ onmouseout: when a user moves mouse out of the element area\n\n*   oncontextmenu:\
    \ when a user brings up a context menu\n\nThe full list of such events and a browser\
    \ compatibility table are presented in [Event compatibility tables](http://www.quirksmode.org/dom/events/index.html).\n\
    \nWe’ll use classes extensively with Twitter Bootstrap framework, while the use\
    \ of inline CSS and JavaScript code is generally a **bad** idea, so we’ll try\
    \ to avoid it. However, it’s good to know the names of the JavaScript events because\
    \ they are used all over the place in jQuery, Backbone.js and of course plain\
    \ JavaScript. To convert the list of attribute to a list of JS events, just remove\
    \ the prefixes `on`, e.g., `onclick` attribute means `click` event.\n\nMore information\
    \ is available at [Example: Catching a mouse click](https://developer.mozilla.org/en-US/docs/JavaScript/Getting_Started#Example:_Catching_a_mouse_click),\
    \ [Wikipedia](http://en.wikipedia.org/wiki/HTML) and [w3schools](http://www.w3schools.com/html/html_intro.asp).\n\
    \n#### 1.1.3 Cascading Style Sheets\n\nCascading Style Sheets, or CSS, is a way\
    \ to format and present content. An HTML document can have an external stylesheet\
    \ included in it by a **link** tag, as shown in the previous examples, or can\
    \ have CSS code directly inside of a **style** tag:\n\n```\n1 <style>\n2   body\
    \ {\n3     padding-top: 60px; /* 60px to make some space */\n4   }\n5 </style>\n\
    ```\n\nEach HTML element can have **id** and/or **class** attributes:\n\n```\n\
    1 <div id=\"main\" class=\"large\">\n2   Lorem ipsum dolor sit amet,  \n3   Duis\
    \ sit amet neque eu.\n4 </div>\n```\n\nIn CSS we access elements by their *id*,\
    \ *class*, tag name and in some edge cases by parent-child relationship or element\
    \ attribute value.\n\nThis sets a color of all the paragraphs (**p** tag) to grey\
    \ (`#999999`):\n\n```\n1 p {\n2   color:#999999;\n3 }\n```\n\nThis sets padding\
    \ of a div element with id main:\n\n```\n1 div#main {\n2   padding-bottom:2em;\n\
    3   padding-top:3em;\n4 }\n```\n\nThis sets the font size to 14 pixels for all\
    \ elements with a class `large`:\n\n```\n1 .large {\n2   font-size:14pt;\n3 }\n\
    ```\n\nThis hides div which are direct children of body element:\n\n```\n1 body\
    \ > div {\n2   display:none;\t\t\t\n3 }\n```\n\nThis sets the width to 150 pixels\
    \ for input which name attribute is email:\n\n```\n1 input[name=\"email\"] {\n\
    2   width:150px;\n3 }\n```\n\nMore information is available at [Wikipedia](http://en.wikipedia.org/wiki/Cascading_Style_Sheets)\
    \ and [w3schools](http://www.w3schools.com/css/).\n\nCSS3 is an upgrade to CSS\
    \ which includes new ways of doing things such as rounded corners, borders and\
    \ gradients, which were possible in regular CSS only with the help of PNG/GIF\
    \ images and by using other tricks.\n\nFor more information refer to [CSS3.info](http://css3.info),\
    \ [w3school](http://www.w3schools.com/css3/default.asp) and CSS3 vs. CSS comparison\
    \ article on [Smashing](http://coding.smashingmagazine.com/2011/04/21/css3-vs-css-a-speed-benchmark/).\n\
    \n#### 1.1.4 JavaScript\n\nJavaScript was started in 1995 at Netscape as LiveScript.\
    \ It has the same relationship with Java as a hamster and a ham. :-) These days,\
    \ JavaScript is used for both client and server-side web, as well as in desktop\
    \ application development.\n\nPutting JS code into a *script* tag is the easiest\
    \ way to use JavaScript in an HTML document:\n\n```\n1 <script type=\"text/javascript\"\
    \ language=\"javascript\">\n2   alert(\"Hello world!\");\n3   //simple alert dialog\
    \ window\n4 </script>\n```\n\nBe advised that mixing HTML and JS code is not a\
    \ good idea, so to separate them we can move the code to an external file, and\
    \ include it by setting source attribute `src=\"filename.js\"` on **script** tag,\
    \ e.g., for *app.js* resource:\n\n```\n1 <script src=\"js/app.js\" type=\"text/javascript\"\
    \ language=\"javascript\">\n2 </script>\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThe closing `</script>` tag is mandatory even with an empty\
    \ element like we have where we include the external source file. **Type** and\
    \ **language** attributes over the years became optional in modern browsers due\
    \ to the overwhelming JavaScript dominance. |\n\nOther ways to run JavaScript\
    \ include:\n\n*   Inline approach already covered above\n\n*   WebKit browser\
    \ Developer Tools and FireBug consoles\n\n*   The interactive Node.js shell\n\n\
    One of the advantages of the JavaScript language is that it’s loosely typed. This\
    \ loose/weak typing, as opposed to [strong typing](http://en.wikipedia.org/wiki/Strong_typing)\
    \ in languages like C and Java, makes JavaScript a better programming language\
    \ for prototyping. Here are some of the main types of JavaScript objects/classes\
    \ (there are not classes per se; objects inherit from objects):\n\n**Number primitives**\n\
    \nNumerical values, e.g.:\n\n```\n1 var num = 1;\n```\n\n**Number Object**\n\n\
    [Number](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Number)\
    \ object and its methods, e.g.:"
