    \ online LESS converter\n\nOther [LESS features](http://lesscss.org/#docs) include:\n\
    \n*   Pattern-matching\n\n*   Nested Rules\n\n*   Functions\n\n*   Namespaces\n\
    \n*   Scope\n\n*   Comments\n\n*   Importing\n\n### 3.5 Example of using third-party\
    \ API (Twitter) and jQuery\n\nThe example is for **purely** demonstrative purposes.\
    \ It is not a part of the main Chat application covered in later chapters. The\
    \ goal is to just illustrate the combination of jQuery, JSONP, and REST API technologies.\
    \ Please take a look through the code and don’t attempt to run it, because recently\
    \ Twitter retired its API v1.0\\. This application most likely **won’t runt as-is**.\
    \ If you still want to run this example do so at your own risk by following the\
    \ instructions below, downloading it from GitHub or copy-pasting it from the PDF\
    \ version.\n\n| ![information](images/leanpub_information.png) |  \n\n### Note\n\
    \nThis example was built with Twitter API v1.0 and might not work with Twitter\
    \ API v1.1, which requires user authentication for REST API calls. You can get\
    \ the necessary keys at [dev.twitter.com](https://dev.twitter.com). |\n\nIn this\
    \ example, we’ll use jQuery’s `$.ajax()` function. It has the following syntax:\n\
    \n```\n1 var request = $.ajax({\n2     url: url,\n3     dataType: \"jsonp\",\n\
    4     data: {page:page, ...},\n5     jsonpCallback: \"fetchData\"+page,\n6   \
    \  type: \"GET\" \n7 });\n```\n\nIn the code fragment of an `ajax()` function\
    \ above, we used following parameters:\n\n*   **url** is an endpoint of the API\n\
    \n*   **dataType** is the type of data we expect from the server, e.g., “json”,\
    \ “xml”\n\n*   **data** is the data to be sent to the server\n\n*   **jsonpCallback**\
    \ is a name of the function, in a string format, to be called after the request\
    \ comes back\n\n*   **type** is HTTP method of the request, e.g., “GET”, “POST”\n\
    \nFor more parameters and examples of `ajax()` function, go to [api.jquery.com/jQuery.ajax](http://api.jquery.com/jQuery.ajax/).\n\
    \nTo assign our function to a user-triggered event, we need to use the `click`\
    \ function from the jQuery library. The syntax is very simple:\n\n```\n1 $(\"\
    #btn\").click(function() {\n2 ...\n3 }\n```\n\n`$(\"#btn\")` is a jQuery object\
    \ which points to HTML element in the Document Object Model (DOM) with the **id**\
    \ of “btn”. An HTML code for the button itself, with Twitter Bootstrap classes\
    \ applied:\n\n```\n1 <input \n2   type=\"button\" \n3   class=\"primary btn\"\
    \ \n4   id=\"btn\" \n5   value=\"Show words in last 1000 tweets\"/>\n```\n\nTo\
    \ make sure that all of the elements we want to access/use are in the DOM, we\
    \ need to enclose *all* of the DOM manipulation code inside of the following jQuery\
    \ function:\n\n```\n1 $(document).ready(function(){\n2 ...\n3 }\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThis is a common mistake with dynamically generated HTML\
    \ elements. They are not available before they have been created and injected\
    \ into the DOM. |\n\nThe following one-page application prints the words in a\
    \ given Twitter user’s last 200 tweets sorted by frequency of use.\n\nFor example,\
    \ if **@jack** had tweeted:\n\n```\n1 \"hello world\"\n2 \"hello everyone, and\
    \ world\"\n3 \"hi world\"\n```\n\nThe result could be:\n\n```\n1 world\n2 hello\n\
    3 and\n4 hi\n5 everyone.\n```\n\nThe source code is available under the [rpjs/jquery](https://github.com/azat-co/rpjs/tree/master/jquery)\
    \ folder. It’s just one file app — **index.html**, and the main JavaScript algorithm\
    \ implemented this way:\n\n```\n1    $(document).ready(function(){\n```\n\nWe\
    \ use `document.ready` to postpone execution until the DOM is fully loaded.\n\n\
    ```\n1      $('#btn').click(function() { \n```\n\nThis lets us attach the click\
    \ event listener to an element with the “btn” class.\n\n```\n1        var username=$('#username').val();\n\
    2        //make ajax call, callback \n3        var url =\n4         'https://api.twitter.com/1/statuses/user_timeline.json?'\
    \ +\n5         'include_entities=true&include_rts=true&screen_name=' +\n6    \
    \     username + '&count=1000';\n```\n\nWe instantiate the username variable and\
    \ assign it a value from the input field with the username id attribute. On the\
    \ next line we assign Twitter REST API endpoint URL to a `url` variable. The endpoint\
    \ responds with tweets from a user’s timeline.\n\n```\n1        if (username!=''){\n\
    2          list = [ ];  //unique global list of words\n3          counter = {\
    \ };\n4          var pages = 0;\n5          getData(url);\n6        }\n7     \
    \   else {\n8          alert('Please enter Twitter username')\n9        }\n```\n\
    \nChecking for an empty username to avoid sending a bad request. If username is\
