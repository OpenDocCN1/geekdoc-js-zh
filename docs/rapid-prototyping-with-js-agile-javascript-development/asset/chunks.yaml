  trans: "\n\n*   利用 HTTP 方法：`GET`, `POST`, `DELETE`, `PUT`, `OPTIONS` 等。\n\n以下是一个用于消息集合（Message\
    \ Collection）的简单增删改查（CRUD）REST API 示例：\n\n| 方法 |  | | 含义 |\n| --- | --- | ---\
    \ |\n| GET | `/messages.json` | 以 JSON 格式返回消息列表 |\n| PUT | `/messages.json` |\
    \ 更新/替换所有消息并以 JSON 格式返回状态/错误 |\n| POST | `/messages.json` | 创建新消息并以 JSON 格式返回其\
    \ id |\n| GET | `/messages/{id}.json` | 以 JSON 格式返回 id 为 `{id}` 的消息 |\n| PUT |\
    \ `/messages/{id}.json` | 更新/替换 id 为 `{id}` 的消息，如果 `{id}` 消息不存在则创建它 |\n| DELETE\
    \ | `/messages/{id}.json` | 删除 id 为 `{id}` 的消息，以 JSON 格式返回状态/错误 |\n\nREST 不是一种协议；它是一种架构，从这个意义上说，它比协议\
    \ SOAP 更灵活。因此，如果我们想支持这些格式，REST API 的 URL 可以看起来像 `/messages/list.html` 或 `/messages/list.xml`。\n\
    \n`PUT` 和 `DELETE` 是[幂等方法](http://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol#Idempotent_methods_and_web_applications)，这意味着如果服务器接收到两个或多个相似请求，最终结果将相同。\n\
    \n`GET` 是无力的（nullipotent），而 `POST` 不是幂等的，可能会影响状态并产生副作用。\n\n关于 REST API 的进一步阅读可以参考\
    \ [维百科](http://en.wikipedia.org/wiki/Representational_state_transfer) 和 [REST\
    \ 简介绍文章](http://www.infoq.com/articles/rest-introduction)。\n\n## 2 设置\n\n**摘要**：关于工具\
    \ set 的建议；本地组件的逐步安装；云服务的准备工作。\n\n> *“我效率最高的一天之一是删掉了 1,000 行代码。”* - [Ken Thompson](http://en.wikipedia.org/wiki/Ken_Thompson)\n\
    \n### 2.1 本地设置\n\n### 2.1.1 开发文件夹\n\n如果你没有为你的 Web 开发项目专门的开发文件夹，可以在 `Documents`\
    \ 文件夹中创建一个 `Development` 文件夹（路径将为 `Documents/Development`）。为了编写代码示例，在你的 Web 开发项目文件夹内部创建一个\
    \ `rpjs` 文件夹，例如，如果你在 `Development` 文件夹内部创建一个 `rpjs` 文件夹，路径将为 `Documents/Development/rpjs`。你可以使用\
    \ Mac OS X 上的 Finder 或者在 OS X/Linux 系统上使用以下终端命令：\n\n```\n1 $ cd ~/Documents\n\
    2 $ mkdir Development\n3 $ cd Development\n4 $ mkdir rpjs\n```\n\n![初始开发环境设置。](img/screenshots----dev-env-setup.png)\n\
    \n初始开发环境设置。\n\n| ![tip](img/leanpub_tip.png) |  \n\n#### 提示\n\n要在终端中从当前目录打开 Mac\
    \ OS Finder 应用，只需输入并运行 `$ open .` 命令。\n\n要获取文件和文件夹列表，请使用此 UNIX/Linux 命令：\n\n```\n\
    1 $ ls \n```\n\n或者显示隐藏文件和文件夹，例如 `*.git`：\n\n```\n1 $ ls -lah\n```\n\n`$ ls` 的另一种替代方案是\
    \ `$ ls -alt`。`-lah` 和 `-alt` 选项的区别在于，后者按时间顺序排序，而前者按字母顺序排序。\n\n| ![information](img/leanpub_information.png)\
    \ |  \n\n#### 注意\n\n你可以使用 Tab 键自动补全文件和文件夹名称。\n\n稍后，你可以将示例复制到 `rpjs` 文件夹中，并在该文件夹中创建应用。\n\
    \n| ![information](img/leanpub_information.png) |  \n\n#### 注意\n\n另一个实用的功能是在 Mac\
    \ OS X 的 Finder 中拥有“在文件夹处新建终端”选项。要启用它，请打开你的“系统偏好设置”（可以使用 Command + Space，即 Spotlight\
    \ 来）。找到“键盘”并点击它。打开“键盘快捷键”并点击“服务”。勾选“在文件夹处新建终端”和“在文件夹处新建终端标签页”。关闭窗口（可选）。\n\n###\
    \ 2.1.2 浏览器\n\n我们建议下载你选择的最新版本的 [WebKit](http://en.wikipedia.org/wiki/WebKit) 或\
    \ [Gecko](http://en.wikipedia.org/wiki/Gecko_(layout_engine)) 浏览器：[Chrome](http://www.google.com/chrome)、[Safari](http://www.apple.com/safari/)\
    \ 或 [Firefox](http://www.mozilla.org/en-US/firefox/new/)。虽然 Chrome 和 Safari 已经内置了开发者工具，但\
    \ Firefox 需要 [Firebug](http://getfirebug.com/) 插件。\n\n![Chrome 开发者工具。(images/screenshots----chrome-dev-tools.png)\n\
    \nChrome 开发者工具。\n\nFirebug 和开发者工具允许开发者执行许多事情，例如：\n\n*   调试 JavaScript\n*   操纵\
    \ HTML 和 DOM 元素\n*   即时修改 CSS\n*   监控 HTTP 请求和响应\n*   运行分析并检查堆转储\n*   查看已加载的资源，如图像、CSS\
    \ 和 JS 文件\n\n![掌握 Web 开发者工具的 Google 教程。(images/screenshots----dev-tools-tutorials.png)\n\
    \n掌握 Web 开发者工具的 Google 教程。\n\n优秀的 Chrome DevTools 教程：\n\n*   [探索并掌握 Chrome DevTools](http://discover)\n\
    *   [Chrome DevTools](http://www.google.com)\n*   [Chrome DevTools](https://developers.google.com/)\n\
    \n### 2.1.3 IDE 和编辑器\n\n如果你已经熟悉并习惯使用 [Eclipse](http://www.eclipse.org/)、NetBeans](http://netbeans.org/)\
    \ 或 [Aptana](http://aptana.com/) 等 IDE，JS 的好处之一在于你不需要编译。我们强烈建议使用支持多种语言的轻量级编辑器。\n\
    \n以下是 Web 开发中常用的编辑器和 IDE 列表：\n\n*   [TextMate](http://macromates.com/)：仅限 Mac\
    \ OS X，免费 30 天试用。\n*   [Sublime Text](http://www.sublimetext.com/)：提供 Mac 和 Windows\
    \ 版本。\n*   [Coda](http://panic.com/)：内置 FTP 浏览器和预览的全功能编辑器。\n*   [Aptana Studio](http://aptana.com/)：内置终端和许多工具的全尺寸\
    \ IDE。\n*   [Notepad++](http://notepad-plus-plus.org/)：仅限 Windows 的轻量级编辑器。\n*\
    \   [WebStorm](http://www.jetbrains.com/webstorm/)：支持 Node.js 调试的功能丰富的 IDE。\n\n\
    ![WebStorm IDE 首页。(images/screenshots----webstorm.png)\n\nWebStorm IDE 首页。\n\n\
    ### 2.1.4 版本控制系统\n\n[版本控制系统](http://en.wikipedia.org/wiki/Revision_control)即使在单人开发的情况下也是必不可少的。此外，许多云服务（例如\
    \ Heroku）需要 Git 进行部署。我们也强烈建议习惯 Git 和 Git 终端命令，而不是使用图形界面的 Git 客户端/应用：[GitX](http://gitx.frim.nl/)、[Gitbox](http://www.gitboxapp.com/)\
    \ 或 [GitHub for Mac](http://mac.github.com/)。Subversion 是一种非分布式版本控制系统。这篇文章对比了\
    \ [Git 与 Subversion](https://git.wiki.kernel.org/index.php/GitSvnComparison)。是在机器上安装和设置\
    \ Git 的步骤：\n\n1.  从 [`git-scm.com/downloads`](http://git-scm.com/downloads) 下载适用于你系统的最新版本![下载最新版本的\
    \ Git。(images/screenshots----git-install.png)\n\n    下载最新版本的 Git。\n\n2.  从下载的\
    \ `*.dmg` 软件包安装 Git，即运行 `*.pkg` 文件并按照向导操作。\n\n"
- fmt: "\n3. Find the terminal app by using `Command + Space`, a.k.a. Spotlight (please\
    \ see the screenshot below), on OS X. For Windows you could use [PuTTY](http://www.chiark.greenend.org.uk/~sgtatham/putty/)\
    \ or [Cygwin](http://www.cygwin.com/).![Using Spotlight to find and run an application.](images/screenshots----spotlight.png)\n\
    \nUsing Spotlight to find and run an application.\n\n4. In your terminal, type\
    \ these commands, substituting `John Doe` and `johndoe@example.com` with your\
    \ name and email:\n\n```\n1  $ git config --global user.name \"John Doe\"\t\t\t\
    \t\n2  $ git config --global user.email johndoe@example.com \n```\n\n5. To check\
    \ the installation, run command:\n\n```\n1  $ git version\n```\n\n6. You should\
    \ see something like this in your terminal window (your version might vary; in\
    \ our case it’s 1.8.3.2):\n\n```\n1  git version 1.8.3.2\n```\n\n![Configuring\
    \ & Testing Git installation.](images/screenshots----git-configure.png)\n\nConfiguring\
    \ & Testing Git installation.\n\nGeneration of SSH keys and uploading them to\
    \ SaaS/PaaS websites will be covered later.\n\n### 2.1.5 Local HTTP Servers\n\n\
    While you can do most of the front-end development without a local HTTP server,\
    \ it is needed for loading files with HTTP Requests/AJAX calls. Also, it’s just\
    \ a good practice in general to use a local HTTP server. This way, your development\
    \ environment is as close to the production environment as possible. You might\
    \ want to consider the following modifications of the Apache web server:\n\n*\
    \ [MAMP](http://www.mamp.info/en/index.html): Mac, Apache, MySQL, PHP personal\
    \ web server for Mac OS X\n* [MAMP Stack](http://bitnami.com/stack/mamp): Mac\
    \ app with PHP, Apache, MySQL and phpMyAdmin stack build by BitNami ([Apple app\
    \ store](https://itunes.apple.com/es/app/mamp-stack/id571310406?l=en))\n* [XAMPP](http://www.apachefriends.org/en/xampp.html):\
    \ Apache distribution containing MySQL, PHP and Perl for Windows, Mac, Linux and\
    \ Solaris.\n\n![MAMP for Mac home page.](images/screenshots----mamp.png)\n\nMAMP\
    \ for Mac home page.\n\nMAMP, MAMP Stack and XAMPP have intuitive Graphical User\
    \ Interfaces (GUIs) which allow you to change configurations and host file settings.\n\
    \n| ![information](images/leanpub_information.png) |  \n\n### Note\n\nNode.js\
    \ as many other back-end technologies have their own servers for development.\
    \ |\n\n### 2.1.6 Database: MongoDB\n\nThe following steps are better suited for\
    \ Max OS X/Linux based systems but with some modification can be used for Windows\
    \ systems as well, i.e., `$PATH` variable - step #3. Below, we describe the MongoDB\
    \ installation from the official package, because we found that this approach\
    \ is more robust and leads to less conflicts. However, there are many [other ways\
    \ to install it on Mac](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x/),\
    \ for example using Brew, as well as on [other systems](http://docs.mongodb.org/manual/installation/).\n\
    \n1. MongoDB can be downloaded at [http://www.mongodb.org/downloads](http://www.mongodb.org/downloads).\
    \ For the latest Apple laptops, like MacBook Air, select OS X 64-bit version.\
    \ The owners of older Macs should browse the link [http://dl.mongodb.org/dl/osx/i386](http://dl.mongodb.org/dl/osx/i386).\n\
    \n| ![tip](images/leanpub_tip.png) |  \n\n### Tip\n\nTo figure out the architecture\
    \ type of your processor, type the `$uname -p` in the command line. |\n\n1. Unpack\
    \ the package into your web development folder (`~/*Documents/Development*` or\
    \ any other). If you want, you could install MongoDB into `/usr/local/mongodb`\
    \ folder.\n\n2. **Optional**: If you would like to access MongoDB commands from\
    \ anywhere on your system, you need to add your `mongodb` path to the `$PATH`\
    \ variable. For Mac OS X the open system paths file with:\n\n```\n1  sudo vi /etc/paths\n\
    ```\n\nor, if you prefer TextMate:\n\n```\n1  mate /etc/paths \n```\n\nAnd add\
    \ this line to the `/etc/paths` file:\n\n```\n1  /usr/local/mongodb/bin\n```\n\
    \n3. Create a data folder; by default, MongoDB uses `/data/db`. Please note that\
    \ this might be different in a new versions of MongoDB. To create it, type and\
    \ execute the following commands in the terminal:\n\n```\n1  $ sudo mkdir -p /data/db\n\
    2  $ sudo chown `id -u` /data/db\n```\n\n![Initial setup for MongoDB: create the\
    \ data directory.](images/screenshots----mongodb-data.png)\n\nInitial setup for\
    \ MongoDB: create the data directory.\n\nIf you prefer to use path other than\
    \ `/data/db` you could specify it using the `--dbpath` option to `mongod` (main\
    \ MongoDB service).\n\n4. Go to the folder where you have `bin`. From there, type\
    \ the following:\n\n```\n1  $ ./mongod\n```\n\n![Starting-up MongoDB.](images/screenshots----start.png)\n\
    \nStarting-up MongoDB.\n\n5. If you see something like\n\n```\n1  waiting for\
    \ connections\n```\n\nit means the server is running. To close the process use\
    \ `control + c`. If you use `control + z` it will put the process to sleep (or\
    \ detach the terminal window); in this case, you might end up with the lock on\
    \ data files and will have to use the kill command or Activity Monitor, and manually\
    \ delete the locked file in the data folder. In vanilla Mac Terminal `command\
    \ + .` is an alternative to `control + c`.\n\n6. Open another terminal at the\
    \ same folder and execute:\n\n```\n1  $ ./mongo\n```\n\nIt should show something\
    \ like this (we use v.0.6, but your version might vary):\n\n7. Then type and execute:\n\
    \n```\n1  > db.test.save({ a: 1 })\n2  > db.test.find()\n```\n\nIf you see that\
    \ your record is saved, then everything went:\n\n![Running MongoDB client and\
    \ storing data.](images/screenshots----mongodb-console.png)\n\nRunning MongoDB\
    \ client and storing data.\n\nCommands `find` and `save` do exactly what you think\
    \ they do.\n\nDetailed instructions are also available at MongoDB.org: [Install\
    \ MongoDB on OS X](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x).\
    \ For Windows, users there is a good walk-through article: [Installing MongoDB](http://www.tuanle.com/blog/2011/10/installing/).\n\
    \n| ![information](images/leanpub_information.png) |  \n\n### Note\n\nMAMP and\
    \ XAMPP applications come with MySQL — open-source traditional SQL database, and\
    \ phpMyAdmin — web interface for MySQL database. |\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nOn Max OS X (and most Unix systems), to close the process\
    \ use `control + c`. If you use `control + z` it will put the process to sleep\
    \ (or detach the terminal window); in this case, you might end up with the lock\
    \ on data files and will have to use the kill command or Activity Monitor, and\
    \ manually delete the locked file in the data folder. In vanilla Mac Terminal\
    \ `command + .` is an alternative to `control + c`. |\n\n### 2.1.7 Other Components\n\
    \n##### 2.1.7.1 Node.js Installation\n\nNode.js is available at [http://nodejs.org/#download](http://nodejs.org/#download)\
    \ (please see the screenshot below). The installation is trivial, i.e., download\
    \ the archive, run the `*.pkg` package installer. To check the installation of\
    \ Node.js you could type and execute:\n\n```\n1 $ node -v\n```\n\nIt should show\
    \ something similar to this (we use v.0.8.1, but your version might vary):\n"
