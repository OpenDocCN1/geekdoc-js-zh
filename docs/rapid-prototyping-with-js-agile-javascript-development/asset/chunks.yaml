    \ new <path> -template basic\n```\n\nor use a shortcut:\n\n```\n1 $ wintersmith\
    \ new <path> -T basic\n```\n\nSimilar to Ruby on Rails scaffolding, Wintersmith\
    \ will generate a basic skeleton with **contents** and **templates** folders.\
    \ To preview a website, run these commands:\n\n```\n1 $ cd <path>\n2 $ wintersmith\
    \ preview\n3 $ open http://localhost:8080\n```\n\nMost of the changes will be\
    \ updates automatically in the preview mode, except for the [config.json file](https://github.com/jnordberg/wintersmith#config).\n\
    \nImages, CSS, JavaScript and other files go into the **contents** folder. The\
    \ Wintersmith generator has the following logic:\n\n1.  looks for *.md files in\
    \ the contents folder\n\n2.  reads [metadata](https://github.com/jnordberg/wintersmith#the-page-plugin)\
    \ such as the template name\n\n3.  processes *.jade [templates](https://github.com/jnordberg/wintersmith#templates)\
    \ per metadata in *.md files\n\nWhen you’re done with your static site, just run:\n\
    \n```\n1 $ wintersmith build\n```\n\n#### 8.4.2 Other Static Site Generators\n\
    \nHere are some of the other Node.js static site generators:\n\n*   [DocPad](https://github.com/bevry/docpad#readme)\n\
    \n*   [Blacksmith](https://github.com/flatiron/blacksmith)\n\n*   [Scotch](https://github.com/techwraith/scotch)\n\
    \n*   [Wheat](https://github.com/creationix/wheat)\n\n*   [Petrify](https://github.com/caolan/petrify)\n\
    \nA more detailed overview of these static site generators is available in the\
    \ post [Node.js Based Static Site Generators](http://blog.bmannconsulting.com/node-static-site-generators/).\n\
    \nFor other languages and frameworks like Rails and PHP, take a look at [Static\
    \ Site Generators by GitHub Watcher Count](https://gist.github.com/2254924) and\
    \ the “[mother of all site generator lists](http://nanoc.stoneship.org/docs/1-introduction/#similar-projects)”.\n\
    \n### 8.5 Intro to Express.js: Simple REST API app with Monk and MongoDB\n\n####\
    \ 8.5.1 REST API app with Express.js and Monk\n\nThis app is a start of a [mongoui](http://gitbhub.com/azat-co/mongoui)\
    \ project — a phpMyAdmin counterpart for MongoDB written in Node.js. The goal\
    \ is to provide a module with a nice web admin user interface. It will be something\
    \ like [Parse.com](http://parse.com), [Firebase.com](http://firebase.com), [MongoHQ](http://mongohq.com)\
    \ or [MongoLab](http://mongolab.com) has, but without tying it to any particular\
    \ service. Why do we have to type `db.users.findOne({'_id':ObjectId('...')})`\
    \ anytime we want to look up the user information? The alternative [MongoHub](http://mongohub.todayclose.com/)\
    \ Mac app is nice (and free) but clunky to use and not web-based.\n\nRuby enthusiasts\
    \ like to compare Express to the [Sinatra](http://www.sinatrarb.com/) framework.\
    \ It’s similarly flexible in the way developers can build their apps. Application\
    \ routes are set up in a similar manner, i.e., `app.get('/products/:id', showProduct);`.\
    \ Currently Express.js is at version number 3.1\\. In addition to Express, we’ll\
    \ use the [Monk](https://github.com/LearnBoost/monk) module.\n\nWe’ll use [Node\
    \ Package Manager](http://npmjs.org), which usually comes with a Node.js installation.\
    \ If you don’t have it already, you can get it at [npmjs.org](http://npmjs.org).\n\
    \nCreate a new folder and NPM configuration file, **package.json**, in it with\
    \ the following content:\n\n```\n 1 {\n 2   \"name\": \"mongoui\",\n 3   \"version\"\
    : \"0.0.1\",\n 4   \"engines\": {\n 5     \"node\": \">= v0.6\"\n 6   },\n 7 \
    \  \"dependencies\": {\n 8     \"mongodb\":\"1.2.14\",\n 9     \"monk\": \"0.7.1\"\
    ,\n10     \"express\": \"3.1.0\"\n11   }\n12 }\n```\n\nNow run `npm install` to\
    \ download and install modules into the **node_module** folder. If everything\
    \ went okay you’ll see bunch of folders in **node_modules** folders. All of the\
    \ code for our application will be in one file, **index.js**, to keep it simple\
    \ stupid:\n\n```\n 1 var mongo = require('mongodb');\n 2 var express = require('express');\n\
    \ 3 var monk = require('monk');\n 4 var db =  monk('localhost:27017/test');\n\
    \ 5 var app = new express();\n 6 \n 7 app.use(express.static(__dirname + '/public'));\n\
    \ 8 app.get('/',function(req,res){\n 9   db.driver.admin.listDatabases(function(e,dbs){\n\
    10       res.json(dbs);\n11   });\n12 });\n13 app.get('/collections',function(req,res){\n\
    14   db.driver.collectionNames(function(e,names){\n15     res.json(names);\n16\
    \   })\n17 });\n18 app.get('/collections/:name',function(req,res){\n19   var collection\
    \ = db.get(req.params.name);\n20   collection.find({},{limit:20},function(e,docs){\n\
    21     res.json(docs);\n22   })\n23 });\n24 app.listen(3000)\n```\n\nLet’s break\
    \ down the code piece by piece. Module declaration:\n\n```\n1 var mongo = require('mongodb');\n\
    2 var express = require('express');\n3 var monk = require('monk');\n```\n\nDatabase\
    \ and Express application instantiation:\n\n```\n1 var db =  monk('localhost:27017/test');\n\
    2 var app = new express();\n```\n\nTell Express application to load and server\
    \ static files (if there are any) from the public folder:\n\n```\n1 app.use(express.static(__dirname\
    \ + '/public'));\n```\n\nHome page, a.k.a. root route, set up:\n\n```\n1 app.get('/',function(req,res){\n\
    2   db.driver.admin.listDatabases(function(e,dbs){\n3       res.json(dbs);\n4\
    \   });\n5 });\n```\n\n`get()` function just takes two parameters: string and\
    \ function. The string can have slashes and colons — for example, `product/:id`.\
    \ The function must have two parameters: request and response. Request has all\
    \ of the information like query string parameters, session and headers, and response\
    \ is an object to which we output the results. In this case, we do it by calling\
    \ the `res.json()` function.\n\n`db.driver.admin.listDatabases()`, as you might\
    \ guess, gives us a list of databases in an asynchronous manner.\n\nTwo other\
    \ routes are set up in a similar manner with the `get()` function:\n\n```\n 1\
    \ app.get('/collections',function(req,res){\n 2   db.driver.collectionNames(function(e,names){\n\
    \ 3     res.json(names);\n 4   })\n 5 });\n 6 app.get('/collections/:name',function(req,res){\n\
    \ 7   var collection = db.get(req.params.name);\n 8   collection.find({},{limit:20},function(e,docs){\n\
    \ 9     res.json(docs);\n10   })\n11 });\n```\n\nExpress conveniently supports\
    \ other HTTP verbs like post and update. In the case of setting up a post route,\
    \ we write this:\n\n```\n1 app.post('product/:id',function(req,res) {...});\n\
    ```\n\nExpress also has support for middleware. Middleware is just a request function\
    \ handler with three parameters: `request`, `response`, and `next`. For example:\n\
    \n```\n 1 app.post('product/:id', \n 2   authenticateUser, \n 3   validateProduct,\
    \ \n 4   addProduct\n 5 );\n 6 \n 7 function authenticateUser(req,res, next) {\n\
    \ 8   //check req.session for authentication\n 9   next();\n10 }\n11 \n12 function\
    \ validateProduct (req, res, next) {\n13    //validate submitted data\n14    next();\n\
    15 }\n16 \n17 function addProduct (req, res) {\n18   //save data to database\n\
    19 }\n```\n\nvalidateProduct and authenticateProduct are middlewares. They are\
    \ usually put into separate file (or files) in big projects.\n\nAnother way to\
    \ set up middleware in the Express application is to utilize the `use()` function.\
    \ For example, earlier we did this for static assets:\n\n```\n1 app.use(express.static(__dirname\
    \ + '/public'));\n```\n\nWe can also do it for error handlers:\n\n```\n1 app.use(errorHandler);\n\
    ```\n\nAssuming you have mongoDB installed, this app will connect to it ([localhost:27017](http://localhost:27017))\
    \ and display the collection name and items in collections. To start the mongo\
    \ server:\n\n```\n1 $ mongod\n```\n\nto run the app (keep the **mongod** terminal\
    \ window open):"
