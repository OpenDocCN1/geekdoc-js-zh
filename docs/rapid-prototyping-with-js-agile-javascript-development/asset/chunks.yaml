  trans: "\nWintersmith 允许内容和模板使用不同的插件，你甚至可以[编写自己的插件](https://github.com/jnordberg/wintersmith#content-plugins)。\n\
    \n## 8.4.1 入门 Wintersmith\n\n在 [github.com/jnordberg/wintersmith](https://github.com/jnordberg/wintersmith)\
    \ 上有一份快速上手指南。\n\n要全局安装 Wintersmith，请带有 `-g` 和 `sudo` 运行 NPM：\n\n```\n1 $ sudo\
    \ npm install wintersmith -g\n```\n\n然后运行以下命令使用默认博客模板：\n\n```\n1 $ wintersmith\
    \ new <path>\n```\n\n或者创建一个空站点：\n\n```\n1 $ wintersmith new <path> -template basic\n\
    ```\n\n或者使用快捷键：\n\n```\n1 $ wintersmith new <path> -T basic\n```\n\n类似于 Ruby on\
    \ Rails 的脚手架工具，Wintersmith 将生成一个包含 `contents` 和 `templates` 文件夹的基础骨架。如需预览网站，请运行这些命令：\n\
    \n```\n1 $ cd <path>\n2 $ wintersmith preview\n3 $ open http://localhost:8080\n\
    ```\n\n大部分更改会在预览模式下自动更新，但 [config.json 文件](https://github.com/jnordberg/wintersmith#config)\
    \ 除外。\n\n图片、CSS、JavaScript 和其他文件放入 `contents` 文件夹。Wintersmith 生成器具有以下逻辑：\n\n1.\
    \ 在 contents 文件夹中查找 `*.md` 文件\n2. 读取[元数据](https://github.com/jnordberg/wintersmith#the-page-plugin)，例如模板名称\n\
    3. 根据 `*.md` 文件中的元数据处理 `*.jade` [模板](https://github.com/jnordberg/wintersmith#templates)\n\
    \n当你完成静态网站构建后，只需运行：\n\n```\n1 $ wintersmith build\n```\n\n## 8.4.2 其他静态网站生成器\n\
    \n以下是其他一些 Node.js 静态网站生成器：\n\n* [DocPad](https://github.com/bevry/docpad#readme)\n\
    * [Blacksmith](https://github.com/flatiron/blacksmith)\n* [Scotch](https://github.com/techwraith/scotch)\n\
    * [Wheat](https://github.com/creationix/wheat)\n* [Petrify](https://github.com/caolan/petrify)\n\
    \n关于这些静态网站生成器的更详细概述可以参考文章 [Node.js Based Static Site Generators](http://blog.bmannconsulting.com/node-static-site-generators/)。\n\
    \n对于 Rails 和 PHP 等其他语言和框架，请查看[按 GitHub Star 排序的静态网站生成器](https://gist.github.com/2254924)\
    \ 和“[所有网站生成器列表](http://nanoc.stoneship.org/docs/1-introduction/#similar-projects)”。\n\
    \n## 8.5 Express.js 简介：使用 Monk 和 MongoDB 构建简单 REST API 应用\n\n### 8.5.1 使用 Express.js\
    \ 和 Monk 构建的 REST API 应用\n\n此应用是 [mongoui](http://gitbhub.com/azat-co/mongoui)\
    \ 的起点——这是一个用 Node.js 编写的 MongoDB 版 phpMyAdmin。其目标是提供一个具有良好 Web 管理用户界面的模块。它将类似于\
    \ [Parse.com](http://parse.com)、[Firebase.com](http://firebase.com)、[MongoHQ](http://mongohq.com)\
    \ 或 [MongoLab](http://mongolab.com) 的功能，但不会绑定到任何特定服务。为什么我们每次想查询用户信息时都必须输入 `db.users.findOne({'_id':ObjectId('...')})`\
    \ 呢？替代 [MongoHub](http://mongohub.todayclose.com/) Mac 应用很好（且免费），但使用起来很笨且不是基于\
    \ Web 的。\n\nRuby 爱好者喜欢将 Express 与 [Sinatra](http://www.sinatrarb.com/) 框架进行比较。在开发者构建应用方面，它们同样灵活。应用程序路由以类似的方式设置，例如\
    \ `app.get('/products/:id', showProduct);`。目前 Express.js 的版本号为 3.1。除了 Express\
    \ 之外，我们还将使用 [Monk](https://github.com/LearnBoost/monk) 模块。\n\n我们将使用 [Node Package\
    \ Manager](http://npmjs.org)，它通常随 Node.js 一起安装。如果你还没有，可以去 [npmjs.org](http://npmjs.org)\
    \ 获取。\n\n创建一个新文件夹并在其中创建 NPM 配置文件 `package.json`，内容如下：\n\n```\n 1 {\n 2   \"name\"\
    : \"mongoui\",\n 3   \"version\": \"0.0.1\",\n 4   \"engines\": {\n 5     \"node\"\
    : \">= v0.6\"\n 6   },\n 7   \"dependencies\": {\n 8     \"mongodb\":\"1.2.14\"\
    ,\n 9     \"monk\": \"0.7.1\",\n10     \"express\": \"3.1.0\"\n11   }\n12 }\n\
    ```\n\n现在运行 `npm install` 下载并安装模块到 `node_module` 文件夹。如果一切顺利，你将在 `node_modules`\
    \ 文件夹中看到许多文件夹。我们应用程序的所有代码将放在文件 `index.js` 中，以保持简单直接（KISS）：\n\n```\n 1 var mongo\
    \ = require('mongodb');\n 2 var express = require('express');\n 3 var monk = require('monk');\n\
    \ 4 var db = require('monk').connect('mongodb://localhost/mongoui');\n 5 var app\
    \ = express();\n 6 \n 7 app.use(express.static(__dirname + '/public'));\n 8 \n\
    \ 9 app.get('/', function(req,res){\n10   res.send('Hello World');\n11 });\n 12\
    \ \n 13 app.get('/products/:id', function(req,res){\n14   res.send('Product ID:\
    \ ' + req.params.id);\n15 });\n 16 \n 17 app.listen(3000, function(){\n18   console.log('Server\
    \ started on port 3000');\n19 });\n```\n"
- fmt: "\n```\n1 $ node .\n```\n\nor\n\n```\n1 $ node index.js\n```\n\nTo see the\
    \ app working, open [localhost:3000](http://localhost:3000) in Chrome with the\
    \ [JSONViewer](https://chrome.google.com/webstore/detail/jsonview/chklaanhfefbnpoihckbnefhakgolnmc?hl=en)\
    \ extension (to render JSON nicely).\n\n## 8.6 Intro to Express.js: Parameters,\
    \ Error Handling and Other Middleware\n\n### 8.6.1 Request Handlers\n\nExpress.js\
    \ is a node.js framework that, among other things, provides a way to organize\
    \ routes. Each route is defined via a method call on an application object with\
    \ a URL pattern as a first parameter (RegExp is also supported) — for example:\n\
    \n```\n1 app.get('api/v1/stories/', function(res, req){\n2   ...\n3 })\n```\n\n\
    or, for a POST method:\n\n```\n1 app.post('/api/v1/stories'function(req,res){\n\
    2   ...\n3 })\n```\n\nNeedless to say, `DELETE` and `PUT` methods are [supported\
    \ as well](http://expressjs.com/api.html#app.VERB).\n\nThe callbacks that we pass\
    \ to the `get()` or `post()` methods are called request handlers because they\
    \ take requests (`req`), process them, and write to response (`res`) objects.\
    \ For example:\n\n```\n1 app.get('/about', function(req,res){\n2   res.send('About\
    \ Us: ...');\n3 });\n```\n\nWe can have multiple request handlers — hence the\
    \ name `middleware`. They accept a third parameter, `next`, calling which (`next()`)\
    \ will switch the execution flow to the next handler:\n\n```\n 1 app.get('/api/v1/stories/:id',\
    \ function(req,res, next) {\n 2   //do authorization\n 3   //if not authorized\
    \ or there is an error \n 4   // return next(error);\n 5   //if authorized and\
    \ no errors\n 6   return next();\n 7 }), function(req,res, next) {\n 8   //extract\
    \ id and fetch the object from the database\n 9   //assuming no errors, save story\
    \ in the request object\n110   req.story = story;\n 11   return next();\n 12 }),\
    \ function(req,res) {\n 13   //output the result of the database search\n 14 \
    \  res.send(res.story);\n 15 });\n```\n\nThe ID of a story in URL pattern is a\
    \ query string parameter which we need for finding matching items in the database.\n\
    \n### 8.6.2 Parameters Middleware\n\nParameters are values passed in a query string\
    \ of a URL of the request. If we didn’t have Express.js or a similar library and\
    \ had to use just the core Node.js modules, we’d have to extract parameters from\
    \ [HTTP.request](http://nodejs.org/api/http.html#http_http_request_options_callback)\
    \ object via some `require('querystring').parse(url)` or `require('url').parse(url,\
    \ true)` functions trickery.\n\nThanks to [Connect framework](http://www.senchalabs.org/connect/)\
    \ and the people at [VisionMedia](https://github.com/visionmedia/express), Express.js\
    \ already has support for parameters, error handling and many other important\
    \ features in the form of middlewares. This is how we can plug param middleware\
    \ in our app:\n\n```\n 1 app.param('id', function(req,res, next, id){\n 2   //do\
    \ something with id\n 3   //store id or other info in req object\n 4   //call\
    \ next when done\n 5   next();\n 6 });\n 7 \n 8 app.get('/api/v1/stories/:id',function(req,res){\n\
    \ 9   //param middleware will be execute before and\n10   //we expect req object\
    \ already have needed info\n11   //output something\n12   res.send(data);\n13\
    \ });\n```\n\nFor example:\n\n```\n 1 app.param('id', function(req,res, next,\
    \ id){\n 2   req.db.get('stories').findOne({_id:id}, function (e, story){\n 3\
    \     if (e) return next(e);\n 4     if (!story) return next(new Error('Nothing\
    \ is found'));\n 5     req.story = story;\n 6     next();\n 7   });\n 8 });\n\
    \ 9 \n10 app.get('/api/v1/stories/:id',function(req,res){\n11   res.send(req.story);\n\
    12 });\n```\n\nOr we can use multiple request handlers, but the concept remains\
    \ the same: we can expect to have the `req.story` object or an error thrown prior\
    \ to the execution of this code, so we abstract the common code/logic of getting\
    \ parameters and their respective objects:\n\n```\n1 app.get('/api/v1/stories/:id',\
    \ function(req,res, next) {\n2   //do authorization\n3   }),\n4   //we have an\
    \ object in req.story so no work is needed here\n5   function(req,res) {\n6  \
    \ //output the result of the database search\n7   res.send(story);\n8 });\n```\n\
    \nAuthorization and input sanitation are also good candidates for residing in\
    \ the middlewares.\n\nThe function `param()` is especially cool because we can\
    \ combine different keys, e.g.:\n\n```\n 1 app.param('id', function(req,res, next,\
    \ id){\n```\n\n### 8.6.3 Error Handling\n\nError handling is typically used across\
    \ the application, so we implement it as a middleware.\n\n"
  raw: "```\n1 $ node .\n```\n\nor\n\n```\n1 $ node index.js\n```\n\nTo see the app\
    \ working, open [localhost:3000](http://localhost:3000) in Chrome with the [JSONViewer](https://chrome.google.com/webstore/detail/jsonview/chklaanhfefbnpoihckbnefhakgolnmc?hl=en)\
    \ extension (to render JSON nicely).\n\n### 8.6 Intro to Express.js: Parameters,\
    \ Error Handling and Other Middleware\n\n#### 8.6.1 Request Handlers\n\nExpress.js\
    \ is a node.js framework that, among other things, provides a way to organize\
    \ routes. Each route is defined via a method call on an application object with\
    \ a URL patter as a first parameter (RegExp is also supported) — for example:\n\
    \n```\n1 app.get('api/v1/stories/', function(res, req){\n2   ...\n3 })\n```\n\n\
    or, for a POST method:\n\n```\n1 app.post('/api/v1/stories'function(req,res){\n\
    2   ...\n3 })\n```\n\nNeedless to say, DELETE and PUT methods are [supported as\
    \ well](http://expressjs.com/api.html#app.VERB).\n\nThe callbacks that we pass\
    \ to the `get()` or `post()` methods are called request handlers because they\
    \ take requests (`req`), process them, and write to response (`res`) objects.\
    \ For example:\n\n```\n1 app.get('/about', function(req,res){\n2   res.send('About\
    \ Us: ...');\n3 });\n```\n\nWe can have multiple request handlers — hence the\
    \ name *middleware*. They accept a third parameter, `next`, calling which (`next()`)\
    \ will switch the execution flow to the next handler:\n\n```\n 1 app.get('/api/v1/stories/:id',\
    \ function(req,res, next) {\n 2   //do authorization\n 3   //if not authorized\
    \ or there is an error \n 4   // return next(error);\n 5   //if authorized and\
    \ no errors\n 6   return next();\n 7 }), function(req,res, next) {\n 8   //extract\
    \ id and fetch the object from the database\n 9   //assuming no errors, save story\
    \ in the request object\n10   req.story = story;\n11   return next();\n12 }),\
    \ function(req,res) {\n13   //output the result of the database search\n14   res.send(res.story);\n\
    15 });\n```\n\nThe ID of a story in URL patter is a query string parameter which\
    \ we need for finding matching items in the database.\n\n#### 8.6.2 Parameters\
    \ Middleware\n\nParameters are values passed in a query string of a URL of the\
    \ request. If we didn’t have Express.js or a similar library and had to use just\
    \ the core Node.js modules, we’d have to extract parameters from [HTTP.request](http://nodejs.org/api/http.html#http_http_request_options_callback)\
    \ object via some `require('querystring').parse(url)` or `require('url').parse(url,\
    \ true)` functions trickery.\n\nThanks to [Connect framework](http://www.senchalabs.org/connect/)\
    \ and the people at [VisionMedia](https://github.com/visionmedia/express), Express.js\
    \ already has support for parameters, error handling and many other important\
    \ features in the form of middlewares. This is how we can plug param middleware\
    \ in our app:\n\n```\n 1 app.param('id', function(req,res, next, id){\n 2   //do\
    \ something with id\n 3   //store id or other info in req object\n 4   //call\
    \ next when done\n 5   next();\n 6 });\n 7 \n 8 app.get('/api/v1/stories/:id',function(req,res){\n\
    \ 9   //param middleware will be execute before and\n10   //we expect req object\
    \ already have needed info\n11   //output something\n12   res.send(data);\n13\
    \ });\n```\n\nFor example:\n\n```\n 1 app.param('id', function(req,res, next,\
    \ id){\n 2   req.db.get('stories').findOne({_id:id}, function (e, story){\n 3\
    \     if (e) return next(e);\n 4     if (!story) return next(new Error('Nothing\
    \ is found'));\n 5     req.story = story;\n 6     next();\n 7   });\n 8 });\n\
    \ 9 \n10 app.get('/api/v1/stories/:id',function(req,res){\n11   res.send(req.story);\n\
    12 });\n```\n\nOr we can use multiple request handlers, but the concept remains\
    \ the same: we can expect to have the `req.story` object or an error thrown prior\
    \ to the execution of this code, so we abstract the common code/logic of getting\
    \ parameters and their respective objects:\n\n```\n1 app.get('/api/v1/stories/:id',\
    \ function(req,res, next) {\n2   //do authorization\n3   }),\n4   //we have an\
    \ object in req.story so no work is needed here\n5   function(req,res) {\n6  \
    \ //output the result of the database search\n7   res.send(story);\n8 });\n```\n\
    \nAuthorization and input sanitation are also good candidates for residing in\
    \ the middlewares.\n\nThe function `param()` is especially cool because we can\
    \ combine different keys, e.g.:\n\n```\n1 app.get('/api/v1/stories/:storyId/elements/:elementId',\n\
    2   function(req,res){\n3     res.send(req.element);\n4   }\n5 );\n```\n\n####\
    \ 8.6.3 Error Handling\n\nError handling is typically used across the whole application,\
    \ so it’s best to implement it as a middleware. It has the same parameters plus\
    \ one more, `error`:\n\n```\n1 app.use(function(err, req, res, next) {\n2   //do\
    \ logging and user-friendly error message display\n3   res.send(500);\n4 })\n\
    ```\n\nIn fact, the response can be anything:\n\n**JSON string**\n\n```\n1 app.use(function(err,\
    \ req, res, next) {\n2   //do logging and user-friendly error message display\n\
    3   res.send(500, {status:500, \n4     message: 'internal error', \n5     type:'internal'}\n\
    6   );\n7 })\n```\n\n**Text message**\n\n```\n1 app.use(function(err, req, res,\
    \ next) {\n2   //do logging and user-friendly error message display\n3   res.send(500,\
    \ 'internal server error');\n4 })\n```\n\n**Error page**\n\n```\n1 app.use(function(err,\
    \ req, res, next) {\n2   //do logging and user-friendly error message display\n\
    3   //assuming that template engine is plugged in\n4   res.render('500');\n5 })\n\
    ```\n\n**Redirect to error page**\n\n```\n1 app.use(function(err, req, res, next)\
    \ {\n2   //do logging and user-friendly error message display\n3   res.redirect('/public/500.html');\n\
    4 })\n```\n\n**Error HTTP response status (401, 400, 500, etc.)**\n\n```\n1 app.use(function(err,\
    \ req, res, next) {\n2   //do logging and user-friendly error message display\n\
    3   res.end(500);\n4 })\n```\n\nBy the way, logging should also be abstracted\
    \ in a middleware!\n\nTo trigger an error from within your request handlers and\
    \ middleware, you can just call:\n\n```\n1 next(error);\n```\n\nor\n\n```\n1 next(new\
    \ Error('Something went wrong :-(');\n```\n\nYou can also have multiple error\
    \ handlers and use named instead of anonymous functions, as its shows in the [Express.js\
    \ Error handling guide](http://expressjs.com/guide.html#error-handling).\n\n####\
    \ 8.6.4 Other Middleware\n\nIn addition to extracting parameters, it can be used\
    \ for many things, like authorization, error handling, sessions, output, and others.\n\
    \n`res.json()` is one of them. It conveniently outputs the JavaScript/Node.js\
    \ object as a JSON. For example:\n\n```\n1 app.get('/api/v1/stories/:id', function(req,res){\n\
    2   res.json(req.story);\n3 });\n```\n\nis equivalent to (if `req.story` is an\
    \ Array and Object):\n\n```\n1 app.get('/api/v1/stories/:id', function(req,res){\n\
    2   res.send(req.story);\n3 });\n```\n\nor\n\n```\n1 app.get('api/v1/stories/:id',function(req,res){\n\
    2   res.set({\n3     'Content-Type': 'application/json'\n4   });\n5   res.send(req.story);\n\
    6 });\n```\n\n#### 8.6.5 Abstraction\n\nMiddleware is flexible. You can use anonymous\
    \ or named functions, but the best thing is to abstract request handlers into\
    \ external modules based on the functionality:\n\n```\n1 var stories = require.('./routes/stories');\n\
    2 var elements = require.('./routes/elements');\n3 var users = require.('./routes/users');\n\
    4 ...\n5 app.get('/stories/,stories.find);\n6 app.get('/stories/:storyId/elements/:elementId',\
    \ elements.find);\n7 app.put('/users/:userId',users.update);\n```\n\nroutes/stories.js:\n\
    \n```\n1 module.exports.find = function(req,res, next) {\n2 };\n```\n\nroutes/elements.js:\n\
    \n```\n1 module.exports.find = function(req,res,next){\n2 };\n```\n\nroutes/users.js:\n\
    \n```\n1 module.exports.update = function(req,res,next){\n2 };\n```\n\nYou can\
    \ use some functional programming tricks, like this:"
