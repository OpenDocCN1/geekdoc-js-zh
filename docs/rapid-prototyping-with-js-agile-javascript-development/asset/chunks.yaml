    3     this.trigger('spinner'); \n4     //显示 spinner GIF 图标\n5     var view = this;\
    \ \n6     //我们需要在闭包内部访问它\n7     setTimeout(function(){ \n8     //模拟从远程服务器获取数据的\n\
    9     //真实时间延迟\n10       view.model.set(view.collection.where({\n11         name:appleName\n\
