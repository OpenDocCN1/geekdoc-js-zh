  trans: "\n\n```javascript\nvar http = require('http');\n//加载 http 模块\nvar util =\
    \ require('util');\n//实用函数\nvar querystring = require('querystring');\n//加载 querystring\
    \ 模块，\n//我们需要它来序列化和反序列化对象以及查询字符串\n\nvar messages=[];\n//这个数组将存储我们的消息\nmessages.push({\n\
    \  \"name\": \"John\",\n  \"message\": \"hi\"\n});\n//用于测试列表方法的示例消息\n\nexports.server=http.createServer(function\
    \ (req, res) {\n  //创建服务器\n  if (req.method == \"POST\" && \n    req.url == \"\
    /messages/create.json\") {\n    //如果方法是 POST 且\n    // URL 是 messages/，则将消息添加到数组\n\
    \    var message = '';\n    req.on('data', function(data, message){\n      console.log(data.toString('utf-8'));\n\
    \      message = exports.addMessage(data.toString('utf-8'));\n      //data 是 Buffer\
    \ 类型，\n      // 必须先用 UTF-8 编码转换为字符串\n      // 将消息添加到数组\n    })\n    console.log(util.inspect(message,\
    \ true, null));\n    console.log(util.inspect(messages, true, null));\n    //将调试输出到终端\n\
    \    res.writeHead(200, {\n      'Content-Type': 'text/plain'\n    });\n    //设置正确的头部和状态码\
    \   \n    res.end(message);\n    //输出消息，应该包含对象 ID\n  }\n  if (req.method == \"\
    GET\" && \n    req.url == \"/messages/list.json\") {\n    //如果方法是 GET 且\n    //\
    \ URL 是 /messages，输出消息列表\n    var body = exports.getMessages();\n    //body 将包含我们的输出\n\
    \    res.writeHead(200, {\n      'Content-Length': body.length,\n      'Content-Type':\
    \ 'text/plain'\n    });\n    res.end(body);\n  }\n  else {\n    res.writeHead(200,\
    \ {\n      'Content-Type': 'text/plain'\n    });\n    //设置正确的头部和状态码\n    res.end('Hello\
    \ World\\n');\n  };\n  console.log(req.method);\n  //输出带有行尾符号的字符串\n}).listen(1337,\
    \ \"127.0.0.1\");\n//设置服务器的端口和 IP 地址\nconsole.log('Server running at http://127.0.0.1:1337/');\n\
    \nexports.getMessages = function() {\n  return JSON.stringify(messages);\n  //将消息数组作为字符串/文本输出\n\
    };\nexports.addMessage = function (data){\n  messages.push(querystring.parse(data));\n\
    \  //将字符串转换为\n  // JavaScript 对象，我们使用 parse/反序列化\n  return JSON.stringify(querystring.parse(data));\n\
    \  //以 JSON 字符串的形式输出新消息\n};\n```\n\n要检查它，请访问 [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json)。你应该能看到一个示例消息。或者，你使用终端命令：\n\
    \n```\n$ curl http://127.0.0.1:1337/messages/list.json\n```\n\n使用命令行界面发送 POST\
    \ 请求：\n\n```bash\ncurl -d \"name=BOB&message=test\" http://127.0.0.1:1337/messages/create.json\n\
    ```\n\n并且你应该会在服务器终端窗口中获得输出，并在刷新 [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json)\
    \ 时看到新消息“test”。不用多说，所有三个测试都应该通过。\n\n你的应用程序可能会随着方法、需要解析的 URL 路径和条件的增加而变得更大。这正是框架大显身手的地方。它们提供了处理请求的助手以及其他功能，如静态文件支持、会\
    \ 等。在这个示例中，我们故意没有使用任何框架，如 Express ([`expressjs.com/`](http://expressjs.com/))\
    \ 或 Restify ([`mcavage.github.com/node-restify/`](http://mcavage.github.com/node-restify/))。其他值得的\
    \ Node.js 框架：\n\n- [Derby](http://derbyjs.com/): MVC 框架，使其易于编写在 Node.js 和浏览器中共同运行的实时协作应用程序\n\
    - [Express.js](http://expressjs.com):最稳健、经过测试且被最广泛使用的 Node.js 框架\n- [Restify](http://mcavage.github.com/node-restify/):一个用于用\
    \ Node.js 构建微服务的快速、灵活的框架\n\n"
- fmt: "\nAlternatively, for your own development you could use other mappers, which\
    \ are available as an extension of the Native Driver:\n\n* [Mongoskin](https://github.com/guileen/node-mongoskin):\
    \ the future layer for `node-mongodb-native`\n* [Mongoose](http://mongoosejs.com/):\
    \ asynchronous JavaScript driver with optional support for modeling\n* [Mongolia](https://github.com/masylum/mongolia):\
    \ lightweight MongoDB ORM/driver wrapper\n* [Monk](https://github.com/LearnBoost/monk):\
    \ `Monk` is a tiny layer that provides simple yet substantial usability improvements\
    \ for MongoDB usage within Node.js\n\nThis small example will test if we can connect\
    \ to local MongoDB instance from a Node.js script.\n\nAfter we installed the library,\
    \ we can include the `mongodb` library in our `db.js` file:\n\n```\n1 var util\
    \ = require('util');\n2 var mongodb = require ('mongodb');\n```\n\nThis is one\
    \ of the ways to establish connection to the MongoDB server in which the `db`\
    \ variable will hold reference to the database at a specified host and port:\n\
    \n```\n1 var Db = mongodb.Db;\n2 var Connection = mongodb.Connection;\n3 var Server\
    \ = mongodb.Server;\n4 var host = '127.0.0.1';\n5 var port = 27017;\n6 \n7 var\
    \ db=new Db ('test', new Server(host,port, {}));\n```\n\nTo actually open a connection:\n\
    \n```\n1 db.open(function(e,c){\n2 \t//do something with the database here\n3\
    \   // console.log (util.inspect(db));\n4   console.log(db._state);\n5   db.close();\n\
    6 });\n```\n\nThis code snippet is available under the [rpjs/db/db.js](https://github.com/azat-co/rpjs/blob/master/db/db.js)\
    \ folder. If we run it, it should output “connected” in the terminal. When you’re\
    \ in doubt and need to check the properties of an object, there is a useful method\
    \ in the `util` module:\n\n```\n1 console.log(util.inspect(db));\n```\n\n### 6.4.3\
    \ MongoDB on Heroku: MongoHQ\n\nAfter you made your application that displays\
    \ ‘connected’ work locally, it’s time to slightly modify it and deploy to the\
    \ platform as a service, i.e., Heroku.\n\nWe recommend using the [MongoHQ add-on](https://addons.heroku.com/mongohq),\
    \ which is a part of [MongoHQ](https://www.mongohq.com/home) technology. It provides\
    \ a browser-based GUI to look up and manipulate the data and collections. More\
    \ information is available at [https://devcenter.heroku.com/articles/mongohq](https://devcenter.heroku.com/articles/mongohq).\n\
    \n| ![information](images/leanpub_information.png) |  \n\n#### Note\n\nYou might\
    \ have to provide your credit card information to use MongoHQ even if you select\
    \ the free version. You should not be charged, though. |\n\nIn order to connect\
    \ to the database server, there is a database connection URL (a.k.a. MongoHQ URL/URI),\
    \ which is a way to transfer all of the necessary information to make a connection\
    \ to the database in one string.\n\nThe database connection string `MONGOHQ_URL`\
    \ has the following format:\n\n```\n1 mongodb://user:pass@server.mongohq.com/db_name\n\
    ```\n\nYou could either copy the MongoHQ URL string from the Heroku website (and\
    \ hard-code it) or get the string from the Node.js `process.env` object:\n\n```\n\
    1 process.env.MONGOHQ_URL;\n```\n\nor\n\n```\n1 var connectionUri = url.parse(process.env.MONGOHQ_URL);\n\
    ```\n\n| ![tip](images/leanpub_tip.png) |  \n\n#### Tip\n\nThe global object `process`\
    \ gives access to environment variables via `process.env`. Those variables conventionally\
    \ used to pass database host names and ports, passwords, API keys, port numbers,\
    \ and other system information that shouldn’t be hard-coded into the main logic.\
    \ |\n\nTo make our code work both locally and on Heroku, we can use the logical\
    \ OR operator `||` and assign a local host and port if environment variables are\
    \ undefined:\n\n```\n1 var port = process.env.PORT || 1337;\n2 var dbConnUrl =\
    \ process.env.MONGOHQ_URL || \n3   'mongodb://@127.0.0.1:27017';\n```\n\nHere\
    \ is out updated cross-environment ready `db.js` file:\n\n```\n 1 var url = require('url')\n\
    \ 2 var util = require('util');\n3 var mongodb = require ('mongodb');\n4 var Db\
    \ = mongodb.Db;\n5 var Connection = mongodb.Connection;\n6 var Server = mongodb.Server;\n\
    \ 7\n 8 var dbConnUrl = process.env.MONGOHQ_URL ||\n9 'mongodb://127.0.0.1:27017';\n\
    10 var host = url.parse(dbConnUrl).hostname;\n11 var port = new Number(url.parse(dbConnUrl).port);\n\
    12  \n13 var db=new Db ('test', new Server(host,port, {}));\n14 db.open(function(e,c){\n\
    15   // console.log (util.inspect(db));\n16   console.log(db._state);\n17 });\n\
    ```\n\nThis code snippet is available under the [rpjs/db/db.js](https://github.com/azat-co/rpjs/blob/master/db/db.js)\
    \ folder. If we run it, it should output “connected” in the terminal. When you’re\
    \ in doubt and need to check the properties of an object, there is a useful method\
    \ in the `util` module:\n\n```\n1 console.log(util.inspect(db));\n```\n\nWait,\
