  raw: "Asynchronicity requires a different way of thinking for programmers familiar\
    \ with Python, PHP, C or Ruby. It’s easy to introduce a bug unintentionally by\
    \ forgetting to end the execution of the code with a proper **return** expression.\n\
    \nHere is a simple example illustrating this scenario:\n\n```\n 1 var test = function\
    \ (callback) {\n 2   return callback();  \n 3   console.log('test') //shouldn't\
    \ be printed\n 4 }\n 5 \n 6 var test2 = function(callback){\n 7   callback();\n\
    \ 8   console.log('test2') //printed 3rd\n 9 }\n10 \n11 test(function(){\n12 \
    \  console.log('callback1') //printed first\n13   test2(function(){\n14   console.log('callback2')\
    \ //printed 2nd\n15   })\n16 });\n```\n\nIf we don’t use return callback() and\
    \ just use callback() our string test2 will be printed (test is not printed).\n\
    \n```\n1 callback1\n2 callback2\n3 tes2\n```\n\nFor fun I’ve added a `setTimeout()`\
    \ delay for the callback2 string, and now the order has changed:\n\n```\n 1 var\
    \ test = function (callback) {\n 2   return callback();  \n 3   console.log('test')\
    \ //shouldn't be printed\n 4 }\n 5 \n 6 var test2 = function(callback){\n 7  \
    \ callback();\n 8   console.log('test2') //printed 2nd\n 9 }\n10 \n11 test(function(){\n\
    12   console.log('callback1') //printed first\n13   test2(function(){\n14    \
    \ setTimeout(function(){\n15       console.log('callback2') //printed 3rd\n16\
    \     },100)\n17   })\n18 });\n```\n\nPrints:\n\n```\n1 callback1\n2 tes2\n3 callback2\n\
    ```\n\nThe last example illustrates that the two functions are independent of\
    \ each other and run in parallel. The faster function will finish sooner than\
    \ the slower one. Going back to our Starbucks examples, you might get your drink\
    \ faster than the other person who was in front of you in the line. Better for\
    \ people, and better for programs! :-)\n\n### 8.2 MongoDB Migration with Monk\n\
    \nRecently one of our top users complained that his [Storify](http://storify.com)\
    \ account was inaccessible. We’ve checked the production database, and it appears\
    \ that the account might have been compromised and maliciously deleted by somebody\
    \ using the user’s account credentials. Thanks to a great MongoHQ service, we\
    \ had a backup database in less than 15 minutes. There were two options to proceed\
    \ with the migration:\n\n1.  Mongo shell script\n\n2.  Node.js program\n\nBecause\
    \ Storify user account deletion involves deletion of all related objects — identities,\
    \ relationships (followers, subscriptions), likes, stories — we’ve decided to\
    \ proceed with the latter option. It worked perfectly, and here is a simplified\
    \ version which you can use as a boilerplate for MongoDB migration (also at [gist.github.com/4516139](https://gist.github.com/4516139)).\n\
    \nLet’s load all of the modules we need: [Monk](https://github.com/LearnBoost/monk),\
    \ [Progress](https://github.com/visionmedia/node-progress), [Async](https://github.com/caolan/async),\
    \ and MongoDB:\n\n```\n1 var async = require('async');\n2 var ProgressBar = require('progress');\n\
    3 var monk = require('monk');\n4 var ObjectId=require('mongodb').ObjectID;\n```\n\
    \nBy the way, Monk, made by [LeanBoost](https://www.learnboost.com/), is a “tiny\
    \ layer that provides simple yet substantial usability improvements for MongoDB\
    \ usage within Node.js”.\n\nMonk takes connection string in the following format:\n\
    \n```\n1 username:password@dbhost:port/database\n```\n\nSo we can create the following\
    \ objects:\n\n```\n1 var dest = monk('localhost:27017/storify_localhost');\n2\
    \ var backup = monk('localhost:27017/storify_backup');\n```\n\nWe need to know\
    \ the object ID which we want to restore:\n\n```\n1 var userId = ObjectId(YOUR-OBJECT-ID);\
    \ \n```\n\nThis is a handy `restore()` function which we can reuse to restore\
    \ objects from related collections by specifying the query (for more on MongoDB\
    \ queries, go to the post [Querying 20M-Record MongoDB Collection](http://www.webapplog.com/querying-20m-record-mongodb-collection/)).\
    \ To call it, just pass a name of the collection as a string, e.g., `\"stories\"\
    ` and a query which associates objects from this collection with your main object,\
    \ e.g., `{userId:user.id}`. The progress bar is needed to show us nice visuals\
    \ in the terminal:\n\n```\n 1 var restore = function(collection, query, callback){\n\
    \ 2   console.info('restoring from ' + collection);\n 3   var q = query;\n 4 \
    \  backup.get(collection).count(q, function(e, n) {\n 5     console.log('found\
    \ '+n+' '+collection);\n 6     if (e) console.error(e);\n 7     var bar = new\
    \ ProgressBar('[:bar] :current/:total' \n 8       + ':percent :etas'\n 9     \
    \  , { total: n-1, width: 40 })\n10     var tick = function(e) {\n11       if\
    \ (e) {\n12         console.error(e);\n13         bar.tick();\n14       }\n15\
    \       else {\n16         bar.tick();\n17       }\n18       if (bar.complete)\
    \ {\n19         console.log();\n20         console.log('restoring '+collection+'\
    \ is completed');\n21         callback();                \n22       }\n23    \
    \ };\n24     if (n>0){\n25       console.log('adding '+ n+ ' '+collection);\n\
    26       backup.get(collection).find(q, { \n27         stream: true \n28     \
    \  }).each(function(element) {\n29         dest.get(collection).insert(element,\
    \ tick);\n30       });        \n31     } else {\n32       callback();\n33    \
    \ }\n34   });\n35 }\n```\n\nNow we can use async to call the `restore()` function\
    \ mentioned above:\n\n```\n 1 async.series({\n 2   restoreUser: function(callback){\
    \   // import user element\n 3     backup.get('users').find({_id:userId}, { \n\
    \ 4       stream: true, limit: 1 \n 5     }).each(function(user) {\n 6       dest.get('users').insert(user,\
    \ function(e){\n 7         if (e) {\n 8           console.log(e);\n 9        \
    \ }\n10         else {\n11           console.log('resored user: '+ user.username);\n\
    12         }\n13         callback();\n14       });\n15     });\n16   },\n17 \n\
    18   restoreIdentity: function(callback){  \n19     restore('identities',{\n20\
    \       userid:userId\n21     }, callback);\n22   },\n23 \n24   restoreStories:\
    \ function(callback){\n25     restore('stories', {authorid:userId}, callback);\n\
    26   }\n27 \n28   }, function(e) {\n29   console.log();\n30   console.log('restoring\
    \ is completed!');\n31   process.exit(1);\n32 });\n```\n\nThe full code is available\
    \ at [gist.github.com/4516139](https://gist.github.com/4516139) and here:"
