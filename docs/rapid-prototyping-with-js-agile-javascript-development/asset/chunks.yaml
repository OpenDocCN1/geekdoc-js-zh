  trans: "\n\n```\n1 $ node .\n```\n\n或者\n\n```\n1 $ node index.js\n```\n\n要查看应用程序运行情况，请在\
    \ Chrome 中打开 [localhost:3000](http://localhost:3000)，并安装 [JSONViewer](https://chrome.google.com/webstore/detail/jsonview/chklaanhfefbnpoihckbnefhakgolnmc?hl=en)\
    \ 扩展（用于美化渲染 JSON）。\n\n## 8.6 Express.js 简介：参数、错误处理和其他中间件\n\n### 8.6.1 请求处理器\n\n\
    Express.js 是一个 node.js 框架，它其他功能提供了一种组织路由的方法。每个路由都通过应用对象上的方法调用定义，并将 URL 模式作为第一个参数（也支持正则表达式）——例如：\n\
    \n```\n1 app.get('api/v1/stories/', function(res, req){\n2   ...\n3 })\n```\n\n\
    或者，对于 POST 方法：\n\n```\n1 app.post('/api/v1/stories'function(req,res){\n2   ...\n\
    3 })\n```\n\n不用俗说，`DELETE` 和 `PUT` 方法也是[支持的](http://expressjs.com/api.html#app.VERB)。\n\
    \n我们传递给 `get()` 或 `post()` 方法的回调被称为请求处理器，因为它们接收请求 (`req`)、处理它们，并写入响应 (`res`) 对象。例如：\n\
    \n```\n1 app.get('/about', function(req,res){\n2   res.send('About Us: ...');\n\
    3 });\n```\n\n我们可以有多个请求处理器 —— 因此它们被命名为 `middleware`（中间件）。它们接受第三个参数 `next`，调用它（`next()`）将把执行流切换到下一个处理器：\n\
    \n```\n 1 app.get('/api/v1/stories/:id', function(req,res, next) {\n 2   //进行权限验证\n\
    \ 3   //如果没有授权或发生错误\n 4   //返回 next(error);\n 5   //如果授权且没有错误\n 6   return next();\n\
    \ 7 }), function(req,res, next) {\n 8   //提取 id 并从数据库获取对象\n 9   //假设没有错误，将 story\
    \ 保存到请求对象中\n110   req.story = story;\n 11   return next();\n 12 }), function(req,res)\
    \ {\n 13   //输出数据库搜索结果\n 14   res.send(res.story);\n 15 });\n```\n\nURL 模式中的 story\
    \ ID 是查询字符串参数，我们需要它来在数据库中查找匹配项。\n\n### 8.6.2 参数中间件\n\n参数是通过请求 URL 中的查询字符串传递的值。如果没有\
    \ Express.js 或类似的库，而只使用核心 Node.js 模块，我们就必须通过某些 `require('querystring').parse(url)`\
    \ 或 `require('url').parse(url, true)` 函数的技巧从 [HTTP.request](http://nodejs.org/api/http.html#http_http_request_options_callback)\
    \ 对象中提取参数。\n\n多亏了 [Connect framework](http://www.senchalabs.org/connect/) 和 [VisionMedia](https://github.com/visionmedia/express)\
    \ 的人员，Express.js 已经以中间件的形式支持了参数、错误处理和许多其他重要功能。我们可以这样在应用程序中插件参数中间件：\n\n```\n 1\
    \ app.param('id', function(req,res, next, id){\n 2   //对 id 进行某些操作\n 3   //将 id\
    \ 或其他信息存储在 req 对象中\n 4   //完成后调用 next\n 5   next();\n 6 });\n 7 \n 8 app.get('/api/v1/stories/:id',function(req,res){\n\
    \ 9   //参数中间件将在之前执行\n10   //我们期望 req 对象已经包含了所需信息\n11   //输出某些内容\n12   res.send(data);\n\
    13 });\n```\n\n例如：\n\n```\n 1 app.param('id', function(req,res, next, id){\n 2\
    \   req.db.get('stories').findOne({_id:id}, function (e, story){\n 3     if (e)\
    \ return next(e);\n 4     if (!story) return next(new Error('Nothing is found'));\n\
    \ 5     req.story = story;\n 6     next();\n 7   });\n 8 });\n 9 \n10 app.get('/api/v1/stories/:id',function(req,res){\n\
    11   res.send(req.story);\n12 });\n```\n\n或者我们可以使用多个请求处理器，但概念保持相同：我们可以期望在执行此代码之前已经有了\
    \ `req.story` 对象或抛出了错误，因此我们抽象了获取参数及其相应对象的通用代码/逻辑：\n\n```\n1 app.get('/api/v1/stories/:id',\
    \ function(req,res, next) {\n2   //进行权限验证\n3   }),\n4   //我们在 req.story 中已经有一个对象，所以这里不需要额外工作\n\
    5   function(req,res) {\n6   //输出数据库搜索结果\n7   res.send(story);\n8 });\n```\n\n\
    权限验证和输入清洗也是存放在中间件中的良好候选者。\n\n`param()` 函数特别别酷，因为我们可以组合不同的键，例如：\n\n```\n 1 app.param('id',\
    \ function(req,res, next, id){\n```\n\n### 8.6.3 错误处理\n\n错误处理通常用于整个应用程序，因此我们将其作为中间件来实现。\n\
    \n\n"
