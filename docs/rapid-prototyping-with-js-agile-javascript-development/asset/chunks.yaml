    \n```\n1 define(['name-of-the-module'],function(nameOfModule){\n2   var b = nameOfModule.render();\n\
    3   return b; \n4 })\n```\n\n| ![information](img/leanpub_information.png) | \
    \ \n\n### 注意\n\n没有必要在文件名后添加 `.js`。Require.js 会自动处理。Shim 插件用于导入 HTML 模板等文本文件。 |\n\
    \n让我们从模板开始，并将它们转换为 Require.js 模块。\n\n### `apple-item.tpl.js` 文件：\n\n```\n1 define(function()\
    \ {\n2   return '\\\n3              <a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >\\\n4             <%=name%>\\\n5             </a>&nbsp;<a class=\"add-to-cart\"\
    \ href=\"#\">buy</a>\\\n6             '\n7 }); \n```\n\n### `apple-home.tpl` 文件：\n\
