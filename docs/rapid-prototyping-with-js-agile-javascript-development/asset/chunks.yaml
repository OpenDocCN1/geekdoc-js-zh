    \n此示例可以在 [rpjs/backbone/subview](https://github.com/azat-co/rpjs/tree/master/backbone/subview)\
    \ 获取。\n\n子视图（Subviews）是在另一个 `Backbone View` 内部创建并使用的 `Backbone View` 实例。子视图是一个抽象（分离）UI\
    \ 事件（例如点击）以及结构相似元素（例如苹果）模板的极佳方法。\n\n`Subview` 的用例可能包括表格中的行、列表中的列表项、段落、新行等。\n\n\
