    \ one.\n\nAnother approach is to hot-link these scripts from CDNs such as [Google\
    \ Hosted Libraries](https://developers.google.com/speed/libraries/devguide), [CDNJS](http://cdnjs.com/),\
    \ [Microsoft Ajax Content Delivery Network](http://www.asp.net/ajaxlibrary/cdn.ashx)\
    \ and others. By doing so the apps will be faster for some users, but won’t work\
    \ locally at all without the Internet.\n\n*   LESS as a front-end interpreter\
    \ is available at [lesscss.org](http://lesscss.org/) — you could unpack it into\
    \ your development folder (*~/Documents/Development*) or any other.\n\n*   Twitter\
    \ Bootstrap is a CSS/LESS framework. It’s available at [twitter.github.com/bootstrap](http://twitter.github.com/bootstrap/).\n\
    \n*   jQuery is available at [jquery.com](http://jquery.com).\n\n*   Backbone.js\
    \ is available at [backbonejs.org](http://backbonejs.org).\n\n*   Underscore.js\
    \ is available at [underscorejs.org](http://underscorejs.org).\n\n*   Require.js\
    \ is available at [requirejs.org](http://requirejs.org).\n\n##### 2.1.7.3 LESS\
    \ App\n\nThe LESS App is a Mac OS X application for “on-the-fly” compilation of\
    \ LESS to CSS. It’s available at [incident57.com/less](http://incident57.com/less/).\n\
    \n![LESS App for Mac home page.](images/screenshots----less.png)\n\nLESS App for\
    \ Mac home page.\n\n### 2.2 Cloud Setup\n\n#### 2.2.1 SSH Keys\n\nSSH keys provide\
    \ a secure connection without the need to enter username and password every time.\
    \ For GitHub repositories, the latter approach is used with HTTPS URLs, e.g.,\
    \ `https://github.com/azat-co/rpjs.git`, and the former with SSH URLs, e.g., `git@github.com:azat-co/rpjs.git`.\n\
    \nTo generate SSH keys for GitHub on Mac OS X/Unix machines do the following:\n\
    \n1.  Check for existing SSH keys\n\n    ```\n    1  $ cd ~/.ssh\n    2  $ ls\
    \ -lah\n    ```\n\n2.  If you see some files like **id_rsa** (please refer to\
    \ the screenshot below for an example), you could delete them or backup into a\
    \ separate folder by using following commands:\n\n    ```\n    1  $ mkdir key_backup\n\
    \    2  $ cp id_rsa* key_backup\n    3  $ rm id_rsa*\n    ```\n\n3.  Now we can\
    \ generate a new SSH key pair using the **ssh-keygen** command, assuming we are\
    \ in `~/.ssh` folder:\n\n    ```\n    1  $ ssh-keygen -t rsa -C \"your_email@youremail.com\"\
    \n    ```\n\n4.  Answer the questions; it is better to keep the default name:\
    \ **id_rsa**. Then copy the content of the **id_rsa.pub** file to your clipboard:\n\
    \n    ```\n    1  $ pbcopy < ~/.ssh/id_rsa.pub\n    ```\n\n    ![Generating RSA\
    \ key for SSH and copying public key to clipboard.](images/screenshots----ssh-copy.png)\n\
    \n    Generating RSA key for SSH and copying public key to clipboard.\n\n5.  Or\
    \ alternatively, open **id_rsa.pub** file in the default editor:\n\n    ```\n\
    \    1  $ open id_rsa.pub\n    ```\n\n6.  Or in TextMate:\n\n    ```\n    1  $\
    \ mate id_rsa.pub \n    ```\n\n#### 2.2.2 GitHub\n\n1.  After you have copied\
    \ the public key, go to [github.com](http://github.com), log in, go to your account\
    \ settings, select “SSH key” and add the new SSH key. Assign a name, e.g., the\
    \ name of your computer, and paste the value of your **public** key.\n\n2.  To\
    \ check if you have an SSH connection to GitHub, type and execute the following\
    \ command in your terminal:\n\n    ```\n    1  $ ssh -T git@github.com\n    ```\n\
    \n    If you see something like:\n\n    ```\n    1  Hi your-GitHub-username! You've\
    \ successfully authenticated, \n    2  but GitHub does not provide shell access.\n\
    \    ```\n\n    then everything is set up.\n\n3.  While the first time connecting\
    \ to GitHub, you can receive “authenticity of host … can’t be established” warning.\
    \ Please don’t be confused with such a message — just proceed by answering ‘yes’\
    \ as shown on the screenshot below.\n\n    ![Testing SSH connection to GitHub\
    \ for the very first time.](images/screenshots----github.png)\n\n    Testing SSH\
    \ connection to GitHub for the very first time.\n\n    If for some reason you\
    \ have a different message, please repeat steps 3-4 from the previous section\
    \ on *SSH Keys* and/or re-upload the content of your `*.pub` file to GitHub.\n\
    \n| ![warning](images/leanpub_warning.png) |  \n\n### Warning\n\nKeep your **id_rsa**\
    \ file private and don’t share it with anybody! |\n\nMore instructions are available\
    \ at GitHub: [Generating SSH Keys](https://help.github.com/articles/generating-ssh-keys).\n\
    \nWindows users might find useful the SSH key generator feature in [PuTTY].\n\n\
    #### 2.2.3 Windows Azure\n\nHere are the steps to set up a Windows Azure account:\n\
    \n1.  You’ll need to sign up for Windows Azure Web Site and Virtual Machine previews.\
    \ Currently they have a 90-day free trial [https://www.windowsazure.com/en-us/](https://www.windowsazure.com/en-us/).\n\
    \n2.  Enable Git Deployment and create a username and password. Then upload SSH\
    \ public key to Windows Azure.\n\n3.  Install Node.js SDK, which is available\
    \ at [https://www.windowsazure.com/en-us/develop/nodejs/](https://www.windowsazure.com/en-us/develop/nodejs/).\n\
    \n4.  To check your installation type:\n\n    ```\n    1  $ azure -v\n    ```\n\
    \n    You should be able to see something like:\n\n    ```\n    1  Windows Azure:\
    \ Microsoft's Cloud Platform... Tool Version 0.6.0\n    ```\n\n5.  Log in to Windows\
    \ Azure Portal at [https://windows.azure.com/](https://windows.azure.com/).![Registering\
    \ on Windows Azure.](images/screenshots----azure.png)\n\n    Registering on Windows\
    \ Azure.\n\n6.  Select “New,” then select “Web Site,” “Quick Create.” Type the\
    \ name which will serve as the URL for your website, and click “OK.”\n\n7.  Go\
    \ to this newly created Web Site’s Dashboard and select “Set up Git publishing.”\
    \ Come up with a username and password. This combination can be used to deploy\
    \ to any web site in your subscription, meaning that you do not need to set credentials\
    \ for every web site you create. Click “OK.”\n\n8.  On the follow-up screen, it\
    \ should show you the Git URL to push to, something like\n\n    ```\n    1  https://azatazure@azat.scm.azurewebsites.net/azat.git\
    \ \n    ```\n\n    and instructions on how to proceed with deployment. We’ll cover\
    \ them later.\n\n9.  **Advanced user option**: follow this tutorial to create\
    \ a virtual machine and install MongoDB on it: [Install MongoDB on a virtual machine\
    \ running CentOS Linux in Windows Azure](https://www.windowsazure.com/en-us/manage/linux/common-tasks/mongodb-on-a-linux-vm/).\n\
    \n#### 2.2.4 Heroku\n\nHeroku is a polyglot agile application deployment [http://www.heroku.com/](http://www.heroku.com/)\
    \ platform. Heroku works similarly to Windows Azure in the sense that you can\
    \ use Git to deploy applications. There is no need to install Virtual Machine\
    \ for MongoDB because Heroku has [MongoHQ add-on](https://addons.heroku.com/mongohq).\n\
    \nTo set up Heroku, follow these steps:\n\n1.  Sign up at [http://heroku.com](http://heroku.com).\
    \ Currently they have a free account; to use it, select all options as minimum\
    \ (0) and database as shared.\n\n2.  Download Heroku Toolbelt at [https://toolbelt.heroku.com](https://toolbelt.heroku.com).\
    \ Toolbelt is a package of tools, i.e., libraries which consists of Heroku, Git,\
    \ and [Foreman](https://github.com/ddollar/foreman). For users of older Macs get\
    \ this [client](http://assets.heroku.com/heroku-client/heroku-client.tgz) direclty.\
    \ If you utilize another OS, browse [Heroku Client GitHub](https://github.com/heroku/heroku).\n\
    \n3.  After the installation is done, you should have access to the **heroku**\
    \ command. To check it and log in to Heroku, type:\n\n    ```\n    1  $ heroku\
    \ login\n    ```"
