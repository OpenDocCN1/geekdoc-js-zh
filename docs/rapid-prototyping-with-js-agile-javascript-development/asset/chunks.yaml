  trans: "\nNode.js 安装包已经包含了 [Node 包管理器](https://npmjs.org) (NPM)。我们将广泛使用 `NPM` 来安装\
    \ Node.js 模块。\n\n![Node.js 首页。](img/screenshots----node.png)\n\nNode.js 首页。\n\n\
    ## 2.1.7.2 JS 库\n\n前端 JavaScript 库是从它们各自的网站下载并解压的。这些文件通常存放在开发文件夹中（例如，`~/Documents/Development`）以备以后使用。通常，可以在经过压缩的生产版本（更多信息请见\
    \ *Intro to Backbone.js* 章节中的 AMD 和 Require.js 部分）和包含大量注释的开发版本之间进行选择。\n\n另一种方法是从\
    \ CDN 热链接这些脚本，例如 [Google 托管库](https://developers.google.com/speed/libraries/devguide),\
    \ [CDNJS](http://cdnjs.com/), [Microsoft Ajax 内容分发网络](http://www.asp.net/ajaxlibrary/cdn.ashx)\
    \ 等。通过这种方式，应用程序对某些用户来说运行得更快，但在没有互联网的情况下完全无法本地运行。\n\n*   `LESS` 作为前端解释器可以在 [lesscss.org](http://lesscss.org/)\
    \ 获取 ——你可以将其解压到你的开发文件夹（`~/Documents/Development`）或任何地方。\n*   `Twitter Bootstrap`\
    \ 是一个 CSS/LESS 框架。可以在 [twitter.github.com/bootstrap](http://twitter.github.com/bootstrap/)\
    \ 获取。\n*   `jQuery` 可以在 [jquery.com](http://jquery.com) 获取。\n*   `Backbone.js`\
    \ 可以在 [backbonejs.org](http://backbonejs.org) 获取。\n*   `Underscore.js` 可以在 [underscorejs.org](http://underscorejs.org)\
    \ 获取。\n*   `Require.js` 可以在 [requirejs.org](http://requirejs.org) 获取。\n\n## 2.1.7.3\
    \ LESS App\n\n`LESS App` 是一个用于“实时”编译 LESS 为 CSS 的 Mac OS X 。可以在 [incident57.com/less](http://incident57.com/less/)\
    \ 获取。\n\n![Mac 版 LESS App 首页。](img/screenshots----less.png)\n\nMac 版 LESS App\
    \ 首页。\n\n## 2.2 云端设置\n\n### 2.2.1 SSH 密钥\n\nSSH 密钥提供了安全连接，而无需每次输入用户名和密码。对于 GitHub\
    \ 仓库，后者用于 HTTPS URL，例如 `https://github.com/azat-co/rpjs.git`；前者用于 SSH URL，例如 `git@github.com:azat-co/rpjs.git`。\n\
    \n在 Mac OS X/Unix 机器上为 GitHub 生成 SSH 密钥，请执行以下操作：\n\n1.  检查现有的 SSH 密钥\n\n    ```\n\
    \    1  $ cd ~/.ssh\n    2  $ ls -lah\n    ```\n\n2.  如果你看到类似 `id_rsa` 的文件（请参考下方的截图示例），你可以使用以下命令删除它们或将其备份到单独文件夹：\n\
    \n    ```\n    1  $ mkdir key_backup\n    2  $ cp id_rsa* key_backup\n    3  $\
    \ rm id_rsa*\n    ```\n\n3.  现在我们可以使用 `ssh-keygen` 命令生成新的 SSH 密钥对，假设我们处于 `~/.ssh`\
    \ 文件夹中：\n\n    ```\n    1  $ ssh-keygen -t rsa -C \"your_email@youremail.com\"\
    \n    ```\n\n4.  回答问题；最好保留默认名称：`id_rsa`。然后将 `id_rsa.pub` 文件的内容复制到剪贴板：\n\n    ```\n\
    \    1  $ pbcopy < ~/.ssh/id_rsa.pub\n    ```\n\n    ![为 SSH 生成 RSA 密钥并将公钥复制到剪贴板。](img/screenshots----ssh-copy.png)\n\
    \n    为 SSH 生成 RSA 密钥并将公钥复制到剪贴板。\n\n5.  或者，在默认编辑器中打开 `id_rsa.pub` 文件：\n\n    ```\n\
    \    1  $ open id_rsa.pub\n    ```\n\n6.  或者在 TextMate 中：\n\n    ```\n    1  $\
    \ mate id_rsa.pub \n    ```\n\n### 2.2.2 GitHub\n\n1.  复制公钥后，访问 [github.com](http://github.com)，登录，进入账户设置，选择“SSH\
    \ key”并添加新的 SSH 密钥。分配一个名称（例如你的计算机名称），并粘贴你的 `public` 密钥值。\n\n2.  要检查你与 GitHub 的\
    \ SSH 连接，请在终端中输入并执行以下命令：\n\n    ```\n    1  $ ssh -T git@github.com\n    ```\n\
    \n    如果你看到类似的内容：\n\n    ```\n    1  Hi your-GitHub-username! You've successfully\
    \ authenticated, \n    2  but GitHub does not provide shell access.\n    ```\n\
    \n    那么一切都设置好了。\n\n3.  第一次连接到 GitHub 时，可能会收到“authenticity of host … can’t be\
    \ established”警告。请不要被此类信息困扰 —— 只如下所示所示回答‘yes’即可继续。\n\n    ![第一次测试到 GitHub 的 SSH\
    \ 连接。(images/screenshots----github.png)\n\n    第一次测试到 GitHub 的 SSH 连接。\n\n   \
    \ 由于某种原因你收到了不同的消息，请重复上一节 *SSH Keys* 中的第 3-4 步。\n\n### 2.2.3 Heroku\n\nHeroku 是一个多语言敏捷应用部署平台\
    \ [`www.heroku.com/`](http://www.heroku.com/)。Heroku 的工作方式与 Windows Azure 类似，你可以使用\
    \ Git 进行部署。不需要为 MongoDB 安装虚拟机，因为 Heroku 有 [MongoHQ 插件](https://addons.heroku.com/mongohq)。\n\
    \n| Windows Azure\n\n1.  在 [`heroku.com`](http://heroku.com) 注册。目前他们提供免费账户；要使用它，请将所有选项设置为最小\
    \ (0)，并将数据库设置为共享。\n\n2.  在 [`toolbelt.heroku.com`](https://toolbelt.heroku.com)\
    \ 下载 Heroku Toolbelt。Toolbelt 是一个工具包，即包含 Heroku、Git 和 [Foreman](https://github.com/ddollar/foreman)。对于旧版\
    \ Mac 用户可以直接获取此[客户端](http://assets.heroku.com/heroku-client/heroku-client.tgz)。\n\
    \n3.  安装完成后，你应该可以访问 **heroku** 命令。要检查它并登录 Heroku，请输入：\n\n    ```\n    1  $ heroku\
    \ login\n    ```\n"
- fmt: "\n[content]\nIt will ask you for Heroku credentials (username and password),\
    \ and if you’ve already created the SSH key, it will automatically upload it to\
    \ the Heroku website:\n\n![The response to the successful `$ heroku login` command.](images/screenshots----heroku.png)\n\
    \nThe response to the successful `$ heroku login` command.\n\n4. If everything\
    \ went well, to create a Heroku application inside of your specific project folder,\
    \ you should be able to run:\n\n```\n1  $ heroku create\n```\n\nMore detailed\
    \ step-by-step instructions are available at [Heroku: Quickstart](https://devcenter.heroku.com/articles/quickstart)\
    \ and [Heroku: Node.js](https://devcenter.heroku.com/articles/nodejs).\n\n## 2.2.5\
    \ Cloud9\n\nCloud9 is an in-browser IDE with which, by using your GitHub or BitBucket\
    \ account, you can browse your repositories, edit them and deploy to Windows Azure\
    \ or other services. No installations are needed; everything works in the browser,\
    \ pretty much like Google Docs.\n\n# II Front-End Prototyping\n\n## 3 jQuery and\
    \ Parse.com\n\n**Summary**: overview of main jQuery functions, Twitter Bootstrap\
    \ scaffolding, main LESS components; definitions of JSON, AJAX and CORS; illustrations\
    \ of JSONP calls on Twitter REST API example; explanations on how to build Chat\
    \ front-end only application with jQuery and Parse.com; step-by-step instructions\
    \ on deployment to Heroku and Windows Azure.\n\n> “There are two ways of constructing\
    \ a software design: One way is to make it so simple that there are obviously\
    \ no deficiencies, and the other way is to make it so complicated that there are\
    \ no obvious deficiencies. The first method is far more difficult.” — [Tony Hoare](http://en.wikipedia.org/wiki/Charles_Antony_Richard_Hoare)\n\
    \n### 3.1 Definitions\n\n#### 3.1.1 JavaScript Object Notation\n\nHere is the\
    \ definition of JavaScript Object Notation, or JSON, from [json.org](http://www.json.org/):\n\
    \n> JavaScript Object Notation, or JSON, is a lightweight data-interchange format.\
    \ It is easy for humans to read and write. It is easy for machines to parse and\
    \ generate. It is based on a subset of the JavaScript Programming Language, [Standard\
    \ ECMA-262 3rd Edition - December 1999](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf).\
    \ JSON is a text format that is completely language independent but uses conventions\
    \ that are familiar to programmers of the C-family of languages, including C,\
    \ C++, C#, Java, JavaScript, Perl, Python, and many others. These properties make\
    \ JSON an ideal data-interchange language.\n\nJSON has become a standard for transferring\
    \ data between different components of web/mobile applications and third-party\
    \ services. JSON is also widely used inside the applications as a format for configuration,\
    \ locales, translation files or any other data.\n\nTypical JSON object looks like\
    \ this:\n\n```\n1 {\n2   \"a\": \"value of a\",\n3   \"b\": \"value of b\"\n4\
    \ }\n```\n\nWe have an object with key-value pairs. Keys are on the left and values\
    \ are on the right side of colons (`:`). In Computer Science terminology, JSON\
    \ is equivalent to a hash table, a keyed list or an associative array (depending\
    \ on a particular language). The only big difference between JSON and JS object\
    \ literal notation (native JS objects) is that the former is more stringent and\
    \ requires double quotes (`\"`) for key identifiers and string values. Both types\
    \ can be serialized into a string representation with `JSON.stringify()` and deserialized\
    \ with `JSON.parse()` assuming we have a valid JSON object in a string format.\n\
    \nHowever, every member of an object can be an array, primitive, or another object;\
    \ for example:\n\n```\n 1   {\n 2     \"posts\": [{\n 3       \"title\": \"Get\
    \ your mind in shape!\",\n 4       \"votes\": 9,\n 5       \"comments\": [\"nice!\"\
    , \"good link\"]\n 6       }, {\n 7       \"title\": \"Yet another post\",\n 8\
    \       \"votes\":0,\n 9       \"comments\": []\n10       }\n11     ],\n 12  \
    \   \"totalPost\":2,\n 13     \"getData\": function () {\n 14       return new\
    \ Data().getDate();\n 15     }\n 16   }\n```\n\nIn the above example, we have\
    \ an object with the `posts` property. The value of the `posts` property is an\
    \ array of objects with each one of them having `title`, `votes` and `comments`\
    \ keys. The votes property holds a number primitive, while comments is an array\
    \ of strings. We also can have function as values; in this case, key is called\
    \ a method, i.e., `getData`.\n\nJSON is much more flexible and compact than XML\
    \ or other data formats as outlined in this article — [JSON: The Fat-Free Alternative\
    \ to XML](http://www.json.org/xml.html). Conveniently, MongoDB uses a JSON-like\
    \ format called [BSON](http://bsonspec.org/), or Binary JSON. More on BSON later\
    \ in the *Node.js and MongoDB* chapter.\n\n#### 3.1.2 AJAX\n\nAJAX stands for\
    \ Asynchronous JavaScript and XML, and is used on a client-side (browser) to send\
    \ and receive data from the server by utilizing an `XMLHttpRequest` object in\
    \ JavaScript language. Despite the name, the use of XML is not required, and JSON\
    \ is often used instead. That’s why developers almost never say AJAX anymore.\
    \ Keep in mind that HTTP requests could be made synchronously.\n\n#### 3.1.3 Cross-Domain\
    \ Calls\n\nFor security reasons, the initial implementation did not allow cross-domain\
    \ calls. One of them is to use [JSONP](http://en.wikipedia.org/wiki/JSONP) — which\
    \ dynamically generates a `script` tag. For example:\n\n```\n1 https://graph.facebook.com\n\
    2   ?type=post\n3   &limit=20\n4   &q=Gatsby\n```\n\nThe second approach is to\
    \ use Cross-Origin Sharing, or [CORS](http://www.w3.org/TR/cors/), which is a\
    \ better solution but requires control over the server to modify headers. We’ll\
    \ use this technique in the final version of the Chat application.\n\nExample\
    \ of CORS server header:\n\n```\n1 Access-Control-Allow-Origin: *\n```\n\nMore\
    \ about CORS: [Resources by Enable CORS](http://enable-cors.org/resources.html)\
    \ and [Using CORS by HTML5 Tutorials](http://www.html5rocks.com/en/tutorials/cors/).\
    \ Test CORS requests at [test-cors.org](http://client.cors-api.appspot.com/client).\n\
    \n### 3.2 jQuery\n\nDuring the training we’ll be using jQuery ([http://jquery.com/](http://jquery.com/))\
    \ for DOM manipulations, HTTP Requests and JSONP calls. jQuery became a de facto\
    \ standard because of its `$` object/function, which provides a simple yet efficient\
    \ way to access any HTML DOM element on a page by its ID, class, tag name, attribute\
    \ value, structure or by any combination of. The syntax is very similar to CSS,\
    \ where we use `#` for id and `.` for class selection, e.g.:\n\n```\n1 $(\"#main\"\
    ).hide();\n2 $(\"p.large\").attr(\"style\",\"color:red\");\n3 $(\"#main\").show().html(\"\
    <div>new div</div>\");\n```\n\nHere is the list of most commonly used jQuery API\
    \ functions:\n\n* `find()`(http://api.jquery.com/find): Selects elements based\
    \ on the provided selector string\n* `hide()`(http://api.jquery.com/hide): Hides\
    \ an element if it was visible\n* `show()`(http://api.jquery.com/show): Shows\
    \ an element if it was hidden\n* `html()`(http://api.jquery.com/html): Gets or\
    \ sets an inner HTML of an element\n* `append()`(http://api.jquery.com/append):\
    \ Injects an element into the DOM after the selected element\n[/content]\n"
