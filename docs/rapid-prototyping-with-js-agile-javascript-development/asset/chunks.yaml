    \ master apples’ list:\n\n```javascript\nvar appleView = Backbone.View.extend({\n\
    \  initialize: function(){\n    this.model = new (Backbone.Model.extend({}));\n\
    \    this.model.on('change', this.render, this);\n    this.on('spinner',this.showSpinner,\
