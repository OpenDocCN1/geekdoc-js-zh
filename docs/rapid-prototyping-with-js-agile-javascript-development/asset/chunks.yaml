  raw: "To make a JavaScript string, which has HTML tags in it, more readable we can\
    \ use the backslash line breaker escape (`\\`) symbol, or close strings and concatenate\
    \ them with a plus sign (`+`). This is an example of **appleView** above, which\
    \ is refactored using the latter approach:\n\n```\n1   var appleView = Backbone.View.extend({\n\
    2     template: _.template(\n3         '<figure>'+\n4           +'<img src=\"\
    <%= attributes.url %>\"/>'+\n5           +'<figcaption><%= attributes.name %></figcaption>'+\n\
    6         +'</figure>'),\n7   ...\n```\n\nPlease note the ‘<%=’ and ‘%>’ symbols;\
    \ they are the instructions for Undescore.js to print values in properties **url**\
    \ and **name** of the **attributes** object.\n\nFinally, we’re adding the render\
    \ function to the **appleView** class.\n\n```\n1   render: function(appleName){\n\
    2     var appleModel = this.collection.where({name:appleName})[0];\n3     var\
    \ appleHtml = this.template(appleModel);\n4     $('body').html(appleHtml);\n5\
    \   }\n```\n\nWe find a model within the collection via `where()` method and use\
    \ `[]` to pick the first element. Right now, the **render** function is responsible\
    \ for both loading the data and rendering it. Later we’ll refactor the function\
    \ to separate these two functionalities into different methods.\n\nThe whole app,\
    \ which is in the [rpjs/backbone/collections/index.html](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
    \ folder, looks like this:\n\n```\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n 4   <script\
    \ src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"></script>\n\
    \ 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script>\n 9    var appleData\
    \ = [\n10       {\n11         name: \"fuji\",\n12         url: \"img/fuji.jpg\"\
    \n13       },\n14       {\n15         name: \"gala\",\n16         url: \"img/gala.jpg\"\
    \n17       }      \n18     ];\n19     var app;\n20     var router = Backbone.Router.extend({\n\
    21       routes: {\n22         \"\": \"home\",\n23         \"apples/:appleName\"\
    : \"loadApple\"\n24       },\n25       initialize: function(){\n26         var\
    \ apples = new Apples();\n27         apples.reset(appleData);\n28         this.homeView\
    \ = new homeView({collection: apples});\n29         this.appleView = new appleView({collection:\
    \ apples});\n30       },\n31       home: function(){        \n32         this.homeView.render();\n\
    33       },\n34       loadApple: function(appleName){\n35         this.appleView.render(appleName);\n\
    36       }\n37     });\n38 \n39     var homeView = Backbone.View.extend({\n40\
    \       el: 'body',\n41       template: _.template('Apple data: <%= data %>'),\n\
    42       render: function(){\n43         this.$el.html(this.template({\n44   \
    \      data: JSON.stringify(this.collection.models)\n45       }));\n46       }\n\
    47       //TODO subviews\n48     });\n49 \n50     var Apples = Backbone.Collection.extend({\n\
    51 \n52     });\n53     var appleView = Backbone.View.extend({\n54       template:\
    \ _.template('<figure>\\\n55                   <img src=\"<%= attributes.url %>\"\
    />\\\n56                   <figcaption><%= attributes.name %></figcaption>\\\n\
    57                 </figure>'),\n58       //TODO re-write with load apple and\
    \ event binding\n59       render: function(appleName){\n60         var appleModel\
    \ = this.collection.where({\n61           name:appleName\n62         })[0];\n\
    63         var appleHtml = this.template(appleModel);\n64         $('body').html(appleHtml);\n\
    65       }\n66     });\n67     $(document).ready(function(){\n68       app = new\
    \ router;\n69       Backbone.history.start();      \n70     })\n71 \n72   </script>\n\
    73 </head>\n74 <body>\n75   <div></div>\n76 </body>\n77 </html>\n```\n\nOpen `collections/index.html`\
    \ file in your browser. You should see the data from our “database”, i.e., `Apple\
    \ data: [{\"name\":\"fuji\",\"url\":\"img/fuji.jpg\"},{\"name\":\"gala\",\"url\"\
    :\"img/gala.jpg\"}]`.\n\nNow, let’ go to `collections/index.html#apples/fuji`\
    \ or `collections/index.html#apples/gala` in your browser. We expect to see an\
    \ image with a caption. It’s a detailed view of an item, which in this case is\
    \ an apple. Nice work!\n\n### 4.3 Event Binding\n\nIn real life, getting data\
    \ does not happen instantaneously, so let’s refactor our code to simulate it.\
    \ For a better UI/UX, we’ll also have to show a loading icon (a.k.a. spinner or\
    \ ajax-loader) to users to notify them that the information is being loaded.\n\
    \nIt’s a good thing that we have event binding in Backbone. Without it, we’ll\
    \ have to pass a function that renders HTML as a callback to the data loading\
    \ function, to make sure that the rendering function is not executed before we\
    \ have the actual data to display.\n\nTherefore, when a user goes to detailed\
    \ view (`apples/:id`) we only call the function that loads the data. Then, with\
    \ the proper event listeners, our view will automagically (this is not a typo)\
    \ update itself, when there is a new data (or on a data change, Backbone.js supports\
    \ multiple and even custom events).\n\nLet’s change the code in the router:\n\n\
    ```\n1   ...\n2     loadApple: function(appleName){\n3       this.appleView.loadApple(appleName);\n\
    4     }\n5   ...\n```\n\nEverything else remains the same utill we get to the\
    \ **appleView** class. We’ll need to add a constructor or an **initialize** method,\
    \ which is a special word/property in the Backbone.js framework. It’s called each\
    \ time we create an instance of an object, i.e., `var someObj = new SomeObject()`.\
    \ We can also pass extra parameters to the **initialize** function, as we did\
    \ with our views (we passed an object with the key **collection** and the value\
    \ of **apples** Backbone Collection). Read more on Backbone.js constructors at\
    \ [backbonejs.org/#View-constructor](http://backbonejs.org/#View-constructor).\n\
    \n```\n1   ...\n2   var appleView = Backbone.View.extend({\n3     initialize:\
    \ function(){\n4       //TODO: create and setup model (aka an apple)\n5     },\n\
    6   ...\n```\n\nGreat, we have our **initialize** function. Now we need to create\
    \ a model which will represent a single apple and set up proper event listeners\
    \ on the model. We’ll use two types of events, `change` and a custom event called\
    \ `spinner`. To do that, we are going to use the `on()` function, which takes\
    \ these properties: `on(event, actions, context)` — read more about it at [backbonejs.org/#Events-on](http://backbonejs.org/#Events-on):\n\
    \n```\n1   ...\n2   var appleView = Backbone.View.extend({\n3       this.model\
    \ = new (Backbone.Model.extend({}));\n4       this.model.bind('change', this.render,\
    \ this);\n5       this.bind('spinner',this.showSpinner, this);\n6     },\n7  \
    \ ... \n```\n\nThe code above basically boils down to two simple things:\n\n1.\
    \  Call `render()` function of **appleView** object when the model has changed\n\
    \n2.  Call `showSpinner()` method of **appleView** object when event **spinner**\
    \ has been fired.\n\nSo far, so good, right? But what about the spinner, a GIF\
    \ icon? Let’s create a new property in **appleView**:\n\n```\n1   ...\n2     templateSpinner:\
    \ '<img src=\"img/spinner.gif\" width=\"30\"/>',\n3   ... \n```\n\nRemember the\
    \ `loadApple` call in the router? This is how we can implement the function in\
    \ **appleView**:\n\n```\n 1   ...\n 2   loadApple:function(appleName){\n 3   \
    \  this.trigger('spinner'); \n 4     //show spinner GIF image\n 5     var view\
    \ = this; \n 6     //we'll need to access that inside of a closure\n 7     setTimeout(function(){\
    \ \n 8     //simulates real time lag when \n 9     //fetching data from the remote\
    \ server\n10       view.model.set(view.collection.where({\n11         name:appleName\n\
    12       })[0].attributes);  \n13     },1000);    \n14   },\n15   ...\n```\n\n\
    The first line will trigger the `spinner` event (the function for which we still\
    \ have to write).\n\nThe second line is just for scoping issues (so we can use\
    \ **appleView** inside of the closure).\n\nThe `setTimeout` function is simulating\
    \ a time lag of a real remote server response. Inside of it, we assign attributes\
    \ of a selected model to our view’s model by using a `model.set()` function and\
    \ a **model.attributes** property (which returns the properties of a model).\n\
    \nNow we can remove an extra code from the `render` method and implement the `showSpinner`\
    \ function:"
