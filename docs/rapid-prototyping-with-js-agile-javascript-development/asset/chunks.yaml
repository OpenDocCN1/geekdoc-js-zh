    \ the code into the editor, the example should work just fine. Please note that\
    \ code in GitHub and in the book might differ in formatting. Also, let us know\
    \ via email ([hi@rpjs.co](mailto:hi@rpjs.co)) if you spot any bugs!\n\n### Notation\n\
    \nThis is what source code blocks look like:\n\n```\n1 var object = {};\n2 object.name\
    \ = \"Bob\";\n```\n\nTerminal commands have a similar look but start with dollar\
    \ sign or $:\n\n```\n1 $ git push origin heroku\n2 $ cd /etc/\n3 $ ls \n```\n\n\
    Inline file names, path/folder names, quotes and special words/names are *italicized*,\
    \ while command names, e.g., **mongod**, and emphasized words, e.g., **Note**,\
    \ are **bold**.\n\n### Terms\n\nFor the purpose of this book, we’re using some\
    \ terms interchangeably, while depending on the context, they might not mean exactly\
    \ the same thing. For example, function = method = call, attribute = property\
    \ = member = key, value = variable, object = hash = class, list = array, framework\
    \ = library = module.\n\n## About the Author\n\n![Azat Mardan: a software engineer,\
    \ an author and a yogi.](images/azat.jpg)\n\nAzat Mardan: a software engineer,\
    \ an author and a yogi.\n\nAzat Mardan has over 12 years of experience in web,\
    \ mobile and software development. With a Bachelor’s Degree in Informatics and\
    \ a Master of Science in Information Systems Technology degree, Azat possesses\
    \ deep academic knowledge as well as extensive practical experience.\n\nCurrently,\
    \ Azat works as a Senior Software Engineer at [DocuSign](http://docusign.com),\
    \ where his team rebuilds 50 million user product (DocuSign web app) using the\
    \ tech stack of Node.js, Express.js, Backbone.js, CoffeeScript, Jade, Stylus and\
    \ Redis.\n\nRecently, he worked as an engineer at the curated social media news\
    \ aggregator website, [Storify.com](http://storify.com) (acquired by [LiveFyre](http://livefyre.com))\
    \ which is used by BBC, NBC, CNN, The White House and others. Storify runs everything\
    \ on Node.js unlike other companies. It’s the maintainer of the open-source library\
    \ [jade-browser](http://npmjs.org/jade-browser).\n\nBefore that, Azat worked as\
    \ a CTO/co-founder at [Gizmo](http://www.crunchbase.com/company/gizmo) — an enterprise\
    \ cloud platform for mobile marketing campaigns, and has undertaken the prestigious\
    \ [500 Startups](http://500.co/) business accelerator program.\n\nPrior to this,\
    \ Azat was developing he developed mission-critical applications for government\
    \ agencies in Washington, DC, including the [National Institutes of Health](http://nih.gov),\
    \ the [National Center for Biotechnology Information](http://ncbi.nlm.nih.gov),\
    \ and the [Federal Deposit Insurance Corporation](http://fdic.gov), as well as\
    \ [Lockheed Martin](http://lockheedmartin.com).\n\nAzat is a frequent attendee\
    \ at Bay Area tech meet-ups and hackathons ([AngelHack](http://angelhack.com)\
    \ hackathon ’12 finalist with team [FashionMetric.com](http://fashionmetric.com)).\n\
    \nIn addition, Azat teaches technical classes at [General Assembly](http://generalassemb.ly),\
    \ [Hack Reactor](http://hackreactor.com), [pariSOMA](http://parisoma.com) and\
    \ [Marakana](http://marakana.com) (acquired by Twitter) to much acclaim.\n\nIn\
    \ his spare time, he writes about technology on his blog: [webAppLog.com](http://webapplog.com)\
    \ which is [number one](http://expressjsguide.com/assets/img/expressjs-tutorial.png)\
    \ in “express.js tutorial” Google search results. Azat is also the author of [Express.js\
    \ Guide](http://expressjsguide.com), [Rapid Prototyping with JS](http://rpjs.co)\
    \ and [Oh My JS](http://leanpub.com/ohmyjs); and the creator of open-source Node.js\
    \ projects, including [ExpressWorks](http://npmjs.org/expressworks), [mongoui](http://npmjs.org/mongoui)\
    \ and [HackHall](http://hackhall.com).\n\n**Let’s be Friends on the Internet**\n\
    \n*   Twitter: [@RPJSbook](https://twitter.com/rpjsbook) and [@azat_co](https://twitter.com/azat_co)\n\
    \n*   Facebook: [facebook.com/RapidPrototypingWithJS](https://www.facebook.com/RapidPrototypingWithJS)\n\
    \n*   Website: [rapidprototypingwithjs.com](http://rapidprototypingwithjs.com/)\n\
    \n*   Blog: [webapplog.com](http://webapplog.com)\n\n*   GitHub: [github.com/azat-co/rpjs](https://github.com/azat-co/rpjs)\n\
    \n*   Storify: [Rapid Prototyping with JS](https://storify.com/azat_co/rapid-prototyping-with-js)\n\
    \n**Other Ways to Reach Us**\n\n*   Email: [hi@rpjs.co](mailto:hi@rpjs.co)\n\n\
    *   Google Group: [rpjs@googlegroups.com](mailto:rpjs@googlegroups.com) and [https://groups.google.com/forum/#!forum/rpjs](https://groups.google.com/forum/#!forum/rpjs)\n\
    \n**Share on Twitter**\n\n> “I’ve finished reading the Rapid Prototyping with\
    \ JS: Agile JavaScript Development book by @azat_co http://rpjs.co #nodejs #mongodb”\
    \ — [http://ctt.ec/4Vw73](http://ctt.ec/4Vw73)\n\n# I Quick Start\n\n## 1 Basics\n\
    \n**Summary**: overview of HTML, CSS, and JavaScript syntaxes; brief introduction\
    \ to Agile methodology; advantages of cloud computing, Node.js and MongoDB; descriptions\
    \ of HTTP requests/responses, RESTful API concepts.\n\n> *“I think everyone should\
    \ learn how to program a computer, because it teaches you how to think. I view\
    \ computer science as a liberal art, something everyone should learn to do.”*\
    \ — Steve Jobs\n\n### 1.1 Front-End Definitions\n\n#### 1.1.1 Bigger Picture\n\
    \nThe bigger picture of web and mobile application development consists of the\
    \ following steps:\n\n1.  User types a URL or follows a link in her browser (a.k.a.\
    \ client)\n\n2.  Browser makes HTTP request to the server\n\n3.  Server processes\
    \ the request, and if there are any parameters in a query string and/or body of\
    \ the request, it takes them into account\n\n4.  Server updates/gets/transforms\
    \ data in the database\n\n5.  Server responds with HTTP response containing data\
    \ in HTML, JSON or other formats\n\n6.  Browser receives HTTP response\n\n7. \
    \ Browser renders HTTP response to the user in HTML or any other format, e.g.,\
    \ JPEG, XML, JSON\n\nMobile applications act in the same manner as regular websites,\
    \ only instead of a browser there is a native app. Other minor differences include:\
    \ data transfer limitation due to carrier bandwidth, smaller screens, and the\
    \ more efficient use of the local storage.\n\nThere are a few approaches to mobile\
    \ development, each with its own advantages and disadvantages:\n\n*   Native iOS,\
    \ Android, Blackberry apps build with Objective-C and Java\n\n*   Native apps\
    \ build with JavaScript in [Appcelerator](http://www.appcelerator.com/), or similar\
    \ tools, and then complied into native Objective-C or Java\n\n*   Mobile websites\
    \ tailored for smaller screens with responsive design, CSS frameworks like [Twitter\
    \ Bootstrap](http://twitter.github.io/bootstrap/) or [Foundation](http://foundation.zurb.com/),\
    \ regular CSS or different templates"
