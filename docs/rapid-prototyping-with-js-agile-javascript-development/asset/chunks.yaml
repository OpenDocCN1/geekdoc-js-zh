  trans: "\n异步性对于熟悉 Python、PHP、C 或 Ruby 的程序员来说，需要一种不同的思维方式。如果忘记使用正确的 `return` 表达式来结束代码执行，很容易在无意中引入\
    \ bug。\n\n这里是一个说明该场景的简单示例：\n\n```\n 1 var test = function (callback) {\n 2   return\
    \ callback();  \n 3   console.log('test') //不应该被打印\n 4 }\n 5 \n 6 var test2 =\
    \ function(callback){\n 7   callback();\n 8   console.log('test2') //第 3 次打印\n\
    \ 9 }\n10 \n11 test(function(){\n12   console.log('callback1') //第一个打印\n13   test2(function(){\n\
    14   console.log('callback2') //第二个打印\n15   })\n16 });\n```\n\n如果我们不使用 `return\
    \ callback()` 而只是使用 `callback()`，那么我们的字符串 `test2` 将会被打印（`test` 不会被打印）。\n\n```\n\
    callback1\n2 callback2\n3 tes2\n```\n\n为了好玩，我为 `callback2` 字符串添加了 `setTimeout()`\
    \ 延迟，现在顺序变了：\n\n```\n 1 var test = function (callback) {\n 2   return callback();\
    \  \n 3   console.log('test') //不应该被打印\n 4 }\n 5 \n 6 var test2 = function(callback){\n\
    \ 7   callback();\n 8   console.log('test2') //第 2 次打印\n 9 }\n10 \n11 test(function(){\n\
    12   console.log('callback1') //第一个打印\n13   test2(function(){\n14     setTimeout(function(){\n\
    15       console.log('callback2') //第 3 次打印\n16     },100)\n17   })\n18 });\n\
    ```\n\n打印结果：\n\n```\ncallback1\n2 tes2\n3 callback2\n```\n\n最后一个示例说明了这两个函数是相互独立的，并且并行运行。较快的函数会比较慢的函数更早完成。回到我们的星巴克例子，你可能会比排在你前面的那个人更快拿到你的饮料。这对人有好处，对程序也有好处！:-)\n\
    \n## 8.2 使用 Monk 进行 MongoDB 迁移\n\n最近，我们的一个顶级用户抱怨说他的 [Storify](http://storify.com)\
    \ 账户无法访问。我们检查了生产数据库，发现该账户可能被某些使用该用户账户凭据的人恶意删除了。得益于强大的 MongoHQ 服务，我们在 15 分钟内就准备好了备份数据库。继续迁移有两种方案可用：\n\
    \n1. Mongo shell 脚本\n2. Node.js 程序\n\n由于 Storify 用户账户的删除涉及删除所有相关对象——身份、关系（关注者、订阅）、赞、故事——我们决定采用后一种方案。它运行得非常完美，这是一个你可以作为\
    \ MongoDB 迁移模板板的简化版本（也可以在 [gist.github.com/4516139](https://gist.github.com/4516139)）。\n\
    \n让我们加载所有需要的模块：[Monk](https://github.com/LearnBoost/monk)、[Progress](https://github.com/visionmedia/node-progress)、[Async](https://github.com/caolan/async)\
    \ 以及 MongoDB：\n\n```\n1 var async = require('async');\n2 var ProgressBar = require('progress');\n\
    3 var monk = require('monk');\n4 var ObjectId=require('mongodb').ObjectID;\n```\n\
    \n顺便说一下，由 [LeanBoost](https://www.learnboost.com/) 开发的 Monk 是一个“为 Node.js 中的 MongoDB\
    \ 使用提供简单且实质可用性改进的微型层”。\n\nMonk 采用以下格式的连接字符串：\n\n```\nusername:password@dbhost:port/database\n\
    ```\n\n因此我们可以创建以下对象：\n\n```\n1 var dest = monk('localhost:27017/storify_localhost');\n\
    2 var backup = monk('localhost:27017/storify_backup');\n```\n\n我们需要知道想要恢复的对象的\
    \ ID：\n\n```\n1 var userId = ObjectId(YOUR-OBJECT-ID); \n```\n\n这是一个实用的 `restore()`\
    \ 函数，我们可以复用它通过指定查询来从相关集合中恢复对象（关于 MongoDB 查询的更多信息，请参阅文章 [查询 2000 万记录的 MongoDB 集合](http://www.webapplog.com/querying-20m-record-mongodb-collection/)）。要调用它，只需以字符串形式传递集合名称，例如\
    \ `\"stories\"`，以及一个将此集合中的对象与你的主对象关联的查询，例如 `{userId:user.id}`。进度条是为了在终端中显示良好的视觉效果：\n\
    \n```\n 1 var restore = function(collection, query, callback){\n 2   console.info('restoring\
    \ from ' + collection);\n 3   var q = query;\n 4   backup.get(collection).count(q,\
    \ function(e, n) {\n 5     console.log('found '+collection);\n 6     if (e) console.error(e);\n\
    \ 7     var bar = new ProgressBar('[:bar] :current/:total' \n8       :percent,\
    \ width: 40 })\n 9     var tick = function(e) {\n10       if (e) {\n11       \
    \  console.error(e);\n12         bar.tick();\n13       }\n14       else {\n15\
    \         bar.tick();\n16       }\n17       if (bar.complete) {\n18         console.log();\n\
    19         console.log('restoring '+collection+' is completed');\n20         callback();\
    \                \n21       }\n22     };\n23     if (n>0){\n24       console.log('adding\
    \ '+n '+collection);\n25       backup.get(collection).find(q, { \n26         stream:\
    \ true \n27       }).each(function(element) {\n28         dest.get(collection).insert(element,\
    \ tick);\n29       });\n30     } else {\n31       callback();\n32     }\n33  \
    \ });\n34 }\n```\n\n现在我们可以使用 `async` 调用上述 `restore()` 函数：\n\n```\n 1 async.series({\n\
    \ 2   restoreUser: function(callback){   //导入用户元素\n 3     backup.get('users').find({_id:userId},\
    \ { \n4       stream: true, limit: 1 \n 5     }).each(function(user) {\n 6   \
    \    dest.get('users').insert(user, function(e){\n 7         if (e) {\n 8    \
    \       console.log(e);\n 9         }\n10         else {\n11           console.log('resored\
    \ user: '+ user.username);\n12         }\n13         callback();\n14       });\n\
    \ 15     });\n 16   },\n 17 \n 18   restoreIdentity: function(callback){  \n19\
    \     restore('identities',{\n20       userid:userId\n21     }, callback);\n 22\
    \   },\n 23 \n 24   restoreStories: function(callback){\n25     restore('stories',\
    \ {authorid:userId}, callback);\n 26   }\n 27 \n 28   }, function(e) {\n29   console.log();\n\
    30   console.log('restoring is completed!');\n31   process.exit(1);\n32 });\n\
    ```\n\n完整代码可以在 [gist.github.com/4516139](https://gist.github.com/4516139) 获取，并在此处所示：\n"
