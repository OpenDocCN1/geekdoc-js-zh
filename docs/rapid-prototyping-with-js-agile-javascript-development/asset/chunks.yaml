    \n```\n1   var homeView = Backbone.View.extend({\n2   });\n```\n\n看起来很熟悉，对吧？Backbone.js\
    \ 对所有组件都使用了类似的语法：`extend` 函数以及一个 JSON 对象作为它的参数。\n\n从现在起有多种处理方法，但最佳实践是使用 `el` 和\
    \ `template` 属性，这两个属性在 Backbone.js 中是“魔法”的，也就是说是特殊的：\n\n```\n1   var homeView\
    \ = Backbone.View.extend({\n2     el: 'body',\n3     template: _.template('Hello\
    \ World')   \n4   });\n```\n\n属性 `el` 只是一个包含 jQuery 选择器的字符串（你可以使用 `.` 配合类名或 `#`\
    \ 配合 ID 名称）。\n\n`template` 属性被赋值了一个 Underscore.js 的 `template` 函数，其内容只是纯文本“Hello\
