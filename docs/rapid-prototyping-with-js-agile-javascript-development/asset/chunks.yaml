  raw: "*   `http.listen()`: begins accepting connections on the specified port and\
    \ hostname\n\n*   `http.createClient()`: node app can be a client and make requests\
    \ to other servers\n\n*   `http.ServerRequest()`: incoming requests are passed\
    \ to request handlers\n\n    *   **data**: emitted when a piece of the message\
    \ body is received\n\n    *   **end**: emitted exactly once for each request\n\
    \n    *   `request.method()`: the request method as a string\n\n    *   `request.url()`:\
    \ request URL string\n\n*   `http.ServerResponse()`: this object is created internally\
    \ by an HTTP server — not by the user, and used as an output of request handlers\n\
    \n    *   `response.writeHead()`: sends a response header to the request\n\n \
    \   *   `response.write()`: sends a response body * `response.end()`: sends and\
    \ ends a response body\n\n**[util](http://nodejs.org/api/util.html)**\n\nThis\
    \ module provides utilities for debugging. Some of the methods include:\n\n* \
    \  `util.inspect()`: Return a string representation of an object, which is useful\
    \ for debugging\n\n**[querystring](http://nodejs.org/api/querystring.html)**\n\
    \nThis module provides utilities for dealing with query strings. Some of the methods\
    \ include:\n\n*   `querystring.stringify()`: Serialize an object to a query string\n\
    \n*   `querystring.parse()`: Deserialize a query string to an object\n\n**[url](http://nodejs.org/api/url.html)**\n\
    \nThis module has utilities for URL resolution and parsing. Some of the methods\
    \ include:\n\n*   `parse()`: Take a URL string, and return an object\n\n**[fs](http://nodejs.org/api/fs.html)**\n\
    \nfs handles file system operations such as reading and writing to/from files.\
    \ There are synchronous and asynchronous methods in the library. Some of the methods\
    \ include:\n\n*   `fs.readFile()`: reads file asynchronously\n\n*   `fs.writeFile()`:\
    \ writes data to file asynchronously\n\nThere is no need to install or download\
    \ core modules. To include them in your application, all you need is to follow\
    \ the syntax:\n\n```\n1 var http = require('http');\n```\n\nThe lists of non-core\
    \ modules can be found at:\n\n*   [npmjs.org](https://npmjs.org): Node Package\
