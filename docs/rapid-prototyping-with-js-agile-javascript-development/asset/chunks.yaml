    \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
    \        expect(res.body.length).to.above(0)\n        expect(res.body.map(item){\n\
    \          return item._id\n        })).to.contain(id)\n        done()\n     \
    \ })\n  }) \n  it('updates an object', function(done){\n    superagent.put('http://localhost:3000/collections/'+id)\n\
    \      .send({name: 'Peter'\n        , email: 'peter@yahoo.com'})\n      .end(function(e,\
    \ res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n  \
    \      expect(typeof res.body).to.eql('object')\n        done()\n      })\n  })\
    \ \n  it('checks an updated object', function(done){\n    superagent.get('http://localhost:3000/collections/'+id)\n\
    \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
    \        expect(typeof res.body).to.eql('object')\n        expect(res.body._id.length).to.eql(24)\
    \        \n        expect(res.body._id).to.eql(id)        \n        done()\n \
    \     })\n  })\n  it('removes an object', function(done){\n    superagent.del('http://localhost:3000/collections/'+id)\n\
    \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
    \        expect(typeof res.body).to.eql('object')\n        done()\n      })\n\
    \  })\n})\n```\n"
- fmt: "\nNote: If you wish to connect to a remote database, e.g., [MongoHQ](https://www.mongohq.com/home)\
    \ instance, substitute the string with your username, password, host and port\
    \ values. Here is the format of the URI string: `mongodb://[username:password@]host1[:port1][,host2[:port2],...[,hostN[:portN]]][/[database][?options]]`\n\
    \nThe `app.param()` method is another Express.js middleware. It basically says\
    \ “do something every time there is this value in the URL pattern of the request\
    \ handler.” In our case we select a particular collection when request pattern\
    \ contains a sting `collectionName` prefixed with a colon (you’ll see it later\
    \ in the routes):\n\n```javascript\n1 app.param('collectionName', \n2   function(req,\
    \ res, next, collectionName) {\n3     req.collection = db.collection(collectionName)\n\
    4     return next()\n5   }\n6 )\n```\n\nMerely to be user-friendly, let’s put\
    \ a root route with a message:\n\n```javascript\n1 app.get('/', function(req,\
    \ res) {\n2   res.send('please select a collection, e.g., /collections/messages')\n\
    3 })\n```\n\nNow the real work begins. Here is how we retrieve a list of items\
    \ sorted by `_id` and which has a limit of 10:\n\n```javascript\n 1 app.get('/collections/:collectionName',\
    \ \n2   function(req, res) {\n3     req.collection\n4       .find({},\n5     \
    \    {limit:10, sort: [['_id',-1]]}\n6       ).toArray(function(e, results){\n\
    7         if (e) return next(e)\n8         res.send(results)\n9       }\n10  \
    \   )\n11   }\n12 )\n```\n\nHave you noticed a `:collectionName` string in the\
    \ URL pattern parameter? This and the previous `app.param()` middleware is what\
    \ gives us the `req.collection` object which points to a specified collection\
    \ in our database.\n\nThe object creating endpoint is slightly easier to grasp\
    \ since we just pass the whole payload to the MongoDB (method a.k.a. free JSON\
    \ REST API):\n\n```javascript\n1 app.post('/collections/:collectionName', function(req,\
    \ res) {\n2   req.collection.insert(req.body, {}, function(e, results){\n3   \
    \  if (e) return next(e)\n4     res.send(results)\n5   })\n6 })\n```\n\nSingle\
    \ object retrieval functions are faster than `find()`, but they use different\
    \ interface (they return object directly instead of a cursor), so please be aware\
    \ of that. In addition, we’re extracting the ID from `:id` part of the path with\
    \ `req.params.id` Express.js magic:\n\n```javascript\n1 app.get('/collections/:collectionName/:id',\
    \ function(req, res) {\n2   req.collection.findOne({_id: req.collection.id(req.params.id)},\
    \ \n3     function(e, result){\n4       if (e) return next(e)\n5       res.send(result)\n\
    6     }\n7   )\n8 })\n```\n\nPUT request handler gets more interesting because\
    \ `update()` doesn’t return the augmented object, instead it returns us a count\
    \ of affected objects.\n\nAlso `{$set:req.body}` is a special MongoDB operator\
    \ (operators tend to start with a dollar sign) that sets values.\n\nThe second\
    \ `{safe:true, multi:false}` parameter is an object with options that tell MongoDB\
    \ to wait for the execution before running the callback function and to process\
    \ only one (first) item.\n\n```javascript\n 1 app.put('/collections/:collectionName/:id',\
    \ function(req, res) {\n2   req.collection.update({_id: req.collection.id(req.params.id)},\
    \ \n3     {$set:req.body}, \n4     {safe:true, multi:false}, \n5     function(e,\
    \ result){\n6       if (e) return next(e)\n7       res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    8     }\n9   )\n10 })\n```\n\nFinally, the DELETE method which also output a custom\
    \ JSON message:\n\n```javascript\n1 app.del('/collections/:collectionName/:id',\
    \ function(req, res) {\n2   req.collection.remove({_id: req.collection.id(req.params.id)},\
    \ 3     function(e, result){\n4       if (e) return next(e)\n5     res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    6     }\n7   )\n8 })\n```\n\nNote: The `delete` is an operator in JavaScript,\
    \ so Express.js uses `app.del` instead.\n\nThe last line that actually starts\
    \ the server on port 3000 in this case:\n\n```javascript\n1 app.listen(3000)\n\
    ```\n\nJust in case something is not working quite well here is the full code\
    \ of `express.js` file:\n\n```javascript\n 1 var express = require('express')\n\
    2   , mongoskin = require('mongoskin')\n3 \n4 var app = express()\n5 app.use(express.bodyParser())\n\
    6 \n7 var db = mongoskin.db('localhost:27017/test', {safe:true})\n8 app.param('collectionName',\
    \ \n9   function(req, res, next, collectionName) {\n10     req.collection = db.collection(collectionName)\n\
    11     return next()\n12   }\n13 )\n14 app.get('/', function(req, res) {\n15 \
    \  res.send('please select a collection, e.g., /collections/messages')\n16 })\n\
    17 app.get('/collections/:collectionName', \n18   function(req, res) {\n19   \
    \  req.collection\n20       .find({},\n21         {limit:10, sort: [['_id',-1]]}\n\
    22       ).toArray(function(e, results){\n23         if (e) return next(e)\n24\
    \         res.send(results)\n25       }\n26     )\n27   }\n28 )\n29 app.post('/collections/:collectionName',\
    \ function(req, res) {\n30   req.collection.insert(req.body, {}, function(e, results){\n\
    31     if (e) return next(e)\n32     res.send(results)\n33   })\n34 })\n35 app.get('/collections/:collectionName/:id',\
    \ function(req, res) {\n36   req.collection.findOne({_id: req.collection.id(req.params.id)},\
    \ \n37     function(e, result){\n38       if (e) return next(e)\n39       res.send(result)\n\
    40     }\n41   )\n42 })\n43 app.put('/collections/:collectionName/:id', function(req,\
    \ res) {\n44   req.collection.update({_id: req.collection.id(req.params.id)},\
    \ \n45     {$set:req.body}, \n46     {safe:true, multi:false}, \n47     function(e,\
    \ result){\n48       if (e) return next(e)\n49       res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    50     }\n51   )\n52 })\n53 app.del('/collections/:collectionName/:id', function(req,\
    \ res) {\n54   req.collection.remove({_id: req.collection.id(req.params.id)},\
    \ 55     function(e, result){\n56       if (e) return next(e)\n57       res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
    58     }\n59   )\n60 })\n61 app.listen(3000)\n```\n"
