    \ of the server\n66 console.log('Server running at http://127.0.0.1:1337/');\n\
    67 \n68 exports.getMessages = function() {\n69   return JSON.stringify(messages);\n\
    70   //output array of messages as a string/text\n71 };\n72 exports.addMessage\
    \ = function (data){\n73   messages.push(querystring.parse(data));\n74   //to\
    \ convert string into\n75   //JavaScript object we use parse/deserializer\n76\
    \   return JSON.stringify(querystring.parse(data));\n77   //output new message\
    \ in JSON as a string\n78 };\n```\n\nTo check it, go to [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json).\
    \ You should see an example message. Alternatively, you could use the terminal\
    \ command:\n\n```\n1 $ curl http://127.0.0.1:1337/messages/list.json\n```\n\n\
    To make the POST request by using a command line interface:\n\n```\n1 curl -d\
    \ \"name=BOB&message=test\" http://127.0.0.1:1337/messages/create.json\n```\n\n\
    And you should get the output in a server terminal window and a new message “test”\
    \ when you refresh [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json).\
    \ Needless to say, all three tests should pass.\n\nYour application might grow\
    \ bigger with more methods, URL paths to parse and conditions. That is where frameworks\
    \ come in handy. They provide helpers to process requests and other nice things\
    \ like static file support, sessions, etc. In this example, we intentionally didn’t\
    \ use any frameworks like Express ([http://expressjs.com/](http://expressjs.com/))\
    \ or Restify ([http://mcavage.github.com/node-restify/](http://mcavage.github.com/node-restify/)).\
    \ Other notable Node.js frameworks:\n\n*   [Derby](http://derbyjs.com/): MVC framework\
    \ making it easy to write real-time, collaborative applications that run in both\
    \ Node.js and browsers\n\n*   [Express.js](http://expressjs.com): the most robust,\
    \ tested and used Node.js framework\n\n*   [Restify](http://mcavage.github.com/node-restify/):\
    \ lightweight framework for REST API servers\n\n*   [Sails.js](http://sailsjs.org/):\
    \ MVC Node.js framework\n\n*   [hapi](http://spumko.github.io/): Node.js framework\
    \ built on top of Express.js\n\n*   [Connect](http://www.senchalabs.org/connect/):\
    \ a middleware framework for node, shipping with over 18 bundled middlewares and\
    \ a rich selection of third-party middleware\n\n*   [GeddyJS](http://geddyjs.org):\
    \ a simple, structured MVC web framework for Node\n\n*   [CompoundJS](http://compoundjs.com/)\
    \ (ex-RailswayJS): Node.JS MVC framework based on ExpressJS\n\n*   [Tower.js](http://towerjs.org):\
    \ a full stack web framework for Node.js and the browser\n\n*   [Meteor](http://meteor.com):\
    \ open-source platform for building top-quality web apps in a fraction of the\
    \ time\n\nWays to improve the application:\n\n*   Improve existing test cases\
    \ by adding object comparison instead of a string one\n\n*   Move the seed data\
    \ to **test.js** from **mb-server.js**\n\n*   Add test cases to support your front-end,\
    \ e.g., up-vote, user log in\n\n*   Add methods to support your front-end, e.g.,\
    \ up-vote, user log in\n\n*   Generate unique IDs for each message and store them\
    \ in a Hash instead of an Array\n\n*   Install Mocha and re-factor test.js so\
    \ it uses this library\n\nSo far we’ve been storing our messages in the application\
    \ memory, so each time the application is restarted, we lose it. To fix it, we\
    \ need to add a persistence, and one of the ways is to use a database like MongoDB.\n\
    \n### 6.4 MongoDB\n\n#### 6.4.1 MongoDB Shell\n\nIf you haven’t done so already,\
    \ please install the latest version of MongoDB from [mongodb.org/downloads](http://www.mongodb.org/downloads).\
    \ For more instructions, please refer to the *[Setup, Database: MongoDB](#chap07.xhtml_database)*\
    \ section.\n\nNow from the folder where you unpacked the archive, launch the **mongod**\
    \ service with:\n\n```\n1 $ ./bin/mongod\n```\n\nYou should be able to see information\
    \ in your terminal and in the browser at [localhost:28017](http://localhost:28017).\n\
    \nFor the MongoDB shell, or **mongo**, launch in a new terminal window (**important!**),\
    \ and at the same folder this command:\n\n```\n1 $ ./bin/mongo\n```\n\nYou should\
    \ see something like this, depending on your version of the MongoDB shell:\n\n\
    ```\n1 MongoDB shell version: 2.0.6\n2 connecting to: test\n```\n\nTo test the\
    \ database, use the JavaScript-like interface and commands **save** and **find**:\n\
    \n```\n1 > db.test.save( { a: 1 } )\n2 > db.test.find()\n```\n\nMore detailed\
    \ step-by-step instructions are available at [Setup, Database: MongoDB](#chap07.xhtml_database).\n\
    \nSome other useful MongoDB shell commands:\n\n```\n 1 > help\n 2 > show dbs\n\
    \ 3 > use board\n 4 > show collections\n 5 > db.messages.remove();\n 6 > var a\
    \ = db.messages.findOne();\n 7 > printjson(a);\n 8 > a.message = \"hi\";\n 9 >\
    \ db.messages.save(a);\n10 > db.messages.find({});\n11 > db.messages.update({name:\
    \ \"John\"},{$set: {message: \"bye\"}});\n12 > db.messages.find({name: \"John\"\
    });\n13 > db.messages.remove({name: \"John\"});\n```\n\nA full overview of the\
    \ MongoDB interactive shell is available at mongodb.org: [Overview - The MongoDB\
    \ Interactive Shell](http://www.mongodb.org/display/DOCS/Overview+-+The+MongoDB+Interactive+Shell).\n\
    \n#### 6.4.2 MongoDB Native Driver\n\nWe’ll use Node.js Native Driver for MongoDB\
    \ ([https://github.com/christkv/node-mongodb-native](https://github.com/christkv/node-mongodb-native))\
    \ to access MongoDB from Node.js applications. Full documentation is also available\
    \ at [http://mongodb.github.com/node-mongodb-native/api-generated/db.html](http://mongodb.github.com/node-mongodb-native/api-generated/db.html).\n\
    \nTo install MongoDB Native driver for Node.js, use:\n\n```\n1 $ npm install mongodb\n\
    ```\n\nMore details are at [http://www.mongodb.org/display/DOCS/node.JS](http://www.mongodb.org/display/DOCS/node.JS).\n\
    \nDon’t forget to include the dependency in the **package.json** file as well:\n\
    \n```\n 1 {\n 2   \"name\": \"node-example\",\n 3   \"version\": \"0.0.1\",\n\
    \ 4   \"dependencies\": {\n 5 \t\"mongodb\":\"\",\n 6 \t...\n 7   },\n 8   \"\
    engines\": {\n 9     \"node\": \">=0.6.x\"\n10   }\n11 }\n```"
