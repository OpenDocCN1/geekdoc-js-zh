    66   restoreIdentity: function(callback){  \n67     restore('identities',{\n68\
    \       userid:userId\n69     }, callback);\n70   },\n71 \n72   restoreStories:\
    \ function(callback){\n73     restore('stories', {authorid:userId}, callback);\n\
    74   }\n75 \n76   }, function(e) {\n77   console.log();\n78   console.log('restoring\
    \ is completed!');\n79   process.exit(1);\n80 });\n```\n\nTo launch it, run `npm\
    \ install`/`npm update` and change the hard-coded database values.\n\n### 8.3\
    \ TDD in Node.js with Mocha\n\n#### 8.3.1 Who Needs Test-Driven Development?\n\
    \nImagine that you need to implement a complex feature on top of an existing interface,\
    \ e.g., a ‘like’ button on a comment. Without tests, you’ll have to manually create\
    \ a user, log in, create a post, create a different user, log in with a different\
    \ user and like the post. Tiresome? What if you’ll need to do it 10 or 20 times\
    \ to find and fix some nasty bug? What if your feature breaks existing functionality,\
    \ but you notice it six months after the release because there was no test?!\n\
    \nDon’t waste time writing tests for throwaway scripts, but please adapt the habit\
    \ of Test-Driven Development for the main code base. With a little time spent\
    \ in the beginning, you and your team will save time later and have confidence\
    \ when rolling out new releases. Test Driven Development is a really, really,\
    \ really good thing.\n\n#### 8.3.2 Quick Start Guide\n\nFollow this quick guide\
    \ to set up your Test-Driven Development process in Node.js with [Mocha](http://visionmedia.github.com/mocha/).\n\
    \nInstall [Mocha](http://visionmedia.github.com/mocha/) globally by executing\
    \ this command:\n\n```\n1 $ sudo npm install -g mocha\n```\n\nWe’ll also use two\
    \ libraries, [Superagent](https://github.com/visionmedia/superagent) and [expect.js](https://github.com/LearnBoost/expect.js/)\
    \ by [LearnBoost](https://github.com/LearnBoost). To install them, fire up [NPM](https://npmjs.org/)\
    \ commands in your project folder like this:\n\n```\n1 $ npm install superagent\n\
    2 $ npm install expect.js \n```\n\nOpen a new file with `.js` extension and type:\n\
    \n```\n1 var request = require('superagent');\n2 var expect = require('expect.js');\n\
    ```\n\nSo far we’ve included two libraries. The structure of the test suite going\
    \ to look like this:\n\n```\n 1 describe('Suite one', function(){\n 2   it(function(done){\n\
    \ 3   ...\n 4   });\n 5   it(function(done){\n 6   ...\n 7   });\n 8 });\n 9 describe('Suite\
    \ two', function(){\n10   it(function(done){\n11   ...\n12   });\n13 });\n```\n\
    \nInside of this closure, we can write a request to our server, which should be\
    \ running at [localhost:8080](http://localhost:8080):\n\n```\n1 ...\n2 it (function(done){\n\
    3   request.post('localhost:8080').end(function(res){\n4     //TODO check that\
    \ response is okay\n5   });\n6 });\n7 ...\n```\n\nExpect will give us handy functions\
    \ to check any condition we can think of:\n\n```\n1 ...\n2 expect(res).to.exist;\n\
    3 expect(res.status).to.equal(200);\n4 expect(res.body).to.contain('world');\n\
    5 ...\n```\n\nLastly, we need to add the **done()** call to notify Mocha that\
    \ the asynchronous test has finished its work. And the full code of our first\
    \ test looks like this:\n\n```\n 1 var request = require('superagent');\n 2 var\
    \ expect = require('expect.js');\n 3   \n 4 describe('Suite one', function(){\n\
    \ 5  it (function(done){\n 6    request.post('localhost:8080').end(function(res){\n\
    \ 7     expect(res).to.exist;\n 8     expect(res.status).to.equal(200);\n 9  \
    \   expect(res.body).to.contain('world');\n10     done();\n11   });\n12 });\n\
    ```\n\nIf we want to get fancy, we can add **before** and **beforeEach** hooks\
    \ which will, according to their names, execute once before the test (or suite)\
    \ or each time before the test (or suite):\n\n```\n 1 before(function(){\n 2 \
    \  //TODO seed the database\n 3 });\n 4 describe('suite one ',function(){\n 5\
    \   beforeEach(function(){\n 6     //todo log in test user\n 7   });\n 8   it('test\
    \ one', function(done){\n 9   ...\n10   });\n11 });\n```\n\nNote that before and\
    \ beforeEach can be placed inside or outside of the describe construction.\n\n\
    To run our test, simply execute:\n\n```\n1 $ mocha test.js\n```\n\nTo use a different\
    \ report type:\n\n```\n1 $ mocha test.js -R list\n2 $ mocah test.js -R spec\n\
    ```\n\n### 8.4 Wintersmith — Static Site Generator\n\nFor this book’s one-page\
    \ website —[rapidprototypingwithjs.com](http://rapidprototypingwithjs.com) — I\
    \ used [Wintersmith](http://jnordberg.github.com/wintersmith/) to learn something\
    \ new and to ship fast. Wintersmith is a Node.js static site generator. It greatly\
    \ impressed me with its flexibility and ease of development. In addition, I could\
    \ stick to my favorite tools such as [Markdown](http://daringfireball.net/projects/markdown/),\
    \ Jade and [Underscore](http://underscorejs.org/).\n\n**Why Static Site Generators**\n\
    \nHere is a good article on why using a static site generator is a good idea in\
    \ general: [An Introduction to Static Site Generators](http://www.mickgardner.com/2012/12/an-introduction-to-static-site.html).\
    \ It basically boils down to a few main things:\n\n**Templates**\n\nYou can use\
    \ template engines such as [Jade](https://github.com/visionmedia/jade). Jade uses\
    \ whitespaces to structure nested elements, and its syntax is similar to Ruby\
    \ on Rail’s Haml markup.\n\n**Markdown**\n\nI’ve copied markdown text from my\
    \ book’s Introduction chapter and used it without any modifications. Wintersmith\
    \ comes with a [marked](https://github.com/chjj/marked) parser by default. More\
    \ on why Markdown is great in my old post: [Markdown Goodness](http://www.webapplog.com/markdown-goodness/).\n\
    \n**Simple Deployment**\n\nEverything is HTML, CSS and JavaScript so you just\
    \ upload the files with an FTP client, e.g., [Transmit](http://www.panic.com/transmit/)\
    \ (by Panic) or [Cyberduck](http://cyberduck.ch/).\n\n**Basic Hosting**\n\nDue\
    \ to the fact that any static web server will work well, there is no need for\
    \ Heroku or Nodejitsu PaaS solutions, or even PHP/MySQL hosting.\n\n**Performance**\n\
    \nThere are no database calls, no server-side API calls, and no CPU/RAM overhead.\n\
    \n**Flexibility**"
