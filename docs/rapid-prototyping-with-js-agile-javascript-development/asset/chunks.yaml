    \   border-color: #7d2717;\n13 }\n```\n\nAs you can see, LESS dramatically improves\
    \ the reusability of plain CSS. Here are some online tools for compilation:\n\n\
    *   [LESS2CSS](http://less2css.org/): slick browser-based LESS to CSS converter\
    \ built on Express.js\n\n*   [lessphp](http://leafo.net/lessphp/): online demo\
