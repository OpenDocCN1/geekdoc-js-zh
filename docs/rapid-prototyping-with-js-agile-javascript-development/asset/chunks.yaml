    \ [你的第一个 Node.js 模块](http://cnnr.me/blog/2012/05/27/your-first-node-dot-js-module/)\n\
    \n#### 6.1.3 Node 包管理器\n\nNode 包管理器（或 NPM）负责为你管理依赖关系并安装模块。Node.js 安装程序自带 NPM，其网站为\
    \ [npmjs.org](http://npmjs.org/)。\n\n`package.json` 包含关于我们 Node.js 应用程序的元信息，如版本号、作者姓名，最重要的是我们在应用程序中使用的依赖项。所有这些信息都在\
    \ JSON 格式的对象中，由 NPM 读取。\n\n如果你想安装 `package.json` 中指定的包和依赖项，请输入：\n\n```\n1 $ npm\
    \ install \n```\n\n一个典型的 `package.json` 文件可能如下所示：\n\n```\n 1 {\n 2    \"name\"\
    : \"Blerg\",\n 3    \"description\": \"Blerg blerg blerg.\",\n 4    \"version\"\
    : \"0.0.1\",\n 5    \"author\": {\n 6       \"name\" : \"John Doe\", \n 7    \
    \   \"email\" : \"john.doe@gmail.com\"\n 8    },\n 9    \"repository\": {\n10\
    \        \"type\": \"git\",\n11        \"url\": \"http://github.com/johndoe/blerg.git\"\
    \n12    },\n 13    \"engines\": [\n14        \"node >= 0.6.2\"\n15    ],\n 16\
    \    \"license\" : \"MIT\",\n 17    \"dependencies\": {\n18        \"express\"\
    : \">= 2.5.6\",\n19        \"mustache\": \"0.4.0\",\n20        \"commander\":\
    \ \"0.5.2\"\n21    },\n 22    \"bin\" : {\n23        \"blerg\" : \"./cli.js\"\n\
    24    }\n 25 }\n```\n\n要将包更新到当前最新版本，或 `package.json` 中定义的版本规范允许的最新版本，请使用：\n\n\
    ```\n1 $ npm update name-of-the-package\n```\n\n或者对于单个模块安装：\n\n```\n1 $ npm install\
    \ name-of-the-package\n```\n\n示例中使用的唯一一个且不属于 Node.js 核心包的模块是 `mongodb`。我们将在书的后部分安装它。\n\
    \nHeroku 需要 `package.json` 来在服务器上运行 NPM。\n\n有关 NPM 的更多信息，请查看文章 [NPM 之之旅](http://tobyho.com/2012/02/09/)。\n\
    \n#### 6.1.3 部署到 Azure\n\n为了部署，我们需要创建一个仓库。在项目文件夹中执行：\n\n```\n1 $ git init\n```\n\
    \n现在添加文件并进行首次提交：\n\n```\n1 $ git add .\n2 $ git commit -m \"first commit\"\n```\n\
    \n#### 6.1.5 部署到 Azure\n\n为了部署应用程序，我们需要添加 Git 远程。命令与 Windows Azure 类似，但我们需要添加\
    \ Git 远程：\n\n```\n1 $ remote add azure\n```\n\n完成后，推送并更新：\n\n```\n1 $ git push\
    \ master\n2 $ git add .\n3 $ git commit -m \"changes\"\n4 $ git push master\n\
    ```\n\n#### 6.1.6 部署到 Heroku\n\n对于 Heroku 部署，我们需要创建额外的文件：`Procfile` 和 `package.json`。\n\
    \n在我们的项目文件夹中拥有所有文件后，可以使用 Git 部署应用程序。命令与之前类似，但我们需要添加 Git 远程，并使用以下命令创建：\n\n```\n\
    1 $ heroku create\n```\n\n完成后，推送并更新：\n\n```\n1 $ git push heroku master\n2 $ git\
    \ add .\n3 $ git commit -am \"changes\"\n4 $ git push heroku master\n```\n\n####\
    \ 6.2 聊天：内存版本\n\n为了遵循 KISS 原则（保持简单），聊天后端应用程序的第一个版本将消息存储在内存存储中。这意味着每次我们启动/重置服务器时，数据都会丢失。\n\
    \n我们将从一个简单的测试用例开始，以说明测试驱动开发（TDD）方法。\n\n#### 6.3 聊天测试用例\n\n我们应该有两个方法：\n\n1.  使用\
    \ `getMessages()` 方法为 GET `/message` 端点以 JSON 对象数组的形式获取所有消息。\n\n"
- fmt: "\n## 2. Add a new message with properties `name` and `message` for POST `/messages`\
    \ route via the `addMessage()` function\n\nWe’ll start by creating an empty `mb-server.js`\
    \ file. After it’s there, let’s switch to tests and create the `test.js` file\
    \ with the following content:\n\n```\n 1 var http = require('http');\n 2 var assert\
    \ = require('assert');\n 3 var querystring = require('querystring');\n 4 var util\
    \ = require('util');\n 5 \n 6 var messageBoard = require('./mb-server');\n 7 \n\
    \ 8 assert.deepEqual('[{\"name\":\"John\",\"message\":\"hi\"}]',\n 9   messageBoard.getMessages());\n\
    10 assert.deepEqual ('{\"name\":\"Jake\",\"message\":\"gogo\"}',\n11   messageBoard.addMessage\
    \ (\"name=Jake&message=gogo\"));\n12 assert.deepEqual('[{\"name\":\"John\",\"\
    message\":\"hi\"},{\"name\":\"Jake\",\"message\":\"gogo\"}]', \n13   messageBoard.getMessages(\"\
    name=Jake&message=gogo\"));\n```\n\nPlease keep in mind that, this is a very simplified\
    \ comparison of strings and not JavaScript objects. So every space, quote and\
    \ case matters. You could make the comparison “smarter” by parsing a string into\
    \ a JSON object with:\n\n```\n1 JSON.parse(str);\n```\n\nFor testing our assumptions,\
    \ we use core the Node.js module [assert](http://nodejs.org/api/assert.html).\
    \ It provides a bunch of useful methods like `equal()`, `deepEqual()`, etc.\n\n\
    More advanced libraries include alternative interfaces with TDD and/or BDD approaches:\n\
    \n* [Should](https://github.com/visionmedia/should.js/)\n* [Expect](https://github.com/LearnBoost/expect.js/)\n\
    \nFor more Test-Driven Development and cutting-edge automated testing, you could\
    \ use the following libraries and modules:\n\n* [Mocha](http://visionmedia.github.com/mocha/)\n\
    * [NodeUnit](https://github.com/caolan/nodeunit)\n* [Jasmine](http://pivotal.github.com/jasmine/)\n\
    * [Vows](http://vowsjs.org/)\n* [Chai](http://chaijs.com/)\n\nYou could copy the\
    \ “Hello World” script into the `mb-server.js` file for now or even keep it empty.\
    \ If we run `test.js` by the terminal command:\n\n```\n1 $ node test.js \n```\n\
    \nWe should see an error. Probably something like this one:\n\n```\n1 TypeError:\
    \ Object #<Object> has no method 'getMessages'\n```\n\nThat’s totally fine, because\
    \ we haven’t written `getMessages()` method yet. So let’s do it and make our application\
    \ more useful by adding two new methods: to get the list of the messages for Chat\
    \ and to add a new message to the collection.\n\n### mb-server.js file with global\
    \ `exports` object:\n\n```\n1 exports.getMessages = function() {\n2   return JSON.stringify(messages);\n\
    3 };\t\n4 exports.addMessage = function (data){\t\t\n5   messages.push(querystring.parse(data));\n\
    6   return JSON.stringify(querystring.parse(data));\t\n7 };\n```\n\nSo far, nothing\
    \ fancy, right? To store the list of messages, we’ll use an array:\n\n```\n1 var\
    \ messages=[];\n2 //this array will hold our messages\n3 messages.push({\n4  \
    \ \"name\":\"John\",\n5   \"message\":\"hi\"\n6 });\n7 //sample message to test\
    \ list method\n```\n\n| ![tip](images/leanpub_tip.png) | **Tip**: Generally, fixtures\
    \ like dummy data belong to the test/spec files and not to the main application\
    \ codebase. |\n\nOur server code will look slightly more interesting. For getting\
    \ the list of messages, according to REST methodology, we need to make a GET request.\
    \ For creating/adding a new message, it should be a POST request. So in our `createServer`\
    \ object, we should add `req.method()` and `req.url()` to check for an HTTP request\
    \ type and a URL path.\n\nLet’s load the `http` module:\n\n```\n1 var http = require('http');\n\
    ```\n\nWe’ll need some of the handy functions from the `util` and `querysting`\
    \ modules (to serialize and deserialize objects and query strings):\n\n```\n1\
    \ var util = require('util');\n2 var querystring = require('querystring');\n```\n\
    \nTo create a server and expose it to outside modules (i.e., `test.js`):\n\n```\n\
    1 exports.server=http.createServer(function (req, res) {\n```\n\nInside of the\
    \ request handler callback, we should check if the request method is POST and\
    \ the URL is `/messages/create.json`:\n\n```\n1   if (req.method == \"POST\" &&\
    \ \n2     req.url == \"/messages/create.json\") {\n```\n\nIf the condition above\
    \ is true, we add a message to the array. However, `data` must be converted to\
    \ a string type (with encoding UTF-8) prior to the adding, because it is a type\
