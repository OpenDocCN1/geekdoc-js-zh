- fmt: "\nBasically, we tell a browser to load the files from the array of filenames\
    \ — first parameter of the `require()` function — and then pass our modules from\
    \ those files to the anonymous callback function (second argument) as variables.\
    \ Inside of the main function (anonymous callback) we can use our modules by referencing\
    \ those variables. Therefore, our `apple-app.js` metamorphoses into:\n\n```\n\
    \ 1   require([\n 2     'apple-item.tpl', //can use shim plugin\n 3     'apple-home.tpl',\n\
    \ 4     'apple-spinner.tpl',\n 5     'apple.tpl',\n 6     'apple-item.view',\n\
    \ 7     'apple-home.view',\n 8     'apple.view',\n 9     'apples'  \n10   ],function(\n\
    11     appleItemTpl,\n 12     appleHomeTpl,\n 13     appleSpinnerTpl,\n 14   \
    \  appleTpl,\n 15     appelItemView,\n 16     homeView,\n 17     appleView,\n\
    \ 18     Apples\n 19     ){\n20    var appleData = [\n 21       {\n 22       \
    \  name: \"fuji\",\n 23         url: \"img/fuji.jpg\"\n 24       },\n 25     \
    \  {\n 26         name: \"gala\",\n 27         url: \"img/gala.jpg\"\n 28    \
    \   }      \n29     ];\n30     var app;\n 31     var router = Backbone.Router.extend({\
    \ \n 32     //check if need to be required\n 33       routes: {\n 34         '':\
    \ 'home',\n 35         'apples/:appleName': 'loadApple'\n 36       },\n 37   \
    \    initialize: function(){\n 38         var apples = new Apples();\n 39    \
    \     apples.reset(appleData);\n 40         this.homeView = new homeView({collection:\
    \ apples});\n 41         this.appleView = new appleView({collection: apples});\n\
    \ 42       },\n 43       home: function(){        \n 44         this.homeView.render();\n\
    \ 45       },\n 46       loadApple: function(appleName){\n 47         this.appleView.loadApple(appleName);\n\
    \ 48 \n 49       }\n 50     });\n 51 \n 52     $(document).ready(function(){\n\
    \ 53       app = new router;\n 54       Backbone.history.start();      \n 55 \
    \    })\n 56 }); \n```\n\nWe put all of the code inside the function which is\
    \ a second argument of `require()`, mentioned modules by their filenames, and\
    \ used dependencies via corresponding parameters. Now we should define the module\
    \ itself. This is how we can do it with the `define()` method:\n\n```\n1 define([...],function(...){...})\n\
    ```\n\nThe meaning is similar to the `require()` function: dependencies are strings\
    \ of filenames (and paths) in the array which is passed as the first argument.\
    \ The second argument is the main function that accepts other libraries as parameters\
    \ (the order of parameters and modules in the array is important):\n\n```\n1 define(['name-of-the-module'],function(nameOfModule){\n\
    2   var b = nameOfModule.render();\n3   return b; \n4 })\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThere is no need to append `.js` to filenames. Require.js\
    \ does it automatically. Shim plugin is used for importing text files such as\
    \ HTML templates. |\n\nLet’s start with the templates and convert them into the\
    \ Require.js modules.\n\n### The `apple-item.tpl.js` file:\n\n```\n1 define(function()\
    \ {\n2   return '\\\n3              <a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >\\\n4             <%=name%>\\\n5             </a>&nbsp;<a class=\"add-to-cart\"\
    \ href=\"#\">buy</a>\\\n6             '\n7 }); \n```\n\n### The `apple-home.tpl`\
    \ file:\n\n```\n1 define(function(){ \n2   return 'Apple data: \\\n3         <ul\
    \ class=\"apples-list\">\\\n4         </ul>\\\n5         <div class=\"cart-box\"\
    ></div>';\n6 });\n```\n\n### The `apple-spinner.tpl.js` file:\n\n```\n1 define(function(){\n\
    2   return '<img src=\"img/spinner.gif\" width=\"30\"/>';\n3 });\n```\n\n### The\
    \ `apple.tpl.js` file:\n\n```\n1 define(function(){\n2   return '<figure>\\\n\
    3           <img src=\"<%= attributes.url %>\"/>\\\n4           <figcaption><%=\
