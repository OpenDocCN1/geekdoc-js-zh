  trans: "\n基本上，我们告诉浏览器从文件名数组（`require()` 函数的第一个参数）中加载文件，然后将来自这些文件的模块作为变量传递给匿名回调函数（第二个参数）。在主函数（匿名回调）内部，我们可以通过引用这些变量来使用我们的模块。因此，我们的\
    \ `apple-app.js` 蜕变为：\n\n```\n 1   require([\n 2     'apple-item.tpl', //可以使用\
    \ shim 插件\n 3     'apple-home.tpl',\n 4     'apple-spinner.tpl',\n 5     'apple.tpl',\n\
    \ 6     'apple-item.view',\n 7     'apple-home.view',\n 8     'apple.view',\n\
