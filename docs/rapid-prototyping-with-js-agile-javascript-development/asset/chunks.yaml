    \  var documents = collection.find({}, {limit:5});\n28 \n29     //output a count\
    \ of all documents found\n30     documents.count(function(error, count){\n31 \
    \      log(\"  \" + count + \" documents(s) found\");\n32       log(\"====================\"\
    );\n33 \n34       // output the first 5 documents\n35       documents.toArray(function(error,\
    \ docs) {\n36         if(error) throw error;\n37 \n38         docs.forEach(function(doc){\n\
    39           log(doc);\n40         });\n41      \n42         // close the connection\n\
    43         client.close();\n44       });\n45     });\n46   });\n47 });\n```\n\n\
    We’ve used a shortcut for `console.log()` with `var log = console.log;` and `return`\
    \ as a control flow via `if (!lastCollection) return;`.\n\n#### 6.4.4 BSON\n\n\
    Binary JSON, or BSON, it is a special data type which MongoDB utilizes. It is\
    \ like to JSON in notation, but has support for additional more sophisticated\
    \ data types.\n\n| ![warning](images/leanpub_warning.png) |  \n\n### Warning\n\
    \nA word of caution about BSON: ObjectId in MongoDB is an equivalent to ObjectID\
    \ in MongoDB Native Node.js Driver, i.e., make sure to use the proper case. Otherwise\
    \ you’ll get an error. More on the types: [ObjectId in MongoDB](http://www.mongodb.org/display/DOCS/Object+IDs)\
    \ vs [Data Types in MongoDB Native Node.js Drier](https://github.com/mongodb/node-mongodb-native/#data-types).\
    \ Example of Node.js code with `mongodb.ObjectID()`: `collection.findOne({_id:\
    \ new ObjectID(idString)}, console.log) // ok`. On the other hand, in the MongoDB\
    \ shell, we employ: `db.messages.findOne({_id:ObjectId(idStr)});`. |\n\n### 6.5\
    \ Chat: MongoDB Version\n\nWe should have everything set up for writing the Node.js\
    \ application which will work both locally and on Heroku. The source code is available\
    \ under [rpjs/mongo](https://github.com/azat-co/rpjs/tree/master/mongo). The structure\
    \ of the application is simple:\n\n```\n1 /mongo\n2   -web.js\n3   -Procfile\n\
    4   -package.json\n```\n\nThis is what *web.js* looks like; first we include our\
    \ libraries:\n\n```\n1 var http = require('http');\n2 var util = require('util');\n\
    3 var querystring = require('querystring');\n4 var mongo = require('mongodb');\n\
    ```\n\nThen put out a magic string to connect to MongoDB:\n\n```\n1 var host =\
    \ process.env.MONGOHQ_URL || \"mongodb://@127.0.0.1:27017/twitter-clone\";\n2\
    \ //MONGOHQ_URL=mongodb://user:pass@server.mongohq.com/db_name\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThe URI/URL format contains the optional database name in\
    \ which our collection will be stored. Feel free to change it to something else,\
    \ for example ‘rpjs’ or ‘test’. |\n\nWe put all the logic inside of an open connection\
    \ in the form of a callback function:\n\n```\n 1 mongo.Db.connect(host, function(error,\
    \ client) {\n 2   if (error) throw error;\n 3   var collection = new mongo.Collection(\n\
    \ 4     client, \n 5     'messages');\n 6   var app = http.createServer(function(request,\
    \ response) {\n 7     if (request.method === \"GET\" && \n 8       request.url\
    \ === \"/messages/list.json\") {\n 9       collection.\n10         find().\n11\
    \         toArray(function(error,results) {\n12         response.writeHead(200,{\n\
    13           'Content-Type':'text/plain'\n14         });\n15         console.dir(results);\n\
    16         response.end(JSON.stringify(results));\n17       });\n18     };\n19\
    \     if (request.method === \"POST\" &&\n20       request.url === \"/messages/create.json\"\
    ) {\n21       request.on('data', function(data) {\n22         collection.insert(\n\
    23           querystring.parse(data.toString('utf-8')),\n24           {safe:true},\n\
    25           function(error, obj) {\n26             if (error) throw error;\n\
    27             response.end(JSON.stringify(obj));\n28           }\n29        \
    \ )        \n30       })\n31     };\n32   });\n33   var port = process.env.PORT\
    \ || 5000;\n34   app.listen(port);\n35 })\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nWe don’t have to use additional words after the collection/entity\
    \ name, i.e., instead of `/messages/list.json` and `/messages/create.json` it’s\
    \ perfectly fine to have just `/messages` for all the HTTP methods such as GET,\
    \ POST, PUT, DELETE. If you change them in your application code make sure to\
    \ use the updated CURL commands and front-end code. |\n\nTo test via CURL terminal\
    \ commands run:\n\n```\n1 curl http://localhost:5000/messages/list.json\n```\n\
    \nOr open your browser at the [http://locahost:5000/messages/list.json](http://locahost:5000/messages/list.json)\
    \ location.\n\nIt should give you an empty array: `[]` which is fine. Then POST\
    \ a new message:\n\n```\n1 curl  -d \"username=BOB&message=test\" http://localhost:5000/messages/create.json\n\
    ```\n\nNow we must see a response containing an ObjectID of a newly created element,\
    \ for example: `[{\"username\":\"BOB\",\"message\":\"test\",\"_id\":\"51edcad45862430000000001\"\
    }]`. Your ObjectId might vary.\n\nIf everything works as it should locally, try\
    \ to deploy it to Heroku.\n\nTo test the application on Heroku, you could use\
    \ the same [CURL](http://curl.haxx.se/docs/manpage.html) commands, substituting\
    \ `http://localhost/` or “http://127.0.0.1” with your unique Heroku app’s host/URL:\n\
    \n```\n1 $ curl http://your-app-name.herokuapp.com/messages/list.json\n2 $ curl\
    \ -d \"username=BOB&message=test\" \n3   http://your-app-name.herokuapp.com/messages/create.json\n\
    ```\n\nIt’s also nice to double check the database either via Mongo shell: `$\
    \ mongo` terminal command and then `use twitter-clone` and `db.messages.find()`;\
    \ or via [MongoHub](https://github.com/bububa/MongoHub-Mac), [mongoui](https://github.com/azat-co/mongoui),\
    \ [mongo-express](https://github.com/andzdroid/mongo-express) or in case of MongoHQ\
    \ through its web interface accessible at heroku.com website.\n\nIf you would\
    \ like to use another domain name instead of http://your-app-name.herokuapp.com,\
    \ you’ll need to do two things:\n\n1.  Tell Heroku your domain name:\n\n    ```\n\
    \    1  $ heroku domains:add www.your-domain-name.com\n    ```\n\n2.  Add the\
    \ CNAME DNS record in your DNS manager to point to http://your-app-name.herokuapp.com.\n\
    \nMore information on custom domains can be found at [devcenter.heroku.com/articles/custom-domains](https://devcenter.heroku.com/articles/custom-domains).\n\
    \n| ![tip](images/leanpub_tip.png) |  \n\n### Tip\n\nFor more productive and efficient\
    \ development we should automate as much as possible, i.e., use tests instead\
    \ of CURL commands. There is an article on the Mocha library in the BONUS chapter\
    \ which, along with the superagent or request libraries, is a timesaver for such\
    \ tasks. |\n\n## 7 Putting It All Together"
