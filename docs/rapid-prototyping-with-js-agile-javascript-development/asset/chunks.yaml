    3. Refactor code if needed, and add functionality while keeping the test cases
    passed.


    4. Repeat until all tasks are complete.


    Tests can be split into functional and unit testing. The latter is when a system
    tests individual units, methods and functions with dependencies mocked up, while
    the former (a.k.a., integration testing) is when a system tests a slice of a functionality,
    including dependencies.


    The advantages of Test-Driven Development:


    * Fewer bugs/defects

    * More efficient codebase

    * Confidence that code works and doesn’t break the old functionality


    ## 1.2.3 Continuous Deployment and Integration


    Continuous Deployment, or `CD`, is the set of techniques to rapidly deliver new
    features, bug fixes, and enhancements to the customers. CD includes automated
    testing and automated deployment. By utilizing Continuous Deployment, the manual
    overhead is decreased and the feedback loop time is minimized. Basically, the
    faster a developer can get the feedback from the customers, the sooner the product
    can pivot, which leads to more advantages over the competition. Many startups
    deploy multiple times in a single day in comparison to the 6-to-12-month release
    cycle which is still typical for corporations and big companies.


    The advantages of the Continuous Deployment approach: decreases feedback loop
    time and manual labor overhead.


    The difference between Continuous Deployment and Continuous Integration is outlined
    in the post [Continuous Delivery vs. Continuous Deployment vs. Continuous Integration
    - Wait huh?](http://blog.assembla.com/assemblablog/tabid/12618/bid/92411/Continuous-Delivery-vs-Continuous-Deployment-vs-Continuous-Integration-Wait-huh.aspx)


    Some of the most popular solutions for Continuous Integration:


    * [Jenkins](http://jenkins-ci.org/): An extendable open source continuous integration
    server

    * [CircleCI](https://circleci.com/): Ship better code, faster

    * [Travis CI](https://travis-ci.org/): A hosted continuous integration service
    for the open source community


    ## 1.2.4 Pair Programming


    Pair Programming is a technique when two developers work together in one environment.
    One of the developers is a driver, and the other is an observer. The driver writes
    code, and the observer assists by watching and making suggestions. Then they switch
    roles. The driver has a more tactical role of focusing on the current task. In
    contrast, the observer has a more strategic role, overseeing “the bigger picture”
    and finding bugs and ways to improve an algorithm.


    The advantages of Paired Programming:


    * Pairs attributes to shorter and more efficient codebase, and introduces fewer
    bugs and defects.

    * As an added bonus, knowledge is passed along programmers as they work together.
    However, situations of conflicts between developers are possible, and not uncommon
    at all.


    ## 1.3 Back-End Definitions


    ### 1.3.1 Node.js


    Node.js is an open-source event-driven asynchronous I/O technology for building
    scalable and efficient web servers. Node.js consists of Google’s [V8 JavaScript
    engine](http://en.wikipedia.org/wiki/V8_(JavaScript_engine)) and is maintained
    by cloud company [Joyent](http://joyent.com).


    The purpose and use of Node.js is similar to [Twisted](http://twistedmatrix.com/trac/)
    for Python and [EventMachine](http://rubyeventmachine.com/) for Ruby. The JavaScript
    implementation of Node was the third one after attempts at using Ruby and C++
    programming languages.


    Node.js is not in itself a framework like Ruby on Rails; it’s more comparable
    to the pair PHP+Apache. More on Node.js frameworks later in the *Node.js and MongoDB*
    chapter.


    The advantages of using Node.js:


    * Developers have high likelihood of familiarity with JavaScript language due
    to its status as a de facto standard for web and mobile development

    * One language for front-end and back-end development speeds up the coding process.
    A developer’s brain doesn’t have to switch between different syntaxes. So-called
    context switch. The learning of methods and classes goes faster.

    * With Node.js, you could prototype quickly and go to market to do your customer
    development and customer acquisition early. This is an important competitive advantage
    over the other companies, which use less agile technologies, e.g., PHP and MySQL.

    * Node.js is built to support real-time applications by utilizing web-sockets.


    For more information go to [Wikipedia](http://en.wikipedia.org/wiki/Nodejs), [Nodejs.org](http://nodejs.org/about/),
    and articles on [ReadWrite](http://readwrite.com/2011/01/25/wait-whats-nodejs-good-for-aga)
    and [O’Reilly](http://radar.oreilly.com/2011/07/what-is-node.html).


    For the current state of Node.js as of this writing, refer to [State of the Node
    slides by Isaac Z. Schlueter – 2013](http://j.mp/2013-state-of-the-node).


    ### 1.3.2 NoSQL and MongoDB


    MongoDB, from hu**MONGO**us, is a high-performance no-relationship database for
    huge quantities of data. The NoSQL concept came out when traditional Relational
    Database Management Systems, or RDBMS, were unable to meet the challenges of huge
    amounts of data.


    The advantages of using MongoDB:


    * Scalability: due to a distributed nature, multiple servers and data centers
    can have redundant data.

    * High-performance: MongoDB is very effective for storing and retrieving data,
    partially owing to the absence of relationships between elements and collections
    in the database.

    * Flexibility: a key-value store is ideal for prototyping because it doesn’t require
    the schema.


    ### 1.3.3 Cloud Computing


    Cloud computing consists of:


    * Infrastructure as Service (IaaS), e.g., Rackspace, Amazon Web Services

    * Platform as a Service (PaaS), e.g., Heroku, Windows Azure

    * Backend as a Service (BaaS), e.g., Parse.com, Firebase

    * Software as a Service (SaaS), e.g., Google Apps, Salesforce.com


    Cloud application platforms provide:


    * Scalability, e.g., spawn new instances in a matter of minutes

    * Ease of deployment, i.e., to push to Heroku you can just use `git push`

    * Pay-as-you-go plans where users add or remove memory and disk space based on
    demands

    * Add-ons for easier installation and configuration of databases, app servers

    * Security and support


    PaaS and BaaS are ideal for prototyping, building minimal viable products (MVP)
    and for early-stage startups.


    ### 1.3.4 HTTP Requests and Responses


    Each HTTP Request and Response consists of the following components:


    1. Header: information about encoding, length of the body, origin, content type,
    etc.

    2. Body: content, usually parameters or data which is passed to the server or
    sent back to a client


    In addition, the HTTP Request contains:


    * Method: There are several methods with the most common being `GET`, `POST`,
    `PUT` and `DELETE`

    * URL: host, port, path, e.g., `https://graph.facebook.com/498424660219540`

    * Query string: everything after a question mark in the URL (e.g., `?q=rpjs&page=20`)


    ### 1.3.5 RESTful API


    RESTful (REpresentational State Transfer) API became popular due to the demand
    in distributed systems whereby each transaction needs to include enough information
    about the state of the client. In a sense, this standard is stateless because
    no information about the clients’ states is stored on the server, making it possible
    for each request to be served by a different system.


    Distinct characteristics of RESTful API:


    * Has better scalability support due to the fact that different components can
    be independently deployed to different servers

    * Replaced Simple Object Access Protocol (SOAP) because of the simpler verb and
    noun structure

