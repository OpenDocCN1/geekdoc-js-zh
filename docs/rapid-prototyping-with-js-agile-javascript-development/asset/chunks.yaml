  raw: "2.  Add a new message with properties **name** and **message** for POST `/messages`\
    \ route via the `addMessage()` function\n\nWe’ll start by creating an empty **mb-server.js**\
    \ file. After it’s there, let’s switch to tests and create the **test.js** file\
    \ with the following content:\n\n```\n 1 var http = require('http');\n 2 var assert\
    \ = require('assert');\n 3 var querystring = require('querystring');\n 4 var util\
    \ = require('util');\n 5 \n 6 var messageBoard = require('./mb-server');\n 7 \n\
    \ 8 assert.deepEqual('[{\"name\":\"John\",\"message\":\"hi\"}]',\n 9   messageBoard.getMessages());\n\
    10 assert.deepEqual ('{\"name\":\"Jake\",\"message\":\"gogo\"}',\n11   messageBoard.addMessage\
    \ (\"name=Jake&message=gogo\"));\n12 assert.deepEqual('[{\"name\":\"John\",\"\
    message\":\"hi\"},{\"name\":\"Jake\",\"message\":\"gogo\"}]', \n13   messageBoard.getMessages(\"\
    name=Jake&message=gogo\"));\n```\n\nPlease keep in mind that, this is a very simplified\
    \ comparison of strings and not JavaScript objects. So every space, quote and\
    \ case matters. You could make the comparison “smarter” by parsing a string into\
    \ a JSON object with:\n\n```\n1 JSON.parse(str);\n```\n\nFor testing our assumptions,\
    \ we use core the Node.js module [assert](http://nodejs.org/api/assert.html).\
    \ It provides a bunch of useful methods like `equal()`, `deepEqual()`, etc.\n\n\
    More advanced libraries include alternative interfaces with TDD and/or BDD approaches:\n\
    \n*   [Should](https://github.com/visionmedia/should.js/)\n\n*   [Expect](https://github.com/LearnBoost/expect.js/)\n\
    \nFor more Test-Driven Development and cutting-edge automated testing, you could\
    \ use the following libraries and modules:\n\n*   [Mocha](http://visionmedia.github.com/mocha/)\n\
    \n*   [NodeUnit](https://github.com/caolan/nodeunit)\n\n*   [Jasmine](http://pivotal.github.com/jasmine/)\n\
    \n*   [Vows](http://vowsjs.org/)\n\n*   [Chai](http://chaijs.com/)\n\nYou could\
    \ copy the “Hello World” script into the **mb-server.js** file for now or even\
    \ keep it empty. If we run **test.js** by the terminal command:\n\n```\n1 $ node\
    \ test.js \n```\n\nWe should see an error. Probably something like this one:\n\
    \n```\n1 TypeError: Object #<Object> has no method 'getMessages'\n```\n\nThat’s\
    \ totally fine, because we haven’t written `getMessages()` method yet. So let’s\
    \ do it and make our application more useful by adding two new methods: to get\
    \ the list of the messages for Chat and to add a new message to the collection.\n\
    \n**mb-server.js** file with global `exports` object:\n\n```\n1 exports.getMessages\
    \ = function() {\n2   return JSON.stringify(messages);\n3 };\t\n4 exports.addMessage\
    \ = function (data){\t\t\n5   messages.push(querystring.parse(data));\n6   return\
    \ JSON.stringify(querystring.parse(data));\t\n7 };\n```\n\nSo far, nothing fancy,\
    \ right? To store the list of messages, we’ll use an array:\n\n```\n1 var messages=[];\n\
    2 //this array will hold our messages\n3 messages.push({\n4   \"name\":\"John\"\
    ,\n5   \"message\":\"hi\"\n6 });\n7 //sample message to test list method\n```\n\
    \n| ![tip](images/leanpub_tip.png) |  \n\n### Tip\n\nGenerally, fixtures like\
    \ dummy data belong to the test/spec files and not to the main application codebase.\
    \ |\n\nOur server code will look slightly more interesting. For getting the list\
    \ of messages, according to REST methodology, we need to make a GET request. For\
    \ creating/adding a new message, it should be a POST request. So in our createServer\
    \ object, we should add `req.method()` and `req.url()` to check for an HTTP request\
    \ type and a URL path.\n\nLet’s load the http module:\n\n```\n1 var http = require('http');\n\
    ```\n\nWe’ll need some of the handy functions from the util and querysting modules\
    \ (to serialize and deserialize objects and query strings):\n\n```\n1 var util\
    \ = require('util');\n2 var querystring = require('querystring');\n```\n\nTo create\
    \ a server and expose it to outside modules (i.e., test.js):\n\n```\n1 exports.server=http.createServer(function\
    \ (req, res) {\n```\n\nInside of the request handler callback, we should check\
    \ if the request method is POST and the URL is `messages/create.json`:\n\n```\n\
    1   if (req.method == \"POST\" && \n2     req.url == \"/messages/create.json\"\
    ) {\n```\n\nIf the condition above is true, we add a message to the array. However,\
    \ **data** must be converted to a string type (with encoding UTF-8) prior to the\
    \ adding, because it is a type of Buffer:\n\n```\n1     var message = '';\n2 \
    \    req.on('data', function(data, message){\n3       console.log(data.toString('utf-8'));\n\
    4       message = exports.addMessage(data.toString('utf-8'));\n```\n\nThese logs\
    \ will help us to monitor the server activity in the terminal:\n\n```\n1     })\n\
    2     console.log(util.inspect(message, true, null));\n3     console.log(util.inspect(messages,\
    \ true, null));\n```\n\nThe output should be in a text format with a status of\
    \ 200 (okay):\n\n```\n1     res.writeHead(200, {\n2       'Content-Type': 'text/plain'\n\
    3      });\n```\n\nWe output a message with a newly created object ID:\n\n```\n\
    1     res.end(message);\n2   }\n```\n\nIf the method is GET and the URL is `/messages/list.json`\
    \ output a list of messages:\n\n```\n1   if (req.method == \"GET\" && \n2    \
    \ req.url == \"/messages/list.json\") {\n```\n\nFetch a list of messages:\n\n\
    ```\n1     var body = exports.getMessages();\n```\n\nThe response body will hold\
    \ our output:\n\n```\n1     res.writeHead(200, {\n2       'Content-Length': body.length,\n\
    3       'Content-Type': 'text/plain'\n4     });\n5     res.end(body);\n6   }\n\
    7   else {\n```\n\nThis sets the right header and status code:\n\n```\n1     res.writeHead(200,\
    \ {\n2       'Content-Type': 'text/plain'\n3     });\n```\n\nIn case it’s neither\
    \ of the two endpoints above, we output a string with a line-end symbol:\n\n```\n\
    1     res.end('Hello World\\n');\n2   };\n3   console.log(req.method);\n```\n\n\
    ```\n1 }).listen(1337, \"127.0.0.1\");\n```\n\nNow, we should set a port and IP\
    \ address of the server:\n\n```\n1 console.log('Server running at http://127.0.0.1:1337/');\n\
    ```\n\nWe expose methods for the unit testing in **test.js** (exports keyword),\
    \ and this function returns an array of messages as a string/text:\n\n```\n1 exports.getMessages\
    \ = function() {\n2   return JSON.stringify(messages);\n3 };\n```\n\n`addMessage()`\
    \ converts a string into a JavaScript object with the parse/deserializer method\
    \ from querystring:\n\n```\n1 exports.addMessage = function (data){\n2   messages.push(querystring.parse(data));\n\
    ```\n\nAlso returning a new message in a JSON-as-a-string format:\n\n```\n1  \
    \ return JSON.stringify(querystring.parse(data));\n2 };\n```\n\nHere is the full\
