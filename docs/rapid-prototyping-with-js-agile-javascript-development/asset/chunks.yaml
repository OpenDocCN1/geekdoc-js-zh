  trans: "\n它会要求你输入 Heroku 凭据（用户名和密码），如果你已经创建了 SSH 密钥，它将其将其上传到 Heroku 网站：\n\n![成功执行\
    \ `$ heroku login` 命令的响应。](img/screenshots----heroku.png)\n\n成功执行 `$ heroku login`\
    \ 命令的响应。\n\n4 如果一切进展顺利，若要在你特定的项目文件夹内创建一个 Heroku 应用程序，你应该可以运行：\n\n```\n1  $ heroku\
    \ create\n```\n\n更详细的分步骤说明请参考 [Heroku: 快速入门](https://devcenter.heroku.com/articles/quickstart)\
    \ 和 [Heroku: Node.js](https://devcenter.heroku.com/articles/nodejs)。\n\n## 2.2.5\
    \ Cloud9\n\nCloud9 是一个浏览器内置 IDE，通过使用你的 GitHub 或 BitBucket 账户，你可以浏览仓库、编辑它们并部署到\
    \ Windows Azure 或其他服务。无需任何安装；一切都在浏览器中运行，几乎就像 Google Docs 一样。\n\n# II 前端原型\n\n\
    ## 3 jQuery 和 Parse.com\n\n**摘要**：jQuery 主要函数概述、Twitter Bootstrap 脚手架、主要 LESS\
    \ 组件；JSON、AJAX 和 CORS 的定义；Twitter REST API 示例中的 JSONP 调用插图；关于如何使用 jQuery 和 Parse.com\
    \ 构建仅前端聊天应用程序的说明；部署到 Heroku 和 Windows Azure 的分步骤说明。\n\n> “构建软件设计有两种方法：一种是让它极其简单而显然没有缺陷，另一种方法是让它极其复杂以至于没有明显的缺陷。第一种方法要困难得多。”\
    \ — [Tony Hoare](http://en.wikipedia.org/wiki/Charles_Antony_Richard_Hoare)\n\n\
    ### 3.1 定义\n\n#### 3.1.1 JavaScript 对象表示\n\n以下是来自 [json.org](http://www.json.org/)\
    \ 的 JavaScript 对象表示（或 JSON）的定义：\n\n> JavaScript 对象表示（或称为 JSON） 是一种轻量级的数据交换格式。它易于人类读写，易于机器解析和生成。它基于\
    \ JavaScript 编程语言的子集，[标准 ECMA-262 第三版 - 1999 年 12 月](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)。JSON\
    \ 是一种文本格式，完全独立于语言，但它使用了 C 族语言程序员熟悉的惯例，包括 C、C++、C#、Java、JavaScript、Perl、Python\
    \ 等。这些属性使得 JSON 成为一种理想的数据交换语言。\n\nJSON 已经成为 Web/移动应用不同组件与第三方服务之间传输数据的标准。JSON 也广泛用于应用程序内部，作为配置、本地化、翻译文件或任何其他数据的格式。\n\
    \n典型的 JSON 对象如下：\n\n```\n1 {\n2   \"a\": \"value of a\",\n3   \"b\": \"value of\
    \ b\"\n4 }\n```\n\n我们有一个包含键值对的对象。键在左侧，值在冒号（`:`）的右侧。在计算机科学术语中，JSON 等同于哈希表、键值列表或关联数组（取决于特定语言）。JSON\
    \ 与 JS 对象字面量表示（原生 JS 对象）之间的唯一主要区别是前者更为严格，要求键标识符和字符串值使用双引号（`\"`）。假设我们有一个字符串格式的有效\
    \ JSON 对象，两种类型都可以通过 `JSON.stringify()` 序列化为字符串表示，并通过 `JSON.parse()` 反序列化。\n\n\
    然而，对象的每个成员都可以是数组、原始类型或另一个对象；例如：\n\n```\n 1   {\n 2     \"posts\": [{\n 3     \
    \  \"title\": \"Get your mind in shape!\",\n 4       \"votes\": 9,\n 5       \"\
    comments\": [\"nice!\", \"good link\"]\n 6       }, {\n 7       \"title\": \"\
    Yet another post\",\n 8       \"votes\":0,\n 9       \"comments\": []\n10    \
    \   }\n11     ],\n 12     \"totalPost\":2,\n 13     \"getData\": function () {\n\
    \ 14       return new Data().getDate();\n 15     }\n 16   }\n```\n\n在上面的示例中，我们有一个带有\
    \ `posts` 属性的对象。`posts` 属性的值是一个对象数组，每个对象都有 `title`、`votes` 和 `comments` 键。votes\
    \ 属性是一个数字，而 comments 是字符串数组。我们也可以拥有函数作为值；在这种情况下，键被称为方法，即 `getData`。\n\n正如本文概述，JSON\
    \ 比 XML 或数据格式灵活且紧凑得多——[JSON: XML 的无脂替代方案](http://www.json.org/xml.html)。方便的是，MongoDB\
    \ 使用了一种名为 [BSON](http://bsonspec.org/) 的二进制 JSON 的类似格式。关于 BSON 的更多信息将在 *Node.js\
    \ 和 MongoDB* 章节介绍。\n\n#### 3.1.2 AJAX\n\nAJAX 代表异步 JavaScript 和 XML，用于客户端（浏览器）通过利用\
    \ JavaScript 语言中的 `XMLHttpRequest` 对象从服务器发送和接收数据。尽管名称如此，并不要求使用 XML，通常使用 JSON 代替。这就是为什么开发者几乎不再说\
    \ AJAX 了。请记住 HTTP 请求可以同步进行。\n\n#### 3.1.3 跨域调用\n\n出于安全考虑，初始实现不允许跨域调用。其中一种是使用 [JSONP](http://en.wikipedia.org/wiki/JSONP)——它动态生成\
    \ `script` 标签。例如：\n\n```\n1 https://graph.facebook.com\n2   ?type=post\n3   &limit=20\n\
    4   &q=Gatsby\n```\n\n第二种方法是使用跨源共享，或 [CORS](http://www.w3.org/TR/cors/)，这是一个更好的解决方案，但需要控制服务器以修改标头。我们将在聊天应用程序的最终版本中使用这种技术。\n\
    \nCORS 服务器头部示例：\n\n```\n1 Access-Control-Allow-Origin: *\n```\n\n更多关于 CORS 的信息：[Enable\
    \ CORS 资源](http://enable-cors.org/resources.html) 和 [HTML5 Tutorials 使用 CORS](http://www.html5rocks.com/en/tutorials/cors/)。在\
    \ [test-cors.org](http://client.cors-api.appspot.com/client) 测试 CORS 请求。\n\n###\
    \ 3.2 jQuery\n\n在培训期间，我们将使用 jQuery ([`jquery.com/`](http://jquery.com/)) 进行 DOM\
    \ 操作、HTTP 请求和 JSONP 调用。jQuery 因为它的 `$` 对象/函数成为了事实标准，因为它提供了一种简单高效的方法通过 ID、类、标签名、属性值、结构或任何组合访问页面上的任何\
    \ HTML DOM 元素。语法与 CSS 非常相似，我们使用 `#` 选择 ID，使用 `.` 选择类，例如：\n\n```\n1 $(\"#main\"\
    ).hide();\n2 $(\"p.large\").attr(\"style\",\"color:red\");\n3 $(\"#main\").show().html(\"\
    <<div>>new div</div>\");\n```\n\n以下是最常用的 jQuery API 函数列表：\n\n* `find()`(http://api.jquery.com/find):\
    \ 根据提供的选择器字符串选择元素\n* `hide()`(http://api.jquery.com/hide): 如果元素可见，则隐藏它\n* `show()`(http://api.jquery.com/show):\
    \ 如果元素隐藏，则显示它\n* `html()`(http://api.jquery.com/html): 获取或设置元素的内部 HTML\n* `append()`(http://api.jquery.com/append):\
    \ 将元素插入到所选元素的 DOM 之后\n"
- fmt: "\n*   `[prepend()](http://api.jquery.com/prepend)` Injects an element into\
    \ the DOM before the selected element\n*   `[on()](http://api.jquery.com/on)`:\
    \ Attaches an event listener to an element\n*   `[off()](http://api.jquery.com/off)`\
    \ Detaches an event listener from an element\n*   `[css()](http://api.jquery.com/css)`:\
    \ Gets or sets the style attribute value of an element\n*   `[attr()](http://api.jquery.com/attr)`\
    \ Gets or sets any attribute of an element\n*   `[val()](http://api.jquery.com/val)`:\
    \ Gets or sets the value attribute of an element\n*   `[text()](http://api.jquery.com/text)`:\
    \ Gets the combined text of an element and its children\n*   `[each()](http://api.jquery.com/each)`:\
    \ Iterates over a set of matched elements\n\nMost jQuery functions act not only\
    \ on a single element, on which they are called, but on a set of matched elements\
    \ if the result of selection has multiples items. This is a common pitfall that\
    \ leads to bugs, and it usually happens when a jQuery selector is too broad.\n\
    \nAlso, jQuery has many plug-ins and libraries, e.g., [jQuery UI](http://jqueryui.com/),\
    \ [jQuery Mobile](http://jquerymobile.com/), which provide a rich user interface\
    \ or other functionality.\n\n### 3.3 Twitter Bootstrap\n\n[Twitter Bootstrap](http://twitter.github.com/bootstrap/)\
    \ is a collection of CSS/LESS rules and JavaScript plug-ins for creating good\
    \ User Interface and User Experience without spending a lot of time on such details\
    \ as round-edge buttons, cross-compatibility, responsiveness, etc. This collection\
    \ or framework is perfect for rapid prototyping of your ideas. Nevertheless, due\
    \ to its ability to be customized, Twitter Bootstrap is also a good foundation\
    \ for serious projects. The source code is written in [LESS](http://lesscss.org/),\
    \ but plain CSS could be downloaded and used as well.\n\nHere is a simple example\
    \ of using Twitter Bootstrap scaffolding. The structure of the project should\
    \ look like this:\n\n```\n1   /bootstrap\n2     -index.html\n3     /css\n4   \
    \    -bootstrap.min.css\n5       ... (other files if needed)\n6     /img\n7  \
    \     glyphicons-halflings.png\n8       ... (other files if needed)\n```\n\nFirst\
    \ let’s create the `index.html` file with proper tags:\n\n```\n1 <!DOCTYPE html>\n\
    2 <html lang=\"en\">\n3   <head>\n4 \n5   </head>\n6   <body>\n7   </body>\n8\
    \ </html>\n```\n\nInclude Twitter Bootstrap library as a minified CSS file:\n\n\
    ```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3   <head>\n 4     <link \n 5\
    \       type=\"text/css\" \n 6       rel=\"stylesheet\" \n 7       href=\"css/bootstrap.min.css\"\
    \ />\n 8   </head>\n 9   <body>\n10   </body>\n11 </html>\n```\n\nApply scaffolding\
    \ with `container-fluid` and `row-fluid` classes:\n\n```\n1   <body>\n2     <div\
    \ class=\"container-fluid\">\n3       <div class=\"row-fluid\">\n4       </div>\
    \  <!-- row-fluid -->\n5     </div>  <!-- container-fluid -->\n6   </body>\n```\n\
    \nTwitter Bootstrap uses a 12-column grid. The size of an individual cell could\
    \ be specified by classes `spanN`, e.g.,”span1”, “span2”, “span12”. There are\
    \ also classes `offsetN`, e.g., “offset1”, “offset2”, … “offset12” classes to\
    \ move cells to the right. A complete reference is available at [http://twitter.github.com/bootstrap/scaffolding.html](http://twitter.github.com/bootstrap/scaffolding.html).\n\
    \nWe’ll use `span12` and `hero-unit` classes for the main content block:\n\n```\n\
    \ 1     <div class=\"row-fluid\">\n 2      <div class=\"span12\">\n 3        \
    \ <div id=\"content\">\n 4           <div class=\"row-fluid\">\n 5           \
    \  <div class=\"span12\">\n 6               <div class=\"hero-unit\">\n 7    \
    \             <h1>\n 8                   Welcome to Super \n 9               \
    \    Simple Backbone \n10                   Starter Kit\n11                 </h1>\n\
    \ 12                 <p>\n 13                   This is your home page. \n 14\
    \                   To edit it just modify \n 15                   <i>index.html</i>\
    \ file!\n 16                 </p>\n 17                 <p>\n 18              \
    \     <a \n 19                     class=\"btn btn-primary btn-large\"\n 20  \
    \                   href=\"http://twitter.github.com/bootstrap\"\n 21        \
    \             target=\"_blank\">\n 22                     Learn more \n 23   \
    \                </a>\n 24                 </p>\n 25               </div>  <!--\
    \ hero-unit -->\n 26             </div>  <!-- span12 -->\n 27           </div>\
    \ <!-- row-fluid -->\n 28       </div>  <!-- content -->\n 29     </div> <!--\
    \ span12 -->\n 30     </div>  <!-- row-fluid -->\n```\n\nThe full source code\
    \ of the `index.html` is:\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n\
    \ 3   <head>\n 4     <link \n 5       type=\"text/css\" \n 6       rel=\"stylesheet\"\
    \ \n 7       href=\"css/bootstrap.min.css\" />\n 8   </head>\n 9   <body>\n10\
    \   <div class=\"container-fluid\">\n11     <div class=\"row-fluid\">\n12    \
    \   <div class=\"span12\">\n13         <div id=\"content\">\n 14           <div\
    \ class=\"row-fluid\">\n 15             <div class=\"span12\">\n 16          \
    \     <div class=\"hero-unit\">\n 17                 <h1>\n 18               \
    \    Welcome to Super \n 19                   Simple Backbone \n 20          \
    \         Starter Kit\n 21                 </h1>\n 22                 <p>\n 23\
    \                   This is your home page. \n 24                   To edit it\
    \ just modify \n 25                   <i>index.html</i> file!\n 26           \
    \      </p>\n 27                 <p>\n 28                   <a \n 29         \
    \            class=\"btn btn-primary btn-large\"\n 30                     href=\"\
    http://twitter.github.com/bootstrap\"\n 31                     target=\"_blank\"\
    >\n 32                     Learn more \n 33                   </a>\n 34      \
    \           </p>\n 35               </div>  <!-- hero-unit -->\n 36          \
    \   </div>  <!-- span12 -->\n 37           </div> <!-- row-fluid -->\n 38    \
    \   </div>  <!-- content -->\n 39     </div> <!-- span12 -->\n 40     </div> \
    \ <!-- row-fluid -->\n 41   </body>\n 42 </html>\n```\n\nThis example is available\
    \ for downloading/pulling at GitHub [github.com/azat-co/rpjs](http://github.com/azat-co/rpjs)\
    \ under [`rpjs/bootstrap`](https://github.com/azat-co/rpjs/tree/bootstrap).\n\n\
    Other useful tools - CSS frameworks and preprocessors worth checking out:\n\n\
    *   [Compass](http://compass-style.org/): CSS framework\n*   [SASS](http://sass-lang.com/):\
    \ extension of CSS3 and analog to LESS\n*   [Blueprint](http://blueprintcss.org/):\
    \ CSS framework\n*   [Foundation](http://foundation.zurb.com/): responsive front-end\
    \ framework\n*   [Bootswatch](http://bootswatch.com/): collection of customized\
    \ Bootstrap themes\n*   [WrapBootstrap](https://wrapbootstrap.com/): market place\
    \ for Bootstrap themes\n\n### 3.4 LESS\n\nLESS is the dynamic stylesheet language.\
    \ Sometimes, and in this case, it’s true that less is more and more is less](http://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less).\n\
    \nThe browser cannot interpret LESS syntax, so LESS source code must be compiled\
    \ to CSS in one of the three ways:\n\n1.  In the browser by [LESS JavaScript library](http://lesscss.googlecode.com/files/less-1.3.0.min.js)\n\
    2.  On the server-side by language/framework, i.e., for Node.js there is the [LESS\
    \ module](https://npmjs.org/package/less)\n3.  Locally on your Mac OS X machine\
    \ by [LESS App](http://incident57.com/less/), [SimpLESS](http://wearekiss.com/simpless)\
    \ or a similar app\n\n| ![warning](images/leanpub_warning.png) | |\n| :--- | :---\
    \ |\n| Warning | Option 1\\. is okay for a development environment but suboptimal\
    \ for a production environment. |\n\n#### 3.4.1 Variables\n\nVariables reduce\
    \ redundancy and allow developers to change values fast by having them in one\
    \ canonical place. And we know that in design (and styling) we often have to change\
    \ values very frequently!\n\nLESS has variables, mixins and operators, which make\
    \ it faster for developers to reuse CSS rules.\n\n```\n1 @color: #4D926F;\n2 #header\
    \ {\n3   color: @color;\n4 }\n5 h2 {\n6   color: @color;\n7 }\n```\n\nEquivalent\
    \ in CSS:\n"
  raw: "*   **[prepend()](http://api.jquery.com/prepend)** Injects an element into\
    \ the DOM before the selected element\n\n*   **[on()](http://api.jquery.com/on)**:\
    \ Attaches an event listener to an element\n\n*   **[off()](http://api.jquery.com/off)**\
    \ Detaches an event listener from an element\n\n*   **[css()](http://api.jquery.com/css)**:\
    \ Gets or sets the style attribute value of an element\n\n*   **[attr()](http://api.jquery.com/attr)**\
    \ Gets or sets any attribute of an element\n\n*   **[val()](http://api.jquery.com/val)**:\
    \ Gets or sets the value attribute of an element\n\n*   **[text()](http://api.jquery.com/text)**:\
    \ Gets the combined text of an element and its children\n\n*   **[each()](http://api.jquery.com/each)**:\
    \ Iterates over a set of matched elements\n\nMost jQuery functions act not only\
    \ on a single element, on which they are called, but on a set of matched elements\
    \ if the result of selection has multiples items. This is a common pitfall that\
    \ leads to bugs, and it usually happens when a jQuery selector is too broad.\n\
    \nAlso, jQuery has many plug-ins and libraries, e.g., [jQuery UI](http://jqueryui.com/),\
    \ [jQuery Mobile](http://jquerymobile.com/), which provide a rich user interface\
    \ or other functionality.\n\n### 3.3 Twitter Bootstrap\n\n[Twitter Bootstrap](http://twitter.github.com/bootstrap/)\
    \ is a collection of CSS/LESS rules and JavaScript plug-ins for creating good\
    \ User Interface and User Experience without spending *a lot of time* on such\
    \ details as round-edge buttons, cross-compatibility, responsiveness, etc. This\
    \ collection or framework is perfect for rapid prototyping of your ideas. Nevertheless,\
    \ due to its ability to be customized, Twitter Bootstrap is also a good foundation\
    \ for serious projects. The source code is written in [LESS](http://lesscss.org/),\
    \ but plain CSS could be downloaded and used as well.\n\nHere is a simple example\
    \ of using Twitter Bootstrap scaffolding. The structure of the project should\
    \ look like this:\n\n```\n1   /bootstrap\n2     -index.html\n3     /css\n4   \
    \    -bootstrap.min.css\n5       ... (other files if needed)\n6     /img\n7  \
    \     glyphicons-halflings.png\n8       ... (other files if needed)\n```\n\nFirst\
    \ let’s create the **index.html** file with proper tags:\n\n```\n1 <!DOCTYPE html>\n\
    2 <html lang=\"en\">\n3   <head>\n4 \n5   </head>\n6   <body>\n7   </body>\n8\
    \ </html>\n```\n\nInclude Twitter Bootstrap library as a minified CSS file:\n\n\
    ```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3   <head>\n 4     <link \n 5\
    \       type=\"text/css\" \n 6       rel=\"stylesheet\" \n 7       href=\"css/bootstrap.min.css\"\
    \ />\n 8   </head>\n 9   <body>\n10   </body>\n11 </html>\n```\n\nApply scaffolding\
    \ with container-fluid and row-fluid classes:\n\n```\n1   <body >\n2     <div\
    \ class=\"container-fluid\">\n3       <div class=\"row-fluid\">\n4       </div>\
    \  <!-- row-fluid -->\n5     </div>  <!-- container-fluid -->\n6   </body>\n```\n\
    \nTwitter Bootstrap uses a 12-column grid. The size of an individual cell could\
    \ be specified by classes **spanN**, e.g.,”span1”, “span2”, “span12”. There are\
    \ also classes **offsetN**, e.g., “offset1”, “offset2”, … “offset12” classes to\
    \ move cells to the right. A complete reference is available at [http://twitter.github.com/bootstrap/scaffolding.html](http://twitter.github.com/bootstrap/scaffolding.html).\n\
    \nWe’ll use **span12** and **hero-unit** classes for the main content block:\n\
    \n```\n 1     <div class=\"row-fluid\">\n 2      <div class=\"span12\">\n 3  \
    \       <div id=\"content\">\n 4           <div class=\"row-fluid\">\n 5     \
    \        <div class=\"span12\">\n 6               <div class=\"hero-unit\">\n\
    \ 7                 <h1>\n 8                   Welcome to Super \n 9         \
    \          Simple Backbone \n10                   Starter Kit\n11            \
    \     </h1>\n12                 <p>\n13                   This is your home page.\
    \ \n14                   To edit it just modify \n15                   <i>index.html</i>\
    \ file!\n16                 </p>\n17                 <p>\n18                 \
    \  <a \n19                     class=\"btn btn-primary btn-large\"\n20       \
    \              href=\"http://twitter.github.com/bootstrap\"\n21              \
    \       target=\"_blank\">\n22                     Learn more \n23           \
    \        </a>\n24                 </p>\n25               </div>  <!-- hero-unit\
    \ -->\n26             </div>  <!-- span12 -->\n27           </div> <!-- row-fluid\
    \ -->\n28       </div>  <!-- content -->\n29     </div> <!-- span12 -->\n30  \
    \   </div>  <!-- row-fluid -->\n```\n\nThe full source code of the **index.html**\
    \ from [rpjs/boostrap](https://github.com/azat-co/rpjs/tree/master/bootstrap):\n\
    \n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3 <head>\n 4   <link \n 5 \
    \    type=\"text/css\" \n 6     rel=\"stylesheet\" \n 7     href=\"css/bootstrap.min.css\"\
    \ />\n 8 </head>\n 9   <body >\n10     <div class=\"container-fluid\">\n11   \
    \    <div class=\"row-fluid\">\n12         <div class=\"span12\">\n13        \
    \   <div id=\"content\">\n14             <div class=\"row-fluid\">\n15       \
    \        <div class=\"span12\">\n16                 <div class=\"hero-unit\">\n\
    17                   <h1>\n18                     Welcome to Super \n19      \
    \               Simple Backbone \n20                     Starter Kit\n21     \
    \              </h1>\n22                   <p>\n23                     This is\
    \ your home page. \n24                     To edit it just modify \n25       \
    \              <i>index.html</i> file!\n26                   </p>\n27        \
    \           <p>\n28                     <a \n29                       class=\"\
    btn btn-primary btn-large\"\n30                       href=\"http://twitter.github.com/bootstrap\"\
    \n31                       target=\"_blank\">\n32                       Learn\
    \ more \n33                     </a>\n34                   </p>\n35          \
    \       </div>  <!-- hero-unit -->\n36               </div>  <!-- span12 -->\n\
    37             </div> <!-- row-fluid -->\n38         </div>  <!-- content -->\n\
    39       </div> <!-- span12 -->\n40     </div>  <!-- row-fluid -->\n41   </div>\
    \  <!-- container-fluid -->\n42 </body>\n43 </html>\n```\n\nThis example is available\
    \ for downloading/pulling at GitHub public [repository github.com/azat-co/rpjs](http://github.com/azat-co/rpjs)\
    \ under [rpjs/bootstrap folder](https://github.com/azat-co/rpjs/tree/master/bootstrap).\n\
    \nOther useful tools - CSS frameworks and CSS preprocessors worth checking out:\n\
    \n*   [Compass](http://compass-style.org/): CSS framework\n\n*   [SASS](http://sass-lang.com/):\
    \ extension of CSS3 and analog to LESS\n\n*   [Blueprint](http://blueprintcss.org/):\
    \ CSS framework\n\n*   [Foundation](http://foundation.zurb.com/): responsive front-end\
    \ framework\n\n*   [Bootswatch](http://bootswatch.com/): collection of customized\
    \ Twitter Bootstrap themes\n\n*   [WrapBootstrap](https://wrapbootstrap.com/):\
    \ market place for customized Bootstrap themes\n\n### 3.4 LESS\n\nLESS is the\
    \ dynamic stylesheet language. Sometimes, and in this case, it’s true that less\
    \ is more and [more is less](http://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less).\
    \ :-)\n\nThe browser cannot interpret LESS syntax, so LESS source code must be\
    \ compiled to CSS in one of the three ways:\n\n1.  In the browser by [LESS JavaScript\
    \ library](http://lesscss.googlecode.com/files/less-1.3.0.min.js)\n\n2.  On the\
    \ server-side by language/framework, i.e., for Node.js there is the [LESS module](https://npmjs.org/package/less)\n\
    \n3.  Locally on your Mac OS X machine by [LESS App](http://incident57.com/less/),\
    \ [SimpLESS](http://wearekiss.com/simpless) or a similar app\n\n| ![warning](images/leanpub_warning.png)\
    \ |  \n\n### Warning\n\nOption 1\\. is okay for a development environment but\
    \ suboptimal for a production environment. |\n\nLESS has variables, mixins and\
    \ operators, which make it faster for developers to reuse CSS rules. Here is an\
    \ example of a variable:\n\n#### 3.4.1 Variables\n\nVariables reduce redundancy\
    \ and allow developers to change values fast by having them in one canonical place.\
    \ And we know that in design (and styling) we often have to change values *very\
    \ frequently*!\n\nLESS code:\n\n```\n1 @color: #4D926F;\n2 #header {\n3   color:\
    \ @color;\n4 }\n5 h2 {\n6   color: @color;\n7 }\n```\n\nEquivalent in CSS:"
