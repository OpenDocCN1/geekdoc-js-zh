  raw: "Basically, we tell a browser to load the files from the array of filenames\
    \ — first parameter of the `require()` function — and then pass our modules from\
    \ those files to the anonymous callback function (second argument) as variables.\
    \ Inside of the main function (anonymous callback) we can use our modules by referencing\
    \ those variables. Therefore, our **apple-app.js** metamorphoses into:\n\n```\n\
    \ 1   require([\n 2     'apple-item.tpl', //can use shim plugin\n 3     'apple-home.tpl',\n\
    \ 4     'apple-spinner.tpl',\n 5     'apple.tpl',\n 6     'apple-item.view',\n\
    \ 7     'apple-home.view',\n 8     'apple.view',\n 9     'apples'  \n10   ],function(\n\
    11     appleItemTpl,\n12     appleHomeTpl,\n13     appleSpinnerTpl,\n14     appleTpl,\n\
    15     appelItemView,\n16     homeView,\n17     appleView,\n18     Apples\n19\
    \     ){\n20    var appleData = [\n21       {\n22         name: \"fuji\",\n23\
    \         url: \"img/fuji.jpg\"\n24       },\n25       {\n26         name: \"\
    gala\",\n27         url: \"img/gala.jpg\"\n28       }      \n29     ];\n30   \
    \  var app;\n31     var router = Backbone.Router.extend({ \n32     //check if\
    \ need to be required\n33       routes: {\n34         '': 'home',\n35        \
    \ 'apples/:appleName': 'loadApple'\n36       },\n37       initialize: function(){\n\
    38         var apples = new Apples();\n39         apples.reset(appleData);\n40\
    \         this.homeView = new homeView({collection: apples});\n41         this.appleView\
    \ = new appleView({collection: apples});\n42       },\n43       home: function(){\
    \        \n44         this.homeView.render();\n45       },\n46       loadApple:\
    \ function(appleName){\n47         this.appleView.loadApple(appleName);\n48 \n\
    49       }\n50     });\n51 \n52     $(document).ready(function(){\n53       app\
    \ = new router;\n54       Backbone.history.start();      \n55     })\n56 }); \n\
    ```\n\nWe put all of the code inside the function which is a second argument of\
    \ `require()`, mentioned modules by their filenames, and used dependencies via\
    \ corresponding parameters. Now we should define the module itself. This is how\
    \ we can do it with the `define()` method:\n\n```\n1 define([...],function(...){...})\n\
    ```\n\nThe meaning is similar to the `require()` function: dependencies are strings\
    \ of filenames (and paths) in the array which is passed as the first argument.\
    \ The second argument is the main function that accepts other libraries as parameters\
    \ (the order of parameters and modules in the array is important):\n\n```\n1 define(['name-of-the-module'],function(nameOfModule){\n\
    2   var b = nameOfModule.render();\n3   return b; \n4 })\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThere is no need to append **.js** to filenames. Require.js\
    \ does it automatically. Shim plugin is used for importing text files such as\
    \ HTML templates. |\n\nLet’s start with the templates and convert them into the\
    \ Require.js modules.\n\nThe new **apple-item.tpl.js** file:\n\n```\n1 define(function()\
    \ {\n2   return '\\\n3              <a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >\\\n4             <%=name%>\\\n5             </a>&nbsp;<a class=\"add-to-cart\"\
    \ href=\"#\">buy</a>\\\n6             '\n7 }); \n```\n\nThe **apple-home.tpl**\
    \ file:\n\n```\n1 define(function(){ \n2   return 'Apple data: \\\n3         <ul\
    \ class=\"apples-list\">\\\n4         </ul>\\\n5         <div class=\"cart-box\"\
    ></div>';\n6 });\n```\n\nThe **apple-spinner.tpl.js** file:\n\n```\n1 define(function(){\n\
    2   return '<img src=\"img/spinner.gif\" width=\"30\"/>';\n3 });\n```\n\nThe **apple.tpl.js**\
    \ file:\n\n```\n1 define(function(){\n2   return '<figure>\\\n3           <img\
    \ src=\"<%= attributes.url %>\"/>\\\n4           <figcaption><%= attributes.name\
    \ %></figcaption>\\\n5         </figure>';\n6  }); \n```\n\nThe **apple-item.view.js**\
    \ file:\n\n```\n1 define(function() {\n2   return '\\\n3              <a href=\"\
    #apples/<%=name%>\" target=\"_blank\">\\\n4             <%=name%>\\\n5       \
    \      </a>&nbsp;<a class=\"add-to-cart\" href=\"#\">buy</a>\\\n6            \
    \ '\n7 }); \n```\n\nIn the **apple-home.view.js** file, we need to declare dependencies\
    \ on apple-home.tpl and apple-item.view.js files:\n\n```\n 1 define(['apple-home.tpl','apple-item.view'],function(\n\
    \ 2   appleHomeTpl,\n 3   appleItemView){\n 4 return  Backbone.View.extend({\n\
    \ 5       el: 'body',\n 6       listEl: '.apples-list',\n 7       cartEl: '.cart-box',\n\
    \ 8       template: _.template(appleHomeTpl),\n 9       initialize: function()\
    \ {\n10         this.$el.html(this.template);\n11         this.collection.on('addToCart',\
    \ this.showCart, this);\n12       },\n13       showCart: function(appleModel)\
    \ {\n14         $(this.cartEl).append(appleModel.attributes.name+'<br/>');\n15\
    \       },      \n16       render: function(){\n17         view = this; //so we\
    \ can use view inside of closure\n18         this.collection.each(function(apple){\n\
    19           var appleSubView = new appleItemView({model:apple}); \n20       \
    \    // create subview with model apple\n21           appleSubView.render(); \n\
    22           // compiles tempalte and single apple data\n23           $(view.listEl).append(appleSubView.$el);\
    \   \n24           //append jQuery object from \n25           //single apple to\
    \ apples-list DOM element\n26         });\n27       }\n28     });\n29 })\n```\n\
    \nThe **apple.view.js** file depends on two templates:\n\n```\n 1 define([   \
    \ \n 2   'apple.tpl',\n 3   'apple-spinner.tpl'\n 4 ],function(appleTpl,appleSpinnerTpl){\n\
    \ 5   return  Backbone.View.extend({\n 6     initialize: function(){\n 7     \
    \  this.model = new (Backbone.Model.extend({}));\n 8       this.model.on('change',\
    \ this.render, this);\n 9       this.on('spinner',this.showSpinner, this);\n10\
    \     },\n11     template: _.template(appleTpl),\n12     templateSpinner: appleSpinnerTpl,\n\
    13     loadApple:function(appleName){\n14       this.trigger('spinner');\n15 \
    \      var view = this; \n16       //we'll need to access that inside of a closure\n\
    17       setTimeout(function(){ \n18       //simulates real time lag when \n19\
    \       //fetching data from the remote server\n20         view.model.set(view.collection.where({\n\
    21           name:appleName\n22         })[0].attributes);  \n23       },1000);\
    \      \n24     },\n25     render: function(appleName){\n26       var appleHtml\
    \ = this.template(this.model);\n27       $('body').html(appleHtml);\n28     },\n\
    29     showSpinner: function(){\n30       $('body').html(this.templateSpinner);\
    \        \n31     }\n32   });\n33 });\n```\n\nThe **apples.js** file:\n\n```\n\
    1 define(function(){\n2     return Backbone.Collection.extend({})\n3 }); \n```\n\
    \nI hope you can see the pattern by now. All of our code is split into the separate\
    \ files based on the logic (e.g., view class, collection class, template). The\
    \ main file loads all of the dependencies with the `require()` function. If we\
    \ need some module in a non-main file, then we can ask for it in the `define()`\
    \ method. Usually, in modules we want to return an object, e.g., in templates\
    \ we return strings and in views we return Backbone View classes/objects.\n\n\
    Try launching the example under the [rpjs/backbone/amd](https://github.com/azat-co/rpjs/tree/master/backbone/amd)\
    \ folder. Visually, there shouldn’t be any changes. If you open the Network tab\
    \ in the Developers Tool, you can see a difference in how the files are loaded.\
    \ The old [rpjs/backbone/refactor/index.html](https://github.com/azat-co/rpjs/blob/master/backbone/refactor/index.html)\
    \ file loads our JS scripts in a serial manner while the new the new [rpjs/backbone/amd/index.html](https://github.com/azat-co/rpjs/blob/master/backbone/amd/index.html)\
    \ file loads them in parallel.\n\n![The old rpjs/backbone/refactor/index.html\
    \ file](images/backbone-amd2.png)\n\nThe old rpjs/backbone/refactor/index.html\
    \ file\n\n![The new rpjs/backbone/amd/index.html file](images/backbone-amd1.png)\n\
    \nThe new rpjs/backbone/amd/index.html file\n\nRequire.js has a lot of configuration\
    \ options which are defined through `requirejs.config()` call in a top level of\
    \ an HTML page. More information can be found at [requirejs.org/docs/api.html#config](http://requirejs.org/docs/api.html#config)."
