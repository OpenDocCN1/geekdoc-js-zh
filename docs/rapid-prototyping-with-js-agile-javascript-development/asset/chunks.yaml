    2 console.log(\"test\");\n```\n\n**DOM objects**\n\n```\n1 document.write(\"Hello\
    \ World\");\n2 var table = document.createElement('table');\n3 var main = document.getElementById('main');\n\
    ```\n\n| ![warning](images/leanpub_warning.png) |  \n\n### Warning\n\nJavaScript\
    \ supports numbers only up to 53-bit in size. Check out large numbers’ libraries\
    \ if you need to deal with numbers larger than that. |\n\nThe full references\
    \ of JavaScript and DOM objects are available at [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/JavaScript/Reference)\
    \ and [w3school](http://www.w3schools.com/jsref/default.asp).\n\nFor JS resources\
    \ such as ECMA specs, check out this list [JavaScript Language Resources](https://developer.mozilla.org/en-US/docs/JavaScript/Language_Resources).\
    \ As of this writing, the latest JavaScript specification is ECMA-262 Edition\
    \ 5.1: [PDF](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)\
    \ and [HTML](http://www.ecma-international.org/ecma-262/5.1/).\n\nAnother important\
    \ distinction of JS is that it’s a functional and prototypal language. Typical\
    \ syntax for function declaration looks like this:\n\n```\n1 function Sum(a,b)\
    \ {\n2   var sum = a+b;\n3   return sum;\n4 }\n5 console.log(Sum(1,2));\n```\n\
    \nFunctions in JavaScript are [first-class citizens](http://en.wikipedia.org/wiki/First-class_function)\
    \ due to the [functional programming](http://en.wikipedia.org/wiki/Functional_programming)\
    \ nature of the language. Therefore, functions can be used as other variables/objects;\
    \ for example, functions can be passed to other functions as arguments:\n\n```\n\
    1 var f = function (str1){\n2   return function(str2){\n3   return str1+' '+str2;\n\
    4   };\n5 };\n6 var a = f('hello');\n7 var b = f('goodbye');\n8 console.log((a('Catty'));\n\
    9 console.log((b('Doggy'));\n```\n\nIt’s good to know that there are several ways\
    \ to instantiate an object in JS:\n\n*   [Classical inheritance](http://www.crockford.com/javascript/inheritance.html)\
    \ pattern\n\n*   [Pseudo classical inheritance](http://javascript.info/tutorial/pseudo-classical-pattern)\
    \ pattern\n\n*   Functional inheritance pattern\n\nFor further reading on inheritance\
    \ patterns, check out [Inheritance Patterns in JavaScript](http://bolinfest.com/javascript/inheritance.php)\
    \ and [Inheritance revisited](https://developer.mozilla.org/en-US/docs/JavaScript/Guide/Inheritance_Revisited).\n\
    \nMore information about browser-run JavaScript is available at [Mozilla Developer\
    \ Network](https://developer.mozilla.org/en-US/docs/JavaScript/Reference), [Wikipedia](http://en.wikipedia.org/wiki/JavaScript)\
    \ and [w3schools](http://www.w3schools.com/js/default.asp).\n\n### 1.2 Agile Methodologies\n\
    \nThe Agile software development methodology evolved due to the fact that traditional\
    \ methods like Waterfall weren’t good enough in situations of high unpredictability,\
    \ i.e., when [the solution is unknown](http://www.startuplessonslearned.com/2009/03/combining-agile-development-with.html).\
    \ Agile methodology includes Scrum/Sprint, Test-Driven Development, Continuous\
    \ Deployment, Paired Programming and other practical techniques, many of which\
    \ were borrowed from Extreme Programming.\n\n#### 1.2.1 Scrum\n\nIn regard to\
    \ the management, Agile methodology uses Scrum approach. More about Scrum can\
    \ be read at:\n\n*   [Scrum Guide in PDF](http://www.scrum.org/storage/scrumguides/Scrum_Guide.pdf)\n\
    \n*   [Scrum.org](http://www.scrum.org/)\n\n*   [Scrum development Wikipedia article](http://en.wikipedia.org/wiki/Scrum_(development))\n\
    \nThe Scrum methodology is a sequence of short cycles, and each cycle is called\
    \ **sprint**. One sprint usually lasts from one to two weeks. A typical sprint\
    \ starts and ends with a sprint planning meeting where new tasks are assigned\
    \ to team members. New tasks cannot be added to the sprint in progress; they can\
    \ be added only at the sprint meetings.\n\nAn essential part of the Scrum methodology\
    \ is the daily **scrum** meeting — hence the name. Each scrum is a 5-to-15-minutes-long\
    \ meeting which is often conducted in the hallways. In scrum meetings, each team\
    \ member answers three questions:\n\n1.  What have you done since yesterday?\n\
    \n2.  What are you going to do today?\n\n3.  Do you need anything from other team\
    \ members?\n\nFlexibility makes Agile an improvement over Waterfall methodology,\
    \ especially in situations of high uncertainty, i.e., in startups.\n\nThe advantage\
    \ of Scrum methodology: effective where it is hard to plan ahead of time, and\
    \ also in situations where a feedback loop is used as a main decision-making authority.\n\
    \n#### 1.2.2 Test-Driven Development\n\nTest-Driven Development, or TDD, consists\
    \ of the following steps:\n\n1.  Write failing automated test cases for new feature/tasks\
    \ or enhancement by using assertions that are either true or false.\n\n2.  Write\
    \ code to successfully pass the test cases."
