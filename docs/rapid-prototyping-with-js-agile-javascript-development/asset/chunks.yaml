    \ view = this; \n    //we'll need to access that inside of a closure\n    setTimeout(function(){\
    \ \n      //simulates real time lag when \n      //fetching data from the remote\
    \ server\n      view.model.set(view.collection.where({\n        name:appleName\n\
    \      })[0].attributes);  \n    },1000);      \n  },\n  render: function(appleName){\n\
    \    var appleHtml = this.template(this.model);\n    $('body').html(appleHtml);\n\
    \  },\n  showSpinner: function(){\n    $('body').html(this.templateSpinner); \
    \       \n  }\n});\n```\n\n`apples.js` is an empty collection:\n\n```javascript\n\
    var Apples = Backbone.Collection.extend({\n});\n```\n\n`apple-app.js` is the main\
    \ application file with the data, the router, and the starting command:\n\n```javascript\n\
    var appleData = [\n  {\n    name: \"fuji\",\n    url: \"img/fuji.jpg\"\n  },\n\
    \  {\n    name: \"gala\",\n    url: \"img/gala.jpg\"\n  }      \n];\nvar app;\n\
    var router = Backbone.Router.extend({\n  routes: {\n    '': 'home',\n    'apples/:appleName':\
    \ 'loadApple'\n  },\n  initialize: function(){\n    var apples = new Apples();\n\
    \    apples.reset(appleData);\n    this.homeView = new homeView({collection: apples});\n\
    \    this.appleView = new appleView({collection: apples});\n  },\n  home: function(){\
    \        \n    this.homeView.render();\n  },\n  loadApple: function(appleName){\n\
    \    this.appleView.loadApple(appleName);\n  }\n});\n$(document).ready(function(){\n\
    \  app = new router;\n  Backbone.history.start();      \n})\n```\n\nNow let’s\
    \ try to open the application. It should work exactly the same as in the previous\
    \ Subviews example.\n\nIt’s a way better code organization, but it’s still far\
    \ from perfect, because we still have HTML templates directly in the JavaScript\
    \ code. The problem is that designers and developers can’t work on the same files,\
    \ and any change to the presentation requires a change in the main code base.\n\
    \nWe can add a few more JS files to our `index.html` file:\n\n```html\n<script\
    \ src=\"apple-item.tpl.js\"></script>\n<script src=\"apple-home.tpl.js\"></script>\n\
    <script src=\"apple-spinner.tpl.js\"></script>\n<script src=\"apple.tpl.js\"></script>\n\
    ```\n\nUsually, one Backbone view has one template, but in the case of our `appleView`\
    \ — detailed view of an apple in a separate window — we also have a spinner, a\
    \ “loading” GIF animation.\n\nThe contents of the files are just global variables\
    \ which are assigned some string values. Later we can use these variables in our\
    \ views, when we call the Underscore.js helper method `_.template()`.\n\nThe `apple-item.tpl.js`\
    \ file:\n\n```javascript\nvar appleItemTpl = '\\\n     <a href=\"#apples/<%=name%>\"\
    \ target=\"_blank\">\\\n    <%=name%>\\\n    </a>&nbsp;<a class=\"add-to-cart\"\
    \ href=\"#\">buy</a>\\\n    ';\n```\n\nThe `apple-home.tpl.js` file:\n\n```javascript\n\
    var appleHomeTpl = 'Apple data: \\\n        <ul class=\"apples-list\">\\\n   \
    \     </ul>\\\n        <div class=\"cart-box\"></div>';\n```\n\nThe `apple-spinner.tpl.js`\
    \ file:\n\n```javascript\nvar appleSpinnerTpl = '<img src=\"img/spinner.gif\"\
    \ width=\"30\"/>';\n```\n\nThe `apple.tpl.js` file:\n\n```javascript\nvar appleTpl\
    \ = '<figure>\\\n                <img src=\"<%= attributes.url %>\"/>\\\n    \
    \            <figcaption><%= attributes.name %></figcaption>\\\n             \
    \ </figure>';\n```\n\nTry to start the application now. The full code is under\
    \ the [rpjs/backbone/refactor](https://github.com/azat-co/rpjs/tree/master/backbone/refactor)\
