    ```\n\nIf you really don’t like Mocha and/or BDD, CURL is always there for you.\
    \ :-)\n\nFor example, CURL data to make a POST request:\n\n```\n1 $ curl -d \"\
    \" http://localhost:3000\n```\n\nGET requests also work in the browser, for example\
    \ [http://localhost:3000/test](http://localhost:3000/test).\n\nIn this tutorial\
    \ our tests are longer than the app code itself so abandoning test-driven development\
    \ might be tempting, but believe me **the good habits of TDD will save you hours\
    \ and hours** during any serious development when the complexity of the applications\
    \ you work one is big.\n\n#### 8.7.4 Conclusion\n\nThe Express.js and Mongoskin\
    \ libraries are great when you need to build a simple REST API server in a few\
    \ line of code. Later, if you need to expand the libraries they also provide a\
    \ way to configure and organize your code.\n\nNoSQL databases like MongoDB are\
    \ good at free-REST APIs where we don’t have to define schemas and can throw any\
    \ data and it’ll be saved.\n\nThe full code of both test and app files: [https://gist.github.com/azat-co/6075685](https://gist.github.com/azat-co/6075685).\n\
    \nIf you like to learn more about Express.js and other JavaScript libraries take\
    \ a look at the series [Intro to Express.js tutorials](http://webapplog.com/tag/intro-to-express-js/).\n\
    \nNote: *In this example I’m using semi-colon less style. Semi-colons in JavaScript\
    \ are [absolutely optional](http://blog.izs.me/post/2353458699/an-open-letter-to-javascript-leaders-regarding)\
    \ except in two cases: in the for loop and before expression/statement that starts\
    \ with parenthesis (e.g., [Immediately-Invoked Function Expression](http://en.wikipedia.org/wiki/Immediately-invoked_function_expression)).\n\
    \n### 8.8 Node.js MVC: Express.js + Derby Hello World Tutorial\n\n#### 8.8.1 Node\
    \ MVC Framework"
