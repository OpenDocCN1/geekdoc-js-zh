    \n8.  To look at the Heroku logs for this app, type:\n\n    ```\n    1  $ heroku\
    \ logs\n    ```\n\nTo update the app with the new code, repeat the following steps\
    \ **only**:\n\n```\n1 $ git add -A\n2 $ git commit -m \"commit for deploy to heroku\"\
    \n3 $ git push -f heroku\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nYou’ll be assigned a new application URL each time you create\
    \ a new Heroku app with the command: `$ heroku create`. |\n\n### 3.12 Updating\
    \ and Deleting of Messages\n\nIn accordance with REST API, an update on an object\
    \ is performed via the PUT method and delete — DELETE. Both of them can easily\
    \ be performed with the same `jQuery.ajax` function that we’ve used for GET and\
    \ POST, as long as we provide an ID of an object on which we want to execute an\
    \ operation.\n\n## 4 Intro to Backbone.js\n\n**Summary**: demonstration of how\
    \ to build Backbone.js application from scratch and use views, collections, subviews,\
    \ models, event binding, AMD, Require.js on the example of the apple database\
    \ application.\n\n> *“Code is not an asset. It’s a liability. The more you write,\
    \ the more you’ll have to maintain later.”* — Unknown\n\n### 4.1 Setting up Backbone.js\
    \ App from Scratch\n\nWe’re going to build a typical starter “Hello World” application\
    \ using Backbone.js and Mode-View-Controller (MVC) architecture. I know it might\
    \ sound like overkill in the beginning, but as we go along we’ll add more and\
    \ more complexity, including Models, Subviews and Collections.\n\nA full source\
    \ code for the “Hello World” app is available at GitHub under [github.com/azat-co/rpjs/backbone/hello-world](https://github.com/azat-co/rpjs/tree/master/backbone/hello-world).\n\
    \n#### 4.1.1 Dependencies\n\nDownload the following libraries:\n\n*   [jQuery\
    \ 1.9 development source file](http://code.jquery.com/jquery-1.9.0.js)\n\n*  \
    \ [Underscore.js development source file](http://underscorejs.org/underscore.js)\n\
    \n*   [Backbone.js development source file](http://backbonejs.org/backbone.js)\n\
    \nAnd include these frameworks in the **index.html** file like this:\n\n```\n\
    \ 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n 4   <script src=\"jquery.js\"></script>\n\
    \ 5   <script src=\"underscore.js\"></script>\n 6   <script src=\"backbone.js\"\
    ></script>\n 7 \n 8   <script>\n 9     //TODO write some awesome JS code!\n10\
    \   </script>\n11 \n12 </head>\n13 <body>\n14 </body>\n15 </html>\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nWe can also put `<script>` tags right after the `</body>`\
    \ tag in the end of the file. This will change the order in which scripts and\
    \ the rest of HTML are loaded, and impact performance in large files. |\n\nLet’s\
    \ define a simple Backbone.js Router inside of a `<script>` tag:\n\n```\n1   ...\n\
    2   var router = Backbone.Router.extend({\n3   });\n4   ...\n```\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nFor now, to Keep It Simple Stupid (KISS), we’ll be putting\
    \ all of our JavaScript code right into the **index.html** file. This is not a\
    \ good idea for a real development or production code. We’ll refactor it later.\
    \ |\n\nThen set up a special `routes` property inside of an **extend** call:\n\
    \n```\n1   var router = Backbone.Router.extend({\n2     routes: {\n3     }\n4\
    \   });\n```\n\nThe Backbone.js **routes** property needs to be in the following\
    \ format: `'path/:param':'action'` which will result in the `filename#path/param`\
    \ URL triggering a function named **action** (defined in the Router object). For\
    \ now, we’ll add a single **home** route:\n\n```\n1   var router = Backbone.Router.extend({\n\
    2     routes: {\n3       '': 'home'\n4     }\n5   });\n```\n\nThis is good, but\
    \ now we need to add a **home** function:"
