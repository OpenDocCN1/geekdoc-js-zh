    \ Create a file **index.php** on the same level as **index.html** in the project\
    \ folder, which you would like to publish/deploy to Heroku with the following\
    \ content:\n\n```\n1 <?php echo file_get_contents('index.html'); ?>\n```\n\nFor\
    \ your convenience, the **index.php** file is already included in *rpjs/rest*.\n\
    \nThere is an even simpler way to publish static files on Heroku with Cedar stack\
    \ which is described in the post [Static Sites on Heroku Cedar](http://kennethreitz.com/static-sites-on-heroku-cedar.html).\
    \ In order to make Cedar Stack work with your static files, all you need to do\
    \ is to type and execute following commands in your project folder:\n\n```\n1\
    \ $ touch index.php\n2 $ echo 'php_flag engine off' > .htaccess\n```\n\nAlternatively,\
    \ you could use the Ruby Bamboo stack. In this case, we would need the following\
