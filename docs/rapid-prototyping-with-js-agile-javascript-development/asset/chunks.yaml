    For soft-copy (digital version) the book comes in three formats:


    1. PDF: suited for printing; opens in Adobe Reader, Mac OS X Preview, iOS apps,
    and other PDF viewers.

    2. ePub: suited for iBook app on iPad and other iOS devices; to copy to devices
    use iTunes, Dropbox or email to yourself.

    3. mobi: suited for Kindles of all generations as well as desktop and mobile Amazon
    Kindle apps and Amazon Cloud Reader; to copy to devices use Whispernet, USB cable
    or email to yourself.


    This is a digital version of the book, so most of the links are hidden just like
