    \ function and a JSON object as a parameter to it.\n\nThere are a multiple ways\
    \ to proceed from now on, but the best practice is to use the `el` and `template`\
    \ properties, which are magical, i.e., special in Backbone.js:\n\n```\n1   var\
    \ homeView = Backbone.View.extend({\n2     el: 'body',\n3     template: _.template('Hello\
    \ World')   \n4   });\n```\n\nThe property `el` is just a string that holds the\
    \ jQuery selector (you can use class name with `.` and id name with `#`). The\
    \ `template` property has been assigned an Underscore.js function `template` with\
    \ just a plain text ‘Hello World’.\n\nTo render our `homeView` we use `this.$el`\
    \ which is a compiled jQuery object referencing element in an `el` property, and\
