    \nBackbone.js 和 Parse.com 聊天程序的完整源代码可以在 [rpjs/sdk](https://github.com/azat-co/rpjs/tree/master/sdk)\
    \ 获取。\n\n### 5.2 将聊天功能部署到 PaaS\n\n一旦你确认前端应用程序在本地运行良好（无论是否使用如 MAMP 或 XAMPP 这样的本地\
    \ HTTP 服务器），请将其部署到 Windows Azure 或 Heroku。有关详细的部署说明请参见 `jQuery and Parse.com`\
    \ 章节。\n\n### 5.3 增强聊天功能\n\n在最后两个示例中，聊天程序的功能非常基础。你可以通过添加更多功能来增强应用程序。\n\n适用于 `intermediate`\
    \ 阶段的额外功能：\n\n-   排序消息\n-   防止重复消息\n-   添加消息\n-   删除消息\n-   登录\n-   编辑消息\n-  \
    \ 保存消息\n-   显示消息\n\nBackbone.js 和 Parse.com 聊天程序的完整源代码可以在 [rpjs/sdk](https://github.com/azat-co/rpjs/tree/master/sdk)\
    \ 获取。"
- fmt: "\n*   `http.listen()`: begins accepting connections on the specified port\
    \ and hostname\n*   `http.createClient()`: node app can be a client and make requests\
    \ to other servers\n*   `http.ServerRequest()`: incoming requests are passed to\
    \ request handlers\n\n    *   `data`: emitted when a piece of the message body\
    \ is received\n    *   `end`: emitted exactly once for each request\n    *   `request.method()`:\
    \ the request method as a string\n    *   `request.url()`: request URL string\n\
    *   `http.ServerResponse()`: this object is created internally by an HTTP server\
    \ — not by the user, and used as an output of request handlers\n\n    *   `response.writeHead()`:\
    \ sends a response header to the request\n    *   `response.write()`: sends a\
    \ response body\n    *   `response.end()`: sends and ends a response body\n\n\
    #### [util](http://nodejs.org/api/util.html)\n\nThis module provides utilities\
    \ for debugging. Some of the methods include:\n\n*   `util.inspect()`: Return\
    \ a string representation of an object, which is useful for debugging\n\n####\
    \ [querystring](http://nodejs.org/api/querystring.html)\n\nThis module provides\
    \ utilities for dealing with query strings. Some of the methods include:\n\n*\
    \   `querystring.stringify()`: Serialize an object to a query string\n*   `querystring.parse()`:\
    \ Deserialize a query string to an object\n\n#### [url](http://nodejs.org/api/url.html)\n\
    \nThis module has utilities for URL resolution and parsing. Some of the methods\
    \ include:\n\n*   `parse()`: Take a URL string, and return an object\n\n#### [fs](http://nodejs.org/api/fs.html)\n\
    \nfs handles file system operations such as reading and writing to/from files.\
    \ There are synchronous and asynchronous methods in the library. Some of the methods\
    \ include:\n\n*   `fs.readFile()`: reads file asynchronously\n*   `fs.writeFile()`:\
    \ writes data to file asynchronously\n\nThere is no need to install or download\
    \ core modules. To include them in your application, all you need is to follow\
    \ the syntax:\n\n```\n1 var http = require('http');\n```\n\nThe lists of non-core\
    \ modules can be found at:\n\n*   [npmjs.org](https://npmjs.org): Node Package\
    \ Manager registry\n*   [GitHub hosted list](https://github.com/joyent/node/wiki/Modules):\
    \ list of Node.js modules maintainded by Joyent\n*   [nodetoolbox.com](http://nodetoolbox.com/):\
    \ registry based on stats\n*   [Nipster](http://eirikb.github.com/nipster/): NPM\
    \ search tool for Node.js\n*   [Node Tracking](http://nodejsmodules.org): registry\
    \ based on GitHub stats\n\nIf you would like to know how to code your own modules,\
    \ take a look at the article [Your first Node.js module](http://cnnr.me/blog/2012/05/27/your-first-node-dot-js-module/).\n\
    \n#### 6.1.3 Node Package Manager\n\nNode Package Manager, or NPM, manages dependencies\
    \ and installs modules for you. Node.js installation comes with NPM, whose website\
    \ is [npmjs.org](http://npmjs.org/).\n\n`package.json` contains meta information\
    \ about our Node.js application such as a version number, author name and, most\
    \ importantly, what dependencies we use in the application. All of that information\
    \ is in the JSON formatted object, which is read by NPM.\n\nIf you would like\
    \ to install packages and dependencies specified in `package.json`, type:\n\n\
    ```\n1 $ npm install \n```\n\nA typical `package.json` file might look like this:\n\
    \n```\n 1 {\n 2    \"name\": \"Blerg\",\n 3    \"description\": \"Blerg blerg\
    \ blerg.\",\n 4    \"version\": \"0.0.1\",\n 5    \"author\": {\n 6       \"name\"\
    \ : \"John Doe\", \n 7       \"email\" : \"john.doe@gmail.com\"\n 8    },\n 9\
    \    \"repository\": {\n10        \"type\": \"git\",\n11        \"url\": \"http://github.com/johndoe/blerg.git\"\
    \n12    },\n 13    \"engines\": [\n14        \"node >= 0.6.2\"\n15    ],\n 16\
    \    \"license\" : \"MIT\",\n 17    \"dependencies\": {\n18        \"express\"\
    : \">= 2.5.6\",\n19        \"mustache\": \"0.4.0\",\n20        \"commander\":\
    \ \"0.5.2\"\n21    },\n 22    \"bin\" : {\n23        \"blerg\" : \"./cli.js\"\n\
    24    }\n 25 }\n```\n\nTo update a package to its current latest version, or the\
