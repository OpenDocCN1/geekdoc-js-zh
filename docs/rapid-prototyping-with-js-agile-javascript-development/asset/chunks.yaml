- fmt: "\n*   Utilizes HTTP methods: `GET`, `POST`, `DELETE`, PUT`, `OPTIONS`, etc.\n\
    \nHere is an example of simple Create, Read, Update and Delete (CRUD) REST API\
    \ for Message Collection:\n\n| Method | URL | Meaning |\n| --- | --- | --- |\n\
    | GET | `/messages.json` | Return list of messages in JSON format |\n| PUT | `/messages.json`\
    \ | Update/replace all messages and return status/error in JSON |\n| POST | `/messages.json`\
    \ | Create new message and return its id in JSON format |\n| GET | `/messages/{id}.json`\
    \ | Return message with id `{id}` in JSON format |\n| PUT | `/messages/{id}.json`\
    \ | Update/replace message with id `{id}`, if `{id}` message doesn’t exists create\
    \ it |\n| DELETE | `/messages/{id}.json` | Delete message with id `{id}`, return\
    \ status/error in JSON format |\n\nREST is not a protocol; it is an architecture\
    \ in the sense that it’s more flexible than SOAP, which is a protocol. Therefore,\
    \ REST API URLs could look like `/messages/list.html` or `/messages/list.xml`\
    \ in case we want to support these formats.\n\n`PUT` and `DELETE` are [idempotent\
    \ methods](http://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol#Idempotent_methods_and_web_applications),\
    \ which means that if the server receives two or more similar requests, the end\
    \ result will be the same.\n\n`GET` is nullipotent and `POST` is not idempotent\
    \ and might affect state and cause side-effects.\n\nFurther reading on REST API\
    \ can be found at [Wikipedia](http://en.wikipedia.org/wiki/Representational_state_transfer)\
    \ and [A Brief Introduction to REST article](http://www.infoq.com/articles/rest-introduction).\n\
    \n## 2 Setup\n\n**Summary**: suggestions for the toolset; step-by-step installation\
    \ of local components; preparation for the use of cloud services.\n\n> *“One of\
    \ my most productive days was throwing away 1,000 lines of code.”* - [Ken Thompson](http://en.wikipedia.org/wiki/Ken_Thompson)\n\
    \n### 2.1 Local Setup\n\n### 2.1.1 Development Folder\n\nIf you don’t have a specific\
    \ development folder for your web development projects, you could create a `Development`\
    \ folder in the `Documents` folder (path will be `Documents/Development`). To\
    \ work on the code example, create a `rpjs` folder inside your web development\
    \ projects folder, e.g., if you create a `rpjs` folder inside of the `Development`\
    \ folder, the path will be `Documents/Development/rpjs`. You could use the Finder\
    \ on Mac OS X or the following terminal commands on OS X/Linux systems:\n\n```\n\
    1 $ cd ~/Documents\n2 $ mkdir Development\n3 $ cd Development\n4 $ mkdir rpjs\n\
    ```\n\n![Initial development environment setup.](images/screenshots----dev-env-setup.png)\n\
    \nInitial development environment setup.\n\n| ![tip](images/leanpub_tip.png) |\
    \  \n\n#### Tip\n\nTo open Mac OS Finder app in the current directory from Terminal,\
    \ just type and run the `$ open .` command.\n\nTo get the list of files and folders,\
    \ use this UNIX/Linix command:\n\n```\n1 $ ls \n```\n\nor to display hidden files\
    \ and folders, like `*.git`:\n\n```\n1 $ ls -lah\n```\n\nAnother alternative to\
    \ `$ ls` is `$ ls -alt`. The difference between the `-lah` and the `-alt` options\
    \ is that the latter sorts items chronologically and the former alphabetically.\n\
    \n| ![information](images/leanpub_information.png) |  \n\n#### Note\n\nYou can\
    \ use the Tab key to autocomplete names of the files and folders.\n\nLater, you\
    \ could copy examples into the `rpjs` folder as well as create apps in that folder.\n\
    \n| ![information](images/leanpub_information.png) |  \n\n#### Note\n\nAnother\
    \ useful thing is to have the “New Terminal at Folder” option in Finder on Mac\
    \ OS X. To enable it, open your “System Preferences” (you could use Command +\
    \ Space, a.k.a. Spotlight, for it). Find “Keyboard” and click on it. Open “Keyboard\
    \ Shortcuts” and click on “Services.” Check the “New Terminal at Folder” and “New\
    \ Terminal Tab at Folder” boxes. Close the window (optional).\n\n### 2.1.2 Browsers\n\
    \nWe recommend downloading the latest version of the [WebKit](http://en.wikipedia.org/wiki/WebKit)\
    \ or [Gecko](http://en.wikipedia.org/wiki/Gecko_(layout_engine)) browser of your\
    \ choice: [Chrome](http://www.google.com/chrome), [Safari](http://www.apple.com/safari/)\
    \ or [Firefox](http://www.mozilla.org/en-US/firefox/new/). While Chrome and Safari\
    \ already come with built-in Developer Tools, you’ll need the [Firebug](http://getfirebug.com/)\
    \ plug-in for Firefox.\n\n![Chrome dev tools.](images/screenshots----chrome-dev-tools.png)\n\
    \nChrome dev tools.\n\nFirebug and Developer Tools allow developers to do many\
    \ things like:\n\n*   Debug JavaScript\n*   Manipulate HTML and DOM elements\n\
    *   Modify CSS on the fly\n*   Monitor HTTP requests and responses\n*   Run profiles\
    \ and inspect heap dumps\n*   See loaded assets such as images, CSS and JS files\n\
    \n![Google tutorials for mastering web deb tools.](images/screenshots----dev-tools-tutorials.png)\n\
    \nGoogle tutorials for mastering web deb tools.\n\nGreat Chrome DevTools tutorials:\n\
    \n*   [Explore and Master Chrome DevTools](http://discover-devtools)\n*   [Chrome\
    \ DevTools](http://www.google.com/chrome)\n*   [Chrome DevTools](https://developers.google.com/)\n\
    \n### 2.1.3 IDEs and Text Editors\n\nOne of the best things about JS is that you\
    \ don’t need to compile. Because you are already familiar and comfortable with\
    \ IDE like [Eclipse](http://www.eclipse.org/), [NetBeans](http://netbeans.org/)\
    \ or [Aptana](http://aptana.com/), feel free to stick with it. We highly recommend\
    \ a lightweight text editor with support of many languages languages.\n\nHere\
    \ is the list of the most popular text editors and IDEs used in web development:\n\
    \n*   [TextMate](http://macromates.com/): Mac OS X only, free 30-day trial.\n\
    *   [Sublime Text](http://www.sublimetext.com/): Mac OS X and Windows versions\
    \ are available.\n*   [Coda](http://panic.com/coda/): all-in-one editor with FTP\
    \ browser and preview.\n*   [Aptana Studio](http://aptana.com/): full-sized IDE\
    \ with built-in terminal and many other tools.\n*   [Notepad++](http://notepad-plus-plus.org/):\
    \ free Windows-only lightweight editor.\n*   [WebStorm](http://www.jetbrains.com/webstorm/):\
    \ feature-rich IDE which allows for Node.js debugging.\n\n![WebStorm IDE home\
    \ page.](images/screenshots----webstorm.png)\n\nWebStorm IDE home page.\n\n###\
    \ 2.1.4 Version Control Systems\n\n[Version control system](http://en.wikipedia.org/wiki/Revision_control)\
    \ is a must-have even in an only-one-developer situation. Also many cloud services,\
    \ e.g., Heroku, require Git for deployment. We also highly recommend getting used\
    \ to Git and Git terminal commands instead of using Git visual clients/apps with\
    \ a graphical interface: [GitX](http://gitx.frim.nl/), [Gitbox](http://www.gitboxapp.com/)\
    \ or [GitHub for Mac](http://mac.github.com/).Subversion is a non-distributed\
    \ version control system. This article compares [Git vs. Subversion](https://git.wiki.kernel.org/index.php/GitSvnComparison).\n\
    \nHere are the steps to install and set up Git on your machine:\n\n1.  Download\
    \ the latest version for your OS at [http://git-scm.com/downloads](http://git-scm.com/downloads).![Downloading\
    \ latest release of Git.](images/screenshots----git-install.png)\n\n    Downloading\
    \ latest release of Git.\n\n2.  Install Git from the downloaded `*.dmg` package,\
    \ i.e., run `*.pkg` file and follow the wizard.\n"
