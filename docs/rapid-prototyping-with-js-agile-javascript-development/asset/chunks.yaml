    \ is completed!');\n79   process.exit(1);\n80 });\n```\n\nTo launch it, run `npm\
    \ install`/`npm update` and change the hard-coded database values.\n\n## 8.3 TDD\
    \ in Node.js with Mocha\n\n### 8.3.1 Who Needs Test-Driven Development?\n\nImagine\
    \ that you need to implement a complex feature on top of an existing interface,\
    \ e.g., a ‘like’ button on a comment. Without tests, you’ll have to manually create\
    \ a user, log in, create a post, create a different user, log in with a different\
    \ user and like the post. Tiresome? What if you’ll need to do it 10 or 20 times\
    \ to find and fix some nasty bug? What if your feature breaks existing functionality,\
    \ but you notice it six months after the release because there was no test?!\n\
    \nDon’t waste time writing tests for throwaway scripts, but please adapt the habit\
    \ of Test-Driven Development for the main code base. With a little time spent\
    \ in the beginning, you and your team will save time later and have confidence\
    \ when rolling out new releases. Test Driven Development is a really, really,\
    \ really good thing.\n\n### 8.3.2 Quick Start Guide\n\nFollow this quick guide\
    \ to set up your Test-Driven Development process in Node.js with [Mocha](http://visionmedia.github.com/mocha/).\n\
    \nInstall [Mocha](http://visionmedia.github.com/mocha/) globally by executing\
    \ this command:\n\n```\n$ sudo npm install -g mocha\n```\n\nWe’ll also use two\
    \ libraries, [Superagent](https://github.com/visionmedia/superagent) and [expect.js](https://github.com/LearnBoost/expect.js/)\
    \ by [LearnBoost](https://github.com/LearnBoost). To install them, fire up [NPM](https://npmjs.org/)\
    \ commands in your project folder like this:\n\n```\n1 $ npm install superagent\n\
    2 $ npm install expect.js \n```\n\nOpen a new file with `.js` extension and type:\n\
    \n```\n1 var request = require('superagent');\n2 var expect = require('expect.js');\n\
    ```\n\nSo far, we’ve included two libraries. The structure of test will look like:\n\
    \n```\n1 describe('suite', function(){\n2   it('test', function(done){\n3    \
    \ done();\n4   });\n5 });\n```\n"
