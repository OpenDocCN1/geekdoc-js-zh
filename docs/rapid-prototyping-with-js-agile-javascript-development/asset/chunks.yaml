  trans: "\n\n为了在书籍的不同部分、章节和节之间进行快速导航，请使用基于`Table of Contents`（目录）的书籍导航窗（如下所示）。\n\n\
    ![Mac OS X 预览应用中的目录面板。](img/navigation.png)\n\nMac OS X 预览应用中的目录面板。\n\n## 示例\n\
    \n书中使用的所有示例源代码大部分都可以在书中找到，也可以在公共 GitHub 仓库 [github.com/azat-co/rpjs](http://github.com/azat-co/rpjs)\
    \ 中找到。你也可以作为 [ZIP 存档](https://github.com/azat-co/rpjs/archive/master.zip) 下载文件或使用\
    \ `Git` 拉取它们。关于如何安装和使用 `Git` 的更多内容将在书中后介绍。源代码文件、文件夹结构和部署文件可以在本地和/或远程在 Pa 解决方案（即\
    \ Windows Azure 和 Heroku）上运行，只需微调或无需修改。\n\n书中的源代码在技术上受到平台限制，宽度约为 70 个字符。我们尽力保留了最好的\
    \ JavaScript 和 HTML 格式样式，但你可能会偶尔看到反斜杠（`\\`）。代码本身没有问题。反斜杠是行转义字符，如果你将代码复制粘贴到编辑器中，示例应该可以正常运行。请注意，GitHub\
    \ 和书中的代码格式可能不同。此外，如果你发现任何 Bug，请通过电子邮件 (hi@rpjs.co) 告诉我们！\n\n## 符号\n\n代码块看起来像这样：\n\
    \n```\n1 var object = {};\n2 object.name = \"Bob\";\n```\n\n终端命令看起来相似，但以美元符号或\
    \ `$` 开头：\n\n```\n1 $ git push origin heroku\n2 $ cd /etc/\n3 $ ls \n```\n\n内联文件名、路径/文件夹名称、引号以及特殊单词/名称使用*斜体*，而命令名称（例如\
    \ `mongod`）和强调词汇（例如 `Note`）则使用**粗体**。\n\n## 术语\n\n为了本书的目的，我们交替使用一些术语，根据上下文，它们的含义可能并不完全相同。例如：`function`\
    \ = `method` = `call`，`attribute` = `property` = `member` = `key`，`value` = `variable`，`object`\
    \ = `hash` = `class`，`list` = `array`，`framework` = `library` = `module`\n\n##\
    \ 关于作者\n\n![Azat Mardan：一名软件工程师、作者和瑜伽士。](img/azat.jpg)\n\nAzat Mardan：一名软件工程师、作者和瑜伽士。\n\
    \nAzat Mardan 在 Web、移动和软件开发方面拥有 12 年以上的经验。他拥有信息学学士学位和信息系统技术硕士学位，Azat 具备深厚的学术知识和丰富的实践经验。\n\
    \n目前，Azat 在 [DocuSign](http://docusign.com) 担任高级软件工程师，他的团队使用 `Node.js`、`Express.js`、`Backbone.js`、`CoffeeScript`、`Jade`、`Stylus`\
    \ 和 `Redis` 技术栈构建了 500 万用户产品（DocuSign Web 应用）。\n\n最近，他在精选社交媒体新闻聚合网站 [Storify.com](http://storify.com)（已被\
    \ [LiveFyre](http://livefyre.com) 收）担任工程师，该网站被 BBC、NBC、CNN、白宫等机构使用。与其他公司不同，Storify\
    \ 的一切运行在 `Node.js` 上。它是开源库 [jade-browser](http://npmjs.org/jade-browser) 的维护者。\n\
    \n在此之前，Azat 曾在 [Gizmo](http://www.crunchbase.com/company/gizmo) 担任 CTO/联合创始人——这是一个用于移动营销活动的企业级云平台，并参加过声誉卓远的\
    \ [500 Startups](http://500.co/) 业务加速计划。\n\n在此之前，Azat 曾在华盛顿特区的政府机构开发过关键任务应用程序，包括[国立健康研究院](http://nih.gov)、[国立生物技术信息中心](http://ncbi.nlm.nih.gov)、[联邦存款保险公司](http://fdic.gov)\
    \ 以及[洛希希德马丁](http://lockheedmartin.com)。\n\nAzat 是湾区地区技术聚会和黑客松的常客（[AngelHack](http://angelhack.com)\
    \ 2012 年黑客松决赛选手，团队来自 [FashionMetric.com](http://fashionmetric.com)）。\n\n此外，Azat\
    \ 还在 [General Assembly](http://generalassemb.ly)、[Hack Reactor](http://hackreactor.com)、[pariSOMA](http://parisoma.com)\
    \ 和 [Marakana](http://marakana.com)（已被 Twitter 收购）教授技术课程并广受好。\n\n在空余时间，他在自己的博客\
    \ [webAppLog.com](http://webapplog.com) 上编写技术文章，该博客在 Google “express.js tutorial”搜索中排名第一（http://expressjsguide.com/assets/img/expressjs-tutorial.png）。Azat\
    \ 还是 [Express.js Guide](http://expressjsguide.com)、[Rapid Prototyping with JS](http://rpjs.co)\
    \ 和 [Oh My JS](http://leanpub.com/ohmyjs) 的作者，以及开源项目 [ExpressWorks](http://npmjs.org/expressworks)、[mongoui](http://npmjs.org/mongoui)\
    \ 和 [HackHall](http://npmjs.org/hackhall) 的创建者。\n\n# 快速入门\n\n## 1 基础\n\n**摘要**：HTML、CSS\
    \ 和 JavaScript 语法的概述；敏捷开发方法的简要介绍；云计算、Node.js 和 MongoDB 的优势；HTTP 请求/响应的描述。\n\n\
    > “我认为每个人都应该学习编程，因为它教会你如何思考。我将计算机科学视为人文艺术，是每个人应该学习的。” —— 史蒂夫乔布\n\n### 1.1 前端定义\n\
    \n#### 1.1.1 整体视图\n\nWeb 和移动应用程序开发的整体视图包括以下步骤：\n\n1. 用户在浏览器（客户端）输入 URL 或点击链接\n\
    2. 浏览器向服务器发送 HTTP 请求\n3. 服务器处理请求，如果查询字符串和/或请求体中有参数，它将考虑这些参数\n4. 服务器在数据库中更新/获取/转换数据\n\
    5. 服务器返回包含 HTML、JSON 或格式数据的 HTTP 响应\n6. 浏览器接收 HTTP 响应\n7. 浏览器以 HTML 或任何其他格式（例如\
    \ JPEG、XML、JSON）渲染 HTTP 响应\n\n移动应用程序与普通网站相同，只是不是浏览器而是原生应用。其他细微差别在于：运营商带宽导致的数据限制、较小的屏幕以及对本地存储更高效的利用。\n\
    \n移动开发有几种方法，每种方法都有其优缺点：\n\n* 使用 Objective-C 和 Java 构建的原生 iOS、Android、Blackberry\
    \ 应用\n* 使用 JavaScript 在 [Appcelerator](http://www.appcelerator.com/) 或类似工具构建的应用，然后编译成原生\
    \ Objective-C 或 Java\n* 针对较小屏幕的响应式设计移动网站，使用 CSS 框架（如 [Twitter Bootstrap](https://twitter.github.io/bootstrap/)\
    \ 或 [Foundation](http://foundation.zurb.com/)）、普通 CSS 或不同的模板\n\n"
- fmt: "\n*   HTML5 apps which consist of HTML, CSS and JavaScript, and are usually\
    \ built with frameworks like [Sencha Touch](http://www.sencha.com/products/touch/),\
    \ [Trigger.io](https://trigger.io/), [JO](http://joapp.com/), and then wrapped\
    \ into native app with [PhoneGap](http://phonegap.com/)\n\n## 1.1.2 HyperText\
    \ Markup Language\n\nA HyperText Markup Language, or `HTML`, is not a programming\
    \ language in itself. It is a set of markup tags which describe the content and\
    \ present it in a structured and formatted way. HTML tags consist of a `tag name`\
    \ inside of the angle brackets (`<>`). In most cases, tags surround the content\
    \ with the end tag having a `forward slash` before the tag name.\n\nIn this example,\
    \ each line is an HTML element:\n\n```\n1 <h2>Overview of HTML</h2>\n2 <div>HTML\
    \ is a ...</div>\n3 <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    \ />\n```\n\nAn HTML document itself is an element of the `html` tag, and all\
    \ other elements are children of that `html` tag:\n\n```\n 1 <!DOCTYPE html>\n\
    \ 2 <html lang=\"en\">\n 3   <head>\n 4     <link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"style.css\" />\n 5   </head>\n 6   <body>\n 7     <h2>Overview of HTML</h2>\n\
    \ 8     <p>HTML is a ...</p>\n 9   </body>\n10 </html>\n```\n\nThere are different\
    \ flavors and versions of HTML, e.g., DHTML, XHTML 1.0, XHTML 1.1, XHTML 2, HTML\
    \ 4, HTML 5\\.`. This article does a good job of explaining the differences —\
    \ [Misunderstanding Markup: XHTML 2/HTML 5 Comic Strip](http://coding.smashingmagazine.com/2009/07/29/misunderstanding-markup-xhtml-2-comic-strip/).\n\
    \nAny HTML element can have attributes. The most important of them are: `class`,\
    \ `id`, `style`, `data-name`, `onclick`, and other event attributes.\n\n### class\n\
    \nClass attribute defines a class which is used for styling in CSS or DOM manipulation,\
    \ e.g.:\n\n```\n1 <p class=\"normal\">...</p>\n```\n\n### id\n\nId attribute defines\
    \ an ID which is similar in purpose to element class but has to be unique, e.g.:\n\
    \n```\n1 <div id=\"footer\">...</div>\n```\n\n### style\n\nStyle attribute defines\
    \ inline CSS to style an element, e.g.:\n\n```\n1 <font style=\"font-size:20px\"\
    >...</font>\n```\n\n### title\n\nTitle attribute specifies additional information\
    \ which is usually presented in tooltips by most browsers, e.g.:\n\n```\n1 <a\
    \ title=\"Up-vote the answer\">...</a>\n```\n\n### data-name\n\nData-name attribute\
    \ allows for meta data to be stored in DOM, e.g.:\n\n```\n1 <tr data-token=\"\
    fa10a70c-21ca-4e73-aaf5-d889c7263a0e\">...</tr>\n```\n\n### onclick\n\nOnclick\
    \ attribute calls inline JavaScript code when click event happens, e.g.:\n\n```\n\
    1 <input type=\"button\" onclick=\"validateForm();\">...</a>\n```\n\n### onmouseover\n\
    \nOnmouseover attribute is similar to `onclick` but for mouse hover events, e.g.:\n\
    \n```\n1 <a onmouseover=\"javascript: this.setAttribute('css','color:red')\">...</a>\n\
    ```\n\nOther HTML element attributes for inline JavaScript code are:\n\n*   `onfocus`:\
    \ when browser focuses on an element\n*   `onblur`: when browser focus leaves\
    \ an element\n*   `onkeydown`: when a user presses a keyboard key\n*   `ondblclick`:\
    \ when a user double-clicks the mouse\n*   `onmousedown`: when a user presses\
    \ a mouse button\n*   `onmouseup`: when a user releases a mouse button\n*   `onmouseout`:\
    \ when a user moves mouse out of the element area\n*   `oncontextmenu`: when a\
    \ user brings up a context menu\n\nThe full list of such events and a browser\
    \ compatibility table are presented in [Event compatibility tables](http://www.quirksmode.org/dom/events/index.html).\n\
    \nWe’ll use classes extensively with Twitter Bootstrap framework, while the use\
    \ of inline CSS and JavaScript code is generally a bad idea, so we’ll try to avoid\
    \ it. However, it’s good to know the names of the JavaScript events because they\
    \ are used all over the place in jQuery, Backbone.js and of course plain JavaScript.\
    \ To convert the list of attribute to a list of JS events, just remove the prefixes\
    \ `on`, e.g., `onclick` attribute means `click` event.\n\nMore information is\
    \ available at [Example: Catching a mouse click](https://developer.mozilla.org/en-US/docs/JavaScript/Getting_Started#Example:_Catching_a_mouse_click),\
    \ [Wikipedia](http://en.wikipedia.org/wiki/HTML) and [w3schools](http://www.w3schools.com/html/html_intro.asp).\n\
    \n## 1.1.3 Cascading Style Sheets\n\nCascading Style Sheets, or CSS, is a way\
    \ to format and present content. An HTML document can have an external stylesheet\
    \ included in it by a `link` tag, as shown in the previous examples, or can have\
    \ CSS code directly inside of a `style` tag:\n\n```\n1 <style>\n2   body {\n 3\
    \     padding:60px; /* simple padding */\n 4   }\n 5 </style>\n```\n\nCSS is an\
    \ upgrade to CSS which includes new ways of doing things such as rounded corners,\
    \ borders and gradients.\n\n## 1.1.4 JavaScript\n\nJavaScript was started in 1995\
    \ at Netscape as LiveScript. It has the same relationship with Java as a hamster\
    \ and a ham. These days, JavaScript is used for both client and server-side, as\
    \ well as in desktop application.\n\nPutting JS code into a `script` tag is the\
    \ easiest way to use JavaScript in an HTML document:\n\n```\n1 <script>\n2   alert(\"\
    Hello world!\");\n3   //simple alert window\n4 </script>\n```\n\nBe advised that\
    \ mixing HTML and JS code is not a good idea, so to separate them we can move\
    \ the code to an external file, and include it by setting source attribute `src`\
    \ on `script` tag, e.g.:\n\n```\n<script src=\"js/app.js\"></script>\n```\n\n\
    The closing `</script>` tag is mandatory even with an empty element like we have\
    \ where we include the external source. `Type` and `language` attributes over\
    \ the years became optional in modern browsers due to the overwhelming JavaScript\
    \ dominance.\n\nOther ways to run JavaScript include:\n\n*   Inline approach already\
    \ covered above\n*   WebKit browser Developer Tools and FireBug consoles\n*  \
    \ The interactive Node.js shell\n\nOne of the advantages of the JavaScript language\
    \ is that it’s loosely typed. This loose/weak typing, as opposed to [strong typing](http://en.wikipedia.org/wiki/Strong_typing)\
    \ in languages like C and Java, makes JavaScript a better programming language\
    \ for prototyping. Here are some of the main types of JavaScript objects/classes\
    \ (there are not classes per se; objects inherit from objects):\n\n**Number primitives**\n\
    \nNumerical values, e.g.:\n\n```\nvar num = 1;\n```\n\n**Number Object**\n\n[Number](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Number)\
    \ object and its methods, e.g.:\n"
