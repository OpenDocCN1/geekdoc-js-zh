    ## 8 BONUS: Webapplog Articles\n\n**Summary**: articles on the essence of asynchronocity\
    \ in Node.js, TDD with Mocha; introduction to Express.js, Monk, Wintersmith, Derby\
    \ frameworks/libraries.\n\n> *“Don’t worry about failure; you only have to be\
    \ right once.”* — [Drew Houston](http://en.wikipedia.org/wiki/Drew_Houston)\n\n\
    For your convenience we included some of the Node.js posts from [Webapplog.com](http://webapplog.com)\
    \ — a publicly accessible blog about web development — in this chapter.\n\n###\
    \ 8.1 Asynchronicity in Node\n\n#### 8.1.1 Non-Blocking I/O\n\nOne of the biggest\
    \ advantages of using Node.js over Python or Ruby is that Node has a non-blocking\
    \ I/O mechanism. To illustrate this, let me use an example of a line in a Starbucks\
    \ coffeeshop. Let’s pretend that each person standing in line for a drink is a\
    \ task, and everything behind the counter — cashier, register, barista — is a\
    \ server or server application. Whether we order a cup of regular drip coffee,\
    \ like Pike Place, or hot tea, like Earl Grey, the barista makes it. The whole\
    \ line waits while that drink is made, and each person is charged the appropriate\
    \ amount.\n\nOf course, we know the aforementioned drinks (a.k.a., time-consuming\
    \ bottlenecks) are easy to make; just pour the liquid and it’s done. But what\
    \ about those fancy choco-mocha-frappe-latte-soy-decafs? What if everybody in\
    \ line decides to order these time-consuming drinks? The line will be held up,\
    \ and in turn, grow longer and longer. The manager of the coffeeshop will have\
    \ to add more registers and put more baristas to work (or even stand behind the\
    \ register him/herself).\n\nThis is not good, right? But this is how virtually\
    \ all server-side technologies work, except Node.js, which is like a real Starbucks.\
    \ When you order something, the barista yells the order to the other employee,\
    \ and you leave the register. Another person gives their order while you wait\
    \ for your state-of-the-art eye-opener in a paper cup. The line moves, the processes\
    \ are executed asynchronously and without blocking the queue.\n\nThis is why Node.js\
    \ blows everything else away (except maybe low-level C++) in terms of performance\
    \ and scalability. With Node.js, you just don’t need that many CPUs and servers\
    \ to handle the load.\n\n#### 8.1.2 Asynchronous Way of Coding"
