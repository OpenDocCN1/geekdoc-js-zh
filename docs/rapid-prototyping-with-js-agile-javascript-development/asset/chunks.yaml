    \    console.log('error');\n31       }\n32     });\n33\n```\n\n"
- fmt: "\n### 3.10 Deployment to Windows Azure\n\nYou should be able to deploy to\
    \ Windows Azure with Git.\n\n1. Go to the Windows Azure Portal at `[https://windows.azure.com/](https://windows.azure.com/),\
    \ log in with your Live ID and create a Web Site if you haven’t done so already.\
    \ Enable “Set up Git publishing” by providing a username and password (they should\
    \ be different from your Live ID credentials). Copy your URL somewhere.\n\n2.\
    \ Create a local Git repository in the project folder which you would like to\
    \ publish or deploy:\n\n```\n1  $ git init\n```\n\n3. Add all of the files to\
    \ the repository and start tracking them:\n\n```\n1  $ git add .\n```\n\n4. Make\
    \ the first commit:\n\n```\n1  $ git commit -am \"initial commit\"\n```\n\n5.\
    \ Add Windows Azure as a remote Git repository destination:\n\n```\n1  $ git remote\
    \ add azure your-url-for-remote-repository\n```\n\nIn my case, this command looked\
    \ like this:\n\n```\n1  $ git remote add \n```\n\n```\n1  > azure https://azatazure@azat.scm.azurewebsites.net/azat.git\n\
    ```\n\n6. Push your local Git repository to the remote Windows Azure repository,\
    \ which will deploy the files and application:\n\n```\n1  $ git push azure master\n\
    ```\n\nAs with GitHub, there is no need to repeat the first few steps when you\
    \ have updated the files later, since we already should have a local Git repository\
    \ in the form of `.git` folder in the root of the project folder.\n\n### 3.11\
    \ Deployment to Heroku\n\nThe only major difference is that Heroku uses Cedar\
    \ Stack, which doesn’t support static projects, a.k.a. plain HTML applications\
    \ like our Parse.com test application or Parse.com version of the Chat application.\
    \ We can use a “fake” PHP project to get past this limitation. Create a file `index.php`\
    \ on the same level as `index.html` in the project folder, which you would like\
    \ to publish/deploy to Heroku with the following content:\n\n```\n1 <?php echo\
    \ file_get_contents('index.html'); ?>\n```\n\nFor your convenience, the `index.php`\
    \ file is already included in `rpjs/rest`.\n\nThere is an even simpler way to\
    \ publish static files on Heroku with Cedar stack which is described in the post\
    \ `[Static Sites on Heroku Cedar](http://kennethreitz.com/static-sites-on-heroku-cedar.html)`.\
    \ In order to make Cedar Stack work with your static files, all you need to do\
    \ is to type and execute following commands in your project folder:\n\n```\n1\
    \ $ touch index.php\n2 $ echo 'php_flag engine off' > .htaccess\n```\n\nAlternatively,\
    \ you could use the Ruby Bamboo stack. In this case, we would need the following\
    \ structure:\n\n```\n1 -project folder\n2   -config.ru\n3   /public\n4     -index.html\n\
    5     -/css\n6     app.js\n7     ...\n```\n\nThe path in `index.html` to CSS and\
    \ other assets should be relative, i.e., ‘css/style.css’. The `config.ru` file\
    \ should contain the following code:\n\n```\n 1 use Rack::Static, \n 2   :urls\
    \ => [\"/stylesheets\", \"/images\"],\n 3   :root => \"public\"\n 4 \n 5 run lambda\
    \ { |env|\n 6   [\n 7     200, \n 8     {\n 9       'Content-Type'  => 'text/html',\
    \ \n10       'Cache-Control' => 'public, max-age=86400' \n11     },\n12     File.open('public/index.html',\
    \ File::RDONLY)\n13   ]\n14 }\n```\n\nFor more details, you could refer to `[devcenter.heroku.com/articles/static-sites-on-heroku](https://devcenter.heroku.com/articles/static-sites-on-heroku)`.\n\
    \nOnce you have all of the support files for Cedar stack, or Bamboo, follow these\
    \ steps:\n\n1. Create a local Git repository and `.git` folder if you haven’t\
    \ done so already:\n\n```\n1  $ git init\n```\n\n2. Add files:\n\n```\n1  $ git\
    \ add .\n```\n\n3. Commit files and changes:\n\n```\n1  $ git commit -m \"my first\
    \ commit\"\n```\n\n4. Create the Heroku Cedar stack application and add the remote\
    \ destination:\n\n```\n1  $ heroku create\n```\n\nIf everything went well, it\
    \ should tell you that the remote has been added and the app has been created,\
    \ and give you the app name.\n\n5. To look up the remote type and execute (optional):\n\
    \n```\n1  $ git remote show\n```\n\n6. Deploy the code to Heroku with:\n\n```\n\
    1  $ git push heroku master\n```\n\nTerminal logs should tell you whether or not\
    \ the deployment went smoothly.\n\n7. To open the app in your default browser,\
    \ type:\n\n```\n1  $ heroku open\n```\n\nor just go to the URL of your app, something\
    \ like “http://yourappname-NNNN.herokuapp.com”.\n\n8. To look at the Heroku logs\
    \ for this app, type:\n\n```\n1  $ heroku logs\n```\n\nTo update the app, repeat\
    \ the following steps:\n\n```\n1 git add -A\n2 git commit -m \"update\"\n3 git\
    \ push heroku master\n```\n\n## 4 Intro to.js\n\n### 3.12 Updating and Deleting\n\
    \nSummary: We’re going to build a typical application using Backbone.js and Model-View-Controller\
    \ (MVC) architecture.\n\nA full source code for the “Hello World” is available\
    \ at `[github.com/azat-co/rpjs/backbone-world](https://github.com/azat-co/rpjs/backbone-world)`.\n\
    \n#### 4.1 Dependencies\n\nDownload the following libraries:\n\n* [`jQuery 1.9](http://code.jquery.com/jquery-1.9.0/)\n\
    * [`Underscore.js](http://underscorejs.org/)\n* [`Backbone.js](http://backbonejs.org/)\n\
    \nAnd include these frameworks in the `index.html` file like this:\n\n```\n 1\
    \ <!DOCTYPE html>\n 2 <html>\n 3 <head>\n 4   <script src=\"jquery.js\"></script>\n\
    \ 5   <script src=\"underscore.js\"></script>\n 6   <script src=\"backbone.js\"\
    ></script>\n 7 \n 8   <script>\n 9     //TODO write some JS code!\n10   </script>\n\
    \ 11 \n12 </head>\n13 <body>\n14 </body>\n15 </html>\n```\n\n### 4.1 Setting up\
    \ Backbone.js from Scratch\n\nLet’s define a simple Backbone.js Router inside\
    \ of a `<script>` tag:\n\n```\n1   ...\n2   var router = Backbone.Router.extend({\n\
    3   });\n4   ...\n```\n\nThen set up a special `routes` property inside of an\
    \ `extend` call:\n\n```\n1   var router = Backbone.Router.extend({\n2     routes:\
    \ {\n3     }\n4   });\n```\n\nThe Backbone.js `routes` property needs to be in\
    \ the following format: `'path/:param':'action'` which will result in the `filename#path/param`\
    \ URL triggering a function named **action** (defined in the Router object). For\
    \ now, we’ll add a single **home** route:\n\n```\n1   var router = Backbone.Router.extend({\n\
    2     routes: {\n3       '': 'home'\n4     }\n5   });\n```\n\nThis is good, but\
    \ now we need to add a **home** function:\n"
