    \ 购买。\n\n此版本发布于 2014-05-28。\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * * * *\n\
    \n这是一本 [Leanpub](http://leanpub.com) 书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社赋能。[精益出版](http://leanpub.com/manifesto)是指使用轻量工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦后后建立影响力。\n\
