    \ versions of the Chat app:\n\n* `jQuery` + `Parse.com` JS REST API\n* `Backbone`\
    \ and `Parse.com` JS SDK\n* `Backbone` and `Node.js`\n* `Backbone` and `Node.js`\
    \ + `MongoDB`\n\nThe Chat application has all the foundation of a typical web/mobile\
