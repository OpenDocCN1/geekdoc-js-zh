    \ can be used in any web, and desktop, applications for data storage (and more),\
    \ thus making it ideal for rapid prototyping.\n\nGo to `Parse.com` and sign up\
    \ for a free account. Create an application, and copy the Application ID, JavaScript\
    \ Key. We’ll need these keys to access our collection. Please note the “Data”\
    \ tab – that’s where you can see collections and items.\n\nHere is the structure\
    \ of our project:\n\n```\n/parse\n-index.html\n-app.js\n```\n\nThe sample is available\
