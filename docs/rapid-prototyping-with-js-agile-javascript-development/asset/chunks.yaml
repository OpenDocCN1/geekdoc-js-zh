    \ Deploying Chat to PaaS\n\nOnce you are comfortable that your front-end application\
    \ works well locally, with or without a local HTTP server like MAMP or XAMPP,\
    \ deploy it to Windows Azure or Heroku. In-depth deployment instructions are described\
    \ in the *jQuery and Parse.com* chapter.\n\n### 5.3 Enhancing Chat\n\nIn the last\
    \ two examples, Chat had very basic functionality. You could enhance the application\
    \ by adding more features.\n\nAdditional features for **intermediate** level developers:\n\
    \n*   Sort the list of messages through the *updateAt* attribute before displaying\
    \ it\n\n*   Add a “Refresh” button to update the list of messages\n\n*   Save\
    \ the username after the first message entry in a run-time memory or in a session\n\
    \n*   Add an up-vote button next to each message, and store the votes\n\n*   Add\
    \ a down-vote button next to each message, and store the votes\n\nAdditional features\
    \ for **advanced** level developers:\n\n*   Add a User collection\n\n*   Prevent\
    \ the same user from voting multiple times\n\n*   Add user sign-up and log-in\
    \ actions by using Parse.com functions\n\n*   Add a *Delete Message* button next\
    \ to each message created by a user\n\n*   Add an *Edit Message* button next to\
    \ each message created by a user\n\n# III Back-End Prototyping\n\n## 6 Node.js\
    \ and MongoDB\n\n**Summary**: exhibition of the “Hello World” application in Node.js,\
    \ list of some of its the most important core modules, NPM workflow, detailed\
    \ commands for deployment of Node.js apps to Heroku and Windows Azure; MongoDB\
    \ and its shell, run-time and database Chat applications; example of a test-driven\
    \ development practice.\n\n> *“Any fool can write code that a computer can understand.\
    \ Good programmers write code that humans can understand.”* — [Martin Fowler](http://en.wikipedia.org/wiki/Martin_Fowler)\n\
    \n### 6.1 Node.js\n\n#### 6.1.1 Building “Hello World” in Node.js\n\nTo check\
    \ if you have Node.js installed on your computer, type and execute this command\
    \ in your terminal:\n\n```\n1 $ node -v\n```\n\nAs of this writing, the latest\
    \ version is 0.8.1\\. If you don’t have Node.js installed, or if your version\
    \ is behind, you can download the latest version at [nodejs.org/#download](http://nodejs.org/#download).\n\
    \nAs usual, you could copy example code from [rpjs/hello](https://github.com/azat-co/rpjs/tree/master/hello)\
    \ or write your own program from scratch. If you wish to do the latter, create\
    \ a folder **hello** for your “Hello World” Node.js application. Then create file\
    \ a **server.js** and line by line type the code below.\n\nThis will load the\
    \ core **http** module for the server (more on the modules later):\n\n```\n1 var\
    \ http = require('http'); \n```\n\nWe’ll need a port number for our Node.js server.\
    \ To get it from the environment, or assign 1337 if the environment is not set,\
    \ use:\n\n```\n1 var port = process.env.PORT || 1337;\n```\n\nThis will create\
    \ a server and a call-back function will contain the response handler code:\n\n\
    ```\n1 var server = http.createServer(function (req, res) { \n```\n\nTo set the\
    \ right header and status code, use:\n\n```\n1   res.writeHead(200, {'Content-Type':\
    \ 'text/plain'}); \n```\n\nTo output “Hello World” with the line end symbol, use:\n\
    \n```\n1   res.end('Hello World\\n');  \n2 });\n```\n\nTo set a port and display\
    \ the address of the server and the port number, use:\n\n```\n1 server.listen(port,\
    \ function() {\n2   console.log('Server is running at %s:%s ', \n3     server.address().address,\
    \ server.address().port); \n4 });\n```\n\nFrom the folder in which you have *server.js*,\
    \ launch in your terminal the following command:\n\n```\n1 $ node server.js \n\
    ```\n\nOpen [localhost:1337](http://localhost:1337/) or [127.0.0.1:1337](http://127.0.0.1:1337/)\
    \ or any other address you see in the terminal as a result of `console.log()`\
    \ function, and you should see “Hello World” in a browser. To shut down the server,\
    \ press Control + C.\n\n| ![information](images/leanpub_information.png) |  \n\
    \n### Note\n\nThe name of the main file could be different from server.js, e.g.,\
    \ index.js or app.js. In case you need to launch the **app.js** file, just use\
    \ `$ node app.js`. |\n\n#### 6.1.2 Node.js Core Modules\n\nUnlike other programming\
    \ technologies, Node.js doesn’t come with a heavy standard library. The core modules\
    \ of node.js are a bare minimum and the rest can be cherry-picked via the Node\
    \ Package Manager (NPM) registry. The main core modules, classes, methods and\
    \ events include:\n\n*   [http](http://nodejs.org/api/http.html#http_http)\n\n\
    *   [util](http://nodejs.org/api/util.html)\n\n*   [querystring](http://nodejs.org/api/querystring.html)\n\
    \n*   [url](http://nodejs.org/api/url.html)\n\n*   [fs](http://nodejs.org/api/fs.html)\n\
    \n**[http](http://nodejs.org/api/http.html#http_http)**\n\nThis is the main module\
    \ responsible for Node.js HTTP server. Here are the main methods:\n\n*   `http.createServer()`:\
    \ returns a new web server object"
