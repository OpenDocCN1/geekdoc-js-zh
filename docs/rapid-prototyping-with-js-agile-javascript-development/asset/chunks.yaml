    \n#### 6.1.3 Node Package Manager\n\nNode Package Manager, or NPM, manages dependencies\
    \ and installs modules for you. Node.js installation comes with NPM, whose website\
    \ is [npmjs.org](http://npmjs.org/).\n\n**package.json** contains meta information\
    \ about our Node.js application such as a version number, author name and, most\
    \ importantly, what dependencies we use in the application. All of that information\
    \ is in the JSON formatted object, which is read by NPM.\n\nIf you would like\
    \ to install packages and dependencies specified in **package.json**, type:\n\n\
    ```\n1 $ npm install \n```\n\nA typical **package.json** file might look like\
    \ this:\n\n```\n 1 {\n 2    \"name\": \"Blerg\",\n 3    \"description\": \"Blerg\
    \ blerg blerg.\",\n 4    \"version\": \"0.0.1\",\n 5    \"author\": {\n 6    \
    \   \"name\" : \"John Doe\", \n 7       \"email\" : \"john.doe@gmail.com\"\n 8\
    \    },\n 9    \"repository\": {\n10        \"type\": \"git\",\n11        \"url\"\
    : \"http://github.com/johndoe/blerg.git\"\n12    },\n13    \"engines\": [\n14\
    \        \"node >= 0.6.2\"\n15    ],\n16    \"license\" : \"MIT\",\n17    \"dependencies\"\
    : {\n18        \"express\": \">= 2.5.6\",\n19        \"mustache\": \"0.4.0\",\n\
    20        \"commander\": \"0.5.2\"\n21    },\n22    \"bin\" : {\n23        \"\
    blerg\" : \"./cli.js\"\n24    }\n25 }\n```\n\nTo update a package to its current\
    \ latest version, or the latest version that is allowable by the version specification\
    \ defined in **package.json**, use:\n\n```\n1 $ npm update name-of-the-package\n\
    ```\n\nOr for single module installation:\n\n```\n1 $ npm install name-of-the-package\n\
    ```\n\nThe only module used in the examples — and which does not belong to the\
    \ core Node.js package — is **mongodb**. We’ll install it later in the book.\n\
    \nHeroku will need *package.json* to run NPM on the server.\n\nFor more information\
    \ on NPM, take a look at the article [Tour of NPM](http://tobyho.com/2012/02/09/tour-of-npm/).\n\
    \n#### 6.1.4 Deploying “Hello World” to PaaS\n\nFor Heroku and Windows Azure deployment,\
    \ we’ll need a Git repository. To create it from the root of your project, type\
    \ the following command in your terminal:\n\n```\n1 $ git init\n```\n\nGit will\
    \ create a hidden **.git** folder. Now we can add files and make the first commit:\n\
    \n```\n1 $ git add .\n2 $ git commit -am \"first commit\"\n```\n\n| ![tip](images/leanpub_tip.png)\
    \ |  \n\n### Tip\n\nTo view hidden files on the Mac OS X Finder app, execute this\
    \ command in a terminal window: `defaults write com.apple.finder AppleShowAllFiles\
    \ -bool true`. To change the flag back to hidden: `defaults write com.apple.finder\
    \ AppleShowAllFiles -bool false`. |\n\n#### 6.1.5 Deploying to Windows Azure\n\
    \nIn order to deploy our “Hello World” application to Windows Azure, we must add\
    \ Git **remote**. You could copy the URL from Windows Azure Portal, under Web\
    \ Site, and use it with this command:\n\n```\n1 $ git remote add azure yourURL\n\
    ```\n\nNow we should be able to make a push with this command:\n\n```\n1 $ git\
    \ push azure master\n```\n\nIf everything went okay, you should see success logs\
    \ in the terminal and “Hello World” in the browser of your Windows Azure Web Site\
    \ URL.\n\nTo push changes, just execute:\n\n```\n1 $ git add .\n2 $ git commit\
    \ -m \"changing to hello azure\"\n3 $ git push azure master\n```\n\nA more meticulous\
    \ guide can be found in the tutorial [Build and deploy a Node.js web site to Windows\
    \ Azure](http://www.windowsazure.com/en-us/develop/nodejs/tutorials/create-a-website-(mac)/).\n\
    \n#### 6.1.6 Deploying to Heroku\n\nFor Heroku deployment, we need to create 2\
    \ extra files: **Procfile** and **package.json**. You could get the source code\
    \ from [rpjs/hello](https://github.com/azat-co/rpjs/tree/master/hello) or write\
    \ your own one.\n\nThe structure of the “Hello World” application looks like this:\n\
    \n```\n1 /hello\n2   -package.json\n3   -Procfile\n4   -server.js\n```\n\nProcfile\
    \ is a mechanism for declaring what commands are run by your application’s dynos\
    \ on the Heroku platform. Basically, it tells Heroku what processes to run. Procfile\
    \ has only one line in this case:\n\n```\n1 web: node server.js\n```\n\nFor this\
    \ example, we keep **package.json** simple:\n\n```\n1 {\n2   \"name\": \"node-example\"\
    ,\n3   \"version\": \"0.0.1\",\n4   \"dependencies\": {\n5   },\n6   \"engines\"\
    : {\n7     \"node\": \">=0.6.x\"\n8   }\n9 }\n```\n\nAfter we have all of the\
    \ files in the project folder, we can use Git to deploy the application. The commands\
    \ are pretty much the same as with Windows Azure except that we need to add Git\
    \ remote, and create Cedar stack with:\n\n```\n1 $ heroku create\n```\n\nAfter\
    \ it’s done, we push and update with:\n\n```\n1 $ git push heroku master\n2 $\
    \ git add .\n3 $ git commit -am \"changes\"\n4 $ git push heroku master\n```\n\
    \nIf everything went okay, you should see success logs in the terminal and “Hello\
    \ World” in the browser of your Heroku app URL.\n\n### 6.2 Chat: Run-Time Memory\
    \ Version\n\nThe first version of the Chat back-end application will store messages\
    \ only in run-time memory storage for the sake of [KISS](http://en.wikipedia.org/wiki/KISS_principle).\
    \ That means that each time we start/reset the server, the data will be lost.\n\
    \nWe’ll start with a simple test case first to illustrate the Test-Driven Development\
    \ approach. The full code is available under the [rpjs/test](https://github.com/azat-co/rpjs/tree/master/test)\
    \ folder.\n\n### 6.3 Test Case for Chat\n\nWe should have two methods:\n\n1. \
    \ Get all of the messages as an array of JSON objects for the GET `/message` endpoint\
    \ using the `getMessages()` method"
