    \n### 字符串对象\n\n字符串对象有很多用的方法，如 `length`、`match` 等，例如：\n\n```\n1 var strObj = new\
    \ String(\"abcde\");//String object\n2 var str = strObj.valueOf(); //string primitive\n\
    3 strObj.match(/ab/);\n4 str.match(/ab/); // 两种调用都会生效\n```\n\n### 正则表达式对象\n\n\
    正则表达式（`RegExps`）是用于字符串查找匹配、替换、测试的字符模式：\n\n```\n1 var pattern = /[A-Z]+/;\n2 str.match(/ab/);\
    \ \n```\n\n### 特殊类型\n\n当你对其有疑问时，可以随时调用 `typeof obj`。这里是 JS 中用到的一些特殊类型：\n\n* `NaN`\n\
    * `null`\n* `undefined`\n* `function`\n\n### 全局变量\n\n你可以在代码的任何地方调用这些方法，因为它们是全局方法：\n\
    \n* `decodeURI`\n* `decodeURIComponent`\n* `encodeURI`\n* `encodeURIComponent`\n\
    * `eval`\n* `isFinite`\n* `isNaN`\n* `parseFloat`\n* `parseInt`\n* `uneval`\n\
    * `Infinity`\n* `Intl`\n\n### JSON\n\n`JSON` 库允许我们解析和序列化 JavaScript 对象，例如：\n\n\
    ```\n1 var obj = JSON.parse('{a:1, b:\"hi\"}');\n2 var stringObj = JSON.stringify({a:1,b:\"\
    hi\"});\n```\n\n### 数组对象\n\n[数组](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array)是基于零索引的列表。例如，创建一个数组：\n\
    \n```\n1 var arr = new Array();\n2 var arr = [\"apple\", \"orange\", 'kiwi\"];\n\
    ```\n\n`Array` 对象有很多很好的方法，如 `indexOf`、`slice`、`join`。确保你熟悉它们，因为如果用得当，它们将节省大量时间。\n\
    \n### 数据对象\n\n```\n1 var obj = {name: \"Gala\", url:\"img/gala100x100.jpg\",price:129}\n\
    ```\n\n或者\n\n```\n1 var obj = new Object();\n```\n\n更多关于继承模式请见下方。\n\n### 布尔值原始类型和对象\n\
    \n与 String 和 Number 相同，[Boolean](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Boolean)既可以是原始类型也可以是对象。\n\
    \n```\n1 var bool1 = true;\n2 var bool2 = false;\n3 var boolObj = new Boolean(false);\n\
    ```\n\n### Date 对象\n\n[Date](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Date)\
    \ 对象允许我们处理日期和时间，例如：\n\n```\n1 var timestamp = Date.now(); // 1368407802561\n2\
    \ var d = new Date(); //Sun May 12 2013 18:17:11 GMT-0700 (PDT)\n```\n\n### Math\
    \ 对象\n\n数学常量和[函数](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Math)，例如：\n\
    \n```\n1 var x = Math.floor(3.4890);\n2 var ran = Math.round(Math.random()*100);\n\
    ```\n\n### 浏览器对象\n\n让我们访问浏览器及其属性（如 URL），例如：\n\n```\n1 window.location.href = 'http://rapidprototypingwithjs.com';\n\
    2 console.log(\"test\");\n```\n\n### DOM 对象\n\n```\n1 document.write(\"Hello World\"\
    );\n2 var table = document.createElement('table');\n3 var main = document.getElementById('main');\n\
    ```\n\n| ![warning](img/leanpub_warning.png) |  \n\n### 警告\n\nJavaScript 支持的数字最大为\
    \ 53 位。如果你需要处理大于该范围的数字，请查看大数库。 |\n\nJavaScript 和 DOM 对象的完整参考可以在 [Mozilla Developer\
    \ Network](https://developer.mozilla.org/en-US/docs/JavaScript/Reference) 和 [w3school](http://www.w3schools.com/jsref/default.asp)。\n\
    \n关于 JS 资源（如 ECMA 规范），请查看此列表 [JavaScript 语言资源](https://developer.mozilla.org/en-US/docs/JavaScript/Language_Resources)。截至本文编写，最新的\
    \ JavaScript 规范是 ECMA-262 第 5.1 版：[PDF](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)\
