- fmt: "\nYou can download the Backbone.js library at [backbonejs.org](http://backbonejs.org).\
    \ Then, after you included it just like any other JavaScript file in the head\
    \ (or body) of your main HTML file, you’ll be able to access the `Backbone` class.\
    \ For example, to create the router:\n\n```javascript\n var ApplicationRouter\
    \ = Backbone.Router.extend({\n  routes: {\n    \"\": \"home\",\n    \"signup\"\
    : \"signup\",\n    \"*actions\": \"home\"\n  },\n  initialize: function() {\n\
    \    this.headerView = new HeaderView();\n    this.headerView.render();\n    this.footerView\
    \ = new FooterView();\n    this.footerView.render();\n  },\n  home: function()\
    \ {\n    this.homeView = new HomeView();\n    this.homeView.render();\n  },\n\
    \  signup: function() {\n    ...\n  }\n});\n```\n\nView, Models and Collections\
    \ are created the same way:\n\n```javascript\n HeaderView = Backbone.View.extend({\n\
    \  el: \"#header\",\n  template: '<div>...</div>',\n  events: {\n    \"click #save\"\
    : \"saveMessage\"\n  },\n  initialize: function() {\n    this.collection = new\
    \ Collection();\n    this.collection.bind(\"update\", this.render, this);\n  },\n\
    \  saveMessage: functiton() {\n    ...\n  },\n  render: function() {\n    $(this.el).html(_.template(this.template));\n\
    \  }\n}); \n\nModel = Backbone.Model.extend({\n  url: \"/api/item\"\n  ...\n});\
    \ \n\nCollection = Backbone.Collection.extend({\n  ...\n});\n```\n\nFor a more\
    \ details on Backbone.js, please refer to the *Intro to Backbone.js* chapter.\n\
    \n## 5.1 Chat with Parse.com: JavaScript SDK and Backbone.js version\n\nIt’s easy\
    \ to see that if we keep adding more and more buttons like “DELETE”, “UPDATE”\
    \ and other functionalities, our system of asynchronous callback will grow more\
    \ complicated. And we’ll have to know when to update the view, i.e., the list\
    \ of messages, based on whether or not there were changes to the data. The Backbone.js\
    \ Model-View-Controller (MVC) framework can be used to make complex applications\
    \ more manageable and easier to maintain.\n\nIf you felt comfortable with the\
    \ previous example, let’s build upon it with the use of the Backbone.js framework.\
    \ Here we’ll go step by step, creating a Chat application using Backbone.js and\
    \ Parse.com JavaScript SDK. If you feel familiar enough with it, you could download\
    \ the Super Simple Backbone Starter Kit at [github.com/azat-co/super-simple-backbone-starter-kit](http://github.com/azat-co/super-simple-backbone-starter-kit).\
    \ Integration with Backbone.js will allow for a straightforward implementation\
    \ of user actions by binding them to asynchronous updates of the collection.\n\
    \nThe application is available under [rpjs/sdk](https://github.com/azat-co/rpjs/tree/master/sdk),\
    \ but again you are encouraged to start from scratch and try to write your own\
    \ code using the example only as a reference.\n\nHere is the structure of Chat\
    \ with Parse.com, JavaScript SDK and Backbone.js version:\n\n```\n /sdk\n  -index.html\n\
    \  -home.html\n  -footer.html\n  -header.html\n  -app.js\n  /css\n    -bootstrap-responsive.css\n\
    \    -bootstrap-responsive.min.css\n    -bootstrap.css\n    -bootstrap.min.css\n\
    \  /img\n    -glyphicons-halflings-white.png\n    -glyphicons-halflings.png\n\
    \  /js\n    -bootstrap.js\n    -bootstrap.min.js\n  /libs\n    -require.min.js\n\
    \    -text.js\n```\n\nCreate a folder; in the folder create an `index.html` file\
    \ with the following content skeleton:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n  <head>\n  ...\n  </head>\n  <body>\n  ...\n  </body>\n</html>\n```\n\n\
    Download the necessary libraries or hot-link them from Google API. Now include\
    \ JavaScript libraries and Twitter Bootstrap stylesheets into the head element\
    \ along with other important but not required `meta` elements.\n\n```html\n<head>\n\
    \  <meta charset=\"utf-8\" />\n  <title></title>\n  <meta name=\"description\"\
    \ content=\"\" />\n  <meta=\"author\" content=\"\" />\n```\n\nWe need this for\
    \ responsive behavior:\n\n```html\n  <meta name=\"viewport\" \n    content=\"\
    width=device-width, initial-scale=1.0\" />\n```\n\nHot-linked jQuery from Google\
    \ API:\n\n```html\n  <script type=\"text/javascript\" \t  \nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    >\n</script>\n```\n\nNice to have Twitter Bootstrap plug-ins:\n\n```html\n  <script\
    \ type=\"text/javascript\" src=\"js/bootstrap.min.js\"></script>\n```\n\nParse\
    \ JavaScript SDK is hot-linked from Parse.com:\n\n```html\n  <script type=\"text/javascript\"\
    \ \n    src=\"http://www.parse.com/js-1.0.5.min.js\">\n</script>\n```\n\nTwitter\
    \ Bootstrap CSS:\n\n```html\n  <link type=\"css\" \n    rel=\"stylesheet\" \n\
    \    href=\"css/bootstrap.css\" />\n  <link type=\"css\" \n    rel=\"stylesheet\"\
    \ \n    href=\"css/bootstrap-responsive.css\" />\n```\n\nOur JS inclusion:\n\n\
    ```html\n  <script type=\"text/javascript\" src=\"app.js\"></script>\n</head>\n\
    ```\n\nPopulate the `body` element with Twitter Bootstrap scaffolding (more about\
    \ it in the *Basics* chapter):\n\n```html\n<body>\n  <div class=\"container-fluid\"\
    >\n    <div class=\"row-fluid\">\n      <div class=\"span12\">\n        <div id=\"\
    header\">\n        </div>\n    </div>\n    <div class=\"row-fluid\">\n      <div\
    \ class=\"span12\">\n        <div id=\"content\">\n        </div>\n    </div>\n\
    \    <div class=\"row-fluid\">\n      <div class=\"span12\">\n        <div id=\"\
    footer\">\n        </div>\n    </div>\n  </div>\n</body>\n```\n\nCreate an `app.js`\
    \ file and put Backbone.js views inside:\n\n- `headerView`: menu and common information\n\
    - `footerView`: copyrights and links\n- `homeView`: page content\n\nWe use `Require.js`\
    \ syntax and shim plugin for HTML templates:\n\n```javascript\nrequire([\n  'libs/text!header.html',\
    \ \n  'libs/text!home.html', \n  'libs/text!footer.html'\n], function (\n  headerTpl,\
    \ \n  homeTpl, \n  footerTpl) { \n```\n\nThe application router with a single\
    \ index route:\n\n```javascript\nvar ApplicationRouter = Backbone.Router.extend({\n\
    \  routes: {\n    \"\": \"home\",\n    \"*actions\": \"home\"\n  },\n```\n\nBefore\
    \ we do anything else, we can initialize views which are going to be used across\
    \ the app:\n\n```javascript\n  initialize: function() {\n    this.headerView =\
    \ new HeaderView();\n    this.headerView.render();\n    this.footerView = new\
    \ FooterView();\n    this.footerView.render();\n  },\n```\n\nThis code takes care\
    \ of the home route:\n\n```javascript\n    home: function() {\n      this.homeView\
    \ = new HomeView();\n      this.homeView.render();\n  }\n});\n```\n\nThe header\
    \ Backbone View is attached to the `#header` element and uses the `headerTpl`\
    \ template:\n\n```javascript\n  HeaderView = Backbone.View.extend({\n    el: \"\
    #header\",\n    templateFileName: \"header.html\",\n    template: headerTpl, \
    \ \n    initialize: function() {\n    },\n    render: function() {\n      console.log(this.template)\n\
    \      $(this.el).html(_.template(this.template));\n    }\n  });\n```\n\nTo render\
    \ the HTML, we use the `jQuery.html()` function:\n\n```javascript\n  FooterView\
    \ = Backbone.View.extend({\n    el: \"#footer\",\n    template: footerTpl,\n \
    \   render: function() {\n      this.$el.html(_.template(this.template));\n  \
    \  }\n  });\n```\n\nThe home Backbone View definition uses the `#content` DOM\
    \ element:\n\n```javascript\n  HomeView = Backbone.View.extend({\n    el: \"#content\"\
    ,\n    // template: \"home.html\",\n    template: homeTpl,\n    initialize: function()\
    \ {\n    },\n    render: function() {\n      $(this.el).html(_.template(this.template));\n\
    \    }\n  });\n```\n\nTo start an app, we create a new instance and call `Backbone.history.start()`:\n\
    \n```javascript\n  app = new ApplicationRouter();\n  Backbone.history.start();\
    \ \n});\n```\n\nThe full code of the **app.js** file:\n"
