- fmt: "\nLet’s add a `bust` parameter to our example. The `bust` argument will be\
    \ appended to the URL of each file preventing a browser from caching the files.\
    \ Perfect for development and terrible for production. :-)\n\nAdd this to the\
    \ `apple-app.js` file in front of everything else:\n\n```\n1 requirejs.config({\n\
    2   urlArgs: \"bust=\" +  (new Date()).getTime()\n3 }); \n4 require([\n5 ...\n\
    ```\n\n![Network Tab with bust parameter added](images/backbone-amd3.png)\n\n\
    Network Tab with bust parameter added\n\nPlease note that each file request now\
    \ has status 200 instead of 304 (not modified).\n\n### 4.7 Require.js for Production\n\
    \nWe’ll use the Node Package Manager (NPM) to install the `requirejs` library\
    \ (it’s not a typo; there’s no period in the name). In your project folder, run\
    \ this command in a terminal:\n\n```\n1 $ npm install requirejs\n```\n\nOr add\
    \ `-g` for global installation:\n\n```\n1 $ npm install -g requirejs\n```\n\n\
    Create a file `app.build.js`:\n\n```\n 1 ({\n 2     appDir: \"./js\",\n 3    \
    \ baseUrl: \"./\",\n 4     dir: \"build\",\n 5     modules: [\n 6         {\n\
    \ 7             name: \"apple-app\"\n 8         }\n 9     ]\n10 })\n```\n\nMove\
    \ the script files under the `js` folder (`appDir` property). The builded files\
    \ will be placed under the `build` folder (`dir` parameter). For more information\
    \ on the build file, check out this extensive example with comments: [https://github.com/jrburke/r.js/blob/master/example.build.js](https://github.com/jrburke/r.js/blob/master/example.build.js).\n\
    \nNow everything should be ready for building one gigantic JavaScript file, which\
    \ will have all of our dependencies/modules:\n\n```\n1 $ r.js -o app.build.js\n\
    ```\n\nor\n\n```\n1 $ node_modules/requirejs/bin/r.js -o app.build.js\n```\n\n\
    You should get a list of the `r.js` processed files.\n\n![A list of the r.js processed\
    \ files.](images/backbone-require.png)\n\nA list of the `r.js` processed files.\n\
    \nOpen `index.html` from the build folder in a browser window, and check if the\
    \ Network Tab shows any improvement now with just one request/file to load.\n\n\
    ![Performance improvement with one request/file to load.](images/backbone-require2.png)\n\
    \nPerformance improvement with one request/file to load.\n\nFor more information,\
    \ check out the official r.js documentation at [requirejs.org/docs/optimization.html](http://requirejs.org/docs/optimization.html).\n\
    \nThe example code is available under the [rpjs/backbone/r](https://github.com/azat-co/rpjs/tree/master/backbone/r)\
    \ and [rpjs/backbone/r/build](https://github.com/azat-co/rpjs/tree/master/backbone/r/build)\
    \ folders.\n\nFor uglification of JS files (decreases the files’ sizes), we can\
    \ use the [Uglify2](https://github.com/mishoo/UglifyJS2) module. To install it\
    \ with NPM, use:\n\n```\n1 $ npm install uglify-js\n```\n\nThen update the `app.build.js`\
    \ file with the `optimize: \"uglify2\"` property:\n\n```\n 1 ({\n 2     appDir:\
    \ \"./js\",\n 3     baseUrl: \"./\",\n 4     dir: \"build\",\n 5     optimize:\
    \ \"uglify2\",\n 6     modules: [\n 7         {\n 8             name: \"apple-app\"\
    \n 9         }\n10     ]\n11 })\n```\n\nRun `r.js` with:\n\n```\n1 $ node_modules/requirejs/bin/r.js\
