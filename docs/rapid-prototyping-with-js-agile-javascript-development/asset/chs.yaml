  \ IDE 首页。(images/screenshots----webstorm.png)\n\nWebStorm IDE 首页。\n\n### 2.1.4 版本控制系统\n\
  \n[版本控制系统](http://en.wikipedia.org/wiki/Revision_control)即使在单人开发的情况下也是必不可少的。此外，许多云服务（例如\
  \ Heroku）需要 Git 进行部署。我们也强烈建议习惯 Git 和 Git 终端命令，而不是使用图形界面的 Git 客户端/应用：[GitX](http://gitx.frim.nl/)、[Gitbox](http://www.gitboxapp.com/)\
  \ 或 [GitHub for Mac](http://mac.github.com/)。Subversion 是一种非分布式版本控制系统。这篇文章对比了 [Git\
  \ 与 Subversion](https://git.wiki.kernel.org/index.php/GitSvnComparison)。是在机器上安装和设置\
  \ Git 的步骤：\n\n1.  从 [`git-scm.com/downloads`](http://git-scm.com/downloads) 下载适用于你系统的最新版本![下载最新版本的\
  \ Git。(images/screenshots----git-install.png)\n\n    下载最新版本的 Git。\n\n2.  从下载的 `*.dmg`\
  \ 软件包安装 Git，即运行 `*.pkg` 文件并按照向导操作。\n\n\n\n\n\n3. 在 OS X 上，使用 `Command + Space`（又称为\
  \ Spotlight，请看下面的截图）查找终端应用程序。对于 Windows，你可以使用 [PuTTY](http://www.chiark.greenend.org.uk/~sgtatham/putty/)\
  \ 或 [Cygwin](http://www.cygwin.com/)。![使用 Spotlight 查找并运行应用程序。](img/screenshots----spotlight.png)\n\
  \n使用 Spotlight 查找并运行应用程序。\n\n4. 在你的终端中输入以下命令，将 `John Doe` 和 `johndoe@example.com`\
  \ 替换为你的名字和邮箱：\n\n```\n1  $ git config --global user.name \"John Doe\"\t\t\t\t\n\
  2  $ git config --global user.email johndoe@example.com \n```\n\n5. 要检查安装情况，运行命令：\n\
  \n```\n1  $ git version\n```\n\n6. 你应该在终端窗口中看到类似的内容（你的版本可能有所不同；在例子中是 1.8.3.2）：\n\
  \n```\n1  git version 1.8.3.2\n```\n\n![配置并测试 Git 安装。](img/screenshots----git-configure.png)\n\
  \n配置并测试 Git 安装。\n\n生成 SSH 密钥并上传到 SaaS/PaaS 网站将在稍后介绍。\n\n### 2.1.5 本地 HTTP 服务器\n\n\
  虽然可以在没有本地 HTTP 服务器的情况下完成大部分前端开发，但在通过 HTTP 请求/AJAX 调用加载文件时需要它。此外，通常情况下使用本地 HTTP 服务器是一个良好的习惯。这样，你的开发环境就可以尽可能接近生产环境。你可能想要考虑对\
