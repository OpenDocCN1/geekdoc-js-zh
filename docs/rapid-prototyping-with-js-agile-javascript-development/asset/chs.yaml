  4     }\n5   });\n```\n\n这样很好，但现在我们需要添加一个 **home** 函数：\n\n\n\n\n```\n1   var router\
  \ = Backbone.Router.extend({\n2     routes: {\n3       '': 'home'\n4     },\n5 \
  \    home: function(){\n6       //TODO render html\n7     }\n8   });\n```\n\n我们稍后会回到\
  \ `home` 函数来添加更多关于创建和渲染 View 的逻辑。现在，我们应该定义 `homeView`：\n\n```\n1   var homeView\
  \ = Backbone.View.extend({\n2   });\n```\n\n看起来很熟悉，对吧？Backbone.js 对所有组件都使用了类似的语法：`extend`\
  \ 函数以及一个 JSON 对象作为它的参数。\n\n从现在起有多种处理方法，但最佳实践是使用 `el` 和 `template` 属性，这两个属性在 Backbone.js\
  \ 中是“魔法”的，也就是说是特殊的：\n\n```\n1   var homeView = Backbone.View.extend({\n2     el:\
  \ 'body',\n3     template: _.template('Hello World')   \n4   });\n```\n\n属性 `el`\
  \ 只是一个包含 jQuery 选择器的字符串（你可以使用 `.` 配合类名或 `#` 配合 ID 名称）。\n\n`template` 属性被赋值了一个 Underscore.js\
  \ 的 `template` 函数，其内容只是纯文本“Hello World”。\n\n为了渲染我们的 `homeView`，我们使用 `this.$el`（这是一个指向\
  \ `el` 属性中元素的编译 jQuery 对象）以及 jQuery 的 `.html()` 函数将 HTML 替换为 `this.template()` 的值。这里是\
  \ Backbone.js View 的完整代码：\n\n```\n1   var homeView = Backbone.View.extend({\n2 \
  \    el: 'body',\n3     template: _.template('Hello World'),\n4     render: function(){\n\
  5       this.$el.html(this.template({}));\n6     }\n7   });\n```\n\n现在，如果回到 `router`，我们可以在\
  \ `home` 函数中添加这两行代码：\n\n```\n 1   var router = Backbone.Router.extend({\n 2    \
  \ routes: {\n 3       '': 'home'\n 4     },\n 5     initialize: function(){\n 6\
  \       \n 7     },\n 8     home: function(){\n 9       this.homeView = new homeView;\n\
  10       this.homeView.render();\n11     }\n12   });\n```\n\n第一行将创建 `homeView` 对象并将其赋值给路由器的\
  \ `homeView` 属性。第二行将调用 `homeView` 对象中的 `render()` 方法，触发“Hello World”的输出。\n\n最后，为了启动\
  \ Backbone 应用，我们在 `document-ready` 包装器内部调用 `new Router`，确保文件的 DOM 已完全加载：\n\n```\n\
  1 var app;\n2 $(document).ready(function(){\n3   app = new router;\n4   Backbone.history.start();\
  \      \n5 })\n```\n\n这是 `index.html` 文件的完整代码：\n\n```\n 1 <!DOCTYPE>\n 2 <html\n\
  \ 3 <head>\n 4   <script src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"\
  ></script>\n 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script>\n 9 \
  \    var app;\n10     var router = Backbone.Router.extend({\n11       routes: {\n\
  12         '': 'home'\n13       },\n14       initialize: function(){\n15       \
  \ //some code to execute\n16        //when the object is instantiated \n17     \
  \  },\n18       home: function(){\n19         this.homeView = new homeView;\n20\
  \         this.homeView.render();\n21       }\n22     });\n23 \n24     var homeView\
  \ = Backbone.View.extend({\n25       el: 'body',\n26       template: _.template('Hello\
  \ World'),\n27       render: function(){\n28         this.$el.html(this.template({}));\n\
  29       }\n30     });\n31 \n32     $(document).ready(function(){\n33       app\
  \ = new router;\n34       Backbone.history.start();      \n35     })\n36 \n37  \
  \ </script>\n38 </head>\n39 <body>\n40   <div></div>\n41 </body>\n42 </html>\n```\n\
  \n在浏览器中打开 `index.html` 查看其是否运行正常，即页面上应该出现“Hello World”消息。\n\n### 4.2 与集合（Collections）交互\n\
  \n此示例的完整源代码位于 [rpjs/backbone/collections](https://github.com/azat-co/rpjs/tree/master/backbone/collections)。它是基于**从零开始设置\
  \ Backbone.js 应用**练习中的“Hello World”示例构建的，该练习可以在 [rpjs/backbone/hello-world](https://github.com/azat-co/rpjs/tree/master/backbone/hello-world)\
  \ 下载。\n\n我们需要添加一些数据供玩玩，并填充我们的视图。为了做到这一点，请在 `script` 标签之后、其他代码之前添加以下内容：\n\n```\n\
  \ 1   var appleData = [\n 2     {\n 3       name: \"fuji\",\n 4       url: \"img/fuji.jpg\"\
  \n 5     },\n 6     {\n 7       name: \"gala\",\n 8       url: \"img/gala.jpg\"\n\
  \ 9     }\n10  ];\n```\n\n\n\n为了让包含 HTML 标签的 JavaScript 字符串更具读性，我们可以使用反斜杠换行转义符（`\\\
  `），或者关闭字符串并使用加号（`+`）拼接。这是上方 `appleView` 的一个示例，使用了后者方法进行重构：\n\n```\n1   var appleView\
  \ = Backbone.View.extend({\n2     template: _.template(\n3         '<figure>'+\n\
  4           +'<img src=\"<%= attributes.url %>\"/>'+\n5           +'<figcaption><%=\
  \ attributes.name %></figcaption>'+\n6         +'</figure>'),\n7   ...\n```\n\n\
  请注意 `<%=` 和 `%>` 符号；它们是让 Undescore.js 打印 `attributes` 对象中 `url` 和 `name` 属性值的指令。\n\
  \n最后，我们为 `appleView` 类添加了 `render` 函数。\n\n```\n1   render: function(appleName){\n\
  2     var appleModel = this.collection.where({name:appleName})[0];\n3     var appleHtml\
  \ = this.template(appleModel);\n4     $('body').html(appleHtml);\n5   }\n```\n\n\
  我们通过 `where()` 方法在集合中查找模型，并使用 `[]` 获取第一个元素。目前，`render` 函数负责加载数据和渲染数据。稍后我们将重构该函数，将这两个功能分离到不同的方法中。\n\
  \n整个应用位于 [rpjs/backbone/collections/index.html](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
  \ 文件夹，看起来如下：\n\n```\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n 4   <script src=\"jquery.js\"\
  ></script>\n 5   <script src=\"underscore.js\"></script>\n 6   <script src=\"backbone.js\"\
  ></script>\n 7 \n 8   <script>\n 9    var appleData = [\n10       {\n11        \
  \ name: \"fuji\",\n12         url: \"img/fuji.jpg\"\n13       },\n14       {\n15\
  \         name: \"gala\",\n16         url: \"img/gala.jpg\"\n17       }      \n\
  18     ];\n19     var app;\n20     var router = Backbone.Router.extend({\n21   \
  \    routes: {\n22         \"\": \"home\",\n23         \"apples/:appleName\": \"\
  loadApple\"\n24       },\n25       initialize: function(){\n26         var apples\
  \ = new Apples();\n27         apples.reset(appleData);\n28         this.homeView\
  \ = new homeView({collection: apples});\n29         this.appleView = new appleView({collection:\
  \ apples});\n30       },\n31       home: function(){        \n32         this.homeView.render();\n\
  33       },\n34       loadApple: function(appleName){\n35         this.appleView.render(appleName);\n\
  36       }\n37     });\n38 \n39     var homeView = Backbone.View.extend({\n40  \
  \     el: 'body',\n41       template: _.template('Apple data: <%= data %>'),\n42\
  \       render: function(){\n43         this.$el.html(this.template({\n44      \
  \   data: JSON.stringify(this.collection.models)\n45       }));\n46       }\n47\
  \       //TODO subviews\n48     });\n49 \n50     var Apples = Backbone.Collection.extend({\n\
  51 \n52     });\n53     var appleView = Backbone.View.extend({\n54       template:\
  \ _.template('<figure>\\\n55                   <img src=\"<%= attributes.url %>\"\
  />\\\n56                   <figcaption><%= attributes.name %></figcaption>\\\n57\
  \                 </figure>'),\n58       //TODO re-write with load apple and event\
  \ binding\n59       render: function(appleName){\n60         var appleModel = this.collection.where({\n\
  61           name:appleName\n62         })[0];\n63         var appleHtml = this.template(appleModel);\n\
  64         $('body').html(appleHtml);\n65       }\n66     });\n67     $(document).ready(function(){\n\
  68       app = new router;\n69       Backbone.history.start();      \n70     })\n\
  71 \n72   </script>\n73 </head>\n74 <body>\n75   <div></div>\n76 </body>\n77 </html>\n\
  ```\n\n在浏览器中打开 `collections/index.html` 文件。你应该能看到来自我们“数据库”的数据，即：`Apple data: [{\"\
  name\":\"fuji\",\"url\":\"img/fuji.jpg\"},{\"name\":\"gala\",\"url\":\"img/gala.jpg\"\
  }]`。\n\n现在，在浏览器中访问 `collections/index.html#apples/fuji` 或 `collections/index.html#apples/gala`。我们预期看到一个带有标题的图片。这是一个项的详细视图，在这种情况下是一个苹果。干得好！\n\
  \n### 4.3 事件绑定\n\n在现实生活中，获取数据并不是瞬间完成的，因此让我们重构代码来模拟这一过程。为了更好的 UI/UX，我们还需要向用户显示加载图标（又称为\
  \ spinner 或 ajax-loader），以通知他们信息正在加载。\n\n我们在 Backbone 中拥有事件绑定是是一件好事。如果没有它，我们必须得将一个渲染\
  \ HTML 的函数作为回调传递给数据加载函数，以确保在在有实际数据可以显示之前，渲染函数不会被执行。\n\n因此，当用户进入详细视图（`apples/:id`）时，我们只调用加载数据的函数。然后，通过适当的事件监听器，当有新数据时（或数据发生变化时），我们的视图会自动（这不是拼写错误）更新自身（Backbone.js\
  \ 支持多个甚至是自定义事件）。\n\n让我们更改路由器中的代码：\n\n```\n1   ...\n2     loadApple: function(appleName){\n\
  3       this.appleView.loadApple(appleName);\n4     }\n5   ...\n```\n\n在到达 `appleView`\
  \ 类之前，其他内容保持不变。我们需要添加一个构造函数或 `initialize` 方法，这是 Backbone.js 中一个特殊的单词/属性。\n\n```\n\
  1   ...\n2   var appleView = Backbone.View.extend({\n3     initialize: function(){\n\
  4       //在此处设置模型\n5       this.model = new Model();\n6     },\n7   ...\n```\n\n\
  太棒了，我们有了 `initialize` 函数。现在我们需要创建一个代表单个苹果的模型并设置事件监听器。我们将使用两种类型的事件：`change` 和 `spinner`。为了这一点，我们将使用\
  \ `on()` 函数，它接受这些属性：`on(event, actions, context)` —— 更多信息请参阅 [backbonejs.org/Events-on](http://backbonejs.org/Events-on)：\n\
  \n```\n1   ...\n2   var appleView = Backbone.View.extend({\n3     initialize: function(){\n\
  4       this.model = new (Model.extend({}));\n5       this.model.bind('change',\
  \ this.render, this);\n6       this.model.bind('spinner',this.showSpinner, this);\n\
  7     },\n8   ... \n```\n\n上面的代码归结为两个简单的事情：\n\n1. 当模型改变时，调用 `appleView` 的 `render()`\
  \ 函数\n2. 当 `spinner` 事件触发时，调用 `appleView` 的 `showSpinner()` 方法\n\n到目前一切顺利，对吧？但是\
  \ spinner，即那个 GIF 图标呢？我们在 `appleView` 中创建一个新属性：\n\n```\n1   ...\n2     templateSpinner:\
  \ '<img src=\"spinner.gif\" width=\"30\"/>',\n3   ...\n```\n\n还记得路由器中的 `loadApple`\
  \ 调用吗？这就是在 `appleView` 中实现该函数的方式：\n\n```\n 1   ...\n 2   loadApple:function(appleName){\n\
  3     this.trigger('spinner'); \n4     //显示 spinner GIF 图标\n5     var view = this;\
  \ \n6     //我们需要在闭包内部访问它\n7     setTimeout(function(){ \n8     //模拟从远程服务器获取数据的\n\
  9     //真实时间延迟\n10       view.model.set(view.collection.where({\n11         name:appleName\n\
  12       })[0].attributes);  \n13     },1000);    \n14   },\n 15   ...\n```\n\n\
  第一行将触发 `spinner` 事件（我们仍然需要编写该函数）。\n\n第二行仅仅是为了作用域问题（以便我们能够在闭包内部使用 **appleView**）。\n\
  \n`setTimeout` 函数模拟了远程服务器响应的真实时间延迟。\n\n现在我们可以从 `render` 方法中移除多余的代码并实现 `showSpinner`\
  \ 函数。\n\n\n\n\n```javascript\n1   render: function(appleName){\n2     var appleHtml\
  \ = this.template(this.model);\n3     $('body').html(appleHtml);\n4   },\n5   showSpinner:\
  \ function(){\n6     $('body').html(this.templateSpinner);        \n7   }\n8   ...\n\
  ```\n\n就这些！在浏览器中打开 `index.html#apples/gala` 或 `index.html#apples/fuji`，在等待苹果图片加载时享受加载动画。\n\
  \n`index.html` 文件的完整代码：\n\n```javascript\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n\
  \ 4   <script src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"></script>\n\
  \ 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script>\n 9    var appleData\
  \ = [\n10       {\n11         name: \"fuji\",\n12         url: \"img/fuji.jpg\"\n\
  13       },\n14       {\n15         name: \"gala\",\n16         url: \"img/gala.jpg\"\
  \n17       }      \n18     ];\n19     var app;\n20     var router = Backbone.Router.extend({\n\
  21       routes: {\n22         \"\": \"home\",\n23         \"apples/:appleName\"\
  : \"loadApple\"\n24       },\n25       initialize: function(){\n26         var apples\
  \ = new Apples();\n27         apples.reset(appleData);\n28         this.homeView\
  \ = new homeView({collection: apples});\n29         this.appleView = new appleView({collection:\
  \ apples});\n30       },\n31       home: function(){        \n32         this.homeView.render();\n\
  33       },\n34       loadApple: function(appleName){\n35         this.appleView.loadApple(appleName);\n\
  36 \n37       }\n38     });\n39 \n40     var homeView = Backbone.View.extend({\n\
  41       el: 'body',\n42       template: _.template('Apple data: <%= data %>'),\n\
  43       render: function(){\n44         this.$el.html(this.template({\n45     \
  \      data: JSON.stringify(this.collection.models)\n46         }));\n47       }\n\
  48       //TODO subviews\n49     });\n50 \n51     var Apples = Backbone.Collection.extend({\n\
  52 \n53     });\n54     var appleView = Backbone.View.extend({\n55       initialize:\
  \ function(){\n56         this.model = new (Backbone.Model.extend({}));\n57    \
  \     this.model.on('change', this.render, this);\n58         this.on('spinner',this.showSpinner,\
  \ this);\n59       },\n60       template: _.template('<figure>\\\n61           \
  \      <img src=\"<%= attributes.url %>\"/>\\\n62                 <figcaption><%=\
  \ attributes.name %></figcaption>\\\n63                 </figure>'),\n64       templateSpinner:\
  \ '<img src=\"img/spinner.gif\" width=\"30\"/>',\n66 \n66       loadApple:function(appleName){\n\
  67         this.trigger('spinner');\n68         var view = this; //we'll need to\
  \ access \n69         //that inside of a closure\n70         setTimeout(function(){\
  \ //simulates real time \n71         //lag when fetching data from the remote server\n\
  72           view.model.set(view.collection.where({\n73             name:appleName\n\
  74           })[0].attributes);  \n75         },1000);\n76 \n77       },\n78 \n\
  79       render: function(appleName){\n80         var appleHtml = this.template(this.model);\n\
  81         $('body').html(appleHtml);\n82       },\n83       showSpinner: function(){\n\
  84         $('body').html(this.templateSpinner);        \n85       }\n86 \n87  \
  \   });\n88     $(document).ready(function(){\n89       app = new router;\n90  \
  \     Backbone.history.start();      \n91     })\n92 \n93   </script>\n94 </head>\n\
  95 <body>\n96   <a href=\"#apples/fuji\">fuji</a>\n97   <div></div>\n98 </body>\n\
  99 </html>\n```\n\n### 4.4 结合 Underscore.js 的视图和子视图\n\n此示例可以在 [rpjs/backbone/subview](https://github.com/azat-co/rpjs/tree/master/backbone/subview)\
  \ 获取。\n\n子视图（Subviews）是在另一个 `Backbone View` 内部创建并使用的 `Backbone View` 实例。子视图是一个抽象（分离）UI\
  \ 事件（例如点击）以及结构相似元素（例如苹果）模板的极佳方法。\n\n`Subview` 的用例可能包括表格中的行、列表中的列表项、段落、新行等。\n\n我们将重构主页以显示一个精美的苹果列表。每个列表项将有一个苹果名称和一个带有\
  \ `onClick` 的“购买”链接。\n\n```javascript\n1   render: function(appleName){\n2     var\
  \ appleHtml = this.template(this.model);\n3     $('body').html(appleHtml);\n4  \
  \ },\n5   showSpinner: function(){\n6     $('body').html(this.templateSpinner);\
  \        \n7   }\n8   ...\n```\n\n我们将重构主页以显示一个精美的苹果列表。每个列表项将有一个苹果名称和一个带有 `onClick`\
  \ 的“购买”链接。\n\n\n\n\n\n```\n1   ...\n2   template: _.template('Apple data: \\\n3\
  \     <ul class=\"apples-list\">\\\n4     </ul>\\\n5     <div class=\"cart-box\"\
  ></div>'),\n6   ...\n```\n\n当 `homeView` 创建时（执行 `new homeView()`），会调用 `initialize`\
  \ 函数——在该函数中，我们渲染了模板（使用了我们已经熟悉的 `html()` 函数），并为集合（一组苹果模型）绑定了一个事件监听器：\n\n```\n1  \
  \ ...\n2     initialize: function() {\n3       this.$el.html(this.template);\n4\
  \       this.collection.on('addToCart', this.showCart, this);\n5     },\n6   ...\n\
  ```\n\n绑定事件的语法在上一节中介绍过。本质上，它是调用了 `homeView` 的 `showCart()` 函数。在这个函数中，我们将 `appleName`\
  \ 添加到购物车中（同时带有一个换行符，即 `<br/>` 元素）：\n\n```\n1   ...    \n2     showCart: function(appleModel)\
  \ {\n3       $(this.cartEl).append(appleModel.attributes.name+'<br/>');\n4     },\n\
  5   ...\n```\n\n最后，是我们期待已久的 `render()` 方法，在该方法中我们遍历集合中的每个模型（每个苹果），为每个苹果创建一个 `appleItemView`，为每个苹果创建一个\
  \ `<li>` 元素，并将该元素添加到 `view.listEl` —— 即 DOM 中类名为 `apples-list` 的 `<ul>` 元素中：\n\n\
  ```\n 1   ...\n 2   render: function(){\n 3     view = this; \n 4     //以便在闭包内部使用\
  \ view\n 5     this.collection.each(function(apple){\n 6       var appleSubView\
  \ = new appleItemView({model:apple}); \n 7       // 使用 model apple 创建子视图\n 8   \
  \    appleSubView.render(); \n 9       //编译模板和单个苹果数据\n10       $(view.listEl).append(appleSubView.$el);\
  \   \n11       //将单个苹果的 jQuery 对象\n12       //添加到 apples-list DOM 元素\n13     });\n\
  14   }\n15   ...\n```\n\n让我们确保在 `homeView` Backbone View 中没有漏掉任何内容：\n\n```\n 1 \
  \  ...\n 2   var homeView = Backbone.View.extend({\n 3     el: 'body',\n 4     listEl:\
  \ '.apples-list',\n 5     cartEl: '.cart-box',\n 6     template: _.template('Apple\
  \ data: \\\n 7       <ul class=\"apples-list\">\\\n 8       </ul>\\\n 9       <div\
  \ class=\"cart-box\"></div>'),\n10     initialize: function() {\n11       this.$el.html(this.template);\n\
  12       this.collection.on('addToCart', this.showCart, this);\n13     },\n14  \
  \   showCart: function(appleModel) {\n15       $(this.cartEl).append(appleModel.attributes.name+'<br/>');\n\
  16     },      \n17     render: function(){\n18       view = this; //以便在闭包内部使用 view\n\
  19       this.collection.each(function(apple){\n20         var appleSubView = new\
  \ appleItemView({model:apple}); \n21         // 使用 model apple 创建子视图\n22       \
  \  appleSubView.render(); \n23         //编译模板和单个苹果数据\n24         $(view.listEl).append(appleSubView.$el);\
  \   \n25         //将单个苹果的 jQuery 对象\n26         //添加到 apples-list DOM 元素\n27   \
  \    });\n28     }\n29   }); \n30   ...\n```\n\n你现在应该点击购买，购物车将填充你选择的苹果。查看单个苹果不再需要在向浏览器的\
  \ URL 地址栏中输入它的名称。我们可以点击名称，它会打开一个带有详细视图的新窗口。\n\n![由子视图渲染的苹果列表。](img/backbone-subview1.png)\n\
  \n由子视图渲染的苹果列表。\n\n通过使用子视图，我们复用了所有项目（苹果）的模板，并为它们中的每一个绑定了特定的事件。这些事件足够智能，可以将模型信息传递给其他对象：视图和集合。\n\
  \n以防万一，这里是子视图示例的完整代码，你也可以在 [rpjs/backbone/subview/index.html](https://github.com/azat-co/rpjs/blob/master/backbone/subview/index.html)\
