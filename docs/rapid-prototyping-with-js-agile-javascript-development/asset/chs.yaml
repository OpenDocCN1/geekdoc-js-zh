  \ 上编写技术文章，该博客在 Google “express.js tutorial”搜索中排名第一（http://expressjsguide.com/assets/img/expressjs-tutorial.png）。Azat\
  \ 还是 [Express.js Guide](http://expressjsguide.com)、[Rapid Prototyping with JS](http://rpjs.co)\
  \ 和 [Oh My JS](http://leanpub.com/ohmyjs) 的作者，以及开源项目 [ExpressWorks](http://npmjs.org/expressworks)、[mongoui](http://npmjs.org/mongoui)\
  \ 和 [HackHall](http://npmjs.org/hackhall) 的创建者。\n\n# 快速入门\n\n## 1 基础\n\n**摘要**：HTML、CSS\
  \ 和 JavaScript 语法的概述；敏捷开发方法的简要介绍；云计算、Node.js 和 MongoDB 的优势；HTTP 请求/响应的描述。\n\n> “我认为每个人都应该学习编程，因为它教会你如何思考。我将计算机科学视为人文艺术，是每个人应该学习的。”\
  \ —— 史蒂夫乔布\n\n### 1.1 前端定义\n\n### 1.1.1 整体视图\n\nWeb 和移动应用程序开发的整体视图包括以下步骤：\n\n1.\
  \ 用户在浏览器（客户端）输入 URL 或点击链接\n2. 浏览器向服务器发送 HTTP 请求\n3. 服务器处理请求，如果查询字符串和/或请求体中有参数，它将考虑这些参数\n\
  4. 服务器在数据库中更新/获取/转换数据\n5. 服务器返回包含 HTML、JSON 或格式数据的 HTTP 响应\n6. 浏览器接收 HTTP 响应\n7.\
  \ 浏览器以 HTML 或任何其他格式（例如 JPEG、XML、JSON）渲染 HTTP 响应\n\n移动应用程序与普通网站相同，只是不是浏览器而是原生应用。其他细微差别在于：运营商带宽导致的数据限制、较小的屏幕以及对本地存储更高效的利用。\n\
  \n移动开发有几种方法，每种方法都有其优缺点：\n\n* 使用 Objective-C 和 Java 构建的原生 iOS、Android、Blackberry\
  \ 应用\n* 使用 JavaScript 在 [Appcelerator](http://www.appcelerator.com/) 或类似工具构建的应用，然后编译成原生\
  \ Objective-C 或 Java\n* 针对较小屏幕的响应式设计移动网站，使用 CSS 框架（如 [Twitter Bootstrap](https://twitter.github.io/bootstrap/)\
  \ 或 [Foundation](http://foundation.zurb.com/)）、普通 CSS 或不同的模板\n\n\n\n\n\n*   HTML5\
  \ 应用由 HTML、CSS 和 JavaScript 组成，通常使用 [Sencha Touch](http://www.sencha.com/products/touch/)、[Trigger.io](https://trigger.io/)、[JO](http://joapp.com/)\
  \ 等框架构建，然后使用 [PhoneGap](http://phonegap.com/) 封装成原生应用\n\n### 1.1.2 超文本标记语言\n\n超文本标记语言（或\
  \ `HTML`）本身并不是一种编程语言。它是一组标记标签，用于描述内容并以结构化和格式化的方式呈现。HTML 标签由尖括号（`<>`）内部的 `tag name`\
  \ 组成。大多数情况下，标签包围内容，结束标签在标签名称前有一个 `forward slash`（正斜杠）。\n\n在这个示例中，每行都是一个 HTML 元素：\n\
  \n```\n1 <h2>HTML 概览</h2>\n2 <div>HTML 是一个 ...</div>\n3 <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"style.css\" />\n```\n\n一个 一个 HTML 文档本身是 `html` 标签的一个元素，所有其他元素都是该\
  \ `html` 标签的子元素：\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3   <head>\n\
  \ 4     <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\" />\n 5   </head>\n\
  \ 6   <body>\n 7     <h2>HTML 概览</h2>\n 8     <p>HTML 是一个 ...</p>\n 9   </body>\n\
  10 </html>\n```\n\nHTML 有不同的种类和版本，例如 DHTML、XHTML 1.0、XHTML 1.1、XHTML 2、HTML 4、HTML\
  \ 5。这篇文章很好地解释了这些差异——[误解标记：XHTML 2/HTML 5 漫画](http://coding.smashingmagazine.com/2009/07/29/misunderstanding-markup-xhtml-2-comic-strip/)。\n\
  \n任何 HTML 元素都可以拥有属性。其中最重要的有：`class`、`id`、`style`、`data-name`、`onclick` 以及其他事件属性。\n\
  \n### class\n\nClass 属性定义了一个用于 CSS 样式设置或 DOM 操作的类，例如：\n\n```\n1 <p class=\"normal\"\
  >...</p>\n```\n\n### id\n\nId 属性定义了一个 ID，其目的与元素类相似，但必须是唯一的，例如：\n\n```\n1 <div id=\"\
  footer\">...</div>\n```\n\n### style\n\nStyle 属性定义了内联 CSS 来样式化元素，例如：\n\n```\n1 <font\
  \ style=\"font-size:20px\">...</font>\n```\n\n### title\n\nTitle 属性指定了额外信息，这些信息通常由大多数浏览器在工具提示中显示，例如：\n\
  \n```\n1 <a title=\"对答案点赞\">...</a>\n```\n\n### data-name\n\nData-name 属性允许在 DOM\
  \ 中存储元数据，例如：\n\n```\n1 <tr data-token=\"fa10a70c-21ca-4e73-aaf5-d889c7263a0e\">...</tr>\n\
  ```\n\n### onclick\n\nOnclick 属性在点击事件发生时调用内联 JavaScript 代码，例如：\n\n```\n1 <input\
  \ type=\"button\" onclick=\"validateForm();\">...</a>\n```\n\n### onmouseover\n\n\
  Onmouseover 属性与 `onclick` 类似，但用于鼠标悬停事件，例如：\n\n```\n1 <a onmouseover=\"javascript:\
  \ this.setAttribute('css','color:red')\">...</a>\n```\n\n其他用于内联 JavaScript 代码的 HTML\
  \ 元素属性有：\n\n*   `onfocus`: 当浏览器聚焦于元素时\n*   `onblur`: 当浏览器焦点离开元素时\n*   `onkeydown`:\
  \ 当用户按下键盘键时\n*   `ondblclick`: 当用户双击鼠标时\n*   `onmousedown`: 当用户按下鼠标按钮时\n*   `onmouseup`:\
  \ 当用户释放鼠标按钮时\n*   `onmouseout`: 当用户鼠标移出元素区域时\n*   `oncontextmenu`: 当用户弹出菜单时\n\n\
  此类事件的完整列表和浏览器兼容表可以在[事件兼容性表](http://www.quirksmode.org/dom/events/index.html)。\n\n\
  我们将在 Twitter Bootstrap 框架中大量使用类（classes），而使用内联 CSS 和 JavaScript 代码通常是一个坏主意，因此我们将尝试避免这样做。然而，了解\
  \ JavaScript 事件的名称是有好处的，因为它们在 jQuery、Backbone.js 以及当然原生 JavaScript 中随处可见。要将属性列表转换为\
  \ JS 事件列表，只需删除前缀 `on`，例如 `onclick` 属性意味着 `click` 事件。\n\n更多信息请访问 [示例：捕获鼠标点击](https://developer.mozilla.org/en-US/docs/JavaScript/Getting_Started#Example:_Catching_a_mouse_click)、[Wikipedia](http://en.wikipedia.org/wiki/HTML)\
  \ 和 [w3schools](http://www.w3schools.com/html/html_intro.asp)。\n\n### 1.1.3 层叠样式表\n\
  \n层叠样式表（或 CSS）是一种格式化和呈现内容的方法。HTML 文档可以通过 `link` 标签包含外部样式表（如之前的示例所示），也可以直接在 `style`\
  \ 标签中包含 CSS 代码：\n\n```\n1 <style>\n2   body {\n 3     padding:60px; /* 简单的内边距 */\n\
  \ 4   }\n 5 </style>\n```\n\nCSS 是 CSS 的升级，包含了新的方法，如圆角、边框和渐变。\n\n### 1.1.4 JavaScript\n\
  \nJavaScript 始于 1995 年的 Netscape，最初名为 LiveScript。它与 Java 的关系就像仓鼠和火腿（ham）的关系一样。如今，JavaScript\
  \ 同时用于客户端和服务器端，也用于桌面应用程序。\n\n将 JS 代码放入 `script` 标签中是在 HTML 文档中使用 JavaScript 最简单的方法：\n\
  \n```\n1 <script>\n2   alert(\"Hello world!\");\n3   // 简单的警窗窗口\n4 </script>\n```\n\
  \n请注意，将 HTML 和 JS 代码混合不是好主意，因此为了将它们分离，我们可以将代码移动到外部文件中，并通过设置 `script` 标签上的源属性 `src`\
  \ 来包含它，例如：\n\n```\n<script src=\"js/app.js\"></script>\n```\n\n即使对于像这样包含外部源的空元素，闭合标签\
  \ `</script>` 也是强制性的。由于 JavaScript 的主导地位，`Type` 和 `language` 属性多年来在现代浏览器中已变为可选。\n\
  \n运行 JavaScript 的其他方法包括：\n\n*   上文已介绍的内联方法\n*   WebKit 浏览器开发者工具和 FireBug 控制台\n*\
  \   交互式 Node.js 终端\n\nJavaScript 语言的优点之一是它是松类型的。这种松/弱类型（与 C 和 Java 等语言中的[强类型](http://en.wikipedia.org/wiki/Strong_typing)相比）使得\
  \ JavaScript 成为更好的原型设计语言。以下是一些主要的 JavaScript 对象/类类型（它们上并不是真正的类；对象继承自对象）：\n\n**Number\
  \ 原生类型**\n\n数值，例如：\n\n```\nvar num = 1;\n```\n\n**Number 对象**\n\n[Number](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Number)\
  \ 对象及其方法，例如：\n\n\n\n\n\n```\n1 var numObj = new Number(\"123\"); //Number object\n\
  2 var num = numObj.valueOf(); //number primitive\n3 var numStr = numObj.toString();\
  \ //string representation\n```\n\n### 字符串原始类型\n\n单引号或双引号内的字符序列，例如：\n\n```\n1 var\
  \ str = \"some string\";\n2 var newStr = \"abcde\".substr(1,2);\n```\n\n为了方便起见，JS\
  \ 会自动为字符串类型包装 `String` 对象方法，但[它们并不完全相同](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/String#Distinction_between_string_primitives_and_String_objects)。\n\
  \n### 字符串对象\n\n字符串对象有很多用的方法，如 `length`、`match` 等，例如：\n\n```\n1 var strObj = new\
  \ String(\"abcde\");//String object\n2 var str = strObj.valueOf(); //string primitive\n\
  3 strObj.match(/ab/);\n4 str.match(/ab/); // 两种调用都会生效\n```\n\n### 正则表达式对象\n\n正则表达式（`RegExps`）是用于字符串查找匹配、替换、测试的字符模式：\n\
  \n```\n1 var pattern = /[A-Z]+/;\n2 str.match(/ab/); \n```\n\n### 特殊类型\n\n当你对其有疑问时，可以随时调用\
  \ `typeof obj`。这里是 JS 中用到的一些特殊类型：\n\n* `NaN`\n* `null`\n* `undefined`\n* `function`\n\
  \n### 全局变量\n\n你可以在代码的任何地方调用这些方法，因为它们是全局方法：\n\n* `decodeURI`\n* `decodeURIComponent`\n\
  * `encodeURI`\n* `encodeURIComponent`\n* `eval`\n* `isFinite`\n* `isNaN`\n* `parseFloat`\n\
  * `parseInt`\n* `uneval`\n* `Infinity`\n* `Intl`\n\n### JSON\n\n`JSON` 库允许我们解析和序列化\
  \ JavaScript 对象，例如：\n\n```\n1 var obj = JSON.parse('{a:1, b:\"hi\"}');\n2 var stringObj\
  \ = JSON.stringify({a:1,b:\"hi\"});\n```\n\n### 数组对象\n\n[数组](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array)是基于零索引的列表。例如，创建一个数组：\n\
  \n```\n1 var arr = new Array();\n2 var arr = [\"apple\", \"orange\", 'kiwi\"];\n\
  ```\n\n`Array` 对象有很多很好的方法，如 `indexOf`、`slice`、`join`。确保你熟悉它们，因为如果用得当，它们将节省大量时间。\n\
  \n### 数据对象\n\n```\n1 var obj = {name: \"Gala\", url:\"img/gala100x100.jpg\",price:129}\n\
  ```\n\n或者\n\n```\n1 var obj = new Object();\n```\n\n更多关于继承模式请见下方。\n\n### 布尔值原始类型和对象\n\
  \n与 String 和 Number 相同，[Boolean](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Boolean)既可以是原始类型也可以是对象。\n\
  \n```\n1 var bool1 = true;\n2 var bool2 = false;\n3 var boolObj = new Boolean(false);\n\
  ```\n\n### Date 对象\n\n[Date](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Date)\
  \ 对象允许我们处理日期和时间，例如：\n\n```\n1 var timestamp = Date.now(); // 1368407802561\n2 var\
  \ d = new Date(); //Sun May 12 2013 18:17:11 GMT-0700 (PDT)\n```\n\n### Math 对象\n\
  \n数学常量和[函数](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Math)，例如：\n\
  \n```\n1 var x = Math.floor(3.4890);\n2 var ran = Math.round(Math.random()*100);\n\
  ```\n\n### 浏览器对象\n\n让我们访问浏览器及其属性（如 URL），例如：\n\n```\n1 window.location.href = 'http://rapidprototypingwithjs.com';\n\
  2 console.log(\"test\");\n```\n\n### DOM 对象\n\n```\n1 document.write(\"Hello World\"\
  );\n2 var table = document.createElement('table');\n3 var main = document.getElementById('main');\n\
  ```\n\n| ![warning](img/leanpub_warning.png) |  \n\n### 警告\n\nJavaScript 支持的数字最大为\
  \ 53 位。如果你需要处理大于该范围的数字，请查看大数库。 |\n\nJavaScript 和 DOM 对象的完整参考可以在 [Mozilla Developer\
  \ Network](https://developer.mozilla.org/en-US/docs/JavaScript/Reference) 和 [w3school](http://www.w3schools.com/jsref/default.asp)。\n\
  \n关于 JS 资源（如 ECMA 规范），请查看此列表 [JavaScript 语言资源](https://developer.mozilla.org/en-US/docs/JavaScript/Language_Resources)。截至本文编写，最新的\
  \ JavaScript 规范是 ECMA-262 第 5.1 版：[PDF](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)\
  \ 和 [HTML](http://www.ecma-international.org/ecma-262/5)。\n\n\n\n\n3. 如果需要，重构代码，并在保持测试用例通过的同时添加功能。\n\
  \n4. 重复此步骤直到完成所有任务。\n\n测试可以分为功能测试和单元测试。后者是指系统对单个单元、方法和函数进行测试，并对依赖进行模拟（mock）；而前者（即集成测试）是指系统对包含依赖项的某个功能片段进行测试。\n\
  \n测试驱动开发（Test-Driven Development）的优势：\n\n* 更少的错误/缺陷\n* 更高效的代码库\n* 对代码能够正常运行且不破坏旧功能充满信心\n\
  \n### 1.2.3 持续部署与集成\n\n持续部署（Continuous Deployment，简称 `CD`）是一系列向客户快速交付新功能、错误修复和增强的技术。CD`\
  \ 包含了自动化测试和自动化部署。通过利用持续部署，可以减少人工开销并最大限度地缩短反馈循环时间。基本上，开发者越快地从客户那里获得反馈，产品就能越早进行调整，从而在竞争中获得更多优势。与许多企业和大型公司典型的\
  \ 6 到 12 个月的发布周期相比，许多初创公司每天内会部署多次。\n\n持续部署方法的优势：缩短了反馈循环时间和人工工作开销。\n\n持续部署与持续集成之间的差异在文章\
  \ [持续交付 vs 持续部署 vs 持续集成 - 等等，哈？](http://blog.assembla.com/assemblablog/tabid/12618/bid/92411/Continuous-Delivery-vs-Continuous-Deployment-vs-Continuous-Integration-Wait-huh.aspx)\
  \ 中进行了概述。\n\n一些流行的持续集成解决方案：\n\n* [Jenkins](http://jenkins-ci.org/): 一个可扩展的开源持续集成服务器\n\
  * [CircleCI](https://circleci.com/): 交付更好、更快速的代码\n* [Travis CI](https://travis-ci.org/):\
  \ 为开源社区提供的托管持续集成服务\n\n### 1.2.4 结对编程\n\n结对编程（Pair Programming）是一种两名开发者在同一个环境中工作的技术。其中一名是驱动者（driver），另一是观察者（observer）。驱动者编写代码，观察者通过观察和提出建议来协助。然后他们交换角色。驱动者承担更具战术性的角色，专注于当前任务；相比之下，观察者承担更具战略性的角色，负责“大局”并寻找漏洞和改进算法的方法。\n\
  \n结对编程的优势：\n\n* 结使得代码库更短、更高效，并引入了更少的错误和缺陷。\n* 作为额外奖励，知识在程序员共同工作时会在他们之间传递。然而，开发者之间可能会出现冲突的情况，而且这完全并不罕见。\n\
  \n### 1.3 后端定义\n\n### 1.3.1 Node.js\n\nNode.js 是一种开源的事件驱动异步 I/O 技术，用于构建可扩展且高效的 Web\
  \ 服务器。Node.js 由 Google 的 [V8 JavaScript 引擎](http://en.wikipedia.org/wiki/V8_(JavaScript_engine))组成，并由云公司\
  \ [Joyent](http://joyent.com）维护。\n\nNode.js 的用途类似于 Python 的 [Twisted](http://twistedmatrix.com/trac/)\
  \ 和 Ruby 的 [EventMachine](http://rubyeventmachine.com/)。Node 的 JavaScript 实现是在尝试使用\
  \ Ruby 和 C++ 编程语言之后的第三次尝试。\n\nNode.js 本身像 Ruby on Rails 那样的框架；它更类似于 PHP+Apache 的组合。关于\
  \ Node.js 框架的更多内容将在 *Node.js and MongoDB* 章节中介绍。\n\n使用 Node.js 的优势：\n\n* 由于 JavaScript\
  \ 是 Web 和移动开发的事实标准，开发者极有可能熟悉 JavaScript 语言。\n* 使用一种语言进行前端和后端开发加速了编码过程。开发者的大脑不需要在不同语法之间切换，即所谓的“上下文切换”。对方法和类的学习速度更快。\n\
  * 通过 Node.js，你可以快速进行原型设计，并尽早进入市场进行客户开发和客户获取。对于其他使用不敏捷技术（例如 PHP 和 MySQL）的公司来说，这是一个重要的竞争优势。\n\
  * Node.js 的设计初衷是利用 web-sockets 支持实时应用程序。\n\n欲了解更多信息，请访问 [Wikipedia](http://en.wikipedia.org/wiki/Nodejs)、[Nodejs.org](http://nodejs.org/about/)\
  \ 以及 [ReadWrite](http://readwrite.com/2011/01/25/wait-whats-nodejs-good-for-aga)\
  \ 和 [O’Reilly](http://radar.oreilly.com/2011/07/what-is-node.html) 上的文章。\n\n关于本文写作时\
  \ Node.js 的当前状态，请参考 [Isaac Z. Schlueter 的 Node 状态 PPT – 2013](http://j.mp/2013-state-of-the-node)。\n\
  \n### 1.3.2 NoSQL 和 MongoDB\n\nMongoDB 源自 hu**MONGO**us，是一种用于处理海量数据的高性能无关系数据库。当传统的关系型数据库管理系统（RDBMS）无法应对海量数据带来的挑战时，NoSQL\
  \ 概念应运生。\n\n使用 MongoDB 的优势：\n\n* 可扩展性：由于其分布式特性，多个服务器和数据中心可以拥有冗余数据。\n* 高性能：MongoDB\
  \ 在存储和检索数据方面非常有效，这部分归功于数据库中元素和集合之间没有关系。\n* 灵活性：键值存储是原型设计的理想选择，因为它不需要模式架构（schema）。\n\
  \n### 1.3.3 云计算\n\n云计算包括：\n\n* 基础设施即服务（IaaS），例如 Rackspace、Amazon Web Services\n\
  * 平台即服务（PaaS），例如 Heroku、Windows Azure\n* 后端即服务（BaaS），例如 Parse.com、Firebase\n* 软件即服务（SaaS），例如\
  \ Google Apps、Salesforce.com\n\n云应用提供：\n\n* 可扩展性：例如在几分钟内创建新实例\n* 部署便利：例如推送到 Heroku\
  \ 只需使用 `git push`\n* 按需付费计划：用户根据需求增加或减少内存和磁盘空间\n* 插件：方便安装和配置数据库、应用服务器\n* 安全\n\n\
  PaaS 和 BaaS 是原型设计、构建最小可行性产品（MVP）以及早期初创公司的理想选择。\n\n### 1.3.4 HTTP 请求与响应\n\n每个 HTTP\
  \ 请求和响应包含以下组件：\n\n1. 头部（Header）：关于编码、主体长度、源、内容类型等信息。\n2. 主体（Body）：内容，通常是传递给服务器或返回给客户端的数据。\n\
  \n此外，HTTP 请求包含：\n\n* 方法（Method）：有几种方法，最常见的 `GET`、`POST`、`PUT` 和 `DELETE`\n* URL：主机、端口、路径，例如\
  \ `https://graph.facebook.com/498424660219540`\n* 查询字符串（Query string）：URL 中问号之后的所有内容（例如\
  \ `?q=rpjs&page=20`）\n\n### 1.3.5 RESTful API\n\nRESTful（表现层状态转移）API 由于分布式系统的需求——每次事务都需要包含足够的客户端状态的信息——而变得流行。在某种意义上，这种标准是无状态的，因为服务器不存储任何客户端状态的信息，使得每个请求都可以由不同的系统处理。\n\
  \nRESTful API 的独特特征：\n\n* 由于不同组件可以独立部署到不同的服务器，因此具有更好的可扩展性支持\n* 由于更简单的动词和名词结构，取代了简单对象访问协议（SOAP）\n\
  \n\n\n\n\n*   利用 HTTP 方法：`GET`, `POST`, `DELETE`, `PUT`, `OPTIONS` 等。\n\n以下是一个用于消息集合（Message\
  \ Collection）的简单增删改查（CRUD）REST API 示例：\n\n| 方法 |  | | 含义 |\n| --- | --- | --- |\n\
  | GET | `/messages.json` | 以 JSON 格式返回消息列表 |\n| PUT | `/messages.json` | 更新/替换所有消息并以\
  \ JSON 格式返回状态/错误 |\n| POST | `/messages.json` | 创建新消息并以 JSON 格式返回其 id |\n| GET |\
  \ `/messages/{id}.json` | 以 JSON 格式返回 id 为 `{id}` 的消息 |\n| PUT | `/messages/{id}.json`\
  \ | 更新/替换 id 为 `{id}` 的消息，如果 `{id}` 消息不存在则创建它 |\n| DELETE | `/messages/{id}.json`\
  \ | 删除 id 为 `{id}` 的消息，以 JSON 格式返回状态/错误 |\n\nREST 不是一种协议；它是一种架构，从这个意义上说，它比协议 SOAP\
  \ 更灵活。因此，如果我们想支持这些格式，REST API 的 URL 可以看起来像 `/messages/list.html` 或 `/messages/list.xml`。\n\
  \n`PUT` 和 `DELETE` 是[幂等方法](http://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol#Idempotent_methods_and_web_applications)，这意味着如果服务器接收到两个或多个相似请求，最终结果将相同。\n\
  \n`GET` 是无力的（nullipotent），而 `POST` 不是幂等的，可能会影响状态并产生副作用。\n\n关于 REST API 的进一步阅读可以参考\
  \ [维百科](http://en.wikipedia.org/wiki/Representational_state_transfer) 和 [REST 简介绍文章](http://www.infoq.com/articles/rest-introduction)。\n\
  \n## 2 设置\n\n**摘要**：关于工具 set 的建议；本地组件的逐步安装；云服务的准备工作。\n\n> *“我效率最高的一天之一是删掉了 1,000\
  \ 行代码。”* - [Ken Thompson](http://en.wikipedia.org/wiki/Ken_Thompson)\n\n### 2.1\
  \ 本地设置\n\n### 2.1.1 开发文件夹\n\n如果你没有为你的 Web 开发项目专门的开发文件夹，可以在 `Documents` 文件夹中创建一个\
  \ `Development` 文件夹（路径将为 `Documents/Development`）。为了编写代码示例，在你的 Web 开发项目文件夹内部创建一个\
  \ `rpjs` 文件夹，例如，如果你在 `Development` 文件夹内部创建一个 `rpjs` 文件夹，路径将为 `Documents/Development/rpjs`。你可以使用\
  \ Mac OS X 上的 Finder 或者在 OS X/Linux 系统上使用以下终端命令：\n\n```\n1 $ cd ~/Documents\n2 $\
  \ mkdir Development\n3 $ cd Development\n4 $ mkdir rpjs\n```\n\n![初始开发环境设置。](img/screenshots----dev-env-setup.png)\n\
  \n初始开发环境设置。\n\n| ![tip](img/leanpub_tip.png) |  \n\n#### 提示\n\n要在终端中从当前目录打开 Mac\
  \ OS Finder 应用，只需输入并运行 `$ open .` 命令。\n\n要获取文件和文件夹列表，请使用此 UNIX/Linux 命令：\n\n```\n\
  1 $ ls \n```\n\n或者显示隐藏文件和文件夹，例如 `*.git`：\n\n```\n1 $ ls -lah\n```\n\n`$ ls` 的另一种替代方案是\
  \ `$ ls -alt`。`-lah` 和 `-alt` 选项的区别在于，后者按时间顺序排序，而前者按字母顺序排序。\n\n| ![information](img/leanpub_information.png)\
  \ |  \n\n#### 注意\n\n你可以使用 Tab 键自动补全文件和文件夹名称。\n\n稍后，你可以将示例复制到 `rpjs` 文件夹中，并在该文件夹中创建应用。\n\
