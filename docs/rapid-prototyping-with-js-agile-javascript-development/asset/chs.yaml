  \ 上。\n\n## 结论与延伸阅读\n\n**总结**：本书的结论、JavaScript 博客文章、文章、电子书、书籍和其他资源列表。\n\n### 结论\n\
  \n我们希望你喜欢这本书。它的初衷是轻理论重实践，并为你提供现代敏捷 Web 开发中使用的多种技术、框架和技巧的概述。《JS 快速原型开发》涵盖了以下主题：\n\
  \n* `jQuery`\n* `AJAX`\n* `CSS` 和 `LESS`\n* `JSON` 和 `BSON`\n* `Twitter Bootstrap`\n\
  * `Node.js`\n* `MongoDB`\n* `Parse.com`\n* `敏捷方法论`\n* `Git`\n* `Heroku`、`MongoHQ`\
  \ 和 `Windows Azure`\n* `REST API`\n* `Backbone.js`\n* `AMD` 和 `Require.js`\n* `Express.js`\n\
  * `Monk`\n* `Derby`\n\n如果你需要深入知识或参考文献，通常点击一下或通过 Google 搜索即可获得。\n\n实践部分包括构建了多个版本的聊天应用：\n\
  \n* `jQuery` + `Parse.com` JS REST API\n* `Backbone` 和 `Parse.com` JS SDK\n* `Backbone`\
  \ 和 `Node.js`\n* `Backbone` 和 `Node.js` + `MongoDB`\n\n聊天应用具备典型 Web/移动应用的所有基础：获取数据、显示数据、提交新数据。其他示例包括：\n\
  \n* `jQuery` + `Twitter RESP API` “推文分析器”\n* `Parse.com` “保存 John”\n* `Node.js`\
  \ “Hello World”\n* `MongoDB` “打印集合”\n* `Derby` + `Express` “Hello World”\n* `Backbone.js`\
