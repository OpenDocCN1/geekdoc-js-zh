  \n## 8.5 Express.js 简介：使用 Monk 和 MongoDB 构建简单 REST API 应用\n\n### 8.5.1 使用 Express.js\
  \ 和 Monk 构建的 REST API 应用\n\n此应用是 [mongoui](http://gitbhub.com/azat-co/mongoui) 的起点——这是一个用\
  \ Node.js 编写的 MongoDB 版 phpMyAdmin。其目标是提供一个具有良好 Web 管理用户界面的模块。它将类似于 [Parse.com](http://parse.com)、[Firebase.com](http://firebase.com)、[MongoHQ](http://mongohq.com)\
  \ 或 [MongoLab](http://mongolab.com) 的功能，但不会绑定到任何特定服务。为什么我们每次想查询用户信息时都必须输入 `db.users.findOne({'_id':ObjectId('...')})`\
  \ 呢？替代 [MongoHub](http://mongohub.todayclose.com/) Mac 应用很好（且免费），但使用起来很笨且不是基于 Web\
  \ 的。\n\nRuby 爱好者喜欢将 Express 与 [Sinatra](http://www.sinatrarb.com/) 框架进行比较。在开发者构建应用方面，它们同样灵活。应用程序路由以类似的方式设置，例如\
  \ `app.get('/products/:id', showProduct);`。目前 Express.js 的版本号为 3.1。除了 Express 之外，我们还将使用\
  \ [Monk](https://github.com/LearnBoost/monk) 模块。\n\n我们将使用 [Node Package Manager](http://npmjs.org)，它通常随\
  \ Node.js 一起安装。如果你还没有，可以去 [npmjs.org](http://npmjs.org) 获取。\n\n创建一个新文件夹并在其中创建 NPM\
  \ 配置文件 `package.json`，内容如下：\n\n```\n 1 {\n 2   \"name\": \"mongoui\",\n 3   \"version\"\
  : \"0.0.1\",\n 4   \"engines\": {\n 5     \"node\": \">= v0.6\"\n 6   },\n 7   \"\
  dependencies\": {\n 8     \"mongodb\":\"1.2.14\",\n 9     \"monk\": \"0.7.1\",\n\
  10     \"express\": \"3.1.0\"\n11   }\n12 }\n```\n\n现在运行 `npm install` 下载并安装模块到\
  \ `node_module` 文件夹。如果一切顺利，你将在 `node_modules` 文件夹中看到许多文件夹。我们应用程序的所有代码将放在文件 `index.js`\
  \ 中，以保持简单直接（KISS）：\n\n```\n 1 var mongo = require('mongodb');\n 2 var express =\
  \ require('express');\n 3 var monk = require('monk');\n 4 var db = require('monk').connect('mongodb://localhost/mongoui');\n\
  \ 5 var app = express();\n 6 \n 7 app.use(express.static(__dirname + '/public'));\n\
  \ 8 \n 9 app.get('/', function(req,res){\n10   res.send('Hello World');\n11 });\n\
  \ 12 \n 13 app.get('/products/:id', function(req,res){\n14   res.send('Product ID:\
  \ ' + req.params.id);\n15 });\n 16 \n 17 app.listen(3000, function(){\n18   console.log('Server\
  \ started on port 3000');\n19 });\n```\n\n\n\n\n```\n1 $ node .\n```\n\n或者\n\n```\n\
  1 $ node index.js\n```\n\n要查看应用程序运行情况，请在 Chrome 中打开 [localhost:3000](http://localhost:3000)，并安装\
  \ [JSONViewer](https://chrome.google.com/webstore/detail/jsonview/chklaanhfefbnpoihckbnefhakgolnmc?hl=en)\
  \ 扩展（用于美化渲染 JSON）。\n\n### 8.6 Express.js 简介：参数、错误处理和其他中间件\n\n### 8.6.1 请求处理器\n\n\
  Express.js 是一个 node.js 框架，它其他功能提供了一种组织路由的方法。每个路由都通过应用对象上的方法调用定义，并将 URL 模式作为第一个参数（也支持正则表达式）——例如：\n\
  \n```\n1 app.get('api/v1/stories/', function(res, req){\n2   ...\n3 })\n```\n\n\
  或者，对于 POST 方法：\n\n```\n1 app.post('/api/v1/stories'function(req,res){\n2   ...\n\
  3 })\n```\n\n不用俗说，`DELETE` 和 `PUT` 方法也是[支持的](http://expressjs.com/api.html#app.VERB)。\n\
  \n我们传递给 `get()` 或 `post()` 方法的回调被称为请求处理器，因为它们接收请求 (`req`)、处理它们，并写入响应 (`res`) 对象。例如：\n\
  \n```\n1 app.get('/about', function(req,res){\n2   res.send('About Us: ...');\n\
  3 });\n```\n\n我们可以有多个请求处理器 —— 因此它们被命名为 `middleware`（中间件）。它们接受第三个参数 `next`，调用它（`next()`）将把执行流切换到下一个处理器：\n\
  \n```\n 1 app.get('/api/v1/stories/:id', function(req,res, next) {\n 2   //进行权限验证\n\
  \ 3   //如果没有授权或发生错误\n 4   //返回 next(error);\n 5   //如果授权且没有错误\n 6   return next();\n\
  \ 7 }), function(req,res, next) {\n 8   //提取 id 并从数据库获取对象\n 9   //假设没有错误，将 story\
  \ 保存到请求对象中\n110   req.story = story;\n 11   return next();\n 12 }), function(req,res)\
  \ {\n 13   //输出数据库搜索结果\n 14   res.send(res.story);\n 15 });\n```\n\nURL 模式中的 story\
  \ ID 是查询字符串参数，我们需要它来在数据库中查找匹配项。\n\n### 8.6.2 参数中间件\n\n参数是通过请求 URL 中的查询字符串传递的值。如果没有\
  \ Express.js 或类似的库，而只使用核心 Node.js 模块，我们就必须通过某些 `require('querystring').parse(url)`\
  \ 或 `require('url').parse(url, true)` 函数的技巧从 [HTTP.request](http://nodejs.org/api/http.html#http_http_request_options_callback)\
  \ 对象中提取参数。\n\n多亏了 [Connect framework](http://www.senchalabs.org/connect/) 和 [VisionMedia](https://github.com/visionmedia/express)\
  \ 的人员，Express.js 已经以中间件的形式支持了参数、错误处理和许多其他重要功能。我们可以这样在应用程序中插件参数中间件：\n\n```\n 1 app.param('id',\
  \ function(req,res, next, id){\n 2   //对 id 进行某些操作\n 3   //将 id 或其他信息存储在 req 对象中\n\
  \ 4   //完成后调用 next\n 5   next();\n 6 });\n 7 \n 8 app.get('/api/v1/stories/:id',function(req,res){\n\
  \ 9   //参数中间件将在之前执行\n10   //我们期望 req 对象已经包含了所需信息\n11   //输出某些内容\n12   res.send(data);\n\
  13 });\n```\n\n例如：\n\n```\n 1 app.param('id', function(req,res, next, id){\n 2 \
  \  req.db.get('stories').findOne({_id:id}, function (e, story){\n 3     if (e) return\
  \ next(e);\n 4     if (!story) return next(new Error('Nothing is found'));\n 5 \
  \    req.story = story;\n 6     next();\n 7   });\n 8 });\n 9 \n10 app.get('/api/v1/stories/:id',function(req,res){\n\
  11   res.send(req.story);\n12 });\n```\n\n或者我们可以使用多个请求处理器，但概念保持相同：我们可以期望在执行此代码之前已经有了\
  \ `req.story` 对象或抛出了错误，因此我们抽象了获取参数及其相应对象的通用代码/逻辑：\n\n```\n1 app.get('/api/v1/stories/:id',\
  \ function(req,res, next) {\n2   //进行权限验证\n3   }),\n4   //我们在 req.story 中已经有一个对象，所以这里不需要额外工作\n\
  5   function(req,res) {\n6   //输出数据库搜索结果\n7   res.send(story);\n8 });\n```\n\n权限验证和输入清洗也是存放在中间件中的良好候选者。\n\
  \n`param()` 函数特别别酷，因为我们可以组合不同的键，例如：\n\n```\n 1 app.param('id', function(req,res,\
  \ next, id){\n```\n\n### 8.6.3 错误处理\n\n错误处理通常用于整个应用程序，因此我们将其作为中间件来实现。\n\n\n\n\n\n\
  \n```javascript\n 1 function requiredParamHandler(param){\n  //do something with\
  \ a param, e.g, \n  //check that it's present in a query string\n  return function\
  \ (req,res, next) {\n    //use param, e.g., if token is valid proceed with next();\n\
  \    next();\n  });\n} \n\napp.get('/api/v1/stories/:id', \n  requiredParamHandler('token'),\
  \ \n  story.show\n); \n\nvar story  = {\n  show: function (req, res, next) {\n \
  \   //do some logic, e.g., restrict fields to output\n    return res.send();\n \
  \ } \n} \n```\n\n如所示，中间件是保持代码组织良好的强大概念。最佳实践是将所有逻辑移动到相应的外部模块/文件中，从而保持路由简洁。这样，重要的服务器配置参数就会整齐地集中在一个处！:-)\n\
  \n## 8.7 使用 Node.js、 MongoDB、Mongoskin 和 Express.js 构建 JSON REST API 服务器\n\n本教程将引导你如何使用\
  \ [Mocha](http://visionmedia.github.io/mocha/) 和 [Super Agent](http://visionmedia.github.io/superagent/)\
  \ 库编写测试，然后以测试驱动开发的方式，利用 [Express.js](http://expressjs.com/) 框架和 [Mongoskin](https://github.com/kissjs/node-mongoskin)\
  \ 库为 [MongoDB](http://www.mongodb.org/) 构建一个 [Node.js](http://nodejs.org) free JSON\
  \ REST API 服务器。在这个 REST API 服务器中，我们将执行创建、更新、删除和删除（CRUD）操作，并利用 `app.param()` 和 `app.use()`\
  \ 方法利用 Express.js [中间件](http://expressjs.com/api.html#middleware)概念。\n\n### 8.7.1\
  \ 测试覆盖\n\n在进行其他操作之前，让我们编写向即将创建的 REST API 服务器发送 HTTP 请求的功能测试。如果你知道如何使用 [Mocha](http://visionmedia.github.io/mocha/)\
  \ 或者只想直接开始 Express.js 应用实现，请尽管这样做。你也可以使用 CURL 终端命令进行测试。\n\n假设我们已经安装了 Node.js、[NPM](http://npmjs.org)\
  \ 和 MongoDB，让我们创建一个新文件夹（如果你已经写了测试，请使用该文件夹）：\n\n```\nmkdir rest-api\ncd rest-api\n\
  ```\n\n我们将使用 [Mocha](http://visionmedia.github.io/mocha/)、[Expect.js](https://github.com/LearnBoost/expect.js/)\
  \ 和 [Super Agent](http://visionmedia.github.io/superagent/) 库。要安装它们，请在项目文件夹运行这些命令：\n\
  \n```\n$ npm install mocha\n$ npm install expect.js\n$ npm install superagent\n\
  ```\n\n现在在同一文件夹中创建 `express.test.js` 文件，它将包含六个测试套件：\n\n* 创建新对象\n* 通过 ID 获取对象\n*\
  \ 获取整个集合\n* 通过 ID 更新对象\n* 通过 ID 检查更新后的对象\n* 通过 ID 对象\n\n使用 Super Agent 的链式函数处理 HTTP\
  \ 请求变得轻而易举，我们将它们放在每个测试套件中。以下是 `express.test.js` 文件的完整源代码：\n\n```javascript\nvar\
  \ superagent = require('superagent')\nvar expect = require('expect.js') \n\ndescribe('express\
  \ rest api server', function(){\n  var id \n\n  it('post object', function(done){\n\
  \    superagent.post('http://localhost:3000/collections/test')\n      .send({ name:\
  \ 'John'\n        , email: 'john@rpjs.co'\n      })\n      .end(function(e,res){\n\
  \        // console.log(res.body)\n        expect(e).to.eql(null)\n        expect(res.body.length).to.eql(1)\n\
  \        expect(res.body[0]._id.length).to.eql(24)\n        id = res.body[0]._id\n\
  \        done()\n      })    \n  }) \n\n  it('retrieves an object', function(done){\n\
  \    superagent.get('http://localhost:3000/collections/test/'+id)\n      .end(function(e,\
  \ res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n    \
  \    expect(typeof res.body).to.eql('object')\n        expect(res.body._id.length).to.eql(24)\
  \        \n        expect(res.body._id).to.eql(id)        \n        done()\n   \
  \   })\n  }) \n\n  it('retrieves a collection', function(done){\n    superagent.get('http://localhost:3000/collections/test')\n\
  \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
  \        expect(res.body.length).to.above(0)\n        expect(res.body.map(item){\n\
  \          return item._id\n        })).to.contain(id)\n        done()\n      })\n\
  \  }) \n  it('updates an object', function(done){\n    superagent.put('http://localhost:3000/collections/'+id)\n\
  \      .send({name: 'Peter'\n        , email: 'peter@yahoo.com'})\n      .end(function(e,\
  \ res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n    \
  \    expect(typeof res.body).to.eql('object')\n        done()\n      })\n  }) \n\
  \  it('checks an updated object', function(done){\n    superagent.get('http://localhost:3000/collections/'+id)\n\
  \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
  \        expect(typeof res.body).to.eql('object')\n        expect(res.body._id.length).to.eql(24)\
  \        \n        expect(res.body._id).to.eql(id)        \n        done()\n   \
  \   })\n  })\n  it('removes an object', function(done){\n    superagent.del('http://localhost:3000/collections/'+id)\n\
  \      .end(function(e, res){\n        // console.log(res.body)\n        expect(e).to.eql(null)\n\
  \        expect(typeof res.body).to.eql('object')\n        done()\n      })\n  })\n\
  })\n```\n\n\n\n\n注意：如果你想连接到远程数据库，例如 [MongoHQ](https://www.mongohq.com/home) 实例，请将字符串替换为你的用户名、密码、主机和端口值。URI\
  \ 字符串的格式如下：`mongodb://[username:password@]host1[:port1][,host2[:port2],...[,hostN[:portN]]][/[database][?options]]`\n\
  \n`app.param()` 方法是另一个 Express.js 中间件。它基本上表示“每当请求处理器的 URL 模式出现此值时，执行某些操作”。在我们的情况下，当请求模式包含带有冒号前缀的字符串\
  \ `collectionName` 时，我们会选择特定的集合（稍后会在路由中看到）：\n\n```javascript\n1 app.param('collectionName',\
  \ \n2   function(req, res, next, collectionName) {\n3     req.collection = db.collection(collectionName)\n\
  4     return next()\n5   }\n6 )\n```\n\n为了用户友好，我们设置一个带消息的根路由：\n\n```javascript\n\
  1 app.get('/', function(req, res) {\n2   res.send('please select a collection, e.g.,\
  \ /collections/messages')\n3 })\n```\n\n现在真正的工作开始了。以下是获取获取按 `_id` 排序并限制为 10 条的项目列表的方法：\n\
  \n```javascript\n 1 app.get('/collections/:collectionName', \n2   function(req,\
  \ res) {\n3     req.collection\n4       .find({},\n5         {limit:10, sort: [['_id',-1]]}\n\
  6       ).toArray(function(e, results){\n7         if (e) return next(e)\n8    \
  \     res.send(results)\n9       }\n10     )\n11   }\n12 )\n```\n\n你是否注意到 URL 模式参数中的\
  \ `:collectionName` 字符串了？这个和之前的 `app.param()` 中间件为我们提供了 `req.collection` 对象，它指向数据库中指定的集合。\n\
  \n创建端点的对象稍微更容易理解，因为我们只需将整个负载传递给 MongoDB（方法即免费的 JSON REST API）：\n\n```javascript\n\
  1 app.post('/collections/:collectionName', function(req, res) {\n2   req.collection.insert(req.body,\
  \ {}, function(e, results){\n3     if (e) return next(e)\n4     res.send(results)\n\
  5   })\n6 })\n```\n\n单个对象检索函数比 `find()` 快，但它们使用不同的接口（它们直接返回对象而不是游标），所以请注意这一点。此外，我们通过\
  \ Express.js 的魔术方法 `req.params.id` 从路径的 `:id` 部分提取 ID：\n\n```javascript\n1 app.get('/collections/:collectionName/:id',\
  \ function(req, res) {\n2   req.collection.findOne({_id: req.collection.id(req.params.id)},\
  \ \n3     function(e, result){\n4       if (e) return next(e)\n5       res.send(result)\n\
  6     }\n7   )\n8 })\n```\n\nPUT 请求处理器变得更有趣了，因为 `update()` 不返回修改后的对象，而是返回受影响对象的计数。\n\
  \n此外，`{$set:req.body}` 是一个特殊的 MongoDB 运算符（运算符通常以美元符号开头），用于设置值。\n\n第二个参数 `{safe:true,\
  \ multi:false}` 是一个带有选项的对象，告诉 MongoDB 在运行回调函数之前等待执行完成，并且只处理一个（第一个）项目。\n\n```javascript\n\
  \ 1 app.put('/collections/:collectionName/:id', function(req, res) {\n2   req.collection.update({_id:\
  \ req.collection.id(req.params.id)}, \n3     {$set:req.body}, \n4     {safe:true,\
  \ multi:false}, \n5     function(e, result){\n6       if (e) return next(e)\n7 \
  \      res.send((result===1)?{msg:'success'}:{msg:'error'})\n8     }\n9   )\n10\
  \ })\n```\n\n最后是 DELETE 方法，它也输出自定义的 JSON 消息：\n\n```javascript\n1 app.del('/collections/:collectionName/:id',\
  \ function(req, res) {\n2   req.collection.remove({_id: req.collection.id(req.params.id)},\
  \ 3     function(e, result){\n4       if (e) return next(e)\n5     res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
  6     }\n7   )\n8 })\n```\n\n注意：`delete` 是 JavaScript 中的一个运算符，所以 Express.js 使用 `app.del`\
  \ 代替。\n\n在这种情况下，实际在端口 3000 上启动服务器的最后一行是：\n\n```javascript\n1 app.listen(3000)\n\
  ```\n\n以防某些地方运行不正常，这里是 `express.js` 文件的完整代码：\n\n```javascript\n 1 var express =\
  \ require('express')\n2   , mongoskin = require('mongoskin')\n3 \n4 var app = express()\n\
  5 app.use(express.bodyParser())\n6 \n7 var db = mongoskin.db('localhost:27017/test',\
  \ {safe:true})\n8 app.param('collectionName', \n9   function(req, res, next, collectionName)\
  \ {\n10     req.collection = db.collection(collectionName)\n11     return next()\n\
  12   }\n13 )\n14 app.get('/', function(req, res) {\n15   res.send('please select\
  \ a collection, e.g., /collections/messages')\n16 })\n17 app.get('/collections/:collectionName',\
  \ \n18   function(req, res) {\n19     req.collection\n20       .find({},\n21   \
  \      {limit:10, sort: [['_id',-1]]}\n22       ).toArray(function(e, results){\n\
  23         if (e) return next(e)\n24         res.send(results)\n25       }\n26 \
  \    )\n27   }\n28 )\n29 app.post('/collections/:collectionName', function(req,\
  \ res) {\n30   req.collection.insert(req.body, {}, function(e, results){\n31   \
  \  if (e) return next(e)\n32     res.send(results)\n33   })\n34 })\n35 app.get('/collections/:collectionName/:id',\
  \ function(req, res) {\n36   req.collection.findOne({_id: req.collection.id(req.params.id)},\
  \ \n37     function(e, result){\n38       if (e) return next(e)\n39       res.send(result)\n\
  40     }\n41   )\n42 })\n43 app.put('/collections/:collectionName/:id', function(req,\
  \ res) {\n44   req.collection.update({_id: req.collection.id(req.params.id)}, \n\
  45     {$set:req.body}, \n46     {safe:true, multi:false}, \n47     function(e,\
  \ result){\n48       if (e) return next(e)\n49       res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
  50     }\n51   )\n52 })\n53 app.del('/collections/:collectionName/:id', function(req,\
  \ res) {\n54   req.collection.remove({_id: req.collection.id(req.params.id)}, 55\
  \     function(e, result){\n56       if (e) return next(e)\n57     res.send((result===1)?{msg:'success'}:{msg:'error'})\n\
  58     }\n59   )\n60 })\n61 app.listen(3000)\n```\n\n\n\n\n\n[Express.js](http://expressjs.com)\
  \ 是一个流行的 node 框架，它使用中间件概念来增强应用程序的功能。[Derby](http://derbyjs.com) 是一个新的复杂的模型-视图-控制器\
  \ ([MVC](http://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller)) 框架，设计用于配合\
  \ [Express](http://expressjs.com) 作为其中间件使用。Derby 还带有对 [Racer](https://github.com/codeparty/racer)\
  \ 数据同步引擎以及类似于 handlebars 的模板引擎的支持。\n\n## 安装 Derby\n\n让我们在不使用脚手架工具的情况下搭建一个基本的 Derby\
  \ 应用程序架构。通常，当人们刚开始学习一个新的全面的框架时，项目生成器会让他们感到困惑。这是一个最基础的“Hello World”应用程序教程，它仍然展示了\
  \ Derby 的骨架，并演示了带有 websocket 的实时模板（live-templates）。\n\n当然，我们需要 [Node.js](http://nodejs.org)\
  \ 和 [NPM](http://npmjs.org)，它们可以在 [nodejs.org](http://nodejs.org) 获取。全局安装 Derby，运行：\n\
  \n```\n1 $ npm install -g derby\n```\n\n检查安装情况：\n\n```\n1 $ derby -V\n```\n\n我的版本（截至\
  \ 2013 年 4 月）是 `0.3.15`。我们已经准备好创建我们的第一个应用了！\n\n## 文件结构\n\n这是项目的文件夹结构：\n\n```\n1\
  \ project/\n2   -package.json\n3   -index.js\n4   -derby-app.js\n5   views/\n6 \
  \    derby-app.html\n7   styles/\n8     derby-app.less\n```\n\n## 依赖项\n\n在 `package.json`\
  \ 文件中包含依赖和其他基本信息：\n\n```\n 1  {\n 2   \"name\": \"DerbyTutorial\",\n 3   \"description\"\
  : \"\",\n 4   \"version\": \"0.0.0\",\n 5   \"main\": \"./server.js\",\n 6   \"\
  dependencies\": {\n 7     \"derby\": \"*\",\n 8     \"express\": \"3.x\"\n 9   },\n\
  10   \"private\": true\n11 }\n```\n\n现在我们可以运行 `npm install`，这将我们的依赖项下载到 `node_modules`\
  \ 文件夹中。\n\n## 视图\n\n视图必须位于 `views` 文件夹中，并且必须位于与你的 derby app JavaScript 文件同名的文件夹下的\
  \ `index.html`（即 `views/derby-app/index.html`），或者位于与你的 derby app JS 文件同名的文件中（即 `derby-app.html`）。\n\
  \n在示例“Hello World”应用中，我们将使用 `<Body:>` 模板和 `{message}` 变量。Derby 使用类似于 mustache 的语法进行响应式绑定。`index.html`\
  \ 如下：\n\n```\n1 <Body:>\n2   <input value=\"{message}\"><h1>{message}</h1>\n```\n\
  \nStylus/LESS 文件也是如此；在我们的示例中，`index.css` 只有一行：\n\n```\n1 h1 {\n2   color: blue;\n\
  3 }\n```\n\n要了解更多关于这些优秀的 CSS 预处理器，请查看 [Stylus](http://learnboost.github.io/stylus/)\
  \ 和 [LESS](http://lesscss.org/) 的文档。\n\n## 主服务器\n\n`index.js` 是我们的主服务器文件，我们通过 `require()`\
  \ 函数包含依赖项来启动它：\n\n```\n1 var http = require('http'),\n2   express = require('express'),\n\
  3   derby = require('derby'),\n4   derbyApp = require('./derby-app');\n```\n\n最后一行是我们的\
  \ derby 应用程序文件 `derby-app.js`。\n\n现在我们正在创建 Express.js 应用程序（v3.x 与 2.x 有显著差异）和 HTTP\
  \ 服务器：\n\n```\n1 var expressApp = new express(),\n2   server = http.createServer(expressApp);\n\
  ```\n\n[Derby](http://derbyjs.com) 使用 [Racer](https://github.com/codeparty/racer)\
  \ 数据同步库，我们这样创建它：\n\n```\n1 var store = derby.createStore({\n2   listen: server\n\
  3 });\n```\n\n为了从后端获取一些数据到前端，我们实例化模型对象：\n\n```\n1 var model = store.createModel();\n\
  ```\n\n重要的是我们需要将模型和路由作为中间件传递给 Express.js 应用。我们需要暴露 public 文件夹以便让 socket.io 正常工作。\n\
  \n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n3   use(express.static(__dirname\
  \ + '/public')).\n4   use(derbyApp.router()).\n5   use(expressApp.router);\n```\n\
  \n现在我们可以在端口 3001（或其他任何端口）上启动服务器：\n\n```\n1 server.listen(3001, function(){\n2  \
  \ model.set('message', 'Hello World!');\n3 });\n```\n\n`index.js` 的完整代码：\n\n```\n\
  1 var http = require('http'),\n2   express = require('express'),\n3   derby = require('derby'),\n\
  4   derbyApp = require('./derby-app');\n5 \n6 var expressApp = new express(),\n\
  7   server = http.createServer(expressApp);\n8 \n9 var store = derby.createStore({\n\
  10   listen: server\n11 });\n12 \n13 var model = store.createModel();\n14 \n15 expressApp.\n\
  16   use(store.modelMiddleware()).\n17   use(express.static(__dirname + '/public')).\n\
  18   use(derbyApp.router()).\n19   use(expressApp.router);\n20 \n21 server.listen(3001,\
  \ function(){\n22   model.set('message', 'Hello World!');\n23 });\n```\n\n## Derby\
  \ 应用\n\n[Derby](http://derbyjs.com) 使用 [Racer](https://github.com/codeparty/racer)\
  \ 数据同步库，我们这样创建它：\n\n```\n1 var store = derby.createStore({\n2   listen: server\n\
  3 });\n```\n\n为了从后端获取一些数据到前端，我们实例化模型对象：\n\n```\n1 var model = store.createModel();\n\
  ```\n\n重要的是我们需要将模型和路由作为中间件传递给 Express.js 应用。我们需要暴露 public 文件夹以便让 socket.io 正常工作。\n\
  \n```\n1 expressApp.\n2   use(store.modelMiddleware()).\n3   use(express.static(__dirname\
  \ + '/public')).\n4   use(derbyApp.router()).\n5   use(expressApp.router);\n```\n\
  \n现在我们可以在端口 3001（或其他任何端口）上启动服务器：\n\n```\n1 server.listen(3001, function(){\n2  \
  \ model.set('message', 'Hello World!');\n3 });\n```\n\n`derby-app.js` 的完整代码：\n\n\
  ```\n1 derby = require('derby'),\n2   app = derby.createApp(module);\n3 \n4 app.get('/',\
  \ function(page, model) {\n5   page.render();\n6   });\n7 });\n```\n\n## 启动应用\n\n\
  现在一切都准备就绪了。执行 `node .` 或 `node index.js` 并在浏览器访问 `localhost:3001`。你应该看到：\n\n当然，静态数据不多，所以我们可以稍微修改应用，让前后端进行通信。\n\
  \n在服务器文件 `index.js` 中，添加 `store.afterDb` 来监听 `message` 属性的事件：\n\n```\n1 server.listen(3001,\
  \ function(){\n2   model.set('message', 'Hello World!');\n3   store.afterDb('set','message',\
  \ function(txn, doc, prevDoc, done){\n4     console.log(txn)\n5     done();\n6 \
  \  });\n7 });\n```\n\n修改后 `index.js` 的完整代码：\n\n```\n1 var http = require('http'),\n\
  2   express = require('express'),\n3   derby = require('derby'),\n4   derbyApp =\
  \ require('./derby-app');\n5 \n6 var expressApp = new express(),\n7   server = http.createServer(expressApp);\n\
  8 \n9 var store = derby.createStore({\n10   listen: server\n11 });\n12 \n13 var\
  \ model = store.createModel();\n14 \n15 expressApp.\n16   use(store.modelMiddleware()).\n\
  17   use(express.static(__dirname + '/public')).\n18   use(derbyApp.router()).\n\
  19   use(expressApp.router);\n20 \n21 server.listen(3001, function(){\n22   model.set('message',\
  \ 'Hello World!');\n23   store.afterDb('set','message', function(txn, doc, prevDoc,\
  \ done){\n24     console.log(txn)\n25     done();\n26   });\n27 });\n```\n\n\n\n\
  \n\n```\n 1 var derby = require('derby'),\n 2   app = derby.createApp(module);\n\
  \ 3 \n 4 app.get('/', function(page, model, params) {\n 5   model.subscribe('message',\
  \ function() {\n 6     page.render();\n 7   })\n 8 });\n 9 \n10 app.ready(function(model)\
  \ {\n 11   model.on('set', 'message', function(path, object) {\n 12     console.log('message\
  \ has been changed: ' + object);\n 13   })\n 14 });\n```\n\n我们在终端窗口和浏览器开发者控制台中查看日志。浏览器中的最终结果如下：\n\
  \n![Hello World App：浏览器控制台日志](img/webapplog-derby-2.png)\n\nHello World App：浏览器控制台日志\n\
  \n终端中的显示如下：\n\n![Hello World App：终端控制台日志](img/webapplog-derby-3.png)\n\nHello World\
  \ App：终端控制台日志\n\n想要更多持久化领域的魔法，请查看 [Racer 的 db 属性](http://derbyjs.com/#persistence)。通过它，你可以实现视图和数据库之间的自动同步！\n\
