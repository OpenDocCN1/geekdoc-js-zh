  \ JavaScriptJavaScript 闭包](https://developer.mozilla.org/en-US/JavaScript/Guide/Closures)。\n\
  \n使用闭包定义全局变量的示例：\n\n```javascript\n(function() {\n  var apple= function() {\n  \
