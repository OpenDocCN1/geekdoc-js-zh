  \n## 在 Twitter 上分享\n\n> “我正在阅读《Rapid Prototyping with JS》——一本由 @azat_co 编写的关于 JavaScript\
  \ 和 Node.js 捷开发的书籍 #RPJS @RPJSbook” — [`clicktotweet.com/biWsd`](http://clicktotweet.com/biWsd)\n\
  \n## 致谢\n\n感谢我的文案和内容编辑 David Moadel 和 Lisa Martens。我也感谢 ([Hack Reactor](http://hackreactor.com)、[Marakana](http://marakana.com)、[pariSOMA](http://pariSOMA.com)\
  \ 和 [General Assembly](http://generalassemb.ly)) 的学生，我曾在那里教课，并将《Rapid Prototyping\
  \ with JS》（或其部分内容）作为培训材料。\n\n我要感谢 [StartupMonthly](http://startupmonthly.org) 团队的\
  \ Yuri 和 Vadim，他们对 [Rapid Prototyping with JS 培训](http://www.webapplog.com/training/)\
  \ 及其手册提供了建设性的反馈。\n\n此外，非常感谢我的设计师朋友 Ben、Ivan 和 Natalie，他们为封面设计反馈提供了帮助。\n\n## 引言\n\
  \n**摘要**：通用快速原型开发的背景以及本书的编写初衷；关于期待什么、不期待什么、先决条件问题的解答；关于如何使用本书及示例的建议；书籍符号格式的说明。\n\
  \n> “走出大楼。” — [Steve Blank](http://steveblank.com/)\n\n《Rapid Prototyping with JS》是一本实战书籍，向你介绍如何使用最前端的\
  \ Web 和移动技术进行快速软件原型设计，包括 [Node.js](http://nodejs.org)、[MongoDB](http://mongodb.org)、[Twitter\
  \ Bootstrap](http://twitter.github.com/bootstrap)、[LESS](http://lesscss.org)、[jQuery](http://jquery.com)、[Parse.com](http://parse.com)、[Heroku](http://heroku.com)\
  \ 等。\n\n### 为什么选择 RPJS？\n\n这本书源于挫败感。我已经从事软件工程多年，当我开始学习 Node.js 和 Backbone.js 时，我通过惨痛体会到它们的官方文档和互联网缺乏快速上手指南和示例。不用说，几乎不可能在一个地方找到所有与\
  \ JS 相关的现代技术的教程。\n\n最好的学习方法是实践，对吧？因此，我使用了通过小型简单示例（即快速上手指南）的方法来接触新的酷炫技术。在完成基础应用后，我需要一些参考和组织工作。我开始编写本手册主要是为了自己，以便我更好地理解概念并在以后参考这些示例。然后，我和\
  \ [StartupMonthly](http://startupmonthly.org) 针对同一主题教授了几个为期两天的强化训练课程——帮助经验丰富的开发者通过敏捷\
  \ JavaScript 开发开启职业生涯。我们使用的手册根据收到的反馈进行了多次更新和迭代。最终结果就是这本书。\n\n### 预期内容\n\nRPJS 的典型读者应该预期一组快速上手指南、教程和建议（例如\
  \ Git 工作流）。书中有很多代码，但没有多少理论。我们涵盖的所有理论都直接与某些实践方面相关，并且对于更好地理解技术以及处理这些技术的特定方法（例如 JSONP\
  \ 和跨域调用）至关重要。\n\n除了代码示例外，本书几乎涵盖了所有的设置和部署步骤。\n\n你将通过聊天 Web/移动应用程序的示例进行学习，从前端组件开始。这些应用程序有几个版本，但到最后，我们将前端和后端整合并部署到生产环境。该聊天应用程序包含了基础\
  \ Web 应用典型的所有必要组件，将带给你足够的信心继续独立开发、申请工作/晋升或建立初创公司！\n\n### 本书适合人群\n\n本书专为高级初学者和中级\
  \ Web 及移动开发者设计：他们曾是（或仍然是）Ruby on Rails、PHP、Perl、Python 或/或 Java 等语言的专家。这类开发者想要学习更多关于\
  \ JavaScript 和 Node.js 的技术，以快速构建 Web 和移动应用原型的原型。我们的目标用户没有时间去翻阅大量的（或在另一个极端极其简短的）官方文档。《Rapid\
  \ Prototyping with JS》的目标不是让读者成为专家，而是帮助他们尽快开始构建应用。\n\n《Rapid Prototyping with JS:\
  \ Agile JavaScript Development》，正如其名称所示，是关于如何尽可能将你的想法转化为 Web 或移动应用程序形式的功能原型。这种思维符合\
  \ [精益创业](http://theleanstartup.com) 方法论；因此，由于如果你不熟悉循环、if/else 语句、数组、哈希、对象和函数等基础概念，你不会在《Rapid\
  \ Prototyping with JS》中找到它们。关于基础主题已经编写了许多优秀书籍——此类资源列表位于书末尾。《Rapid Prototyping with\
  \ JS》的目的是提供敏捷工具，而不是复制编程和计算机科学的理论。\n\n### 先决条件\n\n我们建议准备以下内容以充分利用示例和材料的优势：\n\n* 掌握基础概念，如对象、函数、数据结构（数组、哈希）、循环（for,\
  \ while）、条件（if/else）\n* 基础 Web 开发技能，包括但不限于 HTML 和 CSS\n* 强烈建议使用 Mac OS X 或 UNIX/Linux\
  \ 系统进行本书的示例以及一般的 Web 开发，尽管在 Windows 系统上仍然可以实现。\n* 访问互联网\n* 5-20 小时的时间\n* 某些云服务即使是免费账户也需要用户的信用卡/借记卡信息\n\
  \n### 如何使用本书\n\n电子版（数字版）本书提供三种格式：\n\n1. PDF：适合打印；在 Adobe Reader、Mac OS X Preview、iOS\
  \ 应用和其他 PDF 查看器中打开。\n2. ePub：适合 iPad 和其他 iOS 设备上的 iBook 应用程序；要拷贝到设备请使用 iTunes、Dropbox\
  \ 或发送邮件给自己。\n3. mobi：适合所有代的 Kindle 以及桌面和移动版 Amazon Kindle 应用和 Amazon 云阅读器；要拷贝到设备请使用\
  \ Whispernet、USB 数据线或发送邮件给自己。\n\n这是书的数字版本，因此大多数链接像任何其他网页一样被隐藏了，例如使用 [jQuery](http://jquery.com)\
  \ 而不是 [`jquery.com`](http://jquery.com)。在 PDF 版本中，URL 位于页面底部的脚注中。目录具有本地超链接，允许你跳转到书的任何部分或章节。\n\
  \n在 PDF、EPUB 和 Mobi 版本中，你可以使用书开头的目录（它包含内部链接）跳转到最感兴趣的部分或章节。\n\n\n\n\n\n为了在书籍的不同部分、章节和节之间进行快速导航，请使用基于`Table\
  \ of Contents`（目录）的书籍导航窗（如下所示）。\n\n![Mac OS X 预览应用中的目录面板。](img/navigation.png)\n\
  \nMac OS X 预览应用中的目录面板。\n\n## 示例\n\n书中使用的所有示例源代码大部分都可以在书中找到，也可以在公共 GitHub 仓库 [github.com/azat-co/rpjs](http://github.com/azat-co/rpjs)\
  \ 中找到。你也可以作为 [ZIP 存档](https://github.com/azat-co/rpjs/archive/master.zip) 下载文件或使用\
  \ `Git` 拉取它们。关于如何安装和使用 `Git` 的更多内容将在书中后介绍。源代码文件、文件夹结构和部署文件可以在本地和/或远程在 Pa 解决方案（即\
  \ Windows Azure 和 Heroku）上运行，只需微调或无需修改。\n\n书中的源代码在技术上受到平台限制，宽度约为 70 个字符。我们尽力保留了最好的\
  \ JavaScript 和 HTML 格式样式，但你可能会偶尔看到反斜杠（`\\`）。代码本身没有问题。反斜杠是行转义字符，如果你将代码复制粘贴到编辑器中，示例应该可以正常运行。请注意，GitHub\
  \ 和书中的代码格式可能不同。此外，如果你发现任何 Bug，请通过电子邮件 (hi@rpjs.co) 告诉我们！\n\n## 符号\n\n代码块看起来像这样：\n\
  \n```\n1 var object = {};\n2 object.name = \"Bob\";\n```\n\n终端命令看起来相似，但以美元符号或 `$`\
  \ 开头：\n\n```\n1 $ git push origin heroku\n2 $ cd /etc/\n3 $ ls \n```\n\n内联文件名、路径/文件夹名称、引号以及特殊单词/名称使用*斜体*，而命令名称（例如\
  \ `mongod`）和强调词汇（例如 `Note`）则使用**粗体**。\n\n## 术语\n\n为了本书的目的，我们交替使用一些术语，根据上下文，它们的含义可能并不完全相同。例如：`function`\
  \ = `method` = `call`，`attribute` = `property` = `member` = `key`，`value` = `variable`，`object`\
  \ = `hash` = `class`，`list` = `array`，`framework` = `library` = `module`\n\n## 关于作者\n\
  \n![Azat Mardan：一名软件工程师、作者和瑜伽士。](img/azat.jpg)\n\nAzat Mardan：一名软件工程师、作者和瑜伽士。\n\n\
