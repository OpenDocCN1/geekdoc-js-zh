  \ update` 并更改硬编码的数据库值。\n\n## 8.3 在 Mocha 中使用 Mocha 进行 TDD\n\n### 8.3.1 谁需要测试驱动开发？\n\
  \n假设你需要在现有接口上实现一个复杂的功能，例如在评论上添加“点赞”按钮。如果没有测试，你必须手动创建一个用户、登录、创建一个帖子、创建另一个用户、用另一个用户登录并点赞帖子。很累吗？如果你需要重复\
  \ 10 次或 20 次才能发现并修复某个棘手的 Bug 呢？如果你的功能破坏了现有功能，但由于没有测试，你在发布六个月后才注意到呢？！\n\n不要浪费时间为一次性脚本编写测试，但请在主代码库中养成测试驱动开发的习惯。在开始花一点时间，你和你的团队以后将节省时间，并在发布新版本时充满信心。测试驱动开发真的是非常非常、非常好的事情。\n\
  \n### 8.3.2 快速上手指南\n\n遵循此快速指南，使用 [Mocha](http://visionmedia.github.com/mocha/) 在\
  \ Node.js 中建立你的测试驱动开发流程。\n\n执行以下命令全局安装 [Mocha](http://visionmedia.github.com/mocha/)：\n\
  \n```\n$ sudo npm install -g mocha\n```\n\n我们还会使用两个库：来自 [LearnBoost](https://github.com/LearnBoost)\
  \ 的 [Superagent](https://github.com/visionmedia/superagent) 和 [expect.js](https://github.com/LearnBoost/expect.js/)。要安装它们，请在项目文件夹中运行如下\
  \ [NPM](https://npmjs.org/) 命令：\n\n```\n1 $ npm install superagent\n2 $ npm install\
  \ expect.js \n```\n\n打开一个 `.js` 扩展的新文件并输入：\n\n```\n1 var request = require('superagent');\n\
  2 var expect = require('expect.js');\n```\n\n到目前为止，我们包含了两个库。测试的结构如下：\n\n```\n1 describe('suite',\
  \ function(){\n2   it('test', function(done){\n3     done();\n4   });\n5 });\n```\n\
  \n\n\n\nWintersmith 允许内容和模板使用不同的插件，你甚至可以[编写自己的插件](https://github.com/jnordberg/wintersmith#content-plugins)。\n\
  \n## 8.4.1 入门 Wintersmith\n\n在 [github.com/jnordberg/wintersmith](https://github.com/jnordberg/wintersmith)\
  \ 上有一份快速上手指南。\n\n要全局安装 Wintersmith，请带有 `-g` 和 `sudo` 运行 NPM：\n\n```\n1 $ sudo npm\
  \ install wintersmith -g\n```\n\n然后运行以下命令使用默认博客模板：\n\n```\n1 $ wintersmith new <path>\n\
  ```\n\n或者创建一个空站点：\n\n```\n1 $ wintersmith new <path> -template basic\n```\n\n或者使用快捷键：\n\
  \n```\n1 $ wintersmith new <path> -T basic\n```\n\n类似于 Ruby on Rails 的脚手架工具，Wintersmith\
  \ 将生成一个包含 `contents` 和 `templates` 文件夹的基础骨架。如需预览网站，请运行这些命令：\n\n```\n1 $ cd <path>\n\
  2 $ wintersmith preview\n3 $ open http://localhost:8080\n```\n\n大部分更改会在预览模式下自动更新，但\
  \ [config.json 文件](https://github.com/jnordberg/wintersmith#config) 除外。\n\n图片、CSS、JavaScript\
  \ 和其他文件放入 `contents` 文件夹。Wintersmith 生成器具有以下逻辑：\n\n1. 在 contents 文件夹中查找 `*.md` 文件\n\
