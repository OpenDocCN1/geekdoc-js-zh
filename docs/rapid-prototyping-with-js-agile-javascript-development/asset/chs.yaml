  \n### 5.3 增强聊天功能\n\n在最后两个示例中，聊天程序的功能非常基础。你可以通过添加更多功能来增强应用程序。\n\n适用于 `intermediate`\
  \ 阶段的额外功能：\n\n-   排序消息\n-   防止重复消息\n-   添加消息\n-   删除消息\n-   登录\n-   编辑消息\n-   保存消息\n\
  -   显示消息\n\nBackbone.js 和 Parse.com 聊天程序的完整源代码可以在 [rpjs/sdk](https://github.com/azat-co/rpjs/tree/master/sdk)\
  \ 获取。\n\n\n\n*   `http.listen()`: 在指定的端口和主机名开始接受连接\n*   `http.createClient()`: node\
  \ 应用程序可以作为一个客户端并向其他服务器发送请求\n*   `http.ServerRequest()`: 将传入的请求传递给请求处理器\n\n    **`data`:\
  \ 当接收到消息体的一部分时触发\n    *   `end`: 每个请求恰好触发一次\n    *   `request.method()`: 字符串格式的请求方法\n\
  \    *   `request.url()`: 请求的 URL 字符串\n*   `http.ServerResponse()`: 该对象由 HTTP 服务器内部创建——而不是由用户创建，并作为请求处理器的输出\n\
  \n    *   `response.writeHead()`: 向请求发送响应头\n    *   `response.write()`: 发送响应体\n\
  \    *   `response.end()`: 发送并结束响应体\n\n#### [util](http://nodejs.org/api/util.html)\n\
  \n该模块提供了用于调试的实用程序。部分方法包括：\n\n*   `util.inspect()`: 返回对象的字符串表示，对调试非常有用\n\n#### [querystring](http://nodejs.org/api/querystring.html)\n\
  \n该模块提供了处理查询字符串的实用程序。部分方法包括：\n\n*   `querystring.stringify()`: 将对象序列化为查询字符串\n* \
  \  `querystring.parse()`: 将查询字符串反序列化为对象\n\n#### [url](http://nodejs.org/api/url.html)\n\
  \n该模块具有 URL 解析和解析的实用程序。部分方法包括：\n\n*   `parse()`: 接收 URL 字符串并返回一个对象\n\n#### [fs](http://nodejs.org/api/fs.html)\n\
  \nfs 处理文件系统操作，如读取和写入文件。该库包含同步和异步方法。部分方法包括：\n\n*   `fs.readFile()`: 异步读取文件\n*   `fs.writeFile()`:\
  \ 异步向数据写入文件\n\n不需要安装或下载核心模块。要在你的应用程序中包含它们，只需要遵循以下语法：\n\n```\n1 var http = require('http');\n\
  ```\n\n可以在以下位置找到非核心模块列表：\n\n*   [npmjs.org](https://npmjs.org): Node 包管理器注册表\n*\
  \   [GitHub 托管列表](https://github.com/joyent/node/wiki/Modules): 由 Joyent 维护的 Node.js\
  \ 模块列表\n*   [nodtoolbox.com](http://nodetoolbox.com/): 基于统计的注册表\n*   [Nipster](http://eirikb.github.com/nipster/):\
  \ Node.js 的 NPM 搜索工具\n*   [Node Tracking](http://nodejsmodules.org): 基于 GitHub 统计的注册表\n\
  \n如果你想知道如何编写自己的模块，请查看文章 [你的第一个 Node.js 模块](http://cnnr.me/blog/2012/05/27/your-first-node-dot-js-module/)\n\
  \n#### 6.1.3 Node 包管理器\n\nNode 包管理器（或 NPM）负责为你管理依赖关系并安装模块。Node.js 安装程序自带 NPM，其网站为\
  \ [npmjs.org](http://npmjs.org/)。\n\n`package.json` 包含关于我们 Node.js 应用程序的元信息，如版本号、作者姓名，最重要的是我们在应用程序中使用的依赖项。所有这些信息都在\
  \ JSON 格式的对象中，由 NPM 读取。\n\n如果你想安装 `package.json` 中指定的包和依赖项，请输入：\n\n```\n1 $ npm\
  \ install \n```\n\n一个典型的 `package.json` 文件可能如下所示：\n\n```\n 1 {\n 2    \"name\":\
  \ \"Blerg\",\n 3    \"description\": \"Blerg blerg blerg.\",\n 4    \"version\"\
  : \"0.0.1\",\n 5    \"author\": {\n 6       \"name\" : \"John Doe\", \n 7      \
  \ \"email\" : \"john.doe@gmail.com\"\n 8    },\n 9    \"repository\": {\n10    \
  \    \"type\": \"git\",\n11        \"url\": \"http://github.com/johndoe/blerg.git\"\
  \n12    },\n 13    \"engines\": [\n14        \"node >= 0.6.2\"\n15    ],\n 16  \
  \  \"license\" : \"MIT\",\n 17    \"dependencies\": {\n18        \"express\": \"\
  >= 2.5.6\",\n19        \"mustache\": \"0.4.0\",\n20        \"commander\": \"0.5.2\"\
  \n21    },\n 22    \"bin\" : {\n23        \"blerg\" : \"./cli.js\"\n24    }\n 25\
  \ }\n```\n\n要将包更新到当前最新版本，或 `package.json` 中定义的版本规范允许的最新版本，请使用：\n\n```\n1 $ npm update\
  \ name-of-the-package\n```\n\n或者对于单个模块安装：\n\n```\n1 $ npm install name-of-the-package\n\
  ```\n\n示例中使用的唯一一个且不属于 Node.js 核心包的模块是 `mongodb`。我们将在书的后部分安装它。\n\nHeroku 需要 `package.json`\
  \ 来在服务器上运行 NPM。\n\n有关 NPM 的更多信息，请查看文章 [NPM 之之旅](http://tobyho.com/2012/02/09/)。\n\
  \n#### 6.1.3 部署到 Azure\n\n为了部署，我们需要创建一个仓库。在项目文件夹中执行：\n\n```\n1 $ git init\n```\n\
  \n现在添加文件并进行首次提交：\n\n```\n1 $ git add .\n2 $ git commit -m \"first commit\"\n```\n\
  \n#### 6.1.5 部署到 Azure\n\n为了部署应用程序，我们需要添加 Git 远程。命令与 Windows Azure 类似，但我们需要添加 Git\
  \ 远程：\n\n```\n1 $ remote add azure\n```\n\n完成后，推送并更新：\n\n```\n1 $ git push master\n\
  2 $ git add .\n3 $ git commit -m \"changes\"\n4 $ git push master\n```\n\n### 6.1.6\
  \ 部署到 Heroku\n\n对于 Heroku 部署，我们需要创建额外的文件：`Procfile` 和 `package.json`。\n\n在我们的项目文件夹中拥有所有文件后，可以使用\
  \ Git 部署应用程序。命令与之前类似，但我们需要添加 Git 远程，并使用以下命令创建：\n\n```\n1 $ heroku create\n```\n\n\
  完成后，推送并更新：\n\n```\n1 $ git push heroku master\n2 $ git add .\n3 $ git commit -am\
  \ \"changes\"\n4 $ git push heroku master\n```\n\n#### 6.2 聊天：内存版本\n\n为了遵循 KISS\
  \ 原则（保持简单），聊天后端应用程序的第一个版本将消息存储在内存存储中。这意味着每次我们启动/重置服务器时，数据都会丢失。\n\n我们将从一个简单的测试用例开始，以说明测试驱动开发（TDD）方法。\n\
  \n#### 6.3 聊天测试用例\n\n我们应该有两个方法：\n\n1.  使用 `getMessages()` 方法为 GET `/message` 端点以\
  \ JSON 对象数组的形式获取所有消息。\n\n\n\n\n\n## 2. 通过 `addMessage()` 函数为 POST `/messages` 路由添加带有\
  \ `name` 和 `message` 属性的新消息\n\n我们首先创建一个空的 `mb-server.js` 文件。创建完成后，让我们切换到测试，并创建一个包含以下内容的\
  \ `test.js` 文件：\n\n```\n 1 var http = require('http');\n 2 var assert = require('assert');\n\
  \ 3 var querystring = require('querystring');\n 4 var util = require('util');\n\
  \ 5 \n 6 var messageBoard = require('./mb-server');\n 7 \n 8 assert.deepEqual('[{\"\
  name\":\"John\",\"message\":\"hi\"}]',\n 9   messageBoard.getMessages());\n10 assert.deepEqual\
  \ ('{\"name\":\"Jake\",\"message\":\"gogo\"}',\n11   messageBoard.addMessage (\"\
  name=Jake&message=gogo\"));\n12 assert.deepEqual('[{\"name\":\"John\",\"message\"\
  :\"hi\"},{\"name\":\"Jake\",\"message\":\"gogo\"}]', \n13   messageBoard.getMessages(\"\
  name=Jake&message=gogo\"));\n```\n\n请记住，这是一个非常简化的字符串比较，而不是 JavaScript 对象。因此，每个空格、引号和大小写至关重要。你可以通过将字符串解析为\
  \ JSON 对象来让比较变得更“智能”：\n\n```\n1 JSON.parse(str);\n```\n\n为了测试我们的假设，我们使用了 Node.js\
  \ 的核心模块 [assert](http://nodejs.org/api/assert.html)。它提供了很多实用的方法，如 `equal()`、`deepEqual()`\
  \ 等。\n\n更高级的库包括提供了具有 TDD 和/或 BDD 方法的备选接口：\n\n* [Should](https://github.com/visionmedia/should.js/)\n\
  * [Expect](https://github.com/LearnBoost/expect.js/)\n\n对于更多的测试驱动开发和前沿的自动化测试，你可以使用以下库和模块：\n\
  \n* [Mocha](http://visionmedia.github.com/mocha/)\n* [NodeUnit](https://github.com/caolan/nodeunit)\n\
  * [Jasmine](http://pivotal.github.com/jasmine/)\n* [Vows](http://vowsjs.org/)\n\
  * [Chai](http://chaijs.com/)\n\n你现在可以将“Hello World”脚本复制到 `mb-server.js` 文件中，甚至保持它为空。如果我们通过终端命令运行\
  \ `test.js`：\n\n```\n1 $ node test.js \n```\n\n我们应该会看到一个错误。可能类似于这样：\n\n```\n1 TypeError:\
  \ Object #<Object> has no method 'getMessages'\n```\n\n这完全没，因为我们还没有写 `getMessages()`\
  \ 方法。所以让我们来实现它，通过添加两个新方法让我们的应用程序更有用：获取聊天的消息列表，以及向集合中添加新消息。\n\n### 带有全局 `exports`\
  \ 对象的 mb-server.js 文件：\n\n```\n1 exports.getMessages = function() {\n2   return\
  \ JSON.stringify(messages);\n3 };\t\n4 exports.addMessage = function (data){\t\t\
  \n5   messages.push(querystring.parse(data));\n6   return JSON.stringify(querystring.parse(data));\t\
  \n7 };\n```\n\n到为止，没什么特别，对吧？为了存储消息列表，我们将使用数组：\n\n```\n1 var messages=[];\n2 //这个数组将持有我们的消息\n\
  3 messages.push({\n4   \"name\":\"John\",\n5   \"message\":\"hi\"\n6 });\n7 //用于测试列表方法的示例消息\n\
  ```\n\n| ![tip](img/leanpub_tip.png) | **提示**: 通常情况下，像虚拟数据这样的固定设备属于测试/规范文件，而不属于主应用程序代码库。\
  \ |\n\n我们的服务器代码看起来会稍微有趣一点。获取消息列表，根据 REST 方法论，我们需要发送 GET 请求。对于创建/添加新消息，应该是一个 POST\
  \ 请求。因此在我们的 `createServer` 对象中，我们应该添加 `req.method()` 和 `req.url()` 来检查 HTTP 请求类型和\
  \ URL 路径。\n\n加载 `http` 模块：\n\n```\n1 var http = require('http');\n```\n\n我们需要 `util`\
  \ 和 `querystring` 模块中的一些方便函数（用于序列化和反序列化对象以及查询字符串）：\n\n```\n1 var util = require('util');\n\
  2 var querystring = require('ystring');\n```\n\n创建一个服务器并将其暴露给外部模块（即 `test.js`）：\n\
  \n```\n1 exports.server=http.createServer(function (req, res) {\n```\n\n在请求处理器回调内部，我们应该检查请求方法是否为\
  \ POST 且 URL 为 `/messages/create.json`：\n\n```\n1   if (req.method == \"POST\" &&\
  \ \n2     req.url == \"/messages/create.json\") {\n```\n\n如果上述条件成立，我们将消息添加到数组中。然而，在添加之前\
  \ `data` 必须转换为字符串类型（使用 UTF-8 编码），因为它是一个 Buffer 类型：\n\n```\n1     var message = '';\n\
  2     req.on('data', function(data, message){\n3       console.log(data.toString('utf-8'));\n\
  4       message = exports.addMessage(data.toString('utf-8'));\n```\n\n这些日志将帮助我们在终端中监控服务器活动：\n\
  \n```\n1     })\n2     console.log(util.inspect(message, true, null));\n3     console.log(util.inspect(messages,\
  \ true, null));\n```\n\n输出应为文本格式且状态码为 200：\n\n```\n1     res.writeHead(200, {\n\
  2       'Content-Type': 'text/plain'\n3     });\n```\n\n我们输出新创建的消息：\n\n```\n1  \
  \   res.end(message);\n2   }\n```\n\n如果方法是 GET 且 URL 为 `/messages/list.json`，则输出消息列表：\n\
  \n```\n1   if (req.method == \"GET\" && \n2     req.url == \"/messages/list.json\"\
  ) {\n```\n\n获取消息列表：\n\n```\n1     var body = exports.getMessages();\n```\n\n响应体将包含我们的输出：\n\
  \n```\n1     res.writeHead(200, {\n2       'Content-Length': body.length,\n3   \
  \    'Content-Type': 'text/plain'\n4     });\n5     res.end(body);\n6   }\n7   else\
  \ {\n```\n\n设置正确的头部和状态码：\n\n```\n1     res.writeHead(200, {\n2       'Content-Type':\
  \ 'text/plain'\n3     });\n```\n\n如果不是上述两个端点之一，我们输出一个带有换行符的字符串：\n\n```\n1     res.end('Hello\
  \ World\\n');\n2   };\n3   console.log(req.method);\n```\n\n```\n1 }).listen(1337,\
  \ \"127.0.0.1\");\n```\n\n现在，我们应该设置服务器的端口和 IP 地址：\n\n```\n1 console.log('Server\
  \ running at http://127.0.0.1:1337/');\n```\n\n我们在 `test.js` 中导出单元测试的方法（`exports`\
  \ 关键字），该函数返回字符串/文本格式的消息数组：\n\n```\n1 exports.getMessages = function() {\n2   return\
  \ JSON.stringify(messages);\n3 };\n```\n\n`addMessage()` 使用 `querystring` 的 `parse`\
  \ 反序列化方法将字符串转换为 JavaScript 对象：\n\n```\n1 exports.addMessage = function (data){\n\
  2   messages.push(querystring.parse(data));\n```\n\n同时也返回一个 JSON 字符串格式的新消息：\n\n\
  ```\n1   return JSON.stringify(querystring.parse(data));\n2 };\n```\n\n这里是 `mb-server.js`\
  \ 的完整代码。它在 [rpjs/test](https://github.com/azat-co/rpjs/tree/master/test) 处也可用：\n\
  \n\n\n\n\n```javascript\nvar http = require('http');\n//加载 http 模块\nvar util = require('util');\n\
  //实用函数\nvar querystring = require('querystring');\n//加载 querystring 模块，\n//我们需要它来序列化和反序列化对象以及查询字符串\n\
  \nvar messages=[];\n//这个数组将存储我们的消息\nmessages.push({\n  \"name\": \"John\",\n  \"\
  message\": \"hi\"\n});\n//用于测试列表方法的示例消息\n\nexports.server=http.createServer(function\
  \ (req, res) {\n  //创建服务器\n  if (req.method == \"POST\" && \n    req.url == \"/messages/create.json\"\
  ) {\n    //如果方法是 POST 且\n    // URL 是 messages/，则将消息添加到数组\n    var message = '';\n\
  \    req.on('data', function(data, message){\n      console.log(data.toString('utf-8'));\n\
  \      message = exports.addMessage(data.toString('utf-8'));\n      //data 是 Buffer\
  \ 类型，\n      // 必须先用 UTF-8 编码转换为字符串\n      // 将消息添加到数组\n    })\n    console.log(util.inspect(message,\
  \ true, null));\n    console.log(util.inspect(messages, true, null));\n    //将调试输出到终端\n\
  \    res.writeHead(200, {\n      'Content-Type': 'text/plain'\n    });\n    //设置正确的头部和状态码\
  \   \n    res.end(message);\n    //输出消息，应该包含对象 ID\n  }\n  if (req.method == \"GET\"\
  \ && \n    req.url == \"/messages/list.json\") {\n    //如果方法是 GET 且\n    // URL\
  \ 是 /messages，输出消息列表\n    var body = exports.getMessages();\n    //body 将包含我们的输出\n\
  \    res.writeHead(200, {\n      'Content-Length': body.length,\n      'Content-Type':\
  \ 'text/plain'\n    });\n    res.end(body);\n  }\n  else {\n    res.writeHead(200,\
  \ {\n      'Content-Type': 'text/plain'\n    });\n    //设置正确的头部和状态码\n    res.end('Hello\
  \ World\\n');\n  };\n  console.log(req.method);\n  //输出带有行尾符号的字符串\n}).listen(1337,\
  \ \"127.0.0.1\");\n//设置服务器的端口和 IP 地址\nconsole.log('Server running at http://127.0.0.1:1337/');\n\
  \nexports.getMessages = function() {\n  return JSON.stringify(messages);\n  //将消息数组作为字符串/文本输出\n\
  };\nexports.addMessage = function (data){\n  messages.push(querystring.parse(data));\n\
  \  //将字符串转换为\n  // JavaScript 对象，我们使用 parse/反序列化\n  return JSON.stringify(querystring.parse(data));\n\
  \  //以 JSON 字符串的形式输出新消息\n};\n```\n\n要检查它，请访问 [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json)。你应该能看到一个示例消息。或者，你使用终端命令：\n\
  \n```\n$ curl http://127.0.0.1:1337/messages/list.json\n```\n\n使用命令行界面发送 POST 请求：\n\
  \n```bash\ncurl -d \"name=BOB&message=test\" http://127.0.0.1:1337/messages/create.json\n\
  ```\n\n并且你应该会在服务器终端窗口中获得输出，并在刷新 [localhost:1337/messages/list.json](http://localhost:1337/messages/list.json)\
  \ 时看到新消息“test”。不用多说，所有三个测试都应该通过。\n\n你的应用程序可能会随着方法、需要解析的 URL 路径和条件的增加而变得更大。这正是框架大显身手的地方。它们提供了处理请求的助手以及其他功能，如静态文件支持、会\
  \ 等。在这个示例中，我们故意没有使用任何框架，如 Express ([`expressjs.com/`](http://expressjs.com/)) 或\
  \ Restify ([`mcavage.github.com/node-restify/`](http://mcavage.github.com/node-restify/))。其他值得的\
  \ Node.js 框架：\n\n- [Derby](http://derbyjs.com/): MVC 框架，使其易于编写在 Node.js 和浏览器中共同运行的实时协作应用程序\n\
  - [Express.js](http://expressjs.com):最稳健、经过测试且被最广泛使用的 Node.js 框架\n- [Restify](http://mcavage.github.com/node-restify/):一个用于用\
  \ Node.js 构建微服务的快速、灵活的框架\n\n\n\n\n或者，为了你自己的开发，你可以使用其他的映射器（mappers），它们原生驱动（Native\
  \ Driver）的扩展可用：\n\n* [Mongoskin](https://github.com/guileen/node-mongoskin): `node-mongodb-native`\
  \ 的未来层。\n* [Mongoose](http://mongoosejs.com/): 带有可选建模支持的异步 JavaScript 驱动。\n* [Mongolia](https://github.com/masylum/mongolia):\
  \ 轻量级 MongoDB ORM/驱动封装。\n* [Monk](https://github.com/LearnBoost/monk): `Monk` 是一个微型层，为\
  \ Node.js 中的 MongoDB 使用提供了简单而实质性的易用性改进。\n\n这个小示例将测试我们是否可以从 Node.js 脚本连接到本地 MongoDB\
  \ 实例。\n\n在安装库之后，我们可以在 `db.js` 文件中引入 `mongodb` 库：\n\n```\n1 var util = require('util');\n\
  2 var mongodb = require ('mongodb');\n```\n\n这是建立与 MongoDB 服务器连接的方法之一，其中 `db` 变量将持有指定主机和端口的数据库引用：\n\
  \n```\n1 var Db = mongodb.Db;\n2 var Connection = mongodb.Connection;\n3 var Server\
  \ = mongodb.Server;\n4 var host = '127.0.0.1';\n5 var port = 27017;\n6 \n7 var db=new\
  \ Db ('test', new Server(host,port, {}));\n```\n\n要实际打开连接：\n\n```\n1 db.open(function(e,c){\n\
  2 \t//在此处对数据库进行操作\n3   // console.log (util.inspect(db));\n4   console.log(db._state);\n\
  5   db.close();\n6 });\n```\n\n这段代码段位于 [rpjs/db/db.js](https://github.com/azat-co/rpjs/blob/master/db/db.js)\
  \ 下。如果我们运行它，终端应该输出“connected”。当你不确定并需要检查对象的属性时，`util` 模块中有一个非常有用的方法：\n\n```\n1 console.log(util.inspect(db));\n\
  ```\n\n### 6.4.3 Heroku  MongoDB: MongoHQ\n\n在本地成功运行显示“connected”的应用程序后，是时候对其进行微调并部署到平台即服务（即\
  \ Heroku）了。\n\n我们建议使用 [MongoHQ add-on](https://addons.heroku.com/mongohq)，它是 [MongoHQ](https://www.mongohq.com/home)\
  \ 技术的一部分。它提供了一个基于浏览器的 GUI 来查找和操作数据及集合。更多信息请访问 [`devcenter.heroku.com/articles/mongohq`](https://devcenter.heroku.com/articles/mongohq)。\n\
  \n| ![information](img/leanpub_information.png) |  \n\n#### 注意\n\n 即使你选择了免费版本，你可能也需要提供信用卡信息才能使用\
  \ MongoHQ。不过，你不应该被收取费用。 |\n\n为了连接到数据库服务器，有一个数据库连接 URL（也称为 MongoHQ URL/URI），这在一个字符串中传输所有连接数据库所需信息的方法。\n\
  \n数据库连接字符串 `MONGOHQ_URL` 具有以下格式：\n\n```\n1 mongodb://user:pass@server.mongohq.com/db_name\n\
  ```\n\n你可以从 Heroku 网站复制 MongoHQ URL 字符串（并硬编码），或者从 Node.js 的 `process.env` 对象获取该字符串：\n\
  \n```\n1 process.env.MONGOHQ_URL;\n```\n\n或者\n\n```\n1 var connectionUri = url.parse(process.env.MONGOHQ_URL);\n\
  ```\n\n| ![tip](img/leanpub_tip.png) |  \n\n#### 提示\n\n全局对象 `process` 通过 `process.env`\
  \ 访问环境变量。这些变量通常用于传递数据库主机名和端口、密码、API 密钥、端口号以及不应硬编码到主逻辑中的系统信息。\n\n为了让我们的代码在本地和 Heroku\
  \ 上都能运行，我们可以使用逻辑或运算符 `||`，并在环境变量未定义时分配本地主机和端口：\n\n```\n1 var port = process.env.PORT\
  \ || 1337;\n2 var dbConnUrl = process.env.MONGOHQ_URL || \n3   'mongodb://@127.0.0.1:27017';\n\
  ```\n\n这是我们更新后的跨环境可用 `db.js` 文件：\n\n```\n 1 var url = require('url')\n 2 var util\
  \ = require('util');\n3 var mongodb = require ('mongodb');\n4 var Db = mongodb.Db;\n\
  5 var Connection = mongodb.Connection;\n6 var Server = mongodb.Server;\n 7\n 8 var\
  \ dbConnUrl = process.env.MONGOHQ_URL ||\n9 'mongodb://127.0.0.1:27017';\n10 var\
  \ host = url.parse(dbConnUrl).hostname;\n11 var port = new Number(url.parse(dbConnUrl).port);\n\
  12  \n13 var db=new Db ('test', new Server(host,port, {}));\n14 db.open(function(e,c){\n\
  15   // console.log (util.inspect(db));\n16   console.log(db._state);\n17 });\n\
  ```\n\n\n\n\n这里是关于如何在 Node.js 代码中使用 MongoDB 的教程：[mongodb.github.com/node-mongodb-native/api-articles/nodekoarticle1.html](http://mongodb.github.com/node-mongodb-native/api-articles/nodekoarticle1.html)。\n\
  \n另一种方法是使用 MongoHQ 模块，地址为 [github.com/MongoHQ/mongohq-nodejs](https://github.com/MongoHQ/mongohq-nodejs)。\n\
  \n此示例演示了 `mongodb` 库的另一种用法，通过输出集合和文档计数。完整源代码来自 [rpjs/db/collections.js](https://github.com/azat-co/rpjs/blob/master/db/collections.js)：\n\
  \n```\n 1 var mongodb = require('mongodb');\n 2 var url = require('url');\n 3 var\
  \ log = console.log;\n 4 var dbUri = process.env.MONGOHQ_URL || 'mongodb://localhost:27017/test';\n\
  \ 5 \n 6 var connectionUri = url.parse(dbUri);\n 7 var dbName = connectionUri.pathname.replace(/^\\\
  //, '');\n 8 \n 9 mongodb.Db.connect(dbUri, function(error, client) {\n10   if (error)\
  \ throw error;\n11 \n12   client.collectionNames(function(error, names){\n13   \
  \  if(error) throw error;\n14 \n15     //output all collection names\n16     log(\"\
  Collections\");\n17     log(\"===========\");\n18     var lastCollection = null;\n\
  19     names.forEach(function(colData){\n20       var colName = colData.name.replace(dbName\
  \ + \".\", '')\n21       log(colName);\n22       lastCollection = colName;\n23 \
  \    });\n24     if (!lastCollection) return;\n25     var collection = new mongodb.Collection(client,\
  \ lastCollection);\n26     log(\"\\nDocuments in \" + lastCollection);\n27     var\
  \ documents = collection.find({}, {limit:5});\n28 \n29     //output a count of all\
  \ documents found\n30     documents.count(function(error, count){\n31       log(\"\
  \  \" + count + \" documents(s) found\");\n32       log(\"====================\"\
  );\n33 \n34       // output the first 5 documents\n35     documents.toArray(function(error,\
  \ docs) {\n36         if(error) throw error;\n37 \n38         docs.forEach(function(doc){\n\
  39           log(doc);\n40         });\n41      \n42         // close the connection\n\
  43         client.close();\n44       });\n45     });\n46   });\n47 });\n```\n\n\
  我们使用 `var log = console.log;` 为 `console.log()` 做了简写，并通过 `if (!lastCollection) return;`\
  \ 作为控制流。\n\n### 6.4.4 BSON\n\n二进制 JSON（Binary JSON，简称 BSON）是 MongoDB 利用的一种特殊数据类型。它的表示法与\
  \ JSON 相似，但支持更多更复杂的数据类型。\n\n| ![warning](img/leanpub_warning.png) |  \n\n### 警告\n\
  \n关于 BSON 的一点提示：MongoDB 中的 `ObjectId` 等同于 MongoDB Native Node.js 驱动中的 `ObjectID`，即确保使用正确的大小写。否则你将报错。更多关于类型的信息请参考：[MongoDB\
  \ 中的 ObjectId](http://www.mongodb.org/display/DOCS/Object+IDs) 与 [MongoDB Native\
  \ Node.js Driver 中的数据类型](https://github.com/mongodb/node-mongodb-native/#data-types)。使用\
  \ `mongodb.ObjectID()` 的 Node.js 代码示例：`collection.findOne({_id: new ObjectID(idString)},\
  \ console.log) // ok`。另一方面，在 MongoDB shell 中，我们使用：`db.messages.findOne({_id:ObjectId(idStr)});`。\n\
  \n## 6.5 聊天：MongoDB 版本\n\n我们应该准备好编写 Node.js 应用的所有工作，它可以在本地也可以在 Heroku 上运行。源代码可以在\
  \ [rpjs/mongo](https://github.com/azat-co/rpjs/tree/master/mongo) 获取。应用程序的结构简单：\n\
  \n```\n1 /mongo\n2   -web.js\n3   -Procfile\n4   -package.json\n```\n\n这是 `web.js`\
  \ 的样子；首先我们包含了库：\n\n```\n1 var http = require('http');\n2 var util = require('util');\n\
  3 var querystring = require('querystring');\n4 var mongo = require('mongodb');\n\
  ```\n\n然后输出一个连接 MongoDB 的魔法字符串：\n\n```\n1 var host = process.env.MONGOHQ_URL ||\
  \ \"mongodb://@127.0.0.1:27017/twitter-clone\";\n2 //MONGOHQ_URL=mongodb://user:pass@server.mongohq.com/db_name\n\
  ```\n\n| ![information](img/leanpub_information.png) |  \n\n### 注意\n\nURI/URL 格式包含了可选的数据库名称，我们的集合将存储其中。可以随时将其更改其他内容，例如‘rpjs’或‘test’。\
  \ |\n\n我们将所有逻辑以回调函数的形式写在打开的连接内部：\n\n```\n 1 mongo.connect(host, function(error,\
  \ db) {\n2   if (error) throw error;\n3 \n4   var collection = db.collection('messages');\n\
  5   var server = http.createServer(function(req, res) {\n6     if (req.method ===\
  \ 'GET') {\n7       collection.find({}).toArray(function(error, docs) {\n8     \
  \    if (error) throw error;\n9         res.writeHead(200, {'Content-Type': 'application/json'});\n\
  10        res.end(JSON.stringify(docs));\n11      });\n12    } else if (req.method\
  \ === 'POST') {\n13      var body = '';\n14      req.on('data', function(chunk)\
  \ {\n15        body += chunk;\n16      });\n17      req.on('end', function() {\n\
  18        var data = querystring.parse(body);\n19        collection.insert(data,\
  \ function(error, result) {\n20          if (error) throw error;\n21          res.writeHead(200,\
  \ {'Content-Type': 'application/json'});\n22          res.end(JSON.stringify(result));\n\
  23        });\n24      });\n25    }\n26  });\n27 \n28  server.listen(port);\n29\
  \ });\n30 });\n```\n\n\n\n\n\n# 总结：不同部署方法的说明、Chat 应用的最终版本及其部署。\n\n> *“调试比最初编写代码要困难一倍。因此，如果你编写代码时尽可能巧妙，那么从定义上来说，你就不够聪明去调试它。”*\
  \ — [Brian W. Kernighan](http://en.wikipedia.org/wiki/Brian_Kernighan)\n\n现在，如果我们能将前端和后端应用放在一起让它们协同工作，那就好了。有几种实现方法：\n\
  \n*   前端和后端应用使用不同的域名（Heroku 应用）：通过使用 `CORS` 或 `JSONP` 确保没有跨域问题。这种方法将在后文中进行详细介绍。\n\
  *   同域名部署：确保 `Node.js` 处理前端应用程序的静态资源和资产——不建议用于正式的生产环境应用。\n\n### 7.1 不同域名部署\n\n到目前为止，这是生产环境的最佳实践。后端应用通常部署在\
  \ `http://app.*` 或 `http://api.*` 子域名下。\n\n实现跨域名部署的一种方法是使用 `JSONP` 克服 AJAX 技术的同源限制：\n\
  \n```\n1 var request = $.ajax({\n2   url: url,\n3   dataType: \"jsonp\",\n4   data:\
  \ {...},\n5   jsonpCallback: \"fetchData\",\n6   type: \"GET\" \n7 });\n```\n\n\
  另一种更好的方法是在输出之前，在 `Node.js` 服务器应用中添加 `OPTIONS` 方法和特殊的请求头（这些称为 `CORS`）：\n\n```javascript\n\
  1   ...\n2   response.writeHead(200,{\n3     'Access-Control-Allow-Origin': origin,\n\
  4     'Content-Type':'text/plain',\n5     'Content-Length':body.length\n6   });\n\
  7   ...\n```\n\n或者\n\n```javascript\n1   ...\n2   res.writeHead(200, {\n3     'Access-Control-Allow-Origin',\
  \ 'your-domain-name',\n4     ...\n5   });\n6   ...\n```\n\n对 `OPTIONS` 方法的需求在 [HTTP\
  \ 访问控制 (CORS)](https://developer.mozilla.org/en-US/docs/HTTP_access_control) 中有所概述。`OPTIONS`\
  \ 请求可以按照以下方式处理：\n\n```javascript\n 1   ...\n 2   if (request.method==\"OPTIONS\"\
  ) {\n 3     response.writeHead(\"204\", \"No Content\", {\n 4       \"Access-Control-Allow-Origin\"\
  : origin,\n 5       \"Access-Control-Allow-Methods\": \n 6         \"GET, POST,\
  \ PUT, DELETE, OPTIONS\",\n 7       \"Access-Control-Allow-Headers\": \"content-type,\
  \ accept\",\n 8       \"Access-Control-Max-Age\": 10, // 秒。\n 9       \"Content-Length\"\
  : 0\n10     });            \n11     response.end();\n12   };\n13   ...\n```\n\n\
  ### 7.2 更改端点\n\n我们的前端应用之前使用 `Parse.com` 作为后端应用。现在我们可以切换到自己的后端（是的，这非常简单！）。前端应用的源码位于\
