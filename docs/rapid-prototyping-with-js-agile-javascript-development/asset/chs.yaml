  \ 23                  </p>\n 24                  <p>\n 25                    <a\
  \ \n 26                      class=\"btn btn-primary btn-large\"\n 27          \
  \            href=\"http://twitter.github.com/bootstrap\"\n 28                 \
  \     target=\"_blank\">\n 29                      了解更多 \n 30                  \
  \  </a>\n 31                  </p>\n 32                </div>  <!-- hero-unit -->\n\
  \ 33            </div>  <!-- span12 -->\n 34          </div> <!-- row-fluid -->\n\
  \ 35      </div>  <!-- content -->\n 36      </div>  <!-- span12 -->\n 37    </div>\
