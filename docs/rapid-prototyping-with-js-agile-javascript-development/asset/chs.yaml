  \ 定制 Bootstrap 主题集合\n*   [WrapBootstrap](https://wrapbootstrap.com/): Bootstrap\
  \ 主市场\n\n### 3.4 LESS\n\nLESS 是一种动态样式表语言。有时，在这种情况下，多即是少](https://en.wikipedia.org/wiki/The_Paradox_of_Choice:_Why_More_Is_Less)。\n\
  \n浏览器无法解释 LESS 语法，因此 LESS 源代码必须通过以下三种方式之一编译为 CSS：\n\n1.  在浏览器中通过 [LESS JavaScript\
  \ 库](http://lesscss.googlecode.com/files/less-1.3.0.min.js)\n2.  在服务器端通过语言/框架，例如\
  \ Node.js 有 [LESS 模块](https://npmjs.org/package/less)\n3.  在你的 Mac OS X 本地通过 [LESS\
  \ App](http://incident57.com/less/)、[SimLESS](http://wearekiss.com/simpless) 或类似的应用程序\n\
  \n| ![warning](img/leanpub_warning.png) | |\n| :--- | :--- |\n| 警告 | 选项 1 用于开发环境尚可，但对于生产环境并非最优。\
  \ |\n\n#### 3.4.1 变量变量减少冗余并允许通过一个规范的位置快速更改值。我们知道在设计（和样式）中经常需要更改值！\n\nLESS 拥有变量、混合和运算符，使得开发者能够更快地复用\
  \ CSS 规则。\n\n```\n1 @color: #4D926F;\n2 #header {\n3   color: @color;\n4 }\n5 h2\
  \ {\n6   color: @color;\n7 }\n```\n\n等同于 CSS：\n\n\n\n\n\n```css\n1 #header {\n2\
  \   color: #4D926F;\n3 }\n4 h2 {\n5   color: #4D926F;\n6 }\n```\n\n### 3.4.2 Mixins（混合入）\n\
  \n这是 mixin 的语法，它的作用类似于函数：\n\n```less\n 1 .rounded-corners (@radius: 5px) {\n 2 \
  \  border-radius: @radius;\n 3   -webkit-border-radius: @radius;\n 4   -moz-border-radius:\
  \ @radius;\n 5 }\n 6 \n 7 #header {\n 8   .rounded-corners;\n 9 }\n10 #footer {\n\
  11   .rounded-corners(10px);\n12 }\n```\n\n转换为 CSS 后：\n\n```css\n 1 .rounded-corners\
  \ (@radius: 5px) {\n 2   border-radius: @radius;\n 3   -webkit-border-radius: @radius;\n\
  \ 4   -moz-border-radius: @radius;\n 5 }\n 6 \n 7 #header {\n 8   border-radius:\
  \ 5px;\n 9   -webkit-border-radius: 5px;\n10   -moz-border-radius: 5px;\n11 }\n\
  12 #footer {\n13   border-radius: 10px;\n14   -webkit-border-radius: 10px;\n15 \
  \  -moz-border-radius: 10px;\n16 }\n```\n\nMixins 可以不带参数使用，也可以带有多个参数使用。\n\n### 3.4.3\
  \ 操作\n\n通过操作，我们可以对数字、颜色或变量执行数学函数计算。\n\nLESS 中运算符的示例：\n\n```less\n 1 @the-border:\
  \ 1px;\n 2 @base-color: #111;\n 3 @red:        #842210;\n 4 \n 5 #header {\n 6 \
  \  color: @base-color * 3;\n 7   border-left: @the-border;\n 8   border-right: @the-border\
  \ * 2;\n 9 }\n10 #footer { \n11   color: @base-color + #003300;\n12   border-color:\
  \ desaturate(@red, 10%);\n13 }\n```\n\n上述代码编译为如下 CSS：\n\n```css\n 1 @the-border:\
  \ 1px;\n 2 @base-color: #111;\n 3 @red:        #842210;\n 4 \n 5 #header {\n 6 \
  \  color: #333333;\n 7   border-left: 1px;\n 8   border-right: 2px;\n 9 }\n10 #footer\
  \ { \n11   color: #114411;\n12   border-color: #7d2717;\n13 }\n```\n\n如你所见，LESS\
  \ 极大地提高了原生 CSS 的重用性。以下是一些用于编译的在线工具：\n\n* [LESS2CSS](http://less2css.org/):基于 Express.js\
  \ 构建的流畅浏览器端 LESS 到 CSS 转换器\n* [lessphp](http://leafo.net/lessphp/):在线演示版编译器\n* [Dopefly](http://www.dopefly.com/LESS-Converter/less-converter.html):在线\
  \ LESS 转换器\n\n其他 [LESS 特](http://lesscss.org/#docs)还包括：\n\n* 模式匹配\n* 嵌套规则\n* 函数\n\
  * 命名空间\n* 作用域\n* 注释\n* 导入\n\n### 3.5 使用第三方 API (Twitter) 和 jQuery 的示例\n\n该示例仅用于演示目的。它不是后续章节中涵盖的主\
  \ Chat 应用程序的一部分。目标仅仅是说明 jQuery、JSONP 和 REST API 技术的结合。请浏览代码但不要尝试运行它，因为 Twitter 最近弃用了其\
  \ API `v1.0`。此应用程序可能无法原样运行。如果你仍然想运行此示例，请按照下面的说明操作（风险自担），可以从 GitHub 下载或从 PDF 版本中复制粘贴。\n\
  \n| ![information](img/leanpub_information.png) | |\n\n### 注意事项\n\n此示例使用 Twitter\
  \ API `v1.0` 构建，可能无法在 Twitter API `v1.1` 上工作，后者对 REST API 调用需要用户身份验证。你可以在 [dev.twitter.com](https://dev.twitter.com)\
  \ 获取必要的密钥。\n\n在此示例中，我们将使用 jQuery 的 `$.ajax()` 函数。它的语法如下：\n\n```javascript\n1 var\
  \ request = $.ajax({\n2     url: url,\n3     dataType: \"jsonp\",\n4     data: {page:page,\
  \ ...},\n5     jsonpCallback: \"fetchData\"+page,\n6     type: \"GET\" \n7 });\n\
  ```\n\n在在方的 `ajax()` 函数代码段中，我们使用了以下参数：\n\n* `url` 是 API 的端点\n* `dataType` 是我们期望从服务器接收的数据类型，例如，“json”，“xml”\n\
  * `data` 是要发送到服务器的数据\n* `jsonpCallback` 是字符串形式的函数名\n* `type` 是 HTTP 方法\n\n```javascript\n\
  $(document).ready(function() {\n  $('#btn').click(function() {\n    var username\
