  3 }); \n```\n\n\n\n\n### 5. Backbone.js 和 Parse.com\n\n**摘要**：演示了 Backbone.js 与\
  \ Parse.com 及其 JavaScript SDK 在修改后的聊天应用中的用法；建议的额外功能列表。\n\n> “Java 之于 JavaScript\
  \ 就像汽车之于毯。” —— [Chris Heilmann](http://christianheilmann.com/)\n\n如果你编写过一些复杂的客户端应用，可能会发现维护\
  \ JavaScript 回调和 UI 事件的混乱代码是非常挑战性的。Backbone.js 提供了一种轻量且强大的方法，可以将你的逻辑组织成模型-视图-控制器（MVC）类型的结构。它还具有\
  \ URL 路由、REST API 支持、事件监听器和触发器等非常棒的功能。有关更多信息以及从零构建 Backbone.js 应用的逐步示例，请参阅 *Intro\
  \ to Backbone.js* 章节。\n\n\n\n\n你可以在 [backbonejs.org](http://backbonejs.org) 下载 Backbone.js\
  \ 库。然后，当你像包含其他 JavaScript 文件一样将其放在主 HTML 文件的 `head`（或 `body`）中，你就可以访问 `Backbone`\
  \ 类了。例如，创建一个路由器：\n\n```javascript\n var ApplicationRouter = Backbone.Router.extend({\n\
  \  routes: {\n    \"\": \"home\",\n    \"signup\": \"signup\",\n    \"*actions\"\
  : \"home\"\n  },\n  initialize: function() {\n    this.headerView = new HeaderView();\n\
  \    this.headerView.render();\n    this.footerView = new FooterView();\n    this.footerView.render();\n\
  \  },\n  home: function() {\n    this.homeView = new HomeView();\n    this.homeView.render();\n\
  \  },\n  signup: function() {\n    ...\n  }\n});\n```\n\nView、Models 和 Collections\
  \ 的创建方式相同：\n\n```javascript\n HeaderView = Backbone.View.extend({\n  el: \"#header\"\
  ,\n  template: '<div>...</div>',\n  events: {\n    \"click #save\": \"saveMessage\"\
  \n  },\n  initialize: function() {\n    this.collection = new Collection();\n  \
  \  this.collection.bind(\"update\", this.render, this);\n  },\n  saveMessage: functiton()\
  \ {\n    ...\n  },\n  render: function() {\n    $(this.el).html(_.template(this.template));\n\
  \  }\n}); \n\nModel = Backbone.Model.extend({\n  url: \"/api/item\"\n  ...\n});\
  \ \n\nCollection = Backbone.Collection.extend({\n  ...\n});\n```\n\n关于 Backbone.js\
  \ 的更多详细信息，请参考 *Intro to Backbone.js* 章节。\n\n### 5.1 与 Parse.com 聊天：JavaScript SDK\
  \ 和 Backbone.js 版本\n\n显易看出，如果我们继续添加更多如“DELETE”、“UPDATE”以及其他功能的按钮，我们的异步回调系统将变得越来越复杂。我们必须根据数据是否发生变化来决定何时更新视图（即消息列表）。Backbone.js\
  \ 的模型-视图-控制器（MVC）框架可以使复杂的应用程序更易于管理和维护。\n\n如果你对上一个示例感到熟悉，让我们在此基础上使用 Backbone.js 框架进行构建。在这里，我们将逐步使用\
  \ Backbone.js 和 Parse.com JavaScript SDK 创建一个聊天应用程序。如果你觉得已经足够熟悉它，可以在 [github.com/azat-co/super-simple-backbone-starter-kit](http://github.com/azat-co/super-simple-backbone-starter-kit)\
  \ 下载 Super Simple Backbone Starter Kit。与 Backbone.js 的集成允许通过将用户操作绑定到集合的异步更新来实现简单的实现。\n\
