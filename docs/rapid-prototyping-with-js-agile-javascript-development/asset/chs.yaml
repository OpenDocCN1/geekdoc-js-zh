  \n 28       }      \n29     ];\n30     var app;\n 31     var router = Backbone.Router.extend({\
  \ \n 32     //检查是否需要加载\n 33       routes: {\n 34         '': 'home',\n 35      \
  \   'apples/:appleName': 'loadApple'\n 36       },\n 37       initialize: function(){\n\
  \ 38         var apples = new Apples();\n 39         apples.reset(appleData);\n\
  \ 40         this.homeView = new homeView({collection: apples});\n 41         this.appleView\
  \ = new appleView({collection: apples});\n 42       },\n 43       home: function(){\
  \        \n 45         this.homeView.render();\n 46       },\n 47       loadApple:\
  \ function(appleName){\n 48         this.appleView.loadApple(appleName);\n 49 \n\
  \ 50       }\n 51     });\n 52 \n 53     $(document).ready(function(){\n 54    \
  \   app = new router;\n 55       Backbone.history.start();      \n 56     })\n 56\
  \ }); \n```\n\n我们将所有代码都放在了作为 `require()` 第二参数的函数内部，通过文件名引用模块，并通过相应的参数使用依赖项。现在我们应该定义模块本身。这是我们使用\
  \ `define()` 方法的方法：\n\n```\n1 define([...],function(...){...})\n```\n\n它的含义与 `require()`\
  \ 函数相似：依赖项是作为第一个参数传递的数组中的文件名（和路径）字符串。第二个参数是主函数，它接受其他库作为参数（参数顺序和数组中模块的顺序是重要的）：\n\n\
  ```\n1 define(['name-of-the-module'],function(nameOfModule){\n2   var b = nameOfModule.render();\n\
  3   return b; \n4 })\n```\n\n| ![information](img/leanpub_information.png) |  \n\
