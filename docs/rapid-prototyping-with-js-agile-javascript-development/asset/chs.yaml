  \n### 2.2 云端设置\n\n### 2.2.1 SSH 密钥\n\nSSH 密钥提供了安全连接，而无需每次输入用户名和密码。对于 GitHub 仓库，后者用于\
  \ HTTPS URL，例如 `https://github.com/azat-co/rpjs.git`；前者用于 SSH URL，例如 `git@github.com:azat-co/rpjs.git`。\n\
  \n在 Mac OS X/Unix 机器上为 GitHub 生成 SSH 密钥，请执行以下操作：\n\n1.  检查现有的 SSH 密钥\n\n    ```\n\
  \    1  $ cd ~/.ssh\n    2  $ ls -lah\n    ```\n\n2.  如果你看到类似 `id_rsa` 的文件（请参考下方的截图示例），你可以使用以下命令删除它们或将其备份到单独文件夹：\n\
  \n    ```\n    1  $ mkdir key_backup\n    2  $ cp id_rsa* key_backup\n    3  $ rm\
  \ id_rsa*\n    ```\n\n3.  现在我们可以使用 `ssh-keygen` 命令生成新的 SSH 密钥对，假设我们处于 `~/.ssh` 文件夹中：\n\
  \n    ```\n    1  $ ssh-keygen -t rsa -C \"your_email@youremail.com\"\n    ```\n\
  \n4.  回答问题；最好保留默认名称：`id_rsa`。然后将 `id_rsa.pub` 文件的内容复制到剪贴板：\n\n    ```\n    1  $\
  \ pbcopy < ~/.ssh/id_rsa.pub\n    ```\n\n    ![为 SSH 生成 RSA 密钥并将公钥复制到剪贴板。](img/screenshots----ssh-copy.png)\n\
  \n    为 SSH 生成 RSA 密钥并将公钥复制到剪贴板。\n\n5.  或者，在默认编辑器中打开 `id_rsa.pub` 文件：\n\n    ```\n\
  \    1  $ open id_rsa.pub\n    ```\n\n6.  或者在 TextMate 中：\n\n    ```\n    1  $ mate\
  \ id_rsa.pub \n    ```\n\n### 2.2.2 GitHub\n\n1.  复制公钥后，访问 [github.com](http://github.com)，登录，进入账户设置，选择“SSH\
  \ key”并添加新的 SSH 密钥。分配一个名称（例如你的计算机名称），并粘贴你的 `public` 密钥值。\n\n2.  要检查你与 GitHub 的 SSH\
  \ 连接，请在终端中输入并执行以下命令：\n\n    ```\n    1  $ ssh -T git@github.com\n    ```\n\n   \
  \ 如果你看到类似的内容：\n\n    ```\n    1  Hi your-GitHub-username! You've successfully authenticated,\
  \ \n    2  but GitHub does not provide shell access.\n    ```\n\n    那么一切都设置好了。\n\
  \n3.  第一次连接到 GitHub 时，可能会收到“authenticity of host … can’t be established”警告。请不要被此类信息困扰\
  \ —— 只如下所示所示回答‘yes’即可继续。\n\n    ![第一次测试到 GitHub 的 SSH 连接。(images/screenshots----github.png)\n\
  \n    第一次测试到 GitHub 的 SSH 连接。\n\n    由于某种原因你收到了不同的消息，请重复上一节 *SSH Keys* 中的第 3-4 步。\n\
  \n### 2.2.3 Heroku\n\nHeroku 是一个多语言敏捷应用部署平台 [`www.heroku.com/`](http://www.heroku.com/)。Heroku\
  \ 的工作方式与 Windows Azure 类似，你可以使用 Git 进行部署。不需要为 MongoDB 安装虚拟机，因为 Heroku 有 [MongoHQ\
  \ 插件](https://addons.heroku.com/mongohq)。\n\n| Windows Azure\n\n1.  在 [`heroku.com`](http://heroku.com)\
  \ 注册。目前他们提供免费账户；要使用它，请将所有选项设置为最小 (0)，并将数据库设置为共享。\n\n2.  在 [`toolbelt.heroku.com`](https://toolbelt.heroku.com)\
