  \ [500 Startups](http://500.co/) 业务加速计划。\n\n在此之前，Azat 曾在华盛顿特区的政府机构开发过关键任务应用程序，包括[国立健康研究院](http://nih.gov)、[国立生物技术信息中心](http://ncbi.nlm.nih.gov)、[联邦存款保险公司](http://fdic.gov)\
  \ 以及[洛希希德马丁](http://lockheedmartin.com)。\n\nAzat 是湾区地区技术聚会和黑客松的常客（[AngelHack](http://angelhack.com)\
  \ 2012 年黑客松决赛选手，团队来自 [FashionMetric.com](http://fashionmetric.com)）。\n\n此外，Azat\
  \ 还在 [General Assembly](http://generalassemb.ly)、[Hack Reactor](http://hackreactor.com)、[pariSOMA](http://parisoma.com)\
