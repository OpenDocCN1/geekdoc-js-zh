  \n```javascript\n(function() {\n  var app = this;\n}())\n```\n\n如你所见，我们在括号 `()`\
  \ 中创建并立即执行了函数。\n\n### 4.6 开发中的 AMD 和 Require.js\n\nAMD 允许我们将开发代码组织成模块、管理依赖并异步加载它们。这篇文章很好地解释了为什么\
  \ AMD 是一件好事：[AMD？](http://requirejs.org/docs/whyamd.html)\n\n启动你的本地 HTTP 服务器，例如\
  \ [MAMP](http://www.mamp.info/en/index.html)。\n\n让我们通过 Require.js 库来增强代码。\n\n我们的\
  \ `index.html` 将变得更加精简：\n\n```html\n<!DOCTYPE>\n<html>\n<head>\n  <script src=\"\
  jquery.js\"></script>\n  <script src=\"underscore.js\"></script>\n  <script src=\"\
  backbone.js\"></script>\n  <script src=\"require.js\"></script>\n  <script src=\"\
  apple-app.js\"></script>  \n</head>\n<body>\n  <div></</div>>\n</body>\n</html>\n\
  ```\n\n我们只包含了库和包含应用程序的单个 JavaScript 文件。该文件的结构如下：\n\n```javascript\nrequire([...],function(...){...});\n\
  ```\n\n或者更具解释性的方式：\n\n```javascript\nrequire([\n  'name-of-the-module',\n  ...\n\
  \  'name-of-the-other-module'\n  ],function(referenceToModule, ..., referenceToOtherModule){\n\
  \  ...//一些有用的代码\n  referenceToModule.someMethod();\n});\n```\n\n\n\n\n基本上，我们告诉浏览器从文件名数组（`require()`\
  \ 函数的第一个参数）中加载文件，然后将来自这些文件的模块作为变量传递给匿名回调函数（第二个参数）。在主函数（匿名回调）内部，我们可以通过引用这些变量来使用我们的模块。因此，我们的\
  \ `apple-app.js` 蜕变为：\n\n```\n 1   require([\n 2     'apple-item.tpl', //可以使用 shim\
  \ 插件\n 3     'apple-home.tpl',\n 4     'apple-spinner.tpl',\n 5     'apple.tpl',\n\
  \ 6     'apple-item.view',\n 7     'apple-home.view',\n 8     'apple.view',\n 9\
  \     'apples'  \n10   ],function(\n 11     appleItemTpl,\n 12     appleHomeTpl,\n\
