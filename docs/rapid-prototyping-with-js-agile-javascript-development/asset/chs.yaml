  \n3.  安装完成后，你应该可以访问 **heroku** 命令。要检查它并登录 Heroku，请输入：\n\n    ```\n    1  $ heroku\
  \ login\n    ```\n\n\n\n它会要求你输入 Heroku 凭据（用户名和密码），如果你已经创建了 SSH 密钥，它将其将其上传到 Heroku\
  \ 网站：\n\n![成功执行 `$ heroku login` 命令的响应。](img/screenshots----heroku.png)\n\n成功执行\
  \ `$ heroku login` 命令的响应。\n\n4 如果一切进展顺利，若要在你特定的项目文件夹内创建一个 Heroku 应用程序，你应该可以运行：\n\
  \n```\n1  $ heroku create\n```\n\n更详细的分步骤说明请参考 [Heroku: 快速入门](https://devcenter.heroku.com/articles/quickstart)\
  \ 和 [Heroku: Node.js](https://devcenter.heroku.com/articles/nodejs)。\n\n### 2.2.5\
  \ Cloud9\n\nCloud9 是一个浏览器内置 IDE，通过使用你的 GitHub 或 BitBucket 账户，你可以浏览仓库、编辑它们并部署到 Windows\
  \ Azure 或其他服务。无需任何安装；一切都在浏览器中运行，几乎就像 Google Docs 一样。\n\n# II 前端原型\n\n## 3 jQuery\
  \ 和 Parse.com\n\n**摘要**：jQuery 主要函数概述、Twitter Bootstrap 脚手架、主要 LESS 组件；JSON、AJAX\
  \ 和 CORS 的定义；Twitter REST API 示例中的 JSONP 调用插图；关于如何使用 jQuery 和 Parse.com 构建仅前端聊天应用程序的说明；部署到\
  \ Heroku 和 Windows Azure 的分步骤说明。\n\n> “构建软件设计有两种方法：一种是让它极其简单而显然没有缺陷，另一种方法是让它极其复杂以至于没有明显的缺陷。第一种方法要困难得多。”\
  \ — [Tony Hoare](http://en.wikipedia.org/wiki/Charles_Antony_Richard_Hoare)\n\n\
  ### 3.1 定义\n\n### 3.1.1 JavaScript 对象表示\n\n以下是来自 [json.org](http://www.json.org/)\
  \ 的 JavaScript 对象表示（或 JSON）的定义：\n\n> JavaScript 对象表示（或称为 JSON） 是一种轻量级的数据交换格式。它易于人类读写，易于机器解析和生成。它基于\
  \ JavaScript 编程语言的子集，[标准 ECMA-262 第三版 - 1999 年 12 月](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)。JSON\
  \ 是一种文本格式，完全独立于语言，但它使用了 C 族语言程序员熟悉的惯例，包括 C、C++、C#、Java、JavaScript、Perl、Python 等。这些属性使得\
  \ JSON 成为一种理想的数据交换语言。\n\nJSON 已经成为 Web/移动应用不同组件与第三方服务之间传输数据的标准。JSON 也广泛用于应用程序内部，作为配置、本地化、翻译文件或任何其他数据的格式。\n\
  \n典型的 JSON 对象如下：\n\n```\n1 {\n2   \"a\": \"value of a\",\n3   \"b\": \"value of\
  \ b\"\n4 }\n```\n\n我们有一个包含键值对的对象。键在左侧，值在冒号（`:`）的右侧。在计算机科学术语中，JSON 等同于哈希表、键值列表或关联数组（取决于特定语言）。JSON\
  \ 与 JS 对象字面量表示（原生 JS 对象）之间的唯一主要区别是前者更为严格，要求键标识符和字符串值使用双引号（`\"`）。假设我们有一个字符串格式的有效\
  \ JSON 对象，两种类型都可以通过 `JSON.stringify()` 序列化为字符串表示，并通过 `JSON.parse()` 反序列化。\n\n然而，对象的每个成员都可以是数组、原始类型或另一个对象；例如：\n\
  \n```\n 1   {\n 2     \"posts\": [{\n 3       \"title\": \"Get your mind in shape!\"\
  ,\n 4       \"votes\": 9,\n 5       \"comments\": [\"nice!\", \"good link\"]\n 6\
  \       }, {\n 7       \"title\": \"Yet another post\",\n 8       \"votes\":0,\n\
  \ 9       \"comments\": []\n10       }\n11     ],\n 12     \"totalPost\":2,\n 13\
  \     \"getData\": function () {\n 14       return new Data().getDate();\n 15  \
  \   }\n 16   }\n```\n\n在上面的示例中，我们有一个带有 `posts` 属性的对象。`posts` 属性的值是一个对象数组，每个对象都有\
  \ `title`、`votes` 和 `comments` 键。votes 属性是一个数字，而 comments 是字符串数组。我们也可以拥有函数作为值；在这种情况下，键被称为方法，即\
  \ `getData`。\n\n正如本文概述，JSON 比 XML 或数据格式灵活且紧凑得多——[JSON: XML 的无脂替代方案](http://www.json.org/xml.html)。方便的是，MongoDB\
  \ 使用了一种名为 [BSON](http://bsonspec.org/) 的二进制 JSON 的类似格式。关于 BSON 的更多信息将在 *Node.js\
  \ 和 MongoDB* 章节介绍。\n\n### 3.1.2 AJAX\n\nAJAX 代表异步 JavaScript 和 XML，用于客户端（浏览器）通过利用\
  \ JavaScript 语言中的 `XMLHttpRequest` 对象从服务器发送和接收数据。尽管名称如此，并不要求使用 XML，通常使用 JSON 代替。这就是为什么开发者几乎不再说\
  \ AJAX 了。请记住 HTTP 请求可以同步进行。\n\n### 3.1.3 跨域调用\n\n出于安全考虑，初始实现不允许跨域调用。其中一种是使用 [JSONP](http://en.wikipedia.org/wiki/JSONP)——它动态生成\
  \ `script` 标签。例如：\n\n```\n1 https://graph.facebook.com\n2   ?type=post\n3   &limit=20\n\
  4   &q=Gatsby\n```\n\n第二种方法是使用跨源共享，或 [CORS](http://www.w3.org/TR/cors/)，这是一个更好的解决方案，但需要控制服务器以修改标头。我们将在聊天应用程序的最终版本中使用这种技术。\n\
  \nCORS 服务器头部示例：\n\n```\n1 Access-Control-Allow-Origin: *\n```\n\n更多关于 CORS 的信息：[Enable\
  \ CORS 资源](http://enable-cors.org/resources.html) 和 [HTML5 Tutorials 使用 CORS](http://www.html5rocks.com/en/tutorials/cors/)。在\
  \ [test-cors.org](http://client.cors-api.appspot.com/client) 测试 CORS 请求。\n\n###\
  \ 3.2 jQuery\n\n在培训期间，我们将使用 jQuery ([`jquery.com/`](http://jquery.com/)) 进行 DOM\
  \ 操作、HTTP 请求和 JSONP 调用。jQuery 因为它的 `$` 对象/函数成为了事实标准，因为它提供了一种简单高效的方法通过 ID、类、标签名、属性值、结构或任何组合访问页面上的任何\
  \ HTML DOM 元素。语法与 CSS 非常相似，我们使用 `#` 选择 ID，使用 `.` 选择类，例如：\n\n```\n1 $(\"#main\").hide();\n\
  2 $(\"p.large\").attr(\"style\",\"color:red\");\n3 $(\"#main\").show().html(\"<<div>>new\
  \ div</div>\");\n```\n\n以下是最常用的 jQuery API 函数列表：\n\n* `find()`(http://api.jquery.com/find):\
  \ 根据提供的选择器字符串选择元素\n* `hide()`(http://api.jquery.com/hide): 如果元素可见，则隐藏它\n* `show()`(http://api.jquery.com/show):\
  \ 如果元素隐藏，则显示它\n* `html()`(http://api.jquery.com/html): 获取或设置元素的内部 HTML\n* `append()`(http://api.jquery.com/append):\
  \ 将元素插入到所选元素的 DOM 之后\n\n\n\n\n*   `[prepend()](http://api.jquery.com/prepend)` 在所选元素之前向\
  \ DOM 插入一个元素\n*   `[on()](http://api.jquery.com/on)`: 为元素挂载事件监听器\n*   `[off()](http://api.jquery.com/off)`\
  \ 从元素上卸载事件监听器\n*   `[css()](http://api.jquery.com/css)`: 获取或设置元素的样式属性值\n*   `[attr()](http://api.jquery.com/attr)`\
  \ 获取或设置元素的任何属性\n*   `[val()](http://api.jquery.com/val)`: 获取或设置元素的 value 属性\n* \
  \  `[text()](http://api.jquery.com/text)`: 获取元素及其子元素的组合文本\n*   `[each()](http://api.jquery.com/each)`:\
  \ 遍历一组匹配的元素\n\n大多数 jQuery 函数不仅作用于调用它们的单个元素，而且当选择结果包含多个项目时，它们会作用于一组匹配的元素。这是一个导致 Bug\
  \ 的常见陷阱，通常发生在 jQuery 选择器范围过大时。\n\n此外，jQuery 有许多插件和库，例如，[jQuery UI](http://jqueryui.com/)、[jQuery\
  \ Mobile](http://jquerymobile.com/)，它们提供了丰富的用户或其他或其他。\n\n### 3.3 Twitter Bootstrap\n\
  \n[Twitter Bootstrap](http://twitter.github.com/bootstrap/) 是一组 CSS/LESS 规则和 JavaScript\
  \ 插件，用于创建良好的用户界面和用户体验，而无需在圆角按钮、跨兼容性、响应式等细节上花费大量时间。这个集合或框架非常适合你的想法的快速原型设计。尽管如此由于其可定制性，Twitter\
  \ Bootstrap 也是严肃项目的良好基础。源代码是用 [LESS](http://lesscss.org/) 编写的，但也可以下载并使用纯 CSS。\n\n\
  这里有一个使用 Twitter Bootstrap 骨架的简单示例。项目的结构应该如下：\n\n```\n1   /bootstrap\n2     -index.html\n\
  3     /css\n4       -bootstrap.min.css\n5       ... (如果需要，其他文件)\n6     /img\n7 \
  \      glyphicons-halflings.png\n8       ... (如果需要，其他文件)\n```\n\n首先，让我们带有正确的标签创建\
  \ `index.html` 文件：\n\n```\n1 <!DOCTYPE html>\n2 <html lang=\"en\">\n3   <head>\n\
  4 \n5   </head>\n6   <body>\n7   </body>\n8 </html>\n```\n\n将 Twitter Bootstrap\
  \ 库作为压缩（minified）的 CSS 文件引入：\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n\
  \ 3   <head>\n 4     <link \n 5       type=\"text/css\" \n 6       rel=\"stylesheet\"\
  \ \n 7       href=\"css/bootstrap.min.css\" />\n 8   </head>\n 9   <body>\n10  \
  \ </body>\n11 </html>\n```\n\n使用 `container-fluid` 和 `row-fluid` 类应用骨架：\n\n```\n\
  1   <body>\n2     <div class=\"container-fluid\">\n3       <div class=\"row-fluid\"\
  >\n4       </div>  <!-- row-fluid -->\n5     </div>  <!-- container-fluid -->\n\
  6   </body>\n```\n\nTwitter Bootstrap 使用 12 列网格。单个单元格的大小可以通过 `spanN` 类指定，例如，“span1”，“span2”，“span12”。还有\
  \ `offsetN` 类（例如“offset1”，“offset2”……“offset12”），用于将单元格移到右侧。完整的参考可以在 [`twitter.github.com/bootstrap/scaffolding.html`](http://twitter.github.com/bootstrap/scaffolding.html)\
  \ 获取。\n\n我们将使用 `span12` 和 `hero-unit` 类作为主内容块：\n\n```\n 1     <div class=\"row-fluid\"\
  >\n 2      <div class=\"span12\">\n 3         <div id=\"content\">\n 4         \
