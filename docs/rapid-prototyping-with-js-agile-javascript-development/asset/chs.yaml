  \           这是你的首页。 \n 14                   要编辑它只需修改 \n 15                   <i>index.html</i>\
  \ 文件!\n 16                 </p>\n 17                 <p>\n 18                  \
  \ <a \n 19                     class=\"btn btn-primary btn-large\"\n 20        \
  \             href=\"http://twitter.github.com/bootstrap\"\n 21                \
  \     target=\"_blank\">\n 22                     了解更多 \n 23                   </a>\n\
  \ 24                 </p>\n 25               </div>  <!-- hero-unit -->\n 26   \
  \          </div>  <!-- span12 -->\n 27           </div> <!-- row-fluid -->\n 28\
  \       </div>  <!-- content -->\n 29     </div>  <!-- span12 -->\n 30     </div>\
  \  <!-- row-fluid -->\n```\n\n`index.html` 的完整源码如下：\n\n```\n 1 <!DOCTYPE html>\n\
  \ 2 <html lang=\"en\">\n 3   <head>\n 4 \n 5   </head>\n 6   <body>\n 7   <div class=\"\
  container-fluid\">\n 8     <div class=\"row-fluid\">\n 9       <div class=\"span12\"\
  >\n 10          <div id=\"content\">\n 11            <div class=\"row-fluid\">\n\
  \ 12              <div class=\"span12\">\n 13                <div class=\"hero-unit\"\
  >\n 14                  <h1>\n 15                    Welcome to Super \n 16    \
