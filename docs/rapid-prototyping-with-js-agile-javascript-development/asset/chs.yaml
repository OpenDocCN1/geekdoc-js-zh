  \ 根据 `*.md` 文件中的元数据处理 `*.jade` [模板](https://github.com/jnordberg/wintersmith#templates)\n\
  \n当你完成静态网站构建后，只需运行：\n\n```\n1 $ wintersmith build\n```\n\n### 8.4.2 其他静态网站生成器\n\n\
