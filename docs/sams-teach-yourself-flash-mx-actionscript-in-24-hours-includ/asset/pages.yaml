    # HOUR 22


    # Controlling Sound with ActionScript


    There are two ways to add sound to Flash movies. The first is to lay it into the
    timeline. This doesn''t require ActionScript. Another way is to use ActionScript
    to trigger sounds stored in the Library.


    In this hour, you will:


    +   - Find out how to access sounds with ActionScript

    - Learn how to control sound balance

    - Use sound properties to monitor sound

    - Build an ActionScript beat box


    # Playing a Sound


    Unfortunately, there is no simple way to play a sound. You will have to import
    the sound, write several lines of code, and then write several lines of code to
    play the sound in anything but the standard way.'
