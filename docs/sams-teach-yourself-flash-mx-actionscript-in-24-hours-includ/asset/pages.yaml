    \ side. It actually continues past there.\n4. To alter the code so that it bounces\
    \ off the right wall, we'll need to make a few changes. The horizontal speed of\
    \ the movie clip will be stored in a variable named speedX. Change the movie clip\
    \ script to this:\nonClipEvent(load) {\nspeedX = 5;\n}\nonClipEvent(enterFrame)\
    \ {\nthis._x += speedX;\n}\n you run the movie now, it behaves exactly as it did\
    \ before. The variable speedX is set to 5, and that value is used to increment\
    \ the horizontal position of the movie clip.\n5. Now it is time to make the clip\
    \ bounce off the right wall. To do this, we will test whether the clip's horizontal\
    \ position is at, or past, the right wall. If so, speedX is reversed so that the\
    \ ball moves back the way it came.\nonClipEvent(load) {\nspeedX = 5;\n}"
