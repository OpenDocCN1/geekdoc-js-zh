  md: "# Selecting and Dragging Movie Clips\n\n# hitTest Method\n\nYou can detect\
    \ a mouse click in a movie clip without a button. However, this method is a little\
    \ trickier. After you learn it, though, it is a much cleaner solution.\n\nTo detect\
    \ a mouse click on a movie clip without a button, use the onClipEvent(mouseDown)\
    \ or onClipEvent(mouseUp) movie clip handlers. For instance, you can place the\
    \ script on a movie clip:\n\n```\nonClipEvent(mouseUp) {\n  this.gotoAndStop(2);\n\
    }\n```\n\nThe example movie 8otwmcs1.fla contains two instances of the same movie\
    \ clip with this same script applied to both. Two frames are in the movie clip,\
    \ each with a different colored circle. A stop(); command is on the first frame\
    \ of the movie clip.\n\nWhen you try this, you will see right away the onClipEvent(mouseUp)\
    \ handler is different from the on(release) handler used on buttons. If you click\
    \ on one movie clip, they both react.\n\nThis is because all movie clips get the\
    \ mouseUp event sent to them. It is not exclusive to just the movie clip under\
    \ the cursor.\n\n# Determining Which Movie Clip Was Click\n\nThere is a way to\
    \ determine which movie clip has been clicked. The hitTest function tests a mouse\
    \ location with a movie clip to see whether the location is inside the movie clip.\
    \ By modifying the script, we can only send the correct movie clip to its second\
    \ frame. You can see this in one example 8otwmcs2.fla.\n\n```\nonClipEvent(mouseUp)\
    \ {\n  if (this.hitTest(root._x,root._y)) {\n    this.gotoAndStop(2);\n  }\n```\n\
    \nThe hitTest function can work a variety of ways. In this case, it is fed the\
    \ x and y values of the mouse location. It is prefixed with so that it refers\
    \ to the current movie clip. When the user clicks anywhere, the onClipEvent(mouseUp)\
    \ handlers in all the movie clips get triggered. Then, the bot of movie clips\
    \ perform the hitTest test; only one that is under the mouse will test positive\
    \ and jump to frame 2.\n\n# A Selection Script\n\nTo change this into a selection\
    \ script, we have to allow the user to click the movie clip multiple times and\
    \ change the state of the movie clip from off on and back to off again."
