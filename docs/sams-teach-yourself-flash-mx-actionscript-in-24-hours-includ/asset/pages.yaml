    \ as these two variables change.\n\n# Debugger\n\nA heavy-duty tool is the debugger.\
    \ This is a Flash window that shows you all sorts of data about your Flash movie\
    \ and ActionScript code as your movie plays.\n\nTo use the Debug window, choose\
    \ Control, Debug Movie rather than Control, Test Movie. Your movie will compile\
