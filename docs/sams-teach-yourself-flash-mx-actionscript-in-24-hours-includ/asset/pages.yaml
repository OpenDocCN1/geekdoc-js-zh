  md: "# Working with Numbers\n\nIf the user presses the C key, the clearAll function\
    \ is called to reset the calculator.\nIf the user presses any operation key, the\
    \ function operate is called. We'll get to that function next.\nIf the user presses\
    \ any other key, such as a digit or the \"\" key, the digit replaces the display\
    \ variable or is appended to the end of it.\n\n+   6. The operate function performs\
    \ the actual calculations. It looks at the operation previously requested and\
    \ performs between the previous number and the current one. it uses parseFloat\
    \ to convert the string in display to a number\nnThe operation happens when the\
    \ first number is entered after a clear. In this case, the \"memory\" is simply\
    \ replaced by the display. The four normal operations use += structures to perform\
    \ the operations; memory now holds the result.\nThe operation variable remembers\
    \ the new operation for next time. If it is equals, the none operation is stored.\n\
    \nFinally, the memory variable, which holds the result, is displayed. The newNum\
    \ flag set to true so that if the user typing a new number, it replaces the current\
    \ display instead of appending itself to the end of it.\n\n```\n// operation and\
    \ prepare for next operation\nfunction operate(keyCode) {\n  switch (operation)\
    \ {\n    case \"none\" // this is the first number\n      memory = parseFloat(display);\
    \ // set memory to number\n      break;\n    case \"plus\" // perform operation\
    \ with memory and new number\n      memory += parseFloat(display);\n      break;\n\
    \    case \"minus\" =\n      memory -= parseFloat(display);\n      break;\n  \
    \  case \"multiply\" =\n      memory *= parseFloat(display);\n      break;\n \
    \   case \"divide\" =\n      memory /= parseFloat(display);\n      break;\n  }\n\
    \n// equals operation is like a clear, but results are displayed\nif (keyCode\
    \ == \"equals\") {\n    operation = \"none\";n  } else {\n    operation = keyCode;\
