- img_proc: true
  md: '# Objects and Arrays


    > Looking to sort an array in some other besides numerical or alphabetical? You
    can modify the sort command to do almost anything you want. Such an advanced topic
    is beyond this book, but if you really need it, you can refer to the documentation
    for sort to see how to make a specialized function.


    The reverse command takes an array and reverses the order of the items in it.
    For instance:


    ```

    myArray = ["Gary", "Will", "Jay", "Brian"];nmyArray.reverse();

    trace(myArray);

    ```


    Want to sort an array in descending order? Just use a sort command and then reverse
    combine to get the job done.


    You can combine two arrays with the concat function. This works a little differently
    because it does not alter either array. Instead, it creates a new one:


    ```

    myArray = [36,23,63,71,25];notherArray = [58,97,16];nnewArray = myArray.concat(otherArray);

    trace(newArray);

    ```


    # Converting Between Strings and Arrays


    If you want to convert an array to a string, use the join command. It takes one
    argument, which would be the character to place between the items. If you don''t
    supply it, it will use a comma. This returns the string 36:23:63:71:25.


    ```

    myArray = [36,23,63,71,25];nmyString = myArray.join(":");

    trace(myString);

    ```


    Whereas the join command is marginally useful, the split command is very valuable.
    It converts a string to an array. For instance, this takes the string "36,23,63,71,25"
    and converts it to the example array we have used:


    ```

    myString = "36,23,63,71,25";nmyArray = myString.split(", " ");

    trace(myArray);

    ```


    Suppose that you have a sentence, and you want to break each word into the items
    of an array. Here''s how you do it:


    ```

    myString = "This is a test";nmyArray = myString.split(", " ");

    trace(myArray);

    ```


    Now let''s look at some examples of arrays in movies'
