- img_proc: true
  md: "# Using Components\n\nTwo parameters can be set for the PushButton component.\
    \ The first is the Label; change that to **Press Me!** The second is the Click\
    \ Handler. This is the name of the function that will be called when the button\
    \ is clicked. This function must be in the same timeline as the button; so if\
    \ the button is at the root level, the function should be in the main timeline.\
    \ Set the Click Handler to **buttonPressed**.\n\nAlso, name the component instance\
    \ **testButton** as shown in Figure 21.3.\n\nNow all you have to do is create\
    \ the buttonPressed function. Here is a simple example. It just sends some text\
    \ to the Output window:\n\n```\nfunction buttonPressed(buttonInstance) {\n  if\
    \ (buttonInstance == testButton) {\n    trace('Test Pushed.');\n  } else {\n \
    \   trace(buttonInstance._name);\n  }\n}\n```\n\nA button handler function is\
    \ passed one parameter: a reference to the button that called it. So you can test\
    \ this instance to see whether it is testButton. This sample function prints out\
    \ a special message if it is that button, and the button instance name if it is\
    \ not.\n\nYou can see this example in the movie 21pushbox.fla.\n\n# # CheckBoxes\n\
    \nThe CheckBox component is similar to the one we created in Hour 15, “User Input\
    \ Elements.” You can see three of them in Figure 21.4.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_309_0.png)\n\
    \nTo make a CheckBox component, double-click it in the Components panel, or click\
    \ and drag it to the stage. To make a second, go to the Library and open the UI\
    \ Components folder that created when you added the first component. Drag the\
    \ CheckBox component from onto the stage.\n\nIn the example movie 21checkboxes.fla,\
    \ I have created three CheckBoxes. If you select any one of these and bring up\
    \ the Properties panel, you will see that it includes a few more parameters than\
    \ the PushButton Properties panel, shown in Figure 21.3."
