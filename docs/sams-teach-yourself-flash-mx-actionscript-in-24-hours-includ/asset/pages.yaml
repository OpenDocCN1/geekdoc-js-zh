- img_proc: true
  md: '# What Scripts Are


    ActionScript is a programming language. A programming language is a list of instructions
    that tell a computer what to do. A computer will obey these instructions exactly
    as they are stated.


    # Little Programs Inside Flash


    A list of instructions for the computer is called a program. Another name for
    a program is a script. From now on, I''ll refer to these list of instructions
    as scripts.


    A program or script exists inside an environment. In the case of ActionScript,
    environment is the Flash movie. A script can tell the Flash movie what to do.
    In some cases, a script can tell other things, such as the user''s Web browser
    or computer''s operating system, what to do. But for the most part, scripts control
    only what is the Flash movie.


    Scripts can be as small as one line, or as long as thousands of lines. They can
    be placed in one central part of the Flash movie or throughout the Flash movie.
    Some people will refer to an entire Flash movie that uses scripts as a program,
    whereas others will refer to each individual script in the movie as a program.
    Both definitions are technically true because a single program can be defined
    as many smaller programs. It is a matter of semantics.


    For the most part, scripts are little programs placed on various frames and elements
    inside Flash movie. Later in this hour, we''ll examine exactly where in the Flash
    movie these programs can be placed.


    > You may already be familiar with some programming languages. JavaScript is the
    language understood by most Web browsers and to make Web pages interactive. Internet
    Explorer understands JavaScript and a similar language called VBScript. HTML (Hypertext
    Markup Language) is an unusual programming language that you might be familiar
    with. It issues a series of instructions to the Web browser about how to display
    text and images.


    If you have used Macromedia Director, before you may have written some programs
    with Lingo, its programming language. Even though Director and Flash have many
    similarities, Lingo and ActionScript are very different languages.


    in high school or college, you may have taken a course in programming. Many people
    are taught BASIC (Beginners All-Purpose Instruction Code), Pascal, or even COBOL.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_26_0.png)'
