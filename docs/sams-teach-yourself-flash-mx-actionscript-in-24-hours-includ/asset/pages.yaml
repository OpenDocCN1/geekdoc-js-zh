    # Drawing Curves


    Whereas drawing lines is easy and straightforward, drawing curves is more of an
    art than a science. In addition to giving the destination position where the curved
    line draws to, you also give a control point. This control point directs the curve
    of the line.


    For instance, the following code draws a curve from 150,200 to 400,200. The second
    pair of numbers in the curveTo command gives the destination. The first pair is
    the control point. In this case, the control point is 275,275, which is a little
    below the center of the line. The line causes the curve to draw toward the control
    point.


    ```

    setStyle(3,0x000000,100);

    moveTo(150,200);

    curveTo(275,275,400,200);

    ```


    Figure 24.3 shows the result. There are horizontal grid lines at 200 and 275,
    and vertical grid lines at 150, 275, and 400. You can see that the line starts
    at 150,200 and ends at 400,200. In between, it curves out to 275,275 but never
    reaches the point. The example movie 24curve.fla includes the grid lines that
    are drawn with lineCurveTo commands.


    Although 24 can control exactly where the curve starts and ends, you only have
    vague control over where the curve goes. However, by playing around with different
    values, you can get close to drawing what you want.'
