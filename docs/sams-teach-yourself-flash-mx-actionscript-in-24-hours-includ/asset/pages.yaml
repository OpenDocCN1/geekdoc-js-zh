  md: 'Most of the time, you will want to place the stop command in a frame on the
    timeline.

    Although only stop is necessary, the Flash reference material shows the command
    with

    the optional parentheses, so we will use them here as well:


    stop ();


    When you use the stop command, the movie is really just paused on the current
    frame.

    Any animation inside movie clips or graphic symbols on the frame continues to
    animate.

    However, animation on the main timeline stops.


    For the movie to continue, you need to issue another ActionScript command. The
    simplest one is the play command. This pushes the movie forward to the next frame,
    and it

    continues playing.


    We''ll look at the play command in the section, "Creating Buttons," later in this
    hour. For

    now, let''s look at an stop.fla on the CD-ROM as a simple example. The first frame
    contains a large

    graphic of the letter "A" on it. The second and third frames contain the letters
    "B" and

    "C,".


    The second frame of the movie also contains a script. It is a simple script with
    just the

    stop command. Figure 5.1 shows the work area and timeline for this movie. Notice
    that

    there is an "a" in the second frame, signifying a script there. The Actions panel
    is also

    shown in Figure 5.1. In it, you can see the script.


    # Figure 5.1


