  md: '# Learning to Program


    This flexibility is rarely needed, but it is one less thing for ActionScript programmers
    to worry about.


    > Another thing ActionScript programmers don''t have to worry about garbage collection.
    This is when you reclaim the memory used by a variable after the variable has
    ceased to be useful. Most modern computer languages such as ActionScript automatically
    perform garbage collection, so you don''t have to worry about it.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_55_0.png)


    There are other types of variables besides numbers and strings. For instance,
    arrays can hold information instead of a single piece of information. We''ll look
    at arrays and other data types later in the book as they are needed.


    # 3


    Conditions

    Your programs can make decisions. No, they can''t tell you which laundry detergent
    to buy. But they can take pieces of information, compare them, and perform different
    tasks depending on the outcome.


    For instance, suppose that you want to check the name a user provides and make
    sure the user gives a name at least three characters long.


    The decision that the program needs to make is based on this fact. If the user''s
    name is three characters long or longer, the program does one thing; if the user''s
    name is less than three characters long, the program does something else.


    There are actually two parts to this decision. The first part is to test to see
    whether the condition is met. If the name is three characters long, the condition
    is met, and we say it is true. Otherwise, the condition is not met, or it is false.
    All conditions are either true or false.


    A value that is true or false is called a boolean value.


    The second part of the decision-making process is to choose which piece of code
    to execute based on the true/false condition. Sometimes, there is only one: Some
    code is executed if the condition is true. If the condition is false, no code
    is executed at all. Sometimes, there is an alternate set of code to execute if
    the condition is false.


    Used to phrasing questions and comparisons as conditions. Computers always think
    in terms of true and false, not in abstract terms such as “what does this mean?”'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'For instance, if you want the computer to perform three different tasks based
    on whether a variable is 1, 2, or 3, you might phrase it like this:


    +   * Is the variable''s contents equal to 1? If so, do then this...

    * Is the variable''s contents equal to 2? If so, do then this...

    * Is the variable''s contents equal to 3? If so, do then this...


    So instead of asking the computer something complex as “do one of these things
    based on the value of the variable,”you may ask it three questions that have true
    or false results.


    Conditions are almost always based on a comparison. You can compare the values
    of two variables to see whether they are equal. You can also compare them to see
    whether one is less than other or greater than the other. If the variables are
    strings, you can compare them to see whether one appears alphabetically before
    after the other.


    # # Loops


    Computers are great for doing repetitive tasks. Whereas a human gets bored doing
    the thing a few times in a row, a computer is happy to repeat the same task hundreds
    or millions of times. In fact, repetitive tasks are where computers really excel.


    Looping is an important part of every programming language. ActionScript is no
    exception. You can repeat a set of instructions certain number of times, or until
    a certain condition is met.


    In fact, conditions are an important part of looping. All loop needs a starting
    and ending point, plus a condition that signs the end of the loop.


    For instance, if you want to loop 10 times, a variable will be used to start counting
    at 0. Each time the loop loops, the counter is incremented by 1. When it reaches
    9, the loop ends and the program continues past the end of the loop. The following
    is an illustration of a typical program loop:


    +   1. Some command before loop.

    2. Start of loop, counter set to 0.

    3. Some command in loop.

    4. Some other command in loop.

    5. Counter incremented by 1.

    6. If counter is less than 9, go back to step 3.

    7. Some command after loop.'
