  md: '# 9 HOUR


    # Getting Input from the User


    Until now, all the interaction our movies have allowed is through the mouse. However,
    you can also get user input from the keyboard. You can detect user keystrokes
    and allow the user to type letters, words, and sentences into text fields.


    In this hour, you will:


    +   * Learn how to detect keypresses

    * Find out how to use text input fields

    * See a variety of string operations and functions

    * Create a user input form


    # Detecting Keypresses


    There are three ways to detect a single keypress on the keyboard. The first uses
    buttons. The second uses the Key object. A third method is new to Flash MX and
    uses listeners.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_143_0.png)'
  merge: -1
