- img_proc: true
  md: 'name as its grandparent and parent. For instance, the text node in the last
    node has the parent last and the grandparent name. So the name of the text field
    should be name last. That is where the text would go.


    If the XML object is not just a text node, two loops occur. The first looks for
    any attributes of the node. It puts the contents of the attribute in a text field
    named after the parent and the attribute name. So the emergencycontact node has
    the attribute relation. It''s content will be in the emergencycontact text field.


    The second loop looks at all the child nodes in the node. For each of these, it
    calls parseData with the new node. It sends in the parent''s name as the grandparent
    and the current node as the parent. This is the recursive bit. The function is
    calling itself.


    By doing recursion, the program is breaking the XML object into smaller and smaller
    pieces until it has so small that they are just text nodes. It uses the name of
    the text node''s parent and grandparent to determine what text field to place
    the text node value into.


    This little function does the same job as the parseData function in the previous
    task. However, it never refers to any node by number. The XML document can be
    in any order and even contain additional, unused information. If information is
    missing, the text fields will simply be left blank.


    Check out the movie 19xmlrecursivedplay.fla to see this one in action. Note that
    the first time parseData is called in the onLoad function, it is sent list and
    xmlDoc as its parent and grandparent. These really aren''t important because the
    text nodes are much further down.


    # Summary


    XML is a popular way for encapsulating data. It looks like HTML but is completely
    customizable and can be used for any type of data. It is readable by people and
    computers.


    The XML object in ActionScript allows you to import, manipulate, and create XML.
    You can convert a text document or a simple string into an XML object provided
    that it is formatted correctly.


    Using dot syntax and XML object properties, you can access any of the nodes of
    an XML document. You can deconstruct XML and display the data in text fields or
    use it in your applications.'
