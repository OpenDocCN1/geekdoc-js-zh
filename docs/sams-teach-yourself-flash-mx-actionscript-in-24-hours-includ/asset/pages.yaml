    # # HOUR 21


    # # Using Components


    Components are prebuilt interface objects such as check boxes, radio buttons,
    and pop-up menus. A set of these comes with Flash MX that includes some of the
    most common user interface elements. In Flash 5, these were known as Smart Clips.


    In this hour, you will:


    +   - Review all the built-in components

    - Find out how to use ActionScript related to components

    - Create a user input form with components

    - See how to make style changes to the components


    # # ActionScript for Flash’s Built-In Components


    There are seven different built-in components. Figure 21.1 shows the Components
    panel, which includes the names and icons for each of these.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# FIGURE 21.1


    The Components panel is where you select components to add to your movie.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_308_0.png)


    To add a component to your movie, you can either double-click a component in the
    panel, or click and drag a component to the stage.


    # PushButton


    Click and drag the PushButton component to the stage. This creates a new instance
    of the PushButton component on the stage. It also adds a ton of Library elements
    to your movie. Fortunately, these Library elements are stored in neat folders,
    so they won''t get in your way too much.


    Figure 21.2 shows the PushButton component on the stage. It is a simple box with
    the words “PushButton” in the middle.


    # FIGURE 21.2


    The PushButton is the simplest of the components.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_308_1.png)


    > If you happen to have the Live Preview feature of Flash turned off, the PushButton
    will look far worse on your screen and very different from what you get when you
    run the movie. You can turn on Live Preview by choosing Control, Enable Live Preview.


    After the QPushButton is on the stage, you can select it and open the Properties
    panel to change its name. Figure 21.3 shows the Properties panel for this component.


    # FIGURE 21.3


    The Properties panel for components features Properties and Parameters tabs. You
    can switch between these modes to see different information about the component.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_308_2.png)'
