    # Drawing Filled Areas


    To draw a filled area, you will have to draw a series of lines or curves that
    form a closed shape. All you need to do is issue a beginFill command before you
    start drawing and endFill command when you are finished.


    The beginFill command takes two parameters: the color of the fill and the alpha
    of the fill. In this example, a box is made out of 3-pixel thick black line. The
    fill is red.


    ```

    setStyle(3, 0x000000, 100 );

    beginFill( 0xFF000 );

    moveTo(175,100);

    lineTo(375,100);

    lineTo(375,300);

    lineTo(175,300);

    lineTo(175,100);

    endFill();

    ```


