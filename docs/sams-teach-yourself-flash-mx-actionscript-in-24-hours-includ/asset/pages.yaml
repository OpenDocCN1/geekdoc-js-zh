    # Task: Quick Reference Application


    Now let''s use our knowledge of cursors and rollovers to create a complete application.
    This application acts as a quick reference information guide on a topic, in this
    case the planets.


    The movie has nine hotspots, each triggering rollover information box to appear.
    These hotspots are also buttons that the user can click to go to a particular
    frame of the movie with more information.


    One key element of this movie is that the rollovers work across all the frames.
    For instance, the user could click on Saturn to see the details about Saturn.
    Then, the user can roll over Jupiter to Jupiter''s rollover at the same time.
    Therefore rollover will be independent of the current frame. You can see this
    in Figure 13.6.


