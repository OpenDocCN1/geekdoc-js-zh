  md: '# Writing Code in Flash


    +   Q What happens when I divide a number by 0 in ActionScript?

    A You get a special ActionScript value indicated by “Infinity”. However, you should
    consider any division by 0 as a bug and avoid it.

    Q Is there any limit to how many else statements I can use?

    A No, there is a better way to implement a long list of conditions. The case-statement
    allows you to test one variable against a list of possible values.

    Q If I place a function in one frame''s script, is it available to scripts in
    other frames?

    A Yes, as long as it is on the same timeline. Functions inside movie clips, however,
    can be directly accessed inside that movie clip only.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What is the difference between = and ==?

    2. Can you access global variables inside a function?

    3. When you make a comparison, how many possible outcomes are there?

    4. How many different types of loops are there in ActionScript?


    # Quiz Answers:


    +   1. A single equals symbol is an assignment. It is how you set a variable to
    a value. A double equals symbol is a test. It compares the values on either side.

    2. You can access global variables anywhere in timeline. However, you can access
    local variables only in the code segment, such as a function, in which they appear.

    3. Only two: true or false. Either the comparison works out, or it doesn’t.

    4. Three: the for loop, the do loop, and the while loop.'
