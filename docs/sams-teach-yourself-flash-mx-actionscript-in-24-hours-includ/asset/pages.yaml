  md: "Flash follows the standard created by the ECMA (European Computer Manufacturers\
    \ Association). ActionScript is actually similar to ECMAScript, a language developed\
    \ by that organization. JavaScript also attempts to follow this standard. So rather\
    \ than ActionScript being based on JavaScript, as many people think, both ActionScript\
    \ and JavaScript are based on a common ancestor.\n\nFlash always had some capability\
    \ for interactivity. The earliest versions could navigate controls and buttons\
    \ with some simple scripted interactions. But basically, Flash was a vector-based\
    \ animation tool. It caught on like wildfire because the needs of Web site designers.\
    \ They needed a tool to create graphically intense, but low-bandwidth sites. Because\
    \ vector shapes are defined by lines, curves, and fills rather than pixels, they\
    \ make much smaller files than bitmap images. Thus, Flash allowed designers to\
    \ create nice Web pages without leaving out the people using slow mediums.\n\n\
    Even though Flash was meant primarily for illustration and animation, there was\
    \ a need for some scripting. For instance, designers wanted buttons that allow\
    \ the user to navigate to another Web page.\n\nWhen Flash first appeared, it was\
    \ actually called FutureSplash. Later on, it was bought by Macromedia, renamed,\
    \ and added to Macromedia's product line.\n\nScripting in early versions of Flash\
    \ was simple. It wasn't until Flash 4 that standard programming structures, such\
    \ as conditional statements and loops, were added. But Flash scripting was still\
    \ done with pull-down menus and fill-in-the-blank forms. It could barely be considered\
    \ a programming language.\n\nReal ActionScript was born with Flash 5. Programmers\
    \ could type their programs directly and attach them to the elements of the Flash\
    \ movie. Flash MX expands ActionScript even further. ActionScript now provides\
    \ more than 300 commands, functions, operators, and constructs. It is truly a\
    \ full-featured programming language.\n\n# What Scripts Look Like\n\nScripts are\
    \ basically English words with mathematical symbols and punctuation. Here is an\
    \ example:\n\n```\non (press) {\n  gotoAndPlay (\"my frame\");n}\n```"
