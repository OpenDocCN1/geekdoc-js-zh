  md: "# XML Basics\n\nAn XML document is a text document that stores data. XML is\
    \ similar to HTML because of the use of tags. However, XML differs from HTML in\
    \ that HTML uses specific tags and is used for a specific purpose.\n\nXML, on\
    \ the other hand, can use a completely custom tag set and can be used for any\
    \ purpose where you need data. For instance, here is a simple XML document:\n\n\
    ```\n<user>\n  <name>Gary</name>\n  <ID>47</ID>\n</user>\n```\n\nThis document\
    \ defines a user. A user has two pieces of information stored: name and ID.\n\n\
    In the preceding example, user, name, and ID are all XML elements. Each element\
    \ is also known as a node. In addition, the data stored in elements are also nodes,\
    \ known as text nodes.\n\nFigure 19.1 illustrates what nodes are. In it, you see\
    \ a visual representation of the preceding XML example. You can see the five nodes:\
    \ user, name, ID, the text node with “Gary,” and the text node with “47.\"\n\n\
    FIGURE 19.1\nThis diagram illustrates a simple XML file with three elements and\
    \ two text nodes.\n\n| USER |\n| NAME | ID |\n| \"Gary\" | \"47\" |\n\nWhy are\
    \ XML documents so popular? The key is that they are both machine-readable and\
    \ human-readable. Most other forms of databases are good for one or the other\
    \ but not optimized for both.\n\nXML documents can be created by people with simple\
    \ text editors. Creation can also be facilitated by XML editing programs. On the\
    \ other hand, programmers can easily write programs that access XML data.\n\n\
    Flash makes it easy to access the data in XML documents. The XML object can automatically\
    \ parse an XML text document and then provide many functions and properties to\
    \ access the information it."
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Using XML with Flash


    It is unlikely, as a Flash programmer, you will find a need to create an XML database
    for your movies. However, it is likely that you will be asked to write a Flash
    movie that accesses an existing XML database.

    This data may take the form of a ready-made text file such as the examples later
    in this hour. Or, you could be calling out to CGI programs that return XML documents
    when queried.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_283_0.png)


    # The XML Object


    Flash''s XML object is a collection of functions and properties that allow you
    to easily get data from XML documents. The first step in using the XML object
    is to create a variable that holds XML object. Here is an example:


    ```

    myXML = new XML();

    ```


    # Parsing Text into XML


    This XML object is empty. However, you can quickly populate it by using the parseXML
    command. This takes a string and deconstructs it to get the XML data inside.


    ```

    myXML = new XML();

    myXML.parseXML("<user><name>Gary</name><ID>47</ID></user>");

    ```


    Another way to do this thing is to feed the string into the new XML() function:

    myXML = new XML("<user><name>Gary</name><ID>47</ID></user>");


    Now you just say that a string represents XML doesn''t make it true. Suppose there
    is a mistake in your XML code. In that case, ActionScript won''t be able to parse
    the string. You can find out there was a problem by monitoring the property of
    the object. Here is an example:

    myXML = new XML("<user><name>Gary</name><ID>47</ID></user>");

    trace(myXML.status);


    The result is -9. This is because closing the </ID> tag is missing. The code -9
    translates to a start tag without an end tag. A -10 is an end tag without a start
    tag. But if you get a 0, that the string was parsed without any problems.


    # Getting Data from XML


    So how do you access the information the XML object now that you have it?

    There are many functions for doing this. For instance, you can use firstChild
    to get the first child node of the object:'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# 266 Hour 19


    ```

    myXML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.firstChild);

    ```


    The result is "<name>Gary</name><ID>47</ID></user". This is the first child of
    the XML object. Now let''s dig deeper


    ```

    myXML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.firstChild);

    ```


    Now the result is <name>Gary</name>. The name element is the first child of the
    user element.\Another way to do this, instead of using firstChild, is to use childNodes,
    an array of nodes. Here is the same example, but with childNodes:


    ```

    myXML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.childNodes[0].childNodes);

    ```


    Is that it? No, you can get further. Refer to Figure 19.1. There is under the
    user node that holds the text.

    XML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.childNodes[0].childNodes);

    The result is Gary. This is the text node of the name node of the user node. So''s
    the bottom? No This is the last, but it is still a node, not a text string like
    we would probably need if we were looking for the data in the XML document. To
    access the string in the text node, you need to use the nodeValue.XML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.childNodes[0].childNodes[0].nodeValue);


    But if we wanted the user ID? That would be the second node of the user node.
    Here is the code:

    XML = new XML(<user><name>Gary</name><ID>47</ID></user>);ntrace(myXML.childNodes[0].childNodes[1].nodeValue);


    # Creating XML from Scratch


    If you don''t have a string but wanted to create the XML code from scratch? You
    can use createElement to make a new element and createText to create a new text
    node. However, neither of these commands adds the node to the XML object; they
    just prepare a new node. You have to use appendChild to add a new node.


    ```

    myXML = new XML();nElement = myXML.createElement(''user'');nmyXML.appendChild(newElement);

    ```'
