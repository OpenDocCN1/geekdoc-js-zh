    # Operators


    You can also modify the variables with operations. They are also standard mathematical
    symbols as + and - for addition and subtraction. For multiplication, we use the
    * symbol. For division, we use the / symbol.


    For instance, add 4 to a variable that contains the number 7, we just use a second
    assignment statement that sets the value of the variable to its current value,
    plus 4:


    ```

    var a = 7;

    a = a + 4;

    trace(a);

    ```


    The result is 11, of course. ActionScript actually has shorthand for performing
    the same addition. The += operation takes the current variable and adds the next
    number to it. Here is some code that does exactly the same thing as the previous
    code:


    ```

    var a = 7;

    a += 4;

    trace(a);

    ```


    There is another piece of shorthand that you should be familiar with. The ++ operator
    is like the += operator, but it adds 1 to the number. Here is an example:


    ```

    var a = 7;

    a++;

    trace(a);

    ```


    The result is 8. Now try this:


    ```

    var a = 7;

    trace(a++);

    trace(a);

    ```


    The result is a first 7 and then an 8. What happened here? Well, the first trace
    command placed the current value of a in the Output window. Then the ++ operator
    added one to a. The second trace statement placed the new value in the Output
    window.


    Now try this:


    ```

    var a = 7;

    trace(++a);

    trace(a);

    ```'
