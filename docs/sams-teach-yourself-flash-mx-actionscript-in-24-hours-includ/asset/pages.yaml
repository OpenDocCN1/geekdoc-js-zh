  md: '# Introduction


    # # How This Book Is Organized


    This book is arranged in a linear fashion, with concepts and tasks getting more
    complex as you move along. If you are already familiar with programming, for instance,
    you could skip Hour 3. If you have already dabbled in ActionScript for a while,
    you might want to skip Hour 1, “Your First Look at ActionScript;” Hour 2, “Using
    the Script Editing Window;” and Hour 4, “Writing Code In.”


    Each lesson in this book builds on the concepts learned in earlier lessons. As
    you advance, your knowledge will get both deeper and broader.


    Although you can skip to a task in a lesson that fits your immediate need, you
    may find that you won''t understand what you are reading because you missed something
    covered earlier. Some readers are able to use books in this way, whereas others
    need to take it step-by-step.


    # # Conventions


    The lessons all include a summary at the end. If you already know a bit of ActionScript,
    you can use these summaries to determine whether the lesson is critical for you.
    Otherwise, the summary is a great way to review what you have learned.


    After the summary comes a set of questions and answers. These cover some questions
    that you may have after reading the lesson. Usually, the questions and answers
    take what you have learned to the next level by giving you ideas about how to
    expand on what you have learned.


    Each lesson also includes a workshop. This is a set of four questions that test
    your knowledge of what you just read. I usually take this opportunity to make
    sure that you understand key points. Missing one of the quiz questions means that
    you should probably go back and review that part of the lesson. Otherwise, you
    may find that you don''t know all you need to know to use that concept in lesson.


    Inside each lesson are tips, notes, cautions, and coffee breaks. A tip is a suggestion
    that will save you time and effort, or give you an idea about how to use what
    you have learned. A note is a piece of information that gives you a little more
    insight into a concept. A caution explains a typical pitfall people fall into
    when first using the technique. A coffee break is an aside that gives you an interesting,
    but unimportant, piece of information about the topic.'
