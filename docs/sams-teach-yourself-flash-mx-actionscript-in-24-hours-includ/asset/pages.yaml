    # HOUR 10


    # Creating and Controlling Text


    Now that you know how to get and modify text that the user enters, let’s look
    at how to create and modify text in ActionScript. You can place text on the screen
    in a variety of ways, using different styles and fonts. You can also get text
    from outside sources, such as the HTML page and external text files.


    In this hour, you will:


    +   - Learn about dynamic text

    - See how to apply formatting to text

    - Find out how to get variables from the HTML page

    - Use external text files to store variables

    - Make a news ticker

    - Build a common Flash text effect'
