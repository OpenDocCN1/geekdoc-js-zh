  md: '# HOUR 14


    # Scrolling


    Another common user interface element, and one seen in just about every type of
    modern program, is the scrollbar. This is usually used to allow the user to scroll
    through large amounts of text.


    In this hour, you will:


    +   * Read about the elements of a scrollbar

    * Learn how to make a text field that scrolls

    * Create a full-featured scrollbar

    * Use a scrollbar to scroll an image


    # Scrollbar Elements


    Although scrollbars are all over the Mac and Windows operating systems and in
    web browsers and other applications, few people really understand the individual
    elements or how they work. This is mainly because the scrollbar is an intuitive
    interface element, requiring no instructions. People just use it—they don''t think
    about it.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'As a result, when it comes time for Flash developers to make their own scrollbars,
    they often fail to implement the elements correctly. So let''s go over each of
    the four parts of a scrollbar and define what it does.


    Figure 14.1 shows a scrollbar. There are four parts: the up arrow, the down arrow,
    the slider, and the bar itself.


    # Figure 14.1


    A plain-looking scroll-bar.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_214_0.png)


    # The Slider


    The slider, also called the thumb, serves several purposes. First, its position
    along the bar shows the user where he is along the full body of text. If the slider
    is at the top, the user is seeing the first lines of text. If the slider is at
    the bottom, the user is seeing the last lines of text.


    The slider can also be gripped and moved along the bar. the text immediately adjusts
    to show the appropriate portion. So if the user clicks and drags the slider to
    the middle, the text scrolls immediately to the middle.


    > Recently, scrollbars have begun to add a new feature. The slider, instead of
    being fixed height, resizes itself depending on how much of the text is shown.
    The result is that the top of the slider indicates the position of the first visible
    line of text, and the bottom of the slider indicates the position of the last
    visible line of text. A scrolling text field shows 10 lines out of 100 will then
    have a slider that is 10 percent of the height of the bar. We won''t add this
    complexity to our scrollbars here; they are already complex enough for someone
    just learning ActionScript.


    # The Bar


    The bar is mainly used as a background for the slider. The slider''s position
    along the bar indicates the portion of text being shown.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Scrolling


    However, the bar also serves a purpose of its own. If the user clicks on the bar,
    the text scrolls up one page at a time. If the click is above the slider, the
    text scrolls toward the beginning. If the click is below the slider, the text
    scrolls toward the end. Either way, the page-by-page scrolling stops when the
    slider reaches the position of the click. So, for instance, if the slider is at
    the bottom of the bar, and you click at the middle of the bar, the slider moves
    up, one page at a time, until the slider is in the middle.


    # The Arrows


    The arrows at the top and bottom of the scrollbar are the simplest elements. They
    allow the user to scroll up and down by one line. The slider needs to be updated
    after an arrow is pressed so that it will reflect the new position.


    # Universal Properties


    There are some universal properties of scrollbar elements that we should consider.
    First, the elements should act once when the element is clicked, but then act
    and again until the element is released. For instance, if the user clicks and
    holds the down button, the text field should scroll, line by line, until the user
    releases the button.


    Another common factor is that the slider needs to be updated every time an element
    is used. So when the up, down, arrow, and bar are clicked, the slider needs to
    be updated. It should always show the exact position of the visible text within
    the full text.


    Now that you know about the different elements of scrollbars, let''s look at how
    dynamic text fields can be controlled by them.


    # Dynamic Text Scrolling


    If you bring up the Properties panel and select a dynamic text field, you will
    see that you can name the text field in addition to assigning it to a variable.
    In Figure 14.2, the dynamic text field is named scrollText.


    Figure 14.2 You must name your text fields to control them with ActionScript.
    This one is named scrollText.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_215_0.png)


    14'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'After you name a text field, you can refer to it in your ActionScript code
    and get set its properties. Before you doat that, you need to change the text
    field to allow it to scroll.


    If you select a field, you can grab and drag the white box at the bottom-right
    corner of the field to change its size. However, the field always remains big
    enough so that all the text is visible. You cannot shrink it so that some of the
    text is not visible.


    Instead of dragging this white box, you need to first change the text field so
    that it has a black box at the bottom right. To do this, hold down the Shift key
    and click on the white box; it should change to a solid black box. Now you can
    drag it so that the text field is smaller than the text it holds.


    Now that you have changed the text field to make it scrollable, several properties
    of a text field relate to scrolling.


    The scroll property tells you what line is the first visible on the screen. If
    scroll is 1, the first line is visible. If scroll is 2, the first line is hidden,
    and the second line of the text is the first line visible.


    The maxscroll property tells you what the largest possible value for scroll is,
    given the size of the field and the text in it. If the field is 20 lines long,
    but only 10 lines are visible at a time, maxscroll will be 11. Why? Because when
    scroll is 11, lines 11 through 20 are in the visible area, line 20 being the last
    line. You can''t scroll to line 12, which would attempt to make lines 12 through
    21 visible, and there is no line.


    The scroll and bottom properties of the field tell you precisely which line is
    at the top and which is at the bottom. So if you subtract 1 from the top and add
    1, you get the total number of visible lines in the field.


    To make a scrolling field move up and down, all we need to do is increase or decrease
    scroll. We don''t even need to check for this value going below 1 or above the
    maxscroll because Flash just does not allow it. For instance, if you set the scroll
    property of field to 0, Flash simply adjusts to 1.


    # Task: Simple Text Scrolling


    It is actually easy to create a scrolling text field. If you throw out the complexities
    of a full scrollbar, and just keep the up and down arrow keys, you can make it
    with only a few lines of code.


    In this example, we''ll build a movie with a dynamic text field and two buttons.
    You can see what it could look like in Figure 14.3.'
