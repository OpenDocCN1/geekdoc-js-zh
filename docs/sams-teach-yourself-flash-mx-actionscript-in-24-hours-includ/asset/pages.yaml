  md: '# HOUR 16


    # ## Pull-Down Menus and Dynamic Buttons


    Menu systems are seen in almost every computer application. Both your operating
    system and Flash put pull-down menus at the top of your screen. They are a great
    way to offer many options to the user without taking up too much screen real estate.


    In this hour, you will:


    +   * See how to make simple Flash pull-down menus

    * Use pull-down menus in a simple Flash movie

    * Make pull-down menus that require a button click to expand

    * Find out how to create buttons dynamically

    * Use dynamic buttons in a simple Flash movie


    ![](img/9e6d716993ade8c40e3512ad7da0a693_241_0.png)'
  merge: -1
  pgno: 241
- img_proc: true
  md: "# Simple Pull-Down Menus\n\nBeginning ActionScript programmers always want\
    \ to learn how to pull-down menus. They are actually simple to using ActionScript\
    \ that we have already learned.\n\nThe basic idea is to have a title button and\
    \ then several buttons that appear below the title when the user rolls over it.\
    \ Figure 16.1 shows the title button by itself and what happens when the user\
    \ moves the cursor over the title button.\n\nFigure 16.1\nWhen a user moves\n\
    the mouse over a title\nbutton, the other three\nappear.\n\n| ABOUT US |\n| HISTORY\
    \ |\n| CLIENTS |\n| PARTNERS |\n\nThe entire pull-down menu appears in one movie\
    \ clip that contains all four buttons. There are two frames to this movie clip.\
    \ The first frame contains only the title button, which also stretches on its\
    \ layer across to the second frame. The second frame, in addition, contains the\
    \ other three buttons.\n\nWhen the user rolls over the movie clip, which is waiting\
    \ on the first frame, it goes to the second frame. It stays until the user rolls\
    \ off the movie clip.\n\nThe script to do this looks like the scripts from Hour\
    \ 13, \"Rollovers.\" It uses hitTest to determine whether the cursor is over the\
    \ movie clip. It keeps track of that and monitors any changes. When a change occurs,\
    \ the movie clip goes to the first or second frame depending on whether the cursor\
    \ is entering or leaving the movie clip.\n\n```\nonClip(load) {\n    previouslyOver\
    \ = false;\n}\n```\n\n```\nonClipEvent(enterFrame) {\n    // is the cursor is\
    \ over the movie clip\n    currentlyOver = this.hitTest(root._mouse,root._mouse,true);\n\
    }\n```\n\n```\n// if there is a change, go to another frame\nif (!previouslyOver\
    \ and currentlyOver) {\n    previouslyOver = true;\n    this.gotoAndStop(\"on\"\
    );\n} else if (previouslyOver and !currentlyOver) {\n    previouslyOver = false;\n\
    \    this.gotoAndStop(\"off\");\n}\n```"
  merge: -1
