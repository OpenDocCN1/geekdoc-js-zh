  md: 'This returns a 2, because the string "llo" starts at character 2. Note that
    the 0 as the second parameter of these two functions means that the search starts
    at that point. A 0 starts the search at the beginning of the string. If we used
    a 2, the search would ignore the first two characters and start at the third character.


    If the indexOf function doesn''t find the search string, it returns a -1.


    You can use last to find a string at the back of the other string. For instance,
    to find the first "I" and the last "1", you can do:


    ```

    var myString = "Hello World."

    trace(myString.indexOf("1",0));

    trace(myString.lastIndexOf("1"));

    ```


    The results are a 2 and a 9. The 2 represents the first "I" in "Hello," and the
    9 represents the "I" in "World."


    ActionScript also has useful functions that convert all the letters in a string
    to uppercase or lowercase. Here is an example:


    ```

    var myString = "Hello World."

    trace(myString.toUpperCase());

    trace(myString.toLowerCase());

    ```


    The results in the output window look like this:


    HELLO WORLD.

    hello world.


    One thing you should know about strings is how to get their length. For this,
    just use the length property of the string. Here is an example:


    ```

    var myString = "Hello World."

    trace(myString.length);

    ```


    The answer is 12. Remember that because we are counting characters at 0 doesn''t
    affect how many characters there are. So the first character is 0, the last is
    character 11, and the length is 12.


    With a good knowledge of how to manipulate strings, you can create any number
    of interesting applications in Flash. A simple one would be a user input form,
    just like the ones used on the Web that are usually in HTML.


