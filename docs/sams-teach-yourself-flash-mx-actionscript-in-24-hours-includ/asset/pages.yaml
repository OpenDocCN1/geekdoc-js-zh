  md: '# Your First Look at ActionScript


    You can decipher what this code does by examining the key words in it. The word
    “press” suggests that the user is clicking on something, in this case a button.
    The long word on the next line can be read “go to play” and suggests that the
    script is commanding Flash to go to a specific point in the movie and play the
    movie from that point on.


    This script demonstrates that ActionScript can control the flow of a Flash movie.
    We''ll look at the script shown previously in more detail later on. Before we
    go further, let''s examine what other powers ActionScript can have over the Flash
    movie.


    # What Scripts Can Do


    A Flash movie consists of scenes. Each scene has a timeline. Each timeline starts
    with frame 1 and continues from there. The natural state of a Flash movie is to
    move forward at a constant rate from scene 1, frame 1, to the end of scene 1 and
    then to scene 2 and so on. You can set a movie to play through all the frames
    of all the scenes and, you can set the movie to loop.


    The primary purpose of ActionScript is to change this linear behavior. A script
    can stop a movie on a certain frame, loop back to a previous frame, or give the
    user control of what frame is next. ActionScript can be used to make a movie completely
    break away from the passive linear mode of standard Flash movies.


    But that''s not all that ActionScript can do. It can also turn a Flash movie from
    an animation into an interactive computer program. Let''s look at the basic functions
    that ActionScript can perform.


    +   **Animation** You don''t need ActionScript to create animation in Flash. Flash-script
    can help to create complex animation. For instance, a ball can bounce around the
    scene in a seemingly endless path with ActionScript. It can even obey the laws
    of physics, being pulled down by gravity. If you were to animate such a thing
    without ActionScript, you would need thousands of frames. But a script can do
    it in one frame.


    +   **Navigation** Instead of the movie moving forward at a constant pace, you
    can pause it at a moment of choice and let the user decide where to go next.


    +   **User Input** You can ask the user questions and use that information in
    the movie or send it to a server. A Flash movie with some ActionScript can be
    a better way to do a Web form. Or, the movie itself can use the information to
    customize the user’s experience.


    +   **Get Data** A script can interact with the server in the opposite direction,
    too. You can get up-to-date information and present it to the user.'
