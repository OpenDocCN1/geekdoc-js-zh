    You could use a listener to this monitor the progress of a user entering data
    into a form. If the user tabs from a field, you could check the data in that field
    to see whether the user entered enough characters or entered the right sort of
    characters. We''ll look at an example at the end of this hour.


    # Restricting Text Input


    When a user is entering data into a field, it is often a good idea to only allow
    him to type characters that make sense. For instance, if the user is asked what
    he was born, he should only enter the numbers to answer. There is never a need
    to type letters or other characters.


    You restrict characters that can be typed into an input field using the restrict
    property of that field. If you don''t set this property at all, any character
    would be allowed in the field. However, if you set it to a string, only characters
    in that string are allowed.


    Here is how you would set the input field text to only accept number characters:

    text.restrict = "0123456789";


    Suppose that you have a field where the user is supposed to type her e-mail address.
    E-mail addresses can have only the basics and numbers in them, plus the special
    characters "@" and \.". In addition, dashes and underscores are allowed in e-mail
    addresses. Here is how you would restrict it to only these characters:


    ```

    text2.restrict = "abcdefghijkmnopqrstuvwxyz0123456789._-";

    ```


    The preceding line leaves one question: Will the input field accept both upper-
    and lowercase letters? Yes, it will accept both, so the restrict property ignores
    case.'
