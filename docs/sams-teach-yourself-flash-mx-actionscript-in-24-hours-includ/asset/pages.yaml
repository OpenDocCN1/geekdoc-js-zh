  md: '# Creating and Controlling Text


    The enterFrame handler starts checking the scale. If it is 100, the current letter
    is at its normal size, and it is time to go to the next letter. This also happens
    at the start of the animation because we set scale to 100 in the load handler.


    When it is time to go to the next letter, the letterNum variable is increased.
    Then that letter''s movie clip is moved into position. The scale variable is set
    to its initial value.


    Next, the handler decreases the scale by one scaleStep. It then sets the _xscale
    and _ysscale properties to that new value. This happens over and over until the
    scale reaches 100 and the next letter goes into action.


    This is by far the most complex task you have undertaken so far. Take the time
    to review and look at the example 10extanimation.fla. In particular, the attachMovie
    process is an important one that we have covered so far.


    **Extra Credit:** If you look on the CD-ROM, you''ll see a movie 10extanimation2.fla.
    This is a slight variation on this movie; it animates more one letter at a time.
    The result is a little nicer than the script we just built. If you are up to it,
    you can take a look at this movie to see how it works.


    # Summary


    You can place text in Flash movies with ActionScript using dynamic text fields.
    Each field is linked to an ActionScript variable. New text in a text field takes
    on the font, size, and style of the text field. However, you can customize how
    text looks using simple HTML tags or a TextFormat object.


    You can easily get text and other variable contents from external sources in two
    ways. The first method involves adding a variable declaration to the URL in the
    movie''s page. The second method uses an external text file.


    You can create new movie clips with the attachMovie command. You can make as many
    copies of the same movie clip as you want, which allows you to create interesting
    effects even if a few movie clips are on the screen before the movie starts.


    # Q&A


    +   What happens if I use a font in a dynamic text field that is not on the user''s
    machine?


    +   Flash will adapt as best it can, but you want to avoid this. You can embed
    fonts in your Flash movie. You should do so in any well-designed movie. Then only
    use your fonts in your text fields.'
