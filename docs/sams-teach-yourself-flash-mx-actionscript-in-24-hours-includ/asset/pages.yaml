  md: '# Writing Code in Flash


    We''ll use the Output window throughout the rest of this hour and in many other
    times throughout the book.


    # Local and Global Variables


    In Hour 3, “Learning to Program,” I mentioned variables. They are little containers
    for storing information.


    # Setting Variables


    Using variables in ActionScript is easy. All you need to do is assign a value
    to a variable name. Here is an example:


    ```

    myVariable = 7;

    ```


    The preceding line creates the variable named myArray and places the number 7
    inside it. Note that the name numberVariable was chosen arbitrarily by me. You
    could name the variable anything. For instance, numberContainer, a or fred would
    work all.


    To see variables in action, you can test them with the Output window. Here is
    a short program that you can place in the first frame of a blank movie:


    ```

    myVariable = 7;

    trace(myVariable);

    ```


    When you run this, the Output window appears with the number 7 in it. The number
    7 was stored in myArray and then the trace command was used to place the contents
    of myArray in the Output window.


    # Global Variables


    A global variable is one that is accessible throughout the entire level of the
    Flash movie. You can set it in one frame, and it will still contain its contents
    in another frame.


    You don''t need to do anything to create a global variable. Just using it, like
    in the previous example, automatically makes the variable global.


    In most programming languages, global variables are available everywhere. However,
    Flash movies use a system of levels. The main timeline is the root level. Any
    movie clips are actually small Flash movies inside the main one. The graphics
    and scripts inside a movie clip are one level down from the root level. Global
    variables at the root level aren''t accessible inside a movie clip—at least directly.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_67_0.png)'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Local Variables


    Local variables, unlike globals, are only available in the current script. In
    the next frame, the variable won''t exist. You can certainly create a new variable
    with the same name, but the previous contents from the last frame will not be
    in.


    The point of local variables is to create modular code. If a variable is local,
    it is removed from memory when the script is finished. Otherwise, if it is a global
    variable, the variable and its value will hang around until the movie ends.


    To create a local variable, you need to use the var keyword. For instance, you
    could create a local variable named myLocal1 and place the number 9 in it like
    this:


    ```

    var myLocal = 9;

    ```


    After you set the variable with the var keyword, you don''t have to use var again
    in that local piece of code. For instance, the following code creates the local
    variable, sets it to 9, changes its value to 11, and then sends it to the Output
    window:


    ```

    var myLocal = 9;

    myLocal = 11;

    trace(myLocal);

    ```


    When deciding to use local variables and when to use global variables, the rule
    of thumb is to use local variables unless there is a good reason to use a global.
    We''ll mostly use local variables.


    # Comparisons and Operations


    Comparing two things in ActionScript is simple. Use standard mathematical symbols,
    such as =, <, and >.


    # Are the Variables Same?


    You have already seen how the = symbol is used to assign a value to a variable.
    To differentiate times when you want to assign a value and times you want to compare
    two values, the double equals symbol, ==, is used when you want to compare two
    things. The single equals operator is used to assign values to variables.


    So, if you want to set whether a is the number 7, use ==. Here is an example that
    places the results in the Output window:


    ```

    var a = 7;

    trace(a == 7);

    ```


    This code assigns the value 7 to the variable a by using the single equals symbols.
    It then compares a with 7 using the double equals symbol.'
