    # Summary


    Numbers are an important part of complex ActionScript programs. You can use the
    Math object to perform standard mathematical functions on numbers. You can convert
    numbers to strings and strings to numbers.


    Trigonometry functions such as sine and cosine can be used to convert a point
    along the circumference of a circle into an x and y coordinate.


    Random numbers can be created with the Math.random() function. You must perform
    additional operations on the result to get a random number that fits the range
    you need.


