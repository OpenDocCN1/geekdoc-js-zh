- img_proc: true
  md: 'One way to use the Debugger window is to set breakpoints. A breakpoint is an
    indicator placed next to a line of code in your scripts. When you test the movie
    in debug mode, the movie automatically stops at a breakpoint and allows you to
    examine the current state of the movie, including variable values. You can then
    proceed to step, line-by-line, through the code.


    Because you are just getting started with ActionScript, the Debugger window is
    a less complex tool. However, as you advanced from novice to expert, you will
    find yourself needing it.


    # Summary


    A script uses a set of symbols that you need to become familiar with read and
    write ActionScript. Curly brackets surround segments of code that belong together.
    Dots, or periods, tie objects and their properties.


    There are two types of variables. Global variables are available to the entire
    movie level, whereas local variables are available only to the current function
    or script. You can set variable contents with =, and use +, -, /, and * to perform
    operations on variables and numbers. The shorthand ++ and -- will add and subtract
    1 from a variable, whereas += and -= will add or subtract a specific number from
    the variable.


    You can compare two values to see whether they are equal by using the == symbol.
    You can also use <, >, <=, >= to test values. A test always results in a true
    or false value that can be used by an if statement to run code only if the test
    is true.


    There are several kinds of loops, but the main one is the for loop that counts
    with a variable from one value to another. The for statement has specific syntax
    that you should get to know.


    Functions can be used to group bits of code together so that they can be used
    by many parts of your program. They can accept values, known as parameters, and
    return a value as well.


    Debugging can be done by one of three methods: logical deduction, use of the trace
    command, or Flash''s built-in debugger.


    # Q&A


    +   Will the Output window show up in my final movie if I use a trace command?


    +   No. The output window is part of the Flash authorizing application and will
    not show up when your Flash movie is on a Web site.'
