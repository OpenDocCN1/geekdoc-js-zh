- img_proc: true
  md: 'Each of these steps, however, can be broken down even further. Getting in the
    car involves opening the door, climbing in, placing the key into the ignition,
    turning it, and so on.


    You can go even further. Opening the car door involves reaching for the handle,
    pulling gently on the handle, and then pulling on the door to open it. If the
    car was locked, you may also have to take out your key, place it in the lock,
    and turn the key, and so.


    Did you realize that so much was involved in going to get some milk? These steps
    seem so minor and detailed that you don''t just think about them normally, but
    you have to do them.


    As a computer programmer, you need to include every minor step in your program
    so that the computer knows how to perform the entire task.


    > If it helps, think of Flash as an alien from another planet or a prehistoric
    man thawed from ice. You have to explain every step of everything you want to
    do, and you can''t assume he knows anything.


    For instance, suppose that you want to make a space invaders game, just like the
    classic arcade game. It seems like a pretty big order at first, so you break it
    into steps. You''ve got the invaders, the shields, and the player.


    Focus on the player''s ship first. It should be able to move left and right, and
    fire bullets.


    Focus on the movement first. The left and right arrow keys move it from side to
    side. The program also needs to check to make sure the ship doesn''t move past
    the edge of the screen.


    Focus on the movement to the left first. You''ve got to detect when the user presses
    the left key and then reposition the ship slightly to the left when he does.


    This last focus doesn''t seem nearly as big a problem as the original one—building
    a space invaders game. You can achieve this step easily if you just know a few
    basic-words.


    This is the secret to computer programming. You need to break the problem down
    into smaller and smaller problems until you can handle each one.


    If you are ever having difficulty figuring out how to solve a problem, it is probably
    because you have not broken it down into enough pieces. Programming is partly
    knowing how to break down a big problem into smaller ones, and partly having the
    patience to implement each and every small step.'
