  md: '# Introduction


    ActionScript is the powerful programming language inside Macromedia Flash. Learning
    ActionScript is your key to taking your Flash movies to the next level. Fortunately,
    learning- ActionScript is easy.


    This book teaches you how to write programs in ActionScript. It is divided into
