- img_proc: true
  md: '# Using Components


    When you add a component to your movie, you need to set various parameters of
    the component. Most components have an ActionScript callback function that is
    triggered when the component is used. You can also access the state of a component
    at any time.


    You can change the style of components using ActionScript. You can either change
    all the components, a group of components, or just one component. Use this capability
    to customize your components so that they don''t look like everyone elses.


    # Q&A


    +   - When should I use components instead of my own movie clips?

    - Use components when time is short or you are not sure that your ActionScript
    abilities will allow you to get the results you want. However, components will
    never be as easy to customize as your own movie clips. In addition, components
    to slow down your movie. If reaction is important, you will want to make your
    components that are optimized to perform exactly as you need.

    - Can I use the ScrollBar component on something besides text fields?

    - Yes. In fact, the ListBox and ComboBox use it. If you are an expert ActionScript
    programmer, you can read the documentation to find out how to access the properties
    of the Scroll so that you can use it in other ways.

    - Can I use the scroll pane to show an image rather than a movie clip?

    - Yes and no. The scroll pane shows only movie clips. But that doesn''t stop you
    from making a movie clip that contains an image. In fact, that is how you should
    work things if you want to build an image builder. Some programs, such as Macromedia
    Fireworks, allow you to save images as Flash files. These can be read in using
    loadScrollContent.

    - So can I customize components even more?

    - You don''t even need ActionScript for this. But you do need to check out the
    documentation how to alter and create component skins.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   - Which components can be used to allow the user to make an exclusive choice?

    - Which components can be used to allow the user to make a nonexclusive choice?'
