- img_proc: true
  md: "# Controlling Sound with ActionScript\n\nThis is a function triggered when\
    \ the sound is finished playing.\n\n```\nmySound = new Sound();\nmySound.attachSound(\"\
    mySound.aif\");\nmySound.onSoundComplete = function () {\n  trace(\"sound done!\"\
    );\n}\nmySound.start();\n```\n\nYou can also direct the sound to one speaker than\
    \ the other with the setPan-command. This is similar to the balance control on\
    \ a stereo.\n\nYou can set the pan of a sound to a value from -100 to 100. If\
    \ you set it to -100, all sound comes from the left speaker. Setting it to 100\
    \ means that all sound comes from the right speaker.\n\n```\nmySound.pan(-100);\n\
    ```\n\nThe movie 22monoplan.fla has a single-channel (mono) sound in it. When\
    \ you click the button on the left, the sound plays completely from the left speaker.\
    \ When you click the button on the right, the sound plays completely from the\
    \ right speaker.\n\nThis is done by setting the pan to -100 or 100 before playing\
    \ the sound.\n\n# Task: Panning Sound\n\nYou can also adjust the pan of a sound\
    \ while the sound is playing. You can use this to make sounds appear to come from\
    \ one side to the other.\n\n+   1. Create a new movie.\n2. Import the sound 22airplane.wav\
    \ from the CD-ROM.\n3. Set the sound's Linkage properties so that it exports with\
    \ the movie and its linkage name is 22airplane.wav.\n4. Create a simple shape\
    \ and convert it to a movie clip. Name it actions.\n5. The load handler attached\
    \ to this movie clip starts the sound playing. It sets the pan to -100 so that\
    \ the sound comes only from one side.\n\n```\nonClipEvent(load) {\n  // load sound\n\
    \  thisSound = new Sound();\n  thisSound.attachSound(\"22airplane.wav\");\n\n\
    \  // set initial pan\n  thisSound.setPan(-100);\n```"
  merge: -1
  pgno: 325
- img_proc: true
  md: "```\n// play three times\nthisSound.start();\n}\n```\n\n6. The enterFrame handler\
    \ looks at the position and duration properties of the sound object. These are\
    \ measured in milliseconds. By dividing these by each other and multiplying by\
    \ 200, you get a value from 0 to 200. Subtract 100 from 200 to get a value from\
    \ -100 to 100, then set the pan to this value:\n\n```\nonClipEvent(enterFrame)\
    \ {\n  // get value from -100 to 100 based on position\n  pan = 200*thisSound.position/thisSound.duration\
    \ - 100;\n\n  // set pan\n  thisSound.setPan(pan);\n}\n```\n\nThe result is that\
    \ the sound starts on one side, coming completely out of one speaker. Then the\
    \ sound travels to the other side as setPan is used to set the pan to values between\
    \ -100 and 100. The sound should end with a pan of 100.\n\nTry the movie 22airplane.fla\
    \ to see this in action.\n\n# Sound Transforms\n\nAlthough setVolume and setBalance\
    \ seem to provide a lot of control over a sound, you can go further. By creating\
    \ sound transform objects, you can precisely control stereo sounds—which sound\
    \ channel comes out of which speaker.\n\nIn a typical sound played in a typical\
    \ way, the left channel's sound comes out of the left speaker, and the right channel's\
    \ sound comes out of the right speaker.\n\nHowever, you can change this by creating\
    \ a sound transform object and applying it to the sound object with a setTransform\
    \ command.\n\nA sound transform is actually just a plain variable object. But\
    \ it needs to have four specific properties. Here is an example:\n\n```\nmySoundTransform\
    \ = {ll: 75, rr: 25, rl: 25, lr: 75};\n```\n\nThe four properties have two characters\
    \ in each of their names. The first character represents the speaker. The second\
    \ character represents the channel. So ll is the property that determines how\
    \ much of the left channel comes out of the left speaker. rl is how much of the\
    \ left channel comes out of the right speaker."
