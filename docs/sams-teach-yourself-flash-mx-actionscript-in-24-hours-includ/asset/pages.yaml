  md: '# Hour 1


    +   * Calculations ActionScript can take numbers and perform calculations with
    them. It can predict a mortgage payment or add the cost of items in a shopping
    cart.

    * Graphic Alterations Scripts can be written to alter the size, angle of rotation,
    or even the color of movie clips in your movie. You can even duplicate or remove
    items from the screen.

    * Examine the Environment You can use ActionScript to examine the playback environment
    of a Flash movie. You can find out time and date it is and what location the movie
    is being played from.

    * Play Sounds ActionScript is a good alternative to the Flash timeline for playing
    sounds. You can even control the balance and volume of a sound.


    # Expanding the Possibilities of Flash


    The most important thing that ActionScript can do for you is something I can''t
    list here—because it hasn''t been thought of. A powerful programming language
    such as ActionScript, combined with a strong imagination, can bring new and innovative
    results.


    The purpose of this book is to teach you the basics of ActionScript so that you
    can use these building blocks to create your masterpieces.


    Next, we''ll get a little more technical and look at exactly where ActionScript
    code fits into a Flash movie.


    # Where Scripts Go


    The first question many developers have when learning ActionScript is “Where do
    the scripts go?”


    Flash is a complex multimedia author environment. If you have used Flash for a
    while, or have just run through the tutorials with Flash MX, you know the basic
    elements that make up this environment. There are three places where scripts can
    be placed among these elements.


    # Scripts in the Timeline


    Each scene in a Flash movie has a timeline. Each key frame in this timeline can
    hold a script. In addition, you can have multiple scripts on the same frame by
    placing them in different layers in the timeline.


    To place a script in the main timeline, first select any key frame. If you are
    starting a new movie, there should be one empty key frame in the timeline. Figure
    1.1 shows an empty timeline, with the default key frame selected.'
