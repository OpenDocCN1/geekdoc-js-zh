    In the trigonometry example earlier this hour, you learned how to make a movie
    clip around in a circle. Let''s create that concept even further by making a movie
    showing four planets orbiting the sun. In addition, the third planet will have
    a moon orbiting it.


    +   1. Create a new movie.


    Make six movie clips from simple circles. Name them sun, mercury, venus, earth,
    mars, and moon. Give them the same names as their library names. You can make
    them different sizes, relative to each other. They should be fairly small. See
    the example movie 1planets.fla to get the idea of their sizes.


    +   2. Position the movie clip in the center of the screen. All the planets will
    orbit around the center of this movie clip. The positions of the other movie clips
    don''t matter because we will control of their positions with ActionScript right
    away.


    +   3. Attach this script to the movie clip:


    ```

    onClipEvent(load) {

    speed = .4;

    radius = 40;

    orbit = 0;

    }

    ```


    ```

    onClipEvent(enterFrame) {

    orbit += speed;

    this.x = Math.cos(orbit) * radius + _root.sun.x;

    this.y = Math.sin(orbit) * radius + _root.sun.y;

    }

    ```


    The load event sets the speed of the planet and the distance it remains from the
    sun. The speed determines how much of the circumference of the circle travels
    in each frame. A speed of .62 would mean the planet would move completely around
    the sun in one frame. A speed of .4 would mean that it would take 15.7 frames
    (6.28/.4) to orbit the sun.


    EveryenterFrame, the orbital position is increased by speed, and the new position
    is calculated. Both x and y positions are adjusted by the location of the sun
    so that the planet''s orbit is centered on the sun.'
