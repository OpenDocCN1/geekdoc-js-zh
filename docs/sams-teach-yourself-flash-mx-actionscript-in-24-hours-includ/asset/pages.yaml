  md: '# Pull-Down Menus and Dynamic Buttons


    This controls the appearance of the pull-down menu but does nothing for its functionality.
    Instead, you need to put normal button scripts on each button. They could take
    the user to another frame if clicked, or perhaps to another page. No script should
    be on the title button, so this need not actually be a button at all. However,
    I like having it a button because you can use the state of a button symbol as
    an easy way to give the user feedback when she rolls over it.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_243_0.png)


    If you are using ActionScript to control other elements on the same frames as
    the pull-down menus, you will probably want to use swapDepths to ensure that the
    pull-down menus appear over any other content.


    The example 16dropdown.fla contains the example shown in Figure 16.1 along with
    the script. No script is attached to the buttons. Execute it to make sure that
    you understand how it works.


    # Task: Using Pull-Down Menus


    Now let''s build a movie that uses this pull-down menu script. We''ll pretend
    that it is a small Web site made entirely of a single Flash movie. The pull-down
    menus are used for navigation.


    There are three sets of menus: About Us, Products, and Store. Each of these three
    menus has between three and five choices.


    +   1. Start with a new movie.

    2. Create a simple button. It shouldn''t have any text on it, but leave a space
    for a text overlay to label the button. Make sure that you use a nice over state,
    by the down state doesn''t need to be anything special.

    3. Create a new movie clip. Name it **About Us Menu**. Make two layers in the
    movie clip named **Label** and **Buttons**.

    4. On the Label layer, place a copy of you. On top of it, place the static text
    **About Us.**.

    5. Make the Label layer stretch across two frames. However, the Buttons layer
    should have two separate keys on each frame. Make the two key frames **off** and
    **on**.

    6. On the second frame of the Buttons layer, add three copies of the button symbol.
    Place them vertically right under the button in the Label layer. Add text on top
    of them to read **History, Clients, and and Partners**. The finished movie clip
    should look like Figure 16.2. You''ll also need to place a stop() command on the
    first frame.'
