    \ clips or the main timeline.\n\n# Summary\n\nYou can target movie clips by using\
    \ syntax or bracket notation. Using square brack-lets you target movie clips by\
    \ name with the name contained in a variable.\n\nYou can target the top level\
    \ of a Flash movie with _root and the level above the current level with _parent.\n\
    \nMovie clips can have scripts attached to them that control what they do. Movie\
    \ clip include load and enterFrame. These events trigger onClipEvent handlers.\n\
    \n# Q&A\n\n+   A lot of things in ActionScript use the underscore, _, as the first\
