  md: "# Task: Bouncing Ball\n\n> Because using _x and _y by themselves affects the\
    \ current movie clip, what do they affect if you use them in the main timeline?\
    \ As you might be able to predict, they change the position of the entire movie,\
    \ shifting it so that all the elements are offset by _x and _y. There's not much\
