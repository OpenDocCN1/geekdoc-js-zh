  md: "# Using XML with Flash\n\nRun this example movie, found on the CD-ROM as 19xmldisplay.fla\
    \ in the 19xmldisplay folder. Examine both the xmldata.txt file and the code in\
    \ the Flash movie. Try changing the XML data values to see the check reflected\
    \ the next time you run the movie.\n\n# Recursive XML Parsing\n\nThe problem with\
    \ the preceding task is that it depends on specific pieces of information being\
    \ specific at node locations. What's the point of calling a node email if you\
    \ are not even going to refer it by name? Besides, what if the creator of the\
    \ XML file accidentally moves the snnumber to the end of the user? Everything\
    \ is out of whack, and your code won't find the right values at the right node\
    \ numbers.\n\nFortunately, there is a way to parse an XML file one node at a time,\
    \ check what is there, and populate fields based on the name of the node.\n\n\
    XML is recursive. This means that an XML document is an XML document. A node in\
    \ that XML document is also an XML document. A node in that XML document is also\
    \ an element, if it is an element, it is a smaller XML document that needs to\
    \ be parsed.\n\nYou can write code that parses XML using a recursive function.\
    \ This function is to examine the current XML document and determine whether it\
    \ is an element or a text node. If it is a text node, it is simply data that needs\
    \ to be placed somewhere. If it is an element, it is a smaller XML document that\
    \ needs to be parsed.\n\nTo explain further, let's look at the code:\n\n```\n\
    function parseData(dataPart,parent,grandparent) {\n  if (dataPart.nodeType ==\
    \ 3) { // get value of text node\n    this[grandparent+\"*\"] = dataPart.nodeValue;\n\
    \  } else if (dataPart.nodeType == 1) {\n    // loop through attributes\n    for(var\
    \ attr in dataPart.attributes) {\n      this[dataPart.nodeName+\"attr\"] = dataPart.attributes[attr];\n\
    \    }\n\n    // loop through children\n    for(var i=0;i<dataPart.childNodes.length;i++)\
    \ {\n      parseData(dataPart.childNodes[i],dataPart.nodeName,parent);\n    }\n\
    \  }\n```\n\nThis function looks at the XML object passed in, which is in the\
    \ parameter dataPart. If it is type 3, it is a text node. In that case, it places\
    \ the text into a text field that has the\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_291_0.png)"
  merge: -1
