  md: 'How can I have more than one group of radio buttons on the screen at the time?


    You could simply place all the radio buttons in a group together in their own
    movie clip. If you do that, you''ll need to refer to the movie clip to use the
    getValue function:group1.myRadioButton.getValue().


    Is there a way to restrict user input to only upper- or lowercase letters?


    No, but you can use String.toUpperCase or String.toLowerCase to convert the results
    of your input when they are finished.


    # Workshop


    The quiz are designed to test your knowledge of the material covered in this hour.
    The answers to the questions follow.


    # Quiz


    +   1. If you have five check boxes on a screen, how many of them can be turned
    on at one time?


    +   2. If you have five radio buttons on a screen, how many of them can be turned
    on at one time?


    +   3. If you want the cursor to immediately appear in an input text, what do
    you need to do?


    +   4. How do you prevent the user from entering any non-numbers into a text field?


    # Quiz Answers


    +   1. All of them. Check boxes are independent of each other, so any combination
    of check boxes can be on or off.


    +   2. Only one radio button in a group can be on at a time. Radio buttons represent
    a situation where the choice is exclusive.


    +   3. First, set a name for the text field. Then use Selection.requestFocus()
    to place the cursor there.


    +   4. Set its restrict property to “0123456789”.'
