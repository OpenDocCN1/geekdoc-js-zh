  md: "# Drawing with ActionScript\n\n3. The createAllText function loops through\
    \ an array of text and calls createText for each one. It also sets the location\
    \ of the movie clip to a random place not too close to the edges of the screen.\n\
    \nThe properties of the movie clip are set to 0. A scale variable is set to a\
    \ number less than 0. For the first movie clip, it is set to -100. The second\
    \ is set to 200, and so on.\n\n```\nfunction createAll(textlist)\n// loop through\
    \ array of text\n(var i=0;i<textlist.length;i++) {\n  // create movie clip with\
    \ this text\n  mc = createText(i,textlist[i]);\n\n  // set random location\n \
    \ mc._x = Math.random()*450+50;\n  mc._y = Math.random()*350+25;\n\n  // set scale\
    \ to nothing\n  mc._scale = 0;\n  mc._yscale = 0;\n\n  // set scale variable to\
    \ negative amount\n  mc.scale = 0-i*100;\n}\n```\n\n4. The init function creates\
    \ the array of text from a single text variable, using the split command. It then\
    \ calls createAllText. The number of movie clips is stored in numWords for later\
    \ use.\n\n```\nfunction init() {\n// create array of text\nvar words = \"Love,Peace,Destiny,Llamas,Fate,History,Cheese,Rainbows,Tiny\
    \ Rocks\";\nvar textlist = words.split(\",\");\n\n// create all text movie clips\n\
    createAllText(textlist)\n```\n\n```\n// remember how many there are\nnumWords\
    \ = textlist.length;\n```\n\n5. The moveText function loops through each movie\
    \ clip and increases its scale variable. Clips that have a scale greater than\
    \ 300 are invisible. Clips between 0 and 300 are shown at that scale. Clips that\
    \ have not yet reached 0 are left unchanged.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_355_0.png)"
