  md: '# ActionScript and JavaScript


    If you are already familiar with JavaScript, you may be excited by the fact that
    ActionScript and JavaScript can communicate. However, this technology has one
    flaw: it doesn’t work on all browsers.


    The JavaScript communication is made possible by one of two technologies. The
    first is LiveConnect, a technology built into Netscape Navigator versions before
    version 6. The second technology is ActiveX,


    However, Netscape Navigator 6.0 does not include LiveConnect. The technology has
    been abandoned. In addition, Internet Explorer on the Mac does not use ActiveX.


    You are left with bug exceptions to ActionScript/JavaScript communication: Internet
    Explorer on Mac and all Netscape 6 browsers. That’s enough to make most Web developers
    stay away from ActionScript to JavaScript altogether.


    However, if you are operating in a situation where all your users are on Internet
    Explorer for Windows, you could potentially use this technology. Either way, it
    is worth taking the time to learn.


    # Sending Messages to JavaScript


    Sending a message from ActionScript to JavaScript involves one line of ActionScript,
    but many changes to your HTML page.


    If you choose the Flash with FSCommand option in the Publish settings, you will
    get an HTML page already modified to accept these messages. You just need to find
    the portion marked Code Here and insert your own JavaScript code.


    To understand how this works, let’s look at a slightly cleaned-up version of the
    HTML that Flash exports.


    First, look at the OBJECT/EMBED tag. This has several new parts to it to support
    communication. There is an ID parameter in the OBJECT tag and a matching NAME
    parameter in the EMBED tag. These both name the Flash movie so that JavaScript
    can access it. There is also an swLiveConnect parameter in the EMBED tag for older
    versions of Netscape use LiveConnect to facilitate this kind of communication.


    ```

    <object class="clsid:D27C086-AE60-11CF-968B-444553450000"

    base="http://download.macromedia.com/pub/shockwave/caps/

    [ic:flash]flashmovie.cab#version=5,0,0

    ID=flashmovie WIDTH=120 HEIGHT=120>

    <PARAM NAME=movie VALUE="17ajost.swf"> <PARAM NAME=quality VALUE="high"

    -<PARAM NAME=bgcolor VALUE="#FFFFFF"> <EMBED src="17ajost.swf">

    ```


    ![](img/9e6d716993ade8c40e3512ad7da0a693_261_0.png)'
  merge: -1
  pgno: 261
- img_proc: true
  md: "# 244\n\n# Hour 17\n\n```\nquality=high bgcolor=#FFFFFF WIDTH=120 HEIGHT=120\n\
    swLiveConnect=true NAME=flashmovie TYPE=\"application/x-shockwave-flash\"\nPLUGINASAME=\"\
    http://www.macromedia.com/shockwave/download/\nindex.cgi?f_Prod_Version=ShockwaveFlash*\"\
    ></EMBED>\n<OBJECT>\n```\n\nBefore the OBJECT/EMBED tag is a script. The first\
    \ part is a JavaScript function named the same as your movie ID with a _DoFSCommand\
    \ to do so. If the movie is given the ID flashmovie, then it will called flashmovie_DoFSCommand.\n\
    \nIt is somewhat likely that you will need to send a message back to the Flash\
    \ movie as a result of the function. Internet Explorer and Netscape see the movie\
    \ differently. Internet Explorer sees it as just flashmovie, assuming that is\
    \ its ID, whereas Netscape sees it as document.flashmovie. A reference to the\
    \ object is put in the variable flashMovieObj.\n\nFinally, the function concludes\
    \ showing the contents of the two parameters passed to JavaScript.\n\n```\n<SCRIPT\
    \ LANGUAGE=JavaScript>\nfunction flashmovie_DoFSCommand(command, args) {\n  if\
    \ (navigator.appName.indexOf(\"Microsoft\") != -1) {\n    var flashMovieObj =\
    \ flashmovie;\n  } else {\n    var flashMovieObj = document.flashmovie;\n  }\n\
    \n  alert(command);\n  alert(args);\n}\n```\n\nWait, there's more. It turns out\
    \ that Internet Explorer doesn't facilitate communication between Flash and JavaScript\
    \ at all. Instead, Flash can only communicate with VScript. Microsoft's little-used\
    \ JavaScript-like language. However, VScript can communicate with JavaScript.\
    \ This new piece of code creates a VScript function that passes arguments along\
    \ to JavaScript.\n\n```\nif (navigator.appName && navigator.appName.indexOf(\"\
    Microsoft\") != -1 && navigator.userAgent.indexOf(\"Windows 3.1\") != -1) {\n\
    \  document.write('<SCRIPT LANGUAGE=VBScript>\\n');\n  document.write('on error\
    \ resume next \\n');\n  document.write('call flashmovie_DoFSCommand(command, args)\\\
    n');\n  document.write('end sub\\n');\n  document.write('</SCRIPT> \\n');\n}\n\
    >\n```"
