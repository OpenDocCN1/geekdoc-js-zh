- img_proc: true
  md: '# Dynamic Text


    You can display text in Flash using dynamic text fields. These are like the input
    text fields you learned about Hour 9, “Getting Input From The User,” but they
    cannot be used for direct user input.


    Instead, dynamic text fields can be used to display text with different styling
    and fonts.


    # Dynamic Text Options


    You create a dynamic text field by using the Text tool just like you would for
    an input text field. However, instead of “Input Text”, “Dynamic Text”, as shown
    in Figure 10.1.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_158_0.png)


    The next step is to link this field to a variable, just like you do with input
    text. In Figure 10.1, you can see that I linked the field with a variable named
    “myText”. Now, whenever I change the variable “myText”, the dynamic text field
    will change to mirror it.


    You can also choose from a variety of other options. You can make it “Single”,
    “Multiline”, or “Multiline No Wrap” to reflect how you want the field to handle
    long lines. For a bit of information that only take up one line, like the score
    in an arcade game, you should use “Single”. In most other cases, you should use
    “Multiline”.


    Across the top of the Properties panel, you will see some controls that let you
    set the font, size, and style of the text in the field. You can also click the
    Format button to change the indent, line spacing, and margins.


    > Although you can change the x and y position of the field in the Properties
    panel, don''t change the width and height. Doing so does not make the text area
    larger, but instead stretches any text inside it. If you want to change the width
    and height of a dynamic text field, do so by grabbing the bottomright corner of
    the field in the work area and dragging.


    In the middle of the Properties panel, you will see three little buttons. The
    first one, which looks like an “Ab” lets you decide whether or select the text
    in the field.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Creating and Controlling Text


    Select this option if the user is supposed to be allowed to select and copy the
    text. In most cases, you will want it off. The next little button determines whether
    you can use HTML formatting in the field. We''ll look at HTML formatting in the
    next section. The third button places a border around the field.


    The Character button in the Properties panel lets you decide which characters
    of the font will be saved with the movie when you publish it.


    Say that you have a dynamic text field and want to put "Hello World." into it.
    First, you need to set the Var property in the panel to a variable name, such
    as myText. After that is done, don''t worry about it, just set the variable.


    ```

    myText = "Hello World.";

    ```


    It''s easy. You can do much more with dynamic text fields.


    # HTML Formatting


    The easiest way to add formatting to dynamic text fields is to use HTML. First,
    you''ll need to set the field to accept HTML. You do this by clicking the little
    Render button in the middle of the Properties panel. It looks like "<>". When
    this is turned on, you can use a few selects to change your text. Here is an example:


    ```

    myText += "This text is <b>bold</b><BR>;"

    myText += "This text is <i>italic</i><BR>;";

    myText += "This text is <u>underlined</u><BR>;";

    myText += "This text is <FONT COLOR=#FF0000>red</FONT><BR>;";

    myText += "This text is <FONT SIZE=4>Arial Black</FONT><BR>;";

    myText += "This text is <SIZE=Large</SIZE><BR>;";

    myText += "This text is <A HREF="link.html">linked</A><BR>;";

    ```


    This code builds a string of text that includes some HTML tags. Figure 10.2 shows
    the result. You can see this in 10htmltext.file.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_159_0.png)


    | This text is Arial |

    | This text is bold |

    | This text is underlined |

    | This text is italic |

    | Arial Black |

    | Large |


    Notice that this is not a complete HTML with a <body> tag or anything, so it is
    not true HTML. However, by using regular tags as <B>, <I>, and <FONT>, it is easy
    to learn and remember what works. Here is a complete list of tags that work in
    Flash 6:


    +   - <b></b>: Bold

    - <i></i>: Italics'
  merge: -1
  pgno: 159
- img_proc: true
  md: '+   • <U></U>: Underline


    +   • <FONT FACE=''Arial Black''></FONT>: Font


    +   • <FONT SIZE=''24''></FONT>: Set text size


    +   • <FONT COLOR=''#######''</FONT>: Color


    +   • <A HREF=""></A>: Hypertext link to a Web page


    +   • <P></P>: Define a paragraph


    +   • <BR>: New line


    The hyperlink is the most functional of all the tags. On the one hand, it doesn''t
    display blue and underlined like tags in browsers, but it does the work. If you
    click on a link, the page it refers to load. If you want to color or style the
    text, you can apply those independently of the <A HREF tag.


    # TextMesh Object


    Another way to set the font, size, and style of dynamic text is to use a TextFormat
    object. To do this, you create a variable and define it as an instance of TextFormat.
    Then, you can set various properties of this variable. In the example, the font
    is set to Arial Black, the size is set to 26, and the color is set to red. The
    dynamic text field has been named textInstance. We have never named a text before,
    but you can see in 10.1 where the name goes.


    ```

    myFormat = new TextFormat();

    myFormat.font = "Arial Black";nmyFormat.size = 36;

    myFormat.color = 0xFFFF;

    ```


    textInstance.setTextFormat(myFormat);


    ![](img/9e6d716993ade8c40e3512ad7da0a693_160_0.png)


    > You have to use various methods in Flash to define colors. It depends on what
    part of ActionScript you are using at the time. 0xFFFF is used, where the initial
    0 defines as a hexadecimal color definition. However, in the earlier HTML tag,
    we used #FFFF to define the same color.


    You can see this code of action in the example movie 10format.fla. The setTextFormat
    command can also accept a second and third parameter to tell it the first and
    last characters to apply the format to.


    You can use text format objects like style sheets in HTML. You can define several
    of them at the start of your movie and apply those formats as you need them throughout
    the movie.'
