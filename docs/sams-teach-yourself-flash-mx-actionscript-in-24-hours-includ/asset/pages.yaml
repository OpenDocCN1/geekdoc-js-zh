  md: 'How do I address a movie clip that is two levels down?


    Using dot syntax, you can address the movie clip “innerClip” inside “outerClip”
    like this: innerClip.outerClip.stop(); Similarly, you can use brackets to do it
    this: ["innerClip\]["outerClip\].stop();


    In the last task, the global variable clipToTell is available only inside the
    movie clips. What if I wanted to get that value from the root level?


    You could use dot syntax or brackets to address the variable the same way that
    you do send commands to movie clip—for instance, cog1.clipToTell.


    In the last task, if the first movie clip assigns one value to clipToTell and
    the second movie clip assigns another value to clipToTell, doesn’t the second
    assignment replace the first?


    +   No The global clipToTell exists as variables inside each movie clip. Think
    of the first one as cog1.clipToTell and the second one as cog2.clipToTell.


