- img_proc: true
  md: '# Your First Look at ActionScript


    With the loops of HTML, the exception of all the languages mentioned use similar
    constructs: loops, conditions, variables, and so on. You''ll be able to apply
    your skills to ActionScript as soon as you know the specific syntax that ActionScript
    uses. However, if you have never learned a programming language, don''t worry.
    I''ll show you everything you need to know in the upcoming hours.


    1


    # Origins of ActionScript


    So where does ActionScript come from? It actually has its roots in many different
    places. Let''s take a moment to learn about how computer languages came from.


    When digital computers were first created, the only way to program them was in
    their native language: binary code. This is simply a list of 1''s and 0''s. When
    different groups of 1''s and 0''s are combined and fed into a computer, it can
    trigger the computer to behave in different ways. A long program written this
    way might perform a simple task such as adding two numbers together.


    Instead of rewriting binary code every time someone wanted to add two numbers
    together, the code was written in such a way that it could add any two numbers.
    Instead of writing the code over again, you could simply reuse the code, but feed
    different numbers each time. Little functions like this were soon created to handle
    all sorts of tasks such as addition, subtraction, multiplication, comparisons,
    looping; and so on. Pretty soon, instead of writing in binary code, you could
    use these prewritten functions to perform almost any task.


    Today''s computer languages are much easier to understand and use than binary
    code and its immediate successors. For one thing, modern computer languages look
    like English. Words such as “go,” “for,” “begin,” and “if” are used, as well as
    operators such as +, -, and =.


    Some computer languages, such as BASIC, Pascal, and Macromedia Director''s Lingo,
    can almost be read like English sentences. They are easy to learn and understand.
    Other languages, such as C and Fortran, look very technical. They are more powerful
    in the hands of experienced programmers. More recent languages form a balance
    between these two sides. Languages such as C++, Java, and JavaScript are readable,
    yet powerful. ActionScript is similar to these recent languages.'
