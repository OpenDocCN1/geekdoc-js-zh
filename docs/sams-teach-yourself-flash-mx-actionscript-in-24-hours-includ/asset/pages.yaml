    # HOUR 17


    # # Browser Navigation and Communication


    You can do two things with a Flash movie: embed it into a Web page or make a standalone
    application. If you embed it into a Web page, the movie can communicate with the
    browser, telling it what to do as well as the other way around.


    In this hour, you will:


    +   - Learn how to load new Web pages

    - Find out how to communicate with JavaScript

    - Open a new window from your movie

    - Make JavaScript send messages to the movie

    - Save user data as JavaScript cookies

    - Create a playback controller in JavaScript

    - Use special commands for standalone applications'
  merge: -1
