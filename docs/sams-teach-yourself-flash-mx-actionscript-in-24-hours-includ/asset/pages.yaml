    # Summary


    You can use a variety of movie clip properties to alter the location and appearance
    of a movie clip. The _x and _y properties allow you to set the horizontal and
    vertical location of a movie clip. You can use _xscale and _width to change the
    horizontal scale of a movie clip, and _yscale and _height to change the vertical
    scale of a movie clip.


    You can rotate a movie clip with the _rotation property. You can also make a movie
    clip semitransparent or completely invisible with the _alpha and _visible properties.


    You can get the horizontal and vertical position of the cursor with the _mouse
    and ymouse properties.


    # Q&A


    +   Q Can I use _x and _y values that are less than 0 or greater than the width
    or height of the work area?

    A Yes. You can use almost any reasonable value for _x and _y. You can position
    movie clips off the edge of the work area. You can still see them if you adjust
    the test window properly, but they will be partially or completely hidden when
    played back in the browser.

    Q Is there any way to detect the mouse location when it is outside the work area?

    A No. You can use the technique of making the work area much bigger than you need
    that there is some extra space around the edge of your graphics where the mouse
    location can be detected.

    Q When you rotate a movie clip, what the point at which it rotates?

    A When you edit a movie clip in the work area, you will notice a small cross at
    the center of the screen. This is the movie clip''s registration point. This point
    corresponds to the location of the _x and _y properties of the movie clip and
    the point of rotation.

    Q If a movie clip already contains a semitransparent graphic, does the _alpha
    property override it?

    A No. The semitransparency of the graphics and the _alpha property are combined
    to determine the final transparency of the movie clip parts.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_123_0.png)'
