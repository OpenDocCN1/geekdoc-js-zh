- img_proc: true
  md: '# Q&A


    Everything on the #p frames will be printed, so you will probably want to make
    up custom frames for printing, ones that don''t have screen elements like navigation
    buttons.


    You can use the print command to print the frames using vector shapes directly
    to the printer. However, if you need to print semitrans graphics or be assured
    that the printing works the same for all users, use printAsBitmap.


    +   - How can I make a Flash movie where a Print button prints the current frame?

    - Place most or all of the frame''s contents into its single-frame movie clip.
    Label that frame in the movie clip with a #p. Use the print or printAsBitmap command
    with the target set to that movie clip. Do this for each.

    - How can I bring up the Page Setup dialog for the user so that she can change
    her settings before printing?

    - When you use print, both the Page Setup and Print dialogs are displayed after
    the other. This may depend a little on your system configuration and print drivers.

    - How can I test the print command without waiting paper?

    - Many print drivers come with a preview option. This means that you can select
    preview instead of Print in the Page Setup or Print dialog. This is a great way
    to test printing. Many recent ink jet printers come with such print drivers, but
    basic business printers usually do not.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What must be done to a frame to indicate that it should be printed?

    2. If you have semitransparent graphics on the screen, which print command should
    you use?

    3. Is there any difference between using the bframe and bmax boundary options
    if you are printing just one frame?

    4. Do you have to show a frame on the screen to be able to print it?'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Quiz Answers


    +   1. Put a #p label on a frame that you want printed.

    2. Use printAsBitmap because print will not handle semitransparent graphics.

    3. None. The bmax option would use the bounding box of the largest frame, but
    because there is only one frame, it doesn''t matter.

    4. No. You can print frames labeled with a #p that have never been shown. However,
    if your movie is in the process of streaming, printing will not work until all
    frames labeled for printing have been loaded.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_303_0.png)'
