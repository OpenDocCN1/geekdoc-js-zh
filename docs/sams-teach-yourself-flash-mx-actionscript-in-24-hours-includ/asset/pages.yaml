  md: "# Writing Code in Flash\n\n# Output Window\n\nA simple but effective tool in\
    \ debugging is the Output window. You can place trace commands in your program\
    \ that send information to the Output window. This information tell you what your\
    \ code is doing.\n\nFor instance, suppose that you have a simple loop that doesn't\
    \ seem to work right. By adding a few trace commands, you can get a list of actions\
