  md: '# Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz Questions


    +   1. If you have a movie with several frames, how do you prevent the movie from
    automatically animating through all the frames?

    2. What is the difference between gotoPlay and gotoAndStop?

    3. What are the two on handlers that will respond to a button click?

    4. Why should you avoid using frame numbers in gotoAndStop and gotoAndPlay commands?


    # Quiz Answers


    +   1. Place a stop command on the first frame.

    2. The gotoPlay command jumps to a frame, and the movie continues to flow forward.
    The gotoAndStop command stops the movie on the destination frame.

    3. You can use on (press) to trigger code when the user clicks the button and
    on (release) to trigger code when the user releases the button.

    4. If you use frame numbers, and later insert or remove frames from your timeline,
    you will have to go back and adjust the frame numbers in your code. On the other
    hand, if you use frame names, your code will always go to the right frame.


    Can I place functions inside button scripts?


    No. Functions can be placed only in the main timeline. You can only put handlers
    in button scripts.


    Can I place buttons on a frame but make them inactive?


    Not as easily as you think. You can place a button on a separate key frame and
    not just attach a script to it. But it will still look active. A better method
    would be to create a graphic symbol that looks like inactive version of the button
    and place it in the same spot where the button would normally appear.'
