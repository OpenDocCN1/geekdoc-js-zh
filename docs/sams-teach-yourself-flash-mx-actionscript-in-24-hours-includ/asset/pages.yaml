  md: '# Q&A


    +   - What is the largest number that you can represent in ActionScript?

    - It''s a pretty big number. Using the ActionScriptNumber.MAX_VALUE constant,
    you can find out that it is 1.79769313486231e+308. "308" means that you can move
    the decimal point over 308 places to the right!

    - What if I want to use the real value of pi, rather than approximations such
    as 3.14?

    - Use the constant Math.PI. It resolves to 3.14159265358979, which is still an
    estimation, but it is much more accurate than 3.14.

    - What is Math.round(0.5)?

    This rounds up to 1.

    - Do I have to convert a number into a string before I place it into a text field?

    - No. This is not needed. A text field displays a number just as easily as a string.

    - When should I attachMovie and when should I duplicateMovieClip?

    - BecauseMovieClip leaves its original in place, it usually works out that you
    want to use attachMovie instead. Otherwise, you will always have the first movie
    clip to deal with in some way. However, duplicateClip comes in handy when you
    want to have a movie clip attached to each new instance that you create.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to these questions follow.


    # Quiz


    +   1. What is the result of Math.min(10,Math.max(5,a)) when a is equal to 12?
    What is the purpose of such a statement?

    2. If a movie clip is halfway around a circle, how do you get its horizontal position
    on the screen?

    3. What is the largest possible value returned by Math.random()*7?

    4. If you use duplicateMovieClip to create a copy of a movie clip instance, what
    happens to the original instance?'
