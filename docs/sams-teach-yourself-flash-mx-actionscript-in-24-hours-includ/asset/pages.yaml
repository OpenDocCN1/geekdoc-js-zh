  md: '# ScrollBar


    The last component is the ScrollBar. This adds scrolling bars to text fields.
    You can use this component without any ActionScript at. Just drag and drop a ScrollBar
    component to a text field, and it adds itself there.


    The ScrollBar component has a small list of ActionScript-accessible properties.
