  md: '# Drawing with ActionScript


    the upper-left corner of the field. The last two parameters are the width and
    height of a field.


    The second line of the preceding code sets the text property of the field, which
    changes the text inside it. The result is a simple "Hello World" that appears
    in the upper-left corner of the movie, using the default font and size. You can
    test it for yourself with 24simpletext.fla.


    You can create a more elaborate text field using some special properties and a
    text object. You can read more about the text format object in Hour 10, "Creating
    and Controlling Text."


    Here is a more complex example. The text is displayed in the middle of the screen
    with a specific font, size, and color.


    ```

    createTextField("myTextField",0,0,170,550,60);

    myTextField.text = "Hello World!";

    ```


    ```

    myTextField.embedFonts = true;


    myFormat = new TextFormat();

    myFormat.font = "Arial";

    myFormat.size = 48;

    myFormat.color = 0x330000;

    myFormat.align = "center";

    ```


    ```

    myTextField.setTextFormat(myFormat);

    ```


    The field property embedFonts controls whether device fonts are used to render
    the text, or whether fonts are added to the Library to use.


    > If you choose to add fonts to the Library and use them in ActionScript-exported
    text fields, you must remember to set the field''s Linkage properties that it
    exports with the movie.


    The text properties are set so that the text is Arial, the size is 24, the color
    is a dark red, and the text alignment is centered. You must apply the format with
    the setText command after you set the text.


    The movie 24complextext.fla is a great way to test different field and format
    settings. Consult the ActionScript documentation for the long list of properties
    of both fields and formats.'
