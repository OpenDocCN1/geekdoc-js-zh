  md: "# Pull-Down Menus and Dynamic Buttons\n\nThe scripts in the three buttons of\
    \ the menu use an (release) handler to catch the user choosing menu option. It\
    \ calls collapseMenu and then performs its function—which is just a trace command\
    \ in this example.\n\nThe on (dragOver) and on (dragOut) handlers keep the menu\
    \ expanded when the mouse moves over the buttons and also collapses the menus\
    \ when the cursor moves completely off all menu buttons:\n\n```\non (release)\
    \ {\n  collapseMenu();\n  trace(\"History Button Pressed\");\n}\n```\n\n```\n\
    on (dragOut) {\n  rollOutMenu();\n}\n```\n\nOne last thing needs to be done for\
    \ this work. The buttons need to have a property change. Track as Button setting\
    \ in the button's Property panel needs to be changed to Track as Menu Item. This\
    \ allows the button to get mouse events such as release without first getting\
    \ a press event.\n\nGive the example 16pushmenu.fla a try. It is interesting to\
    \ see a similar functionality to the previous example but with completely different\
    \ code.\n\nThere are also many pull-down menu variations and script variations\
    \ to go with them. It depends on the exact functionality you are looking for and\
    \ which ActionScript commands you feel the most comfortable with.\n\n# Dynamic\
    \ Buttons\n\nAnother way to make pull-down menus and similar things is with dynamic\
    \ buttons. If you open the example 16dynamicbuttons.fla, you can examine the Stage\
