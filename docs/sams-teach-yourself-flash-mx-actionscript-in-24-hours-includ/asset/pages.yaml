- img_proc: true
  md: "The onClipEvent handlers look similar to the ones we have been using. They\
    \ use hitTest to make sure that it is the current movie clip that the user is\
    \ clicking. If either the startDrag or stopDrag command is issued. The first is\
    \ issued when the mouseDown message is sent, and the second the mouseUp message\
    \ is sent.\n\nIn the example, you can click and drag either of the two movie clip\
    \ instances independently. But notice that you can only drag one at a time. Using\
    \ these commands also limits how you can monitor and modify the drag. You will\
    \ need something little more flexible if you want to drag movie clips in advanced\
    \ applications and games.\n\n> The startDrag command can actually accept up to\
    \ five additional parameters. The first is a true or false value that determines\
    \ the center of the movie clip locks to the mouse location. The default is false,\
    \ which is what you usually want. The other four parameters are the left, top,\
    \ right, and bottom limits of the drag. If you set these, the movie clip can't\
    \ be dragged beyond these boundaries.\n\n# Complex Dragging\n\nIf you wanted to\
    \ drag a movie clip, but couldn't use the startDrag and stopDrag commands, how\
    \ would you do it?\n\nYou'll need a movie clip script that has four parts to it.\
    \ The first part, the onClipEvent(load) handler, will set a global variable dragging\
    \ to false. When this variable is true, it will sign the movie clip to follow\
    \ the mouse.\n\nThen, when the user clicks on the movie clip, the dragging variable\
    \ will be set to true. The dragging will then take place in the onClipEvent(enterFrame)\
    \ handler. It will set the _x and _y properties of the movie clip to the _root._x\
    \ and _root._y.\n\nThen, when the user lifts the mouse button, the dragging property\
    \ will be set to false again, and the movie clip will no longer move around to\
