  md: "336 Hour 24\n\nYou can create input text fields with the createTextField command.\
    \ You just need to set the type of the field to \"Input.\" You can set the variable\
    \ of the field to a value so that ActionScript can easily access the information\
    \ that the user enters.\n\n# Task: Flying Words\n\nCreating text with ActionScript\
    \ can allow you to create some effects with almost nothing on the stage or in\
    \ the Library. In this example, a whole series of text fields is created inside\
    \ movie clips. These movie clips fly at the screen and disappear. The result looks\
    \ something like Figure 24.8.\n\nFIGURE 24.8nDriven by ActionScript, different\
    \ words fly at the user.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_354_0.png)\n\
    \n+   1. Create a new movie.\n\n+   2. Open the frame script so you can add functions.\
    \ The first function takes a piece of text and creates a new movie clip that contains\
    \ a dynamic text field with that.\n\n```\nfunction createText(n,text) {\n    //\
    \ create a new movie clip\n    this.createEmptyMovieClip(\"text\"+n,n);\n    mc\
    \ = this[\"text\"+n];\n\n    // set the text format\n    myFormat = new TextFormat();\n\
    \    myFormat.font = \"Arial\";\n    myFormat.color = 0x000000;\n    myFormat.size\
    \ = 24;\n    myFormat.align = \"center\";\n\n    // create a new text field\n\
    \    mc.createText(\"myTextField\",1,-100,-20,200,40);\n    mc.textField.text\
    \ = text.toUpperCase();\n    mc.textField.embeddedFonts = true;\n    mc.textField.setTextFormat(myFormat);\n\
    \n    // return reference to this movie clip\n    return(mc);\n}\n```"
