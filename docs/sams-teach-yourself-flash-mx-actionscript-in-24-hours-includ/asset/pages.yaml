- img_proc: true
  md: "# FIGURE 21.6\n\nThe ListBox component allows the user to select one or more\
    \ choices.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_312_0.png)\n\nWhen you\
    \ create a ListBox instance, you must set its Select Multiple parameter. If true,\
    \ you can use the Shift, Command, or Ctrl keys to select more than one. If false,\
    \ only one line may be selected at a time.\n\nIn addition, you must set the Labels\
    \ parameter. However, this is not a single value but an array of values. Flash\
    \ has a special interface for entering these values. When you click on the Labels\
    \ parameter in the Properties panel, you get a dialog that looks like Figure 21.7.\n\
    \n# FIGURE 21.7\n\nThe Values dialog lets you enter an array of items for different\
    \ component parameters.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_312_1.png)\n\
    \nYou also have a Data parameter that can take an array of data. This Data parameter,\
    \ like the one used with radio buttons, allows your code to get additional information\
    \ about the choice(s) that the user made. However, it is not required.\n\nIn the\
    \ example 21listbox.fla, I have placed a ListBox component with three choices\
    \ on the screen. To accept multiple selections. When the user clicks on a line,\
    \ the listBoxChange function is called. This is specified by its Change Handler\
    \ parameter. This function tests which list you selected:\n\n```\nfunction listBoxChange(listBoxInstance)\
    \ {\n  trace(listBoxInstance.getValue());\n}\n```\n\nThere is also a PushButton\
    \ component in the example. When it is clicked, it runs this function. You use\
    \ the getItems() function to get an array of the choices selected in the list\
    \ box. Each item in the array is an object with a label and data property. Because\
    \ we didn't use the data properties of the list box, we'll get the labels instead."
