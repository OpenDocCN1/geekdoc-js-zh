    \ all the menus across the entire movie. This way, the menus acts as the navigation\
    \ solution for the movie.\n\n# Push Pull-Down Menus\n\nThere are many different\
    \ ways to program a pull-down menu. There are also many ways that a pull-down\
    \ menu can work. For instance, in the preceding example, all the user has to roll\
    \ over the title button and the menu appears. I like this way because the user\
    \ can easily figure out where the pull-down menus are by just moving the mouse\
    \ around.\n\nHowever, pull-down menus commonly work in another way: The user clicks\
    \ on the title button for the menu to appear. Then the user must hold down the\
    \ mouse button, move the cursor down to the selection, and release the mouse button\
    \ at point.\n\nThe example 16pushmenu.fla demonstrates this variation of the pull-down\
    \ menu. The menu elements are the same: a two-frame movie clip with title button\
    \ on both frames and the menu buttons on the second frame only. However, the scripts\
    \ are completely different.\n\nNo scripts are on the movie clip. They are all\
    \ inside the movie clip on the frame, or attached to the buttons.\n\nThe title\
    \ button has the following script. It calls the function expandMenu where the\
    \ button is clicked. If the mouse is released over the title button, or anywhere\
    \ outside the buttons, collapseMenu is called:\n\n```\non (press) {\n  expandMenu();\n\
    }\n```\n\non (release, releaseOutside) {"
