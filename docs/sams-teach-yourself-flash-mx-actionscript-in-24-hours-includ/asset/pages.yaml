  md: '# Printing


    As you can see, the boundary option is actually passed in a string. You must put
    quotes around it.


    You can see an example of the print command in action in the movie 20piechart.fla.


    # PrintAsBitmap


    The companion command to print is printAsBitmap. This command works just like
    print, with the same two parameters.


    The difference between print and printAsBitmap is that print actually sends vector
    graphics and fonts to the printer. The printer then re-creates the vectors and
    text when building the page.


    On the other hand, printAsBitmap converts the entire screen to a large bitmap
    image and sends to the printer.


    The main advantage of printAsBitmap is that alpha transparencies can be printed;
    so if you have semitransparent graphics, you will need to use this. It works with
    a wider variety of print devices.


    The print command has the advantage of producing nice, smooth curves and text
    on higher-end printers. It may also be faster if printing over a network.


    A good general rule is to use printAsBitmap at times you want to be assured printing
    works and that the results mirror what is onscreen. Use print when accuracy is
    not critical or when you are making the movie for a controlled environment like
    a corporate intranet.


    > If you are streaming your movie over the Internet, note that printing should
    work only after all the frames you have printed loaded. You may just want to check
    make sure that the whole movie has loaded before allowing the user to print. See
    Hour 23, “Managing Movie Streaming,” to learn about streaming and how to detect
    whether a movie is fully loaded.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_299_0.png)


    20


    # Task: Printable Form


    One thing I hate to see on the Web is a printable form that you need to print
    out, fill out, and then mail. It is the filling out that I object to. I''m using
    a computer, but then inevitably have to find a pen and a clear spot on my desk
    to write?


    So why not allow the user to fill out the form right on the screen? Then you can
    print the form, complete with the text the user entered.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'Doing this is simple with Flash and has some definite advantages over placing
    an HTML form on a page and asking the user to print out the entire Web page. You
    can completely control what gets printed, so that miscellaneous elements on the
    page get ignored, and new elements, such as a mailing address for the form, can
    be added.


    +   1. Create a new Flash movie.


    +   2. Add a lot of input text fields on a layer named content. You can see which
    fields to add in Figure 20.4. This layer should be named Content.


    # Figure 20.4


    This form contains various fields to be filled out, plus a Print button.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_300_0.png)


    +   3. Add a title to the top, complete with a title bar under it. Place these
    on two separate rate frames named Title and Title Bar.


    +   4. Create a Print button and place that on its own frame named Buttons.


    +   5. Add this script to the button:

    on (release) {

    print(this, "bmax");

    }


    +   6. Now add a second frame to the movie. Stretch the Title Bar and Content
    layers onto this second frame. However, create new blank key frames for the Buttons
    and Title layers. They will have different content on frame 2.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Printing


    7. In the second frame of the Title layer, put a different title. For instance,
    if the first frame is titled Fill Out This Application, the second frame can be
    titled just Application. After, if the printed application is already filled out,
    the original title doesn''t make sense anyone. You can see this new title in Figure
    20.5.


    # FIGURE 20.5


    This frame has a different title, and is missing the Print button, but has a signature
    line and mailing instructions.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_301_0.png)


    8. Add a new layer Signature. Put a key frame on the second frame of this layer.
    Add a signature line and mailing instructions to this key frame, as shown in Figure
    20.5. These should not be visible on the first frame, only the second.


    9. Add a Frame Labels. Place two key frames on it. The second key frame, in the
    second frame of the movie, needs a #p label on it. Use the first key frame to
    place a stop ( ) stop so that the movie stops on frame 1.


    Test your completed movie. You should be able to fill out the form and click the
    Print button. The second frame prints, complete with a new title, signature line,
    and mailing instructions.


    The sample movie 20printform.fla contains my version of this example.


    # Summary


    To print frames of a movie, you first need to label those frames with a #p label.
    You can label one or more frames for printing.'
