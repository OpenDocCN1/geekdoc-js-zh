  md: "# Special Projector Commands\n\nThe fscommand command can also be used in projectors,\
    \ which are standalone Flash movies. However, only a few special commands can\
    \ be used.\n\nThe simplest command is quit. This takes no second parameter but\
    \ simply exits the projector quickly. Here is a script for a projector button:\n\
    \n```\non (release) {\n  fscommand('quit');\n}\n```\n\nTwo commands deal with\
    \ scaling. The fullscreen command takes a true or false as a value and forces\
    \ the projector to scale up to the full size of the user's screen. The allscale\
    \ command, if set to true, scales the movie to fit whatever size the window is\
    \ currently.\n\nThe showmenu command turns on or off the menu that the user sees\
    \ with the projector.\n\nFinally, the exec command takes a given path and attempts\
    \ to execute an application at that path. This could be another projector or something\
    \ like Wordpad.\n\n# Summary\n\nUsing the getURL command, you can load a new Web\
    \ page to replace the current one, or load a new page in another frame or window.\
    \ You can use the special parameter _blank to load a new page in a new window.\n\
    \nActionScript has the capability to communicate with JavaScript, provided that\
    \ the browser supports this communication. You can use fscommand to send messages\
    \ to the HTML page where a JavaScript function intercepts it. From there, you\
    \ have to write JavaScript code that uses the information sent.\n\nYou can have\
    \ JavaScript send information back to Flash. A whole set of commands can be sent\
    \ to Flash, including ones that change frames and variables.\n\nThe fscommand\
    \ can also perform special tasks in projectors, such as quitting the projector,\
    \ enlarging the projector to full screen size, or running another application.\n\
    \n# Q&A\n\n+   - Can I use getURL to open HTML pages on the user's local hard\
    \ drive?\n\n+   - Yes, just like you by using an <A HREF> tag in HTML. The getURL\
    \ command just passes the information to the browser. The browser does all the\
    \ work. So anything a browser can do with a URL, the getURL command can do.\n\n\
    ![](img/9e6d716993ade8c40e3512ad7da0a693_267_0.png)"
