- img_proc: true
  md: '# Working with Numbers


    # Math.ceil, Math.floor


    Two other functions that convert floating point numbers to integers are Math.ceil
    and Math.floor. The first rounds a number up to the nearest integer, and the second
    rounds a down. So the result of these examples is 7:


    ```

    trace(Math.ceil(6,1));ntrace(Math.floor(7.9));

    ```


    # Math.min, Math.max


    You can compare two numbers and the smallest or largest of the two using Math.min
    and Math.max. For instance, if “a” is 5 and “b” is 4, Math.min(a,b) returns 4,
    and Math.max(a,b) returns 5.


    # Math.pow


    If you need to raise a number by a power, you can do so with the Math.pow function.
    The first parameter is the number, and the second is the power. To get 4 to the
    third power, you can do this:


    ```

    trace(Math.pow(4,3));

    ```


    # Math.sqrt


    You can also use numbers less than 1 as the power in Math.pow. This means that
    you can use Math.pow(x,.5) to get the square root of x. Or, you could use the
    shortcut function Math.sqrt.


    ```

    trace(Math.sqrt(4));

    ```


    # Trigonometry Functions


    Most of the previous Math functions are easy to understand and use. However, you
    may not remember how to use the trigonometry functions such as sine and cosine.


    Although it would be easy to skip these functions, they are incredibly useful
    for creating animated effects. I''ll try to explain how they work.


    The sine and cosine functions, referred to in ActionScript as Math.sin and Math.cos,
    represent the relationship between a straight line and the curve of a circle''s
    circumference.


    Figure 11.1 shows a circle with several points marked with labels. Imagine the
    center of the circle is at point 0.0. The radius of the circle is 1, so the top
    point is 0,1, and the rightmost point is 0,1.'
