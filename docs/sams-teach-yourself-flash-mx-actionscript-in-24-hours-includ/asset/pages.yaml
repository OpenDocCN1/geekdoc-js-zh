  md: '# Controlling the Flow of the Movie


    # Adding a Script to a Button


    To add a script to a button, select the button. Then bring up the Actions panel.
    Alternatively, you can right-click the button in Windows, or Control+click the
    button on the Mac. Select Actions from the menu that appear.


    Make sure that the Actions panel is set to Expert mode. You can check this in
    the pop-up menu that is activated at the upper-right corner of the window.


    Here is a typical button script. You can place this script in the script window
    and test the movie to see whether it works. Figure 5.3 shows the Actions panel
    with the script in it.


    ```

    on (release) {

    trace("You clicked the button!")

    }

    ```


    ![](img/9e6d716993ade8c40e3512ad7da0a693_89_0.png)


    **Figure 5.3** The Actions panel with a simple button script.


    Scripts use a special syntax that starts with the keyword. This creates a handler.
    It is called simply because it "handles" an event. In this case, the event is
    release, which is what happens when the user clicks the button and releases. That
    is the most common type of button event.


    You could also use the alternative event press in place of release. The difference
    is that the handler will run when the user first clicks the button and will not
    wait for the user to release the mouse button.


    When a handler is activated, the code inside the brackets is executed. In this
    case, just a trace command is there. It sends a message to the Output window to
    let you know that the script worked.


    Now let''s put our knowledge of ActionScript navigation commands and button scripts
    to work.'
