  md: '# Sending Information to the Server


    Perl is a simple language that is installed on most Web servers. It is the choice
    of beginning CGI programmers and of those who don''t have full access to their
    server, such as people who use a separate Internet service provider for their
    Web hosting.


    There is a basic Perl program; it outputs the words “Hello World!” when called:


    ```

    #usr/local/bin/perl

    print "Content-type: text/html\n\n"

    print "Hello World!",

    ```


    The first line of the program simply defines it as a Perl program. It tells the
    Web server to use the program /usr/local/bin/perl to interpret and run the code.
    This is the typical location of Perl on a typical Web server.


    The other lines of the program use the simple print command to output the text.
    The first line defines the type of document, in this case a text/html document.
    Web browsers use this first line to figure out how to interpret the rest of the
    document. The last line outputs “Hello World!”


    If you put this code into a file helloworld.pl and upload it to your Web server,
    you should be able to go to that location with a Web browser and get the words
    “Hello World!” back. For instance, if the file was uploaded to http://www.mydomain.com/test/helloworld.pl,
    you can go to that URL with Internet Explorer or Netscape to run the program.


    Try it. If this is your first time using CGI programs, you will probably not see
    “Hello World!” but instead something like this:


    Forbidden

    You don''t have permission to access /test/helloworld.pl on this server.


    Don''t have permission! But it is your Web site!


    Well, you have to set the permissions on this CGI program to allow it to run as
    a program. Otherwise, the security measures on your server forbid it from executing.


    So do you set the permissions of a file on your server? Well, this is where I
    stop. There are many different types of servers, many different setups used by
    ISPs, and many different programs with different interfaces that allow you to
    set permissions. However, I will give you a list of things you can do to get your
    first CGI program up running:


    +   - Figure out what type of Web site you have. Is it a company Web site? Then
    you probably have a company system administrator who can help you.

    - If you use a quality hosting provider, there are probably how-tos and help files
    you can refer to on its Web site.'
