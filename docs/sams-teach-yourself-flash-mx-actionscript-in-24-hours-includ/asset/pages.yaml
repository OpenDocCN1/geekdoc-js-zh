  md: 'With ActionScript and random numbers, you can position a snowflake randomly
    on the screen, give it a random speed and spin, and even move the snowflake back
    to the top of the screen when it hits the ground so that the snow continues to
    fall.


    +   1. Create a new movie.


    +   2. Draw a snowflake. Make it movie clip named Snowflake and make the instance
    of this movie clip on the screen snowflake.


    +   3. Attach this to it. It will assign it a random position when the movie starts.
    It will also have a random vertical speed, horizontal drift, and spin.


    ```

    onEvent(load) {

    this._x = Math.random()*550; // 0 to 550

    this._y = Math.random()*400; // 0 to 400

    speed = Math.random()*3; // 3 to 6

    drift = Math.random()*2-1; // -1 to 1

    rotate = Math.random()*6-3; // -3 to 3

    }

    ```


    ```

    onEvent(enterFrame) {

    this._y += speed;

    this._x += drift;

    this._rotation += rotate;

    }

    ```


    ```

    // bring back to top

    if (this._y > 400) this._y = 0;

    ```


    ```

    // one side to another

    if (this._x < 0) this._x = 550;

    if (this._x > 550) this._x = 0;

    ```


    When the enterHandler runs, it moves the snowflake down by speed and horizontally
    by drift. It also rotates the snowflake by rotate.


    It checks to see whether the snowflake has passed the bottom of the screen and
    recycles it to the top if it has.


    If the snowflake drifts off the right side of the screen, it is moved to the left
    side of the screen and vice versa.


    +   4. Test the movie. The snowflake appears randomly and drifts down. When it
    hits the bottom, it appears back at the top.


    +   5. Now let''s make really snow. Place this script in the frame on the main
    timeline:


    ```

    // create 50 additional snowflakes

    for(var i=0;i<50;i++) {

    snowflake.duplicateMovieClip("snowflake"+i,i);

    }

    ```'
