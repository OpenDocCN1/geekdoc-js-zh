    # Q&A


    +   Q Can I write complex programs in Normal mode?

    A Certainly. However, the better you become at ActionScript, the more the Normal
    mode will slow you down. Think of Normal mode as training wheels for novice programmers.

    Q If I write a program in Normal mode, can I go back and edit it under Expert
    mode?

    A Yes. You can always switch from Normal mode to Expert mode and continue to modify
    the same code. However, you can only switch from Expert mode back to Normal mode
    if there are absolutely no syntax errors or incomplete commands in the code.

    Q How do I know whether the online help I am using is up-to-date?

    A Check Macromedia Web site occasionally for updates to the online help system.
    If they update it, they will include an installer or instructions on how to update
    your help.

    Q Typing in the Actions panel seems slow. Is there any way to speed it up?

