    \ except that the condition is checked before different places. In the while loop,\
    \ whereas in the do loop, it is checked after each iteration of the loop. The\
    \ difference is that the do loop always runs at least once.\n\n# Breaking Out\
    \ of Loops\n\nAll three kinds of loops can use two optional commands to change\
    \ the flow of the loop. The first command, break, stops the loop and jumps right\
    \ to the instruction following the loop.\n\nThe other command, continue, terminates\
