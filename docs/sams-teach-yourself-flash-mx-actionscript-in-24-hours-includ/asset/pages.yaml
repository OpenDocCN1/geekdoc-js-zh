  md: '# # Sending Information to the Server


    # # Sending Data


    You can also send data with your LoadVars object. First, you need to put some
    data in the object. You can then use the send command to send it to the server
    in the same format as an HTML form.


    ```

    myVars = new LoadVars();

    myVars.name = "George";nmyVars.ID = 47;

    myVars.send("serverprogram.cgi", _self\);

    ```


    This code creates the variable myVars as a LoadVars object. It adds two properties
    to it. Finally, it sends this information to the server, specifically to the CGI
    program named echo.


    The send command works much like an HTML form. As a matter of fact, if you include
    the optional _self parameter, it will replace the entire Web page with the results
    from the server, just like posting with an HTML form will replace the entire page
    of the operation.


    You can vary this a little by specifying another target frame or window with a
    second parameter to send. Then the results of post are returned in another window,
    and the page with the Flash movie moves on. You can use blank,_top, or parent
    as as omit the second parameter altogether, no specific window or frame name is
    sent.


    There is however, another alternative. You can use the sendAnd command. It is
    a combination of both the send and the load commands. The variables from one LoadVars
    object load variables into another. Here is an example:


    ```

    mySendVars = new LoadVars();

    myLoadVars = new LoadVars();

    mySendVars.name = "George";nmySendVars.ID = 47;

    mySendVars.sendAndLoad("serverprogram.cgi", myLoadVars);

    ```


    When using the sendAnd command, no HTML page is replaced at all. The results of
    the server program need to be in the special format that load and LoadVariables
    use so that they can be read in and to populate the LoadVars object.


    # # Load Status


    Keep in mind that the load, send, and sendAndLoad commands do not happen immediately.
    The process starts when you issue the command, but then it continues independently
    of the rest of your code. The next ActionScript line after a load executes immediately,
    but the load command itself is just starting. The server is'
  merge: -1
  pgno: 271
- img_proc: true
  md: "contacted, and the information is sent. This takes some time. How long depends\
    \ on the responsiveness of the server and the speed of the network. It could be\
    \ a fraction of a second or several seconds.\n\nThis means that you will not want\
    \ to use the results of the load or sendAndLoad command right away. Instead, you'll\
    \ need to detect when the process is complete. There are several ways to do this.\
    \ The simplest way is to examine the loaded property of the LoadVars object. This\
    \ will be true only when the process is complete.\n\nYou can have a looping movie\
    \ clip that checks the loaded property, or perhaps just use to deter the user\
    \ from clicking a Next button until it is true.\n\nIf you want to check the status\
    \ of the process, you can use the getBytesLoaded and getTotalproperties of the\
    \ LoadVars object to see how far the process has gone. However, this would only\
    \ make sense if there is a large amount of data or a very slow network.\n\nYou\
    \ can also define a function to be called when the process is complete. You can\
    \ do this in a similar way to creating a listener for other objects. Here is an\
    \ example:\n\n```\nmyLoadVars.onload = function(success) {\nif (success) {\n \
    \ gotoAndStop('load done');\n} else {\n  gotoAndStop('load problem');\n}\n```\n\
    \nAs you see by this example, the success parameter gets either a true or false\
    \ depending on whether the operation was a success.\n\nBut what exactly happens\
    \ on the server side of things? The preceding examples include serverprogram.cgi\
    \ as the name of the place where the LoadVars object gets sent, but what, exactly,\
    \ happens on the server?\n\n# Server-Side Applications\n\nIt is not the purpose\
    \ of this section, hour, or book to teach server-side programming. In fact, dozens,\
    \ and perhaps hundreds, of books teach only that one subject. But I will try to\
    \ give you the basics to further demonstrate the LoadVars object.\n\nServer-side\
    \ programs, also called CGI (Common Gateway Interface) programs, can be written\
    \ in a variety of languages. The simplest is Perl, which is what we will use here.\
    \ You can also write them using C, C++, PHP, JSP, ASP, and just about anything\
    \ else that your server supports."
