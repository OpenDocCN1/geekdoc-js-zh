  md: '# External Variables


    Flash allows you to bring external text into a movie by using ActionScript. You
    can put the external text in the HTML page or in a completely separate file.


    # Variables from the HTML Page


    You can define the initial value of a value in the HTML page where the Flash movie
    is embedded. Why would you want to do this? Well, consider a Flash banner that
    appears on top of a Web page. Instead of making 30 banners for 30 Web pages, you
    could make one and have the different text in the HTML of each page so that the
    banner displays a different title on each page. One Flash movie works for all
    30 pages.


    To get some text, or any value, from the HTML page, you need to add it to the
    movie source tags in the HTML. So, first, publish your movie. Then, open the HTML
    page created. You''ll see the combination OBJECT/EMBED tag.


    The OBJECT tag defines the Flash movie for the Internet Explorer on Windows machines.
    The EMBED tag defines it for others, so you''ll have to make the change in two
    places. For instance, if you want to set the variable textField, you need to do
    this in the OBJECT tag:


    ```

    <PARAM NAME="10banner.swf?textField=Text from HTML!">

    ```


    Then, in the EMBED tag, you need to make a change:


    ```

    src="10banner.swf?textField=Text from HTML!"

    ```


    Check out the file 10banner.html in a text editor as SimpleText or WordPad to
    see exactly where the changes goes.


    The result is when the movie loads, the variable is created and set to this value.
    Check the movie 10banner.fla to see a movie that is set to use this type of thing.
    Drag and drop the 10banner.html file onto your favorite browser to see what happens.


    You can set more than one variable by placing a character after each variable
    declaration and starting a new declaration. Here is an example:


    ```

    <PARAM NAME="10banner.swf?textField=Text from HTML!&myNum=7">

    ```


    # Variables from External Files


    You can also get variables from an external text file. Why would you want to do
    this? Well, suppose you make a movie that displays dynamic information, such as
    a weather report. You can make the movie once and then change a text file on the
    server to update the text. Someone who doesn''t even use Flash can update the
    contents of the movie.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Hour 10


    To do this, you''ll need a single command inside the Flash movie. The file 10external.fla
    has an example. It loads the variables from the file 10external.txt.


    ```

    loadVariables("1@external.txt",_root);

    ```


    If you run the movie, the text in the dynamic field textField is replaced with
    text from the text file. Here are the contents of the text:


    ```

    textField=Weather today:

    Sunny, with a high of 72.

    Chance of showers tonight.

    ```


    An external file works the same as the extra information in the HTML tag. You
    can define as many variables as you want, separated by &. Line breaks don''t matter,
    which is why all three lines of text assigned to the textField variable.


    # Task: News Ticker


    A simple example that we can build using string functions and a dynamic text member
    is a scrolling ticker. This looks like the old-fashioned news tickers that appeared
    on the sides of buildings announcing news and stock prices.


    The idea is to have one line of text, which gradually scrolls to the left, revealing
    characters to the right while characters disappear from the left.


    Figure 10.3 shows the ticker, but it is difficult to get the idea with a static
    image. Instead, the example movie, 10ticker.fla and test it to see the movie in
    action.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_162_0.png)


    Figure 10.3

    The scrolling news ticker is much more exciting than as a static image.


    +   1. Start with a blank movie.

    2. Create a dynamic text field that is only one line high but stretches the entire
    width of the work area. You can place anything in the text field, such as "Text
    goes here.\n3. Link this text field to the variable text.

    4. Adjust the font to use a monospaced font, such as Courier New.

    5. Select the text area and choose Insert, Convert To Symbol. Choose Movie Clip
    as the type of symbol and name it anything you want. The text field is now the
    only component of a movie clip.'
