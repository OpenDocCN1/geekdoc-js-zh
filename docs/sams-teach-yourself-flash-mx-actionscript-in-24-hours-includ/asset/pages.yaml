  md: '# Scrolling 203


    9. The pressBar function is similar to the pressArrow function except that the
    amount variable is not set to -1 or 1, but instead to the number of lines visible
    in the text field—a page of lines. It is set to negative if the scrolling is to
    be up rather than down. It is determined by whether the click takes place above
    or below the slider.


    A variable called limit is set to the exact line indicated by where the user clicked
    the bar. This is done with a function named getSlider, which we will look at later.


    ```

    // start-by-page scrolling

    function pressBar() {

    mode = "page";


    // remember location of click and compute limit of paging

    clickLoc = _mouse;

    limit = getSlider(_mouse);


    // compute number of lines in page

    amount = (_parent.scrollText.bottomScroll - _parent.scrollText.scroll);


    // scroll the other way?

    if (clickLoc < slider.y) amount *= -1;


    // do it at least once

    sbFrame();

    }

    // stop paging

    function releaseBar() {

    mode = "none";

    }

    ```


    10. The pressSlider and releaseSlider functions are the simplest because all the
    work is done in the sbFrame function. The only mode needs to be set so that the
    sbFrame function knows what to do.


    ```

    // signal to follow slider

    function pressSlider() {

    mode = "slide";

    }

    ```


    ```

    // stop following slider

    function releaseSlider() {

    mode = "none";

    }

    ```


    11. Finally, here is the much-talked-about sbFrame function. What it does depends
    on the value of mode: either "scroll", "slide", or "page".'
