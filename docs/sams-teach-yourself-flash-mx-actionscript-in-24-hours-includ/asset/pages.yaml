  md: 'Take a look at the example movie 06clipcommunication.fla to see what this looks
    like before trying to build it yourself.


    +   1. Create a Flash movie. Make a movie clip that has 15 frames of animation.
    Name it "cog".


    +   2. Inside the movie clip, place a stop() script on the first frame. This prevents
    it from animating all. Instead, we will control its animation from ActionScript.


    +   3. On the 15th frame of the movie clip, place the following script:

    _parent[clipToTell].nextFrame();

    gotoAndStop();


    This code does two things. First, it telling a movie clip with the name stored
    in the variable clipToTell that it should advance to the next frame. Second, it
    sends itself back to the first frame to start again.


    Now we have to define the variable clipToTell. We''ll return to this movie clip
    script, so exit the editing of the "cog" movie clip and return to the main timeline.
    Place an instance of the "cog" movie clip in the work area and name it "cog".


    Now attach a movie clip script to it. Here is the script:

    onClipEvent(load) {

    clipToTell = "cog2";

    }


    ```

    onClipEvent(enterFrame) {

    nextFrame();

    }

    ```


    The first thing that happens when the movie clip starts is that the variable clipToTell
    is set to "cog2". This means that when the movie clip gets to frame 15, it uses
    the previous script in step 3 to tell "cog2" to advance to one frame.


    The onClipEvent(enterFrame) handler is used to advance this movie clip by one
    frame for each main movie frame.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_104_0.png)


    > It can be confusing to see that the movie clip script and the frame scripts
    inside the movie clip are at the same level. After all, you can only get at and
    edit the movie clip script while viewing the main timeline, and you can only get
    at and edit the movie clip''s frame scripts by viewing the movie clip''s timeline.
    Despite this, these scripts are all at the movie clip level. This is why the global
    variable clipToTell is available to both.'
