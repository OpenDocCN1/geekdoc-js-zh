    # HOUR 23


    # # Managing Movie Streaming


    Flash movies come in all sizes. There are little ones that load in a few seconds,
    medium-sized ones that keep the user waiting for a few seconds, and huge ones
    that seem to take forever to load. If you are building one of these large movies,
    you can use ActionScript to help keep the user informed, or perhaps entertained,
    while he waits.


    In this hour, you will:


    +   * Find out how to monitor the movie as it loads

    * Build a simple loading screen

    * Build a complex loading screen

    * Learn how to load a new movie in Flash

    * Load in new movie clips, images, and sounds as external media'
  merge: -1
  pgno: 331
- img_proc: true
  md: "# Monitoring Loading\n\nAll Flash movies stream. This means that the first\
    \ frame of a Flash movie starting as soon as it is ready, no matter how far off\
    \ the last frame is from loading.\n\nYou may not want this to happen. If your\
    \ entire movie is a quick animation, you may not want to start until the entire\
    \ movie has been downloaded from the Web and is waiting in the user's browser\
    \ cache to be played.\n\nThere are several ways to move the movie to wait for\
    \ loading to complete. The most common way is to have a loader_frame. This is\
    \ the first frame of the movie. It watches certain properties of the movie to\
    \ determine when the movie is finished loading.\n\nTo find out how many frames\
    \ of a movie have been loaded, you can use the _framesLoaded property of the movie.\
    \ You can compare this to the _totalFrames property to see how far off the loading\
    \ is.\n\nYou can use this in some simple cases. For instance, you can place a\
    \ stop() on the first frame of your movie. There can be a button that allows the\
    \ user to continue. When the user clicks the button, you can use a script like\
    \ this to determine what to do:\n\n```\n(onrelease) {\nif (_root_.framesLoaded\
    \ == _root_.framesTotal) {\n  play();\n} else {\n  textDisplay = \"Wait a few\
    \ seconds and press again.\"\n}\n}\n```\n\nIf the entire movie is not ready, the\
    \ text field linked to the variable textDisplay informs you of the delay.\n\n\
    You could also use this technique on parts of a long movie. For instance, this\
    \ button can be on frame 50 and let the user continue if the next 50 frames are\
    \ ready. A script attached to a movie clip can monitor the status and move the\
    \ movie forward automatically when the time is right.\n\n```\nonClip(load) {\n\
    \  _root_.textDisplay = \"Waiting for the next sequence to load.\";\n  _root_.stop();\n\
    }\n```\n\n```\nonClip(enterFrame) {\nif (_root_.framesLoaded >= 100) {\n  _root_.play();\n\
    }\n}\n```"
  merge: -1
  pgno: 332
- img_proc: true
  md: "This is the heart of a basic loader script. However, there are more accurate\
    \ ways to monitor loading by frames. You can use the getBytesLoaded and getBytesTotal\
    \ functions to find out the actual size of the file and how much has been loaded.\
    \ \n\nHere is a script that sits on a movie clip for the first frame of a movie.\
    \ The first frame should also have a stop(0) command on it.\n\n```\nonClipEvent(enterFrame)\
    \ {\n  if (_root.getBytesLoaded() == _root.getBytesTotal()) {\n    _root.play();\n\
    \  }\n}\n```\n\nBecause this script runs once per frame, it is constantly checking\
    \ the two functions against each other. The statement becomes true moment the\
    \ movie is completely loaded. The play command moves the movie forward.\n\n# #\
    \ Task: Simple Loader\n\nHere is how to build a simple loader frame that waits\
    \ for the entire movie to load before continuing past frame 1:\n\n+   1. Start\
    \ with a blank movie.\n2. Place a blank key frame at frame 1.\n\nStart a new key\
