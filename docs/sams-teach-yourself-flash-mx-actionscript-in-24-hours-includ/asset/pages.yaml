  md: '# HOUR 20


    # Printing


    Although not as complex as browser or server communication, printing is another
    way that Flash communicates with the outside world. Flash’s printing capabilities
    are useful because they allow you to build documents that the user can print from
    inside your interface. This is often a better design option than relying on the
    browser’s print function.


    In this hour, you will:


    +   - Learn how to set up your movie for printing

    - Find out how to use the print commands

    - Create a printable form


    # Setting Up Your Movie for Printing


    You need to do a few things to your movie before you can use any ActionScript
    print commands. Unfortunately, the print commands are not versatile. If used without
    any preparation, they will print the entire contents of the movie, frame by frame.'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'This is usually not you want. You may want only the current frame printed,
    perhaps a frame inside a specific movie clip, or maybe a small series of frames.
    But rarely will you want every single frame printed.


    # # Labeling Frames for Printing


    You specify that a frame should be printed by labeling it with a #p. If you don''t
    place a #p label on any frame, the command will print all frames in your movie.
    On the other hand, if you place more than one #p frame in your movie, just those
    frames will be printed.


    20.1 shows a timeline with three frames for printing. Notice that those same frames
    are also labeled in another layer. You can place more than one label on a frame
    this way comes in handy because you probably don''t want to use #p as a real label,
    and you may want to have more than one frame with a #p label.


    **20.1 Frames 2 and 4 are labeled for printing.**


    | | | | 10 | 15 | 20 |

    |---|---|---|---|---|---|--|

    | Frame 1 | | | | | | |

    | Frame 2 | | | | | | |

    | Frame 3 | | | | | | |

    | Background | | | | | | |


    ![](img/9e6d716993ade8c40e3512ad7da0a693_296_0.png)


    > When you label more than one frame with a #p, you will get a warning when you
    test the movie: "WARNING: Duplicate label..." It is unfortunate that that happens,
    but it will not affect your movie unless you try to use the #p labels in gotoAndstop
    commands and stop.


    # # A Printing Strategy


    You really need to think about build printing into your movie. Because you can''t
    print the current frame, you will need to build special frames.


    Note that everything visible on the frame gets printed. This includes a Print
    button, if you have one, any navigation buttons. So probably want to have a Print
    button on one frame, and have a frame that is identical to one but without the
    Print button or other unwanted elements. This frame has the #p label on it.


    You can organize this the timeline layers. For instance, you could have Print
    and navigation buttons on separate layers from the page''s content. These layers,
    which you do not want, will not extend to the print frame.


    Figures 20.2 and 20.3 illustrate this kind of system. Figure 20.2 is the frame
    that the user sees on the Web page. It features the content, a navigation button,
    and a Print button.'
