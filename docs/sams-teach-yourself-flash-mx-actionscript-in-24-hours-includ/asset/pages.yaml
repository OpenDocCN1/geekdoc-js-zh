  md: "# Using Components\n\nThe example view 2iradiobuttons.fla has three RadioButtons.\
    \ If you select one of the and bring up the Properties panel for that button,\
    \ you will see that it has more parameters than the CheckBox or PushButton components.\n\
    \nIn addition to the parameters in the CheckBox component, there are Group Name\
    \ and Data parameters. The Group Name parameter specifies which RadioButton belongs\
    \ to. In the example, all three RadioButtons have this set to FirstGroup. If there\
    \ was a second group of buttons with a different name, these two groups would\
    \ be treated separately when it comes to deciding RadioButton is on.\n\nThe Data\
    \ parameter is an optional that you can use in your scripts. You can access it\
    \ with the getData() function. You can store instructions that your script pick\
    \ when the choice is made. Or, you could avoid the Data parameter and refer to\
    \ the name of the RadioButton.\n\nIn the example, the three RadioButtons are named\
    \ choice1, choice2, and choice3. The labels for these buttons are Choice One,\
    \ Choice Two, and Choice Three.\n\nDetermining which choice the user has made\
    \ when the PushButton in the movie is clicked. The PushButton runs through this\
    \ script to determine which choice has been made. The script loops through the\
    \ three looking for a button that returns a true from the getState() function.\
    \ This is the RadioButton that turned on.\n\n```\nfunction buttonPressed(buttonInstance)\
    \ {\n  if (buttonInstance == doneButton) {\n    var choice = \"none\";\n    for(i=1;i<3;i++)\
    \ {\n      if(this[\"choice\"+i].getState()) {\n        choice = this[\"choice\"\
    +i]._name;\n      }\n    }\n    trace(\"Choice: \"+choice);\n  }\n}\n```\n\n#\
    \ ListBox\n\nA ListBox is a simple way to allow the user to select one or more\
    \ options. A ListBox take the place of either a set of CheckBoxes or a set of\
    \ RadioButtons. It is particularly useful when you have many choices limited space.\n\
    \n21.6 shows a ListBox with three choices. It looks like a scrolling text field\
    \ in fact it is, Each line represents a different choice for the user. If there\
    \ were more choices than could fit in the space, the user could scroll up and\
    \ down the list to see them all.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_311_0.png)"
