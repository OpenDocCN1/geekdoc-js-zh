  md: '# Workshop


    Can two Flash movies on one HTML page communicate with each other?


    If the browser supports JavaScript communication, you can write code to use JavaScript
    to pass messages between movies.


    Is there any way to all to allow browsers that don''t have JavaScript communication
    capability to open windows with custom options?


    Yes. You could use Flash to open a window with getURL and then have some JavaScript
    code on that page to have it resize itself and change its options.


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. If you use the JavaScript command GotoFrame(2), which frame of the Flash
    movie will be shown?

    2. If you use getURL with the target _top in a movie that is in a frame, what
    will happen?

    3. Will a user with Internet Explorer be able to use a Flash movie that communicates
    with JavaScript?

    4. What three changes do you need to make to the OBJECT and EMBED tags to enable
    JavaScript communication?


    # Quiz Answers


    +   1. Frame 3. Remember that GotoFrame uses zero-based numbering.

    2. The entire contents of the window will be replaced, not just the current frame.

    3. Only if the user is using a recent version of Internet Explorer in Windows.
    Mac versions do not support JavaScript communication.

    4. You need to set an ID in the OBJECT tag and a NAME in the EMBED tag. You also
    need to set swLiveConnect=true in the EMBED tag.'
