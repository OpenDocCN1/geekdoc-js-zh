    \nYou can place more than one extra frame in the cursor movie clip. For instance,\
    \ you can have choice button, over menu button, and over quit button key frames,\
    \ each with a slightly different graphic. A common method extra would be to have\
    \ an inactive button graphic that the cursor changes to when it rolls over a button\
    \ that can't be used on the current frame.\n\n# Information Rollovers\n\nA common\
    \ technique in applications that to display large amounts of information is to\
    \ use rollovers to bring up information instead of requiring the user to click\
    \ on buttons.\n\nThe general idea is to allow the cursor to quickly roll over\
    \ various hotspots. Each hotspot triggers a different piece of information that\
    \ appears in another part of the screen.\n\nFigure 13.4 shows an example. The\
    \ nine hotspots, each with the name of a planet, appear on the left. The user\
