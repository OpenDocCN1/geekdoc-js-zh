  md: '# Drawing Straight Lines


    Drawing a line with ActionScript is easy. First, you need to define the line style.
    The lineStyle command takes three parameters: the line thickness, color, and alpha.
    The color is expressed as an ActionScript hexadecimal value. 0x000000 is black,
    0xFFFFFF is white, and so on. The alpha parameter determines a line''s transparency.
    A value of 100 makes an opaque line, whereas a value of 50 makes a line that is
    faded 50 percent, and graphics can be seen.


    ```

    lineStyle(3,0x000000,100);

    ```


    ![](img/9e6d716993ade8c40e3512ad7da0a693_342_0.png)


    > If you use the line size of 0, you get a hairline. A hairline is a thin line
    that remains 1 pixel wide even if the line is scaled up. In contrast to a 1-pixel
    line that gets thicker as the scale of the movie increases.


    After you have set the line style, you use lineTo and moveTo to draw. Imagine
    an invisible pen on the screen. You can direct its tip to move around on the screen.
    As it moves, you can tell it to draw on the screen, or without drawing.


    The moveTo command moves the tip of the drawing pen to a location on the screen.
    The lineTo command moves the pen from its current location to another location
    and leaves a trail. Here is some code that draws a line from 275,200 to 300,225:


    ```

    moveTo(275,200)

    lineTo(300,225);

    ```


    ![](img/9e6d716993ade8c40e3512ad7da0a693_342_1.png)


    > If do not use a moveTo command before you use a lineTo command, the first line
    will be drawn from 0,0 to the point specified in the lineTo command.


