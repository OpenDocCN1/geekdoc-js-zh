  md: "# Selecting and Dragging Movie Clips\n\nThis function checks each of the numeric\
    \ keys and determines whether the correct code has been entered. In this case,\
    \ the code is 1, 2, and 7. It starts by setting the local variable correct to\
    \ true, assuming from the start that the code has been entered.\n\nIt checks the\
    \ _currentFrame of each numeric key. If the frame is 2, the user has turned on\
    \ the key. If it is 1, the key is off. If key 2, or 7 is off, the code must be\
    \ wrong. If key 0, 3, 4, 5, 6, 8 or 9 is on, the code is wrong. None of these\
    \ conditions are met, the code is correct because keys 1, 2, and 7 are off, and\
    \ the rest are off.\n\nTest the movie. Select 1, 2, and 7; then press the pound\
    \ key. Now try it with 1, 2, and 4, and 7. How about 5, 8, and 9?\n\nIn this example,\
    \ the only thing that happens is that a message is placed in the Output window.\
    \ However, you could place a stop(); command in the frame script—the same frame\
    \ script with the two functions. Then have the movie gotoAndStop a frame if the\
    \ code is wrong, or gotoAndStop another frame if the code is right.\n\n# Dragging\n\
    \nNow you know how to select a movie clip, the next step is to learn how to move\
    \ it. This is called dragging. You can drag files around your operating system's\
    \ desktop, for instance.\n\nThere are two ways to drag a movie clip. You can use\
    \ Flash's built-in drag commands. These are easy to use but do not allow you options\
    \ to modify or monitor the way movie clips are dragged, so we will also look at\
    \ using some other code to bypass Flash's drag commands.\n\n# Basic Dragging\n\
    \nFlash's drag commands are simple: There is a startDrag and a stopDrag command.\
    \ You issue the startDrag command whenever you want a movie clip to follow the\
    \ mouse around, and a stopDrag when you want the movie clip to stop following\
    \ the mouse around.\n\nIn the example 0basicdrag.fla, you can use the following\
    \ simple script in action:\n\n```\nonClip(mouseDown) {\n  if (this.hitTest(_root.mouse,\
    \ _root.mouse)) {\n    this.startDrag();\n  }\n}\n```\n\n```\nonClip(mouseup)\
    \ {\n  if (this.hitTest(_root.mouse, _root.mouse)) {\n    this.stopDrag();\n \
    \ }\n}\n```"
