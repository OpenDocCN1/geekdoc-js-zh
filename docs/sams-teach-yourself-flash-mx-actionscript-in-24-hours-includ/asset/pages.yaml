  md: '# The LoadVars Object


    You are lucky to be learning Flash-server communication with Flash MX. In earlier
    versions of Flash, you had to create awkward movie clips to send information to
    the server. But with Flash MX, you can use the LoadVars object.


    The LoadVars object is a series of commands and a special type of variable object
    that allows you to send information to the server just like a post form in HTML.
    You can create a LoadVars object in the same way that you create a variable object,
    like the ones in Hour 12, "Objects and Arrays."


    # Loading Data


    Here is an example. Instead of using new Object(), you simply use new LoadVars().
    This creates an example LoadVars object.


    ```

    myVars = new LoadVars();

    ```


    You can do one of two things with a LoadVars object. You can use it to get data
    from the server or send data to the server. Getting data from the server is done
    with the load command. All you need to do is specify the URL where the data needs
    to be loaded:


    ```

    myVars.load("myURL.txt");

    ```


    This works similarly to the LoadVariables command in Hour 10, "Creating and Controlling
    Text.\ However, the LoadVariables command created or replaced variable values
    at the same level as the command. The LoadVars object populates itself with those
    properties of the object.


    For instance, suppose that you have a data file that looks like this:


    ```

    name=George&ID=47

    ```


    When you load to get these variables into the myVars object, you end up with myVars.name
    and myVars.ID with the values "George" and "47".


    ![](img/9e6d716993ade8c40e3512ad7da0a693_270_0.png)


    > Like the LoadVariables command, the load command in only works if the data file
    is at the same subdomain as the Flash movie. The only exception is in projectors
    or the Flash test window. Otherwise, you can''t get data from a different server.'
