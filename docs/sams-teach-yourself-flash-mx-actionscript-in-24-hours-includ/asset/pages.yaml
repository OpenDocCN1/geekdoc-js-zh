  md: '# HOUR 13


    # # Rollovers


    Some common interface elements are used throughout computer applications. In the
    next few chapters, we will look at things such as scrolling text fields and pop-up
    menus. In this chapter, we will look at simpler interface elements: the cursor
    and the rollover.


    In this hour, you will:


    +   - Learn how to create a custom cursor

    - Learn how to create rollovers

    - Build a quick reference application with rollovers


    # ## Creating Custom Cursors


    In Hour 7, “Moving and Changing Movie Clips,” you learned how to set a movie clip''s
    location to location of the mouse with the _xmouse and _ymouse properties. While
    the movie clip remains at the location of the cursor, it is not useful as a cursor
    because the real cursor stays visible. We can change this, however, by getting
    rid of the cursor altogether with the Mouse.hide() function.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'By first using Mouse.hide() and then making a movie clip follow the cursor
    location, you can effectively create a custom cursor.


    This cursor can be anything you want: your own stylized arrow, a hand, or something
    that fits the mouse you are working on.


    Figure 13.1 shows an example of a movie clip that will be used as a cursor. It
    is just a simple arrow. Notice that the graphic is positioned so that the crosshairs
    signify the center of the movie clip are at the tip of the arrow. When we set
    the location of the movie clip, this spot will be placed at the position we specify.
    This is often called the hotspot of the cursor.


    # IGURE 13.1


    An example of a cursor movie clip.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_202_0.png)


    If you want to switch from using a custom cursor back to the regular cursor, all
    you need to do is to use the Mouse.show() command to make the regular cursor visible
    again.


    > How about an animated cursor? This is just easy to create; simply need to place
    the animation across multiple frames of the movie clip. No additional ActionScript
    is needed. Using an animated movie clip is just as easy as using a static one.


    Last step in creating a custom cursor is to make sure that appears on top of all
    the other movie clips. To switch the level of a movie clip, you can choose Modify,
    Arrange, Bring to Front. However, this only moves the movie clip above all other
    static clips on that layer. It does not move above movie clips on other layers.
    Even if you'
