  md: '# Drawing with ActionScript


    If you don''t want to draw on the stage, you can draw on any movie clip''s background.
    You can also create empty movie clips with the createEmptyMovieClip command. These
    movie clips can be used to move around or alter your ActionScript drawings.


    You can create dynamic and input text fields with the createText command. To change
    the appearance of the text in the field, create a text format object and assign
    it to the field with setTextFormat.


    # Q&A


    +   Q Is there any way to draw on top of existing objects?

    Q Yes. Just draw everything in a movie clip. You can use swapDepths to ensure
    that the movie clip is in front of all other objects.

    Q Can I create other Flash shapes such as boxes with rounded edges and circles?

    Q Yes, but you will have to do it using the lineTo and curveTo commands. No other
    methods of drawing are supported.

    Q How do I get rid of movie clips that I have created?

    Q The removeClip command works with movie clips created with the createEmptyClip
    command.

    Q Do I need to know the width and height of the text field before I place any
    text in it?

    Q You need to provide width and height in the createText command, but if you use
    the autoSize property of the field to true, the field should size itself to your
    text.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_357_0.png)


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What one step must be taken before using the lineTo command?

    2. If a large movie clip covers the stage and you try to draw on the stage with
    ActionScript, what happens?

    3. If you turn on embeddedFonts for a text field, what critical step do you need
    to do for the text to display correctly?'
  merge: -1
  pgno: 357
- img_proc: true
  md: '4. Which should come first: setting the text property of a field, or using
    setTextFormat?


    # Quiz Answers


    +   1. You must issue a lineStyle command to set the style of the line.

    2. Nothing. The drawing can''t be seen because it will be behind the movie clip.

    3. The font must be in the Library and set to Export for ActionScript in its Linkage
    properties.

    4. You must set the text property of a field first and then use setTextFormat.
    Otherwise, the text format will not change.'
