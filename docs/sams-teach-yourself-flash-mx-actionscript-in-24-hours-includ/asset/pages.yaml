  md: '# Sending Information to the Server


    Q can I quickly determine whether my Web server supports Perl?

    The only way is to test it. Servers vary greatly in the software that runs them
    and the way they are configured. There is no surefire way to determine whether
    the server will run CGI programs unless you are an expert.


    Q CGI programs see a difference between HTML post forms and Flash movies that
    use the LoadVars object?


    No. They look the same as CGI programs. This means that creating quick and simple
    HTML forms is a great way to test your CGI programs before trying to use them
    from a Flash movie.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What is the difference between loadVariables and load?

    2. How many ways are there to send data to the server with a LoadVars object?

    3. Is there any way to send or load data from another server?

    4. Name three ways to determine when a sendAndLoad command is finished.


    # Quiz Answers


    +   1. The loadVariables command creates or replaces variables at the same level
    as the command. The load command creates properties in the LoadVars object.

    2. There are two primary functions: send and sendAndLoad.

    3. No. At least while the movie is being run from a Web site. Data and CGI programs
    must be on the same server for security reasons.

    4. You could define an onLoad function, you could test the loaded property of
    the LoadVars object, or you could test the getBytesLoaded and compare it to the
    getBytesTotal properties of the object.


