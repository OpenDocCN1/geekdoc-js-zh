- img_proc: true
  md: '# Numerical Operators and Functions


    In Hour 2, “Using the Script Editing Window,” and Hour 3, “Learning to Program,”
    you learned how variables can hold numbers. They can hold integers, such as 7,
    and floating point numbers, such as 1.3574.


    # Basic Operators


    You also learned about basic numerical operators. Let’s review them. The + and
    - symbols allow you to add and subtract numbers. The * symbol is for multiplication.
    The / symbol is for division.


    You can also use +=, -=, *= /= to simplify your code. For instance, the following
    two lines perform the same operation. In both cases, 7 is added to “a":


    ```

    a = a + 7;

    a += 7;

    ```


    # Comparison Operators


    You can compare two numbers with the == symbol to see whether they are equal.
    You can also use the < > symbols as less than or greater than. The <= and >= symbols
    are for less than or equal to greater than or equal to.


    In ActionScript, you can freely compare integers and floating point numbers. For
    instance, a variable containing 7.2 would be greater than a variable containing
    7.


    # Math.abs


    The Math object is a collection of functions that work with numbers. For instance,
    the Math.abs returns the absolute value of a number. This is simply the number
    without the positive or negative sign. So -7 returns 7, and 7 returns 7. Here
    is an example:


    ```

    trace(Math.abs(-7));

    ```


    # Math.round


    If you are using floating numbers, but want to display them as integers instead
    of the part of the number after the decimal point.


    The most straightforward function for this is Math.round, which rounds a floating
    number up or down to the nearest integer. So 7.2 becomes 7, and 7.8 becomes 8.


    ```

    trace(Math.round(7.2));

    trace(Math.round(7.8));

    ```'
  merge: -1
