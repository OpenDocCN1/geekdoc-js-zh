  md: 'If num contained “42", would the resulting value of "b" be 43? No. It would
    be “421.”

    This is because “42” is a string with the characters "4" and "2" in it, not the
    number 42.


    To make Flash the “42” as a number, you use one of the two functions to convert
    strings

    to numbers. The parseInt function takes a string and converts it to an integer.

    parseFloat function takes a string and converts it into a floating number.


    So parseInt(“42”) returns the number 42. This function doesn''t round, however,
    so

    parseInt(“42.9”) also resolves to 42. It just cuts off at the first digit.


    If you use parseFloat(“42.9”), you get 42.9. To round correctly, you could use

    Math.round(parseFloat(“42.9”)). The parseFloat function also keeps the number
    as

    an integer if no floating point number is needed. So parseFloat(“42”) resolves
    to 42.

    Unless you are strictly using integers, you might want to use parseFloat as your
    main

    conversion function.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_174_0.png)


    > One cool feature of parseInt is that you can convert numbers to use other

    bases. For instance, if you wanted to convert hexadecimal numbers, base 16,

    to decimal numbers, just use 16 as the second parameter. So

    parseInt(“FF”,16) returns 255.


    If you want to convert a number to a string, you need to use the toString function.
    This

    works a little differently than the parse function because it is an operation
    performed

    a number variable using dot syntax. Here is an example:


    ```

    a = 325;

    trace(a.toString() + 1);

    ```


    The result is “3251” as you might expect.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_174_1.png)


    > You can use toString to convert a decimal number to a number of another

    base. This is the opposite of what the parseInt function can do, mentioned

    the previous tip. If you supply a parameter with the base, you will get the

    appropriate results, 5o, (255).toString(16) returns “ff”.


    The semi-obsolete but convenient functions Number and String can also be used
    for con-

    versions. These can be used to convert strings to numbers and vice versa. However,
    they

    are most mostly present in Flash 6 as a backward compatibility measure for updating
    older

    Flash movies.'
