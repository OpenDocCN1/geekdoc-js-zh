  md: "# Getting Input From the User\n\nYou can also combine events in an on statement.\
    \ For instance, suppose that you want to have a button that is a keyboard shortcut.\
    \ You would normally do just an on (release) handler. However, you can also do\
    \ a slightly more complex handler that would handle the click and a key press\
    \ at the same time:\n\n```\non (keyPressed(\"b\", release) {\n  trace(\"b\" pressed\
    \ or button clicked.\");\n}\n```\n\nYou can see all code examples in the 09keybutton.fla\
    \ example movie. Try the \"a\" key and the \"A\" key. Try the left arrow key.\
    \ Also try clicking the button and pressing \"b\".\n\n# The Key Object\n\nButtons\
    \ are useful for getting a single key press, they are no good for detecting whether\
    \ a key is being held down—for instance, if you want to make a game where the\
    \ player's character continues to move as long as the arrow keys are pressed.\n\
    \nFor this type of functionality, you need the Key Object. The Key object is a\
    \ set of functions and constants built into Flash. You can use these functions\
    \ and constants to determine whether a key is being pressed. For instance, to\
    \ see whether the arrow key is pressed, use this code:\n\n```\nif (Key.keyDown(Key.LEFT))\
    \ {\n  trace(\"The left arrow is down\");\n}\n```\n\nKey.keyDown returns a true\
    \ or false depending on whether the key listed as a parameter is pressed. The\
    \ Key.LEFT constant represents the left arrow key. So if this statement is true\
    \ when the left arrow key is pressed.\n\nThe list of constants like Key.LEFT reads\
    \ just the previous list of constants understood by buttons. It has a few more\
    \ keys, such as Control and Shift. It also has different spellings for other keys."
  merge: -1
  pgno: 145
- img_proc: true
  md: "# Hour 9\n\n| Key.BACKSPACE | Key.ENTER | Key.PGDN |\n| Key.CAPSLOCK | Key.ESCAPE\
    \ | Key.RIGHT |\n| Key.CONTROL | Key.HOME | Key.SHIFT |\n| Key.DELETEKEY | Key.INSERT\
    \ | Key.SPACE |\n| Key.DOWN | Key.LEFT | Key.TAB |\n| Key.END | Key.PGUP | Key.UP\
    \ |\n\nBut if you want to detect a normal key such as “a”? You still need to know\
    \ the code for the key; you can’t just use the character “a.” The Key.getCode\
    \ function does that. Here is an example:\n\n```\nif (Key.isDown(Key.getCode(\"\
    a\")) {\n  trace(\"The left arrow is down\");\n}\n```\n\nThe example movie 0keyobject.fla\
    \ is a movie clip with a script that demonstrates of the previous examples.\n\n\
    # Key Listeners\n\nThe problem with the Key object method of detecting key presses\
    \ is that it cannot detect the initial key. It tests, over and over again, for\
    \ the key to be down.\n\nConsider a slow computer. The onClick(enterFrame) handler\
    \ runs and checks for the “a” to be down. It isn’t. The user clicks on it quickly,\
    \ before the next time the onClick(enterFrame) runs. When the onClick(enterFrame)\
    \ does runs the key is never recognized by the handler. So a user can click quickly,\
    \ and your Flash movie will miss it.\n\nAnother problem would occur if you want\
    \ the user to click multiple times. For instance, pressing space could fire a\
    \ bullet in a game. The Key object might not be able to tell the difference between\
    \ one line click and series of quick ones.\n\nIn Flash MX, you have a third choice\
    \ when it comes to listening for key presses. You can create a listener to pay\
    \ attention to the key event to occur.\n\nA listener has two parts. The first\
    \ part is its creation. You have to tell the movie that you want it to listen\
    \ for an event. In this case, you tell it with the following command:\n\n```\n\
    Key.addActionListener(_root);\n```"
