  md: "# Task: Dynamic Snowflakes\n\nA simple example would be to create 50 snowflakes\
    \ with drawing commands. Each snowflake is kept inside its own movie clip. Each\
    \ snowflake is also a little different because we will use random numbers to determine\
    \ the number of spikes and their length.\n\n```\nfunction createSnowflake(n) {\n\
    \  // create a new movie clip\n  this.createEmptyMovieClip(\"snowflake\"+n,n);\n\
    \  mc = this(\"snowflake\"+n);\n\n  // set the line style to hairline, semi-transparent\n\
    \  mc.setStyle(0,0FFFFFF,50);\n\n  // pick random number of spikes and their radius\n\
    numSpikes = Math.round(Math.random()*5)+5; // 5 to 9\n  spikeRadius = Math.round(Math.random()*5)+5;\
    \ // 5 to 9\n\n  // create each spike as line from center to point using\n  for(var\
    \ i=0;i<numSpikes;i++) {\n    mc.moveTo(0,0);\n    spikeAngle = 2.0*Math.PI/numSpikes;\n\
    \    x = spikeRadius*Math.cos(spikeAngle);\n    y = spikeRadius*Math.sin(spikeAngle);\n\
    \    mc.lineTo(x,y);\n  }\n\n  // return reference to this movie clip\n  return(mc);\n\
    }\n```\n\n+   3. The last function creates snowflakes, but we want to create many.\
    \ The initSnowflakes function creates a number of snowflakes by calling the createSnowflakes\
    \ function a number of times. It also sets a random location for the snowflake\
    \ and random values for speed, drift, and rotate. These three variables will be\
    \ used later to make the snowflake move."
  merge: -1
  pgno: 350
- img_proc: true
  md: "# Drawing with ActionScript\n\n```\nfunction initSnowflakes(n) {\n  // remember\
    \ number of snowflakes\n  numSnowflakes = n;\n\n  // create snowflake\n  for(var\
    \ i=0;i<numSnowflakes;i++) {\n    // create snowflae\n    mc = createSnowflake(i);\n\
    \n    // set position\n    mc._x = Math.random()*550; // 0 to 550\n    mc._y =\
    \ Math.random()*400; // 0 to 400\n\n    // move clip variables\n    mc.speed =\
    \ Math.random()*3+3; // 3 to 6\n    mc.drift = Math.random()*2-1; // -1 to 1\n\
    \    mc.rotate = Math.random()*18-9; // -9 to 9\n  }\n}\n```\n\n+   4. The moveSnowflakes\
    \ function loops through each snowflake and moves according to its speed, drift,\
    \ and rotate. If the snowflake moves off the sides or bottom of the stage, it\
    \ will be reset to the other side or to the top. This keeps all the snowflakes\
    \ falling constantly.\n\n```\nfunction moveSnowflakes() {\n  // loop through snowflakes\n\
    \  for(var i=0;i<numSnowflakes;i++) {\n    // move ad rotate the snowflake\n \
    \   mc = this['snowflake'+i];\n    mc._y += mc.speed;\n    mc._x += mc.drift;\n\
    \    mc._rotation += mc.rotate;\n\n    // bring back to top\n    if (mc._y > 400)\
    \ mc._y = 0;\n\n    // one side to another\n    if (mc._x < 0) mc._x = 550;\n\
    \    if (mc._x > 550) mc._x = 0;\n  }\n}\n```\n\n+   5. The frame script ends\
    \ by calling initSnowflakes to make 50 snowflakes.\n\n// create 50 snowflakes\n\
    initSnowflakes(50);\nstop();\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_351_0.png)"
