  md: '# HOUR 5


    # Controlling the Flow of the Movie


    The simplest, but in some ways the most powerful, thing that ActionScript do is
    control the flow of the Flash movie. You can stop a movie on a certain frame,
    or jump around from frame to frame. This frees the Flash movie from its even-paced
    linear movement that it has by default.


    In this hour, you will:


    +   - Learn how to stop the movie on a frame

    - Find out how to jump from one frame to another

    - Create buttons to allow the user to control the Flash movie

    - Make a simple slideshow

    - Create a full presentation with Flash


    # Stopping the Movie


    Perhaps the simplest command in ActionScript is the stop command. When issued,
    it simply stops the movie in its tracks on the current frame.'
