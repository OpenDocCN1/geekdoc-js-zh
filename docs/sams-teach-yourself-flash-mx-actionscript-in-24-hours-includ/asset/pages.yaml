- img_proc: true
  md: 'Scripts in the timeline execute when the point in the timeline is encountered
    as Flash is playing back the movie. For instance, if you place a stop() command
    in the script attached to a key frame, the movie will stop moving forward at that
    point. It will continue only if another script tells it to.


    Another reason to place scripts in the timeline is when you want to use functions
    as part of your ActionScript code. Functions are bits of code that can be reused.
    For scripts throughout the movie to call these reusable functions, they must be
    placed in the main timeline.


    # Scripts Attached to Buttons


    Elements in Flash are called symbols. A symbol is usually a graphic element. There
    are three types formally called graphics, movie clips, buttons. Graphics cannot
    have scripts attached to them; they are usually static or animated images. Movie
    clips are like graphics, except that they can have scripts attached to them.


    The third type of buttons, can also have scripts attached. As a matter of fact,
    buttons are useless without scripts—they can''t do anything without scripts.


    To attach a script to a button, first select the button on the stage. Then choose
    Window, Actions from the menu. Or use the keyboard shortcut F2.


    Notice that the Actions panel has a different title. It looks just like the window
    in Figure 1.2, but by this time, it is titled Actions—Button.


    As you might guess, scripts attached to buttons usually contain instructions for
    Flash to perform if the user clicks the button. Scripts can also react when the
    mouse enters or leaves the button''s space. Buttons also react to key presses.
    This makes it easy to script a button that has a keyboard shortcut.


    # Scripts Attached to Movie Clips


    Movie clips differ from plain graphic symbols in that they can be named, and they
    have scripts attached to them. You can attach a script to a movie clip in the
    same way that you attach a script to a button.


    Scripts attached to movie clips can be used to control movie clip or to control
    other clips on your timeline. Scripts can detect when a movie clip first appears
    on the screen, and when a frame in the timeline has passed. This allows you to
    write scripts that execute repeatedly, once each frame. You can use such scripts
    to control animation.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Your First Look at ActionScript


    In addition to attaching a script to a movie clip, you can also place scripts
    inside movie clips. After all, a movie clip is just another Flash movie. Inside
    a movie clip, there is another timeline. You can place timeline scripts on this
    timeline just like you can with the movie''s main timeline. You can even place
    buttons inside a movie clip and attach scripts to it. A complex example would
    be a button with a script inside a movie clip, which is inside another movie clip,
    which is on the main timeline.


    # Task: Your First Script


    +   1. Create a new movie.

    2. Place three key frames in the movie by pressing F7 twtimes with the timeline
    selected.

    3. Use your Flash drawing skills to create different graphics on each frame. For
    example, you could place a 1 on the first frame, a 2 on the second frame, and
    a 3 on the third frame.

    4. Now if you run the movie by choosing Control, Test Movie, you will see the
    movie loop through the three frames.

    5. Return to the main timeline and select the key frame. Press F2 to bring up
    the Actions panel.

    6. The left side of the Actions panel shows expandable list of keywords. Find
    the stop keyword and double-click it. You will find under Actions, Movie Control.
    Now the script window should contain one that looks like this:

    stop ()

    7. Close the Actions window and choose Control, Test Movie to run the movie again.
    You can also press Command+Return on the Mac or Control_Enter in Windows. It should
    show you frame 1, frame 2, and then stop. You''ll never see frame 3.


    ActionScript has taken control. You''ve created your first script and thwarted
    Flash''s intentions of looping through all three frames.


    # Summary


    ActionScript is a relatively new programming language that borrows from other
    modern languages such as Java, C++, and JavaScript. ActionScript uses English
    words and symbols to provide a set of instructions for the Flash movie to follow.
    It exists so Flash movies can be more interactive than just plain linear animations.'
  merge: -1
