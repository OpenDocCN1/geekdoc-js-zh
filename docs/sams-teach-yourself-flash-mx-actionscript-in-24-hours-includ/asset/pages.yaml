  md: '# Getting Input From the User


    The Key.addListener command takes an object, such as the root movie or a movie
    clip, as its parameter. This is the object that gets a message when the event
    happens.


    In this case, the root level of the movie gets event. For the root level to respond
    to this event, it should have a function that has been assigned to handle it.


    The key listener can see different types of messages: onKeyUp and onKeyDown. To
    make a function that handles one of these, you write code that looks like this:


    ```

    _root.onKeyUp = function() {

    trace(Key.getAscii());

    }

    ```


    You could also use another object, such as a movie clip, in place of _root, as
    long as it was the same object used in the Key.addListener command.


    The Key.getAscii() function returns the ASCII code for the key pressed. ASCII
    code is a number that represents to character: "A" is 65, "B" is 66, and so on.


    Take a look at the 09keyclip.fla in action. Notice that there is absolutely no
    movie clips in it; it doesn''t need any any. The script is placed on the first
    and only frame of the main timeline.


    Furthermore, if you want to see real characters rather than ASCII codes, you can
    use the String.fromCharCode() function to convert them. Here is the new line:


    ```

    trace(String.fromCharCode(Key.getAscii()));

    ```


    # Movie Clip Events


    There is actually a fourth way to detect key presses. This is to use the onEvent
    handlers keyDown and onKeyUp. You need to use Key.getAscii() to determine which
    key was pressed.


    I won''t go into this method; it is obsolete now that Flash MX has introduced
    listeners. However, you should know about it in case you see it in older code
    examples.


