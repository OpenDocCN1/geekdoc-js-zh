- img_proc: true
  md: '# Learning to Program


    In the preceding seven steps, step 1 only happens once. Then step 2 signifies
    the beginning of the loop. Steps 3, 4, 5, and 6 are executed 10 times. After the
    10th time, step 7 is executed, and the program continues from there.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_57_0.png)


    > So if the loop reaches 10 times, why does it check whether the counter reaches
    99? This is because the counter starts at 0. This is typical of most computer
    programming languages. The counter counts from 0 to 9 instead of 1 to 10.


    Another important part of loops is when, exactly, the condition is examined. In
    some cases, it is examined when the commands in the loop are executed, and in
    other cases it is examined in the end.


    There are also ways to break out of loops prematurely, and ways to skip the rest
    of the commands in a loop and start at the beginning. We''ll look at the ways
    to do this in ActionScript in Hour 4, "Writing Code in Flash."


    # Achieving the Impossible


    Commands, functions, operations, variables, conditions, and loops are the fundamentals
    of computer programming. The tough part is putting the program together.


    Programming is problem solving. Your programs are just sets of instructions to
    solve a big problem. The first step in programming is to define what problem you
    want to solve.


    A good example in the real world is going to get to the market milk. The problem
    is “I need to get milk.” But that is a clear enough definition to allow you to
    solve the problem?


    What sort of milk do you want? two percent? How much do you want? a gallon? a
    pint? a liter? Where do you want to go to get the milk? the nearby supermarket?
    the convenience store? the local organic food store?


    A better defined problem might be “I need to go to the nearby supermarket to get
    a gallon of skim milk."


    Now that you have defined the problem, you need to determine what you want to
    do solve it. You probably want to get in the car, drive to the store, find the
    milk, take it to the check-out line, pay for it, take it back to the car, drive
    home, and get out of the car. Breaking it down to these steps makes it easier
    to see exactly what is needed.'
