    the existing data.


    # # Summary


    The LoadVars object allows you to send and receive information from a server.
    The send command works just like a <FORM> in HTML.


    For the server to receive information, there must be a CGI script on the server
    written in Perl or some other language. Writing a CGI program takes a separate
    set of skills and is not usually done by the Flash programmer.


    By combining a Flash movie with a LoadVars object and a CGI script on the server,
    you can record a user''s input. This can be used for surveys'' similar tasks.


    # # Q&A


    +   - When should I use LoadVariables and when should I use the LoadVars object?


    +   - Use LoadVariables in simple situations where you just need to get some quick
    external data into your movie. The LoadVars object should be used in more complex
    movies where you need to call out the server many times and send data as well
    as receive. LoadVars is more useful if you need to track the incoming data.


    +   - I''ve made a CGI program to send data to a movie, but that movie doesn''t
    always get the data. Why?


    +   - Make sure you are using the right MIME type when returning the data. This
    corresponds to the Content-type: at the top of the Perl scripts in this hour.
    If you are generating a text or HTML page, text/html is the right MIME type. However,
    if you are sending data directly to a Flash movie, use application/x-www-url-encoded.


    +   - In a program like the survey, how do I prevent the user from clicking Submit
    button more than once?


    +   - There are many ways. You could let the user click the button more than once,
    but just not send the data if it has already been done—set a variable to true
    the first time. Or, you could send the user immediately to another frame that
    says “please wait” when the user clicks the button.'
