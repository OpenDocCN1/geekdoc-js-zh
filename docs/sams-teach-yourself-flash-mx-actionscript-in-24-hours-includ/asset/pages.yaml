    # Typing Code in Expert Mode


    Ironically, the Actions is simpler to use in Expert mode than in Normal mode.
    This is because all you need to do is type; there are no forms to fill out at
    the bottom of the window. It is just a simple text editor.


    The downside is that it is also much easier to make mistakes. In Normal mode,
    Flash keeps you in line. But in Expert mode, you are free to mistype command names
    or put the wrong parameters in the wrong place.


    In Expert mode, you simply place the cursor in the typing area and type away.
