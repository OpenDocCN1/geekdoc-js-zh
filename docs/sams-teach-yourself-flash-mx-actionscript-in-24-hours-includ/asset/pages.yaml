    +   3. What does the command myMovieClip.swapDepths(99999)do?


    +   4. What ActionScript do you need to make animated cursors?


    # Quiz Answers


    +   1. To answer _xmouse and _ymouse is not enough. This would return the location
    relative to the movie clip if the code is inside a movie clip. However, `root.__xmouse`
    and `root.__ymouse` give you the location relative to the movie.


    +   2. There is none. You have to constantly check for it using variables and
