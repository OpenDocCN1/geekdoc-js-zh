  md: "# Moving and Changing Movie Clips\n\n3. Attach the following script to the\
    \ movie clip:\n\n```\nonClipEvent(enterFrame) {\n  this.rotation += 1;\n}\n```\n\
    \nWhen you run the movie, the movie clip rotates 1 degree per frame. This means\
    \ that it will take 360 frames to rotate completely. At 15 frames per second,\
    \ that's 24 seconds for a complete turn. That is, of course, if your computer\
    \ can handle the full rate of animation. If you keep the movie clip and any other\
    \ elements in the movie sample, this should not be a problem.\n\n+   4. To make\
    \ the movie clip spin twice as fast, change the 1 to 2. Try other values as well.\n\
    \n+   5. To make the movie clip rotate in the opposite direction, change the number\
    \ to a negative value, such as -1. Alternatively, use -= instead of +=. Check\
    \ out the movie07rotation.fla to see an example.\n\n# Stretching and Shrinking\
    \ Movie Clips\n\nYou can also change the horizontal and vertical scaling of a\
    \ movie clip. This means that you can stretch it and shrink it, its width, height,\
    \ or both.\n\n# Scale Properties\n\nThe properties for doing this are _scale for\
    \ the horizontal scale of the movie clip and _yscale for the vertical scale of\
    \ the movie clip.\n\nThe values you need to set these two properties is to a percentage.\
    \ That means that 100.0 is 100 percent of the original scale of the movie clip.\
    \ You can use smaller values, such as 50, to shrink the movie clip. Or, you can\
    \ use larger values, such as 200 to stretch the movie clip. You can use negative\
    \ values to flip the movie clip.\n\nThe example07mouse.fla contains the most complex\
    \ script that we have seen so far. It checks the _mouse and _mouse properties\
    \ to get the location of the mouse. It determines how far away the mouse is from\
    \ the center of the movie clip. It uses this distance, both the horizontal and\
    \ vertical components, to calculate a percentage of scale to apply to the movie\
    \ clip. The result is that the movie clip stretches and shrinks so that the bottom-right\
    \ corner matches the location of the mouse. Here is the code:\n\n```\nonClipEvent(load)\
    \ {\n  // get the original width and height of the mc\norigWidth = this._width;\n\
    origHeight = this._height;\n}\n```\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_117_0.png)"
