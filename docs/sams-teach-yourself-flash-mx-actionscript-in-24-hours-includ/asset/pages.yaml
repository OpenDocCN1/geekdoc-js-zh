  md: "# Task: JavaScript-Controlled Slideshow\n\nHere's a task that can be performed\
    \ easily with JavaScript, provided that the user has the right browser. In this\
    \ task, we'll build a movie that doesn't have much of any ActionScript in it at\
    \ all. The JavaScript on the HTML page, however, controls it completely.\n\n+\
    \   1. Create a new Flash movie with three or more different frames in it. It\
    \ doesn't matter what is each frame, as long as you can easily tell the difference\
    \ between frames.\n2. Place a stop() command on the first frame so that the movie\
    \ doesn't animate.\n3. Publish the movie with a standard HTML page. There is no\
    \ need to use the Flash template.\n4. Using a text editor, open the HTML page.\n\
    5. Add an ID parameter to the OBJECT tag and a NAME parameter to the EMBED tag.\
    \ Use \"slideshow\" as the value for both.\n6. Also add an swConnect=true to the\
    \ EMBED tag.\n\nAdd two buttons to the HTML page. Use this code:\n\n```\n<FORM\
    \ NAME=\"flashFormControl\">\n<INPUT NAME=\"next\" TYPE=Button VALUE=\"Next\"\
    \ onclick=\"nextFrame();\">\n<INPUT NAME=\"prev\" TYPE=Button VALUE=\"Previous\"\
    \ onclick=\"prevFrame();\">\n</FORM>\n```\n\nThese two buttons call one of two\
    \ functions. They use tCurrentFrame to get the number of the current frame and\
    \ Goto to go to the next or previous frame in the movie.\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction nextFrame() {\n  var frameNum = window.document.slideshow.tCurrentFrame(\"\
    /\");\n  window.document.slideshow.GotoFrame(frameNum+1);\n}\nfunction prevFrame()\
    \ {\n  var frameNum = window.document.slideshow.tCurrentFrame(\"/\");\n  window.document.slideshow.GotoFrame(frameNum-1);\n\
    }\n</SCRIPT>\n```\n\nTest your movie or use the files in the 17Slides folder.\
    \ The handy technique is that you can substitute any Flash movie and it instantly\
    \ makes a slideshow presentation out of it. You'll either need to put a stop()\
    \ at the start of the movie or add a play=false parameter in the tags so that\
    \ the movie does not advance past the first frame when it starts."
