  md: '# Hour 6


    The first thing that you need to do to control a movie clip is to name it. Naming
    movie clips in Flash is confusing because all movie clips have two names: the
    name of the original clip in the Library, and the name of the movie clip instance
    in the work area. The reason for the two names is that you can have more than
    one instance of the same movie clip on the screen at the same time.


    So, for instance, you could have a movie clip called "gear animation" in the Library,
    and a "gear1" movie clip instance on the screen. You could also have a "gear2"
    movie clip instance. They are both taken from the original "gear animation" movie
    clip in the Library.


    Figure 6.1 shows the property panel when a movie clip is selected. To bring up
    the property panel, select the movie clip in the work area and choose Window,
    Properties.


    # **Figure 6.1**

    The properties panel shows the name of the movie clip instance and allows you
    to change that name if you want.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_98_0.png)


    In Figure 6.1, you can see that I have named the movie clip instance "gears".
    It also shows the name of the original Library element as "gear animation".


    The name of the movie clip instance on the screen is the critical one to an ActionScript
    programmer. This name is what you will need to refer to the movie clip in your
    programs.


    For example, if you have a movie clip instance named "gears", you would refer
    to it with that name. Then, using dot syntax, you could give it a command, such
    as stop. Here is an example:


    ```

    gears.stop();

    ```


    You can send other commands to a movie clip. For instance, if you want to tell
    a movie clip to go to a certain frame, you can use gotoAndStop.


    ```

    gears.gotoAndStop(5);

    ```


    Note that this is how you send commands to a movie clip that is at the current
    level. If you want to place a command on a frame inside this movie clip, you shouldn''t
    use the name of the clip, just gotoAndStop. If you were to use a movie clip instance
    named "gears" inside the current movie clip instance "gears" inside the main timeline—two
    levels down rather than one.'
