- img_proc: true
  md: 'ActionScript can control the flow of a Flash movie, allow movie clips in the
    movie, allow for user input, communicate with an Internet server, perform calculations,
    and even play sounds.


    You can place ActionScript scripts in the timeline, on buttons, or on movie clips.
    You can see what scripts are in these locations by selecting the key frame, movie
    clip, or button and opening the Actions panel.


    # # Q&A


    +   - What elements of a Flash movie can a script control?

    - Scripts can control the flow of a movie, making it stop on a frame or jump to
    any frame in the movie. In addition, scripts can control movie clips. Although
    buttons can contain scripts, they cannot be controlled by scripts.

    - How do I know whether a script is attached to a key frame, movie clip, or button?

    - In the case of key frames, you will see a "A" in the timeline if the key frame
    contains a script. However, there is no way to determine whether movie clips or
    buttons contain scripts. You just select them and open up the Actions window to
    see. Alternatively, you can use the Movie Explorer to seek out scripts.

    - If I learned how to program in ActionScript with earlier, will that help me
    to learn ActionScript for Flash MX?

    - Real ActionScript was introduced with Flash 5. If you''ve scripted Flash in
    versions 4 or earlier, some of the concepts may be familiar to you. Unfortunately,
    the leap between Flash 4 and 5 was so great that you pretty much have to start
    learning Flash scripting all over again. However, if you learned Flash 5, then
    Flash MX ActionScript is only a little more advanced.


    # # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # # Quiz


    +   - Which version of Flash first contained modern ActionScript?

    - What elements of Flash can have scripts placed on them?

    - Do you have to know ActionScript to be able to tell what a script does?

    - How do you bring up the Actions window?'
