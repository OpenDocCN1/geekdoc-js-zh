  md: '# Learning to Program


    # Debugging


    So, how do you get rid of bugs? This is a process called *debugging*.


    Sometimes debugging is straightforward. You simply see what the program did wrong,
    think about what could have caused it, go into the program, and make a change.


    However, it is more often the case that you will need to investigate a little
    to determine what is wrong. Sometimes you need to make a change, test the program,
    and make some more changes. A single bug can sometimes take hours to track down.


    Flash includes some debugging tools that will help you fix your programs. You
    can track variable values and even set breakpoints in your code. We''ll look at
    some of these tools in Hour 4.


    # Summary


    Computers follow your program as a set of instructions, taking each command literally.
    You must spell out every step to the computer so that it understands what you
    want to do.


    Computer programs are made up of commands, functions, operations, conditional
    tests, and loops. Commands give the computer a specific instruction. Functions
    perform calculations and return a value. Operations take several values and combine
    them in some way. Conditions test one or more values to get a true or false result.
    Loops allow the program to repeat a set of instructions many times.


    Variables are containers for storing numbers or strings of characters. Variables
    have names and contents.


    Writing a program takes patience. You must first define the problem that the program
    is meant to solve. You must break down the program into smaller and smaller steps
    until you have so steps that they are easy for you to handle.


    After a program is finished, it may still contain called bugs. You have to find
    some time for debugging so that your program runs correctly when you are finished.


    # Q&A


    +   Q Do functions always need some sort of data going into them?


    +   A No. It is common to have functions that don''t need any parameters. For
    instance, a function could return the current date, or the position of a movie
    clip on the screen.'
