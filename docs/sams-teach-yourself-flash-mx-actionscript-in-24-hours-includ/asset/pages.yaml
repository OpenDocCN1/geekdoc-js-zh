  md: "# Moving and Changing Movie Clips 97\n\nTwo special properties of the Flash\
    \ player tell you the horizontal and vertical positions of the cursor on the screen.\
    \ These are the _xmouse and _ymouse properties.\n\nBut what are they properties\
    \ of? If used by themselves, _xmouse and _ymouse are properties of the object\
    \ they are contained in. So if you use them in the main timeline, they are root\
    \ properties. If you use them in a movie clip, they are movie clip properties.\n\
    \nWhat's the difference? Well, _xmouse and _ymouse measure the mouse location\
    \ from registration point of the object. So if you are the root properties, you\
    \ get the location of the mouse from the upper-left corner of the movie. If you\
    \ use them inside a movie clip, you get the mouse location from the center of\
    \ the movie clip.\n\nIn most cases, you will use these properties as they relate\
    \ to the main movie. To ensure this, you can use _root._xmouse and _root._ymouse.\n\
    \nHere is the code example inside the movie 0mouse.fla. It contains a movie clip\
    \ with script on it. In every frame, the script will write the x and y location\
    \ of the mouse to the Output window, followed by a blank line to separate the\
    \ pairs of numbers.\n\n```\nonClipEvent(enterFrame) {\n  trace(_root._xmouse);\n\
    \  trace(_root._ymouse);\n  trace(\"*\");\n}\n```\n\nWhen you run this movie,\
    \ you will see the pairs of numbers stream through the Output window. Move the\
    \ mouse and watch the numbers change. Bring the cursor up near the upper-left\
    \ corner of the screen to see them close to 0, 0 and then to the lower-right to\
    \ see them close to 550, 400.\n\n> Notice if you move the cursor outside the Flash\
    \ test window, the values of _xmouse and _ymouse don't change. If you move the\
    \ cursor of the movie to a point outside the movie fast enough, the old value\
    \ stays until the cursor re-enters the active area. This is an unfortunate fact\
    \ of life with Flash and something that you will have to plan for when using _xmouse\
    \ and _ymouse.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_115_0.png)\n\n# Task:\
    \ Follow the Mouse\n\nNow you know how to get the mouse location, and you know\
    \ how to set the location of a movie clip, you can combine these two pieces to\
    \ make a movie where a movie clip follows the cursor around the screen."
