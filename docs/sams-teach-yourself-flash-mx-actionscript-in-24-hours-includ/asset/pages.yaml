  md: '# Movie Clip Scripts


    You have already seen how to attach movie clips to frames and buttons. Now it
    is time to attach them to movie clips.


    Movie clip scripts, like button scripts, use handlers. Instead of using the on
    keyword that button scripts use, we will use the onClipEvent keyword. Here is
    an example of a movie clip:


    ```

    onClipEvent(load) {

    trace("This clip has been loaded.");

    }

    ```


    The load event happens when a movie clip first appears on the screen. It happens
    one only.


    Remember that when you stop the main timeline, the movie clips on the main timeline
    continue to animate. That fact is important to movie clip scripts because the
    next event, enterFrame every time a new frame is reached in the movie clip. Even
    when the main timeline is stopped, movie clip continues to move along its timeline,
    looping back to the beginning when it reaches its end. This means that enterFrame
    happens at a continuous rate. Whenever an enterFrame event occurs, our onClipEvent
    (enterFrame) handler will be called. Here is a sample:


    ```

    onClipEvent(enterFrame) {

    trace("This clip has entered a new frame.");

    }

    ```


    The sample movie 0enterframe.fla contains a simple movie clip script attached
    to it. Run it, and your Output window will look like this:


    +   - This clip has been loaded.

    - This clip has entered a new frame.

    - This clip has entered a new frame.

