- img_proc: true
  md: "In addition to Label and Change Handler parameters, you now also have Initial\
    \ Value and Label Placement parameters. The Initial Value parameter is either\
    \ true or false, depending on whether you have the CheckBox to start off checked.\
    \ The Label Placement allows you to select right or left. Right is the default\
    \ parameter, which is shown in Figure 21.4. If you switch to left, the text will\
    \ be to the left of the box instead.\n\nIn the example, I named the three CheckBox\
    \ instances option1, option2, and option3. I also labeled them One, Option Two,\
    \ and Option Three. The Change Handler for each is labeled to changeOptions.\n\
    \nI placed the changeOptions function in the main timeline. This will be triggered\
    \ any time one of the CheckBoxes is clicked. It will select the name of the CheckBox\
    \ and its new state to the Output window.\n\n```\nfunction changeOptions(checkBoxInstance)\
    \ {\n  trace(checkBoxInstance._name+\\*: \"*checkBoxInstance.getValue());\n}\n\
    ```\n\nIn 21checkbox.fla, I also added a PushButton component. This button is\
    \ named doneButton and calls the buttonPressed function. This function loops through\
    \ all the CheckBoxes and sends its state to the Output window.\n\n```\nfunction\
    \ buttonPressed(buttonInstance) {\n  if (buttonInstance == doneButton) {\n   \
    \ trace(\"Option One: \"+*option1.getValue());\n    trace(\"Option Two: \"+*option2.getValue());\n\
    \    trace(\"Option Three: \"+*option3.getValue());\n  }\n}\n```\n\nInstead of\
    \ sending the results to the Output window, you would probably want to use them\
    \ in some other fashion. For instance, you might want to place them in a LoadVars\
    \ object so that they can be sent to a server.\n\n# RadioButtons\n\nRadioButtons\
    \ are similar to CheckBoxes, except that they are arranged in groups. Only one\
    \ RadioButton in a group can be on at one time. You can see RadioButtons look\
    \ like Figure 21.5.\n\nFigure 21.5\nRadioButton components allow the user to select\
    \ exclusive options.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_310_0.png)"
