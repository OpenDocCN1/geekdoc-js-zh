  md: 'When you run the movie now, the ball bounces off all four walls. It keeps going
    and going. It is a good example of an animation easily done with ActionScript
    but next to impossible with frame-by-frame manually created animation.


    Figure 7.3 illustrates this example.


    **FIGURE 7.3**

    In the *07bounce.fla* example movie, the ball ricochets off all four walls. This
    figure uses shading to show the ball over many frames. The example movie shows
    only the current ball location.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_114_0.png)


    You may notice that the ball seems to go slightly beyond the edges of the screen.
    That is because the horizontal and vertical location of the movie clip refers
    to the middle of the ball. If the ball is 20 pixels in diameter, the ball might
    appear to go about 10 pixels past the edge. You can adjust for this in your calculations
    in many ways. The simplest would be to use 10, 10, 540, and 390 as your screen
    edges, not 0, 0, 550, and 400.


    # # Mouse Location


    Not only can you get the location of a movie clip on the screen, you can even
    get the location of the mouse, also known as the cursor.


    > What is the difference between the *mouse* and the *cursor*? The mouse is the
    physical device attached to your computer. You may even have a track pad or tablet
    instead. Instead, the cursor is the graphic that moves around the screen as you
    move your mouse. So, technically, *cursor* is the term I should be using here.
    However, ActionScript uses the term *mouse* in its keywords. I will therefore
    use *mouse* and *cursor* interchangeably.'
