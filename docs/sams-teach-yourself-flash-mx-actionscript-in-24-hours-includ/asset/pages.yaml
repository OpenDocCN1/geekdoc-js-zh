  md: '# Controlling Movie Clips


    and you want that movie clip to tell the main timeline one level above it to do
    something,

    root is one way of doing it.


    You can also use _parent to target the level exactly above the current level.
    So, if

    You are one movie clip down from the root level, and you use _parent, it is the
    same as

    using _root. However, if you are two levels down, _parent means the level above,

    whereas _root means two levels above.


    > It can help number the levels. The root level, which is the main timeline,

    is level 0. A movie clip on the root level is level 1. If there is a movie clip

    inside movie clip, it is at level 2. From level 2, _parent refers to level 1,

    and _root refers to level 0.


    So about the other way? If you are at level 0, and you want to refer to a movie
    clip

    named "gears", you have already seen that you can refer to it by name. You can
    also use

    t term _root followed by square brackets, with the name of the movie clip inside
    it.

    Here are two lines of code that mean the same thing, provided they are at the
    root

    level:


    ```

    gears.gotoAndStop(7);

    _root[''gears''].gotoAndStop(7);

    ```


    Another way to do this would be to use the keyword. When you use this, you are

    referring to the current level. So at the root level is the same as _root.

    However, inside the movie clip "gears" will be the same as gears, the following

    three lines mean the same thing at the root level:


    ```

    gears.gotoAndStop(7);

    _root[''gears''].gotoAndStop(7);

    this[''gears''].gotoAndStop(7);

    ```


    So which one do you use? The advantage of using _root and this is that you can

    refer to movie clips by instances. For instance, you could do this:


    ```

    var whichClipToUse = "gears";

    this(whichClipToUse).stop();

    ```


    The advantage of using this over _root is that you will not always have everything

    pening at the root level. Sometimes movie clips will issue commands to other movie

    clips at lower levels, and you will need to use this to make it work. Therefore,
    this

    wins out as the best way to refer to movie clips. However, in simple cases, it
