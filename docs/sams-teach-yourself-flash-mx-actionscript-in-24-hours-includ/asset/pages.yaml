  md: "placed the cursor movie clip in the top layer, it could still be behind movie\
    \ clips created with ActionScript using the duplicateMovieClip and attachMovie\
    \ commands.\n\nTo ensure that the movie clip is above all else, you will want\
    \ to use the swapDepths command to bring the movie clip the very front.\n\nThe\
    \ swapDepths command takes a movie clip and places it at a new level. A level\
    \ can be any integer: 0, 1, 10, 9999. Anything that was at that level previously,\
    \ it will now be at the former level of the movie clip.\n\nWhen you use the duplicateMovieClip\
    \ or attachMovie commands, you specify a level for the new movie clip to reside.\
    \ As long as these numbers are less than the level of the cursor movie clip, the\
    \ cursor will always be on top. For instance, this command virtually ensures that\
    \ the cursor movie clip stays on top:\n\n```\ncursor.swapDepths(99999);\n```\n\
    \n# # Task: Full-Time Custom Cursor\n\nSo if you want to replace the cursor throughout\
    \ the entire Flash movie. This is the easiest case. All you need to place a cursor\
