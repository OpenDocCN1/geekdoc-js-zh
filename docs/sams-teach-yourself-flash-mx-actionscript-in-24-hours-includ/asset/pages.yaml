  md: 'You can change more than just the font. The number of style items is too long
    to list here. You can change the color and style of checks in CheckBoxes, circles
    in RadioButtons, arrows in ScrollBars, background colors, highlights, selection
    col-, and so on. Check any of the various Flash systems to see a complete list.


    # Grouped Customization


    Although the globalStyleFormat is used by all the components on the stage, you
    can create your own style objects that can be used by one or more components that
    you specify.


    You do this by creating an FStyleFormat object. When you do this, your object
    has the same set of properties as the globalStyleFormat object.


    For instance, you can create a style object and set its color to magenta like
    this:


    ```

    myStyle = new FStyleFormat();

    myStyle.textColor = 0xFF00FF;

    ```


    Any elements that are not explicitly set are just included in the style object.
    aspect of its style will not change when you apply this style to a component,


    To apply the style to a component, use the addEventListener command:


    ```

    myStyle.addListener(radioButton1);

    ```


    If this seems like an old use for addEventListener, you are right. But think of
    it like this: You are telling the component to listen to the style object.


    # Single Component Customization


    You can set any one of the style attributes for a component directly. However,
    you can''t do it using nice and neat syntax like you would expect. Instead, you
    need to use the setProperty command. This takes the style property as a string
    in the first parameter and the value you want to set it as the second parameter.


    ```

    checkbox1.setProperty("textColor", 0xFF0000);

    ```


    So using these three methods of setting component styles, you can customize your
    components to your heart''s content.


    # Summary


    Components are complex movie clips built in Flash. They re-create some common
    user interface elements such as check boxes, radio buttons, pushbuttons, pull-down
    menus, and scrollbars.'
  merge: -1
