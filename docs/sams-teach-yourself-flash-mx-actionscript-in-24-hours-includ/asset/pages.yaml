    # # Summary


    Selecting, dragging, and dropping elements is a standard way that computer programs
    allow users to interact with the environment.


    To allow a movie clip to be selected, you must first detect a click on it. You
    can place a button inside the movie clip, or use onClick(mouseUp) along with hitTest
    to determine whether the movie clip has been clicked. You can then send the movie
    clip to another frame to signify that it has been selected.


    To allow for dragging, you can use ActionScript''s built-in startDrag and stopDrag
    commands, or build your own dragging scripts using onClipEvent handlers.


    You can use hitTest to determine whether one movie clip overlaps with another.
    You can then determine the result of a user''s dragging. You can use this to allow
    the user to drag elements onto other elements.


    # # Q&A


    +   - Why can''t buttons be made selectable?

    - To selectable, the user should be able to click on the item and change its appearance.
    A button will change its appearance while it is clicked but will always revert
    to the up state when the click is complete.

    - The third method of using hitTest—the one that includes a true as the third
    parameter so that the shape of the movie clip is taken into account—be used to
    more accurately determine whether the user has clicked a movie clip?

    - Certainly. As a matter of fact, you should use the third parameter so that the
    click area of a movie clip is defined by its shape rather than its rectangle.'
