  md: "The script has to determine which state movie clip is currently in and then\
    \ send the clip to the other frame. The script can determine the current state\
    \ by looking at the current frame of the movie clip. This can be done with the\
    \ aptly named _currentFrameproperty. This property reads 1 when the movie clip\
    \ is on the first frame and 2 when it is on the second.\n\nHere is the new script.\
    \ You can see it in 08itomcs3.fla. This is a complex script because it first tests\
