  md: '# Quiz Answers


    +   1. The answer is 10. Math.max(5,a) resolves to 12; then Math.min(10,12) resolves
    to 10. The purpose of code like this is to make sure that the variable stays between
    two numbers. In this case, the result will never be less than 5 or greater than
    10, no matter what “a” is.


    +   2. Use Math.cos with a value of 3.14, or Math.PI. Math.cos returns the horizontal
    position of a point on a circle. A complete circle is 6.28, or two times pi, so
    halfway would be 3.14 or pi. You also need to multiply the result by the radius
    of the circle.


    +   3. The largest value of Math.random is slightly less than 1.0. So the largest
    possible value of Math.random()*7 is slightly less than 7.0.


    +   4. Nothing. It is still there and any script assigned to it is active.'
