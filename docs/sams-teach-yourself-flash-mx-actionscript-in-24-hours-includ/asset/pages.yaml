    # Quiz


    +   1. If you have a movie clip at level 1, what is the difference between using
    _root_parent in scripts inside this movie clip?

    2. How many names does a movie clip have?

    3. What is the advantage of using brackets rather than dot syntax in referring
    to a movie clip?

    4. If scripts in the movie timeline are at level 0, and frames inside a movie
    clip are at level 1, at what level is the script attached to the movie clip?


    # Quiz Answers


    +   1. Basically, none. Both refer to the main timeline at level 0. However, if
    you move this clip around and place it another movie clip so that it is level
    2, _root will refer to level 0 and _parent will refer to level 1. So you will
    want to be careful which one you use anyway.'
