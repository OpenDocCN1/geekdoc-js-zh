  md: '# Custom Variable Objects


    When working with movie clip screen positions, you always have two components:
    x and y. Wouldn''t it be nice to be able to organize them a little better? For
    instance, you could name your variables positionX and positionY instead of just
    x and y.


    But these are still just totally variables. The names just look similar.


    You can use custom variable objects to better organize your variables. For instance,
    you could store the x and y position of your movie clip like this:


    ```

    pos = {x:10, y:20};

    ```


    By using the curly brackets, you are creating an object. In this case, the object
    has two parts: x and y, with values 10 and 20. You can access the parts this:


    ```

    trace(pos.x);

    ```


    You can also modify the properties with operators and such, just like a normal
    variable. In your example, you would just use pos.x instead of x.


    Imagine a more complex structure such as a record in a database. The object could
    be record, and the properties of it be things like name, address, phone, and so
    on. You would access them with syntax like pos.name.


    You can create an object gradually, placing new properties in it as you need them.
    Here is an example:


    ```

    record = new Object();

    record.name = "Gary";nrecord.age = 32;

    record.state = "Colorado";

    trace(record.name);

    ```


    In addition to making data easier to organize, custom objects are similar to built-in
    objects. Two examples of built-in objects are the Color object and the Date object.


    # Color Objects


    You can use'' to change the color of a movie clip. The easiest way to do this
    is to use the setRGB command. However, you cannot apply directly to the movie
    clip instance. Instead, you first ask Flash for a reference to the movie clip''s
    Color object. Do this with a new Color() function. Then you can use setRGB to
    set the color.


    Here is simple example. A reference to the color of the movie clip is placed in
    the variable circleColor. Then, the setRGB command changes this color to 0xFF0000,
    which is the hexadecimal value for red.'
