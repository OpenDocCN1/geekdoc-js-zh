  md: '# Controlling the Flow of the Movie


    When you test the movie, the first frame with the “A” quickly appears. Then the
    movie moves on to the second frame with the “B.” At this point, the stop command
    executes, and the movie stops on frame 2. Frame 3, with the “C” on it, never appears.


    # Jumping from Frame to Frame


    Another basic ActionScript command is the gotoAndPlay command that we have already
    seen many times in examples. This command jumps from the current frame to any
    frame you specify. You can use a number or a frame marker name. Here are some
    examples:


    ```

    gotoAndPlay(7);

    gotoAndPlay(20);

    gotoAndPlay(''my frame label'')

    ```


    You can also specify a scene if your movie uses more than one. If you use gotoAndPlay
    with one parameter, that is the frame. But if you use it with two parameters,
    the first is the scene name and the second is the frame number or name.


    ```

    gotoAndPlay(''My Scene'', ''My Scene'');

    ```


    When you use the gotoAndPlay command, the movie jumps to the frame specified and
    immediately continues playing. But if you want the movie to jump to the next frame
    and stop on that frame, you should use the gotoAndStop command. It works the same
    way as gotoAndPlay, with the same option of using one or two parameters.


    There are also two simple commands that work like gotoAndStop but take the movie
    to the next frame or the previous frame. You can use nextFrame or prevFrame in
    cases where you just want to advance or go back one frame.


    To see all these commands in action, it is useful to have a movie with buttons.
    So let''s take a look at how to create buttons before going any further.


    # Creating Buttons


    Buttons are one of the three main types of symbols that you use in Flash. The
    others are movie clips and graphics.


    # Making a New Button


    There are many ways to create a button. One method is to choose Insert, New Symbol
    from the menu. You are presented with a dialog asking you to name the symbol and
    choose whether it is a movie clip, button, or graphic. Choose Button.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_87_0.png)'
