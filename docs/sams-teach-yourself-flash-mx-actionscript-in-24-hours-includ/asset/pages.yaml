    # Targeting Movie Clips


    We have already seen the simplest way to target a movie clip. Just use its name,
    followed by a dot, followed by the command you want to send.


    However, there are plenty of ways to target a movie clip as well. First, let''s
    learn how to target different levels of the Flash movie.


    The most basic level in a Flash movie is the main timeline. You can target it
    with the _root keyword. That is an underscore followed by the word “root.”


    For instance, if you want to send a gotoAndStop command to the main timeline,
    you can do:


    ```

    _root.gotoAndStop(7);

    ```


    If you issue this command from the main timeline, there is no need for the _root
    target; however, it will work either way. But if you are writing code that is
    inside a movie clip,'
