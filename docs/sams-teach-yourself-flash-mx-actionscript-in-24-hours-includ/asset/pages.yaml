    \ box.\n\n| Choice 1 | | Choice 1 | Choice 1 |\n|---|---|---||\n| | | Choice 2\
    \ | Choice 2 |\n| | | Choice 3 | Choice 3 |\n| | | Choice 4 | Choice 4 |\n| |\
    \ | | |\n| | | Choice 5 | Choice 5 |\n| | | Choice 6 | Choice 6 |\n| | | Choice\
