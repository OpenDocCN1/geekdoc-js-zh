  md: '# About the Author


    **GARY ROSENZWEIG** started programming in the early ''80s on TRS-80 and Apple
    computers. After getting a degree in computer science from Drexel University,
    he started using the Flash-like tools Hypercard and Macromedia Director to create
    multimedia applications.


    After getting a degree in journalism and mass communication from the University
    of North Carolina at Chapel Hill, Rosenberg began to work with Macromedia Director
    professionally and eventually wrote six books about Director. His most recent
    is *Special Edition Using Director 8.5* from Que publishing.


    In 1995, Rosenberg started CleverMedia, a game development company that specializes
    in Shockwave games. CleverMedia now has four games, including http://clevermedia.com/
    and http://flasharcade.com/. The latter is a site composed completely of Flash
    games, dating back to Flash 2.


    Rosenberg also speaks at Macromedia User Conferences, the Game Developers Conference,
    and other events. In his spare time, he reads a lot of classic science fiction,
    watches independent films, and listens to alternative rock music. He lives in
    Denver, Colorado, with his wife, Debby dog, Natasha; and daughter, Lucy. You can
    find more and contact him through his Web site http://www.garyrosenzweig.com/.'
  merge: -1
  pgno: 16
