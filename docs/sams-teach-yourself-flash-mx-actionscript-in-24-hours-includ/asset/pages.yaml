  md: '# Getting Input From the User


    # Input Text


    In Flash, users can also type in an input text field. You can have them enter
    a series of characters, and then you can access what they typed with ActionScript.


    To allow the user to type, you''ll need to create an input text field. This is
    done the same way as you would create any text in Flash. First, use the Tool to
    draw a text area on the screen. Type something in it, such as **input text** so
    that it doesn''t disappear if you use other tools.


    Now, with this new text area selected, choose Window, Properties. You can also
    use the keyboard shortcut Command+F3 on Macs and Ctrl+F3 in Windows. You''ll get
    a panel that looks like Figure 9.1.


    Figure 9.1


    The Properties panel allows you to see almost every property about a text area.
    The small triangle allows you to expand or contract the bottom portion.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_149_0.png)


    To make a text area an input text field, you''ll need to change its type with
    the pop-up menu at the upper-left corner of the panel. In Figure 9.1, it is already
    set to Input Text.


    You can use this panel to adjust the font and font settings by this field. You
    can also change how the field lays out with the pop-up menu item to Single Line
    in Figure 9.1. You can also set it to Multiline so that the user can type large
    amounts of wrapped text into a larger input field. Multiline No Wrap forces the
    user to press Return between lines. Password hides the letters the user types,
    using “*” instead of char.


