- img_proc: true
  md: '# Learning to Program


    > I can''t stress this point enough. It is the single most important piece of
    information in this book. You must break down programming problems into smaller
    and smaller steps until you can solve each problem. About 90 percent of the time
    people ask me for advice on how to do something on the computer, their problem
    turns out to be that they aren''t breaking down the problem into small enough
    pieces.


    # Writing Bug-Free Code


    A bug is an error or other problem with the program that you have written. Sometimes,
    bugs are obvious things that you are warned about while writing the program. Flash
    warns you about syntax errors and things that it doesn''t understand.


    > The term bug came because the first computer bug was actually a real bug. A
    moth got caught in an early computer, attracted by the light of the vacuum tubes
    inside. The term bug has been used to describe problems ever since.


    Other bugs don''t show up until you run the program. These are problems that look
    okay to Flash but make the program perform in a way other than what you wanted.


    # Simple Solution


    The easiest way to write a bug-free program is not to put the bugs there in the
    first place. This sounds a little ridiculous, but it makes sense.


    Take time planning and writing your code. Check and double-check variable and
    function names. Think about how each line of the program will work as you write
    it.


    One way to make it easy to do is to write your program one piece at a time. After
    you have completed each piece, test it out before going any further.


    For instance, if you are making a space invaders game, try just making the player''s
    ship react to the left arrow key first. Set up everything you need in your movie
    to make this one thing happen. Then, test it. If you keep working with just small
    steps like this, you''ll avoid having to make a lot of bug fixes when you are
    finished.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# The Hard Truth About Bugs


    The hard truth is that it is nearly impossible to write a program that doesn''t
    have any bugs at first. Even the best programmers who have been writing programs
    all their lives can''t do it.


    So don''t try to be a perfectionist as you write your code. You will have to spend
    some time testing and fixing bugs anyway at the end.


    This is a tough point for some people who are first learning to program. It seems
    that programming is something that has a certain amount of precision and should
    be easy to get the right first time. But it is more like an art, you work at a
    program, making adjustments and changes, until it runs the way you want to.


    > Dealing with bugs this way seems contradictory. On the one hand, take the time
    to write bug-free code, but on the other hand, don''t waste time trying to add
    comments to your code, to be a perfectionist. Find a balance between these that
    will optimize your time and effort.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_60_0.png)


    # Preparing for Bugs


    You can do many things to prepare for fixing bugs later. The primary one is to
    comment your code. Most programming languages allow you to add comments to your
    code, and ActionScript is no exception. You can designate one or more lines, or
    even part of a line, to a comment. A comment can be anything you want; it is ignored
    by Flash.


    The idea behind commenting your code is to leave hints for future so that you
    can return to the code and remember what it does. It also helps if someone else
    will be using your code later.


    At times, it may seem like overkill to comment code. After all, when you write
    a section of code it is obvious to you what the code is doing. But consider that
    some bugs may pop up for weeks or months. You may be several projects down the
    road when you find that you need to open up an old Flash file and make changes.
    Comments will be a huge help at that point.


    In addition to comments, you can also make your code easier to read by using descriptive
    variable names and function names. Three months after writing the program, you
    may not remember what s was supposed to stand for, but gameScore will still make
    sense.'
