  md: '# HOUR 12


    # Objects and Arrays


    Until now, all variable data has been stored individually, one bit of data per
    variable. This works fine for most simple applications, but you soon end up with
    a lot of variables. You can also find yourself faced with difficult situations
    where you need to store a lot of data, and single variables are just not able
    to do it easily.


    ActionScript can use two methods to store a lot of data. The first method we will
    look at custom objects. You can use these to group pieces of data together. The
    second method is arrays, which is a fundamental part of any advanced programming
    language.


    In this hour, you will:


    +   - Find out how to make custom variable objects

    - See how to use built-in ActionScript objects such as colors and dates

    - Learn about arrays

    - Build a word server animation

    - Teach movie clips to form a trail behind the mouse


    ![](img/9e6d716993ade8c40e3512ad7da0a693_187_0.png)'
