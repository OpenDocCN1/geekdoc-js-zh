  md: "# Date Objects\n\nAnother type of object that is built in Flash is the Date\
    \ object. It helps to think of the Date object as a different type of variable\
    \ altogether, like numbers and strings. Date object represent a point in time.\n\
    \nThe Date object is broken into seven parts: year, month, date, hour, minute,\
    \ second, and millisecond. You can create a new date object by supplying all these\
    \ elements:\n\n```\nmyDate = new Date(2002,3,29,10,30,15,500);\n```\n\nIf you\
    \ want to examine the contents of myDate with a trace command, you will get a\
    \ string in the Output window that looks like:\n\n```\nMon Apr 29 10:30:15 GMT\n\
    ```\n\nThis is easy to read and understand, but one thing sticks out: the month\
    \ is Apr. in the previous line, the month was set to 3. Shouldn't that be March?\n\
    \nDate objects in Flash work like Date objects in other computer languages. Most\
    \ of them share the idiosync that months are numbered 0 to 11. This is strange\
    \ because days of the month are numbered 1 to 31. It is just something you have\
    \ to get used to.\n\nYou can get the components of a Date object by using one\
    \ of a whole list of Date object functions. For instance, to get the year, you\
    \ can use myDate.getFullYear().\n\nIf you want to get the current time, all you\
    \ need to do is create a blank Date object. The current time will be inserted.\
    \ Try this in a frame of a blank movie:\n\n```\nmyDate = new Date();\ntrace(myDate);\n\
    ```\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_190_0.png)\n\n| Flash gets the\
    \ current date from the clock in the user's machine. It is always a mistake to\
    \ assume that this time is correct. Many users do not have their clocks set correctly.\
    \ You can use this time and date for normal movies, but nothing critical like\
    \ e-commerce or account transactions. \n\n# Arrays\n\nThe last major aspect of\
    \ programming that we need to cover is arrays. You'll find arrays in almost every\
    \ programming language; they are almost indispensable tools for complex programming.\n\
