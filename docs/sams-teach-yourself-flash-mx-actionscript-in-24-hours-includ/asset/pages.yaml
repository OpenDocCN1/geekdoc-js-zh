    # Input Text Tab Order


    In Flash 5, one of the biggest complaints that developers had was that they could
    not set the Tab order of input fields. Tab order refers to the automatic movement
    of the cursor between input fields when the user presses the Tab key. This happens
    in all professional applications as Web browsers. Users have to expect when they
    press Tab, the cursor will move to the next logical field.


    However, Flash''s choice for the next logical field is not always correct. After
    all, Flash can only assume much based the position of the fields. For instance,
    in Figure 15.5, Flash assumes that the field after the first one is the field
    under, not across from it.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_232_0.png)


    Fortunately, you can override Flash''s automatic Tab order with the tabindex property
    of a text field. If the variables range from text1 to text4, you could use this
    to set Flash straight:


    ```

    text1.tabIndex = 1;

    text2.tabIndex = 2;

    text3.tabIndex = 3;

    text4.tabIndex = 4;

    ```


    When using tabindex, take care to label all the text fields, leaving none undefined.
    Also avoid using the name twice. This will confuse Flash.


    One thing that neither the default Tab ordering nor the use of tabindex does to
    automatically set the focus on the first field. To do that, you have to use a
    command in the Selection object to specifically tell Flash that you want the cursor
    to appear there.


    ```

    Selection.setFocus(text1);

    ```'
