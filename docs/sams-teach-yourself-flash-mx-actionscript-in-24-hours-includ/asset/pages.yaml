  md: '# HOUR 3


    # # Learning to Program


    Programming is both a science and an art. You will need knowledge of the programming
    language’s syntax and a lot of creativity because there is rarely only one way
    to write a program. Ten different programmers will write 10 different programs
    to accomplish the same task.


    As you learn ActionScript, you will develop your own style. First, you will probably
    pick up the style that I use in this book. But later this will slowly develop
    as you adapt techniques you invent yourself.


    Some basic programming concepts hold true for just about every programming language.
    Let’s review those concepts in this hour before learning the specifics of how
    they are implemented in Flash.


    In this hour, you will:


    +   - Understand how computers think

    - Find out what elements make up a program

    - Learn about variables

    - See how conditions and loops make programs flow

    - Learn how to break a large problem into smaller parts

    - Find out how to write bug-free code


    ![](img/9e6d716993ade8c40e3512ad7da0a693_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# How Computers Think


    Actually, computers don''t think at all. They mindlessly follow instructions.
    They carry these instructions very literally.


    A Flash script is a list of instructions. However, it is best not to think of
    them as a list of instructions addressed to the computer but to the Flash runtime
    environment. Scripts tell Flash what to do.


    When you look at a code listing, you can "play computer" by reading the code and
    predicting what the computer will do each step of the way.


    To computer, you pretend that you are the computer, or more specifically, that
    you are Flash. You read each line of the program and pretend that it is an instruction
    you must carry out.


    For instance, if you are supposed to jump from one frame in the Flash movie to
    another, you imagine that the Flash movie is now on the destination frame and
    waiting for the next instruction. You then read the line and follow that instruction.


    By playing computer, you can predict what your scripts will do. You can troubleshoot
    your scripts and fix problems in them before you even run the program once. Soon,
    playing computer will be something that you naturally do as you program. When
    you write a line of code, you will imagine what Flash will do with that instruction.
    As you write a whole script, you will constantly checking your code by this.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_52_0.png)


    > Computer programs are like onions. Take a Flash movie, for example. It is a
    .swf file that runs inside the Flash plug-in. The Flash plug-in, in turn, is running
    inside your Web browser. The Web browser is running as an application inside your
    computer''s operating system. The operating system uses a complex toolbox of programs
    to do things such as display pixels on the screen; this toolbox is running on
    the microprocessor inside your computer.

    All levels depend on the ones below; each level must support everything that runs
    on top of it. This makes for a complex and delicate system.

    Fortately, as an ActionScript programmer, you are shielded from everything but
    the top layer. You don''t have to know how the microprocessor, operating system,
    or Web browser works. You don''t even have to know how Flash works—just what it
    is capable of doing and how you go about doing it.


    # Commands, Functions and Operations


    So far, I have used the term keywords to describe elements of ActionScript. For
    instance, gotoAndPlay is a keyword. It is also a command.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Learning to Program


    **NEW TERM** A *command* is an element of ActionScript that tells Flash to do
    something specific. Commands are obeyed as long as they make sense. For instance,
    if you use gotoAndPlay with a frame label that doesn''t exist, the command cannot
    be executed.


    Commands are the most basic element of programming. In Flash, little can be done
    without at least one command. We''ll be learning many commands throughout the
    rest of the book.


    **NEW TERM** Functions are terms in ActionScript that perform a calculation and
    return a result. For instance, a function might take a single number and return
    the square root of that number.


    **NEW TERM** Both commands and functions can take one or more parameters. A parameter
    is a value passed to the command or function. The *gotoAndPlay* command needs
    at least one parameter to work: the name or number of the function to go to. A
    square root function would need a single value as a parameter.


    **NEW TERM** Different commands and functions are operators. These are usually
    symbols, not words. For instance, the + operator performs addition between two
    values.


    You''ll be using commands, functions, and operators throughout your ActionScript
    programming.


    # Variables


    All sophisticated programming languages use variables to store information. You
    may store information for a number of reasons. A variable has two parts: its name
    and a value.


    # Storing Information


    You will need to store information to write complex computer programs. Sometimes
    you will only store information for a short period of time. For instance, you
    may want your program to repeat a set of commands 10 times. In that case, you
    will need to count the number of times the commands have been repeated and continue
    after that reaches 10.


    In other cases, you will want to store information for longer periods of time.
    For instance, you can ask the user to enter her name and then you can store this
    information in a variable. Later in the Flash movie, you can display this name.


    # Variable Names


    The name of a variable is usually a word or group of words. Sometimes it is a
    single letter. In general, you should make the name of the variable as descriptive
    as possible.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'For instance, if you want to store the name of the user in a variable, userName
    is a good choice for the variable name. A bad choice would be n, which is too
    short, or name, which could be confused with the name of something else in the
    Flash movie.


    > InScript, a convention has arisen that many programmers follow inventing variable
    names. The variables usually start with a lowercase letter but then use an uppercase
    letter when a new word begins in the name. The variable userName is a good example.
    A longer example would be currentFirstName.


    Spaces cannot be used in variable names, and neither can special characters. But
    numbers can be used. So a variable name may be player2.


    # Variable Types


    You can store many different types of information in variables. Numbers are the
    simplest. You can store the number 7 in a variable, for instance.


    +   You can store two different types of numbers in variables. An integer is a
    number that has no decimal component. The numbers 7, 335, -5, and 0 are all good
    examples of integers.


    +   The other type of number is called a floating point, or float. This is a number
    that has a decimal component. Good examples of floats include 0.1, 532.23, and
    -3.7.


    +   You can store characters and words in variables too. These are called Strings.
    A string is a sequence of characters. It can be one or more characters, or even
    a string without characters, which is called an empty string. "Hello", "This and
    that", "a", and """ are examples of strings.


    When writing about strings, quotes are used to define what a value is a string
    and another type of variable. For instance, 7 is the number, while "7" is a string
    with a single character, the digit 7.


    In other programming languages, you would normally have to decide in advance what
    type of information each variable would hold and that at the beginning of your
    program. For instance, you would declare that a variable is named userName and
    that it holds a string. However, in ActionScript, you don''t have to declare variables
    in advance. You just use them, and Flash creates the variables on-the-fly the
    first time they are used.


    In addition, the variables are not restricted to holding only one type of information.
    The variable userName could hold a string at one point and a number at another
    point.'
