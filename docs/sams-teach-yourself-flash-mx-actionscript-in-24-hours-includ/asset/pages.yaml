  md: '```

    // add 2 to the number

    num += 2;

    ```


    The previous example shows a line that is completely a comment. It begins with
    two forwardashes. The rest of the line is whatever you want it to be.


    You can also place a comment at the end of a line. Here is an example:


    ```

    num += 2; // add two to the number

    ```


    Whenever you use the double slashes, the rest of the line is ignored by Flash.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_78_0.png)


    If you have ever studied computer programming in college, you probably already
    know how important comments are. Most teachers will severely penalize a programming
    assignment if it is turned it with inadequate comments.


    There are many different ways to use comments in your code. Programmers place
    one or more lines of comments before each function that explain the function does.
    You can also place comments before individual lines if you feel they need more
    explanation.


    # Debugging


    No matter how careful you are writing your program, every programmer has to eventually
    deal with bugs. To stamp out these pesky things, you should be as skilled in debugging
    techniques as you are in programming. Three methods are useful for debugging:
    logical deduction, sending messages to the Output window, and the ActionScript
    debugger.


    # Logical Deduction


    Most bugs that occur are simple and easy to track down and fix. You won''t need
    any special tools. When the bug occurs, you will have a pretty good idea of what
    it is and where it is.


    Even if you don''t know where the problem is, first if you act like a detective
    and look through your code, you can usually find it. Think of all the information
    that you have as clues: When did the problem happen? What happened? What should
    have happened instead? What unusual went on that might be another symptom of the
    bug?


    No one knows your program better than you do. If you use logical deduction, you
    should be able to find your bug and fix it. However, some bugs are a little trickier,
    so you will need to use some helpful tools.'
  merge: -1
