  md: '# Making Arrays


    Here is an example of an array. You need to use square brackets, commas to build
    one from scratch:


    ```

    myArray = [36,23,63,71,25];

    ```


    This array has five elements, all integers. To get an element of the array, use
    code like this:


    ```

    trace(myArray[0]);

    ```


    The first item in an array is always item number 0. So this example array has
    five items in it, 0 being the number 36 and 4 being the number 25.


    Another way to create a new array is with the new Array() construct. You can use
    this to make a global variable or a local variable where you start the line off
    with var.


    ```

    myArray = new Array();

    ```


    When you want to add an item to the end of an array, use the push command. Here
    is a sequence of lines to create a new array with the same contents as the one
    before:


    ```

    myArray = new Array();

    myArray.push(36);

    myArray.push(23);

    myArray.push(63);

    myArray.push(71);

    myArray.push(25);

    ```


    # Manipulating Arrays


    You can do a number of things with the array after you have it. To get the length
    of the array, use the length property of the array variable. This tells you that
    the array has five items in:


    ```

    myArray = [36,23,63,71,25];ntrace(myArray.length);

    ```


    You can get the last item in the array, and remove it from the array at the same
    time, with the pop command. Here is an example:


    ```

    myArray = [36,23,63,71,25];ntrace(myArray);

    a = myArray.pop();ntrace(a);

    trace(myArray);

    ```


    You first get the starting list of items, showing that there are five items in
    the array. Then you get a 25 as the value of a. Finally, you get the new list
    of items, showing you that the array now has only four items, because pop removed
    the last one.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Using push and pop creates a last-in-first-out system, sometimes called a stack.
    Think of a stack of pancakes. As the cook makes the pancakes, they pile higher.
    The top pancake is the one made most recently. When someone takes a pancake, he
    takes from the top. The last pancake to be eaten is the first one.


    The opposite of pop is shift. This removes the first element from the array. So
    the following code performs as same as the previous code, but the number 36 is
    put into an instead:


    ```

    myArray = [36,23,63,71,25];ntrace(myArray);

    a = myArray.pop();

    trace(a);

    trace(myArray);

    ```


    The opposite of pop is unshift. This puts a new item at the beginning of the array.


    To get a portion of an array, use the slice command. The arguments are the first
    and last items to be taken:


    ```

    myArray = [36,23,63,71,25];ntrace(myArray.slice(1,3));

    ```


    This returns 23 because the third item is actually not included. If you omit the
    second argument altogether, you will get all items until the end of the array.


    The Swiss Army knife of array commands is splice. The first parameter is the position
    of the array where the operation should begin. The second parameter is the number
    of items to delete. This can be 0 if you don''t want to delete any items. The
    rest of the parameters are to insert. You cannot list any items if there are none
    to insert.


    Here is an example where the 23 and 63 are removed, and a 17 is inserted in their
    place:


    ```

    myArray = [36,23,63,71,25];nmyArray.splice(1,2,17);

    trace(myArray);

    ```


    # Sorting Arrays


    You can also sort an array with the sort command. The following code returns the
    array in numerical order:


    ```

    myArray = [36,23,63,71,25];nmyArray.sort();ntrace(myArray);

    ```


    The sort command also sorts a list of strings into alphabetical order:


    ```

    myArray = [''Gary'',''Will'',''Jay'',''Brian''];nmyArray.sort();ntrace(myArray);

    ```'
