- img_proc: true
  md: "# Linking and Playing Sounds\n\nThe first thing you need to do before playing\
    \ a sound with ActionScript is to link it. Import the sound into the Library,\
    \ select Linkage from the Library panel's menu, and set the sound to export with\
    \ the movie. You can also assign a different linkage name to the sound, but Flash\
    \ starts you off with the same name as the Library element, which is the same\
    \ name as the file.\n\n> If you are working with a movie that has a lot of sound,\
    \ it is a good idea to set the default sound compression to Raw in the Publish\
    \ Settings. When you test your movie, Flash will not take the time to compress\
    \ the sound. This way, you can test your movie as quickly as possible. Then, change\
    \ the default sound compression setting to what you really want before publishing\
    \ a copy for the Web.\n\nFor instance, if you import the file mys.wav, it will\
    \ appear in the Library as mysound.wav. When you set its Linkage properties so\
    \ it exports with the file, it will be assigned the linkage name mysound.wav,\
    \ but you can change that to anything you want. It is this linkage name that you\
    \ will use to refer to the sound in your code.\n\nTo play a sound, you must perform\
    \ at least three steps. The first step is to create a new sound object:\n\n```\n\
    mySound = new Sound();\n```\n\nThen, you need to attach the sound in the Library\
    \ to this sound object:\n\n```\nmySound.attach('mysound.wav');\n```\n\nFinally,\
    \ you have to tell the sound object to play the sound:\n\n```\nmySound.start();\n\
    ```\n\nHere is a simple button handler that plays a sound in the Library:\n\n\
    ```\non (release) {\n  mySound = new Sound();\n  mySound.attach(\"poof.wav\");\n\
    \  mySound.start();\n}\n```\n\nYou can find this simple example in the movie 22playsound.fla.\
    \ You can find a slightly more sophisticated approach in the movie 22playsoundfunction.fla.\
    \ In this movie, a function called playSound is placed in the main timeline. This\
    \ function includes all the code you need to play a simple sound."
  merge: -1
  pgno: 322
- img_proc: true
  md: "```\nfunction playSound(soundName,balance) {\n  var mySound = new Sound();\n\
    \  mySound.attachSound(soundName);\n  mySound.start();\n}\n```\n\nBy using this\
    \ function, you can simplify your ActionScript so that you can play a sound with\
    \ only one line. Here is a button script that uses this function:\n\n```\non (release)\
    \ {\n  playSound(\"poof.wav\");\n}\n```\n\n# The start Command\n\nThe start command\
    \ in the previous example can be used in a few different ways. You can add up\
    \ to two additional parameters to it to alter the way sound plays.\n\nThe first\
    \ parameter you can add is an offset. This starts the sound somewhere in the middle,\
    \ rather than at the beginning. For instance, this line starts the sound off 1000\
    \ milliseconds, or 1 second, into the sound:\n\n```\nmySound.start(1000);\n```\n\
    \nThe second parameter the start command can take the number of loops. For instance,\
    \ if you want to start the sound off at 1 second and loop it three times, you\
    \ would do this:\n\n```\nmySound.start(1000,3);\n```\n\nIf you want to start the\
    \ sound at the beginning and loop it three times, just use 0 as the offset:\n\n\
    ```\nmySound.start(0,3);\n```\n\nThe companion command to stop is stop. If you\
    \ are playing a long sound, you can issue a stop command at any time to halt the\
    \ sound in its tracks. You must supply the sound name again as a parameter. Otherwise,\
    \ the stop command stops all sounds playing.\n\n```\nmySound.stop(\"poof.wav\"\
    );\n```\n\n# Adjusting Volume\n\nYou can alter a sound both before and during\
    \ playback with a variety of commands. All these commands somehow alter the volume\
    \ of the sound, in both speakers together or separately.\n\nThe volume command\
    \ is the simplest of these adjustments. By setting the volume to a number from\
    \ 0 to 100, you can raise, lower, or silence a sound:\n\n```\nmySound.setVolume(50);\n\
    ```"
  merge: -1
  pgno: 323
- img_proc: true
  md: "The example movie22playsoundvolume.fla features a Play button and four different\
    \ volume buttons. The top one sets the volume to 0, the next one to 10, the next\
    \ to 50, and the bottom button to 100. The Play button plays a sound 100 times\
    \ so that you can have the chance to adjust the volume while it plays.\n\nYou\
    \ can click a button during playback to adjust the volume. Note that adjusting\
    \ the volume of a specific sound does not affect the volume of other sounds being\
    \ played at the same time. This means that you can have separate controls for\
    \ different sounds—such as background music and instance sounds.\n\n# Sound Properties\n\
    \nSound objects have two properties that you should know about. The first is duration.\
    \ This is how long the sound is, in milliseconds.\n\nThe sibling property to this\
    \ is position. This is the location of the current bit of sound being played,\
    \ in milliseconds.\n\nFor instance, if a sound has a duration of 3000, it is 3\
    \ seconds long. If the position of the sound is 1500, the sound is in the middle\
    \ of being played.\n\nThe example movie22tracksound.fla demonstrates using position\
    \ and duration to show the playback of a sound visually.\n\nAfter starting a sound,\
    \ a movie clip script positions a movie clip mark at a position along the width\
    \ of a movie clip named bar.\n\n```\nonClipEvent(enterFrame) {\n    // how far\
    \ long is the sound (0.0 to 1.0)\n    percentPlayed = thisSound.position/thisSound.duration;\n\
    \n    // how wide is the bar\n    barWidth = _root.bar.width;\n\n    // set the\
    \ mark\n    _root.mark.x = _root.bar.x + barWidth*percentPlayed;\n}\n```\n\n#\
    \ When a Sound Ends\n\nYou can use the duration and position of a sound to determine\
    \ when a sound ends. They will be equal to each other. However, if a sound loops,\
    \ the duration and position of a sound will be equal to each other for a moment\
    \ at the end of each playback of the sound.\n\nA better way to determine the end\
    \ of a sound is to use the onSoundComplete listener."
  merge: -1
