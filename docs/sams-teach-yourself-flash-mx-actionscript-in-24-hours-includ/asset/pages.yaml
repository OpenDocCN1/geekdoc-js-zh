    Figure 12.1


    The Advanced Effect color settings dialog allows you to modify the color and transparency
    of a movie clip. It corresponds to capabilities of the setTransform ActionScript
    command.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_189_0.png)


    There is another way to change the color of a movie clip. You can create a color-object
    that corresponds to the eight entries in Figure 12.1.


    To do this, make a custom variable object. Assign it to the properties ra, ga,
    ba, aa, rb, gb, bb, and ab. These correspond to the eight entries in Figure 12.1.
    The first letters—r, b, g and a—refer to red, green, blue, and alpha. The second
    letters—a and b—refer to the left and right columns.


    Then, instead of using setRGB, use setColor, with this object as the parameter.
    This is an example:


    ```

    circleColor = new Color("circle");

