    # HOUR 18


    # Sending Information to the Server


    Until now, all the movies we have created have been standalone client-side productions.
    The experience takes place on the user''s machine and does not result in anything
    beyond that. However, Flash can send information back to the server just like
    an HTML page form. So you can use Flash as a replacement for a form, or something
    more complex that gathers information and sends it back to your server.


    In this hour, you will:


    +   - Learn about the LoadVars object

    - Create a simple server-side application

    - Use Flash to send information to the server'
