- img_proc: true
  md: 'When using loadMovie, you can use the getBytesTotal and getBytesLoaded functions
    to check the progress of the load. This means that you can report the progress
    to the user with text or even a progress bar like the one used earlier in this
    hour.


    If you want to preload a movie clip to have it ready before the user gets to a
    place where it is needed, you can set up the external movie so that nothing is
    on the first frame but a stop() command. Load the movie into a blank movie clip
    that is off stage. When it completes, the movie just sits there on its blank frame.


    However, the movie file will be sitting in the user''s browser cache. Now when
    it comes to really use the movie clip, do the loadMovie command again. The movie
    will be there quickly because the file has already been downloaded. Then issue
    a gotoPlay(2) command to get it past that first frame.


    # Loading a JPEG


    Flash MX has a new capability that developers have been begging Macromedia for
    since they bought Flash; it can import an external JPEG file.


    The way you do this is simple. Just use the loadMovie command like you are planning
    to replace a movie clip with an external Flash movie. However, give the location
    of a JPEG file instead:


    myMovieClip.loadMovie("picture.jpg")


    The movie clip is now replaced by a movie clip that holds bitmap image. Check
    out the movie 23loadjpeg.fla for an example.


    # Loading a Sound


    There are two ways to play a sound from an external file. They both use the sound
    object and the loadSound command. The sound file needs to be in the popular MP3
    format.


    Here is an example of the first method, which plays an event sound. This means
    that the entire sound is loaded into memory first and then played if a start command
    is issued.


    ```

    (release) {

    mySound = new sound();

    mySound.loadSound("mysound.mp3",false);

    mySound.start();

    }

    ```


    Flash remembers that the start command was issued, even though the sound has just
    begun to download. When the sound is finished downloading, it plays immediately.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Managed Media Streaming


    The second method uses a true in the second parameter. This tells Flash to stream
    the sound in. As soon as some of the sound has been loaded


    ```

    on (release) {

    mySound = new sound();

    mySound.loadSound("mysound.mp3",true);

    }

    ```


    Notice that you don''t need the start command with a streaming sound. However,
    you do need to pay careful attention to how you manage the MP3 file. For instance,
    if you use the 128Kbps or 160Kbps setting that is popular for playing MP3 music,
    it will be too large of a file to stream over the Internet, especially if the
    user has a modem. 32Kbps or less will give the stream a chance to work successfully.


    # Summary


    Streaming is a great way to ease the user into a large Flash movie. You can use
    ActionScript to track the process. As a movie streams, you can hold the movie
    on the first frame and let it continue until the entire movie has loaded.


    You can also report to the user the progress of the loading. You can give them
    straight feedback, or something a little more visual like a progress bar.


    You can also divide your movie into several files and use loadMovie to jump from
    file to file as the user needs the content.


    External files can be loaded into your movie using various methods. You can load
    Flash movies as movie clips. You can load external JPEG files and MP3 sounds to.


    # Q&A


    +   Q You can load movies into movie clips, but can you unload them too?


    +   A Yes. The unloadMovie command removes a loaded movie from a movie clip instance.


    +   Q I Can report the file size of a streaming movie to a user in K?


    +   A K is a kilobytes, which represents 1,024 bytes. So you can use getBytesTotal
    and getBytesLoaded to get the number of bytes and then divide that by 1,024 to
    determine the amount of K that will be loaded. A meg, or megabyte, is 1,024K,
    or 1,048,576 bytes.'
  merge: -1
  pgno: 339
