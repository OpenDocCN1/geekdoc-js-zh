  md: '# Q&A


    +   If I hide the cursor and the user moves the mouse outside the Flash movie,
    what happens?


    +   The cursor is only hidden when the mouse is over the movie. When the user
    moves away from it, the cursor reappears.


    +   How do I get an odd-shaped rollover area rather than a square or circular
    one?


    +   If you use buttons, the fourth frame of the button symbol defines the hit
    area of the button, which affects the when on (rollover) and on (rollout) handlers
    are called. If you use movie clips, you should set the last parameter of hitTest
    to true so that the function uses the exact shape of the movie clip.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
