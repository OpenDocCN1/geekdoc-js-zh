  md: '# Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. How much of a Flash movie normally needs to load before it starts?

    2. What are two ways to determine whether a movie is completely loaded?

    3. What file formats must you use for sounds and images to load them dynamically?

    4. Using getBytesTotal and getBytesLoaded, how do you determine the percentage
    of the movie loaded?


    # Quiz Answers


    +   1. Only the media for the first frame is needed for the first frame to be
    displayed and the movie to begin. You''ll need to stop the movie if you want to
    wait for more before continuing.

    2. One way is when the getBytesLoaded equals the getBytes function. Another method
    is to check the _frameLoaded property and compare it to the _totalFrames property.

    3. Sounds need to be MP3 files, and images need to be JPEG files. However, another
    way to do it is if you can load either if it is in an external movie file.

    4. If you divide getBytesTotal by getBytesLoaded, you will get a value from 0.0
    to 1.0. If you want to display a percentage, you need to multiply this number
    by 100. You may also want to use Math.round() to convert this to an integer instead
    of a long floating point number.'
