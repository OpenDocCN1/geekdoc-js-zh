    # HOUR 6


    # Controlling Movie Clips


    The primary element used by Flash animators and programmers alike is the movie
    clip. These Little Flash movies inside your main Flash movie allow you to modularize
    your program, grouping elements and establishing levels of interactivity. Much
    of ActionScript is concerned with controlling movie clips.


    In this hour, you will:


    +   - Learn how to tell movie clips what to do

    - Create an animation playback controller

    - Find out what it means to target a movie clip

    - See how to make a movie clip script

    - Make a movie clip that plays backwards


    # Telling Movie Clips What to Do


    Suppose that you have a movie that contains a simple animated movie clip. The
    main movie is simple: just one frame with a movie clip on. The clip itself is
    a long animation of some sort, but it is all self-contained inside the movie clip.
    It contains no ActionScript code at all.'
