    \ clip is a script triggered on the 15th frame. It tells the movie clip to move\
    \ forward one frame. The second movie clip does the same thing to a third movie\
    \ clip. The result is that the first movie clip animates one frame for every 15\
    \ frames that the first clip animates. The third movie clip animates one frame\
    \ for every 15 frames the second clip animates.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_103_0.png)"
