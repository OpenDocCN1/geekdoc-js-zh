  md: '# Position


    Every element in the Flash work area has a position. This position is measured
    pixels. The upper-left corner of the screen is at 0, 0. That is, it is horizontal
    position 0 and vertical position 0.


    If you use Flash''s default movie dimensions, the bottom-right corner will be
    at 550, 400. That is, horizontally 550 pixels from the left side and 400 pixels
    from the top.


    Every spot in the work area can be identified as a position. For instance, the
    exact center of the area is 225, 200. Figure 7.1 shows the work area with several
    spots labeled.


    # Figure 7.1


    The work area with several positions.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_110_0.png)


    Another name for the horizontal coordinate of a position is x. The vertical coordinate
    of a position is y. A position is then expressed in x, y coordinates.


    > In many programming languages, you need to use integers to express x and coordinates;
    not in Flash. You can use floating point numbers to precisely position movie clips.
    For instance, a movie clip might lie at 218.45, 143.9.'
  merge: -1
