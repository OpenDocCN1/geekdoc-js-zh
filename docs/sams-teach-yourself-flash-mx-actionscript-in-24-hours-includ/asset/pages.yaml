    # HOUR 8


    # # Selecting and Dragging Movie Clips


    The most basic actions in most modern computer programs use object selection and
    dragging to help the user express what he wants to do. If all you do is move files
    around on your desktop, you are doing a lot of selecting and dragging.


    It makes sense, then, to learn how to re-create this functionality in Flash movies.


    In this hour, you will:


    +   - Learn how to create selectable movie clips

    - See how to allow the user to drag movie clips around the screen

    - Use draggable movie clips to allow the user to make choices

    - Create a simple matching game'
