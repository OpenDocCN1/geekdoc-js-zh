  md: "Now that you know how to prepare your movie, let's look at the ActionScript\
    \ needed to print.\n\n# The Print Commands\n\nThere are two primary print commands.\
    \ They have slightly different uses but work basically the same.\n\n# Print\n\n\
    The first is simply print. This command takes two parameters. The first is the\
    \ target to be printed. Usually this is the main timeline, or _root. You can also\
    \ use this. However, if you want to print frames inside a movie clip, you can\
    \ use this to clip.\n\nThe second parameter is one of three options: bframe, bmovie,\
    \ or bmax. These relate to how Flash scales the frames printed.\n\nFlash scales\
    \ the printable material up to the size where it fills the page as much as possible\
    \ without distorting it. So if a frame is 550x400, it will most likely make the\
    \ 550 pixels of the frame fit across the page. The vertical dimension will remain\
    \ proportional.\n\nIf you use the bframe option, each frame scales to its own\
    \ size to fill the page. If one frame 550x400 and a second frame has content that\
    \ only fills 275x200, the second frame scales to twice the size of the first,\
    \ so that both fill their pages as much as possible.\n\nIf you use bmovie as the\
    \ second parameter, Flash examines all of the frame to be printed to determine\
    \ which is the largest. It then chooses the scaling of all pages based on one\
    \ page. This keeps each frame the same relative size. So if a 550x400 screen is\
    \ the largest, it fills the page. A 275x200 screen in the same movie fills half\
    \ the page.\n\nThe third option is bmax. In this case, you need to do a little\
    \ more work. You need to create a frame in your movie that has a box on it. This\
    \ box determines the maximum size to be printed. You must label this frame with\
    \ a #b label. Then Flash uses the size of this box to determine the scaling to\
    \ all frames printed. If there is something outside this area on a frame to be\
    \ printed, it should not appear on the printout.\n\nHere is an example of the\
    \ print command:\n\n```\non (release) {\n  print(this,\"bframe\");\n}\n```"
