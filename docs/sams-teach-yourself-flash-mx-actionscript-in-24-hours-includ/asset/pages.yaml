    # Radio Buttons


    Radio buttons are a little more complex than check boxes. All the radio buttons
    in a group are related.


    Whereas check boxes are used when the user needs to choose options that are not
    exclusive, radio buttons are used when options are exclusive. At any time, only
    one radio button in a group can be on. The rest of the group are off.


    15.2 shows a group of radio buttons. The first one is one, but the user is in
    the process of selecting the second one. When the selection is complete, the first
    radio button turns off automatically.


    FIGURE 15.2

    These four radio buttons are all part of one group, only one can be on a time.


    +   - Choice One

    - Choice Two

    - Choice Three

    - Choice Four


    The basic radio button is the same as a check box. There is an state and an off
    state represented by the two frames of the movie clip. Each frame contains its
    own button. The first button has an empty circle, whereas the second button has
    a circle with a dot inside.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_227_0.png)


