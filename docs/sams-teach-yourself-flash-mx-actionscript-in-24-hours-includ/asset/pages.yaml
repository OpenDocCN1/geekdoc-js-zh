  md: '# Getting Input From the User


    # Q&A


    +   Why, if I use a button or listener, can I hold down a key and listener will
    continue to react to the key press? I thought only the Key.isDown method could
    that.


    +   Buttons and listeners react to only one key press at a time. However, if you
    hold down a key on the keyboard, your operating system will automatically repeat
    that key press over and again. This is an old-fashioned typewriter repeat function.
    You can see it if you open a word processor and press and hold down “a.”. The
    “a” will type, followed by a delay, followed by a lot of “a’s” very quickly. You
    can adjust this or turn it off in the operating system controls. Most users will
    have it turned on by default, but you shouldn''t rely on it for functionality
    in your movie.


    +   What happens if an input text area allows the user to type many characters,
    but the size of the input text area is small?


    +   Give it a try. You''ll see that the text inside the input text area scrolls
    from side to side as the user types in it or uses the Backspace or arrow keys.
    This makes it easy for the user to type a lot of text in a small space.


    +   What sort of error checking can Flash to form input?


    +   Just about anything. For instance, if the user is supposed to enter an e-mail
    address, you can use indexOf to check for the presence of the “@” and “.” symbols.
    If they are not present, you know right away that the e-mail address is wrong.


    +   Is there any way to get a substring of a string count with a negative number
    as the first parameter?


    +   You can use myString.substr(-7,3) returns three characters starting seven
    characters from the end.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. Why is Key.isDown not a surefire way to detect whether a key is pressed?


    +   2. How does ActionScript get the value of an input text field?


    +   3. What is character number 7 of the string “ActionScript”?


    +   4. What is the result of (“ActionScript”).indexOf("c",3)?'
