  md: '# Controlling Sound with ActionScript


    You obviously need a stereo sound to use a sound transform normally. However,
    if you use Flash''s default compression settings, your stereo sound will be compressed
    into a mono sound when you test or publish the movie.


    Using sound transforms, you can switch channel comes out of which speaker. All
    you need to do is put 100 percent of left channel out of the right speaker and
    100 percent of the right channel out of the left speaker. Here is a button that
    does this:


    ```

    on (release) {

    var mySound = new Sound();

    mySound.attachSound(soundName);

    var mySoundTransform = new Object();

    mySoundTransform = {ll: 0, rr: 0, lr: 100, rl: 100};

    mySound.setTransform(mySoundTransform);

    mySound.start(0);

    }

    ```


    The example movie 22stereo.fla includes several demonstration buttons. It also
    includes a sound where the left and right plays completely separate sounds. The
    left channel features a robin singing away, whereas the right channel features
    a cardinal.


    > If you are using a sound transform with a mono sound, note that the entire sound
    is stored in the left channel. So only 11 and r1 properties will have any effect.


    You can use one of the three buttons to play the sound normally, with the pan
    set to either the left, middle, or right. The left and right buttons allow you
    to hear only one channel at a time.


    Then there are two buttons below that use sound transforms to play only one channel
    at time, but in the opposite speakers.


