  md: '# Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What is the difference between the _width property and the _scale property?

    2. If you set the _rotation property of a movie clip to 185, what will be the
    value of the _rotation property be?

    3. What is the difference between setting the _alpha property of a movie clip
    to 0 and setting the _visible property of a movie clip to false?

    4. If you set the _x and _y position of a movie clip to 0 and 0, will the movie
    clip be completely visible?


    # Quiz Answers


    +   1. The _width property is measured in pixels and starts as the exact number
    of pixels that the movie clip is wide. The _scale property is a percentage and
    starts at 100 percent.

    2. The _rotation property can be a value from -180 to 180. If you set it to 185,
    it will resolve itself around to -175.

    3. Nothing. They will both make the movie clip completely invisible.

    4. No. This will place the movie clip''s registration point at 0,0, which means
    that only the bottom-right quarter of the movie clip will be in the work area
    and visible in the player.'
