  md: '# Using XML with Flash


    # Q&A


    +   Can you use Flash to create and send XML documents?


    +   Sure. You can populate an XML object and then use send it to a server just
    like you would like with the LoadVars object.


    +   How do I know whether to use XML documents or lists of variables like what
    LoadVars expects?


    +   Use XML in cases where the data is already in XML format. You can also use
    it if you are building the system and feel like XML is needed. However, for small
    pieces of data, you would be able to stick with plain text files.


    +   Can I remove nodes from an XML object?


    +   Yes. There is a removenode command that will delete one. Read the XML section
    of the documentation for a complete list of commands and properties.


    +   Isn''t recursion supposed to be some difficult concept that only expert programmers
    understand?


    Although it is true that people have trouble understanding the idea of a recursive
    function, many non-programmers can see how it works. However, don''t be frustrated
    if you don''t get it. Many freshmen computer science students switch shortly after
    trying to learn recursion.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. How many nodes are shown in Figure 19.1?


    +   2. Name the nodes in the XML document <test>Hello World!</test>.


    +   3. What two steps need to be done to insert a new node into an XML document?


    +   4. How would you get to the text “Hello World” in the document <test>Hello
    World!</test>?


    # Quiz Answers


    +   1. Five. There are three elements and two text nodes for a total of five nodes.


    +   2. There is the test node and the text node containing “Hello World!.”'
