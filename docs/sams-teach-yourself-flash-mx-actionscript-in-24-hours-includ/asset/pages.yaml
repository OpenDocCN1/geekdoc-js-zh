  md: "# Detecting Key Presses Through Buttons\n\nStrangely enough, you can use buttons\
    \ to detect keyboard key presses. All you need to do is use a special handler\
    \ in the script attached to the button. For instance, here is a handler that looks\
    \ for the “a” key to be pressed:\n\n```\non (keyPressed \"a\") {\n  trace('Key\
    \ 'a' pressed.');\n}\n```\n\nThe example 09keyboard.fla has a simple button on\
    \ the screen and some other examples in it. If you run the movie and press “a”\
    \ on your keyboard, the message will go to the Output window. If it does not,\
    \ the test window probably doesn’t have focus. Click in the test window to give\
    \ it focus.\n\n![](img/9e6d716993ade8c40e3512ad7da0a693_144_0.png)\n\nBecause\
    \ the keyboard doesn't have a position on the screen like the mouse does, the\
    \ question often arises as to what on the screen the strokes routed to. In many\
    \ cases, such as Web browsers and other complex applications such as Flash, many\
    \ elements can accept keyboard input at any time.\nThe element that gets the keystrokes\
    \ is said to have keyboard focus. For instance, in a Web field, the field being\
    \ typed into has focus, whereas the other fields do not. When you are finished\
    \ with a field, you usually press Enter, Return, or Tab to move the focus to the\
    \ next field.\nWindows work the same way. Only one window will have keyboard focus.\
    \ In this case, we want to make sure that the movie testing window has focus so\
    \ the buttons in the movie get the keystrokes. To ensure focus, clicking on the\
    \ window or field usually does the trick.\n\nThe (keyPressed) handler is case\
    \ sensitive, so that detects “a” will not detect “A.” You’ll need to use a separate\
    \ on (keyPressed) handler for the capital “A.” Fortunately, button scripts can\
    \ contain as many as handlers as you want.\n\nIf you want to detect other keys,\
    \ such as the arrow keys, there are special codes for them. For instance, <Left>\
    \ can be used to detect the left arrow key.\n\n```\non (keyPressed \"<Left\")\
    \ {\n  trace('Left pressed.');\n}\n```\n\nHere is a list of other special codes:"
