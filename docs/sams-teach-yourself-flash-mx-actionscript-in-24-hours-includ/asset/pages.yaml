  md: '# Browser Navigation and Communication


    So what about the ActionScript side of things? If the HTML is that complex, surely
    the ActionScript should be complex as well.


    All you need is one line of code. The fcommand function passes two pieces of information
    along to the above JavaScript code. Here is an example:


    ```

    fcommand (''alert'', ''This is alert 1.'');

    ```


    That''s it. You can test this code with the HTML page 17ajosto.html. The Flash
    movie used is 17ajosto.js. Remember that this will not work in Internet Explorer
    for Mac, Netscape 6, or most older or lesser-known browsers.


    You can do it by passing strings along to JavaScript. As a matter of fact, although
    the example is a little basic, it demonstrates one of the primary uses for ActionScript
    JavaScript communication: the alert box. Flash can''t generate a simple alert
    on its own, but with JavaScript, you pop up little messages to the user.


    # Getting Messages from JavaScript


    Sending messages from the HTML page to your Flash movie is easier than the other
    way around. First, you need to make sure that you set an ID parameter for the
    OBJECT tag and a NAME parameter for the EMBED tag. Make them the same value. You
    will also need to set swLiveConnect to true in the EMBED tag.


    Now you have a host of commands that you can send to the Flash movie. For instance,
    you can use GotoFrame to tell the movie to go to a specific frame. Here is a button
    that tells the flash movie to go to frame 2.


    ```

    <FORM NAME="flashControlForm">

    <INPUT NAME="gotoFrame" TYPE=Button VALUE=Frame 1" onclick="window.document.flashmovie.GotoFrame(1);">\n</FORM>

    ```


    If this code is used to move the movie to frame 2, there is a letter i in the
    GotoFrame command? This is another case where the numbering is zero-based. Frame
    1 is 0, frame 2 is 1, and so on.


    There are 24 commands that you can use on a Flash movie. However, I don''t want
    to spend too much time on this because, as I mentioned at the start of this section,
    JavaScript communication doesn''t work on all browsers, so it is not considered
    by most developers to be of any use.


    You can use GetVariable and SetVariable to look and control variables on the main
    timeline. The Zoom command allows you to detect the scale of the movie. The isPlaying
    and percentLoaded functions allow you to detect what the movie is doing at the
    time. The simple Play command moves the movie forward from its stopped state.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_263_0.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'There is also a set of command that start with a Capital T. These are called
    targeted commands because they target a movie clip. The first parameter in these
    commands is the target. This parameter uses an out-of-date format from Flash 3
    and 4 to name movie clips. In this format, "/" is equivalent to _root and /movieClip
    is equivalent to _root.myMovieClip.


    An example of a targeted command is TgotoFrame, which tells a movie clip to go
    to a frame number. It would look like this:


    ```

    window.document.flashmovie.TgotoFrame("/myMovieClip", 1);

    ```


    You can use TgotoLabel to use a frame name rather than a number. The TgetProperty
    and TsetProperty commands seem simple enough, except that they can''t refer to
    a property by its real name. Instead, they have to use a number to refer to each
    property. _x is 0, _y is 1, visible is 7, and so.


    To find out about JavaScript communication, you will have to go to the Macromedia
    Web site. The documentation has only a small amount of information and does not
    list the commands or the property numbers. Perhaps this is why the doesn''t-work-on-browser
    issue.


    To get to the special section about this topic, go to http://www.macromedia.com/support/flash/
    and search on Flash Methods. You''ll eventually find the document that contains
    a lot of information about this subject.


    # Task: Open a New Window


    Perhaps the most common task that Flash developers develop from browser communication
    is the ability to open a new browser window. This is something that can be done
    with both the getURL command and JavaScript communication.


    However, JavaScript has one distinct advantage: You can specify the size and properties
    of the new window. Here''s how to do that:


    +   1. Create a new Flash movie.


    +   2. Place a button in the movie.


    +   3. Attach this script to the button:

    on (release) {

    fscommand("newwindow", "content.html");

    }


    +   4. In the Publish settings, choose to export an HTML page as well as a Flash
    movie. In the HTML page, choose Flash with FSCommand as your template.'
