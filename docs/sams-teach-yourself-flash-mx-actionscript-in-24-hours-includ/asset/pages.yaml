- img_proc: true
  md: "# Loading Browser Pages\n\nFlash movies are often used as a substitute for\
    \ HTML on Web sites. A Flash movie can be a front door to a Web site or a navigation\
    \ bar that appears throughout the Web site. Either way, there are times when the\
    \ movie will have to trigger the browser to load a new Web page.\n\n# Simple Loading\n\
    \nYou can easily replace the Web page that the Flash movie is on. All it takes\
    \ is a getURL command. Think of it as the equivalent to the <A HREF> tag in HTML.\
    \ Here is a button that replaces the current page with another one:\n\n```\non\
    \ (release) {\n  getURL(\"anotherpage.html\");\n}\n```\n\nYou can use a relative\
    \ URL, as in the preceding example, or a complete absolute URL to direct user\
    \ to another Web site.\n\nYou can also direct the user to another Web site by\
    \ using hypertext links in text fields. These work just like <A HREF> tags—they\
    \ are actually <A HREF> tags. They don't require any ActionScript code at all.\n\
    \n# Targeted Loading\n\nYou can use a second form of the getURL tag to target\
    \ a frame or window in the browser. If you never used frames or windows in your\
    \ HTML code, you probably don't need them. If you have used them, you know that\
    \ frames and windows have all names. You can refer to a named frame or window\
    \ by using a second parameter in the getURL command.\n\nSo if you are using frames\
    \ and have the movie in a frame named Navigation and the content in a frame Main,\
    \ you could tell the frame Main to load the page summary.html with this block\
    \ like:\n\n```\non (release) {\n  getURL(\"summary.html\", \"Main\");\n}\n```\n\
    \nYou could do to target a window if it was named Main.\n\nThere are all special\
    \ targets that tell the browser to do special things. Here is a list:\n\n+   _blank—Creates\
    \ a new window and loads the page there. The default window settings for a new\
    \ window in the browser are used.\n_parent—Loads the page in the parent frame\
    \ of the current frame."
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Browser Navigation and Communication


    +   * _top—Loads the page in the current window, regardless of whether the movie
    is in a frame in the current window. It replaces the entire window contents—all
    frames.

    * _self—Essentially the default behavior, with the contents of the current frame
    or window being replaced.


    If you want to create a new browser window that is not the default size and settings?
    You''ll need to use JavaScript to do that. I''ll explain this later in hour.


    # Task: Navigation Bar


    Now you know all ActionScript you need to make a Flash movie navigation bar. However
    you''ll also need to be familiar with HTML, at least to the point of knowing how
    to make frames.


    Our navigation bar runs in a frame to the left side of the browser window. The
    right side of the browser window is another frame that contains the content.


    The Flash movie consists of various buttons that getURL to load a new HTML page
    in the other frame.


    +   1. First, we''ll need to create an HTML page with frames. Here is the code
    of the main HTML page, which defines the two frames:

    ```html

    <HEAD>

    <TITLE>Flash Navigation Example</TITLE>

    </HEAD>

    <BODY BCOLOR="#FFFFFF">

    <FRAMES cols="120,\**">

    <FRAME name="navigation" src="navbar.html" scrolling="no">

    <FRAME name="content" src="content1.html" scrolling="auto">

    </FRAMES>


    </BODY>

    </HTML>

    ```

    2. Now, we need to create the HTML pages for the two frames. We won''t worry about
    the left frame now because that will be taken from the HTML page created when
    we publish the Flash movie. The right frame, however, should have several variations.

    Let''s create three simple HTML pages named content1.html, content2.html, and
    content3.html. They will all look basically like this, except that the text inside
    which page is:

    ```html

    <HEAD>

    <TITLE>Content 1</TITLE>

    ```


    ![](img/9e6d716993ade8c40e3512ad7da0a693_259_0.png)'
