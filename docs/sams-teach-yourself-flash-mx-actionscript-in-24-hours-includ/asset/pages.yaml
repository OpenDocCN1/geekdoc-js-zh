  md: '# Pull-Down Menus and Dynamic Buttons


    One way to make pull-down menus is to use a movie clip where the first frame represents
    the collapsed menu, and the second frame represents the expanded menu.


    You can also create buttons on-the-fly by using the attachMovie and removeMovieClip
    commands. This enables you to create a whole system of buttons by only modifying
    ActionScript code.


    # Q&A


    +   - What about submenus? Can a button in a pull-down menu then bring another
    pull-down menu?


    +   - Yes You often see this in programs nowadays. You can simply place another
    movie clip inside your main pull-down movie clip. The new buttons will probably
    need to be shifted to the right to avoid covering the buttons of the pull-down
    menu. You can go many levels deep this way.


    +   - Can you have the pull-down menus slide?


    +   - Yes Instead of having two frames, you can use gotoPlay and have a series
    of movements over several frames and a stop() command at the end. You might want
    to use a mask layer to hide the buttons as they slide under the title. Or, you
    could have them dissolve slowly.


    +   - Do pull-down menus always have to pull down?


    +   - No. The buttons on a pull-down menu can actually expand up, to the side,
    or in any direction. By some scripts require that the buttons all touch so that
    the user can move the cursor from one to the other without ever leaving the movie
    clip.


    # Workshop


    The quiz questions are designed to test your knowledge of the material covered
    in this hour. The answers to the questions follow.


    # Quiz


    +   1. What element must be present on the Stage to create dynamic buttons?


    +   2. How do you ensure a pull-down menu will be on top of all other elements
    on the screen?


    +   3. How does the dragOver event differ from rollOver?


    +   4. How many names does a movie clip instance have?'
  merge: -1
  pgno: 253
- img_proc: true
