- img_proc: true
  md: '# FIGURE 11.1


    This diagram shows a circle of radius 1 and several reference points on its circumference.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_172_0.png)


    Imagine the circle as a line. It starts at point 1,0, labeled with an “a” in Figure
    11.1. The line curves along to 0,-1, then to -1,0, then to 0,1, and finally back
    to 1,0. It is a long curved line.


    In Flash, and just any other computer program, we position things according to
    x and y coordinates. So being able to convert a point on the circle into x and
    y coordinates can be useful.


    This is what sine and cosine do. If you consider point “a” to be the beginning
    of the circle’s line, you can plug 0 into cosine and sine functions to get the
    x and y coordinates of point “a.” Sure enough, Math.cos(0) returns 1, and Math.sin(0)
    returns 0. That corresponds to the 1,0 location of point “a.”


    So where around the circumference of a circle is point “c?” Well, the line around
    a circle turns out to be its radius. Since its radius is 1, the line should be
    6.28. This is where the magic number pi comes from. Pi is 3.14, which is half
    the distance around a circle.


    So if 6.28 is the total distance around the circle, 1.57 should be a quarter of
    the total distance. That should correspond to point “c,” which is a quarter of
    the wave around the circle. Math.cos(1.57) is a very small number, pretty close
    to 0. Math.sin(1.57) is a number very close to -1. The reason they are close,
    but not right, is because pi is not exactly 3.14—it is just a close approximation.


    So if point “a” is point 0 along the circle, and point “c” is 1.57 along the circle,
    then point “b” looks like it is about .785 along the circle, or halfway between
    points “a” and “c.” So what is this in terms of x and y coordinates? Just .785
    into Math.cos and Math.sin to get the answer. The result is .71,-71, so it is
    .71 over the right of center, and .71 down from center.'
