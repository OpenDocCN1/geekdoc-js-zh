  md: '# Controlling the Flow of the Movie


    This completes the presentation movie. Test the movie to make sure that it works.
    Look over all the scripts again to make sure that you understand each one is doing.


    A movie like this can be used for many things. For one, it can be the entire contents
    of a Web site. The main menu can link to frames that explain a company''s mission,
    services, and contacts. Or, it could be a personal home page with frames about
    the owner''s history, interests, and other bits of information.


    The important thing to realize that Flash is no longer just an animation tool
    to. You now control the movement of the Flash movie and can make it do other things
    besides a plain linear animation.


    # Summary


    You can use many commands to control the flow of a Flash movie. Here is a list:


    +   - stop Pauses the current timeline frame.

    - play Continues the flow of a movie after a stop command.

    - gotoAndStop Jumps to a frame or number and pauses the movie there.

    - gotoAndPlay Jumps to a frame name or number and lets the movie continue mating
    from frame.

    - nextFrame Moves the movie to the next frame and stops it there.

    - prevFrame Takes the movie back one frame and stops it there.


    The stop command is usually placed in a frame script to pause the movie and let
    the user take control of what happens next. The other movie control commands are
    usually placed in on (release) button handlers.


    # Q&A


    +   - If you use the stop command and the movie stops, why do movie clips still
    animate and buttons still work?

    - The stop command affects only the flow of the main timeline. Symbols on the
    screen, as movie clips and buttons, still respond at a normal rate.

    - The nextFrame command goes to the next frame and then stops there. What if I
    want to go to the next frame and have the movie continue at its normal animation
    pace?

    - You can use the nextFrame command to go to the next frame and then immediately
    follow it with a play command.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_95_0.png)'
