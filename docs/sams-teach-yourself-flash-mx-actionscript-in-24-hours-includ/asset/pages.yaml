  md: 'Can I perform an operation between two numbers, if one is an integer and the
    other float?


    Yes. Flash allows you to mix integers and floats in calculations. The result will
    be a float.


    If I compare two strings, will upper- and lowercase make a difference?


    Yes. Flash considers uppercase letters to come before lowercase letters. This
    is true in some programming languages.


    What if I create a loop that never ends? What happens?


    This is called an infinite loop. It is a bug of the worst kind. Flash will detect
    that the program is taking an abnormally long time to run and ask whether you
    want to stop the program. It is up to you to fix the problem with the loop.


