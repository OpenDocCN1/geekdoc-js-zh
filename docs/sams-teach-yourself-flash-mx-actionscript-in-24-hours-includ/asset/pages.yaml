  md: '# HOUR 7


    # Moving and Changing Movie Clips


    Movie clip instances have properties that you can examine and change. By using
    these properties, you can change the screen location of a clip, rotate it, scale
    it, and even hide it.


    In this hour, you will:


    +   - Learn how to change the position of a movie clip

    - Find out how to determine the cursor location

    - Learn how to rotate a movie clip

    - Learn how to scale a movie clip

    - See how a movie clip can be made invisible


    ![](img/9e6d716993ade8c40e3512ad7da0a693_109_0.png)'
