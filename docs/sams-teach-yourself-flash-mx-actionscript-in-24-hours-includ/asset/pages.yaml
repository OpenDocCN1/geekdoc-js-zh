    ```

    myMovieClip.setStyle(0,0x000000,100)

    myMovieClip.moveTo(100,100)

    myMovieClip.lineTo(200,200);

    ```


    You can also use them as _root.parent, and this to define where the line gets

    drawn. You need to set the lineStyle in that movie clip first. You can also place
    your

    code on a movie clip, or in a frame inside that movie clip. This prefix or just
    using

    the commands by them then refers to that movie clip.


    Flash MX also lets you create movie clips to store your drawings. You can blank

    with the createEmptyMovieClip command. It takes two parameters: the name of the
    new

    movie clip and its level. Both should be unique. For instance, to create an empty
    movie

    clip and then draw a line in it, you can do something like this:


    ```

    this.createEmptyMovieClip("movieClip",1)

    myMovieClip.setStyle(0,0x000000,100)

    myMovieClip.moveTo(100,100)

    myMovieClip.lineTo(200,200);

    ```


    You can now move movie clip around changing its _x and _y properties. You can

    rotate it, scale, change its alpha, and do anything that you would normally do
    with

    movie clip. The drawing follows it as if it were created while you were

    authoring the movie in Flash.


    > The createEmptyMovieClip command can be used for much more than just

    drawing. You can use attachMovie or duplicateMovieClip to add other ele-

    ments inside the new movie clip. Later in this hour, you will see how to cre-

    ate new text fields—these can also be added to the new movie clip.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_349_0.png)'
