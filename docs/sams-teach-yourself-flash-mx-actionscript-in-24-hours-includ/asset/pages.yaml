  md: '# Random Numbers


    Random numbers are a crucial part of games and some animations. Without them,
    the movie would play out exactly in the same fashion every time.


    To make a random number, all you need to do is use the Math.random function. This
    returns a number between 0.0 and 1.0, but never exactly 1.0.


    So, if you try this out, you will get a random number sent to the Output window:


    ```

    trace(Math.random());

    ```


    The number might look something like 0.02326805612097, but it will be different
    each time you run the movie.


    A common task might be to produce a random number between 1 and 10. To do this,
    simply multiply the range and add the starting point. For instance, range of 1
    to 10 is 10. This gives you a number between 0.0 and 10.0:


    ```

    trace(Math.random()*10);

    ```


    Because you want a number between 1 and 10, not 0 and 10, just add 1:


    ```

    trace(Math.floor(Math.random()*10+1));

    ```


    Now the range of values will be from 1.0 to 11.0, but never 11.0. So use the Math.floor
    function to round it down:


    > Random numbers in computers are not really random. There are no dice to roll
    inside the microprocessor. Instead, a seed number, which could be anything, such
    as the time of day, is fed into a complex mathematical formula. This formula is
    so complex, that it is difficult to predict the outcome, so the results look random.
    The result is then fed back into the function as the seed number of the next time
    a random number is needed

    If you think about it, random numbers in the physical world are not random either.
    If you throw the dice exactly the same way and throw them exactly the same way
    each time, you should get the same results. You''ll have to take into account
    all of things such as wind and slight tremors in the Earth, but it is possible
    to re-create the same throw over and over again.

    There is also called the law of averages. If you toss a coin 100 times, chances
    are that about 50 of them will be heads, and 50 will be tails. However, if you
    toss a coin nine times in a row, and gets heads every time, what are the chances
    that the next one will be tails? Although it seems the next would be more likely
    to be tails, so that things will start to even out, that is not the case. It is
    still a 50/50 chance on the next throw.


    ![](img/9e6d716993ade8c40e3512ad7da0a693_175_0.png)'
