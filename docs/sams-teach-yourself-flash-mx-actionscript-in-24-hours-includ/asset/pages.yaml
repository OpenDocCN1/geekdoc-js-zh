- img_proc: true
  md: '# Selection


    You have already learned how to make buttons that allow the user to click and
    make an action occur. A different type of user interface element, however, allows
    the user to select an item on the screen.


    The difference is that a user clicks to make a selection, and movie clip changes
    its appearance. But nothing else happens. This way, the user can make or change
    his selections. After that, the user can click another button or perform another
    action.


    We''ll use selections as the first step toward learning how to drag and drop movie
    clips, the goal of this is.


    # Button Inside the Movie Clip Method


    A movie clip cannot simply react to a movie click. Unlike a button, it cannot
    use an on (release) or on (press) handler.


    So you have to be tricky. You put a button inside a movie clip. To make this into
    a button-the button can handle the movie clicks as long as it is big enough to
    cover the entire movie.


    The example 08buttoninmc.fla illustrates this. When you look at the movie, you
    will see that it has a single movie clip on the screen. That movie clip is a single
    button.


    To turn this into a selectable movie clip, we''ll have to make this into a multiframe
    clip. The first frame contains the button named Off Button. This button has the
    following script:


    ```

    on (release) {

    this.gotoStop(2);

    }

    ```


    By referring to this, the button is referencing the movie clip that it is in.
    Frame 2 of the movie clip contains a similar button named On Button. The difference
    is that the On Button is a little brighter, indicating that the movie clip has
    been selected. The script on this movie clip is similar:


    ```

    on (release) {

    this.gotoStop(1);

    }

    ```


    As you might, by clicking the button on frame 2, the movie clip goes to frame
    1, where the original Off Button is located. By clicking the buttons in the movie
    clip over and again, the movie clip goes back and forth between 1 and 2.


    The only thing left is to place a stop(); command on the first frame of the movie
    clip. You can go to the example 07buttoninmc.fla to try this out.'
