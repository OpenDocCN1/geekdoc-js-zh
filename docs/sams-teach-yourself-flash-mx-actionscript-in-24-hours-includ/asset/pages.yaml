  md: '# Getting Input From the User


    ```

    var myString = ''Hello World.'';

    trace(myString.substring(3,7));

    ```


    The result would be “lo W.” But the numbers in the function need some explaining.
    The function got to the seventh characters, but why was the function fed a 3 and
    a 7 instead of 4 and a 7?


    Unfortunately, the explanation is a little confusing. First, remember that in
    ActionScript, counting usually starts at 0. So the first character of the string
    is 0. That means the fourth character is 3. So that explains the 3. But if the
    first parameter is 3, wouldn’t the second parameter be 6? No, the second parameter
    is actually the number of character to stop before. So if you want to stop character
    6, you need to use a 7.


    Therefore to get the fourth through seventh characters, we use a 3 and a 7. Just
    remember subtract 1 at all times when picking character parameter, but the second
    parameter of substring needs to have 1 added to it.


    There is actually another way to get parts of strings. I think you will like this
    one. The substr has a similar name but works differently. Its two parameters are
    the start character and the length of the substring. So you can get four characters,
    starting at character 3, with this:


    ```

    var myString = ''Hello World.'';

    trace(myString.substr(3,4));

    ```


    The result is the same as the previous example—“lo W.”


    One more command that you know is charAt. You can use this to get a single character
    from the string. For instance, gets character 6, the “W,” from the string.


    ```

    var myString = ''Hello World.'';

    trace(myString.charAt(6));

    ```


    # String Functions


    There are a few string functions that you might want to have in your arsenal of
    ActionScript functions. You can use indexOf to find the position of a string inside
    another string. For instance, to find the “W” you could do this:


    ```

    var myString = ''Hello World.'';

    trace(myString.indexOf(''W'',0));

    ```


    This returns 6, because “W” is the sixth character. You can also find strings
    longer than one character.


    ```

    var myString = ''Hello World.'';

    trace(myString.indexOf(''Hello'',0));

    ```'
