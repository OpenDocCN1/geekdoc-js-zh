  md: "# 6. XMLHTTPREQUEST\n\nThe XMLHttpRequest object is the key to AJAX. It has\
    \ been available ever since Internet Explorer 5.5 was released in July 2000, but\
    \ was not fully discovered until AJAX and Web 2.0 in 2005 became popular.\n\n\
    XMLHttpRequest (XHR) is an API that can be used by JavaScript, JScript, VBScript,\
    \ and other web browser scripting languages to transfer and manipulate XML data\
    \ to and from a webserver using HTTP, establishing an independent connection channel\
    \ between a webpage's Client-Side and Server-Side.\n\nThe data returned from XMLHttpRequest\
    \ calls will often be provided by back-end databases. Besides XML, XMLHttpRequest\
    \ can be used to fetch data in other formats, e.g. JSON or even plain text.\n\n\
    You already have seen a couple of examples on how to create an XMLHttpRequest\
    \ object.\n\nListed below are some of the methods and properties that you have\
    \ to get familiar with.\n\n# XMLHttpRequest Methods\n\n+   - **abort()**\n  Cancels\
    \ the current request.\n- **getAllResponseHeaders()**\n  Returns the complete\
    \ set of HTTP headers as a string.\n- **getResponseHeader( headerName )**\n  Returns\
    \ the value of the specified HTTP header.\n- **open( method, URL )**\n- **open(\
    \ method, URL, async )**\n- **open( method, URL, async, userName )**\n- **open(\
    \ method, URL, async, userName, password )**\n  Specifies the method, URL, and\
    \ other optional attributes of a request."
  merge: -1
  pgno: 16
- img_proc: true
  md: "The method parameter can have a value of \"GET\", \"POST\", or \"HEAD\". Other\
    \ HTTP methods such as \"PUT\" and \"DELETE\" (primarily used in REST applications)\
    \ may be possible.\nThe \"async\" parameter specifies whether the request should\
    \ be handled asynchronously or not. \"true\" means that the script processing\
    \ carries on after the send() method without waiting for a response, and \"false\"\
    \ means that the script waits for a response before continuing script processing.\n\
    \n+   * **send( content )**\n    Sends the request.\n* **setRequestHeader( label,\
    \ value )**\n    Adds a label/value pair to the HTTP header to be sent.\n\n# XMLHttpRequest\
    \ Properties\n\n+   * **onreadystatechange**\n    An event handler for an event\
    \ that fires at every state change.\n* **readyState**\n    The readyState property\
    \ defines the current state of the XMLHttpRequest object.\n\nThe following table\
    \ provides a list of the possible values for the readyState property:\n\n| State\
    \ | Description |\n| :---: | :--- |\n| 0 | The request is not initialized. |\n\
    | 1 | The request has been set up. |\n| 2 | The request has been sent. |\n| 3\
    \ | The request is in process. |\n| 4 | The request is completed. |\n\n**readyState\
    \ = 0** – After you have created the XMLHttpRequest object, but before you have\
    \ called the open() method."
  merge: -1
  pgno: 17
- img_proc: true
  md: "**readyState = 1** After you have called the open() method, but before you\
    \ have called send().\n\n**readyState = 2** After you have called send().\n\n\
    **readyState = 3** After the browser has established a communication with the\
    \ server, but before the server has completed the response.\n\n**readyState =\
    \ 4** After the request has been completed, and the response data has been completely\
    \ received from the server.\n\n+   - **responseText**\n  Returns the response\
    \ as a string.\n\n+   - **responseXML**\n  Returns the response as XML. This property\
    \ returns an XML document object, which can be examined and parsed using the W3C\
    \ DOM node tree methods and properties.\n\n+   - **status**\n  Returns the status\
    \ as a number (e.g., 404 for \"Not Found\" and 200 for \"OK\").\n\n+   - **statusText**\n\
    \  Returns the status as a string (e.g., \"Not Found\" or \"OK\")."
  merge: -1
