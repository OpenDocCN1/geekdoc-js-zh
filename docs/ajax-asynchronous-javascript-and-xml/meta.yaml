- md: " ## AJAX\n\nasynchronous javascript and xml\n\ntutorialspoint\n\nSIMPLY EASY\
    \ LEARNING\n\n## About the Tutorials\n\nAJAX is a web development technique for\
    \ creating interactive web applications. If you know JavaScript, HTML, CSS, and\
    \ XML, then you need to spend just one hour to start with AJAX.\n\n## Audience\n\
    \nThis tutorial will be useful for web developers who want to learn how to create\
    \ interactive webpages as well as improve their speed and usability using AJAX.\n\
    \n## Prerequisites\n\nIt is highly recommended that you are familiar with HTML\
    \ and JavaScript before attempting this tutorial.\n\n## Copyright & Disclaimer\n\
    \n© Copyright 2015 by Tutorials Point (I) Pvt. Ltd.\n\nAll the content and graphics\
    \ published in this e-book are the property of Tutorials Point (I) Pvt. Ltd. The\
    \ user of this e-book is prohibited to reuse, retain, copy, distribute or republish\
    \ any contents or a part of contents of this e-book in any manner without written\
    \ consent of the publisher.\n\nWe strive to update the contents of our website\
    \ and tutorials as timely and as precisely as possible, however, the contents\
    \ may contain inaccuracies or errors. Tutorials Point (I) Pvt. Ltd. provides no\
    \ guarantee regarding the accuracy, timeliness or completeness of our website\
    \ or its contents including this tutorial.\n\nIf you discover any errors on our\
    \ website or in this tutorial, please notify us at [contact@tutorialspoint.com](mailto:contact@tutorialspoint.com)\n\
    \n## Table of Contents\n\n- About the Tutorial ...\n- Audience ...\n- Prerequisites\
    \ ...\n- Copyright & Disclaimer ...\n- Table of Contents ...\n\n1. OVERVIEW ...\n\
    \   - Rich Internet Application Technology ...\n   - AJAX is Based on Open Standards\
    \ ...\n\n2. TECHNOLOGIES USED IN AJAX ...\n   - JavaScript ...\n   - DOM ...\n\
    \   - CSS ...\n   - XMLHttpRequest ...\n\n3. EXAMPLES ...\n   - Google Maps ...\n\
    \   - Google Suggest ...\n   - Gmail ...\n   - Yahoo Maps (new) ...\n   - Difference\
    \ between AJAX and Conventional CGI Program ...\n\n4. BROWSER SUPPORT ...\n  \
    \ - Writing Browser Specific Code ...\n\n5. AJAX IN ACTION ...\n   - Steps of\
    \ AJAX Operation ...\n   - A Client Event Occurs ...\n   - The XMLHttpRequest\
    \ Object is Created ...\n   - The XMLHttpRequest Object is Configured ...\n  \
    \ - Making Asynchronous Request to the Webserver ...\n   - Webserver Returns the\
    \ Result Containing XML Document ...\n   - Callback Function processRequest()\
    \ is Called ...\n   - The HTML DOM is Updated ...\n\n6. XMLHTTPREQUEST ...\n \
    \  - XMLHttpRequest Methods ...\n   - XMLHttpRequest Properties ...\n\n7. DATABASE\
    \ OPERATIONS ...\n   - Client Side HTML File ...\n   - Server Side PHP File ...\n\
    \n8. SECURITY ...\n   - AJAX Security: Server Side ...\n   - AJAX Security: Client\
    \ Side ...\n\n9. CURRENT ISSUES ...\n\n## 1. OVERVIEW\n\nAJAX stands for **Asynchronous\
    \ JavaScript and XML**. AJAX is a new technique for creating better, faster, and\
    \ more interactive web applications with the help of XML, HTML, CSS, and JavaScript.\n\
    \n- Ajax uses XHTML for content, CSS for presentation, along with Document Object\
    \ Model and JavaScript for dynamic content display.\n- Conventional web applications\
    \ transmit information to and from the server using synchronous requests. It means\
    \ you fill out a form, hit submit, and get directed to a new page with new information\
    \ from the server.\n- With AJAX, when you hit submit, JavaScript will make a request\
    \ to the server, interpret the results, and update the current screen. In the\
    \ purest sense, the user would never know that anything was even transmitted to\
    \ the server.\n- XML is commonly used as the format for receiving server data,\
    \ although any format, including plain text, can be used.\n- AJAX is a web browser\
    \ technology independent of web server software.\n- A user can continue to use\
    \ the application while the client program requests information from the server\
    \ in the background.\n- Intuitive and natural user interaction. Clicking is not\
    \ required, mouse movement is a sufficient event trigger.\n- Data-driven as opposed\
    \ to page-driven.\n- Behind-the-scenes data fetches using XMLHttpRequest objects\
    \ in the browser.\n- JavaScript to make everything happen.\n\n## Rich Internet\
    \ Application Technology\n\nAJAX is the most viable Rich Internet Application\
    \ (RIA) technology so far. It is getting tremendous industry momentum and several\
    \ tool kit and frameworks are emerging. But at the same time, AJAX has browser\
    \ incompatibility and it is supported by JavaScript, which is hard to maintain\
    \ and debug.\n\n## AJAX is Based on Open Standards\n\nAJAX is based on the following\
    \ open standards:\n\n- Browser-based presentation using HTML and Cascading Style\
    \ Sheets (CSS).\n- Data is stored in XML format and fetched from the server.\n\
    \n## 2. TECHNOLOGIES USED IN AJAX\n\nAJAX cannot work independently. It is used\
    \ in combination with other technologies to create interactive webpages.\n\n###\
    \ JavaScript\n\n- Loosely typed scripting language.\n- JavaScript function is\
    \ called when an event occurs in a page.\n- Glue for the whole AJAX operation.\n\
    \n### DOM\n\n- API for accessing and manipulating structured documents.\n- Represents\
    \ the structure of XML and HTML documents.\n\n### CSS\n\n- Allows for a clear\
    \ separation of the presentation style from the content and may be changed programmatically\
    \ by JavaScript.\n\n### XMLHttpRequest\n\n- JavaScript object that performs asynchronous\
    \ interaction with the server.\n\n## 3. EXAMPLES\n\nHere is a list of some famous\
    \ web applications that make use of AJAX.\n\n### Google Maps\n\nA user can drag\
    \ an entire map by using the mouse, rather than clicking on a button.\n\n- http://maps.google.com/\n\
    \n### Google Suggest\n\nAs you type, Google offers suggestions. Use the arrow\
    \ keys to navigate the results.\n\n- http://www.google.com/webhp?complete=1&hl=en\n\
    \n### Gmail\n\nGmail is a webmail built on the idea that emails can be more intuitive,\
    \ efficient, and useful.\n\n- http://gmail.com/\n\n### Yahoo Maps (new)\n\nNow\
    \ it's even easier and more fun to get where you're going!\n\n- http://maps.yahoo.com/\n\
    \n### Difference between AJAX and Conventional CGI Program\n\nTry these two examples\
    \ one by one and you will feel the difference. While trying AJAX example, there\
    \ is no discontinuity and you get the response very quickly, but when you try\
    \ the standard CGI example, you would have to wait for the response and your page\
    \ also gets refreshed.\n\n#### AJAX Example:"
  mdcn: "\n ## AJAX\n\n异步 JavaScript 和 XML\n\ntutorialspoint\n\n轻松学习\n\n## 关于本教程\n\
    \nAJAX 是一种用于创建交互式 Web 应用程序的 Web 开发技术。如果你了解 JavaScript、HTML、CSS 和 XML，那么你只需要花一个小时就能上手\
    \ AJAX。\n\n## 受众\n\n本教程对希望学习如何创建交互式网页，以及希望使用 AJAX 提高网页速度和可用性的 Web 开发者有所帮助。\n\n\
    ## 先决条件\n\n强烈建议你在学习本教程之前熟悉 HTML 和 JavaScript。\n\n## 版权与免责声明\n\n© 2015 版权所有 Tutorials\
    \ Point (I) Pvt. Ltd.\n\n本电子书中发布的所有内容和图形均为 Tutorials Point (I) Pvt. Ltd. 的财产。未经出版商书面同意，本电子书用户不得以任何方式重复使用、保留、复制、分发或再版本电子书的全部或部分内容。\n\
    \n我们努力及时、准确地更新网站和教程的内容，但内容可能包含不准确或错误之处。Tutorials Point (I) Pvt. Ltd. 不保证我们的网站或其内容（包括本教程）的准确性、时效性或完整性。\n\
    \n如果你在我们的网站或本教程中发现任何错误，请通过 [contact@tutorialspoint.com](mailto:contact@tutorialspoint.com)\
    \ 通知我们。\n\n## 目录\n\n- 关于本教程 ...\n- 受众 ...\n- 先决条件 ...\n- 版权与免责声明 ...\n- 目录 ...\n\
    \n1. 概述 ...\n   - 富互联网应用技术 ...\n   - AJAX 基于开放标准 ...\n\n2. AJAX 中使用的技术 ...\n \
    \  - JavaScript ...\n   - DOM ...\n   - CSS ...\n   - XMLHttpRequest ...\n\n3.\
    \ 示例 ...\n   - Google 地图 ...\n   - Google 建议 ...\n   - Gmail ...\n   - Yahoo 地图（新版）...\n\
    \   - AJAX 与传统 CGI 程序的区别 ...\n\n4. 浏览器支持 ...\n   - 编写浏览器特定代码 ...\n\n5. AJAX 实战\
    \ ...\n   - AJAX 操作步骤 ...\n   - 客户端事件发生 ...\n   - 创建 XMLHttpRequest 对象 ...\n \
    \  - 配置 XMLHttpRequest 对象 ...\n   - 向 Web 服务器发出异步请求 ...\n   - Web 服务器返回包含 XML\
    \ 文档的结果 ...\n   - 调用回调函数 processRequest() ...\n   - 更新 HTML DOM ...\n\n6. XMLHTTPREQUEST\
    \ ...\n   - XMLHttpRequest 方法 ...\n   - XMLHttpRequest 属性 ...\n\n7. 数据库操作 ...\n\
    \   - 客户端 HTML 文件 ...\n   - 服务器端 PHP 文件 ...\n\n8. 安全性 ...\n   - AJAX 安全性：服务器端\
    \ ...\n   - AJAX 安全性：客户端 ...\n\n9. 当前问题 ...\n\n## 1. 概述\n\nAJAX 代表**异步 JavaScript\
    \ 和 XML**。AJAX 是一种借助 XML、HTML、CSS 和 JavaScript 创建更好、更快、更具交互性的 Web 应用程序的新技术。\n\n\
    - Ajax 使用 XHTML 作为内容，CSS 作为展示样式，同时使用文档对象模型和 JavaScript 进行动态内容显示。\n- 传统的 Web 应用程序使用同步请求与服务器之间传输信息。这意味着你填写表单，点击提交，然后被定向到一个包含服务器新信息的新页面。\n\
    - 使用 AJAX 时，当你点击提交，JavaScript 会向服务器发出请求，解释结果，并更新当前屏幕。从最纯粹的意义上说，用户永远不会知道有任何信息被传输到了服务器。\n\
    - XML 通常用作接收服务器数据的格式，尽管可以使用任何格式，包括纯文本。\n- AJAX 是一种独立于 Web 服务器软件的 Web 浏览器技术。\n\
    - 客户端程序在后台向服务器请求信息时，用户可以继续使用应用程序。\n- 直观自然的用户交互。不需要点击，鼠标移动就足以触发事件。\n- 数据驱动而非页面驱动。\n\
    - 在后台使用浏览器的 XMLHttpRequest 对象获取数据。\n- JavaScript 使一切得以实现。\n\n## 富互联网应用技术\n\nAJAX\
    \ 是目前最可行的富互联网应用（RIA）技术。它正获得巨大的行业动力，多个工具包和框架正在涌现。但与此同时，AJAX 存在浏览器不兼容问题，并且它由 JavaScript\
    \ 支持，而 JavaScript 难以维护和调试。\n\n## AJAX 基于开放标准\n\nAJAX 基于以下开放标准：\n\n- 使用 HTML 和层叠样式表（CSS）进行基于浏览器的展示。\n\
    - 数据以 XML 格式存储并从服务器获取。\n\n## 2. AJAX 中使用的技术\n\nAJAX 无法独立工作。它与其他技术结合使用以创建交互式网页。\n\
    \n### JavaScript\n\n- 松散类型的脚本语言。\n- 当页面中发生事件时，会调用 JavaScript 函数。\n- 整个 AJAX 操作的粘合剂。\n\
    \n### DOM\n\n- 用于访问和操作结构化文档的 API。\n- 表示 XML 和 HTML 文档的结构。\n\n### CSS\n\n- 允许将展示样式与内容清晰分离，并且可以通过\
    \ JavaScript 以编程方式更改。\n\n### XMLHttpRequest\n\n- 执行与服务器异步交互的 JavaScript 对象。\n\n\
    ## 3. 示例\n\n以下是一些使用 AJAX 的著名 Web 应用程序列表。\n\n### Google 地图\n\n用户可以使用鼠标拖动整个地图，而不是点击按钮。\n\
    \n- http://maps.google.com/\n\n### Google 建议\n\n当你输入时，Google 会提供建议。使用箭头键浏览结果。\n\
    \n- http://www.google.com/webhp?complete=1&hl=en\n\n### Gmail\n\nGmail 是一款基于电子邮件可以更直观、更高效、更有用这一理念构建的网络邮件。\n\
    \n- http://gmail.com/\n\n### Yahoo 地图（新版）\n\n现在前往目的地变得更容易、更有趣了！\n\n- http://maps.yahoo.com/\n\
    \n### AJAX 与传统 CGI 程序的区别\n\n依次尝试这两个示例，你会感受到差异。在尝试 AJAX 示例时，没有中断，你会很快得到响应，但当你尝试标准\
    \ CGI 示例时，你必须等待响应，而且你的页面也会刷新。\n\n#### AJAX 示例：\n"
