  md: '# # 4. BROWSER SUPPORT


    All the available browsers cannot support AJAX. Here is a list of major browsers
    that support AJAX.


    +   - Mozilla Firefox 1.0 and above.


    +   - Netscape version 7.1 and above.


    +   - Apple Safari 1.2 and above.


    +   - Microsoft Internet Explorer 5 and above.


    +   - Konqueror.


    +   - Opera 7.6 and above.


    When you write your next application, do consider the browsers that do not support
    AJAX.


    > **NOTE**: When we say that a browser does not support AJAX, it simply means
    that the browser does not support the creation of Javascript object - XMLHttpRequest
    object.


