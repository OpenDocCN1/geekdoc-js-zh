- md: "## 6. XMLHTTPREQUEST\n\nThe XMLHttpRequest object is the key to AJAX. It has\
    \ been available ever since Internet Explorer 5.5 was released in July 2000, but\
    \ was not fully discovered until AJAX and Web 2.0 in 2005 became popular.\n\n\
    XMLHttpRequest (XHR) is an API that can be used by JavaScript, JScript, VBScript,\
    \ and other web browser scripting languages to transfer and manipulate XML data\
    \ to and from a webserver using HTTP, establishing an independent connection channel\
    \ between a webpage's Client-Side and Server-Side.\n\nThe data returned from XMLHttpRequest\
    \ calls will often be provided by back-end databases. Besides XML, XMLHttpRequest\
    \ can be used to fetch data in other formats, e.g. JSON or even plain text.\n\n\
    You already have seen a couple of examples on how to create an XMLHttpRequest\
    \ object.\n\nListed below are some of the methods and properties that you have\
    \ to get familiar with.\n\n## XMLHttpRequest Methods\n\n- **abort()**\n  Cancels\
    \ the current request.\n- **getAllResponseHeaders()**\n  Returns the complete\
    \ set of HTTP headers as a string.\n- **getResponseHeader( headerName )**\n  Returns\
    \ the value of the specified HTTP header.\n- **open( method, URL )**\n- **open(\
    \ method, URL, async )**\n- **open( method, URL, async, userName )**\n- **open(\
    \ method, URL, async, userName, password )**\n  Specifies the method, URL, and\
    \ other optional attributes of a request.\n\nThe method parameter can have a value\
    \ of \"GET\", \"POST\", or \"HEAD\". Other HTTP methods such as \"PUT\" and \"\
    DELETE\" (primarily used in REST applications) may be possible.\nThe \"async\"\
    \ parameter specifies whether the request should be handled asynchronously or\
    \ not. \"true\" means that the script processing carries on after the send() method\
    \ without waiting for a response, and \"false\" means that the script waits for\
    \ a response before continuing script processing.\n\n- **send( content )**\n \
    \ Sends the request.\n- **setRequestHeader( label, value )**\n  Adds a label/value\
    \ pair to the HTTP header to be sent.\n\n## XMLHttpRequest Properties\n\n- **onreadystatechange**\n\
    \  An event handler for an event that fires at every state change.\n- **readyState**\n\
    \  The readyState property defines the current state of the XMLHttpRequest object.\n\
    \nThe following table provides a list of the possible values for the readyState\
    \ property:\n\n| State | Description |\n| :---: | :--- |\n| 0 | The request is\
    \ not initialized. |\n| 1 | The request has been set up. |\n| 2 | The request\
    \ has been sent. |\n| 3 | The request is in process. |\n| 4 | The request is completed.\
    \ |\n\n**readyState = 0** – After you have created the XMLHttpRequest object,\
    \ but before you have called the open() method.\n\n**readyState = 1** After you\
    \ have called the open() method, but before you have called send().\n\n**readyState\
    \ = 2** After you have called send().\n\n**readyState = 3** After the browser\
    \ has established a communication with the server, but before the server has completed\
    \ the response.\n\n**readyState = 4** After the request has been completed, and\
    \ the response data has been completely received from the server.\n\n- **responseText**\n\
    \  Returns the response as a string.\n\n- **responseXML**\n  Returns the response\
    \ as XML. This property returns an XML document object, which can be examined\
    \ and parsed using the W3C DOM node tree methods and properties.\n\n- **status**\n\
    \  Returns the status as a number (e.g., 404 for \"Not Found\" and 200 for \"\
    OK\").\n\n- **statusText**\n  Returns the status as a string (e.g., \"Not Found\"\
    \ or \"OK\").\n\n## 7. DATABASE OPERATIONS\n\nTo clearly illustrate how easy it\
    \ is to access information from a database using AJAX, we are going to build MySQL\
    \ queries on the fly and display the results on \"ajax.html\". But before we proceed,\
    \ let us do the ground work. Create a table using the following command.\n\n**NOTE**:\
    \ We are assuming you have sufficient privilege to perform the following MySQL\
    \ operations.\n\n```\nCREATE TABLE 'ajax_example' (\n  'name' varchar(50) NOT\
    \ NULL,\n  'age' int(11) NOT NULL,\n  'sex' varchar(1) NOT NULL,\n  'wpm' int(11)\
    \ NOT NULL,\n  PRIMARY KEY  ('name')\n)\n```\n\nNow dump the following data into\
    \ this table using the following SQL statements:\n\n```\nINSERT INTO 'ajax_example'\
    \ VALUES ('Jerry', 120, 'm', 20);\nINSERT INTO 'ajax_example' VALUES ('Regis',\
    \ 75, 'm', 44);\nINSERT INTO 'ajax_example' VALUES ('Frank', 45, 'm', 87);\nINSERT\
    \ INTO 'ajax_example' VALUES ('Jill', 22, 'f', 72);\nINSERT INTO 'ajax_example'\
    \ VALUES ('Tracy', 27, 'f', 0);\nINSERT INTO 'ajax_example' VALUES ('Julie', 35,\
    \ 'f', 90);\n```\n\n## Client Side HTML File\n\nNow let us have our client side\
    \ HTML file, which is ajax.html, and it will have the following code:\n\n```\n\
    <html>\n<body>\n<script language=\"javascript\" type=\"text/javascript\">\n<!--\n\
    //Browser Support Code\nfunction ajaxFunction(){\n  var ajaxRequest;  // The variable\
    \ that makes Ajax possible!\n\ntry{\n  // Opera 8.0+, Firefox, Safari\n  ajaxRequest\
    \ = new XMLHttpRequest();\n}catch (e){\n  // Internet Explorer Browsers\n  try{\n\
    \    ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\");\n  }catch (e) {\n  \
    \  try{\n      ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }catch\
    \ (e){\n      // Something went wrong\n      alert(\"Your browser broke!\");\n\
    \      return false;\n    }\n  }\n}\n// Create a function that will receive data\n\
    // sent from the server and will update\n// div section in the same page.\najaxRequest.onreadystatechange\
    \ = function(){\n  if(ajaxRequest.readyState == 4){\n    var ajaxDisplay = document.getElementById('ajaxDiv');\n\
    \    ajaxDisplay.innerHTML = ajaxRequest.responseText;\n  }\n}\n// Now get the\
    \ value from user and pass it to\n// server script.\nvar age = document.getElementById('age').value;\n\
    var wpm = document.getElementById('wpm').value;\nvar sex = document.getElementById('sex').value;\n\
    var queryString = \"?age=\" + age ;\nqueryString += \"&wpm=\" + wpm + \"&sex=\"\
    \ + sex;\najaxRequest.open(\"GET\", \"ajax-example.php\" + queryString, true);\n\
    ajaxRequest.send(null);\n}\n//--> \n</script>\n<form name='myForm'>\nMax Age:\
    \ <input type='text' id='age' /> <br />\nMax WPM: <input type='text' id='wpm'\
    \ />\n<br />\nSex: <select id='sex'>\n<option value=\"m\">m</option>\n<option\
    \ value=\"f\">f</option>\n</select>\n<input type='button' onclick='ajaxFunction()'\
    \ value='Query MySQL'/>\n</form>\n<div id='ajaxDiv'>Your result will display here</div>\n\
    </body>\n</html>\n```\n\n**NOTE:** The way of passing variables in the Query is\
    \ according to HTTP standard and have formA.\n\nURL?variable1=value1;&variable2=value2;\n\
    \nThe above code will give you a screen as given below:\n\n![](img/713147fda427ad275cc07fad320cb449_22_0.png)\n\
    \n**NOTE:** This is a dummy screen.\n\n## Server Side PHP File\n\nYour client-side\
    \ script is ready. Now, we have to write our server-side script, which will fetch\
    \ age, wpm, and sex from the database and will send it back to the client. Put\
    \ the following code into the file \"ajax-example.php\".\n\n```\n<?php\n$dbhost\
    \ = \"localhost\";\n$dbuser = \"dbusername\";\n$dbpass = \"dbpassword\";\n$dbname\
    \ = \"dbname\";\n\n//Connect to MySQL Server\nmysql_connect($dbhost, $dbuser,\
    \ $dbpass);\n\n//Select Database\nmysql_select_db($dbname) or die(mysql_error());\n\
    \n// Retrieve data from Query String\n$age = $_GET['age'];\n$sex = $_GET['sex'];\n\
    $wpm = $_GET['wpm'];\n\n// Escape User Input to help prevent SQL Injection\n$age\
    \ = mysql_real_escape_string($age);\n$sex = mysql_real_escape_string($sex);\n\
    $wpm = mysql_real_escape_string($wpm);\n\n//build query\n$query = \"SELECT * FROM\
    \ ajax_example WHERE sex = '$sex'\";\nif(is_numeric($age))\n    $query .= \" AND\
    \ age <= $age\";\nif(is_numeric($wpm))\n    $query .= \" AND wpm <= $wpm\";\n\n\
    //Execute query\n qry_result = mysql_query($query) or die(mysql_error());\n\n\
    //Build Result String\n$display_string = \"<table>\";\n$display_string .= \"<tr>\"\
    ;\n$display_string .= \"<th>Name</th>\";\n$display_string .= \"<th>Age</th>\"\
    ;\n$display_string .= \"<th>Sex</th>\";\n$display_string .= \"<th>WPM</th>\";\n\
    $display_string .= \"</tr>\";\n\n// Insert a new row in the table for each person\
    \ returned\nwhile($row = mysql_fetch_array($qry_result)){\n    $display_string\
    \ .= \"<tr>\";\n    $display_string .= \"<td>$row[name]</td>\";\n    $display_string\
    \ .= \"<td>$row[age]</td>\";\n    $display_string .= \"<td>$row[sex]</td>\";\n\
    \    $display_string .= \"<td>$row[wpm]</td>\";\n    $display_string .= \"</tr>\"\
    ;\n}\n\necho \"Query: \" . $query . \"<br />\";\n```"
  mdcn: "\n## 6. XMLHttpRequest\n\nXMLHttpRequest 对象是 AJAX 的关键。它自 2000 年 7 月 Internet\
    \ Explorer 5.5 发布以来就已存在，但直到 2005 年 AJAX 和 Web 2.0 普及后才被充分发现和利用。\n\nXMLHttpRequest\
    \ (XHR) 是一个 API，可被 JavaScript、JScript、VBScript 等网页浏览器脚本语言使用，通过 HTTP 传输和操作与 Web\
    \ 服务器之间的 XML 数据，从而在网页的客户端和服务器端之间建立独立的通信通道。\n\nXMLHttpRequest 调用返回的数据通常由后端数据库提供。除了\
    \ XML，XMLHttpRequest 还可用于获取其他格式的数据，例如 JSON 甚至是纯文本。\n\n你已经见过几个如何创建 XMLHttpRequest\
    \ 对象的例子了。\n\n以下列出了一些你需要熟悉的方法和属性。\n\n## XMLHttpRequest 方法\n\n- **abort()**\n  取消当前请求。\n\
    - **getAllResponseHeaders()**\n  以字符串形式返回完整的 HTTP 头信息集合。\n- **getResponseHeader(\
    \ headerName )**\n  返回指定 HTTP 头的值。\n- **open( method, URL )**\n- **open( method,\
    \ URL, async )**\n- **open( method, URL, async, userName )**\n- **open( method,\
    \ URL, async, userName, password )**\n  指定请求的方法、URL 以及其他可选属性。\n\nmethod 参数的值可以是\
    \ \"GET\"、\"POST\" 或 \"HEAD\"。其他 HTTP 方法如 \"PUT\" 和 \"DELETE\"（主要用于 REST 应用）也可能是有效的。\n\
    \"async\" 参数指定请求是否应异步处理。\"true\" 表示脚本处理在调用 send() 方法后继续执行，无需等待响应；\"false\" 表示脚本会等待收到响应后才继续执行后续处理。\n\
    \n- **send( content )**\n  发送请求。\n- **setRequestHeader( label, value )**\n  向要发送的\
    \ HTTP 头添加一个标签/值对。\n\n## XMLHttpRequest 属性\n\n- **onreadystatechange**\n  在每次状态变化时触发的事件处理程序。\n\
    - **readyState**\n  readyState 属性定义了 XMLHttpRequest 对象的当前状态。\n\n下表列出了 readyState\
    \ 属性可能的值：\n\n| 状态 | 描述 |\n| :---: | :--- |\n| 0 | 请求尚未初始化。 |\n| 1 | 请求已建立。 |\n\
    | 2 | 请求已发送。 |\n| 3 | 请求正在处理中。 |\n| 4 | 请求已完成。 |\n\n**readyState = 0** – 在你创建了\
    \ XMLHttpRequest 对象之后，但在调用 open() 方法之前。\n\n**readyState = 1** 在你调用了 open() 方法之后，但在调用\
    \ send() 之前。\n\n**readyState = 2** 在你调用了 send() 之后。\n\n**readyState = 3** 在浏览器与服务器建立连接之后，但在服务器完成响应之前。\n\
    \n**readyState = 4** 在请求完成，并且从服务器完全接收到响应数据之后。\n\n- **responseText**\n  以字符串形式返回响应。\n\
    \n- **responseXML**\n  以 XML 形式返回响应。此属性返回一个 XML 文档对象，可以使用 W3C DOM 节点树方法和属性进行检查和解析。\n\
    \n- **status**\n  以数字形式返回状态（例如，404 表示 \"Not Found\"，200 表示 \"OK\"）。\n\n- **statusText**\n\
    \  以字符串形式返回状态（例如 \"Not Found\" 或 \"OK\"）。\n\n## 7. 数据库操作\n\n为了清晰地展示使用 AJAX 从数据库中获取信息是多么容易，我们将动态构建\
    \ MySQL 查询，并在 \"ajax.html\" 上显示结果。但在我们开始之前，让我们先做些基础工作。使用以下命令创建一个表。\n\n**注意**：我们假设你有足够的权限执行以下\
    \ MySQL 操作。\n\n```\nCREATE TABLE 'ajax_example' (\n  'name' varchar(50) NOT NULL,\n\
    \  'age' int(11) NOT NULL,\n  'sex' varchar(1) NOT NULL,\n  'wpm' int(11) NOT\
    \ NULL,\n  PRIMARY KEY  ('name')\n)\n```\n\n现在，使用以下 SQL 语句将数据导入此表：\n\n```\nINSERT\
    \ INTO 'ajax_example' VALUES ('Jerry', 120, 'm', 20);\nINSERT INTO 'ajax_example'\
    \ VALUES ('Regis', 75, 'm', 44);\nINSERT INTO 'ajax_example' VALUES ('Frank',\
    \ 45, 'm', 87);\nINSERT INTO 'ajax_example' VALUES ('Jill', 22, 'f', 72);\nINSERT\
    \ INTO 'ajax_example' VALUES ('Tracy', 27, 'f', 0);\nINSERT INTO 'ajax_example'\
    \ VALUES ('Julie', 35, 'f', 90);\n```\n\n## 客户端 HTML 文件\n\n现在，让我们来编写客户端的 HTML\
    \ 文件，即 ajax.html，它将包含以下代码：\n\n```\n<html>\n<body>\n<script language=\"javascript\"\
    \ type=\"text/javascript\">\n<!--\n//浏览器支持代码\nfunction ajaxFunction(){\n  var\
    \ ajaxRequest;  // 使得 Ajax 成为可能的变量！\n\ntry{\n  // Opera 8.0+, Firefox, Safari\n\
    \  ajaxRequest = new XMLHttpRequest();\n}catch (e){\n  // Internet Explorer 浏览器\n\
    \  try{\n    ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\");\n  }catch (e)\
    \ {\n    try{\n      ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
    \    }catch (e){\n      // 出错了\n      alert(\"您的浏览器出故障了！\");\n      return false;\n\
    \    }\n  }\n}\n// 创建一个函数，用于接收从服务器发送的数据\n// 并更新同一页面中的 div 部分。\najaxRequest.onreadystatechange\
    \ = function(){\n  if(ajaxRequest.readyState == 4){\n    var ajaxDisplay = document.getElementById('ajaxDiv');\n\
    \    ajaxDisplay.innerHTML = ajaxRequest.responseText;\n  }\n}\n// 现在从用户那里获取值并传递给服务器脚本。\n\
    var age = document.getElementById('age').value;\nvar wpm = document.getElementById('wpm').value;\n\
    var sex = document.getElementById('sex').value;\nvar queryString = \"?age=\" +\
    \ age ;\nqueryString += \"&wpm=\" + wpm + \"&sex=\" + sex;\najaxRequest.open(\"\
    GET\", \"ajax-example.php\" + queryString, true);\najaxRequest.send(null);\n}\n\
    //--> \n</script>\n<form name='myForm'>\nMax Age: <input type='text' id='age'\
    \ /> <br />\nMax WPM: <input type='text' id='wpm' />\n<br />\nSex: <select id='sex'>\n\
    <option value=\"m\">m</option>\n<option value=\"f\">f</option>\n</select>\n<input\
    \ type='button' onclick='ajaxFunction()' value='Query MySQL'/>\n</form>\n<div\
    \ id='ajaxDiv'>Your result will display here</div>\n</body>\n</html>\n```\n\n\
    **注意：** 在查询字符串中传递变量的方式遵循 HTTP 标准，形式如下。\n\nURL?variable1=value1;&variable2=value2;\n\
    \n上述代码将为你生成如下所示的屏幕：\n\n![](img/713147fda427ad275cc07fad320cb449_22_0.png)\n\n\
    **注意：** 这是一个示例屏幕。\n\n## 服务器端 PHP 文件\n\n你的客户端脚本已准备就绪。现在，我们必须编写服务器端脚本，该脚本将从数据库中获取\
    \ age、wpm 和 sex，并将其发送回客户端。将以下代码放入文件 \"ajax-example.php\"。\n\n```\n<?php\n$dbhost\
    \ = \"localhost\";\n$dbuser = \"dbusername\";\n$dbpass = \"dbpassword\";\n$dbname\
    \ = \"dbname\";\n\n//连接到 MySQL 服务器\nmysql_connect($dbhost, $dbuser, $dbpass);\n\
    \n//选择数据库\nmysql_select_db($dbname) or die(mysql_error());\n\n// 从查询字符串中检索数据\n\
    $age = $_GET['age'];\n$sex = $_GET['sex'];\n$wpm = $_GET['wpm'];\n\n// 转义用户输入以帮助防止\
    \ SQL 注入\n$age = mysql_real_escape_string($age);\n$sex = mysql_real_escape_string($sex);\n\
    $wpm = mysql_real_escape_string($wpm);\n\n//构建查询\n$query = \"SELECT * FROM ajax_example\
    \ WHERE sex = '$sex'\";\nif(is_numeric($age))\n    $query .= \" AND age <= $age\"\
    ;\nif(is_numeric($wpm))\n    $query .= \" AND wpm <= $wpm\";\n\n//执行查询\n qry_result\
    \ = mysql_query($query) or die(mysql_error());\n\n//构建结果字符串\n$display_string =\
    \ \"<table>\";\n$display_string .= \"<tr>\";\n$display_string .= \"<th>Name</th>\"\
    ;\n$display_string .= \"<th>Age</th>\";\n$display_string .= \"<th>Sex</th>\";\n\
    $display_string .= \"<th>WPM</th>\";\n$display_string .= \"</tr>\";\n\n// 为返回的每个人在表格中插入一个新行\n\
    while($row = mysql_fetch_array($qry_result)){\n    $display_string .= \"<tr>\"\
    ;\n    $display_string .= \"<td>$row[name]</td>\";\n    $display_string .= \"\
    <td>$row[age]</td>\";\n    $display_string .= \"<td>$row[sex]</td>\";\n    $display_string\
    \ .= \"<td>$row[wpm]</td>\";\n    $display_string .= \"</tr>\";\n}\n\necho \"\
    Query: \" . $query . \"<br />\";\n```\n"
