- md: "## Standard Example:\n\n![](img/713147fda427ad275cc07fad320cb449_8_0.png)\n\
    \n**NOTE:** We have given a more complex example in [AJAX Database](https://www.tutorialspoint.com/ajax/ajax_database.htm).\n\
    \n![](img/713147fda427ad275cc07fad320cb449_8_1.png)\n\n## 4. BROWSER SUPPORT\n\
    \nAll the available browsers cannot support AJAX. Here is a list of major browsers\
    \ that support AJAX.\n\n- Mozilla Firefox 1.0 and above.\n- Netscape version 7.1\
    \ and above.\n- Apple Safari 1.2 and above.\n- Microsoft Internet Explorer 5 and\
    \ above.\n- Konqueror.\n- Opera 7.6 and above.\n\nWhen you write your next application,\
    \ do consider the browsers that do not support AJAX.\n\n> **NOTE**: When we say\
    \ that a browser does not support AJAX, it simply means that the browser does\
    \ not support the creation of Javascript object - XMLHttpRequest object.\n\n##\
    \ Writing Browser Specific Code\n\nThe simplest way to make your source code compatible\
    \ with a browser is to use try...catch blocks in your JavaScript.\n\n```\n<html>\n\
    <body>\n<script language=\"javascript\" type=\"text/javascript\">\n<!--\n//Browser\
    \ Support Code\nfunction ajaxFunction(){\nvar ajaxRequest; // The variable that\
    \ makes Ajax possible!\n\ntry{\n// Opera 8.0+, Firefox, Safari\najaxRequest =\
    \ new XMLHttpRequest();\n}catch (e){\n// Internet Explorer Browsers\ntry{\n  \
    \  ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\");\n}catch (e) {\n    try{\n\
    \        ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }catch (e){\n\
    \        // Something went wrong\n        alert(\"Your browser broke!\");\n  \
    \      return false;\n    }\n}\n\n// -->\n</script>\n<form name='myForm'>\nName:\
    \ <input type='text' name='username' /> <br />\nTime: <input type='text' name='time'\
    \ />\n</form>\n</body>\n</html>\n```\n\nIn the above JavaScript code, we try three\
    \ times to make our XMLHttpRequest object. Our first attempt:\n\n- ajaxRequest\
    \ = new XMLHttpRequest();\n\nIt is for Opera 8.0+, Firefox, and Safari browsers.\
    \ If it fails, we try two more times to make the correct object for an Internet\
    \ Explorer browser with:\n\n- ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\"\
    );\n- ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\");\n\nIf it doesn't\
    \ work, then we can use a very outdated browser that doesn't support XMLHttpRequest,\
    \ which also means it doesn't support AJAX.\n\nMost likely though, our variable\
    \ ajaxRequest will now be set to whatever *XMLHttpRequest* standard the browser\
    \ uses and we can start sending data to the server. The step-wise AJAX workflow\
    \ is explained in the next chapter.\n\n## 5. AJAX IN ACTION\n\nThis chapter gives\
    \ you a clear picture of the exact steps of AJAX operation.\n\n### Steps of AJAX\
    \ Operation\n\n1. A client event occurs.\n2. An XMLHttpRequest object is created.\n\
    3. The XMLHttpRequest object is configured.\n4. The XMLHttpRequest object makes\
    \ an asynchronous request to the Webserver.\n5. The Webserver returns the result\
    \ containing XML document.\n6. The XMLHttpRequest object calls the callback()\
    \ function and processes the result.\n7. The HTML DOM is updated.\n\nLet us take\
    \ these steps one by one.\n\n### A Client Event Occurs\n\n- A JavaScript function\
    \ is called as the result of an event.\n- Example: _validateUserId()_ JavaScript\
    \ function is mapped as an event handler to an _onkeyup_ event on input form field\
    \ whose id is set to \"userid\".\n- `<input type=\"text\" size=\"20\" id=\"userid\"\
    \ name=\"id\" onkeyup=\"validateUserId();\">`.\n\n### The XMLHttpRequest Object\
    \ is Created\n\n```\nvar ajaxRequest;  // The variable that makes Ajax possible!\n\
    function ajaxFunction(){\n    try{\n        // Opera 8.0+, Firefox, Safari\n \
    \       ajaxRequest = new XMLHttpRequest();\n    }catch (e){\n        // Internet\
    \ Explorer Browsers\ntry{\n    ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\"\
    );\n}catch (e) {\n    try{\n        ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n    }catch (e){\n        // Something went wrong\n        alert(\"Your browser\
    \ broke!\");\n        return false;\n    }\n}\n}\n```\n\n### The XMLHttpRequest\
    \ Object is Configured\n\nIn this step, we will write a function that will be\
