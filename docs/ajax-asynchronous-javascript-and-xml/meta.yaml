    \ this function will receive the result from the server and will do the required\
    \ processing. As in the following example, it sets a variable message on true\
    \ or false based on the returned value from the Webserver.\n\n```\nfunction processRequest()\
    \ {\n  if (req.readyState == 4) {\n    if (req.status == 200) {\n      var message\
    \ = ...;\n\n... \n}\n```\n\n### The HTML DOM is Updated\n\nThis is the final step\
    \ and in this step, your HTML page will be updated. It happens in the following\
    \ way.\n\n- JavaScript gets a reference to any element in a page using DOM API.\n\
    - The recommended way to gain a reference to an element is to call.\n- JavaScript\
    \ may now be used to modify the element's attributes; modify the element's style\
    \ properties; or add, remove, or modify the child elements. Here is an example:\n\
    \n```\ndocument.getElementById(\"userIdMessage\"),\n\n// where \"userIdMessage\"\
    \ is the ID attribute\n\n// of an element appearing in the HTML document\n```\n\
    \n```\n<script type=\"text/javascript\">\n<!--\nfunction setMessageUsingDOM(message)\
    \ {\n  var userMessageElement =\n      document.getElementById(\"userIdMessage\"\
