    \ = \"red\";\n    messageText = \"Invalid User Id\";\n  } else {\n    userMessageElement.style.color\
    \ = \"green\";\n    messageText = \"Valid User Id\";\n  }\n  var messageBody =\
    \ document.createTextNode(messageText);\n\n\n  // if the messageBody element has\
    \ been created simple\n  // replace it otherwise append the new element\n\n\n\
    \  if (userMessageElement.childNodes[0]) {\n    userMessageElement.replaceChild(messageBody,\n\
    \    userMessageElement.childNodes[0]);\n  } else {\n    userMessageElement.appendChild(messageBody);\n\
    \  }\n}\n-->\n</script>\n<body>\n<div id=\"userIdMessage\"><div>\n</body>\n```\n\
    \nIf you have understood the above-mentioned seven steps, then you are almost\
    \ done with AJAX. In the next chapter, we will see *XMLHttpRequest* object in\
    \ detail."
  mdcn: "\n## 标准示例：\n\n![](img/713147fda427ad275cc07fad320cb449_8_0.png)\n\n**注意：**\
    \ 我们在 [AJAX 数据库](https://www.tutorialspoint.com/ajax/ajax_database.htm) 中提供了一个更复杂的示例。\n\
    \n![](img/713147fda427ad275cc07fad320cb449_8_1.png)\n\n## 4. 浏览器支持\n\n并非所有可用浏览器都支持\
    \ AJAX。以下是支持 AJAX 的主要浏览器列表。\n\n- Mozilla Firefox 1.0 及更高版本。\n- Netscape 7.1 及更高版本。\n\
    - Apple Safari 1.2 及更高版本。\n- Microsoft Internet Explorer 5 及更高版本。\n- Konqueror。\n\
    - Opera 7.6 及更高版本。\n\n在编写下一个应用程序时，请务必考虑那些不支持 AJAX 的浏览器。\n\n> **注意**：当我们说浏览器不支持\
    \ AJAX 时，这仅仅意味着该浏览器不支持创建 Javascript 对象——XMLHttpRequest 对象。\n\n## 编写浏览器特定代码\n\n\
    使你的源代码与浏览器兼容的最简单方法是在 JavaScript 中使用 try...catch 块。\n\n```\n<html>\n<body>\n<script\
    \ language=\"javascript\" type=\"text/javascript\">\n<!--\n//Browser Support Code\n\
    function ajaxFunction(){\nvar ajaxRequest; // The variable that makes Ajax possible!\n\
    \ntry{\n// Opera 8.0+, Firefox, Safari\najaxRequest = new XMLHttpRequest();\n\
    }catch (e){\n// Internet Explorer Browsers\ntry{\n    ajaxRequest = new ActiveXObject(\"\
    Msxml2.XMLHTTP\");\n}catch (e) {\n    try{\n        ajaxRequest = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n    }catch (e){\n        // Something went wrong\n    \
    \    alert(\"Your browser broke!\");\n        return false;\n    }\n}\n\n// -->\n\
    </script>\n<form name='myForm'>\nName: <input type='text' name='username' /> <br\
    \ />\nTime: <input type='text' name='time' />\n</form>\n</body>\n</html>\n```\n\
    \n在上面的 JavaScript 代码中，我们尝试了三次来创建 XMLHttpRequest 对象。我们的第一次尝试：\n\n- ajaxRequest\
    \ = new XMLHttpRequest();\n\n这是针对 Opera 8.0+、Firefox 和 Safari 浏览器的。如果失败，我们再尝试两次，为\
    \ Internet Explorer 浏览器创建正确的对象：\n\n- ajaxRequest = new ActiveXObject(\"Msxml2.XMLHTTP\"\
    );\n- ajaxRequest = new ActiveXObject(\"Microsoft.XMLHTTP\");\n\n如果仍然不行，那么我们使用的是一个非常过时的浏览器，它不支持\
    \ XMLHttpRequest，这也意味着它不支持 AJAX。\n\n不过，很可能我们的变量 ajaxRequest 现在会被设置为浏览器所使用的任何 *XMLHttpRequest*\
    \ 标准，我们就可以开始向服务器发送数据了。AJAX 的分步工作流程将在下一章中解释。\n\n## 5. AJAX 实战\n\n本章将清晰地展示 AJAX\
    \ 操作的精确步骤。\n\n### AJAX 操作步骤\n\n1.  发生一个客户端事件。\n2.  创建一个 XMLHttpRequest 对象。\n3.\
    \  配置 XMLHttpRequest 对象。\n4.  XMLHttpRequest 对象向 Web 服务器发出异步请求。\n5.  Web 服务器返回包含\
    \ XML 文档的结果。\n6.  XMLHttpRequest 对象调用回调()函数并处理结果。\n7.  更新 HTML DOM。\n\n让我们逐步来了解这些步骤。\n\
    \n### 发生客户端事件\n\n- 由于某个事件而调用一个 JavaScript 函数。\n- 示例：_validateUserId()_ JavaScript\
    \ 函数被映射为一个事件处理程序，响应一个 id 设置为 \"userid\" 的输入表单字段上的 _onkeyup_ 事件。\n- `<input type=\"\
    text\" size=\"20\" id=\"userid\" name=\"id\" onkeyup=\"validateUserId();\">`.\n\
    \n### 创建 XMLHttpRequest 对象\n\n```\nvar ajaxRequest;  // The variable that makes\
    \ Ajax possible!\nfunction ajaxFunction(){\n    try{\n        // Opera 8.0+, Firefox,\
    \ Safari\n        ajaxRequest = new XMLHttpRequest();\n    }catch (e){\n     \
    \   // Internet Explorer Browsers\ntry{\n    ajaxRequest = new ActiveXObject(\"\
    Msxml2.XMLHTTP\");\n}catch (e) {\n    try{\n        ajaxRequest = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n    }catch (e){\n        // Something went wrong\n    \
    \    alert(\"Your browser broke!\");\n        return false;\n    }\n}\n}\n```\n\
    \n### 配置 XMLHttpRequest 对象\n\n在这一步中，我们将编写一个函数，该函数将由客户端事件触发，并注册一个回调函数 processRequest()。\n\
    \n```\nfunction validateUserId() {\n    ajaxFunction();\n    // Here processRequest()\
    \ is the callback function.\n    ajaxRequest.onreadystatechange = processRequest;\n\
    \    if (!target) target = document.getElementById(\"userid\");\n    var url =\
    \ \"validate?id=\" + escape(target.value);\n    ajaxRequest.open(\"GET\", url,\
    \ true);\n    ajaxRequest.send(null);\n}\n```\n\n### 向 Web 服务器发出异步请求\n\n源代码在上面的代码片段中可用。以粗体书写的代码负责向\
    \ web 服务器发出请求。所有这些操作都是通过 XMLHttpRequest 对象 *ajaxRequest* 完成的。\n\n![](img/713147fda427ad275cc07fad320cb449_12_0.png)\n\
    \n```\nfunction validateUserId() {\n    ajaxFunction();\n    // Here processRequest()\
    \ is the callback function.\n    ajaxRequest.onreadystatechange = processRequest;\n\
    \n    if (!target) target = document.getElementById(\"userid\");\n    var url\
    \ = \"validate?id=\" + escape(target.value);\n    ajaxRequest.open(\"GET\", url,\
    \ true);\n    ajaxRequest.send(null);\n}\n```\n\n假设你在 userid 框中输入了 *Zara*，那么在上面的请求中，URL\
    \ 被设置为 \"validate?id=Zara\"。\n\n### Web 服务器返回包含 XML 文档的结果\n\n你可以用任何语言实现服务器端脚本，但其逻辑应如下：\n\
    \n- 从客户端获取请求。\n- 解析来自客户端的输入。\n- 执行必要的处理。\n- 将输出发送给客户端。\n\n如果我们假设你打算编写一个 servlet，那么这是相应的代码片段。\n\
    \n```\npublic void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \    throws IOException, ServletException\n{\n    String targetId = request.getParameter(\"\
    id\");\n\n    if ((targetId != null) && !accounts.containsKey(targetId.trim()))\n\
    \    {\n        response.setContentType(\"text/xml\");\n        response.setHeader(\"\
    Cache-Control\", \"no-cache\");\n        response.getWriter().write(\"true\");\n\
    \    }\nelse\n{\n    response.setContentType(\"text/xml\");\n    response.setHeader(\"\
    Cache-Control\", \"no-cache\");\n    response.getWriter().write(\"false\");\n\
    }\n}\n```\n\n### 调用回调函数 processRequest()\n\nXMLHttpRequest 对象被配置为在 XMLHttpRequest\
    \ 对象的 readyState 发生状态变化时调用 processRequest() 函数。现在这个函数将接收服务器的结果，并进行所需的处理。如下例所示，它根据\
    \ Web 服务器返回的值将变量 message 设置为 true 或 false。\n\n```\nfunction processRequest() {\n\
    \  if (req.readyState == 4) {\n    if (req.status == 200) {\n      var message\
    \ = ...;\n\n... \n}\n```\n\n### 更新 HTML DOM\n\n这是最后一步，在这一步中，你的 HTML 页面将被更新。它按以下方式发生：\n\
    \n- JavaScript 使用 DOM API 获取对页面中任何元素的引用。\n- 获取元素引用的推荐方式是调用。\n- 现在可以使用 JavaScript\
    \ 来修改元素的属性；修改元素的样式属性；或者添加、删除或修改子元素。以下是示例：\n\n```\ndocument.getElementById(\"userIdMessage\"\
    ),\n\n// where \"userIdMessage\" is the ID attribute\n\n// of an element appearing\
    \ in the HTML document\n```\n\n```\n<script type=\"text/javascript\">\n<!--\n\
    function setMessageUsingDOM(message) {\n  var userMessageElement =\n      document.getElementById(\"\
    userIdMessage\");\n  var messageText;\n  if (message == \"false\") {\n    userMessageElement.style.color\
    \ = \"red\";\n    messageText = \"Invalid User Id\";\n  } else {\n    userMessageElement.style.color\
    \ = \"green\";\n    messageText = \"Valid User Id\";\n  }\n  var messageBody =\
    \ document.createTextNode(messageText);\n\n\n  // if the messageBody element has\
    \ been created simple\n  // replace it otherwise append the new element\n\n\n\
    \  if (userMessageElement.childNodes[0]) {\n    userMessageElement.replaceChild(messageBody,\n\
    \    userMessageElement.childNodes[0]);\n  } else {\n    userMessageElement.appendChild(messageBody);\n\
    \  }\n}\n-->\n</script>\n<body>\n<div id=\"userIdMessage\"><div>\n</body>\n```\n\
    \n如果你理解了上面提到的七个步骤，那么你就几乎掌握了 AJAX。在下一章中，我们将详细讨论 *XMLHttpRequest* 对象。\n"
