    \ Code written in bold typeface is responsible to make a request to the webserver.\
    \ This is all being done using the XMLHttpRequest object *ajaxRequest*.\n\n![](img/713147fda427ad275cc07fad320cb449_12_0.png)\n\
    \n```\nfunction validateUserId() {\n    ajaxFunction();\n    // Here processRequest()\
    \ is the callback function.\n    ajaxRequest.onreadystatechange = processRequest;\n\
    \n    if (!target) target = document.getElementById(\"userid\");\n    var url\
    \ = \"validate?id=\" + escape(target.value);\n    ajaxRequest.open(\"GET\", url,\
    \ true);\n    ajaxRequest.send(null);\n}\n```\n\nAssume you enter *Zara* in the\
    \ userid box, then in the above request, the URL is set to \"validate?id=Zara\"\
    .\n\n### Webserver Returns the Result Containing XML Document\n\nYou can implement\
    \ your server-side script in any language, however its logic should be as follows.\n\
    \n- Get a request from the client.\n- Parse the input from the client.\n- Do required\
    \ processing.\n- Send the output to the client.\n\nIf we assume that you are going\
    \ to write a servlet, then here is the piece of code.\n\n```\npublic void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n    throws IOException, ServletException\n\
    {\n    String targetId = request.getParameter(\"id\");\n\n    if ((targetId !=\
    \ null) && !accounts.containsKey(targetId.trim()))\n    {\n        response.setContentType(\"\
    text/xml\");\n        response.setHeader(\"Cache-Control\", \"no-cache\");\n \
    \       response.getWriter().write(\"true\");\n    }\nelse\n{\n    response.setContentType(\"\
    text/xml\");\n    response.setHeader(\"Cache-Control\", \"no-cache\");\n    response.getWriter().write(\"\
    false\");\n}\n}\n```\n\n### Callback Function processRequest() is Called\n\nThe\
    \ XMLHttpRequest object was configured to call the processRequest() function when\
