    The first thing this code snippet creates a filehandle to our file ("$file"),
    and opens the file in read-only mode. For some reason the file can''t be opened,
    the code will die() with an error message (hopefully) telling us why the file
    couldn''t be opened. From there, we read the file at a time, chomp()''ing off
    the carriage return at the end of the line. If the line doesn''t start with a
    "B" (remember, this is track 1 data), then we skip the line. From there, we split
    the line into components based on the "^" non-separator characters (denoted by
    a hexadecimal representation (\x5e)).We remove all non-numeric characters (between
    0 and 9) from the PAN (there may be spaces or dashes-) and then retrieve the expiry
    or expiry date from the remainder of the data in the third segment (i.e., the
    first four characters).


    ![](img/dba04b5f568c7d438d1bfa61dd0316b1_145_0.png)


    Finally, the last thing above code does is print the parsed data in a fixed length
    format, using the printf() function. However, there''s one other thing I''d like
    to point out, and that''s the line that reads as:


    ```

    $cc_nums($stuff) = 1;

    ```


    The purpose of this line is to remove duplicates. Many times when a search function
    goes through file (or acquired image), the search may return multiple instances
    of the same credit card number. This can happen for a number of reasons:'
