    # Writing ProScript output to files


    Sometimes, trying to view a great deal of information in the ProScript display
    window can be quite cumbersome. As ProScripts are simply Perl scripts, code can
    be added to write the output of the ProScript to a file, as well or instead of
    sending it straight to the display window.


    # Parsing Other Data


    Besides log files and binary data on Windows systems, there is quite a bit of
    other data that can be parsed in a number of useful ways. For example, the Visa
    Payment Card Industry (PCI) Data Security Standard (DSS)¹³ has put forth requirements
    not for notification of individuals in case their data has been compromised, but
    also notification to the PCI board if there has been a breach. The goals of a
    PCI forensic audit are to determine if there, in fact, and credit card data was
    on the affected systems and possibly compromised. So what generally happens is
    that some systems may be forensically acquired, and the images will be analyzed
    for signs of an intrusion, as well as searched for credit card numbers. Forensic
    analysis tools such as EnCase provide the capability for the user to define a
    search for credit card numbers¹⁴


    +   ¹³ http://www.corporate.visa.com/pd/security/main.jsp

    ¹⁴ http://en.wikipedia.org/wiki/Credit_card_number'
