    the executable image file based on the “map” provided by the header information.
    The actual segments of the executable image file are maintained in memory “pages”,
    sections that are each 4096 bytes (4Kb) in size. If all of the necessary memory
    pages are not available in the RAM dump, such if the memory manager swapped pages
    out to the pagefile, lspi.pl will not be able to reassemble the complete executable
    image file and quit with a message to that effect.


    These two Perl scripts are available, along with several other Perl scripts that
    can be used to parse data from RAM dumps, on the SourceForge site for the WindowsIR⁹
    project.


    ![](img/dba04b5f568c7d438d1bfa61dd0316b1_124_0.png)


    Extracting other data from RAM

    RAM dumps are very full of more than just processes and network connections. Opening
    a RAM dump in your favorite hex editor will reveal what might appear to be a Event
    Log records, as well as Registry keys. In the same way as processes were located
    in a RAM dump, these other objects can be located and parsed. This can be very
    useful in an investigation as these objects contain timestamp information and
    may be used to establish or correlate a timeline of activity on the system.


    # ProScripts


    As mentioned in Part I, ProScripts are essentially Perl scripts that provide a
    scripting capability for the ProDiscover forensic analysis application provided
    byTechnology Pathways. The ProDiscover forensic analysis application can be extremely
    useful, and the addition of the Perl scripting language allows the examiner to
    leverage the power of Perl in conjunction with the ProDiscover product. This gives
    the examiner the ability to extend the ProDiscover application to incredible levels
    of usability.


    Graphical user interface (GUI) programming is beyond the scope of this book, but
    I have tested the use of a GUI in conjunction with ProDiscover ProScripts


    > ⁹ http://sourceforge.net/project/showfiles.php?group_id=164158'
