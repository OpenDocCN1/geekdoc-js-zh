  md: '# 86 Part II • Perl Scripting and Computer Forensic Analysis


    Let’s look at an example of how to launch evt2xls.pl and parse a Windows Event
    Log. To do that, let''s assume we''ve got an external hard drive attached to our
    analysis system via USB, and that drive has been mounted as F:\. On that external
    hard drive is a directory called "cases", which contains the Security, Application,
    and System Event Log files from a Windows system. In order to use evt2xls.pl,
    we would need to type in a command line as:


    ```

    C:\forensics\evt2xls.pl -f f:\cases\secevent.evt -o f:\cases\secevent.xls -r f:\cases\secevent.rt

    ```


    The “f” switch tells the script Event Log file to open, and the “o” switch gives
    the path and filename of the Excel spreadsheet where the parsed records will be
    written. The resulting output file is a binary spreadsheet, which can be easily
    opened in Excel. The dates in the spreadsheet (i.e., the dates/times that the
    events were generated, which is part of the event record (structure)) have been
    converted to a format that Excel understands, allowing you to sort the spreadsheet
    based on any of the visible columns. Finally, the “r” switch tells the script
    to write the report file, which contains information such as the frequency with
    which each event ID occurs within the Event Log file, as well as the date ranges
    of the event records. When the spreadsheet and report file are combined with sources
    that describe why each event is generated (such as http://www.eventid.net), they
    provide a powerful set of analysis tools for the forensic examiner.


