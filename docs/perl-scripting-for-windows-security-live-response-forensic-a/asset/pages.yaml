  md: '# 118 Part II • Perl Scripting and Computer Forensic Analysis


    does boot prefetching, which Windows 2003 does by default, as well (although Windows
    2003 does not perform application prefetching by default). The long and short
    of what application prefetching does allow applications on Windows XP to start
    up quicker by storing some information about the application in a fixed location
    (yes, this is an overly-simplified description, but a more detailed description
    is beyond the scope of this book). Windows XP can store up to 128 Prefetch files
    (*.pf) in its Prefetch directory, and the Prefetch.pl ProScript will allow the
    examiner to see information about the prefetch files.


    ```

    #! c:\perl\bin\perl.exe

    #

    # Prefetch.pl, version 0.1_20061026

    # ProScript to parse the Prefetch directory for .pf files, and

    # then parse the files for run count and last time.


    # Copyright 2006-2007 H. Carvey, keyeddet89@yahoo.com


    use ProScript;

    PSDisplayText("Prefetch. v. 0.1_20061026");

    PSDisplayText("ProScript to parse the Prefetch directory on Windows XP");

    PSDisplayText("systems and return the filename, time last accessed, and the run-count");

    PSDisplayText(" -> Requires ProDiscover v. 4.85 or higher");

    #n# Get the SystemRoot value

    my $sysinfo = ();

    $numRegs = PSGetNumRegistries();

    if ($numRegs == 0) {

    PSDisplayText("No registries to process");

    return;

    }

    $regName = PSGetRegistryAt(0);

    PSRefreshRegistry($regName);

    my $keyName = "HKEY_LOCAL_MACHINE\\Software\\Windows\\CurrentVersion";

    my $rHandle = PSOpenRegistry($regName, $keyName);

    if ($rHandle == 0) {

    PSDisplayText("Unable to locate registry key");

    return;

    }

    ```'
