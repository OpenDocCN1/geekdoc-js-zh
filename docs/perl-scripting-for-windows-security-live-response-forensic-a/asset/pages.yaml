  md: "# 176 Part III • Monitoring Windows Applications with Perl\n\napplications\
    \ that are not disk intensive. There are always log file writes, movement of\n\
    temporary data, and potential writes for virtual memory use to consider. With\
    \ that in\nmind, we need a script to monitor free disk space.\n\nWhile we could\
    \ use the performance monitor statistics for this, there could be\npot pitfalls\
    \ with that approach. Performance monitor only collects disk\\statistics if they\
    \ are explicitly enabled through the use of a command line action.\nThe alternative\
    \ is to manually check the disk information. While this is slightly\ndore disk\
    \ intensive, it is more reliable and will provide useful information in\nmore\
    \ situations.\n\nThe script shown in Figure III.24 demonstrates how this type\
    \ of free disk space\ncheck can be performed. This script uses the Win32::FileOp\
    \ module, which\nin turn has dependencies on the Data::Lazy, Win32::AbsolutePath,\
    \ and Win32::API modules.\nMore information on the Win32::FileOp module can be\
    \ found at http://search.cpan.org/\ndist/Win32-FileOp-0.14.1/FileOp.pm.\n\n# Figure\
    \ III.24 get_disk_space.pl\n\n```\n#get_disk_space.pl\nuse strict;\nrequire 'thresh.pl';\n\
    use Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\";\n\nmy ($freeSpaceFor,\
    \ my $totalSize, my $totalFreeSpace) = GetDiskFreeSpace $disk;\n\nif ($FreeSpace\
    \ != undef && $totalSize != undef) {\n    my $percentFreeSpace = int(100*($totalFreeSpace\
    \ / $totalSize));\n    &threshold_check(\"free_disk_space\", $percentFreeSpace);\n\
    } else {\n    print \"Unable to get disk status!\\n\";n}\n```\n\nAnd again there\
    \ are changes to our \"thresh.xml\" file to handle this\nadditional monitor. The\
    \ new monitor XML is shown in Figure III.25."
  merge: -1
  pgno: 195
- img_proc: true
  md: "# Figure III.25 free_disk_space Monitor XML\n\n```\n<monitor name=\"free_disk_space\"\
    >\n  <status name=\"red\" value=\"10\" operator=\"equalless\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"yellow\" value=\"20\"\
    \ operator=\"equalless\">\n    <action>email</action>\n  </status>\n  <status\
    \ name=\"green\" value=\"20\" operator=\"greater\">\n    <action>none</action>\n\
    \  </status>\n</monitor>\n```\n\nThis simple script quickly gathers the information\
    \ that we need and provides to it the \"thresh.pl\" script for handling. First,\
    \ we specify the use of the Win32::FileOp module and specifically the \"GetDiskFreeSpace\"\
    \ function. This function pulls the free disk space for the user, the total disk\
    \ space, and the total free disk space from the drive specified in the disk variable.\
    \ We store all of this data into variables with intuitive names for later use.\n\
    \nAfter making sure we were actually able to obtain the data we need through a\
    \ definition check of the appropriate variables, we can move on to doing a quick\
    \ percentage computation. By dividing the free space by the total disk space and\
    \ multiplying by 100, we are able to get the percentage of free space. This is\
    \ a much easier number to work with than specifying the number of free bytes in\
    \ the \"thresh.xml\" file. In order to use this value, we need to drop any data\
    \ after the decimal point and do this by running it through the \"int\" function\
    \ to convert the value to an integer.\n\nLastly, we just call the \"threshold_check\"\
    \ function and specify the monitor and value. This takes the data we added to\
    \ the \"thresh.xml\" file and handles the actions appropriate to the thresholds\
    \ specified.\n\n# Monitoring Remote Disk Availability\n\nIn some cases you may\
    \ need to ensure that a remote share is both available and has sufficient free\
    \ space available for your users. We can write a quick script for performing this\
    \ function as well using the Win32::FileOp module. Since this need is similar\
    \ to the need to gather local disk information, we can combine these scripts into\
    \ a single script for the purpose of validating disk and free space availability.\
    \ Figure III.26 shows how this can be accomplished."
