    Recovery, is a computer forensics and incident response consultant based out of
    the Northern/VA/Metro DC area. He currently provides emergency incident response
    and computer forensic analysis services to clients throughout the U.S. His specialties
    include focusing specifically on the Windows 2000 and later platforms with regard
    to incident response, Registry and memory analysis, and post-mortem computer forensic
    analysis. Harlan’s background includes positions as a consultant performing vulnerability
