    \ (or BIN) a fairly straightforward process.\n\nThe track data is a bit different\
    \ because it includes the credit card number (a.k.a., primary account, or PAN).\
    \ Track 1 data has the following format (keep in mind that this is a simple overview):\n\
    \nB(PAN)-(Name)^(Other data)\n\nTrack 1 data starts with a format code \"B\",\
    \ and is followed by the PAN and the \"^\" separator. The Name field is 19 characters\
    \ long and is made up of ASCII characters; this is followed by another \"^\" separator,\
    \ and 18 digits of data, the first four of which should be the expiry (expiry)\
    \ date of the credit card. If you are parsing through a flat ASCII file that contains\
    \ one search for track 1 on each line, you might parse it through Perl code that\
    \ looks like this (the scalar $file is the name of the track that holds our):\n\
