  md: '# Accessing the Registry


    There are also times during incident response, or even during simple troubleshooting
    tasks, that you may want to query the Registry for specific information, such
    as check for the existence of a particular key or value, determine a value''s
    data, or determine the LastWrite time of a Registry key. Also, certain portions,
    or "hives" within the Registry are not accessible when the system is shut down.
    For example, the HKEY_CURRENT_USER hive is only accessible to the user that is
    logged on; when the system is shut down, hive is no longer available.


    In other cases, the information you collect from the Registry may affect your
    follow-on investigation. For example, does the pagefile cleared during a clean
    or even shutdown? Has the updating of last access times disabled? Many times,
    this (and other information like it) ahead of time can save you later, or even
    redirect your next steps.


    # Bho.pl


    Browser Helper Objects (BHOs) are essentially dynamic link library (DLL) files
    that add functionality to the Internet Explorer (IE) Web browser. A popular BHO
    is from Adobe, and it allows you to open PDF files for viewing right there in
    your Web browser. However, malware (spyware, mostly) authors will sometimes create
    malware that installs as a BHO, because malware will automatically be launched
    every time the user runs IE. Malware authors are always looking for novel ways
    of getting their toys to run without any user interaction, and installing as a
    BHO is just one of them.


    Bho.pl appears as follows:


    ```

    # c:\perl\bin\perl.exe

    -----------------------------

    # Bho.pl

    # Perl script to retrieve listing of installed BHOs from a

    # local system

    #n# Usage:

    # C:\Perl>bho.pl [> bholist.txt]

    #n# copyright 2006-2007 H. Carvey, keydet89@yahoo.com

    -----------------------------

    ```'
