    on some delimiter. From there, you may do some matching or grep() searches.

    However with binary files, you''re very often going to start at an offset within
    the file (many times that the offset is 0, or the beginning of the file), read
    in a number of bytes, and then parse those bytes based on some organized, defined
    structure.

    The issue with this is that many times, structure isn''t defined, particularly
    not by the vendor, in the case of analyzing files on Windows systems, would be
    Microsoft.\ This usually forces us to search the Internet looking for resources
    that define the structures, or at least give us a hint or points in the right
    direction to decode the structures ourselves. This can also be in the form of
    C or Visual Basic code that we then translate to Perl.


    # Lsnk.pl


    Windows shortcut files appear on the desktop as well...icons.When the user double-clicks
    the shortcut files, the actual file or application itself, which is not on the
    desktop, open.The Windows shortcut file contains a variety of information about
    the file to which it points, much of which may be extremely useful to an investigator.
    For, when a user double-clicks, an image or movie file that is stored on a CD
    or thumb drive, a Windows shortcut file is created in the Documents section of
    the user''s start menu. If external storage media is removed, the Windows shortcut
    file will still remain. The same is true when the file is downloaded, viewed,
    and then deleted.


    Windows shortcut files consist of a binary format that was decoded (well, actually
    reverse engineered) by Jesse Hager (the format is located online as a PDF file).¹
    The Llnk.pl Perl script is an implementation of that format decoding.


    ```

    #!c:\bin\perl.exe

    #-

    # lsnk.pl

    # Perl script to parse a shortcut (LNK) file and retrieve data

    #

    # Usage:

    # C:\Perl\lsnk.pl <filename> [ report.txt]

    #

    # This script is intended to be used against LNK files

    # extracted from

    # from an image, or for LNK files located on a system

    ```


    > ¹ http://www.i2s-lab.com/Papers/The_Windows_Shortcut_File_Format.pdf'
