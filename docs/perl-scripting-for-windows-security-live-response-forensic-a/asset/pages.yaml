    where applicable.");

    PSDisplayText("Also, values with time-timestamped data are sorted by time,

    in reverse order, sc=");

    PSDisplayText("that timeline the user activity is done more readily.");

    PSDisplayText("\n");

    my $ids = ();

    $numRegs = PSGetNumRegistries();

    if ($numRegs == 0) {

    PSDisplayText("No registries to process");

    return;

    }

    $regName = PSGetRegistryAt(0);

    PSRefreshRegistry($regName);

    ----------------------------------------------------------------------

    my $hiveName = "HKEY_Users";

