  md: '# Master Craftsman


    # Getting Even More Information


    You can extend the getsys.pl script to get things such as the current system time,
    the current Universal Coordinated Time (UTC) (UTC is analogous to Greenwich Mean
    Time [GMT]), the system name, the name of the logged on user, and so forth. For
    example, to get the system name, you might use the GetComputerNameA2 API function,
    and to get the name of the logged on user, you might use the GetUserNameA3 API
    function.


    Retrieving information from a Windows system via the API can be useful, but it
    can also lead to problems. Many times APIs will change between versions of Windows
    (such as between Windows 2000 and XP), or they may even change when a Service
    Pack is installed or updated. As such, direct use of the Windows API to collect
    some information from systems should be thoroughly tested before being deployed
    on a widespread basis.


    # WMI


    The Windows Management Instrumentation (WMI) is a great way to obtain information
    from live Windows systems. WMI is really nothing more than many of the hard-core
    details of accessing the Windows API that have been encapsulated and much easier
    to use. Instead of writing code that accesses a system to determine what version
    of Windows it is and then take appropriate steps on that version, an administrator
    can write code that will (in most cases) consistently across Windows 2000 all
    the way through Vista. This means an administrator or incident responder can request
    a list of the active processes from systems from across the enterprise, either
    locally on the host systems or remotely from a centrally located management console,
    and use the same code to get the same results, regardless of the version of Windows
    being queried. The advantage of this is that during incident response, many times
    tools work better on some than others and some tools simply do not work at all.


    ² http://msdn2.microsoft.com/en-us/library/ms724295.aspx

    ³ http://msdn2.microsoft.com/en-us/library/ms724432.aspx'
  merge: -1
