- img_proc: true
  md: "# Monitoring Windows Applications with Perl • Part III\n\nIn the code sample\
    \ in Figure III.6, we first create a new instance of the Win32::Process:: object\
    \ and call it Spi. Next, we call the \"GetProcInfo\" function of the module to\
    \ gather the process information into the \"procinfo\" list. Cycling through each\
    \ member of the list, we then print the process ID and name for each running process\
    \ by displaying the \"ProcessId\" and \"Name\" keys associated with the process.\n\
    \nNow that we have a query for the processes running on a system, we need to work\
    \ with that data and find a single process that we are interested in. The \"GetProcInfo\"\
    \ function, when called with no parameters, loads all of the data it obtains into\
    \ a list of anonymous hashes. Using this list, we can find a process by either\
    \ process ID or executable name by comparing the value we are looking for against\
    \ \"ProcessId\" or \"Name\" key, respectively.\n\nSome programs, when started,\
    \ create a \"PID\" file containing the process ID for the process being running.\
    \ This is more common on UNIX operating systems, Windows applications use the\
    \ same standard. If this is the case, the application creates a file called <application>.pid\
    \ in the working directory for the application. Reading the value stored in this\
    \ file allows us to obtain the specific process ID and use it to get the process\
    \ and the value utilized. The code in Figure III.7 shows how this file could be\
    \ read and utilized to check on the process.\n\n# Figure III.7 get_process_status_id.pl\n\
    \n```\n#get_process_status_id.pl\nuse strict;\nuse Win32::Process::Info;\nmy $Spi\
    \ = $Win32::Process::Info->new();\nmy $procinfo = $Spi->GetProcInfo();\nmy $procstatus=0;\n\
    \nmy $result = open OPENFILE, \"C:\\dis\\komodo.pid\";\nif ($result) {\n    chomp($Spiddata\
    \ = <PIDFILE>);\n    for my $Spid ($procinfo) {\n        if ($Spid->(\"ProcessId\"\
    ) == $Spiddata) {\n            print $Spid->(\"Name\"). is running!\";\n     \
    \       $procstatus=1;\n        }\n    }\n    if ($procstatus==1) {\n        print\
    \ \"Process Spiddata cannot be found!\";\n    }\n} else {\n    print \"PID not\
    \ found in PID file.\";\n}\n}else {\n    print \"PID file not found.\";\n}\n```"
  merge: -1
  pgno: 166
- img_proc: true
  md: "# 148 Part III • Monitoring Windows Applications with Perl\n\nIn the code shown\
    \ in Figure III.7, we use the Win32::Process::Info module in a manner similar\
    \ to that in Figure III.6, but add in some additional features. The first major\
    \ change is the definition of the PID file, opening the file, and reading the\
    \ process ID from the first line of the file. We also use the \"chomp\" function\
    \ to get rid of any new line characters. Then we cycle through all of the hashes\
    \ provided by the \"GetProcInfo\" function looking for the process ID gathered\
    \ from the PID file. If it is found, note that the process is running (including\
    \ the executable name) and changing the $procstatus to a value of 1. Later, we\
    \ check this variable and if the value is not 1, we display a message stating\
    \ that the process is not found. This implies that the process is either not running\
    \ or that the PID information is incorrect. Consequently, the process ID gathered\
    \ from the PID file is included in the message for validation purposes.\n\nUsing\
    \ this, we can also find a process by its name. This allows us additional flexibility\
    \ in our monitoring so we do not rely on applications creating their own PID files.\
    \ Figure III.8 shows an example of how this code can be modified to check the\
    \ availability of a process using its name rather than its process ID.\n\n# Figure\
    \ III.8 get_process_status_name.pl\n\n```\n#get_process_status_name.pl\nuse strict;\n\
    use Win32::Process::Info;\nmy $spi = Win32::Process::Info->new();\nmy $procinfo\
    \ = $spi->GetProcInfo();\nmy $procstatus=0;\nmy $procname=\"komodo.exe\";\n\n\
    for my $pid (@procinfo) {\n    if ($pid->(\"Name\") eq $procname) {\n        print\
    \ \"$pid->(\"Name\"). is running under \";\n               \"process ID $pid->(\"\
    ProcessId\").!\"\n;\n        $procstatus=1;\n    }\n}\nif ($procstatus!=1) {\n\
    \    print \"Process $procname cannot be found\";\n}\n```\n\nThis is very similar\
    \ to that shown in Figure III.7. The differences are the removal of the file operations\
    \ used for the PID file and changing the search to use the \"Name\" rather than\
    \ the \"ProcessId\" key. This allows us to perform a string comparison"
  merge: -1
