    \ certain sections for use of and maintenance.\n\nIn cases, it makes sense to\
    \ combine certain statistics into a single script as you saw in the example shown\
    \ in Figure III.3. The general rule is to combine when the objects that they act\
    \ upon are similar (e.g., grouping all system-related code together or all core\
    \ process code together). In this instance, however, one of these statistics is\
