    The first column of the output is the object that was found; in case, only the
    processes are shown (I removed the thread of displays as the output too verbose
    and difficult to understand).The second column shows the process identifier (PID)
    while the third column shows the PID of the process. The fourth column shows the
    name, and the fifth column displays the offset of where the process was located
    within the RAM dump file. Finally, the sixth column displays the creation time
    of the process (extracted from the process structure, or “block”) in UTC format.You’ll
    notice that one of the displayed processes, specifically “dd.exe”, has an “(x)”
    after the name.This indicates that the process was exited by the time the RAM
    dump was made, and that process will have an exited time with it.


    > Note

    Lproc.pl and the other associated scripts for parsing information from RAM dumps
    were designed to work on RAM dumps from Windows 2000 system only. There are significant
    changes between operating system versions with regards to how the operating system
    manages memory – not just between versions, but in some instances, between Service
    Packs! Some additional work is required to get these scripts to work on systems
    other than Windows 2000.


