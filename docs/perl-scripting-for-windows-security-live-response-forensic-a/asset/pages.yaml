  md: "# Monitoring Memory Utilization\nfor a Specific Process\n\nNext, we'll be looking\
    \ at the memory utilization for a specific process. Again,\nit makes sense to\
    \ combine this with the other information we're gathering from\nthe process CPU\
    \ utilization. We'll add a counter for the \"Process\" object, \"Private\nBytes\"\
    \ counter, and an instance based on the process ID shown in our PID file. Keep\
    \ in\nmind that for any of these examples we use a PID file, you can easily convert\
    \ them\nto use the process name in a manner similar to that shown in Figure III.8.\n\
    \nThis particular counter is described as, \"Private Bytes is the current size,\
    \ in bytes,\nof memory that this process has allocated that cannot be shared with\
    \ other processes\"\nby Microsoft. This should fit our needs and provide useful\
    \ information for our\nmonitoring. The code for this is shown in Figure III.10.\n\
    \n# Figure III.10 get_process_stats.pl\n\n```\n #get_process_stats.pl\nuse Win32::PerfMon;\n\
    use strict;\nuse Win32::Process::Info;\nmy $split = Win32::Process::Info->new();\n\
    my $procinfo = undef;\nmy $procstatus=undef;\nmy $ret = undef;\nmy $err = undef;\n\
    my $object = undef;\nmy $counter = undef;\nmy $CounterData = undef;\n#connect\
    \ to localhost for data\nmy $PerfMon = Win32::PerfMon->new(\\localhost\");\n\n\
    my $result = open PIDFILE, \"C:\\dll\\komodo.pid\";\nif (defined($pidattida) =\
    \ <PIDFILE>) {\n  chomp $pidattida;\n  for my $pid ($split->procinfo()) {\n  \
    \  if ($pid->(\"ProcessId\") == $pidattida) {\n      $procname = $pid->(\"Name\"\
    );\n      print $pid->(\"Name\"), is running!\\n\";n      $procstatus=1;\n   \
    \ }\n  }\n}\n\nif ($procstatus!=1) {\n  print \"Process $pidattida cannot be found\"\
    \n} else {\n  $procname =~ s/^(.+)\\.([^\\.].*)?$\\$/1;;\n```"
