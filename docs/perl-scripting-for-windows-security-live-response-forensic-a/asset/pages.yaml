    # Sorting Time Values


    The uassist pl script be updated to display not only just the values with FILETIME
    objects in their data, but also those values that are sorted in order of the most
    recent value. In the Perl documentation, under perldisc, see what it says about
    "hash-of-lists". You''ll notice that in the uassist pl script, the getTime() function
    takes the8 bytes of the FILETIME object and returns a Unix time value (thanks
    again to Andreas¹³ for letting me borrow his code!), which then has to be run
    through the Perl gmtime() function to get the date to appear in something recognizable
    to people. The Unix time value can be used as the hash key, and the list can be
    all of those value names (decoded, of course) that occurred at that time.


    # ProScripts


    The forensic analysis tool from Technology Pathways¹⁴ called ProDiscover¹⁵ uses
    Perl as its scripting language. This allows the investigator to automate a wide
    variety of the tasks that he or she would perform, so that they can be run from
    a script, rather than having to interact through the graphical user interface
    (GUI). This makes highly repetitive tasks easier and much prone to mistakes.


    # Acquire1.pl


