- img_proc: true
  md: "# Master Craftsman\n\n# Extending the Use of Backticks\n\nYou can use the backticks\
    \ to not only launch applications on the system, or even applications and programs\
    \ external (i.e., not native) to the system, but also to access native commands,\
    \ such as \"`dir`\" \"Dir\" doesn't exist as an executable file on a system, but\
    \ it is an accessible command.\n\nOther things you can include is a list of commands\
    \ in an array (such as dir, netstat -ano, and so forth) and then iterate through\
    \ the list, running each command individually. If you're interested in running\
    \ several commands and correlating the output or filtering the output, the Perl\
    \ lists make that very easy to do.\n\nWe're at the point where we're making our\
    \ jobs a little easier. For example, I can filter through the output, looking\
    \ for a particular Internet Protocol (IP) address, or skipping lines that contain\
    \ the loopback address (127.0.0.1). I can minimize the output, showing only the\
    \ things I want to see, rather than showing everything. I can filter the data,\
    \ showing only those network connections that are in a particular state, such\
    \ as LISTENING, TIME_WAIT, or ESTABLISHED. The point is, we now making our jobs\
    \ easier by running a command of our choosing and being able to manage the output\
    \ of that command.\n\n# Netstat3.pl\n\nThe Win32::Job module provides a bit more\
    \ granularity when creating and running processes, as in netstat3.pl below.\n\n\
    ```\n#! c:\\perl\\bin\\perl.exe\nuse strict;\nuse Win32::Job;\neval {\n    my\
    \ $job = Win32::Job->new();\n    my $result = $job->spawn(\"netstat.exe\", \"\
    netstat.exe -ano\");\n    die \"$E is undefined. \\\"$E\\n\" unless $result;\n\
    \    my $ok = $job->run(60);\n};\n\nprint \"@\\n\" if ($ok);\n```"
