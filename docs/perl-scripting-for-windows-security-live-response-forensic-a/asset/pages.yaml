    scripts that are provided, I was able to put together a ProScript that would allow
    me to connect to a list of systems on which the ProDiscover PDServer was already
    installed and running, and perform a live acquisition of the first hard drive
    (i.e., PhysicalDisk!) from each system. To make things easier, the list of systems
    to connect is maintained in a flat file on the system.


    > ¹³ http://computer.forensikblog.de/en/

    ¹⁴ www.techpathways.com/

    ¹⁵ www.techpathways.com/DesktopDefault.aspx?tabindex=3&tabid=12'
