  md: "# Perl Scripting and Computer Forensic Analysis • Part II 123\n\n(or magnetic\
    \ strip or “track” data) using a regular expression search, or for the analyst\
    \ to use already-written scripts to perform the searches. WithEnCase Forensic\
    \ Edition 5, for example, there is a Credit Card Finder module that is included\
    \ with the Sweep Case EnScript (EnScripts are the user-definable scripting components\
    \ of EnCase). Whether the analyst searches for credit card numbers, or performs\
    \ a more extensive search for track 1 or track 2 data (again, information which\
    \ is maintained on the magnetic strip of the credit card itself), she should not\
    \ be surprised when the search returns hundreds or thousands (tens of thousands)\
    \ of hits.\n\nThe format of the credit card number is quite simple; 13 to 16 digits\
    \ in length (some European cards have 18 or 19 digits), and begin with sequences\
    \ of numbers, referred to as the Bank Identification Number, or BIN. A description\
    \ this general can (and will) return thousands of hits on almost any computer\
    \ system, we have to take another aspect of the credit card number into account.\
    \ In order to be a valid credit card number, the number has to successfully pass\
    \ a check via the Luhn Formula¹⁵ Luhn Formula (or Algorithm) is a modulus 10 checksum\
    \ used to validate credit card numbers. This is not a cryptographic hash function\
    \ used for security purposes, but rather a checksum used for validation. Code\
    \ to perform a Luhn algorithm verification looks like:\n\n```\nsub luhn {\n  \
    \  my $num = shift;\n    my $len = length($num);\n    my @on;\n    foreach (0..($len\
    \ - 1)) {\n        push(@on, substr($num,$\\$, 1));\n    }\n    my @m = reverse\
    \ @on;\n    foreach my $i (0..($len - 1)) {\n        if ($i % 2 == 0) {\n    \
    \        $r[$i] = $m[$i];\n        }\n        else {\n            my $x = $m[$i]\
    \ * 2;\n            ($x > 9) ? ($r[$i] = $x - 9) : ($r[$i] = $x);\n        }\n\
    \    }\n}\n```\n\n¹⁵ http://en.wikipedia.org/wiki/Luhn_algorithm"
