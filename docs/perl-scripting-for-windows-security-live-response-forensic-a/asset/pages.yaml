  md: '# Master Craftsman


    # Working with BitLocker


    Windows Vista and 2008 incorporate an encryption technology referred to as BitLocker.
    There is a Win32_EncryptableVolume⁹ class that allows you to query the system
    and see if BitLocker is enabled. This is important, as encrypted drives pose an
    issue when it comes to acquiring an image of the hard drive. If BitLocker is enabled,
    the investigator may opt to perform a live acquisition of the system, rather than
    shutting down the system and drives in order to acquire the image.


    # Di.pl


    WMI can be used to collect quite a bit more information. For example, there are
    WMI classes that allow you to collect information from other hardware on the system,
    such as disk drives and storage devices. When collecting information about a system,
    its a good idea for the investigator to document the hardware components connected
    to the system. Also, when the system is shut down and images of the drives are
    acquired, the investigator is going to have document information about the drives
    anyway, and WMI can be used to make the job easier. I wrote the Perl script di.pl
    ("di" for "drive information") to do just that, so that I would have complete
    information about the hard drives and storage media attached to the system:


    ```

    #! c:\bin\perl.exe

    ############################################

    # di.pl - Disk ID tool

    # This script is intended to assist investigators in

    # identifying disks

    # attached to systems. It can be used by an investigator to

    # document

    # a disk following acquisition, providing information for use

    # in

    # acquisition worksheets and chain-of-custody documentation.

    ```


    > ⁹ http://msdn2.microsoft.com/en-us/library/aa376483.aspx'
