- img_proc: true
  md: "# Master Craftsman\n\n# End-to-end Web Service Testing\n\nWhile the script\
    \ shown here does a good job at determining whether or not a Web service and all\
    \ its components are functioning, it does not provide a great deal of troubleshooting\
    \ information. As we monitor multiple layers of our applications (system, network,\
    \ database, and so forth), you should consider monitoring multiple layers of the\
    \ Web service to speed up troubleshooting when something goes wrong.\n\nA good\
    \ way to do this without increasing the load on the system is to perform the validation\
    \ test first. If, after running the validation test, the test fails, you can then\
    \ run individual scripts that test each portion of the Web service (i.e., test\
    \ the BPEL process manager, the Web service gateway, and the back data store).\
    \ This will identify where in the stack the problem lies and allow you to get\
    \ everything fixed quickly.\n\nWith that in mind, the next scripts perform a similar\
    \ transaction, and provides a guaranteed value as a result.This result is validated\
    \ and if the validation fails, we generate an alert. This script can be seen in\
    \ Figure III.31 with the corresponding XML for the \"thresh.xml\" file in Figure\
    \ III.32.\n\n# Figure III.31 get_ws_status.pl\n\n```\n@get_ws_status.pl\nuse SOAP::Lite;\n\
    use struct;\nrequire 'thresh.pl';\n\nmy $soap = SOAP::Lite(\n    -> uri('http://www.soaplite.com/Temperatures')\n\
    \    -> proxy('http://services.soaplite.com/temper.cgi');\nmy $result = $soap->f22(32);\n\
    unless ($result->fail) {\n    if ($result->result() == 0) {\n        &threshold_check\
    \ (\"WS_status\", 1);\n    } else {\n        &threshold_check (\"WS_status\",\
    \ 100);\n    }\n}\nelse {\n    &threshold_check (\"WS_status\", 1);\n}\n```"
