    # Swiss Army Knife


    Monitoring Multiple Processes

    You can use then the script shown in Figure III.7 or the other process-specific
    scripts to monitor multiple processes. Just gather information from multiple PID
    files or use process names when gathering your statistical data. For best performance
    of the monitoring script, gather all of the process-specific data first, then
    go through it and display or work with the data as needed.


    # Monitoring CPU Utilizationnfor a Specific Process


    Collecting the overall process utilization for the system is very important, but
    in many cases we may be concerned about the utilization by a single process for
    the application that we are monitoring. So''s modify the script we have developed
    for monitoring CPU utilization shown in Figure III.2 by adding the counter for
    a specific process.


    In order to gather the CPU statistics for the process, we will need to know what
    the process name is. One method of finding the process name based on a process
    ID is shown in Figure III.7. In this example, we''ll assume that we are working
    with a PID file as shown in Figure III.7.


    The counter to use for finding the CPU utilization for a specific process can
    be found by using the "Process" object instead of the "Processor" object that
    we used previously. We can then use the "%Processor Time" counter again, since
    that the statistic we are interested in is. And then, when specifying the instance,
    just use the name of the executable that you want to get information on. In this
    case, we''ll be getting information on the Perl editor Komodo Edit, which was
    also used for the prior examples. This can be seen in Figure III.9.'
