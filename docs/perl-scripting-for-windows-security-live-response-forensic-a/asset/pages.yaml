  md: '# 154 Part III • Monitoring Windows Applications with Perl


    In this example, we modified the get_percentprocessstime_komodo.pl in a manner
    similar to what we did to combine the system statistics. Again, we''re handling
    error messages in an appropriate manner and displaying the data appropriate to
    our specific process. One additional line of code here needs some attention to
    this:


    ```

    $freem = ~ /(?<cpu>\d+)(?<user>\d+)(?<sys>\d+)/g;

    ```


    In this case, we''re formatting the data shown in the $freem variable and storing
    it back in that variable. Why? Simply it looks better when you''re displaying
    a large figure if you add commas to values. This value does not have a decimal
    point, we can quickly format it and redis the value in a "prettier" manner.


    It should also be noted that the data gathered from this performance counter is
    different from that shown in Windows Task Manager. This not a bug, but a difference
    in the way that memory usage is calculated. Task Manager adds the memory allocated
    to the specific process exclusively with the memory shared with other processes,
    and displays cumulative figure specifically to the process. In truth, neither
    method is 100 percent accurate, but both give an estimate that is close enough
    to use for monitoring purposes. Be sure that you understand that statistics pulled
    in one manner may not necessarily match pulled in another.


    # Setting and Using Thresholds


    When monitoring an application, ideally you want to be able to take action based
    on the data that you receive. For example, you may want to restart a process if
    it goes down. Or perhaps out an e-mail when your system reaches a high percentage
    of utilization. In monitoring terms, thresholds are used for determining when
    these actions should be taken.


    So far''ve written several scripts that allow us to gather important data about
    core processes and the system itself, but we''re not doing anything with that
    data other displaying it. In order to take action based on the data, we need to
    do the following:


    +   * Define which values are okay for each piece of data

    * Define which values are bad for each piece of data

    * Define which values are critically bad for each piece of data


    These can be defined as status colors such as green, yellow, and red, or status
    codes such as good, warning, and critical. Since we''ll be defining thresholds
    for a lot'
