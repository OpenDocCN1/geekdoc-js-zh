  md: '# Event Logs


    Many times, an examination of the Windows Event Log event records will provide
    some useful information that may affect your investigation. The Event Log is capable
    of holding a fairly amazing array of information, from records of failed attempts
    to login into the system to being shutdown and rebooted. When working with the
    Event Log on a live system, most folks will interface with it through the EventViewer.
    One of the techniques that a forensic analyst may use to analyze an Event Log
    during an investigation is to extract the file from within the image and then
    attempt to open the log in the Event Viewer on their analysis. However, this does
    not always work... many analysts have reported an error message stating that the
    Event Log is "corrupt". This message is reported by the Windows API – so what
    if, like the Registry, we can parse the contents of the Event Log files without
    using the API?


    # Evt2xls.pl


    Evt2xls.pl is a Perl script that I developed over time, and found it to be extremely
    useful. I started with a simple script that parsed the .evt file in binary mode,
    and retrieved event records for me, writing out to the console. This got to be
    cumbersome over time, as there was more that I wanted to do with the script, so
    I wrote a module to encapsulate and hide the routines I''d been writing. From
    there, I would have the output sent to the console as comma-separated values,
    after which I would redirect the output to a file and then open that file in Excel.
    However, the date format was never write, and the messages would have commas...both
    of these threw off my analysis. So, I added some code to write the event records
    to a spreadsheet that is binary compatible with MS Excel (via the Spreadsheet::WriteExcel
    module) and also added some code to handle some frequency analysis of event IDs.


