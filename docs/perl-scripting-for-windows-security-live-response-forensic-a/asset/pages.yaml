  md: '# Monitoring Windows Applications with Perl • Part III 163


    Make sure that you keep this behavior in mind when using these scripts for monitoring.
    If a status condition is moving from green to yellow, to red, you will receive
    actions for all of the conditions if they overlap. If you need to handle these
    conditions separately, you can modify the evaluation logic by stopping the evaluation
    when a match is found working in a specific order (so that it doesn''t stop evaluation
    at a match in yellow when it would have matched a red condition), or setting a
    condition variable and updating it as the condition becomes progressively worse
    (i.e., update the variable from yellow to red, but not from red).


    One additional thing to note prior to moving on examining the “take_action” subroutine
    in detail, is the last line of the code sample. The “1;” line is critical to ensuring
    that this code functions properly. Since we''re including the thresh.pl file in
    another Perl script, the “use” statement must evaluate to true when the thresh.pl
    script is loaded. To accomplish this, we add “1;” as the last line of the script.


    # Taking Action


    Again, our “take_action” subroutine is very simple and just outputs the two variables
    that are passed to it. This is where we can have some fun and define all of our
    possible actions for various conditions! You can do anything want here such as
    call a script to automatically put in a ticket in your helpdesk system, send a
    Simple Network Management Protocol (SNMP) trap, or even page an application administrator.
    For our example, we will set up an e-mail action and a page action using an e-mail-based
    paging device. This will basically be the same e-mail functionality, but the messages
    will have to be formed differently due to text space limitations for the pager.


    Figure III.17 shows how our “thresh.pl” script can be expanded to include some
    error checking around the incoming data and the two new actions for e-mailing
    and paging.'
