  md: '# Part I • Perl Scripting and Live Response


    As an example, I was looking up some directions to a location that I needed to
    visit, and that I had to provide to a friend. I found the street address of the
    location and selected it in one Web page window, copied it, and pasted it into
    the e-mail that I was preparing to send. Afterward, I ran pclip.pl and this is
    what I got back:


    ```

    Clipboard Contents

    -----------------

    123 Fake Street

    ```


    Imagine what people copy into their clipboards throughout the day, without really
    understanding what happens. I suggest that just as an experiment, you should go
    around an office or a school, or you can even do this at home, and simply open
    a Notepad window, place the cursor anywhere within the window, and press Ctrl-V.
    Whatever is in the clipboard will be pasted into Notepad. Pclip.pl allows you
    to automate this collection process.


    # Running Processes


    When performing live response, we are working with and interacting with a live,
    running system. Many times, when responding to an incident, a user may be logged
    into the system. In some cases, such as employee workstations within an organization,
    this user may be the employee themselves. In others, such as in server rooms and
    data centers, this user will most likely be a system administrator. Often, an
    incident will occur and we will need to log into the system ourselves (as a consultant,
    I always have the system administrator da to) in order to obtain information from
    a system. The point is in order to collect information from a live system, there
    has to be an account logged into the system, either at the console (via the keyboard)
    or over the network.


    As the system is live and running, there are processes running, threads being
    executed, and code being processed. This is how we interact with the system; we
    "ask" the system for information by running processes ourselves. Our Perl scripts
    will help process processes, but many times it is much easier to run external,
    third-party tools, or even tools that are native to the system itself, in order
    to get the information we need. For example, let''s say that we''d like to get
    a list of open network connections from a system. The first thing that comes to
    mind as a means of requesting this information from the system is the native utility,
    netstat.exe.


    One question that may immediately come to mind is, if I run netstat.exe (or any
    other tool) from the command line, whether bother to do it via a Perl script?
    Well, there are a couple of good answers to that. One is by including the use
    of'
