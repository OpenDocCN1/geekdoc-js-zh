    # Perl Editors


    When writing Perl scripts, you need an editor of some kind. Back in my early days
    of graduate school (1994), those of us in the Electrical and Computer Engineering
    curriculum would write HTML pages using Notepad as our editor. You can use Notepad
    to write Perl scripts, as well, but I''ve found that using Notepad can make writing
    and troubleshooting Perl scripts harder than it needs to be. When using an editor,
    the things I look for are syntax highlighting or color-coding, automating indenting
    (using curly brackets, etc.), and line numbering. These attributes make it easier
    to recognize my errors when I try running my code, and tracking down when an error
    occurs.'
  merge: -1
