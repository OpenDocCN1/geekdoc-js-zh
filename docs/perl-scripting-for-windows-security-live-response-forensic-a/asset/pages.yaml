  md: '# Master Craftsman


    # Scheduling Your Monitoring Scripts


    After creating the monitoring scripts, you need to monitor your application. You
    will then want to automate the execution of those scripts. This has to be done
    very carefully! If you run your script too frequently, you can cause the script
    to have a performance impact on the system it is monitoring. If you run it too
    infrequently, you run the risk of being notified of problems in the system too
    late to fix them.


    A good rule of thumb is to perform a load test and run the scripts at a variety
    of frequencies. Find the point where the scripts cause minimal to no performance
    impact, but yet run enough that you can be assured of proactive notification in
    the case of an error. It may take some time to find the "sweet spot" for executing
    the monitoring scripts, but it will be worth it when you do.


    Of course, there is no error checking in here to make sure that the dependency
    scripts exist, and so forth. When converting these scripts for your own use, ensure
    that you add appropriate error checking and management to every script. Using
    the master_monitor.pl script basically calls each of our monitoring scripts individually
    and allows them to process their own monitoring routines. You could gain some
    significant advantages in error checking and ease of use by converting these into
    functions or even into modules.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Summary


    As previously mentioned, this is only one way that a monitoring system can be
    written and implemented using Perl. Many other options are available to you, allowing
    you to expand on the work demonstrated in this chapter to create a monitoring
    system that fits your specific needs.


    Creating monitors for each layer of your application(s), validating the result
    of those monitors, and then taking appropriate actions are the foundation of any
    monitoring system. Further enhancements can be done to visually display the results,
    track historical data, and use trending information to analyze the mean time to
    failure or other important statistics. All of these enhancements are “icing on
    the cake” so to speak and rely on the base monitoring foundation to get the data
    to work with. As always, build a strong foundation and it will support anything
    that you put on top of it.'
