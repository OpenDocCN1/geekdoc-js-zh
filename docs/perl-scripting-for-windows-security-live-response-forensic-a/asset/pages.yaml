  md: 'both track 1 and 2 data are found, the PAN exists in multiple files or multiple
    tables in a database, etc. Whatever the reason, you don''t want to keep track
    of 10 copies of the same PAN. A real simple way to go about removing duplicates
    and guaranteeing uniqueness is to create a Perl hash, where the key is the hash
    is the data (PAN, or in the case of our code, name, and expiry date, separated
    by colons) we extracted, and set the value for that to 1 (it could be any value,
    really).


    # Note


    > David Schultze shared this technique for guaranteeing uniqueness in a dataset
    with me back in 1999 when we both worked at the same company. David shared a couple
    of really good programming tips with me, and this is one of them. I like to give
    credit where credit is due ...thanks, David!


    Track 2 data, on the other hand, has the following format:


    (PAN={Other data


    The track 2 data starts with the PAN (13–16 digits) and is followed by a “=” separator,
    and up to 18 digits of additional data, the first four of which should (again)
    be the expiry date for the credit card. Perl code to parse through a flat ASCII
    file containing a track 2 data search hit on each line might look similar to the
    following code:


    ```

    my $cc_nums;

    open(FH,"<", $file) || "Could not open $file:\n$!\n"

    while(<FH>) {

    chomp

    my ($pan,$rest) = split(/=,$_2);

    my $pan = s/[^0-9]//g;

    my $expiry = substr($rest,0,4);

    my $stuff = join('':'',$pan,$expiry);

    $cc_nums{\$stuff} = 1;

    }

    close(FH);

    ```


    This code has a lot of similarities to the code for parsing the track 1 data,
    so I won’t go through it all again.'
