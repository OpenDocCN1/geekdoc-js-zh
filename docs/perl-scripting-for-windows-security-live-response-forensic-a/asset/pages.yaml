  md: '# # Preface


    # # About the Book


    I decided to write this book for a couple of reasons. One was that I''ve now written
    a couple of books that have to do with incident response and forensic analysis
    on Windows systems, and I used a lot of Perl in both books. Okay...I''ll come
    clean...I used nothing (or scripting) languages in general, and may not be entirely
    comfortable with running tools at the command line, but don''t know how...they
    simply aren''t familiar with Perl, with interpreted


    Another reason for writing this book is that contrary popular belief, there is
    no single application available that does everything or provides every function
    an incident responder could possibly need. By“popular”, I''m primarily referring
    to those folks who don''t perform incident response on a regular basis, as well
    as those who hire and have contracts with firms that provide incident responders
    and other consultants. Many times, incident responders (such as myself) will show
    up on-site a pelican case of equipment, CDs and DVDs full of tools and code, all
    of which provides a base capability. From there, what data to retrieve and how
    to view, manipulate, and present that is dependant upon the customer... and no
    two are alike. In the years I have been performing incident response and computer
    forensics, while I have had customers with similar requirements, no two engagements
    have been identical. Talking to other consultants, I have heard the same thing.
    There simply is no such thing as an application'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'xiv Preface


    that will read Event log file, web and FTP server log files, or perhaps entire
    images, and simply give you your answer (was the system compromised, by whom,
    and when) at the push of a button. Significant amounts of data collection, review,
    reduction, analysis, and presentation are required, many times I find myself writing
    Perl scripts to perform one or more of those functions. In fact, I have found
    these scripts to be useful enough for that, I have documented them, cleaned up
    a bit, and provided them for public consumption.


    I really need to point out that this book is not about computer forensic analysis.
    The purpose of this book is to show what can be (and has) done, using Perl, to
    perform incident response, computer forensic analysis, and application monitoring
    on Windows systems. This book is about using Perl to complete computer incident
    response, forensic analysis tasks, and application monitoring, not about the tasks
    themselves, or the actual analysis.


    # Who Should Read this Book


    This book is intended for anyone who has an interest in useful Perl scripting,
    in particular on the Windows platform, for the purpose of incident response, and
    forensic analysis, and application monitoring. While a thorough grounding in scripting
    languages (or in Perl specifically) is not required, it helpful in fully and more
    completely understanding the material and code presented in this book. This book
    contains information that is useful to consultants who perform incident response
    and computer forensics, specifically as those activities pertain to MS Windows
    systems (Windows 2000, XP, 2003, and some Vista). My hope is that not only will
    consultants (such as myself) find this material valuable, but so will system administrators,
    law enforcement officers, and students in undergraduate and graduate programs
    focusing on computer forensics.


    # Getting Started


    # What is Perl?


    Technically, Perl stands for "practical extraction and report language", and was
    originally developed as a general purpose programming language for manipulating
    text, but has grown into something much more. Perl is now used for a wide range
    of purposes, from automating system administration tasks, to use in web-based
    shopping carts, network- and web-development, etc.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Perl is an interpreted language, which means that once you''ve written your
    source code file, you don''t need to compile the code into a standalone executable
    file, the way you do with other programming languages such as C or C++. Rather,
    you launch the interpreter, telling it to run your script, further passing any
    additional arguments that may be necessary. The interpreter checks and translates
    your code into something the operating system can use and understand, then executes
    the commands in the script. This is a high-level view of things, of course, but
    my goal with this book isn''t to teach you the philosophy of interpreted programming
    languages, but instead to give you something you can use.


    Technical descriptions and the design of the programming language aside, Perl
    is a powerful tool for just anyone involved with Perl. Perl is extremely versatile,
    and can be used to perform a wide variety of tasks, some of which we''ll be looking
    at this book.


    # Why use Perl?


    Why use Perl? That''s a great question.


    One reason to use Perl is that it is fairly ubiquitous. There are a great number
    of platforms that have a version or distribution of Perl available. While our
    sole concern in this book is the Windows platform, Perl runs on Linux and Mac
    OS/X, as well as other platforms. What this means is that an examiner is not restricted
    to a specific platform on which to perform forensic analysis using Perl. With
    some care, Perl scripts can be written to run on multiple platforms. I''ve written
    Perl scripts on a Windows system running on Intel hardware that run equally well
    and produced identical output (the same input file) on a Mac PowerPC system. This
    may be a unique concern where an examiner has a preference for her examination
    platform, or has some tools that are specific to that platform that Another concern
    may be when performing static analysis of Windows portable executable (PE) files
    or potentially malicious code. On a Linux or Mac OS/X system, for example, the
    examiner won''t suffer anything if the executable being examined is accidentally
    launched.


    One of the major aspects of incident response and computer forensic analysis that
    I''ve seen is that no incidents or investigations are alike. Even given nearly-identical
    computing infrastructures, different customers have different questions, based
    on their own concerns and the political make-up (i.e., personalities and goals
    of managers, etc.) of their organization. What this means is that when responding
    to an incident or performing forensic analysis, your tools may allow you to extract
    the raw data,'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# xvi Preface


    but you are going to need some method of manipulating, correlating, and presenting
    the data in a manner that is required by the customer.


    I''ve conducted examinations involving MS Outlook PST files, and where one examination
    that I list the attachments by name, another required that I correlate emails
    and attachments found based on a keyword search for filenames within the acquired
    image that were founding during a search using the same list of keywords.


    The point of this is that you''re rarely going to find a commercial or freeware
    application that all you have to do is click a button and the output will be exactly
    what you need, or (if you''re a consultant) what your customer is asking for.
    Most available applications allow you to view the raw data in form, and may assist
    you in doing a mediocre correlation, if any at all. Beyond that, it''s up to the
    examiner to perform any additional correlation and presentation of the data that
    has been found. Sometimes this may require that the examiner translate binary
    into something human-readable using a template or guide; or parsing through hundreds
    (or even thousands) of log entries to extract those that are relevant, or correlate
    data between multiple files. Being able to produce a utility to perform this function
    in fairly short order be of great benefit to an examiner as well as to her investigation.


    Another example that comes to mind is running searches (for keywords, credit card
    numbers, social security numbers, etc.) across an acquired image and getting massive
    amounts of data, on the order of tens (or hundreds) of thousands of hits. These
    may need to be managed by filename path, credit card type, etc., and having to
    do this by hand can take several examiners days or even weeks to perform. However,
    with some programming ability, just-in-time utilities can be written efficiently
    and accurately perform highly repetitive tasks, freeing the examiner to focus
    on other tasks.


    As you can see, Perl has a number of advantages, but those advantages could apply
    to other languages, as well.


    # How is Perl Used Within the Computer Security Community?


    Perl is used extensively within the computer security community. (Not bad for
    an opening sentence, eh?)


    The SleuthKit (http://www.sleuthkit.org) makes use of Perl. From the December
    15, 2003 edition of The Sleuth Kit Informer:'
  merge: -1
  pgno: 12
- img_proc: true
  md: '... it was originally designed to be a CGI script, so it was in one BIG Perl_file
    ...


    Further, the description for The Sleuthkit includes,"...The Sleuth Kit is written
    in C and Perl...",


    The Metasploit Project (http://www.metasploit.org) makes use of Perl. Moore wrote
    the PEX, or Exploit Library, a Perl module that "provides an object-oriented interface
    into common exploit routines.


    ProDiscover, the incident response and computer forensic analysis application
    from Technology Pathways (http://www.techpathways.com) uses Perl as its programming
    language. ProDiscover allows a forensic examiner to acquire images of systems,
    and then open those images for analysis. The ProDiscover graphical user interface
    (GUI) is fairly straightforward and intuitive, but Perl as Scripts, can be used
    to automate tasks within the loaded project. The ProDiscover installation routine
    includes the ActiveState (http://www.activestate.com) ActivePerl distribution,
    as well as the ProScript.pm Perl module that provides the interface so that Perl
    can be used to interact with images loaded into ProDiscover projects. The Incident
    response of ProDiscover also allowed the responder to automate tasks such as distributing
    and connecting the PDServer agents, collecting volatile information, acquiring
    live images, and disconnecting from the agent.


    One of the reasons I use Perl in the work I do is that many times, there are no
    available tools that will do the work I need to do. I am working on one investigation
    where I need to parse Registry files, and on the next one, I need to extract data
    from MS Outlook PST files. I have had multiple cases where I have to parse PST
    files, but the requirements for each case was different: in one case, I had to
    simply obtain a list of file attachment names, whereas in another I had to correlate
    the list of attachment file names to the output of a keyword search. This work
    could be done by hand, but would take an inorder amount of time. However, the
    point is that there are very no available tools or applications that will allow
    you to do everything you need to do; when performing forensic analysis, you may
    have no trouble obtaining the raw data, but that can often be thousands or hundreds
    of thousands of entries, and the analysis of data is the key to the work you need
    to do. Perl offers an excellent solution, in the code that you or someone else
    has previously written can be used to fill the gap quickly, and allow you to complete
    your work efficiently and more importantly, accurately.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Getting Up and Running


    # Installing Perl


    The first thing you need to do in order to get started using Perl is to install
    a distribution for your platform. Perl has been ported to a number of platforms,
    as shown on the Ports page at the Comprehensive Perl Archive Network, or CPAN
    (http://www.cpan.org/ports). The Perl distribution used throughout this book is
    the ActivePerl distribution available from ActiveState. Once you''ve downloaded
    the most recent distribution of Perl, go ahead and install it. I usually install
    Perl into the “C:Perl” directory, but you can install it into whichever directory
    you find most useful.


    # Adding Modules


    Perl ships with quite a number of installed modules. Modules are libraries of
    code that people have written that make repetitive tasks easier. Rather than constantly
    rewriting the code you use from scratch (say, to open sockets and connect to a
    server on the Internet) you can access the functionality you need in any one of
    available modules. To see what modules were installed with Perl, you can click
    your way through the Start menu until you get to the ActivePerl Documentation
    page, which opens in your web browser.


    Another way to manage Perl modules is to use the Perl Package Manager, or “ppm”
    that ship with ActivePerl. You access “ppm” via the command line; simply open
    a command prompt, change directories to your Perl directory, and type “ppm /?”
    to get a list of commands you can use.


    If you''re not entirely comfortable with the command line, you can type “ppm”
    at the command prompt (with nothing else) and the ppm graphical user interface
    (GUI)¹ will open, as illustrated in Figure 1.


    > ¹ http://aspn.activestate.com/ASN/docs/ActivePerl/5.8/faq/ActivePerl-faq2.html#ppm_gui'
  merge: -1
  pgno: 14
