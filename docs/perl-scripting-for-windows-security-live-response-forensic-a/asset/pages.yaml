  md: '# Perl Scripting and Response * Part I 15


    Another advantage of WMI is that it provides a cleaner, easier to use interface
    to some (albeit not all) of what you can access via the Win32::API and Win32::API::
    Prototype modules. For example, you can access information about the microprocessor,
    physical memory, hard drives, and other devices on the systems.


    The Win32::OLE provides the interface through which you can use Perl to access
    the WMI classes. The WMI classes provide access to operating system classes⁴,
    such as classes that provide access to information pertaining to files, processes,
    drivers, networking, operating system settings, and so forth. The computer system
    hardware classes⁵ provide access to information about devices on the system, such
    as the processor(s), hard drives, batteries, fans, and so forth.


    # Fw.pl


    While one advantage of the WMI classes is that they provide a common interface
    to certain aspects of the Windows platform regardless of the operating system,
    one disadvantage is that some versions of Windows have functionality that others
    do not. For example,Windows XP Service Pack 2 and Windows 2003 have a built-in
    firewall that is part of the Security Center, neither Windows NT 4.0 (WMI classes
    were installed as a separate download for Windows NT) nor Windows 2000.


    ```

