    # Uassist.pl


    In Part I, as well as previously in this Part, I provided Perl scripts that could
    be used

    to extract information from the UserAssist keys in the Registry. In Part I, the
    uassist

    pl Perl script could run on a lively system to retrieve the contents of the UserAssist

    key for the currently logged on user, and earlier in this Part, the uassist.pl
    Perl script

    used the Parse::Win32Registry module to retrieve the same information from an

    arrary NTUSER.DAT file that had been extracted from an acquired image. For the

    sake of completeness, I wanted to provide a ProScript that you could use with

    ProDiscover and parse the UserAssist keys from the user registry:


    ```

