  md: "# Monitoring Remote System Availability\n\nWhen monitoring a remote system,\
    \ there are several factors to watch for. First, you want to make sure that the\
    \ system is available on your network. By performing a simple PING check, this\
    \ can easily be confirmed. But that does necessarily mean that the system is actually\
    \ available and providing the services you need. For example, if you are relying\
    \ on the system to respond on a specific port for a service such as SMTP or Hypertext\
    \ Transfer Protocol (HTTP), you would want to ensure that you are able to communicate\
    \ between systems on that port as.\n\nDoing this type of availability check is\
    \ a little more complex, but certainly provides more information to us from a\
    \ monitoring perspective. The easiest test of check for availability along these\
    \ lines would be to open a port on the remote system, confirm that the communication\
    \ successfully takes place, and then close the port. A more complex check would\
    \ involve sending specific data down that communication channel and confirming\
    \ the results, but at this point it would be wiser to build a reusable monitoring\
    \ component that check one or more ports for us.\n\nThe script shown in Figure\
    \ III.22 shows one way that we can accomplish this type of remote system availability\
    \ check using the IO::Socket module. This module is of the default installation\
    \ for ActivePerl.\n\n# Figure III.22 get_port_status.pl\n\n```\n#get_port_status.pl\n\
    use strict;\nrequire 'thresh.pl';\nuse IO::Socket;\n\nmy $portCheck = new IO::Socket::INET\
    \ {\n    PeerAddr => 'localhost',\n    PeerPort => '80',\n    Proto => 'tcp',\n\
    };\n\nif ($portCheck == undef) {\n    $threshold_check(\"*remote_port\", 1);\n\
    } else {\n    $threshold_check(\"*remote_port\", 100);\n}\n\nif ($portCheck !=\
    \ undef) {\n    close($portCheck);\n}\n```"
  merge: -1
  pgno: 193
- img_proc: true
  md: "This also requires a modification to our “thresh.xml” file in order to create\
    \ a threshold\nfor the new monitor. The additional XML for this monitor is shown\
    \ in Figure III.23.\n\n# Figure III.23 remote_port Monitor\n\n```\n<monitor name=\"\
    remote_port\">\n  <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
    \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
    \nIn this script we're doing a very simple check of the port status on the remote\n\
    system. If this test is successful, we learn two things. First, that the remote\
    \ system\nis available and secondly it is accepting connection requests on the\
    \ port we are\nchecking. If this test is unsuccessful, we then know that either\
    \ the remote system\nnor the remote port is not responding.\n\nThe script itself\
    \ begins by adding in the requirement of \"thresh.pl\" and the use of\nIO::Socket.\
    \ Next, we create a new object utilizing the IO::Socket module with the\naddress,\
    \ port, and protocol used by the remote service that we are monitoring. From\n\
    there it's just a matter of checking to see if we were successful in creating\
    \ that\nconnection or not alerting as appropriate.\n\nYou'll note that for the\
    \ status values we use 100 and 1. Normally you would\nexpect to see a 0 and 1\
    \ status code, but remember that with the threshold\nvalidation script we require\
    \ that the values being passed are integers. 0 is not an\ninteger, we have to\
    \ use other values for our status codes.\n\nLastly, and perhaps most importantly,\
    \ we have to do some cleanup. If the \"port Check\"\nobject is defined indicating\
    \ success, we must consequently close that port. You certainly\ndon't want to\
    \ open a huge number of ports on your remote system due to your\nmonitoring script.\
    \ Using the 'close' function we can accomplish this cleanup.\n\n# Monitoring Available\
    \ Disk Space\n\nAnother dependency that is often overlooked is disk space. When\
    \ monitoring an\nap, it is pretty typical to forget that disk space is a requirement\
    \ for"
