  md: "# Perl Scripting and Computer Forensic Analysis • Part II 111\n\nSystem Restore\
    \ Allow the user to “back out” of a software installation and roll back the system\
    \ state to a previous time (say, 3 days ago) when the system was known to be functioning\
    \ properly. While this is extremely useful to the user, it can also be extremely\
    \ useful to an examiner.\n\nOne of the more useful aspects of the restore points\
    \ is, as long as disk space is available, Windows XP will create a restore point\
    \ every 24 hours, as well as when software is installed or uninstalled. Knowing\
    \ this, the examiner can parse through each restore point, extracting information\
    \ about the restore point from the rp.log file. The sysrestore.pl ProScript allows\
    \ you to do this quickly and easily through the ProDiscover interface.\n\n```\n\
    # c:\\perl\\bin\\perl.exe\n```\n\n```\n# SysRestore.pl, version 0.1_20061026\n\
    # ProScript to parse the System Restore subdirectories for\n# rp.log files, and\n\
    # then parse the files for description and creation time info\n```\n\n```\n# Copyright\
