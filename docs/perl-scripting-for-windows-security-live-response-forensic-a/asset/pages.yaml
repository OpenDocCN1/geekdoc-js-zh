- img_proc: true
  md: '# Perl Scripting and Live Response * Part I


    tool or utility in a Perl script (or batch file), we have a form of self-documentation.

    Documentation is a very important aspect of incident response. Second, many of
    the

    tools we may want to run on systems have a number of command-line arguments, and

    i don''t know about you, but sometimes in the heat of the moment, I may not be
    able

    to keep information straight, particularly at 2:30 A.M. When I''m trying to collect

    information from systems that may have been compromised. So, by including the
    tool

    or utility in a Perl script, I have a degree of automation that prevents me from
    making

    mistakes, particularly through repetition. It''s not often that I deal with only
    one

    system, or one tool or utility. Most often, I''m responding to 10, 50, or 100
    systems, and

    i''m running a number of different tools on each of those systems. Using a Perl
    script, I''m

    able to put everything into a single command so when the situation changes, I''m

    prepared. That way, if something happens further down the road and someone asks
    me

    what I did, I can refer back to the Perl script and the copies of the tools I
    run.


    # Netstat1.pl


    Perhaps the simplest way to launch external programs in Perl is to use the system()

    function. The system() function forks a child process from a parent process,

    wa for the child process to complete, and then exits. A very simple use of

    the system() function, using netstat.exe for our example, is as follows:


    ```

    use strict;

    my @args = ("netstat", "-ano");

    system(@args);

    ```


    While this could have been much simpler in a single line, simplicity or

    ellegance isn''t the issue here. What happens when we run this code is that the
    output

    of our command appears at the console, or standard output (i.e., STDOUT). So all

    ''ve really done here is added a layer of abstraction and not really bought ourselves\anything
    useful. In order to save the output of the command, for example, we''d still

    need to use the redirection operator at the command prompt:


    ```

    C:\perl netstat1.pl > netstat.log

    ```'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 6 Part I • Perl Scripting and Live Response


    That''s really no different from using Perl at all:


    ```

    C:>netstat -ano netstat.log

    ```


    So, a bit of extra effort, but it would appear that we really haven''t bought
    ourselves anything. Now, this might be different if we were using this script
    to run multiple commands; after all, wouldn''t we be benefiting from automation?
    During incident response, you''re usually under pressure, either from your boss
    or the clock, or you''re tired because it''s 3:00 A.M., and the first thing that
    will happen is that you''ll forget a command or mistype a command or something
    that will be frustrating under those conditions. By linking the commands together
    into a script, we can now type in a single command, a couple of short keystrokes,
    and have everything run for us. However, at this point, we really don''t have
    anything more than a batch file contained in a Perl script. We haven''t taken
    full advantage of the power of Perl to make our jobs easier.


    # Netstat2.pl


    Another way to run external commands through Perl is to use backticks. Backticks
    are not the single quote operator on your keyboard; rather the backticks are the
    slanted single quote operator. Using the backtick operator, you can access system
    commands or even external commands (replace netstat.exe with your program of choice,
    ensuring that it is located in the PATH). For example, let''s call the following
    code “netstat2.pl":


    ```

    #! c:\bin\perl.exe

    use strict;

    my @netstat = ''netstat -ano'';

    map(print "$_", @netstat);

    ```


    Notice that we launch netstat.exe with the “a","n,” and “o” switches, and collect
    the output of the command, whatever it may be, into a Perl list (or array). From
    there, the script finishes by simply printing out what''s in the list. Now, the
    output of the command isn''t at the console (STDOUT); rather, we''ve got control
    of that output and we can do what we like with it.'
  merge: -1
