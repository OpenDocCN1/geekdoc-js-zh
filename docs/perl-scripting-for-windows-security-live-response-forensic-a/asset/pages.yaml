    # Master Craftsman


    # Drivers for wireless access


    In 2004, Beetle of the Shimmo Group gave a presentation at ToCoor entitled "Wireless
    Weapons of Mass Destruction for Windows." That presentation included a number
    of VBScripts that accessed MSDnis_8021_ classes in order to retrieve Service Set
    Identifiers (SSIDs) "seen" by the wireless adapter, adapter information about
    received signal strength, and so forth. This information can be used in a variety
    of ways. For example, during incident response, you may want to see if a laptop
    or workstation has a wireless adapter enabled, and if so what SSID is connected
    to. However, you can also use this sort of information to triangulate the location
    of rogue access points. Let''s say that you''re in your office, and you suspect
    that there may be a rogue access point installed in another part of the building
    or in building all together. Now, you know where systems with wireless capability
    are located within the building; say, the Chief Executive Officer (CEO) has his
    laptop in his office, and just down the hall and around the corner the Vice President
    of Human Resources (HR) has her laptop in her office. You can then query each
    points that "sees" and the received signal strength of each one. From this information,
    you may be able to determine the approximate location of the rogue access point.'
