  md: '# Monitoring Windows Applications with Perl • Part III


    The example shown above (and all future examples in this chapter) may not be formatted
    in strict adherence to the rules of “readable code,” due to the column limitations
    of the print format. In this code, we’re doing a lot of error detection. A lot
    can go wrong when pulling the performance data ranging from being unable to connect
    to the host system to unable to get data from a specific counter. To make strong
    code, we need to capture as many of these errors as possible and do something
    with them. The Win32::PerfMon makes this easy by returning a “-” whenever it is
    unable to perform a specific function. By noting the place where we receive this
    return code, we can determine what data we want.


    Walking through the code, the first active thing that we do is create an object
    using the Win32::PerfMon module. We’ll name that object $perfmon. Next, we’ll
    add a counter to the object by calling the AddCounter function and pointing to
    the counter we are interested in. The syntax of this is to specify the performance
    monitor object, then the counter, the instance. Next, we collect the data from
    the performance monitor using the CollectData function. This takes a little over
    one second to gather. While technically the poll can be accomplished in less time
    than this, some counters require a one-second delay to be instantiated between
    two data requests in order to properly collect the values. The PerfMon module
    takes this into account and collects the data, sleeps for one second, then collects
    the data a second time.


    After the data is collected, we then must get the value by using the GetCounterValue
    function. This data is stored in the $proctime variable and displayed using the
    print function. If we encounter any errors throughout this process, we display
    an error message followed by the error that the module returns by using the GetErrorText
    function.


    # Monitoring System Memory Utilization


    The next statistic that we will monitor is memory utilization for the system.
    Again, we’ll use the Win32::PerfMon module to gather this data. Since the CPU
    utilization and the system memory utilization are both statistics of the same
    type (both are whole-system related), we can gather both in the same script and
    still adhere to a modular architecture. Figure III.3 shows an example of how this
    can be accomplished.'
  merge: -1
