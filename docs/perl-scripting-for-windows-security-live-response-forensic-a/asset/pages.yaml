    \ = undef;\nmy $Counter = undef;\nmy $CounterData = undef;\n#connect to localhost(\\\
    localhost)\nmy $perfmon = Win32::PerfMon->new(\"\\localhost\");\n\nif($perfmon\
    \ != undef) {\n    $ret = $perfmon->AddCounter(\"Processor\",\n        \"Processor\
    \ Time\", \"_Total\");\n    if($ret != 0) {\n        $ret = $perfmon->CollectData();\n\
