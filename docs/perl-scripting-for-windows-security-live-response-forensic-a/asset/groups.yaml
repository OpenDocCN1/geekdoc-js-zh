    \ or \"hives\" within the Registry are not accessible when the system is shut\
    \ down. For example, the HKEY_CURRENT_USER hive is only accessible to the user\
    \ that is logged on; when the system is shut down, hive is no longer available.\n\
    \nIn other cases, the information you collect from the Registry may affect your\
    \ follow-on investigation. For example, does the pagefile cleared during a clean\
    \ or even shutdown? Has the updating of last access times disabled? Many times,\
    \ this (and other information like it) ahead of time can save you later, or even\
    \ redirect your next steps.\n\n## Bho.pl\n\nBrowser Helper Objects (BHOs) are\
    \ essentially dynamic link library (DLL) files that add functionality to the Internet\
    \ Explorer (IE) Web browser. A popular BHO is from Adobe, and it allows you to\
    \ open PDF files for viewing right there in your Web browser. However, malware\
    \ (spyware, mostly) authors will sometimes create malware that installs as a BHO,\
    \ because malware will automatically be launched every time the user runs IE.\
    \ Malware authors are always looking for novel ways of getting their toys to run\
    \ without any user interaction, and installing as a BHO is just one of them.\n\
    \nBho.pl appears as follows:\n\n```\n# c:\\perl\\bin\\perl.exe\n-----------------------------\n\
    # Bho.pl\n# Perl script to retrieve listing of installed BHOs from a\n# local\
