  - '[PAGE 202]


    # Monitoring Windows Applications with Perl • Part III 183


    purposes the values returned in the script point to a temperature conversion Web
    service hosted by soaplite.com.


    We then create a $result variable to hold the result of the Web service call and
    through the act of assigning this variable, we contact the Web service and call
    "F2c" conversion function passing a value of 61. While this should return a specific
    value for the conversion, we''re not concerned at this point with what that value
    is. Rather, we just need to confirm that a value is returned.


    Handling the returned result provides the logic behind our monitoring. If the
    result is not a fault, we pass the value of 100 to the "threshold_check" function
    indicating that the Web service is responding. If a fault is encountered, however,
    we send a value of 1 and the "threshold_check" function takes the actions specified
    in our "WS_avail" XML.


    # Monitoring Web Service Functionality


    More complex Web services may rely on a host of additional dependencies in order
    to return an expected result. For example, you may be connecting to an Oracle
    Web Service Manager Gateway, for have your request forwarded to a Business Process
    Execution language server, and then to a Web service, pulls data from a remote
    database. This complex chain of transactions will eventually return a result to
    you, but it may not necessarily be what you expected.


    Since any step in this could potentially generate an error, fully testing Web
    service functionality involves sending a request that goes through each step then
    returns a result that should be consistent for validation. If an error is encountered,
    it may be presented as a Web SOAP message but contain an error message rather
    than the result that you are looking for.


    We''ll make the assumption for testing purposes the "f2c" conversion function
    that we used in the last test is actually a complex function that has to go through
    several steps in order to succeed. For example, this completely fictional, let''s
    assume that it takes the value that we need, connects to a BPEL process to convert
    the number to a string, connects to a remote database to do a string match in
    order to find the corresponding Celsius value, runs returns our result. Any failure
    in this chain of transactions could cause a failure, but would not necessarily
    generate a fault to SOAP::Lite.'
  - "[PAGE 203]\n\n# Master Craftsman\n\n# End-to-end Web Service Testing\n\nWhile\
