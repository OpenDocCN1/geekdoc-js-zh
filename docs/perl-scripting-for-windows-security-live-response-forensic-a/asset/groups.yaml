  mdcn: "\n\n## 第三部分 • 使用 Perl 监控 Windows 应用程序\n\n函数，脚本将打印出从 XML 文件导入的完整数据结构。这对于编写处理该结构的代码非常有帮助，因为你可以直观地看到你正在处理的数据元素。\n\
    \n现在我们开始遍历这些数据元素。我们从使用 XML 文件中的监控器（monitors）开始。在遍历每个数据元素时，我们需要记住大多数情况下我们处理的是哈希数组（arrays\
    \ of hashes）。我们的 XML 中的每个元素都包含一个底层结构，但“action”元素除外，它只包含一个简单的数组。当我们将存储在 $data->{monitor}\
    \ 中的数据填充 $monitor 哈希表时，我们可以轻松地处理该哈希表中的数据元素。下一行显示了这一点，我们打印了正在查看的特定监控器的名称。\n\n在打印监控器名称后，我们还需要显示状态和操作信息。我们通过遍历\
    \ $monitor->{status} 和 $status->{action} 中的哈希元素来实现这一点。同样，$action 是被加载为标量值值的数组，而不是哈希表。因此，在打印语句中，我们通过名称引用每个哈希值，但仅显示操作\
    \ $action。这段非常长的打印语句的最后是显示与每个监控器的每个状态相关的操作。\n\n这段代码对于显示我们 XML 中显示的数据并演示如何使用数据很有用，但实际上并没有做什么。它只是作为一种列出机制，以及如何使用\
    \ XML 控制阈值工作方式的示例。因此，让我们创建一个名为“threshold_rules”的子程序，并将其包含在整体阈值管理脚本中以备后参考。\n\n\
    ## 评估阈值\n\n接下来我们需要编写一个脚本，获取我们导入的 XML 并根据从监控脚本中收集的性能指标数据对其进行评估。为了做到这一点，我们将创建一个名为“threshold_check”的子程序来处理数据评估。我们还需要处理操作的评估，为此使用一个名为“take_action”的子程序。图\
