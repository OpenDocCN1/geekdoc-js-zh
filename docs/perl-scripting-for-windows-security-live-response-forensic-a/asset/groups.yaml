    ```\nKeyLastWrite Time = Tue Aug 17 20:27:13 2004 (UTC)\nNo Users\n```\n\nAs you\
    \ can see, samparse.pl displays local user account information based on what is\
    \ extracted from the SAM database. Within the “Group Membership” section, you\
    \ may see series of 4 or 5 digits where you would expect to see a user name, such\
    \ as beneath Administrators group (above). In such cases, these values are relative\
    \ identifiers (RIDs) for domain users. This is an indication that the system being\
    \ examined is (or was, at one point) part of.\n\n# SECParse.pl\n\nLike the SAM\
    \ file within the system32\\config directory, the Security file also contains\
    \ very useful information. In particular, the Security file maintains the audit\
    \ configuration (as seen when running auditpol.exe on a live system) which determines\
    \ which events are audited and recorded in the Windows Event Log. Microsoft Knowledge\
    \ Base article Q246120³ describes how to parse this information from the Security\
    \ file extracted from a Windows NT 4.0 system, and sources available on the Internet\
    \ provide the necessary information in order to allow you to do the same for Windows\
    \ 2000, XP, and 2003 systems.\n\n```\n# c:\\perl\\bin\\perl.exe\n----------------------------------------------------------------------\n\
    # secparse.pl\n# Parse the raw Security file and display the audit policy\n# for\
    \ the system (2000, XP, 2003)\n#\n# Usage: secparse.pl <filename> [ > output_file]\n\
    #\n# NT: http://support.microsoft.com/kb/246120\n# 2K: http://www.jsfaq.com/SF/Tips/Tip.aspx?id=5231\n\
    # http://loguk.blog.com/2004/09/bit-of-windows-internals-recently-internals.\n\
    ```\n\n```\n# copyright 2006-2007 H. Carvey keydet898yahoo.com\n----------------------------------------------------------------------\n\
    ```\n\n```perl\nuse strict;\nuse Parse::Win32Query qw(:REG_);\nmy %win2events\
    \ = (0 => \"System Events\",\n1 => \"Logon Events\",\n2 => \"Object Access\",\n\
    3 => \"Privilege Use\",\n4 => \"Process Tracking\",\n5 => \"Policy Change\",\n\
    6 => \"Account Management\",\n7 => \"Directory Service Access\",\n8 => \"Account\
    \ Logon Events\");\nmyntevents = (0 => \"Restart, Shutdown, Sys\",\n1 => \"Logon/Logoff\"\
    ,\n2 => \"File/Object Access\",\n3 => \"Use of User Rights\",\n4 => \"Process\
    \ Tracking\",\n5 => \"Sec Policy Mgmt\",\n6 => \"User/Grp Mgmt\");\n```\n\n> ³\
    \ http://support.microsoft.com/default.aspx?sc=kb;EN-US;q246120\n\n# Part II •\
    \ Perl Scripting and Computer Forensic Analysis\n\n```perl\nmy %audit = (0 =>\
    \ \"None\", 1 => \"Succ\", 2 => \"Fail\", 3 => \"Both\");\n```\n\n```perl\nmy\
    \ %policy = ();\nmy $file = shift || die \"You must enter a filename.\\\n\";\n\
    die \"$file not found.\\n\" unless (-e $file);\nmy $reg = Parse::Win32Registry->new($file);\n\
    my $root = $reg->get_root_key;\nmy $ts = $root->get_timestamp();\nmy $val = $root->get_value();\n\
    my $adt = $root->data();\nmy $len = length($adt);\n\nif ($enabled) {\n    print\
    \ \"my $enabled = unpack(\"C*\", substr($adt,0));\\\n    my @evts = unpack(\"\
    V*\", substr($adt,4));\n    my $tot = scalar(@evts);\n    print \"LastWrite: $ts\
    \ (UTC)\\nAuditing is enabled.\\n\";\n    if ($tot == 9) {\n    foreach my $n\
    \ (keys(@evts)) {\n        my $tev = $audit{$evts[$n]};\n        $policy{$n} =\
    \ $tev;\n    }\n}elsif ($tot == 7) {\n    foreach my $n (keys(@evts)) {\n    \
    \    my $tev = $audit{$evts[$n]};\n        $policy{$n} = $tev;\n    }\n}\n} else\
    \ {\n    print \"There are $tot audit categories.\\n\";\n}\n```\n\n# Perl Scripting\
    \ and Computer Forensic Analysis • Part II 69\n\n# Perl Scripting and Computer\
    \ Forensic Analysis • Part II 71\n\nforeach my $k (keys %policy) {\n    printf\
    \ \"%-25s %s\\n\",$k,$policy{$k};\n}\nelse {\n    print \"Auditing is not enabled.\\\
    n\";\n}\n```\n\nIn order to run the secparse.pl, simply open a command prompt\
    \ to the directory where script is stored and type the following:\n\n```\nC:\\\
    perlu\\secparse.pl d:\\security\n```\n\nYou'll notice that one of the first things\
