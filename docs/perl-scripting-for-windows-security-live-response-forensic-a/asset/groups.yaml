- md: "\n# Perl Scripting and Live Response • I 23\n\nRJ-45 jack on my computer, is\
    \ not enabled. Figure 1.2 illustrates this information clearly via the Network\
    \ Connections from the Settings menu on the test system.\n\n## Figure 1.2 Network\
    \ Connections Visible On a Test System\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_42_0.png)\n\
    \nUsing scripts such as nic.pl, we can preserve the state of the live system at\
    \ a point in time, either prior to shutting down, or simply to document which\
    \ network connections were enabled and functioning at a specific moment. This\
    \ information may not be readily available to us during a follow-on (i.e., “post-mortem”)\
    \ investigation after an image has been acquired from the system, and will most\
    \ likely be extremely valuable to our investigation.\n\n> Swiss Army Knife\n\n\
    ## Learning More About NICs\n\nAdditional information is at your fingertips when\
    \ accessing the Win32_Network AdapterConfiguration class. For example, you can\
    \ get information about the default gateway, whether Dynamic Host Configuration\
    \ Protocol (DHCP) is enabled, as well as information about the Domain name system\
    \ (DNS) and Internet Packet Exchange (IPX) configurations. Minor modifications\
    \ to nic.pl will make this information available to you.\n\n## Ndis.pl\n\nWMI\
    \ also provides access to Windows drivers through the Windows Driver Model (WDM).\
    \ Figure I.3 demonstrates a dialog box that results from the use of the WBEMTest\
    \ tool, which we listed the WDM classes available on my Windows XP SP 2 system.\
    \ The highlighted class, MSNdis_CurrentPacketFilter, for example, provides us\
    \ with access to the current filters for the NIC (note that a reference link is\
    \ embedded in the comments at the beginning of the script).\n\nFigure I.3 Viewing\
    \ Classes via the WMI Tester Interface (ch1-msndis.tif)\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_43_0.png)\n\
    \nThe ndis.pl script appears as follows:\n\n```perl\n#! c:\\perl\\bin\\perl.exe\n\
    \n# ndis.pl - Perl script to determine settings of NIC:\n# Checks for promiscuous\
    \ mode\n\n# usage: C:\\<perl> ndis.pl\n\n# Copyright 2007 H. Carvey keydet89@yahoo.com\n\
    ```\n\n> www.microsoft.com/technet/scriptcenter/resources/guigui/wbemtest.msp\n\
    \nuse strict;\n\nuse Win32::OLE qw(in);\n\n# OID_GEN_CURRENT_PACKET_FILTER values\
    \ defined in ntdis.h\n\n# http://msdn.microsoft.com/library/default.asp?url=/library/en-us/\n\
    # wcedck5/html/wce51rfoidgencurrentpacketfilter.asp\n\n```perl\nmy $filters =\
    \ (\"NDIS_PACKET_TYPE_DIRECTED\" => 0x00000001,\nNDIS_PACKET_TYPE_MULTICAST\"\
    \ => 0x00000002,\nNDIS_PACKET_TYPE_ALL_MULTICAST\" => 0x00000004,\nNDIS_PACKET_TYPE_BROCAST\"\
    \ => 0x00000008,\nNDIS_PACKET_TYPE_SOURCE_ROUTING\" => 0x00000010,\nNDIS_PACKET_TYPE_PROMISCUOUS\"\
    \ => 0x00000020,\nNDIS_PACKET_TYPE_SMT\" => 0x00000040,\nNDIS_PACKET_TYPE_ALL_LOCAL\"\
    \ => 0x00000080,\nNDIS_PACKET_TYPE_GROUP\" => 0x00000100,\nNDIS_PACKET_TYPE_ALL_FUNCTIONAL\"\
    \ => 0x00000200,\nNDIS_PACKET_TYPE_FUNCTIONAL\" => 0x00000400,\nNDIS_PACKET_TYPE_MAC_FRAME\"\
    \ => 0x00000800);\nmy $server = Win32::NodeName;\nmy $nic = ();\nmy $locatorObj\
    \ = Win32::OLE->Create('WScripting.SWLocator') // die\n  \"Error creating locator\
    \ object: \" . Win32::OLE->LastError();\n$locatorObj->Security->ImpersonationLevel\
    \ = 3;\nmy $serverObj = $locatorObj->ConnectServer($server,'root\\wmi','') //\
    \ die\n\"Error connecting to root\\wmi on server: \" . Win32::OLE->LastError();\n\
    foreach my $ndis ($serverObj->InstancesOf(\"MSndis_CurrentPacketFilter\")) {\n\
    \  if ($ndis->Active) {\n    my $wan = \"WAN Miniport\";\n    next if ($ndis->InstanceName)\
    \ ! m/\\$wan/i;\n    my $instance = (split('/', $ndis->InstanceName))[0];\n  \
    \  $instance =~ s/\\//;\n    $nic{$instance} = 1;\n    my @gpf = ();\n    foreach\
    \ my $f (keys %filters) {\n      push(@gpf,$f) if ($ndis->CurrentPacketFilter\
    \ & $filters{$f});\n    }\n    $nic{$instance} = join(',', @gpf);\n  }\n}\nforeach\
    \ (keys %nic) {\n    my @filt = split(',', $nic{$_});\n    foreach (@filt) {\n\
    \        eq \"NDIS_PACKET_TYPE_PROMISCUOUS\" ? (print \"\\t $f\\n\") : (print\
    \ \"\\t $f\\n\");\n    }\n\n```\n\nAgain, when looking at the ndis.pl script,\
    \ we are most interested in the highlighted class, MSNdis_CurrentPacketFilter.\
    \ This class provides us visibility into the settings and filters for the adapter\
    \ itself. This is important during incident response, because in some cases, an\
    \ intruder may have installed a sniffer and placed the network adapter in \"promiscuous\"\
    \ mode. This means that all of the packets that go by the wire are read by the\
    \ network adapter, not just the ones addressed to system.\n\nRunning ndis.pl on\
    \ my test system, I see:\n\n```\nDell Wireless Miniport\nNDIS_PACKET_TYPE_MULTICAST\n\
    NDIS_PACKET_TYPE_DIRECTED\nNDIS_PACKET_TYPE_BROADCAST\n```\n\nThis output is to\
    \ be expected. I would be concerned if I saw the following included in the output:\n\
    \n```\nNDIS_PACKET_TYPE_PROMISCUOUS\n```\n\nThis would tell me that the network\
    \ adapter is in promiscuous mode and is likely being used for network sniffing.\
    \ Scripts using WMI can be run remotely against other managed systems, such as\
    \ those within a domain, or where the system administrator has local credentials\
    \ on the system. For example, take a look at a line of code from ndis.pl:\n\n\
    ```perl\nmy $serverObj = $locatorObj->ConnectServer($server,'root\\wmi','');\n\
    ```\n\nYou can see that the ConnectServer() function takes four arguments: the\
    \ server, the WMI namespace, and the username and password used to retrieve this\
    \ information. In the code we're using, the administrator is running these scripts\
    \ locally on the system from the account used to log in, so we don't need to provide\
    \ login within the script. Also, you'll notice that earlier in the script, we\
    \ populated the $server variable with the following code:\n\n```perl\nmy $server\
    \ = Win32::NodeName();\n```\n\nWin32::NodeName(), if you remember, is one of the\
    \ built-in Win32 functions. Again, using this function we get the name of the\
    \ local system. However, if the system administrator wanted to reach out to other\
    \ managed Windows 2000, XP, and 2003 systems within it or her domain, or she would\
    \ have to include the name or IP address of the remote system, and the proper\
    \ credentials. In fact, with an accurate list of all systems within the domain,\
    \ he or she could run this script against all systems (some modifications to the\
    \ script are required, of course, but those will be left to the reader) and display\
    \ only those found to have NICs in promiscuous mode.\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_46_0.png)\n\
    \n## Master Craftsman\n\n## Drivers for wireless access\n\nIn 2004, Beetle of\
    \ the Shimmo Group gave a presentation at TechCorp entitled \"Wireless Weapons\
    \ of Mass Destruction for Windows.\" That presentation included a number of VBScripts\
    \ that accessed MSDnis_8021_ classes in order to retrieve Service Set Identifiers\
    \ (SSIDs) \"seen\" by the wireless adapter, adapter information about received\
    \ signal strength, and so forth. This information can be used in a variety of\
    \ ways. For example, during incident response, you may want to see if a laptop\
    \ or workstation has a wireless adapter enabled, and if so what SSID is connected\
    \ to. However, you can also use this sort of information to triangulate the location\
    \ of rogue access points. Let's say that you're in your office, and you suspect\
    \ that there may be a rogue access point installed in another part of the building\
    \ or in building all together. Now, you know where systems with wireless capability\
    \ are located within the building; say, the Chief Executive Officer (CEO) has\
    \ his laptop in his office, and just down the hall and around the corner the Vice\
    \ President of Human Resources (HR) has her laptop in her office. You can then\
    \ query each point that \"sees\" and the received signal strength of each one.\
