    with the data stored in \$data->{monitor}, we can easily work with the data elements
    within this hash. This is shown in the next line where we print the name of the
    specific monitor that we are looking at.


    After printing the monitor name, we then need to display the status and action
    information. We do this by looping through the hash elements in \$monitor->{status}
    and \$status->{action}. Again that \$action is loaded as an array of scalar values,
    not hashes. Therefore, in our print statement, we refer to each hash value by
    name, but just display the action \$action. The end of this very long print statement
    is to show the actions associated with each status for each monitor.


    This is useful code for displaying the data shown in our XML and demonstrating
    how data can be used, but it really doesn''t do very much. It''s just intended
    as a listing mechanism and an example of how we can use XML to control how our
    thresholds work. So let''s make this one subroutine called "threshold_rules" and
    include it in our overall threshold management script for future reference.


    # Evaluating Thresholds


    Next we need to write a script that will take the XML we have imported and evaluate
    it against the performance indicator data we gather from our monitoring scripts.
    To do this, we will create another subroutine called "threshold_check" to handle
    evaluating data. We''ll also need to handle evaluation of actions, we''ll use
    a subroutine called "take_action" for that purpose. The script shown in Figure
    III.14 shows an example of how this can be done.'
