    Figure 1.6 illustrates the value names beneath the Count key, as they appear in
    RegEdit.


    # Figure 1.6 Example of RegEdit Showing One of the UserAssist Key Values


    | HRZR_EHACNGU | REG_BINARY | 81 01 00 00 12 00 00 09 64 b3 ea c7 01 |

    | HRZR_EHACNGU:(ahry) | REG_BINARY | 4f 00 00 00 07 00 00 65 22 db b2 c1 f3 c6
    01 |

    | HRZR_EHACNGU:(C20Q4A50-3RNN-...) | REG_BINARY | 59 01 00 00 00 00 60 30 97 70
    82 b3 c7 01 |

    | HRZR_EHACNGU:(66B0653C5021-...) | REG_BINARY | 50 01 00 00 06 00 00 00 e0 2c
    df 22 eb e1 bn 07 |

    | HRZR_EHACNGU:(871P53B0-420-...) | REG_BINARY | 52 01 00 00 06 00 00 00 b0 b1
    57 9f b7 c7 01 |

    | HRZR_EHACNGU:(66B0A566-09V4-...) | REG_BINARY | 48 01 00 00 04 00 00 00 30 ac
    41 e0 d1 b1 c7 01 |

    | HRZR_EHACNGU:(9111A049-600D1-...) | REG_BINARY | 80 01 00 00 00 00 00 00 31
    d29 2a ea c7 01 |

    | HRZR_EHACNGU:(5R5Q0Q8-P6104-...) | REG_BINARY | 6f 00 00 00 06 00 00 00 50 33
    22 6d 27 08 c7 01 |


    As you can see from Figure 1.6, the value names beneath the Count key are ROT-13
    “encrypted.” This really makes it possible to search the key names using the search
    function in RegEdit¹. While binary in nature, if you look on your own system,
    you will see a number of values that have all zeros in their data. We’ll address
    this in a moment.


    Didier Stevens has a great deal of work in the area of decoding not only the value
    names the UserAssist keys, but also the binary data associated with the values.
    In his blog², he has a GUI tool called (odd enough) “UserAssist” that will parse
    and translate the value names and data for the UserAssist keys on a Windows system.
    Figure 1.7 illustrates the GUI interface of Didier’s UserAssist tool (version
    2.1.0.0).


    > ¹ http://support.microsoft.com/default.aspx?kb=en-us;161678


    > ² http://blog.didierstevens.com/programs/userassist/'
- md: "\n# Figure 1.7 Didier Steivers' UserAssist Tool in Action\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_59_0.png)\n\
    \nAs you see, Didier's tool not only \"decrypts\" the value names, but it parses\
    \ the binary data for each value, as well. This is where the forensic use of the\
    \ UserAssist key is revealed. When a value has that that is 16 bytes long, the\
    \ second DWORD (4-byte) value holds the \"run count,\" which starts incrementing\
    \ at the value of 5. The last two DWORDs (8-bytes, or a QWORD) comprise a FILETIME\
    \ object; that is, the number of 100 nanosecond intervals since January 1, 1601\
    \ tells us, in UTC time, when the action in question (launching an executable,\
    \ and so forth) was last performed by the user.\n\nUserAssist:\n\n```perl\n# c:\\\
    perl\\bin\\perl.exe\n```\n\n- * uassist.pl\n\n# Parse UserAssist keys, and translate\
    \ from ROT-13 encryption\n\n# usage: C:\\perl[perl] uassist.pl [uassist.log]\n\
    \n```perl\n#\n# Copyright 2007 H. Carvey keydet89@yahoo.com\n#-----------------\n\
    #use strict;\nuse Win32::TieRegistry(Delimiter=>\"/\");\nmy @month = qw/Jan Feb\
    \ Mar Apr Jun Jul Aug Sep Oct Dec;\nmy @day = qw/Sun Mon Tue Thu Fri Sat/;\n#-\n\
    # _main\n#\n#-\n\\getKeyValues();\n#\n# Get key values\n#-\nsub getKeyValues {\n\
    my $reg;\nmy $userassist = \"SOFTWARE/Microsoft/Windows/CurrentVersion/Explorer/UserAssist\"\
    ;\nmy $subkey1 = \"5E6AB780-7743-11CF-A12B-00AA004AE837/Count\";\nmy $subkey2\
    \ = \"75408700-EF1F-1DD0-9888-006097DEAC9/Count\";\nif ($reg = $Registry->Open(\"\
    HKEY_CURRENT_USER\", (Access=>KEY_READ))) {\nif (my $ua = $reg->Open($userassist,\
    \ (Access=>KEY_READ))) {\nif (my $key1 = $ua->Open($subkey1, (Access=>KEY_READ)))\
    \ {\nmy @valenames = $key1->ValueNames();\nprint \"[$subkey1] lastwrite\\n\";\n\
    foreach my $value (@valenames) {\nmy $vData = $key1->GetValue($value);\nmy $value\
    \ = tr/N-Za-n-m/A-Za-z/;\nprint $value,\"\\n\";\n}\n}\nelse {\nprint \"Error accessing\
    \ subkey1: \\$! \\n\";\n}\n}\nprint \"\\n\";\nif (my $subkey2 = $ua->Open($subkey2,\
    \ (Access=>KEY_READ))) {\nmy @valenames = $key2->ValueNames();\nprint \"[$subkey2]\
    \ lastwrite\\n\";\nforeach my $value (@valenames) {\nmy (@data,$lastrun, $runcount);\n\
    my $vData = $key2->GetValue($value);\n$value -= tr/N-ZA-Mn-za-m/A-za-z;\nif (length($vData)\
    \ == 16) {\n  @data = unpack(\"*\",$vData);\n  ($data[1] > 5) ? ($rcount = $data[1]\
    \ : 5) : ($lastrun = $data[2],$data[3]);\n  print $value.\"\\n\"\n  if ($lastrun\
    \ == 0) {\n    next;\n  } else {\n    print \"\\t$localtime. ($rcount)\\n\";\n\
    \  }\n} else {\n  print $value.\"\\n\"\n}\nelse {\n  print \"Error accessing $subkey2:\
    \ $! \\n\"\n}\nelse {\n  die \"Error connecting to $userassist key: $! \\n\"\n\
    }\nelse {\n  die \"Error connecting to HKEY_CURRENT_USER hive: $! \\n\"\n}\n```\n\
    \n```perl\n# getTime()\n# Get Unix-style date/time from FILETIME object\n# Input\
    \ : 8 byte FILETIME object\n# Output: Unix-style date/time\n# Thanks goes to Andreas\
    \ Schuster for the below code, which he\n# included in his ptfinder.pl\n#-\n```\n\
    \nsub getTime() {\n  my $lo = shift;\n  my $hi = shift;\n  my $t;\n  if ($lo ==\
    \ 0 && $hi == 0) {\n    $t = 0;\n  } else {\n    $lo = 0xd5e38000;\n    $hi =\
    \ 0x019db1de;\n    $t = int($hi*429.967296 + $lo/1e);\n  }\n  $t = 0 if ($t >\
    \ 0);\n  return $t;\n}\n```\n\nThe uassist.pl script parses through the UserAssist\
    \ keys (only the ones associated with the IE toolbar and the Active Desktop),\
    \ decoding both the ROT—“encrypted” value names and the timestamps from the data\
    \ that contain them. A special thanks goes out to Andreas Schuster; Microsoft\
    \ often uses an 8-byte FILETIME value to store timestamps. This is true within\
    \ the file system itself, but also within the Registry. Registry keys have LastWrite\
    \ times associated with them and in some cases, with UserAssist keys, Registry\
    \ values will contain data that is also a FILETIME object. In uassist.pl script\
    \ above, the getTime() function is based on the code that Andreas developed to\
    \ accurately translate the 4-byte Unix representation of the 8-byte FILETIME object.\
    \ This way, the time value can be parsed, using gmtime() or localtime() functions\
    \ within Perl, or (with uassist.pl script) used as a value to store, as illustrated\
    \ in the following:\n\n| Path | Date/Time |\n| :--- | :--- |\n| D:\\python.exe\
    \ | Thu May 3 14:20:37 2007 |\n| D:\\VMware-workstation-0-4573.exe | Fri May 11\
    \ 18:26:33 2007 |\n| C:\\Program Files\\Real\\RealPlayer.exe | Wed Aug 29 12:04\
    \ 2007 |\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_63_0.png)\n\n# Sorting Values\n\
    \nThe uassist.pl script be updated to display not just the values with FILETIME\
    \ objects in their data, but also those values that are sorted in order of the\
    \ most recent value. In Perl documentation, under perlist, see what it says about\
    \ \"lists\". You'll notice that in uassist.pl script, the getTime() function takes\
    \ 8 bytes of the FILETIME object and returns a Unix time value (thanks again for\
    \ letting me borrow his code!), which then has to run through the localtime()\
    \ function to get the date to appear in something recognizable to people. The\
    \ Unix time value can be used as key, and the list can be all of those value names\
    \ (decoded, of course) that occurred at that time.\n\n# ProScripts\n\nThe forensic\
    \ analysis tool called ProDiscover uses Perl as its scripting language. This allows\
    \ the investigator to automate a wide variety of the tasks he or she would perform,\
    \ so that they can be run from a script rather than having to interact through\
    \ the graphical user interface (GUI). This makes highly repetitive tasks easier\
    \ and prone to mistakes.\n\n# Acquire.pl\n\nUsing the ProScript API that ships\
    \ with ProDiscover, with some of the example scripts that are provided, I was\
    \ able to put together ProScript that would allow me to connect to a list of systems\
    \ on which ProDiscover was already installed and running, and perform a live acquisition\
    \ of the first hard drive (i.e., PhysicalDisk!) from each system. To make things\
    \ easier, the list of systems to connect is maintained in a flat file on the system.\n\
    \n```perl\n#! c:\\perl\\bin\\perl.exe\n---------------------------------------\n\
    # Acquire.pl\n#\n# Connect to a PDServer running on a specific system, and\n#\
    \ acquire an image of PhysicalDisk\n#\n# The image is created in dd format\n#\n\
    # A file containing the MD5 checksum for the image file is\n# automatically created,\
    \ as is IOError file.\n#\n# Author: Harlan Carvey, keydet89@yahoo.com\n---------------------------------------\n\
    use strict;\nuse ProScript;\n---------------------------------------\n# Set up\
    \ variables\n# These can be changed as needed; absolute paths are required\n---------------------------------------\n\
    \nmy $input_file = \"c:\\prodiscover\\proscript\\hosts.txt\";\nmy $output_dir\
    \ = \"d:\\cases\\images\";\nmy $logfile = $output_dir.\"capturelog.txt\";\n# Load\
    \ IP Addresses from input file\n---------------------------------------\n\nmy\
    \ %ips = ();\nopen(FH,\">\",$input_file);\nwhile(<FH>) {\n\tchomp;\n\tnext if\
    \ ($_ ~ m/#/);\n\tips{$_} = 1;\n}\nclose(FH);\n\nlogData(\"Capture logfile opened\
    \ \".localtime(time));\nlogData(\"Systems to image:\");\nforeach my $ip (keys\
    \ %ips) {\n\tlogData(\"\\t$ip\");\n}\n\nlogData(\"\");\n```\n\n```perl\nforeach\
    \ $ip (keys %ips) {\n# Connect to system\nPSDisplayText(\"Connecting to $ip...\"\
    )\nmy $conn = PSConnect($ip, \"password\");\n# If we are connected notify\nif\
    \ ($conn == 1) {\nPSDisplayText(\"Successfully Connected!\")\nlogData(\"[%localtime(time)]\"\
    ] Connected to $ip\");\n# Acquire image\nmy $source = \"\\PhysicalDrive0\"\nmy\
    \ $dest = \"$output_dir.$ip.img\";\nlogData(\"[%localtime(time)]\"] Imaging source\
    \ to $dest\");\nPSDisplayText(\"Source drive -> $source\")\nPSDisplayText(\"Dest\
    \ file -> $dest\")\nmy $img = PSCreateImage($source,FALSE)\nlogData(\"[%localtime(time)]\"\
    ] Image handle (\".img\") created\")\nif (PSStartCapture($img)) {\nlogData(\"\
    [%localtime(time)]\"] Capturing image\")\nPSDisplayText(\"Image captured.\")\n\
    PSCloseHandle($img);\nPSReleaseRemoteAgent($ip);\nPSDisconnect();\nlogData(\"\
    [%localtime(time)]\"] Imaged captured; $ip agent released and disconnected\")\n\
    logData(\"[%localtime(time)]\")\n}\nelse {\nPSDisplayText(\"Image capture was\
    \ not started on $ip\")\nlogData(\"[%localtime(time)]\"] Image capture not started\
    \ for $ip\")\n}\nelse {\nPSDisplayText(\"Unable to connect to $ip\")\nlogData(\"\
    [%localtime(time)]\"] Unable to connect to $ip\")\n}\n}\n\n#--\n# logData()\n\
    #--\n```\n"
