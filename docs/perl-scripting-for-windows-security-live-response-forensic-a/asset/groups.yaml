  - '[PAGE 200]


    let’s say that you want to check to ensure that a subprocess is functioning. For
    this, you’d just reuse some of the code used in the “get_system_stats.pl” script
    shown in Figure III.19. Need to check to make sure that your system isn’t paging
    too much? That’s another performance monitor counter and can be monitored using
    the same script.


    The purpose of developing the framework for these scripts in this section is to
    provide a great deal of flexibility. By modifying these scripts to fit your needs,
    you can quickly and easily build a robust monitoring system for your applications.
    By making small modifications to the scripts, they can be changed to monitor exactly
    what you need for your specific application.


    Of course, there are some application needs that require a little more complexity.
    The remainder of this chapter deals with these complex monitoring needs and will
    help you in expanding this basic monitoring into a full solution.


    # Web Services


    Web services and Service Oriented Architecture (SOA) are becoming more common
    as a method of interfacing multiple applications. This adds another layer of complexity
    to application monitoring as you rely on the “black box” of a Web service. Typically,
    these Web services do not provide a great deal of information about their internal
    operations. There are a few different monitors that can be built and configured
    to help in ensuring the availability of remote Web services, and we will be discussing
    a few of them here.


    Web services are basically Web-facing interfaces for applications that use a standard
    document format (XML) for messages. Simple Object Access Protocol (SOAP) is the
    protocol used for transferring these XML messages between systems, and forms a
    standard method of access for interfaced systems.


    # Monitoring Web Service Availability


    The first step to monitoring Web services is to make sure that the service is
    available. Similar to monitoring for a database connection, we need to go no further
    than a simple port check for validating Web service availability. There are a
    couple of ways that this can be accomplished. First would be to simply send a
    SOAP message to the Web service you are using and confirm that it responds as
    expected. The second is to send a SOAP message to a test Web service that is built
    specifically for validating availability of the system.'
