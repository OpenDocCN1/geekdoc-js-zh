  - "[PAGE 26]\n\n# Master Craftsman\n\n# Extending the Use of Backticks\n\nYou can\
    \ use the backticks to not only launch applications on the system, or even applications\
    \ and programs external (i.e., not native) to the system, but also to access native\
    \ commands, such as \"`dir`\" \"Dir\" doesn't exist as an executable file on a\
    \ system, but it is an accessible command.\n\nOther things you can include is\
    \ a list of commands in an array (such as dir, netstat -ano, and so forth) and\
    \ then iterate through the list, running each command individually. If you're\
    \ interested in running several commands and correlating the output or filtering\
    \ the output, the Perl lists make that very easy to do.\n\nWe're at the point\
    \ where we're making our jobs a little easier. For example, I can filter through\
    \ the output, looking for a particular Internet Protocol (IP) address, or skipping\
    \ lines that contain the loopback address (127.0.0.1). I can minimize the output,\
    \ showing only the things I want to see, rather than showing everything. I can\
    \ filter the data, showing only those network connections that are in a particular\
    \ state, such as LISTENING, TIME_WAIT, or ESTABLISHED. The point is, we now making\
    \ our jobs easier by running a command of our choosing and being able to manage\
    \ the output of that command.\n\n# Netstat3.pl\n\nThe Win32::Job module provides\
    \ a bit more granularity when creating and running processes, as in netstat3.pl\
    \ below.\n\n```\n#! c:\\perl\\bin\\perl.exe\nuse strict;\nuse Win32::Job;\neval\
    \ {\n    my $job = Win32::Job->new();\n    my $result = $job->spawn(\"netstat.exe\"\
    , \"netstat.exe -ano\");\n    die \"$E is undefined. \\\"$E\\n\" unless $result;\n\
    \    my $ok = $job->run(60);\n};\n\nprint \"@\\n\" if ($ok);\n```"
  - '[PAGE 27]


    # Part I • Perl Scripting and Live Response


    When we run netstat3.pl, we get the same sort of output we would expect if we
    were running the netstat —ano command from the command line; however, in this
    case, we are able to use the Win32::Job module to do things such as limit the
    amount of time that the process runs. In netstat3.pl, we limit that time to 60
    seconds, which is a long time, and probably more than we need in most cases. However,
    I have seen simple command-line tools (such as netstat.exe) hang when run on systems,
    or simply take an inordinate amount of time to run (due to high overhead from
    other processes, and so forth). In such cases, we may want to limit how long the
    process runs, and that''s where Win32::job comes in.


    There are couple of other functions within the Win32::Job module that may be of
    use, depending upon what you''re doing and the level of control of the process
    you wish to achieve. For example, you can use the spawn() function to reduce STDOUT
    and STDERR messages to logs, or use the watch() function to provide a handler
    for the process, in order to achieve an even more granular of control over the
    process. Check the POD for the Win32::job module and for the Win32::Process module,
    for other ideas on how to run external processes from Perl.


    Also notice the use of eval{} block. This allows us to tell Perl to evaluate the
    code, and trap any errors that may occur. One of the big ones that occurred when
    I was writing and testing was that I misspelled the name of the executable (i.e.,
    "nestat.exe"). While this is not an error that would cause a major application
    crash, the error was trapped, nonetheless. The eval{} block is useful for trapping
    errors, and allowing your code to progress in the event of an error that you simply
    wish to recover from (and not have your entire script bomb out!).


    # Accessing the API


    When performing live response or perhaps even analyzing files retrieved from a
    system during live response, you may want to access the Windows API. The Windows
    API can provide some useful functionality, already partially built. Fortunately,
    Microsoft exposes a good portion of the public API via the Microsoft.com Web site,
    and in addition, there are books available that describe other API functions that
    are accessible, although not fully documented.


    In order to access the Windows API, you need to be sure that you have the Win32::API
    module installed. You can check if this module has been installed in your Perl
    distribution by typing the following command at the command prompt.


    ```

    C:\perl> query Win32-api

    ```'
