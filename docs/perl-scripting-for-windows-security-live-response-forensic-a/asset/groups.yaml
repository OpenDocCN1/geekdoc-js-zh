    \ restore points in sequential order, along with the code for the reason that\
    \ the restore point was created, and the date (in UTC) that the restore point\
    \ was created. As you can see from Figure II.6, the system in question was most\
    \ likely a Windows XP system running in a VMware¹¹ session.\n\n## Prefetch.\n\n\
    Besides System Restore Points, another interesting aspect of Windows XP systems\
    \ is that, by default, Windows XP performs prefetching Windows XP also does boot\
    \ prefetching, as well (although Windows 2003 does not perform prefetching by\
    \ default). The long and short of what prefetching does allow on Windows XP to\
    \ start up by storing some information about the application in a fixed location\
    \ (yes, this is an overly-simplified description, but a more detailed description\
    \ is beyond the scope of this book). Windows XP can store up to (*pf) in its Prefetch\
    \ directory, and the Prefetch.pl will allow the examiner to see information about\
    \ the prefetch files.\n\n```perl\n#! c:\\perl\\bin\\perl.exe\n# Prefetch.pl, version\
    \ 0.1.2\n# Copyright 2006-2007 Carvey,\nuse ProScript;\nPSDisplayText(\"Prefetch\
    \ v. 0.1.2\");\n# ProScript to parse the Prefetch directory on Windows XP\n# systems\
    \ and return the filename, time last accessed, and runcount\n# Requires ProDiscover\
    \ v.4 or higher\n# Get the SystemRoot value\nmy $sysinfo = ();\n$numRegs = PSGetRegistries();\n\
    if ($numRegs == 0) {\n    PSDisplayText(\"No registries to process\");\n    return;\n\
    }\n$regName = PSGetRegistry(0);\nPSRefreshRegistry($regName);\nmy $keyName = \"\
    HKEY_LOCAL_MACHINE\\\\Software\\\\CurrentVersion\";\nmy $rHandle = PSOpenRegistry($regName,\
    \ $keyName);\nif ($rHandle == 0) {\n    PSDisplayText(\"Unable to locate registry\
    \ key\");\n    return;\n}\nelse {\n    PSDisplayText(\"Registry opened.\");\n\
    }\n# Access the key in order to get $SystemRoot value\nwhile (1) {\n    $RegKeyInfo\
    \ = &PScript::PSReadRegistry($rHandle) == -1;\n    next if ($RegKeyInfo->($nType)\
    \ == PS_TYPE_KEY);\n    my $value = $RegKeyInfo->($strName);\n    my $data = $RegKeyInfo->($strData);\n\
    \    $sysinfo($value) = $data;\n}\nPSCloseHandle($rHandle);\n\n# Now we have a\
    \ sysinfo hash, and all we want is the \"SystemRoot\" value\nmy $sysroot = $sysinfo(\"\
    SystemRoot\");\n$sysroot = $sysroot unless ($sysroot =~ m/\\//);\n# Note: Make\
    \ sure that the first letter (ie, the drive letter) of the\n# SystemRoot path\
    \ is capitalized; this is an issue with ProDiscover\n$sysroot = lc($sysroot);\n\
    \nmy $objectName = PSObjectName(0);\nmy $path = $objectName.\"$sysroot\\.Prefetch\"\
    ;\nmy $pHandle = PSOpenDir($path,0);\nif ($pHandle == NULL) {\n    PSDisplayText(\"\
    $path not opened.\");\n}\n\nmy $tag = 1;\nwhile (1) {\n    my $file = &PScript::PSReadDirectory($pHandle);\n\
    \    $tag = 0 if ($file == NULL || $file->($strName) == \"\");\n    my $pf = \"\
    pf\";\n    next if ($file->(isDirectory));\n    next unless ($file->($strName)\
    \ =~ m/pf$/);\n    my $filepath = $path.\"\\\\$file->($strName);\n    my ($t_val,$run)\
