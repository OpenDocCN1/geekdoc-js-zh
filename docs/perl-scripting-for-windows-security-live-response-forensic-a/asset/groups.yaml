    On lines 441 through 444, put a "//" at the beginning of the lines to comment
    them out. This should look like the following when:


    ```

    // WIN_APP_disabled = true;

    // WIN_APP_LABEL_disabled = true;

    // DLL_APP_disabled = true;

    // DLL_APP_LABEL_disabled = true;

    ```


    After installing these packages proceed to working with the directory used for
    Visual C++ Expression (such as C:\Program Files\Microsoft Visual Studio 8\VC\bin)
    and run the batch file vc.bat. This batch file sets the environment variables
    used by Visual C++. After loading the environment variables, do not close the
