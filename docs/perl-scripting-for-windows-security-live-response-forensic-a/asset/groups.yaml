  - "[PAGE 193]\n\n# Monitoring Remote System Availability\n\nWhen monitoring a remote\
    \ system, there are several factors to watch for. First, you want to make sure\
    \ that the system is available on your network. By performing a simple PING check,\
    \ this can easily be confirmed. But that does necessarily mean that the system\
    \ is actually available and providing the services you need. For example, if you\
    \ are relying on the system to respond on a specific port for a service such as\
    \ SMTP or Hypertext Transfer Protocol (HTTP), you would want to ensure that you\
    \ are able to communicate between systems on that port as.\n\nDoing this type\
    \ of availability check is a little more complex, but certainly provides more\
    \ information to us from a monitoring perspective. The easiest test of check for\
    \ availability along these lines would be to open a port on the remote system,\
    \ confirm that the communication successfully takes place, and then close the\
    \ port. A more complex check would involve sending specific data down that communication\
    \ channel and confirming the results, but at this point it would be wiser to build\
    \ a reusable monitoring component that check one or more ports for us.\n\nThe\
    \ script shown in Figure III.22 shows one way that we can accomplish this type\
    \ of remote system availability check using the IO::Socket module. This module\
    \ is of the default installation for ActivePerl.\n\n# Figure III.22 get_port_status.pl\n\
    \n```\n#get_port_status.pl\nuse strict;\nrequire 'thresh.pl';\nuse IO::Socket;\n\
    \nmy $portCheck = new IO::Socket::INET {\n    PeerAddr => 'localhost',\n    PeerPort\
    \ => '80',\n    Proto => 'tcp',\n};\n\nif ($portCheck == undef) {\n    $threshold_check(\"\
    *remote_port\", 1);\n} else {\n    $threshold_check(\"*remote_port\", 100);\n\
    }\n\nif ($portCheck != undef) {\n    close($portCheck);\n}\n```"
  - "[PAGE 194]\n\nThis also requires a modification to our “thresh.xml” file in order\
    \ to create a threshold\nfor the new monitor. The additional XML for this monitor\
    \ is shown in Figure III.23.\n\n# Figure III.23 remote_port Monitor\n\n```\n<monitor\
    \ name=\"remote_port\">\n  <status name=\"red\" value=\"1\" operator=\"equal\"\
    >\n    <action>email</action>\n    <action>page</action>\n  </status>\n  <status\
    \ name=\"green\" value=\"100\" operator=\"equal\">\n    <action>none</action>\n\
    \  </status>\n</monitor>\n```\n\nIn this script we're doing a very simple check\
    \ of the port status on the remote\nsystem. If this test is successful, we learn\
    \ two things. First, that the remote system\nis available and secondly it is accepting\
    \ connection requests on the port we are\nchecking. If this test is unsuccessful,\
    \ we then know that either the remote system\nnor the remote port is not responding.\n\
    \nThe script itself begins by adding in the requirement of \"thresh.pl\" and the\
    \ use of\nIO::Socket. Next, we create a new object utilizing the IO::Socket module\
    \ with the\naddress, port, and protocol used by the remote service that we are\
    \ monitoring. From\nthere it's just a matter of checking to see if we were successful\
    \ in creating that\nconnection or not alerting as appropriate.\n\nYou'll note\
    \ that for the status values we use 100 and 1. Normally you would\nexpect to see\
    \ a 0 and 1 status code, but remember that with the threshold\nvalidation script\
    \ we require that the values being passed are integers. 0 is not an\ninteger,\
    \ we have to use other values for our status codes.\n\nLastly, and perhaps most\
    \ importantly, we have to do some cleanup. If the \"port Check\"\nobject is defined\
    \ indicating success, we must consequently close that port. You certainly\ndon't\
    \ want to open a huge number of ports on your remote system due to your\nmonitoring\
    \ script. Using the 'close' function we can accomplish this cleanup.\n\n# Monitoring\
    \ Available Disk Space\n\nAnother dependency that is often overlooked is disk\
    \ space. When monitoring an\nap, it is pretty typical to forget that disk space\
    \ is a requirement for"
  - "[PAGE 195]\n\n# 176 Part III • Monitoring Windows Applications with Perl\n\n\
    applications that are not disk intensive. There are always log file writes, movement\
    \ of\ntemporary data, and potential writes for virtual memory use to consider.\
    \ With that in\nmind, we need a script to monitor free disk space.\n\nWhile we\
    \ could use the performance monitor statistics for this, there could be\npot pitfalls\
    \ with that approach. Performance monitor only collects disk\\statistics if they\
    \ are explicitly enabled through the use of a command line action.\nThe alternative\
    \ is to manually check the disk information. While this is slightly\ndore disk\
    \ intensive, it is more reliable and will provide useful information in\nmore\
    \ situations.\n\nThe script shown in Figure III.24 demonstrates how this type\
    \ of free disk space\ncheck can be performed. This script uses the Win32::FileOp\
    \ module, which\nin turn has dependencies on the Data::Lazy, Win32::AbsolutePath,\
    \ and Win32::API modules.\nMore information on the Win32::FileOp module can be\
    \ found at http://search.cpan.org/\ndist/Win32-FileOp-0.14.1/FileOp.pm.\n\n# Figure\
    \ III.24 get_disk_space.pl\n\n```\n#get_disk_space.pl\nuse strict;\nrequire 'thresh.pl';\n\
    use Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\";\n\nmy ($freeSpaceFor,\
    \ my $totalSize, my $totalFreeSpace) = GetDiskFreeSpace $disk;\n\nif ($FreeSpace\
    \ != undef && $totalSize != undef) {\n    my $percentFreeSpace = int(100*($totalFreeSpace\
    \ / $totalSize));\n    &threshold_check(\"free_disk_space\", $percentFreeSpace);\n\
    } else {\n    print \"Unable to get disk status!\\n\";n}\n```\n\nAnd again there\
    \ are changes to our \"thresh.xml\" file to handle this\nadditional monitor. The\
    \ new monitor XML is shown in Figure III.25."
  - "[PAGE 196]\n\n# Figure III.25 free_disk_space Monitor XML\n\n```\n<monitor name=\"\
    free_disk_space\">\n  <status name=\"red\" value=\"10\" operator=\"equalless\"\
    >\n    <action>email</action>\n    <action>page</action>\n  </status>\n  <status\
    \ name=\"yellow\" value=\"20\" operator=\"equalless\">\n    <action>email</action>\n\
    \  </status>\n  <status name=\"green\" value=\"20\" operator=\"greater\">\n  \
    \  <action>none</action>\n  </status>\n</monitor>\n```\n\nThis simple script quickly\
    \ gathers the information that we need and provides to it the \"thresh.pl\" script\
    \ for handling. First, we specify the use of the Win32::FileOp module and specifically\
    \ the \"GetDiskFreeSpace\" function. This function pulls the free disk space for\
    \ the user, the total disk space, and the total free disk space from the drive\
    \ specified in the disk variable. We store all of this data into variables with\
    \ intuitive names for later use.\n\nAfter making sure we were actually able to\
    \ obtain the data we need through a definition check of the appropriate variables,\
    \ we can move on to doing a quick percentage computation. By dividing the free\
    \ space by the total disk space and multiplying by 100, we are able to get the\
    \ percentage of free space. This is a much easier number to work with than specifying\
    \ the number of free bytes in the \"thresh.xml\" file. In order to use this value,\
    \ we need to drop any data after the decimal point and do this by running it through\
    \ the \"int\" function to convert the value to an integer.\n\nLastly, we just\
    \ call the \"threshold_check\" function and specify the monitor and value. This\
    \ takes the data we added to the \"thresh.xml\" file and handles the actions appropriate\
    \ to the thresholds specified.\n\n# Monitoring Remote Disk Availability\n\nIn\
    \ some cases you may need to ensure that a remote share is both available and\
    \ has sufficient free space available for your users. We can write a quick script\
    \ for performing this function as well using the Win32::FileOp module. Since this\
    \ need is similar to the need to gather local disk information, we can combine\
    \ these scripts into a single script for the purpose of validating disk and free\
    \ space availability. Figure III.26 shows how this can be accomplished."
  - "[PAGE 197]\n\nPart III • Monitoring Windows Applications with Perl\n\n# Figure\
    \ III.26 get_disk_info.pl\n\n```\n#get_disk_info.pl\nuse strict;\nrequire 'thresh.pl';\n\
    use Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\";\nmy $remote_disk=\"\
    z:\";\nmy $remote_share=\"\\\\\\\\\\\\\\\\\\\\\\\\scripts\";\nmy $freeSpaceUser,\
    \ $totalSize, $totalFreeSpace, my\n$percentFree;\n\n($freeSpaceUser, $totalSize,\
    \ $totalFreeSpace) =\n    = GetDiskFreeSpace $disk;\nif ($totalSpace != undef\
    \ && $totalSize != undef) {\n    $percentFree = int(100*($totalFreeSpace/\n  \
    \  $totalSize));\n    $threshold_check(\"free_disk_space\", $percentFree);\n}\
    \ else {\n    print \"Unable to get disk status!\\n\";\n    $threshold_check(\"\
    free_disk_space\", 1);\n}\n\n($freeSpaceUser, $totalSize, $totalFreeSpace) =\n\
    \    = GetDiskFreeSpace $remote_disk;\nif ($totalSpace != undef && $totalSize\
