    \n印于美国\n\n1 2 3 4 5 6 7 8 9 0\n\nISBN 13: 978-1-59749-173-0\n\n编辑：Andrew Williams\n\
    技术编辑：Dave Kleiman\n\n页面设计与艺术：SPI\n文字编辑：Judy Eby\n\n有关权利、翻译和批量销售的信息，请联系 Syngress\
    \ Publishing 的商业销售与权利总监 Matt Pedersen，邮箱：m.pedersen@syngress.com。\n\n致 Terri 和\
    \ Kylie\n\n# 作者\n\nHarlan Carvey (CISSP) 是广受好评的Windows 取证与事件恢复》的作者，是一位位于弗吉尼亚州北部/华盛顿大都会地区的计算机取证和事件响应顾问。他目前为美国各地的客户提供应急事件响应和计算机取证分析服务。他的专业领域专门针对\
    \ Windows 2000 及后续平台的事件响应、注册表和内存分析以及事后计算机取证分析。Harlan 的背景包括担任漏洞评估和渗透测试的顾问，以及全职安全工程师。他还曾为联邦政府机构提供事件响应和计算机取证服务。\n\
    \nHarlan 拥有弗吉尼亚军事学院的电气工程学士学位和海军研究生后学校的电气工程硕士学位。\n\nHarlan 感谢他的妻子 Terri 在撰写第二本书的整个过程中给予的支持、耐心和幽默感。\n\
    \nHarlan 写了第一部分和第二部分。\n\n# 技术编辑\n\nDave Kleiman (CAS, CCE, CIFI, CEECS, CISM,\
    \ CISP, ISSAP, ISSMP, MCSE, MVP) 自1990年起一直从事独立技术安全领域。目前，他经营着名为 Dave Kleiman 的独立公司，专注于诉讼支持、计算机取证调查、事件响应。他开发了\
    \ Windows操作系统锁定工具 S-Lok，该工具超越了 NSA、NIST 和微软标准。他是许多安全会议的演讲者，也是安全相关简报、网站和论坛的定期投稿者。Dave\
    \ 是许多专业组织的成员，包括迈密电子犯罪小组 (MECTF)、国际取证协会 (IACIS)、信息系统取证协会 (ISFA)、取证调查员协会、信息系统审计和控制协会\
    \ (ISACA)、技术调查协会 (HTCIA)、认证欺诈调查员协会 (ACFE)、技术犯罪协会 (HTCC) 和国际反恐安全专业人士协会 (IACSP)。他还是\
    \ FBI InfraGard 的首席员工。\n\nDave 是 Syngress 多本书籍的作者，包括《Log Parser Toolkit》(Syngress,\
    \ ISBN: 193226520)、《Managing and Securing a Cisco SWAN》(ISBN: 193226917)、《C# for\
    \ Java Programmers》(ISBN: 193183654)、《Snort 2.0 Intrusion Detection》(ISBN: 193183644)\
    \ 以及《Security+ Study Guide & DVD Training System》(ISBN: 193183728)。\n\nJeremy\
    \ 写了第三部分。\n\n# 贡献作者\n\n**Jeremy Faircloth** (Security+, CCNA, MCSE, MCP+, A+,\
    \ 等) 是 EchoStar Satellite L.L.C. 的 IT 经理，他和团队维护企业 Web 技术。他还担任其他 IT 专业人员的技术资源，利用他的专业知识帮助他们扩展。作为一名拥有13多年实战经验的系统工程师，他已成为多个领域的专家，包括\
    \ Web 开发、数据库管理、企业安全、网络设计和项目管理。Jeremy 贡献了多本 Syngress 书籍，包括《Microsoft Log Parser》(Syngress,\
