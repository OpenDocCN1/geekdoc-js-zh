    # 前言


    ## 关于本书

    我决定写这本书有几个原因。其之一是我已经写过几本关于 Windows 系统事件响应和取证分析的书，并且在这两本书中都使用了大量的 Perl。很多时候，事件响应人员（例如我）并不完全擅长在命令行运行工具，或者不知道如何操作。


    写这本书的另一个原因是，与人们的观点相反，并没有一个单一的应用程序可以完成所有工作，或提供事件响应人员可能需要的每一个功能。我主要指的是那些不经常进行事件响应的人员，以及聘佣事件响应人员和顾问的机构。在我进行事件响应和计算机取证的这些年里，我看到没有任何两个案例是完全相同的。不存在这样一种应用程序可以直接读取事件日志文件、Web
    日志文件，甚至是整个镜像。这需要大量的数据收集、审查、分析和展示；很多时候我发现这些脚本非常有用，以至于我将它们记录下来，经过了简单的清理，并提供给公众使用。


    我真的需要指出，这本书并不是关于取证分析的。这本书的目的是展示如何使用 Perl 在 Windows 系统上执行事件响应、取证分析和应用程序监控。本书关于**如何使用
    Perl 来完成**事件响应、取证分析任务和应用程序监控，而不是关于任务本身或实际的分析过程。


    ## 谁应该读这本书

    本书适用于任何对 Perl 脚本感兴趣的人，特别是在 Windows 平台上，并以用于事件响应、取证分析和应用程序监控为目的。虽然不需要对脚本语言（特别是
    Perl）有深厚的积累，但对于充分且更完整地理解书中介绍的内容和代码会有帮助。本书包含了对执行事件响应和计算机取证的顾问非常有用的信息，特别是当这些活动涉及
    MS Windows 系统（Windows 2000, XP, 2003 和 Vista）时。我的希望不仅是顾问们（如我）能发现这些材料的价值，系统管理员、执法人员以及专注于计算机取证的本科和研究生学生也能受益。


    # 入门


    ## 什么是 Perl？

    从技术上讲，Perl 代表“Practical Extraction and Report Language”（实用提取和报告语言），最初被开发为一种处理文本的通用编程语言，但它已成长为远超它的东西。Perl
    现在被用于许多用途，从自动化系统管理任务到用于 Web 购物购物车、网络开发等。


    Perl 是一种解释型语言，这意味着一旦你写好了源代码文件，就不需要像 C 或 C++ 等其他编程语言那样将代码编译成独立的可执行文件。相反，你只需启动解释器，告诉它运行你的脚本，并传递任何必要的额外参数。解释器检查并并将你的代码转换为操作系统可以使用并理解的内容，然后执行脚本中的命令。当然，这是一个高层面的视角，但我这本书的目标并不是教你解释型语言的哲学，而是给你一些可以使用的东西。


    撇开技术描述和编程语言的设计不，Perl 对于任何涉及 Perl 的人来说都是强大的工具。Perl 极其多功能，可以用于执行各种任务，我们将在书中研究其中一些。


    ## 为什么用 Perl？

    为什么要用 Perl？这是一个很好的问题。


    使用 Perl 的原因之一是它非常无不在。许多平台都提供了 Perl 的版本或发行版。虽然我们唯一关注的是 Windows 平台，但 Perl 也运行在 Linux
    和 Mac OS/X 以及其他平台上。这意味着取证人员并不局限于在特定平台上使用 Perl 进行取证分析。通过努力，Perl 脚本可以写成在多个平台上运行。我曾在运行
    Intel 硬件的 Windows 系统上编写 Perl 脚本，它们在 Mac PowerPC 系统上运行同样良好，并产生相同的输出（相同的输入文件）。这可能是一个独特的考虑，即取证人员对她的检测平台有偏好，或者拥有某些特定于平台的工具。

