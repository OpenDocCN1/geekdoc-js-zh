    \ the right amount of external storage for the images, I could let this script\
    \ run, allowing me to focus on other tasks.\n\n## Final Touches\n\nUsing Perl,\
    \ there's a great deal of information you can retrieve from systems, locally or\
    \ remotely, as part of troubleshooting or investigating an issue. Perl scripts\
    \ can be run from a central management point, reaching out to remote systems to\
    \ collect information, or they can be “compiled” into standalone executables using\
    \ PAR^16, PerlApp^17 or Perl2Exe18 so that they can be run on systems that do\
    \ not have ActiveState's Perl distribution (or any other Perl distribution) installed.\n\
    \n- 16 http://search.cpan.org/?smueller/PAR-0.976/lib/PAR.pm\n- 17 www.activestate.com/Products/perl_dev_kit/\n\
    - 18 www.indigostar.com/perl2exe.htm\n\n## Part II\n\n## Perl Scripting and Computer\
    \ Forensic Analysis\n\nSolutions for this Part:\n\n- Log Files\n- Parsing Binary\
    \ Files\n- Registry\n- Event Logs\n- Parsing RAM Dumps\n- ProScripts\n- Parsing\
    \ Other Data\n\n## Log Files\n\nLog files, even on Windows systems, will often\
    \ be flat ASCII files that contain each log entry on one line. This makes it easy\
    \ to view, but often times log files can be hundreds of kilobytes (KB), even going\
    \ over megabyte (MB) range, depending upon the application generating the logs\
    \ and the amount of traffic. For example, by default, Microsoft's web server Internet\
    \ Information Server (IIS) will write ASCII text files. Perl was originally designed\
    \ to quickly and efficiently parse log files, and on Unix systems, those log files\
    \ are, in many cases, ASCII text parsing normally sized 20 or 30 KB is almost\
    \ nothing. The power of Perl really comes into play when you need to parse several\
    \ hundreds of MB of log files, looking for something specific, such as an IP address,\
    \ or a particular string. For example, when dealing with an incident where SQL\
    \ injection attack has been suspected, I will often run search of the files in\
