- md: "\nvalue of 1 is received, which is already defined due to the values used in\
    \ the XML\nshown in Figure III.25.\n\nYou'll also note that for all of these checks\
    \ we are using different values for which\ndisk we are checking, but using the\
    \ same monitor for the threshold check. Typically,\nthe same values will apply\
    \ for a remote disk as they do for a local disk. If this is not\ncase, you can\
    \ define a new monitor specific to the disks you checking.\n\nIn this script we\
    \ are effectively checking three disks: the local disk, a remote disk\nthat has\
    \ been mapped to a local drive, and a remote disk accessed by its share name.\n\
    These are the most common types of disk access methods that you would use when\n\
    connecting to a disk, and are all easily handled by the Win32::FileOp module.\n\
    \n## Monitoring Remote Databases\n\nWhen an application reaches the enterprise\
    \ level, it frequently separates the presentation\nlayer of the application from\
    \ the data layer. This means that a database is brought into\nthe equation, whether\
    \ local or remote. In order to monitor all dependencies of\napplication, it becomes\
    \ critical to monitor the database used by the application.\n\nWe could reuse\
    \ the \"get_port_status.pl\" script shown in Figure III.22 for\nthis purpose,\
    \ experience shows that while a connection may be able to be made\nto listening\
    \ port for a database, that does not necessarily mean that the database is\navailable.\
    \ This requires a more complex test than a simple port connection.\n\nRather than\
    \ checking the port status, we need to go further and actually connect,\nauthenticate,\
    \ and confirm that the database is returning a valid response. For this\nexample,\
    \ we will be using the DBI module. This module is included in the ActivePerl\n\
    installation and extensive detail on this module can be found http://search.cpan.org/dist/DBI-1.58/\n\
    \nWhile there are other database connection modules available, this allows for\
    \ one\ngreat of flexibility and works well for monitoring purposes. There are\
    \ also many\ndrivers that work with this module to allow for connections to a\
    \ variety of\ndatabase types. In this example, we will be using the DBD:mysql\
    \ module to connect to\na local MySQL database. Details on this specific driver\
    \ can be found http://search.cpan.org/dist/DBD-mysql-3.0002/ and the module can\
    \ be installed through PPM.\n\nThe script shown in Figure III.27 shows a simple\
    \ database availability monitoring\nprocess that goes through all of the steps\
    \ described above, and sends the results\nto the usual thresh script. Additionally,\
    \ the XML shown in Figure III.28 shows the\nnecessary addition to the \"thresh.xml\"\
    \ file to add these monitors.\n\n# Part III • Monitoring Windows Applications\
    \ with Perl\n\n# Figure III.27 get_db_avail.pl\n\n```perl\n#get_db_avail.pl\n\
    use strict;\nrequire 'thresh.pl';\nuse MySQL;\nmy $host=\"localhost\";\nmy $database=\"\
    new_db\";\nmy $user=\"test_user\";\nmy $password=\"test12\";\n\nmy $DBHandle =\
    \ Mysql->connect($host, $database, $user,\n$password);\n\nif ($DBHandle == undef)\
    \ {\n  &threshold_check (\"DB_avail\", 1);\n} else {\n  &threshold_check (\"DB_avail\"\
    , 100);\n}\n\nif ($DBHandle != undef) {\n  undef $DBHandle;\n}\n```\n\n# Figure\
    \ III.28 DB_avail Monitor XML\n\n```\n<monitor name=\"DB_avail\">\n  <status name=\"\
    red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n    <action>page</action>\n\
    \  </status>\n  <status name=\"green\" value=\"100\" operator=\"equal\">\n   \
    \ <action>none</action>\n  </status>\n</monitor>\n```\n\nIn, we are making a connection\
    \ to the MySQL database using the parameters for $host, $database, $user, and\
    \ $password. This connection object is then stored in $DBHandle. Similar to the\
    \ script shown in Figure III.22 for a port check, we then check and see if the\
    \ DBHandle variable is defined. If it is, we successfully make a connection and\
    \ report a \"1\" to the \"threshold_check\" function. Otherwise, we report a \"\
    100\" to indicate a failure. Then we do some cleanup and undef our connection\
    \ to the database. The monitor used is detailed in the XML shown in Figure III.28.\n\
    \n## Monitoring Other Dependencies\n\nNow that we have a few scripts in place\
    \ for monitoring some application dependencies, we have a framework built for\
    \ monitoring a great deal of other dependencies. Simply reuse these scripts as\
    \ needed and convert them to the purpose you need. For example, let’s say that\
    \ you want to check to ensure that a subprocess is functioning. For this, you’d\
    \ just reuse some of the code used in the “get_system_stats.pl” script shown in\
    \ Figure III.19. Need to check to make sure that your system isn’t paging too\
    \ much? That’s another performance monitor counter and can be monitored using\
    \ the same script.\n\nThe purpose of developing the framework for these scripts\
    \ in this section is to provide a great deal of flexibility. By modifying these\
    \ scripts to fit your needs, you can quickly and easily build a robust monitoring\
    \ system for your applications. By making small modifications to the scripts,\
    \ they can be changed to monitor exactly what you need for your specific application.\n\
    \nOf course, there are some application needs that require a little more complexity.\
    \ The remainder of this chapter deals with these complex monitoring needs and\
    \ will help you in expanding this basic monitoring into a full solution.\n\n##\
    \ Web Services\n\nWeb services and Service Oriented Architecture (SOA) are becoming\
    \ more common as a method of interfacing multiple applications. This adds another\
    \ layer of complexity to application monitoring as you rely on the “black box”\
    \ of a Web service. Typically, these Web services do not provide a great deal\
    \ of information about their internal operations. There are a few different monitors\
    \ that can be built and configured to help in ensuring the availability of remote\
    \ Web services, and we will be discussing a few of them here.\n\nWeb services\
    \ are basically Web-facing interfaces for applications that use a standard document\
    \ format (XML) for messages. Simple Object Access Protocol (SOAP) is the protocol\
    \ used for transferring these XML messages between systems, and forms a standard\
    \ method of access for interfaced systems.\n\n## Monitoring Web Service Availability\n\
    \nThe first step to monitoring Web services is to make sure that the service is\
    \ available. Similar to monitoring for a database connection, we need to go no\
    \ further than a simple port check for validating Web service availability. There\
    \ are a couple of ways that this can be accomplished. First would be to simply\
    \ send a SOAP message to the Web service you are using and confirm that it responds\
    \ as expected. The second is to send a SOAP message to a test Web service that\
    \ is built specifically for validating availability of the system.\n\nIn this\
    \ example, we will be using the SOAP::Lite module, which is included with ActivePerl\
    \ or downloaded through PPM. The Web site for SOAP::Lite has a great deal of information\
    \ on how to use the module as well as several test scripts. This information can\
    \ be found at http://www.soaplite.com/\n\nFigure III.29 shows a script for testing\
    \ the availability of a Web service using SOAP This is a quick connectivity test,\
    \ but also sends a valid Web service request as part of the test. The corresponding\
    \ changes to the 'thresh.xml' file to monitor for this are shown in Figure III.30.\n\
    \n# Figure III.29 get_ws_avail.pl\n\n```perl\n#get_ws_avail.pl\nuse SOAP::Lite;\n\
    use strict;\nrequire 'thresh.pl';\n\nmy $soap = SOAP::Lite:\n  ->uri('http://www.soaplite.com/Temperatures')\n\
    \  ->proxy('http://services.soaplite.com/temper.cgi');\nmy $result = $soap->f2c(61);\n\
    unless ($result->fault (\n  $threshold_check(\"WS_avail\", 100);\n);\nelse {\n\
    \  $threshold_check(\"WS_avail\", 1);\n}\n```\n\n# Figure III.30 WS_avail Monitor\
    \ XML\n\n```\n<monitor name=\"WS_avail\">\n  <status name=\"red\" value=\"1\"\
    \ operator=\"equal\">\n    <action>email</action>\n    <action>page</action>\n\
    \  </status>\n  <status name=\"green\" value=\"100\" operator=\"equal\">\n   \
    \ <action>none</action>\n  </status>\n</monitor>\n```\n\nThis script is very similar\
    \ to the database availability monitor script shown in Figure III.27. The main\
    \ difference is that we are connecting to a data source which is a Web service\
    \ using SOAP. Thesoap object is created by passing parameters for the URI and\
    \ proxy to SOAP::Lite. More information on how to configure these parameters can\
    \ be found on the SOAP::Lite Web site at the URL mentioned above, but for our\n"
  mdcn: "\n接收到了值为 1 的值，由于图 III.25 中所示 XML 使用的值，该值已经定义。\n\n你还会注意到，对于所有这些检查，我们为要检查的磁盘使用了不同的值，但在阈值检查时使用了同一个监控器（monitor）。通常情况下，远程磁盘适用的值与本地磁盘相同。如果情况并非如此，你可以针对你正在检查的磁盘定义一个新的特定的监控器。\n\
    \n在此脚本中，我们实际上在检查三个磁盘：本地磁盘、映射到本地驱动器的远程磁盘，以及通过共享名称访问的远程磁盘。这些是你连接到磁盘时最常用的磁盘访问方法类型，并且都可以被\
    \ `Win32::FileOp` 模块轻松处理。\n\n## 监控远程数据库\n\n当应用程序达到企业级水平时，通常会将应用程序的表示层与数据层分离。这意味着数据库被引入了其中，无论是本地还是远程。为了监控应用程序的所有依赖项，监控应用程序使用的数据库变得至关重要。\n\
    \n我们可以重用图 III.22 所示的 \"get_port_status.pl\" 脚本来实现目的。经验表明，虽然可以建立到数据库监听端口的连接，但这并不意味着数据库是可用的。这需要比简单的端口连接更复杂的测试。\n\
    \n与其检查端口状态，我们只需要更进一步，实际上进行连接、身份验证并确认数据库正在返回有效的响应。在本例中，我们将使用 `DBI` 模块。该模块包含在 ActivePerl\
    \ 安装中，关于该模块的详细信息可以在 http://search.cpan.org/dist/DBI-1.58/ 处找到。\n\n虽然还有其他数据库连接模块可用，但它提供了一个极大的灵活性，并且非常适合监控。还有许多驱动与此模块配合，允许连接到各种类型的数据库。在本例中，我们将使用\
    \ `DBD:mysql` 模块连接到本地 MySQL 数据库。关于此特定驱动程序的详情可以在 http://search.cpan.org/dist/DBD-mysql-3.0002/\
    \ 找到，并且可以通过 PPM 安装该模块。\n\n图 III.27 所示的脚本显示了一个简单的数据库可用性监控过程，它通过上述所有步骤，并将结果发送给通常的\
    \ thresh 脚本。此外，图 III.28 所示的 XML 显示了添加这些监控器对 \"thresh.xml\" 文件所做的必要添加。\n\n# 第三部分\
    \ • 使用 Perl 监控 Windows \n\n# 图 III.27 get_db_avail.pl\n\n```perl\n#get_db_avail.pl\n\
    use strict;\nrequire 'thresh.pl';\nuse MySQL;\nmy $host=\"localhost\";\nmy $database=\"\
    new_db\";\nmy $user=\"test_user\";\nmy $password=\"test12\";\n\nmy $DBHandle =\
    \ Mysql->connect($host, $database, $user,\n$password);\n\nif ($DBHandle == undef)\
    \ {\n  &threshold_check (\"DB_avail\", 1);\n} else {\n  &threshold_check (\"DB_avail\"\
    , 100);\n}\n\nif ($DBHandle != undef) {\n  undef $DBHandle;\n}\n```\n\n# 图 III.28\
    \ DB_avail Monitor XML\n\n```\n<monitor name=\"DB_avail\">\n  <status name=\"\
    red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n    <action>page</action>\n\
    \  </status>\n  <status name=\"green\" value=\"100\" operator=\"equal\">\n   \
    \ <action>none</action>\n  </status>\n</monitor>\n```\n\n在图中，我们使用 $host,$database,$user\
    \ 和 $password 参数连接到 MySQL 数据库。该连接对象随后被存储在 $DBHandle 中。与图 III.22 所示的端口检查脚本类似，我们随后检查并查看\
    \ $DBHandle 变量是否已定义。如果已定义，则我们成功地建立了连接，并向 \"threshold_check\" 函数报告一个 \"1\"。否则，我们报告\
    \ \"100\" 表示失败。然后我们进行一些清理工作并对数据库连接进行取消定义（undef）。所使用的监控器在图 III.28 所示的 XML 中详细说明。\n\
    \n## 监控其他依赖项\n\n现在我们已经有了几个脚本来监控某些应用程序依赖项，我们已经建立了一个监控许多其他依赖项的框架。只需根据需要重用这些脚本，并将它们转换为你所需的用途即可。例如，假设你想检查并确保一个子进程正在运行。为此，你只需要重用图\
    \ III.19 所示的 \"get_system_stats.pl\" 脚本中使用的部分代码。需要检查确保你的系统没有过多的分页（paging）吗？那是另一个性能监控计数器，可以使用相同的脚本进行监控。\n\
    \n在本节中开发这些脚本框架的目的是提供巨大的灵活性。通过修改这些脚本来适应你的需求，你可以快速轻松地为你的应用程序构建一个健壮的监控系统。通过对脚本进行微调，可以将它们更改为监控你特定应用程序所需的确切内容。\n\
    \n当然，某些应用程序需求需要更多的复杂性。本章的剩余部分将处理这些复杂的监控需求，并将帮助你将这种基础监控扩展为完整的解决方案。\n\n## Web 服务\n\
    \nWeb 服务和面向服务的架构 (SOA) 正变得成为多个应用程序接口的常用方法。这为监控增加了另一层复杂性。由于依赖于“黑盒”，应用程序监控变得更加复杂。Web\
    \ 服务基本上是使用 XML 格式传输消息的 Web 服务的接口。\n\n## 监控 Web 服务可用性\n\n监控 Web 服务的第一步是确保服务是可用的。与监控数据库类似，我们需要比简单的端口检查更进一步。实现此目标的方法有两种：第一种是向你正在使用的\
    \ Web 服务发送 SOAP 消息并确认其响应；第二种是向专门用于验证可用性的 Web 服务发送 SOAP 消息。\n\n在本例中，我们将使用 `SOAP::Lite`\
    \ 模块，该模块包含在 ActivePerl 中，或者可以通过 PPM 下载。SOAP::Lite 网站上有关于如何使用该模块的大量信息以及几个测试脚本。\n\
    \n图 III.29 显示了一个使用 SOAP 测试 Web 服务可用性的脚本。这是一个快速的连接测试，但作为测试的一部分发送了有效的 Web 服务请求。监控此对\
    \ 'thresh.xml' 文件进行的相应更改见图 III.30。\n\n```perl\n#get_ws_avail.pl\nuse SOAP::Lite;\n\
    use strict;\nrequire 'thresh.pl';\n\nmy $soap = SOAP::Lite:\n  ->uri('http://www.soaplite.com/Temperatures')\n\
    \  ->proxy('http://services.soaplite.com/temper.cgi');\nmy $result = $soap->f2c(61);\n\
    unless ($result->fault (\n  $threshold_check(\"WS_avail\", 100);\n);\nelse {\n\
    \  $threshold_check(\"WS_avail\", 1);\n}\n```\n"
