- md: "\nfor this, but since some paging providers have unique requirements, I have\
    \ separated the two subroutines so that they can be easily modified independently.\n\
    \nFirst, we do some basic error checking to make sure that we have the correct\
    \ number of options sent to the subroutine. Again, expand this checking to include\
    \ necessary checks for your own environment. A good addition would be using regular\
    \ expressions to confirm that the e-mail address is in the right format.\n\nWith\
    \ that in place, we then add in the use of a new module. The Mail::Sender module\
    \ is not included in the base ActivePerl installation, but is very useful for\
    \ handling e-mail related needs. For a full listing of options, please see http://search.cpan.org/dist/Mail-Sender-0.8.13/Sender.pm.\
    \ This module will consequently do all of our e-mail handling so we don't have\
    \ to worry about opening ports manually, creating an Simple Mail Transfer Protocol\
    \ (SMTP) message in the correct format, and so forth.\n\nNext, we create a new\
    \ Mail::Sender object with a variety of options to set our SMTP mail server address,\
    \ \"from\" header, and the error handling option. Then we call the \"Open\" function\
    \ of the object and pass in our incoming variables for the \"to\" and subject\
    \ headers. Finally, we send the message using the \"SendLineEnc\" function. Again,\
    \ all of this is duplicated in the \"action_page\" subroutine with exception of\
    \ the \"from\" header.\n\n## Putting it all Together\n\nBy calling our new subroutine\
