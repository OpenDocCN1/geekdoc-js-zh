    # Preface


    ## About the Book

    I decided to write this book for a couple of reasons. One was that I''ve now written
    a couple of books that have to do with incident response and forensic analysis
    on Windows systems, and I used a lot of Perl in both. Many times incident responders
    (such as myself) are not entirely comfortable with running tools at the command
    line, or don''t know how.


    Another reason for writing this book is that, contrary to belief, there is no
    single application available that does everything or provides every function an
    incident responder could possibly need. I''m primarily referring to folks who
    don''t perform incident response on a regular basis, as well as those who hire
    incident responders and consultants. In the years I have been performing incident
    response and computer forensics, I have seen that no two engagements are alike.
    There is no such thing as an application that will read Event log files, web log
    files, or perhaps entire images. Significant amounts of data collection, review,
    analysis, and presentation are required; many times I find these scripts to be
    useful enough that I have documented them, cleaned up a bit, and provided them
    for public consumption.


    I really need to point out that this book is not about forensic analysis. The
    purpose of this book is to show what can be done using Perl to perform incident
    response, forensic analysis, and application monitoring on Windows systems. This
    book is about using Perl to complete incident response, forensic analysis tasks,
    and application monitoring, not about the tasks themselves or the actual analysis.


    ## Who Should Read this Book

    This book is intended for anyone who has an interest in Perl scripting, in particular
    on the Windows platform, for the purpose of incident response, forensic analysis,
    and application monitoring. While a thorough grounding in scripting languages
    (or in Perl specifically) is not required, it is helpful in fully and more completely
    understanding the material and code presented in this book. This book contains
    information that is useful to consultants who perform incident response and computer
    forensics, specifically as those activities pertain to MS Windows systems (Windows
    2000, XP, 2003, and Vista). My hope is that not only will consultants (such as
    myself) find this material valuable, but so will system administrators, law enforcement
    officers, and students in undergraduate and graduate programs focusing on computer
    forensics.


    # Getting Started


    ## What is Perl?

    Technically, Perl stands for "Practical Extraction and Report Language", and was
    originally developed as a general purpose programming language for manipulating
    text, but has grown into something much more. Perl is now used for a wide range
    of purposes, from automating system administration tasks to use in web-based shopping
    carts, network development, etc.


    Perl is an interpreted language, which means that once you''ve written your source
    code file, you don''t need to compile the code into a standalone executable file
    the way you do with other programming languages such as C or C++. Rather, you
    launch the interpreter, telling it to run your script, further passing any additional
    arguments that may be necessary. The interpreter checks and translates your code
    into something the operating system can use and understand, then executes the
    commands in the script. This is a high-level view of things, of course, but my
    goal with this book isn''t to teach you the philosophy of interpreted programming
    languages, but instead to give you something you can use.


    Technical descriptions and the design of the programming language aside, Perl
    is a powerful tool for just anyone involved with Perl. Perl is extremely versatile,
    and can be used to perform a wide variety of tasks, some of which we''ll be looking
    at this book.


    ## Why use Perl?

    Why use Perl? That''s a great question.


    One reason to use Perl is that it is fairly ubiquitous. There are a great number
    of platforms that have a version or distribution of Perl available. While our
    sole concern in this book is the Windows platform, Perl runs on Linux and Mac
    OS/X, as well as other platforms. What this means is that an examiner is not restricted
    to a specific platform on which to perform forensic analysis using Perl. With
    some care, Perl scripts can be written to run on multiple platforms. I''ve written
    Perl scripts on a Windows system running on Intel hardware that run equally well
    and produced identical output (the same input file) on a Mac PowerPC system. This
    may be a unique concern where an examiner has a preference for her examination
    platform, or has some tools that are specific to that platform. Another concern
    may be when performing static analysis of Windows portable executable (PE) files
    or potentially malicious code. On a Linux or Mac OS/X system, for example, the
    examiner won''t suffer anything if the executable being examined is accidentally
    launched.

