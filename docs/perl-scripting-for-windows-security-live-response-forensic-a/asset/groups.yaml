    # Swiss Army Knife


    # Using Performance Monitor Data


    In these scripts, we have barely touched the surface of the data provided through
    performance monitor. Using the Windows Resource Kit utility "typeperf," you can
    get information on which counters are available from a command-line interface.
    This is much faster than browsing through the PerfMon utility itself.


    Running the command "typeperf-q" will list all counters. We can further refine
    your search by specifying objects to list the counters for. Using the command
    "typeperf-?" will print out for the tool.


    # Monitoring a Core Application Process


    Now that we have some information on the system, we can move on to monitoring
    portions of the application. We''ll start with the core application process and
    its availability as well as its use of system resources. As an application can
    have multiple processes running that provide different functions, we''ll refer
    to the process that serves the purpose of being the parent to the other processes
    as the core process, with any other processes spawned from the parent dependent
    processes.


    # Monitoring Process Availability a Specific Process


    One of the most important things to monitor for a core process is to make sure
    that the process is actually up and running. Statistics such as CPU and memory
    utilization are very important, but they won''t help if the process isn''t running.
    So the first thing we want to monitor is the availability of the core process
    itself.


    In this case, our best for obtaining good process information is to use the Win32::Process::Info
    module. This module can be loaded through PPM and can be found in the default
    ActiveState repository. Figure III.5 shows this module through the graphical user
    interface (GUI) version of PPM.'
  - "[PAGE 165]\n\n# Figure III.5 Win32::Process::Info Module\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_165_0.png)\n\
    \nWin32-Process-Info\nGet information on arbitrary processes in Windows NT\nVersion:\
    \ 1.010\nAuthor: Tom Wyman\nCPAN: http://search.cpan.org/dist/Win32-Process-Info-1.010/\n\
    Install from:\n6938 packages, 1 listed 44 installed, 0 to install, 0 remove Install\
    \ Area: site\n\nThe script in Figure III.6 shows how this module can be used to\
    \ gather information on the processes running on the system. Keep in mind that\
    \ at this point we are not looking for performance information; rather we are\
    \ looking for details on the processes themselves and their availability. First,\
    \ we'll get a list of processes running on the system.\n\n# Figure III.6 get_processes.pl\n\
    \n```\n# get_processes.pl\nuse strict;\nuse Win32::Process::Info;\nmy $spi = Win32::Process::Info->new();\n\
    my @procinfo = $spi->GetProcInfo();\nfor my $pid (@procinfo) {\n    print $pid->(\"\
    ProcessId\").\"\";\n    print $pid->(\"Name\").\"\\n\";\n}\n```"
  - "[PAGE 166]\n\n# Monitoring Windows Applications with Perl • Part III\n\nIn the\
    \ code sample in Figure III.6, we first create a new instance of the Win32::Process::\
    \ object and call it Spi. Next, we call the \"GetProcInfo\" function of the module\
    \ to gather the process information into the \"procinfo\" list. Cycling through\
    \ each member of the list, we then print the process ID and name for each running\
    \ process by displaying the \"ProcessId\" and \"Name\" keys associated with the\
    \ process.\n\nNow that we have a query for the processes running on a system,\
    \ we need to work with that data and find a single process that we are interested\
    \ in. The \"GetProcInfo\" function, when called with no parameters, loads all\
    \ of the data it obtains into a list of anonymous hashes. Using this list, we\
    \ can find a process by either process ID or executable name by comparing the\
    \ value we are looking for against \"ProcessId\" or \"Name\" key, respectively.\n\
    \nSome programs, when started, create a \"PID\" file containing the process ID\
    \ for the process being running. This is more common on UNIX operating systems,\
    \ Windows applications use the same standard. If this is the case, the application\
    \ creates a file called <application>.pid in the working directory for the application.\
    \ Reading the value stored in this file allows us to obtain the specific process\
    \ ID and use it to get the process and the value utilized. The code in Figure\
    \ III.7 shows how this file could be read and utilized to check on the process.\n\
    \n# Figure III.7 get_process_status_id.pl\n\n```\n#get_process_status_id.pl\n\
    use strict;\nuse Win32::Process::Info;\nmy $Spi = $Win32::Process::Info->new();\n\
    my $procinfo = $Spi->GetProcInfo();\nmy $procstatus=0;\n\nmy $result = open OPENFILE,\
    \ \"C:\\dis\\komodo.pid\";\nif ($result) {\n    chomp($Spiddata = <PIDFILE>);\n\
    \    for my $Spid ($procinfo) {\n        if ($Spid->(\"ProcessId\") == $Spiddata)\
    \ {\n            print $Spid->(\"Name\"). is running!\";\n            $procstatus=1;\n\
    \        }\n    }\n    if ($procstatus==1) {\n        print \"Process Spiddata\
    \ cannot be found!\";\n    }\n} else {\n    print \"PID not found in PID file.\"\
    ;\n}\n}else {\n    print \"PID file not found.\";\n}\n```"
- md: "\n# 148 Part III • Monitoring Windows Applications with Perl\n\nIn the code\
    \ shown in Figure III.7, we use the Win32::Process::Info module in a manner similar\
    \ to that in Figure III.6, but add in some additional features. The first major\
    \ change is the definition of the PID file, opening the file, and reading the\
    \ process ID from the first line of the file. We also use the \"chomp\" function\
    \ to get rid of any new line characters. Then we cycle through all of the hashes\
    \ provided by the \"GetProcInfo\" function looking for the process ID gathered\
    \ from the PID file. If it is found, note that the process is running (including\
    \ the executable name) and changing the $procstatus to a value of 1. Later, we\
    \ check this variable and if the value is not 1, we display a message stating\
    \ that the process is not found. This implies that the process is either not running\
    \ or that the PID information is incorrect. Consequently, the process ID gathered\
    \ from the PID file is included in the message for validation purposes.\n\nUsing\
    \ this, we can also find a process by its name. This allows us additional flexibility\
    \ in our monitoring so we do not rely on applications creating their own PID files.\
    \ Figure III.8 shows an example of how this code can be modified to check the\
    \ availability of a process using its name rather than its process ID.\n\n## Figure\
    \ III.8 get_process_status_name.pl\n\n```perl\n#get_process_status_name.pl\nuse\
    \ strict;\nuse Win32::Process::Info;\nmy $spi = Win32::Process::Info->new();\n\
    my $procinfo = $spi->GetProcInfo();\nmy $procstatus=0;\nmy $procname=\"komodo.exe\"\
    ;\n\nfor my $pid (@procinfo) {\n    if ($pid->(\"Name\") eq $procname) {\n   \
    \     print \"$pid->(\"Name\"). is running under \";\n               \"process\
    \ ID $pid->(\"ProcessId\").\"\\n\";\n        $procstatus=1;\n    }\n}\nif ($procstatus!=1)\
    \ {\n    print \"Process $procname cannot be found\";\n}\n```\n\nThis is very\
    \ similar to that shown in Figure III.7. The differences are the removal of the\
    \ file operations used for the PID file and changing the search to use the \"\
    Name\" rather than the \"ProcessId\" key. This allows us to perform a string comparison\
    \ using the defined process name rather than its process ID. The $procstatus variable\
    \ is used in the same manner as it was in the Figure III.7 example.\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_168_0.png)\n\
    \n## Swiss Army Knife\n\n### Monitoring Multiple Processes\nYou can use then the\
    \ script shown in Figure III.7 or the other process-specific scripts to monitor\
    \ multiple processes. Just gather information from multiple PID files or use process\
    \ names when gathering your statistical data. For best performance of the monitoring\
    \ script, gather all of the process-specific data first, then go through it and\
    \ display or work with the data as needed.\n\n## Monitoring CPU Utilization for\
    \ a Specific Process\n\nCollecting the overall process utilization for the system\
    \ is very important, but in many cases we may be concerned about the utilization\
    \ by a single process for the application that we are monitoring. So we modify\
    \ the script we have developed for monitoring CPU utilization shown in Figure\
    \ III.2 by adding the counter for a specific process.\n\nIn order to gather the\
    \ CPU statistics for the process, we will need to know what the process name is.\
    \ One method of finding the process name based on a process ID is shown in Figure\
    \ III.7. In this example, we'll assume that we are working with a PID file as\
    \ shown in Figure III.7.\n\nThe counter to use for finding the CPU utilization\
    \ for a specific process can be found by using the \"Process\" object instead\
    \ of the \"Processor\" object that we used previously. We can then use the \"\
    %Processor Time\" counter again, since that the statistic we are interested in\
    \ is. And then, when specifying the instance, just use the name of the executable\
    \ that you want to get information on. In this case, we'll be getting information\
    \ on the Perl editor Komodo Edit, which was also used for the prior examples.\
    \ This can be seen in Figure III.9.\n\n## Figure III.9 get_percentprocessortime_komodo\n\
    \n```perl\n#get_percentprocessortime_komodo.pl\nuse Win32::PerfMon;\nuse struct;\n\
    use Win32::Process::Info;\nmy $spi = Win32::Process::Info->new();\nmy $procinfo\
    \ = $spi->GetProcInfo();\nmy $procname = undef;\nmy $procstatus = undef;\nmy $ret\
    \ = undef;\nmy $err = undef;\nmy $object = undef;\nmy $Counter = undef;\nmy $CounterData\
    \ = undef;\n# connect to localhost\nmy $perfmon = Win32::PerfMon->new(\"\\localhost\"\
    );\n\nmy $result = open PIPFILE, \"C:\\$spiddata,komodo.pid>\";\nif ($result)\
    \ {\n  if (defined($spiddata) = <PIPFILE>) {\n    chomp $spiddata;\n    if ($Spid->(\"\
    ProcessId\") == $spiddata) {\n      my $procname = $Spid->(\"Name\");\n      print\
    \ \"$procname is running!\\n\";\n      $procstatus=1;\n    }\n  }\n}\n\nif ($procstatus!=1)\
    \ {\n  print \"$spiddata cannot be found\";\n}\n```\n(Note: The OCR text for Figure\
    \ III.9 contained significant corruption in the code block; it has been cleaned\
    \ based on Perl syntax and the context of the previous pages.)\n\n### Monitoring\
    \ Memory Utilization\nNext, we'll be looking at the memory utilization for a specific\
    \ process. Again, it makes sense to combine this with the other information we're\
    \ gathering. In any of these examples we use a PID file. \n\nThis particular counter\
    \ is described as, \"Private Bytes is the current size, in bytes, of memory that\
    \ this process has allocated that cannot be shared with other processes\" by Microsoft.\
    \ This should fit our needs and provide useful information for our monitoring.\
    \ The code for this is shown in Figure III.10.\n\n## Figure III.10 get_process_stats.pl\n\
    \n(Note: The OCR text for Figure III.10 was fragmented and corrupted; the logic\
    \ has been reconstructed based on the semantic flow of the document.)\n"
  mdcn: "\n\n# 148 第三部分 • 使用 Perl 监控 Windows \n\n在图 III.7 所示的代码中，我们使用 `Win32::Process::Info`\
    \ 模块的方式与图 III.6 类似，但增加了一些额外功能。第一个主要变化是定义了 PID 文件、打开文件并从文件的第一行读取进程 ID（PID）。我们还使用\
    \ `chomp` 函数来去除任何换行符。然后，我们遍历 `GetProcInfo` 函数提供的所有哈希表，寻找从 PID 文件收集的进程 ID。如果找到了，则记录该进程正在运行（包括可执行文件名称），并将\
    \ `$procstatus` 设置为 1。稍后，我们检查此变量，如果值不为 1，则显示一条消息说明未找到该进程。这意味着该进程未运行，或者 PID 信息不正确。因此，从\
    \ PID 文件中收集的进程 ID 被包含在消息中以便进行验证。\n\n通过这种方法，我们还可以通过名称找到进程。这为我们的监控提供了额外的灵活性，使我们不再依赖于应用程序创建自己的\
    \ PID 文件。图 III.8 展示了如何修改此代码，以使用进程名称而不是进程 ID 来检查进程的可用性。\n\n## 图 III.8 get_process_status_name.pl\n\
    \n```perl\n#get_process_status_name.pl\nuse strict;\nuse Win32::Process::Info;\n\
    my $spi = Win32::Process::Info->new();\nmy $procinfo = $spi->GetProcInfo();\n\
    my $procstatus=0;\nmy $procname=\"komodo.exe\";\n\nfor my $pid (@procinfo) {\n\
    \    if ($pid->(\"Name\") eq $procname) {\n        print \"$pid->(\"Name\"). is\
    \ running under \";\n               \"process ID $pid->(\"ProcessId\").\"\\n\"\
    ;\n        $procstatus=1;\n    }\n}\nif ($procstatus!=1) {\n    print \"Process\
    \ $procname cannot be found\";\n}\n```\n\n这与图 III.7 所示的内容非常相似。区别在于删除了用于 PID 文件的文件操作，并将搜索更改为使用\
    \ \"Name\" 键而不是 \"ProcessId\"键。这允许我们使用定义的进程名称进行字符串比较，而不是其进程 ID。`$procstatus` 变量的使用方式与图\
    \ III.7 示例相同。\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_168_0.png)\n\n## 瑞士军刀\n\
    \n### 监控多个进程\n可以使用图 III.7 所示的脚本或其他特定进程的脚本来监控多个进程。在收集统计数据时，只需从多个 PID 文件收集信息或使用进程名称。为了获得监控脚本的最佳性能，请先收集所有特定进程的数据，然后进行遍历并根据需要显示或处理数据。\n\
    \n## 监控特定进程的 CPU 利用率\n\n收集系统的整体进程利用率非常重要，但在许多情况下，我们可能更关注所监控的应用程序中单个进程的利用率。因此，我们修改了图\
    \ III.2 中所示的监控 CPU 利用率的脚本，添加了特定进程的计数器。\n\n为了收集该进程的 CPU 统计数据，我们需要知道进程名称。图 III.7\
    \ 显示了根据进程 ID 查找进程名称的方法。在这个示例中，我们假设正在处理如图 III.7 所示的 PID 文件。\n\n用于查找特定进程 CPU 利用率的计数器可以通过使用\
    \ \"Process\" 对象而不是之前使用的 \"Processor\" 对象来找到。我们可以再次使用 \"%Processor Time\" 计数器，因为这正是我们感兴趣的统计数据。然后，在指定实例时，只需使用想要获取信息的可执行文件名称即可。在这种情况下，我们将获取\
    \ Perl 编辑器 Komodo Edit 的信息，它之前的示例中也被使用过。这可以在图 III.9 中看到\n\n## 图 III.9 get_percentprocessortime_komodo\n\
    \n```perl\n#get_percentprocessortime_komodo.pl\nuse Win32::PerfMon;\nuse struct;\n\
    use Win32::Process::Info;\nmy $spi = Win32::Process::Info->new();\nmy $procinfo\
    \ = $spi->GetProcInfo();\nmy $procname = undef;\nmy $procstatus = undef;\nmy $ret\
    \ = undef;\nmy $err = undef;\nmy $object = undef;\nmy $Counter = undef;\nmy $CounterData\
    \ = undef;\n# connect to localhost\nmy $perfmon = Win32::PerfMon->new(\"\\localhost\"\
    );\n\nmy $result = open PIPFILE, \"C:\\$spiddata,komodo.pid>\";\nif ($result)\
    \ {\n  if (defined($spiddata) = <PIPFILE>) {\n    chomp $spiddata;\n    if ($Spid->(\"\
    ProcessId\") == $spiddata) {\n      my $procname = $Spid->(\"Name\");\n      print\
    \ \"$procname is running!\\n\";\n      $procstatus=1;\n    }\n  }\n}\n\nif ($procstatus!=1)\
    \ {\n  print \"$spiddata cannot be found\";\n}\n```\n（注：图 III.9 的 OCR 文本代码块中包含严重损坏；已根据\
    \ Perl 语法和之前页面的上下文进行了清理。）\n\n### 监控内存利用率\n接下来我们将查看特定进程的内存利用率。同样，将此与我们收集的其他信息结合是合理的。在这些示例中，我们都使用了\
    \ PID 文件。\n\n这个特定的计数器由微软描述为：“Private Bytes 是此进程分配的无法与其他进程共享的内存当前大小，以字节为单位”。这符合我们的需求并为我们的监控提供有用信息。相关代码见图\
    \ III.10。\n\n## 图 III.10 get_process_stats.pl\n\n（注：图 III.10 的 OCR 文本断化且损坏；逻辑已根据文档的语义流进行了重构。）\n\
    \n"
