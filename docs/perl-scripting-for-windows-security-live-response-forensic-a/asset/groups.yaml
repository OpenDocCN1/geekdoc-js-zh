    \n[content]\n# 图 1.7 Didier Steivers 的 UserAssist 工具操作演示\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_59_0.png)\n\
    \n如你所见，Didier 的工具不仅“解密”了值名称，还解析了每个值的二进制数据。这正是 UserAssist 键在取证分析中的用所在。当一个值的长度为\
    \ 16 字节时，第二个 DWORD（4 字节）值持有“运行计数”，它从值 5 开始递增。最后两个 DWORD（8 字节，或一个 QWORD）组成一个 FILETIME\
    \ 对象；也就是说，自 1601 年 1 月 1 日以来的 100 纳秒间隔数告诉我们（在 UTC 时间下），用户最后一次执行该相关操作（如启动可执行文件等）的时间。\n\
    \nUserAssist:\n\n```perl\n# c:\\perl\\bin\\perl.exe\n```\n\n- * uassist.pl\n\n\
    # 解析 UserAssist 键，并从 ROT-13 加密中翻译\n\n# 用法: C:\\perl[perl] uassist.pl [uassist.log]\n\
    \n```perl\n#\n# Copyright 2007 H. Carvey keydet89@yahoo.com\n#-----------------\n\
    #use strict;\nuse Win32::TieRegistry(Delimiter=>\"/\");\nmy @month = qw/Jan Feb\
    \ Mar Apr Jun Jul Aug Sep Oct Dec;\nmy @day = qw/Sun Mon Tue Thu Fri Sat/;\n#-\n\
    # _main\n#\n#-\n\\getKeyValues();\n#\n# 获取键值\n#-\nsub getKeyValues {\nmy $reg;\n\
    my $userassist = \"SOFTWARE/Microsoft/Windows/CurrentVersion/Explorer/UserAssist\"\
    ;\nmy $subkey1 = \"5E6AB780-7743-11CF-A12B-00AA004AE837/Count\";\nmy $subkey2\
    \ = \"75408700-EF1F-1DD0-9888-006097DEAC9/Count\";\nif ($reg = $Registry->Open(\"\
    HKEY_CURRENT_USER\", (Access=>KEY_READ))) {\nif (my $ua = $reg->Open($userassist,\
    \ (Access=>KEY_READ))) {\nif (my $key1 = $ua->Open($subkey1, (Access=>KEY_READ)))\
    \ {\nmy @valenames = $key1->ValueNames();\nprint \"[$subkey1] lastwrite\\n\";\n\
    foreach my $value (@valenames) {\nmy $vData = $key1->GetValue($value);\nmy $value\
    \ = tr/N-Za-n-m/A-Za-z/;\nprint $value,\"\\n\";\n}\n}\n}\nelse {\nprint \"Error\
    \ accessing subkey1: \\$! \\n\";\n}\n}\nprint \"\\n\";\nif (my $subkey2 = $ua->Open($subkey2,\
    \ (Access=>KEY_READ))) {\nmy @valenames = $key2->ValueNames();\nprint \"[$subkey2]\
    \ lastwrite\\n\";\nforeach my $value (@valenames) {\nmy (@data,$lastrun, $runcount);\n\
    my $vData = $key2->GetValue($value);\n$value -= tr/N-ZA-Mn-za-m/A-za-z;\nif (length($vData)\
    \ == 16) {\n  @data = unpack(\"*\",$vData);\n  ($data[1] > 5) ? ($rcount = $data[1]\
    \ : 5) : ($lastrun = $data[2],$data[3]);\n  print $value.\"\\n\"\n  if ($lastrun\
    \ == 0) {\n    next;\n  } else {\n    print \"\\t$localtime. ($rcount)\\n\";\n\
    \  }\n} else {\n  print $value.\"\\n\"\n}\n}\nelse {\n  print \"Error accessing\
    \ $subkey2: $! \\n\"\n}\nelse {\n  die \"Error connecting to $userassist key:\
    \ $! \\n\"\n}\nelse {\n  die \"Error connecting to HKEY_CURRENT_USER hive: $!\
    \ \\n\"\n}\n}\n```\n\n```perl\n# getTime()\n# 从 FILETIME 对象获取 Unix 风格的日期/时间\n\
    # 输入 : 8 字节 FILETIME 对象\n# 输出: Unix 风格的日期/时间\n# 感谢 Andreas Schuster 提供以下代码，他\n\
    # 包含在了 ptfinder.pl 中\n#-\n```\n\nsub getTime() {\n  my $lo = shift;\n  my $hi\
    \ = shift;\n  my $t;\n  if ($lo == 0 && $hi == 0) {\n    $t = 0;\n  } else {\n\
    \    $lo = 0xd5e38000;\n    $hi = 0x019db1de;\n    $t = int($hi*429.967296 + $lo/1e);\n\
    \  }\n  $t = 0 if ($t > 0);\n  return $t;\n}\n```\n\nuassist.pl 脚本解析了 UserAssist\
    \ 键（仅与 IE 工具栏和活动桌面相关的键），解码了 ROT—“加密”的值名称以及从包含这些名称的数据中提取的时间戳。特别感谢 Andreas Schuster；微软经常使用\
    \ 8 字节的 FILETIME 值来存储时间戳。这在文件系统内部是如此的，在注册表中也是如此。\n"
