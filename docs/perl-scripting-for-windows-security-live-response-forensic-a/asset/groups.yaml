    \ 2 |\n\n如图 II.7 所示，从应用程序前缀文件中可以获取大量有用信息。然而，取证人员应记住，Windows XP 的预取取功能适用于系统上的所有用户；为了将特定应用程序关联到特定用户，需要采用（已讨论过的）其他手段。\n\
    \n## 第二部分 • Perl 脚本编程与计算机取证分析\n\n### 注意\n\nWindows Vista 同样维护 Prefetch 文件。然而，Vista\
    \ 在 Prefetch 文件中维护的特定元数据的偏移量有所不同。`Prefetch.pl` ProScript 仅用于 Windows XP。\n\n###\
    \ 将 ProScript 输出到文件\n\n有时，在 ProScript 窗口中查看大量信息非常麻烦。由于 ProScript 只是 Perl 脚本，可以添加代码将\
    \ ProScript 的输出写入文件，而不是直接显示在窗口。\n\n### 解析其他数据\n\n除了 Windows 系统上的日志文件和二进制数据外，还有许多有用方法可以解析数据。例如，Visa\
    \ 行业数据安全标准 (DSS) 对数据泄露的情况提出了通知要求，因此通常发生是，某些系统可能被取证获取，并且会对信用卡号进行入侵迹分析。EnCase 等取证工具允许用户使用正则表达式搜索信用卡号，或者让分析人员使用编写好的脚本进行更深入的搜索。\n\
    \n### Luhn 算法（或公式）\n\n信用卡的格式非常简单；长度为 13 到 16 位，并以数字序列开头，这些数字被称为银行识别码（BIN）。这种通用描述可以出现在几乎任何计算机上。有效的信用卡号必须通过\
    \ Luhn 算法的检查。执行 Luhn 算法的代码如下：\n\n```perl\nsub luhn {\n    my $num = shift;\n \
    \   my $len = length($num);\n    my @on;\n    foreach (0..($len - 1)) {\n    \
    \    push(@on, substr($num, $i));\n    }\n    my @m = reverse @on;\n    foreach\
    \ my $i (0..($len - 1)) {\n        if ($i % 2 == 0) {\n            $r[$i] = $m[$i];\n\
    \        } else {\n            my $x = $m[$i] * 2;\n            ($x > 9) ? ($r[$i]\
    \ = $x - 9) : ($r[$i] = $x);\n        }\n    }\n    my $sum;\n    foreach $i (0..($len\
    \ - 1)) {\n      $sum += $r[$i];\n    }\n    my $v = $sum % 10;\n    ($v == 0)\
    \ ? (return 1) : (return 0);\n}\n```\n\n`luhn()` 函数接收信用卡号作为参数并进行处理，验证其是否为有效的信用卡号。如果是有效的信用卡号，则返回\
    \ 1，否则返回 0。你会注意到该函数检查了信用卡号的长度，也没有验证其 BIN。EnCase 的功能包含一个名为 `IsValidCreditCard()`\
    \ 的内置字符串函数来执行这些检查。在解析 EnCase 返回的结果时，我倾向于使用 `luhn` 代码作为额外验证。\n\n验证或确定信用卡号类型或 BIN\
    \ 的 Perl 代码可能如下：\n\n```perl\nsub getType {\n    my $cc = shift;\n    my $len =\
    \ length($cc);\n    return undef if ($len > 19);\n    my $type;\n    if ($len\
    \ == 16) {\n        if ($cc =~ m/^4/) {\n            $type = \"Visa\"\n      \
    \  } elsif ($cc =~ m/^[51|52|53|54|55]/) {\n            $type = \"MasterCard\"\
    \n        } elsif ($cc =~ m/^6011/) {\n            $type = \"Discover\"\n    \
    \    } else {\n            $type = \"Unknown\"\n        }\n    } elsif ($len ==\
    \ 15) {\n        $type = \"AmEx\" if ($cc =~ m/^[34|37]/);\n    } elsif ($len\
    \ == 14) {\n        $type = \"Diners\" if ($cc =~ m/^[36|38]/);\n    } elsif ($len\
    \ == 13) {\n        $type = \"Visa\" if ($cc =~ m/^4/);\n    } else {\n      \
    \  $type = \"Unknown\";\n    }\n    print \"cc is $len long.\\n\";\n}\n```\n\n\
    轨道（track）数据有所不同，因为它包含了信用卡号（也称为主账户，或 PAN）。轨道 1 数据具有以下格式（请记住这是一个简单的概述）：\n\nB(PAN)-(名称)^(其他数据)\n\
    \n轨道 1 数据以格式代码 \"B\" 开头，随后是 PAN 和 \"^\" 分隔符。名称字段长度为 19 个字符，由 ASCII 字符组成；随后是另一个\
    \ \"^\" 分隔符和 18 位数据，其中前四位应该是信用日的有效期。如果你正在解析一个每行包含一次轨道 1 搜索结果的平面 ASCII 文件，你可以通过如下\
    \ Perl 代码进行解析（标量 `$file` 是包含我们数据的轨道文件名）：\n\n```perl\nmy $cc_nums;\nopen(FH,\"\
    <$file) or die \"Could not open $file: $!\\n\";\nwhile(<FH>) {\n    chomp($_ =~\
    \ m/\\R/);\n    next unless $_ =~ m/\\B/);\n    my ($pan,$name,$rest) = split(/\\\
    x5e/,_,3);\n    $pan =~ s/[^0-9]//g;\n    my $expiry = substr($rest,0,4);\n}\n\
    ```\n\n"
