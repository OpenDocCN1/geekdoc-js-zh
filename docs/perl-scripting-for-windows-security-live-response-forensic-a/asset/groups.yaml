    \ %sec;\n}\n```\n\nlspi is a bit more complex than many of the other Perl scripts\
    \ I've written, however, it's fairly easy to run. To launch the script, all you\
    \ need to provide is the path to the RAM dump file, and the offset of the process\
    \ was located within the RAM dump file. This second argument can be populated\
    \ from the output of the lsproc.pl script; therefore, in order to run lspi.pl,\
    \ you first have to run lsproc.pl.\n\nUsing the same RAM dump file (retrieved\
    \ from ramdump.img), you can extract the executable image for the running DFRWS\
    \ 2005 Memory Challenge site and running dd.exe that was actually used to create\
    \ the RAM dump itself, using the following command:\n\n```bash\nC:\\Perl\\forensics>lspi.pl\
    \ d:\\case007\\ramdump.img 0x0414dd60\n```\n\nOr, you can extract the executable\
    \ image file for the nc.exe process:\n\n```bash\nC:\\Perl\\forensics>lspi.pl d:\\\
    case007\\ramdump.img 0x0625d3c0\n```\n\nAgain, in order to get the hex values\
    \ in argument of the above commands, the examiner would need to run lsproc.pl\
    \ first, and then use the output of that script to provide the necessary values\
    \ for lspi.pl.\n\nNow, what makes lspi.pl so complex from a coding perspective\
    \ is that the script does some binary file parsing of its own, beyond accessing\
    \ the RAM dump file. The script also has to parse the portable executable (PE)\
    \ file header (the PE file header is defined by Microsoft) and reassemble the\
    \ various bits and pieces of\n\n# Perl Scripting and Computer Forensic Analysis\
    \ • Part II 105\n\nthe executable image file based on the “map” provided by the\
    \ header information. The actual segments of the executable image file are maintained\
    \ in memory “pages”, sections that are each 4096 bytes (4Kb) in size. If all of\
    \ the necessary pages are not available in the RAM dump, such if the memory manager\
    \ swapped out to the pagefile, lspi.pl will not be able to reassemble the executable\
    \ image file and quit with a message to that effect.\n\nThese two Perl scripts\
    \ are available, with several other Perl scripts that can be used to parse data\
    \ from RAM dumps, on the SourceForge site.\n\n## Extracting other data from RAM\n\
    \nRAM dumps are full than just processes and network connections. Opening a RAM\
    \ dump in your favorite hex editor will reveal what might appear to be Event Log\
    \ records, as well as Registry keys. In the same way as processes were located\
    \ in a RAM dump, these other objects can be located and parsed. This can be very\
    \ useful in investigation as these objects contain information and may be used\
    \ to establish or correlate timeline of activity on the system.\n\n### ProScripts\n\
    \nAs mentioned in Part I, ProScripts are essentially Perl scripts that provide\
    \ a scripting capability. The forensic analysis application can be extremely useful,\
    \ and the addition of the Perl language allows the examiner to leverage the power\
    \ of Perl in conjunction with ProScripts product. This gives the examiner the\
    \ ability to extend the application to incredible levels of usability.\n\n###\
    \ Graphical interface (GUI)\n\nProgramming is beyond the scope of this book, but\
    \ I have tested the use of a GUI in conjunction with the Win32::GUI module and\
    \ they have worked very well. Taking this to greater lengths would allow the examiner\
    \ to extend the usability of ProScripts further, thanks to the power of Perl!\n\
    \n### Uassist.pl\n\nIn Part I, as well as previously in this Part, I provided\
    \ Perl scripts that could be used to extract information from the UserAssist keys\
    \ in the Registry. In Part I, the uassist.pl script could run on a lively system\
    \ to retrieve the contents of the NTUSER.DAT file that had been extracted from\
    \ an acquired image. For the sake of completeness, I wanted to provide a script\
    \ that you could use with ProScripts and parse the UserAssist keys from the user\
    \ registry:\n\n```perl\n# Uassist.pl, version 0.1\n# Copyright 2006-2007 H. Carvey,\
    \ det@yahoo.com\n------------------------------------------------------\nuse ProScript;\n\
    PSDisplayText(\"UserAssist.pl v0.1\");\nPSDisplayText(\"to parse UserAssist keys\
    \ within each user registry file\");\nPSDisplayText(\"decrypt the values, and\
    \ display the data as GMT time where applicable.\");\nPSDisplayText(\"Also, values\
    \ with time-timestamped data are sorted by time in reverse order, sc=\");\nPSDisplayText(\"\
    that the user activity is done more readily.\");\nPSDisplayText(\"\\n\");\nmy\
    \ $ids = ();\n$numRegs = PSGetNumRegistries();\nif ($numRegs == 0) {\n    PSDisplayText(\"\
    No registries to process\");\n    return;\n}\n$regName = PSGetRegistryAt(0);\n\
    PSRefreshRegistry($regName);\n------------------------------------------------------\n\
    my $hiveName = \"HKEY_Users\";\n```\n\n# Perl Scripting and Computer Forensic\
    \ Analysis • Part II 107\n\n```perl\nmy $rHandle = PSOpenRegistry($regName, $hiveName);\n\
    my $sids = ();\nif ($rHandle == 0) {\n    PSDisplayText(\"Unable to locate registry\
    \ key\");\n    return;\n} else {\n    PSDisplayText(\"Registry opened successfully.\"\
    );\n    # Successfully opened the key. Now, enumerate the key.\n    while (1)\
    \ {\n        $RegKeyInfo = &PSScript:PSReadRegistry($rHandle);\n        last if\
    \ ($RegKeyInfo->$type == -1);\n        push($sids, $RegKeyInfo->$regName) if (length($RegKeyInfo->$strRegName))\
    \ > 20;\n    }\n}\nPScloseHandle($rHandle);\nPSDisplayText(\"Registry closed.\"\
