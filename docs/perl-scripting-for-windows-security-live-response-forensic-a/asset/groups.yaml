    \ $remote_share;\nif ($totalSpace != undef && $totalSize != undef) {\n    $percentFree\
    \ = int(100*($totalFreeSpace/\n    $totalSize));\n    $threshold_check(\"free_disk_space\"\
    , $percentFree);\n} else {\n    print \"Unable to get disk status!\\n\";\n   \
    \ $threshold_check(\"free_disk_space\", 1);\n}\n```\n\nWhile this is the code\
    \ to show in Figure III.24, there are a few notable differences. First, we are\
    \ declaring all of our variables up front since we will be reusing them multiple\
    \ times within the script. Secondly, we have added a call to the \"threshold_check\"\
    \ function passing a hard-coded value of 1 when we are unable to get the disk\
