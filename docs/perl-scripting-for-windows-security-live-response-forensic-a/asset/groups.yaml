    Class : Windows Sign-in\nModule: C:\\Program Files\\Common Files\\Windows\\Login.dll\n\
    ```\n\n## UserAssist.pl\n\nThe UserAssist registry is a key that has received\
    \ a good deal of attention over the past year, largely due to the fact that the\
    \ UserAssist key \"records\" a user’s actions, or more appropriately, \"records\"\
    \ many interactions via the Windows shell. For example, when a user opens Control\
    \ Panel, double-clicks an application such as Microsoft Word, or double-clicks\
    \ a shortcut (.lnk) to open a file, interactions are all recorded in the UserAssist\
    \ key. Figure 1.5 illustrates what this looks like via the RegEdit.\n\n## Figure\
    \ 1.5 Excerpt from RegEdit Showing the UserAssist Key and Subkeys\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_54_0.png)\n\
    \nAs you can see, the UserAssist key really consists of three keys, each represented\
    \ by a globally unique identifier (GUID) that points to a specific class. For\
    \ example, the GUID starts with {5EAB870} refers to the Internet Explorer Toolbar,\
    \ while the GUID starts with {7504870} refers to the Active Desktop. The last\
    \ GUID is added to the system when you install Internet Explorer version 7. The\
    \ subkey we most interested in is the one that points to the Active Desktop. As\
    \ you can see from Figure 1.5, each GUID has a subkey named \"Count\". Even though\
    \ there is an additional layer or two subkeys, all of these keys are collectively\
    \ referred as the \"UserAssist keys,\" largely because it’s tough to remember\
    \ the GUIDs. Figure 1.6 illustrates the value names beneath the Count key, as\
    \ they appear in RegEdit.\n\n## Figure 1.6 Example of RegEdit Showing One of the\
    \ UserAssist Values\n\n| Name | Type | Data |\n| :--- | :--- | :--- |\n| REG_ASSIST\
    \ | REG_BINARY | 81 01 00 00 12 00 00 09 64 b3 ea c7 |\n| REG_ASSIST (ah) | REG_BINARY\
    \ | 4f 00 00 00 07 00 00 65 22 db2 c1 f3 c6 |\n| REG_ASSIST (C204A50...) | REG_BINARY\
    \ | 59 01 00 00 00 00 60 30 97 70 82 b3 c7 |\n| REG_ASSIST (66B0653C5021...) |\
    \ REG_BINARY | 50 01 00 00 06 00 00 00 e0 2c df 22 e1 07 |\n| REG_ASSIST (871P53B0-420...)\
    \ | REG_BINARY | 52 01 00 00 06 00 00 00 b0 b1 57 9f b7 c7 |\n| REG_ASSIST (66B0A566-09V4...)\
    \ | REG_BINARY | 48 01 00 00 04 00 00 00 30 ac 41 e0 d1 b1 c7 |\n| REG_ASSIST\
    \ (9111A049-600D1...) | REG_BINARY | 80 01 00 00 00 00 00 31 d29 2a ea c7 |\n\
    | REG_ASSIST (5R5Q0Q8-P6104...) | REG_BINARY | 6f 00 00 00 06 00 00 00 50 33 22\
    \ 6d 27 08 c7 |\n\nAs you can see from Figure 1.6, the value names beneath the\
    \ Count key are ROT-13 “encrypted.” This really makes it possible to search the\
    \ key names using the search function in RegEdit¹. While binary in nature, if\
    \ you look on your own system, you will see a number of values that have all zeros\
    \ in their data. We’ll address this in a moment.\n\nDidier Stevens has a great\
    \ deal of work in the area of decoding not only the value names the UserAssist\
    \ keys, but also the binary data associated with the values. In his blog², he\
    \ has a GUI tool called (odd enough) “UserAssist” that will parse and translate\
    \ the value names and data for the UserAssist keys on a Windows system. Figure\
    \ 1.7 illustrates the GUI interface of Didier’s UserAssist tool (version 2.1.0.0).\n\
    \n> ¹ http://support.microsoft.com/default.aspx?kb=en-us;161678\n\n> ² http://blog.didierstevens.com/programs/userassist/\n"
