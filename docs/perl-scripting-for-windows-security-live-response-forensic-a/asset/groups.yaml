    # Log Files


    Log files, even on Windows systems, will often be flat ASCII text files that contain
    each log entry on one line. This makes the easy to view, but often times these
    log files can be hundreds of kilobytes (KB), even going over the megabyte (MB)
    range, depending upon the application generating the logs and the amount of traffic.
    For example, by default, Microsoft''s web server, Internet Information Server
    (IIS) will write and FTP logs to ASCII text files. Perl was originally designed
    to quickly and efficiently parse log files, and on Unix systems, those log files
    are, in many cases, ASCII text parsing. A normally sized IIS web log file of,
    20 or 30 KB is almost nothing. The power of Perl really comes into play when you
    need to parse several hundreds of MB of log files, looking for something specific,
    such as an IP address, or a particular string. For example, when dealing with
    an incident where a SQL injection attack has been suspected, I will most often
    run a search of the files in the image to determine which log files contain the
    string "xp_cmdshell", which is the name of a SQL stored procedure that an attack
    may call when conducting or attempting his attack. From there, I will most likely
    extract the log files from the image and extract specific information from them.


    While Perl is extremely powerful, it cannot parse and find what is not. As an
    incident responder, I have seen time and time again how a system administrator
    has installed a server with default logging enabled, or for some reason reduced
    the logging (or worse, simply disabled the logging all together). The effect of
    this is that certain isn''t logged, then there''s simply no way that any number
    of Perl scripts is going to find it.


