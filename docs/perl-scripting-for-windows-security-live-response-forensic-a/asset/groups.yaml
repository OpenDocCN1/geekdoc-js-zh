    # Monitoring Windows Applications with Perl • Part III 137


    Lastly, due to some changes in the way the 2005 edition of Visual C++ works, we
    have to change the manifest data for the PerfMon.dll file. This is unnecessary
    if we are using Visual C++ 6.0. Change to the C:\PerSite\lib\Win32\PerfMon directory
    in your command window and run the following command:


    ```

    mt /manifest PerfMon.dll.manifest /outputresource:PerfMon.dll#2

    ```


    This basically embeds the generated manifest file into the dynamic link library
    (DLL) as a resource allowing the DLL used by the Win32::PerfMon module to work
    properly. Again, this is only necessary if you are using the Visual C++ Express
    Edition 2005 compiler to compile the module.


    With this module, we now have access to all of the Performance Monitor data through
    the use of the following line in our Perl script:


    ```

    use Win32::PerfMon;

    ```


    So for our CPU utilization, this will obviously play a critical role. What we
    want to do first is gather the CPU utilization data. After we are able to collect
    the information, we will figure out how to use it as a data point for actual monitoring
    activities.


    To collect CPU utilization, we will be using the performance counter "Processor
    Time." According to the description of this counter from Microsoft, "Processor
    Time" is the percentage of elapsed time that the processor spends to execute a
    non-idle thread. It is calculated by measuring the idle thread is active in the
    sample interval, and subtracting that time from interval duration (Each processor
    has an idle thread that consumes cycles when no other threads are ready to run).
    This counter is the primary indicator of processor activity, and displays the
    average percentage of busy time observed during the sample interval. It is calculated
    by monitoring the time that the service is inactive, and subtracting that value
    from 100 percent.


    Let''s put together some code for this. What''ll we do is use Win32::PerfMon module
    and capture the data available in the "Processor Time" counter. This is part of
    the "Processor" performance monitor object. This object has multiple instances
    depending on the number of processors in the system. If only one processor exists,
    the data is stored under instance 0. There is a special instance available for
    objects such as this, which provides the data from all other instances. This is
    the "_Total" instance. In most cases, you will not need to know the performance
    data for a specific processor when monitoring an application, so we''ll use the
    "_Total" instance for our data. The code to pull this data is shown in Figure
    III.2.'
