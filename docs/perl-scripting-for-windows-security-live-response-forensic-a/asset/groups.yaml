    90000000\"\noperator=\"equalorgrater\">\n  <action>email</action>\n  <action>page</action>\n\
    </status>\n<status name=\"yellow\" value=\"80000000\"\noperator=\"equalorgrater\"\
    >\n  <action>email</action>\n</status>\n<status name=\"green\" value=\"80000000\"\
    \ operator=\"less\">\n  <action>none</action>\n</status>\n</monitor>\n</threshold>\n\
    \nMake sure you are watching for the wrapping in Figure III.34, as the width of\
    \ some lines is longer than the page width in this book.\n\nThe easiest way to\
    \ create a monitoring system using these scripts is to simply call them all from\
    \ one master script and let each subsidiary script handle its monitoring functions—we've\
    \ written them. Some alternatives would be to convert our scripts into functions\
    \ and call them in that manner from a single script or to create a monitoring\
    \ module and pass various parameters to the module.\n\nThe script in Figure III.35\
    \ shows one way of calling all of the subsidiary scripts from a master script.\n\
    \n## Figure III.35 master_monitor.pl\n\n```\n#master_monitor.pl\ndo 'get_system_stats.pl';\n\
    do 'get_process_stats.pl';\ndo 'get_port_status.pl';\ndo 'get_disk_info.pl';\n\
    do 'get_db_avail.pl';\ndo 'get_ws_status.pl';\n```\n\n## Scheduling Your Monitoring\
    \ Scripts\n\nAfter creating the monitoring scripts, you need to monitor your application.\
    \ You will then want to automate the execution of those scripts. This has to be\
    \ done very carefully! If you run your script too frequently, you can cause the\
    \ script to have a performance impact on the system it is monitoring. If you run\
    \ it too infrequently, you run the risk of being notified of problems in the system\
    \ too late to fix them.\n\nA good rule of thumb is to perform a load test and\
    \ run the scripts at a variety of frequencies. Find the point where the scripts\
    \ cause minimal to no performance impact, but yet run enough that you can be assured\
