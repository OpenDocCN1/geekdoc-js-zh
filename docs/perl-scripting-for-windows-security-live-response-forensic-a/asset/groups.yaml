  - '[PAGE 23]


    # Part I • Perl Scripting and Live Response


    As an example, I was looking up some directions to a location that I needed to
    visit, and that I had to provide to a friend. I found the street address of the
    location and selected it in one Web page window, copied it, and pasted it into
    the e-mail that I was preparing to send. Afterward, I ran pclip.pl and this is
    what I got back:


    ```

    Clipboard Contents

    -----------------

    123 Fake Street

    ```


    Imagine what people copy into their clipboards throughout the day, without really
    understanding what happens. I suggest that just as an experiment, you should go
    around an office or a school, or you can even do this at home, and simply open
    a Notepad window, place the cursor anywhere within the window, and press Ctrl-V.
    Whatever is in the clipboard will be pasted into Notepad. Pclip.pl allows you
    to automate this collection process.


    # Running Processes


    When performing live response, we are working with and interacting with a live,
    running system. Many times, when responding to an incident, a user may be logged
    into the system. In some cases, such as employee workstations within an organization,
    this user may be the employee themselves. In others, such as in server rooms and
    data centers, this user will most likely be a system administrator. Often, an
    incident will occur and we will need to log into the system ourselves (as a consultant,
    I always have the system administrator da to) in order to obtain information from
    a system. The point is in order to collect information from a live system, there
    has to be an account logged into the system, either at the console (via the keyboard)
    or over the network.


    As the system is live and running, there are processes running, threads being
    executed, and code being processed. This is how we interact with the system; we
    "ask" the system for information by running processes ourselves. Our Perl scripts
    will help process processes, but many times it is much easier to run external,
    third-party tools, or even tools that are native to the system itself, in order
    to get the information we need. For example, let''s say that we''d like to get
    a list of open network connections from a system. The first thing that comes to
    mind as a means of requesting this information from the system is the native utility,
    netstat.exe.


    One question that may immediately come to mind is, if I run netstat.exe (or any
    other tool) from the command line, whether bother to do it via a Perl script?
    Well, there are a couple of good answers to that. One is by including the use
    of'
  - '[PAGE 24]


    # Perl Scripting and Live Response * Part I


    tool or utility in a Perl script (or batch file), we have a form of self-documentation.

    Documentation is a very important aspect of incident response. Second, many of
    the

    tools we may want to run on systems have a number of command-line arguments, and

    i don''t know about you, but sometimes in the heat of the moment, I may not be
    able

    to keep information straight, particularly at 2:30 A.M. When I''m trying to collect

    information from systems that may have been compromised. So, by including the
    tool

    or utility in a Perl script, I have a degree of automation that prevents me from
    making

    mistakes, particularly through repetition. It''s not often that I deal with only
    one

    system, or one tool or utility. Most often, I''m responding to 10, 50, or 100
    systems, and

    i''m running a number of different tools on each of those systems. Using a Perl
    script, I''m

    able to put everything into a single command so when the situation changes, I''m

    prepared. That way, if something happens further down the road and someone asks
    me

    what I did, I can refer back to the Perl script and the copies of the tools I
    run.


    # Netstat1.pl


    Perhaps the simplest way to launch external programs in Perl is to use the system()

    function. The system() function forks a child process from a parent process,

    wa for the child process to complete, and then exits. A very simple use of

    the system() function, using netstat.exe for our example, is as follows:


    ```

    use strict;

    my @args = ("netstat", "-ano");

    system(@args);

    ```


    While this could have been much simpler in a single line, simplicity or

    ellegance isn''t the issue here. What happens when we run this code is that the
    output

    of our command appears at the console, or standard output (i.e., STDOUT). So all

    ''ve really done here is added a layer of abstraction and not really bought ourselves\anything
    useful. In order to save the output of the command, for example, we''d still

    need to use the redirection operator at the command prompt:


    ```

    C:\perl netstat1.pl > netstat.log

    ```'
  - '[PAGE 25]


    # 6 Part I • Perl Scripting and Live Response


    That''s really no different from using Perl at all:


    ```

    C:>netstat -ano netstat.log

    ```


    So, a bit of extra effort, but it would appear that we really haven''t bought
    ourselves anything. Now, this might be different if we were using this script
    to run multiple commands; after all, wouldn''t we be benefiting from automation?
    During incident response, you''re usually under pressure, either from your boss
    or the clock, or you''re tired because it''s 3:00 A.M., and the first thing that
    will happen is that you''ll forget a command or mistype a command or something
    that will be frustrating under those conditions. By linking the commands together
    into a script, we can now type in a single command, a couple of short keystrokes,
    and have everything run for us. However, at this point, we really don''t have
    anything more than a batch file contained in a Perl script. We haven''t taken
    full advantage of the power of Perl to make our jobs easier.


    # Netstat2.pl


    Another way to run external commands through Perl is to use backticks. Backticks
    are not the single quote operator on your keyboard; rather the backticks are the
    slanted single quote operator. Using the backtick operator, you can access system
    commands or even external commands (replace netstat.exe with your program of choice,
    ensuring that it is located in the PATH). For example, let''s call the following
    code “netstat2.pl":


    ```

    #! c:\bin\perl.exe

    use strict;

    my @netstat = ''netstat -ano'';

    map(print "$_", @netstat);

    ```


    Notice that we launch netstat.exe with the “a","n,” and “o” switches, and collect
    the output of the command, whatever it may be, into a Perl list (or array). From
    there, the script finishes by simply printing out what''s in the list. Now, the
    output of the command isn''t at the console (STDOUT); rather, we''ve got control
    of that output and we can do what we like with it.'
- md: "\n## Master Craftsman\n\n## Extending the Use of Backticks\n\nYou can use the\
    \ backticks to not only launch applications on the system, or even applications\
    \ and programs external (i.e., not native) to the system, but also to access native\
    \ commands, such as \"`dir`\". \"Dir\" doesn't exist as an executable file on\
    \ a system, but it is an accessible command.\n\nOther things you can include is\
    \ a list of commands in an array (such as dir, netstat -ano, and so forth) and\
    \ then iterate through the list, running each command individually. If you're\
    \ interested in running several commands and correlating the output or filtering\
    \ the output, the Perl lists make that very easy to do.\n\nWe're at the point\
    \ where we're making our jobs a little easier. For example, I can filter through\
    \ the output, looking for a particular Internet Protocol (IP) address, or skipping\
    \ lines that contain the loopback address (127.0.0.1). I can minimize the output,\
    \ showing only the things I want to see, rather than showing everything. I can\
    \ filter the data, showing only those network connections that are in a particular\
    \ state, such as LISTENING, TIME_WAIT, or ESTABLISHED. The point is, we now making\
    \ our jobs easier by running a command of our choosing and being able to manage\
    \ the output of that command.\n\n## Netstat3.pl\n\nThe Win32::Job module provides\
    \ a bit more granularity when creating and running processes, as in netstat3.pl\
    \ below.\n\n```\n#! c:\\perl\\bin\\perl.exe\nuse strict;\nuse Win32::Job;\neval\
    \ {\n    my $job = Win32::Job->new();\n    my $result = $job->spawn(\"netstat.exe\"\
    , \"netstat.exe -ano\");\n    die \"$E is undefined. \\\"$E\\n\" unless $result;\n\
    \    my $ok = $job->run(60);\n};\n\nprint \"@\\n\" if ($ok);\n```\n\n## Part I\
    \ • Perl Scripting and Live Response\n\nWhen we run netstat3.pl, we get the same\
    \ sort of output we would expect if we were running the netstat —ano command from\
    \ the command line; however, in this case, we are able to use the Win32::Job module\
    \ to do things such as limit the amount of time that the process runs. In netstat3.pl,\
    \ we limit that time to 60 seconds, which is a long time, and probably more than\
    \ we need in most cases. However, I have seen simple command-line tools (such\
    \ as netstat.exe) hang when run on systems, or simply take an inordinate amount\
    \ of time to run (due to high overhead from other processes, and so forth). In\
    \ such cases, we may want to limit how long the process runs, and that's where\
    \ Win32::job comes in.\n\nThere are a couple of other functions within the Win32::Job\
    \ module that may be of use, depending upon what you're doing and the level of\
    \ control of the process you wish to achieve. For example, you can use the spawn()\
    \ function to reduce STDOUT and STDERR messages to logs, or use the watch() function\
    \ to provide a handler for the process, in order to achieve an even more granular\
    \ of control over the process. Check the POD for the Win32::job module and for\
    \ the Win32::Process module, for other ideas on how to run external processes\
    \ from Perl.\n\nAlso notice the use of eval{} block. This allows us to tell Perl\
    \ to evaluate the code, and trap any errors that may occur. One of the big ones\
    \ that occurred when I was writing and testing was that I misspelled the name\
    \ of the executable (i.e., \"nestat.exe\"). While this is not an error that would\
    \ cause a major application crash, the error was trapped, nonetheless. The eval{}\
    \ block is useful for trapping errors, and allowing your code to progress in the\
    \ event of an error that you simply wish to recover from (and not have your entire\
    \ script bomb out!).\n\n## Accessing the API\n\nWhen performing live response\
    \ or perhaps even analyzing files retrieved from a system during live response,\
    \ you may want to access the Windows API. The Windows API can provide some useful\
    \ functionality, already partially built. Fortunately, Microsoft exposes a good\
    \ portion of the public API via the Microsoft.com Web site, and in addition, there\
    \ are books available that describe other API functions that are accessible, although\
    \ not fully documented.\n\nIn order to access the Windows API, you need to be\
    \ sure that you have the Win32::API module installed. You can check if this module\
    \ has been installed in your Perl distribution by typing the following command\
    \ at the command prompt.\n\n```\nC:\\perl> query Win32-api\n```\n\nFigure I.1\
    \ illustrates the output of this command on my system.\n\n## Figure I.1 Querying\
    \ for the Win32::API Module\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_28_0.png)\n\
    \nNote\n\nFigure I.1 shows the output of two \"ppm\" commands. The first, the\
    \ query command, queries the current installation to determine the version of\
    \ the module that is installed. In this case, the version of the Win32::API module\
    \ that is installed is 0.41. The second command is a \"search\" command that looks\
    \ for the currently available versions of modules that start with \"win32-api.\"\
    . The currently available version of the Win32::API module is 0.46. I can update\
    \ my copy of the module by typing \"ppm update Win32-API.\"\n\nYou'll notice in\
    \ Figure I.1 that I ran my query for \"win32-api,\" all of the modules that began\
    \ with that name were returned. What is this module named \"Win32-API-Prototype\"\
    ? This is a module created by Dave Roth that encapsulates the Win32-API module\
    \ and makes it easier to use.\n\nTo install the Win32::API module, type the following:\n\
    \nWhen performing live response, some of the information you want to get from\
    \ the system includes such as the current time. This script demonstrates the use\
    \ of Win32::API module to access various arguments. Meanings of the following\
    \ constants can be found here:\n"
  mdcn: "\n\n## 大师级\n\n## 扩展反引号的使用\n\n你可以使用反引号不仅可以启动系统上的应用程序，甚至可以启动系统外部（即非系统原生）的应用程序和程序，还可以访问原生命令，例如\
    \ \"`dir`”。“Dir”在系统中并不是一个可执行执行文件，但它是一个可以访问的命令。\n\n你可以在其中包含的其他内容是数组中的命令列表（例如 `dir`、`netstat\
    \ -ano` 等），然后遍历列表并逐个运行每个命令。如果你对运行多个命令并关联输出或过滤输出感兴趣，Perl 列表（lists）让这变得非常简单。\n\n\
    我们现在已经到了可以让工作变得更轻松的程度了。例如，我可以过滤输出，寻找特定的 Internet 协议（IP）地址，或者跳过包含回环地址（127.0.0.1）的行。我可以最小化输出，只显示我想看的内容，而不是显示所有内容。我可以过滤数据，只显示处于特定状态（如\
    \ `LISTENING`、`TIME_WAIT` 或 `ESTABLISHED`）的网络连接。关键在于，现在通过运行选择的命令并管理该命令的输出，让我们的工作变得更加轻松。\n\
    \n## Netstat3.pl\n\n`Win32::Job` 模块在创建和运行进程时提供了细粒度的控制，如下方的 `netstat3.pl` 所示。\n\
    \n```\n#! c:\\perl\\bin\\perl.exe\nuse strict;\nuse Win32::Job;\neval {\n    my\
    \ $job = Win32::Job->new();\n    my $result = $job->spawn(\"netstat.exe\", \"\
    netstat.exe -ano\");\n    die \"$E is undefined. \\\"$E\\n\" unless $result;\n\
    \    my $ok = $job->run(60);\n};\n\nprint \"@\\n\" if ($ok);\n```\n\n## 第一部分 •\
    \ Perl 脚本与现场响应\n\n当我们运行 `netstat3.pl` 时，我们得到的输出与在命令行运行 `netstat —ano` 命令所预期的相同；但在这种情况下，我们能够使用\
    \ `Win32::Job` 模块来执行诸如限制进程运行时间的操作。在 `netstat3.pl` 中，我们将该时间限制为 60 秒，这是一个很长的时间，在大多数情况下可能超过了我们的需求。然而，我见过简单的命令行工具（如\
    \ `netstat.exe`）在系统上运行时会挂起，或者仅仅是运行时间过长（由于其他进程的高开销等）。在这些情况下，我们可能希望限制进程的运行时间，这就是\
    \ `Win32::job` 大显用场的地方。\n\n`Win32::Job` 模块中还有几个函数可能有用，具体取决于你正在的操作以及你希望实现的进程控制级别。例如，你可以使用\
    \ `spawn()` 函数将 STDOUT 和 STDERR 消息重定向到日志，或者使用 `watch()` 函数为进程提供处理程序，以实现对进程更细粒度的控制。请检查\
    \ `Win32::job` 模块和 `Win32::Process` 模块的 POD，以获取其他如何从 Perl 运行外部进程的思路。\n\n还要注意 `eval{}`\
    \ 块的使用。这允许我们告诉 Perl 执行代码并捕获可能发生的任何错误。我在编写和测试时发生的一个大错误之一是我拼错了了可执行文件的名称（即 `\"nestat.exe\"\
    `）。虽然这不是一个会导致主要应用程序崩溃的错误，但错误仍然被捕获了。`eval{}` 块有助于捕获错误，并允许你的代码在发生你只想恢复的错误时继续执行（而不至于让整个脚本崩溃！）。\n\
    \n## 访问 API\n\n在执行现场响应（live response）或分析从系统获取的回调文件时，你可能想要访问 Windows API。Windows\
