    # Perl Editors


    When writing Perl scripts, you need an editor of some kind. Back in my early days
    of graduate school (1994), those of us in the Electrical and Computer Engineering
    curriculum would write HTML pages using Notepad as our editor. You can use Notepad
    to write Perl scripts, as well, but I''ve found that using Notepad can make writing
    and troubleshooting Perl scripts harder than it needs to be. When using an editor,
    the things I look for are syntax highlighting or color-coding, automating indenting
    (using curly brackets, etc.), and line numbering. These attributes make it easier
    to recognize my errors when I try running my code, and tracking down when an error
    occurs.'
- md: '

    # Preface


    There are a number of editors available for Perl. My personal favorite is UltraEdit.¹
    Not only is UltraEdit an excellent Perl editor, but I use it to edit and view
    a variety of other formats, to include binary and hexadecimal. UltraEdit is a
    very versatile and useful tool.


    The Perl Editor² (PCE) is a free integrated development environment (IDE) for
    Perl. Like UltraEdit, PCE includes syntax highlighting, line numbering, and auto-indenting,
    as well as a number of other features.


    There are a number of other freely available Perl editors and IDEs, such as the
    Open Perl IDE,⁴ Perl Express,⁵, and PerlEdit.³ Personally, when I look for a Perl
    editor or IDE, I like line numbering (making it easy to find my mistakes), syntax
    highlighting (letting me catch my mistakes), and auto-indenting (code is automatically
    indented inside curly brackets, etc.), among other things. There are other nice-to-have
    features, but those are my three big ones. Take the opportunity to try some of
    the editors and IDEs that have been mentioned, or Google for others and find one
    that you like.


    # Learning to Program


    There are a number of ways that you can learn to program Perl (or any other programming
    language, for that matter), and it really depends on your own personal preference.
    One way is to teach and learn through formal instruction. I had programming classes
    in graduate school... I was required to take C, for example, and when I was young,
    I took courses in BASIC, and even took Pascal in high school. There are a number
    of ways to obtain formal instruction of this nature, to include through a local
    community college. However, some may find this type of instruction too structured,
    teaching only some of the very basic uses of the programming language, such as
    how to do relatively trivial things like open files.


    If you''re inclined, you can teach yourself, simply by diving in and doing it.
    There are a number of excellent resources available at all places, your local
    library. By reading books and following the examples, you can learn to program
    quickly, picking up the basics before progressing on more complex and useful tasks.


    ¹ http://www.ultradit.com/

    ² http://www.perlvision.com/pce/

    ⁴ http://open-perl-ide.sourceforge.net/

    ⁵ http://www.perl-express.com/

    ³ http://www.indigostar.com/perledit.html


    An additional resource that is available code that others have written. Some folks
    learn to program by looking at the steps others have taken to accomplish a task,
    and adding on it, or modifying it in some other way to meet their needs. There
    are a number of resources available, through web sites, blogs, user forums, etc.
    There are number of resources that provide archives for code others have written
    and submitted, and there are folks out there who are willing to help, and provide
    assistance and advice (proved, of course, you are making an effort to perform
    the task yourself and not asking someone to do your homework for).


    # Writing Your Own Code


    You''ll see in the code throughout this book and on the accompanying DVD that
    I have my programming style... there are certain ways that I do certain things
    in my code, and for me, that makes the code stand out. My hope is that it makes
    easier for others to read and use, Others have their own style, particularly in
    formatting. What''s that joke about lawyers and opinions? Well, put Perl programmers
    in a room with a task to accomplish, and as long as that task is by a simple "print"
    statement, you''ll likely get five different versions of code as a result. Then,
    let each look at the others and you''ll likely get more. I mention this because
    I don''t want you to think that my way of coding is THE way; its simply A way.
    Many times, I will break tasks into separate lines or sections of code, with documentation,
    where a single line may have been more elegant. I do so that someone else, perhaps
    without as much background in either the problem or in Perl can look at the code
    and have an earlier time understanding what I did. There are also times when "someone
    else" is, six months or a year later. Sometimes elegance and speed have to give
    way to understandability and the ability to use the code again at a later date.


    # Running Perl Scripts


    Perhaps the biggest issue I have with my first two Perl is the inevitable emails
    that I double-clicked the Perl script and a black box flashed on the screen...
    what do I do? Questions like this come from simply being (a) far too familiar
    and comfortable with GUI tools, and (b) unfamiliar with scripts of any kind (to
    include batch files) and the command prompt.


    To run most Perl scripts, you need to open a command prompt, navigate to the appropriate
    directory, and then type in a command, by finally hitting the Enter key. I know
    it sounds flippant, but that perhaps breaking it would make the process a bit
    easier to digest. In many cases, you may need to include parameters or arguments
    with the command; in essence, additional instructions which the script will process
    based on its code, and hopefully give you the desired result.


    # Organization of the Book


    # Part I


    Part I addresses the use of Perl when working with live systems, as when an administrator
    is troubleshooting an issue, or when responding to an incident.


    # Part II


    Part II covers the use of Perl when performing forensic analysis of files after
    an image has been acquired of the system.


    # Part III


    In Part III we will be focusing on monitoring the core application processes,
    the core application dependencies, network connectivity, Web services, and log
    files.


    # Download the Code


    Visit www.syngress.com/solutions to download the Perl scripts from this book.


    # Author Acknowledgements


    I''d like to take this opportunity to acknowledge the efforts of a couple of folks
    who were instrumental to this book being written. I''d like to acknowledge God
    for blessing me, and my family for supporting me through the process of writing
    this book, as well as the others. I''d like to thank Dave Roth for his inspiration
