  mdcn: "\n\n[content]\n脚本中返回的值指向一个由 soaplite.com 托管的温度转换 Web 服务。\n\n然后，我们创建一个 `$result`\
    \ 变量来存储 Web 服务调用的结果，通过给该变量赋值，我们连接到 Web 服务并传递值 61 来调用 \"F2c\" 转换函数。虽然这应该返回一个特定的转换结果值，但此时我们并不关心该值具体是什么。相反，我们只需要确认返回了一个值即可。\n\
    \n处理返回的结果为我们的监控提供了了逻辑支持。如果结果不是故障，我们将值 100 传递给 \"threshold_check\" 函数，表示 Web 服务正在响应。然而，如果遇到故障，我们将发送值\
    \ 1，此时 \"threshold_check\" 函数将执行我们在 \"WS_avail\" XML 中指定的动作。\n\n## 监控 Web 服务功能\n\
    \n更复杂的 Web 服务可能依赖于许多额外的依赖项以返回预期的结果。例如，你可能会连接到 Oracle Web Service Manager 网关，让你的请求被转发到业务过程执行语言（BPEL）服务器，然后到一个从远程数据库拉取数据的\
    \ Web 服务。这链复杂的事务链最终会向你返回一个结果，但该结果并不一定是你所预期的。\n\n由于此过程任何一步都可能产生错误，因此完整测试 Web 服务的功能涉及发送一个通过每个步骤的请求，然后返回一个一致的结果进行验证。如果遇到错误，它可能会以\
    \ Web SOAP 消息的形式呈现，但其中包含的是错误信息而不是你正在寻找的结果。\n\n为了测试目的，我们假设上一个测试中使用的 \"f2c\" 转换函数实际上是一个必须经过几个步骤才能成功的复杂函数。例如，这里是完全虚构的，让我们假设它获取我们需要的值，连接到\
    \ BPEL 进程将数字转换为字符串，连接到远程数据库进行字符串匹配以找到对应的摄氏度值，运行并返回我们的结果。该事务链中的任何一次失败都可能导致故障，但并不一定会向\
    \ SOAP::Lite 产生故障。\n\n## 大师级\n\n## 端到端 Web 服务测试\n\n虽然这里显示的脚本能够很好地判断 Web 服务及其所有组件是否运行正常，但它没有提供大量的故障排除信息。由于我们在监控应用程序的多个层（系统、网络、数据库等），你应该考虑对\
    \ Web 服务进行多层监控，以便在出现问题时加速故障排除。\n\n在不增加系统负载的情况下，此此的一种好方法是先执行验证测试。如果在运行验证测试后测试失败，你就可以运行单独的脚本来测试\
    \ 服务的每个部分（即测试 BPEL 进程管理器、Web 服务网关和后端数据存储）。这将识别问题位于堆栈的哪个位置，并允许你快速修复所有问题。\n\n考虑到这一点，接下来的脚本执行类似的事务，并提供一个确定的值作为结果。该结果将通过验证，如果验证失败，我们就会生成告警。该脚本见图\
    \ III.31，对应的 XML 见图 III.32 中的 \"thresh.xml\" 文件。\n\n### 图 III.31 get_ws_status.pl\n\
    \n```perl\n@get_ws_status.pl\nuse SOAP::Lite;\nuse struct;\nrequire 'thresh.pl';\n\
    \nmy $soap = SOAP::Lite(\n    -> uri('http://www.soaplite.com/Temperatures')\n\
    \    -> proxy('http://services.soaplite.com/temper.cgi');\nmy $result = $soap->f2c(32);\n\
    unless ($result->fail) {\n    if ($result->result() == 0) {\n        &threshold_check\
    \ (\"WS_status\", 1);\n    } else {\n        &threshold_check (\"WS_status\",\
    \ 100);\n    }\n}\nelse {\n    &threshold_check (\"WS_status\", 1);\n}\n```\n\n\
    **图 III.32** WS_status Monitor XML\n\n```xml\n<monitor name=\"WS_status\">\n \
    \ <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
    \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
    \n## 构建监控系统\n\n在本章中，我们汇总了多种可以用于监控应用程序的脚本。然而，为了考虑这个完整的监控包，我们需要将所有脚本整合在一起。实现这一点，我们将若干脚本的最终版本，使用相应的参数调用它们，并使用相应的依赖脚本来处理阈值和告警。\n\
    \n我们将整合在一起的脚本如下：\n\n- get_system_stats.pl 见图 III.19\n- get_process_stats.pl 使用图\
