  mdcn: "\n\n# Perl 脚本与实时响应 • I 23\n\n我电脑上的 RJ-45 接口未启用。图 1.2 通过测试系统设置菜单中的“网络连接”清晰地展示了这一信息。\n\
    \n## 图 1.2 测试系统上可见的网络连接\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_42_0.png)\n\
    \n使用如 `nic.pl` 等脚本，我们可以保存系统在某一时间点的状态，是在关机之前，还是仅仅为了记录在特定时刻哪些网络连接是启用并运行的。在从系统获取镜像后的后续调查（即“事后分析”）中，我们可能无法直接获取这些信息，而这些信息对我们的调查可能极具价值。\n\
    \n> 瑞士军刀\n\n## 更多关于网卡 (NIC) 的知识\n\n访问 `Win32_Network AdapterConfiguration` 类时，更多信息触手可及。例如，你可以获取默认网关信息、动态主机配置协议\
    \ (DHCP) 是否启用，以及关于域名系统 (DNS) 和互联网数据包交换 (IPX) 配置的信息。对 `nic.pl` 进行微调即可让你获得这些信息。\n\
    \n## Ndis.pl\n\nWMI 还通过 Windows 驱动程序模型 (WDM) 提供对 Windows 驱动程序的访问。图 I.3 显示了使用 WBEMTest\
    \ 工具生成的对话框，我们在其中列出了我的 Windows XP SP 2 系统上可用的 WDM 类。例如，高亮的类 `MSNdis_CurrentPacketFilter`\
    \ 允许我们访问网卡的当前过滤器（注意脚本开头的注释中嵌入了一个引用链接）。\n\n图 I.3 通过 WMI 测试器界面查看类 (ch1-msndis.tif)\n\
    \n![](img/dba04b5f568c7d438d1bfa61dd0316b1_43_0.png)\n\n`ndis.pl` 脚本内容如下：\n\n\
    ```perl\n#! c:\\perl\\bin\\perl.exe\n\n# ndis.pl - 用于确定网卡设置的 Perl 脚本：\n# 检查混杂模式\
    \ (promiscuous mode)\n\n# 用法: C:\\<perl> ndis.pl\n\n# 版权 2007 H. Carvey keydet89@yahoo.com\n\
    ```\n\n> www.microsoft.com/technet/scriptcenter/resources/guigui/wbemtest.msp\n\
    \nuse strict;\n\nuse Win32::OLE qw(in);\n\n# ntdis.h 中定义的 OID_GEN_CURRENT_PACKET_FILTER\
    \ 值\n\n# http://msdn.microsoft.com/library/default.asp?url=/library/en-us/\n#\
    \ wcedck5/html/wce51rfoidgencurrentpacketfilter.asp\n\n```perl\nmy $filters =\
    \ (\"NDIS_PACKET_TYPE_DIRECTED\" => 0x00000001,\nNDIS_PACKET_TYPE_MULTICAST\"\
    \ => 0x00000002,\nNDIS_PACKET_TYPE_ALL_MULTICAST\" => 0x00000004,\nNDIS_PACKET_TYPE_BROCAST\"\
    \ => 0x00000008,\nNDIS_PACKET_TYPE_SOURCE_ROUTING\" => 0x00000010,\nNDIS_PACKET_TYPE_PROMISCUOUS\"\
    \ => 0x00000020,\nNDIS_PACKET_TYPE_SMT\" => 0x00000040,\nNDIS_PACKET_TYPE_ALL_LOCAL\"\
    \ => 0x00000080,\nNDIS_PACKET_TYPE_GROUP\" => 0x00000100,\nNDIS_PACKET_TYPE_ALL_FUNCTIONAL\"\
    \ => 0x00000200,\nNDIS_PACKET_TYPE_FUNCTIONAL\" => 0x00000400,\nNDIS_PACKET_TYPE_MAC_FRAME\"\
    \ => 0x00000800);\nmy $server = Win32::NodeName;\nmy $nic = ();\nmy $locatorObj\
    \ = Win32::OLE->Create('WScripting.SWLocator') // die\n  \"Error creating locator\
    \ object: \" . Win32::OLE->LastError();\n$locatorObj->Security->ImpersonationLevel\
    \ = 3;\nmy $serverObj = $locatorObj->ConnectServer($server,'root\\wmi','') //\
    \ die\n\"Error connecting to root\\wmi on server: \" . Win32::OLE->LastError();\n\
    foreach my $ndis ($serverObj->InstancesOf(\"MSndis_CurrentPacketFilter\")) {\n\
    \  if ($ndis->Active) {\n    my $wan = \"WAN Miniport\";\n    next if ($ndis->InstanceName)\
    \ ! m/\\$wan/i;\n    my $instance = (split('/', $ndis->InstanceName))[0];\n  \
    \  $instance =~ s/\\//;\n    $nic{$instance} = 1;\n    my @gpf = ();\n    foreach\
    \ my $f (keys %filters) {\n      push(@gpf,$f) if ($ndis->CurrentPacketFilter\
    \ & $filters{$f});\n    }\n    $nic{$instance} = join(',', @gpf);\n  }\n}\nforeach\
    \ (keys %nic) {\n    my @filt = split(',', $nic{$_});\n    foreach (@filt) {\n\
    \        eq \"NDIS_PACKET_TYPE_PROMISCUOUS\" ? (print \"\\t $f\\n\") : (print\
    \ \"\\t $f\\n\");\n    }\n\n```\n\n再次，在查看 `ndis.pl` 脚本时，我们最感兴趣的是高亮的类 `MSNdis_CurrentPacketFilter`。该类让我们能够看到适配器本身的设置和过滤器。这在事件响应期间由于至关重要，因为在某些情况下，入侵者可能安装了嗅探器并将网络适配器设置为“混杂”模式。这意味着所有通过线缆的数据包都会被网络适配器读取，而不仅仅是发送给系统的包。\n\
    \n在我的测试系统上运行 `ndis.pl`，我看到：\n\n```\nDell Wireless Miniport\nNDIS_PACKET_TYPE_MULTICAST\n\
    NDIS_PACKET_TYPE_DIRECTED\nNDIS_PACKET_TYPE_BROADCAST\n```\n\n这种输出是符合预期的。如果我从输出中看到以下内容，我会很担心：\n\
    \n```\nNDIS_PACKET_TYPE_PROMISCUOUS\n```\n\n这会告诉我网络适配器处于混杂模式，并且很可能正用于网络嗅探。使用 WMI\
    \ 的脚本可以远程在其他受管系统上运行，例如域内的系统，或者系统管理员在系统上拥有本地凭据的情况。例如，查看 `ndis.pl` 中的一行代码：\n\n```perl\n\
    my $serverObj = $locatorObj->ConnectServer($server,'root\\wmi','');\n```\n\n你可以看到\
    \ `ConnectServer()` 函数接受四个参数：服务器、WMI 命名空间以及用于检索这些信息的用户名和密码。在我们使用的代码中，管理员正在使用登录账户在系统本地运行这些脚本，因此我们不需要在脚本中提供登录信息。此外，你会在脚本的前面部分看到我们通过以下代码填充了\
    \ `$server` 变量：\n\n```perl\nmy $server = Win32::NodeName();\n```\n\n如果你记得，`Win32::NodeName()`\
    \ 是内置的 Win32 函数之一。再次，使用此函数我们可以获取本地系统的名称。然而，如果系统管理员想要访问其域内的其他受管 Windows 2000、XP\
    \ 和 2003 系统，他或她必须包含远程系统的名称或 IP 地址以及正确的凭据。事实上，有了域内所有系统的准确列表，他或她可以对所有系统运行此脚本（当然，需要对脚本进行一些修改，但这些留给读者），并显示发现的处于混杂模式的\
    \ NIC。\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_46_0.png)\n\n## 大师\n\n## 无线访问驱动程序\n\
    \n2004 年，来自 Shimmo Group 的 Beetle 在 TechCorp 做了一场题为“Windows 无线毁灭性武器”的演讲包含了许多 VBScript，这些脚本访问\
    \ `MSDNS_8021` 类以检索无线适配器“看到”的服务集标识符 (SSID)、适配器接收信号强度信息等。这些信息可以有多种用途。例如，在事件响应期间，你可能想查看笔记本电脑或工作站是否启用了无线适配器，如果是，连接到了哪个\
    \ SSID。然而，你也可以使用这类信息来对非法热点的位置进行三角定位。\n\n"
