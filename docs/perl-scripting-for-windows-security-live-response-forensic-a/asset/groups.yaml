  - "[PAGE 175]\n\n# 156 Part III • Monitoring Windows Applications with Perl\n\n\
    In this XML document, we have set up a hierarchical format for the configuration\
    \ information. The first tag shown in the document is <threshold>, which indicates\
    \ what contained values will be used for. We then use the <monitor> tag to indicate\
    \ a specific monitor and a \"name\" value for the monitor. This is followed by\
    \ a series of <status> tags, each with their \"name\", \"value\", and \"operator\"\
    \ parameters. Within the <status> tags, one or more <action> tags exist indicating\
    \ which actions should be taken when the conditions for status are met.\n\nTo\
    \ import this XML data and make use of it, we will be using the XML::Simple module.\
    \ This module is loaded by default with ActivePerl, can be installed using PPM\
    \ if your ActivePerl installation does not have it. The XML::Simple module allows\
    \ for the importing, exporting, and manipulation of XML data from a file or string.\
    \ To use our XML file, the first of actions we will take with our threshold script\
    \ will be to import the XML using the XML::Simple module. An easy way to perform\
    \ this action is shown in Figure III.12.\n\n# Figure III.12 load_display_XML.pl\n\
    \n```\nuse strict;\nuse XML::Simple;\nuse Data::Dumper;\n\nmy $xml = new XML::Simple(KeyAttr=>(),\
    \ ForceArray => 1);\nmy $data=$xml->XMLIn(\"/dis/thresh.xml\");\n\n#DEBUG\n#Uncomment\
