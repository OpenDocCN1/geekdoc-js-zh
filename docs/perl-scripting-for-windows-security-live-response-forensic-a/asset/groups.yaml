  mdcn: "\n为了实现这一点，但由于某些分页提供程序有独特的要求，我将这两个子程序分开了，以便它们可以独立地进行修改。\n\n首先，我们进行一些基础的错误检查，以确保发送到子程序的选项数量正确。再次，请扩展此检查以包含针对你环境的必要检查。一个很好的补充是使用正则表达式来确认电子邮件地址符合正确的格式。\n\
    \n完成这些之后，我们接着引入了新模块的使用。`Mail::Sender` 模块未包含在基础 ActivePerl 安装中，但对于处理电子邮件相关的需求非常有用。有关选项的完整列表，请参阅\
    \ http://search.cpan.org/dist/Mail-Sender-0.8.13/Sender.pm。因此，该模块将处理我们所有的电子邮件操作，这样我们就不必担心手动打开端口、创建格式正确的简单邮件传输协议（SMTP）消息等。\n\
    \n接下来，我们创建一个新的 `Mail::Sender` 对象，并使用各种选项来设置我们的 SMTP 邮件服务器地址、“发件人”（from）头部以及错误处理选项。然后，我们调用该对象的\
    \ `Open` 函数，并传入用于“收件人”（to）和主题（subject）头的输入变量。最后，我们使用 `SendLineEnc` 函数发送消息。再次，所有这些操作在\
    \ `action_page` 子程序中都重复了，除了“发件人”头部外。\n\n## 整合一切\n\n通过如图 III.17 所示的方式调用我们的新子程序，我们现在能够从测试脚本向应用程序管理员发送电子邮件和页面。为了让这一切功能化，我们需要做的最后件事是停止使用测试脚本，实际上将阈值管理脚本和动作脚本集成到我们的监控脚本中。图\
    \ III.19 和 III.20 显示了 `get_system_stats.pl` 和 `thresh.xml` 文件的最终版本。\n\n## 图 III.19\
    \ get_system_stats.pl\n\n```perl\n#get_system_stats.pl\nuse Win32::PerfMon;\n\
    use strict;\nrequire 'thresh.pl';\n\nmy $ret = undef;\nmy $err = undef;\nmy $hObject\
    \ = undef;\nmy $Counter = undef;\nmy $CounterData = undef;\n#connect localhost->new(\"\
    \\localhost\");\n\nmy $perfmon = Win32::PerfMon->new undef;\n\nif ($perfmon !=\
    \ !) {\n\t$ret = $perfmon->AddCounter(\"Processor\",\n\t\"Processor Time\", \"\
    Total\");\n}\tif ($ret != 0) {\n\t$ret = $perfmon->AddCounter(\"Memory\",\n\t\"\
    Available MBytes\", -1);\n}\nif ($ret != 0) {\n\t$ret = $perfmon->AddCounter(\"\
    Network Interface\",\n\t\"Bytes Total/sec\",\n\t\"Intel 21140-Based PCI Fast \\\
    nEthernet Adapter [Generic]\");\n}\nif ($ret != 0) {\n\t$ret = $perfmon->AddCounter(\"\
    Network Interface\",\n\t\"Current Bandwidth\",\n\t\"Intel 21140-Based PCI Fast\
    \ \\nEthernet Adapter [Generic]\");\n}\nif ($ret != 0) {\n\t$ret = $perfmon->CollectData();\n\
    \tif ($ret != 0) {\n\t\tmy $proctime = $perfmon->GetCounterValue(\n\t\t\"Processor\"\
    ,\"% Processor Time\",\n\t\t\"Total\");\n\t\tif ($proctime != -1) {\n\t\tprint\
