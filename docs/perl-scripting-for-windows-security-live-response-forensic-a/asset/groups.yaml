- md: "\n# 126 Part II • Perl Scripting and Computer Forensic Analysis\n\n```perl\n\
    my $stuff = join(':',$pan, $name, $expiry);\n$cc_nums{$stuff} = 1;\nprintf(\"\
    %-20s %-20s %-4s\\n\", $pan, $name, $expiry);\n```\n\nThe first thing this code\
    \ snippet creates a filehandle to our file (\"$file\"), and opens the file in\
    \ read-only mode. For some reason the file can't be opened, the code will die()\
    \ with an error message (hopefully) telling us why the file couldn't be opened.\
    \ From there, we read the file at a time, chomp()'ing off the carriage return\
    \ at the end of the line. If the line doesn't start with a \"B\" (remember, this\
    \ is track 1 data), then we skip the line. From there, we split the line into\
    \ components based on the \"^\" non-separator characters (denoted by a hexadecimal\
    \ representation (\\x5e)). We remove all non-numeric characters (between 0 and\
    \ 9) from the PAN (there may be spaces or dashes-) and then retrieve the expiry\
    \ or expiry date from the remainder of the data in the third segment (i.e., the\
    \ first four characters).\n\nFinally, the last thing above code does is print\
    \ the parsed data in a fixed length format, using the printf() function. However,\
    \ there's one other thing I'd like to point out, and that's the line that reads\
    \ as:\n\n```perl\n$cc_nums{$stuff} = 1;\n```\n\nThe purpose of this line is to\
    \ remove duplicates. Many times when a search function goes through file (or acquired\
    \ image), the search may return multiple instances of the same credit card number.\
    \ This can happen for a number of reasons:\n\nboth track 1 and 2 data are found,\
    \ the PAN exists in multiple files or multiple tables in a database, etc. Whatever\
    \ the reason, you don't want to keep track of 10 copies of the same PAN. A real\
    \ simple way to go about removing duplicates and guaranteeing uniqueness is to\
    \ create a Perl hash, where the key is the data (PAN, or in the case of our code,\
    \ name, and expiry date, separated by colons) we extracted, and set the value\
    \ for that to 1 (it could be any value, really).\n\n# Note\n\n> David Schultze\
    \ shared this technique for guaranteeing uniqueness in a dataset with me back\
    \ in 1999 when we both worked at the same company. David shared a couple of really\
    \ good programming tips with me, and this is one of them. I like to give credit\
    \ where credit is due ...thanks, David!\n\nTrack 2 data, on the other hand, has\
    \ the following format:\n\n(PAN={Other data)\n\nThe track 2 data starts with the\
    \ PAN (13–16 digits) and is followed by a \"=\" separator, and up to 18 digits\
    \ of additional data, the first four of which should (again) be the expiry date\
    \ for the credit card. Perl code to parse through a flat ASCII file containing\
    \ a track 2 data search hit on each line might look similar to the following code:\n\
    \n```perl\nmy $cc_nums;\nopen(FH,\"<\", $file) || die \"Could not open $file:\\\
    n$!\\n\";\nwhile(<FH>) {\n    chomp;\n    my ($pan,$rest) = split(/=/,$_);\n \
    \   $pan =~ s/[^0-9]//g;\n    my $expiry = substr($rest,0,4);\n    my $stuff =\
    \ join(':',$pan,$expiry);\n    $cc_nums{$stuff} = 1;\n}\nclose(FH);\n```\n\nThis\
    \ code has a lot of similarities to the code for parsing the track 1 data, so\
    \ I won’t go through it all again.\n\n# Cc-sort.pl\n\nLet's take a look at an\
    \ example of using the Perl functions getType() and luhn().\n\n```perl\nuse strict;\n\
    my $file = shift || die \"You must enter a\\nfilename.\\n\";\ndie \"Could not\
    \ find $file.\\n\" unless (-e $file);\nopen(FH,\"<\", $file) || die \"Could not\
    \ open file: $!\\n\";\nwhile(<FH>) {\n    chomp;\n    isValid($_);\n}\nclose(FH);\n\
    \nsub isValid {\n    my $cc = shift;\n    # check cc number for validity; if the\
    \ card is valid,\n    # the number and the type are returned\n    # strips spaces\
    \ and dashes\n    $cc =~ s/[^0-9]//g;\n    # Verifies the length of the credit\
