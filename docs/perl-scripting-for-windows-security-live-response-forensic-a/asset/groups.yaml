    Daylight Bias => -60 minutes\nStandardName => Eastern Standard Time\nDaylightName\
    \ => Eastern Daylight Time\n\n# Master Craftsman\n\n# Getting Even More Information\n\
    \nYou can extend the getsys.pl script to get things such as the current system\
    \ time, the current Universal Coordinated Time (UTC) (UTC is analogous to Greenwich\
    \ Mean Time [GMT]), the system name, the name of the logged on user, and so forth.\
