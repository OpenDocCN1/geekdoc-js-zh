    \ additional line regarding the process name should be noted. The following statement\
    \ is used to format the resulting process name \".\" and file extension:\n$procname\
    \ = ~\\/(.++)(,)?([^.]+)?)?\\$/;\n\nWe didn't necessarily have to create a new\
    \ PL file for this. We could have used the existing file \"get_percentprocessortime.pl\"\
    \ and added a second counter. The reason I broke this out separately is because\
    \ for the overall architecture for our monitoring application, we should modularize\
    \ certain sections for use of and maintenance.\n\nIn cases, it makes sense to\
    \ combine certain statistics into a single script as you saw in the example shown\
    \ in Figure III.3. The general rule is to combine when the objects that they act\
    \ upon are similar (e.g., grouping all system-related code together or all core\
    \ process code together). In this instance, however, one of these statistics is\
    \ related to the system as a whole and the other to an individual process, therefore\
    \ it makes sense architecturally to separate them. On the other hand, it does\
    \ make sense to combine this code with the availability check for the individual\
