  - '[PAGE 180]


    # Monitoring Windows Applications with Perl • Part III 161


    We’ve already walked through the code contained in the “threshold_rules” subroutine,
    so let’s take a look at the “threshold_check” subroutine. We start off loading
    the XML data in the same manner used in “threshold_check”. Then we do a string
    match against the monitors listed in the XML file to see if the first incoming
    variable ($[_]) matches a known monitor. If it does, we gather the value and operator
    for the variety of statuses and actions associated to the monitor. For debugging
    purposes, we print out which rule we are evaluating before moving on to the actual
    evaluations.


    We have a set of operators available to check values. They are:


    +   - equalorgreater

    - equalless

    - equal

    - nequal

    - greater

    - less


    Using these operators, we can check the value variable ($_[1]) against the threshold
    value ($status->{value}). The series of if/els statements perform this evaluation.
    Note that we are specifically comparing numeric values here. Consequently, we
    have to make sure that we are dealing with a numeric value for that second variable.
    We’ll need to put in some error checking for this and will demonstrate this in
    the next version of the script.


    When a match is found, the subroutine “take_action” is called passing a variable
    containing the action name and status code. Right now we are just printing that
    string, but we can do more with that later. In this area, we’re evaluating all
    possible rules for the monitor against the value. That means we could potentially
    have more than one match. For example, using the following test script:


    ```

    use strict;

    require ''threshold.pl'';

    &threshold_check("sys_proc", 85);

    ```


    yields the results shown in Figure III.15, which has a single match for a yellow
    status code.'
