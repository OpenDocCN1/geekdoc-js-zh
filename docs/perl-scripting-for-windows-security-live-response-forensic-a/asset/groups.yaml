    I''ve conducted examinations involving MS Outlook PST files, and where one examination
    that I list the attachments by name, another required that I correlate emails
    and attachments found based on a keyword search for filenames within the acquired
    image that were found during a search using the same list of keywords.


    The point of this is that you''re rarely going to find a commercial or freeware
    application that all you have to do is click a button and the output will be exactly
    what you need, or (if you''re a consultant) what your customer is asking for.
    Most available applications allow you to view the raw data in form, and may assist
    you in doing a mediocre correlation, if any at all. Beyond that, it''s up to the
    examiner to perform any additional correlation and presentation of the data that
    has been found. Sometimes this may require that the examiner translate binary
    into something human-readable using a template or guide; or parsing through hundreds
    (or even thousands) of log entries to extract those that are relevant, or correlate
    data between multiple files. Being able to produce a utility to perform this function
    in fairly short order be of great benefit to an examiner as well as to her investigation.


    Another example that comes to mind is running searches (for keywords, credit card
    numbers, social security numbers, etc.) across an acquired image and getting massive
    amounts of data, on the order of tens (or hundreds) thousands of hits. These may
    need to be managed by filename path, credit card type, etc., and having to do
    this by hand can take several examiners days or even weeks to perform. However,
    with some programming ability, just-in-time utilities can be written efficiently
    and accurately perform highly repetitive tasks, freeing the examiner to focus
    on other tasks.


    As you can see, Perl has a number of advantages, but those advantages could apply
    to other languages, as well.


    ## How is Perl Used Within the Computer Security Community?


    Perl is used extensively within the computer security community. (Not bad for
    an opening sentence, eh?)


    The SleuthKit (http://www.sleuthkit.org) makes use of Perl. From the December
    15, 2003 edition of The Sleuth Kit Informer:


    ... it was originally designed to be a CGI script, so it was in one BIG Perl_file
    ...


    Further, the description for The Sleuthkit includes, "...The Sleuth Kit is written
    in C and Perl...",


    The Metasploit Project (http://www.metasploit.org) makes use of Perl. Moore wrote
    the PEX, or Exploit Library, a Perl module that "provides an object-oriented interface
    into common exploit routines.


    ProDiscover, the incident response and computer forensic analysis application
    from Technology Pathways (http://www.techpathways.com) uses Perl as its programming
    language. ProDiscover allows a forensic examiner to acquire images of systems,
    and then open those images for analysis. The ProDiscover graphical user interface
    (GUI) is fairly straightforward and intuitive, but Perl as Scripts, can be used
    to automate tasks within the loaded project. The ProDiscover installation routine
    includes the ActiveState (http://www.activestate.com) ActivePerl distribution,
    as well as the ProScript.pm Perl module that provides the interface so that Perl
    can be used to interact with images loaded into ProDiscover projects. The Incident
    response of ProDiscover also allowed the responder to automate tasks such as distributing
    and connecting the PDServer agents, collecting volatile information, acquiring
    live images, and disconnecting from the agent.


    One of the reasons I use Perl in the work I do is that many times, there are no
    available tools that will do the work I need to do. I am working on one investigation
    where I need to parse Registry files, and on the next one, I need to extract data
