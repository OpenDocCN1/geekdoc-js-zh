    \ 0 表示存在问题，你可能需要发送警报。在这种情况下，在发送给 `threshold_check` 子程序之前，将 0 更改另一个值，并使用 XML 文件指定的值来处理新值。运行脚本时，你应该收到类似于图\
    \ III.21 的输出。\n\n## 图 III.21 获取系统状态结果\n\n```\nC:\\WINDOWS\\system32>cmd\nEvaluating\
