    # Master Craftsman


    Parsing Event Logs

    A project to parse not only Windows 2000, XP, and 2003 Event Logs, but also Windows
    Vista/2008 Event Logs in the same script could be accomplished by combining et2xls.pl
    with code that Andreas Schuster has made available via his blog. In fact, knowing
    the “magic number” for Windows 2000, XP, and 2003 Event Logs would allow you to
    start by “looking at” the Event Log file in binary mode, and if you don’t find
    that “magic number”, then you could assume that the file is from a Windows Vista
    or 2008 system, and switch over to appropriate code.


    # Parsing RAM Dumps


    During incident response activities, the responder may opt to dump the contents
    of physical memory, or RAM, from a Windows system. This is done to preserve the
    contents of physical memory for later use and examination, and as stated by Aaron
    Walters and Nick Petroni during their Black Hat DC 2007 presentation, to answer
    new questions. In some cases, the examiner has run strings.exe against the resulting
    file to locate passwords or other unique strings, or use regular expressions (regex)
    to locate IP addresses, email addresses, etc. However, these simple searches constitute
    only the most rudimentary activities that can be performed when analyzing memory
    dumps. For example, we can extract a list of processes from the memory dump, including
    the process memory and the executable file for each (this is extremely useful
    when performing dynamic malware analysis).


