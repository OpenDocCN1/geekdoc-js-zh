- md: "\n## Perl Scripting and Computer Forensic Analysis • Part II\n\nThe Prefetch.exe\
    \ ProScript is launched in the same way as other ProScripts, and does not require\
    \ any updates. Once the ProScript locates the Prefetch directory, it begins parsing\
    \ each file, locating the timestamp for the last time the application launched\
    \ as well as the total number of times the application was launched, at specific,\
    \ known offsets (0x78 and 0x90, respectively... these offsets are different for\
    \ Prefetch files retrieved from Windows Vista systems) within the binary file\
    \ itself. As illustrated in II.7, this information is displayed in the ProScript\
    \ output window.\n\n### Figure II.7 Output of Prefetch\n\nProScript execution\
    \ started...\nPrefetch.pl : 0.1_20061106\nProScript to parse the Prefetch directory\
    \ on Windows XP systems and return the time, last access, and the run-count\n\n\
    | Filename | Timestamp | Run-count |\n| :--- | :--- | :--- |\n| ARPFDX.EXE-02E384C.pf\
    \ | Oct 13 17:39:48 2005 [UTC] | 1 |\n| ARPFDX.EXE-02A9B7A4.pf | Oct 13 17:39:24\
    \ 2005 [UTC] | 1 |\n| ARPFDX.EXE-02C3A2A3.pf | Oct 13 17:38:35 2005 [UTC] | 1\
    \ |\n| ARPFDX.EXE-E1AC8B0D.pf | Oct 13 17:38:12 2005 [UTC] | 1 |\n| ARPFDX.EXE-E5D2D2D3.pf\
    \ | Oct 13 17:38:09 2005 [UTC] | 1 |\n| ARPFDX.EXE-277416C2.pf | Oct 13 17:39:54\
    \ 2005 [UTC] | 1 |\n| ARPFDX.EXE-A6B0A6E8.pf | Wed Dec 7 18:41:57 2005 [UTC] |\
    \ 1 |\n| ARPFDX.EXE-2768B962.pf | Oct 13 17:38:19 2005 [UTC] | 1 |\n| ARPFDX.EXE-F2D6A5A3.pf\
    \ | Oct 13 17:40:20 2005 [UTC] | 1 |\n| HINDEX.EXE-E3C0D4A8.pf | Oct 13 17:38:27\
    \ 2005 [UTC] | 1 |\n| CMD.EXE-09784001.pf | Oct 01 18:13:22 2032 [UTC] | 5 |\n\
    | ECHOWND.EXE-E19F00D6.pf | Oct 01 18:05:06 2005 [UTC] | 5 |\n| EXPLORE.EXE-E9B28394.pf\
    \ | Oct 01 18:17:45 2005 [UTC] | 3 |\n| FIREFOX.EXE-E1E7B50D.pf | Nov 01 10:01:52\
    \ 2005 [UTC] | 5 |\n| FIREFOX.EXE-3468B578.pf | Nov 01 10:02:33 2005 [UTC] | 3\
    \ |\n| GINNIE.EXE-90D65534.pf | Jun 17 22:14:06 2006 [UTC] | 1 |\n| EXPLORE.EXE-271Y2232.pf\
    \ | Jun 17 22:16:55 2006 [UTC] | 2 |\n| IMAGED.EXE-B9F48A4L.pf | Wed Dec 7 18:23:28\
    \ 2005 [UTC] | 3 |\n| INTRLS.EXE-E4D0U3E.pf | Fri 03 18:13:16 2006 [UTC] | 6 |\n\
    | INSTALL_FPPE.EXE-F5B2E578.pf | Mon 17 22:14:06 2006 [UTC] | 1 |\n| JAVA.EXE-E414B86B.pf\
    \ | Nov 01 10:18:30 2005 [UTC] | 2 |\n\nAs you can see in Figure II.7, a great\
    \ deal of useful information can be derived from the application prefix files.\
    \ However, the examiner should keep in mind that the Windows XP prefetch capability\
    \ applies to all users on the system; in order to correlate specific applications\
    \ to a specific user, additional means of (already discussed) will need to be\
    \ employed.\n\n## Part II • Perl Scripting and Computer Forensic Analysis\n\n\
    ### NOTE\n\nWindows Vista also maintains Prefetch files, as well. However, the\
    \ offsets to the specific metadata maintained within the Prefetch file differ\
    \ for Vista. The Prefetch.pl ProScript is meant only for Windows XP.\n\n### Writing\
    \ ProScript output to files\n\nSometimes, trying to view a great deal of information\
    \ in the ProScript window can be cumbersome. As ProScripts are simply Perl scripts,\
    \ code can be added to write the output of ProScript to a file, as well instead\
    \ of sending it straight to the display window.\n\n### Parsing Other Data\n\n\
    Besides log files and binary data on Windows systems, there is quite a bit of\
    \ other data that can be parsed in a number of useful ways. For example, the Visa\
    \ Card Industry Data Security Standard (DSS) has put forth requirements for notification\
    \ of individuals in case their data has been compromised, but also notification\
    \ to the PCI board if a breach occurs. So what generally happens is that some\
    \ systems may be forensically acquired, and the images will be analyzed for signs\
    \ of intrusion, as well as searched for credit card numbers. Forensic tools such\
    \ as EnCase provide the capability for the user to define search for credit card\
    \ numbers using a regular expression, or for the analyst to use already-written\
    \ scripts to perform a more extensive search.\n\n### Luhn Formula (or Algorithm)\n\
    \nThe format of the credit card number is quite simple; 13 to 16 digits in length\
    \ (some European cards have 18 or 19 digits), and begin with sequences of numbers,\
    \ referred to as Bank Identification Number, or BIN. This general description\
    \ can (and will) return thousands of hits on almost any computer. In order to\
    \ be a valid credit card number, the number has to successfully pass a check via\
    \ the Luhn Formula which is not a hash function used for security purposes, but\
    \ rather a checksum used for validation. Code to perform Luhn algorithm verification\
    \ looks like:\n\n```perl\nsub luhn {\n    my $num = shift;\n    my $len = length($num);\n\
    \    my @on;\n    foreach (0..($len - 1)) {\n        push(@on, substr($num, 1));\n\
    \    }\n    my @m = reverse @on;\n    foreach my $i (0..($len - 1)) {\n      \
    \  if ($i % 2 == 0) {\n            $r[$i] = $m[$i];\n        }\n        else {\n\
    \            my $x = $m[$i] * 2;\n            ($x > 9) ? ($r[$i] = $x - 9) : ($r[$i]\
    \ = $x);\n        }\n    }\n    my $sum;\n    foreach $i (0..($len - 1)) {\n \
    \     $sum += $r[$i];\n    }\n    my $v = $sum % 10;\n    ($v == 0) ? (return\
    \ 1) : (return 0);\n}\n```\n\nThe luhn() function takes a credit card number as\
    \ its argument, and processes it, verifying whether it is a valid credit card\
    \ number or not. The function returns 1 if the number is a valid credit card number,\
    \ 0 if it isn't. You will notice that the function makes checks as the length\
    \ of the number, nor does it verify the BIN of the credit card number. EnCase's\
    \ functionality includes a built-in string function called IsValidCreditCard()\
    \ that perform these checks. I tend to use the luhn code even when parsing the\
    \ hits returned by EnCase when searching for credit card numbers, as an additional\
    \ verification.\n\nPerl code to validate or determine the type or BIN of the credit\
    \ card number might look something like this:\n\n```perl\nsub getType {\n    my\
    \ $cc = shift;\n    my $len = length($cc);\n    return undef if ($len > 19);\n\
    \    my $type;\n    if ($len == 16) {\n        if ($cc =~ m/^4/) {\n         \
    \   $type = \"Visa\"\n        } elsif ($cc =~ m/^[51|52|53|54|55]/) {\n      \
    \      $type = \"MasterCard\"\n        } elsif ($cc =~ m/^6011/) {\n         \
    \   $type = \"Discover\"\n        } else {\n            $type = \"Unknown\"\n\
    \        }\n    } elsif ($len == 15) {\n        $type = \"AmEx\" if ($cc =~ m/^[34|37]/);\n\
    \    } elsif ($len == 14) {\n        $type = \"Diners\" if ($cc =~ m/^[36|38]/);\n\
    \    } elsif ($len == 13) {\n        $type = \"Visa\" if ($cc =~ m/^4/);\n   \
    \ } else {\n        $type = \"Unknown\";\n    }\n    print \"cc is $len long.\\\
    n\";\n}\n```\n\nThe track data is a bit different because it includes the credit\
    \ card number (a.k.a., primary account, or PAN). Track 1 data has the following\
    \ format (keep in mind that this is a simple overview):\n\nB(PAN)-(Name)^(Other\
    \ data)\n\nTrack 1 data starts with a format code \"B\", and is followed by the\
    \ PAN and the \"^\" separator. The Name field is 19 characters long and is made\
    \ up of ASCII characters; this is followed by another \"^\" separator, and 18\
