    Figure II.6 Example output of the SysRestore.pl ProScript\n\n![](img/dba04b5f568c7d438d1bfa61dd0316b1_136_0.png)\n\
    \nFigure II.6 clearly illustrates the utility of the SysRestore.pl ProScript.\
    \ In the upper portion is a listing of the various codes that pertain to why a\
