    Download the SDK and install it as shown.


    Post-installation, there are several ways to get the SDK to work properly with
    Visual C++ Express Edition. First, open up the C:\Program Files\Microsoft Visual
    Studio 9\VCProjectengine.dll.express.config file. Modify the "Include" line to
    look as follows:


    ```

    Include="$(VCInstallDir)\$(InstallDir)PlatformSDK\$(FrameworkSDKDIR)\lib;

    C:\Program Files\Microsoft Platform SDK for Windows Server 2003\R2

