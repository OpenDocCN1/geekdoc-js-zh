    rewriting the code you use from scratch (say, to open sockets and connect to a
    server on the Internet) you can access the functionality you need in any one of
    available modules. To see what modules were installed with Perl, you can click
    your way through the Start menu. Another way to manage Perl modules is to use
    the Package Manager, or ppm. If you''re not comfortable with the command line,
    you can type "ppm" at the command prompt and the graphical user interface (GUI)
    will open, as illustrated in Figure 1.

