    \n# Author\n\nHarlan Carvey (CISSP), author of the acclaimed Windows Forensics\
    \ and Incident Recovery, is a computer forensics and incident response consultant\
    \ based out of the Northern/VA/Metro DC area. He currently provides emergency\
    \ incident response and computer forensic analysis services to clients throughout\
    \ the U.S. His specialties include focusing specifically on the Windows 2000 and\
    \ later platforms with regard to incident response, Registry and memory analysis,\
    \ and post-mortem computer forensic analysis. Harlan’s background includes positions\
    \ as a consultant performing vulnerability assessments and penetration tests and\
    \ as a full-time security engineer. He also has supported federal government agencies\
    \ with incident response and computer forensic services.\n\nHarlan holds a bachelor’s\
    \ degree in electrical engineering from the Virginia Military Institute and a\
    \ master’s degree in electrical engineering from the Naval Postgraduate School.\n\
    \nHarlan would like to thank his wife, Terri, for her support, patience, and humor\
    \ throughout the entire process of writing his second book.\n\nHarlan wrote Parts\
    \ I and II.\n\n# Technical Editor\n\nDave Kleiman (CAS, CCE, CIFI, CEECS, CISM,\
    \ CISP, ISSAP, ISSMP, MCSE, MVP) has worked in the independent Information Technology\
    \ Security sector since 1990. Currently, he runs an independent Computer Forensic\
    \ company Dave Kleiman that specializes in litigation support, computer forensic\
    \ investigations, incident response, and intrusion analysis. He developed a Windows\
    \ Operating System lockdown tool, S-Lok, which surpasses NSA, NIST, and Microsoft\
    \ Common Criteria Guidelines. He is frequently a speaker at many national security\
    \ conferences and a regular contributor to security-related newsletters, websites,\
    \ and Internet forums. Dave is a member of many professional security organizations,\
    \ including the Miami Electronic Crimes Task Force (MECTF), International Association\
    \ of Computer Forensics (IACIS), International Information Systems Forensics Association\
    \ (ISFA), the International Society of Forensic Computer Examiners, Information\
    \ Systems Audit and Control Association (ISACA), High Technology Crime Investigation\
    \ Association (HTCIA), Association of Certified Fraud Examiners (ACFE), High Tech\
    \ Crime Consortium (HTCC), and the International Association of Counter Terrorism\
    \ and Security Professionals (IACSP). He is also the Chief Staff for Information\
    \ Technology at the FBI’s InfraGard.\n\nDave is a contributing author for Microsoft\
    \ Log Toolkit (Syngress Publishing, ISBN: 1932266526), Security Log Management:\
    \ Identifying Patterns in the Chaos (Syngress Publishing, ISBN: 1597490423), and\
    \ How to Cheat at Windows System Administration (Syngress Publishing: ISBN: 1597491055).\
    \ Technical Editor for Perfect Passwords: Selection, Protection, Authentication\
    \ (Syngress Publishing, ISBN: 1597490415), Winternals Defragmentation, Recovery,\
    \ and Administration Field Guide (Syngress Publishing, ISBN: 1597490792), Windows\
    \ Forensic Analysis: Including DVD Toolkit (Syngress Publishing, ISBN: 159749156X),\
    \ The Official CHFI Study Guide (Syngress Publishing, ISBN: 1597491977), and CD\
    \ and DVD Forensics (Syngress Publishing, ISBN: 1597491284). He was The Technical\
    \ Reviewer for Enemy at the Water Cooler: Real Life Stories of Insider Threats\
    \ (Syngress Publishing ISBN: 1597491292).\n\n# Contributing Author\n\n**Jeremy\
    \ Faircloth** (Security+, CCNA, MCSE, MCP+I, A+, etc.) is an IT Manager for EchoStar\
    \ Satellite L.L.C., where he and his team architect and maintain enterprisewide\
    \ client/server and Web-based technologies. He also acts as a technical resource\
    \ for other IT professionals, using his expertise to help others expand their\
    \ knowledge. As a systems engineer with over 13 years of real-world IT experience,\
    \ he has become an expert in many areas, including Web development, database administration,\
    \ enterprise security, network design, and project management. Jeremy has contributed\
    \ to several Syngress books, including *Microsoft Log Parser Toolkit* (Syngress,\
    \ ISBN: 1932266520), *Managing and Securing a Cisco SWAN* (ISBN: 1932266917),\
    \ *C# for Java Programmers* (ISBN: 193183654X), *Snort 2.0 Intrusion Detection*\
    \ (ISBN: 1931836744), and *Security+ Study Guide & DVD Training System* (ISBN:\
    \ 1931836728).\n\nJeremy wrote Part III.\n\n# Contents\n\n- Preface ........................................................................................................\
