    Now we have a collection of Perl scripts that monitor a core application. Through
    the collection of system and process statistics, a threshold evaluation script,
    and an action configured by an XML file, we are able to accomplish our goals of
    gathering critical data, evaluating that data, and taking action based on the
    results. With simple modifications of these scripts, you can put a robust monitoring
    system in place for your core application.


    # Core Application Dependencies


    With monitoring in place for the core application, we can move on building out
    some monitoring tools for core application dependencies. These dependencies can
    range from remote databases to SAN systems and even to other application processes.
    In order to have a good overview of what is happening in our application environment,
    these other factors and dependencies need to be monitored. In this section, we
    will build out some tools'
- md: "\n## Monitoring Remote System Availability\n\nWhen monitoring a remote system,\
    \ there are several factors to watch for. First, you want to make sure that the\
    \ system is available on your network. By performing a simple PING check, this\
    \ can easily be confirmed. But that does not necessarily mean that the system\
    \ is actually available and providing the services you need. For example, if you\
    \ are relying on the system to respond on a specific port for a service such as\
    \ SMTP or Hypertext Transfer Protocol (HTTP), you would want to ensure that you\
    \ are able to communicate between systems on that port as.\n\nDoing this type\
    \ of availability check is a little more complex, but certainly provides more\
    \ information to us from a monitoring perspective. The easiest test to check for\
    \ availability along these lines would be to open a port on the remote system,\
    \ confirm that the communication successfully takes place, and then close the\
    \ port. A more complex check would involve sending specific data down that communication\
    \ channel and confirming the results, but at this point it would be wiser to build\
    \ a reusable monitoring component that checks one or more ports for us.\n\nThe\
    \ script shown in Figure III.22 shows one way that we can accomplish this type\
    \ of remote system availability check using the IO::Socket module. This module\
    \ is of the default installation for ActivePerl.\n\n### Figure III.22 get_port_status.pl\n\
    \n```\n#get_port_status.pl\nuse strict;\nrequire 'thresh.pl';\nuse IO::Socket;\n\
    \nmy $portCheck = new IO::Socket::INET {\n    PeerAddr => 'localhost',\n    PeerPort\
    \ => '80',\n    Proto => 'tcp',\n};\n\nif ($portCheck == undef) {\n    $threshold_check(\"\
    *remote_port\", 1);\n} else {\n    $threshold_check(\"*remote_port\", 100);\n\
    }\n\nif ($portCheck != undef) {\n    close($portCheck);\n}\n```\n\nThis also requires\
    \ a modification to our “thresh.xml\" file in order to create a threshold for\
    \ the new monitor. The additional XML for this monitor is shown in Figure III.23.\n\
    \n### Figure III.23 remote_port Monitor\n\n```xml\n<monitor name=\"remote_port\"\
    >\n  <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
    \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
    \nIn this script we're doing a very simple check of the port status on the remote\
    \ system. If this test is successful, we learn two things. First, that the remote\
    \ system is available and secondly it is accepting connection requests on the\
    \ port we are checking. If this test is unsuccessful, we then know that either\
    \ the remote system nor the remote port is not responding.\n\nThe script itself\
    \ begins by adding in the requirement of \"thresh.pl\" and the use of IO::Socket.\
    \ Next, we create a new object utilizing the IO::Socket module with the address,\
    \ port, and protocol used by the remote service that we are monitoring. From there\
    \ it's just a matter of checking to see if we were successful in creating that\
    \ connection or not alerting as appropriate.\n\nYou'll note that for the status\
    \ values we use 100 and 1. Normally you would expect to see a 0 and 1 status code,\
    \ but remember that with the threshold validation script we require that the values\
    \ being passed are integers. 0 is not an integer, we have to use other values\
    \ for our status codes.\n\nLastly, and perhaps most importantly, we have to do\
    \ some cleanup. If the \"port check\" object is defined indicating success, we\
    \ must consequently close that port. You certainly don't want to open a huge number\
    \ of ports on your remote system due to your monitoring script. Using the 'close'\
    \ function we can accomplish this cleanup.\n\n## Monitoring Available Disk Space\n\
    \nAnother dependency that is often overlooked is disk space. When monitoring an\
    \ app, it is pretty typical to forget that disk space is a requirement for applications\
    \ that are not disk intensive. There are always log file writes, movement of temporary\
    \ data, and potential writes for virtual memory use to consider. With that in\
    \ mind, we need a script to monitor free disk space.\n\nWhile we could use the\
    \ performance monitor statistics for this, there could be potential pitfalls with\
    \ that approach. Performance monitor only collects disk statistics if they are\
    \ explicitly enabled through the use of a command line action. The alternative\
    \ is to manually check the disk information. While this is slightly more disk\
    \ intensive, it is more reliable and will provide useful information in more situations.\n\
    \nThe script shown in Figure III.24 demonstrates how this type of free disk space\
    \ check can be performed. This script uses the Win32::FileOp module, which in\
    \ turn has dependencies on the Data::Lazy, Win32::AbsolutePath, and Win32::API\
    \ modules. More information on the Win32::FileOp module can be found at http://search.cpan.org/dist/Win32-FileOp-0.14.1/FileOp.pm.\n\
    \n### Figure III.24 get_disk_space.pl\n\n```\n#get_disk_space.pl\nuse strict;\n\
    require 'thresh.pl';\nuse Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\"\
    ;\n\nmy ($freeSpaceFor, my $totalSize, my $totalFreeSpace) = GetDiskFreeSpace\
    \ $disk;\n\nif ($totalFreeSpace != undef && $totalSize != undef) {\n    my $percentSpace\
    \ = int(($totalFreeSpace / $totalSize) * 100);\n    $threshold_check(\"disk_space\"\
    , $percentSpace);\n} else {\n    print \"Unable to get disk space!\\n\";\n}\n\
    ```\n\nAnd again, there are changes to our \"thresh.xml\" file to specify the\
    \ new monitor. The monitor XML is shown in Figure III.25.\n\n### Figure III.25\
    \ disk_space Monitor\n\n```xml\n<monitor name=\"disk_space\">\n  <status name=\"\
    red\" value=\"0\" operator=\"less\">\n    <action>email</action>\n    <action>page</action>\n\
    \  </status>\n  <status name=\"green\" value=\"10\" operator=\"greater\">\n  \
    \  <action>none</action>\n  </status>\n</monitor>\n"
  mdcn: "\n\n## 监控远程系统的可用性\n\n在监控远程系统时，有几个需要注意的因素。首先，你需要确保该系统在你的网络上是用的。通过执行简单的 PING\
    \ 检查可以很容易确认这一点。但这并不意味着该系统实际上是可用并提供了你所需的服务。例如，如果你依赖系统对特定端口（如 SMTP 或超文本传输协议 (HTTP)\
    \ 服务端口）做出响应，那么你还需要确保系统之间在该端口上能够进行通信。\n\n进行这种类型的可用性检查要复杂一些，但从监控的角度来看，它确实为我们提供了更多信息。沿着此类思路检查可用性最简单的方法是在远程系统上打开一个端口，确认通信成功发生，然后关闭该端口。更复杂的检查涉及向该通信通道发送特定数据并确认结果，但在此时，更明智的做法是构建一个可重用的监控组件，为我们检查一个或多个端口。\n\
    \n图 III.22 显示的脚本展示了使用 `IO::Socket` 模块实现此类远程系统可用性检查的方法。该模块是 ActivePerl 默认安装的。\n\
    \n### 图 III.22 get_port_status.pl\n\n```\n#get_port_status.pl\nuse strict;\nrequire\
    \ 'thresh.pl';\nuse IO::Socket;\n\nmy $portCheck = new IO::Socket::INET {\n  \
    \  PeerAddr => 'localhost',\n    PeerPort => '80',\n    Proto => 'tcp',\n};\n\n\
    if ($portCheck == undef) {\n    $threshold_check(\"*remote_port\", 1);\n} else\
    \ {\n    $threshold_check(\"*remote_port\", 100);\n}\n\nif ($portCheck != undef)\
    \ {\n    close($portCheck);\n}\n```\n\n这还需要对我们的“thresh.xml”文件进行修改，为新的监控器创建一个阈值。该监控器的额外\
    \ XML 所示如图 III.23 。\n\n### 图 III.23 remote_port Monitor\n\n```xml\n<monitor name=\"\
    remote_port\">\n  <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
    \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
    \n在这个脚本中，我们正在对远程系统的端口状态进行非常简单的检查。如果此测试成功，我们就能获两个信息：首先，远程系统是可用的；其次，它在我们正在检查的端口上接受连接请求。如果此测试失败，我们就知道要么远程系统没有响应，要么远程端口没有响应。\n\
    \n脚本本身首先添加了对 \"thresh.pl\" 的引用和对 IO::Socket 的使用。接下来，我们利用 `IO::Socket` 模块创建一个新对象，并使用我们正在监控的远程服务所使用的地址、端口和协议。之后，只需检查我们是否成功创建了连接，或者根据需要发出告警即可。\n\
    \n你会注意到，对于状态值，我们使用了 100 和 1。通常情况下，你会期望看到 0 和 1 状态码，但记住，在阈值验证脚本中，我们要求传递的值是整数。0\
    \ 不是整数，我们必须为状态码使用其他值。\n\n最后，可能最重要的一点是我们必须进行一些清理工作。如果“端口检查”对象被定义（表示成功），我们随后必须关闭该端口。你肯定不想因为监控脚本而在你的远程系统上打开大量的端口。使用\
    \ `close` 函数可以完成此清理。\n\n## 监控可用磁盘空间\n\n另一个经常被忽略的依赖项是磁盘空间。在监控应用程序时，对于非磁盘密集型应用程序，忘记磁盘空间是一个要求是非常典型的。总会有日志文件写入、临时数据移动以及用于虚拟内存使用的潜在写入需要考虑。考虑到这一点，我们需要一个脚本来监控可用磁盘空间。\n\
    \n虽然我们可以使用性能监控统计数据来实现，但这种方法可能存在潜在的陷阱。性能监控器仅在通过命令行操作显式启用时才会收集磁盘统计数据。另一种方法是手动检查磁盘信息。虽然这稍微更消耗磁盘，但它更可靠，并且在更多情况下提供有用信息。\n\
    \n图 III.24 显示的脚本演示了如何进行这种可用磁盘空间检查。该脚本使用了 `Win32::FileOp` 模块，该模块依赖于 `Data::Lazy`、`Win32::AbsolutePath`\
    \ 和 `Win32::API` 模块。关于 `Win32::FileOp` 模块更多信息可以在 http://search.cpan.org/dist/Win32-FileOp-0.14.1/FileOp.pm\
    \ 找到。\n\n### 图 III.24 get_disk_space.pl\n\n```\n#get_disk_space.pl\nuse strict;\n\
    require 'thresh.pl';\nuse Win32::FileOp qw(GetDiskFreeSpace);\n\nmy $disk=\"c:\"\
    ;\n\nmy ($freeSpaceFor, my $totalSize, my $totalFreeSpace) = GetDiskFreeSpace\
    \ $disk;\n\nif ($totalFreeSpace != undef && $totalSize != undef) {\n    my $percentSpace\
    \ = int(($totalFreeSpace / $totalSize) * 100);\n    $threshold_check(\"disk_space\"\
    , $percentSpace);\n} else {\n    print \"Unable to get disk space!\\n\";\n}\n\
    ```\n\n同样，我们需要更改我们的“thresh.xml”文件以指定新的监控器。监控器的 XML 所示如图 III.25。\n\n### 图 III.25\
    \ disk_space Monitor\n\n```xml\n<monitor name=\"disk_space\">\n  <status name=\"\
    red\" value=\"0\" operator=\"less\">\n    <action>email</action>\n    <action>page</action>\n\
    \  </status>\n  <status name=\"green\" value=\"10\" operator=\"greater\">\n  \
    \  <action>none</action>\n  </status>\n</monitor>\n```\n\n"
