    \ {\n                $procname = $id->(\"Name\");\n                print \"$procname\
    \ is running!\\n\";\n                &threshold_check(\"proc_avail\", 100);\n\
    \                $prostatus = 1;\n            }\n        }\n    }\n    if ($prostatus\
    \ != 1) {\n        print \"Process $counterdata cannot be found!\";\n        &threshold_check(\"\
    proc_avail\", 1);\n    } else {\n        $procname = s/(.+)\\s*(\\[\\])?$/1;\n\
    \        if ($perfmon != undef) {\n            $ret = $perfmon->AddCounter(\"\
    Process\", \"Processor Time\", $procname);\n            if ($ret != 0) {\n   \
    \             $ret = $perfmon->AddCounter(\"Process\", \"Private Bytes\", $procname);\n\
    \                if ($ret != 0) {\n                    $ret = $perfmon->CollectData();\n\
    \                    if ($ret != 0) {\n                        my $proctime =\
    \ $perfmon->GetCounter(\"Process\", \"Processor Time\", $procname);\n        \
    \                if ($proctime > -1) {\n                            print \"$procctime\
    \ Processor Time = $proctime\\n\";\n                            if ($proctime\
    \ > 0) {\n                                &threshold_check(\"proc_cpu\", $proctime);\n\
    \                            } else {\n                                &threshold_check(\"\
    proc_cpu\", 1);\n                            }\n                        }\n  \
    \                  } else {\n                        $err = $perfmon->GetErrorText();\n\
    \                        print(\"Failed to get the processor data!\\n\", $err,\
    \ \"\\n\");\n                    }\n                }\n                my $freem\
    \ = $perfmon->GetCounterValue(\"Process\", \"Private Bytes\", $procname);\n  \
    \              if ($freem > -1) {\n                    &threshold_check(\"proc_mem\"\
    , $freem);\n                }\n                $freem = $s/(?=(\\d)(\\d{3})+(?!\\\
    d))//g;\n                print(\"Memory used by process = ${freem} Bytes\\n\"\
    );\n            } else {\n                $err = $perfmon->GetErrorText();\n \
    \               print(\"Failed to get the memory counter data!\\n\", $err, \"\\\
    n\");\n            } else {\n                $err = $perfmon->GetErrorText();\n\
    \                print(\"Failed to collect the perf data!\\n\", $err, \"\\n\"\
    );\n            } else {\n                $err = $perfmon->GetErrorText();\n \
    \               print(\"Failed to add the counter!\\n\", $err, \"\\n\");\n   \
    \         }\n        } else {\n            print(\"Failed to create the perf object!\\\
