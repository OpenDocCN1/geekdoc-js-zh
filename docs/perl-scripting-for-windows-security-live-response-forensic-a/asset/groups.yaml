    \ When working with the Event Log on a live system, most folks will interface\
    \ with it through the Event Viewer. One of the techniques that a forensic analyst\
    \ may use to analyze an Event Log during an investigation is to extract the file\
    \ from within the image and then attempt to open the log in the Event Viewer on\
    \ their analysis. However, this does not always work... many analysts have reported\
    \ an error message stating that the Event Log is \"corrupt\". This message is\
    \ reported by the Windows API – so what if, like the Registry, we can parse the\
    \ contents of the Event Log files without using the API?\n\n# Evt2xls.pl\n\nEvt2xls.pl\
    \ is a Perl script that I developed over time, and found it to be extremely useful.\
    \ I started with a simple script that parsed the .evt file in binary mode, and\
