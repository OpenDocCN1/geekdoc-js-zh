    \ Scripting and Computer Forensic Analysis\n\n### Backup Operators\n\nBackup Operators\
    \ can override security restrictions for the sole purpose of backing up or restoring\
    \ files\n\n```\nKeyLastWrite Time = Tue Aug 17 20:27:13 2004 (UTC)\nNo Users\n\
    ```\n\n### Replicator\n\nSupports file replication in a domain\n\n```\nKeyLastWrite\
    \ Time = Tue Aug 17 20:27:13 2004 (UTC)\nNo Users\n```\n\n### Administrators\n\
    \nAdministrators have complete and unrestricted access to the computer/domain\n\
    \n```\nKeyLastWrite Time = Wed Aug 18 00:46:24 2004 (UTC)\nAdministrator\n```\n\
    \n### Harlan\n\n### Power Users\n\nUsers possess some administrative powers with\
    \ some restrictions. Thus, Power Users can run legacy applications in addition\
    \ to certified applications\n\n```\nKeyLastWrite Time = Tue Aug 17 20:27:13 2004\
    \ (UTC)\nNo Users\n```\n\n### Guests\n\nGuests have the same access as members\
    \ of the Users group by default, except for The Guest account is further restricted\n\
    \n```\nKeyLastWrite Time = Tue Aug 17 20:27:13 2004 (UTC)\nGuest\n```\n\n### Remote\
