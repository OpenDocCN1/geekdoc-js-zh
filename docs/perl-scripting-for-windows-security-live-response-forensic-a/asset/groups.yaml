    \ function, and to get the name of the logged on user, you might use the GetUserNameA\
    \ API function.\n\nRetrieving information from a Windows system via the API can\
    \ be useful, but it can also lead to problems. Many times APIs will change between\
    \ versions of Windows (such as between Windows 2000 and XP), or they may even\
    \ change when a Service Pack is installed or updated. As such, direct use of the\
    \ Windows API to collect some information from systems should be thoroughly tested\
    \ before being deployed on a widespread basis.\n\n# WMI\n\nThe Windows Management\
    \ Instrumentation (WMI) is a great way to obtain information from live Windows\
