    greater\"/>\n    <status color=\"yellow\" value=\"300\" operator=\"greater\"/>\n\
    \    <status color=\"green\" value=\"200\" operator=\"less\"/>\n  </monitor>\n\
    </threshold>\n```\n\n# 155 第三部分 • 使用 Perl 监控 Windows 应用程序\n\n# 156 第三部分 • 使用 Perl\
    \ 监控 Windows 应用程序\n\n# 157 第三部分 • 使用 Perl 监控 Windows 应用程序\n\n"
