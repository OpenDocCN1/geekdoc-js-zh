    # Part II • Perl Scripting and Computer Forensic Analysis


    # SAMParse.pl


    While a system is running, not even an administrator can access the SAM database,
    which contains information about the user accounts on the system (to include the
    password hashes). However, during a post-mortem analysis of the system, a great
    deal of information about the local user accounts is included in the SAM database,
    which exists as the file named “SAM” within the C:\Windows\system32\config (or
    Winnt\, as may be) directory. The samparse.pl script not only parses through the
    various user accounts embedded in the SAM database, but also extracts and decodes
    the information maintained in the “F” and “V” values for each user. Before exiting,
    it also parses and displays information about groups and group membership on the
    system (i.e., as it applies to local user accounts).


    ```

    #! c:\bin\perl.exe

    ------------------------------------------------

    # samparse.pl

    # Perl script to retrieve user information from a raw

    # Registry/SAM file

    # Usage:

    # C:\perlsparse.pl <path_to_SAM_file> [> sam_user.txt]


    # This script is intended to be used against SAM files

    # extracted from

    # from an image, either from the system32\config directory, or from system

    # restore points.

    #----------------------------------------------------------------

    # copyright 2006-2007 H. Carvey, keydet89@yahoo.com

    ----------------------------------------------------------------

    use strict;

    use Parse::Win32Registry qw(:REG_);

    # Included to permit compiling via Perl2Exe

    #perl2exe_exclude Parse/Win32Registry/Key.pm";n#perl2exe_include "Parse/Win32Registry/Value.pm";

    my $sam = $shift || die "You must enter a filename.\n"

    die "$sam not found.\n" unless (-e $sam);

    my $acb_flags = (0x0001 => "Account Disabled", 0x0002 => "Home directory required",
    0x0004 => "Password not required", 0x0008 =>> "Temporary duplicate account",

    ```'
