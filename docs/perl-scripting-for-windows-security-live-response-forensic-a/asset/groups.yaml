  - '[PAGE 187]


    for this, but since some paging providers have unique requirements, I have separated
    the two subroutines so that they can be easily modified independently.


    First, we do some basic error checking to make sure that we have the correct number
    of options sent to the subroutine. Again, expand this checking to include necessary
    checks for your own environment. A good addition would be using regular expressions
    to confirm that the e-mail address is in the right format.


    With that in place, we then add in the use of a new module. The Mail::Sender module
    is not included in the base ActivePerl installation, but is very useful for handling
    e-mail related needs. For a full listing of options, please see http://search.cpan.org/dist/Mail-Sender-0.8.13/Sender.pm.
    This module will consequently do all of our e-mail handling so we don''t have
    to worry about opening ports manually, creating an Simple Mail Transfer Protocol
    (SMTP) message in the correct format, and so forth.


    Next, we create a new Mail::Sender object with a variety of options to set our
    SMTP mail server address, “from” header, and the error handling option. Then we
    call the “Open” function of the object and pass in our incoming variables for
    the “to” and subject headers. Finally, we send the message using the “SendLineEnc”
    function. Again, all of this is duplicated in the “action_page” subroutine with
    exception of the “from” header.


    # Putting it all Together


    By calling our new subroutine in the manner shown in Figure III.17, we are now
    able to send e-mails and pages to our application admin from our test script.
    The last thing we need to do to make all of this functional is to get away from
    using the test script and actually integrating the threshold management script
    and action script with our monitoring scripts. Figure III.19 and III.20 show final
    versions of the get_system_stats.pl and thresh.xml files.'
