    \        $status->(value).\" perform action \"\n                         $action\
    \ . \" and set status as \"\n                         $status->(name) . \" \\\
    *.\\n\";\n\n                    if ($status->(operator) eq \"alequalorgreater\"\
    ) {\n                        if ($[1] >= $status->(value)) {\n               \
    \             &take_action($action,\n                                $status->(name);\n\
