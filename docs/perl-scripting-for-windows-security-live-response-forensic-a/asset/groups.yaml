    \ my $class = $conn->GetValue(\"\");\n            print \"Class : $class\\n\"\
    ;\n            my $module = $conn->{(\"InprocServer32\")} -> GetValue(\"\");\n\
    \            print \"Module: $module\\n\";\n        }\n    }\n    print \"\\n\"\
    ;\n} else {\n    $err = Win32::FormatMessage Win32::GetLastError();\n    print\
    \ \"Error connecting to $key: $err\\n\";\n}\n}\n```\n\n```perl\nelse {\n    $err\
