    # Perl Scripting and Computer Forensic Analysis • Part II 59


    Registry can be looked at as one big log file. The Registry is made up of keys
    (the folders you see when you open RegEdit), which contain subkeys and values,
    and values, which contain data. Figure II.1 illustrates keys, values, and data.


    # Figure II.1 Extract from RegEdit showing keys, values, and data


    | Keys | Values | Data |

    | --- | --- | --- |

    | Reliability | SignatureSysTrayApp | REG_SZ | stsystra.exe |

    | Run | JavaUpdatesSched | REG_SZ | C:\Program Files\Java\pre1\ |

    | RunOnce | ViewMgr | REG_SZ | C:\Program Files\Viewport\


    More information regarding the specific structure of the Registry, as well as
    its immense value in forensic analysis, please see my other book published by
    Syngress/Elsevier, Windows Forensic Analysis.


    As we saw in the previous Part, a great way to access the Registry on a live system
    is through the use of the Win32::Registry module. However, when performing forensic
    analysis of Registry files extracted from an acquired image, the ideal model to
    use is the Parse::Win32Registry module² from James McFarlane. I have looked into
    writing my own tools for accessing a raw Registry file and extracting keys and
    values, while I was going putting together the ground work for that module, James
    released a version of his Parse::Win32Registry module, which takes a completely
    object-oriented approach to the task. While we will be using James'' module to
    parse Registry files from Windows 2000, XP, 2003, and yes, even Vista, Parse::Win32Registry
    can be used to parse Registry files from Windows ME and 95/98, as noted.


    > NOTE

    As I''m writing this Paper, the Parse::Win32Registry module is not available via
    the Perl Package Manager (ppm). In order to install this module, all you really
    need to do is download the .tar.gz file, decompress everything (WinZip works just
    fine), and copy the entire Parse folder to the \Parse\lib\ directory on your system.


    ² http://search.cpan.org/~jmacfarla/Parse-Win32Registry-0.30/'
