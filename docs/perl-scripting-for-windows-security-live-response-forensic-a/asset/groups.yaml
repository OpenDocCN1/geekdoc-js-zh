    20\" operator=\"greater\">\n    <action>none</action>\n  </status>\n</monitor>\n\
    <monitor name=\"DB_avail\">\n  <status name=\"red\" value=\"1\" operator=\"equal\"\
    >\n    <action>email</action>\n    <action>page</action>\n  </status>\n  <status\
