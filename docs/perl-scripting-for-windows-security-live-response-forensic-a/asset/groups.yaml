    These are the most common types of disk access methods that you would use when

    connecting to a disk, and are all easily handled by the Win32::FileOp module.


    # Monitoring Remote Databases


    When an application reaches the enterprise level, it frequently separates the
    presentation

    layer of the application from the data layer.This means that a database is brought
    into

    the equation, whether local or remote. In order to monitor all dependencies of

    application, it becomes critical to monitor the database used by the application.


    We could reuse the "get_port_status.pl" script shown in Figure III.22 for

    this purpose, experience shows that while a connection may be able to be made

    to listening port for a database, that does not necessarily mean that the database
    is

    available. This requires a more complex test than a simple port connection.


    Rather than checking the port status, we need to go further and actually connect,

    authenticate, and confirm that the database is returning a valid response. For
    this

    example, we will be using the DBI module. This module is included in the ActivePerl

    installation and extensive detail on this module can be found http://search.cpan.

    org/dist/DBI-1.58/


    While there are other database connection modules available, this allows for one

    great of flexibility and works well for monitoring purposes. There are also many

    drivers that work with this module to allow for connections to a variety of

    dabase types. In this example, we will be using the DBD:mysql module to connect
    to

    a local MySQL database. Details on this specific driver can be found http://search.

    cpan.org/dist/DBD-mysql-3.0002/ and the module can be installed through PPM.


    The script shown in Figure III.27 shows a simple database availability monitoring

    process that goes through all of the steps described above, and sends the results

    to the usual thresh script. Additionally, the XML shown in Figure III.28 shows
    the

    necessary addition to the "thresh.xml" file to add these monitors.'
