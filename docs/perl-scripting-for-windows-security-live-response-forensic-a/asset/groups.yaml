    \t}else\n\t\t$err = $perfmon->GetLastError();\n\t\tprint \"Failed to get the counter\
    \ data!\\n\"\n\t\t$err,\n\t}\n}\n\nmy $freemem = $perfmon->GetCounterValue(\n\t\
    \"Memory\",\"Available MBytes\",\n\t-1);\nif ($freemem > -1)\n```\n\n```perl\n\
    {\n  print \"Available Memory = [$freemem]MB\\n\";  &threshold_check(\"sys_mem\"\
    , $freemem);\n}\nelse\n  $Err = $perfmon->GetErrorText();\n  print \"Failed to\
