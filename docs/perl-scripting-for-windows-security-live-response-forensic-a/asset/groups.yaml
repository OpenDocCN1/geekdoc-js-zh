  - "[PAGE 40]\n\n```\n#! c:\\perl\\bin\\perl.exe\n#--------------------------------------------------------------------------------\n\
    # nic.pl\n# Use WMI to get information about active network interface cards\n\
    # on a system\n#\n# Usage: [perl] nic.pl\n#\n# Copyright 2004-2007 H. Carvey keydet89@yahoo.com\n\
    #\nuse strict;\nuse Win32::OLE qw(in);\nuse Getopt::Long;\nmy $config = ();\n\
    Getopt::Long::Configure(\"prefix_pattern=-|\\/\");\nGetOptions($config, qw(server=s\
    \ user=s passw=s csv|c help|?h));\nif ($config(help)) {\n    \\_syntax();\n  \
    \  exit 1;\n}\n\nif (! $config) {\n    $config(server) = Win32::NodeName();\n\
    \    $config(user) = \"\";\n    $config(passw) = \"\";\n}\n$config(user) = \"\"\
    \ unless ($config(user));\n$config(passw) = \"\" unless ($config(passw));\nmy\
    \ $locatorObj = Win32::OLE->new(\"WScripting.SWbemLocator\") || die\n    \"\"\
    Error creating locator object: \"Win32::OLE->LastError()\"\" . \"\\n\";\n$locatorObj->(\"\
    Security_ImpersonationLevel\") = 3;\nmy $serverObj = $locatorObj->ConnectServer($config(server),\
    \ 'root\\cimv2', $config(user), $config(passw)) || die\n    \"\"Error connecting\
    \ to $config(server): \"Win32::OLE->LastError()\"\" . \"\\n\";nforeach my $nic\
    \ (in $serverObj->InstancesOf(\"Win32_NetworkAdapterConfiguration\")) {\n    if\
    \ (defined $nic->(\"IPAddress\")) {\n        my $i = $nic->(\"IPAddress\");\n\
    \        my $ip = join(\".\",@\\$i));\n        next if ($ip eq '0.0.0.0');\n \
    \       print \"\"$nic->(\"Description\")\"\" . \"\\n\";\n        print \"\"$ip\"\
    \" . \"\\n\";\n    }\n}\n```"
