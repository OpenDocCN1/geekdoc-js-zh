    \ 2005 (UTC)\nAuditing is enabled.\nThere are 9 audit categories.\n\n| Privilege\
    \ Use | |\n| :--- | :--- |\n| System Events | None |\n| Logon Events | Both |\n\
    | Object Access | Both |\n| Privilege Use | Both |\n| Process Tracking | Both\
    \ |\n| Policy Change | Both |\n| Account Management | Both |\n| Directory Service\
    \ Access | Both |\n| Account Logon Events | None |\n\n# Part II • Perl Scripting\
    \ and Computer Forensic Analysis\n\n# Part II • Perl Scripting and Computer Forensic\
    \ Analysis\n\n# Part II • Perl Scripting and Computer Forensic Analysis\n\n# Part\
    \ II • Perl Scripting and Computer Forensic Analysis\n\n# Part II • Perl Scripting\
    \ and Computer Forensic Analysis\n\n# Part II • Perl Scripting and Computer Forensic\
    \ Analysis\n\n# Recentdocs.pl\n\nAnother important aspect of the Registry can\
    \ be found in the user's profile, specifically in the user's NTUSER.DAT file.\
    \ This file contains a great deal of useful information about the activities performed\
    \ by whoever logged into the system using the user’ credentials (i.e., username\
    \ and password). For example, when the user opens files on the system, not only\
    \ are shortcut files created, but so are entries within the user’s RecentDocs\
    \ Registry key (in NTUSER.DAT). Some of this information is easily searched and\
    \ viewed. ASCII format, but other information is stored in a binary format that\
    \ must be parsed in order to be understandable and therefore usable by the examiner.\
    \ The recentdocs.pl uses the Parse::Win32 module to parse this information for\
    \ easy display and viewing.\n\n```perl\n#! c:\\perl\\bin\\perl.exe\n---------------------------------------\n\
    # recentdocs.pl\n#\n# Parse the contents of the RecentDocs Registry key from a\n\
    # user's NTUSER.DAT\n# file; all information is sent to STDOUT\n#\n# Usage\n#\
    \ C:\\lu_recentdocs.pl <file>\n# or, create a harness file that calls the file\
    \ via a\n# 'require' pragma,\n# and launches getRecentDocs() by passing the filename\
    \ (or\n# use backticks,\n# and capture output to a list)\n#\n# ChangeLog\n# 20070703\
    \ - Created\n#\n# copyright 2007 H. Carvey, keydet89@yahoo.com\n---------------------------------------\n\
    use strict;\nuse Parse::Win32Registry qw(:REG_);\nmy $ntuser = shift || die \"\
    You must enter a filename.\\n\"\ndie \"$ntuser not found.\\n\" unless (-e $ntuser);\n\
