    # In This Toolbox


    Working with enterprise-level Windows applications requires a great deal of analysis
    and constant monitoring. Automating the monitoring portion of this effort can
    save a great deal of time, reduce system downtimes, and improve the reliability
    of your overall application. By utilizing Perl scripts and integrating them with
    the application technology, you can easily build a simple monitoring framework
    that can alert you to current or future application issues.


    In order to build this monitoring framework, you must first separate the individual
    components that make up your application, and determine a monitoring strategy
    for each. This allows you to build specific monitoring processes for each component
    while still providing a comprehensive view of the application as a whole from
    the monitoring perspective.


    In this chapter, the components we will be focusing on are the core application
    processes, the core application dependencies, network connectivity, Web services,
    and log files. We will look at what the purpose of each component is and what
    its role is in the scope of the application as a whole. We will also break down
    each component even further and look at what specific metrics we need to monitor
    or record to ensure that the component is functioning normally. Lastly, we will
    be putting together some scripts that monitor the application and build a complete
    monitoring framework for a sample application.


    # Core Application Processes


    The "core application processes" refers to the basic executable(s) for the application
    you are working with. Each executable takes up a certain amount of system resources
    including processor, memory, input/output (I/O), and so forth. By monitoring the
    state of the core process and its use of system resources, you are able to determine
    how well the process is functioning and detect abnormalities.


    In addition to the resources used by the application itself, we also need to be
    aware of resource use by other applications. Other applications that consume an
    extraordinary amount of system resources could have performance implications on
    the application we are monitoring, so it makes sense to stay aware of what these
    other applications are doing. We do this through monitoring of key performance
    indicators for the system and will be building some scripts for this purpose as
    well.'
  - '[PAGE 152]


    # Monitoring System Key Performance Indicators


    Before we get to writing scripts to monitor our specific core processes, let us
    first take a look at the system as a whole. There are specific key performance
    indicators that can tell you the overall status of your system. Among these are
    processor utilization, memory utilization, and network utilization.


    In this section, we will be creating scripts to watch each of these key performance
    indicators, measure their current status against a threshold, and take action
    when the threshold is exceeded. This will provide us some foundation scripts that
    we can refine to provide information around our core processes.


    # Monitoring System CPU Utilization


    The system central processing unit (CPU) utilization is one of the most important
    metrics to monitor. When a CPU is too busy, it is difficult for applications to
    get enough time slices with the CPU to perform their work. Consequently it is
    important to keep the CPU utilization down to a nominal level. This certainly
    doesn''t mean that the process utilization should be low, however. That would
    mean that you spent too much money on hardware that you do not need. A good balance
    means keeping the system busy, but ensuring there is enough processor capacity
    to handle normal loads and some peaks. We will look at exactly what these numbers
    should be when we look at thresholds.


    First, let''s put together a quick Perl script for getting the system processor
    utilization data. For all of these examples I will be using Microsoft Windows
    2003 Server. I will also be using Perl 5.8.8 in ActivePerl 5.8.8.82. As we go
    through the exercise of creating each of these scripts, a variety of Perl modules
    may be needed. As we get to each module, I will include the module name and a
    note indicating that you will need to install the referenced module.


    In the case of working with system CPU utilization, there is a module available
    for Perl called Win32::PerfMon that allows access to all data available through
    Windows Performance Monitor. This module should work very well for our purposes
    as we will eventually need a lot of data that can be provided through Performance
    Monitor. Unfortunately, at this time the module cannot be easily installed using
    Perl Package Manager (PPM) and does in fact require some additional work to compile,
    install, and configure. The module itself can be downloaded from CPAN at http://search.cpan.org/~glensmall/Win32-PerfMon-0.07/PerfMon.pm
    and is currently at version 0.07.'
