- md: "\n[content]\npurposes the values returned in the script point to a temperature\
    \ conversion Web service hosted by soaplite.com.\n\nWe then create a $result variable\
    \ to hold the result of the Web service call and through the act of assigning\
    \ this variable, we contact the Web service and call \"F2c\" conversion function\
    \ passing a value of 61. While this should return a specific value for the conversion,\
    \ we're not concerned at this point with what that value is. Rather, we just need\
    \ to confirm that a value is returned.\n\nHandling the returned result provides\
    \ the logic behind our monitoring. If the result is not a fault, we pass the value\
    \ of 100 to the \"threshold_check\" function indicating that the Web service is\
    \ responding. If a fault is encountered, however, we send a value of 1 and the\
    \ \"threshold_check\" function takes the actions specified in our \"WS_avail\"\
    \ XML.\n\n## Monitoring Web Service Functionality\n\nMore complex Web services\
    \ may rely on a host of additional dependencies in order to return an expected\
    \ result. For example, you may be connecting to an Oracle Web Service Manager\
    \ Gateway, for have your request forwarded to a Business Process Execution language\
    \ server, and then to a Web service, pulls data from a remote database. This complex\
    \ chain of transactions will eventually return a result to you, but it may not\
    \ necessarily be what you expected.\n\nSince any step in this could potentially\
    \ generate an error, fully testing Web service functionality involves sending\
    \ a request that goes through each step then returns a result that should be consistent\
    \ for validation. If an error is encountered, it may be presented as a Web SOAP\
    \ message but contain an error message rather than the result that you are looking\
    \ for.\n\nWe'll make the assumption for testing purposes the \"f2c\" conversion\
    \ function that we used in the last test is actually a complex function that has\
    \ to go through several steps in order to succeed. For example, this completely\
    \ fictional, let's assume that it takes the value that we need, connects to a\
    \ BPEL process to convert the number to a string, connects to a remote database\
    \ to do a string match in order to find the corresponding Celsius value, runs\
    \ returns our result. Any failure in this chain of transactions could cause a\
    \ failure, but would not necessarily generate a fault to SOAP::Lite.\n\n## Master\
    \ Craftsman\n\n## End-to-end Web Service Testing\n\nWhile the script shown here\
    \ does a good job at determining whether or not a Web service and all its components\
    \ are functioning, it does not provide a great deal of troubleshooting information.\
    \ As we monitor multiple layers of our applications (system, network, database,\
    \ and so forth), you should consider monitoring multiple layers of the Web service\
    \ to speed up troubleshooting when something goes wrong.\n\nA good way to do this\
    \ without increasing the load on the system is to perform the validation test\
    \ first. If, after running the validation test, the test fails, you can then run\
    \ individual scripts that test each portion of the Web service (i.e., test the\
    \ BPEL process manager, the Web service gateway, and the back data store). This\
    \ will identify where in the stack the problem lies and allow you to get everything\
    \ fixed quickly.\n\nWith that in mind, the next scripts perform a similar transaction,\
    \ and provides a guaranteed value as a result. This result is validated and if\
    \ the validation fails, we generate an alert. This script can be seen in Figure\
    \ III.31 with the corresponding XML for the \"thresh.xml\" file in Figure III.32.\n\
    \n### Figure III.31 get_ws_status.pl\n\n```perl\n@get_ws_status.pl\nuse SOAP::Lite;\n\
    use struct;\nrequire 'thresh.pl';\n\nmy $soap = SOAP::Lite(\n    -> uri('http://www.soaplite.com/Temperatures')\n\
    \    -> proxy('http://services.soaplite.com/temper.cgi');\nmy $result = $soap->f2c(32);\n\
    unless ($result->fail) {\n    if ($result->result() == 0) {\n        &threshold_check\
    \ (\"WS_status\", 1);\n    } else {\n        &threshold_check (\"WS_status\",\
    \ 100);\n    }\n}\nelse {\n    &threshold_check (\"WS_status\", 1);\n}\n```\n\n\
    **Figure III.32** WS_status Monitor XML\n\n```xml\n<monitor name=\"WS_status\"\
    >\n  <status name=\"red\" value=\"1\" operator=\"equal\">\n    <action>email</action>\n\
    \    <action>page</action>\n  </status>\n  <status name=\"green\" value=\"100\"\
    \ operator=\"equal\">\n    <action>none</action>\n  </status>\n</monitor>\n```\n\
    \n## Building a Monitoring System\n\nThroughout this chapter we have put together\
    \ a variety of scripts that can be used to monitor applications. In order to consider\
    \ this full monitoring package, however, we need to tie all the scripts together.\
    \ To do this, we'll take the final versions of a number of scripts, call them\
    \ with the appropriate parameters, and use the appropriate dependency scripts\
    \ for handling thresholds and alerting.\n\nThe scripts we'll be putting together\
    \ for this are the following:\n\n- get_system_stats.pl shown in Figure III.19\n\
    - get_process_stats.pl using a modified version shown in Figure III.33\n- get_port_status.pl\
    \ shown in Figure III.22\n- get_disk_info.pl shown in Figure III.26\n- get_db_avail.pl\
    \ shown in Figure III.27\n- get_ws_status.pl shown in Figure III.31\n\nWe'll also\
    \ be using the dependency scripts \"actions.pl,\" and the file \"thresh.xml\"\
    \ as shown in Figure III.17, Figure III.18, and Figure III.34, respectively. First,\
    \ please take a look at the modified \"get_process_stats.pl\" shown in Figure\
    \ III.33 and the final \"thresh.xml\" shown in Figure III.34.\n\n### Figure III.33\
    \ get_process_stats.pl\n\n```perl\n#get_process_stats.pl\nuse Win32::PerfMon;\n\
    use strict;\nuse Win32::Process::Info;\nrequire 'thresh.pl';\n\nmy $sp1 = Win32::Process::Info->new();\n\
    my $procinfo = $sp1->GetInfo();\nmy $procname = $sp1;\nmy $prostatus = 0;\nmy\
    \ $ret = undef;\nmy $err = undef;\nmy $Object = undef;\nmy $Counter = undef;\n\
    my $counterdata = undef;\n#connect to localhost for data\nmy $perfmon = Win32::PerfMon->new(\"\
    localhost\");\n\nmy $result = open($counterdata, \"pid\");\nif ($result) {\n \
