  md: "Now we need to make a small alteration to the HTML, and add each of the new\
    \ class names `topLeftShadow`, `bottomLeftShadow` and so on one to each **div**\
    \ in the HTML in Code Listing 62a, as follows:\n\n```\n<div class=\"niceDiv topLeftShadow\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\
    \ bottomLeftShadow\">\n    <p>This is a nice div with drop shadows</p>\n</div>\n\
    <div class=\"niceDiv bottom versatility amazing versality\">\n    <p>This is a\
    \ nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv topRightShadow\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n```\n\nCode Listing\
    \ 62c: Adding the four drop-shadow classes to our divs\n\nJust in case you're\
    \ wondering what's going on here, we're using the cascading nature of CSS to our\
    \ advantage so that we don't have to type out the basic beige **div** style four\
    \ times in each of the four rules; doing things this way means less typing and\
    \ better re-use.\n\nIf we re-render that, you should now see that we have four\
    \ default, blocky drop shadows for each of the directions on each of our **div**\
    \ elements.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_82_0.png)\n\nFigure 64:\
    \ Our div elements with default drop shadows\n\nThe default settings for drop\
    \ shadows, however, are very bold and solid; changing this is where the remaining\
    \ two optional measurements come into the equation.\n\nThe first value is the\
    \ blur radius; you can't use negative values on this, but any positive values\
    \ you supply blur the shadow out further and further, giving a much softer appearance\
    \ with each increasing value.\n\nChange the rules in Code Listing 62b as follows:"
