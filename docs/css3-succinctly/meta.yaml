    \n如果你是这一行的新手，那么随便找一个 Web 开发行业的老兵，我敢肯定他们会给你讲不少恐怖故事。\n\nCSS3 通过增加定义规则的能力来解决所有这些问题，这些规则现在可以指定圆角的弧度，并允许你描述阴影的外观。然后，CSS3\
    \ 引擎会根据你提供的选择器规则，自动将这些指令应用到你的 HTML 标记上，并计算出所有内容需要放置的位置。\n\n## 圆角\n\n网页是方的——至少在不久之前是这样。\n\
    \n在 CSS3 出现之前，我们只有带尖角的盒子。div 元素总是方方正正、平行排列的，表格也是如此，我们无法让事物看起来更柔和、更友好（嗯，至少不用大量图像技巧的话不行）。\n\
    \n为了改变这一点，CSS3 在所有可以使用边框的块级元素上引入了 **border-radius** 属性。\n\n使用它很简单。\n\n给定以下 HTML\
    \ 标记：\n\n```\n<div class=\"niceDiv\">\n    <p>This is a nice div with no sharp\
    \ corners</p>\n</div>\n```\n\n*代码清单 61a：用于演示边框半径的 HTML 标记*\n\n以及这个 CSS 规则：\n\n\
    ```\n.niceDiv\n{\n  width: 100px;\n  height: 100px;\n  background-color: beige;\n\
    \  padding: 4px;\n  border: 1px solid black;\n  border-radius: 5px;\n}\n```\n\n\
    *代码清单 61b：为 61a 中的 HTML 添加圆角的 CSS 规则*\n\n我们将在浏览器中看到一个非常漂亮的 `div` 元素：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_76_0.png)\n\
    \n*图 58：带圆角的 div*\n\n在代码清单 61b 的规则中，我们使用了边框半径的通用默认设置，只指定了一个值。当你这样定义规则时，相同的值将用于所有四个角，因此如你所见，图\
    \ 58 中的每个角看起来都一样。\n\n指定的值决定了曲线的角度有多陡峭；在我们的例子中，我们使用了 5 像素。如果将其更改为 25 像素，你应该会得到类似图\
