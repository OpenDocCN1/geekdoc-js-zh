  md: '# # About the Author


    As an early adopter of IT back in the late 1970s to early 1980s, I started out
    with a humble little 1k Sinclair ZX81 home computer.


    Within a very short space of time this small 1k machine became a 16k Tandy TRS-80,
    followed by an Acorn Electron, and eventually, after going through many other
    machines, a 4mb arm powered Acorn A5000.


    Eventually, after leaving school and getting involved with DOS-based PCs, I went
    on to train in many different disciplines in the computer networking and communications
    industries.


    After returning to university in the mid-1990s and gaining a BSc in Computing
    for Industry, I started my own consulting business in the northeast of England
    called Digital Solutions Computer Software Ltd. I advise clients at both hardware
    and software levels in many different IT disciplines, covering a wide range of
    domain-specific knowledge from mobile communications and networks right through
    to geographic information systems, banking and finance, and web design.


    With over 30 years of experience in the IT industry within many differing and
    varied platforms and operating systems, I have a lot of knowledge to share.


    You can often find me hanging around in the LIDNUG .NET users group on LinkedIn
    that I help run, and you can easily find me in places such as Stack Overflow and
    Code Project, or on Twitter as @shawty_ds. I''m also a Pluralsight author and
    produce various videos that are viewable online.


    I hope you enjoy the book, and learn something new from it. In today''s fast-moving
    world of IT, we already have little time to spare trying to find the information
    we need—these books hopefully help reduce that burden on time.


    Please remember to thank Syncfusion (@Syncfusion on Twitter) for making this book
    (and others in the range) possible, allowing people like me to share our knowledge
    with the .NET community at large. If you have ideas for a book, please reach out
    to Syncfusion and let them know what you''d like to see. The *Succinctly* series
    is a brilliant idea for busy programmers.'
