- md: "In Code Listing 6a, I define a standard HTML paragraph tag. It has no associated\
    \ style information or class selectors applied to it; all it has is a simple **id**\
    \ attribute, which essentially allows us to give the element a name.\n\nIf you\
    \ look at the CSS rule defined in Code Listing 6b, however, you'll see that instead\
    \ of a period [.] being placed in front of the rule name, we now have a number\
    \ sign [#] in front of it.\n\nCSS can use a number of different symbols when defining\
    \ rules. These symbols are known as CSS selectors, and how you define a selector\
    \ dictates how you intend the rule to be used.\n\nIn the case of Code Listing\
    \ 6, we've used the ID selector. The purpose of the ID selector is to target one\
    \ specific, named element in a document.\n\nIn Code Listings 4 and 5, the class\
    \ selector was intended to be used on many different elements, simply by adding\
    \ a **class** attribute. Because a given ID can only be applied to one element\
    \ at a time, when we specify a CSS rule that targets an ID, we are for all purposes\
    \ saying that this rule applies to that element and ONLY that element—never any\
    \ other.\n\nHowever (as you'll see in just a moment), ID selectors are often used\
    \ deliberately to control hierarchy in a CSS document, and make full use of the\
    \ cascading nature of the technology.\n\nCascading can be used to great effect\
    \ when we chain selectors together, because it allows us to drill down deep into\
    \ the HTML markup, without ever having to make sure that we dictate what the markup\
    \ should look like.\n\nLet's imagine for a moment that we're creating an HTML\
    \ document containing news posts.\n\nEvery news post in the document has to obey\
    \ the same set of style rules, and as such, takes on the same look and feel for\
    \ every post.\n\nEach post should be shown on a different color background to\
    \ the rest of the page, and should always have blue, bold headers with smaller,\
    \ red paragraph text.\n\nBased on what we've seen so far, we might be tempted\
    \ to write the following code.\n\n```\n<div id=\"newspost\">\n    <h1 class=\"\
    newsheader\">News article 1</h1>\n    <p class=\"newstext\">The article text for\
    \ news article one, this should be standard paragraph text</p>\n    <h1 class=\"\
    newsheader\">News article 2</h1>\n    <p class=\"newstext\">The article text for\
    \ news article 2 goes right here, and looks the same as article one</p>\n</div>\n\
    ```\n\n*Code Listing 7a: Possible news article HTML code*\n\n```\n#newspost\n\
    {\n    background-color: silver;\n}\n\n.newsheader\n{\n  color: blue;\n  font-size:\
    \ 15pt;\n}\n\n.newstext\n{\n  color: red;\n  font-size: 10pt;\n}\n```\n\n*Code\
    \ Listing 7b: Possible news article CSS code*\n\nWhile this will work very well\
    \ and produce the desired output, we can actually take advantage of CSS's cascading\
    \ nature here, and actually make things a little more obvious—even to the point\
    \ where our HTML and CSS are almost describing their own intent.\n\nIf we change\
    \ the HTML in Code Listing 7a so that we remove all the class tags from each of\
    \ the **h1** and **p** elements, we should end up with the following code:\n\n\
    ```\n<div id=\"newspost\">\n    <h1>News article 1</h1>\n    <p>The article text\
    \ for news article one, this should be standard paragraph text</p>\n    <h1>News\
    \ article 2</h1>\n    <p>The article text for news article 2 goes right here,\
    \ and looks the same as article one</p>\n</div>\n```\n\n*Code Listing 8: The code\
    \ from Listing 7a with the class attributes removed*\n\nAs you can see, all we\
    \ have left now is the ID defining the name of **newspost** for the **div** element\
    \ that wraps all of our articles.\n\nNow change the CSS code as follows:\n\n```\n\
    #newspost\n{\n  background-color: silver;\n}\n\n#newspost h1\n{\n  color: blue;\n\
    \  font-size: 15pt;\n}\n\n#newspost p\n{\n  color: red;\n  font-size: 10pt;\n\
    }\n```\n\n*Code Listing 9: The CSS code from Listing 7b with changed selectors*\n\
    \nYou should find that when you render it in your browser, you still get the following\
    \ output:\n\n![Output produced by Code Listings 8 and 9](img/d6b4d2d62fbe04b9c83d677f3498c239_18_0.png)\n\
    \n*Figure 3: Output produced by Code Listings 8 and 9*\n\nOne of the really great\
    \ things about letting the cascading nature take care of things like this, is\
    \ that you could easily add another article to your `newspost div` just by inserting\
    \ the `h1` and `p` elements as appropriate. You don't in any way need to worry\
    \ about assigning the correct class name to each `h1` and `p` element as you add\
    \ it, nor do you have to keep checking that both elements are using the correct\
    \ styles.\n\nAs long as the elements are within a section that has the named ID,\
    \ they will be colored accordingly. Note also that the cascading behavior we've\
    \ just seen doesn't apply only to ID-based selectors; you can, for example, have\
    \ a class-based selector for the `newspost div`, that you might intend to reuse,\
    \ and you can still cascade the styles for the other elements off of that, as\
    \ the following code shows:\n\n```\n.newspost\n{\n  background-color: silver;\n\
    }\n\n.newspost h1\n{\n  color: blue;\n  font-size: 15pt;\n}\n\n.newspost p\n{\n\
    \  color: red;\n  font-size: 10pt;\n}\n```\n\n*Code Listing 10: The CSS code from\
    \ Listing 9 using class selectors*\n\nUsing a cascaded, class-based selector like\
    \ this allows you to reuse your **newspost** class in many different places in\
    \ your HTML, and any **h1** or **p** elements placed inside of said element will\
    \ automatically take on the look and feel of the blue headers with red text.\n\
    \n## Pseudo Selectors\n\nThe next type of basic selector we have to consider when\
    \ doing a basic refresher is the humble pseudo selector. Just like \"pseudo code,\"\
    \ the pseudo selector is not a full selector in its own right, but an extension\
    \ to an existing selector.\n\nThe most well-known example of this is the hover\
    \ selector used on HTML anchor tags.\n\nA pseudo selector works by modifying an\
    \ existing rule to only be active given a specific scenario, which in the case\
    \ of hover, is when the user's mouse hovers over the element in question, as Code\
    \ Listing 11a shows:\n\n```\n<a href=\"#\" class=\"hoverClass\">Hover over me\
    \ I'll change color</a>\n```\n\n*Code Listing 11a: HTML to demonstrate the pseudo\
    \ hover selector*\n\n```\n.hoverClass\n{\n    font-size: 20pt;\n    color: red;\n\
    }\n\n.hoverClass:hover\n{\n    color: blue;\n}\n```\n\n*Code Listing 11b: CSS\
    \ code to demonstrate the pseudo hover selector*\n\nIf you render a page containing\
    \ this code in your browser, you should see something like the following:\n\n\
    ![Pseudo hover selector in its default state](img/d6b4d2d62fbe04b9c83d677f3498c239_19_0.png)\n\
    \n*Figure 4: Pseudo hover selector in its default state*\n\n![Pseudo hover selector\
    \ in its hovered state](img/d6b4d2d62fbe04b9c83d677f3498c239_20_0.png)\n\n*Figure\
    \ 5: Pseudo hover selector in its hovered state*\n\nPrior to CSS3, there were\
    \ only a few pseudo selectors that could be relied on to work across all browsers;\
    \ typically these applied only to HTML anchor tags, and were hover (as you've\
    \ just seen), visited, active, and link, which were used to style anchor tags\
    \ for visual feedback, depending on whether or not a user had previously visited\
    \ the link in question. Unfortunately, from CSS3 onwards, even though these styles\
    \ still exist and work as anticipated, the number of options that can be changed\
    \ by them has been severely limited. This was in response to a privacy hack that\
    \ was found in the wild, where unscrupulous website owners were using them to\
    \ track if users had visited a given site or not.\n\n## Direct Selectors\n\nThe\
    \ last selector on the refreshers list is the direct selector. This is the most\
    \ simple of all the selectors available, and as its name implies, it's used to\
    \ directly select a known element name. You may also come across the terms type\
    \ selectors, element selectors, and tag selectors; there is no agreed terminology\
    \ for this type of selector, and which one is used depends heavily on the browser\
    \ manufacturer. For our purposes, we use direct selector simply because we are\
    \ directly targeting a named entity.\n\nFor example, if you wanted to target all\
    \ **p** elements in a given document, you would simply do the following:\n\n```\n\
    p\n{\n    color: green;\n}\n```\n\n*Code Listing 12: Using a direct selector*\n\
    \nOnce this is added to a style sheet, anything in the HTML markup of the document\
    \ that consists of a `<p></p>` tag would appear in green, regardless of its class,\
    \ ID, or anything else.\n\nDon't forget, you can easily combine basic selectors,\
    \ so you could easily select only **h1** elements that are descendants of **divs**;\
    \ for example, **h1** type elements have the **boxout** class applied to them\
    \ and are nested inside a **div** element. This can be achieved using a selector\
    \ such as **div .boxout h1**."
  mdcn: "\n在代码清单6a中，我定义了一个标准的HTML段落标签。它没有应用任何关联的样式信息或类选择器；它所拥有的只是一个简单的**id**属性，这本质上允许我们为该元素命名。\n\
    \n然而，如果你查看代码清单6b中定义的CSS规则，你会看到，规则名称前面现在使用的是井号[#]，而不是之前的句点[.]。\n\nCSS在定义规则时可以使用多种不同的符号。这些符号被称为CSS选择器，你定义选择器的方式决定了你打算如何使用该规则。\n\
    \n就代码清单6而言，我们使用的是ID选择器。ID选择器的目的是定位文档中一个特定的、已命名的元素。\n\n在代码清单4和5中，类选择器旨在通过添加一个**class**属性用于许多不同的元素。因为一个给定的ID一次只能应用于一个元素，所以当我们指定一个针对ID的CSS规则时，我们实际上是在说该规则适用于那个元素，并且仅适用于那个元素——绝不是任何其他元素。\n\
    \n然而（你稍后就会看到），ID选择器经常被刻意用来控制CSS文档中的层级结构，并充分利用该技术的层叠特性。\n\n当我们把选择器链接在一起时，层叠可以发挥巨大的作用，因为它允许我们深入到HTML标记中，而无需确保我们指定了标记应该是什么样子。\n\
    \n让我们想象一下，我们正在创建一个包含新闻帖子的HTML文档。\n\n文档中的每一篇新闻帖子都必须遵守同一套样式规则，因此，每篇帖子都呈现出相同的外观和感觉。\n\
    \n每篇帖子都应显示在与页面其余部分不同颜色的背景上，并且应始终有蓝色、加粗的标题和较小的、红色的段落文本。\n\n基于我们目前所看到的，我们可能会倾向于编写以下代码。\n\
    \n```\n<div id=\"newspost\">\n    <h1 class=\"newsheader\">News article 1</h1>\n\
    \    <p class=\"newstext\">The article text for news article one, this should\
    \ be standard paragraph text</p>\n    <h1 class=\"newsheader\">News article 2</h1>\n\
    \    <p class=\"newstext\">The article text for news article 2 goes right here,\
    \ and looks the same as article one</p>\n</div>\n```\n\n*代码清单7a：可能的新闻文章HTML代码*\n\
    \n```\n#newspost\n{\n    background-color: silver;\n}\n\n.newsheader\n{\n  color:\
    \ blue;\n  font-size: 15pt;\n}\n\n.newstext\n{\n  color: red;\n  font-size: 10pt;\n\
    }\n```\n\n*代码清单7b：可能的新闻文章CSS代码*\n\n虽然这效果很好并能产生所需的输出，但我们实际上可以利用CSS的层叠特性，让事情变得更清晰一些——甚至达到我们的HTML和CSS几乎在描述其自身意图的程度。\n\
    \n如果我们修改代码清单7a中的HTML，从每个**h1**和**p**元素中移除所有的class标签，我们应该会得到以下代码：\n\n```\n<div\
    \ id=\"newspost\">\n    <h1>News article 1</h1>\n    <p>The article text for news\
    \ article one, this should be standard paragraph text</p>\n    <h1>News article\
    \ 2</h1>\n    <p>The article text for news article 2 goes right here, and looks\
    \ the same as article one</p>\n</div>\n```\n\n*代码清单8：移除了class属性的清单7a代码*\n\n如你所见，我们现在只剩下为包装所有文章的**div**元素定义名称**newspost**的ID。\n\
    \n现在，按如下方式更改CSS代码：\n\n```\n#newspost\n{\n  background-color: silver;\n}\n\n#newspost\
    \ h1\n{\n  color: blue;\n  font-size: 15pt;\n}\n\n#newspost p\n{\n  color: red;\n\
    \  font-size: 10pt;\n}\n```\n\n*代码清单9：更改了选择器的清单7b CSS代码*\n\n你应该发现，当你在浏览器中渲染它时，你仍然会得到以下输出：\n\
    \n![代码清单8和9产生的输出](img/d6b4d2d62fbe04b9c83d677f3498c239_18_0.png)\n\n*图3：代码清单8和9产生的输出*\n\
    \n让层叠特性处理这类事情的一个真正妙处在于，你可以轻松地通过插入适当的`h1`和`p`元素，向你的`newspost div`中添加另一篇文章。你完全不需要担心在添加每个`h1`和`p`元素时为其分配正确的类名，也不必不断检查两个元素是否都使用了正确的样式。\n\
    \n只要元素位于一个具有命名ID的部分内，它们就会相应地着色。还要注意，我们刚刚看到的层叠行为不仅仅适用于基于ID的选择器；例如，你可以为`newspost\
    \ div`使用一个基于类的选择器，你可能打算重用它，你仍然可以将其他元素的样式层叠于其上，如以下代码所示：\n\n```\n.newspost\n{\n\
    \  background-color: silver;\n}\n\n.newspost h1\n{\n  color: blue;\n  font-size:\
    \ 15pt;\n}\n\n.newspost p\n{\n  color: red;\n  font-size: 10pt;\n}\n```\n\n*代码清单10：使用类选择器的清单9\
    \ CSS代码*\n\n使用这样一个层叠的、基于类的选择器，允许你在HTML的许多不同地方重用你的**newspost**类，并且放置在所述元素内的任何**h1**或**p**元素将自动呈现蓝色标题和红色文本的外观。\n\
    \n## 伪选择器\n\n在进行基础复习时，我们需要考虑的下一类基本选择器是伪选择器。就像“伪代码”一样，伪选择器本身不是一个完整的选择器，而是对现有选择器的扩展。\n\
    \n其中最著名的例子是用于HTML锚标签的悬停选择器。\n\n伪选择器的工作原理是修改现有规则，使其仅在特定场景下激活，就悬停而言，就是当用户的鼠标悬停在相关元素上时，如代码清单11a所示：\n\
    \n```\n<a href=\"#\" class=\"hoverClass\">Hover over me I'll change color</a>\n\
    ```\n\n*代码清单11a：演示伪悬停选择器的HTML*\n\n```\n.hoverClass\n{\n    font-size: 20pt;\n\
    \    color: red;\n}\n\n.hoverClass:hover\n{\n    color: blue;\n}\n```\n\n*代码清单11b：演示伪悬停选择器的CSS代码*\n\
    \n如果你在浏览器中渲染包含此代码的页面，你应该会看到类似以下的内容：\n\n![伪悬停选择器的默认状态](img/d6b4d2d62fbe04b9c83d677f3498c239_19_0.png)\n\
    \n*图4：伪悬停选择器的默认状态*\n\n![伪悬停选择器的悬停状态](img/d6b4d2d62fbe04b9c83d677f3498c239_20_0.png)\n\
    \n*图5：伪悬停选择器的悬停状态*\n\n在CSS3之前，只有少数几个伪选择器可以可靠地在所有浏览器中工作；通常这些仅适用于HTML锚标签，它们是悬停（你刚刚看到的）、已访问、活动和链接，用于根据用户是否曾经访问过相关链接来为锚标签设置样式以提供视觉反馈。不幸的是，从CSS3开始，尽管这些样式仍然存在并按预期工作，但它们可以改变的选项数量受到了严重限制。这是对野外发现的一种隐私漏洞的回应，一些不良网站所有者利用这些选项来跟踪用户是否访问过给定的站点。\n\
    \n## 直接选择器\n\n复习清单上的最后一个选择器是直接选择器。这是所有可用选择器中最简单的，顾名思义，它用于直接选择已知的元素名称。你可能还会遇到类型选择器、元素选择器和标签选择器等术语；对于这种选择器类型没有统一的术语，使用哪个术语在很大程度上取决于浏览器制造商。就我们的目的而言，我们使用直接选择器，仅仅是因为我们直接定位一个命名的实体。\n\
    \n例如，如果你想定位给定文档中的所有**p**元素，你只需执行以下操作：\n\n```\np\n{\n    color: green;\n}\n```\n\
    \n*代码清单12：使用直接选择器*\n\n一旦将其添加到样式表中，文档HTML标记中由`<p></p>`标签组成的任何内容都将显示为绿色，无论其类、ID或其他任何属性如何。\n\
    \n别忘了，你可以轻松组合基本选择器，因此你可以只选择**div**的后代中的**h1**元素；例如，**h1**类型元素应用了**boxout**类，并且嵌套在**div**元素内。这可以使用像**div\
    \ .boxout h1**这样的选择器来实现。\n"
