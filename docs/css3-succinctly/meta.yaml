- img_proc: true
  md: "```\n<li><a href=\"#\">Link 1</a></li>\n<li><a>Link 2</a></li>\n<li><a>Link\
    \ 3</a></li>\n<li><a href=\"#\">Link 4</a></li>\n<li><a href=\"#\">Link 5</a></li>\n\
    </ul>\n```\n\n# Code Listing 28: HTML markup modified from Code Listing 26\n\n\
    By default, most browsers won't make a link clickable that has no **href** attribute,\
    \ and for the default styling at least, they won't be styled using the usual blue\
    \ underlining.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_0.png)\n\n# Figure\
    \ 16: Output from Code Listing 28 with no styling.\n\nHowever, in many cases (especially\
    \ if you're using a larger framework), you might find that anchor tags in general\
    \ have been given a uniform style to maintain a consistent look and feel.\n\n\
    For example:\n\n```\na\n{\n  text-decoration: none;\n  color: green;\n}\n```\n\
    \n# Code Listing 29: Possible rule to give a uniform look and feel to an anchor\n\
    \nThis code might be used to apply that uniform style, and would make our list\
    \ look as follows:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_1.png)\n\n#\
    \ Figure 17: Code Listing 28 with a uniform style applied to the anchor element"
  merge: -1
