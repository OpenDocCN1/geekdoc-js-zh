  - "[PAGE 16]\n\nIn Code Listing 6a, I define a standard HTML paragraph tag. It has\
    \ no associated style information or class selectors applied to it; all it has\
    \ is a simple **id** attribute, which essentially allows us to give the element\
    \ a name.\n\nIf you look at the CSS rule defined in Code Listing 6b, however,\
    \ you'll see that instead of a period [.] being placed in front of the rule name,\
    \ we now have a number sign [#] in front of it.\n\nCSS can use a number of different\
    \ symbols when defining rules. These symbols are known as CSS selectors, and how\
    \ you define a selector dictates how you intend the rule to be used.\n\nIn the\
    \ case of Code Listing 6, we've used the ID selector. The purpose of the ID selector\
    \ is to target one specific, named element in a document.\n\nIn Code Listings\
    \ 4 and 5, the class selector was intended to be used on many different elements,\
    \ simply by adding a **class** attribute. Because a given ID can only be applied\
    \ to one element at a time, when we specify a CSS rule that targets an ID, we\
    \ are for all purposes saying that this rule applies to that element and ONLY\
    \ that element—never any other.\n\nHowever (as you'll see in just a moment), ID\
    \ selectors are often used deliberately to control hierarchy in a CSS document,\
    \ and make full use of the cascading nature of the technology.\n\nCascading can\
    \ be used to great effect when we chain selectors together, because it allows\
    \ us to drill down deep into the HTML markup, without ever having to make sure\
    \ that we dictate what the markup should look like.\n\nLet's imagine for a moment\
    \ that we're creating an HTML document containing news posts.\n\nEvery news post\
    \ in the document has to obey the same set of style rules, and as such, takes\
    \ on the same look and feel for every post.\n\nEach post should be shown on a\
    \ different color background to the rest of the page, and should always have blue,\
    \ bold headers with smaller, red paragraph text.\n\nBased on what we've seen so\
    \ far, we might be tempted to write the following code.\n\n```\n<div id=\"newspost\"\
    >\n    <h1 class=\"newsheader\">News article 1</h1>\n    <p class=\"newstext\"\
    >The article text for news article one, this should be standard paragraph text<p>\n\
