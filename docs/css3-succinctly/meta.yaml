    \ to test them with:\n\n```\n<h1 class=\"ambleBold\">I'm the header in Amble Bold</h1>\n\
    <p class=\"nobileRegular\">\n    I'm some general purpose paragraph text that's\
    \ rendered using the 'Nobile Regular'\n    web font. As you can see I'm nothing\
    \ special but for comparison...\n</p>\n<p>I'm some regular paragraph text using\
    \ the default font</p>\n```\n\n*Code Listing 68a: HTML markup to demo the usage\
