  md: '> Note: Depending how far back you need to support, you might still need to
    use vendor prefixes. I''ve noted that the vendor-prefixed versions use different
    syntax to specify the gradients. What I haven''t yet mentioned, however, are how
    the rotations are calculated. Standard syntax sees 0 degrees at the middle bottom
    of the target element, with positive increments from 0 to 360 degrees traveling
    clockwise. You can see this in the 30 degree rotation in the previous example
    as the red starts from the lower-left corner. In the browser-prefixed versions,
    two different schemes were used—the standard as it is now, and one where 0 degrees
    was middle right with positive rotations going counterclockwise from 0 to 360.


    Linear gradients can also contain more than two colors; in fact, they can contain
    as many colors as you want. Remember those rainbow-colored backgrounds folks used
    to be so passionate about? Try the following extended CSS rule.


    ```

    background-image: linear-gradient(red, orange, yellow, green, blue, indigo, violet);

    ```


    Code Listing 64d: CSS rule with distinct rainbow


    Rendering that in your browser might just hurt your eyes!


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_92_0.png)


    Figure 75: Our div now looks like a rainbow


    You''ll notice that the color spread is still evenly distributed across the height
    of the element. We can change that easily using color stops.


    If you''ve ever used an image editor like Photoshop or Gimp, then you''ll most
    likely know what color stops are. They are set values that tell the graphics engine
    to change color at a given point in the scale.


    To demonstrate what I mean, change your extension rule so it reads as follows:'
