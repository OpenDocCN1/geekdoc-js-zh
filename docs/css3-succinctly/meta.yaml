    \ can combine it with that makes it so special.\n\nYou can combine values in the\
    \ **calc** function with percentage-based values: em’s, px’s, pt’s, and any other\
    \ type of value or measurement that CSS understands, and this opens up some amazing\
    \ possibilities.\n\nConsider the following HTML markup:\n\n```\n<div class=\"\
    header\">\n    <h1>This is the main Header</h1>\n</div>\n<p>This is some dummy\
    \ body text</p>\n```\n\nCode Listing 70a: *HTML markup to demonstrate the calc\
    \ function*\n\nIt’s not uncommon to see this type of pattern in most HTML documents,\
    \ and generally you would mark up the header class so that the header has a fixed\
    \ size that covers the intended document minimum width using a percentage value,\
    \ maybe 75 percent.\n\n```\nbody\n{\n    background-color: aliceblue;\n    font-family:\
    \ sans-serif;\n}\n\n.header\n{\n    width: 75%;\n    height: 60px;\n    background-color:\
    \ steelblue;\n    border: 1px solid black;\n    color: white;\n}\n```\n\nCode\
    \ Listing 70b: *Basic body and header rules*\n\nThe basic rules in Code Listing\
