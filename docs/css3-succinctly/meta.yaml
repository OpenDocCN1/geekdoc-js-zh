- img_proc: true
  md: 'For the common percentage values, you''ll often use the following values:


    +   - 0.00 = 0%

    - 0.25 = 25%

    - 0.50 = 50%

    - 0.75 = 75%

    - 1.00 = 100%


    When you double the numbers up this way, it suddenly becomes easy to correlate
    percentage values to the 0-to-1 scale used.


    There''s one more way of specifying colors we need to cover, and this will make
    more sense to those of you who have been trained in correct color theory as a
    professional graphic artist or designer. This is the `hsl` and `hsla` way.


    Used in exactly the same way as an `rgb` color value, the `hsl` method gives different
    meaning to the first three values.


    Rather mixing levels of Red, Green, and Blue, they instead specify Hue, Saturation,
    and Lightness.


    I''m not going to go into the full theory of color here, but the Hue value represents
    how far along the color chart you are,_escape30; with 0 degrees being red and
    360 degrees being magenta/red; as you go around the 360 degree color wheel from
    0 to 360, you get a different root color value.


    The Saturation is how strong that selected color value is from 0 percent (very
    weak) to 100 percent (very strong), and the Lightness value is 0 percent (very
    dark/usually black) to 100% (very light or bright).


    Everything is explained in detail on the [W3C color module page](https://www.w3.org/TR/css3-color/).
    You''ll find a very handy chart on this site that shows the various HSL color
    combinations and more information on how to specify them.


    In the case of the `hsla` value, the Alpha component is specified in exactly the
    same way as it is for an `rgb` color.


    # ## Summary


    In this fairly short chapter we looked at how colors are defined in CSS3. I''ve
    deliberately not created any code listings, as there''s plenty of opportunity
    to go back to previous samples and replace the values in the `color`, `background-color`,
    and `gradient` rules if you want to experiment.


    We''ve looked at how CSS3 has made it easier to specify colors in your style rules
    and introduced a few internet resources that will make remembering and specifying
    them even more useful.


    In the next chapter, we''re going to dive into using the new font functionality
    that''s now available for CSS3-based pages.'
  merge: -1
