- img_proc: true
  md: "# Chapter 8  Generated Content and Calculations\n\nYou've already seen some\
    \ of what generated content can do in the form of the :before and :after pseudo\
    \ selectors; the generated content module, however, can do a bit more than that\
    \ with just a few simple CSS rules.\n\nYou can, for instance, read the value of\
    \ an attribute from a parent element and then use that in a rule further down\
    \ the chain.\n\nYou can also initialize and use counters, allowing you to use\
    \ auto-generated sequential numbers for everything from list numbering to element\
    \ indexing.\n\nFinally, with the calculation module you can actually have your\
    \ CSS rules perform basic math and workout exact screen sizes, border widths,\
    \ and all sorts of other useful measurements—all without ever thinking about JavaScript.\n\
    \n# Counters\n\nCounters are controlled by normal CSS rules, and while they are\
    \ very simplistic in nature, they have quite a few uses.\n\nA counter is initialized\
    \ using the `counter-reset` CSS rule, and it’s incremented using the `counter-increment`\
    \ rule.\n\nYou get the value of the counter by using the `counter()` function.\n\
    \nLet’s imagine you have the following HTML markup (if you’ve read the rest of\
    \ the book so far, you’ll recognize this from Code Listing 58).\n\n```\n<dl>\n\
    \    <dt>HTML </dt>\n    <dd>HTML 5 is the markup language used to create documents\
    \ that are published on the internet</dd>\n    <dt>CSS3</dt>\n    <dd>CSS3 is\
    \ the markup language used to add style and colors to documents created using\
    \ HTML 5</dd>\n    <dt>HTTP (Hyper Text Transfer protocol)</dt>\n    <dd>HTTP\
    \ is the mechanism by which HTML 5 documents and their associated resources are\
    \ transported on the internet</dd>\n    <dt>WWW (World Wide Web)</dt>\n    <dd>The\
    \ World Wide Web is the collective name for the many hundreds of thousands of\
    \ HTML 5 documents published via the internet</dd>\n    <dt>The Internet</dt>\n\
    ```"
  merge: -1
  pgno: 111
- img_proc: true
  md: "```\n<dd>The internet is a massive global computer network, which amongst other\
    \ things holds the World Wide Web</dd>\n</dl>\n```\n\n*Code Listing 69a: Definition\
    \ list markup for counters demonstration*\n\nIf we render it, we'll get the following.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_112_0.png)\n\n*Figure 91: Our definition\
    \ list ready to be styled.*\n\nFirst let's add a bit of default styling, just\
    \ to neaten things up a little.\n\nAdd the following rules to your style sheet.\n\
    \n```\nbody\n{\n  background-color: aliceblue;\n  font-family: sans-serif;\n \
    \ font-size: 12px;\n}\n\ndt\n{\n  font-weight: bold;\n  font-size: 1.1em;\n  border-bottom:\
    \ 1px solid grey;\n  margin-bottom: 4px;\n  margin-top: 8px;\n  color: grey;\n\
    }\n\ndd\n{\n  font-size: 0.9em;\n  margin-top: 2px;\n  margin-bottom: 2px;\n \
    \ margin-left: 10px;\n}\n```\n\n*Code Listing 69b: Default style rules for our\
    \ generated content*"
  merge: -1
  pgno: 112
- img_proc: true
  md: "Nothing specifically new here, we're setting a default font style, size and\
    \ background color for the page, then we're setting up some default styles for\
    \ our definition list items.\n\nThe output should look like this:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_113_0.png)\n\
    \nWhat would be nice, however, would be if we could have each of our definition\
    \ titles numbered.\n\nNow we could go through each one and prefix the appropriate\
    \ number on it, but that would be tedious and error-prone, and what if those definitions\
    \ are published from a database that has no numbers ahead of time?\n\nWe could\
    \ also change our **dl** elements to **ol** elements, then change all our inner\
    \ list items to **1i** elements, but then we'd have to start playing with an nth-child\
    \ setup to highlight each alternate row as a header. We'd also have the problem\
    \ of removing the numbers from the definition texts, leaving just the titles with\
    \ numbers.\n\nBoth methods would work, but not without significant development\
    \ and management work. CSS counters can solve this problem in a couple of small\
    \ additions to the styles we've already developed.\n\nFirst, let's reset our counter\
    \ to 0 every time we encounter a **dl** element. Append this to your existing\
    \ style sheet:\n\n```\ndl\n{\n    counter-reset: dtcount 0\n}\n```\n\nCode Listing\
    \ 69c: Resetting our counter"
  merge: -1
  pgno: 113
- img_proc: true
  md: "Then we need to increment the counter and add it before the contents of our\
    \ **dt** element:\n\n```\ndt:before\n{\n  content: counter(dtcount)\". \";\n \
    \ counter-increment: dtcount;\n}\n```\n\n*Code Listing 69d: Incrementing and adding\
    \ our counter*\n\nIf you now refresh your browser, you should see that each of\
    \ our **dt** elements now has a number next to it.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_114_0.png)\n\
    \n*Figure 93: Our definition list with numbers next to the titles*\n\nThe numbers\
    \ will increase for however many **dt** / **dd** pairs there are in the list,\
    \ and will number correctly. You don't have to use the **content:before** pseudo\
    \ selector, either; anywhere you can use an integer value, you can use the **counter()**\
    \ function to get the value of your counter. This means you can use it to vary\
    \ colors, adjust font sizes, increase spacing, and all manner of other things.\n\
    \nWhat about decrementing a counter? Well, you can do that too, but not quite\
    \ how you might imagine it.\n\nTo decrement a counter, you still use the **counter-increment**\
    \ rule, but you use a negative offset.\n\nCounter increment rules can take two\
    \ parameters: the first is the name of the counter to change, and the second is\
    \ by how much.\n\nChange the code in Code Listing 69d so that it now reads:"
  merge: -1
  pgno: 114
- img_proc: true
  md: "```\ndt:before\n{\n  content: counter(dtcount)\". \";\n  counter-increment:\
    \ dtcount 4;\n}\n```\n\nCode Listing 69e: Code from 69d with an offset added\n\
    \nIf you render that now, you'll see that your definition lists are now incremented\
    \ by four each time.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_115_0.png)\n\n\
    Figure 94: Our counter now increments by 4\n\nLikewise, if you change that 4 to\
    \ a negative number, then you'll see the numbers next to the **dt** elements run\
    \ backwards.\n\nI'm sure you can think of many more things you can do with these—I'll\
    \ leave that as an exercise for experimentation.\n\n# # Calculating Values\n\n\
    One of the biggest problems in CSS over the years has been calculating element\
    \ sizes accurately. It's mostly because of the lack of ability to do simple tasks\
    \ like this that there are so many JavaScript UI frameworks and tools such as\
    \ Sass and Less.\n\nIn CSS3, the standards committee has introduced the `calc()`\
    \ function, and as its name implies, this ultra-useful little gem can calculate\
    \ values for you."
  merge: -1
  pgno: 115
- img_proc: true
  md: "Most of what it can do is really just basic math—it’s what you can combine\
    \ it with that makes it so special.\n\nYou can combine values in the **calc**\
    \ function with percentage-based values: em’s, px’s, pt’s, and any other type\
    \ of value or measurement that CSS understands, and this opens up some amazing\
    \ possibilities.\n\nConsider the following HTML markup:\n\n```\n<div class=\"\
    header\">\n    <h1>This is the main Header</h1>\n</div>\n<p>This is some dummy\
    \ body text</p>\n```\n\nCode Listing 70a: *HTML markup to demonstrate the calc\
    \ function*\n\nIt’s not uncommon to see this type of pattern in most HTML documents,\
    \ and generally you would mark up the header class so that the header has a fixed\
    \ size that covers the intended document minimum width using a percentage value,\
    \ maybe 75 percent.\n\n```\nbody\n{\n    background-color: aliceblue;\n    font-family:\
    \ sans-serif;\n}\n\n.header\n{\n    width: 75%;\n    height: 60px;\n    background-color:\
    \ steelblue;\n    border: 1px solid black;\n    color: white;\n}\n```\n\nCode\
    \ Listing 70b: *Basic body and header rules*\n\nThe basic rules in Code Listing\
    \ 70b will give you the following:"
  merge: -1
  pgno: 116
- img_proc: true
  md: '![](img/d6b4d2d62fbe04b9c83d677f3498c239_117_0.png)


    Figure 95: Basic rules applied to our header


    Because we''ve used a percentage value for the width of the header element, it
    will always be set at 75 percent. That works fine, but what if we want to center
    the header? That''s not difficult, either. Add the following two lines to the
    .header rule in the basic styles:


    ```

    margin-left: auto;

    margin-right: auto;

    ```


    Code Listing 70c: Additional rules to center our header


    As expected, this centers our header.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '![](img/d6b4d2d62fbe04b9c83d677f3498c239_118_0.png)


    Unfortunately, we now have quite a bit of dead space at each side of the header,
    and because this is a percentage-based measurement, when this gets resized to
    the size of a wide screen monitor, the gaps will look huge, not to mention how
    cramped they might look on a mobile device.


    You may decide to compensate by changing the percentage value. So you change it
    to 95 percent, 100 percent, or 98 percent. You might spend quite a few hours adjusting
    it and then testing it in all sorts of different screen sizes and on different
    devices, but no matter how hard you try, you just can''t get it to look absolutely
    uniform on every possible device.


    If only you had a way of saying, "I want my header to always be 100 percent in
    width, but to always have exactly 20 pixels worth of space on the left and the
    right, no matter how small or large my display is."


    This is exactly where the **calc** function comes into play.


    If you want exactly 20 pixels at either side, then the total of that would be
    40 pixels. If you then centered a 100 percent-width object and subtracted 40 pixels,
    that would give you exactly what you need.


    Change the **width** rule in **.header** so that it reads as follows:


    ```

    width: calc(100% - 40px);

    ```


    *Code Listing 70d: Width rule now using calc to work out its width*'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'When you render it, you should see the following:


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_119_0.png)


    *Figure 97: Our header with 20px on either side*


    Now, it renders with 20px either side, and it doesn''t matter what the width is
    because the CSS engine will always know what 100 percent of the target width is,
    and so can do the math for us automatically.


    Like `counter()`, you can use `calc()` anywhere you can use a straight forward
    number. A word of warning, though: not all the browsers implement it in all of
    the properties. From an implementation point of view, all the current browsers
    support it, but not all of them support it for things like color values or rotations.


    The best place to check is [Can I Use](https://caniuse.com), which will list the
    current compatibility charts for all the new features as they are standardized.
    One useful trick to know is that you can often type something like "**caniuse
    calc()**" or "**caniuse web fonts**" into a Google search and get an instant link
    to the compatibility chart for the feature you''d like to learn more about.


    # ## Element Attributes


    To round this chapter off, I''m going to introduce the ability to get at an element''s
    attribute in order to use it within the rules you''re using.


    If you recall, earlier in the book I mentioned something called data attributes;
    one of the great things about data attributes is the ability to embed custom attribute
    data in an HTML 5 element and still have it validate.'
