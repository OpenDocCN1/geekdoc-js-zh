    \ 字体生成工具进行转换。\n\n字体转换完成后，打开提供给你的 zip 文件，你应该会发现许多以所选字体命名的文件。\n\n查看 Nobile 字体的 zip\
    \ 文件，你会看到类似以下内容（这里我使用的是优秀的免费压缩程序 7-Zip）：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_107_1.png)\n\
    \n图 89：7-Zip 显示的字体包部分列表\n\n除了预期的 .html 和 .css 文件外，你会看到有 .ttf, .eot, .svg, .woff\
    \ 和 .woff2 文件；这五个扩展名就是你的实际字体文件，你需要将这些文件复制到 Web 服务器上以便页面使用。我通常将它们放在根目录中名为 **fonts**\
    \ 的文件夹里，以便集中管理。怎么做完全取决于你，但请记住，CSS 样式需要能够找到它们，因此根据你的网站结构，在使用它们时可能需要在路径名中加入 `../`。\n\
    \n将两个 zip 包中的字体文件解压到测试网页可使用的位置，然后在演示文件中创建以下 HTML 标记进行测试：\n\n```html\n<h1 class=\"\
    ambleBold\">I'm the header in Amble Bold</h1>\n<p class=\"nobileRegular\">\n \
    \   I'm some general purpose paragraph text that's rendered using the 'Nobile\
    \ Regular'\n    web font. As you can see I'm nothing special but for comparison...\n\
    </p>\n<p>I'm some regular paragraph text using the default font</p>\n```\n\n*代码清单\
    \ 68a：用于演示自定义 Web 字体用法的 HTML 标记*\n\n创建好测试 HTML 后，创建一个包含以下规则的样式表：\n\n```css\nbody\n\
    {\n    background-color: aliceblue;\n}\n\n@font-face\n{\n    font-family: 'amblebold';\n\
    \    src: url('fonts/amble-bold-webfont.eot');\n    src: url('fonts/amble-bold-webfont.eot?#iefix')\
    \ format('embedded-opentype'),\n         url('fonts/amble-bold-webfont.woff2')\
    \ format('woff2'),\n         url('fonts/amble-bold-webfont.woff') format('woff'),\n\
    \         url('fonts/amble-bold-webfont.ttf') format('truetype'),\n         url('fonts/amble-bold-webfont.svg#amblebold')\
    \ format('svg');\n    font-weight: normal;\n    font-style: normal;\n}\n\n@font-face\n\
    {\n    font-family: 'nobileregular';\n    src: url('fonts/nobile-regular-webfont.eot');\n\
    \    src: url('fonts/nobile-regular-webfont.eot?#iefix') format('embedded-opentype'),\n\
    \         url('fonts/nobile-regular-webfont.woff2') format('woff2'),\n       \
    \  url('fonts/nobile-regular-webfont.woff') format('woff'),\n         url('fonts/nobile-regular-webfont.ttf')\
    \ format('truetype'),\n         url('fonts/nobile-regular-webfont.svg#nobileregular')\
    \ format('svg');\n    font-weight: normal;\n    font-style: normal;\n}\n\n.ambleBold\n\
    {\n  font-family: 'amblebold'\n}\n\n.nobileRegular\n{\n  font-family: 'nobileregular'\n\
    }\n```\n\n代码清单 68b：用于定义代码清单 68a 中 HTML 样式的 CSS 字体规则\n\n将相应的字体文件复制到与测试 HTML 文档和样式表相同的位置下名为\
    \ **fonts** 的文件夹中，如果你将文档加载到浏览器中，你应该会看到以下内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_109_0.png)\n\
    \n图 90：使用自定义字体渲染的 HTML 页面\n\n你可以指定任意数量的 `@font-face` 规则。一旦定义好，你就可以在任何原本使用 Web\
    \ 安全字体的 CSS 规则中，简单地使用你定义的名称。\n\n然而，正如在我们的演示中所见，我更倾向于定义一个包含字体名称的基于类的规则。这允许我直接将类名添加到元素的类列表中；这样如果我以后需要更改字体，我只需要在一个地方更改，而不需要在多个不同的规则中更改。同样，在自己的项目如何构建这一点由你决定；唯一需要确保的是，每个字体定义中各种\
