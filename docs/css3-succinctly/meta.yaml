    \n## 第 2 章 基础 CSS 知识回顾\n\n在我们开始本书的主要核心内容之前，让我们先回顾一下基础知识。\n\n如果你之前使用过 CSS，或者熟悉这门语言及其工作原理，那么你可以安全地跳过本书的这一部分。如果你的\
