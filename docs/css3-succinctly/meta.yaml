    \ (but that I've missed due to my use of Chrome).\n\nAs a general rule of thumb,\
    \ I develop using Chrome, then modify to accommodate other browsers. If something\
    \ does not work as expected, then please do look up the CSS3 syntax for the nonworking\
    \ code, online, before assuming that the code is broken.\n\nAs for minimum versions,\
    \ I won't be attempting to make any code in this book work correctly below the\
    \ versions shown previously, and if you need to support earlier browsers, then\
    \ you may need to use an appropriate helper library of some kind to fill in the\
    \ gaps. Due to the sheer number of helpers available, there is unfortunately no\
    \ room in this book to discuss them all.\n\n## Chapter 2 Basic CSS Refresher\n\
    \nBefore we get started on the main core of the book, let's go through a basic\
    \ CSS refresher.\n\nIf you've worked with CSS before, or are up to speed with\
    \ the language and how it works, then you can safely skip this part of the book.\
    \ If your CSS skills are a little rusty, or you're quite new to the concept of\
    \ CSS in general, then you should read this chapter, as it will provide the basic\
    \ groundwork for what's to come in the following chapters.\n\n### Defining CSS\n\
    \nSo what exactly is CSS?\n\nCSS stands for Cascading Style Sheets, and the idea\
    \ behind them is a very simple one. CSS documents are created solely for the purpose\
    \ of styling (that is, managing color, size, layout, position, and much more)\
    \ the contents of an HTML document.\n\nWhile HTML code's purpose is to define\
    \ the structure of the document, CSS is there to define how that content is presented\
    \ to the end user.\n\nCSS was originally created to reduce the amount of markup\
    \ that was being used in an HTML document to dictate what a particular chunk of\
    \ HTML looked like.\n\nMany modern-day web developers may never have seen this\
    \ older syntax, so to give you an example of how things used to be done, look\
    \ at Code Listing 2:\n\n```\n<body>\n    <font family=\"serif\" size=\"20pt\"\
    \ color=\"#FF0000\">\n        <i>\n            <b>\n                <h1>This is\
    \ my header in bold italic, 20 point red serif font</h1>\n            </b>\n \
    \       </i>\n    </font>\n</body>\n```\n\n> Code Listing 2: A typical example\
    \ of pre-CSS styling\n\nToday's browsers will still obey this and style it appropriately,\
    \ as shown in the following image:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_13_0.png)\n\
    \n> Figure 2: The output produced by the pre-CSS code sample in Code Listing 2\n\
    \nAs you can see from the HTML code presented in Code Listing 2, vastly more markup\
    \ was required to produce a simple one-line, bold, red header than most are used\
    \ to today.\n\nThat was just one line—imagine having to do this every time you\
    \ wanted to produce a similarly styled header for your page.\n\nCSS rules solve\
    \ two of these problems immediately. First, they typically define the rules that\
    \ define how the text should look in a separate file. This immediately means that\
    \ a designer or graphics-only person can easily change these rules without ever\
    \ having to worry about the code in the HTML file.\n\nSecondly, they promote re-use\
    \ of a rule on multiple elements through the use of the class attribute, which\
    \ means you only have to specify the settings once, then tell the markup when\
    \ to use those settings.\n\nLet's now revisit Code Listing 2, and examine the\
    \ difference I've just described.\n\n```\n<h1 class=\"boldred\">This is my header\
    \ in bold italic, 20 point red serif font</h1>\n```\n\n> Code Listing 3a: Our\
    \ new HTML markup for the bold red style\n\n```\n.boldred\n{\n  font-family: serif;\n\
    \  font-size: 20pt;\n  color: red;\n}\n```\n\n> Code Listing 3b: The bold red\
    \ style rule now defined in styles.css\n\nYou can immediately see the difference\
    \ here, and to re-use the rule on another line, we simply have to add `class=\"\
    boldred\"` as an attribute to our tag. If we then proceed to change the style\
    \ rule from, say, red to green, every element using that rule will suddenly change\
    \ to a green color without ever having to touch any HTML markup.\n\nSo now we\
    \ know why CSS was defined; next we'll start to look at how.\n\n### Cascading\
    \ the rules\n\nThe astute reader may already be asking themselves what the \"\
    cascading\" part of CSS stands for. To cascade is to flow or follow downwards,\
    \ and that's exactly what CSS style sheets do.\n\nNot considering the subject\
    \ of specificity for now, which is covered later in this book, rules that are\
    \ obeyed or discovered further down the chain override anything further up the\
    \ chain. If you're not used to this, it can present some interesting bugs and\
    \ challenges for you, especially when you first start out exploring what is and\
    \ isn't available.\n\nOnce you see it in action, however, the concept is quite\
    \ simple.\n\nTake the following style rule:\n\n```\n.mystyle\n{\n  font-size:\
    \ 10pt;\n  color: green;\n}\n```\n\n> Code Listing 4: Simple green text CSS rule\n\
    \nIf you were to attach that to an element, you would rightly expect the text\
    \ to be 10 points in size and green in color.\n\nNow imagine this rule was defined\
    \ in a style sheet that was already implemented in a CSS document, included elsewhere\
    \ in your project (as part of a content management system, for example).\n\nFurthermore,\
    \ imagine you've been asked to make all text using that rule red, but without\
    \ being able to change the style file previously created.\n\nThe reasons why you\
    \ might not be able to change the original file are many and varied; the style\
    \ sheet may be also being used by a second site where the text must remain green,\
    \ or the styles may be being produced dynamically, for example. Whatever the reason,\
    \ this scenario happens much more than you might anticipate.\n\nHowever, if you\
    \ simply create a second style file (let's call it **styles2.css**), then duplicate\
    \ the link tag (as seen in the basic HTML code in the previous chapter) and change\
    \ the file name appropriately, we can then proceed to add the following CSS rule\
    \ to this new file.\n\n```\n.mystyle\n{\n    color: red;\n}\n```\n\n> Code Listing\
    \ 5: Our duplicate rule created in 'styles2.css'\n\nIf you've done things correctly,\
    \ then you should be greeted by red text in your browser, rather than green text.\n\
    \nIn order to continue to use the green version, you simply leave out the second\
    \ link that loads **styles2.css**, and include it to \"adjust\" your rule to be\
    \ red.\n\nIf you change the font size in the original file, you'll see that, that\
    \ one single change will affect both the red and green versions of the text.\n\
    \nThis cascading of styles can be used in many different ways; before I explain\
    \ that however, there's one more important refresher topic you need to understand\
    \ first.\n\n### CSS Selectors\n\nSo far you've only seen the use of a \"class\"\
    \ attribute-based CSS rule, but there are many other ways that rules can be defined.\n\
    \nTake the following example HTML.\n\n```\n<p id=\"importantInfo\">This is a standard\
