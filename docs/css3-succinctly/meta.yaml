- img_proc: true
  md: "As well as the expected .html and .css files, you'll see that you have .ttf,\
    \ .eot, .svg, .woff, and .woff2 files; these five extensions are your actual font\
    \ files, and it's these files that you need to copy to your web server for your\
    \ pages to use. I generally put them in a folder called **fonts** in the root\
    \ so I can keep them all together. How you do it is entirely up to you, but remember\
    \ that the CSS styles will need to be able to find them, so you may need to put\
    \ a ..\\ in path names when using them, depending on how you structure your websites.\n\
    \nExtract the font files from both zips into a location for your test webpage\
    \ to use, then create the following HTML markup in a demo file to test them with:\n\
    \n```\n<h1 class=\"ambleBold\">I'm the header in Amble Bold</h1>\n<p class=\"\
    nobileRegular\">\n    I'm some general purpose paragraph text that's rendered\
    \ using the 'Nobile Regular'\n    web font. As you can see I'm nothing special\
    \ but for comparison...\n</p>\n<p>I'm some regular paragraph text using the default\
    \ font</p>\n```\n\n*Code Listing 68a: HTML markup to demo the usage of custom\
    \ web fonts*\n\nOnce you've created the test HTML, create a style sheet with the\
    \ following rules:\n\n```\nbody\n{\n    background-color: aliceblue;\n}\n\n@font-face\n\
    {\n    font-family: 'amblebold';\n    src: url('fonts/amble-bold-webfont.eot');\n\
    \    src: url('fonts/amble-bold-webfont.eot?#iefix') format('embedded-opentype'),\n\
    \         url('fonts/amble-bold-webfont.woff2') format('woff2'),\n         url('fonts/amble-bold-webfont.woff')\
    \ format('woff'),\n         url('fonts/amble-bold-webfont.ttf') format('truetype'),\n\
    \         url('fonts/amble-bold-webfont.svg#amblebold') format('svg');\n    font-weight:\
    \ normal;\n    font-style: normal;\n}\n\n@font-face\n{\n    font-family: 'nobileregular';\n\
    \    src: url('fonts/nobile-regular-webfont.eot');\n    src: url('fonts/nobile-regular-webfont.eot?#iefix')\
    \ format('embedded-opentype'),\n         url('fonts/nobile-regular-webfont.woff2')\
    \ format('woff2'),\n         url('fonts/nobile-regular-webfont.woff') format('woff'),\n\
    \         url('fonts/nobile-regular-webfont.ttf') format('truetype'),\n      \
    \   url('fonts/nobile-regular-webfont.svg#nobileregular') format('svg');\n   \
    \ font-weight: normal;\n    font-style: normal;\n}\n```"
