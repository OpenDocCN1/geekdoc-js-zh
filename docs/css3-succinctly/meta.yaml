- md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_27_0.png)\n\n*Figure 8: Code Listing\
    \ 15 with the CSS rules in Code Listing 16 applied*\n\n## The Direct Child Selector\
    \ (>)\n\nAs you've already seen, the descendant selector allows you to target\
    \ child elements down the chain of elements in your markup.\n\nIf you want to\
    \ target paragraph tags that reside inside a **div** with a class type of **news**,\
    \ for example, then a selector of **div.news p** will do the job. There is, however,\
    \ one drawback: the descendant selector is greedy.\n\nWhen we say a selector is\
    \ greedy, we mean that it will attempt to match as much as it possibly can (anyone\
    \ who has any experience with regular expressions will know what I'm talking about).\n\
    \nWhat this means in practice is that not only will the elements at the first\
    \ level of selection be selected, but any that match below that will too.\n\n\
    The direct child selector solves this by being less greedy, and going no further\
    \ than the first level below the root selector.\n\nConsider the following HTML\
    \ markup:\n\n```\n<div class=\"test\">\n    <p>Paragraph 1</p>\n    <p>Paragraph\
    \ 2</p>\n    <div>\n        <p>Paragraph 3</p>\n    </div>\n    <p>Paragraph 4</p>\n\
    </div>\n```\n\n*Code Listing 17: HTML markup to demonstrate the direct child selector*\n\
    \nIf we render Code Listing 17 in our browser, we'll get four simple paragraph\
    \ elements.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_0.png)\n\n*Figure 9:\
    \ HTML rendered using Code Listing 17*\n\nYou'll notice from the markup that paragraph\
    \ 3 is inside a nested **div** element; if we style this block using a standard\
    \ descendant selector, we'll get the following output:\n\n```\ndiv.test p\n{\n\
    \    color: red;\n}\n```\n\n*Code Listing 18: CSS Rule to style the code in Listing\
    \ 17 using a descendant selector*\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_1.png)\n\
    \n*Figure 10: Output produced when combining the HTML in Code Listing 17 with\
    \ the rule in Code Listing 18*\n\nAt first glance, this output might seem ok,\
    \ and in general may actually be what you wanted to achieve. Consider this, however:\
    \ why is paragraph 3 being embedded in a further **div** element?\n\nIt may have\
    \ been created that way with the intention of styling it differently than the\
    \ other paragraph elements in the block.\n\nLet's change our rule, so it uses\
    \ a direct child selector as follows:\n\n```\ndiv.test > p\n{\n    color: red;\n\
    }\n```\n\n*Code Listing 19: CSS Rule to style the code in Code Listing 17 using\
    \ a direct child selector*\n\nYou should now see that it skips the paragraph in\
    \ the nested element, but continues to style the others as expected.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_29_0.png)\n\
    \nThis comes in handy when creating things like pop-up menus, where you might\
    \ like all the top-level elements to take on an unselected look and feel, but\
    \ where nested items forming sub-menus need to be left alone when a parent element\
    \ is selected.\n\n## The General Sibling Selector (~)\n\nThe *general sibling*\
    \ selector, like its close cousin the adjacent sibling selector, is used to select\
    \ elements that follow a parent of a given type. However, unlike its cousin, it\
    \ attempts to select more than one match in the markup hierarchy.\n\nThe adjacent\
    \ sibling selector will at most (as you saw previously) select only the first\
    \ occurrence of a given match; the general sibling selector, however, will attempt\
    \ to select that match, as long as the hierarchy continues to match.\n\nIf we\
    \ build two unordered lists as follows:\n\n```\n<p>List 1</p>\n<ul>\n<li><a href=\"\
    #\">Link 1a</a></li>\n<li><a href=\"#\">Link 2a</a></li>\n<li><a href=\"#\">Link\
    \ 3a</a></li>\n<li><a href=\"#\">Link 4a</a></li>\n</ul>\n<ul>\n<li><a href=\"\
    #\">Link 1b</a></li>\n<li><a href=\"#\">Link 2b</a></li>\n<li><a href=\"#\">Link\
    \ 3b</a></li>\n<li><a href=\"#\">Link 4b</a></li>\n</ul>\n<p>List 2</p>\n<ul>\n\
    <li><a href=\"#\">Link 1a</a></li>\n<li><a href=\"#\">Link 2a</a></li>\n<li><a\
    \ href=\"#\">Link 3a</a></li>\n<li><a href=\"#\">Link 4a</a></li>\n</ul>\n<ul>\n\
    <li><a href=\"#\">Link 1b</a></li>\n<li><a href=\"#\">Link 2b</a></li>\n<li><a\
    \ href=\"#\">Link 3b</a></li>\n<li><a href=\"#\">Link 4b</a></li>\n</ul>\n```\n\
    \n*Code Listing 20: HTML markup to demonstrate the sibling selector*\n\nAs with\
    \ the rest of the examples, if we first render this with no styling, we'll get\
    \ the default standard rendering:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_30_0.png)\n\
    \n*Figure 12: Output produced by the HTML in Code Listing 20 with no style rules\
    \ applied*\n\nTo illustrate the difference, we're first going to style the list\
    \ using the adjacent sibling selector you saw earlier, using the following rule.\n\
    \n```\np + ul a\n{\n  color: red;\n}\n```\n\n*Code Listing 21: Adjacency selector\
    \ for Code Listing 20*\n\nWhen we render Code Listing 20, using the rule in Code\
    \ Listing 21, we get the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_31_0.png)\n\
    \n*Figure 13: Output produced by Code Listing 20 with the adjacency selector applied*\n\
    \nIf you've been following along with the code, this shouldn't come as a surprise.\
    \ The first group is styled, the second is not.\n\nIf we now switch our code to\
    \ use the general sibling selector, however:\n\n```\np ~ ul a\n{\n  color: red;\n\
    }\n```\n\n*Code Listing 22: Sibling selector for Code Listing 20*\n\nWe should\
    \ see a difference in the selection:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_32_0.png)\n\
    \n*Figure 14: Output produced by Code Listing 20 with the sibling selector applied*\n\
    \nWhile the adjacent sibling selector stops at the first match, the general sibling\
    \ selector does not; the general sibling selector will continue down the chain,\
    \ matching anything in the rule as long as the element before it matches.\n\n\
    ## The difference between adjacency and descendancy\n\nAt this point you might\
    \ be wondering why we have two ways of achieving apparently the same thing. It’s\
    \ important to remember that while we have styled similar scenarios so far in\
    \ this chapter, we’ve done this in rather different ways.\n\nWhen we talk about\
    \ elements that are adjacent to each other, we mean these elements are rather\
    \ like neighbors in a street of houses. If you were to draw a line down the alignment\
    \ of each house, you’d see that everything was at the same level. In the following\
    \ code, each of the **div** elements with a **class** attribute of **house** are\
    \ adjacent to one another:\n\n```\n<div class=\"street\">\n    <div class=\"house\"\
    ></div>\n    <div class=\"house\"></div>\n    <div class=\"house\"></div>\n  \
    \  <div class=\"house\"></div>\n    <div class=\"house\"></div>\n</div>\n```\n\
    \n*Code Listing 23: Adjacent elements*\n\nWhen we talk about elements being descendants\
    \ of each other, we're talking about a parent-to-child-like relationship. If we\
    \ apply this to our street example in Code Listing 23, we might have \"tenants\"\
    \ who occupy each house.\n\n```\n<div class=\"street\">\n    <div class=\"house\"\
    ><p class=\"tenant\"></p></div>\n    <div class=\"house\"><p class=\"tenant\"\
    ></p></div>\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n    <div\
    \ class=\"house\"><p class=\"tenant\"></p></div>\n    <div class=\"house\"><p\
    \ class=\"tenant\"></p></div>\n</div>\n```\n\n*Code Listing 24: Descendant elements*\n\
    \nAs you can see in Code Listing 24, we now have a tenant inside each house. Tenants\
    \ are not adjacent to each other because you have to leave the house, move down,\
    \ and then enter into the next house to reach the next tenant.\n\nHowever, since\
    \ you can reach a tenant from a house, then a tenant becomes a descendant of a\
    \ house.\n\nChild and grandchild terminology are defined as a specialist case\
    \ of descendancy. Just like in a family tree, a tenant in our example might have\
    \ children, and those children might have grown up and had children of their own.\n\
    \nA child of a child would still be a descendant of a tenant, but it would not\
    \ be a child of a tenant; it would be a grandchild, something like the following:\n\
    \n```\n<div class=\"street\">\n    <div class=\"house\">\n        <div class=\"\
    tenant\">\n            <div class=\"tenantsChild\">\n                <div class=\"\
    childsChildButTenantsGrandChild\"></div>\n            </div>\n        </div>\n\
    \    </div>\n</div>\n```\n\n*Code Listing 25: Code showing child relation to dependency*\n\
    \nIf you were to create more **div** elements with a class of **tenantsChild**\
    \ next to each other within the confines of the tenant, those **tenantsChild**\
    \ elements, like the houses, would be adjacent to each other.\n\nIt takes a little\
    \ bit of practice until you get into the habit of thinking this way, but if you\
    \ think about HTML in its native form as a specialist, XML-based language, then\
    \ you see that the nesting starts to make sense. Once the nesting makes sense,\
    \ the flow and layout of the selectors start to fall into place too.\n\nDon't\
    \ worry if you struggle to make sense of it straightaway. It took me a long time\
    \ to unravel it all too, and even now I still get it wrong sometimes."
  mdcn: "\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_27_0.png)\n\n*图 8：应用了代码清单 16 中\
    \ CSS 规则的代码清单 15*\n\n## 直接子元素选择器 (>)\n\n正如你已经看到的，后代选择器允许你在标记的元素链中向下定位子元素。\n\n\
    例如，如果你想定位嵌套在 **class** 类型为 **news** 的 **div** 中的段落标签，那么选择器 **div.news p** 就可以胜任。然而，有一个缺点：后代选择器是贪婪的。\n\
    \n当我们说一个选择器是贪婪的，意思是它会尝试尽可能多地匹配（任何有正则表达式经验的人都会明白我在说什么）。\n\n这在实践中意味着，不仅第一层选择中的元素会被选中，其下任何匹配的元素也会被选中。\n\
    \n直接子元素选择器通过减少贪婪性来解决这个问题，它只深入到根选择器下方的第一层。\n\n考虑以下 HTML 标记：\n\n```\n<div class=\"\
    test\">\n    <p>Paragraph 1</p>\n    <p>Paragraph 2</p>\n    <div>\n        <p>Paragraph\
    \ 3</p>\n    </div>\n    <p>Paragraph 4</p>\n</div>\n```\n\n*代码清单 17：用于演示直接子元素选择器的\
    \ HTML 标记*\n\n如果我们在浏览器中渲染代码清单 17，我们会得到四个简单的段落元素。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_0.png)\n\
    \n*图 9：使用代码清单 17 渲染的 HTML*\n\n你会从标记中注意到，段落 3 嵌套在一个 **div** 元素内部；如果我们使用标准的后代选择器来为这个块设置样式，我们将得到以下输出：\n\
    \n```\ndiv.test p\n{\n    color: red;\n}\n```\n\n*代码清单 18：使用后代选择器为代码清单 17 中的代码设置样式的\
    \ CSS 规则*\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_1.png)\n\n*图 10：将代码清单\
    \ 17 中的 HTML 与代码清单 18 中的规则结合后产生的输出*\n\n乍看之下，这个输出可能看起来没问题，而且通常情况下可能确实是你想要达到的效果。然而，请考虑一下：为什么段落\
    \ 3 要被嵌入到另一个 **div** 元素中？\n\n它可能是为了与其他段落元素采用不同的样式而这样创建的。\n\n让我们更改规则，使用直接子元素选择器，如下所示：\n\
    \n```\ndiv.test > p\n{\n    color: red;\n}\n```\n\n*代码清单 19：使用直接子元素选择器为代码清单 17\
    \ 中的代码设置样式的 CSS 规则*\n\n你现在应该会看到，它跳过了嵌套元素中的段落，但继续按预期为其他段落设置样式。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_29_0.png)\n\
    \n这在创建弹出菜单等场景时特别有用，你可能希望所有顶级元素呈现未选中的外观和感觉，但当父元素被选中时，构成子菜单的嵌套项目需要保持不变。\n\n## 通用兄弟选择器\
    \ (~)\n\n*通用兄弟*选择器与其近亲相邻兄弟选择器类似，用于选择跟在特定类型父元素后面的元素。然而，与它的近亲不同的是，它尝试在标记层次结构中选择多个匹配项。\n\
    \n相邻兄弟选择器最多（如你前面所见）只选择给定匹配项的第一次出现；而通用兄弟选择器则会尝试选择该匹配项，只要层次结构继续匹配。\n\n如果我们构建两个无序列表，如下所示：\n\
    \n```\n<p>List 1</p>\n<ul>\n<li><a href=\"#\">Link 1a</a></li>\n<li><a href=\"\
    #\">Link 2a</a></li>\n<li><a href=\"#\">Link 3a</a></li>\n<li><a href=\"#\">Link\
    \ 4a</a></li>\n</ul>\n<ul>\n<li><a href=\"#\">Link 1b</a></li>\n<li><a href=\"\
    #\">Link 2b</a></li>\n<li><a href=\"#\">Link 3b</a></li>\n<li><a href=\"#\">Link\
    \ 4b</a></li>\n</ul>\n<p>List 2</p>\n<ul>\n<li><a href=\"#\">Link 1a</a></li>\n\
    <li><a href=\"#\">Link 2a</a></li>\n<li><a href=\"#\">Link 3a</a></li>\n<li><a\
    \ href=\"#\">Link 4a</a></li>\n</ul>\n<ul>\n<li><a href=\"#\">Link 1b</a></li>\n\
    <li><a href=\"#\">Link 2b</a></li>\n<li><a href=\"#\">Link 3b</a></li>\n<li><a\
    \ href=\"#\">Link 4b</a></li>\n</ul>\n```\n\n*代码清单 20：用于演示兄弟选择器的 HTML 标记*\n\n\
    与前面的示例一样，如果我们先用无样式渲染，将得到默认的标准渲染效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_30_0.png)\n\
    \n*图 12：代码清单 20 中的 HTML 在无样式规则应用时产生的输出*\n\n为了说明区别，我们将首先使用前面看到的相邻兄弟选择器来设置列表样式，使用以下规则。\n\
    \n```\np + ul a\n{\n  color: red;\n}\n```\n\n*代码清单 21：代码清单 20 的相邻选择器*\n\n当我们使用代码清单\
    \ 21 中的规则渲染代码清单 20 时，我们得到以下输出：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_31_0.png)\n\
    \n*图 13：应用相邻选择器后代码清单 20 产生的输出*\n\n如果你一直在跟着代码操作，这应该不会令人惊讶。第一组被设置了样式，第二组则没有。\n\n\
    然而，如果我现在将代码切换为使用通用兄弟选择器：\n\n```\np ~ ul a\n{\n  color: red;\n}\n```\n\n*代码清单 22：代码清单\
    \ 20 的兄弟选择器*\n\n我们应该会看到选择上的差异：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_32_0.png)\n\
    \n*图 方法论14：应用兄弟选择器后代码清单 20 产生的输出*\n\n虽然相邻兄弟选择器在第一次匹配后就停止，通用兄弟选择器却不会；通用兄弟选择器会继续向下遍历链条，只要前面的元素匹配，就会匹配规则中的任何内容。\n\
    \n## 相邻与后代之间的区别\n\n此时你可能会想，为什么我们有两种看似实现相同功能的方式。重要的是要记住，虽然到目前为止我们在本章中设置了类似的场景，但我们是通过相当不同的方式来实现的。\n\
    \n当我们谈论彼此相邻的元素时，我们的意思是这些元素就像一条街道上相邻的房屋。如果你沿着每栋房屋的对齐线画一条线，你会看到所有房屋都在同一水平线上。在以下代码中，每个具有\
    \ **class** 属性为 **house** 的 **div** 元素都是彼此相邻的：\n\n```\n<div class=\"street\">\n\
    \    <div class=\"house\"></div>\n    <div class=\"house\"></div>\n    <div class=\"\
    house\"></div>\n    <div class=\"house\"></div>\n    <div class=\"house\"></div>\n\
    </div>\n```\n\n*代码清单 23：相邻元素*\n\n当我们谈论元素是彼此的后代时，我们说的是一种父子关系。如果我们将此应用到代码清单 23 中的街道示例，我们可能会有\"\
    租户\"居住在每个房屋中。\n\n```\n<div class=\"street\">\n    <div class=\"house\"><p class=\"\
    tenant\"></p></div>\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n\
    \    <div class=\"house\"><p class=\"tenant\"></p></div>\n    <div class=\"house\"\
    ><p class=\"tenant\"></p></div>\n    <div class=\"house\"><p class=\"tenant\"\
    ></p></div>\n</div>\n```\n\n*代码清单 24：后代元素*\n\n正如你在代码清单 24 中看到的，我们现在每个房屋里都有一个租户。租户彼此不相邻，因为你必须离开房屋，向下移动，然后进入下一栋房屋才能到达下一个租户。\n\
    \n然而，由于你可以从房屋到达租户，因此租户成为房屋的后代。\n\n子元素和孙元素术语被定义为后代的一种特殊情况。就像在家族树中一样，我们的示例中的租户可能有孩子，而那些孩子长大后又有了自己的孩子。\n\
    \n孩子的孩子仍然是租户的后代，但它不是租户的孩子；它是孙辈，类似于以下内容：\n\n```\n<div class=\"street\">\n    <div\
    \ class=\"house\">\n        <div class=\"tenant\">\n            <div class=\"\
    tenantsChild\">\n                <div class=\"childsChildButTenantsGrandChild\"\
    ></div>\n            </div>\n        </div>\n    </div>\n</div>\n```\n\n*代码清单\
    \ 25：显示子元素与后代关系的代码*\n\n如果你在租户的范围内创建更多彼此相邻的、**class** 为 **tenantsChild** 的 **div**\
    \ 元素，那些 **tenantsChild** 元素，就像房屋一样，将是彼此相邻的。\n\n你需要一些练习才能养成这样思考的习惯，但如果你想一想 HTML\
    \ 的原生形式——一种专门的基于 XML 的语言——那么你会看到嵌套开始变得合理。一旦嵌套变得合理，选择器的流程和布局也开始变得清晰。\n\n如果你一开始难以理解，不要担心。我也花了很长时间才全部理清，即使现在我有时也会搞错。\n"
