    \ Bootstrap 使用相同的方法显示验证图标*\n\n**Before** 和 **after** 可能是两个最灵活的伪选择器，开发社区仍未发现它们所有的使用方式。\n\
    \n## First-X、Last-X 和 nth-X\n\n我选择将这最后一组表示为一个集合，因为它们都是相关的。first、last 和 nth 伪选择器用于选择元素列表中的第一个、最后一个和用户定义数量的元素。\n\
    \n这一批中有两个不同的组；我们先看通用选择器（即选择任何元素的），然后是特定类型选择器。这两组在 CSS3 规范中列出为：\n\nfirst-child、last-child、nth-child()\n\
    \n和\n\nfirst-of-type、last-of-type、nth-of-type()\n\n对于第一组示例，我们将使用以下 HTML 标记来说明选择器的工作原理以及它们能做什么。\n\
    \n```html\n<ul>\n    <li>List Item One</li>\n    <li>List Item Two</li>\n    <li>List\
    \ Item Three</li>\n    <li>List Item Four</li>\n    <li>List Item Five</li>\n\
    \    <li>List Item Six</li>\n    <li>List Item Seven</li>\n    <li>List Item Eight</li>\n\
    \    <li>List Item Nine</li>\n    <li>List Item Ten</li>\n</ul>\n```\n\n*代码清单\
    \ 55：用于 first、last 和 nth 选择器的无序列表标记*\n\n正如我们目前为止对其他内容所做的，以下是标记在浏览器中的渲染前效果：\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_0.png)\n\n与许多可用的选择器一样，它们的名称毫无疑问地描述了它们的功能。让我们将以下规则应用到代码清单\
    \ 55 的 HTML 中。\n\n```css\nul > li:first-child\n{\n    color: red;\n}\n\nul > li:last-child\n\
    {\n    color: green;\n}\n```\n\n*代码清单 56：演示 'first-child' 和 'last-child' 伪选择器的\
    \ CSS 规则*\n\n正如你可能预测的，无序列表中的第一个和最后一个项目如预期般变色。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_1.png)\n\
    \nfirst-child 和 last-child 选择器是我们能遇到的最简单的；然而，nth-child() 需要更多解释。\n\n你可能会注意到，与其他选择器不同，nth-child\
    \ 后面跟着一组括号。这是因为与其他选择器不同，nth-child 接受一个参数来控制它。\n\n这个参数采用代数方程的形式，描述要选择什么以及如何选。\n\
    \n> **注意：** 对许多人来说，在学校做代数是很遥远的记忆。对于那些还记得的人来说，他们可能宁愿不记得。然而，即使你当时可能想过它什么时候会派上用场，记住它是如何工作的确实能帮助你理解\
    \ CSS3 中的代数表达式。如果你正在努力回忆，那么现在可能是快速复习一下的好时机。\n\n不要害怕；代数方程是描述数字计算应该如何运作的东西，但不一定是实际答案应该是什么。\n\
    \n许多人可能在生命中的某个阶段遇到过看起来像这样的东西：\n**1n+5x=6y**\n\n对于那些记得的人来说，这被称为代数，是数学的一个相当专业的分支，许多人会连续学习多年。解这些奇怪的方程式是许多理论数学家的一种爱好，有些人甚至把生命中的岁月奉献给仅仅是对这些东西的理论研究。\n\
    \n对于那些仍在挠头的人，那一点点代数意味着以下内容：\n\n方程 1 乘以 n 的值加上 5 乘以 x 的值将始终等于 6 乘以 y 的值，其中 n、x\
    \ 和 y 是没有任何当前值的理论实例。\n\n别担心，你不需要那么深入地了解代数就能理解 nth-child 是如何工作的，但你确实需要知道代数是如何运作的。\n\
    \n当你有一个离散值后跟一个理论实例时，该理论实例通常以某种方式由运算符相乘。运算符也可以应用加法和减法，或者单独指定以给出静态值。\n\n例如：\n\n\
    **1** 就是这个意思：1，偏移量为 1，计数为 1，一页，一个东西……真的不重要，因为它是理论性的。\n\n**1n**，另一方面，意味着 1 个 **n**，或\
    \ **n** 的 1 次乘法；同样，**n** 可以代表任何东西，因为一切都是理论性的。\n\n**1n+1** 意味着 1 个 n 再加上额外的 1。\n\
    \n也许理解这些方程如何运作的更简单方法，是想象使用它们来进行乘法表运算。例如，记住 3 的乘法表：\n\n**3 x 0 = 0**\n"
