    margin-right: auto;

    ```


    Code Listing 70c: Additional rules to center our header


    As expected, this centers our header.'
  - '[PAGE 118]


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_118_0.png)


    Unfortunately, we now have quite a bit of dead space at each side of the header,
    and because this is a percentage-based measurement, when this gets resized to
    the size of a wide screen monitor, the gaps will look huge, not to mention how
    cramped they might look on a mobile device.


    You may decide to compensate by changing the percentage value. So you change it
    to 95 percent, 100 percent, or 98 percent. You might spend quite a few hours adjusting
    it and then testing it in all sorts of different screen sizes and on different
    devices, but no matter how hard you try, you just can''t get it to look absolutely
    uniform on every possible device.


    If only you had a way of saying, "I want my header to always be 100 percent in
    width, but to always have exactly 20 pixels worth of space on the left and the
    right, no matter how small or large my display is."


    This is exactly where the **calc** function comes into play.


    If you want exactly 20 pixels at either side, then the total of that would be
    40 pixels. If you then centered a 100 percent-width object and subtracted 40 pixels,
    that would give you exactly what you need.


    Change the **width** rule in **.header** so that it reads as follows:


    ```

    width: calc(100% - 40px);

    ```


    *Code Listing 70d: Width rule now using calc to work out its width*'
  - '[PAGE 119]


    When you render it, you should see the following:


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_119_0.png)


    *Figure 97: Our header with 20px on either side*


    Now, it renders with 20px either side, and it doesn''t matter what the width is
    because the CSS engine will always know what 100 percent of the target width is,
    and so can do the math for us automatically.


    Like `counter()`, you can use `calc()` anywhere you can use a straight forward
    number. A word of warning, though: not all the browsers implement it in all of
    the properties. From an implementation point of view, all the current browsers
    support it, but not all of them support it for things like color values or rotations.


    The best place to check is [Can I Use](https://caniuse.com), which will list the
    current compatibility charts for all the new features as they are standardized.
    One useful trick to know is that you can often type something like "**caniuse
    calc()**" or "**caniuse web fonts**" into a Google search and get an instant link
    to the compatibility chart for the feature you''d like to learn more about.


    # ## Element Attributes


    To round this chapter off, I''m going to introduce the ability to get at an element''s
    attribute in order to use it within the rules you''re using.


    If you recall, earlier in the book I mentioned something called data attributes;
    one of the great things about data attributes is the ability to embed custom attribute
    data in an HTML 5 element and still have it validate.'
  - "[PAGE 120]\n\nThe following HTML shows how this might be used:\n\n```\n<div class=\"\
    header\">\n    <h1 data-headersuffix=\" (Hello)\">This is the main Header</h1>\n\
    </div>\n<p>This is some dummy body text</p>\n```\n\n*Code Listing 71a: HTML markup\
    \ to demonstrate parent attributes*\n\nIf you render this, you'll get exactly\
    \ the same output as seen in Figure 97 (assuming you still have the same style\
    \ rules present). If you don't have the same styles present or have started a\
    \ new file, then you'll just get a plain black text on a white background.\n\n\
    The point here is that these extra data attributes will have no meaning on anything\
    \ in the HTML or the CSS, and will be silently ignored.\n\nThis really comes in\
    \ handy—especially for a lot of the JavaScript libraries available—because it\
    \ means that an HTML developer can add custom attributes to a page, which the\
    \ JavaScript code then later processes in some way. The Bootstrap UI framework\
    \ makes extensive use of this facility so that the HTML developer creating pages\
    \ never needs to know any JavaScript. He or she just has to describe what the\
    \ intention is, and the Bootstrap library takes care of the rest.\n\nMake sure\
    \ your style file is the same as Code Listing 70b, and that you're using the HTML\
    \ code in Code Listing 71a. Render the HTML in your browser and make sure your\
    \ output looks like Figure 95.\n\nNow add the following extension rule to the\
    \ style sheet (you should see the header text change to blue):\n\n```\n.header\
    \ h1:after\n{\n    content: \" (Hiya)\";\n}\n```\n\n*Code Listing 71b: Extended\
    \ header rule that puts “(Hiya)” after the header text*\n\nRender this and make\
    \ sure that the header text now has “(Hiya)” appended to it. If it does, now change\
    \ the rule so that it looks for the data attribute named **headersuffix** and\
    \ uses the parameter from that as the source of its data.\n\n```\n.header h1\n\
    {\n    color: attr(data-headersuffix);\n}\n```\n\n*Code Listing 71c: Extended\
    \ header rule that uses the data attribute to set the text*\n\nThe result should\
    \ be that the header text is now extended using the contents of the custom data\
    \ attribute present on the **h1** element that the selector targets."
  - '[PAGE 121]


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_121_0.png)


    *Figure 98: Our header with the text from the data attribute*


    There is, unfortunately, some bad news. If you read the spec closely, you''ll
    see that the ability to read parent attributes and place them into generated content
    fields was actually defined in CSS2.1, and the ability to use the `attr()` function
    to set properties, such as color, size, etc., was defined in CSS3. As a result,
    all major browsers can use `attr()` to set content in a `:before` or `:after`
    pseudo selector, but none of them as of yet have implemented them in a general
    property setting scenario.


    This is not to say they won''t; as many of you might know, the most popular features
    on the W3C standards track are the ones that developers request, and `attr()`
    is not getting much attention at the moment. There will come a day when this is
    finalized and the browser producers feel it''s getting enough attention to actually
    finish implementing it. For now, it''s only useable for content generation, despite
    what the documentation says.


    It is useful for one scenario, however (and one I''ve previously used it for),
    and that''s to append greetings onto headers and welcome banners that are localized
    for a given locale. Because the value is taken from an attribute, changing that
    attribute is very easy to do in JavaScript, as there are native calls to access
    data attributes.


    Another place it becomes useful is in printing. If you have a style sheet that''s
    used only when a page is printed, you can use this to grab the contents of an
    `href` from an anchor element, then print it out after the anchor tag. Doing this
    means that pages with links printed to a PDF or onto paper are still visible,
    while the ones on screen remain clickable.'
  - '[PAGE 122]


    # # Summary


    In this chapter we''ve learned how to generate arbitrary content using nothing
    more than CSS rules, a task that previously required a large amount of JavaScript
    to get right. We''ve learned a bit more about how data attributes work and how
    we might use them to hold custom content.


    In the next chapter we''ll do a roundup of some of the things we didn''t have
    space to cover, and a few of the smaller, new rules.'
  - "[PAGE 123]\n\n# Chapter 9 The Mixed Bag of Tricks\n\nAnd so we come to the last\
    \ chapter of the book.\n\nIt's always sad when you reach the end of a book like\
    \ this, especially on a subject as diverse as CSS3, but this is not the end. In\
    \ fact, we couldn't be further away from the end—we're still just beginning this\
    \ adventure.\n\nWhat I've shown you so far is only the tip of the iceberg. If\
    \ you're in any doubt, take a look at the main CSS index on the [Mozilla Developer\
    \ Network](https://developer.mozilla.org/). I haven't even begun to explore CSS\
    \ Layout or CSS Animation yet; both of these topics would easily take up a full\
    \ book all of their own, as would an exhaustive rule/property followed by description\
    \ list style text.\n\nHowever, books in the *Succinctly* series are designed to\
    \ be compact and easy-to-read with just enough information to get you in the right\
    \ direction, and it's always a difficult decision to decide what to leave out.\n\
    \nAs with any new technology, the best way to learn it is to play with it. Playing\
    \ is an invaluable skill and learning tool that often gets lost in the modern-day\
    \ IT industry with tight deadlines and tricked-out release schedules. What I hope\
    \ I've presented here is enough information to at least prevent you from having\
    \ to waste time understanding what it is you're playing with.\n\nFor the rest\
    \ of this chapter, I'm going to round things off with a few notable mentions of\
    \ easy-to-understand CSS3 functionality that I felt deserve a mention.\n\n# CSS\
    \ Columns\n\nWe've all been there, tearing our hair out trying to get the column\
    \ widths just perfect so we can get a nice and balanced multiple-column layout\
    \ in our page design.\n\nHours are spent tweaking, measuring, and tweaking again\
    \ until we get an almost-perfect combination of rules and content. Then someone\
    \ decides to drop an image in the sidebar that pushes things out by 1 pixel, and\
    \ BAM! The entire layout crumbles into a smoldering heap.\n\nWell this should\
    \ no longer affect you, thanks to CSS columns.\n\nCreate a **div** with a very\
    \ long paragraph of text, something like the following:\n\n```\n<div class=\"\
    container\">\n    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.\
    \ Maecenas pellentesque urna nec eros ornare, ac tristique diam porta. Donec fermentum\
    \ velit eget dignissim condimentum. Sed rutrum libero sit amet enim viverra tristique.\
    \ Mauris ultricies ornare arcu non adipiscing. Sed id ipsum vitae libero facilisis\
    \ pulvinar id nec lacus. Ut lobortis neque et luctus mattis. Morbi nunc diam,\
    \ elementum rutrum tellus non, viverra mattis diam. Vestibulum sed arcu tincidunt,\
    \ auctor ligula ut, feugiat nisi. Phasellus adipiscing eros ut iaculis sagittis.\
    \ Sed</p>\n</div>\n```"
- md: "```markdown\n## CSS Transformations\n\nWhile transformations are yet another\
    \ topic that could fill an entire book, there are some basics that are easy to\
    \ experiment with. Create an HTML document and add the following markup and CSS\
    \ rules to it:\n\n```html\n<div class=\"transDiv\">\n    <p>I'm a div ready to\
    \ be transformed.</p>\n</div>\n\nbody\n{\n    background-color: aliceblue;\n \
    \   font-family: sans-serif;\n}\n\n.transDiv\n{\n    width: 200px;\n    height:\
    \ 200px;\n    background-color: beige;\n    border: 1px solid black;\n    padding:\
    \ 4px;\n    margin-left: auto;\n    margin-right: auto;\n}\n```\n\n*Code Listing\
    \ 74: HTML and CSS rules to create a beige, centered div*\n\nWhen rendered, this\
    \ should give you the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_126_0.png)\n\
    \n*Figure 101: It's just a standard, beige div*\n\nNow add the following extended\
    \ rule to the style sheet and re-render the output:\n\n```css\n.transDiv\n{\n\
    \    transform: rotate(45deg);\n    -webkit-transform: rotate(45deg);\n}\n```\n\
    \n*Code Listing 75: Extended CSS rule to rotate our div*\n\nYou should have a\
    \ **div** rotated at 45 degrees:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_127_0.png)\n\
    \n**Figure 102: Our div is now rotated.**\n\nAs with CSS columns, there is still\
    \ one case where vendor prefixes are needed, and that's on Safari. IE, Firefox,\
    \ and Chrome all work without needing prefixes in current versions.\n\nYou can\
    \ also apply the following:\n\n-   `scale(x,y)`\n-   `scalex(value)`\n-   `scaley(value)`\n\
    -   `skewx(value)`\n-   `skewy(value)`\n-   `translate(x,y)`\n-   `translatex(value)`\n\
    -   `translatey(value)`\n\nThe actual definition of each function's purpose can\
    \ be found on MDN, but scale allows you to grow and shrink an element, skew allows\
    \ you slope, an element and translate allows you to move an element. There are\
    \ others that allow you to produce all kinds of great effects, and many of these\
    \ properties can be animated, too, allowing even more to be achieved.\n\nThere's\
    \ still more, such as multiple backgrounds, layered elements, 3D transforms, flex\
    \ boxes, CSS shapes, and the list goes on.\n\nFor now, however, I hope you've\
    \ learned a little of the power you now hold in your browser. When this is combined\
    \ with the new element types, layout possibilities, and JavaScript API's available\
    \ in the full HTML 5 spec, it's easy to see how far the HTML platform has progressed.\n\
    \nIt wasn't that long ago that most websites were still fairly static and black\
    \ and white; now we're starting to see some truly amazing visual affects being\
    \ made possible, with developers every day finding new and engaging ways of bending\
    \ this functionality.\n\nIt's a platform that's only going to get better, and\
    \ one that's destined to become the universal user interface for most software.\
    \ CSS3 is something that every web developer needs to learn both now and for the\
    \ future—if you don't, then you risk getting left behind.\n```"
  mdcn: "\n```markdown\n## CSS 变换\n\n虽然变换是另一个足以单独成书的话题，但仍有一些基础内容便于我们进行实践。创建一个 HTML\
    \ 文档，并将以下标记和 CSS 规则添加到其中：\n\n```html\n<div class=\"transDiv\">\n    <p>I'm a div\
    \ ready to be transformed.</p>\n</div>\n\nbody\n{\n    background-color: aliceblue;\n\
    \    font-family: sans-serif;\n}\n\n.transDiv\n{\n    width: 200px;\n    height:\
    \ 200px;\n    background-color: beige;\n    border: 1px solid black;\n    padding:\
    \ 4px;\n    margin-left: auto;\n    margin-right: auto;\n}\n```\n\n*代码清单 74：用于创建一个米色居中\
    \ div 的 HTML 和 CSS 规则*\n\n渲染后，你应该会看到如下内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_126_0.png)\n\
    \n*图 101：只是一个标准的米色 div*\n\n现在，向样式表中添加以下扩展规则，并重新渲染输出：\n\n```css\n.transDiv\n{\n\
    \    transform: rotate(45deg);\n    -webkit-transform: rotate(45deg);\n}\n```\n\
    \n*代码清单 75：用于旋转我们 div 的扩展 CSS 规则*\n\n你应该会看到一个旋转了 45 度的 **div**：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_127_0.png)\n\
    \n**图 102：我们的 div 现在被旋转了。**\n\n与 CSS 多栏布局类似，仍然有一种情况需要使用浏览器厂商前缀，那就是 Safari。当前版本的\
    \ IE、Firefox 和 Chrome 都无需前缀即可正常工作。\n\n你也可以应用以下变换：\n\n-   `scale(x,y)`\n-   `scalex(value)`\n\
    -   `scaley(value)`\n-   `skewx(value)`\n-   `skewy(value)`\n-   `translate(x,y)`\n\
    -   `translatex(value)`\n-   `translatey(value)`\n\n每个函数的具体用途可以在 MDN 上找到，但 `scale`\
    \ 允许你放大或缩小一个元素，`skew` 允许你倾斜一个元素，而 `translate` 则允许你移动一个元素。还有其他函数可以产生各种奇妙的效果，而且许多这些属性也可以被动画化，从而实现更多效果。\n\
    \n还有更多内容，例如多重背景、分层元素、3D 变换、Flexbox 布局、CSS 形状等等，不一而足。\n\n然而，目前我希望你已经初步领略了你在浏览器中所掌握的力量。当这与新元素类型、布局可能性以及完整\
    \ HTML 5 规范中可用的 JavaScript API 相结合时，你很容易就能看出 HTML 平台已经取得了多大的进步。\n\n就在不久前，大多数网站仍然相当静态且颜色单调；而现在，我们开始看到一些真正令人惊叹的视觉效果成为可能，开发者们每天都在寻找新颖而引人入胜的方式来运用这些功能。\n\
    \n这是一个只会变得更好的平台，并且注定会成为大多数软件的通用用户界面。CSS3 是每个 Web 开发者都需要学习的内容，无论是现在还是将来——如果你不学，就有被时代淘汰的风险。\n\
    ```\n"
