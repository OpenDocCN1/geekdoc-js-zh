  - "[PAGE 47]\n\nWhile this might seem fairly innocuous on the surface, if you dig\
    \ down under the hood and look at some of the new JavaScript API's that have been\
    \ added in newer specifications, you'll find that there's an API call that goes\
    \ by the name of `getComputedStyle`. Using this call, it's possible to get the\
    \ actual computed style that's visible on the element in the browser, or at least\
    \ it was.\n\nIn today's modern browsers, this hole is largely patched, and attempting\
    \ to use this call to get the color of the link will in fact just return whatever\
    \ the base color is. In our case, all we get back (even for the Google link) is\
    \ the green color.\n\nI have, however, heard rumors that it's possible to use\
    \ JQuery and MooTools to retrieve the correct value and make a distinction.\n\n\
    This is just a small example of the fact that anything can be used to breach a\
    \ user's privacy or security, even something as common as CSS. Always make sure\
    \ that your rules are specific if possible. Just because you can use them globally\
    \ without a rule to extend, doesn't mean you should. If you tie them to given\
    \ rule sets, it means that your style rules can't be abused by people hacking\
    \ around with the browser tools.\n\n# :disabled and :enabled\n\nAmong the many\
    \ new attributes that can be applied to elements in the HTML 5 spec is the `disabled`\
    \ attribute.\n\nYou use it like any other attribute by simply adding \"disabled\"\
    \ to an element in your markup.\n\nLet's reuse the form mock-up we created in\
    \ Code Listing 39, but change it so that it looks as follows:\n\n```\n<form action=\"\
    #\" method=\"post\">\n    <label for=\"txtUserName\">User Name</label><br />\n\
    \    <input type=\"text\" id=\"txtUserName\" name=\"txtUserName\" disabled /><br\
    \ /><br />\n    <label for=\"txtEmail\">Email</label><br />\n    <input type=\"\
    text\" id=\"txtEmail\" name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n```\n\nCode Listing 42: Mock HTML form markup\
    \ with disabled elements\n\nWhen you render it, you should see that the first\
    \ input element can't be used now."
  - "[PAGE 48]\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_0.png)\n\nFigure 28:\
    \ Simple form with a disabled input\n\nLet's add the following rule to our style\
    \ sheet:\n\n```\ninput:disabled\n{\n    background-color: red;\n    border: 2px\
    \ solid blue;\n}\n```\n\nCode Listing 43: CSS rule to style disabled elements\n\
    \nYou'll see a drastic change when you re-render the form.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_1.png)\n\
    \nFigure 29: Simple form with disabled pseudo class in Code Listing 43 applied\n\
    \nIf you remove the **disabled** attribute from the element, the input will revert\
    \ back to its original state.\n\nThis rule is typically used to show read-only\
    \ fields in a record editor, or to show fields that are not applicable to the\
    \ current form. For example, you might mark up a form so that address fields are\
    \ shown only when a tick box to send mail to that address is ticked."
  - "[PAGE 49]\n\nIf you use the Bootstrap UI framework, you might have seen that\
    \ some elements when used in a form have a small, red stop circle displayed over\
    \ them when you hover over them with a mouse pointer. This is performed in the\
    \ same way, using the disabled rule to change the style of the mouse pointer.\n\
    \nThe **enabled** pseudo selector is the logical opposite of disabled, and applies\
    \ the given style to an element that is NOT disabled, as the following example\
    \ shows:\n\n```\ninput:enabled\n{\n  background-color: yellow;\n  border: 2px\
    \ solid green;\n}\n```\n\n*Code Listing 44: CSS rule to style enabled elements*\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_49_0.png)\n\n*Figure 30: Browser form\
    \ showing enabled CSS rules applied*\n\nAn element is classed as enabled when\
    \ there is no reason to disable it, or specifically, when it does not have a **disabled**\
    \ attribute applied.\n\nNote that an element is also classed as disabled if the\
    \ element's Boolean **disabled** property is set to **true** on its document object\
    \ using JavaScript. In this case, as with other selectors, the application of\
    \ the disabled and enabled selectors are explicitly applied based on the element's\
    \ state, meaning you don't have to keep making sure the correct elements have\
    \ the correct classes applied.\n\n# :valid and :invalid\n\nAnother of the great\
    \ features added to HTML 5 is browser-side validation. With browser-side validation,\
    \ you can make the browser verify the inputs to a form before the form is submitted.\n\
    \nLike the disabled selector, the pseudo selectors here apply to elements only\
    \ when we use the extra attributes and markup provided in the specification.\n\
    \nUsing our form again, let's make another change so that you have the following\
    \ HTML code:"
