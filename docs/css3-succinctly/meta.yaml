- img_proc: true
  md: "```\n.ambleBold\n{\n  font-family: 'amblebold'\n}\n\n.nobileRegular\n{\n  font-family:\
    \ 'nobileregular'\n}\n```\n\nCode Listing 68b: CSS font rules to style and use\
    \ the HTML in Code Listing 68a\n\nWith the appropriate font files copied to a\
    \ folder called **fonts** in the same place as your test HTML document and style\
    \ sheet, if you load the document into your browser, you should see the following:\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_109_0.png)\n\nFigure 90: Our HTML rendered\
    \ using a custom font\n\nYou can specify as many `@font-face` rules as you wish.\
    \ Once you've defined them, you can simply use the name you defined them with\
    \ in any CSS rule that you would use one of the original web-safe fonts in.\n\n\
    As you can see in our demo, however, I prefer to actually define a class-based\
    \ rule with the font name in it. This allows me to just add the class name to\
    \ the list of classes for an element; then if I ever need to change the font,\
    \ I only need to change it in one place rather than in several different rules.\
    \ Again, it's up to you how you structure this in your own projects; the only\
    \ thing you have to make sure of is that the various `url` keywords in each of\
    \ the font definitions can be downloaded.\n\nOne of the most common problems I\
    \ see with developers working on the Windows platform under the IIS web server\
    \ is that sometimes fonts don't render correctly, even though the font files are\
    \ there and the CSS files are correct. The reason this happens is that by, default,\
    \ IIS doesn't have a mime type listing for the woff and woff2 font extensions\
    \ (on some older ones, ttf and svg are not defined, either). You can verify this\
    \ by requesting the font directly in your browser's address bar. If the font does\
    \ not have a correct mime type, you'll get a 404 error from the server telling\
    \ you the font could not be found."
