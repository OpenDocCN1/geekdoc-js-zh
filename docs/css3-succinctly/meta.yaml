    # Chapter 6 Color


    If you''ve done any web development at all prior to reading this, then you''ve
    almost certainly come across the standard way that colors are defined in HTML/CSS
    using the 6-digit hex notation: **#rrggbb**


    What exactly does this mean? It''s actually quite simple. In effect, it''s a 24-bit
    color value made up of three 8-bit components.


    In the hexadecimal number scheme, digits are counted from 0 to F rather than 0
    to 9 as in the normal decimal number system. When you look closely, you realize
    that you can fit all of those values into 4 bits, and since the maximum number
    4 bits can represent in decimal is 15, then 0 to F actually means 0 to 15.


    If you double that up, the 4 bits becomes 8 bits, and the maximum you can then
    fit is 255, so FF (our largest hexadecimal number) becomes 255 (our largest decimal
    number). My aim here is not to turn this into a lesson on hexadecimal math; my
    aim is just to explain to you that a color value is made up of 256 (0 to 255)
    levels of Red, Green, and Blue values, with 0 being no color and 255 being the
    max amount of that color.


    If you wanted a mid grey, for example, you might use 127 for the values of Red,
    Green, and Blue, which, when translated would give you **#7F7F7F**.


    If you''re using Windows it''s very easy to convert by using the Windows Calculator.
    Type **calc** into your run box, or search for it in the Start menu. When it loads,
    on the **View** menu, choose **Programmer**.


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_99_0.png)


    Figure 83: Windows Calculator View menu'
