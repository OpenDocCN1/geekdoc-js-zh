    \ for example, **h1** type elements have the **boxout** class applied to them\
    \ and are nested inside a **div** element. This can be achieved using a selector\
    \ such as **div .boxout h1**."
- md: " ## Summary\n\nCSS3 introduced many new selector types, allowing even more\
    \ precise control over how you target various parts of your HTML document. We'll\
    \ be covering these in the next chapter as we start to explore the new things\
    \ that CSS3 brings to the table for modern day web developers.\n\nIn this chapter,\
    \ we took a quick look at CSS as a technology/language, and had a quick refresher\
    \ on how it does what it does. Moving forward from here, we'll start to delve\
    \ into topics specific to this new version of CSS. If you're still having problems\
    \ making sense of CSS in general, then I suggest working through some of the various\
    \ sites that are available to you on the internet today.\n\nOne particular site\
    \ I can heartily recommend is [HTML Dog](https://www.htmldog.com). Not only is\
    \ this site crammed full of all the essential information you might need to know,\
    \ but it also carries a number of tutorials, reference guides, and resource links\
    \ to other useful places on the internet that should help you further your knowledge.\n\
    \n## Chapter 3: New Selectors\n\nIn the previous chapter you saw a brief refresher\
    \ of the most common types of selectors used in CSS. These three types are known\
    \ as the class, ID, and descendant selectors, and were all that was available\
    \ before version 3 of CSS. Now that CSS3 is here, it has brought many new selectors\
    \ as part of its new functionality.\n\nWe won't be covering every new selector\
    \ in this chapter, but you'll see rather quickly the sheer flexibility now available\
    \ to target your HTML elements in ways you might never even have imagined.\n\n\
    Many of these new selectors are implemented as pseudo-selectors (selectors that\
    \ act as an extension to another selector, such as hover), and you could easily\
    \ write an entire book just on the subject of selectors alone.\n\nIn this chapter,\
    \ we'll look only at the most important of the new selectors available, along\
    \ with a basic demonstration of their uses. For the rest, I strongly advise you\
    \ to read many of the excellent resources available on the internet. Aside from\
    \ the other links I've already mentioned, a great place to start purely for CSS\
    \ topics is the CSS pages on the [Mozilla Developer Network](https://developer.mozilla.org/).\
    \ The handy thing about MDN is the compatibility guides, which will tell you at\
    \ a glance which selectors work with which browsers, and which ones will give\
    \ you problems.\n\n### The Universal Selector (*)\n\nThe *target all* selector\
    \ does exactly what it says: it targets everything it can in the space in which\
    \ it is operating.\n\nThat means if you have it inside an ID-based selector, then\
    \ everything that falls under the control of that ID selector will be affected.\n\
    \nUsing the `*` symbol tells you straight away that it behaves like a wild card,\
    \ being as greedy as possible and selecting as much as possible. At first, this\
    \ may seem like a great thing, until you suddenly realize just how much it slows\
    \ your page down on a mobile device, or on a page with millions of nested elements.\n\
    \nThe universal selector is designed primarily to make sweeping changes as part\
    \ of an initial setup, such as setting a page's entire CSS model to a known set\
    \ of defaults (like 0-pixel margins and no borders).\n\nTypically it's used in\
    \ CSS resets to start at a known state. Many of the well-known, front-end UI frameworks\
    \ make extensive use of it to put your page into a known state before applying\
    \ any custom styles they may provide.\n\nThe universal selector should be used\
    \ sparingly, and its sphere of influence should be made as minimal as possible\
    \ so as not to cause any drastic performance bottlenecks.\n\nIf you wanted to\
    \ make sure that the margins and padding were set to 0 on every element in your\
    \ document, then you might apply this selector as shown in Code Listing 13.\n\n\
    ```\n*\n{\n  margin: 0;\n  padding: 0;\n}\n```\n\n*Code Listing 13: Using the\
    \ universal selector*\n\nAfter including this somewhere near the top of your style\
    \ file, you can be sure that immediately after it, none of your rules will have\
    \ any margins or padding applied to them.\n\n### The Adjacent Sibling Selector\
    \ (+)\n\nOne of the simpler selectors to understand, the adjacent selector selects\
    \ elements that are immediately next to each other, and does so only once for\
    \ each occurrence.\n\nImagine you have the following HTML markup:\n\n```\n<div>\n\
    \    <h1>Heading</h1>\n    <p>Text line 1</p>\n    <p>Text line 2</p>\n    <h1>Heading</h1>\n\
    \    <p>Text line 1</p>\n    <p>Text line 2</p>\n</div>\n```\n\n*Code Listing\
    \ 14a: HTML markup to demonstrate the adjacent selector*\n\nIf you then applied\
    \ the following CSS rule to:\n\n```\nh1 + p\n{\n  color: red;\n}\n```\n\n*Code\
    \ Listing 14b: CSS rule to demonstrate the adjacent selector*\n\nOnly the **p**\
    \ element immediately following the **h1** element would be changed to a red color.\
    \ The second line of text (and any others that might follow) will remain unchanged,\
    \ as will the **h1** elements themselves, as Figure 6 shows:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_24_0.png)\n\
    \nOne of the places that the adjacent sibling selector is most useful is in the\
    \ creation of lead or opening paragraphs. Consider the following example.\n\n\
    ```\n<!doctype html>\n<html>\n<head>\n    <title>Basic HTML 5 document</title>\n\
    \    <link href=\"styles.css\" rel=\"Stylesheet\" type=\"text/css\" />\n</head>\n\
    \n<body>\n\n    <section>\n        <article>\n            <h1>Monstrous Inbox</h1>\n\
    \            <p>Today in local news, a monstrous email inbox was discovered belonging\
    \ to Mr Jones of durham.</p>\n            <p>The email inbox was rumoured to have\
    \ 11ty billion unread emails in it, but scientists say that calculating the actual\
    \ amount is going to be almost impossible.</p>\n            <p>Mr. Jones had no\
    \ comment, but he did let slip that he had no idea how his inbox grew so large\
    \ and so fast.</p>\n        </article>\n        <article>\n            <h1>Jelly\
    \ Table Legs</h1>\n            <p>Furniture Watchdogs are today warning all people\
    \ to be on the lookout for tables with Jelly legs.</p>\n            <p>In recent\
    \ months there have been a spate of fake tables released into the global furniture\
    \ market, these fake tables are exceptionally dangerous and could wobble over\
    \ at any moment.</p>\n            <p>People should exercise extreme caution when\
    \ buying new tables, if you're unsure call a professional table tester to ensure\
    \ you're getting a genuine product.</p>\n        </article>\n    </section>\n\
    ```\n\n```\n</body>\n</html>\n```\n\n### Code Listing 15: Fake news listing\n\n\
    The code in Listing 15 represents what could be a set of news articles. I've marked\
    \ the code up so that it's using the new semantic tags in HTML 5 to help define\
    \ document structure and layout. Please note that you don't need to type in all\
    \ the text found inside the `<p>` elements; I've included a large amount just\
    \ for demonstration purposes.\n\nIf you render the output as is without any styling,\
    \ you'll get something that looks like the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_25_0.png)\n\
    \n### Figure 7: Unstyled news article example produced by Code Listing 15\n\n\
    With the help of the adjacent sibling selector, and some help from the descendant\
    \ selector, we can easily style this output using a very minimal set of style\
    \ rules.\n\nThe following CSS code shows how we might use the adjacent sibling\
    \ selector to ensure that our first paragraph stands out from the rest in each\
    \ article.\n\n```\nsection\n{\n\tfont-family: sans-serif;\n\tfont-size: 12pt;\n\
    }\nsection h1\n{\n    color: green;\n    border-bottom: 1px solid green;\n   \
    \ font-size: 15pt;\n}\nsection p\n{\n    color: grey;\n}\nsection h1 + p\n{\n\
    \    color: black;\n    font-size: 14pt;\n    font-style: italic;\n}\n```\n\n\
    *Code Listing 16: CSS code to style the news articles in Code Listing 15*\n\n\
    As you can see in Code Listing 16, the CSS used is very simple, and what's more,\
    \ it's driven from the `section` tag, which means any header or paragraph combinations\
    \ that are NOT inside a containing section tag can still be safely used, and will\
    \ not be changed to match the styles in Listing 16.\n\nIf we refresh the HTML\
    \ output with the new styles, and do a little text editing, we should now see\
    \ something like this:"
  mdcn: "\n ## 摘要\n\nCSS3 引入了许多新的选择器类型，让你能够更精确地控制如何定位 HTML 文档中的各个部分。我们将在下一章中介绍这些内容，开始探索\
    \ CSS3 为现代 Web 开发人员带来的新特性。\n\n在本章中，我们快速了解了 CSS 作为一种技术/语言，并简要回顾了它的工作原理。从这里开始，我们将深入探讨这一新版\
    \ CSS 特有的主题。如果你对 CSS 的整体理解仍有困难，那么我建议你先通过当今互联网上可用的一些相关网站进行学习。\n\n我可以衷心推荐的一个网站是\
    \ [HTML Dog](https://www.htmldog.com)。这个网站不仅充满了你可能需要了解的基本信息，还提供了大量教程、参考指南以及通往互联网上其他有用地方的资源链接，这些都将帮助你进一步扩展知识。\n\
    \n## 第三章：新选择器\n\n在上一章中，你简要回顾了 CSS 中最常用的选择器类型。这三种类型被称为类选择器、ID 选择器和后代选择器，它们是 CSS\
    \ 3 版本之前唯一可用的选择器。现在 CSS3 已经到来，它带来了许多新选择器作为其新功能的一部分。\n\n我们不会在本章中涵盖每一个新选择器，但你会很快看到，现在可用的灵活性之大，可能是你从未想象过的。\n\
    \n这些新选择器中的许多都是以伪选择器的形式实现的（作为另一个选择器的扩展的选择器，例如 hover），仅就这个主题你完全可以写一整本书。\n\n在本章中，我们只会介绍最重要的新选择器，并基本演示它们的用途。对于其余部分，我强烈建议你阅读互联网上许多优秀的资源。除了我已经提到的其他链接之外，一个专门用于\
    \ CSS 主题的绝佳起点是 [Mozilla 开发者网络](https://developer.mozilla.org/)上的 CSS 页面。MDN 的优点在于其兼容性指南，它可以让你一目了然地了解哪些选择器适用于哪些浏览器，以及哪些会给你带来问题。\n\
    \n### 通用选择器 (*)\n\n*target all* 选择器名副其实：它尽可能定位其作用范围内的所有内容。\n\n这意味着如果你将它放在基于 ID\
    \ 的选择器内部，那么所有落在该 ID 选择器控制范围内的元素都会受到影响。\n\n使用 `*` 符号立刻就能明白它的行为类似于通配符，尽可能贪婪地选择尽可能多的内容。起初，这似乎是一件好事，直到你突然意识到它在移动设备上或在有数百万嵌套元素的页面中，会让你的页面变慢多少。\n\
    \n通用选择器主要用于在初始设置中进行全面更改，例如将页面的整个 CSS 模型设置为已知的默认集合（如 0 像素边距和无边框）。\n\n通常它在 CSS 重置中使用，以便从已知状态开始。许多知名的前端\
    \ UI 框架广泛地使用它来将你的页面置于已知状态，然后再应用它们可能提供的任何自定义样式。\n\n通用选择器应该谨慎使用，并且应使其影响范围尽可能小，以免造成严重的性能瓶颈。\n\
    \n如果你想确保文档中每个元素的边距和内边距都设置为 0，那么你可以如代码清单 13 所示应用此选择器。\n\n```\n*\n{\n  margin: 0;\n\
    \  padding: 0;\n}\n```\n\n*代码清单 13：使用通用选择器*\n\n在样式文件顶部附近包含此代码后，你可以确保在其之后，你的任何规则都不会有任何边距或内边距应用。\n\
    \n### 相邻兄弟选择器 (+)\n\n相邻选择器是较容易理解的选择器之一，它选择紧邻的元素，并且对每个出现的位置仅执行一次。\n\n假设你有以下 HTML\
    \ 标记：\n\n```\n<div>\n    <h1>Heading</h1>\n    <p>Text line 1</p>\n    <p>Text\
    \ line 2</p>\n    <h1>Heading</h1>\n    <p>Text line 1</p>\n    <p>Text line 2</p>\n\
    </div>\n```\n\n*代码清单 14a：用于演示相邻选择器的 HTML 标记*\n\n如果你然后将以下 CSS 规则应用于：\n\n```\nh1\
    \ + p\n{\n  color: red;\n}\n```\n\n*代码清单 14b：用于演示相邻选择器的 CSS 规则*\n\n只有紧接在 **h1**\
    \ 元素之后的 **p** 元素会被更改为红色。第二行文本（以及可能紧随其后的任何其他文本）将保持不变，**h1** 元素本身也一样，如图 6 所示：\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_24_0.png)\n\n相邻兄弟选择器最有用武之地之一是创建引言或开篇段落。考虑以下示例。\n\
    \n```\n<!doctype html>\n<html>\n<head>\n    <title>Basic HTML 5 document</title>\n\
    \    <link href=\"styles.css\" rel=\"Stylesheet\" type=\"text/css\" />\n</head>\n\
    \n<body>\n\n    <section>\n        <article>\n            <h1>Monstrous Inbox</h1>\n\
    \            <p>Today in local news, a monstrous email inbox was discovered belonging\
    \ to Mr Jones of durham.</p>\n            <p>The email inbox was rumoured to have\
    \ 11ty billion unread emails in it, but scientists say that calculating the actual\
    \ amount is going to be almost impossible.</p>\n            <p>Mr. Jones had no\
    \ comment, but he did let slip that he had no idea how his inbox grew so large\
    \ and so fast.</p>\n        </article>\n        <article>\n            <h1>Jelly\
    \ Table Legs</h1>\n            <p>Furniture Watchdogs are today warning all people\
    \ to be on the lookout for tables with Jelly legs.</p>\n            <p>In recent\
    \ months there have been a spate of fake tables released into the global furniture\
    \ market, these fake tables are exceptionally dangerous and could wobble over\
    \ at any moment.</p>\n            <p>People should exercise extreme caution when\
    \ buying new tables, if you're unsure call a professional table tester to ensure\
    \ you're getting a genuine product.</p>\n        </article>\n    </section>\n\
    ```\n\n```\n</body>\n</html>\n```\n\n### 代码清单 15：假新闻列表\n\n清单 15 中的代码代表了一组可能的新闻文章。我对代码进行了标记，使其使用了\
    \ HTML 5 中的新语义标签来帮助定义文档结构和布局。请注意，你不需要输入 `<p>` 元素中的所有文本；我包含了大量内容仅用于演示目的。\n\n如果你直接渲染输出而不进行任何样式设置，你会得到类似以下的效果：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_25_0.png)\n\n### 图 7：由代码清单 15 生成的未设置样式的新闻文章示例\n\
    \n借助相邻兄弟选择器，以及后代选择器的帮助，我们可以使用非常少量的样式规则轻松地为这个输出设置样式。\n\n以下 CSS 代码展示了如何使用相邻兄弟选择器来确保每篇文章中的第一个段落与其余段落区分开来。\n\
    \n```\nsection\n{\n\tfont-family: sans-serif;\n\tfont-size: 12pt;\n}\nsection\
    \ h1\n{\n    color: green;\n    border-bottom: 1px solid green;\n    font-size:\
    \ 15pt;\n}\nsection p\n{\n    color: grey;\n}\nsection h1 + p\n{\n    color: black;\n\
    \    font-size: 14pt;\n    font-style: italic;\n}\n```\n\n*代码清单 16：用于为代码清单 15\
    \ 中的新闻文章设置样式的 CSS 代码*\n\n如你在代码清单 16 中所见，使用的 CSS 非常简单，而且更重要的是，它是由 `section` 标签驱动的，这意味着任何不在包含性\
    \ section 标签内的标题或段落组合仍然可以安全使用，不会更改为匹配清单 16 中的样式。\n\n如果我们用新的样式刷新 HTML 输出，并进行一些文本编辑，我们现在应该能看到类似这样的效果：\n"
