  md: "At 400 by 200 with the `circle` modifier applied, you should see something\
    \ like this:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_96_0.png)\n\n> *Figure\
    \ 80: Our gradient with the circle modifier applied*\n\nThere are other modifiers\
    \ that you can add too; these are mostly used to control things based on width.\
    \ For example, if you have a short and wide element, and you're specifying the\
    \ `circle` modifier, then the largest color range will be along the longest edge.\
    \ This means that from top to bottom you may only see your start color, but the\
    \ full fade will be visible across the width. To combat this, one of the modifiers\
    \ you can supply is `closest-side`, which will force the majority of your gradient\
    \ into whichever side dimension is the smallest while letting the graduation run\
    \ out early across the wider side. As with all of the different settings available,\
    \ you can find these listed along with their explanations on the Mozilla developer\
    \ network.\n\n# ## Repeating Gradients\n\nThe syntax for repeating gradients is\
    \ identical to cadial gradient, the only difference is that you specify them using\
    \ `repeating-linear-gradient` rather than just `linear-gradient`. However, there\
    \ is a caveat that you need to watch out for, and that is you MUST supply your\
    \ colors with color stop values.\n\nIf you try to specify a repeating gradient\
    \ by just supplying non color stop values, you'll simply end up with something\
    \ that just looks like a standard linear gradient for example\n\n```\n.gradDiv\n\
    {\n    background-image: repeating-linear-gradient(red, yellow);\n}\n```\n\n>\
