    \ 10px 10px 5px;\n}\n\n.niceDiv.topRightShadow\n{\n  box-shadow: 10px -10px精神障碍\
    \ 5px;\n}\n```\n\n> Code Listing 62d: CSS rules changed to blur the shadows\n\n\
    The re-render your test HTML document, you should now see the shadows become slightly\
    \ softer.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_83_0.png)\n\n> Figure 65:\
    \ Our div elements with a small blur added\n\nThe larger you make the blur, the\
    \ softer the shadow's edge will be.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_83_1.png)\n\
    \n> Figure 66: Our div elements with a 30px blur radius\n\nThe fourth parameter\
    \ controls how much the blur spreads away from the edge, and is called the spread\
    \ radius."
