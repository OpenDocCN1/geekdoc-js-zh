    \ 到底是什么？\n\nCSS 代表层叠样式表，其背后的思想非常简单。CSS 文档的创建纯粹是为了对 HTML 文档的内容进行样式设计（即管理颜色、大小、布局、位置等等）。\n\
    \nHTML 代码的目的是定义文档的结构，而 CSS 则用于定义该内容如何呈现给最终用户。\n\nCSS 最初的创建是为了减少 HTML 文档中用于规定特定\
    \ HTML 代码块外观的标记数量。\n\n许多现代网页开发者可能从未见过这种旧语法，因此为了给你一个过去做法的示例，请看代码清单 2：\n\n```\n\
    <body>\n    <font family=\"serif\" size=\"20pt\" color=\"#FF0000\">\n        <i>\n\
    \            <b>\n                <h1>This is my header in bold italic, 20 point\
    \ red serif font</h1>\n            </b>\n        </i>\n    </font>\n</body>\n\
    ```\n\n> 代码清单 2：CSS 之前样式设置的典型示例\n\n今天的浏览器仍然会遵循此规则并对其进行适当的样式设置，如下图所示：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_13_0.png)\n\
    \n> 图 2：代码清单 2 中 CSS 之前代码示例产生的输出\n\n正如你在代码清单 2 中的 HTML 代码中所看到的，要生成一个简单的一行、加粗、红色的标题，需要的标记比现在大多数人习惯使用的要多得多。\n\
    \n那只是一个标题——想象一下，每次你想为你的页面创建一个类似样式的标题时都得这样做。\n\nCSS 规则立即解决了其中两个问题。首先，它们通常将定义文本外观的规则放在一个单独的文件中定义。这立即意味着设计师或仅负责图形的人可以轻松地更改这些规则，而无需担心\
    \ HTML 文件中的代码。\n\n其次，它们通过使用 class 属性促进规则在多个元素上的重用，这意味着你只需指定一次设置，然后告诉标记何时使用这些设置。\n\
    \n现在让我们重新审视代码清单 2，看看我刚才描述的区别。\n\n```\n<h1 class=\"boldred\">This is my header\
