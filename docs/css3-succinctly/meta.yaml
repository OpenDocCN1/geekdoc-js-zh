- md: "## Summary\n\nIn this chapter we saw how to use the font functionality that's\
    \ part of CSS3, how to convert and add new fonts to our webpages, and also took\
    \ on board some cautionary notes about using them.\n\nNext up we'll take a look\
    \ at generated content, counters, and calculations.\n\n## Chapter 8: Generated\
    \ Content and Calculations\n\nYou've already seen some of what generated content\
    \ can do in the form of the :before and :after pseudo selectors; the generated\
    \ content module, however, can do a bit more than that with just a few simple\
    \ CSS rules.\n\nYou can, for instance, read the value of an attribute from a parent\
    \ element and then use that in a rule further down the chain.\n\nYou can also\
    \ initialize and use counters, allowing you to use auto-generated sequential numbers\
    \ for everything from list numbering to element indexing.\n\nFinally, with the\
    \ calculation module you can actually have your CSS rules perform basic math and\
    \ work out exact screen sizes, border widths, and all sorts of other useful measurements—all\
    \ without ever thinking about JavaScript.\n\n### Counters\n\nCounters are controlled\
    \ by normal CSS rules, and while they are very simplistic in nature, they have\
    \ quite a few uses.\n\nA counter is initialized using the `counter-reset` CSS\
    \ rule, and it’s incremented using the `counter-increment` rule.\n\nYou get the\
    \ value of the counter by using the `counter()` function.\n\nLet’s imagine you\
    \ have the following HTML markup (if you’ve read the rest of the book so far,\
    \ you’ll recognize this from Code Listing 58).\n\n```html\n<dl>\n    <dt>HTML\
    \ </dt>\n    <dd>HTML 5 is the markup language used to create documents that are\
    \ published on the internet</dd>\n    <dt>CSS3</dt>\n    <dd>CSS3 is the markup\
    \ language used to add style and colors to documents created using HTML 5</dd>\n\
    \    <dt>HTTP (Hyper Text Transfer protocol)</dt>\n    <dd>HTTP is the mechanism\
    \ by which HTML 5 documents and their associated resources are transported on\
    \ the internet</dd>\n    <dt>WWW (World Wide Web)</dt>\n    <dd>The World Wide\
    \ Web is the collective name for the many hundreds of thousands of HTML 5 documents\
    \ published via the internet</dd>\n    <dt>The Internet</dt>\n    <dd>The internet\
    \ is a massive global computer network, which amongst other things holds the World\
    \ Wide Web</dd>\n</dl>\n```\n\n*Code Listing 69a: Definition list markup for counters\
    \ demonstration*\n\nIf we render it, we'll get the following.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_112_0.png)\n\
    \n*Figure 91: Our definition list ready to be styled.*\n\nFirst let's add a bit\
    \ of default styling, just to neaten things up a little.\n\nAdd the following\
    \ rules to your style sheet.\n\n```css\nbody\n{\n  background-color: aliceblue;\n\
    \  font-family: sans-serif;\n  font-size: 12px;\n}\n\ndt\n{\n  font-weight: bold;\n\
    \  font-size: 1.1em;\n  border-bottom: 1px solid grey;\n  margin-bottom: 4px;\n\
    \  margin-top: 8px;\n  color: grey;\n}\n\ndd\n{\n  font-size: 0.9em;\n  margin-top:\
    \ 2px;\n  margin-bottom: 2px;\n  margin-left: 10px;\n}\n```\n\n*Code Listing 69b:\
    \ Default style rules for our generated content*\n\nNothing specifically new here,\
    \ we're setting a default font style, size and background color for the page,\
    \ then we're setting up some default styles for our definition list items.\n\n\
    The output should look like this:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_113_0.png)\n\
    \nWhat would be nice, however, would be if we could have each of our definition\
    \ titles numbered.\n\nNow we could go through each one and prefix the appropriate\
    \ number on it, but that would be tedious and error-prone, and what if those definitions\
    \ are published from a database that has no numbers ahead of time?\n\nWe could\
    \ also change our **dl** elements to **ol** elements, then change all our inner\
    \ list items to **li** elements, but then we'd have to start playing with an nth-child\
    \ setup to highlight each alternate row as a header. We'd also have the problem\
    \ of removing the numbers from the definition texts, leaving just the titles with\
    \ numbers.\n\nBoth methods would work, but not without significant development\
    \ and management work. CSS counters can solve this problem in a couple of small\
    \ additions to the styles we've already developed.\n\nFirst, let's reset our counter\
    \ to 0 every time we encounter a **dl** element. Append this to your existing\
    \ style sheet:\n\n```css\ndl\n{\n    counter-reset: dtcount 0\n}\n```\n\n*Code\
    \ Listing 69c: Resetting our counter*\n\nThen we need to increment the counter\
    \ and add it before the contents of our **dt** element:\n\n```css\ndt:before\n\
    {\n  content: counter(dtcount)\". \";\n  counter-increment: dtcount;\n}\n```\n\
    \n*Code Listing 69d: Incrementing and adding our counter*\n\nIf you now refresh\
    \ your browser, you should see that each of our **dt** elements now has a number\
    \ next to it.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_114_0.png)\n\n*Figure\
    \ 93: Our definition list with numbers next to the titles*\n\nThe numbers will\
    \ increase for however many **dt** / **dd** pairs there are in the list, and will\
    \ number correctly. You don't have to use the **content:before** pseudo selector,\
    \ either; anywhere you can use an integer value, you can use the **counter()**\
    \ function to get the value of your counter. This means you can use it to vary\
    \ colors, adjust font sizes, increase spacing, and all manner of other things.\n\
    \nWhat about decrementing a counter? Well, you can do that too, but not quite\
    \ how you might imagine it.\n\nTo decrement a counter, you still use the **counter-increment**\
    \ rule, but you use a negative offset.\n\nCounter increment rules can take two\
    \ parameters: the first is the name of the counter to change, and the second is\
    \ by how much.\n\nChange the code in Code Listing 69d so that it now reads:\n\n\
    ```css\ndt:before\n{\n  content: counter(dtcount)\". \";\n  counter-increment:\
    \ dtcount 4;\n}\n```\n\n*Code Listing 69e: Code from 69d with an offset added*\n\
    \nIf you render that now, you'll see that your definition lists are now incremented\
    \ by four each time.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_115_0.png)\n\n\
    *Figure 94: Our counter now increments by 4*\n\nLikewise, if you change that 4\
    \ to a negative number, then you'll see the numbers next to the **dt** elements\
    \ run backwards.\n\nI'm sure you can think of many more things you can do with\
    \ these—I'll leave that as an exercise for experimentation.\n\n### Calculating\
    \ Values\n\nOne of the biggest problems in CSS over the years has been calculating\
    \ element sizes accurately. It's mostly because of the lack of ability to do simple\
    \ tasks like this that there are so many JavaScript UI frameworks and tools such\
    \ as Sass and Less.\n\nIn CSS3, the standards committee has introduced the `calc()`\
    \ function, and as its name implies, this ultra-useful little gem can calculate\
    \ values for you.\n\nMost of what it can do is really just basic math—it’s what\
    \ you can combine it with that makes it so special.\n\nYou can combine values\
    \ in the **calc** function with percentage-based values: em’s, px’s, pt’s, and\
    \ any other type of value or measurement that CSS understands, and this opens\
    \ up some amazing possibilities.\n\nConsider the following HTML markup:\n\n```html\n\
    <div class=\"header\">\n    <h1>This is the main Header</h1>\n</div>\n<p>This\
    \ is some dummy body text</p>\n```\n\n*Code Listing 70a: HTML markup to demonstrate\
    \ the calc function*\n\nIt’s not uncommon to see this type of pattern in most\
    \ HTML documents, and generally you would mark up the header class so that the\
    \ header has a fixed size that covers the intended document minimum width using\
    \ a percentage value, maybe 75 percent.\n\n```css\nbody\n{\n    background-color:\
    \ aliceblue;\n    font-family: sans-serif;\n}\n\n.header\n{\n    width: 75%;\n\
    \    height: 60px;\n    background-color: steelblue;\n    border: 1px solid black;\n\
    \    color: white;\n}\n```\n\n*Code Listing 70b: Basic body and header rules*\n\
    \nThe basic rules in Code Listing 70b will give you the following:\n\nFixing it\
    \ is quite easy, and rather than repeat the instructions here, I'll just point\
    \ you to [this article](https://example.com) and [this article](https://example.com).\
    \ These two links will give you everything you need to know to solve the problem.\n\
    \nIf this occurs on other servers, then you'll need to refer to the appropriate\
    \ documentation for that server to find out how to add the appropriate mime types."
  mdcn: "\n## 总结\n\n在本章中，我们学习了如何使用 CSS3 的字体功能，如何转换和添加新字体到我们的网页中，同时还了解了一些使用字体时的注意事项。\n\
    \n接下来，我们将探讨生成内容、计数器和计算。\n\n## 第 8 章：生成内容和计算\n\n你已经通过 `:before` 和 `:after` 伪选择器见过生成内容的一些功能；然而，生成内容模块仅凭几条简单的\
    \ CSS 规则就能实现更多功能。\n\n例如，你可以读取父元素的属性值，然后在后续的规则链中使用该值。\n\n你还可以初始化和使用计数器，从而在从列表编号到元素索引等各种场景中使用自动生成的顺序编号。\n\
    \n最后，借助计算模块，你的 CSS 规则实际上可以执行基本数学运算，并精确计算屏幕尺寸、边框宽度以及其他各种有用的度量值——所有这些都无需考虑 JavaScript。\n\
    \n### 计数器\n\n计数器由常规 CSS 规则控制，虽然它们本质上非常简单，但却有相当多的用途。\n\n计数器通过 `counter-reset` CSS\
    \ 规则进行初始化，并通过 `counter-increment` 规则进行递增。\n\n你可以通过 `counter()` 函数获取计数器的值。\n\n\
    假设你有以下 HTML 标记（如果你已经阅读了本书前面的内容，你会认出这是代码清单 58 中的内容）。\n\n```html\n<dl>\n    <dt>HTML\
    \ </dt>\n    <dd>HTML 5 is the markup language used to create documents that are\
    \ published on the internet</dd>\n    <dt>CSS3</dt>\n    <dd>CSS3 is the markup\
    \ language used to add style and colors to documents created using HTML 5</dd>\n\
    \    <dt>HTTP (Hyper Text Transfer protocol)</dt>\n    <dd>HTTP is the mechanism\
    \ by which HTML 5 documents and their associated resources are transported on\
    \ the internet</dd>\n    <dt>WWW (World Wide Web)</dt>\n    <dd>The World Wide\
    \ Web is the collective name for the many hundreds of thousands of HTML 5 documents\
    \ published via the internet</dd>\n    <dt>The Internet</dt>\n    <dd>The internet\
    \ is a massive global computer network, which amongst other things holds the World\
    \ Wide Web</dd>\n</dl>\n```\n\n*代码清单 69a：用于计数器演示的定义列表标记*\n\n如果我们渲染它，将得到以下结果。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_112_0.png)\n\n*图 91：我们准备进行样式的定义列表。*\n\
    \n首先，让我们添加一些默认样式，只是为了让内容看起来更整齐一些。\n\n在你的样式表中添加以下规则。\n\n```css\nbody\n{\n  background-color:\
    \ aliceblue;\n  font-family: sans-serif;\n  font-size: 12px;\n}\n\ndt\n{\n  font-weight:\
    \ bold;\n  font-size: 1.1em;\n  border-bottom: 1px solid grey;\n  margin-bottom:\
    \ 4px;\n  margin-top: 8px;\n  color: grey;\n}\n\ndd\n{\n  font-size: 0.9em;\n\
    \  margin-top: 2px;\n  margin-bottom: 2px;\n  margin-left: 10px;\n}\n```\n\n*代码清单\
    \ 69b：生成内容的默认样式规则*\n\n这里没有特别新的内容，我们为页面设置了默认的字体样式、大小和背景颜色，然后为定义列表项设置了一些默认样式。\n\n\
    输出应该如下所示：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_113_0.png)\n\n然而，如果我们能让每个定义标题都带有编号就好了。\n\
    \n我们当然可以逐个添加，在每个标题前加上相应的数字，但这样做既繁琐又容易出错，而且如果这些定义是从一个事先没有编号的数据库中发布出来的呢？\n\n我们也可以将\
    \ **dl** 元素改为 **ol** 元素，然后将所有内部列表项改为 **li** 元素，但这样我们就不得不使用 nth-child 设置来将每个交替行突出显示为标题。同时还会面临从定义文本中去除编号的问题，只保留标题的编号。\n\
    \n两种方法都可行，但都需要大量的开发和管理工作。CSS 计数器可以通过在我们已有的样式上添加几行小代码来解决这个问题。\n\n首先，让我们在每次遇到 **dl**\
    \ 元素时将计数器重置为 0。将以下代码追加到你现有的样式表中：\n\n```css\ndl\n{\n    counter-reset: dtcount\
    \ 0\n}\n```\n\n*代码清单 69c：重置计数器*\n\n然后我们需要递增计数器，并在 **dt** 元素的内容之前添加它：\n\n```css\n\
    dt:before\n{\n  content: counter(dtcount)\". \";\n  counter-increment: dtcount;\n\
    }\n```\n\n*代码清单 69d：递增并添加计数器*\n\n现在如果你刷新浏览器，你应该会看到每个 **dt** 元素旁边都有一个编号。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_114_0.png)\n\
    \n*图 93：我们的定义列表标题旁边带有编号*\n\n编号会根据列表中 **dt** / **dd** 对的数量递增，并且会正确编号。你也不一定非得使用\
    \ **content:before** 伪选择器；在任何可以使用整数值的地方，你都可以使用 **counter()** 函数来获取计数器的值。这意味着你可以用它来改变颜色、调整字体大小、增加间距以及各种其他操作。\n\
    \n那么如何递减计数器呢？你也可以做到，但并不完全像你想象的那样。\n\n要递减计数器，你仍然使用 **counter-increment** 规则，但使用一个负的偏移量。\n\
    \n计数器递增规则可以接受两个参数：第一个是要更改的计数器名称，第二个是递增的量。\n\n将代码清单 69d 中的代码修改为如下内容：\n\n```css\n\
    dt:before\n{\n  content: counter(dtcount)\". \";\n  counter-increment: dtcount\
    \ 4;\n}\n```\n\n*代码清单 69e：在 69d 的代码中添加了偏移量*\n\n如果你现在渲染它，你会看到定义列表的编号每次递增四。\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_115_0.png)\n\n*图 94：我们的计数器现在每次递增 4*\n\
    \n同样，如果你将 4 改为负数，那么你会看到 **dt** 元素旁边的数字会递减。\n\n我相信你能想到更多可以使用计数器的场景——我将这些留给你去实践和探索。\n\
    \n### 计算值\n\n多年来，CSS 中最大的问题之一就是精确计算元素大小。正是因为缺乏执行这类简单任务的能力，才出现了如此多的 JavaScript\
    \ UI 框架以及 Sass 和 Less 等工具。\n\n在 CSS3 中，标准委员会引入了 `calc()` 函数，顾名思义，这个非常实用的小工具可以为你计算值。\n\
    \n它能做的大多数事情其实只是基本数学运算——真正让它如此特别的是你可以将其与其他功能组合使用。\n\n你可以在 **calc** 函数中将值与基于百分比的值、em、px、pt\
    \ 以及 CSS 能理解的任何其他类型的值或度量单位组合使用，这开启了一些令人惊叹的可能性。\n\n请看以下 HTML 标记：\n\n```html\n<div\
    \ class=\"header\">\n    <h1>This is the main Header</h1>\n</div>\n<p>This is\
    \ some dummy body text</p>\n```\n\n*代码清单 70a：用于演示 calc 函数的 HTML 标记*\n\n在大多数 HTML\
    \ 文档中看到这种模式并不罕见，通常你会将 header 类标记为使用百分比值（可能是 75%）的固定大小来覆盖预期的文档最小宽度。\n\n```css\n\
    body\n{\n    background-color: aliceblue;\n    font-family: sans-serif;\n}\n\n\
    .header\n{\n    width: 75%;\n    height: 60px;\n    background-color: steelblue;\n\
    \    border: 1px solid black;\n    color: white;\n}\n```\n\n*代码清单 70b：基本的 body\
    \ 和 header 规则*\n\n代码清单 70b 中的基本规则将给你以下效果：\n\n修复它非常简单，与其在这里重复说明，我将直接指向[这篇文章](https://example.com)和[这篇文章](https://example.com)。这两个链接将为你提供解决该问题所需的一切知识。\n\
    \n如果此问题发生在其他服务器上，你需要查阅相应服务器的文档以了解如何添加适当的 MIME 类型。\n"
