    \ have .ttf, .eot, .svg, .woff, and .woff2 files; these five extensions are your\
    \ actual font files, and it's these files that you need to copy to your web server\
    \ for your pages to use. I generally put them in a folder called **fonts** in\
    \ the root so I can keep them all together. How you do it is entirely up to you,\
    \ but remember that the CSS styles will need to be able to find them, so you may\
    \ need to put a ..\\ in path names when using them, depending on how you structure\
    \ your websites.\n\nExtract the font files from both zips into a location for\
