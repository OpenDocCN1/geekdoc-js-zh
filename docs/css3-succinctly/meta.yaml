    因此，我将假设读者理解 HTML、它的结构，以及如何创建标准的简单 HTML 标签和元素。如果你不了解，那么我强烈建议你在继续阅读本书之前至少阅读一些关于该主题的背景材料。\n\
    \n然而，为了让事情变得稍微容易一些，以下 HTML 代码可以作为一个非常简化的 HTML 5 标准文档示例。这绝不是一个完整的示例；它的目的是为本书中的其他代码提供一个模板化的起点。\n\
    \n我在本书中展示的所有示例都将假设你使用类似的代码，并将在此基础上进行扩展。\n\n```\n<!doctype html>\n<html>\n<head>\n\
    \    <title>Basic HTML 5 document</title>\n    <link href=\"styles.css\" rel=\"\
    stylesheet\" type=\"text/css\" />\n```\n"
