    of the three values, and plug them all together to make your final color. Easy,
    right?


    Well no, not really, because you either have to understand hex/dec conversion,
    or need some kind of tool on hand to make sense of things.


    This how it was at the start, and this is how it''s always been—at least until
    CSS3 came along.


