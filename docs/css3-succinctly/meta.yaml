  - "[PAGE 66]\n\n**3 x 1 = 3**\n**3 x 2 = 6**\n**3 x 3 = 9**\n**3 x 4 = 12**\n\n\
    And so on…\n\nNow, imagine that the **n** in our **3n** is the multiplicand in\
    \ the second column (the value 0 to 4); you then start to see how n references\
    \ any value in the range.\n\nIf you then treat the result as a static number,\
    \ you end up with the following static sequence.\n\n**0, 3, 6, 9, 12**\n\nLet\
    \ that sink in for a moment.\n\nNow think back to the list of HTML elements in\
    \ Code Listing 55. There are 10 list item children in that list, and if we forget\
    \ about the numbers 0 and 12 in our static list, we have 3, 6 and 9, which could\
    \ all be offsets to select (0 and 12 are not valid items, as they don't exist).\n\
    \nWell, that's exactly what nth-child() does. It uses the algebraic equation passed\
    \ to it to determine exactly which elements in a list it needs to select.\n\n\
    Let's apply the following CSS rule to our list from Code Listing 55:\n\n```\n\
    ul > li:nth-child(3n)\n{\n  color: red;\n}\n```\n\n*Code Listing 57a: nth-child\
    \ CSS rule to select every third element*\n\nWhat will happen is that every third\
    \ element in the list will be affected by the rule.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_66_0.png)\n\
    \n*Figure 49: Our nth-child(3n) rule in action*"
