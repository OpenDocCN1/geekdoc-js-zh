- md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_117_0.png)\n\n*Figure 95: Basic rules\
    \ applied to our header*\n\nBecause we've used a percentage value for the width\
    \ of the header element, it will always be set at 75 percent. That works fine,\
    \ but what if we want to center the header? That's not difficult, either. Add\
    \ the following two lines to the `.header` rule in the basic styles:\n\n```css\n\
    margin-left: auto;\nmargin-right: auto;\n```\n\n*Code Listing 70c: Additional\
    \ rules to center our header*\n\nAs expected, this centers our header.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_118_0.png)\n\
    \nUnfortunately, we now have quite a bit of dead space at each side of the header,\
    \ and because this is a percentage-based measurement, when this gets resized to\
    \ the size of a wide screen monitor, the gaps will look huge, not to mention how\
    \ cramped they might look on a mobile device.\n\nYou may decide to compensate\
    \ by changing the percentage value. So you change it to 95 percent, 100 percent,\
    \ or 98 percent. You might spend quite a few hours adjusting it and then testing\
    \ it in all sorts of different screen sizes and on different devices, but no matter\
    \ how hard you try, you just can't get it to look absolutely uniform on every\
    \ possible device.\n\nIf only you had a way of saying, \"I want my header to always\
    \ be 100 percent in width, but to always have exactly 20 pixels worth of space\
    \ on the left and the right, no matter how small or large my display is.\"\n\n\
    This is exactly where the **calc** function comes into play.\n\nIf you want exactly\
    \ 20 pixels at either side, then the total of that would be 40 pixels. If you\
    \ then centered a 100 percent-width object and subtracted 40 pixels, that would\
    \ give you exactly what you need.\n\nChange the **width** rule in **.header**\
    \ so that it reads as follows:\n\n```css\nwidth: calc(100% - 40px);\n```\n\n*Code\
    \ Listing 70d: Width rule now using calc to work out its width*\n\nWhen you render\
    \ it, you should see the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_119_0.png)\n\
    \n*Figure 97: Our header with 20px on either side*\n\nNow, it renders with 20px\
    \ either side, and it doesn't matter what the width is because the CSS engine\
    \ will always know what 100 percent of the target width is, and so can do the\
    \ math for us automatically.\n\nLike `counter()`, you can use `calc()` anywhere\
    \ you can use a straightforward number. A word of warning, though: not all the\
    \ browsers implement it in all of the properties. From an implementation point\
    \ of view, all the current browsers support it, but not all of them support it\
    \ for things like color values or rotations.\n\nThe best place to check is [Can\
    \ I Use](https://caniuse.com), which will list the current compatibility charts\
    \ for all the new features as they are standardized. One useful trick to know\
    \ is that you can often type something like \"**caniuse calc()**\" or \"**caniuse\
    \ web fonts**\" into a Google search and get an instant link to the compatibility\
    \ chart for the feature you'd like to learn more about.\n\n## Element Attributes\n\
    \nTo round this chapter off, I'm going to introduce the ability to get at an element's\
    \ attribute in order to use it within the rules you're using.\n\nIf you recall,\
    \ earlier in the book I mentioned something called data attributes; one of the\
    \ great things about data attributes is the ability to embed custom attribute\
    \ data in an HTML 5 element and still have it validate.\n\nThe following HTML\
    \ shows how this might be used:\n\n```html\n<div class=\"header\">\n    <h1 data-headersuffix=\"\
    \ (Hello)\">This is the main Header</h1>\n</div>\n<p>This is some dummy body text</p>\n\
    ```\n\n*Code Listing 71a: HTML markup to demonstrate parent attributes*\n\nIf\
    \ you render this, you'll get exactly the same output as seen in Figure 97 (assuming\
    \ you still have the same style rules present). If you don't have the same styles\
    \ present or have started a new file, then you'll just get a plain black text\
    \ on a white background.\n\nThe point here is that these extra data attributes\
    \ will have no meaning on anything in the HTML or the CSS, and will be silently\
    \ ignored.\n\nThis really comes in handy—especially for a lot of the JavaScript\
    \ libraries available—because it means that an HTML developer can add custom attributes\
    \ to a page, which the JavaScript code then later processes in some way. The Bootstrap\
    \ UI framework makes extensive use of this facility so that the HTML developer\
    \ creating pages never needs to know any JavaScript. He or she just has to describe\
    \ what the intention is, and the Bootstrap library takes care of the rest.\n\n\
    Make sure your style file is the same as Code Listing 70b, and that you're using\
    \ the HTML code in Code Listing 71a. Render the HTML in your browser and make\
    \ sure your output looks like Figure 95.\n\nNow add the following extension rule\
    \ to the style sheet (you should see the header text change to blue):\n\n```css\n\
    .header h1:after\n{\n    content: \" (Hiya)\";\n}\n```\n\n*Code Listing 71b: Extended\
    \ header rule that puts “(Hiya)” after the header text*\n\nRender this and make\
    \ sure that the header text now has “(Hiya)” appended to it. If it does, now change\
    \ the rule so that it looks for the data attribute named **headersuffix** and\
    \ uses the parameter from that as the source of its data.\n\n```css\n.header h1\n\
    {\n    color: attr(data-headersuffix);\n}\n```\n\n*Code Listing 71c: Extended\
    \ header rule that uses the data attribute to set the text*\n\nThe result should\
    \ be that the header text is now extended using the contents of the custom data\
    \ attribute present on the **h1** element that the selector targets.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_121_0.png)\n\
    \n*Figure 98: Our header with the text from the data attribute*\n\nThere is, unfortunately,\
    \ some bad news. If you read the spec closely, you'll see that the ability to\
    \ read parent attributes and place them into generated content fields was actually\
    \ defined in CSS2.1, and the ability to use the `attr()` function to set properties,\
    \ such as color, size, etc., was defined in CSS3. As a result, all major browsers\
    \ can use `attr()` to set content in a `:before` or `:after` pseudo selector,\
    \ but none of them as of yet have implemented them in a general property setting\
    \ scenario.\n\nThis is not to say they won't; as many of you might know, the most\
    \ popular features on the W3C standards track are the ones that developers request,\
    \ and `attr()` is not getting much attention at the moment. There will come a\
    \ day when this is finalized and the browser producers feel it's getting enough\
    \ attention to actually finish implementing it. For now, it's only usable for\
    \ content generation, despite what the documentation says.\n\nIt is useful for\
    \ one scenario, however (and one I've previously used it for), and that's to append\
    \ greetings onto headers and welcome banners that are localized for a given locale.\
    \ Because the value is taken from an attribute, changing that attribute is very\
    \ easy to do in JavaScript, as there are native calls to access data attributes.\n\
    \nAnother place it becomes useful is in printing. If you have a style sheet that's\
    \ used only when a page is printed, you can use this to grab the contents of an\
    \ `href` from an anchor element, then print it out after the anchor tag. Doing\
    \ this means that pages with links printed to a PDF or onto paper are still visible,\
    \ while the ones on screen remain clickable.\n\n## Summary\n\nIn this chapter\
    \ we've learned how to generate arbitrary content using nothing more than CSS\
    \ rules, a task that previously required a large amount of JavaScript to get right.\
    \ We've learned a bit more about how data attributes work and how we might use\
    \ them to hold custom content.\n\nIn the next chapter we'll do a roundup of some\
    \ of the things we didn't have space to cover, and a few of the smaller, new rules.\n\
    \n# Chapter 9 The Mixed Bag of Tricks\n\nAnd so we come to the last chapter of\
    \ the book.\n\nIt's always sad when you reach the end of a book like this, especially\
    \ on a subject as diverse as CSS3, but this is not the end. In fact, we couldn't\
    \ be further away from the end—we're still just beginning this adventure.\n\n\
    What I've shown you so far is only the tip of the iceberg. If you're in any doubt,\
    \ take a look at the main CSS index on the [Mozilla Developer Network](https://developer.mozilla.org/).\
    \ I haven't even begun to explore CSS Layout or CSS Animation yet; both of these\
    \ topics would easily take up a full book all of their own, as would an exhaustive\
    \ rule/property followed by description list style text.\n\nHowever, books in\
    \ the *Succinctly* series are designed to be compact and easy-to-read with just\
    \ enough information to get you in the right direction, and it's always a difficult\
    \ decision to decide what to leave out.\n\nAs with any new technology, the best\
    \ way to learn it is to play with it. Playing is an invaluable skill and learning\
    \ tool that often gets lost in the modern-day IT industry with tight deadlines\
    \ and tricked-out release schedules. What I hope I've presented here is enough\
    \ information to at least prevent you from having to waste time understanding\
    \ what it is you're playing with.\n\nFor the rest of this chapter, I'm going to\
    \ round things off with a few notable mentions of easy-to-understand CSS3 functionality\
    \ that I felt deserve a mention.\n\n## CSS Columns\n\nWe've all been there, tearing\
    \ our hair out trying to get the column widths just perfect so we can get a nice\
    \ and balanced multiple-column layout in our page design.\n\nHours are spent tweaking,\
    \ measuring, and tweaking again until we get an almost-perfect combination of\
    \ rules and content. Then someone decides to drop an image in the sidebar that\
    \ pushes things out by 1 pixel, and BAM! The entire layout crumbles into a smoldering\
    \ heap.\n\nWell this should no longer affect you, thanks to CSS columns.\n\nCreate\
    \ a **div** with a very long paragraph of text, something like the following:\n\
    \n```html\n<div class=\"container\">\n    <p>Lorem ipsum dolor sit amet, consectetur\
    \ adipiscing elit. Maecenas pellentesque urna nec eros ornare, ac tristique diam\
    \ porta. Donec fermentum velit eget dignissim condimentum. Sed rutrum libero sit\
    \ amet enim viverra tristique. Mauris ultricies ornare arcu non adipiscing. Sed\
    \ id ipsum vitae libero facilisis pulvinar id nec lacus. Ut lobortis neque et\
    \ luctus mattis. Morbi nunc diam, elementum rutrum tellus non, viverra mattis\
    \ diam. Vestibulum sed arcu tincidunt, auctor ligula ut, feugiat nisi. Phasellus\
    \ adipiscing eros ut iaculis sagittis. Sed</p>\n</div>\n```"
  mdcn: "\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_117_0.png)\n\n*图 95：应用到页眉的基本规则*\n\
    \n由于我们为 header 元素的宽度使用了百分比值，它将始终被设置为 75%。这工作得很好，但如果我们想要居中显示页眉呢？这也不难。将以下两行添加到 basic\
    \ 样式中的 `.header` 规则：\n\n```css\nmargin-left: auto;\nmargin-right: auto;\n```\n\
    \n*代码清单 70c：用于居中页眉的附加规则*\n\n不出所料，这会使我们的页眉居中。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_118_0.png)\n\
    \n不幸的是，现在我们页眉两侧都有相当多的空白区域，而且由于这是基于百分比的度量，当页面调整为宽屏显示器的大小时，这些间隙看起来会非常大，更不用说在移动设备上它们可能会显得多么拥挤。\n\
    \n你可能会决定通过更改百分比值来弥补。于是你将其改为 95%、100% 或 98%。你可能会花费数小时调整它，然后在各种不同的屏幕尺寸和不同设备上进行测试，但无论你多么努力，都无法让它在每台可能的设备上看起来完全一致。\n\
    \n要是有一种方法能让你说：\"我希望我的页眉宽度始终是 100%，但无论我的显示器有多小或多大，左右两侧都始终恰好有 20 像素的间距。\"\n\n这正是\
    \ **calc** 函数大显身手的地方。\n\n如果你希望两侧都恰好有 20 像素，那么总共就是 40 像素。如果你将一个 100% 宽度的对象居中，然后减去\
    \ 40 像素，这就能得到你恰好需要的效果。\n\n将 **.header** 中的 **width** 规则更改如下：\n\n```css\nwidth:\
    \ calc(100% - 40px);\n```\n\n*代码清单 70d：现在使用 calc 来计算宽度的宽度规则*\n\n当你渲染它时，你应该看到以下内容：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_119_0.png)\n\n*图 97：两侧各有 20px 间距的页眉*\n\
    \n现在，它会在两侧都留出 20px 的间距，而且宽度是多少并不重要，因为 CSS 引擎始终知道目标宽度的 100% 是多少，因此可以自动为我们进行计算。\n\
    \n与 `counter()` 类似，你可以在任何可以使用简单数字的地方使用 `calc()`。不过需要提醒的是：**并非所有浏览器都支持在所有属性中使用它**。从实现角度来看，所有当前浏览器都支持它，但并非所有浏览器都支持将其用于颜色值或旋转等属性。\n\
    \n最佳的查询去处是 [Can I Use](https://caniuse.com)，该网站会列出所有新特性标准化后的当前兼容性图表。一个有用的小技巧是，你通常可以在\
    \ Google 搜索中输入类似 \"**caniuse calc()**\" 或 \"**caniuse web fonts**\" 的内容，就能立即获得你想了解更多信息的特性的兼容性图表链接。\n\
    \n## 元素属性\n\n为了给本章收尾，我将介绍获取元素属性的能力，以便在你使用的规则中使用它。\n\n如果你还记得，我在本书前面提到过一种叫做 data\
    \ 属性的东西；data 属性的一个巨大优点是能够向 HTML 5 元素中嵌入自定义属性数据，并且仍然能使其通过验证。\n\n以下 HTML 展示了这可以如何使用：\n\
    \n```html\n<div class=\"header\">\n    <h1 data-headersuffix=\" (Hello)\">This\
    \ is the main Header</h1>\n</div>\n<p>This is some dummy body text</p>\n```\n\n\
    *代码清单 71a：用于演示父属性的 HTML 标记*\n\n如果你渲染这个，你将获得与图 97 完全相同的输出（假设你仍然保留了相同的样式规则）。如果你没有保留相同的样式，或者已经开始了一个新文件，那么你只会得到白底黑字的纯文本。\n\
    \n这里的要点在于，这些额外的 data 属性对 HTML 或 CSS 中的任何内容都没有意义，会被静默忽略。\n\n这真的非常有用——尤其对于许多可用的\
    \ JavaScript 库而言——因为它意味着 HTML 开发者可以向页面添加自定义属性，然后 JavaScript 代码会以某种方式处理它们。Bootstrap\
    \ UI 框架就广泛利用了这种功能，这样创建页面的 HTML 开发者完全不需要了解任何 JavaScript。他或她只需要描述意图是什么，Bootstrap\
    \ 库就会处理其余的一切。\n\n确保你的样式文件与代码清单 70b 相同，并且你使用的是代码清单 71a 中的 HTML 代码。在你的浏览器中渲染该 HTML，并确保你的输出看起来像图\
    \ 95。\n\n现在向样式表中添加以下扩展规则（你应该会看到页眉文本变为蓝色）：\n\n```css\n.header h1:after\n{\n   \
    \ content: \" (Hiya)\";\n}\n```\n\n*代码清单 71b：在页眉文本后添加 \"(Hiya)\" 的扩展页眉规则*\n\n\
    渲染这个并确保页眉文本现在已附加了 \"(Hiya)\"。如果是这样，现在将规则更改，使其查找名为 **headersuffix** 的 data 属性，并使用其中的参数作为其数据来源。\n\
    \n```css\n.header h1\n{\n    color: attr(data-headersuffix);\n}\n```\n\n*代码清单\
    \ 71c：使用 data 属性来设置文本的扩展页眉规则*\n\n结果应该是页眉文本现在使用选择器所针对的 **h1** 元素上存在的自定义 data 属性的内容来扩展。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_121_0.png)\n\n*图 98：使用 data 属性中文本的页眉*\n\
    \n不幸的是，有一些坏消息。如果你仔细阅读规范，你会发现读取父属性并将其放入生成内容字段的能力实际上是在 CSS2.1 中定义的，而使用 `attr()`\
    \ 函数来设置属性（如颜色、大小等）的能力是在 CSS3 中定义的。因此，所有主流浏览器都可以使用 `attr()` 在 `:before` 或 `:after`\
    \ 伪选择器中设置内容，但截至目前，还没有浏览器在通用属性设置场景中实现这一功能。\n\n这并不是说它们不会实现；正如你们许多人可能知道的，W3C 标准轨道上最受欢迎的特性就是开发者所要求的那些，而\
    \ `attr()` 目前并没有受到太多关注。总有一天这会最终确定，浏览器厂商会觉得它受到了足够的关注，从而真正完成实现。目前，尽管文档中有所说明，但它只能用于内容生成。\n\
    \n然而，它在一种场景下非常有用（而且我以前曾经使用过），那就是向页眉和欢迎横幅附加为特定区域设置的本地化问候语。由于该值取自属性，在 JavaScript\
    \ 中更改该属性非常容易，因为有访问 data 属性的原生调用。\n\n另一个它变得有用的地方是在打印中。如果你有一个仅在打印页面时使用的样式表，你可以使用它来获取锚点元素的\
    \ `href` 内容，然后将其打印在锚点标签之后。这样做意味着带有链接的页面打印到 PDF 或纸张上时仍然可见，而屏幕上的页面仍然保持可点击状态。\n\n\
    ## 小结\n\n在本章中，我们学习了如何使用纯粹的 CSS 规则生成任意内容，这是一项以前需要大量 JavaScript 才能正确完成的任务。我们进一步了解\
    \ data 属性的工作原理，以及如何使用它们来保存自定义内容。\n\n在下一章中，我们将对一些没有空间涵盖的内容进行汇总，以及一些较小的新规则。\n\n\
    # 第 9 章 技巧大杂烩\n\n于是我们来到了本书的最后一章。\n\n当你读到这样的书的结尾时，总是令人伤感的，尤其是在像 CSS3 这样丰富多样的主题上，但这并不是结束。事实上，我们离结束还差得远——我们仍然只是这场冒险的开端。\n\
    \n到目前为止，我向你展示的只是冰山一角。如果你有任何疑问，请查看 [Mozilla 开发者网络](https://developer.mozilla.org/)\
    \ 上的主要 CSS 索引。我甚至还没有开始探索 CSS 布局或 CSS 动画；这两个主题中的任何一个都足以单独写满一整本书，详尽的规则/属性后跟描述列表风格的文本也是如此。\n\
    \n然而，*Succinctly* 系列的书籍设计初衷是紧凑、易读，只提供足够让你朝着正确方向前进的信息，而决定省略什么内容总是一个艰难的决定。\n\n与任何新技术一样，学习它的最佳方式是动手实践。玩耍是一种宝贵的技能和学习工具，在现代\
    \ IT 行业中，面对紧迫的截止日期和紧张的发布计划，这种能力往往会被遗忘。我希望我在这里提供的信息至少能防止你浪费时间去了解你正在实践的是什么。\n\n\
    在本章剩余的部分，我将用几个值得注意的、易于理解的 CSS3 功能来做总结，这些功能我觉得值得一提。\n\n## CSS 多列布局\n\n我们都曾经历过这样的场景：抓狂地试图让列宽恰到好处，以便在页面设计中获得一个美观平衡的多列布局。\n\
    \n数小时花费在调整、测量和再调整上，直到我们得到一个近乎完美的规则和内容的组合。然后有人决定在侧边栏中放入一张图片，把内容推出了 1 像素，砰！整个布局崩溃成一堆冒烟的废墟。\n\
    \n多亏了 CSS 多列布局，这应该不再会影响你了。\n\n创建一个包含很长段落的 **div**，类似下面这样：\n\n```html\n<div class=\"\
