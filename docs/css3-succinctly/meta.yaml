    \n## 关于浏览器兼容性的简要说明\n\n在继续之前，我们需要讨论的最后一件事是浏览器兼容性。\n\n任何从事过 HTML 前端驱动网页开发的人，都深知让代码在所有浏览器上呈现一致的痛苦。\n\
