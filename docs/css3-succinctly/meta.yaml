  - "[PAGE 73]\n\nThe **nth-of-type** (and for that matter **first-of-type** and **last-of-type**)\
    \ only considers targeted elements as specified to be candidates for selection.\n\
    \nIn a previous example we saw some markup that might be used for a news page;\
    \ if you were to use **nth-of-type** on that, you'd get the flexibility of selecting\
    \ things as you would with **nth-child**, but you would be able to tell the CSS\
    \ selector engine to ONLY apply that to paragraph elements found in the article.\n\
    \nYou could, for example, easily style all the even numbered paragraphs a different\
    \ color to the odd numbered ones, no matter how many paragraph elements were in\
    \ each section or how many other elements such as headers might be present.\n\n\
    There are still more pseudo selectors to be covered, and still more that can be\
    \ done by chaining them all together; however, the potential is far beyond anything\
    \ we have space here to describe.\n\nRemember too, that generic rules always come\
    \ before specific rules.\n\nIf you define:\n\n```\np:nth-child(odd)\n{\n    color:\
    \ blue;\n}\n\np\n{\n    color: green;\n}\n```\n\n*Code Listing 60: Specific CSS\
    \ rule first*\n\nYou'll find that all your paragraph elements will be green. This\
    \ is because the later rule targets more that the former rule, so any changes\
    \ that the former rule applies will be over-written by the latter one.\n\nReversing\
    \ the order of the two rules will fix this, so the generic one changes everything\
    \ green first, then the specific one targets odd-numbered elements and changes\
    \ them from green to blue.\n\n> *Note: At the time of writing, and with the version\
    \ of Chrome (and other browsers) being used, the previous description held true\
    \ in that all <p> elements would indeed have turned green. However, two months\
    \ later, an update has been made to the specifications, which now means that the\
    \ nth-child rule has specify precedence over the standard element selector in\
    \ the example. This means that the previous example now produces exactly the same\
    \ result, no matter which order they are in. This does not mean that you should\
    \ suddenly ignore rule order; there are still plenty of places where this is obeyed.\
    \ In this, case however, it's a perfect example of the fact that many of these\
    \ features are still in a state of flux, so as always, choose wisely when deciding\
    \ which features to use and why.*"
- md: " If you have any problems with styles not being applied when and where you\
    \ expect them to, the first thing to always check is the order of specificity.\n\
    \n## Summary\n\nIn this chapter we've taken quite a whirlwind (and brain-exercising)\
    \ tour of the new pseudo selectors available in CSS3. You should by now have a\
    \ very good idea of how to target and select the elements you need to select,\
    \ and the methods by which you can do so.\n\nWe've learned a huge amount in this\
    \ chapter, and learned a few clever tricks along the way. Now that the hard stuff\
    \ is behind us, it's time to sit back and enjoy the easy life.\n\nStarting in\
    \ the next chapter, we'll be taking a look at what most of you have been waiting\
    \ for: the eye candy. We'll start by looking at everyone's favorites: rounded\
    \ corners, drop shadows, and gradient fills.\n\n## Chapter 5 servo\n\nOne thing\
    \ that CSS3 has in abundance are ways to make things look pretty.\n\nFor developers\
    \ (especially those who spend most of their time working server side), they might\
    \ be wondering what all the fuss is about; we're hired to produce software, and\
    \ that's exactly what we're doing.\n\nUnfortunately, on the client side and in\
    \ the browser, things don't quite work that way. Those of our colleagues that\
    \ don't understand what we do or how we do it love to see things that are flashy,\
    \ colorful, and sparkly.\n\nWhen they can see this type of progress, they gauge\
    \ that visual feedback as proof that there is work being done on the application.\n\
    \nChief among the things that the non-IT crowd likes to see are the staple eye\
    \ candy diet of drop shadows and rounded corners.\n\nI'm sure if you've done any\
    \ serious CSS or design work in the past, you'll be more than familiar with the\
    \ difficulty of having to use Photoshop to create partially-transparent PNG graphic\
    \ files, which you then had to line up around the edge of a carefully placed div\
    \ element.\n\nIf you were off by even so much as a pixel, you'd often have to\
    \ do it all again from scratch, measuring things one pixel at a time and restricting\
    \ page layouts to fixed sizes so things didn't break afterwards.\n\nIf you're\
    \ new to this game, then find any veteran of the web development industry and\
    \ I'm sure that they'll have more than a few horror stories to tell you.\n\nCSS3\
    \ solves all of this by adding the ability to define rules that state how rounded\
    \ a corner should be now, and by allowing you to describe how a drop shadow should\
    \ look. The CSS3 engine will then apply those instructions automatically to your\
    \ HTML markup based on the selector rules you provide and workout where everything\
    \ needs to be.\n\n## Rounded Corners\n\nThe web is square—or at least it was until\
    \ very recently.\n\nUntil CSS3 came along, all we had were boxes with sharp edges.\
    \ Div elements were always square and parallel, tables were square and parallel,\
    \ and we couldn't make things look a little softer and friendlier (well at least\
    \ not without a lot of image hacks).\n\nTo change this, CSS3 introduced the border-radius\
    \ property on all block elements that can use a border.\n\nUsing it is simple.\n\
    \nGiven the following HTML markup:\n\n```\n<div class=\"niceDiv\">\n    <p>This\
    \ is a nice div with no sharp corners</p>\n</div>\n```\n\n*Code Listing 61a: HTML\
    \ markup to demo border radius*\n\nAnd this CSS rule:\n\n```\n.niceDiv\n{\n  width:\
    \ 100px;\n  height: 100px;\n  background-color: beige;\n  padding: 4px;\n  border:\
    \ 1px solid black;\n  border-radius: 5px;\n}\n```\n\n*Code Listing 61b: CSS rule\
    \ to give rounded corners to the HTML in 51a*\n\nWe get a very nice looking `div`\
    \ element rendered in our browser:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_76_0.png)\n\
    \n*Figure 58: Div with rounded corners*\n\nIn the rule in Code Listing 61b, we've\
    \ used the general default for border radius and just specified one value. When\
    \ you define the rule this way, the same value is used for all four corners, so\
    \ as you can see in Figure 58, each corner looks the same.\n\nThe value specified\
    \ is how steep the angle of the curve will be; in our case, we've used 5 pixels.\
    \ If you change it to 25 pixels, you should get something like Figure 59:\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_77_0.png)\n\n*Figure 59: Div with 25\
    \ pixel rounded corners*\n\nBecause each corner is a quarter, and a quarter of\
    \ a circle is 90 degrees, if we change the value to 90 pixels, we get a perfectly\
    \ round circle.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_77_1.png)\n\n*Figure\
    \ 60: Div with 90-pixel, rounded corners*\n\nWe've used the one value format in\
    \ the demos above, but if you wish, you can also specify all four values (one\
    \ for each corner), change the **border-radius** line in Code Listing 61b so that\
    \ it looks like the following:\n\n```\nborder-radius: 5px 10px 15px 20px;\n```\n\
    \n*Code Listing 61c: Altered border radius line for Code Listing 61b*\n\nWhen\
    \ rendered, you should get a `div` with four different-sized corners:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_78_0.png)\n\
    \n*Figure 61: Div with four different size corners*\n\nThe first value is the\
    \ top-left corner, followed by the top-right corner, then the bottom-right corner,\
    \ and finally the bottom-left corner.\n\nIf you wish to, you can also use four\
    \ different rules and write out the size specifications as follows:\n\n```\nborder-top-left-radius:\
    \ 5px;\nborder-top-right-radius: 10px;\nborder-bottom-right-radius: 15px;\nborder-bottom-left-radius:\
    \ 20px;\n```\n\n*Code Listing 61d: The changes from Code Listing 61c written out*\n\
    \nHow you choose to do it is entirely up to you; some people like the verbosity\
    \ of doing things the long way, and to be honest, I find that during development\
    \ it helps maintain the code. However, when you ship to production, you really\
    \ want to make these things as small as possible.\n\nA good CSS squisher is a\
    \ must for optimizing your style files, especially if you do use the long form\
    \ during development.\n\n> **Note: Minifying CSS**—Minifying is the process of\
    \ making a file smaller than it is without losing any of its original intent.\
    \ Unlike a compressed or zip file, a minified file still operates in the manner\
    \ that it was originally intended—it's just become a lot smaller and more compact.\
    \ Having a good minifier to squash your files down is a must for web development.\
    \ One of the biggest speed-ups you can have when your site is being loaded, is\
    \ for your styles, code, markup, and images to be as small as possible and as\
    \ few as possible.\n\nThere a plethora of tools available to help you do this.\
    \ A good place to start is with the [Grunt Task Runner](http://gruntjs.com/).\
    \ Grunt has a large number of modules for squashing CSS, JavaScript, images, and\
    \ even HTML, allowing you to shave off precious bytes everywhere you can. Knowing\
    \ how to use these tools is a very important skill for any web developer.\n\n\
    You don't just have to give one angle for each corner either. If you do, then\
    \ the same angle will be applied on both sides, giving you a uniform and equal\
    \ circle-based curve.\n\nIf you specify two values on each corner, you then get\
    \ to use an ellipse to shape the border's curve radius. Doing this gives you some\
    \ interesting possibilities.\n\nChange your border radius rules to read as follows:\n\
    \n```\nborder-top-left-radius: 50px 15px;\nborder-top-right-radius: 50px 15px;\n\
    border-bottom-right-radius: 15px 50px;\nborder-bottom-left-radius: 15px 50px;\n\
    ```\n\n*Code Listing 61: Border Radius rules extended to show ellipse-based curves*\n\
    \nYou should end up with something that looks like Figure 62:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_79_0.png)\n\
    \n*Figure 62: Our div with ellipse-based corners*\n\n## Drop Shadows\n\nCreating\
    \ drop shadows is another easy bit of eye candy to master, and it can produce\
    \ some interesting effects.\n\nDrop shadows are created by using the box-shadow\
    \ rule, which takes four integer measurements and a color value.\n\nOf the four\
    \ measurements that are provided, only the first two are required; the remaining\
    \ two will default to browser defaults if left out.\n\nThe first two measurements\
    \ are the offset x and offset y values, which as the names suggest, set the distance\
    \ from the element that the shadow protrudes. If positive values are supplied,\
    \ then the shadow protrudes from the bottom right; if negative values are used,\
    \ the shadow protrudes from the top left. To get the shadow on other corners,\
    \ you mix positive and negative offsets as required.\n\nCreate an HTML 5 document\
    \ and add the following markup (or reuse the code from the previous section on\
    \ border radius, but repeat it four times):\n\n```\n<div class=\"niceDiv\">\n\
    \    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n```\n\n*Code Listing\
    \ 62a: HTML markup to demo drop shadow*\n\nCreate the following style rule as\
    \ a basis for the rest of this section:\n\n```\n.niceDiv\n{\n    width: 100px;\n\
    \    height: 100px;\n    background-color: beige;\n    padding: 4px;\n    border:\
    \ 1px solid black;\n    display: inline-block;\n    margin: 15px;\n}\n```\n\n\
    *Code Listing 62b: CSS rule to style the HTML in 62a*\n\nThis will give us the\
    \ default beige div you saw in the last section, with no additional styling.\n\
    \n> Note: You've seen many instances so far where rules cascade down from less-specific\
    \ rules above them. This is one of CSS3's (and previous versions) greatest features,\
    \ which I've not gone into too much detail about. In the previous section we added\
    \ the border radius directly to the 'niceDiv' rule; in this section I'm going\
    \ to start using cascading"
  mdcn: "\n如果你遇到样式没有在预期时间、预期位置生效的问题，首先要检查的是**特异性顺序**。\n\n## 总结\n\n在本章中，我们快速（且烧脑地）浏览了\
