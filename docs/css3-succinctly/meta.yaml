    }\n\ninput[type=number]:out-of-range\n{\n  background-color: salmon;\n}\n```\n\
    \nCode Listing 47b: Styles for our number range form in Listing 47a\n\nWhen we\
    \ render the form, we'll initially see it show using the out-of-range color, due\
    \ to the fact that it has no value in it.\n\nIf we then start entering values,\
    \ we should see the color change depending on what value we enter, in range or\
    \ out."
- md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_0.png)\nFigure 34: The number range\
    \ form just after loading\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_1.png)\n\
    Figure 35: The number range form with an invalid value\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_2.png)\n\
    Figure 36: The number range form with a valid value\n\n## :empty\n\nThe `empty`\
    \ pseudo selector might at first seem like it's used when an element value is\
    \ empty, but it's not; it's used when the inner contents of an HTML element is\
    \ empty. Consider the following HTML:\n\n```\n<div class=\"mydiv\"></div>\n```\n\
    Code Listing 48a: An empty div element\n\nThe `div` in Code Listing 48a is empty—it's\
    \ devoid of any contents whatsoever between the opening and closing tags that\
    \ surround it.\n\nIf we were now to apply a rule such as the following:\n\n```\n\
    .mydiv:empty\n{\n    /* rules go here */\n}\n```\nCode Listing 48b: CSS rule for\
    \ empty pseudo selector\n\nAny style rules defined in the CSS would be applied\
    \ to it. However, as there are actually no contents, then applying rules that\
    \ make color changes is pretty much redundant, unless the parent element already\
    \ has a rule that shows itself with a fixed size and border.\n\nThe `empty` pseudo\
    \ element comes into handy when you want to remove empty elements from display.\
    \ For example, let's imagine you had a message count on the end of a tab in your\
    \ user interface. If that count was 0 or had no value, then you wouldn't want\
    \ an empty, red circle showing.\n\nIn this case, you'd style your red badge in\
    \ a separate rule, and then you'd style your empty rule something like the following:\n\
    \n```\n.mydiv:empty\n{\n    display: none;\n}\n```\nCode Listing 48c: CSS rule\
    \ to make an empty element vanish from display\n\nBy defining the `empty` selector\
    \ using no display, all you need to do to make the count disappear from the display\
    \ is to make sure there's nothing at all between the opening and closing tags.\n\
    \nYou might notice that I'm wording things as \"nothing at all,\" and that's deliberate.\
    \ When we say that the `empty` selector matches an empty tag, we mean 100 percent\
    \ empty. A space might look empty to us, but to the CSS selector engine, it's\
    \ classed as content, as is splitting an empty tag over two lines.\n\nThis can\
    \ get quite frustrating when you're trying to track down why an element you're\
    \ sure should vanish from display, does indeed not vanish from the display. I\
    \ know firsthand how much hair-pulling this causes.\n\nIf there is anything—anything\
    \ at all—in between an opening and closing tag, then the empty selector will NOT\
    \ match. It works best with spans and divs that form small containers whose contents\
    \ are built and removed using JavaScript.\n\nBecause of the way this selector\
    \ works visually, I'm not going to provide a screen shot. If you construct a simple\
    \ `div` tag and apply the rule in Code Listing 48c to it, then manually add or\
    \ remove contents using your editor, you'll soon see how it works.\n\n## :checked\n\
    \nThe `checked` pseudo selector is used when dealing with checkbox and radio elements.\n\
    \nThe premise is simple: if the element is checked or selected, then this pseudo\
    \ rule will be applied; otherwise, it won't.\n\nLet's alter our form, this time\
    \ to show a couple of checkboxes and radio buttons, as shown in Code Listing 49:\n\
    \n```\n<form action=\"#\" method=\"post\">\n    <label>Check box 1<input type=\"\
    checkbox\" /></label><br />\n    <label>Check box 2<input type=\"checkbox\" /></label><br\
    \ />\n    <label>Check box 3<input type=\"checkbox\" /></label><br />\n    <label>Check\
    \ box 4<input type=\"checkbox\" /></label><br />\n    <label>Radio Button 1<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 2<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 3<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 4<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n</form>\n```\n*Code Listing\
    \ 49: Simple form of check boxes and radio buttons*\n\nRendering this should give\
    \ us a fairly straightforward bunch of controls.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_55_0.png)\n\
    Figure 37: Form showing simple checkbox and radio controls\n\nSince checkboxes\
    \ and radio buttons don't change color, we'll use a slightly different tactic\
    \ for this demonstration, and change the size of the controls. Add the following\
    \ rules to your style sheet:\n\n```\ninput[type=\"checkbox\"], input[type=\"radio\"\
    ]\n{\n  width: 20px;\n  height: 20px;\n}\ninput[type=\"checkbox\"]:checked, input[type=\"\
    radio\"]:checked\n{\n  width: 25px;\n  height: 25px;\n}\n```\nCode Listing 50:\
    \ CSS Styles to demonstrate using the checked pseudo selector\n\nIf you render\
    \ the form now, and check and uncheck some of the controls, you should see a small\
    \ size variation on the items that are checked.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_56_0.png)\n\
    Figure 38: Our check boxes and radio buttons changing size\n\nYou might be wondering\
    \ why you might want to use this pseudo selector if it's difficult to change the\
    \ properties such as color on a checkbox.\n\nIt's not until you start to think\
    \ about combining it with adjacency selectors that it starts to make sense as\
    \ to how you might want to use this. Create a line in your form in Code Listing\
    \ 49 that looks like the following:\n\n```\n<input type=\"checkbox\" /><span class=\"\
    checkboxlabel\">This is my check box</span>\n```\nCode Listing 51a: Line to add\
    \ to previous form\n\nThen, add the following CSS rule:\n\n```\ninput[type=\"\
    checkbox\"]:checked + span.checkboxlabel\n{\n    color: red;\n}\n```\n*Code Listing\
    \ 51b: Rule to style the line in Code Listing 51a*\n\nYou should find that when\
    \ you render the document, checking or unchecking the checkbox will make no changes\
    \ to the checkbox itself, but it will change the text color of the span following\
    \ it.\n\nIt does this because we've told the CSS engine that for any input element\
    \ that has a type attribute equal to **checkbox**, look at the adjacent element\
    \ and check to see if it's a span, and has a class of **checkboxlabel**. If it\
    \ does, then change the color of that span element to red.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_57_0.png)\n\
    \nUsing checked selectors like this is the method used by UI toolkits such as\
    \ Foundation and Bootstrap to produce toggle buttons and custom radio and check\
    \ groups made from lists of icons.\n\nIf you're looking to create custom check\
    \ boxes, then you simply need to combine this pattern with pseudo elements such\
    \ as before and after to add/remove content dynamically in your markup.\n\n##\
    \ :before and :after\n\nBefore CSS3 came along, if you wanted to add or remove\
    \ elements and content dynamically, you had to resort to JavaScript, or make the\
    \ changes server side and redraw the document fragment using something like an\
    \ Ajax call.\n\n> **Note:** Ajax is not something we'll be covering in this book,\
    \ as it's deeply tied in with JavaScript and is a quite complex subject. In general,\
    \ however, an Ajax call is the process of asking JavaScript to make a partial\
    \ request to the web server in order to get only a small bit of content. It's\
    \ typically used as a means to get small chunks of data and insert them into a\
    \ webpage as needed, rather than downloading the entire page in one request.\n\
    \nWith the **before** and **after** pseudo selectors, we can add and remove content\
    \ in our HTML elements without ever touching a single line of code, and have it\
    \ all driven using pure CSS rules.\n\nStarting with a simple example, let's imagine\
    \ we have the following line in our HTML markup:\n\n```\n<span class=\"bracketedLabel\"\
    >This is a bracketed Label</span>\n```\n*Code Listing 52a: Simple span to demonstrate\
    \ before and after selectors*\n\nThere's nothing at all special about this label;\
    \ if we render it, we just get a simple output.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_58_0.png)\n\
    Figure 40: Output from Code Listing 52a\n\nAs the name suggests, we'd like any\
    \ label with this class to have square brackets surrounding it, but we don't want\
    \ to go and find all occurrences to add them manually.\n\nSo, we can add the following\
    \ CSS rules:\n\n```\n.bracketedLabel\n{\n    color: green;\n}\n.bracketedLabel:before\n\
    {\n    content: '[';\n    color: red;\n}\n.bracketedLabel:after\n{\n    content:\
    \ ']';\n}\n```"
  mdcn: "\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_0.png)\n图 34：刚加载后的数字范围表单\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_1.png)\n图 35：包含无效值的数字范围表单\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_53_2.png)\n\
    图 36：包含有效值的数字范围表单\n\n## :empty\n\n`empty` 伪选择器初看之下似乎用于元素值为空的情况，但事实并非如此；它是用于 HTML\
    \ 元素的内部内容为空的情况。请看以下 HTML：\n\n```\n<div class=\"mydiv\"></div>\n```\n代码清单 48a：一个空的\
    \ div 元素\n\n代码清单 48a 中的 `div` 是空的——它完全没有任何内容，位于开始和结束标签之间。\n\n如果我们现在应用如下规则：\n\n\
    ```\n.mydiv:empty\n{\n    /* 规则写在这里 */\n}\n```\n代码清单 48b：用于 empty 伪选择器的 CSS 规则\n\
    \nCSS 中定义的任何样式规则都会应用到它上面。然而，由于实际上没有任何内容，应用改变颜色等规则几乎是多余的，除非父元素已经有一个规则使其具有固定大小和边框。\n\
    \n当你想要从显示中移除空元素时，`empty` 伪元素就派上用场了。例如，假设你在用户界面的一个标签页末尾有一个消息计数。如果该计数为 0 或没有值，那么你就不希望显示一个空的红色圆圈。\n\
    \n在这种情况下，你会在一个单独的规则中为你的红色徽章设置样式，然后像下面这样设置你的空规则：\n\n```\n.mydiv:empty\n{\n    display:\
    \ none;\n}\n```\n代码清单 48c：使空元素从显示中消失的 CSS 规则\n\n通过将 `empty` 选择器定义为不显示，你只需确保开始和结束标签之间没有任何内容，就能使计数从显示中消失。\n\
    \n你可能注意到我措辞为“没有任何内容”，这是有意为之的。当我们说 `empty` 选择器匹配一个空标签时，我们指的是百分百为空。一个空格对我们来说可能看起来是空的，但对于\
    \ CSS 选择器引擎来说，它被归类为内容，将空标签换行到两行同样被视为内容。\n\n当你试图找出为什么你确定应该从显示中消失的元素确实没有消失时，这可能会变得相当令人沮丧。我知道这会引起多少抓狂。\n\
    \n如果开始和结束标签之间有任何东西——任何东西——那么 `empty` 选择器将**不会**匹配。它最适合用于构成小型容器的 `span` 和 `div`，这些容器的内容通过\
    \ JavaScript 构建和移除。\n\n由于此选择器的视觉工作原理，我将不提供屏幕截图。如果你构造一个简单的 `div` 标签并为其应用代码清单 48c\
    \ 中的规则，然后使用编辑器手动添加或移除内容，你很快就能看到它是如何工作的。\n\n## :checked\n\n`checked` 伪选择器用于处理复选框和单选按钮元素。\n\
    \n前提很简单：如果元素被选中或选中，则会应用此伪规则；否则不会应用。\n\n让我们修改我们的表单，这次显示几个复选框和单选按钮，如代码清单 49 所示：\n\
    \n```\n<form action=\"#\" method=\"post\">\n    <label>Check box 1<input type=\"\
    checkbox\" /></label><br />\n    <label>Check box 2<input type=\"checkbox\" /></label><br\
    \ />\n    <label>Check box 3<input type=\"checkbox\" /></label><br />\n    <label>Check\
    \ box 4<input type=\"checkbox\" /></label><br />\n    <label>Radio Button 1<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 2<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 3<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n    <label>Radio Button 4<input\
    \ type=\"radio\" name=\"radios\" /></label><br />\n</form>\n```\n*代码清单 49：包含复选框和单选按钮的简单表单*\n\
    \n渲染此表单应该会给我们提供相当直观的一组控件。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_55_0.png)\n\
    图 37：显示简单复选框和单选按钮控件的表单\n\n由于复选框和单选按钮不会改变颜色，我们将在此演示中使用略有不同的策略，即改变控件的大小。将以下规则添加到你的样式表中：\n\
    \n```\ninput[type=\"checkbox\"], input[type=\"radio\"]\n{\n  width: 20px;\n  height:\
    \ 20px;\n}\ninput[type=\"checkbox\"]:checked, input[type=\"radio\"]:checked\n\
    {\n  width: 25px;\n  height: 25px;\n}\n```\n代码清单 50：演示使用 checked 伪选择器的 CSS 样式\n\
    \n如果你现在渲染表单，并选中和取消选中一些控件，你应该会看到被选中的项目有微小的尺寸变化。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_56_0.png)\n\
    图 38：我们的复选框和单选按钮改变大小\n\n你可能想知道，如果很难更改复选框的颜色等属性，为什么还要使用此伪选择器。\n\n直到你开始考虑将其与相邻选择器结合使用时，你才会明白为什么以及如何可能想要使用它。在代码清单\
    \ 49 的表单中添加如下一行：\n\n```\n<input type=\"checkbox\" /><span class=\"checkboxlabel\"\
    >This is my check box</span>\n```\n代码清单 51a：要添加到之前表单的行\n\n然后，添加以下 CSS 规则：\n\n\
    ```\ninput[type=\"checkbox\"]:checked + span.checkboxlabel\n{\n    color: red;\n\
    }\n```\n*代码清单 51b：为代码清单 51a 中的行设置样式的规则*\n\n你应该会发现，当你渲染文档时，选中或取消选中复选框不会对复选框本身产生任何更改，但会更改其后跟随的\
    \ `span` 的文本颜色。\n\n它之所以这样做，是因为我们告诉 CSS 引擎，对于任何 `type` 属性等于 **checkbox** 的 `input`\
    \ 元素，查看相邻元素并检查它是否是 `span`，并且具有类名 **checkboxlabel**。如果是，则将该 `span` 元素的颜色更改为红色。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_57_0.png)\n\n像这样使用 checked 选择器是 Foundation\
    \ 和 Bootstrap 等 UI 工具包用来制作切换按钮以及由图标列表组成的自定义单选和复选组的方法。\n\n如果你想要创建自定义复选框，那么你只需将此模式与\
    \ `before` 和 `after` 等伪元素结合使用，即可在标记中动态添加/删除内容。\n\n## :before 和 :after\n\n在 CSS3\
    \ 出现之前，如果你想动态添加或删除元素和内容，你必须借助 JavaScript，或者在服务器端进行更改，并使用 Ajax 调用之类的东西重绘文档片段。\n\
    \n> **注意：** Ajax 不是本书将要涵盖的内容，因为它与 JavaScript 深度绑定，并且是一个相当复杂的主题。然而，通常情况下，Ajax 调用是请求\
    \ JavaScript 向 Web 服务器发出部分请求以仅获取少量内容的过程。它通常用作获取小块数据并根据需要将它们插入网页的手段，而不是一次请求下载整个页面。\n\
    \n借助 **before** 和 **after** 伪选择器，我们可以添加和删除 HTML 元素中的内容，而无需触及一行代码，并且完全由纯 CSS 规则驱动。\n\
    \n从一个简单的例子开始，假设我们的 HTML 标记中有以下行：\n\n```\n<span class=\"bracketedLabel\">This is\
    \ a bracketed Label</span>\n```\n*代码清单 52a：用于演示 before 和 after 选择器的简单 span*\n\n\
    这个标签没有任何特别之处；如果我们渲染它，我们只会得到一个简单的输出。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_58_0.png)\n\
    图 40：代码清单 52a 的输出\n\n顾名思义，我们希望任何具有此类的标签都有方括号包围，但我们不想手动去找到所有出现的地方来添加它们。\n\n所以，我们可以添加以下\
    \ CSS 规则：\n\n```\n.bracketedLabel\n{\n    color: green;\n}\n.bracketedLabel:before\n\
    {\n    content: '[';\n    color: red;\n}\n.bracketedLabel:after\n{\n    content:\
    \ ']';\n}\n```\n"
