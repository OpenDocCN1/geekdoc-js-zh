    \nFor the course of this book I'll be working with the following browser:\n\n\
    ```\nGoogle Chrome 39.0.2171.95 m\n```\n\nI'll also have the following browser\
    \ versions available, but won't necessarily be using them:\n\n- Firefox 34.0.5\n\
    - Internet Explorer 11.0.9600.17501 Update 11.0.15 (KB3008923)\n- Maxthon Cloud\
    \ Browser 4.4.3.4000\n\nSince I'll mostly be sticking to features that are more\
