    \ 发送给我们。\n\n我们衷心希望你喜欢阅读这本书，并希望它能帮助你更好地理解所研究的主题。感谢你的阅读。\n\n请在 Twitter 上关注我们，并在\
    \ Facebook 上“点赞”我们，帮助我们传播 *Succinctly* 系列书籍的讯息！\n\n# 关于作者\n\n作为20世纪70年代末到80年代初\
    \ IT 领域的早期采用者，我最初使用的是一台只有 1k 内存的、不起眼的 Sinclair ZX81 家用电脑。\n\n在很短的时间内，这台 1k 的小机器就升级成了\
    \ 16k 的 Tandy TRS-80，接着是一台 Acorn Electron，最终，在经历了许多其他机器之后，变成了一台 4mb 内存、基于 ARM\
    \ 处理器的 Acorn A5000。\n\n最终，在离开学校并接触了基于 DOS 的 PC 机之后，我继续在计算机网络和通信行业的许多不同领域接受培训。\n\
    \n在90年代中期重返校园并获得计算工业学理学学位后，我在英格兰东北部创立了自己的咨询公司，名为 Digital Solutions Computer Software\
    \ Ltd。我在许多不同的 IT 领域为客户提供硬件和软件层面的咨询，涵盖了从移动通信和网络到地理信息系统、银行与金融以及网页设计等广泛领域知识。\n\n\
    凭借在 IT 行业超过30年的经验，涉及许多不同且多样化的平台和操作系统，我有很多知识可以分享。\n\n你经常可以在 LinkedIn 的 LIDNUG .NET\
    \ 用户群组中找到我，这个群组是我协助管理的。你也可以轻松地在 Stack Overflow、Code Project 等地方找到我，或者在 Twitter\
    \ 上以 @shawty\\_ds 的身份找到我。我也是一名 Pluralsight 作者，并制作各种可供在线观看的视频。\n\n希望你喜欢这本书，并能从中学到一些新东西。在当今快速发展的\
    \ IT 世界里，我们几乎没有多余的时间去寻找我们需要的信息——希望这些书籍有助于减轻这方面的负担。\n\n请记得感谢 Syncfusion（在 Twitter\
