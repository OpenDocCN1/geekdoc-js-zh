    \ tag itself as a text string.\n\nThere are a number of reasons for this. Imagine\
    \ you had an element, that via a CSS rule added an element, which also added an\
    \ element; if you weren't careful, you could very easily end up in an infinite\
    \ loop and everything would halt.\n\nCSS rules are also designed to be parsed\
    \ in one run, so any element that inserted elements that require styling would\
    \ mean having to stop, go back and reprocess the rules already seen, then come\
    \ back and continue.\n\nYou can, however, still perform some very interesting\
    \ tricks with them.\n\nOne of the better uses is the creation of customized check\
    \ boxes using nothing more than CSS3 properties and selectors. To illustrate this,\
    \ create a simple form with two checkboxes in it.\n\n```html\n<form action=\"\
