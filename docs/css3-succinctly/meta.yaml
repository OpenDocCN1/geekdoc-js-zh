    \n## 小结\n\n在本章中，你已经看到了 CSS3 引入的一些视觉装饰。接下来，我们将更仔细地了解在 CSS3 中指定颜色的不同方式，并了解一些我们现在可以使用的东西，比如\
    \ alpha 通道。\n\n# 第 6 章 颜色\n\n如果你在阅读本书之前做过任何 Web 开发，那么你几乎一定遇到过 HTML/CSS 中定义颜色的标准方式，即使用\
    \ 6 位十六进制表示法：**#rrggbb**\n\n这到底是什么意思？其实很简单。实际上，它是一个由三个 8 位分量组成的 24 位颜色值。\n\n在十六进制数字系统中，数字从\
