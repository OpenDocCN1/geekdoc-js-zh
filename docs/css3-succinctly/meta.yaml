- img_proc: true
  md: "To illustrate the difference, we're first going to style the list using the\
    \ adjacent sibling selector you saw earlier, using the following rule.\n\n```\n\
    p + ul a\n{\n  color: red;\n}\n```\n\n*Code Listing 21: Adjacency selector for\
    \ Code Listing 20*\n\nWhen we render Code Listing 20, using the rule in Code Listing\
    \ 21, we get the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_31_0.png)\n\
    \n*Figure 13: Output produced by Code Listing 20 with the adjacency selector applied*\n\
    \nIf you've been following along with the code, this shouldn't come as a surprise.\
    \ The first group is styled, the second is not.\n\nIf we now switch our code to\
    \ use the general sibling selector, however:\n\n```\np ~ ul a\n{\n  color: red;\n\
    }\n```\n\n*Code Listing 22: Sibling selector for Code Listing 20*"
  merge: -1
  pgno: 31
- img_proc: true
  md: "We should see a difference in the selection:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_32_0.png)\n\
    \nFigure 14: Output produced by Code Listing 20 with the sibling selector applied\n\
    \nWhile the adjacent sibling selector stops at the first match, the general sibling\
    \ selector does not; the general sibling selector will continue down the chain,\
    \ matching anything in the rule as long as the element before it matches.\n\n\
    # The difference between adjacency and descendancy\n\nAt this point you might\
    \ be wondering why we have two ways of achieving apparently the same thing. It’s\
    \ important to remember that while we have styled similar scenarios so far in\
    \ this chapter, we’ve done this in rather different ways.\n\nWhen we talk about\
    \ elements that are adjacent to each other, we mean these elements are rather\
    \ like neighbors in a street of houses. If you were to draw a line down the alignment\
    \ of each house, you’d see that everything was at the same level. In the following\
    \ code, each of the **div** elements with a **class** attribute of **house** are\
    \ adjacent to one another:\n\n```\n<div class=\"street\">\n    <div class=\"house\"\
    ></div>\n    <div class=\"house\"></div>\n    <div class=\"house\"></div>\n  \
    \  <div class=\"house\"></div>\n    <div class=\"house\"></div>\n</div>\n```\n\
    \nCode Listing 23: Adjacent elements"
  merge: -1
  pgno: 32
- img_proc: true
  md: "When we talk about elements being descendants of each other, we're talking\
    \ about a parent-to-child-like relationship. If we apply this to our street example\
    \ in Code Listing 23, we might have \"tenants\" who occupy each house.\n\n```\n\
    <div class=\"street\">\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n\
    \    <div class=\"house\"><p class=\"tenant\"></p></div>\n    <div class=\"house\"\
    ><p class=\"tenant\"></p></div>\n    <div class=\"house\"><p class=\"tenant\"\
    ></p></div>\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n</div>\n\
    ```\n\n*Code Listing 24: Descendant elements*\n\nAs you can see in Code Listing\
    \ 24, we now have a tenant inside each house. Tenants are not adjacent to each\
    \ other because you have to leave the house, move down, and then enter into the\
    \ next house to reach the next tenant.\n\nHowever, since you can reach a tenant\
    \ from a house, then a tenant becomes a descendant of a house.\n\nChild and grandchild\
    \ terminology are defined as a specialist case of descendancy. Just like in a\
    \ family tree, a tenant in our example might have children, and those children\
    \ might have grown up and had children of their own.\n\nA child of a child would\
    \ still be a descendant of a tenant, but it would not be a child of a tenant;\
    \ it would be a grandchild, something like the following:\n\n```\n<div class=\"\
    street\">\n    <div class=\"house\">\n        <div class=\"tenant\">\n       \
    \     <div class=\"tenantsChild\">\n                <div class=\"childsChildButTenantsGrandChild\"\
    ></div>\n            </div>\n        </div>\n    </div>\n</div>\n```\n\n*Code\
    \ Listing 25: Code showing child relation to dependency*\n\nIf you were to create\
    \ more **div** elements with a class of **tenantsChild** next to each other within\
    \ the confines of the tenant, those **tenantsChild** elements, like the houses,\
    \ would be adjacent to each other.\n\nIt takes a little bit of practice until\
    \ you get into the habit of thinking this way, but if you think about HTML in\
    \ its native form as a specialist, XML-based language, then you see that the nesting\
    \ starts to make sense. Once the nesting makes sense, the flow and layout of the\
    \ selectors start to fall into place too.\n\nDon't worry if you struggle to make\
    \ sense of it straightaway. It took me a long time to unravel it all too, and\
    \ even now I still get it wrong sometimes."
  merge: -1
  pgno: 33
- img_proc: true
  md: "So far we've covered the main base selectors. If you want to read up on the\
    \ rest of them, you can find the official documentation on the W3C site.\n\nI\
    \ do think a warning is in order here, though. While the official W3C documentation\
    \ is the official source of all things HTML, it's also a very difficult site to\
    \ read.\n\nThere are easier sources of information, such as Mozilla and HTML Dog.\
    \ I would strongly advise you digest those first, then visit the W3C site once\
    \ you have a better understanding of the topic.\n\n# Attribute Selectors\n\nTo\
    \ finish this chapter off, we're going to take a look at something that's been\
    \ massively expanded on in CSS3: attribute selectors.\n\nThere has been some minimal\
    \ effort to introduce a very small subset of this type of selector in previous\
    \ versions, but it went largely unnoticed, so most developers never stopped to\
    \ look at what it had to offer.\n\nIn CSS3 however, attribute selectors are all-powerful,\
    \ and allow you to do some rather smart styling of elements.\n\nFirst off, we\
    \ need to define what an attribute selector actually is.\n\nUnlike the selectors\
    \ you've seen so far, an attribute selector is not a single character construct\
    \ that sits between two targets; it's a multi-character appendage to a parent\
    \ rule, which contains its own internal processing rules.\n\nIn a small way, attribute\
    \ selectors are a little bit like having a custom set of search expressions, specifically\
    \ for hunting out elements based on the value (or part of) an attribute attached\
    \ to them.\n\nTake a look at the following HTML markup.\n\n```\n<ul>\n    <li><a\
    \ href=\"#\" rel=\"external\">External Link 1</a></li>\n    <li><a href=\"#\"\
    \ rel=\"internal\">Internal Link 1</a></li>\n    <li><a href=\"#\" rel=\"internal\"\
    >Internal Link 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link\
    \ 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link 3</a></li>\n\
    </ul>\n```\n\nCode Listing 26: HTML markup with custom attributes\n\nIn Code Listing\
    \ 26, you can see I've created a fairly standard, unordered list containing items\
    \ with anchor elements in them. It's nothing unusual, and something you'll often\
    \ see in navigation links in HTML documents."
  merge: -1
  pgno: 34
- img_proc: true
  md: "What I've done, however, is to use the `rel` attribute to mark up the relation\
    \ of the link, specifying if it's an external or an internal link.\n\nIf we wanted\
    \ to style the two different types in different ways, we could, in theory, just\
    \ add a class such as `.internal` or `.external`. However, there may be times\
    \ that HTML markup is generated inside a process over which you have no control,\
    \ so you may not be able to add classes to the output in this manner.\n\nThis\
    \ is where the attribute selector comes in. You can use it to target a specific\
    \ named attribute within the element, and as you'll see in just a moment, you\
    \ can use it to not only target a full string, but part of a string too.\n\nFirst,\
    \ let's have a look at how we might apply it to our previous links example. Add\
    \ the following style rules to your style sheet (assuming you've already added\
    \ the preceding HTML to your document):\n\n```\na[rel=\"external\"]\n{\n\tcolor:\
    \ red;\n}\n\na[rel=\"internal\"]\n{\n\tcolor: green;\n}\n```\n\n*Code Listing\
    \ 27: Attribute Selector rules for Code Listing 26*\n\nIf you render this in your\
    \ browser, you should see something like the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_35_0.png)\n\
    \n*Figure 15: Code Listing 26 with the CSS rules in Code Listing 27 applied to\
    \ them*\n\nJust by using two different rules, we've easily targeted the two different\
    \ types of links, simply because of the difference in the `rel` attribute.\n\n\
    A real-world example might look something like the following; change the code\
    \ in Listing 26 to read as follows:\n\n```\n<ul>\n```"
  merge: -1
