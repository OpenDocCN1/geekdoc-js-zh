    # # Chapter 3 New Selectors


    In the previous chapter you saw a brief refresher of the most common types of
    selectors used in CSS. These three types are known as the class, ID, and descendant
    selectors, and were all that was available before version 3 of CSS. Now that CSS3
    is here, it has brought many new selectors as part of its new functionality.


    We won''t be covering every new selector in this chapter, but you''ll see rather
    quickly the sheer flexibility now available to target your HTML elements in ways
    you might never even have imagined.


    Many of these new selectors are implemented as pseudo-selectors (selectors that
    act as an extension to another selector, such as hover), and you could easily
    write an entire book just on the subject of selectors alone.


    In this chapter, we''ll look only at the most important of the new selectors available,
    along with a basic demonstration of their uses. For the rest, I strongly advise
    you to read many of the excellent resources available on the internet. Aside from
    the other links I''ve already mentioned, a great place to start purely for CSS
    topics is the CSS pages on the [Mozilla Developer Network](https://developer.mozilla.org/).
    The handy thing about MDN is the compatibility guides, which will tell you at
    a glance which selectors work with which browsers, and which ones will give you
    problems.


    # ## The Universal Selector (*)


    The *target all* selector does exactly what it says: it targets everything it
    can in the space in which it is operating.


    That means if you have it inside an ID-based selector, then everything that falls
    under the control of that ID selector will be affected.


    Using the * symbol tells you straight away that it behaves like a wild card, being
    as greedy as possible and selecting as much as possible. At first, this may seem
    like a great thing, until you suddenly realize just how much it slows your page
    down on a mobile device, or on a page with millions of nested elements.


    The universal selector is designed primarily to make sweeping changes as part
    of an initial setup, such as setting a pages entire CSS model to a known set of
    defaults (like 0-pixel margins and no borders).


    Typically it''s used in CSS resets to start at a known state. Many of the well-known,
    front-end UI frameworks make extensive use of it to put your page into a known
    state before applying any custom styles they may provide.


    The universal selector should be used sparingly, and its sphere of influence should
    be made as minimal as possible so as not to cause any drastic performance bottlenecks.'
