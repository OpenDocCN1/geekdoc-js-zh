  md: 'If you have any problems with styles not being applied when and where you expect
    them to, the first thing to always check is the order of specificity.


    # Summary


    In this chapter we''ve taken quite a whirlwind (and brain-exercising) tour of
    the new pseudo selectors available in CSS3. You should by now have a very good
    idea of how to target and select the elements you need to select, and the methods
    by which you can do so.


    We''ve learned a huge amount in this chapter, and learned a few clever tricks
    along the way. Now that the hard stuff is behind us, it''s time to sit back and
    enjoy the easy life.


    Starting in the next chapter, we''ll be taking a look at what most of you have
    been waiting for: the eye candy. We''ll start by looking at everyone''s favorites:
    rounded corners, drop shadows, and gradient fills.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Chapter 5  Eye Candy


    One thing that CSS3 has in abundance are ways to make things look pretty.


    For developers (especially those who spend most of their time working server side),
    they might be wondering what all the fuss is about; we''re hired to produce software,
    and that''s exactly what we''re doing.


    Unfortunately, on the client side and in the browser, things don''t quite work
    that way. Those of our colleagues that don''t understand what we do or how we
    do it love to see things that are flashy, colorful, and sparkly.


    When they can see this type of progress, they gauge that visual feedback as proof
    that there is work being done on the application.


    Chief among the things that the non-IT crowd likes to see are the staple eye candy
    diet of drop shadows and rounded corners.


    I''m sure if you''ve done any serious CSS or design work in the past, you''ll
    be more than familiar with the difficulty of having to use Photoshop to create
    partially-transparent PNG graphic files, which you then had to line up around
    the edge of a carefully placed div element.


    If you were off by even so much as a pixel, you''d often have to do it all again
    from scratch, measuring things one pixel at a time and restricting page layouts
    to fixed sizes so things didn''t break afterwards.


    If you''re new to this game, then find any veteran of the web development industry
    and I''m sure that they''ll have more than a few horror stories to tell you.


    CSS3 solves all of this by adding the ability to define rules that state how rounded
    a corner should be now, and by allowing you to describe how a drop shadow should
    look. The CSS3 engine will then apply those instructions automatically to your
    HTML markup based on the selector rules you provide and workout where everything
    needs to be.


    # Rounded Corners


    The web is square—or at least it was until very recently.


    Until CSS3 came along, all we had were boxes with sharp edges. Div elements were
    always square and parallel, tables were square and parallel, and we couldn''t
    make things look a little softer and friendlier (well at least not without a lot
    of image hacks).


    To change this, CSS3 introduced the border-radius property on all block elements
    that can use a border.


    Using it is simple.'
  merge: -1
