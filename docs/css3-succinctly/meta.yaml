- img_proc: true
  md: "**Before** and **after** are probably two of the most flexible pseudo selectors\
    \ available, and the development community still hasn't discovered all the ways\
    \ they can be used.\n\n# First-X, Last-X, and nth-X\n\nI've chosen to represent\
    \ this last group as one collection as they are all related. The first, last and\
    \ nth pseudo selectors are used for selecting the first, last and user-defined\
    \ count of elements in a list of elements.\n\nThere are two distinct groups in\
    \ this batch; we'll look at the general selectors (that is, the ones that will\
    \ select anything), then the type specific selectors. These two groups are listed\
    \ in the CSS3 spec as:\n\nfirst-child, last-child, nth-child()\n\nand\n\nfirst-of-type,\
    \ last-of-type, nth-of-type()\n\nFor the first set of examples, we'll use the\
    \ following HTML markup to illustrate how the selectors work, and what they can\
    \ do.\n\n```\n<ul>\n    <li>List Item One</li>\n    <li>List Item Two</li>\n \
    \   <li>List Item Three</li>\n    <li>List Item Four</li>\n    <li>List Item Five</li>\n\
    \    <li>List Item Six</li>\n    <li>List Item Seven</li>\n    <li>List Item Eight</li>\n\
    \    <li>List Item Nine</li>\n    <li>List Item Ten</li>\n</ul>\n```\n\n*Code\
    \ Listing 55: Unordered list markup for first, last and nth selectors*\n\nAs we've\
    \ done with everything else thus far, here's the before rendering of our markup\
    \ in the browser:"
  merge: -1
  pgno: 63
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_0.png)\n\nLike many of the selectors\
    \ available, their names describe without any doubt what they do. Let's apply\
    \ the following rules to the HTML in Code Listing 55.\n\n```\nul > li:first-child\n\
    {\n    color: red;\n}\n\nul > li:last-child\n{\n    color: green;\n}\n```\n\n\
    *Code Listing 56: CSS rules to demo 'first-child' and 'last-child' pseudo selectors*\n\
    \nAs you might predict, the first and last items in our unordered list change\
    \ color as anticipated.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_1.png)\n\
    \nThe first-child and last-child selectors are about as simple as we get; nth-child(),\
    \ however, requires a little more explanation."
  merge: -1
  pgno: 64
- img_proc: true
  md: 'You may notice that unlike the others, nth-child has a set of parentheses following
    it. This is because unlike the other selectors, nth-child accepts a parameter
    to control it.


    This parameter takes the form of an algebraic equation that describes what to
    select and how.


    > **Note:** For many folks, doing algebra at school is a distant memory. For those
    who do remember it, they''d probably much rather they didn''t. However, even though
    you might have wondered then when it might ever come in handy, remembering how
    it works will really help you with algebraic expressions in CSS3. If you are struggling
    to remember any of it, then now might be a good time to have a quick refresher.


    Don''t be frightened; an algebraic equation is something that describes how a
    number calculation should work, but not necessarily what the actual answer should
    be.


    Many folks will have come across something at some stage in their lives that looks
    like this:

    **1n+5x=6y**


    To those who remember, this is called algebra, and is a quite specialist branch
    of mathematics that many folks study for years on end. Solving these strange equations
    is somewhat of a hobby for many theoretical mathematicians, and some even devote
    years of their lives to simply theorizing about these things.


    For those who are still scratching their heads, that little bit of algebra means
    the following:


    The equation 1 multiplied by the value of n when added to 5 multiplied by the
    value of x will be always equal to 6 multiplied by the value of y, where n, x,
    and y are theoretical instances that hold no current value.


    Don''t worry, you don''t need to know algebra in that kind of depth to understand
    how an nth-child works, but you do need to know how algebra works.


    When you have a discrete value followed by a theoretical instance, that theoretical
    instance is usually multiplied in some manner by the operator. Operators can also
    apply additions and subtractions, or just be specified on their own to give a
    static value.


    For example:


    **1** means just that: 1, an offset of 1, a count of 1, one page, one thing...
    it really doesn''t matter, because it''s theoretical.


    **1n**, on the other hand, means 1 amount of **n**, or 1 multiplication of **n**;
    again, **n** can represent anything because it''s all theoretical.


    **1n+1** means 1 amount of n with an additional 1 added to it.


    Perhaps an easier way to understand how these equations work, is to imagine using
    them to perform multiplication tables. Remember, for example, the 3 multiplication
    table:


    **3 x 0 = 0**'
  merge: -1
  pgno: 65
- img_proc: true
  md: "**3 x 1 = 3**\n**3 x 2 = 6**\n**3 x 3 = 9**\n**3 x 4 = 12**\n\nAnd so on…\n\
    \nNow, imagine that the **n** in our **3n** is the multiplicand in the second\
    \ column (the value 0 to 4); you then start to see how n references any value\
    \ in the range.\n\nIf you then treat the result as a static number, you end up\
    \ with the following static sequence.\n\n**0, 3, 6, 9, 12**\n\nLet that sink in\
    \ for a moment.\n\nNow think back to the list of HTML elements in Code Listing\
    \ 55. There are 10 list item children in that list, and if we forget about the\
    \ numbers 0 and 12 in our static list, we have 3, 6 and 9, which could all be\
    \ offsets to select (0 and 12 are not valid items, as they don't exist).\n\nWell,\
    \ that's exactly what nth-child() does. It uses the algebraic equation passed\
    \ to it to determine exactly which elements in a list it needs to select.\n\n\
    Let's apply the following CSS rule to our list from Code Listing 55:\n\n```\n\
    ul > li:nth-child(3n)\n{\n  color: red;\n}\n```\n\n*Code Listing 57a: nth-child\
    \ CSS rule to select every third element*\n\nWhat will happen is that every third\
    \ element in the list will be affected by the rule.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_66_0.png)\n\
    \n*Figure 49: Our nth-child(3n) rule in action*"
  merge: -1
  pgno: 66
- img_proc: true
  md: "If we start adding a + offset to that, we dictate where the multiplication\
    \ starts:\n\n```\nul > li:nth-child(3n+1)\n{\n  color: red;\n}\n```\n\n*Code Listing\
    \ 57b: nth-child CSS rule to select every third element starting at element 1*\n\
    \nThis will produce the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_67_0.png)\n\
    \n*Figure 50: nth-child(3n+1) starting at 1 and selecting every third element*\n\
    \nWhich, as you can see, starts with element index number 1, then applies the\
    \ multiplication of 3 each time, to select every third item.\n\nYou can use just\
    \ an **n** on its own too, which, when used with a positive offset, allows you\
    \ to select ranges. For example:\n\n```\nul > li:nth-child(n+7)\n{\n  color: red;\n\
    }\n```\n\n*Code Listing 57c: nth-child CSS rule to select everything from 7 onwards*\n\
    \nWill start at offset 7 and simply select everything left from that point on."
  merge: -1
  pgno: 67
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_0.png)\n\nFigure 51: nth child\
    \ selecting elements from 7 onwards\n\nYou can also go backwards by simply prefixing\
    \ the **n** with a minus symbol.\n\n```\nul > li:nth-child(-n+7)\n{\n    color:\
    \ red;\n}\n```\n\nCode Listing 57d: nth-child CSS rule to select everything from\
    \ 7 backwards\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_1.png)\n\nFigure\
    \ 52: nth child selecting from 7 backwards\n\nIf you're just trying to select\
    \ a single numbered element in a list, you can do the following:\n\n```\nul >\
    \ li:nth-child(5)\n{\n    color: red;\n}\n```\n\nCode Listing 57e: nth-child CSS\
    \ rule to select just index number 5"
  merge: -1
  pgno: 68
- img_proc: true
  md: "Just specifying the number index directly will select only that numbered element.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_69_0.png)\n\n*Figure 53: nth-child\
    \ selecting just the fifth element in the list*\n\nI could easily fill up the\
    \ rest of this book with different combinations of nth-child equations, but I\
    \ think we've got enough for now.\n\nI can take a guess at the question that most\
    \ of you are asking yourselves at this point.\n\n> \"How might I use this to select\
    \ and stripe all the rows in a table or grid? Can you maybe tell me what the equation\
    \ for that is?\"\n\nThe good news here is that the W3C standards committee realized\
    \ that this was likely to be one of the most common uses of the nth-child pseudo\
    \ selector, so they added a couple of shortcuts: **even** to select every even\
    \ numbered element, and **odd** to select every odd numbered element.\n\nIf you\
    \ add the following rule:\n\n```\nul > li:nth-child(odd)\n{\n    color: red;\n\
    }\n```\n\n*Code Listing 57f: nth-child CSS rule to select every odd numbered element*\n\
    \nYou should see that every odd list item in the markup gets selected."
  merge: -1
  pgno: 69
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_70_0.png)\n\nFigure 54: nth-child\
    \ selecting every odd element\n\nI think by this point you'll likely want to give\
    \ your brain a rest, so we'll leave the algebra behind for now.\n\nTake note though,\
    \ that there is still a massive amount we've not covered. For example, you can\
    \ chain nth-child selectors (just as you can with many others), leading to some\
    \ crazy selector rules that look like this:\n\n**nth-child(3n+1):nth-child(even)**\n\
    \nThis will select every third element, starting at index 1, but only those that\
    \ have an even number for the index. For 11 elements, this would select only elements\
    \ with an index of 4 and 10 (all the others are odd numbers).\n\nYou can easily\
    \ select ranges, then split those ranges up. You can combine those range selections\
    \ with **first-child** and **last-child** too, allowing you only to select the\
    \ start and end of a range. It's a subject in itself that perhaps warrants an\
    \ entire book, and to date there have been some very clever uses of the **nth-child**\
    \ pseudo selector; for us though, it's time to move on.\n\nThe second group of\
    \ pseudo selectors that fall under the **first**, **last** and **nth** element\
    \ selections are the **of-type** selectors.\n\nThe **first-of-type**, **last-of-type**,\
    \ and **nth-of-type** selectors all work exactly the same way as the general selectors\
    \ described previously in this chapter, but they target a specific element type.\n\
    \nLet's take our unordered list from Code Listing 55, and change it a bit to turn\
    \ it into a definition list.\n\n```\n<dl>\n    <dt>HTML 5</dt>\n    <dd>HTML 5\
    \ is the markup language used to create documents that are published on the internet</dd>\n\
    ```"
  merge: -1
