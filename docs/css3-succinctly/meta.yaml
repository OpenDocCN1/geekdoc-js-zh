  - "[PAGE 88]\n\nIt could be a subtle change in color, or a very bold change in a\
    \ short amount of space. A correctly used graduation of color can make a lot of\
    \ difference.\n\nAs with many graphical effects, in the past you would generally\
    \ have resorted to an image-editing package such as Photoshop to create the color\
    \ graduation. Then you would have applied the resulting graduation as a background\
    \ image and repeated it as needed to cover the full size of the element you were\
    \ targeting.\n\nWith CSS3 you can now use a gradient fill type to create color\
    \ ranges on the fly without ever using an image editor ever again.\n\nNotice in\
    \ the previous paragraph I called the gradient fill a \"type.\" Unlike everything\
    \ we've seen so far, graduated fills are not a rule all of their own, as shadows\
    \ and curved borders are. They are in fact a type of image that the CSS engine\
    \ creates for us, and are typically (but not always) used with any rule where\
    \ you might normally specify an image.\n\nThis means that you don't have rules\
    \ in your style sheet called gradient rules; instead, you create CSS rules for\
    \ a given target using normal CSS properties such as color, background-color,\
    \ background-image, and many others. Then you replace or override all or part\
    \ of the rules already defined with the areas you wish to apply a gradient to.\n\
    \nThis is important for backward compatibility, because it means that you'll always\
    \ have a fall back, which means CSS color gradients are one of the many new things\
    \ you can use without having to do anything too special to support older browsers.\n\
    \nIn typical usage, you would create your rule (remembering specificity order)\
    \ to style an element in a way that looks good for the older browsers. Then you'd\
    \ either add class-specific selectable rules to extend the original rule, or you'd\
    \ add the gradient generators towards the bottom of the rule in question after\
    \ the basic properties had already been set.\n\nProducing gradients in this manner\
    \ allows the CSS engine in your browser to do all the hard work for you, meaning\
    \ no polyfills or JavaScript hacks to provide backwards compatibility.\n\nNow\
    \ that you know the basics, let's see how we can apply it.\n\nFirst we need some\
    \ HTML markup to play with, so let's create a simple, single **div** and put it\
    \ in an HTML document.\n\n```\n<div class=\"gradDiv\">\n    <p>I'm a div with\
    \ a gradient</p>\n</div>\n```\n\n*Code Listing 64a: HTML for our graduated fills*\n\
    \nLet's also define the following rule as a starting point to experiment with:\n\
    \n```\n.gradDiv\n{\n    width: 200px;\n    height: 200px;\n```"
