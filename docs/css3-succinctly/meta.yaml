    **Before** and **after** are probably two of the most flexible pseudo selectors\
    \ available, and the development community still hasn't discovered all the ways\
    \ they can be used.\n\n## First-X, Last-X, and nth-X\n\nI've chosen to represent\
    \ this last group as one collection as they are all related. The first, last and\
    \ nth pseudo selectors are used for selecting the first, last and user-defined\
    \ count of elements in a list of elements.\n\nThere are two distinct groups in\
    \ this batch; we'll look at the general selectors (that is, the ones that will\
    \ select anything), then the type specific selectors. These two groups are listed\
    \ in the CSS3 spec as:\n\nfirst-child, last-child, nth-child()\n\nand\n\nfirst-of-type,\
    \ last-of-type, nth-of-type()\n\nFor the first set of examples, we'll use the\
    \ following HTML markup to illustrate how the selectors work, and what they can\
    \ do.\n\n```html\n<ul>\n    <li>List Item One</li>\n    <li>List Item Two</li>\n\
    \    <li>List Item Three</li>\n    <li>List Item Four</li>\n    <li>List Item\
    \ Five</li>\n    <li>List Item Six</li>\n    <li>List Item Seven</li>\n    <li>List\
    \ Item Eight</li>\n    <li>List Item Nine</li>\n    <li>List Item Ten</li>\n</ul>\n\
    ```\n\n*Code Listing 55: Unordered list markup for first, last and nth selectors*\n\
    \nAs we've done with everything else thus far, here's the before rendering of\
    \ our markup in the browser:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_0.png)\n\
    \nLike many of the selectors available, their names describe without any doubt\
    \ what they do. Let's apply the following rules to the HTML in Code Listing 55.\n\
    \n```css\nul > li:first-child\n{\n    color: red;\n}\n\nul > li:last-child\n{\n\
    \    color: green;\n}\n```\n\n*Code Listing 56: CSS rules to demo 'first-child'\
    \ and 'last-child' pseudo selectors*\n\nAs you might predict, the first and last\
    \ items in our unordered list change color as anticipated.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_1.png)\n\
    \nThe first-child and last-child selectors are about as simple as we get; nth-child(),\
    \ however, requires a little more explanation.\n\nYou may notice that unlike the\
    \ others, nth-child has a set of parentheses following it. This is because unlike\
    \ the other selectors, nth-child accepts a parameter to control it.\n\nThis parameter\
    \ takes the form of an algebraic equation that describes what to select and how.\n\
    \n> **Note:** For many folks, doing algebra at school is a distant memory. For\
    \ those who do remember it, they'd probably much rather they didn't. However,\
    \ even though you might have wondered then when it might ever come in handy, remembering\
    \ how it works will really help you with algebraic expressions in CSS3. If you\
    \ are struggling to remember any of it, then now might be a good time to have\
    \ a quick refresher.\n\nDon't be frightened; an algebraic equation is something\
    \ that describes how a number calculation should work, but not necessarily what\
    \ the actual answer should be.\n\nMany folks will have come across something at\
    \ some stage in their lives that looks like this:\n**1n+5x=6y**\n\nTo those who\
    \ remember, this is called algebra, and is a quite specialist branch of mathematics\
    \ that many folks study for years on end. Solving these strange equations is somewhat\
    \ of a hobby for many theoretical mathematicians, and some even devote years of\
    \ their lives to simply theorizing about these things.\n\nFor those who are still\
    \ scratching their heads, that little bit of algebra means the following:\n\n\
    The equation 1 multiplied by the value of n when added to 5 multiplied by the\
    \ value of x will be always equal to 6 multiplied by the value of y, where n,\
    \ x, and y are theoretical instances that hold no current value.\n\nDon't worry,\
    \ you don't need to know algebra in that kind of depth to understand how an nth-child\
    \ works, but you do need to know how algebra works.\n\nWhen you have a discrete\
    \ value followed by a theoretical instance, that theoretical instance is usually\
    \ multiplied in some manner by the operator. Operators can also apply additions\
    \ and subtractions, or just be specified on their own to give a static value.\n\
    \nFor example:\n\n**1** means just that: 1, an offset of 1, a count of 1, one\
    \ page, one thing... it really doesn't matter, because it's theoretical.\n\n**1n**,\
    \ on the other hand, means 1 amount of **n**, or 1 multiplication of **n**; again,\
    \ **n** can represent anything because it's all theoretical.\n\n**1n+1** means\
    \ 1 amount of n with an additional 1 added to it.\n\nPerhaps an easier way to\
    \ understand how these equations work, is to imagine using them to perform multiplication\
    \ tables. Remember, for example, the 3 multiplication table:\n\n**3 x 0 = 0**"
