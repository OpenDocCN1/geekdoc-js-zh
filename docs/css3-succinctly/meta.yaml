    \n> Figure 1: Chrome browser tools showing CSS file failing to load\n\nIf your\
    \ HTML file is unable to find a linked CSS file, then none of the style rules\
    \ you define will be used, and your result will look nothing like it should.\n\
    \n## A quick word on browser compatibility\n\nOne final thing that we need to\
    \ address before moving on is browser compatibility.\n\nAnyone who's done any\
    \ kind of HTML frontend-driven web development knows all too well the pain involved\
    \ in making code appear uniform across all browsers.\n\nThis won't be more true\
    \ if you've spent any time working with the CSS2 and HTML4 standards, and the\
