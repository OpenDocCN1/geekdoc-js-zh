    \ Syncfusion，告诉他们你希望看到什么。*Succinctly* 系列对于忙碌的程序员来说是一个绝妙的点子。\n\n# 第1章  什么是 CSS3？\n\
    \n如果你成为一名 Web 开发者已有一段时间，那么 CSS 对你来说就不会陌生。然而，你可能想知道 CSS3 到底有什么大惊小怪的。\n\n就像新的 HTML\
    \ 5 规范一样，CSS3（更准确地说是 CSS 版本 3）是最新的一套规范，旨在塑造、定义和说明 CSS 最新版本所具备的能力。\n\n要充分利用 CSS3，你首先需要对\
