  md: "# :empty\n\nThe `empty` pseudo selector might at first seem like it's used\
    \ when an element value is empty, but it's not; it's used when the inner contents\
    \ of an HTML element is empty. Consider the following HTML:\n\n```\n<div class=\"\
    mydiv\"></div>\n```\n\nCode Listing 48a: An empty div element\n\nThe `div` in\
    \ Code Listing 48a is empty—it's devoid of any contents whatsoever between the\
    \ opening and closing tags that surround it.\n\nIf we were now to apply a rule\
    \ such as the following:\n\n```\n.mydiv:empty\n{\n    /* rules go here */\n}\n\
    ```\n\nCode Listing 48b: CSS rule for empty pseudo selector\n\nAny style rules\
    \ defined in the CSS would be applied to it. However, as there are actually no\
    \ contents, then applying rules that make color changes is pretty much redundant,\
    \ unless the parent element already has a rule that shows itself with a fixed\
    \ size and border.\n\nThe `empty` pseudo element comes into handy when you want\
    \ to remove empty elements from display. For example, let's imagine you had a\
    \ message count on the end of a tab in your user interface. If that count was\
    \ 0 or had no value, then you wouldn't want an empty, red circle showing.\n\n\
    In this case, you'd style your red badge in a separate rule, and then you'd style\
    \ your empty rule something like the following:\n\n```\n.mydiv:empty\n{\n    display:\
    \ none;\n}\n```\n\nCode Listing 48c: CSS rule to make an empty element vanish\
    \ from display\n\nBy defining the `empty` selector using no display, all you need\
    \ to do to make the count disappear from the display is to make sure there's nothing\
    \ at all between the opening and closing tags.\n\nYou might notice that I'm wording\
    \ things as \"nothing at all,\" and that's deliberate. When we say that the `empty`\
    \ selector matches an empty tag, we mean 100 percent empty. A space might look\
    \ empty to us, but to the CSS selector engine, it's classed as content, as is\
    \ splitting an empty tag over two lines."
  merge: -1
  pgno: 54
- img_proc: true
  md: "This can get quite frustrating when you're trying to track down why an element\
    \ you're sure should vanish from display, does indeed not vanish from the display.\
    \ I know firsthand how much hair-pulling this causes.\n\nIf there is anything—anything\
    \ at all—in between and opening and closing tag, then the empty selector will\
    \ NOT match. It works best with spans and divs that form small containers whose\
    \ contents are built and removed using JavaScript.\n\nBecause of the way this\
    \ selector works visually, I'm not going to provide a screen shot. If you construct\
    \ a simple `div` tag and apply the rule in Code Listing 48c to it, then manually\
    \ add or remove contents using your editor, you'll soon see how it works.\n\n\
    # :checked\n\nThe `checked` pseudo selector is used when dealing with checkbox\
    \ and radio elements.\n\nThe premise is simple: if the element is checked or selected,\
    \ then this pseudo rule will be applied; otherwise, it won't.\n\nLet's alter our\
    \ form, this time to show a couple of checkboxes and radio buttons, as shown in\
    \ Code Listing 49:\n\n```\n<form action=\"#\" method=\"post\">\n    <label>Check\
    \ box 1<input type=\"checkbox\" /></label><br />\n    <label>Check box 2<input\
    \ type=\"checkbox\" /></label><br />\n    <label>Check box 3<input type=\"checkbox\"\
    \ /></label><br />\n    <label>Check box 4<input type=\"checkbox\" /></label><br\
    \ />\n    <label>Radio Button 1<input type=\"radio\" name=\"radios\" /></label><br\
    \ />\n    <label>Radio Button 2<input type=\"radio\" name=\"radios\" /></label><br\
    \ />\n    <label>Radio Button 3<input type=\"radio\" name=\"radios\" /></label><br\
    \ />\n    <label>Radio Button 4<input type=\"radio\" name=\"radios\" /></label><br\
    \ />\n</form>\n```\n\n*Code Listing 49: Simple form of check boxes and radio buttons*\n\
    \nRendering this should give us a fairly straightforward bunch of controls.\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_55_0.png)"
  merge: -1
  pgno: 55
- img_proc: true
  md: "# Figure 37: Form showing simple checkbox and radio controls\n\nSince checkboxes\
    \ and radio buttons don't change color, we'll use a slightly different tactic\
    \ for this demonstration, and change the size of the controls. Add the following\
    \ rules to your style sheet:\n\n```\ninput[type=\"checkbox\"], input[type=\"radio\"\
    ]\n{\n  width: 20px;\n  height: 20px;\n}\ninput[type=\"checkbox\"]:checked, input[type=\"\
    radio\"]:checked\n{\n  width: 25px;\n  height: 25px;\n}\n```\n\n# Code Listing\
    \ 50: CSS Styles do demonstrate using the checked pseudo selector\n\nIf you render\
    \ the form now, and check and uncheck some of the controls, you should see a small\
    \ size variation on the items that are checked.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_56_0.png)\n\
    \n# Figure 38: Our check boxes and radio buttons changing size\n\nYou might be\
    \ wondering why you might want to use this pseudo selector if it's difficult to\
    \ change the properties such as color on a checkbox.\n\nIt's not until you start\
    \ to think about combining it with adjacency selectors that it starts to make\
    \ sense as to how you might want to use this. Create a line in your form in Code\
    \ Listing 49 that looks like the following:\n\n```\n<input type=\"checkbox\" /><span\
    \ class=\"checkboxlabel\">This is my check box</span>\n```\n\n# Code Listing 51a:\
    \ Line to add to previous form\n\nThen, add the following CSS rule:"
  merge: -1
  pgno: 56
- img_proc: true
  md: "```\ninput[type=\"checkbox\"]:checked + span.checkboxlabel\n{\n    color: red;\n\
    }\n```\n\n*Code Listing 51b: Rule to style the line in Code Listing 51a*\n\nYou\
    \ should find that when you render the document, checking or unchecking the checkbox\
    \ will make no changes to the checkbox itself, but it will change the text color\
    \ of the span following it.\n\nIt does this because we've told the CSS engine\
    \ that for any input element that has a type attribute equal to **checkbox**,\
    \ look at the adjacent element and check to see if it's a span, and has a class\
    \ of **checkboxlabel**. If it does, then change the color of that span element\
    \ to red.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_57_0.png)\n\nUsing checked\
    \ selectors like this is the method used by UI toolkits such as Foundation and\
    \ Bootstrap to produce toggle buttons and custom radio and check groups made from\
    \ lists of icons.\n\nIf you're looking to create custom check boxes, then you\
    \ simply need to combine this pattern with pseudo elements such as before and\
    \ after to add/remove content dynamically in your markup.\n\n# # :before and :after\n\
    \nBefore CSS3 came along, if you wanted to add or remove elements and content\
    \ dynamically, you had to resort to JavaScript, or make the changes server side\
    \ and redraw the document fragment using something like an Ajax call.\n\n> > **Note:**\
    \ Ajax is not something we'll be covering in this book, as it's deeply tied in\
    \ with JavaScript and is a quite complex subject. In general, however, an Ajax\
    \ call is the process of asking JavaScript to make a partial request to the web\
    \ server in order to get"
  merge: -1
  pgno: 57
- img_proc: true
  md: "_only a small bit of content. It's typically used as a means to get small chunks\
    \ of data and insert them into a webpage as needed, rather than downloading the\
    \ entire page in one request._\n\nWith the **before** and **after** pseudo selectors,\
    \ we can add and remove content in our HTML elements without ever touching a single\
    \ line of code, and have it all driven using pure CSS rules.\n\nStarting with\
    \ a simple example, let's imagine we have the following line in our HTML markup:\n\
    \n```\n<span class=\"bracketedLabel\">This is a bracketed Label</span>\n```\n\n\
    _Code Listing 52a: Simple span to demonstrate before and after selectors_\n\n\
    There's nothing at all special about this label; if we render it, we just get\
    \ a simple output.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_58_0.png)\n\nFigure\
    \ 40: Output from Code Listing 52a\n\nAs the name suggests, we'd like any label\
    \ with this class to have square brackets surrounding it, but we don't want to\
    \ go and find all occurrences to add them manually.\n\nSo, we can add the following\
    \ CSS rules:\n\n```\n.bracketedLabel\n{\n    color: green;\n}\n.bracketedLabel:before\n\
    {\n    content: '[';\n    color: red;\n}\n.bracketedLabel:after\n{\n    content:\
    \ ']';\n}\n```"
  merge: -1
  pgno: 58
- img_proc: true
  md: "```\ncolor: red;\n}\n```\n\n*Code Listing 52b: CSS rules required to make our\
    \ label a bracketed one*\n\nThen, when we refresh the browser output, we get the\
    \ following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_59_0.png)\n\n*Figure\
    \ 41: Our bracketed label now has brackets*\n\nBefore you all start rushing to\
    \ get the before and after selectors to add and remove HTML tags in your document,\
    \ I have to tell you that unfortunately, you can't.\n\nWhile the before and after\
    \ pseudo selectors are powerful, you're limited to plain text only. If you try\
    \ to put HTML tags in the rules, then those tags will simply be rendered as is,\
    \ complete with the tag itself as a text string.\n\nThere are a number of reasons\
    \ for this. Imagine you had an element, that via an CSS rule added an element,\
    \ which also added an element; if you weren't careful, you could very easily end\
    \ up in an infinite loop and everything would halt.\n\nCSS rules are also designed\
    \ to be parsed in one run, so any element that inserted elements that require\
    \ styling would mean having to stop, go back and reprocess the rules already seen,\
    \ then come back and continue.\n\nYou can, however, still perform some very interesting\
    \ tricks with them.\n\nOne of the better uses is the creation of customized check\
    \ boxes using nothing more than CSS3 properties and selectors. To illustrate this,\
    \ create a simple form with two checkboxes in it.\n\n```\n<form action=\"#\" method=\"\
    post\">\n    <input id=\"chkCheckboxOne\" type=\"checkbox\">\n    <label class=\"\
    checkbox\" for=\"chkCheckboxOne\"> Checkbox 1 </label><br />\n    <input id=\"\
    chkCheckboxTwo\" type=\"checkbox\">\n    <label class=\"checkbox\" for=\"chkCheckboxTwo\"\
    > Checkbox 2 </label>\n</form>\n```"
  merge: -1
  pgno: 59
- img_proc: true
  md: "# Code Listing 53: check boxes and radios ready for customization\n\nLike our\
    \ previous checkbox example, rendering this will just give us our plain form style:\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_60_0.png)\n\n# Figure 42: Just another\
    \ simple form\n\nLet's add the first of our rules, and give the checkboxes some\
    \ default styling.\n\n```\n.checkbox\n{\n  display: inline-block;\n  cursor: pointer;\n\
    \  font-size: 20px;\n  font-family: sans-serif;\n}\n\ninput[type=checkbox]\n{\n\
    \  display:none;\n}\n```\n\n# Code Listing 54a: Default styles for our checkboxes\
    \ and radio buttons\n\nIf you render the page at this point, you might be surprised\
    \ to see that we've hidden the actual controls, and just styled our label text.\
    \ We've done this because we don't want to see the original controls, and since\
    \ we can't really customize them with colors and such anyway, we just want them\
    \ to disappear so we can draw our own new ones."
  merge: -1
  pgno: 60
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_61_0.png)\n\n*Figure 43: Our checkboxes\
    \ are still there, just invisible*\n\nThe next rule we add is the **before** part\
    \ of the style sheet, but notice we're targeting the label and not the actual\
    \ checkbox element, as it's really the label that's the driver for all of this.\n\
    \n```\n.checkbox:before\n{\n  content: \"\";\n  display: inline-block;\n  width:\
    \ 18px;\n  height: 18px;\n  vertical-align: middle;\n  background-color: green;\n\
    \  color: #f3f3f3;\n  text-align: center;\n  box-shadow: inset 0px 2px 3px 0px\
    \ rgba(0, 0, 0, .3), 0px 1px 0px 0px rgba(255, 255, 255, .8);\n  border-radius:\
    \ 3px;\n}\n```\n\n*Code Listing 54b: The before part of the rules, which draws\
    \ the unchecked version of the control*\n\nRendering this, we can see that we\
    \ now have something that looks a little more like checkboxes now.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_61_1.png)\n\
    \n*Figure 44: We have green check boxes*"
  merge: -1
  pgno: 61
- img_proc: true
  md: "We're still not quite finished; we need to add one more rule, which will ensure\
    \ that we get a good-looking check symbol that appears when the control is in\
    \ a checked or selected state.\n\n```\ninput[type=checkbox]:checked + .checkbox:before\n\
    {\n    content: \"\\2713\";\n    text-shadow: 1px 1px 1px rgba(0, 0, 0, .2);\n\
    \    font-size: 15px;\n}\n```\n\n*Code Listing 54c: The final rule required to\
    \ finish off our custom checkboxes*\n\nWhen we render that, we should find we\
    \ can toggle the check boxes exactly like we used to with the default ones.\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_62_0.png)\n\n*Figure 45: The finished\
    \ custom checkboxes*\n\nThis technique can be used in many places; Bootstrap,\
    \ for example, uses it to position icons in input fields in the Bootstrap UI framework.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_62_1.png)\n\n*Figure 46: Twitter Bootstrap\
    \ uses the same method for validation icons*"
  merge: -1
