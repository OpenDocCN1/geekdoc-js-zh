    \nCSS3 也不像许多人认为的那样是“全新的 CSS”；像 HTML 5 一样，它向后兼容之前的所有版本。然而，向前看，它拥有大量令人惊叹的新功能，提供了许多以前版本中根本不存在的创造性可能性。\n\
    \n## 代码示例\n\n在我们通读本书的过程中，我将为你创建各种代码示例供你研究。这些代码示例将不提供下载，但它们足够小，可以手动输入。\n\n在大多数情况下，代码只是为了突出某个特定主题，尤其是在混合\
