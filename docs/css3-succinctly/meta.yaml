  md: 'You should end up with following:


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_100_0.png)


    *Figure 84: Windows Calculator in programmer mode*


    To convert to Hex, make sure you select **Dec** (marked "1" in Figure 84) then
    type in your value. Select **Hex** (marked "2" in Figure 84) and you''ll see the
    value to place in your color value. If your value is only one digit (from 0 to
