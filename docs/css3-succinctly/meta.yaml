  - "[PAGE 34]\n\nSo far we've covered the main base selectors. If you want to read\
    \ up on the rest of them, you can find the official documentation on the W3C site.\n\
    \nI do think a warning is in order here, though. While the official W3C documentation\
    \ is the official source of all things HTML, it's also a very difficult site to\
    \ read.\n\nThere are easier sources of information, such as Mozilla and HTML Dog.\
    \ I would strongly advise you digest those first, then visit the W3C site once\
    \ you have a better understanding of the topic.\n\n# Attribute Selectors\n\nTo\
    \ finish this chapter off, we're going to take a look at something that's been\
    \ massively expanded on in CSS3: attribute selectors.\n\nThere has been some minimal\
    \ effort to introduce a very small subset of this type of selector in previous\
    \ versions, but it went largely unnoticed, so most developers never stopped to\
    \ look at what it had to offer.\n\nIn CSS3 however, attribute selectors are all-powerful,\
    \ and allow you to do some rather smart styling of elements.\n\nFirst off, we\
    \ need to define what an attribute selector actually is.\n\nUnlike the selectors\
    \ you've seen so far, an attribute selector is not a single character construct\
    \ that sits between two targets; it's a multi-character appendage to a parent\
    \ rule, which contains its own internal processing rules.\n\nIn a small way, attribute\
    \ selectors are a little bit like having a custom set of search expressions, specifically\
    \ for hunting out elements based on the value (or part of) an attribute attached\
    \ to them.\n\nTake a look at the following HTML markup.\n\n```\n<ul>\n    <li><a\
    \ href=\"#\" rel=\"external\">External Link 1</a></li>\n    <li><a href=\"#\"\
    \ rel=\"internal\">Internal Link 1</a></li>\n    <li><a href=\"#\" rel=\"internal\"\
    >Internal Link 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link\
    \ 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link 3</a></li>\n\
    </ul>\n```\n\nCode Listing 26: HTML markup with custom attributes\n\nIn Code Listing\
    \ 26, you can see I've created a fairly standard, unordered list containing items\
    \ with anchor elements in them. It's nothing unusual, and something you'll often\
    \ see in navigation links in HTML documents."
  - "[PAGE 35]\n\nWhat I've done, however, is to use the `rel` attribute to mark up\
    \ the relation of the link, specifying if it's an external or an internal link.\n\
    \nIf we wanted to style the two different types in different ways, we could, in\
    \ theory, just add a class such as `.internal` or `.external`. However, there\
    \ may be times that HTML markup is generated inside a process over which you have\
    \ no control, so you may not be able to add classes to the output in this manner.\n\
    \nThis is where the attribute selector comes in. You can use it to target a specific\
    \ named attribute within the element, and as you'll see in just a moment, you\
    \ can use it to not only target a full string, but part of a string too.\n\nFirst,\
    \ let's have a look at how we might apply it to our previous links example. Add\
    \ the following style rules to your style sheet (assuming you've already added\
    \ the preceding HTML to your document):\n\n```\na[rel=\"external\"]\n{\n\tcolor:\
    \ red;\n}\n\na[rel=\"internal\"]\n{\n\tcolor: green;\n}\n```\n\n*Code Listing\
    \ 27: Attribute Selector rules for Code Listing 26*\n\nIf you render this in your\
    \ browser, you should see something like the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_35_0.png)\n\
    \n*Figure 15: Code Listing 26 with the CSS rules in Code Listing 27 applied to\
    \ them*\n\nJust by using two different rules, we've easily targeted the two different\
    \ types of links, simply because of the difference in the `rel` attribute.\n\n\
    A real-world example might look something like the following; change the code\
    \ in Listing 26 to read as follows:\n\n```\n<ul>\n```"
  - "[PAGE 36]\n\n```\n<li><a href=\"#\">Link 1</a></li>\n<li><a>Link 2</a></li>\n\
    <li><a>Link 3</a></li>\n<li><a href=\"#\">Link 4</a></li>\n<li><a href=\"#\">Link\
    \ 5</a></li>\n</ul>\n```\n\n# Code Listing 28: HTML markup modified from Code\
    \ Listing 26\n\nBy default, most browsers won't make a link clickable that has\
    \ no **href** attribute, and for the default styling at least, they won't be styled\
    \ using the usual blue underlining.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_0.png)\n\
    \n# Figure 16: Output from Code Listing 28 with no styling.\n\nHowever, in many\
    \ cases (especially if you're using a larger framework), you might find that anchor\
    \ tags in general have been given a uniform style to maintain a consistent look\
    \ and feel.\n\nFor example:\n\n```\na\n{\n  text-decoration: none;\n  color: green;\n\
    }\n```\n\n# Code Listing 29: Possible rule to give a uniform look and feel to\
    \ an anchor\n\nThis code might be used to apply that uniform style, and would\
    \ make our list look as follows:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_1.png)\n\
    \n# Figure 17: Code Listing 28 with a uniform style applied to the anchor element"
  - "[PAGE 37]\n\nYou can immediately see that you've lost any contextual information\
    \ that might suggest to you a link has no destination, and as a site user, you\
    \ have no idea which links are good, and which are bad.\n\nYou could go through\
    \ your code and add a `class=\"nodestination\"` to each link with a missing `href`,\
    \ but what if someone then added links to the database, and all of a sudden the\
    \ link then has a valid destination? In this case, you're faced with the task\
    \ of finding all those links that didn't have an `href`, and now do, so you can\
    \ remove the class name and restore normality.\n\nThe other way to address this\
    \ problem is to use just the attribute selector with no extra content on its own,\
    \ as follows:\n\n```\na[href]\n{\n    text-decoration: none;\n    color: green;\n\
    }\n```\n\n*Code Listing 30: Attribute rule to target only anchors that have an\
    \ href attribute*\n\nWhen we now refresh our page, we should see that we now get\
    \ different styling than we did before:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_37_0.png)\n\
    \n*Figure 18: Code Listing 28 with a uniform style, only applied to anchors with\
    \ valid destinations*\n\nNow in order to have the links styled correctly, all\
    \ you have to do is let your web application platform generate links with `href`\
    \ attributes, and leave the `href` attributes out of anything that does not yet\
    \ have a link.\n\nThere is one question remaining, however.\n\nWhat if we also\
    \ want to style the remaining elements that don't have the `href` attribute, for\
    \ example, to make them a lighter color so they perhaps look disabled?\n\nCSS3\
    \ also has this covered with a pseudo selector. We'll learn more about the new\
    \ pseudo selectors in the next chapter; for now, we can solve the styling of anchor\
    \ tags with missing `href` attributes quite simply by using the following attribute/pseudo-styling\
    \ rule:\n\n```\na:not([href])\n{\n```"
  - "[PAGE 38]\n\n```\ntext-decoration: none;\ncolor: silver;\n}\n```\n\nCode Listing\
    \ 31: Attribute rule to target only anchors that don't have an href attribute\n\
    \nIf we re-render our document after changing our style rule to match Code Listing\
    \ 31, we should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_38_0.png)\n\
    \nFigure 19: Code Listing 28 with an inverted attribute style\n\nThe following\
    \ rules take advantage of the cascading nature of CSS, and combine things logically:\n\
    \n```\na\n{\n    text-decoration: none;\n}\na[href]\n{\n    color: green;\n}\n\
    a:not([href])\n{\n    color: silver;\n}\n```\n\nCode Listing 32: Combined rules\
    \ to style links with missing href attributes automatically\n\nIn theory, we could\
    \ actually reduce that further, and just add the green color to the base anchor\
    \ rule. This would apply the green as a default, but change it to silver if no\
    \ `href` existed. The idea here is just to show what's going on in the simplest\
    \ possible terms, and expanding things out often makes concepts clearer to understand.\n\
    \nIf we render this now, we should see something like the following:"
  - "[PAGE 39]\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_39_0.png)\n\n# Figure 20:\
    \ Code Listing 28 with the combined styles applied\n\nThe main advantage to take\
    \ away from this example is that you now no longer have to worry about making\
    \ sure that a specific class is applied to a given link, making maintenance of\
    \ the document much easier and less error-prone. If you're running under a CMS\
    \ such as Umbraco or WordPress, then all you have to care about is whether links\
    \ have valid destinations or not.\n\n> Note: I've previously used an attribute\
    \ selector in this fashion inside normal paragraph text to automatically highlight\
    \ links that are in-line with the general text once they become active, and to\
    \ make them look exactly like the paragraph text when they aren't active.\n\n\
    I mentioned earlier that attribute selectors can also match on partial contents\
    \ in a given attribute. There are additions to the main selector that allow you\
    \ to check if an attribute's value begins with, ends with, or contains a given\
    \ substring.\n\nThis can be very useful in the case of external and internal links.\n\
    \nThink back to the code we saw in Code Listing 26; we used the `rel` attribute\
    \ to define an internal or external relationship on an anchor element.\n\nIn terms\
    \ of the W3C specifications, this was probably not the best way to do this, and\
    \ quite likely, the HTML would fail to validate if it were tested with an HTML\
    \ 5 validation tool.\n\nThis doesn't mean we have to go back to using a class\
    \ attribute, however.\n\nImagine for a moment that all your external links had\
    \ a fully qualified URL, and all your internal links just had a relative page\
    \ leaf. In this case, Code Listing 26 might now be re-written as follows:\n\n\
    ```\n<ul>\n  <li><a href=\"http://external.com/link1\">External Link 1</a></li>\n\
    \  <li><a href=\"internal/link1\">Internal Link 1</a></li>\n  <li><a href=\"internal/link2\"\
    >Internal Link 2</a></li>\n  <li><a href=\"http://external.com/link2\">External\
    \ Link 2</a></li>\n  <li><a href=\"http://external.com/link3\">External Link 3</a></li>\n\
    </ul>\n```\n\n# Code Listing 33: Code Listing 26 rewritten to not use rel attributes"
- md: " If you examine the difference in the **href** attributes, you'll see that\
    \ all the external links_start_with \"http://\" and the internal ones do not.\n\
    \nIf we use the \"attribute value starts with\" selector, we can now easily style\
    \ the external ones with a different color.\n\nWe can set a uniform style for\
    \ anchor tags in general, which would reflect the style for internal links by\
    \ default, then be altered if it reflected an external link.\n\nTo use the starts\
    \ with attribute selector, we specify a `^=\"...\"` between attribute name and\
    \ value, as the following rule shows:\n\n```\na[href^=\"http:\"]\n{\n    color:\
    \ red;\n}\n```\n\n*Code Listing 34: CSS style rule to change the color of attributes\
    \ that start with \"http\"*\n\nIf we apply that to the HTML markup in Code Listing\
    \ 33, and then render it in the browser, we should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_40_0.png)\n\
    \n*Figure 21: HTML from Code Listing 33 with the rule in Code Listing 34 applied\
    \ to it*\n\nNow if we add in a uniform rule as we did previously, so that links\
    \ are green by default, we end up with output that looks like the following:\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_40_1.png)\n\n*Figure 22: HTML Code\
    \ Listing 33 with the final styling in place*\n\nI'm sure you can quickly realize\
    \ how easily this could be combined with the rules to detect the presence of the\
    \ attribute and make further choices on links with no **href** attributes, too.\n\
    \nThe remaining parts of the attribute selector are the \"ends with\" and \"contains\"\
    \ selectors.\n\n\"Ends with\" comes in handy if you want to style links based\
    \ on file type. For example, you could do the following:\n\n```\n<ul>\n    <li><a\
    \ href=\"photo1.png\">Photo 1</a></li>\n    <li><a href=\"photo2.png\">Photo 2</a></li>\n\
    \    <li><a href=\"sound1.mp3\">Sound 1</a></li>\n    <li><a href=\"sound2.mp3\"\
    >Sound 2</a></li>\n    <li><a href=\"document.pdf\">Document</a></li>\n</ul>\n\
    ```\n\n*Code Listing 35: Code listing 33 rewritten to list file links*\n\nThen,\
    \ create the following rules using the **$=** attribute selector as follows:\n\
    \n```\na[href$=\".png\"]\n{\n  color: red;\n}\na[href$=\".mp3\"]\n{\n  color:\
    \ green;\n}\na[href$=\".pdf\"]\n{\n  color: blue;\n}\n```\n\n*Code Listing 36:\
    \ Ends With attribute rules to style based on file type*\n\nWhen rendered, it\
    \ should give the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_41_0.png)\n\
    \n*Figure 23: Code Listing 35 showing the output from the \"ends with\" attribute\
    \ selector*\n\nThe final attribute-based selector is the contains selector, and\
    \ does exactly as it says on the tin.\n\nIf an attribute value contains the given\
    \ substring, then **\\*** will match it.\n\nFor example, take a look at the following\
    \ set of anchor tags:\n\n```\n<ul>\n   <li><a href=\"/admin/users/list\">List\
    \ Users</a></li>\n   <li><a href=\"/admin/personal/settings\">Your Account Settings</a></li>\n\
    \   <li><a href=\"/admin/users/edit\">Edit Users</a></li>\n   <li><a href=\"/admin/users/report\"\
    >Users Report</a></li>\n   <li><a href=\"/admin/personal/profile\">Your Profile</a></li>\n\
    </ul>\n```\n\n*Code Listing 37: Code Listing 35 rewritten to demonstrate \"contains\"\
    \ attribute selector*\n\nWith the following rules:\n\n```\na[href*=\"users\"]\n\
    {\n   color: red;\n}\na[href*=\"personal\"]\n{\n   color: green;\n}\n```\n\n*Code\
    \ Listing 38: Contains string attribute rules to style based on substring*\n\n\
    This will produce the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_42_0.png)\n\
    \n*Figure 24: Output produced by Code Listing 37 with the rules in Code Listing_previous\
    \ image\n\nWhat we've covered here hasn't even scratched the surface of the potential\
    \ available, especially when it comes to attribute selectors.\n\nUnder HTML 5\
    \ there's a new attribute type called a data-attribute. This new attribute takes\
    \ the form of:\n\n**data-**\n\nfollowed by a custom name, for example:\n\n**data-username**\n\
    \n**data-recordIndex**\n\nYou can use these data attributes on any element, for\
    \ any purpose, and when combined with the correct selectors, they allow you use\
    \ HTML 5 to describe its own intentions and style easily.\n\n## Summary\n\nIn\
    \ this chapter we took a fairly deep dive into the main new selectors added in\
    \ CSS3. We've seen how we're no longer limited in how we can target our elements\
    \ to style, and how we no longer have the restrictions we used to have, allowing\
    \ almost limitless expression in our rules.\n\nIn the next chapter we'll take\
    \ a closer look at the new pseudo selectors, which, when combined with what we've\
    \ learned so far, will take the capabilities we have to new heights.\n\n## Chapter\
    \ 4  New Pseudo Selectors\n\nIn the previous chapter, we covered the new main\
    \ selectors added to CSS3. Now, we go further by exploring the new pseudo selectors\
    \ that have been added.\n\nPseudo selectors are different than the regular selectors\
    \ because they can't be used on their own. Instead, they need to be combined with\
    \ other selectors, such as those in the previous two chapters, in order to do\
    \ their job. At least, that's how they're described in the mainstream.\n\nThe\
    \ truth of the matter is that many of the pseudo selectors can now indeed be used\
    \ without any suffixing rule (as you'll see in a moment), but you do still get\
    \ the best from them when combining them with a regular selector.\n\nSome of the\
    \ selectors you'll see in this chapter are actually not new in CSS3 and have been\
    \ around quite some time. In previous versions, however, they either were not\
    \ well known, or because of the IE6/IE7/IE8 compatibility generation problems,\
    \ they were actively avoided and not used much.\n\nTo kick things off, we'll deal\
    \ with the oldest ones first.\n\n### :focus\n\nAs the name suggests, **focus**\
    \ is used when an input element has focus within a document. This is usually used\
    \ in forms to highlight the active field.\n\nLet's create a mock-up form using\
    \ the following HTML markup:\n\n```\n<form action=\"#\" method=\"post\">\n   \
    \ <label for=\"txtUserName\">User Name</label><br />\n    <input type=\"text\"\
    \ id=\"txtUserName\" name=\"txtUserName\" /><br /><br />\n    <label for=\"txtEmail\"\
    >Email</label><br />\n    <input type=\"text\" id=\"txtEmail\" name=\"txtEmail\"\
    \ /><br /><br />\n    <input type=\"submit\" value=\"Submit\" />\n</form>\n```\n\
    \n*Code Listing 39: Mock HTML form markup*\n\nThis will give us a very generic\
    \ looking HTML form.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_0.png)\n\n\
    Let's add the following simple rule to our style sheet:\n\n```\n:focus\n{\n  background-color:\
    \ beige;\n  color: green;\n}\n```\n\n*Code Listing 40: Simple Focus CSS rule*\n\
    \nIf we re-render our browser, and click into one of the form fields so that it\
    \ gets the focus, we should see that it changes to reflect the selected state.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_1.png)\n\nYou might notice in the\
    \ example that I've used **focus** on its own without extending anything. In CSS3,\
    \ many of the pseudo selectors can now be used in this manner; it simply means\
    \ apply it to anything that understands the selector.\n\nFor our example, any\
    \ element that can receive focus from the user will change its color as specified\
    \ when focus is given to it.\n\n### # A slight diversion into visited status\n\
    \nI just want to briefly break off and show another pseudo selector that's been\
    \ around since V2 of the CSS spec. It can be used alone in the same way as **focus**,\
    \ but can also be used maliciously to find out a person's browsing history.\n\n\
    If you place some external anchor tags in your document as follows:\n\n```\n<ul>\n\
    \    <li><a href=\"http://www.google.co.uk/\">Google</a></li>\n    <li><a href=\"\
    http://www.yahoo.co.uk/\">Yahoo</a></li>\n    <li><a href=\"http://msn.com\">MSN</a></li>\n\
    </ul>\n```\n\n*Code Listing 41a: External URLs*\n\nThen apply the following style\
    \ rules:\n\n```\n:link\n{\n    color: green;\n}\n\n:visited\n{\n    color: red;\n\
    }\n```\n\n*Code Listing 41b: Styles for the external URLs in 41a*\n\nWhen you\
    \ render your document, you'll see the following.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_46_0.png)\n\
    \n*Figure 27: Links rendered by Code Listing 41*\n\nYou might see that some or\
    \ even all of the links have a red color. In my case, only the Google link does,\
    \ and this is because the Google main UK site is in my browser history, whereas\
    \ the other two are not.\n\nIf you look at the CSS, you'll see that the styling\
    \ is provided by the **visited** pseudo selector, giving you, the user of the\
    \ page, instant visual confirmation that you recently visited that page."
  mdcn: "\n如果你查看 **href** 属性的差异，会发现所有外部链接都以 \"http://\" 开头，而内部链接则不是。\n\n如果我们使用“属性值以……开头”选择器，就可以轻松地为外部链接设置不同的颜色。\n\
    \n我们可以为锚标签设置统一的默认样式，这将成为内部链接的默认样式，然后在外部链接的情况下进行覆盖。\n\n要使用“以……开头”属性选择器，我们在属性名和值之间指定\
    \ `^=\"...\"`，如下面的规则所示：\n\n```\na[href^=\"http:\"]\n{\n    color: red;\n}\n```\n\
    \n*代码清单 34：CSS 样式规则，用于更改以 \"http\" 开头的属性的颜色*\n\n如果将其应用于代码清单 33 中的 HTML 标记，然后在浏览器中渲染，我们应该得到以下结果：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_40_0.png)\n\n*图 21：将代码清单 34 中的规则应用于代码清单\
    \ 33 的 HTML*\n\n现在，如果我们像之前一样添加一个统一规则，使链接默认显示为绿色，最终输出将如下所示：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498cului_40_1.png)\n\
    \n*图 22：应用了最终样式的代码清单 33 的 HTML*\n\n我相信你很快就能意识到，这可以很容易地与检测属性存在的规则结合起来，进一步对没有 **href**\
    \ 属性的链接做出处理。\n\n属性选择器剩下的部分是“以……结尾”和“包含”选择器。\n\n“以……结尾”在根据文件类型设置链接样式时非常方便。例如，你可以这样做：\n\
    \n```\n<ul>\n    <li><a href=\"photo1.png\">Photo 1</a></li>\n    <li><a href=\"\
    photo2.png\">Photo 2</a></li>\n    <li><a href=\"sound1.mp3\">Sound 1</a></li>\n\
    \    <li><a href=\"sound2.mp3\">Sound 2</a></li>\n    <li><a href=\"document.pdf\"\
    >Document</a></li>\n</ul>\n```\n\n*代码清单 35：重写的代码清单 33，用于列出文件链接*\n\n然后，使用 **$=**\
    \ 属性选择器创建以下规则：\n\n```\na[href$=\".png\"]\n{\n  color: red;\n}\na[href$=\".mp3\"\
    ]\n{\n  color: green;\n}\na[href$=\".pdf\"]\n{\n  color: blue;\n}\n```\n\n*代码清单\
    \ 36：基于文件类型的“以……结尾”属性规则*\n\n渲染后，应该得到以下结果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_41_0.png)\n\
    \n*图 23：代码清单 35 显示\"以……结尾\"属性选择器的输出*\n\n最后一个基于属性的选择器是“包含”选择器，它的作用名副其实。\n\n如果属性值包含给定的子字符串，那么\
    \ **\\*** 就会匹配它。\n\n例如，查看下面这组锚标签：\n\n```\n<ul>\n   <li><a href=\"/admin/users/list\"\
    >List Users</a></li>\n   <li><a href=\"/admin/personal/settings\">Your Account\
    \ Settings</a></li>\n   <li><a href=\"/admin/users/edit\">Edit Users</a></li>\n\
    \   <li><a href=\"/admin/users/report\">Users Report</a></li>\n   <li><a href=\"\
    /admin/personal/profile\">Your Profile</a></li>\n</ul>\n```\n\n*代码清单 37：重写的代码清单\
    \ 35，用于演示\"包含\"属性选择器*\n\n配合以下规则：\n\n```\na[href*=\"users\"]\n{\n   color: red;\n\
    }\na[href*=\"personal\"]\n{\n   color: green;\n}\n```\n\n*代码清单 38：基于子字符串的\"包含字符串\"\
    属性规则*\n\n这将产生以下输出：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_42_0.png)\n\n*图\
    \ 24：将代码清单 38 中的规则应用于代码清单 37 所产生的输出*\n\n我们 covered 的内容甚至还没有触及可用潜力的表面，尤其是在属性选择器方面。\n\
    \n在 HTML 5 中，有一种新的属性类型叫做 data-属性。这种新属性的形式为：\n\n**data-**\n\n后跟一个自定义名称，例如：\n\n\
    **-approved**\n\n**data-recordIndex**\n\n你可以在任何元素上使用这些 data 属性，用于任何目的，当与正确的选择器结合时，它们允许你使用\
    \ HTML 5 轻松地描述其自身意图并进行样式设置。\n\n## 小结\n\n在本章中，我们深入探讨了 CSS3 中新增的主要选择器。我们已经看到，在定位要设置样式的元素时，我们不再受限，也不再受过去的限制所束缚，从而可以在规则中实现几乎无限的表达。\n\
    \n在下一章中，我们将更仔细地研究新的伪选择器，当与到目前为止所学的内容结合时，它们将使我们的能力达到新的高度。\n\n## 第 4 章  新的伪选择器\n\
    \n在上一章中，我们介绍了 CSS3 中新增的主要选择器。现在，我们将进一步探索新增的伪选择器。\n\n伪选择器与普通选择器不同，因为它们不能单独使用。相反，它们需要与其他选择器（如前两章中的选择器）结合使用才能发挥作用。至少，主流观点是这样描述的。\n\
    \n事实上，许多伪选择器现在确实可以在没有任何后缀规则的情况下使用（你很快就会看到），但将它们与常规选择器结合使用时，仍然能发挥最佳效果。\n\n你在本章中看到的一些选择器实际上并不是\
    \ CSS3 中的新特性，它们已经存在相当长的时间了。然而，在以前的版本中，它们要么不为人所知，要么由于 IE6/IE7/IE8 兼容性一代的问题，人们主动避免使用它们。\n\
    \n首先，我们将从最古老的选择器开始。\n\n### :focus\n\n顾名思义，**focus** 用于输入元素在文档中获得焦点时。这通常用于表单中以高亮显示活动字段。\n\
    \n让我们使用以下 HTML 标记创建一个模拟表单：\n\n```\n<form action=\"#\" method=\"post\">\n    <label\
    \ for=\"txtUserName\">User Name</label><br />\n    <input type=\"text\" id=\"\
    txtUserName\" name=\"txtUserName\" /><br /><br />\n    <label for=\"txtEmail\"\
    >Email</label><br />\n    <input type=\"text\" id=\"txtEmail\" name=\"txtEmail\"\
    \ /><br /><br />\n    <input type=\"submit\" value=\"Submit\" />\n</form>\n```\n\
    \n*代码清单 39：模拟 HTML 表单标记*\n\n这会给我们一个非常普通的 HTML 表单。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_0.png)\n\
    \n让我们向样式表中添加以下简单的规则：\n\n```\n:focus\n{\n  background-color: beige;\n  color: green;\n\
    }\n```\n\n*代码清单 40：简单的 Focus CSS 规则*\n\n如果我们重新渲染浏览器，并点击其中一个表单字段使其获得焦点，应该会看到它变为反映选中状态的样子。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_1.png)\n\n你可能会注意到，在示例中，我单独使用了 **focus**\
    \ 而没有扩展任何内容。在 CSS3 中，许多伪选择器现在都可以这样使用；这只是意味着将其应用于任何理解该选择器的元素。\n\n对于我们的示例，任何可以从用户那里接收焦点的元素在获得焦点时都会按照指定改变其颜色。\n\
    \n### # 关于访问状态的简短题外话\n\n我想稍作停顿，展示另一个自 CSS 规范 V2 版本以来就存在的伪选择器。它可以像 **focus** 一样单独使用，但也可以被恶意利用来发现一个人的浏览历史。\n\
    \n如果你在文档中放置一些外部锚标签，如下所示：\n\n```\n<ul>\n    <li><a href=\"http://www.google.co.uk/\"\
    >Google</a></li>\n    <li><a href=\"http://www.yahoo.co.uk/\">Yahoo</a></li>\n\
    \    <li><a href=\"http://msn.com\">MSN</a></li>\n</ul>\n```\n\n*代码清单 41a：外部 URL*\n\
    \n然后应用以下样式规则：\n\n```\n:link\n{\n    color: green;\n}\n\n:visited\n{\n    color:\
    \ red;\n}\n```\n\n*代码清单 41b：针对 41a 中外部 URL 的样式*\n\n当你渲染文档时，你会看到以下内容。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_46_0.png)\n\
    \n*图 27：由代码清单 41 渲染的链接*\n\n你可能会看到一些甚至所有链接都显示为红色。就我而言，只有 Google 链接是红色的，这是因为 Google\
    \ 英国主站存在于我的浏览器历史中，而其他两个则没有。\n\n看看 CSS，你会发现样式由 **visited** 伪选择器提供，作为页面用户的你可以立即直观地确认你最近访问过该页面。\n"
