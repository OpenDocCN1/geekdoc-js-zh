    >\n    <h1 data-headersuffix=\" (Hello)\">This is the main Header</h1>\n</div>\n\
    <p>This is some dummy body text</p>\n```\n\n*Code Listing 71a: HTML markup to\
    \ demonstrate parent attributes*\n\nIf you render this, you'll get exactly the\
    \ same output as seen in Figure 97 (assuming you still have the same style rules\
    \ present). If you don't have the same styles present or have started a new file,\
    \ then you'll just get a plain black text on a white background.\n\nThe point\
    \ here is that these extra data attributes will have no meaning on anything in\
    \ the HTML or the CSS, and will be silently ignored.\n\nThis really comes in handy—especially\
    \ for a lot of the JavaScript libraries available—because it means that an HTML\
    \ developer can add custom attributes to a page, which the JavaScript code then\
    \ later processes in some way. The Bootstrap UI framework makes extensive use\
    \ of this facility so that the HTML developer creating pages never needs to know\
    \ any JavaScript. He or she just has to describe what the intention is, and the\
    \ Bootstrap library takes care of the rest.\n\nMake sure your style file is the\
    \ same as Code Listing 70b, and that you're using the HTML code in Code Listing\
    \ 71a. Render the HTML in your browser and make sure your output looks like Figure\
    \ 95.\n\nNow add the following extension rule to the style sheet (you should see\
    \ the header text change to blue):\n\n```\n.header h1:after\n{\n    content: \"\
    \ (Hiya)\";\n}\n```\n\n*Code Listing 71b: Extended header rule that puts “(Hiya)”\
    \ after the header text*\n\nRender this and make sure that the header text now\
    \ has “(Hiya)” appended to it. If it does, now change the rule so that it looks\
    \ for the data attribute named **headersuffix** and uses the parameter from that\
    \ as the source of its data.\n\n```\n.header h1\n{\n    color: attr(data-headersuffix);\n\
    }\n```\n\n*Code Listing 71c: Extended header rule that uses the data attribute\
    \ to set the text*\n\nThe result should be that the header text is now extended\
    \ using the contents of the custom data attribute present on the **h1** element\
    \ that the selector targets."
  merge: -1
  pgno: 120
- img_proc: true
  md: '![](img/d6b4d2d62fbe04b9c83d677f3498c239_121_0.png)


    *Figure 98: Our header with the text from the data attribute*


    There is, unfortunately, some bad news. If you read the spec closely, you''ll
    see that the ability to read parent attributes and place them into generated content
    fields was actually defined in CSS2.1, and the ability to use the `attr()` function
    to set properties, such as color, size, etc., was defined in CSS3. As a result,
    all major browsers can use `attr()` to set content in a `:before` or `:after`
    pseudo selector, but none of them as of yet have implemented them in a general
    property setting scenario.


    This is not to say they won''t; as many of you might know, the most popular features
    on the W3C standards track are the ones that developers request, and `attr()`
    is not getting much attention at the moment. There will come a day when this is
    finalized and the browser producers feel it''s getting enough attention to actually
    finish implementing it. For now, it''s only useable for content generation, despite
    what the documentation says.


    It is useful for one scenario, however (and one I''ve previously used it for),
    and that''s to append greetings onto headers and welcome banners that are localized
    for a given locale. Because the value is taken from an attribute, changing that
    attribute is very easy to do in JavaScript, as there are native calls to access
    data attributes.


    Another place it becomes useful is in printing. If you have a style sheet that''s
    used only when a page is printed, you can use this to grab the contents of an
    `href` from an anchor element, then print it out after the anchor tag. Doing this
    means that pages with links printed to a PDF or onto paper are still visible,
    while the ones on screen remain clickable.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# # Summary


    In this chapter we''ve learned how to generate arbitrary content using nothing
    more than CSS rules, a task that previously required a large amount of JavaScript
    to get right. We''ve learned a bit more about how data attributes work and how
    we might use them to hold custom content.


    In the next chapter we''ll do a roundup of some of the things we didn''t have
    space to cover, and a few of the smaller, new rules.'
  merge: -1
  pgno: 122
- img_proc: true
  md: "# Chapter 9 The Mixed Bag of Tricks\n\nAnd so we come to the last chapter of\
    \ the book.\n\nIt's always sad when you reach the end of a book like this, especially\
    \ on a subject as diverse as CSS3, but this is not the end. In fact, we couldn't\
    \ be further away from the end—we're still just beginning this adventure.\n\n\
    What I've shown you so far is only the tip of the iceberg. If you're in any doubt,\
    \ take a look at the main CSS index on the [Mozilla Developer Network](https://developer.mozilla.org/).\
    \ I haven't even begun to explore CSS Layout or CSS Animation yet; both of these\
    \ topics would easily take up a full book all of their own, as would an exhaustive\
    \ rule/property followed by description list style text.\n\nHowever, books in\
    \ the *Succinctly* series are designed to be compact and easy-to-read with just\
    \ enough information to get you in the right direction, and it's always a difficult\
    \ decision to decide what to leave out.\n\nAs with any new technology, the best\
    \ way to learn it is to play with it. Playing is an invaluable skill and learning\
    \ tool that often gets lost in the modern-day IT industry with tight deadlines\
    \ and tricked-out release schedules. What I hope I've presented here is enough\
    \ information to at least prevent you from having to waste time understanding\
    \ what it is you're playing with.\n\nFor the rest of this chapter, I'm going to\
    \ round things off with a few notable mentions of easy-to-understand CSS3 functionality\
    \ that I felt deserve a mention.\n\n# CSS Columns\n\nWe've all been there, tearing\
    \ our hair out trying to get the column widths just perfect so we can get a nice\
    \ and balanced multiple-column layout in our page design.\n\nHours are spent tweaking,\
    \ measuring, and tweaking again until we get an almost-perfect combination of\
    \ rules and content. Then someone decides to drop an image in the sidebar that\
    \ pushes things out by 1 pixel, and BAM! The entire layout crumbles into a smoldering\
    \ heap.\n\nWell this should no longer affect you, thanks to CSS columns.\n\nCreate\
    \ a **div** with a very long paragraph of text, something like the following:\n\
    \n```\n<div class=\"container\">\n    <p>Lorem ipsum dolor sit amet, consectetur\
    \ adipiscing elit. Maecenas pellentesque urna nec eros ornare, ac tristique diam\
    \ porta. Donec fermentum velit eget dignissim condimentum. Sed rutrum libero sit\
    \ amet enim viverra tristique. Mauris ultricies ornare arcu non adipiscing. Sed\
    \ id ipsum vitae libero facilisis pulvinar id nec lacus. Ut lobortis neque et\
    \ luctus mattis. Morbi nunc diam, elementum rutrum tellus non, viverra mattis\
    \ diam. Vestibulum sed arcu tincidunt, auctor ligula ut, feugiat nisi. Phasellus\
    \ adipiscing eros ut iaculis sagittis. Sed</p>\n</div>\n```"
  merge: -1
  pgno: 123
- img_proc: true
  md: "```\nposuere vehicula elit vel tincidunt. Duis feugiat feugiat libero bibendum\
    \ consectetur. Ut in felis non nisl egestas lacinia. Fusce interdum vitae nunc\
    \ eget elementum. Quisque dignissim luctus magna et elementum. Cum sociis natoque\
    \ penatibus et magnis dis parturient montes, nascetur ridiculus mus. Sed nunc\
    \ lorem, convallis consequat fermentum eget, aliquet sit amet libero.</p>\n</div>\n\
    ```\n\n*Code Listing 72: A nice, long paragraph of text inside a div element*\n\
    \nIf you render this, you should see something like:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_124_0.png)\n\
    \nIt's certainly not the nicest of layouts, but if you resize the display, it'll\
    \ flow and word wrap correctly. If you wanted to split it up into three columns\
    \ (like a newspaper might), you'd have a rather difficult job on your hands.\n\
    \nYou'd almost definitely need to use JavaScript, because you'd need to work out\
    \ how much text could fit into each box. Then you'd need to make sure the columns\
    \ were resized appropriately, a task which **calc()** could help you with—but\
    \ it's still a lot of work.\n\nInstead, you could use the CSS3 columns rule. Add\
    \ the following two rules to a style sheet and attach them to the previous HTML.\n\
    \n```\n.container\n{\n    width: 500px;\n    margin: 0 auto;\n}\n```"
  merge: -1
  pgno: 124
- img_proc: true
  md: "```\n.container p\n{\n    -moz-columns:3;\n    -webkit-columns:3;\n    columns:3;\n\
    }\n```\n\nCode Listing 73: CSS rules to enable multi-column layout\n\nRendering\
    \ this instantly takes care of the layout and the flow for you. Notice, however,\
    \ that this rule still requires vendor prefixes, and while the general layout\
    \ works, some of the extended rules in the module are either incomplete or not\
    \ yet implemented. You can find the full details [here](here).\n\nIf you have\
    \ a compatible browser, then rendering the HTML in Code Listing 72 with the rules\
    \ in Code Listing 73 should give you this:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_125_0.png)\n\
    \nFigure 100: Multi-column layout made easy\n\n# CSS Transformations\n\nWhile\
    \ transformations are yet another topic that could fill an entire book, there\
    \ are some basics that are easy to experiment with. Create an HTML document and\
    \ add the following markup and CSS rules to it:\n\n```\n<div class=\"transDiv\"\
    >\n    <p>I'm a div ready to be transformed.</p>\n</div>\n\nbody\n{\n    background-color:\
    \ aliceblue;\n    font-family: sans-serif;\n}\n\n.transDiv\n{\n    width: 200px;\n\
    }\n```"
  merge: -1
  pgno: 125
- img_proc: true
  md: "```\nheight: 200px;\nbackground-color: beige;\nborder: 1px solid black;\npadding:\
    \ 4px;\nmargin-left: auto;\nmargin-right: auto;\n}\n```\n\n*Code Listing 74: HTML\
    \ and CSS rules to create a beige, centered div*\n\nWhen rendered, this should\
    \ give you the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_126_0.png)\n\
    \n*Figure 101: It's just a standard, beige div*\n\nNow add the following extended\
    \ rule to the style sheet and re-render the output:\n\n```\n.transDiv\n{\n   \
    \ transform: rotate(45deg);\n    -webkit-transform: rotate(45deg);\n}\n```\n\n\
    *Code Listing 75: Extended CSS rule to rotate our div*\n\nYou should have a **div**\
    \ rotated at 45 degrees:"
  merge: -1
  pgno: 126
- img_proc: true
  md: '![](img/d6b4d2d62fbe04b9c83d677f3498c239_127_0.png)


    # Figure 102: Our div is now rotated.


    As with CSS columns, there is still one case where vendor prefixes are needed,
    and that''s on Safari. IE, Firefox, and Chrome all work without needing prefixes
    in current versions.


    You can also apply the following:


    +   - `scale(x,y)`

    - `scalex(value)`

    - `scaley(value)`

    - `skewx(value)`

    - `skewy(value)`

    - `translate(x,y)`

    - `translatex(value)`

    - `translatey(value)`


    The actual definition of each function''s purpose can be found on MDN, but scale
    allows you to grow and shrink an element, skew allows you slope, an element and
    translate allows you to move an element. There are others that allow you to produce
    all kinds of great effects, and many of these properties can be animated, too,
    allowing even more to be achieved.


    There''s still more, such as multiple backgrounds, layered elements, 3D transforms,
    flex boxes, CSS shapes, and the list goes on.


    For now, however, I hope you''ve learned a little of the power you now hold in
    your browser. When this is combined with the new element types, layout possibilities,
    and JavaScript API''s available in the full HTML 5 spec, it''s easy to see how
    far the HTML platform has progressed.


    It wasn''t that long ago that most websites were still fairly static and black
    and white; now we''re starting to see some truly amazing visual affects being
    made possible, with developers every day finding new and engaging ways of bending
    this functionality.'
  merge: -1
  pgno: 127
- img_proc: true
  md: It's a platform that's only going to get better, and one that's destined to
    become the universal user interface for most software. CSS3 is something that
    every web developer needs to learn both now and for the future—if you don't, then
    you risk getting left behind.
  merge: -1
