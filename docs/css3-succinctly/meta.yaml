- md: "## Chapter 9  The Mixed Bag of Tricks\n\nCSS Columns\n\nCSS Transformations\n\
    \n# The Story behind the *Succinctly* Series of Books\n\nDaniel Jebaraj, Vice\
    \ President\nSyncfusion, Inc.\n\n## Staying on the cutting edge\n\nAs many of\
    \ you may know, Syncfusion is a provider of software components for the Microsoft\
    \ platform. This puts us in the exciting but challenging position of always being\
    \ on the cutting edge.\n\nWhenever platforms or tools are shipping out of Microsoft,\
    \ which seems to be about every other week these days, we have to educate ourselves,\
    \ quickly.\n\n## Information is plentiful but harder to digest\n\nIn reality,\
    \ this translates into a lot of book orders, blog searches, and Twitter scans.\n\
    \nWhile more information is becoming available on the Internet and more and more\
    \ books are being published, even on topics that are relatively new, one aspect\
    \ that continues to inhibit us is the inability to find concise technology overview\
    \ books.\n\nWe are usually faced with two options: read several 500+ page books\
    \ or scour the web for relevant blog posts and other articles. Just as everyone\
    \ else who has a job to do and customers to serve, we find this quite frustrating.\n\
    \n## The *Succinctly* series\n\nThis frustration translated into a deep desire\
    \ to produce a series of concise technical books that would be targeted at developers\
    \ working on the Microsoft platform.\n\nWe firmly believe, given the background\
    \ knowledge such developers have, that most topics can be translated into books\
    \ that are between 50 and 100 pages.\n\nThis is exactly what we resolved to accomplish\
    \ with the *Succinctly* series. Isn't everything wonderful born out of a deep\
    \ desire to change things for the better?\n\n## The best authors, the best content\n\
    \nEach author was carefully chosen from a pool of talented experts who shared\
    \ our vision. The book you now hold in your hands, and the others available in\
    \ this series, are a result of the authors' tireless work. You will find original\
    \ content that is guaranteed to get you up and running in about the time it takes\
    \ to drink a few cups of coffee.\n\n## Free forever\n\nSyncfusion will be working\
    \ to produce books on several topics. The books will always be free. Any updates\
    \ we publish will also be free.\n\n## Free? What is the catch?\n\nThere is no\
    \ catch here. Syncfusion has a vested interest in this effort.\n\nAs a component\
    \ vendor, our unique claim has always been that we offer deeper and broader frameworks\
    \ than anyone else on the market. Developer education greatly helps us market\
    \ and sell against competing vendors who promise to “enable AJAX support with\
    \ one click,” or “turn the moon to cheese!”\n\n## Let us know what you think\n\
    \nIf you have any topics of interest, thoughts, or feedback, please feel free\
    \ to send them to us at [succinctly-series@syncfusion.com](mailto:succinctly-series@syncfusion.com).\n\
    \nWe sincerely hope you enjoy reading this book and that it helps you better understand\
    \ the topic of study. Thank you for reading.\n\nPlease follow us on Twitter and\
    \ “Like” us on Facebook to help us spread the word about the *Succinctly* series!\n\
    \n# About the Author\n\nAs an early adopter of IT back in the late 1970s to early\
    \ 1980s, I started out with a humble little 1k Sinclair ZX81 home computer.\n\n\
    Within a very short space of time this small 1k machine became a 16k Tandy TRS-80,\
    \ followed by an Acorn Electron, and eventually, after going through many other\
    \ machines, a 4mb arm powered Acorn A5000.\n\nEventually, after leaving school\
    \ and getting involved with DOS-based PCs, I went on to train in many different\
    \ disciplines in the computer networking and communications industries.\n\nAfter\
    \ returning to university in the mid-1990s and gaining a BSc in Computing for\
    \ Industry, I started my own consulting business in the northeast of England called\
    \ Digital Solutions Computer Software Ltd. I advise clients at both hardware and\
    \ software levels in many different IT disciplines, covering a wide range of domain-specific\
    \ knowledge from mobile communications and networks right through to geographic\
    \ information systems, banking and finance, and web design.\n\nWith over 30 years\
    \ of experience in the IT industry within many differing and varied platforms\
    \ and operating systems, I have a lot of knowledge to share.\n\nYou can often\
    \ find me hanging around in the LIDNUG .NET users group on LinkedIn that I help\
    \ run, and you can easily find me in places such as Stack Overflow and Code Project,\
    \ or on Twitter as @shawty\\_ds. I'm also a Pluralsight author and produce various\
    \ videos that are viewable online.\n\nI hope you enjoy the book, and learn something\
    \ new from it. In today's fast-moving world of IT, we already have little time\
    \ to spare trying to find the information we need—these books hopefully help reduce\
    \ that burden on time.\n\nPlease remember to thank Syncfusion (@Syncfusion on\
    \ Twitter) for making this book (and others in the range) possible, allowing people\
    \ like me to share our knowledge with the .NET community at large. If you have\
    \ ideas for a book, please reach out to Syncfusion and let them know what you'd\
    \ like to see. The *Succinctly* series is a brilliant idea for busy programmers.\n\
    \n# Chapter 1  What is CSS3?\n\nIf you've been a web developer for any length\
    \ of time, then CSS won't be strange to you. You might, however, be wondering\
    \ what the fuss over CSS3 is all about.\n\nJust like the new HTML 5 specifications,\
    \ CSS3 (or CSS Version 3, to be more precise) is the latest set of specifications\
    \ designed to mold, shape, and define just what capabilities the newest version\
    \ of CSS has.\n\nTo get the most from CSS3, you do need to have a general understanding\
    \ of the concept of CSS first. Chapter 2 will cover a very basic refresher to\
    \ help with this, but if you've never used CSS in any way, then you might feel\
    \ a little lost reading this book, as it does assume that you have at least a\
    \ passing familiarity with the technology.\n\nCSS3 is also not a \"new CSS\" as\
    \ many people think; like HTML 5, it's backwardly compatible with everything that's\
    \ come before it. Going forward, however, there's an amazing amount of new functionality,\
    \ allowing a multitude of creative possibilities that simply did not exist in\
    \ previous versions.\n\n## Code Samples\n\nAs we make our way through the book,\
    \ I'll be creating various code samples for you to study. These code samples won't\
    \ be available for download, but they will be small enough to type in by hand.\n\
    \nIn most cases the code will be given only to highlight a specific topic, especially\
    \ in the case of mixed CSS and HTML code. With the HTML code (unless it's a quite\
    \ complex example) in general, I'll just describe what's needed, then show the\
    \ CSS code as a code sample.\n\nBecause of this, I will be assuming that the reader\
    \ understands HTML, how it's structured, and how to create standard simple HTML\
    \ tags and elements. If you do not, then I strongly advise that you read at least\
    \ some background material on the subject before you proceed any further with\
    \ this book.\n\nTo try and make things somewhat easier, however, the following\
    \ HTML code should serve as a very minimal example of an HTML 5 standards document.\
    \ This is by no means a complete example; its purpose is to provide a boilerplate\
    \ starting point for other code in the book.\n\nAll the examples I present throughout\
    \ this book will make an assumption that you're using a similar piece of code,\
    \ and will seek to build on top of that code.\n\n```\n<!doctype html>\n<html>\n\
    <head>\n    <title>Basic HTML 5 document</title>\n    <link href=\"styles.css\"\
    \ rel=\"stylesheet\" type=\"text/css\" />\n```"
  mdcn: "\n## 第9章  各种技巧大杂烩\n\nCSS 多列布局\n\nCSS 变换\n\n#  *Succinctly* 系列书籍背后的故事\n\n\
    Daniel Jebaraj，副总裁\nSyncfusion, Inc.\n\n## 站在技术前沿\n\n正如大家可能知道的那样，Syncfusion 是\
    \ Microsoft 平台的软件组件提供商。这使我们处于一个既令人兴奋又充满挑战的位置——始终站在技术前沿。\n\n每当 Microsoft 发布新的平台或工具时（如今似乎每隔一周就有一次），我们都必须快速地自我学习，跟上步伐。\n\
    \n## 信息丰富却更难消化\n\n实际上，这意味着要订购大量书籍、搜索博客和浏览 Twitter。\n\n尽管互联网上可用的信息越来越多，出版的书籍也越来越多（甚至是一些相对较新的话题），但有一个方面一直困扰着我们，那就是难以找到简明扼要的技术概述书籍。\n\
    \n我们通常面临两种选择：阅读几本超过500页的大部头，或者在网上搜寻相关的博客文章和其他资料。就像其他所有有工作要做、有客户要服务的人一样，我们发现这相当令人沮丧。\n\
    \n## *Succinctly* 系列\n\n这种挫败感转化为一种强烈的愿望，即创作一系列针对在 Microsoft 平台上工作的开发者的简明技术书籍。\n\
    \n我们坚信，考虑到这些开发者的背景知识，大多数主题都可以转化为50到100页之间的书籍。\n\n这正是我们决心通过 *Succinctly* 系列来完成的目标。一切美好的事物不都是源于改变现状、使其变得更好的深切渴望吗？\n\
    \n## 最佳的作者，最好的内容\n\n每位作者都是从一群与我们有着共同愿景的才华横溢的专家中精心挑选出来的。你现在手中的这本书，以及本系列中的其他书籍，都是作者们不知疲倦工作的成果。你会发现其中的原创内容保证能让你在喝几杯咖啡的时间里就快速上手并运行起来。\n\
    \n## 永久免费\n\nSyncfusion 将致力于出版多个主题的书籍。这些书籍将永远免费。我们发布的任何更新也将是免费的。\n\n## 免费？有什么猫腻吗？\n\
    \n这里没有任何猫腻。Syncfusion 在这项工作中有着既得利益。\n\n作为组件供应商，我们独特的主张一直是我们提供比市场上任何人都更深入、更广泛的框架。开发者教育极大地帮助我们向那些承诺“一键启用\
    \ AJAX 支持”或“把月亮变成奶酪！”的竞争对手进行市场营销和销售。\n\n## 告诉我们你的想法\n\n如果你有任何感兴趣的主题、想法或反馈，请随时通过\
