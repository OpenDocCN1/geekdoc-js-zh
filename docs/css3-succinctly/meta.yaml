    \ each **div** in the HTML in Code Listing 62a, as follows:\n\n```\n<div class=\"\
    niceDiv topLeftShadow\">\n    <p>This is a nice div with drop shadows</p>\n</div>\n\
    <div class=\"niceDiv bottomLeftShadow\">\n    <p>This is a nice div with drop\
    \ shadows</p>\n</div>\n<div class=\"niceDiv bottom versatility amazing versality\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\
    \ topRightShadow\">\n    <p>This is a nice div with drop shadows</p>\n</div>\n\
    ```\n\nCode Listing 62c: Adding the four drop-shadow classes to our divs\n\nJust\
    \ in case you're wondering what's going on here, we're using the cascading nature\
    \ of CSS to our advantage so that we don't have to type out the basic beige **div**\
    \ style four times in each of the four rules; doing things this way means less\
    \ typing and better re-use.\n\nIf we re-render that, you should now see that we\
    \ have four default, blocky drop shadows for each of the directions on each of\
    \ our **div** elements.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_82_0.png)\n\
    \nFigure 64: Our div elements with default drop shadows\n\nThe default settings\
    \ for drop shadows, however, are very bold and solid; changing this is where the\
    \ remaining two optional measurements come into the equation.\n\nThe first value\
    \ is the blur radius; you can't use negative values on this, but any positive\
    \ values you supply blur the shadow out further and further, giving a much softer\
    \ appearance with each increasing value.\n\nChange the rules in Code Listing 62b\
    \ as follows:"
  - "[PAGE 83]\n\n```\n.niceDiv.topLeftShadow\n{\n  box-shadow: -10px -10px 5px;\n\
    }\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow: -10px 10px 5px;\n}\n\n.niceDiv.bottomRightShadow\n\
    {\n  box-shadow: 10px 10px 5px;\n}\n\n.niceDiv.topRightShadow\n{\n  box-shadow:\
    \ 10px -10px精神障碍 5px;\n}\n```\n\n> Code Listing 62d: CSS rules changed to blur\
    \ the shadows\n\nThe re-render your test HTML document, you should now see the\
    \ shadows become slightly softer.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_83_0.png)\n\
    \n> Figure 65: Our div elements with a small blur added\n\nThe larger you make\
    \ the blur, the softer the shadow's edge will be.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_83_1.png)\n\
    \n> Figure 66: Our div elements with a 30px blur radius\n\nThe fourth parameter\
    \ controls how much the blur spreads away from the edge, and is called the spread\
    \ radius."
  - "[PAGE 84]\n\nIf we add 10 pixels onto the blur radius, our shadow will grow to\
    \ a total of 20 pixels (we already have a 10-pixel offset), but the final 10 pixels\
    \ will be used for the blur and its associated fadeout. Change the shadow rules\
    \ as follows:\n\n```\n.niceDiv.topLeftShadow\n{\n    box-shadow: -10px -10px 30px\
    \ 10px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow: -10px 10px 30px 10px;\n\
    }\n\n.niceDiv.bottomRightShadow\n{\n    box-shadow: 10px 10px 30px 10px;\n}\n\n\
    .niceDiv.topRightShadow\n{\n    box-shadow: 10px -10px 30px 10px;\n}\n```\n\n\
    > Code Listing 62e: CSS rules changed to blur the shadows\n\nThen re-render, and\
    \ you should get some very large, very fuzzy shadows with very soft edges:\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_84_0.png)\n\n> Figure 67: Our div elements\
    \ with an optional spread radius applied\n\nGetting the right-looking value for\
    \ the optional values can be very much a case of trial and error, but generally,\
    \ the larger the spread radius, the more space the blur has to fade things out,\
    \ and so can make a smoother transition.\n\n> **Note: If you have some specific\
    \ Z-ordering (that is, if you're using div layers), then it is possible to cast\
    \ a shadow onto sibling elements. For this reason it's usually better to try and\
    \ keep drop shadows as low in the stack of elements as possible, or size the blurs\
    \ and offsets so that things stay within any margins you have defined on the element.**\n\
    \nThe final value is the color value, and like any other color property on an\
    \ element, this can take any standard color value. For now we'll just use the\
    \ standard 6-digit # symbol way of specifying color, as we'll be taking a closer\
    \ look at defining colors in the next chapter."
  - "[PAGE 85]\n\nAlter your rules so that they look as follows:\n\n```\n.niceDiv.topLeftShadow\n\
    {\n    box-shadow: -10px -10px 20px 5px #FF0000;\n}\n\n.niceDiv.bottomLeftShadow\n\
    {\n    box-shadow: -10px 10px 20px 5px #00FF00;\n}\n\n.niceDiv.bottomRightShadow\n\
    {\n    box-shadow: 10px 10px 20px 5px #0000FF;\n}\n\n.niceDiv.topRightShadow\n\
    {\n    box-shadow: 10px -10px 20px 5px #FFFF00;\n}\n```\n\n*Code Listing 62e:\
    \ CSS rules changed to color the shadows*\n\nWhen the HTML is reloaded, you should\
    \ see your shadows are now much brighter, more colorful, and nicer looking.\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_85_0.png)\n\n*Figure 68: Our shadows\
    \ are now much more colorful*\n\nYou can make the shadow appear inside the element\
    \ (rather than outside as we have been doing) by specifying the optional **inset**\
    \ keyword on the rule. If you use inset, however, you must supply it before any\
    \ values. Alter our rules one last time:\n\n```\n.niceDiv.topLeftShadow\n{\n \
    \   box-shadow: inset -10px -10px 20px 5px #FF0000;\n}\n```"
  - "[PAGE 86]\n\n```\n.niceDiv.bottomLeftShadow\n{\n  box-shadow: inset -10px 10px\
    \ 20px 5px #00FF00;\n}\n\n.niceDiv.bottomRightShadow\n{\n  box-shadow: inset 10px\
    \ 10px 20px 5px #0000FF;\n}\n\n.niceDiv.topRightShadow\n{\n  box-shadow: inset\
    \ 10px -10px 20px 5px #FFFF00;\n}\n```\n\nCode Listing 62e: CSS rules changed\
    \ to inset the shadows\n\nAnd re-render to see the effect.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_86_0.png)\n\
    \nFigure 69: Our div elements with inset shadows\n\n# Drop shadows on text\n\n\
    CSS3 also supports adding drop shadows to regular text elements. When you do this,\
    \ the shape of the shadow will follow the shape of the text rather that it just\
    \ being the outline of the element's border.\n\nThe difference here is that while\
    \ the parameters are the same (more or less), they are specified in a much different\
    \ order to the parameters for box-shadow.\n\nWhen specifying a text shadow, the\
    \ rule is laid out as follows:\n\n```\ntext-shadow: <color> <offsetx> <offsety>\
    \ <blurRadius>\n```\n\nText shadows don't support spread radius, and the color\
    \ has to come first in the list rather than last."
  - "[PAGE 87]\n\nBy way of a quick example, add the following HTML to your document:\n\
    \n```\n&lt;h1&gt;Drop Shadow Text&lt;/h1&gt;\n```\n\n*Code Listing 63a: HTML to\
    \ demo drop shadow text*\n\nThen add the following style rule:\n\n```\nh1\n{\n\
    \  text-shadow: red 10px 10px 10px;\n}\n```\n\n*Code Listing 63b: CSS rule to\
    \ add a drop shadow to our text in code 63a*\n\nYou should end up with something\
    \ like Figure 70:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_87_0.png)\n\n*Figure\
    \ 70: Text with a red drop shadow*\n\nThe parameters work the same way as for\
    \ the box shadow, so we'll not go into any lengthy descriptions; instead, I'll\
    \ leave it as an exercise to the reader to experiment.\n\nThe last thing you need\
    \ to know about both shadow rules is that you can add multiple shadow declarations\
    \ to an element, separated by a comma.\n\nWhen you do this, the effect will be\
    \ a cumulative one, and any shadows that overlay each other will be drawn front\
    \ to back in the order they are specified in the CSS rule. This can be used to\
    \ create some rather strange halo-like effects around elements. Remember, however,\
    \ to use them sparingly: even though browsers these days might be getting faster,\
    \ effects like this still take power and CPU energy to draw, and a mobile device\
    \ user might not thank you for draining their device battery all in the name of\
    \ looking pretty.\n\n# ## Graduated Fills\n\nI'm sure that at some stage in your\
    \ development of HTML documents you've come across the need for a graduated fill\
    \ of some description in the design of a page."
- md: "It could be a subtle change in color, or a very bold change in a short amount\
    \ of space. A correctly used graduation of color can make a lot of difference.\n\
    \nAs with many graphical effects, in the past you would generally have resorted\
    \ to an image-editing package such as Photoshop to create the color graduation.\
    \ Then you would have applied the resulting graduation as a background image and\
    \ repeated it as needed to cover the full size of the element you were targeting.\n\
    \nWith CSS3 you can now use a gradient fill type to create color ranges on the\
    \ fly without ever using an image editor ever again.\n\nNotice in the previous\
    \ paragraph I called the gradient fill a \"type.\" Unlike everything we've seen\
    \ so far, graduated fills are not a rule all of their own, as shadows and curved\
    \ borders are. They are in fact a type of image that the CSS engine creates for\
    \ us, and are typically (but not always) used with any rule where you might normally\
    \ specify an image.\n\nThis means that you don't have rules in your style sheet\
    \ called gradient rules; instead, you create CSS rules for a given target using\
    \ normal CSS properties such as color, background-color, background-image, and\
    \ many others. Then you replace or override all or part of the rules already defined\
    \ with the areas you wish to apply a gradient to.\n\nThis is important for backward\
    \ compatibility, because it means that you'll always have a fall back, which means\
    \ CSS color gradients are one of the many new things you can use without having\
    \ to do anything too special to support older browsers.\n\nIn typical usage, you\
    \ would create your rule (remembering specificity order) to style an element in\
    \ a way that looks good for the older browsers. Then you'd either add class-specific\
    \ selectable rules to extend the original rule, or you'd add the gradient generators\
    \ towards the bottom of the rule in question after the basic properties had already\
    \ been set.\n\nProducing gradients in this manner allows the CSS engine in your\
    \ browser to do all the hard work for you, meaning no polyfills or JavaScript\
    \ hacks to provide backwards compatibility.\n\nNow that you know the basics, let's\
    \ see how we can apply it.\n\nFirst we need some HTML markup to play with, so\
    \ let's create a simple, single **div** and put it in an HTML document.\n\n```\n\
    <div class=\"gradDiv\">\n    <p>I'm a div with a gradient</p>\n</div>\n```\n\n\
    *Code Listing 64a: HTML for our graduated fills*\n\nLet's also define the following\
    \ rule as a starting point to experiment with:\n\n```\n.gradDiv\n{\n    width:\
    \ 200px;\n    height: 200px;\n    background-color: salmon;\n    padding: 4px;\n\
    \    border: 1px solid black;\n    display: inline-block;\n    margin: 15px;\n\
    }\n```\n\n*Code Listing 64b: Basic style for our graduated div*\n\nThe initial\
    \ render of this should look as follows:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_89_0.png)\n\
    \n*Figure 71: Our un-graduated div element*\n\nGradients come in three types:\
    \ linear, radial, and repeating, each with its own syntax and format.\n\n> Note:\
    \ Until quite recently, many of the major browsers used vendor prefixes to define\
    \ things like gradients. Thankfully, all of them now support un-prefixed versions\
    \ of gradient fills, and each browser has settled on using a standard syntax.\
    \ If you're tasked with supporting older browsers (and by older here I mean moderately\
    \ old: IE9, FF20, etc.), then you might find that you need to specify gradient\
    \ fills (and for that matter, other CSS3 features, too) more than once, and in\
    \ several different forms. Throughout this book, I'm keeping to properties and\
    \ functionality that can be used in an un-prefixed manner to keep things simple.\
    \ Gradient fills have one extra bite that you need to watch for: the actual syntax\
    \ to specify a fill is drastically different between the different prefixed versions,\
    \ and only standardised non-prefixed versions.\n\nWe'll start with the simplest\
    \ of these, a linear gradient.\n\nAdd the following to your style file (but don't\
    \ replace the rule we already defined):\n\n```\n.gradDiv\n{\n    background-image:\
    \ linear-gradient(red, yellow);\n}\n```\n\n> Code Listing 64b: Extension to the\
    \ style for our graduated div\n\nWhen you render that in your browser, you should\
    \ see it change to:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_90_0.png)\n\n\
    > Figure 72: Our first graduated div\n\nAs you can see, the linear gradient is\
    \ very simple to use. We've told the CSS engine to start at red and end at yellow,\
    \ and it does just that, creating an equal gradient across the entire size of\
    \ the target element.\n\nWe can also change the direction by using the **to**\
    \ keyword. Change the rule in 64b so that it reads as follows:\n\n```\n.gradDiv\n\
    {\n    background-image: linear-gradient(to left, red, yellow);\n}\n```\n\n> Code\
    \ Listing 64c: CSS rule with a direction change\n\nWhen we refresh the HTML, we\
    \ should find that our gradient now starts at the right and goes toward the left.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_91_0.png)\n\n*Figure 73: Our gradient\
    \ now runs right to left*\n\nYou can combine the directions such that you can\
    \ have \"to top left\" or \"to bottom right,\" allowing you to graduate from corner\
    \ to corner rather than just top to bottom or left to right.\n\nYou can also provide\
    \ an angle. For example:\n\n```\n.gradDiv\n{\n    background-image: linear-gradient(30deg,\
    \ red, yellow);\n}\n```\n\n*Code Listing 64d: CSS rule with a direction change*\n\
    \nThis will give you a gradient traveling from red to yellow at an angle of 30\
    \ degrees of the 0 axis.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_91_1.png)\n\
    \n*Figure 74: Our gradient at 30 degrees*\n\n> Note: Depending how far back you\
    \ need to support, you might still need to use vendor prefixes. I've noted that\
    \ the vendor-prefixed versions use different syntax to specify the gradients.\
    \ What I haven't yet mentioned, however, are how the rotations are calculated.\
    \ Standard syntax sees 0 degrees at the middle bottom of the target element, with\
    \ positive increments from 0 to 360 degrees traveling clockwise. You can see this\
    \ in the 30 degree rotation in the previous example as the red starts from the\
    \ lower-left corner. In the browser-prefixed versions, two different schemes were\
    \ used—the standard as it is now, and one where 0 degrees was middle right with\
    \ positive rotations going counterclockwise from 0 to 360.\n\nLinear gradients\
    \ can also contain more than two colors; in fact, they can contain as many colors\
    \ as you want. Remember those rainbow-colored backgrounds folks used to be so\
    \ passionate about? Try the following extended CSS rule.\n\n```\nbackground-image:\
    \ linear-gradient(red, orange, yellow, green, blue, indigo, violet);\n```\n\n\
    *Code Listing 64d: CSS rule with distinct rainbow*\n\nRendering that in your browser\
    \ might just hurt your eyes!\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_92_0.png)\n\
    \n*Figure 75: Our div now looks like a rainbow*\n\nYou'll notice that the color\
    \ spread is still evenly distributed across the height of the element. We can\
    \ change that easily using color stops.\n\nIf you've ever used an image editor\
    \ like Photoshop or Gimp, then you'll most likely know what color stops are. They\
    \ are set values that tell the graphics engine to change color at a given point\
    \ in the scale.\n\nTo demonstrate what I mean, change your extension rule so it\
    \ reads as follows:\n\n```\n.gradDiv\n{\n    color: white;\n    background-image:\
    \ linear-gradient(black 0%, black 20%, green 30%, black 40%, black 100%);\n}\n\
    ```\n\n*Code Listing 64e: CSS rule now using color stops*\n\nYou should find that\
    \ when you render your HTML now, you have a black background with a graduated\
    \ green bar across it.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_93_0.png)\n\
    \n*Figure 76: Our div now looks rather dark*\n\nYou can specify the stops using\
    \ any value type you like, but for ease of reading I would recommend you stick\
    \ to percentage values, especially if you need to finely control the values as\
    \ I've done in Figure 76.\n\n## Radial Gradients\n\nLike linear gradients, radials\
    \ start at a defined point (usually the center of the element) and produce the\
    \ color graduation in an outward motion. They take also the same set of color\
    \ settings (and color stops) as linear gradients do.\n\nStarting with a simple\
    \ example (and re-using the HTML from the previous section), change your CSS rule\
    \ as follows:\n\n```\n.gradDiv\n{\n    background-image: radial-gradient(red,\
    \ yellow);\n}\n```\n\n*Code Listing 65a: our CSS rule altered to be a radial gradient*"
  mdcn: "\n这可以是颜色的细微变化，也可以是在很小空间内的大胆变化。正确使用颜色渐变可以带来很大的不同。\n\n与许多图形效果一样，过去你通常会借助 Photoshop\
    \ 等图像编辑软件来创建颜色渐变。然后将生成的渐变作为背景图像应用，并根据需要重复平铺以覆盖目标元素的整个尺寸。\n\n使用 CSS3，你现在可以利用渐变填充类型即时创建颜色范围，再也不需要使用图像编辑器了。\n\
    \n请注意，我在上一段中将渐变填充称为一种\"类型\"。与我们之前看到的所有内容不同，渐变填充并不是像阴影和圆角边框那样独立的规则。它实际上是一种 CSS\
    \ 引擎为我们创建的图像类型，并且通常（但并非总是）与任何你可能常规指定图像的规则一起使用。\n\n这意味着你的样式表中没有名为渐变的规则；相反，你需要使用\
    \ `color`、`background-color`、`background-image` 等常规 CSS 属性来为给定目标创建 CSS 规则。然后用你希望应用渐变的区域来替换或覆盖已定义规则的全部或部分内容。\n\
    \n这一点对于向后兼容性很重要，因为它意味着你始终有后备方案，也就是说 CSS 颜色渐变是你可以在不做任何特殊处理来支持旧浏览器的情况下使用的众多新特性之一。\n\
    \n在典型用法中，你会创建规则（记住特异性顺序）以一种对旧浏览器也能正常显示的方式来设置元素样式。然后你可以添加特定类的可选择规则来扩展原始规则，或者在基本属性设置完成之后，在相关规则的末尾添加渐变生成器。\n\
    \n以这种方式生成渐变可以让浏览器中的 CSS 引擎为你完成所有繁重的工作，无需 polyfill 或 JavaScript hack 来提供向后兼容性。\n\
    \n既然你已经了解了基础知识，让我们来看看如何应用它。\n\n首先我们需要一些 HTML 标记来进行实验，所以让我们创建一个简单的单个 **div** 并将其放入\
    \ HTML 文档中。\n\n```\n<div class=\"gradDiv\">\n    <p>I'm a div with a gradient</p>\n\
    </div>\n```\n\n*代码清单 64a：渐变填充的 HTML*\n\n让我们也定义以下规则作为实验的起点：\n\n```\n.gradDiv\n\
    {\n    width: 200px;\n    height: 200px;\n    background-color: salmon;\n    padding:\
    \ 4px;\n    border: 1px solid black;\n    display: inline-block;\n    margin:\
    \ 15px;\n}\n```\n\n*代码清单 64b：渐变 div 的基础样式*\n\n初始渲染效果应如下所示：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_89_0.png)\n\
    \n*图 71：未添加渐变的 div 元素*\n\n渐变分为三种类型：线性渐变、径向渐变和重复渐变，每种都有自己的语法和格式。\n\n> 注意：直到最近，许多主流浏览器仍使用厂商前缀来定义渐变等功能。值得庆幸的是，它们现在都支持无前缀版本的渐变填充，每个浏览器都已确定使用标准语法。如果你需要支持旧浏览器（这里的旧是指中等程度的旧：IE9、FF20\
    \ 等），那么你可能会发现需要多次指定渐变填充（以及其他 CSS3 特性），而且需要以几种不同的形式来写。在本书中，我只使用可以无前缀方式使用的属性和功能，以保持简洁。渐变填充有一个额外的注意事项：指定填充的实际语法在不同前缀版本之间差异很大，只有标准化的无前缀版本才是统一的。\n\
    \n我们将从最简单的线性渐变开始。\n\n在样式文件中添加以下内容（但不要替换我们已经定义的规则）：\n\n```\n.gradDiv\n{\n    background-image:\
    \ linear-gradient(red, yellow);\n}\n```\n\n> 代码清单 64b：渐变 div 的样式扩展\n\n在浏览器中渲染后，你应该看到它变为：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_90_0.png)\n\n> 图 72：我们的第一个渐变 div\n\n\
    如你所见，线性渐变使用起来非常简单。我们告诉 CSS 引擎从红色开始到黄色结束，它就照做了，在目标元素的整个尺寸上创建了一个均匀的渐变。\n\n我们还可以使用\
    \ **to** 关键字来改变方向。将规则 64b 修改如下：\n\n```\n.gradDiv\n{\n    background-image: linear-gradient(to\
    \ left, red, yellow);\n}\n```\n\n> 代码清单 64c：带有方向更改的 CSS 规则\n\n刷新 HTML 后，我们会发现渐变现在从右侧开始向左延伸。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_91_0.png)\n\n*图 73：渐变现在从右向左运行*\n\n\
    你可以组合方向，例如使用 \"to top left\" 或 \"to bottom right\"，从而实现从角到角的渐变，而不仅仅是从上到下或从左到右。\n\
    \n你也可以提供角度。例如：\n\n```\n.gradDiv\n{\n    background-image: linear-gradient(30deg,\
    \ red, yellow);\n}\n```\n\n*代码清单 64d：带有方向更改的 CSS 规则*\n\n这将给你一个以 0 轴为基准、30 度角从红色到黄色的渐变。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_91_1.png)\n\n*图 74：30 度角的渐变*\n\n> 注意：根据你需要支持的浏览器版本，你可能仍需使用厂商前缀。我已经提到厂商前缀版本使用不同的语法来指定渐变。但我尚未提及的是旋转角度的计算方式。标准语法以目标元素底部中间为\
    \ 0 度，正向递增从 0 到 360 度按顺时针方向旋转。你可以在前面示例的 30 度旋转中看到这一点，红色从左下角开始。在浏览器前缀版本中，使用了两种不同的方案——一种是现在的标准方式，另一种是以右侧中间为\
    \ 0 度，正向旋转从 0 到 360 度按逆时针方向进行。\n\n线性渐变还可以包含两种以上的颜色；事实上，它们可以包含任意数量的颜色。还记得人们曾经热衷的彩虹色背景吗？试试以下扩展的\
    \ CSS 规则。\n\n```\nbackground-image: linear-gradient(red, orange, yellow, green,\
    \ blue, indigo, violet);\n```\n\n*代码清单 64d：带有彩虹色的 CSS 规则*\n\n在浏览器中渲染这个效果可能会刺伤你的眼睛！\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_92_0.png)\n\n*图 75：我们的 div 现在看起来像彩虹*\n\
    \n你会注意到颜色分布仍然均匀地分布在整个元素的高度上。我们可以使用颜色断点轻松地改变这一点。\n\n如果你曾经使用过 Photoshop 或 Gimp 等图像编辑器，那么你很可能知道颜色断点是什么。它们是预设值，告诉图形引擎在色阶的某个特定点改变颜色。\n\
    \n为了演示我的意思，将你的扩展规则修改如下：\n\n```\n.gradDiv\n{\n    color: white;\n    background-image:\
