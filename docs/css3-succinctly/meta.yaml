    *Figure 8: Code Listing 15 with the CSS rules in Code Listing 16 applied*


    # # The Direct Child Selector (>)


    As you''ve already seen, the descendant selector allows you to target child elements
    down the chain of elements in your markup.


    If you want to target paragraph tags that reside inside a **div** with a class
    type of **news**, for example, then a selector of **div.news p** will do the job.
    There is, however, one drawback: the descendant selector is greedy.


    When we say a selector is greedy, we mean that it will attempt to match as much
    as it possibly can (anyone who has any experience with regular expressions will
    know what I''m talking about).


    What this means in practice is that not only will the elements at the first level
    of selection be selected, but any that match below that will too.


    The direct child selector solves this by being less greedy, and going no further
    than the first level below the root selector.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "Consider the following HTML markup:\n\n```\n<div class=\"test\">\n    <p>Paragraph\
    \ 1</p>\n    <p>Paragraph 2</p>\n    <div>\n        <p>Paragraph 3</p>\n    </div>\n\
    \    <p>Paragraph 4</p>\n</div>\n```\n\n*Code Listing 17: HTML markup to demonstrate\
    \ the direct child selector*\n\nIf we render Code Listing 17 in our browser, we'll\
    \ get four simple paragraph elements.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_0.png)\n\
    \n*Figure 9: HTML rendered using Code Listing 17*\n\nYou'll notice from the markup\
    \ that paragraph 3 is inside a nested **div** element; if we style this block\
    \ using a standard descendant selector, we'll get the following output:\n\n```\n\
    div.test p\n{\n    color: red;\n}\n```\n\n*Code Listing 18: CSS Rule to style\
    \ the code in Listing 17 using a descendant selector*\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_28_1.png)\n\
    \n*Figure 10: Output produced when combining the HTML in Code Listing 17 with\
    \ the rule in Code Listing 18*"
  merge: -1
  pgno: 28
- img_proc: true
  md: "At first glance, this output might seem ok, and in general may actually be\
    \ what you wanted to achieve. Consider this, however: why is paragraph 3 being\
    \ embedded in a further **div** element?\n\nIt may have been created that way\
    \ with the intention of styling it differently than the other paragraph elements\
    \ in the block.\n\nLet's change our rule, so it uses a direct child selector as\
    \ follows:\n\n```\ndiv.test > p\n{\n    color: red;\n}\n```\n\n*Code Listing 19:\
    \ CSS Rule to style the code in Code Listing 17 using a direct child selector*\n\
    \nYou should now see that it skips the paragraph in the nested element, but continues\
    \ to style the others as expected.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_29_0.png)\n\
    \nThis comes in handy when creating things like pop-up menus, where you might\
    \ like all the top-level elements to take on an unselected look and feel, but\
    \ where nested items forming sub-menus need to be left alone when a parent element\
    \ is selected.\n\n# The General Sibling Selector (~)\n\nThe *general sibling*\
    \ selector, like its close cousin the adjacent sibling selector, is used to select\
    \ elements that follow a parent of a given type. However, unlike its cousin, it\
    \ attempts to select more than one match in the markup hierarchy.\n\nThe adjacent\
    \ sibling selector will at most (as you saw previously) select only the first\
    \ occurrence of a given match; the general sibling selector, however, will attempt\
    \ to select that match, as long as the hierarchy continues to match.\n\nIf we\
    \ build two unordered lists as follows:\n\n```\n<p>List 1</p>\n<ul>\n```"
  merge: -1
