    图 85：140 个 CSS3 颜色名称


    实际上还有更多（总共 147 个），但那些只是已指定颜色的备用拼写，例如 "darkslategrey"（为那些将 "gray" 拼写为 "e" 的人准备）。


    在 CSS 规则中需要指定颜色的任何地方，你都可以使用这些颜色名称。


    如果你像我们很多人一样难以记住它们，那么你可能会觉得 [这个网站](https://example.com) 很有用。


    该网站会在每次加载或刷新页面时在其主页上为你提供列表中的一个随机颜色，并以大号字母列出颜色名称。如果你点击文本正下方的小网格图标，你将进入一个页面，在那里你可以悬停在颜色上，以不同方式对它们进行排序，并通常可以查看整个列表。


    [CSS-Tricks](https://css-tricks.com) 也有一个有用的列表。它不仅列出了颜色，还列出了每种颜色的 #rrggbb 值。


    你需要知道的最后一个颜色名称是 **transparent**。


    当你使用 transparent 颜色名称时，你使应用颜色值的对象 100% 透明。不幸的是，无法使用颜色名称和十六进制值来改变透明度级别，但你可以设置元素的
    **opacity** CSS 规则，除非你想使用直接颜色值。


    ## 颜色值


    如果命名颜色不够用，十六进制表示法对你来说又太繁琐，那么你会很高兴地知道，使用 CSS3，你可以使用四种新的数据类型之一来定义颜色。


    这些类型的使用方式与之前在渐变部分中看到的方式类似，通过将它们指定为关键字，后跟括号中的一组参数值。


    括号内的值可以是固定值或百分比值。我们在本章开头的中等灰色示例现在可以表示如下：


    - #7F7F7F

    - rgb(127, 127, 127)

    - rgb(50%, 50%, 50%)


    这三个值中的任何一个，当用在 CSS 中可以指定颜色的任何地方时，都会生成相同的颜色。


    你还可以使用 `rgba` 关键字指定带有 Alpha 通道的颜色。


    > 注意：Alpha 分量是指定给定颜色所使用的不透明度级别的值。可以将其想象为一个透明度值，其中 0 是完全透明，255/100% 是完全不透明，介于两者之间的值提供不同的透明度级别。它就像一个纱门：你可以看穿门，但你不能直接穿过去，因为它仍然是一个实体对象。透明度类似，给定的
    Alpha 值级别决定了你能看穿 "门" 的程度。


    `rgba` 关键字的使用方式与 `rgb` 关键字完全相同，但需要一个额外的值来指定 Alpha 级别：`rgba(127,127,127, 0.5)`


    然而，与颜色值本身不同，你不能为 alpha 量提供百分比值或 0 到 255 的整数。


    相反，你必须使用基于浮点数的数字，范围从 0 到 1，其中 0 是完全透明，1 是完全不透明，0.5 代表中间点。


    大多数人只是选择简单的值，例如 **0**、**0.1**、**0.2**.... **0.8**、**0.9**、**1**


    但是，如果需要，你可以通过加倍数字来获得更精细的控制，如下所示：**0.01**、**0.32**、**0.84**


    对于常见的百分比值，你经常会使用以下值：


    - 0.00 = 0%

    - 0.25 = 25%

    - 0.50 = 50%

    - 0.75 = 75%

    - 1.00 = 100%


    当你以这种方式加倍数字时，突然就很容易将百分比值与使用的 0 到 1 刻度联系起来。


    我们需要介绍的另一种指定颜色的方法，这将让那些作为专业图形艺术家或设计师接受过正确色彩理论培训的人更容易理解。这就是 `hsl` 和 `hsla` 方式。


    使用方式与 `rgb` 颜色值完全相同，`hsl` 方法赋予前三个值不同的含义。


    它们不是混合红、绿、蓝的级别，而是指定色相、饱和度和亮度。


    我不会在这里深入讲解完整的色彩理论，但色相值代表你在色谱上的位置，0 度为红色，360 度为品红色/红色；当你沿着 360 度色轮从 0 到 360 时，你会得到不同的基础颜色值。


    饱和度是所选颜色值的强度，从 0%（非常弱）到 100%（非常强），亮度值是 0%（非常暗/通常是黑色）到 100%（非常浅或明亮）。


    所有内容都在 [hsl-color.com](http://hsl-color.com) 上有详细解释。


    大多数人只是选择简单的值，例如 **0**、**0.1**、**0.2**.... **0.8**、**0.9**、**1**


    但是，如果需要，你可以通过加倍数字来获得更精细的控制，..........


    ## 总结


    在这相当短的一章中，我们探讨了如何在 CSS3 中定义颜色。我特意没有创建任何代码清单，因为有很多机会可以回去查看之前的示例，并替换 `color`、`background-color`
    和 `gradient` 规则中的值，如果你想尝试的话。


    我们已经了解了 CSS3 如何使在样式规则中指定颜色变得更容易，并介绍了一些互联网资源，这些资源将使记忆和指定颜色变得更加有用。


    在下一章中，我们将深入探讨现在可用于基于 CSS3 页面的新字体功能。


    ## 第 7 章 网络字体


    在 HTML/CSS 规范的整个生命周期中，网络开发人员和设计师在排版方面一直被限制使用相同的核心字体集。


    我已经记不清在这个话题上看到过多少次激烈的辩论和讨论了，而且我亲身经历过客户想要特定字体的文本，却不得不告诉他们这无法实现的沮丧。


    如果你想使用给定的字体，你通常必须在能够访问所需字体的美术包或文字处理软件中准备文本，然后将图像保存为浏览器兼容的图像文件，或者从你的文字处理软件中截取屏幕截图，以便在
    HTML 文档中使用。


    不用说，这并不容易。拼写错误和简单的文本更改需要极长的时间来纠正（在任何人问之前，我这些年来至少有一个客户希望所有正文文本都以这种方式完成），而且除了简单的横幅或标题之外，它实际上并不实用。


    虽然围绕字体使用存在大量挫折感，但限制使用有充分、合理的理由，这些理由通常归结为平台差异。


    早期的浏览器在图形能力上远不如今天的浏览器，许多操作系统只安装了有限数量的字体，因此 HTML 委员会制定了一个已知字体列表，这些字体几乎可以保证在运行任何图形浏览器的任何平台上都存在。需要指出的是，我们不仅仅是在谈论
    Windows 和 Mac——当时有更多 Unix 和 Linux 的变体，每个变体都有自己特定的桌面环境。直到 1990 年代初期，许多变体才开始标准化，使用
    X11 以及 GNOME 和 KDE 等窗口管理器等工具。即使是 Windows 也有至少四个不同的版本。


    几乎总能保证工作的有限基础字体列表是：


    - sans-serif

    - serif

    - fantasy

    - cursive

    - monospace


    如果你使用其中一种字体来指定你的字体，你将获得该平台的字体版本，虽然它可能并不总是完全相同，但外观、风格和感觉会足够接近，以至于你的设计布局不会受到太大影响。


    根据你的平台，你还可以提供要使用的覆盖字体。在 Windows 机器上开发的网站上，通常会看到字体被描述为：


    > *Times, "Times New Roman", serif*

    '
