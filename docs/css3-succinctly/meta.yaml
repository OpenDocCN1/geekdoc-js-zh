    How you choose to do it is entirely up to you; some people like the verbosity
    of doing things the long way, and to be honest, I find that during development
    it helps maintain the code. However, when you ship to production, you really want
    to make these things as small as possible.


    A good CSS squisher is a must for optimizing your style files, especially if you
    do use the long form during development.


    > **Note: Minifying CSS**—Minifying is the process of making a file smaller than
    it is without losing any of its original intent. Unlike a compressed or zip file,
    a minified file still operates in the manner that it was originally intended—it''s
    just become a lot smaller and more compact. Having a good minifier to squash your
    files down is a must for web development. One of the biggest speed-ups you can
    have when your site is being loaded, is for your styles, code, markup, and images
    to be as small as possible and as few as possible.


    There a plethora of tools available to do help you do this. A good place to start
    is with the [Grunt Task Runner](http://gruntjs.com/). Grunt has a large number
    of modules for squashing CSS, JavaScript,'
