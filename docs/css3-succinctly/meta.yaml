  - "[PAGE 69]\n\nJust specifying the number index directly will select only that\
    \ numbered element.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_69_0.png)\n\n\
    *Figure 53: nth-child selecting just the fifth element in the list*\n\nI could\
