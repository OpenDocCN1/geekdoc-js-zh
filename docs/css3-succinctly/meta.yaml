- md: "This should produce the output shown in Figure 77:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_94_0.png)\n\
    \nFigure 77: We've changed the gradient to a radial one\n\nJust as with the linear\
    \ gradient, we can change the start position. So, for instance, we could easily\
    \ start the graduation from the upper-right corner by doing the following:\n\n\
    ```\n.gradDiv\n{\n    background-image: radial-gradient(at top right, red, yellow);\n\
    }\n```\n\nCode Listing 65b: Radial gradient changed to the top right\n\nThis gives\
    \ us the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_94_1.png)\n\n\
    Figure 78: Radial gradient coming from the top right\n\nYou can also supply an\
    \ x and y offset using any valid CSS value. Using percentages here is interesting\
    \ because you can make positional radials that are dependent on the size of the\
    \ target element. In the following rule we're starting 75 percent along the x-axis\
    \ (0 is left) and 60 percent down the y-axis (0 is top).\n\n```\n.gradDiv\n{\n\
    \  background-image: radial-gradient(at 75% 60%, red, yellow);\n}\n```\n\nCode\
    \ Listing 65c: Radial gradient changed to 75% X and 60% Y\n\nRendering this should\
    \ give you something like the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_95_0.png)\n\
    \nFigure 79: Our div with a gradient centered at 75% by 60%\n\nIf you've been\
    \ looking closely at the rendered output, you may have noticed that the actual\
    \ gradient is quite circular.\n\nBy default the CSS3 engine produces radial gradients\
    \ with an elliptical shape rather than a balanced, circular shape.\n\nIf you need\
    \ your radial gradient to be circular, then you can force the CSS3 engine to produce\
    \ circular gradients by using the `circle` modifier as follows:\n\n```\n.gradDiv\n\
    {\n  background-image: radial-gradient(circle at 75% 50%, red, yellow);\n}\n```\n\
    \nCode Listing 65d: Applying the circle modifier to our rule\n\nYou might not\
    \ be able to tell the difference here if you're using the 200px by 200px element\
    \ we've used so far, so you may want to try changing the width in the parent rule\
    \ to something like 400px, and then try rendering with and without the circle\
    \ modifier applied.\n\nAt 400 by 200 with the `circle` modifier applied, you should\
    \ see something like this:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_96_0.png)\n\
    \n> Figure 80: Our gradient with the circle modifier applied\n\nThere are other\
    \ modifiers that you can add too; these are mostly used to control things based\
    \ on width. For example, if you have a short and wide element, and you're specifying\
    \ the `circle` modifier, then the largest color range will be along the longest\
    \ edge. This means that from top to bottom you may only see your start color,\
    \ but the full fade will be visible across the width. To combat this, one of the\
    \ modifiers you can supply is `closest-side`, which will force the majority of\
    \ your gradient into whichever side dimension is the smallest while letting the\
    \ graduation run out early across the wider side. As with all of the different\
    \ settings available, you can find these listed along with their explanations\
    \ on the Mozilla developer network.\n\n## Repeating Gradients\n\nThe syntax for\
    \ repeating gradients is identical to radial gradient, the only difference is\
    \ that you specify them using `repeating-linear-gradient` rather than just `linear-gradient`.\
    \ However, there is a caveat that you need to watch out for, and that is you MUST\
    \ supply your colors with color stop values.\n\nIf you try to specify a repeating\
    \ gradient by just supplying non color stop values, you'll simply end up with\
    \ something that just looks like a standard linear gradient for example\n\n```\n\
    .gradDiv\n{\n    background-image: repeating-linear-gradient(red, yellow);\n}\n\
    ```\n\n> Code Listing 66: A repeating linear gradient\n\nThis will produce the\
    \ following image:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_97_0.png)\n\nIf\
    \ we alter the gradient fill so that it looks like this:\n\n```\n.gradDiv\n{\n\
    \  background-image: repeating-linear-gradient(red 0%, red 10%, yellow 10%, yellow\
    \ 20%);\n}\n```\n\nYou'll find that when you render it, you get the following:\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_97_1.png)\n\nWhat's happening here\
    \ is quite simple: we start at 0 percent and make sure we have red to 10 percent,\
    \ and then we start yellow at that 10 percent mark and end it at 20 percent.\n\
    \nThe CSS3 engine looks at the rule and sees that it runs out of color 20 percent\
    \ into the element width, and so it repeats the first 20 percent to fill in the\
    \ remaining 80 percent.\n\nSo does this mean we can never use 100 percent of our\
    \ graduation to repeat? No, not at all; while the 100 percent width in our examples\
    \ has been the width of the element, the calculations for the gradient are actually\
    \ the width of the background.\n\nIn CSS3, you can now set the size of your background\
    \ using the `background-size` rule.\n\nThe relevance to what we do here is that\
    \ if we set our background size to 10px by 10px, then as far as our repeating\
    \ gradient is concerned, that 10px would be 100 percent of the size. If that 10px\
    \ by 10px background was then applied to a 200px by 200px element, the background\
    \ would repeat 20 times in the X and Y directions unless otherwise instructed.\n\
    \nThe only reason we see 100 percent as the width of the element in our examples\
    \ is because we're leaving the background width and height at the default, which\
    \ happens to be 100 percent of the target element.\n\nWith that in mind, wherever\
    \ you end a color stop, your repeating gradient will repeat within itself. This\
    \ means that if you are resizing the background, you need to make sure that any\
    \ color stops you make repeat also repeat across tiled image boundaries—unless\
    \ misalignment is what you're aiming for.\n\n## Summary\n\nIn this chapter, you've\
    \ seen some of the eye candy that CSS3 introduces. Next, we'll look more closely\
    \ at the different ways of specifying color in CSS3 and learn about some of the\
    \ things we can now use, such as alpha channels.\n\n# Chapter 6 Color\n\nIf you've\
    \ done any web development at all prior to reading this, then you've almost certainly\
    \ come across the standard way that colors are defined in HTML/CSS using the 6-digit\
    \ hex notation: **#rrggbb**\n\nWhat exactly does this mean? It's actually quite\
    \ simple. In effect, it's a 24-bit color value made up of three 8-bit components.\n\
    \nIn the hexadecimal number scheme, digits are counted from 0 to F rather than\
    \ 0 to 9 as in the normal decimal number system. When you look closely, you realize\
    \ that you can fit all of those values into 4 bits, and since the maximum number\
    \ 4 bits can represent in decimal is 15, then 0 to F actually means 0 to 15.\n\
    \nIf you double that up, the 4 bits becomes 8 bits, and the maximum you can then\
    \ fit is 255, so FF (our largest hexadecimal number) becomes 255 (our largest\
    \ decimal number). My aim here is not to turn this into a lesson on hexadecimal\
    \ math; my aim is just to explain to you that a color value is made up of 256\
    \ (0 to 255) levels of Red, Green, and Blue values, with 0 being no color and\
    \ 255 being the max amount of that color.\n\nIf you wanted a mid grey, for example,\
    \ you might use 127 for the values of Red, Green, and Blue, which, when translated\
    \ would give you **#7F7F7F**.\n\nIf you're using Windows it's very easy to convert\
    \ by using the Windows Calculator. Type **calc** into your run box, or search\
    \ for it in the Start menu. When it loads, on the **View** menu, choose **Programmer**.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_99_0.png)\n\nFigure 83: Windows Calculator\
    \ View menu\n\nYou should end up with following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_100_0.png)\n\
    \nFigure 84: Windows Calculator in programmer mode\n\nTo convert to Hex, make\
    \ sure you select **Dec** (marked \"1\" in Figure 84) then type in your value.\
    \ Select **Hex** (marked \"2\" in Figure 84) and you'll see the value to place\
    \ in your color value. If your value is only one digit (from 0 to F), then simply\
    \ prefix it with an extra 0 (01, 02 ... 0E, 0F). Do this for each of the three\
    \ values, and plug them all together to make your final color. Easy, right?\n\n\
    Well no, not really, because you either have to understand hex/dec conversion,\
    \ or need some kind of tool on hand to make sense of things.\n\nThis how it was\
    \ at the start, and this is how it's always been—at least until CSS3 came along.\n\
    \n## Color Names\n\nCSS2 introduced proper names for some colors, but they weren't\
    \ really publicized; this, however, was greatly expanded with CSS3. You've already\
    \ seen in this book that I've used names such as red, green, and blue. There are\
    \ actually 140 of them altogether, as Figure 85 shows."
  mdcn: "\n这将产生如图 77 所示的输出：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_94_0.png)\n\
    \n图 77：我们将渐变改为径向渐变\n\n与线性渐变一样，我们可以更改起始位置。例如，我们可以轻松地通过以下方式从右上角开始渐变：\n\n```\n.gradDiv\n\
    {\n    background-image: radial-gradient(at top right, red, yellow);\n}\n```\n\
    \n代码清单 65b：径向渐变改为从右上角开始\n\n这会得到以下效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_94_1.png)\n\
    \n图 78：从右上角开始的径向渐变\n\n你也可以使用任何有效的 CSS 值来提供 X 和 Y 偏移量。在这里使用百分比很有趣，因为你可以创建依赖于目标元素大小的定位径向渐变。在以下规则中，我们在\
    \ X 轴（0 为左侧）的 75% 处和 Y 轴（0 为顶部）的 60% 处开始。\n\n```\n.gradDiv\n{\n  background-image:\
    \ radial-gradient(at 75% 60%, red, yellow);\n}\n```\n\n代码清单 65c：径向渐变改为 X 轴 75%\
    \ 和 Y 轴 60%\n\n渲染这应该会得到类似以下的效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_95_0.png)\n\
    \n图 79：我们的 div，渐变中心位于 75% 和 60% 处\n\n如果你仔细观察渲染后的输出，可能已经注意到实际的渐变是相当圆形的。\n\n默认情况下，CSS3\
    \ 引擎会生成椭圆形的径向渐变，而不是均衡的圆形。\n\n如果你需要径向渐变是圆形的，那么可以通过使用 `circle` 修饰符来强制 CSS3 引擎生成圆形渐变，如下所示：\n\
    \n```\n.gradDiv\n{\n  background-image: radial-gradient(circle at 75% 50%, red,\
    \ yellow);\n}\n```\n\n代码清单 65d：在我们的规则中应用 circle 修饰符\n\n如果你一直使用我们迄今为止使用的 200px\
    \ × 200px 的元素，可能看不出区别，所以你可以尝试将父规则中的宽度改为 400px 之类的值，然后尝试分别渲染应用和未应用 circle 修饰符的效果。\n\
    \n在 400 × 200 并应用了 `circle` 修饰符的情况下，你应该会看到类似这样的效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_96_0.png)\n\
    \n> 图 80：应用了 circle 修饰符的渐变\n\n还有其他可以添加的修饰符；这些主要用于基于宽度来控制事物。例如，如果你有一个矮而宽的元素，并且你指定了\
    \ `circle` 修饰符，那么最大的颜色范围将沿着最长的边缘。这意味着从上到下你可能只能看到起始颜色，但完整的渐变会在整个宽度上可见。为了解决这个问题，你可以使用的一个修饰符是\
    \ `closest-side`，它会将大部分渐变强制缩放到 whichever 侧边尺寸最小的方向，同时让渐变在较宽的边上提前结束。和所有其他可用设置一样，你可以在\
    \ Mozilla 开发者网络上找到这些设置及其说明。\n\n## 重复渐变\n\n重复渐变的语法与径向渐变相同，唯一的区别是你使用 `repeating-linear-gradient`\
    \ 而不是 `linear-gradient` 来指定它们。然而，有一个需要注意的地方，那就是你**必须**为颜色提供色标值。\n\n如果你尝试只提供非色标值来指定重复渐变，你最终只会得到看起来就像标准线性渐变的效果，例如：\n\
    \n```\n.gradDiv\n{\n    background-image: repeating-linear-gradient(red, yellow);\n\
    }\n```\n\n> 代码清单 66：重复线性渐变\n\n这将产生以下图像：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_97_0.png)\n\
    \n如果我们将渐变填充调整为这样：\n\n```\n.gradDiv\n{\n  background-image: repeating-linear-gradient(red\
