- img_proc: true
  md: 'What''s happening here is quite simple: we start at 0 percent and make sure
    we have red to 10 percent, and then we start yellow at that 10 percent mark and
    end it at 20 percent.


    The CSS3 engine looks at the rule and sees that it runs out of color 20 percent
    into the element width, and so it repeats the first 20 percent to fill in the
    remaining 80 percent.


    So does this mean we can never use 100 percent of our graduation to repeat? No,
    not at all; while the 100 percent width in our examples has been the width of
    the element, the calculations for the gradient are actually the width of the background.


    In CSS3, you can now set the size of your background using the `background-size`
    rule.


    The relevance to what we do here is that if we set our background size to 10px
    by 10px, then as far as our repeating gradient is concerned, that 10px would be
    100 percent of the size. If that 10px by 10px background was then applied to a
    200px by 200px element, the background would repeat 20 times in the X and Y directions
    unless otherwise instructed.


    The only reason we see 100 percent as the width of the element in our examples
    is because we''re leaving the background width and height at the default, which
    happens to be 100 percent of the target element.


    With that in mind, wherever you end a color stop, your repeating gradient will
    repeat within itself. This means that if you are resizing the background, you
    need to make sure that any color stops you make repeat also repeat across tiled
    image boundaries—unless misalignment is what you''re aiming for.


    # ## Summary


    In this chapter, you''ve seen some of the eye candy that CSS3 introduces. Next,
    we''ll look more closely at the different ways of specifying color in CSS3 and
    learn about some of the things we can now use, such as alpha channels.'
