    \ to browser defaults if left out.\n\nThe first two measurements are the offset\
    \ x and offset y values, which as the names suggest, set the distance from the\
    \ element that the shadow protrudes. If positive values are supplied, then the\
    \ shadow protrudes from the bottom right; if negative values are used, the shadow\
    \ protrudes from the top left. To get the shadow on other corners, you mix positive\
    \ and negative offsets as required.\n\nCreate an HTML 5 document and add the following\
    \ markup (or reuse the code from the previous section on border radius, but repeat\
    \ it four times):\n\n```\n<div class=\"niceDiv\">\n    <p>This is a nice div with\
    \ drop shadows</p>\n</div>\n<div class=\"niceDiv\">\n    <p>This is a nice div\
    \ with drop shadows</p>\n</div>\n<div class=\"niceDiv\">\n    <p>This is a nice\
    \ div with drop shadows</p>\n</div>\n<div class=\"niceDiv\">\n    <p>This is a\
    \ nice div with drop shadows</p>\n</div>\n```\n\nCode Listing 62a: HTML markup\
    \ to demo drop shadow\n\nCreate the following style rule as a basis for the rest\
    \ of this section:\n\n```\n.niceDiv\n{\n    width: 100px;\n    height: 100px;\n\
    \    background-color: beige;\n    padding: 4px;\n    border: 1px solid black;\n\
    \    display: inline-block;\n    margin: 15px;\n}\n```\n\nCode Listing 62b: CSS\
    \ rule to style the HTML in 62a\n\nThis will give us the default beige div you\
    \ saw in the last section, with no additional styling.\n\n> Note: You've seen\
    \ many instances so far where rules cascade down from less-specific rules above\
    \ them. This is one of CSS3's (and previous versions) greatest features, which\
    \ I've not gone into too much detail about. In the previous section we added the\
    \ border radius directly too the 'niceDiv' rule; in this section I'm going to\
    \ start using cascading"
- md: "## ## Graduated Fills\n\nI'm sure that at some stage in your development of\
    \ HTML documents you've come across the need for a graduated fill of some description\
    \ in the design of a page.\n\nmore to keep the base styles (in this case our beige\
    \ rectangle) separate from the rules we're currently exploring. You can use the\
    \ same selector as many times as you like, and the effect will always be cumulative.\
    \ For example, if you specify '.niceDiv' and '.niceDiv .shadow', you then always\
    \ have the option to use the base styling by specifying a class of 'niceDiv' to\
    \ the element, and optionally applying the shadow by adding that to the class\
    \ list as a secondary ID. There's nothing wrong with breaking things up into groups\
    \ by repeating class and ID selectors if you wish, but if you do this, make sure\
    \ you remember the rules of specificity and order things correctly.\n\nAs with\
    \ the previous examples, we'll render this first, so you can see what it looks\
    \ like before we start.\n\n![Figure 63: Drop shadow divs before styling](img/d6b4d2d62fbe04b9c83d677f3498c239_81_0.png)\n\
    \nOnce we have that working, we'll create some sample rules to apply different\
    \ drop shadows to our elements.\n\n```css\n.niceDiv.topLeftShadow\n{\n  box-shadow:\
    \ -10px -10px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow: -10px 10px;\n\
    }\n\n.niceDiv.bottomRightShadow\n{\n  box-shadow: 10px 10px;\n}\n\n.niceDiv.topRightShadow\n\
    {\n  box-shadow: 10px -10px;\n}\n```\n\nCode Listing 62b: CSS rule to apply different\
    \ shadows to the HTML in 62a\n\nNow we need to make a small alteration to the\
    \ HTML, and add each of the new class names `topLeftShadow`, `bottomLeftShadow`\
    \ and so on one to each **div** in the HTML in Code Listing 62a, as follows:\n\
    \n```html\n<div class=\"niceDiv topLeftShadow\">\n    <p>This is a nice div with\
    \ drop shadows</p>\n</div>\n<div class=\"niceDiv bottomLeftShadow\">\n    <p>This\
    \ is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv bottom versatility\
    \ amazing versality\">\n    <p>This is a nice div with drop shadows</p>\n</div>\n\
    <div class=\"niceDiv topRightShadow\">\n    <p>This is a nice div with drop shadows</p>\n\
    </div>\n```\n\nCode Listing 62c: Adding the four drop-shadow classes to our divs\n\
    \nJust in case you're wondering what's going on here, we're using the cascading\
    \ nature of CSS to our advantage so that we don't have to type out the basic beige\
    \ **div** style four times in each of the four rules; doing things this way means\
    \ less typing and better re-use.\n\nIf we re-render that, you should now see that\
    \ we have four default, blocky drop shadows for each of the directions on each\
    \ of our **div** elements.\n\n![Figure 64: Our div elements with default drop\
    \ shadows](img/d6b4d2d62fbe04b9c83d677f3498c239_82_0.png)\n\nThe default settings\
    \ for drop shadows, however, are very bold and solid; changing this is where the\
    \ remaining two optional measurements come into the equation.\n\nThe first value\
    \ is the blur radius; you can't use negative values on this, but any positive\
    \ values you supply blur the shadow out further and further, giving a much softer\
    \ appearance with each increasing value.\n\nChange the rules in Code Listing 62b\
    \ as follows:\n\n```css\n.niceDiv.topLeftShadow\n{\n  box-shadow: -10px -10px\
    \ 5px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow: -10px 10px 5px;\n}\n\n\
    .niceDiv.bottomRightShadow\n{\n  box-shadow: 10px 10px 5px;\n}\n\n.niceDiv.topRightShadow\n\
    {\n  box-shadow: 10px -10px 5px;\n}\n```\n\nCode Listing 62d: CSS rules changed\
    \ to blur the shadows\n\nThe re-render your test HTML document, you should now\
    \ see the shadows become slightly softer.\n\n> Figure 65: Our div elements with\
    \ a small blur added\n\nThe larger you make the blur, the softer the shadow's\
    \ edge will be.\n\n> Figure 66: Our div elements with a 30px blur radius\n\nThe\
    \ fourth parameter controls how much the blur spreads away from the edge, and\
    \ is called the spread radius.\n\nIf we add 10 pixels onto the blur radius, our\
    \ shadow will grow to a total of 20 pixels (we already have a 10-pixel offset),\
    \ but the final 10 pixels will be used for the blur and its associated fadeout.\
    \ Change the shadow rules as follows:\n\n```css\n.niceDiv.topLeftShadow\n{\n \
    \   box-shadow: -10px -10px 30px 10px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  \
    \  box-shadow: -10px 10px 30px 10px;\n}\n\n.niceDiv.bottomRightShadow\n{\n   \
    \ box-shadow: 10px 10px 30px 10px;\n}\n\n.niceDiv.topRightShadow\n{\n    box-shadow:\
    \ 10px -10px 30px 10px;\n}\n```\n\n> Code Listing 62e: CSS rules changed to blur\
    \ the shadows\n\nThen re-render, and you should get some very large, very fuzzy\
    \ shadows with very soft edges:\n\n> Figure 67: Our div elements with an optional\
    \ spread radius applied\n\nGetting the right-looking value for the optional values\
    \ can be very much a case of trial and error, but generally, the larger the spread\
    \ radius, the more space the blur has to fade things out, and so can make a smoother\
    \ transition.\n\n**Note: If you have some specific Z-ordering (that is, if you're\
    \ using div layers), then it is possible to cast a shadow onto sibling elements.\
    \ For this reason it's usually better to try and keep drop shadows as low in the\
    \ stack of elements as possible, or size the blurs and offsets so that things\
    \ stay within any margins you have defined on the element.**\n\nThe final value\
    \ is the color value, and like any other color property on an element, this can\
    \ take any standard color value. For now we'll just use the standard 6-digit #\
    \ symbol way of specifying color, as we'll be taking a closer look at defining\
    \ colors in the next chapter.\n\nAlter your rules so that they look as follows:\n\
    \n```css\n.niceDiv.topLeftShadow\n{\n    box-shadow: -10px -10px 20px 5px #FF0000;\n\
    }\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow: -10px 10px 20px 5px #00FF00;\n\
    }\n\n.niceDiv.bottomRightShadow\n{\n    box-shadow: 10px 10px 20px 5px #0000FF;\n\
    }\n\n.niceDiv.topRightShadow\n{\n    box-shadow: 10px -10px 20px 5px #FFFF00;\n\
    }\n```\n\nCode Listing 62e: CSS rules changed to color the shadows\n\nWhen the\
    \ HTML is reloaded, you should see your shadows are now much brighter, more colorful,\
    \ and nicer looking.\n\n*Figure 68: Our shadows are now much more colorful*\n\n\
    You can make the shadow appear inside the element (rather than outside as we have\
    \ been doing) by specifying the optional **inset** keyword on the rule. If you\
    \ use inset, however, you must supply it before any values. Alter our rules one\
    \ last time:\n\n```css\n.niceDiv.topLeftShadow\n{\n    box-shadow: inset -10px\
    \ -10px 20px 5px #FF0000;\n}\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow:\
    \ inset -10px 10px 20px 5px #00FF00;\n}\n\n.niceDiv.bottomRightShadow\n{\n   \
    \ box-shadow: inset 10px 10px 20px 5px #0000FF;\n}\n\n.niceDiv.topRightShadow\n\
    {\n    box-shadow: inset 10px -10px 20px 5px #FFFF00;\n}\n```\n\nCode Listing\
    \ 62e: CSS rules changed to inset the shadows\n\nAnd re-render to see the effect.\n\
    \n![Figure 69: Our div elements with inset shadows](img/d6b4d2d62fbe04b9c83d677f3498c239_86_0.png)\n\
    \n# ## Drop shadows on text\n\nCSS3 also supports adding drop shadows to regular\
    \ text elements. When you do this, the shape of the shadow will follow the shape\
    \ of the text rather than it just being the outline of the element's border.\n\
    \nThe difference here is that while the parameters are the same (more or less),\
    \ they are specified in a much different order to the parameters for box-shadow.\n\
    \nWhen specifying a text shadow, the rule is laid out as follows:\n\n```css\n\
    text-shadow: <color> <offsetx> <offsety> <blurRadius>\n```\n\nText shadows don't\
    \ support spread radius, and the color has to come first in the list rather than\
    \ last.\n\nBy way of a quick example, add the following HTML to your document:\n\
    \n```html\n<h1>Drop Shadow Text</h1>\n```\n\nCode Listing 63a: HTML to demo drop\
    \ shadow text\n\nThen add the following style rule:\n\n```css\nh1\n{\n  text-shadow:\
    \ red 10px 10px 10px;\n}\n```\n\nCode Listing 63b: CSS rule to add a drop shadow\
    \ to our text in code 63a\n\nYou should end up with something like Figure 70:\n\
    \n![Figure 70: Text with a red drop shadow](img/d6b4d2d62fbe04b9c83d677f3498c239_87_0.png)\n\
    \nThe parameters work the same way as for the box shadow, so we'll not go into\
    \ any lengthy descriptions; instead, I'll leave it as an exercise to the reader\
    \ to experiment.\n\nThe last thing you need to know about both shadow rules is\
    \ that you can add multiple shadow declarations to an element, separated by a\
    \ comma.\n\nWhen you do this, the effect will be a cumulative one, and any shadows\
    \ that overlay each other will be drawn front to back in the order they are specified\
    \ in the CSS rule. This can be used to create some rather strange halo-like effects\
    \ around elements. Remember, however, to use them sparingly: even though browsers\
    \ these days might be getting faster, effects like this still take power and CPU\
    \ energy to draw, and a mobile device user might not thank you for draining their\
    \ device battery all in the name of looking pretty."
  mdcn: "\n## 渐变填充\n\n我相信在开发 HTML 文档的某个阶段，你一定遇到过在页面设计中需要某种渐变填充的情况。\n\n这样做的目的主要是让基础样式（在本例中是我们的米色矩形）与我们当前正在探索的规则保持分离。你可以根据需要多次使用相同的选择器，效果始终是累加的。例如，如果你指定了\
    \ `.niceDiv` 和 `.niceDiv .shadow`，那么你始终可以选择通过为元素指定 `niceDiv` 类来使用基础样式，并可选地通过在类列表中添加次要\
    \ ID 来应用阴影效果。如果愿意，你完全可以通过重复类选择器和 ID 选择器来将内容分组，但这样做时请确保你记住了特异性规则，并正确排列顺序。\n\n与前面的示例一样，我们先渲染这个效果，这样你可以在我们开始之前看看它是什么样子的。\n\
    \n![Figure 63: 样式化之前的投影 div](img/d6b4d2d62fbe04b9c83d677f3498c239_81_0.png)\n\n\
    一旦我们让这个效果生效，我们将创建一些示例规则来为我们的元素应用不同的投影。\n\n```css\n.niceDiv.topLeftShadow\n{\n\
    \  box-shadow: -10px -10px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow:\
    \ -10px 10px;\n}\n\n.niceDiv.bottomRightShadow\n{\n  box-shadow: 10px 10px;\n\
    }\n\n.niceDiv.topRightShadow\n{\n  box-shadow: 10px -10px;\n}\n```\n\n代码清单 62b：为\
    \ 62a 中的 HTML 应用不同阴影的 CSS 规则\n\n现在我们需要对 HTML 做一个小改动，将每个新的类名 `topLeftShadow`、`bottomLeftShadow`\
    \ 等分别添加到代码清单 62a 中 HTML 的每个 **div** 上，如下所示：\n\n```html\n<div class=\"niceDiv topLeftShadow\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\
    \ bottomLeftShadow\">\n    <p>This is a nice div with drop shadows</p>\n</div>\n\
    <div class=\"niceDiv bottom versatility amazing versality\">\n    <p>This is a\
    \ nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv topRightShadow\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n```\n\n代码清单 62c：为我们的\
    \ div 添加四个投影类\n\n以防你想知道这里发生了什么，我们利用了 CSS 的层叠特性来获得优势，这样我们就不必在四条规则中分别输入四次基础的米色 **div**\
    \ 样式；这样做意味着更少的输入和更好的复用。\n\n如果我们重新渲染，你现在应该能看到每个 **div** 元素上都有四个默认的、块状的投影，分别朝向四个方向。\n\
    \n![Figure 64: 我们的 div 元素带有默认投影](img/d6b4d2d62fbe04b9c83d677f3498c239_82_0.png)\n\
    \n然而，投影的默认设置是非常粗重和实心的；改变这一点就是剩余两个可选测量值发挥作用的地方。\n\n第一个值是模糊半径；你不能对其使用负值，但你提供的任何正值都会使阴影越来越模糊，每个递增的值都会带来更柔和的外观。\n\
    \n按如下方式更改代码清单 62b 中的规则：\n\n```css\n.niceDiv.topLeftShadow\n{\n  box-shadow: -10px\
    \ -10px 5px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow: -10px 10px 5px;\n\
    }\n\n.niceDiv.bottomRightShadow\n{\n  box-shadow: 10px 10px 5px;\n}\n\n.niceDiv.topRightShadow\n\
    {\n  box-shadow: 10px -10px 5px;\n}\n```\n\n代码清单 62d：修改 CSS 规则以模糊阴影\n\n然后重新渲染你的测试\
    \ HTML 文档，你现在应该看到阴影变得稍微柔和一些了。\n\n> Figure 65：我们的 div 元素添加了少量模糊效果\n\n模糊值越大，阴影的边缘就越柔和。\n\
    \n> Figure 66：我们的 div 元素使用了 30px 的模糊半径\n\n第四个参数控制模糊从边缘扩展的程度，称为扩展半径。\n\n如果我们在模糊半径上增加\
    \ 10 像素，阴影将总共增长到 20 像素（我们已经有了 10 像素的偏移量），但最后的 10 像素将用于模糊及其相关的渐隐效果。按如下方式更改阴影规则：\n\
    \n```css\n.niceDiv.topLeftShadow\n{\n    box-shadow: -10px -10px 30px 10px;\n\
    }\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow: -10px 10px 30px 10px;\n}\n\n\
    .niceDiv.bottomRightShadow\n{\n    box-shadow: 10px 10px 30px 10px;\n}\n\n.niceDiv.topRightShadow\n\
    {\n    box-shadow: 10px -10px 30px 10px;\n}\n```\n\n> 代码清单 62e：修改 CSS 规则以模糊阴影\n\
    \n然后重新渲染，你应该会得到一些非常大、非常模糊的阴影，边缘非常柔和：\n\n> Figure 67：我们的 div 元素应用了可选的扩展半径\n\n为可选值找到合适的视觉效果很大程度上是一个反复试验的过程，但一般来说，扩展半径越大，模糊就有越多的空间来渐隐，从而可以实现更平滑的过渡。\n\
    \n**注意：如果你有某些特定的 Z 轴排列（即，如果你使用的是 div 层），那么就有可能将阴影投射到同级元素上。因此，通常最好尽量将投影保持在元素堆叠的较低位置，或者调整模糊和偏移量的大小，使效果保持在你在元素上定义的任何边距范围内。**\n\
    \n最后一个值是颜色值，与元素上的任何其他颜色属性一样，它可以接受任何标准颜色值。目前我们只使用标准的 6 位 # 符号方式来指定颜色，因为我们将在下一章更详细地探讨颜色定义。\n\
    \n将你的规则修改为如下所示：\n\n```css\n.niceDiv.topLeftShadow\n{\n    box-shadow: -10px -10px\
    \ 20px 5px #FF0000;\n}\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow: -10px\
    \ 10px 20px 5px #00FF00;\n}\n\n.niceDiv.bottomRightShadow\n{\n    box-shadow:\
    \ 10px 10px 20px 5px #0000FF;\n}\n\n.niceDiv.topRightShadow\n{\n    box-shadow:\
    \ 10px -10px 20px 5px #FFFF00;\n}\n```\n\n代码清单 62e：修改 CSS 规则以给阴影着色\n\n重新加载 HTML\
    \ 后，你应该看到你的阴影现在更加明亮、色彩更丰富，而且更好看了。\n\n*Figure 68：我们的阴影现在更加多彩了*\n\n你可以通过在规则中指定可选的\
    \ **inset** 关键字使阴影显示在元素内部（而不是像我们之前做的那样显示在外部）。但是，如果你使用 inset，必须将其放在所有值之前。最后一次修改我们的规则：\n\
    \n```css\n.niceDiv.topLeftShadow\n{\n    box-shadow: inset -10px -10px 20px 5px\
    \ #FF0000;\n}\n\n.niceDiv.bottomLeftShadow\n{\n    box-shadow: inset -10px 10px\
    \ 20px 5px #00FF00;\n}\n\n.niceDiv.bottomRightShadow\n{\n    box-shadow: inset\
    \ 10px 10px 20px 5px #0000FF;\n}\n\n.niceDiv.topRightShadow\n{\n    box-shadow:\
    \ inset 10px -10px 20px 5px #FFFF00;\n}\n```\n\n代码清单 62e：修改 CSS 规则以使阴影变为内阴影\n\n\
    然后重新渲染以查看效果。\n\n![Figure 69：我们的 div 元素带有内阴影效果](img/d6b4d2d62fbe04b9c83d677f3498c239_86_0.png)\n\
    \n# 文字投影\n\nCSS3 还支持为普通文本元素添加投影。当你这样做时，阴影的形状将跟随文本的形状，而不仅仅是元素边框的轮廓。\n\n这里的区别在于，虽然参数大致相同，但它们的指定顺序与\
    \ box-shadow 的参数有很大不同。\n\n指定文字阴影时，规则的格式如下：\n\n```css\ntext-shadow: <color> <offsetx>\
    \ <offsety> <blurRadius>\n```\n\n文字阴影不支持扩展半径，而且颜色必须在列表中排在第一位而不是最后。\n\n作为一个快速示例，将以下\
    \ HTML 添加到你的文档中：\n\n```html\n<h1>Drop Shadow Text</h1>\n```\n\n代码清单 63a：用于演示文字投影的\
    \ HTML\n\n然后添加以下样式规则：\n\n```css\nh1\n{\n  text-shadow: red 10px 10px 10px;\n}\n\
    ```\n\n代码清单 63b：为代码 63a 中的文字添加投影的 CSS 规则\n\n你应该会得到类似 Figure 70 的效果：\n\n![Figure\
    \ 70：带有红色投影的文字](img/d6b4d2d62fbe04b9c83d677f3498c239_87_0.png)\n\n这些参数的工作方式与 box-shadow\
    \ 相同，所以我们不再进行冗长的描述；相反，我将其留给读者自行实验。\n\n关于这两种阴影规则，你最后需要知道的是，你可以为一个元素添加多个阴影声明，用逗号分隔。\n\
    \n当你这样做时，效果将是累加的，任何相互重叠的阴影将按照它们在 CSS 规则中指定的顺序从前到后绘制。这可以用来在元素周围创建一些相当奇怪的光晕效果。但请记住要谨慎使用：即使现在的浏览器可能变得越来越快，这样的效果仍然需要消耗计算能力和\
    \ CPU 能源来绘制，移动设备用户可能不会因为你为了美观而耗尽他们的设备电池而感谢你。\n"
