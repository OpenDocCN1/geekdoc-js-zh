  md: '# # A quick word on browser compatibility


    One final thing that we need to address before moving on is browser compatibility.


    Anyone who''s done any kind of HTML frontend-driven web development knows all
    too well the pain involved in making code appear uniform across all browsers.


    This won''t be more true if you''ve spent any time working with the CSS2 and HTML4
    standards, and the browser wars of not-too-distant years.


    Because CSS3 comes in, in-line with the newer HTML 5 standards, then I''ll not
    be going out of my way to ensure the code I present will work without fail on
    all older browsers.


    For the course of this book I''ll be working with the following browser:


    ```

    Google Chrome 39.0.2171.95 m

    ```


    I''ll also have the following browser versions available, but won''t necessarily
    be using them:


    +   - Firefox 34.0.5

    - Internet Explorer 11.0.9600.17501 Update 11.0.15 (KB3008923)

    - Maxthon Cloud Browser 4.4.3.4000


    Since I''ll mostly be sticking to features that are more or less complete, or
    have identical support across the four browsers mentioned, then you should have
    no problems using a different browser. I will, however, note where possible any
    changes that may be needed.


    Be aware that there may be cases, when using a different browser, where a vendor
    prefix may be needed (but that I''ve missed due to my use of Chrome).


    As a general rule of thumb, I develop using Chrome, then modify to accommodate
    other browsers. If something does not work as expected, then please do look up
    the CSS3 syntax for the nonworking code, online, before assuming that the code
    is broken.


    As for minimum versions, I won''t be attempting to make any code in this book
    work correctly you may need to use an appropriate helper library of some kind
    to fill in the gaps. Due to the sheer number of helpers available, there is unfortunately
    no room in this book to discuss them all.'
  merge: -1
