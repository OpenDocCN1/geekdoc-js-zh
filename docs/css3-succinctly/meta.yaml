    ```\n\n*代码清单 64e：使用颜色断点的 CSS 规则*\n\n你会发现现在渲染 HTML 时，你会得到一个黑色背景，上面有一条渐变的绿色条纹。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_93_0.png)\n\n*图 76：我们的 div 现在看起来相当暗*\n\
    \n你可以使用任何你喜欢的值类型来指定断点，但为了便于阅读，我建议你坚持使用百分比值，尤其是当你需要像图 76 那样精确控制值的时候。\n\n## 径向渐变\n\
    \n与线性渐变类似，径向渐变从一个定义的点（通常是元素的中心）开始，以向外运动的方式产生颜色渐变。它们也接受与线性渐变相同的颜色设置（和颜色断点）。\n\n\
