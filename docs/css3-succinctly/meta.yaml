    \n这有很多原因。想象一下，你有一个元素，通过 CSS 规则添加了一个元素，而这个元素又添加了一个元素；如果不小心，你很容易就会陷入无限循环，导致一切停止。\n\
    \nCSS 规则也被设计为一次性解析，，因此任何插入需要样式的元素都将意味着必须停止、返回并重新处理已经见过的规则，然后再回来继续。\n\n然而，你仍然可以用它们实现一些非常有趣的技巧。\n\
