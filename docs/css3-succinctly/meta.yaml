    \         url('fonts/amble-bold-webfont.svg#amblebold') format('svg');\n    font-weight:\
    \ normal;\n    font-style: normal;\n}\n\n@font-face\n{\n    font-family: 'nobileregular';\n\
    \    src: url('fonts/nobile-regular-webfont.eot');\n    src: url('fonts/nobile-regular-webfont.eot?#iefix')\
    \ format('embedded-opentype'),\n         url('fonts/nobile-regular-webfont.woff2')\
    \ format('woff2'),\n         url('fonts/nobile-regular-webfont.woff') format('woff'),\n\
    \         url('fonts/nobile-regular-webfont.ttf') format('truetype'),\n      \
    \   url('fonts/nobile-regular-webfont.svg#nobileregular') format('svg');\n   \
    \ font-weight: normal;\n    font-style: normal;\n}\n\n.ambleBold\n{\n  font-family:\
    \ 'amblebold'\n}\n\n.nobileRegular\n{\n  font-family: 'nobileregular'\n}\n```\n\
    \nCode Listing 68b: CSS font rules to style and use the HTML in Code Listing 68a\n\
    \nWith the appropriate font files copied to a folder called **fonts** in the same\
    \ place as your test HTML document and style sheet, if you load the document into\
    \ your browser, you should see the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_109_0.png)\n\
    \nFigure 90: Our HTML rendered using a custom font\n\nYou can specify as many\
    \ `@font-face` rules as you wish. Once you've defined them, you can simply use\
    \ the name you defined them with in any CSS rule that you would use one of the\
    \ original web-safe fonts in.\n\nAs you can see in our demo, however, I prefer\
    \ to actually define a class-based rule with the font name in it. This allows\
    \ me to just add the class name to the list of classes for an element; then if\
    \ I ever need to change the font, I only need to change it in one place rather\
    \ than in several different rules. Again, it's up to you how you structure this\
    \ in your own projects; the only thing you have to make sure of is that the various\
    \ `url` keywords in each of the font definitions can be downloaded.\n\nOne of\
    \ the most common problems I see with developers working on the Windows platform\
    \ under the IIS web server is that sometimes fonts don't render correctly, even\
    \ though the font files are there and the CSS files are correct. The reason this\
    \ happens is that by default, IIS doesn't have a mime type listing for the woff\
    \ and woff2 font extensions (on some older ones, ttf and svg are not defined,\
    \ either). You can verify this by requesting the font directly in your browser's\
    \ address bar. If the font does not have a correct mime type, you'll get a 404\
    \ error from the server telling you the font could not be found."
  mdcn: "\n这样做简单来说意味着：尝试查看是否拥有 times 字体；如果没有，则寻找 times new roman；如果仍然失败，则回退到 'serif'\
    \ 标识符，并让平台选择最佳匹配。\n\n不过，你仍然不能随心所欲地使用任何你喜欢的任何字体。\n\n例如，如果你指定了 **`Impact Bold`,\
    \ `sans-serif`**，那么任何安装了 **`Impact Bold`** 的平台都会按照预期显示。如果该字体不可用，则会使用 sans-serif。它看起来可能与原字体完全不同，因此许多设计会直接崩溃，无法正确渲染。\n\
    \nCSS3 通过提供一种新能力解决了所有这些问题：现在可以将不同格式的字体与你的 Web 应用程序一起打包，如果 Web 服务器检测到目标平台没有可用字体，则下载并使用它们。\n\
    \n这仍然不意味着你不应该使用 Web 安全字体列表；因为一旦失去网络连接，你就回到了原点。然而，这意味着你可以指定 **`Impact Bold`**，并且有很大机会以\
    \ **`Impact Bold`** 渲染，而显示失败仅在极端情况下才会出现。\n\n## 使用 Web 字体\n\n既然你已经知道了“为什么”，那么让我们来看看“怎么做”。\n\
    \n### 创建合适的字体\n\n获取用于设计的字体最简单的方法可能是使用极佳的 Font Squirrel 网站，它可以将你系统中的字体转换为一套立即可用的\
    \ CSS3 规则和样式表。\n\n前往 [Font Squirrel](http://fontsquirrel.com)，你应该会看到类似这样的界面（截至\
    \ 2015 年 1 月 6 日有效）：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_105_0.png)\n\n\
    图 86：Font Squirrel Webfont 生成器\n\n使用它很简单；你点击、添加字体并选择想要添加的字体文件。添加完想要转换的字体后，你必须点击同意框才能继续。然后\
    \ Font Squirrel 将为你转换字体。完成后，它会提供一个 zip 文件的下载链接，其中包含多种不同 Web 兼容格式的字体，以及一些 CSS 文件和\
    \ HTML 标记示例，向你展示如何使用它。\n\n> **注意：** 请*非常*小心地选择你要转换和使用的字体。许多字体供应商对于你被允许以及不被允许如何使用其字体有着极其严格的规定。他们大多数将这种为了在网页上使用而进行的字体转换过程归类为盗版，并且在向网站所有者指出这一点时并不友好。我知道有些公司甚至不屑于发警告信，直接给毫无防备的网站所有者寄来授权费账单并要求立即付款。除非你使用的是已知允许使用的字体，否则请务必检查字体的授权要求。其中许多字体供应商甚至通过允许你使用该字体创建图像并在网页中使用图像，但不允许直接使用该字体，从而增加了限制。\n\
    \n在网页中使用字体的另一种选择是开源的 [Google Fonts 目录](https://fonts.google.com)。\n\nGoogle 通过这个工具，允许网站上列出的所有字体都可以在网页设计中使用。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_106_0.png)\n\n*图 87：Google Fonts (2015\
    \ 年 1 月)*\n\n通过 Google Fonts，你可以搜索、筛选并比较列表中的任何字体，一旦决定使用某种字体，你可以将其添加到集合中或查看其使用的快速示例。\n\
    \n快速使用页面特别有用，因为它列出了立即将该字体添加到网页所需的所有信息。通过遵循快速使用页面上的说明并复制粘贴给出的示例代码，你可以直接从 Google\
    \ 的全球内容分发网络使用该字体，因此加载速度快，而且你无需费力地将其下载并添加到自己的 Web 服务器中。\n\n如果你选择将其添加到集合，那么你可以继续添加其他字体，所有字体都将出现在页面底部的“集合\
    \ (Collection)”面板中。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_107_0.png)\n\n\
    图 88：Google Fonts 集合面板\n\n在这个面板中，你只需点击 Use 按钮，就会被带到一个与快速使用页面类似的页面以完成集成。\n\n##\
