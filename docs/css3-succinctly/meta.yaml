    \ 像素圆角的 div*\n\n因为每个角是四分之一，而圆的四分之一是 90 度，所以如果我们把值改为 90 像素，就会得到一个完美的圆形。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_77_1.png)\n\
    \n*图 60：带 90 像素圆角的 div*\n\n在上面的演示中，我们使用了单值格式，但如果你愿意，也可以指定所有四个值（每个角一个）。将代码清单 61b\
    \ 中的 **border-radius** 行改为如下所示：\n\n```\nborder-radius: 5px 10px 15px 20px;\n```\n\
    \n*代码清单 61c：修改后的 61b 边框半径行*\n\n渲染后，你应该会看到一个带有四个不同大小圆角的 `div`：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_78_0.png)\n\
    \n*图 61：带四个不同大小圆角的 div*\n\n第一个值是左上角，接着是右上角，然后是右下角，最后是左下角。\n\n如果你愿意，也可以使用四个不同的规则，将大小规范写出来，如下所示：\n\
    \n```\nborder-top-left-radius: 5px;\nborder-top-right-radius: 10px;\nborder-bottom-right-radius:\
    \ 15px;\nborder-bottom-left-radius: 20px;\n```\n\n*代码清单 61d：将 61c 中的更改写出来*\n\n\
    如何选择完全取决于你；有些人喜欢用冗长的方式做事，老实说，在开发过程中我发现这有助于维护代码。但是，当你发布到生产环境时，你确实希望这些东西尽可能小。\n\n\
    一个好的 CSS 压缩工具对于优化你的样式文件是必需的，特别是如果你在开发过程中使用了长格式。\n\n> **注意：压缩 CSS**——压缩是在不丢失任何原始意图的情况下，使文件比原来更小的过程。与压缩或\
    \ zip 文件不同，压缩后的文件仍然以原始意图的方式运行——只是变得小了很多，更紧凑了。拥有一个好的压缩工具来压缩你的文件对于 Web 开发来说是必不可少的。当你的网站加载时，你能获得的最大加速之一，就是让你的样式、代码、标记和图像尽可能小、尽可能少。\n\
    \n有大量工具可以帮助你完成这项工作。一个很好的起点是使用 [Grunt 任务运行器](http://gruntjs.com/)。Grunt 拥有大量用于压缩\
    \ CSS、JavaScript、图像甚至 HTML 的模块，让你可以在每个地方节省宝贵的字节。知道如何使用这些工具对于任何 Web 开发者来说都是一项非常重要的技能。\n\
    \n你也不必为每个角只指定一个角度。如果你指定了，那么两边将应用相同的角度，给你一个均匀且相等的基于圆的曲线。\n\n如果你在每个角上指定两个值，那么你就可以使用椭圆来塑造边框的曲线半径。这样做会给你带来一些有趣的可能。\n\
    \n将你的边框半径规则更改为如下所示：\n\n```\nborder-top-left-radius: 50px 15px;\nborder-top-right-radius:\
    \ 50px 15px;\nborder-bottom-right-radius: 15px 50px;\nborder-bottom-left-radius:\
    \ 15px 50px;\n```\n\n*代码清单 61：扩展边框半径规则以显示基于椭圆的曲线*\n\n你应该会得到类似图 62 的效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_79_0.png)\n\
    \n*图 62：我们的 div 带有基于椭圆的圆角*\n\n## 阴影\n\n创建阴影是另一个容易掌握的视觉特效，它可以产生一些有趣的效果。\n\n阴影是通过使用\
    \ **box-shadow** 规则创建的，该规则接受四个整数度量值和一个颜色值。\n\n在提供的四个度量值中，只有前两个是必需的；如果省略后两个，它们将默认为浏览器的默认值。\n\
    \n前两个度量值是偏移 X 和偏移 Y 值，顾名思义，它们设置阴影从元素突出显示的距离。如果提供正值，则阴影从右下方突出；如果使用负值，阴影则从左上方突出。要让阴影出现在其他角上，你需要根据需要混合正负偏移量。\n\
