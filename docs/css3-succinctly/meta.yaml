    \ 标记\n\n```\n.boldred\n{\n  font-family: serif;\n  font-size: 20pt;\n  color:\
    \ red;\n}\n```\n\n> 代码清单 3b：现在在 styles.css 中定义的加粗红色样式规则\n\n你可以立即看到这里的区别，要在另一行上重用该规则，我们只需在标签上添加\
    \ `class=\"boldred\"` 作为属性。如果我们随后继续将样式规则从例如红色更改为绿色，那么每个使用该规则的元素都会突然变成绿色，而无需触及任何\
    \ HTML 标记。\n\n所以现在我们知道 CSS 为什么被定义；接下来我们将开始研究它是如何工作的。\n\n### 层叠规则\n\n敏锐的读者可能已经在问自己\
    \ CSS 中的“层叠”部分代表什么。层叠意味着向下流动或跟随，而这正是 CSS 样式表所做的。\n\n暂不考虑特异性这个主题（本书后面会涵盖），在链中更靠后被遵守或发现的规则会覆盖更靠前的所有规则。如果你不习惯这一点，它可能会给你带来一些有趣的错误和挑战，尤其是在你刚开始探索什么是可用的、什么不是的时候。\n\
    \n然而，一旦你看到它在实践中如何工作，这个概念就相当简单了。\n\n考虑以下样式规则：\n\n```\n.mystyle\n{\n  font-size:\
    \ 10pt;\n  color: green;\n}\n```\n\n> 代码清单 4：简单的绿色文本 CSS 规则\n\n如果你将此规则附加到一个元素上，你会理所当然地期望文本大小为\
    \ 10 点，颜色为绿色。\n\n现在想象这个规则是在一个已经实现的样式表中定义的，该样式表包含在项目其他地方（例如作为内容管理系统的一部分）。\n\n此外，想象你被要求将使用该规则的所有文本改为红色，但又不能更改之前创建的样式文件。\n\
    \n你可能无法更改原始文件的原因多种多样；例如，该样式表可能也被第二个网站使用，那里的文本必须保持绿色，或者样式可能是动态生成的。无论原因是什么，这种情况发生的频率比你预期的要高得多。\n\
    \n但是，如果你只是创建第二个样式文件（我们称之为 **styles2.css**），然后复制链接标签（如前一章基本 HTML 代码中所示）并相应地更改文件名，我们就可以开始向这个新文件添加以下\
    \ CSS 规则。\n\n```\n.mystyle\n{\n    color: red;\n}\n```\n\n> 代码清单 5：我们在 'styles2.css'\
    \ 中创建的重复规则\n\n如果你操作正确，那么你应该会在浏览器中看到红色文本，而不是绿色文本。\n\n为了继续使用绿色版本，你只需省略加载 **styles2.css**\
    \ 的第二个链接，并包含它来将你的规则“调整”为红色。\n\n如果你在原始文件中更改字体大小，你会看到那一个更改将影响文本的红色和绿色版本。\n\n这种样式的层叠可以用多种不同的方式使用；不过，在我解释之前，还有一个重要的回顾主题你需要先理解。\n\
    \n### CSS 选择器\n\n到目前为止，你只看到了使用“class”属性的 CSS 规则，但还有许多其他方式可以定义规则。\n\n考虑以下 HTML\
