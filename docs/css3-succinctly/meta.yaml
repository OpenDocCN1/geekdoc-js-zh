    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n<div class=\"niceDiv\"\
    >\n    <p>This is a nice div with drop shadows</p>\n</div>\n```\n\n*代码清单 62a：用于演示阴影的\
    \ HTML 标记*\n\n创建以下样式规则作为本节其余部分的基础：\n\n```\n.niceDiv\n{\n    width: 100px;\n  \
    \  height: 100px;\n    background-color: beige;\n    padding: 4px;\n    border:\
    \ 1px solid black;\n    display: inline-block;\n    margin: 15px;\n}\n```\n\n\
    *代码清单 62b：用于设置 62a 中 HTML 样式的 CSS 规则*\n\n这将给我们带来你在上一节看到的默认米色 div，没有额外的样式。\n\n\
    > 注意：到目前为止，你已经看到很多规则从其上方的、特异性较低的规则中层叠下来。这是 CSS3（及之前版本）最大的特性之一，我之前没有过多详述。在上一节中，我们直接将边框半径添加到\
