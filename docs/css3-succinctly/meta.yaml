  md: '# Summary


    CSS3 introduced many new selector types, allowing even more precise control over
    how you target various parts of your HTML document. We''ll be covering these in
    the next chapter as we start to explore the new things that CSS3 brings to the
    table for modern day web developers.


    In this chapter, we took a quick look at CSS as a technology/language, and had
    a quick refresher on how it does what it does. Moving forward from here, we''ll
    start to delve into topics specific to this new version of CSS. If you''re still
    having problems making sense of CSS in general, then I suggest working through
    some of the various sites that are available to you on the internet today.


    One particular site I can heartily recommend is [HTML Dog](https://www.htmldog.com).
    Not only is this site crammed full of all the essential information you might
    need to know, but it also carries a number of tutorials, reference guides, and
    resource links to other useful places on the internet that should help you further
    your knowledge.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# # Chapter 3 New Selectors


    In the previous chapter you saw a brief refresher of the most common types of
    selectors used in CSS. These three types are known as the class, ID, and descendant
    selectors, and were all that was available before version 3 of CSS. Now that CSS3
    is here, it has brought many new selectors as part of its new functionality.


    We won''t be covering every new selector in this chapter, but you''ll see rather
    quickly the sheer flexibility now available to target your HTML elements in ways
    you might never even have imagined.


    Many of these new selectors are implemented as pseudo-selectors (selectors that
    act as an extension to another selector, such as hover), and you could easily
    write an entire book just on the subject of selectors alone.


    In this chapter, we''ll look only at the most important of the new selectors available,
    along with a basic demonstration of their uses. For the rest, I strongly advise
    you to read many of the excellent resources available on the internet. Aside from
    the other links I''ve already mentioned, a great place to start purely for CSS
    topics is the CSS pages on the [Mozilla Developer Network](https://developer.mozilla.org/).
    The handy thing about MDN is the compatibility guides, which will tell you at
    a glance which selectors work with which browsers, and which ones will give you
    problems.


    # ## The Universal Selector (*)


    The *target all* selector does exactly what it says: it targets everything it
    can in the space in which it is operating.


    That means if you have it inside an ID-based selector, then everything that falls
    under the control of that ID selector will be affected.


    Using the * symbol tells you straight away that it behaves like a wild card, being
    as greedy as possible and selecting as much as possible. At first, this may seem
    like a great thing, until you suddenly realize just how much it slows your page
    down on a mobile device, or on a page with millions of nested elements.


    The universal selector is designed primarily to make sweeping changes as part
    of an initial setup, such as setting a pages entire CSS model to a known set of
    defaults (like 0-pixel margins and no borders).


    Typically it''s used in CSS resets to start at a known state. Many of the well-known,
    front-end UI frameworks make extensive use of it to put your page into a known
    state before applying any custom styles they may provide.


    The universal selector should be used sparingly, and its sphere of influence should
    be made as minimal as possible so as not to cause any drastic performance bottlenecks.'
  merge: -1
  pgno: 22
- img_proc: true
  md: "If you wanted to make sure that the margins and padding were set to 0 on every\
    \ element in your document, then you might apply this selector as shown in Code\
    \ Listing 13.\n\n```\n*\n{\n  margin: 0;\n  padding: 0;\n}\n```\n\n*Code Listing\
    \ 13: Using the universal selector*\n\nAfter including this somewhere near the\
    \ top of your style file, you can be sure that immediately after it, none of your\
    \ rules will have any margins or padding applied to them.\n\n# The Adjacent Sibling\
    \ Selector (+)\n\nOne of the simpler selectors to understand, the adjacent selector\
    \ selects elements that are immediately next to each other, and does so only once\
    \ for each occurrence.\n\nImagine you have the following HTML markup:\n\n```\n\
    <div>\n    <h1>Heading</h1>\n    <p>Text line 1</p>\n    <p>Text line 2</p>\n\
    \    <h1>Heading</h1>\n    <p>Text line 1</p>\n    <p>Text line 2</p>\n</div>\n\
    ```\n\n*Code Listing 14a: HTML markup to demonstrate the adjacent selector*\n\n\
    If you then applied the following CSS rule to:\n\n```\nh1 + p\n{\n  color: red;\n\
    }\n```\n\n*Code Listing 14b: CSS rule to demonstrate the adjacent selector*\n\n\
    Only the **p** element immediately following the **h1** element would be changed\
    \ to a red color. The second line of text (and any others that might follow) will\
    \ remain unchanged, as will the **h1** elements themselves, as Figure 6 shows:"
  merge: -1
  pgno: 23
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_24_0.png)\n\nOne of the places that\
    \ the adjacent sibling selector is most useful is in the creation of lead or opening\
    \ paragraphs. Consider the following example.\n\n```\n<!doctype html>\n<html>\n\
    <head>\n    <title>Basic HTML 5 document</title>\n    <link href=\"styles.css\"\
    \ rel=\"Stylesheet\" type=\"text/css\" />\n</head>\n\n<body>\n\n    <section>\n\
    \        <article>\n            <h1>Monstrous Inbox</h1>\n            <p>Today\
    \ in local news, a monstrous email inbox was discovered belonging to Mr Jones\
    \ of durham.</p>\n            <p>The email inbox was rumoured to have 11ty billion\
    \ unread emails in it, but scientists say that calculating the actual amount is\
    \ going to be almost impossible.</p>\n            <p>Mr. Jones had no comment,\
    \ but he did let slip that he had no idea how his inbox grew so large and so fast.</p>\n\
    \        </article>\n        <article>\n            <h1>Jelly Table Legs</h1>\n\
    \            <p>Furniture Watchdogs are today warning all people to be on the\
    \ lookout for tables with Jelly legs.</p>\n            <p>In recent months there\
    \ have been a spate of fake tables released into the global furniture market,\
    \ these fake tables are exceptionally dangerous and could wobble over at any moment.</p>\n\
    \            <p>People should exercise extreme caution when buying new tables,\
    \ if you're unsure call a professional table tester to ensure you're getting a\
    \ genuine product.</p>\n        </article>\n    </section>\n```"
