    \n从下一章开始，我们将探讨你们大多数人一直在期待的内容：视觉特效。我们将从大家都喜欢的元素入手：圆角、阴影和渐变填充。\n\n## 第5章 服务器端\n\n\
    CSS3 有大量方法可以让事物变得美观。\n\n对于开发者（尤其是那些大部分时间都在服务器端工作的人来说），他们可能不明白这有什么好大惊小怪的；我们是被雇来制作软件的，而这正是我们正在做的事情。\n\
    \n可惜，在客户端和浏览器中，情况并非如此。那些不理解我们做什么或如何做的同事，喜欢看到炫目、多彩、闪闪发光的东西。\n\n当他们看到这种类型的进展时，就会将这种视觉反馈视为应用程序正在开发中的证据。\n\
