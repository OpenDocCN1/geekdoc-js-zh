    \ attribute that essentially gives the HTML\nparser a name for it</p>\n```\n\n\
    > Code Listing 6a: HTML markup with an ID attribute\n\n```\n#importantInfo\n{\n\
    \    color: red;\n    font-size: 14pt;\n}\n```\n\n> Code Listing 6b: CSS Style\
    \ rule that targets a given ID\n```"
