    ## Color Values


    If named colors are not enough, and the hex notation is too cumbersome for you,
    then you''ll be pleased to know that with CSS3, you can define your colors using
    one of four new data types.


    These types are used in a similar way to those seen previously in the section
    on gradients, by specifying them as a keyword followed by a set of parameter values
    in parentheses.


    The values inside the parentheses can take either a fixed value or a percentage
    value. Our medium grey example from the beginning of this chapter could now be
    represented as follows:


    - #7F7F7F

    - rgb(127, 127, 127)

    - rgb(50%, 50%, 50%)


    All three of these values, when used in any place in CSS that a color could be
    specified, will result in the same color being generated.


    You can also now specify colors with an Alpha Channel using the `rgba` keyword.


    > Note: An alpha component is a value that specifies a level of opacity that a
    given color uses. Think of it like a transparency value where 0 is fully transparent
    and 255/100 percent is fully non-transparent with values in between offering differing
    levels of transparency. It''s like a screen door: you can see through the door,
    but you can''t just walk through it, because it''s still a physical object. Transparency
    is similar, and the level of a given Alpha value determines how much you can see
    through the "door."


    The `rgba` keyword is used in exactly the same way as the `rgb` keyword, but takes
    an additional value that specifies the Alpha level: `rgba(127,127,127, 0.5)`


    Unlike the color values themselves, however, you cannot supply a percentage value
    or an integer from 0 to 255 for the alpha amount.


    Instead, you have to use a floating point based number from 0 to 1 where 0 is
    fully transparent and 1 is fully non-transparent, with 0.5 representing the halfway
    mark.


    Most people just go for the easy values, such as **0**, **0.1**, **0.2**.... **0.8**,
    **0.9**, **1**


    However, you can get finer control if you need it by doubling the digits up, like
    this: **0.01**, **0.32**, **0.84**


    For the common percentage values, you''ll often use the following values:


    - 0.00 = 0%

    - 0.25 = 25%

    - 0.50 = 50%

    - 0.75 = 75%

    - 1.00 = 100%


    When you double the numbers up this way, it suddenly becomes easy to correlate
    percentage values to the 0-to-1 scale used.


    There''s one more way of specifying colors we need to cover, and this will make
    more sense to those of you who have been trained in correct color theory as a
    professional graphic artist or designer. This is the `hsl` and `hsla` way.


    Used in exactly the same way as an `rgb` color value, the `hsl` method gives different
    meaning to the first three values.


    Rather mixing levels of Red, Green, and Blue, they instead specify Hue, Saturation,
    and Lightness.


    I''m not going to go into the full theory of color here, but the Hue value represents
    how far along the color chart you are, with 0 degrees being red and 360 degrees
    being magenta/red; as you go around the 360 degree color wheel from 0 to 360,
    you get a different root color value.


    The Saturation is how strong that selected color value is from 0 percent (very
    weak) to 100 percent (very strong), and the Lightness value is 0 percent (very
    dark/usually black) to 100% (very light or bright).


    Everything is explained in detail on is fully non-transparent, with 0.5 representing
    the halfway mark.


    Most people just go for the easy values, such as **0**, **0.1**, **0.2**.... **0.8**,
    **0.9**, **1**


    However, you can get finer control if you need it by doubling the digits up,..........


    ## Summary


    In this fairly short chapter we looked at how colors are defined in CSS3. I''ve
    deliberately not created any code listings, as there''s plenty of opportunity
    to go back to previous samples and replace the values in the `color`, `background-color`,
    and `gradient` rules if you want to experiment.


    We''ve looked at how CSS3 has made it easier to specify colors in your style rules
    and introduced a few internet resources that will make remembering and specifying
    them even more useful.


    In the next chapter, we''re going to dive into using the new font functionality
    that''s now available for CSS3-based pages.


    ## Chapter 7  Web Fonts


    For pretty much the entire life of the HTML/CSS specification, web developers
    and designers have been restricted to the same core set of fonts for their typography.


    I''ve lost count of the amount of heated debates and discussions I''ve seen on
    the subject, and I know firsthand the frustration of having a client wanting text
    in a specific font only to have to tell them it can''t be done.


    If you wanted to use a given font, you often had to prepare the text in an art
    package or word processor that had access to the font you wanted, and then either
    save the image as a browser-compatible image file or make a screen grab from your
    word processor to use in your HTML document.


    Needless to say, this wasn''t easy. Spelling mistakes and simple text changes
    took an extremely long time to correct (and before anyone asks, I have had at
    least one client over the years that wanted EVERY bit of body text done this way),
    and it really was impractical for anything other than simple banners or headlines.


    While there was a large amount of frustration surrounding the use of fonts, there
    were good, sound reasons for restricting things, and these usually boiled down
    to platform differences.


    Early browsers were nowhere near as graphically capable as the browsers of today,
    and many operating systems only had a limited amount of fonts installed, so the
    HTML committees formulated a list of known fonts that were pretty much guaranteed
    to be present on any platform running any graphical browser. For the record, we''re
    not just talking Windows and Mac—back then you had more variations of Unix and
    Linux, and each of these had their own specific desktop environments. It wasn''t
    until the early 1990s that many of them started to standardize, using things like
    X11 and windows managers such as GNOME and KDE. Even Windows was available in
    at least four different versions.


    The restricted base font list that was almost always guaranteed to work was:


    - sans-serif

    - serif

    - fantasy

    - cursive

    - monospace


    If you specified your font using one of these, you''d get that platform''s version
    of the font, and while it might not always be exactly identical, the look, style,
    and feel would be close enough that your design''s layout wouldn''t be too badly
    affected.


    Depending on your platform, you could also supply overrides to be used. Commonly
    on sites developed on Windows machines, you would see fonts described as:


    > *Times, "Times New Roman", serif*'
