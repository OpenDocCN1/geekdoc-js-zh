    This will produce the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_42_0.png)\n\
    \n*Figure 24: Output produced by Code Listing 37 with the rules in Code Listing_previous\
    \ image\n\nWhat we've covered here hasn't even scratched the surface of the potential\
    \ available, especially when it comes to attribute selectors.\n\nUnder HTML 5\
    \ there's a new attribute type called a data-attribute. This new attribute takes\
    \ the form of:\n\n**data-**\n\nfollowed by a custom name, for example:\n\n**data-username**\n\
    \n**data-recordIndex**"
  - '[PAGE 43]


    You can use these data attributes on any element, for any purpose, and when combined
    with the correct selectors, they allow you use HTML 5 to describe its own intentions
    and style easily.


    # Summary


    In this chapter we took a fairly deep dive into the main new selectors added in
    CSS3. We''ve seen how we''re no longer limited in how we can target our elements
    to style, and how we no longer have the restrictions we used to have, allowing
    almost limitless expression in our rules.


    In the next chapter we''ll take a closer look at the new pseudo selectors, which,
    when combined with what we''ve learned so far, will take the capabilities we have
    to new heights.'
  - "[PAGE 44]\n\n# Chapter 4  New Pseudo Selectors\n\nIn the previous chapter, we\
    \ covered the new main selectors added to CSS3. Now, we go further by exploring\
    \ the new pseudo selectors that have been added.\n\nPseudo selectors are different\
    \ than the regular selectors because they can't be used on their own. Instead,\
    \ they need to be combined with other selectors, such as those in the previous\
    \ two chapters, in order to do their job. At least, that's how they're described\
    \ in the mainstream.\n\nThe truth of the matter is that many of the pseudo selectors\
    \ can now indeed be used without any suffixing rule (as you'll see in a moment),\
    \ but you do still get the best from them when combining them with a regular selector.\n\
    \nSome of the selectors you'll see in this chapter are actually not new in CSS3\
    \ and have been around quite some time. In previous versions, however, they either\
    \ were not well known, or because of the IE6/IE7/IE8 compatibility generation\
    \ problems, they were actively avoided and not used much.\n\nTo kick things off,\
    \ we'll deal with the oldest ones first.\n\n# :focus\n\nAs the name suggests,\
    \ **focus** is used when an input element has focus within a document. This is\
    \ usually used in forms to highlight the active field.\n\nLet's create a mock-up\
    \ form using the following HTML markup:\n\n```\n<form action=\"#\" method=\"post\"\
    >\n    <label for=\"txtUserName\">User Name</label><br />\n    <input type=\"\
    text\" id=\"txtUserName\" name=\"txtUserName\" /><br /><br />\n    <label for=\"\
    txtEmail\">Email</label><br />\n    <input type=\"text\" id=\"txtEmail\" name=\"\
    txtEmail\" /><br /><br />\n    <input type=\"submit\" value=\"Submit\" />\n</form>\n\
    ```\n\n*Code Listing 39: Mock HTML form markup*\n\nThis will give us a very generic\
    \ looking HTML form."
  - "[PAGE 45]\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_0.png)\n\nLet's add\
    \ the following simple rule to our style sheet:\n\n```\n:focus\n{\n  background-color:\
    \ beige;\n  color: green;\n}\n```\n\n*Code Listing 40: Simple Focus CSS rule*\n\
    \nIf we re-render our browser, and click into one of the form fields so that it\
    \ gets the focus, we should see that it changes to reflect the selected state.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_1.png)\n\nYou might notice in the\
    \ example that I've used **focus** on its own without extending anything. In CSS3,\
    \ many of the pseudo selectors can now be used in this manner; it simply means\
    \ apply it to anything that understands the selector.\n\nFor our example, any\
    \ element that can receive focus from the user will change its color as specified\
    \ when focus is given to it."
  - "[PAGE 46]\n\n# # A slight diversion into visited status\n\nI just want to briefly\
    \ break off and show another pseudo selector that's been around since V2 of the\
    \ CSS spec. It can be used alone in the same way as **focus**, but can also be\
    \ used maliciously to find out a person's browsing history.\n\nIf you place some\
    \ external anchor tags in your document as follows:\n\n```\n<ul>\n    <li><a href=\"\
    http://www.google.co.uk/\">Google</a></li>\n    <li><a href=\"http://www.yahoo.co.uk/\"\
    >Yahoo</a></li>\n    <li><a href=\"http://msn.com\">MSN</a></li>\n</ul>\n```\n\
    \n*Code Listing 41a: External URLs*\n\nThen apply the following style rules:\n\
    \n```\n:link\n{\n    color: green;\n}\n\n:visited\n{\n    color: red;\n}\n```\n\
    \n*Code Listing 41b: Styles for the external URLs in 41a*\n\nWhen you render your\
    \ document, you'll see the following.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_46_0.png)\n\
    \n*Figure 27: Links rendered by Code Listing 41*\n\nYou might see that some or\
    \ even all of the links have a red color. In my case, only the Google link does,\
    \ and this is because the Google main UK site is in my browser history, whereas\
    \ the other two are not.\n\nIf you look at the CSS, you'll see that the styling\
    \ is provided by the **visited** pseudo selector, giving you, the user of the\
    \ page, instant visual confirmation that you recently visited that page."
- md: "While this might seem fairly innocuous on the surface, if you dig down under\
    \ the hood and look at some of the new JavaScript API's that have been added in\
    \ newer specifications, you'll find that there's an API call that goes by the\
    \ name of `getComputedStyle`. Using this call, it's possible to get the actual\
    \ computed style that's visible on the element in the browser, or at least it\
    \ was.\n\nIn today's modern browsers, this hole is largely patched, and attempting\
    \ to use this call to get the color of the link will in fact just return whatever\
    \ the base color is. In our case, all we get back (even for the Google link) is\
    \ the green color.\n\nI have, however, heard rumors that it's possible to use\
    \ JQuery and MooTools to retrieve the correct value and make a distinction.\n\n\
    This is just a small example of the fact that anything can be used to breach a\
    \ user's privacy or security, even something as common as CSS. Always make sure\
    \ that your rules are specific if possible. Just because you can use them globally\
    \ without a rule to extend, doesn't mean you should. If you tie them to given\
    \ rule sets, it means that your style rules can't be abused by people hacking\
    \ around with the browser tools.\n\n## :disabled and :enabled\n\nAmong the many\
    \ new attributes that can be applied to elements in the HTML 5 spec is the `disabled`\
    \ attribute.\n\nYou use it like any other attribute by simply adding \"disabled\"\
    \ to an element in your markup.\n\nLet's reuse the form mock-up we created in\
    \ Code Listing 39, but change it so that it looks as follows:\n\n```\n<form action=\"\
    #\" method=\"post\">\n    <label for=\"txtUserName\">User Name</label><br />\n\
    \    <input type=\"text\" id=\"txtUserName\" name=\"txtUserName\" disabled /><br\
    \ /><br />\n    <label for=\"txtEmail\">Email</label><br />\n    <input type=\"\
    text\" id=\"txtEmail\" name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n```\n\nCode Listing 42: Mock HTML form markup\
    \ with disabled elements\n\nWhen you render it, you should see that the first\
    \ input element can't be used now.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_0.png)\n\
    \nFigure 28: Simple form with a disabled input\n\nLet's add the following rule\
    \ to our style sheet:\n\n```\ninput:disabled\n{\n    background-color: red;\n\
    \    border: 2px solid blue;\n}\n```\n\nCode Listing 43: CSS rule to style disabled\
    \ elements\n\nYou'll see a drastic change when you re-render the form.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_1.png)\n\
    \nFigure 29: Simple form with disabled pseudo class in Code Listing 43 applied\n\
    \nIf you remove the **disabled** attribute from the element, the input will revert\
    \ back to its original state.\n\nThis rule is typically used to show read-only\
    \ fields in a record editor, or to show fields that are not applicable to the\
    \ current form. For example, you might mark up a form so that address fields are\
    \ shown only when a tick box to send mail to that address is ticked.\n\nIf you\
    \ use the Bootstrap UI framework, you might have seen that some elements when\
    \ used in a form have a small, red stop circle displayed over them when you hover\
    \ over them with a mouse pointer. This is performed in the same way, using the\
    \ disabled rule to change the style of the mouse pointer.\n\nThe **enabled** pseudo\
    \ selector is the logical opposite of disabled, and applies the given style to\
    \ an element that is NOT disabled, as the following example shows:\n\n```\ninput:enabled\n\
    {\n  background-color: yellow;\n  border: 2px solid green;\n}\n```\n\nCode Listing\
    \ 44: CSS rule to style enabled elements\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_49_0.png)\n\
    \nFigure 30: Browser form showing enabled CSS rules applied\n\nAn element is classed\
    \ as enabled when there is no reason to disable it, or specifically, when it does\
    \ not have a **disabled** attribute applied.\n\nNote that an element is also classed\
    \ as disabled if the element's Boolean **disabled** property is set to **true**\
    \ on its document object using JavaScript. In this case, as with other selectors,\
    \ the application of the disabled and enabled selectors are explicitly applied\
    \ based on the element's state, meaning you don't have to keep making sure the\
    \ correct elements have the correct classes applied.\n\n## :valid and :invalid\n\
    \nAnother of the great features added to HTML 5 is browser-side validation. With\
    \ browser-side validation, you can make the browser verify the inputs to a form\
    \ before the form is submitted.\n\nLike the disabled selector, the pseudo selectors\
    \ here apply to elements only when we use the extra attributes and markup provided\
    \ in the specification.\n\nUsing our form again, let's make another change so\
    \ that you have the following HTML code:\n\n```\n<form action=\"#\" method=\"\
    post\">\n    <label for=\"txtUserName\">User Name</label><br />\n    <input type=\"\
    text\" id=\"txtUserName\" name=\"txtUserName\" required /><br /><br />\n    <label\
    \ for=\"txtEmail\">Email</label><br />\n    <input type=\"email\" id=\"txtEmail\"\
    \ name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n```\n\nCode Listing 45: Mock HTML form markup with validatable\
    \ elements\n\nThe changes might not be obvious at first, but if you look at the\
    \ user name box, you'll see that it now has a **required** attribute.\n\nThe email\
    \ input, however, no longer has a type of **text**; it now has a type of **email**.\n\
    \nIf we render this, and then click **Submit** without entering any values, we'll\
    \ see something similar to the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_0.png)\n\
    \nFigure 31: Our basic form showing the required attribute in action\n\nIf we\
    \ add something in the name box, and put something in the email box, but deliberately\
    \ format the email incorrectly, we'll also get validation on the format of the\
    \ email.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_1.png)\n\nFigure 32: Our\
    \ basic form showing the email validation in action\n\nThere's more to the validation\
    \ classes that I'll be showing here, but for now, add the following rules to your\
    \ style sheet:\n\n```\ninput:valid\n{\n    background-color: green;\n}\n\ninput:invalid\n\
    {\n    background-color: red;\n}\n```\n\nCode Listing 46: CSS3 Validation rules\n\
    \nIf you then render the page, you should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_51_0.png)\n\
    \nFigure 33: Simple form with validation styles from Code Listing 46 applied\n\
    \nThe user name is immediately red because it's required, so until it's filled\
    \ in, it's classed as invalid.\n\nThe email is valid, as we've only told it that\
    \ it must have its input validated as an email address. We haven't said that it's\
    \ required as input, so having a blank email is valid. However, if you start typing\
    \ in it, it will change to red and won't change back to green until the input\
    \ is either correctly formed, or removed entirely.\n\nUsing `valid` and `invalid`\
    \ is a great way of giving feedback to the user, but seeing them immediately as\
    \ soon as the form is displayed is generally not considered good practice.\n\n\
    For this reason, you would usually NOT apply them directly to input elements as\
    \ I have (in fact, you can see I've just used a very broad selector because the\
    \ button is green too). Usually, you'll attach them to a class/id name, then check\
    \ and apply them using JavaScript when the form is submitted.\n\nAs this book\
    \ is about CSS, I'm not going to go into detail about that here. If you want to\
    \ venture further down the rabbit hole of HTML 5 validation, there's a post on\
    \ [my blog](https://example.com) that will get you started.\n\n## :in-range and\
    \ :out-of-range\n\nFollowing on with the validation pseudo selectors, we have\
    \ **in-range** and **out-of-range**. These are both used in a similar way to **valid**\
    \ and **invalid** in the previous section, but they handle a different scenario.\n\
    \nValidation of text types and contents are not the only validation to be added\
    \ to the new specifications; the HTML 5 spec also brings with it number types\
    \ and minimum/maximum ranges.\n\nCreate another dummy form, but this time, rather\
    \ than a user name and email input box, let's define a number range.\n\n```\n\
    <form action=\"#\" method=\"post\">\n  <label for=\"nmbUserAge\">User Age</label><br\
    \ />\n  <input type=\"number\" id=\"nmbUserAge\" name=\"nmbUserAge\" min=\"16\"\
    \ maximum=\"100\" /> <br /><br />\n  <input type=\"submit\" value=\"Submit\" />\n\
    </form>\n```\n\nCode Listing 47a: Mock HTML form with a number input\n\nLet's\
    \ apply the following styles to our form:\n\n```\ninput[type=number]:in-range\n\
    {\n  background-color: yellow;\n}\n\ninput[type=number]:out-of-range\n{\n  background-color:\
    \ salmon;\n}\n```\n\nCode Listing 47b: Styles for our number range form in Listing\
    \ 47a\n\nWhen we render the form, we'll initially see it show using the out-of-range\
    \ color, due to the fact that it has no value in it.\n\nIf we then start entering\
    \ values, we should see the color change depending on what value we enter, in\
    \ range or out."
  mdcn: "\n尽管这表面上看起来似乎相当无害，但如果你深入挖掘并查看较新规范中新增的一些 JavaScript API，就会发现有一个名为 `getComputedStyle`\
    \ 的 API 调用。通过此调用，可以获取浏览器中元素上实际可见的计算后样式——至少过去是这样。\n\n在当今的现代浏览器中，这个漏洞已被大幅修补，尝试使用此调用来获取链接颜色实际上只会返回基础颜色。就我们的情况而言，即使对于\
    \ Google 链接，返回的也全是绿色。\n\n不过，我曾听说使用 JQuery 和 MooTools 可以检索到正确的值并加以区分。\n\n这只是一个小小的例子，说明任何事物都可能被用来侵犯用户的隐私或安全，即使是像\
    \ CSS 这样常见的东西。请务必尽可能使你的规则具体明确。仅仅因为你可以在没有规则约束的情况下全局使用它们，并不意味着你应该这样做。如果将它们绑定到特定的规则集上，就意味着你的样式规则不会被那些使用浏览器工具瞎搞的人滥用。\n\
    \n## :disabled 和 :enabled\n\n在 HTML 5 规范中可以应用于元素的众多新属性中，有 `disabled` 属性。\n\n你像使用任何其他属性一样使用它，只需在标记中的元素上添加\
    \ \"disabled\" 即可。\n\n让我们重用代码清单 39 中创建的表单模型，但将其更改为如下所示：\n\n```\n<form action=\"\
    #\" method=\"post\">\n    <label for=\"txtUserName\">User Name</label><br />\n\
    \    <input type=\"text\" id=\"txtUserName\" name=\"txtUserName\" disabled /><br\
    \ /><br />\n    <label for=\"txtEmail\">Email</label><br />\n    <input type=\"\
    text\" id=\"txtEmail\" name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n```\n\n代码清单 42：包含禁用元素的模拟 HTML 表单标记\n\n当你渲染它时，应该会看到第一个输入元素现在无法使用了。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_0.png)\n\n图 28：一个禁用了输入的简单表单\n\n\
    让我们将以下规则添加到样式表中：\n\n```\ninput:disabled\n{\n    background-color: red;\n    border:\
    \ 2px solid blue;\n}\n```\n\n代码清单 43：为禁用元素设置样式的 CSS 规则\n\n当你重新渲染表单时，你会看到显著的变化。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_1.png)\n\n图 29：应用了代码清单 43 中禁用伪类的简单表单\n\
    \n如果你从元素上移除 **disabled** 属性，输入将恢复到其原始状态。\n\n此规则通常用于在记录编辑器中显示只读字段，或显示不适用于当前表单的字段。例如，你可能会设计一个表单，使得只有当勾选了向该地址发送邮件的复选框时，才显示地址字段。\n\
    \n如果你使用 Bootstrap UI 框架，你可能已经注意到，表单中的某些元素在鼠标指针悬停时会显示一个小的红色停止圆圈。这是以相同的方式执行的，使用\
    \ disabled 规则来更改鼠标指针的样式。\n\n**enabled** 伪选择器在逻辑上与 disabled 相反，并将给定的样式应用于未被禁用的元素，如下例所示：\n\
    \n```\ninput:enabled\n{\n  background-color: yellow;\n  border: 2px solid green;\n\
    }\n```\n\n代码清单 44：为启用元素设置样式的 CSS 规则\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_49_0.png)\n\
    \n图 30：显示已应用启用 CSS 规则的浏览器表单\n\n当没有理由禁用元素时，或者更具体地说，当元素未被应用 **disabled** 属性时，该元素被视为已启用。\n\
    \n请注意，如果通过 JavaScript 将元素的布尔 **disabled** 属性在其文档对象上设置为 **true**，则该元素也将被归类为已禁用。在这种情况下，与其他选择器一样，disabled\
    \ 和 enabled 选择器的应用明确基于元素的状态，这意味着你不必一直确保正确的元素具有正确的应用类。\n\n## :valid 和 :invalid\n\
    \n添加到 HTML 5 的另一个很棒的功能是浏览器端验证。通过浏览器端验证，你可以让浏览器在表单提交之前验证表单的输入。\n\n与 disabled 选择器类似，这里的伪选择器仅在我们使用规范中提供的额外属性和标记时才应用于元素。\n\
    \n再次使用我们的表单，让我们做另一个更改，使其具有以下 HTML 代码：\n\n```\n<form action=\"#\" method=\"post\"\
    >\n    <label for=\"txtUserName\">User Name</label><br />\n    <input type=\"\
    text\" id=\"txtUserName\" name=\"txtUserName\" required /><br /><br />\n    <label\
    \ for=\"txtEmail\">Email</label><br />\n    <input type=\"email\" id=\"txtEmail\"\
    \ name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n```\n\n代码清单 45：包含可验证元素的模拟 HTML 表单标记\n\n这些更改一开始可能不明显，但如果你查看用户名框，会看到它现在有了一个\
    \ **required** 属性。\n\n然而，电子邮件输入的类型不再是 **text**；它现在是 **email** 类型。\n\n如果我们渲染这个页面，然后在不输入任何值的情况下点击\
    \ **Submit**，我们将看到类似以下的内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_0.png)\n\
    \n图 31：我们的基本表单展示 required 属性的效果\n\n如果我们在名称框中输入一些内容，并在电子邮件框中输入一些内容，但故意将电子邮件格式设置错误，我们还将获得关于电子邮件格式的验证。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_1.png)\n\n图 32：我们的基本表单展示电子邮件验证的效果\n\
    \n我将在这里展示更多关于验证类的内容，但现在，请将以下规则添加到你的样式表中：\n\n```\ninput:valid\n{\n    background-color:\
    \ green;\n}\n\ninput:invalid\n{\n    background-color: red;\n}\n```\n\n代码清单 46：CSS3\
    \ 验证规则\n\n如果你然后渲染页面，应该会得到以下内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_51_0.png)\n\
    \n图 33：应用了代码清单 46 中验证样式的简单表单\n\n用户名立即显示为红色，因为它是必需的，所以在填入之前，它被视为无效。\n\n电子邮件是有效的，因为我们只告诉它必须将输入验证为电子邮件地址。我们没有说它必须是输入项，因此空白的电子邮件是有效的。然而，如果你开始在其中输入内容，它将变为红色，并且只有在输入格式正确或完全删除后才会变回绿色。\n\
    \n使用 `valid` 和 `invalid` 是向用户提供反馈的好方法，但一显示表单就立即看到它们通常不被认为是好的做法。\n\n因此，你通常不会像我这样直接将它们应用于\
    \ input 元素（事实上，你可以看到我只是使用了一个非常宽泛的选择器，因为按钮也是绿色的）。通常，你会将它们附加到一个类/ID 名称上，然后在表单提交时使用\
    \ JavaScript 检查和应用它们。\n\n由于这本书是关于 CSS 的，我不会在这里详细讨论这一点。如果你想进一步探索 HTML 5 验证的兔子洞，我的[博客](https://example.com)上有一篇文章可以帮助你入门。\n\
    \n## :in-range 和 :out-of-range\n\n继续讨论验证伪选择器，我们有 **in-range** 和 **out-of-range**。它们的使用方式与上一节中的\
    \ **valid** 和 **invalid** 类似，但处理的是不同的场景。\n\n对文本类型和内容的验证并不是新规范中添加的唯一验证；HTML 5 规范还带来了数字类型和最小/最大范围。\n\
    \n创建另一个虚拟表单，但这次，不是用户名和电子邮件输入框，我们来定义一个数字范围。\n\n```\n<form action=\"#\" method=\"\
    post\">\n  <label for=\"nmbUserAge\">User Age</label><br />\n  <input type=\"\
    number\" id=\"nmbUserAge\" name=\"nmbUserAge\" min=\"16\" maximum=\"100\" /> <br\
    \ /><br />\n  <input type=\"submit\" value=\"Submit\" />\n</form>\n```\n\n代码清单\
    \ 47a：带有数字输入的模拟 HTML 表单\n\n让我们将以下样式应用于我们的表单：\n\n```\ninput[type=number]:in-range\n\
    {\n  background-color: yellow;\n}\n\ninput[type=number]:out-of-range\n{\n  background-color:\
    \ salmon;\n}\n```\n\n代码清单 47b：为清单 47a 中的数字范围表单设置样式\n\n当我们渲染表单时，最初会看到它以 out-of-range\
    \ 颜色显示，因为其中没有值。\n\n然后，如果我们开始输入值，应该会看到颜色根据输入的值而改变，无论是在范围内还是在范围外。\n"
