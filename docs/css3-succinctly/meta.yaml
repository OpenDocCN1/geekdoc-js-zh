  - '[PAGE 105]


    Doing things this way meant, quite simply: try and see if you have the times font;
    if not, look for times new roman, and if that fails, then fall back to the ''serif''
    identifier, and let the platform select the best match.


    You still couldn''t just use any font you felt like, though.


    For example, if you specified **`Impact Bold`, `sans-serif`**, then any platform
    that had **`Impact Bold`** installed would display us intended. If the font wasn''t
    available, then sans-serif would be used. It might look nothing like the original
    font, and so many designs would simply fall apart and fail to render correctly.


    CSS3 fixes all of this by providing the ability to now package fonts in different
    formats with your web application and have the web server download use and them
    if it detects the target platform does not have them available.


    This still doesn''t mean that you should not use the web safe fonts list; all
    it takes is loss of connectivity, and you''re back at square one. It does mean,
    however, that you could specify **`Impact Bold`** and have a very good chance
    of rendering in **`Impact Bold`** with display failures apparent now in extreme
    circumstances.


    # ## Using Web Fonts


    Now that you know the "why," let''s look at the "how."


    # ### Creating a suitable font


    Perhaps the easiest way of getting a font to use with your design is to use the
    fantastic Font Squirrel website, which can be used to convert a font from your
    system into an instantly useable kit of CSS3 rules and style sheets.


    Head to [Font Squirrel](http://fontsquirrel.com) and you should see something
    like this (valid as of January 6, 2015):


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_105_0.png)


    Figure 86: The Font Squirrel Webfont Generator'
  - '[PAGE 106]


    Using it is simple; you click, add fonts, and select the font files you wish to
    add. Once you''ve added the fonts you wish to convert, you MUST click the agreement
    box to proceed. Font Squirrel will then convert your fonts for you. Once it''s
    finished, it will present you with a download link to a zip file containing your
    font in several different web-capable formats, along with a number of CSS files
    and HTML markup examples showing you how to use it.


    > **Note:** Be *VERY* careful about what you convert and use. Many typography
    providers are exceptionally strict about how you are and are not allowed to use
    their fonts. Most of them class this process of font conversion for use on a webpage
    as piracy and are less-than-friendly when pointing this out to website owners.
    I know of firms that have not even bothered with warning letters and have just
    slammed unsuspecting website owners with bills for licensing fees with immediate
    demand for payment. Unless you''re using a font that you know you''re allowed
    to use, ALWAYS be sure to check the font''s licensing requirements. Many of them
    make it even more difficult by allowing you to create an image using a font and
    use that in your webpage, but will not allow the use of the font directly.


    Another alternative to using fonts in your webpages is the open source [Google
    Fonts directory](https://fonts.google.com).


    Google makes a point with this tool of allowing all the fonts listed on the site
    to be useable in webpage designs.


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_106_0.png)


    *Figure 87: Google Fonts (January 2015)*


    With Google Fonts, you can search, filter, and compare any of the fonts in the
    list, then once you''ve decided on a font you wish to use, you can add it to a
    collection or view quick examples of its use.'
  - '[PAGE 107]


    The quick use page is particularly useful because it lists everything you need
    to know to immediately add that font to your webpage. By following the instructions
    on the quick use page and copying and pasting the sample code given, you get to
    use the font directly off Google''s global content delivery networks, so it loads
    fast, and you don''t have to go to the hassle of downloading it and adding it
    to your own web server.


    If you choose to add it to a collection, then you can keep adding other fonts,
    and all will appear in your Collection panel at the bottom of the page.


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_107_0.png)


    Figure 88: Google Fonts Collection panel


    From this panel, you just need to click the Use button and you''ll be taken to
    a page that looks the same as the Quick Use page to finish off the integration.


    # ## Manually adding fonts


    To finish this chapter, I''ll take you through an example of adding your own fonts
    to your webpages. I''ll use two fonts that i previously converted using Font Squirrel
    called Amble and Nobile. If you go to the main page of Font Squirrel and look
    through the free fonts list, you can find both of these and more. You''ll have
    to download them, unzip them, and then convert them using the web font generator
    tool.


    Once you have the fonts converted, open the zip files that were provided to you,
    and you should find a number of files going by the name of the font you chose.


    Looking at the zip file for the Nobile font you''ll see something like the following
    (I''m using the excellent, free zip program here called 7-Zip):


    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_107_1.png)


    Figure 89: 7-Zip showing a partial listing of our font kit'
