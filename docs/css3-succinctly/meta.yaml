    \ but for ease of reading I would recommend you stick to percentage values, especially\
    \ if you need to finely control the values as I've done in Figure 76.\n\n# Radial\
    \ Gradients\n\nLike linear gradients, radials start at a defined point (usually\
    \ the center of the element) and produce the color graduation in an outward motion.\
    \ They take also the same set of color settings (and color stops) as linear gradients\
    \ do.\n\nStarting with a simple example (and re-using the HTML from the previous\
    \ section), change your CSS rule as follows:\n\n```\n.gradDiv\n{\n    background-image:\
    \ radial-gradient(red, yellow);\n}\n```\n\nCode Listing 65a: our CSS rule altered\
