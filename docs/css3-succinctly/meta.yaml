    > Note: Depending how far back you need to support, you might still need to use
    vendor prefixes. I''ve noted that the vendor-prefixed versions use different syntax
    to specify the gradients. What I haven''t yet mentioned, however, are how the
    rotations are calculated. Standard syntax sees 0 degrees at the middle bottom
    of the target element, with positive increments from 0 to 360 degrees traveling
    clockwise. You can see this in the 30 degree rotation in the previous example
    as the red starts from the lower-left corner. In the browser-prefixed versions,
    two different schemes were used—the standard as it is now, and one where 0 degrees
    was middle right with positive rotations going counterclockwise from 0 to 360.


    Linear gradients can also contain more than two colors; in fact, they can contain
    as many colors as you want. Remember those rainbow-colored backgrounds folks used
