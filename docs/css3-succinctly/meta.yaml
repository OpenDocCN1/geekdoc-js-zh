  - "[PAGE 63]\n\n**Before** and **after** are probably two of the most flexible pseudo\
    \ selectors available, and the development community still hasn't discovered all\
    \ the ways they can be used.\n\n# First-X, Last-X, and nth-X\n\nI've chosen to\
    \ represent this last group as one collection as they are all related. The first,\
    \ last and nth pseudo selectors are used for selecting the first, last and user-defined\
    \ count of elements in a list of elements.\n\nThere are two distinct groups in\
    \ this batch; we'll look at the general selectors (that is, the ones that will\
    \ select anything), then the type specific selectors. These two groups are listed\
    \ in the CSS3 spec as:\n\nfirst-child, last-child, nth-child()\n\nand\n\nfirst-of-type,\
    \ last-of-type, nth-of-type()\n\nFor the first set of examples, we'll use the\
    \ following HTML markup to illustrate how the selectors work, and what they can\
    \ do.\n\n```\n<ul>\n    <li>List Item One</li>\n    <li>List Item Two</li>\n \
    \   <li>List Item Three</li>\n    <li>List Item Four</li>\n    <li>List Item Five</li>\n\
    \    <li>List Item Six</li>\n    <li>List Item Seven</li>\n    <li>List Item Eight</li>\n\
    \    <li>List Item Nine</li>\n    <li>List Item Ten</li>\n</ul>\n```\n\n*Code\
    \ Listing 55: Unordered list markup for first, last and nth selectors*\n\nAs we've\
    \ done with everything else thus far, here's the before rendering of our markup\
    \ in the browser:"
  - "[PAGE 64]\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_0.png)\n\nLike many\
    \ of the selectors available, their names describe without any doubt what they\
    \ do. Let's apply the following rules to the HTML in Code Listing 55.\n\n```\n\
    ul > li:first-child\n{\n    color: red;\n}\n\nul > li:last-child\n{\n    color:\
    \ green;\n}\n```\n\n*Code Listing 56: CSS rules to demo 'first-child' and 'last-child'\
    \ pseudo selectors*\n\nAs you might predict, the first and last items in our unordered\
    \ list change color as anticipated.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_64_1.png)\n\
    \nThe first-child and last-child selectors are about as simple as we get; nth-child(),\
    \ however, requires a little more explanation."
  - '[PAGE 65]


    You may notice that unlike the others, nth-child has a set of parentheses following
    it. This is because unlike the other selectors, nth-child accepts a parameter
    to control it.


    This parameter takes the form of an algebraic equation that describes what to
    select and how.


    > **Note:** For many folks, doing algebra at school is a distant memory. For those
    who do remember it, they''d probably much rather they didn''t. However, even though
    you might have wondered then when it might ever come in handy, remembering how
    it works will really help you with algebraic expressions in CSS3. If you are struggling
    to remember any of it, then now might be a good time to have a quick refresher.


    Don''t be frightened; an algebraic equation is something that describes how a
    number calculation should work, but not necessarily what the actual answer should
    be.


    Many folks will have come across something at some stage in their lives that looks
    like this:

    **1n+5x=6y**


    To those who remember, this is called algebra, and is a quite specialist branch
    of mathematics that many folks study for years on end. Solving these strange equations
    is somewhat of a hobby for many theoretical mathematicians, and some even devote
    years of their lives to simply theorizing about these things.


    For those who are still scratching their heads, that little bit of algebra means
    the following:


    The equation 1 multiplied by the value of n when added to 5 multiplied by the
    value of x will be always equal to 6 multiplied by the value of y, where n, x,
    and y are theoretical instances that hold no current value.


    Don''t worry, you don''t need to know algebra in that kind of depth to understand
    how an nth-child works, but you do need to know how algebra works.


    When you have a discrete value followed by a theoretical instance, that theoretical
    instance is usually multiplied in some manner by the operator. Operators can also
    apply additions and subtractions, or just be specified on their own to give a
    static value.


    For example:


    **1** means just that: 1, an offset of 1, a count of 1, one page, one thing...
    it really doesn''t matter, because it''s theoretical.


    **1n**, on the other hand, means 1 amount of **n**, or 1 multiplication of **n**;
    again, **n** can represent anything because it''s all theoretical.


    **1n+1** means 1 amount of n with an additional 1 added to it.


    Perhaps an easier way to understand how these equations work, is to imagine using
    them to perform multiplication tables. Remember, for example, the 3 multiplication
    table:


    **3 x 0 = 0**'
- md: " **3 x 1 = 3**\n**3 x 2 = 6**\n**3 x 3 = 9**\n**3 x 4 = 12**\n\nAnd so on…\n\
    \nNow, imagine that the **n** in our **3n** is the multiplicand in the second\
    \ column (the value 0 to 4); you then start to see how n references any value\
    \ in the range.\n\nIf you then treat the result as a static number, you end up\
    \ with the following static sequence.\n\n**0, 3, 6, 9, 12**\n\nLet that sink in\
    \ for a moment.\n\nNow think back to the list of HTML elements in Code Listing\
    \ 55. There are 10 list item children in that list, and if we forget about the\
    \ numbers 0 and 12 in our static list, we have 3, 6 and 9, which could all be\
    \ offsets to select (0 and 12 are not valid items, as they don't exist).\n\nWell,\
    \ that's exactly what nth-child() does. It uses the algebraic equation passed\
    \ to it to determine exactly which elements in a list it needs to select.\n\n\
    Let's apply the following CSS rule to our list from Code Listing 55:\n\n```\n\
    ul > li:nth-child(3n)\n{\n  color: red;\n}\n```\n\n*Code Listing 57a: nth-child\
    \ CSS rule to select every third element*\n\nWhat will happen is that every third\
    \ element in the list will be affected by the rule.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_66_0.png)\n\
    \n*Figure 49: Our nth-child(3n) rule in action*\n\nIf we start adding a + offset\
    \ to that, we dictate where the multiplication starts:\n\n```\nul > li:nth-child(3n+1)\n\
    {\n  color: red;\n}\n```\n\n*Code Listing 57b: nth-child CSS rule to select every\
    \ third element starting at element 1*\n\nThis will produce the following:\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_67_0.png)\n\n*Figure 50: nth-child(3n+1)\
    \ starting at 1 and selecting every third element*\n\nWhich, as you can see, starts\
    \ with element index number 1, then applies the multiplication of 3 each time,\
    \ to select every third item.\n\nYou can use just an **n** on its own too, which,\
    \ when used with a positive offset, allows you to select ranges. For example:\n\
    \n```\nul > li:nth-child(n+7)\n{\n  color: red;\n}\n```\n\n*Code Listing 57c:\
    \ nth-child CSS rule to select everything from 7 onwards*\n\nWill start at offset\
    \ 7 and simply select everything left from that point on.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_0.png)\n\
    \nFigure 51: nth child selecting elements from 7 onwards\n\nYou can also go backwards\
    \ by simply prefixing the **n** with a minus symbol.\n\n```\nul > li:nth-child(-n+7)\n\
    {\n    color: red;\n}\n```\n\nCode Listing 57d: nth-child CSS rule to select everything\
    \ from 7 backwards\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_1.png)\n\nFigure\
    \ 52: nth child selecting from 7 backwards\n\nIf you're just trying to select\
    \ a single numbered element in a list, you can do the following:\n\n```\nul >\
    \ li:nth-child(5)\n{\n    color: red;\n}\n```\n\nCode Listing 57e: nth-child CSS\
    \ rule to select just index number 5\n\nJust specifying the number index directly\
    \ will select only that numbered element.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_69_0.png)\n\
    \n*Figure 53: nth-child selecting just the fifth element in the list*\n\nI could\
    \ easily fill up the rest of this book with different combinations of nth-child\
    \ equations, but I think we've got enough for now.\n\nI can take a guess at the\
    \ question that most of you are asking yourselves at this point.\n\n> \"How might\
    \ I use this to select and stripe all the rows in a table or grid? Can you maybe\
    \ tell me what the equation for that is?\"\n\nThe good news here is that the W3C\
    \ standards committee realized that this was likely to be one of the most common\
    \ uses of the nth-child pseudo selector, so they added a couple of shortcuts:\
    \ **even** to select every even numbered element, and **odd** to select every\
    \ odd numbered element.\n\nIf you add the following rule:\n\n```\nul > li:nth-child(odd)\n\
    {\n    color: red;\n}\n```\n\n*Code Listing 57f: nth-child CSS rule to select\
    \ every odd numbered element*\n\nYou should see that every odd list item in the\
    \ markup gets selected.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_70_0.png)\n\
    \nFigure 54: nth-child selecting every odd element\n\nI think by this point you'll\
    \ likely want to give your brain a rest, so we'll leave the algebra behind for\
    \ now.\n\nTake note though, that there is still a massive amount we've not covered.\
    \ For example, you can chain nth-child selectors (just as you can with many others),\
    \ leading to some crazy selector rules that look like this:\n\n**nth-child(3n+1):nth-child(even)**\n\
    \nThis will select every third element, starting at index 1, but only those that\
    \ have an even number for the index. For 11 elements, this would select only elements\
    \ with an index of 4 and 10 (all the others are odd numbers).\n\nYou can easily\
    \ select ranges, then split those ranges up. You can combine those range selections\
    \ with **first-child** and **last-child** too, allowing you only to select the\
    \ start and end of a range. It's a subject in itself that perhaps warrants an\
    \ entire book, and to date there have been some very clever uses of the **nth-child**\
    \ pseudo selector; for us though, it's time to move on.\n\nThe second group of\
    \ pseudo selectors that fall under the **first**, **last** and **nth** element\
    \ selections are the **of-type** selectors.\n\nThe **first-of-type**, **last-of-type**,\
    \ and **nth-of-type** selectors all work exactly the same way as the general selectors\
    \ described previously in this chapter, but they target a specific element type.\n\
    \nLet's take our unordered list from Code Listing 55, and change it a bit to turn\
    \ it into a definition list.\n\n```\n<dl>\n    <dt>HTML 5</dt>\n    <dd>HTML 5\
    \ is the markup language used to create documents that are published on the internet</dd>\n\
    \    <dt>CSS3</dt>\n    <dd>CSS3 is the markup language used to add style and\
    \ colors to documents created using HTML 5</dd>\n    <dt>HTTP (Hyper Text Transfer\
    \ protocol)</dt>\n    <dd>HTTP is the mechanism by which HTML (copyleft) documents\
    \ and their associated resources are transported on the internet</dd>\n    <dt>WWW\
    \ (World Wide Web)</dt>\n    <dd>The World Wide Web is the collective name for\
    \ the many hundreds of thousands of HTML 5 documents published via the internet</dd>\n\
    \    <dt>The Internet</dt>\n    <dd>The internet is a massive global computer\
    \ network, which amongst other things holds the World Wide Web</dd>\n</dl>\n```\n\
    \n*Code Listing 58: Definition list markup for first, last and nth selectors*\n\
    \nA definition list is slightly different to the other types of lists. Rather\
    \ than just list item elements, there are in fact two different types of child\
    \ elements present within it: **dt** elements or \"Definition Titles,\" and **dd**\
    \ elements, or \"Definition, definitions.\"\n\nIf we render Code Listing 58, we\
    \ can see the default styling for both of these:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_71_0.png)\n\
    \n*Figure 55: Definition list with default styling*\n\nIf we try to apply one\
    \ of our previous rules to this list (modified slightly to account for the different\
    \ tag types), for example, the CSS rule to select every third child (Code Listing\
    \ 57a), we'll see that it doesn't quite do what we might expect it to do.\n\n\
    ```\ndl > :nth-child(3n)\n{\n  color: red;\n}\n```\n\n*Code Listing 59a: Modified\
    \ nth-child rule for our definition list*\n\nIt tries to select every third child\
    \ element, and even though we can target things specifically by name, we may have\
    \ to deal with wildly varying list contents.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_72_0.png)\n\
    \nFigure 56: *nth-child gets our selection wrong.*\n\nHowever, if we use `nth-of-type()`:\n\
    \n```\ndt:nth-of-type(2n)\n{\n\tcolor: red;\n}\n```\n\nCode Listing 59b: 'nth-of-type'\
    \ CSS rule to be used instead of 'nth-child'\n\nWe quickly see that it effects\
    \ only the elements we ask it to.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_72_1.png)\n\
    \nFigure 57: *nth-of-type gets our selection right*\n\nThe **nth-of-type** (and\
    \ for that matter **first-of-type** and **last-of-type**) only considers targeted\
    \ elements as specified to be candidates for selection.\n\nIn a previous example\
    \ we saw some markup that might be used for a news page; if you were to use **nth-of-type**\
    \ on that, you'd get the flexibility of selecting things as you would with **nth-child**,\
    \ but you would be able to tell the CSS selector engine to ONLY apply that to\
    \ paragraph elements found in the article.\n\nYou could, for example, easily style\
    \ all the even numbered paragraphs a different color to the odd numbered ones,\
    \ no matter how many paragraph elements were in each section or how many other\
    \ elements such as headers might be present.\n\nThere are still more pseudo selectors\
    \ to be covered, and still more that can be done by chaining them all together;\
    \ however, the potential is far beyond anything we have space here to describe.\n\
    \nRemember too, that generic rules always come before specific rules.\n\nIf you\
    \ define:\n\n```\np:nth-child(odd)\n{\n    color: blue;\n}\n\np\n{\n    color:\
    \ green;\n}\n```\n\n*Code Listing 60: Specific CSS rule first*\n\nYou'll find\
    \ that all your paragraph elements will be green. This is because the later rule\
    \ targets more that the former rule, so any changes that the former rule applies\
    \ will be over-written by the latter one.\n\nReversing the order of the two rules\
    \ will fix this, so the generic one changes everything green first, then the specific\
    \ one targets odd-numbered elements and changes them from green to blue.\n\n>\
    \ *Note: At the time of writing, and with the version of Chrome (and other browsers)\
    \ being used, the previous description held true in that all <p> elements would\
    \ indeed have turned green. However, two months later, an update has been made\
    \ to the specifications, which now means that the nth-child rule has specify precedence\
    \ over the standard element selector in the example. This means that the previous\
    \ example now produces exactly the same result, no matter which order they are\
    \ in. This does not mean that you should suddenly ignore rule order; there are\
    \ still plenty of places where this is obeyed. In this, case however, it's a perfect\
    \ example of the fact that many of these features are still in a state of flux,\
    \ so as always, choose wisely when deciding which features to use and why.*"
  mdcn: "\n**3 x 1 = 3**\n**3 x 2 = 6**\n**3 x 3 = 9**\n**3 x 4 = 12**\n\n以此类推…\n\n\
    现在，想象一下我们 **3n** 中的 **n** 是第二列（值从 0 到 4）的乘数；你便会开始理解 n 如何引用该范围内的任何值。\n\n然后，如果你将结果视为一个静态数字，最终会得到以下静态序列：\n\
    \n**0, 3, 6, 9, 12**\n\n让这个想法沉淀一下。\n\n现在回想一下代码清单 55 中的 HTML 元素列表。该列表中有 10 个列表项子元素，如果我们忽略静态列表中的数字\
    \ 0 和 12，我们得到 3、6 和 9，这些都可以是用于选择的偏移量（0 和 12 不是有效的项，因为它们不存在）。\n\n嗯，这正是 `nth-child()`\
    \ 的作用。它使用传递给它的代数方程来精确确定列表中需要选择哪些元素。\n\n让我们将以下 CSS 规则应用于代码清单 55 中的列表：\n\n```\n\
    ul > li:nth-child(3n)\n{\n  color: red;\n}\n```\n\n*代码清单 57a：用于选择每个第三个元素的 nth-child\
    \ CSS 规则*\n\n将会发生的是，列表中每个第三个元素都将受此规则影响。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_66_0.png)\n\
    \n*图 49：我们的 nth-child(3n) 规则生效*\n\n如果我们开始添加一个 `+` 偏移量，我们就指定了乘法的起始位置：\n\n```\n\
    ul > li:nth-child(3n+1)\n{\n  color: red;\n}\n```\n\n*代码清单 57b：用于从元素 1 开始选择每个第三个元素的\
    \ nth-child CSS 规则*\n\n这将产生以下效果：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_67_0.png)\n\
    \n*图 50：nth-child(3n+1) 从 1 开始并选择每个第三个元素*\n\n如你所见，它从元素索引号 1 开始，然后每次应用乘以 3 的乘法，以选择每个第三项。\n\
    \n你也可以单独使用 **n**，当与正偏移量结合使用时，它允许你选择范围。例如：\n\n```\nul > li:nth-child(n+7)\n{\n\
    \  color: red;\n}\n```\n\n*代码清单 57c：用于选择从第 7 个开始所有内容的 nth-child CSS 规则*\n\n这将从偏移量\
    \ 7 开始，简单地选择从该点开始的所有剩余元素。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_0.png)\n\
    \n图 51：从第 7 个开始选择元素的 nth-child\n\n你也可以通过在 **n** 前面添加负号来反向选择。\n\n```\nul > li:nth-child(-n+7)\n\
    {\n    color: red;\n}\n```\n\n代码清单 57d：用于从第 7 个开始反向选择所有内容的 nth-child CSS 规则\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_68_1.png)\n\n图 52：从第 7 个开始反向选择的 nth-child\n\
    \n如果你只是想选择列表中某个特定编号的元素，可以这样做：\n\n```\nul > li:nth-child(5)\n{\n    color: red;\n\
    }\n```\n\n代码清单 57e：仅选择索引号 5 的 nth-child CSS 规则\n\n直接指定数字索引将仅选择该编号的元素。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_69_0.png)\n\
    \n*图 53：nth-child 仅选择列表中的第五个元素*\n\n我很容易就能用 nth-child 方程的不同组合填满本书的剩余部分，但我认为我们目前已经掌握了足够多的内容。\n\
    \n我猜你们大多数人此刻可能都在问自己一个问题：\n\n> “我该如何利用这一点来选择并为表格或网格中的所有行添加条纹？你能告诉我那是什么方程式吗？”\n\n\
    好消息是，W3C 标准委员会意识到这很可能是 `nth-child` 伪选择器最常见的用途之一，因此他们添加了一些快捷方式：**even** 用于选择每个偶数编号的元素，**odd**\
    \ 用于选择每个奇数编号的元素。\n\n如果你添加以下规则：\n\n```\nul > li:nth-child(odd)\n{\n    color: red;\n\
    }\n```\n\n*代码清单 57f：用于选择每个奇数编号元素的 nth-child CSS 规则*\n\n你应该能看到标记中的每个奇数列表项都被选中。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_70_0.png)\n\n图 54：nth-child 选择每个奇数元素\n\
    \n我想到了这个阶段，你可能想让你的大脑休息一下，所以我们暂时把代数知识放在一边。\n\n不过请注意，我们还有大量内容尚未涉及。例如，你可以链接 `nth-child`\
    \ 选择器（就像许多其他选择器一样），从而产生一些看起来像这样的疯狂选择器规则：\n\n**nth-child(3n+1):nth-child(even)**\n\
    \n这将选择从索引 1 开始的每个第三个元素，但仅限于索引为偶数的那些。对于 11 个元素，这将仅选择索引为 4 和 10 的元素（其他都是奇数）。\n\n\
    你可以轻松选择范围，然后拆分这些范围。你还可以将这些范围选择与 **first-child** 和 **last-child** 结合使用，从而只选择范围的开始和结束。这本身就是一个主题，或许值得用一整本书来讲解，迄今为止，**nth-child**\
    \ 伪选择器已经有一些非常巧妙的应用；但对我们来说，是时候继续前进了。\n\n属于 **first**、**last** 和 **nth** 元素选择器之下的第二组伪选择器是\
    \ **of-type** 选择器。\n\n**first-of-type**、**last-of-type** 和 **nth-of-type** 选择器的工作方式与本章前面描述的通用选择器完全相同，但它们针对的是特定的元素类型。\n\
    \n让我们以代码清单 55 中的无序列表为例，稍微修改一下，将其转换为定义列表。\n\n```\n<dl>\n    <dt>HTML 5</dt>\n \
    \   <dd>HTML 5 is the markup language used to create documents that are published\
    \ on the internet</dd>\n    <dt>CSS3</dt>\n    <dd>CSS3 is the markup language\
    \ used to add style and colors to documents created using HTML 5</dd>\n    <dt>HTTP\
    \ (Hyper Text Transfer protocol)</dt>\n    <dd>HTTP is the mechanism by which\
    \ HTML (copyleft) documents and their associated resources are transported on\
    \ the internet</dd>\n    <dt>WWW (World Wide Web)</dt>\n    <dd>The World Wide\
    \ Web is the collective name for the many hundreds of thousands of HTML 5 documents\
    \ published via the internet</dd>\n    <dt>The Internet</dt>\n    <dd>The internet\
    \ is a massive global computer network, which amongst other things holds the World\
    \ Wide Web</dd>\n</dl>\n```\n\n*代码清单 58：用于 first、last 和 nth 选择器的定义列表标记*\n\n定义列表与其他类型的列表略有不同。它内部实际上包含两种不同类型的子元素：**dt**\
    \ 元素或“定义标题”，以及 **dd** 元素或“定义”。\n\n如果我们渲染代码清单 58，我们可以看到两者的默认样式：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_71_0.png)\n\
    \n*图 55：具有默认样式的定义列表*\n\n如果我们尝试将之前的一个规则应用于此列表（稍作修改以适应不同的标签类型），例如，选择每个第三个子元素的 CSS\
    \ 规则（代码清单 57a），我们会看到它并不完全像我们预期的那样工作。\n\n```\ndl > :nth-child(3n)\n{\n  color:\
    \ red;\n}\n```\n\n*代码清单 59a：为我们的定义列表修改的 nth-child 规则*\n\n它尝试选择每个第三个子元素，即使我们可以按名称专门定位事物，我们可能不得不处理内容变化极大的列表。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_72_0.png)\n\n图 56：*nth-child 搞错了我们的选择*\n\
    \n然而，如果我们使用 `nth-of-type()`：\n\n```\ndt:nth-of-type(2n)\n{\n\tcolor: red;\n}\n\
    ```\n\n代码清单 59b：用 'nth-of-type' CSS 规则代替 'nth-child'\n\n我们很快就能看到，它只影响我们要求它影响的元素。\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_72_1.png)\n\n图 57：*nth-of-type 做对了我们的选择*\n\
    \n**nth-of-type**（以及 **first-of-type** 和 **last-of-type**）仅将指定的目标元素视为选择的候选者。\n\
    \n在前面的例子中，我们看到了一些可能用于新闻页面的标记；如果你在那个页面上使用 **nth-of-type**，你将获得与使用 **nth-child**\
    \ 一样的灵活性，但你能够告诉 CSS 选择器引擎只将该规则应用于文章中找到的段落元素。\n\n例如，你可以轻松地为所有偶数编号的段落设置与奇数编号段落不同的颜色，无论每个部分中有多少段落元素，或者可能存在多少其他元素（如标题）。\n\
    \n还有更多的伪选择器需要介绍，将它们全部链接在一起还能做更多事情；然而，其潜力远远超出了我们在这里所能描述的范围。\n\n也要记住，通用规则总是在特定规则之前。\n\
    \n如果你定义：\n\n```\np:nth-child(odd)\n{\n    color: blue;\n}\n\np\n{\n    color:\
    \ green;\n}\n```\n\n*代码清单 60：特定 CSS 规则在前*\n\n你会发现你所有的段落元素都将是绿色的。这是因为后面的规则比前面的规则更具体，所以前面规则应用的任何更改都将被后者覆盖。\n\
    \n将这两个规则的顺序颠倒即可解决这个问题，这样通用的规则首先将所有内容变为绿色，然后特定的规则针对奇数编号的元素，将它们从绿色更改为蓝色。\n\n> *注意：在撰写本文时，并且使用的是（当时版本的）Chrome（和其他浏览器），前面的描述成立，即所有\
    \ <p> 元素确实会变成绿色。但是，两个月后，规范进行了更新，现在意味着在示例中 nth-child 规则具有比标准元素选择器更高的优先级。这意味着无论它们顺序如何，前面的示例现在都会产生完全相同的结果。这并不意味着你应该突然忽略规则顺序；仍然有很多地方需要遵守这一点。然而，在这个例子中，它完美地说明了许多这些特性仍然处于不断变化状态的事实，因此，一如既往地，在决定使用哪些特性以及为什么使用时，请明智选择。*\n"
