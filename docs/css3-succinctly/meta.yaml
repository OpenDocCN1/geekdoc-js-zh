  - "[PAGE 31]\n\nTo illustrate the difference, we're first going to style the list\
    \ using the adjacent sibling selector you saw earlier, using the following rule.\n\
    \n```\np + ul a\n{\n  color: red;\n}\n```\n\n*Code Listing 21: Adjacency selector\
    \ for Code Listing 20*\n\nWhen we render Code Listing 20, using the rule in Code\
    \ Listing 21, we get the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_31_0.png)\n\
    \n*Figure 13: Output produced by Code Listing 20 with the adjacency selector applied*\n\
    \nIf you've been following along with the code, this shouldn't come as a surprise.\
    \ The first group is styled, the second is not.\n\nIf we now switch our code to\
    \ use the general sibling selector, however:\n\n```\np ~ ul a\n{\n  color: red;\n\
    }\n```\n\n*Code Listing 22: Sibling selector for Code Listing 20*"
  - "[PAGE 32]\n\nWe should see a difference in the selection:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_32_0.png)\n\
    \nFigure 14: Output produced by Code Listing 20 with the sibling selector applied\n\
    \nWhile the adjacent sibling selector stops at the first match, the general sibling\
    \ selector does not; the general sibling selector will continue down the chain,\
    \ matching anything in the rule as long as the element before it matches.\n\n\
    # The difference between adjacency and descendancy\n\nAt this point you might\
    \ be wondering why we have two ways of achieving apparently the same thing. It’s\
    \ important to remember that while we have styled similar scenarios so far in\
    \ this chapter, we’ve done this in rather different ways.\n\nWhen we talk about\
    \ elements that are adjacent to each other, we mean these elements are rather\
    \ like neighbors in a street of houses. If you were to draw a line down the alignment\
    \ of each house, you’d see that everything was at the same level. In the following\
    \ code, each of the **div** elements with a **class** attribute of **house** are\
    \ adjacent to one another:\n\n```\n<div class=\"street\">\n    <div class=\"house\"\
    ></div>\n    <div class=\"house\"></div>\n    <div class=\"house\"></div>\n  \
    \  <div class=\"house\"></div>\n    <div class=\"house\"></div>\n</div>\n```\n\
    \nCode Listing 23: Adjacent elements"
  - "[PAGE 33]\n\nWhen we talk about elements being descendants of each other, we're\
    \ talking about a parent-to-child-like relationship. If we apply this to our street\
    \ example in Code Listing 23, we might have \"tenants\" who occupy each house.\n\
    \n```\n<div class=\"street\">\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n\
    \    <div class=\"house\"><p class=\"tenant\"></p></div>\n    <div class=\"house\"\
    ><p class=\"tenant\"></p></div>\n    <div class=\"house\"><p class=\"tenant\"\
    ></p></div>\n    <div class=\"house\"><p class=\"tenant\"></p></div>\n</div>\n\
    ```\n\n*Code Listing 24: Descendant elements*\n\nAs you can see in Code Listing\
    \ 24, we now have a tenant inside each house. Tenants are not adjacent to each\
    \ other because you have to leave the house, move down, and then enter into the\
    \ next house to reach the next tenant.\n\nHowever, since you can reach a tenant\
    \ from a house, then a tenant becomes a descendant of a house.\n\nChild and grandchild\
    \ terminology are defined as a specialist case of descendancy. Just like in a\
    \ family tree, a tenant in our example might have children, and those children\
    \ might have grown up and had children of their own.\n\nA child of a child would\
    \ still be a descendant of a tenant, but it would not be a child of a tenant;\
    \ it would be a grandchild, something like the following:\n\n```\n<div class=\"\
    street\">\n    <div class=\"house\">\n        <div class=\"tenant\">\n       \
    \     <div class=\"tenantsChild\">\n                <div class=\"childsChildButTenantsGrandChild\"\
    ></div>\n            </div>\n        </div>\n    </div>\n</div>\n```\n\n*Code\
    \ Listing 25: Code showing child relation to dependency*\n\nIf you were to create\
    \ more **div** elements with a class of **tenantsChild** next to each other within\
    \ the confines of the tenant, those **tenantsChild** elements, like the houses,\
    \ would be adjacent to each other.\n\nIt takes a little bit of practice until\
    \ you get into the habit of thinking this way, but if you think about HTML in\
    \ its native form as a specialist, XML-based language, then you see that the nesting\
    \ starts to make sense. Once the nesting makes sense, the flow and layout of the\
    \ selectors start to fall into place too.\n\nDon't worry if you struggle to make\
    \ sense of it straightaway. It took me a long time to unravel it all too, and\
    \ even now I still get it wrong sometimes."
- md: " So far we've covered the main base selectors. If you want to read up on the\
    \ rest of them, you can find the official documentation on the W3C site.\n\nI\
    \ do think a warning is in order here, though. While the official W3C documentation\
    \ is the official source of all things HTML, it's also a very difficult site to\
    \ read.\n\nThere are easier sources of information, such as Mozilla and HTML Dog.\
    \ I would strongly advise you digest those first, then visit the W3C site once\
    \ you have a better understanding of the topic.\n\n## Attribute Selectors\n\n\
    To finish this chapter off, we're going to take a look at something that's been\
    \ massively expanded on in CSS3: attribute selectors.\n\nThere has been some minimal\
    \ effort to introduce a very small subset of this type of selector in previous\
    \ versions, but it went largely unnoticed, so most developers never stopped to\
    \ look at what it had to offer.\n\nIn CSS3 however, attribute selectors are all-powerful,\
    \ and allow you to do some rather smart styling of elements.\n\nFirst off, we\
    \ need to define what an attribute selector actually is.\n\nUnlike the selectors\
    \ you've seen so far, an attribute selector is not a single character construct\
    \ that sits between two targets; it's a multi-character appendage to a parent\
    \ rule, which contains its own internal processing rules.\n\nIn a small way, attribute\
    \ selectors are a little bit like having a custom set of search expressions, specifically\
    \ for hunting out elements based on the value (or part of) an attribute attached\
    \ to them.\n\nTake a look at the following HTML markup.\n\n```\n<ul>\n    <li><a\
    \ href=\"#\" rel=\"external\">External Link 1</a></li>\n    <li><a href=\"#\"\
    \ rel=\"internal\">Internal Link 1</a></li>\n    <li><a href=\"#\" rel=\"internal\"\
    >Internal Link 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link\
    \ 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link 3</a></li>\n\
    </ul>\n```\n\n*Code Listing 26: HTML markup with custom attributes*\n\nIn Code\
    \ Listing 26, you can see I've created a fairly standard, unordered list containing\
    \ items with anchor elements in them. It's nothing unusual, and something you'll\
    \ often see in navigation links in HTML documents.\n\nWhat I've done, however,\
    \ is to use the `rel` attribute to mark up the relation of the link, specifying\
    \ if it's an external or an internal link.\n\nIf we wanted to style the two different\
    \ types in different ways, we could, in theory, just add a class such as `.internal`\
    \ or `.external`. However, there may be times that HTML markup is generated inside\
    \ a process over which you have no control, so you may not be able to add classes\
    \ to the output in this manner.\n\nThis is where the attribute selector comes\
    \ in. You can use it to target a specific named attribute within the element,\
    \ and as you'll see in just a moment, you can use it to not only target a full\
    \ string, but part of a string too.\n\nFirst, let's have a look at how we might\
    \ apply it to our previous links example. Add the following style rules to your\
    \ style sheet (assuming you've already added the preceding HTML to your document):\n\
    \n```\na[rel=\"external\"]\n{\n\tcolor: red;\n}\n\na[rel=\"internal\"]\n{\n\t\
    color: green;\n}\n```\n\n*Code Listing 27: Attribute Selector rules for Code Listing\
    \ 26*\n\nIf you render this in your browser, you should see something like the\
    \ following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_35_0.png)\n\n*Figure\
    \ 15: Code Listing 26 with the CSS rules in Code Listing 27 applied to them*\n\
    \nJust by using two different rules, we've easily targeted the two different types\
    \ of links, simply because of the difference in the `rel` attribute.\n\nA real-world\
    \ example might look something like the following; change the code in Listing\
    \ 26 to read as follows:\n\n```\n<ul>\n```\n\n```\n<li><a href=\"#\">Link 1</a></li>\n\
    <li><a>Link 2</a></li>\n<li><a>Link 3</a></li>\n<li><a href=\"#\">Link 4</a></li>\n\
    <li><a href=\"#\">Link 5</a></li>\n</ul>\n```\n\n## Code Listing 28: HTML markup\
    \ modified from Code Listing 26\n\nBy default, most browsers won't make a link\
    \ clickable that has no **href** attribute, and for the default styling at least,\
    \ they won't be styled using the usual blue underlining.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_0.png)\n\
    \n## Figure 16: Output from Code Listing 28 with no styling.\n\nHowever, in many\
    \ cases (especially if you're using a larger framework), you might find that anchor\
    \ tags in general have been given a uniform style to maintain a consistent look\
    \ and feel.\n\nFor example:\n\n```\na\n{\n  text-decoration: none;\n  color: green;\n\
    }\n```\n\n## Code Listing 29: Possible rule to give a uniform look and feel to\
    \ an anchor\n\nThis code might be used to apply that uniform style, and would\
    \ make our list look as follows:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_1.png)\n\
    \n## Figure 17: Code Listing 28 with a uniform style applied to the anchor element\n\
    \nYou can immediately see that you've lost any contextual information that might\
    \ suggest to you a link has no destination, and as a site user, you have no idea\
    \ which links are good, and which are bad.\n\nYou could go through your code and\
    \ add a `class=\"nodestination\"` to each link with a missing `href`, but what\
    \ if someone then added links to the database, and all of a sudden the link then\
    \ has a valid destination? In this case, you're faced with the task of finding\
    \ all those links that didn't have an `href`, and now do, so you can remove the\
    \ class name and restore normality.\n\nThe other way to address this problem is\
    \ to use just the attribute selector with no extra content on its own, as follows:\n\
    \n```\na[href]\n{\n    text-decoration: none;\n    color: green;\n}\n```\n\n*Code\
    \ Listing 30: Attribute rule to target only anchors that have an href attribute*\n\
    \nWhen we now refresh our page, we should see that we now get different styling\
    \ than we did before:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_37_0.png)\n\n\
    *Figure 18: Code Listing 28 with a uniform style, only applied to anchors with\
    \ valid destinations*\n\nNow in order to have the links styled correctly, all\
    \ you have to do is let your web application platform generate links with `href`\
    \ attributes, and leave the `href` attributes out of anything that does not yet\
    \ have a link.\n\nThere is one question remaining, however.\n\nWhat if we also\
    \ want to style the remaining elements that don't have the `href` attribute, for\
    \ example, to make them a lighter color so they perhaps look disabled?\n\nCSS3\
    \ also has this covered with a pseudo selector. We'll learn more about the new\
    \ pseudo selectors in the next chapter; for now, we can solve the styling of anchor\
    \ tags with missing `href` attributes quite simply by using the following attribute/pseudo-styling\
    \ rule:\n\n```\na:not([href])\n{\n```\n\n```\ntext-decoration: none;\ncolor: silver;\n\
    }\n```\n\n## Code Listing 31: Attribute rule to target only anchors that don't\
    \ have an href attribute\n\nIf we re-render our document after changing our style\
    \ rule to match Code Listing 31, we should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_38_0.png)\n\
    \n## Figure 19: Code Listing 28 with an inverted attribute style\n\nThe following\
    \ rules take advantage of the cascading nature of CSS, and combine things logically:\n\
    \n```\na\n{\n    text-decoration: none;\n}\na[href]\n{\n    color: green;\n}\n\
    a:not([href])\n{\n    color: silver;\n}\n```\n\n## Code Listing 32: Combined rules\
    \ to style links with missing href attributes automatically\n\nIn theory, we could\
    \ actually reduce that further, and just add the green color to the base anchor\
    \ rule. This would apply the green as a default, but change it to silver if no\
    \ `href` existed. The idea here is just to show what's going on in the simplest\
    \ possible terms, and expanding things out often makes concepts clearer to understand.\n\
    \nIf we render this now, we should see something like the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_39_0.png)\n\
    \n## Figure 20: Code Listing 28 with the combined styles applied\n\nThe main advantage\
    \ to take away from this example is that you now no longer have to worry about\
    \ making sure that a specific class is applied to a given link, making maintenance\
    \ of the document much easier and less error-prone. If you're running under a\
    \ CMS such as Umbraco or WordPress, then all you have to care about is whether\
    \ links have valid destinations or not.\n\n> Note: I've previously used an attribute\
    \ selector in this fashion inside normal paragraph text to automatically highlight\
    \ links that are in-line with the general text once they become active, and to\
    \ make them look exactly like the paragraph text when they aren't active.\n\n\
    I mentioned earlier that attribute selectors can also match on partial contents\
    \ in a given attribute. There are additions to the main selector that allow you\
    \ to check if an attribute's value begins with, ends with, or contains a given\
    \ substring.\n\nThis can be very useful in the case of external and internal links.\n\
    \nThink back to the code we saw in Code Listing 26; we used the `rel` attribute\
    \ to define an internal or external relationship on an anchor element.\n\nIn terms\
    \ of the W3C specifications, this was probably not the best way to do this, and\
    \ quite likely, the HTML would fail to validate if it were tested with an HTML\
    \ 5 validation tool.\n\nThis doesn't mean we have to go back to using a class\
    \ attribute, however.\n\nImagine for a moment that all your external links had\
    \ a fully qualified URL, and all your internal links just had a relative page\
    \ leaf. In this case, Code Listing 26 might now be re-written as follows:\n\n\
    ```\n<ul>\n  <li><a href=\"http://external.com/link1\">External Link 1</a></li>\n\
    \  <li><a href=\"internal/link1\">Internal Link 1</a></li>\n  <li><a href=\"internal/link2\"\
    >Internal Link 2</a></li>\n  <li><a href=\"http://external.com/link2\">External\
    \ Link 2</a></li>\n  <li><a href=\"http://external.com/link3\">External Link 3</a></li>\n\
    </ul>\n```\n\n## Code Listing 33: Code Listing 26 rewritten to not use rel attributes"
  mdcn: "\n到目前为止，我们已经介绍了主要的基本选择器。如果你想了解其余的选择器，可以在W3C网站上找到官方文档。\n\n不过，我确实认为有必要在这里提醒一下。虽然W3C的官方文档是所有HTML内容的权威来源，但它也是一个非常难读的网站。\n\
    \n有更容易获取的信息来源，比如Mozilla和HTML Dog。我强烈建议你先消化这些内容，然后再去W3C网站，这样你对主题会有更好的理解。\n\n##\
    \ 属性选择器\n\n为了结束本章，我们将探讨CSS3中得到极大扩展的一个内容：属性选择器。\n\n在之前的版本中，只有少量关于这种选择器子集的介绍，但它在很大程度上被忽视了，因此大多数开发者从未停下来研究过它能提供什么。\n\
    \n然而，在CSS3中，属性选择器功能强大，允许你对元素进行一些相当智能的样式设置。\n\n首先，我们需要定义什么是属性选择器。\n\n与你目前见过的选择器不同，属性选择器不是位于两个目标之间的单字符构造；它是父规则的多字符附加部分，包含其自身的内部处理规则。\n\
    \n从某种程度上说，属性选择器有点像拥有一套自定义的搜索表达式，专门用于根据附加在元素上的属性值（或部分值）来查找元素。\n\n看看下面的HTML标记。\n\
    \n```\n<ul>\n    <li><a href=\"#\" rel=\"external\">External Link 1</a></li>\n\
    \    <li><a href=\"#\" rel=\"internal\">Internal Link 1</a></li>\n    <li><a href=\"\
    #\" rel=\"internal\">Internal Link 2</a></li>\n    <li><a href=\"#\" rel=\"external\"\
    >External Link 2</a></li>\n    <li><a href=\"#\" rel=\"external\">External Link\
    \ 3</a></li>\n</ul>\n```\n\n*代码清单26：包含自定义属性的HTML标记*\n\n在代码清单26中，你可以看到我创建了一个相当标准的无序列表，其中包含锚元素。这并不罕见，你经常会在HTML文档的导航链接中看到类似内容。\n\
    \n然而，我做的是使用`rel`属性来标记链接的关系，指定它是外部链接还是内部链接。\n\n如果我们想以不同的方式为两种类型设置样式，理论上，我们可以只添加一个类，比如`.internal`或`.external`。然而，有时候HTML标记是在你无法控制的过程中生成的，因此你可能无法以这种方式将类添加到输出中。\n\
    \n这就是属性选择器的用武之地。你可以用它来定位元素内的特定命名属性，正如你稍后将看到的，你不仅可以使用它来定位完整字符串，还可以定位部分字符串。\n\n\
    首先，让我们看看如何将其应用于我们之前的链接示例。将以下样式规则添加到你的样式表中（假设你已经将之前的HTML添加到文档中）：\n\n```\na[rel=\"\
    external\"]\n{\n\tcolor: red;\n}\n\na[rel=\"internal\"]\n{\n\tcolor: green;\n\
    }\n```\n\n*代码清单27：代码清单26的属性选择器规则*\n\n如果你在浏览器中渲染这个，你应该会看到类似这样的内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_35_0.png)\n\
    \n*图15：应用了代码清单27中CSS规则的代码清单26*\n\n仅仅通过使用两条不同的规则，我们就轻松地定位了两种不同类型的链接，仅仅因为`rel`属性的差异。\n\
    \n一个现实世界的例子可能看起来像这样；将代码清单26中的代码修改为如下内容：\n\n```\n<ul>\n```\n\n```\n<li><a href=\"\
    #\">Link 1</a></li>\n<li><a>Link 2</a></li>\n<li><a>Link 3</a></li>\n<li><a href=\"\
    #\">Link 4</a></li>\n<li><a href=\"#\">Link 5</a></li>\n</ul>\n```\n\n## 代码清单28：从代码清单26修改而来的HTML标记\n\
    \n默认情况下，大多数浏览器不会使没有**href**属性的链接可点击，而且至少对于默认样式，它们不会使用通常的蓝色下划线进行样式设置。\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_0.png)\n\
    \n## 图16：没有样式的代码清单28的输出。\n\n然而，在许多情况下（特别是如果你使用较大的框架），你可能会发现锚点标签通常被赋予了统一的样式，以保持一致的外观和感觉。\n\
    \n例如：\n\n```\na\n{\n  text-decoration: none;\n  color: green;\n}\n```\n\n## 代码清单29：可能用于赋予锚点统一外观和感觉的规则\n\
    \n这段代码可能用于应用那种统一的样式，并将使我们的列表看起来如下：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_36_1.png)\n\
    \n## 图17：应用了统一样式的代码清单28的锚点元素\n\n你立刻就能看出，你已经失去了任何可能提示链接没有目标的上下文信息，作为网站用户，你不知道哪些链接是好的，哪些是坏的。\n\
    \n你可以遍历代码，为每个缺少`href`的链接添加`class=\"nodestination\"`，但如果有人随后向数据库添加了链接，突然间链接就有了有效的目标怎么办？在这种情况下，你面临着找到所有之前没有`href`但现在有了的链接的任务，这样你就可以移除类名并恢复正常。\n\
    \n解决这个问题的另一种方法是只使用没有额外内容的属性选择器本身，如下所示：\n\n```\na[href]\n{\n    text-decoration:\
    \ none;\n    color: green;\n}\n```\n\n*代码清单30：仅定位具有href属性的锚点的属性规则*\n\n现在当我们刷新页面时，我们应该看到我们现在得到的样式与之前不同：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_37_0.png)\n\n*图18：应用了统一样式，但仅应用于具有有效目标的锚点的代码清单28*\n\
    \n现在，为了让链接样式正确，你所要做的就是让你的Web应用平台生成带有`href`属性的链接，而对于还没有链接的内容，则省略`href`属性。\n\n然而，还有一个问题。\n\
    \n如果我们还想为其余没有`href`属性的元素设置样式，例如，让它们颜色更浅一些，这样它们看起来可能像是禁用的呢？\n\nCSS3也用一个伪选择器解决了这个问题。我们将在下一章了解更多关于新的伪选择器的内容；现在，我们可以通过使用以下属性/伪样式规则来简单地解决缺少`href`属性的锚点标签的样式问题：\n\
    \n```\na:not([href])\n{\n```\n\n```\ntext-decoration: none;\ncolor: silver;\n\
    }\n```\n\n## 代码清单31：仅定位没有href属性的锚点的属性规则\n\n如果我们更改样式规则以匹配代码清单31，然后重新渲染文档，我们应该得到以下结果：\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_38_0.png)\n\n## 图19：应用了反转属性样式的代码清单28\n\
    \n以下规则利用了CSS的层叠特性，并将内容逻辑地组合在一起：\n\n```\na\n{\n    text-decoration: none;\n}\n\
    a[href]\n{\n    color: green;\n}\na:not([href])\n{\n    color: silver;\n}\n```\n\
    \n## 代码清单32：自动为缺少href属性的链接设置样式的组合规则\n\n理论上，我们可以进一步简化，只是将绿色颜色添加到基本锚点规则中。这将把绿色作为默认应用，但如果没有`href`存在，则将其更改为银色。这里的理念只是为了用最简单的术语展示正在发生的事情，而展开内容通常使概念更易于理解。\n\
    \n如果我们现在渲染它，我们应该看到类似这样的内容：\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_39_0.png)\n\
    \n## 图20：应用了组合样式的代码清单28\n\n从这个例子中得到的主要优势是，你不再需要担心确保为给定链接应用特定的类，这使得文档维护更容易且不易出错。如果你在Umbraco或WordPress等CMS下运行，那么你只需要关心链接是否具有有效的目标。\n\
    \n> 注意：我之前在普通段落文本中使用过这种属性选择器，以便在链接激活时自动突出显示与普通文本内联的链接，并在链接未激活时使其看起来与段落文本完全一样。\n\
    \n我之前提到过，属性选择器也可以匹配给定属性中的部分内容。主要选择器中有一些添加内容，允许你检查属性的值是否以、是否包含或是否以给定子字符串结尾。\n\n\
    这在处理外部和内部链接时可能非常有用。\n\n回想一下我们在代码清单26中看到的代码；我们使用了`rel`属性来定义锚元素上的内部或外部关系。\n\n就W3C规范而言，这可能不是最好的做法，而且很可能，如果用HTML\
    \ 5验证工具测试，HTML可能无法通过验证。\n\n然而，这并不意味着我们必须回到使用class属性。\n\n想象一下，你所有的外部链接都有一个完整的URL，而你所有的内部链接只有一个相对的页面叶子。在这种情况下，代码清单26现在可以改写如下：\n\
    \n```\n<ul>\n  <li><a href=\"http://external.com/link1\">External Link 1</a></li>\n\
    \  <li><a href=\"internal/link1\">Internal Link 1</a></li>\n  <li><a href=\"internal/link2\"\
    >Internal Link 2</a></li>\n  <li><a href=\"http://external.com/link2\">External\
    \ Link 2</a></li>\n  <li><a href=\"http://external.com/link3\">External Link 3</a></li>\n\
    </ul>\n```\n\n## 代码清单33：不使用rel属性重写的代码清单26\n"
