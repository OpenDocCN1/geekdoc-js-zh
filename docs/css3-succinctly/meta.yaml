  md: "Drop shadows are created by using the box-shadow rule, which takes four integer\
    \ measurements and a color value.\n\nOf the four measurements that are provided,\
    \ only the first two are required; the remaining two will default to browser defaults\
    \ if left out.\n\nThe first two measurements are the offset x and offset y values,\
    \ which as the names suggest, set the distance from the element that the shadow\
    \ protrudes. If positive values are supplied, then the shadow protrudes from the\
    \ bottom right; if negative values are used, the shadow protrudes from the top\
    \ left. To get the shadow on other corners, you mix positive and negative offsets\
    \ as required.\n\nCreate an HTML 5 document and add the following markup (or reuse\
    \ the code from the previous section on border radius, but repeat it four times):\n\
    \n```\n<div class=\"niceDiv\">\n    <p>This is a nice div with drop shadows</p>\n\
    </div>\n<div class=\"niceDiv\">\n    <p>This is a nice div with drop shadows</p>\n\
    </div>\n<div class=\"niceDiv\">\n    <p>This is a nice div with drop shadows</p>\n\
    </div>\n<div class=\"niceDiv\">\n    <p>This is a nice div with drop shadows</p>\n\
    </div>\n```\n\nCode Listing 62a: HTML markup to demo drop shadow\n\nCreate the\
    \ following style rule as a basis for the rest of this section:\n\n```\n.niceDiv\n\
    {\n    width: 100px;\n    height: 100px;\n    background-color: beige;\n    padding:\
    \ 4px;\n    border: 1px solid black;\n    display: inline-block;\n    margin:\
    \ 15px;\n}\n```\n\nCode Listing 62b: CSS rule to style the HTML in 62a\n\nThis\
    \ will give us the default beige div you saw in the last section, with no additional\
    \ styling.\n\n> Note: You've seen many instances so far where rules cascade down\
    \ from less-specific rules above them. This is one of CSS3's (and previous versions)\
    \ greatest features, which I've not gone into too much detail about. In the previous\
    \ section we added the border radius directly too the 'niceDiv' rule; in this\
    \ section I'm going to start using cascading"
  merge: -1
  pgno: 80
- img_proc: true
  md: "more to keep the base styles (in this case our beige rectangle) separate from\
    \ the rules we're currently exploring. You can use the same selector as many times\
    \ as you like, and the effect will always be cumulative. For example, if you specify\
    \ '.niceDiv' and '.niceDiv .shadow', you then always have the option to use the\
    \ base styling by specifying a class of 'niceDiv' to the element, and optionally\
    \ applying the shadow by adding that to the class list as a secondary ID. There's\
    \ nothing wrong with breaking things up into groups by repeating class and ID\
    \ selectors if you wish, but if you do this, make sure you remember the rules\
    \ of specificity and order things correctly.\n\nAs with the previous examples,\
    \ we'll render this first, so you can see what it looks like before we start.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_81_0.png)\n\nFigure 63: Drop shadow\
    \ divs before styling\n\nOnce we have that working, we'll create some sample rules\
    \ to apply different drop shadows to our elements.\n\n```\n.niceDiv.topLeftShadow\n\
    {\n  box-shadow: -10px -10px;\n}\n\n.niceDiv.bottomLeftShadow\n{\n  box-shadow:\
    \ -10px 10px;\n}\n\n.niceDiv.bottomRightShadow\n{\n  box-shadow: 10px 10px;\n\
    }\n\n.niceDiv.topRightShadow\n{\n  box-shadow: 10px -10px;\n}\n```\n\nCode Listing\
    \ 62b: CSS rule to apply different shadows to the HTML in 62a"
  merge: -1
