- img_proc: true
  md: "You can immediately see that you've lost any contextual information that might\
    \ suggest to you a link has no destination, and as a site user, you have no idea\
    \ which links are good, and which are bad.\n\nYou could go through your code and\
    \ add a `class=\"nodestination\"` to each link with a missing `href`, but what\
    \ if someone then added links to the database, and all of a sudden the link then\
    \ has a valid destination? In this case, you're faced with the task of finding\
    \ all those links that didn't have an `href`, and now do, so you can remove the\
    \ class name and restore normality.\n\nThe other way to address this problem is\
    \ to use just the attribute selector with no extra content on its own, as follows:\n\
    \n```\na[href]\n{\n    text-decoration: none;\n    color: green;\n}\n```\n\n*Code\
    \ Listing 30: Attribute rule to target only anchors that have an href attribute*\n\
    \nWhen we now refresh our page, we should see that we now get different styling\
    \ than we did before:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_37_0.png)\n\n\
    *Figure 18: Code Listing 28 with a uniform style, only applied to anchors with\
    \ valid destinations*\n\nNow in order to have the links styled correctly, all\
    \ you have to do is let your web application platform generate links with `href`\
    \ attributes, and leave the `href` attributes out of anything that does not yet\
    \ have a link.\n\nThere is one question remaining, however.\n\nWhat if we also\
    \ want to style the remaining elements that don't have the `href` attribute, for\
    \ example, to make them a lighter color so they perhaps look disabled?\n\nCSS3\
    \ also has this covered with a pseudo selector. We'll learn more about the new\
    \ pseudo selectors in the next chapter; for now, we can solve the styling of anchor\
    \ tags with missing `href` attributes quite simply by using the following attribute/pseudo-styling\
    \ rule:\n\n```\na:not([href])\n{\n```"
  merge: -1
  pgno: 37
- img_proc: true
  md: "```\ntext-decoration: none;\ncolor: silver;\n}\n```\n\nCode Listing 31: Attribute\
    \ rule to target only anchors that don't have an href attribute\n\nIf we re-render\
    \ our document after changing our style rule to match Code Listing 31, we should\
    \ get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_38_0.png)\n\n\
    Figure 19: Code Listing 28 with an inverted attribute style\n\nThe following rules\
    \ take advantage of the cascading nature of CSS, and combine things logically:\n\
    \n```\na\n{\n    text-decoration: none;\n}\na[href]\n{\n    color: green;\n}\n\
    a:not([href])\n{\n    color: silver;\n}\n```\n\nCode Listing 32: Combined rules\
    \ to style links with missing href attributes automatically\n\nIn theory, we could\
    \ actually reduce that further, and just add the green color to the base anchor\
    \ rule. This would apply the green as a default, but change it to silver if no\
    \ `href` existed. The idea here is just to show what's going on in the simplest\
    \ possible terms, and expanding things out often makes concepts clearer to understand.\n\
    \nIf we render this now, we should see something like the following:"
  merge: -1
  pgno: 38
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_39_0.png)\n\n# Figure 20: Code Listing\
    \ 28 with the combined styles applied\n\nThe main advantage to take away from\
    \ this example is that you now no longer have to worry about making sure that\
    \ a specific class is applied to a given link, making maintenance of the document\
    \ much easier and less error-prone. If you're running under a CMS such as Umbraco\
    \ or WordPress, then all you have to care about is whether links have valid destinations\
    \ or not.\n\n> Note: I've previously used an attribute selector in this fashion\
    \ inside normal paragraph text to automatically highlight links that are in-line\
    \ with the general text once they become active, and to make them look exactly\
    \ like the paragraph text when they aren't active.\n\nI mentioned earlier that\
    \ attribute selectors can also match on partial contents in a given attribute.\
    \ There are additions to the main selector that allow you to check if an attribute's\
    \ value begins with, ends with, or contains a given substring.\n\nThis can be\
    \ very useful in the case of external and internal links.\n\nThink back to the\
    \ code we saw in Code Listing 26; we used the `rel` attribute to define an internal\
    \ or external relationship on an anchor element.\n\nIn terms of the W3C specifications,\
    \ this was probably not the best way to do this, and quite likely, the HTML would\
    \ fail to validate if it were tested with an HTML 5 validation tool.\n\nThis doesn't\
    \ mean we have to go back to using a class attribute, however.\n\nImagine for\
    \ a moment that all your external links had a fully qualified URL, and all your\
    \ internal links just had a relative page leaf. In this case, Code Listing 26\
    \ might now be re-written as follows:\n\n```\n<ul>\n  <li><a href=\"http://external.com/link1\"\
    >External Link 1</a></li>\n  <li><a href=\"internal/link1\">Internal Link 1</a></li>\n\
    \  <li><a href=\"internal/link2\">Internal Link 2</a></li>\n  <li><a href=\"http://external.com/link2\"\
    >External Link 2</a></li>\n  <li><a href=\"http://external.com/link3\">External\
    \ Link 3</a></li>\n</ul>\n```\n\n# Code Listing 33: Code Listing 26 rewritten\
    \ to not use rel attributes"
  merge: -1
  pgno: 39
- img_proc: true
  md: "If you examine the difference in the **href** attributes, you'll see that all\
    \ the external links start with \"http://\" and the internal ones do not.\n\n\
    If we use the \"attribute value starts with\" selector, we can now easily style\
    \ the external ones with a different color.\n\nWe can set a uniform style for\
    \ anchor tags in general, which would reflect the style for internal links by\
    \ default, then be altered if it reflected an external link.\n\nTo use the starts\
    \ with attribute selector, we specify a ^=\"=\" between attribute name and value,\
    \ as the following rule shows:\n\n```\na[href^=\"http:\"]\n{\n    color: red;\n\
    }\n```\n\n*Code Listing 34: CSS style rule to change the color of attributes that\
    \ start with \"http\"*\n\nIf we apply that to the HTML markup in Code Listing\
    \ 33, and then render it in the browser, we should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_40_0.png)\n\
    \n*Figure 21: HTML from Code Listing 33 with the rule in Code Listing 34 applied\
    \ to it*\n\nNow if we add in a uniform rule as we did previously, so that links\
    \ are green by default, we end up with output that looks like the following:\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_40_1.png)\n\n*Figure 22: HTML Code\
    \ Listing 33 with the final styling in place*\n\nI'm sure you can quickly realize\
    \ how easily this could be combined with the rules to detect the presence of the\
    \ attribute and make further choices on links with no **href** attributes, too."
  merge: -1
  pgno: 40
- img_proc: true
  md: "The remaining parts of the attribute selector are the \"ends with\" and \"\
    contains\" selectors.\n\n\"Ends with\" comes in handy if you want to style links\
    \ based on file type. For example, you could do the following:\n\n```\n<ul>\n\
    \    <li><a href=\"photo1.png\">Photo 1</a></li>\n    <li><a href=\"photo2.png\"\
    >Photo 2</a></li>\n    <li><a href=\"sound1.mp3\">Sound 1</a></li>\n    <li><a\
    \ href=\"sound2.mp3\">Sound 2</a></li>\n    <li><a href=\"document.pdf\">Document</a></li>\n\
    </ul>\n```\n\n*Code Listing 35: Code listing 33 rewritten to list file links*\n\
    \nThen, create the following rules using the **$=** attribute selector as follows:\n\
    \n```\na[href$=\".png\"]\n{\n  color: red;\n}\na[href$=\".mp3\"]\n{\n  color:\
    \ green;\n}\na[href$=\".pdf\"]\n{\n  color: blue;\n}\n```\n\n*Code Listing 36:\
    \ Ends With attribute rules to style based on file type*\n\nWhen rendered, it\
    \ should give the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_41_0.png)\n\
    \n*Figure 23: Code Listing 35 showing the output from the \"ends with\" attribute\
    \ selector*\n\nThe final attribute-based selector is the contains selector, and\
    \ does exactly as it says on the tin.\n\nIf an attribute value contains the given\
    \ substring, then **\\*=** will match it.\n\nFor example, take a look at the following\
    \ set of anchor tags:"
  merge: -1
  pgno: 41
- img_proc: true
  md: "```\n<ul>\n   <li><a href=\"/admin/users/list\">List Users</a></li>\n   <li><a\
    \ href=\"/admin/personal/settings\">Your Account Settings</a></li>\n   <li><a\
    \ href=\"/admin/users/edit\">Edit Users</a></li>\n   <li><a href=\"/admin/users/report\"\
    >Users Report</a></li>\n   <li><a href=\"/admin/personal/profile\">Your Profile</a></li>\n\
    </ul>\n```\n\n*Code Listing 37: Code Listing 35 rewritten to demonstrate \"contains\"\
    \ attribute selector*\n\nWith the following rules:\n\n```\na[href*=\"users\"]\n\
    {\n   color: red;\n}\na[href*=\"personal\"]\n{\n   color: green;\n}\n```\n\n*Code\
    \ Listing 38: Contains string attribute rules to style based on substring*\n\n\
    This will produce the following output:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_42_0.png)\n\
    \n*Figure 24: Output produced by Code Listing 37 with the rules in Code Listing_previous\
    \ image\n\nWhat we've covered here hasn't even scratched the surface of the potential\
    \ available, especially when it comes to attribute selectors.\n\nUnder HTML 5\
    \ there's a new attribute type called a data-attribute. This new attribute takes\
    \ the form of:\n\n**data-**\n\nfollowed by a custom name, for example:\n\n**data-username**\n\
    \n**data-recordIndex**"
  merge: -1
  pgno: 42
- img_proc: true
  md: 'You can use these data attributes on any element, for any purpose, and when
    combined with the correct selectors, they allow you use HTML 5 to describe its
    own intentions and style easily.


    # Summary


    In this chapter we took a fairly deep dive into the main new selectors added in
    CSS3. We''ve seen how we''re no longer limited in how we can target our elements
    to style, and how we no longer have the restrictions we used to have, allowing
    almost limitless expression in our rules.


    In the next chapter we''ll take a closer look at the new pseudo selectors, which,
    when combined with what we''ve learned so far, will take the capabilities we have
    to new heights.'
  merge: -1
  pgno: 43
- img_proc: true
  md: "# Chapter 4  New Pseudo Selectors\n\nIn the previous chapter, we covered the\
    \ new main selectors added to CSS3. Now, we go further by exploring the new pseudo\
    \ selectors that have been added.\n\nPseudo selectors are different than the regular\
    \ selectors because they can't be used on their own. Instead, they need to be\
    \ combined with other selectors, such as those in the previous two chapters, in\
    \ order to do their job. At least, that's how they're described in the mainstream.\n\
    \nThe truth of the matter is that many of the pseudo selectors can now indeed\
    \ be used without any suffixing rule (as you'll see in a moment), but you do still\
    \ get the best from them when combining them with a regular selector.\n\nSome\
    \ of the selectors you'll see in this chapter are actually not new in CSS3 and\
    \ have been around quite some time. In previous versions, however, they either\
    \ were not well known, or because of the IE6/IE7/IE8 compatibility generation\
    \ problems, they were actively avoided and not used much.\n\nTo kick things off,\
    \ we'll deal with the oldest ones first.\n\n# :focus\n\nAs the name suggests,\
    \ **focus** is used when an input element has focus within a document. This is\
    \ usually used in forms to highlight the active field.\n\nLet's create a mock-up\
    \ form using the following HTML markup:\n\n```\n<form action=\"#\" method=\"post\"\
    >\n    <label for=\"txtUserName\">User Name</label><br />\n    <input type=\"\
    text\" id=\"txtUserName\" name=\"txtUserName\" /><br /><br />\n    <label for=\"\
    txtEmail\">Email</label><br />\n    <input type=\"text\" id=\"txtEmail\" name=\"\
    txtEmail\" /><br /><br />\n    <input type=\"submit\" value=\"Submit\" />\n</form>\n\
    ```\n\n*Code Listing 39: Mock HTML form markup*\n\nThis will give us a very generic\
    \ looking HTML form."
  merge: -1
  pgno: 44
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_0.png)\n\nLet's add the following\
    \ simple rule to our style sheet:\n\n```\n:focus\n{\n  background-color: beige;\n\
    \  color: green;\n}\n```\n\n*Code Listing 40: Simple Focus CSS rule*\n\nIf we\
    \ re-render our browser, and click into one of the form fields so that it gets\
    \ the focus, we should see that it changes to reflect the selected state.\n\n\
    ![](img/d6b4d2d62fbe04b9c83d677f3498c239_45_1.png)\n\nYou might notice in the\
    \ example that I've used **focus** on its own without extending anything. In CSS3,\
    \ many of the pseudo selectors can now be used in this manner; it simply means\
    \ apply it to anything that understands the selector.\n\nFor our example, any\
    \ element that can receive focus from the user will change its color as specified\
    \ when focus is given to it."
  merge: -1
  pgno: 45
- img_proc: true
  md: "# # A slight diversion into visited status\n\nI just want to briefly break\
    \ off and show another pseudo selector that's been around since V2 of the CSS\
    \ spec. It can be used alone in the same way as **focus**, but can also be used\
    \ maliciously to find out a person's browsing history.\n\nIf you place some external\
    \ anchor tags in your document as follows:\n\n```\n<ul>\n    <li><a href=\"http://www.google.co.uk/\"\
    >Google</a></li>\n    <li><a href=\"http://www.yahoo.co.uk/\">Yahoo</a></li>\n\
    \    <li><a href=\"http://msn.com\">MSN</a></li>\n</ul>\n```\n\n*Code Listing\
    \ 41a: External URLs*\n\nThen apply the following style rules:\n\n```\n:link\n\
    {\n    color: green;\n}\n\n:visited\n{\n    color: red;\n}\n```\n\n*Code Listing\
    \ 41b: Styles for the external URLs in 41a*\n\nWhen you render your document,\
    \ you'll see the following.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_46_0.png)\n\
    \n*Figure 27: Links rendered by Code Listing 41*\n\nYou might see that some or\
    \ even all of the links have a red color. In my case, only the Google link does,\
    \ and this is because the Google main UK site is in my browser history, whereas\
    \ the other two are not.\n\nIf you look at the CSS, you'll see that the styling\
    \ is provided by the **visited** pseudo selector, giving you, the user of the\
    \ page, instant visual confirmation that you recently visited that page."
  merge: -1
  pgno: 46
- img_proc: true
  md: "While this might seem fairly innocuous on the surface, if you dig down under\
    \ the hood and look at some of the new JavaScript API's that have been added in\
    \ newer specifications, you'll find that there's an API call that goes by the\
    \ name of `getComputedStyle`. Using this call, it's possible to get the actual\
    \ computed style that's visible on the element in the browser, or at least it\
    \ was.\n\nIn today's modern browsers, this hole is largely patched, and attempting\
    \ to use this call to get the color of the link will in fact just return whatever\
    \ the base color is. In our case, all we get back (even for the Google link) is\
    \ the green color.\n\nI have, however, heard rumors that it's possible to use\
    \ JQuery and MooTools to retrieve the correct value and make a distinction.\n\n\
    This is just a small example of the fact that anything can be used to breach a\
    \ user's privacy or security, even something as common as CSS. Always make sure\
    \ that your rules are specific if possible. Just because you can use them globally\
    \ without a rule to extend, doesn't mean you should. If you tie them to given\
    \ rule sets, it means that your style rules can't be abused by people hacking\
    \ around with the browser tools.\n\n# :disabled and :enabled\n\nAmong the many\
    \ new attributes that can be applied to elements in the HTML 5 spec is the `disabled`\
    \ attribute.\n\nYou use it like any other attribute by simply adding \"disabled\"\
    \ to an element in your markup.\n\nLet's reuse the form mock-up we created in\
    \ Code Listing 39, but change it so that it looks as follows:\n\n```\n<form action=\"\
    #\" method=\"post\">\n    <label for=\"txtUserName\">User Name</label><br />\n\
    \    <input type=\"text\" id=\"txtUserName\" name=\"txtUserName\" disabled /><br\
    \ /><br />\n    <label for=\"txtEmail\">Email</label><br />\n    <input type=\"\
    text\" id=\"txtEmail\" name=\"txtEmail\" /><br /><br />\n    <input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n```\n\nCode Listing 42: Mock HTML form markup\
    \ with disabled elements\n\nWhen you render it, you should see that the first\
    \ input element can't be used now."
  merge: -1
  pgno: 47
- img_proc: true
  md: "![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_0.png)\n\nFigure 28: Simple form\
    \ with a disabled input\n\nLet's add the following rule to our style sheet:\n\n\
    ```\ninput:disabled\n{\n    background-color: red;\n    border: 2px solid blue;\n\
    }\n```\n\nCode Listing 43: CSS rule to style disabled elements\n\nYou'll see a\
    \ drastic change when you re-render the form.\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_48_1.png)\n\
    \nFigure 29: Simple form with disabled pseudo class in Code Listing 43 applied\n\
    \nIf you remove the **disabled** attribute from the element, the input will revert\
    \ back to its original state.\n\nThis rule is typically used to show read-only\
    \ fields in a record editor, or to show fields that are not applicable to the\
    \ current form. For example, you might mark up a form so that address fields are\
    \ shown only when a tick box to send mail to that address is ticked."
  merge: -1
  pgno: 48
- img_proc: true
  md: "If you use the Bootstrap UI framework, you might have seen that some elements\
    \ when used in a form have a small, red stop circle displayed over them when you\
    \ hover over them with a mouse pointer. This is performed in the same way, using\
    \ the disabled rule to change the style of the mouse pointer.\n\nThe **enabled**\
    \ pseudo selector is the logical opposite of disabled, and applies the given style\
    \ to an element that is NOT disabled, as the following example shows:\n\n```\n\
    input:enabled\n{\n  background-color: yellow;\n  border: 2px solid green;\n}\n\
    ```\n\n*Code Listing 44: CSS rule to style enabled elements*\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_49_0.png)\n\
    \n*Figure 30: Browser form showing enabled CSS rules applied*\n\nAn element is\
    \ classed as enabled when there is no reason to disable it, or specifically, when\
    \ it does not have a **disabled** attribute applied.\n\nNote that an element is\
    \ also classed as disabled if the element's Boolean **disabled** property is set\
    \ to **true** on its document object using JavaScript. In this case, as with other\
    \ selectors, the application of the disabled and enabled selectors are explicitly\
    \ applied based on the element's state, meaning you don't have to keep making\
    \ sure the correct elements have the correct classes applied.\n\n# :valid and\
    \ :invalid\n\nAnother of the great features added to HTML 5 is browser-side validation.\
    \ With browser-side validation, you can make the browser verify the inputs to\
    \ a form before the form is submitted.\n\nLike the disabled selector, the pseudo\
    \ selectors here apply to elements only when we use the extra attributes and markup\
    \ provided in the specification.\n\nUsing our form again, let's make another change\
    \ so that you have the following HTML code:"
  merge: -1
  pgno: 49
- img_proc: true
  md: "```\n<form action=\"#\" method=\"post\">\n    <label for=\"txtUserName\">User\
    \ Name</label><br />\n    <input type=\"text\" id=\"txtUserName\" name=\"txtUserName\"\
    \ required /><br /><br />\n    <label for=\"txtEmail\">Email</label><br />\n \
    \   <input type=\"email\" id=\"txtEmail\" name=\"txtEmail\" /><br /><br />\n \
    \   <input type=\"submit\" value=\"Submit\" />\n</form>\n```\n\nCode Listing 45:\
    \ Mock HTML form markup with validatable elements\n\nThe changes might not be\
    \ obvious at first, but if you look at the user name box, you'll see that it now\
    \ has a **required** attribute.\n\nThe email input, however, no longer has a type\
    \ of **text**; it now has a type of **email**.\n\nIf we render this, and then\
    \ click **Submit** without entering any values, we'll see something similar to\
    \ the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_0.png)\n\nFigure\
    \ 31: Our basic form showing the required attribute in action\n\nIf we add something\
    \ in the name box, and put something in the email box, but deliberately format\
    \ the email incorrectly, we'll also get validation on the format of the email.\n\
    \n![](img/d6b4d2d62fbe04b9c83d677f3498c239_50_1.png)\n\nFigure 32: Our basic form\
    \ showing the email validation in action\n\nThere's more to the validation classes\
    \ that I'll be showing here, but for now, add the following rules to your style\
    \ sheet:"
  merge: -1
  pgno: 50
- img_proc: true
  md: "```\ninput:valid\n{\n    background-color: green;\n}\n\ninput:invalid\n{\n\
    \    background-color: red;\n}\n```\n\nCode Listing 46: CSS3 Validation rules\n\
    \nIf you then render the page, you should get the following:\n\n![](img/d6b4d2d62fbe04b9c83d677f3498c239_51_0.png)\n\
    \nFigure 33: Simple form with validation styles from Code Listing 46 applied\n\
    \nThe user name is immediately red because it's required, so until it's filled\
    \ in, it's classed as invalid.\n\nThe email is valid, as we've only told it that\
    \ it must have its input validated as an email address. We haven't said that it's\
    \ required as input, so having a blank email is valid. However, if you start typing\
    \ in it, it will change to red and won't change back to green until the input\
    \ is either correctly formed, or removed entirely.\n\nUsing `valid` and `invalid`\
    \ is a great way of giving feedback to the user, but seeing them immediately as\
    \ soon as the form is displayed is generally not considered good practice.\n\n\
    For this reason, you would usually NOT apply them directly to input elements as\
    \ I have (in fact, you can see I've just used a very broad selector because the\
    \ button is green too). Usually, you'll attach them to a class/id name, then check\
    \ and apply them using JavaScript when the form is submitted.\n\nAs this book\
    \ is about CSS, I'm not going to go into detail about that here. If you want to\
    \ venture further down the rabbit hole of HTML 5 validation, there's a post on\
    \ [my blog](https://example.com) that will get you started."
  merge: -1
  pgno: 51
- img_proc: true
  md: "# :in-range and :out-of-range\n\nFollowing on with the validation pseudo selectors,\
    \ we have **in-range** and **out-of-range**. These are both used in a similar\
    \ way to **valid** and **invalid** in the previous section, but they handle a\
    \ different scenario.\n\nValidation of text types and contents are not the only\
    \ validation to be added to the new specifications; the HTML 5 spec also brings\
    \ with it number types and minimum/maximum ranges.\n\nCreate another dummy form,\
    \ but this time, rather than a user name and email input box, let's define a number\
    \ range.\n\n```\n<form action=\"#\" method=\"post\">\n  <label for=\"nmbUserAge\"\
    >User Age</label><br />\n  <input type=\"number\" id=\"nmbUserAge\" name=\"nmbUserAge\"\
    \ min=\"16\" maximum=\"100\" /> <br /><br />\n  <input type=\"submit\" value=\"\
    Submit\" />\n</form>\n```\n\nCode Listing 47a: Mock HTML form with a number input\n\
    \nLet's apply the following styles to our form:\n\n```\ninput[type=number]:in-range\n\
    {\n  background-color: yellow;\n}\n\ninput[type=number]:out-of-range\n{\n  background-color:\
    \ salmon;\n}\n```\n\nCode Listing 47b: Styles for our number range form in Listing\
    \ 47a\n\nWhen we render the form, we'll initially see it show using the out-of-range\
    \ color, due to the fact that it has no value in it.\n\nIf we then start entering\
    \ values, we should see the color change depending on what value we enter, in\
    \ range or out."
