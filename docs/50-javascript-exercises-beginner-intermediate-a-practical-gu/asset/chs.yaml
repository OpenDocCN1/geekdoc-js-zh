- "# 50 个 JavaScript 练习（初级与中级）：JavaScript 挑战实用指南 - 从入门到高级指南\n\n## 快速说明\n我们希望您对近期在亚马逊的购物感到满意！我们想借此机会温馨提醒您，为所购商品撰写评价的重要性。您的反馈对我们和其他潜在买家来说都极具价值。\n\
  \n通过分享您对产品的想法和使用体验，您能帮助他人做出明智的决策。您的评价可以成为其他顾客的指路明灯，确保他们选择最适合自己需求的产品。\n\n如果您能抽出几分钟时间撰写一份诚实的评价，我们将不胜感激。您的反馈有助于我们改进产品和服务，实现双赢。\n\
  \n感谢您成为我们尊贵的客户，并考虑撰写评价。我们衷心感谢您的支持。\n\n介绍我的个人博客。保持联系！\n[`premiumbookself.wordpress.com/`](https://premiumbookself.wordpress.com/)\n\
  \n## 引言\n欢迎阅读《50 个 JavaScript 练习：初学者与中级》。本书将带您踏上提升 JavaScript 理解与专业技能的旅程。JavaScript\
  \ 是当今最常用、最具动态性的编程语言之一。\n\nJavaScript 诞生于 20 世纪 90 年代中期，最初作为为网页添加交互性的脚本语言，如今已发生了巨大演变。它不再仅仅是一种前端语言，还驱动着后端、游戏、移动应用和物联网设备。由于其多功能性，以及新\
  \ Web 框架和`Node.js`环境的兴起，它已成为开发者的关键技能。\n\n本书中的练习经过精心设计，既适合初涉编程世界的新手，也适合希望精进 JavaScript\
  \ 细节的资深程序员。每项任务都旨在提升问题解决能力，并巩固您对 JavaScript 核心概念的理解——从基本变量声明到异步操作的复杂性。\n\n祝编程愉快！\n\
  \n## 初级练习\n\n### 第 1 节：变量与基本数据类型\n1-1. 声明一个变量`age`，并赋值为你的年龄。输出它的值。\n1-2. 声明一个变量`isStudent`，并赋值为布尔值。使用`typeof`输出它的类型。\n\
  1-3. 声明一个字符串变量`aboutMe`，将你的名字和年龄组合起来，例如\"My name is Alex and I am 25 years old\"\
  。\n1-4. 创建一个常量`PI`，并赋值为`3.14159`。\n1-5. 输出一个数除以零的结果。\n\n### 第 2 节：基本运算符\n2-1. 给定两个数，输出它们的和、差、积和商。\n\
  2-2. 使用取模运算符求两个数的余数。\n2-3. 使用`**`运算符计算一个数的幂。\n2-4. 分别使用`++`运算符和`+=`运算符对一个数进行自增。\n\
  2-5. 分别使用`--`运算符和`-=`运算符对一个数进行自减。\n\n### 第 3 节：字符串\n3-1. 声明一个字符串，并输出它的长度。\n3-2.\
  \ 将字符串转换为大写。\n3-3. 检查字符串是否包含单词\"apple\"。\n3-4. 将一个逗号分隔的字符串拆分为数组。\n3-5. 将字符串中所有的\"\
  apple\"替换为\"orange\"。\n\n### 第 4 节：条件语句\n4-1. 编写一个条件语句，如果数字大于 0，则输出\"positive\"\
  。\n4-2. 扩展上述条件，对于小于 0 的数字输出\"negative\"，否则输出\"zero\"。\n4-3. 使用`switch`语句处理一周中多天的不同情况。\n\
  4-4. 检查字符串长度是否大于 5。如果是，输出\"Long string\"，否则输出\"Short string\"。\n4-5. 使用三元运算符判断一个数是奇数还是偶数。\n\
  \n### 第 5 节：循环\n5-1. 使用`for`循环输出数字 1 到 10。\n5-2. 使用`while`循环输出数字 5 到 15。\n5-3. 使用循环输出\
  \ 1 到 20 之间的所有偶数。\n5-4. 使用循环输出字符串中的每个字符。\n5-5. 使用循环反转一个字符串。\n\n## 中级练习\n\n### 第\
  \ 6 节：数组\n6-1. 创建一个颜色数组。在数组的开头和结尾各添加一种颜色。\n6-2. 删除数组中的第一种颜色。\n6-3. 查找数组中某种颜色的索引。\n\
  6-4. 使用循环输出数组中的每种颜色。\n6-5. 使用`.map()`方法创建一个新数组，其中每种颜色都转换为大写。\n\n### 第 7 节：函数\n7-1.\
  \ 编写一个函数，返回两个数的和。\n7-2. 编写一个函数，判断一个数是否为质数。\n7-3. 创建一个函数，返回一个数的阶乘。\n7-4. 编写一个函数，接受一个字符串并返回其反转版本。\n\
  7-5. 编写一个函数，接受一个数组并返回其中最大的数。\n\n### 第 8 节：对象\n8-1. 创建一个`car`对象，包含属性：`make`、`model`和`year`。\n\
  8-2. 为`car`对象添加一个方法，在控制台输出\"Vroom Vroom\"。\n8-3. 使用方括号表示法访问并输出`car`对象的一个属性。\n8-4.\
  \ 为`car`对象添加一个属性`isRunning`，并设置为`false`。\n8-5. 编写一个函数，接受一个对象和一个属性名，检查该对象是否拥有该属性。\n\
  \n### 第 9 节：DOM 操作\n（需要在浏览器环境中运行）\n9-1. 通过 ID 选择一个元素，并更改其文本内容。\n9-2. 为一个元素添加一个类。\n\
  9-3. 当元素被点击时，切换其上的一个类。\n9-4. 创建一个新的`div`元素，并将其附加到`body`中。\n9-5. 当元素被点击时，从 DOM 中移除该元素。\n\
  \n### 第 10 节：事件与监听器\n（需要在浏览器环境中运行）\n10-1. 当按钮被点击时，输出一条消息。\n10-2. 当鼠标悬停在`div`上时，更改其背景颜色。\n\
  10-3. 当按钮被点击时，输出文本输入字段的值。\n10-4. 阻止表单提交，并输出其`action`属性。\n10-5. 在输入字段的`keydown`事件中，输出按下的键。\n\
  \n### 初级 1 - 解答\n\n```javascript\n// 1-1: Declare a variable age and assign your\
  \ age to it. Log its value.\nlet age = 25;\nconsole.log(age);\n\n// 1-2: Declare\
  \ a variable isStudent and assign a boolean value. Log its type using typeof.\n\
  let isStudent = true;\nconsole.log(typeof isStudent);\n\n// 1-3: Declare a string\
  \ variable aboutMe that combines your name and age.\nlet name = \"Alex\";\nlet age2\
  \ = 25;\nlet aboutMe = \"My name is \" + name + \" and I am \" + age2 + \" years\
  \ old\";\nconsole.log(aboutMe);\n\n// 1-4: Create a constant variable PI and assign\
  \ 3.14159 to it.\nconst PI = 3.14159;\nconsole.log(PI);\n\n// 1-5: Log the result\
  \ of dividing a number by zero.\nlet result = 5 / 0;\nconsole.log(result);\n```\n\
  \n**参考输出**\n- 1-1: `25`\n- 1-2: `\"boolean\"`\n- 1-3: `\"My name is Alex and I am\
  \ 25 years old\"`\n- 1-4: `3.14159`\n- 1-5: `Infinity`\n\n### 初级 2 - 解答\n\n```javascript\n\
  // 2-1: Given two numbers, log their sum, difference, product, and quotient.\nlet\
  \ a = 7, b = 5;\nconsole.log(a + b, a - b, a * b, a / b);\n```\n\n\n\n\n\n### 初学者\
  \ 2 - 解答\n\n// 2-2：使用取模运算符求两个数的余数。\n```javascript\nconsole.log(a % b);\n```\n\n\
  // 2-3：使用 ** 运算符计算一个数的幂。\n```javascript\nconsole.log(a ** 2);\n```\n\n// 2-4：分别使用\
  \ ++ 运算符和 += 运算符对数字进行自增。\n```javascript\na++;\na += 1;\nconsole.log(a);\n```\n\n\
  // 2-5：分别使用 -- 运算符和 -= 运算符对数字进行自减。\n```javascript\nb--;\nb -= 1;\nconsole.log(b);\n\
  ```\n\n#### 参考输出\n- 2-1：`12 2 35 1.4`\n- 2-2：`2`\n- 2-3：`49`\n- 2-4：`9`\n- 2-5：`3`\n\
  \n### 初学者 3 - 解答\n\n// 3-1：声明一个字符串并输出其长度。\n```javascript\nlet str = \"apple\";\n\
  console.log(str.length);\n```\n\n// 3-2：将字符串转换为大写。\n```javascript\nconsole.log(str.toUpperCase());\n\
  ```\n\n// 3-3：检查字符串是否包含单词 \"apple\"。\n```javascript\nconsole.log(str.includes(\"\
  apple\"));\n```\n\n// 3-4：将逗号分隔的字符串拆分为数组。\n```javascript\nlet fruits = \"apple,banana,grape\"\
  ;\nlet fruitArray = fruits.split(\",\");\nconsole.log(fruitArray);\n```\n\n// 3-5：将字符串中所有的\
  \ \"apple\" 替换为 \"orange\"。\n```javascript\nlet newString = str.replace(\"apple\"\
  , \"orange\");\nconsole.log(newString);\n```\n\n#### 参考输出\n- 3-1：`5`\n- 3-2：`\"\
  APPLE\"`\n- 3-3：`true`\n- 3-4：`[\"apple\", \"banana\", \"grape\"]`\n- 3-5：`\"orange\"\
  `\n\n### 初学者 4 - 解答\n\n// 4-1：使用数组存储 5 个数字并输出该数组。\n```javascript\nlet numbers =\
  \ [10, 20, 30, 40, 50];\nconsole.log(numbers);\n```\n\n// 4-2：在数组末尾再添加两个数字。\n```javascript\n\
  numbers.push(60, 70);\nconsole.log(numbers);\n```\n\n// 4-3：移除数组中的第一个数字。\n```javascript\n\
  numbers.shift();\nconsole.log(numbers);\n```\n\n// 4-4：使用 indexOf 方法查找特定数字的索引。\n\
  ```javascript\nlet index = numbers.indexOf(40);\nconsole.log(index);\n```\n\n//\
  \ 4-5：使用循环对数组中的所有数字求和。\n```javascript\nlet sum = 0;\nfor (let num of numbers) {\n\
  \  sum += num;\n}\nconsole.log(sum);\n```\n\n#### 参考输出\n- 4-1：`[10, 20, 30, 40,\
  \ 50]`\n- 4-2：`[10, 20, 30, 40, 50, 60, 70]`\n- 4-3：`[20, 30, 40, 50, 60, 70]`\n\
  - 4-4：`2`\n- 4-5：`270`\n\n### 初学者 5 - 解答\n\n// 5-1：创建一个对象来存储一个人的姓名、年龄和地址。\n```javascript\n\
  let person = {\n  name: 'John',\n  age: 30,\n  address: '123 Main St'\n};\nconsole.log(person);\n\
  ```\n\n// 5-2：添加一个电话号码属性并输出该对象。\n```javascript\nperson.phone = '555-1234';\nconsole.log(person);\n\
  ```\n\n// 5-3：从对象中删除地址属性。\n```javascript\ndelete person.address;\nconsole.log(person);\n\
  ```\n\n// 5-4：使用 for...in 循环输出对象的所有属性和值。\n```javascript\nfor (let prop in person)\
  \ {\n  console.log(`${prop}: ${person[prop]}`);\n}\n```\n\n// 5-5：使用对象解构创建 name\
  \ 和 age 的变量。\n```javascript\nlet { name: personName, age: personAge } = person;\n\
  console.log(personName, personAge);\n```\n\n#### 参考输出\n- 5-1：`{name: 'John', age:\
  \ 30, address: '123 Main St'}`\n- 5-2：`{name: 'John', age: 30, address: '123 Main\
  \ St', phone: '555-1234'}`\n- 5-3：`{name: 'John', age: 30, phone: '555-1234'}`\n\
  - 5-4：`name: John`，`age: 30`，`phone: 555-1234`\n- 5-5：`John 30`\n\n### 中级 6 - 解答\n\
  \n// 6-1：编写一个函数，接受两个数字并返回它们的和。\n```javascript\nfunction add(a, b) {\n  return a\
  \ + b;\n}\nconsole.log(add(5, 3));\n```\n\n// 6-2：编写一个函数，返回从 1 到 n 的数字数组。\n```javascript\n\
  function generateNumbers(n) {\n  let result = [];\n  for (let i = 1; i <= n; i++)\
  \ {\n    result.push(i);\n  }\n  return result;\n}\nconsole.log(generateNumbers(5));\n\
  ```\n\n// 6-3：编写一个函数，检查给定的字符串是否为回文。\n```javascript\nfunction isPalindrome(s) {\n\
  \  let reversed = s.split('').reverse().join('');\n  return s === reversed;\n}\n\
  console.log(isPalindrome(\"madam\"));\n```\n\n// 6-4：编写一个函数，找出数组中的最大数字。\n```javascript\n\
  function largestNumber(arr) {\n  return Math.max(...arr);\n}\nconsole.log(largestNumber([5,\
  \ 2, 8, 3]));\n```\n\n// 6-5：编写一个函数，统计数组中特定元素出现的次数。\n```javascript\nfunction countOccurrences(arr,\
  \ element) {\n  return arr.filter(e => e === element).length;\n}\nconsole.log(countOccurrences([1,\
  \ 2, 3, 2, 4, 2], 2));\n```\n\n#### 参考输出\n- 6-1：`8`\n- 6-2：`[1, 2, 3, 4, 5]`\n-\
  \ 6-3：`true`\n- 6-4：`8`\n- 6-5：`3`\n\n### 中级 7 - 解答\n\n// 7-1：使用 map 函数将数组中的每个数字翻倍。\n\
  ```javascript\nlet numbers = [20, 30, 40, 50, 60, 70]; // 引用前面章节的数组\nlet doubled\
  \ = numbers.map(num => num * 2);\nconsole.log(doubled);\n```\n\n// 7-2：使用 filter\
  \ 函数找出数组中大于 50 的数字。\n```javascript\nlet greaterThanFifty = numbers.filter(num =>\
  \ num > 50);\nconsole.log(greaterThanFifty);\n```\n\n// 7-3：使用 reduce 函数计算数组中所有数字的乘积。\n\
  ```javascript\nlet product = numbers.reduce((acc, num) => acc * num, 1);\nconsole.log(product);\n\
  ```\n\n// 7-4：创建一个 Promise，在 2 秒后以值 'Done' 解决。\n```javascript\nlet promise = new\
  \ Promise((resolve, reject) => {\n  setTimeout(() => {\n    resolve('Done');\n \
  \ }, 2000);\n});\npromise.then(result => console.log(result));\n```\n\n// 7-5：使用\
  \ async/await 处理该 Promise。\n```javascript\nasync function handlePromise() {\n  let\
  \ result = await promise;\n  console.log(result);\n}\nhandlePromise();\n```\n\n\
  #### 参考输出\n- 7-1：`[40, 60, 80, 100, 120, 140]`\n- 7-2：`[60, 70]`\n- 7-3：`16800000`\n\
  - 7-4：`Done（2 秒后）`\n- 7-5：`Done（紧接在上一个 'Done' 之后）`\n\n### 中级 8 - 解答\n\n// 8-1：获取对象的所有键组成的数组。\n\
  ```javascript\nfunction getAllKeys(obj) {\n  return Object.keys(obj);\n}\nconsole.log(getAllKeys({\
  \ name: \"John\", age: 25, city: \"New York\" }));\n```\n\n// 8-2：深拷贝一个对象。\n```javascript\n\
  function deepClone(obj) {\n  return JSON.parse(JSON.stringify(obj));\n}\nlet original\
  \ = { name: \"John\", address: { city: \"New York\" } };\nlet clone = deepClone(original);\n\
  console.log(clone);\n```\n\n// 8-3：检查输入是否为数组。\n```javascript\nfunction isArray(input)\
  \ {\n  return Array.isArray(input);\n}\nconsole.log(isArray([1, 2, 3]));\n```\n\n\
  // 8-4：简单的 'Book' 类。\n```javascript\nclass Book {\n  constructor(title, author)\
  \ {\n    this.title = title;\n    this.author = author;\n  }\n  displayDetails()\
  \ {\n    console.log(`\"${this.title}\" by ${this.author}`);\n  }\n}\nlet myBook\
  \ = new Book(\"1984\", \"George Orwell\");\nmyBook.displayDetails();\n```\n\n//\
  \ 8-5：扩展 'Book' 类为 'EBook'。\n```javascript\nclass EBook extends Book {\n  constructor(title,\
  \ author, fileSize) {\n    super(title, author);\n    this.fileSize = fileSize;\n\
  \  }\n  displayDetails() {\n    console.log(`\"${this.title}\" by ${this.author},\
  \ File Size: ${this.fileSize}MB`);\n  }\n}\nlet myEBook = new EBook(\"Digital Fortress\"\
  , \"Dan Brown\", 5);\nmyEBook.displayDetails();\n```\n\n#### 参考输出\n- 8-1：`[\"name\"\
  , \"age\", \"city\"]`\n- 8-2：`{\"name\": \"John\", \"address\": {\"city\": \"New\
  \ York\"}}`\n- 8-3：`true`\n- 8-4：`\"1984 by George Orwell\"`\n- 8-5：`\"Digital Fortress\
  \ by Dan Brown, File Size: 5MB\"`\n\n### 中级 9 - 解答\n\n// 9-1：从提供的 URL 获取数据。\n```javascript\n\
  function fetchData(url) {\n  fetch(url)\n    .then(response => response.json())\n\
  \    .then(data => console.log(data));\n}\nfetchData('https://api.example.com/data');\n\
  ```\n\n// 9-2：使用 async 函数等待 fetch 的结果。\n```javascript\nasync function asyncFetch(url)\
  \ {\n  let response = await fetch(url);\n  let data = await response.json();\n \
  \ console.log(data);\n}\nasyncFetch('https://api.example.com/data');\n```\n\n//\
  \ 9-3：将基于回调的函数转换为基于 Promise 的函数。\n```javascript\nfunction callbackFunction(data,\
  \ callback) {\n  if (data) {\n    callback(null, \"Data processed successfully\"\
  );\n  } else {\n    callback(\"Error processing data\", null);\n  }\n}\n\nfunction\
  \ promiseFunction(data) {\n  return new Promise((resolve, reject) => {\n    callbackFunction(data,\
  \ (error, result) => {\n      if (error) {\n        reject(error);\n      } else\
  \ {\n        resolve(result);\n      }\n    });\n  });\n}\npromiseFunction(true).then(console.log).catch(console.error);\n\
  ```\n\n// 9-4：获取 JSON 并优雅地处理错误。\n```javascript\nfunction fetchWithGrace(url) {\n\
  \  fetch(url)\n    .then(response => {\n      if (!response.ok) {\n        throw\
  \ new Error(\"Network response was not ok\");\n      }\n      return response.json();\n\
  \    })\n    .then(data => console.log(data))\n    .catch(error => console.log(error.message));\n\
  }\nfetchWithGrace('https://api.example.com/data');\n```\n\n// 9-5：使用回调进行 AJAX 请求。\n\
  ```javascript\nfunction ajaxRequest(url, callback) {\n  let xhr = new XMLHttpRequest();\n\
  \  xhr.open(\"GET\", url, true);\n  xhr.onload = function() {\n    if (xhr.status\
  \ >= 200 && xhr.status < 400) {\n      // ...\n    }\n  };\n}\n```\n\n\n\n\n```javascript\n\
  let data = JSON.parse(xhr.responseText);\ncallback(null, data);\n} else {\ncallback(\"\
  Error fetching data\", null);\n}\n};\nxhr.onerror = function() {\ncallback(\"Network\
  \ error\", null);\n};\nxhr.send();\n}\n\najaxRequest('https://api.example.com/data',\
  \ (error, data) => {\nif (error) {\nconsole.log(error);\n} else {\nconsole.log(data);\n\
  }\n});\n```\n\n#### 参考输出\n\n- **9-1**: `{...}` // 来自 `https://api.example.com/data`\
  \ 的 JSON 响应\n- **9-2**: `{...}` // 来自 `https://api.example.com/data` 的 JSON 响应\n\
  - **9-3**: `\"Data processed successfully\"`\n- **9-4**: `{...}` 或 `\"Network response\
  \ was not ok\"` // 取决于响应\n- **9-5**: `{...}` 或 `\"Error fetching data\"` 或 `\"Network\
  \ error\"` // 取决于响应\n\n### 中级 10 – 解决方案\n\n#### 10-1: 解构以提取属性\n```javascript\nlet\
  \ person = { name: \"John\", age: 30, city: \"New York\" };\nlet { name, age } =\
  \ person;\nconsole.log(name, age);\n```\n\n#### 10-2: 展开运算符合并数组\n```javascript\n\
  let arr1 = [1, 2, 3];\nlet arr2 = [4, 5, 6];\nlet combinedArray = [...arr1, ...arr2];\n\
  console.log(combinedArray);\n```\n\n#### 10-3: 剩余参数收集参数\n```javascript\nfunction\
  \ gatherArgs(...args) {\nreturn args;\n}\nconsole.log(gatherArgs(1, 2, 3, 4, 5));\n\
  ```\n\n#### 10-4: 动态属性名\n```javascript\nfunction dynamicObject(prop, value) {\n\
  return { [prop]: value };\n}\nconsole.log(dynamicObject(\"key\", \"value\"));\n\
  ```\n\n#### 10-5: 模板字面量\n```javascript\nlet greeting = \"Hello\";\nlet recipient\
  \ = \"World\";\nconsole.log(`${greeting}, ${recipient}!`);\n```\n\n#### 参考输出\n\n\
  - **10-1**: `John 30`\n- **10-2**: `[1, 2, 3, 4, 5, 6]`\n- **10-3**: `[1, 2, 3,\
  \ 4, 5]`\n- **10-4**: `{\"key\": \"value\"}`\n- **10-5**: `Hello, World!`\n"
