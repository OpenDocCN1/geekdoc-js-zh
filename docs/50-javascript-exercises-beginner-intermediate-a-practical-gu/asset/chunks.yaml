    ## Introduction

    Welcome to "50 JavaScript Exercises: Beginner & Intermediate." This book will
    take you on a trip to improve your understanding and expertise in JavaScript,
    one of the most frequently used and dynamic programming languages in the world.


    JavaScript, which debuted in the mid-1990s as a scripting language for adding
    interaction to online pages, has evolved dramatically. It''s no longer simply
    a frontend language; it now powers backends, games, mobile apps, and IoT devices.
    Because of its versatility, as well as the emergence of new web frameworks and
    the `Node.js` environment, it has become a critical talent for developers.


    The exercises in this book have been deliberately designed to appeal to both newbies
    dipping their toes into the world of programming and seasoned coders looking to
    fine-tune their grip on JavaScript''s quirks. Each task is designed to improve
    problem-solving abilities and cement your comprehension of JavaScript''s fundamental
    concepts, from basic variable declarations to the intricacies of asynchronous
    operations.


    Have fun coding!


    # Beginner Exercises


    ### Section 1: Variables and Basic Data Types

    1-1. Declare a variable `age` and assign your age to it. Log its value.

    1-2. Declare a variable `isStudent` and assign a boolean value. Log its type using
    `typeof`.

    1-3. Declare a string variable `aboutMe` that combines your name and age like
    "My name is Alex and I am 25 years old".

    1-4. Create a constant variable `PI` and assign `3.14159` to it.

    1-5. Log the result of dividing a number by zero.


    ### Section 2: Basic Operators

    2-1. Given two numbers, log their sum, difference, product, and quotient.

    2-2. Use the modulo operator to find the remainder of two numbers.

    2-3. Use the `**` operator to raise a number to a power.

    2-4. Increment a number using both the `++` operator and the `+=` operator.

    2-5. Decrement a number using both the `--` operator and the `-=` operator.


    ### Section 3: Strings

    3-1. Declare a string and log its length.

    3-2. Convert a string to uppercase.

    3-3. Check if a string includes the word "apple".

    3-4. Split a comma-separated string into an array.

    3-5. Replace all instances of "apple" with "orange" in a string.


    ### Section 4: Conditional Statements

    4-1. Write a conditional that logs "positive" if a number is greater than 0.

    4-2. Expand the above to log "negative" for numbers less than 0 and "zero" otherwise.

    4-3. Use a `switch` statement to handle multiple cases for a day of the week.

    4-4. Check if a string length is greater than 5. If yes, log "Long string", otherwise
    "Short string".

    4-5. Use a ternary operator to check if a number is odd or even.


    ### Section 5: Loops

    5-1. Use a `for` loop to log numbers 1 through 10.

    5-2. Use a `while` loop to log numbers 5 through 15.

    5-3. Log all even numbers between 1 and 20 using a loop.

    5-4. Log the characters of a string using a loop.

    5-5. Use a loop to reverse a string.


    # Intermediate Exercises


    ### Section 6: Arrays

    6-1. Create an array of colors. Add a color to its beginning and its end.

    6-2. Remove the first color in the array.

    6-3. Find the index of a color in the array.

    6-4. Use a loop to log each color in the array.

    6-5. Use the `.map()` method to create a new array with each color uppercase.


    ### Section 7: Functions

    7-1. Write a function that returns the sum of two numbers.

    7-2. Write a function that determines if a number is prime.

    7-3. Create a function that returns the factorial of a number.

    7-4. Write a function that takes a string and returns its reversed version.

    7-5. Write a function that takes an array and returns the largest number.


    ### Section 8: Objects

    8-1. Create a `car` object with properties: `make`, `model`, and `year`.

    8-2. Add a method to the `car` object that logs "Vroom Vroom" to the console.

    8-3. Access and log a property of the `car` object using bracket notation.

    8-4. Add a property `isRunning` to the `car` object and set it to `false`.

    8-5. Write a function that takes an object and a property name and checks if the
    object has that property.


    ### Section 9: DOM Manipulation

    (Requires running in a browser environment)

    9-1. Select an element by its ID and change its text content.

    9-2. Add a class to an element.

    9-3. Toggle a class on an element when it''s clicked.

    9-4. Create a new `div` element and append it to the `body`.

    9-5. Remove an element from the DOM when it''s clicked.


    ### Section 10: Events and Listeners

    (Requires running in a browser environment)

    10-1. Log a message when a button is clicked.

    10-2. Change the background color of a `div` when it''s hovered over.

    10-3. Log the value of a text input field when a button is clicked.

    10-4. Prevent a form from submitting and log its `action` attribute.

    10-5. Log the key pressed in a `keydown` event on an input field.


    ## Beginner 1 - Solutions


    ```javascript

    // 1-1: Declare a variable age and assign your age to it. Log its value.

    let age = 25;

    console.log(age);


    // 1-2: Declare a variable isStudent and assign a boolean value. Log its type
    using typeof.

    let isStudent = true;

    console.log(typeof isStudent);


    // 1-3: Declare a string variable aboutMe that combines your name and age.

    let name = "Alex";

    let age2 = 25;

    let aboutMe = "My name is " + name + " and I am " + age2 + " years old";

    console.log(aboutMe);


    // 1-4: Create a constant variable PI and assign 3.14159 to it.

    const PI = 3.14159;

    console.log(PI);


    // 1-5: Log the result of dividing a number by zero.

    let result = 5 / 0;

    console.log(result);

    ```


    **Reference Output**

    - 1-1: `25`

    - 1-2: `"boolean"`

    - 1-3: `"My name is Alex and I am 25 years old"`

    - 1-4: `3.14159`

    - 1-5: `Infinity`


    ## Beginner 2 - Solutions


    ```javascript

    // 2-1: Given two numbers, log their sum, difference, product, and quotient.

    let a = 7, b = 5;

    console.log(a + b, a - b, a * b, a / b);

    ```

