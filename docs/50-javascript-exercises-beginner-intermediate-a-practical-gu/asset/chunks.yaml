    let person = { name: "John", age: 30, city: "New York" };

    let { name, age } = person;

    console.log(name, age);

    ```


    ### 10-2: Spread operator to combine arrays

    ```javascript

    let arr1 = [1, 2, 3];

    let arr2 = [4, 5, 6];

    let combinedArray = [...arr1, ...arr2];

    console.log(combinedArray);

    ```


    ### 10-3: Rest operator to gather arguments

    ```javascript

    function gatherArgs(...args) {

    return args;

    }

    console.log(gatherArgs(1, 2, 3, 4, 5));

    ```


    ### 10-4: Dynamic property names

    ```javascript

    function dynamicObject(prop, value) {

    return { [prop]: value };

    }

    console.log(dynamicObject("key", "value"));

    ```


    ### 10-5: Template literals

    ```javascript

    let greeting = "Hello";

    let recipient = "World";

    console.log(`${greeting}, ${recipient}!`);

    ```


