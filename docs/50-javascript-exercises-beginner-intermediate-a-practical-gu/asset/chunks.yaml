    我们希望您对近期在亚马逊的购物感到满意！我们想借此机会温馨提醒您，为所购商品撰写评价的重要性。您的反馈对我们和其他潜在买家来说都极具价值。


    通过分享您对产品的想法和使用体验，您能帮助他人做出明智的决策。您的评价可以成为其他顾客的指路明灯，确保他们选择最适合自己需求的产品。


    如果您能抽出几分钟时间撰写一份诚实的评价，我们将不胜感激。您的反馈有助于我们改进产品和服务，实现双赢。


    感谢您成为我们尊贵的客户，并考虑撰写评价。我们衷心感谢您的支持。


    介绍我的个人博客。保持联系！

    [`premiumbookself.wordpress.com/`](https://premiumbookself.wordpress.com/)


    ## 引言

    欢迎阅读《50 个 JavaScript 练习：初学者与中级》。本书将带您踏上提升 JavaScript 理解与专业技能的旅程。JavaScript 是当今最常用、最具动态性的编程语言之一。


    JavaScript 诞生于 20 世纪 90 年代中期，最初作为为网页添加交互性的脚本语言，如今已发生了巨大演变。它不再仅仅是一种前端语言，还驱动着后端、游戏、移动应用和物联网设备。由于其多功能性，以及新
    Web 框架和`Node.js`环境的兴起，它已成为开发者的关键技能。


    本书中的练习经过精心设计，既适合初涉编程世界的新手，也适合希望精进 JavaScript 细节的资深程序员。每项任务都旨在提升问题解决能力，并巩固您对 JavaScript
    核心概念的理解——从基本变量声明到异步操作的复杂性。


    祝编程愉快！


    # 初级练习


    ### 第 1 节：变量与基本数据类型

    1-1. 声明一个变量`age`，并赋值为你的年龄。输出它的值。

    1-2. 声明一个变量`isStudent`，并赋值为布尔值。使用`typeof`输出它的类型。

    1-3. 声明一个字符串变量`aboutMe`，将你的名字和年龄组合起来，例如"My name is Alex and I am 25 years old"。

    1-4. 创建一个常量`PI`，并赋值为`3.14159`。

    1-5. 输出一个数除以零的结果。


    ### 第 2 节：基本运算符

    2-1. 给定两个数，输出它们的和、差、积和商。

    2-2. 使用取模运算符求两个数的余数。

    2-3. 使用`**`运算符计算一个数的幂。

    2-4. 分别使用`++`运算符和`+=`运算符对一个数进行自增。

    2-5. 分别使用`--`运算符和`-=`运算符对一个数进行自减。


    ### 第 3 节：字符串

    3-1. 声明一个字符串，并输出它的长度。

    3-2. 将字符串转换为大写。

    3-3. 检查字符串是否包含单词"apple"。

    3-4. 将一个逗号分隔的字符串拆分为数组。

    3-5. 将字符串中所有的"apple"替换为"orange"。


    ### 第 4 节：条件语句

    4-1. 编写一个条件语句，如果数字大于 0，则输出"positive"。

    4-2. 扩展上述条件，对于小于 0 的数字输出"negative"，否则输出"zero"。

    4-3. 使用`switch`语句处理一周中多天的不同情况。

    4-4. 检查字符串长度是否大于 5。如果是，输出"Long string"，否则输出"Short string"。

    4-5. 使用三元运算符判断一个数是奇数还是偶数。


    ### 第 5 节：循环

    5-1. 使用`for`循环输出数字 1 到 10。

    5-2. 使用`while`循环输出数字 5 到 15。

    5-3. 使用循环输出 1 到 20 之间的所有偶数。

    5-4. 使用循环输出字符串中的每个字符。

    5-5. 使用循环反转一个字符串。


    # 中级练习


    ### 第 6 节：数组

    6-1. 创建一个颜色数组。在数组的开头和结尾各添加一种颜色。

    6-2. 删除数组中的第一种颜色。

    6-3. 查找数组中某种颜色的索引。

    6-4. 使用循环输出数组中的每种颜色。

    6-5. 使用`.map()`方法创建一个新数组，其中每种颜色都转换为大写。


    ### 第 7 节：函数

    7-1. 编写一个函数，返回两个数的和。

    7-2. 编写一个函数，判断一个数是否为质数。

    7-3. 创建一个函数，返回一个数的阶乘。

    7-4. 编写一个函数，接受一个字符串并返回其反转版本。

    7-5. 编写一个函数，接受一个数组并返回其中最大的数。


    ### 第 8 节：对象

    8-1. 创建一个`car`对象，包含属性：`make`、`model`和`year`。

    8-2. 为`car`对象添加一个方法，在控制台输出"Vroom Vroom"。

    8-3. 使用方括号表示法访问并输出`car`对象的一个属性。

    8-4. 为`car`对象添加一个属性`isRunning`，并设置为`false`。

    8-5. 编写一个函数，接受一个对象和一个属性名，检查该对象是否拥有该属性。


    ### 第 9 节：DOM 操作

    （需要在浏览器环境中运行）

    9-1. 通过 ID 选择一个元素，并更改其文本内容。

    9-2. 为一个元素添加一个类。

    9-3. 当元素被点击时，切换其上的一个类。

    9-4. 创建一个新的`div`元素，并将其附加到`body`中。

    9-5. 当元素被点击时，从 DOM 中移除该元素。


    ### 第 10 节：事件与监听器

    （需要在浏览器环境中运行）

    10-1. 当按钮被点击时，输出一条消息。

    10-2. 当鼠标悬停在`div`上时，更改其背景颜色。

    10-3. 当按钮被点击时，输出文本输入字段的值。

    10-4. 阻止表单提交，并输出其`action`属性。

    10-5. 在输入字段的`keydown`事件中，输出按下的键。


    ## 初级 1 - 解答


    ```javascript

    // 1-1: Declare a variable age and assign your age to it. Log its value.

    let age = 25;

    console.log(age);


    // 1-2: Declare a variable isStudent and assign a boolean value. Log its type
    using typeof.

    let isStudent = true;

