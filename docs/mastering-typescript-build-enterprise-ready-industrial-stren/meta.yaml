    \ string) {\n  if(typeof(target) === 'function') {\n    console.log(`name: ${target.name}`);\n\
    \  } else {\n    console.log(`class name: ${target.constructor.name}`);\n    console.log(`property:\
    \ ${propertyKey}`);\n  }\n}\n```\n\nHere, we are checking the type of the target\
    \ argument. If the typeof(target) call\nreturns 'function', then we know that\
    \ the argument is the class constructor, and\nthen identify the class name via\
    \ target.name. If the typeof(target) does\nreturn 'function', then we know that\
    \ the target argument is an object prototype,\nand that you need to identify the\
