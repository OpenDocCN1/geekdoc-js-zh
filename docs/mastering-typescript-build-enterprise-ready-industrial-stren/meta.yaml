    \ file, with a single JSON property compilerOptions, which specifies options for\
    \ the project. The target property indicates the preferred JavaScript output to\
    \ generate, and can be either es3, es5, es6, ES2016, ES2017, or ESNext. The option\
    \ name sourceMap is a flag indicating whether to generate source maps that are\
    \ for debugging. The implicitAny option is a flag indicating that we must attempt\
    \ to strongly type all variables before.\n\n![](bbox=[0.136, 0.427, 0.19, 0.483])\n\
    \nTypeScript allows for multiple tsconfig.json files within a directory structure.\
    \ This allows sub directories to use different compiler options.\n\nWith our tsconfig.json\
