    \ up as you work with interfaces. This is because your editor is using TypeScript's\
    \ language service to automatically pick up what you are working with, and what\
    \ properties and functions are available, as follows:\n\n```\n```typescript\n\
    // hello properties\n20 // Optional properties\n21 interface IOptProp {\n22  \
    \ id: number;\n23   name: string;\n24 }\n25 \n26 var id: IOptProp = { id: 1 };\n\
    27 var idAndName: IOptProp = { id: 2, name: \"idAndName\" };\n28 idAndName = id;\n\
    29 \n30 \t name (property) IOptProp.name: string\n```\n```\n\n# # Interface compilation\n\
    \nInterfaces are a compile-time feature of TypeScript, and the compiler does not\
    \ generate any JavaScript code from interfaces that you include in your TypeScript\
    \ projects. Interfaces are only used by the compiler for type checking during\
    \ the compilation step.\n\n> In this book, we will be sticking to a simple naming\
    \ convention for interfaces, which is to prefix the interface name with the letter\
    \ I. Using this naming scheme helps when dealing with large projects where code\
    \ is spread across multiple files. Seeing anything prefixed with I in your code\
    \ helps you distinguish it as an interface immediately. You can, however, call\
    \ your interfaces anything."
