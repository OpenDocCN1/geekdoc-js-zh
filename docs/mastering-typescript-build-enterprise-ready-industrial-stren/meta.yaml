- img_proc: false
  md: 'Even if you are using Visual Studio and NuGet as a development environment,
    you may want to explore using Typings in your project instead of NuGet for definition
    files. Remember that not all definition files are available via Typings. Also,
    NuGet is a separate code repository, so it may take some time for package authors
    to update their definition files.


    # Using Bower


    Typings is used to download and manage TypeScript definition files, Bower is used
    to download and manage the JavaScript libraries themselves. The Bower command-line
    interface and overall functionality is very similar to Typings. Bower will also
    ensure that any dependencies a library has will downloaded with the correct versions.
    As an example, let''s use Bower to download the backbone.js library and its only
    dependency, underscore.js.


    Installation of Bower is the standard npm installation command, as follows:


    +   - npm install -g bower


    Typings and Bower have a very similar command set; in fact the Typings command
    set was modeled after packages like Bower. We can use the same workflow for initializing,
    searching, and installing JavaScript packages as we did with Typings, as follows:


    +   - bower init


    This will ask a couple of questions about the current project, and then create
    a bower.json file to store installed packages and dependencies:


    +   - bower search backbone


    This will search for Backbone libraries, similar to how Typings does:


    +   - bower install backbone --save


    This will install backbone.js and its dependencies (underscore.js), and save the
    dependencies list to the bower.json file.


    Looking at the directory that Bower creates, you will notice that all libraries
    are downloaded by default to /bower_components. Each package then has its directory,
    for example, Backbone and Underscore, and within each directory are the released
    JavaScript files. You will notice that Bower will download and install both the
    development versions and the minified versions all in one go.'
  merge: -1
  pgno: 208
