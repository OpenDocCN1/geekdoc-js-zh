  md: "# Protected class members\n\nWhen inheritance, it is sometimes logical to mark\
    \ certain functions and properties as accessible only within the class itself,\
    \ or accessible to any class that is derived from it. Using the private keyword,\
    \ however will not work in this instance, as a private class member is hidden\
    \ from derived classes. TypeScript introduces the protected keyword for these\
    \ situations. Consider the following two classes:\n\n```\nclass ClassUsingProtected\
    \ {\n  protected id : number;\n  public getId() {\n    return this.id;\n  }\n\
    }\n\nclass DerivedFromProtected extends\nClassUsingProtected {\n  constructor()\
    \ {\n    super();\n    this.id = 0;\n  }\n}\n```\n\nWe start with a class named\
    \ ClassWithProtected, which has an id property that is marked as protected, and\
    \ a public function getId. Our next class, DerivedFromProtected inherits from\
    \ ClassUsingProtected, and has a single constructor function. Note, within this\
    \ constructor, that we are calling this.id = 0, in order to set the protected\
    \ id property to 0. Again, a derived class has access to protected member variables.\
    \ Now let's try to access this id property out of the class, follows:\n\n```\n\
    var derivedFromProtected = new DerivedFromProtected();\nderivedFromProtected.getId();\n\
    console.log(`${derivedFromProtected.getId()}`);`\n```\n\nHere, we create an instance\
    \ of the DerivedFromProtected class, and attempt to assign a value to its protected\
    \ id. The compiler will generate the following error message:\n\n```\nerror TS2445:\
    \ Property 'id' is protected and only accessible within class 'ClassUsingProtected'\
    \ and its subclasses.\n```\n\nSo this id is acting like a private property outside\
    \ of the class ClassUsingProtected, but still allows access to it within the class,\
    \ and any class derived from it."
  merge: -1
