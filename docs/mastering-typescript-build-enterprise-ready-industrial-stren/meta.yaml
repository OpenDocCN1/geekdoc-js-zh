- img_proc: false
  md: 'The Marionette framework was built on top of Backbone in order to simplify
    and remove a lot of this repetitive code, and to introduce new concepts that were
    helpful when building web applications. Marionette is extremely fast, as it adds
    a thin layer of functionality across the top of Backbone, while still using the
    underlying Backbone library.


    # Rendering performance


    If page rendering performance, CPU cycles, and RAM are critical factors in your
    applications, then you cannot go past Backbone for pure rendering speed.


    In a recent project, our team was involved in speed testing Marionette and Backbone
    applications to determine if they were suitable on embedded devices. These embedded
    devices with 400-600MHz CPUs, and 128-256MB RAM. In comparison to a modern desktop,
    with a 3.6GHz CPU and 8GB of RAM, these are tiny machines indeed. This test application
    rendered a series of three HTML screens, each with varying complexity. The first
    page was a very simple page, the second had a variable menu structure, and the
    third had a rather complex, detailed informational view of some data. All code
    was written in TypeScript.


    The processors and RAM available on each device were as follows:


    +   - 400MHz ARM9 with 128MB RAM

    - 400Mhz PowerPC with 256Mb RAM

    - 624Mhz Marvell PXA300 256MB RAM

    - 6Ghz Marvel Core i7 8GB RAM (desktop)


    This test application ran a high-resolution timer, and sent messages via websockets
    to the HTML page. The timer started when a message was sent from the timing application
    to the web page. Once a message was received inside the web application, it decided
    which page to display. The page display mechanism used the Model View Controller
    pattern to render HTML to the browser. Once the HTML had been rendered to the
    screen, a message was sent back to the timing application to stop the clock. In
    this way, millisecond timing could be obtained to determine how long it took to
    render HTML on each of these devices.'
