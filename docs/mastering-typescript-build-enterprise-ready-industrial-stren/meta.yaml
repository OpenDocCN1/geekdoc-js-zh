  md: "What this output is showing is that the await keyword is actually waiting for\
    \ the asynchronous function to be called before continuing on the program execution.\
    \ This produces an easy to read, and easy to follow flow of program logic by automatically\
    \ pausing execution until the promise is fulfilled.\n\n# Await errors\n\nOur promise\
    \ generally define both a success condition as well as an error condition when\
    \ calling asynchronous functions. In order to trap these error conditions when\
    \ using async syntax, we can use a try...catch block. To illustrate this, let's\
    \ define a promise that returns an error, as well as an error message, as:\n\n\
    ```\nfunction awaitError() : Promise<string> {\n  return new Promise<string> =>\
    \ void {\n    resolve: (message: string) => void,\n    reject: (error: string)\
    \ => void ) => {\n      function afterWait() {\n        console.log(`calling reject`);\n\
    \        reject(`an error occurred`);\n      }\n      setTimeout(afterWait, 1000);\n\
    \    }\n  };\n}\n```\n\nWe have a function named awaitError that is defining and\
    \ returning a Promise<string>, and is using our standard promise syntax with the\
    \ second delay. The line to note here is inside the afterWait function, where\
    \ we are calling the reject promise callback with an error message. Our corresponding\
    \ async await function is as follows:\n\n```\nasync function callAwaitError()\
    \ {\n  console.log(`callAwaitError`);\n  try {\n    await awaitError();\n  } catch\
    \ (error) {\n    console.log(`error returned : ${error}`);\n  }\n  console.log(`after\
    \ awaitDelayed`);\n}\n\n  callAwaitError();\n```"
