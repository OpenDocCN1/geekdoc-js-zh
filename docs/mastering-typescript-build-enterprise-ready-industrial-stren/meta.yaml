    # Installing VSCode


    VSCode can be installed on Windows by simply downloading and running the installer.
    On Linux systems, VSCode is provided as a .deb package, an .rpm package, or a
    binary tar file. Under Mac, download the .zip file, unzip it, and then copy the
    Visual Studio Code.app file to your applications folder.


    # Exploring VSCode


    Create a new directory to hold your source code and fire up VSCode. This can be
    done by navigating to the directory and executing code from the command line.
    On Windows systems, use VSCode, and select File | Open folder from the menu bar.
    Hit Ctrl–N to create a new file, and type the following:


    ```

    console.log("hello vscode");

    ```


    Note that there is no syntax highlighting at this stage, as VSCode does not know
    what type of file it is working with. Hit Ctrl–S to save the file, and name it
    hello.ts. Now that VSCode understands this to be a TypeScript file, you will have
    full IntellSense and syntax highlighting available.


    # Creating a tasks.json file


    The keyboard shortcut to build a project in VSCode is Ctrl–Shift–B. If we try
    to build the project at this stage, VSCode will show a message—No task runner
    configured, and give us the option to Configure Task Runner. We can then select
    which of task runner we would like to configure, including Grunt, Gulp, and a
    number of other options. Selecting one of these options will automatically create
    a tasks.json file for us in the .vscode directory, and open it for editing.


    As an example of this let''s select the TypeScript – tsconfig.json option. We
    will make a single change to the generated tsconfig.json file, and set the value
    of "showOutput" option to "always", instead of "silent". This will force VSCode
    to open an output window whenever it sees compilation issues.'
