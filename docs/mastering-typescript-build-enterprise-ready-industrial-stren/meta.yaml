  md: "# Decorators, Generics, and Asynchronous Features\n\n```\nfunction callDelayedAndWait()\
    \ {\n  function afterWait() {\n    console.log(`afterWait`);\n  }\n  console.log(`calling\
    \ delayedResponseWithCallback`);\n  delayedResponseWithCallback(afterWait);\n\
    \  console.log(`after calling delayedResponseWithCallback`);\n}\n\ncallDelayedAndWait();\n\
    ```\n\nWe start with a function named delayedResponseWithCallback that takes a\
    \ single argument of type Function, named callback. If we consider the last line\
    \ of this function, it is an asynchronous function, within our code. The settimeout\
    \ with 1000 millisecond or one second delay. This is to simulate a delay in processing,\
    \ and we see that it is logging a message to the console, within our code. The\
    \ setTimeout takes a function as its first parameter, which will be called after\
    \ the second delay. In this case, we are calling the function named delayedsetTimeout,\
    \ which simply logs a message to the console, and then calls our callback function.\n\
    \nThe second function in this code snippet calls callDelayedAndWait. If we take\
    \ at the last three lines of this function, we see that it is logging a message\
    \ to the console, and then calling our delayedResponseWithCallback function. It\
    \ is passing the afterWait as the callback function. The last line of the code\
    \ executes callDelayedAndWait function. The output of this code is as follows:\n\
    \n+   calling delayedResponseWithCallback\nafter calling delayedResponseWithCallback\n\
    delayedAfterTimeout\nafterWait\n\nWhat we can see from the output is the sequence\
    \ of events that is happening in our code. When we execute the callDelayedAndWait\
    \ function, it sets up a callback function, and logs the text \"calling delayedResponseWithCallback\"\
    \ to the console. It invokes the delayedResponseWithCallback function, and then\
    \ continues to the next line, where it logs the text \"after calling delayedResponseWithCallback\"\
    . After a second delay, the function delayedTimeout is invoked to the console,\
    \ and finally the afterWait function is invoked, logging the text \"afterWait\"\
    \ to the console.\n\n[ 146 ]"
