    # # Summary


    In this chapter, we explored the object-oriented concepts of interfaces, classes,
    and inheritance. We discussed both interface inheritance and class inheritance,
    and used our knowledge of interfaces, classes, and inheritance to create a Factory
    Design Pattern implementation in TypeScript. In the next chapter, we will look
