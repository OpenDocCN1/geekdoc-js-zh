  md: "# JavaScript closures\n\nBefore we continue with this chapter, let's take a\
    \ quick look at how TypeScript implements classes in generated JavaScript through\
    \ a technique called closures. As we mentioned in Chapter 1, TypeScript – Tools\
    \ and Framework Options, a closure is a function that refers to independent variables.\
    \ These variables essentially remember the environment in which they were created.\
    \ Consider the following JavaScript code:\n\n```\nfunction TestClosure() {\n \
    \ this._value = value;\n  function printValue() {\n    console.log(this._value);\n\
    \  }\n  return printValue();\nn\n```\n\n```\nvar myClosure = TestClosure(12);\n\
    myClosure;\n```\n\nHere, we have a function named TestClosure, which takes a single\
    \ parameter named value. The body of the function first assigns the value to an\
    \ inner property named this._value, and then defines an inner function printValue.\
    \ The printValue function simply logs the value of this._value to the console.\
    \ The interesting bit is the last line in the TestClosure function–we are returning\
    \ the printValue function.\n\nNow take a look at the last two lines of the code\
    \ snippet. We create a variable named myClosure and assign to it the result of\
    \ calling the printValue function from inside the TestClosure function. Note that,\
    \ because we are returning the printValue function from inside the TestClosure\
    \ function, this essentially makes the myClosure a variable. When we execute the\
    \ function on the last line of the snippet, it will execute the inner printValue\
    \ function, but remember the initial value of 12 that was used when creating the\
    \ myClosure variable. The output of the last line of code will log the value 12\
    \ to the console.\n\nThis is the essential nature of closures. A closure is a\
    \ special kind of JavaScript object that combines with the initial environment\
    \ in which it was created. In our preceding sample, since we stored whatever was\
    \ passed in via the value argument into a local variable named this._value, JavaScript\
    \ remembers the environment in which the closure was created, in other words,\
    \ whatever was assigned to the this._value property at the time of creation will\
    \ be remembered, and can be reused."
