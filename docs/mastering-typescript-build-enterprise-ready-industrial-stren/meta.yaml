  md: "# Types, Variables, and Function Techniques\n\nHere, we have defined a function\
    \ concatStrings that takes three parameters, a, b, and c, and returns the sum\
    \ of these values. We are then calling this function with three arguments, assigning\
    \ the result to the variable concatAbc. As can be seen from the output, it returns\
    \ the string \"abc\". If, however, we provide only two arguments, it returns the\
    \ string with use of the variable concatAb, which returns the string \"undefined\"\
    . In JavaScript, if we call a function and do not provide a parameter, the missing\
    \ parameter is undefined, in which this is the parameter c.\n\nTypeScript introduces\
    \ the question mark to indicate optional parameters. This allows us to mimic the\
    \ JavaScript calling syntax where we can call the same function with some missing\
    \ arguments. As an example of this, consider the following TypeScript code:\n\n\
    ```\nfunction concatStrings(a: string, b: string, c?: string) {\n  return a +\
    \ b + c;\n}\nvar concat3strings = concatStrings(\"a\", \"b\", \"c\");\nconsole.log(`concat3strings`);\n\
    var concat2strings = concatStrings(\"a\", \"b\");\nconsole.log(`concat2strings`);\n\
    var concat1strings = concatStrings(\"a\");\n```\n\nThis is a strongly typed version\
    \ of the concatStrings JavaScript function that we were using previously. Note\
    \ the addition of the ? character in the syntax for the third parameter: c7?:\
    \ string. This indicates that the third parameter is optional, and therefore,\
    \ all of the above code will compile cleanly, except for the last line. The last\
    \ line will generate an error.\n\nerror TS2081: Build: Supplied parameters do\
    \ not match any signature of call target.\n\nThis error is generated because we\
    \ are attempting to call the concatStrings function with only a single parameter.\
    \ Our function definition, though, requires at least two parameters, with only\
    \ the third parameter being optional.\n\n+   Optional parameters must be the last\
    \ parameters defined in the function definition. You can have as many optional\
    \ parameters as you want, as long as non-optional parameters precede the optional\
