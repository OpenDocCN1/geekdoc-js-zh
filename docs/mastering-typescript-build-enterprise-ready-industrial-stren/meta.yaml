  md: "# React setup\n\nThe process that React uses to generate JavaScript from JSX\
    \ files creates an extra step in the normal development workflow. Our TypeScript\
    \ .tsx files, once compiled, will generate JavaScript files that are interspersed\
    \ with JSX syntax. Once these files have been created, they need to pass through\
    \ the JX interpreter to generate standard JavaScript files. For reason, it is\
    \ recommended to use a bundling tool such as Webpack to perform this extra compilation\
    \ step. Using Webpack will also combine our compiled .tsx files with the React\
    \ libraries correctly.\n\nTo start a new project, we will follow a few steps,\
    \ as follows:\n\n```\nnpm init\n```\n\nThe preceding command initiates npm for\
    \ our project.\n\n```\nnpm install -g webpack\n```\n\nThis installs webpack as\
    \ a global Node module.\n\n```\nnpm install --save react react-dom\n```\n\nThis\
    \ installs the react and react-dom libraries (instead instead of using bower).\n\
    \n```\nnpm install --save-dev ts-loader source-map-loader\n```\n\nThis installs\
    \ the ts-loader and source-map-loader Node modules.\n\n```\nnpm link typescript\n\
    ```\n\nThis links our global installation of typescript for use by webpack.\n\n\
    Once these steps are complete, we can install the React declaration files via\
    \ the @types syntax as follows:\n\n```\nnpm install @types/react --save\nnpm install\
    \ @types/react-dom --save\n```\n\nWe can now create a tsconfig.json file using\
    \ --init, and then modify it slightly as follows:\n\n```\n{\n  \"compilerOptions\"\
    : {\n    \"outDir\": \"./dist\",\n    \"module\": \"commonjs\",\n    \"target\"\
    : \"es5\",\n    \"noImplicitAny\": true,\n```"
