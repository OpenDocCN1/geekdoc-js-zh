  md: "# Decorators, Generics, and Asynchronous Features\n\nLet's then update this\
    \ decorator, as follows:\n\n```\nfunction constructorDec(constructor: Function)\
    \ {\n  console.log(`constructor : ${constructor}\\`);\n  console.log(`constructor.name\
    \ : ${(any)constructor).name}`);\n  constructor.prototype.testProperty = \"testProperty_value\"\
    ;\n}\n```\n\nHere, we have updated our classConstructorDec with two new lines\
    \ of code. The first new line prints the name property of the constructor function\
    \ to the console. Note how we had to cast the constructor parameter to a type\
    \ of any in order to successfully access the name property of a function is only\
    \ available from ECMAScript 6, and is only partially available in earlier browsers.\n\
    \nThe last line of this decorator is actually modifying the class prototype, and\
    \ adding a property named testProperty (with the value \"testProperty_value\"\
    ) to the class definition. This is an example of how decorators can be used to\
    \ modify a class definition. We can then access this property, as follows:\n\n\
    ```\nlet classConstrInstance = new ClassWithConstructor();\nconsole.log(`classConstrInstance.testProperty\
    \ : `\n+ `${(any)classConstrInstance.testProperty}``);\n```\n\nHere, we are creating\
    \ an instance of the ClassWithConstructor class, named classConstrInstance. We\
    \ are then logging the value of the testProperty property to the console. Note\
    \ how we need to cast the type of the variable classConstrInstance to any in order\
    \ to access the testProperty property. This is because we have not defined the\
    \ testProperty property on the class definition itself, but by injecting this\
    \ property via the decorator. The output of this code would be as follows:\n\n\
    ```\nconstructor : function ClassWithConstructor() {\n}\nconstructor.name : ClassWithConstructor\n\
    classConstrInstance.testProperty : testProperty_value\n```\n\nThis output shows\
    \ that we can use the name property of the class constructor to find the name\
    \ of the class itself. We can also inject a class property, named testProperty,\
    \ into the class definition. As can be seen by the output, the value of this testProperty\
    \ property is \"testProperty_value\", which is being set within the decorator\
    \ function."
