  md: "# Types, Variables, and Function Techniques\n\nThe last line of this code snippet\
    \ again logs the value of the lValue variable to the console, but this time lValue\
    \ is outside the if statement block-scope. The output of this code is as follows:\n\
    \n```\nlValue = 2\nblock scoped lValue : 2001\nlValue = 2\n```\n\nWhat these results\
    \ are showing us is that the let variables are confined to the scope in they are\
    \ defined. In other words, the let lValue = 2001; statement defines a new variable\
    \ that will only be visible inside the if statement block of code. As it is a\
    \ new variable, it will also not influence the value of the lVariable that is\
    \ outside its scope. This is why the value of lValue is 2 both before and after\
    \ the if statement block, and 2001 within it.\n\nThe let statement, therefore,\
    \ provides us with a safer way of declaring variables, limiting their validity\
    \ to the current scope.\n\n# Functions\n\nSo far, we have seen how to add type\
    \ annotations to variables, and have also seen how this syntax is easily extended\
    \ to function parameters. There are, however, a few more typing rules that TypeScript\
    \ uses when it comes to functions.\n\n# Function return types\n\nUsing the very\
    \ simple “syntactic sugar” TypeScript syntax, we can also define the type of a\
    \ variable that a function should return. In other words, when we call a function,\
    \ and it returns a value, what type should the value be treated as ?\n\nConsider\
    \ the following TypeScript code:\n\n```\nfunction addNumbers(a: number, b: number)\
    \ : string {\n  return a + b;\n}\nvar addResult = addNumbers(2,3);\nconsole.log(`addNumbers\
    \ returned \\${addResult}\\`);\n```"
