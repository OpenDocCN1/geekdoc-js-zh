  md: "# Interfaces, Classes, and Inheritance\n\nThis interface definition includes\
    \ the id and name properties and a print function. We then have a function signature\
    \ for the usingAnyKeyword function. It looks surprisingly like our actual class\
    \ function, but does not have a function body. The usingOptionalParameters function\
    \ shows how to use an optional parameter within an interface. The interface definition\
    \ for the usingDefaultParameters function, is slightly different from our class\
    \ definition. Remember that an interface defines the shape of our class or object,\
    \ and therefore cannot contain variables or values. We have defined up the defaultArg1\
    \ parameter as optional, and the assignment of the default value to the class\
    \ implementation itself. The definition of the usingRestSyntax function contains\
    \ the rest parameter syntax, and the definition of the usingFunctionCallbacks\
    \ function, shows how to define a callback function signature. They are pretty\
    \ much identical to the class function signatures.\n\n\nThe only thing missing\
    \ from this interface is the signature for the constructor function. Interfaces\
    \ include signatures for a constructor function.\n\nLet's take a look at what\
    \ causes errors in our compilation step. Suppose we were to include a definition\
    \ for the constructor function in the IComplexType interface:\n\n```\ninterface\
    \ IComplexType {\n    constructor(arg1: any, arg2: any);\n}\n```\n\nThe TypeScript\
    \ compiler would then generate an error:\n\n```\nerror TS2420: Class 'ComplexType'\
    \ incorrectly implements\ninterface 'IComplexType'\nTypes of property 'constructor'\
    \ are incompatible.\n```\n\nThis error shows when we use a constructor function,\
    \ the return type of the constructor is implicitly typed by the TypeScript compiler.\
    \ Therefore, the return type of the IComplexType constructor would be IComplexType,\
    \ and the return type of the ComplexType constructor would be ComplexType. Even\
    \ though the ComplexType function implements the IComplexType interface, they\
    \ are actually two different types. Therefore, the constructor signatures will\
    \ always be incompatible.\n\n# Class modifiers\n\nAs we discussed briefly in the\
    \ opening chapter, TypeScript introduces the public and private access modifiers\
    \ to mark class variables and functions as either public or private. Additionally,\
    \ we can also use the protected access modifier, which we will discuss later.\n\
    \n[ 93 ]"
  merge: -1
