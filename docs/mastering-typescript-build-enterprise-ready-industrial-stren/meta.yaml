    `);\n\nunionType = \"test\";\nconsole.log(`unionType: ${unionType}\\`);\n```\n\
    \nHere, we have defined a variable name unionType, which uses the union syntax\
    \ to denote that it can hold either a string or a number. We are assigning a number\
    \ to this variable, and logging its value to the console. We then assign a string\
    \ to this variable, and again log its value to the console. This code snippet\
    \ will output the following:\n\n+   - unionType : 1\n- unionType : test\n\n# Type\
    \ guards\n\nWhen working with union types, the compiler will still apply its strong\
    \ typing rules to ensure that we are not mixing and matching our types. As an\
    \ example of this, consider the following code:\n\n```\nfunction addWithUnion(\n\
    \  arg1 : string | number,\n  arg2 : string | number\n) {\n  return arg1 + arg2;\n\
