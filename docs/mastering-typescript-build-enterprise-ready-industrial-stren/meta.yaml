  md: "# TypeScript Compatible Frameworks\n\n+   - Views can contain other views in\
    \ a nested fashion, enhancing reuse\n- Changes in behavior of a component can\
    \ be made without changing its visual representation (by changing the Controller\
    \ and not the View)\n- Rapid and parallel development\n- Testability of individual\
    \ components\n\n# Sample application outline\n\nTo enable comparison of our various\
    \ TypeScript frameworks, we will build the same application using each framework,\
    \ which will accomplish the following:\n\n+   - Use a view to display a model\
    \ property\n- Construct an array of data, with each array item being a single\
    \ model instance\n- Loop through the array and render each item in a list element\n\
    - Respond to a click event on each item rendered\n- Display the model properties\
    \ that were used to render it\n\nWe use the same dataset for our array in each\
    \ of the four sample applications. This dataset is as follows:\n\n```\ninterface\
    \ IClickItem {\n  DisplayName: string;\n  Id: number;\n}\n\nlet ClickableItemCollection\
    \ : IClickItem[] = [\n  { Id: 1, DisplayName: \"firstItem\"},\n  { Id: 2, DisplayName:\
    \ \"secondItem\"},\n  { Id: 3, DisplayName: \"thirdItem\"}\n];\n```\n\nWe start\
    \ with an interface IClickableItem that has an Id property of type number, and\
    \ a DisplayName property of type string. We then define an array of IClickableItem\
    \ objects, named ClickableItemCollection. The reason for using such an array is\
    \ that it is a very common structure to work with when fetching data from a REST\
    \ endpoint that returns JSON. If we interpret a simple array like this, then we\
    \ can easily substitute this array with JSON data later on."
  merge: -1
  pgno: 232
