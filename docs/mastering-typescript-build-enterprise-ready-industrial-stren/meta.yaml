  md: "# Interface inheritance\n\nAs an example of interface inheritance, consider\
    \ the following TypeScript code:\n\n```\ninterface IBase {\n  id: number;\n}\n\
    \ninterface IDDerivedFromBase extends IBase {\n  name: string;\n}\n\nclass InterfaceInheritanceClass\
    \ implements IDDerivedFromBase {\n  id: number;\n  name: string;\n}\n```\n\nWe\
    \ start with an interface IBase that defines an id property, of type number. Our\
    \ second interface definition, IDDerivedFromBase, extends (or inherits from) IBase,\
    \ and therefore automatically includes the id property. The IDDerivedFromBase\
    \ interface inherits from IBase, it therefore actually has two properties—id and\
    \ name. We then have a class definition, named InterfaceInheritanceClass which\
    \ implements this IDDerivedFromBase interface. IDDerivedFromBase interface. This\
    \ class must, therefore, define both an id and a name property, in order to successfully\
    \ implement all of the properties of the IDDerivedFromBase interface. Although\
    \ we have only shown properties in this example, the same rules apply for functions.\n\
    \n# Class inheritance\n\nClasses can also use inheritance in the same manner as\
    \ interfaces. Using our definitions of the IBase and IDDerivedFromBase interfaces,\
    \ the following code shows an example of class inheritance:\n\n```\nclass BaseClass\
    \ implements IBase {\n  id: number;\n}\n\nclass DerivedFromBaseClass extends BaseClass\n\
    implements IDDerivedFromBase {\n  name: string;\n}\n```"
  merge: -1
  pgno: 121
- img_proc: false
  md: "Interfaces, Classes, and Inheritance\n\nThe first class, named BaseClass, implements\
    \ the IBase interface, and as such, is only required to define a property of id,\
    \ of type number. The second class, DerivedFromBaseClass, inherits from the BaseClass\
    \ class (using the extends keyword), but also implements the DerivedFromBase interface.\
    \ As BaseClass already defines the id property required in the DerivedFromBase\
    \ interface, the only other property that the DerivedFromBaseClass needs to implement\
    \ is the name property. Therefore, we only need to include the definition of the\
    \ name property in the DerivedFromBaseClass class.\n\nTypeScript does not support\
    \ the concept of multiple inheritance. Multiple inheritance means that a single\
    \ class can be derived from multiple base classes. TypeScript supports only single\
    \ inheritance and therefore any class can only have a single base class. A class\
    \ can, however, implement multiple interfaces, as follows:\n\n```\ninterface IFirstInterface\
    \ {\n  id: number;\n}\ninterface ISecondInterface {\n  name: string;\n}\nclass\
    \ MultipleInterfaces implements IFirstInterface, ISecondInterface {\n  id: number;\n\
    \  name: string;\n}\n```\n\nWe have defined two interfaces named IFirstInterface\
    \ and ISecondInterface. We then have a class named MultipleInterfaces that implements\
    \ IFirstInterface and ISecondInterface. This means that it must implement an id\
    \ property to satisfy the IFirstInterface interface, and it must implement a name\
    \ property to satisfy the ISecondInterface interface.\n\n# The super keyword\n\
    \nWhen using inheritance, both a base class and a derived class may have the same\
    \ function name. If a base class has a defined constructor, then the derived class\
    \ may need to call through to the base class constructor and pass through some\
    \ arguments. This technique is called constructor overloading. In other words,\
    \ the constructor of a derived class overloads, or supersedes, the constructor\
    \ of the base class."
  merge: -1
