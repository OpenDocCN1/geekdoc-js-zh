    \ of the toString within our class, as follows:\n\n```\nclass MyClass {\n    private\
    \ _name: string;\n    constructor(arg1: number) {\n        this._name = arg1 +\
    \ \"MyClass\";\n    }\n    toString(): string {\n        return this._name;\n\
    \    }\n}\n```\n\nWe, replaced the default toString function that all JavaScript\
    \ objects inherit with our own implementation. Within this function, we simply\
    \ returned the value of the _name private variable. Running this sample now produces\
    \ the expected result:\n\n+   - 1_MyClass, 2_MyClass, 3_MyClass\n\n# Constraining\
    \ the type of T\n\nWhen using generics, it is sometimes desirable to constrain\
    \ the type of T to be only a specific type, or subset of types. In these cases,\
    \ we don't want our generic code to be available for any type of object, we only\
    \ want it to be available for a specific subset of objects. Type uses inheritance\
    \ to accomplish this generics.\n\nAs an example, let's define an interface for\
