  md: "# Types, Variables, and Function Techniques\n\nHere, we start with a named\
    \ variable callbackFunction, which is a function that takes a single parameter.\
    \ This callbackFunction simply logs the text argument to the console.\nWe define\
    \ a function doSomethingWithCallback that takes two parameters – initialText and\
    \ callback. The first line of this function simply logs \"insideSomethingWithCallback\
    \ is the interesting bit. It assumes that the callback argument is in a function,\
    \ and invokes it, passing in the initialText variable. If we\nthis code, we get\
    \ two messages logged to the console, as follows:\n\n```\ninside doSomethingWithCallback\
    \ myText\ninside callbackFunction myText\n```\n\nBut what happens if we do not\
    \ pass a function as a callback? The code that signals to us that the second parameter\
    \ of doSomethingWithCallback must be a function. If we inadvertently call the\
    \ doSomethingWithCallback function with two strings, as shown below:\n\n```\n\
    doSomethingWithCallback('myText', 'anotherText');\n```\n\nWe get a JavaScript\
    \ runtime error:\n\n```\nTypeError: callback is not a function\n```\n\nDefensively\
    \ minded programmers, however, would first check whether the callback parameter\
    \ was in a function before invoking it, as follows:\n\n```\nfunction doSomethingWithCallback(\
