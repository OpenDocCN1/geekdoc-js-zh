  md: "Decorators, Generics, and Asynchronous Features\n\n# Returning values from\
    \ promises\n\nSo far, we have defined all of our promise objects as Promise<void>.\
    \ The void in this case indicates that our promises will not return any values.\
    \ If we use Promise<string>, this indicates that our promises will return string\
    \ values. Let's take a look at how to return values from promises, as follows:\n\
    \n```\nfunction delayedPromiseWithParam() : Promise<string> {\n  return new Promise<string>(n\
    \    resolve(str: string) => void,\n    reject(str: string ) => void\n  ) {\n\
    \    function afterWait() {\n      resolve(`resolved_within_promise`);\n    }\n\
    \    setTimeout( afterWait, 2000);\n  }\n};\n```\n\nWe have a function named delayedPromiseWithParam\
    \ that constructs and returns our promise object as usual. However, the definition\
    \ of both the resolve callback function and the reject callback functions now\
    \ take a single string argument. This string argument ties the generic type that\
    \ has been defined for this promise, that is, Promise<string>. If we wanted to\
    \ use a number type for our resolve and reject arguments, we would need to define\
    \ our return type as Promise<number>.\n\nThe inner workings of the anonymous function\
    \ are similar to what we have discussed before, with the exception that the call\
    \ to resolve now includes a string as an argument.\n\nLet's take a look at how\
    \ this return value can be used, as follows:\n\n```\nfunction callPromiseWithParam()\
    \ {\n  console.log(`calling delayedPromiseWithParam`);\n  delayedPromiseWithParam().then((message:\
    \ string) => {\n    console.log(`Promise.then() returned ${message}\\`);\n  });\n\
    }\n\ncallPromiseWithParam();\n```\n\n[ 151 ]"
