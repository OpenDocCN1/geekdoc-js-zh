  md: "# Interfaces, Classes, and Inheritance\n\n```\nconstructor(idArg: any, nameArg:\
    \ any) {\n  if (typeof idArg === \"number\") {\n    this.id = idArg;\n  }\n  //\
    \ careful assigning a string to a number\n  this.name = nameArg;\n}\n```\n\nHere,\
    \ we have introduced a type guard to ensure that the id property (which is of\
    \ type number) is only assigned if the type of the idArg parameter is, in fact,\
    \ a number.\n\nLet's take a look at the rest of the function definitions that\
    \ we have defined for the class, starting with the usingTheAnyKeyword function:\n\
    \n```\nct_1.usingTheAnyKeyword(true);\nct_1.usingTheAnyKeyword({id: 1, name: \"\
    string\"});\n```\n\nThe first call in this sample is using a boolean value to\
    \ call the usingTheAnyKeyword function, and the second is using an arbitrary object.\
    \ Both of these calls are valid, as the parameter arg1 is defined with the any\
    \ type.\n\nNext, the usingOptionalParameters function:\n\n```\nct_1.usingOptionalParameters(1);\n\
    ct_1.usingOptionalParameters();\n```\n\nHere, we are calling the usingOptionalParameters\
    \ function firstly with a single argument, and without any arguments. Again, these\
    \ calls are valid, as the optionalArg1 is marked as optional.\n\nNow for the usingDefaultParameters\
    \ function:\n\n```\nct_1.usingDefaultParameters(2);\nct_1.usingDefaultParameters();\n\
    ```\n\nBoth of these calls to the usingDefaultParameters function are valid. The\
    \ first call will override the default value of 0, and the second—without an argument—will\
    \ use the default value of 0.\n\nNext is up the usingRestSyntax function:\n\n\
    ```\nct_1.usingRestSyntax(1,2, 3);\nct_2.usingRestSyntax(1,2,3,4, 5);\n```"
