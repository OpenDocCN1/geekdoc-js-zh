  md: "# Decorators, Generics, and Asynchronous Features\n\nWe, we have defined an\
    \ enum ClubCountry to indicate where the home country is for a football club.\
    \ Our FootballClub interface then defines two methods that any FootballClub class\
    \ must implement-getName function to return the name of the football club, and\
    \ a getHomeCountry function to return the ClubCountry value.\n\nWe will now define\
    \ an abstract base class to implement this interface, as follows:\n\n```\nabstract\
    \ class FootballClub implements IFootballClub {\n    protected _name: string;\n\
    \    protected _homeCountry: ClubCountry;\n    getName() { return this._name };\n\
    \    getHomeCountry() { return this._homeCountry; };\n}\n```\n\nThis class, named\
    \ FootballClub implements the IFootball interface, by defining a getName and getHomeCountry\
    \ function, which returns the values held in the protected variables _name and\
    \ _homeCountry respectively. As this is an abstract class, we need to derive from\
    \ it to create concrete classes, as follows:\n\n```\nclass Liverpool extends FootballClub\
    \ {\n    constructor() {\n        super();\n        this._name = \"Liverpool F.C.\"\
    ;\n        this._homeCountry = ClubCountry.England;\n    }\n}\n```\n\nWe, we have\
    \ defined two classes, named Liverpool and BorussiaDortmund that derive from our\
    \ abstract base class FootballClub. Both classes have a single constructor that\
    \ sets the internal _name and _homeCountry properties."
