  md: '# About the Author


    Nathan Rozentals has been building commercial software for over 26 years and programming
    for a lot longer than that. Before the Internet even became a thing, he was building
    statistical analysis programs on mainframes. Like many programmers at that time,
    he helped save the world in the year 2000.


    He has worked and tried to master many object-oriented languages, starting by
    implementing object-oriented techniques in plain old C. Having spent years working
    with C+, chasing obscure thread locking issues and recursive routines causing
    memory leakage, he decided to simplify his life by embracing automatic garbage
    collection in Java and then C.


    As the world moved from thick-client and n-tier to web technologies, his focus
    turned to modern programming, and so to JavaScript. In TypeScript, he found a
    language in which he could bring all of the object-oriented design patterns he
    had learned over the years to JavaScript.


    If it were not for extreme programming techniques, agile delivery, test-driven
    development, and continuous integration, he would have lost his mind many years
    ago.


    When he is not programming, he is thinking about programming. To stop thinking
    about programming, he goes windsurfing, plays soccer, or simply watches the professionals
    play soccer. They are so much better at it than he is.


    I would like to thank my partner, Kathy, for her support and unconditional love
    over the past years. Without you, I would not be in the great space that I am.


    To Ay and Dayton, it has been great seeing you grow up into mature adults. You
    are always in my thoughts.


    To Matt, thanks for keeping us all laughter - everyone needs to see the lighter
    side of life.


    To Mum, Dad, Rach, Tash, and Tam, thanks for your unwavering and whole-hearted
    support – I truly appreciate all you have done for me.


    Finally, to the great team at Vix, thanks for the many intense debates and discussions,
    and for making work such a rewarding experience.'
