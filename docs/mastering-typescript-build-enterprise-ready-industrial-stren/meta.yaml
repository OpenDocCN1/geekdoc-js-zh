  md: "Writing and Using Declaration Files\n\n# Union types\n\nWe are not quite finished\
    \ with the declaration file for the ErrorHelper just yet. If we take a look at\
    \ the original JavaScript usage of the ErrorHelper, we will notice that the containsErrors\
    \ function also allows for the failure property of responseText to be a string:\n\
    \n```\nvar failureMessage = {\n  responseText : {\n    \"failure\" : \"true\"\
    ,\n    \"errorMessage\" : \"Error Message from Typescript\"\n  }\n}\n```\n\nIf\
    \ we compile this code, we will get the following error:\n\n![](bbox=[0.277, 0.386,\
    \ 0.722, 0.523])\n\nTypeScript error with invalid property\n\nIn the preceding\
    \ definition of the variable failureMessageString, the type of the \"failure\"\
    \ is \"true\", which is of type string, and not true, which is of type boolean.\
    \ In order to allow for this variant on the original IFailureMessage interface,\
    \ we will need to modify our declaration file. The simplest way to allow for both\
    \ types would be to use a union, as follows:\n\n```\ninterface IFailureMessage\
    \ {\n  failure: boolean;\n  errorMessage: string;\n}\n```\n\nHere, we have simply\
    \ updated the failure property on the IFailureMessage interface to allow for both\
    \ boolean and string types. Our code will now compile correctly.\n\nThis completes\
    \ our definition file for the ErrorHelper JavaScript class."
