  md: '# 1

    TypeScript - Tools and Framework Options


    JavaScript is a truly ubiquitous language. Just about every website that you visit
    in the modern world is using JavaScript to make the site more responsive, more
    readable, or more attractive to use. Even traditional desktop applications are
    moving online. Where we once needed to download and install a program to generate
    a diagram, or write a document, we can now do all of this on the web, within the
    confines of our humble browser.


    This is the power of JavaScript. It enables us to rethink the way we use the web.
    But it also enables us to rethink the way we use technologies. Node, for example,
    allows JavaScript to run server-side, rendering entire large scale web-sites,
    complete with session handling, load balancing, and database interaction. This
    shift in thinking about web technologies, however, is only the beginning.


    Apache Cordova is a fullyfledged web server that runs as a native mobile application.
    This means that we can build a mobile phone application using HTML, CSS, and JavaScript,
    and then interact with the phones accelerometer, geolocation services, or file
    storage. With Cordova, therefore, JavaScript and web technologies have moved into
    the realm of native mobile phone applications.


    Likewise, projects such as Kinoma are using JavaScript to drive devices for the
    Internet Of Things, running on tiny microprocessors embedded in all sorts of devices.
    Espruino is a microcontroller chip purposefully designed to run JavaScript. Learning
    JavaScript, therefore, means that you have the ability to build websites, mobile
    phone applications, and even control microprocessors on embedded devices. JavaScript
    is becoming more and more popular, is being supported on more and more hardware,
    and is filtering through nearly every corner of computing.'
  merge: -1
