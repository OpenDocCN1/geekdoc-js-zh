  md: "This error message is telling us that the only place where a readonly property\
    \ can be set is in the constructor function.\n\n# Class property accessors\n\n\
    ECMAScript5 introduces the concept of property accessors. An accessor is simply\
    \ a function that is called when a user of our class sets a property, or retrieves\
    \ a property. This means that we can detect when users of our class are either\
    \ getting or setting a property, and this can be used as a trigger mechanism for\
    \ other logic. To use accessors, we create a pair of get and set functions (with\
    \ the same function name) in order to access an internal property. This concept\
    \ is best understood with some code examples:\n\n```\nclass ClassWithAccessors\
    \ {\n    private _id: number;\n    get id() {\n        console.log(`inside get\
    \ id`);\n        return this._id;\n    }\n    set id(value:number) {\n       \
    \ console.log(`inside set id`);\n        this._id = value;\n    }\n}\n```\n\n\
    This class has a private _id property and two functions, both called id. The first\
    \ of these functions are prefixed with the get keyword. This get function is called\
    \ when a user of our class retrieves or reads the property. In our sample, the\
    \ get function logs a debug message to the console, and then returns the value\
    \ of the internal _id property.\n\nThe second of these functions are prefixed\
    \ with the set keyword and accepts a value parameter. This set function will be\
    \ called when a user of our class assigns a value, or sets the property. In our\
    \ sample, we simply log a message to the console, and then set the internal _id\
    \ property is private, and as such cannot be accessed outside the class.\n\nWe\
    \ can now use this class, as follows:\n\n```\nvar classWithAccessors = new ClassWithAccessors();\n\
    classWithAccessors.id = 2;\nconsole.log(`property is set to ${classWithAccessors.id}`);`\n\
    ```"
  merge: -1
  pgno: 116
- img_proc: false
  md: "Here, we have created an instance of this class, and named it classWithAccessors.\
    \ Note how we are not using the two separate functions get and set. We are simply\
    \ using them as a single id property.\n\nWhen we assign a value to this property,\
    \ ECMAScript 5 runtime will call the set id(value) function, and we retrieve this\
    \ property, the runtime will call the get id() function. The output of this code\
    \ is as follows:\n\n```\ninside set id()\ninside get id()\nid property is set\
    \ to 2\n```\n\nUsing getter and setter functions allows us to hook into class\
    \ properties, and execute code when these classes properties are accessed.\n\n\
    > This feature is only available when using ECMAScript 5 and above. Be aware that\
    \ some browsers do not support ECMAScript 5 (such as Internet Explorer 8), and\
    \ will cause JavaScript runtime errors when attempting to use class accessors.\n\
    \n# # Static functions\n\nStatic functions are functions that can be called on\
    \ a class without having to create an instance of the class first. These functions\
    \ are almost global in their nature, but must be called by prefixing the function\
    \ with the class name. Consider the following class definition:\n\n```\nclass\
    \ StaticClass {\n  static printTwo() {\n    console.log(2);\n  }\n}\nStaticClass.printTwo();\n\
    ```\n\nThis class definition includes a single function, named printTwo, which\
    \ is marked as static. As we can see from the last line of the code, we can call\
    \ this function without newing up an instance of the StaticClass class. We can\
    \ just call the function directly, as long as we prefix it with the class name."
