    \n```\nvar DoorState;\n(function (DoorState) {\n  DoorState[DoorState[\"Open\"\
    ]] = 0] = \"Open\";\n  DoorState[DoorState[\"Closed\"]] = 1] = \"Closed\";\n \
    \ DoorState[DoorState[\"Ajar\"]] = 2] = \"Ajar\";\n})(DoorState || (DoorState\
