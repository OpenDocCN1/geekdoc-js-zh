  md: '# Using npm and @types


    With the release of 2.0 of the TypeScript compiler, we can now also install declaration
    files using npm. This means that there is no difference in our toolset in order
    to install project dependencies, as it is to include the declaration files. As
    an example, to install the Underscore library as a project dependency, we would
    type:


    ```

    npm install underscore --save

    ```


    And to install the declaration files for underscore, we can now type


    ```

    npm install @types/underscore --save

    ```


    Note the @types prefix used within the npm command. This special syntax instructs
    npm to install the declaration files for underscore, and is a very subtle but
    easily remembered syntax.


    > This mechanism for including type definitions via npm has been adopted as the
    standard mechanism by TypeScript moving forward.


    # Using third-party libraries


    In this section of the chapter, we will begin to explore some of the more popular
    third-party JavaScript libraries, their declaration files, and how to write compatible
    TypeScript for each of these frameworks. We will compare Backbone, Angular (version
    1), and ExtJS, which are all frameworks for building rich client-side JavaScript
    applications. During our discussion, we will see that some frameworks are highly
    compliant with the TypeScript language and its features, some are partially compliant,
    and some have very low compliance.


    In the next chapter, we will explore some third-party libraries that have been
    written explicitly with TypeScript in mind, or for which the TypeScript compiler
    has modified to work with. In the remainder of this chapter, however, will focus
    on standard third-party libraries that were designed to support JavaScript.'
