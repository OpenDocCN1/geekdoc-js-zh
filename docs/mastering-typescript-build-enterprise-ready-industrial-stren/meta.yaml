  md: "Decorators, Generics, and Asynchronous Features\n\nHere, we have two class\
    \ definitions, FirstClass and SecondClass.FirstClass just has a public id property,\
    \ and SecondClass has a public name property. We then have a generic class that\
    \ accepts a type T and has a single function, named create. This create function\
    \ attempts to create a new instance of the type T.\n\nThe last four lines of the\
    \ sample show how we would like to use this generic class. The creator1 variable\
    \ creates a new instance of the GenericCreator class using the correct syntax\
    \ for creating variables of type FirstClass. The creator2 variable is a new instance\
    \ of the GenericCreator class, but this time is using SecondClass. Unfortunately,\
    \ the preceding code will generate a TypeScript error:\n\n```\nerror TS2304: Cannot\
    \ find name 'T'.\n```\n\nAccording to the TypeScript description, in order to\
    \ enable a generic class to objects of type T, we need to refer to T by its constructor\
    \ function. We also need to pass in the class definition as an argument. The create\
    \ function will need to be rewritten, as follows:\n\n```\nclass GenericCreator<\
    \ T > {\n  create(arg1: { new(): T }) : T {\n    return arg1();\n  }\n}\n```\n\
    \nLet's break this create function down into its component parts. First, we pass\
    \ an argument, named arg1. This argument is defined to be of type { new(): T }.\
    \ This is the little trick that allows us to refer to T by its constructor function.\
    \ We are defining a new anonymous that overloads the new() function and returns\
    \ a type T. This means that the arg1 argument is a function that is strongly typed\
    \ to have a single constructor that returns a type T. The implementation of this\
    \ function simply returns a new instance of the arg1 variable. Using this syntax\
    \ removes the compile error we encountered before.\n\nThis change, however, means\
    \ we must pass the class definition to the create function, as follows:\n\n```\n\
    var creator1 = new GenericCreator<FirstClass>();\nvar firstClass: FirstClass =\
    \ creator1.create(FirstClass);\n\nvar creator2 = new GenericCreator<SecondClass>();\n\
    var secondClass : SecondClass = creator2.create(SecondClass);\n```\n\n[ 144 ]"
