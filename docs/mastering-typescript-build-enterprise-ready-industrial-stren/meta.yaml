  md: '# TypeScript - Tools and Framework Options


    This GrGruntfile.js contains a simple function to initialize the Grunt environment,
    and specify the commands to run. The first two lines of the function are loading
    grunt-contrib-watch and grunt-exec as npm tasks. We then call initConfig to configure
    the tasks to run. This configuration section has a pkg property, a watch property,
    and an exec property. The pkg property is used to load the package.json file that
    we created earlier as part of the npm init step.


    The watch property has two sub-properties. The files property specifies what to
    watch for, in this case .ts files in our source tree, and the tasks array specifies
    that we should kick off the exec:run_tsc command once a file has changed. Finally,
    we call grunt.registerTask, specifying that the default task is to watch for file
    changes.


    We can now run grunt from the command line, as follows:


    ```

    grunt

    ```


    As can be seen from the command line output, Grunt is running the watch task,
    and is waiting for changes to any .ts files:


    ```

    Running "watch" task

    Waiting...

    ```


    Open up any TypeScript file, make a small change (add a space or something), and
    then hit Ctrl-S to save the file. Now check back on the output from the Grunt
    command line. You should see something like the following:


    ```

    >> File hellgrunt.ts changed.

    Running "exec:run_tsc" (exec) task

    Done, without errors.

    Completed in 2.008s at Sat Mar 19 2016 20:27:17 GMT+0800

    (W. Australia Standard Time) - Waiting...

    ```


    This command line output is a confirmation that the Grunt watch task has identified
    that the hellgrunt.ts file has changed, run the exec:run_tsc task, and is waiting
    for the next file to change. We should now also see a hellgrunt.js file in the
    same directory as our Typescript file.'
