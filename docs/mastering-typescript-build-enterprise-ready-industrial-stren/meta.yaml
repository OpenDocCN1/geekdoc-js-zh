  md: '# 3nInterfaces, Classes, and Inheritance


    We have already seen how TypeScript uses basic types, inferred types, and function
    signatures to bring a strongly typed development experience to JavaScript. TypeScript
    also introduces object-oriented features that are similar to other languages,
    including interfaces, classes, and inheritance. These object-oriented language
    constructs are part of the ECMAScript 6 standard, and as such will be included
    in future versions of JavaScript. TypeScript allows us, therefore, to use these
    new object-oriented features from upcoming JavaScript versions in our code base.
    In this chapter, we will look at these object-oriented concepts, how they are
    used in TypeScript, and what benefits they bring to the JavaScript development
    experience.


    Note that the TypeScript compiler will take care of generating compatible ECMAScript
    3 or ECMAScript 5 code when we use these language features. In this way, TypeScript
    programmers have the benefit of using these advanced object-oriented techniques
    in their code today.


    This chapter is broken up into two main sections. The first section of this chapter
    is intended for readers using TypeScript for the first time, and covers interfaces,
    classes, and inheritance from the ground up. The second section of this chapter
    builds on this knowledge, and how to create and use classes, interfaces, and inheritance
    by building a sample Factory Design Pattern.


    If you have experience with TypeScript, are actively using interfaces and classes,
    and understand inheritance, then you may be more interested in the later sections
    of the chapter, where we discuss the Factory Design Pattern, and abstract classes.'
