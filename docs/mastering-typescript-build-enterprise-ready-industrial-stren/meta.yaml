    \ follows:\n\n```\nclass name : ClassWithPropertyDec\npropertyKey : name\nclass\
    \ name : StaticClassWithPropertyDec\npropertyKey : name\n```\n\nOur property decorator\
    \ is correctly identifying the name of the class, whether it is used on a\nclass\
    \ property, or a static class property.\n\n# Method decorators\n\nMethod decorators\
    \ are decorators that can be applied to a method on a class. Method\ndecorators\
    \ are invoked by the JavaScript runtime with three parameters. Remember that\n\
    class decorators have only a single parameter (the class prototype) and property\
