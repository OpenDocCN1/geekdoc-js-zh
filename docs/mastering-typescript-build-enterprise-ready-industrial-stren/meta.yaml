  md: "# Interfaces, Classes, and Inheritance\n\nTypeScript includes the super keyword\
    \ to enable calling a base class's function with the same name. Consider the following\
    \ classes:\n\n```\nclass BaseClassWithConstructor {\n    private id: number;\n\
    \    constructor(_id: number) {\n        this.id = _id;\n    }\n}\n\nclass DerivedClassWithConstructor\
    \ extends BaseClassWithConstructor {\n    private name: string;\n    constructor(_id:\
    \ number, _name: string) {\n        super(_id);\n        this.name = _name;\n\
    \    }\n}\n```\n\nIn this code snippet, we define a class BaseClassWithConstructor,\
    \ which holds a private id property. This class has a constructor function that\
    \ requires an _id argument. Our second class, named DerivedClassWithConstructor,\
    \ extends (or inherits from) the BaseClassWithConstructor class. The constructor\
    \ of DerivedClassWithConstructor takes an _id argument through the base class.\
    \ This is where the super call comes in. The super keyword calls the function\
    \ in the base class that has the same name as the function in the derived class.\
    \ The first line of the constructor for\nDerivedClassWithConstructor shows the\
    \ calling using the super keyword, passing the id argument received through the\
    \ base class constructor.\n\n# Function overloading\n\nThe constructor of a class\
    \ is, however, just a function. In the same way that we can use the super keyword\
    \ in a constructor, we can also use the super keyword when a base class and its\
    \ derived class use the same function name. This technique is called function\
    \ overloading. In other words, the derived class has a function name that is the\
    \ same name as that of a base class, and it overloads this function definition.\
    \ Consider the following code snippet:"
