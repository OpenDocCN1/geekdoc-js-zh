  md: 'Third-Party Libraries


    # Downloading definition files


    The simplest method of including a definition file within your TypeScript project
    is to download the matching .d.ts file from DefinitelyTyped. This is a simple
    matter of finding the relevant file, and downloading the raw content. Let''s assume
    that we wanted to use jQuery within our project. We have found and downloaded
    the jQuery library (v2.2.3), and included the relevant files within our project,
    under a directory named lib. To download the declaration file, simply browse to
    the jquery directory on DefinitelyTyped

    (https://github.com/borisyankov/DefinitelyTyped/tree/master/jquery). Then click
    on the jquery.d.ts file. This will open up a GitHub page with an editor view of
