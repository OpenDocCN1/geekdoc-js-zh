    # Other editors


    There are a number of editors that include support for TypeScript, such as Atom,
    Brackets, and even the age-old Vim editor. Each of these editors has varying levels
    of TypeScript support, including syntax highlighting and IntellSense. Using these
    editors represents a bare-bones TypeScript development environment, relying on
    the command line to automate builds. They do not have built-in debugging tools,
    do not qualify as an Integrated Development Environment (IDE) per se, but can
    easily be used to build TypeScript applications. The basic workflow using these
    editors would be as follows:


    +   - Create and modify files using the editor

    - Invoke the TypeScript compiler from the command line

    - Run or debug applications using existing debuggers


    # Using Grunt


    In a bare-bones environment, any change to a TypeScript file means that we need
    to re-issue the tsc command from the command line every time we wish to compile
    our project. Obviously, it is going to be very tedious to switch to the command
    prompt and manually compile our project every time we have made a change. This
    is where tools like Grunt come in handy. Grunt is an automated task runner (http://gruntjs.com)
    that can automate tedious compile, build and test tasks. In this section, we will
    use Grunt to watch our TypeScript files, and automatically invoke the tsc compiler
    when a file is saved.


    Grunt runs in a Node environment, and therefore needs to be installed as an npm
    dependency of your project. It cannot be installed globally as most npm packages
    can. In order to do this, we will need to create a packages.json file in the root
    directory of your project. Then, simply type-:",


    ```

    npm init

    ```'
