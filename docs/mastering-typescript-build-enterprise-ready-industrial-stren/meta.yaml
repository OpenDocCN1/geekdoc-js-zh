    \ and includes the existing error_helper.js JavaScript file, as well as the TypeScript\
    \ generated ErrorHelperTypeScript.js file.\n\nWithin the ErrorHelperTypeScript.ts\
    \ file, let's use the ErrorHelper, as follows:\n\n```\nwindow.onload = () => {\n\
