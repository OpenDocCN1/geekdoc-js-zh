  md: '# Const values


    The TypeScript language also allows us to define a variable as a constant, by
    using the const keyword. If a variable has been marked as const, then its value
    can only be set when the variable is defined, and cannot be changed afterwards.
    Consider the following code:


    ```

    const constValue = "test";

    constValue = "updated";

    ```


    Here, we have defined a variable named constValue, and indicated that it cannot
    be changed by using the const keyword. Attempting to compile this code will result
    in the following error:


    ```

    error TS2450: Left-hand side of assignment expression cannot be a constant or
    a read-only property.

    ```


    # The let keyword


    Variables in JavaScript are defined by using the keyword var. The JavaScript runtime
    is very lenient, however, when it comes to variable definitions. If the JavaScript
    runtime comes across a variable that has not been previously defined or given
    a value, then the value for this variable will be undefined. Consider the following
    code snippet:


    ```

    console.log(`anyValue = ${anyValue}`);

    var anyValue = 2;

    console.log(`anyValue = ${anyValue}\`);

    ```


    Here, we start by logging the value of a variable named oldValue to the console.
    Note, however, that the variable oldValue is only defined on the second line of
    this code snippet. In other words, we can use a variable in JavaScript before
    it is defined. The output of this code is as follows:


    ```

    anyValue = undefined

    anyValue = 2

    ```


    The semantics of the var keyword presents us with a small problem. Using the var
    keyword does not check to see whether the variable itself has been defined before
    we actually use it. This could obviously lead to unwanted behavior, as the value
    of an undefined or unallocated variable is always undefined.'
