  md: "# Writing and Using Declaration Files\n\nThe function definition for containsErrors\
    \ and trace now strongly types the response argument to be of type IResponse,\
    \ which we defined earlier. This modification to the definition file will now\
    \ prevent any further usage of the containsErrors or trace functions to send in\
    \ a valid argument that conforms to the IResponse structure. Let’s write some\
    \ intentionally incorrect TypeScript code and see what happens:\n\n```\nvar anotherFailure:\
    \ IResponse = {\n  responseText: {\n    success: true\n  }\n}\n```\n\nWe start\
    \ by creating a variable anotherFailure and specify its type to be of IResponse.\
    \ Unfortunately, the IResponse interface does not have a property named success,\
    \ and so we will generate the following TypeScript error:\n\n> > tsc\nError TypeScript.ts(8,13):\
    \ error TS2322 Type '{ success: boolean; }' is not assignable to type 'IResponse'.\n\
    Types of property 'responseText' are incompatible.\ntype '{ success: boolean;\
    \ }' is not assignable to type 'IFailureMessage'\nObject literal may only specify\
    \ known properties, and 'success' does not exist in type 'IFailureMessage'.\n\n\
    TypeScript error message with an invalid data structure\n\nAs can be seen from\
    \ this fairly verbose but informative error message, the structure of the anotherFailure\
    \ variable is causing all the errors. Even though we have referenced the responseText\
    \ property of IResponse, the responseText property is strictly typed to be of\
    \ IFailureMessage, which requires both a failure property and an errorMessage\
    \ property; hence the error.\n\nBy creating a strongly typed declaration file\
    \ for the existing ErrorHelper class, we ensure that any further TypeScript usage\
    \ of the existing ErrorHelper JavaScript closure will not generate runtime errors."
