  md: "# Creating classes in ExtJS\n\nExtJS is a JavaScript library that does things\
    \ in its own way. If we were to categorize Backbone, Angular, and ExtJS, we might\
    \ say Backbone is a highly compliant TypeScript library. In other words, the language\
    \ features of classes and inheritance within TypeScript are highly compliant with\
    \ Backbone. Angular in this case would be a partially compliant library, with\
    \ some elements of Angular objects complying with the TypeScript language features.\
    \ ExtJS, on the other hand, would be a minimally compliant library, with little\
    \ or no TypeScript features applicable to the library.\n\nLet's take look at a\
    \ sample ExtJS 4.0 application written in TypeScript. Consider the following code:\n\
    \n```\nExt.application(\n  name: 'SampleApp',\n  appFolder: '/code/sample',\n\
    \  controllers: ['SampleController'],\n  launch: () => {\n    Ext.create('Ext.container.viewport',\
    \ {\n      layout: 'fit',\n      items: [{\n        xtype: 'panel',\n        title:\
    \ 'Sample App',\n        html: 'This is a Sample Viewport'\n      }]\n    });\n\
    \  }\n);\n```\n\nWe start by creating an ExtJS application by calling the application\
    \ function on the Ext global instance. The application function then uses a JavaScript\
    \ object, enclosed within the first and last curly braces {} to define properties\
    \ and functions. This ExtJS application sets the name property to braces SampleApp,\
    \ the appFolder property to be /code/sample, and the controllers property to be\
    \ an array with a single entry-'SampleController'."
