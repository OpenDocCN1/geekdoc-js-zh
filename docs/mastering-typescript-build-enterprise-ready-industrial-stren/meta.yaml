  md: "# TypeScript - Tools and Framework Options\n\nThe JavaScript language is not\
    \ a difficult language to learn, but it does present challenges when writing large,\
    \ complex programs. One of these challenges is that JavaScript is an interpreted\
    \ language and therefore has no compilation step. The only time you will know\
    \ if you have made a simple syntax error is when you run the entire application\
    \ through the run-time interpreter. Another challenge is that it is not an object-oriented\
    \ language, and it takes great care and discipline to build good, maintainable,\
    \ and understandable JavaScript. For programmers who are moving from other object-oriented\
    \ languages, such as Java, C#, or C++, JavaScript can seem like a completely foreign\
    \ environment.\n\nTypeScript bridges this gap. It is a strongly typed, object-oriented\
    \ language that uses a compiler to generate JavaScript. It therefore allows us\
    \ to use well known object-oriented techniques and design patterns to build JavaScript\
    \ applications. Bear in mind that TypeScript-generated JavaScript is just plain\
    \ JavaScript, and so will run wherever JavaScript can run - in the browser, on\
    \ a mobile device, or on an embedded device.\n\nThis chapter is divided into two\
    \ main sections. The first section is a quick overview of some of the benefits\
    \ of using TypeScript, and the second section deals with setting up a TypeScript\
    \ environment.\n\nIf you are an experienced TypeScript programmer, and already\
    \ have a development environment set up, then you might want to skip this chapter.\
    \ If you have never worked with TypeScript before, and have picked up this book\
    \ because you want to understand what TypeScript can do, then read on.\n\nWe will\
    \ cover the following topics in this chapter:\n\n+   * The benefits of TypeScript\n\
    \  * Compilation\n  * Strong typing\n  * Integration with popular JavaScript libraries\n\
    \  * Encapsulation\n  * Private and public member variables\n\n+   * Setting up\
    \ a development environment\n  * Visual Studio\n  * WebStorm\n  * Visual Studio\
    \ Code\n  * Other editors and grunt"
  merge: -1
