- img_proc: false
  md: "Writing and Using Declaration Files\n\nThe second line of our module declaration\
    \ indicates that we are defining a function called containsErrors that takes one\
    \ parameter. The third line of this module declaration indicates that we are defining\
    \ another function named trace that also takes a single parameter. With this definition\
    \ in place, the TypeScript code sample will compile correctly.\n\n# Interfaces\n\
    \nAlthough we have correctly defined the two functions that are available to users\
    \ of the ErrorHelper closure, we are missing the second piece of information about\
    \ the functions available on the ErrorHelper closure–the structure of the response\
    \ argument. We are not strongly typing the arguments for either of the containsErrors\
    \ or trace functions. At this stage, your TypeScript code can pass anything into\
    \ these two functions because it does not have a definition for the response or\
    \ message arguments. We, however, that both these functions query our parameters\
    \ for a specific structure. If we pass in an object that does not conform to this\
    \ structure, then our JavaScript code will cause runtime errors.\n\nTo solve this\
    \ problem and make our code more stable, let's define an interface for these parameters:\n\
    \n```\ninterface IResponse {\n    responseText: IFailureMessage;\n}\n\ninterface\
    \ IFailureMessage {\n    failure: boolean;\n    errorMessage: string;\n}\n```\n\
    \nWe start with an interface named IResponse that has a single property of responseText,\
    \ the same name as the original JavaScript object. This responseText property\
    \ is strongly typed to be of IFailureMessage. The IFailureMessage interface is\
    \ strongly typed to have two properties–failure, which is type boolean, and errorMessage,\
    \ which is type string. These interfaces correctly describe the proper structure\
    \ of the response argument for the containsErrors and trace functions. We can\
    \ now modify our original declaration for these functions, as follows:\n\n```\n\
    declare module ErrorHelper {\n    function containsErrors(response: IResponse);\n\
    \    function trace(message: IResponse);\n}\n```\n\n[ 169 ]"
