  md: "# TypeScript - Tools and Framework Options\n\nClearly, the description parameter\
    \ is strongly typed to a string, and the specDefinitions parameter is strongly\
    \ typed to be a function that returns void. TypeScript uses the double-brace ()\
    \ syntax to declare functions, and the arrow syntax => to show the return type\
    \ of the function. So () void is a function that does not return anything. Finally,\
    \ the description itself will also return void.\n\nIf we were to type and pass\
    \ a function as the first parameter, and a string as the second parameter (clearly\
    \ breaking the definition of this function), as follows:\n\n```\ndescribe() =>\
    \ { /* function body */, \"description\");\n```\n\nTypeScript would generate the\
    \ error:\n\n```\nhello.ts(11,11): error TS2345: Argument of type '()' => void\
    \ is not assignable to parameter of type 'string'.\n```\n\nThis error is telling\
    \ us that we are attempting to call the describe function with invalid parameters.\
    \ We will take a look at definition files in more detail in later chapters, but\
    \ this example clearly shows that the TypeScript compiler will generate errors\
    \ if we attempt to use external JavaScript libraries incorrectly.\n\n# DefinitelyTyped\n\
    \nAfter TypeScript was released, Boris Yankov started a GitHub repository to house\
    \ definition files, called DefinitelyTyped (http://definitelytyped.org). This\
    \ repository has now become the first port of call for integrating external JavaScript\
    \ libraries into TypeScript, and it currently holds definitions for over 1,600\
    \ JavaScript libraries.\n\n# Encapsulation\n\nOne of the fundamental principles\
    \ of object-oriented programming is encapsulation–the ability to define data,\
    \ as well as a set of functions that can operate on that data, into a single component.\
    \ Most programming languages have the concept of a class for this purpose, providing\
    \ a way to define a template for data and related functions.\n\nLet's take a look\
    \ at a simple TypeScript class definition, as follows:\n\n```\nclass MyClass {\n\
    \  add(x, y) {\n    return x + y;\n  }\n}\n\nvar classInstance = new MyClass();\n\
    ```"
