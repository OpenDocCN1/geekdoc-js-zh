- img_proc: false
  md: "This error is telling us that the automatic property name is declared private,\
    \ and it is therefore unavailable to code outside the class itself.\n\nWhile this\
    \ shorthand technique of creating automatic member variables is available, it\
    \ can make the code more difficult to read. In the author's opinion, it is generally\
    \ better to use the verbose class definitions that do not use this shorthand technique.\
    \ By not using this technique, and instead listing all of the properties at the\
    \ top of the class, it becomes immediately visible to someone reading the code\
    \ what variables use, and whether they are public or private. Using the constructor's\
    \ automatic property syntax hides these parameters, forcing developers to sometimes\
    \ reread the code to understand. Whichever syntax you choose, however, try to\
    \ make it a coding standard, and use the same syntax throughout your code base.\n\
    \n![](bbox=[0.128, 0.237, 0.196, 0.292])\n\n# ReadOnly properties\n\nIn addition\
    \ to the public, private, and protected access modifiers, we can also mark a class\
    \ property as readonly. This means that once the value of the property has been\
    \ set, it is not able to be modified, either by the class itself, or by any users\
    \ of the class. There is only one place where a readonly property can be set,\
    \ and this is within the constructor function itself. Consider the following code:\n\
    \n```\nclass ClassWithReadOnly {\n  readonly name: string;\n  constructor(_name:\
    \ string) {\n    this.name = _name;\n  }\n  setReadOnly(_name: string) {\n   \
    \ // generates a compile error\n    this.name = _name;\n  }\n```\n\nHere, we have\
    \ defined a class ClassReadOnly that has a name property of type that has been\
    \ marked with the readonly keyword. The constructor function is setting this value.\
    \ We have then defined a second function setReadOnly, where we are attempting\
    \ to set this readonly property. This code will generate the following error:\n\
    \n```\nerror TS2540: Cannot assign to 'name' because it is a constant or a read-only\
    \ property.\n```"
  merge: -1
