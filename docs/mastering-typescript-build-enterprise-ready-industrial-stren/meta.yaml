  md: "# TypeScript Compatible Frameworks\n\nHere, we have an enclosing div that contains\
    \ two spans. The first span is rendered in bold, and will display the id property\
    \ from the model. The second span is rendered in hi style, and displays the displayName\
    \ property from the model.\n\nBy separating the view elements of a user interface\
    \ from the model, we can see that we are free to modify the view as much as we\
    \ like, without touching the code for the model. We could apply styles to each\
    \ element through CSS, or even hide certain properties from the view completely.\n\
    \nThis separation gives us the ability to design or modify the display portion\
    \ independently of the model. This design can be handed off to a completely separate\
    \ and independent team, who have specialist skills in user interface design. As\
    \ long as the underlying model does not change, both parts of a model and view\
    \ work seamlessly together.\n\nAs an example of a View, consider the following\
    \ code:\n\n```\nclass View {\n  template: string;\n  constructor(_template: string)\
    \ {\n    this.template = _template;\n  }\n  render(model: Model) {\n    // combine\
    \ template and view\n  }\n}\n```\n\nHere, we have defined a class View that has\
    \ a single property, named template. When we construct this view, we give it the\
    \ HTML template that it should use. View class also has a render method, which\
    \ has a single argument named model. The render method will combine the template\
    \ and, return the resulting HTML.\n\n> The preceding examples are pseudo-code\
    \ meant for illustration purposes, and are not an example of using an MVC framework.\n\
    \n![](bbox=[0.135, 0.676, 0.198, 0.738])"
