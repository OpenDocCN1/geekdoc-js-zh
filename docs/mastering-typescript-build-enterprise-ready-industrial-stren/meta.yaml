    # Using Backbone


    We will start our exploration of TypeScript frameworks by building the sample
    application in Backbone. While it can be argued that Backbone is not a TypeScript
    framework per se, we have already seen how it can be used naturally with the TypeScript
    language syntax. Backbone is also one of the oldest frameworks around, and it
    is small, light, and extremely fast.


    Backbone, however, requires writing a little more code than most frameworks, and
    it is really the bare-bones of an MVC framework. When working with Backbone, you
    will need to call rendering functions yourself, and also attach rendered HTML
    to the DOM tree manually.'
  merge: -1
