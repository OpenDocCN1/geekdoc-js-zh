  md: "# Writing and Using Declaration Files\n\nUsed to be a time where the Internet\
    \ seemed to be capable of sending and receiving vast amounts of information in\
    \ the blink of an eye. Bandwidth and speed on the Internet were growing exponentially,\
    \ and desktops were getting larger amounts of RAM and faster processors. As developers,\
    \ during this stage of the Internet highway, we stopped thinking how much RAM\
    \ a typical user had on their machine. We also stopped thinking about how much\
    \ data we were sending across the wire. This was because Internet speeds were\
    \ so fast and browser processing speed seemed limitless.\n\nAnd then came along\
    \ the mobile phone and it felt like we were back in the 1990s with incredibly\
    \ slow Internet connections, tiny screen resolutions, limited processing power,\
    \ and very little RAM (and popular arcade gaming experiences as Elevator Action\
    \ https://archive.org/details/Elevator_Action_1985_Sega_Taito_JP_en). The point\
    \ of this story is as modern web developers, we still need to be mindful of browsers\
    \ that run on mobile phones. These browsers are sometimes running on very limited\
    \ connections, meaning that we must carefully measure the size of our JavaScript\
    \ libraries, JSON data, and HTML pages, to ensure that our applications are fast\
    \ and usable, even on mobile browsers.\n\nThis technique of including JavaScript\
    \ variables or smaller JSON data within the rendered HTML page often provides\
    \ us with the fastest way to render a screen on an older browser, or on a mobile\
    \ phone. Many popular sites use this technique to quickly render the general structure\
    \ of the page (header, side panels, footers, and so on) before the main content\
    \ is delivered through asynchronous JSON requests. This technique works well because\
    \ it renders the page fast and gives the user faster visual feedback.\n\n# Structured\
    \ data\n\nLet's enhance this simple array of contact e-mails with a little more\
    \ relevant data. For each of these e-mail addresses, let's assume that we want\
    \ to include some text to render within the footer of our page, along with the\
    \ e-mail addresses. Consider the following HTML script:\n\n```\n<script type=\"\
    text/javascript\">\nvar CONTACT_DATA = [\n  { DisplayText: 'Help',\n    Email:\
    \ 'help@site.com' },\n  { DisplayText: 'Contace',\n    Email: 'contactus@site.com'\
    \ },\n  { DisplayText: 'Webmaster',\n    Email: 'webmaster@site.com' }\n];\n</script>\n\
    ```"
