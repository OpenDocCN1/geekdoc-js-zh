  md: "# TypeScript - Tools and Framework Options\n\nLet's take a quick look at what\
    \ a definition would look like. As an example, consider the JavaScript describe\
    \ function from the popular Jasmine unit testing framework, as follows:\n\n```\n\
    var describe = function(description, specDefinitions) {\n  return jasmine.getEnv().describe(description,\
    \ specDefinitions);\n};\n```\n\nNote that this function has two parameters--description\
    \ and specDefinitions. Unfortunately JavaScript does not tell us what sort of\
    \ variables these are. We would need to look at the Jasmine documentation to figure\
    \ out how to call this function, and what variables are expected for both. If\
    \ we head over http://jasmine.github.io/2.0/introduction.html, we will see an\
    \ example of how to use this function:\n\n```\ndescribe(\"A suite\", function\
    \ () {\n  it(\"contains spec with an expectation\", function () {\n    expect(true).toBe(true);\n\
    \  }\n});\n```\n\nFrom the documentation, then we can easily see that the first\
    \ parameter is a string, and the second parameter is a function. However, there\
    \ is nothing in JavaScript that forces us to conform to this API definition. As\
    \ mentioned before, we could easily call this function incorrectly, with two numbers\
    \ for example, or by sending a function first and a string second. Making mistakes\
    \ like these will obviously generate runtime errors. Using a simple TypeScript\
    \ definition file, however, will generate compile-time errors before we even attempt\
    \ to run this code.\n\nLet's take a look at the corresponding TypeScript definition\
    \ for this function, found in the jasmine.d.ts definition file:\n\n```\ndeclare\
    \ function describe(\n  description: string,\n  specDefinitions: () => void\n\
    ): void;\n```\n\nHere, we have the TypeScript definition for the Jasmine describe\
    \ function. This definition looks very similar to the function itself, but gives\
    \ us a little more information about the parameters."
