  md: "TypeScript - Tools and Framework Options\n\nWhile tools to do this sort of\
    \ syntax checking like JSLint have been around for years, it is obviously beneficial\
    \ to have these tools integrated into your development toolchain. Using the TypeScript\
    \ compiler in a continuous integration environment will also fail to build completely\
    \ when compilation errors are found, further protecting your code base against\
    \ these types of bugs.\n\n# Strong typing\n\nJavaScript is not strongly typed.\
    \ It is a language that is very dynamic, and therefore allows objects to change\
    \ their properties and behavior on-the-fly. As an example of this, consider the\
    \ following code:\n\n```\nvar test = \"this is a string\";\ntest = 1;\ntest =\
    \ function(a, b) {\n  return a + b;\n}\n```\n\nOn the first line of this code\
    \ snippet, the variable test is bound to a string. It is then assigned to a number,\
    \ and finally is redefined completely to be a function that expects two parameters.\
    \ This means that the type of the variable test has changed from being a string\
    \ to being a number, and then to being a function. Traditional object-oriented\
    \ languages, however, will not allow the type of a variable to change, hence they\
    \ are called strongly typed languages.\n\nAll of the preceding code is valid JavaScript,\
    \ and therefore could be justified, it is quick to see how this could cause runtime\
    \ errors during execution. Imagine that you were responsible for writing a library\
    \ function to add two numbers, and then another developer inadvertently reassigned\
    \ your variable to subtract these numbers instead.\n\nThese sorts of error may\
    \ be easy to spot in a few lines of code, but it becomes increasingly difficult\
    \ to find and fix these as your code base and your development team grows.\n\n\
    Another feature of strong typing is that the IDE you are working in understands\
    \ what type of variable you are working with, and can bring better autocomplete\
    \ or Intellisense options to the fore."
