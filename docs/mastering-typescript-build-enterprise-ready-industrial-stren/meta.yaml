    \ parameter at the beginning of the parameter list will generate a compile error.\n\
    \n# Function callbacks\n\nOne of the most powerful features of JavaScript – and\
    \ in fact the technology that Node is built on – is the concept of callback functions.\
    \ A callback function is a function that is passed into another function, and\
    \ is then generally invoked inside the function. Remember that JavaScript is not\
    \ strongly typed, so we can declare a variable to be either a value, or a function.\
    \ Therefore, just as we pass a value into a function, we can also pass a function\
    \ into a function.\n\nThis is best illustrated by taking a look at some JavaScript\
    \ code:\n\n```\nfunction callbackFunction = function(text) {\n  console.log('inside\
    \ callbackFunction ' + text);\n}\nfunction doSomethingWithCallback(initialText,\
    \ callback) {\n  console.log('inside doSomethingWithCallback ' + initialText);\n\
    \  callback(initialText);\n}\n```\n\n```\ndoSomethingWithACallback('myText', callbackFunction);\n\
    ```"
