- img_proc: false
  md: "# TypeScript Compatible Frameworks\n\n```\n{\n  id: 1, displayName: \"firstItem\"\
    ,\n  id: 2, displayName: \"secondItem\",\n  id: 3, displayName: \"thirdItem\"\n\
    }\nonItemClicked(event: ClickableItem) {\n  alert(`App.onItemClicked, event.id\n\
    \  ${event.displayName}\\`);\n}\n```\n\nWe, have added an onItemClicked function\
    \ with a single argument event, which is of type ClickableItem. Within this function,\
    \ we are raising a simple alert to display the properties of the item that was\
    \ clicked.\n\nAs we have seen, building Model, View, and Controller code within\
    \ Aurelia is a very simple exercise. Using the power of ECMAScript 2016 classes,\
    \ and simple HTML templates, we are able to get a lot of work done with very little\
    \ code.\n\n# Angular 2\n\nAs mentioned at the start of this chapter, Angular 2\
    \ is a complete rewrite of Angular 1, and uses TypeScript as its language of choice.\
    \ In this section of the chapter, we will take a look at how the Model View Controller\
    \ design pattern is used within Angular 2.\n\n# Angular 2 setup\n\nSimilar to\
    \ Aurelia's command-line development environment setup, Angular 2 also has a command-line\
    \ project setup tool, named the Angular-CLI. This can be installed using npm as\
    \ follows:\n\n+   - npm install -g angular-cli\n\nOnce the command-line interface\
    \ has been installed globally, we can set up an Angular 2 development environment\
    \ by using the Angular-CLI as follows:\n\n```\nng new my-app\n```"
