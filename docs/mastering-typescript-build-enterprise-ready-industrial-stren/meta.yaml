  md: "# Decorators, Generics, and Asynchronous Features\n\nWe can now create a generic\
    \ class that will work with any class implementing the IFootballClub interface,\
    \ as follows:\n\n```\nclass FootballClubPrinter<T extends IFootballClub<T>> `{\n\
    \  print(arg : T) {\n    console.log(`${arg.getName()} is ` +\n      `${this.isEnglishTeam(arg)}`\
    \ +\n      an English football team.`\n  }\n\n  isEnglishTeam(arg : T) : string\
    \ {\n    if (arg.getHomeCountry() == ClubHomeCountry.England {\n      return \"\
    \"\n    } else {\n      return \"NOT\"\n    }\n  }\n}\n```\n\nWe have defined\
    \ a generic class FootballClubPrinter that uses the generic syntax. Note that\
    \ the T generic type is now deriving from the IFootballClub interface, indicated\
    \ by the extends keyword in `< T extends IFootballClub >`. Using inheritance when\
    \ defining a generic class constraints the type of class that can be used by this\
    \ generic code. In other words, any usage of the T within the generic code will\
    \ substitute the interface IFootballClub instead. This means that the generic\
    \ code will only allow functions or properties that are defined in the IFootballClub\
    \ interface to be used wherever T is used.\n\nThese constraints can be seen within\
    \ the print function, as well as within the isEnglishTeam function. In the print\
    \ function, the argument arg is of type T, and therefore, we are able to use arg.getName(),\
    \ which has been defined in the IFootballClub interface. In the print function,\
    \ we are also calling the isEnglishTeam function, and passing the argument arg\
    \ to. The isEnglishTeam function is using the getHomeCountry function that is\
    \ also defined in the IFootballClub interface.\n\nTo illustrate how this generic\
    \ FootballClubPrinter can be used, consider the following code:\n\n```\nlet clubInfo\
    \ = new FootballClubPrinter();\nclubInfo.print(new Liverpool());\nclubInfo.print(new\
    \ BorussiaDortmund());\n```"
