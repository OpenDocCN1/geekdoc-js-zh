  md: '# Global functions


    Functions that do not have a namespace prefix can be declared in the global namespace.
    Your JavaScript defines global functions, these will need to be declared without
    a namespace.


    # The JavaScript syntax


    ```

    globalLogError("test");

    ```


    # The declaration file syntax


    ```

    declare function globalLogError(msg: string);

    ```


    # Function signatures


    A function can use a function signature as a parameter. JavaScript functions that
    use callback functions or anonymous functions, will need to be declared with the
    correct function signature.


    # The JavaScript syntax


    ```

    describe("test", function () {

    });",

    ```


    # The declaration file syntax


    ```

    declare function describe(

    name: string, functionDef: () => void);

    ```


    # Optional properties


    Classes or functions can contain optional properties. Where JavaScript object
    parameters are not mandatory, these will need to be marked as optional properties
    in the declaration.


    # The JavaScript syntax


    ```

    var classWithOptionals() = new ClassWithOptionals();

    var classWithOpt1 = new ClassWithOptionals(

    {id: 1});

    var classWithOpt2 = new ClassWithOptionals(

    {name: ''test''});

    var classWithOpt3 = new ClassWithOptionals(

    {id: 1, name: ''test''});",

    ```'
