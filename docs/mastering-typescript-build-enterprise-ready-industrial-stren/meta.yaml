  md: "# Business requirements\n\nAs an example, let's assume that our business analyst\
    \ gives us the following requirements:\n\n+   1. You are required to categorize\
    \ people, given their date of birth, into three different age groups—Infants,\
    \ Children, and Adults.\n2. Indicate with a true or false flag whether they are\
    \ of a legal age to sign a contract.\n3. A person is deemed to be an infant if\
    \ they are less than 2 years old.\n4. Infants cannot sign contracts.\n5. A person\
    \ is deemed to be a child if they are less than 18 years old.\n6. Children cannot\
    \ sign contracts either.\n7. A person is deemed to be an adult if they are more\
    \ than 18 years of age.\n8. Only adults can sign contracts.\n9. For reporting\
    \ purposes, each type of person must be able to print their details. This should\
    \ include:\n    * Date of birth\n    * Category of person\n    * Whether they\
    \ sign contracts or not\n\n# What the Factory Design Pattern does\n\nThe Factory\
    \ Design Pattern uses a Factory class to return an instance of one of several\
    \ possible classes based on the information provided to it.\n\nThe essence of\
    \ this pattern is placing the decision-making logic for what type of class to\
    \ create in a separate class named the Factory class. The Factory class will then\
    \ return one of several classes that are all subtle variations of each other,\
    \ and will do slightly different things based on their specialty. As we do not\
    \ know what class of the Factory pattern will return, we need a way to work with\
    \ any of the different types of class returned. Sounds like the perfect scenario\
    \ for an interface.\n\nTo implement our required business functionality, we will\
    \ create an Infant class, a Child class, and an Adult class. The Infant and Child\
    \ classes will return false when asked whether they can sign contracts, and the\
    \ Adult class will return true."
  merge: -1
  pgno: 131
- img_proc: false
  md: "# IPerson interface\n\nAccording to our requirements, the class instance that\
    \ is returned by the Factory must be able to do two things—print the category\
    \ of the person in the required format, and tell us whether they can sign contracts\
    \ or not. Let's start by defining an enum and an interface to satisfy this requirement:\n\
    \n```\nenum PersonCategory {\n  Infant,\n  Child,\n  Adult\n}\n\ninterface IPerson\
    \ {\n  Category: PersonCategory;\n  canSignContracts(): boolean;\n  printDetails();\n\
    }\n```\n\nWe start with an enum to hold the values for a PersonCategory, that\
    \ is, Infant, Child, or Adult. We then define an interface named IPerson, which\
    \ holds all of the functionality that is common to each type of person. This includes\
    \ their Category, a function named canSignContracts that returns true or false,\
    \ and a function to print out their details, printDetails.\n\n# The Person class\n\
    \nTo simplify our code, we will create an abstract base class to hold all code\
    \ that is common to infants, children, and adults. Again, abstract classes can\
    \ never be instantiated, and as are designed to be derived from. We will call\
    \ this class Person, as follows:\n\n```\nabstract class Person implements IPerson\
    \ {\n  Category: PersonCategory;\n  private DateOfBirth: Date;\n\n  constructor(dateOfBirth:\
    \ Date) {\n    this.EndOfBirth = dateOfBirth;\n  }\n  abstract canSignContracts():\
    \ boolean;\n  printDetails(): void {\n    console.log(`Person: `);\n    console.log(`Date\
    \ of Birth: ` +\n    + `${this.EndOfBirth.toString()}`);\n    console.log(`Category:\
    \ ` +\n    + `${PersonCategory[this.Category]}`);\n  }\\}\n}\n```"
  merge: -1
  pgno: 132
