  md: "Decorators, Generics, and Asynchronous Features\n\n# Property decorators\n\n\
    Property decorators are decorator functions that can be used on class properties.\
    \ A property decorator is called with two parameters—the class prototype itself,\
    \ and the property name. As an example of this, consider the following code:\n\
    \n```\nfunction propertyDec(target: any, propertyKey: string) {\n  console.log(`target:\
    \ ${target}`);\n  console.log(`target.constructor: ${target.constructor}`);\n\
    \  console.log(`class name : ${target.constructor.name}`);\nn  console.log(`propertyKey\
    \ : ${propertyKey}`);\n}\n\nclass ClassWithPropertyDec {\n  @propertyDec\n  name:\
    \ string;\n}\n```\n\nWe now have defined a property decorator named propertyDec\
    \ that accepts two parameters-target and propertyKey. The target parameter is\
    \ of type any, and the propertyKey parameter is of type string. Within this decorator,\
    \ we are logging some values to the console. The first value logged to the console\
    \ is the target argument itself. The second value logged to the console is the\
    \ constructor property of the target object. The third value logged to the console\
    \ is the name of the constructor function, and the fourth value is the propertyKey\
    \ argument.\n\nWe are then defining a class named ClassWithPropertyDec that is\
    \ now using this property decorator on the property named name. As in the case\
    \ with class decorators, the syntax used to decorate a property is simply @propertyDec\
    \ before the property to be decorated.\n\nThe output of this code is as follows:\n\
    \n```\ntarget : [object Object]\ntarget.constructor : function ClassWithPropertyDec()\
    \ {\n}\ntarget.constructor.name : ClassWithPropertyDec\npropertyKey : name\n```"
  merge: -1
  pgno: 144
