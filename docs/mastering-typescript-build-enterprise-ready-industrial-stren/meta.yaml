  md: "# Module merging\n\nAs we now know, the TypeScript compiler will automatically\
    \ search through all the .d.ts files in our project to pick up declaration files.\
    \ If these declaration files contain the same module name, the TypeScript compiler\
    \ will merge these two declaration files and use a combined version of the module\
    \ declarations.\n\nSuppose we have a file MergedModule1.d.ts that contains the\
    \ following definition:\n\n```\ndeclare module MergedModule {\n  function functionA();\n\
    }\n```\n\nIn addition, we have a second file named MergedModule2.d.ts that contains\
    \ the following definition:\n\n```\ndeclare module MergedModule {\n  function\
    \ functionB();\n}\n```\n\nThe TypeScript compiler will merge these two modules\
    \ as if they were a single definition:\n\n```\ndeclare module MergedModule {\n\
    \  function functionA();\n  function functionB();\n}\n```\n\nThis will allow both\
    \ functionA and functionB to be valid functions of the same MergedModule namespace\
    \ and allow the following usage:\n\n```\nMergedModule.functionA();\nMergedModule.functionB();\n\
    ```\n\n> Modules can also merge with interfaces, classes, and enums. Classes,\
    \ however, cannot merge with other classes, variables, or interfaces."
  merge: -1
