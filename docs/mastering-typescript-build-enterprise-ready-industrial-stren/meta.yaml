  md: "# Decorators, Generics, and Asynchronous Features\n\n```\nlet designReturnType\
    \ = Reflect.getMetadata(\n  \"design:retype\", target, methodName);\nconsole.log(`returntypes:\
    \ ${designReturnType}\\`);\n```\n\nHere, we updated our parameter decorator, with\
    \ three calls to Reflect.getMetadata function. The first is using the \"design:type\"\
    \ metadata key. This is the same metadata key that we saw earlier in the generated\
    \ JavaScript, where the compiler calls to the __metadata function. We are then\
    \ logging the result to the console. We then repeat this process for the \"design:paramtypes\"\
    \ and \"design:retype\" metadata keys. The output of this code is as follows:\n\
    \n```\ndesignType: function Type() { [native code] }\nparamtypes: function Number()\
    \ { [native code] }\nfunction String() { [native code] }\nreturntypes: function\
    \ Number() { [native code] }\n```\n\nWe can see from this output, that the type\
    \ of the print function (recorded by the \"design:type\" key) is a Function. We\
    \ can also see that information returned by the \"design:paramtypes\" key is an\
    \ array that includes a Number and a String. Our array, indicates that the function\
    \ has two parameters, the first of type Number, and the second of type String.\
    \ Finally, our return type for this function is a Number.\n\nMetadata is generated\
    \ automatically by the TypeScript compiler, and can be read and interrogated at\
    \ runtime is extremely useful. In other languages, such as C#, this type of metadata\
    \ information is called reflection, and is a fundamental principle when writing\
    \ frameworks for dependency injection, or for generating code analysis tools.\n\
    \n# Generics\n\nGenerics are a way of writing code that will deal with any type\
    \ of object but still maintain the object integrity. So far, we have used interfaces,\
    \ classes, and TypeScript's basic types to ensure strongly typed (and less error-prone)\
    \ code in our samples. What happens if a block of code needs to work with any\
    \ type of object?\n\nAs an example, suppose we wanted to write some code that\
    \ iterate over an array of objects and return a concatenation of their values.\
    \ Given a list of lists, say [1, 2, 3] [\"first\", \"second\", \"third\"], it\
    \ should return the string \"first second third\". We write some code that accepts\
    \ values of type any, which might introduce bugs in our code, remember S.F.I.A.T.?\
    \ Want to ensure that all elements of the array are the same type. This is where\
    \ generics come in play."
