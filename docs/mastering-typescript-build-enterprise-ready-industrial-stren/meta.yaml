  md: "Interfaces, Classes, and Inheritance\n\nOur rest function, usingRestSyntax,\
    \ can be called with any number of arguments, as we are using the rest parameter\
    \ syntax to hold these arguments in an array. Both of these calls are valid.\n\
    \nFinally, let's look at the usingFunctionCallbacks function:\n\n```\nfunction\
    \ myCallbackFunction(id: number): string {\n  return id.toString();\n  ct_1.usingFunctionCallbacks(myCallbackFunction);\n\
    ```\n\nThis snippet shows the definition of a function named myCallbackFunction,\
    \ which matches the callback signature required by the usingFunctionCallbacks\
    \ function. This allows us to pass in the myCallbackAs a parameter to the usingFunctionCallbacks\
    \ function.\n\nNote that, if you have any difficulty understanding these various\
    \ function signatures, then view the relevant sections in Chapter 2, Types, Variables,\
    \ and Function Techniques, regarding functions, where each of these concepts is\
    \ explained in detail.\n\n# Interface function definitions\n\nInterfaces, like\
    \ classes, follow the same rules when dealing with functions. To update our IComplexType\
    \ interface class definition, we need to write a function definition for each\
    \ of the new functions, as follows:\n\n```\ninterface IComplexType {\n  id: number;\n\
    \  name: string;\n  print(): string;\n  usingAnyKeyword(arg1: any): any;\n  usingOptionalParameters(optionalArg1?:\
    \ number);\n  usingDefaultParameters(defaultArg1?: number);\n  usingRestSyntax(...argArray:\
    \ number []);\n  usingFunctionCallbacks(callback: (id: number) => string);\n}\n\
    ```\n\n[ 92 ]"
