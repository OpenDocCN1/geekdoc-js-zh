  md: "# Types, Variables, and Function Techniques\n\nJavaScript programmers have\
    \ always relied heavily on documentation to understand how to call functions,\
    \ and the order and type of the correct function parameters. But what if we take\
    \ all of this documentation and include it within the IDE? Then, as we write our\
    \ code, our compiler could point out to us automatically that we were using variables\
    \ in the wrong way. Surely this would make us more efficient, more productive\
    \ programmers, allowing us to generate code with fewer errors?\n\nTypeScript does\
    \ exactly that. It introduces a very simple syntax to define the type of a variable\
    \ to ensure that we are using it in the correct manner. If we break any of these\
    \ rules, the TypeScript compiler will automatically generate errors, pointing\
    \ out the lines of code that are in error.\n\nThis is how TypeScript got its name.\
    \ It is JavaScript with strong typing, hence TypeScript. Let's take a look at\
    \ this very simple language syntax that enables the Type in Types.\n\n# Type syntax\n\
    \nThe TypeScript syntax for declaring the type of a variable is to include a colon\
    \ (:), after the variable name, and then indicate its type. Let's rewrite our\
    \ problematic doCalculation function to only accept numbers. Consider the following\
    \ TypeScript code:\n\n```\nfunction doCalculation(\n  a: number,\n  b: number,\n\
    \  c: number) {\n  return (a * b) + c;\n}\n\nvar result = doCalculation(3,2,1);\n\
    console.log(\"doCalculation\":\" + result);\n```\n\nHere, we have specified that\
    \ the doCalculation function needs to be invoked with numbers. Again, the TypeScript\
    \ syntax for declaring a type is to include a colon, and then the variable type,\
    \ hence: number for the properties a, b, and c. If we now attempt to call this\
    \ function with strings, as we did with the JavaScript sample, as we follows:\n\
    \n```\nvar result = doCalculation(\"1\", \"2\", \"3\");\nconsole.log(\"doCalculation\"\
    :\" + result);\n```\n\nThe TypeScript compiler will generate the following error:\n\
    \n```\nerror TS2345: Argument 'string' is not assignable to parameter of type\
    \ 'number'.\n```"
