  md: "# Decorators, Generics, and Asynchronous Features\n\nClearly, we are attempting\
    \ to pass an array of numbers where we should have used strings, and vice versa.\
    \ Again, the compiler warns us that we are not using the code correctly, and forces\
    \ us to resolve these issues before continuing.\n\n> These constraints on generics\
    \ are a compile-time-only feature of TypeScript. If we look at the generated JavaScript,\
    \ we will not see reams of code jumping through hoops to ensure that these rules\
    \ are carried through into the resultant JavaScript. All of these constraints\
    \ and generic syntax are actually compiled away. In the case of generics, the\
    \ generated JavaScript is actually a very simplified version of our code, with\
    \ no type in sight.\n\n# Using the type T\n\nWhen we use generics, it is important\
    \ to note that all of the code within the definition of a generic class or a generic\
    \ function must respect the properties of T as if it were any type of object.\
    \ Let's take a closer look at the implementation of the concatenate function in\
    \ this light:\n\n```\nclass Concatenator<T> {\n  concatenateArray(inputArray:\
    \ Array<T>): string {\n    let returnString = \"\";\n\n    for (let i = 0; i <\
    \ inputArray.length; i++) {\n      if (i > 0)\n        returnString += \",\";\n\
    \      returnArray[i].toString();\n    }\n    return returnString;\n  }\n}\n```\n\
    \nThe concatenate function strongly types the inputArray argument so that it should\
    \ be of type Array<T>. This means that any code that uses the argument can use\
    \ only those functions and properties that are common to all arrays, no matter\
    \ what type the array holds. We have used inputArray in two places.\n\nFirstly,\
    \ within the declaration of the for loop, where we have used the inputArray.length\
    \ property. All arrays have a length property to indicate how many items the array\
    \ has, using inputArray.length will work on any array, no matter what type of\
    \ object the array holds. Secondly, on the last line of the for loop, we referenced\
    \ an object within the array when we used the inputArray[i] syntax."
