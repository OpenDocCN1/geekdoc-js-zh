  md: '# Inferred typing


    TypeScript also uses a technique called inferring typing to determine the type
    of a variable. In other words, TypeScript will infer the type of a variable based
    on its first usage, and then assume the type for this variable in the rest of
    your code block. As an example of this, consider the following TypeScript code:


    ```

    var inferredString = "this is a string";

    inferredNumber = 1;

    inferredString = inferredNumber;

    ```


    We start by declaring a named inferredString, and assign a string value to it.
    TypeScript identifies that this has been assigned a value of type string, and
    will, therefore, infer any further usage of this variable to be of type string.
    Our second variable, named inferredNumber, has a number assigned to it. Again,
    TypeScript is inferring the type of this variable to be of number. If we attempt
    to assign the inferredString variable (of type string) to the inferredNumber variable
    (of type number) in the last line of code, TypeScript will generate a familiar
    error message:


    ```

    error TS2011: Build: Cannot convert ''string'' to ''number''

    ```


    This error is generated because of TypeScript''s inferred rules.


    Remember that if we not explicitly specify the type of a variable by using the
    colon (: type) syntax, then TypeScript will automatically infer the type of a
    variable based on its first assignment.


    # Duck typing


    TypeScript also uses a method called duck typing for more complex variable types.
    Duck typing means that it looks like a duck, and quacks like a, then it is probably
    a duck. Consider the following TypeScript code:


    ```

    var complexType = { name: "myName", id: 1 };

    complexType = { id: 2, name: "anotherName" };

    ```


    We start with a variable named complexType that has been assigned a simple JavaScript
    object with a name and an id property. On our second line of code, we are reassign
    the value of this complexType to another object that also has an id and a name
    property. The compiler will use duck typing in this instance to figure out whether
    this assignment is valid. In other words, if an object has the same set of properties
    as another object, they are considered to be of the same type.'
