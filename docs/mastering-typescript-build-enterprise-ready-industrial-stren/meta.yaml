  md: "# Types, Variables, and Function Techniques\n\nThis is a powerful feature of\
    \ TypeScript – defining in code what the signatures of functions should be, and\
    \ warning users when they do not call a function with the correct parameters.\
    \ As we saw in our introduction to TypeScript, this is most significant when we\
    \ are working with third-party libraries. Before we are able to use third-party\
    \ functions, classes, or objects in TypeScript, we need to define what their function\
    \ signatures are. We function definitions are put into a special type of TypeScript\
    \ file, called a declaration file, and saved with a .dts extension. We will take\
    \ an in-depth look at declaration files in Chapter 4, Decorators, Generics, and\
    \ Asynchronous Features.\n\n# Function overloads\n\nJavaScript is a dynamic language,\
    \ we can often call the same function with different argument types. Consider\
    \ the following JavaScript code:\n\n```\nfunction add(x,y) {\n  return x + y;\n\
    }\n\nconsole.log(`add(1,1)` + add(1,1));\nconsole.log(`add(\"1\",\"1\")` + add(\"\
    1\",\"1\"));\n```\n\nHere, we are defining a add function that returns the sum\
    \ of its two parameters, x and y. The last two lines of the preceding code snippet\
    \ log the result of the add function with different types – two numbers and two\
    \ strings. If we run the preceding code, we will see the following output:\n\n\
    ```\nadd(1,1)=2\nadd(\"1\", \"1\")=11\n```\n\nIn order to reproduce this ability\
    \ to call the same function with different types, TypeScript introduces a specific\
    \ syntax, called function overloads. If we need to replicate the code in TypeScript,\
    \ we would need to use this function syntax, as follows:\n\n```\nfunction add(a:\
    \ string, b: string) : string;\nfunction add(a: number, b:number) : number;\n\
    function add(a: any, b: any) : any {\n  return a + b;\n}\n\nconsole.log(`add(1,1)\
    \ = ${add(1,1)}`);\nconsole.log(`add(\"1\",\"1\") = ${add(\"1\",\"1\")}`);\n```"
