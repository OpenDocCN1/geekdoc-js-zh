  md: "# Aurelia models\n\nAurelia is built based on an ECMAScript 2016 standard.\
    \ This means that a standard class can be used as a model. There are no getters\
    \ and setters as we needed in Backbone, nor are there any special constructors\
    \ to hydrate the model. Classes can contain other classes, and therefore it is\
    \ very easy to define complex and nested models. Let's create our array of ClickableItems\
    \ in the src/app.ts file as follows:\n\n```\nexport class App {\n  message: string\
    \ = 'Select an Option';\n  items: ClickableItem[] = [\n    { id: 1, displayName:\
    \ \"firstItem\" },\n    { id: 2, displayName: \"secondItem\" },\n    { id: 3,\
    \ displayName: \"thirdItem\" }\n  ];\n}\n\nexport class ClickableItem {\n  displayName:\
    \ string;\n  id: number;\n}\n```\n\nHere, we have modified the class named App,\
    \ and added a new property named items that is simply an array of ClickableItem\
    \ elements.\n\nAnd that's all there is to it.\n\nIn Aurelia, standard classes\
    \ are used as models.\n\n# Aurelia views\n\nAurelia uses a naming convention to\
    \ tie classes to their views. Our class is named App, and therefore the Aurelia\
    \ runtime will search within the same directory to find an HTML template with\
    \ the same name. It will tie app.ts to app.html, and use app.html as a template.\n\
    \nWe will modify this app.html with the following snippet:\n\n```\n<template>\n\
    \  <h1>${message}</h1>\n  <ul>\n    <li repeat=\"item of items\">\n      <button>${item.displayName}</button>\n\
    \    </li>\n  </ul>\n</template>\n```"
  merge: -1
  pgno: 245
- img_proc: false
  md: "# TypeScript Compatible Frameworks\n\n+   <ul>\n  </template>\n\nHere, we have\
    \ wrapped an HTML fragment within a <template> tag. Within this template, we have\
    \ an <h1> tag that uses the ${propertyName} syntax to render the model's property\
    \ name message. We then have a <ul> tag, and within this an <li> tag.\n\nThe <li>\
    \ tag in this instance is the interesting part of this template. Note how we have\
    \ injected an attribute repeat=\"item of items\". This syntax is specific to Aurelia,\
    \ and will loop through the items property of the App class, and repeat the <li>\
    \ tag for each individual item. This will then be made available to the <li> tag\
    \ via a named item. We could have called this arrayItem, in which case our code\
    \ would need to repeat, for=\"arrayItem of items\".\n\nWithin the <li> tag, we\
    \ are simply creating a <button> tag, and using the data-binding syntax of ${item.displayName}\
    \ to render the displayName property of each array member.\n\n# Aurelia bootstrap\n\
    \nWith our view and models in place, we can turn our attention to the index.html\
    \ file at the root of the project directory. index.html file is as follows:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Aurelia</title>\n</head>\n<body\
    \ aurelia-app=\"main\">\n  <script\n    src=\"scripts/vendor-bundle.js\"\n   \
    \ data-main=\"aurelia-bootstrapper\"></script>\n</body>\n</html>\n```\n\nThis\
    \ is a very simple HTML file, which includes a page title file within the <head>\
    \ tag, and then defines a <body> tag. There are a couple of interesting things\
    \ to note about this HTML.\n\nFirstly, the <body> tag has an extra attribute,\
    \ named aurelia-app. This attribute is telling Aurelia that it should look for\
    \ a main.js file in the src directory, as the initial starting point for the application."
  merge: -1
  pgno: 246
- img_proc: false
  md: "# TypeScript Compatible Frameworks\n\nThis index.html file could not be simpler.\
    \ It has a simple naming convention to find and initiate the main class from the\
    \ src directory. Unfortunately, reading through the main.ts file, there does not\
    \ seem to be any obvious links to the app.ts file, or the App class itself. It\
    \ seems that Aurelia uses this standard naming convention as a way of finding\
    \ and bootstrapping the Aurelia environment.\n\nThere is always a slight drawback\
    \ when using naming conventions like these, where specific magic strings are embedded\
    \ within HTML attributes. When you are working, all well and good, but when you\
    \ inadvertently mistype an attribute, your web page may stop rendering completely.\
    \ Sometimes, there is precious information available to help track down these\
    \ sorts of errors, as nothing is logged to the browser console. This can also\
    \ easily happen if you rename a file, or rename a class as part of a refactoring\
    \ exercise.\n\n![](bbox=[0.128, 0.265, 0.191, 0.32])\n\nWith these precious lines\
    \ of code in place, we have a running, working demo application.\n\n# Aurelia\
    \ events\n\nThe last requirement of our sample application is to display an alert\
    \ when a user clicks on one of our buttons. In order to do this, we will need\
    \ to add a function to our App class, and bind the onclick DOM event to this function.\
    \ Let's modify our app.html template first, as follows:\n\n```\n<li repeat.for=\"\
    item of items\"\n  click.delegate=\"onClick(item)\">\n    <button>${item.displayName}</button>\n\
    </li>\n```\n\nHere, we have added a click.delegate attribute to the <li> tag,\
    \ and within it, we are calling a function named onclickItem with item as an argument.\
    \ Note that this is not defined within the <li> tag, but rather at the <li> tag\
    \ level. This means that the onclick function needs to be attached to our App\
    \ class, and not our ClickableItem class. This is slightly different to our Backbone\
    \ implementation, where each individual ItemView received the onclick event.\n\
    \nWith this in place, we can modify our App class as follows:\n\n```\nexport class\
    \ App {\n  message: string = 'Select an Option';\n  items: ClickableItem[] = [\n\
    ```"
