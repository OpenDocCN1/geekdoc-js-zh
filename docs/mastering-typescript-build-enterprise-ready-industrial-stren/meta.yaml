  md: "# The declaration file syntax\n\n```\ndeclare module OuterName {\n  module\
    \ InnerName {\n    class NestedClass {}\n  }\n}\n```\n\n# Class constructor overloads\n\
    \nClass definitions can contain constructor overloads. If your JavaScript classes\
    \ can be constructed using different types, or with multiple parameters, you will\
    \ need to list each of these variants in your declaration file as constructor\
    \ overloads.\n\n# The JavaScript syntax\n\n```\nvar myClass = new MyClass();\n\
    var myClass2 = new MyClass(1, \"test\");\n```\n\n# The declaration file syntax\n\
    \n```\ndeclare class MyClass {\n  constructor(id: number, name: string);\n  constructor();\n\
    }\n```\n\n# Class properties\n\nClasses can contain properties. You will need\
    \ to list each property of your class within your class declaration.\n\n# The\
    \ JavaScript syntax\n\n```\nvar classWithProperty = new ClassWithProperty();\n\
    classWithProperty.id = 1;\n```\n\n# The declaration file syntax\n\n```\ndeclare\
    \ class ClassWithProperty {\n  id: number;\n}\n```"
