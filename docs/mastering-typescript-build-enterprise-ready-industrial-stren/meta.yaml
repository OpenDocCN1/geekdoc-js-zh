  md: "Types, Variables, and Function Techniques\n\n# Const enums\n\nA slight variant\
    \ of the enum type is the const enum, which simply adds the keyword const before\
    \ the enum definition, as follows:\n\n```\nconst enum DoorStateConst {\n  Open,\n\
    \  Closed,\n  Ajar\n}\nvar constDoorOpen = DoorStateConst.Open;\nconsole.log(`${constDoorOpen}`);\n\
    ```\n\nconst enums have been introduced largely for performance reasons, and the\
    \ resultant JavaScript will not contain the full closure definition for the DoorStateConst\
    \ as we saw previously. Let's take a look at the JavaScript that is generated\
    \ from this DoorStateConst enum:\n\n```\nvar constDoorOpen = 0 /* Open *;\n```\n\
    \nHow do we not have a full JavaScript closure for the DoorStateConst at all.\
    \ The compiler has simply resolved the DoorStateConst.Open to its internal value\
    \ of 0, and removed the const enum definition entirely.\n\nWith const enums, we\
    \ therefore cannot reference the internal string value of an enum, as we did in\
    \ our previous code sample. If we try to reference a const enum using the array\
    \ syntax, as follows:\n\n```\nconsole.log(`${DoorStateConst[0]}`);\n```\n\nWe\
    \ get the following error message:\n\n```\nerror TS2476: A const enum member can\
    \ only be accessed using a string literal.\n```\n\nWe can, however, still use\
    \ the string property access on a const enum, as follows:\n\n```\nconsole.log(`${DoorStateConst[\"\
    Open\"]}\\`);\n```\n\nWhen using const enums, just keep in mind that the compiler\
    \ will strip away all enum definitions and simply substitute the numeric value\
    \ of the enum directly into our JavaScript code."
