  md: "# Async and await\n\nAs a further language enhancement when working with promises,\
    \ TypeScript introduces two keywords that work together when using promises. These\
    \ two keywords are async and await. The usage of async and await can be described\
    \ by considering some sample code, as follows:\n\n```\nfunction awaitDelayed()\
    \ : Promise<void> {\n  return new Promise<void> (\n    resolve: () => void,\n\
    \    reject: () => void) => {\n      function afterWait() {\n        console.log(`calling\
    \ resolve`);\n        resolve();\n      }\n\\      setTimeout(afterWait, 1000);\n\
    \    }\n  );\n```\n\nWe start with a fairly standard function named awaitDelayed\
    \ that returns a promise, similar to the examples that we have seen before. Note\
    \ that in the body of the afterWait function, we log a message to the console\
    \ before calling the resolve callback. Let's take a look at how we can use this\
    \ promise with the async and await keywords, as follows:\n\n```\nasync function\
    \ callAwaitDelayed() {\n  console.log(`call awaitDelayed`);\n  await awaitDelayed();\n\
    \  console.log(`after awaitDelayed`);\n}\n\ncallAwaitDelayed();\n```\n\nWe start\
    \ with a function named callAwaitDelayed that is prefixed by the async keyword.\
    \ Within this function, we log a message to the console, and then call the previously\
    \ defined awaitDelayed function. This time, we prefix the call to the awaitDelayed\
    \ function with the keyword await. We then log another message to the console.\
    \ The output of this code is as follows:\n\n```\nawaitDelayed\ncalling resolve\n\
    after awaitDelayed\n```"
