  md: '# # 6

    Third-Party Libraries


    Our TypeScript development environment would not amount to much if we were not
    able to reuse the myriad of existing JavaScript libraries, frameworks, and general
    goodness available today. As we have seen, however, in order to use a particular
    third-party library with TypeScript, we will need a matching definition file.


    Soon after TypeScript was released, Boris Yankov set up a GitHub repository to
    house TypeScript definition files for third-party JavaScript libraries. This repository,
    named DefinitelyTyped(https://github.com/borisyankov/DefinitelyTyped) quickly
    became very popular, and is currently the place to go for high-quality definition
    files. DefinitelyTyped currently has over 1500 definition files, built up over
    time from hundreds of contributors from all over the world. If we were to measure
    the success of TypeScript within the JavaScript community, then the DefinitelyTyped
    repository would be a good indication of how well TypeScript has been adopted.
    Before you go ahead and try to write your own definition files, check the DefinitelyTyped
    repository to see if there is already available.


    In this chapter, we will have a closer look at using these definition files, and
    cover the following topics:


    +   * Downloading definition files

    * Using NuGet within Visual Studio

    * Using Typings

    * Using Bower

    * Using npm and @types

    * Choosing a JavaScript framework

    * Using TypeScript with Backbone

    * Using TypeScript with Angular 1

    * Using TypeScript with ExtJS'
