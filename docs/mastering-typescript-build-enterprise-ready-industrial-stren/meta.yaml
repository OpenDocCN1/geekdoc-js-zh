  md: "# Decorators, Generics, and Asynchronous Features\n\nWhile this syntax may\
    \ seem a little convoluted, in general practice, these two function definitions\
    \ are combined in a single code block. The purpose of the previous two has been\
    \ to highlight two important concepts. Firstly, to use promises, you must return\
    \ a new promise object. Secondly, a promise object is constructed with a function\
    \ that takes two callback arguments.\n\nLet's look at how these two steps are\
    \ combined in general practice, as follows:\n\n```\nfunction delayedPromise()\
    \ : Promise<void> {\n  return new Promise<void>(\n    resolve : () => void,\n\
    \    reject: () => void\n  ) => {\n    function afterTimeout() {\n      resolve();\n\
    \    }\n    setTimeout(afterTimeout, 1000);\n  });\n}\n```\n\nWe, have a function\
    \ named delayedPromise that returns a new Promise<void> object. The first line\
    \ of this function constructs the new Promise object, and passes in an anonymous\
    \ function definition that takes two callback functions, named resolve and reject.\
    \ The body of the code is then defined after the fat arrow =>, and is enclosed\
    \ with matching curly braces { } . The body of the code is defining a function\
    \ afterTimeout that will be called after a second timeout. Note that the afterTimeout\
    \ function is invoking the resolve function callback.\n\nNote that this code snippet\
    \ has carefully formatted to clearly show the matching braces ( ) and matching\
    \ curly braces { } . Remember to use promises, we must construct and return a\
    \ new Promise object, and the constructor of a promise object takes a function\
    \ (or anonymous function) with two callback arguments.\n\n# Using promises\n\n\
    Promises provide a simple syntax for handling the resolve and reject functions.\
    \ Let's take a look at how we would use the promises defined in our previous code\
    \ snippet, as follows:\n\n```\nfunction callDelayedPromise() {\n  console.log(`calling\
    \ delayedPromise`);\n}\n```"
