  md: "Writing and Using Declaration Files\n\nWe will be looking at the following\
    \ topics in this chapter:\n\n+   * Global variables\n* Using JavaScript code blocks\
    \ in HTML\n* Writing your own declaration files\n* Module merging\n* Declaration\
    \ syntax reference\n\n# Global variables\n\nMost modern websites use some sort\
    \ of server-side engine to generate the HTML for their web pages. If you are familiar\
    \ with the Microsoft stack of technologies, then you would know ASP.NET MVC is\
    \ a very popular server-side engine, used to generate HTML pages based on master\
    \ pages, partial pages, and MVC views. If you are a Node developer, you may be\
    \ using one of the Node packages to help you construct web pages through templates,\
    \ such as Jade, Handlebars or Embedded JavaScript (EJS).\n\nWithin these templating\
    \ engines, you may sometimes need to set JavaScript properties on the HTML page\
    \ as a result of your server-side logic. As an example, let's assume that you\
    \ keep a list of contact-mail addresses on your database, and then surface these\
    \ to your HTML page through a JavaScript global variable named CONTACT_EMAIL_ARRAY.\
    \ Your rendered HTML page would then include a <script> tag that contains this\
    \ global variable and contact-email addresses. You may have some JavaScript that\
