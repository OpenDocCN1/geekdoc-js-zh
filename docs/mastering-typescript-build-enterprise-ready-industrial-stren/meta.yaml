  md: '# Types, Variables, and Function Techniques


    Here, we have a doCalculation function that is computing the product of the arguments
    a and b, and adding the value of c. We are then calling the function with the
    arguments 2, 3 and 1, and logging the result to the console. The output of this
    sample would be:


    ```

    doCalculation() : 7

    ```


    This is the expected result, 2 * 3 = 6, and 6 + 1 = 7. Now let''s take a look
    at what happens if we inadvertently call the function with strings instead of
    numbers:


    ```

    result = doCalculation("2","3","1");

    console.log(''doCalculation():'' + result);

    ```


    The output of this code sample is:


    ```

    doCalculation() : 61

    ```


    The result of 61 is very different from our expected result of 7. So what is going
    on here? If we take a closer look at the code in the doCalculation function, we
    start to understand what JavaScript is doing with our variables, and their types.


    The product of two numbers, is, (a * b), returns a numeric value, so JavaScript
    is automatically converting the values "2" and "3" to numbers in order to compute
    the product, and correctly computing the value 6. This is a particular rule that
    JavaScript applies in order to convert strings to numbers, when the result should
    be a number. Because the addition symbol, that is, +, does not infer that both
    values are numeric. Because the argument c is a string, JavaScript is converting
    the value 6 into a string in order to add two strings. This results in the string
    "6" being added to the string "1", which results in the value "61". Obviously,
    these sorts of automatic conversions can cause unwanted behavior in our code.


    # TypeScript


    TypeScript, on the other hand, is a strongly typed language. Once you have declared
    a variable to be of type string, you can only assign string values to it. All
    further code that uses this variable must treat it as though it has a type of
    string. This helps to ensure that code that we will will behave as expected.'
