  md: "# Decorators, Generics, and Asynchronous Features\n\nConsider the following\
    \ method decorator:\n\n```\nfunction auditLogDec(target: any,\n  methodName: string,\n\
    \  descriptor?: PropertyDescriptor {\n  let originalFunction = target[methodName];\n\
    \  let auditLogDec = function() {\n    console.log(`auditLogDec : override of\
    \ \\\n    + `${methodName} called``);\n    originalFunction.apply(this, arguments);\n\
    \  }\n  target[methodName] = auditFunction;\n}\n```\n\nHere we have defined a\
    \ method decorator auditLog. Within this decorator, we are creating a variable\
    \ named originalFunction to hold the definition of the method that we are decorating.\
    \ Remember that target[] returns the function definition itself. We then create\
    \ a new function named auditFunction. The first line of this function logs a message\
    \ to the console. However, the last line of the auditFunction function. We are\
