  md: "# Types, Variables, and Function Techniques\n\nWe, we have added a :number\
    \ type to both of the parameters of the addNumbers function (a and b), and we\
    \ have also added a :string type just after the { } braces. Placing a type annotation\
    \ after the function definition means we are defining the return type of the entire\
    \ function. In our example, then, the return type of the function addNumbers must\
    \ be of type string.\n\nUnfortunately, this code will generate an error message\
    \ as follows:\n\n```\nerror TS2322: Type 'number' is not assignable to type 'string'\n\
    ```\n\nWhat this error message is telling us is that the return type of the addNumbers\
    \ function must be a string. Unfortunately, the function itself is returning a\
    \ number, and not a string hence. Taking a closer look at the code, we note that\
    \ the offending code is, in fact, return a + b. As a and b are numbers, we are\
    \ returning the result of adding two numbers, which is of type number. To fix\
    \ this code, then, we need to ensure that the function returns a string, as follows:\n\
    \n```\nfunction addNumbers(a: number, b: number) : string {\n  return (a + b).toString();\n\
    }\n```\n\nThis code will now compile correctly, and will output:\n\n```\naddNumbers\
    \ returned : 5\n```\n\n# Anonymous functions\n\nThe JavaScript language also has\
    \ the concept of anonymous functions. These are functions that are defined on\
    \ the fly and do not specify a function name. Consider the following JavaScript\
    \ code:\n\n```\nvar addVar = function(a,b) {\n  return a + b;\n}\n\nvar addVarResult\
    \ = addVar(2,3);\nconsole.log(\"addVarResult:\" + addVarResult);\n```"
