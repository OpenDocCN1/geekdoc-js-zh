  md: "# Classes\n\nA class is a definition of an object, what data it holds, and\
    \ what operations it can perform. Classes and interfaces form the cornerstone\
    \ of the principles of object-oriented programming, and often work together in\
    \ design patterns. A design pattern is a way of using classes and interfaces in\
    \ a certain way to help tackle common programming problems. More on design patterns\
    \ later.\n\nLet's take a look at a simple class definition:\n\n```\nclass SimpleClass\
    \ {\n  id: number;\n  print() : void {\n    console.log(`SimpleClass.print() called`);\n\
    \  }\n}\n```\n\nHere, we have used the class keyword to define a class named SimpleClass,\
    \ and we have defined this class to have a property named id, and a print function.\
    \ The print function simply logs a message to the console. We can then use this,\
    \ as follows:\n\n```\nlet mySimpleClass = new SimpleClass();\nmySimpleClass.print();\n\
    ```\n\nThis code snippet shows how to create an instance of a class. We first\
    \ define a variable to hold the class instance, and then create the class using\
    \ the new keyword. This code snippet will output the following:\n\nSimpleClass.print()\
    \ called\n\n# Class properties\n\nIn order to access the properties of a class\
    \ from within a class itself, we need to use the this keyword. As an example of\
    \ this, let's update our SimpleClass definition, and print out the value of the\
    \ id property within the print function, as follows:\n\n```\nclass SimpleClass\
    \ {\n  id: number;\n  print() : void {\n    console.log(`SimpleClass has id: ${this.id}`);\n\
    \  }\n}\n```"
  merge: -1
  pgno: 104
- img_proc: false
  md: "Interfaces, Classes, and Inheritance\n\nOur print function is now referencing\
    \ the id property of the class instance within the template string, ${this.id\
    \ }. Whenever we are inside a class instance, we must use this keyword in order\
    \ to access any property or function available on the class definition. We can\
    \ now use the id property of the class instance, and call the updated print function,\
    \ as follows:\n\n```\nlet mySimpleClass = new SimpleClass();\nmySimpleClass.id\
    \ = 1001;\nmySimpleClass.print();\n```\n\nHere, we are creating our class instance\
    \ as before, and are then setting the id property of the class instance to 1001.\
    \ The output of this code will be as follows:\n\nSimpleClass has id : 1001\n\n\
    # Implementing interfaces\n\nBefore we continue, let's take a look at the relationship\
    \ between classes and interfaces. A class is a definition of an object, including\
    \ its properties and functions. An interface is the definition of a custom type,\
    \ also including its properties and functions. The only real difference is that\
    \ classes must implement functions and properties, whereas interfaces only describe\
    \ them. This allows us to use interfaces to describe some common behaviors of\
    \ a group of classes, and then write code that will work with any one of these\
    \ classes. The following class class definitions:\n\n```\nclass ClassA {\n  print()\
    \ {\n    console.log('ClassA.print()')\n  }\n}\nclass ClassB {\n  print() {\n\
    \    console.log(`ClassB.print()`)\n  }\n}\n```\n\nHere we have definitions for\
    \ two classes, ClassA and ClassB. Both of these classes just have a print function.\
    \ Suppose that we want to write some code that did not really what type of class\
    \ we use; all it cares about is whether the class has a print function. Instead\
    \ of writing a complex class that needs to deal with instances of both ClassA\
    \ and ClassB, we can easily create an interface describing the behavior we need,\
    \ as follows:"
  merge: -1
  pgno: 105
- img_proc: false
  md: "```\ninterface IPrint {\n    print();\n}\n\nfunction printClass( a : IPrint\
    \ ) {\n    a.print();\n}\n```\n\nHere, we have created an interface named IPrint\
    \ to describe the attributes of an object that we need within the printClass function.\
    \ This interface has a single function named print. Therefore, any variable that\
    \ is passed in as an argument to the printClass function must itself have a function\
    \ named print.\n\nWe can now modify our class definitions to ensure that they\
    \ can both be used by the printClass function, as follows:\n\n```\nclassA implements\
    \ IPrint {\n    print() { console.log(`classA.print()`) };\n}\n\nclassB implements\
    \ IPrint {\n    print() { console.log(`classB.print()`) };\n}\n```\n\nOur class\
    \ definitions now use the implements keyword to implement the IPrint interface.\
    \ This allows us to use both classes within the printClass function, as follows:\n\
    \n```\nlet classA = new ClassA();\nlet classB = new ClassB();\n\nprintClass(classA);\n\
    printClass(classB);\n```\n\nHere, we are creating instances of ClassA and ClassB,\
    \ and then calling the same printClass function with both instances. Because the\
    \ printClass function is written to accept any object that implements the IPrint\
    \ interface, it will work correctly with both class types.\n\nInterfaces, therefore,\
    \ are a way of describing class behavior. Interfaces can also be seen as a type\
    \ of contract that classes must implement, if they are expected to provide certain\
    \ behaviors."
  merge: -1
