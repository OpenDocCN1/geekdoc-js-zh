  md: '# Types, Variables, and Function Techniques


    This strange-looking syntax is building an object that has a specific internal
    structure. It this internal structure allows us to use this enum in the various
    ways that we have just explored. If we interrogate this structure while debugging
    our JavaScript, we will see that the internal structure of the DoorState object
    is as follows:


    ```

    DoorState

    {...

    [prototype]: {...}

    [0]: "Open"

    [1]: "Closed"

    [2]: "Ajar"

    [prototype]: []

    Ajar: 2

    Closed: 1

    Open: 0

    ```


    The DoorState object has a property "0", which has a string value of "Open". Unfortunately,
    in JavaScript the number 0 is not a valid property name, so we cannot access this
    property by simply using DoorState.0. Instead, we must access this property using
    either DoorState[0] or DoorState["0"]. The DoorState also has a property named
    Open, which is set to the numeric value 0. The word Open is a valid property name
    in JavaScript, so we can access this property using DoorState["Open"], or simply
    DoorState.Open, which equates to the property in JavaScript.


    While the underlying JavaScript can be a little confusing, all we need to remember
    about enums that they are a handy way of defining an easily remembered, human-readable
    name to a special number. Using human-readable enums, instead of just scattering
    various numbers around our code, makes the intent of the coder clearer. Using
    an application-wide value named DoorState.Open or DoorState.Closed is far simpler
    than remembering to set a value to 0 for Open, 1 for Closed, and 3 for Ajar. As
    well as making our code more readable and maintainable, using enums also protects
    our code base whenever these special numeric values change because they are all
    defined in one place.


    One last note on enum, is that we can set the numeric value manually, if required:


    ```

    enum DoorState {

    Open = 3,

    Closed = 7,

    Ajar = 10

    }

    ```


    Here, we have overridden the default values of the enum to set DoorState.Open
    to 3, DoorState.Closed to 7, and DoorState.Ajar to 10.'
