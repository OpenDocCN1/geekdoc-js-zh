  md: '# Third-Party Libraries


    ![](bbox=[0.117, 0.107, 0.882, 0.573])


    Each package will have an Install button when you select the package in the search
    results panel. When a package is selected, the right-hand pane will show more
    details about the NuGet package in question. Note that the project details panel
    also shows the version of the package that you are to install. Clicking on the
    Install button will download relevant files as well as dependencies and include
    them automatically within your project.


    The installation directory that NuGet uses for JavaScript is in fact called Scripts
    and not the lib directory that we created. NuGet uses the Scripts directory as
    a standard, so any packages that contain JavaScript will install the relevant
    JavaScript files into the Scripts directory.


    [ 183 ]'
