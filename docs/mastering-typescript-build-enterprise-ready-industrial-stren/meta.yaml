  md: '# Preface


    The TypeScript language and compiler has been a huge success story since its release
    in late 2012. It quickly carved out a solid footprint in the JavaScript development
    community and continues to go from strength to strength. Many large-scale JavaScript
    projects, including projects by Adobe, Mozilla, and Asana, have made the decision
    to switch their code base from JavaScript to TypeScript. Recently, the Microsoft
    and Google teams announced Angular 2.0 will be developed with TypeScript, merging
    the AtScript and TypeScript languages into one.


    This large-scale industry adoption of TypeScript shows the value of the language,
    the flexibility of the compiler, and the productivity gains that can be realized
    with its development toolset. ECMAScript 6 and ECMAScript 7 standards are getting
    closer and closer to publication, and TypeScript provides a way to use features
    of these standards in our applications by generating compatible JavaScript.


    Writing JavaScript single pages in TypeScript has been even more appealing with
    the large collection of declaration files that have been built by the TypeScript
    community. These declaration files seamlessly integrate a large range of existing
    JavaScript frameworks into the TypeScript development environment, bringing with
    it increased productivity, early error detection, and advanced IntelliSense features.


    The JavaScript language is not confined to web browsers, however. We can now write
    server-side JavaScript, drive mobile applications using JavaScript, and even control
    micro devices designed for the Internet of Things with JavaScript.


    This book is a guide for both experienced TypeScript developers, as well as those
    who are just beginning their TypeScript journey. With a focus on Test Development,
    detailed information on integration with many popular JavaScript libraries, and
    an in-depth look at TypeScript''s features, this book will help you with your
    exploration of the next step in JavaScript development.


    # What this book covers


    Chapter 1, TypeScript - Tools and Framework Options, sets the scene for beginning
    TypeScript development. It discusses the benefits of using TypeScript as a language
    and compiler, and then works through setting up a complete development environment
    using a number of popular IDEs.'
  merge: -1
  pgno: 20
- img_proc: false
  md: '# Preface


    Chapter 2, Types, Variables, and Function Techniques, introduces the reader to
    the TypeScript language, starting with basic types and type annotations, and then
    moves on to discuss variables, functions, and advanced language features.


    Chapter 3, Interfaces, Classes, and Inheritance, builds on the work from the previous
    chapter, and introduces the object-oriented concepts and capabilities of interfaces,
    classes, and inheritance. It then shows these concepts when working through the
    Factory Pattern.


    Chapter 4, Decorators, Generics, and Asynchronous Features, discusses the more
    advanced language features of decorators and generics, before working through
    the concepts of asynchronous programming. It shows how the TypeScript language
    supports asynchronous features through promises and the use of async await constructs.


    Chapter 5, Writing and Using Declaration Files, walks the reader through building
    a declaration file for an existing body of JavaScript code, and lists some the
    most common syntax used when writing declaration files. This syntax is designed
    to be a quick reference guide to the declaration file syntax, or a cheat sheet.


    Chapter 6, Third-Party Libraries, shows the reader how to use declaration files
    from the DefinitelyTyped repository within the development environment. It then
    moves on to show how to write TypeScript code that is compatible with three popular
    JavaScript frameworks-- Backbone, Angular 1, and ExtJs.


    Chapter 7, TypeScript Compatible Frameworks, takes a look at popular frameworks
    that have full TypeScript language integration. It explores the MVC paradigm,
    and compares how this design is implemented in Backbone, Aurelia, Angular 2, and
    React.


    Chapter 8, Test Driven Development, starts with a discussion on what Test Driven
    Development is, and then guides the reader through the process of creating various
    types of unit tests. Using the Jasmine library, it shows how to use data-driven
    tests, and how to test asynchronous logic. The chapter finishes with a discussion
    on test runners, test reporting, and using continuous integration build servers.


    Chapter 9, Testing TypeScript Compatible Frameworks, shows how to test, integration
    test, and acceptance test a sample application built with each of the TypeScript
    compatible frameworks. It discusses the concept of testability, and shows how
    subtle changes in application design and implementation can provide better application
    test coverage.


    Chapter 10, Modularization, explores what modules are, how they can be used, and
    the two types of module generation that the TypeScript compiler supports--CommonJS
    and AMD. It then shows how modules can be used with module loaders, including
    Require and SystemJs. This chapter finishes with an in-depth look at using modules
    within Node, and builds a sample Express application.


    # [ 2 ]'
  merge: -1
  pgno: 21
- img_proc: false
  md: '# Preface


    Chapter 11, Object-Oriented Programming, discusses the concepts of object-oriented
    programming, and shows how to arrange application components to conform to object-oriented
    principles. It then takes an in-depth look at implementing object-oriented best
    practices by showing how the State and Mediator design patterns can be used to
    manage complex interactions.


    Chapter 12, Dependency Injection, discusses the concepts of Service Location and
    Dependency Injection, and how they can be used to solve common application design
    problems. It then shows how to implement a simple Dependency Injection framework
    using Decorators.


    Chapter 13, Building Applications, explores the fundamental building blocks of
    web application development, including generating HTML pages from Node and Express,
    writing and consuming REST endpoints, and data binding. It shows how to integrate
    an Express server, REST endpoints, and data binding with Angular 2, and React.


    Chapter 14, Let''s Get Our Hands Dirty, builds a single-page application using
    Angular 2 and Express by combining all of the concepts and components built throughout
    the book into a single application. These concepts include Test Driven Development,
    the State and Mediator Pattern, using REST endpoints, object-oriented design principles,
    modularization, and custom CSS animations.


    # What you need for this book


    You will need the TypeScript compiler and an editor of some sort. The TypeScript
    compiler is available on Windows, MacOS, and Linux as a Node plugin. Chapter 1,
    TypeScript - Framework Options, describes the setup of a development environment.


    # Who this book is for


    Whether you are a JavaScript developer wanting to learn TypeScript, or an experienced
    TypeScript developer wanting to take your skills to the next level, this book
    is for you. From basic to advanced language constructs, Test Driven Development,
    and object-oriented techniques, you will learn how to get the most out of the
    TypeScript language and compiler. This book will show you how to incorporate strong
    typing, object-orientation, and design best practices into your JavaScript applications.'
  merge: -1
