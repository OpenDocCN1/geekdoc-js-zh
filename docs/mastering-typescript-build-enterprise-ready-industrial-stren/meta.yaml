  md: 'Types, Variables, and Function Techniques


    # Template strings


    Before we continue our discussion on types, it is worth noting that TypeScript
    allows for ES6 template syntax. This syntax provides a convenient method for injecting
    values into strings. Consider the following code:


    ```

    var myVariable = "test";

    console.log("myVariable=" + myVariable);

    ```


    Here, we are simply assigning a value to a variable, and logging the result to
    the console, with a little bit of formatting to make the message readable. Now
    we are concatenating the strings with the "string" + variable syntax. Let''s take
    a look at the equivalent TypeScript code:


    On the second line of this code snippet we have introduced the ES6 template syntax
    for easier manipulation of strings. There are two important points to note about
    this syntax. Firstly, we have switched the string definition from a double quote
    (") to an apostrophe (''). Using an apostrophe signals to the TypeScript compiler
    that it should look for template values within the string enclosed by the apostrophes,
    and replace them with actual values. Secondly, we have used a special ${ ... }
    syntax within the string to denote a template. TypeScript will inject the value
    of any variable that is currently in scope into the string for us. This is a convenient
    method of dealing with strings.


    The TypeScript compiler will parse this ES6 style of string templates, and generate
    JavaScript code that uses standard string concatenation. In this way, the ES6
    string template syntax can be used no matter what JavaScript version is targeted.


    In the remainder of this chapter, we will use this string template syntax.


    # Arrays


    Besides the base JavaScript types of string, number, and boolean, TypeScript has
    two other basic data types that we now take a closer look at – arrays and enums.
