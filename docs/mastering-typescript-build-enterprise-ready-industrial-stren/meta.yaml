    \ 0.193, 0.269])\n\n# Basic types\n\nJavaScript variables can hold a number of\
    \ data types, including numbers, strings, arrays, objects, functions, and more.\
    \ The type of an object in JavaScript is determined by its assignment. This means\
    \ that only at the point where we assign a value to a variable does the JavaScript\
    \ runtime interpreter try to determine the type of the particular variable. While\
    \ this may work in simple cases, the JavaScript runtime can also reassign the\
    \ type of a variable depending on how it is being used, or on how it is interacting\
    \ with other variables. It may assign a number to a string, for example, in certain\
    \ cases. Let's look at an example of this dynamic typing in JavaScript, and what\
    \ errors it can introduce, before exploring the strong typing that TypeScript\
    \ uses, and its basic type system.\n\n# JavaScript typing\n\nAs we saw in Chapter\
    \ 1, TypeScript – Tools and Framework Options, JavaScript objects and variables\
    \ can be changed or reassigned on-the-fly. As an example of this, consider the\
    \ following JavaScript code:\n\n```\nfunction doCalculation(a,b,c) {\n  return\
    \ (a * b) + c;\n}\nvar result = doCalculation(2,3,1);\nconsole.log('doCalculation():'\
    \ + result);\n```\n\n[ 45 ]"
