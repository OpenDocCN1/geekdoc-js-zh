  md: "Interfaces, Classes, and Inheritance\n\nWhat this output shows us is that the\
    \ static property named StaticCount.count is indeed shared between two instances\
    \ of the same class, that is, firstInstance and secondInstance. It starts out\
    \ as 0, and is incremented when firstInstance.updateCount is called. When we create\
    \ a new instance of the class, it also retains its original value of 1 for this\
    \ class instance. When secondInstance updates this count, it will also be updated\
    \ for firstInstance.\n\n# Namespaces\n\nWhen working with large projects, and\
    \ particularly when working with external libraries, there may come time when\
    \ two classes or interfaces share the same name. This will obviously cause compilation\
    \ errors. TypeScript uses the concept of namespaces to cater for these situations.\n\
    \nLet's take a look at the syntax used for namespaces, as follows:\n\n```\nnamespace\
    \ Namespace {\n  class NotExported {\n  } export class NamespaceClass {\n    id:\
    \ number;\n  }\n}\n```\n\nHere, we are defining a namespace using the namespace\
    \ keyword, and have called this namespace FirstNamespace. A namespace declaration\
    \ is similar to a class declaration, that it is scoped by the opening and closing\
    \ braces, that is, starts the namespace, and } closes the namespace. This namespace\
    \ has two classes defined within it. These classes are named NotExported, and\
    \ NamespaceClass.\n\nWhen using namespaces, a class definition will not be visible\
    \ outside the namespace, unless we specifically allow this using the export keyword.\
    \ To create classes that are defined within a namespace, we must reference the\
    \ class using the full namespace name. Let's take a look at how we create instances\
    \ of these classes:\n\n```\nlet firstNamespace = new FirstNamespace.NamespaceClass();\n\
    let notExported = new FirstNamespace.NotExported();\n```\n\n[ 100 ]"
