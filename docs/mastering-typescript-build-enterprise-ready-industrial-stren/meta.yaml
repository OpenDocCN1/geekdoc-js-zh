  md: "# Interfaces, Classes, and Inheritance\n\n+   * Have default parameters\n*\
    \ Use argument arrays, or the rest parameter syntax\n* Allow function callbacks\
    \ and specify the function callback signature\n* Allow function overloads\n\n\
    As an example of each of these rules, let's examine a class that has a number\
    \ of different function signatures, and we will then discuss each one in detail,\
    \ as follows:\n\n```\nclass ComplexType implements IComplexType {\n  id: number;\n\
    \  name: string;\n  constructor(idArg: number, nameArg: string);\n  constructor(idArg:\
    \ string, nameArg: string);\n  constructor(idArg: any, nameArg: any) {\n    this.id\
    \ = idArg;\n    this.name = nameArg;\n  }\n  print(): string {\n    return \"\
    id:\" + this.id + \"name:\" + this.name;\n  }\n  usingTheAnyKeyword(arg1: any):\
    \ any {\n    this.id = arg1;\n  }\n  usingOptionalParameters(optionalArg1?: number)\
    \ {\n    if (optionalArg1) {\n      this.id = optionalArg1;\n    }\n  }\n  usingDefaultParameters(defaultArg1:\
    \ number = 0) {\n    this.id = defaultArg1;\n  }\n  usingRestSyntax(...argArray:\
    \ number []) {\n    if (argArray.length > 0) {\n      this.id = argArray[0];\n\
    \    }\n  }\n  usingFunctionCallbacks(callback: (id: number) => string) {\n  \
    \  callback(this.id);\n  }\n}\n```"
  merge: -1
  pgno: 108
- img_proc: false
  md: "The first thing to note is the constructor function. Our class definition is\
    \ using function overloading for the constructor function, allowing the class\
    \ to be constructed using either a number and a string, or two strings. The following\
    \ code shows how we would use each of these constructor definitions:\n\n```\n\
    let ct_1 = new ComplexType(1, \"ct_1\");\nlet ct_2 = new ComplexType(\"abc\",\
    \ \"ct_2\");\nlet ct_3 = new ComplexType(true, \"test\");\n```\n\nThe ct_1 variable\
    \ uses the number, string variant of the constructor function, and the ct_2 variable\
    \ uses the string, string variant. The ct_3 variable will generate a compile error,\
    \ as we are not allowing a constructor to use a boolean, boolean variant. You\
    \ may argue, however, that the last constructor specifies an any, and this should\
    \ allow for the boolean, boolean usage. Remember that constructor overloads follows\
    \ the same rules as the function overloads we discussed in Chapter 2, Types, Variables,\
    \ and Function Techniques.\n\nWe must be careful when using overloaded constructors,\
    \ however. Let's take a look at what happens when we call the class, string variant\
    \ of the constructor:\n\n```\nlet ct_2 = new ComplexType(\"abc\", \"ct_2\");\n\
    ct_2.print();\n```\n\nWithin the constructor function, we are assigning the value\
    \ of the idArg argument to the id property on the class, as follows:\n\n```\n\
    class ComplexType implements IComplexType {\n  id: number;\n  name: string;\n\
    \  constructor(idArg: number, nameArg: string);\n  constructor(idArg: string,\
    \ nameArg: string);\n  constructor(idArg: any, nameArg: any) {\n    this.id =\
    \ idArg;\n    // careful assigning a string to a number type\n    this.name =\
    \ nameArg;\n  }\n```\n\nEven though we have defined the id property of the class\
    \ to be of type number, when we call the constructor function with a string (we\
    \ have a constructor overload), the id property will be \"abc\", which is clearly\
    \ not a number type. TypeScript will not generate an error in this case, and will\
    \ not automatically try to convert the value \"abc\" to a number. In cases where\
    \ this type functionality is required, we would need to use type guards to ensure\
    \ type safety, as follows:"
