  md: "# Static properties\n\nSimilar to static functions, classes can also have static\
    \ properties. If a property of a class is marked as static, each instance of this\
    \ class will have the same value for the property. In other words, all instances\
    \ of the class will share the static property. Consider the following code:\n\n\
    ```\nclass StaticProperty {\n  static count = 0;\n  updateCount() {\n    StaticProperty.count++;\n\
    \  }\n}\n```\n\nThis definition uses the static keyword on the class property\
    \ count. It has a function named updateCount, which increments the static count\
    \ property. Note the syntax within the updateCount function. Normally, we would\
    \ use the this keyword to access properties of a class. Here, we need to reference\
    \ the full name of the property, including the class name, that is, StaticProperty.count,\
    \ to access this property. This is similar to what we have seen for static functions.\
    \ We can use this class, as follows:\n\n```\nlet sharedInstance = new StaticProperty();\n\
    \nconsole.log(`StaticProperty.count = ${StaticProperty.count}`);\nfirstInstance.updateCount();\n\
    console.log(`${StaticProperty.count}`);\n\nlet secondInstance = new StaticProperty();\n\
    secondInstance.updateCount();\nconsole.log(`${StaticProperty.count}`);\n```\n\n\
    This code snippet starts with a new instance of the StaticProperty class named\
    \ sharedInstance. We are then logging the value of StaticProperty.count to the\
    \ console. We then call the updateCount function on this instance of the class,\
    \ and log the value of StaticProperty.count to the console. We create another\
    \ instance of this class, named secondInstance, call the updateCount function,\
    \ and log the value of StaticProperty.count to the console. This code snippet\
    \ will output the following:\n\n```\nStaticProperty.count = 0\nStaticProperty.count\
    \ = 1\nStaticProperty.count = 2\n```"
