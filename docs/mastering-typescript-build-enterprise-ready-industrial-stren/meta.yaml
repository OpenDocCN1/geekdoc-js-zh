    \ an object with only the { id: 2 } property to the variable item1 on the second\
    \ line of code. This technique of using the < syntax on the right-hand side of\
    \ an assignment is called explicit casting.\n\nWhile the any type is a necessary\
    \ feature of the TypeScript language and is used for backward compatibility with\
    \ JavaScript, its usage should be limited as much as possible. As we have seen\
    \ with untyped JavaScript, over-use of the any type will quickly lead to coding\
    \ errors that will be difficult to find.\n\nRather than using the any, to figure\
    \ out the correct type of the object you are using, and then use this instead.\
    \ We use an acronym within our programming teams-Simply Find an Interface for\
    \ the Any Type (S.F.I.A.T) pronounced as svat or sweat. While this may sound silly,\
    \ simply find it brings home that the any type should be replaced with an interface,\
    \ which we will cover in the next chapter. Remember that, by actively defining\
    \ what an object's type should be, we are building strongly typed code, and therefore,\
    \ protecting ourselves from future coding errors and bugs.\n\n# Enums\n\nEnums\
    \ are a special type borrowed from other languages such as C#, C++, and Java,\
    \ and provides a solution to the problem of special numbers. An enum associates\
    \ a human-readable name for a specific number. Consider the following code:\n\n\
    ```\nenum DoorState {\n  Open,\n  Closed,\n  Ajar\n}\n```\n\nHere, we have defined\
    \ an enum called DoorState to represent the state of a door. Valid values for\
    \ this door state are Open, Closed, and Ajar. Under the hood (in the generated\
    \ JavaScript), TypeScript will assign a numeric value to each of these human-readable\
    \ enum values. In this example, the DoorState.Open enum value will equate to a\
    \ numeric value of 0. Likewise, the enum value DoorState.Closed will equate to\
    \ the numeric value of 1. Let's take a quick look at how we would use these values:\n\
    \n```\nvar openDoor = DoorState.Open;\nconsole.log(`openDoor is: ${openDoor}\\\
    `);\n```"
