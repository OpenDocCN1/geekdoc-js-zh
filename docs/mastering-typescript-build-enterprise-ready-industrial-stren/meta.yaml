  md: "# Decorators, Generics, and Asynchronous Features\n\nHere, we have created\
    \ another decorator named secondDecorator which also simply logs a message to\
    \ the console. We are applying both the simpleDecorator (from our earlier code\
    \ snippet) and the secondDecorator decorators to the class definition of the class\
    \ named ClassWithMultipleDecorators. The output of this code is as follows:\n\n\
    ```\nsecondDecorator called.\nsimpleDecorator called.\n```\n\nThe output of this\
    \ code shows an interesting point about decorators. They are called in reverse\
    \ order of their definition.\n\nDecorators are evaluated in the order they appear\
    \ in the code, but are then called in reverse order.\n\n![](bbox=[0.136, 0.311,\
    \ 0.196, 0.36])\n\n# Decorator factories\n\nIn order to allow for decorators to\
    \ accept parameters, we need to use what is known as a decorator factory. A decorator\
    \ factory is simply a wrapper function that returns the decorator function itself.\
    \ As an example of this, consider the following code:\n\n```\nfunction decoratorFactory(name:\
    \ string) {\n  return function (constructor : Function ) {\n    console.log(`decorator\
    \ function called with : ${name}`);`\n  }\n}\n```\n\nHere, we have defined a function\
    \ named decoratorFactory that accepts a single argument, name of type string.\
    \ This function simply returns an anonymous decorator function that takes a single\
    \ argument constructor of type Function. The anonymous function (our decorator\
    \ function) logs the value of the name parameter to the console.\n\nNote here\
    \ we have wrapped the decorator function within the decoratorFactory function.\
    \ This wrapping of a decorator function is what produces a decorator factory.\
    \ As long as the wrapping function returns a decorator function, this is a valid\
    \ decorator factory.\n\nWe can now use our decorator factory, as follows:\n\n\
    ```\n@decoratorFactory('userName')\nclass ClassWithDecoratorFactory {\n```"
