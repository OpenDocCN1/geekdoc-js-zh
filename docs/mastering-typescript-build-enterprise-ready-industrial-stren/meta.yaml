  md: "# Third-Party Libraries\n\nWe can now update our NoteModel class definition\
    \ to implement this interface as follows:\n\n```\nclass NoteModel extends Backbone.Model\
    \ implements INoteModel {\n  // existing code\n}\n```\n\nOur class definition\
    \ now implements the INoteModel TypeScript interface. This simple change protects\
    \ our code from being modified inadvertently, and also opens up the ability to\
    \ work with core Backbone objects in standard object-oriented design patterns.\
    \ If we needed to, apply the Factory Pattern described in Chapter 3, Interfaces,\
    \ Classes and Inheritance, to return a particular type of Backbone Model or any\
    \ other Backbone object for that matter.\n\n# Using generic syntax\n\nThe declaration\
    \ file for Backbone has also added generic syntax to some class definitions. This\
    \ brings with it further strong typing benefits when writing TypeScript code for\
    \ Backbone. Backbone collections (surprise, surprise) have a collection of Backbone\
    \ models, allowing us to define collections in TypeScript as follows:\n\n```\n\
    class NoteCollection extends Backbone.Collection<NoteModel> {\n  model = NoteModel;\n\
    \  model: { new ( ) : NoteModel }; // ok\n}\n```\n\nWe have a NoteCollection that\
    \ derives from, or extends Backbone.Collection, but also uses generic to constrain\
    \ the collection to handle only objects of type NoteModel. This means that the\
    \ standard collection functions such as at() or pluck() will be strongly typed\
    \ to return NoteModel, further enhancing our type safety and Intellisense.\n\n\
    Note the syntax used to assign a type to the internal model property of the collection\
    \ class on the second line. We cannot use the standard TypeScript syntax model:\
    \ NoteModel, as this causes a compile error. We need to assign the model property\
    \ to the class definition, as seen with the model=NoteModel syntax, or we can\
    \ use the { new() : NoteModel } syntax, as seen on the last line.\n\n[ 195 ]"
  merge: -1
  pgno: 214
- img_proc: false
  md: "# Using ECMAScript 5\n\nBackbone also allows us to use ECMAScript 5 capabilities\
    \ to define getters and setters for Backbone.Model classes, as follows:\n\n```\n\
    interface ISSimpleModel {\n  Name: string;\n  Id: number;\n}\nclass SimpleModel\
    \ extends Backbone.Model\nimplements ISSimpleModel {\n  get Name() {\n    return\
    \ this.get('Name'); \n  }\n  set Name(value: string) {\n    this.set('Name', value);\
    \ \n  }\n  get Id() {\n    return this.get('Id'); \n  }\n  set Id(value: number)\
    \ {\n    this.set('Id', value); \n  }\n}\n```\n\nWe, have defined an interface\
    \ with two properties, named ISSimpleModel. We then define a SimpleModel class\
    \ that derives from Backbone.Model, and also implements the ISSimpleModel interface.\
    \ We then have ES5 getters and setters for Name and Id properties. Backbone uses\
    \ class attributes to store model values, so our getters and setters simply call\
    \ the underlying get and set methods of Backbone.Model.\n\n# Backbone TypeScript\
    \ compatibility\n\nAs we have seen, Backbone allows us to use all of TypeScript's\
    \ language features within our code. We can use classes, interfaces, inheritance,\
    \ generics, and even ECMAScript 5 properties. All of our classes also derive from\
    \ Backbone objects. This makes Backbone a highly compatible library for building\
    \ web applications with TypeScript. We will explore more of the Backbone object\
    \ model in later chapters."
  merge: -1
