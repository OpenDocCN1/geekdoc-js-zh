  md: "# Default parameters\n\nA subtle variant of the optional parameter syntax allows\
    \ to specify the default value of a parameter. If an optional parameter value\
    \ is not supplied, we can specify the default value of this optional parameter\
    \ should be. Let's modify our preceding function definition to use an optional\
    \ parameter with a default value, as follows:\n\n```\nfunction concatStringsDefault(\n\
    \  a: string,\n  b: string,\n  c: string = \"c\") {\n  return a + b + c;\n}\n\n\
    var defaultConcat = concatStringsDefault(\"a\", \"b\");\nconsole.log(`defaultConcat\
    \ = ${defaultConcat}\\`);\n```\n\nThis function has dropped the ? optional parameter\
    \ syntax, but has assigned a value of \"c\" to the last parameter: c:string =\
    \ \"c\". By using default parameters, if we do not supply a value for the first\
    \ parameter c, the concatStringsDefault function will substitute the default value\
    \ of \"c\" instead. The argument c, therefore, will not be undefined. The output\
    \ of this code will therefore be:\n\n```\ndefaultConcat : abc\n```\n\n> Note that\
    \ using the default parameter syntax will automatically make the parameter that\
    \ has a default option.\n\n# Rest parameters\n\nThe JavaScript language also allows\
    \ a function to be called with a special number of arguments. Every JavaScript\
    \ function has access to a special variable, named arguments, that can be used\
    \ to retrieve all arguments that have been passed into the function. As an example\
    \ of this, consider the following JavaScript code:\n\n```\nfunction testArguments()\
    \ {\n  if (arguments.length > 0) {\n    for (var i = 0; i < arguments.length;\
    \ i++) {\n      console.log(\"\" + i + \": = \" + arguments[i]);\n    }\n  }\n\
    }\nntestArguments(1,2,3);\n```"
