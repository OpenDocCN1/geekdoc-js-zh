  md: "# Decorators, Generics, and Asynchronous Features\n\nDecorators are an experimental\
    \ feature of the TypeScript compiler, and have been proposed as part of the ECMAScript\
    \ 7 standard. TypeScript, however, allows for the use of decorators in ES3 and\
    \ above. In order to use decorators, a new compile option needs to be added to\
    \ the tsconfig.json file in the root of your project directory. This option is\
    \ named experimentalDecorators, and needs to be set to true, as follows:\n\n```\n\
    {\n  \"compilerOptions\": {\n    \"module\": \"commonjs\",\n    \"target\": \"\
    es3\",\n    \"sourceMap\": \"true\",\n    \"experimentalDecorators\": true\n \
    \ },\n  \"exclude\": [\n    \"node_modules\"\n  ]\n}\n```\n\n# # Decorator syntax\n\
    \nA decorator is simply a function which is called with a specific set of parameters.\
    \ These parameters are automatically populated by the JavaScript runtime, and\
    \ contain information about the class to which the decorator has been applied.\
    \ The number of parameters and the types of these parameters determine where a\
    \ decorator can be applied. To illustrate the syntax for decorators, let's define\
    \ a simple class decorator, as follows:\n\n```\nfunction simpleDecorator(constructor\
    \ : Function) {\n  console.log('simpleDecorator called.');\n}\n```\n\nHere we\
    \ have defined a function named simpleDecorator that takes a single parameter,\
    \ named constructor of Type. This simpleDecorator function simply logs a message\
    \ to the console indicating that it has been called. In order to use it, we will\
    \ need to apply it to a class definition, as follows:\n\n```\n@simpleDecorator\n\
    class ClassWithSimpleDecorator {\n}\n```\n\nHere, we have applied the decorator\
    \ to the class definition of ClassWithSimpleDecorator by using the symbol (@),\
    \ followed by the decorator name. Running this simple decorator code will produce\
    \ the following output:\n\n```\nsimpleDecorator called.\n```"
  merge: -1
  pgno: 139
- img_proc: false
  md: "# Decorators, Generics, and Asynchronous Features\n\nNote, however, we have\
    \ not created an instance of the class as yet. We have simply specified the class\
    \ definition, added a decorator function has automatically been called. This indicates\
    \ to us that the decorators are applied when a class is being defined, and not\
    \ when it is being instantiated. For a further example of this, consider the following\
    \ code:\n\n```\nlet instance_1 = new ClassWithSimpleDecorator();\nlet instance_2\
    \ = new ClassWithSimpleDecorator();\n\nconsole.log(`${instance_1}`);`\nconsole.log(`${instance_2}\
    \ : ${instance_2}`);`\n```\n\nHere, we have created two instances of the ClassWithSimpleDecorator\
    \ class, named instance_1 and instance_2. We are then simply logging a message\
    \ to the console. The output of this snippet is as follows:\n\n+   * simpleDecorator\
    \ called.\n* instance_1 : [object Object]\n* instance_2 : [object Object]\n\n\
    What this output shows us is that the decorator function has only been called\
    \ once, no matter how many instances of the same class have been created or used.\
    \ Decorators are only invoked as the class is being defined.\n\n# Multiple decorators\n\
    \nMultiple decorators can be applied one after another to the same target. As\
    \ an example of this, consider the following code:\n\n```\nfunction secondDecorator(constructor\
    \ : Function) {\n  console.log('secondDecorator called.')\n}\n\n@simpleDecorator\n\
    @secondDecorator\nclass ClassWithMultipleDecorators {\n}\n```"
