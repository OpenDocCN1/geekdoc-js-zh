  md: 'Our ClickItem class has been modified in three places. Firstly, we have created
    a new function named handleClick, which will create an alert showing the properties
    of the model that we used to create this view. This alert function is accessing
    the properties via the this.props.propertyName syntax.


    The second modification we have made to this class is in the render function.
    We have modified the HTML snippet to include an onclick attribute, and bound this
    to the (this.handleClick) function. This is similar to the modifications we have
    made for Aurelia (click.delegate="functionToCall") and Angular (click)=functionToCall),
    to bind the DOM event to our function call.


    The third modification we have made to this class is in the constructor. After
    the call to super, we are calling this.handleClick=this.handleClick.bind(this).
    This strange syntax is actually binding whatever we created to render array item
    as the correct this. use the instance of the class to call. Remember that when
    an onclick event is received by the ClickItem class, it has been generated by
    the DOM event, and the value of this will be set by the context of the button
    (the calling context). Binding to this means the this variable within the class
    will not reference the calling context, but rather the context of the entire class.
    It means that the this parameter is correctly referencing the class instance instead
    of the calling context, and that we can access other properties and functions
    within the class correctly.


    With these DOM listeners in place, our application is complete and working with
    the React framework.


    # Summary


    In this chapter, we took a deep dive into what an MVC framework is, and discussed
    each of its elements. We discussed the role and responsibilities of the Model,
    the View, and the Controller in MVC, and how they interact to create user interfaces.
    We also had a brief discussion on the benefits of using MVC frameworks. We then
    took a look at four frameworks that have very tight integration with TypeScript,
    or have been written with TypeScript in. We implemented the same basic application
    in each of these frameworks, and compared the differences in concepts and syntax
    between Backbone, Aurelia, Angular 2, and React. We also discussed some performance
    implications to think about when working with each of these frameworks. In our
    next chapter, we will take a look at automated testing — unit testing, integration
    testing, and acceptance testing for our TypeScript applications.'
