  md: "# Decorators, Generics, and Asynchronous Features\n\nWhile these sort of callback\
    \ functions are fairly standard in JavaScript, it can make our code difficult\
    \ to read, as well as difficult to understand, especially as our code base grows\
    \ larger and larger. Promises on the other hand, provide a fluent syntax for handling\
    \ asynchronous calls.\n\n# Promise syntax\n\nA promise is an object that is created\
    \ by passing in a function that accepts two callbacks. The first callback is used\
    \ to indicate a successful response, and the second callback is used to indicate\
    \ an error response. Consider the following function definition:\n\n```\nfunction\
    \ fnDelayedPromise (\n  resolve: () => void,\n  reject: () => void\n{\n  function\
    \ setTimeout() {\n    resolve();\n  }\n  setTimeout(setTimeout, 2000);\n}\n```\n\
    \nHere, we have defined a function fnDelayedPromise that takes two functions as\
    \ arguments. These functions are named resolve and reject, and they return a void.\
    \ Within the body of the fnDelayedPromise function, we are again calling the calling\
    \ setTimeout (on the last line of the function) to wait for two seconds before\
    \ calling the resolve callback function.\n\nWe can use this function to construct\
    \ a promise object, as follows:\n\n```\nfunction delayedResponsePromise() : Promise<void>\
    \ (\n  return new Promise<void>(\n    fnDelayedPromise\n  );\n);\n```\n\nHere,\
    \ we have created a function delayedResponsePromise that returns a new Promise<void>\
    \ object. Within the body of the function, we are simply creating and returning\
    \ a new promise object, and using our earlier function definition fnDelayedPromise\
    \ as the only argument within its constructor. Note that the void type is used\
    \ to create a promise using generic syntax (new Promise<void>) to indicate some\
    \ information on the return type of the promise. We will discuss the use of the\
    \ generic <void> syntax a little later, when we explore how to return values from\
    \ promises."
