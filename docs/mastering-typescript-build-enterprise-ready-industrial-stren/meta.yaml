    \ will not cause compilation errors, as each class (prefixed by the namespace\
    \ name) is seen by the compiler as a separate class name.\n\n# Inheritance\n\n\
    Inheritance is another paradigm that is one of the cornerstones of object-oriented\
    \ programming. Inheritance means that an object uses another as its base type,\
    \ thereby inheriting all of the base object's characteristics. In other words,\
    \ all of the base object's properties and functions. Both interfaces and classes\
    \ can use inheritance. An interface or class that is inherited from is known as\
    \ the base interface, base class, and the interface or class that does the inheritance\
    \ is known as the derived interface, or derived class. TypeScript implements inheritance\
    \ using the extends keyword."
