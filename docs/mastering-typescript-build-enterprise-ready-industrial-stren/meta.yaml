  md: "# Types, Variables, and Function Techniques\n\nThe TypeScript compiler is now\
    \ generating compile errors because it has detected that we are attempting to\
    \ mix these basic types. The first error is generated because we cannot assign\
    \ a number value to a variable of type `string`. Similarly, the second compile\
    \ error indicates that we cannot assign a `string` value to a variable of type\
    \ `boolean`. Again, the third error is generated because we cannot assign a boolean\
    \ value to a variable of number.\n\nThe strong typing syntax that the TypeScript\
    \ language introduces means we need to ensure that the types on the left-hand\
    \ side of an assignment operator (=) are the same as the types on the right-hand\
    \ side of the assignment operator.\n\nTo fix the preceding TypeScript code, and\
    \ remove the compile errors, we would need to do something like the following:\n\
    \n```\nmyString = number.toString();\nmyBoolean = (myString === \"test\");\nif\
    \ (myBoolean) {\n  myNumber = i;\n}\n```\n\nOur first line of code has been changed\
    \ to call the `.toString()` function on the `myNumber` variable (which is of type\
    \ `number`), in order to return a value that is of type `string`. This line of\
    \ code, then, does not generate a compile error because both sides of the equal\
    \ sign (or assignment operator) are strings.\n\nOur second line of code has also\
    \ been changed so that the right-hand side of the assignment operator returns\
    \ the result of a comparison, `myString === \"test\"`, which will return a value\
    \ of type `boolean`. The compiler will therefore allow this code, because both\
    \ sides of the assignment resolve to a value of type `boolean`.\n\nThe last line\
    \ of code snippet has been changed to only assign the value `i` (which is of type\
    \ `number`) to the `myNumber` variable, if the value of the `myBoolean` variable\
    \ is `true`.\n\nAnders Heijsberg describes this feature as \"syntactic sugar\"\
    . In other words, with a little \"sugar\" on top of comparable JavaScript, TypeScript\
    \ has enabled these strong typing rules, the compiler will generate errors for\
    \ your offending code."
