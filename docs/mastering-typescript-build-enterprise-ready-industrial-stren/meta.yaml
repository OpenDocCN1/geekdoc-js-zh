    # Using NuGet


    Instead of manually downloading each .d.ts declaration file for our project, we
    can also use NuGet. NuGet is a popular package management platform that will download
    required external libraries, and automatically include them within your Visual
    Studio or WebMatrix project. It can be used for external libraries that are packaged
    as DLLs such as StructureMap or it can be used for JavaScript libraries and declaration
    files. NuGet is also available as a command-line utility.


    # Using the Extension Manager


    To use the NuGet package manager dialog within Visual Studio, select the Tools
    option on the main toolbar, select NuGet Package Manager, and finally select Manage
    NuGet Packages for Solution. This brings up the NuGet package manager dialog.
    On the left-hand side of the dialog, click on Browse. The NuGet dialog will then
    query the NuGet website and show a list of available packages. At the top left
    of the screen is a search box. Click within the search box, and type jquery to
    show all packages available within NuGet for jQuery, as shown in the following
    screenshot:'
  merge: -1
