  md: "# Abstract classes\n\nAnother fundamental principle of object-oriented design\
    \ is the concept of abstract classes. An abstract class is a definition of a class\
    \ that cannot be instantiated. In other words, it is a class that is designed\
    \ to be derived from. The abstract classes, sometimes referred to as abstract\
    \ base classes, are often used to provide a set of basic functionality or properties\
    \ that are shared amongst a group of similar classes. They are similar to interfaces\
    \ in that they cannot be instantiated but they can have function implementations,\
    \ which interfaces.\n\nAbstract classes are a technique that allows for code reuse\
    \ amongst groups of similar objects. Consider the following two classes:\n\n```\n\
    class Employee {\n  public id: number;\n  public name: string;\n  printDetails()\
    \ {\n    console.log(`id: ${this.id} \\\n      + `, name ${this.name}`);\n  }\n\
    }\n```\n\n```\nclass Manager {\n  public id: number;\n  public name: string;\n\
    \  public Employees: Employee[];\n  printDetails() {\n    console.log(`id: ${this.id}\
    \ \\\n      + `, name ${this.name}, \\\n      + `, employeeCount ${this.Employees.length}`);\n\
    \  }\n}\n```\n\nWe start with a class Employee that has an id and name property,\
    \ as well as a function called printDetails. The next class is Manager, and is\
    \ very similar to the Employee class. It also has an id and name property, but\
    \ has an extra property Employees, which is a list of employees that this manager\
    \ oversees. There is a lot of code that is common to these two classes. Both have\
    \ an id and name property, and both have a printDetails function. Using an abstract\
    \ base class for both of these classes overcomes this problem with common properties\
    \ and code. Let's rewrite these two classes, and introduce the concept of an abstract\
    \ base class, as follows:\n\n```\nabstract class AbstractEmployee {\n  public\
    \ id: number;\n  public name: string;\n  abstract getDetails(): string;\n}\n```"
