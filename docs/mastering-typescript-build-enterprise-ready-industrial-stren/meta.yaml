  md: "# Writing and Using Declaration Files\n\nThis HTML has a <script> block and\
    \ within this <script> block, some JavaScript. The JavaScript defines a variable\
    \ named CONTACT_EMAIL_ARRAY that contains strings. Let's assume that we wanted\
    \ to write some TypeScript that can read global variable. Consider the following\
    \ TypeScript code:\n\n```\nclass GlobalLogger {\n  static logGlobalsToConsole()\
    \ {\n    for(let contact of CONTACT_EMAIL_ARRAY) {\n      console.log(`found contact\
    \ : ${contact}\\`);\n    }\n  }\n}\n\nwindow.onload = () => {\n  GlobalLogger.logGlobalsToConsole();\n\
    };\n```\n\nThis code creates a class GlobalLogger with a single static function\
    \ named logGlobalsToConsole. The function simply iterates through the CONTACT_EMAIL_ARRAY\
    \ global variable, and logs the items in the array to the console.\n\nIf we compare\
    \ this TypeScript code, we will generate the following errors:\n\n```\nerror TS2304:\
    \ Cannot find name 'CONTACT_EMAIL_ARRAY'\n```\n\nThis error indicates that the\
    \ TypeScript compiler does not know anything about the variable CONTACT_EMAIL_ARRAY.\
    \ It does not even know that it is an array. As this piece of JavaScript is outside\
    \ any TypeScript code, we will need to treat it in the same way as external JavaScript.\n\
    \nTo solve our compilation problem, and make CONTACT_EMAIL_ARRAY variable visible\
    \ to TypeScript, we will need to use a declaration file. Let's create a file globals.d.ts\
    \ and include the following TypeScript declaration within:\n\n```\ndeclare var\
    \ CONTACT_EMAIL_ARRAY: string[];\n```\n\nThe first thing to notice is that we\
    \ are using a new TypeScript keyword - declare. The declare keyword tells the\
    \ TypeScript compiler that we want to define the type of something, but that the\
    \ implementation of this (object or function) will be resolved at runtime. We\
    \ have declared a variable named CONTACT_EMAIL_ARRAY that is of type string [].\
    \ This declare keyword does two things for us, it allows the use of the variable\
    \ CONTACT_EMAIL_ARRAY within TypeScript code, and it also strongly this variable\
    \ to be an array of strings."
