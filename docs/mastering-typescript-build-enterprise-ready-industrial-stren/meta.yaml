  md: "A public class property can be accessed by any calling code. Consider the following\
    \ code:\n\n```\nclass ClassWithPublicProperty {\n  public id: number;\n}\n\nlet\
    \ publicAccess = new ClassWithPublicProperty();\npublicAccess.id = 10;\n```\n\n\
    Here, we define a class ClassWithPublicProperty, which has a single property named\
    \ id. We then create an instance of this class, named publicAccess, and assign\
    \ the value of 10 to the id of this instance. Let's now explore how a property\
    \ private will allow the access to this property, as follows:\n\n```\nclass ClassWithPrivateProperty\
    \ {\n  private id: number;\n  constructor(_id: number) {\n    this.id = _id;\n\
    \  }\n}\n\nlet privateAccess = new ClassWithPrivateProperty(10);\nprivateAccess.id\
    \ = 20;\n```\n\nHere, we have defined a class ClassWithPrivateProperty, that has\
    \ a single property named id, which has now been marked as private. This class\
    \ also has a constructor function that takes a single argument, named _id, and\
    \ assigns the value of this argument to the id property. Note that we are using\
    \ the this.id syntax in this assignment.\n\nWe create an instance of this class,\
    \ named privateAccess, and attempt to assign the value 20 to the private id property.\
    \ This code, however, will generate the following\n\n```\nerror TS2341: Property\
    \ 'id' is private and only accessible within class 'ClassWithPrivateProperty'.\n\
    ```\n\nAs we can see from the error message, TypeScript will not allow assignment\
    \ to the id property of this class outside the class itself, as we have marked\
    \ it as private. Note that we are able to assign a value to the id property from\
    \ within the class, as we have done in the constructor function."
