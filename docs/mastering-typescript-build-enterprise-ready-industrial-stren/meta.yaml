  md: "# Types, Variables, and Function Techniques\n\nTypeScript introduces the let\
    \ keyword, which can be used in the place of the var keyword when defining variables.\
    \ One of the advantages of using the let keyword is that we cannot use a variable\
    \ name before it has been defined. Consider the following code:\n\n```\nconsole.log(`lValue\
    \ = ${lValue}`);\nlet lValue = 2;\n```\n\nHere, we are attempting to log the value\
    \ of the variable lValue to the console even before it has been defined, similar\
    \ to how we were using the anyValue variable earlier. However, when using the\
    \ let instead of the var keyword, this will generate an error, as follows:\n\n\
    +   - error TS2548: Block-scoped variable 'lValue' used before its declaration.\n\
    \nHere, the TypeScript compiler generates an error if we attempt to use a variable\
    \ before it is defined. To fix this, we need to define the variable lValue before\
    \ it is first used,\n\n```\nlet lValue = 2;\nconsole.log(`lValue = ${lValue}`);\n\
    ```\n\nThis code will compile correctly, and output the following to the console:\n\
    \n```\nlValue = 2\n```\n\nAnother side-effect of using the let keyword, is that\
    \ variables defined with let are block-scoped. This means that their value and\
    \ definition are limited to the block of code that they reside in. As an example\
    \ of this, consider the following code:\n\n```\nlet lValue = 2;\nconsole.log(`lValue\
    \ = ${lValue}`);\n\nif (lValue == 2) {\n  let lValue = 2001;\n  console.log(`block\
    \ scoped lValue: ${lValue}`);\n}\nconsole.log(`lValue = ${lValue}`);\n```\n\n\
    Here, we define the lValue variable on the first line using the let keyword, and\
    \ assign a value of 2 to it. We then log the value of lValue to the console. On\
    \ the first line within the if statement, note how we are redefining a variable\
    \ named lValue to hold the value 2001. We are then logging the value of lValue\
    \ to the console (within the if statement block)."
