  md: '# TypeScript''s syntactic sugar


    TypeScript introduces a very simple syntax to check the type of an object at compile
    time. This syntax has been referred to as “syntactic sugar", or more formally,
    type annotations. Consider the following TypeScript code:


    ```

    var test: string = "this is a string";ntest = i;

    test = function(a, b) { return a + b; };

    ```


    Note, on the first line of this code snippet, we have introduced a colon : and
    a string keyword between our variable and its assignment. This type annotation
    syntax means that we are setting the type of our variable test to be of type string,
    and any code that does not treat the variable test as a string will generate a
    compile error. Running the preceding code before the TypeScript compiler will
    generate two errors:


    ```

    hello.ts(3,1): error TS2322: Type ''number'' is not assignable to

    ''string'';nhello.ts(4,1): error TS2322: Type ''(a: any, b: any) => ''any'' is
    not

    assignable

    to type ''string''.

    ```


    The first error is fairly obvious. We have specified the variable test is a string,
    and therefore attempting to assign a number to it will generate a compile error.
    The second error is similar to the first, and is, in essence, saying that we cannot
    assign a function to a string.


    In this way, the TypeScript compiler introduces strong or static typing to your
    JavaScript code, giving you all of the benefits of a strongly typed language.
    TypeScript is therefore described as a superset of JavaScript. We will explore
    this in more detail in the next chapter.


    # JavaScript and TypeScript definitions


    As we have seen, TypeScript has the ability to annotate JavaScript, and bring
    strong typing to the JavaScript development experience. But how do we strongly
    type existing JavaScript libraries? In other words, if we have an existing JavaScript
    library, how do we integrate it for use within TypeScript? The answer is surprisingly-simple
    by creating a definition file. TypeScript uses files with a .ts extension as a
    sort of header file, similar to languages such as C++, to super strongly typing
    on existing JavaScript libraries. These definition files hold information that
    describes each available function, and/or variables, along with their associated
    type annotations.'
  merge: -1
