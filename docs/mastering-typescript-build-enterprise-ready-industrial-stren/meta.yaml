  md: "# Interfaces, Classes, and Inheritance\n\n```\nconsole.log(`Can sign : \n*\
    \ `${this.canSignContracts()}`);\n}\n```\n\nThis abstract Person class implements\
    \ the interface IPerson, and as such, will need three things—a Category property,\
    \ a canSignContracts function, and a printDetails function. In order to print\
    \ the person's date of birth, we also need a DateOfBirth property, which we will\
    \ set in our constructor function.\n\nThere are a couple of interesting things\
    \ to note about this Person class. Firstly, the DateOfBirth property has been\
    \ declared private. This means that the only class that has access to the DateOfBirth\
    \ property is the Person class itself. We requirements do not mention using the\
    \ date of birth outside of the printing function, so there is no need to access\
    \ or modify the date of birth once it has been set.\n\nSecondly, the canSignContracts\
    \ function has been marked as abstract. This means that any class that derives\
    \ from this class is forced to implement the canSignContracts function, which\
    \ is exactly what we want.\n\nThirdly, the printDetails function has been fully\
    \ implemented in this abstract class. This means that a single print function\
    \ is automatically available for any class that derives from Person.\n\n# Specialist\
    \ classes\n\nNow for the three types of specialist class, all derived from the\
    \ Person base class:\n\n```\nclass Infant extends Person {\n  constructor(dateOfBirth:\
    \ Date) {\n    super(dateOfBirth);\n    this.Category = PersonCategory.Infant;\n\
    \  }\n  canSignContracts(): boolean { return false; }\n}\n```\n\n```\nclass Child\
    \ extends Person {\n  constructor(dateOfBirth: Date) {\n    super(dateOfBirth);\n\
    \    this.Category = PersonCategory.Child;\n  }\n  canSignContracts(): boolean\
    \ { return false; }\n}\n```"
