    \ {\n    ErrorHelper.trace(failureMessage);\n  }\n}\n```\n\nHere, we have stripped\
    \ down version of our original JavaScript sample. In fact, we can just copy and\
    \ paste the original JavaScript code into our TypeScript file. We first create\
    \ a failure object with the correct properties, and then simply call the ErrorHelper.containsErrors\
    \ method, and the ErrorHelper.trace method. If we were to compile our TypeScript\
    \ file at this stage, we would receive the following error:\n\n```\nerror TS2304:\
    \ Cannot find name 'ErrorHelper'.\n```"
