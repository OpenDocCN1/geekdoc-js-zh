    # Object rest and spread


    When working with basic JavaScript objects, we often need to copy the properties
    of one object to another, or do some mixing and matching of properties from various
    objects. In order to facilitate these requirements, TypeScript has adopted the
    ES7 proposal and language syntax, which is called object rest and spread. Consider
    the following TypeScript code:


    ```

    let firstObj = { id: 1, name: "firstObj" };


    let secondObj = { ...firstObj };

    console.log(`secondObj.id: ${secondObj.id}\`);

    console.log(`secondObj.name: ${secondObj.name}\`);

    ```


    Here, by defining a simple JavaScript object named firstObj, that has an id and
    a name property. We use the new ES7 syntax to copy all the properties of firstObj
    into another object called secondObj, by specifying { ...firstObj }. To test that
    this has indeed copied all properties, we log the values of secondObj.id and secondObj.name
    to the console. The output of this code is as follows:


    ```

    secondObj.id : 1

    secondObj.name : firstObj

    ```


    Here, we can see that the values of the id and name properties have been copied
    from firstObj into secondObj, using the rest and spread ES7 syntax.


    We can also use this syntax to combine multiple objects together, as follows:


    ```

    let nameObj = { name: "nameObj" };

    let idObj = { id: 2 };


    let obj3 = { ...nameObj, ...idObj };

    console.log(`obj3.id: ${obj3.id}\`);

    console.log(`obj3.name: ${obj3.name}\`);

    ```'
