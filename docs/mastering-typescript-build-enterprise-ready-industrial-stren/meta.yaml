  md: "# Decorators, Generics, and Asynchronous Features\n\nNote the change in usage\
    \ of the create function. We are now required to pass in the class definition\
    \ for our type of T—create(FirstClass) and create(SecondClass) as our first argument.\
    \ Try running this code to see what happens. The generic class will, in fact,\
    \ create objects of types FirstClass and SecondClass, as we expected.\n\n# Asynchronous\
    \ language features\n\nIn this section of the chapter, we will discuss some asynchronous\
    \ language features, and in particular, promises and the async and await keywords.\n\
    \nThe code samples in this section have been designed to run on Node version 4\
    \ and above, which provides an ECMAScript 6 runtime. You can determine which version\
    \ of Node you are running by executing the following on the command line:\n\n\
    ```\nnode --version\n```\n\nYou need to ensure that the return value is v4 or\
    \ greater to compile and run the code samples in this section. The information\
    \ returned by the version of Node used in this section is:\n\n```\nV6.1.0\n```\n\
    \n# Promises\n\nPromises are a technique for standardizing asynchronous processing\
    \ in JavaScript. Remember that there are many occasions where a function is called\
    \ in JavaScript, but the actual results are only received after a period of time.\
    \ These occasions typically arise when your code is requesting a resource of some\
    \ sort, such as posting a request to a web server for some JSON data, or reading\
    \ a file from disk. The standard JavaScript technique for asynchronous processing\
    \ is the callback mechanism.\n\nUnfortunately, when working with a lot of callbacks,\
    \ our code can sometimes become more complex and repetitive. Promises provide\
    \ a way of simplifying this callback code. To start off our discussion on promises,\
    \ let's look at some typical callback code, as follows:\n\n```\nfunction delayedResponseWithCallback(callback:\
    \ Function) {\n  delayedAfterTimeout(() {\n    console.log(`delayedAfterTimeout`);\n\
    \    callback();\n  });\n  setTimeout(delayedAfterTimeout, 1000);\n```"
