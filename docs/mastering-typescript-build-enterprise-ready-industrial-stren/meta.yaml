    \ equivalent testArguments function, expressed in TypeScript:\n\n```\nfunction\
    \ testArguments(.. argArray: number[]) {\n  if (argArray.length > 0) {\n    for\
    \ (var i = 0; i < argArray.length; i++) {\n      console.log(`argArray[i] = ${argArray[i]}`);\n\
