  md: "# TypeScript Compatible Frameworks\n\nHere, we have our standard ClickableItem\
    \ class, which has the displayName and id properties. We are then creating an\
    \ array named ClickableItemArray to hold our array items, as we have seen before.\
    \ Our final class is called AppComponent, and has a title and an items property,\
    \ similar to our model class for Aurelia.\n\n# Angular 2 views\n\nAngular uses\
    \ a class decorator @Component to specify that a class can act as an HTML component.\
    \ Let's take a look closer at this decorator:\n\n```\nimport { Component } from\
    \ '@angular/core';\n\n// existing ClickableItem code\n\n@Component({\n  selector:\
    \ 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
    })\nexport class AppComponent {\n  title = 'hello angular!';\n  items = ClickableItemArray;\n\
    n\n```\n\nThis code starts with an import statement to define the Component decorator\
    \ from a library named '@angular/core'. This import statement is part of the modular\
    \ syntax that we will cover in a later chapter. It basically gives us the ability\
    \ to easily reference other classes from the Angular framework.\n\nThe @Component\
    \ decorator defines three properties, selector, templateUrl, and styleUrls. The\
    \ selector property is used to reference an HTML DOM element where the View will\
    \ render to, similar to a standard jQuery selector. The templateUrl property specifies\
    \ the template HTML file for this component is found, and the styleUrls property\
    \ is used to include CSS files used by the component.\n\nLet's take a look at\
    \ the app.component.html file that contains our template:\n\n```\n<html>\n  {{title}}\n\
    </html>\n\n<ul>\n  <li *ngFor=\"let item of items\">\n    <button>\n  </li>\n\
    </ul>\n\n```"
  merge: -1
  pgno: 250
- img_proc: false
  md: ''
  merge: -1
  pgno: 251
- img_proc: false
  md: "# TypeScript Compatible Frameworks\n\n```\n<button>\n  {{item.displayName}}\n\
    </button>\n</li>\n</ul>\n```\n\nHere, we have simply added a (click)=\\onSelect\
    \ (item) attribute to the <li> tag used to render each item to the DOM. Note the\
    \ slight difference between Aurelia and Angular syntax used here. Here Aurelia\
    \ uses click.delegate, Angular simply uses (click), surrounded by parentheses.\
    \ Now we can define the select function within our AppComponent class as follows:\n\
    \n```\nexport class AppComponent {\n  title = \"Select an option;\";\n  items:\
    \ ClickableItem[];\n  onSelect(selectedItem: ClickableItem) {\n    alert(`onSelect\
    \ : id=${selectedItem.id} displayName=${selectedItem.displayName}`);\n  }\n```\n\
    \nHere, we defined an onSelect function that has a ClickableItem object as an\
    \ argument. With this function we are simply raising an alert to display the properties\
    \ of the model that was used to create the element. As we saw with Aurelia, this\
    \ handler is also at the AppComponent level and not at the ClickableItem as it\
    \ was with Backbone. The reason for this is again that the controlling class,\
    \ that is, the class that defines the *ngFor loop, is the AppComponent itself.\n\
    \nWith this event handler in place, our sample application is up and running in\
    \ Angular 2.\n\n# Using React\n\nThe final TypeScript framework that we will take\
    \ a look at in this chapter is React. The React framework is open source, and\
    \ maintained by Facebook. React uses a specific-inline syntax for combining HTML\
    \ templates and JavaScript code, named JSX. There are no string templates, or\
    \ HTML snippets in React, as all templates are written with normal JavaScript\
    \ code in an XML-like syntax. TypeScript included support for React/JSX syntax\
    \ in release 1.6. To use the new JSX syntax, however, we will need to create our\
    \ TypeScript files with a .tsx extension, instead of the normal .ts file extension.\n\
