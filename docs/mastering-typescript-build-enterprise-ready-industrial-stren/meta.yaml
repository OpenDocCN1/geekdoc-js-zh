  md: "Decorators, Generics, and Asynchronous Features\n\n# # Generic syntax\n\nAs\
    \ an example of TypeScript generic syntax, let's write a class called Concatenator\
    \ that will concatenate the values in an array. We will need to ensure that each\
    \ element of the array is of the same type. This class should be able to handle\
    \ arrays of strings, arrays of numbers, and in fact, arrays of any type. In order\
    \ to do this, we need to rely on functionality that is common to each of these\
    \ types. All JavaScript objects have a toString function (which is called whenever\
    \ a string is needed by the runtime) we can use this toString function to create\
    \ a generic class that outputs all values held within an array.\n\nA generic implementation\
    \ of the Concatenator class is as follows:\n\n```\nclass Concatenator< T > {\n\
    \  concatenate(inputArray: Array< T>): string {\n    let returnString = \"\";\n\
    \n    for (let i = 0; i < inputArray.length; i++) {\n      if (i > 0)\n      \
    \  returnString += \",\";\n      returnString += inputArray[i].toString();\n \
    \   }\n    return returnString;\n  }\n}\n```\n\nThe first thing we notice is the\
    \ syntax of the class declaration, Concatenator < T >. This < T > syntax is the\
    \ syntax used to indicate a generic type, and the name used for this generic type\
    \ in the rest of our code is T. The concatenateArray function also uses this generic\
    \ type syntax, Array < T >. This indicates that the inputArray argument must be\
    \ an array of the type that was to construct an instance of this class.\n\n# #\
    \ Instantiating generic classes\n\nTo use an instance of a generic class, we need\
    \ to construct the class and tell the compiler via the < > syntax what the actual\
    \ type of T is. We can use any type of T in this generic syntax, including base\
    \ types, classes, or even interfaces. Let's create a few versions of this class,\
    \ as follows:\n\n```\nvar stringConcat = new Concatenator<string>();\nvar numberConcat\
    \ = new Concatenator<number>();\n```\n\n[ 135 ]"
