  md: "# Writing and Using Declaration Files\n\nThis error is indicating that there\
    \ is no valid TypeScript type named ErrorHelper, even though we have the full\
    \ source of ErrorHelper in our JavaScript file. TypeScript by default, will look\
    \ through all the TypeScript files in our project to find class definitions, and\
    \ it will not parse JavaScript files. We will need a new TypeScript definition\
    \ file in order to correctly compile this code.\n\nThis definition file is not\
    \ included in the HTML file at all; it is only used by the TypeScript compiler\
    \ and does not generate any JavaScript.\n\nWithout a set of helpful documentation\
    \ on our ErrorHelper class, we will need to reverse engineer a TypeScript definition\
    \ purely by reading the source code. This is obviously not an ideal situation,\
    \ and not recommended, but at this stage, it is all we can do. In situations,\
    \ the best starting point is simply to look at the usage samples and work our\
    \ way up from there.\n\nLooking at the usage of the ErrorHelper closure in JavaScript,\
    \ there are two pieces that should be included in our declaration file. The first\
    \ is a set of function definitions to describe the containsErrors and trace functions.\
    \ The second is a set of interfaces to describe the structure of the response\
    \ object that the ErrorHelper closure relies upon. Let's start with the function\
    \ definitions, and create a new TypeScript file named ErrorHelper.d.ts with\n\n\
    ```\ndeclare module ErrorHelper {\n  function containsErrors(response);\n  function\
    \ trace(message);\n}\n```\n\nThis declaration file starts with the declare keyword\
    \ that we have seen before, but uses a new TypeScript keyword-module. The module\
    \ keyword must be followed by a module name, which in this case, is ErrorHelper.\
    \ This module name must match the closure name from the original JavaScript that\
    \ we are describing. In all of us of the ErrorHelper, we have always pre-fixed\
    \ the containsErrors and trace with the closure name ErrorHelper itself. This\
    \ module name is also known as a namespace. If we had another class named AjaxHelper\
    \ that also included a containsErrors function, we would be able to distinguish\
    \ between the AjaxHelper.containsErrors and the ErrorHelper.containsErrors functions\
    \ by using these namespaces, or module names."
  merge: -1
