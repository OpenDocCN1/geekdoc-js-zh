  md: '# Types, Variables, and Function Techniques


    TypeScript introduces strong typing to JavaScript through a simple syntax, referred
    to by Anders Heijberg as “syntactic sugar”. This “sugar” is what assigns a type
    to a variable, a function parameter, or even the return type of a function itself.
    As we discussed Chapter 1, TypeScript – Tools and Framework Options, the benefits
    of strong typing include better error checking, the ability for an IDE to provide
    more intelligent code suggestions, the ability to introduce object-oriented techniques
    into the JavaScript coding experience. There are a number of basic types that
    the language uses, such as number, string and boolean, to name a few. There are
    also rules by which the TypeScript compiler identifies what the type of a variable
    is. Understanding these rules and applying them to your code is a fundamental
    skill when writing TypeScript code.


    We will cover the following topics in this chapter:


    +   * Basic types and type syntax – strings, numbers, and booleans

    * Inferred type and duck typing

    * Template strings

    * Arrays

    * Using for...in and for...of

    * The any type and explicit casting

    * Enums

    * Const enums and const values

    * The let keyword

    * Functions and anonymous functions

    * Optional and default function parameters'
