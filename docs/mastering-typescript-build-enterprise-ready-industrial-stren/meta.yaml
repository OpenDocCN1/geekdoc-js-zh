    # Using Aurelia


    Aurelia was one of the first SPA frameworks to offer full TypeScript integration.
    It is a framework that specifically uses ECMAScript 6 features to enhance the
    development experience. One of the most astounding features of the Aurelia framework
    is the small amount of code that you need to write in order to get things done.
    Aurelia understands if you are writing a standard class, then you probably want
    to use the class properties to render some HTML.


    # Aurelia setup


    The simplest to set up a development environment is to use Aurelia''s command-line
    interface, named aurelia-cli, which can be installed as follows:


    ```

    npm install aurelia-cli -g

    ```


    Once this has been installed, it can be invoked to create a new project as follows:


    ```

    au new

    ```


    This will take you through a simple set of questions, starting with the name of
    the base directory that you would like to use. The next question is whether to
    use ESNext or TypeScript as your development language, and the last question is
    whether or not to download all project dependencies. Selecting TypeScript and
    then yes will take a few minutes to set up the default project structure. Once
    this is complete, a new directory will be created based on the project name you
    selected at the start of the process.'
