  md: "# Third-Party Libraries\n\nWe then call the controller function on the newly\
    \ created phonecatApp variable with two arguments. The first argument is the global\
    \ name of the controller, and the second argument is a function that accepts a\
    \ specially named Angular variable $scope. Within this function, the code sets\
    \ the phones of the $scope variable to be an array of JSON objects, each with\
    \ a name and snippet property.\n\nIf we continue reading through the tutorial,\
    \ we will find a test that shows how the PhoneListController is used:\n\n```\n\
    describe('PhoneListController', function() {\n  it('should create \"phones\" model\
    \ with 3 phones', function() {\n    var scope = {},\n    ctrl = new PhoneListController(scope);\n\
    \n    expect(scope.phones.length).toBe(3);\n  });\nn});\n```\n\nThe first two\
    \ lines of code snippet define a global function called describe, and within this\
    \ function another function called it. These two functions are part of a unit\
    \ testing framework jasmine. We will cover unit testing in a later chapter, but\
    \ for the time being, let's focus on the rest of the code.\n\nBuilding the same\
    \ object in TypeScript would allow us to use TypeScript classes, as follows:\n\
    \n```\nvar phonecatApp = scope.module('phonecatApp', []);\n\nclass PhoneListController\
    \ {\n  constructor($scope) {\n    scope.phones = [\n      {'name': 'Nexus S',\n\
    \      'snippet': 'Fast just got faster'},\n      {'name': 'Motorola',\n     \
    \ 'snippet': 'Next generation tablet'},\n      {'name': 'Motorola Zoom',\n   \
    \   'snippet': 'Next, next generation tablet'}\n    ];\n  }\n}\n```"
  merge: -1
  pgno: 217
- img_proc: false
  md: "Our first line is the same as in our previous JavaScript sample. We then, however,\
    \ use the TypeScript syntax to create a class named PhoneController. By creating\
    \ a TypeScript class, we can now use this class as shown in our Jasmine test code-ctrl\
    \ = new PhoneController(scope). The constructor of our function PhoneController(scope)\
    \ acts as the anonymous function seen in the original JavaScript sample:\n\n```\n\
    phoneapp.controller('PhoneController', function ($scope) {\n  // this function\
    \ is replaced by the constructor\n}\n```\n\n# Angular classes and $scope\n\nLet's\
    \ expand our PhoneController class a little further, and have a look at what it\
    \ would look like when completed:\n\n```\nclass PhoneListCtrl {\n  myScope: IScope;\n\
    \  constructor($scope, $http: ng.Http, Phone) {\n    this.myScope = $scope;\n\
    \    this.myScope.phones = Phone.query();\n    $scope.orderProp = 'age';\n   \
    \ _.bindAll(this, 'GetPhonesSuccess');\n  }\n  GetPhonesSuccess(data: any) {\n\
    \    this.myScope.phones = data;\n  }\n};\n```\n\nThe first thing to note in this\
    \ class, is that we are defining a variable named my, and storing the $scope argument\
    \ that is passed in the constructor, into this internal variable. This is again\
    \ because of JavaScript's lexical scoping rules. Note the call to _.bindAll at\
    \ the end of the constructor. This Underscore utility function will ensure that\
    \ whenever the GetPhonesSuccess function is called, it will use the variable this\
    \ in the context of the class instance, and not in the context of the calling\
    \ code. We will discuss the usage of _.bindAll in detail in a later chapter."
  merge: -1
  pgno: 218
- img_proc: false
  md: "# Third-Party Libraries\n\nThe GetPhonesSuccess function uses the this.myScope\
    \ variable within its implementation. This is why we needed to store the initial\
    \ $scope argument in an internal variable.\n\nAnother thing we notice from this\
    \ code is that the myScope variable is typed to an interface IScope, which will\
    \ need to be defined as follows:\n\n```\ninterface IScope {\n  phones : IPhone[];\n\
    }\ninterface IPhone {\n  name: string;\n  snippet: string;\n}\n```\n\nThis IScope\
    \ interface just contains an array of objects of type IPhone (pardon the unfortunate\
    \ name of this interface, it can hold Android phones as well).\n\nWhat means is\
    \ that we don't have a standard interface or TypeScript type to use when dealing\
    \ with $scope objects. By its nature, the $scope argument will change its type\
    \ depending on and where the Angular runtime calls it, hence we need to define\
    \ an IScope interface, and strongly type the myScope variable to this.\n\nAnother\
    \ thing to note on the constructor function of the PhoneListController class is\
    \ the type of the $http argument. It is set to be of type ng.IHttpClient. IHttpClient\
    \ interface is found in the declaration file for Angular. In order to use TypeScript\
    \ with Angular variables as $scope or $http, we need to find the matching interface\
    \ within our declaration file, before we can use any of the Angular functions\
    \ available on these variables.\n\nThe last point in this constructor code is\
    \ the final argument, named Phone. It does not have a TypeScript type assigned\
    \ to it, and so automatically becomes type any. Let's take a quick look at the\
    \ implementation of this Phone service, which is as follows:\n\n```\nvar phonecatServices\
    \ = angular.module(\n  'phonecatServices', ['ngResource']);\n\nphonecatServices.factory('Phone',\
    \ \n  ['$resource', $resource] => {\n    return $resource('phones/:id.json', {},\
    \ {\n      query: { method: 'GET' },\n      params: {\n        phoneId: 'phones'\n\
    \      },\n      isArray: true\n    });});\n```"
  merge: -1
  pgno: 219
- img_proc: false
  md: "```\n{\n  ));\n}\n;\n```\n\nThe first line of this code snippet again creates\
    \ a global variable named phonecatServices, using the angular.module global function.\
    \ We then call the factory function available on the phonecatServices variable,\
    \ in order to define our Phone resource. This factory function uses a string 'Phone'\
    \ to define the Phone resource, and then uses Angular's dependency injection syntax\
    \ to inject a $resource object. Looking through this code, we can see that we\
    \ cannot easily create TypeScript classes for Angular to use. Nor can we use standard\
    \ TypeScript interfaces or inheritance from these Angular classes.\n\n# Angular\
    \ TypeScript compatibility\n\nWhen writing Angular code with TypeScript, we are\
    \ able to use classes in certain instances, but must rely on the underlying Angular\
    \ functions such as module and factory to define our objects in other cases. Also,\
    \ when using standard Angular services, such as $http $resource, we will need\
    \ to specify the matching declaration file interface in order to use these services.\
    \ We can therefore describe the Angular library as having medium compatibility\
    \ with TypeScript.\n\n# Inheritance – Angular versus Backbone\n\nInheritance is\
    \ a very powerful feature of object-oriented programming, and is also a fundamental\
    \ concept when using JavaScript frameworks. Using a Backbone controller or an\
    \ Angular controller within the framework relies on certain characteristics, or\
    \ functions available. We have seen, however, that each framework implements inheritance\
    \ in a different way.\n\nJavaScript does not have the concept of inheritance,\
    \ each framework needs to find a way to implement it. In Backbone, this inheritance\
    \ implementation is via the extend function of each Backbone object. As we have\
    \ seen, the TypeScript extends keyword follows a similar implementation to Backbone,\
    \ allowing the framework and language to dovetail each other."
  merge: -1
