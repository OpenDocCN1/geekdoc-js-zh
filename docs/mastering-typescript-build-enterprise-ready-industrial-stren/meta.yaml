  md: "# Decorators, Generics, and Asynchronous Features\n\nNote that in the promise\
    \ code above, we are using .then and .catch to define anonymous functions to be\
    \ called depending on whether the asynchronous call was successful or not. Another\
    \ caveat when using promise syntax is that any code out of the .then or .catch\
    \ block will be executed immediately, and will not wait for the asynchronous call\
    \ to complete.\n\nSecondly, the new async await syntax:\n\n```\nasync function\
    \ usingAsyncAwait() {\n  try {\n    await delayedPromise();\n    // execute on\
    \ success\n  } catch (error) {\n    // execute on error\n  }\n  // code waits\
    \ for async call\n}\n```\n\nHere, our async await syntax allows for a very simple\
    \ syntax that flows logically. We know that any call to await block code execution\
    \ until the asynchronous function has returned, including any code defined outside\
    \ our try...catch block.\n\nAs seen by comparing the two styles side by side,\
    \ using async await syntax simplifies our code, makes it more human readable,\
    \ and as such, less error-prone.\n\n# Await messages\n\nThe final topic we will\
    \ discuss on async await is how to process messages that are returned within our\
    \ promises. Consider the following promise definition:\n\n```\nfunction asyncWithMessage()\
    \ : Promise<string> {\n  return new Promise<string> (\n    resolve: (message:\
    \ string) => void,\n    reject: (message: string) => void\n  ) => {\n    function\
    \ afterWait() {\n      resolve(\"resolve_message\");\n    }\n    setTimeout(afterWait,\
    \ 1000);\n  }\n}\n```"
