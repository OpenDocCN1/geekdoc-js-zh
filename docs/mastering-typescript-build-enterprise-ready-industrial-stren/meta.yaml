  md: "# Decorators, Generics, and Asynchronous Features\n\nHere we can see the output\
    \ of our various `console.log` calls. The `target` argument resolves to `[object\
    \ Object]`, which simply indicates that it is an object prototype. The `constructor`\
    \ property of the `target` argument resolves to a function named `ClassWithPropertyDec`,\
    \ which is, in fact, our class constructor. The `name` property of this constructor\
    \ gives us the name of the class itself, and the `propertyKey` argument is the\
    \ name of the property itself.\n\nProperty decorators, therefore give us the ability\
    \ to check whether a particular property has been declared on a class instance.\n\
    \n# Static property decorators\n\nProperty decorators can also be applied to static\
    \ class properties. There is no difference in syntax in our code, they are the\
    \ same as normal property decorators. However, the actual arguments that are passed\
    \ in runtime are slightly different. Given our earlier definition of the property\
    \ decorator `propertyDec`, consider what happens when our decorator is applied\
    \ to a static class property, as follows:\n\n```\nclass StaticClassWithPropertyDec\
    \ {\n  @propertyDec\n  static name: string;\n}\n```\n\nThe output of the various\
    \ `console.log` calls in our decorator is as follows:\n\n```\ntarget : function\
    \ StaticClassWithPropertyDec() {\n}\ntarget.constructor : function Function()\
    \ { [native code] }\ntarget.constructor.name : Function\npropertyKey : name\n\
    ```\n\nNote that the `target` argument (as printed in the first line of output)\
    \ is not a class prototype (as seen before), but an actual constructor function.\
    \ The definition of `target.constructor` is simply a function, named `Function`.\
    \ The `propertyKey` remains the same, that is, `name`.\n\nThis means we need to\
    \ be a little careful about what is being passed as the first argument to our\
    \ property decorator. When the class property being decorated is marked as `static`,\
    \ then the target argument will be the class constructor itself. When the class\
    \ property is not static, the target argument will be the class prototype."
