  md: "# Third-Party Libraries\n\nWe define a launch property, which is an anonymous\
    \ function. This launch function then uses the create function on the global Ext\
    \ instance to create a class. The create function uses the Ext.container.Viewport\
    \ name to create an instance of the Ext.container.Viewport class, which has the\
    \ layout and items. The layout property can contain only one specific set of values,\
    \ for example 'fit', 'auto', or 'table'. The items array carries further Ext specific\
    \ objects, which are created depending on what their xtype property suggests.\n\
    \nExtJS is one of those libraries are not intuitive. As a programmer, you will\
    \ need to have one browser window open with the library documentation at all times,\
    \ and use it to figure out each property means for each type of class. It also\
    \ has a lot of magic strings in the preceding sample, the Ext.create function\
    \ would fail if we mistyped 'Ext.container.Viewport' string, or simply forgot\
    \ to capitalize it in the right places. Remember that one of our solutions to\
    \ ExtJS, 'viewport' is different from 'Viewport'. Magic strings within TypeScript\
    \ to use enums. Unfortunately, the current version of the ExtJS declaration file\
    \ does not have a set of enums for these class types.\n\n# Using type casting\n\
    \nWe can, however, use the TypeScript language feature of type casting to help\
    \ with writing ExtJS code. If we know what type of ExtJS object we are trying\
    \ to create, we can cast the JavaScript object to this type, and use TypeScript\
    \ to check whether the properties we are using are correct for type of ExtJS object.\
    \ To help with this concept, let's just take the outer definition of the Ext.application\
    \ into account. Stripped of the inner code, the call to the application function\
    \ on the Ext global object would be reduced to this:\n\n```\nExt.application(\n\
    \  // properties of an Ext.application\n  // are set within this JavaScript\n\
    \  // object block\n);\n```"
