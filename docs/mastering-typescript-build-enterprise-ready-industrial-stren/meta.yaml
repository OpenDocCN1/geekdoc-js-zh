  md: '# Installing declaration files


    You will find that most of the more popular declaration files are found on the
    DefinitelyTyped GitHub repository have a corresponding NuGet package. These packages
    are named <library>.TypeScript.DefinitelyTyped, as a standard naming convention.
    If we type query typescript into the NuGet search box, we will see a list of these
    DefinitelyTyped packages returned. The NuGet package we are looking for named
    query.TypeScript.DefinitelyTyped, created by Jason Jarret, and is, at the time
    of writing, version 3.1.1.


    The DefinitelyTyped packages have their own version number, and these version
    numbers do not necessarily match the version of the JavaScript library that you
    are using.


    ![](bbox=[0.13, 0.31, 0.19, 0.363])


    The jQuery.TypeScript.DefinitelyTyped package will create a typings directory
    under the Scripts directory, and then include the jquery.d.ts definition file.
    This directory naming standard has been adopted by the various NuGet package authors.


    # Using the Package Manager Console


    Visual Studio also has a command-line version of the NuGet package manager available
    as a console application, and it is also integrated into Visual Studio. Clicking
    on Tools, then NuGet Package Manager, and finally on Package Manager Console,
    will bring up a new Visual Studio window, and initialize the NuGet command-line
    interface. The command-line version of NuGet has a number of features that are
    not included in the GUI type. get-help NuGet to see list of top-level command-line
    arguments that are available.


    # Installing packages


    To install a NuGet package from the command line, simply type install-package
    <packageName>. As an example, to install the jquery.TypeScript.DefinitelyTyped
    package, simply type the following:


    ```

    Install-Package query.TypeScript.DefinitelyTyped

    ```


    This command will connect to the NuGet server, and download and install the package
    into your project.'
  merge: -1
  pgno: 203
- img_proc: false
  md: '# Third-Party Libraries


    On the toolbar of the Package Manager Console window are two drop-down lists,
    Package Source and Default Project. If your Visual Studio solution has multiple
    projects, you will need to select the correct project for NuGet to install the
    package into the Default Project dropdown.


    # Searching for package names


    Searching for package names from the command line is accomplished with the Find-Package
    command. As an example, to find available packages that include the definitelytyped
    search string, run the following command:


    ```

    Find-Package definitelytyped

    ```


    # Installing a specific version


    There are JavaScript libraries that are not compatible with jQuery version 2.x,
    and will require a version of jQuery that is in the 1.x range. To install a specific
    version of a NuGet package, we will need to specify the -Version parameter from
    the command line. To install the jquery v11.11 package, as an example, run the
    following from the line:


    ```

    Install-Package jQuery -Version 11.1.1

    ```


    > NuGet will either upgrade or downgrade the version of the package you are installing,
    if it finds any version already installed within your project. In the preceding
    example, we had already installed the latest version of jQuery (2.1.1) within
    our project, so NuGet will first remove jQuery 2.1.1 before installing jQuery
    11.1.11.


    # Typings


    The number of publicly available declaration files for TypeScript started to grow
    and grow, a node-based command-line utility was released to help with management
    of declaration files. This package was called the TypeScript definition manager
    for DefinitelyTyped, or simply TSD. While TSD served a useful purpose for a few
    years, there were some breaking design changes needed in order to provide a suitable
    long-term solution. TSD has now been deprecated in favor of Typings.


    [ 185 ]'
  merge: -1
  pgno: 204
- img_proc: false
  md: 'Typings offers functionality similar to the NuGet Package Manager, but it is
    specifically geared towards TypeScript definition files. Whereas TSD relies on
    definition files from the DefinitelyTyped GitHub repository only, Typings allows
    definition files to be used from any source.


    To install Typings, use npm as follows:


    ```

    npm install typings -g

    ```


    At the time of writing, this installed Typings version 2.0.0.


    # Searching for packages


    Typings allows for querying the package repository using the search keyword. To
    search for the jquery definition files, the type following:


    ```

    typings search jquery

    ```


    This command will search the DefinitelyTyped repository for any definition files
    with the name jquery. The results of this search show that there are a multitude
    of definition files, including chai-jquery and jasmine-jquery, as follows:


    ![](bbox=[0.263, 0.506, 0.736, 0.778])'
  merge: -1
  pgno: 205
- img_proc: false
  md: "The output of the search command shows us the full name of the package, the\
    \ source of the package, as well as the home page of the package itself. We will\
    \ use the source of the package as a prefix when we install the definition file\
    \ need.\n\n# Typings initialize\n\nBefore we start using Typings to download and\
    \ install definition files, we need to create a typing.json file that will record\
    \ our dependent definition files. This is done by simply typing the following:\n\
    \n```\ntypings init\n```\n\nThis command will create the typings.json file as\
    \ follows:\n\n```\n{\n  \"name\": \"using_typings\",\n  \"dependencies\": {}\n\
    }\n```\n\n# Installing definition files\n\nTo install a definition file - query\
    \ as use the install keyword as follows:\n\n```\ntypings install dt~query --global\
    \ --save\n```\n\nNote that we have prefixed the name of the definition file with\
    \ the letters dt~. This matches the name of the source property that we saw when\
    \ running our search query. This enables us to install definition files from sources\
    \ other than DefinitelyTyped, if they are listed.\n\nThe install command will\
    \ download the jquery.d.ts file into the following directory:\n\n```\n\\typings\\\
    globals\\query\\index.ts\n```\n\nTypings will create the \\typings directory based\
    \ on the current directory where typings install was run, make sure that you navigate\
    \ to the same base directory in your project whenever you use Typings from the\
    \ command line.\n\n![](bbox=[0.136, 0.72, 0.204, 0.78])"
  merge: -1
  pgno: 206
- img_proc: false
  md: "Typings also creates a globals\\index.d.ts file that contains a reference path\
    \ to all of the definition files that we have downloaded. Our project, therefore,\
    \ only needs to include a reference to this base globals\\index.d.ts file, and\
    \ all other references paths will be automatically updated.\n\n# Installing a\
    \ specific version\n\nThere may be times when you require a specific version of\
    \ a definition file to be included in your project, and not simply want the latest\
    \ version. Typings allows us to view the various versions of a definition file\
    \ as follows:\n\n```\ntypings view dt~jquery --versions\n```\n\nWe can then install\
    \ a specific version of the definition file as follows:\n\n```\ntypings install\
    \ dt~jquery@1.8.0 --global --save\n```\n\n# Re-installing definition files\n\n\
    One of the benefits of using Typings is that it can interrogate its typings.json\
    \ file, and install any missing definition files that are not within the project.\
    \ This can be very handy if you are branching project source code into different\
    \ directories, or if you are writing a number of projects that all have the same\
    \ dependencies. Let's assume you have the typings.json file as follows:\n\n```\n\
    {\n  \"name\": \"using_typings\",\n  \"dependencies\": {},\n  \"globalDependencies\"\
    : {\n    \"backbone\": \"registry:dt/backbone#1.0.0+20160316155526\",\n    \"\
    marionette\": \"registry:dt/marionette#0.0.0+20160317120654\"\n  }\n}\n```\n\n\
    This Typings file indicates that we have two global dependencies, that is, backbone\
    \ and marionette. If we copy this file to a new directory, we can re-install these\
    \ dependencies in our new directory by simply typing the following:\n\n```\ntypings\
    \ install\n```"
  merge: -1
