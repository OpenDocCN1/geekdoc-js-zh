  md: "# TypeScript - Tools and Framework Options\n\n```\nvar result = classInstance.add(1,2);\n\
    console.log(`add(1,2) returns \\${result}\\`);\n```\n\nThis code is pretty simple\
    \ to read and understand. We have created a class, named MyClass, with a simple\
    \ add function. To use this class we simply create an instance of it, and call\
    \ the add function with two arguments.\n\nJavaScript, unfortunately, does not\
    \ have a class statement, but instead uses functions to reproduce the functionality\
    \ of classes. Encapsulation through classes is accomplished by either using the\
    \ prototype pattern, or by using the closure pattern. Understanding prototypes\
    \ and the closure pattern, and using them correctly, is considered a fundamental\
    \ skill when writing enterprise-scale JavaScript.\n\nA closure is essentially\
    \ a function that refers to independent variables. This means that variables defined\
    \ within a closure remember the environment in which they were created. This provides\
    \ JavaScript with a way to define local variables, and provide encapsulation.\
    \ Writing the MyClass definition in the preceding code, using a closure in JavaScript,\
    \ would look something like the following:\n\n```\nvar MyClass = (function ()\
    \ {\n  // the self-invoking function is the\n  // environment that will be remembered\n\
    \  // by the closure\n  function MyClass() {\n    // MyClass is the inner function,\n\
    \    // the closure\n  }\n  MyClass.prototype.add = function (x, y) {\n    return\
    \ x + y;\n  };\n  return MyClass;\n}());\n\nvar classInstance = new MyClass();\n\
    var result = classInstance.add(1, 2);\nconsole.log(\"add(1,2) returns \" + result);\n\
    ```\n\nWe start with a variable MyClass, and assign it to a function that is executed\
    \ immediately--now the }} ; near the bottom of the closure definition. This syntax\
    \ is a common way to write JavaScript in order to avoid leaking variables into\
    \ the global namespace. We then define a new function named MyClass, and return\
    \ this function to the outer calling function. We then use the prototype keyword\
    \ to inject another function into the MyClass definition. This function is named\
    \ add and takes two parameters, returning their sum."
