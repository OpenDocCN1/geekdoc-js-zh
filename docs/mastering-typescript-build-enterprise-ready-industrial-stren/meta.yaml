  md: "Here, we are defining three import statements at the start of the file. The\
    \ first two import statements make all classes from the \"react\" library and\
    \ \"react-dom\" library available under the namespace React and ReactDOM, respectively.\
    \ The third import statement makes the ArrayView and ClickableItem classes available\
    \ from the ReactApp.tsx file that we created.\n\nWe then create a variable ClickableItemArray,\
    \ which is our array of ClickableItem objects. Finally, we call the ReactDOM.render\
    \ function, to render an element to the DOM of the ArrayItem type. Note how we\
    \ have specified two attributes for this ArrayItem element.\n\nThe first attribute\
    \ is named items, and the value of this item is the instance of the array we created\
    \ ClickableItemArray. Again, React allows us to use the {variableName} syntax\
    \ to inject the value of the ClickableItemArray variable into the DOM. The second\
    \ attribute is named title, and is set to the string value of \"Select on option\
    \ : \\ After we have defined these elements, how we include a comma, and then\
    \ to call document.getById.\n\nThis syntax is React's way of selecting a DOM element\
    \ within the HTML page, and injecting the generated HTML. The id of the element\
    \ is \"example\", and as such will match a <div id=\"example\">element within\
    \ our HTML.\n\nWe will need to create an index.html file in bootstrap and render\
    \ our React application. This index.html file (at the root directory of our project)\
    \ is as follows:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\"\
    \ />\n  <title>Hello React!</title>\n</head>\n<body>\n  <div id=\"example\"></div>\n\
    \n  <!-- Dependencies -->\n  <script src=\"./node_modules/react/dist/react.js\"\
    ></script>\n  <script src=\"./node_modules/react-dom/dist/react-dom.js\"></script>\n\
