  md: "# Decorators, Generics, and Asynchronous Features\n\nWe, we have defined a\
    \ function callPromiseWithParam, that logs a message to the console, and then\
    \ calls our delayedPromiseWithParam function. We then use the fluent syntax to\
    \ attach an anonymous function to the then of the promise. Note how our anonymous\
    \ function now takes a single string parameter, named message. This corresponds\
    \ to the promise callback of resolve: (str: string). The output of this code is\
    \ as follows:\n\n```\ncalling delayedPromiseWithParam\nPromise.then(returned resolved_within_promise)\n\
    ```\n\nAs expected, our promise called the resolve callback, that is,\nresolve(\"\
    resolved_within_promise\"), which corresponds to our then( message: string) =>\
    \ { } ).\n\nNote that promises can only return a single value when calling either\
    \ the resolve or reject callback functions. If you need to return a message that\
    \ contains multiple fields, then you will need to use an interface, as:\n\n```\n\
    interface IPromiseMessage {\n  message: string;\n  id: number;\n}\n```\n\n```\n\
    function promiseWithInterface() : Promise<IPromiseMessage> {\n  return new Promise<IPromiseMessage>\
    \ (\n    resolve: (message: IPromiseMessage) => void,\n    reject: (message: IPromiseMessage)\
    \ => void\n  ) => resolve({message: \"test\", id: I1});\n}\n```\n\nHere, we have\
    \ defined an interface IPromiseMessage that contains a message of type string,\
    \ and an id of type number. Our function promiseWithInterface returns a Promise<IPromiseMessage>,\
    \ and the resolve and reject callback functions now use IPromiseMessage as the\
    \ argument type. Our call to resolve must construct an object with both a message\
    \ property and an id property, in order to correctly implement the IPromiseMessage\
    \ interface. Using interfaces in this way allows our promises to return any type\
    \ of data."
