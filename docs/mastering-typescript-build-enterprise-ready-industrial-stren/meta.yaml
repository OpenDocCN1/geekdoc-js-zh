  md: "# Backbone setup\n\nSetting up a Backbone environment is fairly simple, and\
    \ can be accomplished through tsc and npm as follows:\n\nInitialize the TypeScript\
    \ environment with tsc:\n\n```\ntsc --init\n```\n\nInitialize npm, and install\
    \ Backbone, Bootstrap, JBone, and the declaration files for Backbone using the\
    \ @types syntax, as follows:\n\n```\nnpm init\npm install backbone --save\nnpm\
    \ install bootstrap --save\npm install jbone --save\npm install @types/backbone\
    \ --save\n```\n\n> JBone is an implementation of jQuery specifically built for\
    \ Backbone. It includes all jQuery functionality that Backbone requires, and is\
    \ significantly lighter and faster than the full jQuery library.\n\n# Backbone\
    \ models\n\nFor our sample application, we will build two Backbone models. One\
    \ model will be for each item in our IClickableItem array, and the second model\
    \ will be used to hold the entire array. Let's take a look at the ItemModel:\n\
    \n```\nclass ItemModel extends Backbone implements IClickableItem {\n  get DisplayName():\
    \ string {\n    return this.get('DisplayName');\n  }\n  set DisplayName(value:\
    \ string) {\n    this.set('DisplayName', value);\n  }\n  get Id(): number { return\
    \ this.get('Id'); }\n  set Id(value: number) { this.set('Id', value); }\n  constructor(input:\
    \ IClickableItem) {\n    super();\n    for (let key in input) {\n      if (key)\
    \ { this[key] = input[key]; }\n    }\n  }\n}\n```"
  merge: -1
  pgno: 236
- img_proc: false
  md: "Here, we have a class ItemModel that is derived from Backbone.Model, and implements\
    \ IClickableItem interface. It is using ES5 getter and setter functions for the\
    \ Id and DisplayName properties. With these getter and setter functions, we are\
    \ calling Backbone.get('propertyName') and model.set('propertyName') functions.\
    \ This is because Backbone stores objects internally as attributes. Our constructor\
    \ function is simply looping through each input structure, and this means we can\
    \ construct an ItemModel instance from a JavaScript static object as follows:\n\
    \n```\nlet itemModelInstance = new ItemModel(\n  Id: 1, DisplayName: 'test'));\n\
    ```\n\nThe ability to construct an internal ItemModel in this way means we can\
    \ use any element of our IClickableItem array, and in this resulting Backbone\
    \ model will hydrate correctly.\n\nThe second Model we will construct is to house\
    \ all elements of our IClickable array, and is a Collection of ItemModel instances,\
    \ as follows:\n\n```\nclass ItemCollection\n  extends Backbone.Collection<ItemModel>\
    \ {\n  model = ItemModel;\n}\n```\n\nThis class, named ItemCollection, derives\
    \ from Backbone.Collection<ItemModel>, and has a single property named model.\
    \ This model property is set to the ItemModel class. We can therefore construct\
    \ an ItemCollection as follows:\n\n```\nlet itemCollection = new ItemCollection(\n\
    \  ClickableItemCollection);\n```\n\nSo, in a single line, we have created a Backbone.Collection\
    \ of ItemModel instances from our original array.\n\n# Backbone ItemView\n\nFor\
    \ our sample application, we will also build two Views. One view will be used\
    \ to render each item in our array, and the other view will be used to render\
    \ the entire collection. The item view will therefore be nested inside the collection\
    \ view."
