  md: "# Class constructors\n\nClasses can accept parameters during their initial\
    \ construction. This allows us to combine the creation of a class and setting\
    \ its parameters into a single line of code. Consider the following class definition:\n\
    \n```\nclass ClassWithConstructor {\n  id: number;\n  name: string;\n  constructor(_id:\
    \ number, _name: string) {\n    this.id = _id;\n    this.name = _name;\n  }\n\
    ```\n\nThe ClassWithConstructor class has two properties, an id property of type\
    \ number, and a name property of type string. It also has a constructor function\
    \ that accepts two parameters. The constructor function is assigning the value\
    \ of the _id argument to the class property of id, and the value of the _name\
    \ argument to the class property name. We can then construct an instance of this\
    \ class, as follows:\n\n```\nvar classWithConstructor = new ClassWithConstructor(1,\
    \ \"name\");\n\nconsole.log(`classWithConstructor.id = ${classWithConstructor.id}`);\n\
    nconsole.log(`classWithConstructor.name = ${classWithConstructor.name}`);\n```\n\
    \nThe first line of code creates an instance of the ClassWithConstructor class,\
    \ using the constructor function. We are simply logging the id and name properties\
    \ to the console. The output of this code is:\n\n```\nclassWithConstructor.id\
    \ = 1\nclassWithConstructor.name = name\n```\n\n# Class functions\n\nAll functions\
    \ within a class adhere to the syntax and rules that we covered in the previous\
    \ chapter on functions. As a refresher, all class functions can:\n\n+   - Be strongly\
    \ typed\n- Use the any keyword to relax strong typing\n- Have optional parameters"
  merge: -1
  pgno: 107
