- img_proc: false
  md: "# Decorators, Generics, and Asynchronous Features\n\nNote how we can now pass\
    \ a parameter to the decorator factory, as shown in the usage of @decoratorFactory('testName').\
    \ The output of this code is as follows:\n\n```\ndecorator function called with\
    \ : testName\n```\n\nThere are a few things to note about decorator factories.\
    \ Firstly, the decorator function itself will still be called by the JavaScript\
    \ runtime with automatically populated parameters. Secondly, the decorator factory\
    \ must return a function definition. Lastly, the parameters defined for the decorator\
    \ factory can be used within the decorator function itself.\n\n# Class decorator\
    \ parameters\n\nThe examples we have seen so far are all class decorators. Remember\
    \ that a decorator function will automatically be called by the JavaScript runtime\
    \ when the class is declared. Our decorators function will accept a single parameter\
    \ named constructor, which is of type Function. The JavaScript runtime will populate\
    \ constructor parameter automatically for us. Let's delve into this in a little\
    \ more detail.\n\nClass decorators will be invoked with the constructor function\
    \ of the class that has been decorated. As an example of this, consider the following\
    \ code:\n\n```\nfunction classConstructorDec(constructor: Function) {\n  console.log(`${constructor}`);\n\
    }\n\n@classConstructorDec\n  class ClassWithConstructor {\n}\n```\n\nHere, we\
    \ start with a decorator function named classConstructorDec that accepts a single\
    \ argument named constructor of type Function. The first line of this function\
    \ simply prints the value of the constructor argument. We are then applying this\
    \ decorator to a class named ClassWithConstructor. The output of this code is\
    \ as follows:\n\n```\nconstructor : function ClassWithConstructor() {\n}\n```\n\
    \nThis output therefore shows us that our decorator function is being called with\
    \ the constructor function of the class that it is decorating."
