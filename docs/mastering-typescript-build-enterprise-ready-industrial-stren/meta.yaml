  md: "# TypeScript Compatible Frameworks\n\nThe first section is the definition of\
    \ a variable name, buttonNodes, which calls the map function on the items property,\
    \ as in the call to this.props.items.map. This map function will loop through\
    \ each item in the items array, return an HTML snippet. The snippet returned is\
    \ an HTML element ClickItemView. This element is the same as the class name of\
    \ the ClickItemView we defined earlier. Note how the ClickItem element provides\
    \ a list of attributes, as seen in the {...item} syntax. This syntax is a shorthand\
    \ of passing all properties of the array element to the ClickItemView.\n\nThe\
    \ second section of the renderer function returns the HTML snippet for the entire\
    \ ArrayView. This consists of an <h1> tag, which returns the title property via\
    \ the {this.props.title} syntax. The next tag is a <ul> tag, and within this,\
    \ the {buttonNodes} variable. This HTML snippet, therefore, will include the results\
    \ of our map function as defined by the buttonNodes variable. In way, React allows\
    \ us to use any TypeScript variable or function within our HTML templates in a\
    \ simple and intuitive manner.\n\n# React bootstrapping\n\nIn order to see the\
    \ results of our view definitions rendered in our sample application, we will\
    \ need to bootstrap our React code, similar to what we did for Aurelia. To do\
    \ this, we will modify the app/index.tsx file as follows:\n\n```\nimport * as\
    \ React from \"react\";nimport * as ReactDOM from \"react-dom\";n\nimport { ArrayView,\
    \ ClickableItem }\nfrom \"./AppContext\";\n\nlet ClickableItemArray : ClickableItem[]\
    \ = [\n  { id: 1, displayName: \"firstItem\"},\n  { id: 2, displayName: \"secondItem\"\
    },\n  { id: 3, displayName: \"thirdItem\"},\n];\n\nReactDOM.render(\n  <ArrayView\
    \ items={ClickableItemArray}\n    title=\"Select an option:\" />,\n  document.getElementById(\"\
    example\")\n)\n```"
