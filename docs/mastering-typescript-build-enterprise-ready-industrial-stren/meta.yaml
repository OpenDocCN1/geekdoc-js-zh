  md: "Note how the _decorate function now includes extra calls to a function named\
    \ _metadata, which is called three times. The first call uses a special metadata\
    \ key of 'design:type', the second uses the metadata key 'design:paramtypes',\
    \ and the third call uses the metadata key 'design:returntype'. These three calls\
    \ to the _metadata function are, in fact, registering extra information about\
    \ the print function itself. The 'design:type' key is used to register that the\
    \ print function has two parameters—the first a Number, and the second a String.\
    \ The 'design:paramtypes' key is used to register that the print function design:returntype'\
    \ key is used to register the return type of the print function, in our case,\
    \ is a number.\n\n# Using decorator metadata\n\nIn order to use this information\
    \ within a decorator, we will need to use a third-party library named reflect-metadata.\
    \ We will discuss how to use third-party libraries in detail future chapters,\
    \ but for the time being, this library can be included in our project by typing\
    \ the following command:\n\n```\nnpm install reflect-metadata --save-dev\n```\n\
    \nOnce this has been installed, we will need to reference it in our TypeScript\
    \ file by including the following line at the top of the file:\n\n```\nimport\
    \ 'reflect-metadata';\",\n```\n\nBefore we attempt to compile any code that is\
    \ using the reflect-metadata library, we will need to install the declaration\
    \ file for this library as follows:\n\n```\nnpm install @types/reflect-metadata\
    \ --save-dev\n```\n\nWe will discuss declaration files in detail in the next chapter.\n\
    \nWe can now start to use this class metadata by calling the Reflect.getMetadata\
    \ within our decorator. Consider the following update to our earlier parameter\
    \ decorator:\n\n```\nfunction metadataParameterDecorator(target: any,\n  methodName:\
    \ string,\n  parameterIndex: number) {\n\n  let designType = Reflect.getMetadata(\n\
    \    \"design:type\", target, methodName);\n  console.log(`design:type: ${designType}\\\
    `\n  let designParamTypes = Reflect.getMetadata(\n    \"design:paramtypes\", target,\
    \ methodName);\n  console.log(`paramtypes: ${designParamTypes}\\`);\n```"
