  md: 'Writing and Using Declaration Files


    # Class functions


    Classes can contain functions. You will need to list each function of your JavaScript
    class within your class declaration, in order for the TypeScript compiler to accept
    calls to these functions.


    The JavaScript syntax =


    ```

    var classWithFunction = new ClassWithFunction();

    classWithFunction.functionToRun();

    ```


    The declaration file syntax


    ```

    declare class ClassWithFunction {

    functionToRun(): void;

    }

    ```


    > Functions or properties that are considered as private do not need to be exposed
    via the declaration file, and can simply be omitted.


    # Static properties and functions


    Class methods and properties can be static. If your JavaScript functions or properties
    can be called without needing an instance of an object to work with, then these
    properties or functions will need to be marked as static.


    The JavaScript syntax


    ```

    StaticClass.staticId = 1;

    StaticClass.staticFunction();

    ```


    The declaration file syntax


    ```

    declare class StaticClass {

    static staticId: number;

    static staticFunction();

    }

    ```


