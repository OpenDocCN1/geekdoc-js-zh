  md: '# # Writing and Using Declaration Files


    One of the most appealing facets of JavaScript development is the myriad of external
    JavaScript libraries that have already been published, such as jQuery, Knockout,
    and Underscore. We have already seen how TypeScript uses “syntactic sugar” to
    enhance our JavaScript development experience, but how do we apply this “sugar”
    to existing JavaScript or JavaScript libraries? The answer is relatively simple–declaration
    files.


    A declaration file is a special type of file used by the TypeScript compiler.
    It is marked with a `.d.ts` extension, and is then used by the TypeScript compiler
    within the compilation step. Declaration files are similar to header files used
    in other languages; they simply describe the syntax and structure of available
    functions and properties, but do not provide an implementation. Declaration files,
    therefore, do not actually generate any JavaScript code. They are simply to provide
    TypeScript compatibility with external libraries, or to fill the gaps for JavaScript
    code that TypeScript does not know about. In order to use external JavaScript
    library within TypeScript, you will need a declaration file.


    In this chapter, we will explore declaration files, show the reasoning behind
    them, and build one based on some existing JavaScript code. If you are familiar
    with declaration files and how to use them, then you may be interested in the
    Declaration Syntax Reference section, which is designed as a quick reference guide
    to the module definition syntax. Since writing declaration files is a rather small
    part of TypeScript development, we do not write them very often.'
