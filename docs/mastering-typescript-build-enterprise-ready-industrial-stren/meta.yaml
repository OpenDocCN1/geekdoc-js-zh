  md: '# Introducing TypeScript


    TypeScript is both a language and a set of tools to generate JavaScript. It was
    designed by Anders Hejöberg at Microsoft (the designer of C#), and is an open
    source project to help developers write enterprise-scale JavaScript.


    TypeScript generates JavaScript – it’s as simple as that. Instead of requiring
    a completely new runtime environment, TypeScript-generated JavaScript can reuse
    all of the existing JavaScript tools, frameworks, and the wealth of libraries
    that are already available for JavaScript. The TypeScript language and compiler,
    however, bringing the development of JavaScript closer to a more traditional object-oriented
    experience.


    # The ECMAScript standard


    JavaScript as a language has been around for a long time, and is governed by a
    language feature standard. The language defined in this standard is ECMAScript,
    and each JavaScript interpreter must deliver functions and features that conform
    to this standard. The definition of this standard helped the growth of JavaScript
    and the web in general, allowed websites to render correctly on many different
    browsers on many different operating systems. The ECMAScript standard was published
    in 1999 and is known as **ECMA-262**, third edition.


    With the popularity of the language, and the explosive growth of Internet applications,
    the ECMAScript standard needed to be revised and updated. This revision process
    resulted in an updated draft specification for ECMAScript, the fourth edition.
    Unfortunately, this draft also suggested a complete overhaul of the language,
    and therefore was not well received. Eventually, leaders from Yahoo, Google, and
    Microsoft drafted an alternate proposal, which they called **ECMAScript 3.1**.
    This proposal was numbered 3.1, as it was a smaller feature of the third edition,
    and sat between three and four of the standard.


    The proposal for a complete language overhaul was eventually adopted as the fifth
    edition of the standard, and was called ECMAScript 5. The ECMAScript fourth edition
    was never published, but it was decided to merge the best features of both the
    fourth edition and the 3.1 feature set into a sixth edition **ECMAScript Harmony**.


    The TypeScript compiler has a parameter that can switch between different versions
    of the ECMAScript standard. TypeScript currently supports ECMAScript 3, ECMAScript
    5, ECMAScript 6, and even ECMAScript 7 (also known as ECMAScript 2016).'
  merge: -1
  pgno: 29
- img_proc: false
  md: '# TypeScript - Tools and Framework Options


    When the compiler runs over your TypeScript, it will generate compile errors if
    the code you are attempting to compile is not valid for that standard. The team
    at Microsoft has committed to following the ECMAScript standards in any new versions
    of the TypeScript compiler, so as new editions are adopted, the TypeScript language
    and compiler will follow


    An understanding of the finer details of what is included in each release of the
    ECMAScript standard is outside the scope of this book, but it is important to
    know that there are differences. Some browser versions do not support ES5 (IE8
    is an example), but most do. When selecting a version of ECMAScript to target
    for your projects, you will need to consider which browser versions you will be
    supporting, or which standard your JavaScript runtime supports.


    # The benefits of TypeScript


    To give you a flavor of the benefits of TypeScript (and this is by no means the
    full list), let''s take a very quick look at some of the things TypeScript brings
    to the table:


    +   - A compilation step

    - Strong or static typing

    - Type definitions for popular JavaScript libraries

    - Encapsulation

    - Private and public member variable decorators


    # Compiling


    One of the most frustrating things about JavaScript development is the lack of
    a compilation step. JavaScript is an interpreted language, and therefore needs
    to be run against an interpreter to order that it is valid. Every JavaScript developer
    has horror stories that they recount of hours spent trying to find bugs in their
    code, only to find that they missed a stray closing brace {, or a simple comma
    , - even a double quote " where there should have been a single quote '' . Even
    worse, the real headaches arrive when you mispell a property name, or unintentionally
    reassign a global variable.


    TypeScript will compile your code, and generate compilation errors where it finds
    sorts of syntax error. This is obviously very useful, and can help to highlight
    errors before the JavaScript is even run. In large projects, programmers will
    often need to do large code merges – with today''s tools doing automatic merges,
    it is surprising how often the compiler will pick up these types of errors.'
  merge: -1
