  md: '# TypeScript - Tools and Framework Options


    Once Node is installed, TypeScript can be installed by simply typing:


    ```

    npm install -g typescript

    ```


    This command invokes the Node Package Manager (npm) to install TypeScript as a
    global module (the -g option), which will make it available no matter what directory
    we are currently in. Once TypeScript has been installed, we can display the current
    version of the compiler by typing the following:


    ```

    tsc -v

    ```


    At the time of writing, the TypeScript compiler is at version 2.1.5, and therefore
    the output of this command is as follows:


    Version 2.1.5


    Let''s now create a TypeScript file hello.ts, with the following content:


    ```

    console.log(''hello TypeScript'');

    ```


    From the command line, we can use TypeScript to compile this file into a JavaScript
    file by issuing the command:


    ```

    tsc hello.ts

    ```


    Once the TypeScript compiler has completed, it will have generated a hello.js
    file in the current directory.


    # Creating a tsconfig.json file


    The TypeScript compiler uses a tsconfig.json file at the root of the project directory
    to specify any global project settings and compiler options. This means that,
    instead of compiling our TypeScript files one by one (by specifying each file
    on the command line), we can simply type tsc from the project root directory,
    and TypeScript recursively find and compile all TypeScript files within the root
    directory and all subdirectories. The tsconfig.json file that TypeScript needs
    in order to do this can be created from the command line by simply typing:


    ```

    tsc --init

    ```'
