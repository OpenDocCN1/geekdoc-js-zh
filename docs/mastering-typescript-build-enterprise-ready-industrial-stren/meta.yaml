    \ would end up like:\n\n```\n<body>\n  <script type=\"text/javascript\">\n  var\
    \ CONTACT_EMAIL_ARRAY = [\n    \"help@site.com\",\n    \"contactus@site.com\"\
    ,\n    \"webmaster@site.com\"\n  ];\n</script>\n</body>\n```"
