  md: '# Declaration syntax reference


    When creating declaration files and using the module keyword, there are a number
    of rules that can be used to mix and match definitions. As a TypeScript programmer,
    you will generally only write definitions every now and then, and on occasion,
    need to add a new definition to an existing declaration file.


    This section, therefore, is designed to be a quick reference guide to this declaration
    file syntax, or a cheat sheet. Each section contains a description of the module
    definition rule, a JavaScript syntax snippet, and the equivalent TypeScript declaration
    file syntax.


    To use this reference section, simply match the JavaScript that you are trying
    to emulate from the JavaScript syntax section, and write your declaration file
    with the equivalent definition syntax. We will start with the function overrides
    syntax as an example.


    # Function overrides


    Declaration files can include multiple definitions for the same function. If the
    same JavaScript function can be called with different types, you will need to
    declare a function override for each variant of the function.


    The JavaScript syntax


    ```

    trace("trace a string");

    trace(true);

    trace(1);

    trace({ id: 1, name: "test" });

    ```


    The declaration file syntax


    ```

    declare function trace(arg: string | number | boolean );

    declare function trace(arg: { id: number; name: string });

    ```


    ![](bbox=[0.137, 0.711, 0.203, 0.766])


    Each function definition must have a unique function signature.'
  merge: -1
  pgno: 192
- img_proc: false
  md: "# Nested namespaces\n\nModule definitions can contain nested module definitions,\
    \ which then translate to nested namespaces. If your JavaScript uses namespaces,\
    \ then you will need to define nested module declarations to match the JavaScript\
    \ namespaces.\n\n# The JavaScript syntax\n\n```\nFirstNamespace.SecondNamespace.ThirdNamespace.log(\"\
    test\");\n```\n\n# The declaration file syntax\n\n```\ndeclare module FirstNamespace\
    \ {\n  module SecondNamespace {\n    module ThirdNamespace {\n      function log(msg:\
    \ string);\n    }\n  }\n}\n```\n\n# Classes\n\nClass definitions are allowed within\
    \ module definitions. If your JavaScript uses classes, the new operator, then\
    \ the newable classes will need to be defined in your declaration file.\n\n# The\
    \ JavaScript syntax\n\n```\nvar myClass = new MyClass();\n```\n\n# The declaration\
    \ file syntax\n\n```\ndeclare class MyClass { }\n```\n\n# Class namespaces\n\n\
    Class definitions are allowed within nested module definitions. If your JavaScript\
    \ classes have a preceding namespace, you will need to declare nested modules\
    \ to match the namespaces first, and then you can declare classes within the correct\
    \ namespace.\n\n# The JavaScript syntax\n\n```\nvar myNestedClass = new OuterName.InnerName.NestedClass();\n\
    ```"
