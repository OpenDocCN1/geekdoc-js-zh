  md: "# Decorators, Generics, and Asynchronous Features\n\nHere, we have a standard\
    \ parameter decorator named metadataDec and a class definition named ClassWithMetadata.\
    \ We are decorating the first parameter of the print function. If we are not using\
    \ the emitDecoratorMetadata compile option, or if this option is set to false,\
    \ the generated JavaScript would be defined as follows:\n\n```\nvar ClassWithMetadata\
    \ = (function () {\n  function ClassWithMetadata() {\n  }\n  ClassWithMetadata.prototype.print\
    \ = function (id, name) {\n  };\n  __decorate(\n    __param(0, metadataParameterDec),\n\
    \    ClassWithMetadata.prototype, \"print\");n  );\n  return ClassWithMetadata;\n\
    })());\n```\n\nThis generated JavaScript defines a standard JavaScript closure\
    \ for our ClassWithMetadata. The code that we are interested in is near the bottom\
    \ of the closure, the TypeScript compiler injected a method named __decorate.\
    \ We will not concern ourselves with the full functionality of this __decorate\
