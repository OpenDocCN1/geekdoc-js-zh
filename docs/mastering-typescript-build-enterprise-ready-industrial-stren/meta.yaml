  md: "Class functions are public by default. Not specifying an access modifier\n\
    of private for either properties or functions will cause their access level\n\
    to default to public. Classes can also mark functions and properties\nprotected,\
    \ but we will cover this keyword a little later when we discuss\ninheritance.\n\
    \n# # Constructor access modifiers\n\nTypeScript also introduces a shorthand version\
    \ of the constructor function, allowing you to\nspecify parameters with access\
    \ modifiers directly in the constructor. Consider the following\ncode:\n\n```\n\
    ```typescript\nclass classWithAutomaticProperties {\n  constructor(public id:\
    \ number, private name: string){\n}\n\nlet myAutoClass = new classWithAutomaticProperties(\n\
    \  `className`\n);\nconsole.log(`myAutoClass id: ${myAutoClass.id}`);\nconsole.log(`myAutoClass\
    \ name: ${myAutoClass.name}`);\n```\n```\n\nThis snippet defines a class named\
    \ ClassWithAutomaticProperties. The\nconstructor function uses two arguments-an\
    \ id of type number, and a name of type\nstring. However, the access modifiers\
    \ of public id and private for name. This\nhorthand automatically creates a public\
    \ id property on the\nClassWithAutomaticProperties class, and a private name property.\n\
    \n> > This syntax is available within the constructor function.\n\nWe create a\
    \ variable named myAutoClass and assign a new instance of the\nClassWithAutomaticProperties\
    \ class to it. Once this class is instantiated, it\nautomatically has two properties:\
    \ an id of type number, which is public, and a\nname property of type string,\
    \ which is private. Compiling the previous code, however,\nwill produce a TypeScript\
    \ compile error:\n\n```\nProperty 'name' is private and only accessible\nwithin\
    \ class 'classWithAutomaticProperties'.\n```"
  merge: -1
