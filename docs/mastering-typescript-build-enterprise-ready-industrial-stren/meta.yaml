  md: "# Decorators, Generics, and Asynchronous Features\n\nAs can be seen in this\
    \ output, our decorator audit function is being called before the actual implementation\
    \ of the print function on the class. Using decorators in this way is a powerful\
    \ method of injecting extra functionality non-intrusively into a class declaration.\
    \ Any class we create can easily the auditing functionality simply by decorating\
    \ the relevant class methods.\n\n# Parameter decorators\n\nThe final type of decorator\
    \ that we will cover are parameter decorators. Parameter decorators are used to\
    \ decorate the parameters of a particular method. As an example, consider the\
    \ following code:\n\n```\nfunction parameterDec(target: any,\n  methodName: string,\n\
    \  parameterIndex: number) {\n    console.log(`target: ${target}`);\n    console.log(`methodName:\
    \ ${methodName}`);\n    console.log(`parameterIndex: ${parameterIndex}`);\n}\n\
    ```\n\nHere, we have defined a function parameterDec, with three arguments. The\
    \ target argument will contain the class prototype as we have seen before. The\
    \ methodName argument will contain the name of the method that contains the parameter,\
    \ and the parameterIndex argument will contain the index of the parameter. We\
    \ can use this parameter decorator function, as follows:\n\n```\nclass ClassWithParamDec\
    \ {\n  print(@parameterDec value: string) {\n}\n```\n\nHere, we have a class ClassWithParamDec,\
    \ that contains a single print function. This print has a single argument value\
    \ which is of type string. We have decorated this value parameter with the parameterDec\
    \ decorator. Note that the syntax for using a parameter decorator (@parameterDec)\
    \ is the same as any other decorator. The output of this code is as follows:\n\
    \n```\ntarget: [object Object]\nmethodName : print\nparameterIndex : 0\n```"
