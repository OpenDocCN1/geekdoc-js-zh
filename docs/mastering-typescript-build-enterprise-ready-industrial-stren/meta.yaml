    # Explicit casting


    As any strongly typed language, there comes a time when you need to explicitly
    specify the type of an object. This concept will be expanded upon more thoroughly
    in the next chapter, but it is worthwhile to make a quick about explicit casting.
    An object can be cast to the type of another using the <> syntax.


    > This is not a cast in the strictest sense of the word; it is more of an assertion
    that is used at runtime by the TypeScript compiler. Any explicit casting that
    you use will be compiled away in the resultant JavaScript and will not affect
    the code.


    Take a look at an example that uses explicit casting, as follows:


    ```

    var item1 = <any> { id: 1, name: "item 1" };

    item1 = { id: 2 };

    ```


    Here, now place cast any type specifier on the left-hand side of the assignment,
    with an explicit cast of <any> on the right-hand side. This tells the compiler
    to treat the { id: 1, name: "item 1" } object on the right-hand side of the assignment
    operator as a type of any. So the item1 variable on the left-hand side of the
    assignment, therefore, also has the type of any (due to TypeScript’s inferred
    typing rules).'
