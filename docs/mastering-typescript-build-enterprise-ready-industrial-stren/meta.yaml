  md: "# Interfaces, Classes, and Inheritance\n\n```\nclass BaseClassWithFunction\
    \ {\n  public id : number;\n  getProperties() : string {\n    return `id: ${this.id}`;\n\
    \  }\n}\n\nclass DerivedClassWithFunction extends BaseClassWithFunction {\n  public\
    \ name: string;\n  getProperties() : string {\n    return `${super.getProperties()}`\n\
    \      + `, name: ${this.name}`;\n  }\n}\n```\n\nHere, we have defined a class\
    \ BaseClassWithFunction, which has a public id property, and a function named\
    \ getProperties, which just returns a string representation of the properties\
    \ of the class. Our DerivedClassWithFunction, however, also includes a function\
    \ called getProperties. This function is a function overload of the getProperties\
    \ base class function. In order to call the base class function, we need to use\
    \ the super keyword, as shown in the call to super.getProperties.\n\nLet's take\
    \ a look at how we would use these classes:\n\n```\nvar derivedClassWithFunction\
    \ = new DerivedClassWithFunction();\nderivedClassWithFunction.id = 1;\nderivedClassWithFunction.name\
    \ = \"derivedName\";nconsole.log(derivedClassWithFunction.getProperties());\n\
    ```\n\nThis code creates a variable derivedClassWithFunction, which is an instance\
    \ of the DerivedClassWithFunction class. It sets both the id and name properties,\
    \ and then logs to the console result of calling the getProperties function. This\
    \ code snippet will result in the following:\n\nid: 1 , name: derivedName\n\n\
    The results show that the getProperties function of the derivedClassWithFunction\
    \ variable will call through to the base class getProperties function, as expected."
