  trans: "\n在这个示例中，我们定义了一个包含构造函数和 `greet()` 方法的 `Person` 类。然后，我们使用 `extends` 关键字创建了一个继承自\
    \ `Person` 类的 `Student` 类。`Student` 类有自己的构造函数，该函数通过调用 `super()` 方法来触发父类的构造函数。它还有一个专门针对学生的\
    \ `study()` 方法。\n\n通过利用继承，我们可以创建一个共享共同属性和行为的对象层次结构，同时还可以针对特定目的对其进行扩展和定制。\n\n###\
    \ 11.4 JavaScript 中的多态\n\n多态允许将不同类的对象视为同一公共父类的对象。在 JavaScript 中，多态可以通过在不同的类中定义同名的方法来实现。\n\
    \n这里是一个示例：\n\n```javascript\nclass Shape {\n  constructor() {\n    this.name =\
    \ 'Shape';\n  }\n  draw() {\n    console.log('Drawing a shape.');\n  }\n}\n\n\
    class Circle extends Shape {\n  constructor() {\n    super();\n    this.name =\
    \ 'Circle';\n  }\n  draw() {\n    console.log('Drawing a circle.');\n  }\n}\n\n\
    class Square extends Shape {\n  constructor() {\n    super();\n    this.name =\
    \ 'Square';\n  }\n  draw() {\n    console.log('Drawing a square.');\n  }\n}\n\n\
    const shape = new Shape();\nconst circle = new Circle();\nconst square = new Square();\n\
    shape.draw(); // Output: Drawing a shape.\ncircle.draw(); // Output: Drawing a\
    \ circle.\nsquare.draw(); // Output: Drawing a square.\n```\n\n在这个示例中，我们定义了一个带有\
    \ `draw()` 方法的 `Shape` 类。然后我们创建了 `Circle` 和 `Square` 类，它们继承自 `Shape` 类并通过自己的实现覆盖了\
    \ `draw()` 方法。尽管调用了相同的方法名，每个对象根据其特定的类表现出不同的行为。\n\n多态允许我们编写可以相互替换不同类对象的代码，从而提高了灵活性和扩展性。\n\
    \n### 11.5 总结\n\nJavaScript 中的面向对象编程通过利用对象、封装、继承和多态提供了一种结构和组织代码的强大方式。通过理解 OOP\
    \ 的原则和技术，我们可以创建更模块化、可重用且易维护的 JavaScript 应用程序。\n\n在本章中，我们探索了 JavaScript 面向对象编程的基础，包括创建对象、继承和多态。我们还讨论了如何使用构造函数和\
    \ ES6 引入的 `class` 语法。\n\n在下一书中，我们将深入 JavaScript 编程的另一个基本方面：错误处理和调试技术。理解如何处理错误和有效地调试代码将极大增强我们的开发流程，并帮助我们构建健壮的\
    \ JavaScript 应用程序。\n\n# 第 12 章：JavaScript 中的错误处理与调试\n\n在本章中，我们将探索 JavaScript 中的错误处理和调试技术。作为开发者，遇到错误和\
    \ bug 是开发过程中的常见部分。能够有效地处理错误并调试代码对于构建健壮可靠的 JavaScript 应用程序至关重要。\n\n### 12.1 理解\
    \ JavaScript 中的错误\n\nJavaScript 中的错误可能由于多种原因引起，例如语法错误、逻辑错误或运行时异常。当代码执行过程中发生错误时，它可能会中断正常流程并导致应用程序崩溃。\n\
    \nJavaScript 提供了内置的错误对象，如 `SyntaxError`、`TypeError` 和 `ReferenceError` 来表示不同类型的错误。这些错误对象包含了有用信息，包括错误消息和帮助识别错误来源的堆栈跟踪（stack\
    \ trace）。\n\n### 12.2 使用 try...catch 处理错误\n\n`try...catch` 语句用于处理 JavaScript 中的错误。它允许我们将一段代码封装在\
    \ `try` 块中，并指定一个 `catch` 块，如果在 `try` 块内发生错误则执行该块。\n\n这里是一个示例：\n\n```javascript\n\
    try {\n  // 可能会抛出错误的代码\n  const result = someFunction();\n  console.log(result);\n\
    } catch (error) {\n  // 处理错误的代码\n  console.log('发生错误:', error.message);\n}\n```\n\
    \n在这个示例中，`try` 块包含了可能抛出错误的代码。如果发生错误，它将被 `catch` 块捕获，我们可以进行相应的处理。`catch` 块中的 `error`\
    \ 参数代表错误对象。\n\n通过使用 `try...catch`，我们可以优雅地处理错误并防止它们导致应用程序崩溃。我们还可以提供回退行为或向用户显示有意义的错误消息。\n\
    \n### 12.3 出自定义错误\n\n除了内置错误对象，JavaScript 还允许我们使用 `throw` 语句创建自定义错误对象。自定义错误可以提供关于错误性质更具体的信息，并帮助调试。\n\
    \n这是一个抛出自定义错误的示例：\n\n```javascript\nfunction divide(a, b) {\n  if (b === 0) {\n\
    \    throw new Error('不允许除以零.');\n  }\n  return a / b;\n}\n\ntry {\n  const result\
    \ = divide(10, 0);\n  console.log(result);\n} catch (error) {\n  console.log('发生错误:',\
    \ error.message);\n}\n```\n\n在这个示例中，`divide` 函数检查除数（`b`）是否为零。如果是，则会抛出一个带有描述性错误消息的自定义\
    \ `Error` 对象。然后该错误在 `catch` 块中被捕获并处理。\n\n通过抛出自定义错误，我们可以为异常情况提供更有意义的信息，并引导调试过程。\n\
    \n### 12.4 调试技术\n\n调试是识别和修复代码中 bug 的过程。JavaScript 许多工具和技术来辅助调试过程。一些常用的技术包括：\n\n\
    - Console.log：在代码的策略位置放置 `console.log` 语句，允许我们在控制台中输出值或消息进行检查。\n- 断点（Breakpoints）：现代浏览器提供了带有内置调试器的开发工具。通过在特定代码行设置断点，我们可以暂停执行并检查变量、单步执行以及分析执行流。\n\
    - 调试工具：开发工具还提供了一系列调试功能，如检查调用栈、监控网络请求、分析内存使用和性能分析。\n- 错误消息：关注控制台中显示的错误消息可以提供错误原因的重要见解。错误消息通常包含错误类型、发生错误的特定代码行以及有助于定位问题的额外细节。\n\
    - 代码审查（Code Review）：请求同事或伙伴审查我们的代码可以提供新的视角，并识别我们可能忽略的问题。\n- 橡鸭调试（Rubber Duck Debugging）：向无物体（如橡鸭子）解释我们的代码和试图解决的问题可以帮助我们发现逻辑错误或找到替代方案。口述问题的过程通常会带来新的见解和发现。\n\
    \n通过利用这些调试技术，我们可以有效地识别并解决 JavaScript 代码中的 bug，从而构建更可靠稳定的应用程序。\n\n### 12.5 处理异步错误\n\
    \nJavaScript 经常涉及异步操作，例如发送网络请求或从数据库访问数据。处理异步代码中的错误需要不同的方法。\n\n一种常见的方法使用 Promise\
    \ 和 `catch` 方法来处理错误：\n\n```\nasync function fetchData() {\n  try {\n    const\
    \ response = await fetch('https://api.example.com/data');\n    const data = await\
    \ response.json();\n    // 处理数据\n  } catch (error) {\n    console.log('发生错误:',\
    \ error.message);\n  }\n}\n\nfetchData();\n```\n"
