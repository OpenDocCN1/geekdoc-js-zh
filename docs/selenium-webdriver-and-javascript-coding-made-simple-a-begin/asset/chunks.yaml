  trans: "\n在处理 `JavaScript` 模块时，遵循一些最佳实践对于确保代码整洁且可维护至关重要：\n\n- 保持模块聚焦：每个模块应该具有单一的职责或专注于某个特定功能。这有助于保持代码库的整洁，并便于理解和维护。\n\
    - 使用显式导出：与其依赖默认导出（default export），更建议显式地导出你想要从模块中暴露的实体。这可以明确哪些哪些实体是打算供其他模块使用的。\n\
    - 谨慎使用默认导出：默认导出在某些场景下很有用，但应该谨慎使用。使用命名导出（named exports）可以更容易理解从模块中导入了什么内容。\n- 最小化模块依赖：避免创建对其他模块有过度依赖的模块。这降低了循环依赖的风险，并简化了重构或移除模块的过程。\n\
    - 注意模块大小：虽然模块促进了代码组织，但保持平衡并避免创建过大的模块也同样重要。如果一个模块变得太大或太复杂，请考虑将其重构为更小、更集中的模块。\n\n\
    通过遵循这些最佳实践，你可以确保你的模块化 `JavaScript` 代码是可维护、可重用且易于理解的。\n\n## 10.4 模块环境与工具\n\n`JavaScript`\
    \ 模块可以在不同的环境中运行，例如 浏览器和 `Node.js`。然而，支持的具体模块语法和特性可能会根据环境而异。\n\n在 浏览器中，现代浏览器支持原生模块系统。然而，如果你需要支持旧版浏览器或有更复杂的需求，你可能需要使用如\
    \ `webpack` 或 `Rollup` 等打包器将你的模块转换并打包成兼容旧浏览器的单个 `JavaScript` 文件。\n\n在 `Node.js`\
    \ 中，传统上使用 CommonJS 模块系统。但从 `Node.js` 版本 12 开始，增加了对 ECMAScript 模块 (`ESM`) 的支持，允许你在\
    \ `Node.js` 应用中使用原生模块语法。\n\n在处理模块时，还有各种工具和框架提供额外的功能和优化。流行的工具包括 `TypeScript`、`Babel`\
    \ 和 `Parcel`。这些工具可以增强你的开发流，并让你利用高级模块的能力。\n\n## 10.5 结论\n\n`JavaScript` 模块在现代 `JavaScript`\
    \ 开发中起着至关重要的作用。它们允许我们编写模块化、可重用的代码，并防止全局命名空间污染。通过利用 `export` 和 `import` 关键字，我们可以定义模块中应供其他模块访问的部分，并根据需要轻松导入它们。\n\
    \n在本章中，我们涵盖了 `JavaScript` 模块的基础知识，包括模块语法、实体的导出和导入，以及模块化开发的最佳实践。我们还讨论了模块环境以及在不同语境下支持模块开发的工具。\n\
    \n通过采用模块化开发实践并利用 `JavaScript` 模块的力量，你可以创建更具维护性、可扩展性且组织良好的代码库。在下一章中，我们将深入探索 `JavaScript`\
    \ 中类和面向对象编程的世界，将我们的代码组织和重用性提升到新的高度。\n\n# 第 11 章：JavaScript 中的面向对象编程\n\n在本章中，我们将探索\
    \ `JavaScript` 中的面向对象编程 (OOP)。面向对象编程是一种强大的范式，允许我们将现实世界的实体建模为对象，在对象内部封装数据和行为，并在它们之间进行交互。`JavaScript`\
    \ 通过基于原型的继承系统支持 OOP 原则。\n\n## 11.1 面向对象编程简介\n\n面向对象编程是以“对象”为核心概念的编程范式。对象是 `class`\
    \ 的实例，类充当蓝图，定义了属于该类的对象的属性和行为。\n\n面向对象编程的核心原则是：\n\n- 封装：封装允许我们将相关的数据（属性）和功能（方法）封装在一个对象内部，防止外部的直接访问，并通过定义的定义的接口提供受控的访问。\n\
    - 继承：继承允许对象从其他对象继承属性和方法。它促进了代码复用和类之间的层次结构关系。\n- 多态：多态允许不同类的对象被视为共同父类的对象。它允许根据它们共享的行为对对象进行灵活且可交换的使用。\n\
    \n## 11.2 在 JavaScript 中创建对象\n\n在 `JavaScript` 中，可以使用对象字面量（object literals）或构造函数创建对象。\n\
    \n对象字面量是一种通过直接定义属性和方法来创建对象的方便方法。这是一个示例：\n\n```javascript\nconst person = {\n \
    \ name: 'John',\n  age: 30,\n  greet() {\n    console.log(`Hello, my name is ${this.name}\
    \ and I'm ${this.age} years old.`);\n  }\n};\n\nperson.greet(); // 输出: Hello,\
    \ my name is John and I'm 30 years old.\n```\n\n构造函数提供了一种使用 `new` 关键字基于蓝图（类）创建对象的方法。这是一个示例：\n\
    \n```javascript\nfunction Person(name, age) {\n  this.name = name;\n  this.age\
    \ = age;\n}\n\nPerson.prototype.greet = function() {\n  console.log(`Hello, my\
    \ name is ${this.name} and I'm ${this.age} years old.`);\n};\n\nconst person =\
    \ new Person('John', 30);\nperson.greet(); // 输出: Hello, my name is John and I'm\
    \ 30 years old.\n```\n\n在这个示例中，我们定义了一个 `Person` 构造函数，它接收 `name` 和 `age` 作为参数。我们使用\
    \ `this` 关键字将这些值赋值给对象。`greet()` 方法被添加到 `Person` 构造函数的原型上，以便供所有实例共享该功能。\n\n## 11.3\
    \ JavaScript 中的继承与原型\n\n`JavaScript` 使用原型链来实现对象之间的继承。每个对象都有一个名为 `[[Prototype]]`\
    \ 的内部属性，指向其原型对象。原型用于从其他对象继承属性和方法。\n\n我们可以使用 `Object.create()` 方法或 ECMAScript 2015\
    \ (ES6) 引入的 `class` 语法在对象之间创建继承关系。\n\n使用 `Object.create()` 的示例：\n\n```javascript\n\
    const personPrototype = {\n  greet() {\n    console.log(`Hello, my name is ${this.name}\
    \ and I'm ${this.age} years old.`);\n  }\n};\n\nconst person = Object.create(personPrototype);\n\
    person.name = 'John';\nperson.age = 30;\nperson.greet(); // 输出: Hello, my name\
    \ is John and I'm 30 years old.\n```\n\n在这个示例中，我们创建了一个 `personPrototype` 对象作为\
    \ `person` 对象的原型。`person` 对象从 `personPrototype` 对象继承了 `greet()` 方法。\n\n或者，我们可以使用\
    \ `class` 语法来定义类并创建继承关系。这是一个示例：\n\n```javascript\nclass Person {\n  constructor(name,\
    \ age) {\n    this.name = name;\n    this.age = age;\n  }\n\n  greet() {\n   \
    \ console.log(`Hello, my name is ${this.name} and I'm ${this.age} years old.`);\n\
    \  }\n}\n\nclass Student extends Person {\n  constructor(name, age, grade) {\n\
    \    super(name, age);\n    this.grade = grade;\n  }\n\n  study() {\n    console.log(`${this.name}\
    \ is studying hard for the ${this.grade} grade.`);\n  }\n}\n\nconst student =\
    \ new Student('John', 15, 9);\nstudent.greet(); // 输出: Hello, my name is John\
    \ and I'm 15 years old.\nstudent.study(); // 输出: John is studying hard for the\
    \ 9th grade.\n```\n\n"
