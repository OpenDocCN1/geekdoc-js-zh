    ## 2.2 JavaScript 运算符


    JavaScript 中的运算符是用于对操作数（值或变量）执行操作的符号。它们允许我们进行数学计算、比较值、赋值值等。让我们探索 JavaScript 中一些常用的运算符。


    ### 2.2.1 算术运算符


    算术运算符用于执行数学计算。JavaScript 包含了以下算术运算符：


    - 加法 (`+`)：将两个数字相或连接两个字符串。

    - 减法 (`-`)：从一个数字中减去另一个数字。

    - 乘法 (`*`)：将两个数字相乘。

    - 除法 (`/`)：将一个数字除以另一个数字。

    - 取模 (`%`)：返回除法后的余数。

    - 递增 (`++`)：将值加 1。

    - 递减 (`--`)：将值减 1。


    这里是一个演示算术运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var sum = x + y;       // 7

    var difference = x - y; // 3

    var product = x * y;    // 10

    var quotient = x / y;   // 2.5

    var remainder = x % y;  // 1

    x++; // x is now 6

    y--; // y is now 1

    ```


    ### 2.2.2 赋值运算符


    赋值运算符用于给变量赋值。它们将赋值运算符 (`=`) 与其他算术或逻辑运算符结合。最常见的赋值运算符有：


    - `=`：将值赋给变量。

    - `+=`：将值加到变量的当前值并赋值结果。

    - `-=`：从变量的当前值中减去值并结果结果。

    - `*=`：将变量的当前值乘以值并赋值结果。

    - `/=`：将变量的当前值除以值并赋值结果。


    这里有一个说明赋值运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    x += y; // 等同于 x = x + y; (x is now 7)

    y -= 1; // 等同于 y = y - 1; (y is now 1)

    ```


    ### 2.2.3 比较运算符


    比较运算符用于比较值并返回布尔结果（true 或 false）。它们通常用于条件语句和循环中。以下是 JavaScript 中的一些比较运算符：


    - `==`：检查两个值是否相等。

    - `!=`：检查两个值是否不等。

    - `>`：检查左侧的值是否大于右侧的值。

    - `<`：检查左侧的值是否小于右侧的值。

    - `>=`：检查左侧的值是否大于或等于右侧的值。

    - `<=`：检查左侧的值是否小于或等于右侧的值。

    - `===`：检查两个值是否严格相等（同时检查值和类型）。


    这里有一个演示比较运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    console.log(x == y);    // false

    console.log(x > y);     // true

    console.log(x <= 5);    // true

    console.log(x === "5"); // false

    ```


    ## 2.3 JavaScript 表达式


    表达式是值、变量和运算符的组合，用于产生结果。它们可以简单到单个值，也可以复杂到多个运算符和变量的组合。理解表达式对于编写动态交互的 JavaScript
    代码至关重要。


    ### 2.3.1 算术表达式


    算术表达式涉及使用算术运算符进行数学计算。这是一个算术表达式示例：


    ```javascript

    var x = 5;

    var y = 2;

    var result = (x + y) * 3;

    console.log(result); // 21

    ```


    在这个示例中，表达式 `(x + y) * 3` 执行加法和乘法产生结果 21。


    ### 2.3.2 字符串拼接


    在 JavaScript 中，`+` 运算符也用于字符串拼接。它允许你将两个或多个字符串合并为一个字符串。这是一个示例：


    ```javascript

    var firstName = "John";

    var lastName = "Doe";

    var fullName = firstName + " " + lastName;

    console.log(fullName); // "John Doe"

    ```


    在这种情况下，`+` 运算符拼接了 `firstName`、一个空格字符和 `lastName` 的值以形成全名。


    ### 2.3.3 逻辑表达式


    逻辑表达式涉及使用逻辑运算符（`&&`, `||`, `!`）执行逻辑操作。它们通常用于条件语句中评估多个条件。这是一个示例：


    ```javascript

    var x = 5;

    var y = 10;

    var result = (x > 3) && (y < 15);

    console.log(result); // true

    ```


    在这个示例中，逻辑表达式 `(x > 3) && (y < 15)` 评估两个条件是否都真并返回 `true`。


